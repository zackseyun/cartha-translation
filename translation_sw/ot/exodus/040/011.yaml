  yaml_path: translation/ot/exodus/040/011.yaml
  text: You shall anoint the basin and its stand[b][a], and consecrate it.
translation:
  language: sw
  text: Na utalipaka mafuta beseni na msingi wake,[a] na kuliweka wakfu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kitako chake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: Nawe utaipaka mafuta
  rationale: Katika muktadha wa ibada, משׁח humaanisha kupaka mafuta ili kuweka kitu wakfu kwa matumizi matakatifu. Muundo huu ni wa kawaida na wazi katika Kiswahili; kiunganishi וּ kimetolewa kama “Nawe” ili kuendeleza mfululizo wa maagizo.
- source_word: הַכִּיֹּר
  choice: beseni
  rationale: כִּיּוֹר ni chombo kikubwa cha kunawia katika huduma ya Maskani. “Beseni” ni neno la sasa na linaloeleweka kuliko istilahi za kale.
- source_word: כַּנּוֹ
  choice: kinara chake
  rationale: כֵּן hapa ni sehemu inayolishikilia au kulitegemeza beseni. “Kinara” linaeleza kitu cha kusimamishia; “msingi” pia linawezekana na limetajwa katika tanbihi.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: na kulitakasa
  rationale: Katika Piel, קדשׁ hapa ni kukitenga kitu kwa matumizi matakatifu. “Kulitakaasa” huhifadhi lugha ya ibada bila kudokeza mabadiliko ya kimaadili. Kiwakilishi cha umoja wa ngeli ya beseni kinafuata אֹתוֹ, huku kinara kikieleweka kuwa sehemu ya kifaa hicho.
theological_decisions:
- issue: Maana ya קדשׁ katika muktadha wa vyombo vya Maskani
  choice: kulitakasa
  alternative: kuliweka wakfu / kulifanya takatifu
  rationale: Muktadha unahusu kulitenga beseni kwa huduma takatifu, si kulibadili kimaadili. “Kulitakaasa” ni lugha ya kawaida ya kibiblia na huhifadhi wazo hilo la kiibada.
- issue: Kirejewa cha kiwakilishi cha umoja אֹתוֹ
  choice: “kulitakasa,” kikirejelea beseni kama kifaa kikuu pamoja na kinara chake
  alternative: kuvitakasa, kikifanya beseni na kinara kuwa vitu viwili vinavyotajwa moja kwa moja
  rationale: Kiebrania kina kiwakilishi cha umoja wa kiume kinachorejelea kwa kawaida כִּיֹּר, huku kinara chake kikichukuliwa kuwa sehemu ya kifaa hicho. Tafsiri ya umoja inalinda umbo la chanzo bila kutenganisha vitu hivyo kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Beseni” limetumiwa badala ya istilahi ya kale; “kinara” linaonyesha sehemu inayolitegemeza. Alama ya tanbihi imewekwa mara tu baada ya kirai kinachohusika.
