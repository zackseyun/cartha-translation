revisions:
- from: Nawe utaipaka mafuta beseni na kinara chake,[a] na kulitakasa.
  to: Na utalipaka mafuta beseni na msingi wake,[a] na kuliweka wakfu.
  rationale: The revision corrects the support/base term, avoids importing the distinct meaning “lampstand,” and uses a clear cultic rendering for consecration. The singular object in “kuliweka wakfu” preserves the Hebrew singular reference to the basin, with its base understood as part of the furnishing.
