base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/013.yaml
  text: And you shall clothe Aaron with the holy garments[a], and you shall anoint him and consecrate him, and he shall serve as priest to me.
translation:
  language: sw
  text: Nawe utamvika Aroni mavazi matakatifu, utamtia mafuta na kumweka wakfu; naye atanitumikia kama kuhani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili anitumikie kama kuhani.” Kitenzi cha Kiebrania humaanisha kutenda au kuhudumu katika cheo cha kuhani, na hapa kinaweza kueleweka kuwa matokeo au kusudi la matendo yaliyotangulia.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: utamvika
  rationale: Hifili ya לבשׁ ina maana ya kumvalisha mtu; “utamvika” ni Kiswahili cha kawaida na huonyesha wazi kwamba Musa ndiye atakayemvika Aroni.
- source_word: אַהֲרֹן
  choice: Aroni
  rationale: Hili ndilo umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: mavazi matakatifu
  rationale: Kirai hiki kihalisi ni “mavazi ya utakatifu.” “Mavazi matakatifu” ni cha asili katika Kiswahili na kinadumisha maana ya mavazi yaliyotengwa kwa huduma takatifu.
- source_word: וּמָשַׁחְתָּ
  choice: utamtia mafuta
  rationale: Katika muktadha wa kumweka kuhani katika huduma, משׁח humaanisha kumpaka au kumtia mafuta kwa desturi maalumu. “Kumtia mafuta” ni wazi na cha kawaida katika Kiswahili cha Biblia.
- source_word: וְקִדַּשְׁתָּ
  choice: kumweka wakfu
  rationale: Pieli ya קדשׁ hapa inamaanisha kumtenga kwa huduma takatifu. “Kumweka wakfu” linaeleza tendo hilo bila kulichanganya na kupakwa mafuta.
- source_word: וְכִהֵן
  choice: naye atanitumikia kama kuhani
  rationale: Kitenzi כהן humaanisha kutenda au kuhudumu katika cheo cha kuhani. Tafsiri hii huhifadhi huduma ya kikuhani na mtiririko wa kishazi cha Kiebrania.
- source_word: לִי
  choice: atanitumikia
  rationale: Kiambishi cha yambwa “-ni-” katika “atanitumikia” huonyesha kwa njia ya asili kwamba huduma hiyo inaelekezwa kwa Mungu, sawa na לִי, “kwangu.”
theological_decisions:
- issue: Lugha ya kumweka Aroni katika huduma ya ukuhani
  choice: Kutofautisha kumtia mafuta na kumweka wakfu kama matendo mawili yanayohusiana lakini si kitu kimoja.
  alternative: Kuyajumlisha kwa usemi mmoja kama “kumweka rasmi kuwa kuhani.”
  rationale: 'Kiebrania kinataja hatua tofauti: kumvika, kumtia mafuta, kumweka wakfu, kisha huduma ya kikuhani. Kuzihifadhi huepuka kuingiza istilahi za baadaye za kidhehebu.'
- issue: Nguvu ya וְכִהֵן לִי
  choice: “naye atanitumikia kama kuhani” kama matokeo yanayofuata matendo yaliyotangulia.
  alternative: “ili anitumikie kama kuhani” kama kusudi lililoelezwa wazi.
  rationale: Kitenzi cha nafsi ya tatu baada ya mfululizo wa vitenzi vya nafsi ya pili kinaweza kuonyesha matokeo au kusudi. Matini kuu inafuata kwa karibu muundo wa kuratibu wa Kiebrania, huku tanbihi ikihifadhi uwezekano wa maana ya kusudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. “Mavazi matakatifu,” “kumtia mafuta,” na “kumweka wakfu” hudumisha msamiati wa ibada bila kuwa wa dhehebu fulani. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
