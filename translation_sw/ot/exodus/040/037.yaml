  text: But if the cloud did not rise[a], they did not set out until the day it rose.
translation:
  language: sw
  text: Lakini kama lile wingu halikuinuka[a], hawakuondoka mpaka siku ambayo lilipoinuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya moja kwa moja zaidi, “mpaka siku ya kuinuka kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini kama
  rationale: Muunganiko huu unaanzisha hali inayotofautiana na mstari uliotangulia; “Lakini kama” ni wa kawaida na huhifadhi mtiririko huo.
- source_word: לֹא יֵעָלֶה
  choice: halikuinuka
  rationale: Kitenzi עלה kina maana ya kwenda juu au kuinuka; katika muktadha wa wingu juu ya Maskani, “kuinuka” ni wazi na hakiongezi wazo la mtendaji mwingine.
- source_word: הֶעָנָן
  choice: lile wingu
  rationale: Kiashiria “lile” kinawakilisha uainisho wa Kiebrania na kurejelea wingu lililotajwa tayari katika muktadha.
- source_word: וְלֹא יִסְעוּ
  choice: hawakuondoka
  rationale: נסע katika muktadha wa kambi humaanisha kuanza safari au kuondoka; “hawakuondoka” ni Kiswahili cha kawaida na chenye maana sahihi hapa.
- source_word: עַד יוֹם
  choice: mpaka siku
  rationale: Tafsiri hii huhifadhi neno המפורשת “siku” badala ya kulipanua kuwa “wakati.”
- source_word: הֵעָלֹתוֹ
  choice: lilipoinuka
  rationale: Ingawa muundo halisi ni nomino-kitenzi yenye maana ya “kuinuka kwake,” kishazi “lilipoinuka” ni cha asili katika Kiswahili; kiambishi cha ngeli kinarejelea wingu.
