base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/020.yaml
  text: Then he took the testimony and put it into the ark[a], and he set the poles on the ark[b], and he placed the mercy seat on the ark above.
translation:
  language: sw
  text: Kisha akachukua Ushuhuda na kuuweka ndani ya sanduku[a], akaweka fito kwenye sanduku, kisha akaweka kifuniko cha upatanisho[b] juu ya sanduku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vibao vya Ushuhuda.” Katika Kiebrania, “Ushuhuda” ni istilahi maalumu kwa kile kilichowekwa ndani ya sanduku.
    reason: lexical_alternative
  - marker: b
    text: Au “kiti cha rehema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדֻת
  choice: Ushuhuda
  rationale: Neno hili ni istilahi maalumu ya ibada kwa ushuhuda wa agano uliowekwa ndani ya sanduku, yaelekea vibao vya mawe. Kutaja “Ushuhuda” kunadumisha istilahi ya Kiebrania bila kufafanua zaidi ya maandishi.
- source_word: הָאָרֹן
  choice: sanduku
  rationale: Katika muktadha huu אָרוֹן ni sanduku takatifu. “Sanduku” ni neno la kawaida na wazi la Kiswahili, bila kuongeza “la Agano,” ambayo haimo katika mstari huu.
- source_word: הַבַּדִּים
  choice: miti ya kulibebea sanduku
  rationale: Hizi ni fito au miti iliyotumiwa kulibeba sanduku. Usemi huu unaeleweka kwa urahisi katika Kiswahili cha sasa na unaonyesha kazi yake.
- source_word: הַכַּפֹּרֶת
  choice: kifuniko cha upatanisho
  rationale: Neno hili linataja kifuniko maalumu cha dhahabu juu ya sanduku chenye umuhimu wa ibada. “Kifuniko cha upatanisho” kinaonyesha kitu chenyewe na maana yake ya kiibada bila kukifanya kuwa kifuniko cha kawaida tu.
- source_word: מִלְמָעְלָה
  choice: juu ya sanduku
  rationale: Katika muktadha huu usemi unaonyesha mahali kifuniko kilipowekwa, yaani upande wa juu wa sanduku. Kiswahili hiki ni cha kawaida na wazi.
- source_word: וַיִּתֵּן ... אֶל
  choice: kuuweka ndani ya
  rationale: Katika tendo hili la kimwili, נתן pamoja na אֶל humaanisha kuweka kitu ndani ya kitu kingine.
- source_word: וַיָּשֶׂם ... עַל
  choice: akatia ... mahali pake
  rationale: Kitenzi kinaeleza kuweka miti hiyo kwenye sanduku katika nafasi iliyokusudiwa. “Mahali pake” hutoa Kiswahili cha kawaida bila kudokeza kuwa miti iliwekwa juu ya kifuniko.
theological_decisions:
- issue: Kitu kinachorejelewa na “Ushuhuda”
  choice: Istilahi ya ibada kwa ushuhuda wa agano uliowekwa ndani ya sanduku, yaelekea vibao vya mawe, bila kuutaja wazi kuwa vibao.
  alternative: Kutafsiri moja kwa moja “vibao vya Ushuhuda” au “vibao vya agano.”
  rationale: Mstari unaeleza kitu halisi kinachowekwa ndani ya sanduku, lakini Kiebrania kinatumia עֵדוּת, si neno la “vibao.” Tafsiri inadumisha mvutano huo.
- issue: Tafsiri ya כַּפֹּרֶת
  choice: kifuniko cha upatanisho
  alternative: kiti cha rehema; kifuniko
  rationale: Hiki ni kifuniko maalumu cha sanduku chenye kazi na maana ya kiibada. “Kifuniko cha upatanisho” ni wazi kwa msomaji wa sasa na hakipunguzi neno hilo kuwa kifuniko cha kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imegawanywa kwa urahisi wa kusoma; “Ushuhuda” umeandikwa kwa herufi kubwa kuonyesha matumizi yake kama istilahi maalumu katika muktadha huu.
