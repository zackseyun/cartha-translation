base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/009.yaml
  text: Then you shall take the anointing oil and anoint the tabernacle and all that is in it[a], and you shall consecrate it and all its furnishings[b], and it shall be holy.
translation:
  language: sw
  text: Kisha utachukua mafuta ya upako[a], na utaipaka maskani na vyote vilivyomo ndani yake mafuta hayo. Utaifanya iwe wakfu, pamoja na vifaa vyake vyote, nayo itakuwa takatifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa uhalisi zaidi: “mafuta ya kutiwa wakfu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “takatifu”; si “takatifu sana.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Kisha utachukua
  rationale: Kitenzi cha Kiebrania chenye kiunganishi kinaendeleza mfululizo wa maagizo. “Kisha” huonyesha hatua inayofuata, na “utachukua” huhifadhi nguvu ya agizo.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: mafuta ya upako
  rationale: Hili ni neno la kawaida na linaloeleweka kwa mafuta yaliyotengwa kwa tendo la kupaka wakfu; pia linafuata kwa karibu muundo wa kirai cha Kiebrania.
- source_word: וּמָשַׁחְתָּ
  choice: na kuipaka mafuta
  rationale: Katika muktadha wa ibada, משׁח humaanisha kupaka mafuta kwa kusudi la kuweka kitu wakfu. Kiswahili hiki ni cha asili na kinaonyesha wazi tendo lenyewe.
- source_word: הַמִּשְׁכָּן
  choice: maskani
  rationale: “Maskani” ni istilahi iliyokubalika katika Kiswahili cha Biblia kwa mahali patakatifu pa kukutania jangwani, huku ikihifadhi wazo la mahali pa kukaa.
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: vyote vilivyomo ndani yake
  rationale: Tafsiri hii inajumuisha vitu vyote vilivyokuwa ndani ya maskani bila kuvibainisha zaidi ya maandishi ya asili.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: Utaiweka wakfu
  rationale: Katika Piel, קדשׁ hapa ni kutenga kwa matumizi matakatifu. “Kuweka wakfu” ni wazi na ya heshima, na haidokezi tu utakaso kutokana na uchafu.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: pamoja na vifaa vyake vyote
  rationale: כֵּלִים ni neno pana linaloweza kumaanisha vyombo, zana, au vifaa. “Vifaa” linafaa kwa jumla ya vitu vya maskani bila kulibana kuwa vyombo pekee.
- source_word: וְהָיָה קֹדֶשׁ
  choice: nayo itakuwa takatifu
  rationale: Kirai kinaeleza hali ya utakatifu inayofuata kuwekwa wakfu. “Takatifu” hutafsiri קֹדֶשׁ bila kuongeza kiwango cha ‘takatifu sana.’
theological_decisions:
- issue: Hadhi ya maskani baada ya kupakwa mafuta na kuwekwa wakfu
  choice: Maskani itakuwa takatifu.
  alternative: Maskani itakuwa takatifu sana.
  rationale: Maandishi yana קֹדֶשׁ, “takatifu,” wala si קֹדֶשׁ קָדָשִׁים, “takatifu sana/takatifu kuliko vyote.” Tafsiri haiongezi kiwango cha utakatifu ambacho aya hii haisemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Sentensi mbili zimetumiwa ili mfululizo wa maagizo usomeke kwa urahisi. Viwakilishi vya ngeli ya maskani vinadumishwa kwa uthabiti.
