- from: Kisha utachukua mafuta ya upako[a] na kuipaka mafuta maskani pamoja na vyote vilivyomo ndani yake. Utaiweka wakfu pamoja na vifaa vyake vyote, nayo itakuwa takatifu.[b]
  to: Kisha utachukua mafuta ya upako[a], na utaipaka maskani na vyote vilivyomo ndani yake mafuta hayo. Utaifanya iwe wakfu, pamoja na vifaa vyake vyote, nayo itakuwa takatifu.[b]
  rationale: Marekebisho yanaondoa utata wa kisintaksia kuhusu kupaka maskani na vilivyomo mafuta, huku yakihifadhi walengwa wote wawili wa וּמָשַׁחְתָּ na כָּל אֲשֶׁר בּוֹ. “Utaifanya iwe wakfu” hurejelea maskani, na “pamoja na vifaa vyake vyote” hubeba kiunganishi cha Kiebrania kinachojumuisha vifaa katika kuwekwa wakfu. Hitimisho “nayo itakuwa takatifu” husalia bila kusisitiza utakatifu zaidi ya ulio katika קֹדֶשׁ.
