translation:
  language: sw
  text: Na utawaleta wanawe karibu, na kuwavika makanzu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utawaleta mbele” au “utawasilisha”; kitenzi cha Kiebrania mara nyingi huwa na maana rasmi ya kumleta mtu karibu kwa ajili ya huduma takatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Nawe
  rationale: Kiunganishi pamoja na kiashiria cha yambwa kinaendeleza mfululizo wa maagizo; Kiswahili hakihitaji kutafsiri kiashiria cha yambwa moja kwa moja.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania humaanisha wana wa kiume, na hapa linawahusu wana wa Haruni katika muktadha wa ukuhani.
- source_word: תַּקְרִיב
  choice: utawaleta ... karibu
  rationale: Hifili ya קרב ina maana ya kuwaleta karibu au kuwasogeza mbele, mara nyingi kwa huduma takatifu; muundo huu unahifadhi wazo la kukaribia bila kulifafanua kupita maandishi.
- source_word: וְהִלְבַּשְׁתָּ
  choice: na kuwavika
  rationale: Kitenzi kina maana ya kuwafanya wavae; “kuwavika” ni Kiswahili cha kawaida, kifupi, na kinachohifadhi hali ya kisababishi.
- source_word: אֹתָם
  choice: -wa-
  rationale: Kiambishi cha yambwa katika “kuwavika” kinawarejelea wanawe kwa kawaida katika Kiswahili.
- source_word: כֻּתֳּנֹת
  choice: kanzu
  rationale: Neno humaanisha vazi la mwilini kama kanzu; “kanzu” ni istilahi inayoeleweka katika Kiswahili, bila kuongeza kwamba lilikuwa la kitani, jambo ambalo halijasemwa katika mstari huu.
theological_decisions:
- issue: Dokezo la kikuhani/kibada katika קרב
  choice: utawaleta ... karibu
  alternative: utawaleta mbele / utawasilisha
  rationale: Muktadha ni kuwekwa kwa wana wa Haruni katika huduma ya ukuhani. “Kuwaleta karibu” huhifadhi maana ya msingi na dokezo la kuwaendeza kwenye huduma takatifu bila kulazimisha tafsiri maalumu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata mtiririko wa agizo la Kiebrania; tanbihi huhifadhi uwezekano wa maana rasmi ya kikuhani.
