  yaml_path: translation/ot/exodus/040/024.yaml
  text: He placed the lampstand in the tent of meeting[a], opposite the table, on the south side of the tabernacle.
translation:
  language: sw
  text: Akaweka kinara cha taa ndani ya hema la kukutania, mkabala na meza[a], upande wa kusini wa maskani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikielekeana na meza.” Neno la Kiebrania נֹכַח linaweza kuonyesha nafasi iliyo mkabala au mbele ya kitu.
    reason: mbadala wa kileksika
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Akaweka
  rationale: Kitenzi cha masimulizi kinaonyesha tendo lililokamilika katika mfuatano; “akaweka” ni cha kawaida na kinafaa kwa upangaji wa vifaa vya maskani.
- source_word: הַמְּנֹרָה
  choice: kinara cha taa
  rationale: Neno hili humaanisha kinara cha ibada kilichobeba taa, si taa moja tu; tafsiri hii inaeleweka wazi kwa wasomaji wa Kiswahili.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: ndani ya hema la kukutania
  rationale: Hili ni jina la mahali patakatifu pa kukutana; “hema la kukutania” ni usemi wa kawaida, wazi, na wenye heshima katika Kiswahili cha Biblia.
- source_word: נֹכַח הַשֻּׁלְחָן
  choice: mkabala na meza
  rationale: נֹכַח hapa huonyesha nafasi iliyoelekeana au iliyo upande wa pili wa kitu; “mkabala na” huhifadhi maana hiyo ya mahali bila maelezo ya ziada.
- source_word: הַשֻּׁלְחָן
  choice: meza
  rationale: Kiebrania kinasema tu “meza”; maelezo kama “meza ya mikate” hayajaongezwa kwa kuwa hayapo katika mstari huu.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן
  choice: upande ... wa maskani
  rationale: יֶרֶךְ kwa maana ya mahali ni ubavu au upande; pamoja na נֶגְבָּה, Kiswahili cha kawaida husema “upande wa kusini wa maskani.”
- source_word: נֶגְבָּה
  choice: kusini
  rationale: Umbo hili la mwelekeo linaonyesha mahali au upande wa kusini; katika muundo huu “upande wa kusini” ni wa asili zaidi.
- source_word: הַמִּשְׁכָּן
  choice: maskani
  rationale: Ingawa mzizi wake unahusiana na kukaa, katika Kutoka neno hili ni jina la jengo takatifu linalohamishika; “maskani” ni istilahi iliyozoeleka na sahihi katika Kiswahili cha Biblia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa maandiko. Tafsiri ni wazi kwa msomaji wa kawaida na inadumisha istilahi za mahali patakatifu bila kuongeza ufafanuzi usiomo katika Kiebrania. Hakuna tanbihi iliyowekwa kwa sababu “mkabala na” inabeba ipasavyo wigo wa nafasi wa נֹכַח; tanbihi ya Kiingereza inayosema “facing the table” ni karibu sawa kimaana na si lazima katika Kiswahili.
