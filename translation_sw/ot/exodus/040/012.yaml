  text: Kisha uwalete Haruni na wanawe karibu na mwingilio wa Hema la Kukutania, na uwaoshe kwa maji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: uwalete ... karibu
  rationale: Kauli ya kusababisha ya kitenzi קרב ina maana ya kuwafanya wakaribie au kuwaleta karibu. Tafsiri hii inadumisha maana hiyo na muktadha wa ibada.
- source_word: אַהֲרֹן
  choice: Haruni
  rationale: Jina limetolewa kwa umbo la Kiswahili lililozoeleka katika tafsiri za Biblia.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania linamaanisha wana wake wa kiume; umbo hili ni la kawaida na linafaa katika muktadha wa ukuhani.
- source_word: פֶּתַח
  choice: mwingilio
  rationale: Neno hili hutaja sehemu ya kuingilia katika jengo au hema; ‘mwingilio’ ni la asili na sahihi hapa.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Hili ni jina la Kiswahili lililozoeleka kwa mahali patakatifu pa kukutana, nalo linadumisha maana ya muundo wa Kiebrania.
- source_word: וְרָחַצְתָּ
  choice: uwaoshe
  rationale: Kitenzi רחץ kinamaanisha kuosha. ‘Uwaoshe’ hakiongezi namna maalumu ya tendo ambayo maandishi hayakutaja.
- source_word: אֹתָם
  choice: wa-
  rationale: Kiambishi cha yambwa ‘wa-’ kinawarejelea Haruni na wanawe kwa pamoja kwa Kiswahili cha kawaida.
- source_word: בַּמָּיִם
  choice: kwa maji
  rationale: Kihusishi ב hapa kinaeleweka kwa maana ya chombo kinachotumiwa kuosha; ‘kwa maji’ ni usemi wa kawaida wa Kiswahili.
