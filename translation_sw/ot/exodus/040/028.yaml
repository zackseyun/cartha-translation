lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Akaweka
  rationale: Kitenzi שׂוּם humaanisha kuweka au kusimamisha. “Akaweka” kinafuata maana ya msingi bila kuongeza wazo la kutundika, ambalo halijasemwa wazi katika chanzo.
- source_word: מָסַךְ
  choice: pazia
  rationale: Katika muktadha wa maskani, neno hili humaanisha kitambaa cha kufunika sehemu ya kuingilia. “Pazia” ni neno la kawaida na la asili katika Kiswahili cha sasa, huku tanbihi ikihifadhi maana mbadala ya kitu cha kusitiri.
- source_word: הַפֶּתַח
  choice: mwingilio
  rationale: Neno פֶּתַח linaweza kumaanisha nafasi iliyo wazi, mlango, au sehemu ya kuingilia. “Mwingilio” linaonyesha kwa usahihi sehemu ya kuingia bila kudokeza lazima mlango mgumu wenye bawaba.
- source_word: לַמִּשְׁכָּן
  choice: wa maskani
  rationale: 'Kiambishi ל kinahusishwa hapa na mwingilio: yaani, mwingilio wa maskani. “Maskani” ni istilahi iliyozoeleka katika tafsiri za Kutoka kwa hema takatifu la kukutania.'
