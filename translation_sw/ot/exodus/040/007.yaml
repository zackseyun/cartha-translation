  yaml_path: translation/ot/exodus/040/007.yaml
  text: And you shall place the basin between the tent of meeting and the altar[a], and you shall put water there.
translation:
  language: sw
  text: Nawe utaliweka birika[a] kati ya Hema la Kukutania na madhabahu, nawe utaweka maji humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania כִּיּוֹר linamaanisha chombo kikubwa cha kuoshea, ambacho pia huweza kuitwa beseni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Nawe utaliweka
  rationale: Kitenzi נתן kina maana pana ya ‘kutoa, kuweka, kutia.’ Katika agizo hili la kupanga kifaa mahali fulani, ‘utaliweka’ ni Kiswahili cha kawaida na kinaonyesha uwekaji wa makusudi.
- source_word: הַכִּיֹּר
  choice: birika
  rationale: כִּיּוֹר ni chombo kikubwa cha kuoshea kilichotumiwa katika huduma ya hema. ‘Birika’ ni istilahi ya Kiswahili iliyoeleweka katika muktadha huu na ni sahihi kuliko neno la jumla ‘beseni.’
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: kati ya hema la kukutania na madhabahu
  rationale: Muundo בֵּין...וּבֵין unaonyesha nafasi iliyopo baina ya vitu viwili. ‘Hema la kukutania’ ni tafsiri wazi ya אֹהֶל מוֹעֵד, nayo ‘madhabahu’ inatafsiri מִזְבֵּחַ bila kuongeza maelezo yasiyokuwapo katika aya.
- source_word: וְנָתַתָּ שָׁם מָיִם
  choice: nawe utaweka maji humo
  rationale: Kiebrania kinasema kihalisi ‘nawe utaweka huko maji.’ ‘Humo’ ni Kiswahili cha asili kinachorejelea birika lililowekwa mahali hapo, bila kubadili kusudi la שָׁם.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wazi, na wa kisasa. ‘Nawe’ huhifadhi muunganisho wa וְ pamoja na mhusika wa nafsi ya pili wa kiume katika muktadha wa maagizo. Alama ya tanbihi [a] imewekwa baada ya ‘madhabahu’ kwa kufuata safu ya mashauriano, ingawa tanbihi yenyewe inafafanua ‘birika.’
