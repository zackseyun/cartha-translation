translation:
  language: sw
  text: Akaweka meza ndani ya Hema la Kukutania, upande wa kaskazini wa Maskani, nje ya pazia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nje ya pazia.” Neno la Kiebrania פָּרֹכֶת humaanisha pazia la ndani lililotenga Patakatifu pa Patakatifu.
    reason: Hutoa mbadala wa kileksika na kufafanua kwa ufupi pazia linalorejelewa.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Akaweka
  rationale: Katika maelezo ya kupanga vitu mahali pake, kitenzi נתן kina maana ya kuweka; “akaweka” ni cha kawaida na huendeleza mfululizo wa simulizi.
- source_word: הַשֻּׁלְחָן
  choice: meza
  rationale: Kiebrania kinasema tu “meza” yenye kibainishi; maelezo kama “meza ya mikate” hayajaongezwa kwa kuwa hayamo katika mstari huu.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: ndani ya hema la kukutania
  rationale: Hili ni jina linaloeleweka la mahali patakatifu; “ndani ya” huonyesha wazi nafasi ya meza katika hema.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן צָפֹנָה
  choice: upande wa kaskazini wa Maskani
  rationale: יֶרֶךְ hapa ni upande au ubavu, na צָפֹנָה huonyesha upande wa kaskazini. Kauli hii ni ya asili katika Kiswahili na inadumisha maelezo ya mahali.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: “Maskani” ni istilahi inayotambulika katika muktadha wa jengo takatifu la Kutoka na pia huhifadhi wazo la mahali pa kukaa lililomo katika מִשְׁכָּן.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: nje ya pazia
  rationale: מִחוּץ huonyesha kuwa kitu kiko nje ya mpaka fulani, na פָּרֹכֶת ni pazia la ndani lililotenganisha sehemu takatifu zaidi. “Pazia” ni neno la kawaida na sahihi katika Kiswahili.
