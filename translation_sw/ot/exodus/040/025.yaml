  text: Akaziweka taa mbele za Yahwe[a], kama vile Yahwe alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “akazifanya taa zipande”; usemi huu unaweza kumaanisha kuziweka au kuziwasha.'
