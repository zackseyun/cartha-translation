lexical_decisions:
- source_word: וַיַּעַל
  choice: akaweka
  rationale: Hifili ya עלה ni kihalisi ‘kusababisha zipande’; katika muktadha wa taa za maskani inaweza kumaanisha kuziweka au kuziwasha. ‘Akaweka’ ni ya asili katika Kiswahili na haibani maana kuwa kuwasha pekee.
- source_word: הַנֵּרֹת
  choice: taa
  rationale: נֵרֹת ni taa halisi za kinara, si nuru kwa maana ya jumla.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huhifadhi maana ya mahali na ibada ya לִפְנֵי huku ikitumia usemi wa kawaida wa Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Huonyesha kuwa tendo lililingana na agizo lililotangulia.
- source_word: צִוָּה
  choice: alivyokuwa amemwagiza
  rationale: Wakati timilifu unaonyesha agizo lililotangulia tendo la simulizi; ‘alivyokuwa amemwagiza’ huwasilisha mfuatano huo kwa Kiswahili cha asili.
- source_word: אֶת מֹשֶׁה
  choice: Musa
  rationale: Musa ndiye mtendewa wa kitenzi ‘kuagiza’; kiambishi cha yambwa katika ‘amemwagiza’ kinaonyesha uhusiano huo kwa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה. ‘Yahwe’ huhifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Tendo linalohusu taa
  choice: akaweka
  alternative: akaziwasha
  rationale: וַיַּעַל inaweza katika muktadha huu kurejelea kuweka au kuwasha taa. Tafsiri kuu haifungi maana kwa ‘kuwasha,’ na tanbihi huhifadhi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa moja kwa moja. ‘Mbele za’ huhifadhi ladha ya kiibada, na ‘Yahwe’ hutumiwa kama jina binafsi.
