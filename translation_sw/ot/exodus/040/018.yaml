base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/018.yaml
  text: So Moses set up the tabernacle[a], and placed its bases, and set its frames, and put in its bars[c][b], and raised up its pillars.
translation:
  language: sw
  text: Basi Musa akasimamisha Maskani; akaweka misingi yake[a], akasimamisha mbao zake[b], akatia mataruma yake, na akasimamisha nguzo zake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “soketi zake,” yaani vipande vya msingi ambavyo mbao za Maskani ziliingizwa ndani yake.
    reason: lexical_alternative
  - marker: b
    text: Au “fremu zake” au “mabamba yake.” Neno la Kiebrania linaweza kumaanisha mbao, lakini hapa linarejelea vipande vya wima vya muundo wa Maskani.
    reason: lexical_alternative
  - marker: c
    text: Au “nguzo za wima” au “mihimili yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: akalisimamisha / akasimamisha
  rationale: Hifili ya קום humaanisha kusababisha kitu kisimame. “Kusimamisha” ni ya kawaida na inafaa katika muktadha wa kuunganisha jengo hilo.
- source_word: הַמִּשְׁכָּן
  choice: Hema la Kukutania
  rationale: מִשְׁכָּן kihalisi ni makao, lakini hapa ni patakatifu pa kubebeka palipojulikana katika Kutoka. “Hema la Kukutania” ni istilahi ya Biblia inayoeleweka katika Kiswahili, ingawa inaunganisha kwa matumizi ya kawaida dhana ya maskani na hema takatifu.
- source_word: אֲדָנָיו
  choice: matako yake
  rationale: אֶדֶן ni vipande vya msingi vyenye nafasi za kushikilia mbao. “Matako” ni istilahi ya ujenzi inayotumiwa katika Kiswahili cha Biblia kwa vihimili hivyo vya chini; tanbihi inafafanua kazi yake.
- source_word: קְרָשָׁיו
  choice: mbao zake
  rationale: קֶרֶשׁ hurejelea mbao au vipande vya wima vya jengo. “Mbao” huhifadhi umbo halisi la vifaa hivyo bila kuingiza dhana pana zaidi ya fremu.
- source_word: בְּרִיחָיו
  choice: mataruma yake
  rationale: בְּרִיחַ ni pau za mlalo zilizoshikilia mbao pamoja. “Mataruma” hueleza vipande hivyo vya kuunganisha katika lugha ya ujenzi.
- source_word: עַמּוּדָיו
  choice: nguzo zake
  rationale: עַמּוּד ni tegemezo la wima; “nguzo” ni neno la kawaida, lenye heshima na sahihi kimuundo.
- source_word: וַיָּשֶׂם
  choice: akasimamisha
  rationale: Ingawa שׂוּם kwa kawaida ni kuweka, kwa mbao za wima “akasimamisha” ni Kiswahili cha asili na kinaonyesha kitendo cha kuziweka mahali pake.
- source_word: וַיִּתֵּן
  choice: akaweka / akatia
  rationale: 'נָתַן hapa ni kuweka kitu mahali pake. Kiswahili hutofautisha kwa kawaida kulingana na kitu: matako yanawekwa, na mataruma yanatiwa.'
