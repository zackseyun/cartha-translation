  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Vazi la kujikinga’ limetumiwa katika maandishi ili kuhifadhi kutokuwa na uhakika kwa neno adimu תַחְרָא; mbadala mahususi zaidi umetolewa katika tanbihi.
