  yaml_path: translation/ot/exodus/039/023.yaml
  text: And the opening of the robe was in the middle of it[a], like the opening of a coat of mail, with a binding around its opening, so that it would not be torn.
translation:
  language: sw
  text: Tundu la joho lilikuwa katikati yake, kama tundu la vazi la kujikinga[a]. Lilikuwa na ukingo kulizunguka ili lisichanike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama tundu la vazi la kivita,” au “kama tundu la dirii.” Neno la Kiebrania תַחְרָא ni adimu na linataja vazi la kujikinga, huenda aina fulani ya vazi la kivita.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי
  choice: tundu
  rationale: Katika muktadha wa vazi, neno hili linamaanisha tundu la kuingizia kichwa, si ‘kinywa’ halisi.
- source_word: הַמְּעִיל
  choice: joho
  rationale: מְעִיל ni vazi la nje; ‘joho’ ni neno la kawaida na lenye hadhi linalofaa kwa vazi hili la kikuhani.
- source_word: בְּתוֹכוֹ
  choice: katikati yake
  rationale: Kauli hii inaonyesha mahali tundu lilipowekwa ndani ya joho.
- source_word: כְּפִי תַחְרָא
  choice: kama tundu la vazi la kujikinga
  rationale: תַחְרָא ni neno adimu linaloelekea kutaja vazi la kinga au la kivita; tafsiri hii inadumisha maana ya jumla bila kudai kwa uhakika aina maalumu ya silaha.
- source_word: שָׂפָה
  choice: ukingo
  rationale: Maana ya msingi ni ‘mdomo/ukingo’; hapa ni mpaka ulioimarishwa wa tundu la vazi.
- source_word: לְפִיו סָבִיב
  choice: kulizunguka
  rationale: Inaonyesha kwamba ukingo ulizunguka tundu lote; kiwakilishi kinarejelea tundu lililotajwa.
- source_word: לֹא יִקָּרֵעַ
  choice: ili lisiraruke
  rationale: 'Niphal imperfect hapa inaeleza kusudi la ukingo: kuzuia tundu au joho lisiraruke.'
