base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/032.yaml
  text: Thus all the work of the tabernacle[a], the tent of meeting, was finished, and the sons of Israel did according to all that Yahweh had commanded Moses[b]; so they did.
translation:
  language: sw
  text: Basi kazi yote ya Maskani, yaani Hema la Kukutania, ikakamilika. Wana wa Israeli wakafanya sawasawa na yote ambayo Yahweh alikuwa amemwamuru Musa; ndivyo walivyofanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּכֶל
  choice: ikakamilika
  rationale: Kitenzi כלה hapa kinaonyesha kukamilika kwa mradi mzima; “ikakamilika” ni ya asili katika Kiswahili na hudumisha kazi kama kiima bila kutaja mtendaji.
- source_word: כָּל עֲבֹדַת
  choice: kazi yote
  rationale: Huhifadhi maana pana ya כָּל na kueleza shughuli yote ya kutengeneza Maskani, si huduma ya ibada hasa.
- source_word: מִשְׁכַּן
  choice: Maskani
  rationale: “Maskani” ni neno la Kiswahili linalofaa kwa mahali pa kukaa na limetumika kama jina la patakatifu pa kuhamishwa katika muktadha wa Kutoka.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Huhifadhi wazo la hema lililowekwa kwa ajili ya kukutana; herufi kubwa zinaonyesha kuwa ni jina la mahali patakatifu.
- source_word: וַיַּעֲשׂוּ
  choice: wakafanya
  rationale: עשה hapa inajumlisha utekelezaji wa maagizo yote, wala haimaanishi kutengeneza tu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Hufuata kwa karibu usemi wa kifamilia wa Kiebrania huku ukibaki wa kawaida na wenye kueleweka katika Kiswahili.
- source_word: כְּכֹל אֲשֶׁר
  choice: sawasawa na yote ambayo
  rationale: Hueleza ulinganifu kamili wa kazi yao na maagizo yaliyotolewa.
- source_word: צִוָּה
  choice: alikuwa amemwamuru
  rationale: Muundo huu unaonyesha kwa kawaida kwamba amri ilitangulia utekelezaji uliokamilika.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa kwa herufi YHWH badala ya kulibadilisha kuwa cheo.
- source_word: כֵּן עָשׂוּ
  choice: ndivyo walivyofanya
  rationale: Huhifadhi marudio ya Kiebrania yanayosisitiza utiifu wao kamili kwa maagizo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina la Mungu YHWH moja kwa moja. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Usemi wa kijamii בְּנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: “Wana wa Israeli” huonyesha wazi muundo wa kifamilia wa chanzo na wakati huohuo hutumika kwa taifa kwa ujumla.
- issue: Msisitizo wa utiifu katika כֵּן עָשׂוּ
  choice: 'marudio yamehifadhiwa: “ndivyo walivyofanya”'
  alternative: kuacha marudio kwa mtindo laini zaidi
  rationale: Marudio hayo ni sehemu ya msisitizo wa matini kwamba Israeli walitekeleza maagizo kama walivyoamriwa; kuyaondoa kungepunguza nguvu hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili kwa usomaji wa kawaida, huku marudio ya mwisho na mpangilio wa maana wa Kiebrania vikihifadhiwa. “Yaani” linafafanua uhusiano wa Maskani na Hema la Kukutania bila kudai tofauti ambayo matini haitoi.
