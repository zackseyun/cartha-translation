base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/041.yaml
  text: the garments of woven work for ministering in the sanctuary[a], the holy garments for Aaron the priest, and the garments of his sons for serving as priests.
translation:
  language: sw
  text: mavazi ya ufundi wa kusuka kwa ajili ya kuhudumu katika mahali patakatifu[a], mavazi matakatifu kwa ajili ya Haruni, kuhani, na mavazi ya wanawe ili wahudumu kama makuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mavazi ya huduma”; usemi wa Kiebrania huenda unarejelea nguo za pekee zilizotengenezwa kwa ufundi kwa ajili ya huduma katika mahali patakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי
  choice: mavazi
  rationale: Neno hili humaanisha nguo au mavazi; “mavazi” ni la kawaida, lenye heshima, na linafaa kwa mavazi ya kikuhani.
- source_word: הַשְּׂרָד
  choice: ya kazi ya ufumaji
  rationale: Katika muktadha wa maskani, neno hili linaelekea kurejelea kazi maalumu ya kitambaa. Tafsiri hii inadumisha wazo la ufundi bila kulifanya hakika kuliko Kiebrania kinavyoruhusu.
- source_word: לְשָׁרֵת
  choice: kwa ajili ya kuhudumu
  rationale: Kitenzi hiki huonyesha huduma rasmi, hasa katika mazingira matakatifu; “kuhudumu” kinahifadhi maana hiyo.
- source_word: בַּקֹּדֶשׁ
  choice: katika mahali patakatifu
  rationale: Hapa neno linarejelea eneo takatifu la huduma ya maskani, si utakatifu kama dhana tu.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: mavazi matakatifu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya jina la mavazi ya kikuhani yaliyowekwa wakfu.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: ya Haruni kuhani
  rationale: Muundo huu unamtaja Haruni kuwa mpokeaji wa mavazi na kuhifadhi cheo chake cha kuhani.
- source_word: בִּגְדֵי בָנָיו
  choice: mavazi ya wanawe
  rationale: Tafsiri hii ni ya asili katika Kiswahili na inadumisha uhusiano ulio katika Kiebrania.
- source_word: לְכַהֵן
  choice: kwa ajili ya kutumika kama makuhani
  rationale: Kitenzi hiki, kilichotokana na neno “kuhani,” humaanisha kufanya kazi ya ukuhani; usemi huu unaeleza maana hiyo wazi.
theological_decisions:
- issue: Tofauti kati ya בִּגְדֵי הַשְּׂרָד na בִּגְדֵי הַקֹּדֶשׁ
  choice: Kishazi cha kwanza kimetafsiriwa kama mavazi ya kazi maalumu ya ufumaji yaliyotumiwa katika huduma ya mahali patakatifu, kisha mavazi matakatifu ya Haruni na wanawe yakatajwa kando.
  alternative: Kuvichukulia vishazi hivyo kuwa karibu visawe na kutafsiri cha kwanza “mavazi ya huduma.”
  rationale: Kurudia kwa Kiebrania kunadokeza uwezekano wa makundi au majina tofauti. Tafsiri inahifadhi tofauti hiyo huku tanbihi ikionyesha maana mbadala bila kuzidisha uhakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha na urudiaji wa “mavazi” umehifadhiwa ili kuakisi Kiebrania; istilahi ya kwanza yenye utata imefafanuliwa kwa tanbihi.
