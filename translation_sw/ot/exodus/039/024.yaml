    text: Kiebrania kinataja nyenzo za rangi ya buluu, zambarau, na nyekundu nyangavu; neno “uliopindwa” hufafanua kazi ya nguo. Neno “uzi” limeongezwa kwa ajili ya uwazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Nao wakatengeneza
  rationale: Qal wayyiqtol ya nafsi ya tatu wingi inaendeleza simulizi; “wakatengeneza” ni ya kawaida na inafaa kwa mapambo yaliyofumwa.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: kwenye upindo wa joho
  rationale: עַל inaonyesha mahali, שׁוּלֵי ni sehemu za chini au upindo wa vazi, na מְעִיל ni joho la kikuhani.
- source_word: רִמּוֹנֵי
  choice: makomamanga[a]
  rationale: Kiebrania kinatumia tu jina la tunda, ingawa hapa linamaanisha mapambo yenye umbo la komamanga; tafsiri kuu inadumisha usemi huo mfupi.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: nyuzi za rangi ya buluu, zambarau na nyekundu
  rationale: Maneno haya yanataja vifaa vya nguo vyenye rangi; “nyuzi” imeongezwa kwa uwazi kutokana na muktadha wa utengenezaji wa mapambo.
- source_word: מָשְׁזָר
  choice: zilizosokotwa[b]
  rationale: Neno linaeleza kazi ya nyuzi zilizosokotwa au kusokota pamoja; umbo la wingi linapatana na “nyuzi.”
