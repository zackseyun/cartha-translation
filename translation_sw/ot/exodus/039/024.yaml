  text: Nao wakatengeneza makomamanga[a] ya uzi wa rangi ya buluu, zambarau, na nyekundu nyangavu, uliosokotwa[b], kwenye upindo wa joho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mapambo yenye umbo la komamanga.” Kiebrania kinasema tu “makomamanga,” kikitumia jina la kitu kutaja umbo lake.
