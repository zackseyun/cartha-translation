  terminology: “Bamba,” “taji takatifu,” “dhahabu safi,” na “Yahweh” zinafaa katika Kiswahili sanifu cha Afrika Mashariki. Tanbihi ya “Utakatifu kwa Yahweh” ni halali kwa kuwa קֹדֶשׁ inaweza kusomeka kama nomino ya dhahania.
