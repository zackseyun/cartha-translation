base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/030.yaml
  text: They made the plate[a], the holy crown, of pure gold, and they inscribed on it, like the engraving of a seal, “Holy to Yahweh.”
translation:
  language: sw
  text: 'Wakatengeneza bamba, taji takatifu, la dhahabu safi; wakaandika juu yake, kama vile muhuri unavyochongwa: “Takatifu kwa Yahweh.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Utakatifu kwa Yahweh.”
    reason: Kiebrania קֹדֶשׁ kinaweza kutafsiriwa kama kauli “takatifu” au kama nomino “utakatifu.”
lexical_decisions:
- source_word: צִיץ
  choice: bamba
  rationale: Katika muktadha wa mavazi ya kuhani, neno hili linamaanisha bamba la dhahabu lililofungwa kwenye kilemba; “bamba” ni neno wazi na la kawaida katika Kiswahili.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: taji takatifu
  rationale: נֵזֶר ni taji au kile kinachovaliwa kichwani kama ishara ya kuwekwa wakfu. Muundo “bamba, yaani taji takatifu” unahifadhi nomino zote mbili na uhusiano wao wa ufafanuzi.
- source_word: זָהָב טָהוֹר
  choice: kwa dhahabu safi
  rationale: Hii inaeleza nyenzo iliyotumiwa na kudumisha msisitizo wa ubora na usafi wa dhahabu.
- source_word: וַיִּכְתְּבוּ עָלָיו
  choice: wakaandika juu yake
  rationale: Kitenzi cha Kiebrania kimsingi ni “andika”; namna ya uandishi—kuchongwa—inaelezwa na kirai kinachofuata.
- source_word: מִכְתַּב פִּתּוּחֵי חוֹתָם
  choice: kwa maandishi yaliyochongwa kama muhuri
  rationale: Tafsiri hii ya asili inaonyesha kwamba maandishi yalichongwa kwa ustadi wa aina inayotumiwa kutengeneza muhuri.
- source_word: קֹדֶשׁ לַיהוָה
  choice: Takatifu kwa Yahweh
  rationale: Kauli fupi inalinda nguvu ya maandishi ya kuweka kitu wakfu bila kuifafanua kupita kiasi; uwezekano wa nomino dhahania umehifadhiwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina la agano moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Jinsi ya kutafsiri maandishi קֹדֶשׁ לַיהוָה
  choice: Takatifu kwa Yahweh
  alternative: Utakatifu kwa Yahweh
  rationale: קֹדֶשׁ inaweza kueleweka kama kauli ya kitu kilichowekwa wakfu au kama nomino “utakatifu.” Tafsiri kuu inadumisha ufupi wa maandishi, na tafsiri nyingine imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Yaani” inaonyesha wazi kwamba “taji takatifu” linafafanua bamba bila kuzifuta nomino hizo mbili. Tanbihi imewekwa baada ya maandishi yanayohusika moja kwa moja.
