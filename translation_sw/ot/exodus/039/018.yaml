  verdict: revise
  source_fidelity: 'Rasimu inawasilisha kwa usahihi mpangilio wa msingi wa Kiebrania: ncha mbili, minyororo miwili iliyosokotwa, vishikio viwili, vipande vya mabega vya efodi, na upande wa mbele. Hata hivyo, kiwakilishi katika “wakaviweka” kinaweza kisomeke kikirejelea “vikalio,” ilhali kiambishi cha Kiebrania katika וַיִּתְּנֻם ni cha wingi wa kiume na kwa kawaida hurejelea minyororo (עֲבֹתֹת), si vishikio/settings (מִּשְׁבְּצֹת, wingi wa kike).'
  naturalness: “Vikalio” si neno la kawaida wala lililo wazi katika Kiswahili cha kisasa kwa vifaa vya dhahabu vya kushikilia/kupachikia. “Vishikio” ni wazi zaidi katika muktadha huu. “Minyororo” pia ni msamiati wa kawaida na unaoeleweka zaidi kuliko “nyororo” kwa chainwork.
  terminology: “Efodi” na “vipande vya mabega” vinafaa. “Vishikio” huhifadhi maana ya settings/mountings bila kudai kwa uhakika kwamba ni “vya dhahabu”; kwa hiyo dokezo la rasimu linalosema “vya dhahabu” liondolewe, kwa kuwa mstari huu wenyewe hautaji dhahabu.
  issues:
