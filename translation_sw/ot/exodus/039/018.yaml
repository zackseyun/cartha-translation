  text: And they put the two ends of the two braided chains on the two settings[a], and put them on the shoulder pieces of the ephod[b], at its front.
translation:
  language: sw
  text: Nao wakaweka ncha mbili za minyororo miwili iliyosokotwa juu ya vishikio viwili, kisha wakaiweka minyororo hiyo kwenye vipande vya mabega vya efodi, upande wake wa mbele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְצוֹת
  choice: ncha
  rationale: Katika muktadha huu neno linamaanisha sehemu za mwisho za nyororo; “ncha” ni la kawaida na sahihi kwa Kiswahili.
- source_word: הָעֲבֹתֹת
  choice: nyororo ... zilizosokotwa
  rationale: Neno linarejelea kazi ya nyororo iliyosokotwa katika muktadha wa mapambo ya hema; usemi huu unaonyesha umbo lake lililotengenezwa bila kulifanya kuwa kamba tu.
- source_word: מִּשְׁבְּצֹת
  choice: vikalio
  rationale: Hivi ni vishikio au sehemu za dhahabu ambamo vitu vinawekwa; “vikalio” hudumisha maana ya artisan ya kitu kilichotengenezwa kuwa mahali pa kuweka au kushikilia.
- source_word: וַיִּתְּנֻם
  choice: wakaviweka
  rationale: Kitenzi נתן hapa kina maana pana ya kuweka; tafsiri hii haiongezi wazo mahsusi la kufunga ambalo halijasemwa wazi.
- source_word: כִּתְפֹת
  choice: vipande vya mabega
  rationale: Katika ujenzi wa efodi, neno linarejelea sehemu za vazi zinazokaa mabegani, si mabega ya mwili pekee.
- source_word: אֶל מוּל פָּנָיו
  choice: upande wake wa mbele
  rationale: Usemi unaonyesha mahali panapoelekea mbele ya efodi; kiwakilishi “wake” kinamrejelea efodi kwa namna ya asili katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. “Efodi” limehifadhiwa kama istilahi ya vazi la kikuhani. Muundo wa sentensi umefuata mlolongo wa Kiebrania huku ukiepuka ukakasi; kiwakilishi katika “wakaviweka” kinarejelea vile vikalio viwili, sawa na umbo la Kiebrania linaloweza kurejelea kitu cha karibu katika sentensi.
