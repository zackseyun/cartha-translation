    issue: Kirejeo cha “wakaviweka” hakiko wazi na ulinganifu wake wa ngeli unaelekeza kwa “vikalio.”
    rationale: Kitenzi cha Kiebrania kina kiambishi cha wingi wa kiume; tafsiri inapaswa kufafanua kwamba minyororo ndiyo inayowekwa kwenye vipande vya mabega.
  - severity: medium
    issue: “Vikalio” ni tafsiri isiyo ya kawaida na yenye utata kwa מִּשְׁבְּצֹת.
    rationale: Katika Kiswahili Sanifu, “vishikio” hueleza kwa uwazi settings au mountings za kazi ya ufundi.
  - severity: low
    issue: Dokezo linaongeza “vya dhahabu.”
    rationale: Ingawa muktadha mpana unahusu vifaa vya dhahabu, dhahabu haitajwi katika aya hii; dokezo lisilo na lazima linaweza kuzidisha maelezo ya chanzo.
  revised_text: Nao wakaweka ncha mbili za minyororo miwili iliyosokotwa juu ya vishikio viwili, kisha wakaiweka minyororo hiyo kwenye vipande vya mabega vya efodi, upande wake wa mbele.
