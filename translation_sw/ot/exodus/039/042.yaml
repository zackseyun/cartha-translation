base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/042.yaml
  text: According to all that Yahweh had commanded Moses[a], so the sons of Israel did all the work.
translation:
  language: sw
  text: Kulingana na yote ambayo Yahweh alimwamuru Musa, ndivyo wana wa Israeli[a] walivyofanya kazi yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watoto wa Israeli.” Kiebrania ni “wana wa Israeli,” jina la kawaida la pamoja kwa watu wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל
  choice: Kulingana na yote ambayo
  rationale: Kiambishi כְּ pamoja na כֹל huonyesha ulinganifu na maagizo yote; tafsiri hii inadumisha maana ya ‘sawasawa na yote’ kwa Kiswahili cha kawaida.
- source_word: צִוָּה
  choice: alikuwa amemwamuru
  rationale: Kitenzi humaanisha ‘kuamuru.’ Hali ya ‘alikuwa amemwamuru’ inaonyesha kwa kawaida kwamba amri ilitangulia utekelezaji wa kazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa moja kwa moja kuwa ‘Yahwe’ badala ya kubadilishwa na cheo.
- source_word: אֶת מֹשֶׁה
  choice: Musa
  rationale: Pamoja na צוה, Musa ndiye mtu aliyeamriwa; muundo ‘alimwamuru Musa’ ni wa kawaida na sahihi katika Kiswahili.
- source_word: כֵּן
  choice: ndivyo
  rationale: Neno hili linarejelea kifungu cha mwanzo na kusisitiza kwamba utekelezaji ulilingana na maagizo.
- source_word: עָשׂוּ
  choice: walivyofanya
  rationale: Kitenzi עשה kina maana pana ya kufanya au kutekeleza; ‘walivyofanya’ kinafaa pamoja na ‘kazi yote’ bila kuibana maana iwe utengenezaji pekee.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hii inadumisha kwa karibu maana halisi ya jina la pamoja ‘wana wa Israeli,’ huku ikibaki kuwa usemi wenye hadhi na unaoeleweka kwa Kiswahili.
- source_word: אֵת כָּל הָעֲבֹדָה
  choice: kazi yote
  rationale: Katika muktadha wa kutengeneza maskani, עֲבֹדָה ni jumla ya kazi waliyopewa; ‘kazi yote’ ni wazi na haibani maana kuwa huduma ya ibada pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandiko ya Kiebrania yanatumia jina binafsi la Mungu hapa. ‘Yahwe’ linahifadhi jina hilo badala ya kuliwakilisha kwa cheo.
- issue: Jinsi ya kutafsiri בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli au watoto wa Israeli
  rationale: Usemi wa Kiebrania ni ‘wana wa Israeli’ na hapa ni jina la pamoja la watu wa agano. Tafsiri kuu inadumisha umbo hilo, huku tanbihi ikifafanua maana yake ya kijumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘Kulingana na ... ndivyo ...’ unahifadhi ulinganifu wa vifungu vya Kiebrania bila kuwa mzito kupita kiasi. Alama ya tanbihi imewekwa baada ya usemi unaofafanuliwa.
