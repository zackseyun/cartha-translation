lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: meza
  rationale: Nomino שֻׁלְחָן humaanisha moja kwa moja meza. Muktadha wa samani za maskani unatosha kuitambulisha bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: כָּל כֵּלָיו
  choice: vyombo vyake vyote
  rationale: כְּלִי ni neno pana linaloweza kumaanisha chombo, kifaa, au kitu kinachotumiwa. “Vyombo” ni Kiswahili cha kawaida na kinachofaa kwa vifaa vinavyohusiana na meza.
- source_word: לֶחֶם הַפָּנִים
  choice: mikate ya Wepesi wa Mungu
  rationale: Kirai hiki kihalisi ni “mkate wa uso/uwepo.” “Mikate ya Wepesi wa Mungu” inalenga kuonyesha kuwa mikate hiyo iliwekwa mbele za Mungu huku ikitumia usemi unaoeleweka kwa wasomaji wa Kiswahili.
- source_word: אֶת ... אֶת ... וְאֵת
  choice: '[haijatafsiriwa kama maneno tofauti]'
  rationale: Hizi ni alama za yambwa zinazoratibu vitu katika orodha; kazi yake imewasilishwa kwa mpangilio wa maneno na kiunganishi “na.”
theological_decisions:
- issue: Maana ya לֶחֶם הַפָּנִים
  choice: mikate ya Wepesi wa Mungu
  alternative: mikate ya wonyesho
  rationale: Tafsiri iliyochaguliwa inalenga kuhifadhi wazo la kuwa mbele ya Mungu badala ya kutumia istilahi ya jadi ambayo inaweza kuwa isiyo wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya heshima, rahisi, na ya sasa. Mstari unaendeleza orodha ya aya zilizotangulia, kwa hiyo umetolewa kama kipande cha sentensi na kudumisha kistari cha mwisho.
