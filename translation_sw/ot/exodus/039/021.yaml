  text: וַ/יִּרְכְּס֣וּ אֶת הַ/חֹ֡שֶׁן מִ/טַּבְּעֹתָי/ו֩ אֶל טַבְּעֹ֨ת הָ/אֵפֹ֜ד בִּ/פְתִ֣יל תְּכֵ֗לֶת לִֽ/הְיֹת֙ עַל חֵ֣שֶׁב הָ/אֵפֹ֔ד וְ/לֹֽא יִזַּ֣ח הַ/חֹ֔שֶׁן מֵ/עַ֖ל הָ/אֵפֹ֑ד כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/021.yaml
  text: They fastened the breastpiece by its rings to the rings of the ephod with a cord of blue[a], so that it would be on the skillfully woven band of the ephod, and so that the breastpiece would not come loose from on the ephod[b], just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Wakakifunga kifuko cha kifuani kwa pete zake kwenye pete za efodi kwa kamba ya buluu[a], ili kikae juu ya mshipi wa efodi uliosukwa kwa ustadi[b], na ili kifuko hicho cha kifuani kisihame kutoka juu ya efodi, kama Yahwe alivyomwamuru Mose.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uzi wa buluu.”
    reason: Neno la Kiebrania linaweza kutaja kamba au uzi uliotumiwa kufungia.
  - marker: b
    text: Au, “mkanda wa efodi uliosukwa kwa ustadi.” Neno la Kiebrania hutaja mshipi au ukanda uliopambwa uliokuwa sehemu ya efodi.
    reason: Neno la vazi la kikuhani linaweza kuelezwa kwa ‘mshipi’ au ‘mkanda’.
lexical_decisions:
- source_word: וַיִּרְכְּסוּ
  choice: Wakakifunga
  rationale: Kitenzi hiki kinaeleza kuunganisha au kukaza sehemu pamoja. ‘Kufunga’ ni Kiswahili cha kawaida na kinafaa katika muktadha wa vazi la kuhani.
- source_word: הַחֹשֶׁן
  choice: kifuko cha kifuani
  rationale: Katika muktadha huu ni sehemu ya vazi la kuhani iliyovaliwa kifuani na iliyokuwa na mawe; ‘kifuko cha kifuani’ huepuka wazo lisilofaa la ngao au silaha.
- source_word: מִטַּבְּעֹתָיו ... אֶל טַבְּעֹת הָאֵפֹד
  choice: kwa pete zake kwenye pete za efodi
  rationale: Kauli hii inaonyesha kwamba pete za kifuko zilitumiwa kukiunganisha na pete za efodi.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: kwa kamba ya buluu
  rationale: פְתִיל inaweza kuwa kamba au uzi wa kufungia, na תְּכֵלֶת hutaja rangi ya buluu iliyotokana na rangi maalumu ya zamani. ‘Kamba ya buluu’ ni wazi na ya kawaida.
- source_word: לִהְיוֹת עַל חֵשֶׁב הָאֵפֹד
  choice: ili kikae juu ya mshipi wa efodi uliosukwa kwa ustadi
  rationale: חֵשֶׁב hapa ni mshipi au ukanda uliopambwa na kuunganishwa na efodi. Tafsiri inaonyesha nafasi yake na ufundi wa usokotaji bila kuifanya kuwa mkanda wa kawaida tu.
- source_word: וְלֹא יִזַּח ... מֵעַל הָאֵפֹד
  choice: kisiondoke juu ya efodi
  rationale: Kitenzi kina maana ya kuondoka au kuteleza kutoka mahali pake; kauli hii pia inadumisha wazo la Kiebrania la kuondoka kutoka juu ya efodi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye konsonanti YHWH limetoholewa kwa tahajia ya kawaida ya Kiswahili kama ‘Yahwe’, badala ya kubadilishwa kuwa cheo.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: ‘Mose’ ni umbo la jina hili lililozoeleka katika Kiswahili Sanifu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina maalumu la Mungu, si cheo. ‘Yahwe’ hulihifadhi jina hilo kwa umbo linalofaa tahajia ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mtiririko wa simulizi kwa ‘Wakakifunga’ na istilahi za vazi la kikuhani zinaelezwa kwa maneno yanayoeleweka kwa wasomaji wa kawaida.
