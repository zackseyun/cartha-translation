translation:
  language: sw
  text: Nao wakaweka zile kamba mbili za dhahabu[a] kwenye zile pete mbili zilizo kwenye ncha za kifuko cha kifuani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “minyororo miwili ya dhahabu.” Neno la Kiebrania linaweza kumaanisha kamba zilizosokotwa au nyuzi kama minyororo; hapa vitu hivyo ni vya dhahabu na vimeunganishwa na kifuko cha kifuani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Nao wakaweka
  rationale: Kitenzi נתן katika muundo huu humaanisha kuweka kitu juu au kwenye kitu kingine; “wakaweka” ni ya kawaida na inafaa mtiririko wa simulizi.
- source_word: שְׁתֵּי
  choice: zile ... mbili
  rationale: Huhifadhi idadi mahususi ya vitu viwili, huku kiashiria “zile” kikirejelea kamba zilizotajwa katika muktadha uliotangulia.
- source_word: הָעֲבֹתֹת
  choice: kamba
  rationale: Neno hili la Kiebrania linaweza kumaanisha kamba zilizosokotwa au minyororo yenye umbo la kamba; “kamba” huhifadhi taswira ya msingi bila kuondoa uwezekano wa “minyororo.”
- source_word: הַזָּהָב
  choice: za dhahabu
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida na wazi kwamba kamba hizo zilitengenezwa kwa dhahabu.
- source_word: עַל
  choice: kwenye
  rationale: Katika muktadha wa kuambatanisha kamba na pete, “kwenye” ni usemi wa kawaida wa Kiswahili unaoonyesha mahali zilipowekwa.
- source_word: הַטַּבָּעֹת
  choice: pete
  rationale: “Pete” ndilo neno la kawaida la Kiswahili kwa טבעת katika maelezo ya vifaa vya hema takatifu.
- source_word: קְצוֹת
  choice: ncha
  rationale: “Ncha” huonyesha sehemu za mwisho za kifuko kwa uwazi zaidi kuliko “kingo,” ambayo inaweza kumaanisha pande zake zote.
- source_word: הַחֹשֶׁן
  choice: kifuko cha kifuani
  rationale: Kifaa hiki cha kuhani kilivaliwa kifuani na kilikuwa kama kifuko; tafsiri hii ni wazi kwa msomaji wa kawaida kuliko neno lisilozoeleka, bila kuongeza kirai “cha hukumu” ambacho hakipo katika mstari huu.
