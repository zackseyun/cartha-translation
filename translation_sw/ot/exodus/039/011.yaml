  text: 'and the second row: turquoise[a], sapphire, and diamond.'
translation:
  language: sw
  text: 'na safu ya pili: feruzi[a], yakuti samawi, na almasi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho kamili wa baadhi ya vito vya kale hauna uhakika. נֹפֶךְ inaweza pia kutafsiriwa “zumaridi” au “yakuti nyekundu,” na יָהֲלֹם inaweza pia kutafsiriwa “yasintho” au “yaspi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: na safu
  rationale: Katika muktadha wa mawe ya kifuko cha kifuani, טוּר ni safu ya mawe; וְ limetafsiriwa kwa “na.”
- source_word: הַ/שֵּׁנִי
  choice: ya pili
  rationale: Ni kivumishi cha mpangilio kinachomaanisha “pili,” na muundo wa Kiswahili wa “safu ya pili” ni wa kawaida na wa asili.
- source_word: נֹפֶךְ
  choice: feruzi
  rationale: Utambulisho kamili wa jiwe hili la kale hauna uhakika. “Feruzi” ni jina linalowezekana la kisasa; uwezekano mwingine umehifadhiwa katika tanbihi.
- source_word: סַפִּיר
  choice: yakuti samawi
  rationale: Hili ni jina la Kiswahili linalotambulika kwa sapphire. Huenda jiwe la kale lisilingane kikamilifu na madini yanayoitwa hivyo leo, lakini ndio ulinganifu uliozoeleka zaidi.
- source_word: וְ/יָהֲלֹם
  choice: na almasi
  rationale: “Almasi” ni tafsiri ya jadi na inayofahamika, lakini utambulisho wa jiwe la kale hauna uhakika; uwezekano mwingine umewekwa katika tanbihi.
