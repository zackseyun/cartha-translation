base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/005.yaml
  text: 'And the skillfully woven band of his ephod[a], which was on it, was of one piece with it and made like it: of gold, blue, purple, scarlet yarn, and fine twisted linen, just as Yahweh had commanded Moses.'
translation:
  language: sw
  text: Na ukanda wa efodi yake uliosukwa kwa ustadi[a], uliokuwa juu yake, ulikuwa sehemu moja nayo, wa kazi ileile, na ulitengenezwa kwa dhahabu, uzi wa buluu, zambarau, na nyekundu, pamoja na kitani safi kilichosokotwa, kama Yahweh alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukanda uliopambwa wa efodi yake ... ulitokana nayo, wa kazi ileile.” Kiebrania kinakazia kwamba ukanda ulikuwa sehemu ya efodi na ulilingana nayo kwa ufundi.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵשֶׁב
  choice: mkanda ... uliofumwa kwa ustadi
  rationale: Katika muktadha wa mavazi ya kikuhani, neno hili linamaanisha mkanda au utepe uliofumwa unaohusiana na efodi. Tafsiri hii inaonyesha umbo lake la kitambaa na ustadi wa kazi.
- source_word: אֲפֻדָּתוֹ
  choice: efodi yake
  rationale: Ni muundo wa umilikaji unaorejelea vazi la kuhani mkuu; ‘efodi yake’ ni fupi, ya kawaida na sahihi.
- source_word: אֲשֶׁר עָלָיו
  choice: uliokuwa juu yake
  rationale: Inahifadhi moja kwa moja maana ya mahali ilipokuwa juu ya efodi bila kuongeza wazi kwamba iliambatishwa, jambo ambalo muktadha unadokeza.
- source_word: מִמֶּנּוּ הוּא
  choice: ulikuwa sehemu moja nayo
  rationale: Kifungu kinaonyesha kwamba mkanda haukuwa kitu tofauti bali ulikuwa sehemu kamili ya efodi.
- source_word: כְּמַעֲשֵׂהוּ
  choice: ulitengenezwa kwa ufundi uleule
  rationale: Inaonyesha kwamba kazi na namna ya utengenezaji wa mkanda vililingana na vya efodi.
- source_word: זָהָב
  choice: dhahabu
  rationale: Ni neno la kawaida la Kiswahili kwa nyenzo hii.
- source_word: תְּכֵלֶת
  choice: nyuzi za buluu
  rationale: ‘Buluu’ ni tafsiri inayoeleweka ya rangi hii ya vitambaa vya hema; ‘nyuzi’ inawekwa katika orodha ili kufafanua muktadha wa ufumaji.
- source_word: אַרְגָּמָן
  choice: zambarau
  rationale: Ni jina la kawaida la rangi hii katika Kiswahili sanifu.
- source_word: תּוֹלַעַת שָׁנִי
  choice: nyekundu
  rationale: Kirai kinataja kitambaa au uzi wenye rangi nyekundu angavu; ‘nyuzi’ iliyotajwa mwanzoni mwa mfululizo inahusu pia rangi hii.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: kitani safi kilichosokotwa
  rationale: Inahifadhi ubora wa kitani na namna nyuzi zake zilivyotayarishwa kwa kusokotwa.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: kama Yahwe alivyomwamuru Musa
  rationale: Inawasilisha kauli ya kutii agizo la awali, huku jina la Mungu likitafsiriwa moja kwa moja kama Yahwe.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina la agano moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. ‘Efodi’ imehifadhiwa kama istilahi ya vazi maalumu la kikuhani; ‘Musa’ ni umbo lililozoeleka katika Kiswahili.
