  text: the gold altar[a], the anointing oil, the fragrant incense, and the screen for the entrance of the tent[c][b];
translation:
  language: sw
  text: madhabahu ya dhahabu, mafuta ya upako, uvumba wa manukato, na pazia la mwingilio wa hema;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: madhabahu ya dhahabu
  rationale: Muundo huu unaakisi kirai cha Kiebrania, ambacho kwa kawaida kinaeleweka kuwa madhabahu iliyotengenezwa kwa dhahabu au kufunikwa kwa dhahabu, bila kuongeza maelezo yasiyotajwa hapa.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: mafuta ya upako
  rationale: Ni usemi wa kawaida na wazi wa Kiswahili kwa mafuta yaliyotumiwa katika tendo la kupaka kwa kusudi la ibada.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: uvumba wa manukato
  rationale: קְטֹרֶת ni uvumba, na הַסַּמִּים hurejelea vitu au viungo vyenye harufu nzuri; tafsiri hii inahifadhi muundo na maana ya chanzo kwa Kiswahili cha kawaida.
- source_word: מָסַךְ
  choice: pazia
  rationale: Katika muktadha wa hema takatifu, neno hili ni kitambaa kinachoning'inizwa na kufunika mwingilio; 'pazia' ni la asili na linaeleweka kuliko 'kiwambo' katika Kiswahili cha kawaida.
- source_word: פֶּתַח הָאֹהֶל
  choice: la mwingilio wa hema
  rationale: Tafsiri hii inawakilisha wazi פֶּתַח kama mwingilio au nafasi ya kuingia, na הָאֹהֶל kama hema.
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: orodha yenye koma na 'na' kabla ya kitu cha mwisho
  rationale: Viunganishi na viashiria vya yambwa vinaunda orodha; mtindo huu ni wa asili katika Kiswahili huku ukihifadhi vitu vyote vinne.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Istilahi 'madhabahu,' 'upako,' 'uvumba,' na 'hema' zinafaa muktadha wa ibada na ni za kawaida katika matumizi ya Biblia. Hakuna tanbihi iliyohitajika, kwa kuwa tofauti za Kiingereza kama 'gold/golden altar,' 'screen/curtain,' na 'fragrant incense/incense of spices' zinaweza kuwasilishwa moja kwa moja na kwa usahihi katika Kiswahili bila kupoteza utata muhimu.
