  language: sw
  text: mapazia ya ua[a], nguzo zake na vikalio vyake[b], pazia la lango la ua, kamba zake[c] na vigingi vyake, na vifaa vyote vya huduma ya Maskani kwa ajili ya Hema la Kukutania;
