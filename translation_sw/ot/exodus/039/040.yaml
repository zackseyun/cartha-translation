lexical_decisions:
- source_word: קַלְעֵי
  choice: mapazia
  rationale: Katika muktadha wa ua wa Maskani, neno hili linamaanisha vitambaa vilivyotundikwa ili kuuzunguka ua. “Mapazia” ni neno la kawaida na linaloeleweka kwa urahisi.
- source_word: הֶחָצֵר
  choice: ua
  rationale: Neno hili linarejelea eneo lililozungushiwa lililokuwa nje ya Maskani. “Ua” ni tafsiri fupi na ya kawaida katika Kiswahili sanifu.
- source_word: עַמֻּדֶיהָ
  choice: nguzo zake
  rationale: Hizi ni nguzo zilizosimamisha mapazia ya ua; “nguzo” linaeleza kazi yake kwa usahihi.
- source_word: אֲדָנֶיהָ
  choice: vikalio vyake
  rationale: Neno hili linamaanisha vipande vya msingi ambamo nguzo ziliwekwa. “Vikalio” ni wazi, huku “vitako” likibaki chaguo la kiufundi zaidi.
- source_word: הַמָּסָךְ
  choice: pazia
  rationale: Hapa ni pazia maalumu la kufunika nafasi ya kuingilia ua. Muktadha wa “lango” unalitofautisha na mapazia yaliyouzunguka ua.
- source_word: לְשַׁעַר הֶחָצֵר
  choice: la lango la ua
  rationale: Kihusishi kinaonyesha kwamba pazia hilo lilikuwa la lango la ua. “Lango” linahifadhi maana ya kawaida ya שַׁעַר.
- source_word: מֵיתָרָיו
  choice: kamba zake
  rationale: Neno hili linarejelea kamba zilizotumiwa kuimarisha muundo. “Kamba” ni neno la kawaida na sahihi katika Kiswahili cha sasa.
- source_word: וִיתֵדֹתֶיהָ
  choice: vigingi vyake
  rationale: Hivi ni vigingi vilivyopigiliwa ardhini ili kushikilia kamba; “vigingi” linaonyesha vitu hivyo moja kwa moja.
- source_word: כָּל כְּלֵי עֲבֹדַת
  choice: vifaa vyote vya huduma ya
  rationale: כְּלִים ni neno pana linaloweza kumaanisha vyombo, zana, au vifaa. “Vifaa” linafaa kwa orodha hii ya vitu vya matumizi, na “huduma” linawasilisha kazi iliyofanywa katika mahali patakatifu.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: “Maskani” ni istilahi inayofaa kwa makao matakatifu yanayohamishika na inahifadhi wazo la mahali pa kukaa lililomo katika neno la Kiebrania.
- source_word: לְאֹהֶל מוֹעֵד
  choice: kwa ajili ya Hema la Kukutania
  rationale: Tafsiri hii inahifadhi jina rasmi la jengo hilo na maana ya kihusishi לְ kama kusudi au matumizi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaosomeka kwa urahisi. Muundo wa orodha ya Kiebrania umehifadhiwa, pamoja na tofauti kati ya mapazia yanayozunguka ua na pazia moja la lango. Herufi kubwa katika “Maskani” na “Hema la Kukutania” zinaonyesha majina maalumu ya mahali patakatifu.
