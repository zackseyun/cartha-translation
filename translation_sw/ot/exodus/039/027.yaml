  text: They made the tunics of fine linen[a], the work of a weaver, for Aaron and for his sons.
translation:
  language: sw
  text: Wakatengeneza kanzu za kitani safi, zilizofumwa na mfumaji, kwa ajili ya Aroni na wanawe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Wakatengeneza
  rationale: Kitenzi hiki kinaendeleza mfululizo wa simulizi. “Wakatengeneza” ni Kiswahili cha kawaida na huonyesha tendo la kutengeneza bila kulazimisha kiunganishi cha Kiebrania kutafsiriwa kwa namna isiyo ya asili.
- source_word: הַכָּתְנֹת
  choice: kanzu
  rationale: Neno hili hutaja vazi la mwilini lenye umbo la kanzu. “Kanzu” ni sahihi na inaeleweka kuliko neno la jumla kama “mavazi.”
- source_word: שֵׁשׁ
  choice: kitani safi
  rationale: Katika muktadha wa hema takatifu na mavazi ya ukuhani, neno hili hutaja kitani bora au safi, si kitani kwa ujumla tu.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: zilizofumwa na mfumaji
  rationale: Kirai hiki husisitiza ufundi wa kufuma. Muundo huu ni wa asili katika Kiswahili na unaonyesha kwamba kanzu hizo zilitengenezwa kwa kazi ya mfumaji.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: kwa ajili ya Aroni na wanawe
  rationale: Kirai hiki kinaonyesha waliokusudiwa mavazi hayo. “Wanawe” huwasilisha kwa ufupi maana ya wana wa kiume katika muktadha huu wa ukuhani.
