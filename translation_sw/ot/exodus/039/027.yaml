  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Msamiati wa mavazi na ufundi umewekwa wazi bila kuongeza maelezo yasiyokuwamo katika chanzo.
