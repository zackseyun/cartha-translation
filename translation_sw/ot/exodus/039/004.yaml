translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha urudiaji wa wazo la kuunganisha katika Kiebrania na inaacha wazi umbo hasa la sehemu za mabegani.
