translation:
  language: sw
  text: Walitengeneza kwa ajili yake vipande vya mabega[a], vilivyounganishwa nayo; iliunganishwa katika ncha zake mbili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mikanda ya mabega.” Neno la Kiebrania lataja sehemu za efodi zilizokuwa juu ya mabega na kuunganisha sehemu zake.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֵפֹת
  choice: vipande vya mabegani
  rationale: Nomino hii inahusiana moja kwa moja na mabega, lakini katika muktadha wa efodi inataja sehemu zilizotengenezwa zilizokaa mabegani na kuunganisha sehemu zake. “Vipande vya mabegani” ni wazi na haiamui bila sababu kwamba vilikuwa mikanda.
- source_word: עָשׂוּ
  choice: wakaitengenezea
  rationale: Kitenzi עשה humaanisha “kufanya/kutengeneza.” Umbo lenye kiambishi cha kitu linaeleza kwa Kiswahili cha kawaida kwamba walivitengeneza kwa ajili ya efodi.
- source_word: לוֹ
  choice: -i-...-ea (kwa ajili yake)
  rationale: Kiambishi cha Kiebrania kinarejelea efodi, nomino isiyo hai katika muktadha; Kiswahili huonyesha uhusiano huu kwa kauli “wakaitengenezea.”
- source_word: חֹבְרֹת
  choice: vilivyounganishwa nayo
  rationale: Neno kutoka חבר lina wazo la kuunganisha. Tafsiri hii inalifanya wazi kuwa vipande hivyo viliunganishwa na efodi huku ikihifadhi dhana kuu ya muungano.
- source_word: עַל שְׁנֵי קצוותו
  choice: kwenye ncha zake mbili
  rationale: Kifungu hiki kinataja sehemu mbili za mwisho za efodi. “Kwenye ncha zake mbili” ni Kiswahili cha kawaida na sahihi kwa ujenzi wa vazi.
- source_word: חֻבָּר
  choice: iliunganishwa
  rationale: Hii ni hali tendwa ya חבר. Kurudia mzizi wa “kuunganisha” kunahifadhi msisitizo na mwangwi wa kimsamiati wa Kiebrania.
