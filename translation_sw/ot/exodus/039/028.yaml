lexical_decisions:
- source_word: הַמִּצְנֶפֶת
  choice: kilemba
  rationale: Neno hili hutaja kifuniko cha kichwa cha kikuhani, hasa cha kuhani mkuu; “kilemba” ni neno la kawaida na linalofaa katika muktadha huu.
- source_word: שֵׁשׁ
  choice: kitani safi
  rationale: שֵׁשׁ hutaja kitani bora, si kitani kwa ujumla tu; “kitani safi” huhifadhi wazo la ubora wa kitambaa.
- source_word: פַּאֲרֵי הַמִּגְבָּעֹת
  choice: kofia za fahari
  rationale: Muundo huu unaeleza kofia za kikuhani kuwa za kupendeza au za fahari, badala ya kutaja mapambo tofauti yaliyowekwa juu ya kofia.
- source_word: מִכְנְסֵי הַבָּד
  choice: nguo za ndani za kitani
  rationale: מִכְנָסַיִם ni mavazi ya ndani yanayofunika sehemu ya chini ya mwili; tafsiri hii ni ya kisasa na wazi, huku הַבָּד ikionyesha kuwa yalikuwa ya kitani.
- source_word: מָשְׁזָר
  choice: kilichosokotwa
  rationale: Neno hili linaeleza nyuzi zilizopindwa au kusokotwa pamoja; “kilichosokotwa” huwasilisha mbinu hiyo ya utengenezaji kwa Kiswahili cha kawaida.
