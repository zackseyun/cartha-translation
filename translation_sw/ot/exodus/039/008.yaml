  naturalness: The narrative opening and material list are generally clear Standard East African Swahili. “Kwa ufundi wa fundi stadi wa michoro” is more idiomatic and precise than “kwa ufundi wa ustadi.” “Kitani nzuri iliyosokotwa” naturally expresses fine, twisted linen.
  terminology: “Efodi” appropriately retains the technical priestly term. “Kifaa cha kifuani” is a suitably neutral rendering of חֹשֶׁן, avoiding an unwarranted implication of metal armor or making “pouch” the main lexical sense. The footnotes retain the two supplied anchors and give viable alternatives.
