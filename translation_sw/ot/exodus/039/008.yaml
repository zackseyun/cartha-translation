  text: וַ/יַּ֧עַשׂ אֶת הַ/חֹ֛שֶׁן מַעֲשֵׂ֥ה חֹשֵׁ֖ב כְּ/מַעֲשֵׂ֣ה אֵפֹ֑ד זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/008.yaml
  text: 'He made the breastpiece[a], the work of a skillful designer, like the work of the ephod: of gold, blue, purple, scarlet yarn[b], and finely twisted linen.'
translation:
  language: sw
  text: Akatengeneza kifaa cha kifuani[a] kwa ufundi wa fundi stadi wa michoro[b], kama kazi ya efodi, kwa dhahabu, nyuzi za rangi ya buluu, zambarau, na nyekundu iliyokolea, na kitani nzuri iliyosokotwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vazi la kifuani.” Kwa desturi huitwa pia “kibamba cha kifuani”; hapa halimaanishi dirii ya chuma ya kujikinga vitani.
    reason: lexical_alternative
  - marker: b
    text: Au, “kazi ya fundi stadi wa michoro.” Kirai cha Kiebrania kinakazia ufundi wenye mpangilio au michoro iliyobuniwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Akatengeneza
  rationale: Wayyiqtol ya עשה inaendeleza simulizi kwa tendo lililopita; kiambishi "Aka-" huhifadhi mfuatano huo kwa Kiswahili cha kawaida.
- source_word: הַחֹשֶׁן
  choice: kifuko cha kifuani
  rationale: חֹשֶׁן ni vazi/kifaa maalumu cha kuhani kilichovaliwa kifuani na kuhusishwa na efodi. "Kifuko cha kifuani" huepuka wazo potovu la dirii ya chuma na linaweza kuashiria umbo lake la kukunjwa.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: kwa ufundi wa ustadi
  rationale: Kirai hiki kinasisitiza kazi ya ustadi yenye michoro au mpangilio uliobuniwa, si utengenezaji wa kawaida tu; tanbihi inahifadhi uwezekano wa kumtaja fundi mwenyewe.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: kama kazi ya efodi
  rationale: Huhifadhi ulinganisho wa moja kwa moja kati ya ufundi na vifaa vya kifuko cha kifuani na vile vya efodi.
- source_word: אֵפֹד
  choice: efodi
  rationale: Ni istilahi maalumu ya vazi la kikuhani isiyo na kisawe kamili cha Kiswahili; utohozi huu huhifadhi umaalumu wake.
- source_word: זָהָב
  choice: dhahabu
  rationale: Ni jina la moja kwa moja la nyenzo hiyo.
- source_word: תְּכֵלֶת
  choice: nyuzi za rangi ya buluu
  rationale: Katika orodha hii neno linarejelea nyenzo ya kusokota iliyotiwa rangi; kutaja nyuzi huifanya orodha ieleweke kwa kawaida.
- source_word: וְאַרְגָּמָן
  choice: zambarau
  rationale: Ni tafsiri ya kawaida ya rangi/nyenzo hii ya thamani; neno "nyuzi" lililotangulia linatawala vipengele vya rangi vinavyofuata.
- source_word: וְתוֹלַעַת שָׁנִי
  choice: nyekundu
  rationale: Kirai kinataja nyenzo iliyotiwa rangi nyekundu kali; "nyekundu" ni ya kawaida na wazi, huku muktadha wa nyuzi ukidhibiti maana.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: kitani safi kilichosokotwa
  rationale: שֵׁשׁ hutaja kitani bora/safi na מָשְׁזָר nyuzi zilizosokotwa pamoja; tafsiri inahifadhi maelezo ya nguo kwa lugha ya asili.
