  text: 'And they mounted on it four rows of stones: the first row was a ruby[a], a topaz, and an emerald.'
translation:
  language: sw
  text: 'Nao wakaweka ndani yake safu nne za vito: safu ya kwanza ilikuwa akiki nyekundu[a], topazi na zumaridi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho kamili wa vito hivi hauna uhakika. “Akiki nyekundu,” “topazi,” na “zumaridi” ni tafsiri za kimapokeo; jiwe la kwanza huenda lilikuwa jiwe jingine jekundu, la pili huenda lilikuwa krisoliti, na la tatu huenda lilikuwa jiwe jingine la kijani au linalong'aa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלְאוּ
  choice: wakapanga
  rationale: Kitenzi kihalisi kina wazo la ‘kujaza,’ lakini katika muktadha wa kuweka vito kwenye kifuko cha kifuani, ‘wakapanga’ huwasilisha kwa Kiswahili cha kawaida kitendo cha kuviweka katika nafasi zake bila kudai mbinu maalumu ya kuvifunga.
- source_word: בּוֹ
  choice: juu yake
  rationale: Kiwakilishi kinarejelea kifuko cha kifuani; ‘juu yake’ linafaa kwa vito vilivyowekwa kwenye uso wake, ingawa ‘ndani yake’ pia lingewezekana.
- source_word: אַרְבָּעָה טוּרֵי אָבֶן
  choice: safu nne za vito
  rationale: טוּרֵי ni safu, na אָבֶן limetumiwa kwa maana ya pamoja. ‘Vito’ ni la kawaida na sahihi zaidi hapa kuliko ‘mawe.’
- source_word: טוּר
  choice: safu
  rationale: Neno hili linadumisha urudiaji wa muundo wa Kiebrania na kutambulisha vito vya safu ya kwanza.
- source_word: אֹדֶם
  choice: akiki nyekundu
  rationale: Utambulisho kamili wa jiwe hili hauna uhakika. Rangi nyekundu inaungwa mkono na neno la Kiebrania, na akiki nyekundu ni pendekezo linalotambulika; kutokuwa na uhakika kunaelezwa katika tanbihi.
- source_word: פִּטְדָה
  choice: topazi
  rationale: ‘Topazi’ ni jina la jadi linaloeleweka katika tafsiri za Biblia, ingawa utambulisho wa jiwe la kale si hakika.
- source_word: בָרֶקֶת
  choice: zumaridi
  rationale: ‘Zumaridi’ ni tafsiri ya jadi na inayoeleweka, lakini neno la Kiebrania huenda lilimaanisha jiwe linalong’aa au kumetameta; kutokuwa na uhakika kunahifadhiwa katika tanbihi.
- source_word: הַטּוּר הָאֶחָד
  choice: safu ya kwanza ilikuwa
  rationale: Katika muktadha wa safu nne, usemi huu unatambulisha safu ya kwanza. ‘Ilikuwa’ limeongezwa ili orodha isomeke kwa kawaida katika Kiswahili.
