base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/020.yaml
  text: They made two gold rings and put them on the two shoulder pieces of the ephod[a], below, on its front side, opposite its joining[b], above the skillfully woven band of the ephod.
translation:
  language: sw
  text: Wakatengeneza pete mbili za dhahabu, wakaziweka kwenye vipande viwili vya mabegani vya efodi, chini, katika upande wake wa mbele, mkabala na mahali pa kuunganishwa kwake[a], juu ya mshipi wa efodi uliosukwa kwa ustadi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkabala na kiungo chake”; neno la Kiebrania linarejelea mahali ambapo sehemu za efodi ziliunganishwa.
    reason: lexical_alternative
  - marker: b
    text: Au “juu ya mshipi wa kiunoni wa efodi uliosukwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת
  choice: pete
  rationale: Neno hili kwa kawaida humaanisha pete za chuma zilizotumiwa kama viungio; “pete” ni tafsiri ya kawaida na sahihi katika muktadha huu.
- source_word: כִתְפֹת
  choice: vipande vya mabegani
  rationale: Katika efodi, neno hili linarejelea sehemu za vazi zilizokaa mabegani, si mabega ya mwili pekee.
- source_word: מִלְמַטָּה
  choice: upande wa chini
  rationale: Hueleza mahali pa chini pa efodi kwa lugha ya kawaida na iliyo wazi.
- source_word: מִמּוּל פָּנָיו
  choice: sehemu yake ya mbele
  rationale: Kihalisi usemi huu unahusu upande wa uso wa kitu; kwa vazi, “sehemu yake ya mbele” ni Kiswahili cha kawaida.
- source_word: לְעֻמַּת
  choice: mkabala na
  rationale: Hudumisha wazo la vitu vilivyolingana au vilivyokabiliana kwa nafasi bila kulazimisha mpangilio mahususi zaidi.
- source_word: מֶחְבַּרְתּוֹ
  choice: mahali pake pa kuunganishia
  rationale: Neno linamaanisha sehemu au mahali ambapo vipande vinaunganishwa; tafsiri hii ni wazi na haibani maana kuwa mshono tu.
- source_word: חֵשֶׁב
  choice: mshipi ... uliosukwa kwa ustadi
  rationale: Katika maelezo ya efodi, neno hili hurejelea utepe au mshipi wa vazi uliotengenezwa kwa ufundi; “mshipi” huonyesha kazi yake ya kufunga vizuri.
- source_word: אֵפֹד
  choice: efodi
  rationale: Ni istilahi ya vazi maalumu la kikuhani lisilo na kisawe kamili cha Kiswahili, hivyo limetoholewa.
- source_word: וַיִּתְּנֻם
  choice: wakaziweka
  rationale: Hutoa maana rahisi ya kuziweka pete mahali pake kwa Kiswahili cha kawaida.
