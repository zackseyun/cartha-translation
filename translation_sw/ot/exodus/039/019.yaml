base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/019.yaml
  text: They made two gold rings and put them on the two ends of the breastpiece[b][a], on its edge that was on the inner side toward the ephod.
translation:
  language: sw
  text: Nao wakatengeneza pete mbili za dhahabu na kuziweka kwenye ncha mbili za kifuko cha kifuani, kwenye ukingo wake uliokuwa upande wa ndani, kuelekea efodi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uliokabiliana na efodi” au “uliokuwa mkabala na efodi.” Kiebrania hutumia neno linalomaanisha kihalisi “kuelekea nyumbani,” lakini hapa maana yake ni “kuelekea ndani,” yaani upande wa kifuko cha kifuani uliokuwa kuelekea efodi.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: pete mbili za dhahabu
  rationale: Neno טַבַּעַת humaanisha pete, hapa pete za kufungia katika vazi la kikuhani; muundo huu unataja nyenzo kwa Kiswahili cha kawaida.
- source_word: הַחֹשֶׁן
  choice: kifuko cha kifuani
  rationale: Katika muktadha wa vazi la kuhani mkuu, חֹשֶׁן ni kitu kilichovaliwa kifuani na kilichokuwa kama kifuko, si bamba la silaha; tafsiri hii huepuka dhana ya dirii.
- source_word: שְׂפָתוֹ
  choice: ukingo wake
  rationale: שָׂפָה kwa kitu kilichotengenezwa humaanisha ukingo au mpaka; 'ukingo' ni neno la kawaida na sahihi hapa.
- source_word: שְׁנֵי קְצוֹת
  choice: ncha mbili
  rationale: קָצֶה humaanisha mwisho au ncha; 'ncha' haibainishi bila msingi kwamba zilikuwa pembe.
- source_word: וַיָּשִׂימוּ עַל
  choice: na kuziweka kwenye
  rationale: שׂוּם ni kuweka; 'kuziweka kwenye' huonyesha kwa kawaida mahali pete zilipofungwa.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  choice: wa upande wa ndani, unaoelekea efodi
  rationale: בָּיְתָה inaelekeza ndani, huku אֶל עֵבֶר ikionyesha uhusiano wa mahali na efodi. Tafsiri hii ni wazi bila kuficha uwezekano wa kuelewa usemi huo kuwa 'unaokabiliana na efodi.'
