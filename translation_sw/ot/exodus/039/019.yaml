translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Kifuko cha kifuani' kimetumiwa badala ya neno linaloweza kudokeza bamba la silaha. Alama ya tanbihi imewekwa baada ya kishazi husika.
