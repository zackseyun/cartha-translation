base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/001.yaml
  text: And from the blue[a], the purple, and the scarlet yarn they made finely woven garments for ministering in the sanctuary, and they made the holy garments for Aaron, just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Kutokana na nyuzi za buluu, zambarau, na nyekundu, walitengeneza mavazi yaliyofumwa kwa ustadi[a] kwa ajili ya kuhudumu mahali patakatifu. Pia walitengeneza mavazi matakatifu kwa ajili ya Aroni, kama vile Yahweh alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mavazi ya huduma.” Kirai hiki cha Kiebrania ni cha kitaalamu na huenda kikasisitiza matumizi ya mavazi hayo katika huduma ya hema takatifu au ustadi uliotumika kuyatengeneza.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  choice: Kutokana na nyuzi za buluu, zambarau, na nyekundu
  rationale: Maneno haya yanataja rangi au nyenzo za kawaida za vitambaa vya hema takatifu. Neno “nyuzi” linaweka wazi muktadha wa ufumaji bila kujaribu kubainisha kwa kupita kiasi vivuli halisi vya rangi za kale.
- source_word: בִגְדֵי שְׂרָד
  choice: mavazi yaliyofumwa kwa ustadi
  rationale: Kirai hiki cha kitaalamu kinaweza kusisitiza ufundi wa mavazi au matumizi yake rasmi katika huduma ya patakatifu. Tafsiri iliyochaguliwa inafaa muktadha wa utengenezaji wa vitambaa, huku maana mbadala ikihifadhiwa katika tanbihi.
- source_word: לְשָׁרֵת
  choice: kwa ajili ya kuhudumu
  rationale: “Kuhudumu” linaonyesha huduma rasmi ya ibada vizuri kuliko neno la jumla “kutumika” au “kutumikia.”
- source_word: בַּקֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Hapa neno hilo linaelekea kutaja eneo takatifu la huduma ya hema, si sifa ya utakatifu kwa ujumla. Tafsiri hii haibani maana kuwa chumba kimoja tu.
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: mavazi matakatifu
  rationale: Hii inadumisha jina rasmi la mavazi ya kikuhani ya Aroni na kutofautisha kirai hiki na בִגְדֵי שְׂרָד kilichotangulia.
- source_word: לְאַהֲרֹן
  choice: kwa ajili ya Aroni
  rationale: Kihusishi kinaonyesha kwamba mavazi hayo yalikusudiwa Aroni; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetolewa kama jina binafsi “Yahweh,” badala ya kubadilishwa na cheo.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: kama vile Yahweh alivyomwamuru Musa
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba utengenezaji ulifuata kikamilifu agizo ambalo Yahweh alikuwa amempa Musa hapo awali.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu moja kwa moja. “Yahweh” linahifadhi jina hilo badala ya kulibadilisha na cheo kama “BWANA.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Pia” linaunganisha sentensi ya pili kwa kawaida bila kufuta urudiaji wa kimuundo wa Kiebrania.
