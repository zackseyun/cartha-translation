  text: They made two gold settings and two gold rings[a], and they put the two rings on the two ends of the breastpiece.
translation:
  language: sw
  text: Wakatengeneza viwekeo viwili vya dhahabu[a] na pete mbili za dhahabu, kisha wakaziweka zile pete mbili kwenye ncha mbili za kifuko cha kifuani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vipachikio” au “viwekeo vya mapambo ya nyuzi za dhahabu”; neno la Kiebrania linaweza kueleza aina mbalimbali za kazi hii ya dhahabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Wakatengeneza
  rationale: Qal wayyiqtol ya עשה inaendeleza mfululizo wa matendo; kiambishi wa- pamoja na -ka- kinatoa kwa kawaida katika Kiswahili maana ya “na wakatengeneza/kisha wakatengeneza”.
- source_word: שְׁתֵּי מִשְׁבְּצֹת זָהָב
  choice: viwekeo viwili vya dhahabu
  rationale: מִשְׁבְּצֹת ni kazi za dhahabu zilizotumika kushikilia au kupachikia sehemu nyingine. “Viwekeo” ni wazi bila kubainisha isivyo lazima kwamba vilikuwa vya filigri au umbo jingine maalumu.
- source_word: וּשְׁתֵּי טַבְּעֹת זָהָב
  choice: na pete mbili za dhahabu
  rationale: טַבְּעֹת humaanisha pete zilizotumika kama sehemu za kuunganishia; marudio ya “dhahabu” yanahifadhi msisitizo na muundo wa Kiebrania.
- source_word: וַיִּתְּנוּ
  choice: kisha wakaziweka
  rationale: נתן hapa ina maana ya kuweka. “Kisha” inaonyesha mfululizo wa wayyiqtol, na kiambishi -zi- kinarejelea pete hizo mbili kwa Kiswahili cha kawaida.
- source_word: עַל שְׁנֵי קְצוֹת
  choice: kwenye ncha mbili za
  rationale: עַל hapa huonyesha mahali pete zilipowekwa, huku קְצוֹת ikirejelea ncha au miisho ya kifuko; “kwenye ncha mbili” ni usemi wa asili na sahihi wa Kiswahili.
- source_word: הַחֹשֶׁן
  choice: kifuko cha kifuani
  rationale: חֹשֶׁן ni vazi maalumu la kuhani mkuu lililovaliwa kifuani na lililokuwa kama kifuko. Tafsiri hii ni ya kueleweka kwa msomaji wa sasa bila kuongeza hapa kirai “cha hukumu,” ambacho hakipo katika mstari huu.
