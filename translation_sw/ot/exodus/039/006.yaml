base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/006.yaml
  text: And they made the onyx stones[a], enclosed in settings of gold, engraved like the engravings of a seal, according to the names of the sons of Israel.
translation:
  language: sw
  text: Nao wakatengeneza mawe ya shohamu[a], yaliyokuwa yamezungukwa na vishikio vya dhahabu na kuchongwa kwa namna ya muhuri, kwa kufuata majina ya wana wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda “mawe ya oniksi”; aina kamili ya jiwe hili haijulikani kwa uhakika, ingawa “oniksi” ndiyo tafsiri ya jadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Nao wakayatengeneza
  rationale: עָשָׂה ni kitenzi kipana cha kufanya au kutengeneza; katika muktadha wa ufundi, “wakayatengeneza” ni Kiswahili cha kawaida na huendeleza simulizi.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: yale mawe ya shohamu
  rationale: Utambulisho kamili wa שֹׁהַם kama madini haujulikani kwa uhakika. Kutumia “shohamu” katika matini kunahifadhi kutokuwa na uhakika badala ya kudai kwa hakika kwamba ni oniksi; tanbihi inaeleza tafsiri ya jadi.
- source_word: מֻסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: yakizungukwa na vijalizo vya dhahabu
  rationale: Muundo huu unaeleza mawe yaliyozungushiwa au kuwekwa ndani ya kazi maalumu za dhahabu. “Vijalizo” huwasilisha sehemu zilizotengenezwa kushikilia mawe bila kubainisha kupita kiasi mbinu ya ufundi.
- source_word: מְפֻתָּחֹת פִּתּוּחֵי חוֹתָם
  choice: yakachongwa kama mchongo wa muhuri
  rationale: Kirai chenye mzizi unaorudiwa kinasisitiza uchongaji wa namna ya muhuri. Tafsiri hii inadumisha taswira hiyo kwa Kiswahili cha asili.
- source_word: עַל שְׁמוֹת
  choice: kwa kufuata majina
  rationale: עַל hapa huonyesha uhusiano au ulinganifu na majina yaliyochongwa. “Kwa kufuata majina” huhifadhi maana hiyo kuliko kuigeuza tu kuwa ‘yakiwa na majina’.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Kirai cha Kiebrania ni cha kiume katika usemi wa ukoo na agano; “wana wa Israeli” hukihifadhi kwa ufupi na kwa mtindo wa kibiblia unaoeleweka.
theological_decisions:
- issue: Usemi wa kijinsia wa agano בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: wazao wa Israeli; Waisraeli
  rationale: “Wana wa Israeli” huhifadhi umbo la kiume na taswira ya ukoo ya Kiebrania bila kuibadilisha kuwa jina la jumla la taifa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Shohamu” limetumiwa pamoja na tanbihi ili kuhifadhi kutokuwa na uhakika kwa jina la jiwe; “vijalizo” linaonyesha kazi za dhahabu zilizoshikilia au kuzunguka mawe.
