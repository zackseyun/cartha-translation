translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Joho” linafaa kwa vazi la kikuhani, na “efodi” limehifadhiwa kama istilahi maalumu. Alama ya tanbihi imewekwa baada ya kirai kinachohusika.
