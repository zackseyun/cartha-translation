  text: And he made the robe of the ephod[a], the work of a weaver[b], all of blue.
translation:
  language: sw
  text: Naye akatengeneza joho la efodi, kazi ya mfumaji, lote la rangi ya buluu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania lililotafsiriwa “rangi ya buluu” linamaanisha kitambaa kilichotiwa rangi ya buluu ya thamani, kilichotumiwa katika Maskani na mavazi ya kikuhani.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Naye akalitengeneza
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “akalitengeneza” ni ya kawaida na inafaa kwa kutengeneza vazi.
- source_word: מְעִיל הָאֵפֹד
  choice: joho la efodi
  rationale: מְעִיל ni vazi la nje, hapa joho la kikuhani; אֵפֹד ni istilahi maalumu ya vazi la kikuhani, hivyo imeandikwa kwa kunukuu sauti yake kama “efodi.”
- source_word: מַעֲשֵׂה אֹרֵג
  choice: kazi ya mfumaji
  rationale: Tafsiri hii inahifadhi muundo wa Kiebrania na kuonyesha kwamba joho hilo lilifumwa, bila kuongeza wazo la ustadi ambalo halijasemwa wazi.
- source_word: כְּלִיל
  choice: lote
  rationale: 'Neno hili linaonyesha ukamilifu: joho zima lilikuwa na rangi iliyotajwa.'
- source_word: תְּכֵלֶת
  choice: la rangi ya buluu
  rationale: Katika muktadha huu neno linataja kitambaa au uzi uliotiwa rangi ya thamani ya buluu; mstari wenyewe unasisitiza rangi ya joho lote bila kutaja wazi “uzi.”
