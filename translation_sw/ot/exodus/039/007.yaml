  text: And he set them on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], just as Yahweh had commanded Moses.
translation:
  language: sw
  text: Akayaweka juu ya sehemu za mabega ya efodi kuwa mawe ya ukumbusho[a] kwa wana wa Israeli[b], kama vile Yahwe alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mawe ya kumbukumbu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wana wa Israeli,” usemi wa kawaida unaowarejelea watu wa Israeli.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָם
  choice: Akayaweka
  rationale: Kitenzi שׂוּם humaanisha kuweka au kutia; kiambishi “-ya-” kinarejelea yale mawe mawili yaliyotajwa katika mstari uliotangulia.
- source_word: עַל כִּתְפֹת הָאֵפֹד
  choice: juu ya vipande vya mabegani vya efodi
  rationale: כָּתֵף humaanisha bega, na hapa hurejelea sehemu za vazi zinazokaa mabegani. Tafsiri hii inaeleza ujenzi wa efodi kwa Kiswahili cha kawaida bila kuondoka katika picha halisi ya Kiebrania.
- source_word: אַבְנֵי זִכָּרוֹן
  choice: mawe ya ukumbusho
  rationale: Kirai hiki kina maana halisi ya mawe yenye kazi ya kukumbusha au kuwa ukumbusho. “Mawe ya ukumbusho” ni usemi wa asili na wenye hadhi katika Kiswahili.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kwa wana wa Israeli
  rationale: Huhifadhi kwa uwazi usemi wa Kiebrania בְּנֵי יִשְׂרָאֵל, huku tanbihi ikifafanua kwamba usemi huo huwarejelea watu wa Israeli kwa ujumla.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: kama vile Yahwe alivyomwamuru Musa
  rationale: “Kama vile” huonyesha kufanyika kwa jambo sawasawa na amri iliyotangulia; “alivyomwamuru” ni mtiririko wa kawaida wa simulizi katika Kiswahili.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja. “Yahwe” huhifadhi jina la agano kwa umbo linalofaa tahajia na matamshi ya Kiswahili.
- issue: Maana ya usemi בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: “Wana wa Israeli” huhifadhi umbo la usemi wa asili bila kuufanya urejelee wanaume pekee; tanbihi inaweka wazi matumizi yake ya kawaida kwa watu wote wa Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaosomeka kwa urahisi. Muundo wa sentensi unadumisha mfuatano wa simulizi na lugha ya kiufundi ya vazi la kikuhani bila kuwa mzito.
