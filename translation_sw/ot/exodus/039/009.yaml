  text: It was square; they made the breastpiece doubled[a], a span its length and a span its width, doubled.
translation:
  language: sw
  text: Ilikuwa ya mraba; walitengeneza kifuko cha kifuani kikiwa maradufu[a], shibiri moja kwa urefu wake na shibiri moja kwa upana wake, kikiwa maradufu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kikiwa kimekunjwa mara mbili.” Neno la Kiebrania כָּפוּל linaonyesha kuwa kifuko cha kifuani kilifanywa katika tabaka mbili au kwa kukunjwa mara mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: ya mraba
  rationale: Hueleza umbo lenye pande nne zilizo sawa; huu ndio usemi wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: הָיָה
  choice: ilikuwa
  rationale: Kitenzi hiki ni kiunganishi kinachoeleza hali au umbo la kifuko cha kifuani.
- source_word: כָּפוּל
  choice: kikiwa maradufu
  rationale: Huhifadhi maana ya kitu kilichofanywa katika tabaka mbili au kilichokunjwa mara mbili bila kuamua kimyakimya ni njia ipi hasa iliyotumiwa.
- source_word: עָשׂוּ
  choice: wakalitengeneza
  rationale: Ni tafsiri ya kawaida ya tendo la kufanya au kutengeneza, huku kiambishi cha yambwa kikirejelea kifuko cha kifuani.
- source_word: הַחֹשֶׁן
  choice: kifuko cha kifuani
  rationale: Katika muktadha wa mavazi ya kuhani mkuu, neno hili hutaja kifaa kilichovaliwa kifuani; 'kifuko' kinaendana na muundo wake wa maradufu bila kuongeza kauli ya 'hukumu' ambayo haipo katika mstari huu.
- source_word: זֶרֶת
  choice: shibiri moja
  rationale: Shibiri ni kipimo cha kale kinachotajwa moja kwa moja na neno la Kiebrania, hivyo hakibadilishwi kuwa kipimo cha kisasa.
- source_word: אָרְכּוֹ
  choice: urefu wake
  rationale: Nomino pamoja na kiambishi chake hurejelea moja kwa moja urefu wa kifuko cha kifuani.
- source_word: רָחְבּוֹ
  choice: upana wake
  rationale: Hii ndiyo tafsiri ya kawaida na ya sasa ya kipimo cha kutoka upande mmoja hadi mwingine.
- source_word: כָּפוּל
  choice: kikiwa maradufu
  rationale: Kurudiwa mwishoni kunahifadhi msisitizo wa Kiebrania kuhusu muundo wa tabaka mbili au uliokunjwa mara mbili.
