  text: Wakaitia kamba ya buluu[a], ili kukiweka juu ya kilemba, kama vile Yahwe alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kamba ya rangi ya samawati” au “kamba ya rangi ya urujuani”; neno la Kiebrania תְּכֵלֶת linarejelea nyenzo yenye rangi bainifu ya buluu iliyotumiwa katika hema la ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: Wakaiambatanishia
  rationale: Kitenzi נתן kimsingi humaanisha ‘kuweka/kutoa,’ lakini pamoja na עַל na muktadha wa kufungia bamba kwa kamba, ‘wakaiambatanishia’ kinaeleza tendo hilo kwa Kiswahili cha kawaida bila kuongeza maelezo yasiyokuwapo.
- source_word: פְּתִיל
  choice: kamba
  rationale: Neno hili hurejelea uzi uliosokotwa au kamba; ‘kamba’ linafaa kwa kifaa cha kufungia bamba kwenye kilemba.
- source_word: תְּכֵלֶת
  choice: nyuzi za buluu
  rationale: Neno hili hutaja nyenzo iliyotiwa rangi maalumu ya buluu au buluu yenye kuelekea zambarau iliyotumiwa katika hema la ibada; hapa linabainisha nyenzo na rangi ya kamba.
- source_word: לָתֵת עַל הַמִּצְנֶפֶת מִלְמָעְלָה
  choice: ili kuiweka juu ya kilemba
  rationale: Muundo wa kitenzi-jina unaonyesha kusudi, na מִלְמָעְלָה huonyesha mahali pa juu; tafsiri hii ni ya asili na inadumisha uhusiano huo.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: kama vile Yahwe alivyomwamuru Musa
  rationale: ‘Kama vile’ huhifadhi msisitizo wa kwamba kazi ilifanywa sawasawa na agizo, huku jina la Mungu יהוה likitolewa kama Yahwe.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה; ‘Yahwe’ huhifadhi jina hilo badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kiwakilishi katika ‘kuiweka’ kinarejelea bamba takatifu la mstari uliotangulia, bila kulirudia kwa ufafanuzi ndani ya mstari huu.
