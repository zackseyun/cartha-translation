  text: the pure lampstand[a], its lamps—the lamps set in order—and all its utensils, and the oil for the light,
translation:
  language: sw
  text: kinara safi cha taa, taa zake—taa zilizopangwa kwa utaratibu[a]—na vifaa vyake vyote, na mafuta ya kuangazia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taa za mpangilio.” Kirai cha Kiebrania נֵרֹת הַמַּעֲרָכָה kinakazia kupangwa kwa taa kwa utaratibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּנֹרָה
  choice: kinara cha taa
  rationale: Neno מְנוֹרָה linamaanisha kinara kinachoshikilia taa, si taa moja tu; “kinara cha taa” ni Kiswahili cha kawaida na kinachoeleweka.
- source_word: הַטְּהֹרָה
  choice: kilicho safi
  rationale: טָהוֹר hapa hueleza usafi wa kinara katika muktadha wa vifaa vya Patakatifu; “kilicho safi” huhifadhi maana hiyo bila kuongezea kwamba ni dhahabu, jambo ambalo halitajwi moja kwa moja katika mstari huu.
- source_word: נֵרֹתֶיהָ
  choice: taa zake
  rationale: Katika orodha hii נֵרֹתֶיהָ ni taa mbalimbali za kinara; “taa zake” ni tafsiri wazi na ya asili.
- source_word: נֵרֹת הַמַּעֲרָכָה
  choice: taa zilizopangwa kwa utaratibu
  rationale: מַעֲרָכָה hudokeza mpangilio au uwekaji kwa utaratibu. Kauli hii ya Kiswahili ni ya kawaida huku ikihifadhi wazo la taa kuwekwa kwa mpangilio.
- source_word: כָּל כֵּלֶיהָ
  choice: vifaa vyake vyote
  rationale: כְּלִי ni neno pana linaloweza kumaanisha vifaa, vyombo, au zana. “Vifaa” halibani maana kwa aina moja tu ya vitu vilivyohusiana na kinara.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: mafuta ya kuangazia
  rationale: Muundo huu unamaanisha mafuta yaliyokusudiwa kutoa mwanga; “mafuta ya kuangazia” ni fasaha na huhifadhi kusudi lake.
theological_decisions: []
translation_notes:
  register: Imetumia Kiswahili sanifu cha Afrika Mashariki chenye hadhi ya orodha ya vifaa vya ibada. Vistari virefu vinaonyesha kwamba “taa zilizopangwa kwa utaratibu” ni ufafanuzi wa “taa zake,” kama ilivyo katika muundo wa Kiebrania.
