base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/043.yaml
  text: And Moses saw all the work, and behold, they had done it; just as Yahweh had commanded, so they had done it. And Moses blessed them.
translation:
  language: sw
  text: Musa akaiona kazi yote, na tazama, walikuwa wameifanya; kama vile Yahweh alivyoamuru, ndivyo walivyoifanya. Musa akawabariki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: akaona
  rationale: Maana ya msingi ya ראה ni ‘kuona’. Katika muktadha Musa anaangalia kazi iliyokamilika; ‘akaona’ ni ya asili na haiongezi wazi wazo la ukaguzi ambalo halijasemwa moja kwa moja.
- source_word: כָּל הַמְּלָאכָה
  choice: kazi yote
  rationale: מְלָאכָה hapa ni kazi nzima ya kutengeneza maskani na vifaa vyake. ‘Kazi yote’ ni Kiswahili cha kawaida, wazi, na chenye upana unaolingana na Kiebrania.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: הִנֵּה huvuta fikira na kusisitiza ugunduzi unaofuata. ‘Na tazama’ huhifadhi nguvu hiyo ya kisimulizi katika sajili yenye heshima.
- source_word: עָשׂוּ אֹתָהּ
  choice: walikuwa wameifanya
  rationale: עשה ni neno pana linaloweza kumaanisha kufanya au kutengeneza. Kiwakilishi kinarejelea kazi yote; umbo hili pia linaonyesha kwamba kazi ilikuwa imekamilika kabla Musa hajaiona.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: kama vile Yahwe alivyoamuru
  rationale: כַּאֲשֶׁר huonyesha ulinganifu kamili; ‘kama vile’ huwasilisha hilo kwa kawaida. Jina יהוה limetafsiriwa kwa unukuzi ‘Yahwe’.
- source_word: כֵּן עָשׂוּ
  choice: ndivyo walivyokuwa wameifanya
  rationale: Kiebrania hurudia עשה ili kusisitiza utiifu kamili. Kurudia kitenzi katika Kiswahili kunahifadhi msisitizo huo badala ya kufupisha sentensi.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: Musa akawabariki
  rationale: ברך katika piel humaanisha ‘kubariki’. Tafsiri hii ni ya moja kwa moja, ya kawaida, na haiongezi maelezo yasiyomo katika chanzo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Aya inatumia moja kwa moja Tetragramatoni יהוה. ‘Yahwe’ huhifadhi jina binafsi la Mungu badala ya kulibadilisha kwa cheo, huku ‘Yehova’ ikiwa namna ya kimapokeo inayotokana na uchanganyaji wa konsonanti na irabu za usomaji mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ‘na tazama’ umehifadhiwa kwa sababu ya nguvu yake ya kisimulizi; urudiaji wa ‘walikuwa wameifanya’ umeachwa kimakusudi ili kuakisi msisitizo wa Kiebrania kuhusu utiifu kamili.
