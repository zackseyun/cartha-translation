  text: אֶת אֲרֹ֥ן הָ/עֵדֻ֖ת וְ/אֶת בַּדָּ֑י/ו וְ/אֵ֖ת הַ/כַּפֹּֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/035.yaml
  text: the ark of the testimony[a], its poles, and the mercy seat.
translation:
  language: sw
  text: sanduku la ushuhuda, mipiko yake, na kiti cha rehema[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kifuniko cha upatanisho.” Neno la Kiebrania linamaanisha kifuniko cha sanduku na lina uhusiano na upatanisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֹן
  choice: sanduku
  rationale: Katika muktadha wa maskani, neno hili linamaanisha sanduku takatifu lililohifadhi mbao za ushuhuda; “sanduku” ni neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: הָעֵדֻת
  choice: la ushuhuda
  rationale: עֵדוּת maana yake ya moja kwa moja ni “ushuhuda”; hapa linahusisha sanduku na mbao zilizokuwa ushuhuda wa agano, bila kubadili neno hilo kuwa “agano.”
- source_word: בַּדָּיו
  choice: mipiko yake
  rationale: Katika maelezo ya maskani, בַּדִּים ni fito za kubebea vifaa vitakatifu. “Mipiko” ni istilahi ya Kiswahili inayoonyesha kazi hiyo kwa ufupi.
- source_word: הַכַּפֹּרֶת
  choice: kiti cha rehema
  rationale: Hili ni jina lililozoeleka la kifuniko cha dhahabu cha sanduku, ambacho kilihusishwa na ibada ya upatanisho. Tanbihi inahifadhi tafsiri mbadala iliyo wazi zaidi kuhusu umbo na kazi yake.
theological_decisions:
- issue: Tafsiri ya כַּפֹּרֶת katika muktadha wa vifaa vya maskani
  choice: kiti cha rehema
  alternative: kifuniko cha upatanisho
  rationale: “Kiti cha rehema” kinatambulisha kifaa hicho kwa istilahi iliyozoeleka na kuhifadhi uzito wake wa kiibada; “kifuniko cha upatanisho” pia kinawezekana na kinafafanuliwa katika tanbihi bila kuingiza dai la kiteolojia lisilosemwa wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa orodha wa mstari umehifadhiwa.
