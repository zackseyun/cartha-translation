  text: פַּעֲמֹ֤ן וְ/רִמֹּן֙ פַּעֲמֹ֣ן וְ/רִמֹּ֔ן עַל שׁוּלֵ֥י הַ/מְּעִ֖יל סָבִ֑יב לְ/שָׁרֵ֕ת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/026.yaml
  text: a bell and a pomegranate[a], a bell and a pomegranate, around the hem of the robe, all around, for ministering, just as Yahweh had commanded Moses.
translation:
  language: sw
  text: kengele na komamanga, kengele na komamanga, kwenye upindo wa joho pande zote, kwa ajili ya kuhudumu[a], kama Yahwe alivyomwamuru Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya huduma” au “kwa kutumika.” Kitenzi-jina cha Kiebrania kinaonyesha kusudi la joho katika huduma ya kikuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: kengele
  rationale: Nomino hii humaanisha kengele. Ingawa muktadha wa mistari iliyotangulia unaonyesha kuwa ilikuwa ya dhahabu, neno “dhahabu” halimo wazi katika mstari huu.
- source_word: רִמּוֹן
  choice: komamanga
  rationale: Neno hili kwa maana ya moja kwa moja ni komamanga; katika muktadha huu linarejelea pambo lenye umbo la komamanga, lakini tafsiri ya moja kwa moja inaeleweka kutokana na muktadha.
- source_word: עַל שׁוּלֵי הַמְּעִיל סָבִיב
  choice: kwenye upindo wa joho pande zote
  rationale: שׁוּלֵי hurejelea ukingo wa chini au upindo, מְעִיל ni joho, na סָבִיב husisitiza kuwa mapambo yaliwekwa kuzunguka upindo wote.
- source_word: לְשָׁרֵת
  choice: kwa ajili ya kuhudumu
  rationale: Kitenzi-jina chenye לְ kinaonyesha kusudi la joho katika huduma ya kikuhani. “Kuhudumu” ni lugha ya kawaida na inayofaa muktadha wa ibada.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limewasilishwa kwa unukuzi wa Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: צִוָּה ... אֶת מֹשֶׁה
  choice: alivyomwamuru Musa
  rationale: Muundo huu unaonyesha kwamba kazi ilifanywa sawasawa na amri ambayo Yahwe alikuwa amempa Musa; Kiswahili hiki ni cha asili na huonyesha ulinganifu huo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לְשָׁרֵת katika muktadha wa kikuhani
  choice: kwa ajili ya kuhudumu
  alternative: kwa ajili ya huduma
  rationale: Tafsiri hii huhifadhi maana ya kusudi bila kuamua kwa undani zaidi ni tendo gani maalumu la huduma ya kikuhani linalokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Marudio ya “kengele na komamanga” yamehifadhiwa kwa sababu yanawakilisha mpangilio wa kupokezana katika Kiebrania.
