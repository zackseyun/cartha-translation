  footnotes:
  - marker: a
    text: Maana kamili ya neno la Kiebrania תְּחָשִׁים (tahashim) haijulikani. Huenda linataja ngozi za mnyama fulani; kwa mapokeo limetafsiriwa kuwa ngozi za pomboo au nguva.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְסֵה
  choice: kifuniko
  rationale: Nomino hii humaanisha kitu kinachofunika; “kifuniko” ni ya kawaida na haiongezi maelezo yasiyomo katika Kiebrania.
- source_word: עוֹרֹת הָאֵילִם הַמְאָדָּמִים
  choice: ngozi za kondoo dume zilizotiwa rangi nyekundu
  rationale: Hutaja ngozi za kondoo dume zilizofanywa nyekundu, yaelekea kwa kutiwa rangi; tafsiri hii ni wazi na ya asili katika Kiswahili.
- source_word: עֹרֹת הַתְּחָשִׁים
  choice: ngozi za tahashi
  rationale: Rejeleo la תְּחָשִׁים halijulikani kwa hakika. Kulihamisha kama “tahashi” huepuka kubainisha bila msingi mnyama au aina ya ngozi, huku tanbihi ikieleza utata huo.
- source_word: פָּרֹכֶת
  choice: pazia
  rationale: Katika muktadha wa Maskani, neno hili hutaja pazia la ndani la kutenganisha sehemu; “pazia” ni la kawaida na lenye heshima.
- source_word: הַמָּסָךְ
  choice: kufunika
  rationale: מָסָךְ inaweza kutaja kifuniko au pazia la kufunika. Katika muundo פָּרֹכֶת הַמָּסָךְ, “pazia la kufunika” huhifadhi uhusiano wa maneno bila kulazimisha maana ya pazia la mwingilio katika sehemu hii.
