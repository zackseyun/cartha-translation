translation:
  language: sw
  text: Nao wakatengeneza kwenye kifuko cha kifuani minyororo ya kusokotwa kwa mtindo wa kamba, ya dhahabu safi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “minyororo ya kazi iliyopindwa” au “minyororo ya kazi ya kamba.” Kiebrania hutumia istilahi za ufundi ambazo zinaweza kueleza muundo wa kusokotwa, kupindwa, au unaofanana na kamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Nao wakatengeneza
  rationale: Kitenzi עשה katika mfululizo wa simulizi kina maana ya kutengeneza; kiunganishi “Nao” kinaendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: עַל הַחֹשֶׁן
  choice: juu ya kifuko cha kifuani
  rationale: עַל hudumisha maana ya mahali au kuambatanishwa, na חֹשֶׁן hapa ni kifaa cha kuhani mkuu kilichovaliwa kifuani.
- source_word: שַׁרְשְׁרֹת
  choice: minyororo
  rationale: Nomino ya wingi inaashiria minyororo; hili ndilo neno la kawaida na wazi katika Kiswahili.
- source_word: גַּבְלֻת
  choice: ya kazi ya kusokotwa
  rationale: Neno hili linaeleza muundo uliotengenezwa kwa mtindo wa kusokotwa; tafsiri hii ni ya kawaida huku ikihifadhi wazo la ufundi.
- source_word: מַעֲשֵׂה עֲבֹת
  choice: kama kamba
  rationale: Kirai kinaeleza ufundi wenye sura ya kamba au nyuzi nene zilizosokotwa; “kama kamba” hudumisha ulinganisho huo kwa uwazi.
- source_word: זָהָב טָהוֹר
  choice: kwa dhahabu safi
  rationale: Hiki ni kirai cha kawaida kinachoonyesha nyenzo iliyotumiwa kutengeneza minyororo.
