translation:
  language: sw
  text: 'na safu ya nne: berili[a], oniksi na yaspi, vikiwa vimewekwa katika vitako vya dhahabu katika nafasi zake.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho sahihi wa baadhi ya vito katika kifuko cha kifuani cha kuhani mkuu hauna uhakika; “berili,” “oniksi,” na “yaspi” huakisi tafsiri za kimapokeo zinazotumiwa sana.
    reason: lexical_alternative
  - marker: b
    text: Au, “vikiwa vimewekwa katika vitako vya dhahabu kulingana na nafasi zao.” Kirai cha mwisho cha Kiebrania ni cha kiufundi na huenda kinaeleza jinsi vito vilivyowekwa katika nafasi zao maalumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: na safu ya nne
  rationale: Katika orodha ya vito vya kifuko cha kifuani, טוּר humaanisha safu; kiunganishi וְ kimetafsiriwa kwa “na.”
- source_word: תַּרְשִׁישׁ
  choice: berili
  rationale: Utambulisho sahihi wa kito hiki cha kale hauna uhakika. “Berili” ni jina linalotambulika na linaendeleza mapokeo ya kawaida bila kudai uhakika usiokuwapo.
- source_word: שֹׁהַם
  choice: oniksi
  rationale: “Oniksi” ni jina la kisasa na linaloeleweka la kito kinachotajwa kwa neno hili, ingawa utambulisho wake wa kimadini unabishaniwa.
- source_word: וְיָשְׁפֵה
  choice: na yaspi
  rationale: “Yaspi” ni kisawe cha kawaida cha יָשְׁפֵה; kiunganishi chake kimewasilishwa kwa “na.”
- source_word: מֽוּסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: mawe hayo yaliwekwa katika vitako vya dhahabu
  rationale: Kauli hii inaonyesha kuwa vito vilifungwa au kuwekwa ndani ya miundo ya dhahabu. “Vitako” hutoa maana ya sehemu za chuma zinazoshikilia vito kwa Kiswahili cha kawaida.
- source_word: בְּמִלֻּאֹתָם
  choice: kila moja mahali pake
  rationale: Kirai hiki cha kiufundi kinahusu vito vikiwa vimejazwa au vimewekwa katika nafasi zake zilizokusudiwa. Tafsiri hii ni ya asili kwa Kiswahili huku tanbihi ikihifadhi uwezekano wa ufasiri wa karibu zaidi na muundo wa Kiebrania.
