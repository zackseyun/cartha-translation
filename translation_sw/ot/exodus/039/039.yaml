lexical_decisions:
- source_word: מִזְבַּח
  choice: madhabahu
  rationale: Neno hili humaanisha madhabahu. Ingawa katika muktadha huu ni madhabahu ya sadaka ya kuteketezwa, Kiebrania cha aya hii hakirudii maelezo hayo kamili.
- source_word: הַנְּחֹשֶׁת
  choice: shaba
  rationale: Neno נְחֹשֶׁת linaweza kumaanisha shaba au aloi ya shaba kulingana na muktadha; “shaba” ndilo neno la kawaida na linaloeleweka katika Kiswahili kwa vifaa hivi vya Maskani.
- source_word: מִכְבַּר
  choice: wavu
  rationale: Ni kifaa cha matundu kilichohusishwa na madhabahu. “Wavu” linaonyesha umbo lake bila kubainisha zaidi ya Kiebrania.
- source_word: אֲשֶׁר לוֹ
  choice: uliokuwa kwa ajili yake
  rationale: Kauli hii inahusisha wavu na madhabahu bila kudai kwa uhakika ulikuwa juu yake au ndani yake.
- source_word: בַּדָּיו
  choice: miti yake ya kubebea
  rationale: Hizi ni fito au miti iliyotumiwa kubebea samani za Maskani; maelezo haya ni wazi kwa msomaji wa sasa.
- source_word: כָּל־כֵּלָיו
  choice: vyombo vyake vyote
  rationale: כֵּלִים ni jina pana la vifaa au vyombo; “vyombo” ni la kawaida na linafaa kwa vifaa vya madhabahu.
- source_word: כִּיֹּר
  choice: beseni
  rationale: Ni chombo kikubwa cha kuoshea. “Beseni” linaeleweka kwa urahisi katika Kiswahili cha sasa kuliko istilahi ya zamani “birika.”
- source_word: כַּנּוֹ
  choice: kiunzi chake
  rationale: Neno hili hutaja sehemu iliyotegemeza beseni; “kiunzi” linaonyesha kazi hiyo huku “msingi” au “tako” yakiwa pia yanawezekana.
