base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/025.yaml
  text: They made bells of pure gold[a], and they put the bells among the pomegranates on the hem of the robe, all around, among the pomegranates.
translation:
  language: sw
  text: Wakatengeneza kengele za dhahabu safi, kisha wakaziweka kengele hizo miongoni mwa makomamanga[a] kwenye upindo wa joho, pande zote, miongoni mwa makomamanga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kati ya makomamanga.” Kauli ya Kiebrania kwa maana halisi ni “ndani/katikati ya makomamanga” na inaeleza mahali kengele zilipowekwa kuhusiana na mapambo yenye umbo la makomamanga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Wakatengeneza
  rationale: Kitenzi hiki kinaeleza hatua inayofuata ya utengenezaji; “wakatengeneza” ni Kiswahili cha kawaida kinachodumisha mfuatano wa simulizi.
- source_word: פַעֲמֹנֵי
  choice: kengele
  rationale: Neno hili humaanisha kengele; hakuna kivumishi katika Kiebrania kinacholazimisha tafsiri ya “kengele ndogo.”
- source_word: זָהָב טָהוֹר
  choice: za dhahabu safi
  rationale: Tafsiri hii inaweka wazi nyenzo na usafi wa dhahabu kwa Kiswahili cha kawaida.
- source_word: וַיִּתְּנוּ
  choice: kisha wakaziweka
  rationale: Katika muktadha huu נתן humaanisha kuweka vitu mahali pake. “Kisha” huonyesha kwa kawaida mwendelezo wa hatua bila kubadili maana.
- source_word: בְּתוֹךְ הָרִמֹּנִים
  choice: katikati ya makomamanga
  rationale: Kauli hii inadumisha wazo la kengele kuwekwa ndani ya mpangilio wa mapambo ya makomamanga, huku ikiacha wazi kama maana mahsusi ni “miongoni mwa” au “kati ya” mapambo hayo.
- source_word: הָרִמֹּנִים
  choice: makomamanga
  rationale: Kiebrania kinataja makomamanga moja kwa moja. Muktadha unaonyesha kuwa ni mapambo yenye umbo la makomamanga, lakini tafsiri kuu haiongezi ufafanuzi huo.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: kwenye upindo wa joho
  rationale: שׁוּלִים hurejelea ukingo wa chini au upindo wa vazi, na מְעִיל hapa ni joho la kikuhani.
- source_word: סָבִיב
  choice: pande zote
  rationale: Kauli hii inaonyesha kuwa mpangilio huo ulizunguka upindo wote wa joho.
- source_word: בְּתוֹךְ הָרִמֹּנִים (repeated)
  choice: katikati ya makomamanga
  rationale: Urudiaji wa Kiebrania umehifadhiwa kwa sababu unasisitiza mpangilio wa kengele kuhusiana na makomamanga.
