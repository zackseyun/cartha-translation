base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/003.yaml
  text: They hammered out sheets of gold and cut it into threads[a], to work it into the blue and into the purple and into the scarlet yarn and into the fine linen[c][b], the work of a skillful designer.
translation:
  language: sw
  text: Waliyapiga mabamba ya dhahabu mpaka yakawa membamba[a], wakayakata kuwa nyuzi[b], ili wazitie katika nyuzi za buluu, zambarau na nyekundu, na katika kitani safi—kazi ya fundi stadi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vipande vyembamba vya dhahabu.” Neno la Kiebrania linamaanisha vipande vya metali vilivyopigwa na kufanywa vyembamba.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakayakata kuwa vipande vyembamba.” Dhahabu ilitayarishwa kama nyuzi nyembamba za kufumwa katika nguo.
    reason: lexical_alternative
  - marker: c
    text: “Kazi ya fundi stadi” ni usemi wa kiufundi unaomaanisha kazi ya kisanii iliyofanywa kwa utaalamu; pia inaweza kutafsiriwa “kazi ya mbunifu stadi” au “kazi ya mfumaji stadi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַקְּעוּ אֶת פַּחֵי הַזָּהָב
  choice: Waliyapiga mabamba ya dhahabu mpaka yakawa membamba
  rationale: Kitenzi רקע katika ufundi wa metali kinaonyesha kupiga metali na kuifanya iwe nyembamba. Kauli hii ya Kiswahili inaeleza tendo hilo kwa kawaida bila kudokeza kwamba dhahabu iliyeyushwa.
- source_word: וְקִצֵּץ פְּתִילִם
  choice: wakayakata kuwa nyuzi
  rationale: Kiambishi cha yambwa katika “wakayakata” kinarejelea mabamba ya dhahabu, nayo פְּתִילִם hapa ni vipande vyembamba vilivyotumiwa kama nyuzi katika ufumaji.
- source_word: לַעֲשׂוֹת בְּתוֹךְ
  choice: ili wazifume pamoja na
  rationale: Katika muktadha huu dhahabu inaingizwa ndani ya vifaa vya nguo. “Wazifume pamoja na” huwasilisha kusudi la ufundi kwa Kiswahili cha kawaida, ingawa neno la Kiebrania lenyewe ni pana zaidi, “kufanya/kutengeneza ndani ya.”
- source_word: הַתְּכֵלֶת ... הָאַרְגָּמָן ... תּוֹלַעַת הַשָּׁנִי
  choice: nyuzi za buluu, zambarau na nyekundu
  rationale: Majina haya yanaashiria vifaa vilivyotiwa rangi katika muktadha wa nguo. Kutaja “nyuzi” mara moja huweka wazi maana ya kitambaa bila kurudia neno hilo kwa kila rangi.
- source_word: הַשֵּׁשׁ
  choice: kitani safi
  rationale: שֵׁשׁ katika maelezo ya Maskani ni kitani bora au laini. “Kitani safi” ni usemi unaoeleweka katika Kiswahili cha Biblia na unaonyesha ubora wa kitani.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: kazi ya fundi stadi
  rationale: Huu ni usemi wa kiufundi wa kazi iliyobuniwa na kutekelezwa kwa ustadi. “Fundi stadi” huhifadhi wazo la utaalamu bila kubana jukumu hilo kuwa la mbunifu au mfumaji pekee.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa simulizi umetumia “waka-” kwa mtiririko wa vitendo. Rangi na vifaa vimeelezwa kwa lugha ya sasa, huku tanbihi zikihifadhi uwezekano wa maana nyingine za istilahi za ufundi.
