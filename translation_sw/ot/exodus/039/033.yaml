  text: 'Then they brought the tabernacle to Moses—the tent and all its furnishings: its clasps[a], its frames, its bars, its pillars[b], and its bases.'
translation:
  language: sw
  text: 'Kisha wakaileta maskani kwa Musa—hema pamoja na vifaa vyake vyote: vifungo vyake, viunzi vyake[a], mapingo yake, nguzo zake, na vitako vyake[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbao.” Neno la Kiebrania linarejelea vipande vya wima vilivyounda muundo wa maskani.
    reason: lexical_alternative
  - marker: b
    text: Au “soketi.” Neno la Kiebrania linaweza kumaanisha sehemu za msingi ambamo viunzi au nguzo ziliwekwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: Kisha wakaileta
  rationale: Umbo la masimulizi linaendeleza hatua inayofuata; “kisha” huonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: הַמִּשְׁכָּן
  choice: maskani
  rationale: “Maskani” ni istilahi iliyozoeleka kwa makao matakatifu yanayohamishika katika kitabu cha Kutoka.
- source_word: אֶל מֹשֶׁה
  choice: kwa Musa
  rationale: Kihusishi kinaonyesha kupelekwa kwa mtu, yaani Musa.
- source_word: הָאֹהֶל
  choice: hema
  rationale: Neno hili kwa kawaida humaanisha hema; hapa linataja sehemu ya maskani bila kuongeza ufafanuzi usio katika matini.
- source_word: כָּל כֵּלָיו
  choice: vifaa vyake vyote
  rationale: “Vifaa” ni neno pana linaloweza kujumuisha vifaa na sehemu mbalimbali za ujenzi zilizoorodheshwa.
- source_word: קְרָסָיו
  choice: vifungo vyake
  rationale: Neno linarejelea vipande vya kuunganishia mapazia; “vifungo” linaeleza kazi yake kwa lugha inayoeleweka.
- source_word: קְרָשָׁיו
  choice: viunzi vyake
  rationale: Hivi ni vipande vya wima vya muundo wa maskani. “Viunzi” linaonyesha kazi ya kimuundo huku “mbao” ikihifadhiwa kama uwezekano katika tanbihi.
- source_word: בריחו
  choice: mataruma yake
  rationale: Neno linamaanisha mataruma ya mlalo yaliyoshikilia viunzi pamoja.
- source_word: עַמֻּדָיו
  choice: nguzo zake
  rationale: “Nguzo” ni tafsiri ya kawaida na wazi kwa mihimili ya wima.
- source_word: אֲדָנָיו
  choice: vitako vyake
  rationale: Katika muktadha wa maskani, neno linarejelea sehemu za msingi ambamo viunzi au nguzo ziliwekwa.
