  text: And the stones corresponded to the names of the sons of Israel[a], twelve according to their names, engraved like a signet, each according to its name[c][b], for the twelve tribes.
translation:
  language: sw
  text: Nayo mawe yalilingana na majina ya wana wa Israeli[a]; yalikuwa kumi na mawili, kulingana na majina yao, yakiwa yamechongwa kwa mtindo wa muhuri[b], kila jiwe kwa jina lake, kwa ajili ya makabila kumi na mawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yalibeba majina ya wana wa Israeli.” Kihusishi cha Kiebrania kinaweza kuonyesha uhusiano wa karibu au ulinganifu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa mchongo wa muhuri.” Kirai cha Kiebrania kinarejelea namna ya kuchonga maandishi kama yale ya muhuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: Nayo mawe
  rationale: ‘Mawe’ ni maana ya moja kwa moja katika muktadha wa kifuko cha kifuani; kiunganishi kimetafsiriwa kwa ‘nayo’ ili kuendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: yalilingana na majina ya wana wa Israeli
  rationale: עַל hapa huonyesha ulinganifu au uhusiano, si mahali tu. ‘Yalilingana na’ ni ya asili katika Kiswahili na huhifadhi maana hiyo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu jina la jadi la Kiebrania na maana yake ya ukoo bila kulibadili kuwa tu ‘Waisraeli.’
- source_word: הֵנָּה שְׁתֵּים עֶשְׂרֵה
  choice: yalikuwa kumi na mawili
  rationale: Huwasilisha wazi tamko la idadi linalosisitizwa na kiwakilishi pamoja na nambari katika Kiebrania.
- source_word: עַל שְׁמֹתָם
  choice: kulingana na majina yao
  rationale: Huhifadhi urudiaji wa muundo wa ulinganifu uliopo katika Kiebrania.
- source_word: פִּתּוּחֵי חֹתָם
  choice: lilichongwa ... kama muhuri
  rationale: Kirai kinaeleza uchongaji wa aina inayotumiwa katika muhuri; Kiswahili hiki ni wazi na cha kawaida huku kikihifadhi taswira.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: Kila moja lilichongwa jina lake
  rationale: אִישׁ imetumiwa kwa maana ya mgawanyo, ‘kila moja’; marejeo yake ni kila jiwe na jina linalolihusu.
- source_word: לִשְׁנֵים עָשָׂר שָׁבֶט
  choice: kwa ajili ya yale makabila kumi na mawili
  rationale: ל huonyesha uhusiano au uwakilishi; ‘kwa ajili ya’ huwasilisha kwa ufupi kuwa mawe hayo yaliwakilisha makabila kumi na mawili.
