translation:
  language: sw
  text: Naye akatengeneza efodi kwa dhahabu, nyuzi za rangi ya buluu, zambarau, na nyekundu angavu, na kitani safi kilichosokotwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Naye akaitengeneza
  rationale: Muundo wa wayyiqtol unaendeleza simulizi kwa tendo la wakati uliopita; kiambishi -i- kinarejelea efodi kama kitu maalumu.
- source_word: הָאֵפֹד
  choice: efodi
  rationale: Ni istilahi maalumu ya vazi la kikuhani; umbo la kutoholewa linahifadhi utambulisho wake wa kiibada bila kulipanua kwa maelezo yasiyomo katika mstari.
- source_word: זָהָב
  choice: dhahabu
  rationale: Nomino hutaja nyenzo iliyotumiwa. Mstari huu wenyewe hausemi wazi 'uzi wa dhahabu,' ingawa muktadha unaofuata unaeleza jinsi dhahabu ilivyotayarishwa.
- source_word: תְּכֵלֶת
  choice: nyuzi za rangi ya buluu
  rationale: Neno hutaja kitambaa au uzi uliotiwa rangi ya buluu katika muktadha wa nguo za patakatifu; 'nyuzi' hufanya muktadha wa ufumaji uwe wazi kwa Kiswahili cha kawaida.
- source_word: וְאַרְגָּמָן
  choice: zambarau
  rationale: Ni neno la kawaida la rangi au nyenzo ya zambarau katika maelezo ya Maskani.
- source_word: וְתוֹלַעַת שָׁנִי
  choice: nyekundu
  rationale: Kirai hiki humaanisha nyenzo iliyotiwa rangi nyekundu angavu; katika orodha hii 'nyuzi za rangi ya' iliyotangulia inaeleweka pia kwa rangi zinazofuata.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: na kitani safi kilichosokotwa
  rationale: שֵׁשׁ hutaja kitani safi, na מָשְׁזָר hukieleza kuwa kimesokotwa; tafsiri inahifadhi vipengele vyote viwili kwa mpangilio wa kawaida wa Kiswahili.
