- source_word: הַשְּׁלִישִׁי
  choice: tatu
  rationale: Kivumishi hiki cha mp序 kinaonyesha wazi safu ya tatu.
- source_word: לֶשֶׁם
  choice: lashamu
  rationale: Utambulisho wa jiwe hili la kale hauna uhakika. Umbo la kunukuu jina la Kiebrania linaepuka kudai kwa uhakika kuwa ni yakinto, kaharabu, au ligure, huku tanbihi ikieleza uwezekano huo.
- source_word: שְׁבוֹ
  choice: shabo
  rationale: Aina halisi ya kito hiki haijulikani kwa uhakika; kunukuu jina la Kiebrania kunahifadhi kutokuwa na uhakika badala ya kuchagua bila msingi thabiti kati ya agati na oniksi.
- source_word: וְאַחְלָמָה
  choice: na amethisto
  rationale: אַחְלָמָה hutambuliwa kwa kawaida kuwa amethisto; kiunganishi וְ kimewakilishwa kwa “na.”
