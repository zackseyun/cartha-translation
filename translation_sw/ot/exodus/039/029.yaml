    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַבְנֵט
  choice: mshipi
  rationale: Neno hili humaanisha mshipi wa vazi la kikuhani; “mshipi” ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: kitani safi iliyosokotwa
  rationale: Huhifadhi maana ya kitani bora pamoja na namna nyuzi zake zilivyosokotwa.
- source_word: תְכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: nyuzi za buluu, zambarau na nyekundu
  rationale: Muktadha ni wa utengenezaji wa nguo; kutaja “nyuzi” hufafanua kwamba maneno ya rangi yanarejelea vitu vilivyotiwa rangi.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: kazi ya mrembeshaji kwa taraza
  rationale: Hueleza ufundi wa kupamba kitambaa kwa nyuzi za rangi bila kuficha mkazo wa Kiebrania juu ya kazi ya fundi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: kama Yahweh alivyomwamuru Musa
  rationale: Huhifadhi fomula inayosisitiza kwamba kazi ilifanywa kwa kufuata amri ya Mungu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה; “Yahweh” hulihifadhi kama jina badala ya kutumia cheo.
