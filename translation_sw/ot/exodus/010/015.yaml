base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/015.yaml
  text: And it covered the face of the whole land[a], so that the land was darkened; and it ate every plant of the land and all the fruit of the trees that the hail had left. No green thing remained on the trees or on the plants of the field in all the land of Egypt.
translation:
  language: sw
  text: Nao wakafunika uso wa nchi yote[a], hata nchi ikawa na giza; wakala kila mmea wa nchi na matunda yote ya miti ambayo mvua ya mawe ilikuwa imeacha. Hakuna kitu chochote cha kijani kilichobaki kwenye miti wala katika mimea ya mashambani katika nchi yote ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “jicho la nchi yote,” yaani uso wa nchi unaoonekana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַס
  choice: wakafunika
  rationale: Kitenzi cha Kiebrania ni cha umoja kwa sababu nzige wanatazamwa kama kundi moja; Kiswahili cha kawaida hutumia wingi kurejelea nzige waliotajwa katika muktadha.
- source_word: עֵין כָּל הָאָרֶץ
  choice: uso wa nchi yote
  rationale: Tafsiri hii inahifadhi sitiari ya Kiebrania, neno kwa neno ‘jicho la nchi yote,’ huku ikieleweka kwa kawaida kuwa uso unaoonekana wa nchi.
- source_word: וַתֶּחְשַׁךְ הָאָרֶץ
  choice: hata nchi ikawa na giza
  rationale: Hueleza matokeo ya nzige kufunika nchi na kutoa maana ya nchi kuwa giza bila kuongeza wazo la kuwa nyeusi.
- source_word: וַיֹּאכַל
  choice: wakala
  rationale: Maana ya msingi ni ‘kula’; wingi ni wa asili katika Kiswahili kwa nzige, ingawa Kiebrania hutumia umoja wa kijumla.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: kila mmea wa nchi
  rationale: עֵשֶׂב ni pana kuliko ‘nyasi’ na inaweza kumaanisha mimea kwa ujumla.
- source_word: כָּל פְּרִי הָעֵץ
  choice: matunda yote ya miti
  rationale: Umoja wa Kiebrania עֵץ umetumika kijumla; wingi ‘miti’ ni wa kawaida na unaonyesha maana ya mgawanyo.
- source_word: אֲשֶׁר הוֹתִיר הַבָּרָד
  choice: ambayo mvua ya mawe ilikuwa imeacha
  rationale: Inarejelea matunda yaliyosalia baada ya pigo la mvua ya mawe na kuhifadhi maana ya moja kwa moja ya ‘kuacha.’
- source_word: וְלֹא נוֹתַר כָּל יֶרֶק
  choice: Hakikubaki kitu chochote cha kijani
  rationale: Huhifadhi ukanushi wenye msisitizo na maana pana ya יֶרֶק kama kitu cha kijani au uoto wa kijani.
- source_word: בָּעֵץ וּבְעֵשֶׂב הַשָּׂדֶה
  choice: juu ya miti wala miongoni mwa mimea ya mashambani
  rationale: Hutofautisha kwa kawaida vitu vilivyo juu ya miti na uoto unaopatikana mashambani, huku ‘mimea’ ikihifadhi upana wa עֵשֶׂב.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: katika nchi yote ya Misri
  rationale: Ni usemi wa kawaida wa eneo na unafuata upeo wa jumla wa Kiebrania.
