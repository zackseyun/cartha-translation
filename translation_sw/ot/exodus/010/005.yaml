base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/005.yaml
  text: And it will cover the surface of the land[a], so that one will not be able to see the land; and it will eat what remains of the survivors left to you from the hail[b], and it will eat every tree growing for you out of the field.
translation:
  language: sw
  text: Nao wataifunika uso wa nchi[a], hata mtu asiweze kuiona nchi. Watakula mabaki ya yale yaliyoponyoka, yaliyobaki kwenu baada ya mvua ya mawe[b], na watakula kila mti unaomea mashambani mwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “jicho la nchi,” nahau ya Kiebrania inayomaanisha uso wa nchi unaoonekana.
    reason: lexical_alternative
  - marker: b
    text: Au, “sehemu iliyobaki ya yale yaliyoponyoka, ambayo yamebaki kwenu baada ya mvua ya mawe.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִסָּה
  choice: Nao wataifunika
  rationale: Kitenzi כסה humaanisha kufunika au kuficha. Ingawa Kiebrania kina umoja wa kijumla kwa kundi la nzige, wingi ni wa asili zaidi katika Kiswahili na unarejelea nzige waliotajwa katika muktadha.
- source_word: עֵין הָאָרֶץ
  choice: uso wa nchi
  rationale: Kirai hiki kihalisi ni ‘jicho la nchi,’ nahau inayomaanisha sehemu ya nchi inayoonekana. ‘Uso wa nchi’ ni nahau ya Kiswahili iliyo wazi na yenye hadhi.
- source_word: וְלֹא יוּכַל לִרְאֹת אֶת הָאָרֶץ
  choice: hata mtu asiweze kuiona nchi
  rationale: Muundo wa Kiebrania una mtendaji wa umoja asiyeainishwa. ‘Mtu’ huhifadhi hali hiyo bila kugeuza nchi kuwa mtendaji wa kisarufi.
- source_word: וְאָכַל
  choice: Watakula
  rationale: אכל ni kitenzi cha kawaida ‘kula.’ Wingi wa Kiswahili unalingana na nzige kama kundi la viumbe wengi, bila kubadili maana ya umoja wa kijumla wa Kiebrania.
- source_word: יֶתֶר הַפְּלֵטָה
  choice: mabaki ya yale yaliyookoka
  rationale: Kirai kinaunganisha wazo la sehemu iliyobaki na kile kilichoponyoka uharibifu. Tafsiri hii ni ya asili na inaepuka kutumia ‘walionusurika,’ ambalo kwa kawaida huelekea kurejelea watu.
- source_word: הַנִּשְׁאֶרֶת לָכֶם מִן הַבָּרָד
  choice: ambayo yamebaki kwa ajili yenu na mvua ya mawe
  rationale: Kirai elezi kinaonyesha mazao yaliyobaki kwa Wamisri baada ya mvua ya mawe. ‘Na mvua ya mawe’ hapa hubeba maana ya kile kilichookoka athari yake.
- source_word: כָּל הָעֵץ
  choice: kila mti
  rationale: ‘Kila mti’ huhifadhi nguvu ya mgawanyo ya כל pamoja na nomino ya umoja עץ.
- source_word: הַצֹּמֵחַ לָכֶם מִן הַשָּׂדֶה
  choice: unaomea mashambani mwenu
  rationale: צמח ni kuota au kukua; לָכֶם huonyesha uhusiano au manufaa kwa Wamisri, na מן־השדה huonyesha mimea inayotokea shambani. ‘Mashambani mwenu’ ni Kiswahili cha asili kinachokusanya mawazo hayo.
