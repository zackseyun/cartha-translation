  yaml_path: translation/ot/exodus/010/022.yaml
  text: So Moses stretched out his hand toward the sky[b][a], and there was thick darkness over all the land of Egypt for three days.
translation:
  language: sw
  text: Basi Musa akaunyosha mkono wake kuelekea angani[a], kukawa na giza nene[b] katika nchi yote ya Misri kwa siku tatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuelekea mbinguni.” Neno la Kiebrania שָּׁמַיִם linaweza kumaanisha “anga” au “mbingu,” kutegemea muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au, “giza zito.” Usemi wa Kiebrania unaunganisha neno “giza” na neno jingine linalomaanisha giza kali ili kutia mkazo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: akaunyosha
  rationale: Kitenzi נטה katika muktadha wa ishara hii kina maana ya kunyoosha; umbo hili ni la kawaida na linahifadhi tendo la kimwili.
- source_word: יָדוֹ
  choice: mkono wake
  rationale: יָד kwa kawaida humaanisha mkono, na muktadha hautaki maana pana ya ‘mkono wote hadi begani’.
- source_word: עַל הַשָּׁמָיִם
  choice: kuelekea angani
  rationale: Katika muktadha wa kunyoosha mkono, עַל linaeleza mwelekeo, huku שָּׁמַיִם hapa likieleweka kwa kawaida kama anga; maana ya ‘mbinguni’ imehifadhiwa katika tanbihi.
- source_word: וַיְהִי
  choice: kukawa na
  rationale: Usemi huu unaonyesha kutokea kwa hali iliyofuata tendo la Musa na ni wa kawaida katika Kiswahili.
- source_word: חֹשֶׁךְ אֲפֵלָה
  choice: giza nene
  rationale: Muungano wa maneno mawili ya giza unasisitiza ukali wake; ‘giza nene’ ni usemi wa asili unaowasilisha msisitizo huo.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: katika nchi yote ya Misri
  rationale: Hili linafuata kihusishi cha Kiebrania na kuwasilisha kwa uwazi eneo lote lililoathiriwa.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: kwa siku tatu
  rationale: ‘Kwa’ huonyesha muda kwa Kiswahili cha kawaida bila kuongeza tafsiri nyingine.
