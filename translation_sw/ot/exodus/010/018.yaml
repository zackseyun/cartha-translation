  text: וַ/יֵּצֵ֖א מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יֶּעְתַּ֖ר אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/018.yaml
  text: So he went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: sw
  text: Basi Musa akaondoka mbele ya Farao, akamsihi Yahwe kwa bidii.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamwomba Yahwe kwa bidii.” Kitenzi cha Kiebrania kinaonyesha dua au ombi la dhati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akaondoka
  rationale: Qal wayyiqtol ya יצא inaendeleza mfululizo wa simulizi na hapa inaonyesha Musa aliondoka mahali alipokuwa Farao.
- source_word: מֵעִם פַּרְעֹה
  choice: mbele ya Farao
  rationale: מֵעִם humaanisha kuondoka alipokuwa mtu au kutoka katika uwepo wake; Kiswahili ‘akaondoka mbele ya Farao’ kinaeleza utengano huo kwa kawaida na kwa usahihi.
- source_word: וַיֶּעְתַּר
  choice: akamsihi ... kwa bidii
  rationale: Kitenzi עתר katika muktadha huu hueleza dua au ombi la dhati kwa Mungu. ‘Akamsihi ... kwa bidii’ huhifadhi uzito wa ombi bila kulifanya kuwa maelezo marefu.
- source_word: אֶל
  choice: -m- katika ‘akamsihi’
  rationale: אֶל huelekeza ombi kwa Yahwe; muundo wa Kiswahili wa kitenzi ‘kusihi’ huonyesha yule anayeombwa kwa kiambishi cha yambwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni umbo la Kiswahili linalotumiwa kutaja jina la Mungu יהוה, badala ya kulibadilisha kuwa cheo kama ‘BWANA’.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi יהוה. ‘Yahwe’ hulihifadhi kama jina, bila kulibadilisha kuwa cheo.
- issue: Maana ya וַיֶּעְתַּר kama dua
  choice: akamsihi Yahwe kwa bidii
  alternative: akamwomba Yahwe kwa bidii
  rationale: ‘Kusihi’ hudumisha wazo la ombi la dhati lililomo katika עתר, huku muktadha wa kumwelekea Mungu ukibaki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na hadhi inayofaa maandiko. Jina ‘Yahwe’ limetumiwa kama umbo la kawaida la Kiswahili; tanbihi huhifadhi uwezekano wa kutaja tendo hilo moja kwa moja kuwa sala.
