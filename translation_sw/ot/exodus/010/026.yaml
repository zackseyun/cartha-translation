  text: וְ/גַם מִקְנֵ֜/נוּ יֵלֵ֣ךְ עִמָּ֗/נוּ לֹ֤א תִשָּׁאֵר֙ פַּרְסָ֔ה כִּ֚י מִמֶּ֣/נּוּ נִקַּ֔ח לַ/עֲבֹ֖ד אֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַ/אֲנַ֣חְנוּ לֹֽא נֵדַ֗ע מַֽה נַּעֲבֹד֙ אֶת יְהוָ֔ה עַד בֹּאֵ֖/נוּ שָֽׁמָּ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/026.yaml
  text: And even our livestock will go with us; not a hoof will be left behind[a], for from them we must take to serve Yahweh our God, and we do not know with what we must serve Yahweh until we arrive there.
translation:
  language: sw
  text: Hata mifugo yetu itaenda pamoja nasi; hakuna hata ukwato mmoja utakaobaki nyuma, kwa maana kutoka katika mifugo hiyo tutachukua ili kumtumikia[a] Yahwe Mungu wetu. Nasi hatujui kwa kutumia nini tutamtumikia Yahwe mpaka tutakapofika huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kumwabudu.” Kitenzi cha Kiebrania kinaweza kumaanisha “kutumikia” au, katika muktadha huu, “kuabudu.” Vivyo hivyo katika matumizi yake ya pili katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵנוּ
  choice: mifugo yetu
  rationale: מִקְנֶה ni jina la jumla la wanyama wanaofugwa; “mifugo” huhifadhi upana huo kwa Kiswahili cha kawaida.
- source_word: יֵלֵךְ עִמָּנוּ
  choice: itaenda pamoja nasi
  rationale: Hutoa kwa njia ya kawaida mwendo wa wakati ujao pamoja na kuandamana.
- source_word: לֹא תִשָּׁאֵר פַּרְסָה
  choice: hakuna hata ukwato mmoja utakaobaki nyuma
  rationale: פַּרְסָה humaanisha “ukwato”; umoja baada ya ukanushi una mkazo, nao msemo “kubaki nyuma” unaweka wazi maana inayodokezwa.
- source_word: כִּי מִמֶּנּוּ נִקַּח
  choice: kwa maana tutachukua baadhi yake
  rationale: Kiebrania kinasema kihalisi “kutoka kwake/kwao tutachukua.” Kwa kuwa מִקְנֶה ni mkusanyo wa mifugo, “baadhi yake” huwasilisha kwa Kiswahili sanifu kitu kinachodokezwa bila kutaja aina au idadi ya wanyama.
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵינוּ
  choice: ili kumtumikia Yahwe Mungu wetu
  rationale: עבד inaweza kumaanisha kutumikia au kuabudu. “Kumtumikia” huhifadhi maana pana na urudiaji wa kitenzi katika mstari.
- source_word: וַאֲנַחְנוּ לֹא נֵדַע
  choice: Nasi hatujui
  rationale: Kauli hii inaonyesha kutokujua kwa sasa kuhusu huduma itakayofanyika baada ya safari.
- source_word: מַה נַּעֲבֹד אֶת יְהוָה
  choice: tutamtumikia Yahwe kwa nini
  rationale: מַה inaeleweka hapa kwa maana ya kifaa au kitu kitakachotumiwa. “Kwa nini” hapa ni muundo wa Kiswahili wa kuuliza watamtumikia kwa kutumia nini, huku muktadha ukizuia maana ya kuuliza sababu.
- source_word: עַד בֹּאֵנוּ שָׁמָּה
  choice: mpaka tutakapofika huko
  rationale: בוא pamoja na שָׁמָּה huonyesha kufika katika mahali palipokusudiwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Maana ya עבד katika muktadha wa dhabihu na ibada
  choice: kumtumikia Yahwe
  alternative: kumwabudu Yahwe
  rationale: Muktadha unahusu ibada yenye dhabihu, kwa hiyo “kumwabudu” inawezekana. Hata hivyo, “kumtumikia” huhifadhi maana pana ya kitenzi na urudiaji wake mara mbili bila kuifungia katika tendo la ibada pekee.
- issue: Maana ya מַה katika kauli מַה נַּעֲבֹד
  choice: tutamtumikia Yahwe kwa nini
  alternative: tutamtumikia Yahwe kwa namna gani
  rationale: Muktadha wa mifugo unaelekeza kwenye kitu kitakachotumiwa katika huduma, lakini Kiebrania kinaweza kusikika kwa upana zaidi. Tafsiri kuu inahifadhi maana ya kifaa inayofaa muktadha bila kutaja moja kwa moja dhabihu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “hakuna hata ukwato mmoja” unahifadhi mkazo wa Kiebrania. “Kwa nini” limetumiwa kwa maana ya “kwa kutumia nini,” si kuuliza sababu; muktadha wa mifugo unaifanya maana hiyo iwe wazi.
