translation:
  language: sw
  text: Kwa maana ukikataa kuwaachilia watu wangu waende, tazama, kesho nitaleta nzige[a] ndani ya mipaka yako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania אַרְבֶּה ni umoja kwa umbo, lakini hutumiwa kwa maana ya mkusanyiko; hivyo, “nzige.”
    reason: lexical_alternative
