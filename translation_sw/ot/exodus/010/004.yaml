lexical_decisions:
- source_word: כִּי אִם
  choice: Kwa maana kama
  rationale: Muunganiko huu unatoa onyo lenye sharti linalotegemea maneno yaliyotangulia; “kwa maana” huhifadhi uhusiano wa sababu au mwendelezo, na “kama” huonyesha sharti.
- source_word: מָאֵן
  choice: ukikataa
  rationale: Kitenzi hiki kinaonyesha kukataa kwa makusudi, si kutoweza au kusita tu.
- source_word: לְשַׁלֵּחַ
  choice: kuwaachilia ... waende
  rationale: Katika muktadha wa Kutoka, usemi huu humaanisha kuwaruhusu watu waondoke; tafsiri hii ni ya kawaida na huhifadhi wazo la kuachiliwa.
- source_word: עַמִּי
  choice: watu wangu
  rationale: Huhifadhi usemi mfupi wa umiliki na msisitizo wake wa agano.
- source_word: הִנְנִי
  choice: tazama
  rationale: Neno hili huvuta fikira kwa uzito na kusisitiza kwamba tangazo linalofuata ni la karibu na hakika.
- source_word: מֵבִיא
  choice: nitaleta
  rationale: Ingawa ni umbo la kitenzi-shirikishi, likiwa pamoja na הִנְנִי linaonyesha tendo la wakati ujao lililo karibu; “nitaleta” ni wazi na la kawaida katika Kiswahili.
- source_word: מָחָר
  choice: kesho
  rationale: Ni kielezi cha wakati kinachotaja moja kwa moja muda wa pigo.
- source_word: אַרְבֶּה
  choice: nzige
  rationale: Neno la Kiebrania lina umbo la umoja lakini hutumiwa kwa maana ya mkusanyiko; “nzige” huwasilisha maana hiyo kiasili katika Kiswahili bila kulazimisha wazo la kundi moja maalumu.
- source_word: בִּגְבֻלֶךָ
  choice: katika eneo lako
  rationale: גְּבוּל inaweza kumaanisha mpaka au eneo lililo ndani ya mipaka. “Katika eneo lako” ni ya asili na huhifadhi rejeo la milki ya Farao bila kupanua maana kuwa “nchi” kwa ujumla.
