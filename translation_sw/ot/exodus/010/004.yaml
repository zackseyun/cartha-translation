    rationale: In "Kwa maana kama ukikataa," both "kama" and the -ki- verb form mark the condition. Removing "kama" yields a more idiomatic conditional without any loss of meaning.
  - severity: medium
    issue: Generic rendering of גְּבוּלֶךָ
    rationale: '"Eneo lako" is broader than the Hebrew term for border, boundary, or territory. "Ndani ya mipaka yako" preserves the boundary-oriented sense and remains natural in the warning context.'
  - severity: low
    issue: No target-language footnote anchors for salient lexical matters
    rationale: The collective use of אַרְבֶּה and the border/territory nuance of גְּבוּלֶךָ can be retained transparently with anchors placed on the relevant Swahili words.
