  verdict: revise
  source_fidelity: Draft accurately conveys the deliberate refusal, release of God's people, solemn warning, timing, and threatened arrival of locusts. However, "eneo lako" weakens גְּבוּלֶךָ, which specifically evokes Pharaoh's borders/territory.
  naturalness: '"Kwa maana kama ukikataa" is understandable but somewhat redundant, since the conditional -ki- form already carries "if." "Kwa maana ukikataa" is smoother Standard East African Swahili while retaining the conditional warning.'
  terminology: '"Nzige" is the standard term and works collectively in Swahili. "Mipaka yako" more directly reflects גְּבוּלֶךָ than the generic "eneo lako." "Tazama" fittingly retains the elevated, solemn register of הִנְנִי.'
  issues:
