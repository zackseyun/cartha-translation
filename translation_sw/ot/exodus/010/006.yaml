base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/006.yaml
  text: And they will fill your houses[a], the houses of all your servants[b], and the houses of all Egypt—something your fathers and your fathers’ fathers have not seen from the day they were on the land until this day.” Then he turned and went out from Pharaoh.
translation:
  language: sw
  text: Nao watazijaza nyumba zako, nyumba za watumishi wako wote, na nyumba za Misri yote—jambo ambalo[a] baba zako na mababu zako hawajawahi kuliona tangu siku walipoanza kuwapo duniani[b] mpaka leo.” Kisha akageuka, akatoka kwa Farao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi, “ambalo baba zako na mababu zako hawajawahi kuliona.” Kishazi hiki kinaeleza tauni isiyo na kifani iliyotangazwa hapo kabla.
    reason: lexical_alternative
  - marker: b
    text: “Duniani” pia inaweza kutafsiriwa “juu ya ardhi” au “juu ya nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָלְאוּ
  choice: Nao watazijaza
  rationale: Kitenzi cha Kiebrania kinaendeleza tangazo la wakati ujao katika muktadha uliotangulia; kiima kinachoeleweka ni nzige. Umbo tendaji ni la kawaida na wazi katika Kiswahili.
- source_word: בָתֶּיךָ ... וּבָתֵּי כָל עֲבָדֶיךָ ... וּבָתֵּי כָל מִצְרַיִם
  choice: nyumba zako, nyumba za watumishi wako wote, na nyumba za Misri yote
  rationale: Urudiaji na upanuzi wa hatua kwa hatua kutoka kwa Farao, hadi watumishi wake, kisha Misri yote umehifadhiwa.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Katika mazingira ya ikulu neno hili linaweza kuwahusu watumishi au maafisa wa Farao; “watumishi” hudumisha upana wa maana bila kuwafanya lazima kuwa watumwa.
- source_word: אֲשֶׁר לֹא רָאוּ
  choice: jambo ambalo ... hawajawahi kuliona
  rationale: “Jambo” limeongezwa ili Kiswahili kiwe cha kawaida na ili ionekane kuwa kishazi hiki kinaeleza tukio la tauni ambalo halikuwa limewahi kuonekana.
- source_word: אֲבֹתֶיךָ וַאֲבֹת אֲבֹתֶיךָ
  choice: baba zako na mababu zako
  rationale: Hii ni kauli ya asili katika Kiswahili kwa vizazi vilivyotangulia; “mababu” hapa si lazima iwe kizazi kimoja tu.
- source_word: מִיּוֹם הֱיוֹתָם עַל הָאֲדָמָה
  choice: tangu siku walipoanza kuwapo katika nchi
  rationale: Kauli hii huhifadhi mwanzo wa kuwapo kwa vizazi hivyo katika nchi, huku ikibaki ya kawaida na kueleweka kwa wasomaji wa leo.
- source_word: הָאֲדָמָה
  choice: nchi
  rationale: Neno la Kiebrania linaweza kumaanisha nchi, dunia, au ardhi; “nchi” linafaa katika muktadha huu bila kufunga kabisa uwezekano mwingine, ambao umeonyeshwa katika tanbihi.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Hii ni nahau ya kawaida ya Kiswahili inayowasilisha kwa uwazi maana ya “mpaka siku hii.”
- source_word: וַיִּפֶן וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: Kisha akageuka, akaondoka mbele ya Farao
  rationale: Vitenzi viwili mfululizo vimehifadhi tendo la kugeuka na kuondoka; “mbele ya Farao” huonyesha kuondoka kutoka alipokuwa Farao kwa lugha ya kawaida ya simulizi.
