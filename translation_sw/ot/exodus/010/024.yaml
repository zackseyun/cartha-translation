reference: Exodus 10:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה אֶל מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ לְכוּ֙ עִבְד֣וּ אֶת יְהוָ֔ה רַ֛ק צֹאנְ/כֶ֥ם וּ/בְקַרְ/כֶ֖ם יֻצָּ֑ג גַּֽם טַפְּ/כֶ֖ם יֵלֵ֥ךְ עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/024.yaml
  text: Then Pharaoh called to Moses and said[a], “Go, serve Yahweh. Only let your flocks and your herds remain behind[b]; even your little ones may go with you.”
translation:
  language: sw
  text: Ndipo Farao akamwita Musa, akasema, “Nendeni mkamtumikie Yahwe. Ila makundi yenu ya kondoo na mbuzi, na makundi yenu ya ng’ombe, yabaki[a]. Hata watoto wenu wadogo[b] nao waende pamoja nanyi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yaachwe.”
    reason: lexical_alternative
  - marker: b
    text: Au, “watoto wenu”; neno la Kiebrania linaweza pia kujumuisha wategemezi wa familia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: Katika muktadha huu קרא ina maana ya kumwita mtu ili aseme naye; ‘akamwita’ ni ya kawaida na haiingizi wazo lenye nguvu zaidi la kumwagiza aitwe rasmi.
- source_word: פַרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la cheo hiki katika Kiswahili cha Biblia.
- source_word: אֶל מֹשֶׁה
  choice: Musa
  rationale: Kirai chenye אֶל kinaonyesha mtu aliyeitwa; katika Kiswahili maana hiyo huwasilishwa kwa kiambishi cha yambwa katika ‘akamwita Musa.’
- source_word: לְכוּ
  choice: Nendeni
  rationale: Ni amri ya wingi, kwa hiyo ‘Nendeni’ huhifadhi wazi kwamba ruhusa inawahusu Musa na wenzake.
- source_word: עִבְדוּ אֶת יְהוָה
  choice: mkamtumikie Yahwe
  rationale: ‘Kumtumikia’ ni kisawe cha moja kwa moja cha עבד na huhifadhi dhamira inayorudiwa katika Kutoka ya Israeli kumtumikia Yahwe badala ya Farao; ‘mka-’ huunganisha kwenda na kusudi lake kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama ‘BWANA.’
- source_word: רַק
  choice: Ila
  rationale: Neno hili linaonyesha sharti linaloweka mpaka katika ruhusa ya Farao; ‘Ila’ ni la asili katika usemi huu.
- source_word: צֹאנְכֶם
  choice: makundi yenu ya kondoo na mbuzi
  rationale: צֹאן ni mifugo midogo kwa ujumla, hasa kondoo na mbuzi; kutaja wanyama hao huepuka utata wa ‘makundi’ pekee.
- source_word: וּבְקַרְכֶם
  choice: na makundi yenu ya ng’ombe
  rationale: בקר humaanisha mifugo mikubwa, hasa ng’ombe; usemi huu unaonyesha maana hiyo ya kijumla kwa uwazi.
- source_word: יֻצָּג
  choice: yabaki
  rationale: Hophal ya יצג hapa inaonyesha mifugo kuachwa mahali ilipo. ‘Yabaki’ ni ya kawaida na huhifadhi hali inayotakiwa na Farao bila kuongeza kwa lazima maneno ‘nyuma.’
- source_word: גַּם
  choice: Hata
  rationale: ‘Hata’ huonyesha msisitizo wa ruhusa ya Farao kwamba watoto pia wanaruhusiwa kwenda.
- source_word: טַפְּכֶם
  choice: watoto wenu wadogo
  rationale: טַף hurejelea watoto wadogo au wategemezi wa familia; chaguo hili huhifadhi maana ya msingi huku dokezo likionyesha chaguo pana zaidi.
- source_word: יֵלֵךְ עִמָּכֶם
  choice: wanaweza kwenda pamoja nanyi
  rationale: 'Ingawa kitenzi cha Kiebrania ni umbo la kutokamilika linaloweza kutafsiriwa kwa kauli ya wakati ujao, hapa katika ruhusa ya Farao kina nguvu ya kuruhusu: ‘wanaweza kwenda.’'
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha na cheo, bila kuingiza msimamo wa kimadhehebu.
- issue: Maana ya עבד katika agizo la Farao
  choice: mkamtumikie
  alternative: mkamwabudu
  rationale: ‘Kumtumikia’ huhifadhi upana wa maana ya עבד na dhamira ya kitabu cha Kutoka; ‘kuabudu’ ni maana inayowezekana lakini ingeifanya maana kuwa finyu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi ‘Ndipo ... akasema’ ni wa kawaida na unaosomeka kwa urahisi. ‘Pamoja nanyi’ limetumiwa badala ya ‘pamoja na nyinyi’ kwa mtindo dignified lakini unaoeleweka.
