    issue: “wanaweza kwenda” may suggest ability rather than granted permission/instruction.
    rationale: The clause גַּם טַפְּכֶם יֵלֵךְ עִמָּכֶם follows Pharaoh’s concession and is better represented by a permissive/subjunctive form such as “nao waende pamoja nanyi.”
