lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Ka- ya masimulizi huendeleza mfuatano wa matukio kwa kawaida katika Kiswahili bila kulazimisha kiunganishi tofauti.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia ya Kiswahili.
- source_word: כֵּן דִּבַּרְתָּ
  choice: Umesema hivyo
  rationale: Kauli hii inaonyesha kwamba Musa anakubaliana na maneno ya Farao; tafsiri hii ni ya kawaida na huhifadhi maana ya ‘kama/hivyo ulivyosema.’
- source_word: לֹא אֹסִף עוֹד
  choice: sita… tena
  rationale: Muundo wa Kiebrania wenye kukanusha יסף pamoja na עוֹד ni nahau ya kutorudia tendo; ‘sita… tena’ hutoa maana hiyo bila kuongeza msisitizo usio wa lazima.
- source_word: רְאוֹת
  choice: ona
  rationale: Kitenzi hiki kinawakilisha kwa uwazi tendo la kuona ambalo halitarudiwa.
- source_word: פָּנֶיךָ
  choice: uso wako
  rationale: Huhifadhi picha halisi ya Kiebrania; katika muktadha huu pia inadokeza kukutana ana kwa ana bila kubadilishwa kuwa neno la kufasiri kama ‘uwepo wako.’
