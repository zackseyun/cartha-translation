  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה גַּם אַתָּ֛ה תִּתֵּ֥ן בְּ/יָדֵ֖/נוּ זְבָחִ֣ים וְ/עֹל֑וֹת וְ/עָשִׂ֖ינוּ לַ/יהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/025.yaml
  text: But Moses said[a], “You also must give into our hands sacrifices and burnt offerings, and we will offer them to Yahweh our God.”
translation:
  language: sw
  text: Lakini Musa akasema, “Wewe pia lazima utupe dhabihu na sadaka za kuteketezwa, nasi tutazitoa kwa Yahwe[a], Mungu wetu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH, jina la Mungu; mara nyingi hutafsiriwa “BWANA.”'
    reason: Hufafanua jina la Mungu lililo katika maandishi ya Kiebrania na kutaja tafsiri mbadala iliyozoeleka.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini Musa akasema
  rationale: Waw-consecutive inaendeleza simulizi, lakini muktadha unaonyesha jibu linalopinga sharti la Farao katika mstari uliotangulia; kwa hiyo “Lakini” linafaa kwa Kiswahili cha kawaida.
- source_word: גַּם אַתָּה
  choice: Wewe pia
  rationale: Kiwakilishi huru אַתָּה kinasisitiza kwamba Farao mwenyewe pia anapaswa kutoa vinavyohitajika; mpangilio huu unahifadhi msisitizo huo kwa njia ya asili.
- source_word: תִּתֵּן בְּיָדֵנוּ
  choice: lazima utupe
  rationale: נתן ni “kutoa/kutia,” na בְּיָדֵנוּ kwa maana halisi ni “mikononi mwetu.” Kiswahili “utupe” kinawasilisha kwa uwazi tendo la kukabidhi, huku “lazima” likionyesha nguvu ya dai la Musa katika muktadha.
- source_word: זְבָחִים
  choice: dhabihu
  rationale: Neno hili humaanisha dhabihu zinazotolewa kwa kuchinja; “dhabihu” ni neno pana, linaloeleweka na linalofaa katika jozi hii.
- source_word: וְעֹלֹת
  choice: na sadaka za kuteketezwa
  rationale: עֹלָה ni sadaka iliyoteketezwa yote madhabahuni. Tafsiri hii inaitofautisha wazi na זְבָחִים.
- source_word: וְעָשִׂינוּ
  choice: nasi tutazitoa
  rationale: Ingawa maana ya msingi ni “tutafanya,” katika muktadha wa dhabihu עשה humaanisha kutekeleza au kutoa dhabihu. Kiwakilishi “-zi-” kinarejelea dhabihu na sadaka zilizotajwa.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: kwa Yahwe, Mungu wetu
  rationale: לְ humtambulisha mpokeaji wa dhabihu, na אֱלֹהֵינוּ ni “Mungu wetu.” Jina la agano יְהוָה limetolewa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu lenye herufi nne. “Yahwe” huhifadhi jina hilo katika matini kuu, huku tanbihi ikieleza mapokeo mengine ya kulitafsiri kwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Utupe” limetumiwa badala ya msemo mzito wa neno kwa neno “utie mikononi mwetu,” na tofauti kati ya dhabihu kwa jumla na sadaka za kuteketezwa imehifadhiwa.
