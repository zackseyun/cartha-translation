base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/003.yaml
  text: 'So Moses and Aaron went in to Pharaoh and said to him[a], “Thus says Yahweh, the God of the Hebrews: How long will you refuse to humble yourself before me? Let my people go[b], so that they may serve me.”'
translation:
  language: sw
  text: 'Basi Musa na Aroni wakaenda kwa Farao wakamwambia, “Yahwe, Mungu wa Waebrania, asema hivi: ‘Mpaka lini utakataa kujinyenyekeza mbele zangu?[a] Waache watu wangu waende ili wanitumikie.[b]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwa mnyenyekevu mbele zangu” au “kujisalimisha kwangu.” Kitenzi cha Kiebrania kinaweza kumaanisha kunyenyekeshwa au kujinyenyekeza mbele za Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au “ili waniabudu.” Kitenzi cha Kiebrania kinahusu kutumikia na kinaweza pia kumaanisha huduma ya kiibada au kuabudu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: wakaenda kwa
  rationale: Katika simulizi hili, בוא pamoja na אֶל huonyesha kwenda kwa mtu au kuingia mbele yake. ‘Wakaenda kwa Farao’ ni Kiswahili cha kawaida kinachoweka wazi kwamba Farao ndiye walikokwenda, bila kuongeza maelezo yasiyomo.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Hii ni fomula ya mjumbe anayeanzisha ujumbe wa Mungu. ‘Asema hivi’ hudumisha nguvu ya usemi wa sasa na ni ya asili katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama jina binafsi ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: Mungu wa Waebrania
  rationale: Muundo huu unamtambulisha Yahwe kwa uhusiano wake na Waebrania katika mazingira ya Misri.
- source_word: עַד מָתַי
  choice: Mpaka lini
  rationale: Ni changamoto ya muda; ‘Mpaka lini’ ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: מֵאַנְתָּ לֵעָנֹת
  choice: utakataa kujinyenyekeza
  rationale: Kitenzi cha kwanza kinaeleza kukataa kunakoendelea, na לֵעָנֹת hapa kinaweza kueleweka kama kujishusha au kujinyenyekeza mbele za Mungu. Tafsiri hii inadumisha wito wa mkao wa unyenyekevu, si utiifu wa nje tu.
- source_word: מִפָּנָי
  choice: mbele zangu
  rationale: Ingawa kihalisi huhusisha ‘uso/uwepo,’ katika muundo huu ni nahau yenye maana ya kuwa mbele ya Mungu.
- source_word: שַׁלַּח עַמִּי
  choice: Waache watu wangu waende
  rationale: Hili ni dai linalorudiwa katika simulizi la Kutoka. Tafsiri hii ni ya kawaida na inaonyesha kuwaruhusu waondoke.
- source_word: וְיַעַבְדֻנִי
  choice: ili wanitumikie
  rationale: עבד ina maana pana ya kutumikia na katika muktadha huu inajumuisha ibada. ‘Wanitumikie’ huhifadhi upana huo kuliko ‘waniabudu’ pekee.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לֵעָנֹת mbele za Mungu
  choice: kujinyenyekeza mbele zangu
  alternative: kutiishwa mbele zangu / kujisalimisha kwangu
  rationale: Umbo la Kiebrania linaweza kuonyesha kutiishwa au mtu kujinyenyekeza. Muktadha unamkabili Farao kuhusu kukataa kwake, lakini utata wa kileksika umeonyeshwa katika tanbihi badala ya kufutwa.
- issue: Maana ya וְיַעַבְדֻנִי katika dai la Kutoka
  choice: ili wanitumikie
  alternative: ili waniabudu
  rationale: Kitenzi kinaweza kumaanisha huduma kwa ujumla na pia huduma ya kiibada. ‘Wanitumikie’ huhifadhi maana pana huku tanbihi ikitaja maana ya ibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Nukuu ya ndani imetumiwa kuonyesha wazi kwamba Musa na Aroni wanawasilisha maneno ya Yahwe.
