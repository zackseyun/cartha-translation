review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies Pharaoh, Moses, Aaron, Yahweh, and the second-person plural possessive in “Mungu wenu.” However, “Nimemtendea dhambi Yahwe, Mungu wenu, na pia ninyi” has a singular object marker attached to Yahweh and leaves the coordinated offense against Moses and Aaron grammatically and semantically unclear. The Hebrew states explicitly that Pharaoh has sinned against Yahweh and against them.
  naturalness: “Akafanya haraka kuwaita” is understandable and suitably conveys urgency. The confession is less natural as drafted because “nimemtendea dhambi” is singular and “na pia ninyi” does not clearly complete the same verbal construction. Repeating “dhidi ya” produces clear, standard modern East African Swahili.
  terminology: “Farao,” “Musa,” “Aroni,” “Yahwe,” and “Mungu wenu” are appropriate. “Kutenda dhambi dhidi ya” retains the moral-theological force of חָטָאתִי and idiomatically expresses the offended parties without introducing interpretive content.
  issues:
  - severity: medium
    issue: 'The confession uses singular object marking and an unclear elliptical coordination: “Nimemtendea dhambi Yahwe ... na pia ninyi.”'
    rationale: 'The source distinguishes two targets of Pharaoh’s sin: Yahweh and Moses and Aaron (both plural). The Swahili should state both relationships clearly; otherwise the offense against Moses and Aaron is not fully and naturally expressed.'
  revised_text: Ndipo Farao akafanya haraka kuwaita Musa na Aroni, akasema, “Nimetenda dhambi dhidi ya Yahwe, Mungu wenu, na dhidi yenu.”
