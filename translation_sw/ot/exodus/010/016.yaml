  text: וַ/יְמַהֵ֣ר פַּרְעֹ֔ה לִ/קְרֹ֖א לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֑ן וַ/יֹּ֗אמֶר חָטָ֛אתִי לַ/יהוָ֥ה אֱלֹֽהֵי/כֶ֖ם וְ/לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/016.yaml
  text: Then Pharaoh hurried to call for Moses and Aaron, and he said, “I have sinned against Yahweh your God and against you.”
translation:
  language: sw
  text: Ndipo Farao akafanya haraka kuwaita Musa na Aroni, akasema, “Nimetenda dhambi dhidi ya Yahwe, Mungu wenu, na dhidi yenu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: akafanya haraka
  rationale: Kitenzi מהר kinaonyesha kutenda kwa haraka; usemi huu ni wa kawaida katika Kiswahili na unahifadhi hali ya uharaka.
- source_word: לִקְרֹא
  choice: kuwaita
  rationale: Katika muktadha huu maana ni kuagiza Musa na Aroni waje mbele ya Farao; “kuwaita” ni ya asili na haiongezi wazo lisilokuwapo wazi kama “kuwaita waje.”
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la cheo hiki katika Kiswahili cha Biblia.
- source_word: לְמֹשֶׁה וּלְאַהֲרֹן
  choice: Musa na Aroni
  rationale: Kiambishi cha yambwa katika “kuwaita” kinawakilisha uhusiano wa kisarufi unaoonyeshwa na לְ, huku majina yakitolewa kwa maumbo yaliyozoeleka katika Kiswahili.
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Muundo huu unaendeleza simulizi kwa kawaida na kuanzisha maneno ya moja kwa moja.
- source_word: חָטָאתִי
  choice: Nimemtendea dhambi
  rationale: חטא ina maana ya kutenda dhambi. Muundo huu wa Kiswahili unaweka wazi aliyekosewa na kuhifadhi uzito wa kimaadili na kitheolojia.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Baada ya “nimemtendea dhambi,” jina hili linaonyesha aliyekosewa. Jina la agano יהוה limetolewa moja kwa moja kama “Yahwe.”
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Kiambishi cha nafsi ya pili wingi kinahifadhiwa; Farao anamwita Yahwe Mungu wa Musa na Aroni, si Mungu wake mwenyewe.
- source_word: וְלָכֶם
  choice: na pia ninyi
  rationale: Neno “ninyi” ni la wingi na linawarejelea Musa na Aroni. “Pia” linaonyesha kuwa kitenzi “nimemtendea dhambi” kinatumika tena kwao bila kurudiwa kwa namna nzito.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Kauli ya Farao kuhusu dhambi yake
  choice: Nimemtendea dhambi Yahwe, Mungu wenu, na pia ninyi
  alternative: Nimekosa mbele za Yahwe, Mungu wenu, na mbele yenu
  rationale: Kihusishi ל baada ya חטא kinamtambulisha aliyekosewa. “Kumtendea dhambi” ni Kiswahili cha asili kinachohifadhi maana ya kumkosea Mungu na watu hao bila kudhoofisha neno “dhambi.”
- issue: Uhusiano wa Yahwe na Musa na Aroni katika kauli ya Farao
  choice: Mungu wenu
  alternative: Mungu wetu
  rationale: אֱלֹהֵיכֶם ina kiambishi cha nafsi ya pili wingi. Tafsiri haibadili kauli ya Farao kuwa ungamo kwamba Yahwe ni Mungu wake pia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “akafanya haraka kuwaita” unahifadhi uharaka wa simulizi, na “nimemtendea dhambi” ni wa kawaida kuliko uhamishaji wa moja kwa moja “nimefanya dhambi dhidi ya.”
