revisions:
- from: Ndipo Farao akafanya haraka kuwaita Musa na Aroni, akasema, “Nimemtendea dhambi Yahwe, Mungu wenu, na pia ninyi.”
  to: Ndipo Farao akafanya haraka kuwaita Musa na Aroni, akasema, “Nimetenda dhambi dhidi ya Yahwe, Mungu wenu, na dhidi yenu.”
  rationale: The revision preserves the narrative urgency and all participants while replacing the unclear singular construction with an explicit, idiomatic rendering of Pharaoh’s confession. The repeated “dhidi ya” faithfully represents the two coordinated parties against whom he acknowledges sinning, and “yenu” preserves the Hebrew plural address to Moses and Aaron.
  reviewer_model: gpt-5.6-terra
