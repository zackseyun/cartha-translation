  terminology: '“Yahweh,” “moyo,” and “Farao” are appropriate and consistent. The lexical-alternative footnote needs a small grammatical and semantic refinement: “kuwa imara/na nguvu” is not a well-formed parallel alternative following “aliufanya moyo ...,” and “na nguvu” is less precise than an adjective describing the heart.'
