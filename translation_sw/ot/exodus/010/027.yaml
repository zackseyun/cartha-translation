base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/027.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he was not willing to let them go.
translation:
  language: sw
  text: Lakini Yahweh aliufanya moyo wa Farao kuwa mgumu[a], naye hakutaka kuwaacha waende[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliufanya moyo wa Farao kuwa imara au wenye nguvu.” Kitenzi cha Kiebrania kinaweza kumaanisha “kutia nguvu” au “kufanya imara,” lakini katika muktadha huu pamoja na “moyo” kinabeba maana ya kuufanya kuwa mgumu.
    reason: lexical_alternative
  - marker: b
    text: Au, “alikataa kuwaacha waende.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: aliufanya ... kuwa mgumu
  rationale: Kitenzi חזק kwa msingi humaanisha kutia nguvu au kufanya imara, lakini katika muundo unaorudiwa wa Kutoka pamoja na “moyo” humaanisha kufanya moyo kuwa mgumu au kuimarisha ukaidi. Tafsiri hii ni ya kawaida na wazi kwa Kiswahili, huku tanbihi ikihifadhi maana mbadala ya msingi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa kwa cheo kama “BWANA,” ili kuhifadhi jina binafsi katika maandishi ya Kiebrania.
- source_word: לֵב
  choice: moyo
  rationale: “Moyo” ndiyo tafsiri ya kawaida ya לֵב na hapa inahusu pia nia na msimamo wa ndani, hivyo inadumisha nahau ya kibiblia.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la Kiswahili la cheo cha kifalme cha Misri.
- source_word: לֹא אָבָה
  choice: hakutaka
  rationale: אָבָה hueleza kutaka, kukubali, au kuwa tayari. “Hakutaka” huonyesha moja kwa moja kutokuwa tayari kwa Farao bila kuongeza kiunganishi cha kisababishi.
- source_word: לְשַׁלְּחָם
  choice: kuwaacha waende
  rationale: Katika muktadha wa Kutoka, שׁלח humaanisha kuwaruhusu Waisraeli waondoke. “Kuwaacha waende” ni Kiswahili cha kawaida na hudumisha usemi unaorudiwa katika simulizi.
theological_decisions:
- issue: Mungu kuufanya moyo kuwa mgumu na uwajibikaji wa Farao
  choice: 'Kauli zote mbili zimetafsiriwa sambamba: Yahweh aliufanya moyo wa Farao kuwa mgumu, naye Farao hakutaka kuwaacha waende.'
  alternative: Yahweh aliutia nguvu moyo wa Farao, kwa hiyo akakataa kuwaacha waende.
  rationale: Kiebrania kinahusisha tendo la kuufanya moyo kuwa mgumu moja kwa moja na Yahweh, kisha kinataja kutotaka kwa Farao. “Naye” huhifadhi kauli hizi zote mbili bila kuzifanya wazi kuwa uhusiano wa sababu na matokeo, hivyo mvutano wa kitheolojia unabaki kama ulivyo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa msomaji wa kawaida. Mpangilio wa viashiria [a] na [b] umewekwa karibu na maneno yanayofafanuliwa, na viunganishi vimechaguliwa ili kutodokeza sababu ambayo haijaelezwa wazi katika Kiebrania.
