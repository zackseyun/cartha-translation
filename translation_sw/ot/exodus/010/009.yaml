review_pass:
  verdict: revise
  source_fidelity: 'The repeated “we will go” and the inclusive sequence of young/old, sons/daughters, flocks/herds are retained. אולם, “tuna sikukuu ya kumwabudu BWANA” shifts the final nominal clause toward a general statement that they have a worship festival. In context, חַג יהוה לנו expresses the grounds for their departure: they are to observe/hold a festival for YHWH. “Tunapaswa kumfanyia BWANA sikukuu” conveys this force without treating the Hebrew as though it contained a separate explicit modal verb.'
  naturalness: The proposed revision is idiomatic Standard East African Swahili and retains the formal but accessible biblical register. “Mifugo yetu ya kondoo na mbuzi” and “ng’ombe wetu” are more economical and natural than repeating “makundi yetu.”
  terminology: “BWANA” appropriately follows established Swahili Bible convention for יהוה. “Kumfanyia BWANA sikukuu” accurately represents a feast held for YHWH and avoids narrowing חַג to worship alone.
  issues:
  - severity: medium
    issue: The final clause is semantically narrowed and weakens the contextual obligation.
    rationale: “Tuna sikukuu ya kumwabudu BWANA” can mean merely “we have a festival for worshipping the LORD.” The Hebrew חג יהוה לנו, in Moses’ explanation to Pharaoh, denotes the festival they must hold for YHWH.
  revised_text: Mose akasema, “Tutaenda pamoja na vijana wetu na wazee wetu; tutaenda pamoja na wana wetu na binti zetu, pamoja na mifugo yetu ya kondoo na mbuzi na ng’ombe wetu, kwa maana tunapaswa kumfanyia BWANA sikukuu.”
