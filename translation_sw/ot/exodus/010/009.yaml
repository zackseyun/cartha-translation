base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/009.yaml
  text: Moses said, “We will go with our young and our old; we will go with our sons and our daughters, with our flocks and our herds, because we must hold a feast to the LORD.”
translation:
  language: sw
  text: Mose akasema, “Tutaenda pamoja na vijana wetu na wazee wetu; tutaenda pamoja na wana wetu na binti zetu, pamoja na mifugo yetu ya kondoo na mbuzi na ng’ombe wetu, kwa maana tunapaswa kumfanyia BWANA sikukuu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְעָרֵינוּ
  choice: pamoja na vijana wetu
  rationale: Neno נַעַר linaweza kumaanisha kijana au mtoto kulingana na muktadha; hapa linawekwa sambamba na ‘wazee wetu,’ hivyo ‘vijana wetu’ huhifadhi ulinganifu huo wa vizazi.
- source_word: בְּצֹאנֵנוּ
  choice: pamoja na makundi yetu ya kondoo na mbuzi
  rationale: צֹאן ni jina la pamoja linalohusu mifugo midogo, hasa kondoo na mbuzi; kutaja zote mbili huwasilisha maana yake kwa uwazi katika Kiswahili.
- source_word: וּבִבְקָרֵנוּ
  choice: na makundi yetu ya ng’ombe
  rationale: בָּקָר humaanisha ng’ombe kama kundi la mifugo mikubwa, si ‘mifugo’ kwa ujumla.
- source_word: חַג יְהוָה לָנוּ
  choice: tuna sikukuu ya kumwabudu BWANA
  rationale: חַג ni sikukuu ya kidini, na muundo wenye לַיהוָה unaonyesha kuwa sikukuu hiyo ni kwa ajili ya BWANA. ‘Kumwabudu’ huifanya dhima hiyo ieleweke kiasili bila kuongeza dai la ulazima ambalo halijaelezwa moja kwa moja na Kiebrania.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ kwa herufi kubwa hufuata desturi pana ya tafsiri za Biblia za Kiswahili na kutofautisha jina la agano na neno la kawaida ‘Bwana,’ bila kulazimisha matamshi yaliyorejelewa.
- issue: Nguvu ya kishazi כִּי חַג יְהוָה לָנוּ
  choice: kwa sababu tuna sikukuu ya kumwabudu BWANA
  alternative: kwa sababu lazima tumfanyie BWANA sikukuu
  rationale: Kiebrania kinasema kihalisi kuwa ‘sikukuu ya BWANA ni yetu/tunayo’; hakina kitenzi cha moja kwa moja cha ulazima. Tafsiri iliyochaguliwa huhifadhi sababu ya kwenda huku ikiepuka kuongeza ‘lazima.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Marudio ya ‘tutaenda’ yamehifadhiwa kwa sababu ni sehemu ya msisitizo wa Kiebrania. ‘Wana wetu na binti zetu’ ni mtindo wa kawaida wa kibiblia unaobaki wazi kwa msomaji wa leo.
