revisions:
- from: Mose akasema, “Tutaenda pamoja na vijana wetu na wazee wetu; tutaenda pamoja na wana wetu na binti zetu, pamoja na makundi yetu ya kondoo na mbuzi na makundi yetu ya ng’ombe, kwa sababu tuna sikukuu ya kumwabudu BWANA.”
  to: Mose akasema, “Tutaenda pamoja na vijana wetu na wazee wetu; tutaenda pamoja na wana wetu na binti zetu, pamoja na mifugo yetu ya kondoo na mbuzi na ng’ombe wetu, kwa maana tunapaswa kumfanyia BWANA sikukuu.”
  rationale: The revision retains the source’s parallelism and repeated verb while rendering the final clause as the required observance of a festival for YHWH. It also streamlines the livestock wording without reducing the distinction between צאן (small livestock, sheep and goats) and בקר (cattle).
