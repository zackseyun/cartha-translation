base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/017.yaml
  text: So now[a], please forgive my sin just this once, and plead with Yahweh your God[b], that he may remove from me this death only.
translation:
  language: sw
  text: Sasa basi, tafadhali nisameheni dhambi yangu mara hii tu, mkamsihi Yahweh, Mungu wenu[a], ili aniondolee kifo hiki tu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Mungu wenu.” Farao anazungumza na Musa na Haruni; kiambishi cha umilikaji ni cha wingi, naye anamwita Yahweh Mungu wao.'
    reason: grammatical_and_contextual_clarification
  - marker: b
    text: 'Kiebrania: “kifo hiki.” Huenda Farao anarejelea pigo hili lenye kuleta mauti na madhara yake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huleta ombi la haraka la Farao kwa kiunganishi cha kawaida huku ikihifadhi maana ya ‘na/sasa.’
- source_word: שָׂא נָא חַטָּאתִי
  choice: tafadhali nisameheni dhambi yangu
  rationale: Nָשָׂא pamoja na ‘dhambi’ ni nahau ya kuondoa au kusamehe dhambi; ‘nisameheni’ ni Kiswahili cha kawaida na cha heshima, na wingi unalingana na Musa na Haruni wanaosemeshwa.
- source_word: אַךְ הַפַּעַם
  choice: mara hii tu
  rationale: Huhifadhi mkazo wa ombi kuwa msamaha huo ni kwa tukio hili pekee.
- source_word: וְהַעְתִּירוּ
  choice: mkamsihi
  rationale: Hiphil ya עתר hapa inaonyesha kumwomba Mungu kwa bidii kwa niaba ya mtu; ‘mkamsihi’ huwasilisha uzito huo kwa lugha ya sasa.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: Yahweh Mungu wenu
  rationale: Huhifadhi jina la agano יהוה na kauli ya Farao inayoweka umbali, ‘Mungu wenu.’
- source_word: וְיָסֵר מֵעָלַי
  choice: ili aniondolee
  rationale: ‘Ili’ huonyesha uhusiano wa kusudi au matokeo baada ya ombi la kusihi, na ‘aniondolee’ ni usemi wa asili wa Kiswahili.
- source_word: רַק אֶת־הַמָּוֶת הַזֶּה
  choice: kifo hiki tu
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania ‘kifo hiki’ na nguvu ya kizuizi cha רַק bila kuufasiri moja kwa moja kuwa ‘pigo.’
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni; ‘Yahweh’ huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya ‘kifo hiki’
  choice: Kuhifadhi usemi ‘kifo hiki’
  alternative: pigo hili la mauti; maafa haya yenye kuua
  rationale: 'Huacha wazi mvutano wa maandishi: katika muktadha Farao huenda anamaanisha pigo la nzige na madhara yake yenye kuleta mauti, lakini Kiebrania chenyewe kinasema ‘kifo hiki.’'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Uwingi katika ‘nisameheni,’ ‘mkamsihi,’ na ‘Mungu wenu’ umehifadhiwa. Alama zote za tanbihi zimo katika matini kuu.
