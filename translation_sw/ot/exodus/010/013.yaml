base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/013.yaml
  text: So Moses stretched out his staff over the land of Egypt[a], and Yahweh drove an east wind over the land all that day and all the night. When morning came, the east wind had brought the locusts.
translation:
  language: sw
  text: Basi Musa akanyosha fimbo yake juu ya nchi ya Misri, naye Yahweh akavumisha upepo wa mashariki[a] katika nchi siku hiyo yote na usiku kucha. Kulipopambazuka, upepo wa mashariki ulikuwa umeleta nzige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upepo kutoka mashariki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: akanyosha
  rationale: Kitenzi נטה humaanisha kunyoosha au kuelekeza kitu; “akanyosha” ni cha kawaida na kinafaa kwa tendo la Musa kwa fimbo.
- source_word: מַטֵּהוּ
  choice: fimbo yake
  rationale: מַטֶּה ni fimbo; “fimbo” ni neno la kawaida la Kiswahili na linaendana na simulizi la Musa.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: juu ya nchi ya Misri
  rationale: עַל hapa inaonyesha eneo ambalo fimbo ilielekezwa; “juu ya” huhifadhi taswira hiyo kwa Kiswahili cha kawaida.
- source_word: וַיהוָה
  choice: naye Yahweh
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kuwa “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: נִהַג
  choice: akaendesha
  rationale: נהג ni kuendesha, kuongoza, au kusukuma. Kwa upepo, “akaendesha” hudumisha wazo la Yahweh kuuelekeza juu ya nchi.
- source_word: רוּחַ קָדִים
  choice: upepo wa mashariki
  rationale: Kirai hiki humaanisha upepo unaotoka mashariki; “upepo wa mashariki” ni usemi mfupi na wa kawaida, huku tanbihi ikifafanua mwelekeo.
- source_word: בָּאָרֶץ
  choice: juu ya nchi
  rationale: Katika muktadha wa mwendo wa upepo, “juu ya nchi” huwasilisha vizuri upepo ukipita katika eneo lote.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: siku hiyo yote na usiku kucha
  rationale: Tafsiri hii huhifadhi msisitizo wa muda wote wa mchana na usiku kwa Kiswahili asilia; “usiku kucha” ni sawa na usiku wote.
- source_word: הַבֹּקֶר הָיָה
  choice: Kulipopambazuka
  rationale: Kirai hiki cha Kiebrania kinaashiria kufika kwa asubuhi; “Kulipopambazuka” ni mpito wa wakati ulio wazi na wa kawaida.
- source_word: נָשָׂא אֶת הָאַרְבֶּה
  choice: ulikuwa umeleta nzige
  rationale: נשא hapa ni kubeba au kuleta. Wakati wa hali timilifu “ulikuwa umeleta” unaonyesha kuwa kufikia mapambazuko upepo ulikuwa tayari umewaleta.
- source_word: הָאַרְבֶּה
  choice: nzige
  rationale: Nomino ya Kiebrania ya umoja inatumika kwa maana ya jamii au kundi; Kiswahili hutumia “nzige” kwa wingi katika muktadha huu.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko linatumia moja kwa moja Tetragramatoni יהוה. “Yahweh” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo, bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umewekwa wa moja kwa moja, huku “usiku kucha” na “kulipopambazuka” zikitoa mtiririko wa kawaida kwa msomaji wa leo.
