  text: וּ/לְמַ֡עַן תְּסַפֵּר֩ בְּ/אָזְנֵ֨י בִנְ/ךָ֜ וּ/בֶן בִּנְ/ךָ֗ אֵ֣ת אֲשֶׁ֤ר הִתְעַלַּ֨לְתִּי֙ בְּ/מִצְרַ֔יִם וְ/אֶת אֹתֹתַ֖/י אֲשֶׁר שַׂ֣מְתִּי בָ֑/ם וִֽ/ידַעְתֶּ֖ם כִּי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/002.yaml
  text: so that you may tell in the hearing of your son and of your grandson how I dealt harshly with Egypt[a], and my signs that I placed among them[b], and so that you may know that I am Yahweh.
translation:
  language: sw
  text: ili usimulie masikioni mwa mwana wako na mjukuu wako jinsi nilivyoitendea Misri kwa ukali[a], na ishara zangu nilizoweka kati yao, na ili mjue kwamba mimi ni Yahwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jinsi nilivyoifanya Misri kuwa kitu cha dhihaka.” Kitenzi cha Kiebrania kinaweza kusisitiza kuaibishwa kwa Misri pamoja na kutendewa kwa ukali.
    reason: lexical_alternative
  - marker: b
    text: Au, “nanyi mtajua kwamba mimi ni Yahwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְמַעַן
  choice: ili
  rationale: Kiunganishi hiki kinaonyesha kusudi au matokeo yanayohusiana na agizo lililotangulia; “ili” ni Kiswahili cha kawaida na huhifadhi maana ya kusudi.
- source_word: תְּסַפֵּר
  choice: usimulie
  rationale: Piel ya ספר hapa inamaanisha kusimulia matendo kwa vizazi vinavyofuata. “Usimulie” huonyesha habari inayotolewa kama simulizi, si kutaja tu.
- source_word: בְּאָזְנֵי
  choice: masikioni mwa
  rationale: Tafsiri hii huhifadhi picha halisi ya Kiebrania, “masikioni mwa,” huku ikieleweka kwa kawaida katika Kiswahili.
- source_word: בִנְךָ וּבֶן בִּנְךָ
  choice: mwana wako na mjukuu wako
  rationale: Kiebrania kinasema kihalisi “mwana wako na mwana wa mwana wako.” “Mjukuu wako” ni namna ya asili ya kueleza kizazi hicho kwa Kiswahili.
- source_word: הִתְעַלַּלְתִּי
  choice: nilivyoitendea ... kwa ukali
  rationale: Kitenzi hiki katika muktadha wa mapigo kinaweza kuonyesha kutenda kwa ukali na pia kuaibisha au kufanya kitu cha kudhihakiwa. Chaguo hili linaweka mbele uzito wa hukumu bila kufuta maana nyingine inayotolewa katika tanbihi.
- source_word: בְּמִצְרַיִם
  choice: Misri
  rationale: Misri ndiyo inayopokea tendo la Mungu. Muundo “nilivyoitendea Misri” ni wa kawaida na huhifadhi jina la nchi lililo katika matini.
- source_word: אֹתֹתַי
  choice: ishara zangu
  rationale: אות humaanisha “ishara.” Tafsiri hii ni ya moja kwa moja na haiongezi neno “miujiza,” ingawa ishara hizo ni za ajabu katika muktadha.
- source_word: שַׂמְתִּי בָם
  choice: nilizoweka kati yao
  rationale: שׂים ni “kuweka,” na kiambishi cha wingi kinaelekea kuwarejelea Wamisri. “Kati yao” ni wazi na huhifadhi lugha halisi kuliko “nilizofanya.”
- source_word: וִידַעְתֶּם
  choice: na ili mpate kujua
  rationale: Wingi wa kitenzi umehifadhiwa kwa “mpate,” tofauti na umoja wa “usimulie.” Muundo huu unaendeleza wazo la kusudi lililoanzishwa na וּלְמַעַן.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa kama “Yahwe” badala ya kubadilishwa na cheo “BWANA.”
theological_decisions:
- issue: Maana ya הִתְעַלַּלְתִּי kuhusu tendo la Mungu dhidi ya Misri
  choice: jinsi nilivyoitendea Misri kwa ukali
  alternative: jinsi nilivyoifanya Misri kitu cha kudhihakiwa
  rationale: Muktadha unahusu hukumu kali kupitia mapigo, lakini kitenzi kinaweza pia kusisitiza kuaibishwa kwa Misri. Matini kuu inaonyesha ukali wa hukumu, na tanbihi inahifadhi maana ya kuaibisha.
- issue: Uhusiano wa וִידַעְתֶּם na kusudi lililotajwa mwanzoni
  choice: na ili mpate kujua
  alternative: nanyi mtajua
  rationale: Inawezekana kuisikia kama mwendelezo wa kusudi au kama matokeo ya baadaye. Muundo wa kusudi unafaa zaidi mtiririko wa sentensi, huku usomaji wa matokeo ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Umoja wa “usimulie” na wingi wa “mpate kujua” umehifadhi tofauti ya idadi iliyo katika Kiebrania. Usemi “masikioni mwa” umeachwa ili kudumisha picha ya chanzo bila kufanya sentensi kuwa ngumu.
