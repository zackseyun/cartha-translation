  yaml_path: translation/ot/exodus/010/020.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he did not let the sons of Israel go.
translation:
  language: sw
  text: Lakini Yahwe akaufanya moyo wa Farao kuwa mgumu[a], naye hakuwaruhusu wana wa Israeli[b] waende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaufanya moyo wa Farao kuwa imara” au “aliutia moyo wa Farao nguvu”; kitenzi cha Kiebrania kwa maana ya msingi ni “kufanya kuwa na nguvu/imara.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Waisraeli”; kwa mapokeo, “watoto wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: akaufanya ... kuwa mgumu
  rationale: Kitenzi חזק kwa msingi wake humaanisha kufanya kuwa na nguvu au imara. Katika kauli inayojirudia kuhusu Farao, Kiswahili cha asili ‘akaufanya moyo ... kuwa mgumu’ kinaonyesha kwamba ukaidi wake ulithibitika, huku tanbihi ikihifadhi maana halisi mbadala.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa moja kwa moja kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi katika maandishi ya Kiebrania.
- source_word: לֵב
  choice: moyo
  rationale: ‘Moyo’ huhifadhi tamathali ya Kiebrania inayojumuisha nia, azimio na hali ya ndani ya mtu.
- source_word: פַּרְעֹה
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la Kiswahili la cheo cha mfalme wa Misri.
- source_word: שִׁלַּח
  choice: hakuwaruhusu ... waende
  rationale: Ingawa שלח inaweza kumaanisha ‘kutuma,’ katika muktadha wa kuondoka kwa Israeli, ‘kuruhusu waende’ ni usemi wa kawaida na sahihi wa Kiswahili.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Uamuzi huu unahifadhi kwa uwazi usemi wa kifamilia wa Kiebrania, huku tanbihi ikitoa tafsiri nyepesi zaidi ‘Waisraeli.’
theological_decisions:
- issue: Tendo la Mungu katika kuufanya moyo wa Farao kuwa mgumu
  choice: Yahwe akaufanya moyo wa Farao kuwa mgumu
  alternative: Yahwe akaufanya moyo wa Farao kuwa imara
  rationale: Kiebrania kinamhusisha Yahwe moja kwa moja na tendo hilo. Tafsiri haipunguzi wala kueleza mbali uwakala wa Mungu, na hivyo inadumisha mvutano wa simulizi kati ya tendo la Mungu na wajibu wa Farao bila kuingiza mfumo wa mafundisho usiotajwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Kiunganishi ‘Lakini’ kinaonyesha mgeuko wa וַ katika muktadha, na ‘naye’ kinaweka wazi kwamba Farao ndiye aliyekataa kuwaruhusu waende.
