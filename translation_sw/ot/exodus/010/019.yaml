  text: וַ/יַּהֲפֹ֨ךְ יְהוָ֤ה רֽוּחַ יָם֙ חָזָ֣ק מְאֹ֔ד וַ/יִּשָּׂא֙ אֶת הָ֣/אַרְבֶּ֔ה וַ/יִּתְקָעֵ֖/הוּ יָ֣מָּ/ה סּ֑וּף לֹ֤א נִשְׁאַר֙ אַרְבֶּ֣ה אֶחָ֔ד בְּ/כֹ֖ל גְּב֥וּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/019.yaml
  text: And Yahweh turned a very strong west wind[a], and it carried away the locusts and drove them into the Sea of Reeds[b]. Not one locust remained in all the territory of Egypt.
translation:
  language: sw
  text: Yahwe akaugeuza upepo uwe upepo mkali sana wa magharibi[a]. Upepo huo ukawachukua nzige na kuwasukuma ndani ya Bahari ya Matete[b]. Hakubaki hata nzige mmoja katika eneo lote la Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “upepo wa bahari.” Katika mazingira haya, huenda ikimaanisha upepo kutoka magharibi.'
    reason: cultural_note
  - marker: b
    text: 'Kiebrania: “Bahari ya Matete”; kwa mapokeo huitwa “Bahari ya Shamu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: akageuza upepo, ukawa
  rationale: Kitenzi הפך kina maana ya kugeuza au kubadili. Muundo huu wa Kiswahili unaonyesha mabadiliko ya upepo bila kuficha tendo la kuugeuza.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: רוּחַ יָם חָזָק מְאֹד
  choice: upepo mkali sana kutoka magharibi
  rationale: Neno kwa neno ni ‘upepo wa bahari’; katika mazingira ya Misri, bahari iko upande wa magharibi, hivyo usemi huo unaonyesha upepo kutoka magharibi. Tanbihi inahifadhi taswira halisi ya Kiebrania.
- source_word: וַיִּשָּׂא אֶת־הָאַרְבֶּה
  choice: ukawachukua nzige
  rationale: נשא humaanisha kuinua au kuchukua. Kauli hii ni ya kawaida kwa upepo unaowabeba nzige na kuwaondoa.
- source_word: וַיִּתְקָעֵהוּ
  choice: kuwasukuma
  rationale: תקע hapa ni kusukuma au kuendesha kwa nguvu. Ingawa kiambishi cha Kiebrania ni umoja kwa kundi la nzige, Kiswahili hutumia wingi kwa kawaida.
- source_word: יָמָּה סּוּף
  choice: mpaka Bahari ya Matete
  rationale: Jina Yam Suf kwa kawaida linaeleweka kuwa ‘Bahari ya Matete.’ Kiishio cha mwelekeo katika יָמָּה kinaonyeshwa kwa ‘mpaka,’ huku muktadha ukionyesha nzige walisukumwa humo.
- source_word: לֹא נִשְׁאַר אַרְבֶּה אֶחָד
  choice: Hakubaki hata nzige mmoja
  rationale: ‘Hata ... mmoja’ huhifadhi msisitizo wa Kiebrania kwamba hakuna nzige hata mmoja aliyebaki.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: katika eneo lote la Misri
  rationale: גְּבוּל hapa inaonyesha eneo lote lililo ndani ya mipaka ya Misri, si mpaka wake tu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la Mungu. Kulitohowa kama ‘Yahwe’ huhifadhi jina badala ya kuliweka kwa cheo.
- issue: Jinsi ya kutafsiri יָם סוּף
  choice: Bahari ya Matete
  alternative: Bahari ya Shamu
  rationale: ‘Bahari ya Matete’ hufuata maana ya jina la Kiebrania; jina la kimapokeo ‘Bahari ya Shamu’ limetajwa katika tanbihi kwa utambuzi wa msomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Urudiaji wa ‘upepo’ umehifadhiwa ili kirejeleo kiwe wazi, na tanbihi zimepangwa kulingana na alama zake katika matini.
