base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/014.yaml
  text: And the locusts came up over all the land of Egypt and settled in every territory of Egypt[a]—an extremely severe swarm. never before had there been locusts like it, nor will there be again after it.
translation:
  language: sw
  text: Nao nzige wakapanda juu ya nchi yote ya Misri, wakatua katika eneo lote la Misri. Uvamizi huo ulikuwa mzito sana[a]; kabla yao hakujawahi kuwa na nzige kama hao, wala baada yao hakutakuwa na nzige kama hao tena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “mzito sana.” Usemi huo unaeleza uvamizi wa nzige kuwa wa uzito au ukali wa kipekee; unaweza pia kudokeza msongamano wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: wakapanda juu ya
  rationale: Huhifadhi taswira ya kitenzi עלה, ‘kupanda/kwenda juu,’ huku ikieleza kwa Kiswahili cha kawaida jinsi nzige walivyoenea juu ya nchi.
- source_word: הָאַרְבֶּה
  choice: nzige
  rationale: Nomino ya Kiebrania iko katika umoja wa mkusanyiko; Kiswahili hutumia ‘nzige’ kwa kundi la wadudu hao bila kulazimika kuongeza neno lisilokuwamo wazi katika chanzo.
- source_word: עַל כָּל אֶרֶץ מִצְרַיִם
  choice: juu ya nchi yote ya Misri
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya eneo lote lililofunikwa na nzige.
- source_word: וַיָּנַח
  choice: wakatua
  rationale: ‘Kutua’ huonyesha kwa kawaida nzige waliokuja kukaa juu ya nchi, na huhifadhi maana ya נוח ya kutulia au kupumzika.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: katika eneo lote la Misri
  rationale: גְּבוּל hapa inaelekea kumaanisha himaya au eneo lote la taifa, si mipaka yake pekee.
- source_word: כָּבֵד מְאֹד
  choice: walikuwa wengi sana
  rationale: Kwa kundi la nzige, ‘wengi sana’ huwasilisha uzito au ukubwa usio wa kawaida wa uvamizi kwa Kiswahili asilia; tanbihi huhifadhi maana halisi ya ‘wazito sana.’
- source_word: לְפָנָיו ... וְאַחֲרָיו
  choice: kabla yao ... baada yao
  rationale: Viambishi vya umoja vya Kiebrania vinaelekeza kwa nzige kama mkusanyiko; Kiswahili hutumia wingi kwa upatanisho wa kawaida na ‘nzige.’
- source_word: לֹא הָיָה כֵן אַרְבֶּה כָּמֹהוּ ... לֹא יִהְיֶה כֵּן
  choice: hakujawahi kuwa na nzige kama hao ... hakutakuwa na nzige kama hao tena
  rationale: Huhifadhi dai la kwamba tukio hili halikuwa na mfano kabla yake wala halitakuwa na mfano baada yake.
