base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/001.yaml
  text: Then Yahweh said to Moses[a], "Go in to Pharaoh, because I have hardened his heart and the heart of his servants[b], so that I may set these signs of mine among them."
translation:
  language: sw
  text: Kisha Yahwe akamwambia Musa, “Nenda kwa Farao, kwa sababu nimeufanya moyo wake na mioyo ya watumishi wake kuwa migumu[a], ili niweke ishara zangu hizi katikati yake[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “nimeufanya moyo wake kuwa mzito.” Nahau hiyo humaanisha kwamba Yahwe aliufanya moyo wa Farao kuwa mgumu au usioitikia.'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kihalisi: “katikati yake.” Hii inaweza kumaanisha katikati ya Farao mwenyewe, au katika mazingira yake, yaani miongoni mwa watumishi na watu wa ikulu yake.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Nenda kwa Farao
  rationale: Ingawa בוא inaweza kumaanisha ‘njoo’ au ‘ingia’, katika muktadha huu amri ya kwenda kukutana na Farao inaelezwa kwa Kiswahili cha asili bila kuongeza wazo lisilo hakika la kuingia chumbani.
- source_word: הִכְבַּדְתִּי
  choice: nimeufanya ... kuwa mgumu
  rationale: Hii inawasilisha maana ya nahau ya moyo kuwa usioitikia, huku maana halisi ya ‘kufanya mzito’ ikihifadhiwa katika tanbihi.
- source_word: לִבּוֹ ... לֵב עֲבָדָיו
  choice: moyo wake na mioyo ya watumishi wake
  rationale: ‘Moyo’ huhifadhi taswira ya Kiebrania ya kitovu cha nia na fikira; umoja wa jumla wa Kiebrania kwa watumishi umeelezwa kiasili kwa wingi katika Kiswahili.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Neno hili linaweza kumaanisha watumwa, watumishi, au maofisa; ‘watumishi’ ni pana na halilazimishi tafsiri finyu ya nafasi zao katika ikulu.
- source_word: לְמַעַן שִׁתִי
  choice: ili niweke
  rationale: ‘Ili’ huonyesha kusudi, na ‘niweke’ ni tafsiri ya moja kwa moja na ya kawaida ya שׁית katika muktadha huu.
- source_word: אֹתֹתַי אֵלֶּה
  choice: ishara zangu hizi
  rationale: Muundo huu huhifadhi umilikaji na kiashiria cha ‘hizi’ kwa Kiswahili chenye hadhi.
- source_word: בְּקִרְבּוֹ
  choice: katikati yake
  rationale: Huhifadhi umbo la umoja la Kiebrania na utata wake kuhusu kama rejeo ni Farao mwenyewe au mazingira yake ya kifalme.
theological_decisions:
- issue: Mungu kuufanya moyo wa Farao kuwa mgumu
  choice: nimeufanya moyo wake ... kuwa mgumu
  alternative: nimeufanya moyo wake kuwa mzito
  rationale: Tafsiri inahifadhi kauli ya moja kwa moja kwamba Yahwe ndiye aliyefanya hivyo, bila kupunguza mvutano kati ya utendaji wa Mungu na wajibu wa Farao; tanbihi inaonyesha taswira halisi ya Kiebrania.
- issue: Rejeo la בְּקִרְבּוֹ
  choice: katikati yake
  alternative: miongoni mwao
  rationale: Kiwakilishi cha Kiebrania ni cha umoja. Tafsiri kuu inakihifadhi, huku tanbihi ikieleza uwezekano wa kumhusu Farao pamoja na watu wa ikulu yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wa kawaida na wenye hadhi. Jina ‘Yahwe’ limehifadhiwa, na utata wa kiwakilishi cha umoja katika בְּקִרְבּוֹ haujaondolewa kimya kimya.
