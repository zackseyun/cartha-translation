base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/021.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky, so that there may be darkness over the land of Egypt, and the darkness may be felt.”
translation:
  language: sw
  text: Kisha Yahweh akamwambia Musa, “Nyoosha mkono wako kuelekea angani, ili giza liwe juu ya nchi ya Misri, na giza liweze kuhisiwa[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “giza liweze kuhisiwa,” au huenda, “mtu aweze kulihisi giza.” Kitenzi cha mwisho ni adimu na kinakazia kwamba giza hilo lilikuwa kana kwamba linaweza kuguswa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano limetolewa kwa unukuzi wa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: נְטֵה יָדְךָ
  choice: Nyoosha mkono wako
  rationale: Kauli ya amri imetolewa kwa Kiswahili cha kawaida kinachoeleza kitendo cha kuuelekeza mkono ulionyoshwa.
- source_word: עַל הַשָּׁמַיִם
  choice: kuelekea angani
  rationale: Katika muktadha wa ishara hii, kihusishi kinaonyesha mwelekeo wa kitendo kwenda juu; “angani” ni usemi wa asili katika Kiswahili.
- source_word: וִיהִי חֹשֶׁךְ
  choice: ili giza liwe
  rationale: Muundo wa Kiebrania una nguvu ya kusudi au matokeo yanayoamriwa; “ili ... liwe” huhifadhi maana hiyo kwa ufasaha.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: juu ya nchi ya Misri
  rationale: Huhifadhi nomino אֶרֶץ, “nchi,” pamoja na wazo la giza kuifunika Misri.
- source_word: וְיָמֵשׁ חֹשֶׁךְ
  choice: na giza hilo lihisike
  rationale: Kitenzi adimu kinaeleweka kwa kawaida kuwa giza linaweza kuhisiwa kana kwamba ni zito na halisi; tafsiri hii ni ya asili huku tanbihi ikihifadhi uwezekano mwingine wa kisarufi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia jina la Mungu lenye herufi nne moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Uhusika katika kishazi cha mwisho
  choice: giza hilo lihisike
  alternative: mtu aweze kulihisi giza
  rationale: Kiebrania kina kitenzi adimu na kinaweza kueleweka kwa kulifanya giza kuwa kitu kinachohisiwa au kwa kumwacha mhusika asiyeainishwa alihisi. Maandishi makuu yanafuata muundo unaolenga giza, huku tanbihi ikihifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inafuata mtiririko wa simulizi la Biblia kwa “Kisha ... akamwambia,” na tanbihi imewekwa kwenye kishazi inachokifafanua.
