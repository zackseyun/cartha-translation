base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/028.yaml
  text: Then Pharaoh said to him[a], “Go away from me. Watch yourself; do not see my face again, for on the day you see my face[b], you will die.”
translation:
  language: sw
  text: 'Ndipo Farao akamwambia, “Ondoka mbele yangu. Jihadhari: usiuone uso wangu tena, kwa maana siku utakapouona uso wangu, utakufa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ פַרְעֹה
  choice: Ndipo Farao akamwambia
  rationale: Muundo wa masimulizi unaendeleza tukio; “Ndipo” na “akamwambia” ni Kiswahili cha kawaida kinachohifadhi mfuatano na kiwakilishi cha yule aliyeambiwa.
- source_word: לֵךְ מֵעָלַי
  choice: Ondoka mbele yangu
  rationale: Kauli hii ni amri kali ya kumfukuza Musa kutoka mbele ya Farao. “Ondoka mbele yangu” ni ya asili na yenye hadhi, huku ikihifadhi wazo la kuondoka katika uwepo wake.
- source_word: הִשָּׁמֶר לְךָ
  choice: Jihadhari
  rationale: Amri ya kujirejelea inatoa onyo la moja kwa moja lenye tishio; “Jihadhari” huwasilisha nguvu hiyo kwa ufupi na kwa Kiswahili cha sasa.
- source_word: אַל תֹּסֶף רְאוֹת פָּנַי
  choice: usiuone uso wangu tena
  rationale: Kiebrania hutumia kihalisi wazo la ‘usiongeze kuuona’; katika Kiswahili, “tena” huwasilisha nahau hiyo kwa usahihi na kwa njia ya kawaida bila kupoteza taswira ya uso.
- source_word: פָּנַי
  choice: uso wangu
  rationale: “Uso” umehifadhiwa katika sehemu zote mbili ili kudumisha urudiaji na msisitizo wa Kiebrania, ingawa neno hilo pia linaweza kudokeza uwepo wa Farao.
- source_word: בְּיוֹם רְאֹתְךָ פָנַי
  choice: siku utakapouona uso wangu
  rationale: “Siku” huhifadhi usemi wa wakati wa Kiebrania, na kishazi cha “utakapouona” ni cha asili katika Kiswahili huku kikidumisha tishio la tukio litakalofuata.
- source_word: תָּמוּת
  choice: utakufa
  rationale: Kitenzi hiki ni tishio la moja kwa moja la kifo; “utakufa” ni wazi, cha kisasa, na hakiongezi maana isiyokuwapo.
theological_decisions:
- issue: Maana ya פָּנַי kama ‘uso’ au ‘uwepo’
  choice: uso wangu
  alternative: uwepo wangu
  rationale: Muktadha unaweza kuruhusu maana ya uwepo, lakini chanzo kinarudia neno ‘uso’ kwa msisitizo. Kutafsiri “uso” huhifadhi taswira na mvutano huo bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kauli fupi na kali zimehifadhi sauti ya hasira na tishio la Farao; hakuna alama za tanbihi kwa kuwa hakuna tanbihi inayohitajika ili kuelewa tafsiri.
