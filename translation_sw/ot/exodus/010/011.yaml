base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/011.yaml
  text: No! Let the men go now and serve Yahweh[b][a], for that is what you are seeking.” Then he drove them out from Pharaoh’s presence.
translation:
  language: sw
  text: “La, sivyo![a] Nendeni sasa, enyi wanaume,[b] mkamtumikie Yahwe, kwa maana hilo ndilo mnalolitaka.” Kisha akawafukuza kutoka mbele ya Farao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sivyo!”—tafsiri fupi zaidi ya jibu la ghafla la Farao.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema “wanaume,” yaani watu wa kiume, wala si watu wote.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania hakimtaji wazi aliyewafukuza; kitenzi kiko katika umoja. Huenda ikawa Farao mwenyewe au mtu aliyetenda kwa amri yake.
    reason: textual_ambiguity
lexical_decisions:
- source_word: לֹא כֵן
  choice: Sivyo!
  rationale: Kauli hii fupi na ya ghafla inaonyesha kukataa kwa Farao; ‘Sivyo!’ ni ya asili katika Kiswahili na huhifadhi ukali wa jibu.
- source_word: לְכוּ נָא
  choice: Nendeni sasa
  rationale: נָא hapa inaweza kulainisha amri au kuonyesha msisitizo wa wakati. Katika muktadha wa jibu la Farao, ‘sasa’ inaonyesha uharaka wa dismissal yake bila kuifanya kauli ionekane ya heshima kupita kiasi.
- source_word: הַגְּבָרִים
  choice: enyi wanaume
  rationale: Neno la Kiebrania linawahusu wanaume, si watu wote. Tafsiri hii inahifadhi sharti la Farao kuhusu ni nani anayeruhusiwa kwenda.
- source_word: וְעִבְדוּ אֶת יְהוָה
  choice: mkamtumikie Yahwe
  rationale: עבד inaweza kumaanisha kumtumikia au kumwabudu Mungu. ‘Kumtumikia’ huhifadhi maana pana huku ikifaa katika muktadha wa ibada.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano lililoandikwa kwa herufi יהוה limetolewa kama ‘Yahwe’, namna ya kawaida na inayosomeka katika Kiswahili.
- source_word: כִּי אֹתָהּ אַתֶּם מְבַקְשִׁים
  choice: kwa maana hilo ndilo mnalolitaka
  rationale: Kiwakilishi cha kike kinarejelea jambo au ombi linalodokezwa. ‘Hilo ndilo mnalolitaka’ ni wazi bila kubainisha kupita kiasi rejeo lake.
- source_word: וַיְגָרֶשׁ אֹתָם
  choice: Kisha akawafukuza
  rationale: Kitenzi cha umoja kina mhusika asiyeelezwa wazi. Muundo wa Kiswahili huhifadhi mhusika huyo kwa kiambishi ‘a-’ bila kuongeza jina lisilokuwamo katika maandishi.
- source_word: מֵאֵת פְּנֵי פַרְעֹה
  choice: kutoka mbele ya Farao
  rationale: Tafsiri hii inahifadhi taswira ya Kiebrania ya kuondolewa mbele ya mtawala na inaeleweka katika mazingira ya baraza la kifalme.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Sharti la Farao kuhusu jinsia ya wanaoruhusiwa kwenda
  choice: enyi wanaume
  alternative: ninyi watu; wanaume tu
  rationale: הַגְּבָרִים ni maalumu kwa wanaume. Kulihifadhi kunabaki na mvutano wa simulizi katika pendekezo pungufu la Farao, bila kuongeza neno ‘tu’ katika matini kuu.
- issue: Mhusika wa tendo la kuwafukuza
  choice: akawafukuza
  alternative: Farao akawafukuza; wakafukuzwa
  rationale: Kiebrania kina kitenzi cha umoja bila kumtaja mhusika. Tafsiri haiongezi jina la Farao kama mhusika, ingawa muktadha unaweza kuelekeza kwake au kwa mtu aliyetenda kwa amri yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Kauli ya Farao imewekwa kwa ufupi na ukali; mpangilio wa maneno umefanywa wa asili bila kufuta umaalumu wa ‘wanaume’ wala utata wa mhusika wa kitenzi cha mwisho.
