lexical_decisions:
- source_word: רָאוּ ... אֶת אָחִיו
  choice: Hawakuonana wao kwa wao
  rationale: Kirai אִישׁ אֶת־אָחִיו kina maana ya kutendeana; tafsiri hii inaeleza kwa Kiswahili cha kawaida kwamba hawakuweza kuonana, bila kulifanya neno אָחִיו limaanishe ndugu wa kuzaliwa pekee.
- source_word: אִישׁ ... לֹא קָמוּ
  choice: wala hakuna mtu aliyeondoka
  rationale: אִישׁ limetumika kwa maana ya kila mtu mmoja mmoja, na kukanushwa kwake kunatolewa kwa kawaida kama “hakuna mtu.” Kitenzi “aliyeondoka” kinafikisha maana ya קום pamoja na kirai kinachofuata, yaani kutotoka mahali alipokuwa.
- source_word: מִתַּחְתָּיו
  choice: mahali pake
  rationale: Maana halisi ni “kutoka chini yake,” lakini hapa ni nahau ya mahali mtu alipokuwa; “mahali pake” ni wazi na ya asili.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: kwa siku tatu
  rationale: Kiambishi “kwa” kinaonyesha muda kwa Kiswahili cha kawaida.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli wote
  rationale: Ingawa muundo halisi ni “wana wa Israeli,” hapa ni jina la jamii nzima. “Waisraeli” ni la asili, linajumuisha watu wote, na halipotezi utambulisho wa kikabila wa kirai hicho.
- source_word: הָיָה אוֹר
  choice: walikuwa na nuru
  rationale: Muundo huu unaonyesha kwamba nuru ilipatikana kwao na unadumisha utofautishaji na giza la Wamisri.
- source_word: בְּמֹשְׁבֹתָם
  choice: katika makao yao
  rationale: מוֹשָׁב linaweza kumaanisha mahali pa kukaa au makazi; “makao yao” linafaa katika muktadha bila kulazimisha kama ni nyumba moja moja au maeneo mapana ya makazi.
