base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/008.yaml
  text: So Moses and Aaron were brought back to Pharaoh[a], and he said to them, “Go, serve Yahweh your God. Who are the ones going?”
translation:
  language: sw
  text: Basi Musa na Aroni wakarudishwa kwa Farao, naye akawaambia, “Nendeni mkamtumikie Yahweh, Mungu wenu. Ni nani na nani watakaokwenda?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוּשַׁב
  choice: wakarudishwa
  rationale: Hofali ya שוב ina maana ya kusababishwa kurudi. Kauli tendwa “wakarudishwa” ni ya asili katika Kiswahili na inadumisha kwamba wengine ndio waliowarudisha.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Musa na Aroni
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili; viashiria vya yambwa ya moja kwa moja vya Kiebrania havihitaji kuwakilishwa.
- source_word: אֶל פַּרְעֹה
  choice: kwa Farao
  rationale: אֶל huonyesha kuelekea kwa mtu; “kwa Farao” ni usemi wa kawaida wa Kiswahili kwa kurudishwa mbele yake.
- source_word: לְכוּ
  choice: Nendeni
  rationale: Ni amri ya wingi ya הלך, kwa hiyo “Nendeni” inawafaa Musa na Aroni.
- source_word: עִבְדוּ
  choice: mkamtumikie
  rationale: עבד hapa ni kumtumikia Mungu, jambo linaloweza kujumuisha ibada bila kulifinyanga kuwa ibada ya liturujia pekee. Kiambishi “-ka-” kinaonyesha kusudi linalofuata kwenda kwa njia ya kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja katika chanzo; “Yahweh” hulihifadhi badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ni muundo wenye kiambishi cha nafsi ya pili wingi, unaotafsiriwa kwa kawaida kuwa “Mungu wenu.”
- source_word: מִי וָמִי
  choice: Ni nani na nani
  rationale: Tafsiri hii inadumisha urudiaji wa nahau ya Kiebrania na ombi la Farao la kutajwa kwa usahihi ni watu gani watakaoenda.
- source_word: הַהֹלְכִים
  choice: watakaokwenda
  rationale: Kitenzi-shirikishi chenye kibainishi kinarejelea watu wanaoenda. Kiswahili cha wakati ujao kinafaa katika swali kuhusu safari iliyokusudiwa.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Tetragramatoni kama jina binafsi. “Yahweh” hulihifadhi jina hilo bila kuweka cheo mahali pake au kuchagua umbo mbadala la kimapokeo.
- issue: Maana ya עבד katika amri ya Farao
  choice: mkamtumikie
  alternative: mkamwabudu
  rationale: “Kumtumikia” huhifadhi upana wa kitenzi cha Kiebrania, ambacho katika muktadha huu kinajumuisha ibada lakini si lazima kiishie katika tendo la ibada pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Ni nani na nani” umeachwa katika matini ili kuhifadhi nahau na msisitizo wa chanzo; unaeleweka kama ombi la kubainisha watu watakaokwenda. Hakuna tanbihi inayohitajika.
