base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/012.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the land of Egypt for the locusts, so that they may come up over the land of Egypt and eat every plant of the land[b], everything that the hail has left.”
translation:
  language: sw
  text: Kisha Yahwe akamwambia Musa, “Nyosha mkono wako juu ya nchi ya Misri kuhusu nzige[a][b], ili waje juu ya nchi ya Misri na wale mimea yote ya nchi, kila kitu ambacho mvua ya mawe imeacha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina kihusishi ambacho ni kigumu hapa; kinaweza kutafsiriwa kwa karibu “kwa habari ya nzige,” “dhidi ya nzige,” au “juu ya nzige.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatumia neno “nzige” katika umoja pamoja na vitenzi vya umoja, lakini kwa maana ya pamoja likirejelea kundi la nzige.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa tahajia iliyo ya kawaida na inayosomeka kwa urahisi katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: נְטֵה יָדְךָ
  choice: Nyosha mkono wako
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kwa karibu agizo la kunyoosha au kuelekeza mkono.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: juu ya nchi ya Misri
  rationale: Huhifadhi maana ya mahali ya עַל na kurudiwa kwa neno 'nchi' katika mstari.
- source_word: בָּאַרְבֶּה
  choice: kwa ajili ya nzige
  rationale: Kihusishi ב ni kigumu hapa; tafsiri hii huonyesha kwamba ishara ya mkono inahusu kuletwa kwa pigo la nzige bila kuficha uwezekano wa tafsiri nyingine.
- source_word: אַרְבֶּה
  choice: nzige
  rationale: Nomino ya Kiebrania iko katika umoja lakini imetumiwa kwa maana ya jamii au kundi; Kiswahili hutumia 'nzige' kwa kawaida kueleza wadudu hao kwa wingi.
- source_word: וְיַעַל
  choice: ili waje
  rationale: Katika muktadha, kitenzi humaanisha nzige kuja na kuenea nchini; 'waje' ni ya asili zaidi katika Kiswahili kuliko tafsiri ya kimofolojia iliyo ngumu.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: mimea yote ya nchi
  rationale: עֵשֶׂב hapa inahusu uoto kwa upana, si nyasi pekee; 'mimea yote' ni wazi na ya kawaida.
- source_word: אֵת כָּל אֲשֶׁר הִשְׁאִיר הַבָּרָד
  choice: kila kitu ambacho mvua ya mawe imeacha
  rationale: Huhifadhi wazo la mabaki yaliyonusurika baada ya pigo la mvua ya mawe na kuunganisha mapigo hayo mawili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Tafsiri inalihifadhi kama jina binafsi katika matini badala ya kulibadilisha kuwa cheo, bila kuongeza dai la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa Kiebrania umefuatwa pale unapobaki wa asili katika Kiswahili, huku matumizi ya pamoja ya ‘nzige’ na utata wa kihusishi yakielezwa katika tanbihi.
