    reason: alternative_reading
  - marker: b
    text: 'Kiebrania kina utata: maneno haya yanaweza kumaanisha “maafa yanawakabili” au “mna uovu akilini / mna nia mbaya.”'
    reason: lexical_alternative
  revision_rationale: The revision makes the opening sarcasm idiomatic in Standard East African Swahili while preserving the source’s optative and conditional/hostile force. It retains the main text’s lexical ambiguity in the final warning and clarifies the alternative senses in the footnote.
