review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents Pharaoh’s ironic optative, the conditional force of כַּאֲשֶׁר, the inclusion of the little children, and the deliberately unresolved warning that רָעָה is ‘before’ them. “Uovu uko mbele yenu” appropriately retains the Hebrew wording and its ambiguity.
  naturalness: “Yahweh na awe pamoja nanyi” is not idiomatic Standard East African Swahili in this context; the conjunction na is awkward and does not naturally convey the emphatic/ironic force of כֵּן. “Yahweh awe pamoja nanyi, ikiwa kweli…” is natural and maintains Pharaoh’s sarcasm. The rest is clear and suitably elevated.
  terminology: “Yahweh,” “watoto wenu wadogo,” and “uovu” are appropriate. The footnote’s first alternative should use a more natural conditional construction, and its disaster alternative should avoid wording that can be read as ‘your disasters.’
  issues:
  - severity: medium
    issue: Awkward rendering of כֵּן in the opening clause
    rationale: “Yahweh na awe pamoja nanyi” is grammatically possible only with a strained discourse sense and is not idiomatic here. Recasting it as “Yahweh awe pamoja nanyi, ikiwa kweli…” preserves the optative and hostile irony without adding interpretation.
  - severity: low
    issue: Footnote b’s disaster alternative is unclear
    rationale: “maafa yako mbele yenu” can be understood as ‘your disasters are before you.’ “Maafa yanawakabili” is clearer Swahili while remaining an explicitly alternative interpretation.
  revised_text: Akawaambia[a], “Yahweh awe pamoja nanyi, ikiwa kweli nitawaacha mwende, ninyi pamoja na watoto wenu wadogo! Angalieni[b], kwa maana uovu uko mbele yenu.”
  revised_footnotes:
