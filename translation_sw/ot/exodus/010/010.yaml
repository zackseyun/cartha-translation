base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/010.yaml
  text: And he said to them[a], “May Yahweh indeed be with you, if I ever send you and your little ones out! See[b], for evil is before your faces.”
translation:
  language: sw
  text: Akawaambia[a], “Yahweh awe pamoja nanyi, ikiwa kweli nitawaacha mwende, ninyi pamoja na watoto wenu wadogo! Angalieni[b], kwa maana uovu uko mbele yenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahweh awe pamoja nanyi nitakapowaacha ninyi na watoto wenu wadogo mwende,” yaelekea alisema hivyo kwa kejeli.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania kina utata: maneno haya yanaweza kumaanisha “maafa yanawakabili” au “mna uovu akilini / mna nia mbaya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי כֵן יְהוָה עִמָּכֶם
  choice: Yahweh na awe pamoja nanyi
  rationale: Muundo huu unadumisha nguvu ya ombi la יְהִי na pia unaruhusu kejeli ya Farao isikike kutokana na muktadha.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetafsiriwa moja kwa moja kama Yahweh kwa kufuata utaratibu wa mradi.
- source_word: כַּאֲשֶׁר
  choice: ikiwa
  rationale: Katika kauli hii yenye uhasama, neno hili linaeleweka kwa hali ya sharti na kejeli, ingawa maana ya kawaida ya ‘wakati’ imeonyeshwa katika tanbihi.
- source_word: אֲשַׁלַּח אֶתְכֶם וְאֶת טַפְּכֶם
  choice: nitawaacha mwende, ninyi pamoja na watoto wenu wadogo
  rationale: Kauli ‘kuwaacha mwende’ ni ya kawaida na ya asili katika simulizi la Kutoka; mpangilio huu pia unaonyesha wazi kwamba watoto wadogo wamejumuishwa.
- source_word: טַפְּכֶם
  choice: watoto wenu wadogo
  rationale: טַף huelekea kumaanisha hasa watoto wadogo, si watu wote wa nyumbani.
- source_word: רְאוּ
  choice: Angalieni
  rationale: Amri hii inaweza kuwa wito wa kuona au onyo; ‘Angalieni’ inadumisha maana zote kwa lugha ya kawaida yenye uzito.
- source_word: כִּי רָעָה נֶגֶד פְּנֵיכֶם
  choice: kwa maana uovu uko mbele yenu
  rationale: Tafsiri hii inafuata ukaribu wa maneno ya Kiebrania na kudumisha utata kati ya mabaya yanayowangoja na nia mbaya waliyo nayo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: ‘Yahweh’ linawakilisha moja kwa moja zaidi jina la Kiebrania la Mungu na linafuata istilahi ya mradi.
- issue: Kudumisha utata katika onyo la mwisho la Farao
  choice: uovu uko mbele yenu
  alternative: maafa yako mbele yenu / mna nia mbaya
  rationale: Kiebrania kinaweza kumaanisha kwamba madhara yanawangoja au kwamba nia yao ni mbaya; matini kuu haichagui kimya kimya mojawapo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akawaambia’ ni ya asili katika simulizi; ‘Angalieni’ hubeba sauti ya onyo bila kuondoa maana ya msingi ya kuona. Muundo umeepuka lugha ya kidhehebu na umehifadhi kejeli pamoja na utata wa Kiebrania.
