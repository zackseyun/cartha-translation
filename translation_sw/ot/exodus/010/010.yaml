  to: Akawaambia[a], “Yahweh awe pamoja nanyi, ikiwa kweli nitawaacha mwende, ninyi pamoja na watoto wenu wadogo! Angalieni[b], kwa maana uovu uko mbele yenu.”
  rationale: The revision makes the opening sarcasm idiomatic in Standard East African Swahili while preserving the source’s optative and conditional/hostile force. It retains the main text’s lexical ambiguity in the final warning and clarifies the alternative senses in the footnote.
