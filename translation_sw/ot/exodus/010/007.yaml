reference: Exodus 10:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ עַבְדֵ֨י פַרְעֹ֜ה אֵלָ֗י/ו עַד מָתַי֙ יִהְיֶ֨ה זֶ֥ה לָ֨/נוּ֙ לְ/מוֹקֵ֔שׁ שַׁלַּח֙ אֶת הָ֣/אֲנָשִׁ֔ים וְ/יַֽעַבְד֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם הֲ/טֶ֣רֶם תֵּדַ֔ע כִּ֥י אָבְדָ֖ה מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/007.yaml
  text: Then Pharaoh’s servants said to him[a], “How long will this man be a snare to us? Send the men away so that they may serve Yahweh their God[e][d][c][b]. Do you not yet know that Egypt is ruined?”
translation:
  language: sw
  text: Kisha watumishi wa Farao wakamwambia, “Mpaka lini mtu huyu atakuwa mtego kwetu? Waache hao wanaume waende ili wamtumikie Yahweh, Mungu wao. Je, bado hujui kwamba Misri imeangamia?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדֵי
  choice: watumishi
  rationale: Ni tafsiri ya moja kwa moja inayofaa kwa watu wa jumba la Farao; ‘maafisa’ ingewezekana lakini ingeongeza ufafanuzi.
- source_word: עַד מָתַי
  choice: Mpaka lini
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi swali la muda na uzito wa lawama.
- source_word: זֶה
  choice: mtu huyu
  rationale: Kiwakilishi cha kuonyesha kinamrejelea Musa; kuongeza ‘mtu’ hufanya Kiswahili kiwe cha kawaida bila kuondoa uwezekano wa msingi wa ‘huyu’.
- source_word: לְמוֹקֵשׁ
  choice: mtego
  rationale: Huhifadhi sitiari ya kitu kinachowanasa au kuwaletea maangamizi.
- source_word: שַׁלַּח
  choice: Waache ... waende
  rationale: Katika muktadha huu amri inamtaka Farao awaruhusu waondoke; huu ni usemi wa asili wa Kiswahili.
- source_word: הָאֲנָשִׁים
  choice: hao wanaume
  rationale: Chanzo kinasema hasa ‘wanaume,’ si neno la jumla ‘watu’; ‘hao’ huakisi uainishaji wa nomino katika Kiebrania.
- source_word: וְיַעַבְדוּ
  choice: ili wamtumikie
  rationale: Kitenzi kinaweza kuhusisha kumtumikia na kumwabudu Mungu; ‘wamtumikie’ huhifadhi maana pana zaidi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina la Mungu YHWH kwa kulitamka kwa namna iliyozoeleka badala ya kulibadili kuwa cheo.
- source_word: הֲטֶרֶם תֵּדַע
  choice: Je, bado hujui
  rationale: Ni karipio la kawaida katika Kiswahili linalowasilisha maana ya ‘hujatambua mpaka sasa?’
- source_word: אָבְדָה
  choice: imeangamia
  rationale: Kitenzi kamilifu kinaonyesha Misri kuwa tayari katika hali ya uharibifu mkubwa; ‘imeangamia’ huhifadhi uzito wa kauli ya chanzo.
- source_word: מִצְרַיִם
  choice: Misri
  rationale: Jina la kawaida la nchi hiyo katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia jina la agano YHWH moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Nomino ya kijinsia הָאֲנָשִׁים
  choice: hao wanaume
  alternative: hao watu
  rationale: Nomino ya chanzo inamaanisha wanaume hasa, hivyo tafsiri haipanui kimya kimya kuwa ‘watu.’
- issue: Maana ya עבד kwa Mungu
  choice: wamtumikie
  alternative: wamwabudu
  rationale: ‘Kumtumikia’ huhifadhi upana wa kitenzi, ambacho katika uhusiano na Mungu kinaweza pia kujumuisha ibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘Waache ... waende’ ni wa asili kuliko ‘watume waondoke,’ huku ‘mtu huyu’ na ‘mtego’ zikihifadhi sitiari na rejeleo la Kiebrania.
