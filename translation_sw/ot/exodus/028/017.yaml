  yaml_path: translation/ot/exodus/028/017.yaml
  text: 'And you shall set in it settings of stones[a], four rows of stones: the first row shall be a ruby, a topaz, and an emerald.'
translation:
  language: sw
  text: Nawe utaweka ndani yake vito vilivyowekwa katika mipangilio, safu nne za vito. Safu ya kwanza itakuwa na akiki nyekundu, topazi, na zumaridi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho kamili wa vito hivi hauna uhakika. “Akiki nyekundu” huenda ikawa rubi au karneliani; “topazi” huenda ikawa krisoliti au peridoti; na “zumaridi” huenda ikawa berili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתָ בּוֹ מִלֻּאַת אֶבֶן
  choice: utaweka ndani yake vito vilivyopangwa
  rationale: Kitenzi מלא kina maana ya msingi ya ‘kujaza,’ lakini katika muktadha wa kazi ya fundi kinahusu kuweka vito ndani ya kifuko cha kifuani. Usemi huu wa Kiswahili ni wa kawaida na unaonyesha vito vilivyowekwa kwa mpangilio bila kudai kwa uhakika aina ya fremu zake.
- source_word: אַרְבָּעָה טוּרִים אֶבֶן
  choice: katika safu nne
  rationale: טוּר humaanisha safu iliyopangwa; ‘safu nne’ ni tafsiri wazi na ya asili katika Kiswahili.
- source_word: טוּר ... הָאֶחָד
  choice: Safu ya kwanza
  rationale: Katika mfuatano wa safu nne, usemi huu unaitambulisha safu ya kwanza.
- source_word: אֹדֶם
  choice: akiki nyekundu
  rationale: Jina kamili la kito halijulikani kwa hakika. Neno la Kiebrania linahusishwa na rangi nyekundu; ‘akiki nyekundu’ linafaa kwa uwezekano wa carnelian na kutofautisha kito hiki na rubi.
- source_word: פִּטְדָה
  choice: topazi
  rationale: Utambulisho wa madini haya hauna uhakika, lakini ‘topazi’ ni jina linalotambulika na la jadi; uwezekano mwingine umewekwa katika tanbihi.
- source_word: בָרֶקֶת
  choice: zumaridi
  rationale: ‘Zumaridi’ ni tafsiri ya kawaida ya jina hili la kito, ingawa asili yake inayohusiana na kumetameta na utambulisho usio hakika huruhusu uwezekano wa berili.
