  text: It shall be square and doubled[a], a span its length and a span its width.
translation:
  language: sw
  text: Kitakuwa cha mraba, kimekunjwa mara mbili[a], shibiri moja kwa urefu na shibiri moja kwa upana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “cha maradufu.” Kiebrania hueleza kifuko cha kifuani kuwa kimefanywa maradufu, yaelekea kwa kukunjwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: ya mraba
  rationale: Hueleza umbo lenye pande nne zilizo sawa; ‘ya mraba’ ni Kiswahili cha kawaida na sahihi.
- source_word: יִהְיֶה
  choice: Itakuwa
  rationale: Kauli ya wakati ujao hapa inatoa agizo kuhusu jinsi kifuko cha kifuani kitakavyotengenezwa.
- source_word: כָּפוּל
  choice: kukunjwa mara mbili
  rationale: Neno hili linaonyesha kitu kilichofanywa kuwa cha tabaka mbili, yaelekea kwa kukunjwa; tafsiri hii ni ya kawaida huku tanbihi ikihifadhi uwezekano wa ‘kuwa maradufu’.
- source_word: זֶרֶת
  choice: shibiri moja
  rationale: זֶרֶת ni kipimo cha umbali wa mkono ulionyoshwa kutoka ncha ya kidole gumba hadi ncha ya kidole kidogo; ‘shibiri’ ndilo neno sahihi la Kiswahili.
- source_word: אָרְכּוֹ
  choice: urefu wake
  rationale: Huwakilisha nomino ‘urefu’ pamoja na kiambishi kinachorejelea kifuko cha kifuani.
- source_word: וְזֶרֶת
  choice: na ... shibiri moja
  rationale: Kiunganishi kinaunganisha kipimo cha pili na cha kwanza, na kurudia kipimo kunaleta uwazi.
- source_word: רָחְבּוֹ
  choice: upana wake
  rationale: ‘Upana’ ni neno la kawaida la Kiswahili na linatofautisha kipimo hiki na urefu.
