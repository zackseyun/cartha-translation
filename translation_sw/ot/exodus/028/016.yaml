  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Neno ‘shibiri’ linahifadhi kipimo cha kale bila kukichanganya na upana wa kiganja.
