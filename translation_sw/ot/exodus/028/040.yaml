  yaml_path: translation/ot/exodus/028/040.yaml
  text: For Aaron’s sons you shall make tunics[a], and you shall make sashes for them, and you shall make caps for them, for glory and for beauty.
translation:
  language: sw
  text: Kwa wana wa Aroni utatengeneza kanzu; utawatengenezea mishipi, na utawatengenezea vilemba[a], kwa utukufu na uzuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kofia” au “vifuniko vya kichwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אַהֲרֹן
  choice: kwa ajili ya wana wa Aroni
  rationale: Huhifadhi rejeo la moja kwa moja kwa wana wa Aroni bila kulipanua kuwa wazao wake wote.
- source_word: תַּעֲשֶׂה / וְעָשִׂיתָ
  choice: utatengeneza / utawatengenezea
  rationale: Miundo hii ina nguvu ya agizo katika muktadha wa maagizo; wakati ujao wa Kiswahili unaendeleza sauti rasmi na ya moja kwa moja.
- source_word: כֻתֳּנֹת
  choice: kanzu
  rationale: Neno hili linamaanisha vazi la msingi linalofunika mwili; “kanzu” ni neno la kawaida na linaloeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: אַבְנֵטִים
  choice: mishipi
  rationale: Hurejelea mikanda ya kitambaa iliyofungwa kiunoni. “Mishipi” ni ya asili katika Kiswahili na haikulazimishi dhana ya mkanda mgumu wa kisasa.
- source_word: מִגְבָּעוֹת
  choice: vilemba[a]
  rationale: Hurejelea mavazi ya kichwani ya makuhani, tofauti na vazi la kichwani la Aroni. “Vilemba” linafaa kwa kifuniko cha kichwa cha kitambaa, huku tanbihi ikihifadhi kutokuwa na uhakika kuhusu umbo lake kamili.
- source_word: לְכָבוֹד וּלְתִפְאָרֶת
  choice: kwa heshima na fahari
  rationale: Jozi hii ya maneno inaeleza hadhi na uzuri wa kuvutia wa mavazi. Tafsiri hii ni ya heshima, ya asili katika Kiswahili, na haiongezi maana ya kitheolojia isiyosemwa.
theological_decisions:
- issue: Kusudi la mavazi ya kikuhani
  choice: kwa heshima na fahari
  alternative: kwa utukufu na uzuri
  rationale: Kiebrania kinaonyesha kwamba mavazi hayo yalipaswa kuleta hadhi na uzuri wa kuvutia. “Heshima na fahari” huhifadhi kusudi hilo kwa Kiswahili cha kawaida chenye hadhi bila kuingiza ishara za kitheolojia za baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye sauti rasmi lakini inayoeleweka kwa msomaji wa kawaida. Alama ya tanbihi imewekwa baada ya neno linalohusika, “vilemba,” badala ya baada ya “kanzu.”
