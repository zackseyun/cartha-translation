  text: וְ/נָתַתָּ֞ אֶל חֹ֣שֶׁן הַ/מִּשְׁפָּ֗ט אֶת הָ/אוּרִים֙ וְ/אֶת הַ/תֻּמִּ֔ים וְ/הָיוּ֙ עַל לֵ֣ב אַהֲרֹ֔ן בְּ/בֹא֖/וֹ לִ/פְנֵ֣י יְהוָ֑ה וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת מִשְׁפַּ֨ט בְּנֵי יִשְׂרָאֵ֧ל עַל לִבּ֛/וֹ לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/030.yaml
  text: And you shall put the Urim and the Thummim into the breastpiece of judgment[a], and they shall be on Aaron’s heart when he goes in before Yahweh[c][b]. And Aaron shall bear the judgment of the sons of Israel on his heart before Yahweh continually.
translation:
  language: sw
  text: Nawe utatie Urimu na Thumimu[a] ndani ya kifuko cha kifuani cha hukumu[b], navyo vitakuwa juu ya moyo wa Aroni anapoingia mbele za Yahwe. Naye Aroni ataibeba hukumu ya wana wa Israeli[c] juu ya moyo wake mbele za Yahwe daima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Urimu na Thumimu ni majina ya Kiebrania ya vitu vitakatifu vilivyohusishwa na hukumu ya kikuhani. Sura na jinsi ya matumizi yake havijulikani kwa uhakika. Huenda majina hayo yakahusiana na maana za “nuru” na “ukamilifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kifuko cha kifuani cha uamuzi” au “kifuko cha kifuani cha haki.” Neno la Kiebrania מִשְׁפָּט linaweza kumaanisha hukumu, uamuzi, au haki kulingana na muktadha.
    reason: alternative_reading
  - marker: c
    text: “Wana wa Israeli” ndio usemi wa Kiebrania; hapa unawarejelea watu wa agano wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן הַמִּשְׁפָּט
  choice: kifuko cha kifuani cha hukumu
  rationale: חֹשֶׁן ni vazi au kifuko cha kikuhani kilichovaliwa kifuani na kilichohusishwa na Urimu na Thumimu. Neno “hukumu” linadumisha מִשְׁפָּט na uhusiano wake na kutolewa kwa uamuzi wenye mamlaka.
- source_word: הָאוּרִים וְהַתֻּמִּים
  choice: Urimu na Thumimu
  rationale: Majina haya ya vitu vitakatifu yamenukuliwa kwa sauti badala ya kutafsiriwa, kwa kuwa umbo, matumizi, na asili kamili ya majina hayo havijulikani kwa uhakika.
- source_word: אֶל
  choice: ndani ya
  rationale: Pamoja na kitenzi נָתַתָּ na חֹשֶׁן inayoweza kuwa na kitu ndani yake, kauli hii inaonyesha kuwekwa kwa Urimu na Thumimu ndani ya kifuko cha kifuani.
- source_word: וְהָיוּ עַל לֵב אַהֲרֹן
  choice: navyo vitakuwa juu ya moyo wa Aroni
  rationale: Kauli hii inadumisha picha halisi ya kitu kilichovaliwa juu ya kifua na pia maana yake ya uwakilishi.
- source_word: בְּבֹאוֹ לִפְנֵי יְהוָה
  choice: anapoingia mbele za Yahwe
  rationale: Muundo huu unaonyesha wakati Aroni anapoingia katika uwepo wa Mungu, hasa katika mazingira ya patakatifu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limenukuliwa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: וְנָשָׂא
  choice: ataibeba
  rationale: Kitenzi נשא kina maana ya kubeba; hapa kinahifadhi maana halisi ya kubeba juu ya kifua na maana ya wajibu wa uwakilishi.
- source_word: מִשְׁפַּט בְּנֵי יִשְׂרָאֵל
  choice: hukumu ya wana wa Israeli
  rationale: “Hukumu” inadumisha urudiaji wa מִשְׁפָּט katika mstari na haifungi maana yake kwa “uamuzi” au “haki” pekee.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hii inafuata kwa karibu usemi wa Kiebrania na kudumisha jina la kiagano la taifa bila kuligeuza kimyakimya kuwa usemi mwingine.
- source_word: תָּמִיד
  choice: daima
  rationale: Katika muktadha wa kikuhani, neno hili linaonyesha wajibu unaoendelea au wa kudumu mbele za Mungu, si lazima tendo lisilokatizwa kila sekunde.
theological_decisions:
- issue: Kutafsiri maana ya אוּרִים na תֻּמִּים au kunukuu majina hayo
  choice: Urimu na Thumimu
  alternative: nuru na ukamilifu
  rationale: Asili ya majina na namna vitu hivyo vilivyotumika havijulikani kwa uhakika. Kunukuu majina kunahifadhi kutokuwa na uhakika huko bila kuwasilisha etimolojia inayobishaniwa kana kwamba ni maana iliyothibitishwa.
- issue: Maana ya מִשְׁפָּט katika sehemu zote mbili za mstari
  choice: hukumu
  alternative: uamuzi; haki
  rationale: “Hukumu” inadumisha neno lilelile katika sehemu zote mbili na uzito wa tendo la kutoa uamuzi wenye mamlaka, bila kufafanua kupita kiasi utendaji wa Urimu na Thumimu.
- issue: Jinsi ya kutafsiri בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Usemi wa Kiebrania ni “wana wa Israeli” na hutumika kama jina la kiagano la watu wa Israeli. Tafsiri hii inahifadhi umbo hilo, huku tanbihi ikifafanua marejeo yake ya kijumla.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. “Kifuko cha kifuani” kinaeleza kwa uwazi kitu kilichovaliwa kifuani na chenye nafasi ya kuweka Urimu na Thumimu. Viunganishi “Nawe” na “Naye” vinadumisha mfululizo rahisi wa Kiebrania, na “mbele za Yahwe” ni usemi wa kawaida wa Kiswahili unaohifadhi wazo la kuingia katika uwepo wa Mungu.
