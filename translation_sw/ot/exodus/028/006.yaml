base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/006.yaml
  text: And they shall make the ephod of gold[a], blue, and purple, scarlet yarn, and fine twisted linen[b], the work of a skillful designer.
translation:
  language: sw
  text: Nao wataitengeneza efodi kwa dhahabu[a], nyuzi za rangi ya buluu, zambarau, na nyekundu angavu, na kitani safi kilichosokotwa, kwa ufundi wa fundi stadi wa kubuni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uzi wa dhahabu.” Kiebrania kinasema tu “dhahabu,” lakini katika muktadha huu huenda ikawa dhahabu iliyofanywa kuwa uzi wa kufumwa katika kitambaa.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa ufundi wa mbunifu” au “kwa ufundi wa fundi stadi.” Kirai cha Kiebrania kinamaanisha ufundi wa kisanaa wenye mpangilio au michoro.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Nao wataitengeneza
  rationale: Katika mfululizo wa maagizo, umbo hili lina nguvu ya agizo la wakati ujao. Kauli hii ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: הָאֵפֹד
  choice: efodi
  rationale: Ni istilahi maalumu ya vazi la kikuhani isiyo na kisawe kamili cha Kiswahili; unukuzi huepuka kufafanua umbo lake kupita ushahidi wa maandishi.
- source_word: זָהָב
  choice: dhahabu
  rationale: Kiebrania kinataja dhahabu tu. Ingawa muktadha wa ufumaji unaweza kumaanisha uzi wa dhahabu, neno 'uzi' halijaelezwa wazi na limewekwa katika tanbihi.
- source_word: תְּכֵלֶת
  choice: nyuzi za rangi ya buluu
  rationale: Neno ni jina la rangi au kitu kilichotiwa rangi hiyo katika orodha ya vifaa vya nguo; kutaja nyuzi hufanya muktadha wa utengenezaji kuwa wa kawaida kwa Kiswahili.
- source_word: וְאַרְגָּמָן
  choice: zambarau
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa rangi hii katika orodha ya vifaa vya hema takatifu.
- source_word: תּוֹלַעַת שָׁנִי
  choice: nyekundu
  rationale: Kirai kinamaanisha nyenzo au uzi uliotiwa rangi nyekundu angavu. 'Nyuzi' iliyotajwa mwanzoni inatawala mfululizo wote wa rangi kwa Kiswahili cha kawaida.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: kitani safi kilichosokotwa
  rationale: שֵׁשׁ ni kitani bora au safi, na מָשְׁזָר hueleza kwamba kilisokotwa; tafsiri inahifadhi sifa zote mbili.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: kazi ya fundi stadi wa kubuni
  rationale: Kirai kinaonyesha ufundi wa kisanaa wenye mpango au michoro, si kazi ya kawaida tu wala lazima udarizi pekee.
