  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Neno la kiufundi “efodi” limetoholewa, na utata halisi wa תְּכֵלֶת umehifadhiwa katika tanbihi.
