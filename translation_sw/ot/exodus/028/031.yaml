translation:
  language: sw
  text: Nawe utatengeneza joho la efodi lote kwa kitambaa cha buluu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lote la buluu,” yaani joho lote litengenezwe kwa nyenzo ya buluu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “buluu” linaweza kumaanisha kitambaa cha gharama kilichotiwa rangi katika wigo wa buluu hadi buluu-zambarau.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utalitengeneza
  rationale: Kauli ya Qal katika mfululizo wa maagizo ina nguvu ya amri; muundo huu unadumisha sauti ya maagizo na unaunganisha sentensi na yaliyotangulia.
- source_word: מְעִיל
  choice: joho
  rationale: Neno hili humaanisha vazi refu la ukuhani; “joho” ni Kiswahili cha sasa, kinachoeleweka na chenye hadhi.
- source_word: הָאֵפֹד
  choice: efodi
  rationale: Hili ni neno la kiufundi la vazi la kuhani, hivyo limetoholewa badala ya kupewa maelezo yasiyo na uhakika. Muundo wa Kiebrania unaonyesha joho linalohusiana na efodi.
- source_word: כְּלִיל
  choice: lote
  rationale: Neno linaonyesha ukamilifu au ujumla wa joho; “lote” linaeleweka kwa kawaida na halilazimishi iwapo msisitizo ni rangi au nyenzo.
- source_word: תְּכֵלֶת
  choice: kitambaa cha buluu
  rationale: Neno linaweza kumaanisha rangi ya buluu au nyenzo ya gharama iliyotiwa rangi katika wigo wa buluu hadi buluu-zambarau. “Kitambaa cha buluu” linafaa katika muktadha wa kutengeneza vazi, huku tanbihi zikihifadhi upeo wa maana.
