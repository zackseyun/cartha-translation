  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה הַ/בְּגָדִ֜ים אֲשֶׁ֣ר יַעֲשׂ֗וּ חֹ֤שֶׁן וְ/אֵפוֹד֙ וּ/מְעִ֔יל וּ/כְתֹ֥נֶת תַּשְׁבֵּ֖ץ מִצְנֶ֣פֶת וְ/אַבְנֵ֑ט וְ/עָשׂ֨וּ בִגְדֵי קֹ֜דֶשׁ לְ/אַהֲרֹ֥ן אָחִ֛י/ךָ וּ/לְ/בָנָ֖י/ו לְ/כַהֲנ/וֹ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/004.yaml
  text: 'And these are the garments that they shall make: a breastpiece[a], an ephod, a robe, a checkered tunic, a turban, and a sash. They shall make holy garments for Aaron your brother and for his sons[d][c][b], for him to serve as priest to me.'
translation:
  language: sw
  text: 'Na haya ndiyo mavazi watakayoyatengeneza: kifuko cha kifuani[a], efodi[b], joho, kanzu iliyofumwa kwa nakshi[c], kilemba na mshipi. Watawatengenezea Haruni, ndugu yako, na wanawe mavazi matakatifu[d], ili anitumikie kama kuhani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kibamba cha kifuani.” Neno la Kiebrania linataja kifaa cha kikuhani kilichovaliwa kifuani, si ngao ya vita.
    reason: lexical_alternative
  - marker: b
    text: Efodi ilikuwa vazi maalumu la kikuhani; hakuna neno moja la Kiswahili linalolingana nalo kikamilifu.
    reason: cultural_note
  - marker: c
    text: Au “kanzu yenye mpangilio wa miraba.” Maana kamili ya neno la Kiebrania kuhusu namna ya ufumaji haina uhakika.
    reason: lexical_alternative
  - marker: d
    text: Au “mavazi yaliyowekwa wakfu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגָדִים
  choice: mavazi
  rationale: Ni neno la kawaida na lenye hadhi linalofaa kwa mavazi ya kikuhani bila kuingiza istilahi za madhehebu ya baadaye.
- source_word: יַעֲשׂוּ
  choice: watakayoyatengeneza / watamtengenezea
  rationale: Wakati ujao katika muktadha huu una nguvu ya agizo. Muundo huu ni wa asili katika Kiswahili na unaendeleza sauti ya maagizo.
- source_word: חֹשֶׁן
  choice: kifuko cha kifuani
  rationale: Kitu hiki cha kikuhani kilivaliwa kifuani na huenda kilikuwa kama kifuko; tafsiri hii huepuka kukifanya kionekane kama silaha.
- source_word: אֵפוֹד
  choice: efodi
  rationale: Ni vazi maalumu la kikuhani lisilo na neno moja kamili la Kiswahili; kwa hiyo istilahi ya Kiebrania imetoholewa.
- source_word: מְעִיל
  choice: joho
  rationale: Neno hili linaeleza kwa uwazi vazi refu la nje katika orodha ya mavazi ya kikuhani.
- source_word: כְתֹנֶת תַּשְׁבֵּץ
  choice: kanzu iliyofumwa kwa nakshi
  rationale: כְתֹנֶת ni kanzu, na תַּשְׁבֵּץ hudokeza ufumaji wenye mpangilio au nakshi. Tafsiri haifungii maana kwenye miraba pekee, jambo ambalo halina uhakika.
- source_word: מִצְנֶפֶת
  choice: kilemba
  rationale: Ni neno la kawaida la Kiswahili kwa kitambaa cha kichwani kilichofungwa, na linafaa kwa vazi hili la kikuhani.
- source_word: אַבְנֵט
  choice: mshipi
  rationale: Hueleza ukanda wa kitambaa uliofungwa kiunoni na inasomeka kwa kawaida katika Kiswahili.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: mavazi matakatifu
  rationale: Tafsiri ya moja kwa moja inayodumisha lugha kuu ya utakatifu katika muktadha wa ukuhani.
- source_word: לְאַהֲרֹן אָחִיךָ וּלְבָנָיו
  choice: Haruni ndugu yako na wanawe
  rationale: Hudumisha usemi wa kindugu kwa Musa na kutaja wana wa kiume kwa usahihi kama ilivyo katika Kiebrania.
- source_word: לְכַהֲנוֹ לִי
  choice: ili anitumikie kama kuhani
  rationale: Hueleza kusudi la mavazi na kuhifadhi kiambishi cha umoja cha Kiebrania, ambacho kinamrejelea Haruni kwa karibu zaidi.
theological_decisions:
- issue: Istilahi za mavazi ya kikuhani bila kuingiza mapokeo ya baadaye
  choice: Kutumia maneno ya kawaida lakini sahihi, huku אֵפוֹד ikitoholewa kuwa “efodi.”
  alternative: Kutafsiri efodi kwa maelezo kama “aproni ya kikuhani,” au kutumia istilahi za kikanisa za baadaye.
  rationale: Muktadha ni wa ibada ya hema takatifu. Maneno yenye visawe wazi yametafsiriwa, lakini efodi imehifadhiwa kama istilahi maalumu kwa kuwa hakuna kisawe kamili.
- issue: Uana wa warithi wa ukuhani
  choice: “wanawe”
  alternative: “watoto wake” au “wazao wake”
  rationale: וּלְבָנָיו hutaja wana wa Haruni moja kwa moja katika muktadha huu, hivyo maana yake ya kijinsia haijaondolewa.
- issue: Umoja katika לְכַהֲנוֹ baada ya Haruni na wanawe kutajwa
  choice: “ili anitumikie kama kuhani”
  alternative: “ili wanitumikie kama makuhani”
  rationale: Kiebrania kina kiambishi cha umoja, kinachoweza kumrejelea Haruni hasa ingawa wanawe wametajwa pia. Tafsiri inahifadhi mvutano huo badala ya kuubadili kimya kuwa wingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni wazi kwa msomaji wa kawaida; istilahi ya kiufundi “efodi” imeelezwa katika tanbihi. Umoja wa “anitumikie” umehifadhiwa kwa sababu upo katika matini ya Kiebrania.
