base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/041.yaml
  text: You shall clothe Aaron your brother and his sons with him[a], and you shall anoint them and ordain them and consecrate them, and they shall serve as priests to me.
translation:
  language: sw
  text: Utawavika Haruni, ndugu yako, na wanawe pamoja naye; utawatia mafuta, utawaweka rasmi[a], na utawaweka wakfu, nao watanitumikia kama makuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “utajaza mkono wao,” msemo wa Kiebrania unaomaanisha kuwaweka rasmi katika huduma ya ukuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: Utawavika
  rationale: Kauli ya kutendesha ya לבשׁ inaonyesha kwamba Musa atawavika mavazi ya ukuhani yaliyotajwa katika muktadha. Kitenzi cha Kiswahili “kuvika” kinaeleza tendo hilo kwa ufupi na kwa kawaida.
- source_word: אֹתָם ... אֶת אַהֲרֹן אָחִיךָ וְאֶת בָּנָיו אִתּוֹ
  choice: Aroni ndugu yako na wanawe walio pamoja naye
  rationale: Majina yanabainisha wale wanaorejelewa na kiwakilishi cha Kiebrania. Kiswahili cha kawaida hakihitaji kurudia kiwakilishi kabla ya majina; “walio pamoja naye” huhifadhi maana ya אִתּוֹ.
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: utawatia mafuta
  rationale: Katika muktadha huu משׁח ni tendo maalumu la ibada la kuwatia mafuta watu wanaowekwa kwa huduma ya ukuhani. “Kuwatia mafuta” ni usemi wa kawaida wa kibiblia na unaeleweka wazi katika Kiswahili.
- source_word: וּמִלֵּאתָ אֶת יָדָם
  choice: utawaweka rasmi
  rationale: Maana ya neno kwa neno ni “utaijaza mikono yao,” lakini huu ni msemo wa Kiebrania wa kuwaingiza rasmi katika cheo na huduma ya ukuhani. “Kuwaweka rasmi” huepuka kuingiza dhana maalumu za kimadhehebu huku ikitoa kazi ya msemo huo.
- source_word: וְקִדַּשְׁתָּ אֹתָם
  choice: na kuwaweka wakfu
  rationale: קדשׁ hapa humaanisha kuwatenga kuwa watakatifu kwa huduma takatifu. “Kuwaweka wakfu” ni lugha ya sasa, yenye hadhi, na inayofaa muktadha wa ibada.
- source_word: וְכִהֲנוּ לִי
  choice: nao watanitumikia kama makuhani
  rationale: Kitenzi כהן humaanisha kutenda au kuhudumu kama kuhani. Muundo huu huhifadhi huduma ya kikuhani na pia uhusiano wa לִי, yaani huduma inayotolewa kwa Mungu.
theological_decisions:
- issue: Msemo wa kuwekwa katika ukuhani מִלֵּא אֶת־יָד
  choice: Kutafsiri katika matini kuu kuwa “utawaweka rasmi”
  alternative: “utaijaza mikono yao” au “utawaweka katika cheo”
  rationale: Tafsiri ya neno kwa neno ingekuwa fumbo lisiloeleweka kwa wasomaji wengi wa Kiswahili. “Kuwaweka rasmi” huwasilisha kuingizwa rasmi katika huduma ya ukuhani bila kuhusisha kimyakimya taratibu za baadaye za dhehebu fulani; maana halisi imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi vya wakati ujao unafuata hatua za ibada katika Kiebrania, huku semikoloni ikitenganisha kuvishwa na hatua zinazofuata bila kuvunja mshikamano wa sentensi.
