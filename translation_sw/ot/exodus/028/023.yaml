translation:
  language: sw
  text: Utengeneze pete mbili za dhahabu kwa ajili ya kifuko cha kifuani, nawe uweke pete hizo mbili kwenye ncha mbili za kifuko cha kifuani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Utengeneze
  rationale: Kauli timilifu ya Qal yenye kiunganishi katika mfululizo wa maagizo ina nguvu ya amri; umbo hili ni la kawaida na wazi katika Kiswahili cha maagizo.
- source_word: עַל הַחֹשֶׁן
  choice: kwenye kifuko cha kifuani
  rationale: עַל inaonyesha mahali pete zitakapowekwa; חֹשֶׁן ni kifaa cha kuhani mkuu kilichovaliwa kifuani na kilichokuwa kama kifuko.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: pete mbili za dhahabu
  rationale: Muundo huu unaonyesha idadi na malighafi; tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: וְנָתַתָּ
  choice: kisha uziweke
  rationale: Kitenzi kina maana ya kuweka kitu mahali fulani; 'kisha' huwasilisha kwa kawaida mwendelezo wa hatua za agizo.
- source_word: אֶת שְׁתֵּי הַטַּבָּעוֹת
  choice: pete hizo mbili
  rationale: Kibainishi cha moja kwa moja hakitafsiriwi, huku umbo bainifu likirejelea pete zilizotajwa tayari.
- source_word: עַל שְׁנֵי קְצֹוֹת הַחֹשֶׁן
  choice: kwenye ncha zake mbili
  rationale: קָצֶה humaanisha ncha au mwisho; kiwakilishi 'zake' huepuka kurudia jina huku kikihifadhi rejeo wazi kwa kifuko cha kifuani.
