base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/008.yaml
  text: 'And the skillfully woven band of his ephod[a], which is on it, shall be like its workmanship, of one piece with it: gold, blue, and purple, and scarlet yarn[b], and fine twisted linen.'
translation:
  language: sw
  text: 'Na mkanda wa efodi yake uliofumwa kwa ustadi[a], ulio juu ya efodi, utakuwa wa ufundi uleule na utatengenezwa pamoja nayo: dhahabu, uzi wa buluu, wa zambarau, wa nyekundu[b], na kitani safi kilichosokotwa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkanda wa efodi yake.” Neno la Kiebrania linamaanisha sehemu ya kitambaa iliyofumwa, iliyotumika kama mkanda.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania “buluu, zambarau na nyekundu” kinarejelea nyenzo za kitambaa zilizotiwa rangi hizo na kutumiwa katika hema takatifu na mavazi ya ukuhani.
    reason: cultural_note
lexical_decisions:
- source_word: חֵשֶׁב
  choice: mkanda ... uliofumwa kwa ustadi
  rationale: Katika muktadha wa mavazi ya ukuhani, neno hili linamaanisha sehemu ya kitambaa iliyofumwa inayotumika kama mkanda; tafsiri hii pia inaonyesha ustadi wa utengenezaji.
- source_word: אֲפֻדָּתוֹ
  choice: efodi yake
  rationale: Neno la mavazi maalumu ya kuhani limetoholewa kama “efodi,” huku kiambishi cha umilikaji kikihifadhiwa.
- source_word: אֲשֶׁר עָלָיו
  choice: ambao uko juu yake
  rationale: Kiwakilishi kinaelekea kurejelea efodi, mtangulizi wa karibu, bila kuongeza dhana ya kuambatishwa ambayo haijasemwa wazi.
- source_word: כְּמַעֲשֵׂהוּ
  choice: wa ufundi uleule kama efodi
  rationale: Huhifadhi maana ya kufanana kwa namna au ufundi wa utengenezaji, bila kuichanganya na kishazi kinachofuata.
- source_word: מִמֶּנּוּ יִהְיֶה
  choice: sehemu moja nayo
  rationale: Kiebrania, kihalisi “utatokana nayo,” kinaonyesha kwamba mkanda ulikuwa sehemu ya efodi yenyewe, si kipande tofauti.
- source_word: זָהָב
  choice: dhahabu
  rationale: Jina la nyenzo limetafsiriwa moja kwa moja.
- source_word: תְּכֵלֶת
  choice: nyuzi za rangi ya buluu
  rationale: Katika orodha hii ya vifaa vya nguo, neno linataja nyenzo ya kitambaa iliyotiwa rangi ya buluu.
- source_word: אַרְגָּמָן
  choice: zambarau
  rationale: Hii ndiyo tafsiri ya kawaida na inayoeleweka ya rangi hii katika maelezo ya hema takatifu.
- source_word: תוֹלַעַת שָׁנִי
  choice: nyekundu
  rationale: Usemi huu hutaja nyenzo iliyotiwa rangi nyekundu; “nyekundu” ni ya kawaida na wazi kwa wasomaji wa Kiswahili.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: kitani safi kilichosokotwa
  rationale: 'Huhifadhi maana zote mbili: kitani bora na nyuzi zilizosokotwa pamoja.'
