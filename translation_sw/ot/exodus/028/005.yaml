  text: And they shall take the gold[a], and the blue, and the purple, and the scarlet yarn[b], and the fine linen.
translation:
  language: sw
  text: Nao watachukua dhahabu, nyuzi za rangi ya buluu, za rangi ya zambarau, na za rangi nyekundu ang’avu[a], na kitani bora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi ni “nyekundu ya mdudu,” nahau inayorejelea nyenzo nyekundu ang’avu iliyotiwa rangi kutokana na mdudu; kwa hiyo, nyuzi nyekundu ang’avu.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵם
  choice: Nao
  rationale: Kiwakilishi huru cha Kiebrania kinataja wazi wahusika waliotangulia; “Nao” huhifadhi msisitizo huo kwa Kiswahili cha kawaida bila kuutia chumvi.
- source_word: יִקְחוּ
  choice: watachukua
  rationale: Kauli isiyotimilika hapa ina nguvu ya agizo katika mfululizo wa maagizo; wakati ujao wa Kiswahili huwasilisha kwa kawaida agizo hilo la kile watakachofanya.
- source_word: הַזָּהָב
  choice: dhahabu
  rationale: Ni dhahabu kama malighafi maalumu ya mavazi ya ukuhani; Kiswahili hakihitaji kuakisi kibainishi cha Kiebrania kwa neno tofauti.
- source_word: הַתְּכֵלֶת
  choice: nyuzi za rangi ya buluu
  rationale: Neno linaweza kumaanisha kitu cha kufumia kilichotiwa rangi, si dhana ya rangi pekee; muktadha wa kutengeneza mavazi unaunga mkono “nyuzi.”
- source_word: הָאַרְגָּמָן
  choice: za rangi ya zambarau
  rationale: Neno linamaanisha nyenzo iliyotiwa rangi ya zambarau; muundo huu unaendeleza “nyuzi” kwa ufasaha bila kurudia neno hilo.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: za rangi nyekundu
  rationale: Nahau hii inarejelea nyenzo nyekundu iliyotiwa rangi inayotokana na mdudu; “nyekundu” ni ya kawaida na inaeleweka, huku tanbihi ikihifadhi maelezo ya kitamaduni.
- source_word: הַשֵּׁשׁ
  choice: kitani safi
  rationale: Katika muktadha wa maskani, neno hili hurejelea kitani bora; “kitani safi” ni usemi wa kawaida wa kibiblia na unaoeleweka.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Orodha imetolewa kama malighafi za ufumaji badala ya majina ya rangi yasiyo na kitu kinachorejelewa. “Pamoja na” kabla ya kitani huweka wazi kuwa kitani si sehemu ya nyuzi zilizotajwa, huku ikihifadhi orodha ya Kiebrania.
