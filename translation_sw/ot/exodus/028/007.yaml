lexical_decisions:
- source_word: שְׁתֵּי כְתֵפֹת
  choice: vipande viwili vya mabegani
  rationale: Katika muktadha wa vazi, כְתֵפֹת ni sehemu za efodi zinazopita mabegani, si mabega ya mwili yenyewe. Usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: חֹבְרֹת
  choice: vilivyounganishwa
  rationale: Kivumishi hiki cha kitenzi חבר kinaeleza vipande hivyo kuwa vimeunganishwa na ncha za efodi; tafsiri inadumisha wazo la kuunganisha na kupatana na mzizi unaorudiwa mwishoni.
- source_word: יִהְיֶה לּוֹ
  choice: itakuwa na
  rationale: Muundo wa Kiebrania wa kuwapo pamoja na לּוֹ unaonyesha umilikaji; Kiswahili cha kawaida hutumia 'itakuwa na'.
- source_word: שְׁנֵי קְצוֹתָיו
  choice: ncha zake mbili
  rationale: קָצֶה humaanisha mwisho au ncha. 'Ncha zake mbili' linafaa kwa miisho ya vazi bila kuifasiri hasa kuwa kingo.
- source_word: וְחֻבָּר
  choice: nayo itaunganishwa
  rationale: Tafsiri hii inadumisha kauli tendwa na kiunganishi cha Kiebrania bila kulazimisha uhusiano wa kusudi au matokeo ambao unaweza tu kudokezwa.
