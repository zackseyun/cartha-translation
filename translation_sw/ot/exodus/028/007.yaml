  language: sw
  text: Itakuwa na vipande viwili vya mabegani[a] vilivyounganishwa kwenye ncha zake mbili, nayo itaunganishwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mikanda miwili ya mabegani.” Neno la Kiebrania linaweza kumaanisha sehemu za vazi zinazohusiana na mabega, wala si mabega yenyewe.
    reason: lexical_alternative
