base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/025.yaml
  text: And you shall put the two ends of the two cords on the two settings[a], and you shall place them on the shoulder pieces of the ephod, at its front.
translation:
  language: sw
  text: Nawe utazitia ncha mbili za kamba hizo mbili[a] kwenye vishikio viwili, nawe utavitia vishikio hivyo kwenye vipande vya mabega vya efodi, upande wake wa mbele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “minyororo miwili.” Neno la Kiebrania linaweza kumaanisha kamba zilizosokotwa au kazi ya minyororo; muktadha wa vifaa vya dhahabu unaunga mkono uwezekano wa minyororo.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצוֹת
  choice: ncha
  rationale: Neno hili linamaanisha sehemu za mwisho za kamba au minyororo; “ncha” ni neno la kawaida na sahihi katika muktadha huu.
- source_word: הָעֲבֹתֹת
  choice: kamba
  rationale: Neno la Kiebrania linaweza kumaanisha kamba zilizosokotwa au minyororo iliyofumwa. “Kamba” inadumisha taswira ya msingi, huku uwezekano wa minyororo ukihifadhiwa katika tanbihi.
- source_word: הַמִּשְׁבְּצֹת
  choice: vifuko
  rationale: Katika maagizo haya, neno hili linarejelea sehemu za dhahabu zilizotengenezwa kwa ajili ya kushikilia au kupachika. “Vifuko” ni istilahi inayoeleweka bila kubainisha kupita kiasi umbo la mapambo.
- source_word: כִתְפֹת
  choice: vipande vya mabega
  rationale: Ingawa neno lenyewe ni “mabega,” hapa linamaanisha sehemu za vazi zinazokaa mabegani, si mabega ya Haruni yenyewe.
- source_word: אֵפֹד
  choice: efodi
  rationale: Hili ni vazi maalumu la kikuhani lisilo na kisawe kamili cha Kiswahili; umbo la jina lililotoholewa linafaa zaidi kuliko ufafanuzi wa kimafsiri.
- source_word: אֶל מוּל פָּנָיו
  choice: upande wake wa mbele
  rationale: Kirai hiki kinaonyesha upande wa mbele unaotazama nje wa efodi; tafsiri hii ni ya kawaida na inahifadhi maelekezo ya mahali.
- source_word: וְנָתַתָּה
  choice: kisha utaziweka
  rationale: Kitenzi נתן kimerudiwa. “Utaziweka” kinawasilisha tendo hilo kwa Kiswahili cha kawaida, na kiambishi “-zi-” kinarejelea ncha za kamba.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa maagizo umehifadhiwa, na istilahi maalumu “efodi” imetoholewa. Tanbihi zinaonyesha kutokuwa na uhakika kwa maneno ya vifaa vya ufundi.
