base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/021.yaml
  text: And the stones shall correspond to the names of the sons of Israel[a], twelve according to their names. They shall be engraved like a signet, each with his name[c][b], for the twelve tribes.
translation:
  language: sw
  text: Nayo mawe yatakuwa kulingana na majina ya wana wa Israeli[a], mawe kumi na mawili kulingana na majina yao. Yatachongwa kwa namna ya michongo ya muhuri[b], kila jiwe kwa jina lake, kwa ajili ya makabila kumi na mawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yakiwa na majina ya wana wa Israeli.” Kiebrania kinasema kihalisi kwamba mawe “yatakuwa juu ya/kulingana na majina ya wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “yakiwa na michongo ya muhuri,” au “yakiwa yamechongwa kwa mchongo wa muhuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: Nayo mawe
  rationale: Kiunganishi na nomino yenye uambishaji maalumu huendeleza maagizo yaliyotangulia; “Nayo mawe” ni muunganisho wa kawaida na wenye heshima katika Kiswahili.
- source_word: תִּהְיֶיןָ עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: yatakuwa kulingana na majina ya wana wa Israeli
  rationale: Kitenzi ni “yatakuwa,” huku עַל pamoja na “majina” ikionyesha uhusiano au ulinganifu. Tafsiri hii inahifadhi muundo huo bila kudai moja kwa moja kwamba mawe ndiyo yanayobeba majina.
- source_word: שְׁתֵּים עֶשְׂרֵה עַל שְׁמֹתָם
  choice: kumi na mawili kulingana na majina yao
  rationale: Inahifadhi idadi ya mawe na urudiaji wa uhusiano wake na majina.
- source_word: פִּתּוּחֵי חוֹתָם
  choice: yatachongwa kama muhuri
  rationale: Kirai kinarejelea mchongo wa namna inayotumiwa kwenye muhuri; usemi huu ni wa asili katika Kiswahili na unadumisha picha ya muhuri.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: kila moja likiwa na jina lake
  rationale: אִישׁ imetumiwa kwa maana ya kugawa, “kila moja.” Kiswahili hutumia upatanisho wa kisarufi wa “jiwe,” hivyo “jina lake” huepuka kuingiza jinsia ya mtu mahali ambapo mawe ndiyo yanayogawiwa majina.
- source_word: תִּהְיֶיןָ לִשְׁנֵי עָשָׂר שָׁבֶט
  choice: kwa ajili ya makabila kumi na mawili
  rationale: לְ hapa inaonyesha rejeleo au kusudi la mawe kuhusiana na makabila kumi na mawili.
theological_decisions:
- issue: Usemi wa agano בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: “Wana wa Israeli” huhifadhi usemi halisi wa Kiebrania na uhusiano wake na Israeli kama babu wa makabila, bila kuufanya kuwa istilahi ya jumla kimyakimya.
- issue: Rejeleo la umoja katika אִישׁ עַל שְׁמוֹ
  choice: kila moja likiwa na jina lake
  alternative: kila mmoja kulingana na jina lake
  rationale: Muktadha wa karibu unagawa majina kwa kila jiwe. Upatanisho wa Kiswahili hufuata “jiwe”; tafsiri hii haibadili fundisho lolote kuhusu wana wa Israeli wala haiongezi dai la kijinsia lisilohitajika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nayo” huunganisha mstari na maagizo yaliyotangulia; “yatachongwa kama muhuri” ni wazi kwa msomaji wa kawaida huku tanbihi ikihifadhi umbo la nomino la Kiebrania.
