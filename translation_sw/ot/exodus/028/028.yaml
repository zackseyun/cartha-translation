base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/028.yaml
  text: They shall bind the breastpiece by its rings to the rings of the ephod with a cord of blue yarn[a], so that it may be on the skillfully woven band of the ephod[c][b], and the breastpiece shall not come loose from the ephod.
translation:
  language: sw
  text: Nao watafunga kifuko cha kifuani[a] kwa pete zake kwenye pete za efodi, kwa kamba ya buluu[b], ili kiwe juu ya ukanda wa efodi uliofumwa kwa ustadi; wala kifuko cha kifuani kisitengane na efodi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kifaa cha kifuani.” Neno la Kiebrania hapa linataja kifaa cha kikuhani cha kifuani kilichounganishwa na efodi, si vazi la chuma la kujikinga.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa kamba ya nyuzi za buluu.” Neno la Kiebrania תְּכֵלֶת linataja nyenzo iliyotiwa rangi ya buluu iliyotumiwa katika vitambaa vya maskani na mavazi ya kikuhani.
    reason: lexical_alternative
  - marker: c
    text: Au “kisiondoke kutoka juu ya efodi.” Kitenzi cha Kiebrania hapa kinaonyesha kutosogezwa au kutenganishwa kutoka efodi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְכְּסוּ
  choice: wataifunga
  rationale: Kitenzi hiki humaanisha kuunganisha au kukaza vitu pamoja. “Wataifunga” ni Kiswahili cha kawaida kinachofaa kwa pete na utepe bila kubainisha kupita kiasi namna hasa ya kufunga.
- source_word: הַחֹשֶׁן
  choice: kifuko cha kifuani
  rationale: Katika mavazi ya kuhani, neno hili linataja kifaa cha kifuani kilichokuwa na vito na kilichounganishwa na efodi, wala si vazi la chuma la kujikinga. “Kifuko cha kifuani” pia hudokeza umbo lake lililokunjwa kama mfuko.
- source_word: מִטַּבְּעֹתָיו
  choice: kwa pete zake
  rationale: Kiambishi מִן kinaonyesha mahali au njia ya kuunganisha; “kwa pete zake” huonyesha kwa kawaida kwamba pete za kifuko zilitumiwa kukifungia kwenye pete za efodi.
- source_word: טַבְּעֹת הָאֵפֹד
  choice: pete za efodi
  rationale: Hii ni tafsiri ya moja kwa moja ya muundo wa umilikaji na hudumisha istilahi ya vazi hilo la kikuhani.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: kwa utepe wa nyuzi za buluu
  rationale: פְּתִיל ni uzi uliosokotwa au utepe mwembamba, na תְּכֵלֶת ni nyenzo iliyotiwa rangi ya buluu iliyotumiwa katika vitambaa vya maskani na mavazi ya kikuhani. Usemi huu ni wa asili katika Kiswahili na huhifadhi mazingira ya ufumaji.
- source_word: לִהְיוֹת עַל
  choice: ili kiwe juu ya
  rationale: Muundo wa kitenzi-jina unaonyesha kusudi au matokeo. “Ili kiwe juu ya” hufuata maana ya msingi bila kuongeza wazo la kukiegemeza ambalo halijaelezwa wazi.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: ukanda wa efodi uliofumwa kwa ustadi
  rationale: Katika muktadha huu חֵשֶׁב ni ukanda uliokuwa sehemu ya efodi; maelezo “uliofumwa kwa ustadi” yanaendana na kazi ya ufumaji iliyotajwa kuhusu ukanda huu katika muktadha.
- source_word: וְלֹא יִזַּח
  choice: kisiondoke mahali pake
  rationale: Kitenzi adimu katika kauli ya Niphal kinaweza kueleza kusogezwa, kulegea, au kutenganishwa. “Kisiondoke mahali pake” huwasilisha kusudi la kifungo huku kikihifadhi wazo la kutosogezwa.
- source_word: מֵעַל הָאֵפֹד
  choice: juu ya efodi
  rationale: Kirai hiki kinaonyesha kuondoka kutoka mahali kifuko kilipokuwa juu ya efodi; muundo wa sentensi ya Kiswahili unawasilisha uhusiano huo wazi.
