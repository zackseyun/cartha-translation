lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: Nawe uwatengenezee
  rationale: Kauli ya amri yenye waw ya mwendelezo inaendelezwa kwa “Nawe”; “uwatengenezee” huonyesha wazi kuwa vitu hivyo vinatengenezwa kwa ajili yao.
- source_word: לָהֶם
  choice: kwa ajili yao (katika kiambishi -wa- na -ee cha “uwatengenezee”)
  rationale: Kiswahili huwasilisha maana ya mnufaika kwa njia ya kawaida katika umbo la kitenzi, bila kulazimika kuongeza maneno mazito.
- source_word: מִכְנְסֵי בָד
  choice: suruali fupi za kitani
  rationale: Neno hilo linataja vazi la sehemu ya chini ya mwili lililovaliwa chini ya mavazi mengine; “suruali fupi” ni ya sasa na inaeleweka, huku “za kitani” ikihifadhi aina ya kitambaa.
- source_word: לְכַסּוֹת
  choice: ili kufunika
  rationale: Huonyesha kwa kawaida kusudi la vazi kama infinitivu ya Kiebrania inavyofanya.
- source_word: בְּשַׂר עֶרְוָה
  choice: uchi wa miili yao
  rationale: Huhifadhi picha halisi ya “mwili/nyama ya uchi” kwa Kiswahili cha heshima, bila kuibadili moja kwa moja kuwa kiungo maalumu zaidi ya usemi wa Kiebrania.
- source_word: מִמָּתְנַיִם
  choice: kuanzia kiunoni
  rationale: מָתְנַיִם inaweza kumaanisha viuno au eneo la kiuno; katika maelezo ya mpaka wa juu wa vazi, “kiunoni” ni ya kawaida na wazi kwa wasomaji wa leo.
- source_word: וְעַד יְרֵכַיִם
  choice: na kufika mapajani
  rationale: יָרֵךְ hapa huonyesha paja kama mpaka wa chini wa vazi; “kufika mapajani” ni usemi wa kawaida wa kueleza urefu.
- source_word: יִהְיוּ
  choice: zianzie ... na kufika
  rationale: Ingawa kitenzi kimsingi ni “zitakuwa,” Kiswahili cha kawaida hueleza mipaka ya vazi kwa “zianzie ... na kufika,” bila kubadili maana ya eneo linalofunikwa.
