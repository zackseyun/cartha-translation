  text: Nawe uwatengenezee nguo za ndani za kitani[a] ili kufunika uchi wao; zitaanzia viunoni hadi mapajani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “suruali fupi za kitani.” Kiebrania kinarejelea vazi la sehemu ya chini ya mwili lililovaliwa chini ya mavazi ya kikuhani.
    reason: lexical_alternative
