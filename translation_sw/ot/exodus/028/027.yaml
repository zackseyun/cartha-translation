base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/027.yaml
  text: You shall make two rings of gold and put them on the two shoulder-pieces of the ephod[a], underneath, on its front side, opposite its seam[b], above the skillfully woven band of the ephod.
translation:
  language: sw
  text: Utatengeneza pete mbili za dhahabu na kuziweka kwenye vipande viwili vya mabega vya efodi, chini, upande wake wa mbele, mkabala na sehemu yake ya kuunganishwa[a], juu ya ukanda wa efodi uliosukwa kwa ustadi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mshono wake” au “sehemu yake ya kushikamanisha.” Kiebrania hurejelea kwa upana mahali ambapo efodi inaunganishwa.
    reason: lexical_alternative
  - marker: b
    text: Au “mkanda wa kiunoni wa efodi uliosukwa.” Neno la Kiebrania חֵשֶׁב humaanisha ukanda au sehemu maalumu ya kufungia efodi.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת
  choice: pete
  rationale: Neno hili kwa kawaida humaanisha pete za chuma zinazotumiwa kufungia au kuunganisha vitu; “pete” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: כִתְפוֹת
  choice: vipande vya mabegani
  rationale: Katika uundaji wa vazi, neno hili linaelekea kumaanisha sehemu za efodi zinazokaa mabegani, si mabega ya mtu moja kwa moja.
- source_word: הָאֵפוֹד
  choice: efodi
  rationale: Jina la vazi hili maalumu la kikuhani limetoholewa ili kuhifadhi istilahi ya kiibada isiyo na kisawe kifupi na kamili katika Kiswahili.
- source_word: מִלְמַטָּה
  choice: upande wa chini
  rationale: Kauli hii inaonyesha mahali palipo chini; tafsiri hii ni wazi na ya kawaida kwa maelekezo ya utengenezaji.
- source_word: מִמּוּל פָּנָיו
  choice: upande wake wa mbele
  rationale: Nahau ya Kiebrania yenye maana halisi ya kuwa mbele ya uso wa kitu imetolewa kwa Kiswahili kinachoeleweka kwa kitu kisicho hai.
- source_word: לְעֻמַּת
  choice: mkabala na
  rationale: Inaonyesha ulinganifu au kuelekeana kwa nafasi bila kulazimisha maana ya kuwa mbali au kugusana.
- source_word: מֶחְבַּרְתּוֹ
  choice: mahali pake pa kuunganishia
  rationale: Neno la Kiebrania lina maana pana ya sehemu ya kuunganisha; chaguo hili huhifadhi upana huo kuliko “mshono” pekee.
- source_word: מִמַּעַל
  choice: juu ya
  rationale: Hueleza nafasi iliyo juu ya sehemu inayotajwa baada yake.
- source_word: חֵשֶׁב הָאֵפוֹד
  choice: ukanda wa efodi uliosukwa kwa ustadi
  rationale: Katika muktadha huu חֵשֶׁב ni sehemu ya efodi iliyo kama ukanda na iliyotengenezwa kwa ufundi; tafsiri hii inaeleza umbo na kazi yake bila kuifanya tu kuwa mkanda wa kiunoni.
