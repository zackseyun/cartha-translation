lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Nawe utaweka
  rationale: Kauli timilifu ya Qal yenye waw katika mfululizo wa maagizo ina nguvu ya amri; “utaweka” ni ya kawaida na inahifadhi mtindo wa maagizo ya ujenzi.
- source_word: שְׁתֵּי עֲבֹתֹת הַזָּהָב
  choice: minyororo miwili ya dhahabu iliyosokotwa
  rationale: עֲבֹתֹת katika muktadha huu ni kazi ya minyororo au kamba zilizofumwa au kusokotwa. Tafsiri hii inaonyesha umbo lake na kwamba imetengenezwa kwa dhahabu.
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: kwenye pete hizo mbili
  rationale: עַל hapa huonyesha mahali pa kuweka au kuunganisha minyororo. “Kwenye” ni Kiswahili cha kawaida kwa uhusiano huo, na “hizo” huonyesha pete zilizotajwa katika muktadha wa karibu.
- source_word: אֶל קְצ֖וֹת הַחֹשֶׁן
  choice: kwenye ncha za kifuko cha kifuani
  rationale: קְצ֖וֹת ni ncha au sehemu za mwisho. חֹשֶׁן ni sehemu ya vazi la kuhani iliyovaliwa kifuani, inayofanana zaidi na kifuko cha mapambo kuliko bamba la silaha.
