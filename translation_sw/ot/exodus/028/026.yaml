  text: You shall make two gold rings and put them on the two ends of the breastpiece[a], on its edge that is toward the inner side of the ephod.
translation:
  language: sw
  text: Utengeneze pete mbili za dhahabu, na uziweke kwenye ncha mbili za kifuko cha kifuani, kwenye ukingo wake unaoelekea upande wa ndani wa naivera.[a]
  philosophy: optimal-equivalence
