lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utengeneze
  rationale: Kauli kamilifu ya Qal yenye kiunganishi katika mfululizo wa maagizo ina nguvu ya amri; “utengeneze” ni ya kawaida na yenye heshima katika Kiswahili cha maagizo.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: pete mbili za dhahabu
  rationale: Huwasilisha kwa kawaida idadi, kitu, na nyenzo katika Kiswahili.
- source_word: וְשַׂמְתָּ אֹתָם
  choice: na uziweke
  rationale: Kitenzi שׂים kina maana ya kuweka; kiwakilishi cha ngeli katika “uziweke” kinarejelea pete mbili.
- source_word: עַל שְׁנֵי קְצוֹת הַחֹשֶׁן
  choice: kwenye ncha mbili za kifuko cha kifuani
  rationale: קצה ni ncha au mwisho. “Kifuko cha kifuani” ni tafsiri inayoeleweka ya חֹשֶׁן katika mavazi ya kuhani bila kudokeza kwamba ni sehemu ya mwili.
- source_word: עַל שְׂפָתוֹ
  choice: kwenye ukingo wake
  rationale: שָׂפָה hapa ni ukingo wa kitu, si mdomo halisi.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  choice: unaoelekea ndani upande wa naivera
  rationale: עֵבֶר huonyesha upande au mwelekeo, na בָּיְתָה humaanisha kuelekea ndani. Muundo huu huhifadhi uhusiano wa mahali bila kuufafanua kupita ushahidi wa Kiebrania.
- source_word: הָאֵפֹד
  choice: naivera
  rationale: “Naivera” ni istilahi ya kawaida ya kibiblia ya Kiswahili kwa vazi la kikuhani linaloitwa ephod.
