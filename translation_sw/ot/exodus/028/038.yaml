id: EXO.28.38
reference: Exodus 28:38
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיָה֮ עַל מֵ֣צַח אַהֲרֹן֒ וְ/נָשָׂ֨א אַהֲרֹ֜ן אֶת עֲוֺ֣ן הַ/קֳּדָשִׁ֗ים אֲשֶׁ֤ר יַקְדִּ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לְ/כָֽל מַתְּנֹ֖ת קָדְשֵׁי/הֶ֑ם וְ/הָיָ֤ה עַל מִצְח/וֹ֙ תָּמִ֔יד לְ/רָצ֥וֹן לָ/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/038.yaml
  text: It shall be on Aaron’s forehead[a], and Aaron shall bear the iniquity of the holy things that the sons of Israel consecrate, for all the gifts of their holy things. It shall always be on his forehead[c][b], for acceptance for them before Yahweh.
translation:
  language: sw
  text: Nacho kitakuwa juu ya paji la uso la Aroni, naye Aroni atabeba hatia ya vitu vitakatifu[a] ambavyo wana wa Israeli wanaviweka wakfu, kuhusu matoleo yao yote matakatifu. Nacho kitakuwa juu ya paji la uso wake daima, ili wapate kibali mbele za Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atabeba uovu wa vitu vitakatifu.” Nahau ya Kiebrania “kubeba hatia/uovu” inaweza kumaanisha kubeba hatia au uwajibikaji unaohusiana na matoleo matakatifu.
    reason: lexical_alternative
  - marker: b
    text: Au, “ili wao wapate kibali,” au “ili wakubalike mbele za Yahweh.” Kiebrania kinaweza kurejelea kibali kwa watu katika uhusiano na matoleo yao.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵצַח / מִצְחוֹ
  choice: paji la uso
  rationale: Hili ndilo neno la kawaida na lililo wazi katika Kiswahili kwa sehemu ya mbele ya kichwa, na linafaa katika kauli inayorudiwa kuhusu mahali kitu hicho kinapowekwa.
- source_word: נָשָׂא ... עֲוֺן
  choice: atabeba uovu unaohusiana na
  rationale: Muundo huu huhifadhi taswira ya kubeba uwajibikaji au hatia bila kuamua kimyakimya kwamba maana ni kuondoa dhambi. Kirai 'unaohusiana na' kinaweka wazi kuwa vitu vitakatifu vyenyewe si watenda dhambi.
- source_word: הַקֳּדָשִׁים
  choice: vitu vitakatifu
  rationale: Wingi huu unahusu vitu au sadaka zilizotengwa kwa matumizi matakatifu; tafsiri hii ni wazi na haiifanyi maana kuwa sadaka pekee.
- source_word: יַקְדִּישׁוּ
  choice: wanaviweka wakfu
  rationale: Hueleza kwa Kiswahili cha sasa tendo la kutenga na kumtolea Mungu vitu hivyo, bila kutumia istilahi isiyoeleweka kwa urahisi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi kwa karibu jina la agano lililo katika Kiebrania, huku ikibaki kauli ya kawaida na inayoeleweka katika Kiswahili cha Biblia.
- source_word: לְכָל מַתְּנֹת קָדְשֵׁיהֶם
  choice: katika matoleo yao yote matakatifu
  rationale: Kihusishi na uhusiano wa nomino katika Kiebrania ni mgumu. Kauli hii ya asili inaunganisha kosa linalobebwa na jumla ya matoleo matakatifu bila kurudia kwa namna nzito 'zawadi za vitu vyao vitakatifu.'
- source_word: תָּמִיד
  choice: daima
  rationale: Hutoa maana ya kuwapo kwa kuendelea na ni Kiswahili cha kawaida, chenye hadhi.
- source_word: לְרָצוֹן לָהֶם
  choice: ili wapate kibali
  rationale: Hutoa kwa njia ya asili kusudi au matokeo ya kukubaliwa, huku tanbihi ikihifadhi uwezekano wa kuelewa kauli hiyo kama kukubaliwa kwa watu au kwa matoleo yao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Inawakilisha jina binafsi la Mungu, Tetragramatoni, badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Maana ya Aroni kubeba uovu wa vitu vitakatifu
  choice: Aroni anabeba uovu, hatia, au uwajibikaji unaohusiana na vitu vitakatifu katika nafasi yake ya ukuhani.
  alternative: Aroni anaondoa moja kwa moja dhambi ya vitu vitakatifu, au anabeba tu kumbukumbu ya dhambi za Israeli kwa mfano.
  rationale: Nahau ya Kiebrania inaweza kumaanisha kubeba hatia au uwajibikaji. Tafsiri haijengi nadharia kamili ya upatanisho wala kuamua zaidi ya ushahidi wa mstari.
- issue: Kirejelewa cha לְרָצוֹן לָהֶם
  choice: Wana wa Israeli wanapata kibali mbele za Yahweh kwa kuhusishwa na matoleo yao yaliyowekwa wakfu.
  alternative: Matoleo peke yake ndiyo yanayokubaliwa.
  rationale: Kiwakilishi 'wao' kwa kawaida kinawarejelea waabudu, lakini muktadha pia unahusisha matoleo yao; tanbihi huhifadhi upeo huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo mgumu wa Kiebrania umerahisishwa kiasi kwa uasilia, huku nahau ya kikuhani, jina Yahweh, na utata kuhusu anayekubaliwa vikihifadhiwa katika matini na tanbihi.
