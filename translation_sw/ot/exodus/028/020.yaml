  text: 'Na safu ya nne: berili[a], oniksi, na yaspi; yawekwe katika vishikio vya dhahabu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho kamili wa baadhi ya mawe ya thamani katika kifuko cha kifuani cha kuhani mkuu hauna uhakika. Tafsiri za kimapokeo ni pamoja na “berili” kwa תַּרְשִׁישׁ na “oniksi” kwa שֹׁהַם, lakini utambulisho mwingine pia umependekezwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: Na safu ya nne
  rationale: Katika orodha hii טּוּר ni safu ya mawe; namba ya mpangilio הָרְבִיעִי imetafsiriwa moja kwa moja.
- source_word: תַּרְשִׁישׁ
  choice: berili
  rationale: Utambulisho kamili wa jiwe hili la kale hauna uhakika; “berili” ni tafsiri ya kimapokeo inayotambulika, huku tanbihi ikihifadhi kutokuwa na uhakika.
- source_word: וְשֹׁהַם
  choice: shohamu
  rationale: Utambulisho wa madini haya unabishaniwa. Utohozi wa jina la Kiebrania huepuka kulifanya kwa uhakika kuwa oniksi, lakini tanbihi inataja tafsiri hiyo ya kimapokeo.
- source_word: וְיָשְׁפֵה
  choice: na yaspi
  rationale: “Yaspi” ni jina linalotumika kwa jiwe linalohusishwa kwa kawaida na יָשְׁפֵה.
- source_word: מְשֻׁבָּצִים זָהָב יִהְיוּ בְּמִלּוּאֹתָם
  choice: yawekwe katika vishikio vyake vya dhahabu
  rationale: Muundo wa maagizo umehifadhiwa kwa “yawekwe”; “vishikio vyake vya dhahabu” hueleza kwa Kiswahili cha kawaida sehemu za dhahabu ambamo mawe yalipachikwa.
