  yaml_path: translation/ot/exodus/028/014.yaml
  text: And make two chains of pure gold[a], braided like cords[b]; and put the braided chains on the settings.
translation:
  language: sw
  text: Tengeneza minyororo miwili ya dhahabu safi[a], ya kusokotwa kama kamba; kisha weka minyororo hiyo ya kusokotwa kwenye viunzi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “minyororo miwili ya dhahabu safi, ya kusokotwa kama kamba, itengeneze kwa kazi ya kamba.” Kiebrania hutumia maneno mawili yanayohusiana yanayoelekea kueleza kazi ya kusokotwa au kufanywa kama kamba.
    reason: lexical_alternative
  - marker: b
    text: “Viunzi” inaweza pia kutafsiriwa “vishikio” au “vikalio vya kazi ya nyuzi za dhahabu,” yaani fremu za dhahabu zilizowekwa kwenye vazi la kuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי שַׁרְשְׁרֹת
  choice: minyororo miwili
  rationale: Kirai hiki kinataja minyororo miwili ya mapambo ya vazi la kuhani; mpangilio huu ni wa kawaida na wazi katika Kiswahili.
- source_word: זָהָב טָהוֹר
  choice: dhahabu safi
  rationale: Hii ndiyo tafsiri ya kawaida ya nyenzo hiyo yenye ubora unaofaa kwa mavazi matakatifu.
- source_word: מִגְבָּלֹת ... מַעֲשֵׂה עֲבֹת
  choice: iliyosokotwa kama kamba
  rationale: Maneno haya magumu na yanayohusiana yanaeleza kazi ya kusokota au kuunda minyororo kwa mfano wa kamba. Tafsiri hii inaeleza umbo linalokusudiwa bila kudai mbinu mahususi kupita ushahidi wa Kiebrania.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: Tengeneza
  rationale: Ni agizo la moja kwa moja kwa Musa; ‘tengeneza’ ni neno la asili na linalofaa kwa kazi ya ufundi.
- source_word: וְנָתַתָּ
  choice: kisha uifunge
  rationale: Kitenzi cha Kiebrania kimsingi ni ‘weka,’ lakini katika muktadha wa minyororo na viunzi kinamaanisha kuziweka au kuziambatisha. ‘Uifunge’ kinaeleza kwa kawaida uhusiano huo bila kuongeza maelezo ya kiufundi.
- source_word: שַׁרְשְׁרֹת הָעֲבֹתֹת
  choice: minyororo hiyo iliyosokotwa
  rationale: Inahifadhi urudiaji wa nomino na sifa yake, huku ‘hiyo’ ikiunganisha wazi na minyororo iliyotajwa mwanzoni.
- source_word: עַל הַמִּשְׁבְּצֹת
  choice: kwenye viunzi
  rationale: Neno hili linarejelea fremu au vishikio vya dhahabu vinavyohusiana na vazi la kuhani. ‘Viunzi’ ni neno pana linalohifadhi uwezekano wa fremu, vikalio, au vishikio.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa agizo ni wa moja kwa moja, wenye heshima na unaoeleweka kwa msomaji wa kawaida. Istilahi za ufundi zimewekwa wazi bila kuondoa kutokuwa na uhakika kwa maneno ya Kiebrania.
