  text: Na utachukua mawe mawili ya shohamu[a], na utachonga juu ya mawe hayo majina ya wana wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania shoham linamaanisha jiwe la thamani ambalo kijadi hutafsiriwa “oniksi”; utambulisho wake kamili hauna hakika. “Sardoniksi” au “berili” pia yamependekezwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Kisha utachukua
  rationale: Muundo huu katika mfululizo wa maagizo una nguvu ya amri. “Kisha” linaonyesha mwendelezo wa maagizo kwa Kiswahili cha kawaida.
- source_word: שְׁתֵּי אַבְנֵי שֹׁהַם
  choice: mawe mawili ya shohamu
  rationale: Utambulisho kamili wa jiwe שֹׁהַם hauna hakika. Kutumia jina lililotoholewa “shohamu” huepuka kulifanya kwa uhakika kuwa oniksi, huku tanbihi ikieleza mapokeo na uwezekano mwingine.
- source_word: וּפִתַּחְתָּ
  choice: na kuchonga
  rationale: Katika muktadha wa kuweka majina kwenye vito, “kuchonga” hueleza kitendo cha kukata maandishi kwenye uso wa jiwe kwa lugha ya kawaida na wazi.
- source_word: עֲלֵיהֶם
  choice: juu yake
  rationale: Kiwakilishi kinarejelea mawe mawili yaliyotajwa; Kiswahili sanifu hutumia “yake” kwa ngeli ya jiwe/mawe katika kirai hiki.
- source_word: שְׁמוֹת בְּנֵי יִשְׂרָאֵל
  choice: majina ya wana wa Israeli
  rationale: Hapa “wana wa Israeli” inawahusu wana wa Yakobo/Israeli ambao majina yao yanawakilisha makabila, si Waisraeli kwa ujumla.
