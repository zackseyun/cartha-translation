  text: kengele ya dhahabu na komamanga, kengele ya dhahabu na komamanga[b], kwenye upindo wa joho, pande zote[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya upindo wa joho, kuzunguka pande zote.” Kiebrania huunganisha kihusishi chenye maana ya “juu ya/kwenye” na kielezi chenye maana ya “kuzunguka, pande zote.”
