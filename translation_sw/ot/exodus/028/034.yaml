lexical_decisions:
- source_word: פַּעֲמֹן
  choice: kengele
  rationale: Neno hili humaanisha kengele ndogo iliyowekwa kwenye vazi la kuhani; “kengele” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: זָהָב
  choice: ya dhahabu
  rationale: Muundo huu unaonyesha kitu kilichotengenezwa kwa dhahabu; “kengele ya dhahabu” ni usemi wa kawaida na wazi.
- source_word: רִמּוֹן
  choice: komamanga
  rationale: Maana ya msingi ni tunda la komamanga. Katika muktadha huu huenda ni pambo lenye umbo la komamanga, lakini tafsiri ya moja kwa moja huhifadhi namna ya usemi wa Kiebrania.
- source_word: עַל
  choice: kuzunguka
  rationale: Ingawa kwa kawaida ni “juu ya/kwenye,” hapa ikiunganishwa na שׁוּלֵי na סָבִיב inaeleza mpangilio unaozunguka ukingo wa vazi.
- source_word: שׁוּלֵי
  choice: upindo
  rationale: Katika muktadha wa mavazi, neno hili humaanisha ukingo wa chini au upindo; “upindo” ni sahihi na la kawaida.
- source_word: מְעִיל
  choice: joho
  rationale: Katika muktadha wa mavazi ya ukuhani, “joho” linafaa kwa vazi hili kuliko “koti” au “vazi la nje.”
- source_word: סָבִיב
  choice: pande zote
  rationale: Kielezi hiki husisitiza kuwa mpangilio uliendelea kuzunguka upindo wote; “pande zote” huhifadhi msisitizo huo kwa Kiswahili cha asili.
