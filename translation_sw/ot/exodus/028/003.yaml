  text: And you shall speak to all the wise of heart[a], whom I have filled with a spirit of wisdom, and they shall make Aaron’s garments to consecrate him[c][b], for him to serve me as priest.
translation:
  language: sw
  text: Nawe utazungumza na wote wenye moyo wa hekima[a], ambao nimewajaza roho ya hekima[b], nao watatengeneza mavazi ya Haruni ili kumweka wakfu, ili anitumikie kama kuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wenye hekima ya moyo”; ni nahau inayomaanisha watu waliojaliwa ufahamu na ustadi.'
    reason: lexical_alternative
  - marker: b
    text: Au “Roho wa hekima.” Kiebrania kinaweza kumaanisha roho au mwelekeo wa hekima uliotolewa na Mungu; maneno ya msingi hayalazimishi rejeo liwe mahsusi zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּדַבֵּר
  choice: utazungumza
  rationale: Kauli ya maagizo ya wakati ujao inadumishwa kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: חַכְמֵי לֵב
  choice: wenye moyo wa hekima
  rationale: Inahifadhi tamathali ya Kiebrania inayohusisha moyo na hekima/ustadi, bila kuifupisha kuwa mafundi pekee.
- source_word: מִלֵּאתִיו רוּחַ חָכְמָה
  choice: ambao nimewajaza roho ya hekima
  rationale: Inahifadhi taswira ya kujazwa na kutotaja kwa uhakika Roho Mtakatifu; umoja wa kiwakilishi cha Kiebrania unaeleweka kwa maana ya kila mmoja katika kundi.
- source_word: בִּגְדֵי אַהֲרֹן
  choice: mavazi ya Haruni
  rationale: Ni tafsiri ya moja kwa moja ya muundo wa umilikaji, bila kuongeza neno 'ya kikuhani' lisilosemwa hapa.
- source_word: לְקַדְּשׁוֹ
  choice: ili kumweka wakfu
  rationale: Katika muktadha wa ukuhani, kitenzi hiki huonyesha kutengwa na kuwekwa kwa kazi takatifu.
- source_word: לְכַהֲנוֹ לִי
  choice: apate kunitumikia kama kuhani
  rationale: Inawasilisha kitenzi cha kutenda kazi ya kuhani pamoja na huduma inayoelekezwa kwa Mungu.
- source_word: וְעָשׂוּ
  choice: nao watatengeneza
  rationale: Inaendeleza mfuatano wa maagizo na kutumia kitenzi cha kawaida kwa utengenezaji wa mavazi.
theological_decisions:
- issue: Iwapo רוּחַ חָכְמָה litajwe wazi kuwa Roho Mtakatifu
  choice: roho ya hekima
  alternative: Roho wa hekima
  rationale: Kiebrania hakina kibainishi hapa, kwa hiyo tafsiri haipaswi kulazimisha utambulisho mahsusi zaidi ya maneno ya chanzo; bado inaruhusu hekima hiyo kueleweka kuwa imetolewa na Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa wasomaji wa kawaida huku nahau ya 'moyo wa hekima' na utata wa 'roho ya hekima' vikihifadhiwa.
