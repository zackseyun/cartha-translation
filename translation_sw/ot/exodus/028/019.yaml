- source_word: וְהַטּוּר
  choice: na safu ya
  rationale: Katika muktadha wa vito vya kifuko cha kifuani, טוּר ni safu ya mawe; וְ linaendeleza orodha kwa “na.”
- source_word: הַשְּׁלִישִׁי
  choice: tatu
