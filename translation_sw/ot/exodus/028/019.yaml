- source_word: לֶשֶׁם
  choice: yasintho[a]
  rationale: Utambulisho kamili wa kito hiki hauna uhakika. “Yasintho” ni jina linalotumika kwa yakinthi/jacinth, huku tanbihi ikihifadhi kutokuwa na uhakika.
- source_word: שְׁבוֹ
  choice: akiki[b]
  rationale: “Akiki” ni jina linaloeleweka la agate na linafuata mapokeo ya tafsiri, lakini uwezekano wa oniksi umeonyeshwa katika tanbihi.
- source_word: וְאַחְלָמָה
  choice: na amethisto
  rationale: Neno hili hutambulishwa kwa kawaida kuwa amethisto; tafsiri hiyo ni wazi na ya kawaida katika Kiswahili.
