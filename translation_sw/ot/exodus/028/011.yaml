  text: מַעֲשֵׂ֣ה חָרַשׁ֮ אֶבֶן֒ פִּתּוּחֵ֣י חֹתָ֗ם תְּפַתַּח֙ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֔ים עַל שְׁמֹ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל מֻסַבֹּ֛ת מִשְׁבְּצ֥וֹת זָהָ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/011.yaml
  text: Like the work of an engraver in stone[a], like the engravings of a signet, you shall engrave the two stones with the names of the sons of Israel[b]; you shall make them enclosed in settings of gold.
translation:
  language: sw
  text: Kwa ustadi wa mchongaji wa mawe, kama michongo ya muhuri, utayachonga mawe yale mawili kwa majina ya wana wa Israeli[a]; utayaweka katika vishikio vya dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania “wana wa Israeli”; hapa inarejelea wana wa Israeli ambao majina yao yalichongwa kwenye mawe, na ambao makabila ya Israeli yalitokana nao.
    reason: cultural_note
lexical_decisions:
- source_word: מַעֲשֵׂה חָרַשׁ אֶבֶן
  choice: Kwa ustadi wa mchongaji wa mawe
  rationale: Kirai hiki kinaeleza namna au kiwango cha ufundi. ‘Kwa ustadi wa’ ni Kiswahili cha asili kinachowasilisha kazi ya fundi anayechonga mawe bila kuifanya sentensi kuwa nzito.
- source_word: פִּתּוּחֵי חֹתָם
  choice: kama michoro ya muhuri
  rationale: Hurejelea michoro iliyokatwa au kuchongwa kwa mtindo wa muhuri. ‘Michoro ya muhuri’ ni wazi kwa msomaji wa kawaida na inadumisha taswira ya chanzo.
- source_word: תְּפַתַּח
  choice: utayachonga
  rationale: Katika muktadha wa kuweka majina kwenye mawe, ‘chonga’ hueleza kwa usahihi kukata maandishi ndani ya jiwe.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: yale mawe mawili
  rationale: ‘Mawe’ huhifadhi neno la jumla la Kiebrania; ‘yale’ hurejelea mawe yaliyotajwa katika muktadha uliotangulia.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: kwa majina ya wana wa Israeli
  rationale: ‘Kwa majina ya’ huonyesha yaliyopaswa kuchongwa. ‘Wana wa Israeli’ huhifadhi usemi wa kifamilia wa Kiebrania na muktadha wa majina ya wana wa Yakobo/Israeli.
- source_word: מֻסַבֹּת מִשְׁבְּצוֹת זָהָב
  choice: yazungukwe na vishikio vya dhahabu
  rationale: Kivumishi tendwa kinaonyesha mawe yakizungushiwa au kuwekewa fremu, na מִשְׁבְּצוֹת ni sehemu za kuyashikilia mawe. Tafsiri hii huepuka kubainisha kupita kiasi mbinu halisi ya kale.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: utayafanya
  rationale: Huhifadhi amri ya nafsi ya pili katika mtindo wa kawaida wa maagizo ya Kiswahili.
theological_decisions:
- issue: Usemi wa kifamilia wenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Chanzo kinatumia ‘wana wa Israeli,’ na katika muktadha huu majina yanahusiana na wana wa Israeli ambao makabila yalitokana nao. Tafsiri hiyo huhifadhi sura ya kifamilia bila kuipanua kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Muundo umerahisishwa kuwa agizo moja lenye mtiririko wa kawaida, huku istilahi za ufundi zikihifadhiwa bila kubainisha kupita kiasi umbo la vishikio vya kale.
