base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/032.yaml
  text: Its opening for the head shall be in the middle of it; around its opening there shall be a woven edge[a], like the opening of a coat of mail, so that it may not be torn.
translation:
  language: sw
  text: Tundu la kupitishia kichwa litakuwa katikati yake. Litakuwa na ukingo uliofumwa kuzunguka tundu hilo, kama tundu la vazi la kivita[a], ili tundu hilo lisichanike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama tundu la deraya.” Neno la Kiebrania תַחְרָא ni adimu; huenda mfano huo unarejelea tundu la shingo lililoimarishwa ili lisichanike.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי רֹאשׁוֹ
  choice: Tundu la kuingizia kichwa
  rationale: פֶּה kwa maana halisi ni ‘kinywa,’ lakini katika muktadha wa vazi humaanisha tundu; pamoja na רֹאשׁוֹ, ni tundu ambalo kichwa hupitishwa.
- source_word: בְּתוֹכוֹ
  choice: katikati yake
  rationale: Huonyesha kuwa tundu hilo liwekwe sehemu ya kati ya vazi.
- source_word: שָׂפָה ... מַעֲשֵׂה אֹרֵג
  choice: ukingo uliofumwa
  rationale: שָׂפָה hapa ni ukingo unaozunguka tundu, na מַעֲשֵׂה אֹרֵג inaeleza kuwa umetengenezwa kwa ufumaji.
- source_word: לְפִיו סָבִיב
  choice: Kuzunguka tundu hilo
  rationale: פֶּה imetumiwa tena kwa tundu la vazi, huku סָבִיב ikionyesha kulizunguka lote.
- source_word: כְּפִי תַחְרָא
  choice: kama tundu la vazi la kivita
  rationale: תַּחְרָא ni neno adimu linaloeleweka kwa kawaida kuwa vazi la kujikinga vitani; tafsiri pana ‘vazi la kivita’ huhifadhi maana inayowezekana bila kudai kwa uhakika aina maalumu ya silaha.
- source_word: לֹא יִקָּרֵעַ
  choice: ili lisiraruke
  rationale: Niphal ina maana ya kutendwa au matokeo; katika muktadha huu muundo huo unaonyesha kusudi la ukingo uliofumwa, yaani kuzuia vazi lisiraruke.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tundu la kuingizia kichwa’ ni wazi katika muktadha wa vazi; ‘ukingo uliofumwa’ huhifadhi picha ya ufumaji na uimarishaji. Utata wa neno adimu תַחְרָא umehifadhiwa kwa tafsiri pana katika matini na mbadala katika tanbihi.
