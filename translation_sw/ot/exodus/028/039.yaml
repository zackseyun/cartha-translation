base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/039.yaml
  text: You shall weave the tunic in checker work of fine linen[a], and you shall make a turban of fine linen, and you shall make a sash, the work of an embroiderer.
translation:
  language: sw
  text: Nawe utaifanya kanzu ya kitani safi kwa muundo wa miraba[a]; utatengeneza kilemba cha kitani safi, na utatengeneza mshipi, kazi ya mtarizi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utaifuma kanzu ya kitani safi kwa muundo wa miraba.” Huenda kitenzi cha Kiebrania kinarejelea kutengeneza kitambaa chenye muundo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבַּצְתָּ
  choice: utaifanya ... kwa muundo wa miraba
  rationale: Kitenzi שׁבץ katika muktadha wa mavazi ya kikuhani kinaelekea kumaanisha kutengeneza kitambaa chenye muundo, huenda wa miraba. Tafsiri hii inaeleza matokeo bila kulazimisha mbinu hususa ya ufumaji.
- source_word: הַכְּתֹנֶת
  choice: kanzu
  rationale: כְּתֹנֶת ni vazi refu la kuvaliwa mwilini; “kanzu” ni neno la kawaida na lenye hadhi katika Kiswahili cha Afrika Mashariki.
- source_word: שֵׁשׁ
  choice: kitani safi
  rationale: Katika maandiko ya hema na mavazi ya kikuhani, שֵׁשׁ humaanisha kitani cha ubora wa juu; “kitani safi” huhifadhi maana ya nyenzo na ubora wake.
- source_word: מִצְנֶפֶת
  choice: kilemba
  rationale: מִצְנֶפֶת ni kifuniko cha kichwa kinachozungushiwa kichwani; “kilemba” ndilo neno la Kiswahili lililo wazi na la asili.
- source_word: אַבְנֵט
  choice: mshipi
  rationale: אַבְנֵט ni utepe mrefu wa kiunoni, mara nyingi wenye mapambo. “Mshipi” unafaa zaidi kuliko “mkanda,” ambao unaweza kudokeza kitu cha ngozi chenye kifungo.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: kazi ya mtarizi
  rationale: Kirai hiki kinataja kazi ya fundi mwenye ustadi wa kutarizi au kutengeneza mapambo ya kitambaa; muundo wa nomino umehifadhiwa kwa Kiswahili cha kawaida.
