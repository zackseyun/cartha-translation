base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/033.yaml
  text: You shall make on its hem pomegranates of blue and purple and scarlet yarn[a], all around its hem, with bells of gold between them all around.
translation:
  language: sw
  text: Nawe utatengeneza kwenye upindo wake makomamanga ya uzi wa buluu, zambarau, na nyekundu[a], pande zote za upindo huo, na kengele za dhahabu katikati ya makomamanga hayo, pande zote za upindo huo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mapambo yenye umbo la komamanga.” Kiebrania kinasema moja kwa moja “makomamanga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utatengeneza
  rationale: Katika muktadha huu wa maagizo, umbo hili linatoa amri; wakati ujao wa Kiswahili unaeleza agizo hilo kwa lugha ya kawaida na yenye heshima.
- source_word: שׁוּלָיו
  choice: upindo wake
  rationale: Neno hili linaonyesha ukingo wa chini wa vazi; “upindo” ndilo neno la kawaida na sahihi kwa sehemu hiyo ya vazi.
- source_word: רִמֹּנֵי
  choice: makomamanga
  rationale: Kiebrania kinatumia jina halisi la tunda. Tafsiri kuu inalihifadhi, huku tanbihi ikifafanua kwamba huenda ni mapambo yenye umbo la komamanga.
- source_word: תְּכֵלֶת
  choice: uzi wa buluu
  rationale: Katika maelezo ya mavazi ya ibada, neno hili hurejelea kitambaa au uzi uliotiwa rangi ya buluu; “uzi” umewekwa wazi kwa sababu makomamanga haya yalikuwa mapambo ya nguo.
- source_word: אַרְגָּמָן
  choice: zambarau
  rationale: Hili ni neno la kawaida la Kiswahili kwa rangi ya thamani iliyotumiwa katika vitambaa vya hema takatifu.
- source_word: תוֹלַעַת שָׁנִי
  choice: nyekundu
  rationale: Kirai hiki hurejelea kitu kilichotiwa rangi nyekundu angavu. Katika mfululizo huu, “uzi wa” lililotajwa mwanzoni linaeleweka pia kwa rangi hii.
- source_word: סָבִיב
  choice: kuuzunguka
  rationale: Hueleza kwamba mapambo yaliwekwa katika upindo wote kwa mzunguko.
- source_word: וּפַעֲמֹנֵי זָהָב
  choice: na kengele za dhahabu
  rationale: Tafsiri hii huhifadhi kiunganishi na maana ya kengele zilizotengenezwa kwa dhahabu.
- source_word: בְּתוֹכָם
  choice: katikati yake
  rationale: Kirai hiki huweka kengele miongoni mwa makomamanga, yaani zikiwa zimepangwa baina yake, bila kulazimisha maelezo zaidi kuliko yaliyomo katika Kiebrania.
