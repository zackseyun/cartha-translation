  text: And you shall make holy garments for Aaron your brother[a], for glory and for beauty.
translation:
  language: sw
  text: Nawe utamtengenezea Haruni, ndugu yako, mavazi matakatifu kwa utukufu na uzuri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa heshima na fahari,” au “kwa utukufu na fahari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utamtengenezea
  rationale: Qal timilifu nafsi ya pili umoja pamoja na kiunganishi ina nguvu ya agizo katika muktadha huu. Muundo huu wa Kiswahili unaonyesha wazi agizo linaloelekezwa kwa Musa.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: mavazi matakatifu
  rationale: בִגְדֵי ni wingi wa neno la jumla la mavazi, na קֹדֶשׁ huonyesha kuwa yametengwa kwa matumizi matakatifu. Tafsiri hii ni rasmi bila kuingiza istilahi za baadaye za kidini.
- source_word: לְאַהֲרֹן אָחִיךָ
  choice: ndugu yako Haruni
  rationale: Inahifadhi uhusiano wa kifamilia unaomtambulisha Haruni kwa Musa, huku mpangilio huu ukiwa wa kawaida katika Kiswahili.
- source_word: לְכָבוֹד
  choice: kwa heshima
  rationale: כָּבוֹד inaweza kumaanisha utukufu, heshima, au hadhi. Katika maelezo ya mavazi ya kikuhani, 'heshima' huwasilisha hadhi inayoonekana bila kuamua kimya kimya kwamba utukufu unaotajwa ni wa Mungu pekee.
- source_word: וּלְתִפְאָרֶת
  choice: na fahari
  rationale: תִּפְאֶרֶת hujumuisha uzuri, fahari, na adhama. 'Fahari' inaendana kiasili na 'heshima' na kuhifadhi uzito wa uzuri wenye adhama wa mavazi hayo.
theological_decisions:
- issue: Kusudi au matokeo ya mavazi ya kikuhani
  choice: kwa heshima na fahari
  alternative: kwa utukufu na uzuri; kwa utukufu na fahari
  rationale: Virai vya Kiebrania vina upana wa maana na havitaji wazi ikiwa heshima au utukufu huo unamhusu Haruni, cheo chake, au uwakilishi wa Mungu. Tafsiri haibani maana hiyo, huku ikitoa Kiswahili cha sasa na chenye hadhi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Hakuna tanbihi iliyoongezwa kwa sababu tanbihi ya Kiingereza yenye alama [a] inaonekana kuhusishwa kimakosa na 'ndugu yako,' ilhali maudhui yake yanahusu maneno ya mwisho ya aya; tofauti hizo zimehifadhiwa katika maamuzi ya kileksika na kitheolojia badala ya kuweka alama ya kupotosha.
