    issue: Aaron's apposition is awkwardly ordered in the draft.
    rationale: “Utamtengenezea ndugu yako Haruni...” can be understood, but “Haruni, ndugu yako” more transparently expresses the Hebrew apposition and avoids a momentary ambiguity in the object-marked construction.
  - severity: low
    issue: The English audit-trail lexical-alternative note is not represented with a correctly placed Swahili anchor.
    rationale: The English marker is attached to “your brother” although its content concerns “for glory and for beauty.” A Swahili note, if retained, should be attached to the final purpose phrase.
