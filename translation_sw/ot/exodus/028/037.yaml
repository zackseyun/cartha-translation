  text: And you shall put it on a cord of blue[a], and it shall be on the turban[b]; it shall be at the front of the turban.
translation:
  language: sw
  text: Nawe utaiweka juu ya uzi wa samawati[a], nayo itakuwa juu ya kilemba; itakuwa mbele ya kilemba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kamba” au “utepe mwembamba” wa samawati.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, Kiebrania kinaonyesha mahali “kuelekea” au “mkabala na sehemu ya mbele ya kilemba,” yaani, mbele yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ אֹתוֹ
  choice: Nawe utaiweka
  rationale: Kitenzi שׂים humaanisha kuweka au kutia; “utaiweka” ni agizo la kawaida na la moja kwa moja, huku kiwakilishi “-i-” kikirejelea bamba lililotajwa katika mstari uliotangulia.
- source_word: פְּתִיל
  choice: kamba
  rationale: Neno hili linaweza kumaanisha uzi, utepe mwembamba, au kamba ya kufungia. “Kamba” linafaa kwa kazi ya kushikilia bamba, bila kubainisha unene usioelezwa katika Kiebrania.
- source_word: תְּכֵלֶת
  choice: samawati
  rationale: Neno hili hutaja rangi ya buluu iliyotokana na rangi ya thamani iliyotumiwa katika vifaa vya maskani. “Samawati” ni neno la kawaida na lenye heshima katika Kiswahili Sanifu; kivuli halisi cha rangi hakihakikishwi.
- source_word: וְהָיָה עַל הַמִּצְנָפֶת
  choice: nayo itakuwa juu ya kilemba
  rationale: מִצְנֶפֶת ni vazi la kichwa lililofungwa kwa kuzungushwa; “kilemba” ni tafsiri ya asili katika Kiswahili. “Juu ya” huhifadhi uhusiano wa עַל bila kudai namna kamili ya kukifunga.
- source_word: אֶל מוּל פְּנֵי הַמִּצְנֶפֶת
  choice: upande wa mbele wa kilemba
  rationale: Kirai hiki kinaeleza mwelekeo au mahali panapokabiliana na sehemu ya mbele. Tafsiri hii hutoa maelekezo ya mahali kwa uwazi, huku tanbihi ikihifadhi maana halisi zaidi ya “kuelekea/kukabiliana na mbele.”
- source_word: יִהְיֶה
  choice: itakuwa
  rationale: Kurudia “itakuwa” kunahifadhi msisitizo wa Kiebrania katika maelekezo ya mahali.
