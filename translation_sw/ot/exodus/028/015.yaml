  text: וְ/עָשִׂ֜יתָ חֹ֤שֶׁן מִשְׁפָּט֙ מַעֲשֵׂ֣ה חֹשֵׁ֔ב כְּ/מַעֲשֵׂ֥ה אֵפֹ֖ד תַּעֲשֶׂ֑/נּוּ זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן וְ/תוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר תַּעֲשֶׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/015.yaml
  text: 'You shall make a breastpiece of judgment[a], the work of a skillful designer; like the work of the ephod you shall make it: of gold, blue, purple, scarlet yarn[b], and finely twisted linen you shall make it.'
translation:
  language: sw
  text: “Utatengeneza kifuko cha kifuani cha hukumu[a], kazi ya mbunifu stadi; utakifanya kwa ufundi kama wa efodi. Utakifanya kwa dhahabu, uzi wa rangi ya buluu, uzi wa rangi ya zambarau, uzi wa rangi ya skarleti, na kitani safi kilichosokotwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kifuko cha kifuani kwa ajili ya hukumu,” au “kifuko cha kifuani cha uamuzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן
  choice: kifuko cha kifuani
  rationale: Kifaa hiki cha kikuhani kilivaliwa kifuani na huenda kilikuwa kama kifuko; tafsiri hii huepuka wazo potovu la ngao ya kivita linaloweza kuletwa na ‘bamba la kifuani’.
- source_word: מִשְׁפָּט
  choice: cha hukumu
  rationale: Inadumisha muundo na maana pana ya Kiebrania inayohusiana na hukumu au uamuzi bila kufafanua utendaji wake kupita yanayosemwa katika aya.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: kwa ufundi wa mbunifu stadi
  rationale: Hueleza kazi ya fundi mwenye ustadi wa kubuni na kutengeneza nakshi, huku ikibaki ya kawaida na inayoeleweka katika Kiswahili cha sasa.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: kwa ufundi kama ule wa efodi
  rationale: Inaonyesha kwamba aina au kiwango cha ufundi kilipaswa kufanana na kile cha efodi.
- source_word: אֵפֹד
  choice: efodi
  rationale: Ni istilahi maalumu ya vazi mahususi la kikuhani; unukuzi huhifadhi utambulisho wake kuliko kutumia jina pana la vazi.
- source_word: זָהָב
  choice: dhahabu
  rationale: Ni neno la kawaida na sahihi kwa nyenzo iliyotajwa.
- source_word: תְּכֵלֶת
  choice: nyuzi za rangi ya buluu
  rationale: Huwasilisha rangi ya kitambaa au uzi katika orodha hii ya vifaa vya kufuma.
- source_word: אַרְגָּמָן
  choice: zambarau
  rationale: Ni tafsiri ya kawaida ya rangi hii ya thamani; ‘nyuzi za rangi ya’ iliyotangulia inaeleweka pia kwa kipengele hiki.
- source_word: תוֹלַעַת שָׁנִי
  choice: nyekundu
  rationale: Hutoa maana ya rangi nyekundu angavu katika muktadha wa nyuzi zilizotiwa rangi, bila kulazimisha tofauti ya kivuli isiyo ya lazima.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: kitani safi kilichosokotwa
  rationale: Inahifadhi ubora wa kitani na namna yake ya kusokotwa kwa lugha ya asili na inayoeleweka.
- source_word: תַּעֲשֶׂנּוּ ... תַּעֲשֶׂה אֹתוֹ
  choice: Ukifanye ... Ukitengeneze
  rationale: Marudio ya agizo yamedumishwa kama katika Kiebrania, lakini kitenzi kimetofautishwa kidogo ili sentensi isikike ya kawaida kwa Kiswahili.
theological_decisions:
- issue: Kazi ya חֹשֶׁן מִשְׁפָּט
  choice: kifuko cha kifuani cha hukumu
  alternative: kifuko cha kifuani kwa ajili ya hukumu; kifuko cha kifuani cha uamuzi
  rationale: Muundo huu huhifadhi uhusiano wake na hukumu au uamuzi wa kikuhani bila kuamua hapa utaratibu mahususi wa matumizi yake, ambao aya yenyewe hauelezi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Agizo la umoja limetolewa kwa ‘u-’. Istilahi ya kikuhani ‘efodi’ imehifadhiwa, na sintaksia imefanywa ya kawaida bila kufuta marudio ya Kiebrania.
