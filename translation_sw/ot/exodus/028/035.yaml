base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/035.yaml
  text: It shall be on Aaron when he ministers[a], and its sound shall be heard when he goes into the Holy Place before Yahweh and when he comes out[c][b], so that he may not die.
translation:
  language: sw
  text: Haruni atalivaa anapohudumu, na mlio wake[a] utasikika anapoingia mahali patakatifu[b] mbele za Yahweh na anapotoka, ili asife.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mlio wa vazi lenye njuga zilizotajwa katika mistari iliyotangulia; kwa neno kwa neno, “sauti yake.”
    reason: lexical_alternative
  - marker: b
    text: Au “patakatifu”; katika muktadha huu ni eneo takatifu la maskani.
    reason: lexical_alternative
  - marker: c
    text: Au “asije akafa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה עַל אַהֲרֹן
  choice: Haruni atalivaa
  rationale: Kauli hii ya maagizo inaonyesha kwamba vazi lililotajwa kabla linapaswa kuwa juu ya Haruni. Kiswahili cha ‘Haruni atalivaa’ ni cha kawaida na kinaweka wazi maana ya kuvaa bila kubadili rejeo la muktadha.
- source_word: לְשָׁרֵת
  choice: anapohudumu
  rationale: Kitenzi-jina chenye לְ kinaweza kuonyesha kusudi au hali inayoambatana; hapa usemi wa wakati unafaa kwa huduma ya kikuhani.
- source_word: וְנִשְׁמַע קוֹלוֹ
  choice: na mlio wake utasikika
  rationale: קוֹל inaweza kumaanisha sauti au mlio. Kwa kuwa mistari iliyotangulia inataja njuga za vazi, ‘mlio’ ni neno la asili zaidi; kiambishi ‘wake’ kinahifadhi namna ya rejeo la Kiebrania.
- source_word: בְּבֹאוֹ
  choice: anapoingia
  rationale: Muundo huu una maana ya wakati, ‘wakati wa kuingia kwake’; kitenzi ‘kuingia’ kinaeleza kwa kawaida mwendo unaofuatiwa na אֶל.
- source_word: אֶל הַקֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Nomino yenye kibainishi inarejelea eneo takatifu la maskani. Tafsiri hii inadumisha usemi wa Kiebrania bila kuamua kwa nguvu zaidi upeo wa eneo hilo.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Ni usemi wa kawaida unaomaanisha kuwa katika uwepo wa Mungu; jina la agano limetolewa kama ‘Yahweh’.
- source_word: וּבְצֵאתוֹ
  choice: na anapotoka
  rationale: Muundo wa wakati unalingana na ‘anapoingia’ na unaonyesha kutoka katika mahali patakatifu.
- source_word: וְלֹא יָמוּת
  choice: ili asife
  rationale: Katika agizo hili la ibada, kishazi kinaonyesha matokeo yanayokusudiwa au kinga. ‘Ili asife’ ni Kiswahili cha sasa na pia kinahifadhi uwezekano wa maana ya ‘asije akafa.’
theological_decisions:
- issue: Rejeo la sauti inayosikika
  choice: Mlio unaeleweka kuwa wa vazi lenye njuga lililotajwa katika muktadha.
  alternative: Sauti hiyo inaweza kueleweka kwa jumla kuwa ya Haruni au ya mwendo wake.
  rationale: Mistari ya 33–34 inataja njuga katika upindo wa vazi, hivyo hizo ndizo chanzo cha mlio kinachoeleweka kwa urahisi zaidi; hata hivyo, kiambishi cha Kiebrania chenyewe hakizitaji tena njuga moja kwa moja.
- issue: Utoaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: ‘Yahweh’ linawakilisha jina binafsi la Mungu katika maandishi badala ya kulibadili kuwa cheo.
- issue: Uhusiano wa kishazi cha mwisho na agizo
  choice: ili asife
  alternative: asije akafa
  rationale: Muundo unaweza kusomwa kama matokeo yaliyokusudiwa au onyo la hatari. Tafsiri kuu inaonyesha kusudi bila kuficha onyo, na mbadala umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. ‘Haruni atalivaa’ ni ya asili kuliko tafsiri ngumu ya neno kwa neno ‘litakuwa juu ya Haruni.’ ‘Mlio’ linafaa kwa njuga, huku tanbihi ikihifadhi ‘sauti’ kama utoaji rasmi zaidi. Jina ‘Yahweh’ limehifadhiwa.
