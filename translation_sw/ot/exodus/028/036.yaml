  yaml_path: translation/ot/exodus/028/036.yaml
  text: 'And you shall make a plate of pure gold[a], and engrave on it, like the engravings of a seal: ‘Holy to Yahweh.’'
translation:
  language: sw
  text: 'Na utatengeneza bamba la dhahabu safi, na uchonge juu yake, kama uchongaji wa muhuri: “Takatifu kwa Yahweh.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Utakatifu kwa Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utatengeneza
  rationale: Kitenzi hiki kinaendeleza mfululizo wa maagizo; wakati ujao katika Kiswahili una nguvu ya agizo katika muktadha huu.
- source_word: צִּיץ
  choice: bamba
  rationale: Katika muktadha huu neno linamaanisha pambo la dhahabu lililovaliwa kwenye kilemba cha kuhani mkuu; “bamba” ni wazi na la kawaida kuliko tafsiri za kiumbo kama “ua” au neno la kiufundi lisiloeleweka kwa urahisi.
- source_word: זָהָב טָהוֹר
  choice: la dhahabu safi
  rationale: Hueleza nyenzo na ubora wa bamba kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: וּפִתַּחְתָּ עָלָיו
  choice: na kuchora juu yake
  rationale: Katika kazi ya chuma, פתח hapa ni kuchora/kuchonga maandishi. “Kuchora” linaeleweka kwa maana ya kuchora kwa kukata kwenye uso, huku kifungu kinachofuata kikifafanua mtindo wa muhuri.
- source_word: פִּתּוּחֵי חֹתָם
  choice: kwa mtindo wa mchoro wa muhuri
  rationale: Hueleza kwamba maandishi yachorwe kama mchoro unaokatwa kwenye muhuri, bila kulazimisha wingi wa kimofolojia wa Kiebrania kuwa michoro kadhaa tofauti.
- source_word: קֹדֶשׁ לַיהוָה
  choice: Takatifu kwa Yahweh
  rationale: Huhifadhi ufupi wa maandishi ya kuwekwa kwenye bamba na maana ya kitu kilichowekwa wakfu kwa Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana Tetragramatoni yenyewe; “Yahweh” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya maandishi קֹדֶשׁ לַיהוָה
  choice: Takatifu kwa Yahweh
  alternative: Utakatifu ni wa Yahweh
  rationale: קֹדֶשׁ inaweza kuwasilishwa kwa nguvu ya kivumishi au nomino. Tafsiri kuu huhifadhi fomula fupi ya kuwekwa wakfu, huku tafsiri mbadala ikiwekwa katika tanbihi ili kutunza utata halisi wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa agizo la ibada lakini unabaki wazi kwa msomaji wa kawaida; maandishi mafupi kwenye bamba yamehifadhiwa kwa mtindo wa kimaandishi.
