base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/001.yaml
  text: 'And you[a], bring near to yourself Aaron your brother, and his sons with him, from among the sons of Israel, to serve as priests for me: Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron’s sons.'
translation:
  language: sw
  text: 'Nawe, mlete karibu nawe Aroni, ndugu yako, na wanawe pamoja naye, kutoka miongoni mwa wana wa Israeli, ili wanihudumie kama makuhani: Aroni, Nadabu na Abihu, Eleazari na Ithamari, wana wa Aroni.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתָּה
  choice: Nawe
  rationale: Kiwakilishi cha Kiebrania kina msisitizo na kinaashiria badiliko la maelekezo; “Nawe” ni usemi wa asili wa Kiswahili unaohifadhi msisitizo huo.
- source_word: הַקְרֵב אֵלֶיךָ
  choice: mlete karibu nawe
  rationale: Huhifadhi maana halisi ya kumleta mtu karibu kuelekea kwa Musa, bila kuifanya tayari kuwa lugha kamili ya kuwekwa wakfu.
- source_word: אַהֲרֹן אָחִיךָ
  choice: Aroni ndugu yako
  rationale: Huhifadhi wazi uhusiano wa kifamilia unaotajwa katika chanzo.
- source_word: וְאֶת־בָּנָיו אִתּוֹ
  choice: pamoja naye wanawe
  rationale: Huhifadhi wazo la wana wa Aroni kuletwa pamoja naye, huku mpangilio ukibaki wa kawaida na wenye hadhi katika Kiswahili.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: kutoka miongoni mwa wana wa Israeli
  rationale: Huhifadhi nahau ya agano “wana wa Israeli” na pia maana ya kuchaguliwa kutoka katikati ya jamii hiyo.
- source_word: לְכַהֲנוֹ־לִי
  choice: ili wanitumikie kama makuhani
  rationale: Kitenzi kinamaanisha kutenda huduma ya ukuhani; tafsiri hii ni wazi katika Kiswahili na inahifadhi kwamba huduma hiyo ni kwa Mungu.
- source_word: בְּנֵי אַהֲרֹן
  choice: wana wa Aroni
  rationale: Muundo huu wa kawaida wa Kiswahili huhifadhi taarifa ya ukoo inayowatambulisha wanaume waliotajwa.
theological_decisions:
- issue: Jina la kijamii בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Chanzo kinatumia kwa wazi usemi wa agano “wana wa Israeli.” Tafsiri kuu inahifadhi umbo hilo badala ya kulibadili kimya kimya kuwa jina la kijamii la jumla; katika Kiswahili usemi huo pia unaeleweka kiasili.
- issue: Nguvu ya לְכַהֲנוֹ־לִי
  choice: ili wanitumikie kama makuhani
  alternative: ili wawe makuhani wangu
  rationale: Muundo wa kitenzi unaelekeza kwenye kutekeleza huduma ya ukuhani kwa Mungu, si tu kuwa na cheo; chaguo hili linahifadhi kazi na uelekeo wa huduma bila kuongeza maelezo ya kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umewekwa karibu na Kiebrania inapowezekana, lakini umetiririshwa kwa Kiswahili cha kawaida. Hakuna tanbihi iliyohitajika kwa kuwa “wana wa Israeli” ni usemi unaoeleweka na pia huhifadhi kwa usahihi umbo la chanzo.
