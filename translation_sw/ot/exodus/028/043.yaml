  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיוּ֩ עַל אַהֲרֹ֨ן וְ/עַל בָּנָ֜י/ו בְּ/בֹאָ֣/ם אֶל אֹ֣הֶל מוֹעֵ֗ד א֣וֹ בְ/גִשְׁתָּ֤/ם אֶל הַ/מִּזְבֵּ֨חַ֙ לְ/שָׁרֵ֣ת בַּ/קֹּ֔דֶשׁ וְ/לֹא יִשְׂא֥וּ עָוֺ֖ן וָ/מֵ֑תוּ חֻקַּ֥ת עוֹלָ֛ם ל֖/וֹ וּ/לְ/זַרְע֥/וֹ אַחֲרָֽי/ו־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/043.yaml
  text: And they shall be on Aaron and on his sons when they enter the tent of meeting[a], or when they approach the altar to minister in the holy place, so that they may not bear guilt and die[b]. It shall be a permanent statute for him and for his offspring after him.
translation:
  language: sw
  text: Haruni na wanawe watazivaa wanapoingia katika hema la kukutania, au wanapoukaribia madhabahu ili kuhudumu mahali patakatifu, wasije wakabeba hatia[a] na kufa. Hili litakuwa agizo la kudumu[b] kwake na kwa wazao wake baada yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakajipatia hatia.” Kiebrania kinasema kihalisi “wakabeba hatia,” nahau ya kisheria na kiibada.
    reason: lexical_alternative
  - marker: b
    text: Au, “agizo la milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ עַל אַהֲרֹן וְעַל בָּנָיו
  choice: Haruni na wanawe watazivaa
  rationale: Ingawa Kiebrania husema kihalisi kwamba nguo hizo ‘zitakuwa juu ya’ Haruni na wanawe, Kiswahili cha kawaida hueleza hali hiyo kwa kitenzi ‘kuvaa.’ Kiambishi -zi- kinarejelea nguo zilizotajwa katika muktadha.
- source_word: בְּבֹאָם
  choice: wanapoingia
  rationale: Muundo wa Kiebrania unaonyesha wakati; ‘wanapoingia’ ni wa asili na sahihi katika Kiswahili.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hili ni neno linaloeleweka na lililozoeleka kwa hema lililotengwa kwa kukutana mbele za Mungu.
- source_word: בְגִשְׁתָּם אֶל הַמִּזְבֵּחַ
  choice: wanapoukaribia madhabahu
  rationale: Kitenzi נגשׁ katika mazingira ya kikuhani humaanisha kusogea karibu kwa ajili ya huduma takatifu; ‘kuikaribia madhabahu’ huhifadhi maana hiyo.
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: ili kuhudumu mahali patakatifu
  rationale: ‘Kuhudumu’ huonyesha utumishi wa kikuhani, na ‘mahali patakatifu’ huhifadhi wazi lugha ya utakatifu ya קֹדֶשׁ bila kuibana kuwa sehemu moja maalumu kuliko maandishi yanavyosema.
- source_word: וְלֹא יִשְׂאוּ עָוֹן
  choice: wasije wakabeba hatia
  rationale: ‘Kubeba hatia’ huhifadhi nahau ya kisheria na kiibada ya Kiebrania; ‘wasije’ huwasilisha kusudi la kuzuia matokeo hayo.
- source_word: וָמֵתוּ
  choice: na kufa
  rationale: Huhifadhi matokeo mazito na ya moja kwa moja yanayotajwa katika Kiebrania bila kuyapunguza.
- source_word: חֻקַּת עוֹלָם
  choice: agizo la kudumu
  rationale: ‘Agizo’ linafaa kwa sharti rasmi la ibada, na ‘la kudumu’ huwasilisha nguvu ya muda mrefu ya עוֹלָם katika muktadha wa sheria.
- source_word: זַרְעוֹ
  choice: wazao wake
  rationale: ‘Wazao’ ni Kiswahili cha sasa na cha kawaida kinachowasilisha maana ya pamoja ya ‘uzao’ wa Kiebrania.
theological_decisions:
- issue: Hatia na adhabu ya kifo kwa kuhudumu bila mavazi yaliyoagizwa
  choice: wasije wakabeba hatia na kufa
  alternative: wasije wakajipatia hatia na kufa
  rationale: 'Tafsiri inahifadhi nahau ya Kiebrania na mvutano wake wa kitheolojia: ukiukaji wa utakatifu huleta hatia halisi pamoja na kifo, si kasoro ndogo tu ya taratibu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Watazivaa’ limetumiwa badala ya tafsiri ngumu ya kihalisi ‘zitakuwa juu yao,’ huku istilahi za mazingira ya kikuhani—hema la kukutania, madhabahu, kuhudumu, na mahali patakatifu—zikihifadhiwa.
