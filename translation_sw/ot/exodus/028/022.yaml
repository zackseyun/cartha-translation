  text: And you shall make on the breastpiece chains of pure gold[a], braided work like cords.
translation:
  language: sw
  text: Nawe utatengeneza kwenye kifuko cha kifuani minyororo ya dhahabu safi, iliyofumwa kama kamba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “minyororo iliyopindishwa” au “minyororo ya kamba”; Kiebrania hueleza minyororo iliyotengenezwa kwa mtindo wa kufumwa au wa mfano wa kamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Nawe utatengeneza
  rationale: Kitenzi cha Qal chenye kiunganishi katika mfululizo wa maagizo kina nguvu ya amri; wakati ujao wa Kiswahili hapa unawasilisha agizo kwa lugha ya heshima na ya kawaida.
- source_word: עַל הַחֹשֶׁן
  choice: juu ya kifuko cha kifuani
  rationale: עַל kwa kawaida ni ‘juu ya’; katika maagizo haya inaonyesha mahali mikufu inapowekwa au kuunganishwa. ‘Kifuko cha kifuani’ kinaeleza kwa uwazi vazi hili la kuhani.
- source_word: שַׁרְשֹׁת
  choice: mikufu
  rationale: Nomino hii inamaanisha minyororo midogo au mikufu ya viungo; ‘mikufu’ inafaa zaidi kwa vitu vya dhahabu vinavyounganishwa na kifuko cha kifuani.
- source_word: גַּבְלֻת
  choice: iliyosokotwa
  rationale: Neno hili linaonyesha umbo lililofungwa, lililopindishwa, au lililosukwa; ‘iliyosokotwa’ ni ya kawaida na linaendana na taswira ya kamba inayofuata.
- source_word: מַעֲשֵׂה עֲבֹת
  choice: kama kamba
  rationale: Kirai hiki kinaeleza kazi yenye sura ya kamba iliyosokotwa. ‘Kama kamba’ huhifadhi taswira bila kuingiza istilahi ya kiufundi isiyo ya lazima.
- source_word: זָהָב טָהוֹר
  choice: dhahabu safi
  rationale: Hili ndilo tamko la kawaida na la moja kwa moja la nyenzo hiyo katika Kiswahili.
