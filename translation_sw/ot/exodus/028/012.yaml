language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֞ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֗ים עַ֚ל כִּתְפֹ֣ת הָֽ/אֵפֹ֔ד אַבְנֵ֥י זִכָּרֹ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נָשָׂא֩ אַהֲרֹ֨ן אֶת שְׁמוֹתָ֜/ם לִ/פְנֵ֧י יְהוָ֛ה עַל שְׁתֵּ֥י כְתֵפָ֖י/ו לְ/זִכָּרֹֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/012.yaml
  text: And you shall set the two stones on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], and Aaron shall bear their names before Yahweh on his two shoulders for remembrance.
translation:
  language: sw
  text: Nawe uyaweke mawe hayo mawili juu ya sehemu za mabega za efodi, kama mawe ya ukumbusho kwa ajili ya wana wa Israeli[a]. Naye Haruni atayabeba majina yao mbele ya Yahweh, juu ya mabega yake mawili, kwa ukumbusho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “wana wa Israeli,” ni msemo wa kifamilia ambao mara nyingi humaanisha watu wote wa Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Nawe utayaweka
  rationale: Kitenzi שׂים humaanisha kuweka; muundo wa wakati ujao katika Kiswahili unafaa kama agizo la moja kwa moja kwa mtu mmoja katika muktadha huu.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: hayo mawe mawili
  rationale: Kiwakilishi 'hayo' kinaonyesha kuwa ni yale mawe mawili yaliyotajwa katika muktadha uliotangulia, bila kuingiza aina ya jiwe ambayo haikutajwa tena katika mstari huu.
- source_word: כִּתְפֹת הָאֵפֹד
  choice: vipande vya mabega vya efodi
  rationale: Katika muktadha wa vazi, כָּתֵף hapa hurejelea sehemu za efodi zinazokaa mabegani, si mabega ya mwili yenyewe.
- source_word: אַבְנֵי זִכָּרֹן
  choice: mawe ya ukumbusho
  rationale: Tafsiri hii ya kawaida na ya heshima huhifadhi maana ya muundo wa Kiebrania, yaani mawe yenye kusudi la kukumbusha au kuwa kumbukumbu.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kwa ajili ya wana wa Israeli
  rationale: '''Wana wa Israeli'' huhifadhi lugha ya kifamilia ya בְּנֵי יִשְׂרָאֵל; tanbihi inaeleza kuwa msemo huo unaweza kuwahusu watu wa Israeli kwa ujumla.'
- source_word: וְנָשָׂא ... אֶת שְׁמוֹתָם
  choice: Naye Haruni atayachukua majina yao
  rationale: נשׂא inaweza kumaanisha kuchukua, kubeba, au kubandikwa; 'atayachukua' ni ya asili kwa Kiswahili na hudumisha picha ya Haruni kuyapeleka majina hayo mbele za Mungu.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Huhifadhi maana ya kuwa katika uwepo wa Mungu na kuitaja tetragramatoni kwa jina 'Yahweh'.
- source_word: עַל שְׁתֵּי כְתֵפָיו
  choice: juu ya mabega yake mawili
  rationale: Hapa neno linarejelea mabega halisi ya Haruni; tafsiri huhifadhi tofauti na vipande vya mabega vya efodi katika kishazi cha kwanza.
- source_word: לְזִכָּרֹן
  choice: kuwa ukumbusho
  rationale: Huhifadhi uhusiano wa kileksia na אַבְנֵי זִכָּרֹן na pia utata wa nani anayekumbuka, bila kulifafanua kupita maandishi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana tetragramatoni moja kwa moja; 'Yahweh' huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kifamilia ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: watu wa Israeli; Waisraeli
  rationale: Tafsiri kuu huhifadhi taswira ya uzao na familia iliyomo katika Kiebrania, huku tanbihi ikieleza matumizi yake ya pamoja kwa taifa lote.
- issue: Mhusika wa kukumbuka katika לְזִכָּרֹן
  choice: kuwa ukumbusho
  alternative: ili Yahweh awakumbuke; ili Israeli wakumbuke
  rationale: Kiebrania hakimtaji wazi anayekumbuka; tafsiri haitatui kimyakimya utata huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Istilahi 'efodi' imehifadhiwa kama jina la vazi maalumu la kikuhani. Muundo wa sentensi huhifadhi marudio ya 'ukumbusho' na tofauti kati ya vipande vya mabega vya efodi na mabega ya Haruni.
