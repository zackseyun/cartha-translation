  text: six of their names on the one stone[a], and the names of the remaining six on the second stone, according to their birth order.
translation:
  language: sw
  text: majina yao sita juu ya jiwe lile moja, na majina ya wale sita waliobaki juu ya jiwe la pili, kwa kufuata mpangilio wa kuzaliwa kwao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na nasaba au vizazi vyao.” Usemi wa Kiebrania unaweza kurejelea nasaba au mpangilio unaotokana nayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁשָּׁה מִשְּׁמֹתָם
  choice: majina yao sita
  rationale: Muundo huu unaonyesha kwa njia ya kawaida ya Kiswahili kwamba majina sita yalichaguliwa kutoka katika jumla ya majina yaliyotajwa.
- source_word: עַל הָאֶבֶן הָאֶחָת
  choice: juu ya jiwe moja
  rationale: Neno עַל lina maana ya mahali, ‘juu ya,’ na הָאֶחָת hapa linatofautisha jiwe moja na jiwe la pili bila kulazimisha tafsiri ya ‘la kwanza.’
- source_word: הַשִּׁשָּׁה הַנּוֹתָרִים
  choice: wale sita waliobaki
  rationale: Hii ni tafsiri ya asili na iliyo wazi ya watu sita waliosalia baada ya majina sita ya kwanza kutajwa.
- source_word: עַל הָאֶבֶן הַשֵּׁנִית
  choice: juu ya jiwe la pili
  rationale: Inahifadhi maana ya moja kwa moja ya jiwe la pili na mahali majina yalipoandikwa.
- source_word: כְּתוֹלְדֹתָם
  choice: kwa kufuata mpangilio wa kuzaliwa kwao
  rationale: Katika muktadha wa majina ya wana wa Israeli, usemi huu kwa kawaida unaonyesha mpangilio wao wa kuzaliwa, huku tanbihi ikihifadhi uwezekano mpana wa maana ya vizazi au nasaba.
