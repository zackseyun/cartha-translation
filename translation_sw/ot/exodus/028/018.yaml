translation:
  language: sw
  text: 'na safu ya pili: feruzi[a], yakuti samawi, na almasi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho kamili wa baadhi ya mawe ya thamani ya kale hauna uhakika. נֹפֶךְ huenda ikawa zumaridi au akiki nyekundu; סַפִּיר huenda ikamaanisha lapis lazuli; na יָהֲלֹם huenda ikawa yasinto au yaspi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: na safu
  rationale: Katika muktadha wa mawe ya kifuko cha kifuani, טוּר ni safu ya mawe; kiunganishi וְ kimetafsiriwa kuwa “na” ili kudumisha muendelezo wa orodha.
- source_word: הַ/שֵּׁנִי
  choice: ya pili
  rationale: Ni namba ya mpangilio inayovumisha “safu”; “ya pili” ni Kiswahili cha kawaida na wazi.
- source_word: נֹפֶךְ
  choice: feruzi
  rationale: Utambulisho kamili wa jiwe hili la kale hauna uhakika. “Feruzi” ni jina linalowezekana na linaloeleweka, huku mbadala muhimu zikihifadhiwa katika tanbihi.
- source_word: סַפִּיר
  choice: yakuti samawi
  rationale: Hili ndilo jina la kawaida la sapphire katika Kiswahili sanifu; hata hivyo, neno la Kiebrania huenda lilimaanisha lapis lazuli, jambo lililoelezwa katika tanbihi.
- source_word: וְ/יָהֲלֹם
  choice: na almasi
  rationale: “Almasi” ni tafsiri ya kimapokeo na inayotambulika kwa urahisi, ingawa utambulisho wa jiwe la kale unabishaniwa; uwezekano mwingine umetajwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, rahisi na yenye hadhi. Muundo mfupi wa orodha ya Kiebrania umehifadhiwa, na kutokuwa na uhakika kuhusu majina ya mawe kumewekwa wazi katika tanbihi.
