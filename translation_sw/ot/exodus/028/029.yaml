id: EXO.28.29
reference: Exodus 28:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת שְׁמ֨וֹת בְּנֵֽי יִשְׂרָאֵ֜ל בְּ/חֹ֧שֶׁן הַ/מִּשְׁפָּ֛ט עַל לִבּ֖/וֹ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ לְ/זִכָּרֹ֥ן לִ/פְנֵֽי יְהוָ֖ה תָּמִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/029.yaml
  text: Aaron shall carry the names of the sons of Israel in the breastpiece of judgment over his heart when he goes into the Holy Place[d][c][b][a], for a memorial before Yahweh continually.
translation:
  language: sw
  text: Naye Aroni atayabeba[a] majina ya wana wa Israeli[c] katika kifuko cha kifuani cha hukumu[b], juu ya moyo wake, anapoingia Mahali Patakatifu, kuwa ukumbusho[d] mbele za Yahwe daima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atayachukua.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kifuko cha kifuani cha uamuzi.” Jina la Kiebrania linaweza kuhusishwa na hukumu au uamuzi unaotolewa mbele za Mungu.
    reason: alternative_reading
  - marker: c
    text: Kiebrania, “wana wa Israeli”; huu ni usemi wa ukoo unaorejelea makabila yaliyotokana na Israeli.
    reason: lexical_alternative
  - marker: d
    text: Au, “ili yakumbukwe mbele za Yahwe.” Kiebrania hakitaji wazi ni nani anayekumbuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: Naye ... atayabeba
  rationale: Kitenzi נשׂא humaanisha kubeba au kuchukua kitu juu ya mtu. “Atayabeba” ni Kiswahili cha kawaida kinachohifadhi picha halisi ya Aroni kuyavaa majina hayo juu ya moyo wake.
- source_word: שְׁמוֹת
  choice: majina
  rationale: Hili ni tafsiri ya moja kwa moja ya nomino ya wingi; kinachorejelewa ni majina yaliyochorwa, si makabila kwa ujumla tu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Kirai hiki cha ukoo kinahifadhi uhusiano wa wazao na Israeli na kinaeleweka kwa kawaida katika Kiswahili cha kibiblia.
- source_word: בְּחֹשֶׁן הַמִּשְׁפָּט
  choice: katika kifuko cha kifuani cha hukumu
  rationale: “Kifuko cha kifuani” hutaja vazi maalumu la kuhani, huku “cha hukumu” kikihifadhi upana wa מִשְׁפָּט bila kuamua kimya kimya ikiwa maana yake hapa ni hukumu, uamuzi, au haki.
- source_word: עַל לִבּוֹ
  choice: juu ya moyo wake
  rationale: Tafsiri hii huhifadhi mahali pa kifuko hicho kifuani na pia picha yake ya kiwakilishi mbele za Mungu.
- source_word: בְּבֹאוֹ אֶל הַקֹּדֶשׁ
  choice: anapoingia Mahali Patakatifu
  rationale: Muundo wa Kiebrania unaonyesha wakati wa tendo, “anapoingia.” Katika muktadha wa hema, הַקֹּדֶשׁ ni eneo takatifu la ibada.
- source_word: לְזִכָּרוֹן
  choice: kuwa ukumbusho
  rationale: Kirai hiki huhifadhi kusudi la majina hayo kama ukumbusho bila kutaja wazi ni nani anayekumbuka, jambo ambalo Kiebrania halisemi moja kwa moja.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Hii ni nahau ya kawaida yenye maana ya kuwa mbele au katika uwepo wa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetolewa kama jina maalumu badala ya kubadilishwa kuwa cheo.
- source_word: תָּמִיד
  choice: daima
  rationale: “Daima” huwasilisha mwendelezo wa wajibu huu wa kikuhani katika utaratibu wa ibada.
theological_decisions:
- issue: Maana ya jina la kifuko חֹשֶׁן הַמִּשְׁפָּט
  choice: kifuko cha kifuani cha hukumu
  alternative: kifuko cha kifuani cha uamuzi
  rationale: “Cha hukumu” kinabaki karibu na maana pana ya מִשְׁפָּט na hakibani kazi ya kifuko hicho kuwa kutoa uamuzi pekee.
- issue: Upeo wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Tafsiri iliyochaguliwa huhifadhi usemi wa ukoo wa Kiebrania; katika muktadha huu majina yanawakilisha makabila yaliyotokana na Israeli.
- issue: Rejeo la הַקֹּדֶשׁ
  choice: Mahali Patakatifu
  alternative: patakatifu
  rationale: Katika muktadha wa hema la kukutania, usemi huu unarejelea eneo maalumu la ibada, lakini haujapanuliwa kuwa “Patakatifu Zaidi” kwa sababu mstari wenyewe hausemi hivyo.
- issue: Ni nani anayekumbuka katika לְזִכָּרוֹן
  choice: kuwa ukumbusho mbele za Yahwe
  alternative: ili yakumbukwe mbele za Yahwe
  rationale: Nomino ya Kiebrania haitaji wazi mtendaji wa kukumbuka. Tafsiri kuu huhifadhi hali hiyo badala ya kuamua kama ukumbusho huo ni kwa Mungu, kwa kuhani, au una kazi pana ya kiibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaosomeka kwa urahisi. Istilahi “kifuko cha kifuani” inaeleza vazi la kikuhani kwa uwazi; “Mahali Patakatifu” imetumiwa kama jina la eneo la ibada. Mpangilio wa maneno umewekwa wa kawaida katika Kiswahili huku picha ya majina kuwa juu ya moyo wa Aroni ikihifadhiwa.
