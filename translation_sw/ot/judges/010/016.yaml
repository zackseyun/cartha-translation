  text: וַ/יָּסִ֜ירוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ מִ/קִּרְבָּ֔/ם וַ/יַּעַבְד֖וּ אֶת יְהוָ֑ה וַ/תִּקְצַ֥ר נַפְשׁ֖/וֹ בַּ/עֲמַ֥ל יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/016.yaml
  text: So they removed the foreign gods from among them and served Yahweh[a], and he became impatient over the misery of Israel.
translation:
  language: sw
  text: Basi wakaondoa miungu ya kigeni kutoka miongoni mwao, wakamtumikia Yahwe, naye hakuweza tena kuvumilia[a] taabu ya Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye akakosa subira kwa sababu ya taabu ya Israeli.” Kiebrania kinasema kihalisi, “nafsi yake ikawa fupi kwa sababu ya taabu ya Israeli,” nahau inayoweza kumaanisha kukosa subira au kutoweza kuvumilia zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: wakaondoa
  rationale: Hifili ya סור ina maana ya kusababisha kitu kiondoke; “wakaondoa” ni Kiswahili cha kawaida kinachoonyesha kuachana kabisa na miungu hiyo.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: miungu ya kigeni
  rationale: Kirai hiki kinarejelea miungu isiyo ya Israeli; “miungu ya kigeni” ni wazi na cha asili katika Kiswahili cha sasa.
- source_word: מִקִּרְבָּם
  choice: iliyokuwa miongoni mwao
  rationale: Kiebrania ni “kutoka katikati yao.” Muundo huu wa Kiswahili huhifadhi wazo la kuiondoa miungu katika jumuiya yao bila kuwa mgumu.
- source_word: וַיַּעַבְדוּ אֶת יְהוָה
  choice: wakamtumikia Yahwe
  rationale: עבד inaweza kumaanisha kuabudu au kutumikia. “Kumtumikia” huhifadhi maana pana ya utii na uaminifu kwa agano.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kulibadilisha kuwa cheo.
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: naye hakuweza tena kuvumilia
  rationale: Nahau hii, kihalisi “nafsi yake ikawa fupi,” huonyesha kwamba uvumilivu ulifikia kikomo au kwamba hakuweza kuendelea kustahimili. Tafsiri hii ni ya asili kwa Kiswahili huku tanbihi ikihifadhi taswira halisi na maana nyingine inayowezekana.
- source_word: בַּעֲמַל יִשְׂרָאֵל
  choice: taabu ya Israeli
  rationale: עָמָל hapa ni dhiki, mateso, au taabu; “taabu” ni pana, wazi, na inafaa katika muktadha wa mateso ya Israeli.
theological_decisions:
- issue: Maelezo ya Yahwe kwa lugha ya hisia za kibinadamu katika וַתִּקְצַר נַפְשׁוֹ
  choice: naye hakuweza tena kuvumilia taabu ya Israeli
  alternative: naye akakosa subira kwa sababu ya taabu ya Israeli
  rationale: Kiebrania kina nahau yenye nguvu inayoweza kuonyesha ama kukosa subira ama kutoweza kuvumilia zaidi. Matini kuu inatumia Kiswahili cha asili kinachoonyesha mwisho wa kustahimili, na tanbihi inahifadhi maana mbadala bila kuamua mjadala wa kitheolojia kuhusu namna ya kuelewa hisia za Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida; “Yahwe” huhifadhi jina la Mungu, na tanbihi huhifadhi utata wa nahau ya Kiebrania.
