base_translation:
  language: en
  yaml_path: translation/ot/judges/010/015.yaml
  text: And the sons of Israel said to Yahweh[a], “We have sinned. Do to us according to all that is good in your eyes[c][b]. Only please deliver us this day.”
translation:
  language: sw
  text: Nao wana wa Israeli[a] wakamwambia Yahwe, “Tumetenda dhambi. Ututendee kadiri ya yote yaliyo mema machoni pako.[b] Lakini, tafadhali utuokoe[c] leo hii.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kadiri ya yote yaliyo mema machoni pako”; yaani, chochote unachoona kuwa chema.
    reason: lexical_alternative
  - marker: c
    text: Au “utunusuru” au “utuokoe kutoka hatarini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Nao ... wakamwambia
  rationale: Wayyiqtol inaendeleza simulizi; “Nao ... wakamwambia” ni mtiririko wa kawaida wa simulizi la Kiswahili na pia huonyesha kwamba maneno yanaelekezwa kwa Yahwe.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hifadhi nahau ya Kiebrania na umbo lake la kiume kwa Kiswahili cha kawaida; “Waisraeli” ni mbadala wa asili zaidi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika tetragramatoni limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: חָטָאנוּ
  choice: Tumetenda dhambi
  rationale: Qatal ya wingi nafsi ya kwanza ni ungamo la tendo lililotimizwa; kauli hii ni ya kawaida na yenye uzito katika Kiswahili.
- source_word: עֲשֵׂה אַתָּה לָנוּ
  choice: Ututendee
  rationale: Kitenzi עשה pamoja na ל kina maana ya kumtendea mtu; umbo hili linawasilisha kujisalimisha kwao chini ya uamuzi wa Mungu.
- source_word: כְּכָל הַטּוֹב בְּעֵינֶיךָ
  choice: lolote lililo jema machoni pako
  rationale: Hifadhi picha ya Kiebrania ya jambo kuwa jema “machoni” pa mtu huku sentensi ikibaki ya asili katika Kiswahili.
- source_word: אַךְ
  choice: Ila
  rationale: Hapa neno linaanzisha ombi la pekee baada ya wao kukubali uamuzi wa Mungu; “Ila” linaonyesha kizuizi hicho bila kuondoa mvutano wa kauli.
- source_word: הַצִּילֵנוּ
  choice: utuokoe
  rationale: Hiphil ya נצל humaanisha kuokoa au kukomboa kutoka hatarini; “utuokoe” ni ya kawaida na inafaa muktadha wa tishio.
- source_word: נָא
  choice: tafadhali
  rationale: Chembe hii hulainisha amri na kuifanya ombi la kusihi; “tafadhali” ndiyo sawa ya kawaida ya Kiswahili.
- source_word: הַיּוֹם הַזֶּה
  choice: leo hii
  rationale: Hifadhi msisitizo na uharaka wa kifungu cha Kiebrania kuliko “leo” peke yake.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la agano, si cheo; “Yahwe” hulihifadhi wazi.
- issue: Uwasilishaji wa בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Chaguo kuu huhifadhi umbo mahususi la nahau ya chanzo, huku tanbihi ikitoa sawa yake ya kijamii isiyo ya nahau.
- issue: Kiwango cha kujisalimisha katika כְּכָל הַטּוֹב בְּעֵינֶיךָ
  choice: lolote lililo jema machoni pako
  alternative: chochote unachoona kuwa chema
  rationale: Kauli iliyochaguliwa huhifadhi picha ya macho na kutomwekea Mungu mipaka, bila kufafanua mapema aina ya adhabu au rehema anayoweza kuamua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa simulizi “Nao ... wakamwambia,” picha ya “machoni pako,” na msisitizo wa “leo hii” huhifadhi ladha ya chanzo bila kufanya sentensi iwe ngumu kwa msomaji wa kawaida.
