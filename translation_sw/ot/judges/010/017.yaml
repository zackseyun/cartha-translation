base_translation:
  language: en
  yaml_path: translation/ot/judges/010/017.yaml
  text: Then the Ammonites were summoned and camped in Gilead[a], and the sons of Israel gathered together and camped at Mizpah.
translation:
  language: sw
  text: Ndipo Waamoni wakaitwa pamoja, wakapiga kambi huko Gileadi[a]. Wanaisraeli nao wakakusanyika na kupiga kambi huko Mispa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ndipo Waamoni wakapaza sauti na kupiga kambi huko Gileadi.” Kitenzi cha Kiebrania kinaweza kumaanisha “kulia” au “kupaza sauti,” ingawa katika muktadha huu huenda kinarejelea kuitwa pamoja kwa ajili ya vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֲקוּ
  choice: wakaitwa wakusanyike
  rationale: Kitenzi צעק kwa kawaida humaanisha ‘kulia/kupaza sauti,’ lakini katika muktadha huu wa kijeshi, unaofuatwa mara moja na kupiga kambi, huenda kinamaanisha kuitwa au kukusanywa kwa vita. Tafsiri hii inaonyesha maana hiyo bila kuficha uwezekano wa maana ya kawaida, ambao umewekwa katika tanbihi.
- source_word: בְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Ingawa muundo huu kwa neno halisi ni ‘wana wa Amoni,’ ‘Waamoni’ ni jina la kawaida na la wazi la kundi hili la watu katika Kiswahili.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה humaanisha kuweka au kupiga kambi; ‘kupiga kambi’ ni usemi wa kawaida wa Kiswahili na huhifadhi muktadha wa kijeshi.
- source_word: בַּגִּלְעָד
  choice: huko Gileadi
  rationale: Gileadi ni eneo; ‘huko Gileadi’ huwasilisha kwa kawaida kuwepo ndani ya eneo hilo.
- source_word: וַיֵּאָסְפוּ
  choice: wakakusanyika
  rationale: Kitenzi אסף hapa kinaonyesha kukusanyika kwa pamoja, hasa kwa maandalizi ya mapambano.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Wanaisraeli
  rationale: Muundo wa Kiebrania kwa neno halisi ni ‘wana wa Israeli,’ lakini hapa unataja taifa kwa ujumla. ‘Wanaisraeli’ ni tafsiri ya asili, wazi, na isiyodokeza kuwa wanaume pekee ndio waliokusudiwa.
- source_word: בַּמִּצְפָּה
  choice: huko Mispa
  rationale: Mispa ni mahali walipopiga kambi; ‘huko Mispa’ ni usemi wa kawaida wa Kiswahili kwa eneo hilo.
