  yaml_path: translation/ot/judges/010/003.yaml
  text: After him arose Jair the Gileadite[a], and he judged Israel twenty-two years.
translation:
  language: sw
  text: Baada yake akainuka[a] Yairi Mgileadi, naye akaihukumu Israeli kwa miaka ishirini na miwili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baada yake akaja.”
    reason: Njia nyingine ya kutafsiri fomula ya mfuatano וַיָּקָם אַחֲרָיו, ambayo inaweza kueleza kutokea kwa kiongozi aliyefuata badala ya tendo halisi la kuinuka.
lexical_decisions:
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Kitenzi קום katika fomula hii ya masimulizi kinaonyesha kutokea au kuanza kwa kiongozi aliyefuata. “Akainuka” huhifadhi taswira na mtindo wa Kiebrania bila kuufafanua kupita kiasi.
- source_word: אַחֲרָיו
  choice: Baada yake
  rationale: Kirai hiki kinamrejelea moja kwa moja mwamuzi aliyetangulia na kinaonyesha mfuatano wa viongozi.
- source_word: יָאִיר
  choice: Yairi
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: הַגִּלְעָדִי
  choice: Mgileadi
  rationale: Kivumishi hiki cha mahali kinamtambulisha Yairi kuwa mtu wa Gileadi au mwenye uhusiano na eneo hilo; “Mgileadi” huhifadhi umbo lake fupi.
- source_word: וַיִּשְׁפֹּט
  choice: akaihukumu
  rationale: Kitenzi שפט ni neno linalojirudia katika kitabu cha Waamuzi kwa kazi ya mwamuzi kama kiongozi. “Akaihukumu” huhifadhi istilahi hiyo na upana wake unaotokana na muktadha.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israeli
  rationale: Israeli hapa ni watu au taifa walioongozwa na Yairi; alama ya Kiebrania ya yambwa haina neno tofauti katika Kiswahili.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: kwa miaka ishirini na miwili
  rationale: Huu ni usemi wa kawaida wa Kiswahili kwa muda wa miaka ishirini na miwili.
