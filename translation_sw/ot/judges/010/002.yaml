  yaml_path: translation/ot/judges/010/002.yaml
  text: He judged Israel twenty-three years. Then he died and was buried in Shamir.
translation:
  language: sw
  text: Aliihukumu Israeli kwa miaka ishirini na mitatu. Kisha akafa, akazikwa huko Shamiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: Aliihukumu
  rationale: Kitenzi שׁפט katika kitabu cha Waamuzi humaanisha kutenda kazi ya mwamuzi na kiongozi wa Israeli. “Aliihukumu” kinahifadhi istilahi inayojirudia kitabuni bila kuongeza wazo la ukombozi lisilotajwa katika mstari huu.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa limetafsiriwa kwa umbo lake la kawaida katika Kiswahili; kiambishi cha yambwa “-i-” katika “aliihukumu” kinairejelea Israeli.
- source_word: עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: kwa miaka ishirini na mitatu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi kwa usahihi muda wa miaka 23.
- source_word: וַיָּמָת
  choice: Kisha akafa
  rationale: “Kisha” linaonyesha mwendelezo wa simulizi unaowasilishwa na waw-consecutive, bila kudokeza utofautishaji.
- source_word: וַיִּקָּבֵר
  choice: akazikwa
  rationale: Umbo la Nifali limetolewa kwa kauli ya kutendwa, bila kutaja mtu aliyemzika.
- source_word: בְּשָׁמִיר
  choice: huko Shamiri
  rationale: Kihusishi ni cha mahali. “Huko” ni cha asili katika Kiswahili kwa mahali palipotajwa, na “Shamiri” ni unukuzi unaosomeka wa jina la mahali.
