  text: וַ/יָּקָם֩ אַחֲרֵ֨י אֲבִימֶ֜לֶךְ לְ/הוֹשִׁ֣יעַ אֶת יִשְׂרָאֵ֗ל תּוֹלָ֧ע בֶּן פּוּאָ֛ה בֶּן דּוֹד֖וֹ אִ֣ישׁ יִשָּׂשכָ֑ר וְ/הֽוּא יֹשֵׁ֥ב בְּ/שָׁמִ֖יר בְּ/הַ֥ר אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/001.yaml
  text: After Abimelech[a], Tola son of Puah, son of Dodo, a man of Issachar, arose to save Israel; and he lived in Shamir in the hill country of Ephraim.
translation:
  language: sw
  text: Baada ya Abimeleki, Tola mwana wa Pua, mwana wa Dodo[a], mtu wa kabila la Isakari, aliinuka kuwaokoa Israeli. Naye aliishi Shamiri, katika nchi ya vilima ya Efraimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwana wa ami yake.” Kiebrania בֶּן־דּוֹדוֹ kinaweza kueleweka kama kirai cha ukoo chenye Dodo kuwa jina la mtu, au kama usemi wenye maana ya “mwana wa ami yake.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם
  choice: aliinuka
  rationale: Katika muktadha huu kitenzi kinaonyesha kujitokeza kwa kiongozi baada ya Abimeleki; “aliinuka” huhifadhi taswira ya Kiebrania bila kudokeza kwamba aliteuliwa rasmi.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: Baada ya Abimeleki
  rationale: Ni kiashirio cha wakati kinachoonyesha mfuatano wa simulizi.
- source_word: לְהוֹשִׁיעַ אֶת־יִשְׂרָאֵל
  choice: kuwaokoa Israeli
  rationale: Hiphil ya ישׁע ina maana ya kuokoa au kukomboa. “Kuwaokoa” ni ya kawaida na haifungii wokovu huu katika ushindi wa kijeshi pekee.
- source_word: תּוֹלָע בֶּן־פּוּאָה
  choice: Tola mwana wa Pua
  rationale: Majina yametoholewa kwa mtindo wa kawaida wa Kiswahili, na uhusiano wa ukoo umeonyeshwa kwa “mwana wa.”
- source_word: בֶּן־דּוֹדוֹ
  choice: mwana wa Dodo
  rationale: Uwekaji wa irabu katika WLC unaonyesha Dodo kuwa jina la mtu, jambo linalofaa katika nasaba hii; uwezekano wa maana nyingine umehifadhiwa katika tanbihi.
- source_word: אִישׁ יִשָּׂשכָר
  choice: mtu wa kabila la Isakari
  rationale: Kirai hiki kinataja uhusiano wa kikabila; kuongeza “kabila” huifanya maana iwe wazi na ya kawaida kwa msomaji wa Kiswahili.
- source_word: וְהוּא יֹשֵׁב
  choice: Naye aliishi
  rationale: Muundo wa kivumishi-tendo unaeleza mahali alipokuwa akiishi; “aliishi” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: בְּשָׁמִיר
  choice: Shamiri
  rationale: Jina la mahali limetoholewa kwa kufuata mfumo wa sauti wa Kiswahili.
- source_word: בְּהַר אֶפְרָיִם
  choice: katika nchi ya vilima ya Efraimu
  rationale: Kirai hiki kinataja eneo la kijiografia lenye vilima, si lazima mlima mmoja; tafsiri hii ni wazi na ya asili kwa Kiswahili.
theological_decisions:
- issue: Upeo wa wokovu katika לְהוֹשִׁיעַ
  choice: kuwaokoa Israeli
  alternative: kuwakomboa Israeli
  rationale: “Kuwaokoa” huhifadhi maana pana ya kuleta msaada au ukombozi bila kuamua kimbele kama tendo hilo lilikuwa la kijeshi, kisiasa, au la aina nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili kubaki wazi kwa msomaji wa kawaida, huku mpangilio wa habari na utata halisi wa Kiebrania vikihifadhiwa.
