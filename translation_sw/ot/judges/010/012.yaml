  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/צִידוֹנִ֤ים וַֽ/עֲמָלֵק֙ וּ/מָע֔וֹן לָחֲצ֖וּ אֶתְ/כֶ֑ם וַ/תִּצְעֲק֣וּ אֵלַ֔/י וָ/אוֹשִׁ֥יעָ/ה אֶתְ/כֶ֖ם מִ/יָּדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/012.yaml
  text: The Sidonians[a], Amalek, and Maon oppressed you, and you cried out to me[b], and I saved you from their hand.
translation:
  language: sw
  text: Wasidoni, Amaleki[a] na Maoni[b] waliwakandamiza; nanyi mkanililia, nami nikawaokoa kutoka mikononi mwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waamaleki.” Kiebrania kinasema “Amaleki,” jina linaloweza kuwakilisha watu wote wa Amaleki.
    reason: lexical_alternative
  - marker: b
    text: Au, “Wamaoni.” Kiebrania kinasema “Maoni,” labda likimaanisha kikundi cha watu kilichohusishwa na Maoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִידוֹנִים
  choice: Wasidoni
  rationale: Ni nomino ya wingi inayowataja watu wa Sidoni; ‘Wasidoni’ ni jina fupi na la kawaida katika Kiswahili.
- source_word: עֲמָלֵק
  choice: Amaleki
  rationale: Kiebrania kina jina la pekee ‘Amaleki,’ ambalo hapa linaweza kuwakilisha taifa lote. Jina lenyewe limehifadhiwa, huku maana ya kikundi cha watu ikielezwa katika tanbihi.
- source_word: מָעוֹן
  choice: Maoni
  rationale: Maandishi ya Kiebrania yana jina la pekee ‘Maoni.’ Uhawilishaji wa jina unafuata chanzo bila kulifanya wazi kimya kimya kuwa jina la taifa.
- source_word: לָחֲצוּ
  choice: waliwakandamiza
  rationale: Kitenzi hiki huonyesha kushinikiza kwa nguvu, kutesa, au kuweka chini ya ukandamizaji; ‘waliwakandamiza’ ni Kiswahili cha sasa kinachofaa katika muktadha wa utawala wa maadui.
- source_word: וַתִּצְעֲקוּ אֵלַי
  choice: mkanililia
  rationale: Kauli hii inaonyesha kilio cha dharura kinachoelekezwa kwa Mungu. ‘Mkanililia’ ni fupi, ya asili, na inadumisha uzito wa ombi lao.
- source_word: וָאוֹשִׁיעָה
  choice: nikawaokoa
  rationale: Kitenzi ישׁע humaanisha kuokoa au kukomboa kutoka hatarini. ‘Nikawaokoa’ ni wazi na huhifadhi msamiati wa wokovu.
- source_word: מִיָּדָם
  choice: kutoka mikononi mwao
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kutoka katika nguvu au mamlaka yao. Nahau inayolingana katika Kiswahili ni ‘kutoka mikononi mwao.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa sentensi umefanywa wa kawaida katika Kiswahili, huku majina ya Kiebrania, kilio kinachoelekezwa kwa Mungu, na nahau ya kuokolewa kutoka mikononi mwa watesi vikihifadhiwa.
