  yaml_path: translation/ot/judges/010/013.yaml
  text: But you have forsaken me and served other gods[a]; therefore I will no longer save you.
translation:
  language: sw
  text: Lakini ninyi mmeniacha na mmetumikia miungu mingine; kwa hiyo sitawaokoa[a] tena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sitawakomboa” au “sitawanusuru.” Kitenzi cha Kiebrania kinaweza kumaanisha kuokolewa kutoka kwa maadui au kuokolewa kwa maana pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Lakini ninyi
  rationale: Kiunganishi pamoja na kiwakilishi cha wazi kinaonyesha utofautishaji na msisitizo; “Lakini ninyi” huleta maana hiyo kwa Kiswahili cha kawaida.
- source_word: עֲזַבְתֶּם אוֹתִי
  choice: mmeniacha
  rationale: Kitenzi עזב kina maana ya kuacha au kutelekeza. “Mmeniacha” ni cha asili na huhifadhi uzito wa kuvunjika kwa uhusiano bila kuongeza ufafanuzi usio katika maandishi.
- source_word: וַ/תַּעַבְדוּ
  choice: na kuitumikia
  rationale: עבד linapotumiwa kuhusu miungu humaanisha kuitumikia kwa utii wa kidini. “Kuitumikia” ni pana kuliko “kuiabudu” na hudumisha wazo la uaminifu kwa miungu hiyo.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya kirai hicho na inaonyesha utofauti kati ya Mungu anayesema na miungu mingine.
- source_word: לָכֵן
  choice: kwa hiyo
  rationale: Huonyesha wazi kuwa hukumu inayofuata ni matokeo ya tendo lililotajwa kabla.
- source_word: לֹא אוֹסִיף
  choice: sita… tena
  rationale: Muundo wenye יסף na ukanushi unaonyesha kwamba tendo halitaendelea au halitafanywa tena. Kiswahili cha asili hutumia “sita… tena.”
- source_word: לְ/הוֹשִׁיעַ אֶתְכֶם
  choice: kuwaokoa
  rationale: ישע linaweza kumaanisha kuokoa, kukomboa, au kunusuru. “Kuwaokoa” ni fasaha na pana, huku muktadha wa Waamuzi ukihusu kuokolewa kutoka kwa watesi.
theological_decisions:
- issue: Maana ya ישע katika muktadha wa Waamuzi
  choice: kuwaokoa
  alternative: kuwakomboa au kuwanusuru
  rationale: Muktadha unahusu Mungu kuwaokoa watu kutoka kwa maadui na uonevu, lakini kitenzi cha Kiebrania kina maana pana zaidi. “Kuwaokoa” huhifadhi upana huo bila kuifanya maana iwe ya kiroho pekee; tanbihi inaonyesha maana zinazowezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ninyi” imetajwa wazi ili kuhifadhi msisitizo wa Kiebrania; sentensi imeundwa kwa mtiririko wa kawaida na uhusiano wa sababu na matokeo umeonyeshwa kwa “kwa hiyo.”
