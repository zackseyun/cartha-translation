  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַֽ/יִּמְכְּרֵ/ם֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/בְ/יַ֖ד בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/007.yaml
  text: So Yahweh’s anger burned against Israel[c][b][a], and he sold them into the hand of the Philistines and into the hand of the Ammonites.
translation:
  language: sw
  text: Ndipo hasira ya Yahwe ikawaka dhidi ya Israeli[a], naye akawauza[b] mikononi mwa Wafilisti na mikononi mwa Waamoni.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hasira ya Yahwe iliwaka dhidi ya Israeli.”
    reason: lexical_alternative
  - marker: b
    text: “Akawauza” ni usemi unaojirudia katika kitabu cha Waamuzi, unaomaanisha kwamba Yahwe aliwaweka Israeli chini ya utawala wa maadui kama hukumu.
    reason: cross_reference
  - marker: c
    text: 'Kwa tafsiri ya karibu zaidi: “mkononi mwa Wafilisti na mkononi mwa wana wa Amoni.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: hasira ... ikawaka
  rationale: Nahau hii ya Kiebrania huonyesha hasira ikiwaka. Tafsiri hii inadumisha taswira hiyo huku ikiwa ya kawaida na yenye kueleweka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: בְּיִשְׂרָאֵל
  choice: dhidi ya Israeli
  rationale: Katika nahau inayohusu hasira, kihusishi בְּ kinaonyesha kwamba Israeli ndiye aliyelengwa na hasira hiyo.
- source_word: וַיִּמְכְּרֵם
  choice: akawauza
  rationale: Kitenzi מָכַר humaanisha ‘kuuza.’ Hapa ni sitiari inayojirudia katika Waamuzi kuhusu Mungu kuwaweka Israeli chini ya utawala wa maadui kama hukumu.
- source_word: בְּיַד
  choice: mikononi mwa
  rationale: Usemi huu wa Kiswahili ni wa asili na unahifadhi taswira ya Kiebrania ya kuwa chini ya uwezo au mamlaka ya mtu.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa taifa hili.
- source_word: בְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: ‘Waamoni’ ni jina la taifa lililo la kawaida na la asili katika Kiswahili; tafsiri ya neno kwa neno ni ‘wana wa Amoni.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandiko ya Kiebrania hapa yanatumia jina binafsi la Mungu; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Taswira ya hukumu ya Mungu katika וַיִּמְכְּרֵם
  choice: akawauza
  alternative: akawatia mikononi mwa au akawakabidhi
  rationale: Tafsiri ‘akawauza’ inadumisha ukali wa sitiari na kitendo cha Mungu kinachoelezwa waziwazi, bila kukipunguza au kuficha mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo ‘hasira ... ikawaka’ na ‘mikononi mwa’ unadumisha taswira muhimu za Kiebrania bila kufanya sentensi kuwa ngumu.
