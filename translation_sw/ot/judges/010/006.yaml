source:
  edition: WLC
  text: וַ/יֹּסִ֣פוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לַ/עֲשׂ֣וֹת הָ/רַע֮ בְּ/עֵינֵ֣י יְהוָה֒ וַ/יַּעַבְד֣וּ אֶת הַ/בְּעָלִ֣ים וְ/אֶת הָ/עַשְׁתָּר֡וֹת וְ/אֶת אֱלֹהֵ֣י אֲרָם֩ וְ/אֶת אֱלֹהֵ֨י צִיד֜וֹן וְ/אֵ֣ת אֱלֹהֵ֣י מוֹאָ֗ב וְ/אֵת֙ אֱלֹהֵ֣י בְנֵי עַמּ֔וֹן וְ/אֵ֖ת אֱלֹהֵ֣י פְלִשְׁתִּ֑ים וַ/יַּעַזְב֥וּ אֶת יְהוָ֖ה וְ/לֹ֥א עֲבָדֽוּ/הוּ׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/006.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and they served the Baals and the Ashtoreths, and the gods of Aram, the gods of Sidon, the gods of Moab, the gods of the sons of Ammon, and the gods of the Philistines[b]. They forsook Yahweh and did not serve him.
translation:
  language: sw
  text: Waisraeli wakafanya tena yaliyo mabaya machoni pa Yahweh.[a] Wakawatumikia Mabaali na Maashtorethi, na miungu ya Aramu, miungu ya Sidoni, miungu ya Moabu, miungu ya Waamoni,[b] na miungu ya Wafilisti. Wakamwacha Yahweh, wala hawakumtumikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli wakaendelea kufanya yaliyo mabaya machoni pa Yahweh.” Kitenzi cha Kiebrania kinaweza kuonyesha kurudia au kuendelea.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “miungu ya wana wa Amoni,” yaani miungu iliyoabudiwa na Waamoni.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: wakafanya tena
  rationale: Muundo יסף pamoja na kitenzi-jina unaweza kumaanisha kurudia au kuendelea kufanya jambo. “Wakafanya tena” ni Kiswahili cha kawaida kinachoonyesha mzunguko unaorudiwa katika simulizi la Waamuzi; uwezekano wa maana ya kuendelea umehifadhiwa katika tanbihi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa kihalisi ni “wana wa Israeli,” “Waisraeli” ni usemi wa kawaida na wazi katika Kiswahili cha kisasa kwa jamii nzima bila kudokeza wanaume pekee.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: wakafanya ... yaliyo maovu machoni pa Yahweh
  rationale: Huhifadhi nahau ya Kiebrania “machoni pa” huku ikitoa Kiswahili cha asili na kueleweka.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limeandikwa kwa namna ya kulitamka, badala ya kubadilishwa kuwa cheo.
- source_word: וַיַּעַבְדוּ / עֲבָדוּהוּ
  choice: wakawatumikia / hawakumtumikia
  rationale: Kutumia mzizi “tumikia” katika vifungu vyote viwili huhifadhi urudiaji wa neno la Kiebrania עבד na pambano la wazi kati ya kuitumikia miungu na kutomtumikia Yahweh.
- source_word: הַבְּעָלִים
  choice: Mabaali
  rationale: Huhifadhi jina la ibada katika wingi, likirejelea maumbo au madhihirisho mbalimbali ya Baali.
- source_word: הָעַשְׁתָּרוֹת
  choice: Maashtorethi
  rationale: Jina la ibada limetoholewa na wingi wa Kiebrania umeonyeshwa kwa ngeli ya ma- sambamba na “Mabaali.”
- source_word: אֱלֹהֵי אֲרָם / צִידוֹן / מוֹאָב
  choice: miungu ya Aramu / Sidoni / Moabu
  rationale: Majina ya maeneo yametoholewa moja kwa moja, bila kuyabadilisha kwa majina ya kisiasa ya baadaye.
- source_word: אֱלֹהֵי בְנֵי עַמּוֹן
  choice: miungu ya Waamoni
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili kwa “miungu ya wana wa Amoni,” yaani miungu iliyoabudiwa na Waamoni; umbo halisi limeonyeshwa katika tanbihi.
- source_word: אֱלֹהֵי פְלִשְׁתִּים
  choice: miungu ya Wafilisti
  rationale: Hutoa moja kwa moja uhusiano wa miungu hiyo na watu wa Filisti kwa Kiswahili cha kawaida.
- source_word: וַיַּעַזְבוּ
  choice: wakamwacha
  rationale: Kitenzi “mwacha” huwasilisha kuachana na Yahweh na hudumisha uzito wa kuvunja uaminifu wa agano.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania ina jina binafsi יְהוָה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya עבד katika muktadha wa ibada ya sanamu
  choice: kutumikia
  alternative: kuabudu
  rationale: '“Kutumikia” huhifadhi maana pana ya utii na uaminifu, na hasa huhifadhi ulinganifu wa kifasihi: waliitumikia miungu lakini hawakumtumikia Yahweh.'
- issue: Je, וַיֹּסִפוּ inaonyesha kurudia au kuendelea?
  choice: wakafanya tena, huku maana nyingine ikitajwa katika tanbihi
  alternative: wakaendelea kufanya
  rationale: Kiebrania kinaweza kueleza kurudia au kuendelea. Matini kuu inachagua maana inayofaa mzunguko wa simulizi la Waamuzi bila kuficha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umetiririshwa kwa usomaji wa kawaida, huku sitiari “machoni pa,” majina ya ibada, jina Yahweh, na urudiaji wa “kutumikia” vikihifadhiwa.
