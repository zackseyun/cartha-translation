base_translation:
  language: en
  yaml_path: translation/ot/judges/010/014.yaml
  text: Go and cry out to the gods whom you have chosen[a]; let them save you in the time of your distress.
translation:
  language: sw
  text: Nendeni mkazililie miungu mliyoichagua; na ziwaokoe wakati wa taabu yenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zitawaokoa.” Muundo wa Kiebrania unaweza kutafsiriwa kama wakati ujao wa kawaida, lakini katika muktadha unatumiwa kama changamoto ya kejeli.
    reason: alternative_reading
lexical_decisions:
- source_word: לְכוּ
  choice: Nendeni
  rationale: Amri ya wingi kutoka הלך; neno hili ni la kawaida na linaendeleza ukali wa kufukuzwa kwao waende kwa miungu waliyoichagua.
- source_word: וְזַעֲקוּ
  choice: mkazililie
  rationale: זעק ni kulia kwa sauti ukiomba msaada katika dhiki. Muundo wa Kiswahili unaonyesha kwenda kisha kuililia miungu hiyo, bila kupunguza uzito wa ombi lao.
- source_word: אֶל הָאֱלֹהִים
  choice: miungu
  rationale: Ingawa אֱלֹהִים inaweza kuwa na utata wa kisarufi, muktadha pamoja na kiwakilishi na kitenzi vya wingi vinaonyesha miungu mingi ya kigeni.
- source_word: אֲשֶׁר בְּחַרְתֶּם בָּם
  choice: mliyoichagua
  rationale: בחר ב hapa ina maana ya kuchagua. Kiswahili sanifu hutumia ‘chagua’ moja kwa moja; upatanisho wa ngeli unairejelea ‘miungu’ kama jamii.
- source_word: הֵמָּה
  choice: na iwaokoe
  rationale: Kiwakilishi huru cha Kiebrania kinakazia kwamba miungu hiyo ndiyo ijitokeze kuwaokoa. ‘Na iwaokoe’ ni changamoto ya kawaida na yenye mkazo katika Kiswahili.
- source_word: יוֹשִׁיעוּ
  choice: iwaokoe
  rationale: Hifili ya ישׁע humaanisha kuokoa au kukomboa. Katika muktadha huu ni changamoto ya kejeli, si ahadi; muundo ‘na iwaokoe’ unahifadhi nguvu hiyo.
- source_word: בְּעֵת
  choice: wakati wa
  rationale: Kirai cha wakati kinamaanisha katika au wakati wa tukio fulani; ‘wakati wa’ ni cha asili na kinahifadhi muundo wa nomino.
- source_word: צָרַתְכֶם
  choice: taabu yenu
  rationale: צָרָה ni hali ya dhiki, shida, au hatari. ‘Taabu’ ni neno la kawaida na lenye uzito unaofaa hali yao ya kutaka kuokolewa.
theological_decisions:
- issue: Nguvu ya kitenzi יוֹשִׁיעוּ katika muktadha
  choice: 'Kimetafsiriwa kama changamoto ya kejeli: “na iwaokoe.”'
  alternative: “itawaokoa” kama wakati ujao wa kawaida.
  rationale: Hili ni kemeo la BWANA kwa Israeli kwa sababu ya kuifuata miungu mingine. Muktadha unadai changamoto ya kwenda kutafuta wokovu kwa miungu hiyo, lakini tanbihi inahifadhi uwezekano wa kisarufi wa wakati ujao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mkazililie’ huunganisha kwa kawaida amri za kwenda na kulia kuomba msaada; ‘na iwaokoe’ huhifadhi changamoto kali bila kuongeza maelezo ndani ya mstari.
