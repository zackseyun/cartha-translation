  yaml_path: translation/ot/judges/010/010.yaml
  text: Then the sons of Israel cried out to the LORD, saying, “We have sinned against you, because we have forsaken our God and have served the Baals.”
translation:
  language: sw
  text: Ndipo wana wa Israeli wakamlilia BWANA, wakisema, “Tumekutenda dhambi, kwa sababu tumemwacha Mungu wetu na kuitumikia miungu ya Mabaali.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: wakamlilia
  rationale: Kitenzi זעק kinaonyesha kilio cha dhiki kinachoelekezwa kwa BWANA; ‘wakamlilia’ ni Kiswahili cha kawaida na huhifadhi wazo la kuomba msaada kwa kilio.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri rasmi na ya moja kwa moja ya msemo wa Kiebrania, unaowataja watu wa Israeli kwa pamoja.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea katika Biblia za Kiswahili ya kuwakilisha jina la agano YHWH kwa ‘BWANA’ kwa herufi kubwa.
- source_word: חָטָאנוּ לָךְ
  choice: Tumekutenda dhambi
  rationale: Huwasilisha kwa kawaida maana ya kufanya dhambi dhidi ya mtu, huku kiwakilishi ‘-ku-’ kikidumisha uelekeo kwa BWANA.
- source_word: כִּי
  choice: kwa sababu
  rationale: 'Katika muktadha huu kinaanzisha sababu au ufafanuzi wa ungamo: kuacha Mungu na kutumikia Mabaali ndiko kulikokuwa dhambi yao.'
- source_word: עָזַבְנוּ אֶת אֱלֹהֵינוּ
  choice: tumemwacha Mungu wetu
  rationale: Huhifadhi ungamo la kuvunja uaminifu wao kwa Mungu wao kwa lugha ya kawaida na yenye hadhi.
- source_word: הַבְּעָלִים
  choice: miungu ya Baali
  rationale: Wingi wa Kiebrania unaashiria maumbo au miungu mbalimbali iliyoitwa Baali; ‘miungu ya Baali’ huonyesha wingi huo kwa uwazi kuliko jina la wingi lisilo la kawaida kwa wasomaji wengi.
theological_decisions:
- issue: Uhusiano unaoletwa na כִּי
  choice: kwa sababu
  alternative: naam, au kwa kuwa
  rationale: '‘Kwa sababu’ huhifadhi usomaji wa kisababishi unaolingana na muundo wa ungamo: wamefanya dhambi dhidi ya BWANA kwa kumwacha Mungu wao na kuitumikia miungu ya Baali.'
- issue: Jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ ni uwakilishi wa kawaida wa jina hilo katika mapokeo mapana ya Biblia ya Kiswahili bila kulazimisha matamshi yaliyorekebishwa ya tetragramatoni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa ungamo na msisitizo wa Kiebrania umehifadhiwa bila kuongeza ufafanuzi wa kimadhehebu.
