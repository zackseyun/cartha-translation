  text: וַ/יַּעַבְר֤וּ בְנֵֽי עַמּוֹן֙ אֶת הַ/יַּרְדֵּ֔ן לְ/הִלָּחֵ֛ם גַּם בִּ/יהוּדָ֥ה וּ/בְ/בִנְיָמִ֖ין וּ/בְ/בֵ֣ית אֶפְרָ֑יִם וַ/תֵּ֥צֶר לְ/יִשְׂרָאֵ֖ל מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/009.yaml
  text: Then the Ammonites crossed the Jordan to fight also against Judah[a], Benjamin, and the house of Ephraim, and Israel was greatly distressed.
translation:
  language: sw
  text: Ndipo Waamoni wakavuka Yordani ili kupigana pia dhidi ya Yuda, Benyamini, na nyumba ya Efraimu. Israeli wakawa katika dhiki kubwa sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hali ikawa ngumu sana kwa Israeli.”
    reason: Muundo wa Kiebrania ni usio na mtendaji aliyetajwa wazi na unaweza kutafsiriwa kwa namna hii iliyo karibu zaidi na muundo wa chanzo.
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: wakavuka
  rationale: Kitenzi עבר pamoja na Yordani kama yambwa kinaonyesha kuvuka mto; “wakavuka” ni Kiswahili cha kawaida na sahihi.
- source_word: בְנֵי עַמּוֹן
  choice: Waamoni
  rationale: Hili ndilo jina la kawaida la watu wa Amoni katika Kiswahili, badala ya tafsiri halisi isiyo ya kawaida “wana wa Amoni.”
- source_word: אֶת הַיַּרְדֵּן
  choice: Yordani
  rationale: Jina “Yordani” linatambulika kama jina la mto katika muktadha huu, kwa hiyo si lazima kuongeza neno “Mto.”
- source_word: לְהִלָּחֵם
  choice: ili kupigana
  rationale: Muundo huu unaonyesha kusudi la kuvuka kwao, yaani kushiriki katika vita.
- source_word: גַּם
  choice: pia
  rationale: '“Pia” linahifadhi maana ya nyongeza: baada ya mashambulizi yao upande wa mashariki wa Yordani, walivuka ili kushambulia maeneo mengine.'
- source_word: בִּיהוּדָה וּבְבִנְיָמִין וּבְבֵית אֶפְרָיִם
  choice: dhidi ya Yuda, Benyamini, na nyumba ya Efraimu
  rationale: Ingawa kihusishi cha Kiebrania kimsingi kinaweza kumaanisha “katika,” hapa muktadha wa kupigana unaonyesha walengwa wa vita. “Nyumba ya Efraimu” limehifadhiwa kwa kuwa בֵית limo katika matini na linaweza kutaja ukoo au eneo pana la Efraimu.
- source_word: וַתֵּצֶר לְיִשְׂרָאֵל מְאֹד
  choice: Israeli wakawa katika dhiki kubwa sana
  rationale: Usemi wa Kiebrania unaeleza hali ngumu sana iliyowapata Israeli. Tafsiri hii ni ya asili kwa Kiswahili na haiingizi mtendaji ambaye hajatajwa katika matini.
