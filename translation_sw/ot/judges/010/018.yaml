base_translation:
  language: en
  yaml_path: translation/ot/judges/010/018.yaml
  text: And the people[a], the leaders of Gilead, said to one another, “Who is the man who will begin to fight against the sons of Ammon? He shall become head over all the inhabitants of Gilead.”
translation:
  language: sw
  text: Nao watu, yaani viongozi wa Gileadi, wakaambiana wao kwa wao[a], “Ni mtu gani atakayeanza kupigana na Waamoni? Yeye atakuwa mkuu wa wakazi wote wa Gileadi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno moja moja: “kila mtu kwa mwenzake.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם שָׂרֵי גִלְעָד
  choice: watu, yaani viongozi wa Gileadi
  rationale: 'Nomino hizi zimewekwa pamoja bila kiunganishi. Muktadha unaunga mkono uhusiano wa ufafanuzi: watu wanaozungumza ni viongozi wa Gileadi. ‘Yaani’ huonyesha uhusiano huo kwa Kiswahili cha kawaida huku ikihifadhi vipashio vyote vya Kiebrania.'
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: wakaambiana wao kwa wao
  rationale: Usemi huu ni wa kutendeana na kwa maana halisi ni ‘kila mtu kwa mwenzake.’ Kitenzi ‘wakaambiana’ pamoja na ‘wao kwa wao’ kinatoa maana hiyo kwa Kiswahili cha asili.
- source_word: מִי הָאִישׁ
  choice: Ni mtu gani
  rationale: ‘Mtu gani’ huhifadhi nomino ya wazi אִישׁ na swali la kutafuta kiongozi maalumu wa vita.
- source_word: יָחֵל לְהִלָּחֵם
  choice: atakayeanza kupigana
  rationale: יָחֵל katika kausativi hapa humaanisha ‘kuanza,’ nayo לְהִלָּחֵם ina maana ya kupigana. Muundo wa wakati ujao unafaa kwa swali kuhusu atakayechukua hatua.
- source_word: בִּבְנֵי עַמּוֹן
  choice: na Waamoni
  rationale: Ingawa kwa neno moja moja ni ‘wana wa Amoni,’ Waamoni ni jina la kawaida na la asili la taifa hilo kwa Kiswahili. Katika muundo ‘kupigana na,’ ‘na’ huonyesha mpinzani bila utata.
- source_word: יִהְיֶה לְרֹאשׁ
  choice: atakuwa mkuu
  rationale: ‘Mkuu’ huwasilisha sitiari na maana ya uongozi ya רֹאשׁ kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: wa wakazi wote wa Gileadi
  rationale: ‘Wakazi wote’ huonyesha watu wote wanaokaa Gileadi na kuhifadhi upeo kamili wa mamlaka unaoelezwa na maandishi.
theological_decisions:
- issue: Lugha dhahiri ya kiume katika uchaguzi wa kiongozi wa vita
  choice: Ni mtu gani
  alternative: Ni nani / Ni mtu yupi
  rationale: Kiebrania kinatumia אִישׁ waziwazi katika muktadha wa kutafuta kiongozi maalumu wa kijeshi. ‘Mtu gani’ huhifadhi nomino hiyo badala ya kuifuta, bila kuongeza dai la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtiririko wa masimulizi umehifadhiwa kwa ‘Nao’ na ‘wakaambiana’; ‘Gileadi’ na ‘Waamoni’ ni maumbo ya majina yaliyozoeleka katika Kiswahili cha Biblia.
