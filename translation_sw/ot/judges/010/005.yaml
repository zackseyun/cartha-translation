lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kitenzi מות katika usimulizi kina maana ya kawaida na ya moja kwa moja ya kufa; “akafa” ni Kiswahili cha asili na hakipunguzi uzito wa kauli hiyo.
- source_word: יָאִיר
