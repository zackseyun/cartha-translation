  rationale: Jina la mtu limetoholewa kwa namna inayofaa matamshi na tahajia ya Kiswahili sanifu.
- source_word: וַיִּקָּבֵר
  choice: akazikwa
  rationale: Nifali ya קבר ina maana ya kutendwa, “alizikwa”; katika mfuatano wa masimulizi, “akazikwa” huwasilisha kwa kawaida tendo lililofuata kifo chake.
- source_word: בְּקָמוֹן
  choice: huko Kamoni
  rationale: Kihusishi בְּ kinaonyesha mahali. “Huko Kamoni” ni usemi wa kawaida wa Kiswahili kwa mahali palipotajwa katika taarifa ya maziko, huku jina likitoholewa kwa tahajia ya Kiswahili.
