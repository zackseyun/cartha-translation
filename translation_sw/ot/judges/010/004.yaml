base_translation:
  language: en
  yaml_path: translation/ot/judges/010/004.yaml
  text: He had thirty sons, riding on thirty donkeys, and they had thirty towns. To this day they are called Havvoth-jair, which are in the land of Gilead.
translation:
  language: sw
  text: Alikuwa na wana thelathini waliokuwa wakipanda punda thelathini, nao walikuwa na miji thelathini. Hadi leo miji hiyo huitwa Havoth-yairi[a], nayo iko katika nchi ya Gileadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Havoth-yairi maana yake “makazi ya Yairi.” Katika Kiebrania, maneno yaliyotafsiriwa “punda” na “miji” yana sauti zinazokaribiana.
    reason: Hufafanua jina la mahali na kuhifadhi mchezo wa maneno wa Kiebrania ambao hauwezi kuonyeshwa moja kwa moja katika Kiswahili.
lexical_decisions:
- source_word: עֲיָרִים (ʿayārîm)
  choice: punda
  rationale: Neno hili humaanisha punda, hasa punda madume wachanga; ‘punda’ ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: עֲיָרִים (ʿārîm)
  choice: miji
  rationale: Katika kishazi cha pili neno lenye mwandiko unaofanana humaanisha miji; ‘miji’ huhifadhi maana bila kulazimisha ukubwa wa makazi hayo.
- source_word: חַוֺּת יָאִיר (ḥawwōt yāʾîr)
  choice: Hawoth-yairi
  rationale: Jina la mahali limetoholewa kwa sauti badala ya kutafsiriwa ndani ya mstari; maana yake imeelezwa katika tanbihi.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: Hadi leo
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kwa ufupi maana ya ‘mpaka siku hii.’
- source_word: אֶרֶץ הַגִּלְעָד
  choice: nchi ya Gileadi
  rationale: Huhifadhi istilahi ya kijiografia na kulitohowa jina Gileadi kwa namna iliyozoeleka katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi la Maandiko. ‘Waliokuwa wakipanda’ huonyesha hali yao ya kawaida au endelevu, na ‘miji hiyo’ huweka wazi kiwakilishi cha Kiebrania bila kubadili rejeleo lake.
