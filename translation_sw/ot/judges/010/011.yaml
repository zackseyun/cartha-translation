  text: וַ֥/יֹּאמֶר יְהוָ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ וּ/מִן הָ֣/אֱמֹרִ֔י וּ/מִן בְּנֵ֥י עַמּ֖וֹן וּ/מִן פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/011.yaml
  text: And Yahweh said to the sons of Israel[a], “Was it not from Egypt, and from the Amorites, and from the Ammonites, and from the Philistines[b], that I delivered you?"
translation:
  language: sw
  text: Yahwe akawaambia wana wa Israeli[a], “Je, sikuwakomboa kutoka Misri, na kutoka kwa Waamori, na kutoka kwa Waamoni, na kutoka kwa Wafilisti[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Israeli”; yaani, Waisraeli.'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania cha mstari huu kina swali la duaradufu; kitenzi “sikuwakomboa” kimejazwa kwa ajili ya uwazi kutokana na muktadha unaofuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akawaambia
  rationale: Katika masimulizi, wayyiqtol ya אמר hutafsiriwa kwa kawaida kwa ‘akawaambia’ wakati walengwa wa usemi wametajwa; hii ni Kiswahili cha asili kuliko ‘akasema kwa.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahwe,’ badala ya kubadilishwa na cheo kama ‘BWANA.’
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi taswira ya kifamilia ya Kiebrania ‘wana wa Israeli’ bila kuigeuza kuwa jina la kikabila tu.
- source_word: הֲלֹא
  choice: Je, si
  rationale: Huanzisha swali la balagha lenye ukanushi na kuacha muundo wa kishazi kilichodondoshwa kama ulivyo katika Kiebrania.
- source_word: מִמִּצְרַיִם
  choice: kutoka Misri
  rationale: מן huonyesha chanzo au mahali ambako ukombozi ulitoka; ‘kutoka Misri’ pia hudumisha ulinganifu wa orodha.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Nomino ya umoja yenye maana ya mkusanyiko inawakilisha kundi la watu, hivyo wingi wa jina la taifa ni wa kawaida katika Kiswahili.
- source_word: בְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Hili ndilo jina la kawaida la Kiswahili la watu wa Amoni katika muktadha wa kikabila.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Jina la kawaida la Kiswahili la kundi hili la watu.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Jina binafsi la Mungu linahifadhiwa kwa kulitohowa, bila kulibadilisha kuwa cheo.
- issue: Iwapo kuhifadhi nahau בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Chaguo hili huhifadhi muundo na taswira ya kifamilia ya matini chanzi huku likibaki wazi katika Kiswahili.
- issue: Kukamilisha kishazi kilichodondoshwa
  choice: Kutoingiza kitenzi katika mstari huu; kuacha swali likiendelea kimawazo hadi muktadha unaofuata
  alternative: Je, si mimi niliyewaokoa kutoka Misri ...?
  rationale: Kiebrania cha mstari huu hakina kitenzi cha ‘kuwaokoa’; mstari unaishia baada ya orodha na utegemezi wake wa muktadha ni sehemu ya muundo wa chanzo. Tanbihi inaeleza udondoshaji huo bila kuuficha katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa swali usio kamili umehifadhiwa ili kutokiongeza kimya kimya kitenzi kisichopo katika mstari wa Kiebrania.
