id: JDG.10.8
reference: Judges 10:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יִּרְעֲצ֤וּ וַ/יְרֹֽצְצוּ֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/שָּׁנָ֖ה הַ/הִ֑יא שְׁמֹנֶ֨ה עֶשְׂרֵ֜ה שָׁנָ֗ה אֶֽת כָּל בְּנֵ֤י יִשְׂרָאֵל֙ אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן בְּ/אֶ֥רֶץ הָ/אֱמֹרִ֖י אֲשֶׁ֥ר בַּ/גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/008.yaml
  text: And they shattered and crushed the sons of Israel in that year[a]; for eighteen years they oppressed all the sons of Israel who were beyond the Jordan in the land of the Amorites[b], which is in Gilead.
translation:
  language: sw
  text: Mwaka huo waliwavunja na kuwaponda Waisraeli[a]; kwa miaka kumi na minane waliwakandamiza Waisraeli wote waliokuwa ng’ambo ya Yordani, katika nchi ya Waamori iliyoko Gileadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliwavunja na kuwakandamiza Waisraeli.” Kiebrania kinatumia vitenzi viwili vikali vyenye maana zinazokaribiana ili kusisitiza ukali wa mateso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְעֲצוּ
  choice: waliwavunja
  rationale: Kitenzi hiki kinaonyesha kuvunja au kuponda kwa nguvu. ‘Waliwavunja’ kinahifadhi taswira kali ya Kiebrania bila kuibadili kuwa dhana ya jumla tu ya kuwaonea.
- source_word: וַיְרֹצְצוּ
  choice: na kuwaponda
  rationale: Kitenzi hiki cha pili, chenye maana inayokaribiana na cha kwanza, kinaongeza uzito wa mateso. ‘Kuwaponda’ kinadumisha urudiaji wenye nguvu wa Kiebrania.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa tafsiri ya kimuundo ni ‘wana wa Israeli,’ katika Kiswahili cha sasa ‘Waisraeli’ huwasilisha kwa kawaida maana ya watu wa Israeli bila kudokeza wanaume pekee.
- source_word: בַּשָּׁנָה הַהִיא
  choice: Mwaka huo
  rationale: Hii ni tafsiri ya kawaida na ya karibu ya kishazi cha wakati.
- source_word: שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: kwa miaka kumi na minane
  rationale: ‘Kwa’ huonyesha wazi muda ambao ukandamizaji uliendelea.
- source_word: אֶת כָּל בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli wote
  rationale: ‘Wote’ linahifadhi wazo la jumla ya kundi linalotajwa, huku ‘Waisraeli’ ikiwa namna ya asili ya Kiswahili.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: waliokuwa ng’ambo ya Yordani
  rationale: ‘Ng’ambo ya Yordani’ huhifadhi mtazamo wa kijiografia wa Kiebrania bila kubainisha upande ambao matini haubainishi.
- source_word: בְּאֶרֶץ הָאֱמֹרִי
  choice: katika nchi ya Waamori
  rationale: Hii inahifadhi muundo wa eneo katika chanzo; nomino ya Kiebrania iko katika umoja wa kijumla, lakini Kiswahili kwa kawaida hutaja watu hao kama Waamori.
- source_word: אֲשֶׁר בַּגִּלְעָד
  choice: iliyoko Gileadi
  rationale: Kishazi husika kinahifadhiwa ili kutambulisha kwa usahihi nchi ya Waamori inayozungumziwa.
theological_decisions:
- issue: Je, בְּנֵי יִשְׂרָאֵל itafsiriwe kimuundo kama ‘wana wa Israeli’ au kimaanisho kama ‘Waisraeli’?
  choice: Waisraeli
  alternative: wana wa Israeli
  rationale: Usemi wa Kiebrania unataja taifa kwa ujumla, si wana wa kiume pekee. ‘Waisraeli’ ni wa asili, wazi, na hauingizi tofauti ya kitheolojia.
- issue: Kitenzi katika sehemu ya miaka kumi na minane hakirudiwi waziwazi katika Kiebrania.
  choice: waliwakandamiza
  alternative: kurudia ‘waliwavunja na kuwaponda’ au kuacha kishazi bila kitenzi
  rationale: Kiswahili kinahitaji kishazi kamili hapa. ‘Waliwakandamiza’ huonyesha mwendelezo wa dhiki bila kudai kwamba tendo la kimwili la kuvunja lilifanyika daima; nyongeza hii ni ya kisarufi na inafuata nguvu ya vitenzi vya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira kali ya vitenzi viwili vya Kiebrania imehifadhiwa; ‘Waisraeli’ limetumiwa badala ya ‘wana wa Israeli’ kwa ufasaha na usahihi wa maana. Alama ya tanbihi [a] imewekwa katika matini kuu.
