  text: וַ/תֵּבְךְּ֩ אֵ֨שֶׁת שִׁמְשׁ֜וֹן עָלָ֗י/ו וַ/תֹּ֨אמֶר֙ רַק שְׂנֵאתַ֨/נִי֙ וְ/לֹ֣א אֲהַבְתָּ֔/נִי הַֽ/חִידָ֥ה חַ֨דְתָּ֙ לִ/בְנֵ֣י עַמִּ֔/י וְ/לִ֖/י לֹ֣א הִגַּ֑דְתָּה וַ/יֹּ֣אמֶר לָ֗/הּ הִנֵּ֨ה לְ/אָבִ֧/י וּ/לְ/אִמִּ֛/י לֹ֥א הִגַּ֖דְתִּי וְ/לָ֥/ךְ אַגִּֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/016.yaml
  text: Then Samson’s wife wept before him and said[a], “You only hate me; you do not love me. You have posed the riddle to the sons of my people, but you have not told me.” And he said to her, “Look, I have not told my father or my mother, so should I tell you?”
translation:
  language: sw
  text: Ndipo mke wa Samsoni akalia mbele yake na kusema, “Wewe unanichukia tu; hunipendi. Umewatega wana wa watu wangu[a] kitendawili, lakini hujaniambia.” Samsoni akamwambia, “Tazama, hata baba yangu na mama yangu sijawaambia; je, nikuambie wewe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, “wana wa watu wangu.” Kiebrania kimetumia umbo la kiume, na huenda katika mazingira haya kinawarejelea wanaume wa watu wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ ... עָלָיו
  choice: akalia mbele yake
  rationale: בכה ni ‘kulia’; עַל pamoja na mtu hapa inaonyesha kulia mbele yake au kumwelekea, katika muktadha wa shinikizo la kihisia. ‘Akalia mbele yake’ ni Kiswahili cha kawaida bila kuongeza tafsiri ya nia.
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: mke wa Samsoni
  rationale: Muundo wa kiambatano unaonyesha uhusiano wa ndoa; huu ndio usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: רַק שְׂנֵאתַנִי וְלֹא אֲהַבְתָּנִי
  choice: Wewe unanichukia tu; hunipendi
  rationale: ‘Tu’ huhifadhi nguvu ya רַק, na vitenzi vya kuchukia na kupenda vimeachwa katika upinzani wake wa moja kwa moja.
- source_word: הַחִידָה חַדְתָּ
  choice: Umewategea ... kitendawili
  rationale: חִידָה ni kitendawili, na חוד hapa ni kutoa au kutega kitendawili. ‘Kutega kitendawili’ ni usemi wa asili na unaoeleweka katika Kiswahili.
- source_word: לִבְנֵי עַמִּי
  choice: wana wa watu wangu
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania ‘wana wa watu wangu’ na hali yake ya kiume, inayowafaa wanaume wa upande wa watu wake katika mazingira haya.
- source_word: וְלִי לֹא הִגַּדְתָּה
  choice: lakini hujaniambia
  rationale: נגד katika Hifili ni kuambia au kujulisha. ‘Hujaniambia’ ni ya kawaida katika mazungumzo haya na hutunza tofauti ya ‘wao’ na ‘mimi’.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Huhifadhi msisitizo wa kuvuta fikira uliomo katika הִנֵּה kwa lugha yenye hadhi na inayoeleweka.
- source_word: לְאָבִי וּלְאִמִּי לֹא הִגַּדְתִּי
  choice: hata baba yangu na mama yangu sijawaambia
  rationale: '‘Hata’ huleta nguvu ya hoja: Samsoni hakuwajulisha hata wazazi wake. Wazazi wote wawili wametajwa wazi kama katika Kiebrania.'
- source_word: וְלָךְ אַגִּיד
  choice: je, nikuambie wewe?
  rationale: Kauli ya wakati ujao ina nguvu ya swali la balagha katika muktadha. ‘Wewe’ mwishoni huhifadhi msisitizo wa לָךְ.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mazungumzo yamewekwa kwa mtindo wa kawaida; ‘wana wa watu wangu’ limehifadhiwa ili kutofuta umbo la kiume la chanzo. Alama ya tanbihi [a] imewekwa mara baada ya ‘kitendawili’, ambapo maelezo ya walengwa yanafaa kusomwa.
