base_translation:
  language: en
  yaml_path: translation/ot/judges/014/018.yaml
  text: And the men of the city said to him on the seventh day[a], before the sun went down, “What is sweeter than honey, and what is stronger than a lion?” And he said to them, “If you had not plowed with my heifer[b], you would not have found out my riddle.”
translation:
  language: sw
  text: Nao wanaume wa mji wakamwambia siku ya saba, kabla jua halijatua[a], “Ni nini kilicho kitamu kuliko asali, na ni nini kilicho na nguvu kuliko simba?” Naye akawaambia, “Kama msingelima kwa mtamba wangu[b], msingekitegua kitendawili changu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kabla jua halijaingia,” nahau inayomaanisha kabla ya jua kutua.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “Kama msingelima kwa mtamba wangu.” Samsoni anatumia sitiari kumrejelea mke wake na kuwashutumu wanaume hao kwa kumtumia ili wategue kitendawili.
    reason: cultural_note
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: wanaume wa mji
  rationale: Huhifadhi wazi wingi wa kiume wa Kiebrania na kueleza mahali kwa Kiswahili cha kawaida.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: siku ya saba
  rationale: Ni usemi wa kawaida na wa karibu na muundo wa chanzo.
- source_word: בְּטֶרֶם יָבֹא הַחַרְסָה
  choice: kabla jua halijatua
  rationale: Hutoa maana ya nahau ya Kiebrania kwa Kiswahili cha asili huku tanbihi ikihifadhi picha yake halisi.
- source_word: מַה מָּתוֹק מִדְּבַשׁ
  choice: Ni nini kilicho kitamu kuliko asali
  rationale: Kiambishi מִן kina maana ya ulinganisho hapa; tafsiri hii ni wazi na ya kawaida.
- source_word: וּמֶה עַז מֵאֲרִי
  choice: na ni nini kilicho na nguvu kuliko simba
  rationale: עַז inaweza kumaanisha nguvu, ukali, au uhodari; 'kilicho na nguvu' kinafaa zaidi katika muundo huu wa ulinganisho.
- source_word: לוּלֵא
  choice: Kama ... singe-
  rationale: Muundo huu unaonyesha sharti lisilotimia katika wakati uliopita kwa Kiswahili cha kawaida.
- source_word: חֲרַשְׁתֶּם
  choice: msingelima
  rationale: Huhifadhi kitenzi halisi cha kilimo na hivyo kutunza sitiari kali ya Samsoni.
- source_word: בְּעֶגְלָתִי
  choice: kwa mtamba wangu
  rationale: '''Mtamba'' ni ng’ombe jike mchanga na huhifadhi picha halisi ya chanzo badala ya kuibadili moja kwa moja kuwa ''mke wangu''.'
- source_word: מְצָאתֶם חִידָתִי
  choice: msingekitegua kitendawili changu
  rationale: Katika muktadha wa kitendawili, 'kutegua' huwasilisha kwa kawaida maana ya kugundua suluhisho lake.
