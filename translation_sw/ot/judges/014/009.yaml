base_translation:
  language: en
  yaml_path: translation/ot/judges/014/009.yaml
  text: He scraped it into his hands and went on[a], eating as he went. Then he went to his father and mother and gave some to them, and they ate. But he did not tell them that he had scraped the honey from the carcass of the lion.
translation:
  language: sw
  text: Akaichota[a] na kuiweka mikononi mwake, akaenda zake huku akila. Kisha akawaendea baba yake na mama yake, akawapa kiasi, nao wakala. Lakini hakuwaambia kwamba alikuwa ameichota asali hiyo kutoka katika mzoga wa simba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akaikwangua” au “akaitoa”; kitenzi cha Kiebrania kinaonyesha kuitoa asali kwa mkono kutoka ndani ya mzoga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֵּהוּ
  choice: Akaichota
  rationale: Kitenzi רדה hapa kinaeleza kuitoa asali kwa mkono kutoka ndani ya mzoga. “Kuichota” ni cha kawaida na chenye picha wazi katika Kiswahili, bila kukifanya kuwa tendo la kawaida tu la ‘kuchukua.’
- source_word: אֶל כַּפָּיו
  choice: mikononi mwake
  rationale: כַּף humaanisha kiganja au mkono; “mikononi mwake” ni usemi wa kawaida unaoonyesha mahali asali ilipowekwa.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְאָכֹל
  choice: akaenda zake huku akila
  rationale: Muundo wa kitenzi pamoja na vitenzi-jina unaonyesha matendo yanayoendelea kwa pamoja; tafsiri hii inaonyesha kuwa alikula alipokuwa akienda.
- source_word: וַיֵּלֶךְ אֶל אָבִיו וְאֶל אִמּוֹ
  choice: Kisha akawaendea baba yake na mama yake
  rationale: הלך hapa ni kwenda; “kisha” huendeleza mtiririko wa simulizi, na “akawaendea” huwasilisha kwa kawaida kwamba alienda walikokuwa.
- source_word: וַיִּתֵּן לָהֶם
  choice: akawapa kiasi
  rationale: Kitu kinachotolewa kinaeleweka kuwa sehemu ya asali. “Kiasi” huonyesha maana hiyo ya sehemu kwa Kiswahili cha kawaida bila kuongeza wazo jipya.
- source_word: וַיֹּאכֵלוּ
  choice: nao wakala
  rationale: Kitenzi ni cha moja kwa moja, na kitu walichokula kinaeleweka kutokana na muktadha.
- source_word: וְלֹא הִגִּיד לָהֶם
  choice: Lakini hakuwaambia
  rationale: 'הגיד ni kuambia au kutoa taarifa. “Lakini” huonyesha utofauti wa maana katika muktadha: aliwapa wale lakini hakufichua ilikotoka.'
- source_word: מִגְּוִיַּת הָאַרְיֵה
  choice: kutoka katika mzoga wa simba
  rationale: גְּוִיָּה ni mwili uliokufa; kwa mnyama, “mzoga” ni sahihi na hudumisha hali halisi isiyopendeza ya maneno ya Kiebrania.
- source_word: רָדָה הַדְּבָשׁ
  choice: alikuwa ameichota asali hiyo
  rationale: Kitenzi kilekile רדה kimetafsiriwa kwa “chota” tena ili kudumisha ulinganifu wa msamiati. Muundo “alikuwa ameichota” unaonyesha tendo lililotangulia ambalo kifungu hiki kinalieleza.
