  text: וְ/אָבִ֨י/ו וְ/אִמּ֜/וֹ לֹ֣א יָדְע֗וּ כִּ֤י מֵ/יְהוָה֙ הִ֔יא כִּי תֹאֲנָ֥ה הֽוּא מְבַקֵּ֖שׁ מִ/פְּלִשְׁתִּ֑ים וּ/בָ/עֵ֣ת הַ/הִ֔יא פְּלִשְׁתִּ֖ים מֹשְׁלִ֥ים בְּ/יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/004.yaml
  text: But his father and mother did not know that it was from Yahweh[a], for he was seeking an occasion from the Philistines[b]. At that time the Philistines were ruling over Israel.
translation:
  language: sw
  text: Lakini baba yake na mama yake hawakujua kwamba jambo hilo lilitoka kwa Bwana, kwa maana alikuwa akitafuta fursa dhidi ya Wafilisti[a][b]. Wakati huo Wafilisti walikuwa wakitawala Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mhusika wa maneno “alikuwa akitafuta” huenda ni Samsoni. Hata hivyo, Kiebrania pia kinaweza kueleweka kwamba Bwana ndiye aliyekuwa akitafuta fursa dhidi ya Wafilisti.
    reason: alternative_reading
  - marker: b
    text: Neno lililotafsiriwa “fursa” linaweza pia kumaanisha “kisingizio” au “sababu.” Kihusishi cha Kiebrania kinaweza pia kueleweka kwa maana yake ya msingi, “kutoka kwa Wafilisti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיְהוָה
  choice: lilitoka kwa Yahwe
  rationale: Kirai hiki kinaonyesha wazi kwamba jambo lililozungumziwa lilitokana na Yahwe; jina la agano limetoholewa kama “Yahwe.”
- source_word: הִיא
  choice: jambo hilo
  rationale: Kiwakilishi cha kike kinarejelea hali au jambo lililokuwa likizungumziwa, si lazima mwanamke mwenyewe. “Jambo hilo” ni Kiswahili cha kawaida kinachoweka rejeo hilo wazi bila kulifafanua kupita kiasi.
- source_word: תֹאֲנָה
  choice: fursa ya kuchukua hatua
  rationale: Neno linaweza kumaanisha fursa, sababu, au kisingizio cha kuanzisha hatua. Tafsiri hii huepuka kudokeza moja kwa moja udanganyifu unaoweza kuambatana na “kisingizio,” huku ikihifadhi mwelekeo wa mgogoro.
- source_word: מְבַקֵּשׁ
  choice: alikuwa akitafuta
  rationale: Muundo wa kitenzi kishirikishi unaonyesha tendo lililokuwa likiendelea wakati huo.
- source_word: מִפְּלִשְׁתִּים
  choice: dhidi ya Wafilisti
  rationale: Ingawa kihusishi kwa umbo la moja kwa moja ni “kutoka kwa,” katika muktadha huu kinaonyesha kwamba fursa iliyotafutwa ilihusu hatua dhidi ya Wafilisti.
- source_word: וּבָעֵת הַהִיא
  choice: Wakati huo
  rationale: Huu ni mpito wa wakati ulio wa kawaida na wa asili katika simulizi la Kiswahili.
- source_word: מֹשְׁלִים בְּיִשְׂרָאֵל
  choice: walikuwa wakiitawala Israeli
  rationale: Kitenzi kishirikishi kinaonyesha hali endelevu ya Wafilisti kuwa na mamlaka juu ya Israeli.
- source_word: וְאָבִיו וְאִמּוֹ
  choice: baba yake na mama yake
  rationale: Huhifadhi wahusika wote wawili kwa mpangilio wa Kiebrania na kwa Kiswahili cha kawaida.
- source_word: לֹא יָדְעוּ
  choice: hawakujua
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi katika muktadha huu.
theological_decisions:
- issue: Uhusiano kati ya utendaji wa Yahwe na kusudi la Samsoni
  choice: Maandishi yanasema jambo hilo lilitoka kwa Yahwe na wakati huohuo yanamtaja mtafutaji wa fursa dhidi ya Wafilisti.
  alternative: Kufafanua kwamba Yahwe alisababisha kila kipengele cha tamaa ya Samsoni, au kwamba Yahwe alitumia baadaye tu uamuzi wa Samsoni ambao haukuhusiana naye.
  rationale: Kiebrania kinaweka pamoja utendaji wa Mungu na utendaji wa mhusika bila kueleza kwa mfumo jinsi vinavyohusiana. Tafsiri inadumisha mvutano huo.
- issue: Mhusika wa הוּא מְבַקֵּשׁ, “alikuwa akitafuta”
  choice: Muktadha unaelekea kumtaja Samsoni, lakini Kiswahili hakilazimishi kutaja jina lake ndani ya sentensi.
  alternative: Kumwelewa Yahwe kuwa ndiye aliyekuwa akitafuta fursa dhidi ya Wafilisti.
  rationale: Kiwakilishi cha Kiebrania kinaweza kisarufi kurejelea Yahwe, lakini simulizi pana linaelekea kwa Samsoni. Tanbihi inahifadhi uwezekano huo badala ya kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. “Yahwe” limetumiwa kuhifadhi jina binafsi la agano; “jambo hilo” huepuka utata usio wa lazima wa kiwakilishi cha kijinsia, na tanbihi huhifadhi utata halisi kuhusu mhusika wa “alikuwa akitafuta.”
