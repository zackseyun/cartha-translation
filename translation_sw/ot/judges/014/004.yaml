  - severity: low
    issue: “fursa ya kuchukua hatua” adds “to take action.”
    rationale: The Hebrew says that an occasion/pretext was being sought; it does not explicitly include a verbal complement equivalent to “take action.” The hostile context may be reflected by “dhidi ya,” but the added phrase is unnecessary.
