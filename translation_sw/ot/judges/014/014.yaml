base_translation:
  language: en
  yaml_path: translation/ot/judges/014/014.yaml
  text: And he said to them[a], “Out of the eater came food[b], and out of the strong came sweetness.” But they could not tell the riddle for three days.
translation:
  language: sw
  text: Naye akawaambia, “Kutoka kwa mla kilitoka chakula, na kutoka kwa mwenye nguvu[a] ukatoka utamu.” Lakini hawakuweza kutegua[b] kitendawili kwa siku tatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa mkali.” Neno la Kiebrania linaweza kumaanisha “mwenye nguvu,” “hodari,” au “mkali.”
    reason: lexical_alternative
  - marker: b
    text: Au “kueleza.” Katika muktadha huu maana ni kutoa jibu la kitendawili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Naye akawaambia
  rationale: Huwasilisha mwendelezo wa simulizi wa wayyiqtol na pia kiwakilishi cha wale walioambiwa kwa Kiswahili cha kawaida.
- source_word: מֵהָאֹכֵל
  choice: Kutoka kwa mla
  rationale: Mofimu hii ni kitenzi-shirikishi cha אכל kilichotumiwa kama nomino, yaani ‘anayekula’ au ‘mla.’ ‘Kutoka kwa’ huhifadhi wazo la chanzo bila kufafanua fumbo mapema.
- source_word: יָצָא מַאֲכָל
  choice: kilitoka chakula
  rationale: Mpangilio huu huhifadhi umbo la kishairi la fumbo na maana ya kitu kujitokeza kutoka katika chanzo fulani.
- source_word: וּמֵעַז
  choice: na kutoka kwa mwenye nguvu
  rationale: עַז inaweza kumaanisha mwenye nguvu, hodari, au mkali. ‘Mwenye nguvu’ huhifadhi upana wa maana na ulinganifu wa fumbo bila kumtaja simba moja kwa moja.
- source_word: יָצָא מָתוֹק
  choice: ukatoka utamu
  rationale: מָתוֹק imetumiwa hapa kama nomino ya kitu au sifa tamu. ‘Utamu’ ni fupi, ya asili, na hudumisha ulinganifu wa kishairi na ‘chakula.’
- source_word: לֹא יָכְלוּ לְהַגִּיד הַחִידָה
  choice: hawakuweza kutegua kitendawili
  rationale: Katika muktadha wa fumbo, להגיד ni kutoa au kueleza jibu. ‘Kutegua kitendawili’ ni usemi wa kawaida wa Kiswahili, huku tanbihi ikihifadhi uwezekano wa ‘kueleza.’
- source_word: שְׁלֹשֶׁת יָמִים
  choice: kwa siku tatu
  rationale: Huwasilisha muda uliotajwa bila kulazimisha maana ya ‘ndani ya’ ambayo haijawekwa wazi katika Kiebrania.
