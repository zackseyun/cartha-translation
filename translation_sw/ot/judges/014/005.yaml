  verdict: revise
  source_fidelity: 'Tafsiri inafuata kwa uaminifu mfuatano wa Kiebrania: Samsoni na wazazi wake wanashuka kuelekea Timna, wanafika kwenye mashamba ya mizabibu, na simba mchanga anamjia huku akinguruma. Hata hivyo, «Walipofika kwenye» hufanya kauli ya kujitegemea וַיָּבֹאוּ עַד kuwa kishazi tegemezi na hupunguza «mpaka/as far as».'
  naturalness: Kiswahili ni cha asili kwa ujumla. «Nao wakafika mpaka kwenye» ni mwendo wa simulizi ulio wazi zaidi. Tanbihi ya rasimu, «akinguruma kuelekea kukutana naye», haisikiki kwa kawaida katika Kiswahili Sanifu.
  terminology: «Samsoni», «Timna», «mashamba ya mizabibu», na «mwana-simba» zinafaa kwa rejista ya simulizi la Maandiko. «Mwana-simba» hutumika kwa kawaida kwa simba mchanga na huepuka kudai umri maalumu zaidi ya כְּפִיר.
  issues:
  - severity: low
    issue: Kauli ya kufika imewekwa kama kishazi tegemezi na haionyeshi wazi «mpaka».
    rationale: וַיָּבֹאוּ עַד ni kauli huru ya simulizi, yenye maana ya kufika hadi mahali fulani. «Nao wakafika mpaka kwenye...» huhifadhi jambo hilo kwa karibu zaidi.
  - severity: medium
    issue: Tanbihi ya mbadala si ya asili kisarufi.
    rationale: «Kuelekea kukutana naye» ni muundo usio wa kawaida. Mbadala wa karibu na לִקְרָאתוֹ ni «akimngurumia ili kumkabili», ingawa matini kuu ibaki na utata wa «akimjia».
  revised_text: Ndipo Samsoni akashuka pamoja na baba yake na mama yake kwenda Timna. Nao wakafika mpaka kwenye mashamba ya mizabibu ya Timna. Tazama, mwana-simba alikuwa akinguruma akimjia.[a]
