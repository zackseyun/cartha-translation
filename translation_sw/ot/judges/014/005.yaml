translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Jina ‘Samsoni’ linafuata matumizi yaliyozoeleka katika Biblia za Kiswahili; ‘Timna’ linaakisi jina la mahali katika chanzo.
