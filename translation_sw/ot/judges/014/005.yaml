base_translation:
  language: en
  yaml_path: translation/ot/judges/014/005.yaml
  text: Then Samson went down with his father and his mother to Timnah[a], and they came as far as the vineyards of Timnah. And behold[c][b], a young lion was roaring as it came toward him.
translation:
  language: sw
  text: Ndipo Samsoni akashuka pamoja na baba yake na mama yake kwenda Timna. Nao wakafika mpaka kwenye mashamba ya mizabibu ya Timna. Tazama, mwana-simba alikuwa akinguruma akimjia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akimngurumia ili kumkabili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: akashuka
  rationale: Kitenzi ירד kina maana ya kushuka; hapa kinahifadhi mwelekeo wa safari kutoka eneo la vilima kuelekea Timna.
- source_word: תִּמְנָתָה
  choice: kwenda Timna
  rationale: He ya mwelekeo inaonyesha mwendo kuelekea mahali; ‘kwenda Timna’ ni Kiswahili cha kawaida kinachoonyesha safari yenye Timna kama mwisho wake.
- source_word: וַיָּבֹאוּ עַד
  choice: walipofika kwenye
  rationale: Muundo huu unaonyesha kufikia hatua au sehemu fulani ya safari. ‘Walipofika kwenye’ ni wa asili katika simulizi la Kiswahili.
- source_word: כַּרְמֵי תִמְנָתָה
  choice: mashamba ya mizabibu ya Timna
  rationale: כֶּרֶם humaanisha shamba la mizabibu; muundo tegemezi unaunganisha mashamba hayo na Timna.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili huvuta fikira kwa tukio la ghafla au la kushangaza. ‘Tazama’ hudumisha uzito na uhai wa simulizi bila kuwa la kizamani kupita kiasi.
- source_word: כְּפִיר אֲרָיוֹת
  choice: mwana-simba
  rationale: כְּפִיר ni simba mchanga, si kitoto kidogo tu; usemi wa Kiebrania ‘mwana-simba wa simba’ ni wa kiidioma na hutolewa kwa kawaida kama ‘mwana-simba.’
- source_word: שֹׁאֵג
  choice: alikuwa akinguruma
  rationale: Hali ya kushiriki huonyesha tendo linaloendelea; muundo huu wa Kiswahili unahifadhi uhai huo.
- source_word: לִקְרָאתוֹ
  choice: akimjia
  rationale: Neno linaweza kumaanisha kuelekea au kukutana naye. ‘Akimjia’ linaonyesha mwendo wa simba kuelekea Samsoni huku tanbihi ikihifadhi uwezekano wa tafsiri ya karibu zaidi na muundo wa chanzo.
