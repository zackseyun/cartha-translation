  yaml_path: translation/ot/judges/014/010.yaml
  text: So his father went down to the woman[a], and Samson made a feast there, for that is what the young men did.
translation:
  language: sw
  text: Basi baba yake akashuka kwenda kwa yule mwanamke, naye Samsoni akaandaa karamu[a] huko, kwa maana ndivyo vijana walivyokuwa wakifanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhifa” au “karamu ya kunywa.” Neno la Kiebrania מִשְׁתֶּה mara nyingi humaanisha mlo wa sherehe unaohusisha unywaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: akashuka kwenda
  rationale: Neno ירד lina maana ya kushuka; “akashuka kwenda” linahifadhi mwelekeo wa safari huku likisikika kwa kawaida katika simulizi la Kiswahili.
- source_word: אָבִיהוּ
  choice: baba yake
  rationale: Kiambishi cha nafsi ya tatu umoja wa kiume kinamrejelea Samsoni katika muktadha.
- source_word: אֶל הָאִשָּׁה
  choice: kwa yule mwanamke
  rationale: Kiebrania kinasema moja kwa moja “kwa mwanamke”; “yule” humtambulisha mwanamke aliyetajwa tayari bila kumfafanua zaidi kuwa mke au mchumba.
- source_word: וַיַּעַשׂ
  choice: akaandaa
  rationale: Ingawa עשה ni pana, katika muungano na מִשְׁתֶּה maana ya kawaida ni kuandaa au kufanya karamu; “akaandaa” ni Kiswahili cha asili katika muktadha huu.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki cha mahali kinarejelea mahali alikokwenda baba yake; “huko” ni cha kawaida na wazi.
- source_word: מִשְׁתֶּה
  choice: karamu
  rationale: Neno hili humaanisha karamu au dhifa ya sherehe, mara nyingi yenye unywaji; “karamu” halibainishi kupita kiasi.
- source_word: כִּי כֵּן יַעֲשׂוּ
  choice: kwa maana ndivyo ... walivyokuwa wakifanya
  rationale: Kifungu kinaeleza tendo lililokuwa desturi; muundo wa “walivyokuwa wakifanya” unaonyesha hali ya mazoea katika wakati wa simulizi.
- source_word: הַבַּחוּרִים
  choice: vijana
  rationale: בָּחוּר humaanisha vijana wa kiume walio katika utu uzima wa mapema; katika muktadha huu “vijana” ni wazi na ya kawaida.
