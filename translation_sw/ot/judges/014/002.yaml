  yaml_path: translation/ot/judges/014/002.yaml
  text: Then he went up and told his father and mother[a], and he said, “I saw a woman in Timnah from the daughters of the Philistines. So now, get her for me as a wife.”
translation:
  language: sw
  text: Kisha akapanda, akawaambia baba yake na mama yake, akasema, “Nimemwona mwanamke Timna, mmoja wa binti za Wafilisti.[a] Basi sasa, mnichukulie huyo awe mke wangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “kutoka miongoni mwa binti za Wafilisti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: Kisha akapanda
  rationale: Kitenzi עלה humaanisha kupanda au kwenda juu. Tafsiri hii inadumisha maana ya mwendo yenye uwezekano wa kuonyesha mwinuko wa mahali bila kuufafanua kupita kiasi.
- source_word: וַיַּגֵּד
  choice: akawaambia
  rationale: Katika Hifili, נגד ni kusema, kutoa habari, au kujulisha. “Akawaambia” ni Kiswahili cha kawaida na pia huonyesha kwamba wazazi wote wawili ndio walioambiwa.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: baba yake na mama yake
  rationale: Hii inafuata umilikaji wa Kiebrania kwa uwazi na kwa mtindo wa kawaida wa Kiswahili.
- source_word: אִשָּׁה
  choice: mwanamke
  rationale: אשה inaweza kumaanisha mwanamke au mke. Kwa kuwa hapa Samsoni alikuwa bado anamwomba awe mke wake, “mwanamke” inafaa katika hatua hii ya simulizi.
- source_word: רָאִיתִי
  choice: Nimemwona
  rationale: Kauli timilifu ya Kiswahili huonyesha tukio lililopita ambalo ndilo msingi wa ombi lake la sasa, na inasikika kwa kawaida katika usemi huu.
- source_word: בְתִמְנָתָה
  choice: huko Timna
  rationale: Umbo hili linaelekeza kwenye mahali paitwapo Timna. “Huko Timna” ni la kawaida katika Kiswahili na haliongezi maelezo ya kijiografia yasiyokuwapo katika kifungu.
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: mmoja wa binti za Wafilisti
  rationale: Hii inawasilisha maana ya sehemu ya kundi—mmoja kutoka miongoni mwao—na inadumisha nahau ya kifamilia ya Kiebrania kwa Kiswahili kinachoeleweka.
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Maneno haya yanahamisha usemi kutoka taarifa kwenda ombi lenye kutegemea taarifa hiyo.
- source_word: קְחוּ
  choice: mnichukulie
  rationale: Amri iko katika wingi na inaelekezwa kwa wazazi wake. Katika muktadha wa ndoa, “mnichukulie” huonyesha kwamba waandae kumpata huyo mwanamke kwa ajili yake bila kuficha maana ya msingi ya לקח.
- source_word: אוֹתָהּ לִּי לְאִשָּׁה
  choice: huyo awe mke wangu
  rationale: Kauli hii ya kawaida ya Kiswahili inahifadhi lengo la tendo hilo—mwanamke huyo kuwa mke wake—pamoja na masilahi binafsi yanayoonyeshwa na לִי.
