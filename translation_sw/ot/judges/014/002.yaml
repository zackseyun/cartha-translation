translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kauli “mnichukulie” inadumisha wingi wa amri ya Kiebrania na desturi ya wazazi kushiriki katika mpango wa ndoa, bila kuongeza hukumu ya kitamaduni au kiteolojia.
