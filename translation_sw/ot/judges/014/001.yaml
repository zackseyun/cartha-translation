  verdict: revise
  source_fidelity: The draft correctly preserves Samson's descent, destination, seeing, and the woman's Philistine identity. However, “wanawake wa Kifilisti” is less idiomatic and less precise than the conventional ethnic plural “Wafilisti”; the Hebrew explicitly uses the idiom “daughters of the Philistines.”
  naturalness: The narrative sequence is natural in Standard East African Swahili. “Akamwona” and “huko Timna” work well. Retaining “binti za Wafilisti” is both readily understandable in biblical register and closer to the source idiom.
  terminology: “Samsoni,” “Timna,” and “Wafilisti” are appropriate established Kiswahili biblical forms. “Binti za Wafilisti” preserves the Hebrew familial/ethnic expression without asserting that the woman was a child.
  issues:
