  yaml_path: translation/ot/judges/014/001.yaml
  text: Then Samson went down to Timnah[a], and at Timnah he saw a woman from the daughters of the Philistines.
translation:
  language: sw
  text: Kisha Samsoni akashuka kwenda Timna, na huko Timna akamwona mwanamke mmoja miongoni mwa binti za Wafilisti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: akashuka kwenda
  rationale: Kitenzi ירד humaanisha kushuka. Kauli hii inadumisha taswira ya kijiografia ya Kiebrania huku ikieleza kwa Kiswahili cha kawaida kwamba alielekea Timna.
- source_word: שִׁמְשׁוֹן
  choice: Samsoni
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili sanifu.
- source_word: תִּמְנָתָה
  choice: kwenda Timna
  rationale: Herufi he ya mwelekeo huonyesha mwendo kuelekea mahali; 'kwenda Timna' ni usemi wa kawaida wa Kiswahili.
- source_word: וַיַּרְא
  choice: akamwona
  rationale: ראה ni kitenzi cha kawaida cha kuona; tafsiri hii haiongezi wazo la kuvutiwa au kuchunguza.
- source_word: אִשָּׁה
  choice: mwanamke mmoja
  rationale: אשה hapa ni mwanamke, si mke, kwa kuwa simulizi bado halijasema kwamba wameoana.
- source_word: בְּתִמְנָתָה
  choice: huko Timna
  rationale: ב huonyesha mahali; 'huko Timna' ni ya asili katika Kiswahili na huepuka kurudia kwa namna ngumu.
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: miongoni mwa wanawake wa Kifilisti
  rationale: Kiebrania halisi ni 'kutoka kwa binti za Wafilisti,' lakini katika muktadha huu 'miongoni mwa wanawake wa Kifilisti' huwasilisha maana ya kabila kwa Kiswahili cha kawaida bila kudokeza kwamba alikuwa mtoto mdogo.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa simulizi wa vitenzi vinavyofuatana umehifadhiwa kwa 'akashuka ... akamwona.' Hakuna tanbihi iliyohitajika kwa kuwa usemi wa asili wa Kiebrania kuhusu 'binti za Wafilisti' unaweza kutolewa wazi na kwa kawaida katika matini kuu.
