translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. ‘Na tazama’ limehifadhiwa kama ishara ya mshangao na ugunduzi katika masimulizi ya Biblia. Sentensi imewekwa wazi bila kuongeza ufafanuzi wa kiteolojia.
