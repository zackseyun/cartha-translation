  source_fidelity: 'Maana kuu imehifadhiwa vizuri: kurejea baada ya muda, kugeuka kando kuutazama mzoga wa simba, na kukuta kundi la nyuki pamoja na asali. Hata hivyo, “awe mke wake” hufanya wazi zaidi maana ambayo Kiebrania huiacha katika usemi wa “kumchukua”; “kumwoa” ni tafsiri sahihi na ya asili zaidi katika muktadha bila kuongeza kishazi cha ufafanuzi. Rejeo la pili la Kiebrania hutaja tena simba, hivyo lirudishwe wazi.'
