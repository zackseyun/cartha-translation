  text: After some days he returned to take her, and he turned aside to see the carcass of the lion, and behold, a swarm of bees was in the body of the lion, and honey.
translation:
  language: sw
  text: Baada ya siku kadhaa, alirudi kumwoa. Akageuka kando kuutazama mzoga wa simba, na tazama, katika mzoga wa simba kulikuwa na kundi la nyuki na asali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיָּמִים
  choice: baada ya siku kadhaa
  rationale: Ni usemi usioainisha muda kamili; tafsiri hii huhifadhi maana ya kupita kwa muda fulani.
- source_word: לְקַחְתָּהּ
  choice: ili kumchukua awe mke wake
  rationale: Katika muktadha wa simulizi hili, kitenzi ‘kumchukua’ kinahusu kukamilisha ndoa na kumchukua mwanamke kama mke; nyongeza hii fupi huifanya maana ieleweke kwa msomaji wa kisasa.
- source_word: וַיָּסַר
  choice: akakengeuka njiani
  rationale: Huonyesha kuacha njia au mwelekeo wa safari ili kwenda kuangalia kitu.
- source_word: מַפֶּלֶת הָאַרְיֵה
  choice: mzoga wa simba
  rationale: Ingawa neno la msingi linaweza kumaanisha kitu kilichoanguka, katika muktadha linarejelea maiti au mzoga wa simba.
- source_word: עֲדַת דְּבוֹרִים
  choice: kundi la nyuki
  rationale: Hutoa maana ya mkusanyiko au kundi la nyuki bila kulazimisha istilahi ya kiufundi zaidi.
- source_word: בִּגְוִיַּת הָאַרְיֵה
  choice: ndani ya mzoga huo
  rationale: ‘Mwili/mzoga wa simba’ hapa ni simba yuleyule aliyetajwa mara moja kabla; ‘huo’ huepuka urudiaji mzito huku ikihifadhi rejeo.
- source_word: וּדְבָשׁ
  choice: na asali
  rationale: Huhifadhi muundo mfupi wa Kiebrania unaoongeza uwepo wa asali bila kuingiza kitenzi kisichoandikwa wazi.
