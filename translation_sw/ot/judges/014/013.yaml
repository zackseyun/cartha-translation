base_translation:
  language: en
  yaml_path: translation/ot/judges/014/013.yaml
  text: But if you cannot tell me[a], then you must give me thirty linen garments and thirty changes of clothes.” And they said to him, “Tell your riddle, and let us hear it.”
translation:
  language: sw
  text: Lakini ikiwa hamtaweza kuniambia, basi mtanipa mavazi thelathini ya kitani[a] na mavazi thelathini ya kubadilisha.” Nao wakamwambia, “Tega kitendawili chako, nasi tukisikie.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitambaa thelathini vya kitani.” Neno la Kiebrania linaweza kumaanisha vitu vya kitani laini, lakini hapa huenda linarejelea mavazi kwa kuwa linalingana na “mavazi ya kubadilisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תוּכְלוּ
  choice: hamtaweza
  rationale: Kitenzi יכל kinaonyesha uwezo; wakati ujao ndani ya sharti unaendana kwa kawaida na muundo wa Kiswahili ‘ikiwa hamtaweza.’
- source_word: לְהַגִּיד לִי
  choice: kuniambia
  rationale: Hifili ya נגד humaanisha ‘kuambia/kutangaza.’ Kiswahili ‘kuniambia’ kinaweza kubeba kitu kinachoeleweka kutokana na muktadha bila kulazimika kuongeza ‘jibu.’
- source_word: וּנְתַתֶּם אַתֶּם לִי
  choice: basi mtanipa
  rationale: Muundo huu unaonyesha matokeo yanayowafunga katika sharti la dau; ‘basi mtanipa’ ni wa kawaida na huhifadhi nguvu ya makubaliano bila kuongeza neno la ulazima lisilo wazi katika umbo lenyewe.
- source_word: סְדִינִים
  choice: mavazi ya kitani
  rationale: Neno hilo linaweza kutaja vitu vya kitani laini, hasa vya kuvaliwa katika muktadha huu; ‘mavazi’ linafaa sambamba na zawadi nyingine ya nguo.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: seti za nguo za kubadilisha
  rationale: Kirai kinataja mavazi mbadala au seti kamili za nguo. ‘Seti za nguo za kubadilisha’ huonyesha kwamba kila kipengele kinachohesabiwa ni mkusanyo wa nguo, si nguo moja tu.
- source_word: חוּדָה חִידָתְךָ
  choice: Tega kitendawili chako
  rationale: Kitenzi חוד katika muktadha huu ni kutoa au kutega kitendawili. ‘Tega kitendawili’ ni usemi wa kawaida wa Kiswahili na huhifadhi maana hiyo.
- source_word: וְנִשְׁמָעֶנָּה
  choice: nasi tukisikie
  rationale: Muundo wa kutaka katika nafsi ya kwanza wingi wenye kiambishi kinachorejelea kitendawili umehifadhiwa kwa ‘nasi tukisikie.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tega kitendawili’ ni usemi wa asili; ‘kuniambia’ huepuka kuongeza wazi ‘jibu’ ambalo halipo katika Kiebrania, ingawa linadokezwa na muktadha.
