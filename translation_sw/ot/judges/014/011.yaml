  yaml_path: translation/ot/judges/014/011.yaml
  text: And when they saw him[a], they took thirty companions, and they were with him.
translation:
  language: sw
  text: Ikawa walipomwona, wakachukua waandamani[a] thelathini, nao wakawa pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “marafiki”; huenda hasa walikuwa waandamani wa arusi au wasindikizaji wa bwana arusi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hutambulisha tukio linalofuata katika simulizi na kuhifadhi mtiririko wa kauli ya Kiebrania bila kuongeza maelezo.
- source_word: כִּרְאוֹתָם
  choice: walipomwona
  rationale: 'Muundo wa כ pamoja na kitenzi-jina cha ראה na kiambishi cha nafsi una maana ya wakati: “walipomwona.”'
- source_word: אֹתוֹ
  choice: -m- katika “walipomwona”
  rationale: Ni kiwakilishi cha yambwa kinachomrejelea Samsoni; Kiswahili hukionyesha kwa kiambishi cha yambwa ndani ya kitenzi.
- source_word: וַיִּקְחוּ
  choice: wakachukua
  rationale: Huhifadhi maana ya msingi ya לקח, “kuchukua,” bila kuamua kimya kimya ikiwa waliwaleta, waliwachagua, au waliwaweka rasmi.
- source_word: שְׁלֹשִׁים
  choice: thelathini
  rationale: Ni idadi kamili ya watu thelathini.
- source_word: מֵרֵעִים
  choice: waandamani
  rationale: Neno hili linaonyesha watu walioandamana au kushirikiana naye. “Waandamani” halilazimishi maana maalumu ya marafiki wa karibu au wasindikizaji rasmi wa bwana arusi.
- source_word: וַיִּהְיוּ אִתּוֹ
  choice: nao wakawa pamoja naye
  rationale: Hufuata kwa karibu kauli rahisi ya Kiebrania, “wakawa pamoja naye,” bila kuongeza wazo maalumu la kukaa au kumsindikiza.
