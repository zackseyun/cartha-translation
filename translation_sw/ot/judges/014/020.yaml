translation:
  language: sw
  text: Mke wa Samsoni akawa mke wa rafiki yake[a], aliyekuwa rafiki yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mshirika wake … aliyekuwa ameshirikiana naye.” Kiebrania kinatumia maneno yanayohusiana kutoka kundi la רעה, yanayoeleza urafiki au ushirika wa kijamii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: akawa
  rationale: Kitenzi היה katika mfululizo wa simulizi kinaonyesha badiliko la hali au matokeo; “akawa” linaonyesha mpito huo kuliko “alikuwa.”
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: mke wa Samsoni
  rationale: Muundo huu wa umilikaji unaonyesha wazi uhusiano wa ndoa na ni Kiswahili cha kawaida na cha asili.
- source_word: לְמֵרֵעֵהוּ
  choice: akawa mke wa mwandamani wake
  rationale: Kihusishi לְ pamoja na היה hapa kinaonyesha kuingia katika hali ya kuwa mke wa mtu mwingine. “Mwandamani” linafaa kwa mshirika wa Samsoni katika mazingira ya harusi na pia linatofautisha neno hili na “rafiki” katika kishazi kinachofuata.
- source_word: אֲשֶׁר רֵעָה לוֹ
  choice: ambaye alikuwa rafiki yake
  rationale: Kitenzi רֵעָה hapa kina maana ya kushirikiana au kuwa rafiki, si kuchunga mifugo. Tafsiri hii ni ya kawaida na huhifadhi maana ya uhusiano wa kijamii.
