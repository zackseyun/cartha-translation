base_translation:
  language: en
  yaml_path: translation/ot/judges/014/017.yaml
  text: She wept before him the seven days that they had the feast[a]. And on the seventh day he told her, because she pressed him hard[b]; then she told the riddle to the sons of her people.
translation:
  language: sw
  text: Akamlilia siku zote saba za karamu yao.[a] Siku ya saba, akamwambia, kwa sababu alikuwa amemsumbua sana; kisha akawaambia wanaume wa jamii yake[b] kitendawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, Kiebrania kinasema “akalia juu yake.” Nahau hiyo inaonyesha kilio kilichomlenga na kilichotumiwa kumshinikiza kwa kuendelea.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “wana wa watu wake”; huenda usemi huo unamaanisha hasa wanaume wa jamii yake, yaelekea wale Wafilisti waliokuwa pamoja naye katika karamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ עָלָיו
  choice: Akamlilia
  rationale: Kitenzi בכה humaanisha kulia, na עַל pamoja na kiambishi cha nafsi huonyesha kwamba kilio chake kilielekezwa kwa Samsoni na kilikuwa njia ya kumshinikiza. “Akamlilia” ni Kiswahili cha kawaida kinachohifadhi mwelekeo huo; tanbihi inaeleza nahau ya Kiebrania.
- source_word: שִׁבְעַת הַיָּמִים
  choice: siku zote saba
  rationale: Huhifadhi idadi kamili na wazo la kipindi kizima kilichotajwa.
- source_word: אֲשֶׁר הָיָה לָהֶם הַמִּשְׁתֶּה
  choice: za karamu yao
  rationale: מִשְׁתֶּה ni karamu, mara nyingi yenye kunywa; usemi huu ni wa asili katika Kiswahili bila kuifanya kwa lazima kuwa aina maalumu zaidi ya karamu.
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: Siku ya saba
  rationale: היה hapa huendeleza simulizi na kutaja wakati; muundo mfupi ni wa kawaida katika Kiswahili.
- source_word: וַיַּגֶּד לָהּ
  choice: akamwambia
  rationale: נגד ni kusema, kutangaza, au kufahamisha. Kiebrania hakitaji wazi alichomwambia katika kishazi hiki, kwa hiyo tafsiri haiongezi “jibu” ingawa muktadha unalidokeza.
- source_word: כִּי הֱצִיקַתְהוּ
  choice: kwa sababu alikuwa amemsumbua sana
  rationale: Hifili ya צוק huonyesha shinikizo kali au usumbufu wa kudumu. “Amesumbua sana” ni usemi wa sasa, wa kawaida, unaoonyesha uzito wa shinikizo hilo.
- source_word: וַתַּגֵּד הַחִידָה
  choice: akawaambia ... kitendawili
  rationale: Huhifadhi kitenzi kilekile cha msingi נגד na nomino חִידָה, “kitendawili,” bila kuongeza kwamba alitoa tu jibu lake.
- source_word: לִבְנֵי עַמָּהּ
  choice: wanaume wa kwao
  rationale: Kwa neno ni “wana wa watu wake.” Katika muktadha, usemi huo unaelekea kuwarejelea wanaume wa jamii yake, yaani Wafilisti waliokuwa katika tukio hilo; “wanaume wa kwao” ni Kiswahili cha asili na chenye usahihi wa kijinsia.
