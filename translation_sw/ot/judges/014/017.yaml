translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, kwa mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo umeepuka kuongeza “jibu la kitendawili,” kwa kuwa Kiebrania chenyewe kinasema kwamba alimwambia na kisha mwanamke akawaambia watu wake kitendawili.
