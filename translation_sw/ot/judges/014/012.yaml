  naturalness: ‘Hebu niwategee kitendawili’ na ‘seti thelathini za nguo’ ni Kiswahili Sanifu cha kawaida. Kuandika ‘kukitegua’ kwa kutaja rejeleo la kitendawili hufanya uratibu wa vitenzi uwe wazi na wa asili zaidi.
