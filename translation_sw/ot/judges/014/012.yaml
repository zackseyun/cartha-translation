base_translation:
  language: en
  yaml_path: translation/ot/judges/014/012.yaml
  text: And Samson said to them[a], “Please let me put a riddle to you. If you indeed tell it to me within the seven days of the feast and solve it[c][b], then I will give you thirty linen garments and thirty changes of clothes.”
translation:
  language: sw
  text: Samsoni akawaambia, “Hebu niwategee kitendawili. Ikiwa kweli mtanieleza jibu lake na kukitegua katika zile siku saba za karamu[a], nitawapa mavazi thelathini ya kitani[b] na seti thelathini za nguo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “na kukipata”; yaani, kupata jibu la kitendawili.
    reason: lexical_alternative
  - marker: b
    text: Aina halisi za mavazi haya hazijulikani kwa uhakika. Kiebrania kinataja mavazi ya kitani na seti za nguo.
    reason: cultural_note
lexical_decisions:
- source_word: אָחֽוּדָה נָּא
  choice: Hebu niwategee
  rationale: Kauli ya hiari pamoja na נָא inaonyesha pendekezo la upole. ‘Hebu niwategee’ ni usemi wa kawaida wa Kiswahili wa kuanzisha kitendawili na unahifadhi wazo la ‘acha ni…’.
- source_word: חִידָה
  choice: kitendawili
  rationale: Neno hili humaanisha fumbo au usemi unaohitaji kuteguliwa; ‘kitendawili’ ndilo neno la kawaida na linalofaa katika muktadha huu.
- source_word: אִם הַגֵּד תַּגִּידוּ
  choice: Ikiwa kweli mtaniambia
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichonyambuliwa unasisitiza tendo. ‘Kweli’ huonyesha msisitizo huo bila kuugeuza kuwa kauli kuhusu uwezo wao.
- source_word: אוֹתָהּ לִי
  choice: mtaniambia jibu lake
  rationale: Kiebrania kinasema kihalisi ‘mtaniambia hilo’; katika muktadha wa kitendawili, Kiswahili cha kawaida huhitaji kutaja ‘jibu lake’ ili maana iwe wazi.
- source_word: שִׁבְעַת יְמֵי הַמִּשְׁתֶּה
  choice: katika zile siku saba za karamu
  rationale: מִשְׁתֶּה ni karamu au sherehe yenye chakula na vinywaji; hapa ni karamu ya arusi. ‘Katika zile siku saba’ huonyesha kipindi kilichowekwa kwa shindano.
- source_word: וּמְצָאתֶם
  choice: na kulitegua
  rationale: Maana ya msingi ni ‘na kulipata,’ lakini kwa kitendawili tendo linalokusudiwa ni kupata jibu, yaani kulitegua. Tanbihi inahifadhi maana ya neno kwa neno.
- source_word: שְׁלֹשִׁים סְדִינִים
  choice: mavazi thelathini ya kitani
  rationale: סְדִינִים ni mavazi ya kitani, huenda vitambaa vya kujifunika au mavazi ya ndani. Tafsiri hii huepuka kubainisha aina isiyo na uhakika.
- source_word: שְׁלֹשִׁים חֲלִפֹת בְּגָדִים
  choice: seti thelathini za nguo
  rationale: Kirai hiki humaanisha seti au mavazi ya kubadilisha. ‘Seti za nguo’ ni Kiswahili cha sasa na huonyesha kwamba kila moja ilikuwa mkusanyo wa mavazi.
- source_word: וְנָתַתִּי לָכֶם
  choice: nitawapa
  rationale: Kiunganishi kinaanzisha matokeo ya sharti. Katika Kiswahili, muundo wa sharti ‘ikiwa… nitawapa’ unaonyesha uhusiano huo wazi bila kulazimika kuongeza ‘basi’.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na wenye heshima. ‘Hebu niwategee kitendawili’ hutumia istilahi ya kawaida ya Kiswahili kuhusu kutega na kutegua kitendawili; msisitizo wa Kiebrania umehifadhiwa kwa ‘kweli.’
