  yaml_path: translation/ot/judges/014/007.yaml
  text: Then he went down and spoke to the woman[a], and she was pleasing in Samson’s eyes.
translation:
  language: sw
  text: Kisha akashuka, akazungumza na yule mwanamke, naye akapendeza machoni pa Samsoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa usemi wa kawaida zaidi, “naye akampendeza Samsoni,” au “Samsoni akaona kuwa anafaa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Kisha akashuka
  rationale: Kitenzi ירד humaanisha kushuka. Kauli hii inadumisha mwendo wa kijiografia kuelekea Timna, huku “Kisha” ikiwakilisha mfuatano wa simulizi kwa Kiswahili cha kawaida.
- source_word: וַיְדַבֵּר
  choice: akazungumza
  rationale: דבר pamoja na ל inaonyesha kusema au kuzungumza na mtu. “Akazungumza” ni ya asili katika Kiswahili na haiongezi wazo lisilokuwapo la mazungumzo marefu.
- source_word: לָאִשָּׁה
  choice: na yule mwanamke
  rationale: אִשָּׁה inaweza kumaanisha mwanamke au mke. Kwa kuwa bado hawajafunga ndoa katika muktadha huu, “yule mwanamke” huepuka kumwita mke kabla ya wakati.
- source_word: וַתִּישַׁר
  choice: naye akapendeza
  rationale: Kitenzi kinachotokana na ישר hapa huonyesha kuwa mwanamke huyo alionekana mwenye kufaa au kupendeza kwa tathmini ya Samsoni. “Akapendeza” ni ya kawaida na hudumisha maana bila kuifanya kuwa uamuzi wa kimaadili usio na shaka.
- source_word: בְּעֵינֵי שִׁמְשׁוֹן
  choice: machoni pa Samsoni
  rationale: Usemi wa Kiebrania “machoni pa” unaonyesha tathmini ya Samsoni. Kuuhifadhi kunadumisha taswira ya chanzo na mwangwi unaowezekana wa mada ya kitabu kuhusu jambo lililo sawa machoni pa mtu.
theological_decisions:
- issue: Mwangwi unaowezekana wa mada ya Waamuzi kuhusu lililo sawa machoni pa mtu mwenyewe
  choice: Kuhifadhi usemi “machoni pa Samsoni” katika maandishi
  alternative: Kutafsiri kwa usemi wa kawaida zaidi, “alimfurahisha Samsoni” au “Samsoni alimwona kuwa anafaa”
  rationale: Maneno ya Kiebrania yanaweza kukumbusha mada pana ya kitabu bila kuthibitisha moja kwa moja hukumu ya kimaadili. Kuhifadhi usemi huo kunabakiza mvutano na mwangwi wa kifasihi badala ya kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa simulizi ulio wazi kwa wasomaji wa kawaida; usemi “machoni pa Samsoni” umehifadhiwa kwa sababu ya taswira na mwangwi wake wa kifasihi.
