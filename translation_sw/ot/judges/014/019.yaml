base_translation:
  language: en
  yaml_path: translation/ot/judges/014/019.yaml
  text: And the Spirit of Yahweh rushed upon him[a], and he went down to Ashkelon and struck down thirty men from among them, and took their spoil garments and gave the changes of clothes to those who had explained the riddle. And his anger burned, and he went up to his father's house.
translation:
  language: sw
  text: Ndipo Roho ya Yahwe ikamjia kwa nguvu, naye akashuka hadi Ashkeloni. Akawaua wanaume thelathini miongoni mwao, akatwaa mavazi yao[a], kisha akawapa wale waliokuwa wametegua kitendawili yale mavazi ya kubadilisha. Hasira yake ikawaka, naye akapanda kwenda nyumbani kwa baba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mavazi yaliyovuliwa kutoka kwao.” Neno la Kiebrania huenda linamaanisha hasa mavazi yaliyovuliwa kutoka kwa watu waliouawa na kutwaliwa kama nyara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: Roho ya Yahwe ikamjia kwa nguvu
  rationale: Kitenzi צלח pamoja na רוּחַ יְהוָה kinaonyesha Roho kumjia mtu kwa ghafla na kwa nguvu ili kumwezesha. Kiswahili hiki ni cha kawaida na kinahifadhi nguvu ya msemo bila kudokeza kwamba matendo yote yaliyofuata yaliidhinishwa kimaadili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa uhawilishaji wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: וַיֵּרֶד אַשְׁקְלוֹן
  choice: akashuka hadi Ashkeloni
  rationale: Neno ירד lina maana ya kushuka; “hadi Ashkeloni” linaonyesha wazi mwelekeo na mahali alikofikia kwa Kiswahili cha asili.
- source_word: וַיַּךְ מֵהֶם שְׁלֹשִׁים אִישׁ
  choice: akawaua wanaume thelathini miongoni mwao
  rationale: Katika muktadha huu נכה ni pigo lililosababisha kifo, kwa hiyo “akawaua” linaweka maana wazi. “Miongoni mwao” linahifadhi maana ya sehemu ya kundi iliyo katika מֵהֶם.
- source_word: חֲלִיצוֹתָם
  choice: mavazi yao[a]
  rationale: Neno linaweza kumaanisha mavazi, hasa mavazi yaliyovuliwa waliouawa na kutwaliwa kama nyara. Maandishi makuu yanabaki ya kawaida, huku tanbihi ikihifadhi maana hiyo mahususi inayowezekana.
- source_word: הַחֲלִיפוֹת
  choice: yale mavazi ya kubadilisha
  rationale: Katika muktadha wa dau la kitendawili, חליפות ni mavazi ya kubadilisha, yaani seti za mavazi alizokuwa amewaahidi.
- source_word: לְמַגִּידֵי הַחִידָה
  choice: wale waliokuwa wametegua kitendawili
  rationale: נגד hapa inawahusu wale waliotoa jibu la kitendawili. “Kutegua kitendawili” ni msemo wa kawaida na sahihi wa Kiswahili.
- source_word: וַיִּחַר אַפּוֹ
  choice: Hasira yake ikawaka
  rationale: Tafsiri hii inahifadhi sitiari ya Kiebrania ya hasira kuwaka na pia ni Kiswahili cha kawaida.
- source_word: וַיַּעַל בֵּית אָבִיהוּ
  choice: akapanda kwenda nyumbani kwa baba yake
  rationale: “Akapanda” linahifadhi maana ya עלה, na “nyumbani kwa baba yake” ni namna ya asili ya kueleza בֵּית אָבִיהוּ kwa Kiswahili.
theological_decisions:
- issue: Lugha ya kuwezeshwa na Roho wa Mungu
  choice: Roho ya Yahwe ikamjia kwa nguvu
  alternative: Roho ya Yahwe ikamshukia kwa nguvu
  rationale: Tafsiri inaonyesha tendo la moja kwa moja na lenye nguvu la Roho bila kuongeza kwamba Mungu aliidhinisha kimaadili kila tendo lililofuata. Hivyo mvutano wa simulizi unabaki kama ulivyo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo wa simulizi umetiririshwa kwa viunganishi vya kawaida, huku marudio muhimu na sitiari ya Kiebrania yakihifadhiwa.
