review_pass:
  verdict: revise
  source_fidelity: The draft faithfully conveys the Spirit's sudden empowering action, Samson's violent tearing of the lion, his lack of any implement in hand, and his concealment from both parents. However, “akamshukia” primarily suggests descending upon someone; the Hebrew צלח על is better represented here by “akamjia kwa nguvu,” preserving the forceful onset without introducing a directional nuance.
  naturalness: The narrative is clear and appropriately dignified in Standard East African Swahili. “Akamjia kwa nguvu” is more idiomatic and semantically precise than “akamshukia kwa nguvu.” “Jambo alilokuwa amefanya” is understandable, but “alichofanya” is more direct and natural for the Hebrew object clause.
  terminology: “Roho wa Yahweh” correctly renders רוח יהוה in context and consistently preserves the divine name as specified. “Mbuzi mchanga” is clear modern Swahili for גדי. The masculine object marker in “akamrarua” appropriately follows the contextual referent, the lion.
  issues:
  - severity: medium
    issue: “akamshukia kwa nguvu” adds a downward-motion nuance.
    rationale: The Hebrew idiom ותצלח עליו describes the Spirit coming upon Samson with powerful effect, not specifically descending on him. “Akamjia kwa nguvu” is the more accurate Swahili equivalent.
  - severity: low
    issue: “jambo alilokuwa amefanya” is more periphrastic than needed.
    rationale: The Hebrew simply says “what he did.” “Alichofanya” is natural, preserves the past action in the narrative, and avoids an unnecessarily extended relative construction.
  revised_text: Ndipo Roho wa Yahweh akamjia kwa nguvu[a], naye akamrarua kama mtu anavyomrarua mbuzi mchanga[b], ingawa hakuwa na kitu chochote mkononi mwake. Lakini hakumwambia baba yake wala mama yake alichofanya.
  revised_footnotes:
