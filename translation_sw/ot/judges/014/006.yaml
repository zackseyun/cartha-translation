id: JDG.14.6
reference: Judges 14:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַֽ/יְשַׁסְּעֵ֨/הוּ֙ כְּ/שַׁסַּ֣ע הַ/גְּדִ֔י וּ/מְא֖וּמָה אֵ֣ין בְּ/יָד֑/וֹ וְ/לֹ֤א הִגִּיד֙ לְ/אָבִ֣י/ו וּ/לְ/אִמּ֔/וֹ אֵ֖ת אֲשֶׁ֥ר עָשָֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/006.yaml
  text: Then the Spirit of Yahweh rushed upon him[a], and he tore it apart as one tears apart a young goat, though he had nothing in his hand[b]. But he did not tell his father or his mother what he had done.
translation:
  language: sw
  text: Ndipo Roho wa Yahweh akamjia kwa nguvu[a], naye akamrarua kama mtu anavyomrarua mbuzi mchanga[b], ingawa hakuwa na kitu chochote mkononi mwake. Lakini hakumwambia baba yake wala mama yake alichofanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamjia kwa nguvu nyingi.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kama kurarua mwana-mbuzi,” yaani mbuzi mchanga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו
  choice: akamshukia kwa nguvu
  rationale: Kitenzi צלח pamoja na עַל kinaonyesha Roho akimjia Samsoni kwa ghafla na kumpa nguvu. Kauli hii ni ya kawaida katika Kiswahili na inadumisha wazo la ujio wenye nguvu bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: רוּחַ יְהוָה
  choice: Roho wa Yahweh
  rationale: רוּחַ hapa ni Roho wa Mungu anayempa Samsoni nguvu, si upepo wala hali ya moyo.
- source_word: וַיְשַׁסְּעֵהוּ
  choice: akamrarua
  rationale: שׁסע humaanisha kurarua au kupasua kwa nguvu. Kiambishi cha yambwa -m- kinafaa kwa simba aliye hai anayerejelewa katika muktadha, huku tafsiri ikiepuka kurudia jina lisilomo katika mstari huu.
- source_word: כְּשַׁסַּע הַגְּדִי
  choice: kama mtu anavyomrarua mbuzi mchanga
  rationale: Muundo huu unahifadhi mlinganisho wa Kiebrania kuhusu namna au urahisi wa kumrarua mwana-mbuzi, na “mbuzi mchanga” inaeleweka wazi katika Kiswahili cha sasa.
- source_word: וּמְאוּמָה אֵין בְּיָדוֹ
  choice: ingawa hakuwa na kitu chochote mkononi
  rationale: '“Ingawa” huonyesha vizuri nguvu ya kimuktadha ya sentensi: alifanya tendo hilo bila silaha au kifaa mkononi, bila kutaja silaha moja kwa moja kwa kuwa neno hilo halimo katika chanzo.'
- source_word: וְלֹא הִגִּיד לְאָבִיו וּלְאִמּוֹ
  choice: Lakini hakumwambia baba yake wala mama yake
  rationale: “Wala” baada ya ukanushaji huonyesha kwa kawaida kwamba hakumwambia mzazi yeyote. “Lakini” huleta utofautishaji wa kiusimulizi baada ya tendo hilo la ajabu.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: jambo alilokuwa amefanya
  rationale: Kauli hii inaweka wazi kwamba tendo lilitangulia kutowaambia wazazi wake, huku ikidumisha maana ya Kiebrania.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu fulani.
- issue: Utambulisho wa רוּחַ katika muktadha
  choice: Roho wa Yahweh
  alternative: upepo wa Yahweh
  rationale: Kitendo cha Roho kumshukia Samsoni na nguvu inayofuata vinaonyesha kwamba hapa רוּחַ ni Roho wa Mungu anayemwezesha, si upepo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayosomeka kwa urahisi. Muundo wa simulizi umehifadhiwa, na “Yahweh” limetumiwa kwa jina la Mungu. Alama zote za tanbihi zimewekwa katika matini kuu.
