    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kama kurarua mwana-mbuzi,” yaani mbuzi mchanga.'
    reason: lexical_alternative
  revision_rationale: The revision replaces a potentially misleading directional verb with an idiomatic rendering of the Hebrew's sudden, powerful empowerment. It also makes the final object clause more concise and natural, while retaining the source meaning, narrative register, divine-name policy, and both footnote anchors.
