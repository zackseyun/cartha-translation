base_translation:
  language: en
  yaml_path: translation/ot/judges/014/003.yaml
  text: But his father and his mother said to him[a], “Is there not a woman among the daughters of your brothers or among all my people, that you are going to take a wife from the uncircumcised Philistines?” But Samson said to his father, “Get her for me[b], for she is right in my eyes.”
translation:
  language: sw
  text: Lakini baba yake na mama yake wakamwambia, “Je, hakuna mwanamke miongoni mwa binti za ndugu zako[a], au miongoni mwa watu wangu wote, hata uende kujitwalia mke miongoni mwa Wafilisti wasiotahiriwa?” Lakini Samsoni akamwambia baba yake, “Mchukulie huyo kwa ajili yangu, kwa maana yeye ni sawa machoni pangu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli “binti za ndugu zako” huenda inamaanisha kwa upana wanawake wa ukoo au wa jamaa ya Samsoni, si lazima binti halisi za kaka au ndugu zake wa karibu tu.
    reason: cultural_note
  - marker: b
    text: Au, “ananipendeza” au “anaonekana kunifaa.” Nahau ya Kiebrania inaweza kuonyesha kumpendeza mtu au kuonekana kuwa anafaa; maandishi makuu yanadumisha kauli inayounganika na mada inayojirudia katika Waamuzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֵין
  choice: Je, hakuna
  rationale: Huwasilisha swali la balagha lenye ukanushi kwa Kiswahili cha kawaida na wazi.
- source_word: בִּבְנוֹת אַחֶיךָ
  choice: miongoni mwa binti za ndugu zako
  rationale: Hudumisha lugha ya kifamilia ya Kiebrania; ‘ndugu’ inaweza kueleweka kwa upana kama watu wa ukoo, jambo linalofafanuliwa katika tanbihi.
- source_word: וּבְכָל עַמִּי
  choice: au miongoni mwa watu wangu wote
  rationale: Huhifadhi kiambishi cha nafsi ya kwanza umoja, ‘watu wangu,’ badala ya kukibadili kuwa ‘watu wetu.’
- source_word: הוֹלֵךְ לָקַחַת אִשָּׁה
  choice: uende kujitwalia mke
  rationale: Huwakilisha mwendo na kitendo cha ‘kumchukua’ mwanamke kuwa mke bila kuficha muktadha wa ndoa.
- source_word: מִפְּלִשְׁתִּים הָעֲרֵלִים
  choice: kutoka kwa Wafilisti hao wasiotahiriwa
  rationale: Hudumisha jina la watu na sifa yenye uzito wa agano ya kutotahiriwa, bila kuipunguza makali.
- source_word: אוֹתָהּ קַח לִי
  choice: Nichukulie huyo awe mke wangu
  rationale: Ni ombi la moja kwa moja na la kawaida katika muktadha wa baba kushughulikia ndoa; ‘awe mke wangu’ huweka wazi kusudi lililomo katika muktadha.
- source_word: יָשְׁרָה בְעֵינַי
  choice: yeye ni sawa machoni pangu
  rationale: Huhifadhi taswira ya ‘machoni pangu’ na neno la tathmini ‘sawa,’ hivyo kudumisha mwangwi wa mada inayojirudia katika kitabu cha Waamuzi.
theological_decisions:
- issue: Mwangwi wa יָשְׁרָה בְעֵינַי katika kitabu cha Waamuzi
  choice: yeye ni sawa machoni pangu
  alternative: ananipendeza; anaonekana kunifaa
  rationale: Kauli hiyo inaweza kueleza kuvutiwa au kuona mtu anafaa, lakini tafsiri iliyochaguliwa inadumisha mvutano wa maana na uhusiano wake na kauli inayojirudia kuhusu kufanya yaliyo sawa machoni pa mtu mwenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mazungumzo ni wa kawaida kwa wasomaji wa leo, huku lugha muhimu ya kifamilia, tohara, na nahau ya ‘machoni pangu’ ikihifadhiwa. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyofafanuliwa.
