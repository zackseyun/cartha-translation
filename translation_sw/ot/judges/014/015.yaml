translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi ‘Ikawa’ umetumiwa kwa sauti ya kibiblia inayofahamika, huku vitisho na maswali ya kulaumu yakitolewa kwa lugha ya moja kwa moja. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika, si baada ya ‘mke wa Samsoni’ kama ilivyokuwa katika tabaka la Kiingereza.
