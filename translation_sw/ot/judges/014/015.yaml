base_translation:
  language: en
  yaml_path: translation/ot/judges/014/015.yaml
  text: And on the seventh day they said to Samson’s wife[a], “Entice your husband so that he may tell us the riddle, lest we burn you and your father’s household with fire[b]. Did you invite us to dispossess us? Is that not so?”
translation:
  language: sw
  text: Ikawa siku ya saba, wakamwambia mke wa Samsoni, “Mshawishi mume wako atuambie kitendawili; la sivyo, tutawachoma kwa moto wewe na nyumba ya baba yako.[a] Je, mlitualika ili mtupokonye mali yetu?[b] Sivyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa nyumba ya baba yako” au “familia ya baba yako.” Neno la Kiebrania linalotafsiriwa “nyumba” linaweza kumaanisha jengo lenyewe au, kwa upana zaidi, watu wa nyumbani au familia.
    reason: lexical_alternative
  - marker: b
    text: Au “ili mtunyang’anye tulivyo navyo” au “ili mtufukarisha.” Kitenzi cha Kiebrania kinaweza kumaanisha kutwaa umiliki au kumnyang’anya mtu mali yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתִּי
  choice: Mshawishi
  rationale: Kitenzi hiki katika Piel kina maana ya kushawishi kwa hila au kwa kusudi la kumvuta mtu afanye jambo. ‘Mshawishi’ ni Kiswahili cha kawaida kinachohifadhi uzito huo bila kuingiza maana ya udanganyifu moja kwa moja.
- source_word: אִישֵׁךְ
  choice: mume wako
  rationale: Katika muktadha huu אִישׁ humaanisha mume wa mwanamke, na ‘mume wako’ ndiyo kauli ya kawaida na sahihi.
- source_word: וְיַגֶּד לָנוּ
  choice: atuambie
  rationale: 'Muundo huu unaonyesha kusudi baada ya amri: amshawishi ili awaambie. ‘Atuambie’ ni usemi wa asili na mfupi unaowasilisha hilo.'
- source_word: הַחִידָה
  choice: kitendawili
  rationale: חִידָה ni fumbo au kitendawili; katika shindano hili ‘kitendawili’ ndilo neno la kawaida zaidi.
- source_word: פֶּן נִשְׂרֹף אֹתָךְ וְאֶת־בֵּית אָבִיךְ בָּאֵשׁ
  choice: la sivyo, tutakuchoma moto wewe pamoja na nyumba ya baba yako
  rationale: פֶּן hapa inaanzisha tishio la matokeo yasiyotakiwa. ‘La sivyo’ huwasilisha tishio hilo kwa Kiswahili cha sasa, huku ‘kuchoma moto’ kikihifadhi picha iliyo wazi katika Kiebrania.
- source_word: בֵּית אָבִיךְ
  choice: nyumba ya baba yako
  rationale: ‘Nyumba’ huhifadhi picha halisi ya kuchomwa moto na pia, kama Kiebrania, inaweza kueleweka kwa upana kuwa watu wa nyumbani au familia; tanbihi inaweka wazi uwezekano huo.
- source_word: הֲלְיָרְשֵׁנוּ
  choice: ili mtupokonye mali yetu
  rationale: ירשׁ hapa inaweza kumaanisha kutwaa kilicho cha mwingine au kumnyang’anya umiliki. Kutaja ‘mali yetu’ kunaifanya lawama hiyo ieleweke katika muktadha wa dau la karamu bila kuondoa maana ya kupokonywa.
- source_word: קְרָאתֶם לָנוּ
  choice: mlitualika
  rationale: Katika muktadha wa karamu, קרא pamoja na ל ina maana ya kualika. Wingi wa kitenzi umehifadhiwa kama ulivyo katika Kiebrania.
- source_word: הֲלֹא
  choice: Sivyo?
  rationale: Hili ni swali la kusisitiza linalotarajia kukubaliwa. ‘Sivyo?’ huhifadhi nguvu yake ya kulaumu kwa Kiswahili cha kawaida.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: siku ya saba
  rationale: Huu ni uhamishaji wa moja kwa moja, wa kawaida na unaoeleweka wa usemi wa wakati.
