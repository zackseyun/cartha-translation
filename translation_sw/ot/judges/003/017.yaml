  text: וַ/יַּקְרֵב֙ אֶת הַ/מִּנְחָ֔ה לְ/עֶגְל֖וֹן מֶ֣לֶךְ מוֹאָ֑ב וְ/עֶגְל֕וֹן אִ֥ישׁ בָּרִ֖יא מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/017.yaml
  text: He presented the tribute to Eglon king of Moab[a]. Now Eglon was a very fat man.
translation:
  language: sw
  text: Akamkabidhi Egloni, mfalme wa Moabu, ushuru[a]. Egloni alikuwa mtu mnene sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “zawadi” au “tunu.” Neno la Kiebrania minḥah linaweza kumaanisha sadaka au zawadi, lakini hapa huenda linamaanisha ushuru ambao watu waliotiishwa walimlipa mtawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Akamkabidhi
  rationale: Hifili ya קרב hapa ina maana ya kuleta na kutoa kitu mbele ya mwenye mamlaka. Katika Kiswahili, “akamkabidhi” linaeleza kwa kawaida tendo la kumpa mfalme malipo hayo rasmi.
- source_word: הַמִּנְחָה
  choice: ushuru
  rationale: Katika muktadha wa Israeli kutiishwa na Moabu, מִנְחָה inaelekea kuwa malipo ya lazima yaliyotolewa kwa mtawala, hivyo “ushuru” linafaa kuliko “zawadi” au “sadaka.”
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: Egloni, mfalme wa Moabu
  rationale: Jina limetoholewa kwa mtindo wa kawaida wa Biblia za Kiswahili, na cheo kimewekwa kama ufafanuzi wa jina.
- source_word: אִישׁ
  choice: mtu
  rationale: Neno linamtaja Egloni mwenyewe; “mtu” ni la kawaida na la heshima katika Kiswahili, huku jinsia yake ikionekana tayari kupitia jina na upatanisho wa kisarufi.
- source_word: בָּרִיא
  choice: mnene
  rationale: Katika muktadha huu neno linaeleza unene wa mwili, jambo linalohusika pia na matukio yanayofuata. “Mnene” ni la moja kwa moja na la kawaida.
- source_word: מְאֹד
  choice: sana
  rationale: Hiki ndicho kielezi cha kawaida cha Kiswahili kinachowasilisha nguvu ya מְאֹד.
- source_word: וְעֶגְלוֹן
  choice: Egloni alikuwa
  rationale: Waw inaanzisha maelezo ya pembeni kuhusu Egloni. Sentensi mpya yenye “alikuwa” ni ya asili katika Kiswahili bila kuongeza kiunganishi kisichohitajika.
