translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, wazi na yenye hadhi. “Ushuru” huhifadhi muktadha wa kisiasa wa malipo kwa mfalme mshindi, huku tanbihi ikitaja maana nyingine halali za neno la Kiebrania.
