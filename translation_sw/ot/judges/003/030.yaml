  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תִּכָּנַ֤ע מוֹאָב֙ בַּ/יּ֣וֹם הַ/ה֔וּא תַּ֖חַת יַ֣ד יִשְׂרָאֵ֑ל וַ/תִּשְׁקֹ֥ט הָ/אָ֖רֶץ שְׁמוֹנִ֥ים שָׁנָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/030.yaml
  text: So Moab was subdued under the hand of Israel that day[c][b][a], and the land had rest for eighty years.
translation:
  language: sw
  text: Basi siku hiyo Moabu ikatiishwa chini ya mkono wa Israeli,[a] nayo nchi ikapata utulivu kwa miaka themanini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chini ya mkono wa Israeli” ni nahau inayomaanisha chini ya nguvu au mamlaka ya Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּכָּנַע
  choice: ikatiishwa
  rationale: Kauli ya kutendwa ya kitenzi inaonyesha kwamba Moabu ilishindwa na kuwekwa chini ya mamlaka; “ikatiishwa” huhifadhi maana ya kijeshi na kisiasa bila kudokeza kuangamizwa kabisa.
- source_word: מוֹאָב
  choice: Moabu
  rationale: Umbo la kawaida la jina la taifa hili katika Kiswahili cha Biblia.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Usemi wa kawaida wa wakati unaohifadhi nguvu ya kiashiria cha Kiebrania na unasomeka kwa kawaida katika Kiswahili.
- source_word: תַּחַת יַד יִשְׂרָאֵל
  choice: chini ya mkono wa Israeli
  rationale: Tafsiri hii huhifadhi taswira ya nahau ya Kiebrania, inayomaanisha kuwa chini ya nguvu au mamlaka ya Israeli; tanbihi inaifafanua.
- source_word: וַתִּשְׁקֹט
  choice: ikapata utulivu
  rationale: Katika muktadha wa Waamuzi, kitenzi kinaeleza kukoma kwa vita au misukosuko. “Ikapata utulivu” ni Kiswahili cha kawaida na hakizidishi maana kuwa amani kamili.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Hurejelea nchi au eneo kwa ujumla katika simulizi, bila kuongeza utambulisho ambao haujatajwa wazi hapa.
- source_word: שְׁמוֹנִים שָׁנָה
  choice: kwa miaka themanini
  rationale: “Kwa” huwasilisha kwa kawaida muda unaoendelea katika Kiswahili.
theological_decisions:
- issue: Aina ya utawala wa Israeli juu ya Moabu
  choice: kutiishwa kijeshi na kisiasa, kukielezwa kwa nahau ya kibiblia “chini ya mkono wa Israeli”
  alternative: kufedheheshwa kihisia tu au kuangamizwa kabisa
  rationale: Muktadha unaonyesha Moabu kuwekwa chini ya mamlaka ya Israeli na nchi kupata utulivu. Tafsiri haipunguzi tendo kuwa unyenyekevu wa ndani wala hailiongezi kuwa maangamizi kamili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na wenye ladha ya simulizi la Biblia; nahau ya asili imehifadhiwa kwa sababu inaeleweka kwa msaada wa tanbihi.
