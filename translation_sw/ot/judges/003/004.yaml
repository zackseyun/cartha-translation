base_translation:
  language: en
  yaml_path: translation/ot/judges/003/004.yaml
  text: And they were there to test Israel[a], to know whether they would listen to the commandments of Yahweh[c][b], which he commanded their fathers through Moses.
translation:
  language: sw
  text: Mataifa hayo yalikuwepo ili kuwajaribu Waisraeli kupitia kwao, kujua kama wangetii amri za Yahweh, alizowaamuru baba zao kupitia Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Mataifa hayo yaliachwa
  rationale: Kwa kuzingatia muktadha wa mstari uliotangulia, kiwakilishi cha wingi kinarejelea mataifa yaliyobaki. Kiswahili hutaja nomino hiyo wazi ili rejeo lisipotee; ‘yaliachwa’ huonyesha kuendelea kuwapo kwao kwa kusudi lililotajwa.
- source_word: לְנַסּוֹת בָּם אֶת־יִשְׂרָאֵל
  choice: ili kupitia kwao Israeli ijaribiwe
  rationale: ‘Kujaribu’ huwasilisha maana ya kupima kwa jaribio bila kudokeza moja kwa moja kushawishi kufanya uovu. ‘Kupitia kwao’ huhifadhi wazi בָּם, yaani mataifa hayo yalikuwa njia ya kuijaribu Israeli.
- source_word: לָדַעַת
  choice: kujua
  rationale: 'Tafsiri ya moja kwa moja inayohifadhi kusudi la jaribio: kuthibitisha kama Israeli ingetii.'
- source_word: הֲיִשְׁמְעוּ
  choice: kama wangetii
  rationale: שׁמע ikitumiwa pamoja na amri humaanisha kusikia kwa kuitikia, yaani kutii. ‘Wangetii’ ni Kiswahili cha kawaida na wazi katika muktadha huu.
- source_word: מִצְוֺת
  choice: amri
  rationale: ‘Amri’ ni neno la kawaida na lenye heshima kwa maagizo ya agano yaliyotolewa na Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: אֲשֶׁר צִוָּה
  choice: ambazo aliwaamuru
  rationale: Kishazi cha uhusiano kinahusishwa na ‘amri’; muundo wa Kiswahili huonyesha kwamba yaliyowaamuru babu ni mambo yaliyomo katika amri hizo.
- source_word: אֲבוֹתָם
  choice: babu zao
  rationale: Katika muktadha huu אבותם hurejelea waliowatangulia Israeli. ‘Babu zao’ ni usemi wa kawaida wa Kiswahili kwa mababa wa zamani au wahenga, bila kudokeza baba wa karibu tu.
- source_word: בְּיַד מֹשֶׁה
  choice: kupitia Musa
  rationale: Nahau ‘kwa mkono wa Musa’ inaonyesha uwakala au upatanishi; ‘kupitia Musa’ hutoa maana hiyo kwa Kiswahili cha sasa.
theological_decisions:
- issue: Maana ya lugha ya kujaribiwa
  choice: Mataifa yaliyobaki yalikuwa njia ya kuijaribu Israeli kuhusu utiifu wake kwa amri za Yahweh.
  alternative: Kulieleza jaribio kama uchunguzi wa kihistoria tu usio na kusudi la kitheolojia.
  rationale: Vitenzi-jina לְנַסּוֹת na לָדַעַת vinaonyesha kusudi. Tafsiri inadumisha mvutano wa andiko bila kugeuza ‘kujaribu’ kuwa kushawishi kufanya uovu wala kueleza zaidi ya maandishi.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: ‘Yahweh’ huhifadhi jina binafsi lililo katika maandishi ya Kiebrania badala ya kuliwakilisha kwa cheo.
- issue: Yule anayejua matokeo ya jaribio
  choice: Kitenzi ‘kujua’ kimeachwa bila kumtaja wazi anayepata kujua.
  alternative: Kusema wazi kwamba Mungu alitaka kujua au kwamba Israeli wenyewe wangepata kujua.
  rationale: Kiebrania kina לָדַעַת bila kutaja wazi mtendaji wa kitenzi-jina. Tafsiri haifungi utata huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wa asili bila kupoteza kipengele cha ‘kupitia kwao’; hakuna alama za tanbihi kwa kuwa maelezo muhimu yameingizwa kwa uwazi katika matini.
