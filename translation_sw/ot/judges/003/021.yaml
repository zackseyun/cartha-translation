  text: Then Ehud reached with his left hand[a], took the sword from his right thigh[b], and thrust it into his belly.
translation:
  language: sw
  text: Ndipo Ehudi akanyoosha mkono wake wa kushoto, akauchukua upanga[a] kutoka kwenye paja lake la kulia, akauchoma tumboni mwa Egloni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “upanga”; katika muktadha huu huenda ulikuwa upanga mfupi au jambia.'
    reason: lexical_alternative
  - marker: b
    text: Au “katika sehemu ya tumbo la Egloni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akaunyosha
  rationale: Katika muktadha wa tendo la mwili, kitenzi hiki kina maana ya kunyoosha mkono; usemi huu ni wa kawaida na unaendeleza mfululizo wa matendo.
- source_word: יַד שְׂמֹאלוֹ
  choice: mkono wake wa kushoto
  rationale: Neno la Kiebrania linataja mkono waziwazi, na simulizi linasisitiza matumizi ya mkono wa kushoto.
- source_word: וַיִּקַּח
  choice: akauchukua
  rationale: Hii ni tafsiri ya moja kwa moja ya tendo la kuuchukua upanga katika mfululizo wa simulizi.
- source_word: הַחֶרֶב
  choice: upanga
  rationale: Hili ndilo neno la kawaida la Kiebrania kwa upanga; ingawa silaha hiyo huenda ilikuwa fupi kama jambia, tafsiri pana zaidi inahifadhi maana ya msingi.
- source_word: מֵעַל יֶרֶךְ יְמִינוֹ
  choice: kutoka juu ya paja lake la kulia
  rationale: Tafsiri hii inahifadhi mahali halisi ambapo silaha ilikuwa imefungwa, yaani juu ya paja la kulia.
- source_word: וַיִּתְקָעֶהָ
  choice: akauchoma
  rationale: Kitenzi kinaonyesha kuingiza silaha kwa nguvu; 'akauchoma' ni usemi wa Kiswahili wa kawaida na kiambishi cha yambwa kinarejelea upanga.
- source_word: בְּבִטְנוֹ
  choice: tumboni mwake
  rationale: Neno hilo humaanisha tumbo au sehemu ya tumbo; 'tumboni mwake' ni ya moja kwa moja, hai, na ya kawaida katika simulizi.
