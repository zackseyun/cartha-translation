base_translation:
  language: en
  yaml_path: translation/ot/judges/003/029.yaml
  text: And at that time they struck down about ten thousand men of Moab[a], every stout man and every man of valor[c][b]; not a man escaped.
translation:
  language: sw
  text: Wakati huo wakawapiga wanaume wa Moabu wapatao elfu kumi[a], wote waliokuwa wanene na mashujaa[b][c]; hakuna hata mmoja aliyefaulu kuponyoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “Moabu”; “wanaume wa Moabu” limewekwa wazi kwa sababu maneno yanayofuata yanataja wanaume wapatao elfu kumi.
    reason: lexical_alternative
  - marker: b
    text: Au “wote waliokuwa wenye nguvu.” Kiebrania ni “kila mnene”; katika muktadha huu huenda kinawaeleza watu walionawiri au wenye nguvu, si ukubwa wa mwili tu.
    reason: lexical_alternative
  - marker: c
    text: Au “wanaume wote hodari” au “wanaume wote wenye uwezo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: wakawaua
  rationale: Katika muktadha wa vita, kitenzi נכה kinaonyesha kuwapiga hadi kuwaua; Kiswahili cha kawaida ‘wakawaua’ kinaweka wazi matokeo bila lugha isiyo ya asili.
- source_word: אֶת מוֹאָב
  choice: wanaume wa Moabu
  rationale: Kiebrania kinasema kihalisi ‘Moabu,’ lakini kirai kinachofuata kinahesabu wanaume wapatao elfu kumi; tafsiri hii inaweka wazi rejeo bila kubadili maana.
- source_word: בָּעֵת הַהִיא
  choice: Wakati huo
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili unaolingana kwa karibu na usemi wa wakati katika Kiebrania.
- source_word: כַּעֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: wanaume ... wapatao elfu kumi
  rationale: Kiambishi כ־ hapa kinaonyesha ukadiriaji; ‘wapatao’ huwasilisha maana hiyo kwa Kiswahili fasaha.
- source_word: כָּל שָׁמֵן
  choice: wote waliokuwa wanene
  rationale: שָׁמֵן maana yake ya moja kwa moja ni ‘mnene.’ Tafsiri inahifadhi taswira ya chanzo na kuweka tanbihi kuhusu uwezekano wa kumaanisha watu walionawiri au wenye nguvu.
- source_word: וְכָל אִישׁ חָיִל
  choice: na mashujaa
  rationale: Katika mazingira ya kijeshi, אִישׁ חַיִל humaanisha mtu hodari, mwenye uwezo au shujaa; ‘mashujaa’ ni fupi, ya asili, na inafaa muktadha.
- source_word: וְלֹא נִמְלַט אִישׁ
  choice: hakuna hata mmoja aliyeokoka
  rationale: Usemi huu huhimiza ukamilifu wa kushindwa kwao; ‘hata mmoja’ huhifadhi mkazo wa Kiebrania, huku ‘aliyeokoka’ hapa ikimaanisha kuponyoka katika mauaji.
