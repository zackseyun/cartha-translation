base_translation:
  language: en
  yaml_path: translation/ot/judges/003/013.yaml
  text: He gathered to himself the Ammonites and Amalek[a], and he went and struck Israel[b], and they took possession of the City of Palms.
translation:
  language: sw
  text: Aliwakusanya Waamoni na Waamaleki[a] kwake; kisha akaenda akaipiga Israeli, nao wakautwaa Mji wa Mitende.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Amaleki,” jina linalotumiwa kwa maana ya watu wa Amaleki kwa ujumla.'
    reason: lexical_alternative
  - marker: b
    text: Huenda huu ni Yeriko; linganisha Kumbukumbu la Torati 34:3 na 2 Mambo ya Nyakati 28:15.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֶּאֱסֹף אֵלָיו
  choice: Akawakusanya ... wajiunge naye
  rationale: Muundo huu unaonyesha kwamba aliwakusanya wawe upande wake, yaani wawe washirika chini ya uongozi wake, huku ukisomeka kwa Kiswahili cha kawaida.
- source_word: בְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Hili ndilo jina la kawaida la watu wa Amoni katika Kiswahili, badala ya tafsiri ya neno kwa neno ‘wana wa Amoni.’
- source_word: עֲמָלֵק
  choice: Waamaleki
  rationale: Kiebrania kinatumia jina ‘Amaleki’ kwa maana ya jamii nzima; Kiswahili cha kawaida hutumia ‘Waamaleki’ kwa watu hao.
- source_word: וַיֵּלֶךְ
  choice: kisha akaenda
  rationale: Kitenzi ni cha kawaida chenye maana ya kwenda; ‘akaenda’ huhifadhi mfululizo wa simulizi bila kuongeza wazo la kijeshi lisilotajwa wazi na kitenzi chenyewe.
- source_word: וַיַּךְ אֶת יִשְׂרָאֵל
  choice: akaipiga Israeli
  rationale: ‘Kuipiga’ huhifadhi maana pana ya kijeshi ya נכה bila kuifasiri moja kwa moja kuwa ‘kuishinda’ au ‘kuishambulia.’
- source_word: וַיִּירְשׁוּ
  choice: nao wakautwaa
  rationale: Kitenzi kiko katika wingi, kwa hiyo ‘nao’ kinawahusu mfalme pamoja na majeshi washirika. ‘Kutwaa’ huonyesha kuchukua na kumiliki mahali kwa ushindi.
- source_word: עִיר הַתְּמָרִים
  choice: Mji wa Mitende
  rationale: Tafsiri hii huhifadhi jina la kimaelezo na taswira ya Kiebrania bila kulibadilisha moja kwa moja kuwa Yeriko.
theological_decisions:
- issue: Utambulisho wa עִיר הַתְּמָרִים
  choice: Mji wa Mitende katika matini kuu
  alternative: Yeriko
  rationale: Kiebrania hakitumii jina Yeriko hapa bali jina la kimaelezo. Matini kuu inalihifadhi, na utambulisho unaowezekana unaelezwa katika tanbihi ili kutatua jambo ambalo chanzo hakulisemi moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umewekwa wazi bila kuondoa urudiaji wa vitenzi vya Kiebrania. ‘Akaipiga Israeli’ huhifadhi upana wa maana ya chanzo, na ‘nao wakautwaa’ huonyesha kwa usahihi mabadiliko ya kiima kutoka umoja kwenda wingi.
