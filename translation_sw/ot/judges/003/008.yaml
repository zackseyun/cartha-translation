  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יִּמְכְּרֵ֗/ם בְּ/יַד֙ כּוּשַׁ֣ן רִשְׁעָתַ֔יִם מֶ֖לֶךְ אֲרַ֣ם נַהֲרָ֑יִם וַ/יַּעַבְד֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת כּוּשַׁ֥ן רִשְׁעָתַ֖יִם שְׁמֹנֶ֥ה שָׁנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/008.yaml
  text: So the anger of Yahweh burned against Israel[a], and he sold them into the hand of Cushan-rishathaim king of Aram-naharaim[b]. And the sons of Israel served Cushan-rishathaim eight years.
translation:
  language: sw
  text: Basi hasira ya Yahwe ikawaka dhidi ya Israeli, naye akawauza mikononi mwa Kushan-Rishathaimu, mfalme wa Aramu-Naharaimu.[a] Wana wa Israeli[b] wakamtumikia Kushan-Rishathaimu kwa miaka minane.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mesopotamia”; Kiebrania, “Aramu-Naharaimu,” ambalo kwa jadi limeeleweka kuwa “Aramu ya Mito Miwili.”
    reason: alternative_reading
  - marker: b
    text: “Wana wa Israeli” ni usemi wa moja kwa moja wa Kiebrania; tafsiri nyingi husema “Waisraeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: hasira ... ikawaka
  rationale: Inahifadhi taswira ya nahau ya Kiebrania ya hasira ‘kuwaka,’ huku ikiwa Kiswahili cha kawaida na chenye kueleweka.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uhawilishaji unaotumika kwa jina binafsi la Mungu, badala ya kulibadili kuwa cheo.
- source_word: וַיִּמְכְּרֵם
  choice: akawauza
  rationale: Kitenzi מכר kwa kawaida humaanisha ‘kuuza.’ Tafsiri hii inadumisha sitiari yenye nguvu ya hukumu, badala ya kuilegeza kuwa ‘akawatia chini ya mamlaka.’
- source_word: בְּיַד
  choice: mikononi mwa
  rationale: Nahau hii huonyesha mamlaka au udhibiti. Kiswahili cha wingi ‘mikononi mwa’ kinadumisha taswira ya mkono kwa namna ya asili.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: Kushan-Rishathaimu
  rationale: Jina limehawilishwa kwa tahajia inayosomeka kwa urahisi katika Kiswahili; kistari kinaonyesha kuwa ni jina moja lenye sehemu mbili.
- source_word: אֲרַם נַהֲרָיִם
  choice: Aramu-Naharaimu
  rationale: Jina la mahali limehawilishwa badala ya kubadilishwa kimafafanuzi kuwa ‘Mesopotamia’; ufafanuzi wa jadi umetolewa katika tanbihi.
- source_word: וַיַּעַבְדוּ
  choice: wakamtumikia
  rationale: Kitenzi עבד humaanisha ‘kutumikia’; hapa kinadokeza kutiishwa kisiasa bila kuongeza neno kali zaidi kama ‘kuwa watumwa.’
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Inahifadhi kwa karibu usemi wa Kiebrania ‘wana wa Israeli’ na maana yake ya watu wa agano; mbadala wa kimazoea unaelezwa katika tanbihi.
- source_word: שְׁמֹנֶה שָׁנִים
  choice: kwa miaka minane
  rationale: Ni usemi wa kawaida na sahihi wa Kiswahili kwa kipindi hiki.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko lina jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo; ‘Yehova’ hutegemea matamshi ya jadi yasiyoakisi kwa karibu ushahidi wa kawaida wa kiisimu.
- issue: Jinsi ya kutafsiri בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  alternative: Waisraeli
  rationale: Usemi wa asili ni ‘wana wa Israeli.’ Umeachwa katika matini ili kudumisha namna ya Kiebrania ya kuwataja watu wa agano, bila kudai kwamba kundi lilihusu wanaume peke yao.
- issue: Sitiari ya Mungu ‘kuwauza’ Israeli
  choice: akawauza
  alternative: akawatia chini ya mamlaka ya
  rationale: Neno la moja kwa moja linadumisha lugha ya hukumu ya agano na mvutano wake wa kitheolojia, bila kuifafanua kimya kimya kuwa kukabidhi mamlaka tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa simulizi umetumia ‘Basi’ na vitenzi vinavyofuatana kwa ‘-ka-’. Tanbihi zimewekwa kwenye maneno yanayohusika, zikisahihisha kutolingana kwa nafasi za alama katika safu ya mashauriano ya Kiingereza.
