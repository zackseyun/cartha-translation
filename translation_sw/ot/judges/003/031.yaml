base_translation:
  language: en
  yaml_path: translation/ot/judges/003/031.yaml
  text: After him was Shamgar son of Anath[a], and he struck down six hundred Philistines with an ox goad[b]; he too saved Israel.
translation:
  language: sw
  text: Baada yake alikuwako Shamgari mwana wa Anathi; aliwapiga Wafilisti mia sita kwa fimbo ya kuchochea ng’ombe. Yeye pia aliwaokoa Israeli[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliwakomboa Israeli.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwaokoa au kuwakomboa katika muktadha wa vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Baada yake
  rationale: Huhifadhi rejeo la moja kwa moja kwa mwamuzi aliyetangulia bila kuongeza jina lake katika matini.
- source_word: הָיָה
  choice: alikuja
  rationale: Katika mfululizo huu wa simulizi, kitenzi kinamtambulisha mhusika anayefuata. ‘Alikuja’ ni Kiswahili cha kawaida na hakiongezi wazo lenye nguvu zaidi la ‘aliinuka.’
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: Shamgari mwana wa Anathi
  rationale: Majina yameandikwa kwa umbo linalofaa Kiswahili, huku ‘mwana wa’ ikihifadhi muundo wa Kiebrania bila kuamua kama Anathi ni jina la mzazi au sehemu ya lakabu.
- source_word: וַיַּךְ
  choice: aliwaua
  rationale: Katika muktadha huu wa mapigano, נכה inaonyesha kuwapiga kwa mauti. ‘Aliwaua’ ni wazi na ya kawaida zaidi kwa Kiswahili kuliko usemi mrefu wa ‘aliwapiga na kuwaangusha.’
- source_word: פְּלִשְׁתִּים שֵׁשׁ מֵאוֹת אִישׁ
  choice: Wafilisti mia sita
  rationale: Hutoa kwa kawaida idadi na utambulisho wa kundi bila kuongeza neno lisilohitajika la ‘wanaume.’
- source_word: בְּמַלְמַד הַבָּקָר
  choice: kwa mchokoo wa ng’ombe
  rationale: ‘Mchokoo wa ng’ombe’ ni kifaa chenye ncha kilichotumiwa kuwaongoza au kuwasukuma ng’ombe; tanbihi inaeleza kifaa hiki cha kale.
- source_word: וַיֹּשַׁע
  choice: aliwaokoa
  rationale: Kitenzi ישׁע katika kitabu cha Waamuzi humaanisha kuwaokoa au kuwakomboa watu kutoka kwa adui. ‘Aliwaokoa’ ni ya kawaida na huhifadhi dhamira ya ukombozi bila kupanua kiwango chake.
- source_word: גַּם הוּא
  choice: yeye pia
  rationale: Huhifadhi msisitizo wa nyongeza kwamba Shamgari naye alikuwa mwokozi wa Israeli.
- source_word: אֶת־יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa limetafsiriwa moja kwa moja kama yambwa ya kitenzi ‘aliwaokoa.’
theological_decisions:
- issue: Aina na upeo wa wokovu ulioletwa na Shamgari
  choice: yeye pia aliwaokoa Israeli
  alternative: yeye pia aliwakomboa Israeli
  rationale: Matini inamhusisha Shamgari na wokovu halisi wa Israeli lakini haisemi ulikuwa wa muda gani au uliwahusu watu kwa kiwango gani. ‘Aliwaokoa’ huhifadhi mvutano huo bila kuufanya wokovu wa kiroho au wa mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Sentensi mbili zimetumiwa ili kuepuka msururu mzito, na majina ‘Shamgari’ na ‘Anathi’ yamefuata maumbo yanayosomeka kwa kawaida katika Kiswahili.
