  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וַ/יַּעַבְד֥וּ אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/אֲשֵׁרֽוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/007.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and they forgot Yahweh their God and served the Baals and the Asherahs.
translation:
  language: sw
  text: Wanaisraeli[a] wakafanya yaliyokuwa maovu machoni pa Yahwe[b]. Wakamsahau Yahwe, Mungu wao, wakawatumikia Mabaali na Maashera[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “maovu machoni pa Yahwe,” nahau ya kawaida inayomaanisha mambo ambayo Yahwe alihukumu kuwa maovu.
    reason: lexical_alternative
  - marker: c
    text: Au “nguzo za Ashera.” Neno la Kiebrania linaweza kurejelea vitu vya ibada vinavyohusishwa na Ashera au, kwa upana zaidi, ibada ya Ashera.
    reason: alternative_reading
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wanaisraeli
  rationale: Hii ndiyo njia ya kawaida na ya asili katika Kiswahili ya kutaja watu wa Israeli kwa ujumla; tanbihi inahifadhi umbo la moja kwa moja la Kiebrania, ‘wana wa Israeli.’
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: yaliyo maovu machoni pa Yahwe
  rationale: Tafsiri hii inahifadhi nahau ya Kiebrania ya tathmini ya Mungu huku ikitumia Kiswahili cha asili na kinachoeleweka.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika Tetragramatoni linatoholewa badala ya kubadilishwa na cheo kama ‘BWANA.’
- source_word: וַיִּשְׁכְּחוּ
  choice: wakamsahau
  rationale: ‘Kusahau’ huhifadhi maana ya msingi ya kitenzi; katika muktadha wa agano pia inadokeza kutomjali au kumwacha, bila kuingiza tafsiri hiyo moja kwa moja katika matini.
- source_word: אֱלֹהֵיהֶם
  choice: Mungu wao
  rationale: 'Yahwe ndiye anayerejelewa, kwa hiyo maana hapa ni umoja: ‘Mungu wao.’'
- source_word: וַיַּעַבְדוּ
  choice: wakawatumikia
  rationale: ‘Kutumikia’ huhifadhi upana wa maana ya עבד, inayoweza kuhusisha huduma ya kidini, ibada, na kujitiisha.
- source_word: הַבְּעָלִים
  choice: Mabaali
  rationale: Wingi wa Kiebrania umehifadhiwa kwa umbo la Kiswahili linaloonyesha miungu au maumbo ya kienyeji yanayohusishwa na Baali.
- source_word: הָאֲשֵׁרוֹת
  choice: Maashera
  rationale: Umbo hili huhifadhi wingi na kutotimia kwa uhakika ikiwa neno linarejelea miungu ya kike/maumbo yake au vitu vya ibada vinavyohusishwa na Ashera.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Matini ina jina la agano moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kwa cheo.
- issue: Ikiwa הָאֲשֵׁרוֹת itafsiriwe kama vitu maalumu vya ibada au iachwe na upana wake
  choice: Maashera
  alternative: nguzo za Ashera
  rationale: Neno la Kiebrania linaweza kurejelea vitu vya ibada vinavyohusishwa na Ashera au, kwa upana zaidi, maumbo ya ibada ya Ashera. Matini kuu inahifadhi utata huo, na tanbihi inatoa maana nyingine ya kawaida.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wanaisraeli’ ni cha asili zaidi kuliko ‘wana wa Israeli’ katika matini kuu. ‘Machoni pa’ huhifadhi nahau ya chanzo bila kuwa ngumu. Majina ‘Mabaali’ na ‘Maashera’ yameundwa kwa wingi wa Kiswahili ili kuhifadhi wingi wa Kiebrania.
