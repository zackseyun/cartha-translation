base_translation:
  language: en
  yaml_path: translation/ot/judges/003/010.yaml
  text: The Spirit of Yahweh came upon him[a], and he judged Israel. He went out to battle, and Yahweh gave Cushan-rishathaim king of Aram into his hand[b], and his hand prevailed over Cushan-rishathaim.
translation:
  language: sw
  text: Roho wa Yahweh akaja juu yake[a], naye akawahukumu Israeli. Akaenda vitani, na Yahweh akamtia mkononi mwake Kushani-Rishathaimu, mfalme wa Aramu[b]. Mkono wake ukamshinda Kushani-Rishathaimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Roho wa Yahweh alikuwa juu yake.” Nahau ya Kiebrania inaweza kuonyesha hali ya kuwa juu yake, ingawa muktadha wa simulizi unaunga mkono “akaja juu yake.”
    reason: lexical_alternative
  - marker: b
    text: Aramu ni jina la Kiebrania ambalo katika tafsiri za zamani mara nyingi limetafsiriwa “Siria.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַ/תְּהִ֨י עָלָ֥י/ו רֽוּחַ יְהוָה
  choice: Roho wa Yahweh akaja juu yake
  rationale: Muundo היה על pamoja na רוּחַ huonyesha Roho akimjia mtu au kuwa juu yake kwa ajili ya kumwezesha. “Akaja juu yake” ni ya kawaida katika simulizi na inaonyesha mwanzo wa kuwezeshwa huku, bila kuondoa uwezekano wa maana tulivu zaidi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahweh” badala ya kubadilishwa na cheo, ili kuhifadhi jina la kibinafsi lililo katika matini ya Kiebrania.
- source_word: וַ/יִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: akawa mwamuzi wa Israeli
  rationale: Kitenzi שׁפט katika kitabu cha Waamuzi kinahusu kutenda kazi ya mwamuzi, yenye vipengele vya kuongoza na kuokoa. Kiswahili “akawa mwamuzi wa Israeli” ni cha asili zaidi kuliko “akaihukumu Israeli,” ambacho kingeweza kueleweka kama kutoa hukumu dhidi ya taifa.
- source_word: וַ/יֵּצֵא לַ/מִּלְחָמָה
  choice: akaenda vitani
  rationale: Hii ni nahau ya kijeshi. “Akaenda vitani” ni Kiswahili cha kawaida na kinafikisha kitendo cha kutoka kwenda kupigana.
- source_word: וַ/יִּתֵּן יְהוָה בְּ/יָד/וֹ
  choice: Yahweh akamtia mkononi mwake
  rationale: Nahau נתן ביד ina maana ya kumweka adui chini ya mamlaka ya mtu. “Akamtia mkononi mwake” huhifadhi taswira ya Kiebrania na inaeleweka katika Kiswahili.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: Kushan-Rishathaimu
  rationale: Jina hili la pekee limetoholewa badala ya kutafsiriwa. Kiishio cha “-u” kinalifanya litamkike kwa urahisi katika Kiswahili huku muundo ambatani ukihifadhiwa kwa kistari.
- source_word: מֶלֶךְ אֲרָם
  choice: mfalme wa Aramu
  rationale: אֲרָם ni jina la mahali “Aramu.” Limetoholewa moja kwa moja badala ya kutumia “Siria,” ambalo ni jina la baadaye na linaweza kuleta ulinganisho usio sahihi na nchi ya kisasa.
- source_word: וַ/תָּעָז יָד/וֹ עַל
  choice: Mkono wake ukamshinda
  rationale: Nahau hii hueleza mkono kuwa na nguvu au kutawala juu ya mpinzani. “Mkono wake ukamshinda” huhifadhi sitiari ya mkono na kueleza wazi ushindi wake.
theological_decisions:
- issue: Jinsi ya kutafsiri usemi kuhusu Roho wa Mungu
  choice: Roho wa Yahweh akaja juu yake
  alternative: Roho wa Yahweh alikuwa juu yake
  rationale: Muktadha unaonyesha kuwezeshwa kwa Othnieli ili awe mwamuzi na aende vitani. Tafsiri ya “akaja juu yake” inafaa mwendo wa simulizi, huku tanbihi ikihifadhi maana tulivu inayowezekana kisarufi, bila kuingiza ufafanuzi wa kiteolojia wa baadaye.
- issue: Jina la kijiografia אֲרָם
  choice: Aramu
  alternative: Siria
  rationale: “Aramu” linafuata moja kwa moja jina la Kiebrania na huepuka kulisawazisha bila sababu na Siria ya nyakati za baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Viunganishi vya simulizi “aka-” vinatunza mwendo wa mfululizo wa vitenzi vya Kiebrania. Nahau za mkono zimehifadhiwa kwa kuwa zinaeleweka, lakini שׁפט imetafsiriwa kikazi kama “akawa mwamuzi” ili kuepuka dhana finyu ya kutoa hukumu dhidi ya Israeli.
