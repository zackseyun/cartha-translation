  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֵ֤לֶּה הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִנִּ֣יחַ יְהוָ֔ה לְ/נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל אֵ֚ת כָּל אֲשֶׁ֣ר לֹֽא יָדְע֔וּ אֵ֖ת כָּל מִלְחֲמ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/001.yaml
  text: 'These are the nations that Yahweh left to test Israel by them[a], that is, all who had not known any of the wars of Canaan:'
translation:
  language: sw
  text: 'Haya ndiyo mataifa ambayo Yahweh aliyaacha ili awajaribu Israeli kupitia mataifa hayo, yaani, Waisraeli wote ambao hawakuwa wamepata kujua[a] vita vyovyote vya Kanaani:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambao hawakuwa wamepitia vita vyovyote vya Kanaani.”
    reason: Neno יָדַע hapa linaweza kueleza kujua kwa uzoefu, si kuwa na taarifa tu.
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Haya ndiyo
  rationale: Muundo huu unatambulisha orodha mpya huku muktadha ukibeba mwendelezo wa simulizi; Kiswahili hakihitaji kuongeza neno la wakati kama “sasa”.
- source_word: הַ/גּוֹיִם
  choice: mataifa
  rationale: Neno hili linarejelea makundi tofauti ya kikabila na kisiasa yaliyoachwa nchini Kanaani.
- source_word: הִנִּיחַ
  choice: aliyaacha
  rationale: Hifili ya נוח hapa ina maana ya kuyaacha au kuyaruhusu yabaki; “aliyaacha” ni fupi, wazi, na inafaa muktadha.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limewasilishwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: לְ/נַסּוֹת
  choice: ili awajaribu
  rationale: נסה ina maana ya kujaribu au kupima. “Awajaribu” huhifadhi kusudi linalotajwa bila kulifanya kuwa kishawishi cha kutenda dhambi.
- source_word: בָּ/ם
  choice: kwa njia yao
  rationale: Kihusishi chenye kiambishi hapa kinaonyesha mataifa hayo kuwa njia ambayo Israeli angejaribiwa; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israeli
  rationale: Ni yambwa tendwa yenye jina maalumu; limehifadhiwa moja kwa moja.
- source_word: אֵת כָּל אֲשֶׁר לֹא יָדְעוּ
  choice: yaani, Waisraeli wote ambao hawakuwa wamejua
  rationale: Kirai hiki kinafafanua sehemu ya Israeli inayokusudiwa. Kutaja “Waisraeli” huweka rejeo wazi katika Kiswahili bila kubadili maana.
- source_word: יָדְעוּ
  choice: hawakuwa wamejua
  rationale: ידע inaweza kumaanisha kujua kwa uzoefu. Matini kuu huhifadhi kitenzi “kujua,” huku tanbihi ikieleza maana ya uzoefu.
- source_word: אֵת כָּל מִלְחֲמוֹת כְּנָעַן
  choice: vita vyovyote vya Kanaani
  rationale: Chini ya ukanushi, “vita vyovyote” hutoa kwa Kiswahili maana ya kwamba hawakujua hata kimoja cha vita hivyo; “vya Kanaani” huhifadhi uhusiano mpana wa Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni; “Yahweh” huhifadhi jina hilo la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya Mungu kuijaribu Israeli
  choice: ili awajaribu Israeli kwa njia yao
  alternative: ili awapime Israeli kupitia mataifa hayo
  rationale: Tafsiri inadumisha dai la matini kwamba Yahweh aliyaacha mataifa hayo kwa kusudi la kuijaribu Israeli, bila kupunguza au kufafanua zaidi mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kwa njia yao” ni usemi wa kawaida unaohifadhi dhana ya mataifa kuwa chombo cha jaribu. Alama ya koloni mwishoni inaonyesha kwamba sentensi inaendelea katika mstari unaofuata.
