translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na lugha yenye heshima. ‘Kumbe’ limetumiwa kuwasilisha mshangao wa וְהִנֵּה, na nahau ya Kiebrania imefafanuliwa katika tanbihi badala ya kuachwa ikiwa haieleweki katika matini kuu.
