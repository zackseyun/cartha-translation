base_translation:
  language: en
  yaml_path: translation/ot/judges/003/024.yaml
  text: When he had gone out[a], his servants came and looked, and behold, the doors of the upper room were locked. So they said, “Surely he is relieving himself in the cool inner room.”
translation:
  language: sw
  text: Alipokwisha kuondoka, watumishi wake wakaja, wakaangalia, na kumbe milango ya chumba cha juu ilikuwa imefungwa. Wakasema, “Hakika anajisaidia[a] katika chumba cha ndani chenye ubaridi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri halisi, “anaf­unika miguu yake,” nahau ya Kiebrania inayomaanisha kujisaidia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יָצָא
  choice: Alipokwisha kuondoka
  rationale: Kishazi hiki kinarejelea kuondoka kwa Ehudi na kuweka wakati wa kuja kwa watumishi; muundo huu ni wa asili katika Kiswahili na unahifadhi uhusiano wa matukio.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika muktadha wa nyumba ya kifalme, neno hili linaeleweka vyema kuwa watu waliomhudumia mfalme bila kulazimisha hoja kuhusu hadhi yao ya kisheria.
- source_word: וַיִּרְאוּ
  choice: wakaangalia
  rationale: Kitenzi kimsingi ni ‘wakaona,’ lakini hapa kinaonyesha walichunguza hali ya milango; ‘wakaangalia’ linaeleza tendo hilo kwa Kiswahili cha kawaida.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: milango ya chumba cha juu
  rationale: עֲלִיָּה ni chumba kilichokuwa sehemu ya juu ya jengo; tafsiri hii ni wazi na haitoi maelezo ya usanifu yasiyothibitishwa.
- source_word: נְעֻלוֹת
  choice: ilikuwa imefungwa
  rationale: Umbo hili huonyesha milango iliyofungwa au kutiwa komeo. ‘Imefungwa’ ni pana, sahihi, na ya kawaida katika Kiswahili.
- source_word: אַךְ
  choice: Hakika
  rationale: Hapa chembe hii inaonyesha hitimisho au dhana yenye uhakika ya watumishi.
- source_word: מֵסִיךְ ... אֶת רַגְלָיו
  choice: anajisaidia
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kwenda haja. Kiswahili ‘anajisaidia’ kinawasilisha maana kwa upole unaolingana na lugha ya kificho ya chanzo, huku tafsiri halisi ikihifadhiwa katika tanbihi.
- source_word: חֲדַר הַמְּקֵרָה
  choice: chumba cha ndani chenye ubaridi
  rationale: Kirai kinaelekea kumaanisha chumba cha faragha au cha ndani kilichohusishwa na ubaridi. Tafsiri hii huhifadhi sifa zote mbili bila kubainisha zaidi ya ushahidi wa maandishi.
