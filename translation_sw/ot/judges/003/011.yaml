base_translation:
  language: en
  yaml_path: translation/ot/judges/003/011.yaml
  text: So the land had rest for forty years. Then Othniel son of Kenaz died.
translation:
  language: sw
  text: Kwa hiyo, nchi ikawa na amani kwa miaka arobaini. Kisha Othnieli mwana wa Kenazi akafa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: ikawa na amani
  rationale: Kitenzi שׁקט humaanisha kuwa kimya, kutosumbuliwa, au kuwa na utulivu. Katika muktadha huu wa Waamuzi, kinaeleza kipindi ambacho nchi haikusumbuliwa na ukandamizaji; ‘ikawa na amani’ ni Kiswahili cha kawaida bila kudokeza ustawi kamili.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha wa Waamuzi, אֶרֶץ ni nchi au eneo la Israeli, si dunia yote.
- source_word: אַרְבָּעִים שָׁנָה
  choice: kwa miaka arobaini
  rationale: Kirai hiki kinaonyesha muda ambao hali ya amani iliendelea; kihusishi ‘kwa’ kinaweka wazi maana hiyo kwa Kiswahili cha kawaida.
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kitenzi kinataja kifo kwa njia ya moja kwa moja, huku kiambishi cha usimulizi wa Kiebrania kikionyesha hatua inayofuata katika simulizi.
- source_word: עָתְנִיאֵל
  choice: Othnieli
  rationale: Jina limetoholewa kwa tahajia inayofaa Kiswahili na inayotambulika katika mapokeo ya Biblia za Kiswahili.
- source_word: בֶּן קְנַז
  choice: mwana wa Kenazi
  rationale: Muundo huu unamtambulisha Othnieli kwa ukoo wake; ‘mwana wa Kenazi’ ni wazi na wa kawaida katika Kiswahili cha kibiblia.
