base_translation:
  language: en
  yaml_path: translation/ot/judges/003/026.yaml
  text: But Ehud escaped while they delayed[b][a], and he passed beyond the carved images and escaped to Seirah.
translation:
  language: sw
  text: Lakini Ehudi alitoroka walipokuwa wakikawia. Alipita sanamu zilizochongwa[a], akatorokea Seira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sanamu za ibada.”
    reason: lexical_alternative
  - marker: b
    text: Jina hili pia linaweza kutoholewa “Seirathi.”
    reason: alternative_reading
lexical_decisions:
- source_word: נִמְלַט / וַיִּמָּלֵט
  choice: alitoroka / akatorokea
  rationale: Nifali ya מלט inaonyesha kufanikiwa kuondoka katika hatari. Muundo wa kwanza unaeleza kutoroka kwake, na wa pili pamoja na kiambishi cha kuelekea katika הַשְּׂעִירָתָה unaeleza kutorokea mahali pa usalama.
- source_word: עַד הִתְמַהְמְהָם
  choice: walipokuwa wakikawia
  rationale: Kirai hiki kinaonyesha kipindi ambacho watumishi walikawia; wakati unaoendelea katika Kiswahili unasawiri kuchelewa kwao bila kulazimisha maana ya mwisho ya 'mpaka'.
- source_word: עָבַר אֶת הַפְּסִילִים
  choice: alipita sanamu za kuchonga
  rationale: עָבַר pamoja na yambwa katika muktadha wa safari ina maana ya kupita alama hiyo ya mahali. Tafsiri hii ni ya kawaida na haiongezi dhana isiyo wazi ya umbali.
- source_word: הַפְּסִילִים
  choice: sanamu za kuchonga
  rationale: Neno פסילים hutaja vitu vilivyochongwa, mara nyingi sanamu za ibada. 'Sanamu za kuchonga' huhifadhi picha halisi ya neno huku tanbihi ikitoa 'sanamu za kuabudiwa' kama uwezekano wa kimuktadha.
- source_word: הַשְּׂעִירָתָה
  choice: Seira
  rationale: Hili ni jina la mahali lenye he ya kuelekea; kwa hiyo linatoholewa kama Seira, huku wazo la kuelekea likionyeshwa na kitenzi 'akatorokea'.
- source_word: וְ
  choice: Lakini
  rationale: Kiunganishi kinaonyesha tofauti kati ya kukawia kwa watumishi katika simulizi lililotangulia na kufanikiwa kwa Ehudi kutoroka.
