  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa urahisi. Marudio ya mzizi wa 'kutoroka' yamedumishwa, na mfuatano wa vitenzi unaendelezwa kwa 'alipita ... akatorokea'.
