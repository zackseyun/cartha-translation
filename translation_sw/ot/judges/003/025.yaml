  text: וַ/יָּחִ֣ילוּ עַד בּ֔וֹשׁ וְ/הְנֵּ֛ה אֵינֶ֥/נּוּ פֹתֵ֖חַ דַּלְת֣וֹת הָֽ/עֲלִיָּ֑ה וַ/יִּקְח֤וּ אֶת הַ/מַּפְתֵּ֨חַ֙ וַ/יִּפְתָּ֔חוּ וְ/הִנֵּה֙ אֲדֹ֣נֵי/הֶ֔ם נֹפֵ֥ל אַ֖רְצָ/ה מֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/025.yaml
  text: And they waited until they were embarrassed[a], and behold, he still was not opening the doors of the upper room. So they took the key and opened them, and behold, their master had fallen to the floor[c][b], dead.
translation:
  language: sw
  text: Nao wakangoja mpaka wakaona aibu[a]. Na tazama, hakuwa akifungua milango ya chumba cha juu[b]. Basi wakachukua ufunguo na wakazifungua; na tazama, bwana wao[c] alikuwa ameanguka chini, amekufa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka wakaaibika.” Nahau ya Kiebrania inaweza kumaanisha aibu au fedheha; hapa huenda inaeleza jinsi walivyozidi kuona hali ya kusubiri kuwa ya kuaibisha.
    reason: lexical_alternative
  - marker: b
    text: Au, “chumba cha ghorofani.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, mkuu wao wa kibinadamu, Egloni; hapa neno “bwana” halimtaji Mungu.
    reason: clarification
lexical_decisions:
- source_word: וַיָּחִילוּ
  choice: wakangoja
  rationale: Kitenzi hiki katika muktadha kinaonyesha watumishi waliendelea kusubiri nje ya chumba; “wakangoja” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: עַד בּוֹשׁ
  choice: mpaka wakaanza kuona aibu
  rationale: Nahau hii inaweza kumaanisha kufikia hali ya aibu au fedheha. Kauli hii inaonyesha hali yao ya kusita na kuona mambo yamekuwa ya kuaibisha bila kuipa lazima maana ya hatia ya kimaadili.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili linadumisha mgeuko wa ghafla na msisitizo wa usimulizi katika sehemu zote mbili linapotokea.
- source_word: אֵינֶנּוּ פֹתֵחַ
  choice: hakuwa akifungua
  rationale: Muundo huu unaonyesha kutotendeka kwa jambo lililotarajiwa wakati huo; hali ya kuendelea inadumishwa bila kuongeza neno lisilo la lazima kama “bado.”
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: milango ya chumba cha juu
  rationale: “Chumba cha juu” ni tafsiri ya kawaida ya עֲלִיָּה, na wingi wa “milango” umehifadhiwa.
- source_word: הַמַּפְתֵּחַ
  choice: ufunguo
  rationale: Hii ndiyo maana ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: וַיִּפְתָּחוּ
  choice: wakaifungua
  rationale: Kiswahili hutumia umoja wa ngeli kurejelea sehemu ya kuingilia inayofunguliwa, ingawa Kiebrania kimetaja milango kwa wingi; rejeo linabaki wazi katika muktadha.
- source_word: אֲדֹנֵיהֶם
  choice: bwana wao
  rationale: Hapa neno linamtaja Egloni kama mkuu wa watumishi hao, si Mungu. “Bwana wao” ni la kawaida kwa uhusiano huo wa kijamii, na tanbihi inaondoa utata.
- source_word: נֹפֵל אַרְצָה
  choice: alikuwa ameanguka chini
  rationale: Kauli hii inaonyesha hali ambayo watumishi walimkuta ndani ya chumba. “Chini” hudumisha maana ya mwelekeo wa אַרְצָה bila kulazimisha “sakafuni” au “ardhini.”
- source_word: מֵת
  choice: amekufa
  rationale: Neno hili linaeleza wazi hali ya Egloni walipomkuta.
theological_decisions:
- issue: Maana ya אֲדֹנֵיהֶם
  choice: bwana wao
  alternative: mkubwa wao
  rationale: “Bwana wao” huhifadhi maana ya mamlaka ya kibinadamu katika simulizi, huku tanbihi ikibainisha kwamba si jina la Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. “Tazama” limetumiwa kuhifadhi msisitizo wa kifasihi wa Kiebrania, na sentensi zimegawanywa kwa mtiririko wa asili wa Kiswahili.
