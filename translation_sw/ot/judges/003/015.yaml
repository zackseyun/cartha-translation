  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּזְעֲק֣וּ בְנֵֽי יִשְׂרָאֵל֮ אֶל יְהוָה֒ וַ/יָּקֶם֩ יְהוָ֨ה לָ/הֶ֜ם מוֹשִׁ֗יעַ אֶת אֵה֤וּד בֶּן גֵּרָא֙ בֶּן הַ/יְמִינִ֔י אִ֥ישׁ אִטֵּ֖ר יַד יְמִינ֑/וֹ וַ/יִּשְׁלְח֨וּ בְנֵי יִשְׂרָאֵ֤ל בְּ/יָד/וֹ֙ מִנְחָ֔ה לְ/עֶגְל֖וֹן מֶ֥לֶךְ מוֹאָֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/015.yaml
  text: Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up for them a deliverer, Ehud son of Gera, a Benjaminite, a man hindered in his right hand. And the sons of Israel sent tribute by his hand to Eglon king of Moab.
translation:
  language: sw
  text: Ndipo wana wa Israeli wakamlilia Yahweh, naye Yahweh akawainulia mwokozi, Ehudi mwana wa Gera, wa kabila la Benyamini, mtu ambaye mkono wake wa kulia ulikuwa na kizuizi.[a] Wana wa Israeli wakapeleka ushuru kwa mkono wa Ehudi kwa Egloni, mfalme wa Moabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kama inavyotafsiriwa kwa kawaida, “mtu wa mkono wa kushoto.” Kiebrania hueleza kihalisi kwamba mkono wa kulia wa Ehudi ulikuwa umezuiwa au ulikuwa na kizuizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: wakamlilia
  rationale: Kitenzi זעק kinaonyesha kilio cha dhiki kinachoelekezwa kwa Yahweh; “wakamlilia” ni Kiswahili cha kawaida kinachohifadhi dharura na mwelekeo wa kilio hicho bila kuongeza wazi maneno “waombe msaada.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi nahau ya Kiebrania na rejeo lake la kijinsia, huku ikiwa inaeleweka katika Kiswahili sanifu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni limeandikwa kwa unukuzi badala ya kubadilishwa na cheo.
- source_word: וַיָּקֶם ... מוֹשִׁיעַ
  choice: akawainulia mwokozi
  rationale: “Kuinulia” huhifadhi nahau ya Mungu kumteua na kumtokeza mwokozi; hapa מוֹשִׁיעַ ni wakala wa kibinadamu anayewaokoa watu katika hali ya kihistoria.
- source_word: אֵהוּד בֶּן גֵּרָא
  choice: Ehudi mwana wa Gera
  rationale: Majina yamenukuliwa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: בֶּן הַיְמִינִי
  choice: wa kabila la Benyamini
  rationale: Kirai hiki ni jina la uhusiano wa kikabila; tafsiri hii huonyesha wazi kuwa Ehudi alikuwa Mbenyamini bila kuiga kwa ugumu muundo wa Kiebrania.
- source_word: אִישׁ אִטֵּר יַד יְמִינוֹ
  choice: mtu aliyezuiwa kutumia mkono wake wa kulia
  rationale: Huhifadhi taswira isiyo ya kawaida ya Kiebrania, inayosema kuwa mkono wa kulia ulikuwa umezuiwa au wenye kizuizi, bila kuamua kimya kimya kwamba maana pekee ni kuwa Ehudi alikuwa shoto.
- source_word: וַיִּשְׁלְחוּ ... בְּיָדוֹ
  choice: wakapeleka ... kwa mkono wake
  rationale: Huhifadhi nahau ya wakala iliyo katika בְּיָדוֹ na kuonyesha kwamba Ehudi ndiye aliyebeba au kuwasilisha ushuru.
- source_word: מִנְחָה
  choice: ushuru
  rationale: Katika muktadha wa utawala wa Moabu, neno hili linamaanisha malipo yanayotolewa kwa mtawala mkuu, si sadaka ya ibada wala zawadi ya kawaida.
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: kwa Egloni mfalme wa Moabu
  rationale: Hutoa jina na cheo cha kifalme kwa mtiririko wa asili wa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni; “Yahweh” huhifadhi jina la agano badala ya kulibadilisha kwa cheo.
- issue: Maana ya אִטֵּר יַד יְמִינוֹ
  choice: aliyezuiwa kutumia mkono wake wa kulia
  alternative: mtu wa mkono wa kushoto
  rationale: Kirai cha Kiebrania kinaweza kueleweka kuwa Ehudi alikuwa shoto, lakini kwa namna halisi kinataja kizuizi cha mkono wa kulia. Matini kuu huhifadhi utata huo, na ufafanuzi wa kawaida unawekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umehifadhi urudiaji wa “Yahweh” na “wana wa Israeli,” pamoja na taswira ya “kwa mkono wake,” huku sentensi zikibaki za asili katika Kiswahili.
