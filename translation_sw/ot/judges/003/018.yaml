  text: And when he had finished presenting the tribute[a], he sent away the people who were carrying the tribute.
translation:
  language: sw
  text: Baada ya kumaliza kutoa ushuru[a], Ehudi akawaruhusu watu waliobeba ushuru huo waondoke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “zawadi” au “sadaka.” Hapa neno la Kiebrania huenda linamaanisha ushuru uliotolewa kwa mtawala, wala si sadaka ya ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Baada ya
  rationale: Kirai hiki kinaanzisha hatua inayofuata kwa uhusiano wa wakati. “Baada ya” ni Kiswahili cha kawaida kinachoonyesha wazi kwamba tendo la kwanza lilikamilika kabla ya jingine.
- source_word: כִּלָּה
  choice: kumaliza
  rationale: Kitenzi kina maana ya kukamilisha au kumaliza; hapa kinaonyesha kuwa utoaji wa ushuru ulikamilika kabla ya watu kuagwa.
- source_word: לְהַקְרִיב
  choice: kutoa
  rationale: Hifili ya קרב hapa ni kuleta au kuwasilisha kitu mbele ya mtawala. “Kutoa” ni ya asili katika Kiswahili pamoja na “ushuru” na haileti maana ya ibada ya dhabihu.
- source_word: הַמִּנְחָה
  choice: ushuru
  rationale: Katika muktadha huu neno linamaanisha zawadi au malipo yanayopelekwa kwa mtawala kutokana na utiisho, si sadaka ya ibada. “Ushuru” linaonyesha vizuri hali hiyo ya kisiasa; tanbihi inahifadhi maana nyingine zinazowezekana za neno.
- source_word: וַיְשַׁלַּח
  choice: akawaaga
  rationale: Kitenzi kina maana ya kuwaondoa au kuwaacha waende. “Akawaaga” ni usemi wa kawaida na wenye staha kwa kumaanisha kwamba Ehudi aliwaruhusu waondoke.
- source_word: הָעָם
  choice: watu
  rationale: Neno la Kiebrania ni neno la jumla kwa watu; tafsiri haiongezi jinsia wala kuwafanya rasmi kuwa kikundi maalumu.
- source_word: נֹשְׂאֵי הַמִּנְחָה
  choice: waliokuwa wameubeba ushuru huo
  rationale: Muundo wa kivumishi-tendo unawatambulisha watu kwa kazi yao ya kubeba ushuru. Kiswahili hiki ni cha kawaida na kinaonyesha kwamba walikuwa wameufikisha kabla ya kuagwa.
theological_decisions:
- issue: Maana ya הַמִּנְחָה katika muktadha wa simulizi
  choice: ushuru
  alternative: zawadi au sadaka
  rationale: Muktadha wa Ehudi kumpelekea Egloni malipo ya kisiasa unaunga mkono “ushuru,” lakini upana wa neno la Kiebrania umehifadhiwa katika tanbihi bila kulifanya kuwa sadaka ya kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa, wazi na chenye hadhi. Jina “Ehudi” limetajwa badala ya kiwakilishi pekee ili kuepusha utata wa kawaida katika Kiswahili bila kubadili mhusika wa simulizi.
