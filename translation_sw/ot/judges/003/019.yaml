  text: וְ/ה֣וּא שָׁ֗ב מִן הַ/פְּסִילִים֙ אֲשֶׁ֣ר אֶת הַ/גִּלְגָּ֔ל וַ/יֹּ֕אמֶר דְּבַר סֵ֥תֶר לִ֛/י אֵלֶ֖י/ךָ הַ/מֶּ֑לֶךְ וַ/יֹּ֣אמֶר הָ֔ס וַ/יֵּֽצְאוּ֙ מֵֽ/עָלָ֔י/ו כָּל הָ/עֹמְדִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/019.yaml
  text: But he himself turned back from the carved images that were near Gilgal and said[a], “I have a secret message for you, O king.” And he said[c][b], “Silence.” Then all who were standing by him went out from his presence.
translation:
  language: sw
  text: Lakini yeye mwenyewe akarudi kutoka kwenye sanamu zilizochongwa[a] zilizokuwa karibu na Gilgali[b], akasema, “Nina ujumbe wa siri[c] kwa ajili yako, ee mfalme.” Mfalme akasema, “Kimya!” Ndipo wote waliokuwa wamesimama karibu naye wakatoka mbele yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sanamu za miungu” badala ya “sanamu zilizochongwa.” Neno la Kiebrania mara nyingi hutaja sanamu za ibada.
    reason: lexical_alternative
  - marker: b
    text: Au “zilizokuwa huko Gilgali.” Kirai cha mahali katika Kiebrania kimebanwa na huenda kikaonyesha kuwa zilikuwa karibu na Gilgali au huko Gilgali.
    reason: lexical_alternative
  - marker: c
    text: Au “neno la siri” au “jambo la faragha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: akarudi
  rationale: Kitenzi kinaonyesha kurudi au kugeuka na kurudi; “akarudi” ni cha kawaida katika simulizi na kinaonyesha kuwa Ehudi alibadili mwelekeo wa safari yake.
- source_word: הַפְּסִילִים
  choice: sanamu za kuchonga
  rationale: Neno hilo humaanisha sanamu zilizochongwa na mara nyingi sanamu za ibada; tafsiri hii inadumisha maana yake halisi bila kuficha uwezekano wa kuwa zilikuwa sanamu za miungu.
- source_word: אֲשֶׁר אֶת־הַגִּלְגָּל
  choice: zilizokuwa karibu na Gilgali
  rationale: Muundo wa Kiebrania umebanwa na unaonyesha mahali sanamu hizo zilipokuwa kwa uhusiano na Gilgali; “karibu na” ni wazi na ya asili huku tanbihi ikihifadhi uwezekano wa “huko Gilgali.”
- source_word: דְּבַר סֵתֶר
  choice: ujumbe wa siri
  rationale: דבר inaweza kuwa neno, jambo, au ujumbe, na סתר huonyesha usiri; “ujumbe wa siri” inafaa katika mazingira ya ikulu bila kueleza mapema kusudi la Ehudi.
- source_word: לִי אֵלֶיךָ
  choice: Nina ... kwa ajili yako
  rationale: Usemi wa Kiebrania unaunganisha umilikaji wa msemaji na uelekeo kwa msikilizaji; muundo huu wa Kiswahili unawasilisha maana hiyo kwa kawaida.
- source_word: הַמֶּלֶךְ
  choice: ee mfalme
  rationale: Katika usemi wa moja kwa moja neno hili ni la kumwita mfalme; “ee mfalme” linadumisha heshima na uzito wa hotuba.
- source_word: הָס
  choice: Kimya!
  rationale: Ni amri fupi na ya ghafla ya kutaka ukimya; “Kimya!” inadumisha ufupi huo bila kubainisha kimyakimya ni nani hasa aliyeamriwa.
- source_word: כָּל הָעֹמְדִים עָלָיו
  choice: wote waliokuwa wamesimama karibu naye
  rationale: Kirai kinaeleza watu waliokuwa wamesimama karibu na mfalme, yaelekea wahudumu wake; tafsiri hii inadumisha picha halisi badala ya kuamua rasmi cheo chao.
- source_word: מֵעָלָיו
  choice: wakatoka mbele yake
  rationale: Kihalisi ni kuondoka karibu naye au kutoka kwake; katika mazingira ya kifalme “kutoka mbele yake” huonyesha kuondoka mahali alipokuwapo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi, cha sasa na chenye heshima. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika. “Kimya!” limeachwa fupi ili kuhifadhi mkazo wa amri ya Kiebrania na kutobainisha bila lazima kama ilielekezwa kwa Ehudi au kwa wahudumu.
