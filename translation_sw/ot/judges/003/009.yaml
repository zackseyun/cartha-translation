base_translation:
  language: en
  yaml_path: translation/ot/judges/003/009.yaml
  text: 'Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up a deliverer for the sons of Israel, who delivered them: Othniel son of Kenaz[c][b], Caleb’s younger brother.'
translation:
  language: sw
  text: Ndipo wana wa Israeli wakamlilia Yahweh, naye Yahweh akawainulia wana wa Israeli mwokozi[a], Othnieli mwana wa Kenazi, ndugu mdogo wa Kalebu[b]; naye akawaokoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mwokozi” pia inaweza kutafsiriwa “mkombozi” au “mwokoaji.” Hapa neno la Kiebrania linamtaja mwanadamu aliyeinuliwa na Mungu kuwaokoa Israeli.
    reason: lexical_alternative
  - marker: b
    text: Yaani, Othnieli alikuwa ndugu wa Kalebu na alikuwa mdogo kuliko Kalebu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: wakamlilia
  rationale: Kitenzi זעק kinaonyesha kilio cha dharura cha kuomba msaada; “wakamlilia” ni Kiswahili cha kawaida kinachoonyesha kuwa kilio hicho kilielekezwa kwa Yahweh.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa njia ya asili usemi wa kifamilia wa Kiebrania, badala ya kuufanya tu “Waisraeli.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: וַיָּקֶם
  choice: akawainulia
  rationale: Hiphili ya קום hapa humaanisha Mungu kumleta au kumweka mtu achukue jukumu la kuwaokoa Israeli; “akawainulia” ni usemi wa kawaida wa kibiblia katika Kiswahili.
- source_word: מוֹשִׁיעַ
  choice: mwokozi
  rationale: Nomino hii humaanisha mtu anayeleta wokovu au ukombozi. “Mwokozi” ni neno la kawaida na lenye heshima; tanbihi inaeleza kuwa hapa ni mkombozi wa kibinadamu aliyeinuliwa na Mungu.
- source_word: וַיּוֹשִׁיעֵם
  choice: akawaokoa
  rationale: Kitenzi ישׁע hapa kinaeleza kuwaokoa kutoka katika mateso ya adui, na kinahifadhi uhusiano wa kimatamshi na “mwokozi.”
- source_word: אֵת עָתְנִיאֵל בֶּן קְנַז
  choice: Othnieli mwana wa Kenazi
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili, na kirai kinamtambulisha mwokozi huyo kuwa Othnieli mwana wa Kenazi.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: ndugu mdogo wa Kalebu
  rationale: 'Hii ndiyo tafsiri ya kawaida ya kisintaksia: Othnieli alikuwa ndugu wa Kalebu na alikuwa mdogo kuliko Kalebu. Haidai kuwa alikuwa ndugu wa mwisho kuzaliwa.'
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina la agano moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo kama “BWANA.”
- issue: Jinsi ya kutafsiri מוֹשִׁיעַ
  choice: mwokozi
  alternative: mkombozi
  rationale: Hapa neno linamhusu wakala wa kibinadamu aliyeinuliwa na Mungu kuwaokoa Israeli. “Mwokozi” huhifadhi uhusiano na kitenzi ישׁע, huku tanbihi ikizuia kudhani kwamba hapa neno hilo linamtaja Mungu au Masihi moja kwa moja.
- issue: Uhusiano unaoelezwa na אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: ndugu mdogo wa Kalebu
  alternative: ndugu wa Kalebu, aliyekuwa mdogo kuliko yeye
  rationale: Kiswahili hiki cha kawaida huonyesha kwamba Othnieli alikuwa mdogo kuliko Kalebu, bila kudai kwamba alikuwa mdogo kuliko ndugu wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetunzwa kwa “Ndipo ... naye ...,” huku “wana wa Israeli” ikihifadhi picha ya kifamilia ya Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
