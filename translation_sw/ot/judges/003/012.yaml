  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְחַזֵּ֨ק יְהוָ֜ה אֶת עֶגְל֤וֹן מֶֽלֶךְ מוֹאָב֙ עַל יִשְׂרָאֵ֔ל עַ֛ל כִּֽי עָשׂ֥וּ אֶת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/012.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and Yahweh strengthened Eglon king of Moab against Israel, because they had done what was evil in the eyes of Yahweh.
translation:
  language: sw
  text: Wanaisraeli wakafanya tena yaliyo maovu machoni pa Yahwe, naye Yahwe akamtia nguvu Egloni mfalme wa Moabu dhidi ya Israeli, kwa sababu walikuwa wamefanya yaliyo maovu machoni pa Yahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: wakafanya tena
  rationale: Muundo יסף pamoja na kitenzi-jina huonyesha kurudia au kuendelea; katika mzunguko wa simulizi la Waamuzi, “wakafanya tena” huonyesha wazi kurudiwa kwa tendo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Wanaisraeli
  rationale: Ingawa kihalisi ni “wana wa Israeli,” katika muktadha huu usemi huo unamaanisha watu wa Israeli kwa ujumla; “Wanaisraeli” ni Kiswahili cha kawaida na jumuishi.
- source_word: לַעֲשׂוֹת הָרַע
  choice: yaliyo maovu
  rationale: Hutoa maana ya kufanya kile ambacho ni kiovu bila kutumia muundo mzito wa kihalisi.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Huhifadhi sitiari ya Kiebrania ya tathmini ya maadili huku ikiwa wazi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina binafsi la Mungu lililoandikwa kwa Tetragramatoni, badala ya kulibadilisha kuwa cheo.
- source_word: וַיְחַזֵּק
  choice: akamtia nguvu
  rationale: Piel ya חזק ina maana ya kumfanya mtu awe na nguvu au kumtia nguvu; tafsiri hii huhifadhi uwakala hai wa Yahwe.
- source_word: אֶת עֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: Egloni mfalme wa Moabu
  rationale: Ni muundo wa kawaida wa jina na cheo katika Kiswahili; maumbo Egloni na Moabu yanafuata uasilishaji wa majina wa Kiswahili.
- source_word: עַל יִשְׂרָאֵל
  choice: dhidi ya Israeli
  rationale: Katika muktadha wa uadui, עַל huonyesha upinzani, hivyo “dhidi ya” ni sahihi kuliko “juu ya.”
- source_word: עַל כִּי
  choice: kwa sababu
  rationale: Huanzisha sababu ya hatua ya Yahwe kwa Kiswahili cha kawaida na wazi.
- source_word: עָשׂוּ אֶת הָרַע
  choice: walikuwa wamefanya yaliyo maovu
  rationale: Muundo huu unaonyesha tendo lililotangulia ambalo ndilo sababu ya hukumu iliyosimuliwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania hutumia jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Uwakala wa Mungu katika וַיְחַזֵּק יְהוָה אֶת עֶגְלוֹן
  choice: Yahwe akamtia nguvu Egloni
  alternative: Yahwe alimruhusu Egloni awe na nguvu
  rationale: Kitenzi kinamweleza Yahwe kama mtendaji anayemtia Egloni nguvu. Tafsiri hailegezi kauli hiyo kuwa ruhusa tu, hivyo huhifadhi mvutano wa kiteolojia wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inatumia muundo wa kawaida “Wanaisraeli” badala ya “wana wa Israeli,” huku ikihifadhi sitiari “machoni pa Yahwe” na uwakala wa moja kwa moja wa Mungu.
