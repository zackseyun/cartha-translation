  terminology: '“Neno kutoka kwa Mungu,” “chumba cha juu chenye ubaridi,” na “kiti chake” ni istilahi zinazofaa. Kumbusho la kiti cha kifalme linapaswa kusemwa kwa sarufi sahihi: “kinawezekana,” si “yawezekana.”'
