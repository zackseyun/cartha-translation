  source_fidelity: 'Tafsiri inafuata maana ya Kiebrania kwa ujumla: Ehudi anamjia Egloni, ambaye ameketi katika chumba cha juu chenye ubaridi kwa matumizi yake binafsi; Ehudi anadai kuwa ana neno kutoka kwa Mungu; kisha Egloni anainuka kutoka kitini. Hata hivyo, “chumba chake” pamoja na “peke yake” haionyeshi kwa uwazi kwamba kirai cha Kiebrania kinaeleza umiliki/matumizi binafsi ya chumba, si tu hali ya mtu kuketi bila watu wengine.'
