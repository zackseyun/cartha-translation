base_translation:
  language: en
  yaml_path: translation/ot/judges/003/020.yaml
  text: Then Ehud came to him while he was sitting alone in his cool roof chamber[a], and Ehud said[c][b], “I have a word from God for you.” So he rose from his seat.
translation:
  language: sw
  text: Ehudi akamjia alipokuwa ameketi katika chumba cha juu chenye ubaridi[a], ambacho alikuwa nacho kwa matumizi yake binafsi. Ehudi akasema, “Nina neno kutoka kwa Mungu kwa ajili yako[b].” Basi mfalme akainuka kutoka kwenye kiti chake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chumba cha orofani chenye ubaridi.”
    reason: lexical_alternative
  - marker: b
    text: Au “Nina ujumbe kutoka kwa Mungu kwa ajili yako.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania “kutoka juu ya kiti”; “kiti cha kifalme” pia kinawezekana kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא אֵלָיו
  choice: akamjia
  rationale: Kitenzi kinaonyesha Ehudi kufika au kumkaribia Egloni; “akamjia” ni cha kawaida katika simulizi na hakiongezi namna ya kuingia.
- source_word: יֹשֵׁב
  choice: alipokuwa ameketi
  rationale: Hali ya kuendelea ya kitenzi kishirikishi cha Kiebrania inaweka mazingira ya tukio; “alipokuwa ameketi” huiwasilisha kwa Kiswahili cha kawaida.
- source_word: עֲלִיַּת הַמְּקֵרָה
  choice: chumba chake cha orofani chenye ubaridi
  rationale: עֲלִיָּה ni chumba cha juu au cha orofani, na הַמְּקֵרָה inaelekea kueleza chumba kilichokuwa na ubaridi au kilichopitisha hewa. Tafsiri hii inadumisha vipengele vya mahali na hali ya hewa.
- source_word: אֲשֶׁר לוֹ לְבַדּוֹ
  choice: peke yake katika chumba chake
  rationale: Kirai kinasisitiza kuwa Egloni alikuwa humo faraghani na kwamba chumba hicho kilikuwa chake kwa matumizi binafsi.
- source_word: דְּבַר אֱלֹהִים
  choice: neno kutoka kwa Mungu
  rationale: Kirai kinaweza kumaanisha neno au ujumbe wa kimungu. “Neno kutoka kwa Mungu” linafuata Kiebrania kwa ukaribu huku likieleweka kiasili katika Kiswahili.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania linaweza kuwa la wingi, matumizi ya kawaida na muktadha huu yanaunga mkono maana ya umoja, “Mungu.”
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kitendo cha kuinuka kutoka alipoketi.
- source_word: מֵעַל הַכִּסֵּא
  choice: kutoka kwenye kiti chake
  rationale: כִּסֵּא inaweza kuwa kiti, kiti cha kifalme, au mahali pa kuketi. “Kiti chake” kinabaki pana bila kulazimisha mazingira rasmi ya kifalme katika chumba cha faragha.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika kauli ya Ehudi
  choice: Mungu
  alternative: miungu
  rationale: Katika kirai דְּבַר אֱלֹהִים na muktadha wa simulizi, maana ya umoja ndiyo ya kawaida zaidi. Tafsiri inaripoti kauli ya Ehudi bila kuamua kimya kimya uhalali au kusudi lake la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. “Yule mfalme” imewekwa wazi katika sentensi ya mwisho ili kuondoa utata wa kiwakilishi cha Kiebrania bila kurudia jina lisilotajwa katika mstari huu; muktadha unamtambulisha Egloni kuwa ndiye aliyeinuka.
