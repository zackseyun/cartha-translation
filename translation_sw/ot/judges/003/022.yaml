revisions:
- from: Mpini pia ukaingia baada ya upanga wenye makali[a], nayo mafuta yakaufunika upanga huo wenye makali, kwa sababu Ehudi hakauchomoa upanga tumboni mwake; na kinyesi kikatoka.[b]
  to: Mpini[a] pia ukaingia baada ya makali ya upanga, nayo mafuta yakayafunika makali hayo, kwa sababu Ehudi hakauchomoa upanga kutoka tumboni mwa Egloni; na kinyesi kikatoka.[b]
  rationale: Marekebisho yanamrejesha “tumbo” kwa Egloni, kama inavyodai muktadha na kiambishi cha Kiebrania; yanatafsiri הַלַּהַב kwa namna inayotofautisha makali ya upanga na mpini; na yanarekebisha mahali pa tanbihi a. Maelezo ya kinyesi yanahifadhi tahadhari inayofaa kwa neno adimu הַפַּרְשְׁדֹנָה.
