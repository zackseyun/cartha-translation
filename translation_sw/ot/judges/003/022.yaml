  terminology: “Mpini,” “makali ya upanga,” “mafuta,” “tumbo,” na “kinyesi” yanafaa katika Kiswahili Sanifu cha Afrika Mashariki. Kumtaja Egloni huondoa utata wa kiwakilishi bila kuongeza tafsiri ya kiteolojia.
