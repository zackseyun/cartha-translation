base_translation:
  language: en
  yaml_path: translation/ot/judges/003/022.yaml
  text: The hilt also went in after the blade[a], and the fat closed over the blade, because he did not pull the sword out of his belly[b]; and the dung came out.
translation:
  language: sw
  text: Mpini[a] pia ukaingia baada ya makali ya upanga, nayo mafuta yakayafunika makali hayo, kwa sababu Ehudi hakauchomoa upanga kutoka tumboni mwa Egloni; na kinyesi kikatoka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kishikio” au “sehemu ya kushikia upanga.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “kinyesi” ni adimu, na huenda likarejelea kwa upana zaidi kinyesi au vitu vilivyomo matumboni.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּצָּב
  choice: mpini
  rationale: Katika muktadha wa upanga, neno hili linaonyesha sehemu inayoshikwa, iliyoingia baada ya sehemu yenye makali. “Mpini” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: הַלַּהַב
  choice: upanga wenye makali
  rationale: Ingawa neno hili linaweza kumaanisha “mwali” katika miktadha mingine, hapa linamaanisha sehemu ya upanga yenye makali. Usemi huu unaepuka utata unaoweza kutokea kwa neno “kisu” au “makali” peke yake.
- source_word: וַיִּסְגֹּר ... בְּעַד
  choice: yakaufunika
  rationale: Muungano wa kitenzi na kihusishi unaonyesha mafuta yakifunika au kuzingira sehemu ya upanga yenye makali.
- source_word: הַחֵלֶב
  choice: mafuta
  rationale: Neno la Kiebrania linamaanisha mafuta ya mwili; tafsiri hii inadumisha picha halisi na yenye ukali ya simulizi.
- source_word: שָׁלַף
  choice: hakauchomoa
  rationale: Katika muktadha huu upanga tayari umo mwilini, hivyo “kuchomoa” ni Kiswahili cha kawaida kwa kuutoa silaha iliyopenya.
- source_word: מִבִּטְנוֹ
  choice: tumboni mwake
  rationale: Hii inawakilisha kwa kawaida neno la Kiebrania linalomaanisha tumbo au sehemu ya ndani ya mwili.
- source_word: הַפַּרְשְׁדֹנָה
  choice: kinyesi
  rationale: Neno hili adimu kwa kawaida hueleweka kuwa kinyesi au vitu vilivyomo matumboni. “Kinyesi” ni wazi, cha kawaida, na kinadumisha undani mkali wa simulizi.
- source_word: וַיֵּצֵא
  choice: kikatoka
  rationale: Kitenzi rahisi cha masimulizi kinachoonyesha kutoka; muundo huu ni wa asili katika Kiswahili.
- source_word: גַם
  choice: pia
  rationale: Kihusishi hiki kinakazia kwamba si sehemu yenye makali tu, bali hata mpini uliingia.
