base_translation:
  language: en
  yaml_path: translation/ot/judges/003/006.yaml
  text: They took their daughters for themselves as wives[a], and they gave their daughters to their sons, and they served their gods.
translation:
  language: sw
  text: Nao wakawaoa binti za mataifa hayo kuwa wake zao, wakawaoza binti zao kwa wana wa mataifa hayo, wakazitumikia miungu yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakaabudu miungu yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ אֶת־בְּנוֹתֵיהֶם לָהֶם לְנָשִׁים
  choice: Nao wakawaoa binti zao
  rationale: Katika muktadha wa ndoa, לקח pamoja na לְנָשִׁים humaanisha kuwachukua wanawake kuwa wake. Kiswahili cha kawaida hueleza hilo kwa kitenzi ‘kuoa’; kiwakilishi ‘zao’ kinawarejelea watu wa mataifa yaliyotajwa katika muktadha.
- source_word: וְאֶת־בְּנוֹתֵיהֶם נָתְנוּ לִבְנֵיהֶם
  choice: na wakawapa wana wao binti zao wawe wake zao
  rationale: נתן ni ‘kutoa/kumpa,’ lakini hapa tendo hilo ni la kuwatoa binti katika ndoa. Mpangilio huu unaweka wazi kwamba Waisraeli waliwapa wana wa mataifa hayo binti zao, bila kuongeza ‘wenyewe,’ ambalo halipo wazi katika Kiebrania.
- source_word: וַיַּעַבְדוּ
  choice: wakaitumikia
  rationale: עבד inapohusishwa na miungu inaweza kumaanisha kutumikia au kuabudu. ‘Kuitumikia’ huhifadhi maana pana ya utiifu na uaminifu wa kidini.
- source_word: אֱלֹהֵיהֶם
  choice: miungu yao
  rationale: Huu ni wingi wenye kiambishi kinachorejelea miungu ya mataifa yaliyowazunguka Waisraeli; ‘miungu yao’ ni tafsiri ya kawaida na iliyo wazi.
theological_decisions:
- issue: Maana ya עבד kuhusiana na miungu ya kipagani
  choice: wakaitumikia miungu yao
  alternative: wakaiabudu miungu yao
  rationale: ‘Kuitumikia’ huhifadhi maana pana ya kujisalimisha na kuwa mwaminifu kidini, huku ‘kuabudu’ ikiwa maana nyingine halali inayofafanuliwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. ‘Wakawaoa’ ni usemi wa kawaida wa ndoa, na ‘wana wao’ limetumiwa badala ya ‘wanawe’ ili kuepuka utata wa mrejeleo.
