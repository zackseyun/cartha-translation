translation:
  language: sw
  text: Kisha Ehudi akatoka hadi ukumbini[a], akafunga milango ya chumba cha juu nyuma yake, akazifungia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “barazani,” “katika chumba cha kuingilia,” au “kwenye safu ya nguzo”; neno la Kiebrania ni adimu na hurejelea eneo la jengo linaloungana na sehemu nyingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Kitenzi cha kawaida cha simulizi kinachoonyesha Ehudi akiondoka katika chumba cha juu.
- source_word: הַמִּסְדְּרוֹנָה
  choice: kwenda ukumbini
  rationale: Neno hili la Kiebrania ni adimu na linaashiria eneo la jengo lililoungana na chumba; “ukumbi” ni neno la kawaida la Kiswahili lisilobainisha kupita kiasi muundo hususa. Kiambishi elekezi -ה kinaonyesha mwendo kuelekea au kuingia humo.
- source_word: וַיִּסְגֹּר
  choice: akafunga
  rationale: סגר humaanisha kufunga; “akafunga” ni usemi wa kawaida kuhusu milango.
- source_word: דַּלְתוֹת
  choice: milango
  rationale: Wingi umehifadhiwa; unaweza kumaanisha milango miwili au vipande vya mlango.
- source_word: הָעֲלִיָּה
  choice: chumba cha juu
  rationale: עֲלִיָּה ni chumba kilicho sehemu ya juu ya jengo; tafsiri hii ni wazi na ya kawaida.
- source_word: בַּעֲדוֹ
  choice: nyuma yake
  rationale: Pamoja na kitenzi cha kufunga, neno hili linaonyesha kuwa milango ilifungwa baada ya Ehudi kutoka.
- source_word: וְנָעָל
  choice: na kuifungia
  rationale: Katika muktadha huu נעל ni kufunga mlango kwa kufuli au kipokeo; “kuifungia” ni ya asili na haibainishi bila msingi aina ya kifaa kilichotumiwa.
