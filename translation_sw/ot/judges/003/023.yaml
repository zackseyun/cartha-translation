  register: Kiswahili sanifu cha Afrika Mashariki, cha simulizi, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa vitenzi mfululizo umehifadhi mwendo wa simulizi, huku tanbihi ikihifadhi kutokuwa na uhakika kuhusu aina halisi ya eneo la jengo.
