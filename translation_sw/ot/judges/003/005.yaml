lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Kirai hiki kinadumisha taswira ya ukoo ya Kiebrania, yaani ‘wana wa Israeli,’ huku kikiwa usemi unaoeleweka katika Kiswahili cha Biblia. Kiunganishi וּ kinaeleweka kutokana na mwendelezo wa simulizi bila kulazimisha ‘na’ mwanzoni mwa sentensi.
- source_word: יָשְׁבוּ
  choice: waliishi
  rationale: Kitenzi ישׁב hapa kinaeleza kuishi au kukaa kwa kuendelea kati ya watu wa nchi; ‘waliishi’ ni cha kawaida na hakisisitizi mwanzo wa kufanya makazi.
- source_word: בְּקֶרֶב
  choice: miongoni mwa
  rationale: Hutoa maana ya kuwa katikati ya watu wengine kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: הַכְּנַעֲנִי
  choice: Wakanaani
  rationale: Ingawa jina la Kiebrania lina umbo la umoja, linatumika kwa maana ya kundi la watu; wingi wa Kiswahili unafaa katika orodha hii.
- source_word: הַחִתִּי
  choice: Wahiti
  rationale: Jina la kundi la watu limetolewa kwa wingi wa kawaida wa Kiswahili.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Jina la kundi la watu limetolewa kwa wingi wa kawaida wa Kiswahili.
- source_word: הַפְּרִזִּי
  choice: Waperizi
  rationale: Jina la kundi la watu limetolewa kwa wingi wa kawaida wa Kiswahili.
- source_word: הַחִוִּי
  choice: Wahivi
  rationale: Jina la kundi la watu limetolewa kwa wingi wa kawaida wa Kiswahili.
- source_word: הַיְבוּסִי
  choice: Wayebusi
  rationale: Jina la kundi la watu limetolewa kwa wingi wa kawaida wa Kiswahili.
