id: JDG.3.28
reference: Judges 3:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ רִדְפ֣וּ אַחֲרַ֔/י כִּֽי נָתַ֨ן יְהוָ֧ה אֶת אֹיְבֵי/כֶ֛ם אֶת מוֹאָ֖ב בְּ/יֶדְ/כֶ֑ם וַ/יֵּרְד֣וּ אַחֲרָ֗י/ו וַֽ/יִּלְכְּד֞וּ אֶת מַעְבְּר֤וֹת הַ/יַּרְדֵּן֙ לְ/מוֹאָ֔ב וְ/לֹֽא נָתְנ֥וּ אִ֖ישׁ לַ/עֲבֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/028.yaml
  text: And he said to them[a], “Follow after me, for Yahweh has given your enemies, Moab, into your hand.” So they went down after him and captured the fords of the Jordan against Moab[c][b], and they did not allow anyone to cross over.
translation:
  language: sw
  text: Naye akawaambia[a], “Nifuateni, kwa maana Yahwe amewatia adui zenu, yaani Moabu[b], mikononi mwenu.” Basi wakashuka wakimfuata, wakateka vivuko vya Yordani vinavyoelekea Moabu[c], wala hawakumruhusu mtu yeyote kuvuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nifuateni katika kuwafukuza.” Kitenzi cha Kiebrania kinaweza kumaanisha kufuata au kufuatilia kwa lengo la kumkamata adui.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema, “adui zenu, Moabu,” huku “Moabu” ikifafanua “adui zenu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “vivuko vya Yordani dhidi ya Moabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רִדְפוּ אַחֲרַי
  choice: Nifuateni
  rationale: Kitenzi רדף kwa kawaida humaanisha kufuatilia au kufukuza, lakini hapa Ehudi anawaamuru washiriki wenzake waende nyuma yake katika harakati za kijeshi. “Nifuateni” ni Kiswahili cha kawaida kinachohifadhi mwendo wa kumfuata; tanbihi inadumisha maana ya kuwafuatilia adui.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: amewatia ... mikononi mwenu
  rationale: Hii inahifadhi taswira ya nahau ya Kiebrania ya kuwakabidhi watu chini ya mamlaka ya mwingine, huku ikisikika kwa kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֹיְבֵיכֶם אֶת מוֹאָב
  choice: adui zenu, yaani Moabu
  rationale: Muundo wa Kiebrania unalitaja taifa la Moabu kama ufafanuzi wa “adui zenu.” “Yaani” huufanya uhusiano huo uwe wazi katika Kiswahili bila kubadili jina la taifa kuwa jina la kabila.
- source_word: וַיֵּרְדוּ אַחֲרָיו
  choice: wakashuka wakimfuata
  rationale: ירד inaonyesha kushuka halisi kutoka eneo la vilima kuelekea bonde la Yordani; tafsiri hii inadumisha maelezo hayo ya kijiografia.
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: vivuko vya Yordani
  rationale: מעברות ni sehemu za kuvukia mto, hasa zenye maji mafupi. “Vivuko” ni neno la kawaida na sahihi katika muktadha huu wa kijeshi.
- source_word: לְמוֹאָב
  choice: vinavyoelekea Moabu
  rationale: Kiambishi ל kinaweza kuonyesha mwelekeo au uhusiano na Moabu. Chaguo hili linaonyesha mwelekeo unaowezekana bila kudai zaidi ya maandishi; maana nyingine ya kimuktadha imetajwa katika tanbihi.
- source_word: וְלֹא נָתְנוּ אִישׁ לַעֲבֹר
  choice: hawakumruhusu mtu yeyote kuvuka
  rationale: Nahau hiyo, kwa maana ya moja kwa moja ‘hawakumpa mtu kuvuka,’ humaanisha kutomruhusu yeyote apite. Kiswahili hiki ni cha kawaida na kinadumisha katazo kamili.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi jina hilo kwa namna ya kawaida ya kulitohowa katika Kiswahili.
- issue: Moabu kama taifa linalotajwa kwa maana ya pamoja
  choice: Moabu
  alternative: Wamoabu
  rationale: Kiebrania kinataja taifa lenyewe na kuliweka katika ufafanuzi wa “adui zenu.” Kutumia “Moabu” kunahifadhi uwasilishaji huo bila kuongeza jina la watu ambalo halijaandikwa moja kwa moja.
- issue: Maana ya לְמוֹאָב baada ya vivuko vya Yordani
  choice: vinavyoelekea Moabu
  alternative: dhidi ya Moabu
  rationale: Kiambishi kinaweza kueleweka kwa mwelekeo au, katika muktadha wa kijeshi, kwa uhusiano wa kupinga Moabu. Maandishi makuu yanachagua maana ya mwelekeo, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Viunganishi “Naye” na “Basi” vinadumisha mtiririko wa simulizi; taswira ya “mikononi mwenu” na tendo la “kushuka” zimehifadhiwa kwa sababu zina umuhimu wa kimatini na kijiografia.
