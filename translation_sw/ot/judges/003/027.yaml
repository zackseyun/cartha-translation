  yaml_path: translation/ot/judges/003/027.yaml
  text: And when he arrived[a], he blew the trumpet in the hill country of Ephraim, and the sons of Israel went down with him from the hill country[b], and he was before them.
translation:
  language: sw
  text: Alipofika, akapiga tarumbeta katika nchi ya vilima ya Efraimu. Waisraeli wakashuka pamoja naye kutoka nchi hiyo ya vilima, naye alikuwa mbele yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאוֹ
  choice: Alipofika
  rationale: Muundo huu wa Kiebrania unaonyesha wakati na kuendeleza simulizi. “Alipofika” ni Kiswahili cha kawaida kinachohifadhi mpangilio wa matukio bila kutafsiri kimuundo kwa uzito kuwa “ikawa alipokuja.”
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: akapiga baragumu
  rationale: שׁוֹפָר ni pembe ya kupulizwa iliyotumiwa kama ala ya kutoa ishara. “Kupiga baragumu” ni usemi wa kawaida na wenye hadhi katika Kiswahili, na katika muktadha huu unaeleza wazi ishara ya kuwakusanya watu.
- source_word: בְּהַר אֶפְרָיִם
  choice: katika nchi ya vilima ya Efraimu
  rationale: Katika jina hili la kijiografia, הַר haimaanishi lazima mlima mmoja, bali eneo la juu lenye vilima. “Nchi ya vilima ya Efraimu” linaonyesha maana hiyo ya eneo.
- source_word: וַיֵּרְדוּ עִמּוֹ בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli wakashuka pamoja naye
  rationale: “Wana wa Israeli” huhifadhi umbo la בְנֵי יִשְׂרָאֵל na linafaa katika simulizi hili, ambako kundi linalofuata Ehudi ni jeshi la wanaume wa Israeli. “Wakashuka pamoja naye” huonyesha kwa usahihi mwendo kutoka eneo la juu.
- source_word: מִן הָהָר
  choice: kutoka nchi hiyo ya vilima
  rationale: Kifungu hiki kinarejelea eneo lilelile la vilima vya Efraimu lililotajwa awali. Neno “hiyo” linafanya rejeo hilo liwe wazi na la asili katika Kiswahili.
- source_word: וְהוּא לִפְנֵיהֶם
  choice: huku yeye akiwa mbele yao
  rationale: Tafsiri hii huhifadhi kauli ya Kiebrania kuhusu nafasi yake mbele yao bila kuibadili moja kwa moja kuwa “akiwaongoza,” ingawa uongozi wake unaeleweka katika muktadha.
theological_decisions:
- issue: Usemi wa kijinsia wa kundi בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  alternative: Waisraeli
  rationale: Katika muktadha wa kijeshi, usemi huu huenda unawalenga wanaume wa Israeli waliomfuata Ehudi. Tafsiri “Wana wa Israeli” huhifadhi umbo na uwezekano huo wa maana bila kuupanua kimyakimya kuwa jina la watu wote kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi, huku mfuatano wa matendo ya Kiebrania na kauli ya mwisho kuhusu nafasi ya Ehudi vikihifadhiwa.
