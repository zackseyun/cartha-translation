  text: And the sons of Israel served Eglon king of Moab for eighteen years[a].
translation:
  language: sw
  text: Wana wa Israeli wakamtumikia Egloni, mfalme wa Moabu, kwa miaka kumi na minane[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri yenye kufafanua zaidi, “Waisraeli walikuwa chini ya mamlaka ya Egloni, mfalme wa Moabu, kwa miaka kumi na minane.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: wakamtumikia
  rationale: Kitenzi עבד hapa kinaonyesha kumtumikia mtawala wa kigeni katika hali ya kutiishwa kisiasa, wala si kumwabudu. ‘Wakamtumikia’ kinahifadhi namna ya usemi wa Kiebrania; maana iliyo wazi zaidi inawekwa katika tanbihi.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Hiki ni kifungu cha karibu na nahau ya Kiebrania, kinachoonyesha kundi lenye asili ya Israeli bila kukigeuza moja kwa moja kuwa jina la kitaifa ‘Waisraeli’.
- source_word: אֶת עֶגְלוֹן
  choice: Egloni
  rationale: אֶת ni kiashiria cha yambwa tendwa na hakitafsiriwi peke yake. Jina עֶגְלוֹן limetoholewa kwa umbo la kawaida la Kiswahili ‘Egloni’.
- source_word: מֶלֶךְ מוֹאָב
  choice: mfalme wa Moabu
  rationale: Muundo tegemezi wa Kiebrania umetafsiriwa kwa Kiswahili cha kawaida, huku ‘Moabu’ likiwa umbo la jina linalotumika kwa kawaida katika Kiswahili.
- source_word: שְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: kwa miaka kumi na minane
  rationale: Kishazi hiki ni kielezi cha muda; ‘kwa miaka kumi na minane’ kinaeleza muda huo kwa Kiswahili cha kawaida bila kuongeza maana.
