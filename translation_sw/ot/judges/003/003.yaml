  yaml_path: translation/ot/judges/003/003.yaml
  text: the five rulers of the Philistines[a], and all the Canaanites, and the Sidonians, and the Hivites who lived in the hill country of Lebanon, from Mount Baal-hermon as far as Lebo-hamath.
translation:
  language: sw
  text: watawala watano wa Wafilisti, na Wakanaani wote, na Wasidoni, na Wahivi waliokaa katika nchi ya milima ya Lebanoni, kuanzia Mlima Baal-Hermoni hadi Lebo-Hamathi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi mahali pa kuingia Hamathi.” Usemi wa Kiebrania unaweza kueleweka ama kama jina la mahali, Lebo-Hamathi, au kama maelezo ya mahali pa kuingia Hamathi.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲמֵשֶׁת סַרְנֵי פְלִשְׁתִּים
  choice: wale watawala watano wa Wafilisti
  rationale: Muundo wa hali ya kuambatanisha unaonyesha watawala watano wa kisiasa wa Wafilisti. “Watawala” ni Kiswahili cha sasa kilicho wazi kuliko “mabwana” na hakileti cheo cha Kiajemi kama “masatrapa.” “Wale” linaendeleza orodha ya makundi yaliyotajwa katika muktadha uliotangulia.
- source_word: וְכָל הַכְּנַעֲנִי
  choice: na Wakanaani wote
  rationale: Nomino ya kikabila iko katika umoja wa mkusanyo, hivyo wingi “Wakanaani” unawasilisha maana yake ya kundi kwa Kiswahili cha kawaida.
- source_word: וְהַצִּידֹנִי
  choice: na Wasidoni
  rationale: Umoja wa kikabila wenye maana ya mkusanyo umetafsiriwa kwa jina la watu katika wingi.
- source_word: וְהַחִוִּי יֹשֵׁב
  choice: na Wahivi waliokaa
  rationale: “Wahivi” linaonyesha kundi, na kitenzi kishirikishi יֹשֵׁב kimetolewa kama kishazi cha uhusiano katika wakati uliopita, kinachofaa simulizi.
- source_word: הַר הַלְּבָנוֹן
  choice: eneo la milima la Lebanoni
  rationale: Ingawa kihalisi ni “mlima wa Lebanoni,” hapa usemi unaelekea kutaja ukanda wa milima, si lazima kilele kimoja.
- source_word: מֵהַר בַּעַל חֶרְמוֹן
  choice: kuanzia Mlima Baal-Hermoni
  rationale: Jina la mahali limehifadhiwa kwa unukuzi unaosomeka kwa Kiswahili.
- source_word: עַד לְבוֹא חֲמָת
  choice: hadi Lebo-Hamathi
  rationale: Usemi umetolewa kama jina la mahali linalojulikana katika jiografia ya Biblia, huku uwezekano wa maana elezi ukihifadhiwa katika tanbihi.
