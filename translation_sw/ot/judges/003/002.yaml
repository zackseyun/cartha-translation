  text: רַ֗ק לְמַ֨עַן֙ דַּ֚עַת דֹּר֣וֹת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/לַמְּדָ֖/ם מִלְחָמָ֑ה רַ֥ק אֲשֶׁר לְ/פָנִ֖ים לֹ֥א יְדָעֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/002.yaml
  text: only so that the generations of the sons of Israel might know[b][a], to teach them war—only those who formerly had not known it.
translation:
  language: sw
  text: ila tu ili vizazi vya wana wa Israeli[a] vipate kujua vita[b], kuwafundisha vita—wale tu ambao hapo awali hawakuwa wamevijua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania kihalisi, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “vipate kuwa na uzoefu wa vita.”
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  choice: ila tu / vile tu
  rationale: Chembe hii inaweka mpaka katika kauli ya kusudi. Imerudiwa mara mbili katika Kiebrania, kwa hiyo marudio yake yamehifadhiwa badala ya kulainishwa.
- source_word: לְמַעַן
  choice: ili
  rationale: Inaingiza kusudi; “ili” ni njia ya kawaida na ya wazi ya kulionyesha katika Kiswahili.
- source_word: דַּעַת
  choice: vipate kujua
  rationale: Kitenzi-jina hiki kinaeleza kusudi baada ya לְמַעַן. “Kujua” hudumisha uhusiano wake na ידע bila kuamua kimya kimya kwamba maana ni kujifunza au kupata uzoefu.
- source_word: דֹּרוֹת
  choice: vizazi vya
  rationale: Nomino hii ni wingi wa “kizazi.” Neno “vijavyo” halijaongezwa kwa kuwa, ingawa linadokezwa na muktadha, halipo wazi katika mstari.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hii inahifadhi kwa karibu muundo wa Kiebrania na hapa inawataja watu wa Israeli kwa ujumla, si wanaume peke yao.
- source_word: לְלַמְּדָם
  choice: kuvifundisha
  rationale: Ni hali ya kusababisha ya למד yenye kiambishi cha yambwa wingi, yaani “kuwafundisha.” Kiambishi cha ngeli ya “vizazi” kimetumiwa ili sentensi ya Kiswahili iwe na upatanisho wa kisarufi.
- source_word: מִלְחָמָה
  choice: vita
  rationale: “Vita” ni tafsiri ya kawaida na pana ya nomino hii katika Kiswahili, bila kuipunguza iwe pambano moja tu.
- source_word: אֲשֶׁר לְפָנִים
  choice: ambavyo hapo awali
  rationale: Muungano huu unaonyesha wakati uliotangulia; “hapo awali” ni wa sasa, wazi, na wenye hadhi.
- source_word: לֹא יְדָעוּם
  choice: havikuwa vimevijua
  rationale: Tafsiri inadumisha kitenzi “kujua” na kurejelea “vita,” badala ya kuamua kwamba kinamaanisha tu kuvipitia au kujifunza kupigana.
theological_decisions:
- issue: Usemi wa pamoja wenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Usemi wa Kiebrania ni jina la pamoja la watu wa agano. “Wana wa Israeli” huhifadhi umbo la chanzo, huku tanbihi ikitoa usemi wa kawaida zaidi na kufafanua kwamba maana ni watu wote wa Israeli.
- issue: Maana ya “kujua vita”
  choice: kujua / kuvijua
  alternative: kuwa na uzoefu wa vita
  rationale: Kiebrania hutumia kitenzi cha kawaida “kujua.” Kukihifadhi kunadumisha upana wa maana, unaoweza kujumuisha kufahamu vita na kuvipitia, bila kulazimisha tafsiri moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka. Sentensi inaendeleza kisarufi wazo la mstari uliotangulia; marudio ya “tu” na ugumu fulani wa muundo wa Kiebrania yamehifadhiwa kwa makusudi. Upatanisho wa ngeli umetumiwa kwa “vizazi … kuvifundisha … vile … havikuwa,” huku maana ikibaki kwamba watu wa vizazi hivyo ndio wanaofundishwa.
