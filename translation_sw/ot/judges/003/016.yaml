base_translation:
  language: en
  yaml_path: translation/ot/judges/003/016.yaml
  text: Ehud made himself a sword with two edges[a], a cubit in length[b], and strapped it on under his clothes on his right thigh.
translation:
  language: sw
  text: Ehudi akajitengenezea upanga wenye makali mawili, wa urefu wa gomedi moja[a], akaujifunga chini ya mavazi yake kwenye paja lake la kulia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gomedi ni kipimo adimu cha Kiebrania ambacho urefu wake kamili haujulikani; kwa kawaida huchukuliwa kuwa karibu na dhiraa moja, yaani takriban urefu wa mkono kuanzia kiwiko hadi ncha za vidole.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: akajitengenezea
  rationale: Muundo wa kitenzi עשה pamoja na לוֹ unaonyesha kwamba Ehudi alitengeneza silaha hiyo kwa matumizi yake mwenyewe; “akajitengenezea” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: חֶרֶב
  choice: upanga
  rationale: חֶרֶב ni neno la kawaida la upanga. Ingawa urefu wake unaweza kudokeza silaha fupi, tafsiri “upanga” haibani maana ya neno la Kiebrania kuwa jambia.
- source_word: וְלָהּ שְׁנֵי פֵיוֹת
  choice: wenye makali kuwili
  rationale: Kirai hicho ni, kihalisi, “ulikuwa na vinywa viwili,” nahau ya Kiebrania inayomaanisha upanga wenye makali pande zote mbili. “Makali kuwili” ni fasaha na hueleweka wazi.
- source_word: גֹּמֶד אָרְכָּהּ
  choice: urefu wake ukiwa gomedi moja[a]
  rationale: גֹּמֶד ni kipimo adimu ambacho urefu wake kamili haujulikani. Kutumia jina la kipimo lenyewe katika matini na kulifafanua katika tanbihi kunahifadhi kutokuwa na uhakika kwa ushahidi wa chanzo badala ya kulibadilisha moja kwa moja kuwa dhiraa.
- source_word: וַיַּחְגֹּר אוֹתָהּ
  choice: akaufunga
  rationale: חגר humaanisha kujifunga au kufunga kitu mwilini, hasa silaha. “Akaufunga” ni ya kawaida na inafaa kwa kitendo cha kuweka upanga mwilini.
- source_word: מִתַּחַת לְמַדָּיו
  choice: chini ya mavazi yake
  rationale: מַד inaweza kumaanisha vazi au mavazi. Tafsiri ya jumla “mavazi yake” ni ya kawaida na haibainishi bila msingi aina maalumu ya vazi.
- source_word: עַל יֶרֶךְ יְמִינוֹ
  choice: kwenye paja lake la kulia
  rationale: יָרֵךְ hurejelea paja au eneo la nyonga; “kwenye paja lake la kulia” ni tafsiri ya moja kwa moja inayolingana na mahali silaha ilipowekwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Kipimo adimu “gomedi” kimehifadhiwa ili kutodai uhakika usiopo katika Kiebrania, huku tanbihi ikitoa makadirio ya kitamaduni.
