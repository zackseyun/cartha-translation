base_translation:
  language: en
  yaml_path: translation/ot/judges/007/017.yaml
  text: And he said to them[a], “Watch me, and do likewise. Behold, when I come to the edge of the camp, then as I do, so you shall do.”
translation:
  language: sw
  text: Akawaambia, “Niangalieni[a], nanyi mfanye vivyo hivyo. Tazama, nitakapofika kwenye ukingo wa kambi, nitakapofanya, nanyi fanyeni vivyo hivyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitazameni, nanyi mfanye vivyo hivyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמֶּנִּי תִרְאוּ
  choice: Niangalieni
  rationale: Katika muktadha huu, muundo wa ראה pamoja na מן unawaagiza watu wamtazame Gideoni kama mfano wa kuiga; ‘Niangalieni’ ni amri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: וְכֵן תַּעֲשׂוּ
  choice: nanyi mfanye vivyo hivyo
  rationale: כֵן huonyesha namna (‘hivyo’); ‘vivyo hivyo’ huwasilisha kwa kawaida wazo la kuiga tendo lake huku ikihifadhi nguvu ya amri.
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta fikira kwa jambo linalofuata. ‘Tazama’ linahifadhi msisitizo huo kwa lugha yenye heshima na inayoeleweka.
- source_word: אָנֹכִי בָא
  choice: nitakapofika
  rationale: Kirai hiki kinaonyesha tendo linalokaribia kutokea. Katika sentensi ya maagizo, ‘nitakapofika’ huunganisha kwa kawaida wakati wa kufika na amri inayofuata.
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: kwenye ukingo wa kambi
  rationale: קצה ni sehemu ya mwisho au ukingo; ‘ukingo wa kambi’ ni tafsiri sahihi na ya kawaida katika muktadha huu.
- source_word: וְהָיָה כַאֲשֶׁר
  choice: mtatenda kama
  rationale: Muundo huu unaanzisha hali na ulinganisho unaoongoza kwenye agizo; Kiswahili cha ‘kama’ kinahifadhi uhusiano huo bila ugumu wa tafsiri ya neno kwa neno.
- source_word: אֶעֱשֶׂה כֵּן תַּעֲשׂוּן
  choice: mtatenda kama nitakavyotenda
  rationale: Hili linahifadhi wazo kuu la kuiga na nguvu ya agizo la Kiebrania, kwa mpangilio wa kawaida wa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni wazi kwa msomaji wa kawaida; ‘Tazama’ limehifadhiwa ili kuonyesha msisitizo wa וְהִנֵּה. Kiwakilishi cha mtendaji katika ‘Akawaambia’ kinaachwa kama kilivyo katika muktadha wa simulizi, sawa na chanzo.
