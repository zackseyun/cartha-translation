  source_fidelity: 'Tafsiri inafuata kwa uaminifu matendo na mpangilio wa Kiebrania: vikosi vitatu vinapiga tarumbeta, vinavunja mitungi, vinashika mienge kushoto na tarumbeta kulia ili kuziliza, kisha vinatoa mwito wa vita. “Vikosi vile vitatu” hufafanua kwa usahihi רָאשִׁים katika muktadha wa kijeshi.'
