reference: Judges 7:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ֠/יִּתְקְעוּ שְׁלֹ֨שֶׁת הָ/רָאשִׁ֥ים בַּ/שּֽׁוֹפָרוֹת֮ וַ/יִּשְׁבְּר֣וּ הַ/כַּדִּים֒ וַ/יַּחֲזִ֤יקוּ בְ/יַד שְׂמאוֹלָ/ם֙ בַּ/לַּפִּדִ֔ים וּ/בְ/יַ֨ד יְמִינָ֔/ם הַ/שּׁוֹפָר֖וֹת לִ/תְק֑וֹעַ וַֽ/יִּקְרְא֔וּ חֶ֥רֶב לַֽ/יהוָ֖ה וּ/לְ/גִדְעֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/020.yaml
  text: Then the three companies blew the trumpets and shattered the jars. They held the torches in their left hands and the trumpets in their right hands to blow[a], and they cried out, “A sword for Yahweh and for Gideon!”
translation:
  language: sw
  text: Ndipo vikosi vile vitatu vikapiga tarumbeta na kuvunja mitungi. Wakashika mienge kwa mikono yao ya kushoto na tarumbeta kwa mikono yao ya kulia ili kuzipiga, kisha wakapaza sauti, “Upanga kwa ajili ya Yahwe na kwa ajili ya Gideoni!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Upanga wa Yahwe na wa Gideoni!”
    reason: Usomaji huu unawezekana kwa sababu mwito wa Kiebrania hauna kitenzi na unaweza kufasiri uhusiano wa kihusishi לְ kwa njia zaidi ya moja.
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָרָאשִׁים
  choice: vikosi vile vitatu
  rationale: Katika muktadha huu wa kijeshi, neno hilo linamaanisha makundi matatu ambayo Gideoni alikuwa ameyagawa, si ‘vichwa’ halisi. ‘Vikosi’ ni Kiswahili cha kawaida na kinachofaa simulizi hili.
- source_word: שׁוֹפָרוֹת
  choice: tarumbeta
  rationale: Neno hilo linataja ala za pembe zilizopigwa kutoa ishara. ‘Tarumbeta’ linaeleweka kwa urahisi katika Kiswahili cha sasa bila kutumia utohozi wa ‘shofari’.
- source_word: הַכַּדִּים
  choice: mitungi
  rationale: כַּד ni chombo kama mtungi au gudulia. ‘Mitungi’ ni neno la kawaida na halibainishi umbo lisiloelezwa na maandishi.
- source_word: וַיַּחֲזִיקוּ
  choice: Wakashika
  rationale: Kitenzi hapa kinaonyesha kwamba walikuwa na vitu hivyo mikononi. ‘Wakashika’ ni cha asili na hakiongezi nguvu ya kitendo kuliko ilivyo lazima.
- source_word: בְיַד שְׂמאוֹלָם ... וּבְיַד יְמִינָם
  choice: kwa mikono yao ya kushoto ... kwa mikono yao ya kulia
  rationale: Umoja wa Kiebrania umetumiwa kwa maana ya kila mtu mmoja mmoja; wingi katika Kiswahili unaonyesha kwa kawaida kwamba kila mtu alishika kitu katika kila mkono.
- source_word: לַפִּדִים
  choice: mienge
  rationale: לַפִּיד ni kifaa kinachowaka kinachobebwa ili kutoa mwanga; ‘mienge’ ni tafsiri wazi na ya kawaida.
- source_word: לִתְקֹעַ
  choice: ili kuzipiga
  rationale: Kitenzi-jina hiki kinaonyesha kusudi. Katika Kiswahili tarumbeta ‘hupigwa,’ hivyo ‘ili kuzipiga’ ni ya asili na inaweka wazi rejeleo lake.
- source_word: וַיִּקְרְאוּ
  choice: wakapaza sauti
  rationale: Katika tukio hili ni mwito mkubwa wa vita. ‘Wakapaza sauti’ linaonyesha ukali wa mwito kuliko ‘wakasema’ bila kuingiza maelezo mapya.
- source_word: חֶרֶב לַיהוָה וּלְגִדְעוֹן
  choice: Upanga kwa ajili ya Yahwe na kwa ajili ya Gideoni!
  rationale: Kauli ya Kiebrania haina kitenzi na ni fupi kama mwito wa vita. ‘Kwa ajili ya’ huhifadhi maana ya msingi ya kihusishi לְ huku sentensi ikibaki wazi kwa msomaji wa Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi יהוה limetoholewa kama jina binafsi ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Maana ya mwito wa vita חֶרֶב לַיהוָה וּלְגִדְעוֹן
  choice: Upanga kwa ajili ya Yahwe na kwa ajili ya Gideoni!
  alternative: Upanga wa Yahwe na wa Gideoni!
  rationale: Muundo wa Kiebrania umefupishwa na unaweza kueleweka kama upanga ‘kwa ajili ya’ Yahwe na Gideoni au ‘wa’ Yahwe na Gideoni. Maandishi makuu yanahifadhi kihusishi לְ kwa karibu zaidi; uwezekano mwingine umewekwa katika tanbihi ili kutatua kimya kimya utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa urahisi. Mfuatano wa vitenzi vya ‘-ka-’ unadumisha kasi ya matendo, na mwito wa mwisho umeachwa mfupi na wenye nguvu.
