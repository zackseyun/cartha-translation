base_translation:
  language: en
  yaml_path: translation/ot/judges/007/003.yaml
  text: Please proclaim in the hearing of the people[a], saying, ‘Whoever is fearful and trembling, let him return and depart from Mount Gilead.’ Then twenty-two thousand of the people returned[b], and ten thousand remained.
translation:
  language: sw
  text: 'Sasa tangaza masikioni mwa watu, ukisema: “Yeyote anayeogopa na kutetemeka, na arudi na aondoke[a] kutoka Mlima Gileadi[b].” Ndipo watu elfu ishirini na mbili wakarudi, na elfu kumi wakabaki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kiebrania kilichotafsiriwa “aondoke” (וְיִצְפֹּר) ni nadra, na maana yake inajadiliwa; huenda kikamaanisha “aondoke mapema” au “ajiondoe kwa siri.”
    reason: lexical_alternative
  - marker: b
    text: “Mlima Gileadi” ndiyo tafsiri ya moja kwa moja ya Kiebrania, ingawa mahali panaporejelewa hapa ni vigumu kupatambua katika muktadha huu; wengine huielewa kwa upana kuwa eneo la milima la Gileadi.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Kiebrania kina kiunganishi וְ pamoja na עַתָּה, ‘sasa.’ ‘Basi sasa’ huendeleza simulizi na kuhifadhi rejeo la wakati lililo wazi katika matini chanzi.
- source_word: קְרָא נָא בְּאָזְנֵי הָעָם
  choice: tangaza watu wasikie
  rationale: Hii ni amri ya kutoa tangazo hadharani. Muundo huu ni Kiswahili cha kawaida na huhifadhi wazo la tangazo kutolewa watu wakisikia; נָא hulainisha amri, jambo linalowasilishwa kwa mtiririko wa ombi hilo bila kuongeza ‘tafadhali’ isiyo ya lazima katika muktadha huu.
- source_word: מִי יָרֵא וְחָרֵד
  choice: Yeyote anayeogopa na kutetemeka
  rationale: Maneno hayo mawili yanaonyesha hofu iliyofikia hatua ya kutetemeka. Tafsiri hii ni wazi, ya kawaida, na haipunguzi uzito wa hali hiyo.
- source_word: יָשֹׁב
  choice: na arudi
  rationale: Huu ni usemi wa ruhusa au agizo kwa mwenye hofu arudi. ‘Na arudi’ ni muundo wa Kiswahili unaofaa kwa jussive hiyo.
- source_word: וְיִצְפֹּר
  choice: na aondoke
  rationale: Kitenzi hiki ni nadra na maana yake kamili inajadiliwa. ‘Aondoke’ huwasilisha tendo la kujiondoa bila kuamua kimya kimya iwapo maana mahsusi ni kuondoka mapema au kujiondoa kwa siri.
- source_word: מֵהַר הַגִּלְעָד
  choice: kutoka Mlima Gileadi
  rationale: הַר katika umoja kwa kawaida ni ‘mlima,’ na Gileadi ni jina la mahali. Ugumu wa kijiografia unahifadhiwa katika tanbihi.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: elfu ishirini na mbili
  rationale: Huu ndio usemi wa kawaida wa idadi hiyo katika Kiswahili sanifu.
- source_word: וַעֲשֶׂרֶת אֲלָפִים נִשְׁאָרוּ
  choice: na elfu kumi wakabaki
  rationale: ‘Wakabaki’ huwasilisha kwa kawaida maana ya נִשְׁאָרוּ katika simulizi na kuendeleza mfuatano wa matukio.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘tangaza watu wasikie hivi’ unaeleweka kwa wasomaji wa kawaida na unaepuka tafsiri ngumu ya neno kwa neno. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika. Tofauti na safu ya ushauri ya Kiingereza, וְעַתָּה limetafsiriwa kwa sababu chanzo cha Kiebrania kina neno la wazi la wakati, ‘sasa.’
