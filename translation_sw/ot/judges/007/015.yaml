  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ גִּדְע֜וֹן אֶת מִסְפַּ֧ר הַ/חֲל֛וֹם וְ/אֶת שִׁבְר֖/וֹ וַ/יִּשְׁתָּ֑חוּ וַ/יָּ֨שָׁב֙ אֶל מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֹּ֣אמֶר ק֔וּמוּ כִּֽי נָתַ֧ן יְהוָ֛ה בְּ/יֶדְ/כֶ֖ם אֶת מַחֲנֵ֥ה מִדְיָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/015.yaml
  text: And when Gideon heard the telling of the dream and its interpretation, he bowed down in worship. Then he returned to the camp of Israel and said, “Get up, for the LORD has given the camp of Midian into your hand.”
translation:
  language: sw
  text: Gideoni aliposikia simulizi la ndoto hiyo na tafsiri yake, akasujudu. Kisha akarudi katika kambi ya Israeli na kusema, “Inukeni, kwa maana BWANA ameitia mikononi mwenu kambi ya Midiani.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפַּר הַחֲלוֹם
  choice: simulizi la ndoto hiyo
  rationale: Nomino מִסְפָּר hapa ina maana ya kusimuliwa au kutolewa kwa habari ya ndoto, si ‘idadi’.
- source_word: שִׁבְרוֹ
  choice: maana yake
  rationale: Katika muktadha wa ndoto, שֵׁבֶר humaanisha ufafanuzi au maana yake; ‘maana’ ni Kiswahili cha kawaida na wazi.
- source_word: וַיִּשְׁתָּחוּ
  choice: akasujudu
  rationale: Kitenzi kinaeleza kuinama hadi chini kwa heshima au ibada; ‘akasujudu’ huhifadhi tendo hilo bila kuongeza kiambishi kisichotajwa wazi kama ‘kwa ibada’.
- source_word: קוּמוּ
  choice: Inukeni
  rationale: Amri ya wingi kwa watu wa Israeli; ‘Inukeni’ ni ya moja kwa moja na yenye hadhi katika mwito wa kwenda vitani.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: ameitia mikononi mwenu
  rationale: Nahau ya Kiebrania inaashiria kukabidhi chini ya mamlaka au ushindi wa mtu; umbo hili linahifadhi taswira ya mikono na usemi wa kitheolojia wa jambo lililokwisha hakikishwa.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea katika Biblia za Kiswahili ya kuwakilisha jina la agano YHWH kwa BWANA kwa herufi kubwa.
theological_decisions:
- issue: Je, kusujudu kwa Gideoni kutajwe wazi kuwa ibada?
  choice: akasujudu
  alternative: akasujudu kwa ibada
  rationale: Kitenzi וַיִּשְׁתָּחוּ chenyewe kinaweza kumaanisha kusujudu kwa heshima au kwa ibada. Muktadha unaelekea kwa ibada kwa Mungu, lakini kirai ‘kwa ibada’ hakipo wazi katika maandishi, hivyo tafsiri haikifanyi kuwa cha lazima.
- issue: Wakati wa tendo la Mungu katika נָתַן
  choice: ameitia mikononi mwenu
  alternative: ataitia mikononi mwenu
  rationale: Kitenzi cha Kiebrania ni timilifu na kinawasilisha ushindi ulioahidiwa kana kwamba tayari umetolewa; wakati timilifu wa Kiswahili huhifadhi uhakika huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Sentensi inatumia masimulizi ya kawaida ya Biblia bila kuwa ya kizamani kupita kiasi. ‘Mikononi mwenu’ huhifadhi nahau ya chanzo na inaeleweka katika muktadha.
