  terminology: Yahwe, Gideoni, Wamidiani, Israeli, and kuokoa are consistently and appropriately rendered. The plural “mikononi mwao” is idiomatic Kiswahili for the Hebrew singular idiom; the note correctly identifies the Hebrew singular.
