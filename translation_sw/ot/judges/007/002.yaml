  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל גִּדְע֔וֹן רַ֗ב הָ/עָם֙ אֲשֶׁ֣ר אִתָּ֔/ךְ מִ/תִּתִּ֥/י אֶת מִדְיָ֖ן בְּ/יָדָ֑/ם פֶּן יִתְפָּאֵ֨ר עָלַ֤/י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר יָדִ֖/י הוֹשִׁ֥יעָה לִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/002.yaml
  text: And Yahweh said to Gideon[a], “The people who are with you are too many for me to give Midian into their hand, lest Israel boast against me, saying[b], ‘My own hand has saved me.’”
translation:
  language: sw
  text: Yahwe akamwambia Gideoni, “Watu walio pamoja nawe ni wengi mno kwangu kuwatia Wamidiani mikononi mwao[a], Israeli isije ikajisifu dhidi yangu, ikisema, ‘Mkono wangu mwenyewe umeniokoa[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “mkononi mwao.” Katika nahau ya Kiebrania, “mkono” wa umoja mara nyingi humaanisha nguvu, mamlaka au udhibiti.
    reason: lexical_alternative
  - marker: b
    text: Au, “umenikomboa.” Kitenzi cha Kiebrania kinaweza kumaanisha “kuokoa” au “kukomboa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa umbo la Kiswahili ‘Yahwe’ badala ya kubadilishwa na cheo kama ‘BWANA’.
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo huu wa kawaida wa masimulizi unaendeleza mtiririko wa tukio kwa Kiswahili cha asili.
- source_word: רַב הָעָם אֲשֶׁר אִתָּךְ
  choice: Watu walio pamoja nawe ni wengi mno
  rationale: ‘Wengi mno’ huonyesha kwamba idadi yao ni kubwa kupita inavyofaa katika hali hii, kama kifungu kinachofuata kinavyoeleza.
- source_word: מִתִּתִּי אֶת־מִדְיָן בְּיָדָם
  choice: kiasi kwamba siwezi kuwatia Wamidiani mikononi mwao
  rationale: Hutoa kwa Kiswahili kinachoeleweka wazo la kwamba wingi wa watu unazuia Yahwe kuwakabidhi Wamidiani chini ya mamlaka yao; ‘mikono’ ni nahau ya mamlaka au udhibiti.
- source_word: פֶּן יִתְפָּאֵר עָלַי יִשְׂרָאֵל
  choice: Israeli isije ikajisifu dhidi yangu
  rationale: ‘Isije’ huonyesha lengo la kuzuia jambo, na ‘ikajisifu dhidi yangu’ huhifadhi maana ya kujitukuza kwa kumpinga Mungu.
- source_word: יָדִי
  choice: Mkono wangu mwenyewe
  rationale: ‘Mwenyewe’ huonyesha msisitizo wa dai la Israeli kwamba nguvu zake ndizo zilizotenda.
- source_word: הוֹשִׁיעָה לִּי
  choice: umeniokoa
  rationale: Kitenzi kinaweza kumaanisha kuokoa au kukomboa; ‘umeniokoa’ ni cha kawaida na huhifadhi kinaya cha dai la Israeli la kujiokoa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Jina binafsi יהוה limehifadhiwa badala ya kubadilishwa kuwa cheo.
- issue: Israeli kama umoja wa kijumla
  choice: Israeli ... ikisema, ‘Mkono wangu mwenyewe umeniokoa’
  alternative: Waisraeli ... wakisema, ‘Mikono yetu wenyewe imetuokoa’
  rationale: Kiebrania huiwasilisha Israeli kama nafsi moja ya kijumla na hutumia viwakilishi vya umoja; tafsiri imehifadhi mtazamo huo.
- issue: Wakala wa Mungu na idadi kubwa ya jeshi
  choice: siwezi kuwatia Wamidiani mikononi mwao
  alternative: sitawatia Wamidiani mikononi mwao
  rationale: Kauli inafuata uhusiano wa kifungu cha Kiebrania kati ya idadi iliyozidi na kutowakabidhi Wamidiani, bila kudokeza kwamba Mungu hana nguvu kabisa; hapa ‘siwezi’ inaeleza kutofaa kwa tendo hilo katika kusudi lililotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Sentensi imehifadhi Israeli kama umoja wa kijumla na imetumia nahau ya kawaida ‘mikononi mwao’ kwa wazo la kuwekwa chini ya mamlaka yao.
