base_translation:
  language: en
  yaml_path: translation/ot/judges/007/005.yaml
  text: So he brought the people down to the water[a], and Yahweh said to Gideon, “Everyone who laps the water with his tongue, as a dog laps, you shall set apart by himself; likewise everyone who kneels on his knees to drink.”
translation:
  language: sw
  text: Basi Gideoni akawateremsha watu hadi majini, naye Yahwe akamwambia Gideoni, “Kila atakayeramba maji kwa ulimi wake, kama mbwa arambavyo, umweke peke yake[a]; na kila atakayepiga magoti ili anywe, umweke pia peke yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umtenge kando”; kitenzi kinaweza kumaanisha kumweka au kumpanga mtu tofauti.
    reason: Mbadala wa kileksika kwa תַּצִּיג אוֹתוֹ לְבָד.
lexical_decisions:
- source_word: וַיּוֹרֶד
  choice: akawateremsha
  rationale: Hifili ya ירד ina maana ya kusababisha washuke; ‘akawateremsha’ huhifadhi maana hiyo ya kisababishi kwa Kiswahili cha kawaida.
- source_word: הָעָם
  choice: watu
  rationale: עם ni nomino ya jumla inayomaanisha ‘watu’; ingawa muktadha ni wa kijeshi, hakuna haja ya kuibana kuwa ‘askari’.
- source_word: אֶל הַמָּיִם
  choice: mpaka kwenye maji
  rationale: Hueleza mahali walipoteremshwa kwa Kiswahili cha asili, huku מים ikitafsiriwa kama nomino ya wingi inayotumika kwa maana ya kitu kisichohesabika.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo la Kiswahili ‘Yahwe’ badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: כֹּל אֲשֶׁר יָלֹק
  choice: Kila atakayeramba
  rationale: Muundo huu unamhusu kila mtu mmoja mmoja, na ‘kuramba’ huhifadhi picha halisi ya tendo hilo.
- source_word: בִּלְשׁוֹנוֹ
  choice: kwa ulimi wake
  rationale: Huhifadhi kiambishi cha nafsi ya tatu umoja na picha mahususi ya kutumia ulimi.
- source_word: כַּאֲשֶׁר יָלֹק הַכֶּלֶב
  choice: kama mbwa anavyoramba
  rationale: Huhifadhi ulinganisho wa wazi na wa kawaida katika Kiswahili.
- source_word: תַּצִּיג אוֹתוֹ לְבָד
  choice: umtenganishe na wengine
  rationale: יצג katika hifili pamoja na לבד inaonyesha kumweka mtu katika kundi tofauti; usemi huu ni wa asili na unaonyesha tendo la kuwatenga.
- source_word: וְכֹל אֲשֶׁר יִכְרַע עַל בִּרְכָּיו לִשְׁתּוֹת
  choice: Vivyo hivyo, mtenganishe kila atakayepiga magoti ili anywe
  rationale: ‘Kupiga magoti’ ni njia ya kawaida ya kutafsiri כרע על ברכיו. Kitenzi cha kuwatenganisha kimerudiwa ili kukamilisha kwa Kiswahili agizo linaloeleweka pia katika muundo wa Kiebrania.
theological_decisions:
- issue: Uandikaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: ‘Yahwe’ huhifadhi jina binafsi lililo katika matini ya Kiebrania bila kulibadilisha kuwa cheo au kuingiza msimamo wa kimadhehebu.
- issue: Agizo linalohusu kundi la pili
  choice: Kitenzi ‘mtenganishe’ kimerudiwa kwa uwazi
  alternative: Kuacha kishazi kuwa ‘na kila atakayepiga magoti ili anywe’
  rationale: Kiebrania kinategemea agizo lililotangulia ili kueleza kitakachofanywa kwa kundi la pili. Kulirudia kwa Kiswahili huweka wazi uhusiano huo bila kudai kwamba kundi moja ndilo lililochaguliwa katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida huku picha ya kuramba kama mbwa na mgawanyo wa makundi ikihifadhiwa.
