base_translation:
  language: en
  yaml_path: translation/ot/judges/007/009.yaml
  text: And it happened that night that Yahweh said to him[a], “Arise, go down into the camp, for I have given it into your hand.”
translation:
  language: sw
  text: Ikawa usiku ule Yahwe akamwambia, “Inuka, ushuke kambini, kwa maana nimeitia mikononi mwako[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mikononi mwako”; ni msemo unaomaanisha chini ya uwezo au mamlaka yako.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi kazi ya וַיְהִי ya kuanzisha tukio jipya katika simulizi, kwa lugha ya Kiswahili iliyo fasaha na yenye hadhi.
- source_word: בַּלַּיְלָה הַהוּא
  choice: usiku ule
  rationale: Ni usemi wa kawaida wa Kiswahili unaorejelea usiku maalumu uliotajwa katika muktadha.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: akamwambia
  rationale: אמר ni kitenzi cha kawaida cha kusema; muundo huu pia unaendeleza mtiririko wa simulizi kwa kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la Kiebrania limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: קוּם
  choice: Inuka
  rationale: Amri hii inamtaka Gideoni achukue hatua mara moja; “Inuka” ni ya kawaida, wazi, na yenye hadhi.
- source_word: רֵד
  choice: ushuke
  rationale: Huwasilisha mwendo wa kwenda chini unaodokezwa na ירד na inafaa katika mazingira ya kijeshi na kijiografia.
- source_word: בַּמַּחֲנֶה
  choice: kambini
  rationale: Kiambishi mahali -ni huwasilisha mwendo wa kuingia kambini bila kuongeza wazo la kuishambulia.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya amri iliyotolewa na kuhifadhi nguvu ya kisababishi.
- source_word: נְתַתִּיו
  choice: nimeitia
  rationale: Wakati timilifu unaonyesha tendo la Mungu lililoamuliwa na kutimizwa kwa uhakika; kiambishi -i- kinarejelea kambi kama kiwakilishi cha jeshi la adui.
- source_word: בְּיָדֶךָ
  choice: mkononi mwako
  rationale: Huhifadhi sitiari ya Kiebrania ya kutiwa katika mkono wa mtu, yaani chini ya uwezo au mamlaka yake.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la Mungu, kwa hiyo limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo au umbo lisiloakisi kwa karibu ushahidi wa jina la Kiebrania.
- issue: Nguvu ya kauli נְתַתִּיו kuhusu ushindi
  choice: nimeitia
  alternative: nitaitia; ninaitia
  rationale: Timilifu ya Kiebrania inawasilisha kukabidhiwa kwa kambi kama jambo ambalo Mungu amelifanya kwa uhakika, hata kabla ushindi haujatokea katika simulizi; tafsiri haiondoi mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya simulizi la Biblia. Usemi “mkononi mwako” umehifadhiwa ili kuakisi sitiari ya Kiebrania, huku tanbihi ikifafanua maana yake.
