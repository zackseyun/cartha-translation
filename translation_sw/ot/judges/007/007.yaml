base_translation:
  language: en
  yaml_path: translation/ot/judges/007/007.yaml
  text: And Yahweh said to Gideon[a], “With the three hundred men who lapped, I will save you and give Midian into your hand. And let all the people go, each man to his place.”
translation:
  language: sw
  text: Yahwe akamwambia Gideoni, “Kwa wale wanaume mia tatu waliolamba, nitawaokoa na nitawatia Wamidiani mikononi mwako. Watu wote waende, kila mmoja mahali pake.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Imetafsiriwa kwa umbo la kawaida la Kiswahili la jina la agano la Mungu, badala ya cheo ‘BWANA’.
- source_word: בִּשְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: Kwa wale wanaume mia tatu
  rationale: ‘Kwa’ linahifadhi maana ya chombo au njia; kiashiria ‘wale’ kinatambulisha kundi mahususi lililotajwa katika muktadha.
- source_word: הַמֲלַקְקִים
  choice: waliolamba
  rationale: Linahifadhi tendo halisi lililowatambulisha bila kuongeza ‘maji,’ neno ambalo halirudiwi katika mstari huu.
- source_word: אוֹשִׁיעַ אֶתְכֶם
  choice: nitawaokoa
  rationale: Kiwakilishi cha wingi katika Kiebrania kinahifadhiwa; kitenzi kinaweza kumaanisha kuokoa au kukomboa katika hatari ya kijeshi.
- source_word: וְנָתַתִּי אֶת מִדְיָן בְּיָדֶךָ
  choice: na kumtia Midiani mkononi mwako
  rationale: Kinahifadhi nahau ya Kiebrania ya kumkabidhi adui katika mamlaka ya mtu, bila kuifupisha tu kuwa ‘kumshinda.’
- source_word: וְכָל הָעָם
  choice: Watu wengine wote
  rationale: ‘Watu’ linafuata neno la jumla la Kiebrania; ‘wengine’ linaweka wazi kwa Kiswahili kwamba wale mia tatu hawajumuishwi katika kundi linaloondoka.
- source_word: יֵלְכוּ
  choice: na waende
  rationale: Muundo huu wa Kiswahili unaonyesha nguvu ya amri au ruhusa ya imperfecti ya Kiebrania.
- source_word: אִישׁ לִמְקֹמוֹ
  choice: kila mmoja mahali pake
  rationale: Linahifadhi maana gawanyifu na neno ‘mahali,’ bila kulifafanua zaidi kuwa ‘nyumbani.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Chanzo kina Tetragramatoni moja kwa moja; ‘Yahwe’ huhifadhi jina hilo katika umbo linaloeleweka kwa wasomaji wa Kiswahili bila kulibadilisha kuwa cheo.
- issue: Mhusika wa kiwakilishi katika אוֹשִׁיעַ אֶתְכֶם
  choice: nitawaokoa
  alternative: nitakuokoa
  rationale: Kiebrania kina kiambishi cha yambwa cha wingi, kinachoweza kumhusisha Gideoni pamoja na Israeli; tafsiri ya wingi huhifadhi tofauti hiyo badala ya kuifuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya asili bila kupoteza nahau kuu ya Kiebrania ‘mkononi mwako.’ Hakuna alama za tanbihi kwa kuwa hakuna tanbihi iliyohitajika katika rasimu hii.
