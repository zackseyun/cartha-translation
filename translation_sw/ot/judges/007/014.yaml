base_translation:
  language: en
  yaml_path: translation/ot/judges/007/014.yaml
  text: His companion answered and said[a], “This is nothing other than the sword of Gideon son of Joash, a man of Israel[b]. God has given Midian and the whole camp into his hand.”
translation:
  language: sw
  text: Mwenzake akajibu, akasema, “Hili si kitu kingine isipokuwa upanga wa Gideoni mwana wa Yoashi, mwanaume wa Israeli[a]. Mungu amewatia Wamidiani pamoja na kambi yote mikononi mwake[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwisraeli.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “mikononi mwake”; hii ni nahau yenye maana ya kuwa chini ya uwezo au mamlaka yake.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן רֵעֵהוּ וַיֹּאמֶר
  choice: Mwenzake akajibu, akasema
  rationale: Inahifadhi mtindo wa simulizi wa Kiebrania wenye vitenzi viwili, huku ‘mwenzake’ ikifaa kwa muktadha wa watu waliomo kambini kuliko ‘rafiki yake.’
- source_word: אֵין זֹאת בִּלְתִּי אִם
  choice: Hili si kitu kingine isipokuwa
  rationale: Ni Kiswahili cha kawaida kinachoonyesha msisitizo wa usemi wa Kiebrania kwamba ndoto hiyo haiwezi kuwa na maana nyingine.
- source_word: חֶרֶב
  choice: upanga
  rationale: Inadumisha mfano halisi wa ndoto ambao unamtambulisha Gideoni kama chombo cha ushindi.
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: Gideoni mwana wa Yoashi
  rationale: Ni namna fupi na ya kawaida ya Kiswahili ya kutafsiri jina pamoja na jina la baba.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: mtu wa Israeli
  rationale: Inahifadhi neno la umoja אִישׁ na utambulisho wake kuwa wa Israeli bila kulifanya kuwa jina la taifa pekee.
- source_word: נָתַן הָאֱלֹהִים
  choice: Mungu amemtia
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo linalotajwa kwa uhakika kana kwamba tayari limeamuliwa, kama ilivyo katika tafsiri ya ndoto.
- source_word: אֶת מִדְיָן
  choice: Midiani
  rationale: Jina linahifadhiwa kama rejeo la pamoja kwa Midiani, adui wa Israeli katika muktadha huu.
- source_word: וְאֶת כָּל הַמַּחֲנֶה
  choice: pamoja na kambi yote
  rationale: ‘Kambi’ huhifadhi maana ya msingi ya מַחֲנֶה katika muktadha huu, na ‘yote’ huwakilisha כָּל.
- source_word: בְּיָדוֹ
  choice: mkononi mwake
  rationale: Inahifadhi nahau ya Kiebrania ya kumtia mtu au kundi mkononi mwa mwingine, yaani chini ya uwezo au mamlaka yake.
theological_decisions:
- issue: Maana ya אִישׁ יִשְׂרָאֵל
  choice: mtu wa Israeli
  alternative: Mwisraeli
  rationale: Neno la Kiebrania linamtaja Gideoni waziwazi kama mtu mwanamume wa Israeli; tafsiri hii huhifadhi umoja na maelezo hayo bila kuongeza wazo la kiteolojia.
- issue: Wakati wa נָתַן katika tamko la uhakika
  choice: Mungu amemtia
  alternative: Mungu alimtia
  rationale: Wakati timilifu unaonyesha ushindi kama jambo lililokwisha kuamuliwa kwa hakika katika tafsiri ya ndoto, bila kudai zaidi ya maandishi.
- issue: Nahau ya בְּיָדוֹ
  choice: mkononi mwake
  alternative: chini ya mamlaka yake
  rationale: Nahau halisi imehifadhiwa katika maandishi, huku tanbihi ikifafanua maana yake ya kuwa chini ya uwezo au udhibiti wa Gideoni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa sasa na heshima inayofaa maandiko. Muundo wa Kiebrania umehifadhiwa pale unapobaki wazi kwa msomaji wa kawaida; nahau ya ‘mkononi mwake’ imefafanuliwa kwa tanbihi.
