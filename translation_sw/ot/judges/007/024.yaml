  text: וּ/מַלְאָכִ֡ים שָׁלַ֣ח גִּדְעוֹן֩ בְּ/כָל הַ֨ר אֶפְרַ֜יִם לֵ/אמֹ֗ר רְד֞וּ לִ/קְרַ֤את מִדְיָן֙ וְ/לִכְד֤וּ לָ/הֶם֙ אֶת הַ/מַּ֔יִם עַ֛ד בֵּ֥ית בָּרָ֖ה וְ/אֶת הַ/יַּרְדֵּ֑ן וַ/יִּצָּעֵ֞ק כָּל אִ֤ישׁ אֶפְרַ֨יִם֙ וַ/יִּלְכְּד֣וּ אֶת הַ/מַּ֔יִם עַ֛ד בֵּ֥ית בָּרָ֖ה וְ/אֶת הַ/יַּרְדֵּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/024.yaml
  text: And Gideon sent messengers throughout all the hill country of Ephraim[a], saying, “Come down against Midian, and seize the waters as far as Beth-barah, and the Jordan.” So every man of Ephraim was called out, and they seized the waters as far as Beth-barah[c][b], and the Jordan.
translation:
  language: sw
  text: Gideoni akatuma wajumbe katika eneo lote la vilima vya Efraimu, akisema, “Shukeni mkawakabili Wamidiani, mkayadhibiti maji[a] mpaka Beth-bara, na Yordani.” Basi wanaume wote wa Efraimu wakaitwa[b], nao wakayadhibiti maji mpaka Beth-bara, na Yordani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kwa maana halisi “maji”; huenda hapa neno hilo linamaanisha njia za maji au vivuko vya kimkakati.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kwa maana halisi “kila mwanamume wa Efraimu.” Kitenzi kilichotumiwa hapa ni kigumu; kinaweza kueleweka kwa karibu zaidi kuwa “akapiga kelele,” lakini katika muktadha huu kinaonyesha kwamba wanaume wa Efraimu waliitwa.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמַלְאָכִים
  choice: wajumbe
  rationale: Katika simulizi hili ni watu waliotumwa kupeleka ujumbe, si malaika.
- source_word: בְּכָל הַר אֶפְרַיִם
  choice: katika nchi yote ya vilima ya Efraimu
  rationale: הַר hapa inataja eneo la vilima la Efraimu, wala si kilele kimoja.
- source_word: רְדוּ לִקְרַאת מִדְיָן
  choice: Shukeni mkawakabili Wamidiani
  rationale: Imperativi inadumisha mwendo wa kushuka kutoka vilimani, na לִקְרַאת katika muktadha wa kijeshi ina maana ya kwenda kuwakabili au kuwazuia.
- source_word: וְלִכְדוּ לָהֶם אֶת הַמַּיִם
  choice: mkayadhibiti maji
  rationale: לכד ni kutwaa au kushika; “kuyadhibiti” huwasilisha kwa Kiswahili cha kawaida tendo la kushika maeneo ya kimkakati. “Maji” yanahifadhi upana wa Kiebrania, huku tanbihi ikieleza uwezekano wa njia za maji au vivuko.
- source_word: עַד בֵּית בָּרָה
  choice: mpaka Beth-bara
  rationale: עַד huonyesha kikomo cha eneo, na jina la mahali limetoholewa kwa uwazi bila kulifasiri.
- source_word: וְאֶת הַיַּרְדֵּן
  choice: pamoja na Yordani
  rationale: Kishirikishi kinaonyesha kwamba Yordani pia ilipaswa kudhibitiwa; jina linalotambulika kwa kawaida katika Kiswahili limetumiwa.
- source_word: וַיִּצָּעֵק כָּל אִישׁ אֶפְרַיִם
  choice: wanaume wote wa Efraimu wakakusanywa
  rationale: Umbo la Kiebrania ni gumu, lakini muktadha wa wajumbe wa Gideoni unapendelea maana ya kuitwa na kukusanywa. Wingi wa Kiswahili unawakilisha nomino ya umoja yenye maana ya jumla, “kila mwanamume.”
- source_word: וַיִּלְכְּדוּ
  choice: wakayadhibiti
  rationale: Chaguo lilelile limerudiwa ili kudumisha ulinganifu wa mzizi na amri iliyotangulia.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Wamidiani” limetumiwa kwa watu wa Midiani, na “nchi ya vilima” kwa eneo la kijiografia. Lugha imeepuka ufafanuzi wa kimadhehebu na imehifadhi utata wa “maji” katika tanbihi.
