  text: Lakini ikiwa unaogopa kushuka, shuka uende kambini pamoja na Pura, mtumishi wako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kijana wako” au “msaidizi wako.” Neno la Kiebrania na‘ar linaweza kumaanisha kijana, mtumishi, au msaidizi, kulingana na muktadha.
