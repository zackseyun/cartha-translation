lexical_decisions:
- source_word: וְאִם
  choice: Lakini ikiwa
  rationale: Muunganiko huu unaanzisha sharti lenye utofautishaji mdogo na amri iliyotangulia; “Lakini ikiwa” ni ya kawaida na wazi katika Kiswahili.
- source_word: יָרֵא אַתָּה
  choice: unaogopa
  rationale: Hueleza hali ya Gideoni kwa lugha ya sasa na ya kawaida bila kupunguza maana ya hofu.
- source_word: לָרֶדֶת ... רֵד
  choice: kushuka ... shuka
  rationale: Marudio ya mzizi ירד yamehifadhiwa ili kudumisha mkazo wa usemi wa Kiebrania.
- source_word: וּפֻרָה
  choice: pamoja na Pura
  rationale: Kiunganishi hapa kinaonyesha kuwa Pura ataandamana na Gideoni; “pamoja na” huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: נַעַרְךָ
  choice: mtumishi wako
  rationale: Katika muktadha huu נַעַר humtaja Pura kama mtu aliye chini ya Gideoni na anayeandamana naye. “Mtumishi wako” ni ya asili katika Kiswahili, huku maana nyingine zinazowezekana zikihifadhiwa katika tanbihi.
- source_word: אֶל הַמַּחֲנֶה
  choice: kambini
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kusema kuelekea kwenye kambi; haiongezi kwa lazima wazo la kuingia ndani kabisa ya kambi.
