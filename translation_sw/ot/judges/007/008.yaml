translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wa heshima. Jina 'Gideoni' limetajwa ili kuweka wazi kiima cha vitenzi vya umoja, ambacho hakitajwi wazi katika mstari huu wa Kiebrania lakini kinaeleweka kutokana na muktadha. Alama ya tanbihi [a] imewekwa baada ya kifungu kinachohusika.
