  text: וַ/יִּקְח֣וּ אֶת צֵדָה֩ הָ/עָ֨ם בְּ/יָדָ֜/ם וְ/אֵ֣ת שׁוֹפְרֹֽתֵי/הֶ֗ם וְ/אֵ֨ת כָּל אִ֤ישׁ יִשְׂרָאֵל֙ שִׁלַּח֙ אִ֣ישׁ לְ/אֹֽהָלָ֔י/ו וּ/בִ/שְׁלֹשׁ מֵא֥וֹת הָ/אִ֖ישׁ הֶֽחֱזִ֑יק וּ/מַחֲנֵ֣ה מִדְיָ֔ן הָ֥יָה ל֖/וֹ מִ/תַּ֥חַת בָּ/עֵֽמֶק־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/008.yaml
  text: So they took the provisions of the people in their hands[a], along with their trumpets. And he sent every man of Israel, each to his tent, but retained the three hundred men. And the camp of Midian was below him in the valley.
translation:
  language: sw
  text: Basi wakachukua mikononi mwao mahitaji ya watu, pamoja na tarumbeta zao.[a] Gideoni akawaruhusu wanaume wote wa Israeli waende, kila mmoja kwenye hema lake, lakini akawabakiza wale watu mia tatu. Kambi ya Midiani ilikuwa chini yake bondeni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pembe zao” au “pembe zao za kondoo dume”; neno la Kiebrania linamaanisha pembe iliyotumiwa kama ala ya kutoa ishara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: wakachukua
  rationale: Kauli ya usimulizi ya לקח inaelezwa kwa kitenzi cha wakati uliopita kinachoendeleza simulizi. Kiima cha wingi kinaeleweka kutokana na muktadha kuwa wale watu mia tatu waliochaguliwa.
- source_word: צֵדָה הָעָם
  choice: vyakula vya wale watu wengine
  rationale: צֵדָה ni mahitaji ya chakula ya safari au jeshi. Neno 'vyakula' ni la kawaida na wazi; 'wale watu wengine' linafafanua tofauti kati ya wale mia tatu na jeshi lililoachishwa bila kubadili maana ya muktadha.
- source_word: בְּיָדָם
  choice: mikononi mwao
  rationale: Inahifadhi taswira halisi ya Kiebrania na kuonyesha kwamba watu hao mia tatu walivichukua au kuvibeba.
- source_word: שׁוֹפְרֹתֵיהֶם
  choice: tarumbeta zao
  rationale: שׁוֹפָר ni pembe iliyotumiwa kama ala ya kutoa ishara. 'Tarumbeta' ni neno la kawaida la Kiswahili kwa kazi hiyo; tanbihi inahifadhi umbo halisi la ala.
- source_word: שִׁלַּח
  choice: akawaacha ... waende
  rationale: Katika muktadha huu שלח humaanisha kuwaruhusu au kuwaagiza waondoke. Usemi huu ni wa asili kwa Kiswahili kuliko tafsiri ngumu ya moja kwa moja ya 'aliwatuma,' huku ukihifadhi kitendo cha Gideoni.
- source_word: כָּל אִישׁ יִשְׂרָאֵל ... אִישׁ לְאֹהָלָיו
  choice: watu wengine wote wa Israeli ... kila mmoja kwenye hema lake
  rationale: Inahifadhi mgawanyo wa Kiebrania, ambapo kila askari anarudi kwenye hema lake. 'Watu' hapa inawahusu wanaume wa jeshi kulingana na muktadha.
- source_word: וּבִשְׁלֹשׁ מֵאוֹת הָאִישׁ הֶחֱזִיק
  choice: lakini akawabaki na wale watu mia tatu
  rationale: הֶחֱזִיק hapa ni kuwashikilia au kuwabakiza. 'Akawabaki na' ni usemi wa kawaida unaoonyesha tofauti kati ya wale walioachishwa na kikosi kilichobaki.
- source_word: מַחֲנֵה מִדְיָן
  choice: Kambi ya Midiani
  rationale: Inahamisha moja kwa moja muundo wa Kiebrania unaoitambulisha kambi ya jeshi pinzani.
- source_word: מִתַּחַת בָּעֵמֶק
  choice: chini yake, bondeni
  rationale: 'Inahifadhi tofauti ya mwinuko: Gideoni alikuwa juu, nayo kambi ilikuwa chini katika bonde.'
