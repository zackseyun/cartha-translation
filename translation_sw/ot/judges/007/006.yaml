  yaml_path: translation/ot/judges/007/006.yaml
  text: And the number of those lapping with their hand to their mouth was three hundred men[a], but all the rest of the people knelt on their knees to drink water.
translation:
  language: sw
  text: Idadi ya wale waliolamba maji kwa mikono yao hadi vinywani mwao ilikuwa wanaume mia tatu[a], lakini watu wote waliobaki walipiga magoti kunywa maji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale waliolamba maji kwa mkono wao hadi kinywani mwao.” Kifungu cha Kiebrania kinasisitiza matumizi ya mkono katika kupeleka maji kinywani, kinyume na kupiga magoti kunywa maji moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: Idadi ya
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya nomino ya kiasi inayoanzisha hesabu ya kundi hili.
- source_word: הַמֲלַקְקִים
  choice: wale walioyaramba maji
  rationale: Kitenzi 'kuramba' kinahifadhi taswira dhahiri ya tendo linalotofautisha kundi hili; 'maji' yamewekwa wazi kutokana na muktadha na kishazi cha mwisho.
- source_word: בְּיָדָם אֶל־פִּיהֶם
  choice: kwa kuyapeleka kwa mkono mdomoni
  rationale: Kiswahili hiki cha kawaida kinaonyesha kwamba kila mtu aliyachota maji kwa mkono na kuyapeleka mdomoni, badala ya kuinama na kunywa moja kwa moja.
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: wanaume mia tatu
  rationale: Neno אִישׁ linafaa kutafsiriwa 'wanaume' katika muktadha huu wa jeshi.
- source_word: וְכֹל יֶתֶר הָעָם
  choice: lakini watu wengine wote
  rationale: Ingawa וְ inaweza kuwa 'na,' 'lakini' huonyesha kwa kawaida tofauti kati ya wale mia tatu na kundi lililobaki.
- source_word: כָּרְעוּ עַל בִּרְכֵיהֶם
  choice: walipiga magoti
  rationale: Nahau hii ya Kiswahili inaeleza wazi mkao wa kupiga magoti bila urudiaji usio wa lazima.
- source_word: לִשְׁתּוֹת מָיִם
  choice: ili kunywa maji
  rationale: Inaonyesha kusudi la kupiga magoti na kudumisha kutajwa wazi kwa maji katika Kiebrania.
