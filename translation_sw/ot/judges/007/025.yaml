  text: וַֽ/יִּלְכְּד֡וּ שְׁנֵֽי שָׂרֵ֨י מִדְיָ֜ן אֶת עֹרֵ֣ב וְ/אֶת זְאֵ֗ב וַ/יַּהַרְג֨וּ אֶת עוֹרֵ֤ב בְּ/צוּר עוֹרֵב֙ וְ/אֶת זְאֵב֙ הָרְג֣וּ בְ/יֶֽקֶב זְאֵ֔ב וַֽ/יִּרְדְּפ֖וּ אֶל מִדְיָ֑ן וְ/רֹאשׁ עֹרֵ֣ב וּ/זְאֵ֔ב הֵבִ֨יאוּ֙ אֶל גִּדְע֔וֹן מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/025.yaml
  text: And they captured the two princes of Midian[a], Oreb and Zeeb. They killed Oreb at the rock of Oreb, and they killed Zeeb at the winepress of Zeeb. Then they pursued Midian[b], and they brought the heads of Oreb and Zeeb to Gideon from across the Jordan.
translation:
  language: sw
  text: Wakawakamata wakuu wawili wa Midiani, Orebu na Zeebu.[a] Wakamuua Orebu kwenye Mwamba wa Orebu, na Zeebu wakamuua mahali pa kukamulia zabibu pa Zeebu. Kisha wakaendelea kuwafuatilia Wamidiani, wakavileta vichwa vya Orebu na Zeebu kwa Gideoni kutoka ng’ambo ya Yordani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Majina Orebu na Zeebu yanahusiana na maneno ya Kiebrania yanayomaanisha “kunguru” na “mbwa mwitu,” lakini katika maandishi yametolewa kama majina ya watu.
    reason: lexical_alternative
  - marker: b
    text: Au “kutoka upande wa pili wa Yordani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: wakuu
  rationale: Neno שַׂר humaanisha mtawala, mkuu au kiongozi mwenye cheo. “Wakuu” ni Kiswahili cha kawaida na chenye hadhi kinachofaa kwa viongozi hawa wa kisiasa na kijeshi bila kudokeza mfumo maalumu wa kifalme.
- source_word: וַיִּלְכְּדוּ
  choice: wakawakamata
  rationale: Kitenzi לָכַד katika muktadha wa vita humaanisha kukamata au kuteka. “Wakawakamata” kinaonyesha wazi kuwa watu hao wawili walishikwa.
- source_word: עֹרֵב
  choice: Orebu
  rationale: Hili ni jina la mtu, kwa hiyo limetoholewa badala ya kutafsiriwa, ingawa linahusiana na neno la Kiebrania linalomaanisha kunguru.
- source_word: זְאֵב
  choice: Zeebu
  rationale: Hili ni jina la mtu, kwa hiyo limetoholewa badala ya kutafsiriwa, ingawa maana ya kawaida ya neno hilo ni mbwa mwitu.
- source_word: בְּצוּר עוֹרֵב
  choice: kwenye Mwamba wa Orebu
  rationale: צוּר ni mwamba au jabali. “Kwenye Mwamba wa Orebu” ni usemi wa asili unaohifadhi muundo wa jina la mahali; herufi kubwa inaonyesha kuwa hapa limetumiwa kama jina la eneo.
- source_word: בְיֶקֶב זְאֵב
  choice: kwenye Shinikizo la Divai la Zeebu
  rationale: יֶקֶב ni shinikizo au kinu cha kukamulia zabibu. “Kwenye” haibani maana kuwa ndani au juu ya mahali hapo, na muundo huu unahifadhi jina la eneo.
- source_word: וַיִּרְדְּפוּ אֶל מִדְיָן
  choice: wakaendelea kuwafuatilia Wamidiani
  rationale: רָדַף pamoja na אֶל hapa inaeleza kuendelea kwa msako dhidi ya Midiani. “Wamidiani” huonyesha kwa kawaida kwamba waliokuwa wakifuatiliwa ni watu au jeshi la Midiani, si eneo lenyewe.
- source_word: וְרֹאשׁ עֹרֵב וּזְאֵב
  choice: wakavileta vichwa vya Orebu na Zeebu
  rationale: Ingawa רֹאשׁ iko katika umoja, majina mawili yaliyounganishwa yana maana ya kugawanya kwa kila mmoja; Kiswahili cha kawaida huhitaji wingi “vichwa” ili kuonyesha kwamba kichwa cha kila mtu kililetwa.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: kutoka ng’ambo ya Yordani
  rationale: Kirai hiki kinaweza kumaanisha kutoka upande wa pili au ng’ambo ya Yordani. Tafsiri hii ni ya kawaida na inaacha mtazamo wa kijiografia kama ulivyo katika chanzo.
