  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Mfuatano wa vitenzi vya “waka-” unadumisha mwendo wa simulizi la Kiebrania. Majina yametoholewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili: Orebu, Zeebu, Gideoni, Midiani na Yordani.'
