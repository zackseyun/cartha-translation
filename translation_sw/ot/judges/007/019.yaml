base_translation:
  language: en
  yaml_path: translation/ot/judges/007/019.yaml
  text: So Gideon and the hundred men who were with him came to the edge of the camp at the beginning of the middle watch[a], just as they had posted the watchmen[c][b]; and they blew the trumpets and smashed the jars that were in their hands.
translation:
  language: sw
  text: Basi Gideoni na wale watu mia moja waliokuwa pamoja naye wakafika ukingoni mwa kambi mwanzoni mwa zamu ya kati ya ulinzi wa usiku[a], mara tu baada ya walinzi kuwekwa[b]. Wakapiga baragumu[c] na kuvunja mitungi iliyokuwa mikononi mwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “zamu ya pili ya ulinzi.” Kiebrania kinarejelea mgawanyo wa vipindi vya ulinzi wakati wa usiku.
    reason: lexical_alternative
  - marker: b
    text: Au “wakati walipokuwa wamewaweka walinzi tu” au “mara tu walipowapanga walinzi vituoni.” Muundo wa Kiebrania unakazia tendo la kuwaweka walinzi.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania shofarot, yaani pembe zilizopulizwa ili kutoa ishara.
    reason: cultural_note
lexical_decisions:
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: ukingoni mwa kambi
  rationale: קָצֶה humaanisha mwisho au ukingo; usemi huu ni wa kawaida katika Kiswahili na unahifadhi maana ya mahali.
- source_word: רֹאשׁ הָאַשְׁמֹרֶת הַתִּיכוֹנָה
  choice: mwanzoni mwa zamu ya kati ya ulinzi wa usiku
  rationale: רֹאשׁ hapa ni mwanzo wa kipindi, na אַשְׁמֹרֶת ni zamu ya ulinzi wakati wa usiku. Kutaja usiku kunafanya maana iwe wazi kwa msomaji wa sasa.
- source_word: אַךְ הָקֵם הֵקִימוּ אֶת הַשֹּׁמְרִים
  choice: mara tu walinzi walipokuwa wamewekwa
  rationale: אַךְ huonyesha wakati wa karibu kabisa, nayo infinitivi kamili pamoja na kitenzi cha Hifili hukazia tendo la kuwaweka walinzi. Tafsiri hii huhifadhi tukio la kufika wakati kubadilishwa au kuwekwa kwa walinzi kumetoka kutokea bila kulazimisha maana moja zaidi ya Kiebrania.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: wakapiga baragumu
  rationale: שׁוֹפָרוֹת ni pembe za kupulizwa kwa ishara. “Baragumu” ni neno la Kibiblia linaloeleweka kwa ala ya kupulizwa, huku tanbihi ikifafanua aina yake.
- source_word: וְנָפוֹץ הַכַּדִּים
  choice: na kuvunja mitungi
  rationale: נפץ huonyesha kuvunja kwa nguvu, na כַּד ni mtungi au chombo cha kubebea. “Kuvunja mitungi” ni wazi na haiongezi kwamba ilikuwa ya udongo, jambo lisilotajwa moja kwa moja hapa.
- source_word: אֲשֶׁר בְּיָדָם
  choice: waliyokuwa wameishika
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya mitungi iliyokuwa mikononi mwao bila kuiga muundo wa Kiebrania kwa ugumu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Zamu ya kati ya ulinzi wa usiku” huweka wazi mazingira ya usiku; “baragumu” huhifadhi msamiati unaofahamika wa Kibiblia huku tanbihi ikitoa ufafanuzi wa kihistoria.
