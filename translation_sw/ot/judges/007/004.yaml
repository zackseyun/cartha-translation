base_translation:
  language: en
  yaml_path: translation/ot/judges/007/004.yaml
  text: 'Then the LORD said to Gideon, “The people are still too many. Bring them down to the water, and there I will test them for you. And this is what will happen: anyone of whom I say to you, ‘This one shall go with you,’ he shall go with you; but anyone of whom I say to you, ‘This one shall not go with you,’ he shall not go.”'
translation:
  language: sw
  text: Kisha BWANA akamwambia Gideoni, “Watu bado ni wengi mno. Washushe mpaka majini, nami nitawachuja huko kwa ajili yako. Yule nitakayekuambia, ‘Huyu ataenda pamoja nawe,’ huyo ataenda pamoja nawe; lakini yule nitakayekuambia, ‘Huyu hataenda pamoja nawe,’ huyo hataenda.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea katika Biblia za Kiswahili ya kuwakilisha jina la agano YHWH kwa ‘BWANA’ kwa herufi kubwa.
- source_word: הוֹרֵד אוֹתָם אֶל־הַמַּיִם
  choice: Washushe mpaka majini
  rationale: ‘Washushe’ huhifadhi wazo la mwendo wa kwenda chini, na ‘mpaka majini’ ni Kiswahili cha kawaida kinachoonyesha walengwa wa mwendo huo.
- source_word: וְאֶצְרְפֶנּוּ
  choice: nami nitawachuja
  rationale: Kitenzi צרף kimsingi huhusiana na kusafisha au kupima kwa kutenganisha; katika muktadha huu ‘kuwachuja’ huwasilisha tendo la kuwapima na kuwateua bila kulifanya kuwa jaribio la kiakili pekee.
- source_word: זֶה יֵלֵךְ אִתָּךְ
  choice: Huyu ataenda pamoja nawe
  rationale: Huhifadhi usemi wa moja kwa moja na msisitizo wa mtu mmoja mmoja uliomo katika זֶה na אִתָּךְ.
- source_word: זֶה לֹא יֵלֵךְ עִמָּךְ
  choice: Huyu hataenda pamoja nawe
  rationale: Huhifadhi ulinganifu wa kishazi chanya na hasi katika Kiebrania.
theological_decisions:
- issue: Mhusika anayefanya uteuzi
  choice: Mungu ndiye anayesema ni nani atakayeenda au hatakayeenda
  alternative: Gideoni awachunguze na kuamua mwenyewe
  rationale: Matini inasema mara mbili ‘nitakayekuambia,’ hivyo uamuzi unatokana na BWANA, ingawa uchujaji unafanywa kwa ajili ya Gideoni.
- issue: Maana ya צרף katika muktadha wa uteuzi
  choice: ‘nitawachuja’
  alternative: ‘nitawajaribu’ au ‘nitawasafisha’
  rationale: ‘Nitawachuja’ huhifadhi taswira ya kutenganisha kundi kwa ajili ya uteuzi na haiongezi madai kwamba watu hao wanapimwa kimaadili au kiroho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kurudiarudia ‘huyo ataenda… huyo hataenda’ umehifadhiwa kwa sababu ni sehemu ya msisitizo wa matini ya Kiebrania.
