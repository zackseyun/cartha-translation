base_translation:
  language: en
  yaml_path: translation/ot/judges/007/023.yaml
  text: And the men of Israel were called out from Naphtali[a], from Asher, and from all Manasseh[c][b], and they pursued Midian.
translation:
  language: sw
  text: Ndipo wanaume wa Israeli wakaitwa kutoka Naftali[a], kutoka Asheri, na kutoka Manase yote; nao wakawafuatilia Wamidiani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakakusanywa”; au, kwa kufuata maana ya kawaida ya mzizi wa kitenzi, “wakapiga kelele.” Kitenzi cha Kiebrania kinaweza kueleweka kwa njia tofauti hapa; katika muktadha kinahusu kuitwa au kukusanywa kwa Waisraeli ili wawafuatilie adui.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania “Midiani”; hapa jina hilo linamaanisha majeshi ya Wamidiani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק
  choice: wakaitwa
  rationale: Nifali ya צעק katika muktadha huu inaelekea kuonyesha kuitwa au kukusanywa kwa ajili ya kuwafuatilia adui. “Wakaitwa” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kulazimisha tafsiri ya “wakapiga kelele.”
- source_word: אִישׁ יִשְׂרָאֵל
  choice: wanaume wa Israeli
  rationale: Ingawa אִישׁ iko katika umoja, hapa ni usemi wa kijumla; kitenzi cha wingi וַיִּרְדְּפוּ kinathibitisha maana ya wingi. “Wanaume wa Israeli” pia huhifadhi rejeo la kiume la Kiebrania.
- source_word: מִנַּפְתָּלִי
  choice: kutoka Naftali
  rationale: Kihusishi מן kinaonyesha mahali au kundi walikotoka walioitwa.
- source_word: וּמִן אָשֵׁר
  choice: kutoka Asheri
  rationale: Inaendeleza orodha ya makabila ambako wanaume waliitwa.
- source_word: וּמִן כָּל מְנַשֶּׁה
  choice: kutoka Manase yote
  rationale: “Manase yote” huhifadhi nguvu ya כָּל na kueleweka kama eneo au kabila lote la Manase bila kuongeza maneno yasiyokuwapo katika chanzo.
- source_word: וַיִּרְדְּפוּ
  choice: wakawafuatilia
  rationale: רדף katika simulizi la kijeshi humaanisha kumfuata adui kwa lengo la kumkamata au kumshambulia; “kuwafuatilia” ni ya kawaida na sahihi katika Kiswahili.
- source_word: אַחֲרֵי מִדְיָן
  choice: Wamidiani
  rationale: Baada ya kitenzi cha kufuatilia, Kiswahili hutumia yambwa moja kwa moja. “Midiani” hapa humaanisha jeshi au watu wa Midiani, hivyo “Wamidiani” huweka maana wazi na ya asili.
