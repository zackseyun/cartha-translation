  yaml_path: translation/ot/judges/007/011.yaml
  text: and you will hear what they are saying[a], and afterward your hands will be strengthened[b], and you will go down into the camp.” So he went down with Purah his servant to the edge of the armed men who were in the camp.
translation:
  language: sw
  text: “Nawe utasikia wanayosema. Baada ya hayo, mikono yako itatiwa nguvu, nawe utashuka kuingia kambini.” Basi akashuka pamoja na Pura, mtumishi wake[a], mpaka pembezoni mwa watu wenye silaha[b] waliokuwa kambini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kijana wake” au “mhudumu wake”; neno la Kiebrania linaweza kuwa na maana yoyote kati ya hizi.
    reason: lexical_alternative
  - marker: b
    text: Au “mpaka pembezoni mwa askari waliojiandaa kwa vita”; neno la Kiebrania linaweza kumaanisha watu wenye silaha au walioandaliwa kwa mapigano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ מַה יְדַבֵּרוּ
  choice: Nawe utasikia wanayosema
  rationale: Kitenzi cha Kiebrania kina maana ya wakati ujao katika mfuatano huu, na usemi huu unaeleza kusikia mazungumzo ya watu wa kambini.
- source_word: וְאַחַר
  choice: Baada ya hayo
  rationale: 'Huhifadhi wazi mfuatano wa matukio: kwanza atasikia, kisha atapata nguvu.'
- source_word: תֶּחֱזַקְנָה יָדֶיךָ
  choice: mikono yako itatiwa nguvu
  rationale: Huhifadhi taswira halisi ya Kiebrania ya mikono kutiwa nguvu, ambayo katika muktadha inaashiria kupata ujasiri na azimio.
- source_word: וְיָרַדְתָּ בַּמַּחֲנֶה
  choice: nawe utashuka kuingia kambini
  rationale: ‘Kushuka’ huhifadhi maana ya ירד, na ‘kuingia kambini’ huonyesha mwendo unaoelekezwa ndani ya kambi.
- source_word: וַיֵּרֶד הוּא
  choice: Basi akashuka
  rationale: Muundo huu unaendeleza simulizi na unaonyesha kuwa alifuata agizo alilopewa.
- source_word: וּפֻרָה
  choice: Pura
  rationale: Jina limetoholewa kwa tahajia ya kawaida na rahisi ya Kiswahili.
- source_word: נַעֲרוֹ
  choice: mtumishi wake
  rationale: Ingawa נַעַר kimsingi inaweza kumaanisha kijana, katika muktadha huu inamtaja mtu aliyefuatana naye na kumhudumia; ‘mtumishi’ ni ya asili zaidi katika Kiswahili bila kudai cheo rasmi.
- source_word: אֶל קְצֵה
  choice: mpaka kwenye ukingo wa
  rationale: קצה humaanisha mwisho, ukingo, au sehemu ya nje; ‘ukingo’ huhifadhi taswira ya kufika pembezoni.
- source_word: הַחֲמֻשִׁים
  choice: watu wenye silaha
  rationale: Neno hilo linawataja watu walioandaliwa au kuwekewa silaha kwa ajili ya vita, wala halimaanishi hapa idadi fulani.
- source_word: אֲשֶׁר בַּמַּחֲנֶה
  choice: waliokuwa kambini
  rationale: Kishazi hiki kinawatambulisha watu wenye silaha kuwa walikuwamo kambini.
theological_decisions:
- issue: Nahau ya mikono kutiwa nguvu
  choice: Kuhifadhi ‘mikono yako itatiwa nguvu’
  alternative: ‘utapata nguvu/ujasiri’
  rationale: Tafsiri iliyochaguliwa huhifadhi taswira na mvutano wa lugha ya chanzo bila kufafanua kimya kimya kuwa inahusu ujasiri pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima, na unaosomeka kwa urahisi. Nahau ya Kiebrania kuhusu mikono imehifadhiwa, huku maana mbadala za נַעַר na הַחֲמֻשִׁים zikielezwa katika tanbihi. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
