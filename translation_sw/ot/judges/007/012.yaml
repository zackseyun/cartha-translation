base_translation:
  language: en
  yaml_path: translation/ot/judges/007/012.yaml
  text: Midian and Amalek and all the people of the East were lying in the valley as numerous as locusts[a], and their camels were without number[b], as the sand on the seashore in abundance.
translation:
  language: sw
  text: Wamidiani, Waamaleki, na watu wote wa Mashariki[a] walikuwa wameenea[b] bondeni, wengi kama nzige. Ngamia wao hawakuwa na hesabu, wengi kama mchanga ulio ufuoni mwa bahari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “wana wa Mashariki.”
    reason: lexical_alternative
  - marker: b
    text: Au “walikuwa wamelala” au “walikuwa wameanguka.” Neno la Kiebrania kwa msingi humaanisha “wanaanguka/wameanguka,” lakini hapa linaeleza jeshi lililokuwa limeenea na kupiga kambi bondeni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדְיָן וַעֲמָלֵק
  choice: Wamidiani, Waamaleki
  rationale: Majina ya makundi ya watu yametolewa kwa maumbo ya kawaida ya Kiswahili, bila kuongeza kiashirio cha wakati ambacho hakipo wazi katika Kiebrania.
- source_word: בְּנֵי קֶדֶם
  choice: watu wote wa Mashariki
  rationale: Ingawa maana ya neno kwa neno ni ‘wana wa Mashariki,’ huu ni usemi wa Kiebrania unaotaja makundi ya watu wa maeneo ya mashariki; ‘watu wa Mashariki’ ni wazi na wa kawaida kwa msomaji wa Kiswahili.
- source_word: נֹפְלִים
  choice: walikuwa wametapakaa
  rationale: Kitenzi-shirikishi hiki kwa msingi humaanisha ‘wanaanguka/wameanguka,’ lakini katika muktadha wa jeshi bondeni kinaeleza watu waliolala au waliotawanyika katika kambi. ‘Walikuwa wametapakaa’ huhifadhi picha ya jeshi lililoenea mahali hapo bila kuifanya tafsiri kuwa maelezo marefu.
- source_word: בָּעֵמֶק
  choice: bondeni
  rationale: עֵמֶק kwa kawaida humaanisha bonde; ‘bondeni’ ni tafsiri fupi na ya asili katika Kiswahili.
- source_word: כָּאַרְבֶּה לָרֹב
  choice: wengi kama nzige
  rationale: Usemi huu unalinganisha wingi wa jeshi na kundi kubwa la nzige. Tafsiri hii huhifadhi tashbihi na mkazo wa idadi kubwa.
- source_word: לִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: Ngamia wao hawakuwa na hesabu
  rationale: Huhifadhi kwa karibu nahau ya Kiebrania, ‘hakuna hesabu,’ huku ikiwa sentensi inayoeleweka kwa Kiswahili.
- source_word: כַּחוֹל שֶׁעַל שְׂפַת הַיָּם לָרֹב
  choice: wengi kama mchanga ulio ufuoni mwa bahari
  rationale: Huhifadhi tashbihi ya mchanga wa ufukweni pamoja na neno la mwisho linalosisitiza wingi. ‘Wengi’ hapa linawarejelea ngamia na ni la kawaida katika Kiswahili.
