translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Marudio ya wazo la wingi yamehifadhiwa kwa sababu Kiebrania hulisisitiza mara mbili. Alama zote za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
