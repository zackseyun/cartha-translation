  text: Then he divided the three hundred men into three companies[a], and put trumpets into the hands of all of them, and empty jars[c][b], with torches inside the jars.
translation:
  language: sw
  text: Kisha akawagawa wale wanaume mia tatu katika vikundi vitatu[a]. Akawapa wote baragumu[b], mitungi mitupu[c], na mienge ndani ya mitungi hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “vichwa vitatu,” nahau yenye maana ya vikundi vitatu.
    reason: lexical_alternative
  - marker: b
    text: Au “pembe za kondoo-dume” zilizotumiwa kama baragumu (Kiebrania shofarot).
    reason: lexical_alternative
  - marker: c
    text: Au “magudulia matupu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַץ
  choice: akawagawa
  rationale: Kitenzi חצה hapa kinaonyesha kuligawa jeshi katika vikundi; ‘akawagawa’ ni cha kawaida na huhifadhi maana hiyo.
- source_word: שְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: wale wanaume mia tatu
  rationale: אִישׁ ni ‘mwanamume’; muktadha unaonyesha ni wapiganaji, lakini ‘wanaume’ huepuka kuongeza ufafanuzi usio wa lazima.
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: vikundi vitatu
  rationale: Kwa neno ni ‘vichwa vitatu,’ lakini hapa ni nahau ya migawanyo au vikundi vya watu.
- source_word: וַיִּתֵּן ... בְּיַד כֻּלָּם
  choice: akampa kila mmoja wao
  rationale: Muundo huu wa Kiswahili huwasilisha kwa kawaida maana ya kugawa vitu mikononi mwao wote, yaani kwa kila mtu.
- source_word: שׁוֹפָרוֹת
  choice: baragumu
  rationale: שׁוֹפָר ni pembe inayopulizwa kwa ishara; ‘baragumu’ ni neno la kawaida la Kibiblia na linaeleweka katika muktadha huu.
- source_word: כַדִּים רֵקִים
  choice: mtungi mtupu
  rationale: כַּד ni chombo kama mtungi au gudulia; umoja wa kugawanya kwa kila mtu umewekwa wazi kwa mtindo wa asili wa Kiswahili, huku רֵקִים ikitafsiriwa ‘mtupu.’
- source_word: לַפִּדִים
  choice: mwenge
  rationale: לַפִּיד humaanisha mwenge au kinga ya moto; ‘mwenge’ ni neno wazi na la sasa.
- source_word: בְּתוֹךְ הַכַּדִּים
  choice: ndani yake
  rationale: Huhifadhi mahali pa mienge ndani ya mitungi bila kurudia nomino kwa namna nzito katika Kiswahili.
