translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi wenye ‘aka-/ika-’ umetumiwa kuonyesha mfululizo wa matendo. Utata wa aina ya kelele umehifadhiwa katika maandishi na kufafanuliwa katika tanbihi.
