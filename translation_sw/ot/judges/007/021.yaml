  text: And each man stood in his place around the camp[a], and the whole camp ran, and they shouted and fled.
translation:
  language: sw
  text: Kila mtu akasimama mahali pake kuizunguka kambi, nayo kambi yote ikakimbia; wakapiga kelele[a] na wakakimbia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakapiga kelele za vita.” Kitenzi kilichotafsiriwa “wakapiga kelele” kinaweza kumaanisha kilio kikubwa cha vitani au cha hofu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: akasimama
  rationale: Kitenzi עמד humaanisha kusimama au kushika nafasi; hapa ‘akasimama’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אִישׁ תַּחְתָּיו
  choice: kila mtu ... mahali pake
  rationale: Nahau hii humaanisha kila mmoja akiwa katika nafasi yake; ‘kila mtu ... mahali pake’ huhifadhi maana ya mgawanyo na huleta Kiswahili cha kawaida.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: kuizunguka kambi
  rationale: סָבִיב pamoja na ל huonyesha mahali kuzunguka kambi; usemi huu ni wa asili na sahihi katika Kiswahili.
- source_word: וַיָּרָץ כָּל הַמַּחֲנֶה
  choice: kambi yote ikakimbia
  rationale: רץ kwa kawaida ni ‘kukimbia’; ‘kambi yote’ hapa humaanisha watu wote kambini na huhifadhi taswira ya Kiebrania bila kufafanua kupita kiasi.
- source_word: וַיָּרִיעוּ
  choice: wakapiga kelele
  rationale: רוע/ריע inaweza kumaanisha kutoa kilio kikubwa vitani au kwa hofu; ‘kupiga kelele’ huhifadhi uwezekano huo bila kuamua aina ya kilio.
- source_word: ויניסו
  choice: na kukimbia
  rationale: Kitenzi נוס humaanisha kukimbia kutoka hatarini; katika mfululizo huu, ‘na kukimbia’ ni cha kawaida na kinaepuka urudiaji usio wa asili wa viunganishi.
