base_translation:
  language: en
  yaml_path: translation/ot/judges/007/013.yaml
  text: 'When Gideon came[a], behold, a man was telling a dream to his companion. He said, “Look, I dreamed a dream: behold, a round loaf of barley bread was rolling around in the camp of Midian, and it came up to the tent and struck it so that it fell, He turned it upside down, and the tent collapsed.”'
translation:
  language: sw
  text: 'Gideoni alipofika, tazama, mtu mmoja alikuwa akimsimulia mwenzake ndoto. Akasema, “Tazama, nimeota ndoto: tazama, mkate wa shayiri wa mviringo[a] ulikuwa ukibingirika katika kambi ya Midiani. Ukafika mpaka kwenye hema na kulipiga, nalo likaanguka; ukaligeuza juu chini, na hema likaanguka.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “andazi la shayiri” au “mkate wa shayiri.” Neno la Kiebrania lililotafsiriwa “wa mviringo” ni adimu, na huenda linamaanisha andazi au mkate wenye umbo la duara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא גִדְעוֹן
  choice: Gideoni alipofika
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba kufika kwa Gideoni ndiko kunakoweka wakati wa tukio linalofuata.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili linadumisha msisitizo wa ghafla na uhai wa simulizi, ndani na nje ya usemi wa moja kwa moja.
- source_word: מְסַפֵּר לְרֵעֵהוּ חֲלוֹם
  choice: alikuwa akimsimulia mwenzake ndoto
  rationale: Hali ya tendo linaloendelea imehifadhiwa, na ‘mwenzake’ linafaa katika mazingira ya kijeshi bila kudokeza urafiki wa karibu kupita kiasi.
- source_word: הִנֵּה חֲלוֹם חָלַמְתִּי
  choice: Tazama, nimeota ndoto
  rationale: Marudio ya mzizi wa Kiebrania yamehifadhiwa kwa maneno ‘nimeota ndoto,’ ambayo ni ya kawaida na yenye msisitizo katika Kiswahili.
- source_word: צלול לֶחֶם שְׂעֹרִים
  choice: mkate wa shayiri wa mviringo
  rationale: צלול ni neno adimu ambalo huenda linataja umbo la duara la mkate; kutokuwa na uhakika kwake kumeelezwa katika tanbihi.
- source_word: מִתְהַפֵּךְ
  choice: ulikuwa ukibingirika
  rationale: Kitenzi kinaonyesha kitu kinachogeuka-geuka kinaposonga; ‘ukibingirika’ ni picha ya asili na wazi kwa mkate wa mviringo.
- source_word: בְּמַחֲנֵה מִדְיָן
  choice: katika kambi ya Midiani
  rationale: Tafsiri hii inafuata maana ya kawaida ya kihusishi בְּ bila kuongeza wazi wazo la kuingia ambalo linaweza kubaki likidokezwa na mwendo.
- source_word: עַד הָאֹהֶל
  choice: mpaka kwenye hema
  rationale: ‘Mpaka’ linaonyesha mwendo unaofikia mahali palipotajwa.
- source_word: וַיַּהַפְכֵהוּ לְמַעְלָה
  choice: Kisha mkate huo ukalipindua juu chini
  rationale: Mkate umewekwa wazi kuwa kiima ili kuzuia utata wa kiwakilishi katika Kiswahili, huku hema likibaki yambwa; ‘juu chini’ huwasilisha picha ya kupinduliwa.
- source_word: וְנָפַל הָאֹהֶל
  choice: na hema likaporomoka
  rationale: ‘Likaporomoka’ linaeleza kwa Kiswahili cha kawaida kuanguka kabisa kwa hema, badala ya kurudia tu ‘likaanguka.’
