translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kisasa, wenye heshima na unaoeleweka kwa urahisi. Marudio ya ‘tazama’ yanahifadhi uhai wa simulizi la Kiebrania. Kiima ‘mkate huo’ kimetajwa tena ili mlolongo wa matendo usieleweke kimakosa.
