  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/תָקַעְתִּי֙ בַּ/שּׁוֹפָ֔ר אָנֹכִ֖י וְ/כָל אֲשֶׁ֣ר אִתִּ֑/י וּ/תְקַעְתֶּ֨ם בַּ/שּׁוֹפָר֜וֹת גַּם אַתֶּ֗ם סְבִיבוֹת֙ כָּל הַֽ/מַּחֲנֶ֔ה וַ/אֲמַרְתֶּ֖ם לַ/יהוָ֥ה וּ/לְ/גִדְעֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/018.yaml
  text: When I and all who are with me blow the ram’s horn[a], then you also must blow the horns all around the whole camp, and say[b], ‘For Yahweh and for Gideon!’
translation:
  language: sw
  text: Mimi na wote walio pamoja nami tutakapopiga pembe ya kondoo dume[a], ninyi pia pigeni pembe zenu kote kuzunguka kambi yote, kisha mseme, “Kwa ajili ya Yahweh na kwa ajili ya Gideoni!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania שׁוֹפָר humaanisha pembe iliyotumiwa kutoa sauti, mara nyingi pembe ya kondoo dume, wala si tarumbeta ya chuma.
    reason: cultural_note
  - marker: b
    text: Tafsiri nyingine husema, “Upanga wa Yahweh na wa Gideoni,” kwa kufuata maneno yaliyo karibu katika Waamuzi 7:20. Lakini maandishi ya Kiebrania ya mstari huu yanasema tu, “Kwa ajili ya Yahweh na kwa ajili ya Gideoni.”
    reason: alternative_reading
lexical_decisions:
- source_word: תָקַעְתִּי / תְקַעְתֶּם
  choice: tutakapopiga / pigeni
  rationale: Kitenzi תקע kinapotumiwa pamoja na שׁוֹפָר humaanisha kupiga au kuvuvia pembe. ‘Kupiga pembe’ ni usemi wa kawaida wa Kiswahili na unafaa katika muktadha huu wa kutoa ishara.
- source_word: שׁוֹפָר / שׁוֹפָרוֹת
  choice: pembe ya kondoo dume / pembe
  rationale: שׁוֹפָר ni pembe inayotumiwa kama ala ya kutoa sauti, mara nyingi pembe ya kondoo dume, si tarumbeta ya chuma. Kutaja ‘pembe ya kondoo dume’ mara ya kwanza kunatoa picha halisi; ‘pembe’ katika wingi huepuka marudio mazito.
- source_word: אָנֹכִי וְכָל אֲשֶׁר אִתִּי
  choice: mimi na wote walio pamoja nami
  rationale: Usemi huu unamtaja Gideoni pamoja na watu waliokuwa upande wake. Tafsiri hii ni ya kawaida, wazi, na inaonyesha kwamba ni watu, si vitu, wanaokusudiwa.
- source_word: גַּם אַתֶּם
  choice: ninyi pia
  rationale: גַּם huonyesha kuwa wasikilizaji nao wanapaswa kufanya tendo hilo. ‘Ninyi pia’ huhifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: סְבִיבוֹת כָּל הַמַּחֲנֶה
  choice: kote kuzunguka kambi yote
  rationale: Maneno haya yanaonyesha kwamba vikundi vimeizunguka kambi nzima. ‘Kote kuzunguka kambi yote’ huhifadhi msisitizo wa סְבִיבוֹת na כָּל bila kudokeza kwamba wapiga pembe wanatembea.
- source_word: וַאֲמַרְתֶּם
  choice: kisha mseme
  rationale: Kitenzi אָמַר ni ‘kusema.’ Ingawa mazingira ya vita huenda yakahusisha sauti kubwa, maandishi hayasemi wazi ‘kupaza sauti,’ hivyo ‘mseme’ hayaongezi maana isiyotajwa.
- source_word: לַיהוָה וּלְגִדְעוֹן
  choice: Kwa ajili ya Yahwe na kwa ajili ya Gideoni
  rationale: 'Kiambishi ל kinachorudiwa katika kauli hii kinaonyesha upande, uaminifu, au mwito wa vita: ‘kwa ajili ya.’ Kurudia maneno hayo huhifadhi ulinganifu wa Kiebrania, na יהוה limetafsiriwa kwa jina ‘Yahwe.’'
theological_decisions:
- issue: Maana ya mwito לַיהוָה וּלְגִדְעוֹן
  choice: Kwa ajili ya Yahwe na kwa ajili ya Gideoni!
  alternative: Upanga wa Yahwe na wa Gideoni!
  rationale: Katika mstari huu maandishi ya Kiebrania hayana neno ‘upanga’; yanasema tu לַיהוָה וּלְגִדְעוֹן. Tafsiri iliyochaguliwa huhifadhi maandishi ya mstari huu na haileti mapema maneno yanayotokea katika Waamuzi 7:20.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina maalumu la Mungu, יהוה. ‘Yahwe’ hulitambulisha kama jina la agano badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa wakati ‘tutakapopiga’ unaonyesha ishara inayotangulia agizo, huku ‘pigeni’ na ‘mseme’ zikihifadhi nguvu ya maagizo. Jina ‘Gideoni’ limetumiwa kwa umbo lililozoeleka katika Kiswahili.
