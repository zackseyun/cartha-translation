id: JDG.7.22
reference: Judges 7:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יִּתְקְעוּ֮ שְׁלֹשׁ מֵא֣וֹת הַ/שּׁוֹפָרוֹת֒ וַ/יָּ֣שֶׂם יְהוָ֗ה אֵ֣ת חֶ֥רֶב אִ֛ישׁ בְּ/רֵעֵ֖/הוּ וּ/בְ/כָל הַֽ/מַּחֲנֶ֑ה וַ/יָּ֨נָס הַֽ/מַּחֲנֶ֜ה עַד בֵּ֤ית הַשִּׁטָּה֙ צְֽרֵרָ֔תָ/ה עַ֛ד שְׂפַת אָבֵ֥ל מְחוֹלָ֖ה עַל טַבָּֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/022.yaml
  text: When the three hundred trumpets were blown[a], Yahweh set every man's sword against his companion and against the whole camp, and the camp fled as far as Beth-shittah toward Zererah, as far as the edge of Abel-meholah[d][c][b], by Tabbath.
translation:
  language: sw
  text: Walipopiga zile tarumbeta mia tatu[a], Yahwe akauelekeza upanga wa kila mtu dhidi ya mwenzake katika kambi yote[b]. Kisha jeshi likakimbia mpaka Beth-shita, kuelekea Serera, mpaka ukingo wa Abel-mehola[d], karibu na Tabathi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zile tarumbeta mia tatu za pembe za kondoo dume.” Neno la Kiebrania linamaanisha tarumbeta ya pembe, ambayo mara nyingi ilitengenezwa kwa pembe ya kondoo dume.
    reason: lexical_alternative
  - marker: b
    text: Au, “dhidi ya kambi yote.” Kiebrania kinaweza kumaanisha kwamba kila mtu aliuelekeza upanga wake dhidi ya wengine kambini, au kwamba taharuki hiyo ilienea katika kambi yote.
    reason: alternative_reading
  - marker: c
    text: Beth-shita, Serera, Abel-mehola na Tabathi ni majina ya mahali katika njia ambayo jeshi hilo lilikimbilia.
    reason: cultural_note
  - marker: d
    text: Au, “kingo” au “mpaka wa Abel-mehola.” Neno la Kiebrania linaweza kumaanisha ukingo, kingo ya maji, au mpaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקְעוּ ... הַשּׁוֹפָרוֹת
  choice: Walipopiga zile tarumbeta mia tatu
  rationale: Kitenzi cha Kiebrania kiko katika wingi tendaji, ‘walipiga’; שׁוֹפָרוֹת ni tarumbeta za pembe, mara nyingi pembe za kondoo dume. ‘Tarumbeta’ ni neno la kawaida na wazi, huku tanbihi ikihifadhi umahususi wa ala hizo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: וַיָּשֶׂם ... אֵת חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: akauelekeza upanga wa kila mtu dhidi ya mwenzake
  rationale: Huhifadhi picha halisi ya Mungu kuuweka au kuuelekeza upanga wa kila mtu dhidi ya mwenzake, bila kufafanua kupita kiasi namna tendo hilo lilivyotokea.
- source_word: וּבְכָל הַמַּחֲנֶה
  choice: katika kambi yote
  rationale: בְּ hapa inaweza kueleza kuenea kwa tukio kotekote kambini; tafsiri hii ni ya asili katika Kiswahili na huhifadhi uwezekano huo wa kisarufi.
- source_word: וַיָּנָס הַמַּחֲנֶה
  choice: Kisha jeshi likakimbia
  rationale: Ingawa מַחֲנֶה ni ‘kambi’, hapa wanaokimbia ni watu wa jeshi lililopiga kambi; ‘jeshi’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: עַד בֵּית הַשִּׁטָּה
  choice: mpaka Beth-shita
  rationale: Jina la mahali limetoholewa, huku עַד ikitafsiriwa ‘mpaka’ kuonyesha kikomo cha njia ya kukimbia.
- source_word: צְרֵרָתָה
  choice: kuelekea Serera
  rationale: Kiishio cha uelekeo katika Kiebrania kinaonyeshwa kwa ‘kuelekea’.
- source_word: שְׂפַת אָבֵל מְחוֹלָה
  choice: ukingo wa Abel-mehola
  rationale: שָׂפָה inaweza kumaanisha ukingo, kingo ya maji, au mpaka. ‘Ukingo’ hubaki mpana bila kudai wazi kuwa palikuwa ukingo wa mto.
- source_word: עַל טַבָּת
  choice: karibu na Tabathi
  rationale: עַל pamoja na jina la mahali hapa yaelekea kuonyesha ukaribu; ‘karibu na’ ni ya asili na bado haibani maana kuwa kituo cha mwisho.
- source_word: אִישׁ
  choice: kila mtu
  rationale: Huwasilisha maana ya mgawanyo—upanga wa mtu mmoja mmoja—bila kuongeza neno ‘askari’ ambalo halipo wazi katika neno lenyewe.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko lina jina binafsi la Mungu, si cheo. ‘Yahwe’ hulihifadhi kwa namna ya kawaida katika tahajia ya Kiswahili.
- issue: Jukumu la Yahwe katika kuchanganyikiwa kwa jeshi
  choice: Yahwe akauelekeza upanga wa kila mtu dhidi ya mwenzake
  alternative: kila mtu akamshambulia mwenzake
  rationale: Tafsiri iliyochaguliwa hudumisha madai ya wazi ya Kiebrania kwamba Yahwe ndiye aliyesababisha panga zao zielekezwe dhidi ya wenzao, bila kupunguza au kueleza utendaji huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa maandiko. Majina ya mahali yametoholewa kwa tahajia inayosomeka kwa Waswahili. Sentensi mbili zimetumiwa kuzuia msongamano, huku viunganishi vya simulizi vikihifadhi mfuatano wa matukio.
