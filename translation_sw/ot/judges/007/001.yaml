  to: Ndipo Yerubaali (yaani, Gideoni) akaamka mapema asubuhi pamoja na watu wote waliokuwa pamoja naye, wakapiga kambi kando ya chemchemi ya Harodi.[a] Kambi ya Midiani ilikuwa kaskazini kwake, karibu na kilima cha More, bondeni.
