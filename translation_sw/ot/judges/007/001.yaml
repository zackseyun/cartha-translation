  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. Majina yameandikwa Yerubaali, Gideoni, Harodi, Midiani, na More. Umoja wa kiambishi cha Kiebrania katika לוֹ umehifadhiwa kwa “wake.”
