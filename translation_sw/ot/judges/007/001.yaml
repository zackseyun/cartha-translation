base_translation:
  language: en
  yaml_path: translation/ot/judges/007/001.yaml
  text: Then Jerubbaal (that is[a], Gideon) and all the people who were with him rose early and camped by the spring of Harod. The camp of Midian was north of him, by the hill of Moreh in the valley.
translation:
  language: sw
  text: Ndipo Yerubaali (yaani, Gideoni) akaamka mapema asubuhi pamoja na watu wote waliokuwa pamoja naye, wakapiga kambi kando ya chemchemi ya Harodi.[a] Kambi ya Midiani ilikuwa kaskazini kwake, karibu na kilima cha More, bondeni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kando ya En-Harodi.” Jina hilo la Kiebrania linajumuisha neno linalomaanisha “chemchemi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: akaamka asubuhi na mapema
  rationale: Hifili ya שׁכם ina maana ya kuamka mapema; usemi huu ni wa kawaida na huhifadhi maana ya wakati.
- source_word: יְרֻבַּעַל הוּא גִדְעוֹן
  choice: Yerubaali (yaani Gideoni)
  rationale: Kiwakilishi הוּא hapa kinamtambulisha Yerubaali kuwa ndiye Gideoni; “yaani” huonyesha uhusiano huo wazi na kwa lugha ya kawaida.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: pamoja na watu wote waliokuwa pamoja naye
  rationale: עָם ni “watu”; ingawa muktadha ni wa kijeshi, neno la Kiebrania halisemi kwa umahususi “wanajeshi,” hivyo maana pana imehifadhiwa.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה humaanisha kupiga kambi; huu ni usemi wa sasa na wa kawaida katika Kiswahili.
- source_word: עַל עֵין חֲרֹד
  choice: karibu na chemchemi ya Harodi
  rationale: עֵין humaanisha chemchemi na pia inaweza kuwa sehemu ya jina la mahali; tafsiri hii huonyesha maana yake ya kijiografia.
- source_word: וּמַחֲנֵה מִדְיָן
  choice: Kambi ya Midiani
  rationale: Hii inafuata moja kwa moja muundo wa סמיכות wa Kiebrania bila kuongeza neno maalumu la kabila lisilo wazi katika kifungu.
- source_word: הָיָה לוֹ מִצָּפוֹן
  choice: ilikuwa upande wake wa kaskazini
  rationale: Kiambishi cha umoja katika לוֹ kimehifadhiwa kama “wake,” kikimrejelea Gideoni badala ya kulainishwa kuwa wingi.
- source_word: מִגִּבְעַת הַמּוֹרֶה
  choice: karibu na kilima cha More
  rationale: מן katika maelezo haya ya mahali inaeleweka kwa maana ya eneo au ukaribu, si lazima kuondoka kutoka mahali.
- source_word: בָּעֵמֶק
  choice: bondeni
  rationale: עֵמֶק ni bonde; “bondeni” ni Kiswahili cha kawaida na sahihi kwa mahali hapo.
