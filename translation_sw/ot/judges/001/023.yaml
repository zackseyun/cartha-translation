  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri imedumisha usemi wa ukoo ‘nyumba ya Yosefu’ lakini ikaongeza ‘watu wa’ kwa uwazi wa kawaida. Alama ya tanbihi [a] imewekwa baada ya Betheli.
