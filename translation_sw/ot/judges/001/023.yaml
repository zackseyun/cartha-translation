base_translation:
  language: en
  yaml_path: translation/ot/judges/001/023.yaml
  text: And the house of Joseph spied out Bethel[a]; formerly the name of the city was Luz.
translation:
  language: sw
  text: Nao watu wa nyumba ya Yosefu wakaipeleleza Betheli[a]; zamani jina la mji huo lilikuwa Luzu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakaichunguza Betheli.” Kitenzi cha Kiebrania hapa kinahusu kupeleleza au kuchunguza eneo katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּתִירוּ
  choice: wakaipeleleza
  rationale: Kitenzi hiki katika muktadha wa kijeshi kinamaanisha kuchunguza eneo kwa kusudi la kupata habari. ‘Wakaipeleleza’ ni Kiswahili cha kawaida na kinaonyesha upelelezi bila kutumia istilahi nzito.
- source_word: בֵית יוֹסֵף
  choice: watu wa nyumba ya Yosefu
  rationale: Huhifadhi taswira ya Kiebrania ya ‘nyumba’ kama utambulisho wa ukoo au kundi la kikabila, huku ‘watu wa’ ikifanya maana hiyo ieleweke kwa msomaji wa kawaida.
- source_word: בְּבֵית אֵל
  choice: Betheli
  rationale: Kihusishi cha Kiebrania hapa kinaungana na kitenzi ili kuonyesha mji uliochunguzwa; Kiswahili kwa kawaida hutumia yambwa moja kwa moja baada ya ‘peleleza’.
- source_word: וְשֵׁם הָעִיר
  choice: jina la mji huo
  rationale: Ni muundo wa asili wa Kiswahili unaorejelea wazi mji uliotajwa.
- source_word: לְפָנִים
  choice: zamani
  rationale: Huonyesha hali ya wakati uliopita kwa lugha rahisi, ya sasa, na yenye heshima.
- source_word: לוּז
  choice: Luzu
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
theological_decisions: []
