  text: They gave Hebron to Caleb[a], as Moses had said, and he drove out from there the three sons of Anak.
translation:
  language: sw
  text: Wakampa Kalebu Hebroni, kama Musa alivyosema, naye akawafukuza wana watatu wa Anaki kutoka huko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wazao watatu wa Anaki” au “Waanaki watatu.” Kiebrania kinasema “wana wa Anaki,” jambo linaloweza kumaanisha watu wa ukoo wa Anaki badala ya wana wa moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לְכָלֵב אֶת חֶבְרוֹן
  choice: Wakampa Kalebu Hebroni
  rationale: Kauli ya simulizi וַיִּתְּנוּ inaonyesha tendo lililofuatia katika wakati uliopita. Muundo wa Kiswahili wenye kiambishi cha yambwa -m- na mahali 'Hebroni' ni wa kawaida na unaonyesha kwamba Hebroni alipewa Kalebu.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: kama Musa alivyokuwa amesema
  rationale: כַּאֲשֶׁר ni 'kama/jinsi,' na דִּבֶּר ni 'alisema/alizungumza.' Wakati timilifu wa awali unaonyesha kuwa Musa alikuwa amesema hayo kabla, bila kuongeza maana yenye nguvu zaidi ya 'aliahidi.'
- source_word: וַיּוֹרֶשׁ
  choice: naye akawafukuza
  rationale: Hifili ya ירש hapa ina maana ya kuwanyang'anya makao au kuwafukuza. Kwa kuwa yambwa ni watu, 'akawafukuza' ni Kiswahili cha sasa kilicho wazi; kiwakilishi 'wa-' kinarejelea wana hao watatu.
- source_word: מִשָּׁם
  choice: kutoka huko
  rationale: Kirai hiki kinarejelea mahali palipotajwa, yaani Hebroni, na kinahifadhi usemi wa Kiebrania 'kutoka huko.'
- source_word: אֶת שְׁלֹשָׁה בְּנֵי הָעֲנָק
  choice: wana watatu wa Anaki
  rationale: בְּנֵי kwa msingi ni 'wana wa.' Tafsiri hii inadumisha umbo la Kiebrania na kuweka wazi katika tanbihi kwamba linaweza kumaanisha wazao au watu wa ukoo, si lazima watoto wa moja kwa moja.
