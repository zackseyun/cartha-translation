  yaml_path: translation/ot/judges/001/006.yaml
  text: But Adoni-bezek fled[a], and they pursued him, seized him, and cut off his thumbs and big toes.
translation:
  language: sw
  text: Lakini Adoni-Bezeki akakimbia, wakamfuata, wakamkamata, kisha wakakata vidole gumba vya mikono yake na vidole vikubwa vya miguu yake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa tafsiri ya neno kwa neno, “vidole gumba vya mikono yake na vya miguu yake”; usemi huo unamaanisha vidole gumba vya mikono na vidole vikubwa vya miguu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס
  choice: akakimbia
  rationale: Kitenzi נוּס kinaonyesha kukimbia ili kujiokoa; “akakimbia” ni cha kawaida na hakidokezi kwamba alifanikiwa kutoroka, kwa kuwa alikamatwa.
- source_word: אֲדֹנִי בֶזֶק
  choice: Adoni-Bezeki
  rationale: Jina hili limetoholewa kama jina au cheo-jina badala ya kutafsiriwa kuwa “Bwana wa Bezeki”; umbo lenye irabu ya mwisho linalingana na matamshi ya kawaida ya Kiswahili.
- source_word: וַיִּרְדְּפוּ אַחֲרָיו
  choice: Wakamfuata
  rationale: Muundo רדף + אַחַר humaanisha kumfuata mtu kwa nia ya kumkamata. Katika muktadha huu, “wakamfuata” ni usemi wa asili wa Kiswahili na maana ya msako inaeleweka kutokana na kukamatwa kunakofuata.
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: wakamkamata
  rationale: אחז hapa ina maana ya kumtia mtu mikononi au kumkamata kwa nguvu; “wakamkamata” ni wazi na ya kawaida katika simulizi.
- source_word: וַיְקַצְּצוּ
  choice: wakamkata
  rationale: קצץ hapa hueleza kukatwa na kuondolewa kwa sehemu za mwili; kitenzi “kata” pamoja na vitu vilivyotajwa huwasilisha maana hiyo kwa kawaida.
- source_word: בְּהֹנוֹת יָדָיו וְרַגְלָיו
  choice: vidole gumba vya mikono na vidole vikubwa vya miguu
  rationale: בֹּהֶן hutaja kidole gumba cha mkono au kidole kikubwa cha mguu. Kiswahili hutofautisha viungo hivyo kwa maneno haya ili maana iwe wazi na ya asili.
