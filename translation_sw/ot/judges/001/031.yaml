  text: אָשֵׁ֗ר לֹ֤א הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י עַכּ֔וֹ וְ/אֶת יוֹשְׁבֵ֖י צִיד֑וֹן וְ/אֶת אַחְלָ֤ב וְ/אֶת אַכְזִיב֙ וְ/אֶת חֶלְבָּ֔ה וְ/אֶת אֲפִ֖יק וְ/אֶת רְחֹֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/031.yaml
  text: Asher did not drive out the inhabitants of Acco[a], or the inhabitants of Sidon, or Ahlab, or Achzib, or Helbah, or Aphek[b], or Rehob.
translation:
  language: sw
  text: Asheri hakuwafukuza[a] wenyeji wa Akko[b], wala wenyeji wa Sidoni, wala wenyeji wa Ahlab, wala wenyeji wa Akzibu, wala wenyeji wa Helba, wala wenyeji wa Afiki, wala wenyeji wa Rehobu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hakuwanyang’anya nchi” au “hakuwaondoa katika nchi.” Kitenzi cha Kiebrania kinamaanisha kuwaondoa waliokuwa wakiimiliki nchi.
    reason: lexical_alternative
  - marker: b
    text: Akko ni mji wa kale wa pwani ambao baadaye ulijulikana kwa jina la Acre.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: hakuwafukuza
  rationale: Hifili ya ירש katika muktadha wa kuitwaa nchi humaanisha kuwaondoa waliokuwa wakiimiliki. “Hakuwafukuza” ni Kiswahili cha kawaida na hudumisha wazo la kuwaondoa wenyeji katika nchi.
- source_word: יֹשְׁבֵי
  choice: wenyeji wa
  rationale: Umbo hili la kitenzi ישב linawataja watu wanaokaa mahali fulani. “Wenyeji wa” ni fupi, la kawaida, na linadumisha maana ya kundi la wakazi.
- source_word: עַכּוֹ
  choice: Akko
  rationale: Jina la mahali limetoholewa moja kwa moja badala ya kutumia jina la baadaye, Acre.
- source_word: צִידוֹן
  choice: Sidoni
  rationale: Hili ni umbo la Kiswahili linalotambulika la jina la mahali צִידוֹן.
- source_word: אַחְלָב
  choice: Ahlab
  rationale: Jina la mahali limetoholewa kwa kufuata konsonanti za Kiebrania bila kulipa maana isiyokuwapo katika chanzo.
- source_word: אַכְזִיב
  choice: Akzibu
  rationale: Jina la mahali limetoholewa kwa umbo linalosomeka kwa urahisi katika Kiswahili.
- source_word: חֶלְבָּה
  choice: Helba
  rationale: Utohozi huu unafuata umbo la Kiebrania lililo katika mstari huu; mapokeo mengine hutumia umbo tofauti.
- source_word: אֲפִיק
  choice: Afiki
  rationale: Jina la mahali limetoholewa kwa kuwakilisha sauti za Kiebrania katika tahajia ya Kiswahili.
- source_word: רְחֹב
  choice: Rehobu
  rationale: Jina la mahali limetoholewa kwa umbo linalotamkika kwa kawaida katika Kiswahili huku likidumisha konsonanti za msingi.
- source_word: וְ/אֶת ... וְ/אֶת
  choice: wala ... wala ... wala
  rationale: Katika sentensi kanushi ya Kiswahili, “wala” huunganisha kwa kawaida watu na mahali mbalimbali ambao wote hawakufukuzwa, na hivyo kuonyesha mgawanyo wa orodha ya Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. “Wala” limetumiwa katika orodha yote kwa sababu sentensi ni kanushi. Baada ya “wenyeji wa Sidoni,” neno “wenyeji” limeachwa lieleweke mbele ya majina mengine, kama ilivyo katika muundo wa chanzo.
