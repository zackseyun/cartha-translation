  text: BWANA akasema, “Yuda na apande. Tazama, nimeitia nchi hiyo mkononi mwake.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea katika Biblia za Kiswahili ya kuwakilisha jina la Mungu YHWH kwa “BWANA,” huku herufi kubwa zikilitofautisha na cheo cha kawaida.
- source_word: יְהוּדָה יַעֲלֶה
  choice: Yuda atapanda
  rationale: Tafsiri hii inadumisha kitenzi cha Kiebrania “kupanda,” ambacho katika muktadha kinaweza kumaanisha kwenda vitani au kuanza mashambulizi, bila kulifafanua kupita kiasi.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili la kuvuta fikira linasisitiza tangazo linalofuata na lina sauti yenye hadhi na iliyozoeleka katika Kiswahili cha Biblia.
- source_word: נָתַתִּי אֶת־הָאָרֶץ בְּיָדוֹ
  choice: nimeitia nchi hiyo mkononi mwake
  rationale: Hudumisha taswira ya Kiebrania ya kuitia nchi katika mkono wa mtu, yaani chini ya mamlaka au ushindi wake, na wakati timilifu “nimeitia” unaonyesha uhakika wa tendo la Mungu.
theological_decisions:
- issue: Utambulisho wa “Yuda” kama mtu au kabila
  choice: Yuda
  alternative: kabila la Yuda
  rationale: Chanzo kinasema tu “Yuda”; tafsiri haiongezi ufafanuzi, hivyo inadumisha uwezekano wa jina hilo kumwakilisha babu wa kabila au kabila lenyewe katika simulizi.
- issue: Wakati timilifu wa tendo la Mungu kabla ya ushindi kuonekana
  choice: nimeitia
  alternative: nitaitia
  rationale: Wakati timilifu wa Kiebrania umehifadhiwa ili kuonyesha tangazo la Mungu kuwa nchi tayari imetolewa, bila kuligeuza kuwa ahadi ya wakati ujao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo mfupi na taswira za chanzo zimehifadhiwa; “atapanda” ni wa kimakusudi kwa kuwa muktadha wa kijeshi unaeleza maana bila kuondoa utata wa kitenzi.
