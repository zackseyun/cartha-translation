base_translation:
  language: en
  yaml_path: translation/ot/judges/001/024.yaml
  text: The watchers saw a man coming out of the city[a], and they said to him, “Please show us the entrance to the city[b], and we will deal kindly with you.”
translation:
  language: sw
  text: Wale waliokuwa wakikesha wakamwona mwanamume akitoka mjini, wakamwambia, “Tafadhali, tuonyeshe njia ya kuingia mjini, nasi tutakutendea mema.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשֹּׁמְרִים
  choice: wapelelezi
  rationale: Katika muktadha wa jeshi linaloupeleleza mji, neno hili linawataja watu waliokuwa wakitazama au kuvizia. “Wapelelezi” ni Kiswahili cha kawaida kinachoeleza kazi yao bila kuwafanya walinzi wa mji.
- source_word: אִישׁ
  choice: mtu
  rationale: Ingawa nomino ya Kiebrania ni ya kiume na inaweza kutafsiriwa “mwanamume,” katika simulizi hili “mtu” ni ya kawaida na haipotezi taarifa muhimu ya tukio.
- source_word: יוֹצֵא מִן הָעִיר
  choice: akitoka mjini
  rationale: Hueleza mwendo wa kutoka ndani ya mji; muundo huu ni wa asili na wazi katika Kiswahili.
- source_word: הַרְאֵנוּ נָא אֶת מְבוֹא הָעִיר
  choice: Tafadhali, tuonyeshe njia ya kuingia mjini
  rationale: מְבוֹא inaweza kuwa mahali pa kuingilia au njia ya kuingia. Katika muktadha huu wa kuuteka mji, “njia ya kuingia mjini” ni wazi na ya kawaida; נָא imewakilishwa kwa “tafadhali.”
- source_word: וְעָשִׂינוּ עִמְּךָ חָסֶד
  choice: nasi tutakutendea kwa fadhili
  rationale: Hapa חֶסֶד inaelekea kumaanisha kumtendea mtu kwa wema au rehema katika makubaliano haya, bila kulazimisha maana nzito ya agano.
theological_decisions:
- issue: Maana ya חֶסֶד katika ahadi kwa mtu huyo
  choice: tutakutendea kwa fadhili
  alternative: tutakuonyesha uaminifu wa agano / upendo thabiti
  rationale: Muktadha ni ahadi ya kumhifadhi au kumtendea mema kwa sababu ya msaada wake. Tafsiri ya “fadhili” huhifadhi maana ya wema wa kimatendo bila kuingiza kwa lazima wazo la agano ambalo halijaelezwa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imefuata mtiririko wa simulizi la Kiebrania huku ikitumia maneno yanayoeleweka kwa urahisi. Hakuna tanbihi iliyohitajika; tofauti kati ya “mahali pa kuingilia” na “njia ya kuingia” imewakilishwa moja kwa moja kwa chaguo pana la “njia ya kuingia.”
