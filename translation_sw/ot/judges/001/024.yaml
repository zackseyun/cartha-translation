    issue: “Wapelelezi” over-specifies הַשֹּׁמְרִים.
    rationale: The Hebrew identifies people keeping watch; although the surrounding context supports reconnaissance, the word itself does not explicitly designate them as spies.
  - severity: low
    issue: “Mtu” does not preserve the masculine reference of אִישׁ.
    rationale: The source explicitly says “a man”; “mwanamume” is natural and retains the stated detail.
  revised_text: Wale waliokuwa wakikesha wakamwona mwanamume akitoka mjini, wakamwambia, “Tafadhali, tuonyeshe njia ya kuingia mjini, nasi tutakutendea mema.”
