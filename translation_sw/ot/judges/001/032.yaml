base_translation:
  language: en
  yaml_path: translation/ot/judges/001/032.yaml
  text: So the Asherites lived among the Canaanites[a], the inhabitants of the land, because they did not drive them out.
translation:
  language: sw
  text: Basi watu wa Asheri wakaishi miongoni mwa Wakanaani[a], wenyeji wa nchi, kwa sababu hawakuwafukuza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinatumia maumbo ya umoja yenye maana ya kijumla: kihalisi, “Mwasheri ... Mkanaani ... hakumfukuza.” Kiswahili kimetumia wingi ili kuonyesha maana iliyokusudiwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: wakaishi
  rationale: Kitenzi ישׁב hapa kinaeleza kukaa au kuishi mahali; “wakaishi” ni Kiswahili cha sasa na cha kawaida kinachoonyesha kuendelea kuishi miongoni mwa watu wengine.
- source_word: הָאָשֵׁרִי
  choice: watu wa Asheri
  rationale: Nomino ya Kiebrania iko katika umoja wa kijumla lakini inarejelea kabila; “watu wa Asheri” huwasilisha maana hiyo bila kuifanya ionekane kuwa mtu mmoja.
- source_word: בְּקֶרֶב
  choice: kati ya
  rationale: Kirai hiki humaanisha kuwa katikati au miongoni mwa kundi; “kati ya” ni cha kawaida na wazi katika Kiswahili.
- source_word: הַכְּנַעֲנִי
  choice: Wakanaani
  rationale: Ingawa umbo la Kiebrania ni la umoja, limetumiwa kwa maana ya kijumla na linafafanuliwa na kirai cha wingi “wenyeji wa nchi”; hivyo wingi wa Kiswahili unaonyesha maana iliyokusudiwa.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: wenyeji wa nchi hiyo
  rationale: Kirai hiki kinawatambulisha Wakanaani kuwa wale waliokuwa wakiishi katika nchi inayozungumziwa; “hiyo” huleta rejeo la kawaida na wazi katika Kiswahili.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי inatoa sababu ya hali iliyotajwa, na “kwa sababu” huonyesha uhusiano huo wazi.
- source_word: לֹא הוֹרִישׁוֹ
  choice: hawakuwafukuza
  rationale: Hifili ya ירשׁ katika muktadha huu ina maana ya kuwaondoa au kuwafukuza wenyeji. Viambishi vya wingi katika Kiswahili vinaonyesha maana ya kijumla ya maumbo ya umoja ya Kiebrania.
theological_decisions:
- issue: Umoja wa kijumla kwa kabila na taifa
  choice: 'Kutumia wingi wa maana: “watu wa Asheri,” “Wakanaani,” na “hawakuwafukuza.”'
  alternative: 'Kudumisha umoja wa kisarufi: “Mwasheri ... Mkanaani ... hakumfukuza.”'
  rationale: Kiebrania hutumia umoja wa kijumla kwa makundi ya kikabila. Umoja wa moja kwa moja katika Kiswahili ungeweza kueleweka kimakosa kuwa unazungumzia watu wawili binafsi, ilhali muktadha unahusu kabila la Asheri na wenyeji Wakanaani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia msamiati wa kawaida bila kupoteza uhusiano wa sababu wala matumizi ya kijumla katika Kiebrania.
