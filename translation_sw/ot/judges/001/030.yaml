base_translation:
  language: en
  yaml_path: translation/ot/judges/001/030.yaml
  text: Zebulun did not drive out the inhabitants of Kitron or the inhabitants of Nahalol[b][a], so the Canaanites lived among them and became forced laborers.
translation:
  language: sw
  text: Zebuluni hakuwafukuza wenyeji wa Kitroni wala wenyeji wa Nahaloli[a]. Kwa hiyo, Wakanaani wakaishi katikati yao[b] na wakafanyishwa kazi kwa lazima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Nahalali”; mapokeo fulani na vifungu vinavyohusiana hutumia umbo hilo la jina.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “Mkanaani akaishi katikati yake.” Umoja umetumiwa kwa maana ya Wakanaani kama jamii, na “yake” huenda inarejelea Zebuluni kama kabila.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: hakuwafukuza
  rationale: Katika muktadha wa Waamuzi 1, Hifili ya ירש ina maana ya kuwaondoa wenyeji waliokuwapo katika nchi. “Kuwafukuza” ni Kiswahili cha kawaida kinachoonyesha kuondolewa kwa nguvu bila kuongeza wazo lisilomo katika matini.
- source_word: יוֹשְׁבֵי
  choice: wenyeji wa
  rationale: Umbo la kishiriki la ישב linamaanisha watu wanaokaa mahali fulani. “Wenyeji wa” ni fupi, la kawaida, na linahifadhi uhusiano wao na eneo.
- source_word: קִטְרוֹן
  choice: Kitroni
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili, bila kulitafsiri.
- source_word: נַהֲלֹל
  choice: Nahaloli
  rationale: Jina la mahali limetoholewa kutokana na matamshi ya Kiebrania katika aya hii; umbo “Nahalali” linaweza kupatikana katika mapokeo na vifungu vinavyohusiana.
- source_word: וַיֵּשֶׁב הַכְּנַעֲנִי בְּקִרְבּוֹ
  choice: Wakanaani wakaishi katikati yao
  rationale: הַכְּנַעֲנִי ni umoja wenye maana ya jamii nzima, na kiambishi cha umoja katika בְּקִרְבּוֹ huenda kinarejelea kabila la Zebuluni kama umoja wa kijamii. Wingi wa Kiswahili unaeleza maana hiyo kwa kawaida.
- source_word: לָמַס
  choice: wakafanyishwa kazi kwa lazima
  rationale: מַס hapa ni kazi ya lazima iliyowekwa juu ya watu waliotiishwa, si kodi ya fedha tu. Kauli hii ni ya kawaida katika Kiswahili na inaonyesha wazi kulazimishwa kwao.
theological_decisions:
- issue: Umoja wa kijamii katika הַכְּנַעֲנִי na kiambishi cha umoja katika בְּקִרְבּוֹ
  choice: 'Kutumia wingi: “Wakanaani wakaishi katikati yao”'
  alternative: “Mkanaani akaishi katikati yake”
  rationale: Kiebrania mara nyingi hutumia umoja kuwakilisha taifa au jamii nzima na kulitaja kabila kama kitu kimoja. Wingi wa Kiswahili huwasilisha maana ya kijamii kwa uwazi, huku tanbihi ikihifadhi muundo halisi wa Kiebrania.
- issue: Maana ya hali iliyoonyeshwa na וַיִּהְיוּ לָמַס
  choice: “wakafanyishwa kazi kwa lazima”
  alternative: “wakawa watu wa kazi ya lazima”
  rationale: Kifungu kinaonyesha kwamba Wakanaani waliwekwa chini ya mfumo wa kazi ya lazima. Tafsiri iliyochaguliwa ni ya asili zaidi katika Kiswahili na haimaanishi kwamba wao wenyewe walikuwa ‘kazi.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi mbili zimetumiwa ili uhusiano wa matokeo uwe wazi. Majina ya mahali yametoholewa kwa maumbo ya Kiswahili “Kitroni” na “Nahaloli,” na “kazi kwa lazima” limechaguliwa badala ya istilahi ya kitaalamu au ya kizamani.
