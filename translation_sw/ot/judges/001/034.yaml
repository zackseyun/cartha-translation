  text: Waamori waliwasukuma wana wa Dani kuelekea nchi ya milima, kwa kuwa hawakuwaruhusu kushuka bondeni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלְחֲצוּ
  choice: waliwasukuma ... kurudi
  rationale: Kitenzi לחץ kina maana ya kushinikiza, kuonea, au kulazimisha watu wakae katika nafasi finyu. Katika muktadha huu, usemi huu unaonyesha kuwa Waamori waliwalazimisha wana wa Dani warudi na kubaki eneo la milima.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Ingawa jina hili la kabila liko katika umoja kisarufi, hapa linatumika kwa maana ya mkusanyiko wa watu; wingi ni wa kawaida na wazi katika Kiswahili.
- source_word: בְּנֵי דָן
  choice: wana wa Dani
  rationale: Tafsiri hii inahifadhi usemi wa kifamilia na kikabila wa Kiebrania, huku ikieleweka kwa urahisi katika Kiswahili.
- source_word: הָהָרָה
  choice: katika eneo la milima
  rationale: Kiishio cha mwelekeo kinaonyesha mwendo kuelekea au kuingia eneo la milima. Usemi huu pia unadumisha utofauti wa kijiografia na bonde linalotajwa baadaye.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa neno hili linaanzisha sababu ya jambo lililotangulia.
- source_word: לֹא נְתָנוֹ
  choice: hawakuwaruhusu
  rationale: Maumbo ya Kiebrania ni ya umoja wa kimkusanyiko, lakini wahusika ni makundi mawili ya watu; wingi unaleta maana hiyo kwa Kiswahili cha kawaida bila kubadili rejeo.
- source_word: לָרֶדֶת
  choice: kushuka
  rationale: Neno hili linaeleza mwendo wa kijiografia kutoka eneo la juu la milima kwenda chini.
- source_word: לָעֵמֶק
  choice: bondeni
  rationale: עֵמֶק ni bonde au eneo la chini; 'bondeni' ni tafsiri ya asili inayolingana na tofauti kati ya milima na eneo la chini.
