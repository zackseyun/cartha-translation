  text: וְ/לֹא הוֹרִ֣ישׁ מְנַשֶּׁ֗ה אֶת בֵּית שְׁאָ֣ן וְ/אֶת בְּנוֹתֶי/הָ֮ וְ/אֶת תַּעְנַ֣ךְ וְ/אֶת בְּנֹתֶי/הָ֒ וְ/אֶת ישב ד֜וֹר וְ/אֶת בְּנוֹתֶ֗י/הָ וְ/אֶת יוֹשְׁבֵ֤י יִבְלְעָם֙ וְ/אֶת בְּנֹתֶ֔י/הָ וְ/אֶת יוֹשְׁבֵ֥י מְגִדּ֖וֹ וְ/אֶת בְּנוֹתֶ֑י/הָ וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/027.yaml
  text: But Manasseh did not dispossess Beth-shean and its daughter towns[a], or Taanach and its daughter towns, or the inhabitants of Dor and its daughter towns, or the inhabitants of Ibleam and its daughter towns, or the inhabitants of Megiddo and its daughter towns[b]; and the Canaanites persisted in dwelling in this land.
translation:
  language: sw
  text: Lakini Manase hakuwafukuza wenyeji wa Beth-sheani na miji yake midogo iliyoitegemea[a], wala wenyeji wa Taanaki na miji yake midogo iliyoitegemea, wala wenyeji wa Dori na miji yake midogo iliyoitegemea, wala wenyeji wa Ibleamu na miji yake midogo iliyoitegemea, wala wenyeji wa Megido na miji yake midogo iliyoitegemea; Wakanaani wakaazimia kukaa katika nchi hii.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “binti zake,” yaani miji midogo au makazi yaliyoutegemea mji mkuu.
    reason: cultural_note
  - marker: b
    text: Au, “Wakanaani walidhamiria kukaa katika nchi hii.” Kitenzi cha Kiebrania kinaweza kueleza kuwa tayari au kuazimia kufanya jambo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: hakuwafukuza
  rationale: Katika muktadha huu, Hifili ya ירשׁ humaanisha kuwaondoa watu katika milki yao. “Kuwafukuza” ni Kiswahili cha kawaida kinachoeleza kuondolewa kwao katika eneo bila kutumia neno zito lisilo la kawaida.
- source_word: בְּנוֹתֶיהָ
  choice: miji yake iliyoitegemea
  rationale: Neno hilo ni “binti zake” kihalisi, lakini ni nahau inayotaja miji midogo au makazi yaliyokuwa chini ya mji mkuu. Tafsiri hii huwasilisha maana kwa uwazi; tanbihi huhifadhi taswira ya Kiebrania.
- source_word: ישב דּוֹר / יוֹשְׁבֵי יִבְלְעָם / יוֹשְׁבֵי מְגִדּוֹ
  choice: wakazi wa Dori ... wakazi wa Ibleamu ... wakazi wa Megido
  rationale: Maumbo ya kishiriki ya ישׁב yanawataja watu wanaoishi katika maeneo hayo. “Wakazi” ni neno la asili na la sasa katika Kiswahili.
- source_word: וַיּוֹאֶל
  choice: wakaazimia kuendelea
  rationale: Kitenzi יאל kinaweza kueleza kukubali, kuwa tayari, au kuazimia. Katika muktadha wa kushindwa kwa Manase kuwaondoa, “wakaazimia kuendelea” huonyesha dhamira yao ya kubaki bila kuficha wigo wa maana; mbadala umewekwa tanbihini.
- source_word: הַכְּנַעֲנִי
  choice: Wakanaani
  rationale: Ingawa umbo la Kiebrania ni umoja, hapa nomino hiyo inatumika kwa maana ya kundi la watu; wingi ni wa kawaida katika Kiswahili.
- source_word: לָשֶׁבֶת בָּאָרֶץ הַזֹּאת
  choice: kukaa katika nchi hiyo
  rationale: Kishazi hiki kinaeleza tendo waliloazimia Wakanaani. “Kukaa” huhifadhi maana ya kuishi au kubaki, na “nchi hiyo” hutoa rejeo la kimasimulizi kwa Kiswahili cha kawaida.
- source_word: בֵּית שְׁאָן / תַּעְנַךְ / דּוֹר / יִבְלְעָם / מְגִדּוֹ
  choice: Beth-sheani, Taanaki, Dori, Ibleamu, Megido
  rationale: Majina yameandikwa kwa namna inayofuata matamshi ya Kiebrania huku yakibadilishwa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
