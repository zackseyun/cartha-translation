  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa orodha wa Kiebrania umehifadhiwa, huku nahau ya “binti” ikitolewa kwa maana yake ya kawaida katika matini na kufafanuliwa katika tanbihi.
