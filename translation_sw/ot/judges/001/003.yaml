base_translation:
  language: en
  yaml_path: translation/ot/judges/001/003.yaml
  text: And Judah said to Simeon his brother[a], “Come up with me into my allotted territory, and let us fight against the Canaanites; and I too will go with you into your allotted territory.” So Simeon went with him.
translation:
  language: sw
  text: Yuda akamwambia Simeoni ndugu yake, “Panda pamoja nami katika eneo nililopewa kwa kura, ili tupigane dhidi ya Wakanaani; nami pia nitaenda pamoja nawe katika eneo ulilopewa kwa kura.” Basi Simeoni akaenda pamoja naye.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר יְהוּדָה לְשִׁמְעוֹן אָחִיו
  choice: Yuda akamwambia Simeoni ndugu yake
  rationale: Muundo wa '-ka-' unaendeleza mtiririko wa simulizi; 'ndugu yake' huhifadhi wazi lugha ya udugu wa Kiebrania katika muktadha wa makabila.
- source_word: עֲלֵה אִתִּי
  choice: Njoo pamoja nami
  rationale: Ingawa עלה kimsingi ni 'panda/kwenda juu', hapa ni mwaliko wa kujiunga katika msafara; 'njoo pamoja nami' ni Kiswahili cha kawaida kinachohifadhi mtazamo wa msemaji bila kulazimisha maana ya mwinuko wa kijiografia.
- source_word: בְּגוֹרָלִי / בְּגוֹרָלֶךָ
  choice: katika eneo nililopewa kwa kura / katika eneo ulilopewa kwa kura
  rationale: גּוֹרָל ni 'kura', lakini hapa hutaja kwa njia ya metonimia eneo lililogawiwa kwa kura. Tafsiri hii inaeleweka na bado inahifadhi dhana ya kura.
- source_word: וְנִלָּחֲמָה
  choice: ili tupigane
  rationale: Kohortativi ya nafsi ya kwanza wingi inaonyesha mwaliko au kusudi la pamoja. 'Ili tupigane' ni ya asili katika sentensi hii na huhifadhi nguvu ya pamoja.
- source_word: בַּכְּנַעֲנִי
  choice: na Wakanaani
  rationale: Nomino ya umoja ya Kiebrania inatumika kwa maana ya jamii kwa ujumla; Kiswahili hutumia wingi 'Wakanaani' kwa kawaida.
- source_word: וְהָלַכְתִּי גַם־אֲנִי אִתְּךָ
  choice: nami pia nitaenda pamoja nawe
  rationale: Huhifadhi ahadi ya ushirikiano wa kulipizana na msisitizo wa גַם אֲנִי, 'mimi pia'.
- source_word: וַיֵּלֶךְ אִתּוֹ שִׁמְעוֹן
  choice: Basi Simeoni akaenda pamoja naye
  rationale: '''Basi'' huonyesha matokeo ya mwaliko, huku ''-ka-'' ikiendeleza mfuatano wa simulizi.'
theological_decisions:
- issue: Lugha ya udugu אָחִיו
  choice: ndugu yake
  alternative: jamaa yake
  rationale: Maandishi yenyewe yanatumia 'ndugu'; katika mfumo wa nasaba ya Israeli, Yuda na Simeoni ni ndugu na pia majina ya makabila. Hakuna sababu ya kupanua maana kuwa 'jamaa'.
- issue: Maana ya גּוֹרָל katika ugawaji wa nchi
  choice: eneo ... lililopewa kwa kura
  alternative: kura yangu / kura yako
  rationale: Muktadha unaonyesha eneo la urithi lililogawiwa kwa kura. Ufafanuzi wa metonimia huondoa utata usio wa lazima bila kuongeza dai la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya simulizi la Biblia lakini inaepuka miundo mizito au ya kizamani. Hakuna tanbihi iliyohitajika kwa kuwa maana halisi ya 'kura' imejumuishwa wazi katika matini.
