source:
  edition: WLC
  text: וַ/יֵּ֤לֶךְ יְהוּדָה֙ אֶת שִׁמְע֣וֹן אָחִ֔י/ו וַ/יַּכּ֕וּ אֶת הַֽ/כְּנַעֲנִ֖י יוֹשֵׁ֣ב צְפַ֑ת וַ/יַּחֲרִ֣ימוּ אוֹתָ֔/הּ וַ/יִּקְרָ֥א אֶת שֵׁם הָ/עִ֖יר חָרְמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/017.yaml
  text: Then Judah went with Simeon his brother[a], and they struck down the Canaanites living in Zephath and devoted it to destruction[c][b]; so they called the name of the city Hormah.
translation:
  language: sw
  text: Kisha Yuda akaenda pamoja na Simeoni ndugu yake, nao wakawapiga Wakanaani waliokaa Sefathi. Wakauweka mji huo wakfu ili uangamizwe[a]. Kisha akauita mji huo Horma[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakauangamiza kabisa” au “wakauweka chini ya marufuku.” Kitenzi cha Kiebrania humaanisha kukitenga kitu bila kubatilishwa, mara nyingi kwa kukiangamiza.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “akauita,” katika umoja. Huenda Yuda linatajwa hapa kama kundi moja au kupitia mwakilishi wake. Tafsiri nyingine husema “wakauita.”'
    reason: alternative_reading
  - marker: c
    text: Jina Horma linafanana kwa sauti na neno la Kiebrania ḥerem, linalomaanisha kitu kilichowekwa wakfu ili kiangamizwe; hivyo linaeleza jina la mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוּדָה אֶת שִׁמְעוֹן אָחִיו
  choice: Yuda akaenda pamoja na Simeoni ndugu yake
  rationale: Kitenzi הלך humaanisha ‘kwenda,’ na אֶת hapa huonyesha ushirika, si kwamba Simeoni ndiye aliyelengwa. ‘Pamoja na’ linaeleza wazi maana hiyo kwa Kiswahili cha kawaida.
- source_word: וַיַּכּוּ
  choice: wakawapiga
  rationale: נכה katika simulizi la vita hueleza kuwashambulia na kuwashinda maadui, mara nyingi kwa kuwaua. ‘Wakawapiga’ huhifadhi nguvu ya tendo la kijeshi bila kuongeza wazi jambo ambalo kitenzi chenyewe hakilitaji.
- source_word: הַכְּנַעֲנִי יוֹשֵׁב צְפַת
  choice: Wakanaani waliokaa Sefathi
  rationale: Ingawa ‘Mkanaani’ ni umoja wa kisarufi katika Kiebrania, limetumiwa kwa maana ya jamii nzima; kitenzi cha wingi kinathibitisha maana hiyo. ‘Waliokaa’ ni usemi wa sasa na wa kawaida kwa participle יוֹשֵׁב.
- source_word: וַיַּחֲרִימוּ אוֹתָהּ
  choice: Wakauweka mji huo wakfu ili uangamizwe
  rationale: חרם katika Hiphil huunganisha wazo la kuweka kitu wakfu bila kubatilishwa na matokeo ya kukiangamiza. Tafsiri hii huhifadhi pande zote mbili. ‘Mji huo’ huweka wazi rejeo la kiwakilishi cha kike אוֹתָהּ, yaani Sefathi kama mji.
- source_word: וַיִּקְרָא
  choice: akauita
  rationale: Kitenzi cha Kiebrania ni umoja. Kiswahili kinahifadhi umoja huo kwa kiambishi a-, badala ya kukisawazisha kuwa wingi baada ya vitenzi vya awali.
- source_word: אֶת שֵׁם הָעִיר
  choice: mji huo
  rationale: Ingawa Kiebrania husema kwa muundo rasmi ‘akaliita jina la mji,’ Kiswahili cha kawaida husema ‘akauita mji huo.’ Maana ya tendo la kuupa mji jina imehifadhiwa kikamilifu.
- source_word: חָרְמָה
  choice: Horma
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Kiswahili. Uhusiano wake wa kimatamshi na חרם umeelezwa katika tanbihi badala ya kulazimishwa ndani ya maandishi.
theological_decisions:
- issue: Maana ya חרם katika muktadha wa vita
  choice: kuuweka mji wakfu ili uangamizwe
  alternative: kuuangamiza kabisa; kuuweka chini ya marufuku
  rationale: Neno la Kiebrania lina mvutano wa maana kati ya kutenga au kuweka wakfu bila kubatilishwa na kuangamiza. Tafsiri iliyochaguliwa haipunguzi tendo hilo liwe uharibifu wa kijeshi tu, wala haifiche matokeo yake ya maangamizi.
- issue: Mhusika wa kitenzi וַיִּקְרָא cha umoja
  choice: akauita
  alternative: wakauita
  rationale: Umbo la Kiebrania ni umoja, huenda likimrejelea Yuda kama kundi au mwakilishi wake. Maandishi yanahifadhi umoja huo na tanbihi inaeleza uwezekano wake bila kuondoa utata wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi unaoeleweka kwa msomaji wa kawaida na hadhi inayofaa maandiko. Majina yametolewa kama Yuda, Simeoni, Sefathi, na Horma. Muundo wa umoja katika ‘akauita’ umehifadhiwa kwa uaminifu kwa Kiebrania, huku tanbihi ikieleza ugumu wake.
