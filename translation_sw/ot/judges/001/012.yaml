base_translation:
  language: en
  yaml_path: translation/ot/judges/001/012.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him my daughter Achsah as a wife.”
translation:
  language: sw
  text: Kalebu akasema, “Yeyote[a] atakayeushambulia mji wa Kiriath-sefer na kuuteka, nitampa Aksa, binti yangu, awe mke wake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yule atakayeushambulia mji wa Kiriath-sefer na kuuteka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Kiambishi cha simulizi -ka- kinaendeleza mfululizo wa matukio kwa Kiswahili cha kawaida bila kuongeza msisitizo wa wakati usiokuwamo wazi katika Kiebrania.
- source_word: כָּלֵב
  choice: Kalebu
  rationale: Hili ni umbo la jina la mtu lililozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: אֲשֶׁר
  choice: yeyote atakaye-
  rationale: Kiwakilishi hiki kinaanzisha kishazi rejeshi kisichomtaja mtu maalumu na kinaonyesha mwito ulio wazi kwa yeyote atakayetimiza sharti.
- source_word: יַכֶּה
  choice: atakayeushambulia
  rationale: Katika muktadha huu wa kijeshi, kitenzi נכה kinaeleza kuushambulia mji. ‘Kuushambulia’ ni cha asili katika Kiswahili na hakitangulizi matokeo ambayo kitenzi kinachofuata ndicho kinachoyabainisha.
- source_word: קִרְיַת סֵפֶר
  choice: mji wa Kiriath-sefer
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa; neno ‘mji’ linaweka wazi kile kinachoshambuliwa na kuwezesha upatanisho wa kisarufi wa viwakilishi kwa Kiswahili cha kawaida.
- source_word: וּלְכָדָהּ
  choice: na kuuteka
  rationale: Katika muktadha wa vita, לכד humaanisha kuuteka au kuushika mji kwa nguvu. ‘Kuuteka’ linaeleza ushindi wa mwisho bila kurudia tu wazo la kushambulia.
- source_word: וְנָתַתִּי לוֹ
  choice: nitampa
  rationale: Hii inaonyesha ahadi ya Kalebu inayotegemea kutimizwa kwa sharti lililotangulia; yambwa ya mtu imejumuishwa kiasili katika kitenzi cha Kiswahili.
- source_word: עַכְסָה
  choice: Aksa
  rationale: Hili ni umbo la jina la mtu linalofaa fonolojia na tahajia ya Kiswahili.
- source_word: בִתִּי
  choice: binti yangu
  rationale: Tafsiri hii inahifadhi wazi uhusiano wa kifamilia ulio muhimu kwa ahadi hiyo.
- source_word: לְאִשָּׁה
  choice: awe mke wake
  rationale: Hii ni njia ya asili na iliyo wazi ya Kiswahili ya kueleza kumpa mwanamke katika ndoa, huku ikihifadhi uhusiano unaokusudiwa na kirai cha Kiebrania.
