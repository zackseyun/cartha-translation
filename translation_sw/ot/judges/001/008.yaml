base_translation:
  language: en
  yaml_path: translation/ot/judges/001/008.yaml
  text: Then the sons of Judah fought against Jerusalem and captured it[a], and struck it with the edge of the sword[b], and they set the city on fire.
translation:
  language: sw
  text: Wana wa Yuda[a] wakapigana dhidi ya Yerusalemu[b], wakauteka, wakaupiga kwa makali ya upanga, na wakauteketeza kwa moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Yuda.” Kirai hiki kinawarejelea watu wa kabila la Yuda kwa pamoja.'
    reason: lexical_alternative
  - marker: b
    text: Au “wakapigana katika Yerusalemu”; hata hivyo, muktadha unaunga mkono zaidi “dhidi ya Yerusalemu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ
  choice: wakapigana dhidi ya
  rationale: Kitenzi לחם katika simulizi hii kinaonyesha kushiriki vitani; pamoja na muktadha wa kuuteka mji, ‘wakapigana dhidi ya’ huonyesha wazi kuwa Yerusalemu ndiyo iliyoshambuliwa.
- source_word: בְנֵי יְהוּדָה
  choice: Wana wa Yuda
  rationale: Huhifadhi picha ya kifamilia ya Kiebrania, ‘wana wa Yuda,’ huku ikirejelea kwa pamoja watu wa kabila la Yuda.
- source_word: בִּירוּשָׁלִַם
  choice: dhidi ya Yerusalemu
  rationale: Ingawa kihusishi ב kinaweza kumaanisha ‘katika,’ baada ya לחם kinaweza kuonyesha mlengwa wa vita; vitenzi vinavyofuata vya kuuteka na kuushambulia mji vinaunga mkono maana ‘dhidi ya.’
- source_word: וַיִּלְכְּדוּ אֹתָהּ
  choice: wakauteka
  rationale: לכד hutumiwa kwa kuteka au kuudhibiti mji katika simulizi za kijeshi; ‘wakauteka’ ni Kiswahili cha kawaida na sahihi.
- source_word: וַיַּכּוּהָ לְפִי חָרֶב
  choice: wakauangamiza kwa makali ya upanga
  rationale: Kirai cha Kiebrania, kihalisi ‘wakaupiga kwa kinywa cha upanga,’ ni nahau ya kushinda kwa mauaji ya upanga. ‘Kwa makali ya upanga’ huhifadhi taswira, na ‘wakauangamiza’ huwasilisha kwa Kiswahili cha kawaida matokeo ya shambulio hilo.
- source_word: וְאֶת הָעִיר
  choice: mji huo
  rationale: Rejeo hili linarudi kwa Yerusalemu; ‘mji huo’ ni rejeo la kawaida na wazi katika Kiswahili.
- source_word: שִׁלְּחוּ בָאֵשׁ
  choice: wakauteketeza ... kwa moto
  rationale: Nahau ya שלח pamoja na moto humaanisha kuutia kitu motoni au kukichoma. ‘Wakauteketeza kwa moto’ ni ya asili, yenye hadhi, na inaonyesha ukubwa wa tendo.
