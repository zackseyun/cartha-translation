  text: וַ/יְהִ֤י יְהוָה֙ אֶתּ יְהוּדָ֔ה וַ/יֹּ֖רֶשׁ אֶת הָ/הָ֑ר כִּ֣י לֹ֤א לְ/הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י הָ/עֵ֔מֶק כִּי רֶ֥כֶב בַּרְזֶ֖ל לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/019.yaml
  text: And Yahweh was with Judah[a], and he took possession of the hill country; but he could not drive out the inhabitants of the valley, because they had iron chariots.
translation:
  language: sw
  text: Yahwe alikuwa pamoja na Yuda; Yuda akaimiliki nchi ya milima, lakini hakuweza kuwafukuza wakaaji wa bondeni[a], kwa sababu walikuwa na magari ya vita ya chuma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakaaji wa uwandani” au “wa nchi tambarare ya chini”; neno la Kiebrania linaweza kutaja eneo pana la bonde.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatumia jina la Mungu YHWH moja kwa moja kwa tahajia ya kawaida na inayoeleweka katika Kiswahili.
- source_word: אֶת־יְהוּדָה
  choice: pamoja na Yuda
  rationale: אֵת hapa ni kihusishi cha kuandamana, si alama ya yambwa; “Yuda” linahifadhi namna fupi ya Kiebrania huku likiweka wazi kwamba Yahwe alikuwa upande wake.
- source_word: וַיֹּרֶשׁ
  choice: akaimiliki
  rationale: Kwa kuwa yambwa ni הָהָר, yaani eneo la milima, Hiphil ya ירש hapa inaelekea kumaanisha kutwaa au kumiliki eneo hilo, badala ya kuwafukuza watu.
- source_word: הָהָר
  choice: nchi ya milima
  rationale: Katika muktadha huu neno hilo linataja eneo la nyanda za juu, wala si mlima mmoja.
- source_word: כִּי לֹא לְהוֹרִישׁ
  choice: lakini hakuweza kuwafukuza
  rationale: Kifungu cha Kiebrania kimefupishwa kisarufi. Sababu inayofuata kuhusu magari ya chuma inaonyesha kutofanikiwa au kutoweza; “lakini” linaonyesha tofauti na ushindi uliotajwa kabla.
- source_word: יֹשְׁבֵי הָעֵמֶק
  choice: wakaaji wa bondeni
  rationale: Ni Kiswahili cha kawaida kwa muundo wa Kiebrania unaomaanisha watu waliokuwa wakiishi katika eneo la bonde.
- source_word: עֵמֶק
  choice: bonde
  rationale: “Bonde” ndiyo maana ya msingi, ingawa neno linaweza pia kumaanisha uwanda au eneo pana la chini; uwezekano huo umehifadhiwa katika tanbihi.
- source_word: רֶכֶב בַּרְזֶל לָהֶם
  choice: walikuwa na magari ya vita ya chuma
  rationale: Muundo wenye לָהֶם unaonyesha umilikaji. “Magari ya vita” linaweka wazi aina ya magari yanayozungumziwa, na “ya chuma” linahifadhi maelezo ya Kiebrania bila kuongeza ufafanuzi usiotajwa.
theological_decisions:
- issue: Mhusika na maana ya kutoweza katika kifungu cha pili
  choice: Kifungu kimetafsiriwa kuwa Yuda hakuweza kuwafukuza wakaaji wa bondeni.
  alternative: Tafsiri ya karibu zaidi na muundo uliobanwa, kama “lakini hakuwafukuza wakaaji wa bondeni,” ingeacha wazi zaidi kama tatizo lilikuwa kutoweza au kutotenda.
  rationale: Ingawa sintaksia ya Kiebrania imebanwa, sababu inayotolewa—kwamba walikuwa na magari ya vita ya chuma—inaunga mkono maana ya kutoweza au kutofanikiwa. Tafsiri haiondoi mvutano uliopo kati ya kauli kwamba Yahwe alikuwa pamoja na Yuda na kushindwa kwa Yuda kuwafukuza wakaaji hao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mtiririko wa simulizi na mvutano wa maandishi ya Kiebrania bila kuingiza ufafanuzi wa kimadhehebu.
