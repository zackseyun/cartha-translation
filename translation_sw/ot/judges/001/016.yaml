translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa sasa na unaosomeka kwa urahisi. Majina yameandikwa kwa maumbo yaliyozoeleka katika Kiswahili: Mkeni, Yuda, Negebu, Aradi na Yeriko. Umoja usiotarajiwa wa vitenzi vya mwisho na utata wa ‘watu’ umehifadhiwa badala ya kusahihishwa kimyakimya.'
