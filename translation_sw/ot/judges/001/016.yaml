base_translation:
  language: en
  yaml_path: translation/ot/judges/001/016.yaml
  text: And the descendants of the Kenite[a], Moses’ father-in-law, went up from the City of Palms with the descendants of Judah into the wilderness of Judah, which is in the Negev of Arad[d][c][b]; then he went and settled with the people.
translation:
  language: sw
  text: Nao wazao wa Mkeni, baba mkwe wa Musa[a], walipanda kutoka Mji wa Mitende[b] pamoja na wazao wa Yuda mpaka nyika ya Yuda, iliyo katika Negebu ya Aradi. Kisha akaenda[c], akakaa pamoja na watu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jamaa yake Musa kwa njia ya ndoa.” Neno la Kiebrania linaweza kuwa na maana pana kuliko “baba mkwe,” ingawa “baba mkwe” ndiyo maana yake ya kawaida zaidi hapa.
    reason: lexical_alternative
  - marker: b
    text: Kwa kawaida “Mji wa Mitende” hueleweka kuwa Yeriko.
    reason: cross_reference
  - marker: c
    text: 'Kiebrania kinabadilika kutoka wingi kwenda umoja: “akaenda, akakaa.” Huenda kinarejelea ukoo wa Mkeni kama kundi moja, ingawa wengine hulielewa kwa maana ya wingi.'
    reason: grammatical_ambiguity
  - marker: d
    text: Au, “miongoni mwa watu.” Baadhi ya mashahidi wa kale husoma “pamoja na Waamaleki” badala ya “pamoja na watu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי קֵינִי
  choice: Nao wazao wa Mkeni
  rationale: Neno בְּנֵי lina maana halisi ya ‘wana wa,’ lakini katika muktadha wa ukoo au kabila humaanisha wazao au watu wa ukoo huo. ‘Wazao wa Mkeni’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: חֹתֵן מֹשֶׁה
  choice: baba mkwe wa Musa
  rationale: חֹתֵן kwa kawaida humaanisha baba mkwe, ingawa linaweza kutumiwa kwa maana pana zaidi ya jamaa kwa njia ya ndoa. Maana ya kawaida imewekwa katika matini, na uwezekano mpana umeonyeshwa katika tanbihi.
- source_word: עָלוּ
  choice: walipanda
  rationale: Kitenzi עלה humaanisha kupanda au kwenda juu. ‘Walipanda’ kinahifadhi taswira ya mwendo na uwezekano wa maana ya kijiografia.
- source_word: מֵעִיר הַתְּמָרִים
  choice: kutoka Mji wa Mitende
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya jina la kifafanuzi lililo katika Kiebrania. Jina ‘Yeriko’ halijaingizwa katika matini, bali utambulisho huo umetajwa katika tanbihi.
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: pamoja na wazao wa Yuda
  rationale: Hapa אֶת lina maana ya ushirika, ‘pamoja na.’ ‘Wazao wa Yuda’ linafaa kwa watu wa kabila hilo bila kudokeza kuwa walikuwa wana wa moja kwa moja tu.
- source_word: מִדְבַּר יְהוּדָה
  choice: wakaenda katika nyika ya Yuda
  rationale: ‘Nyika’ ni neno la kawaida la Kibiblia na la sasa kwa eneo kame lisilolimwa. Kitenzi ‘wakaenda’ kinawekwa ili kueleza kwa Kiswahili cha kawaida mahali walikoelekea, ambalo katika Kiebrania linafuata kitenzi cha kupanda bila kihusishi dhahiri.
- source_word: אֲשֶׁר בְּנֶגֶב עֲרָד
  choice: iliyo katika Negebu ya Aradi
  rationale: נֶגֶב linaweza kumaanisha eneo la Negebu au upande wa kusini. Muundo huu unahifadhi taarifa ya kijiografia na uhusiano wake na Aradi bila kuamua kimya kimya kuwa ni ‘kusini mwa Aradi.’
- source_word: וַיֵּלֶךְ וַיֵּשֶׁב
  choice: Kisha akaenda na kukaa
  rationale: Vitenzi vyote ni vya umoja katika Kiebrania baada ya kiima cha wingi. Umoja umehifadhiwa ili kutosawazisha mvutano wa kisarufi wa matini; tanbihi inaeleza uwezekano wa umoja wa kijumla.
- source_word: אֶת הָעָם
  choice: pamoja na watu
  rationale: אֶת linaeleweka hapa kwa maana ya ushirika. Rejeleo la ‘watu’ haliko wazi, kwa hiyo halijafafanuliwa kuwa Yuda katika matini; usomaji wa kale wa ‘Waamaleki’ umetajwa katika tanbihi.
