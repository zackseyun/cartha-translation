base_translation:
  language: en
  yaml_path: translation/ot/judges/001/033.yaml
  text: Naphtali did not drive out the inhabitants of Beth-shemesh or the inhabitants of Beth-anath[a], so he lived among the Canaanites, the inhabitants of the land. And the inhabitants of Beth-shemesh and Beth-anath became forced labor for them.
translation:
  language: sw
  text: Naftali hakuwafukuza wakaaji wa Beth-shemeshi wala wakaaji wa Beth-anathi; hivyo akaishi miongoni mwa Wakanaani, wakaaji wa nchi hiyo. Nao wakaaji wa Beth-shemeshi na Beth-anathi wakalazimishwa kufanya kazi kwa ajili yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawa chini ya utumishi wa kazi ya lazima kwa ajili yao.” Neno la Kiebrania מַס linamaanisha kazi ya lazima iliyoamriwa, si kulipa ushuru tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: hakuwafukuza
  rationale: Hifili ya ירש hapa inaeleza kuwaondoa wakaaji waliokuwapo katika nchi. ‘Kuwafukuza’ ni Kiswahili cha kawaida kinachohifadhi maana ya kuwaondoa kwa nguvu.
- source_word: יֹשְׁבֵי
  choice: wakaaji
  rationale: Partisipu ya ישב humaanisha watu wanaokaa mahali; ‘wakaaji’ ni fupi, ya kawaida, na inafaa katika marudio ya mstari huu.
- source_word: בֵית שֶׁמֶשׁ
  choice: Beth-shemeshi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili bila kutafsiri maana yake.
- source_word: בֵית עֲנָת
  choice: Beth-anathi
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa, kwa namna inayolingana na matamshi ya Kiswahili.
- source_word: וַיֵּשֶׁב בְּקֶרֶב
  choice: bali akaishi kati ya
  rationale: Kitenzi cha umoja kinafuata jina la kabila ‘Naftali’ kama umoja wa kijumla. ‘Kati ya’ huwasilisha בְּקֶרֶב kwa Kiswahili cha asili; ‘bali’ huonyesha tofauti kati ya kutowafukuza na kuishi pamoja nao bila kuifanya sentensi kuwa sababu iliyoelezwa wazi zaidi ya Kiebrania.
- source_word: הַכְּנַעֲנִי
  choice: Wakanaani
  rationale: Ingawa umbo la Kiebrania ni umoja, hapa ni jina la jamii lenye maana ya pamoja; Kiswahili hutumia wingi ‘Wakanaani’.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: wakaaji wa nchi hiyo
  rationale: Kirai hiki kinaeleza Wakanaani ni nani na kimehifadhiwa. ‘Hiyo’ hufanya rejeo la nchi husika liwe la kawaida katika Kiswahili.
- source_word: הָיוּ לָהֶם לָמַס
  choice: wakalazimika kuwafanyia kazi
  rationale: מַס hapa ni huduma ya kazi ya lazima, si malipo ya kodi tu. Uundaji huu ni wa kawaida katika Kiswahili na unaonyesha kwamba wakaaji hao waliwatumikia watu wa Naftali kwa kulazimishwa.
- source_word: לָהֶם
  choice: -wa- katika ‘kuwafanyia’
  rationale: Kiambishi cha wingi kinarejelea watu wa kabila la Naftali, hata ingawa jina la kabila limetumiwa awali pamoja na kitenzi cha umoja.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina ya mahali yametoholewa kama Beth-shemeshi na Beth-anathi. Sentensi ya mwisho imetolewa kwa muundo wa asili wa Kiswahili huku tanbihi ikihifadhi muundo wa karibu zaidi na Kiebrania na kufafanua maana ya מַס.
