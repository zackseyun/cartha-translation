base_translation:
  language: en
  yaml_path: translation/ot/judges/001/010.yaml
  text: Then Judah went against the Canaanites living in Hebron (Hebron’s former name was Kiriath-arba)[a], and they struck down Sheshai, Ahiman[c][b], and Talmai.
translation:
  language: sw
  text: Kisha Yuda akaenda dhidi ya Wakanaani waliokaa Hebroni (zamani Hebroni iliitwa Kiriath-arba),[a] nao wakawapiga Sheshai, Ahimani na Talmai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jina la Hebroni hapo zamani lilikuwa Kiriath-arba.”
    reason: lexical_alternative
  - marker: b
    text: Neno lililotafsiriwa “wakawapiga” linaweza pia kutafsiriwa “wakawashinda” au “wakawaua” katika muktadha huu wa vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda kupigana na
  rationale: Kitenzi hiki kimsingi humaanisha “akaenda,” lakini pamoja na אֶל na mlengwa wa uhasama katika simulizi la kijeshi kinaonyesha kwenda dhidi ya adui. “Akaenda kupigana na” huweka wazi muktadha huo bila kudai moja kwa moja kwamba walishambulia.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Jina la umoja linawakilisha kabila kwa pamoja. Kutumia “Yuda” kunafuata muundo wa Kiebrania na ni kawaida katika simulizi la kibiblia.
- source_word: הַכְּנַעֲנִי
  choice: Wakanaani
  rationale: Ingawa umbo la Kiebrania ni la umoja, hapa linafanya kazi kama jina la jamii kwa pamoja; wingi wa Kiswahili unasomeka kwa kawaida katika muktadha huu.
- source_word: הַיּוֹשֵׁב בְּחֶבְרוֹן
  choice: waliokuwa wakiishi Hebroni
  rationale: Kauli ya kishirikishi inaonyesha makao ya kudumu. Usemi huu ni wa kawaida katika Kiswahili na huhifadhi maana ya kuendelea kuishi mahali hapo.
- source_word: וְשֵׁם חֶבְרוֹן לְפָנִים קִרְיַת אַרְבַּע
  choice: zamani Hebroni iliitwa Kiriath-arba
  rationale: Hutoa kwa Kiswahili cha kawaida taarifa kwamba hilo ndilo lililokuwa jina la mji hapo awali, huku jina la mahali likinakiliwa kwa sauti.
- source_word: וַיַּכּוּ
  choice: wakawashinda
  rationale: Katika muktadha wa vita, נכה inaweza kumaanisha kuwapiga, kuwashinda, au kuwaua. “Wakawashinda” huonyesha matokeo ya kijeshi bila kufafanua zaidi ya lazima kwamba kila mmoja aliuawa.
- source_word: שֵׁשַׁי וְאֶת אֲחִימַן וְאֶת תַּלְמָי
  choice: Sheshai, Ahimani na Talmai
  rationale: Haya ni majina ya watu, kwa hiyo yamenakiliwa kwa sauti badala ya kutafsiriwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa lakini wenye heshima. “Hebroni” na “Ahimani” yametoholewa kwa maumbo yanayosikika kwa kawaida katika Kiswahili; “Kiriath-arba,” “Sheshai,” na “Talmai” yamenakiliwa kwa sauti. Uhusiano wa Yuda kama jina la kabila kwa pamoja umeachwa ujitokeze katika muktadha.
