  text: And the border of the Amorites was from the Ascent of Akrabbim[b][a], from Sela and upward.
translation:
  language: sw
  text: Mpaka wa Waamori ulikuwa kuanzia Mwinuko wa Akrabimu[a], kuanzia Sela[b] na kuendelea juu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akrabimu humaanisha “nge”; au, “Mwinuko wa Nge.”
    reason: lexical_alternative
  - marker: b
    text: Au “mwamba,” ikiwa neno la Kiebrania linaeleweka kama nomino ya kawaida badala ya jina la mahali Sela.
    reason: alternative_reading
lexical_decisions:
- source_word: גְבוּל
  choice: mpaka
  rationale: Neno hili humaanisha mpaka au mstari unaotenganisha maeneo; “mpaka” linafaa katika taarifa hii ya kijiografia.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Ingawa jina hilo liko katika umoja kisarufi katika Kiebrania, hapa linatumika kwa maana ya jamii nzima; Kiswahili hutumia wingi “Waamori” kwa kawaida.
- source_word: מִמַּעֲלֵה עַקְרַבִּים
  choice: kuanzia Mwinuko wa Akrabimu
  rationale: מַעֲלֵה ni mwinuko au njia ya kupandia, na עַקְרַבִּים ni sehemu ya jina la mahali; kulitaja kama jina kunahifadhi utambulisho wake wa kijiografia.
- source_word: מֵהַסֶּלַע
  choice: kutoka Sela
  rationale: Katika muktadha huu wa kijiografia, neno hilo linaweza kueleweka kama jina la mahali, Sela, ingawa kimuundo linaweza pia kumaanisha “mwamba.”
- source_word: וָמָעְלָה
  choice: na kuelekea juu
  rationale: Kirai hiki kinaonyesha kuendelea upande wa juu au kupanda kutoka hapo; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: וּ
  choice: ''
  rationale: Kiunganishi kinaendeleza taarifa iliyotangulia, lakini hakihitaji kutafsiriwa kwa “na” mwanzoni mwa sentensi ili Kiswahili kiwe cha kawaida.
