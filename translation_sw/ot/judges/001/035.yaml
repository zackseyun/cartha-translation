  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יּ֤וֹאֶל הָֽ/אֱמֹרִי֙ לָ/שֶׁ֣בֶת בְּ/הַר חֶ֔רֶס בְּ/אַיָּל֖וֹן וּ/בְ/שַֽׁעַלְבִ֑ים וַ/תִּכְבַּד֙ יַ֣ד בֵּית יוֹסֵ֔ף וַ/יִּהְי֖וּ לָ/מַֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/035.yaml
  text: But the Amorites persisted in dwelling in Mount Heres[a], in Aijalon, and in Shaalbim; then the hand of the house of Joseph grew heavy[b], and they became subject to forced labor.
translation:
  language: sw
  text: Lakini Waamori wakasisitiza kuendelea kukaa[a] katika Mlima Heresi, katika Aiyaloni na katika Shaalbimu. Kisha mkono wa nyumba ya Yosefu ukawa mzito juu yao[b], nao wakawa wafanyakazi wa shuruti[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakaazimia kukaa” au “wakang’ang’ania kubaki.” Kitenzi cha Kiebrania kinaweza kuonyesha nia thabiti, utayari au kuendelea kusisitiza jambo.
    reason: lexical_alternative
  - marker: b
    text: Au, “nguvu za nyumba ya Yosefu zikawashinda.” Kiebrania kinasema kihalisi, “mkono wa nyumba ya Yosefu ukawa mzito,” usemi unaoweza kuonyesha nguvu inayoongezeka au mamlaka yenye kuwakandamiza wengine.
    reason: lexical_alternative
  - marker: c
    text: Au, “wakawekwa chini ya kazi ya shuruti.” Neno la Kiebrania linamaanisha huduma ya lazima ya kazi, ambayo pia ingeweza kutolewa kama ushuru wa kazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: wakasisitiza kuendelea
  rationale: Kitenzi יאל pamoja na kitenzi-jina לָשֶׁבֶת kinaweza kuonyesha nia thabiti au kung’ang’ania kufanya jambo. Katika muktadha huu, ‘wakasisitiza kuendelea kukaa’ huonyesha kwamba Waamori hawakutaka kuondoka.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Ingawa neno la Kiebrania liko katika umoja wa kisarufi, linatumika kwa maana ya kundi la watu; kitenzi cha wingi baadaye katika mstari kinathibitisha matumizi hayo.
- source_word: לָשֶׁבֶת
  choice: kukaa
  rationale: Hapa neno hili linamaanisha kuishi au kubaki mahali. ‘Kuendelea kukaa’ linaendana vizuri na maana ya kitenzi kinacholitangulia.
- source_word: בְּהַר חֶרֶס
  choice: katika Mlima Heresi
  rationale: הַר humaanisha mlima au eneo la vilima, na חֶרֶס hapa ni jina la mahali. ‘Mlima Heresi’ huhifadhi jina hilo bila kuamua zaidi ya ushahidi wa maandishi.
- source_word: בְּאַיָּלוֹן
  choice: katika Aiyaloni
  rationale: Utohozi wa jina la mahali unaofuata matamshi ya Kiebrania na unaosomeka kwa kawaida katika Kiswahili.
- source_word: וּבְשַׁעַלְבִים
  choice: na katika Shaalbimu
  rationale: Jina la mahali limetoholewa kwa Kiswahili, huku kiunganishi na kihusishi vikihifadhiwa.
- source_word: וַתִּכְבַּד יַד
  choice: mkono ... ukawa mzito juu yao
  rationale: Tafsiri hii huhifadhi picha halisi ya Kiebrania ya ‘mkono kuwa mzito,’ ambayo katika muktadha huonyesha nguvu iliyoongezeka na mamlaka yenye shinikizo.
- source_word: בֵּית יוֹסֵף
  choice: nyumba ya Yosefu
  rationale: Huhifadhi usemi wa kindugu na kisiasa wa Kiebrania unaorejelea makabila yaliyotokana na Yosefu.
- source_word: וַיִּהְיוּ לָמַס
  choice: wakawa wafanyakazi wa shuruti
  rationale: מַס hapa ni huduma ya kazi ya lazima, si kodi ya fedha tu. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wa sasa na wenye heshima. Picha ya Kiebrania ya ‘mkono kuwa mzito’ imehifadhiwa katika matini, huku maana yake ikifafanuliwa katika tanbihi. Majina ya maeneo yametoholewa kwa tahajia inayosomeka kwa Kiswahili.
