base_translation:
  language: en
  yaml_path: translation/ot/judges/001/025.yaml
  text: So he showed them the entrance to the city[a], and they struck the city with the edge of the sword[b]; but they let the man and all his family go.
translation:
  language: sw
  text: Basi akawaonyesha njia ya kuingia mjini, nao wakaupiga mji kwa makali ya upanga[a]. Lakini wakamwacha yule mtu pamoja na jamaa yake yote[b] waende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kwa kinywa cha upanga,” nahau yenye maana ya “kwa makali ya upanga.”
    reason: lexical_alternative
  - marker: b
    text: Au “watu wote wa nyumba yake” au “ukoo wake wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְאֵם
  choice: akawaonyesha
  rationale: Umbo hili la kitenzi ראה lina maana ya kusababisha waone, yaani kuwaonyesha au kuwafunulia njia; “akawaonyesha” ni ya kawaida na wazi katika simulizi.
- source_word: מְבוֹא הָעִיר
  choice: njia ya kuingia mjini
  rationale: מָבוֹא inaweza kumaanisha mahali, njia, au mlango wa kuingilia. Katika muktadha huu wa kijeshi, “njia ya kuingia mjini” ni ya asili na haidai kwamba palikuwa lango rasmi.
- source_word: וַיַּכּוּ
  choice: wakauangamiza
  rationale: נכה ina maana pana ya kupiga, kushambulia, au kuangamiza. Ikiunganishwa na nahau ya upanga katika habari ya kutekwa kwa mji, “wakauangamiza” huwasilisha matokeo yanayokusudiwa kwa Kiswahili cha kawaida.
- source_word: לְפִי חָרֶב
  choice: kwa makali ya upanga
  rationale: Nahau hii ina maana halisi ya “kwa kinywa cha upanga.” Kiswahili “kwa makali ya upanga” huhifadhi taswira ya Kiebrania huku kikieleweka kwa urahisi.
- source_word: שִׁלֵּחוּ
  choice: wakamwacha ... waende
  rationale: Katika muktadha huu kitenzi kinamaanisha kwamba walimnusuru na kumruhusu aondoke, si kumtuma tu. Muundo huu ni wa kawaida katika Kiswahili.
- source_word: כָּל מִשְׁפַּחְתּוֹ
  choice: jamaa yake yote
  rationale: מִשְׁפָּחָה inaweza kurejelea familia, watu wa nyumba, au ukoo. “Jamaa yake yote” hudumisha upana huo vizuri kuliko neno lenye maana finyu.
- source_word: הָאִישׁ
  choice: yule mtu
  rationale: Nomino yenye kiainishi inamrejelea mtu aliyetajwa katika mstari uliotangulia; “yule mtu” hufanya rejeo hilo liwe wazi katika simulizi la Kiswahili.
