lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: akateka
  rationale: Kitenzi לכד katika muktadha wa kijeshi humaanisha kuutwaa mahali kwa nguvu; “akateka” ni Kiswahili cha kawaida na wazi.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Jina hili linawakilisha kundi la kabila kwa ujumla. Kutaja “Yuda” kunafuata Kiebrania bila kuongeza ufafanuzi wa “kabila la Yuda” katika matini.
- source_word: גְּבוּלָהּ
  choice: eneo lake
  rationale: גְּבוּל inaweza kumaanisha mpaka au eneo lililo ndani ya mpaka. Katika orodha ya miji iliyotekwa, “eneo lake” linaeleza kwa Kiswahili cha kawaida wilaya iliyohusishwa na kila mji huku tanbihi ikihifadhi maana nyingine.
- source_word: עַזָּה
  choice: Gaza
  rationale: Umbo la kawaida la jina hili la mahali katika Kiswahili.
- source_word: אַשְׁקְלוֹן
  choice: Ashkeloni
  rationale: Umbo la jina hili linalotumiwa kwa kawaida katika tafsiri za Kiswahili na linalowakilisha jina la Kiebrania.
- source_word: עֶקְרוֹן
  choice: Ekroni
  rationale: Umbo la jina hili linalotumiwa kwa kawaida katika Kiswahili na linalowakilisha jina la Kiebrania.
