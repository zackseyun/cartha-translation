base_translation:
  language: en
  yaml_path: translation/ot/judges/001/022.yaml
  text: The house of Joseph also went up against Bethel[a], and Yahweh was with them.
translation:
  language: sw
  text: Nyumba ya Yosefu nao wakapanda dhidi ya Betheli[a], na Yahweh alikuwa pamoja nao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakapanda kwenda Betheli.” Kitenzi cha Kiebrania kinasema kihalisi “wakapanda,” lakini katika muktadha huu wa kijeshi huenda kinamaanisha kusonga dhidi ya mji huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: wakapanda dhidi ya
  rationale: Kitenzi עָלָה kimsingi humaanisha ‘kupanda,’ lakini katika simulizi hili la kijeshi, kikifuatwa na mji unaolengwa, kinaonyesha kusonga kwenda kuushambulia. Tafsiri hii inahifadhi taswira ya Kiebrania na pia inaweka wazi muktadha wa uhasama.
- source_word: בֵית יוֹסֵף
  choice: watu wa nyumba ya Yosefu
  rationale: Hili ni jina la kijamii na kikabila linalowarejelea wazao au makabila ya Yosefu. Kuongeza ‘watu wa’ kunafanya Kiswahili kiwe cha kawaida huku ‘nyumba ya Yosefu’ ikihifadhi istilahi rasmi ya Kiebrania.
- source_word: גַּם הֵם
  choice: nao
  rationale: Neno ‘nao’ linaonyesha kwa ufupi na kwa kawaida kwamba watu hawa pia walijiunga na mfululizo wa kampeni zilizotangulia.
- source_word: בֵּית אֵל
  choice: Betheli
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la mahali בֵּית־אֵל.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetolewa moja kwa moja kama ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: עִמָּם
  choice: alikuwa pamoja nao
  rationale: Usemi huu unahifadhi maana ya uwepo na msaada wa Mungu bila kuufafanua kupita kiasi kuwa ushindi au kibali pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה moja kwa moja; ‘Yahweh’ hulihifadhi kama jina maalumu badala ya kulibadilisha kuwa cheo.
- issue: Maana ya Yahweh kuwa עִמָּם
  choice: alikuwa pamoja nao
  alternative: alikuwa upande wao
  rationale: ‘Alikuwa pamoja nao’ huhifadhi kwa pamoja wazo la uwepo na msaada wa Mungu bila kudai zaidi ya yanayosemwa na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. ‘Watu wa nyumba ya Yosefu’ huhifadhi lugha ya kikabila ya chanzo huku ikiepuka kueleweka kama jengo halisi.
