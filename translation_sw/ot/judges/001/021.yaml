base_translation:
  language: en
  yaml_path: translation/ot/judges/001/021.yaml
  text: But the sons of Benjamin did not drive out the Jebusites who were living in Jerusalem[a], so the Jebusites have lived with the sons of Benjamin in Jerusalem to this day.
translation:
  language: sw
  text: Lakini wana wa Benyamini hawakuwafukuza Wayebusi[a] waliokuwa wakiishi Yerusalemu; kwa hiyo Wayebusi wameendelea kuishi pamoja na wana wa Benyamini huko Yerusalemu mpaka leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kiebrania, “Myebusi” iko katika umoja, lakini umoja huo unawakilisha jamii nzima ya Wayebusi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: Wayebusi
  rationale: Nomino ya Kiebrania iko katika umoja lakini inawakilisha jamii nzima; wingi wa Kiswahili unasikika kwa kawaida na unaonyesha wazi kwamba kinachokusudiwa ni kikundi cha watu.
- source_word: יֹשֵׁב יְרוּשָׁלַם
  choice: waliokuwa wakiishi Yerusalemu
  rationale: Kauli shirikishi inaonyesha makao yanayoendelea; muundo huu wa Kiswahili huhifadhi hali hiyo kwa lugha ya kawaida.
- source_word: הוֹרִישׁוּ
  choice: hawakuwafukuza
  rationale: Katika muktadha wa kuiteka na kuikalia nchi, kitenzi hiki humaanisha kuwaondoa au kuwafukuza wakaaji; ‘kuwafukuza’ ni wazi na ya kawaida.
- source_word: בְּנֵי בִנְיָמִן
  choice: wana wa Benyamini
  rationale: Tafsiri hii inahifadhi muundo wa kikabila na wa nasaba wa Kiebrania bila kuwa ngumu kueleweka.
- source_word: וַיֵּשֶׁב
  choice: wakaishi
  rationale: Kitenzi cha masimulizi kinaeleza kuendelea kwa makao yao, huku ‘mpaka leo’ ikionyesha kwamba hali hiyo ilidumu hadi wakati wa msimulizi.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: pamoja na wana wa Benyamini
  rationale: Hapa אֶת ina maana ya kuandamana au kuwa pamoja, si alama ya yambwa; tafsiri hii inaonyesha kuishi mahali pamoja.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha kuendelea kwa hali hadi wakati wa msimulizi.
- source_word: וְ
  choice: Lakini
  rationale: Kiunganishi kina nguvu ya ulinganisho katika muktadha wa taarifa za ushindi; ‘Lakini’ huonyesha tofauti hiyo wazi.
