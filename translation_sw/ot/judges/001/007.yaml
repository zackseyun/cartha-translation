  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲדֹֽנִי בֶ֗זֶק שִׁבְעִ֣ים מְלָכִ֡ים בְּֽהֹנוֹת֩ יְדֵי/הֶ֨ם וְ/רַגְלֵי/הֶ֜ם מְקֻצָּצִ֗ים הָי֤וּ מְלַקְּטִים֙ תַּ֣חַת שֻׁלְחָנִ֔/י כַּ/אֲשֶׁ֣ר עָשִׂ֔יתִי כֵּ֥ן שִׁלַּם לִ֖/י אֱלֹהִ֑ים וַ/יְבִיאֻ֥/הוּ יְרוּשָׁלִַ֖ם וַ/יָּ֥מָת שָֽׁם־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/007.yaml
  text: And Adoni-bezek said[a], “Seventy kings, with the thumbs of their hands and their feet cut off, used to gather scraps under my table. As I have done, so God has repaid me.” And they brought him to Jerusalem[b], and he died there.
translation:
  language: sw
  text: Adoni-Bezeki[a] akasema, “Wafalme sabini waliokatwa vidole gumba vya mikono na vidole vikubwa vya miguu walikuwa wakiokota makombo chini ya meza yangu. Kama nilivyowatendea, ndivyo Mungu[b] alivyonilipa.” Kisha wakampeleka Yerusalemu, naye akafia huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili linaweza pia kueleweka kuwa “bwana wa Bezeki.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania אֱלֹהִים lina umbo la wingi, lakini hapa linaambatana na kitenzi cha umoja; kwa hiyo limetafsiriwa “Mungu,” si “miungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי בֶזֶק
  choice: Adoni-Bezeki
  rationale: Jina limetoholewa badala ya kutafsiriwa, kwa kuwa katika muktadha huu linatumika kama jina au cheo maalumu cha msemaji.
- source_word: שִׁבְעִים מְלָכִים
  choice: Wafalme sabini
  rationale: Muundo wa hesabu na nomino umetafsiriwa moja kwa moja na kwa Kiswahili cha kawaida.
- source_word: בְּהֹנוֹת יְדֵיהֶם וְרַגְלֵיהֶם
  choice: vidole gumba vya mikono na vidole vikubwa vya miguu
  rationale: בֹּהֶן humaanisha kidole gumba cha mkono au kidole kikubwa cha mguu kulingana na kiungo kinachotajwa; tafsiri hii inaweka wazi viungo vyote viwili vilivyo katika Kiebrania.
- source_word: מְקֻצָּצִים
  choice: waliokatwa
  rationale: Kitenzi kinaonyesha kwamba vidole hivyo vilikatwa na kuondolewa; Kiswahili hiki ni wazi bila kuongeza maelezo yasiyokuwapo.
- source_word: הָיוּ מְלַקְּטִים
  choice: walikuwa wakiokota makombo
  rationale: Muundo huu unaonyesha tendo la kawaida lililokuwa likirudiwa zamani. Katika muktadha wa chini ya meza, “kuokota makombo” huwasilisha tendo na fedheha yake kwa lugha ya asili.
- source_word: תַּחַת שֻׁלְחָנִי
  choice: chini ya meza yangu
  rationale: Usemi wa mahali umetafsiriwa moja kwa moja.
- source_word: כַּאֲשֶׁר עָשִׂיתִי כֵּן
  choice: Kama nilivyowatendea, ndivyo
  rationale: Huhifadhi muundo wa kulinganisha na wazo la malipo yanayolingana na tendo. Kiambishi cha yambwa “-wa-” kinaweka wazi kwamba aliwatendea wafalme hao.
- source_word: שִׁלַּם לִי אֱלֹהִים
  choice: Mungu alivyonilipa
  rationale: שׁלם katika kauli hii humaanisha kulipa au kutoa kisasi kinacholingana na tendo. Kitenzi cha Kiebrania ni umoja, hivyo “Mungu” ndiyo tafsiri inayofaa.
- source_word: וַיְבִיאֻהוּ יְרוּשָׁלִַם
  choice: Kisha wakampeleka Yerusalemu
  rationale: Mfuatano wa usimulizi umeonyeshwa kwa “Kisha,” na nafsi ya tatu wingi pamoja na yambwa wa kiume umoja imehifadhiwa.
- source_word: וַיָּמָת שָׁם
  choice: naye akafia huko
  rationale: “Akafia huko” ni Kiswahili cha kawaida kinachohifadhi mahali alikofia na mtiririko wa usimulizi.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika kauli ya Adoni-Bezeki
  choice: Mungu
  alternative: miungu
  rationale: Ingawa אֱלֹהִים ina umbo la wingi na wakati mwingine humaanisha “miungu,” hapa inaambatana na kitenzi cha umoja שִׁלַּם. Kwa hiyo maana ya umoja, “Mungu,” inaungwa mkono na sarufi, bila kudai kwamba msemaji alitoa ungamo pana zaidi kuliko maneno yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa katika mtiririko wa simulizi unaoeleweka kwa wasomaji wa kawaida, huku maelezo ya viungo, tendo la kudhalilisha, na wazo la malipo yanayolingana yakihifadhiwa.
