base_translation:
  language: en
  yaml_path: translation/ot/judges/001/029.yaml
  text: And Ephraim did not drive out the Canaanites who lived in Gezer[a], and the Canaanites lived among them in Gezer.
translation:
  language: sw
  text: Na Efraimu hakuwafukuza Wakanaani waliokuwa wakiishi Gezeri, na Wakanaani wakaishi miongoni mwao huko Gezeri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: hakuwafukuza
  rationale: Katika Hifili ya ירשׁ, neno hili hapa lina maana ya kuwaondoa wenyeji waliokuwapo. “Kuwafukuza” ni Kiswahili cha kawaida kinachodumisha wazo la kushindwa kuwaondoa katika nchi.
- source_word: הַכְּנַעֲנִי
  choice: Wakanaani
  rationale: Ingawa umbo la Kiebrania ni la umoja, jina hili la kikabila limetumiwa kwa maana ya mkusanyiko; Kiswahili hulitaja kundi hilo kwa wingi kama “Wakanaani.”
- source_word: הַיּוֹשֵׁב
  choice: waliokuwa wakiishi
  rationale: Kitenzi shiriki cha ישׁב kinaonyesha makao yanayoendelea; “waliokuwa wakiishi” huonyesha kwamba walikuwa wenyeji wa Gezeri.
- source_word: בְּגָזֶר
  choice: Gezeri
  rationale: Kiambishi בְּ kinaonyesha mahali. Kwa majina ya miji, Kiswahili kinaweza kueleza makao kwa jina lenyewe bila kulazimisha “katika”; “Gezeri” ni usemi wa kawaida.
- source_word: וַיֵּשֶׁב
  choice: wakaishi
  rationale: Wayyiqtol ya ישׁב inaendeleza masimulizi na kuonyesha kwamba Wakanaani waliendelea kukaa huko; “wakaishi” ni ya sasa na ya kawaida kuliko “wakakaa” ambayo pia huweza kumaanisha kitendo cha muda mfupi.
- source_word: בְּקִרְבּוֹ
  choice: miongoni mwao
  rationale: Kihalisi ni “katikati yake,” huku kiambishi cha umoja kikirejelea Efraimu kama kabila moja. “Miongoni mwao” huwasilisha kwa kawaida maana ya watu wa kabila hilo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “na” umehifadhi uunganisho wa Kiebrania bila kuongeza wazi uhusiano wa kisababishi. Jina Efraimu linaeleweka hapa kama kabila, ndiyo sababu viwakilishi vya wingi vimetumiwa kwa maana ya mkusanyiko.
