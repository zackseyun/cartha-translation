  yaml_path: translation/ot/judges/001/005.yaml
  text: They found Adoni-bezek in Bezek[a], and they fought against him and struck down the Canaanites and the Perizzites.
translation:
  language: sw
  text: Wakamkuta Adoni-Bezeki huko Bezeki[a], wakapigana naye, wakawapiga Wakanaani na Waperizi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Adoni-Bezeki linaweza kueleweka kietimolojia kuwa “bwana wa Bezeki,” lakini hapa limetafsiriwa kama jina la mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: wakamkuta
  rationale: Katika simulizi, מצא humaanisha kupata au kukutana na mtu; “wakamkuta” ni ya kawaida na inaendeleza mfuatano wa matukio.
- source_word: אֲדֹנִי בֶזֶק
  choice: Adoni-Bezeki
  rationale: Muktadha unaunga mkono kulitumia kama jina la mtu. Umbo lake la kietimolojia linaweza kumaanisha “bwana wa Bezeki,” jambo linalohifadhiwa katika tanbihi.
- source_word: בְּבֶזֶק
  choice: huko Bezeki
  rationale: Kiambishi ב־ kinaonyesha mahali; “huko” hutofautisha wazi mahali Bezeki na jina la mtu Adoni-Bezeki.
- source_word: וַיִּלָּחֲמוּ בּוֹ
  choice: wakapigana naye
  rationale: Nifali ya לחם pamoja na ב־ inaonyesha kupigana dhidi ya mpinzani; katika Kiswahili “kupigana naye” ni usemi wa asili wenye maana hiyo.
- source_word: וַיַּכּוּ
  choice: wakawashinda
  rationale: Katika muktadha wa vita, נכה inaweza kumaanisha kupiga, kuangusha, au kushinda. “Wakawashinda” linaonyesha ushindi wa kijeshi bila kudai kwamba kila mtu aliuawa.
- source_word: הַכְּנַעֲנִי
  choice: Wakanaani
  rationale: Ingawa umbo la Kiebrania ni umoja, jina hili la kabila linatumika kwa maana ya watu wote kwa pamoja.
- source_word: הַפְּרִזִּי
  choice: Waperizi
  rationale: Kama ilivyo kwa Wakanaani, umoja wa Kiebrania hapa una maana ya jamii nzima; wingi ni wa asili katika Kiswahili.
