  yaml_path: translation/ot/judges/001/026.yaml
  text: And the man went to the land of the Hittites and built a city and called its name Luz[a]; that is its name to this day.
translation:
  language: sw
  text: Mtu huyo akaenda katika nchi ya Wahiti, akajenga mji, akauita Luzi[a]; hilo ndilo jina lake mpaka leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “akaliita jina la mji huo Luzi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Qal wayyiqtol ya הלך inaendeleza simulizi kwa maana ya kawaida ya ‘akaenda.’
- source_word: הָאִישׁ
  choice: yule mtu
  rationale: Nomino yenye kiarifu inamrejelea mtu maalumu aliyetajwa katika muktadha uliotangulia; ‘yule mtu’ hudumisha rejeo hilo kwa Kiswahili cha kawaida.
- source_word: אֶרֶץ הַחִתִּים
  choice: nchi ya Wahiti
  rationale: Muundo huu ni ‘nchi ya Wahiti’; tafsiri hii huhifadhi jina la jamii na haibainishi kupita kiasi hali ya kisiasa ya eneo hilo.
- source_word: וַיִּבֶן עִיר
  choice: akajenga mji
  rationale: בנה pamoja na עִיר humaanisha moja kwa moja ‘kujenga mji’; ‘akajenga’ ni ya karibu na chanzo kuliko ‘akaanzisha.’
- source_word: וַיִּקְרָא שְׁמָהּ לוּז
  choice: akauita Luzi
  rationale: Nahau ya Kiebrania ni ‘akaliita jina lake Luzi,’ lakini Kiswahili cha asili hutumia ‘akauita Luzi’ bila kupoteza maana.
- source_word: לוּז
  choice: Luzi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Kiswahili huku likihifadhi utambulisho wa jina la Kiebrania.
- source_word: הוּא שְׁמָהּ
  choice: hilo ndilo jina lake
  rationale: Kishazi nomino chenye הוּא kina mkazo wa kuonyesha; ‘hilo ndilo jina lake’ huwasilisha mkazo huo kwa Kiswahili cha kawaida.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Hii ndiyo nahau ya kawaida na wazi ya Kiswahili kwa usemi wa wakati ‘hadi siku hii.’
