translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa msomaji wa kawaida. Viambishi vya mfululizo ‘aka-’ vinahifadhi mwendo wa simulizi wa wayyiqtol; semikoli inaunganisha tamko la jina na maelezo kwamba jina hilo linaendelea kutumiwa.
