  yaml_path: translation/ot/judges/001/009.yaml
  text: Afterward[a], the sons of Judah went down to fight against the Canaanites living in the hill country, the Negev, and the lowland.
translation:
  language: sw
  text: Baadaye, wana wa Yuda wakashuka kupigana dhidi ya Wakanaani waliokuwa wakiishi katika nchi ya vilima, Negebu, na nchi ya tambarare.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Shefela,” eneo la vilima vya chini vya Yuda kati ya nchi ya vilima na uwanda wa pwani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Baadaye
  rationale: Huonyesha hatua iliyofuata katika simulizi bila kubainisha muda uliopita.
- source_word: יָרְדוּ
  choice: wakashuka
  rationale: Huhifadhi maana halisi ya kuelekea chini na dokezo la kijiografia katika kitenzi cha Kiebrania.
- source_word: בְּנֵי יְהוּדָה
  choice: wana wa Yuda
  rationale: Ni tafsiri ya karibu ya muundo wa Kiebrania na hapa humaanisha washiriki wa kabila la Yuda kwa ujumla.
- source_word: לְהִלָּחֵם
  choice: kupigana
  rationale: Ni usemi wa kawaida na wazi kwa tendo la kufanya vita katika muktadha huu.
- source_word: בַּכְּנַעֲנִי
  choice: na Wakanaani
  rationale: Kihusishi kinaambatana na kitenzi cha kupigana na huonyesha wanaopingwa; nomino ya umoja katika Kiebrania imetumiwa kwa maana ya jamii nzima.
- source_word: יוֹשֵׁב
  choice: waliokuwa wakiishi
  rationale: Huwasilisha hali endelevu ya kukaa au kuishi katika maeneo hayo.
- source_word: הָהָר
  choice: nchi ya vilima
  rationale: Katika orodha hii ya maeneo, neno hilo humaanisha ukanda wa nyanda za juu, si mlima mmoja tu.
- source_word: הַנֶּגֶב
  choice: Negebu
  rationale: Ni jina la eneo maalumu la kusini katika orodha ya kijiografia; umbo Negebu ni la kawaida na rahisi kutamkwa kwa Kiswahili.
- source_word: הַשְּׁפֵלָה
  choice: nchi ya tambarare
  rationale: Hutoa maana ya eneo la chini kwa lugha inayoeleweka, huku tanbihi ikifafanua kuwa ni ukanda maalumu wa vilima vya chini.
