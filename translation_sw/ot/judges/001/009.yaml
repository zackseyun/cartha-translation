  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa na wenye heshima. Kiunganishi cha mfululizo “waka-” kimetumiwa kwa mwendo na kusudi. Alama ya tanbihi imewekwa baada ya kirai kinachofafanuliwa.
