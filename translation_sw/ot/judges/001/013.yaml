base_translation:
  language: en
  yaml_path: translation/ot/judges/001/013.yaml
  text: Othniel son of Kenaz[a], Caleb’s younger brother, captured it, and he gave him his daughter Achsah as a wife.
translation:
  language: sw
  text: Othnieli mwana wa Kenazi, ndugu mdogo wa Kalebu,[a] akauteka mji huo; naye Kalebu akampa binti yake Aksa kuwa mke wa Othnieli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “Othnieli mwana wa Kenazi, ndugu wa ukoo wa Kalebu, aliye mdogo kuliko yeye.” Kiebrania kwa kawaida husomeka “ndugu wa Kalebu, mdogo kuliko yeye,” lakini wengine hulielewa neno la undugu kwa maana pana zaidi; muundo huo pia unaweza kueleweka kuwa unamtaja Kenazi kuwa ndugu mdogo wa Kalebu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: akauteka mji huo
  rationale: Kitenzi לכד katika muktadha wa kijeshi humaanisha kuteka. Kiambishi cha kike cha umoja kinarejelea mji uliotajwa katika mstari uliotangulia; kutaja “mji huo” huweka rejeo wazi katika Kiswahili.
- source_word: עָתְנִיאֵל
  choice: Othnieli
  rationale: Jina la mtu limetoholewa kwa namna inayotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בֶּן קְנַז
  choice: mwana wa Kenazi
  rationale: Huu ni muundo wa kawaida wa Kiebrania unaoonyesha nasaba; umetafsiriwa moja kwa moja na kwa Kiswahili asilia.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: ndugu mdogo wa Kalebu
  rationale: Kwa maana yake ya kawaida, אֲחִי ni “ndugu wa kiume,” na הַקָּטֹן מִמֶּנּוּ humtaja aliye mdogo kuliko Kalebu. Uwezekano wa neno la undugu kuwa pana zaidi umehifadhiwa katika tanbihi.
- source_word: וַיִּתֶּן לוֹ
  choice: naye Kalebu akampa
  rationale: Ingawa Kiebrania kina viwakilishi, kumtaja Kalebu huondoa utata wa viwakilishi viwili vya kiume katika Kiswahili bila kubadili maana ya muktadha.
- source_word: עַכְסָה בִתּוֹ
  choice: binti yake Aksa
  rationale: Jina limetoholewa kama Aksa, na בִתּוֹ limetafsiriwa kwa kawaida kuwa “binti yake,” likimrejelea Kalebu.
- source_word: לְאִשָּׁה
  choice: awe mke wake
  rationale: Hii ni tafsiri ya asili ya nahau ya kumpa mwanamke katika ndoa, yenye lugha ya sasa na yenye heshima.
theological_decisions:
- issue: Uhusiano wa kindugu kati ya Othnieli na Kalebu
  choice: Othnieli ametajwa kuwa ndugu mdogo wa Kalebu.
  alternative: Othnieli alikuwa jamaa mdogo wa Kalebu; wengine huuelewa muundo huo kuwa unamhusisha Kenazi kama ndugu mdogo wa Kalebu.
  rationale: Usomaji wa moja kwa moja wa sintaksia unaelekea kumtaja Othnieli kuwa ndugu wa Kalebu na mdogo kuliko yeye. Kwa kuwa אֲחִי wakati mwingine linaweza kutumiwa kwa undugu mpana zaidi na muundo huu umefasiriwa kwa njia tofauti, uwezekano huo haujafichwa bali umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. “Akauteka mji huo” huweka wazi rejeo la kiambishi cha Kiebrania, na kumtaja Kalebu katika kishazi cha pili huzuia mkanganyiko wa viwakilishi.
