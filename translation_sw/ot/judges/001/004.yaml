  text: וַ/יַּ֣עַל יְהוּדָ֔ה וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת הַ/כְּנַעֲנִ֥י וְ/הַ/פְּרִזִּ֖י בְּ/יָדָ֑/ם וַ/יַּכּ֣וּ/ם בְּ/בֶ֔זֶק עֲשֶׂ֥רֶת אֲלָפִ֖ים אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/004.yaml
  text: Then Judah went up[a], and Yahweh gave the Canaanites and the Perizzites into their hand[b], and they struck down ten thousand men at Bezek.
translation:
  language: sw
  text: Ndipo Yuda akapanda, naye Yahwe akawatia Wakanaani[a] na Waperizi mikononi mwao[b]. Huko Bezek wakawapiga wanaume elfu kumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina umbo la umoja, “Mkanaani” na “Mperizi,” lililotumiwa kwa maana ya pamoja kuhusu watu hao.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “katika mkono wao,” nahau yenye maana ya kuwaweka chini ya uwezo wao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה kwa kawaida humaanisha kupanda au kwenda juu; hapa kinaweza pia kueleza kusonga kwa jeshi. “Akapanda” huhifadhi taswira ya Kiebrania bila kuamua zaidi kuhusu jiografia au namna ya mashambulizi.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Ni jina la kabila linalotumiwa kama mhusika wa pamoja. Umbo la umoja limehifadhiwa mwanzoni, huku wingi ukitumika baadaye kwa wapiganaji wa kabila hilo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu, YHWH, limetoholewa kwa umbo la Kiswahili “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: הַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: Wakanaani na Waperizi
  rationale: Majina haya yako katika umbo la kisarufi la umoja lakini yanawakilisha makundi ya watu; wingi ni wa kawaida na wazi katika Kiswahili.
- source_word: בְּיָדָם
  choice: mikononi mwao
  rationale: Nahau נתן ביד humaanisha kuwatia chini ya mamlaka au uwezo wa wengine. Kiswahili “mikononi mwao” huhifadhi taswira hiyo kwa namna ya kawaida.
- source_word: וַיַּכּוּם
  choice: wakawapiga
  rationale: נכה inaweza kumaanisha kupiga, kuangusha, au kushinda vitani. “Wakawapiga” huhifadhi upana huo bila kusisitiza kwamba kila mmoja aliuawa.
- source_word: בְּבֶזֶק
  choice: Huko Bezek
  rationale: Kiambishi ב־ kinaonyesha mahali pa mapigano; “huko Bezek” ni usemi wa kawaida wa Kiswahili katika simulizi.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: wanaume elfu kumi
  rationale: Tafsiri hii huhifadhi idadi na maana ya איש katika muktadha wa wapiganaji wa kiume bila kuongeza neno la kiufundi “wanajeshi.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Kutumia “Yahwe” huhifadhi jina binafsi katika matini badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Utendaji wa Mungu na wa wanadamu
  choice: Yahwe ndiye aliyewatia maadui mikononi mwao, nao wapiganaji wa Yuda wakawapiga
  alternative: Kufanya Yuda awe mhusika wa umoja katika sentensi yote au kufanya tendo la mwisho liwe la kutendwa
  rationale: Kiebrania hutofautisha wazi tendo la Mungu la kutoa ushindi na tendo la wapiganaji la kutekeleza mapigano; mabadiliko kutoka umoja wa pamoja “Yuda” kwenda wingi “wao/waka-” yamehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa maandiko. “Akapanda” na “mikononi mwao” huhifadhi taswira za Kiebrania, huku maumbo ya wingi ya majina ya watu yakitoa Kiswahili cha kawaida na kinachoeleweka.
