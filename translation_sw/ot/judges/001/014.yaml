base_translation:
  language: en
  yaml_path: translation/ot/judges/001/014.yaml
  text: And when she came[a], she urged him to ask her father for the field. Then she dismounted from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: sw
  text: Ikawa, alipokuja, akamhimiza[a] amwombe baba yake shamba. Kisha akateremka kutoka juu ya punda[b], naye Kalebu akamwambia, “Unataka nini?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamshawishi” au “akamchochea.” Kitenzi cha Kiebrania kinaweza kuwa na maana mbalimbali, kuanzia kuhimiza hadi kuchochea; hapa muktadha unaelekea kwenye maana isiyo hasi ya kuhimiza.
    reason: lexical_alternative
  - marker: b
    text: Au, “akashuka kutoka kwa punda” au “akadondoka kutoka juu ya punda.” Kitenzi cha Kiebrania kinaweza kumaanisha kushuka au kudondoka chini.
    reason: lexical_alternative
  - marker: c
    text: Nahau ya Kiebrania kwa karibu ni, “Ni nini kwako?” Maana yake inaweza kuwa, “Unataka nini?” au “Una shida gani?”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: alipofika
  rationale: Muundo wa בְּ pamoja na kitenzi-jina na kiambishi cha nafsi ya tatu ya kike una maana ya wakati, ‘alipokuja/alipofika.’ ‘Alipofika’ ni Kiswahili cha kawaida na fasaha katika simulizi.
- source_word: וַתְּסִיתֵהוּ
  choice: akamhimiza
  rationale: Kitenzi סות kinaweza kumaanisha kuchochea, kushawishi, au kuhimiza. Katika muktadha huu wa ombi la kifamilia, ‘akamhimiza’ huhifadhi msukumo wa tendo bila kulipa lazima maana mbaya.
- source_word: לִשְׁאוֹל
  choice: amwombe
  rationale: Hapa שאל inahusu kuomba kitu kutoka kwa mtu. ‘Amwombe’ huwasilisha kwa kawaida tendo la kumwomba baba kitu.
- source_word: מֵאֵת אָבִיהָ
  choice: baba yake
  rationale: מֵאֵת huonyesha mtu ambaye ombi linaelekezwa kwake au ambaye kitu kinaombwa kutoka kwake. Muundo wa Kiswahili ‘amwombe baba yake’ huonyesha uhusiano huo kwa kawaida.
- source_word: הַשָּׂדֶה
  choice: lile shamba
  rationale: Nomino ina kibainishi, hivyo inarejelea shamba maalumu. ‘Lile shamba’ huonyesha umaalumu huo katika Kiswahili cha simulizi.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: akashuka kutoka juu ya punda
  rationale: Kitenzi kinaweza kueleza kushuka au kujiachia chini. Katika muktadha wa mtu aliyepanda punda, ‘akashuka’ ni tafsiri wazi na ya kawaida, huku ‘kutoka juu ya punda’ ikihifadhi picha ya Kiebrania.
- source_word: מַה לָּךְ
  choice: Unataka nini?
  rationale: Nahau hiyo kwa neno moja moja ni ‘Una nini?’ au ‘Kuna nini kwako?’ Katika muktadha wa ombi linalotarajiwa, ‘Unataka nini?’ huwasilisha maana yake ya kimatumizi bila kuondoa uwezekano mwingine, ambao umeonyeshwa katika tanbihi.
- source_word: כָּלֵב
  choice: Kalebu
  rationale: Jina limetolewa kwa umbo la Kiswahili linalotumika kwa kawaida katika tafsiri za Biblia.
