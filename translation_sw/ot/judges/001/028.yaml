base_translation:
  language: en
  yaml_path: translation/ot/judges/001/028.yaml
  text: And when Israel became strong[a], they put the Canaanites to forced labor[b], but they did not drive them out completely.
translation:
  language: sw
  text: Israeli ilipopata nguvu, ikawafanya Wakanaani wafanye kazi ya kulazimishwa[a], lakini haikuwafukuza kabisa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “iliwatoza kazi ya lazima.” Neno la Kiebrania linamaanisha kazi ya lazima iliyowekwa na mamlaka inayotawala.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “haikuwafukuza yeye,” kwa kiwakilishi cha umoja kinachorejelea kwa pamoja jamii ya Wakanaani; Kiswahili kimetumia wingi kulingana na maana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: ilipopata
  rationale: Fomula hii ya simulizi inaanzisha hali ya wakati. Katika Kiswahili, kiunganishi cha wakati katika “Israeli ilipopata nguvu” kinawasilisha uhusiano huo kwa kawaida bila kutafsiri neno kwa neno ‘ikawa kwamba.’
- source_word: חָזַק
  choice: ilipopata nguvu
  rationale: Kitenzi kinaonyesha Israeli kufikia hali ya kuwa na nguvu au mamlaka zaidi, si tu kuwa tayari na nguvu.
- source_word: וַיָּשֶׂם
  choice: ikawatia
  rationale: Pamoja na לָמַס, kitenzi hiki kina maana ya kuwaweka au kuwafanya watu wawe chini ya kazi iliyolazimishwa; “ikawatia” ni ya kawaida na inadumisha nguvu ya tendo.
- source_word: הַכְּנַעֲנִי
  choice: Wakanaani
  rationale: Ingawa umbo la Kiebrania ni la umoja, hapa ni jina la pamoja linalorejelea jamii ya Wakanaani.
- source_word: לָמַס
  choice: katika kazi ya kulazimishwa
  rationale: Neno מַס hapa linamaanisha kazi ya lazima iliyowekwa na mamlaka yenye nguvu, si kodi ya kawaida tu.
- source_word: וְהוֹרֵישׁ לֹא הוֹרִישׁוֹ
  choice: lakini haikuwafukuza kabisa
  rationale: Muundo wa Kiebrania wenye kitenzi-jina na kitenzi kilichokanushwa unasisitiza kwamba kufukuzwa hakukukamilika. Kiwakilishi cha umoja kinarejelea kwa pamoja jamii ya Wakanaani, hivyo wingi ni wa kawaida katika Kiswahili.
theological_decisions:
- issue: Jinsi Israeli ilivyowatendea Wakanaani
  choice: Israeli iliwaweka Wakanaani katika kazi ya kulazimishwa badala ya kuwafukuza kabisa.
  alternative: Kutafsiri tendo hilo kwa upole kuwa kulipa kodi tu.
  rationale: לָמַס inaonyesha kazi iliyolazimishwa chini ya mamlaka ya mtawala; tafsiri haipaswi kuficha hali hiyo ya kulazimisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. “Israeli” imetumiwa kama jina la taifa na kupewa upatanisho wa ngeli ya 9; “Wakanaani” inaonyesha maana ya pamoja ya nomino ya Kiebrania.
