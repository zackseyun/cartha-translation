base_translation:
  language: en
  yaml_path: translation/ot/judges/001/015.yaml
  text: She said to him[a], “Please give me a blessing, because you have given me the land of the Negev[b]; give me also springs of water.” So Caleb gave her the upper springs and the lower springs.
translation:
  language: sw
  text: Akamwambia, “Tafadhali, nipe baraka. Kwa kuwa umenipa nchi ya Negebu[a], nipe pia chemchemi za maji[b].” Basi Kalebu akampa chemchemi za juu na chemchemi za chini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nchi ya kusini.” Neno la Kiebrania negev linaweza kuwa jina la eneo (“Negebu”) au kueleza upande au hali ya nchi (“nchi ya kusini” au nchi kavu ya kusini).
    reason: lexical_alternative
  - marker: b
    text: Kirai cha Kiebrania kinaweza kurejelea chemchemi, madimbwi, au vyanzo vingine vya maji; tafsiri “chemchemi” inafaa zaidi katika muktadha wa eneo kavu linalohitaji maji ya kudumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה לִּי
  choice: Tafadhali, nipe
  rationale: Muundo huu unaonyesha ombi la moja kwa moja. ‘Tafadhali’ huwasilisha kwa Kiswahili cha kawaida sauti ya kusihi bila kuifanya kuwa amri kali.
- source_word: בְרָכָה
  choice: baraka
  rationale: Neno la Kiebrania kimsingi ni ‘baraka.’ Ingawa hapa linahusu zawadi au fungu lenye manufaa, ‘baraka’ huhifadhi lugha ya chanzo na muktadha wa ombi kwa baba.
- source_word: אֶרֶץ הַנֶּגֶב
  choice: nchi ya Negebu
  rationale: נֶגֶב inaweza kuwa jina la eneo la kusini au kueleza nchi ya kusini iliyo kavu. ‘Negebu’ huhifadhi maana ya kijiografia bila kuondoa utata huo; maana mbadala inaelezwa katika tanbihi.
- source_word: גֻּלֹּת מָיִם
  choice: chemchemi za maji
  rationale: Kirai hiki kinamaanisha vyanzo vya maji na huenda kikarejelea chemchemi, madimbwi, au vyanzo vingine. ‘Chemchemi za maji’ kinafaa zaidi katika muktadha wa eneo kavu.
- source_word: גֻּלֹּת עִלִּית
  choice: chemchemi za juu
  rationale: עִלִּית humaanisha ‘za juu.’ Kurudia ‘chemchemi’ hudumisha ulinganifu na kirai kilichotangulia na kuonyesha mahali zilipo.
- source_word: גֻּלֹּת תַּחְתִּית
  choice: chemchemi za chini
  rationale: תַּחְתִּית humaanisha ‘za chini’ au ‘sehemu ya chini.’ Tafsiri hii inaunda jozi ya wazi na ‘chemchemi za juu.’
- source_word: וַיִּתֶּן לָהּ
  choice: Basi Kalebu akampa
  rationale: Kiunganishi cha simulizi kinaendeleza tukio na kuonyesha jibu la Kalebu kwa ombi lake. ‘Basi’ na ‘akampa’ ni mtiririko wa kawaida wa simulizi katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Sentensi ya ombi imegawanywa baada ya ‘baraka’ ili isomeke kwa urahisi na kuonyesha kwamba nchi kavu ndiyo sababu ya kuomba vyanzo vya maji. Viambishi vya kiswahili katika ‘Akamwambia’ vinaacha jinsia ya anayesemeshwa bila kutajwa wazi, kama ilivyo katika muktadha wa simulizi.
