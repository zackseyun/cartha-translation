base_translation:
  language: en
  yaml_path: translation/ot/judges/001/011.yaml
  text: From there he went against the inhabitants of Debir[b][a]. (The former name of Debir was Kiriath-sepher.)
translation:
  language: sw
  text: Kutoka huko akaenda dhidi ya wakazi wa Debiri[a]. (Hapo zamani Debiri iliitwa Kiriath-seferi.)[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuelekea wakazi wa Debiri.” Kihusishi cha Kiebrania kina maana ya msingi ya “kwa/kuelekea,” lakini hapa muktadha wa ushindi unaonyesha mwendo wa uhasama.
    reason: lexical_alternative
  - marker: b
    text: Kiriath-seferi ndilo jina la zamani la Debiri. Huenda jina hilo likamaanisha “Mji wa Kitabu” au “Mji wa Mwandishi,” au “Mji wa Waandishi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Kitenzi הלך katika usimulizi kina maana ya kawaida ya kwenda; muktadha unaonyesha safari ya kivita bila kulazimisha maana mahsusi ya ‘kuandamana vitani.’
- source_word: מִשָּׁם
  choice: Kutoka huko
  rationale: Kirai hiki kinaonyesha kuondoka mahali palipotajwa katika muktadha uliotangulia.
- source_word: אֶל
  choice: dhidi ya
  rationale: Ingawa maana ya msingi ni ‘kwa/kuelekea,’ katika simulizi hili la ushindi kinaonyesha mwendo wa uhasama kuelekea wakazi wa mji; ‘dhidi ya’ ni Kiswahili cha kawaida katika muktadha huo.
- source_word: יוֹשְׁבֵי
  choice: wakazi wa
  rationale: Hii ni participio ya ישב iliyotumiwa kama nomino kwa watu wanaoishi mahali fulani; ‘wakazi wa’ ni ya asili na wazi.
- source_word: דְּבִיר
  choice: Debiri
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: וְשֵׁם דְּבִיר לְפָנִים
  choice: Hapo zamani Debiri iliitwa
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida kwamba mji huo ulikuwa na jina jingine zamani.
- source_word: לְפָנִים
  choice: Hapo zamani
  rationale: Neno lina maana ya wakati uliopita, yaani ‘zamani’ au ‘hapo awali.’
- source_word: קִרְיַת סֵפֶר
  choice: Kiriath-seferi
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa; maana yake ya ki-etimolojia haijaingizwa katika matini kuu.
