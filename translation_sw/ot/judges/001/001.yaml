id: JDG.1.1
reference: Judges 1:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת יְהוֹשֻׁ֔עַ וַֽ/יִּשְׁאֲלוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/יהוָ֖ה לֵ/אמֹ֑ר מִ֣י יַעֲלֶה לָּ֧/נוּ אֶל הַֽ/כְּנַעֲנִ֛י בַּ/תְּחִלָּ֖ה לְ/הִלָּ֥חֶם בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/001.yaml
  text: And it happened after the death of Joshua that the sons of Israel asked Yahweh[a], saying[b], “Who will go up for us first against the Canaanites to fight against them?”
translation:
  language: sw
  text: Ikawa baada ya kifo cha Yoshua, wana wa Israeli[a] wakamwuliza Yahwe[b], wakisema, “Ni nani atakayepanda kwanza kwa ajili yetu dhidi ya Wakanaani[c], ili kupigana nao?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Israeli”; maana yake ni Waisraeli.'
    reason: lexical_alternative
  - marker: b
    text: “Yahwe” ni jina la Mungu linalowakilishwa kwa herufi YHWH; tafsiri nyingi hulitoa kama “BWANA.”
    reason: theological_term
  - marker: c
    text: Kiebrania kina “Mkanaani” katika umoja, lakini hapa neno hilo linawakilisha Wakanaani kama kundi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi kazi ya simulizi ya wayyiqtol ya היה katika mwanzo wa tukio, kwa mtindo mfupi na wenye hadhi.
- source_word: אַחֲרֵי מוֹת יְהוֹשֻׁעַ
  choice: baada ya kifo cha Yoshua
  rationale: Hufuata muundo wa nomino wa Kiebrania huku ikiwa Kiswahili cha kawaida na wazi.
- source_word: וַיִּשְׁאֲלוּ בַּיהוָה
  choice: wakamwuliza Yahwe
  rationale: Katika muktadha huu שׁאל בְּ humaanisha kumwendea Mungu ili kupata mwongozo; ‘wakamwuliza’ ni ya moja kwa moja na yenye kueleweka.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi nahau ya ukoo ya Kiebrania badala ya kuibadili moja kwa moja kuwa ‘Waisraeli.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina la agano YHWH kama jina maalumu, badala ya kulibadili kuwa cheo ‘BWANA.’
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Huhifadhi kishazi cha Kiebrania kinachoanzisha usemi wa moja kwa moja kwa njia ya kawaida katika simulizi la Kiswahili.
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: Ni nani atakayepanda ... kwa ajili yetu
  rationale: ‘Atakayepanda’ huhifadhi picha ya עלה ya kusonga juu au kwenda vitani, na ‘kwa ajili yetu’ huwakilisha לָנוּ bila kuifasiri kuwa ‘miongoni mwetu.’
- source_word: אֶל הַכְּנַעֲנִי
  choice: dhidi ya Wakanaani
  rationale: Muktadha wa vita unaifanya אֶל iwe na maana ya kuelekea kwa uhasama; nomino ya umoja ina maana ya jamii nzima, hivyo wingi ni wa kawaida katika Kiswahili.
- source_word: בַּתְּחִלָּה
  choice: kwanza
  rationale: Katika swali kuhusu mpangilio wa kwenda vitani, ‘kwanza’ ndiyo sawa ya asili na sahihi.
- source_word: לְהִלָּחֶם בּוֹ
  choice: ili kupigana nao
  rationale: Hutoa kusudi la kwenda na kudumisha maana ya לחם; ‘nao’ inapatana na Wakanaani kama kundi la watu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina maalumu la Mungu, YHWH. ‘Yahwe’ huhifadhi jina hilo wazi bila kulibadili kuwa cheo, huku tanbihi ikieleza desturi nyingine ya tafsiri.
- issue: Utambulisho wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Chaguo hili huhifadhi taswira ya ukoo iliyo katika Kiebrania bila kuongeza dai la kiteolojia; tanbihi inaonyesha sawa ya kawaida zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Ikawa’ huhifadhi mpito wa simulizi bila kutumia lugha nzito mno; mpangilio wa swali unadumisha ‘kupanda,’ ‘kwa ajili yetu,’ na maana ya pamoja ya ‘Mkanaani.’
