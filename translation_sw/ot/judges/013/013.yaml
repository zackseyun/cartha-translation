base_translation:
  language: en
  yaml_path: translation/ot/judges/013/013.yaml
  text: And the angel of Yahweh said to Manoah[a], “The woman must be careful to do everything that I said to her.”
translation:
  language: sw
  text: Kisha malaika wa Yahweh akamwambia Manoa[a], “Mwanamke huyo ajihadhari na yote niliyomwambia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe wa Yahweh.” Neno la Kiebrania linaweza kumaanisha “malaika” au “mjumbe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo wa masimulizi wenye waw unaendeleza tukio linalofuata; ‘Kisha’ pamoja na ‘akamwambia’ ni Kiswahili cha kawaida na hudumisha mtiririko huo.
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: מַלְאַךְ inaweza kumaanisha ‘malaika’ au ‘mjumbe’; katika simulizi hili ‘malaika’ inafaa kwa mjumbe wa mbinguni, huku tanbihi ikihifadhi uwezekano wa ‘mjumbe.’ Jina יהוה limetoholewa kuwa ‘Yahweh.’
- source_word: אֶל מָנוֹחַ
  choice: akamwambia Manoa
  rationale: Kiambishi cha yambwa katika ‘akamwambia’ na jina ‘Manoa’ huwasilisha kwa kawaida kwamba maneno yalielekezwa kwake.
- source_word: מִכֹּל אֲשֶׁר אָמַרְתִּי אֶל הָאִשָּׁה
  choice: na yote niliyomwambia
  rationale: Baada ya kitenzi cha kujihadhari, מִן inaonyesha eneo au mambo yote yanayopaswa kuzingatiwa. ‘Na yote niliyomwambia’ ni ya asili katika Kiswahili na huhifadhi ukamilifu wa כֹּל.
- source_word: הָאִשָּׁה
  choice: Mwanamke huyo
  rationale: Hutafsiri nomino bayana ‘mwanamke’ bila kuibadili kuwa ‘mke wako,’ ambalo ni wazo linaloeleweka katika muktadha lakini halijasemwa hapa.
- source_word: תִּשָּׁמֵר
  choice: ajihadhari
  rationale: Nifali ya שׁמר hapa ina maana ya kujilinda au kuwa mwangalifu ili kutii masharti yaliyotolewa; ‘ajihadhari’ huwasilisha maana hiyo kwa ufupi na kwa kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi יהוה, kwa hiyo ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Utambulisho wa מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  alternative: mjumbe wa Yahweh
  rationale: ‘Malaika’ inafaa kwa muktadha wa mjumbe wa mbinguni, lakini neno la Kiebrania pia linaweza kumaanisha ‘mjumbe’; tanbihi huhifadhi utata huo bila kuamua zaidi kuhusu utambulisho wake.
- issue: Nguvu ya תִּשָּׁמֵר
  choice: ajihadhari
  alternative: ajilinde; awe mwangalifu kutekeleza
  rationale: Uandishi huu huhifadhi wazo la mwanamke kujitunza kwa makini kuhusu maagizo, bila kuongeza kitenzi ‘kutekeleza’ ambacho hakijaandikwa wazi katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya maandiko. ‘Mwanamke huyo’ huhifadhi nomino ya chanzo, na ‘ajihadhari na yote’ huepuka kuongeza wazo la ‘kufanya’ lisiloelezwa wazi.
