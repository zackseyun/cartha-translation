base_translation:
  language: en
  yaml_path: translation/ot/judges/013/008.yaml
  text: Then Manoah entreated Yahweh and said[a], “Please, Lord[c][b], let the man of God whom you sent come again to us and teach us what we should do for the boy who is to be born.”
translation:
  language: sw
  text: Ndipo Manoa akamsihi Yahweh, akisema, “Tafadhali, Bwana, yule mtu wa Mungu uliyemtuma aje tena kwetu, atufundishe tufanye nini kwa ajili ya mvulana atakayezaliwa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּעְתַּר
  choice: akamsihi
  rationale: Kitenzi hiki kinaonyesha ombi la dhati linaloelekezwa kwa Mungu; “akamsihi” huhifadhi uzito huo kuliko “akamwomba” peke yake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: בִּי אֲדֹנָי
  choice: Tafadhali, Bwana
  rationale: בִּי ni kauli ya heshima katika kusihi, na אֲדֹנָי hapa ni namna ya kumwita Mungu kwa heshima.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hili ndilo linganifu la moja kwa moja na la kawaida, nalo linadumisha ufahamu wa Manoa katika hatua hii ya simulizi.
- source_word: אֲשֶׁר שָׁלַחְתָּ
  choice: uliyemtuma
  rationale: Huhifadhi kishazi rejeshi kinachomtaja yule mtu wa Mungu na Mungu kuwa ndiye aliyemtuma.
- source_word: יָבוֹא נָא עוֹד אֵלֵינוּ
  choice: na aje tena kwetu
  rationale: “Na aje” huonyesha ombi la heshima, huku “tena” ikiwakilisha עוֹד.
- source_word: וְיוֹרֵנוּ
  choice: atufundishe
  rationale: Mzizi ירה katika Hifili una maana ya kufundisha au kuelekeza; “atufundishe” ni Kiswahili cha kawaida na wazi.
- source_word: מַה נַּעֲשֶׂה
  choice: tufanye nini
  rationale: Huhifadhi swali la kutaka maelekezo ya vitendo bila kulifafanua kupita kiasi.
- source_word: לַנַּעַר
  choice: kwa ajili ya mvulana
  rationale: נַעַר ni nomino ya kiume inayomtaja mtoto wa kiume aliyeahidiwa; “mvulana” huhifadhi umahususi huo.
- source_word: הַיּוּלָּד
  choice: atakayezaliwa
  rationale: Huwasilisha hali ya wakati ujao ya kauli tendwa ya Kiebrania kwa Kiswahili cha asili.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Iwapo אִישׁ הָאֱלֹהִים ifafanuliwe kuwa mjumbe wa kimalaika
  choice: mtu wa Mungu
  alternative: mjumbe wa Mungu
  rationale: Manoa anamwita mhusika “mtu wa Mungu.” Kudumisha maneno hayo kunahifadhi mtazamo wake na mvutano wa simulizi bila kutanguliza utambulisho unaofunuliwa baadaye.
- issue: Jinsi ya kuwasilisha jinsia katika לַנַּעַר
  choice: kwa ajili ya mvulana
  alternative: kwa ajili ya mtoto
  rationale: Nomino ya Kiebrania ni ya kiume na muktadha unamhusu mtoto wa kiume aliyeahidiwa, kwa hiyo “mvulana” hudumisha maana hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “na aje” umetumiwa kama ombi la heshima, na sentensi imedumisha kutotaja kwa undani kile ambacho wazazi walipaswa kumfanyia mvulana.
