base_translation:
  language: en
  yaml_path: translation/ot/judges/013/010.yaml
  text: So the woman hurried and ran and told her husband[a], and said to him, “Look, the man who came to me that day has appeared to me.”
translation:
  language: sw
  text: Basi yule mwanamke akafanya haraka, akakimbia na kumwambia mume wake, “Tazama! Yule mtu aliyenijia siku ile[a] amenitokea.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siku nyingine.” Kwa maneno halisi, usemi wa Kiebrania ni “katika siku,” nao unarejelea ziara yake ya awali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: akafanya haraka
  rationale: Kitenzi מהר kinaonyesha kufanya jambo kwa haraka; usemi huu ni wa kawaida katika Kiswahili cha sasa na unaweka wazi hali ya uharaka.
- source_word: וַתָּרָץ
  choice: akakimbia
  rationale: Kitenzi רוץ humaanisha kukimbia. Kimetafsiriwa tofauti na kitenzi kilichotangulia ili kuhifadhi msisitizo maradufu wa Kiebrania kuhusu uharaka wake.
- source_word: וַתַּגֵּד
  choice: kumwambia
  rationale: Katika Hifili, נגד humaanisha kusema au kutoa taarifa. “Kumwambia” ni usemi wa kawaida na unaofaa katika simulizi hili.
- source_word: לְאִישָׁהּ
  choice: mume wake
  rationale: Ingawa אִישׁ pia humaanisha “mtu” au “mwanamume,” pamoja na kiambishi cha nafsi ya tatu ya kike katika muktadha huu wa kifamilia humaanisha mume wake.
- source_word: הִנֵּה
  choice: Tazama!
  rationale: Chembe hii huvuta usikivu na kuonyesha mshangao au uharaka. “Tazama!” inahifadhi nguvu hiyo katika lugha yenye hadhi bila kutumia msemo usio wa kawaida.
- source_word: נִרְאָה אֵלַי
  choice: amenitokea
  rationale: Nifali ya ראה hapa ina maana ya kujionyesha au kumtokea mtu. “Amenitokea” ni ya asili katika Kiswahili na inafaa kwa tukio lililotokea muda mfupi kabla ya taarifa hii.
- source_word: הָאִישׁ
  choice: yule mtu
  rationale: Nomino yenye kibainishi inamrejelea mtu aliyekutana naye hapo awali. “Yule mtu” inahifadhi mtazamo wa mwanamke bila kumtambulisha hapa moja kwa moja kuwa malaika.
- source_word: אֲשֶׁר בָּא בַיּוֹם אֵלַי
  choice: aliyenijia siku ile
  rationale: Kwa neno ni “aliyekuja kwangu katika/kwenye siku.” Katika muktadha huu, usemi huo unaelekeza kwenye ziara ya awali; “siku ile” ni Kiswahili cha kawaida kinachohifadhi urejeleo huo.
theological_decisions:
- issue: Utambulisho wa הָאִישׁ katika maneno ya mwanamke
  choice: yule mtu
  alternative: yule malaika / mjumbe wa Mungu
  rationale: Ingawa muktadha mpana unamtambulisha kuwa malaika wa BWANA, mwanamke katika mstari huu anamwita tu “mtu.” Tafsiri inahifadhi mtazamo wake wa moja kwa moja bila kuingiza utambulisho kamili wa kitheolojia katika maneno yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa “akafanya haraka, akakimbia” umehifadhiwa ili kuonyesha vitenzi viwili tofauti vya Kiebrania. Alama ya tanbihi imewekwa baada ya “siku ile,” yaani sehemu inayohusika na fasiri mbadala.
