  text: וַ/תֵּ֤לֶד הָֽ/אִשָּׁה֙ בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שִׁמְשׁ֑וֹן וַ/יִּגְדַּ֣ל הַ/נַּ֔עַר וַֽ/יְבָרְכֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/024.yaml
  text: And the woman bore a son and called his name Samson. And the boy grew, and Yahweh blessed him.
translation:
  language: sw
  text: Mwanamke huyo akazaa mwana, akampa jina Samsoni. Mvulana huyo akakua, na Yahwe akambariki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: akazaa
  rationale: Kitenzi ילד katika Qal kinaeleza kuzaa; “akazaa” ni usemi wa kawaida, mfupi, na unaofaa mtiririko wa simulizi la Kiebrania.
- source_word: הָאִשָּׁה
  choice: mwanamke huyo
  rationale: Kiebrania kinasema wazi “mwanamke”; “huyo” humrejelea mwanamke aliyetajwa katika muktadha bila kuongeza hapa kwamba alikuwa mke wa Manoa.
- source_word: בֵּן
  choice: mwana
  rationale: Katika muktadha wa kuzaliwa, בן humaanisha mtoto wa kiume; “mwana” ni tafsiri ya kawaida na yenye hadhi.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: akamwita jina lake
  rationale: Huhifadhi kwa karibu nahau ya Kiebrania ya “kuita jina lake,” huku ikiwa inaeleweka kwa Kiswahili.
- source_word: שִׁמְשׁוֹן
  choice: Samsoni
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: וַיִּגְדַּל
  choice: akakua
  rationale: Katika muktadha huu גדל inaeleza ukuaji wa mtoto, si lazima kuwa mkuu au mashuhuri.
- source_word: הַנַּעַר
  choice: mvulana huyo
  rationale: Ingawa נער inaweza kumaanisha mtoto au kijana, hapa hatua ya maisha mara baada ya kuzaliwa inaunga mkono “mvulana.”
- source_word: וַיְבָרְכֵהוּ
  choice: akambariki
  rationale: ברך kwa kawaida ni “bariki”; tafsiri hii huhifadhi uzito wake wa kitheolojia badala ya kuifanya kuwa “alimfadhili” tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kama “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la agano YHWH. “Yahwe” hulihifadhi kama jina binafsi na ni umbo la Kiswahili la matamshi yanayokubalika sana kitaaluma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa sasa na wenye hadhi. Viunganishi vya “aka-” vinaakisi mfuatano wa vitenzi vya simulizi la Kiebrania. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zinazohitajika katika aya hii.
