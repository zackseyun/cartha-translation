  text: Then Manoah said[a], “Now let your words come true[c][b]. What will be the rule for the boy and for his work?”
translation:
  language: sw
  text: Ndipo Manoa akasema, “Sasa maneno yako na yatimie.[a] Ni utaratibu gani utakaomhusu mvulana huyu, na kazi yake itakuwa nini?[b][c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maneno yako yatakapotimia.” Kishazi cha Kiebrania kinaweza kueleweka ama kama ombi (“na yatimie”) ama kama dhana ya wakati (“yatakapotimia”).
    reason: alternative_reading
  - marker: b
    text: “Utaratibu” hapa unaweza pia kutafsiriwa “desturi,” “kanuni,” “agizo,” au “namna ya maisha” ya mvulana huyu.
    reason: lexical_alternative
  - marker: c
    text: Au “na yale atakayopaswa kufanya.” Kiebrania kwa maana ya moja kwa moja ni “na kazi yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” huonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: מָנוֹחַ
  choice: Manoa
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: עַתָּה
  choice: Sasa
  rationale: Neno hili linaonyesha mwitikio wa papo hapo na matarajio ya Manoa.
- source_word: יָבֹא דְבָרֶיךָ
  choice: maneno yako na yatimie
  rationale: Kiebrania ni kwa maana ya moja kwa moja “maneno yako na yaje”; “na yatimie” huwasilisha kwa kawaida ombi kwamba ujumbe huo uwe kweli bila kuficha uwezekano wa kuuelewa kama hali ya wakati.
- source_word: מַה יִּהְיֶה
  choice: utakuwa upi ... itakuwa nini
  rationale: Miundo hii ya maswali ya wakati ujao ni ya kawaida katika Kiswahili na inaendana na nomino zinazoulizwa.
- source_word: מִשְׁפַּט
  choice: utaratibu
  rationale: Katika muktadha huu neno linaweza kumaanisha desturi, kanuni, agizo, au namna ya maisha iliyowekwa. “Utaratibu” ni wazi na hauwekei maana mipaka ya kisheria kupita kiasi.
- source_word: הַנַּעַר
  choice: huyo mvulana
  rationale: Neno linamtaja mtoto wa kiume aliyeahidiwa; “mvulana” huhifadhi rejeo la kiume la Kiebrania.
- source_word: וּמַעֲשֵׂהוּ
  choice: na kazi yake
  rationale: Hili ndilo tamko la karibu la nomino inayoweza kumaanisha kazi, tendo, shughuli, au jukumu; linahifadhi upana wa maana ya chanzo.
theological_decisions:
- issue: Je, יָבֹא דְבָרֶיךָ ni ombi au kishazi cha wakati?
  choice: 'Imetafsiriwa kama ombi: “maneno yako na yatimie.”'
  alternative: “maneno yako yatakapotimia.”
  rationale: Umbo la kitenzi linaweza kusikika kama ombi au kama matarajio ya wakati. Maandishi makuu yanafuata usomaji wa ombi, huku tanbihi ikihifadhi uwezekano mwingine bila kutatua utata kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa kwa mtiririko wa simulizi unaoeleweka kwa wasomaji wa kawaida, huku utata wa kishazi cha ombi/wakati na upana wa מִשְׁפַּט pamoja na מַעֲשֵׂהוּ vikihifadhiwa katika tanbihi.
