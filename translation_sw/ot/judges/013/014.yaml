  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִ/כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/גֶּ֨פֶן הַ/יַּ֜יִן לֹ֣א תֹאכַ֗ל וְ/יַ֤יִן וְ/שֵׁכָר֙ אַל תֵּ֔שְׁתְּ וְ/כָל טֻמְאָ֖ה אַל תֹּאכַ֑ל כֹּ֥ל אֲשֶׁר צִוִּיתִ֖י/הָ תִּשְׁמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/014.yaml
  text: She must not eat anything that comes from the grapevine[a], and she must not drink wine or strong drink, and she must not eat anything unclean. She must keep all that I commanded her.
translation:
  language: sw
  text: Asile kitu chochote kinachotokana na mzabibu[a], wala asinywe divai au kileo, wala asile kitu chochote kilicho najisi. Lazima ashike yote niliyomwamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “chochote kinachotoka katika mzabibu wa divai,” yaani, kitu chochote kinachotokana na mzabibu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל אֲשֶׁר יֵצֵא מִגֶּפֶן הַיַּיִן
  choice: kitu chochote kinachotokana na mzabibu
  rationale: Kauli hii ni pana na inahusu chochote kinachotokana na mzabibu. ‘Kinachotokana na’ huhifadhi wazo la kitenzi יֵצֵא, huku ‘mzabibu’ ikiwa Kiswahili cha kawaida na cha asili kwa גֶּפֶן הַיַּיִן.
- source_word: לֹא תֹאכַל
  choice: asile
  rationale: Muundo wa katazo ‘asile’ ni wa kawaida na wenye hadhi katika Kiswahili, nao unaonyesha wazi kuwa maagizo yanamhusu mwanamke huyo.
- source_word: יַיִן
  choice: divai
  rationale: ‘Divai’ ni tafsiri sanifu ya יַיִן katika muktadha wa kibiblia.
- source_word: שֵׁכָר
  choice: kileo
  rationale: ‘Kileo’ ni neno pana kwa kinywaji chenye kulevya kisicho lazima kiwe divai; halibani maana kuwa bia pekee.
- source_word: אַל תֵּשְׁתְּ
  choice: wala asinywe
  rationale: ‘Asinywe’ huwasilisha kwa kawaida katazo la Kiebrania lenye אַל, na ‘wala’ huunganisha katazo hili na la kwanza.
- source_word: כָל טֻמְאָה
  choice: kitu chochote kilicho najisi
  rationale: ‘Najisi’ huhifadhi lugha ya kibiblia ya hali ya kutokuwa safi kwa mujibu wa masharti ya ibada, bila kuibana kuwa uchafu wa kawaida.
- source_word: כֹּל אֲשֶׁר צִוִּיתִיהָ
  choice: yote niliyomwamuru
  rationale: Tafsiri hii huhifadhi ujumla wa כֹּל na inaonyesha kwamba maagizo hayo yalikuwa yametolewa tayari.
- source_word: תִּשְׁמֹר
  choice: lazima azingatie
  rationale: Katika muktadha wa maagizo, שׁמר humaanisha kuyashika au kuyafuata. ‘Azingatie’ ni ya asili katika Kiswahili na huonyesha wajibu wa kutii maagizo hayo.
theological_decisions:
- issue: Upana wa katazo kuhusu mazao ya mzabibu
  choice: Kuitafsiri kauli hiyo kwa upana kuwa ‘kitu chochote kinachotokana na mzabibu.’
  alternative: Kuibana kuwa zabibu au vyakula fulani tu vinavyotengenezwa kutokana na zabibu.
  rationale: Maneno ya Kiebrania ‘chochote kinachotoka katika mzabibu wa divai’ yana kusudi la kujumuisha kila kinachotokana na mzabibu. Tafsiri pana huhifadhi nguvu hiyo bila kuingiza istilahi ya kiufundi isiyotajwa katika aya.
- issue: Maana ya טֻמְאָה
  choice: Kutumia ‘najisi.’
  alternative: Kutumia ‘kichafu’ au ‘kisicho safi.’
  rationale: ‘Najisi’ huhifadhi maana ya kiibada na ya agano inayohusiana na sheria za usafi, badala ya kudokeza uchafu wa kimwili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya maandiko. Katazo limetolewa kwa miundo ya ‘asile/asinywe,’ huku ‘najisi’ ikihifadhi rejesta ya kibiblia na ya kiibada.
