  text: וַ/יִּקַּ֨ח מָנ֜וֹחַ אֶת גְּדִ֤י הָ/עִזִּים֙ וְ/אֶת הַ/מִּנְחָ֔ה וַ/יַּ֥עַל עַל הַ/צּ֖וּר לַֽ/יהוָ֑ה וּ/מַפְלִ֣א לַ/עֲשׂ֔וֹת וּ/מָנ֥וֹחַ וְ/אִשְׁתּ֖/וֹ רֹאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/019.yaml
  text: So Manoah took the young goat and the grain offering[a], and offered them on the rock to Yahweh, and he did a wondrous thing while Manoah and his wife were watching.
translation:
  language: sw
  text: Basi Manoa akamchukua mwana-mbuzi pamoja na sadaka ya nafaka, akavitoa kama sadaka juu ya mwamba kwa Yahwe. Na akatenda jambo la ajabu[a], huku Manoa na mkewe wakitazama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Malaika wa Yahwe akatenda jambo la ajabu.” Kiebrania kimefupisha kishazi hiki na hakimtaji tena mtendaji waziwazi, ingawa muktadha unaelekeza kwa mjumbe wa Yahwe.
    reason: alternative_reading
lexical_decisions:
- source_word: גְּדִי הָעִזִּים
  choice: mwana-mbuzi
  rationale: Ni Kiswahili cha kawaida na cha asili kwa mbuzi mchanga, na kinahifadhi maana ya mnyama aliyetolewa dhabihu.
- source_word: הַמִּנְחָה
  choice: sadaka ya nafaka
  rationale: Katika muktadha wa ibada na dhabihu, neno hili humaanisha sadaka ya mazao au nafaka; tafsiri hii inaeleza aina ya sadaka kwa uwazi.
- source_word: וַיַּעַל עַל הַצּוּר לַיהוָה
  choice: akavitoa juu ya mwamba kwa Yahwe
  rationale: Kitenzi עלה katika muktadha wa dhabihu kina maana ya kutoa au kupandisha sadaka. Kiambishi cha wingi katika “akavitoa” kinarejelea mwana-mbuzi na sadaka ya nafaka kwa Kiswahili cha kawaida.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Jina la Mungu יהוה limetolewa kwa namna ya kutamkwa “Yahwe,” kulingana na maandishi ya chanzo na safu ya mashauriano iliyotolewa.
- source_word: וּמַפְלִא לַעֲשׂוֹת
  choice: Naye akatenda jambo la ajabu
  rationale: Kirai cha Kiebrania kimebanwa na hakimtaji tena mtendaji. Kiwakilishi kinahifadhi umoja wa kiume na hali hiyo ya kutomtaja wazi, huku muktadha ukimwelekeza msomaji kwa mjumbe wa Yahwe.
- source_word: רֹאִים
  choice: wakitazama
  rationale: Umbo la kishiriki linaonyesha tendo lililokuwa likiendelea; “wakitazama” linawasilisha hali hiyo kwa Kiswahili cha asili.
theological_decisions:
- issue: Mtendaji asiyetajwa wazi katika וּמַפְלִא לַעֲשׂוֹת
  choice: Naye akatenda jambo la ajabu
  alternative: Malaika wa Yahwe akatenda jambo la ajabu
  rationale: Kiebrania hakimtaji tena mtendaji katika kishazi hiki. Muktadha unaelekeza kwa mjumbe wa Yahwe, lakini kumtaja wazi katika andiko kuu kungeondoa ubanifu na mvutano uliopo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kwa msomaji wa kawaida, huku ubanifu wa Kiebrania kuhusu mtendaji wa tendo la ajabu ukihifadhiwa.
