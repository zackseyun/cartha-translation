base_translation:
  language: en
  yaml_path: translation/ot/judges/013/002.yaml
  text: There was a certain man from Zorah[a], from the clan of the Danites, and his name was Manoah. His wife was barren and had not borne children.
translation:
  language: sw
  text: Kulikuwa na mtu mmoja kutoka Sora, wa ukoo wa Wadani, na jina lake lilikuwa Manoa. Mke wake alikuwa tasa, wala hakuwa amezaa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala hakuwa amezaa watoto.” Kiebrania kinasema kwa maana halisi, “wala hakuwa amezaa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Kulikuwa na
  rationale: Kauli hii ya kawaida ya usimulizi inaanzisha tukio au mhusika mpya; “Kulikuwa na” ni ya asili katika Kiswahili na haiingizi neno la wakati lisilokuwamo wazi katika Kiebrania.
- source_word: אִישׁ אֶחָד
  choice: mtu mmoja
  rationale: Muundo huu unamtambulisha mtu fulani ambaye bado hajatajwa jina; “mtu mmoja” huhifadhi umahususi huo kwa Kiswahili cha kawaida.
- source_word: מִצָּרְעָה
  choice: kutoka Sora
  rationale: Kihusishi מִן kinaonyesha mahali alikotoka; jina la mahali limetoholewa kuwa “Sora.”
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: wa ukoo wa Wadani
  rationale: מִשְׁפָּחָה hapa ni kundi la kindugu ndani ya kabila, hivyo “ukoo” ni sahihi kuliko “kabila”; הַדָּנִי imetafsiriwa kwa maana ya watu wa Dani.
- source_word: וּשְׁמוֹ מָנוֹחַ
  choice: jina lake Manoa
  rationale: Hii ni kauli ya kawaida ya Kiebrania ya kutaja jina; muundo wa Kiswahili ni wazi na wenye mtiririko wa kawaida.
- source_word: עֲקָרָה
  choice: alikuwa tasa
  rationale: “Tasa” ni neno fupi, linaloeleweka, na linalolingana na hali ya kutoweza kupata mtoto katika muktadha huu.
- source_word: וְלֹא יָלָדָה
  choice: wala hakuwa amezaa
  rationale: Kitenzi ילד chenye mhusika wa kike humaanisha kuzaa. Kiebrania hakitaji kitu kama “mtoto” au “watoto,” kwa hiyo tafsiri kuu haikiongezi, huku “wala” ikiunganisha kauli ya pili ya kusisitiza hali hiyo.
