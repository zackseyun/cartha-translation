  text: וַ/תָּבֹ֣א הָ/אִשָּׁ֗ה וַ/תֹּ֣אמֶר לְ/אִישָׁ/הּ֮ לֵ/אמֹר֒ אִ֤ישׁ הָ/אֱלֹהִים֙ בָּ֣א אֵלַ֔/י וּ/מַרְאֵ֕/הוּ כְּ/מַרְאֵ֛ה מַלְאַ֥ךְ הָ/אֱלֹהִ֖ים נוֹרָ֣א מְאֹ֑ד וְ/לֹ֤א שְׁאִלְתִּ֨י/הוּ֙ אֵֽי מִ/זֶּ֣ה ה֔וּא וְ/אֶת שְׁמ֖/וֹ לֹֽא הִגִּ֥יד לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/006.yaml
  text: Then the woman came and said to her husband[a], “A man of God came to me, and his appearance was like the appearance of an angel of God, very fearsome. I did not ask him where he was from[b], and he did not tell me his name.”
translation:
  language: sw
  text: Ndipo yule mwanamke akaja na kumwambia mume wake, “Mtu wa Mungu alikuja kwangu. Sura yake ilikuwa kama sura ya malaika wa Mungu[a], nayo ilikuwa ya kutisha sana[b]. Sikumuuliza alikotoka, wala hakuniambia jina lake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe wa Mungu.” Neno la Kiebrania מַלְאָךְ linaweza kumaanisha “malaika” au “mjumbe.” Usemi wa Kiswahili “malaika wa Mungu” hauamui wazi ikiwa ni “malaika mmoja wa Mungu” au “yule malaika wa Mungu.”
    reason: alternative_reading
  - marker: b
    text: Au, “ya kutia kicho sana” au “ya kuogofya sana.” Neno la Kiebrania linaeleza mwonekano unaotia hofu na kicho kikuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: yule mwanamke
  rationale: Kibainishi cha Kiebrania na muktadha humtambulisha mwanamke ambaye tayari anajulikana katika simulizi; “yule mwanamke” ni ya kawaida na huhifadhi namna ya Kiebrania.
- source_word: לְאִישָׁהּ
  choice: mume wake
  rationale: Katika muktadha wa ndoa, אִישׁ pamoja na kiambishi cha nafsi ya kike humaanisha kwa kawaida “mume wake.”
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mtu wa Mungu
  rationale: Huhifadhi cheo cha kawaida cha Kiebrania bila kumtambulisha mapema zaidi ya taarifa ya mwanamke.
- source_word: וּמַרְאֵהוּ כְּמַרְאֵה
  choice: Sura yake ilikuwa kama sura
  rationale: Kurudia “sura” huhifadhi urudiaji wa מַרְאֶה na ulinganisho wa wazi katika chanzo.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: malaika wa Mungu
  rationale: “Malaika” huwasilisha mjumbe wa ulimwengu wa kiroho katika muktadha huu. Kiswahili hakina vibainishi vinavyolingana moja kwa moja na “a/the,” hivyo usemi huu huhifadhi kwa kawaida kiwango fulani cha utata wa utambulisho.
- source_word: נוֹרָא מְאֹד
  choice: alikuwa wa kutisha sana
  rationale: נוֹרָא huonyesha hofu kuu au kicho kinachotokana na mwonekano; “wa kutisha sana” ni ya sasa, yenye heshima, na huhifadhi uzito huo.
- source_word: אֵי מִזֶּה הוּא
  choice: alikotoka
  rationale: Ni tafsiri ya kawaida ya Kiswahili kwa swali la asili au mahali alikotoka.
- source_word: וְאֶת שְׁמוֹ לֹא הִגִּיד לִי
  choice: wala hakuniambia jina lake
  rationale: Huwasilisha kwa lugha ya kawaida tendo la kutofunua au kutotaja jina.
theological_decisions:
- issue: Utambulisho wa מַלְאַךְ הָאֱלֹהִים katika hatua hii ya simulizi
  choice: malaika wa Mungu
  alternative: mjumbe wa Mungu
  rationale: “Malaika wa Mungu” inafaa kwa ziara ya kimbinguni, lakini haiongezi hitimisho la kiteolojia kuhusu utambulisho kamili wa mgeni. Kutokuwapo kwa vibainishi katika Kiswahili pia hakuamui kimabavu kati ya “malaika mmoja” na “yule malaika” katika hatua hii.
- issue: Ikiwa נוֹרָא מְאֹד humweleza mgeni au sura yake
  choice: naye alikuwa wa kutisha sana
  alternative: sura yake ilikuwa ya kutisha sana
  rationale: Kiebrania kinaweza kuhusisha sifa hiyo na mtu au mwonekano wake. Tafsiri iliyochaguliwa humweleza mgeni huku sentensi iliyotangulia ikiweka wazi kuwa mwonekano wake ndio unaozungumziwa, hivyo mvutano huo hauondolewi kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya simulizi, ya sasa na yenye hadhi. “Ndipo … akaenda na kumwambia” huendeleza mfuatano wa matukio kwa kawaida, na sentensi zimegawanywa ili usemi wa mwanamke usomeke kwa urahisi bila kuacha maudhui ya Kiebrania.
