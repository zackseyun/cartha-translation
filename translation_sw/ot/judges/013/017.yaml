  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל מַלְאַ֥ךְ יְהוָ֖ה מִ֣י שְׁמֶ֑/ךָ כִּֽי יָבֹ֥א דברי/ך וְ/כִבַּדְנֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/017.yaml
  text: Then Manoah said to the angel of Yahweh[a], “What is your name, so that when your words come to pass, we may honor you?”
translation:
  language: sw
  text: Ndipo Manoa akamwambia malaika wa Yahweh[a], “Jina lako ni nani, ili maneno yako yatakapotimia, tukupe heshima?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe wa Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: מַלְאַךְ inaweza kumaanisha ‘mjumbe’ au ‘malaika’; katika simulizi hili mhusika anaonyeshwa kuwa wa asili ya kimbinguni, hivyo ‘malaika’ ni tafsiri ya kawaida zaidi. Jina יְהוָה limetafsiriwa ‘Yahweh’.
- source_word: מִי שְׁמֶךָ
  choice: Jina lako ni nani
  rationale: Hii ni njia ya asili na inayoeleweka katika Kiswahili ya kuuliza jina la mtu, huku ikibaki karibu na muundo wa Kiebrania wenye מִי, ‘nani’.
- source_word: כִּי
  choice: ili
  rationale: 'Hapa kiunganishi kinaeleza kusudi la Manoa kutaka kujua jina: wapate kumpa heshima baada ya ujumbe wake kutimia.'
- source_word: יָבֹא דְבָרֶיךָ
  choice: maneno yako yatakapotimia
  rationale: ‘Maneno yako’ huhifadhi wingi wa דְבָרֶיךָ, na ‘yatakapotimia’ huwasilisha kwa Kiswahili maana ya ujumbe uliotangazwa kuwa kweli kwa kutokea.
- source_word: וְכִבַּדְנוּךָ
  choice: tukupe heshima
  rationale: Piel ya כבד hapa inamaanisha kumheshimu au kumpa heshima. Tafsiri hii ni ya asili na haiongezi dhana yenye nguvu zaidi ya ‘kutukuza’.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko lina jina la agano יְהוָה moja kwa moja; ‘Yahweh’ hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Utambulisho wa מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  alternative: mjumbe wa Yahweh
  rationale: ‘Malaika’ inafaa kwa namna mhusika anavyoonyeshwa katika simulizi, lakini uwezekano wa kimsamiati wa ‘mjumbe’ umehifadhiwa katika tanbihi bila kuamua zaidi utambulisho wake wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kusudi na wakati umetolewa kwa ‘ili ... yatakapotimia,’ na wingi wa ‘maneno’ umehifadhiwa.
