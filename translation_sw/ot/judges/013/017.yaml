  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: Manoa anasema na malaika wa Yahweh, anauliza jina lake, na kusudi ni kumpa heshima maneno yake yatakapotimia. Wingi wa דְבָרֶיךָ umehifadhiwa kwa “maneno yako,” na hali ya kusudi katika כִּי ... וְכִבַּדְנוּךָ imetolewa vizuri kwa “ili ... tukupe heshima.”'
