base_translation:
  language: en
  yaml_path: translation/ot/judges/013/011.yaml
  text: So Manoah arose and went after his wife[a], and came to the man and said to him, “Are you the man who spoke to the woman?” And he said[c][b], “I am.”
translation:
  language: sw
  text: Basi Manoa akainuka, akamfuata mke wake[a], akamwendea yule mtu na kumuuliza, “Je, wewe ndiye yule mtu aliyezungumza na huyo mwanamke[b]?” Naye akajibu, “Ni mimi[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “akifuata mke wake.” Kiebrania kwa neno kwa neno: “baada ya mke wake.”'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema “mwanamke,” si “mke wangu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “Mimi ndiye.” Kiebrania kinasema tu “Mimi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Kitenzi קום katika mfululizo huu wa simulizi kina maana ya kuinuka au kuondoka ili kutenda jambo; “akainuka” huhifadhi mtiririko wa simulizi bila kuwa cha kizamani.
- source_word: וַיֵּלֶךְ מָנוֹחַ אַחֲרֵי אִשְׁתּוֹ
  choice: Manoa akamfuata mke wake
  rationale: הלך hapa ni kwenda, na אַחֲרֵי אִשְׁתּוֹ kwa neno kwa neno ni “nyuma ya mke wake.” Katika Kiswahili cha kawaida, “akamfuata mke wake” huwasilisha kwa usahihi kwamba alikwenda nyuma yake au kwa kufuata mwongozo wake.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: akamwendea yule mtu
  rationale: בוא pamoja na אֶל huonyesha kumjia au kumwendea mtu. “Akamwendea” ni ya asili katika mtazamo wa simulizi wa Kiswahili, huku “yule mtu” ikihifadhi namna mhusika huyo anavyoelezwa katika mstari huu.
- source_word: הַאַתָּה הָאִישׁ
  choice: Je, wewe ndiye yule mtu
  rationale: Muundo wa swali unauliza moja kwa moja kama anayezungumziwa ndiye mtu huyo. “Wewe ndiye” ni Kiswahili cha kawaida na chenye msisitizo unaolingana na kiwakilishi cha Kiebrania.
- source_word: אֲשֶׁר דִּבַּרְתָּ אֶל הָאִשָּׁה
  choice: aliyezungumza na huyo mwanamke
  rationale: Kifungu hiki kinamtambulisha mtu kwa tendo la kusema na mwanamke huyo. “Kuzungumza na” ni usemi wa kawaida wa Kiswahili; “huyo mwanamke” huhifadhi nomino ya Kiebrania badala ya kuibadili kuwa “mke wangu.”
- source_word: וַיֹּאמֶר אָֽנִי
  choice: Naye akajibu, “Ni mimi”
  rationale: Jibu la Kiebrania ni kiwakilishi pekee, “mimi,” likitumika kama uthibitisho wa utambulisho. “Ni mimi” ndilo jibu la kawaida na la wazi katika Kiswahili. “Akajibu” huwasilisha kazi ya וַיֹּאמֶר katika mazungumzo haya kwa ufasaha.
theological_decisions:
- issue: Utambulisho wa mgeni
  choice: yule mtu
  alternative: malaika; mjumbe
  rationale: Ingawa muktadha mpana baadaye unamtambulisha kama malaika wa BWANA, mstari huu unatumia nomino ya kawaida הָאִישׁ, “mtu.” Tafsiri inadumisha namna simulizi linavyofunua utambulisho wake hatua kwa hatua bila kuingiza mapema taarifa ya baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Mfululizo wa vitenzi vya “aka-” huhifadhi mwendo wa simulizi la Kiebrania bila kufanya sentensi kuwa nzito.
