  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa BWANA
  rationale: Huhifadhi maana ya kawaida ya neno מַלְאַךְ na huwakilisha jina la Mungu kwa desturi ya Kiswahili ya kuandika BWANA kwa herufi kubwa.
- source_word: נַעְצְרָה נָּא אוֹתָךְ
  choice: Tafadhali, turuhusu tukuzuie kidogo
  rationale: Kauli hii ni ombi la kumfanya mgeni akae badala ya kuondoka; 'kidogo' huifanya maana hiyo iwe ya kawaida na yenye adabu katika Kiswahili bila kudai muda mahususi.
- source_word: וְנַעֲשֶׂה לְפָנֶיךָ
  choice: ili tukuandalie
  rationale: Katika muktadha wa ukarimu, עשׂה ikifuatwa na chakula humaanisha kukiandaa, na לְפָנֶיךָ humwelekezea anayehudumiwa. 'Ili' huonyesha kusudi linaloeleweka katika ombi hilo.
- source_word: גְּדִי עִזִּים
  choice: mwana-mbuzi
  rationale: Ni mwana wa mbuzi, yaani mbuzi mchanga; 'mwana-mbuzi' ni tafsiri fupi na sahihi ya Kiswahili.
theological_decisions:
- issue: Utambulisho wa מַלְאַךְ יְהוָה
  choice: malaika wa BWANA
  alternative: Malaika wa BWANA
  rationale: Kiebrania hakitumii utofautishaji wa herufi kubwa unaoweza kuamua mapema hadhi au utambulisho wa malaika huyu; herufi ndogo katika 'malaika' huhifadhi kutokuweka hitimisho la ziada, huku 'BWANA' ikiwakilisha jina la Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na mtiririko wa kawaida. Muundo wa simulizi 'Ndipo ... akamwambia' unafaa mfululizo wa matukio, na ombi limetolewa kwa adabu bila lugha ya kizamani.
