id: JDG.13.1
reference: Judges 13:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד פְּלִשְׁתִּ֖ים אַרְבָּעִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[b][a], and Yahweh gave them into the hand of the Philistines for forty years.
translation:
  language: sw
  text: Wana wa Israeli[a] wakafanya tena yaliyo maovu machoni pa Yahwe, naye Yahwe akawatia mikononi mwa Wafilisti[b] kwa miaka arobaini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania ni “wana wa Israeli,” jina la pamoja kwa watu wote wa Israeli.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi ni “katika mkono wa Wafilisti,” yaani, chini ya nguvu au mamlaka yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: wakafanya tena
  rationale: Kitenzi יסף pamoja na kitenzi-jina huonyesha kurudia au kuendelea. Katika mzunguko unaorudiwa katika kitabu cha Waamuzi, “wakafanya tena” huonyesha wazi kwamba Israeli walirudia uovu wao.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Hili ndilo umbo la kifamilia la Kiebrania, linalowataja kwa pamoja watu wote wa Israeli. Kiswahili hiki ni cha kawaida katika lugha ya Biblia na hakimaanishi wanaume peke yao.
- source_word: לַעֲשׂוֹת הָרַע
  choice: yaliyo maovu
  rationale: Usemi huu humaanisha kufanya mambo ambayo yanahukumiwa kuwa maovu. “Yaliyo maovu” ni wa asili katika Kiswahili na huhifadhi nguvu ya tathmini ya maadili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania huku ikieleweka kuwa ni kulingana na hukumu au tathmini ya Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika matini.
- source_word: וַיִּתְּנֵם
  choice: akawatia
  rationale: Pamoja na usemi “mikononi mwa,” kitenzi hiki huonyesha kwamba Yahwe aliwaweka chini ya nguvu za Wafilisti. “Akawatia” ni Kiswahili cha asili kinachohifadhi muundo wa picha hiyo.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: mikononi mwa Wafilisti
  rationale: Huu ni usemi wa Kiswahili unaoeleweka kwa urahisi kama kuwekwa chini ya nguvu au mamlaka ya mwingine, na bado huhifadhi taswira ya “mkono” ya Kiebrania.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ni umbo la kawaida la Kiswahili kwa jina la kundi hili la watu.
- source_word: אַרְבָּעִים שָׁנָה
  choice: kwa miaka arobaini
  rationale: “Kwa” huonyesha kwa kawaida muda ambao hali hiyo iliendelea.
theological_decisions:
- issue: Kutafsiri jina la agano יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina la agano badala ya kuliwakilisha kwa cheo.
- issue: Maana ya pamoja ya בְּנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  alternative: Waisraeli
  rationale: Usemi wa Kiebrania ni wa kifamilia lakini humaanisha taifa lote kwa pamoja. Tafsiri ya msingi huhifadhi usemi huo bila kuudhibiti kwa wanaume peke yao; tanbihi inaeleza maana yake ya kitaifa.
- issue: Yahwe kuwatia Israeli katika mkono wa Wafilisti
  choice: Yahwe akawatia mikononi mwa Wafilisti
  alternative: Yahwe akawaweka chini ya mamlaka ya Wafilisti
  rationale: Tafsiri huhifadhi dai la matini kwamba Yahwe ndiye aliyewatia chini ya nguvu za Wafilisti, bila kupunguza au kueleza zaidi sababu ya kitendo hicho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “naye” unaunganisha vifungu kwa mtiririko wa asili; “machoni pa” na “mikononi mwa” huhifadhi taswira muhimu za Kiebrania bila kufanya sentensi iwe ngumu.
