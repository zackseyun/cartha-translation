base_translation:
  language: en
  yaml_path: translation/ot/judges/013/021.yaml
  text: And the angel of Yahweh did not appear again to Manoah and to his wife[a]. Then Manoah knew that he was the angel of Yahweh.
translation:
  language: sw
  text: Malaika wa Yahweh hakuwatokea tena Manoa na mke wake.[a] Ndipo Manoa akatambua kwamba huyo alikuwa malaika wa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mjumbe wa Yahweh.” Neno la Kiebrania linaweza kumaanisha “mjumbe” au “malaika”; katika muktadha huu linamrejelea mhusika wa ajabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָסַף עוֹד ... לְהֵרָאֹה
  choice: hakumtokea tena
  rationale: Muundo יָסַף pamoja na עוֹד na kitenzi-jina unaonyesha kwamba tendo halikufanyika tena; Kiswahili cha kawaida ni “hakumtokea tena.”
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: מַלְאַךְ inaweza kumaanisha mjumbe au malaika; katika muktadha huu mhusika ni wa ulimwengu wa roho, hivyo “malaika” linafaa, huku jina la agano יְהוָה likitolewa kama “Yahweh.”
- source_word: לְהֵרָאֹה
  choice: kumtokea
  rationale: Niphal ya ראה hapa ina maana ya kuonekana au kujitokeza kwa mtu; “kumtokea” ni ya asili katika simulizi hili.
- source_word: אֶל מָנוֹחַ וְאֶל אִשְׁתּוֹ
  choice: Manoa wala mke wake
  rationale: Baada ya ukanushi, “wala” huwasilisha kwa kawaida kwamba malaika hakumtokea yeyote kati yao, bila kubadili maana ya viambishi vya Kiebrania.
- source_word: אָז יָדַע
  choice: Ndipo Manoa akatambua
  rationale: אָז inaonyesha hatua inayofuata na matokeo yake; יָדַע hapa ni kutambua utambulisho wa mhusika, hivyo “ndipo ... akatambua” ni wazi na ya asili.
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: kwamba huyo alikuwa malaika wa Yahweh
  rationale: הוּא inamrejelea mhusika aliyekuwa amewatokea; “huyo” hudumisha rejeo la kibinafsi kwa uwazi bila kuongeza utambulisho wa kitheolojia usiotajwa.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi yana Tetragramatoni yenyewe; “Yahweh” huhifadhi jina hilo badala ya kulibadili kuwa cheo.
- issue: Utambulisho wa מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  alternative: mjumbe wa Yahweh
  rationale: “Malaika” linaendana na mhusika wa ajabu katika muktadha, lakini tanbihi huhifadhi uwezekano wa kimsamiati wa “mjumbe.” Tafsiri haimtambulishi zaidi ya kauli ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Manoa” limetumiwa kama umbo la kawaida la jina Manoah katika Biblia za Kiswahili. Muundo “wala mke wake” ni wa asili baada ya ukanushi na huepuka marudio mazito.
