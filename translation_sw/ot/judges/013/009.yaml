base_translation:
  language: en
  yaml_path: translation/ot/judges/013/009.yaml
  text: And God listened to the voice of Manoah, and the angel of God came again to the woman while she was sitting in the field, and Manoah her husband was not with her.
translation:
  language: sw
  text: Mungu akasikiliza sauti ya Manoa, na malaika wa Mungu akamjia tena yule mwanamke alipokuwa ameketi shambani, na Manoa, mume wake, hakuwa pamoja naye.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: akasikiliza
  rationale: Kitenzi שׁמע kinaweza kumaanisha kusikia au kusikiliza kwa makini; katika muktadha huu Mungu anaitikia ombi la Manoa, hivyo “akasikiliza” linaonyesha mwitikio huo bila kuongeza wazo lisilo katika matini.
- source_word: בְּקוֹל מָנוֹחַ
  choice: sauti ya Manoa
  rationale: Huhifadhi nahau ya Kiebrania “kusikiliza sauti ya” kwa Kiswahili kinachoeleweka, badala ya kuifasiri moja kwa moja kuwa “ombi la Manoa.”
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: malaika wa Mungu
  rationale: Katika simulizi hili מַלְאָךְ ni mjumbe wa kimungu; “malaika” ni neno la kawaida na linalofaa katika muktadha huu.
- source_word: עוֹד
  choice: tena
  rationale: Huonyesha kwamba ujio huu unarudia tukio la awali.
- source_word: הָאִשָּׁה
  choice: yule mwanamke
  rationale: Huhifadhi rejeo la matini kwa “mwanamke”; “yule” husaidia kutambulisha kwa kawaida mtu ambaye tayari anajulikana katika simulizi.
- source_word: וְהִיא יוֹשֶׁבֶת בַּשָּׂדֶה
  choice: alipokuwa ameketi shambani
  rationale: Huwasilisha kwa Kiswahili cha kawaida tendo la nyuma linaloonyesha mazingira ya ujio wa malaika.
- source_word: אִישָׁהּ
  choice: mume wake
  rationale: Ingawa אִישׁ kwa msingi ni “mwanamume,” pamoja na kiambishi hiki na katika muktadha huu humaanisha kwa kawaida “mume wake.”
- source_word: אֵין עִמָּהּ
  choice: hakuwa pamoja naye
  rationale: Hutoa kwa usahihi wazo la kutokuwapo pamoja naye.
theological_decisions:
- issue: Maana ya הָאֱלֹהִים katika aya hii
  choice: Mungu
  alternative: miungu
  rationale: Ingawa אֱלֹהִים lina umbo la wingi, hapa linamtaja Mungu wa Israeli na linaambatana na kitenzi cha umoja; kwa hiyo “Mungu” ndilo chaguo linalodaiwa na sarufi na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo wa simulizi umehifadhiwa bila kuwa mgumu; kiunganishi “lakini” kinaonyesha kwa kawaida tofauti iliyo katika taarifa ya mwisho kwamba Manoa hakuwapo pamoja na mke wake.
