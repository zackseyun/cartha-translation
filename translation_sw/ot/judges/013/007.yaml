id: JDG.13.7
reference: Judges 13:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לִ֔/י הִנָּ֥/ךְ הָרָ֖ה וְ/יֹלַ֣דְתְּ בֵּ֑ן וְ/עַתָּ֞ה אַל תִּשְׁתִּ֣י יַ֣יִן וְ/שֵׁכָ֗ר וְ/אַל תֹּֽאכְלִי֙ כָּל טֻמְאָ֔ה כִּֽי נְזִ֤יר אֱלֹהִים֙ יִהְיֶ֣ה הַ/נַּ֔עַר מִן הַ/בֶּ֖טֶן עַד י֥וֹם מוֹתֽ/וֹ־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/007.yaml
  text: For he said to me[a], ‘Look, you will conceive and bear a son. So now, do not drink wine or strong drink, and do not eat anything unclean[b], for the boy will be a Nazirite of God from the womb until the day of his death.’
translation:
  language: sw
  text: Naye akaniambia, “Tazama, utachukua mimba na kuzaa mwana.[a] Basi sasa usinywe divai wala kileo, wala usile chochote kilicho najisi, kwa maana huyo mtoto atakuwa Mnadhiri wa Mungu[b] tangu tumboni mpaka siku ya kufa kwake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata umbo la Kiebrania kwa karibu zaidi: “Tazama, una mimba, nawe utazaa mwana”; katika muktadha, maneno hayo yanaweza kueleweka kuwa tangazo la jambo litakalotokea.'
    reason: lexical_alternative
  - marker: b
    text: “Mnadhiri” ni istilahi ya mtu aliyewekwa wakfu kwa Mungu kwa nadhiri maalumu.
    reason: technical_term
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: Naye akaniambia
  rationale: Kiunganishi וַ huendeleza simulizi kwa maana ya ‘na/naye’; ‘akaniambia’ huonyesha kwa kawaida kitenzi pamoja na yule aliyeambiwa bila kuongeza sababu ambayo haipo wazi katika Kiebrania.
- source_word: הִנָּךְ הָרָה וְיֹלַדְתְּ בֵּן
  choice: Tazama, utachukua mimba na kuzaa mwana
  rationale: ‘Tazama’ huwasilisha הִנֵּה kwa lugha ya heshima isiyo ya kizamani. Ingawa הָרָה kwa umbo lake linaweza kumaanisha ‘una mimba,’ muktadha wa tangazo unaunga mkono maana ya wakati ujao; tanbihi huhifadhi uwezekano wa tafsiri ya karibu zaidi na umbo la Kiebrania.
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Kauli hii huhamisha ujumbe kutoka tangazo kwenda maagizo; ‘basi sasa’ huhifadhi uhusiano huo wa kimantiki.
- source_word: אַל תִּשְׁתִּי יַיִן וְשֵׁכָר
  choice: usinywe divai wala kileo
  rationale: יַיִן ni divai, na שֵׁכָר ni kinywaji chenye kulevya kisicho lazima kiwe divai; ‘kileo’ ni neno pana na la kawaida katika Kiswahili.
- source_word: וְאַל תֹּאכְלִי כָּל טֻמְאָה
  choice: wala usile chochote kilicho najisi
  rationale: Kirai hiki kinakataza kitu chochote kisicho safi kwa mujibu wa masharti ya kidini; ‘kilicho najisi’ huhifadhi wazo hilo bila kuligeuza kuwa uchafu wa kawaida tu.
- source_word: נְזִיר אֱלֹהִים
  choice: Mnadhiri wa Mungu
  rationale: נָזִיר ni istilahi maalumu kwa mtu aliyewekwa wakfu chini ya nadhiri kwa Mungu. ‘Mnadhiri’ huhifadhi istilahi hiyo badala ya kuifanya kuwa wazo la jumla la utakatifu.
- source_word: הַנַּעַר
  choice: huyo mtoto
  rationale: Katika muktadha wa tangazo la kuzaliwa, ‘mtoto’ ni la kawaida zaidi kuliko ‘mvulana,’ huku ‘mwana’ iliyotangulia tayari ikionyesha jinsia yake.
- source_word: מִן הַבֶּטֶן
  choice: tangu tumboni
  rationale: Tafsiri hii huhifadhi picha na mwanzo wa muda uliotajwa katika Kiebrania, badala ya kuufupisha kuwa ‘tangu kuzaliwa.’
- source_word: עַד יוֹם מוֹתוֹ
  choice: mpaka siku ya kufa kwake
  rationale: Hii ni tafsiri ya moja kwa moja inayohifadhi kikomo cha muda kilichoelezwa na Kiebrania.
theological_decisions:
- issue: Jina la hali maalumu ya Mnadhiri
  choice: Mnadhiri wa Mungu
  alternative: mtu aliyewekwa wakfu kwa Mungu
  rationale: Kiebrania kinatumia istilahi ya kiufundi נְזִיר, si maelezo ya jumla ya mtu mtakatifu. Kutumia ‘Mnadhiri’ huhifadhi uhusiano wake na nadhiri na sheria zake bila kuongeza fundisho la dhehebu fulani.
- issue: Wakati wa tangazo kuhusu mimba
  choice: utachukua mimba na kuzaa mwana
  alternative: una mimba, nawe utazaa mwana
  rationale: Umbo la הָרָה linaweza kusomwa kama hali ya sasa, lakini muktadha wa tangazo kabla ya kuzaliwa unaunga mkono maana ya kinabii ya wakati ujao. Tanbihi inaacha wazi maana ya karibu zaidi na umbo la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Kileo’ huepuka kubainisha aina isiyotajwa ya kinywaji, na ‘Mnadhiri’ huhifadhi istilahi maalumu ya Kiebrania.
