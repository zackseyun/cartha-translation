  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: tangazo la mimba na mwana, makatazo ya divai/kileo na kitu najisi, na hali ya Mnadhiri tangu tumboni hadi siku ya kufa kwake. Tafsiri ya wakati ujao katika “utachukua mimba” inaungwa mkono na muktadha, huku tanbihi ikihifadhi umbo la Kiebrania linaloweza kusomwa kama hali ya sasa.'
