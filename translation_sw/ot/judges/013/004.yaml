lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Ni kiunganishi cha mazungumzo na wakati kinachoingiza maagizo yanayofuata; “Basi sasa” ni Kiswahili cha kawaida na huhifadhi uhusiano na maneno yaliyotangulia.
- source_word: הִשָּׁמְרִי נָא
  choice: tafadhali jihadhari
  rationale: Kitenzi cha kike cha umoja kina maana ya kujilinda au kuwa mwangalifu, huku נָא ikitoa ombi la upole linalowakilishwa na “tafadhali.”
- source_word: וְאַל תִּשְׁתִּי
  choice: usinywe
  rationale: Ni katazo linaloelekezwa kwa mwanamke mmoja; Kiswahili huonyesha nafsi hiyo kiasili katika umbo la kitenzi.
- source_word: יַיִן
  choice: divai
  rationale: Ni kilinganishi cha kawaida na cha moja kwa moja cha kinywaji kinachotajwa.
- source_word: וְשֵׁכָר
  choice: wala kileo
  rationale: Neno hili humaanisha kinywaji chenye kulevya ambacho si divai; “kileo” ni pana na la kawaida kuliko kukifinya kuwa aina moja kama pombe ya nafaka.
- source_word: וְאַל תֹּאכְלִי
  choice: wala usile
  rationale: “Wala” huunganisha kwa kawaida katazo hili la pili na lile la kwanza katika Kiswahili.
- source_word: כָּל טָמֵא
  choice: kitu chochote kilicho najisi
  rationale: כָּל pamoja na kivumishi kilichotumiwa kama nomino humaanisha chochote kilicho katika hali au kundi la unajisi; tafsiri hii haiibani maana kuwa chakula cha aina fulani tu.
theological_decisions:
- issue: Maana ya טָמֵא katika muktadha huu
  choice: najisi
  alternative: kichafu
  rationale: “Najisi” huhifadhi dhana ya kiibada/kisheria ya Torati bila kuifanya iwe suala la uchafu wa kawaida, afya, au ubaya wa kimaadili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa katazo umewekwa kwa lugha ya kawaida; “najisi” limetumiwa kwa maana ya kiibada ya kibiblia. Alama zote za tanbihi zimewekwa katika matini kuu.
