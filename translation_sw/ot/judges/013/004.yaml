  yaml_path: translation/ot/judges/013/004.yaml
  text: Now please be careful[a], and do not drink wine or strong drink[c][b], and do not eat anything unclean.
translation:
  language: sw
  text: Basi sasa, tafadhali jihadhari[a]; usinywe divai wala kileo[b], wala usile kitu chochote kilicho najisi.
  philosophy: optimal-equivalence
  footnotes:
