base_translation:
  language: en
  yaml_path: translation/ot/judges/013/018.yaml
  text: And the angel of Yahweh said to him[a], “Why do you ask my name, seeing it is wonderful?”
translation:
  language: sw
  text: Malaika wa Yahwe akamwambia, “Kwa nini unauliza jina langu, nalo ni la ajabu[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lisiloweza kueleweka,” “lisilofahamika,” au labda “la siri.” Neno la Kiebrania humaanisha jambo lisilo la kawaida au la ajabu mno kiasi cha kutoweza kufahamika kikamilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: Malaika wa Yahwe
  rationale: Katika simulizi hili מַלְאַךְ ni mjumbe wa kimbinguni, hivyo “malaika” ni neno la kawaida na linalofaa zaidi; jina la Mungu יְהוָה limetoholewa kuwa “Yahwe.”
- source_word: לָמָּה זֶּה
  choice: Kwa nini
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuwasilisha swali la balagha la Kiebrania bila ugumu usio wa lazima.
- source_word: תִּשְׁאַל לִשְׁמִי
  choice: unauliza jina langu
  rationale: Kitenzi שׁאל pamoja na “jina” humaanisha kuuliza au kutaka kujua jina la mtu; tafsiri hii ni ya moja kwa moja na ya asili.
- source_word: וְהוּא
  choice: nalo ni
  rationale: Kiunganishi cha Kiebrania kinaunganisha maelezo kuhusu jina; “nalo” hudumisha mtiririko huo na kupatana na ngeli ya “jina” bila kulazimisha uhusiano wa kisababishi kuliko ulivyo wazi katika chanzo.
- source_word: פֶלִאי
  choice: la ajabu
  rationale: Neno hili huonyesha jambo la kustaajabisha, lisilo la kawaida, au lililo kuu mno kufahamika kikamilifu. “La ajabu” ni fupi, la kawaida, na huhifadhi upana wa maana, huku maelezo ya chini yakitaja uwezekano mwingine.
theological_decisions:
- issue: Uzito unaoweza kuwa wa kiteofania au wa Kikristo katika פֶלִאי
  choice: Kutafsiri kifasili kuwa “la ajabu” bila kuamua utambulisho wa malaika ndani ya tafsiri.
  alternative: Kutafsiri kwa ufafanuzi zaidi kuwa “lisiloweza kueleweka” au kulitumia kama jina maalumu.
  rationale: Kauli hiyo inaweza kuchochea tafakari kuhusu utambulisho wa malaika wa Yahwe, lakini Kiebrania hakilazimishi hitimisho hilo hapa. Tafsiri ya moja kwa moja huhifadhi mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo “akamwambia” unafaa kwa mfululizo wa kisimulizi, na “nalo ni” huhifadhi uratibu wa Kiebrania kwa ufasaha.
