base_translation:
  language: en
  yaml_path: translation/ot/judges/013/003.yaml
  text: And the angel of the LORD appeared to the woman and said to her, “Look, please—you are barren and have not borne children, but you will conceive and bear a son.”
translation:
  language: sw
  text: Malaika wa BWANA akamtokea yule mwanamke, akamwambia, “Tazama, wewe ni tasa, wala hujazaa; lakini utachukua mimba na kuzaa mwana.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: Malaika wa BWANA
  rationale: Huhifadhi muundo na utambulisho wa kirai cha Kiebrania, huku ‘BWANA’ ikiwakilisha jina la agano יהוה kwa desturi iliyozoeleka katika Biblia za Kiswahili.
- source_word: הִנֵּה נָא
  choice: Tazama
  rationale: ‘Tazama’ ni mwito wa kuzingatia unaofaa katika simulizi la heshima. Chembe נָא huleta ulainishaji au msisitizo ambao Kiswahili hakiwezi kuutenga hapa kwa neno ‘tafadhali’ bila kufanya kauli isikike isiyo ya kawaida.
- source_word: עֲקָרָה
  choice: tasa
  rationale: Neno la kawaida, lenye heshima, linaloonyesha hali ya kutoweza kupata mtoto.
- source_word: וְלֹא יָלַדְתְּ
  choice: na hujazaa mtoto
  rationale: Huwasilisha hali ya kutokuwa amewahi kuzaa; ‘mtoto’ imeongezwa kwa uwazi wa kawaida wa Kiswahili bila kubadili maana.
- source_word: וְהָרִית וְיָלַדְתְּ בֵּן
  choice: lakini utachukua mimba na kuzaa mwana
  rationale: Hufuata mfuatano wa ahadi wa Kiebrania na kutaja wazi kwamba mtoto atakayezaliwa ni wa kiume.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ kwa herufi kubwa ni desturi pana ya tafsiri za Biblia za Kiswahili na huhifadhi tofauti kati ya jina la Mungu na cheo cha kawaida, bila kuingiza msimamo wa dhehebu.
- issue: Uhusiano kati ya utasa na ahadi
  choice: lakini utachukua mimba
  alternative: nawe utachukua mimba
  rationale: Kiunganishi cha Kiebrania kinaweza kuwa cha kawaida au cha kutofautisha. ‘Lakini’ huonyesha kwa kawaida tofauti kati ya hali yake ya sasa na ahadi inayofuata bila kueleza zaidi namna ya utimilifu wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya simulizi ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo umebaki karibu na Kiebrania, lakini umeepuka matumizi yasiyo ya kawaida ya ‘tafadhali’ baada ya ‘Tazama’.
