base_translation:
  language: en
  yaml_path: translation/ot/judges/013/020.yaml
  text: And when the flame went up from the altar toward heaven[a], the angel of Yahweh went up in the flame of the altar, while Manoah and his wife were watching[b]; and they fell on their faces to the ground.
translation:
  language: sw
  text: Ikawa, mwali ulipopanda kutoka madhabahuni kuelekea mbinguni, malaika wa Yahwe[a] akapanda katika mwali wa madhabahu, huku Manoa na mkewe wakitazama; nao wakaanguka kifudifudi ardhini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe wa Yahwe.” Neno la Kiebrania linaweza kumaanisha “malaika” au “mjumbe.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maneno halisi, “wakaanguka juu ya nyuso zao kuelekea ardhini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַעֲלוֹת
  choice: Ikawa, ... ulipopanda
  rationale: Muundo huu unaanzisha tukio linalotokea wakati tendo lingine linaendelea. Tafsiri hii inadumisha mtiririko wa simulizi na maana ya wakati bila kuwa ngumu kupita kiasi.
- source_word: הַלַּהַב
  choice: mwali
  rationale: Neno לַהַב humaanisha mwali au moto uwakao; “mwali” ni neno la kawaida na lenye picha dhahiri katika Kiswahili.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: kutoka madhabahuni
  rationale: Kiebrania kina maana halisi ya kutoka juu ya madhabahu. Umbo la mahali “madhabahuni” linaeleza chanzo cha mwali kwa Kiswahili cha kawaida.
- source_word: הַשָּׁמַיְמָה
  choice: kuelekea mbinguni
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha mwendo kuelekea mbinguni, si lazima kuwasili huko.
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahwe
  rationale: Katika muktadha huu mhusika ni wa kimbingu, hivyo “malaika” ni tafsiri ya kawaida; tanbihi inadumisha uwezekano wa maana ya “mjumbe.” Jina la Mungu limetafsiriwa Yahwe.
- source_word: בְּלַהַב הַמִּזְבֵּחַ
  choice: katika mwali wa madhabahu
  rationale: Kihusishi ב kinaweza kuonyesha kuwamo au njia ya kupandia. “Katika mwali” inadumisha taswira hiyo bila kufafanua kupita ushahidi wa maandishi.
- source_word: וּמָנוֹחַ וְאִשְׁתּוֹ רֹאִים
  choice: huku Manoa na mkewe wakitazama
  rationale: Hali ya kitenzi inaonyesha kitendo cha kutazama kilichoendelea wakati malaika akipanda.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם אָרְצָה
  choice: wakaanguka kifudifudi chini
  rationale: Hii ni tafsiri ya asili ya Kiswahili inayohifadhi mkao wa kuanguka uso ukielekea ardhini; tanbihi inatoa umbo la karibu zaidi na maneno ya Kiebrania.
theological_decisions:
- issue: Utambulisho wa מַלְאַךְ יְהוָה
  choice: malaika wa Yahwe
  alternative: mjumbe wa Yahwe; au kumfafanua moja kwa moja kuwa udhihirisho wa Mungu
  rationale: Maandishi yanamtaja kama malaika au mjumbe wa Yahwe lakini hayamlazimishi mtafsiri kuamua hapa ikiwa ni kiumbe cha kimalaika au udhihirisho wa Mungu. Tafsiri inaacha suala hilo wazi.
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: “Yahwe” linawakilisha jina binafsi la Mungu katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa sasa. “Ikawa” hudumisha ladha ya simulizi bila kufanya sentensi kuwa nzito; “kifudifudi chini” ni usemi wa kawaida unaoonyesha wazi mkao wa wahusika.
