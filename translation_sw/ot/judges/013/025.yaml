base_translation:
  language: en
  yaml_path: translation/ot/judges/013/025.yaml
  text: And the Spirit of Yahweh began to stir him in Mahaneh-dan[b][a], between Zorah and Eshtaol.
translation:
  language: sw
  text: Ndipo Roho wa Yahweh akaanza kumsukuma[a] katika Mahane-dani[b], kati ya Sora na Eshtaoli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kumchochea” au “kumwendesha.”
    reason: lexical_alternative
  - marker: b
    text: Mahane-dani maana yake ni “kambi ya Dani”; hapa limetumiwa kama jina la mahali.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּחֶל
  choice: akaanza
  rationale: Kitenzi hiki kinaonyesha mwanzo wa tendo katika simulizi; “akaanza” ni Kiswahili cha kawaida na huhifadhi maana hiyo ya kuanza.
- source_word: רוּחַ יְהוָה
  choice: Roho wa Yahweh
  rationale: Katika muktadha wa simulizi la Samsoni, kirai hiki kinamaanisha Roho wa Mungu anayemtia nguvu na kumwezesha, si upepo wa kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano lililoandikwa kwa herufi YHWH limehifadhiwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: לְפַעֲמוֹ
  choice: kumsukuma
  rationale: Neno hili linaweza kueleza kumwendesha, kumchochea, au kumtikisa mtu. “Kumsukuma” linaonyesha msukumo wa Roho bila kufafanua mno namna ya tendo hilo.
- source_word: בְּמַחֲנֵה דָן
  choice: huko Mahane-dani
  rationale: Kirai hicho, ingawa maana yake ya moja kwa moja ni “kambi ya Dani,” kinatumika hapa kama jina la mahali; kwa hiyo limetoholewa kama jina.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: kati ya Sora na Eshtaoli
  rationale: Hii ni tafsiri ya kawaida ya usemi wa kijiografia, kwa kutumia maumbo ya majina yanayofaa katika Kiswahili.
theological_decisions:
- issue: Maana ya רוּחַ יְהוָה katika muktadha huu
  choice: Roho wa Yahweh kama uwepo wa Mungu unaomwezesha Samsoni
  alternative: upepo au pumzi ya Yahweh
  rationale: Katika simulizi la Samsoni, kirai hiki hueleza utendaji wa Mungu ndani yake au juu yake. Tafsiri “Roho” huhifadhi nguvu ya kitheolojia ya kifungu bila kuingiza ufafanuzi wa baadaye usiotolewa na aya yenyewe.
- issue: Namna ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu, YHWH. Kulihifadhi kama “Yahweh” hutofautisha jina hilo na cheo na kuwakilisha moja kwa moja ushahidi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. “Ndipo” linaunganisha aya hii kwa kawaida na simulizi lililotangulia; majina Sora, Eshtaoli, na Mahane-dani yametoholewa kwa matamshi ya Kiswahili.
