base_translation:
  language: en
  yaml_path: translation/ot/judges/013/023.yaml
  text: But his wife said to him, “If the LORD had intended to kill us, he would not have accepted from our hand a burnt offering and a grain offering, or shown us all these things, or now announced to us such a thing as this.”
translation:
  language: sw
  text: Lakini mkewe akamwambia, “Kama BWANA angekusudia kutuua, asingepokea kutoka mikononi mwetu sadaka ya kuteketezwa na sadaka ya nafaka, wala asingetuonyesha mambo haya yote, wala sasa asingetutangazia jambo kama hili.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָפֵץ
  choice: angekusudia
  rationale: Katika muundo wa masharti, neno hili linaonyesha nia au kusudi; ‘angekusudia’ ni la kawaida na linaendeleza hoja ya mke wa Manoa.
- source_word: לָקַח מִיָּדֵנוּ
  choice: angepokea kutoka mikononi mwetu
  rationale: Huhifadhi taswira ya Kiebrania ya sadaka kupokewa ‘kutoka mkononi’ mwa watoaji.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Ni istilahi ya kawaida ya dhabihu inayoteketezwa yote madhabahuni.
- source_word: מִנְחָה
  choice: sadaka ya nafaka
  rationale: Katika muktadha huu wa ibada, linamaanisha sadaka ya nafaka, si zawadi kwa ujumla.
- source_word: הִשְׁמִיעָנוּ
  choice: angetutangazia
  rationale: Kitenzi kwa maana halisi ni ‘kutufanya tusikie’; hapa ‘kutangazia’ huwasilisha tendo la Mungu kuwajulisha ujumbe kuhusu jambo lijalo.
- source_word: כָּזֹאת
  choice: jambo kama hili
  rationale: Huhifadhi usemi wa kulinganisha wa Kiebrania bila kuufanya uwe mahususi kuliko chanzo.
theological_decisions:
- issue: Jina la agano יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ ni uwakilishi wa kawaida wa Kiswahili kwa tetragramatoni katika maandishi ya Biblia, bila kuongeza fasiri ya kimadhehebu.
- issue: Maana ya Mungu kupokea sadaka
  choice: asingepokea
  alternative: asingekubali
  rationale: ‘Kupokea’ hufuata לָקַח kwa karibu na kuacha muktadha uonyeshe kibali cha Mungu, badala ya kulifafanua moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya simulizi la Biblia. Muundo wa masharti yasiyotimia umehifadhiwa kwa ‘Kama ... ange-, asinge-’. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi iliyohitajika.
