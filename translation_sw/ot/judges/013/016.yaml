base_translation:
  language: en
  yaml_path: translation/ot/judges/013/016.yaml
  text: And the angel of Yahweh said to Manoah[a], “If you detain me, I will not eat your food. But if you prepare a burnt offering[b], offer it up to Yahweh.” For Manoah did not know that he was the angel of Yahweh.
translation:
  language: sw
  text: Malaika wa Yahweh akamwambia Manoa, “Ukinizuia nibaki, sitakula chakula chako.[a] Lakini ukitayarisha sadaka ya kuteketezwa,[b] itoe kwa Yahweh.” Kwa maana Manoa hakujua kwamba huyo alikuwa malaika wa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya moja kwa moja zaidi, “sitakula mkate wako.” Hapa “mkate” huenda unamaanisha chakula au mlo kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Au, “ukifanya sadaka ya kuteketezwa, lazima umtolee Yahweh.” Kiebrania kinatumia kitenzi kimoja kwa kuitengeneza au kuitayarisha sadaka, na kingine kwa kuitoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: Ingawa מַלְאַךְ linaweza kumaanisha mjumbe au malaika, simulizi hili linamwonyesha kiumbe wa mbinguni; hivyo “malaika” linafaa katika Kiswahili cha kawaida. Jina יהוה limetafsiriwa “Yahweh.”
- source_word: תַּעְצְרֵנִי
  choice: ukinizuia nibaki
  rationale: Kitenzi עצר kina wazo la kumzuia au kumshikilia mtu asiondoke. “Ukinizuia nibaki” linaeleza kwa kawaida ombi la Manoa la kumfanya mgeni akae huku likihifadhi maana ya msingi.
- source_word: לֹא אֹכַל בְּלַחְמֶךָ
  choice: sitakula chakula chako
  rationale: לֶחֶם maana yake ya moja kwa moja ni mkate, lakini mara nyingi humaanisha chakula au mlo kwa ujumla. Muktadha unahusu mlo ulioandaliwa, kwa hiyo “chakula” ni Kiswahili cha asili zaidi.
- source_word: תַּעֲשֶׂה עֹלָה
  choice: ukitayarisha sadaka ya kuteketezwa
  rationale: עשה linapotumiwa kuhusu sadaka linaweza kumaanisha kuitengeneza au kuitayarisha. “Ukitayarisha” linatofautisha hatua hii na kitenzi kinachofuata cha kuitoa sadaka.
- source_word: עֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa sadaka iliyoteketezwa yote na moshi wake kupanda.
- source_word: לַיהוָה תַּעֲלֶנָּה
  choice: itoe kwa Yahweh
  rationale: Hifili ya עלה pamoja na עֹלָה humaanisha kuitoa sadaka hiyo. “Itoe kwa Yahweh” ni wazi na ya kawaida katika Kiswahili, huku kiambishi “i-” kikihifadhi yambwa iliyo katika kitenzi cha Kiebrania.
- source_word: כִּי לֹא יָדַע מָנוֹחַ
  choice: Kwa maana Manoa hakujua
  rationale: כִּי hapa linaanzisha maelezo ya msimulizi; “kwa maana” linaonyesha uhusiano huo wa ufafanuzi.
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: kwamba huyo alikuwa malaika wa Yahweh
  rationale: “Huyo” linarejelea kwa kawaida mtu aliyekuwa mbele ya Manoa na kuhifadhi maelezo kwamba Manoa bado hakuwa ametambua utambulisho wake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limewakilishwa kwa “Yahweh,” badala ya kubadilishwa na cheo, ili kuhifadhi jina la agano lililo katika matini.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini ina Tetragramatoni יהוה. “Yahweh” linahifadhi jina binafsi la Mungu na ndilo uwakilishi unaopendelewa hapa bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, kimetumiwa. Muundo wa mazungumzo ni wa kawaida kwa msomaji wa leo, huku tofauti kati ya kutayarisha sadaka na kuitoa ikihifadhiwa. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
