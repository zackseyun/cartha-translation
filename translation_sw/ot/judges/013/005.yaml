  text: כִּי֩ הִנָּ֨/ךְ הָרָ֜ה וְ/יֹלַ֣דְתְּ בֵּ֗ן וּ/מוֹרָה֙ לֹא יַעֲלֶ֣ה עַל רֹאשׁ֔/וֹ כִּֽי נְזִ֧יר אֱלֹהִ֛ים יִהְיֶ֥ה הַ/נַּ֖עַר מִן הַ/בָּ֑טֶן וְ/ה֗וּא יָחֵ֛ל לְ/הוֹשִׁ֥יעַ אֶת יִשְׂרָאֵ֖ל מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/005.yaml
  text: For behold[a], you are pregnant and will bear a son. No razor shall come upon his head, for the boy shall be a Nazirite of God from the womb, and he will begin to save Israel from the hand of the Philistines.
translation:
  language: sw
  text: Kwa maana, tazama, wewe ni mjamzito, nawe utamzaa mwana. Wembe hautawekwa juu ya kichwa chake, kwa maana mtoto huyo atakuwa Mnadhiri wa Mungu tangu akiwa tumboni; naye ataanza kuwaokoa[a] Israeli kutoka mkononi mwa Wafilisti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwakomboa Israeli.” Kitenzi cha Kiebrania kinaweza kumaanisha “kuokoa” au “kukomboa,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  choice: tazama
  rationale: Neno hili linaelekeza fikira kwenye tangazo lenye msisitizo; “tazama” huhifadhi uzito huo kwa Kiswahili cha kibiblia kinachoeleweka.
- source_word: הָרָה
  choice: wewe ni mjamzito
  rationale: Ni kivumishi cha hali ya sasa, si kitenzi cha wakati ujao; kwa hiyo tafsiri inaonyesha kuwa tayari ana mimba.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: nawe utamzaa mwana
  rationale: Muktadha wa tangazo unaonyesha tendo la baadaye la kuzaa mtoto wa kiume.
- source_word: מוֹרָה
  choice: wembe
  rationale: Katika muktadha wa unadhiri, neno hili linamaanisha kifaa cha kunyoa, yaani wembe.
- source_word: לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: hautapita juu ya kichwa chake
  rationale: Huhifadhi kwa karibu taswira ya Kiebrania ya wembe ‘kupanda/kuja juu ya’ kichwa, huku ikiwa ya kawaida kwa Kiswahili.
- source_word: נְזִיר אֱלֹהִים
  choice: Mnadhiri wa Mungu
  rationale: “Mnadhiri” huhifadhi istilahi maalumu ya mtu aliyewekwa wakfu kwa Mungu badala ya kuifanya maelezo ya jumla.
- source_word: הַנַּעַר
  choice: huyo mtoto
  rationale: Katika muktadha wa mwana aliyeahidiwa kabla ya kuzaliwa, “mtoto” ni ya asili na haiongezi umri usiotajwa.
- source_word: מִן הַבָּטֶן
  choice: tangu tumboni
  rationale: Huhifadhi msisitizo wa kuwekwa wakfu akiwa bado tumboni, si tu tangu kuzaliwa.
- source_word: יָחֵל
  choice: ataanza
  rationale: Kitenzi hiki kinaonyesha mwanzo wa ukombozi, si kukamilishwa kwake.
- source_word: לְהוֹשִׁיעַ
  choice: kuwaokoa
  rationale: Kitenzi kinaweza kumaanisha kuokoa au kukomboa; “kuwaokoa” ni cha asili hapa na mbadala umeonyeshwa katika tanbihi.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: kutoka mkononi mwa Wafilisti
  rationale: Huhifadhi nahau na taswira ya Kiebrania ya kuwa chini ya mamlaka au nguvu ya adui.
theological_decisions:
- issue: Asili ya kuwekwa wakfu kwa Samsoni
  choice: Mnadhiri wa Mungu tangu tumboni
  alternative: mtu aliyewekwa wakfu kwa Mungu tangu kuzaliwa
  rationale: Neno נְזִיר ni istilahi maalumu, na “tangu tumboni” huhifadhi wazi kwamba kuwekwa kwake wakfu kulianza kabla ya kuzaliwa.
- issue: Upeo wa jukumu la Samsoni katika wokovu wa Israeli
  choice: ataanza kuwaokoa Israeli
  alternative: atawaokoa Israeli
  rationale: יָחֵל hutaja wazi mwanzo wa tendo; kuondoa “ataanza” kungefanya jukumu lake lionekane kamili kuliko maandiko yanavyosema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Mnadhiri” limetumiwa kama istilahi ya kiufundi; muundo wa sentensi huhifadhi msisitizo na taswira kuu za Kiebrania bila kuwa mgumu.
