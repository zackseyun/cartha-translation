base_translation:
  language: en
  yaml_path: translation/ot/judges/013/022.yaml
  text: And Manoah said to his wife[a], “We will surely die, because we have seen God.”
translation:
  language: sw
  text: Manoa akamwambia mke wake, “Hakika tutakufa, kwa sababu tumemwona Mungu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mungu” au “kiumbe cha kiungu.” Neno la Kiebrania אֱלֹהִים katika baadhi ya miktadha linaweza kumaanisha kwa upana zaidi kiumbe cha kiungu, lakini hapa muktadha unaunga mkono “Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Kiambishi cha usimulizi -ka- kinaendeleza mtiririko wa simulizi, huku -mwambia kikieleza kwa kawaida kwamba maneno yalimwelekea mke wake.
- source_word: מָנוֹחַ
  choice: Manoa
  rationale: Umbo hili la jina limezoeleka katika Kiswahili cha Biblia na linaendana na mfumo wa sauti wa Kiswahili.
- source_word: אֶל אִשְׁתּוֹ
  choice: mke wake
  rationale: Hii ndiyo tafsiri ya kawaida na sahihi ya uhusiano unaoonyeshwa na אִשָּׁה pamoja na kiambishi cha nafsi ya tatu ya kiume umoja.
- source_word: מוֹת נָמוּת
  choice: Hakika tutakufa
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi huongeza msisitizo; “Hakika tutakufa” huwasilisha mkazo huo kwa Kiswahili cha kawaida.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa neno hili linaanzisha sababu ya hofu ya Manoa.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Muktadha wa sura unaunga mkono maana ya Mungu, ingawa neno la Kiebrania linaweza katika miktadha mingine kumaanisha mungu au kiumbe cha kiungu; uwezekano huo umehifadhiwa katika tanbihi.
- source_word: רָאִינוּ
  choice: tumemwona
  rationale: Kauli timilifu inaonyesha tendo lililokamilika ambalo matokeo yake ni ya papo hapo; wakati timilifu wa Kiswahili unafaa katika kauli hii.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika mshangao wa Manoa baada ya kumwona malaika wa BWANA
  choice: Mungu
  alternative: mungu; kiumbe cha kiungu
  rationale: Muktadha wa Waamuzi 13 na hofu ya Manoa kwamba atakufa kwa kumwona Mungu vinaunga mkono “Mungu.” Tanbihi inahifadhi upana wa kileksika bila kuondoa fumbo la simulizi kuhusu utambulisho wa malaika wa BWANA.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Msisitizo wa Kiebrania umehifadhiwa kwa “Hakika,” na fumbo la kitheolojia limehifadhiwa kwa tanbihi.
