revisions:
- from: Tutachukua wanaume kumi kati ya kila mia kutoka katika makabila yote ya Israeli, mia kati ya kila elfu, na elfu kati ya kila elfu kumi, ili wakawatafutie watu mahitaji. Kisha, watu watakapofika Gibea ya Benyamini, wautendee mji huo kulingana na tendo lote la fedheha[a] ulilofanya katika Israeli.[b]
  to: Tutachukua wanaume kumi katika kila mia kutoka makabila yote ya Israeli, na mia katika kila elfu, na elfu katika kila elfu kumi, ili wachukue mahitaji ya safari kwa ajili ya watu; ili watakapofika Gibea ya Benyamini, wachukue hatua kulingana na tendo lote la aibu[a] lililofanywa katika Israeli.[b]
  rationale: Marekebisho yanaondoa kitu kilichoongezwa (“mji huo”), yanaboresha usemi wa mahitaji/provisions, na yanahifadhi utata wa kisintaksia wa kauli ya mwisho kwa kuueleza katika tanbihi badala ya kuufunga kwa tafsiri ya Gibea kama mtendaji.
