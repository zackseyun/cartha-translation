reference: Judges 20:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לָקַ֣חְנוּ עֲשָׂרָה֩ אֲנָשִׁ֨ים לַ/מֵּאָ֜ה לְ/כֹ֣ל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וּ/מֵאָ֤ה לָ/אֶ֨לֶף֙ וְ/אֶ֣לֶף לָ/רְבָבָ֔ה לָ/קַ֥חַת צֵדָ֖ה לָ/עָ֑ם לַ/עֲשׂ֗וֹת לְ/בוֹאָ/ם֙ לְ/גֶ֣בַע בִּנְיָמִ֔ן כְּ/כָל הַ֨/נְּבָלָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה בְּ/יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/010.yaml
  text: And we will take ten men out of a hundred from all the tribes of Israel[a], and a hundred out of a thousand, and a thousand out of ten thousand, to get provisions for the people, so that when they come to Gibeah of Benjamin[b], they may do according to all the outrage that it committed in Israel.
translation:
  language: sw
  text: Tutachukua wanaume kumi katika kila mia kutoka makabila yote ya Israeli, na mia katika kila elfu, na elfu katika kila elfu kumi, ili wachukue mahitaji ya safari kwa ajili ya watu; ili watakapofika Gibea ya Benyamini, wachukue hatua kulingana na tendo lote la aibu[a] lililofanywa katika Israeli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uovu wa kuchukiza” au “tendo baya sana.” Neno la Kiebrania linamaanisha tendo la kushtua na la kuaibisha sana.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania husema kwa ufupi, “kufanya watakapofika Gibea ya Benyamini.” Usemi huo unaeleweka kuwa kuchukua hatua huko kulingana na tendo hilo; haumtaji mtendaji au kitu cha tendo kwa uwazi.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְלָקַחְנוּ
  choice: Tutachukua
  rationale: Kauli timilifu yenye kiunganishi hapa inaeleza mpango wa kusanyiko unaokusudiwa kutekelezwa; wakati ujao wa Kiswahili unaonyesha maana hiyo vizuri.
- source_word: עֲשָׂרָה אֲנָשִׁים לַמֵּאָה ... וּמֵאָה לָאֶלֶף וְאֶלֶף לָרְבָבָה
  choice: wanaume kumi kati ya kila mia ... mia kati ya kila elfu, na elfu kati ya kila elfu kumi
  rationale: Muundo huu unaonyesha uteuzi wa sehemu moja ya kumi kutoka kila kundi na kuhifadhi mpangilio wa namba wa Kiebrania.
- source_word: לְכֹל שִׁבְטֵי יִשְׂרָאֵל
  choice: kutoka katika makabila yote ya Israeli
  rationale: Katika muktadha wa uteuzi wa uwiano, wanaume wanatolewa kutoka katika jumuiya nzima ya makabila.
- source_word: לָקַחַת צֵדָה
  choice: ili wakawatafutie ... mahitaji
  rationale: צֵדָה ni vyakula au vifaa vya lazima kwa safari au kampeni; “mahitaji” ni pana vya kutosha bila kuifanya kuwa chakula pekee.
- source_word: לָעָם
  choice: watu
  rationale: Neno la kawaida “watu” limehifadhiwa, ingawa katika muktadha huu linawahusu watu waliokusanyika kwa vita.
- source_word: לַעֲשׂוֹת לְבוֹאָם
  choice: Kisha, watu watakapofika ... wautendee
  rationale: Mlolongo wa vitenzi-jina wa Kiebrania umebanwa; Kiswahili kinafungua uhusiano wa wakati na kusudi ili sentensi ieleweke bila kuficha ugumu wa asili.
- source_word: לְגֶבַע בִּנְיָמִן
  choice: Gibea ya Benyamini
  rationale: Huhifadhi mwendo kuelekea Gibea na kuitambulisha kwa eneo au kabila la Benyamini.
- source_word: כְּכָל הַנְּבָלָה
  choice: kulingana na tendo lote la fedheha
  rationale: נְבָלָה hapa ni tendo baya sana, la kuaibisha na kushtua; “tendo la fedheha” lina uzito wa kimaadili bila kuingiza istilahi maalumu ya kimadhehebu.
- source_word: אֲשֶׁר עָשָׂה בְּיִשְׂרָאֵל
  choice: ulilofanya katika Israeli
  rationale: Kitenzi ni umoja wa kiume. Kutaja “mji huo” kunafanya rejeo la Gibea lililopewa utu lieleweke katika Kiswahili huku kauli tendaji ikihifadhiwa.
theological_decisions:
- issue: Kutafsiri נְבָלָה yenye hukumu kali ya kimaadili bila kuongeza kategoria za baadaye za kiteolojia
  choice: tendo la fedheha
  alternative: uovu wa kuchukiza; tendo baya sana; upumbavu
  rationale: “Tendo la fedheha” linaonyesha kuwa lilikuwa jambo la kuaibisha na kushtua kimaadili. “Upumbavu” peke yake ungepunguza uzito wa kosa, na “chukizo” lingeweza kusikika kama istilahi ya kiibada ambayo muktadha huu haulazimishi.
- issue: Rejeo la kitenzi cha umoja אֲשֶׁר עָשָׂה
  choice: 'Gibea kama mji uliopewa utu: “mji huo ... ulilofanya”'
  alternative: “lililofanywa katika Israeli,” bila kutaja mtendaji
  rationale: Kiebrania kina kauli tendaji ya umoja, lakini mtendaji amebanwa kisintaksia. Kumrejelea Gibea kama jumuiya kunalingana na muktadha bila kumtaja mtu mmoja asiyeelezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa namba umehifadhiwa, lakini sintaksia iliyobanwa ya Kiebrania imefunguliwa kiasi kwa usomaji wa kawaida. “Mahitaji” linabaki pana ili lijumuishe chakula na vifaa vingine vya lazima.
