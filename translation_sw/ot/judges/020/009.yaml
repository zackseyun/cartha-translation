lexical_decisions:
- source_word: וְעַתָּה
  choice: Lakini sasa
  rationale: Huonyesha hatua inayofuata katika mashauri, ikiwa na nguvu ndogo ya utofautishaji pamoja na maana ya wakati.
- source_word: זֶה הַדָּבָר אֲשֶׁר נַעֲשֶׂה
  choice: hivi ndivyo tutakavyoufanyia
  rationale: Ni Kiswahili cha kawaida kinachoeleza mpango maalumu wa kitendo cha baadaye, huku kiambishi cha yambwa kikirejelea mji.
- source_word: לַגִּבְעָה
  choice: Gibea
  rationale: Kiambishi cha kutendea katika “tutakavyoufanyia” kinawakilisha ל na kuonyesha Gibea kuwa mlengwa wa hatua hiyo.
- source_word: עָלֶיהָ בְּגוֹרָל
  choice: tutaupigia kura
  rationale: Kiebrania ni kifupi na kinaweza kumaanisha kwamba hatua dhidi ya mji itaamuliwa au kugawiwa kwa kura. Kiswahili hiki kinaweka wazi tendo la kupiga kura bila kuingiza kitenzi kisichokuwapo cha kwenda au kushambulia.
