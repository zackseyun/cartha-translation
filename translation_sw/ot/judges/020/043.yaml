base_translation:
  language: en
  yaml_path: translation/ot/judges/020/043.yaml
  text: They surrounded Benjamin[a], pursued him relentlessly, and trampled him down as far as opposite Gibeah[c][b], toward the east of the sun.
translation:
  language: sw
  text: Waliwazingira Wabenyamini[a], wakawafuatia bila kuwapa pumziko, wakawakanyaga hadi mahali panapokabili Gibea, upande wa mashariki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawafuatia kutoka Menuha,” ikiwa מְנוּחָה linaeleweka kuwa jina la mahali badala ya kutumiwa kama kielezi.
    reason: alternative_reading
  - marker: b
    text: Au, “wakawapeleka hadi mahali panapokabili Gibea, kutoka upande wa mashariki.” Kitenzi kilichotafsiriwa “wakawakanyaga” kinaweza pia kumaanisha kuwasukuma au kuwapeleka mbele; kirai cha mwisho kinaweza pia kueleweka kwa njia zaidi ya moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּתְּרוּ
  choice: waliizunguka
  rationale: Kitenzi kinaonyesha kuzunguka au kufungia jeshi; ‘waliizunguka’ ni Kiswahili cha kawaida chenye maana ya kijeshi.
- source_word: אֶת בִּנְיָמִן
  choice: Benyamini
  rationale: Jina la kabila limetumiwa kwa maana ya pamoja. Kiambishi cha ngeli ya mahali/kundi katika ‘waliizunguka’ kinawezesha kurejelea kabila, huku viambishi vinavyofuata vikihifadhi umoja wa pamoja wa Kiebrania.
- source_word: הִרְדִיפֻהוּ
  choice: wakamfuatia
  rationale: רדף katika muktadha wa vita humaanisha kufuatia au kukimbiza adui; ‘wakamfuatia’ ni ya asili na hudumisha rejeo la pamoja katika umoja.
- source_word: מְנוּחָה
  choice: bila kumpumzisha
  rationale: Neno kwa kawaida humaanisha ‘pumziko’ au ‘mahali pa kupumzikia.’ Hapa limetafsiriwa kwa matumizi ya kielezi, yaani walimfuatia bila kumpa pumziko, huku uwezekano wa kuwa jina la mahali ukihifadhiwa katika tanbihi.
- source_word: הִדְרִיכֻהוּ
  choice: wakamkanyaga
  rationale: Hiphil ya דרך inaweza kueleza kukanyaga kwa nguvu au kumwendesha mtu. Katika mfululizo wa matendo ya kivita, ‘wakamkanyaga’ huhifadhi taswira yenye nguvu bila kuamua kimya kimya maana mbadala.
- source_word: עַד נֹכַח הַגִּבְעָה
  choice: hadi mahali panapokabili Gibea
  rationale: נֹכַח huonyesha eneo lililo mbele ya, linalokabili, au mkabala na mahali fulani. Usemi huu ni wazi na wa asili kwa Kiswahili.
- source_word: מִמִּזְרַח שָׁמֶשׁ
  choice: upande wa mashariki
  rationale: Kwa neno moja moja ni ‘kutoka mashariki mwa jua,’ lakini ni usemi wa Kiebrania unaoonyesha upande wa mashariki. Tafsiri ya asili huepuka usemi usioeleweka katika Kiswahili.
