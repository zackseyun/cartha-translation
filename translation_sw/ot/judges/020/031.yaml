translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye heshima. ‘Wana wa Benyamini’ huhifadhi lugha ya ukoo ya chanzo, huku ‘wakavutwa mbali’ ikihifadhi kutotajwa wazi kwa aliyewavuta. Alama za vistari zinasaidia kuweka maelezo ya barabara mbili bila kuvuruga sentensi kuu.
