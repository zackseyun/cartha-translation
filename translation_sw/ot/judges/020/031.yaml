  text: וַ/יֵּצְא֤וּ בְנֵֽי בִנְיָמִן֙ לִ/קְרַ֣את הָ/עָ֔ם הָנְתְּק֖וּ מִן הָ/עִ֑יר וַ/יָּחֵ֡לּוּ לְ/הַכּוֹת֩ מֵ/הָ/עָ֨ם חֲלָלִ֜ים כְּ/פַ֣עַם בְּ/פַ֗עַם בַּֽ/מְסִלּוֹת֙ אֲשֶׁ֨ר אַחַ֜ת עֹלָ֣ה בֵֽית אֵ֗ל וְ/אַחַ֤ת גִּבְעָ֨תָ/ה֙ בַּ/שָּׂדֶ֔ה כִּ/שְׁלֹשִׁ֥ים אִ֖ישׁ בְּ/יִשְׂרָאֵֽל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/031.yaml
  text: And the sons of Benjamin came out to meet the people[a], and were drawn away from the city; and they began to strike down some of the people, as at other times, on the highways, one of which goes up to Bethel and one to Gibeah in the open country[d][c][b], about thirty men of Israel.
translation:
  language: sw
  text: Wana wa Benyamini[a] wakatoka kwenda kukabiliana na watu, nao wakavutwa kutoka mjini[b]. Wakaanza kuwaua baadhi ya watu, kama walivyofanya nyakati zilizotangulia[c], kwenye barabara kuu—moja ikipanda kwenda Betheli, na nyingine kwenda Gibea kupitia eneo la wazi[d]—karibu wanaume thelathini wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wabenyamini.” Kiebrania kinasema, “wana wa Benyamini.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wakatenganishwa na mji” au “wakalaghaiwa watoke mjini.” Maana yake ni kwamba walitolewa mbali na ulinzi wa mji.
    reason: lexical_alternative
  - marker: c
    text: Au, “kama hapo awali.” Usemi wa Kiebrania unalinganisha shambulio hili na mapigano yaliyotangulia.
    reason: lexical_alternative
  - marker: d
    text: Au, “shambani.” Huenda maneno hayo yanaeleza njia iliyopita katika eneo la wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: wakatoka
  rationale: Kitenzi cha kawaida cha kutoka mahali; hapa kinaeleza kutoka kwao mjini kuelekea eneo la mapigano.
- source_word: בְנֵי בִנְיָמִן
  choice: Wana wa Benyamini
  rationale: Inahifadhi usemi wa Kiebrania wa ukoo na utambulisho wa kabila, huku tanbihi ikitoa jina la kawaida zaidi, ‘Wabenyamini.’
- source_word: לִקְרַאת הָעָם
  choice: kwenda kukabiliana na watu
  rationale: Katika muktadha wa vita, לִקְרַאת ni kwenda kuwakabili, na הָעָם inabaki ‘watu’ badala ya kufasiriwa moja kwa moja kuwa jeshi.
- source_word: הָנְתְּקוּ מִן הָעִיר
  choice: wakavutwa mbali na mji
  rationale: Inahifadhi muundo wenye maana ya kutendwa na wazo la kutenganishwa na ulinzi wa mji bila kutaja moja kwa moja kwamba walidanganywa.
- source_word: וַיָּחֵלּוּ לְהַכּוֹת
  choice: Wakaanza kuwaua
  rationale: וַיָּחֵלּוּ inaonyesha mwanzo wa tendo, na katika muktadha huu חֲלָלִים pamoja na לְהַכּוֹת inaonyesha kwamba waliopigwa waliuawa.
- source_word: מֵהָעָם חֲלָלִים
  choice: baadhi ya watu
  rationale: מִן ni ya kugawanya, yaani sehemu ya watu, huku matokeo ya kifo yakielezwa tayari na ‘kuwaua.’
- source_word: כְּפַעַם בְּפַעַם
  choice: kama walivyofanya nyakati zilizotangulia
  rationale: Usemi huu unalinganisha shambulio hili na mapigano ya awali yanayosimuliwa katika sura hii.
- source_word: בַּמְסִלּוֹת
  choice: kwenye barabara kuu
  rationale: מְסִלּוֹת ni barabara zilizotengenezwa au njia kuu; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: אַחַת עֹלָה בֵית אֵל
  choice: moja ikipanda kwenda Betheli
  rationale: עֹלָה ina maana ya kupanda katika maelezo ya kijiografia, maana iliyohifadhiwa katika tafsiri.
- source_word: וְאַחַת גִּבְעָתָה בַּשָּׂדֶה
  choice: na nyingine kwenda Gibea kupitia eneo la wazi
  rationale: בַּשָּׂדֶה inaeleza mahali au njia iliyo nje ya eneo lililojengwa; ‘eneo la wazi’ huhifadhi maana hiyo bila kudai kwa uhakika kwamba ni shamba lililolimwa.
- source_word: כִּשְׁלֹשִׁים אִישׁ בְּיִשְׂרָאֵל
  choice: wapata wanaume thelathini wa Israeli
  rationale: כִּשְׁלֹשִׁים ni idadi ya kukadiria, na אִישׁ hapa inataja wanaume waliouawa.
