  text: And the sons of Israel came near to the sons of Benjamin on the second day[a][b].
translation:
  language: sw
  text: Wana wa Israeli wakawakaribia wana wa Benyamini siku ya pili.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawasogelea”; katika muktadha wa vita, yaweza pia kumaanisha “wakasonga mbele dhidi ya.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “wana wa Israeli” na “wana wa Benyamini”; yaweza pia kutafsiriwa “Waisraeli” na “Wabenyamini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: wakawakaribia
  rationale: Kitenzi קרב katika qal humaanisha kukaribia. Katika muktadha huu wa vita kinaweza kueleweka kuwa kusonga mbele dhidi ya adui, lakini tafsiri kuu inadumisha maana ya msingi bila kutaja shambulio waziwazi.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Hili linadumisha tamko la kifamilia la Kiebrania, 'wana wa Israeli,' ambalo hapa linataja kwa pamoja vikosi vya makabila ya Israeli.
- source_word: אֶל
  choice: -wa- katika wakawakaribia
  rationale: Kihusishi אֶל huonyesha mwendo kuelekea kwa mtu au kitu. Muundo wa Kiswahili 'kuwakaribia' unawasilisha uelekeo huo bila kuongeza wazi maana ya 'dhidi ya.'
- source_word: בְנֵי בִנְיָמִן
  choice: wana wa Benyamini
  rationale: Hili linadumisha jina la kikabila la kifamilia na usambamba wake na 'Wana wa Israeli.'
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: siku ya pili
  rationale: Kiebrania kinataja wazi siku kwa namba ya mpangilio; kwa hiyo 'siku ya pili' ni sahihi zaidi kuliko 'siku iliyofuata.'
