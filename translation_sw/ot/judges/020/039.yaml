base_translation:
  language: en
  yaml_path: translation/ot/judges/020/039.yaml
  text: Then the men of Israel turned in the battle[a], and Benjamin began to strike down the slain among the men of Israel, about thirty men, for they said, “Surely he is utterly defeated before us[b], as in the first battle.”
translation:
  language: sw
  text: Ndipo watu wa Israeli wakageuka vitani, nao Wabenyamini wakaanza kuwaua[a] karibu watu thelathini miongoni mwa watu wa Israeli, kwa maana walisema, “Hakika Israeli ameshindwa kabisa mbele yetu[b], kama katika pambano la kwanza.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa karibu zaidi: “wakaanza kuwapiga watu wa Israeli, karibu watu thelathini wakiwa wameuawa.” Kirai cha Kiebrania ni kifupi, cha kinahau katika muktadha wa vita.'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatumia umoja na kumrejelea Israeli kama jumuiya moja. Pia inaweza kutafsiriwa, “wameshindwa kabisa mbele yetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: wakageuka
  rationale: Kitenzi kinaonyesha kugeuka au kubadilika kwa mwendo wa mapigano. “Wakageuka” ni kifupi na cha kawaida katika simulizi la vita bila kufafanua zaidi ya Kiebrania.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: watu wa Israeli
  rationale: Ingawa אִישׁ iko katika umoja, hapa ina maana ya kundi la wapiganaji wa Israeli. “Watu wa Israeli” huwasilisha maana hiyo ya pamoja kwa Kiswahili cha kawaida.
- source_word: בַּמִּלְחָמָה
  choice: vitani
  rationale: Neno hili linaweka tendo la kugeuka ndani ya mapigano yanayoendelea. “Vitani” ni tafsiri ya asili na yenye hadhi katika Kiswahili.
- source_word: וּבִנְיָמִן
  choice: Wabenyamini
  rationale: Jina la kabila limetumiwa kwa maana ya wapiganaji wake. Kiswahili hutumia kwa kawaida “Wabenyamini” kurejelea watu wa kabila hilo.
- source_word: הֵחֵל
  choice: walikuwa wameanza
  rationale: Muundo huu unaonyesha kwamba hatua ya Wabenyamini ilikuwa tayari imeanza wakati Israeli walipogeuka, na hivyo huleta wazi mpangilio wa simulizi bila kubadili maana.
- source_word: לְהַכּוֹת חֲלָלִים
  choice: kuwaua
  rationale: Kirai cha Kiebrania ni kifupi na cha kimapigano, kwa maana halisi ya kuwapiga na kuwaacha wakiwa wameuawa. “Kuwaua” hutoa maana ya muktadha kwa Kiswahili cha kawaida; umbo la karibu zaidi limehifadhiwa katika tanbihi.
- source_word: בְּאִישׁ יִשְׂרָאֵל
  choice: miongoni mwa watu wa Israeli
  rationale: Kihusishi kinaonyesha kundi ambalo waliouawa walitoka ndani yake.
- source_word: כִּשְׁלֹשִׁים אִישׁ
  choice: karibu watu thelathini
  rationale: Kiambishi כ־ kinaonyesha ukadiriaji; “karibu” huwasilisha hilo kwa uwazi.
- source_word: אַךְ נִגּוֹף נִגָּף הוּא
  choice: Hakika Israeli ameshindwa kabisa
  rationale: Muunganiko wa infinitivu kamili na kitenzi huongeza mkazo, unaowasilishwa kwa “hakika” na “kabisa.” Umoja wa Kiebrania umehifadhiwa kwa kumtaja Israeli kama jumuiya moja.
- source_word: כַּמִּלְחָמָה הָרִאשֹׁנָה
  choice: kama katika pambano la kwanza
  rationale: “Pambano” huepuka kudokeza vita tofauti kabisa na hurejelea kwa kawaida tukio la kwanza la mapigano katika simulizi.
theological_decisions:
- issue: Umoja wa kisarufi katika הוּא unaorejelea Israeli kwa pamoja
  choice: Israeli ameshindwa kabisa
  alternative: wameshindwa kabisa
  rationale: Kiebrania kinamtazama Israeli kama jumuiya moja kwa kutumia umoja. Tafsiri kuu imehifadhi mtazamo huo, huku tanbihi ikitoa umbo la wingi linalowezekana kwa kuzingatia watu wa Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi la vita ulio wazi na wenye hadhi. Maneno ya kawaida kama “vitani,” “kuwaua,” na “pambano” yametumiwa badala ya miundo migumu ya tafsiri ya moja kwa moja. Mkazo na umoja wa Kiebrania umehifadhiwa bila kulazimisha ufafanuzi wa kiteolojia.
