base_translation:
  language: en
  yaml_path: translation/ot/judges/020/020.yaml
  text: The men of Israel went out to battle against Benjamin[a], and the men of Israel drew up for battle against them at Gibeah.
translation:
  language: sw
  text: Wanaume wa Israeli wakaenda kupigana na Benyamini, nao wanaume wa Israeli wakajipanga kwa vita dhidi yao huko Gibea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakajipanga kwa vita nao huko Gibea.” Kihusishi cha Kiebrania kinaweza kutafsiriwa “nao,” ingawa muktadha unaonyesha kwamba walikuwa wapinzani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: wakaenda
  rationale: Katika simulizi la kijeshi, יצא huonyesha kwenda nje kwa ajili ya mapambano. “Wakaenda” ni ya kawaida na haiongezi wazo lisilo wazi kama vile kuandamana kwa gwaride.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: wanaume wa Israeli / Waisraeli
  rationale: אִישׁ ni umoja wa kijumla unaowarejelea wanaume wa jeshi la Israeli. Kutaja “wanaume” mara ya kwanza huhifadhi rejeo la kijinsia; “Waisraeli” mara ya pili huepuka urudiaji mzito bila kubadili wahusika.
- source_word: לַמִּלְחָמָה
  choice: kupigana
  rationale: Kirai hiki kinaonyesha kusudi la kwenda, yaani kuingia vitani; “kupigana” ni Kiswahili cha asili na kinachoeleweka.
- source_word: עִם בִּנְיָמִן
  choice: na Benyamini
  rationale: עִם kwa kawaida ni “na,” lakini katika muktadha wa vita huonyesha upande unaopingwa. Kiswahili “kupigana na Benyamini” huwasilisha wazi maana hiyo.
- source_word: וַיַּעַרְכוּ
  choice: wakajipanga
  rationale: ערך katika matumizi ya kijeshi humaanisha kupanga askari katika safu au mpangilio wa vita. “Wakajipanga” ni fupi, ya sasa, na yenye maana hiyo.
- source_word: אִתָּם
  choice: dhidi yao
  rationale: Ingawa umbo la Kiebrania kimsingi ni “pamoja/nao,” muktadha wa mapambano unaonyesha uadui. “Dhidi yao” huzuia kueleweka kimakosa kuwa walikuwa washirika.
- source_word: מִלְחָמָה
  choice: kwa vita
  rationale: Nomino hii hukamilisha kitenzi cha kupanga majeshi na kueleza kusudi la mpangilio.
- source_word: אֶל הַגִּבְעָה
  choice: huko Gibea
  rationale: אֶל inaweza kuonyesha mwelekeo au uhusiano wa mahali. Katika muktadha huu Gibea ndilo eneo la kujipanga; “huko Gibea” ni ya kawaida bila kulazimisha maana ya kushambulia mji wenyewe.
theological_decisions:
- issue: Lugha ya kijinsia katika umoja wa kijumla אִישׁ יִשְׂרָאֵל
  choice: wanaume wa Israeli
  alternative: Waisraeli / jeshi la Israeli
  rationale: Neno la Kiebrania ni la kiume na katika muktadha huu linarejelea wapiganaji. Tafsiri inahifadhi jambo hilo mara ya kwanza badala ya kuligeuza kuwa kundi lisilo na jinsia.
- issue: Maana ya uadui katika עִם na אִתָּם
  choice: kupigana na Benyamini; dhidi yao
  alternative: pamoja na Benyamini; pamoja nao
  rationale: Vihusishi hivyo vinaweza kumaanisha “pamoja na,” lakini mazingira ya vita yanadai uhusiano wa kupingana. Tafsiri inaweka maana hiyo wazi huku tanbihi ikihifadhi uwezekano wa usemi ulio karibu zaidi na muundo wa Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha hadhi lakini kinachoeleweka kwa urahisi. “Gibea” na “Benyamini” zinafuata maumbo ya kawaida ya majina ya Biblia katika Kiswahili. Urudiaji wa “wanaume wa Israeli” umepunguzwa katika kishazi cha pili kwa kutumia “Waisraeli,” huku rejeo la wapiganaji wa kiume likiwekwa wazi katika kishazi cha kwanza.
