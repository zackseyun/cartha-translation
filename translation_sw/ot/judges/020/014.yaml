  text: וַ/יֵּאָסְפ֧וּ בְנֵֽי בִנְיָמִ֛ן מִן הֶ/עָרִ֖ים הַ/גִּבְעָ֑תָ/ה לָ/צֵ֥את לַ/מִּלְחָמָ֖ה עִם בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/014.yaml
  text: And the sons of Benjamin gathered from the cities to Gibeah to go out to battle against the sons of Israel[a][b].
translation:
  language: sw
  text: Nao wana wa Benyamini wakakusanyika kutoka mijini kwenda Gibea, ili watoke kupigana na wana wa Israeli.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi kina “pamoja na wana wa Israeli”; katika muktadha huu wa vita maana yake ni “dhidi ya wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Wabenyamini ... kupigana na Waisraeli.” Matini kuu inadumisha nahau ya kikabila ya Kiebrania, “wana wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: wakakusanyika
  rationale: Niphal ya אסף hapa inaeleza watu kuja pamoja au kujikusanya. “Wakakusanyika” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kulazimisha hali ya kutendwa.
- source_word: בְנֵי בִנְיָמִן
  choice: wana wa Benyamini
  rationale: Uamuzi huu unahifadhi nahau ya Kiebrania ya ukoo na kabila. “Wabenyamini” ni mbadala wa asili zaidi katika Kiswahili, lakini ungepunguza picha ya kifamilia ya matini chanzi.
- source_word: מִן הֶעָרִים
  choice: kutoka mijini
  rationale: Kihusishi מִן kinaonyesha mahali walikotoka, na wingi wa עִיר unarejelea vituo mbalimbali vya makazi katika eneo la Benyamini.
- source_word: הַגִּבְעָתָה
  choice: kwenda Gibea
  rationale: Herufi ya kuelekeza mwishoni mwa jina la mahali inaonyesha mwendo kuelekea Gibea. “Kwenda Gibea” hutoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: לָצֵאת
  choice: ili watoke
  rationale: Kitenzi יצא kina maana ya msingi ya “kutoka” au “kwenda nje.” Tafsiri hii inadumisha picha ya matini badala ya kuibadili moja kwa moja kuwa “waandamane” au “waende vitani.”
- source_word: לַמִּלְחָמָה
  choice: kupigana
  rationale: Katika kishazi לצאת למלחמה, nomino “vita” inaeleza kusudi la kwenda nje. “Watoke kupigana” ni usemi wa asili wa Kiswahili unaowasilisha nahau hiyo.
- source_word: עִם בְּנֵי יִשְׂרָאֵל
  choice: na wana wa Israeli
  rationale: Ingawa עִם kwa kawaida humaanisha “pamoja na,” katika muktadha wa mapigano huwa na nguvu ya upinzani. Kishazi cha Kiswahili “kupigana na” kinaonyesha wazi maana ya kupigana dhidi ya mtu huku kikidumisha umbo la karibu na chanzi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. “Nao” huunganisha mstari na simulizi lililotangulia; “kutoka mijini kwenda Gibea” huonyesha asili na mwelekeo bila kuongeza kwamba tayari walikuwa wamefika. Nahau ya “wana wa” imehifadhiwa kwa ukaribu na matini chanzi, huku tanbihi ikitoa majina ya kawaida ya makabila.
