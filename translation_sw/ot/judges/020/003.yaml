base_translation:
  language: en
  yaml_path: translation/ot/judges/020/003.yaml
  text: The sons of Benjamin heard that the sons of Israel had gone up to Mizpah[a]. And the sons of Israel said, “Tell us[b], how did this evil happen?”
translation:
  language: sw
  text: Wana wa Benyamini wakasikia kwamba wana wa Israeli walikuwa wamepanda kwenda Mispa[a]. Nao wana wa Israeli wakasema, “Tuambieni, uovu huu[b] ulitokeaje?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wabenyamini” na “Waisraeli.” Kiebrania kinasema tena na tena “wana wa Benyamini” na “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: “Uovu huu” pia unaweza kutafsiriwa “ubaya huu” au “tendo hili ovu.” Neno la Kiebrania lina uzito mkubwa wa kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: wakasikia
  rationale: Kitenzi שׁמע katika muktadha huu wa masimulizi kinaonyesha kupokea habari. “Wakasikia” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: בְּנֵי בִנְיָמִן / בְּנֵי יִשְׂרָאֵל
  choice: wana wa Benyamini / wana wa Israeli
  rationale: Huhifadhi muundo unaorudiwa wa Kiebrania na uwiano kati ya makabila hayo mawili; pia ni lugha yenye hadhi na inayoeleweka katika Kiswahili cha Biblia.
- source_word: כִּי עָלוּ
  choice: kwamba ... walikuwa wamepanda kwenda
  rationale: “Walikuwa wamepanda” huhifadhi maana ya msingi ya עלה, huku wakati timilifu uliopita ukionyesha kwamba safari ilitangulia kusikia kwao.
- source_word: הַמִּצְפָּה
  choice: Mispa
  rationale: Hili ni jina la mahali; “Mispa” ni umbo linalofaa katika tahajia ya Kiswahili.
- source_word: וַיֹּאמְרוּ
  choice: wakasema
  rationale: Huhifadhi maana ya msingi ya אמר bila kuibadili kimafasiri kuwa “wakauliza.”
- source_word: דַּבְּרוּ
  choice: Tuambieni
  rationale: Amri ya kusema hapa inataka maelezo kutoka kwa wanaoulizwa. “Tuambieni” ni Kiswahili cha kawaida na huonyesha walengwa wanaodokezwa na muktadha.
- source_word: אֵיכָה נִהְיְתָה
  choice: ulitokeaje
  rationale: Muundo huu unauliza namna jambo lilivyotokea. “Ulitokeaje?” ni wa moja kwa moja na wa asili katika Kiswahili.
- source_word: הָרָעָה הַזֹּאת
  choice: uovu huu
  rationale: Katika muktadha wa tendo la Gibea, רָעָה lina uzito wa kimaadili. “Uovu” huhifadhi uzito huo bila kuligeuza kuwa maafa tu.
