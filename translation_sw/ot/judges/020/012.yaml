base_translation:
  language: en
  yaml_path: translation/ot/judges/020/012.yaml
  text: So the tribes of Israel sent men through all the tribes of Benjamin[a], saying[b], “What is this evil that has happened among you?”
translation:
  language: sw
  text: Basi makabila ya Israeli yakatuma watu kwa koo zote za Benyamini[a], wakisema, “Ni uovu gani huu uliotokea miongoni mwenu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika koo zote za Benyamini.” Kihusishi cha Kiebrania kinaweza kueleweka kuwa watu hao walitumwa kwa kila koo au walipita miongoni mwa koo hizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: yakatuma
  rationale: Kitenzi hiki kinaonyesha kutuma watu; “yakatuma” ni cha kawaida na kinaafikiana na kiima cha wingi “makabila.”
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: makabila ya Israeli
  rationale: Hii inatafsiri moja kwa moja muundo wa Kiebrania na kudumisha makabila kama kiima cha pamoja.
- source_word: אֲנָשִׁים
  choice: watu
  rationale: Neno la Kiebrania humaanisha wanaume/watu; “watu” ni la asili katika Kiswahili bila kuongeza cheo kisichotajwa kama “wajumbe.”
- source_word: בְּכָל שִׁבְטֵי בִנְיָמִן
  choice: kwa koo zote za Benyamini
  rationale: Kwa kuwa Benyamini mwenyewe ni kabila moja, wingi hapa unaeleweka kwa kawaida kuwa migawanyiko yake ya kikoo. “Kwa” huhifadhi uwezekano wa maana ya kuelekea kwa kila kundi, huku tanbihi ikionyesha uwezekano wa maana ya usambazaji.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Ni utangulizi wa kawaida na wa asili wa maneno ya moja kwa moja katika Kiswahili.
- source_word: מָה
  choice: Ni ... gani
  rationale: Muundo huu unauliza utambulisho au aina ya uovu, si sababu yake, hivyo haujageuzwa kuwa “kwa nini.”
- source_word: הָרָעָה הַזֹּאת
  choice: uovu gani huu
  rationale: “Uovu” huhifadhi uzito wa kimaadili wa רָעָה na ni lugha ya sasa, yenye hadhi.
- source_word: אֲשֶׁר נִהְיְתָה
  choice: uliotokea
  rationale: Hutoa maana ya jambo lililotukia au kutokea kwa ufupi na kwa ufasaha.
- source_word: בָּכֶם
  choice: miongoni mwenu
  rationale: Inaonyesha kuwa tendo hilo lilitokea ndani ya jamii ya Wabenyamini.
