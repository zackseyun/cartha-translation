base_translation:
  language: en
  yaml_path: translation/ot/judges/020/038.yaml
  text: The appointed sign between the men of Israel and the ambush was that they should make a great cloud of smoke rise from the city[a][b][c].
translation:
  language: sw
  text: Ishara iliyokubaliwa kati ya wanaume wa Israeli na kikosi cha kuvizia ilikuwa kwamba waushe moshi mwingi upae kutoka katika mji[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mpango uliokuwa umekubaliwa” au “ishara waliyoafikiana.” Neno la Kiebrania מוֹעֵד mara nyingi humaanisha wakati uliowekwa, lakini hapa linahusu ishara iliyopangwa mapema kwa ajili ya vita.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya karibu zaidi na muundo wa Kiebrania, “kwa wanaume wa Israeli pamoja na kikosi cha kuvizia”; maana yake ni makubaliano kati ya pande hizo mbili.
    reason: lexical_alternative
  - marker: c
    text: Au “nguzo ya moshi” au “wingu la moshi.” Usemi wa Kiebrania unaonyesha moshi mwingi unaoonekana wazi ukipanda kutoka katika mji kama ishara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמּוֹעֵד
  choice: Ishara iliyokuwa imekubaliwa
  rationale: Ingawa מוֹעֵד kwa kawaida humaanisha wakati au mkutano uliowekwa, katika muktadha huu wa vita inaelekeza kwenye ishara au mpango uliokubaliwa mapema.
- source_word: לְאִישׁ יִשְׂרָאֵל עִם הָאֹרֵב
  choice: kati ya watu wa Israeli na wale waliokuwa wamejificha kwa kuvizia
  rationale: Muundo wa Kiebrania unataja pande mbili za makubaliano. Tafsiri hii ni ya kawaida kwa Kiswahili na inadhihirisha kwamba הָאֹרֵב ni kikosi kilichojificha ili kuvizia.
- source_word: הֶרֶב
  choice: kubwa
  rationale: Umbo hili linaongeza mkazo kwa tendo linalofuata; 'kubwa' huonyesha kwamba moshi ulipaswa kuwa mwingi na kuonekana wazi.
- source_word: לְהַעֲלוֹתָם
  choice: kwamba wainue
  rationale: Hifili ya עלה humaanisha kusababisha kitu kipande. Kiambishi cha wingi kinarejelea watekelezaji wa ishara.
- source_word: מַשְׂאַת הֶעָשָׁן
  choice: wingu kubwa la moshi
  rationale: Kirai hiki kinaonyesha moshi unaoinuka na kuonekana wazi; 'wingu la moshi' ni usemi wa asili katika Kiswahili, huku 'kubwa' ikiwakilisha mkazo wa הֶרֶב.
- source_word: מִן הָעִיר
  choice: kutoka mjini
  rationale: Hii inaonyesha mahali moshi ulipoanzia kwa lugha ya kawaida na sahihi ya Kiswahili.
