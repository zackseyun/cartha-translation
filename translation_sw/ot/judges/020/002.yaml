base_translation:
  language: en
  yaml_path: translation/ot/judges/020/002.yaml
  text: And the chiefs of all the people[a], of all the tribes of Israel, took their stand in the assembly of the people of God—four hundred thousand foot soldiers drawing the sword.
translation:
  language: sw
  text: Nao viongozi wa watu wote[a], wa makabila yote ya Israeli, wakasimama katika kusanyiko la watu wa Mungu—askari wa miguu laki nne, wakiwa wamechomoa panga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi ni “pembe za watu wote,” nahau inayomaanisha viongozi au watu mashuhuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: wakasimama
  rationale: Kitenzi hiki katika hitpaeli kinaonyesha kusimama au kuchukua nafasi; katika muktadha huu, “wakasimama” ni Kiswahili cha kawaida na chenye hadhi kinachoweza pia kudokeza utayari.
- source_word: פִּנּוֹת
  choice: viongozi
  rationale: Neno hili kihalisi ni “pembe,” lakini hapa ni nahau inayowarejelea watu mashuhuri wanaoliongoza au kulitegemeza taifa. “Viongozi” huwasilisha maana hiyo kwa uwazi bila kuingiza cheo maalumu kisichotajwa.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: Tafsiri ya moja kwa moja ya usemi wa ujumla, ikihifadhi wazo la mkusanyiko unaowakilisha watu wote.
- source_word: כֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: makabila yote ya Israeli
  rationale: Huhifadhi ufafanuzi wa kiambatano unaobainisha watu wote kuwa makabila yote ya Israeli.
- source_word: בִּקְהַל
  choice: katika kusanyiko
  rationale: קהל ni mkutano wa watu waliokusanyika. “Kusanyiko” ni la sasa na halibebi kwa lazima maana finyu ya taasisi ya kidini.
- source_word: עַם הָאֱלֹהִים
  choice: watu wa Mungu
  rationale: Hufuata muundo wa Kiebrania na kuhifadhi utambulisho wa watu katika uhusiano wao na Mungu.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף
  choice: laki nne
  rationale: Ni njia ya kawaida na sahihi ya Kiswahili ya kutaja 400,000.
- source_word: אִישׁ רַגְלִי
  choice: askari wa miguu
  rationale: Usemi huo kihalisi humaanisha watu wanaopigana kwa miguu, tofauti na wapanda farasi au magari; “askari wa miguu” ni wazi na wa kawaida.
- source_word: שֹׁלֵף חָרֶב
  choice: wenye kufuta panga zao
  rationale: “Kufuta upanga” humaanisha kuutoa alani. Wingi wa Kiswahili huwasilisha kwa kawaida nguvu ya kisambazaji ya umoja wa Kiebrania baada ya idadi kubwa, huku ukihifadhi picha hai ya kijeshi.
theological_decisions:
- issue: Tafsiri ya עַם הָאֱלֹהִים
  choice: watu wa Mungu
  alternative: watu wake Mungu
  rationale: “Watu wa Mungu” ni ya asili, yenye hadhi, na huhifadhi wazi uhusiano wa watu hao na Mungu bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nao” huendeleza simulizi; “yaani” huonyesha kwa kawaida kwamba “makabila yote ya Israeli” yanafafanua “watu wote.”
