base_translation:
  language: en
  yaml_path: translation/ot/judges/020/032.yaml
  text: And the sons of Benjamin said[a], “They are being struck down before us as at the first.” But the sons of Israel said[c][b], “Let us flee and draw them away from the city to the highways.”
translation:
  language: sw
  text: Wana wa Benyamini wakasema, “Wanapigwa mbele yetu kama hapo kwanza[a].” Lakini wana wa Israeli wakasema, “Tukimbie, kisha tuwavute[b] mbali na mji hadi kwenye barabara kuu[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “kama hapo kwanza,” kikirejelea mapambano yaliyotangulia katika sura hii; yaani, “kama hapo awali” au “kama katika pambano la kwanza.”
    reason: cross_reference
  - marker: b
    text: Kiebrania kinasema kihalisi “tumvute,” kwa kutumia kiambishi cha umoja ambacho huenda kinamtaja Benyamini au jeshi lake kwa maana ya jumla. Tafsiri hii imetumia wingi unaoeleweka kwa kawaida katika Kiswahili.
    reason: lexical_alternative
  - marker: c
    text: Au “barabara” au “njia kuu.” Neno la Kiebrania linaweza kumaanisha barabara zilizotengenezwa au barabara kuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגָּפִים
  choice: wanashindwa
  rationale: Katika muktadha wa vita, kitenzi hiki kinaonyesha kupigwa na kushindwa. ‘Wanashindwa’ ni Kiswahili cha kawaida kinachohifadhi hali ya kutendwa na mwendelezo wa tukio.
- source_word: לְפָנֵינוּ
  choice: mbele yetu
  rationale: Hii ni nahau ya kawaida ya Kiebrania inayoonyesha kushindwa mbele ya jeshi la Benyamini au kwa mkono wao vitani.
- source_word: כְּבָרִאשֹׁנָה
  choice: kama mara ya kwanza
  rationale: Maneno haya yanarejelea mapambano yaliyotangulia katika sura hii bila kuongeza neno ‘vita,’ ambalo haliko wazi katika kishazi chenyewe.
- source_word: נָנוּסָה
  choice: tukimbie
  rationale: Umbo la kohotativi linaeleza pendekezo au azimio la pamoja; ‘tukimbie’ linaonyesha maana hiyo kwa kawaida katika Kiswahili.
- source_word: וּנְתַקְּנֻהוּ
  choice: ili tuwavute mbali
  rationale: Mzizi נתק una maana ya kuvuta au kutenga mbali. Kiswahili kinatumia wingi ‘tuwavute’ kwa kawaida kwa jeshi au watu wa Benyamini wanaokusudiwa, ingawa kiambishi cha Kiebrania ni cha umoja wa kiume.
- source_word: הָעִיר
  choice: mji
  rationale: עִיר hapa ni Gibea, kitovu cha makazi ambacho jeshi la Benyamini lilipaswa kuvutwa litoke humo.
- source_word: הַמְסִלּוֹת
  choice: barabara kuu
  rationale: מְסִלּוֹת inaweza kumaanisha barabara zilizotengenezwa au njia kuu. ‘Barabara kuu’ huhifadhi maana hiyo kwa Kiswahili cha sasa.
