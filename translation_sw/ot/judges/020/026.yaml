  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ כָל בְּנֵי֩ יִשְׂרָאֵ֨ל וְ/כָל הָ/עָ֜ם וַ/יָּבֹ֣אוּ בֵֽית אֵ֗ל וַ/יִּבְכּוּ֙ וַ/יֵּ֤שְׁבוּ שָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יָּצ֥וּמוּ בַ/יּוֹם הַ/ה֖וּא עַד הָ/עָ֑רֶב וַֽ/יַּעֲל֛וּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/026.yaml
  text: Then all the sons of Israel and all the people went up and came to Bethel[a], and they wept and sat there before Yahweh and fasted that day until evening[b]. Then they offered up burnt offerings and peace offerings before Yahweh.
translation:
  language: sw
  text: Ndipo wana wote wa Israeli na watu wote wakapanda, wakafika Betheli, wakalia na wakaketi huko mbele za Yahwe. Wakafunga siku hiyo mpaka jioni, kisha wakatoa sadaka za kuteketezwa na sadaka za amani[a] mbele za Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka za ushirika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: wakapanda
  rationale: Kitenzi עלה kinaonyesha mwendo wa kwenda juu; “wakapanda” huhifadhi mwelekeo huo kwa lugha ya kawaida ya Kiswahili.
- source_word: כָל בְּנֵי יִשְׂרָאֵל וְכָל הָעָם
  choice: wana wote wa Israeli na watu wote
  rationale: “Wana wa Israeli” huhifadhi taswira ya kifamilia na kitaifa ya Kiebrania, huku kirai cha pili “watu wote” kikibaki kwa msisitizo wake.
- source_word: בֵית אֵל
  choice: Betheli
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la mahali, badala ya kulitafsiri kuwa “nyumba ya Mungu.”
- source_word: וַיִּבְכּוּ
  choice: wakalia
  rationale: Neno hili linaeleza kilio cha maombolezo katika muktadha wa kushindwa na ibada.
- source_word: וַיֵּשְׁבוּ שָׁם לִפְנֵי יְהוָה
  choice: kuketi huko mbele za Yahwe
  rationale: ישב linaweza kumaanisha kuketi, kukaa au kubaki; “kuketi” huhifadhi tendo halisi linalowezekana katika muktadha huu bila kuondoa maana ya kudumu mbele za Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: וַיָּצוּמוּ
  choice: wakafunga
  rationale: צום humaanisha kujinyima chakula kama tendo la maombolezo au ibada; “kufunga” ndilo neno la kawaida la Kiswahili.
- source_word: בַיּוֹם הַהוּא עַד הָעָרֶב
  choice: siku hiyo mpaka jioni
  rationale: Tafsiri hii ya kawaida huhifadhi kikomo cha muda kilichoelezwa katika Kiebrania.
- source_word: וַיַּעֲלוּ עֹלוֹת
  choice: wakatoa sadaka za kuteketezwa
  rationale: Katika muktadha wa dhabihu, עלה katika Hifili humaanisha kutoa dhabihu; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: שְׁלָמִים
  choice: sadaka za amani
  rationale: “Sadaka za amani” huhifadhi kwa karibu istilahi ya Kiebrania bila kuifungia katika kipengele kimoja tu cha ushirika.
theological_decisions:
- issue: Uwasilishaji wa jina la agano יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi jina hilo kwa umbo linalofaa tahajia ya Kiswahili.
- issue: Tafsiri ya בני ישראל kama jina la taifa lenye umbo la kifamilia
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Chaguo hili huhifadhi umbo la Kiebrania la uhusiano wa kifamilia na matumizi yake ya kitaifa bila kuongeza ufafanuzi wa kidhehebu.
- issue: Maana ya שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika
  rationale: Istilahi inaweza kuhusishwa na ustawi, amani na ushirika. Tafsiri ya msingi haifungi maana katika “ushirika” pekee, huku tanbihi ikihifadhi chaguo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi umewekwa kwa mtindo wa simulizi wa Kiswahili, huku uradidi na istilahi za dhabihu za Kiebrania zikihifadhiwa.
