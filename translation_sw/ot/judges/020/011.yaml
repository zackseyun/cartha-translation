  text: So all the men of Israel gathered to the city[a], united as one man.
translation:
  language: sw
  text: Hivyo wanaume wote wa Israeli wakakusanyika kwenye mji huo[a], wakiwa wameungana kama mtu mmoja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: kuuelekea mji huo; katika muktadha huu pia yaweza kueleweka: dhidi ya mji huo.'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kama mtu mmoja, wakiwa wameunganishwa”—nahau inayosisitiza umoja kamili katika kutenda.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: wakakusanyika
  rationale: Kitenzi cha Kiebrania kiko katika Niphal na kina maana ya pamoja ya kukusanyika. Kiswahili hutumia umbo la kutenda kwa kawaida kwa kiima hiki cha wingi, bila kupoteza maana ya watu kuja pamoja.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: wanaume wote wa Israeli
  rationale: Ingawa אִישׁ ni umoja kisarufi, pamoja na כָּל hapa ina maana ya pamoja na inawahusu wanaume wa Israeli waliokusanyika katika muktadha wa kijeshi.
- source_word: אֶל הָעִיר
  choice: kwenye mji huo
  rationale: אֶל kwa kawaida huonyesha mwendo kuelekea mahali. Katika Kiswahili, 'kwenye mji huo' ni ya asili pamoja na 'wakakusanyika' na haiongezi waziwazi maana ya uhasama ambayo kihusishi chenyewe hakilazimishi; uwezekano wa 'dhidi ya' umeonyeshwa katika tanbihi.
- source_word: כְּאִישׁ אֶחָד
  choice: kama mtu mmoja
  rationale: Hii inahifadhi taswira halisi ya Kiebrania na nahau yake ya kutenda kwa umoja kamili.
- source_word: חֲבֵרִים
  choice: wakiwa wameungana
  rationale: Neno hili linaongeza wazo la kuunganishwa au kuwa katika mshikamano. Kauli hii ni Kiswahili cha asili na inaonyesha nguvu yake ya kueleza hali ya mkusanyiko.
