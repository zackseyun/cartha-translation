base_translation:
  language: en
  yaml_path: translation/ot/judges/020/025.yaml
  text: Benjamin came out from Gibeah to meet them on the second day[a], and they struck down another eighteen thousand men of Israel to the ground[b]; all these were drawing the sword.
translation:
  language: sw
  text: Benyamini wakatoka Gibea kwenda kukutana nao siku ya pili[a], wakawaangamiza miongoni mwa wana wa Israeli wanaume wengine elfu kumi na nane, wakawaangusha chini; hao wote walikuwa wenye kuchomoa upanga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwakabili.” Kirai cha Kiebrania kinaweza kumaanisha kukutana au kukabili kwa uhasama katika mazingira ya vita.
    reason: lexical_alternative
  - marker: b
    text: Yaani, watu waliokuwa tayari kwa vita kwa kuchomoa panga zao kutoka katika ala.
    reason: clarity
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: wakatoka
  rationale: Kitenzi cha masimulizi kinaonyesha kutoka mahali; wingi unakubaliana na Benyamini kama kundi la kikabila.
- source_word: לִקְרָאתָם
  choice: kwenda kukutana nao
  rationale: Huhifadhi maana ya msingi ya kwenda kuwakabili au kukutana nao, huku muktadha wa vita ukionyesha kuwa mkutano huo ulikuwa wa uhasama.
- source_word: מִן הַגִּבְעָה
  choice: Gibea
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili; kitenzi 'wakatoka' tayari hubeba wazo la kutoka mahali.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: siku ya pili
  rationale: Ni uwasilishaji wa moja kwa moja wa kirai cha namba ya mpangilio.
- source_word: וַיַּשְׁחִיתוּ
  choice: wakawaangamiza
  rationale: Katika muktadha wa vita, Hifili ya שׁחת inaonyesha kuwaua au kuwaangamiza watu; idadi ya walioanguka inathibitisha matokeo ya kifo.
- source_word: בִבְנֵי יִשְׂרָאֵל
  choice: wanaume ... wa Israeli
  rationale: Kirai kinatambulisha walioathiriwa miongoni mwa wana wa Israeli; Kiswahili cha asili hutumia 'wa Israeli,' na אִישׁ baadaye huweka wazi kuwa walikuwa wanaume.
- source_word: עוֹד
  choice: tena
  rationale: Huonyesha hasara ya ziada baada ya ile ya siku iliyotangulia.
- source_word: שְׁמֹנַת עָשָׂר אֶלֶף אִישׁ
  choice: wanaume elfu kumi na nane
  rationale: Hutoa namba na nomino אִישׁ kwa uwazi bila kuongeza neno 'askari,' ambalo halimo moja kwa moja katika Kiebrania.
- source_word: אָרְצָה
  choice: wakawaangusha chini
  rationale: Huonyesha mwelekeo wa kuanguka ardhini katika mauaji ya vitani, kwa Kiswahili cha kawaida.
- source_word: כָּל אֵלֶּה
  choice: hao wote
  rationale: Ni muundo wa kawaida wa Kiswahili unaorejelea watu waliotajwa.
- source_word: שֹׁלְפֵי חָרֶב
  choice: watu wenye kufuta upanga
  rationale: Huhifadhi taswira ya washiriki wa vita wanaoutoa upanga ala yake badala ya kuibadilisha kuwa neno pana kama 'wenye silaha.'
