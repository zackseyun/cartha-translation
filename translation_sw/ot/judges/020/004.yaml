  text: וַ/יַּ֜עַן הָ/אִ֣ישׁ הַ/לֵּוִ֗י אִ֛ישׁ הָ/אִשָּׁ֥ה הַ/נִּרְצָחָ֖ה וַ/יֹּאמַ֑ר הַ/גִּבְעָ֨תָ/ה֙ אֲשֶׁ֣ר לְ/בִנְיָמִ֔ן בָּ֛אתִי אֲנִ֥י וּ/פִֽילַגְשִׁ֖/י לָ/לֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/004.yaml
  text: Then the Levite[a], the husband of the woman who had been murdered, answered and said, “I came to Gibeah, which belongs to Benjamin, I and my concubine, to spend the night.
translation:
  language: sw
  text: Ndipo Mlawi, mume wa mwanamke aliyeuawa, akajibu na kusema, “Nilikuja Gibea ya Benyamini,[a] mimi na suria wangu, ili tukalale huko usiku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Gibea, iliyo katika eneo la Benyamini.”
    reason: Kirai אֲשֶׁר לְבִנְיָמִן kinaweza kueleweka kuwa uhusiano wa Gibea na Benyamini au mahali pake katika eneo la Benyamini.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: akajibu na kusema
  rationale: Muundo huu unahifadhi vitenzi vyote viwili vya Kiebrania vinavyoanzisha kauli, huku ukisomeka kwa kawaida katika masimulizi ya Kiswahili.
- source_word: הָאִישׁ הַלֵּוִי
  choice: Mlawi
  rationale: Hili ni jina la kawaida na la moja kwa moja la mtu wa kabila au hadhi ya Walawi.
- source_word: אִישׁ הָאִשָּׁה
  choice: mume wa mwanamke
  rationale: Ingawa kwa neno moja moja ni ‘mwanamume wa mwanamke,’ katika muktadha huu kirai kinaonyesha uhusiano wa kindoa; ‘mume’ ni Kiswahili cha kawaida na chenye heshima.
- source_word: הַנִּרְצָחָה
  choice: aliyeuawa
  rationale: Kitenzi hiki kinaonyesha kuuawa kwa mwanadamu kwa njia ya jinai; ‘aliyeuawa’ ni cha asili katika Kiswahili na hakipunguzi uzito wa tukio.
- source_word: הַגִּבְעָתָה
  choice: Nilifika Gibea
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha kwenda Gibea; ‘nilifika Gibea’ huwasilisha mwendo na kuwasili kwa lugha ya kawaida.
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: ulio wa Benyamini
  rationale: Kirai kinaonyesha kuwa Gibea ilihusishwa na, au ilikuwa katika eneo la, kabila la Benyamini. Tafsiri kuu inatumia uhusiano wa umilikaji, huku maana ya eneo ikihifadhiwa katika tanbihi.
- source_word: בָּאתִי אֲנִי וּפִילַגְשִׁי
  choice: Nilifika ... mimi na suria yangu
  rationale: Mpangilio huu unadumisha kiwakilishi cha msisitizo אֲנִי na kumtaja suria kuwa aliandamana na msemaji, bila kugeuza umoja wa kitenzi cha Kiebrania kuwa dai tofauti.
- source_word: פִילֶגֶשׁ
  choice: suria
  rationale: ‘Suria’ ni istilahi ya Kiswahili inayotambulika kwa mwanamke mwenye uhusiano wa kudumu na mwanamume lakini asiye na hadhi kamili ya mke; inaepuka kuficha tofauti iliyopo katika matini.
- source_word: לָלוּן
  choice: ili tulale huko usiku
  rationale: Kitenzi hiki humaanisha kukaa au kulala mahali usiku mmoja. Kauli hii ni wazi na ya kawaida kwa wasomaji wa sasa.
theological_decisions:
- issue: Uhusiano wa Mlawi na mwanamke unatajwa kwa istilahi mbili tofauti
  choice: mume wa mwanamke ... suria yangu
  alternative: mwenzi wa mwanamke ... mke wangu wa pili
  rationale: Matini humwita mwanamume ‘mume/mwanamume wa mwanamke’ na pia humwita mwanamke פילגש. Tafsiri inadumisha mvutano huo wa kijamii na kisheria badala ya kuufanya uhusiano uwe ndoa kamili au usio wa kindoa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wa sasa, wenye heshima na unaoeleweka. Tanbihi [a] imewekwa baada ya kirai kinachohusika kuhusu Benyamini, si baada ya ‘Mlawi’.
