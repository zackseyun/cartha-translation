base_translation:
  language: en
  yaml_path: translation/ot/judges/020/037.yaml
  text: Then the men in ambush quickly rushed against Gibeah[a], and the ambush advanced and struck the whole city with the edge of the sword.
translation:
  language: sw
  text: Ndipo wale waliokuwa wamevizia wakaharakisha kuushambulia Gibea; kikosi kilichokuwa kimevizia kikasonga mbele[a] na kuupiga mji wote kwa makali ya upanga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa tafsiri ya moja kwa moja, “kikosi kilichokuwa kimevizia kikavuta.” Kitenzi hiki huenda kinamaanisha kwamba kikosi hicho kilijitanua mbele au kilisonga kwa nguvu kuingia mjini.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹרֵב
  choice: wale waliokuwa wamevizia / kikosi kilichokuwa kimevizia
  rationale: Nomino hii ya umoja ina maana ya mkusanyiko katika muktadha huu. Kauli ya kwanza inawasilisha watu wanaotenda, huku ya pili ikidumisha umoja wa kisarufi kwa kurejelea kikosi kizima.
- source_word: הֵחִישׁוּ
  choice: wakaharakisha
  rationale: Kitenzi kinaonyesha kutenda kwa haraka; ‘wakaharakisha’ ni Kiswahili cha kawaida kinachobeba dharura ya mwendo wa kijeshi.
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: kuushambulia
  rationale: Katika simulizi hili la vita, kitenzi kinaeleza kusonga kwa ghafla kuelekea mji kwa kusudi la kuuvamia. ‘Kuushambulia’ huwasilisha maana hiyo kwa uwazi bila kuongeza maelezo yasiyokuwapo.
- source_word: הַגִּבְעָה
  choice: Gibea
  rationale: Jina la mahali limetoholewa kwa namna inayotumika na kueleweka katika Kiswahili.
- source_word: וַיִּמְשֹׁךְ
  choice: kikasonga mbele
  rationale: Kitenzi kwa msingi humaanisha kuvuta au kujinyoosha, lakini hapa yaelekea kinaeleza kikosi cha kuvizia kilichosonga au kujitanua mbele. Tafsiri kuu inatoa maana inayowezekana katika muktadha wa kijeshi, na maana halisi zaidi imehifadhiwa katika tanbihi.
- source_word: וַיַּךְ
  choice: kuupiga
  rationale: Kitenzi hiki kina maana pana ya kupiga au kushambulia; kishazi kinachofuata kinaonyesha kwamba tendo hilo lilifanywa kwa upanga.
- source_word: כָּל הָעִיר
  choice: mji wote
  rationale: Hii inadumisha usemi wa Kiebrania bila kuufasiri kimyakimya kuwa wakazi peke yao, ingawa katika muktadha unawahusu watu wa mji.
- source_word: לְפִי חָרֶב
  choice: kwa makali ya upanga
  rationale: Huu ni ulinganifu wa kawaida na wa asili wa nahau ya Kiebrania, ambayo kwa neno moja moja ni ‘kwa kinywa cha upanga’; unahifadhi taswira ya silaha na maana yake ya kuua.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi la kihistoria na hadhi inayofaa Maandiko. Muundo wa kishazi kimoja chenye sehemu mbili unadumisha mwendelezo wa matendo katika Kiebrania, huku tofauti kati ya watu waliovizia na kikosi chao ikifafanuliwa kwa lugha ya kawaida.
