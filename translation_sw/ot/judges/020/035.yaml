base_translation:
  language: en
  yaml_path: translation/ot/judges/020/035.yaml
  text: And Yahweh struck Benjamin down before Israel[a], and the sons of Israel destroyed twenty-five thousand one hundred men of Benjamin that day[b], all these drawing the sword.
translation:
  language: sw
  text: Yahwe akawapiga Wabenyamini mbele ya Israeli[a], nao wana wa Israeli wakawaangamiza siku hiyo wanaume elfu ishirini na tano na mia moja wa Benyamini; wote hao walikuwa wenye kuchomoa upanga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawashinda Wabenyamini mbele ya Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: akawapiga na kuwaangusha
  rationale: Katika muktadha wa vita, kitenzi נָגַף huonyesha kupiga na kushinda au kuangusha. Usemi huu unabaki na picha ya pigo la Yahwe na pia unaeleweka kwa Kiswahili cha sasa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: mbele ya Israeli
  rationale: Huhifadhi nahau ya Kiebrania na katika muktadha humaanisha kwamba Benyamini alipigwa katika mapambano dhidi ya Israeli.
- source_word: וַיַּשְׁחִיתוּ
  choice: wakawaangamiza
  rationale: Hifili ya שׁחת hapa ina maana ya kuharibu kabisa au kuua katika vita; “kuwaangamiza” huhifadhi ukali wa neno.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hutafsiri kwa karibu usemi wa Kiebrania “wana wa Israeli” na kudumisha rejeo lake kwa kundi la wapiganaji.
- source_word: בְּבִנְיָמִן
  choice: wa Benyamini
  rationale: Katika sentensi ya kuhesabu waliouawa, ב inaonyesha jamii ambamo watu hao walitoka; Kiswahili cha kawaida husema “wa Benyamini.”
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף וּמֵאָה אִישׁ
  choice: wanaume elfu ishirini na tano na mia moja
  rationale: Hutoa idadi iliyo katika maandishi na kutafsiri אִישׁ kama wanaume katika muktadha wa wapiganaji.
- source_word: כָּל אֵלֶּה
  choice: wote hao
  rationale: Ni usemi wa kurejelea tena wanaume waliotajwa katika idadi.
- source_word: שֹׁלֵף חָרֶב
  choice: wapiganaji waliouchomoa upanga
  rationale: Maana ya moja kwa moja ni “wanaochomoa upanga,” nahau inayowataja wapiganaji wenye silaha. “Wapiganaji” huweka maana wazi huku picha ya upanga ikihifadhiwa.
theological_decisions:
- issue: Utendaji wa Mungu na wa wanadamu katika matokeo ya vita
  choice: Yahwe ndiye anayewapiga na kuwaangusha watu wa Benyamini, kisha wana wa Israeli wanawaangamiza wapiganaji wao.
  alternative: Kusisitiza utendaji wa Mungu pekee au ushindi wa kijeshi wa wanadamu pekee.
  rationale: Kiebrania kinaweka matendo ya Mungu na ya Israeli sambamba kwa mfuatano. Tafsiri haivunji mvutano huo wala kuyafanya kuwa tendo moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Watu wa Benyamini” limetumiwa kwa ulaini wa Kiswahili ingawa Kiebrania hutumia jina la kabila kwa pamoja. Muundo wa aya unahifadhi wazi utendaji wa Yahwe na wa wana wa Israeli.
