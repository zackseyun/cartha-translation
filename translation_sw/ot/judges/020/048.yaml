base_translation:
  language: en
  yaml_path: translation/ot/judges/020/048.yaml
  text: And the men of Israel turned back against the sons of Benjamin and struck them with the edge of the sword[a], from each city, men to livestock, even all that was found[c][b]. Also all the cities that were found they set on fire.
translation:
  language: sw
  text: Nao wanaume wa Israeli wakarudi kuwashambulia Wabenyamini, wakawapiga kwa makali ya upanga—kuanzia watu wa kila mji hadi mifugo, hata kila kitu walichokikuta.[a] Pia wakaiteketeza kwa moto miji yote waliyoikuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai cha Kiebrania kilichotafsiriwa “watu wa kila mji” ni kigumu. Huenda maana yake ni kwamba waliwaangamiza kabisa wakazi wa miji, pamoja na mifugo na kila kitu kingine walichokikuta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: wanaume wa Israeli
  rationale: Ingawa אִישׁ ni umoja kimaumbo, hapa ina maana ya kijumla pamoja na kitenzi cha wingi. Muktadha ni wa wapiganaji, hivyo “wanaume wa Israeli” hudumisha rejeleo hilo.
- source_word: שָׁבוּ אֶל בְּנֵי בִנְיָמִן
  choice: wakarudi kuwashambulia Wabenyamini
  rationale: שׁוב inaonyesha kugeuka au kurudi, na אֶל hupata maana ya uelekeo wa uhasama kutokana na kitenzi kinachofuata. “Wabenyamini” ni Kiswahili cha kawaida kwa “wana wa Benyamini.”
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: wakawapiga kwa makali ya upanga
  rationale: נכה ni kitenzi chenye maana pana ya kupiga au kuua, huku msemo לְפִי חֶרֶב ukitaja kihalisi makali ya upanga. Tafsiri hii inadumisha picha na kutotaja zaidi ya chanzo.
- source_word: מֵעִיר מְתֹם עַד בְּהֵמָה עַד כָּל הַנִּמְצָא
  choice: kuanzia watu wa kila mji hadi mifugo, naam, kila kitu walichokikuta
  rationale: Kirai מֵעִיר מְתֹם ni kigumu, lakini katika muktadha kinaelekea kueleza uangamizi kamili wa wakazi wa miji. “Naam” huonyesha nguvu ya kilele ya עַד ya pili.
- source_word: גַּם כָּל הֶעָרִים הַנִּמְצָאוֹת שִׁלְּחוּ בָאֵשׁ
  choice: Pia wakaichoma moto miji yote waliyoikuta
  rationale: הַנִּמְצָאוֹת hapa yaelekea kumaanisha miji waliyokutana nayo au kuipata, na שִׁלְּחוּ בָאֵשׁ ni nahau ya kuiwasha au kuiteketeza kwa moto.
