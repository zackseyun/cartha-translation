  yaml_path: translation/ot/judges/020/019.yaml
  text: Then the sons of Israel rose in the morning and camped against Gibeah[a].
translation:
  language: sw
  text: Basi wana wa Israeli[a] wakainuka asubuhi, wakapiga kambi dhidi ya Gibea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania ni “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: wakainuka
  rationale: Kitenzi קום katika mfululizo wa masimulizi kinaeleza tendo lililofuata. “Wakainuka” huhifadhi maana yake pana bila kuifasiri hasa kuwa waliondoka au waliamka usingizini.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hii inawakilisha moja kwa moja nahau ya Kiebrania inayowataja watu wa Israeli. Ingawa “Waisraeli” ni ya kawaida zaidi katika Kiswahili, umbo la chanzo limehifadhiwa katika matini na mbadala umeonyeshwa katika tanbihi.
- source_word: בַּבֹּקֶר
  choice: asubuhi
  rationale: Nomino yenye kihusishi inaonyesha wakati; “asubuhi” ni Kiswahili cha kawaida na cha wazi.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Kitenzi חנה kinamaanisha kuweka au kupiga kambi. “Wakapiga kambi” ni usemi wa sasa, wa kawaida, na unaofaa katika simulizi.
- source_word: עַל
  choice: kuikabili
  rationale: Katika muktadha huu wa kijeshi, עַל huonyesha kwamba walijiweka kuelekea Gibea kwa uhasama, si kwamba walikuwa karibu nayo tu. “Kuikabili” hudokeza mahali walipojipanga na mwelekeo wao bila kuongeza maelezo yasiyomo.
- source_word: הַגִּבְעָה
  choice: Gibea
  rationale: Hili ni jina la mahali. Kibainishi cha Kiebrania ni sehemu ya umbo la jina katika kifungu hiki na hakitafsiriwi kando kwa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi “wakainuka … wakapiga” huhifadhi mwendo wa simulizi la Kiebrania; “Basi” huunganisha mstari huu na hatua iliyotangulia.
