translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Walijitia nguvu' huhifadhi maana ya kujirejelea ya Kiebrania, huku tanbihi ikitoa maana mbadala ya kupata ujasiri. 'Wakajipanga kwa ajili ya vita' ni wazi kwa wasomaji wa kawaida na bado inaonyesha upangaji wa kijeshi.
