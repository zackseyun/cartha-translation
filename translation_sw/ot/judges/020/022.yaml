base_translation:
  language: en
  yaml_path: translation/ot/judges/020/022.yaml
  text: But the people[a], the men of Israel, strengthened themselves and again drew up for battle in the place where they had drawn up on the first day.
translation:
  language: sw
  text: Lakini watu, yaani wanaume wa Israeli, walijitia nguvu[a], wakajipanga tena kwa ajili ya vita mahali pale walipojipanga siku ya kwanza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walipata ujasiri.” Kiebrania kinaweza kumaanisha kwamba walifanya upya azimio lao baada ya kushindwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: walijitia nguvu
  rationale: Kauli ya Kiebrania ya Hitpael hapa ina maana ya kujitia nguvu au kuimarisha azimio baada ya kushindwa; tafsiri hii inadumisha hali ya kujirejelea bila kufafanua kupita kiasi.
- source_word: הָעָם אִישׁ יִשְׂרָאֵל
  choice: watu, yaani wanaume wa Israeli
  rationale: Muundo wa uambatanisho unahifadhi nomino ya jumla 'watu' pamoja na utambulisho mahususi wa wanaume wa Israeli waliokuwa wakipigana; 'yaani' huufanya muundo huo ueleweke kwa Kiswahili cha kawaida.
- source_word: וַיֹּסִפוּ
  choice: tena
  rationale: Pamoja na kitenzi-jina kinachofuata, יסף huonyesha kurudia au kuanza upya kitendo.
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: wakajipanga kwa ajili ya vita
  rationale: ערך pamoja na מלחמה hurejelea kupanga safu au kuchukua nafasi za mapigano; 'kujipanga kwa ajili ya vita' ni ya asili na hudumisha maana ya kijeshi.
- source_word: בַּמָּקוֹם
  choice: mahali pale
  rationale: Hii ni kauli ya mahali inayorejelea eneo lilelile la mapambano ya awali.
- source_word: אֲשֶׁר עָרְכוּ שָׁם
  choice: walipokuwa wamejipanga
  rationale: Kishazi hiki hurejelea kujipanga kwao hapo awali; muundo huu wa Kiswahili huepuka kurudia neno 'hapo' bila kupoteza maana ya mahali.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: siku ya kwanza
  rationale: Ni kauli ya wakati inayotaja siku ya mapambano ya awali.
