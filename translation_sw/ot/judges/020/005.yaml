base_translation:
  language: en
  yaml_path: translation/ot/judges/020/005.yaml
  text: Then the men of Gibeah rose up against me and surrounded the house at night[a]. They intended to kill me, and they violated my concubine[b], and she died.
translation:
  language: sw
  text: Ndipo watu wa Gibea wakainuka dhidi yangu na kuizunguka nyumba usiku. Walikusudia kuniua, nao wakamnajisi suria wangu[a], naye akafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakambaka suria wangu.” Kitenzi cha Kiebrania kinaweza kumaanisha kumtesa au kumdhalilisha mtu; hapa muktadha unaonyesha shambulio la kingono.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֵי הַגִּבְעָה
  choice: watu wa Gibea
  rationale: Katika muundo huu, neno hilo linamaanisha wakazi wanaume au watu wenye hadhi katika mji, si lazima mabwana rasmi. “Watu wa Gibea” ni Kiswahili cha kawaida na hakiongezi cheo kisichothibitishwa.
- source_word: וַיָּקֻמוּ עָלַי
  choice: wakainuka dhidi yangu
  rationale: Inahifadhi taswira ya nahau ya Kiebrania ya kuinuka kwa uadui dhidi ya mtu.
- source_word: וַיָּסֹבּוּ עָלַי אֶת־הַבַּיִת
  choice: kuizunguka nyumba
  rationale: Kitenzi kinaeleza kuizingira au kuizunguka nyumba; uadui unaonekana tayari katika kishazi kilichotangulia.
- source_word: לָיְלָה
  choice: usiku
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha wakati tendo lilipotokea.
- source_word: דִּמּוּ לַהֲרֹג
  choice: walikusudia kuniua
  rationale: Katika muktadha huu, kitenzi kinaonyesha nia au kusudi la kuua.
- source_word: פִּילַגְשִׁי
  choice: suria wangu
  rationale: “Suria” ni istilahi ya Kiswahili inayofaa kwa פילגש katika mazingira haya ya kihistoria na kijamii.
- source_word: עִנּוּ
  choice: wakamnajisi
  rationale: Katika muktadha wa simulizi, kitenzi kinahusu udhalilishaji wa kingono. “Kumnajisi” huonyesha ukiukaji huo kwa lugha yenye hadhi, huku tanbihi ikitaja maana ya moja kwa moja zaidi.
- source_word: וַתָּמֹת
  choice: naye akafa
  rationale: Inafuata mfuatano wa masimulizi wa Kiebrania bila kuongeza wazi uhusiano wa kisababishi ambao kiunganishi chenyewe hakilazimishi.
