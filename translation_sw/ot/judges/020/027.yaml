  yaml_path: translation/ot/judges/020/027.yaml
  text: And the sons of Israel inquired of Yahweh—for the ark of the covenant of God was there in those days—[a][b]
translation:
  language: sw
  text: Wana wa Israeli wakamwuliza Yahwe—na sanduku la Agano la Mungu lilikuwako mahali hapo siku zile—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli wakamwuliza Yahwe.” Kiebrania ni hasa, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Kishazi “na sanduku la Agano la Mungu lilikuwako mahali hapo siku zile” ni taarifa ya mabano kuhusu mahali na wakati wa tukio.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ בַיהוָה
  choice: wakamwuliza Yahwe
  rationale: Kitenzi שׁאל pamoja na ב na jina la Mungu humaanisha kumwendea Mungu ili kupata jibu au mwongozo. “Wakamwuliza Yahwe” ni Kiswahili cha kawaida na chenye uzito wa kidini katika muktadha huu, si swali la kawaida tu.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Huhifadhi kwa ukaribu tamathali ya Kiebrania, yaani “wana wa Israeli,” ambayo hapa inamaanisha watu wa Israeli kwa pamoja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo kama “Bwana.” Tahajia hii ni ya kawaida na rahisi kutamkwa katika Kiswahili.
- source_word: וְשָׁם
  choice: kwa maana ... lilikuwako huko
  rationale: Katika muktadha, kishazi hiki kinaeleza mazingira yaliyowawezesha Waisraeli kumwuliza Yahwe. “Kwa maana” pamoja na vistari virefu huonyesha wazi kuwa ni maelezo ya pembeni.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: sanduku la agano la Mungu
  rationale: Huhifadhi mfuatano kamili wa maneno ya Kiebrania na ni usemi unaoeleweka katika Kiswahili cha kibiblia.
- source_word: בַּיָּמִים הָהֵם
  choice: siku hizo
  rationale: Ni tafsiri ya kawaida na ya asili ya nahau hii ya wakati.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Bwana
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu, יהוה. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya tendo la kumwuliza Yahwe
  choice: wakamwuliza Yahwe
  alternative: wakatafuta shauri kwa Yahwe
  rationale: Muktadha unaonyesha kutafuta jibu au mwongozo wa Mungu, lakini tafsiri haiongezi maelezo kuhusu njia mahsusi ya kupokea ufunuo ambayo mstari wenyewe hauitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wa heshima. “Wana wa Israeli” huhifadhi umbo la Kiebrania, huku tanbihi ikitoa “Waisraeli” kama usemi wa kawaida zaidi. Vistari virefu vinatenga kishazi cha maelezo kama katika muundo wa chanzo.
