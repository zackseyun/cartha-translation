  text: Then all the people rose up as one man, saying, “Not one of us will go to his tent, and not one of us will turn aside to his house.”
translation:
  language: sw
  text: Ndipo watu wote wakainuka kama mtu mmoja, wakisema, “Hakuna hata mmoja wetu atakayekwenda kwenye hema lake, wala hakuna hata mmoja wetu atakayegeuka kuelekea nyumbani kwake.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: wakasimama
  rationale: Kitenzi קום hapa kinaonyesha watu wote waliinuka au wakasimama kwa pamoja; ‘wakasimama’ ni ya kawaida na yenye heshima katika Kiswahili.
- source_word: כְּאִישׁ אֶחָד
  choice: kama mtu mmoja
  rationale: Nahau ya Kiebrania imehifadhiwa kwa ukaribu kwa sababu inaeleweka katika Kiswahili na kusisitiza umoja wa kusudi.
- source_word: לֹא נֵלֵךְ אִישׁ לְאָהֳלוֹ
  choice: Hakuna hata mmoja wetu atakayeenda hemani kwake
  rationale: Ingawa muundo wa Kiebrania ni ‘mtu hataenda hemani kwake,’ kauli hii ya Kiswahili huwasilisha wazi azimio la pamoja bila kubadili maana.
- source_word: וְלֹא נָסוּר אִישׁ לְבֵיתוֹ
  choice: wala hakuna hata mmoja wetu atakayegeuka kwenda nyumbani kwake
  rationale: סור ina wazo la kugeuka au kuacha njia; ‘kugeuka kwenda’ huhifadhi wazo hilo, huku בֵּית ikitafsiriwa kwa kawaida kuwa ‘nyumbani’ katika muktadha huu.
