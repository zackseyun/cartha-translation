  yaml_path: translation/ot/judges/020/030.yaml
  text: Then the sons of Israel went up against the sons of Benjamin on the third day[a], and they drew up against Gibeah as before.
translation:
  language: sw
  text: Kisha wana wa Israeli[a] wakapanda dhidi ya wana wa Benyamini siku ya tatu, wakajipanga dhidi ya Gibea kama hapo awali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli ... Wabenyamini.” Kiebrania, kwa maana ya moja kwa moja zaidi, kinasema “wana wa Israeli” na “wana wa Benyamini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: wakapanda
  rationale: Kitenzi עלה kwa kawaida humaanisha ‘kupanda’ au ‘kwenda juu’; hapa kinaeleza kusonga kwao kwenda vitani bila kufafanua zaidi ya Kiebrania.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hifadhi usemi wa kindugu wa Kiebrania na ulinganifu wake na ‘wana wa Benyamini’; katika muktadha huu unamaanisha Waisraeli.
- source_word: אֶל בְּנֵי בִנְיָמִן
  choice: kupigana na wana wa Benyamini
  rationale: Ingawa אֶל kimsingi ni ‘kwa/kuelekea,’ muktadha wa kijeshi unaonyesha mwendo wa kuwashambulia; Kiswahili hiki kinaweka wazi uhasama bila kupoteza wahusika.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: siku ya tatu
  rationale: Huu ni usemi wa kawaida na wa moja kwa moja wa wakati katika Kiswahili.
- source_word: וַיַּעַרְכוּ
  choice: wakajipanga
  rationale: Katika muktadha wa kijeshi ערך humaanisha kupanga vikosi kwa ajili ya mapigano; ‘wakajipanga’ ni ya kawaida na inaeleweka.
- source_word: אֶל הַגִּבְעָה
  choice: dhidi ya Gibea
  rationale: Pamoja na kitenzi cha kupanga vikosi, kifungu hiki kinaonyesha kujipanga kwa ajili ya kulishambulia Gibea.
- source_word: כְּפַעַם בְּפָעַם
  choice: kama walivyofanya hapo awali
  rationale: Nahau hii humaanisha ‘kama hapo kabla’ au ‘kama nyakati zilizotangulia’; chaguo hili ni la asili katika Kiswahili na huhifadhi marejeo ya mashambulizi ya awali.
