translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. Usemi ‘wana wa Israeli’ umehifadhiwa ili kuakisi ulinganifu wa Kiebrania, huku tanbihi ikitoa majina ya kawaida ya makundi hayo.
