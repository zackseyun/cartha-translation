lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: wakaweka
  rationale: Kitenzi שׂוּם humaanisha kuweka au kupanga mahali; hapa kinaeleza kuwa jeshi liliwapanga watu katika nafasi za kuvizia.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina hili linarejelea jeshi la Israeli kwa ujumla; umbo la kawaida la Kiswahili ni “Israeli.”
- source_word: אֹרְבִים
  choice: watu katika maficho
  rationale: Neno hili ni umbo la kushiriki la ארב na linarejelea watu wanaovizia, si tu mpango usio na watu. “Watu katika maficho” ni lugha ya kawaida inayoonyesha waliofichwa tayari kwa shambulio la kushtukiza.
- source_word: אֶל ... סָבִיב
  choice: kuizunguka
  rationale: Ingawa אֶל peke yake mara nyingi humaanisha “kuelekea” au “kwenda kwa,” muungano wake na סָבִיב katika muktadha huu unaonyesha upangaji wa watu kuzunguka Gibea.
- source_word: הַגִּבְעָה
  choice: Gibea
  rationale: Hili ni jina la mahali; “Gibea” ni unukuzi wa kawaida wa Kiswahili bila kutafsiri kiambishi cha Kiebrania cha uainishaji.
- source_word: סָבִיב
  choice: kuizunguka
  rationale: Neno hili linaonyesha nafasi inayozunguka mahali; limeunganishwa kwa njia ya asili na אֶל katika kitenzi “kuizunguka.”
