  text: Look, all of you sons of Israel, give your word and counsel here.
translation:
  language: sw
  text: Tazameni, ninyi nyote wana wa Israeli; toeni hapa neno lenu na shauri lenu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazameni
  rationale: Kihisishi hiki cha kuvuta fikira kinatafsiriwa kwa wingi ili kuendana na wale wote wanaohutubiwa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi namna ya kifamilia ya Kiebrania na sauti ya heshima ya simulizi.
- source_word: דָּבָר
  choice: neno lenu
  rationale: Maana ya msingi ni ‘neno/jambo’; hapa inaelekea kumaanisha kauli au maoni yao, lakini ‘neno’ huhifadhi upana wa asili bila kuufunga kuwa ‘uamuzi’.
- source_word: עֵצָה
  choice: shauri lenu
  rationale: ‘Shauri’ huwasilisha ushauri au mpango unaopendekezwa katika mashauriano ya kusanyiko.
- source_word: הֲלֹם
  choice: hapa
  rationale: Huhifadhi kielezi cha mahali kinachosisitiza kutoa kauli na shauri mbele ya kusanyiko hili.
