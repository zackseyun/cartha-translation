base_translation:
  language: en
  yaml_path: translation/ot/judges/020/045.yaml
  text: Then they turned and fled toward the wilderness[a], to the rock of Rimmon. And they cut down five thousand men of them on the highways, and pursued them as far as Gidom[b], and struck down two thousand men of them.
translation:
  language: sw
  text: Ndipo wakageuka, wakakimbilia nyikani, kwenye mwamba wa Rimoni. Wakawaua[a] wanaume elfu tano katika njia kuu, wakawafuatilia mpaka Gidomu, kisha wakawaua wanaume elfu mbili miongoni mwao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa maana halisi, “walimwokota”; kitenzi hicho hutumia picha ya kuokota masazo ya mavuno. Hapa ni nahau ya kuwaua mmoja baada ya mwingine wale waliokuwa wakikimbia.
    reason: lexical_alternative
  - marker: b
    text: Mahali hapa Kiebrania hutumia viambishi vya umoja (“nyuma yake,” “kutoka kwake”) kumrejelea Benyamini kama kundi moja; Kiswahili kimetumia wingi kwa watu waliokuwa wakikimbia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: wakageuka
  rationale: Kitenzi פנה kinaonyesha kubadili mwelekeo; “wakageuka” ni cha kawaida na hakiongezi wazo la kurudi nyuma.
- source_word: וַיָּנֻסוּ הַמִּדְבָּרָה
  choice: wakakimbilia nyikani
  rationale: נוס humaanisha kukimbia ili kujiokoa, na kiishio cha mwelekeo katika הַמִּדְבָּרָה kinaonyesha mwendo kuelekea nyikani.
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: kuelekea kwenye mwamba wa Rimoni
  rationale: סֶלַע ni mwamba au jabali; jina la mahali limetoholewa kuwa “Rimoni,” huku nomino ya kawaida ikitafsiriwa.
- source_word: וַיְעֹלְלֻהוּ
  choice: wakawaua
  rationale: Kitenzi hiki kinatumia picha ya kuokota masazo ya mavuno kwa maana ya kuwashambulia na kuwaua waliosalia. “Wakawaua” huwasilisha matokeo katika muktadha huu wa vita; picha halisi imehifadhiwa katika tanbihi.
- source_word: בַּמְסִלּוֹת
  choice: katika njia kuu
  rationale: מְסִלּוֹת hurejelea barabara au njia zilizotengenezwa; “njia kuu” ni ya asili katika Kiswahili na inafaa mazingira ya kale.
- source_word: חֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: wanaume elfu tano
  rationale: אִישׁ hapa ni “mwanamume” katika hesabu ya wapiganaji; tafsiri hii huhifadhi jinsia iliyotajwa bila kuongeza neno “wanajeshi.”
- source_word: וַיַּדְבִּיקוּ אַחֲרָיו
  choice: wakawafuatilia
  rationale: Hifili ya דבק katika muktadha huu ni kufuata kwa karibu katika harakati za kuwakamata. “Wakawafuatilia” ni ya kawaida na haiongezi kiwango cha nguvu kisichosemwa wazi.
- source_word: עַד גִּדְעֹם
  choice: mpaka Gidomu
  rationale: עַד huonyesha mwisho wa eneo la ufuatiliaji; jina גִּדְעֹם limetoholewa kuwa “Gidomu.”
- source_word: וַיַּכּוּ מִמֶּנּוּ
  choice: wakawaua wanaume elfu mbili miongoni mwao
  rationale: נכה katika vita ni kupiga hata kuua, na מִמֶּנּוּ ina maana ya sehemu ya kundi hilo. “Miongoni mwao” huonyesha maana hiyo ya sehemu kwa Kiswahili sanifu.
