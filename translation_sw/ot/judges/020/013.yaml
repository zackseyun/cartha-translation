  text: וְ/עַתָּ֡ה תְּנוּ֩ אֶת הָ/אֲנָשִׁ֨ים בְּנֵֽי בְלִיַּ֜עַל אֲשֶׁ֤ר בַּ/גִּבְעָה֙ וּ/נְמִיתֵ֔/ם וּ/נְבַעֲרָ֥ה רָעָ֖ה מִ/יִּשְׂרָאֵ֑ל וְ/לֹ֤א אָבוּ֙ בִּנְיָמִ֔ן לִ/שְׁמֹ֕עַ בְּ/ק֖וֹל אֲחֵי/הֶ֥ם בְּנֵֽי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/013.yaml
  text: Hand over the men[a], the sons of worthlessness, who are in Gibeah, so that we may put them to death and purge evil from Israel. But Benjamin was not willing to listen to the voice of their brothers[c][b], the sons of Israel.
translation:
  language: sw
  text: Na sasa, tukabidhini wanaume waovu[a] walioko Gibea, ili tuwaue na kuondoa uovu katika Israeli. Lakini Wabenyamini hawakutaka kuisikiliza sauti ya ndugu zao[b], wana wa Israeli.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “wana wa kutofaa”; pia inaweza kutafsiriwa “wanaume wasiofaa.” Kimapokeo, “wana wa Beliali.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “kuisikiliza sauti ya,” nahau inayoweza pia kumaanisha “kutii” au “kuzingatia.”
    reason: lexical_alternative
  - marker: c
    text: Au “Waisraeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Kiebrania kina kiunganishi וְ pamoja na עַתָּה, ‘sasa.’ ‘Basi sasa’ linaendeleza hoja na pia kuhifadhi maana ya wakati iliyo wazi katika matini chanzi.
- source_word: תְּנוּ
  choice: tukabidhini
  rationale: Katika muktadha huu wa hukumu, amri inataka wahalifu wakabidhiwe kwa kusudi la kuadhibiwa; ‘tukabidhini’ ni Kiswahili cha kawaida chenye nguvu hiyo.
- source_word: הָאֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: wanaume waovu
  rationale: הָאֲנָשִׁים ni wanaume, na nahau בְּנֵי בְלִיַּעַל inawatambulisha kuwa watu wasiofaa kiadili. ‘Wanaume waovu’ ni ya wazi na ya asili, huku tanbihi ikihifadhi muundo halisi na mapokeo ya ‘Beliali.’
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: walioko Gibea
  rationale: Kishazi hiki kinawatambulisha wanaume hao kwa mahali walipo, yaani katika mji wa Gibea.
- source_word: וּנְמִיתֵם
  choice: ili tuwaue
  rationale: Kohotativi inaeleza kusudi linalofuata kukabidhiwa kwao. Katika muktadha huu ni kuwaua kama adhabu ya kijamii; tafsiri haiongezi maelezo yasiyokuwapo katika Kiebrania.
- source_word: וּנְבַעֲרָה רָעָה מִיִּשְׂרָאֵל
  choice: na kuondoa uovu katika Israeli
  rationale: בער katika kauli hii ya kisheria ina maana ya kuondoa au kutokomeza uovu kutoka katikati ya jumuiya. ‘Kuondoa uovu’ ni wazi na hakiongezi kibainishi ambacho hakipo.
- source_word: וְלֹא אָבוּ בִנְיָמִן
  choice: Lakini Wabenyamini hawakutaka
  rationale: Jina la kabila la umoja linawakilisha watu wake kwa pamoja. Kiswahili hutumia ‘Wabenyamini’ kwa asili, na אָבוּ inaonyesha kutotaka au kutokubali.
- source_word: לִשְׁמֹעַ בְּקוֹל
  choice: kuisikiliza sauti ya
  rationale: Huhifadhi taswira ya nahau ya Kiebrania, ambayo katika muktadha inaweza pia kumaanisha kutii au kuzingatia.
- source_word: אֲחֵיהֶם בְּנֵי יִשְׂרָאֵל
  choice: ndugu zao, wana wa Israeli
  rationale: Huhifadhi lugha ya kindugu na kirai cha ufafanuzi ‘wana wa Israeli,’ ambacho kinatambulisha ndugu hao.
theological_decisions:
- issue: Maana ya בְּנֵי בְלִיַּעַל
  choice: wanaume waovu
  alternative: wana wa kutofaa; wana wa Beliali
  rationale: Katika muktadha huu kirai ni sifa ya ubaya wa kimaadili, si lazima jina la kiumbe binafsi wa kiroho. Tafsiri kuu inaeleweka kwa msomaji wa sasa, na tanbihi inadumisha umbo la Kiebrania na tafsiri ya kimapokeo bila kuingiza wazo la baadaye kimya kimya.
- issue: Nguvu ya kimahakama ya וּנְמִיתֵם וּנְבַעֲרָה
  choice: ili tuwaue na kuondoa uovu katika Israeli
  alternative: ili tuwaondoe uhai na kutakasa Israeli na uovu
  rationale: Chaguo hili linaonyesha kusudi la hukumu na kuondolewa kwa uovu katika jumuiya bila kuongeza lugha ya kidhehebu au kufafanua zaidi ya chanzo.
- issue: Nahau לִשְׁמֹעַ בְּקוֹל
  choice: kuisikiliza sauti ya
  alternative: kuwatii; kuwasikiliza
  rationale: Muundo halisi unabaki katika matini ili kuhifadhi mvutano kati ya kusikia, kuzingatia, na kutii; tanbihi inaeleza upana huo wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Basi sasa’ linahifadhi וְעַתָּה ya matini ya WLC, tofauti na safu ya Kiingereza iliyoondoa ‘Now.’ ‘Wabenyamini’ limetumiwa kwa maana ya kabila kwa pamoja; ‘wana wa Israeli’ limehifadhiwa kama lugha rasmi ya kindugu, huku ‘Waisraeli’ likitolewa katika tanbihi.
