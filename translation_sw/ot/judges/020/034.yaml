  text: וַ/יָּבֹאוּ֩ מִ/נֶּ֨גֶד לַ/גִּבְעָ֜ה עֲשֶׂרֶת֩ אֲלָפִ֨ים אִ֤ישׁ בָּחוּר֙ מִ/כָּל יִשְׂרָאֵ֔ל וְ/הַ/מִּלְחָמָ֖ה כָּבֵ֑דָה וְ/הֵם֙ לֹ֣א יָדְע֔וּ כִּֽי נֹגַ֥עַת עֲלֵי/הֶ֖ם הָ/רָעָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/034.yaml
  text: Then ten thousand chosen men from all Israel came against Gibeah[a], and the battle was fierce; but they did not know that disaster was closing in on them.
translation:
  language: sw
  text: Ndipo wanaume elfu kumi waliochaguliwa kutoka Israeli yote wakaja dhidi ya Gibea, na vita vilikuwa vikali; lakini Wabenyamini hawakujua kwamba maafa yalikuwa yanawakaribia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwamba maafa yalikuwa yakiwafikia.” Kiebrania husema kihalisi, “kwamba maafa yalikuwa yakiwagusa/yakiwafikia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֶּגֶד לַגִּבְעָה
  choice: wakaja kuishambulia Gibea
  rationale: Ingawa kirai hiki kimsingi kinaweza kumaanisha kuja mbele ya au kuelekeana na Gibea, muktadha wa vita unaonyesha kusonga dhidi yake; tafsiri hii ni ya kawaida na wazi kwa Kiswahili.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ בָּחוּר
  choice: watu elfu kumi waliochaguliwa
  rationale: בָּחוּר hapa inaeleza askari walioteuliwa au walio bora, si lazima vijana tu; 'waliochaguliwa' inadumisha maana hiyo.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: kutoka Israeli yote
  rationale: Inaonyesha kwamba watu hao walitolewa katika Israeli kwa ujumla.
- source_word: וְהַמִּלְחָמָה כָּבֵדָה
  choice: na vita vilikuwa vikali
  rationale: כָּבֵדָה katika muktadha huu huonyesha uzito na ukali wa mapigano, si uzito wa kimwili.
- source_word: וְהֵם לֹא יָדְעוּ
  choice: lakini Wabenyamini hawakujua
  rationale: Kiwakilishi 'wao' kinawahusu Wabenyamini katika muktadha wa karibu; kutaja jina lao huondoa utata usio wa lazima katika Kiswahili. 'Lakini' huonyesha utofauti kati ya mapigano makali na kutotambua kwao maafa yaliyokaribia.
- source_word: כִּי נֹגַעַת עֲלֵיהֶם הָרָעָה
  choice: kwamba maafa yalikuwa yakiwafikia
  rationale: נגע maana yake ya msingi ni 'kugusa/kufikia,' na הָרָעָה hapa ni janga au maafa, si uovu wa kimaadili. 'Yalikuwa yakiwafikia' huhifadhi picha ya maafa yaliyokuwa yanawajia bila kuifanya kuwa ya kifasili kupita kiasi.
