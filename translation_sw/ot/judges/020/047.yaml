  text: וַ/יִּפְנ֞וּ וַ/יָּנֻ֤סוּ הַ/מִּדְבָּ֨רָ/ה֙ אֶל סֶ֣לַע הָֽ/רִמּ֔וֹן שֵׁ֥שׁ מֵא֖וֹת אִ֑ישׁ וַ/יֵּֽשְׁבוּ֙ בְּ/סֶ֣לַע רִמּ֔וֹן אַרְבָּעָ֖ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/047.yaml
  text: But six hundred men turned and fled toward the wilderness[a], to the rock of Rimmon[b], and stayed at the rock of Rimmon four months.
translation:
  language: sw
  text: Lakini wanaume mia sita waligeuka na kukimbilia upande wa nyika[a], hadi kwenye Mwamba wa Rimoni[b], wakakaa kwenye Mwamba wa Rimoni kwa miezi minne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndani ya nyika.” Muundo wa Kiebrania unaoonyesha mwelekeo unaweza kumaanisha kuelekea eneo la nyika au kuingia ndani yake.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania “mwamba wa Rimoni”; pia inaweza kutafsiriwa “Mwamba wa Rimoni” kama jina la mahali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: waligeuka
  rationale: Kitenzi kinaonyesha kubadili mwelekeo; “waligeuka” ni cha asili katika simulizi na kinaunganika vizuri na tendo la kukimbia.
- source_word: וַיָּנֻסוּ
  choice: kukimbilia
  rationale: נוּס humaanisha kukimbia ili kujiokoa. “Kukimbilia” huhifadhi dharura ya muktadha wa vita na huonyesha mwendo kuelekea mahali pa usalama.
- source_word: הַמִּדְבָּרָה
  choice: upande wa nyika
  rationale: Kiishio cha mwelekeo kinaweza kumaanisha kuelekea au kuingia katika eneo la nyika. “Upande wa nyika” huhifadhi uwezekano huo bila kuamua kupita kiasi.
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: hadi kwenye Mwamba wa Rimoni
  rationale: סֶלַע ni mwamba au jabali na hapa ni sehemu ya jina la mahali. “Mwamba wa Rimoni” huhifadhi muundo wa Kiebrania, huku “hadi kwenye” ikionyesha mwisho maalumu wa safari.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: wanaume mia sita
  rationale: אִישׁ baada ya namba huhesabu wanaume; muktadha ni wa wapiganaji na waathirika wa vita.
- source_word: וַיֵּשְׁבוּ
  choice: wakakaa
  rationale: ישׁב inaweza kumaanisha kukaa, kuishi, au kubaki. “Wakakaa” inafaa kwa makazi ya muda yaliyoainishwa kuwa miezi minne.
- source_word: בְּסֶלַע רִמּוֹן
  choice: kwenye Mwamba wa Rimoni
  rationale: בְּ hapa huonyesha mahali walipokaa. “Kwenye” ni Kiswahili cha kawaida kwa kukaa katika eneo la ngome au mwamba wenye jina.
- source_word: אַרְבָּעָה חֳדָשִׁים
  choice: kwa miezi minne
  rationale: Ni usemi wa moja kwa moja wa muda; “kwa” huonyesha kipindi walichokaa huko.
- source_word: וַ
  choice: Lakini
  rationale: 'Ingawa waw ni kiunganishi cha kawaida cha simulizi, “Lakini” huonyesha kwa kawaida utofauti na maangamizi yaliyotangulia: hawa mia sita ndio walionusurika.'
