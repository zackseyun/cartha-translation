  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּקֻ֜מוּ וַ/יַּעֲל֣וּ בֵֽית אֵל֮ וַ/יִּשְׁאֲל֣וּ בֵ/אלֹהִים֒ וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ֚י יַעֲלֶה לָּ֣/נוּ בַ/תְּחִלָּ֔ה לַ/מִּלְחָמָ֖ה עִם בְּנֵ֣י בִנְיָמִ֑ן וַ/יֹּ֥אמֶר יְהוָ֖ה יְהוּדָ֥ה בַ/תְּחִלָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/018.yaml
  text: Then they arose and went up to Bethel[a], and they inquired of God. The sons of Israel said, “Who will go up first for us to the battle against the sons of Benjamin?” And Yahweh said[c][b], “Judah first.”
translation:
  language: sw
  text: Kisha wakainuka, wakapanda kwenda Betheli, wakamuuliza Mungu. Wana wa Israeli[a] wakasema, “Ni nani atakayepanda kwanza kwa niaba yetu kwenda vitani dhidi ya wana wa Benyamini[b]?” Yahwe akasema, “Yuda kwanza.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania ni “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “pamoja na wana wa Benyamini”; katika muktadha huu maana yake ni kupigana nao.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: wakainuka
  rationale: Kitenzi קום katika mfululizo wa simulizi kinaonyesha kitendo kilichofuata; “wakainuka” kinahifadhi mwendo huo wa simulizi kwa Kiswahili cha kawaida.
- source_word: וַיַּעֲלוּ
  choice: wakapanda kwenda
  rationale: עלה humaanisha “kupanda/kwenda juu,” hasa katika safari ya kuelekea mahali au patakatifu. “Wakapanda kwenda” kinahifadhi wazo la kupanda na pia kinasikika kwa kawaida katika simulizi.
- source_word: בֵית אֵל
  choice: Betheli
  rationale: Jina la mahali limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: וַיִּשְׁאֲלוּ בֵאלֹהִים
  choice: wakamwuliza Mungu
  rationale: שׁאל ב־ hapa ni kumwendea Mungu ili kupata mwongozo. “Wakamwuliza Mungu” ni wazi na ya kawaida bila kuongeza namna ya mawasiliano ambayo maandishi hayataji.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Tafsiri hii inadumisha usemi wa ukoo wa Kiebrania, “wana wa Israeli,” badala ya kuufanya tu jina la taifa.
- source_word: מִי יַעֲלֶה לָּנוּ בַתְּחִלָּה
  choice: Ni nani atakayepanda kwanza kwa ajili yetu
  rationale: Inahifadhi kitenzi cha umoja, wazo la kupanda, לָנוּ (“kwa ajili yetu”), na mpangilio unaoonyeshwa na בַתְּחִלָּה (“kwanza”).
- source_word: לַמִּלְחָמָה
  choice: kwenda vitani
  rationale: Katika muktadha huu, usemi unamaanisha kuingia katika mapigano; “kwenda vitani” ni Kiswahili cha asili na sahihi.
- source_word: עִם בְּנֵי בִנְיָמִן
  choice: dhidi ya wana wa Benyamini
  rationale: Ingawa עִם kwa kawaida ni “pamoja na,” katika muktadha wa vita inaonyesha kupambana na upande mwingine. “Dhidi ya” hufanya uhusiano huo uwe wazi.
- source_word: וַיֹּאמֶר יְהוָה
  choice: Yahwe akasema
  rationale: Jina la agano יְהוָה limetoholewa moja kwa moja kama “Yahwe,” bila kulibadilisha kuwa cheo.
- source_word: יְהוּדָה בַתְּחִלָּה
  choice: Yuda kwanza
  rationale: Jibu la Kiebrania ni fupi na limeacha kitenzi kinachoeleweka kutokana na swali; “Yuda kwanza” kinadumisha ufupi huo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina maalumu la Mungu, si cheo. “Yahwe” linahifadhi jina hilo moja kwa moja.
- issue: Utambulisho wa pamoja בְּנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  alternative: Waisraeli
  rationale: “Wana wa Israeli” linahifadhi taswira ya asili ya ukoo na hali ya kundi zima bila kuamua zaidi ya maandishi.
- issue: Maana ya עִם katika muktadha wa vita
  choice: dhidi ya
  alternative: pamoja na
  rationale: Kihusishi kinaweza kumaanisha “pamoja na,” lakini katika swali kuhusu vita na Benyamini uhusiano unaokusudiwa ni wa kupambana nao. Tanbihi inadumisha uwazi wa umbo la Kiebrania.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo mfupi wa jibu “Yuda kwanza” umehifadhiwa, na majina yametolewa kwa maumbo yaliyozoeleka ya Kiswahili: Betheli, Benyamini, Yuda, na Yahwe.'
