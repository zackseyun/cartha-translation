  source_fidelity: 'Msingi wa tafsiri unafuata Kiebrania kwa uaminifu: wana wa Israeli wanalia mbele ya Yahwe, swali linahifadhi nafsi ya kwanza umoja katika הַאוֹסִיף na אָחִי, na jibu lina amri ya wingi pamoja na kiwakilishi cha umoja (''kwake''). Hata hivyo, ''kukaribia kupigana na'' si mtiririko wa kawaida wa Kiswahili na linaweza kusikika kana kwamba kukaribia ndiko kunakopiganwa. ''Kukaribia vitani dhidi ya'' huonyesha vyema lengo la לָגֶשֶׁת לַמִּלְחָמָה na uhasama unaoeleweka katika muktadha wa עִם.'
