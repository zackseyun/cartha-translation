  text: וַ/יַּעֲל֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יִּבְכּ֣וּ לִ/פְנֵֽי יְהוָה֮ עַד הָ/עֶרֶב֒ וַ/יִּשְׁאֲל֤וּ בַֽ/יהוָה֙ לֵ/אמֹ֔ר הַ/אוֹסִ֗יף לָ/גֶ֨שֶׁת֙ לַ/מִּלְחָמָ֔ה עִם בְּנֵ֥י בִנְיָמִ֖ן אָחִ֑/י וַ/יֹּ֥אמֶר יְהוָ֖ה עֲל֥וּ אֵלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/023.yaml
  text: Then the sons of Israel went up and wept before Yahweh until evening[a], and they inquired of Yahweh, saying, “Shall I continue to go near for battle with the sons of Benjamin, my brother?” And Yahweh said, “Go up against him.”
translation:
  language: sw
  text: Ndipo wana wa Israeli wakapanda, wakalia mbele za Yahwe mpaka jioni, wakamuuliza Yahwe wakisema, “Je, niendelee[a] kukaribia vitani dhidi ya wana wa Benyamini, ndugu yangu?” Yahwe akasema, “Pandeni mkamkabili.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, niende tena kukaribia vitani dhidi ya wana wa Benyamini, ndugu yangu?” Kiebrania kinaweza kumaanisha kuendelea na shambulio au kulirudia; pia עִם, kwa kawaida “na,” inaweza katika muktadha huu wa vita kueleweka kuwa “dhidi ya.”
    reason: Huhifadhi uwezekano wa kimsamiati wa הַאוֹסִיף na maana ya kivita ya עִם.
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: wakapanda
  rationale: Kitenzi hiki huhifadhi maana ya kwenda juu, huenda kuelekea mahali patakatifu au mahali palipoinuka, bila kutaja wazi mahali ambapo Kiebrania hakupataji.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi wa kifamilia na wa kijumuiya wa Kiebrania kwa Kiswahili cha kawaida cha Biblia.
- source_word: וַיִּבְכּוּ
  choice: kulia
  rationale: Neno hili linaonyesha kilio cha huzuni mbele za Mungu.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Ni usemi wa asili na wenye heshima kwa kuwa katika uwepo wa Yahwe.
- source_word: וַיִּשְׁאֲלוּ בַיהוָה
  choice: wakamwuliza Yahwe
  rationale: Katika muktadha huu ni kumwendea Mungu ili kupata jibu au mwongozo; Kiswahili hiki ni cha kawaida bila kupoteza maana hiyo.
- source_word: הַאוֹסִיף
  choice: niendelee
  rationale: Hiphil ya יסף inaweza kuonyesha kuendelea au kufanya tena. Maandishi makuu yanatumia ‘niendelee,’ na uwezekano wa ‘tena’ umehifadhiwa katika tanbihi.
- source_word: לָגֶשֶׁת לַמִּלְחָמָה
  choice: kukaribia kupigana
  rationale: Huhifadhi picha ya kusogea karibu kwa kusudi la vita, huku ikisikika kwa kawaida katika Kiswahili.
- source_word: עִם בְּנֵי בִנְיָמִן
  choice: na wana wa Benyamini
  rationale: ‘Na’ inalingana na עִם, na katika usemi ‘kupigana na’ huonyesha wazi upinzani wa kivita.
- source_word: אָחִי
  choice: ndugu yangu
  rationale: Umoja na nafsi ya kwanza zimehifadhiwa, zikionyesha kwamba Israeli anamwona Benyamini kuwa ndugu yake.
- source_word: עֲלוּ אֵלָיו
  choice: Pandeni mkamkabili
  rationale: ‘Pandeni’ huhifadhi mwelekeo wa עלה, na ‘mkamkabili’ huwasilisha kwa kawaida maana ya kuelekea kwake kama adui katika muktadha wa vita.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; ‘Yahwe’ hulitambulisha kama jina badala ya kulibadili kuwa cheo.
- issue: Umoja wa msemaji katika הַאוֹסִיף na אָחִי baada ya kundi la Israeli
  choice: “niendelee” na “ndugu yangu”
  alternative: “tuendelee” na “ndugu yetu”
  rationale: Kiebrania hubadilika kutoka kundi la wana wa Israeli hadi nafsi ya kwanza umoja, likiwakilisha Israeli kwa sauti ya pamoja kama mtu mmoja. Mvutano huo umehifadhiwa badala ya kusawazishwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi umetiririshwa kwa viunganishi vya ‘waka-’; usemi wa kifamilia ‘wana wa Israeli’ na mabadiliko ya makusudi kwenda nafsi ya kwanza umoja yamehifadhiwa.
