  text: וַ/יֵּצְא֥וּ בְנֵֽי בִנְיָמִ֖ן מִן הַ/גִּבְעָ֑ה וַ/יַּשְׁחִ֨יתוּ בְ/יִשְׂרָאֵ֜ל בַּ/יּ֣וֹם הַ/ה֗וּא שְׁנַ֨יִם וְ/עֶשְׂרִ֥ים אֶ֛לֶף אִ֖ישׁ אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/021.yaml
  text: Then the sons of Benjamin came out from Gibeah and struck down twenty-two thousand men of Israel that day[a].
translation:
  language: sw
  text: Ndipo wana wa Benyamini wakatoka Gibea na kuwaua wanaume elfu ishirini na mbili wa Israeli siku hiyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakaangusha chini wanaume elfu ishirini na mbili wa Israeli siku hiyo.”
    reason: Huhifadhi kwa uwazi zaidi taswira ya Kiebrania אָרְצָה, “kuelekea ardhini/chini,” pamoja na maana ya kijeshi ya וַיַּשְׁחִיתוּ.
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: wakatoka
  rationale: Kitenzi hiki kinaendeleza mfululizo wa simulizi na kinaonyesha kutoka mjini kwenda vitani; “wakatoka” ni cha kawaida na sahihi katika Kiswahili.
- source_word: בְנֵי בִנְיָמִן
  choice: wana wa Benyamini
  rationale: Huhifadhi usemi wa ukoo wa Kiebrania na utambulisho wa kabila bila kuufanya kuwa mgumu kueleweka.
- source_word: מִן הַגִּבְעָה
  choice: Gibea
  rationale: Kwa kuambatana na “wakatoka,” jina la mahali pekee linaeleza kwa kawaida mahali walikotoka; maana kamili ni “wakatoka Gibea.”
- source_word: וַיַּשְׁחִיתוּ
  choice: kuwaua
  rationale: Katika muktadha wa vita na hesabu ya walioanguka, Hiphil ya שׁחת inaonyesha kuangamiza kwa kuua. “Kuwaua” ni wazi na ya kawaida.
- source_word: בְיִשְׂרָאֵל
  choice: wa Israeli
  rationale: 'Muundo huu unaunganisha waliouawa na Israeli kwa Kiswahili cha kawaida: “wanaume ... wa Israeli.”'
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kiashirio cha wakati.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף
  choice: elfu ishirini na mbili
  rationale: Huu ndio mpangilio wa kawaida wa namba hiyo katika Kiswahili sanifu.
- source_word: אִישׁ
  choice: wanaume
  rationale: Nomino hiyo baada ya idadi inarejelea watu wa kiume; muktadha unaonyesha wapiganaji, lakini “askari” lingeongeza jambo lisilotajwa wazi.
- source_word: אָרְצָה
  choice: kuwaua
  rationale: Kielekezo “chini/ardhini” ni sehemu ya taswira ya kuwaangusha vitani. Katika Kiswahili, maana ya matokeo ya kifo imeingizwa kwa kawaida katika “kuwaua,” huku taswira halisi ikihifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. “Wana wa Benyamini” huhifadhi muundo wa ukoo wa chanzo; “kuwaua” hutoa maana ya wazi ya muktadha wa vita, na tanbihi huhifadhi taswira ya kuwaangusha chini.
