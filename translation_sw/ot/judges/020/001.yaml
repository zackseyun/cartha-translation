source:
  edition: WLC
  text: וַ/יֵּצְאוּ֮ כָּל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/תִּקָּהֵ֨ל הָ/עֵדָ֜ה כְּ/אִ֣ישׁ אֶחָ֗ד לְ/מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע וְ/אֶ֖רֶץ הַ/גִּלְעָ֑ד אֶל יְהוָ֖ה הַ/מִּצְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/001.yaml
  text: Then all the sons of Israel came out[a], and the congregation assembled as one man, from Dan to Beer-sheba, and from the land of Gilead[c][b], to Yahweh at Mizpah.
translation:
  language: sw
  text: Ndipo wana wote wa Israeli wakatoka[a], na kusanyiko likakusanyika kama mtu mmoja[b], kutoka Dani mpaka Beer-sheba, na kutoka nchi ya Gileadi, mbele za Yahweh huko Mispa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wana wa Israeli” ni tafsiri ya karibu ya usemi wa Kiebrania unaowataja watu wa Israeli kwa pamoja, si wanaume peke yao.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kama mtu mmoja,” yaani, wakiwa na nia moja na wakitenda kwa umoja.'
    reason: lexical_alternative
  - marker: c
    text: Kwa karibu, “kwa Yahweh huko Mispa.” Maneno ya Kiebrania yanaweza kueleweka kuwa kusanyiko lilikusanyika katika uwepo wa Yahweh huko Mispa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: wakatoka
  rationale: Kitenzi יצא humaanisha kutoka; hapa “wakatoka” ni cha kawaida katika simulizi na hakilazimishi mwelekeo usioelezwa.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: wana wote wa Israeli
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania “wana wa Israeli,” unaowakilisha watu wa Israeli kwa pamoja.
- source_word: וַתִּקָּהֵל הָעֵדָה
  choice: kusanyiko likakusanyika
  rationale: Huhifadhi uhusiano wa kimsamiati kati ya tendo la kukusanyika na jumuiya iliyokusanyika, kwa lugha inayoeleweka.
- source_word: כְּאִישׁ אֶחָד
  choice: kama mtu mmoja
  rationale: Huhifadhi nahau ya Kiebrania inayoonyesha umoja katika nia na tendo.
- source_word: לְמִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: kutoka Dani mpaka Beer-sheba
  rationale: Ni uwasilishaji wa kawaida wa wigo wa kijiografia unaotajwa katika Kiebrania.
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: pamoja na nchi ya Gileadi
  rationale: Kiswahili hiki kinaonyesha wazi kuwa eneo la Gileadi, lililo ng’ambo ya Yordani, pia liliwakilishwa bila kuongeza kihusishi kisichopo wazi katika Kiebrania.
- source_word: אֶל יְהוָה
  choice: kwa Yahweh
  rationale: “Kwa” huhifadhi mwelekeo wa אֶל na pia mwangwi wa kukusanyika kwake; jina la agano יְהוָה limetoholewa kuwa “Yahweh.”
- source_word: הַמִּצְפָּה
  choice: huko Mispa
  rationale: Jina la mahali limetoholewa kwa namna ya kawaida ya Kiswahili; “huko” linaonyesha mahali pa kusanyiko bila kufuta uhusiano wake na Yahweh.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko linatumia moja kwa moja jina la agano; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Lugha ya kiume yenye maana ya kijumuiya katika בְּנֵי יִשְׂרָאֵל na כְּאִישׁ אֶחָד
  choice: wana wote wa Israeli; kama mtu mmoja
  alternative: Waisraeli wote; kwa umoja
  rationale: Uwasilishaji mkuu huhifadhi sura ya misemo ya Kiebrania, huku tanbihi zikifafanua kuwa ni lugha ya kijumuiya na nahau ya umoja.
- issue: Uhusiano wa אֶל יְהוָה הַמִּצְפָּה
  choice: kwa Yahweh huko Mispa
  alternative: mbele za Yahweh huko Mispa
  rationale: Muundo wa Kiebrania unaweza kueleweka kama kuelekea kwa Yahweh au kukusanyika mbele zake. Tafsiri kuu huhifadhi zaidi kihusishi אֶל, na tanbihi inaonyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina Dani, Beer-sheba, Gileadi, Yahweh, na Mispa yametoholewa kwa matumizi ya kawaida ya Kibiblia; utata wa kishazi cha mwisho umehifadhiwa kwa tanbihi.
