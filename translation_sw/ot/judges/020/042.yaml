base_translation:
  language: en
  yaml_path: translation/ot/judges/020/042.yaml
  text: So they turned before the men of Israel toward the way of the wilderness[a], but the battle overtook them[c][b]; and those from the cities were destroying them in their midst.
translation:
  language: sw
  text: Basi wakageuka kutoka mbele ya wanaume wa Israeli kuelekea njia ya jangwani[a], lakini vita vikawafikia[b]; nao wale waliotoka mijini wakawaangamiza katikati yao[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mbele ya wanaume wa Israeli”; usemi huu unaweza pia kueleweka kiidiomu kama “kutoka mbele ya wanaume wa Israeli,” yaani, wakijiondoa mbele yao.'
    reason: lexical_alternative
  - marker: b
    text: Au “vita viliwakuta.”
    reason: lexical_alternative
  - marker: c
    text: Kifungu cha mwisho katika Kiebrania kimebanwa na ni kigumu kueleweka. Huenda kinarejelea vikosi vya Israeli vilivyotoka mijini au katika maficho na kuwaangamiza watu wa Benyamini kutoka katikati ya safu zao.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: wakageuka
  rationale: Kitenzi פנה kimsingi humaanisha kugeuka. Katika muktadha huu kinaashiria kurudi nyuma au kukimbia, lakini ‘wakageuka’ inahifadhi taswira ya Kiebrania bila kuifafanua kupita kiasi.
- source_word: לִפְנֵי אִישׁ יִשְׂרָאֵל
  choice: mbele ya wanaume wa Israeli
  rationale: Hii inafuata kwa karibu usemi wa Kiebrania na inadumisha maana ya wanaume waliokuwa vitani; kimuktadha inaweza pia kumaanisha kuondoka mbele yao.
- source_word: אֶל דֶּרֶךְ הַמִּדְבָּר
  choice: kuelekea njia ya jangwani
  rationale: ‘Njia ya jangwani’ ni Kiswahili cha kawaida kinachohifadhi uhusiano wa maneno דרך המדבר na mwelekeo wa harakati.
- source_word: וְהַמִּלְחָמָה הִדְבִּיקָתְהוּ
  choice: lakini mapigano yakawafikia
  rationale: Hifil ya דבק hapa ina maana ya kufikia baada ya kuwafuatia. ‘Mapigano’ hutenda kama kiima kama ilivyo katika Kiebrania, huku kiwakilishi cha wingi kikirejelea kikosi cha Benyamini.
- source_word: וַאֲשֶׁר מֵהֶעָרִים
  choice: nao wale waliotoka mijini
  rationale: Ujenzi huu umebanwa na si wazi kabisa. Tafsiri hii inadumisha rejeo la watu waliotoka mijini bila kuamua wazi kuwa walikuwa wametoka katika maficho.
- source_word: מַשְׁחִיתִים
  choice: walikuwa wakiwaangamiza
  rationale: Katika muktadha wa vita, שחת inaeleza kuua kwa kuharibu. ‘Wakiwaangamiza’ inahifadhi nguvu na maana ya msingi ya neno.
- source_word: אוֹתוֹ
  choice: wao
  rationale: Kiwakilishi cha Kiebrania ni umoja lakini kinamrejelea Benyamini au jeshi lake kama kundi; Kiswahili hutumia wingi kwa uwazi wa kawaida.
- source_word: בְּתוֹכוֹ
  choice: katikati yao
  rationale: Kiambishi cha umoja katika Kiebrania ni cha kundi zima. ‘Katikati yao’ kinaonyesha washambuliaji wakifanya uharibifu ndani au katikati ya safu zao.
