base_translation:
  language: en
  yaml_path: translation/ot/judges/020/046.yaml
  text: So all who fell from Benjamin that day were twenty-five thousand men who drew the sword[a]; all these were men of valor.
translation:
  language: sw
  text: Basi, watu wote wa Benyamini walioanguka siku hiyo walikuwa wanaume elfu ishirini na tano waliouchomoa upanga[a]; wote hao walikuwa wanaume mashujaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokuwa na upanga.”
    reason: Mbadala wa kileksia kwa nahau ya kijeshi שֹׁלֵף חֶרֶב; maandishi makuu yanahifadhi taswira ya kuchomoa upanga.
lexical_decisions:
- source_word: וַיְהִי
  choice: Basi, ... walikuwa
  rationale: Muundo huu unatoa muhtasari wa simulizi linaloendelea; “Basi” huonyesha mwendelezo na matokeo kwa Kiswahili cha kawaida.
- source_word: כָל הַנֹּפְלִים
  choice: watu wote ... walioanguka
  rationale: Kitenzi-shirikishi hapa kinawataja waliouawa vitani. “Walioanguka” huhifadhi taswira ya Kiebrania na inaeleweka katika muktadha wa vita.
- source_word: מִבִּנְיָמִן
  choice: wa Benyamini
  rationale: Ingawa מן kimsingi huonyesha kutoka, hapa inatambulisha wale waliokuwa wa kabila la Benyamini; “wa Benyamini” ni Kiswahili cha asili na sahihi.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף אִישׁ
  choice: wanaume elfu ishirini na tano
  rationale: Huhifadhi idadi na neno איש bila kuongeza moja kwa moja “askari,” ambalo halipo katika kirai hiki.
- source_word: שֹׁלֵף חֶרֶב
  choice: waliouchomoa upanga
  rationale: Huhifadhi taswira ya kuchomoa upanga na wakati huohuo huonyesha kuwa walikuwa wapiganaji wenye silaha.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Ni usemi wa kawaida na sahihi wa wakati katika Kiswahili.
- source_word: אֵת כָּל אֵלֶּה
  choice: wote hao
  rationale: Huhifadhi urejelezaji wenye msisitizo kwa jumla ya watu waliotajwa.
- source_word: אַנְשֵׁי חָיִל
  choice: watu hodari vitani
  rationale: חַיִל hapa ina maana ya uwezo na ushujaa wa kijeshi. “Watu hodari vitani” ni wazi, ya sasa, na haipunguzi maana kuwa nguvu za mwili pekee.
