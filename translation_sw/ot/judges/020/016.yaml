  yaml_path: translation/ot/judges/020/016.yaml
  text: From all this people[a], seven hundred chosen men were left-handed; every one of these could sling a stone at a hair and not miss.
translation:
  language: sw
  text: Miongoni mwa watu hawa wote, kulikuwa na wanaume mia saba waliochaguliwa waliotumia mkono wa kushoto[a]. Kila mmoja wao aliweza kurusha jiwe kwa kombeo akilenga unywele bila kukosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “ambao mkono wao wa kuume ulikuwa umezuiwa,” yaelekea ikimaanisha kwamba walipigana kwa mkono wa kushoto.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הָעָם הַזֶּה
  choice: Miongoni mwa watu hawa wote
  rationale: Kirai hiki kina maana ya kuchagua sehemu kutoka katika kundi zima. “Watu” huhifadhi upana wa עָם bila kuongeza waziwazi maana ya “wanajeshi,” ingawa muktadha ni wa kivita.
- source_word: שְׁבַע מֵאוֹת אִישׁ בָּחוּר
  choice: wanaume mia saba waliochaguliwa
  rationale: אִישׁ ni neno la kuhesabia wanaume hapa, na בָּחוּר linaonyesha watu walioteuliwa au walio bora katika kundi.
- source_word: אִטֵּר יַד יְמִינוֹ
  choice: waliotumia mkono wa kushoto[a]
  rationale: 'Nahau ya Kiebrania inasema kihalisi kwamba mkono wa kuume ulikuwa umezuiwa au umedhoofishwa. Katika muktadha wa uwezo wa kupigana, Kiswahili cha kawaida na wazi kinaeleza maana inayodokezwa: walitumia mkono wa kushoto. Tanbihi huhifadhi umbo halisi na uwezekano wake.'
- source_word: כָּל זֶה
  choice: Kila mmoja wao
  rationale: Hutoa maana ya kugawa sifa kwa kila mmoja wa wale wanaume, si kwa kundi kwa ujumla tu.
- source_word: קֹלֵעַ בָּאֶבֶן
  choice: aliweza kuvurumisha jiwe kwa kombeo
  rationale: Kitenzi kishirikishi kinaeleza ustadi wao wa kawaida. “Kuvurumisha jiwe kwa kombeo” ni Kiswahili cha asili kinachoonyesha kifaa na tendo.
- source_word: אֶל הַשַּׂעֲרָה
  choice: kulenga unywele
  rationale: Huhifadhi picha halisi ya shabaha ndogo sana bila kuibadili kuwa maelezo mapana ya usahihi.
- source_word: וְלֹא יַחֲטִא
  choice: bila kukosa
  rationale: Katika muktadha huu חטא humaanisha kukosa shabaha, wala si kutenda dhambi.
