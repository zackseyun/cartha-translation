base_translation:
  language: en
  yaml_path: translation/ot/judges/020/033.yaml
  text: Then all the men of Israel rose from their place and drew up in battle formation at Baal-tamar[a], while the men lying in ambush of Israel rushed out from their place, from Maareh-geba.
translation:
  language: sw
  text: Ndipo wanaume wote wa Israeli wakainuka kutoka mahali pao na kujipanga kwa vita huko Baal-tamari, nao askari wa Israeli waliokuwa wamevizia wakatoka kwa kasi kutoka mahali pao, kutoka Maare-geba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania Maare-geba huenda ni jina la mahali, kama lilivyotafsiriwa hapa. Pia laweza kueleweka kuwa “uwanda wa Geba” au “sehemu ya wazi ya Geba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  choice: wanaume wote wa Israeli
  rationale: Ingawa אִישׁ iko katika umoja, pamoja na כֹל ina maana ya kijumla; katika muktadha huu wa kijeshi, “wanaume wote” ni Kiswahili cha asili na sahihi.
- source_word: קָמוּ מִמְּקוֹמוֹ
  choice: wakainuka kutoka mahali pao
  rationale: Kitenzi cha wingi kinatawala kiima cha kijumla, na kiambishi cha umoja katika Kiebrania kina maana ya mgawanyo; Kiswahili hutumia “mahali pao” kwa kundi hili.
- source_word: וַיַּעַרְכוּ
  choice: kujipanga kwa vita
  rationale: Katika simulizi la kijeshi, ערך hueleza kupanga vikosi tayari kwa mapigano; tafsiri hii inaweka wazi maana hiyo bila kuongeza wazo lisilokuwamo.
- source_word: בְּבַעַל תָּמָר
  choice: huko Baal-tamari
  rationale: Hili ni jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa; “huko” linaonyesha mahali kwa njia ya kawaida katika Kiswahili.
- source_word: אֹרֵב יִשְׂרָאֵל
  choice: askari wa Israeli waliokuwa wamevizia
  rationale: Kirai hiki kilichofupishwa kinarejelea kikosi cha Israeli kilichojificha kwa ajili ya kuvizia. “Askari wa Israeli” huepuka maana potovu kwamba Israeli ndiyo iliyoviziwa.
- source_word: מֵגִיחַ
  choice: wakatoka kwa kasi
  rationale: Umbo hili linaonyesha kutoka ghafla au kusonga kutoka mafichoni; “wakatoka kwa kasi” linafaa kwa muktadha wa kuvizia na mwendo wa simulizi.
- source_word: מִמְּקוֹמוֹ
  choice: kutoka mahali pao
  rationale: Kiambishi cha umoja katika chanzo kinaeleweka kwa maana ya kijumla kuhusu kikosi; wingi ni wa kawaida katika Kiswahili.
- source_word: מִמַּעֲרֵה גָבַע
  choice: kutoka Maare-geba
  rationale: Usemi huu ni mgumu na huenda ni jina la mahali. Kutoholewa katika matini kuu kunahifadhi kutokuwa na uhakika, huku maana nyingine zikitajwa katika tanbihi.
