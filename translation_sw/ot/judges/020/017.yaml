  yaml_path: translation/ot/judges/020/017.yaml
  text: And the men of Israel[a], apart from Benjamin, were mustered at four hundred thousand men drawing the sword[c][b]; all these were men of war.
translation:
  language: sw
  text: 'Nao wanaume wa Israeli, isipokuwa Benyamini[a], walihesabiwa[b]: wanaume laki nne wenye kuchomoa upanga[c]; hao wote walikuwa watu wa vita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila Benyamini”; watu wa kabila la Benyamini hawakujumuishwa katika jumla hii.
    reason: lexical_alternative
  - marker: b
    text: Au, “waliandikishwa kwa ajili ya vita”; kitenzi cha Kiebrania kinaweza kumaanisha kuhesabiwa au kuitwa/kuandikishwa kwa huduma ya kijeshi.
    reason: lexical_alternative
  - marker: c
    text: Kwa neno halisi, “kuchomoa upanga”; hii ni nahau ya Kiebrania inayomaanisha wapiganaji wenye silaha.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אִישׁ יִשְׂרָאֵל
  choice: Nao wanaume wa Israeli
  rationale: Ingawa אִישׁ iko katika umoja wa kisarufi, hapa inatumika kwa maana ya kundi pamoja na kitenzi cha wingi. “Wanaume wa Israeli” inadumisha maana ya wanaume waliokusanywa kwa vita.
- source_word: הִתְפָּקְדוּ
  choice: walikusanywa na kuhesabiwa
  rationale: Katika muktadha wa kijeshi, kitenzi hiki kinaweza kumaanisha kuhesabiwa au kuandikishwa na kukusanywa kwa ajili ya huduma ya kijeshi. Usemi huu wa Kiswahili unawakilisha pande zote mbili bila kulazimisha maana moja pekee.
- source_word: לְבַד מִבִּנְיָמִן
  choice: bila wale wa Benyamini
  rationale: Kirai hiki kinawatenga watu wa kabila la Benyamini na jumla inayotajwa. Kuongeza “wale wa” kunafanya rejeo kwa watu wa Benyamini liwe wazi katika Kiswahili.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף אִישׁ
  choice: wanaume laki nne
  rationale: Hili ni tamko la kawaida na lililo wazi la idadi hiyo katika Kiswahili, huku “wanaume” ikihifadhi אִישׁ na muktadha wa sensa ya kijeshi.
- source_word: שֹׁלֵף חָרֶב
  choice: wenye kuchomoa upanga
  rationale: Tafsiri hii inadumisha picha halisi ya Kiebrania ya kuchomoa upanga, huku tanbihi ikieleza kuwa ni nahau inayowataja wapiganaji wenye silaha.
- source_word: כָּל זֶה
  choice: hao wote
  rationale: Ingawa muundo wa Kiebrania ni wa umoja kwa nje, unarejelea kundi zima la wanaume waliotangulia kutajwa; “hao wote” ni Kiswahili cha kawaida na sahihi.
- source_word: אִישׁ מִלְחָמָה
  choice: wanaume wa vita
  rationale: Usemi huu unabaki karibu na nahau ya kijeshi ya Kiebrania na kudumisha rejeo lake kwa wanaume wapiganaji.
