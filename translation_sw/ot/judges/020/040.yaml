translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumia “akageuka” kwa mtiririko wa kawaida. “Benyamini” linawakilisha kabila kwa umoja kama katika Kiebrania. Alama zote za tanbihi zimewekwa mara moja katika matini kuu karibu na vifungu vinavyohusika.
