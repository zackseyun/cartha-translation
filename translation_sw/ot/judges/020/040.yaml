base_translation:
  language: en
  yaml_path: translation/ot/judges/020/040.yaml
  text: But the signal began to rise from the city as a pillar of smoke[a], and Benjamin turned behind him, and behold[c][b], the whole city was going up to the heavens.
translation:
  language: sw
  text: Lakini ishara ilianza kupanda kutoka mjini kama nguzo ya moshi[a]. Benyamini akageuka nyuma yake[b], na tazama, mji wote ulikuwa ukipaa kuelekea mbinguni[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwako wa ishara ulianza kupanda kutoka mjini kama nguzo ya moshi.” Neno la Kiebrania linaweza kumaanisha kitu kilichoinuliwa, na hapa huenda linarejelea ishara ya vita iliyokuwa imepangwa mapema.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “Benyamini akageuka nyuma yake.” Hii inaweza kumaanisha kwamba aligeuka kurudi au aligeuka kuelekea upande wa nyuma.
    reason: lexical_alternative
  - marker: c
    text: Au, “mji wote ulipaa hadi mbinguni,” yaani, kwa miali ya moto na moshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂאֵת
  choice: ishara
  rationale: Katika muktadha wa vita, neno hili linaonyesha ishara iliyopangwa mapema iliyotolewa na watu waliokuwa wamevizia. “Ishara” linaeleza kazi yake ya mawasiliano bila kulazimisha maana mahsusi ya “mnara wa moto.”
- source_word: הֵחֵלָּה לַעֲלוֹת
  choice: ilianza kupanda
  rationale: Muundo huu unaonyesha mwanzo wa mwendo wa kwenda juu. “Ilianza kupanda” ni Kiswahili cha kawaida na hudumisha taswira ya ishara inayoonekana katika moshi.
- source_word: עַמּוּד עָשָׁן
  choice: nguzo ya moshi
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya mkusanyiko wa moshi unaoinuka wima.
- source_word: וַיִּפֶן בִּנְיָמִן אַחֲרָיו
  choice: Benyamini akageuka kutazama nyuma
  rationale: Kitenzi msingi ni “geuka,” huku kishazi kinachofuata kikionyesha kwamba aliona kilichokuwa nyuma yake. Kuongeza “kutazama” kunafanya Kiswahili kiwe wazi na cha kawaida, huku tanbihi ikihifadhi tafsiri ya karibu zaidi na muundo wa Kiebrania.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Usemi huu unaonyesha ugunduzi wa ghafla na kuongeza nguvu ya kisimulizi; “na tazama” hudumisha athari hiyo kwa lugha yenye hadhi.
- source_word: עָלָה
  choice: ulikuwa ukipaa
  rationale: Hapa mji unaelezwa kana kwamba unapanda juu kwa moto na moshi. Hali endelevu inaonyesha tukio lililokuwa likiendelea Benyamini alipolitazama.
- source_word: כְלִיל הָעִיר
  choice: mji wote
  rationale: Neno hili linaonyesha ujumla au ukamilifu; “mji wote” ni usemi wa kawaida na sahihi katika Kiswahili.
- source_word: הַשָּׁמָיְמָה
  choice: kuelekea mbinguni
  rationale: Kiambishi cha mwelekeo kinaonyesha mwendo wa kwenda juu. “Kuelekea mbinguni” huhifadhi mwelekeo huo bila kudokeza kwamba mji ulifika mbinguni kihalisi.
