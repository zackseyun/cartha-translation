base_translation:
  language: en
  yaml_path: translation/ot/judges/020/036.yaml
  text: So the sons of Benjamin saw that they were defeated[a]. Now the men of Israel had given place to Benjamin[b], because they trusted in the ambush that they had set against Gibeah.
translation:
  language: sw
  text: Basi wana wa Benyamini wakaona kwamba wameshindwa. Waisraeli walikuwa wamewapa nafasi[a] Wabenyamini, kwa sababu walikitegemea kikosi cha waviziaji[b] walichokuwa wamekiweka dhidi ya Gibea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wamewaachia nafasi Wabenyamini.” Usemi wa Kiebrania unaonyesha kwamba Waisraeli walilegeza msimamo au walirudi nyuma kwa makusudi ili kuwavuta Wabenyamini watoke nje.
    reason: lexical_alternative
  - marker: b
    text: Au, “uviziaji.” Neno la Kiebrania אֹרֵב linaweza kumaanisha uviziaji wenyewe au watu waliokuwa wamejificha wakisubiri kushambulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: wakaona
  rationale: Huhifadhi maana ya msingi ya ראה, huku muktadha ukidokeza pia kwamba walitambua hali yao.
- source_word: בְנֵי בִנְיָמִן
  choice: wana wa Benyamini
  rationale: Huhifadhi usemi wa Kiebrania wa undugu kwa lugha ya Kiswahili iliyo wazi na yenye heshima.
- source_word: כִּי נִגָּפוּ
  choice: kwamba wameshindwa
  rationale: Nifali ya נגף katika muktadha wa vita inaeleza kushindwa; 'wameshindwa' ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: וַיִּתְּנוּ ... מָקוֹם
  choice: walikuwa wamewapisha
  rationale: Usemi huu unaonyesha kwamba Waisraeli waliwaachia nafasi kwa makusudi kama mbinu ya vita. Wakati timilifu uliotangulia unaonyesha kuwa tendo hili linafafanua kilichotangulia.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: watu wa Israeli
  rationale: Ingawa אִישׁ ni umbo la umoja, hapa limetumiwa kwa maana ya kundi la wapiganaji wa Israeli.
- source_word: כִּי בָטְחוּ
  choice: kwa sababu walikitegemea
  rationale: בטח humaanisha kutumaini au kutegemea; kiambishi 'ki-' kinakubaliana na 'kikosi' katika tafsiri.
- source_word: אֶל הָאֹרֵב
  choice: kikosi cha waviziaji
  rationale: אֹרֵב inaweza kumaanisha uviziaji au watu waliovizia. 'Kikosi cha waviziaji' ni wazi katika muktadha wa kijeshi bila kuficha uwezekano mwingine, ambao umewekwa katika tanbihi.
- source_word: אֲשֶׁר שָׂמוּ
  choice: walichokuwa wamekiweka
  rationale: שׂים ina maana pana ya kuweka; tafsiri hii inaendana kwa kawaida na kikosi kilichowekwa mahali kwa kusudi maalumu.
- source_word: אֶל הַגִּבְעָה
  choice: dhidi ya Gibea
  rationale: Katika muktadha wa kijeshi, אֶל inaonyesha mwelekeo au lengo la uviziaji; 'dhidi ya Gibea' huhifadhi mwelekeo huo.
