base_translation:
  language: en
  yaml_path: translation/ot/judges/020/015.yaml
  text: 'And on that day the sons of Benjamin were mustered from the cities: twenty-six thousand men drawing the sword[a], besides the inhabitants of Gibeah[b], who were mustered as seven hundred chosen men.'
translation:
  language: sw
  text: 'Na siku hiyo, wana wa Benyamini wakahesabiwa[a] kutoka katika miji: wanaume elfu ishirini na sita waliochomoa upanga, mbali na wakazi wa Gibea, walihesabiwa kuwa wanaume mia saba waliochaguliwa[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakaorodheshwa” au “wakaandikishwa”; kitenzi cha Kiebrania kinahusu kuhesabiwa kwa ajili ya utumishi wa kijeshi.
    reason: lexical_alternative
  - marker: b
    text: Au “wanaume mia saba walio bora”; neno la Kiebrania linaweza pia kumaanisha vijana, lakini hapa huenda linakazia wapiganaji walioteuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקְדוּ / הִתְפָּקְדוּ
  choice: wakahesabiwa / walihesabiwa
  rationale: Katika muktadha huu kitenzi kinamaanisha kuhesabiwa au kuandikishwa kwa ajili ya utumishi wa kijeshi. Tafsiri hii pia inadumisha urudiaji wa kitenzi cha Kiebrania.
- source_word: בְנֵי בִנְיָמִן
  choice: wana wa Benyamini
  rationale: Inahifadhi nahau ya kifamilia na kikabila ya Kiebrania huku ikibaki wazi kwa msomaji wa Kiswahili.
- source_word: בַּיּוֹם הַהוּא
  choice: Siku hiyo
  rationale: Ni usemi wa kawaida wa wakati unaodumisha msisitizo wa kiashiria katika chanzo.
- source_word: מֵהֶעָרִים
  choice: kutoka katika miji
  rationale: Inaonyesha mahali ambako vikosi vya kabila vilitoka bila kuongeza kimyakimya kwamba miji hiyo ilikuwa yao.
- source_word: עֶשְׂרִים וְשִׁשָּׁה אֶלֶף אִישׁ
  choice: wanaume elfu ishirini na sita
  rationale: Ni tafsiri ya moja kwa moja ya idadi; muktadha na kirai kinachofuata vinaonyesha kwamba walikuwa wapiganaji.
- source_word: שֹׁלֵף חָרֶב
  choice: waliochomoa upanga
  rationale: Inahifadhi picha halisi ya nahau ya Kiebrania, ambayo humaanisha wanaume wenye silaha walio tayari kupigana.
- source_word: לְבַד
  choice: mbali na
  rationale: Inaonyesha kwamba wakazi wa Gibea walihesabiwa kando na kuongezwa kwa idadi iliyotangulia.
- source_word: מִיֹּשְׁבֵי הַגִּבְעָה
  choice: wakazi wa Gibea
  rationale: Ni tafsiri ya kawaida na ya asili ya muundo unaowataja wale waliokaa Gibea.
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: wanaume mia saba
  rationale: Inatoa idadi moja kwa moja na kudumisha neno 'wanaume' la chanzo.
- source_word: בָּחוּר
  choice: waliochaguliwa
  rationale: Katika muktadha huu wa kijeshi neno linaelekea kumaanisha wapiganaji walioteuliwa au walio bora, ingawa linaweza pia kueleza ujana.
