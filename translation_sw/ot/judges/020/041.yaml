base_translation:
  language: en
  yaml_path: translation/ot/judges/020/041.yaml
  text: Then the men of Israel turned[a], and the men of Benjamin were terrified, because they saw that disaster had come upon them.
translation:
  language: sw
  text: Ndipo watu wa Israeli wakageuka[a], nao watu wa Benyamini wakaingiwa na hofu, kwa sababu waliona kwamba maafa yalikuwa yamewapata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kiebrania, maneno “mtu wa Israeli,” “mtu wa Benyamini,” “aliona,” na “juu yake” yako katika umoja lakini yametumiwa kwa maana ya pamoja kuhusu majeshi yanayopigana; kwa hiyo yametafsiriwa kwa wingi katika Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ יִשְׂרָאֵל
  choice: Ndipo watu wa Israeli
  rationale: אִישׁ iko katika umoja lakini hapa inawakilisha jeshi la Israeli kwa pamoja. Kiswahili cha kawaida hutumia “watu wa Israeli”; “ndipo” linaonyesha mfuatano wa simulizi.
- source_word: הָפַךְ
  choice: wakageuka
  rationale: Kitenzi kinaeleza kugeuka kwa mbinu vitani. “Wakageuka” ni cha karibu na chanzo bila kuongeza wazi wazo la kurudi nyuma.
- source_word: וַ/יִּבָּהֵל
  choice: wakaingiwa na hofu
  rationale: בהל huonyesha hofu ya ghafla na kubwa. Usemi huu ni wa asili na wenye hadhi katika Kiswahili, huku ukiepuka lugha ya mazungumzo kupita kiasi.
- source_word: אִישׁ בִּנְיָמִן
  choice: watu wa Benyamini
  rationale: Umoja wa Kiebrania umetumiwa kwa maana ya pamoja, ukiwakilisha wapiganaji wa Benyamini.
- source_word: כִּי רָאָה
  choice: kwa sababu waliona
  rationale: Kitenzi cha umoja kinaeleweka kwa maana ya pamoja; wingi wa Kiswahili unalingana na kundi la Benyamini. כִּי ya kwanza inaonyesha sababu.
- source_word: כִּי
  choice: kwamba
  rationale: כִּי ya pili inaanzisha yaliyoonwa, hivyo “kwamba” ni kiunganishi cha kawaida na sahihi.
- source_word: נָגְעָה עָלָיו
  choice: yalikuwa yamewapata
  rationale: Katika muktadha huu, usemi huo una maana ya maafa kuwafikia au kuwapata. Hali timilifu “yalikuwa yamewapata” huonyesha kwamba walitambua maafa tayari yamewafikia.
- source_word: הָרָעָה
  choice: maafa
  rationale: Hapa רָעָה si uovu wa kimaadili bali janga au madhara mabaya vitani. “Maafa” huwasilisha maana hiyo kwa uwazi.
