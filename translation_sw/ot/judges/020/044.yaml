base_translation:
  language: en
  yaml_path: translation/ot/judges/020/044.yaml
  text: And eighteen thousand men from Benjamin fell[a]; all these were valiant warriors.
translation:
  language: sw
  text: Wanaume elfu kumi na nane wa Benyamini wakaanguka; hao wote walikuwa mashujaa hodari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: wakaanguka
  rationale: Kitenzi נפל humaanisha kihalisi ‘kuanguka’; katika muktadha wa vita kinaashiria kuanguka na kufa. ‘Wakaanguka’ kinahifadhi nahau na uzito wa kijeshi wa Kiebrania bila kufafanua kupita kiasi.
- source_word: מִבִּנְיָמִן
  choice: wa Benyamini
  rationale: Ingawa מִן huonyesha chanzo au kundi, Kiswahili cha kawaida hutambulisha watu wa kabila kwa muundo ‘wa Benyamini,’ yaani waliotoka katika kabila hilo.
- source_word: שְׁמֹנָה עָשָׂר אֶלֶף אִישׁ
  choice: wanaume elfu kumi na nane
  rationale: Neno אִישׁ limetajwa wazi baada ya idadi, kwa hiyo ‘wanaume’ linawakilishwa badala ya kuongeza tafsiri ya ‘wanajeshi.’
- source_word: אֶת כָּל אֵלֶּה
  choice: hao wote
  rationale: Usemi huu unarejelea kwa muhtasari kundi lote lililoanguka; ‘hao wote’ ni wa asili na wazi katika Kiswahili.
- source_word: אַנְשֵׁי חָיִל
  choice: mashujaa hodari
  rationale: Katika muktadha wa vita, usemi huu unaeleza wanaume wenye uwezo, nguvu na ushujaa wa kupigana. ‘Mashujaa hodari’ huwasilisha maana hiyo kwa Kiswahili cha sasa chenye hadhi.
