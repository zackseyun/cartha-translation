  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Nusu koloni linahifadhi uhusiano wa kiambatisho kati ya idadi ya walioanguka na maelezo kwamba wote walikuwa mashujaa hodari.
