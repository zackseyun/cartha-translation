base_translation:
  language: en
  yaml_path: translation/ot/judges/020/028.yaml
  text: And Phinehas the son of Eleazar[a], son of Aaron, stood before him in those days, saying, “Shall I yet again go out to battle against the sons of Benjamin my brother, or shall I stop?” And Yahweh said, “Go up[c][b], for tomorrow I will give him into your hand.”
translation:
  language: sw
  text: Naye Finehasi mwana wa Eleazari, mwana wa Haruni, alikuwa amesimama mbele ya sanduku la agano[a] siku hizo. Akauliza, “Je, niende tena kupigana na wana wa Benyamini, ndugu yangu,[b] au niache?” Yahwe akasema, “Pandeni, kwa maana kesho nitamtia[c] mkononi mwako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbele yake,” kiwakilishi kikieleweka kumrejelea Yahwe badala ya sanduku la agano lililotajwa katika mstari uliotangulia.
    reason: alternative_reading
  - marker: b
    text: Kiebrania halisi ni “wana wa Benyamini, ndugu yangu,” kikihifadhi lugha ya undugu hata katika vita vya wenyewe kwa wenyewe.
    reason: cultural_note
  - marker: c
    text: Au “nitamkabidhi.” Kiwakilishi cha umoja “-m-” huenda kinaitazama kabila la Benyamini kama jumuiya moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס בֶּן אֶלְעָזָר בֶּן אַהֲרֹן
  choice: Naye Finehasi mwana wa Eleazari, mwana wa Haruni
  rationale: “Naye” huendeleza simulizi kwa kawaida, huku vizazi vyote viwili vikihifadhiwa ili kuonyesha ukoo wa kikuhani.
- source_word: עֹמֵד לְפָנָיו
  choice: alikuwa amesimama mbele yake
  rationale: Huhifadhi maana ya kusimama mbele ya mtu au kitu bila kuamua kimya kimya ikiwa kiwakilishi kinamhusu Yahwe au sanduku lililotajwa katika mstari uliotangulia.
- source_word: בַּיָּמִים הָהֵם
  choice: siku hizo
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili unaolingana kwa karibu na usemi wa wakati katika Kiebrania.
- source_word: לֵאמֹר
  choice: Akauliza
  rationale: Katika muktadha huu maneno yanayofuata ni swali; “akauliza” huwasilisha kazi ya usemi kwa Kiswahili cha asili kuliko tafsiri ngumu ya “akisema.”
- source_word: הַאוֹסִף עוֹד לָצֵאת לַמִּלְחָמָה
  choice: Je, niende tena kupigana
  rationale: Huwasilisha wazo la kutoka tena kwenda vitani kwa Kiswahili wazi na cha sasa.
- source_word: עִם בְּנֵי בִנְיָמִן אָחִי
  choice: na wana wa Benyamini, ndugu yangu
  rationale: “Na” linaweza kuonyesha upande unaokabiliwa katika kitenzi cha kupigana, na usemi wa ukoo wa Kiebrania umehifadhiwa, pamoja na umoja wa “ndugu yangu.”
- source_word: אִם אֶחְדָּל
  choice: au niache?
  rationale: “Niache” ni Kiswahili cha kawaida kwa kuacha au kukoma kuendelea na hatua hiyo.
- source_word: וַיֹּאמֶר יְהוָה
  choice: Yahwe akasema
  rationale: Jina la Mungu limeandikwa Yahwe, likiwakilisha jina la Kiebrania יהוה badala ya kulibadilisha kuwa cheo.
- source_word: עֲלוּ
  choice: Pandeni
  rationale: Kitenzi cha wingi huhifadhiwa, na “pandeni” hudumisha taswira ya kwenda juu au kusonga dhidi ya adui bila kuipanua kupita kiasi.
- source_word: כִּי מָחָר אֶתְּנֶנּוּ בְיָדֶךָ
  choice: kwa maana kesho nitamtia mkononi mwako
  rationale: Huhifadhi wakati wa kesho, kiwakilishi cha umoja kinachomwakilisha Benyamini kwa ujumla, na nahau ya kutiwa mkononi inayoonyesha kukabidhiwa chini ya mamlaka ya mshindi.
theological_decisions:
- issue: Kirejelewa cha kiwakilishi katika לְפָנָיו
  choice: “mbele yake,” bila kutaja moja kwa moja kirejelewa
  alternative: “mbele za Yahwe” au “mbele ya sanduku”
  rationale: Kiebrania kinaweza kueleweka kuwa Finehasi alisimama mbele ya Yahwe au mbele ya sanduku la agano lililotajwa katika mstari uliotangulia. Kiswahili “yake” kinahifadhi utata huo, nao unaelezwa katika tanbihi.
- issue: Jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: “Yahwe” huwakilisha jina binafsi la Mungu katika maandishi ya Kiebrania bila kuligeuza kuwa cheo.
- issue: Umoja wa Benyamini katika אֶתְּנֶנּוּ na בְיָדֶךָ
  choice: “nitamtia mkononi mwako”
  alternative: “nitawatia mikononi mwenu”
  rationale: Umoja wa kisarufi umehifadhiwa ili Benyamini aonekane kama jumuiya moja na ili mabadiliko ya Kiebrania kutoka amri ya wingi kwenda anwani ya umoja yasifutwe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa heshima na unaosomeka kwa urahisi. Majina yameandikwa Finehasi, Eleazari, Haruni na Benyamini kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia. Usemi “ndugu yangu” na mabadiliko kati ya wingi na umoja yamehifadhiwa kwa sababu ni sehemu ya mvutano wa kifasihi na kitheolojia wa chanzo.
