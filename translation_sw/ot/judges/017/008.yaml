base_translation:
  language: en
  yaml_path: translation/ot/judges/017/008.yaml
  text: And the man went from the city[a], from Bethlehem of Judah, to sojourn wherever he might find a place. And he came to the hill country of Ephraim, as far as the house of Micah, to continue his journey.
translation:
  language: sw
  text: Mtu huyo akatoka katika mji wa Bethlehemu ya Yuda, kwenda kukaa kwa muda popote ambapo angepata mahali. Akafika katika nchi ya vilima ya Efraimu, mpaka nyumbani kwa Mika, akiwa katika safari yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiendelea na safari yake.” Kiebrania ni kihalisi, “akifanya njia yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaondoka
  rationale: Kitenzi hiki kinaendeleza simulizi na kueleza kuanza kuondoka kutoka mahali; “akaondoka” ni Kiswahili cha kawaida na cha wazi katika muktadha huu.
- source_word: הָאִישׁ
  choice: mtu huyo
  rationale: Neno la Kiebrania hapa ni “mtu/mwanaume huyo,” si “kijana”; tafsiri hii inarejelea mhusika aliyetajwa bila kuingiza maelezo ya mstari uliotangulia.
- source_word: מֵהָעִיר מִבֵּית לֶחֶם יְהוּדָה
  choice: mjini, yaani Bethlehemu katika Yuda
  rationale: “Mji” huwakilisha עִיר kwa upana, huku “yaani” ikionyesha kwamba Bethlehemu ndiyo mji unaotajwa. “Katika Yuda” hutambulisha eneo hilo kwa Kiswahili cha kawaida.
- source_word: לָגוּר
  choice: kwenda kukaa kwa muda
  rationale: גור mara nyingi humaanisha kukaa mahali kama mgeni au bila makazi ya kudumu. “Kukaa kwa muda” huhifadhi wazo hilo kuliko “kuishi” pekee.
- source_word: בַּאֲשֶׁר יִמְצָא
  choice: popote ambapo angepata mahali
  rationale: Kishazi hiki huonyesha kutafuta sehemu yoyote inayopatikana. “Mahali” linaongezwa kama yambwa inayodokezwa na Kiebrania.
- source_word: הַר אֶפְרַיִם
  choice: nchi ya vilima ya Efraimu
  rationale: Hili ni jina la eneo la milimani, si mlima mmoja; “nchi ya vilima” huwasilisha maana ya kijiografia kwa usahihi.
- source_word: עַד בֵּית מִיכָה
  choice: mpaka nyumbani kwa Mika
  rationale: עַד huonyesha kikomo alichofikia, na בֵּית מִיכָה hapa kwa kawaida ni makao ya Mika.
- source_word: לַעֲשׂוֹת דַּרְכּוֹ
  choice: alipokuwa akisafiri
  rationale: Nahau hiyo ni kihalisi “kufanya njia yake” na katika muktadha inaeleza kwamba alifika huko akiwa safarini. Tafsiri hii ni ya asili bila kulazimisha kwamba alikusudia kuendelea baada ya hapo.
