base_translation:
  language: en
  yaml_path: translation/ot/judges/017/004.yaml
  text: So he returned the silver to his mother[a], and his mother took two hundred pieces of silver and gave it to the silversmith, and he made it into a carved image and a cast image[c][b], and it was in the house of Micah.
translation:
  language: sw
  text: Basi akamrudishia mama yake ile fedha, naye mama yake akachukua vipande mia mbili vya fedha[a] na kumpa fundi wa fedha. Fundi huyo akaifanya kuwa sanamu ya kuchongwa na sanamu ya kusubu[b]; nayo ikawa katika nyumba ya Mika[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shekeli mia mbili za fedha.” Kiebrania kinasema tu “mia mbili za fedha,” bila kutaja wazi kipimo katika mstari huu.
    reason: lexical_alternative
  - marker: b
    text: Au, “sanamu ya kuchongwa na sanamu ya kufuliwa.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinatumia kitenzi cha umoja, “ikawa,” baada ya kutaja sanamu ya kuchongwa na sanamu ya kusubu; huenda kinakichukulia kilichotengenezwa au seti hiyo kuwa kitu kimoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב אֶת הַכֶּסֶף לְאִמּוֹ
  choice: akamrudishia mama yake ile fedha
  rationale: Kitenzi cha Kiebrania katika Hiphil kinaonyesha kuirudisha fedha kwa mwenyewe. “Akamrudishia” ni Kiswahili cha kawaida na huhifadhi wazo la kurejesha; “fedha” linafaa kwa kuwa neno כֶּסֶף hapa ni mali ya thamani na pia malighafi ya kutengeneza sanamu.
- source_word: מָאתַיִם כֶּסֶף
  choice: vipande mia mbili vya fedha
  rationale: Kiebrania kimetaja idadi na fedha bila kutaja wazi kipimo katika mstari huu. “Vipande ... vya fedha” ni usemi wa kawaida unaoepuka kuingiza “shekeli” katika matini kuu kwa uhakika usio katika maneno yenyewe.
- source_word: לַצּוֹרֵף
  choice: fundi wa fedha
  rationale: צֹרֵף ni fundi au msafishaji wa metali. Kwa kuwa kinachotumiwa hapa ni fedha, “fundi wa fedha” ni sahihi na inaeleweka kwa urahisi.
- source_word: וַיַּעֲשֵׂהוּ
  choice: Fundi huyo akaifanya kuwa
  rationale: Kitenzi cha nafsi ya tatu kiume umoja kwa kawaida humrejelea fundi kama mtendaji, na kiambishi cha kitu umoja huirejelea fedha au kitu kilichotengenezwa. Kurudia “Fundi huyo” huondoa utata usio wa lazima katika Kiswahili.
- source_word: פֶּסֶל
  choice: sanamu ya kuchongwa
  rationale: פֶּסֶל humaanisha sanamu iliyochongwa, mara nyingi katika mazingira ya ibada. Tafsiri hii huhifadhi maana ya neno bila kuongeza moja kwa moja hukumu ya kitafsiri ya “sanamu ya kuabudiwa.”
- source_word: וּמַסֵּכָה
  choice: na sanamu ya kusubu
  rationale: מַסֵּכָה ni sanamu iliyofanywa kwa kumimina metali iliyoyeyushwa katika kalibu. “Sanamu ya kusubu” ni usemi wa Kiswahili unaoeleza namna hiyo ya utengenezaji.
- source_word: וַיְהִי בְּבֵית מִיכָיְהוּ
  choice: nayo ikawa katika nyumba ya Mika
  rationale: Kiebrania kina kitenzi cha umoja baada ya majina mawili, hivyo kinachukulia kilichotengenezwa au mkusanyo huo kama kitu kimoja. “Nayo ikawa” huhifadhi umoja huo.
- source_word: מִיכָיְהוּ
  choice: Mika
  rationale: “Mika” ni umbo la jina lililozoeleka katika Biblia ya Kiswahili kwa mhusika huyu.
theological_decisions:
- issue: Iwapo פֶּסֶל וּמַסֵּכָה yatafsiriwe kwa neno lenye hukumu ya wazi ya kidini
  choice: sanamu ya kuchongwa na sanamu ya kusubu
  alternative: sanamu za kuabudiwa / miungu ya sanamu
  rationale: Muktadha mpana unaonyesha kuwa vitu hivi ni vya ibada isiyofaa, lakini nomino za Kiebrania hapa zinaeleza hasa aina na namna ya kutengenezwa kwa sanamu. Tafsiri haiongezi hukumu ambayo haijasemwa wazi katika mstari huu.
- issue: Umoja wa וַיְהִי baada ya sanamu mbili zilizotajwa
  choice: nayo ikawa
  alternative: nazo zikawa
  rationale: Umoja wa kitenzi katika Kiebrania umehifadhiwa ili kuacha uwezekano kwamba maneno hayo mawili yanaeleza kitu kimoja chenye sifa mbili au mkusanyo unaotazamwa kama kitu kimoja, bila kulazimisha hitimisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kisicho cha kizamani. “Fundi wa fedha” na “sanamu ya kusubu” ni sahihi na zinaeleweka; alama zote za tanbihi zimewekwa katika matini kuu.
