  text: וַ/יֹּ֣אמֶר לְ/אִמּ֡/וֹ אֶלֶף֩ וּ/מֵאָ֨ה הַ/כֶּ֜סֶף אֲשֶׁ֣ר לֻֽקַּֽח לָ֗/ךְ ו/אתי אָלִית֙ וְ/גַם֙ אָמַ֣רְתְּ בְּ/אָזְנַ֔/י הִנֵּֽה הַ/כֶּ֥סֶף אִתִּ֖/י אֲנִ֣י לְקַחְתִּ֑י/ו וַ/תֹּ֣אמֶר אִמּ֔/וֹ בָּר֥וּךְ בְּנִ֖/י לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/002.yaml
  text: And he said to his mother[a], “The eleven hundred pieces of silver that were taken from you, about which you uttered a curse and also spoke in my hearing—look, the silver is with me; I took it.” And his mother said[b], “Blessed be my son by Yahweh.”
translation:
  language: sw
  text: Akamwambia mama yake, “Vile vipande elfu moja na mia moja vya fedha vilivyochukuliwa kutoka kwako, ambavyo ulitamka laana juu yake[a], tena ukasema nikiwa nasikia—tazama, fedha hiyo iko kwangu; mimi ndiye niliyeichukua.” Mama yake akasema, “Mwanangu na abarikiwe na Yahweh[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uliapa juu yake.” Kitenzi cha Kiebrania kinaweza kumaanisha kuapa au kutamka laana, lakini hapa muktadha unapendelea maana ya laana.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “Mwanangu amebarikiwa kwa/na Yahweh”; hii ni kauli fupi ya baraka.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: vipande elfu moja na mia moja vya fedha
  rationale: Kiebrania kinataja kiasi cha fedha bila kutaja wazi kipimo cha shekeli. ‘Vipande vya fedha’ ni Kiswahili cha kawaida kinachohifadhi kutotajwa kwa kipimo maalumu.
- source_word: לֻקַּח לָךְ
  choice: vilivyochukuliwa kutoka kwako
  rationale: Kitenzi cha Kiebrania kinasema fedha ‘ilichukuliwa’; muktadha unaonyesha iliondolewa katika milki yake. Tafsiri hii haiongezi wazi dhana ya wizi ambayo kitenzi chenyewe hakitaji.
- source_word: וְאַתִּי אָלִית
  choice: ulitamka laana kuvihusu
  rationale: Kitenzi אָלָה kinaweza kuhusiana na kiapo au laana. Muktadha wa fedha iliyopotea unapendelea laana, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: וְגַם אָמַרְתְּ בְּאָזְנַי
  choice: tena ukasema nikiwa nasikia
  rationale: Nahau ya Kiebrania ‘masikioni mwangu’ inamaanisha kwamba maneno hayo yalisemwa mhusika akiwa anayasikia. Kiswahili hiki ni cha kawaida na kinahifadhi maana hiyo.
- source_word: הִנֵּה
  choice: tazama
  rationale: Neno hili huvuta fikira za msikilizaji kwa jambo linalofuata. ‘Tazama’ lina uzito unaofaa simulizi la kibiblia bila kuwa gumu kueleweka.
- source_word: הַכֶּסֶף אִתִּי
  choice: fedha hiyo iko kwangu
  rationale: Tafsiri hii inafuata kwa karibu muundo wa Kiebrania, ‘fedha iko pamoja nami,’ na inaeleweka kwa Kiswahili kama kukiri kuwa anayo.
- source_word: אֲנִי לְקַחְתִּיו
  choice: mimi ndiye niliyeichukua
  rationale: Kiwakilishi cha nafsi אֲנִי kimetajwa wazi kwa msisitizo. Muundo ‘mimi ndiye’ unaonyesha vizuri msisitizo wa ungamo hilo.
- source_word: בָּרוּךְ בְּנִי לַיהוָה
  choice: Mwanangu na abarikiwe na Yahwe
  rationale: Hii ni kauli fupi ya baraka. Muundo wa Kiswahili unaonyesha ombi la baraka kutoka kwa Yahwe, huku tanbihi ikitaja ufupi na uwezekano wa kimuundo wa Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika Kiebrania limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama ‘Bwana.’
theological_decisions:
- issue: Maana ya אָלָה katika kauli ya mama
  choice: ulitamka laana
  alternative: uliapa
  rationale: Neno linaweza kutaja laana au kiapo. Katika simulizi hili, fedha iliyochukuliwa na ungamo la mwana vinafanya maana ya laana iwe yenye uwezekano zaidi, lakini maana ya kiapo haijaondolewa na imewekwa katika tanbihi.
- issue: Uhusiano unaoonyeshwa na לַיהוָה katika kauli ya baraka
  choice: na abarikiwe na Yahwe
  alternative: amebarikiwa kwa Yahwe / kwa ajili ya Yahwe
  rationale: Kihusishi cha Kiebrania katika kauli hii fupi kinaweza kueleweka kwa namna zaidi ya moja. Tafsiri kuu inatoa maana ya kawaida ya baraka itokayo kwa Yahwe, na tanbihi inahifadhi umbo halisi na ufupi wa kauli.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina la Mungu lenye herufi nne, si cheo. ‘Yahwe’ linahifadhi jina hilo kwa matamshi yanayokubalika kitaaluma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa heshima na wa sasa. ‘Tazama’ na ‘na abarikiwe’ vinadumisha hadhi ya lugha ya Maandiko bila kutumia misamiati ya kizamani kupita kiasi. Utata halisi wa אָלָה na wa kauli fupi ya baraka umehifadhiwa kwa tanbihi.
