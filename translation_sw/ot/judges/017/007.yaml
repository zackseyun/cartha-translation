base_translation:
  language: en
  yaml_path: translation/ot/judges/017/007.yaml
  text: There was a young man from Bethlehem in Judah[a], from the clan of Judah; and he was a Levite[b], and he was sojourning there.
translation:
  language: sw
  text: Kulikuwa na kijana mmoja kutoka Bethlehemu ya Yuda, wa ukoo wa Yuda[a]. Alikuwa Mlawi, naye alikuwa akiishi huko kama mgeni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wa jamaa ya Yuda.” Neno la Kiebrania linaweza kumaanisha jamaa pana au ukoo.
    reason: lexical_alternative
  - marker: b
    text: Au, “alikuwa akiishi huko” au “alikuwa anakaa huko.” Kitenzi cha Kiebrania mara nyingi humaanisha kuishi mahali ambapo mtu si mwenyeji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Kulikuwa na
  rationale: Hufungua sehemu hii ya simulizi kwa namna ya kawaida katika Kiswahili bila kuongeza kielezi cha wakati kisichotajwa wazi.
- source_word: נַעַר
  choice: kijana mmoja
  rationale: Katika muktadha huu neno linamtaja kijana, si lazima mtoto wala mtumishi.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: kutoka Bethlehemu ya Yuda
  rationale: Hutambulisha Bethlehemu iliyokuwa katika eneo la Yuda na kuitofautisha na mahali pengine penye jina hilo.
- source_word: מִמִּשְׁפַּחַת יְהוּדָה
  choice: wa ukoo wa Yuda
  rationale: מִשְׁפָּחָה inaweza kumaanisha jamaa pana au ukoo; 'ukoo' ni sahihi na ya kawaida hapa bila kuipanua moja kwa moja kuwa kabila.
- source_word: לֵוִי
  choice: Mlawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa mtu wa Walawi, na linadumisha mvutano wa kifungu pamoja na 'wa ukoo wa Yuda.'
- source_word: גָר שָׁם
  choice: alikuwa akiishi huko kama mgeni
  rationale: גור huonyesha kuishi mahali pasipo kwa mtu mwenyeji au kwa hali ya muda; usemi huu unadokeza hali hiyo bila kuifanya kuwa istilahi nzito ya kisheria.
theological_decisions:
- issue: Mvutano unaoonekana kati ya utambulisho wa Yuda na wa Mlawi
  choice: 'Kudumisha kauli zote mbili: ''wa ukoo wa Yuda'' na ''alikuwa Mlawi.'''
  alternative: Kufasiri uhusiano wake na Yuda kuwa wa kijiografia au kijamii tu, au kufafanua maandishi ili kuondoa mvutano.
  rationale: Maandishi ya Kiebrania yanaweka maelezo hayo pamoja bila kuyapatanisha; tafsiri inapaswa kudumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi mbili fupi zimetumiwa kwa usomaji wa kawaida, huku urudiaji na mvutano wa maandishi ya Kiebrania vikihifadhiwa.
