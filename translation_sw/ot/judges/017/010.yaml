  text: וַ/יֹּאמֶר֩ ל֨/וֹ מִיכָ֜ה שְׁבָ֣/ה עִמָּדִ֗/י וֶֽ/הְיֵה לִ/י֮ לְ/אָ֣ב וּ/לְ/כֹהֵן֒ וְ/אָנֹכִ֨י אֶֽתֶּן לְ/ךָ֜ עֲשֶׂ֤רֶת כֶּ֨סֶף֙ לַ/יָּמִ֔ים וְ/עֵ֥רֶךְ בְּגָדִ֖ים וּ/מִחְיָתֶ֑/ךָ וַ/יֵּ֖לֶךְ הַ/לֵּוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/010.yaml
  text: Micah said to him[a], “Stay with me, and be a father and a priest to me, and I will give you ten pieces of silver a year, a set of clothes[c][b], and your living.” So the Levite went in.
translation:
  language: sw
  text: Mika akamwambia, “Kaa pamoja nami, uwe baba na kuhani wangu. Nami nitakupa vipande kumi vya fedha[a] kwa mwaka, seti ya mavazi[b], na riziki yako.” Basi Mlawi akaenda[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni kihalisi “fedha kumi”; kipimo hakijatajwa. Wengine hutafsiri “shekeli kumi za fedha.”
    reason: lexical_alternative
  - marker: b
    text: Au “mgao wa mavazi.”
    reason: lexical_alternative
  - marker: c
    text: Au “akaingia.” Kitenzi cha Kiebrania ni “akaenda,” lakini katika muktadha kinaweza kumaanisha kwamba aliingia katika nyumba ya Mika.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה עִמָּדִי
  choice: Kaa pamoja nami
  rationale: Kitenzi ישב hapa ni mwaliko wa Mlawi kuishi au kubaki kwa Mika; ‘kaa pamoja nami’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: לְאָב וּלְכֹהֵן
  choice: baba na kuhani wangu
  rationale: ‘Baba’ limehifadhiwa kama sitiari ya heshima na mamlaka ya ushauri wa kidini, bila kulibadili kuwa istilahi ya kimadhehebu; כֹהֵן limetafsiriwa moja kwa moja ‘kuhani.’
- source_word: עֲשֶׂרֶת כֶּסֶף
  choice: vipande kumi vya fedha
  rationale: Kiebrania hakitaji kipimo cha fedha. ‘Vipande kumi vya fedha’ kinaepuka kuongeza ‘shekeli’ isiyotajwa katika matini.
- source_word: לַיָּמִים
  choice: kwa mwaka
  rationale: Nahau hii inaonyesha malipo ya kila mwaka; ‘kwa mwaka’ ni wazi na ya kawaida katika Kiswahili.
- source_word: וְעֵרֶךְ בְּגָדִים
  choice: seti ya mavazi
  rationale: Kirai kinaashiria kiasi au mgao wa mavazi, yaelekea mavazi kamili; ‘seti ya mavazi’ ni ya kueleweka huku tanbihi ikihifadhi uwezekano wa ‘mgao wa mavazi.’
- source_word: וּמִחְיָתֶךָ
  choice: na riziki yako
  rationale: מִחְיָה ni mahitaji ya kuendeleza maisha. ‘Riziki yako’ ni fupi, ya kawaida, na pana kuliko ‘chakula’ pekee.
- source_word: וַיֵּלֶךְ הַלֵּוִי
  choice: Basi Mlawi akaenda
  rationale: Kitenzi cha Kiebrania kimsingi ni ‘akaenda.’ Tafsiri haiongezi wazi wazo la kuingia nyumbani kwa Mika, ingawa muktadha unaweza kulidokeza.
theological_decisions:
- issue: Matumizi ya ‘baba’ kama cheo katika mazingira ya ibada isiyo halali
  choice: Kuhifadhi neno ‘baba’
  alternative: mshauri; baba wa kiroho
  rationale: Matini yenyewe inatumia sitiari ya kifamilia. Kuihifadhi huepuka kuficha hali ya kijamii na kidini au kuingiza istilahi za baadaye za kikanisa.
- issue: Kipimo kisichotajwa cha fedha
  choice: vipande kumi vya fedha
  alternative: shekeli kumi za fedha
  rationale: Kiebrania kinasema kihalisi ‘fedha kumi’ bila kutaja kipimo; kwa hiyo tafsiri kuu haiongezi ‘shekeli.’
- issue: 'Mwisho wa mstari: kama Mlawi alienda tu au aliingia kwa Mika'
  choice: akaenda
  alternative: akaingia
  rationale: Maana ya msingi ya וַיֵּלֶךְ ni ‘akaenda.’ Muktadha unaweza kueleweka kuwa aliingia au akakubali kukaa kwa Mika, lakini tafsiri kuu haifanyi dokezo hilo kuwa wazi kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kwa msomaji wa kawaida; ‘riziki’ huhifadhi upana wa mahitaji ya maisha, na tanbihi zinaonyesha sehemu zenye utata bila kuutatua kimya kimya.
