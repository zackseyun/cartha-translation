  yaml_path: translation/ot/judges/017/011.yaml
  text: So the Levite agreed to stay with the man[b][a], and the young man became like one of his sons to him.
translation:
  language: sw
  text: Basi Mlawi akakubali kukaa pamoja na mtu huyo,[a] naye yule kijana akawa kwake kama mmoja wa wanawe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawa tayari kukaa pamoja na mtu huyo.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “yule kijana akawa kwake kama mmoja wa wanawe”; yaani, Mika alimtendea Mlawi kama mshiriki wa familia yake.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: akakubali
  rationale: Kitenzi יאל katika Hiphil huonyesha kukubali au kuwa tayari. “Akakubali” ni Kiswahili cha kawaida kinachofaa katika muktadha wa kupokea pendekezo la Mika.
- source_word: הַלֵּוִי
  choice: Mlawi
  rationale: Nomino yenye uainisho inamtaja Mlawi aliyetangulia kutambulishwa; “Mlawi” ndilo neno la kawaida na sahihi katika Kiswahili cha Biblia.
- source_word: לָשֶׁבֶת
  choice: kukaa
  rationale: ישׁב inaweza kumaanisha kuketi, kukaa, kuishi au kubaki. Hapa “kukaa” kwa kawaida huonyesha kuishi kwa mtu huyo bila kulazimisha maana finyu.
- source_word: אֶת הָאִישׁ
  choice: pamoja na mtu huyo
  rationale: Pamoja na ישׁב, אֶת huonyesha ushirika au kuwa karibu. “Pamoja na mtu huyo” huwasilisha wazi kuwa Mlawi alikaa katika nyumba au mazingira yake.
- source_word: וַיְהִי
  choice: akawa
  rationale: היה hapa inaeleza hali iliyotokea baada ya Mlawi kukubali kukaa naye. “Akawa” huhifadhi maana ya mabadiliko au matokeo bila maelezo ya ziada.
- source_word: הַנַּעַר
  choice: yule kijana
  rationale: נַעַר inaweza kumaanisha mvulana, kijana au mtumishi. Kwa kuwa Mlawi anatenda kwa kujitegemea, “kijana” linafaa zaidi; “yule” humrejelea mtu aliyekwisha tajwa.
- source_word: כְּאַחַד מִבָּנָיו
  choice: kama mmoja wa wanawe
  rationale: כ huonyesha ulinganisho, na kifungu kinamaanisha hadhi inayofanana na ya mwana katika nyumba. Tafsiri hii ni ya kawaida na huhifadhi tashbihi ya Kiebrania.
