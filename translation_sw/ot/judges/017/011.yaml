translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa sentensi umefanywa uwe wa kawaida katika Kiswahili huku usemi wa Kiebrania “kwake kama mmoja wa wanawe” ukihifadhiwa katika matini na kufafanuliwa katika tanbihi.
