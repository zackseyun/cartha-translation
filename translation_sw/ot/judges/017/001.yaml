lexical_decisions:
- source_word: וַיְהִי
  choice: Palikuwa na
  rationale: Hutambulisha mhusika na sehemu mpya ya simulizi kwa Kiswahili cha kawaida bila kuongeza kiashiria cha wakati kisichotajwa wazi.
- source_word: אִישׁ
  choice: mtu mmoja
  rationale: Hutoa maana ya mtu binafsi wa kiume katika utangulizi wa simulizi; neno “mmoja” linafanya utambulisho huo uwe wa kawaida bila kuongeza umaalumu usio lazima.
- source_word: מֵהַר אֶפְרָיִם
  choice: kutoka nchi ya vilima ya Efraimu
  rationale: Neno הַר hapa linamaanisha eneo la miinuko linalohusishwa na Efraimu, si mlima mmoja.
- source_word: וּשְׁמוֹ
  choice: naye aliitwa
  rationale: Ni Kiswahili cha asili kinachowasilisha mwendelezo wa sentensi na taarifa ya jina lake.
- source_word: מִיכָיְהוּ
  choice: Mikayhu
  rationale: Linawakilisha kwa karibu umbo la jina la Kiebrania katika mstari huu badala ya kutumia umbo la kimapokeo “Mika.”
