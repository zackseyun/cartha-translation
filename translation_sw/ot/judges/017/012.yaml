  text: So Micah ordained the Levite[a], and the young man became his priest and was in Micah’s house.
translation:
  language: sw
  text: Basi Mika akamweka rasmi Mlawi huyo[a], naye yule kijana akawa kuhani wake na akawa katika nyumba ya Mika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “akajaza mkono wa Mlawi”; hii ni nahau ya kumweka mtu rasmi katika huduma ya kikuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא אֶת־יַד
  choice: akamweka rasmi
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kumwingiza mtu rasmi katika huduma ya kikuhani. “Akamweka rasmi” inaeleza tendo hilo kwa Kiswahili cha kawaida bila kudokeza kwamba tendo hilo lilikubaliwa na Mungu; maana yake halisi imehifadhiwa katika tanbihi.
- source_word: הַלֵּוִי
  choice: Mlawi huyo
  rationale: Neno hilo humtambulisha mtu kwa ukoo au kabila lake. “Mlawi huyo” ni la kawaida katika Kiswahili na humrejelea mtu ambaye tayari ametajwa katika simulizi.
- source_word: הַנַּעַר
  choice: yule kijana
  rationale: נַעַר linaweza kumaanisha mvulana, kijana, au mtumishi kulingana na muktadha. Kwa kuwa hapa anachukua jukumu la kikuhani, “kijana” linafaa kuliko “mvulana”.
- source_word: לְכֹהֵן
  choice: akawa kuhani wake
  rationale: Herufi לְ inaonyesha jukumu au kazi; muundo mzima unaonyesha kwamba kijana huyo akawa kuhani wa Mika.
- source_word: וַיְהִי לוֹ
  choice: akawa ... wake
  rationale: Muundo huu unaonyesha kuingia katika uhusiano au jukumu jipya kwa ajili ya Mika. Kiswahili “akawa kuhani wake” huwasilisha badiliko hilo kwa kawaida.
- source_word: בְּבֵית מִיכָה
  choice: akakaa nyumbani mwa Mika
  rationale: Kirai hiki kinaonyesha kuwa kijana huyo alikuwapo au aliishi katika nyumba ya Mika. “Akakaa nyumbani mwa Mika” ni cha kawaida na kinadumisha maana ya mahali bila kuibadili kuwa wazo pana la kaya.
theological_decisions:
- issue: Kueleza kuwekwa kwa kuhani katika ibada binafsi bila kudokeza uhalali wake mbele za Mungu
  choice: Mika akamweka rasmi Mlawi huyo
  alternative: Mika akamweka wakfu Mlawi huyo
  rationale: “Akamweka rasmi” hueleza kuingizwa katika huduma bila kudokeza utakaso wa kimungu au kibali cha Mungu. Simulizi lenyewe ndilo linalotoa tathmini ya mpango huu usio wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wazi na wenye heshima. “Nyumbani mwa Mika” ni usemi wa kawaida zaidi kuliko “katika nyumba ya Mika,” huku ukiendelea kuonyesha mahali.
