  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: sw
  text: Siku hizo hakukuwa na mfalme katika Israeli; kila mtu[a] alifanya yale yaliyo sawa machoni pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, Kiebrania husema “kila mwanamume.” Nomino ya umoja ya kiume imetumiwa kwa maana ya uwakilishi, yaani, kila mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Siku hizo
  rationale: Ni njia ya kawaida na ya asili ya Kiswahili ya kuwasilisha fomula ya wakati katika simulizi, huku ikihifadhi mtazamo wa kurudi nyuma.
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: hapakuwa na mfalme katika Israeli
  rationale: Kirai hiki kinaeleza kutokuwapo kwa mfalme. Tafsiri hii ni ya kawaida katika Kiswahili na haiongezi hukumu ya kisiasa ambayo haijasemwa wazi.
- source_word: אִישׁ
  choice: kila mtu
  rationale: Katika muktadha huu nomino ya umoja ya kiume imetumiwa kwa maana ya kila mmoja. “Kila mtu” ni Kiswahili cha kawaida kinachowasilisha maana hiyo ya uwakilishi; tanbihi inaonyesha umbo halisi la Kiebrania.
- source_word: הַיָּשָׁר
  choice: jambo lililo sawa
  rationale: Kivumishi יָשָׁר hapa kimetumiwa kama nomino na humaanisha jambo lililo sawa au la haki. “Jambo lililo sawa” ni wazi na cha asili katika sentensi ya Kiswahili.
- source_word: בְּעֵינָיו
  choice: machoni pake
  rationale: Taswira ya Kiebrania imehifadhiwa kwa sababu inaeleza hukumu ya mtu mwenyewe na pia ni nahau inayoeleweka katika Kiswahili.
- source_word: יַעֲשֶׂה
  choice: alifanya
  rationale: Ingawa umbo la Kiebrania ni imperfect, katika muhtasari huu wa simulizi linaonyesha tendo la kawaida katika wakati uliopita. Wakati uliopita wa Kiswahili unawasilisha maana hiyo kwa ufasaha.
theological_decisions:
- issue: Tathmini ya msimuliaji kuhusu hali ya Israeli bila kudai wazi kwamba ufalme ndio suluhisho la lazima
  choice: Kauli imetafsiriwa moja kwa moja, huku nahau “jambo lililo sawa machoni pake” ikibeba dokezo la hukumu hasi.
  alternative: Kuifanya kuwa taarifa ya kihistoria isiyo na tathmini, au kuipanua iwe hoja ya wazi kwamba ufalme wenyewe ndio suluhisho la lazima.
  rationale: Kiitikio hiki katika kitabu cha Waamuzi kinaonyesha machafuko ya kijamii na kidini, lakini mstari wenyewe hautoi fundisho kamili kuhusu aina ya utawala. Tafsiri inaacha mvutano huo ubaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Nahau “machoni pake” imehifadhiwa ili kudumisha taswira na nguvu ya tathmini ya maandishi ya Kiebrania.
