base_translation:
  language: en
  yaml_path: translation/ot/judges/017/005.yaml
  text: The man Micah had a house of God[a], and he made an ephod and household idols, and he ordained one of his sons[b], and he became his priest.
translation:
  language: sw
  text: Mtu huyo, Mika, alikuwa na nyumba ya miungu[a]. Akatengeneza efodi na sanamu za nyumbani, akamweka rasmi mmoja wa wanawe[b], naye akawa kuhani wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pa ibada.” Kirai cha Kiebrania kinaweza pia kueleweka “nyumba ya Mungu” au “nyumba ya mungu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “aliujaza mkono wa mmoja wa wanawe,” nahau ya kumweka au kumweka wakfu mtu kwa huduma ya ukuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית אֱלֹהִים
  choice: nyumba ya miungu
  rationale: Inahifadhi wingi unaowezekana wa אֱלֹהִים na inafaa muktadha wa mahali binafsi pa ibada penye efodi na terafi, bila kudokeza moja kwa moja kwamba ibada hiyo ilikuwa halali.
- source_word: אֵפוֹד
  choice: efodi
  rationale: Neno hili la kitu au vazi la kidini la kale halina kisawe rahisi cha Kiswahili; umbo lililotoholewa linahifadhi istilahi mahsusi.
- source_word: תְרָפִים
  choice: sanamu za nyumbani
  rationale: Hueleza kwa lugha ya kawaida picha za ibada za kifamilia au nyumbani, huku likihifadhi maana yake ya kiibada katika muktadha huu.
- source_word: וַיְמַלֵּא אֶת־יַד
  choice: akamweka rasmi
  rationale: Nahau hii ina maana ya kumweka au kumweka wakfu mtu katika huduma ya ukuhani. Tafsiri hii ni ya asili kwa Kiswahili, na tanbihi inahifadhi taswira halisi ya Kiebrania.
- source_word: אַחַד מִבָּנָיו
  choice: mmoja wa wanawe
  rationale: Inawakilisha moja kwa moja muundo wa sehemu ya kundi na inadumisha rejeo la wana wa kiume.
- source_word: וַיְהִי לוֹ לְכֹהֵן
  choice: naye akawa kuhani wake
  rationale: 'Inahifadhi matokeo ya tendo lililotangulia: mwana huyo akawa kuhani wa Mika.'
- source_word: וְהָאִישׁ מִיכָה
  choice: Mtu huyo, Mika
  rationale: Kiwakilishi 'huyo' kinawasilisha urejelezaji wa mada unaoletwa na nomino yenye kibainishi, bila kuongeza neno la wakati lisilokuwamo katika chanzo.
theological_decisions:
- issue: Iwapo בֵּית אֱלֹהִים itafsiriwe kwa namna inayoweza kudokeza ibada halali ya Mungu wa kweli
  choice: nyumba ya miungu
  alternative: nyumba ya Mungu; mahali pa ibada
  rationale: 'Muktadha unaonyesha mpangilio binafsi na usio wa kawaida wa ibada: Mika anatengeneza efodi na terafi na kumweka mwanawe mwenyewe kuwa kuhani. Wingi katika tafsiri kuu unahifadhi uwezekano wa kisarufi na mwelekeo wa muktadha, huku tanbihi ikiacha wazi maana nyingine halali za kirai hicho.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Sentensi zimegawanywa ili mtiririko uwe wa asili, huku mfululizo wa matendo ya Kiebrania ukihifadhiwa.
