  yaml_path: translation/ot/judges/017/009.yaml
  text: Micah said to him[a], “Where do you come from?” And he said to him, “I am a Levite from Bethlehem in Judah, and I am going to sojourn wherever I may find a place.”
translation:
  language: sw
  text: Mika akamwambia, “Unatoka wapi?” Naye akamwambia, “Mimi ni Mlawi kutoka Bethlehemu ya Yuda, nami ninakwenda kukaa kwa muda popote nitakapopata pa kukaa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa karibu zaidi: “kuishi kama mgeni popote nitakapopata.” Kitenzi hicho kinaweza kumaanisha kuishi kwa muda, mara nyingi kama mgeni au mkazi anayewategemea wengine; kitu anachotarajia kukipata hakitajwi wazi katika Kiebrania.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן
  choice: Unatoka wapi?
  rationale: Ni swali kuhusu mahali mtu anapotoka; usemi huu ni wa kawaida na wa sasa katika Kiswahili.
- source_word: לֵוִי
  choice: Mlawi
  rationale: Linataja utambulisho wa mtu wa kabila la Lawi; “Mlawi” ndilo neno la kawaida la Kibiblia katika Kiswahili.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: kutoka Bethlehemu ya Yuda
  rationale: Hutofautisha mji huu kuwa Bethlehemu iliyoko katika eneo la Yuda, bila kuufanya “Yuda” kuwa sehemu isiyoeleweka ya jina la mji.
- source_word: הֹלֵךְ
  choice: ninakwenda
  rationale: Kauli ya kitenzi inaonyesha tendo linaloendelea au kusudi la safari lililo mbele yake; “ninakwenda” huhifadhi hali hiyo kwa lugha ya kawaida.
- source_word: לָגוּר
  choice: kukaa kwa muda
  rationale: Kitenzi גור kinaweza kumaanisha kuishi kwa muda, mara nyingi kama mgeni au mkazi asiye na urithi wa kudumu mahali hapo. “Kukaa kwa muda” ni wazi na cha kawaida bila kuingiza maelezo yote ya kijamii katika matini kuu.
- source_word: בַּאֲשֶׁר אֶמְצָא
  choice: mahali popote nitakapopata nafasi
  rationale: Kiebrania kina maana ya mahali pasipojulikana bado na kinaacha kitu kitakachopatikana bila kutajwa. “Nafasi” hukamilisha usemi kwa Kiswahili kwa namna ya asili huku ikihifadhi hali ya kutokuwa na uhakika.
