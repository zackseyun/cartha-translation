base_translation:
  language: en
  yaml_path: translation/ot/judges/017/013.yaml
  text: Then Micah said[a], “Now I know that Yahweh will do good to me, because I have a Levite as priest.”
translation:
  language: sw
  text: Ndipo Mika akasema, “Sasa najua kwamba Yahweh atanitendea mema, kwa sababu nina Mlawi huyo kama kuhani wangu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Waw mfululizo inasogeza simulizi mbele; “Ndipo” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: מִיכָה
  choice: Mika
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: עַתָּה יָדַעְתִּי
  choice: Sasa najua
  rationale: Kitenzi timilifu kinaeleza hali ya sasa iliyotokana na kufikia uamuzi; “Sasa najua” ni ya asili na hudumisha maana hiyo.
- source_word: כִּי יֵיטִיב יְהוָה לִי
  choice: kwamba Yahweh atanitendea mema
  rationale: כִּי ya kwanza huanzisha maudhui ya kile Mika anachojua. Hiphil ya יטב ina maana ya kumtendea mtu mema bila kuibana kuwa ustawi wa mali pekee.
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי ya pili inatoa sababu ya uhakika wa Mika.
- source_word: הָיָה לִי
  choice: nina
  rationale: Muundo wa Kiebrania unaonyesha umilikaji au kuwa na mtu katika nafasi fulani; “nina” ni Kiswahili cha kawaida.
- source_word: הַלֵּוִי
  choice: Mlawi
  rationale: Nomino ina kibainishi katika Kiebrania na inaweza kumrejelea Mlawi yule aliyetangulia kutajwa; Kiswahili “Mlawi” hakilazimishi uchaguzi kati ya maana ya mtu mmoja wa kundi hilo na yule anayejulikana katika muktadha.
- source_word: לְכֹהֵן
  choice: kuwa kuhani wangu
  rationale: לְ huonyesha kazi au nafasi. Kiambishi “wangu” kinaweka wazi uhusiano unaoonyeshwa na לִי katika muundo mzima, bila kudai kwamba Mlawi huyo ni mali yake.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Uhakika wa Mika kwamba kuwa na Mlawi kama kuhani kutamletea mema
  choice: Kauli imeachwa kama madai ya Mika bila uthibitisho wa msimulizi
  alternative: Kuieleza kana kwamba Mungu ameahidi kumbariki Mika
  rationale: Kiebrania kinaripoti hitimisho la Mika mwenyewe. Muktadha wa ibada yake tata haupaswi kutatuliwa kwa kuongeza idhini ya Mungu ambayo mstari hautamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili kwa wasomaji wa kawaida, huku tofauti ya kibainishi cha Kiebrania ikihifadhiwa katika tanbihi.
