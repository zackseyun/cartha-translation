reference: Judges 17:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּ֛שֶׁב אֶת אֶֽלֶף וּ/מֵאָ֥ה הַ/כֶּ֖סֶף לְ/אִמּ֑/וֹ וַ/תֹּ֣אמֶר אִמּ֡/וֹ הַקְדֵּ֣שׁ הִקְדַּ֣שְׁתִּי אֶת הַ/כֶּסֶף֩ לַ/יהוָ֨ה מִ/יָּדִ֜/י לִ/בְנִ֗/י לַֽ/עֲשׂוֹת֙ פֶּ֣סֶל וּ/מַסֵּכָ֔ה וְ/עַתָּ֖ה אֲשִׁיבֶ֥/נּוּ לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/003.yaml
  text: So he returned the eleven hundred pieces of silver to his mother[a], and his mother said, “I had solemnly dedicated the silver to Yahweh from my hand for my son, to make a carved image and a cast image[b]; so now I return it to you.”
translation:
  language: sw
  text: Basi akamrudishia mama yake vipande vya fedha elfu moja na mia moja. Mama yake akasema, “Fedha hizi nilikuwa nimeziweka wakfu kabisa kwa Yahwe, kutoka mkononi mwangu[b], kwa ajili ya mwanangu, ili kutengeneza sanamu ya kuchongwa na sanamu ya kusubu[a]. Basi sasa ninakurudishia fedha hizo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sanamu ya metali iliyomiminwa katika kalibu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “kutoka mkononi mwangu”; nahau hii inaweza kuonyesha kwamba fedha zilitoka katika mali yake mwenyewe au kwamba yeye binafsi ndiye aliyeziweka wakfu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: akamrudishia
  rationale: Hifili ya שׁוב hapa ina maana ya kusababisha kitu kirudi, yaani kukirudisha kwa mwenyewe; “akamrudishia” ni ya kawaida na inaonyesha mpokeaji.
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: vile vipande elfu moja na mia moja vya fedha
  rationale: Kiebrania hakitaji wazi kipimo cha shekeli katika mstari huu. “Vipande vya fedha” huepuka kuongeza kipimo kisichotajwa huku kikitoa Kiswahili kinachoeleweka.
- source_word: הַקְדֵּשׁ הִקְדַּשְׁתִּי
  choice: nilikuwa nimeziweka wakfu kabisa
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichonyambuliwa unasisitiza tendo. “Kabisa” huhifadhi msisitizo huo, na “kuweka wakfu” huhifadhi maana ya kidini ya kutenga kwa matumizi matakatifu.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Jina la agano יהוה limetolewa moja kwa moja kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: מִיָּדִי
  choice: kutoka mkononi mwangu
  rationale: Tafsiri hii huhifadhi nahau ya Kiebrania na uwezekano wake wa kuonyesha mali inayotoka katika milki ya mama au tendo lake binafsi; tanbihi inaifafanua bila kuifungia katika maana moja.
- source_word: לִבְנִי
  choice: kwa ajili ya mwanangu
  rationale: Lamed inaonyesha mnufaika au kusudi; “kwa ajili ya mwanangu” ni ya kawaida na inafaa muktadha.
- source_word: פֶּסֶל
  choice: sanamu ya kuchongwa
  rationale: Hutoa kwa uwazi kitu kilichotengenezwa kwa kuchongwa bila kutumia neno la hukumu linaloweza kuzidi neno lenyewe.
- source_word: וּמַסֵּכָה
  choice: na sanamu ya metali iliyosubiwa
  rationale: מַסֵּכָה kwa kawaida ni sanamu iliyotengenezwa kwa kumimina metali iliyoyeyushwa katika kalibu. “Iliyosubiwa” ni sahihi, na “ya metali” hufanya maana iwe wazi kwa msomaji wa kawaida.
- source_word: אֲשִׁיבֶנּוּ לָךְ
  choice: ninakurudishia fedha hizo
  rationale: Kauli ya wakati wa sasa inafaa tendo la karibu linalotangazwa na mama. Kurudia “fedha hizo” ni Kiswahili cha kawaida na kunabainisha kiwakilishi cha Kiebrania.
theological_decisions:
- issue: Kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Lugha ya kuweka wakfu fedha zinazokusudiwa kutengeneza sanamu
  choice: nimeziweka wakfu kabisa kwa Yahwe
  alternative: nimezitoa kwa Yahwe
  rationale: Kiebrania kinatumia lugha ya kuweka wakfu ingawa matokeo ni utengenezaji wa sanamu. Tafsiri haipunguzi wala kutatua mvutano huo wa kitheolojia.
- issue: Uhusiano kati ya sanamu iliyochongwa na sanamu iliyosubiwa
  choice: sanamu ya kuchongwa na sanamu ya metali iliyosubiwa
  alternative: sanamu moja iliyochongwa na kusubiwa
  rationale: Muundo wa Kiebrania una nomino mbili zilizounganishwa kwa “na.” Tafsiri inahifadhi muundo huo bila kuamua kimya kimya ikiwa ni vitu viwili tofauti au kitu kimoja cha aina mbili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Akamrudishia,” “kuweka wakfu,” na “kwa ajili ya” ni maumbo ya sasa na ya kawaida; istilahi ya ufundi “iliyosubiwa” imefafanuliwa kwa kuongeza “ya metali” na kwa tanbihi.
