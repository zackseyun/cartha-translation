  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּלְכֹּ֥ד גִּלְעָ֛ד אֶֽת מַעְבְּר֥וֹת הַ/יַּרְדֵּ֖ן לְ/אֶפְרָ֑יִם וְֽ֠/הָיָה כִּ֣י יֹאמְר֞וּ פְּלִיטֵ֤י אֶפְרַ֨יִם֙ אֶעֱבֹ֔רָה וַ/יֹּ֨אמְרוּ ל֧/וֹ אַנְשֵֽׁי גִלְעָ֛ד הַֽ/אֶפְרָתִ֥י אַ֖תָּה וַ/יֹּ֥אמֶֽר לֹֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/005.yaml
  text: And Gilead captured the fords of the Jordan against Ephraim. And whenever the fugitives of Ephraim said[a], “Let me cross over,” the men of Gilead would say to him, “Are you an Ephraimite?” If he said, “No,”
translation:
  language: sw
  text: Wagileadi wakateka vivuko vya Yordani[a] dhidi ya Waefraimu. Kila mkimbizi wa Efraimu aliposema, “Niruhusuni nivuke,” Wagileadi walimuuliza, “Je, wewe ni Mwefraimu?” Naye akisema, “La,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, sehemu za mto zenye kina kifupi zilizotumiwa kuvuka Yordani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: wakateka
  rationale: Kitenzi לכד humaanisha kuteka au kushika kwa nguvu; “wakateka” kinafaa katika muktadha wa kijeshi wa kutwaa maeneo muhimu ya kuvukia.
- source_word: גִּלְעָד / אַנְשֵׁי גִלְעָד
  choice: Wagileadi
  rationale: Jina la mahali limetumiwa kwa maana ya watu wake; “Wagileadi” ni kifupi na cha kawaida kwa watu wa Gileadi.
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: vivuko vya Yordani
  rationale: מַעְבְּרוֹת hapa ni sehemu za kina kifupi ambako watu huvuka mto; “vivuko” ni neno la kawaida na linaloeleweka, huku tanbihi ikifafanua aina ya vivuko.
- source_word: לְאֶפְרָיִם
  choice: dhidi ya Waefraimu
  rationale: Katika muktadha wa mapigano, kiambishi ל kinaonyesha kuwa vivuko vilitekwa kwa hatua ya uhasama dhidi ya Waefraimu.
- source_word: וְהָיָה כִּי
  choice: Kila ... aliposema
  rationale: Muundo huu unaanzisha tukio lililojirudia; “kila ... aliposema” huwasilisha vizuri maana hiyo kwa Kiswahili cha asili.
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: mkimbizi wa Efraimu
  rationale: פָּלִיט ni mtu aliyetoroka hatari au mapigano; “mkimbizi” linafaa kwa Waefraimu waliokuwa wakijaribu kuponyoka.
- source_word: אֶעֱבֹרָה
  choice: Niruhusuni nivuke
  rationale: Hali ya cohortative inaonyesha ombi au tamanio la msemaji; “Niruhusuni nivuke” huonyesha nguvu hiyo ya kuomba.
- source_word: הַאֶפְרָתִי אַתָּה
  choice: Je, wewe ni Mwefraimu?
  rationale: Swali linahusu utambulisho wa kikabila; “Mwefraimu” ni umbo la Kiswahili la mtu mmoja wa Efraimu.
- source_word: וַיֹּאמֶר לֹא
  choice: Naye akisema, “La,”
  rationale: Ingawa muundo wa Kiebrania ni wa usimulizi, katika mfululizo huu unaojirudia una kazi ya sharti; “akisema” hudumisha uhusiano huo bila kuongeza maneno mengi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Ujirudiaji wa tukio umeonyeshwa kwa “Kila ... aliposema” na “akisema.” “La” limetumiwa kama jibu fupi la heshima linalolingana na לֹא.
