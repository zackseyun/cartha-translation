  text: He had forty sons and thirty grandsons, riding on seventy donkeys, and he judged Israel eight years.
translation:
  language: sw
  text: Alikuwa na wana arobaini na wajukuu wa kiume thelathini, waliopanda punda sabini. Akawa mwamuzi wa Israeli kwa miaka minane.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי בָנִים
  choice: wajukuu wa kiume
  rationale: Maana halisi ni “wana wa wana”; katika muktadha huu inarejelea wajukuu wa kiume na kudumisha utofautisho wa jinsia uliomo katika Kiebrania.
- source_word: רֹכְבִים עַל שִׁבְעִים עֲיָרִם
  choice: waliopanda punda sabini
  rationale: Kirai elezi kinawahusu wana na wajukuu waliotangulia; “punda” hutafsiri עֲיָרִם, yaani punda wa kiume/wadogo, kwa lugha ya kawaida isiyobebesha maandishi undani usio wa lazima.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: Naye aliwaamua Israeli
  rationale: Kitenzi שפט katika kitabu hiki kinamaanisha kutenda kama mwamuzi na kiongozi; “aliwaamua” huhifadhi istilahi kuu ya Waamuzi bila kuifanya iwe tu utawala wa kifalme.
- source_word: שְׁמֹנֶה שָׁנִים
  choice: kwa miaka minane
  rationale: Usemi wa kawaida wa Kiswahili unaowasilisha muda wa huduma yake kwa usahihi.
