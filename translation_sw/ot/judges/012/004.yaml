  text: וַ/יִּקְבֹּ֤ץ יִפְתָּח֙ אֶת כָּל אַנְשֵׁ֣י גִלְעָ֔ד וַ/יִּלָּ֖חֶם אֶת אֶפְרָ֑יִם וַ/יַּכּוּ֩ אַנְשֵׁ֨י גִלְעָ֜ד אֶת אֶפְרַ֗יִם כִּ֤י אָמְרוּ֙ פְּלִיטֵ֤י אֶפְרַ֨יִם֙ אַתֶּ֔ם גִּלְעָ֕ד בְּ/ת֥וֹךְ אֶפְרַ֖יִם בְּ/ת֥וֹךְ מְנַשֶּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/004.yaml
  text: Then Jephthah gathered all the men of Gilead and fought with Ephraim. And the men of Gilead struck Ephraim down[a], because they had said, “You Gileadites are fugitives of Ephraim, in the midst of Ephraim and in the midst of Manasseh.”
translation:
  language: sw
  text: Ndipo Yeftha akawakusanya wanaume wote wa Gileadi, akapigana na Waefraimu. Wanaume wa Gileadi wakawapiga Waefraimu[a], kwa sababu walikuwa wamesema, “Ninyi Wagileadi ni wakimbizi wa Efraimu, mkiwa katikati ya Efraimu na katikati ya Manase.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania cha shtaka linalofuata ni kigumu. Tafsiri nyingine ni: “Ninyi ni wakimbizi wa Efraimu, ee Gileadi, miongoni mwa Efraimu na miongoni mwa Manase.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: akawakusanya
  rationale: Kitenzi קבץ humaanisha kukusanya au kuwakutanisha watu; katika muktadha huu kinaashiria kuwakusanya kwa ajili ya vita bila kuongeza wazo la kuandikisha rasmi jeshini.
- source_word: כָּל אַנְשֵׁי גִלְעָד
  choice: watu wote wa Gileadi
  rationale: Ingawa אַנְשֵׁי kwa msingi ni ‘wanaume wa’, hapa inarejelea watu wa Gileadi waliokusanywa kupigana. ‘Watu wote wa Gileadi’ ni Kiswahili cha kawaida katika simulizi hili na hakiongezi neno ‘mashujaa’ lisilokuwapo wazi katika Kiebrania.
- source_word: וַיִּלָּחֶם אֶת אֶפְרָיִם
  choice: akapigana na Waefraimu
  rationale: Nifali ya לחם humaanisha kupigana. ‘Kupigana na’ ni usemi wa kawaida wa Kiswahili na unaonyesha mapambano dhidi ya watu wa Efraimu.
- source_word: וַיַּכּוּ
  choice: wakawashinda
  rationale: נכה inaweza kumaanisha kupiga, kuangusha, au kushinda katika vita. Katika muktadha wa kundi moja kulipiga jingine, ‘wakawashinda’ huwasilisha matokeo ya kijeshi bila kudai kwamba kila mmoja aliuawa.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי inatanguliza sababu ya mapambano; ‘kwa sababu’ ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: wakimbizi wa Efraimu
  rationale: פְּלִיטֵי ni watu waliokimbia au kutoroka. ‘Wakimbizi’ huhifadhi maana ya msingi na nguvu ya dhihaka, ingawa muundo mzima wa shtaka ni mgumu.
- source_word: אַתֶּם גִּלְעָד
  choice: Ninyi Wagileadi
  rationale: Jina la mahali Gileadi limetumiwa kwa wakazi wake. ‘Wagileadi’ ni namna ya kawaida ya Kiswahili ya kuwataja watu hao.
- source_word: בְּתוֹךְ אֶפְרַיִם בְּתוֹךְ מְנַשֶּׁה
  choice: katikati ya Efraimu na katikati ya Manase
  rationale: בְּתוֹךְ humaanisha ‘katikati ya’ au ‘miongoni mwa’. Kurudia ‘katikati ya’ kunahifadhi urudiaji na hali isiyo wazi ya Kiebrania badala ya kuitafsiri moja kwa moja kuwa ‘kati ya’ kwa maana ya nafasi baina ya makabila mawili.
theological_decisions:
- issue: Muundo mgumu wa kisintaksia katika tusi la mwisho
  choice: “Ninyi Wagileadi ni wakimbizi wa Efraimu, mkiwa katikati ya Efraimu na katikati ya Manase.”
  alternative: “Ninyi ni wakimbizi wa Efraimu, ee Gileadi, miongoni mwa Efraimu na miongoni mwa Manase.”
  rationale: Kiebrania cha shtaka hili kimebanwa na maana yake ya kisintaksia si wazi. Tafsiri kuu inadumisha kauli ya moja kwa moja na maana ya פְּלִיטֵי, huku tanbihi ikionyesha uwezekano mwingine bila kulazimisha ufafanuzi wa kiteolojia au wa kihistoria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaoeleweka kwa msomaji wa kawaida. Majina ya watu wa makabila yametolewa kama ‘Waefraimu’ na ‘Wagileadi’; majina ya maeneo ni ‘Efraimu’, ‘Gileadi’, na ‘Manase’. Utata halisi wa sehemu ya mwisho umehifadhiwa na kuonyeshwa katika tanbihi.
