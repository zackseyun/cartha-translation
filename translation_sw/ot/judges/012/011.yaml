lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: akawa mwamuzi wa
  rationale: Katika kitabu cha Waamuzi, kitenzi hiki kinahusu kazi ya waamuzi juu ya Israeli. Kiswahili cha kawaida hutumia kwa ufasaha ‘akawa mwamuzi wa’ kuliko ‘akaihukumu Israeli,’ ambalo linaweza kueleweka hasa kama kutoa hukumu ya mahakamani.
- source_word: אַחֲרָיו
  choice: Baada yake
  rationale: Huhifadhi kiwakilishi cha Kiebrania kinachorejelea mwamuzi aliyetangulia bila kulitaja jina lake kwa ufafanuzi wa ziada.
- source_word: אֵילוֹן
  choice: Eloni
  rationale: Jina limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: הַזְּבוּלֹנִי
  choice: wa kabila la Zabuloni
  rationale: Neno la Kiebrania linamtambulisha Eloni kwa uhusiano wake wa kikabila; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: עֶשֶׂר שָׁנִים
  choice: kwa miaka kumi
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha muda.
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל ... וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: akawa mwamuzi wa Israeli kwa miaka kumi
  rationale: Ingawa Kiebrania kinarudia kitenzi, kukiweka mara mbili katika Kiswahili kungeleta uradidi mzito. Sentensi moja huhifadhi mhusika, kazi yake, taifa, na muda wote kwa ufasaha.
