  yaml_path: translation/ot/judges/012/013.yaml
  text: After him, Abdon son of Hillel the Pirathonite judged Israel.
translation:
  language: sw
  text: Baada yake, Abdoni mwana wa Hileli, Mpirathoni, akawa mwamuzi wa Israeli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: akawa mwamuzi wa
  rationale: Katika kitabu cha Waamuzi, kitenzi שׁפט humtambulisha mtu anayetekeleza kazi ya mwamuzi katika Israeli. Muundo huu ni wa kawaida katika Kiswahili na huhifadhi istilahi kuu ya kitabu bila kuibana maana iwe hukumu za mahakamani pekee.
- source_word: אַחֲרָיו
  choice: Baada yake
  rationale: Kirai hiki kinaonyesha kwamba Abdoni alimfuata mwamuzi aliyetangulia; tafsiri hii ni ya moja kwa moja na ya asili.
- source_word: אֶת יִשְׂרָאֵל
  choice: wa Israeli
  rationale: Israeli ndiyo jamii ambayo Abdoni aliitumikia kama mwamuzi. Muundo wa Kiswahili unaolingana na 'akawa mwamuzi' hutumia kirai 'wa Israeli'.
- source_word: עַבְדּוֹן
  choice: Abdoni
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: בֶּן הִלֵּל
  choice: mwana wa Hileli
  rationale: Kirai cha Kiebrania kinamtambulisha baba yake Abdoni; 'mwana wa Hileli' ni cha asili na kiko karibu na muundo wa chanzo.
- source_word: הַפִּרְעָתוֹנִי
  choice: Mpirathoni
  rationale: Nomino hii ya mahali humaanisha mtu wa Pirathoni. 'Mpirathoni' huhifadhi umbo la utambulisho wa mahali kwa Kiswahili bila kuongeza maelezo yasiyokuwapo katika mstari.
