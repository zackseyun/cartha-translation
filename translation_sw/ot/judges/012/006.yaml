  text: וַ/יֹּ֣אמְרוּ ל/וֹ֩ אֱמָר נָ֨א שִׁבֹּ֜לֶת וַ/יֹּ֣אמֶר סִבֹּ֗לֶת וְ/לֹ֤א יָכִין֙ לְ/דַבֵּ֣ר כֵּ֔ן וַ/יֹּאחֲז֣וּ אוֹת֔/וֹ וַ/יִּשְׁחָט֖וּ/הוּ אֶל מַעְבְּר֣וֹת הַ/יַּרְדֵּ֑ן וַ/יִּפֹּ֞ל בָּ/עֵ֤ת הַ/הִיא֙ מֵֽ/אֶפְרַ֔יִם אַרְבָּעִ֥ים וּ/שְׁנַ֖יִם אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/006.yaml
  text: Then they said to him[a], “Please say ‘Shibboleth.’” But he said, “Sibboleth,” because he could not say it that way. So they seized him and slaughtered him at the fords of the Jordan. At that time forty-two thousand from Ephraim fell.
translation:
  language: sw
  text: Ndipo wakamwambia[a], “Tafadhali sema, ‘Shiboleti.’” Lakini yeye akasema, “Siboleti,” kwa sababu hakuweza kulitamka hivyo. Basi wakamkamata na kumchinja kando ya vivuko vya Yordani. Wakati huo watu elfu arobaini na mbili wa Efraimu wakaanguka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda neno la Kiebrania “Shiboleti” likamaanisha “suke ya nafaka” au “mkondo wa maji/mafuriko”; lakini hapa limetumiwa kama neno la kupima matamshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמָר נָא
  choice: Tafadhali sema
  rationale: Amri pamoja na נָא ina nguvu ya ombi la heshima; kauli hii ni ya kawaida na wazi katika Kiswahili cha sasa.
- source_word: שִׁבֹּלֶת
  choice: Shiboleti
  rationale: Neno linatumika kama kipimo cha matamshi, hivyo limetoholewa badala ya kutafsiriwa kwa maana yake ya kawaida; pia linahifadhi sauti ya mwanzo ‘sh’.
- source_word: סִבֹּלֶת
  choice: Siboleti
  rationale: Utohozi huu unaonyesha tofauti muhimu kati ya sauti za mwanzo ‘sh’ na ‘s’.
- source_word: וְלֹא יָכִין לְדַבֵּר כֵּן
  choice: kwa sababu hakuweza kulitamka hivyo
  rationale: Ingawa maneno hayo yanaweza kutafsiriwa kwa karibu kuwa ‘hakujiweka tayari kusema hivyo,’ muktadha unaonyesha kutoweza kutamka sauti iliyotakiwa; ‘kulitamka hivyo’ ni wazi na asilia.
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: wakamkamata
  rationale: אחז humaanisha kushika au kukamata; hapa ni kumkamata mtu baada ya kushindwa kipimo cha matamshi.
- source_word: וַיִּשְׁחָטוּהוּ
  choice: kumchinja
  rationale: שׁחט ni neno lenye nguvu kuliko ‘kuua’ na hudokeza uchinjaji; ‘kumchinja’ huhifadhi ukali wa simulizi.
- source_word: אֶל מַעְבְּרוֹת הַיַּרְדֵּן
  choice: kwenye vivuko vya Yordani
  rationale: מַעְבְּרוֹת ni sehemu za kuvukia mto; ‘vivuko’ ni neno la kawaida na sahihi katika Kiswahili.
- source_word: וַיִּפֹּל ... מֵאֶפְרַיִם
  choice: watu ... wa Efraimu wakaanguka
  rationale: Katika muktadha wa vita, נפל humaanisha kufa kwa kuuawa, lakini ‘wakaanguka’ huhifadhi taswira na usemi wa Kiebrania bila kuficha maana ya tukio.
- source_word: אַרְבָּעִים וּשְׁנַיִם אָלֶף
  choice: elfu arobaini na mbili
  rationale: Idadi imehifadhiwa sawasawa na chanzo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Majina ‘Shiboleti’ na ‘Siboleti’ yameandikwa ili tofauti ya matamshi ionekane wazi. ‘Kumchinja’ huhifadhi ukali wa kitenzi cha Kiebrania, na ‘wakaanguka’ huhifadhi nahau ya kijeshi ya chanzo.
