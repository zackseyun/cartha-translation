base_translation:
  language: en
  yaml_path: translation/ot/judges/012/015.yaml
  text: And Abdon son of Hillel the Pirathonite died[a], and he was buried in Pirathon, in the land of Ephraim, in the hill country of the Amalekites.
translation:
  language: sw
  text: Abdon mwana wa Hileli, Mpirathoni, akafa; akazikwa Pirathoni, katika nchi ya Efraimu, katika nchi ya vilima vya Waamaleki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata umbo la Kiebrania kwa karibu zaidi, “katika mlima wa Mwamaleki.” Huenda Kiebrania kinatumia kivumishi cha kikabila kilicho katika umoja kwa maana ya pamoja au ya kieneo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kitenzi מות kinamaanisha kufa moja kwa moja; “akafa” ni tafsiri ya kawaida na iliyo wazi bila kutumia lugha ya kupunguza ukali wa kifo.
- source_word: עַבְדּוֹן
  choice: Abdoni
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida katika Kiswahili.
- source_word: בֶּן הִלֵּל
  choice: mwana wa Hileli
  rationale: Muundo wa Kiebrania unaonyesha uhusiano wa uzazi; “mwana wa” ni usemi wa asili katika Kiswahili.
- source_word: הַפִּרְעָתוֹנִי
  choice: Mpirathoni
  rationale: Jina hili la mwenyeji linamtambulisha Abdoni kuwa mtu wa Pirathoni; umbo la Kiswahili lenye kiambishi M- linahifadhi maana hiyo kwa ufupi.
- source_word: וַיִּקָּבֵר
  choice: naye akazikwa
  rationale: Nifali ya קבר ina maana ya kutendwa; “akazikwa” hudumisha hali ya kutendwa, na “naye” huunganisha sentensi kwa mtiririko wa kawaida.
- source_word: בְּפִרְעָתוֹן
  choice: huko Pirathoni
  rationale: Kihusishi ב ni cha mahali; “huko” huonyesha wazi kwamba maziko yalifanyika katika mji huo.
- source_word: בְּאֶרֶץ אֶפְרַיִם
  choice: katika nchi ya Efraimu
  rationale: Tafsiri hii inahifadhi neno אֶרֶץ, “nchi,” badala ya kulifupisha kuwa “katika Efraimu” tu.
- source_word: בְּהַר הָעֲמָלֵקִי
  choice: katika eneo la milima la Waamaleki
  rationale: Katika maelezo ya kijiografia, הַר mara nyingi humaanisha eneo la milima badala ya mlima mmoja. Ingawa jina la mwenyeji liko katika umoja kisarufi, hapa linaeleweka kwa maana ya pamoja au ya eneo.
