base_translation:
  language: en
  yaml_path: translation/ot/judges/012/001.yaml
  text: Then the men of Ephraim were called together[a], and they crossed over to Zaphon and said to Jephthah[c][b], “Why did you cross over to fight against the Ammonites and not call us to go with you? We will burn your house down over you with fire.”
translation:
  language: sw
  text: Ndipo watu wa Efraimu wakaitwa wakusanyike[a]. Wakavuka kwenda Safoni[b], wakamwambia Yeftha, “Kwa nini ulivuka kwenda kupigana na Waamoni bila kutuita twende pamoja nawe? Tutateketeza nyumba yako juu yako kwa moto!”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi kina “mtu wa Efraimu,” lakini vitenzi vinavyofuata vinaonyesha maana ya kijamii: watu wa Efraimu kama kundi.'
    reason: lexical_alternative
  - marker: b
    text: Au “kuelekea kaskazini,” ikiwa צָפוֹנָה linaeleweka kuwa kielezi cha mwelekeo badala ya jina la mahali, Safoni.
    reason: alternative_reading
  - marker: c
    text: Kiebrania kihalisi kinasema, “Tutateketeza nyumba yako juu yako kwa moto.” Huenda tishio hilo linamaanisha kuichoma nyumba Yeftha akiwa ndani yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק אִישׁ אֶפְרַיִם
  choice: watu wa Efraimu wakaitwa wakusanyike
  rationale: Kitenzi kinaeleza kuitwa au kukusanywa kwa ajili ya hatua ya pamoja. Ingawa אִישׁ ni umbo la umoja, kitenzi cha wingi kinachofuata kinaonyesha kuwa usemi huo una maana ya jamii nzima ya Waefraimu.
- source_word: וַיַּעֲבֹר
  choice: wakavuka
  rationale: Umbo la Kiebrania ni la umoja kwa sababu ya kiima cha kijamii, lakini muktadha na kitenzi cha wingi kinachofuata vinaonyesha kuwa Waefraimu ndio waliovuka kwa pamoja.
- source_word: צָפוֹנָה
  choice: kwenda Safoni
  rationale: Neno limechukuliwa kuwa jina la mahali, Safoni, ambalo linafaa katika simulizi la mwendo wa kijeshi; uwezekano wa maana ya ‘kuelekea kaskazini’ umehifadhiwa katika tanbihi.
- source_word: לְהִלָּחֵם בִּבְנֵי עַמּוֹן
  choice: kwenda kupigana na Waamoni
  rationale: ‘Waamoni’ ni namna ya kawaida ya Kiswahili ya kutaja ‘wana wa Amoni,’ na ‘kupigana na’ ni usemi wa asili na ulio wazi.
- source_word: וְלָנוּ לֹא קָרָאתָ לָלֶכֶת עִמָּךְ
  choice: bila kutuita twende pamoja nawe
  rationale: Hutoa kwa Kiswahili cha kawaida malalamiko kwamba hawakuitwa washiriki katika vita, bila kuongeza wazo la mwaliko wa hiari.
- source_word: בֵּיתְךָ נִשְׂרֹף עָלֶיךָ בָּאֵשׁ
  choice: Tutateketeza nyumba yako kwa moto ukiwa ndani yake
  rationale: Hutoa tishio hilo kwa Kiswahili cha sasa na kinachoeleweka, huku picha halisi ya Kiebrania ya kuichoma nyumba ‘juu yako’ ikielezwa katika tanbihi.
