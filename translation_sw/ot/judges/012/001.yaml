translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wazi na hadhi inayofaa maandiko. ‘Yeftha,’ ‘Efraimu,’ ‘Waamoni,’ na ‘Safoni’ yametumiwa kama maumbo ya majina yanayoeleweka katika Kiswahili cha Biblia. Uambiguous wa jina Safoni/mwelekeo wa kaskazini na picha halisi ya tishio umehifadhiwa kwa tanbihi.
