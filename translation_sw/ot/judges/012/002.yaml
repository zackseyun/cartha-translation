translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mapambano” yanafaa kwa muktadha wa uhasama bila kuamua kimya kimya ikiwa רִיב ni ugomvi, mgogoro, au vita kamili; tanbihi inadumisha muundo na utata wa usemi wa Kiebrania.
