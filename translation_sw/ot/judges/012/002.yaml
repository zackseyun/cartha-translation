base_translation:
  language: en
  yaml_path: translation/ot/judges/012/002.yaml
  text: Jephthah said to them[a], “I and my people were in a bitter conflict with the Ammonites, and I called out to you, but you did not save me from their hand.”
translation:
  language: sw
  text: Yeftha akawaambia, “Mimi na watu wangu tulikuwa katika mapambano makali sana[a] na Waamoni. Niliwaita mnisaidie, lakini hamkuniokoa kutoka mikononi mwao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri iliyo karibu zaidi na muundo wa Kiebrania: “Nilikuwa mtu wa ugomvi, mimi na watu wangu, na Waamoni, sana.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ רִיב הָיִיתִי ... מְאֹד
  choice: tulikuwa katika mapambano makali sana
  rationale: Kirai אִישׁ רִיב ni cha kinahau na, pamoja na kitenzi היה, kinaeleza hali ya Yeftha na watu wake badala ya tabia yake tu. “Mapambano makali sana” ni Kiswahili cha kawaida kinachowasilisha רִיב pamoja na msisitizo wa מְאֹד bila kulazimisha muundo usio wa kawaida wa Kiebrania.
- source_word: וְעַמִּי
  choice: na watu wangu
  rationale: עַם humaanisha kwa kawaida “watu.” Hakuna sababu ya kuibana maana iwe “jeshi langu” pekee.
- source_word: וּבְנֵי עַמּוֹן
  choice: Waamoni
  rationale: “Waamoni” ndilo jina la kawaida la Kiswahili kwa בני עמון, na ni la asili zaidi kuliko tafsiri ya neno kwa neno “wana wa Amoni.”
- source_word: וָאֶזְעַק אֶתְכֶם
  choice: Niliwaita mnisaidie
  rationale: זעק hapa ni mwito wa kutaka msaada. Tafsiri hii ni ya kawaida katika Kiswahili na inaweka wazi maana inayodokezwa na muktadha bila kuongeza aina maalumu ya msaada.
- source_word: וְלֹא הוֹשַׁעְתֶּם אוֹתִי
  choice: lakini hamkuniokoa
  rationale: Hiphili ya ישׁע ina maana ya kuokoa au kukomboa kutoka hatarini. “Kuokoa” ni ya moja kwa moja na haifanyi tukio hili la kijeshi kuwa kauli maalumu ya kiteolojia.
- source_word: מִיָּדָם
  choice: kutoka mikononi mwao
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya kuwa chini ya mkono, yaani nguvu au mamlaka ya mwingine, na bado inaeleweka kwa urahisi katika Kiswahili.
