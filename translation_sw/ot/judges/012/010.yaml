lexical_decisions:
- source_word: וַיָּמָת
  choice: Kisha ... akafa
  rationale: Waw ya mfululizo inaendeleza simulizi; “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida, na kitenzi מוּת hapa humaanisha kufa.
- source_word: אִבְצָן
  choice: Ibzani
  rationale: Jina la mtu limetoholewa kwa namna inayofaa matamshi na tahajia ya Kiswahili.
- source_word: וַיִּקָּבֵר
  choice: akazikwa
  rationale: Umbo la Nifali lina maana ya kutendwa hapa; “akazikwa” ni tafsiri ya kawaida na wazi.
- source_word: בְּבֵית לָחֶם
  choice: huko Bethlehemu
  rationale: Kihusishi בְּ kinaonyesha mahali. “Huko” hurejelea kwa kawaida mahali palipotajwa, na Bethlehemu ni utohozi unaotambulika wa jina hilo.
