lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: akawa mwamuzi wa
  rationale: Katika kitabu cha Waamuzi, kitenzi שׁפט humaanisha kutenda kazi ya mwamuzi kwa kutawala au kuongoza Israeli. Kauli hii ni ya asili katika Kiswahili na inadumisha istilahi ya mara kwa mara ya kitabu bila kuifanya kuwa hukumu ya kesi tu.
- source_word: אַחֲרָיו
  choice: Baada yake
  rationale: Inaonyesha kwamba Ibzani alimfuata mwamuzi aliyemtangulia. Kiwakilishi kinahifadhi rejeo la Kiebrania bila kuingiza jina lisilotajwa katika mstari huu.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israeli
  rationale: Israeli ndiye aliyekuwa chini ya uamuzi au utawala wa Ibzani; alama ya Kiebrania ya yambwa mahsusi haihitaji kutafsiriwa kando katika Kiswahili.
- source_word: אִבְצָן
  choice: Ibzani
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida na linalotamkika kwa urahisi katika Kiswahili.
- source_word: מִבֵּית לָחֶם
  choice: kutoka Bethlehemu
  rationale: Kihusishi מִן kwa kawaida huonyesha asili au mahali mtu alikotoka. “Kutoka Bethlehemu” ni Kiswahili cha kawaida, huku uwezekano wa maana ya uhusiano ukihifadhiwa katika tanbihi.
