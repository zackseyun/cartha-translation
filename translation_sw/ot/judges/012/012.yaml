base_translation:
  language: en
  yaml_path: translation/ot/judges/012/012.yaml
  text: Then Elon the Zebulunite died[a], and he was buried in Aijalon, in the land of Zebulun.
translation:
  language: sw
  text: Kisha Eloni, Mzabuloni, akafa, naye akazikwa huko Ayaloni, katika eneo la Zabuloni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Kisha ... akafa
  rationale: Kitenzi cha mfululizo wa masimulizi kinaendeleza tukio linalofuata; “Kisha” ni cha asili katika Kiswahili na kinahifadhi maana rahisi ya kufa.
- source_word: אֵלוֹן
  choice: Eloni
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayotumika kwa kawaida katika Kiswahili.
- source_word: הַזְּבוּלֹנִי
  choice: Mzabuloni
  rationale: Nomino hii ya nasaba au eneo humtambulisha Eloni kuwa wa kabila la Zabuloni; “Mzabuloni” ni umbo fupi na la kawaida la Kiswahili.
- source_word: וַיִּקָּבֵר
  choice: naye akazikwa
  rationale: Nifali ya קבר ina maana ya kutendwa, “alizikwa.” Kiunganishi “naye” kinaendeleza masimulizi kwa ufasaha bila kuongeza maana mpya.
- source_word: בְּאַיָּלוֹן
  choice: huko Ayaloni
  rationale: Jina la mahali limetoholewa kuwa “Ayaloni”; “huko” linaonyesha wazi kuwa ni mahali alipozikwa.
- source_word: בְּאֶרֶץ זְבוּלֻן
  choice: katika eneo la Zabuloni
  rationale: אֶרֶץ hapa hurejelea eneo la kabila la Zabuloni. “Eneo” huepuka dhana ya taifa huru inayoweza kuletwa na “nchi,” huku ikihifadhi maana ya kijiografia.
