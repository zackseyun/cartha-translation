  text: Jephthah judged Israel six years[a]. Then Jephthah the Gileadite died and was buried in the cities of Gilead.
translation:
  language: sw
  text: Yefta alikuwa mwamuzi wa Israeli kwa miaka sita. Kisha Yefta, Mgileadi, akafa na akazikwa katika miji ya Gileadi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “katika miji ya Gileadi.” Wingi huo huenda umetumiwa kinahau kumaanisha mji fulani usiotajwa katika eneo hilo.'
    reason: Ufafanuzi wa uwezekano wa maana ya wingi wa Kiebrania bila kuubadili katika maandishi makuu.
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: akawa mwamuzi wa
  rationale: Katika kitabu cha Waamuzi, kitenzi hiki hueleza kazi ya mwamuzi-mkombozi juu ya Israeli. Kauli hii huhifadhi istilahi kuu ya kitabu bila kudokeza kwamba Yeftha aliwahukumia Israeli adhabu.
- source_word: שֵׁשׁ שָׁנִים
  choice: kwa miaka sita
  rationale: Ni kirai cha moja kwa moja kinachoonyesha muda.
- source_word: הַגִּלְעָדִי
  choice: Mgileadi
  rationale: Umbo hili la kieneo linamtambulisha Yeftha kuwa mtu wa Gileadi; “Mgileadi” ni kifupi na cha kawaida katika mtindo wa majina ya watu wa maeneo.
- source_word: וַיִּקָּבֵר
  choice: kuzikwa
  rationale: Huhifadhi hali tendwa ya kitenzi cha Kiebrania na ni usemi wa kawaida wa Kiswahili katika taarifa ya kifo na maziko.
- source_word: בְּעָרֵי גִלְעָד
  choice: katika miji ya Gileadi
  rationale: Tafsiri hii huhifadhi wingi ulio wazi katika maandishi ya Kiebrania badala ya kuamua kimya kimya kuwa ulikusudia mji mmoja usiotajwa.
