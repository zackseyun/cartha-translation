  text: וַ/יְהִי ל֞/וֹ שְׁלֹשִׁ֣ים בָּנִ֗ים וּ/שְׁלֹשִׁ֤ים בָּנוֹת֙ שִׁלַּ֣ח הַ/ח֔וּצָ/ה וּ/שְׁלֹשִׁ֣ים בָּנ֔וֹת הֵבִ֥יא לְ/בָנָ֖י/ו מִן הַ/ח֑וּץ וַ/יִּשְׁפֹּ֥ט אֶת יִשְׂרָאֵ֖ל שֶׁ֥בַע שָׁנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/009.yaml
  text: He had thirty sons[a], and thirty daughters he sent away, and he brought in thirty daughters from outside for his sons. And he judged Israel seven years.
translation:
  language: sw
  text: Alikuwa na wana thelathini na binti thelathini. Aliwapeleka binti zake nje[a], naye akawaleta binti thelathini kutoka nje kwa ajili ya wanawe. Alihudumu kama mwamuzi wa Israeli kwa miaka saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa ufafanuzi zaidi, “aliwaoza binti zake thelathini nje ya ukoo au nyumba yake, naye akawaleta wanawake thelathini kutoka nje wawe wake wa wanawe.” Kiebrania kinasema kihalisi “binti” katika sehemu zote mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Alikuwa na
  rationale: Muundo wa Kiebrania היה + ל unaonyesha umilikaji; “alikuwa na” ni Kiswahili cha kawaida na sahihi.
- source_word: שְׁלֹשִׁים בָּנִים
  choice: wana thelathini
  rationale: Ni tafsiri ya moja kwa moja ya idadi na neno la jinsia ya kiume; “wana” pia hudumisha uhusiano wake na “wanawe” baadaye katika mstari.
- source_word: וּשְׁלֹשִׁים בָּנוֹת
  choice: binti thelathini
  rationale: “Binti” ni tafsiri ya kawaida ya בנות katika muktadha huu na inadumisha neno lilelile linalorudiwa katika Kiebrania.
- source_word: שִׁלַּח הַחוּצָה
  choice: Aliwapeleka binti zake nje
  rationale: “Aliwapeleka ... nje” inadumisha maana ya msingi ya ‘kutuma/kupeleka kuelekea nje’ bila kufanya tafsiri ya ndoa kuwa sehemu ya lazima ya matini kuu. “Binti zake” huweka wazi kiwakilishi kinawarejelea kina nani.
- source_word: וּשְׁלֹשִׁים בָּנוֹת הֵבִיא לְבָנָיו מִן הַחוּץ
  choice: naye akawaleta binti thelathini kutoka nje kwa ajili ya wanawe
  rationale: Tafsiri hii inadumisha kurudiwa kwa “binti” katika Kiebrania na mwelekeo unaokinzana wa kupeleka nje na kuleta kutoka nje. Muktadha unaashiria kuwa waliletwa wawe wake za wanawe, lakini matini kuu haisemi hilo moja kwa moja.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: Akawa mwamuzi wa Israeli
  rationale: Katika kitabu cha Waamuzi, kitenzi שׁפט humaanisha kutekeleza kazi ya mwamuzi wa Israeli. Usemi huu ni wa asili zaidi katika Kiswahili cha sasa kuliko “aliihukumu Israeli,” ambalo linaweza kueleweka kama kutoa hukumu ya adhabu.
- source_word: שֶׁבַע שָׁנִים
  choice: kwa miaka saba
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha muda aliotumikia kama mwamuzi.
theological_decisions:
- issue: Iwapo binti walipelekwa na kuletwa kwa kusudi la ndoa
  choice: Matini kuu inadumisha lugha ya kupeleka nje na kuleta kutoka nje; maelezo ya ndoa yanawekwa katika tanbihi.
  alternative: Kutafsiri moja kwa moja kwamba aliwaoza binti zake nje ya ukoo wake na kuwaletea wanawe wake kutoka nje.
  rationale: Muktadha unaunga mkono kwa nguvu mpangilio wa ndoa, lakini Kiebrania kinatumia maneno “binti” na “peleka/leta” bila kutaja wazi kuoa au kuolewa. Kutenganisha matini kuu na tanbihi kunadumisha tofauti hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi zimegawanywa ili kuepuka msongamano, huku urudiaji wa “binti” na utofauti wa “nje/kutoka nje” ukidumishwa. “Mwamuzi” huhifadhi istilahi kuu ya kitabu bila kuleta dhana potovu ya hukumu ya adhabu.
