review_pass:
  verdict: revise
  source_fidelity: Draft accurately preserves the singular addressee in the first clause, the plural addressees later, Yahweh’s agency, the life-risk idiom, and the military setting. However, “hukuja kutuokoa” means “you did not come to save us,” whereas the Hebrew participle more directly describes a lack of ongoing/effective deliverance. The proposed revision better represents this with “hukuwa unatuokoa.”
  naturalness: The revision uses smoother sequential narrative verbs (“nikaweka … nikavuka”) and a more idiomatic Swahili expression for the Hebrew idiom (“maisha yangu mikononi mwangu”).
  terminology: “Yahwe,” “Waamoni,” and “kuokoa” are appropriate Standard East African Swahili renderings. The footnote retains the literal Hebrew imagery and explains its idiomatic force without imposing interpretation.
  issues:
  - severity: medium
    issue: Aspect and sense of “hukuja kutuokoa”
    rationale: This wording says that the addressee failed to come in order to rescue them. Hebrew אֵינְךָ מוֹשִׁיעַ is better conveyed as “hukuwa unatuokoa,” describing failure to deliver/help.
  - severity: low
    issue: Sequential action is expressed with an infinitive
    rationale: “Nikaweka … na kuvuka” is understandable, but “nikaweka … nikavuka” more naturally reflects the two consecutive Hebrew wayyiqtol actions.
  revised_text: Nilipoona kwamba hukuwa unatuokoa, nikaweka maisha yangu mikononi mwangu[a] nikavuka kwenda kupigana na Waamoni. Yahwe akawatia mikononi mwangu. Basi, kwa nini mmekuja kunivamia leo ili mpigane nami?
  revised_footnotes:
  - marker: a
    text: Kwa Kiebrania, “nikaweka maisha yangu mikononi mwangu,” ni nahau yenye maana ya “nikahatarisha maisha yangu.”
    reason: cultural_note
  revision_rationale: Revised the first clause to represent the Hebrew participial sense of not delivering rather than not coming to deliver. Smoothed the consecutive actions and used the established Swahili plural expression “maisha yangu mikononi mwangu” for the literal idiom. The plural address in “mmekuja” and “mpigane” deliberately preserves the Hebrew shift from singular in the first accusation to plural in the final question.
