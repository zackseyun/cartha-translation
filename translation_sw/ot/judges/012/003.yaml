revisions:
- from: Nilipoona kwamba hukuja kutuokoa, nikaweka uhai wangu mkononi mwangu[a] na kuvuka kwenda kupigana na Waamoni. Yahwe akawatia mkononi mwangu. Basi, kwa nini mmekuja kunishambulia leo ili kupigana nami?
  to: Nilipoona kwamba hukuwa unatuokoa, nikaweka maisha yangu mikononi mwangu[a] nikavuka kwenda kupigana na Waamoni. Yahwe akawatia mikononi mwangu. Basi, kwa nini mmekuja kunivamia leo ili mpigane nami?
  rationale: Revised the first clause to represent the Hebrew participial sense of not delivering rather than not coming to deliver. Smoothed the consecutive actions and used the established Swahili plural expression “maisha yangu mikononi mwangu” for the literal idiom. The plural address in “mmekuja” and “mpigane” deliberately preserves the Hebrew shift from singular in the first accusation to plural in the final question.
  reviewer_model: gpt-5.6-terra
