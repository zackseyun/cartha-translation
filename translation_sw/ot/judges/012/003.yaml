  variant: Standard East African Swahili
source:
  edition: WLC
  text: וָֽ/אֶרְאֶ֞ה כִּֽי אֵינְ/ךָ֣ מוֹשִׁ֗יע וָ/אָשִׂ֨ימָ/ה נַפְשִׁ֤/י בְ/כַפִּ/י֙ וָֽ/אֶעְבְּרָ/ה֙ אֶל בְּנֵ֣י עַמּ֔וֹן וַ/יִּתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדִ֑/י וְ/לָ/מָ֞ה עֲלִיתֶ֥ם אֵלַ֛/י הַ/יּ֥וֹם הַ/זֶּ֖ה לְ/הִלָּ֥חֶם בִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/003.yaml
  text: When I saw that you were not delivering us[a], I put my life in my hand and crossed over against the Ammonites, and Yahweh gave them into my hand. So why have you come up against me today to fight against me?
translation:
  language: sw
  text: Nilipoona kwamba hukuwa unatuokoa, nikaweka maisha yangu mikononi mwangu[a] nikavuka kwenda kupigana na Waamoni. Yahwe akawatia mikononi mwangu. Basi, kwa nini mmekuja kunivamia leo ili mpigane nami?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “nikaweka maisha yangu mikononi mwangu,” ni nahau yenye maana ya “nikahatarisha maisha yangu.”
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶרְאֶה כִּי אֵינְךָ מוֹשִׁיע
  choice: Nilipoona kwamba hukuja kutuokoa
  rationale: Muundo huu unaonyesha mtiririko wa wakati na sababu. Kitenzi מוֹשִׁיע kinamaanisha kuokoa au kukomboa katika hatari ya kijeshi; kiwakilishi cha yule anayeambiwa ni cha umoja, nacho kimehifadhiwa katika “hukuja,” huku “tu-” ikiwakilisha yambwa inayoeleweka kutokana na muktadha.
- source_word: וָאָשִׂימָה נַפְשִׁי בְכַפִּי
  choice: nikaweka uhai wangu mkononi mwangu
  rationale: Tafsiri hii inadumisha taswira halisi ya nahau ya Kiebrania badala ya kuibadilisha moja kwa moja kuwa “nikahatarisha maisha yangu”; maana ya nahau imefafanuliwa katika tanbihi.
- source_word: וָאֶעְבְּרָה אֶל בְּנֵי עַמּוֹן
  choice: na kuvuka kwenda kupigana na Waamoni
  rationale: עבר inaonyesha kuvuka au kusonga kuelekea upande mwingine, na muktadha wa vita unaonyesha kuwa mwendo huo ulikuwa wa kushambulia. “Waamoni” ni jina la kawaida la kisasa la watu wa Amoni.
- source_word: וַיִּתְּנֵם יְהוָה בְּיָדִי
  choice: Yahwe akawatia mkononi mwangu
  rationale: Usemi wa ushindi “kuwatia mkononi” unahifadhi sitiari ya Kiebrania ya kuwaweka adui chini ya mamlaka ya mshindi.
- source_word: וְלָמָה עֲלִיתֶם אֵלַי הַיּוֹם הַזֶּה
  choice: Basi, kwa nini mmekuja kunishambulia leo
  rationale: Katika muktadha wa kijeshi, עלה אֶל ina maana ya kuja au kupanda dhidi ya mtu. “Kunishambulia” huonyesha uhasama unaothibitishwa na kishazi kinachofuata, huku “leo” ikiwa Kiswahili cha kawaida cha הַיּוֹם הַזֶּה.
- source_word: לְהִלָּחֶם בִּי
  choice: ili kupigana nami
  rationale: Kitenzi לחם pamoja na ב hapa kinaonyesha kupigana dhidi ya Yeftha; “kupigana nami” ni usemi wa kawaida na wazi katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina la agano יְהוָה. “Yahwe” hulitaja kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Kubadilika kutoka umoja kwenda wingi katika wanaoambiwa
  choice: “hukuja” kisha “mmekuja”
  alternative: 'Kusawazisha zote kuwa wingi: “hamkuja ... mmekuja”'
  rationale: Kiebrania cha WLC kina אֵינְךָ cha umoja katika shtaka la kwanza lakini עֲלִיתֶם cha wingi katika swali linalofuata. Tafsiri imehifadhi badiliko hilo badala ya kulitatua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi umetumia viunganishi vya kawaida vya Kiswahili, huku nahau kuu na badiliko la idadi ya wanaoambiwa vikihifadhiwa kwa uaminifu.
