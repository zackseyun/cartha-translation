  yaml_path: translation/ot/judges/018/012.yaml
  text: They went up and camped at Kiriath-jearim in Judah. Therefore that place has been called Mahaneh-dan to this day; behold, it is west of Kiriath-jearim.
translation:
  language: sw
  text: Wakapanda, wakapiga kambi Kiriath-yearimu katika Yuda. Kwa hiyo waliita mahali hapo Mahane-dani mpaka leo; tazama, hapo ndipo magharibi mwa Kiriath-yearimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “nyuma ya Kiriath-yearimu”; katika matumizi ya kijiografia ya muktadha huu, usemi huo hueleweka kuwa magharibi mwa.'
    reason: Huhifadhi usemi wa moja kwa moja wa Kiebrania na kuonyesha msingi wa tafsiri ya kijiografia katika maandishi.
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Wakapanda
  rationale: Kitenzi cha Kiebrania kinamaanisha kupanda au kwenda juu; tafsiri ya moja kwa moja inafaa hapa bila kulazimisha sababu ya safari.
- source_word: קִרְיַת יְעָרִים
  choice: Kiriath-yearimu
  rationale: Jina la mahali limeandikwa kwa namna inayokaribia matamshi ya Kiebrania na kubaki wazi kwa msomaji wa Kiswahili.
- source_word: מַחֲנֵה דָן
  choice: Mahane-dani
  rationale: Jina la mahali limehifadhiwa kama jina maalumu badala ya kutafsiriwa katika maandishi kuwa “Kambi ya Dani.”
- source_word: אַחֲרֵי
  choice: magharibi mwa
  rationale: Neno hilo kihalisi ni “nyuma ya,” lakini katika maelekezo ya kijiografia ya Kiebrania “nyuma” mara nyingi huelekeza upande wa magharibi; tanbihi inahifadhi maana yake ya moja kwa moja.
