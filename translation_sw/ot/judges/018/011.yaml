  yaml_path: translation/ot/judges/018/011.yaml
  text: So six hundred men from the clan of the Danites set out from there[a], from Zorah and from Eshtaol[b], armed with weapons of war.
translation:
  language: sw
  text: Basi, wanaume mia sita wa ukoo[a] wa Wadani wakaondoka kutoka huko, kutoka Sora na Eshtaoli, wakiwa wamejihami kwa silaha za vita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa.” Neno la Kiebrania linamaanisha kundi la kindugu lililo ndani ya kabila.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “wakiwa wamejifunga silaha za vita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: wakaondoka
  rationale: Kitenzi נסע katika simulizi kinaonyesha kuondoka mahali na kuanza safari; “wakaondoka” ni Kiswahili cha kawaida na chenye mtiririko mzuri.
- source_word: מִשָּׁם
  choice: huko
  rationale: Hiki ni kielezi cha mahali kinachorejelea eneo lililotajwa katika muktadha; “huko” huwasilisha maana yake kwa ufupi na kwa kawaida.
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: wa ukoo wa Wadani
  rationale: מִשְׁפָּחָה hapa ni kundi la kindugu lililo ndani ya kabila, si lazima familia moja ndogo wala kabila lote; “ukoo” linafaa kwa ngazi hiyo ya undugu.
- source_word: מִצָּרְעָה וּמֵאֶשְׁתָּאֹל
  choice: kutoka Sora na Eshtaoli
  rationale: Majina ya mahali yametoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili; kihusishi “kutoka” kinaonyesha chanzo cha safari.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: wanaume mia sita
  rationale: אִישׁ pamoja na idadi humaanisha wanaume wanaohesabiwa; mazingira ya kijeshi yanaunga mkono tafsiri mahususi ya “wanaume.”
- source_word: חָגוּר כְּלֵי מִלְחָמָה
  choice: wakiwa wamejihami kwa silaha za vita
  rationale: חָגוּר kihalisi huhusu kujifunga kitu kiunoni, lakini hapa inaonyesha kuwa walikuwa tayari kwa mapigano wakiwa na zana za kijeshi; “wamejihami” ni ya asili na huhifadhi wazo la utayari wa vita.
