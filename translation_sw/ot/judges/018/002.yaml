  text: וַ/יִּשְׁלְח֣וּ בְנֵי דָ֣ן מִֽ/מִּשְׁפַּחְתָּ֡/ם חֲמִשָּׁ֣ה אֲנָשִׁ֣ים מִ/קְצוֹתָ/ם֩ אֲנָשִׁ֨ים בְּנֵי חַ֜יִל מִ/צָּרְעָ֣ה וּ/מֵֽ/אֶשְׁתָּאֹ֗ל לְ/רַגֵּ֤ל אֶת הָ/אָ֨רֶץ֙ וּ/לְ/חָקְרָ֔/הּ וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם לְכ֖וּ חִקְר֣וּ אֶת הָ/אָ֑רֶץ וַ/יָּבֹ֤אוּ הַר אֶפְרַ֨יִם֙ עַד בֵּ֣ית מִיכָ֔ה וַ/יָּלִ֖ינוּ שָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/002.yaml
  text: So the sons of Dan sent five men from their clan[a], from among their whole number, valiant men from Zorah and from Eshtaol, to spy out the land and to explore it. And they said to them, “Go, explore the land.” So they came to the hill country of Ephraim, as far as the house of Micah[c][b], and spent the night there.
translation:
  language: sw
  text: Basi wana wa Dani wakawatuma watu watano kutoka katika ukoo wao, miongoni mwao wote,[a] watu hodari kutoka Sora na Eshtaoli, ili kuipeleleza nchi na kuichunguza. Wakawaambia, “Nendeni mkaichunguze nchi.” Basi wakafika katika nchi ya vilima ya Efraimu, mpaka kwenye nyumba ya Mika,[b] wakalala huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina usemi ambao, neno kwa neno, unaweza kuwa “kutoka katika ncha zao”; katika muktadha huu unaeleza kwamba watu hao walitoka miongoni mwa kundi lao lote.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya Mika” huenda ikamaanisha pia makazi ya kaya nzima ya Mika.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי דָן
  choice: wana wa Dani
  rationale: Huhifadhi nahau ya kifamilia ya Kiebrania inayolitaja kabila la Dani, huku ikiwa wazi na ya kawaida katika Kiswahili cha Biblia.
- source_word: מִמִּשְׁפַּחְתָּם
  choice: kutoka katika ukoo wao
  rationale: מִשְׁפָּחָה hapa ni kundi la kindugu ndani ya kabila; “ukoo” ni sahihi zaidi kuliko “familia” ya nyumbani au “kabila” lote.
- source_word: מִקְצוֹתָם
  choice: waliochaguliwa miongoni mwao
  rationale: Nahau hii inaonyesha kwamba watu hao walitolewa katika kundi lote. “Waliochaguliwa miongoni mwao” hutoa maana hiyo kwa Kiswahili cha kawaida bila kutafsiri neno kwa neno kwa namna isiyoeleweka.
- source_word: אֲנָשִׁים בְּנֵי חַיִל
  choice: watu hodari
  rationale: בְּנֵי חַיִל inaweza kumaanisha watu wenye nguvu, uwezo, ushujaa au uhodari. “Watu hodari” inadumisha upana huo na inafaa kwa jukumu la upelelezi.
- source_word: לְרַגֵּל
  choice: kuipeleleza
  rationale: Kitenzi hiki kinamaanisha kufanya upelelezi wa nchi kwa kusudi maalumu; “kuipeleleza” ni tafsiri ya moja kwa moja na ya asili.
- source_word: וּלְחָקְרָהּ / חִקְרוּ
  choice: kuichunguza / mkaichunguze
  rationale: Mzizi חקר unasisitiza kuchunguza kwa makini. Kurudia “chunguza” kunahifadhi uhusiano wa kileksia kati ya maagizo na kusudi la safari.
- source_word: הַר אֶפְרַיִם
  choice: nchi ya vilima ya Efraimu
  rationale: Usemi huu unarejelea eneo la nyanda za juu la Efraimu, si mlima mmoja.
- source_word: עַד בֵּית מִיכָה
  choice: mpaka kwenye nyumba ya Mika
  rationale: עַד inaonyesha kikomo cha safari, na בֵּית מִיכָה kwa msingi ni “nyumba ya Mika,” ingawa inaweza kuwa makazi mapana ya kaya yake.
- source_word: וַיָּלִינוּ שָׁם
  choice: wakalala huko
  rationale: Kitenzi לון hapa kinamaanisha kukaa mahali usiku; “wakalala huko” ni kifupi, wazi na cha kawaida.
