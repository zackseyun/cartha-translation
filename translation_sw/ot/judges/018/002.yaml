translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa masimulizi, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Majina yametolewa kama Dani, Sora, Eshtaoli, Efraimu na Mika. Tafsiri inadumisha tofauti kati ya “kupeleleza” na “kuchunguza” katika maandishi ya Kiebrania.
