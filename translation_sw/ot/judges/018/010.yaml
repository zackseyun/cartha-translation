base_translation:
  language: en
  yaml_path: translation/ot/judges/018/010.yaml
  text: When you go[a], you will come to a secure people, and the land is broad; for God has given it into your hand[b], a place where there is no lack of anything that is in the land.
translation:
  language: sw
  text: Mtakapowasili, mtawafikia watu wanaoishi kwa usalama[a], nayo nchi ni pana[b]; kwa maana Mungu ameitia mikononi mwenu—mahali ambapo hakuna upungufu wa kitu chochote kilicho katika nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wanaojiona salama” au “watu wasiotarajia hatari.” Kiebrania kinaeleza watu wanaoishi wakiwa na hali ya usalama.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “pana kwa mikono,” nahau ya Kiebrania inayomaanisha nchi yenye nafasi kubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/בֹאֲ/כֶם ... תָּבֹאוּ
  choice: Mtakapowasili, mtawafikia
  rationale: Muundo huu unaunganisha hali ya wakati, ‘mtakapowasili,’ na kitenzi kikuu, ‘mtawafikia.’ Tafsiri hii huhifadhi urudiaji wa wazo la kufika bila kutoa Kiswahili kisicho cha kawaida.
- source_word: עַם בֹּטֵחַ
  choice: watu wanaoishi kwa usalama
  rationale: בֹּטֵחַ huonyesha hali ya kuwa salama au kujiona salama. Kauli hii ni ya asili katika Kiswahili na haiongezi moja kwa moja maana ya kutokuwa na tahadhari.
- source_word: וְהָאָרֶץ רַחֲבַת יָדַיִם
  choice: nayo nchi ni pana
  rationale: Kirai cha Kiebrania, ambacho kihalisi kina taswira ya ‘upana wa mikono,’ ni nahau inayomaanisha kuwa nchi ina nafasi kubwa au ni pana. Kiswahili ‘ni pana’ hutoa maana hiyo kwa uwazi.
- source_word: כִּי נְתָנָהּ אֱלֹהִים בְּיֶדְכֶם
  choice: kwa maana Mungu ameitia mikononi mwenu
  rationale: Kitenzi timilifu huwasilisha utoaji huo kama jambo lililohakikishwa katika usemi wa wapelelezi. ‘Ameitia mikononi mwenu’ huhifadhi nahau ya mamlaka au umiliki huku ikisomeka kwa kawaida.
- source_word: מָקוֹם אֲשֶׁר אֵין שָׁם מַחְסוֹר
  choice: mahali pasipokosa
  rationale: Muundo huu unaeleza eneo lisilo na upungufu. ‘Pasipokosa’ ni usemi mfupi, wa kawaida, na wenye heshima katika Kiswahili.
- source_word: כָּל דָּבָר אֲשֶׁר בָּאָרֶץ
  choice: kitu chochote kilicho katika nchi
  rationale: Katika muktadha huu הָאָרֶץ ni nchi au eneo linalozungumziwa, si lazima dunia nzima. Tafsiri hii inadumisha rejeo hilo la kimuktadha.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika usemi huu
  choice: Mungu
  alternative: miungu; mungu fulani
  rationale: Nomino hii inaambatana na kitenzi cha umoja na katika muktadha inamtaja Mungu kuwa ndiye aliyewatia nchi mikononi mwao. ‘Mungu’ ndiyo tafsiri ya kawaida ya umoja bila kuingiza dai la ziada la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyofafanuliwa.
