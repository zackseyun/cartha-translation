  yaml_path: translation/ot/judges/018/021.yaml
  text: So they turned and went on[a], and put the little children, the livestock[b], and the valuables before them.
translation:
  language: sw
  text: Basi wakageuka, wakaondoka, wakaweka watoto wadogo, mifugo, na mali zao mbele yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: wakageuka
  rationale: Kitenzi פנה kina maana ya msingi ya kugeuka; tafsiri hii inadumisha mwendo wa simulizi bila kubainisha upande ambao haukutajwa.
- source_word: וַיֵּלֵכוּ
  choice: wakaondoka
  rationale: הלך hapa huendeleza hatua baada ya kugeuka. Katika Kiswahili cha simulizi, “wakaondoka” huwasilisha kwa kawaida kwamba waliendelea na safari.
- source_word: וַיָּשִׂימוּ
  choice: wakawaweka
  rationale: שים humaanisha kuweka au kupanga. Kiambishi cha ngeli ya watu kinafaa kwa watoto, huku mifugo na mali zikiwa pia vitu vilivyopangwa mbele ya msafara.
- source_word: הַטַּף
  choice: watoto wadogo
  rationale: טף hurejelea watoto wadogo au walio wadogo katika kundi, hasa wasio wapiganaji; “watoto wadogo” huhifadhi dhana ya udogo na hali yao ya kuhitaji ulinzi.
- source_word: הַמִּקְנֶה
  choice: mifugo
  rationale: מקנה ni wanyama wanaofugwa kwa ujumla, si ng’ombe pekee; “mifugo” ndiyo istilahi pana na ya kawaida.
- source_word: הַכְּבוּדָּה
  choice: mali zao
  rationale: כבודה katika muktadha huu ni vitu au mali zinazoweza kusafirishwa. “Mali zao” ni ya kawaida na huepuka maana isiyofaa ya “utukufu.”
- source_word: לִפְנֵיהֶם
  choice: mbele yao
  rationale: Kirai hiki humaanisha kihalisi “mbele yao.” Kiswahili hiki ni cha kawaida na kinahifadhi uwezekano wa maana ya mbele yao au mbele ya kundi kuu.
