base_translation:
  language: en
  yaml_path: translation/ot/judges/018/022.yaml
  text: When they had gone some distance from Micah’s house[a], the men who were in the houses near Micah’s house were called together, and they overtook the sons of Dan.
translation:
  language: sw
  text: Walipokwisha kwenda mbali na nyumba ya Mika, wale wanaume waliokuwa katika nyumba zilizokuwa karibu na nyumba ya Mika walikusanyika[a], wakawafikia wana wa Dani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walipiga yowe la tahadhari.” Kitenzi cha Kiebrania kinaweza kumaanisha ama kupiga kilio cha tahadhari au kukusanyika kunakotokana na kilio hicho.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה הִרְחִיקוּ
  choice: Walipokuwa wamekwenda mbali kidogo
  rationale: Kauli hii ya Kiswahili huonyesha kwamba Wadani walikuwa tayari wameondoka umbali fulani kabla ya wanaume kukusanyika na kuwafuatia; ni ya asili kuliko tafsiri ya neno kwa neno.
- source_word: מִבֵּית מִיכָה
  choice: na nyumba ya Mika
  rationale: Baada ya kitenzi cha kuonyesha kwenda mbali, 'na' huonyesha mahali walipoondoka kwa Kiswahili cha kawaida; umilikaji unaonyeshwa wazi kwa 'nyumba ya Mika.'
- source_word: הָאֲנָשִׁים
  choice: wale wanaume
  rationale: Inahifadhi rejeo mahsusi la Kiebrania kwa wanaume badala ya kulipanua kuwa watu kwa ujumla.
- source_word: אֲשֶׁר בַּבָּתִּים אֲשֶׁר עִם בֵּית מִיכָה
  choice: waliokuwa katika nyumba zilizokuwa karibu na nyumba ya Mika
  rationale: עִם hapa inaonyesha ukaribu au uhusiano wa nyumba jirani; muundo huu ni wazi na wa kawaida huku ukihifadhi kutajwa kwa watu waliokuwa ndani ya nyumba hizo.
- source_word: נִזְעֲקוּ
  choice: walikusanyika
  rationale: Nifali ya זעק inaweza kueleza kuitwa au kujikusanya kwa sababu ya kilio cha tahadhari. Muktadha wa kuwafuatia Wadani unaunga mkono matokeo ya kukusanyika, huku uwezekano wa kupiga yowe la tahadhari ukihifadhiwa katika tanbihi.
- source_word: וַיַּדְבִּיקוּ
  choice: wakawafikia
  rationale: Kitenzi kinaonyesha kuwakamata kwa mwendo au kuwafikia waliokuwa mbele; 'wakawafikia' ni Kiswahili cha asili na hakidai kwamba waliwakamata mateka.
- source_word: אֶת בְּנֵי דָן
  choice: wana wa Dani
  rationale: Inahifadhi usemi rasmi wa ukoo wa Kiebrania badala ya kutumia tu jina la kikabila 'Wadani.'
