  text: וַ/יֵּלְכוּ֙ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֔ים וַ/יָּבֹ֖אוּ לָ֑יְשָׁ/ה וַ/יִּרְא֣וּ אֶת הָ/עָ֣ם אֲשֶׁר בְּ/קִרְבָּ֣/הּ יוֹשֶֽׁבֶת לָ֠/בֶטַח כְּ/מִשְׁפַּ֨ט צִדֹנִ֜ים שֹׁקֵ֣ט וּ/בֹטֵ֗חַ וְ/אֵין מַכְלִ֨ים דָּבָ֤ר בָּ/אָ֨רֶץ֙ יוֹרֵ֣שׁ עֶ֔צֶר וּ/רְחֹקִ֥ים הֵ֨מָּה֙ מִ/צִּ֣דֹנִ֔ים וְ/דָבָ֥ר אֵין לָ/הֶ֖ם עִם אָדָֽם־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/007.yaml
  text: Then the five men went and came to Laish[a], and they saw the people who were in it, dwelling securely, according to the custom of the Sidonians, quiet and secure. And there was no one in the land to humiliate them in anything, possessing authority; and they were far from the Sidonians[c][b], and they had no dealings with anyone.
translation:
  language: sw
  text: Ndipo wale watu watano wakaenda na kufika Laishi. Wakawaona watu waliokuwa humo wakiishi kwa usalama, kwa desturi ya Wasidoni[a], wakiwa watulivu na salama. Hakukuwa na mtu yeyote katika nchi mwenye mamlaka ya kuwadhalilisha kwa jambo lolote[b]. Walikuwa mbali na Wasidoni, wala hawakuwa na shughuli yoyote na mtu yeyote[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa namna ya Wasidoni.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania hapa ni kigumu: kihalisi, takribani, “wala hakuna mwenye kuaibisha jambo katika nchi, mwenye mamlaka.” Huenda maana yake ni kwamba hapakuwa na mtawala au mkandamizaji wa kuwaaibisha au kuwatawala.'
    reason: textual_difficulty
  - marker: c
    text: Au, “hawakuwa na uhusiano wowote,” au “hawakuwa na mapatano yoyote na mtu yeyote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָיְשָׁה
  choice: Laishi
  rationale: Ni jina la mahali; limetoholewa kwa tahajia ya kawaida ya Kiswahili huku likitofautishwa na jina la baadaye, Dani.
- source_word: יוֹשֶׁבֶת לָבֶטַח
  choice: wakiishi kwa usalama
  rationale: Kauli hii ya kawaida ya Kiswahili inaonyesha hali ya kudumu ya kuishi bila hofu.
- source_word: כְּמִשְׁפַּט צִדֹנִים
  choice: kwa desturi ya Wasidoni
  rationale: מִשְׁפָּט hapa inaelekea kumaanisha desturi au mtindo wa maisha, si hukumu ya mahakama.
- source_word: שֹׁקֵט וּבֹטֵחַ
  choice: wakiwa watulivu na salama
  rationale: Inahifadhi jozi ya sifa na msisitizo wa Kiebrania kuhusu utulivu na kutokuwa na hofu.
- source_word: מַכְלִים דָּבָר
  choice: aliyewadhalilisha kwa jambo lolote
  rationale: Hifili ya כלם ina maana ya kusababisha aibu au fedheha; ‘kuwadhalilisha’ ni ya asili na yenye upana unaofaa katika Kiswahili.
- source_word: יוֹרֵשׁ עֶצֶר
  choice: mwenye mamlaka
  rationale: Ni usemi mgumu; uchaguzi huu unadokeza mwenye uwezo wa kutawala au kuzuia bila kuamua kwa uhakika maana isiyo wazi katika Kiebrania.
- source_word: וּרְחֹקִים הֵמָּה מִצִּדֹנִים
  choice: Walikuwa mbali na Wasidoni
  rationale: Inatoa kwa uwazi hali yao ya kutengwa kijiografia na Wasidoni.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: hawakuwa na shughuli yoyote na mtu yeyote
  rationale: Nahau hii inaonyesha kutokuwa na mawasiliano, mahusiano, shughuli, au mapatano na watu wengine; ‘shughuli yoyote’ huhifadhi upana huo.
- source_word: אָדָם
  choice: mtu yeyote
  rationale: Nomino hii imetumiwa kwa maana ya jumla, hivyo ‘mtu yeyote’ ni Kiswahili cha kawaida kuliko ‘mwanadamu’ katika muktadha huu.
theological_decisions:
- issue: Hali ya kisiasa ya Laishi
  choice: Kutoifanya sentensi iseme kwa uhakika kwamba hapakuwa na mtawala au kwamba walikosa serikali kabisa
  alternative: ‘Hakukuwa na mtawala aliyewakandamiza’
  rationale: Kiebrania katika kifungu מַכְלִים דָּבָר ... יוֹרֵשׁ עֶצֶר ni kigumu; tafsiri haipaswi kugeuza uwezekano mmoja wa kisiasa kuwa dai la uhakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida, huku uradidi wa Kiebrania kuhusu usalama ukihifadhiwa na ugumu wa kifungu cha mamlaka ukielezwa katika tanbihi badala ya kutatuliwa kimyakimya.
