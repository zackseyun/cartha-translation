base_translation:
  language: en
  yaml_path: translation/ot/judges/018/020.yaml
  text: And the priest’s heart was glad[a], and he took the ephod, the household idols, and the carved image[b], and went into the midst of the people.
translation:
  language: sw
  text: Moyo wa kuhani ukafurahi, naye akachukua efodi, sanamu za ibada za nyumbani[a], na sanamu iliyochongwa[b], kisha akaingia katikati ya watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “terafimu.” Neno la Kiebrania linarejelea vitu vya ibada au miungu ya nyumbani.
    reason: lexical_alternative
  - marker: b
    text: Au, “sanamu” au “sanamu ya kuchonga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב לֵב הַכֹּהֵן
  choice: Moyo wa kuhani ukafurahi
  rationale: Huhifadhi taswira ya nahau ya Kiebrania, ambayo kihalisi husema kwamba moyo wa kuhani ulikuwa mwema au wenye furaha, huku maana yake ikieleweka kwa Kiswahili cha sasa.
- source_word: הָאֵפוֹד
  choice: efodi
  rationale: Ni istilahi maalumu ya kidini isiyo na kisawe kifupi na sahihi katika Kiswahili; kwa hiyo imetoholewa badala ya kufafanuliwa ndani ya mstari.
- source_word: הַתְּרָפִים
  choice: sanamu za ibada za nyumbani[a]
  rationale: Neno hili linarejelea vitu au miungu ya ibada ya nyumbani. Tafsiri hii inaeleza maana kwa msomaji wa kawaida bila kulifanya neno lionekane kuwa sanamu za mapambo tu.
- source_word: הַפָּסֶל
  choice: sanamu ya kuchonga[b]
  rationale: Huwasilisha kwa uwazi kwamba kitu hicho kilikuwa mfano au sanamu iliyotengenezwa kwa kuchongwa.
- source_word: בְּקֶרֶב הָעָם
  choice: akaingia katikati ya watu
  rationale: Huhifadhi dhana ya mwendo iliyo katika kitenzi pamoja na maana ya kuwa katikati au miongoni mwa watu.
