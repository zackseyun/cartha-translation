source:
  edition: WLC
  text: וַֽ/יַּעֲנ֞וּ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֗ים הַ/הֹלְכִים֮ לְ/רַגֵּל֮ אֶת הָ/אָ֣רֶץ לַיִשׁ֒ וַ/יֹּֽאמְרוּ֙ אֶל אֲחֵי/הֶ֔ם הַ/יְדַעְתֶּ֗ם כִּ֠י יֵ֣שׁ בַּ/בָּתִּ֤ים הָ/אֵ֨לֶּה֙ אֵפ֣וֹד וּ/תְרָפִ֔ים וּ/פֶ֖סֶל וּ/מַסֵּכָ֑ה וְ/עַתָּ֖ה דְּע֥וּ מַֽה תַּעֲשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/014.yaml
  text: Then the five men who had gone to spy out the land of Laish answered and said to their brothers[a], “Do you know that in these houses there are an ephod, teraphim, a carved image, and a cast image? So now[b], know what you will do.”
translation:
  language: sw
  text: Ndipo wale wanaume watano waliokuwa wameenda kuipeleleza nchi ya Laishi wakajibu na kuwaambia ndugu zao, “Je, mnajua kwamba katika nyumba hizi kuna efodi, terafimu[a], sanamu ya kuchonga, na sanamu ya kusubu[b]? Basi sasa, jueni mtakalofanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sanamu za nyumbani” au “miungu ya nyumbani”; neno la Kiebrania linataja vitu vya ibada vilivyohusishwa na nyumba.
    reason: lexical_alternative
  - marker: b
    text: Yaani, sanamu iliyotengenezwa kwa kusubu nyenzo iliyoyeyushwa katika kalibu; tafsiri nyingine husema “sanamu iliyoyeyushwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: wakajibu
  rationale: Huhifadhi fomula ya simulizi ya Kiebrania inayotambulisha itikio, hata kama kauli iliyotangulia haijanukuliwa moja kwa moja.
- source_word: חֲמֵשֶׁת הָאֲנָשִׁים
  choice: wale wanaume watano
  rationale: Hurejelea kwa kawaida kundi la wapelelezi watano lililotajwa awali.
- source_word: הַהֹלְכִים לְרַגֵּל
  choice: waliokuwa wameenda kuipeleleza
  rationale: Hueleza utume wao wa awali ambao tayari ulikuwa umetimizwa katika muktadha wa simulizi.
- source_word: אֶת הָאָרֶץ לַיִשׁ
  choice: nchi ya Laishi
  rationale: אֶרֶץ hapa ni eneo linalohusishwa na mji wa Laishi; “nchi ya Laishi” ni ya kawaida na wazi katika Kiswahili.
- source_word: אֶל אֲחֵיהֶם
  choice: ndugu zao
  rationale: Neno la Kiebrania linamaanisha kihalisi ndugu zao; katika muktadha hawa ni wanaume wenzao wa kabila la Dani.
- source_word: הֲיְדַעְתֶּם
  choice: Je, mnajua
  rationale: Huhifadhi swali la moja kwa moja linalowavuta wasikilizaji kwenye habari itakayochochea hatua.
- source_word: בַּבָּתִּים הָאֵלֶּה
  choice: katika nyumba hizi
  rationale: Hufuata maana ya msingi ya בָּתִּים bila kuamua kama ni makazi ya kawaida au majengo ya eneo la ibada.
- source_word: אֵפוֹד
  choice: efodi
  rationale: Ni kifaa maalumu cha kidini kisicho na kisawe rahisi cha Kiswahili; utohozi huhifadhi upekee wa neno.
- source_word: תְרָפִים
  choice: terafimu
  rationale: Utohozi huhifadhi istilahi mahususi na huepuka kuamua kimya kimya ikiwa vitu hivyo viitwe miungu ya nyumbani au sanamu za nyumbani.
- source_word: פֶסֶל
  choice: sanamu ya kuchonga
  rationale: Hutofautisha kitu kilichotengenezwa kwa kuchongwa na aina nyingine za sanamu katika orodha.
- source_word: מַסֵּכָה
  choice: sanamu ya kumimina
  rationale: Hueleza sanamu iliyotengenezwa kwa kumimina nyenzo iliyoyeyushwa kwenye kalibu na kuitofautisha na sanamu ya kuchonga.
- source_word: דְּעוּ מַה תַּעֲשׂוּן
  choice: amueni mtakalofanya
  rationale: Kihalisi ni “jueni mtakalofanya,” lakini hapa ידע ni agizo la kutafakari na kuamua hatua; “amueni” ni Kiswahili cha kawaida kinachohifadhi nguvu ya wito huo.
theological_decisions:
- issue: Majina ya vifaa vya ibada katika nyumba ya Mika
  choice: Kutofautisha “efodi, terafimu, sanamu ya kuchonga, na sanamu ya kumimina.”
  alternative: “vazi la kikuhani, miungu ya nyumbani, sanamu, na sanamu ya chuma”
  rationale: Matini ya Kiebrania inaorodhesha vitu vinne kwa istilahi tofauti. Tafsiri haivikusanyi vyote chini ya jina moja wala kuongeza hukumu ya kimadhehebu.
- issue: Utambulisho wa תְרָפִים
  choice: terafimu
  alternative: sanamu za nyumbani; miungu ya nyumbani
  rationale: Maana na matumizi mahususi ya vitu hivyo yana kiwango fulani cha kutokuwa wazi; utohozi katika matini na ufafanuzi katika tanbihi huhifadhi hali hiyo.
- issue: Neno la undugu אֲחֵיהֶם
  choice: ndugu zao
  alternative: watu wa kabila lao; wenzao Wadani
  rationale: Huhifadhi taswira ya undugu ya Kiebrania bila kuongeza utambulisho ambao haukutajwa moja kwa moja katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya usimulizi wa Biblia lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “wakajibu na kuwaambia” umehifadhi fomula mbili za Kiebrania, huku “amueni mtakalofanya” ikitoa kwa Kiswahili cha kawaida nguvu ya agizo la mwisho.
