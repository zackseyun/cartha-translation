  terminology: “Mika” ni umbo lililozoeleka katika Kiswahili, “akaniajiri” hutoa maana ya שׂכר kwa usahihi, na “kuhani wake” ni sahihi kwa לְכֹהֵן pamoja na לוֹ. Tanbihi inaeleza nahau bila kuzidisha maana yake.
