  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם כָּ/זֹ֣ה וְ/כָ/זֶ֔ה עָ֥שָׂה לִ֖/י מִיכָ֑ה וַ/יִּשְׂכְּרֵ֕/נִי וָ/אֱהִי ל֖/וֹ לְ/כֹהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/004.yaml
  text: He said to them[a], “Thus and so Micah did for me, and he hired me, and I became his priest.”
translation:
  language: sw
  text: Akawaambia, “Mika alinifanyia mambo haya na haya[a]; akaniajiri, nami nikawa kuhani wake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hivi na hivi”; hii ni nahau ya Kiebrania inayofupisha mambo yaliyokwisha elezwa bila kuyarudia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Akawaambia
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha mfululizo wa simulizi na kwamba aliwaelekezea wao maneno yake.
- source_word: כָּזֹה וְכָזֶה
  choice: mambo haya na haya
  rationale: Nahau hii inarejelea kwa ufupi mambo ambayo tayari yameelezwa bila kuyarudia; tafsiri hii inadumisha hali hiyo ya ujumla kwa Kiswahili cha kawaida.
- source_word: עָשָׂה לִי
  choice: alinifanyia
  rationale: Kiambishi cha mtendewa kinaonyesha yale Mika aliyomfanyia au aliyofanya kwa ajili yake, bila kuongeza hukumu juu ya matendo hayo.
- source_word: מִיכָה
  choice: Mika
  rationale: Hili ndilo umbo la Kiswahili lililozoeleka la jina hili la mtu.
- source_word: וַיִּשְׂכְּרֵנִי
  choice: akaniajiri
  rationale: Kitenzi kinamaanisha kumchukua mtu afanye kazi kwa ujira; 'akaniajiri' pia hudumisha mfululizo wa matukio.
- source_word: וָאֱהִי לוֹ לְכֹהֵן
  choice: nami nikawa kuhani wake
  rationale: Tafsiri hii inaonyesha kuingia katika jukumu jipya la ukuhani lililohusishwa binafsi na Mika.
theological_decisions:
- issue: Hali ya ukuhani katika mazingira ya ibada isiyo ya kawaida
  choice: kuhani wake
  alternative: kuhani kwa ajili yake
  rationale: Kiebrania kinaonyesha kwamba Mlawi alimtumikia Mika katika nafasi ya ukuhani. 'Kuhani wake' hudumisha uhusiano huo bila kutangaza kwamba mpango huo ulikuwa halali au batili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka kwa urahisi. Muundo wa simulizi umetunzwa kwa viambishi vya mfululizo, na nahau ya Kiebrania imewasilishwa kwa njia ya kawaida bila kuondoa ujumla wake.
