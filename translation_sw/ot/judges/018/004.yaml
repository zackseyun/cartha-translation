  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu mfuatano wa Kiebrania: jibu la mhusika kwa hao watu, nahau ya muhtasari כָּזֹה וְכָזֶה, tendo la Mika kwa ajili/kuhusiana naye, kuajiriwa kwake, na kuingia kwake katika nafasi ya kuhani wa Mika. “Akawaambia” ni uwasilishaji wa kawaida wa וַיֹּאמֶר אֲלֵהֶם, na “nami nikawa kuhani wake” huhifadhi maana ya וָאֱהִי לוֹ לְכֹהֵן bila kutoa hukumu kuhusu uhalali wa ibada hiyo.'
