base_translation:
  language: en
  yaml_path: translation/ot/judges/018/025.yaml
  text: And the sons of Dan said to him[a], “Do not let your voice be heard among us, lest men bitter of soul fall upon you[b], and you lose your life and the lives of your household.”
translation:
  language: sw
  text: Wana wa Dani wakamwambia, “Usifanye sauti yako isikike tena kati yetu,[a] la sivyo watu wenye roho ya uchungu[b] watawashambulia, nawe utapoteza maisha yako na maisha ya watu wa nyumba yako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “Usiache sauti yako isikike pamoja nasi.”
    reason: lexical_alternative
  - marker: b
    text: Au “watu wakali,” “watu waliokata tamaa,” au “watu wenye roho yenye uchungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי דָן
  choice: Wana wa Dani
  rationale: Inahifadhi usemi wa Kiebrania wa ukoo na kutambulisha kabila waziwazi kwa Kiswahili cha kawaida.
- source_word: אַל תַּשְׁמַע קוֹלְךָ עִמָּנוּ
  choice: Usiache sauti yako isikike kati yetu
  rationale: Inahifadhi taswira ya Kiebrania ya sauti kusikika huku ikitoa onyo kwa lugha ya Kiswahili inayoeleweka.
- source_word: פֶּן
  choice: la sivyo
  rationale: Katika muktadha huu kiunganishi kinaonyesha matokeo ya kutisha iwapo onyo halitazingatiwa; ‘la sivyo’ ni cha asili na chenye nguvu katika Kiswahili.
- source_word: יִפְגְּעוּ בָכֶם
  choice: watawashambulia
  rationale: Kitenzi hapa kina maana ya kukutana kwa uhasama au kushambulia; tafsiri hii inaweka wazi tishio hilo. Umbo la wingi linawakilisha kiambishi cha Kiebrania kinachomhusisha Mika na watu wake.
- source_word: אֲנָשִׁים מָרֵי נֶפֶשׁ
  choice: watu wenye uchungu wa moyo
  rationale: Inafuata kwa ukaribu nahau ya Kiebrania bila kuifafanua kupita kiasi kuwa ukali, kukata tamaa, au ukatili pekee.
- source_word: וְאָסַפְתָּה נַפְשְׁךָ
  choice: nawe utapoteza maisha yako
  rationale: Nahau ya אסף pamoja na נפש hapa inaonyesha kupoteza uhai, si kukusanya kihalisi.
- source_word: וְנֶפֶשׁ בֵּיתֶךָ
  choice: na maisha ya watu wa nyumba yako
  rationale: Ingawa נפש ni umoja katika Kiebrania, maana yake hapa ni ya kijumla na inawahusu watu wa nyumba yake ambao maisha yao pia yako hatarini.
