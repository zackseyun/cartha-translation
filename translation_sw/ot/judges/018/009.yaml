base_translation:
  language: en
  yaml_path: translation/ot/judges/018/009.yaml
  text: And they said, “Rise up, and let us go up against them, for we have seen the land, and behold, it is very good. And you are keeping silent—do not be sluggish to go, to enter, to take possession of the land.”
translation:
  language: sw
  text: Nao wakasema, “Inukeni, na twende kupigana nao, kwa maana tumeiona nchi, na tazama, ni nzuri sana. Nanyi mmekaa kimya—msichelewe kwenda, kuingia, na kuimiliki nchi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוּמָה
  choice: Inukeni
  rationale: Ingawa umbo la Kiebrania ni amri ya umoja, katika muktadha msemaji analihimiza kundi; Kiswahili cha wingi huwasilisha walengwa kwa kawaida.
- source_word: וְנַעֲלֶה עֲלֵיהֶם
  choice: na twende kupigana nao
  rationale: Kihalisi ni ‘na tupande dhidi yao’; katika simulizi la kijeshi, ‘kwenda kupigana nao’ huonyesha maana ya uhasama bila kudai kwamba mwinuko wa kijiografia ndio hoja kuu.
- source_word: מַחְשִׁים
  choice: mmekaa kimya
  rationale: Huhifadhi taswira ya kukaa kimya, ambayo hapa inadokeza kutotenda, bila kuibadili moja kwa moja kuwa maelezo ya tafsiri.
- source_word: אַל תֵּעָצְלוּ
  choice: msisite
  rationale: Kitenzi kinaonya dhidi ya kuwa wazito, wavivu, au kuchelewa kutenda; ‘msisite’ ni himizo la kawaida la Kiswahili linalofaa muktadha.
- source_word: לָרֶשֶׁת
  choice: kuimiliki
  rationale: Katika muktadha wa nchi, kitenzi kinamaanisha kuitwaa na kuishikilia kama milki; ‘kuimiliki’ ni wazi na ya kawaida.
theological_decisions:
- issue: Kauli ya wapelelezi kuhusu uzuri wa nchi
  choice: ni nzuri sana
  alternative: inafaa sana
  rationale: Tafsiri inahifadhi tathmini ya moja kwa moja ya טוֹבָה מְאֹד bila kuongeza madai ya kiroho au ya kimaadili.
- issue: Mfululizo wa vitenzi vya kwenda, kuingia, na kumiliki
  choice: kwenda, kuingia na kuimiliki nchi
  alternative: kwenda kuimiliki nchi
  rationale: Mfululizo wote umehifadhiwa ili kuonyesha hatua zinazosisitizwa katika Kiebrania na kuepuka kufupisha mvutano wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi msukumo wa hotuba ya kijeshi na taswira ya ‘kukaa kimya,’ huku ikiepuka lugha ya kidhehebu.
