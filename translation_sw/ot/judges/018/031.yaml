base_translation:
  language: en
  yaml_path: translation/ot/judges/018/031.yaml
  text: So they set up for themselves Micah’s carved image that he had made[a], all the days that the house of God was in Shiloh.
translation:
  language: sw
  text: Basi wakajiwekea sanamu ya kuchongwa ya Mika, ambayo Mika alikuwa ameifanya[a], muda wote ambao nyumba ya Mungu ilikuwa Shilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sanamu.” Neno la Kiebrania linamaanisha sanamu iliyotengenezwa kwa kuchongwa kwa matumizi ya ibada; “sanamu ya kuchongwa” inasisitiza jinsi ilivyotengenezwa, huku “sanamu” ikieleza kwa ufupi zaidi kazi yake ya ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: wakajisimamishia
  rationale: Kitenzi hiki kinaonyesha kwamba waliiweka na kuisimamisha kwa matumizi yao wenyewe; umbo la kujitendea linahifadhi maana ya לָהֶם kwa Kiswahili cha kawaida.
- source_word: פֶּסֶל
  choice: sanamu ya kuchongwa
  rationale: Neno hili humaanisha sanamu iliyotengenezwa, hasa kwa kuchongwa, kwa matumizi ya ibada. Tafsiri hii inadumisha maana halisi ya kitu hicho bila kuishia tu katika tafsiri ya kiutendaji ‘sanamu ya kuabudiwa.’
- source_word: מִיכָה
  choice: Mika
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: אֲשֶׁר עָשָׂה
  choice: aliyokuwa ametengeneza
  rationale: Kishazi hiki kinarejelea sanamu ya Mika na kinaonyesha kuwa kuitengeneza kulitangulia kuisimamisha.
- source_word: כָּל יְמֵי
  choice: muda wote ambao
  rationale: Hii ni kauli ya asili na wazi ya Kiswahili inayohifadhi maana endelevu ya kipindi chote kinachotajwa.
- source_word: הֱיוֹת
  choice: ilikuwa
  rationale: Nomino-kitenzi cha Kiebrania katika kishazi cha wakati kimetafsiriwa kwa kitenzi kamili cha Kiswahili.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Hii ni tafsiri ya moja kwa moja inayodumisha kauli ya chanzo bila kuongeza ufafanuzi kama ‘mahali patakatifu’ au ‘Maskani.’
- source_word: בְּשִׁלֹה
  choice: huko Shilo
  rationale: Jina la mahali limetoholewa kwa desturi ya Kiswahili; ‘huko’ linaonyesha mahali panapojulikana katika simulizi.
theological_decisions:
- issue: Tafsiri ya בֵּית הָאֱלֹהִים katika muktadha unaotofautisha ibada ya Dani na kituo cha ibada huko Shilo
  choice: nyumba ya Mungu
  alternative: mahali patakatifu pa Mungu; nyumba ya ibada ya Mungu
  rationale: Kauli ya Kiebrania yenyewe haiongezi maelezo ya hukumu. ‘Nyumba ya Mungu’ inadumisha maneno ya chanzo na mvutano wa simulizi kati ya sanamu ya Dani na kituo cha ibada huko Shilo bila kuufumbua kwa ufafanuzi wa ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Wakajisimamishia’ ni muundo mfupi na wa kawaida unaohifadhi tendo la kuiweka sanamu pamoja na wazo la kufanya hivyo kwa ajili yao wenyewe.
