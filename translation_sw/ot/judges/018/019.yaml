  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ ל֨/וֹ הַחֲרֵ֜שׁ שִֽׂים יָדְ/ךָ֤ עַל פִּ֨י/ךָ֙ וְ/לֵ֣ךְ עִמָּ֔/נוּ וֶֽ/הְיֵה לָ֖/נוּ לְ/אָ֣ב וּ/לְ/כֹהֵ֑ן הֲ/ט֣וֹב הֱיוֹתְ/ךָ֣ כֹהֵ֗ן לְ/בֵית֙ אִ֣ישׁ אֶחָ֔ד א֚וֹ הֱיוֹתְ/ךָ֣ כֹהֵ֔ן לְ/שֵׁ֥בֶט וּ/לְ/מִשְׁפָּחָ֖ה בְּ/יִשְׂרָאֵֽל־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/019.yaml
  text: They said to him[a], “Be quiet; put your hand over your mouth, and come with us, and be to us a father and a priest. Is it better for you to be priest to the house of one man[c][b], or to be priest to a tribe and a clan in Israel?”
translation:
  language: sw
  text: Wakamwambia, “Nyamaza[a]; weka mkono wako juu ya kinywa chako, uende pamoja nasi, uwe baba[b] na kuhani wetu. Je, ni afadhali kwako kuwa kuhani wa nyumba ya mtu mmoja, au kuwa kuhani wa kabila na ukoo[c] katika Israeli?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kaa kimya.” Amri ya Kiebrania inaweza kutafsiriwa “nyamaza” au “kaa kimya.”
    reason: lexical_alternative
  - marker: b
    text: “Baba” hapa ni cheo cha uongozi wa kijamii au kidini, si uhusiano wa uzazi.
    reason: cultural_note
  - marker: c
    text: Au, “jamaa.” Neno la Kiebrania linamaanisha kundi la kindugu ndani ya kabila.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ
  choice: Nyamaza
  rationale: Ni amri ya kuacha kusema. ‘Nyamaza’ ni Kiswahili cha kawaida na cha moja kwa moja kinachohifadhi uzito wa amri ya Kiebrania.
- source_word: שִׂים יָדְךָ עַל־פִּיךָ
  choice: weka mkono wako juu ya kinywa chako
  rationale: Inahifadhi taswira halisi ya ishara ya kujizuia kusema bila kuibadili kuwa maelezo tu.
- source_word: וְהְיֵה לָנוּ לְאָב וּלְכֹהֵן
  choice: uwe baba na kuhani wetu
  rationale: Inahifadhi majukumu yote mawili. ‘Baba’ linaachwa kama cheo chenye maana ya kijamii au kidini, si uhusiano wa uzazi.
- source_word: לְאָב
  choice: baba
  rationale: Tafsiri ya moja kwa moja inalinda maana pana ya cheo hiki na haikifanyi kuwa ‘mshauri’ au ‘kiongozi’ pekee.
- source_word: כֹהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida na linalofaa katika muktadha kwa כהן.
- source_word: הֲטוֹב
  choice: Je, ni afadhali kwako
  rationale: Swali linalinganisha faida ya nafasi mbili; ‘afadhali’ huonyesha ulinganisho huo kwa Kiswahili cha kawaida.
- source_word: לְבֵית אִישׁ אֶחָד
  choice: wa nyumba ya mtu mmoja
  rationale: Inahifadhi neno ‘nyumba,’ ambalo hapa linaweza kumaanisha nyumba au jamaa ya mtu huyo, pamoja na tofauti kati ya mtu mmoja na kundi kubwa la Israeli.
- source_word: לְשֵׁבֶט וּלְמִשְׁפָּחָה בְּיִשְׂרָאֵל
  choice: wa kabila na ukoo katika Israeli
  rationale: ‘Kabila’ na ‘ukoo’ zinatofautisha viwango viwili vya kijamii vya Israeli; ‘ukoo’ linafaa kwa kundi la kindugu ndani ya kabila.
- source_word: עִמָּנוּ
  choice: pamoja nasi
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya mwaliko wa kuandamana nao.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: Wakamwambia
  rationale: Umbo hili la masimulizi ni la asili katika Kiswahili na huhifadhi mwendelezo unaoonyeshwa na kiunganishi cha Kiebrania.
theological_decisions:
- issue: Maana ya ‘baba’ kama cheo
  choice: Kuhifadhi neno halisi ‘baba’ na kulifafanua katika tanbihi.
  alternative: mshauri, mlezi, au kiongozi
  rationale: Kiebrania kinatumia cheo chenye maana pana pamoja na ‘kuhani.’ Kukibadili kuwa cheo mahususi zaidi kungepunguza maana na kuingiza ufafanuzi usiotajwa moja kwa moja.
- issue: Tafsiri ya מִשְׁפָּחָה
  choice: ukoo
  alternative: jamaa au familia
  rationale: ‘Ukoo’ huonyesha kundi la kindugu ndani ya kabila na kudumisha tofauti kati ya nyumba ya mtu mmoja, ukoo, na kabila.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida. Muundo wa amri na swali la kulinganisha umehifadhiwa, huku istilahi za kijamii za Israeli ya kale zikifafanuliwa kwa tanbihi bila kuingiza msimamo wa kimadhehebu.
