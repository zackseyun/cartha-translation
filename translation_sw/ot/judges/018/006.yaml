  yaml_path: translation/ot/judges/018/006.yaml
  text: And the priest said to them[a], “Go in peace. The journey on which you are going is before Yahweh.”
translation:
  language: sw
  text: Kuhani akawaambia, “Nendeni kwa amani. Njia mnayofuata iko mbele ya Yahweh.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Njia yenu iko mbele ya Yahweh,” yaani, safari yenu iko machoni pake. Usemi huu haumaanishi kwa lazima kwamba Mungu ameikubali waziwazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akawaambia
  rationale: Muundo huu unaendeleza simulizi kwa kawaida katika Kiswahili na unajumuisha kiwakilishi cha wale walioambiwa, kama kilivyo katika לָהֶם.
- source_word: הַכֹּהֵן
  choice: Kuhani
  rationale: Nomino hii humrejelea kuhani ambaye tayari ametajwa katika muktadha.
- source_word: לְכוּ
  choice: Nendeni
  rationale: Ni amri ya wingi ya kwenda, inayolingana moja kwa moja na kundi linalozungumziwa.
- source_word: לְשָׁלוֹם
  choice: kwa amani
  rationale: Huhifadhi usemi wa Kiebrania wenye nguvu ya kuwatakia amani wanapoondoka, huku ikiwa Kiswahili cha kawaida na chenye heshima.
- source_word: נֹכַח
  choice: mbele za
  rationale: Huwasilisha maana ya kuwa mbele ya au machoni pa mtu bila kuongeza wazo la kibali, ulinzi, au mafanikio yaliyohakikishwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama Yahweh badala ya kubadilishwa na cheo, hivyo kuhifadhi jina binafsi katika matini.
- source_word: דַּרְכְּכֶם
  choice: Njia
  rationale: Neno hili huhifadhi taswira halisi ya njia na katika muktadha linaweza pia kumaanisha safari yao.
- source_word: אֲשֶׁר תֵּלְכוּ בָהּ
  choice: mnayoiendea
  rationale: Kishazi hiki hurejelea njia wanayofuata na huhifadhi taswira ya kwenda katika njia hiyo kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Nguvu ya kauli ya kuhani kuhusu Yahweh na safari ya Wadani
  choice: “Njia mnayoiendea iko mbele za Yahweh.”
  alternative: “Yahweh anaikubali safari yenu” au “Safari yenu iko chini ya ulinzi wa Yahweh.”
  rationale: Kiebrania נֹכַח יְהוָה kinasema moja kwa moja kwamba njia yao iko mbele za Yahweh, yaani machoni pake. Hakisemi wazi kwamba anaikubali, ameibariki, au amewahakikishia mafanikio; tafsiri inadumisha utata na mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo “mbele za Yahweh” umehifadhiwa ili kutoongeza kibali au ahadi ya mafanikio ambayo Kiebrania haisemi wazi.
