base_translation:
  language: en
  yaml_path: translation/ot/judges/018/001.yaml
  text: In those days there was no king in Israel[a]. And in those days the tribe of the Danites was seeking for itself an inheritance to dwell in[b], because up to that day no inheritance had fallen to it among the tribes of Israel.
translation:
  language: sw
  text: Siku hizo hakukuwa na mfalme katika Israeli. Na siku hizo kabila la Dani lilikuwa likijitafutia urithi ili likae humo, kwa sababu mpaka siku hiyo halikuwa limepata urithi[a] miongoni mwa makabila ya Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania, kwa kawaida: “urithi haukuwa umeangukia.” Hii ni nahau ya kupokea fungu la ardhi kuwa urithi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: hapakuwa na mfalme katika Israeli
  rationale: Ni Kiswahili cha kawaida na chenye hadhi kinachowasilisha ukanushaji wa kuwepo kwa mfalme bila kuongeza tathmini ya kisiasa au ya kiteolojia.
- source_word: שֵׁבֶט הַדָּנִי
  choice: kabila la Dani
  rationale: Hili ni tamko la asili katika Kiswahili kwa kundi la kikabila lililotokana na Dani; linahifadhi maana ya pamoja ya neno la Kiebrania.
- source_word: מְבַקֵּשׁ לוֹ
  choice: lilikuwa likijitafutia
  rationale: Muundo endelevu unaakisi hali ya tendo linaloendelea katika kirai cha Kiebrania, na kiambishi jirejeshi kinaonyesha kuwa kabila lilitafuta kwa ajili yake lenyewe.
- source_word: נַחֲלָה
  choice: urithi
  rationale: Katika muktadha huu neno linamaanisha eneo la ardhi lililogawiwa kabila kuwa milki yake; ‘urithi’ huhifadhi pia dhana ya ardhi ya agano kuliko ‘mali’ pekee.
- source_word: לָשֶׁבֶת
  choice: wa kukaa humo
  rationale: ‘Kukaa humo’ ni ya kawaida na inaonyesha kuishi au kufanya makao katika eneo lililotafutwa.
- source_word: כִּי לֹא נָפְלָה לוֹ ... בְּנַחֲלָה
  choice: kwa sababu ... halikuwa limepata urithi
  rationale: Badala ya tashbihi ngumu ya kusema urithi ‘ulianguka’ kwa kabila, Kiswahili hiki kinaeleza kwa uwazi matokeo ya ugawaji wa ardhi; tanbihi inahifadhi nahau ya chanzo.
- source_word: עַד הַיּוֹם הַהוּא
  choice: mpaka siku hiyo
  rationale: Huhifadhi mtazamo wa nyuma wa msimuliaji kwa usemi wa kawaida wa wakati.
- source_word: בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל
  choice: miongoni mwa makabila ya Israeli
  rationale: Ni tafsiri ya kawaida ya Kiswahili kwa uhusiano wa kabila hilo ndani ya jumla ya makabila ya Israeli.
theological_decisions:
- issue: Kauli ya kisimulizi kwamba hapakuwa na mfalme katika Israeli
  choice: Imehifadhiwa kama kauli ya kihistoria na kisiasa bila kuongeza tathmini ya wazi kuhusu ufalme.
  alternative: Kuitafsiri kwa namna inayodokeza wazi kuwa kipindi hicho kilikuwa kibaya kwa sababu hakukuwa na mfalme.
  rationale: Kiebrania kinatoa kauli yenyewe lakini hakisemi moja kwa moja katika mstari huu ikiwa ni sifa au shutuma; tafsiri inapaswa kuhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kabila la Dani’ na ‘urithi’ ni maneno yanayoeleweka kwa wasomaji wa kawaida huku yakihifadhi muktadha wa ugawaji wa ardhi. Alama ya tanbihi [a] imewekwa baada ya sehemu inayofafanuliwa.
