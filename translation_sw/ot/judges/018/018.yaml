source:
  edition: WLC
  text: וְ/אֵ֗לֶּה בָּ֚אוּ בֵּ֣ית מִיכָ֔ה וַ/יִּקְחוּ֙ אֶת פֶּ֣סֶל הָ/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/מַּסֵּכָ֑ה וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הַ/כֹּהֵ֔ן מָ֥ה אַתֶּ֖ם עֹשִֽׂים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/018.yaml
  text: These men went into Micah’s house and took the carved image[a], the ephod, the household idols, and the cast image. Then the priest said to them, “What are you doing?”
translation:
  language: sw
  text: Watu hawa wakaingia nyumbani mwa Mika, wakachukua sanamu ya kuchongwa, efodi, sanamu za nyumbani[a], na sanamu ya metali iliyofuliwa. Kisha kuhani akawauliza, “Mnafanya nini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, terafimu—vitu au sanamu za ibada zilizotumiwa nyumbani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Watu hawa
  rationale: Kiwakilishi hiki kinawarejelea wale wanaume watano waliotajwa katika muktadha. Kutaja “watu” kunafanya rejeo hilo lieleweke kwa Kiswahili cha kawaida bila kuongeza habari mpya.
- source_word: בָּאוּ בֵּית מִיכָה
  choice: wakaingia nyumbani mwa Mika
  rationale: Kitenzi kwa msingi ni “walikuja/walienda,” lakini pamoja na “nyumba ya Mika” hapa kinaeleza kuingia ndani. “Nyumbani mwa Mika” ni usemi wa asili wa Kiswahili.
- source_word: וַיִּקְחוּ
  choice: wakachukua
  rationale: Hili ndilo neno la kawaida la kisimulizi kwa tendo la kuchukua, bila kuongeza dhana ya kutumia nguvu ambayo haijaelezwa moja kwa moja.
- source_word: פֶּסֶל
  choice: sanamu ya kuchongwa
  rationale: Neno hili linaashiria sanamu iliyotengenezwa kwa kuchongwa; tafsiri hii inadumisha namna ya utengenezaji badala ya kulifanya tu kuwa neno la jumla “sanamu.”
- source_word: הָאֵפוֹד
  choice: efodi
  rationale: Hiki ni kifaa maalumu cha kidini kisicho na kisawe sahili cha Kiswahili. Utohozi “efodi” huepuka kukifafanua kupita ushahidi wa mstari huu.
- source_word: הַתְּרָפִים
  choice: sanamu za kuabudiwa za nyumbani
  rationale: Terafimu zilikuwa vitu vya ibada vya nyumbani. Tafsiri hii inaeleza kazi na mazingira yake kwa msomaji wa sasa, huku tanbihi ikihifadhi istilahi ya Kiebrania.
- source_word: הַמַּסֵּכָה
  choice: sanamu ya kusubu
  rationale: Nomino hii inaeleza sanamu iliyotengenezwa kwa kumimina metali iliyoyeyushwa katika kalibu. “Ya kusubu” ni fupi na inadumisha tofauti yake na sanamu iliyochongwa.
- source_word: וַיֹּאמֶר אֲלֵיהֶם הַכֹּהֵן
  choice: Kisha kuhani akawauliza
  rationale: Ingawa Kiebrania kwa muundo ni “kuhani akawaambia,” sentensi inayofuata ni swali; “akawauliza” ni Kiswahili cha asili kinachodumisha maana na mfuatano wa simulizi.
- source_word: מָה אַתֶּם עֹשִׂים
  choice: Mnafanya nini?
  rationale: Hii inatafsiri swali la moja kwa moja bila kuongeza mahali kama “hapa,” pasipo neno linalolingana nalo katika Kiebrania.
theological_decisions:
- issue: Kutofautisha vitu mbalimbali vya ibada katika mazingira ya kuabudu sanamu
  choice: 'Kutumia majina tofauti: “sanamu ya kuchongwa,” “efodi,” “sanamu za kuabudiwa za nyumbani,” na “sanamu ya kusubu.”'
  alternative: Kuvitaja vyote kwa jumla kuwa “sanamu.”
  rationale: Kiebrania kinaorodhesha vitu tofauti. Kuhifadhi tofauti hizo huzuia tafsiri kuufanya mstari useme kidogo kuliko chanzo na hakuongezi hukumu ya kimadhehebu.
- issue: Uhusiano wa kisarufi kati ya פֶּסֶל na הָאֵפוֹד
  choice: Kuvitaja kama vitu viwili katika maandishi, na kuweka uwezekano wa muundo wa umilikaji katika tanbihi.
  alternative: “sanamu ya kuchongwa ya efodi”
  rationale: Muundo wa Kiebrania hauna kiunganishi wazi kati ya maneno hayo na unaweza kusomwa kama umilikaji, lakini muktadha wa orodha na ushahidi wa mapokeo ya maandishi huruhusu kuyaelewa kama vitu viwili. Tanbihi inadumisha utata huo badala ya kuuficha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa vitenzi mfululizo (“wakaingia, wakachukua”) unafaa simulizi. Istilahi “efodi” imetoholewa kwa kuwa haina kisawe sahili; maelezo ya vitu vya ibada ni wazi bila kuingiza msimamo maalumu wa kimadhehebu.
