base_translation:
  language: en
  yaml_path: translation/ot/judges/018/026.yaml
  text: Then the sons of Dan went on their way, and Micah saw that they were stronger than he was, so he turned and went back to his house.
translation:
  language: sw
  text: Ndipo wana wa Dani wakaendelea na safari yao. Mika akaona kwamba walikuwa wenye nguvu kuliko yeye; hivyo akageuka, akarudi nyumbani kwake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי דָן
  choice: wana wa Dani
  rationale: Huhifadhi usemi wa kifamilia wa Kiebrania unaotumiwa kwa maana ya kikabila, huku ukiwa wazi katika Kiswahili.
- source_word: לְדַרְכָּם
  choice: wakaendelea na safari yao
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba waliendelea kwenda zao, maana inayobebwa na kirai cha Kiebrania kuhusu njia yao.
- source_word: חֲזָקִים הֵמָּה מִמֶּנּוּ
  choice: walikuwa na nguvu kuliko yeye
  rationale: Huhifadhi moja kwa moja maana ya ulinganisho wa חזק pamoja na מן bila kuongeza wazo la kwamba hangeweza kabisa kuwashinda.
- source_word: וַיִּפֶן
  choice: akageuka
  rationale: Hutafsiri kitenzi cha kugeuka bila kuingiza mapema wazo la kurudi, ambalo linaelezwa na kitenzi kinachofuata.
- source_word: וַיָּשָׁב אֶל בֵּיתוֹ
  choice: na kurudi nyumbani kwake
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kurudi mahali anapoishi; 'nyumbani kwake' huwasilisha kwa ufasaha kirai אֶל בֵּיתוֹ.
- source_word: בֵּיתוֹ
  choice: nyumbani kwake
  rationale: Ingawa בית kimsingi ni 'nyumba,' katika kirai cha kurudi mahali pake Kiswahili cha asili hutumia 'nyumbani kwake'.
