translation:
  language: sw
  text: Kutoka huko wakapita katika nchi ya vilima ya Efraimu, wakafika hadi kwenye nyumba ya Mika.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: wakapita katika
  rationale: Kitenzi עבר katika muktadha huu wa safari kinaonyesha kupita katika au kuvuka eneo; “wakapita katika” ni Kiswahili cha kawaida na kinafaa kwa eneo la kijiografia.
- source_word: מִשָּׁם
  choice: Kutoka huko
  rationale: Kielezi hiki kinaonyesha kuondoka mahali palipotajwa kabla; “Kutoka huko” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: הַר אֶפְרָיִם
  choice: nchi ya vilima ya Efraimu
  rationale: Neno הר hapa ni jina la eneo lenye vilima, si lazima kilele kimoja; “nchi ya vilima ya Efraimu” inaonyesha vizuri maana hiyo ya kijiografia.
- source_word: וַיָּבֹאוּ
  choice: wakafika
  rationale: Katika mfululizo wa safari, בוא pamoja na עַד inaeleza kufikia mahali; “wakafika” ni ya asili zaidi katika simulizi la Kiswahili kuliko tafsiri ya neno kwa neno “wakaja.”
- source_word: עַד
  choice: mpaka
  rationale: Neno hili huonyesha mwisho au kikomo cha mwendo; “mpaka” linahifadhi maana ya kufika hadi mahali fulani.
- source_word: בֵּית מִיכָה
  choice: nyumba ya Mika
  rationale: Huu ni muundo wa umilikaji wenye maana halisi ya “nyumba ya Mika”; Kiswahili hutumia kwa kawaida muundo huu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi vya mfululizo “wakapita … wakafika” unafaa simulizi la kihistoria. “Nchi ya vilima” huepuka kudokeza mlima mmoja pekee.
