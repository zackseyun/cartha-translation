base_translation:
  language: en
  yaml_path: translation/ot/judges/018/027.yaml
  text: So they took what Micah had made[a], along with the priest who belonged to him, and came against Laish, against a people quiet and secure. They struck them with the edge of the sword and burned the city with fire.
translation:
  language: sw
  text: Basi wakachukua vitu ambavyo Mika alikuwa ametengeneza, pamoja na kuhani wake, wakaenda kuishambulia Laishi, ambako walikuwa watu watulivu na salama. Wakawapiga kwa makali ya upanga[a] na kuuteketeza mji kwa moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “kwa kinywa cha upanga,” nahau yenye maana ya “kwa makali ya upanga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Basi waka-
  rationale: “Basi” huendeleza simulizi kwa Kiswahili cha kawaida, huku kiambishi cha nafsi “wa-” kikihifadhi mhusika wa wingi bila kulazimisha kiwakilishi tofauti kisicho cha lazima.
- source_word: לָקְחוּ
  choice: wakachukua
  rationale: “Kuchukua” ni neno pana linalofaa kwa vitu vya ibada na kuhani bila kuongeza wazo la uporaji ambalo kitenzi chenyewe hakilazimishi.
- source_word: אֵת אֲשֶׁר עָשָׂה מִיכָה
  choice: vitu ambavyo Mika alikuwa ametengeneza
  rationale: Muktadha unaonyesha vitu vya ibada vilivyotajwa awali. Wakati wa “alikuwa ametengeneza” unaonyesha kuwa utengenezaji ulitangulia kuvichukua.
- source_word: וְאֶת הַכֹּהֵן אֲשֶׁר הָיָה לוֹ
  choice: pamoja na kuhani wake
  rationale: Hii ni njia ya kawaida na fupi ya kuonyesha uhusiano wa kuhani huyo na nyumba au mahali pa ibada pa Mika, bila kudai kwamba alikuwa mali yake kama mtumwa.
- source_word: וַיָּבֹאוּ עַל לַיִשׁ
  choice: wakaenda kuushambulia Laishi
  rationale: Katika muktadha wa kijeshi, בוא על inaonyesha kuja dhidi ya mahali fulani. “Kuushambulia” hufikisha wazi mwelekeo huo wa uhasama kwa Kiswahili cha kawaida.
- source_word: עַל עַם שֹׁקֵט וּבֹטֵחַ
  choice: watu waliokuwa watulivu na salama
  rationale: “Watulivu” na “salama” huhifadhi maana za utulivu na hali ya kujiamini au kutokuwa hatarini, bila kuongeza moja kwa moja kwamba hawakutarajia shambulio.
- source_word: וַיַּכּוּ אוֹתָם
  choice: Wakawapiga
  rationale: Kitenzi נכה kinaweza kumaanisha kupiga, kushinda, au kuua kulingana na muktadha. “Wakawapiga” hudumisha upana wake, huku kirai kinachofuata kikieleza silaha iliyotumiwa.
- source_word: לְפִי חָרֶב
  choice: kwa makali ya upanga
  rationale: Hii ni tafsiri ya maana ya nahau ya Kiebrania, ambayo kihalisi inasema “kwa kinywa cha upanga.” Inahifadhi picha ya ukali wa upanga kwa Kiswahili kinachoeleweka.
- source_word: וְאֶת הָעִיר שָׂרְפוּ בָאֵשׁ
  choice: na kuuteketeza mji kwa moto
  rationale: “Kuuteketeza ... kwa moto” huhifadhi msisitizo wa Kiebrania unaotaja wazi moto na kutoa lugha ya asili, yenye uzito unaofaa simulizi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Miundo ya vitenzi vinavyofuatana imetumiwa kuleta mtiririko wa kawaida wa simulizi. Alama ya tanbihi imewekwa baada ya “upanga,” mahali inapohusika moja kwa moja na nahau ya Kiebrania.
