base_translation:
  language: en
  yaml_path: translation/ot/judges/018/030.yaml
  text: Then the sons of Dan set up for themselves the carved image, and Jonathan the son of Gershom, son of Moses,[a] he and his sons were priests for the tribe of the Danites until the day of the exile of the land.
translation:
  language: sw
  text: Kisha wana wa Dani wakajiwekea sanamu iliyochongwa. Yonathani mwana wa Gershomu, mwana wa Musa,[a] yeye na wanawe walikuwa makuhani kwa ajili ya kabila la Wadani mpaka siku ya nchi kupelekwa uhamishoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Musa”; mapokeo ya Kimasora yana herufi nun iliyoning''inizwa, na hivyo kutoa usomaji wa jadi “Manase.”'
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקִימוּ
  choice: wakajisimamishia
  rationale: Hifili ya קום ina maana ya kusimamisha au kuweka kitu mahali; umbo hili la Kiswahili pia linaunganisha kwa kawaida wazo la לָהֶם, kwamba walifanya hivyo kwa ajili yao wenyewe.
- source_word: לָהֶם
  choice: -ji- katika “wakajisimamishia”
  rationale: Kiambishi cha kujirejelea pamoja na kauli ya kutendea huonyesha kwamba wana wa Dani waliisimamisha kwa matumizi au manufaa yao wenyewe.
- source_word: בְּנֵי דָן
  choice: wana wa Dani
  rationale: Huhifadhi usemi wa ukoo wa Kiebrania na kuutofautisha na jina la kikabila הַדָּנִי baadaye katika mstari.
- source_word: הַפָּסֶל
  choice: sanamu ya kuchonga
  rationale: פֶּסֶל ni sanamu iliyotengenezwa kwa kuchongwa; tafsiri hii huhifadhi maana halisi bila kutumia lugha ya kizamani.
- source_word: וִיהוֹנָתָן
  choice: Yonathani
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: בֶּן גֵּרְשֹׁם
  choice: mwana wa Gershomu
  rationale: Ni tafsiri ya moja kwa moja ya muundo wa nasaba.
- source_word: בֶּן מְהוּא
  choice: mwana wa Musa
  rationale: Maandishi ya msingi yanaelekea kwa “Musa,” huku herufi nun iliyoinuliwa katika mapokeo ya Kimasora ikitoa usomaji wa jadi “Manase”; tofauti hiyo imehifadhiwa katika tanbihi.
- source_word: וּבָנָיו
  choice: yeye na wanawe
  rationale: Huweka wazi kwa Kiswahili kwamba Yonathani pamoja na wanawe ndio waliokuwa makuhani.
- source_word: כֹהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כהנים katika muktadha wa ibada.
- source_word: לְשֵׁבֶט הַדָּנִי
  choice: wa kabila la Wadani
  rationale: Huonyesha uhusiano na huduma yao kwa kabila hilo huku likihifadhi nguvu ya jina la kikabila הַדָּנִי.
- source_word: עַד יוֹם גְּלוֹת הָאָרֶץ
  choice: mpaka siku nchi ilipopelekwa uhamishoni
  rationale: Hufuata kwa karibu muundo usio wa kawaida wa Kiebrania unaoifanya nchi kuwa mhusika wa kupelekwa uhamishoni, bila kubainisha kimakusudi ni tukio gani la kihistoria linalomaanishwa.
theological_decisions:
- issue: Utambulisho wa babu wa Yonathani katika nasaba
  choice: mwana wa Musa
  alternative: mwana wa Manase
  rationale: 'Maandishi ya Kimasora yanahifadhi mvutano wa kimapokeo: konsonanti za msingi zinaunga mkono “Musa,” lakini nun iliyoinuliwa huzaa usomaji wa jadi “Manase.” Maandishi makuu yanafuata “Musa,” na usomaji mwingine umewekwa katika tanbihi badala ya kuondoa mvutano huo.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Wana wa Dani” huhifadhi umbo la nasaba, na “Wadani” hutumika baadaye kwa jina la kikabila. Usemi “nchi ilipopelekwa uhamishoni” umeachwa kwa kiasi fulani kuwa usio wa kawaida ili kuhifadhi ufupi na utata wa chanzo.
