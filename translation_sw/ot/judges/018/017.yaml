  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יַּעֲל֞וּ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֗ים הַ/הֹלְכִים֮ לְ/רַגֵּ֣ל אֶת הָ/אָרֶץ֒ בָּ֣אוּ שָׁ֔מָּ/ה לָקְח֗וּ אֶת הַ/פֶּ֨סֶל֙ וְ/אֶת הָ֣/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/מַּסֵּכָ֑ה וְ/הַ/כֹּהֵ֗ן נִצָּב֙ פֶּ֣תַח הַ/שַּׁ֔עַר וְ/שֵׁשׁ מֵא֣וֹת הָ/אִ֔ישׁ הֶ/חָג֖וּר כְּלֵ֥י הַ/מִּלְחָמָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/017.yaml
  text: Then the five men who had gone to spy out the land went up[a], came there, and took the carved image, the ephod, the household gods, and the cast image[b], while the priest was standing at the entrance of the gate with the six hundred men armed with weapons of war.
translation:
  language: sw
  text: Ndipo wale watu watano waliokuwa wameenda kuipeleleza nchi wakapanda, wakafika pale, wakachukua sanamu ya kuchongwa, efodi, miungu ya nyumbani[a], na sanamu ya kusubu[b], huku kuhani akiwa amesimama kwenye mwingilio wa lango pamoja na wale watu mia sita waliokuwa wamejihami kwa silaha za vita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “terafimu.” Neno la Kiebrania linarejelea vitu vya ibada au miungu ya nyumbani.
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri ya kimapokeo: “sanamu ya kuyeyushwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: wakapanda
  rationale: Kitenzi עלה kwa kawaida humaanisha kupanda au kwenda juu. “Wakapanda” kinahifadhi uchaguzi wa Kiebrania bila kuongeza mahali ambapo hawajasemwa wazi kuwa waliingia.
- source_word: הַהֹלְכִים לְרַגֵּל אֶת־הָאָרֶץ
  choice: waliokuwa wameenda kuipeleleza nchi
  rationale: Kirai hiki kinawatambulisha watu watano kwa kazi yao ya awali ya upelelezi wa kijeshi; muundo huu pia unaonyesha kuwa kazi hiyo ilitangulia tukio linalosimuliwa sasa.
- source_word: בָּאוּ שָׁמָּה
  choice: wakafika pale
  rationale: Hutoa kwa kawaida maana ya kufika mahali hapo bila kudai kwamba waliingia ndani ya jengo fulani, jambo ambalo Kiebrania hakilitaji wazi.
- source_word: לָקְחוּ
  choice: wakachukua
  rationale: לקח ni kitenzi cha kawaida cha kuchukua. Muktadha wenyewe unaonyesha kuwa walivichukua vitu visivyo vyao, hivyo hakuna haja ya kuongeza tafsiri kama “wakavipora.”
- source_word: הַפֶּסֶל
  choice: sanamu ya kuchongwa
  rationale: פסל ni sanamu iliyotengenezwa kwa kuchongwa. Tafsiri hii ni dhahiri na huepuka neno la jumla zaidi “sanamu ya kuabudiwa.”
- source_word: הָאֵפוֹד
  choice: efodi
  rationale: אֵפוֹד ni neno maalumu la kitamaduni lisilo na kisawe kifupi na kamili katika Kiswahili, kwa hiyo limetoholewa badala ya kuongezewa maelezo yasiyokuwamo hapa.
- source_word: הַתְּרָפִים
  choice: miungu ya nyumbani
  rationale: תְּרָפִים hurejelea vitu au sanamu za ibada za nyumbani. “Miungu ya nyumbani” hufikisha maana yake kwa msomaji wa kawaida, huku umbo la neno la asili likitajwa katika tanbihi.
- source_word: הַמַּסֵּכָה
  choice: sanamu ya kusubu
  rationale: מַסֵּכָה ni sanamu iliyofanyizwa kwa kumimina metali iliyoyeyushwa katika kalibu. “Sanamu ya kusubu” ni tafsiri sahihi na fupi ya Kiswahili.
- source_word: וְהַכֹּהֵן נִצָּב
  choice: huku kuhani akiwa amesimama
  rationale: Kishazi hiki kinaonyesha hali iliyokuwa ikiendelea wakati vitu vilipochukuliwa; “huku” huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: פֶּתַח הַשַּׁעַר
  choice: kwenye mwingilio wa lango
  rationale: Tafsiri hii inahifadhi dhana zote mbili za פתח, yaani mwingilio, na שער, yaani lango.
- source_word: וְשֵׁשׁ מֵאוֹת הָאִישׁ
  choice: pamoja na wale watu mia sita
  rationale: Muundo huu unaunganisha watu mia sita na mahali alipokuwa amesimama kuhani, kama muktadha na mpangilio wa kishazi unavyoelekeza.
- source_word: הֶחָגוּר כְּלֵי הַמִּלְחָמָה
  choice: waliokuwa wamejihami kwa silaha za vita
  rationale: חגור hapa huonyesha kuwa watu hao walikuwa wamefungiwa au wameandaliwa kwa silaha. “Wamejihami” ni Kiswahili cha sasa na huhifadhi maana ya kijeshi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi “wakapanda, wakafika, wakachukua” unahifadhi mwendo wa simulizi la Kiebrania. Istilahi “efodi” imetoholewa kwa sababu ni kitu maalumu cha kitamaduni, na maelezo ya vitu vya ibada yamewekwa kwa lugha inayoeleweka bila kuficha tabia yake ya kidini.
