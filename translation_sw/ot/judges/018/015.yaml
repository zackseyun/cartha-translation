translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya kisimulizi. Alama ya mkato imetumiwa kuonyesha kwamba ‘nyumba ya Mika’ inafafanua ‘nyumba ya yule kijana Mlawi.’
