  yaml_path: translation/ot/judges/018/015.yaml
  text: They turned aside there and came to the house of the young Levite[a], to the house of Micah, and asked him about his welfare.
translation:
  language: sw
  text: Wakapinda kwenda huko, wakafika kwenye nyumba ya yule kijana Mlawi, nyumba ya Mika, wakamuuliza hali yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamsalimia,” au “wakamuuliza kama hali yake ilikuwa njema.” Nahau ya Kiebrania kihalisi inahusu kuulizia amani au hali njema ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסוּרוּ שָׁמָּה
  choice: Wakageuka kuelekea huko
  rationale: Kitenzi סור pamoja na kielezi cha mwelekeo שָׁמָּה kinaonyesha kuacha njia au kuelekea mahali pale. Tafsiri hii inadumisha wazo la mwendo na mwelekeo.
- source_word: וַיָּבֹאוּ אֶל
  choice: wakafika katika
  rationale: בוא pamoja na אֶל hapa inaeleza kufika mahali; ‘wakafika katika’ ni ya kawaida kwa Kiswahili na haiongezi kwa lazima wazo la kuingia ndani.
- source_word: בֵּית הַנַּעַר הַלֵּוִי
  choice: nyumba ya yule kijana Mlawi
  rationale: נַעַר ni kijana, na הַלֵּוִי humtambulisha kuwa Mlawi. ‘Yule’ inafaa kwa sababu mtu huyu tayari anajulikana katika simulizi.
- source_word: בֵּית מִיכָה
  choice: yaani, nyumba ya Mika
  rationale: Kirai hiki kinafafanua kwa namna ya apposition kwamba nyumba ya kijana Mlawi ndiyo nyumba ya Mika. ‘Yaani’ huweka uhusiano huo wazi bila kuondoa urudiaji wa Kiebrania.
- source_word: וַיִּשְׁאֲלוּ לוֹ לְשָׁלוֹם
  choice: wakamuuliza hali yake
  rationale: Nahau hii ya Kiebrania inahusu kuuliza habari za amani au ustawi wa mtu. ‘Kumuuliza hali yake’ ni Kiswahili cha kawaida kinachohifadhi maana ya kuulizia ustawi, huku tanbihi ikionyesha uwezekano wa salamu.
