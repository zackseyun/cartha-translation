base_translation:
  language: en
  yaml_path: translation/ot/judges/018/029.yaml
  text: And they called the name of the city Dan[a], after the name of Dan their father, who was born to Israel; however, the name of the city formerly was Laish.
translation:
  language: sw
  text: Nao wakaliita jina la mji huo kuwa Dani[a], kwa jina la Dani, baba yao, aliyezaliwa kwa Israeli; hata hivyo, hapo awali jina la mji huo lilikuwa Laishi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “babu au mzazi wa ukoo”; neno la Kiebrania la “baba” linaweza kumaanisha mtangulizi wa ukoo, si baba wa karibu tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם הָעִיר
  choice: wakaliita jina la mji huo
  rationale: Muundo huu unahifadhi kutajwa wazi kwa ‘jina la mji’ katika Kiebrania, huku ukieleza kwa Kiswahili kitendo cha kuupa mji jina.
- source_word: דָּן
  choice: Dani
  rationale: Jina la mtu na la mji limeandikwa kwa umbo lililozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: בְּשֵׁם דָּן
  choice: kwa jina la Dani
  rationale: Kirai hiki kinaonyesha kwamba mji uliitwa kwa kurejelea Dani; tafsiri inabaki karibu na muundo wa chanzo bila kuongeza wazo lisilotajwa wazi kama vile ‘kwa heshima ya’.
- source_word: אֲבִיהֶם
  choice: baba yao
  rationale: Hili ndilo wazo la moja kwa moja la neno la Kiebrania, ingawa katika muktadha wa nasaba linaweza kumaanisha babu wa ukoo; uwezekano huo umeelezwa katika tanbihi.
- source_word: אֲשֶׁר יוּלַּד לְיִשְׂרָאֵל
  choice: aliyezaliwa kwa Israeli
  rationale: Tafsiri inadumisha kauli tendwa na jina ‘Israeli’ la maandishi ya chanzo bila kulibadili kuwa ‘Yakobo’ kwa ufafanuzi.
- source_word: וְאוּלָם
  choice: hata hivyo
  rationale: Kifungu hiki kinaonyesha utofautishaji kati ya jina jipya la mji na jina lake la awali.
- source_word: לַיִשׁ
  choice: Laishi
  rationale: Jina la mahali limeandikwa kwa umbo la Kiswahili linalosomeka kwa urahisi.
- source_word: לָרִאשֹׁנָה
  choice: hapo awali
  rationale: Katika muktadha huu kirai kinaeleza jina ambalo mji ulikuwa nalo kabla ya kuitwa Dani.
theological_decisions:
- issue: Maana ya nasaba katika אֲבִיהֶם
  choice: baba yao
  alternative: babu yao wa ukoo
  rationale: Maandishi yanatumia neno ‘baba,’ ambalo linaweza pia kumaanisha babu wa zamani au mwanzilishi wa ukoo. Matini kuu inahifadhi lugha ya kifamilia ya Kiebrania, na tanbihi inaonyesha maana pana inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi cha Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa Kiebrania umehifadhiwa pale unapobaki wa asili katika Kiswahili, na tanbihi imewekwa baada ya ‘Dani’ kulingana na data ya marejeo iliyotolewa.
