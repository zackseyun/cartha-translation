  text: הֵ֚מָּה עִם בֵּ֣ית מִיכָ֔ה וְ/הֵ֣מָּה הִכִּ֔ירוּ אֶת ק֥וֹל הַ/נַּ֖עַר הַ/לֵּוִ֑י וַ/יָּס֣וּרוּ שָׁ֗ם וַ/יֹּ֤אמְרוּ ל/וֹ֙ מִֽי הֱבִיאֲ/ךָ֣ הֲלֹ֔ם וּ/מָֽה אַתָּ֥ה עֹשֶׂ֛ה בָּ/זֶ֖ה וּ/מַה לְּ/ךָ֥ פֹֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/003.yaml
  text: While they were near Micah’s house[a], they recognized the voice of the young Levite. So they turned aside there and said to him[b], “Who brought you here? What are you doing in this place? And what do you have here?”
translation:
  language: sw
  text: Walipokuwa karibu na nyumba ya Mika, waliitambua sauti ya yule kijana Mlawi. Basi wakageuka wakaenda huko, wakamwambia, “Ni nani aliyekuleta hapa? Unafanya nini mahali hapa?[a] Na una nini hapa?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Unafanya nini na hiki?” Kiebrania kwa maana halisi kinasema, “Unafanya nini katika hiki?”
    reason: lexical_alternative
  - marker: b
    text: Au, “Una shughuli gani hapa?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה עִם בֵּית מִיכָה
  choice: Walipokuwa karibu na nyumba ya Mika
  rationale: עִם hapa inaonyesha ukaribu wa mahali, si ushirika na nyumba; ‘karibu na’ ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: הִכִּירוּ
  choice: waliitambua
  rationale: Hiphil ya נכר pamoja na ‘sauti’ ina maana ya kuitambua sauti ambayo waliwahi kuisikia.
- source_word: אֶת קוֹל הַנַּעַר הַלֵּוִי
  choice: sauti ya yule kijana Mlawi
  rationale: קוֹל ni ‘sauti’; נַעַר inaonyesha kijana, na הַלֵּוִי humtambulisha kuwa Mlawi. ‘Yule’ linafaa kwa mtu anayejulikana katika simulizi.
- source_word: וַיָּסוּרוּ שָׁם
  choice: wakageuka wakaenda huko
  rationale: סור hapa ni kuacha njia na kuelekea mahali pale. Kauli hii ni ya asili katika Kiswahili huku ikihifadhi wazo la kugeuka kutoka walikokuwa wakielekea.
- source_word: מִי הֱבִיאֲךָ הֲלֹם
  choice: Ni nani aliyekuleta hapa?
  rationale: Hiphil ya בוא ni ya kusababisha kuja, yaani ‘kuleta,’ na הֲלֹם ni ‘hapa.’
- source_word: וּמָה אַתָּה עֹשֶׂה בָּזֶה
  choice: Unafanya nini mahali hapa?
  rationale: בָּזֶה kwa maana halisi ni ‘katika hiki/na hiki’ lakini ni usemi wenye maana isiyotajwa wazi. Muktadha unaelekea kwenye mahali; tanbihi huhifadhi tafsiri iliyo karibu zaidi na muundo wa Kiebrania.
- source_word: וּמַה לְּךָ פֹה
  choice: Na una nini hapa?
  rationale: Usemi מַה לְּךָ פֹה unaweza kuuliza kile mtu alicho nacho au shughuli/maslahi yake mahali hapo. Tafsiri kuu inadumisha lugha halisi zaidi, na maana pana inawekwa katika tanbihi.
