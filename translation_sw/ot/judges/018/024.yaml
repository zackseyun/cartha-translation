base_translation:
  language: en
  yaml_path: translation/ot/judges/018/024.yaml
  text: He said[a], “You have taken my gods that I made, and the priest, and you have gone away. What do I have left now? So how can you say to me, ‘What is the matter with you?’”
translation:
  language: sw
  text: Akasema, “Mmechukua miungu yangu[a] niliyotengeneza, na kuhani, kisha mkaondoka. Sasa nimebakiwa na nini? Basi, mnawezaje kuniambia, ‘Una shida gani?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mungu wangu” au “sanamu zangu.” Neno la Kiebrania linaweza kuwa la umoja au wingi katika baadhi ya miktadha, lakini hapa muktadha mpana unapendelea “miungu yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: miungu yangu
  rationale: Ingawa umbo hili la Kiebrania linaweza kueleweka kuwa la umoja au wingi katika miktadha fulani, muktadha mpana wa sanamu za ibada za Mika unapendelea wingi. Tafsiri hii pia inadumisha kejeli ya miungu iliyotengenezwa na mwanadamu.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: niliyoitengeneza
  rationale: Kitenzi עשה kina maana ya kawaida ya ‘kutengeneza’ au ‘kufanya.’ ‘Niliyoitengeneza’ ni ya asili kwa vitu vya ibada na inadumisha nguvu ya kauli kwamba Mika mwenyewe aliitengeneza au aliagiza itengenezwe.
- source_word: לְקַחְתֶּם
  choice: mmechukua
  rationale: 'Kauli ya nafsi ya pili wingi inaonyesha tendo lililotimia ambalo matokeo yake yanaendelea: vitu hivyo haviko tena kwa Mika.'
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Inamtaja kuhani anayejulikana katika simulizi, yaani kuhani wa Mika aliyeondoka pamoja na Wadani.
- source_word: וַתֵּלְכוּ
  choice: mkaondoka
  rationale: 'Muundo huu wa Kiswahili unaendeleza mfululizo wa matendo: walichukua vitu na kuhani, kisha wakaondoka.'
- source_word: וּמַה לִּי עוֹד
  choice: Sasa nimebakiwa na nini?
  rationale: Hii ni kauli ya maombolezo kuhusu kupokonywa kila kitu muhimu, si swali la umiliki tu. ‘Nimebakiwa na nini?’ ni Kiswahili cha kawaida na chenye nguvu inayofaa.
- source_word: וּמַה זֶּה תֹּאמְרוּ אֵלַי
  choice: Basi, mwawezaje kuniambia
  rationale: Kirai cha Kiebrania ni cha mshangao na malalamiko. ‘Mwawezaje’ kinaonyesha ghadhabu ya Mika bila kuifanya kauli kuwa maelezo tambarare ya sababu.
- source_word: מַה לָּךְ
  choice: Una nini?
  rationale: Hii inadumisha swali fupi na la moja kwa moja la Kiebrania. Pia inahifadhi mabadiliko ya ghafla kutoka kwa msemo wa wingi ‘mwawezaje kuniambia’ hadi kauli iliyonukuliwa katika umoja.
theological_decisions:
- issue: Maana ya אֱלֹהַי katika muktadha wa vitu vya ibada vya nyumbani
  choice: miungu yangu
  alternative: mungu wangu / sanamu zangu za miungu
  rationale: Neno lenyewe humaanisha ‘mungu/miungu,’ ilhali muktadha unaonyesha kuwa linahusu vitu halisi vya ibada. ‘Miungu yangu’ inadumisha msamiati wa Kiebrania, uwezekano wa kisarufi unaopendelewa na muktadha, na kejeli ya simulizi bila kuubadili moja kwa moja kuwa ufafanuzi ‘sanamu.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi za maswali zinadumisha uchungu na ghadhabu ya Mika. ‘Mwawezaje’ ni ya hadhi bila kuwa ya kizamani, na ‘Una nini?’ huhifadhi ufupi na mabadiliko ya idadi yaliyo katika chanzo.
