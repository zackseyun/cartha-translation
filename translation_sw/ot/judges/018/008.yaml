  text: וַ/יָּבֹ֨אוּ֙ אֶל אֲחֵי/הֶ֔ם צָרְעָ֖ה וְ/אֶשְׁתָּאֹ֑ל וַ/יֹּאמְר֥וּ לָ/הֶ֛ם אֲחֵי/הֶ֖ם מָ֥ה אַתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/008.yaml
  text: Then they came to their brothers at Zorah and Eshtaol[a], and their brothers said to them[b], “What is with you?”
translation:
  language: sw
  text: Ndipo wakafika kwa ndugu zao[a] huko Sora na Eshtaoli. Ndugu zao wakawaambia, “Mna nini?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jamaa zao.” Neno la Kiebrania linalotafsiriwa “ndugu” linaweza kutaja jamaa wa ukoo au wa kabila, si ndugu wa tumbo moja tu.
    reason: lexical_alternative
  - marker: b
    text: Swali la Kiebrania ni fupi sana na sehemu yake imeachwa ieleweke; kihalisi ni kama, “Nini, ninyi?” Huenda walikuwa wakiwauliza habari walizoleta au hali yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Ndipo wakafika
  rationale: Muundo wa wayyiqtol unaendeleza masimulizi. “Ndipo” huonyesha mfuatano wa tukio kwa Kiswahili cha kawaida, na “wakafika” huonyesha kwamba walifika walikokuwa wakienda.
- source_word: אֶל אֲחֵיהֶם
  choice: kwa ndugu zao
  rationale: Neno אָח linaweza kumaanisha ndugu wa tumbo moja au jamaa wa ukoo/kabila. “Ndugu zao” huhifadhi upana huo wa maana katika Kiswahili, huku tanbihi ikifafanua muktadha.
- source_word: צָרְעָה וְאֶשְׁתָּאֹל
  choice: Sora na Eshtaoli
  rationale: Majina ya mahali yametoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili badala ya kutafsiriwa.
- source_word: וַיֹּאמְרוּ לָהֶם אֲחֵיהֶם
  choice: Ndugu zao wakawaambia
  rationale: Tafsiri inadumisha kiima kilichotajwa wazi, “ndugu zao,” na kitenzi cha kawaida cha kusema, bila kuongeza kwamba waliwauliza ingawa maneno yanayofuata ni swali.
- source_word: מָה אַתֶּם
  choice: Mna nini?
  rationale: Kiebrania kina swali fupi sana lenye sehemu iliyoachwa kueleweka. “Mna nini?” ni swali fupi na la asili katika Kiswahili, na haliamui kwa kulazimisha kama wanaulizwa habari, hali yao, au jambo lililotokea.
