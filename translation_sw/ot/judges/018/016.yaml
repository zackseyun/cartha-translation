  yaml_path: translation/ot/judges/018/016.yaml
  text: And six hundred men[a], armed with their weapons of war, were standing at the entrance of the gate; these were from the sons of Dan.
translation:
  language: sw
  text: Na wanaume mia sita, wakiwa wamejihami kwa silaha zao za vita, walikuwa wamesimama kwenye ingilio la lango; hao walikuwa wa wana wa Dani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hao walikuwa Wadani.” Kihalisi, “hao walikuwa wa wana wa Dani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁשׁ מֵאוֹת אִישׁ
  choice: Na wanaume mia sita
  rationale: Kiunganishi וְ kinaendeleza simulizi, na אִישׁ baada ya idadi limetafsiriwa kwa wingi wa kawaida katika Kiswahili.
- source_word: חֲגוּרִים כְּלֵי מִלְחַמְתָּם
  choice: wakiwa wamejihami kwa silaha zao za vita
  rationale: חֲגוּרִים kihalisi huhusu kujifunga kitu mwilini, lakini katika muktadha huu wa kijeshi pamoja na כְּלֵי מִלְחַמְתָּם maana ya asili ni kuwa tayari kwa vita wakiwa na silaha; ‘wamejihami’ ni Kiswahili cha sasa na cha asili.
- source_word: נִצָּבִים
  choice: walikuwa wamesimama
  rationale: Muundo wa participle unaweka mandhari ya watu waliokuwa katika hali ya kusimama, badala ya kuonyesha tu tendo la muda mfupi.
- source_word: פֶּתַח הַשָּׁעַר
  choice: kwenye mwingilio wa lango
  rationale: פֶּתַח ni uwazi au mwingilio; tafsiri hii inahifadhi dhana ya sehemu ya kuingilia langoni bila kurudia maneno yasiyo ya kawaida katika Kiswahili.
- source_word: אֲשֶׁר מִבְּנֵי דָן
  choice: hao walikuwa miongoni mwa wana wa Dani
  rationale: Kishazi hiki kinawatambulisha wale wanaume. ‘Wana wa Dani’ linahifadhi neno la ukoo la Kiebrania, huku ‘miongoni mwa’ likitoa Kiswahili wazi na cha kawaida.
