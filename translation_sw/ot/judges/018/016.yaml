translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa urahisi. Tafsiri inahifadhi usemi wa ukoo ‘wana wa Dani’ katika maandishi makuu na kutoa jina la kikabila ‘Wadani’ kama mbadala katika tanbihi.
