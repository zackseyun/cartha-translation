base_translation:
  language: en
  yaml_path: translation/ot/judges/018/028.yaml
  text: And there was no one to deliver them[a], because it was far from Sidon, and they had no dealings with anyone; and it was in the valley that belongs to Beth-rehob. Then they rebuilt the city and lived in it.
translation:
  language: sw
  text: Hakukuwa na mtu wa kuwaokoa, kwa sababu mji huo ulikuwa mbali na Sidoni, nao hawakuwa na mahusiano yoyote na mtu yeyote. Mji huo ulikuwa katika bonde lililokuwa la Beth-rehob[a]. Kisha wakajenga upya mji huo, wakakaa humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika bonde lililokuwa karibu na Beth-rehob.” Kirai cha Kiebrania kimefupishwa, na kihusishi hicho kinaweza kuonyesha ukaribu badala ya umiliki.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצִּיל
  choice: mtu wa kuwaokoa
  rationale: Kitenzi hiki katika hali ya Hiphil humaanisha mtu anayeokoa au kukomboa kutoka hatarini. Katika muktadha huu ni uokoaji dhidi ya shambulio la kijeshi; kiwakilishi cha ‘wao’ kinaeleweka kutokana na wakazi wa mji waliotajwa katika muktadha.
- source_word: רְחוֹקָה הִיא מִצִּידוֹן
  choice: mji huo ulikuwa mbali na Sidoni
  rationale: Kiwakilishi cha kike katika Kiebrania kinarejelea mji. Kurudia ‘mji huo’ kunaweka rejeo wazi na ni Kiswahili cha kawaida.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: hawakuwa na uhusiano wowote na mtu yeyote
  rationale: Kirai hiki, kwa neno, ni ‘hawakuwa na jambo lolote pamoja na mtu.’ Katika muktadha kinaonyesha kutengwa kwao kijamii au kisiasa, si kwamba hawakuwahi kukutana na binadamu wengine.
- source_word: בָּעֵמֶק
  choice: katika bonde
  rationale: עֵמֶק kwa kawaida humaanisha bonde au eneo la chini; ‘bonde’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אֲשֶׁר לְבֵית רְחוֹב
  choice: lililokuwa la Beth-rehob
  rationale: Kirai cha Kiebrania kimefupishwa, na לְ inaweza kuonyesha umiliki au uhusiano wa eneo. Tafsiri hii inadumisha maana inayowezekana ya eneo kuwa chini ya Beth-rehob, huku uwezekano wa ukaribu ukiwekwa katika tanbihi.
- source_word: וַיִּבְנוּ אֶת הָעִיר
  choice: wakaujenga upya mji huo
  rationale: Ingawa kitenzi kwa kawaida ni ‘kujenga,’ mstari uliotangulia unasema mji uliteketezwa. Kwa hiyo ‘kujenga upya’ huweka wazi maana inayodokezwa na muktadha.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: kukaa humo
  rationale: יָשַׁב inaweza kumaanisha kukaa, kuishi, au kufanya makao. ‘Kukaa humo’ ni lugha ya kawaida na inaendeleza simulizi bila kuongeza ufafanuzi usio wa lazima.
- source_word: בֵית רְחוֹב
  choice: Beth-rehob
  rationale: Hili ni jina la mahali, hivyo limetoholewa kwa herufi za Kilatini badala ya kutafsiriwa.
