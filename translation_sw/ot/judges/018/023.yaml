base_translation:
  language: en
  yaml_path: translation/ot/judges/018/023.yaml
  text: They called out to the sons of Dan[a], and they turned around and said to Micah, “What is the matter with you[b], that you have called out?”
translation:
  language: sw
  text: Wakawaita wana wa Dani, nao wakageuka na kumwambia Mika, “Una nini, hata umepiga kelele?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: Wakawaita
  rationale: Kitenzi קרא hapa kinaonyesha kuwaita kwa sauti ili wageuke; ‘wakawaita’ ni Kiswahili cha kawaida kisichoongeza wazo la huzuni.
- source_word: אֶל־בְּנֵי דָן
  choice: wana wa Dani
  rationale: Huhifadhi msemo halisi wa Kiebrania wa ukoo, ambao unaeleweka kwa urahisi katika Kiswahili.
- source_word: וַיַּסֵּבּוּ פְּנֵיהֶם
  choice: wakageuka
  rationale: Hii ni tafsiri ya kawaida na ya asili ya nahau yenye maana halisi ya ‘wakageuza nyuso zao.’
- source_word: לְמִיכָה
  choice: kumwambia Mika
  rationale: Kiambishi cha mtu ‘m-’ kinaonyesha wazi kwamba maneno yalielekezwa kwa Mika.
- source_word: מַה־לְּךָ
  choice: Una nini
  rationale: Ni nahau ya Kiswahili inayodumisha ufupi na ukali wa swali la Kiebrania, ikimaanisha ‘umepatwa na nini?’ au ‘kuna nini?’
- source_word: כִּי נִזְעָקְתָּ
  choice: hata ukapiga kelele
  rationale: Nifali ya זעק humaanisha kupaza sauti au kutoa kilio; ‘kupiga kelele’ inafaa katika muktadha wa Mika kuwaita kwa sauti ya malalamiko. ‘Hata’ linaunganisha hali yake na kitendo hicho kwa Kiswahili cha asili bila kulazimisha maana moja tu ya כִּי.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na wa kisimulizi; msemo ‘wana wa Dani’ umehifadhiwa badala ya kutumia jina la kikabila lililorahisishwa.
