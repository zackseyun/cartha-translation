  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֥אמְרוּ ל֖/וֹ שְׁאַל נָ֣א בֵ/אלֹהִ֑ים וְ/נֵ֣דְעָ֔ה הֲ/תַצְלִ֣יחַ דַּרְכֵּ֔/נוּ אֲשֶׁ֥ר אֲנַ֖חְנוּ הֹלְכִ֥ים עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/005.yaml
  text: And they said to him[a], “Please inquire of God, so that we may know whether the journey on which we are going will succeed.”
translation:
  language: sw
  text: Nao wakamwambia, “Tafadhali muulize Mungu, ili tujue kama safari[a] tunayofanya itafanikiwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama njia yetu tunayoifuata itafanikiwa,” kwa kuhifadhi taswira halisi zaidi ya Kiebrania ya “njia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ לוֹ
  choice: Nao wakamwambia
  rationale: Muundo huu wa simulizi unaendeleza mfululizo wa matukio kwa Kiswahili cha kawaida huku ukihifadhi maana ya ‘na wakamwambia.’
- source_word: שְׁאַל נָא
  choice: Tafadhali muulize
  rationale: ‘Tafadhali’ huwasilisha nguvu ya ombi la heshima ya נָא, na ‘muulize’ ni Kiswahili cha kawaida kwa kutafuta jibu au mwongozo kutoka kwa Mungu.
- source_word: בֵאלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu אֱלֹהִים inaeleweka kwa kawaida kama Mungu mmoja; pamoja na kitenzi שׁאל, usemi wa Kiswahili ‘muulize Mungu’ ni wa asili na una maana ya kutafuta mwongozo wake.
- source_word: וְנֵדְעָה
  choice: ili tujue
  rationale: 'Huwasilisha wazi kusudi linaloonyeshwa na umbo la Kiebrania: ombi linafanywa kusudi wapate kujua.'
- source_word: הֲתַצְלִיחַ
  choice: itafanikiwa
  rationale: Huwasilisha maana ya Hiphil ya צלח ya kufanikiwa au kwenda vyema bila kuifanya iwe hasa kuhusu mafanikio ya mali.
- source_word: דַּרְכֵּנוּ
  choice: safari
  rationale: Ingawa neno la msingi ni ‘njia yetu,’ katika muktadha huu linarejelea safari au msafara wanaoufanya; ‘safari’ ni wazi na ya asili kwa msomaji wa Kiswahili. Taswira halisi zaidi imehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר אֲנַחְנוּ הֹלְכִים עָלֶיהָ
  choice: tunayofanya
  rationale: Kiswahili cha kawaida husema ‘kufanya safari.’ Uhusiano wa kishazi umehifadhiwa bila kutumia usemi mzito usio wa kawaida wa ‘kwenda juu yake.’
theological_decisions:
- issue: Rejeo la אֱלֹהִים
  choice: Mungu (umoja)
  alternative: miungu
  rationale: Ingawa אֱלֹהִים linaweza kuwa na umbo la wingi, muktadha wa kutafuta mwongozo wa kimungu kupitia kuhani unaunga mkono maana ya umoja. Uamuzi huu ni wa kileksia na kimuktadha, si nyongeza ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri kuu inatumia usemi wa kawaida ‘kufanya safari,’ huku tanbihi ikihifadhi taswira ya karibu zaidi ya Kiebrania ya ‘njia yetu.’
