base_translation:
  language: en
  yaml_path: translation/ot/judges/002/015.yaml
  text: Wherever they went out[a], the hand of Yahweh was against them for harm, just as Yahweh had spoken and just as Yahweh had sworn to them[b], and they were greatly distressed.
translation:
  language: sw
  text: Kila mara walipotoka[a], mkono wa Yahwe ulikuwa dhidi yao na kuwaletea madhara[b], kama Yahwe alivyosema na kama alivyowaapia; nao wakawa katika dhiki kubwa sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Popote walipotoka”; huenda maneno haya yanamaanisha walipotoka kwenda vitani au kufanya kampeni ya kijeshi.
    reason: lexical_alternative
  - marker: b
    text: Au, “maafa.” Neno la Kiebrania hapa humaanisha madhara au msiba, si lazima uovu wa kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹל אֲשֶׁר יָצְאוּ
  choice: Kila walipotoka
  rationale: Muundo huu unahusu kila tukio walipotoka kwa shughuli au safari zao. Muktadha unaweza kudokeza kwenda vitani, lakini tafsiri haibainishi hilo zaidi ya Kiebrania.
- source_word: יַד יְהוָה
  choice: mkono wa Yahwe
  rationale: Inahifadhi sitiari ya Kiebrania inayomaanisha nguvu na utendaji wa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: הָיְתָה בָם לְרָעָה
  choice: ulikuwa dhidi yao na kuwaletea madhara
  rationale: Hueleza utendaji wa Mungu uliowapinga na kuwasababishia maafa, bila kudokeza uovu wa kimaadili.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: kama vile Yahwe alivyokuwa amesema
  rationale: Wakati wa kitenzi unarejelea onyo la Mungu lililotolewa hapo awali.
- source_word: וְכַאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: na kama vile Yahwe alivyokuwa amewaapia
  rationale: Kitenzi pamoja na kihusishi kinaonyesha kiapo kilichoelekezwa kwao.
- source_word: וַיֵּצֶר לָהֶם מְאֹד
  choice: nao wakawa katika dhiki kubwa sana
  rationale: Tafsiri hii huwasilisha kwa Kiswahili cha kawaida uzito mkubwa wa taabu waliyoipata na kuhifadhi msisitizo wa מְאֹד.
theological_decisions:
- issue: Upinzani wa Mungu katika hukumu ya agano
  choice: mkono wa Yahwe ulikuwa dhidi yao na kuwaletea madhara
  alternative: mkono wa Yahwe ulikuwa dhidi yao kwa maafa
  rationale: Maneno haya yanadumisha ukweli kwamba Yahwe alitenda kwa kuwahukumu, lakini hayatafsiri רָעָה kuwa uovu wa kimaadili. Hivyo mvutano wa kiteolojia wa kifungu unabaki wazi bila kuongezewa ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kueleweka kwa wasomaji wa kawaida huku ukihifadhi sitiari ya “mkono,” jina Yahwe, na uwezekano mpana wa maana ya kutoka.
