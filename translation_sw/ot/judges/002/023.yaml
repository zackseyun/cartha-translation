  text: וַ/יַּנַּ֤ח יְהוָה֙ אֶת הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה לְ/בִלְתִּ֥י הוֹרִישָׁ֖/ם מַהֵ֑ר וְ/לֹ֥א נְתָנָ֖/ם בְּ/יַד יְהוֹשֻֽׁעַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/023.yaml
  text: So Yahweh left these nations[a], not driving them out quickly, and he did not give them into the hand of Joshua.
translation:
  language: sw
  text: Kwa hiyo Yahweh akayaacha mataifa hayo[a], bila kuyafukuza upesi, wala hakuyatia mkononi mwa Yoshua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “makundi hayo ya watu”; kitenzi cha Kiebrania kinaweza kumaanisha “akayaacha yaendelee kuwapo” au “akayaacha mahali pake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: akayaacha
  rationale: Kitenzi hiki katika muundo wa kusababisha hapa kina maana ya kuyaacha yaendelee kuwapo au kutoyaondoa; “akayaacha” ni ya asili na haiongezi maelezo yasiyo wazi katika Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahweh” badala ya kubadilishwa na cheo.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: mataifa hayo
  rationale: גּוֹיִם humaanisha mataifa au makundi ya watu; katika muktadha huu ni mataifa yaliyobaki Kanaani.
- source_word: לְבִלְתִּי הוֹרִישָׁם
  choice: bila kuyafukuza
  rationale: Kirai hasi pamoja na muundo wa kusababisha wa ירשׁ kinaeleza kutoyafukuza au kutoyanyang’anya makao yao; “bila kuyafukuza” ni wazi na cha kawaida.
- source_word: מַהֵר
  choice: upesi
  rationale: Kielezi hiki humaanisha kwa haraka; “upesi” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: וְלֹא נְתָנָם
  choice: wala hakuyatia
  rationale: נתן pamoja na “mkononi mwa” ni nahau ya kuyakabidhi chini ya mamlaka au ushindi wa mtu; “wala hakuyatia” hudumisha mfuatano hasi wa simulizi.
- source_word: בְּיַד יְהוֹשֻׁעַ
  choice: mkononi mwa Yoshua
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya kutiwa chini ya uwezo au udhibiti wa Yoshua na bado inaeleweka katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה; “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili huku ukihifadhi nahau ya “mkononi mwa Yoshua” na uwezekano wa maana katika kitenzi וַיַּנַּח.
