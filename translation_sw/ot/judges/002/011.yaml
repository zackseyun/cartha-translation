base_translation:
  language: en
  yaml_path: translation/ot/judges/002/011.yaml
  text: And the sons of Israel did what was evil in the sight of Yahweh[b][a], and they served the Baals.
translation:
  language: sw
  text: Waisraeli[a] wakafanya yaliyo maovu machoni pa Yahweh, nao wakawatumikia[b] Mabaali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wakawaabudu.” Kitenzi cha Kiebrania kinaweza kumaanisha huduma inayotolewa katika ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: wakafanya
  rationale: Kitenzi עשה kwa kawaida humaanisha ‘kufanya’; hapa kinaingia kwa ufasaha katika usemi ‘wakafanya yaliyo maovu.’
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa kwa neno kwa neno ni ‘wana wa Israeli,’ ‘Waisraeli’ ni Kiswahili cha kawaida na hujumuisha watu wa Israeli wanaotajwa kwa ujumla bila kufanya sentensi iwe nzito.
- source_word: אֶת־הָרַע
  choice: yaliyo maovu
  rationale: Huwasilisha kwa Kiswahili cha kawaida nahau ya Kiebrania ‘kufanya uovu,’ huku ikihifadhi hukumu ya kimaadili ya maandishi.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Huhifadhi sitiari ya Kiebrania kuhusu tathmini ya Mungu na ni usemi unaoeleweka katika Kiswahili sanifu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וַיַּעַבְדוּ
  choice: wakawatumikia
  rationale: עבד inaweza kumaanisha kutumikia na, katika mazingira ya kidini, kuabudu. ‘Wakawatumikia’ huhifadhi upana huo na mgongano wa kiagano kati ya kumtumikia Yahwe na kuitumikia miungu mingine.
- source_word: הַבְּעָלִים
  choice: Mabaali
  rationale: Huhifadhi wingi wa Kiebrania, unaorejelea Mabaali mbalimbali au maumbo ya kienyeji ya Baali, badala ya kuugeuza kuwa umoja.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la agano יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina יהוה moja kwa moja; ‘Yahwe’ hulihifadhi kama jina binafsi la Mungu badala ya kulibadilisha kuwa cheo.
- issue: Iwapo עבד itafsiriwe ‘kutumikia’ au ‘kuabudu’
  choice: wakawatumikia
  alternative: wakawaabudu
  rationale: Muktadha unahusu ibada ya sanamu, hivyo ‘wakawaabudu’ inawezekana; hata hivyo, ‘wakawatumikia’ inafuata kitenzi cha Kiebrania kwa karibu zaidi na kuhifadhi maana yake pana ya utii na huduma ya kidini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Waisraeli’ ni ya kawaida kuliko ‘wana wa Israeli’; ‘machoni pa Yahwe’ huhifadhi picha ya asili; na ‘Mabaali’ huhifadhi wingi wa maandishi ya Kiebrania.
