  text: וַ/יִּקְבְּר֤וּ אוֹת/וֹ֙ בִּ/גְב֣וּל נַחֲלָת֔/וֹ בְּ/תִמְנַת חֶ֖רֶס בְּ/הַ֣ר אֶפְרָ֑יִם מִ/צְּפ֖וֹן לְ/הַר גָּֽעַשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/009.yaml
  text: And they buried him within the territory of his inheritance[a], in Timnath-heres, in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: sw
  text: Nao wakamzika katika eneo la urithi wake, huko Timnath-heresi[a], katika nchi ya vilima ya Efraimu, kaskazini mwa Mlima Gaashi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Yoshua 24:30 jina hili limeandikwa “Timnath-sera” badala ya “Timnath-heresi.” Tofauti hii ya jina la mahali imehifadhiwa katika taarifa hizi mbili zinazofanana kuhusu maziko.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Nao wakamzika
  rationale: Muundo wa wayyiqtol unaendeleza simulizi kwa tukio la wakati uliopita; kiambishi -m- kinawakilisha wazi yambwa wa kiume, yaani Yoshua katika muktadha.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: katika eneo la urithi wake
  rationale: גְּבוּל hapa ina maana ya eneo lililo ndani ya mipaka, si mstari wa mpaka pekee, na נַחֲלָה ni sehemu ya ardhi aliyopokea kuwa urithi.
- source_word: בְּתִמְנַת חֶרֶס
  choice: huko Timnath-heresi
  rationale: Jina la mahali limetoholewa kwa tahajia inayoweza kutamkwa kwa Kiswahili, huku 'huko' ikionyesha mahali kwa njia ya kawaida.
- source_word: בְּהַר אֶפְרָיִם
  choice: katika nchi ya vilima ya Efraimu
  rationale: Katika usemi huu wa kijiografia, הַר inaashiria eneo la vilima, wala si mlima mmoja.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: kaskazini mwa Mlima Gaashi
  rationale: Kirai kinaeleza eneo la Timnath-heresi kwa kulihusianisha na Mlima Gaashi; 'kaskazini mwa' ni usemi wa kawaida na sahihi wa Kiswahili.
