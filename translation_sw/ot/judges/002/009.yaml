translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kisasa, wenye hadhi na unaosomeka kwa urahisi. Viunganishi vya simulizi na majina ya kijiografia yametolewa kwa njia ya kawaida bila kufuta tofauti ya jina la mahali katika kifungu sambamba.
