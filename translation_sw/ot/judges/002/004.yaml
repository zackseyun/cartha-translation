base_translation:
  language: en
  yaml_path: translation/ot/judges/002/004.yaml
  text: And when the angel of Yahweh spoke these words to all the sons of Israel[b][a], the people raised their voices and wept.
translation:
  language: sw
  text: Ikawa, Malaika[b] wa Yahweh aliposema maneno haya kwa wana wote wa Israeli[a], watu wakapaza sauti zao, wakalia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli wote”; kihalisi, “wana wote wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mjumbe wa Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: alipowaambia
  rationale: Muundo huu unaanzisha kishazi cha wakati. Kiswahili cha kawaida hutumia “alipo-”; “-waambia” huonyesha kwa kawaida kwamba maneno yalielekezwa kwa watu, bila kuongeza jambo lisilokuwamo katika muktadha.
- source_word: מַלְאַךְ יְהוָה
  choice: Malaika wa Yahweh
  rationale: מַלְאַךְ inaweza kumaanisha malaika au mjumbe. Katika usemi huu wa kibiblia, “Malaika wa Yahweh” ni tafsiri ya kawaida, huku maana mbadala ikihifadhiwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: maneno haya
  rationale: Katika muktadha huu דְּבָרִים inarejelea yaliyosemwa, kwa hiyo “maneno haya” ni sahihi na ya asili.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: wana wote wa Israeli
  rationale: Hii huhifadhi kwa karibu usemi halisi “wana wa Israeli”; tanbihi inatoa tafsiri ya kawaida zaidi “Waisraeli wote.”
- source_word: וַיִּשְׂאוּ הָעָם אֶת קוֹלָם
  choice: watu wakapaza sauti zao
  rationale: “Kupaza sauti” ni usemi wa kawaida wa Kiswahili unaolingana na nahau ya Kiebrania ya kuinua sauti; “zao” huhifadhi kiambishi cha wingi.
- source_word: וַיִּבְכּוּ
  choice: na kulia
  rationale: Kitenzi hiki humaanisha kulia au kutoa machozi; “kulia” ni cha kawaida na hakiongezi kiwango cha hisia kisichotajwa.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Utambulisho wa מַלְאַךְ יְהוָה
  choice: Malaika wa Yahweh
  alternative: mjumbe wa Yahweh
  rationale: Neno מַלְאַךְ linaweza kumaanisha mjumbe wa kibinadamu au wa mbinguni. Muktadha na matumizi ya kawaida ya usemi huu yanaunga mkono “Malaika,” lakini uwezekano wa “mjumbe” umehifadhiwa katika tanbihi bila kuamua zaidi utambulisho wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya simulizi la Maandiko. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
