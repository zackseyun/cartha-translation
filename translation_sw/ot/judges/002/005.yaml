  text: So they called the name of that place Bochim[a], and they sacrificed there to Yahweh.
translation:
  language: sw
  text: Basi wakaita mahali pale Bokimu[a], wakamtolea Yahweh dhabihu huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Bokimu linasikika kama neno la Kiebrania linalomaanisha “wanaolia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם
  choice: wakapaita
  rationale: Muundo huu wa Kiebrania una maana ya kupa jina. Kiswahili cha kawaida hutumia ‘kuita’ pamoja na kiambishi cha kitu; kutafsiri neno kwa neno ‘wakaliita jina la’ kungekuwa kizito na kisicho cha kawaida.
- source_word: הַמָּקוֹם הַהוּא
  choice: mahali pale
  rationale: ‘Mahali pale’ huwakilisha nomino yenye uainisho pamoja na kiashiria cha umbali הַהוּא kwa Kiswahili sanifu na cha asili.
- source_word: בֹּכִים
  choice: Bokimu
  rationale: Ni jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa; maana yake inayohusiana na kulia imeelezwa katika tanbihi.
- source_word: וַיִּזְבְּחוּ
  choice: wakamtolea ... dhabihu
  rationale: Kitenzi זבח humaanisha kutoa dhabihu. Muundo ‘kumtolea Yahweh dhabihu’ ni wa kawaida katika Kiswahili na unaonyesha wazi mpokeaji wa dhabihu bila kuongeza aina yake.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki hurejelea mahali pale palipotajwa na kinaendana kiasili na ngeli ya mahali.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa kuwa ‘Yahweh’; kiambishi ל kinawakilishwa ndani ya muundo wa Kiswahili ‘kumtolea ... dhabihu.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja Tetragramatoni, jina la agano la Mungu. ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Kutafsiri au kutohoa בֹּכִים
  choice: Bokimu
  alternative: Waliaji; Wanaolia
  rationale: בֹּכִים linatumika hapa kama jina la mahali. Jina limetoholewa katika matini kuu, huku uhusiano wake na neno la Kiebrania la kulia ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wakapaita’ na ‘wakamtolea ... dhabihu’ ni miundo ya asili inayohifadhi mfuatano wa masimulizi wa Kiebrania. Alama ya tanbihi [a] imewekwa mara tu baada ya jina la mahali.
