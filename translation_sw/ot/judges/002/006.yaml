id: JDG.2.6
reference: Judges 2:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֥ח יְהוֹשֻׁ֖עַ אֶת הָ/עָ֑ם וַ/יֵּלְכ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אִ֥ישׁ לְ/נַחֲלָת֖/וֹ לָ/רֶ֥שֶׁת אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/006.yaml
  text: Then Joshua sent the people away[a], and the sons of Israel went, each man to his inheritance, to take possession of the land.
translation:
  language: sw
  text: Kisha Yoshua akawaaga watu waende zao, nao Waisraeli[a] wakaenda, kila mmoja kwenye urithi wake, ili kuimiliki nchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: akawaaga watu waende zao
  rationale: Katika muktadha huu, שׁלח humaanisha kuwaondoa au kuwaacha watu waende. Kauli hii ni ya asili katika Kiswahili na inaonyesha wazi kwamba Yoshua aliwaruhusu waondoke.
- source_word: הָעָם
  choice: watu
  rationale: Kiebrania kinasema tu ‘watu’; tafsiri haiongezi ‘wa Israeli’ katika sehemu hii.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli[a]
  rationale: Huu ndio usemi wa kawaida na unaoeleweka kwa Kiswahili kwa jina la jumuiya nzima. Tafsiri halisi ya nahau ya Kiebrania imehifadhiwa katika tanbihi.
- source_word: אִישׁ
  choice: kila mmoja
  rationale: אִישׁ imetumiwa kwa maana ya mgawanyo wa watu mmoja mmoja. ‘Kila mmoja’ huwasilisha maana hiyo kwa Kiswahili bila kudokeza kwamba wanawake walitengwa na jumuiya inayotajwa.
- source_word: לְנַחֲלָתוֹ
  choice: kwenye urithi wake
  rationale: נחלה hapa ni sehemu ya nchi iliyogawiwa kama urithi. ‘Urithi’ huhifadhi uzito wa kihistoria na wa agano wa mgao huo.
- source_word: לָרֶשֶׁת
  choice: ili kuimiliki
  rationale: Kitenzi cha kusudi kinaonyesha kwamba walikwenda katika sehemu zao ili wazitwae na kukaa humo; ‘kuimiliki’ huwasilisha maana hai ya ירשׁ katika muktadha huu.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: ארץ hapa inarejelea nchi waliyopewa Israeli, si dunia kwa ujumla.
theological_decisions:
- issue: Jina la kijumuiya lenye umbo la kiume
  choice: Waisraeli
  alternative: wana wa Israeli
  rationale: Nahau בְנֵי יִשְׂרָאֵל inaitaja Israeli kwa ujumla. ‘Waisraeli’ ni Kiswahili cha kawaida na huepuka kuifanya kauli ionekane kuwahusu wanaume pekee, huku umbo halisi likielezwa katika tanbihi.
- issue: Istilahi ya mgao wa nchi
  choice: urithi
  alternative: sehemu aliyogawiwa
  rationale: ‘Urithi’ huhifadhi maana ya נחלה kama sehemu ya nchi iliyotolewa kwa Israeli, pamoja na mguso wake wa agano, badala ya kuifanya mali ya kawaida tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtiririko wa simulizi umehifadhiwa kwa ‘Kisha,’ na sentensi imeundwa kwa lugha rahisi inayoeleweka kwa wasomaji wa kawaida.
