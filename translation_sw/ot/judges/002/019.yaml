  terminology: “Mwamuzi,” “miungu mingine,” “kuitumikia,” “kuisujudia,” and “njia ... ya ukaidi” appropriately preserve the historical setting and the distinct Hebrew cultic terms. The footnote responsibly explains the Hebrew image behind “hawakuacha.”
