  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/מ֣וֹת הַ/שּׁוֹפֵ֗ט יָשֻׁ֨בוּ֙ וְ/הִשְׁחִ֣יתוּ מֵֽ/אֲבוֹתָ֔/ם לָ/לֶ֗כֶת אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים לְ/עָבְדָ֖/ם וּ/לְ/הִשְׁתַּחֲוֺ֣ת לָ/הֶ֑ם לֹ֤א הִפִּ֨ילוּ֙ מִ/מַּ֣עַלְלֵי/הֶ֔ם וּ/מִ/דַּרְכָּ֖/ם הַ/קָּשָֽׁה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/019.yaml
  text: And when the judge died[a], they turned back and acted more corruptly than their fathers, going after other gods to serve them and to bow down to them. They did not drop any of their deeds or their stubborn way.
translation:
  language: sw
  text: Ikawa kwamba mwamuzi alipokufa, walirudi na kutenda maovu zaidi kuliko baba zao. Waliifuata miungu mingine ili kuitumikia na kuisujudia. Hawakuacha[a] matendo yao wala njia yao ya ukaidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “hawakuyaangusha” matendo yao; yaani, hawakuyaacha wala kuyatupilia mbali.
    reason: Kufafanua taswira ya Kiebrania katika לֹא הִפִּילוּ bila kutumia usemi usio wa kawaida katika maandishi makuu.
lexical_decisions:
- source_word: וְהָיָה בְּמוֹת הַשּׁוֹפֵט
  choice: Ikawa mwamuzi alipokufa
  rationale: Muundo wa Kiebrania unaanzisha hali inayotokea mwamuzi anapokufa. “Ikawa ... alipokufa” huhifadhi mfuatano wa simulizi kwa Kiswahili cha asili bila kuufanya kuwa mzito.
- source_word: יָשֻׁבוּ
  choice: walirudi
  rationale: Kitenzi שׁוב kinaonyesha kurejea katika mwenendo wa awali baada ya kipindi cha muda cha kuwajibika chini ya mwamuzi.
- source_word: וְהִשְׁחִיתוּ מֵאֲבוֹתָם
  choice: na kutenda kwa upotovu zaidi kuliko baba zao
  rationale: Hiphil ya שׁחת hapa inaeleza mwenendo uliopotoka, huku מִן ikitoa ulinganisho na kizazi kilichotangulia. “Baba zao” huhifadhi usemi wa moja kwa moja wa chanzo, unaomaanisha waliowatangulia.
- source_word: לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: Waliifuata miungu mingine
  rationale: Usemi “kwenda nyuma ya” una maana ya kufuata kwa uaminifu au kujitolea. “Kuifuata” ni Kiswahili cha kawaida kinachohifadhi maana hiyo; upatanisho wa ngeli katika “waliifuata” unarejelea “miungu” kama nomino ya ngeli ya 4.
- source_word: לְעָבְדָם
  choice: ili kuitumikia
  rationale: עבד kwa habari ya miungu ni kuitumikia kwa namna ya ibada. “Kuitumikia” huhifadhi tofauti yake na tendo linalofuata la kusujudu.
- source_word: וּלְהִשְׁתַּחֲוֹת לָהֶם
  choice: na kuisujudia
  rationale: Kitenzi hiki hueleza kuinama au kujitupa chini kwa heshima ya ibada. “Kuisujudia” ni cha kawaida na huhifadhi picha ya tendo la mwili.
- source_word: לֹא הִפִּילוּ מִמַּעַלְלֵיהֶם
  choice: Hawakuacha matendo yao
  rationale: Kwa maana ya nahau, Hiphil ya נפל pamoja na מִן inaonyesha kutoyaacha au kutoyatupilia mbali matendo hayo. “Hawakuacha” ni wazi na ya asili; taswira halisi imeelezwa katika tanbihi.
- source_word: וּמִדַּרְכָּם הַקָּשָׁה
  choice: wala njia yao ya ukaidi
  rationale: דֶּרֶךְ ni sitiari ya mwenendo, na קָשֶׁה hapa ni ugumu wa moyo au ukaidi, si ugumu wa kimwili. “Njia yao ya ukaidi” huhifadhi sitiari na maana ya kimaadili.
theological_decisions:
- issue: Maana ya אֱלֹהִים אֲחֵרִים katika muktadha wa kuiacha ibada ya BWANA
  choice: miungu mingine
  alternative: miungu ya kigeni
  rationale: “Miungu mingine” huhifadhi tofauti ya msingi kati ya BWANA na miungu mingine bila kuongeza wazo la kikabila au la nchi za nje ambalo kivumishi cha Kiebrania hakilazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi ndefu ya Kiebrania imegawanywa ili iwe wazi. Maneno “miungu,” “kuitumikia,” na “kuisujudia” yanadumisha tofauti za msamiati wa chanzo.
