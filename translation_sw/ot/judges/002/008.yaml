base_translation:
  language: en
  yaml_path: translation/ot/judges/002/008.yaml
  text: And Joshua son of Nun[a], the servant of Yahweh, died at the age of one hundred and ten years.
translation:
  language: sw
  text: Yoshua mwana wa Nuni, mtumishi[a] wa Yahweh, akafa akiwa na umri wa miaka mia moja na kumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumwa wa Yahweh.” Neno la Kiebrania linaweza kumaanisha mtumishi au mtumwa, lakini hapa linatumika kama cheo cha heshima cha Yoshua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Qal wayyiqtol ya מות inaendeleza mfululizo wa simulizi. Kiswahili hutumia kwa kawaida kitenzi cha wakati uliopita “akafa” kuonyesha tukio linalofuata.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia, likihifadhi jina la mtu badala ya kulitafsiri.
- source_word: בִּן נוּן
  choice: mwana wa Nuni
  rationale: Mnyororo huu wa hali ya kuambatana unaonyesha uzazi; “mwana wa Nuni” ni Kiswahili cha kawaida na wazi.
- source_word: עֶבֶד יְהוָה
  choice: mtumishi wa Yahweh
  rationale: עֶבֶד inaweza kumaanisha mtumishi au mtumwa. Hapa ni cheo cha heshima cha Yoshua katika uhusiano wake na Yahweh, hivyo “mtumishi” linafaa katika matini kuu huku maana nyingine ikitajwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kuwa “Yahweh,” badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika chanzo.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: akiwa na umri wa miaka mia moja na kumi
  rationale: Nahau ya Kiebrania hutumia kihalisi “mwana wa” kutaja umri. Kiswahili cha sasa hueleza maana hiyo kwa kawaida kwa “akiwa na umri wa miaka…” bila kupoteza idadi kamili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja. “Yahweh” huhifadhi jina hilo badala ya kuliwakilisha kwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Jinsi ya kutafsiri עֶבֶד katika cheo cha Yoshua
  choice: mtumishi
  alternative: mtumwa
  rationale: Neno la Kiebrania linaweza kuwa “mtumishi” au “mtumwa.” Katika muktadha huu linatumika kama cheo cha heshima cha Yoshua; “mtumishi” linaonyesha matumizi hayo, na tanbihi huhifadhi uwezekano wa maana nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. Mpangilio umefanywa wa kawaida kwa Kiswahili huku mfululizo wa simulizi, jina la Mungu, cheo cha Yoshua, na umri kamili vikihifadhiwa.
