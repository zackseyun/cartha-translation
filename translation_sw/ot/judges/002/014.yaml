base_translation:
  language: en
  yaml_path: translation/ot/judges/002/014.yaml
  text: Then the anger of Yahweh burned against Israel[a], and he gave them into the hand of plunderers, who plundered them. He sold them into the hand of their enemies all around[c][b], so that they could no longer stand before their enemies.
translation:
  language: sw
  text: Ndipo hasira ya Yahwe ikawaka dhidi ya Israeli[a], naye akawatia mikononi mwa waporaji[b], nao wakawapora. Akawauza mikononi mwa maadui zao waliowazunguka[c], nao hawakuweza tena kusimama mbele ya maadui zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe akawakasirikia Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “katika mkono wa”; huu ni usemi unaomaanisha kuwa chini ya mamlaka ya mtu.
    reason: cultural_note
  - marker: c
    text: Au, “maadui zao pande zote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: hasira ... ikawaka
  rationale: Inahifadhi sitiari ya Kiebrania ya hasira kuwaka, huku ikiwa Kiswahili cha kawaida na chenye nguvu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inawakilisha jina la Mungu lililoandikwa kwa herufi nne za Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: akawatia mikononi mwa
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi taswira ya mkono na maana ya kuwaweka chini ya mamlaka ya wengine.
- source_word: שֹׁסִים / וַיָּשֹׁסּוּ
  choice: waporaji ... wakawapora
  rationale: Inahifadhi uhusiano wa mzizi mmoja kati ya nomino na kitenzi katika Kiebrania.
- source_word: וַיִּמְכְּרֵם
  choice: Akawauza
  rationale: Inahifadhi maana halisi na taswira kali ya kitenzi 'kuuza' badala ya kuirahisisha kuwa 'kuwakabidhi.'
- source_word: אֹיְבֵיהֶם מִסָּבִיב
  choice: maadui wao waliokuwa pande zote
  rationale: Inawasilisha wazo la maadui kuwapo pande zote bila kulazimisha zaidi ya kile kinachosemwa na chanzo.
- source_word: וְלֹא יָכְלוּ עוֹד לַעֲמֹד לִפְנֵי
  choice: hawakuweza tena kusimama mbele ya
  rationale: Inafuata muundo wa Kiebrania na kueleza kutoweza kushikilia msimamo mbele ya adui.
theological_decisions:
- issue: Lugha inayomhusisha Mungu na hasira kwa taswira ya kibinadamu
  choice: hasira ya Yahwe ikawaka dhidi ya Israeli
  alternative: Yahwe akawakasirikia Israeli
  rationale: Chaguo hili linahifadhi taswira dhahiri ya chanzo bila kuongeza maelezo ya kiteolojia au kuipunguza nguvu yake.
- issue: Taswira ya kuuzwa chini ya mamlaka ya maadui
  choice: Akawauza mikononi mwa maadui wao
  alternative: Akawakabidhi kwa maadui wao
  rationale: Kitenzi cha chanzo ni 'kuuza'; kukihifadhi kunaendeleza ukali wa hukumu unaoelezwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo umeweka urudiaji wa “waporaji ... wakawapora,” sitiari ya hasira kuwaka, na lugha halisi ya kuuzwa, huku semi za Kiebrania zikisomeka kwa kawaida katika Kiswahili.
