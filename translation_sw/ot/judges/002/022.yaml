base_translation:
  language: en
  yaml_path: translation/ot/judges/002/022.yaml
  text: in order to test Israel by them[a], whether they would keep the way of Yahweh by walking in it, as their fathers kept it, or not.
translation:
  language: sw
  text: ili kuwajaribu Waisraeli kwa mataifa hayo[a], ili kuona kama wataishika njia ya Yahwe kwa kuenenda katika njia hiyo, kama baba zao walivyoishika, au la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupitia mataifa hayo.” Kiwakilishi cha Kiebrania kinayarejelea mataifa yaliyoachwa nchini; tazama muktadha uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ili
  rationale: Inaonyesha kusudi la kuyaacha mataifa hayo na ni ya kawaida katika Kiswahili sanifu.
- source_word: נַסּוֹת
  choice: kuwajaribu
  rationale: Kitenzi נסה hapa kinamaanisha kuwapima Waisraeli ili utii wao udhihirike.
- source_word: בָּם
  choice: kupitia mataifa hayo
  rationale: Kiwakilishi kinayarejelea mataifa yaliyoachwa nchini katika muktadha uliotangulia; “kupitia” huhifadhi maana ya chombo bila kudai kwamba mataifa hayo ndiyo yanayofanya jaribio.
- source_word: הֲשֹׁמְרִים
  choice: waone kama wataishika
  rationale: Muundo wa swali pamoja na hali ya kuendelea unaeleza jambo lililokusudiwa kupimwa. “Kama wataishika” ni Kiswahili cha kawaida katika muktadha huu; “waone” huonyesha kwa kawaida kusudi la jaribio bila kutaja mhusika mpya kwa jina.
- source_word: דֶּרֶךְ יְהוָה
  choice: njia ya Yahwe
  rationale: Huhifadhi sitiari ya njia kama mwenendo aliouamuru Yahwe na hulitumia jina la Mungu lililo katika maandishi ya Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa jina la agano YHWH, badala ya kulibadilisha kuwa cheo.
- source_word: לָלֶכֶת בָּם
  choice: kwa kuenenda katika njia hiyo
  rationale: Huhifadhi sitiari ya Kiebrania ya kutembea au kuenenda katika njia, huku “njia hiyo” ikifanya rejeleo liwe wazi na la kawaida kwa Kiswahili.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: Huanzisha ulinganisho wa moja kwa moja na mwenendo wa baba zao.
- source_word: שָׁמְרוּ אֲבוֹתָם
  choice: baba zao walivyoishika
  rationale: Huhifadhi kurudiwa kwa kitenzi שמר na neno la ukoo la kiume אבותם.
- source_word: אִם לֹא
  choice: au la
  rationale: Hukamilisha swali la “kama ... au la” kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi YHWH; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Neno la ukoo אֲבוֹתָם
  choice: baba zao
  alternative: mababu zao au waliowatangulia
  rationale: “Baba zao” huhifadhi usemi wa kiume na wa kizazi wa Kiebrania bila kuupanua kuwa neno lisilo na jinsia.
- issue: Jaribio la Israeli
  choice: kuwajaribu Waisraeli
  alternative: kuwashawishi Waisraeli
  rationale: נסה humaanisha kupima au kuthibitisha mwenendo, si kuwashawishi watende uovu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya “njia” na “kuenenda” imehifadhiwa kwa sababu ni muhimu katika maandishi, huku “mataifa hayo” ikibainisha wazi rejeleo la kiwakilishi cha Kiebrania.
