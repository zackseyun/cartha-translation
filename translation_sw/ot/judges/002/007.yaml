  text: וַ/יַּעַבְד֤וּ הָ/עָם֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשׁ֔וּעַ אֲשֶׁ֣ר רָא֗וּ אֵ֣ת כָּל מַעֲשֵׂ֤ה יְהוָה֙ הַ/גָּד֔וֹל אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/007.yaml
  text: And the people served Yahweh all the days of Joshua[a], and all the days of the elders who lived on after Joshua, who had seen all the great work of Yahweh that he had done for Israel.
translation:
  language: sw
  text: Nao watu wakamtumikia Yahweh siku zote za Yoshua na siku zote za wazee walioendelea kuishi baada ya Yoshua, ambao walikuwa wameona kazi kubwa yote ambayo Yahweh alikuwa ameifanyia Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kazi kubwa yote”; pia inaweza kutafsiriwa “tendo kubwa lote” au “kitendo kikubwa chote.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: wakamtumikia
  rationale: Kitenzi עבד kinapotumiwa na Yahweh kama yambwa kinaonyesha kumtumikia kwa uaminifu wa agano, jambo linalotia ndani ibada lakini ni pana kuliko ibada pekee.
- source_word: הָעָם
  choice: watu
  rationale: Hapa עם inarejelea jumuiya ya Israeli kwa pamoja; “watu” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limeandikwa moja kwa moja katika matini, kwa hiyo linawakilishwa kwa “Yahweh” badala ya kubadilishwa na cheo.
- source_word: כֹּל יְמֵי
  choice: siku zote za
  rationale: Nahau hii inaonyesha kipindi chote cha maisha au uongozi wa mtu; “siku zote za” huhifadhi taswira ya Kiebrania na inaeleweka katika Kiswahili.
- source_word: הַזְּקֵנִים
  choice: wazee
  rationale: Neno hili linaweza kuhusisha umri na pia hadhi ya viongozi wakuu wanaotambuliwa katika jamii; “wazee” huhifadhi pande zote mbili.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי
  choice: walioendelea kuishi baada ya
  rationale: Nahau hiyo ina maana ya kuishi kwa muda baada ya Yoshua; tafsiri hii ni wazi na ya kawaida bila kuashiria lazima kwamba walimzidi Yoshua kwa jumla ya miaka ya maisha.
- source_word: רָאוּ
  choice: walikuwa wameona
  rationale: Muundo huu unaonyesha kwamba wazee hao walikuwa mashahidi wa kazi hiyo kabla ya kipindi kinachosimuliwa.
- source_word: מַעֲשֵׂה ... הַגָּדוֹל
  choice: kazi yote kuu
  rationale: Umoja wa מַעֲשֵׂה unaweza kuwa wa ujumla na kurejelea jumla ya yale Yahweh aliyotenda; “kazi yote kuu” huhifadhi umoja huo na sifa ya ukubwa.
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: alikuwa ameifanyia Israeli
  rationale: 'Kihusishi ל ni cha manufaa hapa: kazi hiyo ilitendwa kwa ajili ya Israeli. “Kuifanyia Israeli” huwasilisha maana hiyo kwa ufupi.'
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania hutumia jina maalumu יהוה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Maana ya kumtumikia Yahweh
  choice: wakamtumikia
  alternative: wakamwabudu
  rationale: עבד hapa inahusu uaminifu mpana kwa Yahweh, unaojumuisha ibada lakini hauishii katika matendo ya ibada pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa wasomaji wa kawaida huku marudio ya “siku zote” na “Yahweh” yakihifadhiwa kwa sababu ni sehemu ya msisitizo wa matini ya Kiebrania.
