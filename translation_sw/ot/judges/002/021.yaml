  text: I also will no longer continue to drive out before them any of the nations that Joshua left when he died[a].
translation:
  language: sw
  text: Mimi pia sitaendelea kufukuza mbele yao hata taifa moja kati ya mataifa ambayo Yoshua aliyaacha alipokufa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mimi pia sitaendelea kufukuza mbele yao hata taifa moja kati ya mataifa ambayo Yoshua aliyaacha, naye akafa.” Kiebrania kwa karibu zaidi kinasema “naye akafa”; “alipokufa” huonyesha maana ya wakati kwa Kiswahili laini zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Mimi pia
  rationale: Muundo huu unahifadhi msisitizo wa kiwakilishi huru pamoja na wazo la kuendeleza kauli iliyotangulia.
- source_word: לֹא אוֹסִיף לְהוֹרִישׁ
  choice: sitaendelea kufukuza
  rationale: יסף ikiwa na kitenzi-jina na ukanushi huonyesha kutokomeza mwendelezo wa tendo; “sitaendelea” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: אִישׁ מִן הַגּוֹיִם
  choice: hata taifa moja kati ya mataifa
  rationale: אִישׁ hapa ina nguvu ya kigawanyo na msisitizo, yaani “hata moja”; nomino inayokusudiwa katika muktadha ni taifa kutoka miongoni mwa mataifa.
- source_word: מִפְּנֵיהֶם
  choice: mbele yao
  rationale: Huhifadhi taswira ya Kiebrania ya kuyaondoa mataifa kutoka mbele ya Israeli na inaendana kiasili na “kufukuza.”
- source_word: אֲשֶׁר עָזַב יְהוֹשֻׁעַ
  choice: ambayo Yoshua aliyaacha
  rationale: עזב humaanisha kuacha au kuacha nyuma; tafsiri hii ni wazi bila kuongeza kwamba Yoshua aliruhusu yabaki.
- source_word: וַיָּמֹת
  choice: alipokufa
  rationale: Ingawa muundo wa karibu zaidi ni “naye akafa,” kishazi cha wakati kinaeleza kwa Kiswahili laini uhusiano unaoeleweka katika muktadha.
theological_decisions:
- issue: Utambulisho wa msemaji wa kimungu
  choice: Kuhifadhi nafsi ya kwanza “Mimi” bila kuongeza “BWANA”
  alternative: Kuandika “Mimi, BWANA” kwa ufafanuzi
  rationale: Kiebrania kina kiwakilishi cha nafsi ya kwanza lakini hakirudii jina la Mungu katika mstari huu; muktadha tayari unamtambulisha msemaji.
- issue: Uhusiano wa וַיָּמֹת na kishazi kinachotangulia
  choice: 'Kutafsiri kwa maana ya wakati: “alipokufa”'
  alternative: 'Kutafsiri moja kwa moja: “naye akafa”'
  rationale: Maana ya wakati inafaa katika muktadha na ni ya kawaida kwa Kiswahili, lakini uwezekano wa muundo wa kuratibu umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Hata taifa moja” hutoa msisitizo wa distributive wa אִישׁ; “sitaendelea” huhifadhi nguvu ya יסף bila kuwa nzito kupita kiasi.
