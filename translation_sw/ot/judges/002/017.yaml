id: JDG.2.17
reference: Judges 2:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/גַ֤ם אֶל שֹֽׁפְטֵי/הֶם֙ לֹ֣א שָׁמֵ֔עוּ כִּ֣י זָנ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֜רֶךְ אֲשֶׁ֨ר הָלְכ֧וּ אֲבוֹתָ֛/ם לִ/שְׁמֹ֥עַ מִצְוֺת יְהוָ֖ה לֹא עָ֥שׂוּ כֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/017.yaml
  text: Yet they did not listen even to their judges[a], for they prostituted themselves after other gods and bowed down to them. They quickly turned aside from the way in which their fathers had walked in obeying the commandments of Yahweh; they did not do so.
translation:
  language: sw
  text: Lakini wao hawakuwasikiliza hata waamuzi wao, kwa maana walifanya ukahaba[a] kwa kuifuata miungu mingine na wakaisujudia. Waliacha upesi njia ambayo mababu zao walikuwa wameifuata kwa kuzitii amri za Yahweh; wao hawakufanya hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinatumia sitiari ya ukahaba kueleza ibada ya miungu mingine na kutokuwa waaminifu kwa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Lakini ... hata
  rationale: Muundo huu unaonyesha tofauti na simulizi lililotangulia na pia mkazo wa kwamba hawakuwasikiliza hata waamuzi wao.
- source_word: אֶל שֹׁפְטֵיהֶם לֹא שָׁמֵעוּ
  choice: wao hawakuwasikiliza hata waamuzi wao
  rationale: Kitenzi שׁמע pamoja na אֶל hapa kina maana ya kusikiliza kwa nia ya kutii. Mpangilio huu wa Kiswahili unaepusha utata kuhusu nani aliyekataa kusikiliza.
- source_word: שֹׁפְטֵיהֶם
  choice: waamuzi wao
  rationale: Neno hili linawataja viongozi maalumu walioinuliwa katika kipindi cha Waamuzi, hivyo istilahi ya kihistoria imehifadhiwa.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza sababu ya wao kutowasikiliza waamuzi.
- source_word: זָנוּ אַחֲרֵי
  choice: walifanya ukahaba kwa kuifuata
  rationale: Tafsiri hii inadumisha sitiari kali ya kutokuwa waaminifu kingono huku ikionyesha pia wazo la kuifuata miungu mingine.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Hii ni tafsiri ya moja kwa moja ya miungu iliyo tofauti na Yahweh.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: na wakaiinamia
  rationale: Inahifadhi picha ya kimwili ya kuinama mbele ya miungu hiyo kama tendo la ibada.
- source_word: סָרוּ מַהֵר
  choice: Waliacha upesi
  rationale: סור huonyesha kuondoka au kugeuka kutoka katika njia, na מַהֵר huonyesha kasi ya tendo hilo.
- source_word: מִן הַדֶּרֶךְ
  choice: njia
  rationale: Inahifadhi sitiari ya mwenendo unaopatana na agano.
- source_word: אֲשֶׁר הָלְכוּ אֲבוֹתָם
  choice: ambayo mababu zao walikuwa wameifuata
  rationale: ‘Mababu’ linafaa kwa אבותם, na ‘kuifuata njia’ ni Kiswahili cha asili kinachodumisha picha ya kutembea katika njia.
- source_word: לִשְׁמֹעַ מִצְוֺת יְהוָה
  choice: kwa kuzitii amri za Yahweh
  rationale: שׁמע ikiwa na ‘amri’ ina maana ya kutii; kishazi hiki kinaeleza jinsi mababu zao walivyoifuata njia hiyo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Kiebrania limenukuliwa badala ya kubadilishwa kuwa cheo.
- source_word: לֹא עָשׂוּ כֵן
  choice: wao hawakufanya hivyo
  rationale: Inadumisha hitimisho fupi na lenye mkazo la Kiebrania.
theological_decisions:
- issue: Sitiari ya kutokuwa waaminifu kwa agano katika זָנוּ
  choice: walifanya ukahaba kwa kuifuata miungu mingine
  alternative: walikosa uaminifu kwa kuifuata miungu mingine
  rationale: Kiebrania kinatumia kwa makusudi sitiari kali ya ukahaba kueleza ibada ya sanamu na usaliti wa agano; kuifanya kuwa ‘kukosa uaminifu’ pekee kungepunguza nguvu yake.
- issue: Uwakilishi wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Ukunukuzi huu huhifadhi jina binafsi lililo katika matini ya Kiebrania badala ya kuliwakilisha kwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ni wazi kwa msomaji wa kawaida, huku sitiari kali ya Kiebrania, picha ya njia, na jina Yahweh vikihifadhiwa.
