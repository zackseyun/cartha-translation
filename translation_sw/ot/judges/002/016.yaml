base_translation:
  language: en
  yaml_path: translation/ot/judges/002/016.yaml
  text: Then Yahweh raised up judges[a], and they saved them from the hand of those who plundered them.
translation:
  language: sw
  text: Ndipo Yahweh akawainua waamuzi, nao wakawaokoa[a] kutoka mikononi mwa wale waliowapora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliwakomboa.”
    reason: mbadala wa kileksia wa וַיּוֹשִׁיעוּם unaohifadhiwa sambamba na tanbihi ya Kiingereza
lexical_decisions:
- source_word: וַיָּקֶם
  choice: akawainua
  rationale: Hifili ya קום inaonyesha kwamba Yahweh alifanya viongozi hawa watokee kwa kusudi maalumu; “akawainua” huhifadhi wazo la hatua na uteuzi wa Mungu kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetafsiriwa kwa namna ya kulitamka kama jina binafsi badala ya kulibadili kuwa cheo.
- source_word: שֹׁפְטִים
  choice: waamuzi
  rationale: “Waamuzi” ni tafsiri ya moja kwa moja ya שֹׁפְטִים na huhifadhi istilahi kuu ya kitabu, bila kupunguza jukumu lao kuwa la ukombozi pekee.
- source_word: וַיּוֹשִׁיעוּם
  choice: wakawaokoa
  rationale: Kitenzi ישׁע hapa humaanisha kuwaokoa au kuwakomboa kutoka katika hatari na nguvu za waporaji; “wakawaokoa” ni wazi na cha asili katika muktadha huu.
- source_word: מִיַּד
  choice: kutoka mikononi mwa
  rationale: Huhifadhi sitiari ya Kiebrania ya mkono unaowakilisha mamlaka au udhibiti, na usemi huo unaeleweka kwa Kiswahili.
- source_word: שֹׁסֵיהֶם
  choice: wale waliowapora
  rationale: Neno hilo huonyesha watu waliowanyang’anya mali kwa nguvu; “waliowapora” huhifadhi maana ya uporaji kuliko neno pana kama “waliowaonea.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina binafsi la Mungu moja kwa moja; “Yahweh” hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Kusisitiza cheo cha waamuzi au kazi yao ya ukombozi
  choice: Kuhifadhi “waamuzi” na kueleza kazi yao kwa “wakawaokoa”
  alternative: Kuwaita “wakombozi”
  rationale: 'Kiebrania chenyewe hudumisha vipengele vyote viwili: linawaita waamuzi kisha linasema waliwaokoa watu. Tafsiri hii haipunguzi mojawapo.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “Ndipo … akawainua … nao …” unafuatisha mfululizo wa simulizi la Kiebrania kwa lugha ya asili. Hakuna tanbihi iliyowekwa kwa sababu mbadala wa kitenzi cha kuokoa hauhitaji kuwekwa hapa, na tanbihi ya Kiingereza iliyotolewa inaonekana kutolingana na alama yake katika maandishi.
