id: JDG.2.18
reference: Judges 2:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כִֽי הֵקִ֨ים יְהוָ֥ה לָ/הֶם֮ שֹֽׁפְטִים֒ וְ/הָיָ֤ה יְהוָה֙ עִם הַ/שֹּׁפֵ֔ט וְ/הֽוֹשִׁיעָ/ם֙ מִ/יַּ֣ד אֹֽיְבֵי/הֶ֔ם כֹּ֖ל יְמֵ֣י הַ/שּׁוֹפֵ֑ט כִּֽי יִנָּחֵ֤ם יְהוָה֙ מִ/נַּֽאֲקָתָ֔/ם מִ/פְּנֵ֥י לֹחֲצֵי/הֶ֖ם וְ/דֹחֲקֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/018.yaml
  text: Whenever Yahweh raised up judges for them[a], Yahweh was with the judge and saved them from the hand of their enemies all the days of the judge, for Yahweh was moved to pity by their groaning because of those who oppressed and afflicted them.
translation:
  language: sw
  text: Kila mara Yahwe alipowainulia waamuzi, Yahwe alikuwa pamoja na mwamuzi huyo, naye aliwaokoa kutoka mikononi mwa adui zao wakati wote wa mwamuzi huyo; kwa maana Yahwe aliguswa na huruma[a] kwa sababu ya kuugua kwao kutokana na wale waliowakandamiza na kuwatesa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe alighairi” au “Yahwe aliwahurumia.” Kitenzi cha Kiebrania kinaweza kuonyesha mabadiliko ya msimamo au mwitikio wa huruma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Kila ... alipo-
  rationale: Katika muhtasari huu wa matukio yanayojirudia, muundo huu unaonyesha kwamba jambo hilo lilitokea kila mara Yahwe alipowainulia waamuzi.
- source_word: הֵקִים
  choice: alipowainulia
  rationale: Neno hili linahifadhi picha ya Mungu kuwainua viongozi kwa ajili ya watu wake na kuonyesha wazi mpokeaji wa tendo hilo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni jina binafsi la Mungu katika maandishi ya Kiebrania, si cheo; limetoholewa kwa namna inayotambulika katika Kiswahili.
- source_word: שֹׁפְטִים
  choice: waamuzi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa viongozi wanaoitwa שֹׁפְטִים katika kitabu hiki; jukumu lao la ukombozi linaelezwa na kitenzi kinachofuata.
- source_word: וְהָיָה יְהוָה עִם הַשֹּׁפֵט
  choice: Yahwe alikuwa pamoja na mwamuzi huyo
  rationale: Tafsiri hii inaonyesha uwepo na msaada wa Mungu bila kuongeza maelezo yasiyosemwa wazi na maandishi.
- source_word: וְהוֹשִׁיעָם
  choice: aliwaokoa
  rationale: Hifili ya ישׁע hapa ina maana ya kuwaokoa au kuwakomboa kutoka katika nguvu za adui.
- source_word: מִיַּד אֹיְבֵיהֶם
  choice: kutoka mikononi mwa adui zao
  rationale: Nahau ya mkono imehifadhiwa kwa kuwa inaeleweka katika Kiswahili na kuonyesha mamlaka au udhibiti wa adui.
- source_word: כֹּל יְמֵי הַשּׁוֹפֵט
  choice: wakati wote wa mwamuzi huyo
  rationale: Kauli hii ya asili imewasilishwa kwa Kiswahili cha kawaida bila kuamua wazi kama inamaanisha muda wa uongozi wake au maisha yake yote.
- source_word: יִנָּחֵם
  choice: aliguswa na huruma
  rationale: Nifali ya נחם hapa inaonyesha mwitikio wa huruma wa Yahwe kwa mateso ya watu, huku tanbihi ikihifadhi uwezekano wa maana ya kubadili nia au kughairi.
- source_word: מִנַּאֲקָתָם
  choice: kwa sababu ya kuugua kwao
  rationale: Kihusishi kinaonyesha hali au sababu iliyochochea mwitikio wa Yahwe.
- source_word: לֹחֲצֵיהֶם וְדֹחֲקֵיהֶם
  choice: wale waliowakandamiza na kuwatesa
  rationale: Vishirikishi hivi viwili vinaeleza watu waliowaonea kwa nguvu; vimetafsiriwa kwa vitenzi viwili vya kawaida vinavyohifadhi msisitizo wa Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia jina la agano la Mungu moja kwa moja; kulitafsiri kama “Yahwe” kunahifadhi jina badala ya kulibadili kuwa cheo.
- issue: Lugha inayomweleza Mungu kwa mwitikio wa kibinadamu katika יִנָּחֵם יְהוָה
  choice: Yahwe aliguswa na huruma
  alternative: Yahwe alighairi / akabadili nia
  rationale: Chaguo kuu linaonyesha huruma ya Mungu kutokana na kuugua kwa watu, lakini tanbihi inahifadhi upana wa kitenzi cha Kiebrania na mvutano wake wa kitheolojia bila kudokeza kwamba Mungu alitubu kosa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Kila ... alipo-” unaonyesha matukio yaliyorudiwa; “mikononi mwa” huhifadhi nahau ya asili kwa namna inayoeleweka. Alama ya tanbihi imewekwa baada ya kauli inayotafsiri יִנָּחֵם.
