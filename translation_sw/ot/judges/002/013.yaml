  yaml_path: translation/ot/judges/002/013.yaml
  text: They abandoned Yahweh and served Baal and the Ashtoreths[a][b][c].
translation:
  language: sw
  text: Wakamwacha Yahwe[a] na wakawatumikia[b] Baali na Maashtorethi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakaachana na Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wakawaabudu Baali na Maashtorethi.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kina “Ashtorethi” katika umbo la wingi. Huenda wingi huu unarejelea maumbo au sanamu mbalimbali za mungu wa kike anayejulikana pia kwa jina la umoja Ashtorethi, au Astarte.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: wakamwacha
  rationale: Kitenzi עזב humaanisha kuacha au kutupa. “Wakamwacha” ni Kiswahili cha kawaida na chenye uzito unaofaa, huku muktadha ukionyesha kutokuwa waaminifu kwa agano.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kuwa “Yahwe” badala ya kubadilishwa kuwa cheo kama “BWANA.” Tahajia hii ni ya kawaida na ya asili katika Kiswahili.
- source_word: וַיַּעַבְדוּ
  choice: kumtumikia
  rationale: Kitenzi עבד kinaweza kumaanisha kutumikia na, katika muktadha wa kidini, kuabudu. “Kumtumikia” huhifadhi upana huo wa maana; ingawa viabudiwa ni zaidi ya mmoja, umbo la kiambishi cha ngeli ya mtu limetumiwa kwa maana ya kila mmoja wao kwa pamoja katika orodha.
- source_word: לַבַּעַל
  choice: Baali
  rationale: “Baali” ni toleo la Kiswahili la jina Baal. Kibainishi cha Kiebrania hakijatafsiriwa kivyake kwa sababu jina hili hutumika kwa kawaida bila kibainishi katika Kiswahili.
- source_word: וְלָעַשְׁתָּרוֹת
  choice: Maashtorethi
  rationale: Umbo la Kiebrania עשתרות ni la wingi. “Maashtorethi” huhifadhi wingi huo badala ya kuligeuza kuwa jina moja la mungu wa kike.
theological_decisions:
- issue: Wingi wa עשתרות
  choice: Maashtorethi
  alternative: Ashtorethi
  rationale: Maandishi ya Kiebrania yana umbo la wingi. Tafsiri inalihifadhi bila kuamua kama linamaanisha miungu wengi wa kike, maumbo ya mahali mbalimbali ya mungu mmoja wa kike, au sanamu zake.
- issue: Maana ya kidini ya עבד
  choice: kumtumikia
  alternative: kuwaabudu
  rationale: “Kumtumikia” hudumisha maana pana ya kitenzi cha Kiebrania, huku muktadha wa Baali na Maashtorethi ukionyesha wazi huduma ya kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi inadumisha mpangilio na uzito wa Kiebrania bila kutumia msamiati wa kizamani.
