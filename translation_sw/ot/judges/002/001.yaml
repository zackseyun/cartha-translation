id: JDG.2.1
reference: Judges 2:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֧עַל מַלְאַךְ יְהוָ֛ה מִן הַ/גִּלְגָּ֖ל אֶל הַ/בֹּכִ֑ים וַ/יֹּאמֶר֩ אַעֲלֶ֨ה אֶתְ/כֶ֜ם מִ/מִּצְרַ֗יִם וָ/אָבִ֤יא אֶתְ/כֶם֙ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר נִשְׁבַּ֨עְתִּי֙ לַ/אֲבֹ֣תֵי/כֶ֔ם וָ/אֹמַ֕ר לֹֽא אָפֵ֧ר בְּרִיתִ֛/י אִתְּ/כֶ֖ם לְ/עוֹלָֽם־־־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/001.yaml
  text: Then the angel of Yahweh went up from Gilgal to Bochim and said[a], “I brought you up from Egypt and brought you into the land that I swore to your fathers, and I said[b], ‘I will never break my covenant with you.’”
translation:
  language: sw
  text: Malaika wa Yahwe[a] akapanda kutoka Gilgali hadi Bokimu[b], akasema, “Niliwapandisha kutoka Misri na kuwaleta katika nchi niliyowaapia baba zenu, nami nikasema, ‘Sitavunja kamwe agano langu nanyi.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mjumbe wa Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: Huenda Bokimu linamaanisha “waliaji” au linarejelea mahali pa kulia.
    reason: cultural_note
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: Malaika wa Yahwe
  rationale: מַלְאַךְ inaweza kumaanisha ‘mjumbe’ au ‘malaika.’ Katika simulizi hili, ‘malaika’ ni tafsiri ya kawaida na inayofaa, huku tanbihi ikihifadhi uwezekano wa ‘mjumbe.’ Jina יהוה limetoholewa kuwa ‘Yahwe.’
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה kina maana ya kwenda au kupanda juu. ‘Akapanda’ kinahifadhi mwelekeo huo na kinaendeleza mtiririko wa simulizi kwa Kiswahili cha kawaida.
- source_word: הַגִּלְגָּל
  choice: Gilgali
  rationale: Jina la mahali limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: הַבֹּכִים
  choice: Bokimu
  rationale: Jina la mahali limehifadhiwa badala ya kutafsiriwa katika matini kuu; maana yake inaelezwa katika tanbihi.
- source_word: אַעֲלֶה אֶתְכֶם מִמִּצְרַיִם
  choice: Niliwapandisha kutoka Misri
  rationale: Ingawa umbo la kitenzi linaweza kwa kawaida kuelekea wakati usiotimilika, muktadha ni ukumbusho wa tendo la ukombozi lililopita, na kitenzi kinachofuata pia kinasimulia tendo lililotimizwa.
- source_word: וָאָבִיא אֶתְכֶם
  choice: na kuwaleta
  rationale: Hifili ya בוא humaanisha ‘kuleta’ au ‘kuingiza.’ ‘Kuwaleta katika nchi’ ni ya asili na wazi katika Kiswahili.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: ‘Nchi’ ni neno la kawaida la Kiswahili na linahifadhi dhana ya nchi iliyoahidiwa.
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתֵיכֶם
  choice: niliyowaapia baba zenu
  rationale: Tafsiri hii inahifadhi kitenzi cha kuapa na nomino ya kiume ya Kiebrania ‘baba zenu,’ bila kuibadili kimya kimya kuwa ‘mababu’ au ‘wahenga.’
- source_word: וָאֹמַר
  choice: Nilisema
  rationale: Inawasilisha moja kwa moja mwendelezo wa maneno ya msemaji kuhusu tamko lake la awali.
- source_word: לֹא אָפֵר בְּרִיתִי אִתְּכֶם לְעוֹלָם
  choice: Sitavunja kamwe agano langu nanyi
  rationale: הפר katika muktadha wa agano ni ‘kuvunja’ au ‘kubatilisha.’ ‘Sitavunja kamwe’ linaeleza kwa Kiswahili cha kawaida mkazo wa ukanushi wa kudumu.
theological_decisions:
- issue: Utambulisho wa מַלְאַךְ יְהוָה
  choice: Malaika wa Yahwe
  alternative: Mjumbe wa Yahwe; au kueleza wazi kuwa ni malaika aliyeumbwa au udhihirisho wa Yahwe mwenyewe
  rationale: Aya inamtaja msemaji kama malaika wa Yahwe, lakini huyo msemaji anatumia nafsi ya kwanza kwa matendo na agano ya Mungu. Tafsiri inahifadhi mvutano huo bila kuamua utambulisho wake zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Viunganishi vya kisimulizi ‘akapanda’ na ‘akasema’ vinatoa mtiririko wa kawaida; usemi wa moja kwa moja unahifadhi mpito wa ghafla kwenda kwa sauti ya Mungu.
