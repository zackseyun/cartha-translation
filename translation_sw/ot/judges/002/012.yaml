language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּעַזְב֞וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבוֹתָ֗/ם הַ/מּוֹצִ֣יא אוֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַ/יֵּלְכ֞וּ אַחֲרֵ֣י אֱלֹהִ֣ים אֲחֵרִ֗ים מֵ/אֱלֹהֵ֤י הָֽ/עַמִּים֙ אֲשֶׁר֙ סְבִיב֣וֹתֵי/הֶ֔ם וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם וַ/יַּכְעִ֖סוּ אֶת יְהוָֽה־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/012.yaml
  text: And they abandoned Yahweh[a], the God of their fathers, who had brought them out from the land of Egypt, and went after other gods from among the gods of the peoples who were around them, and they bowed down to them and provoked Yahweh to anger.
translation:
  language: sw
  text: Nao wakamwacha Yahwe, Mungu wa baba zao, aliyewatoa katika nchi ya Misri. Wakafuata miungu mingine kutoka miongoni mwa[a] miungu ya mataifa yaliyowazunguka, wakaisujudia na kumkasirisha Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miungu ya mataifa yaliyowazunguka.” Kirai cha Kiebrania kinaweza kueleweka kwa upana zaidi kuwa miungu iliyoabudiwa na mataifa yaliyowazunguka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: wakamwacha
  rationale: Kitenzi עזב hapa kinaonyesha kumwacha Yahwe kwa kuvunja uaminifu, si kuondoka mahali tu. “Wakamwacha” ni Kiswahili cha kawaida chenye uzito huo wa kimahusiano.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kuwa “Yahwe” badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: Mungu wa baba zao
  rationale: Huhifadhi muundo wa agano na rejeo la wazi la אבות kwa mababa wao.
- source_word: הַמּוֹצִיא אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: aliyekuwa amewatoa katika nchi ya Misri
  rationale: Kirai shirikishi chenye kibainishi kinamtambulisha Yahwe kwa tendo la Kutoka. Wakati timilifu huonyesha kwamba tendo hilo lilitangulia kumwacha kwao.
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: wakafuata
  rationale: Nahau ya Kiebrania inaonyesha kufuata kwa utii au uaminifu; “wakafuata” ni ya asili katika Kiswahili na huepuka tafsiri ngumu ya neno kwa neno.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Hii ndiyo maana ya moja kwa moja ya kivumishi אֲחֵרִים bila kuongeza wazo la “kigeni.”
- source_word: מֵאֱלֹהֵי הָעַמִּים אֲשֶׁר סְבִיבוֹתֵיהֶם
  choice: kutoka miongoni mwa miungu ya mataifa yaliyowazunguka
  rationale: 'מִן linaeleweka kwa maana ya sehemu ya kundi: miungu hiyo mingine ilitokana na miungu iliyoabudiwa na mataifa jirani. “Kutoka miongoni mwa” hudhihirisha uhusiano huo kwa kawaida.'
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: wakaisujudia
  rationale: Kitenzi kinaonyesha kuinama au kujitupa chini katika ibada. “Kuisujudia” huhifadhi tendo halisi na maana yake ya ibada; kiambishi cha ngeli ya “miungu” hurejelea miungu kwa pamoja.
- source_word: וַיַּכְעִסוּ אֶת יְהוָה
  choice: kumkasirisha Yahwe
  rationale: Hiphil ya כעס ina maana ya kumsababisha mtu akasirike; “kumkasirisha” huhifadhi nguvu hiyo ya kisababishi kwa ufupi na kawaida.
theological_decisions:
- issue: Kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina binafsi la agano. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha na cheo.
- issue: Uzito wa kiagano wa uasi wa Israeli
  choice: Kuhifadhi lugha ya kumwacha, kufuata miungu, kuisujudia, na kumkasirisha Yahwe bila ufafanuzi wa ziada
  alternative: Kuongeza wazi kwamba walivunja agano
  rationale: Mstari wenyewe unaonyesha uasi huo kwa matendo yaliyotajwa. Tafsiri haiongezi tamko la kitheolojia lisilosemwa moja kwa moja.
- issue: Maana ya מִן katika kirai kuhusu miungu ya mataifa
  choice: 'Maana ya sehemu ya kundi: “kutoka miongoni mwa”'
  alternative: 'Maana ya jumla: “miungu ya mataifa yaliyowazunguka”'
  rationale: Muundo wa Kiebrania unaweza kusomwa kwa maana ya sehemu ya kundi, na hilo linaweza kuonyeshwa kwa Kiswahili bila kubadili hoja ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi mbili zimetumiwa ili kurahisisha usomaji bila kuvunja mfululizo wa simulizi. Hakuna tanbihi iliyowekwa kwa kuwa toleo la Kiingereza lina alama [a] iliyohusishwa kimakosa na “Yahweh,” ilhali tanbihi yake inahusu kirai cha miungu ya mataifa; maana iliyochaguliwa imewasilishwa wazi katika matini.
