  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/גַ֣ם אָמַ֔רְתִּי לֹֽא אֲגָרֵ֥שׁ אוֹתָ֖/ם מִ/פְּנֵי/כֶ֑ם וְ/הָי֤וּ לָ/כֶם֙ לְ/צִדִּ֔ים וֵ/אלֹ֣הֵי/הֶ֔ם יִהְי֥וּ לָ/כֶ֖ם לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/003.yaml
  text: So I also said[a], ‘I will not drive them out from before you; they will become adversaries to you, and their gods will become a snare to you.’
translation:
  language: sw
  text: Na mimi pia nilisema[a], ‘Sitawafukuza watoke mbele yenu; watakuwa wapinzani wenu, na miungu yao itakuwa mtego kwenu.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi “pande.” Baadhi ya tafsiri za kale na vifungu vinavyofanana husoma au kufasiri, “miiba ubavuni mwenu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Kwa hiyo mimi pia
  rationale: Huunganisha kauli hii na karipio lililotangulia huku ikionyesha nyongeza na matokeo; Kiswahili hiki ni cha kawaida na wazi.
- source_word: אָמַרְתִּי
  choice: nilisema
  rationale: Wakati uliopita unafaa katika muktadha wa simulizi, bila kuongeza uzito usiomo katika kitenzi cha kawaida ‘kusema.’
- source_word: לֹא אֲגָרֵשׁ
  choice: Sitawafukuza
  rationale: Kitenzi גרש humaanisha kufukuza au kuondoa kwa nguvu; ‘kuwafukuza’ kinafaa katika muktadha wa kuwaondoa wakazi wa nchi.
- source_word: מִפְּנֵיכֶם
  choice: mbele yenu
  rationale: Huhifadhi kwa ufupi nahau ya Kiebrania ‘kutoka mbele yenu’ na maana yake ya kuwaondoa watu waliokuwa mbele ya Israeli.
- source_word: וְהָיוּ לָכֶם
  choice: watakuwa
  rationale: Hutoa kwa kawaida maana ya hali ya baadaye itakayotokea kwao.
- source_word: לְצִדִּים
  choice: wapinzani wenu
  rationale: Maandishi ya Kimasoreti yana neno gumu linalomaanisha kihalisi ‘pande.’ Katika muktadha, ‘wapinzani wenu’ huwasilisha maana inayowezekana ya uhasama bila kuingiza moja kwa moja usomaji wa ‘miiba.’ Tofauti hiyo imewekwa katika tanbihi.
- source_word: וֵאלֹהֵיהֶם
  choice: na miungu yao
  rationale: Hii ndiyo tafsiri ya kawaida ya אלהים ikiwa na kiambishi cha nafsi ya tatu wingi katika muktadha wa ibada ya sanamu.
- source_word: יִהְיוּ לָכֶם לְמוֹקֵשׁ
  choice: itakuwa mtego kwenu
  rationale: מוקש ni mtego au tanzi, mara nyingi kwa maana ya kishawishi au hatari ya kuanguka katika dhambi; ‘mtego’ huhifadhi sitiari hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kuhifadhi ugumu wa usomaji wa Kimasoreti לְצִדִּים
  choice: wapinzani wenu
  alternative: miiba ubavuni mwenu; pande kwenu
  rationale: Neno la Kiebrania lililopo ni ‘pande,’ si ‘miiba.’ Kwa kuwa usemi huo si wazi katika Kiswahili, matini kuu inatoa maana ya kimuktadha ya uhasama, huku tanbihi ikihifadhi maana halisi na usomaji wa kale unaojulikana. Hivyo tafsiri haichagui kimya kimya tofauti ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kueleweka kwa wasomaji wa kawaida, huku tanbihi ikihifadhi ugumu halisi wa maandishi ya Kiebrania.
