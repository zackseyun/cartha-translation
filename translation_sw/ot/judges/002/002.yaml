base_translation:
  language: en
  yaml_path: translation/ot/judges/002/002.yaml
  text: And you were not to make a covenant with the inhabitants of this land; you were to tear down their altars[a]. But you have not listened to my voice. What is this you have done?
translation:
  language: sw
  text: Nanyi hamkupaswa kufanya agano[a] na wenyeji wa nchi hii; mlipaswa kubomoa madhabahu zao. Lakini hamkusikiliza sauti yangu. Ni nini hiki mlichofanya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “kukata agano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִכְרְתוּ בְרִית
  choice: kufanya agano
  rationale: Nahau ya Kiebrania hutumia kihalisi kitenzi ‘kukata’ pamoja na ‘agano,’ lakini ‘kufanya agano’ ni Kiswahili cha kawaida na huhifadhi uzito wa neno בְּרִית kuliko ‘kufanya mkataba.’
- source_word: לְיֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: na wenyeji wa nchi hii
  rationale: ‘Wenyeji’ kwa ufupi na kwa kawaida humaanisha watu wanaokaa katika nchi hiyo; ‘nchi hii’ huhifadhi kiashiria הַזֹּאת.
- source_word: מִזְבְּחוֹתֵיהֶם תִּתֹּצוּן
  choice: mlipaswa kubomoa madhabahu zao
  rationale: נתץ humaanisha kubomoa au kuangusha, hasa madhabahu na majengo. ‘Kubomoa’ ni wazi na asilia; ‘mlipaswa’ huonyesha amri ya awali inayokumbushwa katika karipio hili.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלִי
  choice: Lakini hamkuisikiliza sauti yangu
  rationale: שמע בְּקוֹל hubeba wazo la kusikia kwa kuitii. Tafsiri hii huhifadhi taswira ya ‘sauti yangu’ na kuacha maana ya kutotii ionekane katika muktadha.
- source_word: מַה זֹּאת עֲשִׂיתֶם
  choice: Ni jambo gani hili mlilofanya?
  rationale: Huhifadhi muundo na mshangao wa swali la karipio la Kiebrania bila kuligeuza kuwa swali la sababu, ‘Kwa nini mmefanya hivi?’
- source_word: וְאַתֶּם לֹא ... תִּכְרְתוּ ... תִּתֹּצוּן
  choice: Nanyi hamkupaswa ... mlipaswa
  rationale: Maumbo haya yanakumbusha maagizo ya Mungu yaliyotolewa hapo awali na yanafuatwa na taarifa ya kushindwa kwa Israeli; wakati wa wajibu uliopita unafaa katika Kiswahili.
theological_decisions:
- issue: Istilahi ya uhusiano uliokatazwa kati ya Israeli na wenyeji wa Kanaani
  choice: kufanya agano
  alternative: kufanya mkataba
  rationale: ‘Agano’ huhifadhi dhana pana ya kibiblia ya בְּרִית na kuepuka kuifanya iwe tu makubaliano ya kisiasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa wajibu uliopita huhifadhi muktadha wa karipio; swali la mwisho limeachwa lenye msisitizo na mvutano wa Kiebrania.
