base_translation:
  language: en
  yaml_path: translation/ot/judges/002/020.yaml
  text: So the anger of Yahweh burned against Israel[a], and he said, “Because this nation has transgressed my covenant that I commanded their fathers[b], and they have not listened to my voice,”
translation:
  language: sw
  text: Basi hasira ya Yahwe ikawaka dhidi ya Israeli, naye akasema, “Kwa sababu taifa hili limekiuka agano langu[a] nililowaagiza mababu zao, na hawakuisikiliza sauti yangu[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “limevunja agano langu.” Kitenzi cha Kiebrania kihalisi humaanisha “kuvuka,” na katika muktadha wa agano humaanisha kulihalifu au kulikiuka.
    reason: lexical_alternative
  - marker: b
    text: Au “hawakutii sauti yangu.” Nahau ya Kiebrania “kuisikiliza sauti yangu” mara nyingi inajumuisha maana ya kutii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: hasira ... ikawaka
  rationale: Inahifadhi sitiari ya Kiebrania ya hasira kuwaka huku ikisomeka kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatumika jina la Mungu lililo katika maandishi ya Kiebrania, kwa tahajia ya kawaida ya Kiswahili, badala ya kulibadili kuwa cheo.
- source_word: בְּיִשְׂרָאֵל
  choice: dhidi ya Israeli
  rationale: Kihusishi hiki kinaonyesha kwamba Israeli ndiye anayelengwa na hasira.
- source_word: יַעַן אֲשֶׁר
  choice: Kwa sababu
  rationale: Kifungu hiki kinatanguliza sababu ya tamko la Mungu.
- source_word: עָבְרוּ
  choice: limekiuka
  rationale: Katika muktadha wa agano, kitenzi hiki kinamaanisha kuvuka mpaka uliowekwa na hivyo kulihalifu agano; umoja unapatana na nomino ya mkusanyiko ‘taifa’.
- source_word: הַגּוֹי הַזֶּה
  choice: taifa hili
  rationale: Inadumisha neno lililotiwa alama ‘taifa’ badala ya kulainisha kuwa ‘watu hawa’.
- source_word: בְּרִיתִי
  choice: agano langu
  rationale: ‘Agano’ ni neno la kawaida na sahihi kwa uhusiano wa ברית kati ya Mungu na Israeli.
- source_word: צִוִּיתִי אֶת אֲבוֹתָם
  choice: nililowapa mababu zao kwa amri
  rationale: 'Kiswahili hiki kinaeleza kwa njia ya kawaida muundo uliobanwa wa Kiebrania: agano ndilo Mungu alilowaagiza mababu zao, bila kuongeza wajibu mahususi usiotajwa wazi.'
- source_word: שָׁמְעוּ לְקוֹלִי
  choice: hawakuisikiliza sauti yangu
  rationale: Inahifadhi sitiari ya kusikia sauti huku ikiruhusu maana inayodokezwa ya kutii.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu; kulihifadhi kunatofautisha jina hilo na cheo, bila kuingiza msimamo wa kimadhehebu.
- issue: Kudumisha lugha ya agano na hukumu
  choice: limekiuka agano langu ... hawakuisikiliza sauti yangu
  alternative: limevunja agano langu ... hawakunitii
  rationale: Uamuzi huu unahifadhi picha ya kuvuka mpaka wa agano na nahau ya kuisikiliza sauti, bila kuzipunguza kuwa kauli ya jumla kuhusu kutotii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Mababu zao’ limetumiwa kwa אבותם kwa maana pana ya waliotangulia katika ukoo. Koma ya mwisho imehifadhiwa kwa sababu sentensi ya hotuba inaendelea katika mstari unaofuata.
