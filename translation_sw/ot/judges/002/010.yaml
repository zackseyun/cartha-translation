base_translation:
  language: en
  yaml_path: translation/ot/judges/002/010.yaml
  text: And all that generation also were gathered to their fathers[a], and another generation arose after them who did not know Yahweh[b], or even the work that he had done for Israel.
translation:
  language: sw
  text: Kizazi kile chote pia wakakusanywa pamoja na baba zao[a]. Na kizazi kingine kikainuka baada yao, ambacho hakikumjua Yahwe[b], wala matendo aliyowafanyia Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wakakusanywa pamoja na baba zao,” nahau inayomaanisha kwamba walikufa na kuungana na waliowatangulia katika ukoo.'
    reason: cultural_note
  - marker: b
    text: Au, “hakikumtambua Yahwe.” Neno la Kiebrania linaweza kumaanisha kumjua au kumtambua katika uhusiano wa agano, si kuwa na habari za hakika tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם כָּל הַדּוֹר הַהוּא
  choice: Watu wote wa kizazi kile pia
  rationale: Neno וְגַם linaendeleza na kusisitiza taarifa iliyotangulia, huku הַדּוֹר ikimaanisha kundi la watu wa wakati huo. Kuongeza “watu wa” kunafanya Kiswahili kiwe cha kawaida bila kubadili maana.
- source_word: נֶאֶסְפוּ אֶל אֲבוֹתָיו
  choice: wakakusanywa kwa baba zao
  rationale: Nahau ya Kiebrania imehifadhiwa ili kuonyesha kifo na kuungana na waliotangulia katika ukoo; tanbihi inaeleza maana yake ya kitamaduni.
- source_word: וַיָּקָם דּוֹר אַחֵר אַחֲרֵיהֶם
  choice: Baada yao kikainuka kizazi kingine
  rationale: “Kikainuka” huhifadhi picha ya kitenzi קום, nayo “baada yao” huonyesha wazi mfuatano wa vizazi.
- source_word: לֹא יָדְעוּ אֶת יְהוָה
  choice: hakikumjua Yahwe
  rationale: Kitenzi יָדַע kinaweza kumaanisha kujua kwa habari, uzoefu, uhusiano, au kumtambua kwa uaminifu. “Kumjua” huhifadhi upana huo bila kuamua maana moja tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya kawaida na inayoeleweka katika Kiswahili, badala ya kulibadilisha kuwa cheo.
- source_word: וְגַם אֶת הַמַּעֲשֶׂה אֲשֶׁר עָשָׂה לְיִשְׂרָאֵל
  choice: wala kazi aliyokuwa ameifanyia Israeli
  rationale: Baada ya kauli hasi, “wala” huwasilisha kwa kawaida nguvu ya nyongeza ya וְגַם. “Kazi” inaweza kujumuisha matendo ya Yahwe, na “ameifanyia Israeli” huonyesha kwamba tendo hilo lilikuwa kwa ajili ya Israeli.
theological_decisions:
- issue: Maana ya kutomjua Yahwe
  choice: Kauli pana “hakikumjua Yahwe” imehifadhiwa katika matini kuu.
  alternative: “Hakikumtambua Yahwe” au “hakikuwa na uhusiano wa agano na Yahwe.”
  rationale: Kiebrania kinaweza kuhusisha kutokuwa na ufahamu wa matendo ya Yahwe pamoja na kutomjua au kutomtambua katika uhusiano wa agano. Muktadha unaruhusu mvutano huo ubaki wazi.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: “Yahwe” huwasilisha jina la pekee katika matini ya Kiebrania na kulitofautisha na cheo cha kawaida cha “Bwana.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa sasa, na unaosomeka kwa urahisi. Nahau ya Kiebrania imehifadhiwa kwa kiasi kinachowezekana na kufafanuliwa kwa tanbihi.
