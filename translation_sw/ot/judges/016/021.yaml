base_translation:
  language: en
  yaml_path: translation/ot/judges/016/021.yaml
  text: Then the Philistines seized him[a], gouged out his eyes, brought him down to Gaza, bound him with bronze shackles[b], and he was grinding in the prison house.
translation:
  language: sw
  text: Ndipo Wafilisti wakamkamata, wakayangoa macho yake, wakamteremsha hadi Gaza, wakamfunga kwa pingu za shaba, naye akawa akisaga katika gereza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאחֲזוּהוּ
  choice: wakamkamata
  rationale: Kitenzi אחז humaanisha kushika kwa nguvu au kukamata; “wakamkamata” kinafaa kwa tendo la uadui katika muktadha huu.
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili cha Biblia.
- source_word: וַיְנַקְּרוּ אֶת־עֵינָיו
  choice: wakamng’oa macho
  rationale: נקר hapa ni neno halisi la kuyaharibu macho kwa ukatili; “kung’oa macho” linaweka wazi tendo hilo kuliko kusema tu walimpofusha.
- source_word: וַיּוֹרִידוּ אֹתוֹ עַזָּתָה
  choice: wakampeleka chini mpaka Gaza
  rationale: Hifili ya ירד ina maana ya kumteremsha au kumpeleka chini, na ה ya mwelekeo katika עַזָּתָה inaonyesha mwendo kuelekea Gaza.
- source_word: וַיַּאַסְרוּהוּ
  choice: wakamfunga
  rationale: אסר humaanisha kufunga au kutia vifungoni; “wakamfunga” huhifadhi tendo tofauti na hali ya kuwekwa gerezani.
- source_word: בַּנְחֻשְׁתַּיִם
  choice: kwa pingu za shaba
  rationale: Umbo hili linataja vifungo vya metali, yaelekea vya mikono au miguu; “pingu za shaba” ni usemi wazi na wa kawaida wa Kiswahili.
- source_word: וַיְהִי טוֹחֵן
  choice: naye akawa akisaga
  rationale: Muundo huu unaonyesha shughuli endelevu iliyokuwa hali yake mpya. Hakuna kitu kinachosagwa kilichotajwa wazi katika Kiebrania, kwa hiyo hakijaongezwa.
- source_word: בְּבֵית הָאֲסִירִים
  choice: katika gereza
  rationale: Kihalisi ni “katika nyumba ya wafungwa”; “katika gereza” ni Kiswahili cha asili kinachowasilisha maana hiyo bila usemi mzito.
