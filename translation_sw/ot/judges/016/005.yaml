  text: וַ/יַּעֲל֨וּ אֵלֶ֜י/הָ סַרְנֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֨אמְרוּ לָ֜/הּ פַּתִּ֣י אוֹת֗/וֹ וּ/רְאִי֙ בַּ/מֶּה֙ כֹּח֣/וֹ גָד֔וֹל וּ/בַ/מֶּה֙ נ֣וּכַל ל֔/וֹ וַ/אֲסַרְנֻ֖/הוּ לְ/עַנֹּת֑/וֹ וַ/אֲנַ֨חְנוּ֙ נִתַּן לָ֔/ךְ אִ֕ישׁ אֶ֥לֶף וּ/מֵאָ֖ה כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/005.yaml
  text: Then the lords of the Philistines came up to her and said to her[a], “Entice him, and see in what his great strength lies, and by what means we may prevail against him, so that we may bind him to afflict him; and we will each give you eleven hundred pieces of silver.”
translation:
  language: sw
  text: Ndipo wakuu wa Wafilisti wakamwendea na kumwambia, “Mshawishi kwa hila, upate kujua nguvu zake kuu zinatokana na nini, na ni kwa njia gani tunaweza kumshinda, ili tumfunge na kumtesa. Nasi kila mmoja wetu atakupa vipande elfu moja na mia moja vya fedha[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania, kwa neno kwa neno: “elfu moja na mia moja za fedha.” Neno “kila mmoja” linaonyesha kwamba kila mkuu angeitoa kiasi hicho. Kipimo cha fedha, kama vipande au shekeli, hakitajwi wazi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: wakamwendea
  rationale: Kitenzi kinaonyesha kusogea kuelekea kwake. ‘Wakamwendea’ ni Kiswahili cha kawaida kinachohifadhi mwelekeo huo bila tafsiri sisisi isiyo ya kawaida ya ‘wakapanda kwake.’
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: wakuu wa Wafilisti
  rationale: סרן ni cheo cha watawala wa miji ya Wafilisti. ‘Wakuu’ ni neno la heshima na la kawaida katika muktadha huu, bila kudokeza mfumo mahususi wa kisiasa usiotajwa.
- source_word: פַּתִּי
  choice: Mshawishi
  rationale: Kauli ya kuamuru katika piel humtaka amvute kwa hila ili afichue siri. ‘Mshawishi’ linaonyesha ushawishi wa hila bila kuingiza maana ya kingono ambayo kitenzi chenyewe hailazimishi.
- source_word: וּרְאִי בַּמֶּה כֹּחוֹ גָדוֹל
  choice: upate kujua nguvu zake nyingi zinatokana na nini
  rationale: במה huuliza msingi au chanzo cha nguvu zake. Usemi huu ni wa asili katika Kiswahili na unaweka wazi kwamba wanatafuta siri ya nguvu hizo.
- source_word: וּבַמֶּה נוּכַל לוֹ
  choice: na ni kwa njia gani tunaweza kumshinda
  rationale: Nahau יכל ל humaanisha kumweza au kumshinda mtu. ‘Kumshinda’ huhifadhi maana ya kupata ushindi dhidi yake na inafaa katika muktadha wa uadui.
- source_word: וַאֲסַרְנֻהוּ
  choice: ili tumfunge
  rationale: Muundo huu unaonyesha hatua iliyokusudiwa baada ya kugundua siri na kumshinda. ‘Kumfunga’ ni tafsiri ya moja kwa moja na ya kawaida ya אסר.
- source_word: לְעַנֹּתוֹ
  choice: na kumtesa
  rationale: ענה katika piel inaweza kumaanisha kutesa, kudhulumu, au kunyenyekeza kwa mateso. ‘Kumtesa’ huhifadhi wazo pana la kumsababishia mateso bila kufafanua aina yake.
- source_word: וַאֲנַחְנוּ נִתַּן לָךְ אִישׁ אֶלֶף וּמֵאָה כָּסֶף
  choice: Nasi kila mmoja wetu atakupa vipande elfu moja na mia moja vya fedha
  rationale: 'איש limetumiwa kwa maana ya kugawanya: kila mmoja wao angetoa kiasi hicho. Kiebrania kinasema kwa ufupi ‘elfu moja na mia moja fedha’; ‘vipande ... vya fedha’ hukamilisha maana kwa Kiswahili bila kudai kwamba kipimo cha shekeli kimetajwa wazi.'
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa Biblia lakini kinachoeleweka kwa msomaji wa kawaida wa leo. ‘Ndipo’ na vitenzi vya mfululizo wa ‘waka-’ vinadumisha mwendo wa simulizi; msamiati umewekwa wenye heshima na usio wa kimadhehebu.
