  text: וַ/יַּעֲלוּ לָ֞/הּ סַרְנֵ֣י פְלִשְׁתִּ֗ים שִׁבְעָ֛ה יְתָרִ֥ים לַחִ֖ים אֲשֶׁ֣ר לֹא חֹרָ֑בוּ וַ/תַּאַסְרֵ֖/הוּ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/008.yaml
  text: So the Philistine rulers brought up to her seven fresh bowstrings that had not been dried[a], and she bound him with them.
translation:
  language: sw
  text: Basi watawala wa Wafilisti[a] wakamletea kamba saba mbichi za upinde ambazo hazikuwa zimekauka, naye akamfunga nazo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, wakuu wa Wafilisti. Neno la Kiebrania linamaanisha viongozi wakuu wa Wafilisti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ לָהּ
  choice: wakamletea
  rationale: Kitenzi עלה kina maana ya msingi ya kupanda au kuleta juu, lakini katika muktadha huu viongozi wanamfikishia Delila vitu alivyoomba. “Wakamletea” ni ya asili katika Kiswahili na inawasilisha tendo hilo bila kulazimisha nahau ya mwendo ya Kiebrania.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: watawala wa Wafilisti
  rationale: סַרְנֵי ni cheo cha viongozi wakuu wa kisiasa wa Wafilisti. “Watawala” ni wazi, cha kisasa, na hakileti taswira ya mfumo wa kimwinyi.
- source_word: שִׁבְעָה יְתָרִים
  choice: kamba saba za upinde
  rationale: יְתָרִים hapa inaelekea kumaanisha kamba zinazotumiwa kwenye upinde, si kamba za kawaida tu. “Kamba za upinde” inaeleweka kwa urahisi na kudumisha maana mahususi ya kifaa hicho.
- source_word: לַחִים
  choice: mbichi
  rationale: Kivumishi hiki huonyesha kitu chenye unyevunyevu au ambacho bado hakijakauka. “Mbichi” ni neno la kawaida la Kiswahili kwa nyenzo ambayo haijakauka au kukomaa.
- source_word: אֲשֶׁר לֹא חֹרָבוּ
  choice: ambazo hazikuwa zimekauka
  rationale: Kirai kinaeleza hali ya kamba hizo kuwa bado hazijakauka. Tafsiri hii ni ya asili na haiamui bila lazima kama ziliachwa zikauke au zilikaushwa kwa makusudi.
- source_word: וַתַּאַסְרֵהוּ בָּהֶם
  choice: naye akamfunga nazo
  rationale: אסר humaanisha kufunga, na בָּהֶם huonyesha chombo kilichotumiwa. “Akamfunga nazo” ni fupi, wazi, na inafaa mtiririko wa simulizi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa msomaji wa kawaida. Kiunganishi “Basi” kinaendeleza mlolongo wa simulizi, huku “naye” kikitenganisha kwa uwazi tendo la Delila na lile la watawala.
