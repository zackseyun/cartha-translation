  text: לַֽ/עַזָּתִ֣ים לֵ/אמֹ֗ר בָּ֤א שִׁמְשׁוֹן֙ הֵ֔נָּה וַ/יָּסֹ֛בּוּ וַ/יֶּאֶרְבוּ ל֥/וֹ כָל הַ/לַּ֖יְלָה בְּ/שַׁ֣עַר הָ/עִ֑יר וַ/יִּתְחָרְשׁ֤וּ כָל הַ/לַּ֨יְלָה֙ לֵ/אמֹ֔ר עַד א֥וֹר הַ/בֹּ֖קֶר וַ/הֲרְגְנֻֽ/הוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/002.yaml
  text: The Gazites were told[a], saying, “Samson has come here.” So they surrounded him and lay in wait for him all night at the city gate. They kept quiet all night, saying, “Until the light of morning[c][b], then we will kill him.”
translation:
  language: sw
  text: Watu wa Gaza wakaambiwa[a], “Samsoni amekuja hapa.” Basi wakazingira mahali hapo na kumvizia usiku kucha kwenye lango la mji. Wakakaa kimya[b] usiku kucha, wakisema, “Nuru ya asubuhi itakapotokea, ndipo tutamuua.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakazi wa Gaza wakaambiwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wakanyamaza”; Kiebrania kinadokeza ukimya wa kujificha wakati wa kuvizia.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעַזָּתִים
  choice: Watu wa Gaza
  rationale: Ni nomino ya wakazi wa Gaza; ‘Watu wa Gaza’ ni Kiswahili cha kawaida na wazi kuliko kuunda jina lisilozoeleka la kundi hilo.
- source_word: לֵאמֹר
  choice: wakaambiwa
  rationale: Muundo huu unatanguliza taarifa iliyonukuliwa. Ingawa Kiebrania hakina kitenzi cha wazi cha kutendwa kabla ya ‘kusema,’ muktadha unaonyesha kuwa habari iliwafikia watu wa Gaza.
- source_word: בָּא ... הֵנָּה
  choice: amekuja hapa
  rationale: Wakati timilifu unaonyesha kuwasili kwake kama hali ya sasa yenye umuhimu kwa hatua zinazofuata.
- source_word: וַיָּסֹבּוּ
  choice: wakamzunguka
  rationale: Kitenzi kinaweza kumaanisha kuzunguka au kuzingira. Kiwakilishi cha kitu hakijaandikwa wazi, lakini muktadha unaelekeza kwa Samsoni; tafsiri hii huepuka kuongeza ‘mahali’ pasipo katika maandishi.
- source_word: וַיֶּאֶרְבוּ לוֹ
  choice: kumvizia
  rationale: Hutoa maana ya kungoja kwa siri kwa kusudi la kumshambulia.
- source_word: כָל הַלַּיְלָה
  choice: usiku kucha
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi wazo la muda wote wa usiku.
- source_word: בְּשַׁעַר הָעִיר
  choice: kwenye lango la mji
  rationale: Hutaja eneo la lango la mji, ambalo lilikuwa njia muhimu ya kutokea.
- source_word: וַיִּתְחָרְשׁוּ
  choice: wakakaa kimya
  rationale: Katika muktadha wa kuvizia, kitenzi kinaonyesha kutenda kwa ukimya au bila kujionyesha.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: mpaka nuru ya asubuhi
  rationale: Inahifadhi taswira halisi ya Kiebrania ya ‘nuru ya asubuhi’ badala ya kuibadili moja kwa moja kuwa ‘mapambazuko.’
- source_word: וַהֲרְגְנֻהוּ
  choice: ndipo tutakapomuua
  rationale: 'Huwasilisha mfuatano wa wakati unaodokezwa: baada ya nuru ya asubuhi kufika, watamuua.'
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wa kawaida, wenye heshima na unaoeleweka. ‘Watu wa Gaza’ limechaguliwa badala ya jina la kundi lisilo la kawaida katika Kiswahili. Katika usemi wa moja kwa moja, ‘Tutangoja’ limeongezwa kwa uwazi wa Kiswahili ili kubeba maana ya mpango wa kukaa kimya hadi asubuhi bila kubadili kusudi la sentensi.
