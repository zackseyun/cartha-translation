  text: וַ/יֹּ֣אמֶר שִׁמְשׁ֗וֹן תָּמ֣וֹת נַפְשִׁ/י֮ עִם פְּלִשְׁתִּים֒ וַ/יֵּ֣ט בְּ/כֹ֔חַ וַ/יִּפֹּ֤ל הַ/בַּ֨יִת֙ עַל הַ/סְּרָנִ֔ים וְ/עַל כָּל הָ/עָ֖ם אֲשֶׁר בּ֑/וֹ וַ/יִּהְי֤וּ הַ/מֵּתִים֙ אֲשֶׁ֣ר הֵמִ֣ית בְּ/מוֹת֔/וֹ רַבִּ֕ים מֵ/אֲשֶׁ֥ר הֵמִ֖ית בְּ/חַיָּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/030.yaml
  text: And Samson said[a], “Let me die with the Philistines.” Then he bent with all his strength, and the house fell on the rulers and on all the people who were in it[c][b]. So the dead whom he killed at his death were more than those whom he had killed during his life.
translation:
  language: sw
  text: Samsoni akasema[a], “Nife pamoja na Wafilisti.” Kisha akajikaza kwa nguvu, nayo nyumba[c] ikawaangukia watawala[b] na watu wote waliokuwa ndani yake. Basi, wale aliowaua wakati wa kufa kwake walikuwa wengi kuliko wale aliowaua wakati wa maisha yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa ukaribu zaidi, “Nafsi yangu na ife pamoja na Wafilisti.” Hapa “nafsi yangu” ni namna ya kumrejelea Samsoni mwenyewe.
    reason: lexical_alternative
  - marker: b
    text: Au “wakuu” wa Wafilisti.
    reason: lexical_alternative
  - marker: c
    text: Au “jengo”; neno la Kiebrania ni neno la kawaida linalomaanisha “nyumba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמוֹת נַפְשִׁי
  choice: Acha nife
  rationale: Kirai hiki ni, kwa ukaribu zaidi, ‘nafsi yangu na ife,’ lakini נֶפֶשׁ hapa ni njia ya kurejelea mtu mwenyewe. ‘Acha nife’ ni Kiswahili cha kawaida kinachohifadhi maana ya hiari/ombi bila kudokeza kwamba nafsi ni sehemu tofauti ya Samsoni.
- source_word: עִם פְּלִשְׁתִּים
  choice: pamoja na Wafilisti
  rationale: עִם humaanisha ‘pamoja na/na’; hapa inaonyesha kwamba Samsoni anakubali kufa wakati mmoja na Wafilisti.
- source_word: וַיֵּט בְּכֹחַ
  choice: akajipinda kwa nguvu zake zote
  rationale: נטה inaweza kumaanisha kuinama, kujipinda, au kuelekeza mwili. Katika muktadha wa nguzo, ‘akajipinda’ huonyesha juhudi ya mwili; ‘kwa nguvu zake zote’ huwasilisha uzito wa בְּכֹחַ kwa Kiswahili cha kawaida.
- source_word: הַבַּיִת
  choice: nyumba
  rationale: בַּיִת ni neno la kawaida kwa nyumba au jengo. ‘Nyumba’ huhifadhi neno la Kiebrania bila kulifasiri moja kwa moja kuwa hekalu.
- source_word: הַסְּרָנִים
  choice: watawala
  rationale: סְרָנִים ni viongozi wakuu wa Wafilisti. ‘Watawala’ ni wazi katika Kiswahili cha sasa na huepuka maana za mfumo wa kifalme au kimwinyi ambazo ‘mabwana’ ingeweza kudokeza.
- source_word: כָּל הָעָם אֲשֶׁר בּוֹ
  choice: watu wote waliokuwa ndani yake
  rationale: Tafsiri hii huhifadhi כָּל, yaani ‘wote,’ na rejeo la watu waliokuwa ndani ya jengo.
- source_word: אֲשֶׁר הֵמִית בְּמוֹתוֹ
  choice: aliowaua wakati wa kufa kwake
  rationale: Kirai hiki huunganisha vifo alivyovisababisha na tukio la kifo chake mwenyewe, bila kupunguza mvutano wa simulizi.
- source_word: רַבִּים מֵאֲשֶׁר הֵמִית בְּחַיָּיו
  choice: walikuwa wengi kuliko wale aliowaua wakati wa maisha yake
  rationale: Muundo wa kulinganisha unaonyesha kwamba idadi ya waliokufa wakati wa kifo chake ilizidi idadi ya aliowaua alipokuwa hai.
theological_decisions:
- issue: Kauli ya mwisho ya Samsoni na maana ya נֶפֶשׁ
  choice: Acha nife pamoja na Wafilisti
  alternative: Nafsi yangu na ife pamoja na Wafilisti
  rationale: נֶפֶשׁ hapa hutumika kwa maana ya Samsoni mwenyewe. Tafsiri kuu haitoi fundisho la kimetafizikia kuhusu nafsi ambalo kifungu hakilengi, huku tanbihi ikihifadhi umbo la karibu zaidi la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni wa kawaida na unaeleweka; ‘nyumba’ imehifadhiwa badala ya ‘hekalu’ ili kuepuka ufafanuzi unaozidi neno la chanzo. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
