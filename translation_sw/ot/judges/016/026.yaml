  text: Then Samson said to the young man who was holding his hand, “Let me rest, and guide me to the pillars on which the house stands, so that I may lean against them.”
translation:
  language: sw
  text: Ndipo Samsoni akamwambia yule kijana aliyekuwa amemshika mkono, “Niache nipapase nguzo ambazo nyumba imesimama juu yake, ili niziegemee.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנִּיחָה אוֹתִי
  choice: Niruhusu nipumzike
  rationale: Kauli hii inaweza kumaanisha kumwacha au kumpa nafasi apumzike; muktadha na ufuatano wa ombi vinaunga mkono tafsiri ya kawaida na ya asili ya ‘niruhusu nipumzike.’
- source_word: ו/הימש/ני אֶת הָעַמֻּדִים
  choice: nawe uniongoze kwenye nguzo
  rationale: Umbo la Kiebrania hapa si la kawaida, lakini kwa muktadha linatoa ombi la kuongozwa au kuletwa karibu na nguzo; ‘uniongoze kwenye’ ni wazi na la kawaida kwa Kiswahili bila kuongeza wazo lisilokuwapo.
- source_word: נָכוֹן עֲלֵיהֶם
  choice: imesimama juu yake
  rationale: נכון hapa hueleza nyumba kuwa imethibitishwa au kusimama juu ya nguzo; tafsiri hii inadumisha taswira ya kimuundo ya maandishi.
- source_word: וְאֶשָּׁעֵן עֲלֵיהֶם
  choice: ili niziegemee
  rationale: Kitenzi שׁען humaanisha kujiegemeza au kutegemea kitu kwa msaada; ‘niziegemee’ ni kifupi na cha asili.
