base_translation:
  language: en
  yaml_path: translation/ot/judges/016/003.yaml
  text: And Samson lay until midnight[a]. Then he arose at midnight and seized the doors of the city gate and the two doorposts, and pulled them up with the bar[b]; he put them on his shoulders and carried them up to the top of the hill that is opposite Hebron.
translation:
  language: sw
  text: Samsoni akalala mpaka usiku wa manane. Kisha akaamka usiku wa manane, akazishika milango ya lango la jiji pamoja na miimo yake miwili, akaving’oa pamoja na komeo[a]. Akaviweka mabegani mwake na kuvibeba hadi kilele cha mlima ulioko mkabala wa Hebroni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akavichomoa kutoka mahali pake pamoja na komeo.” Kitenzi cha Kiebrania kinaweza kumaanisha kung’oa au kuondoa kitu kutoka mahali pake.
    reason: lexical_alternative
  - marker: b
    text: Au, “mlima ulio mbele ya Hebroni.” Nahau ya Kiebrania, kwa maana ya neno kwa neno, ni “juu ya uso wa Hebroni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Kitenzi שׁכב humaanisha kulala chini au kulala usingizi. Katika Kiswahili, “akalala” ni simulizi la kawaida na halilazimishi kutaja wazi kama alipatwa na usingizi.
- source_word: עַד חֲצִי הַלַּיְלָה / בַּחֲצִי הַלַּיְלָה
  choice: mpaka usiku wa manane / usiku wa manane
  rationale: Hii ni tafsiri ya asili ya Kiswahili ya ‘nusu ya usiku’ na inadhihirisha wakati wa matukio.
- source_word: וַיֶּאֱחֹז
  choice: akazishika
  rationale: “Kushika” ni neno la kawaida lenye nguvu ya kutosha katika muktadha huu bila kuongeza jambo lisilosemwa na Kiebrania.
- source_word: דַּלְתוֹת שַׁעַר הָעִיר
  choice: milango ya lango la jiji
  rationale: Kirai hiki kinatofautisha milango miwili inayofunga lango kuu la jiji na lango lenyewe.
- source_word: וּבִשְׁתֵּי הַמְּזוּזוֹת
  choice: pamoja na miimo yake miwili
  rationale: מְזוּזוֹת ni nguzo au miimo ya pembeni mwa lango; “miimo” ni istilahi sahihi na inayoeleweka katika Kiswahili sanifu.
- source_word: וַיִּסָּעֵם עִם הַבְּרִיחַ
  choice: akaving’oa pamoja na komeo
  rationale: Katika muktadha huu נסע inaonyesha kuviondoa kwa nguvu kutoka mahali pake, huku komeo likichukuliwa pamoja navyo. “Komeo” ni boriti au pau ya kufungia lango.
- source_word: וַיָּשֶׂם עַל כְּתֵפָיו
  choice: akaviweka mabegani mwake
  rationale: Tafsiri hii inaendeleza wazi rejeleo la sehemu zote za lango alizokuwa ameng’oa.
- source_word: וַיַּעֲלֵם
  choice: kuvibeba mpaka juu
  rationale: Kitenzi kimsingi ni ‘kuvipandisha’; kwa kuwa tayari vimewekwa mabegani, “kuvibeba mpaka juu” huonyesha kwa kawaida namna ya kuvipeleka.
- source_word: אֶל רֹאשׁ הָהָר
  choice: mpaka juu ya kilima
  rationale: רֹאשׁ ni sehemu ya juu, na הָהָר inaweza kumaanisha mlima au kilima; “kilima” inafaa kwa mandhari ya simulizi bila kuifanya sehemu hiyo kuwa kubwa kupita kiasi.
- source_word: אֲשֶׁר עַל פְּנֵי חֶבְרוֹן
  choice: kilichoelekeana na Hebroni
  rationale: Nahau עַל־פְּנֵי inaweza kueleza kitu kilicho mbele ya, kinachotazama, au kilicho mkabala na mahali fulani. “Kilichoelekeana na Hebroni” huhifadhi uhusiano huo bila kudai umbali hususa.
