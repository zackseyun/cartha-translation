base_translation:
  language: en
  yaml_path: translation/ot/judges/016/015.yaml
  text: Then she said to him[a], “How can you say, ‘I love you,’ when your heart is not with me? These three times you have mocked me and have not told me in what your great strength lies.”
translation:
  language: sw
  text: Ndipo akamwambia, “Unawezaje kusema, ‘Ninakupenda,’ ilhali moyo wako hauko pamoja nami? Mara hizi tatu umenichezea[a], wala hujaniambia nguvu yako kubwa inatokana na nini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umenidanganya,” “umenidhihaki,” au “umenifanya mjinga.” Kitenzi cha Kiebrania kina maana ya kumchezea mtu kwa udanganyifu na dhihaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Unawezaje
  rationale: Huwasilisha swali la Delila lenye mshangao na changamoto kwa Kiswahili cha kawaida.
- source_word: אֲהַבְתִּיךְ
  choice: Ninakupenda
  rationale: Ingawa kitenzi cha Kiebrania kiko katika hali timilifu, hapa ni dai la upendo unaoendelea katika usemi wa moja kwa moja.
- source_word: לִבְּךָ אֵין אִתִּי
  choice: moyo wako hauko pamoja nami
  rationale: Hudumisha nahau ya Kiebrania kuhusu uaminifu na kujitoa kwa ndani bila kuifafanua kupita kiasi.
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: Mara hizi tatu
  rationale: Ni namna ya asili ya kurejelea matukio matatu yaliyotangulia huku ikihifadhi msisitizo wa Kiebrania.
- source_word: הֵתַלְתָּ בִּי
  choice: umenifanyia mchezo
  rationale: Hueleza kumchezea mtu kwa kumdanganya au kumdhihaki; tanbihi inadokeza maana nyingine zinazowezekana.
- source_word: הִגַּדְתָּ לִּי
  choice: hujaniambia
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja katika mazungumzo haya.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: nguvu zako nyingi zinatokana na nini
  rationale: Huwasilisha swali kuhusu msingi au chanzo cha nguvu nyingi za Samsoni kwa Kiswahili cha asili bila kuzifanya kuwa mahali halisi.
