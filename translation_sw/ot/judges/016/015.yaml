review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves Delilah’s rhetorical question, the idiom of the heart not being with her, and the accusation that Samson has withheld the basis of his strength. However, “nguvu zako nyingi” renders the adjective as “many” rather than “great” and changes the singular Hebrew expression.
  naturalness: “Umenifanyia mchezo” can suggest merely playing a game or a prank and is weaker than the deceptive, contemptuous sense of the Hebrew. “Umenichezea” is a more natural contextual equivalent, with the footnote retaining the fuller semantic range.
  terminology: “Moyo wako hauko pamoja nami” is an appropriate, non-overinterpreted rendering of the Hebrew loyalty/commitment idiom. “Nguvu yako kubwa” correctly represents the singular noun and its adjective.
  issues:
  - severity: medium
    issue: “nguvu zako nyingi”
    rationale: 'This means “your many strengths,” whereas בַּמֶּה כֹּחֲךָ גָדוֹל asks about Samson’s one great strength: “what his great strength consists in/is due to.”'
  - severity: low
    issue: “umenifanyia mchezo”
    rationale: The wording may understate the Hebrew הֵתַלְתָּ בִּי, which denotes trifling with someone through misleading mockery. “Umenichezea” better fits this interpersonal accusation while the note gives alternatives.
