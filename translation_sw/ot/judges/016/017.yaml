  text: וַ/יַּגֶּד לָ֣/הּ אֶת כָּל לִבּ֗/וֹ וַ/יֹּ֤אמֶר לָ/הּ֙ מוֹרָה֙ לֹֽא עָלָ֣ה עַל רֹאשִׁ֔/י כִּֽי נְזִ֧יר אֱלֹהִ֛ים אֲנִ֖י מִ/בֶּ֣טֶן אִמִּ֑/י אִם גֻּלַּ֨חְתִּי֙ וְ/סָ֣ר מִמֶּ֣/נִּי כֹחִ֔/י וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/כָל הָ/אָדָֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/017.yaml
  text: So he told her all his heart and said to her[a], “A razor has never come upon my head, for I have been a Nazirite of God from my mother’s womb. If I am shaved, then my strength will leave me[c][b], and I will become weak and be like every other man.”
translation:
  language: sw
  text: Basi akamweleza yote yaliyokuwa moyoni mwake[a], akamwambia, “Wembe haujawahi kugusa kichwa changu, kwa maana mimi ni Mnadhiri wa Mungu[b] tangu tumboni mwa mama yangu. Nikinyolewa, nguvu zangu zitaniondoka; nitadhoofika na kuwa kama mtu mwingine yeyote[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “akamweleza moyo wake wote.”
    reason: lexical_alternative
  - marker: b
    text: “Mnadhiri” ni istilahi ya mtu aliyewekwa wakfu kwa Mungu kwa namna ya pekee.
    reason: cultural_note
  - marker: c
    text: Au, “kama wanadamu wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד לָהּ אֶת כָּל לִבּוֹ
  choice: akamweleza yote yaliyokuwa moyoni mwake
  rationale: Nahau ya Kiebrania ni kihalisi ‘akamweleza moyo wake wote.’ Tafsiri hii ya Kiswahili inaonyesha kufichua kikamilifu yaliyokuwa moyoni bila kutoa maana ya ziada.
- source_word: מוֹרָה לֹא עָלָה עַל רֹאשִׁי
  choice: Wembe haujawahi kugusa kichwa changu
  rationale: מוֹרָה ni wembe, na usemi ‘haujapanda juu ya kichwa changu’ una maana ya kwamba wembe haujawahi kugusa kichwa chake. Kiswahili hiki ni cha kawaida na sahihi katika muktadha wa kunyoa.
- source_word: נְזִיר אֱלֹהִים
  choice: Mnadhiri wa Mungu
  rationale: ‘Mnadhiri’ huhifadhi istilahi maalumu ya mtu aliyewekwa wakfu kwa Mungu na uhusiano wake na sheria ya nadhiri katika Hesabu 6.
- source_word: מִבֶּטֶן אִמִּי
  choice: tangu tumboni mwa mama yangu
  rationale: Huu ni usemi wa asili unaoonyesha kwamba kuwekwa kwake wakfu kulianza kabla ya kuzaliwa.
- source_word: אִם גֻּלַּחְתִּי
  choice: Nikinyolewa
  rationale: Kitenzi cha Kiebrania ni cha kutendwa; Samsoni anazungumzia kunyolewa na mtu mwingine, si kujinyoa mwenyewe.
- source_word: וְסָר מִמֶּנִּי כֹחִי
  choice: nguvu zangu zitaniondoka
  rationale: Tafsiri hii huhifadhi wazo la nguvu kuondoka kwake katika matokeo ya sharti.
- source_word: וְחָלִיתִי
  choice: nitakuwa dhaifu
  rationale: Katika muktadha huu kitenzi kinaonyesha kupoteza nguvu, wala si lazima kuugua.
- source_word: כְּכָל הָאָדָם
  choice: kama mtu mwingine yeyote
  rationale: Usemi huu unamlinganisha Samsoni asiye na nguvu zake za pekee na mwanadamu wa kawaida. Kiswahili hiki ni cha kawaida huku tanbihi ikihifadhi muundo mpana zaidi wa Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri נְזִיר katika maelezo ya Samsoni kuhusu kuwekwa kwake wakfu
  choice: Mnadhiri wa Mungu
  alternative: mtu aliyewekwa wakfu kwa Mungu
  rationale: Istilahi ‘Mnadhiri’ huhifadhi uhusiano wa kifungu hiki na taasisi ya nadhiri ya Mnadhiri, badala ya kuifanya kuwa maelezo ya jumla tu ya kuwekwa wakfu.
- issue: Uhusiano kati ya kunyolewa na kuondoka kwa nguvu
  choice: Nikinyolewa, nguvu zangu zitaniondoka
  alternative: Kichwa changu kikinyolewa, nguvu zangu zitaondoka kwangu
  rationale: Tafsiri inafuata dai la Samsoni kama lilivyo bila kuamua hapa kama nywele zenyewe ndizo chanzo cha nguvu au ni ishara ya kuwekwa kwake wakfu.
- issue: Maana ya כְּכָל הָאָדָם
  choice: kama mtu mwingine yeyote
  alternative: kama wanadamu wote
  rationale: Muktadha unasisitiza kuwa Samsoni angekuwa mtu wa kawaida baada ya kupoteza nguvu zake. Tanbihi inahifadhi uwezekano wa kufuata kwa karibu zaidi usemi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Nahau za Kiebrania zimetolewa kwa Kiswahili cha kawaida, huku taswira au maana mbadala muhimu zikihifadhiwa katika tanbihi.
