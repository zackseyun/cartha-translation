  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa msomaji wa kawaida huku ukihifadhi mpangilio wa matukio na kutobainisha kupita kiasi aina ya jengo au maana yenye utata ya שׂחק.
