base_translation:
  language: en
  yaml_path: translation/ot/judges/016/027.yaml
  text: The house was full of men and women[a], and all the lords of the Philistines were there. And on the roof were about three thousand men and women watching Samson as he performed.
translation:
  language: sw
  text: Nyumba ilikuwa imejaa wanaume na wanawake, na wakuu wote wa Wafilisti walikuwapo. Juu ya paa kulikuwa na wanaume na wanawake wapatao elfu tatu, wakimtazama Samsoni akicheza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakimtazama Samsoni akifanya mchezo” au “wakimtazama Samsoni akitumbuiza.” Neno la Kiebrania linatumia mzizi שׂחק, ambao unaweza kumaanisha kucheka, kucheza, kufanya mchezo, au kuburudisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Neno la Kiebrania kwa msingi humaanisha nyumba au jengo. Muktadha ni jengo la mkusanyiko wa Wafilisti, lakini mstari huu haulitambulishi moja kwa moja kuwa hekalu.
- source_word: מָלֵא
  choice: ilikuwa imejaa
  rationale: Huwasilisha hali ya jengo kuwa limejaa watu kwa Kiswahili cha kawaida na cha asili.
- source_word: הָאֲנָשִׁים ... וְהַנָּשִׁים / אִישׁ וְאִשָּׁה
  choice: wanaume na wanawake
  rationale: Huhifadhi kutajwa kwa wazi kwa watu wa jinsia zote katika jengo na juu ya paa.
- source_word: כֹּל סַרְנֵי פְלִשְׁתִּים
  choice: wakuu wote wa Wafilisti
  rationale: סַרְנֵי ni cheo cha watawala wa Wafilisti; “wakuu” ni neno la Kiswahili lenye heshima linaloeleweka bila kuingiza cheo kisichotajwa.
- source_word: וְעַל הַגָּג
  choice: Juu ya paa
  rationale: Huhifadhi eneo lililotangulizwa katika Kiebrania na kueleza wazi kuwa watu hao walikuwa juu ya paa.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים
  choice: wapatao elfu tatu
  rationale: Kiambishi כ־ hapa kinaonyesha idadi ya kukadiria; “wapatao” ni Kiswahili cha asili kwa ‘karibu’ au ‘takriban.’
- source_word: הָרֹאִים
  choice: wakimtazama
  rationale: Hali ya kuendelea ya kishirikishi inafaa kutafsiriwa kama tendo la umati kuendelea kumtazama Samsoni.
- source_word: בִּשְׂחוֹק שִׁמְשׁוֹן
  choice: Samsoni akifanya onyesho
  rationale: Kirai hiki ni kigumu na mzizi שׂחק unaweza kuhusiana na kucheka, kucheza, kufanya mchezo, au kuburudisha. “Akifanya onyesho” huwasilisha tukio linalotazamwa bila kuongeza yambwa lisilotajwa wazi.
