  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Muundo wa simulizi umetiririka kwa viunganishi vya wakati na mfululizo wa vitenzi; nahau ya moyo imefafanuliwa kidogo ili iwe ya kawaida kwa msomaji wa Kiswahili bila kupoteza maana yake.
