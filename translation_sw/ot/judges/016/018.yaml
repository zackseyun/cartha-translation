base_translation:
  language: en
  yaml_path: translation/ot/judges/016/018.yaml
  text: When Delilah saw that he had told her all his heart[a], she sent and called for the Philistine rulers, saying, “Come up this time[c][b], for he has told her all his heart.” Then the Philistine rulers came up to her and brought the silver in their hands.
translation:
  language: sw
  text: Delila alipoona kwamba alikuwa amemweleza moyo wake wote[a], akatuma na kuwaita watawala wa Wafilisti, akisema, “Pandeni mara hii, kwa maana amemweleza moyo wake wote.” Ndipo watawala wa Wafilisti wakapanda kumwendea, wakileta fedha mikononi mwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa maana amemweleza moyo wake wote.” Katika usemi wa moja kwa moja, “amenieleza” lingeweza kutarajiwa, lakini matini ya Kiebrania iliyopokelewa inasoma kiwakilishi cha nafsi ya tatu ya kike: “amemweleza.”'
    reason: textual_variant
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: alipoona
  rationale: Huhifadhi maana ya kitenzi ‘kuona’ na wakati huohuo huleta kwa Kiswahili uhusiano wa wakati unaofaa katika mtiririko wa simulizi.
- source_word: הִגִּיד
  choice: alikuwa amemweleza / amenieleza
  rationale: Kauli ya Hifili ya נגד ina maana ya kueleza au kufanya jambo lijulikane; ‘kueleza’ ni ya kawaida na wazi katika muktadha huu.
- source_word: אֶת כָּל לִבּוֹ
  choice: yote yaliyokuwa moyoni mwake
  rationale: Huwasilisha nahau ya Kiebrania kwa Kiswahili cha asili huku ikidokeza kwamba Samsoni alikuwa amefichua jambo lote la ndani.
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: akatuma watu kuwaita
  rationale: Kiebrania kina mlolongo wa ‘akatuma, akawaita’; Kiswahili hiki kinaweka vitendo vyote viwili kwa namna ya kawaida na kueleweka.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: watawala wa Wafilisti
  rationale: סרן humaanisha maafisa wakuu au watawala wa Wafilisti; ‘watawala’ ni wazi na haileti dhana ya kimwinyi.
- source_word: עֲלוּ הַפַּעַם
  choice: Pandeni mara hii
  rationale: Huhifadhi kitenzi cha mwendo עלה na msisitizo wa הַפַּעַם kwamba huu ndio wakati unaofaa.
- source_word: כִּי הִגִּיד לָהּ אֶת כָּל לִבּוֹ
  choice: kwa maana amenieleza yote yaliyokuwa moyoni mwake
  rationale: Ingawa matini ya Kimasoreti ilivyoandikwa ina kiwakilishi cha nafsi ya tatu ya kike, ‘amemweleza,’ ushahidi wa qere unaoonyeshwa na nukta ya mappiq kukosekana katika לָה na muktadha wa usemi wa moja kwa moja unaunga mkono usomaji wa ‘amenieleza.’
- source_word: וְעָלוּ אֵלֶיהָ
  choice: wakapanda kwenda kwake
  rationale: Huhifadhi mwelekeo wa עלה kuelekea mahali Delila alipokuwa bila kufanya Kiswahili kuwa kigumu.
- source_word: וַיַּעֲלוּ הַכֶּסֶף בְּיָדָם
  choice: wakileta fedha mikononi mwao
  rationale: ‘Fedha’ hudumisha maana halisi ya הַכֶּסֶף, na ‘wakileta’ huonyesha kuwa walikuja nazo kama malipo.
