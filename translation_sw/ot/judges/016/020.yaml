source:
  edition: WLC
  text: וַ/תֹּ֕אמֶר פְּלִשְׁתִּ֥ים עָלֶ֖י/ךָ שִׁמְשׁ֑וֹן וַ/יִּקַ֣ץ מִ/שְּׁנָת֗/וֹ וַ/יֹּ֨אמֶר֙ אֵצֵ֞א כְּ/פַ֤עַם בְּ/פַ֨עַם֙ וְ/אִנָּעֵ֔ר וְ/הוּא֙ לֹ֣א יָדַ֔ע כִּ֥י יְהוָ֖ה סָ֥ר מֵ/עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/020.yaml
  text: And she said[a], “The Philistines are upon you, Samson!” And he awoke from his sleep and said, “I will go out as at other times and shake myself free.” But he did not know that Yahweh had departed from him.
translation:
  language: sw
  text: Naye akasema, “Wafilisti wanakuvamia, Samsoni!” Akaamka usingizini, akasema, “Nitatoka kama nyakati nyingine na kujinasua[a].” Lakini hakujua kwamba Yahwe alikuwa amejiondoa kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kujitikisa.” Katika muktadha huu, inaelekea maana ni kujitikisa ili ajinasue kama alivyofanya nyakati zilizopita.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Wafilisti wanakuvamia
  rationale: Kirai chenye עַל na mhusika mwenye uhasama kinaonyesha shambulio au kukamatwa kunakokaribia. ‘Wanakuvamia’ ni onyo la wazi na la kawaida katika Kiswahili bila kutumia muundo usio wa kawaida wa ‘wako juu yako.’
- source_word: וַיִּקַץ מִשְּׁנָתוֹ
  choice: Akaamka usingizini
  rationale: Huu ni uwasilishaji wa moja kwa moja na wa kawaida wa kuamka kutoka usingizini.
- source_word: אֵצֵא
  choice: Nitatoka
  rationale: Kitenzi יצא kimsingi ni ‘kutoka.’ Tafsiri haiongezi wazi kwamba anatoka kupigana, ingawa muktadha unaweza kudokeza hivyo.
- source_word: כְּפַעַם בְּפַעַם
  choice: kama nyakati nyingine
  rationale: Nahau hii inarejelea matukio yaliyotangulia ambayo yalijirudia; usemi huu unahifadhi wazo hilo kwa Kiswahili cha kawaida.
- source_word: וְאִנָּעֵר
  choice: na kujinasua
  rationale: Nifali ya נער hapa inaelekea kumaanisha kujitikisa na kujitoa au kujinasua. ‘Kujinasua’ huwasilisha matokeo yanayodokezwa na muktadha, huku tanbihi ikihifadhi tafsiri halisi zaidi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa na cheo. ‘Yahwe’ ni umbo linalosomeka kwa kawaida katika tahajia ya Kiswahili.
- source_word: סָר מֵעָלָיו
  choice: alikuwa amejiondoa kwake
  rationale: Usemi huu unaonyesha kuondoka au kujiondoa. Tafsiri inahifadhi uzito wa kauli kuhusu kuondoka kwa Mungu bila kueleza aina, utaratibu, au kudumu kwake.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandiko ya Kiebrania yanatumia Tetragramatoni moja kwa moja. Kutumia ‘Yahwe’ kunahifadhi jina binafsi la Mungu, kwa tahajia ya kawaida ya Kiswahili, badala ya kuweka cheo mahali pake.
- issue: Maana ya kujiondoa kwa Yahwe kutoka kwa Samsoni
  choice: Yahwe alikuwa amejiondoa kwake
  alternative: nguvu za Yahwe zilikuwa zimemwacha; Yahwe alikuwa amemwacha
  rationale: Mstari unasema kwamba Yahwe alikuwa ameondoka au amejiondoa kwake, lakini haufafanui ikiwa ni kuondoka kwa nguvu za kumwezesha, kibali cha agano, au jambo jingine. Tafsiri haiongezi ufafanuzi wa kiteolojia ambao hauko wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa msomaji wa kawaida. Sentensi fupi na mfululizo wa vitenzi huhifadhi kasi ya simulizi la Kiebrania.
