base_translation:
  language: en
  yaml_path: translation/ot/judges/016/009.yaml
  text: The ambush was waiting for her in the inner room, and she said to him, “Philistines are upon you, Samson!” But he snapped the cords as a thread of tow snaps when it smells fire, and his strength was not discovered.
translation:
  language: sw
  text: Mviziaji alikuwa amekaa kwa ajili yake katika chumba cha ndani. Ndipo akamwambia, “Wafilisti wamekujia, Samsoni!” Lakini akazivunja zile kamba kama uzi wa kitani unavyokatika unaponusa moto; na nguvu zake hazikujulikana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֹרֵב
  choice: kikosi cha waviziaji
  rationale: Nomino ya Kiebrania iko katika umoja lakini inaweza kumaanisha mviziaji au kundi la waviziaji; ‘kikosi cha waviziaji’ huhifadhi umoja wa kisarufi kwa maana ya pamoja na kufaa muktadha.
- source_word: יֹשֵׁב לָהּ
  choice: kilikuwa kimekaa kwa ajili yake
  rationale: Tafsiri hii huhifadhi kiwakilishi cha kike na uhusiano usioelezwa kikamilifu wa לָהּ, bila kuongeza wazo la kusubiri ishara yake au la kumshambulia yeye.
- source_word: יְתָרִים
  choice: kamba
  rationale: Neno linaweza kutaja nyuzi au kamba, na katika muktadha huu ni zile kamba alizofungwa nazo; ‘kamba’ ni wazi na ya kawaida kwa msomaji wa Kiswahili.
- source_word: פְּתִיל הַנְּעֹרֶת
  choice: uzi wa kitani
  rationale: Hurejelea uzi wa nyuzi za mmea wa kitani; Kiswahili cha kawaida hakihitaji istilahi ya kiufundi zaidi ya ‘uzi wa kitani’.
- source_word: בַּהֲרִיחוֹ אֵשׁ
  choice: unapounusa moto
  rationale: Huhifadhi taswira halisi na yenye nguvu ya Kiebrania kwamba uzi ‘unanusa’ moto badala ya kuibadili kimya kimya kuwa ‘unapoguswa na moto’.
- source_word: וְלֹא נוֹדַע כֹּחוֹ
  choice: chanzo cha nguvu zake hakikugunduliwa
  rationale: Katika muktadha, jambo lisilofahamika ni siri au chanzo cha nguvu zake. Kauli hii ni ya asili katika Kiswahili na huhifadhi wazo la kutogunduliwa.
