  text: וַ/תֹּ֤אמֶר דְּלִילָה֙ אֶל שִׁמְשׁ֔וֹן הַגִּֽידָ/ה נָּ֣א לִ֔/י בַּ/מֶּ֖ה כֹּחֲ/ךָ֣ גָד֑וֹל וּ/בַ/מֶּ֥ה תֵאָסֵ֖ר לְ/עַנּוֹתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/006.yaml
  text: Then Delilah said to Samson[a], “Please tell me where your great strength lies, and how you could be bound to afflict you.”
translation:
  language: sw
  text: Ndipo Delila akamwambia Samsoni, “Tafadhali niambie nguvu zako kubwa zinatokana na nini, na unaweza kufungwa kwa njia gani ili uteswe[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ili unyenyekezwe” au “ili utiishwe.” Kitenzi cha Kiebrania kinaweza kumaanisha kutesa, kunyenyekeza, au, katika muktadha huu, kumshinda na kumtiisha mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo wa simulizi unaendeleza tukio kwa mfuatano; ‘Ndipo’ na kitenzi cha masimulizi huleta mtiririko wa kawaida wa Kiswahili.
- source_word: דְּלִילָה ... שִׁמְשׁוֹן
  choice: Delila ... Samsoni
  rationale: Majina yametoholewa kwa maumbo yaliyozoeleka katika Kiswahili.
- source_word: הַגִּידָה נָּא לִי
  choice: Tafadhali niambie
  rationale: הגיד humaanisha kusema au kueleza, na נא huonyesha ombi au kusihi; tafsiri hii ni ya kawaida na huhifadhi sauti ya ombi.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: nguvu zako nyingi hivyo zinatokana na nini
  rationale: Kirai cha Kiebrania ni, kwa karibu, ‘nguvu zako kubwa ziko katika nini.’ Kiswahili hiki huuliza chanzo au msingi wa nguvu kwa njia ya kawaida bila kuongeza wazo la ‘siri’ ambalo halikutajwa wazi.
- source_word: וּבַמֶּה תֵאָסֵר
  choice: na unaweza kufungwa kwa njia gani
  rationale: תֵאָסֵר ni kauli tendwa ya ‘kufunga’; ‘kwa njia gani’ huwasilisha swali kuhusu njia au namna.
- source_word: לְעַנּוֹתֶךָ
  choice: ili utiishwe
  rationale: Katika muktadha huu, ענה katika shina la Piel inaweza kumaanisha kumtesa, kumnyenyekeza, au kumshinda na kumtiisha mtu. ‘Utiishwe’ hutoa maana inayofaa kwa jaribio la kumdhibiti Samsoni, huku tanbihi ikihifadhi upana wa neno la Kiebrania.
theological_decisions:
- issue: Upana wa maana ya לְעַנּוֹתֶךָ
  choice: utiishwe
  alternative: uteswe; unyenyekezwe
  rationale: Muktadha unahusu kumfunga na kumshinda Samsoni, lakini kitenzi cha Kiebrania pia kinaweza kuonyesha kutesa au kunyenyekeza. Maana hiyo haijafungwa kimadhehebu, kwa hiyo mbadala umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo ‘nguvu zako nyingi hivyo’ unaonyesha ukubwa wa nguvu bila kutumia usemi mgumu ‘nguvu zako kubwa ziko katika nini.’
