  text: וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אִם אָס֤וֹר יַאַסְר֨וּ/נִי֙ בַּ/עֲבֹתִ֣ים חֲדָשִׁ֔ים אֲשֶׁ֛ר לֹֽא נַעֲשָׂ֥ה בָ/הֶ֖ם מְלָאכָ֑ה וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/011.yaml
  text: He said to her[a], “If they bind me with new ropes that have never been used for work[b], then I will become weak and be like one of the men.”
translation:
  language: sw
  text: Akamwambia, “Wakinifunga kwa kamba mpya ambazo hazijawahi kutumiwa kufanya kazi[a], nitadhoofika na kuwa kama mtu mwingine yeyote[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambazo hazijatumika kwa kazi yoyote.”
    reason: Njia nyingine iliyo karibu zaidi na muundo wa Kiebrania wa kueleza kwamba kamba hizo hazikuwa zimetumiwa.
  - marker: b
    text: Kwa karibu zaidi, “kama mmoja wa wanadamu,” yaani, kama mwanadamu wa kawaida asiye na nguvu zisizo za kawaida.
    reason: Hufafanua muundo na maana ya כְּאַחַד הָאָדָם bila kuondoa tofauti ya tafsiri inayowezekana.
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: Akamwambia
  rationale: Muundo wa kawaida wa masimulizi ya Kiebrania unaoendeleza tukio na kutambulisha jibu la Samsoni; ‘akamwambia’ ni wa asili na huhifadhi mwendelezo huo.
- source_word: אִם אָסוֹר יַאַסְרוּנִי
  choice: Wakinifunga
  rationale: Kitenzi kisicho na kikomo pamoja na kitenzi kamili hukazia tendo la kufunga. Katika Kiswahili, muktadha tayari unaonyesha kufungwa kikamilifu, hivyo tafsiri isiyo na kielezi cha ziada huepuka kuingiza wazo maalumu la ‘kwa nguvu’ au ‘kwa kukaza’ ambalo Kiebrania halibainishi.
- source_word: בַּעֲבֹתִים חֲדָשִׁים
  choice: kwa kamba mpya
  rationale: עֲבֹתִים ni kamba au kamba nene za kufungia; ‘kamba’ ndilo neno la kawaida na wazi katika Kiswahili, na חֲדָשִׁים humaanisha ‘mpya.’
- source_word: אֲשֶׁר לֹא נַעֲשָׂה בָהֶם מְלָאכָה
  choice: ambazo hazijawahi kutumiwa kufanya kazi
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya kwamba hakuna kazi iliyokuwa imefanywa kwa kamba hizo, yaani zilikuwa bado hazijatumiwa.
- source_word: וְחָלִיתִי
  choice: nitadhoofika
  rationale: Katika muktadha wa nguvu za Samsoni, חלה humaanisha kuwa dhaifu au kupoteza nguvu; ‘nitadhoofika’ ni fupi na ya asili.
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: na kuwa kama mtu mwingine yeyote
  rationale: Kirai hiki kinamlinganisha Samsoni na binadamu wa kawaida asiye na nguvu zake zisizo za kawaida. ‘Mtu mwingine yeyote’ ni Kiswahili cha asili kinachohifadhi maana hiyo bila kudai kwamba rejeo ni kundi fulani la wanaume waliopo hapo.
theological_decisions:
- issue: Maana ya כְּאַחַד הָאָדָם katika kulinganisha nguvu za Samsoni na za wengine
  choice: kama mtu mwingine yeyote
  alternative: kama mmoja wa wanadamu
  rationale: הָאָדָם hapa humaanisha mwanadamu wa kawaida kwa kulinganisha na nguvu za ajabu za Samsoni. Tafsiri iliyochaguliwa huhifadhi tofauti hiyo kwa lugha ya kawaida, huku tanbihi ikionyesha muundo wa karibu zaidi na Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa masimulizi na hadhi inayofaa maandiko. Msamiati ni wa sasa na unaoeleweka kwa wasomaji wa kawaida; tanbihi zinahifadhi njia mbadala zilizo karibu na muundo wa Kiebrania.
