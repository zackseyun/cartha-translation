  text: וַ֠/יְהִי כִּֽי הֵצִ֨יקָה לּ֧/וֹ בִ/דְבָרֶ֛י/הָ כָּל הַ/יָּמִ֖ים וַ/תְּאַֽלֲצֵ֑/הוּ וַ/תִּקְצַ֥ר נַפְשׁ֖/וֹ לָ/מֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/016.yaml
  text: And it happened that[a], when she pressed him with her words all the days and urged him on, his soul grew short to the point of death.
translation:
  language: sw
  text: Ikawa, alipomsumbua kwa maneno yake kila siku na kumshinikiza, nafsi yake ikachoka kiasi cha kufa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “nafsi yake ikawa fupi hata kufa.” Hii ni nahau inayoonyesha dhiki, kukosa uvumilivu, au kuchoka kupita kiasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Ikawa, alipo-
  rationale: Inahifadhi mpito wa kisimulizi wa Kiebrania bila kutumia lugha ya kizamani; muundo wa “alipo-” unaunganisha tukio hilo kwa kawaida katika Kiswahili.
- source_word: הֵצִיקָה לוֹ
  choice: alimsumbua
  rationale: Kitenzi kinaonyesha kumsababishia mtu dhiki au kumsonga. “Alimsumbua” ni cha kawaida na kinafaa kwa shinikizo la maneno lililorudiwa.
- source_word: בִדְבָרֶיהָ
  choice: kwa maneno yake
  rationale: 'Hutoa kwa uwazi maana ya chombo au njia iliyotumiwa: maneno yake.'
- source_word: כָּל הַיָּמִים
  choice: kila siku
  rationale: Ni Kiswahili cha kawaida kinachoonyesha tendo lililoendelea kurudiwa siku baada ya siku.
- source_word: וַתְּאַלֲצֵהוּ
  choice: na kumshinikiza
  rationale: Inaonyesha shinikizo kali na la kudumu, huku ikiepuka kurudia “kumsumbua.”
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: nafsi yake ikachoka
  rationale: Inadumisha “nafsi” kama kiima na kutoa kwa Kiswahili kinachoeleweka wazo la dhiki, uchovu, au kukosa uvumilivu kupita kiasi, bila kulazimisha maana moja tu ya nahau.
- source_word: לָמוּת
  choice: kiasi cha kufa
  rationale: Inaonyesha kiwango cha mwisho kilichofikiwa bila kudai moja kwa moja kwamba Samsoni alitamani kujiua.
theological_decisions:
- issue: Je, usemi לָמוּת unamaanisha kwamba Samsoni alitamani kujiua?
  choice: kiasi cha kufa
  alternative: hata akatamani kufa
  rationale: Kiebrania kinaeleza kiwango kikubwa sana cha dhiki au uchovu wa ndani, lakini hakisemi wazi kwamba alikuwa na tamaa ya kujiua; tafsiri haipaswi kuongeza dai hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ikawa” huhifadhi ladha ya kisimulizi; “nafsi” huhifadhi taswira ya Kiebrania, huku tanbihi ikieleza nahau isiyo ya kawaida katika Kiswahili.
