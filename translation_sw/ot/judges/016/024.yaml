base_translation:
  language: en
  yaml_path: translation/ot/judges/016/024.yaml
  text: When the people saw him, they praised their god, for they said, “Our god has given into our hand our enemy, the devastator of our land, the one who multiplied our slain.”
translation:
  language: sw
  text: Watu walipomwona, walimsifu mungu wao, kwa maana walisema, “mungu wetu amemtia mikononi mwetu adui yetu, mharibifu wa nchi yetu, aliyezidisha idadi ya watu wetu waliouawa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהַלְלוּ
  choice: walimsifu
  rationale: Kitenzi hiki huonyesha kutoa sifa; kiambishi cha yambwa kinamrejelea mungu wao na kinafanya Kiswahili kiwe cha kawaida.
- source_word: נָתַן ... בְיָדֵנוּ
  choice: amemtia mikononi mwetu
  rationale: Nahau ya Kiebrania ina maana ya kumkabidhi mtu chini ya mamlaka au uwezo wa wengine; ‘mikononi mwetu’ huhifadhi taswira ya chanzo.
- source_word: מַחֲרִיב אַרְצֵנוּ
  choice: aliyeiharibu nchi yetu
  rationale: Kirai kinamtambulisha adui kuwa mharibifu wa nchi yao; umbo la kitenzi ni la asili na wazi kwa wasomaji wa kisasa.
- source_word: הִרְבָּה אֶת חֲלָלֵינוּ
  choice: kuzidisha watu wetu waliouawa
  rationale: Huhifadhi maana ya kusababisha idadi ya waliouawa iwe kubwa bila kuongeza maelezo yasiyokuwapo katika chanzo.
theological_decisions:
- issue: Utambulisho wa אֱלֹהֵיהֶם / אֱלֹהֵינוּ katika hotuba ya Wafilisti
  choice: mungu wao / Mungu wetu
  alternative: miungu yao / miungu yetu
  rationale: Viwakilishi na muktadha vinaelekeza kwa mungu mmoja anayesifiwa katika tukio hili; herufi ndogo katika masimulizi humtofautisha na Mungu wa Israeli, huku herufi kubwa ndani ya nukuu ikifuata matumizi ya kawaida mwanzoni mwa sentensi bila kuthibitisha uungu wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umehifadhi urudiaji wa ‘adui yetu’ na maelezo mawili yanayomfuata, huku ukiepuka lugha ya zamani isiyo ya lazima.
