base_translation:
  language: en
  yaml_path: translation/ot/judges/016/031.yaml
  text: Then his brothers and all his father’s household came down[a], carried him away, brought him up, and buried him between Zorah and Eshtaol, in the tomb of Manoah his father. And he judged Israel twenty years.
translation:
  language: sw
  text: Ndipo ndugu zake na watu wote wa nyumba ya baba yake wakashuka, wakambeba, wakapanda, wakamzika kati ya Sora na Eshtaoli, katika kaburi la Manoa, baba yake. Naye aliwaamua Israeli kwa miaka ishirini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Naye alikuwa amewaamua Israeli kwa miaka ishirini.” Kiebrania kinaweza kueleweka kama muhtasari wa kurudi nyuma.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: wakashuka
  rationale: Kitenzi ירד kinaonyesha mwendo wa kushuka; tafsiri hii inahifadhi mwelekeo wa kijiografia bila kulazimisha mtazamo wa ‘kuja’ au ‘kwenda’ ambao Kiebrania chenyewe hakubainishi.
- source_word: אֶחָיו
  choice: ndugu zake
  rationale: אח kwa kawaida humaanisha ndugu wa kiume, lakini ‘ndugu zake’ ni Kiswahili cha kawaida na hapa kinaweza kueleweka kwa muktadha wa familia bila kupanua maana kuwa ukoo kwa ujumla.
- source_word: כָּל בֵּית אָבִיהוּ
  choice: jamaa yote ya nyumba ya baba yake
  rationale: Nahau ‘nyumba ya baba’ hutaja familia au ukoo wa upande wa baba. ‘Jamaa yote ya nyumba ya baba yake’ inawasilisha kitengo hicho cha kijamii kwa Kiswahili kinachoeleweka.
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: wakauchukua mwili wake
  rationale: Katika muktadha wa mazishi, נשא humaanisha kuubeba au kuuchukua mwili. Kutaja ‘mwili’ kunazuia dhana kwamba Samsoni alikuwa hai, bila kubadili jambo linalodokezwa wazi na muktadha.
- source_word: וַיַּעֲלוּ
  choice: wakaupandisha
  rationale: עלה huonyesha mwendo wa kwenda juu. Kiambishi cha yambwa kinarejelea mwili uliotajwa katika kishazi kilichotangulia na kuhifadhi mfuatano wa matendo.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: wakamzika
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya kitenzi cha kuzika.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: kati ya Sora na Eshtaoli
  rationale: Kirai kinaonyesha mahali pa mazishi kati ya miji hiyo miwili; maumbo ‘Sora’ na ‘Eshtaoli’ yanafuata uandikaji wa majina unaosomeka kwa Kiswahili.
- source_word: בְּקֶבֶר מָנוֹחַ אָבִיו
  choice: katika kaburi la Manoa baba yake
  rationale: קבר inaweza kuwa kaburi au pango la kuzikia. ‘Kaburi’ ni neno la kawaida na lenye heshima; uhusiano wa Manoa kuwa baba yake umehifadhiwa.
- source_word: וְהוּא שָׁפַט אֶת־יִשְׂרָאֵל
  choice: Naye alikuwa amewaamua Israeli
  rationale: שפט ni istilahi inayojirudia katika kitabu cha Waamuzi kwa kazi ya mwamuzi. ‘Aliwaamua’ huhifadhi uhusiano huo wa msamiati; umbo la ‘alikuwa amewaamua’ linaonyesha kuwa kipindi hicho kilitangulia kifo na mazishi yake.
- source_word: עֶשְׂרִים שָׁנָה
  choice: kwa miaka ishirini
  rationale: Hii ni tafsiri ya moja kwa moja ya muda uliotajwa.
theological_decisions:
- issue: Muhtasari wa kipindi cha Samsoni akiwa mwamuzi
  choice: Naye alikuwa amewaamua Israeli kwa miaka ishirini
  alternative: Naye aliwaamua Israeli kwa miaka ishirini
  rationale: Baada ya taarifa ya kifo na mazishi, kauli hii inaeleweka kwa kawaida kuwa mtazamo wa kurudi nyuma unaofupisha huduma yake. Hata hivyo, Kiebrania kinaweza pia kutafsiriwa kwa wakati uliopita sahili; tofauti hiyo imehifadhiwa katika tanbihi badala ya kudai kwamba muundo una maana moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi na maelekezo ya kushuka na kupanda umehifadhiwa; istilahi ‘aliwaamua’ inadumisha uhusiano na jina na dhamira ya kitabu cha Waamuzi.
