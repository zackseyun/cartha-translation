  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקְרָ֥א שִׁמְשׁ֛וֹן אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אֲדֹנָ֣/י יֱהֹוִ֡ה זָכְרֵ֣/נִי נָא֩ וְ/חַזְּקֵ֨/נִי נָ֜א אַ֣ךְ הַ/פַּ֤עַם הַ/זֶּה֙ הָ/אֱלֹהִ֔ים וְ/אִנָּקְמָ֧ה נְקַם אַחַ֛ת מִ/שְּׁתֵ֥י עֵינַ֖/י מִ/פְּלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/028.yaml
  text: Then Samson called to Yahweh and said[a], “Lord GOD, please remember me, and please strengthen me just this once, O God, so that I may take vengeance on the Philistines for my two eyes with one act of vengeance.”
translation:
  language: sw
  text: Ndipo Samsoni akamwita Yahwe, akasema, “Ee Bwana Yahwe, tafadhali unikumbuke na unipe nguvu mara hii moja tu, Ee Mungu, ili niwalipize Wafilisti kisasi kimoja kwa ajili ya macho yangu mawili.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa ajili ya macho yangu mawili,” ikirejelea Wafilisti kumtia Samsoni upofu.'
    reason: Huhifadhi usemi wa karibu wa Kiebrania na hueleza kwa ufupi marejeo yake ya kimuktadha.
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל־יְהוָה
  choice: akamwita Yahwe
  rationale: קרא אל katika muktadha wa sala humaanisha kumwita au kumlilia Mungu. “Akamwita” ni ya kawaida na haiingizi hisia kali kuliko zilizo wazi katika maandishi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo “BWANA”.
- source_word: אֲדֹנָי יֱהֹוִה
  choice: Ee Bwana Yahwe
  rationale: Huhifadhi cheo אֲדֹנָי na jina la Mungu יהוה bila kurudia “Bwana Bwana”; “Ee” huonyesha wazi kuwa ni mwito wa moja kwa moja.
- source_word: זָכְרֵנִי נָא
  choice: tafadhali nikumbuke
  rationale: נָא huifanya amri kuwa ombi la unyenyekevu; mpangilio huu ni wa asili katika Kiswahili cha sasa.
- source_word: וְחַזְּקֵנִי נָא
  choice: na unipe nguvu
  rationale: Pieli ya חזק hapa inaomba Mungu amtie Samsoni nguvu. “Unipe nguvu” ni ya asili zaidi kuliko “unitie nguvu” huku ikihifadhi maana.
- source_word: אַךְ הַפַּעַם הַזֶּה
  choice: mara hii moja tu
  rationale: Hueleza kwamba ombi limewekewa kikomo kwa tukio hili pekee.
- source_word: הָאֱלֹהִים
  choice: Ee Mungu
  rationale: Nomino hii imetumiwa kama mwito wa moja kwa moja; “Ee” huonyesha nguvu hiyo ya kisarufi kwa Kiswahili.
- source_word: וְאִנָּקְמָה נְקַם
  choice: ili niwalipize ... kisasi
  rationale: Muundo wa kohotativi pamoja na nomino yenye mzizi huonyesha kusudi au ombi lenye msisitizo. Kiswahili hutumia kawaida kirai “kulipiza kisasi”.
- source_word: אַחַת מִשְּׁתֵי עֵינַי
  choice: kwa ajili ya jicho langu moja kati ya macho yangu mawili
  rationale: אַחַת ya kike inaelekea kuhusishwa na עין na kuzaa maana “moja kati ya macho yangu mawili.” Hii hufuata ushahidi wa Kiebrania moja kwa moja, huku tanbihi ikitaja uwezekano mwingine wa kisintaksia.
- source_word: מִפְּלִשְׁתִּים
  choice: niwalipize Wafilisti kisasi
  rationale: Pamoja na נקם, מִן humtaja yule ambaye kisasi kinatwaliwa kwake. Muundo wa Kiswahili wenye kiambishi cha mtendwa ni wa kawaida na wazi.
theological_decisions:
- issue: Majina na vyeo vya Mungu katika sala ya Samsoni
  choice: Kutofautisha יְהוָה kama “Yahwe” na אֲדֹנָי יֱהֹוִה kama “Ee Bwana Yahwe.”
  alternative: “BWANA” na “Ee Bwana MUNGU”
  rationale: Uamuzi huu huhifadhi jina binafsi la Mungu pamoja na cheo kinacholitangulia, bila kuyafanya yote kuwa neno la jumla “Mungu”.
- issue: Kiasi cha kisasi kinachoombwa kwa macho ya Samsoni
  choice: “kwa ajili ya jicho langu moja kati ya macho yangu mawili”
  alternative: “kwa tendo moja la kisasi kwa ajili ya macho yangu mawili”
  rationale: Upatanisho wa kike wa אַחַת unaunga mkono zaidi maana “jicho moja,” lakini sintaksia iliyobanwa inaweza kueleweka pia kuwa tendo moja la kisasi. Maana mbadala haijafichwa bali imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa kwa sala lakini kinachoeleweka kwa msomaji wa kawaida. “Tafadhali,” “mara hii moja tu,” na “unipe nguvu” ni miundo ya sasa na ya asili; “Ee” huhifadhi sauti ya mwito wa sala bila kufanya sentensi kuwa ya kale kupita kiasi.
