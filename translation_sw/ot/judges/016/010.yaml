  text: וַ/תֹּ֤אמֶר דְּלִילָה֙ אֶל שִׁמְשׁ֔וֹן הִנֵּה֙ הֵתַ֣לְתָּ בִּ֔/י וַ/תְּדַבֵּ֥ר אֵלַ֖/י כְּזָבִ֑ים עַתָּה֙ הַגִּֽידָ/ה נָּ֣א לִ֔/י בַּ/מֶּ֖ה תֵּאָסֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/010.yaml
  text: Then Delilah said to Samson[a], “Look, you have mocked me and spoken lies to me. Now please tell me what you may be bound with.”
translation:
  language: sw
  text: Ndipo Delila akamwambia Samsoni, “Tazama, umenifanyia mzaha[a] na kuniambia uongo. Sasa tafadhali niambie unaweza kufungwa kwa kitu gani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umenifanya mjinga”; kitenzi cha Kiebrania kinaweza kumaanisha kumdhihaki au kumchezea mtu kwa kumdanganya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida na kuhifadhi tendo la kusema kwa mhusika mwingine.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni neno la kuvuta fikira linalotanguliza shtaka la Delila; lina hadhi na linaeleweka katika Kiswahili cha sasa.
- source_word: הֵתַלְתָּ בִּי
  choice: umenifanyia mzaha
  rationale: Kitenzi cha Kiebrania hapa kina maana ya kumchezea mtu au kumdhihaki kwa kumdanganya. Usemi huu unahifadhi wazo la kumfanyia mchezo bila kurudia tu maana ya uongo katika kishazi kinachofuata.
- source_word: וַתְּדַבֵּר אֵלַי כְּזָבִים
  choice: na kuniambia uongo
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi tendo la kumwambia Delila mambo yasiyo ya kweli; nomino ya Kiswahili 'uongo' hutumiwa kiasili kama nomino isiyohesabika.
- source_word: עַתָּה
  choice: Sasa
  rationale: Inaonyesha mpito kutoka shtaka la Delila kwenda ombi lake jipya.
- source_word: הַגִּידָה נָּא לִי
  choice: tafadhali niambie
  rationale: Neno נָא hulainisha amri na kuifanya ombi; 'tafadhali' huwasilisha sauti hiyo kwa Kiswahili cha kawaida.
- source_word: בַּמֶּה תֵּאָסֵר
  choice: unaweza kufungwa kwa kitu gani
  rationale: Huhifadhi mkazo wa chombo katika בַּמֶּה, yaani kitu cha kumfungia, pamoja na hali ya uwezekano ya kitenzi cha kutendwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Jina 'Delila' na 'Samsoni' yametumiwa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia. Muundo 'kwa kitu gani' umechaguliwa badala ya 'kwa nini' ili kuepuka maana ya kuuliza sababu.
