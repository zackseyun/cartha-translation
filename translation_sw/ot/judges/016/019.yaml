  text: וַ/תְּיַשְּׁנֵ֨/הוּ֙ עַל בִּרְכֶּ֔י/הָ וַ/תִּקְרָ֣א לָ/אִ֔ישׁ וַ/תְּגַלַּ֕ח אֶת שֶׁ֖בַע מַחְלְפ֣וֹת רֹאשׁ֑/וֹ וַ/תָּ֨חֶל֙ לְ/עַנּוֹת֔/וֹ וַ/יָּ֥סַר כֹּח֖/וֹ מֵ/עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/019.yaml
  text: So she made him sleep on her knees[a], and she called for a man, and she shaved off the seven locks of his head. Then she began to afflict him[c][b], and his strength left him.
translation:
  language: sw
  text: Basi akamfanya alale juu ya magoti yake[a], akamwita yule mtu[b], kisha akanyoa mashungi saba ya kichwa chake[c]. Kisha akaanza kumtesa, na nguvu zake zikamwacha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mapajani pake”; kwa neno halisi, “juu ya magoti yake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akamwita mtu huyo aje” au “akamtuma mtu huyo aitwe.”
    reason: alternative_reading
  - marker: c
    text: Au, “misuko saba ya nywele za kichwa chake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּיַשְּׁנֵהוּ
  choice: akamlaza usingizi
  rationale: Hifili ya ישׁן inaonyesha kwamba Delila alisababisha Samsoni alale. Kauli hii ni ya kawaida katika Kiswahili na inahifadhi maana ya kisababishi bila kueleza njia aliyotumia.
- source_word: עַל בִּרְכֶּיהָ
  choice: juu ya magoti yake
  rationale: Tafsiri hii inafuata maana ya moja kwa moja ya בִּרְכַּיִם, ‘magoti,’ huku tanbihi ikitoa usemi wa kawaida zaidi ‘mapajani pake.’
- source_word: וַתִּקְרָא לָאִישׁ
  choice: akamwita yule mtu
  rationale: Umbo לָאִישׁ lina kiambishi cha uelekezi kinachoweza kumaanisha ‘yule mtu.’ ‘Akamwita’ linaweza kumaanisha alimwita au alimwagizia aje, hivyo halilazimishi maelezo yasiyotajwa.
- source_word: וַתְּגַלַּח
  choice: naye akanyoa
  rationale: Kitenzi cha Kiebrania ni cha kike umoja, kwa hiyo Delila anabaki kuwa mhusika wa kisarufi. Kiswahili hiki hakiamui kama alifanya mwenyewe au kwa kutumia mtu aliyemwita.
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשׁוֹ
  choice: mashungi saba ya nywele za kichwa chake
  rationale: מַחְלְפוֹת humaanisha mafungu au misuko ya nywele. ‘Mashungi’ ni neno la asili na linaloeleweka, huku ‘misuko’ ikihifadhiwa kama uwezekano katika tanbihi.
- source_word: וַתָּחֶל לְעַנּוֹתוֹ
  choice: Kisha akaanza kumtesa
  rationale: וַתָּחֶל huonyesha mwanzo wa tendo, na ענה katika Pieli ina wigo wa kumtesa, kumnyanyasa au kumdhili. ‘Kumtesa’ ni pana kiasi cha kutobainisha namna ya tendo hilo.
- source_word: וַיָּסַר כֹּחוֹ מֵעָלָיו
  choice: nguvu zake zikamwacha
  rationale: Huu ni usemi wa Kiebrania unaomaanisha nguvu zake ziliondoka. Tafsiri hii ni ya kawaida, wazi na haitaji chanzo cha nguvu ambacho mstari huu haukitaji moja kwa moja.
theological_decisions:
- issue: Asili ya nguvu zilizomwacha Samsoni
  choice: nguvu zake zikamwacha
  alternative: nguvu za BWANA zikamwacha
  rationale: Mstari wenyewe unasema tu kwamba nguvu zake ziliondoka. Ingawa muktadha mpana unahusianisha nguvu zake na BWANA na hali yake ya Mnadhiri, kuongeza jina la BWANA hapa kungeingiza jambo lisilotajwa katika mstari huu.
- issue: Ni nani aliyenyoa nywele
  choice: 'Delila anabaki mhusika wa kisarufi: ‘naye akanyoa’'
  alternative: yule mtu akanyoa
  rationale: Kitenzi וַתְּגַלַּח ni cha kike umoja na hivyo kinamrejelea Delila kisarufi. Tafsiri haibadili mhusika kuwa mwanamume, wala haikatai uwezekano wa Delila kutenda kupitia mtu aliyemwita.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wa sasa na wenye heshima. ‘Mashungi’ na ‘mapajani’ ni maneno yanayoeleweka kwa wasomaji wa kawaida; tanbihi zinahifadhi maana ya moja kwa moja na mbadala wa kileksika. Viashiria vyote vya tanbihi vimewekwa mara moja katika sehemu inayohusika.
