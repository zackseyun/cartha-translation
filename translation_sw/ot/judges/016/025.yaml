  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Usemi wa Kiebrania kuhusu moyo na ‘nyumba ya wafungwa’ umehifadhiwa kadiri unavyoweza kusikika kwa kawaida, na utata wa tendo la Samsoni umewekwa wazi katika tanbihi.
