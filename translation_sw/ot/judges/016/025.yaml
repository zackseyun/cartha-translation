base_translation:
  language: en
  yaml_path: translation/ot/judges/016/025.yaml
  text: And when their hearts were merry[a], they said, “Call for Samson, so that he may entertain us.” So they called for Samson from the prison house, and he entertained them[b]. And they made him stand between the pillars.
translation:
  language: sw
  text: Ikawa, mioyo yao ilipokuwa na furaha, wakasema, “Mwiteni Samsoni ili atuburudishe[a].” Basi wakamwita Samsoni kutoka katika nyumba ya wafungwa[b], naye akawatumbuiza mbele yao. Kisha wakamsimamisha katikati ya nguzo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘ili atufanyie mchezo’ au ‘ili awe burudani yetu.’ Kitenzi cha Kiebrania kinaweza kuonyesha burudani, dhihaka, au tendo la hadharani.
    reason: lexical_alternative
  - marker: b
    text: Yaani, gerezani. Kiebrania kinasema kihalisi ‘kutoka katika nyumba ya wafungwa.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי טוֹב לִבָּם
  choice: mioyo yao ilipokuwa na furaha
  rationale: Nahau hii husema kihalisi kwamba mioyo yao ilikuwa ‘mizuri,’ yaani walikuwa wachangamfu au wenye furaha. Tafsiri hii inadumisha taswira ya moyo kwa Kiswahili cha kawaida.
- source_word: קִרְאוּ לְשִׁמְשׁוֹן
  choice: Mwiteni Samsoni
  rationale: Kitenzi קרא pamoja na ל hapa kina maana ya kumwita au kumwagiza mtu aje. ‘Mwiteni Samsoni’ ni kauli ya kawaida na yenye nguvu ya amri.
- source_word: וִישַׂחֶק לָנוּ
  choice: ili atuburudishe
  rationale: Kitenzi שׂחק kinaweza kumaanisha kuleta burudani, kufanya mchezo, au kuwa kitu cha dhihaka. ‘Atuburudishe’ huwasilisha kusudi lao kwa lugha ya sasa bila kuondoa uwezekano wa dhihaka, ambao umeelezwa katika tanbihi.
- source_word: מִבֵּית הָאֲסִירִים
  choice: kutoka katika nyumba ya wafungwa
  rationale: Hii inafuata kwa karibu usemi halisi wa Kiebrania, ‘nyumba ya wafungwa,’ huku maana yake ya gereza ikibainishwa katika tanbihi.
- source_word: וַיְצַחֵק לִפְנֵיהֶם
  choice: naye akawatumbuiza mbele yao
  rationale: Katika muktadha huu, kitenzi צחק kinaonyesha tendo lililofanywa hadharani kwa ajili ya burudani yao, huenda likihusisha dhihaka. ‘Akawatumbuiza mbele yao’ ni la asili kwa Kiswahili na linahifadhi sehemu ya hadharani ya tukio.
- source_word: וַיַּעֲמִידוּ אֹתוֹ בֵּין הָעַמּוּדִים
  choice: Kisha wakamsimamisha katikati ya nguzo
  rationale: Hifili ya עמד ina maana ya kumsababisha mtu asimame au kumweka mahali. ‘Wakamsimamisha’ inadumisha maana hiyo ya kusababishwa na udhibiti waliokuwa nao juu ya Samsoni.
