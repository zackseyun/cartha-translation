base_translation:
  language: en
  yaml_path: translation/ot/judges/016/001.yaml
  text: Samson went to Gaza[a], and there he saw a prostitute, and he went in to her.
translation:
  language: sw
  text: Samsoni akaenda Gaza. Huko akamwona kahaba, kisha akaingia kwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akafanya ngono naye.” Kiebrania kinasema kihalisi, “akaingia kwake.” Huu ni usemi wa staha unaotumiwa kwa maana hiyo katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Kitenzi הלך katika mfululizo wa masimulizi kinaonyesha mwendo wa kawaida; “akaenda” ni tafsiri ya asili na ya moja kwa moja.
- source_word: שִׁמְשׁוֹן
  choice: Samsoni
  rationale: Jina la mtu limetolewa kwa umbo linalotumiwa kwa kawaida katika Kiswahili.
- source_word: עַזָּתָה
  choice: Gaza
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha kwamba alielekea mjini Gaza; “akaenda Gaza” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וַיַּרְא שָׁם
  choice: Huko akamwona
  rationale: שָׁם humaanisha “huko”; mpangilio huu ni wa asili katika simulizi la Kiswahili na hudumisha msisitizo wa mahali.
- source_word: אִשָּׁה זוֹנָה
  choice: mwanamke kahaba
  rationale: זוֹנָה humtaja kahaba. “Mwanamke kahaba” huhifadhi nomino אִשָּׁה pamoja na maelezo yake bila kutumia lugha ya kizamani au kupunguza maana ya kingono.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: akaingia kwake
  rationale: בוא אל ni usemi wa staha unaoweza kumaanisha kufanya ngono katika muktadha huu. “Akaingia kwake” huhifadhi sitiari na kiwango cha kutosema wazi kilicho katika Kiebrania.
theological_decisions:
- issue: Ikiwa maana ya kingono ya וַיָּבֹא אֵלֶיהָ isemwe wazi au usemi wa staha wa Kiebrania uhifadhiwe
  choice: Usemi wa staha umehifadhiwa kwa “akaingia kwake”
  alternative: akafanya naye ngono; akalala naye
  rationale: Muktadha unaashiria sana kujamiiana, lakini Kiebrania kinatumia usemi wa staha badala ya kitenzi kilicho wazi. Maandishi makuu yanahifadhi mvutano huo, huku tanbihi ikifafanua maana inayowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. “Kahaba” ni neno la kawaida na sahihi, na “akaingia kwake” huhifadhi usemi wa staha wa chanzo.
