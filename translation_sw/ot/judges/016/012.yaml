base_translation:
  language: en
  yaml_path: translation/ot/judges/016/012.yaml
  text: Then Delilah took new ropes and bound him with them[a], and said to him, “The Philistines are upon you, Samson!” Now the ambush was sitting in the inner room[c][b], but he snapped them from off his arms like a thread.
translation:
  language: sw
  text: Ndipo Delila akachukua kamba mpya[a], akamfunga nazo, akamwambia, “Wafilisti wanakushambulia, Samsoni!” Mviziaji aliyekuwa amejificha alikuwa ameketi katika chumba cha ndani[b]. Lakini akazivunja kamba hizo mikononi mwake kana kwamba ni uzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kamba nene.”
    reason: lexical_alternative
  - marker: b
    text: “Chumba cha ndani” pia kinaweza kutafsiriwa “chumba cha faragha.” Kiebrania kina umbo la umoja, “mviziaji”; linaweza pia kurejelea kwa maana ya pamoja watu waliokuwa wamejificha.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבֹתִים
  choice: kamba
  rationale: Neno hili humaanisha kamba nene za kufungia; “kamba” ni la kawaida na linaweka tofauti na “uzi” mwishoni mwa mstari.
- source_word: חֲדָשִׁים
  choice: mpya
  rationale: Hutoa maana ya moja kwa moja kwamba kamba hizo zilikuwa mpya na hazikuwa zimedhoofishwa kwa kutumiwa.
- source_word: וַתַּאַסְרֵהוּ
  choice: akamfunga
  rationale: Hufuata kwa karibu kitenzi אסר na ni usemi wa kawaida wa Kiswahili.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Wafilisti wanakushambulia
  rationale: Huwasilisha kwa Kiswahili cha sasa kilio cha dharura cha Kiebrania bila kutumia tafsiri ngumu ya neno kwa neno.
- source_word: וְהָאֹרֵב
  choice: waliokuwa wamejificha wakimvizia
  rationale: Ingawa Kiebrania kina umbo la umoja, linaweza kueleweka kwa maana ya pamoja likirejelea wavamizi waliokuwa wamejificha; tanbihi huhifadhi umoja wa kisarufi kama uwezekano mwingine.
- source_word: יֹשֵׁב
  choice: walikuwa wameketi
  rationale: Huhifadhi picha halisi ya kuketi huku muktadha ukionyesha kuwa walikuwa wakingoja kwa siri.
- source_word: בֶּחָדֶר
  choice: katika chumba cha ndani
  rationale: חֶדֶר mara nyingi ni chumba cha ndani au cha faragha kinachofaa kuwa mahali pa kujificha.
- source_word: וַיְנַתְּקֵם
  choice: akazikata kamba hizo
  rationale: Katika muktadha wa kamba, “kuzikata” hueleza kitendo cha kuzikatika kwa nguvu; nomino imerudiwa ili kuepuka utata wa kiwakilishi.
- source_word: מֵעַל זְרֹעֹתָיו
  choice: kutoka mikononi mwake
  rationale: “Mikono” ni usemi wa kawaida unaoweza kujumuisha sehemu ya mkono inayorejelewa na זְרֹעֹתָיו; “kutoka” huhifadhi wazo la kuziondoa juu yake.
- source_word: כַּחוּט
  choice: kana kwamba ni uzi
  rationale: “Uzi” huhifadhi picha ya kitu chembamba na rahisi kukatika, tofauti na kamba nene.
