  text: But the hair of his head began to grow again after it had been shaved[a][b].
translation:
  language: sw
  text: Lakini nywele za kichwa chake zikaanza kuota tena baada ya kunyolewa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zikaanza kuota”—kitenzi cha Kiebrania chenyewe hakisemi wazi “tena”; maana hiyo inatokana na muktadha wa kunyolewa hapo awali.
    reason: lexical_alternative
  - marker: b
    text: Au, “zilipokuwa zimenyolewa” au “baada ya yeye kunyolewa.” Kiebrania kinaruhusu njia hizi tofauti kidogo za kueleza kishazi cha wakati na kile kinachorejelewa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: zikaanza
  rationale: Kitenzi hiki katika muundo huu kina maana ya ‘kuanza’; upatanisho wa wingi unafuata ‘nywele’ katika Kiswahili.
- source_word: שְׂעַר רֹאשׁוֹ
  choice: nywele za kichwa chake
  rationale: Huhifadhi muundo kamili wa Kiebrania na kusisitiza nywele za kichwa cha Samsoni, jambo muhimu katika muktadha.
- source_word: לְצַמֵּחַ
  choice: kuota tena
  rationale: צמח humaanisha ‘kuota’ au ‘kukua.’ Neno ‘tena’ linaeleza kwa kawaida muktadha wa nywele zilizokuwa zimenyolewa, ingawa halijaandikwa wazi katika kitenzi chenyewe.
- source_word: כַּאֲשֶׁר
  choice: baada ya
  rationale: Katika muktadha huu huonyesha uhusiano wa wakati baada ya kunyoa, kwa Kiswahili cha kawaida na wazi.
- source_word: גֻּלָּח
  choice: kunyolewa
  rationale: Huhifadhi hali ya kutendwa ya גלח bila kulazimisha iwapo kile kilichonyolewa kinaelezwa kuwa nywele au Samsoni mwenyewe.
