  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi na chenye hadhi. ‘Kuota’ ni usemi wa kawaida kwa nywele, na ‘kunyolewa’ huhifadhi kwa ufupi utata wa rejeleo katika Kiebrania.
