base_translation:
  language: en
  yaml_path: translation/ot/judges/016/007.yaml
  text: And Samson said to her[a], “If they bind me with seven fresh bowstrings that have not dried, then I will become weak and be like one of the men.”
translation:
  language: sw
  text: Samsoni akamwambia, “Wakinifunga kwa kamba saba mbichi za upinde ambazo hazijakauka, nitadhoofika na kuwa kama mtu wa kawaida[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu, “kama mmoja wa wanadamu.”
    reason: Huhifadhi muundo wa karibu wa msemo wa Kiebrania כְּאַחַד הָאָדָם, ilhali maandishi makuu hutumia usemi wa kawaida zaidi wa Kiswahili.
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ שִׁמְשׁוֹן
  choice: Samsoni akamwambia
  rationale: Muundo wa masimulizi wa Kiebrania unaendeleza tukio linalofuata; ‘akamwambia’ ni wa kawaida na wa asili katika masimulizi ya Kiswahili.
- source_word: יַאַסְרֻנִי
  choice: Wakinifunga
  rationale: Nafsi ya tatu wingi hapa ina mtendaji asiyeainishwa. ‘Wakinifunga’ huhifadhi hali hiyo bila kutaja mtendaji mahsusi.
- source_word: בְּשִׁבְעָה יְתָרִים לַחִים
  choice: kwa kamba saba mbichi za upinde
  rationale: Katika muktadha huu יְתָרִים ni kamba za upinde, si kamba za kawaida. ‘Mbichi’ huonyesha kuwa bado zina unyevunyevu na inaendana na maelezo yanayofuata kuwa hazijakauka.
- source_word: אֲשֶׁר לֹא חֹרָבוּ
  choice: ambazo hazijakauka
  rationale: Hutoa kwa uwazi na kwa ufupi hali ya kamba hizo kuwa bado hazijakauka.
- source_word: וְחָלִיתִי
  choice: nitadhoofika
  rationale: Kitenzi חלה hapa kinahusu kupoteza nguvu, si kuugua; ‘nitadhoofika’ huonyesha mabadiliko hayo ya hali.
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: na kuwa kama mmoja wa watu
  rationale: Huhifadhi kwa karibu tashbihi ya Kiebrania huku ikibaki inaeleweka katika Kiswahili. Maana ya kimuktadha iliyo ya kawaida zaidi imewekwa katika tanbihi.
theological_decisions:
- issue: Maana ya אָדָם katika msemo wa kulinganisha
  choice: kama mmoja wa watu
  alternative: kama mtu mwingine yeyote
  rationale: Neno אָדָם linaweza kumaanisha mwanadamu kwa ujumla, na msemo huu unamlinganisha Samsoni na mtu asiye na nguvu zake za ajabu. Tafsiri kuu huhifadhi muundo na upana wa neno la Kiebrania; tanbihi hutoa maana ya kimuktadha kwa Kiswahili cha kawaida bila kuongeza fundisho la dhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kamba za upinde’ imechaguliwa badala ya istilahi adimu ili msomaji wa kawaida aelewe, na sentensi imeundwa kwa mtiririko wa kawaida wa masimulizi.
