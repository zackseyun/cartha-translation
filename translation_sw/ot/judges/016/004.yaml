  text: וַֽ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יֶּאֱהַ֥ב אִשָּׁ֖ה בְּ/נַ֣חַל שֹׂרֵ֑ק וּ/שְׁמָ֖/הּ דְּלִילָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/004.yaml
  text: After this[a], he loved a woman in the Valley of Sorek, and her name was Delilah.
translation:
  language: sw
  text: Baada ya hayo, alimpenda mwanamke mmoja katika Bonde la Soreki[a], naye aliitwa Delila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kando ya Kijito cha Soreki.” Neno la Kiebrania נַחַל linaweza kumaanisha bonde, kijito, mkondo wa maji wa msimu, au bonde lenye mkondo huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Kifungu hiki cha kisimulizi kinaonyesha mfuatano wa wakati. “Baada ya hayo” ni Kiswahili cha kawaida na cha asili bila kuingiza uzito usio wa lazima wa tafsiri ya neno kwa neno.
- source_word: וַיֶּאֱהַב
  choice: alimpenda
  rationale: Kitenzi אָהַב kina maana ya moja kwa moja ya kupenda. “Alimpenda” huhifadhi maana hiyo bila kuongeza dhana mahsusi ya kuanza mapenzi.
- source_word: אִשָּׁה
  choice: mwanamke mmoja
  rationale: Nomino hii inaweza kumaanisha mwanamke au mke, lakini hapa hakuna ndoa inayotajwa. “Mwanamke mmoja” ni tafsiri isiyoegemea upande na inayofaa muktadha.
- source_word: בְּנַחַל שֹׂרֵק
  choice: katika Bonde la Soreki
  rationale: נַחַל inaweza kutaja bonde, kijito, au mkondo wa maji wa msimu. “Bonde” ni neno linaloeleweka kwa urahisi na huhifadhi maana ya kijiografia; tanbihi inadumisha uwezekano mwingine.
- source_word: וּשְׁמָהּ
  choice: naye aliitwa
  rationale: Hiki kinamtambulisha mwanamke kwa jina. “Naye aliitwa” ni kauli ya asili katika Kiswahili na inawasilisha sawa kwamba jina lake lilikuwa Delila.
- source_word: דְּלִילָה
  choice: Delila
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
