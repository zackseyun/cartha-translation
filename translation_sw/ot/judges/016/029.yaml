id: JDG.16.29
reference: Judges 16:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּלְפֹּ֨ת שִׁמְשׁ֜וֹן אֶת שְׁנֵ֣י עַמּוּדֵ֣י הַ/תָּ֗וֶךְ אֲשֶׁ֤ר הַ/בַּ֨יִת֙ נָכ֣וֹן עֲלֵי/הֶ֔ם וַ/יִּסָּמֵ֖ךְ עֲלֵי/הֶ֑ם אֶחָ֥ד בִּ/ימִינ֖/וֹ וְ/אֶחָ֥ד בִּ/שְׂמֹאלֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/029.yaml
  text: Then Samson grasped the two middle pillars on which the house stood[a], and he braced himself against them[b], one with his right hand and one with his left.
translation:
  language: sw
  text: Ndipo Samsoni akazishika kwa nguvu nguzo mbili za katikati[a] ambazo jengo lilisimama juu yazo, akajiegemeza dhidi yazo[b], moja kwa mkono wake wa kuume na nyingine kwa mkono wake wa kushoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguzo mbili za kati.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akajikaza dhidi yazo.” Kitenzi cha Kiebrania kinaweza kumaanisha kujiegemeza au kujitegemeza juu ya kitu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְפֹּת
  choice: akazishika kwa nguvu
  rationale: Kitenzi hiki kinaonyesha kushika kwa uthabiti au kwa nguvu. Usemi huu ni wa kawaida katika Kiswahili na unaonyesha tendo la makusudi bila kuongeza jambo lisilokuwamo katika maandishi.
- source_word: שְׁנֵי עַמּוּדֵי הַתָּוֶךְ
  choice: nguzo mbili za katikati
  rationale: עַמּוּדֵי ni ‘nguzo,’ na הַתָּוֶךְ huonyesha sehemu ya kati au ya ndani. ‘Za katikati’ ni usemi wazi na wa kawaida wa kimuundo.
- source_word: אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם
  choice: ambazo jengo lilisimama juu yazo
  rationale: נָכוֹן hapa huonyesha kuwa jengo lilikuwa limeimarishwa au kutegemezwa juu ya nguzo hizo. ‘Lilisimama juu yazo’ huhifadhi taswira na utegemezi wa kimuundo wa maandishi ya Kiebrania.
- source_word: וַיִּסָּמֵךְ עֲלֵיהֶם
  choice: akajiegemeza dhidi yazo
  rationale: סמך inaweza kumaanisha kujiegemeza, kujitegemeza, au kujikaza dhidi ya kitu. ‘Akajiegemeza dhidi yazo’ ni ya asili na inahifadhi uwezekano wa tendo la kujitegemeza au kujitayarisha kusukuma.
- source_word: אֶחָד בִּימִינוֹ וְאֶחָד בִּשְׂמֹאלוֹ
  choice: moja kwa mkono wake wa kuume na nyingine kwa mkono wake wa kushoto
  rationale: Muundo wa Kiebrania hugawa nguzo moja kwa kila upande. Kutaja mikono huwasilisha tendo la mwili kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: הַבַּיִת
  choice: jengo
  rationale: Ingawa neno la Kiebrania kwa kawaida ni ‘nyumba,’ katika muktadha huu linamaanisha jengo kubwa la mkusanyiko. ‘Jengo’ ni wazi kwa msomaji wa sasa bila kulifafanua moja kwa moja kuwa hekalu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Juu yazo’ na ‘dhidi yazo’ zinarejelea nguzo hizo mbili kwa usahihi, huku mpangilio wa vitendo vya mstari wa Kiebrania ukihifadhiwa.
