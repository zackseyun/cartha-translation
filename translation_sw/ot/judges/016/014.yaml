base_translation:
  language: en
  yaml_path: translation/ot/judges/016/014.yaml
  text: Then she fastened it with the pin and said to him[a], “The Philistines are upon you[c][b], Samson!” And he awoke from his sleep and pulled away the pin of the loom and the web.
translation:
  language: sw
  text: Kisha akakifunga kwa kigingi[a] na kumwambia, “Wafilisti wanakujia, Samsoni!” Akaamka usingizini, akang’oa kigingi cha mfumio pamoja na kitambaa kilichofumwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pini.” Neno la Kiebrania linaweza kumaanisha kigingi au pini.
    reason: lexical_alternative
  - marker: b
    text: Au, “utando.” Neno la Kiebrania linamaanisha kitu kilichofumwa kwenye mfumio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְקַע
  choice: akakifunga
  rationale: Kitenzi תקע huonyesha kupigilia, kuchomeka, au kukaza kitu. Katika muktadha wa kusuka nywele kwenye mfumio, “akakifunga” kinaeleza kwa kawaida kwamba alikishikamanisha kwa kigingi bila kubainisha kupita kiasi jinsi mfumio ulivyofanya kazi.
- source_word: בַּיָּתֵד
  choice: kwa kigingi
  rationale: יָתֵד inaweza kuwa kigingi au pini. “Kigingi” ni neno la kawaida na linaendeleza picha ya kifaa kilichopigiliwa au kuchomekwa; tofauti ya “pini” imehifadhiwa katika tanbihi.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Wafilisti wanakujia
  rationale: Hii ni kauli ya tahadhari inayorudiwa katika simulizi la Samsoni. “Wanakujia” inaleta haraka na tishio la msemo wa Kiebrania kwa Kiswahili cha kawaida bila kulazimisha kwamba shambulio lilikuwa tayari limeanza.
- source_word: וַיִּיקַץ מִשְּׁנָתוֹ
  choice: Akaamka kutoka usingizini
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitendo cha kuamka na kirai kinachoonyesha hali aliyotoka.
- source_word: וַיִּסַּע
  choice: akang’oa
  rationale: Katika muktadha huu נסע ina maana ya kuondoa kwa nguvu. “Akang’oa” ni ya asili katika Kiswahili na huonyesha kuondolewa kwa nguvu bila kugeuza kitenzi kuwa cha kusafiri.
- source_word: הַיְתַד הָאֶרֶג
  choice: kigingi cha mfumio
  rationale: Kirai hiki kinataja kigingi kilichohusiana na chombo cha kufumia. “Kigingi cha mfumio” ni kifupi na kinafuata uhusiano wa maneno ya Kiebrania.
- source_word: הַמַּסָּכֶת
  choice: kitambaa kilichofumwa
  rationale: מַסָּכֶת hapa ni kitu kilichofumwa kilichokuwa kwenye mfumio. “Kitambaa kilichofumwa” kinaeleweka kwa wasomaji wa kawaida na huepuka neno la kiufundi linaloweza kudokeza sehemu maalumu ya mfumio isiyohakikishwa na neno la Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye hadhi. “Wanakujia” huhifadhi uzito wa kauli ya tahadhari bila kutumia tafsiri halisi isiyo ya kawaida, “wako juu yako.” Neno “mfumio” limetumiwa kwa chombo cha kufumia, huku “kitambaa kilichofumwa” kikieleza zao lake kwa lugha inayoeleweka.
