  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/סַרְנֵ֣י פְלִשְׁתִּ֗ים נֶֽאֱסְפוּ֙ לִ/זְבֹּ֧חַ זֶֽבַח גָּד֛וֹל לְ/דָג֥וֹן אֱלֹהֵי/הֶ֖ם וּ/לְ/שִׂמְחָ֑ה וַ/יֹּ֣אמְר֔וּ נָתַ֤ן אֱלֹהֵ֨י/נוּ֙ בְּ/יָדֵ֔/נוּ אֵ֖ת שִׁמְשׁ֥וֹן אוֹיְבֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/023.yaml
  text: The rulers of the Philistines gathered to offer a great sacrifice to Dagon their god and to celebrate[a], and they said[b], “Our god has given Samson our enemy into our hand.”
translation:
  language: sw
  text: Watawala wa Wafilisti walikusanyika ili kumtolea Dagoni, mungu wao, dhabihu kubwa na kusherehekea. Wakasema, “Mungu wetu amemtia Samsoni, adui yetu, mikononi mwetu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mikononi mwetu,” nahau yenye maana ya chini ya mamlaka au udhibiti wetu.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  choice: Watawala
  rationale: Neno hili linamaanisha viongozi wakuu wa majimbo-miji ya Wafilisti. “Watawala” ni Kiswahili cha sasa, kinachoeleweka na kinachohifadhi hadhi yao ya kiutawala.
- source_word: נֶאֱסְפוּ
  choice: walikusanyika
  rationale: Kauli ya Niphal ya אסף inaonyesha watu kuja pamoja kama kundi; “walikusanyika” ni tafsiri ya kawaida na ya heshima.
- source_word: לִזְבֹּחַ זֶבַח גָּדוֹל
  choice: ili kumtolea ... dhabihu kubwa
  rationale: Muundo wa kitenzi na nomino yenye mzizi uleule unasisitiza tendo la kutoa dhabihu. Kiswahili huepuka urudiaji usio wa kawaida kwa kutumia “kumtolea ... dhabihu kubwa.”
- source_word: לְדָגוֹן אֱלֹהֵיהֶם
  choice: Dagoni, mungu wao
  rationale: Kirai hiki kinamtaja Dagoni kuwa ndiye mungu anayepokea dhabihu. Jina limeandikwa kwa umbo la Kiswahili “Dagoni.”
- source_word: וּלְשִׂמְחָה
  choice: na kusherehekea
  rationale: שִׂמְחָה hapa linahusu furaha ya sherehe katika mkusanyiko wa ushindi; “kusherehekea” linaeleza kusudi hilo kwa kawaida.
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: amemtia ... mikononi mwetu
  rationale: Hii ni nahau ya kumweka mtu chini ya mamlaka au udhibiti wa mwingine. “Kumtia mikononi mwetu” huhifadhi taswira ya Kiebrania na ni nahau ya kawaida ya Kiswahili.
- source_word: אֵת שִׁמְשׁוֹן
  choice: Samsoni
  rationale: Jina la mtu limetolewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: אוֹיְבֵינוּ
  choice: adui yetu
  rationale: Ingawa umbo la Kiebrania lina kiambishi cha wingi cha umilikaji, anayerejelewa ni Samsoni mmoja; “adui yetu” linaakisi maana hiyo kwa kawaida.
theological_decisions:
- issue: Tafsiri ya אֱלֹהֵיהֶם / אֱלֹהֵינוּ katika muktadha wa mungu wa Wafilisti
  choice: mungu wao / Mungu wetu
  alternative: miungu yao / Miungu yetu
  rationale: Katika mstari huu matukio yote mawili yanamrejelea Dagoni hasa. Umoja unalingana na sintaksia na muktadha bila kuingiza wingi wa miungu ambao haukusudiwi hapa. Herufi kubwa katika “Mungu wetu” ni ya mwanzo wa nukuu, si dai kwamba Dagoni ndiye Mungu wa Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Kiunganishi cha mwanzo וְ hakijapanuliwa kuwa neno la muda kama “Basi” au “Sasa”; mwendelezo unaachwa ueleweke katika muktadha. Alama [a] imewekwa baada ya sentensi ya nukuu inayobeba nahau inayofafanuliwa.
