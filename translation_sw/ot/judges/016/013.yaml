revisions:
- from: Ndipo Delila akamwambia Samsoni, “Mpaka sasa umenifanyia mzaha na kuniambia uongo. Niambie ninaweza kukufunga kwa kitu gani.” Akamwambia, “Ukiyafuma mafungu saba ya nywele za kichwa changu pamoja na kitambaa kinachofumwa[a].”
  to: Ndipo Delila akamwambia Samsoni, “Mpaka sasa umenifanyia mzaha na kuniambia uongo. Niambie, unaweza kufungwa kwa nini.” Akamwambia, “Ukiyafuma mashungi saba ya nywele za kichwa changu pamoja na kitambaa cha kufumia[a].”
  rationale: The revision restores the passive focus of the Hebrew question, uses idiomatic Swahili for Samson’s locks of hair, and replaces the misleading footnote alternative with viable renderings that retain the uncertainty surrounding the specialized weaving term.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T20:09:05Z'
review_pass:
  verdict: revise
  source_fidelity: The draft generally follows the Hebrew well, including the deceptive mockery, false statements, instrumental question, and the conditional reply. However, “ninaweza kukufunga kwa kitu gani” recasts the Hebrew passive (“by what can you be bound?”) as Delilah’s personal ability (“with what can I bind you?”). The specialized weaving term should be represented without treating “kitanzi” as a viable lexical alternative.
  naturalness: “Kwa nini unaweza kufungwa?” is a natural modern Swahili passive formulation. “Mashungi saba ya nywele za kichwa changu” is more idiomatic and more specific than “mafungu saba,” while retaining the locks/braids nuance. “Kitambaa cha kufumia” communicates the weaving context more naturally than “kitambaa kinachofumwa” in this construction.
  terminology: Delila and Samsoni are standard Swahili biblical forms. “Mashungi” suitably renders hair-locks/braids. The footnote now gives defensible alternatives—loom and woven web/fabric—rather than “kitanzi,” which means a loop/noose and is not an appropriate alternative here.
  issues:
  - severity: medium
    issue: 'The question is phrased as Delilah’s capability: “ninaweza kukufunga kwa kitu gani.”'
    rationale: The Hebrew is passive and asks what Samson can be bound with, not explicitly what Delilah herself is able to do. A passive Swahili question preserves this form and focus.
  - severity: medium
    issue: The footnote proposes “kitanzi” as an alternative for the weaving term.
    rationale: “Kitanzi” normally denotes a loop or snare, not a loom or woven web. It misguides readers concerning the specialized Hebrew weaving vocabulary.
  - severity: low
    issue: “Mafungu” is less natural and less precise for locks/braids of hair.
    rationale: “Mashungi” is an established, idiomatic term for distinct locks or braids of hair and preserves the Hebrew ambiguity adequately.
  revised_text: Ndipo Delila akamwambia Samsoni, “Mpaka sasa umenifanyia mzaha na kuniambia uongo. Niambie, unaweza kufungwa kwa nini.” Akamwambia, “Ukiyafuma mashungi saba ya nywele za kichwa changu pamoja na kitambaa cha kufumia[a].”
  revised_footnotes:
  - marker: a
    text: Au, “Ukiyasuka mashungi saba ya nywele zangu kwa kifaa cha kufumia,” au “ndani ya kitambaa kinachofumwa.” Neno la Kiebrania linalohusu ufumaji ni istilahi maalumu, na maana yake kamili hapa si hakika.
    reason: lexical_alternative
  revision_rationale: The revision restores the passive focus of the Hebrew question, uses idiomatic Swahili for Samson’s locks of hair, and replaces the misleading footnote alternative with viable renderings that retain the uncertainty surrounding the specialized weaving term.
