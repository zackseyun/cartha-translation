  text: וַ/תֹּ֨אמֶר דְּלִילָ֜ה אֶל שִׁמְשׁ֗וֹן עַד הֵ֜נָּה הֵתַ֤לְתָּ בִּ/י֙ וַ/תְּדַבֵּ֤ר אֵלַ/י֙ כְּזָבִ֔ים הַגִּ֣ידָ/ה לִּ֔/י בַּ/מֶּ֖ה תֵּאָסֵ֑ר וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אִם תַּאַרְגִ֗י אֶת שֶׁ֛בַע מַחְלְפ֥וֹת רֹאשִׁ֖/י עִם הַ/מַּסָּֽכֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/013.yaml
  text: Then Delilah said to Samson[a], “Until now you have mocked me and told me lies. Tell me what you may be bound with.” And he said to her, “If you weave the seven locks of my head with the web.”
translation:
  language: sw
  text: Ndipo Delila akamwambia Samsoni, “Mpaka sasa umenifanyia mzaha na kuniambia uongo. Niambie, unaweza kufungwa kwa nini.” Akamwambia, “Ukiyafuma mashungi saba ya nywele za kichwa changu pamoja na kitambaa cha kufumia[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ukiyasuka mashungi saba ya nywele zangu kwa kifaa cha kufumia,” au “ndani ya kitambaa kinachofumwa.” Neno la Kiebrania linalohusu ufumaji ni istilahi maalumu, na maana yake kamili hapa si hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתַ֤לְתָּ בִּי
  choice: umenifanyia mzaha
  rationale: Kauli hii inaonyesha kumchezea mtu au kumfanya mjinga kwa udanganyifu. ‘Umenifanyia mzaha’ ni ya kawaida na haijirudii na kauli inayofuata kuhusu uongo.
- source_word: כְּזָבִים
  choice: uongo
  rationale: Nomino ya Kiebrania iko katika wingi, lakini Kiswahili cha kawaida hutumia ‘uongo’ kama nomino isiyohesabika katika kauli ‘kuniambia uongo.’
- source_word: הַגִּידָה לִּי
  choice: Niambie
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya amri ya kueleza jambo.
- source_word: בַּמֶּה תֵּאָסֵר
  choice: ninaweza kukufunga kwa kitu gani
  rationale: Muundo huu wa Kiswahili unadumisha maana ya chombo kinachotumiwa kufunga, huku muktadha ukifanya wazi kuwa Delila anauliza Samsoni anaweza kufungwa kwa nini.
- source_word: תַּאַרְגִי
  choice: ukiyafuma
  rationale: Kitenzi hiki humaanisha kufuma; umbo la masharti linafaa na jibu la Samsoni linaloanza kwa ‘ikiwa.’
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשִׁי
  choice: mafungu saba ya nywele za kichwa changu
  rationale: ‘Mafungu’ linaeleza nywele zilizogawanyika katika sehemu au mashungi bila kulazimisha maana ya kusukwa ambayo neno la Kiebrania linaweza lakini si lazima liwe nayo.
- source_word: עִם הַמַּסָּכֶת
  choice: pamoja na kitambaa kinachofumwa
  rationale: Neno hili ni istilahi maalumu ya ufumaji na huenda likarejelea kitambaa au sehemu ya kazi iliyo kwenye kifaa cha kufumia. Tafsiri kuu inaeleza tendo kwa Kiswahili kinachoeleweka huku tanbihi ikihifadhi uwezekano mwingine.
