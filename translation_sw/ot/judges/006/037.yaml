    text: Au “nchi yote” au “dunia yote.” Neno la Kiebrania linaweza kumaanisha ardhi ya mahali fulani, nchi, au dunia. Hapa huenda linamaanisha ardhi inayozunguka konde la sufu katika eneo la ishara hiyo.
    reason: lexical_alternative
