id: JDG.6.37
reference: Judges 6:37
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הִנֵּ֣ה אָנֹכִ֗י מַצִּ֛יג אֶת גִּזַּ֥ת הַ/צֶּ֖מֶר בַּ/גֹּ֑רֶן אִ֡ם טַל֩ יִהְיֶ֨ה עַֽל הַ/גִּזָּ֜ה לְ/בַדָּ֗/הּ וְ/עַל כָּל הָ/אָ֨רֶץ֙ חֹ֔רֶב וְ/יָדַעְתִּ֗י כִּֽי תוֹשִׁ֧יעַ בְּ/יָדִ֛/י אֶת יִשְׂרָאֵ֖ל כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/037.yaml
  text: Look[a], I am placing a fleece of wool on the threshing floor. If there is dew on the fleece alone, and dryness on all the ground, then I will know that you will save Israel by my hand, just as you have spoken.
translation:
  language: sw
  text: Tazama, ninaweka konde la sufu kwenye uwanja wa kupuria. Ikiwa umande utakuwa juu ya konde hilo peke yake, na ardhi yote[a] itakuwa kavu, ndipo nitakapojua kwamba utawaokoa Israeli kwa mkono wangu, kama ulivyosema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi yote” au “dunia yote.” Neno la Kiebrania linaweza kumaanisha ardhi ya mahali fulani, nchi, au dunia. Hapa huenda linamaanisha ardhi inayozunguka konde la sufu katika eneo la ishara hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Linahifadhi msisitizo wa kumwelekeza msikilizaji kwenye ishara anayopendekeza Gideoni, kwa lugha ya heshima inayoeleweka.
- source_word: מַצִּיג
  choice: ninaweka
  rationale: Kauli ya wakati unaoendelea pamoja na kiwakilishi cha nafsi inaonyesha tendo la sasa au linalokaribia kufanywa; ‘ninaweka’ ni ya kawaida na halisi.
- source_word: גִּזַּת הַצֶּמֶר
  choice: ngozi yenye sufu
  rationale: Inaonyesha ngozi iliyonyolewa iliyo na sufu bila kuongeza wazi kwamba ni ya kondoo, jambo ambalo halijasemwa moja kwa moja katika kirai cha Kiebrania.
- source_word: בַּגֹּרֶן
  choice: kwenye uwanja wa kupuria
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa eneo lililotayarishwa kwa ajili ya kupuria nafaka.
- source_word: טַל יִהְיֶה
  choice: umande utakuwa
  rationale: Linadumisha muundo wa kuwepo kwa umande bila kufafanua zaidi kwamba utaanguka.
- source_word: עַל הַגִּזָּה לְבַדָּהּ
  choice: juu ya ngozi hiyo peke yake
  rationale: ‘Peke yake’ linahifadhi dhana ya upekee iliyosisitizwa na לְבַדָּהּ.
- source_word: וְעַל כָּל הָאָרֶץ חֹרֶב
  choice: na ardhi yote itakuwa kavu
  rationale: ‘Ardhi’ inafaa kwa eneo linalozunguka ngozi katika muktadha huu, huku ‘itakuwa kavu’ ikiwasilisha hali inayotajwa na חֹרֶב kwa Kiswahili cha kawaida.
- source_word: וְיָדַעְתִּי
  choice: ndipo nitakapojua
  rationale: Inaweka wazi matokeo ya sharti kwa mtiririko wa kawaida wa Kiswahili.
- source_word: כִּי תוֹשִׁיעַ
  choice: kwamba utawaokoa
  rationale: Kitenzi cha Hiphil cha יָשַׁע kina maana ya kuokoa au kukomboa; ‘kuwaokoa’ ni sahihi na wazi katika muktadha.
- source_word: בְּיָדִי
  choice: kwa mkono wangu
  rationale: Linahifadhi taswira halisi ya nahau ya Kiebrania inayomaanisha utendaji kupitia Gideoni.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: kama ulivyosema
  rationale: Linabaki karibu na maana ya ‘ulivyosema’ bila kuongeza wazi dhana yenye nguvu zaidi ya ahadi.
theological_decisions:
- issue: Upeo wa הָאָרֶץ katika ishara ya Gideoni
  choice: ardhi
  alternative: nchi au dunia
  rationale: Katika tukio hili, tofauti ni kati ya ngozi yenye sufu na sehemu inayoizunguka kwenye uwanja wa kupuria. ‘Ardhi’ inafaa kwa maana hiyo ya mahali bila kudai kwamba nchi nzima au dunia nzima ilihusika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo unahifadhi msisitizo wa ishara, sharti, na matokeo yake; taswira ya ‘kwa mkono wangu’ imeachwa bila kuibadili kuwa maelezo ya moja kwa moja.
