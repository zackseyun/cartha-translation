review_pass:
  verdict: revise
  source_fidelity: The conditional sequence, exclusive dew on the fleece, dryness on the surrounding ground, Gideon's resulting knowledge, and divine deliverance of Israel through Gideon are accurately represented. However, “ngozi yenye sufu” normally denotes an animal skin/hide that still has wool on it, whereas גִּזַּת הַצֶּמֶר denotes a fleece—a mass of shorn wool—not the hide itself.
  naturalness: The verse is clear and suitably formal in Standard East African Swahili. Replacing the potentially misleading phrase for the fleece improves both precision and idiomatic clarity.
  terminology: “Uwanja wa kupuria,” “umande,” “ardhi,” “kuwaokoa Israeli,” and “kwa mkono wangu” are appropriate. “Konde la sufu” identifies the fleece without adding that it is an animal skin.
  issues:
  - severity: medium
    issue: “ngozi yenye sufu” renders the fleece as a hide/skin with wool still attached.
    rationale: The Hebrew גִּזַּת הַצֶּמֶר refers to a fleece of wool. Calling it ngozi changes the physical object in Gideon's sign; “konde la sufu” is more precise.
  revised_text: Tazama, ninaweka konde la sufu kwenye uwanja wa kupuria. Ikiwa umande utakuwa juu ya konde hilo peke yake, na ardhi yote[a] itakuwa kavu, ndipo nitakapojua kwamba utawaokoa Israeli kwa mkono wangu, kama ulivyosema.
  revised_footnotes:
