base_translation:
  language: en
  yaml_path: translation/ot/judges/006/010.yaml
  text: And I said to you[a], ‘I am Yahweh your God; do not fear the gods of the Amorites, in whose land you dwell[b]. But you have not listened to my voice.’
translation:
  language: sw
  text: Nami niliwaambia, “Mimi ni Yahweh, Mungu wenu. Msiwaogope[a] miungu ya Waamori, katika nchi yao mnamoishi. Lakini hamkuisikiliza sauti yangu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaonyesha katazo; pia inaweza kutafsiriwa, “Hamtaogopa” au “Msiogope.”
    reason: lexical_alternative
  - marker: b
    text: “Kuisikiliza sauti yangu” hapa pia kunaweza kueleweka kuwa “kuitii sauti yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לָכֶם
  choice: Nami niliwaambia
  rationale: Kitenzi אמר katika mfululizo wa masimulizi kinaonyesha kwamba Yahweh aliwaambia Israeli maneno haya hapo awali; “niliwaambia” ni Kiswahili cha kawaida na hujumuisha kiwakilishi cha wingi kilicho katika לָכֶם.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ingawa umbo אֱלֹהִים linaonekana kuwa la wingi, hapa linamtaja Mungu wa Israeli kwa maana ya umoja, likiwa na kiambishi cha nafsi ya pili wingi.
- source_word: לֹא תִירְאוּ
  choice: Msiwaogope
  rationale: Kikanushi לֹא pamoja na kitenzi cha hali isiyotimilika kina nguvu ya katazo. “Msiwaogope” ni amri hasi ya kawaida kwa kundi na pia huonyesha kwamba kinachoogopwa ni miungu iliyotajwa.
- source_word: אֶת אֱלֹהֵי הָאֱמֹרִי
  choice: miungu ya Waamori
  rationale: אֱלֹהֵי ni wingi katika mnyambuliko huu na inarejelea miungu iliyoabudiwa na Waamori; jina la taifa la Kiebrania lililo katika umoja wa kijumla limetafsiriwa kwa wingi wa kawaida wa Kiswahili.
- source_word: אֲשֶׁר אַתֶּם יוֹשְׁבִים בְּאַרְצָם
  choice: ambao mnakaa katika nchi yao
  rationale: Kishazi hiki kinawarudia Waamori na huhifadhi maana ya kukaa au kuishi katika nchi yao bila kuamua zaidi kuhusu umiliki wa kudumu.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹלִי
  choice: Lakini hamkuisikiliza sauti yangu
  rationale: Nahau שמע בקול inaweza kumaanisha kusikiliza kwa kuitikia, yaani kutii. Tafsiri hii huhifadhi taswira halisi ya “sauti” huku muktadha ukidokeza kutotii; “Lakini” huonyesha wazi tofauti kati ya amri na mwitikio wao.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja. Kulitaja “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya שמע בקול
  choice: hamkuisikiliza sauti yangu
  alternative: hamkuitii sauti yangu
  rationale: Usemi wa Kiebrania unahusisha kusikia kwa kuitikia na mara nyingi una maana ya kutii. Tafsiri iliyochaguliwa huhifadhi nahau na mvutano wake, huku tanbihi ikieleza maana ya utii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo “Mimi ni Yahweh, Mungu wenu” huhifadhi msisitizo wa kiwakilishi cha Kiebrania, na nahau ya “kuisikiliza sauti” imehifadhiwa kwa sababu inaeleweka katika Kiswahili huku tanbihi ikifafanua maana ya utii.
