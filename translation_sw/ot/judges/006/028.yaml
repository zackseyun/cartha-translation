id: JDG.6.28
reference: Judges 6:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֜ימוּ אַנְשֵׁ֤י הָ/עִיר֙ בַּ/בֹּ֔קֶר וְ/הִנֵּ֤ה נֻתַּץ֙ מִזְבַּ֣ח הַ/בַּ֔עַל וְ/הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָ֖י/ו כֹּרָ֑תָה וְ/אֵת֙ הַ/פָּ֣ר הַ/שֵּׁנִ֔י הֹֽעֲלָ֔ה עַל הַ/מִּזְבֵּ֖חַ הַ/בָּנֽוּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/028.yaml
  text: When the men of the city rose early in the morning[a], behold, the altar of Baal had been torn down, and the Asherah that was on it had been cut down[b], and the second bull had been offered up on the altar that had been built.
translation:
  language: sw
  text: Wanaume wa mji walipoamka asubuhi na mapema, tazama, madhabahu ya Baali ilikuwa imebomolewa, Ashera[a] iliyokuwa juu yake[b] ilikuwa imekatwa, na ng’ombe-dume wa pili alikuwa ametolewa kuwa sadaka juu ya madhabahu iliyokuwa imejengwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “nguzo ya Ashera”; Kiebrania: “Ashera.”'
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania kwa kawaida humaanisha “juu yake,” lakini hapa linaweza pia kueleweka kuwa “kando yake” au “karibu nayo.”
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ
  choice: walipoamka asubuhi na mapema
  rationale: Kitenzi kinaonyesha kuamka mapema; usemi huu ni wa kawaida katika Kiswahili na unadumisha mkazo wa wakati.
- source_word: אַנְשֵׁי הָעִיר
  choice: wanaume wa mji
  rationale: Nomino ya Kiebrania inawataja wanaume kwa wazi, hivyo haijafanywa kuwa neno lisiloonyesha jinsia.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili linaonyesha ugunduzi wa ghafla na kuupa usimulizi msisitizo wa wazi.
- source_word: נֻתַּץ
  choice: ilikuwa imebomolewa
  rationale: Hali ya kutendwa ya נתץ inaeleza kuvunjwa au kubomolewa kwa madhabahu; ‘imebomolewa’ ni ya kawaida na sahihi kwa jengo hilo.
- source_word: מִזְבַּח הַבַּעַל
  choice: madhabahu ya Baali
  rationale: Huu ni uwasilishaji wa moja kwa moja na wa kawaida wa uhusiano wa maneno hayo.
- source_word: הָאֲשֵׁרָה
  choice: Ashera
  rationale: Jina la Kiebrania limedumishwa ili kutobainisha kupita kiasi kama lilikuwa mti, nguzo, au kitu kingine cha ibada kilichohusishwa na Ashera.
- source_word: אֲשֶׁר עָלָיו
  choice: iliyokuwa juu yake
  rationale: Tafsiri hii inafuata maana ya kawaida ya עַל bila kuibadili kimya kimya kuwa ‘kando yake’; uwezekano wa maana ya uhusiano au ukaribu umetajwa katika tanbihi.
- source_word: כֹּרָתָה
  choice: ilikuwa imekatwa
  rationale: Hali ya kutendwa ya כרת inaonyesha kitu hicho cha ibada kilikatwa; muundo wa wakati unaonyesha hali waliyokuta asubuhi.
- source_word: הַפָּר הַשֵּׁנִי
  choice: ng’ombe-dume wa pili
  rationale: פַּר ni ng’ombe-dume, na ‘wa pili’ inadumisha uhusiano wake na maagizo yaliyotangulia.
- source_word: הֹעֲלָה
  choice: alikuwa ametolewa kuwa sadaka
  rationale: Katika muktadha wa ibada, kitenzi hiki kinaonyesha mnyama kutolewa juu ya madhabahu; tafsiri haiongezi maelezo yasiyotajwa moja kwa moja katika mstari huu.
- source_word: הַמִּזְבֵּחַ הַבָּנוּי
  choice: madhabahu iliyokuwa imejengwa
  rationale: Kirai hiki kinaitambulisha kama madhabahu ambayo tayari ilikuwa imejengwa katika simulizi.
theological_decisions:
- issue: Maana ya אֲשֵׁרָה
  choice: Ashera
  alternative: nguzo ya Ashera; nguzo takatifu
  rationale: Neno linaweza kumaanisha kitu cha ibada kilichohusishwa na mungu wa kike Ashera, lakini umbo lake halibainishwi hapa. Kutumia ‘Ashera’ kunahifadhi upeo wa neno la chanzo.
- issue: Maana ya עָלָיו kuhusiana na Ashera
  choice: juu yake
  alternative: kando yake; karibu nayo
  rationale: Maana ya kawaida na ya moja kwa moja ni ‘juu yake.’ Kwa kuwa katika mazingira ya ibada neno linaweza kueleweka kwa maana ya kuhusishwa au kuwa karibu na madhabahu, uwezekano huo umehifadhiwa katika tanbihi badala ya kuamuliwa kimya kimya.
- issue: Maana ya dhabihu katika הֹעֲלָה
  choice: ametolewa kuwa sadaka
  alternative: ametolewa kuwa sadaka ya kuteketezwa
  rationale: Muktadha wa mistari iliyotangulia unaonyesha sadaka ya kuteketezwa, lakini kitenzi cha mstari huu pekee hakihitaji kuongeza maelezo hayo waziwazi. Tafsiri kuu inabaki karibu na usemi wa chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa usimulizi wenye heshima lakini unaoeleweka kwa urahisi. ‘Tazama’ inadumisha nguvu ya ghafla ya וְהִנֵּה. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
