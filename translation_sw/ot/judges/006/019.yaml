base_translation:
  language: en
  yaml_path: translation/ot/judges/006/019.yaml
  text: Then Gideon went in and prepared a young goat and unleavened bread from an ephah of flour[a]. He put the meat in a basket and the broth in a pot[b], and brought them out to him under the terebinth and presented them.
translation:
  language: sw
  text: Ndipo Gideoni akaingia, akaandaa mwana-mbuzi na mikate isiyotiwa chachu kwa efa moja ya unga. Akatia nyama kikapuni na mchuzi katika chungu, akavileta nje kwake chini ya mvinje[a], kisha akaviweka mbele yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chini ya mwaloni.” Neno la Kiebrania huenda linamaanisha mvinje, ingawa kwa mapokeo limetafsiriwa pia kuwa mwaloni.
    reason: lexical_alternative
  - marker: b
    text: Au “akavisogeza karibu naye” au “akaviwasilisha kwake.” Kitenzi cha Kiebrania kinamaanisha kuleta karibu au kuwasilisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: akaingia
  rationale: Katika muktadha Gideoni anaondoka mahali alipokuwa na mgeni ili kuandaa chakula; “akaingia” linaonyesha mwendo huo kwa Kiswahili cha kawaida.
- source_word: וַיַּעַשׂ
  choice: akaandaa
  rationale: Kitenzi kinapotumiwa kuhusu chakula hutafsiriwa kwa kawaida na kwa usahihi kuwa “kuandaa.”
- source_word: גְּדִי עִזִּים
  choice: mwana-mbuzi
  rationale: Kirai hiki kinamaanisha mbuzi mchanga; “mwana-mbuzi” ni neno la kawaida na mahususi katika Kiswahili.
- source_word: אֵיפַת קֶמַח
  choice: efa moja ya unga
  rationale: Jina la kipimo cha Kiebrania limehifadhiwa badala ya kugeuzwa kuwa kipimo kisicho maalumu.
- source_word: מַצּוֹת
  choice: mikate isiyotiwa chachu
  rationale: Hueleza mikate iliyotengenezwa bila chachu; tafsiri hii ni wazi na ya kawaida.
- source_word: הַבָּשָׂר
  choice: nyama
  rationale: Katika muktadha wa chakula, “nyama” ndiyo tafsiri ya kawaida ya neno hili.
- source_word: סַּל
  choice: kikapu
  rationale: Hiki ni chombo cha kubebea vitu; “kikapu” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: הַמָּרַק
  choice: mchuzi
  rationale: Neno hili linamaanisha umajimaji wa nyama iliyopikwa; “mchuzi” linafaa kwa muktadha wa upishi.
- source_word: פָּרוּר
  choice: chungu
  rationale: Neno linaonyesha chombo cha kupikia au kuhifadhia kimiminika; “chungu” ni cha asili katika Kiswahili.
- source_word: וַיּוֹצֵא אֵלָיו
  choice: akavileta nje kwake
  rationale: Kiambishi cha ngeli ya vitu kinarejelea kwa pamoja nyama na mchuzi, huku “kwake” kikihifadhi maana ya kumletea yule aliyekuwa akimngojea.
- source_word: תַּחַת הָאֵלָה
  choice: chini ya mvinje
  rationale: אֵלָה kwa kawaida humaanisha mti wa terebinthi; “mvinje” ni jina la Kiswahili linalofaa kuliko kuugeuza moja kwa moja kuwa mwaloni.
- source_word: וַיַּגַּשׁ
  choice: akaviweka mbele yake
  rationale: Kitenzi kinamaanisha kuleta karibu au kuwasilisha. Katika muktadha wa ukarimu, “kuweka mbele yake” ni cha kawaida na hakiongezi wazi wazo la dhabihu ambalo mstari wenyewe haulitamki.
theological_decisions:
- issue: Iwapo tendo la Gideoni litajwe wazi kuwa kutoa dhabihu
  choice: Limetafsiriwa kwa lugha ya kuandaa chakula na kukiweka mbele ya mgeni.
  alternative: “Akavitoa kuwa dhabihu.”
  rationale: Ingawa simulizi linalofuata linaweza kuleta maana inayohusiana na dhabihu, mstari huu unasema tu kwamba Gideoni aliandaa, alileta karibu, na aliweka chakula mbele yake. Tafsiri haikimbilii kuamua mvutano huo wa kisimulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi unaoeleweka kwa wasomaji wa kawaida. Msamiati ni wa sasa na wenye heshima; kipimo mahsusi “efa” na aina ya mti “mvinje” zimehifadhiwa kwa uaminifu kwa chanzo.
