base_translation:
  language: en
  yaml_path: translation/ot/judges/006/024.yaml
  text: Then Gideon built an altar there to Yahweh and called it[a], “Yahweh Is Peace.” It remains there to this day in Ophrah of the Abiezrites.
translation:
  language: sw
  text: Ndipo Gideoni akamjengea Yahwe madhabahu pale, akaiita[a] “Yahwe ni Amani.” Mpaka leo, madhabahu hiyo bado ipo Ofra ya Waabiezeri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH shalom”; kwa desturi hunakiliwa “Yahwe-shalomu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: akamjengea
  rationale: Kitenzi בנה kina maana ya kujenga; muundo wa Kiswahili wenye kiambishi cha kutendea unaonyesha kwamba madhabahu ilijengwa kwa ajili ya Yahwe.
- source_word: מִזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mahali pa kutolea dhabihu katika muktadha wa ibada.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יְהוָה limetolewa kama “Yahwe”; uhusiano wa kihusishi ל umeonyeshwa katika kitenzi “akamjengea.”
- source_word: וַיִּקְרָא לוֹ
  choice: akaiita
  rationale: Katika muktadha huu קרא + ל inaonyesha kuipa madhabahu jina; “akaiita” ni Kiswahili cha kawaida na wazi.
- source_word: יְהוָה שָׁלוֹם
  choice: Yahwe ni Amani
  rationale: Muundo wa Kiebrania hauna kitenzi kilichoandikwa; “ni” huleta sentensi ya jina kwa Kiswahili bila kufuta maana yake ya msingi.
- source_word: שָׁלוֹם
  choice: Amani
  rationale: “Amani” ndiyo tafsiri fupi na ya kawaida zaidi katika jina hili, ingawa neno la Kiebrania linaweza pia kuhusisha hali njema na ukamilifu.
- source_word: עַד הַיּוֹם הַזֶּה עוֹדֶנּוּ
  choice: Mpaka leo, madhabahu hiyo bado ipo
  rationale: Maneno haya yanahifadhi kwa pamoja wazo la kuendelea kuwapo hadi wakati wa msimuliaji.
- source_word: בְּעָפְרָת
  choice: Ofra
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: אֲבִי הָעֶזְרִי
  choice: ya Waabiezeri
  rationale: Nomino hii ya ukoo inaonyesha Ofra iliyohusishwa na ukoo wa Abiezeri; “Waabiezeri” ni umbo la kawaida la Kiswahili kwa watu wa ukoo huo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה katika wakfu wa madhabahu na katika jina lake
  choice: Yahwe / Yahwe ni Amani
  alternative: BWANA / BWANA ni Amani; Yahwe-shalomu
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina יְהוָה. Kulitoa kama “Yahwe” huhifadhi jina hilo la agano, huku “Yahwe ni Amani” ikitafsiri maana ya jina la madhabahu badala ya kulinakili tu.
- issue: Maana pana ya שָׁלוֹם
  choice: Amani
  alternative: Hali njema; ukamilifu
  rationale: “Amani” inafaa zaidi katika jina fupi la madhabahu, lakini haitumiki hapa kufuta vivuli vya maana vya hali njema au ukamilifu vilivyomo katika שָׁלוֹם.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ndipo” hudumisha mwendelezo wa simulizi; “bado ipo” ni ya kawaida na wazi kuliko umbo la kifasihi zaidi “ingalipo.” Alama ya tanbihi [a] imewekwa mara tu baada ya kitenzi cha kulipa jina.
