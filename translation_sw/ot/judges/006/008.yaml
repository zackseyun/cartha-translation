base_translation:
  language: en
  yaml_path: translation/ot/judges/006/008.yaml
  text: 'Then Yahweh sent a man[a], a prophet, to the sons of Israel, and he said to them, “Thus says Yahweh, the God of Israel: I brought you up from Egypt[b], and I brought you out from the house of slavery.”'
translation:
  language: sw
  text: 'Ndipo Yahwe akamtuma mtu, nabii, kwa wana wa Israeli[a], naye akawaambia, “Yahwe, Mungu wa Israeli, asema hivi: Mimi niliwapandisha kutoka Misri, nikawatoa katika nyumba ya utumwa[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa Waisraeli.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa neno halisi ni “nyumba ya watumwa.”
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Ndipo ... akamtuma
  rationale: Kiunganishi cha masimulizi kinaendeleza mfuatano wa matukio; “Ndipo” ni cha asili katika Kiswahili na kinaonyesha hatua inayofuata.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: אִישׁ נָבִיא
  choice: mtu mmoja, nabii
  rationale: Nomino zote mbili zimehifadhiwa kwa uhusiano wa ufafanuzi, kama katika Kiebrania.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: kwa wana wa Israeli
  rationale: Huhifadhi kwa uwazi jina la pamoja la agano; “kwa Waisraeli” ni tafsiri mbadala ya asili zaidi katika matumizi ya kawaida.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Ni fomula ya kawaida ya ujumbe wa kinabii na inasikika kwa ufasaha katika Kiswahili.
- source_word: אָנֹכִי הֶעֱלֵיתִי
  choice: Mimi niliwapandisha
  rationale: “Mimi” huhifadhi mkazo wa kiwakilishi huru, na “niliwapandisha” huhifadhi taswira ya kupandishwa kutoka Misri.
- source_word: וָאֹצִיא
  choice: nikawatoa
  rationale: Huwasilisha tendo la kusababisha watoke na kuendeleza kwa kawaida mfuatano wa usemi.
- source_word: מִבֵּית עֲבָדִים
  choice: katika nyumba ya utumwa
  rationale: Hii ni tafsiri ya asili na yenye heshima kwa Kiswahili inayohifadhi taswira ya “nyumba” na hali ya utumwa; Kiebrania cha neno kwa neno kina “nyumba ya watumwa.”
theological_decisions:
- issue: Uandikaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu; “Yahwe” hulihifadhi bila kulibadilisha kuwa cheo.
- issue: Jina la pamoja בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Tafsiri iliyochaguliwa huhifadhi muundo wa Kiebrania na maana yake ya watu wa agano, huku tanbihi ikitoa namna ya kawaida zaidi.
- issue: Taswira ya kutoka Misri katika הֶעֱלֵיתִי
  choice: niliwapandisha kutoka Misri
  alternative: niliwatoa kutoka Misri
  rationale: “Niliwapandisha” huhifadhi kitenzi tofauti na וָאֹצִיא na taswira ya jadi ya kupanda kutoka Misri bila kufuta mvutano wa maneno hayo mawili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaofaa kwa usomaji wa Biblia. Muundo wa kinabii “asema hivi” na jina “Yahwe” umetumiwa kwa uthabiti.
