  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ בִּ֣י אֲדֹנָ֔/י בַּ/מָּ֥ה אוֹשִׁ֖יעַ אֶת יִשְׂרָאֵ֑ל הִנֵּ֤ה אַלְפִּ/י֙ הַ/דַּ֣ל בִּ/מְנַשֶּׁ֔ה וְ/אָנֹכִ֥י הַ/צָּעִ֖יר בְּ/בֵ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/015.yaml
  text: But he said to him[a], “Please, my lord, how can I save Israel? Look, my clan is the weakest in Manasseh[c][b], and I am the youngest in my father’s house.”
translation:
  language: sw
  text: Lakini akamwambia, “Tafadhali, bwana wangu, nitawezaje kuiokoa Israeli? Tazama, ukoo wangu[a] ndio ulio dhaifu zaidi[b] katika Manase, nami ndiye mdogo zaidi[c] katika nyumba ya baba yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “elfu yangu”; neno la Kiebrania linaweza kumaanisha kitengo cha ukoo.
    reason: lexical_alternative
  - marker: b
    text: Au, “maskini zaidi” au “wa hali ya chini zaidi.”
    reason: lexical_alternative
  - marker: c
    text: Au, “wa maana ndogo zaidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: Tafadhali
  rationale: Hapa ni neno la kuomba kwa heshima, si kihusishi chenye maana ya mahali. “Tafadhali” ni Kiswahili cha kawaida kinachoonyesha ombi la Gideoni kwa unyenyekevu.
- source_word: אֲדֹנָי
  choice: bwana wangu
  rationale: Ni namna ya kumwita anayezungumziwa kwa heshima. Herufi ndogo zinahifadhi uwezekano kwamba Gideoni bado anamwona kama mwenye mamlaka anayestahili heshima, bila kuamua mapema kwamba ametumia cheo cha Mungu.
- source_word: בַּמָּה
  choice: nitawezaje
  rationale: Ingawa muundo wake unaweza kutafsiriwa kihalisi “kwa nini/kwa kitu gani,” katika muktadha huu unauliza Gideoni atawezaje kutimiza kazi hiyo.
- source_word: אוֹשִׁיעַ
  choice: kuiokoa
  rationale: Kitenzi cha Kiebrania katika Hiphil kina maana ya kuokoa au kukomboa. “Kuiokoa” ni ya kawaida na pana, na Israeli imetumika kama jina la pamoja.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Huelekeza fikira kwenye maelezo yanayofuata. “Tazama” hudumisha nguvu hiyo kwa lugha yenye hadhi bila kuwa ngumu kueleweka.
- source_word: אַלְפִּי
  choice: ukoo wangu
  rationale: Ingawa אֶלֶף huhusiana kihalisi na “elfu,” katika mpangilio wa kijamii na kikabila inaweza kumaanisha kitengo cha ukoo. “Ukoo wangu” huwasilisha maana inayofaa katika muktadha huu.
- source_word: הַדַּל
  choice: dhaifu zaidi
  rationale: דַּל inaweza kueleza udhaifu, umaskini, au hali ya chini. Hapa Gideoni anasisitiza ukosefu wa uwezo na cheo cha ukoo wake; “dhaifu zaidi” huonyesha hilo huku tanbihi ikihifadhi maana nyingine.
- source_word: בִּמְנַשֶּׁה
  choice: katika Manase
  rationale: Ni rejeo la moja kwa moja kwa kabila la Manase.
- source_word: הַצָּעִיר
  choice: mdogo zaidi
  rationale: Neno linaweza kumaanisha aliye mdogo kwa umri, cheo, au umuhimu. “Mdogo zaidi” ni la kawaida katika familia na bado linaweza kudokeza hadhi ya chini.
- source_word: בְּבֵית אָבִי
  choice: katika nyumba ya baba yangu
  rationale: Ni usemi wa Kiebrania unaomaanisha nyumba au jamaa ya upande wa baba. Muundo huu unadumisha taswira ya chanzo na unaeleweka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Nguvu ya אֲדֹנָי katika maneno ya Gideoni
  choice: “bwana wangu” kama namna ya heshima, kwa herufi ndogo
  alternative: “Bwana wangu” kama cheo cha Mungu
  rationale: Katika hatua hii ya simulizi, utambulisho wa msemaji haujawekwa wazi kabisa kwa Gideoni. Herufi ndogo zinahifadhi mvutano huo wa simulizi badala ya kuamua mapema kuwa Gideoni anatambua wazi anazungumza na Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya kawaida kwa wasomaji wa leo, huku maneno “Tazama” na “nyumba ya baba yangu” yakihifadhi mtindo na taswira ya simulizi la Kiebrania. Alama zote za tanbihi zimewekwa baada ya maneno husika.
