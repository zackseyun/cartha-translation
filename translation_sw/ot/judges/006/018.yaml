base_translation:
  language: en
  yaml_path: translation/ot/judges/006/018.yaml
  text: Please do not depart from here until I come to you and bring out my offering and set it before you." And he said[a], "I will stay until you return.
translation:
  language: sw
  text: “Tafadhali usiondoke hapa mpaka nitakapokuja kwako na nitoe zawadi yangu[a] na kuiweka mbele yako.” Naye akasema, “Nitakaa hapa mpaka utakaporudi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka yangu”; neno la Kiebrania linaweza kumaanisha kwa upana zawadi au kitu kinachowasilishwa, na katika mazingira fulani sadaka au ushuru.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָמֻשׁ מִזֶּה
  choice: usiondoke hapa
  rationale: Kitenzi מוש pamoja na מִזֶּה humaanisha kuondoka mahali pa sasa; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: עַד בֹּאִי אֵלֶיךָ
  choice: mpaka nitakapokuja kwako
  rationale: Muundo wa Kiebrania wenye jina-kitenzi na kiambishi cha nafsi umetafsiriwa kwa kishazi cha wakati kinachosikika kiasili katika Kiswahili.
- source_word: וְהוֹצֵאתִי
  choice: nilete
  rationale: Hiphil ya יצא hapa inaeleza Gideoni kukitoa kitu alikokwenda kukiandaa na kukileta kwa mgeni; ‘nilete’ ni wazi na ya kawaida.
- source_word: מִנְחָתִי
  choice: zawadi yangu
  rationale: מִנְחָה inaweza kuwa zawadi, kitu kinachowasilishwa, ushuru, au sadaka. ‘Zawadi’ huhifadhi maana pana katika hatua hii ya simulizi, huku tanbihi ikionyesha uwezekano wa maana ya kisadaka.
- source_word: וְהִנַּחְתִּי לְפָנֶיךָ
  choice: na kuiweka mbele yako
  rationale: Hii inawasilisha moja kwa moja tendo la kukiweka kitu katika uwepo wa mhusika mwingine.
- source_word: אָנֹכִי אֵשֵׁב
  choice: Nitakaa hapa
  rationale: Ingawa ישב kimsingi ni ‘kukaa,’ hapa ina maana ya kubaki mahali hapo; kuongezwa kwa ‘hapa’ kunafanya maana ya kimuktadha iwe wazi bila kubadili dhamira.
- source_word: עַד שׁוּבֶךָ
  choice: mpaka utakaporudi
  rationale: Jina-kitenzi lenye kiambishi limetolewa kama kishazi cha wakati cha Kiswahili.
- source_word: נָא
  choice: Tafadhali
  rationale: Chembe נָא huonyesha ombi la heshima; ‘Tafadhali’ hutoa sauti hiyo kwa Kiswahili cha sasa.
theological_decisions:
- issue: Maana ya מִנְחָה katika kile Gideoni anachowasilisha
  choice: zawadi
  alternative: sadaka; kitu cha kuwasilisha; ushuru
  rationale: Neno la Kiebrania lina wigo mpana. ‘Zawadi’ huepuka kuamua mapema kwamba ni sadaka rasmi, huku tanbihi ikihifadhi mwangwi wa kidini unaodhihirika kadiri simulizi linavyoendelea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mazungumzo yamewekwa kwa lugha ya kawaida lakini yenye uzito wa simulizi. Alama ya tanbihi [a] imewekwa mara tu baada ya kirai kinachohusika.
