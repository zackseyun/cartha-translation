  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeundwa kwa mtiririko wa kawaida huku ikihifadhi maana ya tukio lililojirudia na Israeli kama jina la pamoja.
