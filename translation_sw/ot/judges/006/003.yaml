  text: וְ/הָיָ֖ה אִם זָרַ֣ע יִשְׂרָאֵ֑ל וְ/עָלָ֨ה מִדְיָ֧ן וַֽ/עֲמָלֵ֛ק וּ/בְנֵי קֶ֖דֶם וְ/עָל֥וּ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/003.yaml
  text: And whenever Israel sowed[a], Midian and Amalek and the people of the East would come up against them.
translation:
  language: sw
  text: Kila mara Israeli walipopanda mbegu, Wamidiani, Waamaleki, na watu wa Mashariki walikuja kuwashambulia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi “dhidi yake,” kwa kiambishi cha umoja kinachorejelea Israeli kama taifa; hapa kimetafsiriwa “kuwashambulia” kwa sababu Israeli inawakilisha watu kwa pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Kila mara ... walipo-
  rationale: Muundo huu unaonyesha tukio lililojirudia, si sharti la wakati mmoja. Kiswahili cha “kila mara ... walipo-” kinaonyesha vizuri maana ya ‘wakati wowote/kila walipofanya hivyo.’
- source_word: זָרַע
  choice: walipopanda mbegu
  rationale: Kitenzi kinamaanisha kupanda mbegu. Kutaja “mbegu” kunaweka wazi shughuli ya kilimo kwa Kiswahili cha kawaida.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa limehifadhiwa; hapa linawakilisha watu kwa ujumla, hivyo kitenzi cha wingi “walipopanda” ni cha asili katika Kiswahili.
- source_word: וְעָלָה ... וְעָלוּ עָלָיו
  choice: walikuja kuwashambulia
  rationale: עלה pamoja na על hapa inaeleza kusonga kijeshi dhidi ya Israeli. “Walikuja kuwashambulia” ni Kiswahili cha asili kinachohifadhi mwendo wa kuja na uhasama wa muktadha.
- source_word: מִדְיָן
  choice: Wamidiani
  rationale: Ingawa Kiebrania kinatumia jina Midiani, katika muktadha huu jina hilo linawakilisha watu wake; umbo la Kiswahili “Wamidiani” linaeleweka kwa urahisi.
- source_word: וַעֲמָלֵק
  choice: Waamaleki
  rationale: Jina Amaleki linawakilisha kundi la watu hapa; “Waamaleki” ni namna ya kawaida ya Kiswahili ya kuwataja.
- source_word: וּבְנֵי קֶדֶם
  choice: watu wa Mashariki
  rationale: Neno kwa neno ni “wana wa mashariki,” lakini ni msemo wa kikundi cha watu kutoka eneo la mashariki. “Watu wa Mashariki” hutoa maana hiyo kwa Kiswahili cha sasa bila kuwa mgumu.
