source:
  edition: WLC
  text: וּ/מַלְאָכִים֙ שָׁלַ֣ח בְּ/כָל מְנַשֶּׁ֔ה וַ/יִזָּעֵ֥ק גַּם ה֖וּא אַחֲרָ֑י/ו וּ/מַלְאָכִ֣ים שָׁלַ֗ח בְּ/אָשֵׁ֤ר וּ/בִ/זְבֻלוּן֙ וּ/בְ/נַפְתָּלִ֔י וַֽ/יַּעֲל֖וּ לִ/קְרָאתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/035.yaml
  text: And he sent messengers throughout all Manasseh[a], and it too was called out after him. He also sent messengers through Asher, Zebulun, and Naphtali, and they went up to meet them.
translation:
  language: sw
  text: Akatuma wajumbe kote katika Manase, na watu wa Manase pia wakaitwa wamfuate. Akatuma pia wajumbe katika Asheri, Zabuloni na Naftali, nao wakapanda kwenda kukutana nao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “kukutana nao,” lakini hakitaji wazi “wao” ni nani. Huenda ni majeshi ya adui; au inaweza kueleweka kuwa Gideoni pamoja na watu wake, yaani, “kukutana naye.”
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu wa kukusanya jeshi, neno hili linamaanisha wanadamu waliotumwa kupeleka wito, si malaika.
- source_word: בְּכָל מְנַשֶּׁה
  choice: kote katika Manase
  rationale: Muundo huu unaonyesha kwamba wajumbe walizunguka eneo au jumuiya yote ya kabila la Manase.
- source_word: וַיִּזָּעֵק
  choice: wakaitwa
  rationale: Kauli ya kutendwa inaonyesha kuitwa au kukusanywa kwa ajili ya vita; ‘wakaitwa’ ni ya kawaida na haiongezi maelezo yasiyosemwa wazi.
- source_word: גַּם הוּא
  choice: watu wa Manase pia
  rationale: Kiwakilishi cha umoja cha Kiebrania kinarejelea Manase kama kabila moja; Kiswahili cha asili hufafanua jumuiya hiyo kwa wingi kama ‘watu wa Manase’.
- source_word: אַחֲרָיו
  choice: wamfuate
  rationale: Katika muktadha wa kuhamasisha jeshi, kifungu hiki kinaonyesha kujiunga na Gideoni na kwenda chini ya uongozi wake.
- source_word: בְּאָשֵׁר וּבִזְבֻלוּן וּבְנַפְתָּלִי
  choice: katika Asheri, Zabuloni na Naftali
  rationale: Kihusishi kinadokeza kutumwa kwa wajumbe ndani ya maeneo au jumuiya za makabila hayo.
- source_word: וַיַּעֲלוּ
  choice: wakapanda kwenda
  rationale: Huhifadhi maana ya msingi ya kupanda huku ikisomeka kwa kawaida kama mwendo wa kijeshi.
- source_word: לִקְרָאתָם
  choice: kukutana nao
  rationale: Kiambishi cha Kiebrania ni cha wingi, kwa hiyo ‘nao’ huhifadhi umbo la chanzo na kutotajwa wazi kwa rejeleo lake.
theological_decisions:
- issue: Rejeleo la kiambishi cha wingi katika לִקְרָאתָם
  choice: ‘nao,’ likielekea kwa majeshi ya adui
  alternative: Gideoni pamoja na watu wake, au kwa maana ‘kukutana naye’
  rationale: Kiebrania kinasema kihalisi ‘wao’ bila kutaja rejeleo wazi. Muktadha wa kijeshi unapendelea majeshi ya adui, lakini utata wa rejeleo unapaswa kubaki wazi katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa heshima na unaoeleweka. ‘Watu wa Manase’ imetumiwa badala ya kuipa nchi au kabila tendo la kuitwa, jambo ambalo lingesikika lisilo la kawaida kwa Kiswahili.
