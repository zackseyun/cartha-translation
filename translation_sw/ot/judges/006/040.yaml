    reason: lexical_alternative
  revision_rationale: The revision replaces the inaccurate “ngozi ya kondoo” with “manyoya ya kondoo,” which denotes a fleece of shorn wool, and uses coordinate “na” rather than adversative “lakini” to reflect the Hebrew wording. The footnote is retained and its anchor is placed directly after “ardhi yote,” the term to which it pertains.
