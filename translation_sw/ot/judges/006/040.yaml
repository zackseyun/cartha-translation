  yaml_path: translation/ot/judges/006/040.yaml
  text: And God did so that night[a], and there was dryness on the fleece alone, and on all the ground there was dew.
translation:
  language: sw
  text: Mungu akafanya hivyo usiku ule, na manyoya ya kondoo pekee yalikuwa makavu, na juu ya ardhi yote[a] kulikuwa na umande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya nchi yote.” Neno la Kiebrania אֶרֶץ linaweza kumaanisha “ardhi,” “nchi,” au “dunia”; hapa “ardhi” linafaa zaidi kwa mazingira ya karibu ya ishara ya Gideoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ אֱלֹהִים כֵּן
  choice: Mungu akafanya hivyo
  rationale: Huhifadhi mtindo mfupi wa simulizi na rejeo la כֵּן kwa ombi la Gideoni katika mstari uliotangulia.
- source_word: בַּלַּיְלָה הַהוּא
  choice: usiku ule
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi wakati maalumu unaotajwa.
- source_word: חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  choice: ngozi ya kondoo peke yake ilikuwa kavu
  rationale: Ingawa חֹרֶב ni nomino ya hali ya ukavu, Kiswahili cha kawaida hueleza hali hii kwa kivumishi; 'ngozi ya kondoo' humtambulisha kwa uwazi gִּזָּה kama manyoya yaliyonyolewa yaliyotumiwa katika ishara.
- source_word: וְעַל כָּל הָאָרֶץ הָיָה טָל
  choice: lakini umande ulikuwa juu ya ardhi yote
  rationale: Kiunganishi 'lakini' kinaonyesha utofauti halisi kati ya ngozi kavu na eneo lenye umande; 'ardhi' linafaa kwa mazingira ya karibu huku likihifadhi upana wa maana wa אֶרֶץ.
