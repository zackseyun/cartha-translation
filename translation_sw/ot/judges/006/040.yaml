review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys that God fulfilled the requested sign that night and preserves the contrast between the dry fleece and dew on the surrounding ground. However, “ngozi ya kondoo” means a sheep’s skin/hide, whereas גִּזָּה denotes a fleece of shorn wool; it should be rendered “manyoya ya kondoo” (or “sufu ya kondoo”), not “ngozi ya kondoo.”
  naturalness: The sentence is generally clear and appropriately dignified. “Manyoya ya kondoo pekee yalikuwa makavu, na juu ya ardhi yote kulikuwa na umande” is natural Standard East African Swahili and retains the Hebrew coordinate flow without introducing an explicit adversative.
  terminology: “Mungu,” “umande,” and “ardhi” are appropriate. Replacing “ngozi ya kondoo” corrects the material object and preserves the established meaning of Gideon’s fleece.
  issues:
  - severity: high
    issue: “ngozi ya kondoo” renders the fleece as a sheep skin/hide.
    rationale: The Hebrew גִּזָּה refers to shorn wool/a fleece, not an animal skin. “Manyoya ya kondoo” accurately identifies the object in idiomatic Swahili.
  - severity: low
    issue: “lakini” is stronger than the Hebrew conjunction.
    rationale: The contrast is evident from the two conditions, but וְ is simply coordinate. “na” more closely preserves the narrative syntax without loss of clarity.
  revised_text: Mungu akafanya hivyo usiku ule, na manyoya ya kondoo pekee yalikuwa makavu, na juu ya ardhi yote[a] kulikuwa na umande.
  revised_footnotes:
