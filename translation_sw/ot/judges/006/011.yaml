  text: וַ/יָּבֹ֞א מַלְאַ֣ךְ יְהוָ֗ה וַ/יֵּ֨שֶׁב֙ תַּ֤חַת הָֽ/אֵלָה֙ אֲשֶׁ֣ר בְּ/עָפְרָ֔ה אֲשֶׁ֥ר לְ/יוֹאָ֖שׁ אֲבִ֣י הָֽעֶזְרִ֑י וְ/גִדְע֣וֹן בְּנ֗/וֹ חֹבֵ֤ט חִטִּים֙ בַּ/גַּ֔ת לְ/הָנִ֖יס מִ/פְּנֵ֥י מִדְיָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/011.yaml
  text: Then the angel of Yahweh came and sat under the oak that was in Ophrah[a], which belonged to Joash the Abiezrite[c][b], while Gideon his son was beating out wheat in the winepress to hide it from Midian.
translation:
  language: sw
  text: Kisha malaika wa Yahweh akaja, akaketi chini ya mwaloni[a] uliokuwa huko Ofra, ambao ulikuwa mali ya Yoashi Mwaabiezeri[b]. Wakati huo Gideoni mwanawe alikuwa akipiga ngano[c] ndani ya shinikizo la zabibu ili kuiepusha na Midiani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mvinje.” Neno la Kiebrania la mti huu linaweza kurejelea mti wa aina tofauti.
    reason: lexical_alternative
  - marker: b
    text: Yaani, mtu wa ukoo wa Abiezeri.
    reason: clarification
  - marker: c
    text: Au, “akipura ngano.” Kitenzi cha Kiebrania kinamaanisha kuitoa nafaka kwa kuipiga.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: Ingawa מַלְאַךְ pia inaweza kumaanisha ‘mjumbe,’ muktadha wa simulizi hili unaelekea kwa mjumbe wa mbinguni. ‘Malaika’ ni neno la kawaida na linaloeleweka katika Kiswahili bila kuamua utambulisho wake zaidi ya maandiko.
- source_word: וַיָּבֹא ... וַיֵּשֶׁב
  choice: akaja, akaketi
  rationale: Vitenzi vya mfululizo wa simulizi vimetafsiriwa kwa maumbo ya Kiswahili yanayoendeleza matukio kwa ufasaha.
- source_word: הָאֵלָה
  choice: mwaloni
  rationale: Neno la Kiebrania linataja mti mkubwa ambao utambulisho wake wa kibotania si hakika kabisa; ‘mwaloni’ ni tafsiri inayofahamika, huku ‘mvinje’ ikihifadhiwa katika tanbihi.
- source_word: בְּעָפְרָה
  choice: huko Ofra
  rationale: Jina la mahali limetoholewa kwa tahajia inayofaa Kiswahili; ‘huko’ huweka eneo kwa kawaida katika simulizi.
- source_word: אֲשֶׁר לְיוֹאָשׁ
  choice: ambao ulikuwa mali ya Yoashi
  rationale: Kiwakilishi kinarejelea mwaloni na uhusiano wa umiliki umeelezwa wazi kwa Kiswahili cha kawaida.
- source_word: אֲבִי הָעֶזְרִי
  choice: Mwaabiezeri
  rationale: Hili ni jina la ukoo linalomtambulisha Yoashi kuwa mtu wa ukoo wa Abiezeri.
- source_word: חֹבֵט חִטִּים
  choice: alikuwa akipiga ngano
  rationale: חבט hueleza kuitoa nafaka kwa kuipiga. Tafsiri hii huhifadhi tendo halisi kuliko neno pana ‘kupura,’ bila kuongeza kifaa kisichotajwa.
- source_word: בַּגַּת
  choice: ndani ya shinikizo la divai
  rationale: Kihusishi na nomino vinaonyesha kwamba Gideoni alikuwa ndani ya mahali pa kukamulia zabibu, mazingira yasiyo ya kawaida yaliyomsaidia kujisitiri.
- source_word: לְהָנִיס מִפְּנֵי מִדְיָן
  choice: ili kuificha isionekane na Wamidiani
  rationale: Kitenzi katika kausativi kina wazo la kuiondoa au kuipeleka mbali na hatari. Katika muktadha, lengo lilikuwa kuzuia ngano isionekane na kuchukuliwa na adui; Kiswahili hiki kinaeleza kusudi hilo kwa kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya מַלְאַךְ יְהוָה na utambulisho wa mhusika
  choice: malaika wa Yahweh
  alternative: mjumbe wa Yahweh
  rationale: Muktadha unaonyesha mjumbe wa mbinguni, lakini tafsiri haiongezi hitimisho la baadaye kuhusu utambulisho wake wa kiungu, hivyo inadumisha mvutano wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. Majina yametoholewa kuwa Ofra, Yoashi, Abiezeri na Gideoni. Sentensi mbili zimetumiwa ili kuepuka mzigo wa vishazi vingi bila kupoteza uhusiano wa matukio.
