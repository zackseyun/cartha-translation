base_translation:
  language: en
  yaml_path: translation/ot/judges/006/039.yaml
  text: 'Then Gideon said to God[a], “Do not let your anger burn against me, and let me speak just this once. Please let me test just this once with the fleece: let there be dryness on the fleece alone[c][b], and on all the ground let there be dew.”'
translation:
  language: sw
  text: 'Kisha Gideoni akamwambia Mungu, “Hasira yako isinichome, nami niseme mara hii moja tu. Tafadhali nijaribu kwa manyoya ya kondoo mara hii moja tu: manyoya hayo peke yake yawe makavu, na umande uwe juu ya ardhi yote.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל יִחַר אַפְּךָ בִּי
  choice: Hasira yako isinichomee
  rationale: Inahifadhi sitiari ya Kiebrania ya hasira inayowaka, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: וַאֲדַבְּרָה אַךְ הַפָּעַם
  choice: nami naomba niseme mara hii moja tu
  rationale: Muundo wa ombi unaonyesha unyenyekevu wa Gideoni, huku kirai cha ukomo kikihifadhiwa.
- source_word: אֲנַסֶּה נָּא רַק הַפַּעַם
  choice: Tafadhali niruhusu nijaribu ... mara hii moja tu
  rationale: נסה hapa ni kujaribu au kupima; tafsiri haifichi kwamba Gideoni anaomba jaribio jingine, wala haiongezi hukumu juu yake.
- source_word: בַּגִּזָּה
  choice: kwa ngozi hii ya kondoo
  rationale: גִּזָּה ni manyoya yaliyokatwa au ngozi yenye manyoya; katika muktadha wa ishara hii, 'ngozi ya kondoo' ni usemi unaoeleweka kwa urahisi, na 'kwa' huonyesha kitu kinachotumiwa katika jaribio.
- source_word: יְהִי נָא חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  choice: ngozi hii peke yake iwe kavu
  rationale: חֹרֶב hapa ni ukavu, si ukame mpana; usemi huu wa asili unaeleza matokeo yaliyokusudiwa bila uzito usio wa lazima.
- source_word: וְעַל כָּל הָאָרֶץ יִהְיֶה טָּל
  choice: lakini umande uwe juu ya ardhi yote inayoizunguka
  rationale: הָאָרֶץ hapa ni ardhi ya eneo karibu na ngozi, si dunia nzima; 'inayoizunguka' huweka wazi maana ya kimuktadha bila kubadili kiini.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Katika hotuba hii neno linamrejelea Mungu; Kiswahili hakihitaji kibainishi kinacholingana na makala ya Kiebrania.
theological_decisions:
- issue: Ombi la Gideoni la kumjaribu Mungu tena
  choice: Limetafsiriwa kama ombi la tahadhari la ishara moja zaidi, huku tendo lenyewe likiitwa 'kujaribu'.
  alternative: Kulifanya lionekane wazi kuwa ni kosa la kiburi, au kulilainisha kuwa ombi lisilo na kipengele cha kujaribu.
  rationale: Kiebrania kinaonyesha hofu ya hasira ya Mungu na ombi la jaribio jingine. Tafsiri inadumisha mvutano huo bila kuongeza kibali au lawama ambazo aya haisemi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa msomaji wa kawaida. Kurudiwa kwa 'mara hii moja tu' kumehifadhiwa kwa kuwa kunasisitiza ukomo wa ombi la Gideoni.
