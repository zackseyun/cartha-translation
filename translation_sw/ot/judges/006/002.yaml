base_translation:
  language: en
  yaml_path: translation/ot/judges/006/002.yaml
  text: And the hand of Midian prevailed against Israel[a]. Because of Midian, the sons of Israel made for themselves the dens that are in the mountains, and the caves[b], and the strongholds.
translation:
  language: sw
  text: Mkono wa Midiani ukawa na nguvu juu ya Israeli.[a] Kwa sababu ya Midiani, wana wa Israeli wakajitengenezea maficho yaliyo milimani,[b] mapango, na ngome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhidi ya Israeli.”
    reason: Kihusishi cha Kiebrania kinaweza kuonyesha nguvu iliyokuwa juu ya Israeli au iliyotumiwa dhidi yao.
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “maficho” ni adimu; pia limetafsiriwa “mashimo” au “mapango madogo.”
    reason: Huhifadhi kutokuwa na uhakika kwa maana ya neno הַמִּנְהָרוֹת.
lexical_decisions:
- source_word: וַתָּעָז
  choice: ukawa na nguvu
  rationale: Huwasilisha wazo la mkono wa Midiani kuwa wenye nguvu na kutawala, huku ukihifadhi muundo na picha ya Kiebrania.
- source_word: יַד מִדְיָן
  choice: Mkono wa Midiani
  rationale: Hifadhi sitiari ya Kiebrania ya ‘mkono’ inayomaanisha nguvu au mamlaka; inaeleweka pia katika Kiswahili cha kibiblia.
- source_word: עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: Katika muktadha huu huonyesha mamlaka ya kukandamiza bila kuondoa kabisa uwezekano wa maana ya ‘dhidi ya’.
- source_word: מִפְּנֵי מִדְיָן
  choice: Kwa sababu ya Midiani
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba tishio la Midiani ndilo lililosababisha hatua yao.
- source_word: עָשׂוּ לָהֶם
  choice: wakajitengenezea
  rationale: Huwasilisha kitenzi pamoja na maana ya kujifanyia au kujiandalia mahali pa kujisitiri.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hufuata kwa karibu umbo la Kiebrania, huku ‘Waisraeli’ likitajwa kama namna ya kawaida zaidi katika tanbihi.
- source_word: הַמִּנְהָרוֹת
  choice: maficho
  rationale: Neno hili adimu huenda linamaanisha mashimo, mapango madogo, au sehemu za kujificha; ‘maficho’ linafaa katika muktadha na halirudii tu ‘mapango’ yanayofuata.
- source_word: אֲשֶׁר בֶּהָרִים
  choice: yaliyokuwa milimani
  rationale: Huhifadhi kishazi cha mahali badala ya kukifupisha kuwa kivumishi.
- source_word: הַמְּעָרוֹת
  choice: mapango
  rationale: Tafsiri ya kawaida na iliyo wazi ya sehemu za asili zilizo wazi ndani ya miamba au milima.
- source_word: הַמְּצָדוֹת
  choice: ngome
  rationale: Huwasilisha maeneo salama, yenye ulinzi au yaliyoimarishwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unahifadhi sitiari ya ‘mkono’ na kishazi halisi cha mahali, lakini hutumia ‘maficho’ ili kutofautisha neno adimu na ‘mapango’ yanayofuata.
