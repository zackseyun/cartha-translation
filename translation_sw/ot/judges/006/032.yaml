base_translation:
  language: en
  yaml_path: translation/ot/judges/006/032.yaml
  text: So on that day he called him Jerubbaal[a], saying, “Let Baal contend against him[b], because he tore down his altar.”
translation:
  language: sw
  text: Basi siku hiyo akamwita Yerubaali[a], akisema, “Baali na ashindane naye[b], kwa sababu ameibomoa madhabahu yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Yerubaali linafanana na muundo unaotokana na kitenzi cha Kiebrania kinachomaanisha “kushindana” au “kuingia katika shauri”; maelezo yake ni, “Baali na ashindane naye.”
    reason: lexical_alternative
  - marker: b
    text: 'Au “Baali na apambane naye.” Kitenzi cha Kiebrania kinaweza kueleweka kama ombi au matakwa; wengine hukielewa kama taarifa: “Baali atashindana naye.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: akamwita
  rationale: Muundo קרא ל־ unaweza kumaanisha kumwita au kumpa mtu jina. “Akamwita” ni wa kawaida katika simulizi la Kiswahili na unaacha mtendaji akiwa katika umoja kama ilivyo katika Kiebrania.
- source_word: בַיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Ni usemi wa kawaida na wa moja kwa moja wa wakati katika Kiswahili.
- source_word: יְרֻבַּעַל
  choice: Yerubaali
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili; mchezo wake wa maneno na kitenzi ריב unaelezwa na kauli inayofuata na tanbihi.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hutambulisha maneno yanayoeleza sababu ya jina katika mtiririko wa kawaida wa simulizi.
- source_word: יָרֶב בּוֹ הַבַּעַל
  choice: Baali na ashindane naye
  rationale: “Na ashindane” huwasilisha vizuri maana ya ombi au ruhusa ya kijusivu. “Naye” huhifadhi kiwakilishi cha Kiebrania, huku “ashindane” ikibeba maana pana ya kupingana au kuingia katika shauri.
- source_word: כִּי
  choice: kwa sababu
  rationale: Huonyesha wazi sababu ya kauli na ya jina hilo.
- source_word: נָתַץ
  choice: ameibomoa
  rationale: נתץ humaanisha kubomoa au kuangusha jengo au madhabahu. Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye umuhimu kwa kauli hii.
- source_word: אֶת מִזְבְּחוֹ
  choice: madhabahu yake
  rationale: Kiwakilishi cha umoja wa kiume kimehifadhiwa; katika muktadha kinamrejelea Baali.
theological_decisions:
- issue: Maana ya בַּעַל katika muktadha wa mabishano dhidi ya ibada ya sanamu
  choice: Baali
  alternative: bwana
  rationale: Hapa neno hilo ni jina au cheo cha mungu wa Wakanaani, si nomino ya kawaida inayomaanisha bwana. “Baali” huzuia kuchanganywa na BWANA.
- issue: Nguvu ya kitenzi יָרֶב
  choice: Baali na ashindane naye
  alternative: Baali atashindana naye
  rationale: Umbo la Kiebrania linaweza kusikika kama ombi la kijusivu, ingawa usomaji wa taarifa ya wakati ujao unawezekana. Tafsiri kuu inahifadhi kijusivu, na tanbihi inaonyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Jina “Yerubaali” limetoholewa kwa mfumo wa sauti wa Kiswahili. Muundo “na ashindane” umetumiwa kuhifadhi nguvu ya kijusivu bila kuondoa utata wa Kiebrania.
