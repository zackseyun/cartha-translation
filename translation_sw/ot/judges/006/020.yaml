base_translation:
  language: en
  yaml_path: translation/ot/judges/006/020.yaml
  text: Then the angel of God said to him[a], “Take the meat and the unleavened bread, and set them on this rock, and pour out the broth.” And he did so.
translation:
  language: sw
  text: Kisha malaika wa Mungu akamwambia[a], “Chukua nyama na mikate isiyotiwa chachu, uviweke juu ya mwamba huu, kisha umimine mchuzi.” Naye akafanya hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mjumbe wa Mungu.” Neno la Kiebrania linaweza kumaanisha mjumbe wa kibinadamu au malaika; hapa muktadha unaelekeza kwa mjumbe asiye wa kawaida kutoka kwa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: malaika wa Mungu
  rationale: מַלְאַךְ inaweza kumaanisha mjumbe wa kibinadamu au wa mbinguni; katika muktadha huu simulizi linaonyesha kuwa huyu ni mjumbe wa Mungu asiye wa kawaida, hivyo “malaika” ni tafsiri ya kawaida na inayofaa.
- source_word: קַח
  choice: Chukua
  rationale: Amri ya לקח ina maana ya moja kwa moja ya kuchukua; “leta” ingeongeza wazo la mwelekeo ambalo halijaelezwa wazi katika kitenzi.
- source_word: הַבָּשָׂר
  choice: nyama
  rationale: Ingawa בָּשָׂר inaweza kumaanisha mwili au nyama, hapa inatajwa kama chakula, hivyo “nyama” ndiyo tafsiri ya asili.
- source_word: הַמַּצּוֹת
  choice: mikate isiyotiwa chachu
  rationale: מַצּוֹת ni wingi wa vitu vya mkate vilivyookwa bila chachu; tafsiri hii inaweka wazi maana na kudumisha wingi.
- source_word: וְהַנַּח
  choice: uviweke
  rationale: Hiphil ya נוח hapa ina maana ya kuweka chini au mahali fulani. Kiambishi “vi-” kinarejelea kwa pamoja nyama na mikate kwa Kiswahili cha kawaida.
- source_word: אֶל־הַסֶּלַע הַלָּז
  choice: juu ya mwamba huu
  rationale: סֶלַע ni mwamba; pamoja na kitenzi cha kuweka, “juu ya” huonyesha kwa kawaida mahali panapokusudiwa, na הַלָּז hapa ni kiashiria “huu.”
- source_word: הַמָּרַק
  choice: mchuzi
  rationale: מָרָק ni majimaji ya kupikia au mchuzi; “mchuzi” ni neno la kawaida na linaloeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: שְׁפֹוךְ
  choice: umimine
  rationale: Amri ya שפך ina maana ya kumwaga au kumimina. “Mimina” inafaa kwa mchuzi na hudokeza kuutoa kwenye chombo bila kuongeza mahali ambapo haukutajwa wazi.
- source_word: וַיַּעַשׂ כֵּן
  choice: Naye akafanya hivyo
  rationale: Hii ni nahau fupi inayoonyesha kuwa Gideoni alitekeleza agizo; tafsiri hii ni ya asili na inadumisha ufupi wake.
theological_decisions:
- issue: Tafsiri ya מַלְאַךְ katika muktadha wa mjumbe wa kimungu
  choice: malaika wa Mungu
  alternative: mjumbe wa Mungu
  rationale: Neno la Kiebrania linaweza kuwa mjumbe wa kibinadamu au malaika, lakini katika Waamuzi 6 mhusika anaonyeshwa kuwa mjumbe wa Mungu asiye wa kawaida. “Malaika” linafaa katika matini, huku tanbihi ikihifadhi uwezekano wa kimsamiati bila kuamua zaidi utambulisho wake wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ni mfupi na wa moja kwa moja; “mikate isiyotiwa chachu” ni wazi kuliko istilahi ya kukopa, na “mchuzi” ni ya kawaida bila kuwa ya mazungumzo kupita kiasi.
