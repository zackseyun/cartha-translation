source:
  edition: WLC
  text: וַ/יְהִי֮ בַּ/לַּ֣יְלָה הַ/הוּא֒ וַ/יֹּ֧אמֶר ל֣/וֹ יְהוָ֗ה קַ֤ח אֶת פַּר הַ/שּׁוֹר֙ אֲשֶׁ֣ר לְ/אָבִ֔י/ךָ וּ/פַ֥ר הַ/שֵּׁנִ֖י שֶׁ֣בַע שָׁנִ֑ים וְ/הָרַסְתָּ֗ אֶת מִזְבַּ֤ח הַ/בַּ֨עַל֙ אֲשֶׁ֣ר לְ/אָבִ֔י/ךָ וְ/אֶת הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָ֖י/ו תִּכְרֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/025.yaml
  text: And it happened that night that Yahweh said to him[a], “Take your father’s bull and the second bull, seven years old, and tear down the altar of Baal that belongs to your father[b], and cut down the Asherah that is upon it.”
translation:
  language: sw
  text: Ikawa usiku huo, Yahwe akamwambia, “Chukua fahali wa baba yako na fahali wa pili, wa miaka saba; ubomoe madhabahu ya Baali iliyo ya baba yako, na ukate Ashera[a] iliyo juu yake[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nguzo ya Ashera” au “nguzo takatifu.” Neno la Kiebrania linaweza kumaanisha kitu cha ibada kilichohusishwa na Ashera.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “juu yake.” Maneno hayo yanaweza kumaanisha kwamba Ashera ilikuwa juu ya madhabahu, au katika uhusiano wa karibu nayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: Ikawa usiku huo
  rationale: Inahifadhi mpito wa kisimulizi wa Kiebrania kwa Kiswahili cha kawaida na chenye hadhi, bila kutumia mtindo wa kizamani kupita kiasi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa jina binafsi la Mungu YHWH, badala ya kulibadilisha kuwa cheo.
- source_word: קַח
  choice: Chukua
  rationale: Inatoa moja kwa moja amri ya Kiebrania.
- source_word: פַּר הַשּׁוֹר אֲשֶׁר לְאָבִיךָ
  choice: fahali wa baba yako
  rationale: Ni Kiswahili asilia kinachoonyesha mnyama wa kiume anayemilikiwa na baba yake Gideoni.
- source_word: וּפַר הַשֵּׁנִי שֶׁבַע שָׁנִים
  choice: na fahali wa pili, mwenye umri wa miaka saba
  rationale: Kiunganishi וּ kimedumishwa kama ‘na,’ hivyo matini haijafanywa kana kwamba inamtaja fahali mmoja tu; umri wake umetolewa wazi.
- source_word: וְהָרַסְתָּ
  choice: Bomoa
  rationale: Kitenzi hiki ni cha kawaida na chenye nguvu kwa kuangusha kabisa madhabahu.
- source_word: מִזְבַּח הַבַּעַל
  choice: madhabahu ya Baali
  rationale: Inahifadhi uhusiano wa nomino hizo na kutumia umbo la jina Baal linalosomeka kwa kawaida katika Kiswahili.
- source_word: הָאֲשֵׁרָה
  choice: Ashera
  rationale: Unukuzi huu hauamui kimya-kimya ikiwa neno hilo linamaanisha nguzo, mti, au kifaa kingine cha ibada kilichohusishwa na Ashera.
- source_word: אֲשֶׁר עָלָיו
  choice: iliyo juu yake
  rationale: Inafuata maana ya msingi ya עַל kwa ukaribu huku ikihifadhi kutokuwa wazi kabisa kwa mahali au uhusiano wa kifaa hicho na madhabahu.
- source_word: תִּכְרֹת
  choice: ukate
  rationale: Inafaa kwa kukata na kuondoa kifaa cha ibada ambacho kinaweza kuwa cha mbao, bila kuongeza maelezo yasiyosemwa wazi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia jina binafsi kunatofautisha YHWH na cheo cha kawaida ‘Bwana’ na kufuata ushahidi wa matini ya Kiebrania.
- issue: Maana ya הָאֲשֵׁרָה
  choice: Ashera
  alternative: nguzo ya Ashera / nguzo takatifu
  rationale: Neno la Kiebrania linaweza kutaja kitu cha ibada kinachohusishwa na mungu wa kike Ashera, lakini aina yake hasa si hakika; unukuzi unahifadhi utata huo.
- issue: Idadi na uhusiano wa mafahali
  choice: fahali wa baba yako na fahali wa pili
  alternative: fahali wa baba yako, yaani fahali wa pili
  rationale: Kiunganishi cha Kiebrania kinaweza kueleweka kuwa kinataja fahali mwingine; tafsiri kuu inahifadhi muundo huo badala ya kuufanya kwa lazima kuwa maelezo ya fahali yuleyule.
- issue: Mahali pa Ashera ביחס na madhabahu
  choice: iliyo juu yake
  alternative: iliyo kando yake
  rationale: עָלָיו kwa msingi ni ‘juu yake,’ ingawa katika muktadha inaweza kuonyesha ukaribu au uhusiano wa karibu; tanbihi inadumisha uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kisimulizi, wa sasa, wenye hadhi, na unaoeleweka kwa wasomaji wa kawaida. ‘Ikawa’ inadumisha ladha ya simulizi bila kuwa nzito. Sentensi ya amri imegawanywa ili isomeke kwa urahisi. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
