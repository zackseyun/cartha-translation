id: JDG.6.1
reference: Judges 6:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֧וּ בְנֵי יִשְׂרָאֵ֛ל הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד מִדְיָ֖ן שֶׁ֥בַע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/001.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and Yahweh gave them into the hand of Midian for seven years.
translation:
  language: sw
  text: Wana wa Israeli[a] wakafanya yaliyo maovu machoni pa Yahwe[b], naye Yahwe akawatia mkononi mwa Midiani[c] kwa miaka saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yaani, “Waisraeli” au “watu wa Israeli.” Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
  - marker: b
    text: Au “mbele za Yahwe”; ni usemi unaoonyesha tathmini au hukumu ya Yahwe.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “katika mkono wa Midiani,” nahau inayomaanisha kuwa chini ya nguvu au mamlaka ya Midiani.'
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Huhifadhi kwa ukaribu usemi wa Kiebrania ‘wana wa Israeli,’ ambao hapa unalitaja taifa kwa ujumla; ‘Waisraeli’ ni tafsiri mbadala ya kawaida zaidi.
- source_word: הָרַע
  choice: yaliyo maovu
  rationale: Katika muundo wenye kitenzi עשה, usemi huu humaanisha kufanya jambo lililo ovu. Tafsiri hii inadumisha uzito wa hukumu ya kimaadili.
- source_word: בְעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Huhifadhi taswira ya nahau ya Kiebrania inayomaanisha kwamba jambo hilo lilikuwa ovu kwa tathmini ya Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uhawilishaji wa jina la Mungu יהוה badala ya kulibadilisha kuwa cheo kama ‘Bwana.’
- source_word: וַיִּתְּנֵם
  choice: akawatia
  rationale: Pamoja na usemi unaofuata ‘mkononi mwa,’ kitenzi hiki huonyesha kuwakabidhi chini ya mamlaka ya mwingine; ‘akawatia’ ni cha asili katika Kiswahili na huhifadhi muundo huo.
- source_word: בְּיַד מִדְיָן
  choice: mkononi mwa Midiani
  rationale: Huhifadhi nahau ya Kiebrania ya ‘mkono’ kama ishara ya nguvu, mamlaka, au udhibiti.
- source_word: מִדְיָן
  choice: Midiani
  rationale: Jina hili limehawilishwa kwa umbo linalotambulika katika matumizi ya Biblia ya Kiswahili; katika muktadha huu linawakilisha Midiani kama nguvu ya pamoja.
- source_word: שֶׁבַע שָׁנִים
  choice: kwa miaka saba
  rationale: ‘Kwa’ huonyesha kwa kawaida muda uliodumu hali hiyo katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Utambulisho wa pamoja בְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  alternative: Waisraeli
  rationale: Tafsiri iliyochaguliwa inafuata umbo la Kiebrania huku ikirejelea taifa lote; tanbihi inaweka wazi maana yake ya pamoja bila kuifanya iwe rejeo la wanaume pekee.
- issue: Yahwe kuwakabidhi Israeli chini ya Midiani
  choice: Yahwe akawatia mkononi mwa Midiani
  alternative: Yahwe akawatia chini ya mamlaka ya Midiani
  rationale: Muundo huu unadumisha kauli ya moja kwa moja ya maandishi kwamba Yahwe ndiye aliyewaweka chini ya mamlaka ya Midiani, bila kupunguza mvutano wa kiteolojia wa kitendo hicho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ‘wakafanya … naye … akawatia’ unaendeleza mwendo wa Kiebrania bila kuwa mzito. Jina ‘Yahwe’ limehifadhiwa, na nahau ‘mkononi mwa’ imeachwa katika matini kwa kuwa ni wazi katika Kiswahili, huku maana yake ikifafanuliwa katika tanbihi.
