  yaml_path: translation/ot/judges/006/006.yaml
  text: So Israel became very poor because of Midian[c][b][a], and the sons of Israel cried out to Yahweh.
translation:
  language: sw
  text: Israeli ikadhoofika sana kwa sababu ya Midiani[a], nao wana wa Israeli wakamlilia Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ilishushwa sana” au “ikawa maskini sana.” Kitenzi cha Kiebrania kinaweza kumaanisha kudhoofika, kufanywa duni, au kuwa maskini chini ya ukandamizaji.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania YHWH; kwa desturi hutafsiriwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּדַּל
  choice: ilidhoofika
  rationale: Kitenzi דל kinaonyesha kushushwa hali, kudhoofishwa, au kupungukiwa. Katika muktadha wa ukandamizaji wa Midiani, “ilidhoofika” huhifadhi upana huo bila kuifanya hali hiyo kuwa umaskini wa kiuchumi pekee.
- source_word: מְאֹד
  choice: sana
  rationale: Ni kielezi cha kusisitiza kiwango; “sana” ni Kiswahili cha kawaida na cha asili.
- source_word: מִפְּנֵי
  choice: kwa sababu ya
  rationale: Katika muktadha huu, kihusishi kinaonyesha sababu ya Israeli kudhoofika.
- source_word: מִדְיָן
  choice: Midiani
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la watu na eneo la Midiani.
- source_word: וַיִּזְעֲקוּ
  choice: wakamlilia
  rationale: זעק huonyesha kilio cha dhiki kinachoelekezwa kwa mtu ili kupata msaada. “Wakamlilia” ni ya asili na huhifadhi uzito wa kilio hicho.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi umbo la Kiebrania, yaani “wana wa Israeli,” ambalo hapa linawataja kwa pamoja watu wa agano.
- source_word: אֶל יְהוָה
  choice: Yahweh
  rationale: אֶל huonyesha anayeelekezewa kilio, na jina la agano יהוה limetoholewa kuwa “Yahweh.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Jinsi ya kutafsiri בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: “Wana wa Israeli” hufuata kwa karibu umbo la Kiebrania na bado linaeleweka kama jina la pamoja la watu wa Israeli.
