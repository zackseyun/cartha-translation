base_translation:
  language: en
  yaml_path: translation/ot/judges/006/033.yaml
  text: Then all Midian and Amalek and the people of the East gathered together[a], crossed over, and camped in the Valley of Jezreel.
translation:
  language: sw
  text: Ndipo Wamidiani wote, Waamaleki, na watu wa mashariki[a] wakakusanyika pamoja, wakavuka, na kupiga kambi katika Bonde la Yezreeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “wana wa mashariki,” nahau inayomaanisha watu wa mashariki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל מִדְיָן
  choice: Wamidiani wote
  rationale: Jina la taifa linatumika kwa maana ya jumla. Kiswahili cha kawaida huhitaji umbo la jina la watu, hivyo “Wamidiani wote” ni la asili na linaonyesha maana ya “Midiani yote” bila kudokeza lazima kila mtu mmoja mmoja.
- source_word: וַ/עֲמָלֵק
  choice: Waamaleki
  rationale: “Amaleki” limetumika kwa maana ya kundi la watu; “Waamaleki” ni umbo la kawaida na linaloeleweka katika Kiswahili.
- source_word: וּ/בְנֵי קֶדֶם
  choice: watu wa Mashariki
  rationale: Kwa neno ni “wana wa mashariki,” lakini ni nahau inayomaanisha watu au makabila ya mashariki. Tafsiri hii ni ya asili huku maana ya kijiografia na kikundi ikihifadhiwa.
- source_word: נֶאֶסְפוּ יַחְדָּו
  choice: wakakusanyika pamoja
  rationale: Kitenzi cha Kiebrania hapa kinaonyesha kukusanyika, na יחדו kinasisitiza kuwa walifanya hivyo pamoja.
- source_word: וַ/יַּעַבְרוּ
  choice: wakavuka
  rationale: Kitenzi עבר humaanisha kuvuka au kupita. Kitu walichovuka hakijatajwa katika chanzo, kwa hiyo hakijaongezwa.
- source_word: וַֽ/יַּחֲנוּ
  choice: kupiga kambi
  rationale: Ni usemi wa kawaida wa Kiswahili kwa חנה katika muktadha wa jeshi au kundi linalosafiri.
- source_word: בְּ/עֵמֶק יִזְרְעֶאל
  choice: katika Bonde la Yezreeli
  rationale: עמק inaweza kuwa bonde au uwanda mpana wa chini; “Bonde la Yezreeli” ni jina la mahali linaloeleweka na linahifadhi taswira ya chanzo.
