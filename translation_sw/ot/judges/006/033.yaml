translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfululizo wa vitenzi wenye kiambishi “waka-” umehifadhi mwendo wa simulizi la Kiebrania. Majina ya makundi yamewekwa katika maumbo ya kawaida ya Kiswahili.
