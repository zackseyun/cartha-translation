  text: וַ/יִּקַּ֨ח גִּדְע֜וֹן עֲשָׂרָ֤ה אֲנָשִׁים֙ מֵֽ/עֲבָדָ֔י/ו וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֵלָ֖י/ו יְהוָ֑ה וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר יָרֵא֩ אֶת בֵּ֨ית אָבִ֜י/ו וְ/אֶת אַנְשֵׁ֥י הָ/עִ֛יר מֵ/עֲשׂ֥וֹת יוֹמָ֖ם וַ/יַּ֥עַשׂ לָֽיְלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/027.yaml
  text: So Gideon took ten men from among his servants and did as Yahweh had spoken to him. But because he feared his father's household and the men of the city too much to do it by day[a], he did it at night.
translation:
  language: sw
  text: Basi Gideoni akachukua wanaume kumi miongoni mwa watumishi wake, akafanya kama Yahweh alivyomwambia. Lakini kwa kuwa aliogopa jamaa ya baba yake na wanaume wa mjini, hakufanya hivyo mchana[a], bali alifanya usiku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi, “asifanye hivyo mchana”; maana yake ni kwamba hofu yake ilimzuia kufanya hivyo wakati wa mchana.
    reason: Muundo wa Kiebrania una kihusishi pamoja na kitenzi-jina baada ya “aliogopa”; unaonyesha kwamba hofu ilimzuia kutenda mchana.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akachukua
  rationale: Kitenzi לקח katika simulizi kina maana ya kawaida ya ‘kuchukua’; ‘akachukua’ ni tafsiri ya moja kwa moja na ya asili katika Kiswahili.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: wanaume kumi
  rationale: Kiebrania kinataja wanaume waziwazi, hivyo jinsia ya nomino imehifadhiwa.
- source_word: מֵעֲבָדָיו
  choice: miongoni mwa watumishi wake
  rationale: עֶבֶד inaweza kumaanisha mtumishi au mtumwa. Muktadha hautilii mkazo hali ya utumwa; ‘watumishi’ inafaa, na ‘miongoni mwa’ linaonyesha maana ya kuchagua sehemu kutoka katika kundi.
- source_word: וַיַּעַשׂ כַּאֲשֶׁר דִּבֶּר אֵלָיו יְהוָה
  choice: akafanya kama Yahwe alivyomwambia
  rationale: Tafsiri hii inaonyesha ulinganifu kati ya agizo la Mungu na tendo la Gideoni kwa Kiswahili cha kawaida.
- source_word: בֵּית אָבִיו
  choice: jamaa ya baba yake
  rationale: בַּיִת hapa ni kundi la kifamilia la baba, si jengo tu. ‘Jamaa’ ni ya asili na pana kuliko familia ya nyuklia.
- source_word: אַנְשֵׁי הָעִיר
  choice: wanaume wa mjini
  rationale: Kiebrania kinataja wanaume wa mji, si wakazi wote kwa ujumla; ‘wa mjini’ ni usemi wa kawaida wa Kiswahili.
- source_word: מֵעֲשׂוֹת יוֹמָם
  choice: hakufanya hivyo mchana
  rationale: Baada ya kitenzi cha kuogopa, muundo wa מִן pamoja na kitenzi-jina unaonyesha kwamba hofu ilimzuia kufanya jambo hilo mchana. Tafsiri kuu inaeleza matokeo hayo kwa lugha ya kawaida, huku tanbihi ikihifadhi muundo wa karibu zaidi.
- source_word: וַיַּעַשׂ לָיְלָה
  choice: bali alifanya usiku
  rationale: ‘Bali’ linaweka wazi utofauti uliopo kati ya mchana na usiku bila kuongeza wazo jipya.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu, tetragramatoni, si cheo. ‘Yahwe’ ni umbo la Kiswahili linalotambulika na linalohifadhi jina hilo badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Jamaa ya baba yake’ linaeleza kaya au ukoo wa baba bila kuifanya kuwa nyumba ya kujengwa. Sentensi imeweka wazi uhusiano wa sababu na matokeo huku tanbihi ikihifadhi ukaribu na muundo wa Kiebrania.
