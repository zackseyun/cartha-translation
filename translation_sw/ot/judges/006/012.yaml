  yaml_path: translation/ot/judges/006/012.yaml
  text: Then the angel of Yahweh appeared to him and said to him[a], “Yahweh is with you[b], mighty warrior.”
translation:
  language: sw
  text: Ndipo malaika wa Yahweh[a] akamtokea na kumwambia, “Yahweh yuko pamoja nawe, ewe shujaa hodari[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mjumbe wa Yahweh.” Neno la Kiebrania linaweza kumaanisha “mjumbe” au “malaika,” ingawa “malaika” linafaa zaidi katika tukio hili la kuonekana.
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri ya kimapokeo: “mwanamume shujaa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: akamtokea
  rationale: Kauli ya Kiebrania hapa inaeleza kujidhihirisha au kuonekana kwa mhusika; “akamtokea” ni ya kawaida na ya asili katika masimulizi ya Kiswahili kuhusu kutokea kwa malaika.
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: מַלְאָךְ inaweza kumaanisha “mjumbe” au “malaika”; katika tukio hili la kuonekana kwa kiumbe wa mbinguni, “malaika” inafaa zaidi, huku tanbihi ikihifadhi maana nyingine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: na kumwambia
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida kiwakilishi cha Kiebrania “akamwambia yeye” bila kuongeza jina la Gideoni ambalo halimo katika mstari huu.
- source_word: יְהוָה עִמְּךָ
  choice: Yahweh yuko pamoja nawe
  rationale: Kishazi kisicho na kitenzi kinaeleweka vizuri katika muktadha kama taarifa ya hali ya sasa, si ombi au salamu ya kutakia.
- source_word: גִּבּוֹר הֶחָיִל
  choice: ewe shujaa hodari
  rationale: Kirai hiki humaanisha mtu mwenye nguvu, ushujaa na uwezo wa kupigana. “Shujaa hodari” ni Kiswahili cha sasa na huhifadhi uzito wake wa kijeshi; “ewe” huonyesha wazi kwamba ni namna ya kumwita anayesemeshwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Utambulisho wa מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  alternative: mjumbe wa Yahweh
  rationale: Tafsiri inahifadhi usemi wa Kiebrania bila kumtambulisha mhusika huyo kwa fundisho maalumu zaidi. Maana mbadala ya “mjumbe” imewekwa katika tanbihi.
- issue: Nguvu ya יְהוָה עִמְּךָ
  choice: 'taarifa: “Yahweh yuko pamoja nawe”'
  alternative: 'takio: “Yahweh awe pamoja nawe”'
  rationale: Muktadha unaunga mkono tamko la kuwapo kwa Yahweh pamoja na Gideoni, lakini muundo wa Kiebrania wenyewe hauna kitenzi kilichoandikwa. Tafsiri imechagua usomaji wa taarifa unaofaa zaidi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “akamtokea” na “kumwambia” ni wa kawaida katika simulizi; “ewe shujaa hodari” ni wazi kwa wasomaji wa kawaida huku ukidumisha nguvu ya usemi wa Kiebrania.
