  yaml_path: translation/ot/judges/006/014.yaml
  text: Then Yahweh turned to him and said[a], “Go in this strength of yours and save Israel from the hand of Midian[b]. Have I not sent you?”
translation:
  language: sw
  text: Ndipo Yahwe akamgeukia, akasema, “Nenda kwa nguvu zako hizi[a], ukawaokoe Israeli kutoka mkononi mwa Midiani[b]. Je, sikukutuma?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika nguvu zako hizi.” Kirai cha Kiebrania kinaweza kueleweka kwa maana ya njia inayotumiwa au ya hali/mazingira; neno “hizi” huongeza msisitizo.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kutoka mkononi mwa Midiani,” nahau inayomaanisha kuokolewa kutoka katika mamlaka au udhibiti wa Midiani.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: וַיִּפֶן אֵלָיו
  choice: akamgeukia
  rationale: Huhifadhi tendo la kuelekea kwake na ni usemi wa asili katika masimulizi ya Kiswahili.
- source_word: לֵךְ
  choice: Nenda
  rationale: Amri ya moja kwa moja inayohifadhi nguvu ya kutumwa.
- source_word: בְּכֹחֲךָ זֶה
  choice: kwa nguvu zako hizi
  rationale: Huhifadhi kiambishi kinachoweza kuonyesha njia au hali pamoja na msisitizo wa demonstrativi זֶה; wingi wa kisarufi 'nguvu zako hizi' ni wa kawaida kwa Kiswahili.
- source_word: וְהוֹשַׁעְתָּ
  choice: ukawaokoe
  rationale: Muundo huu unaendeleza amri iliyotangulia kwa kusudi au matokeo, bila kuufanya kuwa utabiri wa lazima.
- source_word: מִכַּף מִדְיָן
  choice: kutoka mkononi mwa Midiani
  rationale: Huhifadhi taswira ya Kiebrania ya mkono kama mamlaka au udhibiti huku ikibaki kueleweka kwa Kiswahili.
- source_word: הֲלֹא שְׁלַחְתִּיךָ
  choice: Je, si mimi niliyekutuma?
  rationale: Huhifadhi swali la balagha linalotarajia jibu la kukubali na kusisitiza mtumaji.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina la pekee la Mungu; 'Yahwe' hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Nguvu inayotajwa katika agizo
  choice: kwa nguvu zako hizi
  alternative: kwa nguvu hizi ulizo nazo
  rationale: Tafsiri haibainishi zaidi ya andiko chanzo kama nguvu hizo ni uwezo wa Gideoni peke yake au nguvu inayotokana na utume wa Mungu; mvutano huo unaachwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa sasa. 'Ndipo ... aka-' hudumisha mfululizo wa masimulizi; 'Midiani' na 'Israeli' ni maumbo yaliyozoeleka katika Kiswahili cha Biblia. Kialama [a] kimewekwa baada ya 'kusema' ili kufuata data ya mashauriano, ingawa maelezo yake yanahusu kirai kinachofuata.
