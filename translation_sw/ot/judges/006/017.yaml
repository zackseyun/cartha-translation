  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו אִם נָ֛א מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ וְ/עָשִׂ֤יתָ לִּ/י֙ א֔וֹת שָׁ/אַתָּ֖ה מְדַבֵּ֥ר עִמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/017.yaml
  text: And he said to him, “If now I have found favor in your eyes, then give me a sign that you are the one speaking with me.”
translation:
  language: sw
  text: Naye akamwambia, “Ikiwa kweli nimepata kibali machoni pako, basi nipe ishara kwamba ni wewe unayesema nami.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: nimepata kibali machoni pako
  rationale: Nahau ya Kiebrania imehifadhiwa kwa Kiswahili cha kibiblia kinachoeleweka, ikimaanisha kukubaliwa au kuonyeshwa fadhili.
- source_word: וְעָשִׂיתָ לִּי אוֹת
  choice: basi nipe ishara
  rationale: Ingawa kitenzi ni ‘kufanya,’ muungano wake na אוֹת kwa kawaida humaanisha kutoa au kufanya ishara; ‘nipe ishara’ ni Kiswahili cha kawaida na sahihi katika muktadha.
- source_word: שָׁאַתָּה מְדַבֵּר עִמִּי
  choice: kwamba ni wewe unayesema nami
  rationale: Muundo huu huhifadhi msisitizo wa kiwakilishi אַתָּה, yaani utambulisho wa anayesema, bila kuubadili kuwa uthibitisho wa ujumbe pekee.
- source_word: נָא
  choice: kweli
  rationale: Katika ombi hili chembe נָא inaongeza unyenyekevu au msisitizo; ‘kweli’ huleta maana ya ‘ikiwa basi/ikiwa kweli’ kwa Kiswahili cha sasa bila kufanya sentensi kuwa nzito.
theological_decisions:
- issue: Utambulisho wa msemaji wa Gideoni
  choice: ni wewe unayesema nami
  alternative: kwamba wewe ndiye unayesema nami
  rationale: Tafsiri inahifadhi swali la utambulisho lililomo katika Kiebrania na haitangulizi ufafanuzi wa kitheolojia kuhusu msemaji zaidi ya aya yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa kawaida. ‘Naye akamwambia’ huendeleza mtiririko wa simulizi; hakuna tanbihi inayohitajika.
