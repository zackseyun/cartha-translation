  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י הָ/עִיר֙ אֶל יוֹאָ֔שׁ הוֹצֵ֥א אֶת בִּנְ/ךָ֖ וְ/יָמֹ֑ת כִּ֤י נָתַץ֙ אֶת מִזְבַּ֣ח הַ/בַּ֔עַל וְ/כִ֥י כָרַ֖ת הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/030.yaml
  text: Then the men of the city said to Joash[a], “Bring out your son, that he may die, because he has torn down the altar of Baal and cut down the Asherah that was beside it.”
translation:
  language: sw
  text: Ndipo wanaume wa mji wakamwambia Yoashi, “Mtoe mwanao nje ili afe, kwa sababu ameibomoa madhabahu ya Baali na kuikata chini Ashera[a] iliyokuwa kando yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguzo ya Ashera.” Neno la Kiebrania linaweza kurejelea kifaa cha ibada kilichohusishwa na Ashera; hapa muktadha unaonyesha kifaa hicho badala ya mungu wa kike mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: wanaume wa mji
  rationale: Huhifadhi umbo la kiume la Kiebrania na rejeleo linalowezekana kwa wanaume waliotenda kama wawakilishi wa mji.
- source_word: הוֹצֵא
  choice: Mtoe mwanao nje
  rationale: Kauli ya kusababisha ya יצא inaamuru Yoashi amfanye mwanawe atoke; Kiswahili hiki ni cha kawaida na wazi.
- source_word: וְיָמֹת
  choice: ili afe
  rationale: Huhifadhi matokeo au kusudi la amri bila kuongeza dhana mahsusi ya utaratibu rasmi wa hukumu.
- source_word: נָתַץ
  choice: ameibomoa
  rationale: Kitenzi hiki kinafaa kwa kuangusha au kubomoa muundo kama madhabahu.
- source_word: מִזְבַּח הַבַּעַל
  choice: madhabahu ya Baali
  rationale: Huwakilisha moja kwa moja uhusiano wa muundo wa Kiebrania kwa lugha ya kawaida ya kibiblia ya Kiswahili.
- source_word: כָרַת
  choice: kulikata chini
  rationale: Huonyesha kukatwa na kuangushwa kwa kitu cha mbao au kitu kinachosimama.
- source_word: הָאֲשֵׁרָה
  choice: Ashera
  rationale: Huhifadhi istilahi ya Kiebrania na utata wake wa kweli kati ya jina linalohusishwa na mungu wa kike na kifaa cha ibada; muktadha wa kukatwa unaelekeza kwa kifaa.
- source_word: אֲשֶׁר עָלָיו
  choice: lililokuwa kando yake
  rationale: Ingawa עַל inaweza kumaanisha juu ya, hapa uhusiano wa mahali kati ya madhabahu na Ashera unaeleweka kwa kawaida kuwa kando yake.
theological_decisions:
- issue: Maana ya אֲשֵׁרָה katika muktadha wa ibada
  choice: Ashera
  alternative: nguzo ya Ashera; mungu wa kike Ashera
  rationale: Tafsiri kwa jina Ashera haiamui zaidi ya ushahidi wa maandishi. Kitenzi ‘kukata chini’ kinaonyesha kuwa hapa kinachorejelewa huenda ni kifaa cha ibada, lakini neno lenyewe lina utata unaostahili kuhifadhiwa.
- issue: Nguvu ya וְיָמֹת
  choice: ili afe
  alternative: na afe; auawe
  rationale: ‘Ili afe’ hudumisha uhusiano wa kusudi au matokeo baada ya amri. ‘Auawe’ ingefafanua njia ya kifo kuliko Kiebrania kinavyosema moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wanaume wa mji’ huhifadhi jinsia ya rejeleo; ‘Mtoe mwanao nje ili afe’ ni ya moja kwa moja bila kuongeza lugha ya kisheria. Alama ya tanbihi [a] imewekwa mara baada ya ‘Ashera,’ neno linalohusika.
