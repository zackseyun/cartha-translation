lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Ikawa, ... walipo-
  rationale: Muundo huu unaanzisha hatua mpya ya simulizi pamoja na kishazi cha wakati. “Ikawa” huhifadhi alama ya simulizi ya Kiebrania, na “walipo-” huonyesha uhusiano wa wakati kwa Kiswahili cha kawaida.
- source_word: זָעֲקוּ
  choice: walipomlilia
  rationale: Kitenzi זעק hapa kinaonyesha kilio cha dhiki cha kuomba msaada. “Kumlilia” ni usemi wa asili wa Kiswahili unaobeba dharura na kuelekezwa kwa anayesikiwa.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii inahifadhi wazi usemi halisi wa Kiebrania; “Waisraeli” ni mbadala wa Kiswahili ulio mwepesi zaidi.
- source_word: אֶל יְהוָה
  choice: Yahwe
  rationale: Kiambishi cha mtendwa katika “walipomlilia” kinaonyesha kwamba kilio kilielekezwa kwa Yahwe, huku jina la agano likitolewa kwa namna inayotambulika katika Kiswahili.
- source_word: עַל אֹדוֹת
  choice: kwa sababu ya
  rationale: Katika muktadha huu kirai kinaeleza sababu iliyowafanya walie; “kwa sababu ya” ni wazi na ya kawaida bila kuongeza maelezo yasiyomo.
- source_word: מִדְיָן
  choice: Midiani
  rationale: “Midiani” ni umbo la kawaida la Kiswahili la jina hili na linaacha wazi ikiwa jina linarejelea nchi, taifa, au nguvu ya Midiani katika muktadha.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Koma ya mwisho imehifadhiwa kwa sababu sentensi inaendelea katika mstari unaofuata.
