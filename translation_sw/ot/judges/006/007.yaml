  text: And it happened that[a], when the sons of Israel cried out to Yahweh because of Midian[b],
translation:
  language: sw
  text: Ikawa kwamba, wana wa Israeli[a] walipomlilia Yahwe kwa sababu ya Midiani[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania kinasema, “wana wa Israeli.”
