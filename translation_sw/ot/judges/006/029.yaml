base_translation:
  language: en
  yaml_path: translation/ot/judges/006/029.yaml
  text: And each man said to his neighbor[a], “Who has done this thing?” And they inquired and searched, and they said[b], “Gideon son of Joash has done this thing.”
translation:
  language: sw
  text: Wakaulizana[a], “Ni nani aliyefanya jambo hili?” Wakachunguza na kutafuta, kisha wakasema, “Gideoni mwana wa Yoashi ndiye aliyefanya jambo hili.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kila mtu akamwambia mwenzake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: wakaulizana
  rationale: Nahau ya Kiebrania, kihalisi ‘mtu kwa mwenzake,’ inaonyesha watu wakizungumza wao kwa wao. ‘Wakaulizana’ ni Kiswahili cha kawaida kinachofaa kwa swali linalofuata.
- source_word: מִי
  choice: ni nani
  rationale: Hili ndilo umbo la kawaida la kuuliza kuhusu mtendaji katika Kiswahili.
- source_word: עָשָׂה
  choice: aliyefanya
  rationale: Kitenzi kinataja tendo lililokamilika; ‘aliyefanya’ ni cha kawaida katika swali na taarifa zinazomtambulisha mtendaji.
- source_word: הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: דָּבָר hapa linarejelea tendo lililogunduliwa. ‘Jambo hili’ linahifadhi upana wa neno bila kulifasiri kwa namna finyu kama ‘uhalifu’.
- source_word: וַיִּדְרְשׁוּ
  choice: wakachunguza
  rationale: דרשׁ hapa lina maana ya kufanya uchunguzi au kuulizia ili kujua ukweli.
- source_word: וַיְבַקְשׁוּ
  choice: na kutafuta
  rationale: בקשׁ lina maana ya kutafuta; tafsiri hii inadumisha tofauti yake na uchunguzi uliotajwa na kitenzi kilichotangulia.
- source_word: גִּדְעוֹן בֶּן־יוֹאָשׁ
  choice: Gideoni mwana wa Yoashi
  rationale: Majina yamenukuliwa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili, na patronimia ya Kiebrania imetafsiriwa moja kwa moja.
- source_word: וַיֹּאמְרוּ
  choice: wakasema
  rationale: Tafsiri ya moja kwa moja inahifadhi taarifa ya msimulizi bila kuongeza wazo la kwamba walihitimisha kwa uhakika zaidi ya maandishi.
