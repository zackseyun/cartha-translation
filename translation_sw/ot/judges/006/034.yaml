base_translation:
  language: en
  yaml_path: translation/ot/judges/006/034.yaml
  text: Then the Spirit of Yahweh clothed Gideon[a], and he blew the trumpet[c][b], and Abiezer was summoned after him.
translation:
  language: sw
  text: Ndipo Roho wa Yahwe akamvika Gideoni[a]. Gideoni akapiga baragumu[b], nao ukoo wa Abiezeri ukaitwa kumfuata[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Roho wa Yahwe akamjia Gideoni.” Kiebrania ni, “Roho wa Yahwe akamvika Gideoni.”
    reason: lexical_alternative
  - marker: b
    text: Baragumu hii ilikuwa shofari, yaani pembe iliyopigwa ili kutoa ishara.
    reason: cultural_note
  - marker: c
    text: Au, “ukakusanyika nyuma yake” au “ukakusanyika kumuunga mkono.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: Roho wa Yahwe
  rationale: Katika muktadha huu רוּחַ ni Roho anayempa Gideoni uwezo, si upepo wala pumzi. Jina la agano יְהוָה limetafsiriwa Yahwe.
- source_word: לָבְשָׁה אֶת גִּדְעוֹן
  choice: akamvika Gideoni
  rationale: Huhifadhi sitiari dhahiri ya kitenzi לבשׁ, yaani kumvika mtu, badala ya kuibadili moja kwa moja kuwa ‘akamjia’ au ‘akamshukia.’
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: akapiga baragumu
  rationale: ‘Kupiga baragumu’ ni usemi wa kawaida wa Kiswahili kwa kutoa ishara kwa chombo hiki; tanbihi inaeleza kwamba שׁוֹפָר ni pembe ya kupigia ishara.
- source_word: וַיִּזָּעֵק אֲבִיעֶזֶר
  choice: ukoo wa Abiezeri ukaitwa
  rationale: Nifali ya זעק hapa ina maana ya kuitwa au kukusanywa kwa mwito. Jina Abiezeri limetumiwa kwa maana ya ukoo, kwa hiyo hilo limewekwa wazi kwa usomaji wa kawaida.
- source_word: אַחֲרָיו
  choice: kumfuata
  rationale: Huwasilisha maana ya kukusanyika nyuma ya Gideoni ili kumuunga mkono, bila kuongeza maelezo ya kijeshi yasiyosemwa wazi.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la pekee la Mungu, YHWH. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Sitiari ya Roho kumvika Gideoni
  choice: akamvika Gideoni
  alternative: akamjia Gideoni / akamshukia Gideoni
  rationale: Tafsiri kuu inahifadhi picha yenye nguvu ya Kiebrania na tanbihi inatoa usemi wa kawaida zaidi bila kuondoa mvutano wa sitiari hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi ya maandiko. ‘Ukoo wa Abiezeri’ hufafanua matumizi ya jina la babu kwa kundi la wazao wake; ‘baragumu’ ni neno linaloeleweka kwa urahisi, huku upekee wa shofari ukielezwa katika tanbihi.
