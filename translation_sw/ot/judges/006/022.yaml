  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֣רְא גִּדְע֔וֹן כִּֽי מַלְאַ֥ךְ יְהוָ֖ה ה֑וּא וַ/יֹּ֣אמֶר גִּדְע֗וֹן אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה כִּֽי עַל כֵּ֤ן רָאִ֨יתִי֙ מַלְאַ֣ךְ יְהוָ֔ה פָּנִ֖ים אֶל פָּנִֽים־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/022.yaml
  text: Then Gideon saw that he was the angel of Yahweh[a], and Gideon said, “Ah, Lord GOD! For I have seen the angel of Yahweh face to face.”
translation:
  language: sw
  text: Ndipo Gideoni akaona kwamba huyo alikuwa malaika wa Yahwe[a], akasema, “Ole wangu, Bwana Yahwe! Kwa maana nimemwona malaika wa Yahwe uso kwa uso.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mjumbe wa Yahwe.” Neno la Kiebrania linaweza kumaanisha “malaika” au “mjumbe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Ndipo Gideoni akaona
  rationale: Kitenzi ראה kwa msingi ni ‘kuona’; katika muktadha huu pia kinadokeza kutambua. ‘Ndipo ... akaona’ kinaendeleza simulizi na kuhifadhi usemi wa Kiebrania bila kufafanua kupita kiasi.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי inatanguliza jambo ambalo Gideoni aliliona au kulitambua.
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahwe
  rationale: מַלְאָךְ inaweza kumaanisha ‘malaika’ au ‘mjumbe.’ Katika simulizi hili mhusika ni mjumbe wa kimbingu, kwa hiyo ‘malaika’ inafaa katika maandishi, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: הוּא
  choice: huyo alikuwa
  rationale: Kiwakilishi kinamtambulisha yule ambaye Gideoni alikuwa amekutana naye; ‘huyo’ ni rejeleo la kawaida na la wazi katika Kiswahili.
- source_word: אֲהָהּ
  choice: Ole wangu
  rationale: Kihisishi hiki kinaonyesha hofu na mfadhaiko mkubwa. ‘Ole wangu’ ni usemi wa Kiswahili wenye uzito unaolingana na hali ya Gideoni.
- source_word: אֲדֹנָי יְהוִה
  choice: Bwana Yahwe
  rationale: ‘Bwana’ linawakilisha אֲדֹנָי, na ‘Yahwe’ linahifadhi jina la Mungu יְהוָה, bila kuyafanya maneno hayo mawili kuwa cheo kimoja.
- source_word: כִּי עַל כֵּן
  choice: Kwa maana
  rationale: Katika muktadha huu fungu hilo linatoa sababu ya kilio cha Gideoni; ‘Kwa maana’ ni Kiswahili cha kawaida na chenye heshima.
- source_word: רָאִיתִי
  choice: nimemwona
  rationale: Kauli timilifu ya Kiswahili inaonyesha tukio lililotokea sasa hivi na matokeo yake yanayoendelea katika mwitikio wa Gideoni.
- source_word: פָּנִים אֶל פָּנִים
  choice: uso kwa uso
  rationale: Hii ni nahau ya kukutana moja kwa moja, na ‘uso kwa uso’ ndiyo sawa ya asili na iliyo karibu na muundo wa Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu lenye herufi nne. ‘Yahwe’ linahifadhi jina hilo kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya מַלְאַךְ יְהוָה
  choice: malaika wa Yahwe
  alternative: mjumbe wa Yahwe
  rationale: Neno מַלְאָךְ linaweza kumaanisha malaika au mjumbe. Muktadha unaonyesha mjumbe wa kimbingu, lakini tanbihi inahifadhi uwezekano wa kileksika bila kuamua utambulisho wake zaidi ya maandishi.
- issue: Uhusiano kati ya malaika wa Yahwe na Yahwe
  choice: 'Kutumia tu kauli ya maandishi: ‘malaika wa Yahwe’'
  alternative: Kumtambulisha wazi kuwa Yahwe mwenyewe au kuwa kiumbe tofauti kabisa
  rationale: Kifungu kina mvutano wa kitheolojia kuhusu uwakilishi na utambulisho wa malaika wa Yahwe. Tafsiri haipaswi kuutatua kwa kuongeza ufafanuzi usiomo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. ‘Ole wangu’ linaonyesha mshangao wenye hofu bila kutumia lugha ya mazungumzo mno; jina ‘Yahwe’ limehifadhiwa kwa uthabiti.
