  source_fidelity: 'Tafsiri inafuata kwa uaminifu mfuatano na maana ya Kiebrania: Gideoni anatambua kwamba yule aliyekutana naye alikuwa malaika wa Yahwe, kisha anatoa kilio cha hofu kwa sababu amemwona malaika huyo uso kwa uso. “Nimemwona” na “uso kwa uso” zinahifadhi kikamilifu tendo timilifu na nahau ya maandishi ya chanzo.'
  naturalness: Kiswahili ni sanifu, cha asili, na kina hadhi inayofaa simulizi la Biblia. “Ndipo Gideoni akaona kwamba huyo alikuwa ...” na “Ole wangu, Bwana Yahwe!” vinatiririka vizuri; “huyo” hurejelea wazi mhusika aliyekuwapo katika simulizi.
