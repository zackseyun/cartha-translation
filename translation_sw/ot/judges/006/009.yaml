base_translation:
  language: en
  yaml_path: translation/ot/judges/006/009.yaml
  text: And I delivered you from the hand of Egypt and from the hand of all your oppressors, and I drove them out from before you and gave you their land.
translation:
  language: sw
  text: Niliwaokoa kutoka mkononi mwa Misri na kutoka mkononi mwa wote waliowakandamiza; niliwafukuza kutoka mbele yenu, nikawapa ninyi nchi yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַצִּל
  choice: Niliwaokoa
  rationale: Kitenzi נצל kinaeleza kuokoa au kukomboa kutoka hatarini au chini ya mamlaka ya mwingine. “Niliwaokoa” ni cha kawaida, wazi, na kinaonyesha tendo la Mungu.
- source_word: מִיַּד מִצְרַיִם
  choice: kutoka mkononi mwa Misri
  rationale: Nahau ya Kiebrania “kutoka mkononi mwa” imehifadhiwa kwa kuwa inaeleweka katika Kiswahili na kuonyesha mamlaka au udhibiti. Umoja wa “mkononi” unafuata יַד.
- source_word: כָּל לֹחֲצֵיכֶם
  choice: wote waliowakandamiza
  rationale: לֹחֲצֵי־ humaanisha waliowabana, kuwaonea, au kuwakandamiza. Kishazi hiki ni cha asili zaidi katika Kiswahili cha sasa kuliko nomino nzito kama “wakandamizaji wenu,” huku kikihifadhi maana mahususi.
- source_word: וָאֲגָרֵשׁ אוֹתָם
  choice: Niliwafukuza
  rationale: גרש humaanisha kufukuza au kuondoa kwa nguvu. “Niliwafukuza” linafaa kwa muktadha wa kuwaondoa wakaaji wa nchi.
- source_word: מִפְּנֵיכֶם
  choice: mbele yenu
  rationale: Hili linahifadhi taswira ya mahali ya Kiebrania, yaani kuwaondoa kutoka mbele au katika uwepo wa Israeli, bila kufanya sentensi kuwa ngumu.
- source_word: וָאֶתְּנָה לָכֶם אֶת אַרְצָם
  choice: na kuwapa nchi yao
  rationale: Muundo huu unaonyesha wazi kwamba Mungu aliwapa Israeli nchi iliyokuwa ya wale waliofukuzwa, huku ukisomeka kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Utendaji wa Mungu katika ukombozi na kumiliki nchi
  choice: 'Mungu amebaki kuwa mtendaji wa vitendo vyote vitatu: kuokoa, kufukuza, na kutoa nchi.'
  alternative: Kugeuza baadhi ya matendo kuwa yasiyo na mtendaji wazi au kusisitiza ushiriki wa Israeli.
  rationale: Vitenzi vya nafsi ya kwanza katika Kiebrania vinasisitiza utendaji wa moja kwa moja wa BWANA. Tafsiri haiongezi maelezo ya kidhehebu kuhusu namna matendo hayo yalivyotekelezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau “mkononi mwa” imehifadhiwa kwa sababu ni wazi na hudumisha taswira ya mamlaka ya Kiebrania; “wote waliowakandamiza” limetumiwa kwa urahisi na usahihi.
