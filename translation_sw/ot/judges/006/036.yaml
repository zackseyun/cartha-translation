base_translation:
  language: en
  yaml_path: translation/ot/judges/006/036.yaml
  text: Then Gideon said to God, “If you will save Israel by my hand, as you have spoken,”
translation:
  language: sw
  text: Ndipo Gideoni akamwambia Mungu, “Ikiwa utawaokoa Israeli kwa mkono wangu, kama ulivyosema—[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli hii ya masharti inaendelea katika mstari wa 37.
    reason: Mstari wa Kiebrania unaishia kabla wazo la sharti halijakamilika; alama hii huzuia msomaji kudhani kwamba sentensi imekamilika hapa.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo huu unaendeleza simulizi kwa Kiswahili cha kawaida na pia unaonyesha kwamba Gideoni anamwelekezea Mungu maneno yake.
- source_word: אֶל הָאֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha, Gideoni anazungumza na Mungu wa Israeli, si mungu asiyeainishwa; Kiswahili hakihitaji kutafsiri kibainishi cha Kiebrania kando.
- source_word: אִם
  choice: Ikiwa
  rationale: Neno hili linaanzisha sharti ambalo linakamilishwa katika mstari unaofuata, bila kuamua mapema ikiwa ni shaka au ombi la uthibitisho.
- source_word: יֶשְׁךָ מוֹשִׁיעַ
  choice: utawaokoa
  rationale: Muundo wa יֵשׁ pamoja na kiambishi cha nafsi na umbo la kushiriki unaonyesha tendo linalotarajiwa au lililokusudiwa; wakati ujao wa Kiswahili huwasilisha maana hiyo kwa uwazi.
- source_word: מוֹשִׁיעַ
  choice: waokoa
  rationale: Kitenzi hiki kina maana ya kuokoa au kukomboa kutoka hatarini; ‘okoa’ ni cha kawaida na kinafaa katika muktadha wa ukombozi wa kijeshi.
- source_word: בְּיָדִי
  choice: kwa mkono wangu
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya mkono kama chombo cha kutendea, huku ikibaki wazi katika Kiswahili.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israeli
  rationale: Kiashiria cha yambwa אֵת hakitafsiriwi; ‘Israeli’ linamtaja taifa au watu wanaookolewa.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: kama ulivyosema
  rationale: Hii ni tafsiri ya moja kwa moja, ya asili, na yenye heshima ya kurejelea ahadi ambayo Mungu alikuwa amekwisha kutoa.
theological_decisions:
- issue: Jina אֱלֹהִים katika mazungumzo ya Gideoni
  choice: Mungu
  alternative: mungu; huyo Mungu
  rationale: Muktadha unamtambulisha anayesemeshwa kuwa Mungu wa Israeli. Herufi kubwa na matumizi ya kawaida ya ‘Mungu’ yanaonyesha rejeo hilo bila kuongeza maelezo ya kimadhehebu.
- issue: Hali ya sharti la Gideoni
  choice: Ikiwa
  alternative: Kwa kuwa kweli; Je, ikiwa
  rationale: ‘Ikiwa’ huhifadhi umbo la sharti na mvutano wa kifungu bila kulifafanua kimbele kuwa ama mashaka, ama kutokuamini, ama uthibitisho tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kwa mkono wangu’ kimedumishwa ili kuhifadhi taswira ya chanzo, na kistari kimetumiwa kuonyesha kwamba kauli inaendelea katika mstari unaofuata.
