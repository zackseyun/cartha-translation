  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֡שׁ לְ/כֹל֩ אֲשֶׁר עָמְד֨וּ עָלָ֜י/ו הַ/אַתֶּ֣ם תְּרִיב֣וּ/ן לַ/בַּ֗עַל אִם אַתֶּם֙ תּוֹשִׁיע֣וּ/ן אוֹת֔/וֹ אֲשֶׁ֨ר יָרִ֥יב ל֛/וֹ יוּמַ֖ת עַד הַ/בֹּ֑קֶר אִם אֱלֹהִ֥ים הוּא֙ יָ֣רֶב ל֔/וֹ כִּ֥י נָתַ֖ץ אֶֽת מִזְבְּחֽ/וֹ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/031.yaml
  text: But Joash said to all who stood against him[a], “Will you contend for Baal? Will you save him? Whoever contends for him shall be put to death by morning. If he is a god, let him contend for himself, because his altar has been torn down.”
translation:
  language: sw
  text: Lakini Yoashi akawaambia wote waliomkabili, “Je, ninyi mtamtetea Baali? Je, ninyi mtamwokoa? Yeyote atakayemtetea atauawa ifikapo asubuhi. Ikiwa yeye ni mungu, na ajitetee mwenyewe, kwa sababu madhabahu yake imebomolewa[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ameibomoa madhabahu yake,” mtenda akiwa anaeleweka kuwa Gideoni.
    reason: Tofauti ya kisarufi na ya utambulisho wa mtenda katika kitenzi cha Kiebrania.
lexical_decisions:
- source_word: עָמְדוּ עָלָיו
  choice: waliomkabili
  rationale: Nahau hii ina maana ya kumpinga au kumkabili Yoashi katika muktadha huu, si kusimama tu karibu naye.
- source_word: תְּרִיבוּן / יָרִיב / יָרֶב
  choice: mtamtetea / atakayemtetea / na ajitetee
  rationale: Mzizi ריב unarudiwa kwa kusudi la balagha. ‘Kutetea’ hudumisha marudio hayo na inafaa kwa wazo la kuchukua shauri la Baali, huku ‘ajitetee mwenyewe’ ikiwa Kiswahili cha kawaida katika mwito wa Baali kuchukua shauri lake mwenyewe.
- source_word: תּוֹשִׁיעוּן
  choice: mtamwokoa
  rationale: ‘Kumwokoa’ huonyesha moja kwa moja kejeli ya watu kujaribu kumwokoa mungu wao.
- source_word: אֲשֶׁר יָרִיב לוֹ
  choice: Yeyote atakayemtetea
  rationale: Hii huwasilisha kishazi cha Kiebrania chenye maana ya mtu yeyote bila kukifunga kwa mtu fulani.
- source_word: יוּמַת
  choice: atauawa
  rationale: Umbo la Kiebrania ni la kusababishwa na kutendwa; ‘atauawa’ ni sahihi zaidi kuliko ‘atakufa’.
- source_word: עַד הַבֹּקֶר
  choice: ifikapo asubuhi
  rationale: 'Hapa kifungu kinaweka ukomo wa wakati: hukumu hiyo itekelezwe kufikia asubuhi.'
- source_word: אֱלֹהִים הוּא
  choice: yeye ni mungu
  rationale: Neno hili linamhusu Baali kama anayedaiwa kuwa mungu, si Mungu wa Israeli; herufi ndogo huhifadhi maana hiyo.
- source_word: כִּי נָתַץ אֶת מִזְבְּחוֹ
  choice: kwa sababu madhabahu yake imebomolewa
  rationale: Tafsiri ya hali ya kutendwa huepuka kumtaja wazi mtenda ambaye hatajwi kwa nomino katika Kiebrania, huku ikidumisha sababu inayotolewa.
- source_word: וַיֹּאמֶר
  choice: Lakini Yoashi akawaambia
  rationale: Kiunganishi kinaendeleza simulizi kwa zamu yenye kupingana na madai ya watu; ‘Lakini’ huonyesha jibu hilo kwa kawaida.
theological_decisions:
- issue: Rejeo la אֱלֹהִים kwa Baali
  choice: ‘mungu’ kwa herufi ndogo
  alternative: ‘Mungu’ kwa herufi kubwa
  rationale: Yoashi anazungumzia dai la Baali kuwa mungu, wala hamtambui kuwa Mungu wa kweli.
- issue: Mtenda wa kitendo cha kubomoa madhabahu
  choice: Kishazi kikuu kimetumia hali ya kutendwa, na usomaji wa Gideoni kama mtenda umewekwa katika tanbihi
  alternative: ‘kwa sababu ameibomoa madhabahu yake,’ mtenda akieleweka kuwa Gideoni
  rationale: Kitenzi cha Kiebrania ni cha nafsi ya tatu, umoja, jinsia ya kiume bila nomino ya mtenda; tanbihi huhifadhi usomaji wa kawaida wa Gideoni bila kuufanya uwe wazi zaidi kuliko maandishi yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya ‘kutetea’ yanadumisha muundo wa balagha wa mzizi ריב, na maswali yanaendeleza kejeli ya Yoashi kuhusu watu kulazimika kumwokoa Baali.
