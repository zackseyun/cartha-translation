  text: וַ/יֹּ֨אמֶר ל֧/וֹ יְהוָ֛ה שָׁל֥וֹם לְ/ךָ֖ אַל תִּירָ֑א לֹ֖א תָּמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/023.yaml
  text: But Yahweh said to him[a], “Peace be to you. Do not fear; you shall not die.”
translation:
  language: sw
  text: Lakini Yahwe akamwambia, “Amani iwe kwako.[a] Usiogope; hutakufa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uwe na amani.” Neno la Kiebrania shalom linaweza kumaanisha amani, hali njema, au uhakikisho wa usalama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: akamwambia
  rationale: Muundo wa kawaida wa masimulizi wa וַיֹּאמֶר pamoja na לוֹ unaonyesha kwamba Yahwe alimwambia Gideoni; ‘akamwambia’ ni Kiswahili cha kawaida na fasaha katika simulizi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kwa namna ya kawaida katika Kiswahili kama ‘Yahwe,’ badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
- source_word: שָׁלוֹם לְךָ
  choice: Amani iwe kwako
  rationale: Kauli hii ni tamko la kumtuliza na kumhakikishia usalama; tafsiri hii inadumisha maana ya amani na hali njema bila kuifanya salamu ya kawaida tu.
- source_word: אַל תִּירָא
  choice: Usiogope
  rationale: Hii ni kauli ya moja kwa moja ya kumwondolea hofu, na ‘Usiogope’ ni ya asili, fupi, na yenye hadhi katika Kiswahili.
- source_word: לֹא תָּמוּת
  choice: hutakufa
  rationale: Kauli hasi ya wakati ujao inatoa uhakikisho wa wazi kwamba hatakufa; ‘hutakufa’ ni ya kawaida na thabiti katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi יהוה. Kulitaja kama ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya שָׁלוֹם לְךָ katika muktadha
  choice: Amani iwe kwako
  alternative: Uwe na amani; mambo ni salama kwako
  rationale: Kauli hii inaweza kuwa baraka na pia uhakikisho wa hali njema. Tafsiri iliyochaguliwa inadumisha upana huo wa maana, huku tanbihi ikieleza uwezekano wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa kwa usemi wa Mungu. ‘Lakini’ linaonyesha tofauti kati ya hofu ya Gideoni na uhakikisho unaofuata; alama ya tanbihi imewekwa moja kwa moja baada ya kauli inayohusika.
