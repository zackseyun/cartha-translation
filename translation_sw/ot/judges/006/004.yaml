base_translation:
  language: en
  yaml_path: translation/ot/judges/006/004.yaml
  text: They would encamp against them and destroy the produce of the land as far as Gaza[a], and they would leave no sustenance in Israel, nor sheep, ox[b], or donkey.
translation:
  language: sw
  text: Walikuwa wakipiga kambi dhidi yao na kuharibu mazao ya nchi mpaka Gaza[a]. Hawakuacha riziki yoyote katika Israeli[b], wala kondoo, ng’ombe, au punda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “mpaka kufika Gaza”; hii ni nahau inayoonyesha eneo lililofikiwa kuelekea Gaza.
    reason: lexical_alternative
  - marker: b
    text: Au “chochote cha kuendeleza maisha” au “chochote cha kujikimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ עֲלֵיהֶם
  choice: Walikuwa wakipiga kambi dhidi yao
  rationale: Kitenzi חנה humaanisha kupiga kambi; muundo wa ‘walikuwa waki-’ unaonyesha mashambulizi yaliyokuwa yakirudiwa, na עַל hapa ina maana ya uadui.
- source_word: וַיַּשְׁחִיתוּ אֶת יְבוּל הָאָרֶץ
  choice: na kuharibu mazao ya nchi
  rationale: שׁחת katika Hiphil ni ‘kuharibu’ au ‘kuangamiza,’ na יְבוּל ni mazao au mavuno ya nchi.
- source_word: עַד בּוֹאֲךָ עַזָּה
  choice: mpaka Gaza[a]
  rationale: Hii ni nahau ya Kiebrania inayotaja kufika au kukaribia Gaza; ‘mpaka Gaza’ ni Kiswahili cha kawaida huku tanbihi ikihifadhi umbo halisi la nahau.
- source_word: וְלֹא יַשְׁאִירוּ מִחְיָה בְּיִשְׂרָאֵל
  choice: Hawakuacha chochote cha kuendeleza uhai katika Israeli[b]
  rationale: מִחְיָה inaweza kumaanisha chakula, riziki, au njia ya kuendeleza maisha. Tafsiri hii inadumisha upana wake bila kuifanya imaanishe kwamba hawakuacha kiumbe hai hata kimoja.
- source_word: וְשֶׂה וָשׁוֹר וַחֲמוֹר
  choice: wala kondoo, ng’ombe, au punda
  rationale: Majina ya umoja katika Kiebrania yametumiwa kwa maana ya jamii nzima; Kiswahili hutumia majina haya kwa maana ya jumla kwa ufasaha.
