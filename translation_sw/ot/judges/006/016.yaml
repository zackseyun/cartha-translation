  text: And Yahweh said to him[a], “Surely I will be with you, and you will strike Midian as one man.”
translation:
  language: sw
  text: Yahwe akamwambia, “Hakika nitakuwa pamoja nawe, nawe utawapiga Wamidiani kama mtu mmoja[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kana kwamba ni mtu mmoja.” Nahau ya Kiebrania inaweza kusisitiza kwamba utawapiga Wamidiani kwa urahisi kana kwamba unampiga mtu mmoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili, “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: וַיֹּאמֶר אֵלָיו
  choice: akamwambia
  rationale: Muundo huu wa kawaida wa masimulizi unaendeleza tukio; “akamwambia” ni wa asili katika Kiswahili na unajumuisha maana ya “alisema kwake.”
- source_word: כִּי
  choice: Hakika
  rationale: Katika muktadha huu neno hilo linatilia mkazo uhakikisho wa Yahwe kwamba mafanikio ya Gideoni yatategemea kuwapo kwake pamoja naye.
- source_word: אֶהְיֶה עִמָּךְ
  choice: nitakuwa pamoja nawe
  rationale: Kauli hii ni ahadi ya wakati ujao na inadumisha kwa uwazi uhakikisho wa kuwapo kwa Mungu pamoja na Gideoni.
- source_word: וְהִכִּיתָ
  choice: nawe utawapiga
  rationale: “Utawapiga” inadumisha picha ya kitenzi נכה kwa Kiswahili cha kawaida, bila kuibadili moja kwa moja kuwa tafsiri pana zaidi ya “utawashinda.”
- source_word: אֶת מִדְיָן
  choice: Wamidiani
  rationale: Ingawa Kiebrania kinatumia jina la pamoja “Midiani,” Kiswahili hutaja watu wanaolengwa kwa kawaida zaidi kama “Wamidiani,” hasa pamoja na kitenzi chenye kiambishi cha watu “-wa-.”
- source_word: כְּאִישׁ אֶחָד
  choice: kana kwamba ni mtu mmoja tu
  rationale: Kauli hii inadumisha taswira ya umoja wa kiume na kueleza kwamba jeshi lote la Midiani litapigwa kwa uamuzi kana kwamba ni mtu mmoja.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia moja kwa moja jina la Mungu lenye herufi nne. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya nahau כְּאִישׁ אֶחָד
  choice: kana kwamba ni mtu mmoja tu
  alternative: kama mtu mmoja
  rationale: Tafsiri iliyochaguliwa inadumisha taswira ya mtu mmoja huku ikisaidia msomaji kuelewa kwamba Wamidiani wote ndio wanaoonyeshwa kana kwamba ni mtu mmoja. Tanbihi inahifadhi uwezekano wa tafsiri fupi na ukali wa nahau ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na ya kawaida katika simulizi. “Akamwambia” huendeleza mtiririko wa masimulizi, na “pamoja nawe” ni kauli ya wazi na ya asili ya ahadi ya Mungu.
