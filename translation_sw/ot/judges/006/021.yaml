  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח מַלְאַ֣ךְ יְהוָ֗ה אֶת קְצֵ֤ה הַ/מִּשְׁעֶ֨נֶת֙ אֲשֶׁ֣ר בְּ/יָד֔/וֹ וַ/יִּגַּ֥ע בַּ/בָּשָׂ֖ר וּ/בַ/מַּצּ֑וֹת וַ/תַּ֨עַל הָ/אֵ֜שׁ מִן הַ/צּ֗וּר וַ/תֹּ֤אכַל אֶת הַ/בָּשָׂר֙ וְ/אֶת הַ/מַּצּ֔וֹת וּ/מַלְאַ֣ךְ יְהוָ֔ה הָלַ֖ךְ מֵ/עֵינָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/021.yaml
  text: Then the angel of Yahweh reached out the tip of the staff that was in his hand and touched the meat and the unleavened bread[a]. And fire went up from the rock and consumed the meat and the unleavened bread[c][b]. Then the angel of Yahweh went away from his sight.
translation:
  language: sw
  text: Kisha malaika[a] wa Yahwe akanyoosha ncha ya fimbo iliyokuwa mkononi mwake, akagusa nyama[b] na mikate isiyotiwa chachu. Moto ukapanda kutoka mwambani, ukateketeza nyama na mikate isiyotiwa chachu. Kisha malaika wa Yahwe akaondoka machoni pake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe wa Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania maana yake ya msingi ni “mwili” au “nyama”; hapa linamaanisha nyama iliyotayarishwa.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kihalisi ni “akaenda kutoka machoni pake,” yaani, Gideoni hakumwona tena.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahwe
  rationale: מַלְאָךְ inaweza kumaanisha ‘mjumbe’ au ‘malaika’; kwa kuwa mhusika huyu anatenda kwa njia ya kimuujiza katika simulizi hili, ‘malaika’ ni neno la kawaida na linalofaa katika Kiswahili, huku tanbihi ikihifadhi maana nyingine.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina la agano lililo katika maandishi ya Kiebrania.
- source_word: קְצֵה הַמִּשְׁעֶנֶת
  choice: ncha ya fimbo
  rationale: קָצֶה ni mwisho au ncha, na מִשְׁעֶנֶת ni fimbo ya kutegemea; ‘ncha ya fimbo’ ni wazi na ya asili.
- source_word: וַיִּשְׁלַח
  choice: akanyoosha
  rationale: Katika muktadha huu kitenzi kinaeleza kunyoosha fimbo kuelekea chakula, si kuituma.
- source_word: וַיִּגַּע
  choice: akagusa
  rationale: נגע kwa kawaida humaanisha kugusa; maandishi hayalazimishi maana yenye nguvu zaidi kama kupiga.
- source_word: בָּשָׂר
  choice: nyama
  rationale: Ingawa neno linaweza kutafsiriwa ‘mwili,’ hapa linarejelea nyama iliyotayarishwa kama chakula au sadaka.
- source_word: מַצּוֹת
  choice: mikate isiyotiwa chachu
  rationale: Tafsiri hii inaeleza wazi aina ya chakula na kuhifadhi wingi wa neno la Kiebrania.
- source_word: וַתַּעַל הָאֵשׁ מִן הַצּוּר
  choice: Moto ukapanda kutoka mwambani
  rationale: Neno עלה linaonyesha moto ukipanda au ukiibuka juu kutoka katika mwamba; ‘ukapanda kutoka mwambani’ huhifadhi picha hiyo.
- source_word: וַתֹּאכַל
  choice: ukaiteketeza
  rationale: Kitenzi humaanisha kihalisi ‘kula,’ lakini kuhusu moto Kiswahili cha kawaida hutumia ‘teketeza.’
- source_word: הָלַךְ מֵעֵינָיו
  choice: akaondoka machoni pake
  rationale: Usemi huu unafuata picha ya Kiebrania, ‘akaenda kutoka machoni pake,’ bila kuongeza kwa lazima wazo la kutoweka ghafula.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu יהוה. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Utambulisho na maana ya מַלְאַךְ יְהוָה
  choice: malaika wa Yahwe
  alternative: mjumbe wa Yahwe
  rationale: Neno מַלְאָךְ linaweza kumaanisha mjumbe wa kawaida au malaika. Matendo ya kimuujiza katika simulizi yanaunga mkono ‘malaika,’ lakini tanbihi huhifadhi uwezekano wa kileksia wa ‘mjumbe’ bila kuamua zaidi utambulisho wake wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi unaoeleweka na hadhi inayofaa maandiko. Viunganishi vya mfululizo ‘aka-/uka-’ vinahifadhi mwendo wa haraka wa simulizi la Kiebrania. ‘Machoni pake’ imehifadhiwa ili kutofanya ‘akatoweka’ kuwa dhahiri kuliko maandishi asilia.
