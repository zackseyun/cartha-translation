  text: And it was so. He rose early the next day and squeezed the fleece[a], wringing dew from the fleece—a bowlful of water.
translation:
  language: sw
  text: Ikawa hivyo. Kesho yake Gideoni aliamka asubuhi na mapema, akaikamua sufu ile, akakamua umande kutoka katika sufu hiyo—bakuli lililojaa maji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כֵן
  choice: Ikawa hivyo
  rationale: Ni uthibitisho wa moja kwa moja na wa kawaida kwamba ishara ilitokea kama Gideoni alivyoomba.
- source_word: וַיַּשְׁכֵּם מִמָּחֳרָת
  choice: Kesho yake Gideoni aliamka asubuhi na mapema
  rationale: Kitenzi kinaonyesha kuamka mapema, na מִמָּחֳרָת ni siku iliyofuata. Jina la Gideoni limewekwa wazi kwa ufasaha wa Kiswahili bila kubadili maana.
- source_word: וַיָּזַר אֶת־הַגִּזָּה
  choice: akalikamua lile sufu
  rationale: Kukamua huonyesha kulibana sufu ili kutoa kimiminika; ni neno la kawaida na linalofaa katika muktadha huu.
- source_word: וַיִּמֶץ טַל מִן־הַגִּזָּה
  choice: akalikamua umande kutoka katika sufu
  rationale: Kitenzi cha pili kinaeleza kutoa au kukamua kimiminika kilichokuwa ndani ya sufu. Marudio ya kukamua yanaakisi vitenzi viwili vya Kiebrania.
- source_word: מְלֹא הַסֵּפֶל מָיִם
  choice: maji yaliyojaa bakuli
  rationale: Kirai kinaonyesha kiasi cha maji kilichotosha kujaza bakuli, kwa Kiswahili cha kawaida.
- source_word: הַסֵּפֶל
  choice: bakuli
  rationale: Neno linataja chombo kama bakuli au beseni; “bakuli” ni chaguo la kawaida na lisilobainisha ukubwa kupita ushahidi wa maandishi.
