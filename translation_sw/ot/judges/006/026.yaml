  text: וּ/בָנִ֨יתָ מִזְבֵּ֜חַ לַ/יהוָ֣ה אֱלֹהֶ֗י/ךָ עַ֣ל רֹ֧אשׁ הַ/מָּע֛וֹז הַ/זֶּ֖ה בַּ/מַּֽעֲרָכָ֑ה וְ/לָֽקַחְתָּ֙ אֶת הַ/פָּ֣ר הַ/שֵּׁנִ֔י וְ/הַעֲלִ֣יתָ עוֹלָ֔ה בַּ/עֲצֵ֥י הָ/אֲשֵׁרָ֖ה אֲשֶׁ֥ר תִּכְרֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/026.yaml
  text: Then build an altar to Yahweh your God on the top of this stronghold[a], in orderly arrangement, and take the second bull and offer it up as a burnt offering with the wood of the Asherah that you cut down.
translation:
  language: sw
  text: Kisha ujenge madhabahu kwa ajili ya Yahweh, Mungu wako, kileleni mwa ngome hii, kwa mpangilio unaofaa. Umchukue fahali wa pili, kisha umtoe kama sadaka ya kuteketezwa kwa kuni za Ashera[a], ambayo utaikata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kuni za nguzo ya Ashera.” Neno la Kiebrania linaweza kumaanisha kitu cha ibada cha mbao kilichohusishwa na Ashera.
    reason: Neno אֲשֵׁרָה linaweza kutaja kitu cha ibada cha mbao kilichohusishwa na Ashera; umbo lake hususa halina uhakika.
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: Kisha ujenge
  rationale: Kitenzi chenye kiunganishi kinaendeleza mfululizo wa maagizo; “kisha” huonyesha hatua inayofuata, na “ujenge” ni amri ya kawaida na ya heshima katika Kiswahili.
- source_word: מִזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mahali au jengo la kutolea dhabihu.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kwa ajili ya Yahweh Mungu wako
  rationale: Kiambishi ל kinaonyesha kwamba madhabahu hiyo inawekwa wakfu kwa Yahweh; jina la agano na maneno “Mungu wako” yamehifadhiwa wazi.
- source_word: עַל רֹאשׁ הַמָּעוֹז הַזֶּה
  choice: kileleni mwa ngome hii
  rationale: רֹאשׁ hapa ni sehemu ya juu au kilele, na מָעוֹז ni mahali penye nguvu au ulinzi. “Kileleni mwa ngome hii” ni Kiswahili cha asili kinachohifadhi picha hiyo.
- source_word: בַּמַּעֲרָכָה
  choice: kwa mpangilio unaofaa
  rationale: מַעֲרָכָה inaweza kumaanisha mpangilio uliowekwa. Tafsiri hii haibainishi bila ushahidi kama kinachopangwa ni mawe au kuni.
- source_word: הַפָּר הַשֵּׁנִי
  choice: fahali wa pili
  rationale: פַּר ni fahali, na “wa pili” imedumishwa ili kuitofautisha na fahali aliyetajwa kabla yake.
- source_word: וְהַעֲלִיתָ עוֹלָה
  choice: umtoe kuwa sadaka ya kuteketezwa
  rationale: Huu ni usemi wa kiibada unaomaanisha kumtoa mnyama kama sadaka inayoteketezwa kabisa.
- source_word: בַּעֲצֵי הָאֲשֵׁרָה
  choice: kwa kuni za Ashera
  rationale: Kiambishi ב kinaonyesha chombo au njia—kuni zitatumiwa kuiteketeza sadaka. אֲשֵׁרָה limeandikwa “Ashera” bila kulazimisha umbo hususa la kitu hicho cha ibada.
- source_word: אֲשֶׁר תִּכְרֹת
  choice: utakayoikata
  rationale: Kishazi hiki kinarejelea Ashera ambayo Gideoni ameagizwa aikate; umoja umehifadhiwa badala ya kukifanya kirejelee kuni kwa wingi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu la herufi nne moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya אֲשֵׁרָה
  choice: Ashera
  alternative: nguzo ya Ashera; sanamu ya mbao ya Ashera
  rationale: Neno hilo linaweza kumaanisha kitu cha ibada kinachohusishwa na Ashera, lakini umbo lake kamili halijatajwa kwa uhakika. Jina limehifadhiwa katika matini, na uwezekano wa “nguzo” umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa mara mbili ili mfululizo wa maagizo usomeke kwa urahisi. Alama ya tanbihi imewekwa baada ya “Ashera,” ambako suala la kileksika linahusika.
