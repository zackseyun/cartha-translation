reference: Judges 6:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֤י/ו גִּדְעוֹן֙ בִּ֣י אֲדֹנִ֔/י וְ/יֵ֤שׁ יְהוָה֙ עִמָּ֔/נוּ וְ/לָ֥/מָּה מְצָאַ֖תְ/נוּ כָּל זֹ֑את וְ/אַיֵּ֣ה כָֽל נִפְלְאֹתָ֡י/ו אֲשֶׁר֩ סִפְּרוּ לָ֨/נוּ אֲבוֹתֵ֜י/נוּ לֵ/אמֹ֗ר הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ הֶעֱלָ֣/נוּ יְהוָ֔ה וְ/עַתָּה֙ נְטָשָׁ֣/נוּ יְהוָ֔ה וַֽ/יִּתְּנֵ֖/נוּ בְּ/כַף מִדְיָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/013.yaml
  text: Gideon said to him[a], “Please, my lord, if Yahweh is with us, why then has all this happened to us? And where are all his wonders that our fathers told us about, saying[c][b], ‘Did not Yahweh bring us up from Egypt?’ But now Yahweh has abandoned us and given us into the hand of Midian.”
translation:
  language: sw
  text: Gideoni akamwambia, “Samahani, bwana wangu,[a] ikiwa Yahwe yu pamoja nasi, kwa nini mambo haya yote yametupata? Yako wapi maajabu yake yote[b] ambayo mababu zetu walitusimulia, wakisema, ‘Je, Yahwe hakutupandisha kutoka Misri?’ Lakini sasa Yahwe ametuacha na kututia mikononi mwa Midiani.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tafadhali, bwana wangu.” Huu ni usemi wa heshima katika Kiebrania.
    reason: lexical_alternative
  - marker: b
    text: Au, “matendo yake ya ajabu” au “miujiza yake.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “mkononi mwa Midiani,” yaani, chini ya mamlaka ya Midiani.'
    reason: idiom_explanation
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: Samahani, bwana wangu
  rationale: בִּי ni neno la heshima la kuomba ruhusa au kuvuta usikivu, na אֲדֹנִי hapa ni namna ya heshima ya kumwambia mjumbe. Tafsiri hii ni ya kawaida na yenye adabu bila kuamua kwamba msemaji anatumia cheo cha Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kwa unukuzi wa Kiswahili kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: וְיֵשׁ יְהוָה עִמָּנוּ
  choice: ikiwa Yahwe yu pamoja nasi
  rationale: 'Ingawa muundo wake wa moja kwa moja ni karibu na “na Yahwe yupo pamoja nasi,” katika swali la Gideoni unaweka sharti la hoja: ikiwa kweli Yahwe yuko pamoja nao.'
- source_word: לָמָּה מְצָאַתְנוּ כָּל זֹאת
  choice: kwa nini mambo haya yote yametupata?
  rationale: מצא, huku maafa yakiwa kiima, humaanisha kumpata au kumfikia mtu. “Yametupata” huhifadhi taswira hiyo na ni Kiswahili cha kawaida.
- source_word: נִפְלְאֹתָיו
  choice: maajabu yake
  rationale: Neno hili humaanisha matendo ya ajabu yanayostaajabisha, hasa matendo ya Mungu katika historia ya ukombozi. “Maajabu” halibanwi kuwa miujiza pekee.
- source_word: סִפְּרוּ לָנוּ אֲבוֹתֵינוּ
  choice: mababu zetu walitusimulia
  rationale: סִפֵּר ni kusimulia au kueleza kwa mapana. “Mababu zetu” hapa hurejelea waliotangulia katika Israeli ambao walipitisha simulizi hiyo.
- source_word: הֲלֹא מִמִּצְרַיִם הֶעֱלָנוּ יְהוָה
  choice: Je, Yahwe hakutupandisha kutoka Misri?
  rationale: Swali linatarajia jibu la kukubali. Kitenzi “kutupandisha” kinahifadhi msemo wa Kiebrania wa kutoka Misri.
- source_word: נְטָשָׁנוּ
  choice: ametuacha
  rationale: נטש huonyesha kuacha au kutelekeza. “Ametuacha” ni wazi, ya sasa, na inafikisha uzito wa malalamiko ya Gideoni.
- source_word: וַיִּתְּנֵנוּ בְּכַף מִדְיָן
  choice: na kututia mkononi mwa Midiani
  rationale: Msemo “mkononi mwa” huhifadhi picha ya Kiebrania na kueleza kuwekwa chini ya mamlaka ya Midiani.
- source_word: מִדְיָן
  choice: Midiani
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la watu au eneo la Midiani.
theological_decisions:
- issue: Utoaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina binafsi la Mungu, si cheo tu. “Yahwe” hulihifadhi kama jina.
- issue: Maana ya אֲדֹנִי katika salamu ya Gideoni
  choice: bwana wangu, kama namna ya heshima kwa mjumbe
  alternative: Bwana, kama cheo cha Mungu
  rationale: Katika hatua hii ya mazungumzo, kifungu chenyewe kinaweza kueleweka kama salamu ya heshima. Herufi ndogo na tanbihi huepuka kuingiza hitimisho la kitheolojia lisilolazimishwa na kishazi hiki pekee.
- issue: Nguvu ya וְיֵשׁ katika swali la Gideoni
  choice: ikiwa Yahwe yu pamoja nasi
  alternative: na Yahwe yu pamoja nasi; kwa kuwa Yahwe yu pamoja nasi
  rationale: Muktadha unaonyesha Gideoni akijenga hoja ya masharti kutokana na hali yao, lakini tafsiri haiondoi mvutano wa malalamiko yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Yu pamoja nasi” kimetumiwa kwa mtindo wa kibiblia unaoeleweka; “yametupata” na “ametuacha” ni lugha ya kawaida yenye uzito wa malalamiko. Taswira ya Kiebrania ya kutiwa “mkononi mwa Midiani” imehifadhiwa na kufafanuliwa katika tanbihi.
