base_translation:
  language: en
  yaml_path: translation/ot/judges/006/005.yaml
  text: For they and their livestock would come up[a], and their tents would come like locusts in multitude; both they and their camels were without number[c][b], and they came into the land to destroy it.
translation:
  language: sw
  text: Kwa maana wao na mifugo yao walikuwa wakipanda, nao walikuja pamoja na mahema yao, wakiwa wengi kama nzige; wao na ngamia wao hawakuwa na hesabu, nao waliingia katika nchi ili kuiharibu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaunganisha mstari huu na uliotangulia kwa kutoa sababu ya Israeli kufukarishwa.
- source_word: וּמִקְנֵיהֶם
  choice: na mifugo yao
  rationale: מִקְנֶה ni neno pana linalohusu wanyama wanaofugwa, si ng’ombe peke yao.
- source_word: יַעֲלוּ
  choice: walikuwa wakipanda
  rationale: Hali ya kitenzi katika simulizi inaonyesha tendo lililorudiwa; ‘wakipanda’ pia huhifadhi taswira ya kuja juu dhidi ya nchi.
- source_word: וְאָהֳלֵיהֶם יָבֹאוּ
  choice: nao walikuja pamoja na mahema yao
  rationale: Hutaja mahema wazi huku ikitoa Kiswahili cha kawaida kwa metonimia ya Kiebrania ambayo kihalisi husema mahema yao yalikuja.
- source_word: כְדֵי אַרְבֶּה לָרֹב
  choice: wakiwa wengi kama nzige
  rationale: Huhifadhi ulinganisho wa wingi wa wavamizi na nzige kwa lugha ya asili ya Kiswahili.
- source_word: וְלָהֶם וְלִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: wao na ngamia wao hawakuwa na hesabu
  rationale: Huhifadhi nahau ya Kiebrania ya kutokuwa na hesabu na msisitizo kwamba watu pamoja na ngamia walikuwa wengi mno.
- source_word: וַיָּבֹאוּ בָאָרֶץ
  choice: nao waliingia katika nchi
  rationale: ‘Waliingia’ huwasilisha kwa kawaida mwendo wa kuja ndani ya nchi.
- source_word: לְשַׁחֲתָהּ
  choice: ili kuiharibu
  rationale: Kiambishi cha kusudi na kitenzi שׁחת vinaonyesha lengo la kuharibu nchi; tafsiri hii hubaki pana bila kuongeza ufafanuzi.
theological_decisions: []
