  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kurudia ‘walikuwa wakipanda’ unaonyesha uvamizi wa mazoea, huku ‘walikuja pamoja na mahema yao’ ukifanya metonimia ya Kiebrania ieleweke bila kupoteza mahema katika picha ya maandishi.
