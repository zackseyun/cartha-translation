language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הוּא בָ֣א עַד לֶ֔חִי וּ/פִלְשִׁתִּ֖ים הֵרִ֣יעוּ לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַ/תִּהְיֶ֨ינָה הָ/עֲבֹתִ֜ים אֲשֶׁ֣ר עַל זְרוֹעוֹתָ֗י/ו כַּ/פִּשְׁתִּים֙ אֲשֶׁ֣ר בָּעֲר֣וּ בָ/אֵ֔שׁ וַ/יִּמַּ֥סּוּ אֱסוּרָ֖י/ו מֵ/עַ֥ל יָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/014.yaml
  text: When he came as far as Lehi[a], the Philistines shouted as they came to meet him. Then the Spirit of Yahweh rushed upon him, and the ropes that were on his arms became like flax that has been burned in the fire, and his bonds melted off his hands.
translation:
  language: sw
  text: Alipofika Lehi[a], Wafilisti walipiga kelele walipokuja kumkabili. Ndipo Roho wa Yahweh akamjia kwa nguvu, na kamba zilizokuwa juu ya mikono yake zikawa kama nyuzi za kitani zilizochomwa kwa moto, na vifungo vyake vikayeyuka kutoka mikononi mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lehi ni jina la mahali; neno hilo la Kiebrania pia linahusiana na maana ya “taya,” jambo muhimu katika simulizi linalozunguka aya hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחִי
  choice: Lehi
  rationale: Katika muktadha huu ni jina la mahali. Uhusiano wake wa kimaana na ‘taya’ ni muhimu katika simulizi pana, hivyo umeelezwa katika tanbihi.
- source_word: הֵרִיעוּ לִקְרָאתוֹ
  choice: walipiga kelele walipokuja kumkabili
  rationale: ‘Walipiga kelele’ huhifadhi kilio kikubwa cha pamoja, huku ‘kumkabili’ ikionyesha mwendo wa kiuhasama bila kulazimisha tafsiri mahususi ya ‘kilio cha vita’.
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: Roho wa Yahweh akamjia kwa nguvu
  rationale: Kitenzi צלח katika kauli hii huonyesha ujio wa ghafla wenye nguvu na uwezeshaji. Kiswahili hiki ni cha kawaida na huhifadhi uzito wa tukio bila kuongeza maelezo ya kiteolojia.
- source_word: הָעֲבֹתִים
  choice: kamba
  rationale: Neno hilo linamaanisha kamba au nyuzi za kufungia; ‘kamba’ ni neno la kawaida na linalofaa katika muktadha.
- source_word: זְרוֹעֹתָיו
  choice: mikononi mwake
  rationale: זְרוֹעַ hurejelea mkono, hasa sehemu ya mkono kutoka begani au kiwiko. Katika Kiswahili cha kawaida ‘mikononi’ ni ya asili zaidi hapa kuliko istilahi ya kianatomia iliyo mahususi kupita kiasi.
- source_word: כַּפִּשְׁתִּים
  choice: kama nyuzi za kitani
  rationale: פִשְׁתִּים ni flax; ‘nyuzi za kitani’ huwasilisha kwa urahisi kitu kinachoweza kuchomeka na kusambaratika.
- source_word: אֲשֶׁר בָּעֲרוּ בָאֵשׁ
  choice: zilizoteketezwa kwa moto
  rationale: Kauli hiyo inaonyesha athari kamili ya moto juu ya nyuzi; ‘zilizoteketezwa’ huhifadhi picha ya kuungua na kupoteza uimara.
- source_word: וַיִּמַּסּוּ
  choice: vikayeyuka, vikaanguka
  rationale: ‘Vikayeyuka’ huhifadhi sitiari ya מסס, na ‘vikaanguka’ huweka wazi matokeo ya kuondoka kwa vifungo katika Kiswahili cha kawaida.
- source_word: אֱסוּרָיו
  choice: vifungo vyake
  rationale: Neno hili hurejelea vitu vilivyomfunga. ‘Vifungo’ linafaa kwa kamba na halidokezi pingu za chuma.
- source_word: מֵעַל יָדָיו
  choice: kutoka mikononi mwake
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili ya ‘kutoka juu ya mikono yake’; haiongezi umahususi wa ‘vifundo vya mikono’ ambao haupo wazi katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina la agano יְהוָה; ‘Yahweh’ hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Namna ya kueleza uwezeshaji wa Samsoni na Roho
  choice: Roho wa Yahweh akamjia kwa nguvu
  alternative: Roho wa Yahweh akamshukia kwa nguvu / akamjia kwa uwezo mkuu
  rationale: Kauli hii huhifadhi ujio wa ghafla na wenye nguvu unaoonyeshwa na צלח, bila kuingiza mfumo wa kiteolojia usiotamkwa na simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mwendo wa haraka wa simulizi. ‘Kitani’ imefafanuliwa kwa ‘nyuzi’ ili picha ya kitu kinachoungua iwe wazi kwa msomaji wa kawaida.
