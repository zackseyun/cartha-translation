  text: וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֶ/אֱסָרְ/ךָ֣ יָרַ֔דְנוּ לְ/תִתְּ/ךָ֖ בְּ/יַד פְּלִשְׁתִּ֑ים וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן הִשָּׁבְע֣וּ לִ֔/י פֶּֽן תִּפְגְּע֥וּ/ן בִּ֖/י אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/012.yaml
  text: They said to him, “We have come down to bind you, to hand you over into the hand of the Philistines.” Samson said to them, “Swear to me that you yourselves will not attack me.”
translation:
  language: sw
  text: Wakamwambia, “Tumeshuka ili kukufunga na kukutia mikononi mwa Wafilisti.” Samsoni akawaambia, “Niapieni kwamba ninyi wenyewe hamtanivamia.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶאֱסָרְךָ
  choice: kukufunga
  rationale: Kitenzi hiki kinawakilisha moja kwa moja wazo la kumfunga Samsoni na ni cha kawaida katika Kiswahili sanifu.
- source_word: לְתִתְּךָ בְּיַד פְּלִשְׁתִּים
  choice: kukutia mikononi mwa Wafilisti
  rationale: Nahau ya Kiebrania ya kumtoa mtu ‘katika mkono’ wa wengine ina maana ya kumkabidhi chini ya mamlaka yao; ‘kukutia mikononi mwa’ huhifadhi taswira hiyo kwa Kiswahili cha asili.
- source_word: תִּפְגְּעוּן בִּי
  choice: mtanivamia
  rationale: Katika muktadha huu פגע ב ina maana ya kumshambulia au kumdhuru mtu. ‘Kunivamia’ huwasilisha tendo la kumshambulia bila kuongeza kwamba lazima wamuue.
- source_word: אַתֶּם
  choice: ninyi wenyewe
  rationale: 'Kiwakilishi huru kina mkazo: Samsoni anataka watu wa Yuda wenyewe wasimshambulie, hata kama watamkabidhi kwa Wafilisti.'
theological_decisions:
- issue: Aina ya kiapo alichodai Samsoni
  choice: Niapieni kwamba ninyi wenyewe hamtanivamia
  alternative: Niapieni msije mkanidhuru ninyi wenyewe
  rationale: Tafsiri inadumisha ombi la kiapo na mkazo wa אַתֶּם bila kubainisha zaidi ya maandishi kiwango au matokeo ya shambulio.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; ‘mikononi mwa’ huhifadhi nahau ya chanzo kwa namna ya asili.
