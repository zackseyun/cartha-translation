translation:
  language: sw
  text: Akawapiga nyonga juu ya paja[a] kwa pigo kubwa. Kisha akashuka na kukaa katika ufa wa mwamba wa Etamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “nyonga juu ya paja”; huenda huu ni msemo unaomaanisha kuwapiga au kuwashinda kwa maangamizi makubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: akawapiga
  rationale: Kitenzi נכה humaanisha kupiga au kushambulia; “akawapiga” huhifadhi kitendo bila kudai kwamba kila mmoja aliuawa.
- source_word: שׁוֹק עַל יָרֵךְ
  choice: mguu juu ya paja
  rationale: Huu ni msemo mgumu wa Kiebrania. Tafsiri hii huhifadhi picha halisi na utata wake, huku tanbihi ikieleza maana yake inayowezekana.
- source_word: מַכָּה גְדוֹלָה
  choice: akawashinda vibaya sana
  rationale: Katika muktadha wa mapigano, מַכָּה inaweza kumaanisha pigo, maangamizi, au kushindwa vibaya. Usemi huu ni wa kawaida katika Kiswahili na hauamui kwamba wote waliuawa.
- source_word: וַיֵּרֶד
  choice: akashuka
  rationale: Huhifadhi wazi mwelekeo wa kwenda chini katika simulizi.
- source_word: וַיֵּשֶׁב
  choice: kukaa
  rationale: ישב inaweza kumaanisha kuketi, kukaa mahali, au kuishi; hapa “kukaa” ni ya asili na haibainishi muda wa makazi.
- source_word: בִּסְעִיף
  choice: katika ufa
  rationale: Neno hili huonyesha sehemu iliyopasuka au mwanya; “ufa” linafaa kwa mahali pa kujisitiri katika mwamba.
- source_word: סֶלַע
  choice: mwamba
  rationale: סלע ni mwamba au jabali; “mwamba” ni neno pana na la kawaida katika Kiswahili.
- source_word: עֵיטָם
  choice: Etamu
  rationale: Jina la mahali limetoholewa kwa mfumo wa kawaida wa matamshi ya Kiswahili.
