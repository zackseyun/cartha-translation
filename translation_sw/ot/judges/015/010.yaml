  to: Ndipo watu wa Yuda wakasema, “Kwa nini mmekuja dhidi yetu?” Nao wakasema, “Tumekuja kumfunga Samsoni, ili tumtendee kama alivyotutendea.”
  rationale: The revision retains the draft’s clear modern register and its accurate rendering of the binding and retaliation clauses. It replaces the overly specific ‘kupigana nasi’ with wording that reflects the Hebrew hostile-directional expression without stating that fighting had begun or was necessarily the explicit purpose, and it removes unmarked added emphasis.
