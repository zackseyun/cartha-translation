review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the speakers, Judah, the purpose of binding Samson, and the retaliatory comparison. However, “mmekuja kupigana nasi” makes the hostile intent more specifically an act of fighting than the Hebrew עֲלִיתֶם עָלֵינוּ (‘have come up against us’) states. A less specific ‘against us’ phrasing better preserves the source’s scope.
  naturalness: The dialogue is clear and idiomatic Standard East African Swahili. “Mm ek uja dhidi yetu” is concise and natural in this hostile-context question. Removing the final emphatic “sisi” avoids adding emphasis not marked in the Hebrew.
  terminology: “Watu wa Yuda,” “Samsoni,” “kumfunga,” and “kumtendea” are suitable, natural choices. No theological terminology or disputed rendering requires a note.
  issues:
  - severity: medium
    issue: “Mmekuja kupigana nasi” is more specific than the source phrase.
    rationale: The Hebrew describes coming up/coming against Judah in a hostile sense but does not explicitly say that the Philistines came ‘to fight.’ “Mmekuja dhidi yetu” preserves the hostile orientation without specifying the intended action.
  - severity: low
    issue: The final “sisi” adds emphasis.
    rationale: The Hebrew pronominal suffix ‘to us’ does not independently mark contrastive emphasis. The object marker in “alivyotutendea” fully conveys the meaning.
  revised_text: Ndipo watu wa Yuda wakasema, “Kwa nini mmekuja dhidi yetu?” Nao wakasema, “Tumekuja kumfunga Samsoni, ili tumtendee kama alivyotutendea.”
