base_translation:
  language: en
  yaml_path: translation/ot/judges/015/010.yaml
  text: And the men of Judah said, “Why have you come up against us?” And they said, “We have come up to bind Samson, to do to him just as he did to us.”
translation:
  language: sw
  text: Ndipo watu wa Yuda wakasema, “Kwa nini mmekuja dhidi yetu?” Nao wakasema, “Tumekuja kumfunga Samsoni, ili tumtendee kama alivyotutendea.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ יְהוּדָה
  choice: watu wa Yuda
  rationale: Ingawa אִישׁ iko katika umoja wa kisarufi, hapa ni nomino ya kijumla inayoandamana na kitenzi cha wingi. ‘Watu wa Yuda’ ni Kiswahili cha kawaida na hakilazimishi maana ya wanaume pekee kuliko ushahidi wa muktadha.
- source_word: לָמָה
  choice: Kwa nini
  rationale: Hili ni swali la kawaida linalotaka sababu; ‘Kwa nini’ ni sawa na la asili katika Kiswahili cha sasa.
- source_word: עֲלִיתֶם עָלֵינוּ
  choice: mmekuja kupigana nasi
  rationale: Muundo עלה + עַל unaonyesha kuja dhidi ya mtu kwa uhasama. Kiswahili hakiwezi kuhifadhi kwa urahisi sitiari ya ‘kupanda juu dhidi yetu’; ‘kuja kupigana nasi’ huwasilisha mwendo na uhasama bila kudai kwamba shambulio tayari limeanza.
- source_word: לֶאֱסוֹר
  choice: kumfunga
  rationale: אָסַר humaanisha kufunga au kumtia mtu kifungoni; katika muktadha huu ‘kumfunga’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: שִׁמְשׁוֹן
  choice: Samsoni
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: לַעֲשׂוֹת לוֹ
  choice: ili tumtendee
  rationale: עשה + ל hapa ina maana ya kumtendea mtu jambo. ‘Tumtendee’ huonyesha wazi kuwa tendo linaelekezwa kwake bila kuongeza aina ya adhabu.
- source_word: כַּאֲשֶׁר עָשָׂה לָנוּ
  choice: kama alivyotutendea sisi
  rationale: Muundo huu unaonyesha ulinganisho wa kulipiza kisasi. ‘Kama alivyotutendea sisi’ huhifadhi uwiano huo, huku ‘sisi’ ikitia mkazo unaofaa kwa kauli.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mazungumzo yamewekwa kwa mtiririko wa kawaida; urudiaji wa ‘wakisema’ umebadilishwa mara ya pili kuwa ‘Nao wakasema’ ili kutofautisha wazungumzaji kwa uwazi. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zinazohitajika.
