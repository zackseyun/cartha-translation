source:
  edition: WLC
  text: וַ/יִּצְמָא֮ מְאֹד֒ וַ/יִּקְרָ֤א אֶל יְהוָה֙ וַ/יֹּאמַ֔ר אַתָּה֙ נָתַ֣תָּ בְ/יַֽד עַבְדְּ/ךָ֔ אֶת הַ/תְּשׁוּעָ֥ה הַ/גְּדֹלָ֖ה הַ/זֹּ֑את וְ/עַתָּה֙ אָמ֣וּת בַּ/צָּמָ֔א וְ/נָפַלְתִּ֖י בְּ/יַ֥ד הָ/עֲרֵלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/018.yaml
  text: And he became very thirsty[a], and he called to Yahweh and said, “You have given this great deliverance by the hand of your servant[c][b], and now shall I die from thirst and fall into the hand of the uncircumcised?”
translation:
  language: sw
  text: Naye akawa na kiu sana, akamwita Yahwe[a] na kusema, “Wewe umetoa ukombozi huu mkuu[b] kwa mkono wa mtumishi wako. Je, sasa nitakufa kwa kiu na kuanguka mikononi mwa wasiotahiriwa[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akamlilia Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: “Ukombozi huu mkuu” pia unaweza kutafsiriwa “ushindi huu mkuu” au “wokovu huu mkuu.”
    reason: lexical_alternative
  - marker: c
    text: Neno “wasiotahiriwa” hapa linawahusu maadui wa Israeli, hasa Wafilisti. Ni neno lenye uzito wa kiagano, si jina la kikabila tu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּצְמָא מְאֹד
  choice: akawa na kiu sana
  rationale: Huwakilisha hali ya kuingiwa na kiu kali kwa Kiswahili cha kawaida na cha asili.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: akamwita Yahwe
  rationale: Kitenzi קרא אל hapa ni kumwita mtu kwa ombi au sala; ‘akamwita’ hakiongezi hisia ambazo hazijaelezwa wazi, huku tanbihi ikihifadhi uwezekano wa ‘akamlilia.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi wa Kiswahili badala ya kubadilishwa na cheo.
- source_word: אַתָּה נָתַתָּ
  choice: Wewe umeleta
  rationale: Kauli timilifu inaonyesha tendo lililokamilika ambalo matokeo yake bado yako wazi; ‘umeleta’ ni ya asili pamoja na nomino ‘ukombozi.’
- source_word: בְיַד עַבְדְּךָ
  choice: kwa mkono wa mtumishi wako
  rationale: Inahifadhi sitiari ya Kiebrania ya mkono kama njia au wakala wa tendo, bila kuifupisha kuwa ‘kupitia mtumishi wako.’
- source_word: הַתְּשׁוּעָה הַגְּדֹלָה הַזֹּאת
  choice: ukombozi huu mkuu
  rationale: תשועה inaweza kumaanisha kuokolewa, ukombozi, au ushindi. ‘Ukombozi’ huhifadhi maana ya kuokolewa na Mungu katika tukio la kijeshi bila kuibana kuwa ushindi pekee.
- source_word: וְעַתָּה אָמוּת בַּצָּמָא
  choice: Je, sasa nitakufa kwa kiu
  rationale: Ingawa hakuna kiambishi rasmi cha swali, muktadha unaonyesha swali la balagha; ‘kwa kiu’ huonyesha kisababishi kwa ufasaha.
- source_word: וְנָפַלְתִּי בְּיַד
  choice: na kuanguka mikononi mwa
  rationale: Nahau hiyo ina maana ya kuingia chini ya mamlaka ya mtu; Kiswahili ‘kuanguka mikononi mwa’ huhifadhi picha na maana hiyo.
- source_word: הָעֲרֵלִים
  choice: wasiotahiriwa
  rationale: Tafsiri ya moja kwa moja huhifadhi nguvu ya neno lenye maana ya kiagano badala ya kulibadilisha kimya kimya kuwa jina ‘Wafilisti.’
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya kiagano ya הָעֲרֵלִים
  choice: wasiotahiriwa
  alternative: Wafilisti
  rationale: Neno la asili linawataja maadui kwa kutokuwa na ishara ya agano. Tafsiri ya moja kwa moja huhifadhi mvutano huo, huku tanbihi ikieleza kuwa hapa hasa linawahusu Wafilisti.
- issue: Upana wa maana ya תְּשׁוּעָה
  choice: ukombozi
  alternative: ushindi
  rationale: Katika muktadha huu ni ushindi wa kijeshi uliotolewa na Mungu, lakini neno pia lina wazo la kuokolewa. ‘Ukombozi’ huhifadhi pande zote bila kulifanya fundisho la wokovu wa kiroho pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la balagha umehifadhiwa, na sitiari za ‘mkono’ na ‘kuanguka mikononi’ zimedumishwa kwa kuwa zinaeleweka kwa Kiswahili.
