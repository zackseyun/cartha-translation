translation:
  language: sw
  text: Naye aliwahukumu Israeli katika siku za Wafilisti kwa miaka ishirini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliwaongoza Waisraeli kwa miaka ishirini”; kitenzi cha Kiebrania kinaweza kumaanisha uongozi mpana, si kutoa maamuzi ya mahakama pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: akawa mwamuzi wa
  rationale: Katika kitabu cha Waamuzi, kitenzi שׁפט hapa kinaonyesha kutenda kazi ya mwamuzi, ikihusisha uongozi na utawala, si kutoa maamuzi ya mahakama pekee. Kauli hii ni ya asili zaidi kwa Kiswahili kuliko ‘akaihukumu Israeli’ na inadumisha istilahi kuu ya kitabu.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la pekee limedumishwa kama lilivyo katika Kiebrania; katika muundo ‘mwamuzi wa Israeli’ ni Kiswahili cha kawaida na chenye kueleweka.
- source_word: בִּימֵי
  choice: katika siku za
  rationale: Hii inadumisha nahau ya wakati ya Kiebrania na ni kauli yenye hadhi inayoeleweka katika Kiswahili cha Biblia.
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili.
- source_word: עֶשְׂרִים שָׁנָה
  choice: kwa miaka ishirini
  rationale: Kihusishi ‘kwa’ kinaonyesha muda aliotenda kazi hiyo kwa uwazi na kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya jukumu la Samsoni katika שׁפט
  choice: akawa mwamuzi wa Israeli
  alternative: aliwaongoza Israeli
  rationale: Tafsiri hii inadumisha uhusiano wa kileksia na kifasihi na jina na mfumo wa kitabu cha Waamuzi, bila kupunguza jukumu hilo kuwa hukumu za mahakamani tu wala kuongeza madai kwamba alikuwa mfalme au mtawala wa aina fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo ‘akawa mwamuzi wa’ huepuka maana finyu ya kisasa ya ‘kuhukumu’ huku ukidumisha istilahi ya kitabu. Alama ya tanbihi [a] imewekwa baada ya sentensi.
