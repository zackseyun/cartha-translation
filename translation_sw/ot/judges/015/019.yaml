base_translation:
  language: en
  yaml_path: translation/ot/judges/015/019.yaml
  text: Then God split open the hollow place that is at Lehi[a], and water came out from it. When he drank, his spirit returned and he revived. Therefore he called its name En-hakkore[b], which is at Lehi to this day.
translation:
  language: sw
  text: Ndipo Mungu akapasua shimo lililoko Lehi,[a] na maji yakatoka humo. Alipokunywa, roho yake ikamrudia, naye akahuika. Kwa hiyo akaipa chemchemi hiyo jina En-Hakore,[b] ambayo iko Lehi mpaka leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu akapasua shimo lililokuwa katika taya, na maji yakatoka humo.”
    reason: alternative_reading
  - marker: b
    text: Huenda En-Hakore linamaanisha “Chemchemi ya Mwitaj i” au “Chemchemi ya yule aliyeita,” likirejelea kilio cha Samsoni kwa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְקַע
  choice: akapasua
  rationale: Kitenzi hiki kinaonyesha kupasua au kufungua kwa nguvu; “akapasua” ni cha kawaida na huhifadhi picha halisi ya tendo.
- source_word: הַמַּכְתֵּשׁ
  choice: shimo
  rationale: Ingawa neno hili huweza kumaanisha kinu au shimo la kinu, hapa linaelekea kutaja uwazi au bonde dogo ambako maji yalitokea. “Shimo” ni wazi na halilazimishi picha ya chombo cha nyumbani.
- source_word: בַּלֶּחִי
  choice: lililokuwa Lehi
  rationale: Katika muktadha huu Lehi inatumika kama jina la mahali. Maana nyingine ya msingi, “taya,” imehifadhiwa katika tanbihi kwa sababu inaweza kubadili jinsi muujiza unavyowaziwa.
- source_word: וַיֵּצְאוּ מִמֶּנּוּ מַיִם
  choice: maji yakatoka humo
  rationale: Hii ni Kiswahili cha kawaida kinachofuata kwa karibu mfuatano na mahali pa kutoka kwa maji katika Kiebrania.
- source_word: וַתָּשָׁב רוּחוֹ
  choice: roho yake ikamrudia
  rationale: Neno רוּחַ linaweza kumaanisha roho, pumzi, au nguvu ya uhai. Tafsiri hii huhifadhi upana na mvutano wa maana ya Kiebrania bila kuifupisha kuwa nguvu pekee.
- source_word: וַיֶּחִי
  choice: akapata uhai tena
  rationale: Katika muktadha huu Samsoni alirudiwa na uhai baada ya kudhoofika sana; maneno haya hayaashirii kwamba alikuwa amekufa na kufufuliwa.
- source_word: עֵין הַקּוֹרֵא
  choice: En-Hakore
  rationale: Jina limenukuliwa kwa matamshi katika matini kuu, huku maana yake ya kimakusudi ikielezwa katika tanbihi.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Hii ndiyo kauli ya kawaida ya Kiswahili kwa fomula ya wakati ya Kiebrania.
theological_decisions:
- issue: Mahali palipotokea maji katika בַּלֶּחִי
  choice: Lehi limetafsiriwa kama jina la mahali katika matini kuu.
  alternative: Mungu alipasua shimo lililokuwa katika taya, maji yakatoka humo.
  rationale: Muktadha wa karibu unatumia Lehi kama jina la mahali, na kifungu cha mwisho, “ambayo iko Lehi mpaka leo,” kinaunga mkono zaidi maana ya kijiografia. Hata hivyo, kwa kuwa לֶחִי pia humaanisha “taya,” usomaji huo umehifadhiwa katika tanbihi.
- issue: Maana ya וַתָּשָׁב רוּחוֹ
  choice: roho yake ikamrudia
  alternative: pumzi yake ikamrudia; nguvu zake zikamrudia
  rationale: Tafsiri kuu huhifadhi usemi wa Kiebrania na kutoruhusu uamuzi usio wa lazima kati ya roho, pumzi, na nguvu ya uhai.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida kwa wasomaji wa leo. Majina Lehi na En-Hakore yamenukuliwa; sentensi zimewekwa kwa mtiririko wa asili wa Kiswahili huku zikihifadhi taswira na utata halisi wa Kiebrania.
