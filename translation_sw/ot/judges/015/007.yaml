  yaml_path: translation/ot/judges/015/007.yaml
  text: And Samson said to them, “If this is what you do, then I swear I will take vengeance on you, and after that I will stop.”
translation:
  language: sw
  text: Samsoni akawaambia, “Ikiwa mnafanya jambo kama hili, hakika nitalipiza kisasi juu yenu; na baada ya hayo nitaacha.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם תַּעֲשׂוּן כָּזֹאת
  choice: Ikiwa hivi ndivyo mnavyofanya
  rationale: Huhifadhi muundo wa sharti na maana ya ‘ikiwa mnafanya jambo kama hili’ kwa Kiswahili cha kawaida.
- source_word: כִּי אִם
  choice: hakika sitakoma mpaka
  rationale: 'Katika muktadha huu kishazi kina nguvu ya azimio/sharti: Samsoni hataacha kabla ya kulipiza kisasi. Tafsiri hii huepuka kukifanya kiapo rasmi kisichotajwa wazi katika Kiebrania.'
- source_word: נִקַּמְתִּי בָכֶם
  choice: nitakapolipiza kisasi juu yenu
  rationale: Kitenzi נקם humaanisha kulipiza kisasi; ‘juu yenu’ huonyesha kwamba wao ndio walengwa.
- source_word: וְאַחַר אֶחְדָּל
  choice: baada ya hapo nitaacha
  rationale: 'Hutoa kwa uwazi mpangilio wa matendo: kwanza atalipiza kisasi, kisha ataacha.'
theological_decisions:
- issue: Je, kauli ya Samsoni itafsiriwe kama kiapo rasmi?
  choice: hakika sitakoma mpaka nitakapolipiza kisasi
  alternative: naapa kwamba nitalipiza kisasi
  rationale: Kiebrania kina azimio lenye mkazo lakini hakitumii kitenzi cha kuapa. Chaguo hili huhifadhi nguvu ya kauli bila kuingiza kiapo rasmi kwa uhakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo umehifadhi azimio kali la Samsoni na mfuatano wa kulipiza kisasi kisha kuacha.
