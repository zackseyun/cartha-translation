  text: וַ/יֵּרְד֡וּ שְׁלֹשֶׁת֩ אֲלָפִ֨ים אִ֜ישׁ מִֽ/יהוּדָ֗ה אֶל סְעִיף֮ סֶ֣לַע עֵיטָם֒ וַ/יֹּאמְר֣וּ לְ/שִׁמְשׁ֗וֹן הֲ/לֹ֤א יָדַ֨עְתָּ֙ כִּֽי מֹשְׁלִ֥ים בָּ֨/נוּ֙ פְּלִשְׁתִּ֔ים וּ/מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ וַ/יֹּ֣אמֶר לָ/הֶ֔ם כַּ/אֲשֶׁר֙ עָ֣שׂוּ לִ֔/י כֵּ֖ן עָשִׂ֥יתִי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/011.yaml
  text: Then three thousand men of Judah went down to the cleft of the rock of Etam and said to Samson[a], “Do you not know that the Philistines are ruling over us? What then is this that you have done to us?” And he said to them, “As they did to me, so I have done to them.”
translation:
  language: sw
  text: Ndipo wanaume elfu tatu wa Yuda wakashuka mpaka kwenye ufa wa mwamba wa Etamu[a], wakamwambia Samsoni, “Je, hujui kwamba Wafilisti wanatutawala? Ni nini hiki ulichotutendea?” Akawaambia, “Kama walivyonitendea mimi, ndivyo nilivyowatendea wao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpasuko wa mwamba wa Etamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: wakashuka
  rationale: Kitenzi ירד kinaonyesha mwendo wa kuelekea chini; ‘wakashuka’ ni usemi wa kawaida wa simulizi na huhifadhi mwelekeo huo.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ מִיהוּדָה
  choice: wanaume elfu tatu wa Yuda
  rationale: Muundo huu unaonyesha kundi lililohesabiwa la wanaume wanaotoka au kuhusishwa na Yuda; ‘wa Yuda’ ni fupi na ya kawaida.
- source_word: אֶל סְעִיף סֶלַע עֵיטָם
  choice: mpaka kwenye ufa wa mwamba wa Etamu
  rationale: סְעִיף hapa ina maana ya ufa au mpasuko wa mwamba; ‘ufa’ ni neno wazi la kijiografia, na עֵיטָם limetoholewa kuwa Etamu.
- source_word: הֲלֹא יָדַעְתָּ
  choice: Je, hujui
  rationale: Swali hasi ni la balagha na linarejelea jambo ambalo wasemaji wanaliona kuwa dhahiri.
- source_word: כִּי מֹשְׁלִים בָּנוּ פְּלִשְׁתִּים
  choice: kwamba Wafilisti wanatutawala
  rationale: Mshiriki מֹשְׁלִים unaonyesha utawala unaoendelea; ‘wanatutawala’ huhifadhi maana ya mamlaka juu yao.
- source_word: וּמַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: Kwa nini basi umetutendea hivi?
  rationale: Ingawa muundo wa karibu ni ‘Ni nini hiki ulichotutendea?’, katika Kiswahili cha kawaida swali hili la malalamiko huwasilishwa kwa uwazi kama ‘Kwa nini ... hivi?’; ‘basi’ huunganisha swali na ukweli wa utawala wa Wafilisti.
- source_word: כַּאֲשֶׁר עָשׂוּ לִי כֵּן עָשִׂיתִי לָהֶם
  choice: Kama walivyonitendea mimi, ndivyo nilivyowatendea wao
  rationale: Huhifadhi muundo linganishi wa Kiebrania na kueleza ulipizaji kwa namna ya moja kwa moja bila kuongeza tathmini ya kimaadili.
theological_decisions:
- issue: Toni ya jibu la Samsoni kuhusu kulipiza alilotendewa
  choice: Kama walivyonitendea mimi, ndivyo nilivyowatendea wao.
  alternative: Niliwalipizia kisasi kwa sababu ya walivyonitendea.
  rationale: Aya inaeleza hoja ya Samsoni lakini haitoi hukumu ya wazi kuhusu uadilifu au ubaya wake; tafsiri imehifadhi mvutano huo bila kuingiza tathmini.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Mtindo wa simulizi umetumia viambishi vya mfululizo ‘waka-’. Majina yametoholewa kwa mazoea ya Kiswahili: Wafilisti, Samsoni, Etamu.'
