base_translation:
  language: en
  yaml_path: translation/ot/judges/015/015.yaml
  text: And he found a fresh jawbone of a donkey[a], and he reached out his hand and took it, and with it he struck down a thousand men.
translation:
  language: sw
  text: Akapata taya ya punda iliyokuwa bado mbichi[a]. Akanyoosha mkono wake, akaichukua, akawapiga wanaume elfu moja kwa taya hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taya mpya ya punda.” Kivumishi cha Kiebrania kinaweza kumaanisha kitu kilicho mbichi au kipya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: Akapata
  rationale: Ni tafsiri ya kawaida na ya asili ya kitenzi מצא katika usimulizi wa tukio lililopita.
- source_word: לְחִי חֲמוֹר
  choice: taya ya punda
  rationale: לְחִי hapa ni taya au mfupa wa taya; katika muktadha huu ni sehemu ngumu iliyotumiwa kama silaha. Kiswahili ‘taya ya punda’ ni wazi na cha kawaida.
- source_word: טְרִיָּה
  choice: iliyokuwa bado mbichi
  rationale: Kivumishi hiki kinaonyesha kwamba taya hiyo haikuwa imekauka; ‘bado mbichi’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kulazimisha tafsiri finyu zaidi.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: Akanyoosha mkono wake
  rationale: Inahifadhi picha halisi ya nahau ya Kiebrania na inasikika kwa kawaida katika usimulizi wa Kiswahili.
- source_word: וַיִּקָּחֶהָ
  choice: akaichukua
  rationale: Kiambishi ‘-i-’ kinarejelea taya, na ‘chukua’ ni tafsiri ya moja kwa moja ya לקח bila kuongeza wazo la kuinyakua kwa nguvu.
- source_word: וַיַּךְ בָּהּ
  choice: akawapiga ... kwa taya hiyo
  rationale: נכה kimsingi ni kupiga; tafsiri hii inadumisha kitendo na ala iliyotumiwa bila kubadili kitenzi moja kwa moja kuwa ‘kuua,’ ingawa muktadha wa mapigano unaweza kudokeza matokeo mabaya.
- source_word: אֶלֶף אִישׁ
  choice: wanaume elfu moja
  rationale: אִישׁ katika mazingira haya ya mapigano inarejelea wanaume; mpangilio huu wa idadi ni wa kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa usimulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Mfululizo wa vitenzi vya wakati uliopita unadumisha mwendo wa simulizi la Kiebrania.
