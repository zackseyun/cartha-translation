  text: וַ/יֵּ֣לֶךְ שִׁמְשׁ֔וֹן וַ/יִּלְכֹּ֖ד שְׁלֹשׁ מֵא֣וֹת שׁוּעָלִ֑ים וַ/יִּקַּ֣ח לַפִּדִ֗ים וַ/יֶּ֤פֶן זָנָב֙ אֶל זָנָ֔ב וַ/יָּ֨שֶׂם לַפִּ֥יד אֶחָ֛ד בֵּין שְׁנֵ֥י הַ/זְּנָב֖וֹת בַּ/תָּֽוֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/004.yaml
  text: So Shimshon went and caught three hundred foxes[a], and he took torches and turned them tail to tail, and put one torch between each pair of tails, in the middle.
translation:
  language: sw
  text: Basi Shimshoni akaenda, akakamata mbweha mia tatu[a]. Kisha akachukua mienge, akawageuza mkia kwa mkia, akaweka mwenge mmoja katikati ya kila jozi ya mikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbwe.” Neno la Kiebrania שׁוּעָלִים linaweza kurejelea mbweha au mbwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Ni tafsiri ya kawaida na ya kiasili ya kitenzi הלך katika mfululizo wa masimulizi.
- source_word: שִׁמְשׁוֹן
  choice: Shimshoni
  rationale: Umbo hili la jina limezoeleka katika Biblia za Kiswahili na linafuata kwa karibu jina la Kiebrania Shimshon huku likitamkika kwa urahisi katika Kiswahili.
- source_word: וַיִּלְכֹּד
  choice: akakamata
  rationale: Katika muktadha huu לכד inaeleza kuwakamata wanyama wakiwa hai; 'akakamata' ni sahihi na ya kawaida.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: mia tatu
  rationale: Ni uwasilishaji wa moja kwa moja na wa kawaida wa idadi hiyo katika Kiswahili.
- source_word: שׁוּעָלִים
  choice: mbwe
  rationale: Neno la Kiebrania linaweza kumaanisha mbweha au wanyama wanaofanana nao, kutia ndani mbwe; 'mbwe' linafaa katika Kiswahili cha Afrika Mashariki, huku mbadala 'mbweha' ukihifadhiwa katika tanbihi.
- source_word: לַפִּדִים / לַפִּיד
  choice: mienge / mwenge
  rationale: Hurejelea vitu vinavyowaka vinavyotumiwa kama mienge; hili ni neno la sasa, wazi na linaloeleweka.
- source_word: וַיֶּפֶן זָנָב אֶל זָנָב
  choice: akawaelekeza wawili wawili, mkia kwa mkia
  rationale: Huhifadhi maana halisi ya פנה, 'kuelekeza/kugeuza,' bila kuongeza kwamba aliwafunga, jambo ambalo maandishi hayasemi wazi.
- source_word: וַיָּשֶׂם לַפִּיד אֶחָד
  choice: na kuweka mwenge mmoja
  rationale: Ni tafsiri rahisi na ya kiasili ya שׂים pamoja na yambwa yake.
- source_word: בֵּין שְׁנֵי הַזְּנָבוֹת בַּתָּוֶךְ
  choice: katikati ya kila jozi ya mikia
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo la mwenge kuwa kati ya mikia miwili ya kila jozi na huhifadhi msisitizo wa בַּתָּוֶךְ.
