  text: Then the Philistines went up and camped in Judah[a], and spread out at Lehi.
translation:
  language: sw
  text: Ndipo Wafilisti wakapanda, wakapiga kambi katika Yuda, kisha wakajitanda huko Lehi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakajipanga kivita huko Lehi.” Kitenzi cha Kiebrania kinaweza kudokeza jeshi kuenea katika mpangilio wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: wakapanda
  rationale: Kitenzi עלה kwa kawaida huonyesha kwenda juu au kupanda, na hapa kinaweza pia kudokeza mwendo wa kijeshi bila kulazimisha maana ya ‘walivamia.’
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili cha Biblia.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: חנה humaanisha kuweka au kupiga kambi; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: בִּיהוּדָה
  choice: katika Yuda
  rationale: Kihusishi ב hapa kinaelekea kuonyesha mahali walipoweka kambi, si lazima shabaha ya mashambulizi.
- source_word: וַיִּנָּטְשׁוּ
  choice: wakasambaa
  rationale: Katika muktadha huu wa kijeshi, kitenzi kinaweza kueleza jeshi lililoenea katika eneo. ‘Wakasambaa’ huhifadhi picha hiyo bila kuweka istilahi ya kijeshi isiyosemwa wazi katika Kiebrania.
- source_word: בַּלֶּחִי
  choice: huko Lehi
  rationale: Lehi ni jina la mahali hapa; ‘huko’ linaonyesha kwa kawaida eneo walikosambaa.
