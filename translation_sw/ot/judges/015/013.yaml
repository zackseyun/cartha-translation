translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye hadhi. Mkazo wa miundo ya Kiebrania umeonyeshwa kwa “kabisa” na “hakika,” huku nahau ya mkono na uwezekano wa maana mbalimbali wa סלע vikihifadhiwa katika matini na tanbihi.
