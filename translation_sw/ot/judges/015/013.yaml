base_translation:
  language: en
  yaml_path: translation/ot/judges/015/013.yaml
  text: They said to him[a], “No, but we will surely bind you and hand you over into their hand[b]; yet we will certainly not put you to death.” So they bound him with two new ropes and brought him up from the rock.
translation:
  language: sw
  text: Wakamwambia, “Hapana! Tutakufunga kabisa na kukukabidhi mikononi mwao,[a] lakini hakika hatutakuua.” Basi wakamfunga kwa kamba mbili mpya, wakampandisha kutoka mwambani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kukutia chini ya mamlaka yao.” Nahau ya Kiebrania ni kihalisi “kukukabidhi mkononi mwao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoka kwenye jabali.” Neno la Kiebrania linaweza kumaanisha mwamba, jabali, au mahali penye miamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כִּי
  choice: Hapana! … lakini
  rationale: Muundo huu unakanusha jambo lililotangulia na kisha kulisahihisha au kulifafanua. Usemi huu ni wa kawaida katika Kiswahili na unadumisha utofautishaji wa jibu lao.
- source_word: אָסֹר נֶאֱסָרְךָ
  choice: Tutakufunga kabisa
  rationale: Jina-kitenzi lisilo na kikomo pamoja na kitenzi kilichonyambuliwa linatilia mkazo tendo la kufunga; “kabisa” linawasilisha mkazo huo kwa Kiswahili cha kawaida.
- source_word: וּנְתַנּוּךָ בְיָדָם
  choice: kukukabidhi mikononi mwao
  rationale: Hifadhi taswira ya Kiebrania ya kumtia mtu “mikononi” mwa mwingine, huku “kukabidhi” ikifanya maana ya kumweka chini ya mamlaka yao iwe wazi.
- source_word: וְהָמֵת לֹא נְמִיתֶךָ
  choice: lakini hakika hatutakuua
  rationale: Muundo wa Kiebrania unatilia mkazo ukanushaji. “Hakika hatutakuua” ni ahadi nzito na ya asili katika Kiswahili bila kuongeza wazo lisilokuwamo.
- source_word: וַיַּאַסְרֻהוּ
  choice: wakamfunga
  rationale: Kitenzi kilekile cha kufunga kinadumishwa ili kuhifadhi mshikamano wa msamiati katika mstari.
- source_word: בִּשְׁנַיִם עֲבֹתִים חֲדָשִׁים
  choice: kwa kamba mbili mpya
  rationale: עֲבֹתִים ni kamba au nyuzi nene; “kamba” ni neno wazi na la kawaida, na “mpya” inadumishwa kwa sababu ni muhimu katika simulizi la Samsoni.
- source_word: וַיַּעֲלֻהוּ מִן הַסָּלַע
  choice: wakampandisha kutoka mwambani
  rationale: “Wakampandisha” linaonyesha mwendo wa kwenda juu unaosababishwa na wahusika, na “mwamba” linabaki pana vya kutosha kwa סלע, ambalo linaweza kumaanisha mwamba, jabali, au genge la mawe.
