  text: Then Samson said[a], “With the jawbone of a donkey, a heap, two heaps; with the jawbone of a donkey I have struck down a thousand men.”
translation:
  language: sw
  text: Ndipo Samsoni akasema, “Kwa taya la punda—rundo moja, marundo mawili![a] Kwa taya la punda nimewaangusha wanaume elfu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kina mchezo wa maneno: neno la “punda” linafanana kwa sauti na usemi unaotafsiriwa “rundo moja, marundo mawili.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Muundo wa waw-consecutive unaendeleza simulizi; “ndipo” huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: שִׁמְשׁוֹן
  choice: Samsoni
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: בִּלְחִי הַחֲמוֹר
  choice: Kwa taya la punda
  rationale: לְחִי hapa ni mfupa wa taya uliotumiwa kama silaha, na בְּ inaonyesha chombo. “Kwa taya la punda” ni fupi, wazi, na linafaa katika kauli ya kishairi.
- source_word: חֲמוֹר חֲמֹרָתָיִם
  choice: rundo, marundo mawili
  rationale: Tafsiri hii inafuata kwa karibu usemi wa Kiebrania unaoweza kueleweka kama “rundo, marundo mawili,” huku mlingano wa sauti wa Kiswahili kati ya “punda” na “rundo” ukisaidia kudokeza mchezo wa maneno bila kubadili maana.
- source_word: הִכֵּיתִי
  choice: nimewaangusha
  rationale: נכה humaanisha kupiga au kuangusha; katika muktadha huu watu waliangamizwa. “Nimewaangusha” huhifadhi taswira ya kuwashinda kwa kuwapiga bila kuibadili moja kwa moja kuwa kitenzi “kuua.”
- source_word: אֶלֶף אִישׁ
  choice: wanaume elfu
  rationale: אִישׁ limetumiwa kwa maana ya pamoja katika mazingira ya mapigano; “wanaume elfu” huhifadhi rejeo lake la kiume.
