  text: וַ/יְהִ֨י מִ/יָּמִ֜ים בִּ/ימֵ֣י קְצִיר חִטִּ֗ים וַ/יִּפְקֹ֨ד שִׁמְשׁ֤וֹן אֶת אִשְׁתּ/וֹ֙ בִּ/גְדִ֣י עִזִּ֔ים וַ/יֹּ֕אמֶר אָבֹ֥אָה אֶל אִשְׁתִּ֖/י הֶ/חָ֑דְרָ/ה וְ/לֹֽא נְתָנ֥/וֹ אָבִ֖י/הָ לָ/בֽוֹא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/001.yaml
  text: And after some days[a], in the days of the wheat harvest, Samson visited his wife with a young goat. He said, “Let me go in to my wife, into the inner room.” But her father would not allow him to go in.
translation:
  language: sw
  text: Baada ya muda, wakati wa mavuno ya ngano, Samsoni alimtembelea mke wake akiwa na mwana-mbuzi. Akasema, “Nitaingia kwa mke wangu, katika chumba cha ndani[a].” Lakini baba yake hakumruhusu kuingia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika chumba.” Neno la Kiebrania huenda linamaanisha chumba cha ndani; katika muktadha huu linadokeza chumba cha faragha cha wanandoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: Baada ya muda
  rationale: Nahau hii inaonyesha kwamba muda fulani ulikuwa umepita; tafsiri hii ni ya kawaida katika Kiswahili bila kupoteza maana ya wakati.
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: wakati wa mavuno ya ngano
  rationale: Hutoa kwa uwazi alama mahususi ya msimu iliyomo katika Kiebrania, kwa Kiswahili cha kawaida.
- source_word: וַיִּפְקֹד
  choice: alimtembelea
  rationale: Katika muktadha huu kitenzi kinamaanisha kumtembelea mtu, si kumhesabu, kumteua, au kumwadhibu.
- source_word: אֶת אִשְׁתּוֹ
  choice: mke wake
  rationale: Kiebrania bado kinamtaja mwanamke huyo kuwa mke wa Samsoni, licha ya mvutano wa uhusiano wao katika muktadha.
- source_word: בִּגְדִי עִזִּים
  choice: akiwa amemletea mwana-mbuzi
  rationale: Muundo huu unaonyesha kwamba Samsoni alikuja na mwana-mbuzi, yaelekea kama zawadi; Kiswahili hiki kinaweka uhusiano huo wazi na kwa njia ya asili.
- source_word: אָבֹאָה אֶל אִשְׁתִּי
  choice: Niruhusu niingie kwa mke wangu
  rationale: Huhifadhi maana ya nia au ombi katika umbo la Kiebrania na pia kauli yenye maana ya ukaribu wa kindoa bila kuifafanua kupita kiasi.
- source_word: הֶחָדְרָה
  choice: katika chumba cha ndani
  rationale: Umbo lenye mwelekeo linarejelea kuingia katika chumba; ‘chumba cha ndani’ huhifadhi maana ya mahali bila kukitaja moja kwa moja kuwa chumba cha kulala.
- source_word: וְלֹא נְתָנוֹ אָבִיהָ לָבוֹא
  choice: Lakini baba yake hakumruhusu kuingia
  rationale: Kauli hii inaonyesha kwamba baba yake alimnyima Samsoni ruhusa ya kuingia; tafsiri hii ni wazi na inaendeleza kitenzi ‘kuingia’ kilichotumiwa katika kauli ya Samsoni.
