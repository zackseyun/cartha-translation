  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wa heshima, na unaoeleweka kwa urahisi. Alama ya tanbihi imewekwa baada ya ‘chumba cha ndani,’ ambako tofauti ya kileksika inayofafanuliwa inahusika.
