base_translation:
  language: en
  yaml_path: translation/ot/judges/015/003.yaml
  text: And Samson said to them[b][a], “This time I am blameless with respect to the Philistines when I do them harm.”
translation:
  language: sw
  text: Samsoni akawaambia, “Mara hii sina hatia kuhusiana na Wafilisti[a] nitakapowadhuru[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “niko huru na lawama kwa habari ya Wafilisti.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “nitawatendea mabaya.” Hapa “kuwadhuru” hueleza tendo la uadui linalokusudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם שִׁמְשׁוֹן
  choice: Samsoni akawaambia
  rationale: Muundo huu wa kawaida wa masimulizi ya Kiswahili unawakilisha kitendo cha kusema, jina la msemaji, na kiwakilishi cha watu aliowaambia bila kufanya sentensi kuwa nzito.
- source_word: נִקֵּיתִי
  choice: sina hatia
  rationale: Kitenzi נקה hapa kinaeleza kuwa huru kutokana na hatia au wajibu wa kulaumiwa. ‘Sina hatia’ ni kauli ya hali iliyo wazi na ya kawaida katika Kiswahili.
- source_word: הַפַּעַם
  choice: Mara hii
  rationale: Kirai hiki kinaonyesha hatua hii mpya katika mzozo, sambamba na maana ya ‘wakati huu’ au ‘safari hii.’
- source_word: מִפְּלִשְׁתִּים
  choice: kuhusiana na Wafilisti
  rationale: Baada ya נקה, kihusishi מִן kinaonyesha kutokuwa na hatia kwa habari ya watu fulani, si lazima kujitenga nao kimwili. ‘Kuhusiana na’ huhifadhi uhusiano huo bila kudokeza kwamba Wafilisti wamemtangaza Samsoni kuwa hana hatia.
- source_word: כִּי
  choice: nitakapowatendea
  rationale: כִּי inaweza kuonyesha sababu au hali inayohusika. Muundo wa wakati wenye ‘-takapo-’ unaonyesha mazingira ambamo Samsoni anadai kutokuwa na hatia, huku tanbihi ikiruhusu utata wa kiunganishi hicho kueleweka.
- source_word: עֹשֶׂה אֲנִי עִמָּם רָעָה
  choice: nitakapowatendea madhara
  rationale: Kirai hiki kinaeleza tendo la uadui analolikusudia Samsoni. Wakati ujao wa karibu unafaa muktadha, na ‘madhara’ huonyesha jeraha au hasara inayokusudiwa bila kuongeza hukumu ya kimaadili isiyolazimishwa na muktadha.
theological_decisions:
- issue: Je, simulizi linathibitisha kwamba Samsoni kweli hana hatia?
  choice: 'Kauli imewasilishwa kama dai la Samsoni: ‘sina hatia,’ bila simulizi kuongeza uthibitisho wa kimaadili.'
  alternative: Kutafsiri kwa maneno yanayosema kwamba amehesabiwa haki au kwamba kisasi chake ni cha haki.
  rationale: Kiebrania kinanukuu tathmini ya Samsoni mwenyewe. Tafsiri haipaswi kugeuza dai lake kuwa hukumu ya moja kwa moja ya Mungu au ya msimulizi.
- issue: Uhusiano wa כִּי na dai la kutokuwa na hatia
  choice: Imetafsiriwa kwa muundo wa wakati, ‘nitakapowatendea,’ unaolingana na tendo analokusudia.
  alternative: ‘kwa sababu ninawatendea’ au ‘kwa kuwa nitawatendea,’ ambazo zingeweka wazi zaidi uhusiano wa kisababu.
  rationale: כִּי linaweza kueleweka kwa namna ya kisababishi au kimazingira katika sentensi hii. Muundo uliochaguliwa huhifadhi mantiki ya muktadha bila kuamua kupita kiasi kwamba tendo la kuwadhuru ndilo sababu yenyewe ya kutokuwa na hatia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, katika mtindo wa masimulizi ulio wa sasa na wenye heshima. ‘Samsoni akawaambia’ ni ya kawaida katika simulizi la Biblia bila kuwa ya kizamani. ‘Kuhusiana na’ ni wazi kwa msomaji wa leo, na ‘madhara’ huwasilisha maana ya kimuktadha ya רָעָה.
