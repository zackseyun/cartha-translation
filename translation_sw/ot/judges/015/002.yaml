base_translation:
  language: en
  yaml_path: translation/ot/judges/015/002.yaml
  text: And her father said[a], “I really thought that you utterly hated her, so I gave her to your companion. Is not her younger sister better than she? Please let her be yours instead of her.”
translation:
  language: sw
  text: Naye baba yake akasema, “Kwa kweli nilidhani kwamba ulimchukia kabisa, kwa hiyo nikampa mwenzako.[a] Je, dada yake mdogo si bora kuliko yeye? Tafadhali, awe wako badala yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “rafiki yako.” Neno la Kiebrania linaweza kumaanisha kwa upana rafiki, mshirika, au mwenzi; katika mazingira haya ya arusi, wengine hulielewa kuwa mtu aliyemsindikiza Samsoni kama mwenzake katika arusi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיהָ
  choice: baba yake
  rationale: Kiambishi cha nafsi ya tatu ya kike umoja kinamrejelea mwanamke aliyetajwa katika muktadha; Kiswahili cha kawaida hutumia ‘baba yake.’
- source_word: אָמֹר אָמַרְתִּי
  choice: Kwa kweli nilidhani
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi timilifu unatia mkazo kauli; ‘kwa kweli nilidhani’ huwasilisha mkazo huo kwa Kiswahili cha sasa na cha kawaida.
- source_word: שָׂנֹא שְׂנֵאתָהּ
  choice: unamchukia kabisa
  rationale: Kurudiwa kwa mzizi kwa kutumia kitenzi-jina kisicho na kikomo na kitenzi timilifu kunasisitiza chuki; ‘kabisa’ huhifadhi nguvu hiyo bila kuwa nzito.
- source_word: וָאֶתְּנֶנָּה
  choice: kwa hiyo nikampa
  rationale: Waw ya usimulizi inaendeleza tendo kama matokeo ya dhana ya baba; ‘kwa hiyo’ huonyesha uhusiano huo wa kimantiki.
- source_word: לְמֵרֵעֶךָ
  choice: mwenzako
  rationale: Neno linaweza kumaanisha rafiki, mshirika, au mwenzi. ‘Mwenzako’ ni pana na halibainishi bila msingi jukumu maalumu la arusini.
- source_word: הֲלֹא
  choice: Je, ... si
  rationale: Hutanguliza swali la balagha linalotarajia kukubaliwa; muundo ‘Je, ... si’ ni wa asili na wenye hadhi katika Kiswahili.
- source_word: אֲחֹתָהּ הַקְּטַנָּה
  choice: dada yake mdogo
  rationale: Katika uhusiano wa ndugu, ‘mdogo’ kwa kawaida hueleza umri mdogo badala ya ukubwa wa mwili.
- source_word: טוֹבָה מִמֶּנָּה
  choice: bora kuliko yeye
  rationale: טוֹבָה lina maana pana ya ubora; ‘bora’ huepuka kulifanya limaanishe uzuri wa sura pekee.
- source_word: תְּהִי נָא לְךָ
  choice: Tafadhali, na awe wako
  rationale: Kauli ya matakwa pamoja na נָא huonyesha ombi; tafsiri hii huhifadhi pendekezo hilo bila kuongeza wazi wazo la ndoa lisilotajwa moja kwa moja.
- source_word: תַּחְתֶּיהָ
  choice: badala yake
  rationale: Hapa neno linaonyesha ubadilishaji; ‘badala yake’ ni sawa ya kawaida na iliyo wazi katika Kiswahili.
