    issue: “unamchukia kabisa” uses present/imperfective aspect.
    rationale: The emphatic Hebrew perfect שָׂנֹא שְׂנֵאתָהּ expresses the father’s belief about Samson’s past disposition, not a general present statement. “ulimchukia kabisa” preserves this reference and the emphasis.
