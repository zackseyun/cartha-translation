base_translation:
  language: en
  yaml_path: translation/ot/judges/015/006.yaml
  text: Then the Philistines said[a], “Who did this?” And they said, “Samson, the Timnite’s son-in-law[b], because he took his wife and gave her to his companion.” So the Philistines went up and burned her and her father with fire.
translation:
  language: sw
  text: Ndipo Wafilisti wakauliza, “Ni nani aliyefanya jambo hili?” Wakajibu, “Ni Samsoni, aliyekuwa ameoa binti ya mtu wa Timna, kwa sababu mtu huyo alimchukua mke wa Samsoni na kumpa mwenzake[a].” Basi Wafilisti wakapanda na wakawateketeza kwa moto, yeye na baba yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “rafiki yake.” Neno la Kiebrania linaweza kumaanisha mwenzi au rafiki; katika muktadha wa harusi, wengine hulielewa hasa kuwa msindikizaji wa bwana harusi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “wakawachoma yeye na baba yake kwa moto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la watu hao katika Kiswahili cha Biblia na linafaa katika muktadha huu.
- source_word: מִי עָשָׂה זֹאת
  choice: Ni nani aliyefanya jambo hili?
  rationale: Kauli hii inatoa swali la moja kwa moja na la kawaida katika Kiswahili huku ikihifadhi wakati wa tendo la simulizi.
- source_word: חֲתַן הַתִּמְנִי
  choice: mkwe wa yule mtu wa Timna
  rationale: חָתָן humaanisha mtu aliye katika uhusiano wa ndoa, hapa Samsoni akiwa mume wa binti ya mtu wa Timna. ‘Mkwe’ huhifadhi istilahi ya uhusiano, na ‘mtu wa Timna’ huepuka kulifanya jina la mahali kuwa kabila.
- source_word: כִּי
  choice: kwa sababu
  rationale: Neno hili linaanzisha sababu ya Samsoni kufanya alichofanya; ‘kwa sababu’ ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: לָקַח אֶת אִשְׁתּוֹ
  choice: mtu huyo alimchukua mke wa Samsoni
  rationale: Kiebrania kina kiima kilichodokezwa na kiwakilishi ambacho kinaweza kutatanisha katika Kiswahili. Kutaja ‘mtu huyo’ na ‘mke wa Samsoni’ kunabainisha wahusika bila kubadili maana ya muktadha.
- source_word: וַיִּתְּנָהּ לְמֵרֵעֵהוּ
  choice: na kumpa mwenzake
  rationale: מֵרֵעַ inaweza kumaanisha mwenzi au rafiki. ‘Mwenzake’ huhifadhi upana huo bila kuamua kwamba alikuwa rasmi msindikizaji mkuu wa bwana harusi.
- source_word: וַיַּעֲלוּ
  choice: wakaenda
  rationale: Ingawa kitenzi kina maana ya msingi ya ‘kwenda juu/kupanda,’ hapa ni usemi wa mwendo katika simulizi. ‘Wakaenda’ ni ya asili katika Kiswahili bila kuingiza mwelekeo usio wazi kwa msomaji.
- source_word: וַיִּשְׂרְפוּ אוֹתָהּ וְאֶת אָבִיהָ בָּאֵשׁ
  choice: kumteketeza mwanamke huyo pamoja na baba yake kwa moto
  rationale: Tafsiri hii inahifadhi kutajwa wazi kwa moto na inaonyesha kwamba mwanamke na baba yake walikuwa waathiriwa, bila kuongeza moja kwa moja maneno ‘hadi kufa.’
