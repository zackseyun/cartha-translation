base_translation:
  language: en
  yaml_path: translation/ot/judges/015/017.yaml
  text: And when he had finished speaking[a], he threw the jawbone from his hand, and he called that place Ramath-lehi.
translation:
  language: sw
  text: Alipomaliza kusema, akautupa ule mfupa wa taya kutoka mkononi mwake, akapaita mahali pale Ramath-lehi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda Ramath-lehi humaanisha “Kilima cha Mfupa wa Taya” au “Kiinuko cha Mfupa wa Taya.” Jina hilo linahifadhi mchezo wa maneno unaohusisha neno la Kiebrania lehi, yaani “taya” au “mfupa wa taya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: Alipomaliza kusema
  rationale: 'Muundo wa כְּ pamoja na kitenzi-jina cha כלה na לְדַבֵּר una maana ya wakati: “alipomaliza kusema.” Huu ni usemi wa kawaida na wa asili katika Kiswahili.'
- source_word: וַיַּשְׁלֵךְ
  choice: akautupa
  rationale: Kitenzi kinaonyesha kutupa au kuondoa kwa kutupa. “Akautupa” ni wazi na hakiongezi kiwango cha nguvu kisichoelezwa na Kiebrania.
- source_word: הַלְּחִי
  choice: ule mfupa wa taya
  rationale: Katika muktadha, neno hili linarejelea mfupa wa taya ya punda alioutumia Samsoni kama silaha. “Mfupa wa taya” ni wazi kuliko “taya” peke yake.
- source_word: מִיָּדוֹ
  choice: kutoka mkononi mwake
  rationale: Hii inafuata maana ya moja kwa moja ya kihusishi מן pamoja na “mkono,” huku ikibaki ya kawaida katika Kiswahili.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: akapaita mahali pale
  rationale: קרא katika muundo huu ni kupa jina. “Akapaita mahali pale” ni Kiswahili cha asili kinachohifadhi tendo la kukiita au kukipa mahali jina.
- source_word: רָמַת לֶחִי
  choice: Ramath-lehi
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa katika matini kuu. Maana na mchezo wa maneno unaohusisha לֶחִי, “taya,” umeelezwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mfuatano wa vitenzi wenye kiambishi -ka- unawakilisha vizuri masimulizi ya Kiebrania. Kiashiria “ule” kinarejelea mfupa wa taya uliotajwa katika muktadha uliotangulia.
