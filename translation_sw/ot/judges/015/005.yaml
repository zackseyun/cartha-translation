base_translation:
  language: en
  yaml_path: translation/ot/judges/015/005.yaml
  text: He set fire to the torches and let them go into the standing grain of the Philistines[a], and burned up the shocks and the standing grain[b], and even the olive groves.
translation:
  language: sw
  text: Akawasha mienge moto[a], kisha akawaachilia waende katika nafaka ya Wafilisti iliyokuwa imesimama shambani. Akateketeza kuanzia marundo ya nafaka hadi nafaka iliyokuwa imesimama shambani, na hadi mashamba ya mizeituni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vijiti vya moto.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kutoka rundo la nafaka hadi nafaka iliyosimama, na hadi shamba la mizeituni.” Nomino hizi zinaweza kutumiwa kwa maana ya jumla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבְעֶר אֵשׁ
  choice: Akawasha moto
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha tendo la kuwasha au kukoleza moto, kama ilivyo maana ya kitenzi בער katika Hiphil pamoja na אֵשׁ.
- source_word: בַּלַּפִּידִים
  choice: katika mienge
  rationale: “Mienge” ni neno la kawaida na linaloeleweka kwa vitu vinavyowashwa ili vitoe moto; uwezekano wa maana ya vijinga vya moto umewekwa katika tanbihi.
- source_word: וַיְשַׁלַּח
  choice: akawaachilia waingie
  rationale: Kitenzi kina maana ya kuwatuma au kuwaachilia. Kiambishi cha ngeli ya viumbe hai kinarejelea wanyama wa mstari uliotangulia bila kurudia habari ambayo haijatajwa wazi katika mstari huu.
- source_word: בְּקָמוֹת פְּלִשְׁתִּים
  choice: katika mashamba ya nafaka ya Wafilisti
  rationale: קָמָה ni nafaka ambayo bado imesimama shambani. “Mashamba ya nafaka” ni usemi wa asili kwa Kiswahili na muktadha unaweka wazi kuwa haikuwa imevunwa.
- source_word: וַיַּבְעֵר
  choice: Akateketeza
  rationale: Katika matumizi haya ya pili, kitenzi kinaeleza matokeo ya uharibifu wa moto; “akateketeza” huwasilisha kuungua kabisa kwa lugha ya kawaida yenye heshima.
- source_word: מִגָּדִישׁ
  choice: nafaka zilizorundikwa
  rationale: גָּדִישׁ ni lundo au rundo la nafaka iliyovunwa. Tafsiri hii ni wazi zaidi kwa wasomaji wa kisasa kuliko istilahi maalumu ya kilimo.
- source_word: וְעַד קָמָה
  choice: na nafaka iliyokuwa bado imesimama shambani
  rationale: Hii inadumisha tofauti ya kilimo kati ya nafaka iliyokwisha kuvunwa na ile iliyokuwa bado ikimea shambani.
- source_word: וְעַד כֶּרֶם זָיִת
  choice: hata mashamba ya mizeituni
  rationale: כֶּרֶם pamoja na זַיִת humaanisha eneo lililopandwa mizeituni. “Hata” huonyesha kufika kwa uharibifu hadi huko bila kubadili maana ya msingi.
