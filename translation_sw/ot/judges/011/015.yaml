base_translation:
  language: en
  yaml_path: translation/ot/judges/011/015.yaml
  text: 'And he said to him[a], “Thus says Jephthah: Israel did not take the land of Moab or the land of the sons of Ammon.”'
translation:
  language: sw
  text: 'Naye akamwambia, “Yeftha asema hivi: Israeli haikuchukua nchi ya Moabu wala nchi ya wana wa Amoni.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “nchi ya Waamoni.” Kiebrania: “nchi ya wana wa Amoni.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: Naye akamwambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi na kuonyesha wazi kwamba alisema maneno hayo kwake.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Hii ni kauli rasmi ya kuwasilisha ujumbe; Kiswahili hiki ni cha kawaida na kinadumisha uzito wa tamko la Kiebrania.
- source_word: יִפְתָּח
  choice: Yeftha
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: לֹא לָקַח
  choice: haikuchukua
  rationale: Kitenzi 'kuchukua' kinadumisha maana pana ya לקח bila kuongeza wazo la unyang’anyi au ushindi wa kijeshi lisilosemwa moja kwa moja hapa.
- source_word: אֶרֶץ
  choice: nchi
  rationale: '''Nchi'' linafaa kwa eneo la kisiasa na kijiografia, na linaruhusu urudiaji wa muundo wa Kiebrania.'
- source_word: מוֹאָב
  choice: Moabu
  rationale: Hili ni umbo la jina linalotumika kwa kawaida katika Kiswahili.
- source_word: בְּנֵי עַמּוֹן
  choice: wana wa Amoni
  rationale: Tafsiri hii inadumisha kwa karibu usemi halisi wa Kiebrania; umbo la kawaida zaidi la jina la kabila limetolewa katika tanbihi.
