language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ֠/יִּתֵּן יְהוָ֨ה אֱלֹהֵֽי יִשְׂרָאֵ֜ל אֶת סִיח֧וֹן וְ/אֶת כָּל עַמּ֛/וֹ בְּ/יַ֥ד יִשְׂרָאֵ֖ל וַ/יַּכּ֑וּ/ם וַ/יִּירַשׁ֙ יִשְׂרָאֵ֔ל אֵ֚ת כָּל אֶ֣רֶץ הָ/אֱמֹרִ֔י יוֹשֵׁ֖ב הָ/אָ֥רֶץ הַ/הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/021.yaml
  text: And Yahweh[a], the God of Israel, gave Sihon and all his people into the hand of Israel, and they struck them down. So Israel took possession of all the land of the Amorites who lived in that land.
translation:
  language: sw
  text: Yahwe, Mungu wa Israeli, akawatia Sihoni na watu wake wote mikononi mwa Israeli[a], nao wakawapiga. Hivyo Israeli wakaitwaa nchi yote ya Waamori waliokuwa wakiishi katika nchi hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “katika mkono wa Israeli,” msemo unaomaanisha kuwa chini ya mamlaka ya Israeli.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: akawatia ... mikononi mwa Israeli
  rationale: Kitenzi נתן pamoja na msemo ‘katika mkono wa’ humaanisha kuwatia chini ya mamlaka ya mwingine. ‘Mikononi mwa’ huhifadhi taswira ya Kiebrania na inaeleweka kwa kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kwa tahajia inayosomeka kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huu ni mnyororo wa umilikaji unaomtambulisha Yahwe kuwa Mungu wa Israeli.
- source_word: סִיחוֹן
  choice: Sihoni
  rationale: Hili ndilo toleo la jina linalofuata mfumo wa sauti na tahajia ya Kiswahili.
- source_word: כָּל עַמּוֹ
  choice: watu wake wote
  rationale: עַם humaanisha watu; muktadha ni wa vita, lakini maandishi hayasemi wazi ‘jeshi,’ kwa hiyo maana pana imehifadhiwa.
- source_word: וַיַּכּוּם
  choice: nao wakawapiga
  rationale: נכה katika simulizi la vita huonyesha kuwapiga na kuwashinda maadui. ‘Wakawapiga’ huhifadhi nguvu ya kitenzi bila kuongeza maelezo yasiyotajwa.
- source_word: וַיִּירַשׁ
  choice: wakaitwaa
  rationale: ירש hapa inaonyesha Israeli kuichukua nchi na kuimiliki baada ya ushindi; ‘wakaitwaa’ ni ya asili na inafaa muktadha huu.
- source_word: כָּל אֶרֶץ הָאֱמֹרִי
  choice: nchi yote ya Waamori
  rationale: Umoja wa Kiebrania ‘Mwamori’ umetumiwa kwa maana ya jamii nzima; Kiswahili cha kawaida hutumia wingi ‘Waamori’ hapa.
- source_word: יוֹשֵׁב הָאָרֶץ הַהִיא
  choice: waliokuwa wakiishi katika nchi hiyo
  rationale: Kirai hiki kinawaeleza Waamori kwa pamoja na kinahifadhi urudiaji wa neno ‘nchi’ uliopo katika Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina la Mungu moja kwa moja. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya עַם katika muktadha wa vita
  choice: watu wake wote
  alternative: jeshi lake lote
  rationale: Ingawa huenda waliotajwa walihusika vitani, neno lenyewe ni ‘watu’; tafsiri haipaswi kulifanya kuwa ‘jeshi’ bila ulazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa urahisi. Kiunganishi cha simulizi ‘aka-/waka-’ kinatunza mwendo wa vitenzi vya Kiebrania. ‘Israeli’ imetumiwa kwa maana ya watu kwa upatanisho wa wingi unaoeleweka kwa kawaida katika Kiswahili.
