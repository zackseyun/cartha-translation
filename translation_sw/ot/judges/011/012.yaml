  text: וַ/יִּשְׁלַ֤ח יִפְתָּח֙ מַלְאָכִ֔ים אֶל מֶ֥לֶךְ בְּנֵֽי עַמּ֖וֹן לֵ/אמֹ֑ר מַה לִּ֣/י וָ/לָ֔/ךְ כִּֽי בָ֥אתָ אֵלַ֖/י לְ/הִלָּחֵ֥ם בְּ/אַרְצִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/012.yaml
  text: Then Jephthah sent messengers to the king of the Ammonites[a], saying, “What is there between me and you, that you have come against me to fight in my land?”
translation:
  language: sw
  text: Ndipo Yeftha akatuma wajumbe kwa mfalme wa Waamoni, akisema, “Kuna nini kati yangu na wewe,[a] hata umenijia ili kupigana katika nchi yangu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nina jambo gani nawe?” Nahau ya Kiebrania inaonyesha uhasama au mgogoro kati ya pande mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Ndipo ... akatuma
  rationale: Muundo wa simulizi unaendeleza mfululizo wa matukio; “Ndipo” pamoja na kitenzi cha -ka- huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: יִפְתָּח
  choice: Yeftha
  rationale: Jina limetoholewa kwa umbo linalofaa Kiswahili na linalokaribia jina la Kiebrania.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu wa mawasiliano kati ya watawala, neno linamaanisha wajumbe wa kibinadamu, si malaika.
- source_word: אֶל מֶלֶךְ בְּנֵי עַמּוֹן
  choice: kwa mfalme wa Waamoni
  rationale: “Wana wa Amoni” ni jina la kikabila; “Waamoni” ni namna ya kawaida na iliyo wazi ya kulitaja kwa Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hutambulisha maneno ya moja kwa moja kwa mtiririko wa kawaida wa Kiswahili.
- source_word: מַה לִּי וָלָךְ
  choice: Kuna nini kati yangu na wewe
  rationale: Inahifadhi taswira ya nahau ya Kiebrania na kuwasilisha mgogoro au uhasama bila kuufafanua kupita kiasi.
- source_word: כִּי
  choice: hata
  rationale: Katika swali hili, “hata” linaunganisha malalamiko na kitendo kilicholisababisha kwa Kiswahili cha asili.
- source_word: בָאתָ אֵלַי
  choice: umenijia
  rationale: Huhifadhi kwa karibu maana ya “umekuja kwangu”; muktadha wa uhasama unawekwa wazi na kishazi kinachofuata.
- source_word: לְהִלָּחֵם
  choice: ili kupigana
  rationale: Hutoa kusudi la kuja na maana ya kushiriki katika mapigano kwa lugha wazi.
- source_word: בְּאַרְצִי
  choice: katika nchi yangu
  rationale: Huhifadhi kihusishi cha mahali “katika” na maana halisi ya ardhi au eneo linalodaiwa na msemaji.
