  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיח֥וֹן מֶֽלֶךְ הָ/אֱמֹרִ֖י מֶ֣לֶךְ חֶשְׁבּ֑וֹן וַ/יֹּ֤אמֶר ל/וֹ֙ יִשְׂרָאֵ֔ל נַעְבְּרָה נָּ֥א בְ/אַרְצְ/ךָ֖ עַד מְקוֹמִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/019.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], king of Heshbon, and Israel said to him[b], “Please let us pass through your land to our place.”
translation:
  language: sw
  text: Ndipo Israeli akatuma wajumbe[b] kwa Sihoni, mfalme wa Waamori, mfalme wa Heshboni. Israeli akamwambia, “Tafadhali, turuhusu tupite katika nchi yako hadi mahali pangu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “mahali pangu,” Israeli akizungumza kama jamii moja. Linganisha ombi linalofanana katika Hesabu 21:22.
    reason: cross_reference
  - marker: b
    text: Neno “wajumbe” hapa pia linaweza kutafsiriwa “wawakilishi,” kwa kuwa walitumwa katika mazingira ya kidiplomasia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma
  rationale: Ni kitenzi cha kawaida cha usimulizi kinachoendeleza mfululizo wa matukio; “akatuma” ni Kiswahili cha asili na wazi.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu wa mawasiliano kati ya watawala, neno linamaanisha wawakilishi wa kibinadamu, si malaika.
- source_word: סִיחוֹן
  choice: Sihoni
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: mfalme wa Waamori
  rationale: Inahifadhi wazi cheo cha Sihoni na utambulisho wa watu aliowatawala.
- source_word: מֶלֶךְ חֶשְׁבּוֹן
  choice: mfalme wa Heshboni
  rationale: Cheo cha pili kinachofafanua eneo la utawala wa Sihoni kimehifadhiwa kama kilivyo katika Kiebrania.
- source_word: וַיֹּאמֶר לוֹ יִשְׂרָאֵל
  choice: Israeli akamwambia
  rationale: Kiebrania linataja Israeli tena kwa uwazi; tafsiri inahifadhi urudiaji huo na kumtaja Israeli kama jamii moja.
- source_word: נַעְבְּרָה נָּא
  choice: Tafadhali, turuhusu tupite
  rationale: Muundo huu unaonyesha ombi la heshima. Kiswahili hiki kinaeleza wazi kuwa ruhusa ya kupita inaombwa.
- source_word: בְאַרְצְךָ
  choice: katika nchi yako
  rationale: Pamoja na kitenzi cha kupita, usemi huu unaeleweka kwa kawaida kuwa ni kusafiri kupitia eneo la Sihoni.
- source_word: עַד מְקוֹמִי
  choice: hadi mahali pangu
  rationale: Kiebrania cha WLC kina kiwakilishi cha nafsi ya kwanza umoja, “pangu.” Tafsiri inakihifadhi badala ya kukibadili kuwa wingi, ingawa Israeli anaongea kama jamii.
theological_decisions:
- issue: Israeli kama jamii inayosema kwa nafsi ya umoja
  choice: mahali pangu
  alternative: mahali petu
  rationale: Maandishi ya Kiebrania yana umoja “pangu,” huku ombi la kitenzi likiwa katika wingi. Tafsiri inahifadhi mvutano huu wa kisarufi na dhana ya Israeli kama jamii moja badala ya kuupatanisha kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Urudiaji wa “Israeli” na vyeo viwili vya Sihoni umehifadhiwa ili kufuata muundo wa Kiebrania; alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
