  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: inahifadhi nahau ya kufungua kinywa kwa Yahwe, ombi la kutendewa kulingana na kilichotoka kinywani mwa baba, msingi wa sababu, na kisasi cha Yahwe dhidi ya adui Waamoni. Haisuluhishi utata kuhusu utekelezaji wa nadhiri.'
