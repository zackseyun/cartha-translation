id: JDG.11.36
reference: Judges 11:36
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֵלָ֗י/ו אָבִ/י֙ פָּצִ֤יתָה אֶת פִּ֨י/ךָ֙ אֶל יְהוָ֔ה עֲשֵׂ֣ה לִ֔/י כַּ/אֲשֶׁ֖ר יָצָ֣א מִ/פִּ֑י/ךָ אַחֲרֵ֡י אֲשֶׁ֣ר עָשָׂה֩ לְ/ךָ֙ יְהוָ֧ה נְקָמ֛וֹת מֵ/אֹיְבֶ֖י/ךָ מִ/בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/036.yaml
  text: And she said to him[a], “My father, you have opened your mouth to Yahweh; do to me according to what has gone out from your mouth, since Yahweh has taken vengeance for you on your enemies[b], on the sons of Ammon.”
translation:
  language: sw
  text: Akamwambia, “Baba yangu, umefungua kinywa chako kwa Yahwe;[a] unitendee sawasawa na neno lililotoka kinywani mwako, kwa kuwa Yahwe amekulipizia kisasi juu ya adui zako, yaani Waamoni.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kufungua kinywa kwa Yahwe” ni nahau ya Kiebrania inayomaanisha kutoa nadhiri nzito kwa maneno.
    reason: cultural_note
  - marker: b
    text: 'Kwa neno: “wana wa Amoni.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצִיתָה אֶת־פִּיךָ אֶל־יְהוָה
  choice: umefungua kinywa chako kwa Yahwe
  rationale: Inahifadhi taswira halisi ya nahau ya Kiebrania kuhusu kuweka nadhiri kwa maneno mbele za Yahwe; tanbihi inaeleza maana yake.
- source_word: עֲשֵׂה לִי
  choice: unitendee
  rationale: Kitenzi pamoja na kiambishi cha nafsi ya kwanza kinaeleza kitendo kinachomwelekea binti; ‘unitendee’ ni Kiswahili cha kawaida kisichobainisha mapema namna nadhiri itakavyotimizwa.
- source_word: כַּאֲשֶׁר יָצָא מִפִּיךָ
  choice: sawasawa na neno lililotoka kinywani mwako
  rationale: Kinadumisha taswira ya maneno kutoka kinywani na kuonyesha kuwa neno lililotamkwa lina nguvu ya kumfunga aliyelisema.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: kwa kuwa
  rationale: Katika muktadha huu kishazi kinaonyesha sababu ya kukubali kwake, si mfuatano wa wakati pekee.
- source_word: עָשָׂה לְךָ יְהוָה נְקָמוֹת
  choice: Yahwe amekulipizia kisasi
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo la Yahwe kutenda matendo ya kulipiza kisasi kwa niaba ya Yeftha.
- source_word: מֵאֹיְבֶיךָ מִבְּנֵי עַמּוֹן
  choice: juu ya adui zako, yaani Waamoni
  rationale: ‘Juu ya’ huonyesha walengwa wa kisasi, na ‘yaani’ huonyesha kuwa Waamoni ndio adui wanaotajwa; ‘Waamoni’ ni jina la kawaida la taifa hilo katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Namna nadhiri ya Yeftha ingetimizwa kwa binti yake
  choice: Maneno ya binti yametafsiriwa bila kusema kama nadhiri hiyo ilihusu dhabihu ya kifo au kuwekwa wakfu maisha yote.
  alternative: Kutafsiri kwa namna inayoamua kwamba angeuawa kama dhabihu, au kwamba angeishi maisha yote akiwa bikira katika huduma.
  rationale: Mstari huu unaonyesha kukubali kwake kutendewa kulingana na neno la baba yake, lakini hauelezi moja kwa moja namna nadhiri hiyo ingetimizwa. Tafsiri inadumisha utata huo wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya kinywa imehifadhiwa kwa sababu ni muhimu katika muundo wa mstari, huku tanbihi ikifafanua nahau hiyo.
