  text: וַ/תֵּ֧לֶד אֵֽשֶׁת גִּלְעָ֛ד ל֖/וֹ בָּנִ֑ים וַ/יִּגְדְּל֨וּ בְֽנֵי הָ/אִשָּׁ֜ה וַ/יְגָרְשׁ֣וּ אֶת יִפְתָּ֗ח וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֹֽא תִנְחַ֣ל בְּ/בֵית אָבִ֔י/נוּ כִּ֛י בֶּן אִשָּׁ֥ה אַחֶ֖רֶת אָֽתָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/002.yaml
  text: And Gilead’s wife bore him sons. When the sons of the wife grew up, they drove Jephthah out and said to him, “You will not have an inheritance in our father’s house, for you are the son of another woman.”
translation:
  language: sw
  text: Mke wa Gileadi akamzalia wana. Wana wa huyo mke walipokuwa watu wazima, wakamfukuza Yeftha na kumwambia, “Wewe hutapata urithi katika nyumba ya baba yetu, kwa sababu wewe ni mwana wa mwanamke mwingine.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשֶׁת גִּלְעָד
  choice: Mke wa Gileadi
  rationale: Muundo huu unafuata kirai cha Kiebrania kwa uwazi na kumtofautisha mke huyu na mama ya Yeftha aliyetajwa katika mstari uliotangulia.
- source_word: בְנֵי הָאִשָּׁה
  choice: wana wa huyo mke
  rationale: Kibainishi cha Kiebrania kinarejelea mke aliyetajwa tayari; ‘huyo mke’ ni Kiswahili cha kawaida na huhifadhi rejeo hilo bila kuongeza ‘wake,’ neno ambalo halipo hapa.
- source_word: וַיִּגְדְּלוּ
  choice: walipokuwa watu wazima
  rationale: Katika muktadha huu kitenzi kinaonyesha kwamba walifikia utu uzima, ndipo wakachukua hatua ya kumfukuza Yeftha.
- source_word: לֹא תִנְחַל
  choice: hutapata urithi
  rationale: Kitenzi נחל hapa kinahusu kupata sehemu ya urithi; tafsiri hii ni ya asili katika Kiswahili na haifanyi nyumba yenyewe kuwa kitu kinachorithiwa.
- source_word: בְּבֵית אָבִינוּ
  choice: katika nyumba ya baba yetu
  rationale: ‘Nyumba’ huhifadhi maana pana ya בֵּית, ambayo inaweza kumaanisha jamaa au ukoo wa baba pamoja na mali yake.
theological_decisions:
- issue: Hadhi ya Yeftha katika familia na haki yake ya urithi
  choice: Maneno yanawasilishwa kama madai ya wana wa mke wa Gileadi, bila kuthibitisha kwamba madai yao yalikuwa halali.
  alternative: Kutafsiri kwa namna inayoonyesha wazi kwamba Yeftha hakuwa na haki ya kisheria ya kurithi.
  rationale: Kiebrania kinasimulia walichomwambia Yeftha lakini hakitoi hapa hukumu ya moja kwa moja juu ya uhalali wa kitendo chao; tafsiri haipaswi kutatua suala hilo kimadhehebu au kisheria.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha simulizi, cha heshima, na kinachoeleweka kwa msomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Gileadi na Yeftha.'
