base_translation:
  language: en
  yaml_path: translation/ot/judges/011/011.yaml
  text: So Jephthah went with the elders of Gilead[a], and the people made him head and commander over them[b]. And Jephthah spoke all his words before Yahweh at Mizpah.
translation:
  language: sw
  text: Basi Yeftha akaenda pamoja na wazee wa Gileadi, nao watu wakamweka kuwa mkuu na kamanda wao[a]. Yeftha akasema maneno yake yote mbele za Yahwe huko Mispa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamteua kuwa mkuu na mtawala wao.” Neno la Kiebrania lililotafsiriwa “kamanda” linaweza pia kumaanisha “mtawala” au “mkuu wa jeshi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Yeftha akarudia masharti yake yote mbele za Yahwe huko Mispa.” Kiebrania kinasema kihalisi, “akasema maneno yake yote.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ יִפְתָּח עִם זִקְנֵי גִלְעָד
  choice: Yeftha akaenda pamoja na wazee wa Gileadi
  rationale: Muundo huu unaonyesha hatua inayofuata katika simulizi na unaendeleza wazi maana ya kuandamana pamoja.
- source_word: וַיָּשִׂימוּ הָעָם אוֹתוֹ עֲלֵיהֶם
  choice: nao watu wakamweka ... wao
  rationale: Kitenzi שׂים pamoja na עַל hapa kinaonyesha kumteua au kumweka mtu katika mamlaka juu ya wengine; 'wakamweka' ni cha kawaida na kinadumisha taswira ya Kiebrania.
- source_word: לְרֹאשׁ
  choice: kuwa mkuu
  rationale: רֹאשׁ ni 'kichwa' kihalisi lakini hapa ni sitiari ya kiongozi mkuu; 'mkuu' ni Kiswahili cha kawaida na chenye heshima.
- source_word: וּלְקָצִין
  choice: na kamanda
  rationale: קָצִין inaweza kumaanisha mtawala, mkuu, au kamanda. Kwa muktadha wa vita vinavyokaribia, 'kamanda' linaonyesha wajibu wa kijeshi huku tanbihi ikihifadhi maana nyingine.
- source_word: וַיְדַבֵּר יִפְתָּח אֶת כָּל דְּבָרָיו
  choice: Yeftha akasema maneno yake yote
  rationale: Tafsiri hii inafuata usemi mpana wa Kiebrania bila kuamua kwamba yalikuwa masharti, kiapo, sala, au marudio rasmi.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Ni usemi wa kawaida wa Kibiblia unaodokeza uwepo na ushuhuda wa Mungu katika mazingira haya mazito.
- source_word: בַּמִּצְפָּה
  choice: huko Mispa
  rationale: Jina la mahali limetoholewa kwa namna inayosomeka katika Kiswahili, na 'huko' linaonyesha mahali tukio lilipofanyika.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la agano moja kwa moja. 'Yahwe' hulitaja kwa namna inayokaribia matamshi yanayokubaliwa na inayofaa mofolojia ya Kiswahili, bila kulibadilisha kuwa cheo.
- issue: Maana ya maneno ya Yeftha mbele za Yahwe
  choice: akasema maneno yake yote
  alternative: akarudia masharti yake yote; akaeleza mambo yake yote
  rationale: Kiebrania hakibainishi wazi kama alikuwa anarudia masharti, anaweka makubaliano mbele za Mungu, anaomba, au anaapa. Tafsiri kuu inadumisha upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na hadhi inayofaa maandiko. 'Yeftha,' 'Gileadi,' na 'Mispa' ni maumbo yaliyotoholewa; lugha huepuka istilahi za dhehebu na haifafanui kupita kiasi hali ya hotuba ya Yeftha.
