source:
  edition: WLC
  text: וְ/הָיָ֣ה הַ/יּוֹצֵ֗א אֲשֶׁ֨ר יֵצֵ֜א מִ/דַּלְתֵ֤י בֵיתִ/י֙ לִ/קְרָאתִ֔/י בְּ/שׁוּבִ֥/י בְ/שָׁל֖וֹם מִ/בְּנֵ֣י עַמּ֑וֹן וְ/הָיָה֙ לַֽ/יהוָ֔ה וְ/הַעֲלִיתִ֖/הוּ עוֹלָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/031.yaml
  text: then whatever comes out from the doors of my house to meet me when I return in peace from the Ammonites shall be Yahweh’s[a], and I will offer it up as a burnt offering.
translation:
  language: sw
  text: basi chochote kitakachotoka milangoni mwa nyumba yangu kunilaki, nitakaporudi salama kutoka kwa Waamoni, kitakuwa cha BWANA[a], nami nitakitoa kuwa sadaka ya kuteketezwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitakuwa cha BWANA, au nitakitoa kuwa sadaka ya kuteketezwa.” Baadhi ya wafasiri huchukua kiunganishi cha Kiebrania hapa kuwa na maana ya kutenganisha, hivyo kuwe na matokeo mawili yanayowezekana kutegemeana na kilichotoka kumlaki Yeftha.
    reason: alternative_reading
lexical_decisions:
- source_word: הַיּוֹצֵא אֲשֶׁר יֵצֵא
  choice: chochote kitakachotoka
  rationale: Muundo wa Kiebrania unaacha wazi kama kitakachotoka ni mtu au mnyama. “Chochote” huhifadhi utata huo, tofauti na “yeyote,” ambalo lingeelekeza kwa mtu pekee.
- source_word: מִדַּלְתֵי בֵיתִי
  choice: katika milango ya nyumba yangu
  rationale: Huhifadhi wingi wa דַּלְתֵי huku ikitoa Kiswahili cha kawaida kinachoonyesha kutoka ndani kupitia milango ya nyumba.
- source_word: לִקְרָאתִי
  choice: kunilaki
  rationale: “Kunilaki” ni usemi wa asili na wenye hadhi unaomaanisha kutoka kwenda kumpokea au kukutana na mtu anayewasili.
- source_word: בְּשׁוּבִי בְשָׁלוֹם
  choice: nitakaporudi salama
  rationale: בְּשָׁלוֹם hapa huonyesha kurudi bila madhara na katika hali njema baada ya vita; “salama” huwasilisha maana hiyo kwa Kiswahili cha sasa.
- source_word: מִבְּנֵי עַמּוֹן
  choice: kutoka kwa Waamoni
  rationale: “Waamoni” ni jina la kawaida la watu hao katika Kiswahili; kihusishi kinaonyesha kurudi kutoka katika mapambano dhidi yao bila kuongeza maneno yasiyopo wazi katika maandishi.
- source_word: וְהָיָה לַיהוָה
  choice: kitakuwa cha BWANA
  rationale: Hueleza kuwa kitakachotoka kitawekwa wakfu au kitakuwa mali ya YHWH, bila kuamua zaidi namna ya kuwekwa wakfu.
- source_word: לַיהוָה
  choice: BWANA
  rationale: Jina la agano YHWH limetafsiriwa kwa desturi ya Kiswahili ya Biblia kama “BWANA.”
- source_word: וְהַעֲלִיתִהוּ עוֹלָה
  choice: nami nitakitoa kuwa sadaka ya kuteketezwa
  rationale: Hii ni nahau ya kawaida ya dhabihu kwa maana ya kutoa kitu kama sadaka ya kuteketezwa. Kiambishi “-to-” kinakubaliana na “chochote” na kuhifadhi uwezekano wa mtu au mnyama bila kuamua mapema.
theological_decisions:
- issue: Iwapo nadhiri ina matokeo moja yaliyounganishwa kwa “na,” au matokeo mawili mbadala yanayotenganishwa kwa “au.”
  choice: 'Matokeo moja: “kitakuwa cha BWANA, nami nitakitoa kuwa sadaka ya kuteketezwa.”'
  alternative: “kitakuwa cha BWANA, au nitakitoa kuwa sadaka ya kuteketezwa.”
  rationale: Kiunganishi ו kwa kawaida ni “na,” na huo ndio usomaji wa moja kwa moja wa sentensi. Kwa kuwa baadhi ya wafasiri hukichukua kwa maana ya kutenganisha ili kutoa matokeo mawili kulingana na kilichotoka, uwezekano huo umehifadhiwa katika tanbihi badala ya kuingizwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kunilaki” kinafaa katika muktadha wa mapokezi na ni fasaha kwa wasomaji wa kawaida. Matini huhifadhi utata kuhusu kama kinachotoka ni mtu au mnyama, pamoja na mvutano wa kitheolojia kuhusu kiunganishi cha mwisho.
