  text: וַ/יִּ֣ירְשׁ֔וּ אֵ֖ת כָּל גְּב֣וּל הָ/אֱמֹרִ֑י מֵֽ/אַרְנוֹן֙ וְ/עַד הַ/יַּבֹּ֔ק וּ/מִן הַ/מִּדְבָּ֖ר וְ/עַד הַ/יַּרְדֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/022.yaml
  text: So they took possession of all the territory of the Amorites[a], from the Arnon as far as the Jabbok[c][b], and from the wilderness as far as the Jordan.
translation:
  language: sw
  text: Basi wakamiliki eneo lote la Waamori[a], kuanzia Arnoni mpaka Yaboki, na kuanzia nyika mpaka Yordani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakalitwaa” au “wakarithi.” Kitenzi cha Kiebrania kinaweza kuwa na maana hizo; hapa kinamaanisha kuingia katika umiliki wa eneo. Kiebrania pia kina “Mwamori” katika umoja wa mkusanyiko, likimaanisha watu wa Waamori.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: wakamiliki
  rationale: Katika muktadha wa kutwaa nchi, kitenzi ירשׁ kinaeleza kuingia katika umiliki au udhibiti wa eneo. “Wakamiliki” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kuifanya iwe urithi wa kupokelewa tu.
- source_word: כָּל
  choice: lote
  rationale: Huhifadhi maana ya ujumla ya quantifier ya Kiebrania na kupatana kisarufi na “eneo.”
- source_word: גְּבוּל
  choice: eneo
  rationale: Ingawa גְּבוּל inaweza kumaanisha mpaka, hapa alama za kijiografia zinaonyesha ardhi yote iliyomo ndani ya mipaka hiyo; “eneo” ni la asili na wazi kwa msomaji wa Kiswahili.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Umoja wa mkusanyiko katika Kiebrania unarejelea taifa zima; Kiswahili hutumia jina la watu katika wingi.
- source_word: מֵאַרְנוֹן
  choice: kuanzia Arnoni
  rationale: Huonyesha mwanzo wa mpaka wa eneo kwa lugha ya kawaida ya Kiswahili.
- source_word: וְעַד הַיַּבֹּק
  choice: mpaka Yaboki
  rationale: Huonyesha kikomo cha eneo kwa ufupi na kwa ufasaha.
- source_word: וּמִן הַמִּדְבָּר
  choice: na kuanzia nyika
  rationale: “Nyika” huonyesha eneo lisilolimwa au la porini bila kudokeza lazima jangwa la mchanga.
- source_word: וְעַד הַיַּרְדֵּן
  choice: mpaka Yordani
  rationale: Hukamilisha jozi ya pili ya mipaka kwa mtindo mfupi na wa kawaida.
