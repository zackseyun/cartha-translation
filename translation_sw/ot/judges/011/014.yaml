translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye hadhi. “Wajumbe” huepuka maana isiyofaa ya malaika, na “Waamoni” huwasilisha nahau ya kikabila kwa lugha ya kawaida.
