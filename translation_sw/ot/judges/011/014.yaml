  text: Then Jephthah again sent messengers to the king of the Ammonites[a].
translation:
  language: sw
  text: Ndipo Yeftha akatuma tena wajumbe kwa mfalme wa Waamoni[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mfalme wa wana wa Amoni,” yaani, mfalme wa watu wa Amoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד
  choice: akatuma tena
  rationale: Muundo huu unaonyesha kurudia au kuendelea kwa tendo. Katika Kiswahili, “tena” pamoja na kitenzi kinachofuata huwasilisha maana hiyo kwa kawaida; “ndipo” huendeleza mfuatano wa simulizi.
- source_word: יִפְתָּח
  choice: Yeftha
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: וַיִּשְׁלַח
  choice: akatuma
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya tendo la kuwatuma watu katika muktadha wa simulizi.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu wa mawasiliano kati ya viongozi, neno hili linamaanisha wajumbe wa kibinadamu, si malaika.
- source_word: אֶל
  choice: kwa
  rationale: Kihusishi hiki kinaonyesha aliyelengwa na ujumbe; “kwa” ni cha kawaida katika usemi wa Kiswahili “kutuma wajumbe kwa...”
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: mfalme wa Waamoni
  rationale: “Wana wa Amoni” ni nahau ya Kiebrania inayowarejelea watu wa Amoni; “Waamoni” ni namna ya asili na wazi ya kuitaja jamii hiyo kwa Kiswahili.
