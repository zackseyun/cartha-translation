base_translation:
  language: en
  yaml_path: translation/ot/judges/011/017.yaml
  text: Then Israel sent messengers to the king of Edom[a], saying, ‘Please let us pass through your land,’ but the king of Edom did not listen. And he also sent to the king of Moab, but he was unwilling[b], so Israel remained at Kadesh.
translation:
  language: sw
  text: Ndipo Israeli akatuma wajumbe kwa mfalme wa Edomu, akisema, “Tafadhali niruhusu nipite katika nchi yako”[a]. Lakini mfalme wa Edomu hakumsikiliza. Pia Israeli akatuma wajumbe kwa mfalme wa Moabu, lakini mfalme huyo hakukubali[b]. Kwa hiyo Israeli akabaki Kadeshi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina nafsi ya kwanza umoja, yaani, “niruhusu nipite,” kwa kuwa Israeli anazungumza kama jamii moja. Pia inaweza kutafsiriwa, “Tafadhali turuhusu tupite.”
    reason: lexical_alternative
  - marker: b
    text: Au “hakuwa tayari” au “alikataa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma
  rationale: Ni kitenzi cha kawaida cha masimulizi kinachoonyesha Israeli aliwatuma wajumbe; umbo la mfululizo wa simulizi limewasilishwa kwa kiambishi ‘aka-’.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu wa mawasiliano kati ya watawala, neno hili linamaanisha wajumbe wa kibinadamu, si malaika.
- source_word: אֶעְבְּרָה נָּא
  choice: Tafadhali niruhusu nipite
  rationale: Huhifadhi ombi la heshima pamoja na nafsi ya kwanza umoja ya Kiebrania, ambapo Israeli anazungumza kama jamii moja.
- source_word: בְאַרְצֶךָ
  choice: katika nchi yako
  rationale: Pamoja na kitenzi ‘kupita,’ usemi huu unaeleweka kwa kawaida kuwa kupita ndani ya eneo la nchi ya Edomu.
- source_word: וְלֹא שָׁמַע
  choice: hakumsikiliza
  rationale: Hapa ‘kusikia’ kuna maana ya kutii au kuitikia ombi, si kusikia sauti tu; ‘hakumsikiliza’ huhifadhi maana hiyo bila kuongeza ukali.
- source_word: וְלֹא אָבָה
  choice: hakukubali
  rationale: Huwasilisha kutokuwa tayari kutoa idhini; ni usemi wa kawaida wa Kiswahili usioongeza maana zaidi ya Kiebrania.
- source_word: וַיֵּשֶׁב
  choice: akabaki
  rationale: Katika simulizi la safari, maana ni kuendelea kukaa mahali hapo, si kuanzisha makazi ya kudumu.
- source_word: בְּקָדֵשׁ
  choice: Kadeshi
  rationale: Jina la mahali limetoholewa kwa tahajia ya kawaida na linafuata moja kwa moja kitenzi ‘akabaki,’ kama ilivyo kawaida katika Kiswahili.
theological_decisions:
- issue: Israeli kuzungumza kwa nafsi ya kwanza umoja
  choice: ‘niruhusu nipite’
  alternative: ‘turuhusu tupite’
  rationale: Kiebrania kina nafsi ya kwanza umoja na kinamwasilisha Israeli kama jamii moja; tafsiri inahifadhi hali hiyo huku tanbihi ikieleza uwezekano wa kutumia wingi kwa Kiswahili cha kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi la Biblia ulio wa kawaida na wenye heshima. ‘Israeli akatuma’ na ‘Israeli akabaki’ humwasilisha Israeli kama jamii moja, kwa kufuata umoja wa Kiebrania. Marudio ya ‘mfalme huyo’ yanaondoa utata wa kiwakilishi bila kubadili mhusika.
