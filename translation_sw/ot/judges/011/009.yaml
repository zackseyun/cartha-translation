source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִפְתָּ֜ח אֶל זִקְנֵ֣י גִלְעָ֗ד אִם מְשִׁיבִ֨ים אַתֶּ֤ם אוֹתִ/י֙ לְ/הִלָּחֵם֙ בִּ/בְנֵ֣י עַמּ֔וֹן וְ/נָתַ֧ן יְהוָ֛ה אוֹתָ֖/ם לְ/פָנָ֑/י אָנֹכִ֕י אֶהְיֶ֥ה לָ/כֶ֖ם לְ/רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/009.yaml
  text: Jephthah said to the elders of Gilead[a], “If you bring me back to fight against the Ammonites, and Yahweh gives them before me[b], I will be your head.”
translation:
  language: sw
  text: Yeftha akawaambia wazee wa Gileadi, “Ikiwa mtanirudisha ili nipigane na Waamoni, na Yahwe akiwatia mbele yangu, mimi nitakuwa mkuu wenu[a].”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kichwa chenu”; yaani, kiongozi au mtawala wenu.
    reason: lexical_alternative
  - marker: b
    text: 'Kauli ya mwisho inaweza pia kueleweka kama swali: “Je, mimi nitakuwa mkuu wenu?”'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשִׁיבִים
  choice: mtanirudisha
  rationale: Kitenzi katika kausativi humaanisha kumfanya mtu arudi. Yeftha alikuwa amefukuzwa, kwa hiyo “mtanirudisha” ni ya kawaida na inahifadhi maana ya kumrudisha mahali alipokuwa.
- source_word: לְהִלָּחֵם
  choice: ili nipigane
  rationale: Hueleza kuingia vitani au kupigana. Kauli hii ni ya kawaida katika Kiswahili na inaonyesha kusudi la kumrudisha Yeftha.
- source_word: בִּבְנֵי עַמּוֹן
  choice: na Waamoni
  rationale: Neno kwa neno ni “wana wa Amoni,” lakini “Waamoni” ndilo jina la kawaida la watu hao. Katika muktadha wa vita, kiambishi cha Kiebrania kinaonyesha kupigana dhidi yao.
- source_word: וְנָתַן יְהוָה אוֹתָם לְפָנַי
  choice: na Yahwe akiwatia mbele yangu
  rationale: Kauli hii inahifadhi taswira ya Kiebrania ya Yahwe kuwaweka maadui “mbele” ya Yeftha, yaani kuwakabidhi kwake ili awashinde, bila kuingiza taswira ya “mkononi” ambayo haipo katika mstari huu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa namna ya kulitamka kama jina binafsi badala ya kulibadili kuwa cheo.
- source_word: לְרֹאשׁ
  choice: mkuu
  rationale: Maana ya msingi ni “kichwa,” lakini hapa limetumiwa kisitiari kumaanisha mkuu au kiongozi. “Mkuu” ni Kiswahili cha kawaida katika muktadha wa uongozi na mamlaka.
- source_word: אָנֹכִי אֶהְיֶה לָכֶם לְרֹאשׁ
  choice: mimi nitakuwa mkuu wenu
  rationale: Kisarufi, Kiebrania ni kauli ya taarifa isiyo na kiashiria dhahiri cha swali. Msisitizo wa “mimi” umehifadhiwa, huku uwezekano wa kuielewa kama swali la kuthibitisha masharti ukitajwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu, kwa hiyo “Yahwe” huhifadhi jina hilo badala ya kulibadili kuwa cheo.
- issue: Nguvu ya kauli אָנֹכִי אֶהְיֶה לָכֶם לְרֹאשׁ
  choice: 'Taarifa: “mimi nitakuwa mkuu wenu”'
  alternative: 'Swali: “je, mimi nitakuwa mkuu wenu?”'
  rationale: Kiebrania hakina kiashiria dhahiri cha swali, hivyo maandishi makuu yanafuata umbo la taarifa. Hata hivyo, kwa kuwa Yeftha anajadili masharti ya kurudi kwake, kauli hiyo inaweza kueleweka pia kama swali la kutaka uthibitisho; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. “Yeftha,” “Gileadi,” na “Waamoni” yanafuata maumbo yaliyozoeleka katika Kiswahili cha Biblia. Kauli ya Kiebrania “mbele yangu” imehifadhiwa ili kutotilia ndani taswira ya “mkononi mwangu” ambayo haipo katika chanzo.
