  text: הֲ/לֹ֞א אֵ֣ת אֲשֶׁ֧ר יוֹרִֽישְׁ/ךָ֛ כְּמ֥וֹשׁ אֱלֹהֶ֖י/ךָ אוֹת֥/וֹ תִירָ֑שׁ וְ/אֵת֩ כָּל אֲשֶׁ֨ר הוֹרִ֜ישׁ יְהוָ֧ה אֱלֹהֵ֛י/נוּ מִ/פָּנֵ֖י/נוּ אוֹת֥/וֹ נִירָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/024.yaml
  text: Will you not possess what Chemosh your god causes you to possess? And all that Yahweh our God has dispossessed before us[b][a], that we will possess.
translation:
  language: sw
  text: Je, hutamiliki kile ambacho Kemoshi, mungu wako, anayekufanya umiliki? Nasi, yote ambayo Yahwe, Mungu wetu, ameyaondoa kutoka mbele yetu, tutayamiliki.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kiebrania kinaweza pia kutafsiriwa “anakupa umiliki” au “anawanyang’anya wengine kwa ajili yako.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kinachorudiwa katika mstari huu kinaweza kumaanisha “kurithi,” “kutwaa milki,” au kupata eneo kwa kuwaondoa waliokuwa wakilikalia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, hutamiliki
  rationale: Huanzisha swali la balagha linalotarajia kukubaliwa; muundo huu ni wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: יוֹרִישְׁךָ
  choice: anakufanya ukimiliki
  rationale: 'Hifadhi hali ya kusababisha ya Hiphil ya ירשׁ: Kemoshi anatajwa katika hoja ya Yeftha kuwa ndiye anayemsababisha mpinzani apate milki.'
- source_word: כְּמוֹשׁ אֱלֹהֶיךָ
  choice: Kemoshi, mungu wako
  rationale: Jina la mungu limetoholewa, na uhusiano wa maelezo umeonyeshwa wazi bila kuongeza kauli ya mwandishi kuhusu uungu wake.
- source_word: תִירָשׁ / נִירָשׁ
  choice: utamiliki / tutamiliki
  rationale: Katika muktadha huu ירשׁ inahusu kupata na kushikilia eneo; ‘miliki’ inadumisha urudiaji wa kitenzi na maana yake ya kieneo.
- source_word: הוֹרִישׁ
  choice: amekiondoa
  rationale: Hiphil ya ירשׁ inaweza kumaanisha kuondoa au kuwanyang’anya waliotangulia ili wengine wapate milki. Tafsiri hii inadumisha wazo la kuondolewa bila kuongeza wahusika ambao hawajatajwa wazi katika sentensi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kwa cheo.
- source_word: מִפָּנֵינוּ
  choice: mbele yetu
  rationale: Huhifadhi taswira ya mahali ya nahau ya Kiebrania, ikirejelea kile kilichoondolewa kutoka mbele ya Israeli.
theological_decisions:
- issue: Kutajwa kwa Kemoshi kama ‘mungu wako’ katika hotuba ya Yeftha
  choice: Kauli imetafsiriwa moja kwa moja kama sehemu ya hoja ya kidiplomasia ya Yeftha.
  alternative: Kuweka alama za kunukuu au kuongeza maneno yanayokanusha uungu au uwezo wa Kemoshi.
  rationale: Kiebrania hakiongezi ufafanuzi huo. Tafsiri inahifadhi usemi wa mhusika bila kudai kwamba msimulizi anakubali uungu halisi wa Kemoshi.
- issue: Maana pana ya ירשׁ katika ushindi na umiliki
  choice: Kitenzi cha umiliki kimedumishwa katika pande zote mbili, huku tendo la Yahwe likitafsiriwa kuwa kuondoa.
  alternative: Kutafsiri kila tukio kuwa ‘kurithi’ au kufanya yote kuwa ‘kuwafukuza’.
  rationale: Mzizi unaweza kueleza kupata eneo na pia kuwaondoa waliolitangulia. Utofauti huu unahifadhi mvutano wa kileksia wa sentensi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa swali la balagha na urudiaji wa ‘miliki’ vimehifadhiwa.
