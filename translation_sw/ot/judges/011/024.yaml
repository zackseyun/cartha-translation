  to: Je, hutamiliki kile ambacho Kemoshi, mungu wako, anayekufanya umiliki? Nasi, yote ambayo Yahwe, Mungu wetu, ameyaondoa kutoka mbele yetu, tutayamiliki.[a][b]
  rationale: Marekebisho yanaondoa “kitu,” ambayo huifanya כָּל אֲשֶׁר iwe finyu kuliko ilivyo katika Kiebrania, na kuboresha muundo wa causative katika kishazi cha kwanza. “Yote ambayo ... ameyaondoa kutoka mbele yetu” huhifadhi utata wa asili kuhusu wanaoondolewa, huku “tutayamiliki” ikirejelea yambwa hiyo wazi. Alama za tanbihi zimewekwa baada ya sentensi ili zisisababishe mpangilio usio wa kawaida wa [b][a] na ili zote mbili zibaki zimefungwa kwa madai ya kileksia ya mstari mzima.
