base_translation:
  language: en
  yaml_path: translation/ot/judges/011/035.yaml
  text: And when he saw her[a], he tore his clothes and said, “Alas, my daughter! You have brought me very low, and you have become the cause of my trouble. For I have opened my mouth to Yahweh, and I cannot turn back.”
translation:
  language: sw
  text: Alipomwona, akararua mavazi yake na kusema, “Ole, binti yangu! Umeniangusha kabisa, nawe umekuwa chanzo cha taabu yangu. Kwa maana nimefungua kinywa changu kwa Yahwe[a], nami siwezi kurudi nyuma.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kueleza maana wazi zaidi, “nimeweka nadhiri kwa Yahwe.” Kiebrania kinasema kihalisi, “nimefungua kinywa changu kwa Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹתוֹ אוֹתָהּ
  choice: Alipomwona
  rationale: Muundo wa simulizi וַיְהִי pamoja na kishazi cha wakati unatolewa kwa Kiswahili cha kawaida kama kishazi rahisi cha wakati; kiwakilishi cha kike kinaelezwa kwa muktadha.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: akararua mavazi yake
  rationale: Hii ni nahau ya kawaida ya kuonyesha huzuni au mshtuko mkubwa; ‘mavazi’ ni neno la heshima na la kawaida.
- source_word: אֲהָהּ
  choice: Ole wangu
  rationale: Kihisishi hiki huonyesha huzuni na fadhaa kubwa; ‘Ole wangu’ kina nguvu ya maombolezo bila kuwa cha mazungumzo mepesi.
- source_word: הַכְרֵעַ הִכְרַעְתִּנִי
  choice: Umenishusha chini kabisa
  rationale: Kitenzi pamoja na infinitivu kamili hukazia sana kushushwa au kuangushwa; ‘chini kabisa’ huhifadhi msisitizo huo kwa Kiswahili cha asili.
- source_word: וְאַתְּ הָיִיתְ בְּעֹכְרָי
  choice: nawe umekuwa chanzo cha taabu yangu
  rationale: Mzizi עכר una maana ya kuleta taabu au maafa. Tafsiri hii ni ya kawaida na haiongezi lawama ya kimaadili kuliko ilivyo katika maandishi.
- source_word: וְאָנֹכִי פָצִיתִי פִי אֶל־יְהוָה
  choice: Kwa maana nimeufungua mdomo wangu kwa Yahwe
  rationale: Taswira halisi ya Kiebrania imehifadhiwa kwa sababu inaeleweka na inaonyesha uzito wa tamko; maana yake ya kuweka nadhiri inaelezwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetolewa kwa unukuzi wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: וְלֹא אוּכַל לָשׁוּב
  choice: nami siwezi kurudi nyuma
  rationale: שוב hapa ni kurudi nyuma kutoka katika tamko au nadhiri iliyotolewa; usemi huu huhifadhi taswira na maana bila kuifafanua kupita maandishi.
theological_decisions:
- issue: Kama tamko la Yeftha lielezwe wazi kuwa nadhiri katika matini kuu
  choice: Kuhifadhi nahau ‘nimeufungua mdomo wangu kwa Yahwe’ na kuweka ufafanuzi katika tanbihi.
  alternative: Nimeweka nadhiri kwa Yahwe.
  rationale: Muktadha unaonyesha kwamba anazungumzia nadhiri, lakini maandishi ya Kiebrania yanatumia nahau nzito zaidi. Kuihifadhi huepuka kufuta taswira na mvutano wa matini.
- issue: Kiwango cha lawama ya Yeftha kwa binti yake
  choice: ‘Umenishusha chini kabisa’ na ‘umekuwa chanzo cha taabu yangu.’
  alternative: Umeniangamiza; umekuwa mharibifu wangu.
  rationale: Maneno ya Kiebrania yanaonyesha uchungu mkali, lakini tafsiri kali zaidi ingeweza kuingiza hukumu au lawama ya kimaadili isiyolazimishwa na matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na sauti ya heshima. Nahau kuu ya Kiebrania na uzito wa maombolezo vimehifadhiwa bila kuongeza ufafanuzi wa kimadhehebu.
