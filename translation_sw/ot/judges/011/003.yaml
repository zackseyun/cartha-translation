  register: Kiswahili Sanifu cha Afrika Mashariki, cha masimulizi, cha sasa na chenye hadhi. Sentensi mbili zimetumiwa kwa mtiririko wa kawaida bila kupoteza mfuatano wa matendo katika Kiebrania. Jina יפתח limetolewa ‘Yeftha,’ na טוב limetolewa ‘Tobu.’
