base_translation:
  language: en
  yaml_path: translation/ot/judges/011/003.yaml
  text: So Jephthah fled from his brothers and lived in the land of Tob[a], and worthless men gathered around Jephthah and went out with him.
translation:
  language: sw
  text: Basi Yeftha akawakimbia ndugu zake, akaishi katika nchi ya Tobu. Watu wasiofaa[a] wakakusanyika kwa Yeftha, nao wakatoka pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “watu watupu”; nahau ya Kiebrania inamaanisha watu wenye tabia au hadhi duni, wala si watu wasiokuwa na mali tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: akawakimbia
  rationale: Kitenzi kinaonyesha kukimbia kwa sababu ya hatari au uhasama; ‘akawakimbia ndugu zake’ ni Kiswahili cha kawaida kinachoonyesha kwamba aliwakimbia wao.
- source_word: מִפְּנֵי אֶחָיו
  choice: ndugu zake
  rationale: Kirai hiki kwa neno halisi ni ‘kutoka mbele ya ndugu zake,’ lakini hapa kinaonyesha kujitenga nao kwa sababu ya shinikizo lao la uhasama.
- source_word: וַיֵּשֶׁב
  choice: akaishi
  rationale: Katika muktadha huu ישב ina maana ya kukaa au kuishi mahali; ‘akaishi’ haisisitizi makazi ya kudumu kuliko chanzo.
- source_word: בְּאֶרֶץ טוֹב
  choice: katika nchi ya Tobu
  rationale: אֶרֶץ ni nchi au eneo; ‘Tobu’ limetoholewa kama jina la mahali kwa matamshi yanayofaa Kiswahili.
- source_word: וַיִּתְלַקְּטוּ אֶל יִפְתָּח
  choice: wakakusanyika kwa Yeftha
  rationale: Umbo la kitenzi linaonyesha watu kujikusanya, na אֶל huonyesha kuelekea kwa Yeftha na kujiunga naye bila kufafanua zaidi muundo wa kundi hilo.
- source_word: אֲנָשִׁים רֵיקִים
  choice: watu wasiofaa
  rationale: Neno רֵיקִים kwa asili ni ‘watupu,’ lakini katika nahau hii linaeleza watu wenye tabia au hadhi duni, si watu wasio na mali tu. ‘Watu wasiofaa’ ni la sasa na lenye nguvu inayokaribia nahau ya Kiebrania bila kuwataja moja kwa moja kuwa wahalifu.
- source_word: וַיֵּצְאוּ עִמּוֹ
  choice: nao wakatoka pamoja naye
  rationale: Tafsiri hii inadumisha uwazi wa יצא; huenda walitoka kwa shughuli au misafara fulani, lakini chanzo hakitaji kusudi wala kusema wazi kwamba walifanya uvamizi.
