  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Maswali mawili ya balagha na ukali wa lawama ya Yeftha yamehifadhiwa. Jina ‘Gileadi’ limetumika kwa umbo lililozoeleka katika Biblia za Kiswahili.
