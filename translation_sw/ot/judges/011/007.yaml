source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִפְתָּח֙ לְ/זִקְנֵ֣י גִלְעָ֔ד הֲ/לֹ֤א אַתֶּם֙ שְׂנֵאתֶ֣ם אוֹתִ֔/י וַ/תְּגָרְשׁ֖וּ/נִי מִ/בֵּ֣ית אָבִ֑/י וּ/מַדּ֜וּעַ בָּאתֶ֤ם אֵלַ/י֙ עַ֔תָּה כַּ/אֲשֶׁ֖ר צַ֥ר לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/007.yaml
  text: Jephthah said to the elders of Gilead[a], “Did you not hate me and drive me out from my father’s house? So why have you come to me now, when you are in distress?”
translation:
  language: sw
  text: Yeftha akawaambia wazee wa Gileadi, “Je, si ninyi mlionichukia na kunifukuza kutoka katika nyumba ya baba yangu? Basi kwa nini mmekuja kwangu sasa, wakati mko katika dhiki?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akawaambia
  rationale: Katika simulizi, wayyiqtol ya אמר inaendelea na mfululizo wa matukio; kwa kuwa walengwa wametajwa, ‘akawaambia’ ni Kiswahili cha kawaida na sahihi.
- source_word: זִקְנֵי גִלְעָד
  choice: wazee wa Gileadi
  rationale: זָקֵן katika wingi wa muundo huu humaanisha wazee wenye jukumu la uongozi wa jamii, si watu wenye umri mkubwa tu.
- source_word: הֲלֹא
  choice: Je, si ninyi
  rationale: Huanzisha swali la balagha linalotarajia kukubaliwa; muundo huu unahifadhi msisitizo kwa wahusika wenyewe.
- source_word: שְׂנֵאתֶם
  choice: mlionichukia
  rationale: Kitenzi שׂנא kwa kawaida humaanisha kuchukia; hakuna haja ya kukipunguza kuwa kukataa tu.
- source_word: וַתְּגָרְשׁוּנִי
  choice: na kunifukuza
  rationale: גרשׁ huonyesha kuondoa au kufukuza kwa nguvu; ‘kunifukuza’ ni wazi na ya kawaida katika Kiswahili.
- source_word: מִבֵּית אָבִי
  choice: kutoka katika nyumba ya baba yangu
  rationale: Tafsiri hii inahifadhi picha ya ‘nyumba ya baba,’ ambayo inaweza kuhusisha makao pamoja na ukoo au jamaa ya baba bila kuifafanua kupita kiasi.
- source_word: וּמַדּוּעַ
  choice: Basi kwa nini
  rationale: ‘Basi’ linaonyesha kwamba swali hili linatokana na shtaka lililotangulia.
- source_word: בָּאתֶם אֵלַי עַתָּה
  choice: mmekuja kwangu sasa
  rationale: Hali timilifu ya Kiswahili ni ya kawaida kwa tendo lililotokea na lenye matokeo katika wakati wa sasa; ‘sasa’ linahifadhi msisitizo wa עַתָּה.
- source_word: כַּאֲשֶׁר צַר לָכֶם
  choice: wakati mko katika dhiki
  rationale: Kifungu kinaonyesha hali iliyowasukuma kuja; צַר לָכֶם huonyesha kuwa katika hali ngumu au dhiki bila kutaja kwa undani chanzo chake.
theological_decisions: []
