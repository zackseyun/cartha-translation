base_translation:
  language: en
  yaml_path: translation/ot/judges/011/013.yaml
  text: And the king of the Ammonites said to Jephthah’s messengers, “Because Israel took my land when it came up from Egypt, from the Arnon as far as the Jabbok and as far as the Jordan, now restore them peacefully.”
translation:
  language: sw
  text: Mfalme wa Waamoni akawaambia wajumbe wa Yeftha, “Kwa sababu Israeli waliichukua nchi yangu walipopanda kutoka Misri, kuanzia Arnoni mpaka Yaboki na mpaka Yordani, basi sasa zirejesheni kwa amani.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ni kwa sababu
  rationale: Huhifadhi jibu la sababu kwa swali la mstari uliotangulia na muundo wa moja kwa moja wa Kiebrania.
- source_word: בַּעֲלוֹתוֹ מִמִּצְרַיִם
  choice: walipopanda kutoka Misri
  rationale: ‘Kupanda’ ni taswira ya kawaida ya Kiebrania kuhusu kuondoka Misri na inaeleweka katika Kiswahili cha kibiblia; wingi unafuata maana ya pamoja ya Israeli.
- source_word: הָשִׁיבָה אֶתְהֶן
  choice: irudisheni
  rationale: Kiambishi cha kitu kinairejelea nchi/maeneo yaliyotajwa; Kiswahili hutumia umoja wa ngeli ya nchi kwa njia ya asili.
- source_word: בְּשָׁלוֹם
  choice: kwa amani
  rationale: Huhifadhi ombi la kurejesha bila vita bila kuongeza wazo lisilosemwa wazi.
theological_decisions:
- issue: Dai la umiliki wa ardhi
  choice: nchi yangu
  alternative: nchi yetu
  rationale: Nafsi ya kwanza umoja katika אַרְצִי ni dai la mfalme mwenyewe; tafsiri hailithibitishi wala kulikanusha, bali inalihifadhi kama kauli yake.
- issue: Utambulisho wa Israeli katika kitenzi cha umoja cha Kiebrania
  choice: Israeli waliichukua ... walipopanda
  alternative: Israeli aliichukua ... alipopanda
  rationale: Kiebrania hutumia ‘Israeli’ kama umoja wa pamoja, lakini Kiswahili cha kawaida humrejelea taifa/watu hawa kwa upatanisho wa wingi; maana ya pamoja imehifadhiwa.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kwa maumbo yaliyozoeleka: Waamoni, Yeftha, Arnoni, Yaboki, na Yordani. Hakuna tanbihi iliyohitajika.'
