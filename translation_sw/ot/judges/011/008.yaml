  text: וַ/יֹּאמְרוּ֩ זִקְנֵ֨י גִלְעָ֜ד אֶל יִפְתָּ֗ח לָ/כֵן֙ עַתָּה֙ שַׁ֣בְנוּ אֵלֶ֔י/ךָ וְ/הָלַכְתָּ֣ עִמָּ֔/נוּ וְ/נִלְחַמְתָּ֖ בִּ/בְנֵ֣י עַמּ֑וֹן וְ/הָיִ֤יתָ לָּ֨/נוּ֙ לְ/רֹ֔אשׁ לְ/כֹ֖ל יֹשְׁבֵ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/008.yaml
  text: And the elders of Gilead said to Jephthah[a], “That is why we have now come back to you, so that you may go with us and fight against the Ammonites[b], and you will be head over all the inhabitants of Gilead.”
translation:
  language: sw
  text: Wazee wa Gileadi wakamwambia Yeftha, “Ndiyo maana sasa tumerudi kwako, ili uende pamoja nasi ukapigane na Waamoni[a], nawe utakuwa mkuu wetu, mwenye mamlaka juu ya wakazi wote wa Gileadi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Amoni,” yaani, Waamoni.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: Wazee wa
  rationale: Neno hili linamaanisha wazee waliotambuliwa kuwa viongozi wa jumuiya; “wazee” linahifadhi cheo hicho cha kijamii na kisiasa.
- source_word: לָכֵן עַתָּה
  choice: Ndiyo sababu sasa
  rationale: Tafsiri hii inaonyesha hitimisho linalotokana na pingamizi la Yeftha katika mstari uliotangulia, pamoja na dharura ya wakati huu.
- source_word: שַׁבְנוּ אֵלֶיךָ
  choice: tumerudi kwako
  rationale: שׁוּב kimsingi ni kurudi; hapa wazee wanarudia kumwendea Yeftha baada ya kukataliwa kwake hapo awali.
- source_word: וְהָלַכְתָּ עִמָּנוּ
  choice: uende pamoja nasi
  rationale: Tafsiri hii inafuata kwa karibu maana ya הלך, “kwenda,” huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: וְנִלְחַמְתָּ בִּבְנֵי עַמּוֹן
  choice: ukapigane na Waamoni
  rationale: “Waamoni” ni jina la kawaida la kikabila kwa maana halisi ya “wana wa Amoni”; muundo “kupigana na” unaonyesha uhasama unaokusudiwa.
- source_word: וְהָיִיתָ לָּנוּ לְרֹאשׁ
  choice: utakuwa mkuu wetu
  rationale: רֹאשׁ, “kichwa,” hutumiwa kimajazi kwa mtawala au kiongozi. “Mkuu wetu” ni Kiswahili cha kawaida kinachohifadhi mamlaka hayo bila kuingiza cheo maalumu kisichotajwa.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: juu ya wakazi wote wa Gileadi
  rationale: “Wakazi wote” huwasilisha kwa uwazi watu wote wanaokaa Gileadi, na “juu ya” huhifadhi upeo wa mamlaka ya Yeftha.
theological_decisions:
- issue: Upeo wa mamlaka aliyoahidiwa Yeftha
  choice: Ahadi inamhusu kuwa mkuu mwenye mamlaka juu ya wakazi wote wa Gileadi, si kamanda wa vita kwa muda tu.
  alternative: Ahadi inahusu uongozi wa kijeshi wa muda wakati wa vita pekee.
  rationale: Kirai וְהָיִיתָ לָּנוּ לְרֹאשׁ לְכֹל יֹשְׁבֵי גִלְעָד kinapanua jukumu lake zaidi ya pigano lenyewe na kulitaja wazi kuwa juu ya wakazi wote wa Gileadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi “wakamwambia” na viunganishi “ili… ukapigane… nawe” huhifadhi mtiririko wa sababu, kusudi, na matokeo wa Kiebrania. Hakuna tanbihi iliyowekwa kwa “tumerudi kwako,” kwa kuwa ndiyo tafsiri ya moja kwa moja ya שַׁבְנוּ אֵלֶיךָ; tanbihi ya Kiingereza katika data inaonekana kuwa na alama iliyohusishwa kimakosa na jina la Yeftha.
