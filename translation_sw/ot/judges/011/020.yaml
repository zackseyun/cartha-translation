translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya maandiko. ‘Waisraeli’ limetumiwa katika sehemu inayowahusu watu wanaopita, huku ‘Israeli’ likihifadhiwa katika kishazi cha mwisho kama jina la taifa au jumuiya. Uhusiano wa sentensi umewekwa wazi bila kubadili maana ya chanzo.
