base_translation:
  language: en
  yaml_path: translation/ot/judges/011/020.yaml
  text: But Sihon did not trust Israel to pass through his territory[a]. So Sihon gathered all his people, and they camped at Jahaz[c][b], and he fought against Israel.
translation:
  language: sw
  text: Lakini Sihoni hakuwaamini Waisraeli kiasi cha kuwaruhusu wapite katika eneo lake[a]. Kwa hiyo Sihoni akawakusanya watu wake wote[b], nao wakapiga kambi huko Yahasa. Kisha akapigana na Israeli[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuiamini Israeli,” au kwa maana inayodokezwa, “hakuwaamini Waisraeli vya kutosha kuwaruhusu wapite.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “watu wake wote.” Maandishi hayasemi wazi “jeshi lake lote,” ingawa muktadha ni wa kijeshi.'
    reason: lexical_alternative
  - marker: c
    text: Au, “akapigana dhidi ya Israeli.” Kiebrania, kwa neno moja moja, “akapigana na Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמִין
  choice: hakuwaamini
  rationale: Hifili ya אמן hapa ina maana ya kuwa na imani au kuwaamini watu fulani. Muktadha unaonyesha kwamba Sihoni hakuwaamini Waisraeli kiasi cha kuwaruhusu wapite, badala ya kusema tu kwamba hakuwaruhusu.
- source_word: עֲבֹר בִּגְבֻלוֹ
  choice: wapite katika eneo lake
  rationale: עבר pamoja na גבול hapa inaeleza kupita ndani ya nchi iliyo chini ya mamlaka ya Sihoni. ‘Eneo’ ni la kawaida na pana kuliko ‘mpaka,’ ambao ungeweza kueleweka kama mstari wa mpaka tu.
- source_word: וַיֶּאֱסֹף
  choice: akawakusanya
  rationale: Kitenzi kinaeleza kuwakusanya au kuwapanga watu kwa ajili ya mapambano bila kuongeza neno ‘jeshi,’ ambalo halipo wazi katika Kiebrania.
- source_word: כָּל עַמּוֹ
  choice: watu wake wote
  rationale: Tafsiri hii inadumisha upana wa עַם. Ingawa muktadha ni wa kijeshi, maandishi hayasemi moja kwa moja ‘jeshi lake lote.’
- source_word: וַיַּחֲנוּ
  choice: nao wakapiga kambi
  rationale: Kitenzi cha wingi kinawahusu watu waliokusanywa. ‘Kupiga kambi’ ni Kiswahili cha sasa na cha kawaida.
- source_word: בְּיָהְצָה
  choice: huko Yahasa
  rationale: Yahasa ni umbo la jina la mahali linalotumiwa katika Kiswahili; ‘huko’ linafaa kwa mahali pa kupiga kambi.
- source_word: וַיִּלָּחֶם עִם
  choice: akapigana na Israeli
  rationale: Kitenzi cha umoja kinamrudisha Sihoni kuwa mtendaji. ‘Kupigana na’ ni Kiswahili cha kawaida kinachoonyesha uadui katika muktadha huu huku kikifuata kihusishi עִם, ‘na.’
