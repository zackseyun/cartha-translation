base_translation:
  language: en
  yaml_path: translation/ot/judges/011/006.yaml
  text: And they said to Jephthah[a], “Come and be our commander, and let us fight against the Ammonites.”
translation:
  language: sw
  text: Nao wakamwambia Yeftha, “Njoo uwe jemadari wetu, nasi tupigane na Waamoni.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Amoni,” jina la kawaida la kikabila linalomaanisha Waamoni.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Nao wakamwambia
  rationale: Muundo wa simulizi unaendeleza tukio linalofuata; ‘Nao wakamwambia’ ni Kiswahili cha kawaida kinachohifadhi mtiririko huo na kuonyesha kwamba maneno yalielekezwa kwa Yeftha.
- source_word: לְיִפְתָּח
  choice: Yeftha
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: לְכָה
  choice: Njoo
  rationale: Katika muktadha huu, amri ya kitenzi הלך ni mwaliko au wito wa kumtaka Yeftha ajiunge nao; ‘Njoo’ huwasilisha maana hiyo kwa kawaida.
- source_word: וְהָיִיתָה לָּנוּ
  choice: uwe ... wetu
  rationale: Ingawa Kiebrania kina maana halisi ya ‘uwe kwetu/kwa ajili yetu,’ muundo wa asili wa Kiswahili ni ‘uwe ... wetu.’
- source_word: לְקָצִין
  choice: jemadari
  rationale: קָצִין humaanisha mkuu au kiongozi, na muktadha wa vita hapa unaunga mkono cheo mahususi cha kijeshi ‘jemadari’ kuliko ‘kiongozi’ kwa ujumla.
- source_word: וְנִלָּחֲמָה
  choice: nasi tupigane
  rationale: Hali ya kusisitiza nia ya nafsi ya kwanza wingi imewasilishwa kwa ‘tupigane’; ‘nasi’ huhifadhi uratibu wa sentensi bila kulazimisha maana ya kusudi pekee.
- source_word: בִּבְנֵי עַמּוֹן
  choice: na Waamoni
  rationale: Pamoja na kitenzi ‘kupigana,’ ‘na’ humtaja mpinzani kwa Kiswahili cha kawaida. ‘Waamoni’ ni jina la kawaida la kabila linalowakilisha usemi halisi ‘wana wa Amoni.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Jemadari’ hudumisha muktadha wa kijeshi, huku ‘nasi tupigane’ ikihifadhi msukumo wa usemi wa Kiebrania bila kuufanya wazi zaidi kuliko chanzo.
