  text: וַ/יַּכֵּ֡/ם מֵ/עֲרוֹעֵר֩ וְ/עַד בּוֹאֲ/ךָ֨ מִנִּ֜ית עֶשְׂרִ֣ים עִ֗יר וְ/עַד֙ אָבֵ֣ל כְּרָמִ֔ים מַכָּ֖ה גְּדוֹלָ֣ה מְאֹ֑ד וַ/יִּכָּֽנְעוּ֙ בְּנֵ֣י עַמּ֔וֹן מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/033.yaml
  text: And he struck them from Aroer as far as the entrance to Minnith[a], twenty cities, and as far as Abel-keramim, with a very great slaughter[d][c][b]. So the sons of Ammon were subdued before the sons of Israel.
translation:
  language: sw
  text: Akawapiga kuanzia Aroeri hadi mahali pa kuingia Minithi[a]—miji ishirini—na hadi Abel-Keramimu[b], kwa pigo kubwa sana[c]. Hivyo Waamoni walitiishwa mbele ya Waisraeli[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi Minithi” au “hadi maingilio ya Minithi.” Usemi wa Kiebrania unaweza kumaanisha mahali pa kuufikia mji au mji wenyewe.
    reason: alternative_reading
  - marker: b
    text: Abel-Keramimu ni jina la mahali. Vipashio vya jina hilo vinaweza kumaanisha “uwanda wa mashamba ya mizabibu,” lakini jina limeachwa katika umbo la toponimu.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa pigo/shambulio kubwa sana.” Neno la Kiebrania linaweza kumaanisha pigo kubwa la kijeshi; halitaji wazi lenyewe idadi ya waliouawa.
    reason: lexical_alternative
  - marker: d
    text: Kwa neno halisi, “wana wa Amoni” na “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: Akawapiga
  rationale: Kitenzi נכה humaanisha kupiga; hapa kinaeleza tendo la kijeshi bila kuamua ndani ya kitenzi chenyewe kwamba wote waliuawa.
- source_word: מֵעֲרוֹעֵר
  choice: kuanzia Aroeri
  rationale: Jina la mahali limetoholewa kwa tahajia inayofaa Kiswahili, huku מִן ikionyesha mwanzo wa eneo.
- source_word: וְעַד בּוֹאֲךָ מִנִּית
  choice: hadi njia ya kuingia Minithi
  rationale: Usemi wa Kiebrania unaweza kuelekeza kwenye njia au mahali pa kuingilia mji; tafsiri hii ni ya kijiografia na inaacha utata huo uelezwe katika tanbihi.
- source_word: עֶשְׂרִים עִיר
  choice: miji ishirini
  rationale: Hii ni tafsiri ya moja kwa moja ya namba na nomino, ikitaja ukubwa wa eneo lililopigwa.
- source_word: וְעַד אָבֵל כְּרָמִים
  choice: na hadi Abel-Keramimu
  rationale: Hili ni jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa maana ya vipashio vyake.
- source_word: מַכָּה גְּדוֹלָה מְאֹד
  choice: kwa pigo kubwa sana
  rationale: מַכָּה ni pigo au kushindwa vibaya katika muktadha wa vita. 'Pigo kubwa sana' huhifadhi taswira ya chanzo bila kulazimisha maana ya mauaji.
- source_word: וַיִּכָּנְעוּ
  choice: walitiishwa
  rationale: Niphal ya כנע inaonyesha kushindwa na kuwekwa chini ya mamlaka au nguvu ya mshindi.
- source_word: בְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Kiswahili cha kawaida hutumia jina la taifa kwa njia ya asili zaidi kuliko usemi halisi 'wana wa Amoni.'
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: mbele ya Waisraeli
  rationale: מִפְּנֵי hapa huonyesha kutiishwa mbele ya mpinzani; 'Waisraeli' ni Kiswahili cha kawaida cha usemi wa Kiebrania 'wana wa Israeli.'
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Majina ya mahali yametoholewa; majina ya mataifa yametolewa kwa maumbo ya kawaida ya Kiswahili. Alama za vistari zinatenga 'miji ishirini' kama maelezo ya ukubwa wa eneo bila kuficha utata wa muundo wa Kiebrania.
