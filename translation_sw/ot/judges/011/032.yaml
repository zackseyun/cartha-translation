base_translation:
  language: en
  yaml_path: translation/ot/judges/011/032.yaml
  text: So Jephthah crossed over to the Ammonites to fight against them[a], and Yahweh gave them into his hand.
translation:
  language: sw
  text: Basi Yeftha akavuka kwenda kwa Waamoni ili kupigana nao[a], naye Yahweh akawatia mkononi mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “akavuka kwenda kwa wana wa Amoni.” Usemi huo unamaanisha kwamba Yeftha aliwaendea Waamoni ili kupigana nao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: akavuka kwenda
  rationale: Kitenzi עבר humaanisha kuvuka au kupita. Katika muktadha huu wa kijeshi, “akavuka kwenda” huhifadhi wazo la kusonga kutoka upande mmoja kwenda mwingine bila kuongeza maana ya kushambulia ambayo haimo katika kitenzi chenyewe.
- source_word: אֶל בְּנֵי עַמּוֹן
  choice: kwenda kwa Waamoni
  rationale: אֶל kwa kawaida humaanisha “kwa/kuelekea,” na בְּנֵי עַמּוֹן ni usemi wa kikabila unaomaanisha Waamoni. Tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: לְהִלָּחֶם בָּם
  choice: ili kupigana nao
  rationale: Muundo wa לחם pamoja na ב unaonyesha kuingia vitani dhidi ya watu fulani. “Kupigana nao” ni Kiswahili cha kawaida kinachowasilisha uhasama huo bila kuzidisha ukubwa wa vita.
- source_word: וַיִּתְּנֵם
  choice: akawatia
  rationale: נתן pamoja na usemi “mkononi mwa” ni nahau ya kukabidhi maadui chini ya uwezo wa mshindi. “Akawatia” huhifadhi muundo na taswira ya Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: בְּיָדוֹ
  choice: mkononi mwake
  rationale: Hii ni nahau ya kijeshi inayoonyesha kuwekwa chini ya mamlaka au uwezo wa mtu. Kiswahili “mkononi mwake” huhifadhi taswira ya chanzo na kinaeleweka katika muktadha.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina binafsi la Mungu, si cheo. Kulitaja “Yahwe” huhifadhi tofauti hiyo bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wazi na wenye heshima. “Waamoni” limetumiwa kama jina la kawaida la kabila, huku tanbihi ikihifadhi muundo halisi “wana wa Amoni.”
