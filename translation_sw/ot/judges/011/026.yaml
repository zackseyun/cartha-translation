translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Majina yametolewa kama Heshboni, Aroeri, na Arnoni. Sentensi ndefu ya Kiebrania imehifadhiwa kwa mtiririko wa kawaida; sitiari isiyo ya kawaida ya 'miji binti' imefafanuliwa katika matini na kuhifadhiwa kihalisi katika tanbihi.
