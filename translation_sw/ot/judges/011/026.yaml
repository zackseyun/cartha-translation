  text: בְּ/שֶׁ֣בֶת יִ֠שְׂרָאֵל בְּ/חֶשְׁבּ֨וֹן וּ/בִ/בְנוֹתֶ֜י/הָ וּ/בְ/עַרְע֣וֹר וּ/בִ/בְנוֹתֶ֗י/הָ וּ/בְ/כָל הֶֽ/עָרִים֙ אֲשֶׁר֙ עַל יְדֵ֣י אַרְנ֔וֹן שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָ֑ה וּ/מַדּ֥וּעַ לֹֽא הִצַּלְתֶּ֖ם בָּ/עֵ֥ת הַ/הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/026.yaml
  text: While Israel has lived in Heshbon and its daughter towns[a], and in Aroer and its daughter towns, and in all the cities that are along the Arnon, for three hundred years[b], why did you not recover them during that time?
translation:
  language: sw
  text: Wakati Israeli alipokuwa akiishi Heshboni na makao yake tegemezi[a], na Aroeri na makao yake tegemezi, na katika miji yote iliyo kando ya Arnoni, kwa miaka mia tatu, kwa nini hamkuvirudisha[b] katika kipindi hicho?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “binti zake,” yaani makazi madogo yanayotegemea mji mkubwa.
    reason: cultural_note
  - marker: b
    text: Au “hamkuviokoa” au “hamkuvikomboa”; katika muktadha maana yake ni kuvidai au kuvirudisha tena.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/שֶׁבֶת
  choice: Kwa kuwa Israeli walikuwa wamekaa
  rationale: Muundo wa ב pamoja na kitenzi-jina cha ישׁב unaonyesha hali ya muda iliyotangulia swali la balagha; Kiswahili hiki kinaonyesha kukaa kwao kwa muda mrefu bila kulazimisha kauli ya wakati wa sasa.
- source_word: בְּנוֹתֶיהָ
  choice: miji yake midogo inayotegemea mji huo
  rationale: Neno hilo ni 'binti zake' kihalisi, lakini ni nahau inayomaanisha makazi madogo yaliyo chini ya mji mkuu; tafsiri hii ya kawaida inaeleza uhusiano huo, huku tanbihi ikihifadhi sitiari ya Kiebrania.
- source_word: עַרְעוֹר
  choice: Aroeri
  rationale: Umbo la jina la mahali linalofaa katika tahajia na matamshi ya Kiswahili.
- source_word: עַל יְדֵי אַרְנוֹן
  choice: kando ya Arnoni
  rationale: Nahau hiyo humaanisha kuwa upande wa, karibu na, au sambamba na; 'kando ya Arnoni' ni ya asili na haibainishi bila msingi kwamba miji yote ilikuwa kwenye kingo hasa.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: kwa miaka mia tatu
  rationale: Kihusishi 'kwa' kinaonyesha kwa kawaida muda ambao kukaa huko kuliendelea.
- source_word: וּמַדּוּעַ
  choice: kwa nini
  rationale: Kiunganishi ו hakihitaji kutafsiriwa kando hapa; swali la balagha linafuata kwa kawaida katika Kiswahili.
- source_word: הִצַּלְתֶּם
  choice: hamkuikomboa
  rationale: Hifili ya נצל inaweza kumaanisha kuokoa au kukomboa. Katika mzozo huu wa eneo, dhamira ni kulirudisha eneo kutoka mamlaka ya Israeli; umoja wa 'i' unarejelea nchi/eneo linalodokezwa na miji iliyotajwa.
- source_word: בָּעֵת הַהִיא
  choice: wakati huo
  rationale: Huhifadhi rejeo la wakati lililo na msisitizo wa kiashiria; katika muktadha linaelekea kipindi cha miaka mia tatu kilichotajwa.
