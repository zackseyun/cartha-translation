base_translation:
  language: en
  yaml_path: translation/ot/judges/011/010.yaml
  text: Then the elders of Gilead said to Jephthah[a], “Yahweh will be witness between us if we do not do according to your word.”
translation:
  language: sw
  text: Ndipo wazee wa Gileadi wakamwambia Yefta, “Yahwe atakuwa shahidi kati yetu[a] ikiwa hatutafanya kama ulivyosema.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “Yahwe atakuwa akisikia kati yetu”—yaani, akisikia akiwa shahidi au mwamuzi kati ya pande hizo mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ndipo ... wakamwambia
  rationale: Kiunganishi cha masimulizi kinaendeleza tukio; “Ndipo” na umbo la kitenzi “wakamwambia” huleta mtiririko wa kawaida wa masimulizi ya Kiswahili.
- source_word: זִקְנֵי גִלְעָד
  choice: wazee wa Gileadi
  rationale: Hili ni fungu la nomino linalowataja viongozi wanaotambulika wa Gileadi; “wazee wa Gileadi” ni Kiswahili sanifu na cha kawaida.
- source_word: יִפְתָּח
  choice: Yefta
  rationale: Umbo “Yefta” linawakilisha jina la Kiebrania kwa namna inayosomeka kwa urahisi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limewasilishwa kama jina binafsi badala ya kubadilishwa kuwa cheo kama “BWANA.” Umbo “Yahwe” ni la kawaida na rahisi kutamkwa katika Kiswahili.
- source_word: יִהְיֶה שֹׁמֵעַ בֵּינוֹתֵינוּ
  choice: atakuwa shahidi kati yetu
  rationale: Neno שֹׁמֵעַ kihalisi linahusu kusikia, lakini katika muktadha huu wa kiapo lina maana ya kusikia kama shahidi au mwamuzi kati ya wahusika. Tafsiri hii inaeleza maana ya kimuktadha kwa Kiswahili cha kawaida huku tanbihi ikihifadhi picha halisi ya kusikia.
- source_word: אִם לֹא
  choice: ikiwa hatu-
  rationale: Hapa fungu hili linaanzisha sharti hasi la kiapo, si kauli rahisi ya kusisitiza.
- source_word: כִדְבָרְךָ כֵּן נַעֲשֶׂה
  choice: hatutafanya kama ulivyosema
  rationale: Kauli hiyo inaahidi kutenda kulingana na neno au masharti ya Yefta. “Kama ulivyosema” ni ya kawaida na inaeleweka wazi katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni kama jina binafsi. “Yahwe” hulihifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Maana ya Yahwe ‘kusikia kati’ ya wahusika
  choice: atakuwa shahidi kati yetu
  alternative: atakuwa akisikia kati yetu; awe mwamuzi kati yetu
  rationale: Katika kiapo, kusikia kati ya wahusika kuna nguvu ya kisheria ya kushuhudia au kuhukumu. “Shahidi” huwasilisha kazi hiyo bila kuamua wazi kwamba hapa Yahwe anaitwa hasa “mwamuzi”; maana halisi ya kusikia imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Sentensi imehifadhi muundo wa kiapo na hali yake ya masharti bila kuongeza maelezo ya kimadhehebu.
