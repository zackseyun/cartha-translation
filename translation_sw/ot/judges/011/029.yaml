base_translation:
  language: en
  yaml_path: translation/ot/judges/011/029.yaml
  text: Then the Spirit of Yahweh came upon Jephthah[a], and he passed through Gilead and Manasseh. He passed through Mizpah of Gilead, and from Mizpah of Gilead he passed on to the Ammonites.
translation:
  language: sw
  text: Ndipo Roho wa Yahweh akamjia Yeftha, naye akapitia Gileadi na Manase. Akapitia Mispa ya Gileadi, na kutoka Mispa ya Gileadi akavuka kwenda kwa Waamoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaendelea kuelekea kwa Waamoni.” Kitenzi cha Kiebrania kinaweza kumaanisha kupita, kuvuka, au kusonga mbele, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עַל יִפְתָּח רוּחַ יְהוָה
  choice: Ndipo Roho wa Yahwe akamjia Yeftha
  rationale: Katika simulizi la Waamuzi, רוּחַ יְהוָה humaanisha Roho wa Mungu anayemtia kiongozi nguvu. Kauli ‘akamjia’ ni ya kawaida katika Kiswahili na inaonyesha tukio la Roho kumjia Yeftha bila kuongeza maelezo yasiyomo katika matini.
- source_word: יִפְתָּח
  choice: Yeftha
  rationale: Hili ni umbo la jina hilo linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: וַיַּעֲבֹר אֶת הַגִּלְעָד וְאֶת מְנַשֶּׁה
  choice: akapitia Gileadi na Manase
  rationale: Kitenzi עבר kikiwa na maeneo kama yambwa kinaonyesha kusafiri kupitia maeneo hayo. ‘Akapitia’ ni Kiswahili cha kawaida na huhifadhi wazo la mwendo kupitia eneo.
- source_word: מִצְפֵּה גִלְעָד
  choice: Mispa ya Gileadi
  rationale: Hili linachukuliwa kuwa jina la mahali, si neno la kawaida linalopaswa kutafsiriwa kuwa ‘mnara wa ulinzi.’ Muundo wa uhusiano umeonyeshwa kwa ‘ya Gileadi.’
- source_word: וּמִמִּצְפֵּה גִלְעָד עָבַר בְּנֵי עַמּוֹן
  choice: na kutoka Mispa ya Gileadi akavuka kuelekea kwa Waamoni
  rationale: ‘A kuvuka kuelekea kwa’ huhifadhi mwendo wa עבר na mwelekeo kwa Waamoni bila kudai wazi kwamba shambulio lilianza mara moja. Kwa kuwa uhusiano wa mwisho unaweza kueleweka kwa njia zaidi ya moja, mbadala umewekwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ina jina la agano יְהוָה. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Asili ya רוּחַ יְהוָה katika muktadha huu
  choice: Roho wa Yahwe anayemjia Yeftha na kumwezesha
  alternative: upepo au pumzi kutoka kwa Yahwe
  rationale: Katika kitabu cha Waamuzi, muundo huu kwa kawaida huashiria uwezeshaji wa kiongozi na Roho wa Yahwe. Tafsiri inadokeza uwezeshaji huo bila kuongeza madai kuhusu matendo yanayofuata au kuyahalalisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Majina yametolewa katika maumbo yanayotambulika katika Biblia za Kiswahili. Kiunganishi ‘ndipo’ na mfululizo wa vitenzi vya ‘aka-’ vinadumisha mtiririko wa kisimulizi wa Kiebrania.
