base_translation:
  language: en
  yaml_path: translation/ot/judges/011/030.yaml
  text: And Jephthah made a vow to Yahweh and said[a], “If you indeed give the Ammonites into my hand,”
translation:
  language: sw
  text: Naye Yeftha akaweka nadhiri kwa Yahwe, akasema, “Ikiwa kweli[a] utawatia Waamoni mkononi mwangu,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa hakika utawatia Waamoni mkononi mwangu.” Kiebrania hutumia kitenzi-jina kamili pamoja na kitenzi kilichonyambulishwa ili kutia mkazo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  choice: akaweka nadhiri
  rationale: Hii ni njia ya asili katika Kiswahili ya kueleza kufanya nadhiri, huku nomino נֶדֶר ikibaki wazi katika tafsiri.
- source_word: יִפְתָּח
  choice: Yeftha
  rationale: Uwasilishaji wa kawaida wa Kiswahili wa jina la Kiebrania יִפְתָּח.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi ל kinaonyesha kwamba nadhiri iliwekwa kwa Yahwe; jina la agano יְהוָה limewasilishwa kama Yahwe.
- source_word: אִם
  choice: Ikiwa
  rationale: Huanzisha sharti la nadhiri, ambalo jibu lake linaendelea katika mstari unaofuata.
- source_word: נָתוֹן תִּתֵּן
  choice: kweli utawatia
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi chenye kikomo unasisitiza tendo; ‘kweli’ huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: בְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Ni jina la kawaida la Kiswahili kwa watu wa Amoni, badala ya tafsiri sisisi ‘wana wa Amoni.’
- source_word: בְּיָדִי
  choice: mkononi mwangu
  rationale: Huhifadhi picha ya Kiebrania ya kutiwa ‘mkononi’ mwa mtu, yaani chini ya uwezo wake, na pia huhifadhi umoja wa ‘mkono.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina la agano moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Nguvu ya sharti katika nadhiri ya Yeftha
  choice: Ikiwa kweli utawatia
  alternative: Ikiwa utawatia; Hakika ukiwatia
  rationale: Tafsiri inahifadhi sharti linaloanzishwa na אִם na pia msisitizo wa נָתוֹן תִּתֵּן, bila kuamua kimbele maana ya kitheolojia ya nadhiri hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Akaweka nadhiri’ ni ya asili kuliko urudiaji sisisi ‘akaahidi nadhiri.’ Alama ya tanbihi [a] imewekwa baada ya ‘akisema’ kwa kufuata safu ya ushauri, ingawa maelezo yake yanahusu kishazi kinachofuata.
