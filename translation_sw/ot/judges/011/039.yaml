  naturalness: “Akamtendea kulingana na nadhiri aliyokuwa ameweka” is understandable but not an idiomatic or suitably direct Swahili rendering of the clause. “Akamfanyia sawasawa na nadhiri yake aliyoiweka” is more natural in elevated narrative Swahili while preserving the ambiguity. “Hakuwa amemjua mwanamume” retains the Hebrew idiom appropriately; the footnote explains it.
  terminology: Nadhiri, desturi, Israeli, and Yeftha are appropriate Standard East African Swahili terms. “Desturi” is preferable here for חֹק in light of the annual communal observance introduced in the following verse.
