base_translation:
  language: en
  yaml_path: translation/ot/judges/011/039.yaml
  text: 'And at the end of two months she returned to her father[a], and he did to her according to his vow that he had vowed. Now she had not known a man[b]. And it became a statute in Israel:'
translation:
  language: sw
  text: 'Miezi miwili ilipokwisha, akarudi kwa baba yake, naye akamfanyia sawasawa na nadhiri yake aliyoiweka.[a] Naye hakuwa amemjua mwanamume.[b] Jambo hilo likawa desturi katika Israeli:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaitimiza juu yake nadhiri aliyokuwa ameweka.” Wafafanuzi hutofautiana kuhusu kama maana yake ni kwamba Yeftha alimtoa kuwa dhabihu au alimweka wakfu aishi maisha yote bila kuolewa; maneno ya Kiebrania hapa hayasuluhishi jambo hilo waziwazi.
    reason: alternative_reading
  - marker: b
    text: Kwa neno halisi, “hakuwa amemjua mwanamume,” nahau ya Kiebrania inayomaanisha kwamba hakuwa amefanya ngono.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שְׁנַיִם חֳדָשִׁים
  choice: Baada ya miezi miwili kwisha
  rationale: Huwasilisha mwisho wa kipindi cha miezi miwili kwa Kiswahili cha kawaida huku ikidumisha maana ya מִקֵּץ.
- source_word: וַתָּשָׁב אֶל אָבִיהָ
  choice: akarudi kwa baba yake
  rationale: Kitenzi שׁוּב kina maana ya kurudi, na tafsiri inadumisha kwamba alirudi kwa baba yake, si kwa ujumla tu nyumbani.
- source_word: וַיַּעַשׂ לָהּ אֶת נִדְרוֹ אֲשֶׁר נָדָר
  choice: akamtendea kulingana na nadhiri aliyokuwa ameweka
  rationale: ‘Akamtendea’ inadumisha uelekeo wa moja kwa moja wa tendo kwake, bila kubainisha zaidi namna nadhiri ilivyotekelezwa; ‘nadhiri aliyokuwa ameweka’ huwasilisha urudiaji wa mzizi נדר kwa Kiswahili cha asili.
- source_word: וְהִיא לֹא יָדְעָה אִישׁ
  choice: Naye alikuwa hajawahi kukutana kimwili na mwanamume
  rationale: Hufafanua kwa lugha ya heshima na ya sasa nahau ya Kiebrania inayomaanisha kutokuwa na mahusiano ya kingono, bila kuibadilisha kuwa tu sifa ya jumla ‘alikuwa bikira.’
- source_word: חֹק
  choice: desturi
  rationale: Katika muktadha huu חֹק inaanzisha tendo la kijamii linalorudiwa kila mwaka katika mstari unaofuata; ‘desturi’ inafaa zaidi kuliko ‘sheria’ rasmi.
- source_word: וַתְּהִי חֹק בְּיִשְׂרָאֵל
  choice: Jambo hilo likawa desturi katika Israeli
  rationale: Huwasilisha kuanzishwa kwa desturi inayoendelea na kurejelea tukio lililotangulia bila kulazimisha tafsiri maalumu ya nadhiri.
theological_decisions:
- issue: Namna Yeftha alivyotimiza nadhiri yake
  choice: Maneno ya msingi yanadumisha uwazi wenye ukali wa Kiebrania kwamba alimfanyia binti yake kulingana na nadhiri yake, bila kutaja wazi kilichofanyika.
  alternative: Kwamba alimtoa kuwa sadaka ya kuteketezwa, au kwamba alimweka wakfu kwa ubikira wa maisha yote.
  rationale: Kiebrania cha mstari huu hakisuluhishi wazi mjadala huo. Tafsiri kuu haipaswi kuingiza hitimisho mojawapo; tanbihi inaeleza uwezekano unaojadiliwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umetunzwa kwa vitenzi vya mfululizo, huku maneno yanayoweza kuamua mjadala wa kitheolojia yakiepukwa. Alama ya nukta mbili imedumishwa kwa sababu sentensi inaendelea katika mstari unaofuata.
