base_translation:
  language: en
  yaml_path: translation/ot/judges/011/037.yaml
  text: 'And she said to her father[a], “Let this thing be done for me: leave me alone for two months, that I may go and wander on the mountains and weep over my virginity[b], I and my companions.”'
translation:
  language: sw
  text: 'Akamwambia baba yake, “Jambo hili na lifanywe kwa ajili yangu: uniache kwa miezi miwili[a], ili niende, nishuke milimani, na niulilie ubikira wangu[b], mimi na rafiki zangu wa kike.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “niache huru kwa miezi miwili.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kuulilia ubikira wangu.” Maneno hayo yanakazia hali yake ya kutokuwa ameolewa na kutokuwa na watoto, bila kutatua hapa swali pana la jinsi ya kufasiri simulizi hili.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: Jambo hili na lifanywe kwa ajili yangu
  rationale: Muundo wa kutendwa wenye maana ya ombi umehifadhiwa, bila kubadili ‘jambo hili’ kuwa ‘ombi hili.’
- source_word: הַרְפֵּה מִמֶּנִּי
  choice: uniache
  rationale: Kitenzi hiki hapa kinamaanisha kumpa nafasi au ruhusa aondoke kwa kipindi alichotaja; ‘uniache’ ni Kiswahili cha kawaida kinachobaki karibu na tamathali ya Kiebrania.
- source_word: שְׁנַיִם חֳדָשִׁים
  choice: kwa miezi miwili
  rationale: Huu ni usemi wa muda wa moja kwa moja; ‘kwa’ huufanya uwe wa kawaida katika Kiswahili.
- source_word: וְאֵלְכָה וְיָרַדְתִּי
  choice: ili niende nishuke
  rationale: Vitenzi vyote viwili vimehifadhiwa. Tafsiri haibadili kitenzi cha pili kuwa ‘kuzunguka,’ ingawa mfuatano huu ni wa pekee kidogo katika Kiswahili.
- source_word: עַל הֶהָרִים
  choice: milimani
  rationale: ‘Milimani’ ni usemi wa asili wa Kiswahili kwa mwendo au kuwapo katika eneo la milima, huku ukihifadhi mazingira ya maandishi.
- source_word: וְאֶבְכֶּה עַל בְּתוּלַי
  choice: na kuulilia ubikira wangu
  rationale: ‘Kuulilia’ huonyesha kulia au kuomboleza kwa sababu ya jambo fulani; ‘ubikira’ huhifadhi mkazo wa hali yake ya kutokuwa ameolewa bila kuongeza hitimisho kuhusu hatima yake.
- source_word: אָנֹכִי וְרֵעוֹתָי
  choice: mimi pamoja na rafiki zangu
  rationale: Huhifadhi msisitizo wa kiwakilishi ‘mimi’ na kuonyesha kwamba atasafiri pamoja na wenzake; umbo la Kiebrania linaonyesha rafiki wa kike, jambo linaloeleweka katika muktadha.
theological_decisions:
- issue: Maana ya binti ya Yeftha kuulilia ubikira wake
  choice: Tafsiri inahifadhi maneno ya aya kuhusu kuomboleza ubikira wake bila kuamua namna yanavyohusiana na hatima yake katika simulizi pana.
  alternative: Kusema wazi kwamba anaomboleza kifo kinachokaribia, au kwamba anaomboleza maisha ya kudumu bila kuolewa.
  rationale: Aya yenyewe inataja ubikira, si kifo moja kwa moja. Kuongeza mojawapo ya maelezo hayo kungetatua mvutano ambao maandishi hapa hayatatui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. Muundo ‘na lifanywe’ ni rasmi kidogo lakini unahifadhi ombi la Kiebrania katika kauli ya kutendwa; ‘ili niende nishuke milimani’ huhifadhi vitenzi viwili vya chanzo bila kuvibadili kuwa wazo la kuzurura.
