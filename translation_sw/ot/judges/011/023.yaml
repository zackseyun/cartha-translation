  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הוֹרִישׁ֙ אֶת הָ֣/אֱמֹרִ֔י מִ/פְּנֵ֖י עַמּ֣/וֹ יִשְׂרָאֵ֑ל וְ/אַתָּ֖ה תִּירָשֶֽׁ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/023.yaml
  text: And now Yahweh[a], the God of Israel, has dispossessed the Amorites from before his people Israel; and are you to possess it?
translation:
  language: sw
  text: Na sasa, Yahweh, Mungu wa Israeli, amewanyang'anya Waamori nchi mbele ya watu wake, Israeli; je, wewe utaimiliki[a] nchi hiyo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utaitwaa” au “utairithi.” Kitenzi cha Kiebrania kinaweza kumaanisha kutwaa au kurithi nchi na kuifanya milki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Ni kiunganishi cha hoja kinachoanzisha hitimisho la Yeftha kutokana na yaliyotangulia; “Basi sasa” huhifadhi uhusiano na msisitizo huo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huhifadhi wazi muundo unaomtambulisha Yahweh kuwa Mungu wa Israeli.
- source_word: הוֹרִישׁ
  choice: amewafukuza
  rationale: Hifili ya ירש hapa ina maana ya kuwaondoa watu katika eneo walilolimiliki. “Amewafukuza” ni ya asili na inayoeleweka kwa urahisi katika Kiswahili, huku muktadha ukionyesha kupoteza nchi.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Umoja wa kikabila katika Kiebrania una maana ya jumuiya; Kiswahili hutumia wingi kwa kundi hili la watu.
- source_word: מִפְּנֵי
  choice: kutoka mbele ya
  rationale: Huhifadhi taswira ya mahali ya usemi wa Kiebrania na kuonyesha kuondolewa kwa Waamori mbele ya Israeli.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: watu wake Israeli
  rationale: Kiwakilishi cha umilikaji kinamhusu Yahweh, na “Israeli” linawatambulisha watu hao.
- source_word: וְאַתָּה
  choice: je, wewe ndiye
  rationale: Muundo huu unaonyesha msisitizo wa kiwakilishi huru na nguvu ya swali la balagha linalomkabili mfalme wa Waamoni.
- source_word: תִּירָשֶׁנּוּ
  choice: utakayeimiliki nchi hiyo
  rationale: Qali ya ירש inaweza kumaanisha kumiliki, kutwaa, au kurithi nchi. “Kuimiliki nchi hiyo” ni wazi na ya asili; “nchi hiyo” inaeleza kile kinachorejelewa na kiambishi cha umoja bila kudai kuwa Waamori wenyewe ndio watakaomilikiwa.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya swali la mwisho
  choice: je, wewe ndiye utakayeimiliki nchi hiyo?
  alternative: nawe utaimiliki nchi hiyo?
  rationale: Kiwakilishi אַתָּה kimesisitizwa, na sentensi ni swali la balagha. “Wewe ndiye” huhifadhi mkazo huo bila kuamua zaidi ya andiko kuhusu uhalali wa dai.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Swali la balagha na msisitizo wa “wewe” vimehifadhiwa; alama ya tanbihi imewekwa kwenye kitenzi ambacho tanbihi inakifafanua.
