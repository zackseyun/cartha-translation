base_translation:
  language: en
  yaml_path: translation/ot/judges/011/038.yaml
  text: And he said[a], “Go.” So he sent her away for two months, and she went, she and her companions, and wept over her virginity on the mountains.
translation:
  language: sw
  text: Naye akasema, “Nenda.” Basi akamwacha aende kwa miezi miwili. Naye akaenda, yeye na rafiki zake, akalilia ubikira wake[a] milimani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaomboleza ubikira wake” au “akalia kwa sababu ya ubikira wake.” Kiebrania husema wazi kwamba ubikira wake ndio uliokuwa jambo la maombolezo yake; jambo hili ni muhimu katika tafsiri mbalimbali za kifungu hiki kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵכִי
  choice: Nenda
  rationale: Ni amri fupi ya nafsi ya pili, umoja wa kike, kutoka הלך. “Nenda” ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: וַיִּשְׁלַח אוֹתָהּ
  choice: akamruhusu aende
  rationale: Katika muktadha huu שׁלח inaonyesha kwamba alimpa ruhusa ya kuondoka. Tafsiri hii ni ya asili katika Kiswahili na haidokezi kwamba alimfukuza.
- source_word: שְׁנֵי חֳדָשִׁים
  choice: kwa miezi miwili
  rationale: Kirai hiki kinaonyesha muda wa ruhusa aliyopewa; “kwa miezi miwili” ni usemi wa kawaida wa Kiswahili.
- source_word: וַתֵּלֶךְ הִיא וְרֵעוֹתֶיהָ
  choice: akaenda, yeye na rafiki zake
  rationale: Muundo huu unahifadhi msisitizo mdogo wa kiwakilishi הִיא na kuwataja walioandamana naye bila kuifanya sentensi kuwa ngumu.
- source_word: רֵעוֹתֶיהָ
  choice: rafiki zake
  rationale: Neno hili humaanisha washirika au rafiki wa karibu. “Rafiki zake” ni la kawaida na linaeleweka; muktadha na umbo la Kiebrania vinaonyesha kuwa walikuwa wanawake bila kulazimika kuongeza ufafanuzi katika matini.
- source_word: וַתֵּבְךְּ עַל בְּתוּלֶיהָ
  choice: akalilia ubikira wake
  rationale: Kitenzi “kulilia” huonyesha kuomboleza jambo fulani na kwa kawaida huwakilisha בכה pamoja na עַל. Kinadumisha wazi kwamba ubikira wake ndio uliokuwa jambo la maombolezo bila kuamua maana pana ya simulizi.
- source_word: עַל הֶהָרִים
  choice: milimani
  rationale: “Milimani” ni tafsiri ya asili ya Kiswahili kwa eneo la tukio na inawakilisha wingi wa הָרִים bila kulazimisha picha ya kuwa juu ya vilele.
theological_decisions:
- issue: Maana ya binti ya Yeftha kuulilia ubikira wake
  choice: Matini inasema kwamba aliulilia ubikira wake bila kuamua mjadala mpana kuhusu mwisho wake.
  alternative: Kusema wazi kwamba aliomboleza kifo chake kilichokuwa karibu, au kwamba aliomboleza maisha ya kudumu bila kuolewa na bila watoto.
  rationale: Aya yenyewe inataja ubikira wake kuwa jambo alilolilia. Kuongeza kifo, useja wa kudumu, au kutokuwa na watoto kama maana pekee kungevuka ushahidi wa aya na kuondoa mvutano wa kitafsiri uliopo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo “yeye na rafiki zake” umehifadhiwa ili kuakisi msisitizo wa Kiebrania, na “akalilia ubikira wake” huhifadhi utata wa kitheolojia bila kuingiza hitimisho la kimadhehebu.
