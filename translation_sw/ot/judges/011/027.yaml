  text: וְ/אָֽנֹכִי֙ לֹֽא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֞ה עֹשֶׂ֥ה אִתִּ֛/י רָעָ֖ה לְ/הִלָּ֣חֶם בִּ֑/י יִשְׁפֹּ֨ט יְהוָ֤ה הַ/שֹּׁפֵט֙ הַ/יּ֔וֹם בֵּ֚ין בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/בֵ֖ין בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/027.yaml
  text: I have not sinned against you[a], but you are doing me wrong by making war against me. May Yahweh, the Judge, judge today between the sons of Israel and the sons of Ammon.
translation:
  language: sw
  text: Mimi sijakukosea, lakini wewe unanitendea mabaya kwa kupigana nami. Yahweh, Mwamuzi, ahukumu leo kati ya wana wa Israeli na wana wa Amoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kati ya Waisraeli na Waamoni.” Kiebrania kinasema kihalisi, “kati ya wana wa Israeli na wana wa Amoni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי לָךְ
  choice: sijakukosea
  rationale: Kitenzi חטא kinaweza kumaanisha kufanya dhambi au kumkosea mtu. Katika madai haya ya kisheria na kidiplomasia, “sijakukosea” ni Kiswahili cha kawaida kinachohifadhi maana ya kosa dhidi ya mtu bila kuondoa uzito wa kimaadili.
- source_word: עֹשֶׂה אִתִּי רָעָה
  choice: unanitendea mabaya
  rationale: Kauli hii ina maana ya kumfanyia mtu jambo baya au lisilo la haki. “Unanitendea mabaya” ni ya kawaida na inadumisha tofauti kati ya kutokuwa na kosa kwa Yeftha na ubaya anaofanyiwa.
- source_word: לְהִלָּחֶם בִּי
  choice: kwa kupigana nami
  rationale: Tafsiri hii inaonyesha kwamba kupigana ndiko kunakofafanua ubaya unaotendwa, bila kuongeza wazo lisilotajwa wazi kwamba vita vilianzishwa wakati huo.
- source_word: יִשְׁפֹּט ... הַשֹּׁפֵט
  choice: Mwamuzi, na ahukumu
  rationale: “Mwamuzi” na “ahukumu” yanahifadhi urudiaji wa mzizi שׁפט. Muundo “na ahukumu” unaonyesha ombi au mwito wa hukumu, si taarifa ya uhakika kuhusu wakati ujao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: הַיּוֹם
  choice: leo
  rationale: “Leo” ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi uharaka wa mwito wa hukumu.
- source_word: בֵּין בְּנֵי יִשְׂרָאֵל וּבֵין בְּנֵי עַמּוֹן
  choice: kati ya wana wa Israeli na wana wa Amoni
  rationale: “Wana wa” linaakisi kwa karibu usemi wa Kiebrania בְּנֵי na pia linaeleweka kama jina la kijamii au la kikabila; footnote linatoa tafsiri ya kawaida zaidi ya majina ya mataifa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la Mungu, si cheo. “Yahweh” linahifadhi jina hilo kwa namna ya matamshi yanayotumiwa sana katika taaluma.
- issue: Nguvu ya kimaadili na kisheria ya חטא
  choice: sijakukosea
  alternative: sijakutendea dhambi
  rationale: Katika muktadha wa mgogoro kati ya mataifa, neno hili linahusu kosa dhidi ya mhusika mwingine. “Sijakukosea” huhifadhi maana hiyo na bado linaweza kubeba uzito wa kimaadili, huku “sijakutendea dhambi” likiwa lisilo la kawaida katika Kiswahili.
- issue: Usemi wa pamoja בְּנֵי
  choice: wana wa Israeli ... wana wa Amoni
  alternative: Waisraeli ... Waamoni
  rationale: Maandishi ya msingi yana usemi halisi “wana wa.” Umewekwa katika matini kuu, huku namna ya kawaida zaidi ya kutaja makundi hayo ikielezwa katika footnote.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa madai ya kisheria umehifadhiwa, pamoja na urudiaji wa “Mwamuzi ... ahukumu.”
