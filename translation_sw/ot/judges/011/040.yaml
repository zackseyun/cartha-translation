base_translation:
  language: en
  yaml_path: translation/ot/judges/011/040.yaml
  text: From year to year the daughters of Israel would go to commemorate the daughter of Jephthah the Gileadite four days in the year[a].
translation:
  language: sw
  text: Kila mwaka, binti za Israeli walikuwa wakienda kumkumbuka binti ya Yeftha, Mgileadi, siku nne kwa mwaka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kumwombolezea” au “kusimulia habari za” binti ya Yeftha. Kitenzi cha Kiebrania ni nadra, na maana yake hapa inabishaniwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיָּמִים יָמִימָה
  choice: Kila mwaka
  rationale: Nahau hii inaonyesha desturi iliyorudiwa mwaka baada ya mwaka; Kiswahili hiki ni cha kawaida na wazi.
- source_word: תֵּלַכְנָה
  choice: walikuwa wakienda
  rationale: Kauli isiyotimilika hapa inaeleza tendo la kawaida lililorudiwa zamani.
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: binti za Israeli
  rationale: Huhifadhi kwa ukaribu usemi wa Kiebrania bila kubainisha umri au hali ya ndoa.
- source_word: לְתַנּוֹת
  choice: kumkumbuka
  rationale: Kitenzi hiki nadra kina maana inayobishaniwa; ‘kumkumbuka’ kinafaa kwa maadhimisho ya kila mwaka huku uwezekano wa ‘kumwombolezea’ ukihifadhiwa katika tanbihi.
- source_word: לְבַת יִפְתָּח
  choice: binti ya Yeftha
  rationale: Muundo huu humtaja moja kwa moja binti ya Yeftha kuwa mhusika wa maadhimisho hayo.
- source_word: הַגִּלְעָדִי
  choice: Mgileadi
  rationale: Ni namna fupi na ya kawaida ya Kiswahili ya kuonyesha kuwa Yeftha alikuwa mtu wa Gileadi.
- source_word: אַרְבַּעַת יָמִים בַּשָּׁנָה
  choice: siku nne kwa mwaka
  rationale: Huwasilisha kwa Kiswahili cha kawaida muda na marudio ya desturi hiyo.
theological_decisions:
- issue: Maana ya maadhimisho ya kila mwaka kwa ajili ya binti ya Yeftha
  choice: Kumkumbuka katika matini kuu
  alternative: Kumwombolezea au kusimulia habari zake
  rationale: Kitenzi cha Kiebrania ni nadra na kinabishaniwa. Tafsiri hii haifanyi uamuzi kuhusu hatima ya binti ya Yeftha; tanbihi huhifadhi maana nyingine zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo ‘binti za Israeli’ huhifadhi ladha ya usemi wa Kiebrania, na ‘Mgileadi’ ni jina la utaifa/mahali linalosomeka kwa urahisi.
