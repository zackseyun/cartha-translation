source:
  edition: WLC
  text: כִּ֖י בַּ/עֲלוֹתָ֣/ם מִ/מִּצְרָ֑יִם וַ/יֵּ֨לֶךְ יִשְׂרָאֵ֤ל בַּ/מִּדְבָּר֙ עַד יַם ס֔וּף וַ/יָּבֹ֖א קָדֵֽשָׁ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/016.yaml
  text: For when they came up from Egypt[a], Israel went through the wilderness as far as the Red Sea and came to Kadesh.
translation:
  language: sw
  text: Kwa maana walipopanda kutoka Misri, Israeli walisafiri nyikani mpaka Bahari ya Shamu[a], kisha wakafika Kadeshi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Bahari ya Matete.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Katika maelezo ya kihistoria ya Yeftha, neno hili linaanzisha msingi wa hoja inayofuata; “Kwa maana” linaendeleza mtiririko huo huku kishazi kinachofuata kikitoa maana ya wakati.
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: walipopanda kutoka Misri
  rationale: Muundo wa kihusishi pamoja na kitenzi-jina na kiambishi cha nafsi una maana ya wakati, “walipopanda.” “Kupanda kutoka Misri” huhifadhi namna ya kawaida ya kibiblia ya kueleza kutoka Misri.
- source_word: וַיֵּלֶךְ
  choice: walisafiri
  rationale: הלך kimsingi ni kwenda au kutembea; “walisafiri” ni Kiswahili cha kawaida katika simulizi la mwendo wa watu kupitia eneo fulani bila kuongeza wazo lisilokuwapo.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa limehifadhiwa kwa umbo la kawaida la Kiswahili. Ingawa Kiebrania kina umoja wa kisarufi, hapa jina linawakilisha watu kwa ujumla, hivyo kitenzi cha wingi ni cha asili katika Kiswahili.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: מִדְבָּר ni eneo kame lisilokaliwa sana; “nyikani” ni neno la kawaida, lenye hadhi, na linaloeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: עַד יַם סוּף
  choice: mpaka Bahari ya Shamu
  rationale: עַד huonyesha kikomo cha mwendo, hivyo “mpaka” ni sahihi. “Bahari ya Shamu” ni jina la jadi na linalotambulika sana; maana mbadala ya jina la Kiebrania imehifadhiwa katika tanbihi.
- source_word: וַיָּבֹא
  choice: wakafika
  rationale: בוא linaweza kumaanisha kuja, kuingia, au kufika. Katika mfuatano huu wa safari, “wakafika” ni la kawaida na linaonyesha kuwasili bila kubadili maana.
- source_word: קָדֵשָׁה
  choice: Kadeshi
  rationale: Herufi ya mwelekeo iliyoambatanishwa na jina huonyesha mwendo kuelekea mahali hapo; maana hiyo tayari imebebwa na “wakafika.” Andiko linataja Kadeshi, wala halisemi wazi Kadesh-barnea.
