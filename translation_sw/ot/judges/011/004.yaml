  yaml_path: translation/ot/judges/011/004.yaml
  text: After some time[a], the Ammonites fought against Israel.
translation:
  language: sw
  text: Baada ya muda fulani[a], Waamoni wakapigana na Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Ikawa baada ya siku,” nahau inayomaanisha kwamba muda fulani ulikuwa umepita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: Baada ya muda fulani
  rationale: Nahau hii ya Kiebrania inaonyesha kwamba muda fulani ulipita. Tafsiri hii ni ya kawaida katika Kiswahili cha sasa na inadumisha maana ya wakati bila kunakili kihalisi ‘ikawa baada ya siku.’
- source_word: וַיִּלָּחֲמוּ
  choice: wakapigana na
  rationale: Kitenzi hiki katika muktadha huu humaanisha kuingia vitani au kupigana. ‘Wakapigana na’ ni usemi wa kawaida wa Kiswahili unaoonyesha uhasama.
- source_word: בְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Hili ni jina la kawaida la Kiswahili kwa watu wa Amoni, badala ya tafsiri ya neno kwa neno ‘wana wa Amoni.’
- source_word: עִם יִשְׂרָאֵל
  choice: na Israeli
  rationale: Ingawa עִם kimsingi ni ‘pamoja na,’ likitumiwa pamoja na kitenzi cha kupigana humtaja mpinzani. Katika Kiswahili, ‘kupigana na’ huwasilisha maana hiyo kwa kawaida.
