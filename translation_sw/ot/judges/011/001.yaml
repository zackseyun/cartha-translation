base_translation:
  language: en
  yaml_path: translation/ot/judges/011/001.yaml
  text: Jephthah the Gileadite was a mighty warrior[a], and he was the son of a prostitute[c][b]; and Gilead fathered Jephthah.
translation:
  language: sw
  text: Yeftha Mgileadi alikuwa shujaa hodari[a], naye alikuwa mwana wa kahaba[b]; Gileadi[c] akamzaa Yeftha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na muundo wa Kiebrania, “mtu hodari mwenye ushujaa.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mwana wa mwanamke kahaba.”'
    reason: lexical_alternative
  - marker: c
    text: Hapa Gileadi ni jina la baba yake Yeftha, wala si jina la eneo tu.
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָדִי
  choice: Mgileadi
  rationale: Nomino ya utambulisho wa kikabila au kieneo inamweleza Yeftha kuwa mtu wa Gileadi; “Mgileadi” ni fupi, ya kawaida katika Kiswahili cha Biblia, na inatofautishwa na jina la mtu Gileadi katika sehemu ya mwisho ya mstari.
- source_word: גִּבּוֹר חַיִל
  choice: shujaa hodari
  rationale: Kirai hiki humaanisha mtu mwenye nguvu, ushujaa au uwezo mkubwa, na katika simulizi hili kina maana ya kijeshi. “Shujaa hodari” ni lugha ya sasa, ya heshima na inayoeleweka kwa urahisi.
- source_word: בֶּן אִשָּׁה זוֹנָה
  choice: mwana wa kahaba
  rationale: זוֹנָה humaanisha moja kwa moja kahaba. Tafsiri hii ni wazi na ya sasa bila kutumia lugha ya kizamani au kupunguza uzito wa maelezo ya Kiebrania.
- source_word: וַיּוֹלֶד
  choice: akamzaa
  rationale: Katika kausativi ya Kiebrania, kitenzi hiki kinaonyesha kwamba Gileadi alikuwa baba aliyemzaa Yeftha. “Akamzaa” huhifadhi muundo mfupi wa nasaba na mwendelezo wa kisimulizi.
- source_word: גִּלְעָד
  choice: Gileadi
  rationale: Hapa Gileadi ni jina la mtu anayetajwa kuwa baba ya Yeftha, si jina la eneo pekee.
- source_word: וְ
  choice: naye / uhusiano wa sentensi bila neno la mwanzo
  rationale: Kiunganishi cha kwanza kinaendeleza simulizi lakini hakina neno mahsusi lenye maana ya “sasa”; kwa hiyo hakijaongezewa neno la mwanzo. Kiunganishi kinachomtanguliza הוּא kimetafsiriwa “naye” ili kuhifadhi msisitizo na tofauti ndani ya sentensi.
theological_decisions:
- issue: Uhusiano kati ya maelezo ya mama yake Yeftha na Gileadi
  choice: Kuhifadhi taarifa zote mbili bila kueleza hali ya ndoa au hadhi ya Yeftha
  alternative: Kumwita Yeftha mwana haramu au kueleza kwamba Gileadi alikuwa mume wa kahaba
  rationale: Kiebrania kinasema tu kwamba mama yake alikuwa kahaba na kwamba Gileadi alimzaa. Hakielezi moja kwa moja hali ya ndoa, kwa hiyo tafsiri haiongezi hitimisho la kijamii au kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Majina “Yeftha” na “Gileadi” yanafuata maumbo yaliyozoeleka katika Biblia za Kiswahili. Muundo wa sentensi unahifadhi urudiaji wa jina la Yeftha na mvutano wa taarifa za asili bila kuongeza maelezo yasiyokuwamo katika Kiebrania.
