  text: וַ/יָּבֹ֨א יִפְתָּ֣ח הַ/מִּצְפָּה֮ אֶל בֵּית/וֹ֒ וְ/הִנֵּ֤ה בִתּ/וֹ֙ יֹצֵ֣את לִ/קְרָאת֔/וֹ בְ/תֻפִּ֖ים וּ/בִ/מְחֹל֑וֹת וְ/רַק֙ הִ֣יא יְחִידָ֔ה אֵֽין ל֥/וֹ מִמֶּ֛/נּוּ בֵּ֖ן אוֹ בַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/034.yaml
  text: Then Jephthah came to Mizpah[a], to his house, and behold, his daughter was coming out to meet him with tambourines and with dances. Now she was his only child[b]; besides her he had neither son nor daughter.
translation:
  language: sw
  text: Ndipo Yeftha akafika Mispa, nyumbani kwake; tazama, binti yake alikuwa akitoka kumlaki, akipiga matari na kucheza. Naye alikuwa mtoto wake wa pekee[a]; isipokuwa yeye, hakuwa na mwana wala binti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wa pekee”; yaani, mtoto wake wa pekee.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Ndipo ... alipofika
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida huku ukihifadhi tendo rahisi la kufika.
- source_word: הַמִּצְפָּה
  choice: Mispa
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili, bila kutafsiri kibainishi cha Kiebrania kama neno tofauti.
- source_word: אֶל בֵּיתוֹ
  choice: nyumbani kwake
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kueleza kufika katika nyumba ambayo ni makao yake.
- source_word: וְהִנֵּה
  choice: kumbe
  rationale: Neno hili linaonyesha ugunduzi wa ghafla na mshangao wa simulizi kwa lugha ya asili ya Kiswahili.
- source_word: בִתּוֹ
  choice: binti yake
  rationale: Ni tafsiri ya moja kwa moja ya uhusiano wa kifamilia unaotajwa.
- source_word: יֹצֵאת לִקְרָאתוֹ
  choice: alikuwa akitoka kumlaki
  rationale: Muundo endelevu unaakisi hali ya tendo lililokuwa likiendelea wakati Yeftha alipofika; “kملaki” linaonyesha kutoka ili kumpokea anayewasili.
- source_word: בְתֻפִּים
  choice: akipiga matari
  rationale: Matari ni ala ndogo za kupigwa zinazolingana na תֻּפִּים katika mazingira ya sherehe; kitenzi kimewekwa wazi ili Kiswahili kiwe cha kawaida.
- source_word: וּבִמְחֹלוֹת
  choice: na kucheza
  rationale: Nomino ya Kiebrania inarejelea michezo ya dansi; Kiswahili hutumia kwa kawaida kitenzi “kucheza” katika muktadha huu.
- source_word: וְרַק הִיא יְחִידָה
  choice: Binti huyo alikuwa mtoto wake wa pekee
  rationale: Muktadha unaonyesha kwamba יְחִידָה humaanisha mtoto wa pekee, jambo linalothibitishwa na kishazi kinachofuata.
- source_word: אֵין לוֹ מִמֶּנּוּ בֵּן אוֹ בַת
  choice: zaidi yake, hakuwa na mwana wala binti
  rationale: Tafsiri hii inadumisha msisitizo kwamba Yeftha hakuwa na mtoto mwingine wa kiume au wa kike.
theological_decisions:
- issue: Hali na hatima ya binti ya Yeftha
  choice: 'Mstari umetafsiriwa kwa maelezo tu: alikuwa mtoto wake wa pekee na alitoka kumlaki kwa shangwe.'
  alternative: Msisitizo wa kuwa mtoto wa pekee unaweza kuhusishwa na maoni tofauti kuhusu dhabihu halisi au maisha ya ubikira na kutokuwa na watoto baadaye.
  rationale: Mstari huu wenyewe hautatui mjadala kuhusu nadhiri ya Yeftha au hatima ya binti yake. Tafsiri haipaswi kuingiza hitimisho la kiteolojia lisilosemwa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kifasihi. “Kumbe” kinabeba mshangao wa וְהִנֵּה kwa njia ya asili; “matari” na “kucheza” vinaeleza sherehe bila kutumia msamiati wa kizamani. Hakuna hitimisho kuhusu nadhiri au hatima ya binti lililoingizwa.
