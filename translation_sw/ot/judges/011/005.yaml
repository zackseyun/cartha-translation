base_translation:
  language: en
  yaml_path: translation/ot/judges/011/005.yaml
  text: And when the Ammonites fought against Israel[a], the elders of Gilead went to bring Jephthah from the land of Tob.
translation:
  language: sw
  text: Ikawa Waamoni walipopigana na Israeli, wazee wa Gileadi wakaenda kumchukua Yeftha kutoka nchi ya Tobu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ikawa ... walipo-
  rationale: Kauli hii ya kisimulizi inaendeleza mfuatano wa matukio na kutaja wakati; muundo huu ni wa asili na wenye hadhi katika Kiswahili.
- source_word: נִלְחֲמוּ
  choice: walipopigana
  rationale: Niphal ya לחם hapa humaanisha kushiriki katika vita; ‘walipopigana’ huunganisha kwa kawaida tukio hili na kitendo kilichofuata.
- source_word: בְנֵי עַמּוֹן
  choice: Waamoni
  rationale: Hili ni jina la kawaida la Kiswahili kwa watu wa Amoni, badala ya tafsiri sisisi ‘wana wa Amoni.’
- source_word: עִם יִשְׂרָאֵל
  choice: na Israeli
  rationale: Baada ya kitenzi ‘kupigana,’ kihusishi ‘na’ kwa Kiswahili huonyesha wazi upande pinzani bila kulazimika kutumia ‘dhidi ya.’
- source_word: זִקְנֵי גִלְעָד
  choice: wazee wa Gileadi
  rationale: Muundo huu unaonyesha viongozi waliotambuliwa wa eneo la Gileadi kwa Kiswahili cha kawaida.
- source_word: לָקַחַת
  choice: kumchukua
  rationale: Maana ya msingi ya לקח ni ‘kuchukua.’ Katika muktadha huu wazee walikwenda kumtoa Yeftha alikokuwa ili waende naye; Kiswahili ‘kumchukua kutoka’ hueleweka kwa kawaida na huhifadhi maana ya Kiebrania bila kuhitaji tanbihi.
- source_word: אֶת יִפְתָּח
  choice: Yeftha
  rationale: Ni jina la mtu lililotoholewa kwa namna inayotambulika katika mapokeo ya Kiswahili.
- source_word: מֵאֶרֶץ טוֹב
  choice: kutoka nchi ya Tobu
  rationale: אֶרֶץ hapa ni nchi au eneo, na ‘nchi ya Tobu’ ni usemi wazi wa jina la mahali.
