  text: וַ/יֵּ֣לֶךְ בַּ/מִּדְבָּ֗ר וַ/יָּ֜סָב אֶת אֶ֤רֶץ אֱדוֹם֙ וְ/אֶת אֶ֣רֶץ מוֹאָ֔ב וַ/יָּבֹ֤א מִ/מִּזְרַח שֶׁ֨מֶשׁ֙ לְ/אֶ֣רֶץ מוֹאָ֔ב וַֽ/יַּחֲנ֖וּ/ן בְּ/עֵ֣בֶר אַרְנ֑וֹן וְ/לֹא בָ֨אוּ֙ בִּ/גְב֣וּל מוֹאָ֔ב כִּ֥י אַרְנ֖וֹן גְּב֥וּל מוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/018.yaml
  text: Then he went through the wilderness and went around the land of Edom and the land of Moab[a], and came to the east side of the land of Moab, and they camped beyond the Arnon; but they did not enter the territory of Moab[b], for the Arnon was the border of Moab.
translation:
  language: sw
  text: Kisha Israeli akapita jangwani, akaizunguka nchi ya Edomu na nchi ya Moabu, kisha akafika mashariki mwa nchi ya Moabu.[a] Nao wakapiga kambi ng’ambo ya Mto Arinoni,[b] lakini hawakuingia katika eneo la Moabu, kwa maana Mto Arinoni ulikuwa mpaka wa Moabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “akaja kutoka macheo ya jua hadi nchi ya Moabu,” yaani, aliikaribia Moabu kutoka upande wa mashariki.
    reason: lexical_alternative
  - marker: b
    text: Au “upande wa pili wa Mto Arinoni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בַּמִּדְבָּר
  choice: akapita jangwani
  rationale: Kitenzi הלך kimsingi ni ‘kwenda/kutembea’; pamoja na בַּמִּדְבָּר, ‘akapita jangwani’ kinaonyesha mwendo wa safari kwa Kiswahili cha kawaida bila kudokeza kwamba jangwa hilo lilikuwa la mchanga tu.
- source_word: וַיָּסָב
  choice: akaizunguka
  rationale: סבב hapa inaeleza kuchukua njia ya kuzunguka nchi hizo badala ya kupita ndani yake.
- source_word: אֶרֶץ אֱדוֹם וְאֶת אֶרֶץ מוֹאָב
  choice: nchi ya Edomu na nchi ya Moabu
  rationale: אֶרֶץ inaweza kumaanisha nchi, ardhi, au eneo; ‘nchi’ ni ya kawaida na inafaa kwa maeneo ya kisiasa yanayotajwa hapa.
- source_word: וַיָּבֹא מִמִּזְרַח שֶׁמֶשׁ לְאֶרֶץ מוֹאָב
  choice: akaijia nchi ya Moabu kutoka upande wa mashariki
  rationale: Kifungu hiki kihalisi kinahusisha ‘macheo ya jua’ na kinaeleza kwamba Israeli waliikaribia Moabu kutoka mashariki; tafsiri hii ni wazi huku tanbihi ikihifadhi taswira ya Kiebrania.
- source_word: וַיַּחֲנוּן
  choice: Nao wakapiga kambi
  rationale: חנה ni kupiga kambi. ‘Nao’ pia huonyesha mabadiliko ya Kiebrania kutoka umoja wa taifa la Israeli hadi wingi unaowarejelea watu wake.
- source_word: בְּעֵבֶר אַרְנוֹן
  choice: ng’ambo ya Mto Arnoni
  rationale: עֵבֶר ni upande wa pili au ng’ambo. ‘Ng’ambo’ huhifadhi utegemezi wa mahali anaposimama msemaji bila kulazimisha upande maalumu; ‘Mto’ huweka wazi kwamba Arnoni ni mto unaotumika kama mpaka.
- source_word: וְלֹא בָאוּ בִּגְבוּל מוֹאָב
  choice: hawakuingia katika eneo la Moabu
  rationale: גְּבוּל inaweza kuwa mpaka au eneo lililo ndani ya mpaka; pamoja na kitenzi ‘kuingia,’ hapa maana ya kimaelezo ni kutovuka na kuingia katika eneo la Moabu.
- source_word: כִּי אַרְנוֹן גְּבוּל מוֹאָב
  choice: kwa maana Mto Arnoni ulikuwa mpaka wa Moabu
  rationale: כִּי inatoa sababu, na גְּבוּל hapa ni mpaka wa kijiografia.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Umoja katika ‘Israeli akapita … akaizunguka … akaijia’ unalihifadhi taifa kama mhusika mmoja katika Kiebrania; ‘Nao wakapiga kambi’ unalihifadhi badiliko la ghafla kwenda wingi, likiwataja watu wa Israeli kwa pamoja. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili: Edomu, Moabu, na Arnoni.'
