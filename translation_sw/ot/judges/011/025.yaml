base_translation:
  language: en
  yaml_path: translation/ot/judges/011/025.yaml
  text: And now[a], are you really better than Balak son of Zippor, king of Moab? Did he ever contend with Israel[b], or did he ever fight against them?
translation:
  language: sw
  text: Na sasa[a], je, wewe ni bora kweli kuliko Balaki mwana wa Sipori, mfalme wa Moabu? Je, yeye aliwahi kushindana na Israeli[b], au aliwahi kupigana nao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “je, wewe ni bora kwa vyovyote kuliko Balaki mwana wa Sipori, mfalme wa Moabu?” Kiebrania kinarudia neno “bora” ili kusisitiza ulinganisho.
    reason: lexical_alternative
  - marker: b
    text: Au, “Je, yeye aliwahi kuwa na mgogoro na Israeli, au aliwahi kupigana dhidi yao?” Kitenzi cha kwanza kinaweza kumaanisha kushindana, kugombana, au kuwa na shauri, ilhali cha pili kinamaanisha hasa kupigana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Huhifadhi kiunganishi וְ pamoja na mpito wa hoja unaoletwa na עַתָּה kwa Kiswahili cha kawaida.
- source_word: הֲטוֹב טוֹב אַתָּה
  choice: je, wewe ni bora kweli
  rationale: Neno 'kweli' linawasilisha msisitizo wa urudiaji wa Kiebrania kwa njia ya asili bila kufanya swali kuwa zito kupita kiasi.
- source_word: מִבָּלָק בֶּן צִפּוֹר מֶלֶךְ מוֹאָב
  choice: kuliko Balaki mwana wa Sipori, mfalme wa Moabu
  rationale: Muundo wa kulinganisha na mfuatano wa majina na cheo umehifadhiwa katika Kiswahili cha kawaida.
- source_word: הֲרֹב רָב
  choice: Je, yeye aliwahi kubishana
  rationale: ‘Kubishana’ huhifadhi maana pana ya ריב ya kugombana, kushindana kwa hoja, au kuwa na mgogoro, bila kuifanya kuwa vita ambavyo vinatajwa wazi katika kishazi kinachofuata.
- source_word: עִם יִשְׂרָאֵל
  choice: na Israeli
  rationale: ‘Na’ hufuata maana ya msingi ya עִם na inaendana kiasili na kitenzi ‘kubishana,’ huku ikitofautisha kishazi hiki na kupigana.
- source_word: אִם
  choice: au
  rationale: Hapa אִם huanzisha sehemu ya pili ya swali lenye machaguo mawili, hivyo ‘au’ ndiyo tafsiri ya kawaida.
- source_word: נִלְחֹם נִלְחַם בָּם
  choice: aliwahi kupigana nao
  rationale: ‘Aliwahi’ huwasilisha nguvu ya swali la msisitizo, na ‘kupigana nao’ hutoa maana ya wazi ya mapambano dhidi yao.
