  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ֠י אֲשֶׁ֨ר לֹא עָלָ֧ה בַ/קָּהָ֛ל מִ/כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה כִּי֩ הַ/שְּׁבוּעָ֨ה הַ/גְּדוֹלָ֜ה הָיְתָ֗ה לַ֠/אֲשֶׁר לֹא עָלָ֨ה אֶל יְהוָ֧ה הַ/מִּצְפָּ֛ה לֵ/אמֹ֖ר מ֥וֹת יוּמָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/005.yaml
  text: And the sons of Israel said[a], “Who is there from all the tribes of Israel who did not come up to Yahweh in the assembly?” For the great oath had been made concerning whoever did not come up to Yahweh at Mizpah, saying[b], “He shall surely be put to death.”
translation:
  language: sw
  text: Wana wa Israeli wakasema[a], “Ni nani, kutoka makabila yote ya Israeli, ambaye hakupanda kumwendea Yahwe kwenye kusanyiko?” Kwa maana kulikuwa na kiapo kikubwa dhidi ya yeyote ambaye hakupanda kumwendea Yahwe huko Mispa, kikisema, “Hakika atauawa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli wakasema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Inahifadhi nahau ya Kiebrania yenye maana ya watu wa Israeli kwa jumla; tanbihi inatoa usemi wa kawaida zaidi, “Waisraeli.”
- source_word: מִי אֲשֶׁר
  choice: Ni nani ... ambaye
  rationale: Muundo huu wa Kiswahili unauliza ni mtu au kundi gani linalolingana na maelezo yanayofuata.
- source_word: לֹא עָלָה
  choice: hakupanda kwenda
  rationale: Kitenzi עלה kina maana ya kwenda au kupanda juu. Tafsiri hii inadumisha wazo la kupanda kuelekea mahali pa kusanyiko, ingawa Kiswahili cha kawaida kingeweza kusema tu “hakuenda.”
- source_word: בַקָּהָל
  choice: katika kusanyiko
  rationale: קהל ni jamii iliyokusanyika; “kusanyiko” ni neno la kawaida lisilo na maana mahsusi ya dhehebu.
- source_word: אֶל יְהוָה
  choice: kwa Yahwe
  rationale: Kihusishi אֶל kimetafsiriwa kwa maana yake ya kuelekea au kwa, bila kukibadili kuwa “mbele za.”
- source_word: הַשְּׁבוּעָה הַגְּדוֹלָה
  choice: kiapo kizito
  rationale: Katika Kiswahili, “kiapo kizito” huwasilisha uzito na nguvu ya kiapo kwa ufasaha zaidi kuliko tafsiri halisi “kiapo kikubwa.”
- source_word: הָיְתָה לַאֲשֶׁר
  choice: kilikuwa kimetolewa kuhusu yeyote
  rationale: Usemi huu unaonyesha kwamba kiapo kilimhusu mtu yeyote ambaye hakufika, bila kulazimisha kihusishi kuwa na maana ya “dhidi ya.”
- source_word: הַמִּצְפָּה
  choice: huko Mispa
  rationale: Jina la mahali limetoholewa kama “Mispa”; “huko” linaonyesha mahali pa mkutano kwa kawaida katika Kiswahili.
- source_word: מוֹת יוּמָת
  choice: Hakika atauawa
  rationale: Muundo wa Kiebrania unaimarisha uhakika wa hukumu ya kifo, na kitenzi cha kutendwa kinaonyesha kwamba mtu huyo angeuawa, si kufa tu.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la Mungu YHWH. “Yahwe” linahifadhi jina hilo badala ya kulibadili kuwa cheo; tanbihi inafafanua jambo hili bila kuingiza msimamo wa dhehebu.
- issue: Usemi wa kijumuiya wenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  alternative: Waisraeli
  rationale: Tafsiri kuu inahifadhi umbo la nahau ya Kiebrania, huku tanbihi ikitoa tafsiri ya kawaida ya kijumuiya. Katika muktadha huu usemi unawahusu Waisraeli kwa jumla.
- issue: Nguvu ya hukumu katika מוֹת יוּמָת
  choice: Hakika atauawa
  alternative: Lazima auawe; hakika atakufa
  rationale: Tafsiri iliyochaguliwa inadumisha msisitizo wa Kiebrania na maana ya kutendwa inayofaa hukumu ya kiapo, bila kueleza zaidi kuhusu utaratibu wa adhabu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaoeleweka. “Kiapo kizito” ni cha asili zaidi kuliko “kiapo kikubwa,” huku “hakupanda kwenda” kikidumisha kwa kiasi kinachowezekana taswira ya kitenzi cha Kiebrania עלה.
