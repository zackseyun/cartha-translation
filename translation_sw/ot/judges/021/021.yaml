source:
  edition: WLC
  text: וּ/רְאִיתֶ֗ם וְ֠/הִנֵּה אִם יֵ֨צְא֥וּ בְנוֹת שִׁילוֹ֮ לָ/ח֣וּל בַּ/מְּחֹלוֹת֒ וִֽ/יצָאתֶם֙ מִן הַ/כְּרָמִ֔ים וַ/חֲטַפְתֶּ֥ם לָ/כֶ֛ם אִ֥ישׁ אִשְׁתּ֖/וֹ מִ/בְּנ֣וֹת שִׁיל֑וֹ וַ/הֲלַכְתֶּ֖ם אֶ֥רֶץ בִּנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/021.yaml
  text: Watch[a], and behold, when the daughters of Shiloh come out to dance in the dances, then come out from the vineyards and seize for yourselves, each man his wife from the daughters of Shiloh, and go to the land of Benjamin.
translation:
  language: sw
  text: Angalieni! Mabinti wa Shilo watakapotoka ili kucheza ngoma, tokeni katika mashamba ya mizabibu, na kila mwanaume miongoni mwenu ajinyakulie[a] mke kutoka miongoni mwa mabinti wa Shilo; kisha mwende katika nchi ya Benyamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amnyakue kwa ajili yake mwenyewe” au “amteke nyara”; kitenzi cha Kiebrania kinaonyesha kuchukua kwa nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם וְהִנֵּה
  choice: Angalieni!
  rationale: Katika mfululizo huu wa maagizo, kitenzi kina nguvu ya amri ya kutazama kwa makini. Alama ya mshangao inawasilisha kazi ya וְהִנֵּה ya kuvuta uangalifu bila kutumia usemi wa Kiswahili usio wa kawaida kama ‘na tazama.’
- source_word: אִם יֵצְאוּ
  choice: watakapotoka
  rationale: Ingawa אִם kwa umbo ni ya sharti (‘ikiwa’), hapa tukio linatarajiwa na neno hilo linaweka wakati wa kutekeleza agizo. ‘Watakapotoka’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya wakati bila kudai kwamba tukio tayari limetokea.
- source_word: בְנוֹת שִׁילוֹ
  choice: binti wa Shilo
  rationale: ‘Binti’ huhifadhi taswira ya kijamii na kifamilia ya Kiebrania bila kukisia umri kwa kusema ‘wasichana’ au ‘wanawake vijana.’
- source_word: לָחוּל בַּמְּחֹלוֹת
  choice: kwenda kucheza ngoma
  rationale: Usemi huu ni wa kawaida katika Kiswahili cha Afrika Mashariki na unaonyesha wazi tendo la kucheza dansi; hauongezi aina maalumu ya ngoma ambayo haijatajwa katika Kiebrania.
- source_word: וִיצָאתֶם מִן הַכְּרָמִים
  choice: tokeni katika mashamba ya mizabibu
  rationale: Hii inaonyesha kwamba wanaume hao wanapaswa kujitokeza kutoka mahali walikojificha miongoni mwa mizabibu.
- source_word: וַחֲטַפְתֶּם
  choice: amnyakue
  rationale: ‘Kunyakua’ huonyesha kuchukua kwa nguvu na kwa ghafula, kama kitenzi cha Kiebrania, bila kuingiza moja kwa moja istilahi ya kisasa ya kisheria.
- source_word: אִישׁ אִשְׁתּוֹ
  choice: kila mmoja wenu amnyakue mke
  rationale: Hii huhifadhi maana ya mgawanyo—mke mmoja kwa kila mwanamume—kwa Kiswahili cha kawaida na kinachoeleweka.
- source_word: מִבְּנוֹת שִׁילוֹ
  choice: kutoka miongoni mwa binti wa Shilo
  rationale: ‘Miongoni mwa’ huweka wazi kwamba kila mke anachaguliwa kutoka katika kundi hilo, jambo linalodokezwa na kihusishi cha Kiebrania.
- source_word: אֶרֶץ בִּנְיָמִן
  choice: nchi ya Benyamini
  rationale: Tafsiri rasmi na ya moja kwa moja ya eneo linalohusishwa na kabila la Benyamini.
theological_decisions:
- issue: Lugha ya kijinsia na maana ya mgawanyo
  choice: kila mmoja wenu amnyakue mke
  alternative: kila mtu ajipatie mwenzi
  rationale: Kiebrania kinataja wanaume na wake kwa wazi na kinaonyesha mmoja kwa mmoja. Tafsiri haibadili kauli hiyo kuwa lugha isiyoonyesha jinsia.
- issue: Maelezo ya kimaadili ya kuchukuliwa kwa wanawake
  choice: amnyakue
  alternative: amteke nyara
  rationale: Aya yenyewe inaagiza kuchukua kwa nguvu. ‘Kunyakua’ huhifadhi ukali wa kitenzi bila kuifanya tafsiri kuu itumie istilahi ya kisheria iliyo wazi zaidi kuliko neno la Kiebrania; chaguo kali zaidi limewekwa katika tanbihi.
- issue: Sharti dhidi ya wakati unaotarajiwa
  choice: watakapotoka
  alternative: ikiwa watatoka
  rationale: Muktadha unaonyesha mpango unaotarajiwa kutekelezwa wakati wanawake watakapotokea. Kiswahili cha wakati kinasomeka kwa kawaida huku kikihifadhi utegemezi wa agizo kwa tukio hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inatumia maumbo ya amri ya wingi kwa uwazi, huepuka msamiati wa kidhehebu, na inaweka ukali wa tendo la kunyakua bila kulainisha simulizi.
