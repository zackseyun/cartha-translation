translation:
  language: sw
  text: Nao watu walihuzunika kwa ajili ya Benyamini, kwa sababu BWANA alikuwa ameleta pengo miongoni mwa makabila ya Israeli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִחָם
  choice: walihuzunika
  rationale: Katika muktadha huu kitenzi kinaonyesha huzuni au majuto juu ya yaliyompata Benyamini; ‘walihuzunika’ ni ya kawaida na huhifadhi uzito wa tukio bila kuingiza wazo la faraja.
- source_word: פֶּרֶץ
  choice: ufa
  rationale: Neno hili humaanisha pengo au sehemu iliyovunjwa. ‘Ufa’ inadumisha taswira ya kuvunjika kwa umoja wa makabila kutokana na kupungua kwa Benyamini.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: makabila ya Israeli
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya usemi wa Kiebrania.
- source_word: יְהוָה
  choice: BWANA
  rationale: Matumizi ya herufi kubwa yanafuata desturi iliyoenea katika Biblia za Kiswahili ya kuwakilisha jina la agano YHWH.
theological_decisions:
- issue: Kumhusisha YHWH moja kwa moja na ufa uliotokea Israeli
  choice: BWANA alikuwa amefanya ufa
  alternative: ufa ulikuwa umetokea kwa ruhusa ya BWANA
  rationale: Muundo wa Kiebrania unasema moja kwa moja kwamba YHWH ndiye aliyefanya ufa; tafsiri hailegezi dai hilo kwa kulibadili kuwa ruhusa tu.
- issue: Maana ya נִחָם kuhusu Benyamini
  choice: walihuzunika kwa ajili ya Benyamini
  alternative: walimhurumia Benyamini
  rationale: ‘Walihuzunika’ hufuata ushahidi wa muktadha na huhifadhi uwezekano wa huzuni yenye majuto, bila kuamua kwamba maana ni huruma pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Taswira ya ‘ufa’ imehifadhiwa ili kuonyesha kuvunjika kwa ukamilifu wa makabila ya Israeli.
