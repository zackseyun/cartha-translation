base_translation:
  language: en
  yaml_path: translation/ot/judges/021/002.yaml
  text: Then the people came to Bethel and sat there before God until evening[a], and they raised their voices and wept with great weeping.
translation:
  language: sw
  text: Ndipo watu wakaja Betheli, wakaketi huko mbele ya Mungu mpaka jioni. Wakapaza sauti zao, wakalia kwa kilio kikubwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakalia sana.” Kiebrania kinatumia kitenzi na nomino zenye mzizi mmoja ili kusisitiza ukubwa wa maombolezo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: wakaja
  rationale: Kitenzi בוא hapa kinasimulia kufika kwa watu mahali palipotajwa; “wakaja” ni Kiswahili cha kawaida kinachohifadhi wazo la kuwasili bila kuongeza maana ya kuingia ndani.
- source_word: הָעָם
  choice: watu
  rationale: עם inarejelea mkusanyiko wa Waisraeli kwa ujumla, si jeshi pekee wala taifa kwa maana ya kisiasa.
- source_word: בֵּית אֵל
  choice: Betheli
  rationale: Hapa ni jina la mahali, kwa hiyo limetoholewa kwa namna iliyozoeleka katika Kiswahili badala ya kutafsiriwa kuwa “nyumba ya Mungu.”
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: wakaketi huko
  rationale: ישב inaweza kumaanisha kuketi, kukaa, au kubaki. Katika tukio hili la kukaa mbele za Mungu mpaka jioni, “wakaketi huko” huhifadhi picha halisi na hali ya kuendelea.
- source_word: עַד הָעֶרֶב
  choice: mpaka jioni
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kipindi kinachofikia jioni.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: mbele za Mungu
  rationale: Kirai hiki huonyesha kuwapo mbele ya Mungu. “Mbele za Mungu” ni usemi wa Kiswahili ulio wazi na wenye hadhi, na huhifadhi אֱלֹהִים bila kuibadili kuwa jina YHWH.
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: wakapaza sauti zao
  rationale: Nahau hii inaonyesha kulia au kuita kwa sauti. “Wakapaza sauti zao” huhifadhi picha ya kuinua sauti na kupatanisha umoja wa קוֹלָם na wingi wa wahusika kwa Kiswahili cha kawaida.
- source_word: וַיִּבְכּוּ בְּכִי גָדוֹל
  choice: na kulia kwa kilio kikubwa
  rationale: Kiebrania kinatumia kitenzi na nomino zenye mzizi mmoja ili kusisitiza ukubwa wa maombolezo. Tafsiri hii huhifadhi mwangwi huo kwa kiasi kinachowezekana bila kufasiri hisia kuwa uchungu au sauti kuwa kubwa.
theological_decisions:
- issue: Tafsiri ya הָאֱלֹהִים katika mazingira ya ibada
  choice: Mungu
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana הָאֱלֹהִים, si jina la agano YHWH. Kwa hiyo “Mungu” linahifadhi ushahidi wa chanzo bila kuoanisha kifungu hiki na matumizi ya “BWANA” katika mazingira mengine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi imegawanywa katika vipashio viwili ili simulizi lisomeke kwa kawaida. Alama ya tanbihi imewekwa baada ya kirai cha kilio ambacho tanbihi hiyo inafafanua.
