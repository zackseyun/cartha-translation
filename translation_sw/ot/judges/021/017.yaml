base_translation:
  language: en
  yaml_path: translation/ot/judges/021/017.yaml
  text: And they said[a], “There must be an inheritance for the survivors of Benjamin, so that a tribe may not be blotted out from Israel.”
translation:
  language: sw
  text: Nao wakasema[a], “Lazima kuwe na urithi kwa ajili ya walionusurika wa Benyamini, ili kabila lisifutwe kutoka Israeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Pawe na waliosalia kwa ajili ya Benyamini,” au, “Pawe na urithi kwa walionusurika wa Benyamini.” Kiebrania kinaweka kwa ufupi maneno “urithi” na “walionusurika/waliosalia” pamoja, na uhusiano kamili kati ya nomino hizo mbili unaweza kuelezwa kwa njia zaidi ya moja katika Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Nao wakasema
  rationale: Wayyiqtol ya אמר inaendeleza simulizi na kutambulisha maneno ya kundi; ‘Nao wakasema’ ni ya asili na yenye hadhi katika Kiswahili.
- source_word: יְרֻשַּׁת
  choice: urithi
  rationale: Neno hili huonyesha urithi au milki inayorithiwa; ‘urithi’ linafaa katika muktadha wa kuhifadhi sehemu na mwendelezo wa kabila.
- source_word: פְּלֵיטָה
  choice: walionusurika
  rationale: Hurejelea waokokaji waliobaki baada ya maangamizi; ‘walionusurika’ ni wazi bila kuongeza maana maalumu ya kitheolojia.
- source_word: לְבִנְיָמִן
  choice: kwa ajili ya ... wa Benyamini
  rationale: Lamed linaweza kuonyesha anayelengwa au anayepokea; muundo huu pia unaonyesha kuwa walionusurika ni watu wa kabila la Benyamini.
- source_word: וְלֹא יִמָּחֶה
  choice: ili ... lisifutwe
  rationale: Niphal ya מחה ina maana ya kufutwa au kuondolewa kabisa. ‘Ili’ huonyesha uhusiano wa kusudi unaodokezwa na muktadha.
- source_word: שֵׁבֶט
  choice: kabila
  rationale: Hapa neno linamaanisha mojawapo ya makabila ya Israeli; Kiswahili hakihitaji kibainishi kisicho dhahiri cha Kiebrania.
- source_word: מִיִּשְׂרָאֵל
  choice: kutoka Israeli
  rationale: 'Huhifadhi kwa karibu maana ya מן ya kutenganisha: kabila lisitoweke miongoni mwa Israeli.'
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa Kiebrania usio na kitenzi umeelezwa kwa ‘Lazima kuwe na’ kwa ufasaha, huku tanbihi ikihifadhi utata wa uhusiano kati ya ‘urithi’ na ‘walionusurika’.
