translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtiririko wa masimulizi umehifadhiwa kwa viambishi vya mfululizo vya ‘-ka-’. ‘Wana wa Benyamini’ huhifadhi usemi wa kikabila wa chanzo, na tanbihi huhifadhi utata halisi wa jina la mahali.
