  text: Then the whole congregation sent word and spoke to the sons of Benjamin who were at the rock of Rimmon[a], and proclaimed peace to them.
translation:
  language: sw
  text: Ndipo kusanyiko lote likatuma ujumbe na kusema na wana wa Benyamini waliokuwa kwenye Mwamba wa Rimoni[a], na likawatangazia amani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokuwa Sela-Rimoni”; Kiebrania kinaweza kueleweka ama kama kirai elezi, “Mwamba wa Rimoni,” ama kama jina mahususi la mahali.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: likatuma ujumbe
  rationale: Kitenzi chenyewe humaanisha ‘kutuma’; muktadha unaofuata wa kusema unaonyesha kusudi la mawasiliano. ‘Kutuma ujumbe’ ni Kiswahili cha kawaida bila kuongeza wazi wajumbe ambao hawajatajwa katika Kiebrania.
- source_word: כָּל הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה ni jumuiya ya Israeli iliyokusanyika; ‘kusanyiko’ linahifadhi maana hiyo ya pamoja, na ‘lote’ linaakisi כָּל.
- source_word: וַיְדַבְּרוּ אֶל
  choice: kusema na
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya nahau ya Kiebrania inayomaanisha kusema na au kuzungumza na mtu.
- source_word: בְּנֵי בִנְיָמִן
  choice: wana wa Benyamini
  rationale: Inahifadhi usemi wa kikabila na kifamilia wa Kiebrania, ‘wana wa Benyamini,’ badala ya kuufanya kuwa jina la jumla.
- source_word: אֲשֶׁר בְּסֶלַע רִמּוֹן
  choice: waliokuwa kwenye Mwamba wa Rimoni
  rationale: סֶלַע humaanisha mwamba au jabali. Tafsiri hii inatoa maana dhahiri ya muundo huo huku uwezekano wa jina kamili la mahali ukihifadhiwa katika tanbihi.
- source_word: וַיִּקְרְאוּ לָהֶם שָׁלוֹם
  choice: wakawatangazia amani
  rationale: Muundo huu unaonyesha tangazo rasmi la mahusiano ya amani. ‘Kuwatangazia amani’ ni wa asili katika Kiswahili na haupunguzi uzito wa tendo hilo kuwa salamu tu.
- source_word: שָׁלוֹם
  choice: amani
  rationale: Katika muktadha huu neno linahusu kurudishwa kwa mahusiano ya amani; ‘amani’ ni tafsiri pana na ya kawaida.
