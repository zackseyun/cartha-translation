base_translation:
  language: en
  yaml_path: translation/ot/judges/021/012.yaml
  text: And from the inhabitants of Jabesh-gilead they found four hundred young women, virgins, who had not known a man by lying with a male; and they brought them to the camp at Shiloh, which is in the land of Canaan.
translation:
  language: sw
  text: Nao wakapata kutoka miongoni mwa wakaaji wa Yabeshi-Gileadi wanawake vijana mia nne, mabikira ambao hawakuwa wamemjua mwanamume kwa kulala naye. Wakawaleta kambini huko Shilo, katika nchi ya Kanaani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיּוֹשְׁבֵי יָבֵישׁ גִּלְעָד
  choice: miongoni mwa wakaaji wa Yabeshi-gileadi
  rationale: Kiambishi מִן hapa kinaeleza kundi ambalo wasichana walipatikana ndani yake; “miongoni mwa” ni Kiswahili cha kawaida na sahihi.
- source_word: נַעֲרָה בְתוּלָה
  choice: wasichana ... mabikira
  rationale: Neno נַעֲרָה linaonyesha wanawake vijana, na בְתוּלָה linaeleza ubikira wao; kutenganisha vipengele hivi huhifadhi msisitizo wa Kiebrania.
- source_word: לֹא יָדְעָה אִישׁ לְמִשְׁכַּב זָכָר
  choice: hawakuwa wamemjua mwanamume kwa kulala na mwanaume
  rationale: Huhifadhi nahau ya “kujua” kwa maana ya uhusiano wa kingono pamoja na ufafanuzi wa moja kwa moja wa maandishi kuhusu kulala na mwanaume.
- source_word: הַמַּחֲנֶה שִׁלֹה
  choice: kambini huko Shilo
  rationale: Muundo unaeleweka kiasili kuwa kambi iliyokuwa Shilo, si kwamba “Shilo” ndilo jina la kambi.
- source_word: אֶרֶץ כְּנָעַן
  choice: nchi ya Kanaani
  rationale: Hili ndilo umbo la kawaida la jina hili la mahali katika Kiswahili cha Biblia.
theological_decisions:
- issue: Maelezo ya ubikira na kutokuwa na uhusiano wa kingono
  choice: Kuhifadhi usemi wa maandishi kwamba hawakuwa wamemjua mwanamume kwa kulala na mwanaume
  alternative: Kufupisha kuwa “ambao hawajawahi kulala na mwanamume”
  rationale: Usemi wa chanzo una msisitizo maradufu; tafsiri haiufichi wala kuongeza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yametolewa kama Yabeshi-gileadi, Shilo, na Kanaani. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi iliyohitajika.
