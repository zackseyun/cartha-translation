  text: And they commanded the sons of Benjamin[a], saying[b], “Go and lie in wait in the vineyards.”
translation:
  language: sw
  text: Nao wakawaamuru wana wa Benyamini[a], wakisema, “Nendeni mkajifiche kwa kuvizia[b] katika mashamba ya mizabibu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Benyamini”; yaani, Wabenyamini.'
    reason: lexical_alternative
  - marker: b
    text: Au “mkaotee.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: Nao wakawaamuru
  rationale: Kitenzi צוה kina maana ya ‘kuamuru’ au ‘kuelekeza kwa mamlaka.’ Umbo la wingi lililotolewa katika ushahidi wa chanzo limehifadhiwa kwa ‘waka-’; ‘Nao’ linaunganisha sentensi na simulizi lililotangulia.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: wana wa Benyamini
  rationale: Hili linahifadhi usemi halisi wa Kiebrania wa undugu, ‘wana wa Benyamini,’ bila kuubadili kuwa jina la kikabila tu.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Ni usemi wa kawaida wa Kiebrania unaotanguliza maneno yanayonukuliwa; ‘wakisema’ ni wa moja kwa moja na wa asili katika Kiswahili cha kibiblia.
- source_word: לְכוּ
  choice: Nendeni
  rationale: Ni amri ya wingi ya הלך, kwa hiyo ‘Nendeni’ huonyesha wazi kwamba walioamriwa ni wengi.
- source_word: וַאֲרַבְתֶּם
  choice: mkavizie
  rationale: Mzizi ארב humaanisha kujificha na kusubiri ili kuvamia. ‘Mkavizie’ huendeleza nguvu ya amri baada ya ‘Nendeni’ na ni Kiswahili cha kawaida.
- source_word: בַּכְּרָמִים
  choice: katika mashamba ya mizabibu
  rationale: כרמים ni mashamba ya mizabibu; ‘katika’ linawakilisha kihusishi ב na linafaa kwa eneo ambamo wanapaswa kuvizia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Usemi wa undugu wa Kiebrania umehifadhiwa, huku maana yake ya kikabila ikifafanuliwa katika tanbihi. ‘Mkavizie’ ni neno la sasa na la kawaida linalowasilisha tendo la kujificha na kusubiri shambulio.
