base_translation:
  language: en
  yaml_path: translation/ot/judges/021/024.yaml
  text: Then the sons of Israel departed from there at that time[a], each man to his tribe and to his family, and they went out from there[b], each man to his inheritance.
translation:
  language: sw
  text: Wana wa Israeli wakaondoka huko wakati huo, kila mtu akaenda kwa kabila lake na ukoo wake; wakaondoka huko, kila mtu akaenda kwenye urithi wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu yake ya nchi ya urithi.” “Urithi” hapa humaanisha umiliki wa ardhi unaorithiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: wakaondoka
  rationale: Hapa hitpaeli ya הלך inaonyesha kuondoka au kutawanyika kutoka mahali walipokusanyika, si kusisitiza kutembea kwa miguu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa njia ya kawaida na yenye hadhi muundo wa Kiebrania unaowataja watu wa Israeli.
- source_word: בָּעֵת הַהִיא
  choice: Wakati huo
  rationale: Ni kiashirio cha wakati kilicho wazi na cha kawaida katika Kiswahili.
- source_word: אִישׁ
  choice: kila mtu
  rationale: Matumizi yake ni ya kugawa mmoja mmoja; 'kila mtu' ni Kiswahili cha kawaida huku maana ya kila mmoja ikihifadhiwa.
- source_word: לְשִׁבְטוֹ
  choice: kwa kabila lake
  rationale: '''Kabila'' ni neno la kawaida la Kiswahili kwa kitengo hiki cha kijamii cha Israeli.'
- source_word: וּלְמִשְׁפַּחְתּוֹ
  choice: na ukoo wake
  rationale: מִשְׁפָּחָה hapa huenda likamaanisha kundi pana la jamaa kuliko familia ndogo; 'ukoo' linaonyesha vizuri kitengo hicho.
- source_word: וַיֵּצְאוּ
  choice: nao wakaondoka
  rationale: יצא kimsingi ni kutoka; katika muktadha huu 'wakaondoka' ni ya kawaida na huhifadhi hatua ya pili ya kuondoka bila kuongeza wazo la kurudi.
- source_word: לְנַחֲלָתוֹ
  choice: kwenye urithi wake
  rationale: '''Urithi'' huhifadhi maana ya kisheria na ya eneo la ardhi lililorithiwa; ufafanuzi wa maana ya eneo umewekwa katika tanbihi.'
theological_decisions: []
