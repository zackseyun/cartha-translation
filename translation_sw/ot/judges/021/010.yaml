  text: וַ/יִּשְׁלְחוּ שָׁ֣ם הָ/עֵדָ֗ה שְׁנֵים עָשָׂ֥ר אֶ֛לֶף אִ֖ישׁ מִ/בְּנֵ֣י הֶ/חָ֑יִל וַ/יְצַוּ֨וּ אוֹתָ֜/ם לֵ/אמֹ֗ר לְ֠כוּ וְ/הִכִּיתֶ֞ם אֶת יוֹשְׁבֵ֨י יָבֵ֤שׁ גִּלְעָד֙ לְ/פִי חֶ֔רֶב וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/010.yaml
  text: So the assembly sent there twelve thousand men from the sons of valor, and they commanded them, saying, “Go and strike the inhabitants of Jabesh-gilead with the edge of the sword, including the women and the little ones.”
translation:
  language: sw
  text: Basi kusanyiko likatuma huko wanaume elfu kumi na mbili miongoni mwa mashujaa. Wakawaamuru, wakisema, “Nendeni mkawapige kwa makali ya upanga wakaaji wa Yabeshi-gileadi, pamoja na wanawake na watoto wadogo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: kusanyiko
  rationale: Neno hili linamaanisha jumuiya iliyokusanyika; “kusanyiko” ni la kawaida, wazi, na linafaa katika muktadha wa mkutano wa Israeli.
- source_word: מִבְּנֵי הֶחָיִל
  choice: miongoni mwa mashujaa
  rationale: Kisemwa halisi ni “kutoka kwa wana wa uhodari/nguvu,” lakini hapa ni nahau inayowataja wanaume hodari wa vita; “mashujaa” huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: וְהִכִּיתֶם
  choice: mkawapige
  rationale: Kitenzi נכה katika muktadha huu wa shambulio la kijeshi na upanga kinaashiria kuwapiga kwa mauti, lakini “kuwapiga” huhifadhi upana wa kitenzi cha Kiebrania bila kuongeza ufafanuzi usiotajwa moja kwa moja.
- source_word: לְפִי חֶרֶב
  choice: kwa makali ya upanga
  rationale: Nahau ya Kiebrania, kihalisi “kwa kinywa cha upanga,” inaeleweka kwa kawaida katika Kiswahili kama “kwa makali ya upanga.”
- source_word: הַטָּף
  choice: watoto wadogo
  rationale: Neno hili hurejelea watoto wadogo au wadogo wanaowategemea wengine; “watoto wadogo” ni wazi na linafaa kwa muktadha.
theological_decisions:
- issue: Amri ya kuwaangamiza wakaaji, wanawake na watoto wakijumuishwa
  choice: Kutafsiri amri hiyo moja kwa moja bila kuipunguza wala kuithibitisha kimaadili
  alternative: Kutumia lugha laini isiyoonyesha wazi ukatili wa amri
  rationale: Andiko linasimulia amri ya kusanyiko katika kipindi cha vurugu cha Waamuzi. Tafsiri inapaswa kuhifadhi mvutano wa kimaadili na kiteolojia uliomo bila kuuficha au kuingiza hukumu ambayo mstari wenyewe hautoi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi “likatuma… wakawaamuru” unafuata mfululizo wa vitenzi vya Kiebrania kwa mtiririko wa kawaida wa Kiswahili.
