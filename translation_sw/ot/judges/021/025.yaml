  language: sw
  text: Siku hizo, hakukuwa na mfalme katika Israeli; kila mtu alifanya lililo sawa machoni pake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Siku hizo
  rationale: Ni fomula ya kawaida ya wakati katika simulizi la Kiebrania; tafsiri hii ni ya asili na yenye heshima katika Kiswahili.
- source_word: אֵין מֶלֶךְ
  choice: hapakuwa na mfalme
  rationale: אֵין pamoja na nomino huonyesha kutokuwapo; kauli hii ya Kiswahili inatoa maana hiyo kwa kawaida.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Kirai hiki hutaja eneo au taifa ambamo hali hiyo ilikuwapo.
- source_word: אִישׁ
  choice: kila mtu
  rationale: Umoja wa Kiebrania umetumiwa kwa maana ya mgawanyo, yaani kila mmoja. Katika Kiswahili cha kawaida, “kila mtu” huhifadhi maana hiyo bila kudokeza kwamba wanaume pekee ndio wanaozungumziwa.
- source_word: הַיָּשָׁר
  choice: yaliyo sawa
  rationale: Kivumishi chenye kibainishi kimetumika kama nomino, kikimaanisha jambo au mambo yaliyoonekana kuwa sawa.
- source_word: בְּעֵינָיו
  choice: machoni pake
  rationale: Hii ni nahau ya Kiebrania inayoonyesha hukumu ya mtu mwenyewe; nahau sambamba ya Kiswahili ni wazi na ya asili.
- source_word: יַעֲשֶׂה
  choice: alifanya
  rationale: Ingawa kitenzi ni cha hali isiyokamilika, katika muhtasari huu kinaeleza tendo la kawaida katika wakati uliopita; wakati uliopita wa Kiswahili unafaa.
theological_decisions:
- issue: Lugha ya uwakilishi katika אִישׁ
  choice: kila mtu
  alternative: kila mwanamume
  rationale: אִישׁ ya umoja inatumiwa hapa kwa maana ya kila mmoja. “Kila mtu” ni uwakilishi sahihi na wa kawaida wa maana hiyo katika Kiswahili, bila kuzuia maana kwa wanaume pekee.
- issue: Tathmini inayodokezwa na kiitikio
  choice: Kuhifadhi kauli bila kuongeza maelezo ya kiufafanuzi
  alternative: kila mtu alifanya lolote alilotaka
  rationale: Muktadha unaweza kuifanya kauli isikike kama tathmini hasi ya hali ya Israeli, lakini Kiebrania chenyewe kinasema kwamba kila mmoja alifanya yaliyo sawa machoni pake. Tafsiri haiongezi ukali usiotamkwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi usambamba na ufupi wa kiitikio cha Kiebrania.
