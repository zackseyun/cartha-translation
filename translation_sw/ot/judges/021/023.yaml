  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י בִנְיָמִ֔ן וַ/יִּשְׂא֤וּ נָשִׁים֙ לְ/מִסְפָּרָ֔/ם מִן הַ/מְּחֹלְל֖וֹת אֲשֶׁ֣ר גָּזָ֑לוּ וַ/יֵּלְכ֗וּ וַ/יָּשׁ֨וּבוּ֙ אֶל נַ֣חֲלָתָ֔/ם וַ/יִּבְנוּ֙ אֶת הֶ֣/עָרִ֔ים וַ/יֵּשְׁב֖וּ בָּ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/023.yaml
  text: So the sons of Benjamin did so[a], and took wives according to their number from the dancers whom they had seized. Then they went and returned to their inheritance, rebuilt the cities[c][b], and lived in them.
translation:
  language: sw
  text: Basi wana wa Benyamini wakafanya hivyo. Wakachukua wake kulingana na idadi yao kutoka miongoni mwa wanawake waliokuwa wakicheza[a], ambao waliwanyakua kwa nguvu[b]. Kisha wakaondoka, wakarudi katika urithi wao, wakajenga upya miji[c], wakakaa humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina umbo la kike la wingi, yaani, “wanawake waliokuwa wakicheza.”
    reason: lexical_alternative
  - marker: b
    text: Au “waliowateka nyara” au “waliowachukua kwa nguvu.” Kitenzi cha Kiebrania kinaonyesha kuchukua kwa nguvu.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania ni “wakajenga miji”; “wakajenga upya” linaakisi muktadha wa miji ya Benyamini iliyokuwa imeharibiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: wakafanya hivyo
  rationale: Ni tamko la kawaida la kisimulizi linalomaanisha kwamba walitekeleza mpango uliotangulia kuelezwa.
- source_word: בְּנֵי בִנְיָמִן
  choice: wana wa Benyamini
  rationale: Linahifadhi usemi wa kifamilia na kikabila wa Kiebrania na linaonyesha kwamba wanaume wa kabila hilo ndio watendaji katika muktadha huu.
- source_word: וַיִּשְׂאוּ נָשִׁים
  choice: wakachukua wake
  rationale: Linahifadhi nahau ya Kiebrania kuhusu kupata wake bila kuuficha muktadha wenye kulazimisha.
- source_word: לְמִסְפָּרָם
  choice: kulingana na idadi yao
  rationale: Linaonyesha kwamba idadi ya wake ililingana na idadi ya wanaume waliohitaji wake.
- source_word: מִן הַמְּחֹלְלוֹת
  choice: kutoka miongoni mwa wanawake waliokuwa wakicheza
  rationale: Kitenzi-jina cha Kiebrania ni cha kike katika wingi; tafsiri hii inaweka wazi kwamba waliokuwa wakicheza walikuwa wanawake.
- source_word: אֲשֶׁר גָּזָלוּ
  choice: ambao waliwanyakua kwa nguvu
  rationale: גזל hudokeza kunyang'anya au kuchukua kwa nguvu. Usemi huu haupunguzi uzito wa kitendo hicho.
- source_word: וַיֵּלְכוּ וַיָּשׁוּבוּ
  choice: wakaondoka, wakarudi
  rationale: Linahifadhi vitenzi vyote viwili huku likitoa mtiririko wa kawaida wa kisimulizi katika Kiswahili.
- source_word: אֶל נַחֲלָתָם
  choice: katika urithi wao
  rationale: “Urithi” linahifadhi maana ya fungu la ardhi la kikabila kuliko neno la jumla kama “eneo.”
- source_word: וַיִּבְנוּ אֶת הֶעָרִים
  choice: wakaijenga upya miji
  rationale: Kitenzi chenyewe ni “kujenga,” lakini muktadha wa miji ya Benyamini iliyoharibiwa unaonyesha kuwa hapa maana ni kuijenga upya.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: na kuishi humo
  rationale: Ni Kiswahili cha sasa na cha kawaida kinachoeleza kukaa katika miji hiyo.
theological_decisions:
- issue: Uzito wa kimaadili wa גָּזָלוּ katika kueleza jinsi wanawake walivyochukuliwa
  choice: ambao waliwanyakua kwa nguvu
  alternative: ambao waliwachukua
  rationale: Tafsiri haipaswi kulainisha lugha ya Kiebrania yenye kuonyesha matumizi ya nguvu, wala kuashiria kwamba simulizi linaidhinisha kitendo hicho.
- issue: Kuhifadhi istilahi za kikabila na za ardhi
  choice: wana wa Benyamini; urithi wao
  alternative: Wabenyamini; eneo lao
  rationale: Maneno haya yanahifadhi muundo wa kifamilia-kikabila na maana ya fungu la ardhi bila kutumia lugha ngumu au ya kizamani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisimulizi ulio wa sasa, wenye heshima na unaoeleweka kwa urahisi. Lugha ya kulazimisha imehifadhiwa bila kuongezwa hukumu ya kimadhehebu.
