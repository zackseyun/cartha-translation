  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּאמְר֡וּ הִנֵּה֩ חַג יְהוָ֨ה בְּ/שִׁל֜וֹ מִ/יָּמִ֣ים יָמִ֗ימָ/ה אֲשֶׁ֞ר מִ/צְּפ֤וֹנָ/ה לְ/בֵֽית אֵל֙ מִזְרְחָ֣/ה הַ/שֶּׁ֔מֶשׁ לִ/מְסִלָּ֔ה הָ/עֹלָ֥ה מִ/בֵּֽית אֵ֖ל שְׁכֶ֑מָ/ה וּ/מִ/נֶּ֖גֶב לִ/לְבוֹנָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/019.yaml
  text: And they said[a], "Look, there is a feast of Yahweh in Shiloh from year to year, which is north of Bethel, east of the highway that goes up from Bethel to Shechem[b], and south of Lebonah."
translation:
  language: sw
  text: Nao wakasema, “Tazama, huko Shilo kuna sikukuu ya Yahweh[a] kila mwaka[b]. Shilo iko kaskazini mwa Betheli, mashariki mwa barabara kuu inayopanda kutoka Betheli kuelekea Shekemu, na kusini mwa Lebona.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sherehe ya Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kwa neno: “kutoka siku hadi siku,” yaani, “mwaka baada ya mwaka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni neno la kawaida na lenye hadhi linalovuta fikira za msikilizaji kwa jambo linalofuata.
- source_word: חַג יְהוָה
  choice: sikukuu ya Yahweh
  rationale: חַג humaanisha sikukuu au sherehe ya kidini, mara nyingi inayohusiana na hija; ‘sikukuu’ ni wazi na ya kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: בְּשִׁלֹה
  choice: huko Shilo
  rationale: Kihusishi cha mahali na jina la eneo vimetafsiriwa kwa Kiswahili cha kawaida.
- source_word: מִיָּמִים יָמִימָה
  choice: kila mwaka
  rationale: Nahau hiyo ya Kiebrania inaonyesha tukio linalorudiwa mwaka baada ya mwaka; ‘kila mwaka’ ni tafsiri ya asili na iliyo wazi.
- source_word: מִצְּפוֹנָה לְבֵית אֵל
  choice: kaskazini mwa Betheli
  rationale: Inaeleza mahali pa Shilo kwa kulinganisha na Betheli.
- source_word: מִזְרְחָה הַשֶּׁמֶשׁ לִמְסִלָּה
  choice: mashariki mwa barabara kuu
  rationale: Neno la mwelekeo lenye maana halisi ya upande wa kuchomoza jua limetolewa kwa maana yake ya kijiografia, ‘mashariki’; מְסִלָּה ni njia au barabara kuu.
- source_word: הָעֹלָה מִבֵּית אֵל שְׁכֶמָה
  choice: inayopanda kutoka Betheli kuelekea Shekemu
  rationale: ‘Inayopanda’ huhifadhi taswira ya mwinuko, na ‘kuelekea’ huonyesha kwa usahihi kiambishi cha mwelekeo katika שְׁכֶמָה.
- source_word: וּמִנֶּגֶב לִלְבוֹנָה
  choice: na kusini mwa Lebona
  rationale: Hukamilisha maelezo ya mahali kwa kuweka Shilo upande wa kusini wa Lebona.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko lina jina la agano katika simulizi lisilo na utata wa kim文本; kulihifadhi kama ‘Yahweh’ huonyesha kuwa ni jina binafsi, si cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Sentensi ya pili imetenganishwa ili maelezo marefu ya kijiografia yawe wazi. Alama za tanbihi zimewekwa karibu na maneno yanayohusika, badala ya kufuata nafasi zisizolingana katika safu ya mashauriano ya Kiingereza.
