lexical_decisions:
- source_word: וַיִּנָּחֲמוּ
  choice: wakamhuzunikia
  rationale: Kitenzi cha Kiebrania katika muktadha huu huonyesha huzuni au huruma kutokana na kuangamia karibu kabisa kwa Benyamini. ‘Wakamhuzunikia’ ni Kiswahili cha kawaida kinachobeba maana ya huzuni kwa ajili yake bila kuondoa uwezekano wa maana ya huruma, ambao umeelezwa katika tanbihi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Huhifadhi taswira ya kifamilia na ya kijumuiya ya Kiebrania huku ikiwa wazi na yenye hadhi katika Kiswahili.
- source_word: אֶל
  choice: -m- ... -ia (katika ‘wakamhuzunikia’)
  rationale: Kihusishi kinamtaja mlengwa wa huzuni au huruma; katika Kiswahili uhusiano huo huwasilishwa kiasili kwa kiambishi cha yambwa pamoja na kauli ya kutendea.
- source_word: בִּנְיָמִן אָחִיו
  choice: Benyamini ndugu yao
  rationale: Ingawa kiambishi cha Kiebrania ni cha umoja, kinahusiana kijumuiya na ‘wana wa Israeli’; ‘ndugu yao’ huonyesha wazi udugu wa kikabila.
- source_word: נִגְדַּע
  choice: limekatiliwa mbali
  rationale: Huhifadhi sitiari kali ya kukatwa au kuondolewa bila kufasiri kupita kiasi kuwa kabila limeangamizwa kabisa.
- source_word: הַיּוֹם
  choice: Leo
  rationale: Ni sawa ya moja kwa moja na ya kawaida, ikihifadhi uzito wa tukio la wakati huo.
- source_word: שֵׁבֶט אֶחָד
  choice: kabila moja
  rationale: Hutaja moja kwa moja kitengo kimoja cha kikabila ndani ya Israeli.
- source_word: מִיִּשְׂרָאֵל
  choice: na Israeli
  rationale: Pamoja na ‘limekatiliwa mbali,’ ‘na’ huonyesha kwa Kiswahili utengano au kuondolewa katika jumuiya ya Israeli.
