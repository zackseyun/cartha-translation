base_translation:
  language: en
  yaml_path: translation/ot/judges/021/018.yaml
  text: But we cannot give them wives from our daughters[a], because the sons of Israel have sworn, saying, ‘Cursed is the one who gives a wife to Benjamin.’
translation:
  language: sw
  text: Lakini sisi hatuwezi kuwapa wake miongoni mwa binti zetu, kwa sababu wana wa Israeli waliapa, wakisema, “Amelaaniwa mtu anayempa Benyamini[a] mke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi, “kabila la Benyamini” au “Mbenyamini”; Kiebrania kinatumia moja kwa moja jina la kabila, “Benyamini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Lakini sisi
  rationale: Kiunganishi pamoja na kiwakilishi huru kinaonyesha utofautishaji na kusisitiza mhusika; “Lakini sisi” ni ya asili na huhifadhi msisitizo huo.
- source_word: לֹא נוּכַל
  choice: hatuwezi
  rationale: Kitenzi kinaeleza kutoweza au kutokuwa na uwezekano. Muktadha unaonyesha kuwa kiapo ndicho kizuizi, bila kuongeza wazo lisilotajwa wazi kama “kisheria.”
- source_word: לָתֵת לָהֶם נָשִׁים מִבְּנוֹתֵינוּ
  choice: kuwapa wake kutoka kwa binti zetu
  rationale: “Wake” inaafiki muktadha wa ndoa, na “kutoka kwa binti zetu” huhifadhi maana ya chanzo ya kihusishi מן.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa neno hili linatanguliza sababu ya wao kutoweza kuwapa wake.
- source_word: נִשְׁבְּעוּ
  choice: walikuwa wameapa
  rationale: Wakati timilifu uliotangulia unaonyesha kuwa kiapo kilitolewa kabla ya mazungumzo haya na bado kilikuwa na nguvu.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi umbo rasmi la Kiebrania lenye jinsia ya kiume badala ya kulifanya kuwa “Waisraeli” kwa ujumla.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Ni namna ya kawaida na wazi ya Kiswahili ya kutambulisha maneno ya kiapo.
- source_word: אָרוּר
  choice: Amelaaniwa
  rationale: Huwasilisha hali ya kuwa chini ya laana kwa lugha ya sasa na yenye heshima.
- source_word: נֹתֵן אִשָּׁה
  choice: mtu anayempa ... mke
  rationale: Kirai shiriki kinatumika kwa maana ya mtu yeyote kwa ujumla, na “mke” hudhihirisha muktadha wa ndoa.
- source_word: לְבִנְיָמִן
  choice: Benyamini
  rationale: Huhifadhi jina la kabila lililotumiwa moja kwa moja katika Kiebrania, huku tanbihi ikifafanua maana yake ya kijamii katika muktadha.
