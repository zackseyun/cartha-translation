base_translation:
  language: en
  yaml_path: translation/ot/judges/021/004.yaml
  text: And the next day the people rose early[a], built an altar there, and offered burnt offerings and peace offerings.
translation:
  language: sw
  text: Siku iliyofuata, watu wakaamka mapema, wakajenga madhabahu pale, wakatoa sadaka za kuteketezwa na sadaka za amani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka za ushirika” au “sadaka za ustawi.” Neno la Kiebrania linamaanisha aina ya dhabihu iliyohusishwa na amani, ukamilifu, ustawi, na ushirika wa pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Kesho yake
  rationale: Kauli hii ya kawaida ya simulizi la Kiebrania inaonyesha siku iliyofuata. Kiswahili cha asili kinaweza kuacha sehemu ya neno kwa neno ‘ikawa’ bila kupoteza maana.
- source_word: וַיַּשְׁכִּימוּ
  choice: wakaamka mapema
  rationale: Kitenzi kina maana ya kuamka au kuanza shughuli mapema; ‘wakaamka mapema’ huhifadhi msisitizo wa wakati na ni Kiswahili cha kawaida.
- source_word: הָעָם
  choice: watu
  rationale: Nomino ya Kiebrania ni neno la kawaida kwa ‘watu.’ Ingawa hapa inawahusu Waisraeli, tafsiri haiongezi utambulisho ambao haukutajwa wazi katika mstari.
- source_word: וַיִּבְנוּ שָׁם מִזְבֵּחַ
  choice: wakajenga madhabahu pale
  rationale: Huhifadhi kitendo, madhabahu, na kielezi cha mahali שָׁם kwa mpangilio wa kawaida wa Kiswahili.
- source_word: וַיַּעֲלוּ
  choice: wakatoa
  rationale: Katika muktadha wa dhabihu, kitenzi hiki kinatumika kwa tendo la kutoa dhabihu; ‘wakatoa’ ni wazi na cha kawaida katika Kiswahili cha Biblia.
- source_word: עֹלוֹת
  choice: sadaka za kuteketezwa
  rationale: Hili ni jina linaloeleweka kwa dhabihu zilizoteketezwa juu ya madhabahu, bila kuongeza maelezo yasiyokuwapo katika mstari.
- source_word: וּשְׁלָמִים
  choice: sadaka za amani
  rationale: ‘Sadaka za amani’ ni istilahi iliyozoeleka na hudumisha uhusiano wa neno la Kiebrania na amani, ukamilifu, ustawi, na ushirika; upana huo unaelezwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya majina ya dhabihu
  choice: sadaka za kuteketezwa na sadaka za amani
  alternative: sadaka za kuteketezwa na sadaka za ushirika / sadaka za ustawi
  rationale: Mstari unataja aina mbili za kawaida za dhabihu za Israeli bila kuzifafanua zaidi. Istilahi zinazotambulika zinatumika katika matini, huku maana mbalimbali za שְׁלָמִים zikihifadhiwa katika tanbihi bila kulazimisha ufafanuzi mmoja wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtiririko wa vitenzi vya simulizi umetolewa kwa viambishi vya mfululizo ‘waka-’. Istilahi za dhabihu ni wazi kwa wasomaji wa kawaida, na tanbihi inalinda upana wa maana wa שְׁלָמִים.
