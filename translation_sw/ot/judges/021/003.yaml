  text: וַ/יֹּ֣אמְר֔וּ לָ/מָ֗ה יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הָ֥יְתָה זֹּ֖את בְּ/יִשְׂרָאֵ֑ל לְ/הִפָּקֵ֥ד הַ/יּ֛וֹם מִ/יִּשְׂרָאֵ֖ל שֵׁ֥בֶט אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/003.yaml
  text: And they said[a], “Why, O Yahweh, God of Israel, has this happened in Israel[b], that today one tribe should be lacking from Israel?”
translation:
  language: sw
  text: Nao wakasema, “Kwa nini, ee Yahweh, Mungu wa Israeli, jambo hili limetokea katika Israeli, hata leo kabila moja likosekane miongoni mwa Israeli?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Nao wakasema
  rationale: Kitenzi cha masimulizi kinaendeleza mfuatano wa matukio; “Nao wakasema” ni Kiswahili cha kawaida na huhifadhi uhusiano huo.
- source_word: לָמָה
  choice: Kwa nini
  rationale: Ni swali la moja kwa moja linaloonyesha maombolezo na kutafuta sababu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huwakilisha kwa uwazi muundo wa umilikaji unaomtambulisha Yahweh kuwa Mungu wa Israeli.
- source_word: הָיְתָה זֹּאת
  choice: jambo hili limetokea
  rationale: Ingawa kwa karibu kabisa ni “hili limekuwa,” hapa ni nahau ya tukio lililotokea; tafsiri hii ni ya asili katika Kiswahili.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Huhifadhi maana ya mahali au ya jamii bila kuibana kuwa eneo la kijiografia pekee.
- source_word: לְהִפָּקֵד
  choice: likosekane
  rationale: Niphal ya פקד hapa inaonyesha kutokuwapo au kupungua kwa sehemu moja kutoka katika jumla; “likosekane” huwasilisha hali hiyo kwa ufupi.
- source_word: הַיּוֹם
  choice: leo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kielezi cha wakati.
- source_word: מִיִּשְׂרָאֵל
  choice: katika Israeli
  rationale: Ingawa מן huonyesha kutengwa kutoka katika jumla, Kiswahili “likosekane katika Israeli” hueleza kwa asili kwamba kabila hilo halipo tena miongoni mwa Israeli.
- source_word: שֵׁבֶט אֶחָד
  choice: kabila moja
  rationale: Hutaja moja ya makabila yanayounda Israeli kwa lugha rahisi na sahihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la agano; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa kishazi לְהִפָּקֵד na tukio lililotangulia
  choice: hata leo kabila moja likosekane
  alternative: ili leo kabila moja likosekane
  rationale: Kishazi kinaweza kueleza matokeo yanayolalamikiwa bila kudai kwamba kupotea kwa kabila kulikuwa kusudi la Mungu; “hata” huhifadhi mshangao na mvutano wa maombolezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Kiingizi cha wito “ee” huhifadhi namna ya kumwambia Mungu moja kwa moja; muundo wa swali umeachwa wazi kama maombolezo bila kuingiza jibu la kitheolojia.
