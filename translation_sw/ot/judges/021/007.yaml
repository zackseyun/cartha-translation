base_translation:
  language: en
  yaml_path: translation/ot/judges/021/007.yaml
  text: What shall we do for them—for those who remain—to get wives? For we have sworn by Yahweh not to give them any of our daughters as wives.
translation:
  language: sw
  text: Tutafanya nini kwa ajili ya wale waliosalia ili wapate wake?[a] Kwa maana tumeapa kwa Yahwe kwamba hatutawapa binti zetu hata mmoja kuwa wake zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “kwa wake.” Maneno “ili wapate” yanaweka wazi maana inayodokezwa na muktadha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה לָהֶם
  choice: Tutawafanyia nini
  rationale: Muundo wa swali pamoja na kitenzi cha nafsi ya kwanza wingi unaonyesha mashauriano kuhusu hatua ya kuchukua kwa faida yao; tafsiri hii ni ya kawaida na huhifadhi maana hiyo.
- source_word: לַנּוֹתָרִים
  choice: wale waliosalia
  rationale: Kirai hiki kinawahusu wanaume wa Benyamini waliobaki baada ya mauaji; ‘waliosalia’ huhifadhi umbo na maana bila kuongeza ufafanuzi wa ‘walionusurika.’
- source_word: לְנָשִׁים
  choice: ili wapate wake
  rationale: Kiebrania kina kirai kifupi kihalisi ‘kwa wake’; Kiswahili cha kawaida huhitaji lengo linalodokezwa liwekwe wazi katika muktadha huu.
- source_word: וַאֲנַחְנוּ נִשְׁבַּעְנוּ
  choice: Kwa maana tumeapa
  rationale: Kiunganishi kinaanzisha sababu ya tatizo lao, na wakati timilifu unaonyesha kiapo cha zamani ambacho bado kinawafunga.
- source_word: בַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi ב hutumiwa katika kanuni ya kuapa kwa jina la Mungu; jina la agano יהוה limetoholewa kuwa ‘Yahwe.’
- source_word: לְבִלְתִּי תֵּת
  choice: kwamba hatutawapa
  rationale: Muundo huu unaeleza yaliyomo katika kiapo, yaani kutowapa mabinti.
- source_word: מִבְּנוֹתֵינוּ
  choice: yeyote kati ya binti zetu
  rationale: Kihusishi מן kina maana ya sehemu ya kundi; ‘yeyote kati ya’ huonyesha kwamba hawangetoa hata binti mmoja.
- source_word: לְנָשִׁים
  choice: kuwa wake zao
  rationale: Katika matumizi ya pili, kirai kinaeleza hali ya ndoa ambayo mabinti wangetolewa kuingia; ‘kuwa wake zao’ ni Kiswahili cha kawaida.
theological_decisions:
- issue: Utafsiri wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina maalumu la agano יהוה, si cheo; ‘Yahwe’ hulihifadhi kama jina la Mungu bila kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tutawafanyia nini’ huhifadhi sauti ya mashauriano, huku ‘ili wapate wake’ ikifanya kirai kifupi cha Kiebrania kieleweke kwa kawaida.
