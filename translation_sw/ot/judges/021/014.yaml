base_translation:
  language: en
  yaml_path: translation/ot/judges/021/014.yaml
  text: So Benjamin returned at that time[a], and they gave them the women whom they had kept alive from the women of Jabesh-gilead; but they did not find enough for them that way.
translation:
  language: sw
  text: Wakati huo Wabenyamini wakarudi, nao wakawapa wale wanawake waliowaacha hai kutoka miongoni mwa wanawake wa Yabeshi-gileadi; lakini hawakupata wanawake wa kutosha kwa ajili yao kwa njia hiyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya neno kwa neno zaidi: “lakini hawakupata hivyo kwa ajili yao.” Usemi wa Kiebrania umeacha baadhi ya maana itegemezwe na muktadha: wanawake waliopatikana kwa njia hiyo hawakuwatosha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: Kitenzi שוב katika mfululizo wa simulizi hapa humaanisha kwa kawaida ‘kurudi’; umoja unaafikiana na jina la kabila linalotumiwa kwa maana ya jumla.
- source_word: בִּנְיָמִן
  choice: Benyamini
  rationale: Jina la kabila limehifadhiwa kama lilivyo katika umoja, ingawa katika muktadha linawakilisha watu wa kabila zima.
- source_word: בָּעֵת הַהִיא
  choice: wakati huo
  rationale: Hii ni tafsiri ya kawaida na ya asili ya usemi wa wakati katika simulizi.
- source_word: וַיִּתְּנוּ לָהֶם
  choice: nao wakawapa
  rationale: נתן pamoja na yambwa isiyo ya moja kwa moja ni ‘kuwapa’; kiwakilishi ‘wao’ kinahifadhi mtendaji asiye tajwa wazi katika Kiebrania.
- source_word: הַנָּשִׁים
  choice: wale wanawake
  rationale: Nomino inamaanisha ‘wanawake,’ si neno mahususi la ‘wake,’ ingawa katika muktadha walikusudiwa kuwa wake.
- source_word: אֲשֶׁר חִיּוּ
  choice: waliokuwa wamewaacha hai
  rationale: Piel ya חיה hapa ina maana ya kusababisha waendelee kuishi baada ya mauaji; ‘kuwaacha hai’ ni Kiswahili cha asili kinachoonyesha kitendo hicho.
- source_word: מִנְּשֵׁי יָבֵשׁ גִּלְעָד
  choice: miongoni mwa wanawake wa Yabeshi-gileadi
  rationale: מן inaonyesha kwamba wanawake hao walitoka katika kundi la wanawake wa mahali hapo; ‘miongoni mwa’ huweka wazi maana hii bila kubadili marejeo.
- source_word: וְלֹא מָצְאוּ לָהֶם כֵּן
  choice: lakini hawakupata wa kutosha kwa ajili yao kwa njia hiyo
  rationale: Usemi wa Kiebrania umebanwa na ni wa kidokezo. Katika muktadha unaonyesha kwamba wanawake waliopatikana kwa njia hiyo hawakutosha kwa Wabenyamini wote.
