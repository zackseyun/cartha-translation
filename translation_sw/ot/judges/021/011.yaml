base_translation:
  language: en
  yaml_path: translation/ot/judges/021/011.yaml
  text: 'And this is what you shall do: every male[a], and every woman who has known the bed of a male[b], you shall devote to destruction.'
translation:
  language: sw
  text: 'Na hili ndilo mtakalofanya: kila mtu wa kiume na kila mwanamke aliyewahi kulala na mwanamume[a] mtawaweka chini ya marufuku ya kuangamizwa.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya wazi zaidi, “aliyewahi kufanya ngono na mwanamume.” Kiebrania hutumia tasfida, “anayejua kitanda cha mwanamume.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatumia istilahi ya kumweka mtu chini ya marufuku ya kuangamizwa, wala si kumuua tu kwa njia ya kawaida.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה הַ/דָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: Nanyi mtafanya hivi
  rationale: Ni Kiswahili cha kawaida kinachohifadhi kiunganishi cha simulizi na nguvu ya agizo la Kiebrania, bila kufuata kwa ugumu muundo wa ‘hili ndilo jambo mtakalofanya.’
- source_word: כָּל זָכָר
  choice: kila mtu wa kiume
  rationale: זָכָר hutaja jinsia ya kiume, si lazima mwanamume mtu mzima; ‘mtu wa kiume’ inahifadhi upana huo kuliko ‘mwanamume.’
- source_word: וְ/כָל אִשָּׁה
  choice: na kila mwanamke
  rationale: אִשָּׁה hapa humaanisha mwanamke, kisha anafafanuliwa kwa habari ya uzoefu wa kingono; ‘mke’ ingekuwa finyu mno.
- source_word: יֹדַעַת מִשְׁכַּב זָכָר
  choice: ambaye amewahi kulala na mwanamume
  rationale: Kauli ya Kiebrania ni tasfida ya kujamiiana. Kiswahili ‘kulala na’ ni tasfida ya sasa, ya kawaida na inayoeleweka, huku ‘amewahi’ ikionyesha uzoefu uliopita unaomtambulisha mwanamke huyo.
- source_word: תַּחֲרִימוּ
  choice: mtawaweka wakfu kwa maangamizi
  rationale: Hifili ya חרם ni istilahi ya kumweka mtu au kitu chini ya marufuku maalumu kwa kuangamizwa. Tafsiri hii inalinda maana hiyo pana kuliko kusema tu ‘mtawaua’.
theological_decisions:
- issue: Tafsiri ya חרם katika muktadha wa vita na hukumu
  choice: mtawaweka wakfu kwa maangamizi
  alternative: mtawaangamiza kabisa; mtawaweka chini ya marufuku ya kuangamizwa
  rationale: Neno la Kiebrania halimaanishi mauaji ya kawaida pekee, bali kuwekwa chini ya marufuku maalumu inayoishia katika maangamizi. Tafsiri iliyochaguliwa huhifadhi uzito huo wa kidini na kisheria, na tanbihi huuzuia usemi ‘wakfu’ usieleweke kama ibada ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Tasfida ya kingono imehifadhiwa kwa usemi wa kawaida ‘kulala na,’ huku tanbihi ikitoa maana ya wazi na umbo la karibu zaidi na Kiebrania. ‘Mtu wa kiume’ limetumiwa badala ya ‘mwanamume’ ili kutobana זָכָר kwa watu wazima pekee.
