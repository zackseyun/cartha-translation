  source_fidelity: Mwanzo wa rasimu, “Nanyi mtafanya hivi,” unawasilisha agizo kwa ujumla lakini hauakisi kikamilifu uundaji wa Kiebrania, “Na hili ndilo jambo mtakalofanya.” Tafsiri ya זָכָר kama “kila mtu wa kiume” huhifadhi vizuri upeo wa jinsia bila kudhani umri wa utu uzima. “Aliyewahi kulala na mwanamume” ni tasfida inayoeleweka kwa יֹדַעַת מִשְׁכַּב זָכָר. Kwa תַּחֲרִימוּ, “kuwaweka wakfu kwa maangamizi” inaweza kusikika kama wakfu wa kawaida wa kidini; usemi wa wazi zaidi wa marufuku ya kuangamizwa huhifadhi vizuri dhana ya חרם.
  naturalness: “Na hili ndilo mtakalofanya” ni Kiswahili Sanifu cha kawaida na kinachoendana na mtindo wa maagizo. “Kuwaweka chini ya marufuku ya kuangamizwa” ni usemi wa kiufundi kwa kiasi, lakini unaeleweka kwa msaada wa tanbihi na unafaa kwa uzito wa istilahi ya chanzo. Tanbihi ya kwanza ya rasimu ina kosa la usemi katika “Kiebrania kwa neno moja,” kwa kuwa ni kirai, si neno moja.
  terminology: “Mtu wa kiume,” “mwanamke,” na “kulala na mwanamume” ni chaguo zinazofaa. Istilahi ya חרם imerekebishwa ili isitafsiriwe kama “wakfu” wa ibada wa kawaida, bali kama marufuku ya kipekee inayolenga maangamizi.
