  yaml_path: translation/ot/judges/021/009.yaml
  text: And the people were mustered[a], and behold, there was not a man there from the inhabitants of Jabesh-gilead.
translation:
  language: sw
  text: Watu walihesabiwa, na tazama, hapakuwa na mwanamume yeyote huko kutoka miongoni mwa wakazi wa Yabeshi-gileadi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuna mtu hata mmoja huko kutoka miongoni mwa wakazi wa Yabeshi-gileadi.” Kiebrania kwa karibu zaidi husema, “hapakuwa na mwanamume huko,” kwa kutumia lugha ya kiume ambayo huenda inaakisi muktadha wa uwakilishi au wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקֵד
  choice: walipohesabiwa kwa ukaguzi
  rationale: Kitenzi cha פקד hapa kinaonyesha watu kuhakikiwa kwa kuhesabiwa ili kujua waliokuwapo; usemi huu ni wa kawaida zaidi kuliko istilahi finyu ya kijeshi, huku ukihifadhi wazo la ukaguzi rasmi.
- source_word: הָעָם
  choice: watu
  rationale: עָם kwa msingi humaanisha watu; muktadha unaonyesha kusanyiko la Waisraeli bila kulazimisha tafsiri ya 'jeshi'.
- source_word: וְהִנֵּה
  choice: ikawa
  rationale: Katika simulizi, הִנֵּה huvuta fikira kwenye jambo lililogunduliwa. 'Ikawa' hutoa msisitizo huo kwa Kiswahili cha asili bila kutumia 'tazama' isiyo ya kawaida hapa.
- source_word: אֵין שָׁם אִישׁ
  choice: hakuna hata mwanamume mmoja
  rationale: Huhifadhi umoja wa kiume wa אִישׁ na kusisitiza kutokuwapo kwa yeyote wa kundi hilo, kulingana na muktadha wa uwakilishi au kijeshi.
- source_word: מִיּוֹשְׁבֵי
  choice: miongoni mwa wakazi wa
  rationale: Umbo la kishiriki la ישב linamaanisha watu wanaoishi mahali; 'wakazi wa' ni Kiswahili cha kawaida na chenye hadhi.
- source_word: יָבֵשׁ גִּלְעָד
  choice: Yabeshi-gileadi
  rationale: Jina la mahali limetoholewa kwa muundo unaoeleweka katika Kiswahili, huku kistari kikionyesha kuwa ni jina moja la mahali.
