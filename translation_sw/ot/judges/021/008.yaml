source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ מִ֗י אֶחָד֙ מִ/שִּׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר לֹֽא עָלָ֥ה אֶל יְהוָ֖ה הַ/מִּצְפָּ֑ה וְ֠/הִנֵּה לֹ֣א בָא אִ֧ישׁ אֶל הַֽ/מַּחֲנֶ֛ה מִ/יָּבֵ֥ישׁ גִּלְעָ֖ד אֶל הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/008.yaml
  text: And they said[a], “Which one of the tribes of Israel did not go up to Yahweh at Mizpah?” And behold, not a man from Jabesh-gilead had come to the camp[b], to the assembly.
translation:
  language: sw
  text: Nao wakasema, “Ni lipi kati ya makabila ya Israeli ambalo halikupanda kwenda kwa Yahwe huko Mizpa[a]?” Kumbe, hakuna hata mtu mmoja kutoka Yabeshi-Gileadi aliyekuwa amekuja kambini[b], kwenye kusanyiko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenda mbele za Yahwe huko Mizpa.” Kiebrania kinaweza kueleweka kuwa walipaswa kujitokeza mbele za Yahwe mahali pa kusanyiko.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “hakuna mtu.” Umbo la umoja linakazia kwamba hakuwapo hata mtu mmoja kutoka Yabeshi-Gileadi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Nao wakasema
  rationale: Inaendeleza simulizi kwa mtiririko wa kawaida wa Kiswahili bila kuongeza mpangilio wa wakati usio wazi katika Kiebrania.
- source_word: מִי אֶחָד מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: Ni lipi kati ya makabila ya Israeli
  rationale: Muundo huu wa Kiswahili unauliza kutambuliwa kwa kabila moja kutoka katika kundi la makabila ya Israeli, huku umoja ukibaki wazi.
- source_word: לֹא עָלָה
  choice: halikupanda kwenda
  rationale: Kitenzi עלה kina maana ya kupanda au kwenda juu kuelekea mahali pa kusanyiko; tafsiri hii inadumisha taswira hiyo bila kuifanya kuwa nzito kupita kiasi.
- source_word: אֶל יְהוָה הַמִּצְפָּה
  choice: kwenda kwa Yahwe huko Mizpa
  rationale: אֶל imetafsiriwa moja kwa moja kama ‘kwa,’ jina la agano יְהוָה likiwa ‘Yahwe,’ na Mizpa likionyeshwa kuwa mahali pa kusanyiko.
- source_word: וְהִנֵּה
  choice: Kumbe
  rationale: Neno hili la Kiswahili linaonyesha ugunduzi wa jambo la kushangaza au la kuzingatiwa, kama וְהִנֵּה katika simulizi.
- source_word: לֹא בָא אִישׁ
  choice: hakuna hata mtu mmoja aliyekuwa amekuja
  rationale: ‘Hata mtu mmoja’ inadumisha msisitizo wa umoja katika אִישׁ baada ya ukanushaji, na wakati timilifu unaonyesha hali iliyogunduliwa wakati huo.
- source_word: מִיָּבֵישׁ גִּלְעָד
  choice: kutoka Yabeshi-gileadi
  rationale: Kiambishi מִן kinaonyesha asili ya watu hao; umbo la jina linafuata matumizi yanayotambulika katika Kiswahili cha Biblia.
- source_word: אֶל הַמַּחֲנֶה ... אֶל הַקָּהָל
  choice: kambini, kwenye kusanyiko
  rationale: Maneno yote mawili yamedumishwa ili kuonyesha kwamba kambi hiyo ilikuwa mahali pa jumuiya iliyokusanyika, bila kuyachanganya kabisa kuwa wazo moja.
theological_decisions:
- issue: Utafsiri wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יְהוָה moja kwa moja; ‘Yahwe’ linadumisha jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya אֶל יְהוָה katika muktadha wa kusanyiko
  choice: kwenda kwa Yahwe
  alternative: kwenda mbele za Yahwe
  rationale: ‘Kwa Yahwe’ hufuata kihusishi אֶל kwa karibu, lakini uwezekano wa maana ya kujitokeza mbele zake umehifadhiwa katika tanbihi badala ya kuamuliwa kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kumbe’ kimetumiwa kwa mtiririko wa kawaida wa simulizi; majina ‘Mizpa’ na ‘Yabeshi-gileadi’ yanaendeleza mtindo wa majina ya kibiblia unaotambulika. Muundo wa mwisho ‘kambini, kwenye kusanyiko’ unadumisha uradidi wa Kiebrania kwa namna inayoeleweka.
