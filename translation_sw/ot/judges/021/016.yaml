  text: וַ/יֹּֽאמְר֨וּ זִקְנֵ֣י הָ/עֵדָ֔ה מַה נַּעֲשֶׂ֥ה לַ/נּוֹתָרִ֖ים לְ/נָשִׁ֑ים כִּֽי נִשְׁמְדָ֥ה מִ/בִּנְיָמִ֖ן אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/016.yaml
  text: Then the elders of the congregation said[a], “What shall we do for wives for those who remain, since the women of Benjamin have been destroyed?”
translation:
  language: sw
  text: Ndipo wazee wa kusanyiko wakasema, “Tutawafanyia nini wale waliosalia ili wapate wake, kwa kuwa wanawake wa Benyamini wameangamizwa?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “kwa kuwa kutoka Benyamini mwanamke ameangamizwa”; neno la umoja “mwanamke” limetumiwa kwa maana ya wanawake wa Benyamini kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעֵדָה
  choice: wazee wa kusanyiko
  rationale: Muundo wa hali ya kutegemea unamaanisha ‘wazee wa kusanyiko.’ ‘Kusanyiko’ linaonyesha jumuiya iliyokusanyika bila kuingiza wazo la taasisi ya kisasa.
- source_word: מַה נַּעֲשֶׂה
  choice: Tutawafanyia nini
  rationale: Kiwakilishi cha kuuliza pamoja na kitenzi cha nafsi ya kwanza wingi kinaonyesha mashauriano kuhusu hatua ya baadaye; kiambishi cha mtendewa kinaeleweka kwa kurejelea wale waliosalia.
- source_word: לַנּוֹתָרִים לְנָשִׁים
  choice: wale waliosalia ili wapate wake
  rationale: לַנּוֹתָרִים ni wale waliobaki baada ya maangamizi, na לְנָשִׁים katika muktadha huu inahusu kuwapatia wanawake wawe wake. Muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: כִּי
  choice: kwa kuwa
  rationale: Hapa neno hilo linatanguliza sababu ya swali la wazee.
- source_word: נִשְׁמְדָה
  choice: wameangamizwa
  rationale: Niphal ya שׁמד ina maana ya kuangamizwa au kutokomezwa; ‘wameangamizwa’ linahifadhi ukali wa taarifa hiyo.
- source_word: מִבִּנְיָמִן אִשָּׁה
  choice: wanawake wa Benyamini
  rationale: Nomino ya umoja אִשָּׁה imetumiwa kwa maana ya jamii nzima. Kiswahili cha kawaida hutumia wingi kueleza maana inayokusudiwa, huku tanbihi ikihifadhi umbo halisi la Kiebrania.
