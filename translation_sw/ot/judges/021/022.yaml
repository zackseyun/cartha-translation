base_translation:
  language: en
  yaml_path: translation/ot/judges/021/022.yaml
  text: And it shall be[a], when their fathers or their brothers come to contend with us, that we will say to them, ‘Show us favor concerning them, because we did not take for each man his wife in the battle; for you did not give them to them[e][d][c][b], at this time, so that you should incur guilt.’
translation:
  language: sw
  text: Itakapotokea kwamba baba zao au ndugu zao watakapokuja kubishana nasi,[a] tutawaambia, ‘Tupeni hao kwa fadhili,[b] kwa sababu hatukuchukua mke kwa ajili ya kila mwanamume vitani;[c] kwa maana ninyi hamkuwapa Wabenjamini wanawake hao;[d] la sivyo, sasa mngekuwa na hatia.’[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuja kutulalamikia” au “kuja kuleta dai dhidi yetu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “tuhurumieni kwa habari yao.” Usemi huu ni mgumu; katika muktadha unaweza pia kumaanisha, “tupeni hao kwa fadhili.” Ombi linahusu wanawake hao na huruma kwa wasemaji katika jambo lao.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania ni kifupi: “hatukumchukulia kila mwanamume mke wake vitani.” Huenda maana yake ni kwamba wake wa kutosha hawakuwa wamepatikana vitani kwa ajili ya wanaume wa Benyamini.'
    reason: cultural_note
  - marker: d
    text: Kwa Kiebrania, “hamkuwapa wao”; viwakilishi vilivyofupishwa vinawarejelea wanawake hao na wanaume wa Benyamini.
    reason: lexical_alternative
  - marker: e
    text: Kifungu cha mwisho ni kigumu katika Kiebrania. Maana inaonekana kuwa kwamba, kwa kuwa familia hazikuwatoa wanawake hao rasmi, hazingehesabiwa kuwa na hatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרִיב
  choice: kuja kushindana nasi
  rationale: Kitenzi ריב kinaweza kumaanisha kushindana, kulalamika, au kuleta dai. ‘Kushindana nasi’ kinadumisha maana pana ya mgogoro bila kuifanya lazima iwe kesi rasmi.
- source_word: חָנּוּנוּ אוֹתָם
  choice: Tufanyieni neema kwa habari yao
  rationale: Amri חָנּוּנוּ ina maana ya moja kwa moja ‘tufanyieni neema,’ huku אוֹתָם ikirejelea wanawake. Tafsiri hii inadumisha ombi la huruma kwa wasemaji kuhusiana na wanawake hao.
- source_word: לֹא לָקַחְנוּ אִישׁ אִשְׁתּוֹ בַּמִּלְחָמָה
  choice: hatukumchukulia kila mwanamume mke wake vitani
  rationale: Kiebrania ni kifupi na kinaweza kusikika kigumu. Muundo huu unaakisi אִישׁ אִשְׁתּוֹ na kudokeza kwamba wake wa kutosha hawakupatikana katika vita.
- source_word: בַּמִּלְחָמָה
  choice: vitani
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kurejelea mazingira au njia ya kupatikana kwa wanawake wakati wa vita.
- source_word: לֹא אַתֶּם נְתַתֶּם לָהֶם
  choice: si ninyi mliowapa wanawake hao
  rationale: Kiswahili kinahitaji kurejesha nomino ili kuepuka mkanganyiko wa viwakilishi vinavyorudiwa katika Kiebrania; maana ni kwamba familia hazikuwakabidhi wanawake hao kwa Wabenjamini.
- source_word: כָּעֵת תֶּאְשָׁמוּ
  choice: la sivyo sasa mngekuwa na hatia
  rationale: Kifungu hiki ni kigumu. Katika muktadha, familia hazina hatia kwa sababu hazikuwatoa wanawake rasmi; ‘la sivyo’ huonyesha matokeo yaliyodokezwa bila kubadili ‘sasa’ ya כָּעֵת.
theological_decisions:
- issue: Hatia ya familia kwa kuvunja kiapo
  choice: Familia hazikuwatoa wanawake hao, na kwa hiyo hazingehesabiwa kuwa na hatia kwa kuwapa Wabenjamini.
  alternative: Kusema tu kwamba sasa zina hatia, bila kuonyesha hali ya kinadharia.
  rationale: 'Muktadha na muundo mgumu wa kifungu cha mwisho unaonyesha hoja ya wazee: kwa kuwa wanawake walichukuliwa badala ya kutolewa rasmi, baba na ndugu zao hawakuvunja kiapo chao moja kwa moja.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Neema’ inadumisha ombi la huruma la חנן; ‘vitani’ ni ya asili zaidi kuliko ‘katika pigano’; na tanbihi zinahifadhi utata wa ריב pamoja na ugumu wa kifungu cha mwisho.
