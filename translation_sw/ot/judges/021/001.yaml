base_translation:
  language: en
  yaml_path: translation/ot/judges/021/001.yaml
  text: The men of Israel had sworn at Mizpah[a], saying, “No man among us shall give his daughter to Benjamin as a wife.”
translation:
  language: sw
  text: Wanaume wa Israeli walikuwa wameapa huko Mispa, wakisema, “Hakuna mwanaume miongoni mwetu atakayempa Benyamini[a] binti yake kuwa mke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania “kwa Benyamini” huenda likamaanisha “kwa kabila la Benyamini” au “kwa mtu wa kabila la Benyamini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: Wanaume wa Israeli
  rationale: Ingawa אִישׁ ni umoja kisarufi, hapa ina maana ya pamoja na inawarejelea wanaume wa Israeli kama kundi. Kiswahili cha wingi kinaonyesha maana hiyo kwa ufasaha.
- source_word: נִשְׁבַּע
  choice: walikuwa wameapa
  rationale: Niphal ya שׁבע humaanisha kuapa. Wakati timilifu uliotangulia unaonyesha kwamba kiapo kilikuwa kimefanywa kabla ya matukio yanayofuata.
- source_word: בַּמִּצְפָּה
  choice: huko Mispa
  rationale: Muundo huu unaonyesha mahali kiapo kilipofanywa; “huko Mispa” ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Huu ni utangulizi wa kawaida wa Kiebrania unaoanzisha maneno ya kiapo.
- source_word: אִישׁ מִמֶּנּוּ
  choice: Hakuna mtu miongoni mwetu
  rationale: Katika muktadha wa kiapo, usemi huu una maana ya kila mmoja katika kundi hilo; tafsiri hii huhifadhi nguvu yake ya kugawa wajibu kwa kila mtu.
- source_word: לֹא יִתֵּן
  choice: atakayempa
  rationale: Kitenzi kisichotimilika chenye ukanushi katika kiapo kinaonyesha ahadi yenye kuwafunga kuhusu tendo la baadaye. Muundo huu wa Kiswahili unaingizwa kwa kawaida chini ya “hakuna mtu.”
- source_word: בִּתּוֹ
  choice: binti yake
  rationale: Hii ni tafsiri ya moja kwa moja ya nomino ya umoja yenye kiambishi cha umilikaji.
- source_word: לְבִנְיָמִן
  choice: Benyamini[a]
  rationale: Jina la umoja Benyamini limehifadhiwa kama lilivyo katika Kiebrania, huku tanbihi ikieleza kwamba huenda likawakilisha kabila lote au mtu mmoja wa kabila hilo.
- source_word: לְאִשָּׁה
  choice: kuwa mke
  rationale: Muundo huu humaanisha kumpa mwanamke katika ndoa ili awe mke; “kuwa mke” ni wazi, wa kawaida, na wa karibu na nahau ya Kiebrania.
