translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio unahifadhi uzito wa kiapo bila kutumia msamiati wa kidhehebu. Alama ya tanbihi imewekwa baada ya “Benyamini,” ambako ufafanuzi wake unahusika.
