base_translation:
  language: en
  yaml_path: translation/ot/judges/004/004.yaml
  text: Deborah, a woman, a prophetess, the wife of Lappidoth, was judging Israel at that time.
translation:
  language: sw
  text: Debora, mwanamke na nabii, mke wa Lapidothi, alikuwa akihukumu Israeli wakati huo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה נְבִיאָה
  choice: mwanamke nabii
  rationale: Huhifadhi kutajwa wazi kwa Debora kuwa mwanamke na kuwa nabii, kwa Kiswahili cha kawaida, bila kufuta neno אִשָּׁה wala kutumia muundo mzito wa ‘nabii wa kike’.
- source_word: אֵשֶׁת לַפִּידוֹת
  choice: mke wa Lapidothi
  rationale: Maana ya kawaida ya אֵשֶׁת ni ‘mke wa’; jina לַפִּידוֹת limetoholewa kuwa Lapidothi kwa matamshi ya Kiswahili.
- source_word: שֹׁפְטָה אֶת־יִשְׂרָאֵל
  choice: alikuwa akihukumu Israeli
  rationale: Muundo wa kuendelea ‘alikuwa akihukumu’ unaakisi hali endelevu ya kitenzi kishirikishi cha Kiebrania na unaacha wigo wa jukumu la mwamuzi—kuamua mashauri na kuongoza—bila kuongeza maelezo yasiyomo.
- source_word: בָּעֵת הַהִיא
  choice: wakati huo
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kirai kinachoonyesha kipindi kilichotajwa katika simulizi.
theological_decisions:
- issue: Kutajwa kwa jinsia na wadhifa wa kinabii wa Debora
  choice: mwanamke nabii
  alternative: nabii wa kike
  rationale: Chaguo hili linahifadhi vipengele vyote viwili vya maandishi ya Kiebrania—‘mwanamke’ na ‘nabii’—bila kuvifanya kuwa maelezo ya kimadhehebu au kudhoofisha wadhifa wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi inafuata msisitizo wa chanzo huku ikibaki ya kawaida katika Kiswahili cha sasa.
