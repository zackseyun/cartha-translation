base_translation:
  language: en
  yaml_path: translation/ot/judges/004/005.yaml
  text: She used to sit under the palm of Deborah[a], between Ramah and Bethel in the hill country of Ephraim[b], and the sons of Israel went up to her for judgment.
translation:
  language: sw
  text: Naye alikuwa akiketi chini ya mtende wa Debora, kati ya Rama na Betheli, katika nchi ya vilima ya Efraimu; nao wana wa Israeli[a] walikuwa wakipanda kwenda kwake ili kupata hukumu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.” Kiebrania kinasema “wana wa Israeli,” usemi wa kawaida unaowataja watu wa Israeli kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Au “ili watendewe haki” au “ili wapate uamuzi wa kisheria.” Neno la Kiebrania linaweza kumaanisha kutoa uamuzi wa kimahakama au kutekeleza haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֶׁבֶת
  choice: alikuwa akiketi
  rationale: Muundo huu unaonyesha desturi ya Debora kuketi mahali hapo, si tendo la mara moja tu.
- source_word: תַּחַת
  choice: chini ya
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya mahali palipo chini ya mti.
- source_word: תֹּמֶר דְּבוֹרָה
  choice: mtende wa Debora
  rationale: Muundo wa Kiebrania unamtambulisha mtende unaohusishwa na Debora; Kiswahili hiki ni cha asili bila kuufanya lazima kuwa jina rasmi la mahali.
- source_word: בֵּין הָרָמָה וּבֵין בֵּית אֵל
  choice: kati ya Rama na Betheli
  rationale: Haya ni majina ya mahali yanayotolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: בְּהַר אֶפְרָיִם
  choice: katika nchi ya vilima ya Efraimu
  rationale: Neno la umoja הַר hapa linataja eneo la milima au vilima, si kilele kimoja kiitwacho Mlima Efraimu.
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: walikuwa wakipanda kwenda kwake
  rationale: Tafsiri hii inadumisha wazo la kupanda kuelekea eneo la vilima, huku hali ya mazoea katika simulizi ikionyeshwa kwa Kiswahili cha asili.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hifadhi usemi halisi wa Kiebrania unaowataja watu wa Israeli kwa ujumla kama wana wa Israeli.
- source_word: לַמִּשְׁפָּט
  choice: ili kupata hukumu
  rationale: Katika muktadha huu neno linahusu uamuzi wa kimahakama au utekelezaji wa haki; usemi huu ni wazi na wa kawaida kwa Kiswahili.
theological_decisions:
- issue: Usemi wa pamoja wenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Usemi wa Kiebrania umehifadhiwa badala ya kusawazishwa, ingawa katika muktadha huu unawahusu watu wa Israeli kwa ujumla, si wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa mazoea umetumiwa kwa kuketi kwa Debora na kwa watu kumwendea. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika, kwa kuwa nafasi zake katika safu ya Kiingereza hazikulingana na maelezo ya tanbihi.
