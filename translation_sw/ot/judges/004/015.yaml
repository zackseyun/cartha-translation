  text: וַ/יָּ֣הָם יְ֠הוָה אֶת סִֽיסְרָ֨א וְ/אֶת כָּל הָ/רֶ֧כֶב וְ/אֶת כָּל הַֽ/מַּחֲנֶ֛ה לְ/פִי חֶ֖רֶב לִ/פְנֵ֣י בָרָ֑ק וַ/יֵּ֧רֶד סִֽיסְרָ֛א מֵ/עַ֥ל הַ/מֶּרְכָּבָ֖ה וַ/יָּ֥נָס בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/015.yaml
  text: And Yahweh threw Sisera[a], all his chariots, and all his army into confusion before Barak by the sword[c][b]. Then Sisera got down from his chariot and fled on foot.
translation:
  language: sw
  text: Yahwe akavuruga[a] Sisera, magari yake yote ya vita, na jeshi lake lote[b] mbele ya Baraka kwa makali ya upanga.[c] Ndipo Sisera akashuka kutoka katika gari lake la vita, akakimbia kwa miguu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akawatia katika hofu na vurugu”; kitenzi cha Kiebrania kinaweza kumaanisha kusababisha hofu au mkanganyiko vitani.
    reason: lexical_alternative
  - marker: b
    text: Au “kambi yake yote” au “kikosi chake chote”; hapa neno hilo linaelekea kumaanisha jeshi lote.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania, “kwa kinywa cha upanga,” yaani kwa makali ya upanga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּהָם
  choice: akawavuruga
  rationale: Kitenzi המם katika masimulizi ya vita humaanisha kusababisha hofu, mkanganyiko, au vurugu. “Akawavuruga” ni Kiswahili cha kawaida kinachohifadhi tendo la Yahwe bila kudai kwamba kitenzi hiki peke yake kinamaanisha kuangamizwa kabisa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: הָרֶכֶב
  choice: magari yake yote ya vita
  rationale: רֶכֶב inaweza kumaanisha magari ya vita kwa ujumla au kikosi cha magari hayo. Kauli hii ni ya asili katika Kiswahili na, kwa muktadha, kiwakilishi “yake” kinaonyesha kwamba yalikuwa chini ya Sisera.
- source_word: הַמַּחֲנֶה
  choice: jeshi lake lote
  rationale: Ingawa מַחֲנֶה kwa msingi inaweza kuwa kambi, katika muktadha huu wa mapigano inaelekea kumaanisha kikosi chote kilichopiga kambi, yaani jeshi.
- source_word: לְפִי חֶרֶב
  choice: kwa makali ya upanga
  rationale: Nahau hii kwa neno moja moja ni “kwa kinywa cha upanga.” “Kwa makali ya upanga” huhifadhi taswira na maana ya kushindwa au kuuawa kwa upanga kwa Kiswahili kinachoeleweka.
- source_word: לִפְנֵי בָרָק
  choice: mbele ya Baraka
  rationale: לִפְנֵי huonyesha kwamba tukio lilitokea mbele ya Baraka katika mwendo wa vita; tafsiri hii ni fupi na inaacha upeo wa uhusiano huo kama ulivyo katika chanzo.
- source_word: מֵעַל הַמֶּרְכָּבָה
  choice: kutoka katika gari lake la vita
  rationale: Kiebrania kinasema “kutoka juu ya lile gari,” lakini kiwakilishi cha umilikaji ni cha asili katika Kiswahili kwa gari alilokuwa akitumia Sisera.
- source_word: וַיָּנָס בְּרַגְלָיו
  choice: akakimbia kwa miguu
  rationale: Nahau hii inaonyesha kwamba Sisera alikimbia bila gari, kwa miguu; inahifadhi tofauti kati ya kuacha gari na kukimbia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Matini inatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa Maandiko. “Gari la vita” limetumiwa badala ya “gari” pekee ili msomaji wa sasa asifikirie gari la injini; muundo unabaki wa moja kwa moja na unaoeleweka.
