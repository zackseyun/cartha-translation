  source_fidelity: 'Tafsiri inafuata kwa karibu muundo na maana ya Kiebrania: Baraka anamfuatilia Sisera; Yaeli anatoka kumlaki na kumwalika; Baraka anaingia; Sisera anaonekana akiwa maiti na kigingi kikiwa katika eneo la kichwa. Hata hivyo, רַקָּה inamaanisha hasa upande wa kichwa/hekalu (temple), si ''kipaji'' kwa maana ya paji la uso. Tanbihi ya sasa haiwezi kurekebisha uchaguzi mkuu unaopotoka kidogo.'
