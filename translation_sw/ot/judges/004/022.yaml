    rationale: Kwa kuwa 'upande wa kichwa' ndiyo maana pana na salama zaidi ya neno la Kiebrania hapa, inafaa iwe katika maandishi makuu; tanbihi inaweza, ikihitajika, kutaja 'hekalu la kichwa' kama ufafanuzi.
