base_translation:
  language: en
  yaml_path: translation/ot/judges/004/022.yaml
  text: And look, Barak was pursuing Sisera. Jael went out to meet him and said to him, “Come, and I will show you the man whom you are seeking.” So he went in to her, and look, Sisera was lying there dead, with the tent peg in his temple.
translation:
  language: sw
  text: Na tazama, Baraka alikuwa akimfuatilia Sisera. Yaeli akatoka kwenda kumlaki, akamwambia, “Njoo, nami nitakuonyesha mtu unayemtafuta.” Basi akaingia kwake, na tazama, Sisera alikuwa amelala hapo, amekufa, na kigingi cha hema kilikuwa katika upande wa kichwa chake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, katika hekalu la kichwa chake.
    reason: Kiebrania רַקָּה hutaja upande wa kichwa, hasa eneo la hekalu kati ya jicho na sikio.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Inahifadhi ishara ya simulizi inayovuta fikira za msomaji kwenye tukio lisilotazamiwa; imetumika kwa uthabiti katika sehemu zote mbili.
- source_word: רֹדֵף
  choice: alikuwa akimfuatilia
  rationale: Umbo la wakati unaoendelea linaonyesha Baraka akiwa katika harakati za kumwandama Sisera.
- source_word: לִקְרָאתוֹ
  choice: kwenda kumlaki
  rationale: Ni Kiswahili cha kawaida kinachoonyesha Yaeli alitoka ili kukutana naye alipokuwa akija.
- source_word: לֵךְ
  choice: Njoo
  rationale: Ingawa kimsingi kitenzi hiki kinaweza kumaanisha ‘nenda’, katika mwaliko wa mzungumzaji kwa mtu amfuate mahali fulani, ‘njoo’ ni usemi wa asili wa Kiswahili na unaendana na muktadha.
- source_word: נֹפֵל מֵת
  choice: alikuwa amelala hapo akiwa amekufa
  rationale: Neno נֹפֵל kihalisi ni ‘ameanguka/amelala chini’; hapa linaeleza hali ambayo Baraka alimkuta Sisera. ‘Amelala hapo akiwa amekufa’ ni wazi bila kudokeza kwamba alikuwa amelala usingizi.
- source_word: יָתֵד
  choice: kigingi cha hema
  rationale: Muktadha wa 4:21 unabainisha kuwa ni kigingi cha hema, si kigingi cha aina nyingine.
- source_word: רַקָּתוֹ
  choice: kipaji chake
  rationale: Neno linaweza kutaja eneo la upande wa kichwa kati ya jicho na sikio; ‘kipaji’ ni tafsiri iliyozoeleka lakini inahitaji ufafanuzi wa tanbihi kwa usahihi wa kianatomia.
