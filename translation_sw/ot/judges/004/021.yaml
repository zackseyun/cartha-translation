  text: וַ/תִּקַּ֣ח יָעֵ֣ל אֵֽשֶׁת חֶ֠בֶר אֶת יְתַ֨ד הָ/אֹ֜הֶל וַ/תָּ֧שֶׂם אֶת הַ/מַּקֶּ֣בֶת בְּ/יָדָ֗/הּ וַ/תָּב֤וֹא אֵלָי/ו֙ בַּ/לָּ֔אט וַ/תִּתְקַ֤ע אֶת הַ/יָּתֵד֙ בְּ/רַקָּת֔/וֹ וַ/תִּצְנַ֖ח בָּ/אָ֑רֶץ וְ/הֽוּא נִרְדָּ֥ם וַ/יָּ֖עַף וַ/יָּמֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/021.yaml
  text: Then Jael[a], the wife of Heber, took a tent peg and put a hammer in her hand, and she went to him quietly and drove the peg into his temple, and it went down into the ground. Now he was fast asleep and exhausted[b], and he died.
translation:
  language: sw
  text: Ndipo Yaeli, mke wa Heberi, akachukua kigingi cha hema, akashika nyundo mkononi, akamwendea kimya kimya[a], akakipigilia kigingi hicho kwenye upande wa kichwa chake, nacho kikazama ardhini[b]. Alikuwa amelala fofofo na amechoka, naye akafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kunyemelea.” Kiebrania huonyesha kwamba alimkaribia kimya, bila kelele.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kwa neno kwa neno: “nacho kikazama ardhini”; kitenzi cha kike kwa kawaida humrejelea kile kigingi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְתַד / הַיָּתֵד
  choice: kigingi cha hema / kile kigingi
  rationale: Ni kigingi cha kufungia hema; ‘kigingi cha hema’ ni wazi na cha kawaida katika Kiswahili.
- source_word: הַמַּקֶּבֶת
  choice: nyundo
  rationale: Neno linaonyesha chombo cha kupigia kigingi; ‘nyundo’ ni tafsiri ya kawaida na inayoeleweka.
- source_word: בְּיָדָהּ
  choice: akashika nyundo mkononi
  rationale: Hutoa Kiswahili cha asili huku ikihifadhi wazi kwamba nyundo ilikuwa mkononi mwake.
- source_word: בַּלָּאט
  choice: kimya kimya
  rationale: Husisitiza namna ya kumkaribia bila kelele wala kujionyesha, bila kulazimisha wazo la nia ya siri.
- source_word: וַתִּתְקַע
  choice: akakipigilia
  rationale: Katika muktadha wa nyundo na kigingi, kitenzi kinaonyesha kukipiga kigingi kwa nguvu hadi kikaingia.
- source_word: בְּרַקָּתוֹ
  choice: kwenye kipaji chake
  rationale: ‘Kipaji’ katika Kiswahili hurejelea eneo la upande wa paji la kichwa (temple); ‘kwenye’ haiongezi dai kwamba kilipenya upande mwingine.
- source_word: וַתִּצְנַח בָּאָרֶץ
  choice: nacho kikapenya hadi ardhini
  rationale: Kitenzi cha kike kwa kawaida humrejelea kigingi; tafsiri hii huweka wazi mrejelewa na mfuatano wa tendo.
- source_word: נִרְדָּם וַיָּעַף
  choice: alikuwa amelala fofofo kwa sababu ya uchovu
  rationale: Huonyesha hali yake ya usingizi mzito na uchovu kwa Kiswahili cha asili; uhusiano wa kisababishi unaeleweka katika muktadha, ingawa Kiebrania huunganisha hali hizo kwa uratibu.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Huhifadhi hitimisho fupi na la moja kwa moja la simulizi.
- source_word: אֵשֶׁת חֶבֶר
  choice: mke wa Heberi
  rationale: Ni apposition ya moja kwa moja, ya asili katika Kiswahili, na iliyo karibu na muundo wa Kiebrania.
