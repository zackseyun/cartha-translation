  yaml_path: translation/ot/judges/004/010.yaml
  text: Then Barak summoned Zebulun and Naphtali to Kedesh[a], and ten thousand men went up following him, and Deborah went up with him.
translation:
  language: sw
  text: Ndipo Baraka akawaita Zabuloni na Naftali waende Kedeshi. Wanaume elfu kumi wakapanda wakimfuata[a], naye Debora akapanda pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “miguuni pake,” nahau inayomaanisha kwamba walimfuata au walikwenda chini ya uongozi wake.
