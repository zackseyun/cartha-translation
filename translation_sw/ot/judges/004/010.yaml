lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: akawaita ... yakusanyike
  rationale: Hifili ya זעק hapa ina maana ya kuita watu wakusanyike kwa shughuli ya kijeshi; usemi huu ni wa asili kwa Kiswahili bila kudokeza uandikishaji rasmi.
- source_word: אֶת זְבוּלֻן וְאֶת נַפְתָּלִי
  choice: makabila ya Zabuloni na Naftali
  rationale: Majina haya yanawakilisha makabila yaliyoitwa, hivyo neno “makabila” linaweka wazi maana inayodokezwa na muktadha.
- source_word: קֶדְשָׁה
  choice: Kedeshi
  rationale: He ya uelekeo inaonyesha mwendo kuelekea Kedeshi; pamoja na kitenzi “yakusanyike,” mahali pa mkusanyiko panaeleweka kwa kawaida.
- source_word: וַיַּעַל
  choice: wakapanda
  rationale: Huhifadhi maana ya msingi ya עלה, ambayo inaweza kuonyesha kupanda kwenda sehemu ya juu au mwendo wa kijeshi.
- source_word: בְּרַגְלָיו
  choice: wakimfuata
  rationale: Nahau halisi “miguuni pake” hapa inaeleza askari waliomfuata Baraka au kwenda chini ya uongozi wake; tafsiri ya maana ni ya kawaida zaidi kwa Kiswahili.
- source_word: עֲשֶׂרֶת אַלְפֵי אִישׁ
  choice: wanaume elfu kumi
  rationale: Hii ndiyo idadi na jinsia inayotajwa moja kwa moja katika Kiebrania, katika muktadha wa jeshi.
- source_word: וַתַּעַל עִמּוֹ דְּבוֹרָה
  choice: naye Debora akapanda pamoja naye
  rationale: Huhifadhi kurudiwa kwa kitenzi עלה na ukweli kwamba Debora aliandamana na Baraka.
