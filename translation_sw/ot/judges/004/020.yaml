  yaml_path: translation/ot/judges/004/020.yaml
  text: And he said to her[a], “Stand at the entrance of the tent, and if anyone comes and asks you, saying, ‘Is there a man here?’ you shall say, ‘No.’”
translation:
  language: sw
  text: Akamwambia, “Simama penye mlango wa hema; mwanamume yeyote akija na kukuuliza, ‘Je, kuna mwanamume hapa?’ useme, ‘Hakuna.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲמֹד
  choice: Simama
  rationale: Ni amri ya moja kwa moja ya kitenzi עמד, inayomtaka akae au achukue nafasi hapo; “Simama” ni ya kawaida na wazi katika Kiswahili.
- source_word: פֶּתַח הָאֹהֶל
  choice: kwenye mwingilio wa hema
  rationale: פֶּתַח ni sehemu ya kuingilia au uwazi. “Mwingilio wa hema” inaeleza mahali hapa bila kudokeza kwamba hema lina mlango mgumu.
- source_word: וְהָיָה אִם
  choice: akija
  rationale: Muundo huu unaanzisha hali ya sharti. Katika Kiswahili, kiambishi cha masharti -ki- kinawasilisha maana hiyo kwa kawaida bila kuiga nahau ya Kiebrania neno kwa neno.
- source_word: אִישׁ
  choice: mwanamume
  rationale: Neno אִישׁ linamaanisha “mwanamume” hapa na limerudiwa katika sharti na swali. Tafsiri inahifadhi urudiaji huo, huku “yeyote” ikionyesha kutokuwa maalumu kwa mtu huyo.
- source_word: יָבֹוא
  choice: akija
  rationale: בוא kwa kawaida humaanisha kuja; hapa ni kufika karibu na hema, si lazima kuingia ndani.
- source_word: וּשְׁאֵלֵךְ
  choice: na kukuuliza
  rationale: שׁאל katika muktadha huu ni kuuliza au kutaka habari. Usemi huu ni wa moja kwa moja na wa kawaida.
- source_word: הֲיֵשׁ פֹּה אִישׁ
  choice: Je, kuna mwanamume hapa?
  rationale: Muundo wa swali unauliza kama mwanamume yupo mahali hapo. “Je, kuna ... hapa?” ni Kiswahili sanifu na huhifadhi neno אִישׁ.
- source_word: אָיִן
  choice: Hakuna
  rationale: Jibu la Kiebrania ni fupi na la kukana. “Hakuna” huhifadhi ufupi huo na linaeleweka kwa kawaida katika muktadha.
