  text: וְ/חֶ֤בֶר הַ/קֵּינִי֙ נִפְרָ֣ד מִ/קַּ֔יִן מִ/בְּנֵ֥י חֹבָ֖ב חֹתֵ֣ן מֹשֶׁ֑ה וַ/יֵּ֣ט אָהֳל֔/וֹ עַד אֵל֥וֹן ב/צענים אֲשֶׁ֥ר אֶת קֶֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/011.yaml
  text: Heber the Kenite had separated from the Kenites[a], from the sons of Hobab, the father-in-law of Moses, and had pitched his tent as far as the oak in Zaannannim[b], which is near Kedesh.
translation:
  language: sw
  text: Heberi, Mkeni, alikuwa amejitenga na Wakeni, wazao wa Hobabu, mkwe[a] wa Musa; naye alikuwa amepiga hema lake hadi kwenye mwaloni huko Saananimu[b], mahali karibu na Kedeshi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baba mkwe wa Musa”; neno la Kiebrania linaweza kumaanisha kwa upana zaidi ndugu wa upande wa ndoa.
    reason: alternative_reading
  - marker: b
    text: Au, “mterebinti wa Saananimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְרָד
  choice: alikuwa amejitenga
  rationale: Kauli ya Nifali hapa inaonyesha kujitenga au kuondoka katika kundi; wakati uliotangulia unafaa kwa maelezo haya ya usuli.
- source_word: מִקַּיִן / הַקֵּינִי
  choice: na Wakeni / Mkeni
  rationale: Katika muktadha huu maneno hayo yanarejelea kabila la Wakeni, si mtu binafsi Kaini.
- source_word: מִבְּנֵי חֹבָב
  choice: yaani, na wazao wa Hobabu
  rationale: Ingawa בני ni ‘wana wa’ kihalisi, hapa inaashiria ukoo unaotokana na Hobabu; ‘wazao’ ni wazi na ya kawaida katika Kiswahili.
- source_word: חֹתֵן מֹשֶׁה
  choice: mkwewe Musa
  rationale: חֹתֵן humaanisha ndugu kwa njia ya ndoa na mara nyingi baba mkwe. ‘Mkwewe Musa’ huhifadhi upana wa istilahi ya Kiebrania bila kulazimisha uhusiano mahususi.
- source_word: וַיֵּט אָהֳלוֹ
  choice: alikuwa amepiga hema lake
  rationale: Nahau hii humaanisha kusimamisha au kupiga hema; umbo la wakati uliotangulia linaendana na taarifa ya usuli.
- source_word: עַד
  choice: hadi kwenye
  rationale: Neno hilo huonyesha mpaka au umbali wa kuelekea mahali fulani.
- source_word: אֵלוֹן
  choice: mwaloni
  rationale: אֵלוֹן huweza kumaanisha mti mkubwa, hasa mwaloni au mterebinti; ‘mwaloni’ ni tafsiri iliyo wazi, huku chaguo jingine likiwekwa katika tanbihi.
- source_word: בצענים
  choice: wa Saananimu
  rationale: Hili ni jina la mahali; limetoholewa kwa tahajia inayosomeka kwa Waswahili bila kutafsiri maana yake isiyo hakika.
- source_word: אֲשֶׁר אֶת קֶדֶשׁ
  choice: ulio karibu na Kedeshi
  rationale: Muundo huu unaonyesha ukaribu wa mahali na Kedeshi.
theological_decisions:
- issue: Maana ya חֹתֵן katika uhusiano na Musa
  choice: mkwewe Musa
  alternative: baba mkwe wa Musa
  rationale: Istilahi ya Kiebrania inaweza kuwa pana kuliko ‘baba mkwe.’ Kiswahili ‘mkwe’ huhifadhi uhusiano wa kindoa na utata halisi wa neno bila kuamua kimyakimya uhusiano mahususi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yametoholewa kuwa Heberi, Hobabu, Saananimu na Kedeshi. Sentensi imegawanywa mara mbili ili kuepuka mfuatano mzito wa vifungu huku uhusiano wa kisintaksia ukihifadhiwa.
