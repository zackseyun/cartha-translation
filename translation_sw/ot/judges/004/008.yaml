base_translation:
  language: en
  yaml_path: translation/ot/judges/004/008.yaml
  text: Barak said to her[a], “If you will go with me, I will go; but if you will not go with me, I will not go.”
translation:
  language: sw
  text: Baraka akamwambia, “Ukienda pamoja nami, nitaenda; lakini usipoenda pamoja nami, sitaenda.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: akamwambia
  rationale: Muundo huu wa kawaida wa simulizi unaonyesha kwamba Baraka alisema maneno haya kwa Debora. Kiswahili cha kawaida huunganisha kitenzi na yambwa katika ‘akamwambia.’
- source_word: בָּרָק
  choice: Baraka
  rationale: Jina hili linatoholewa kwa umbo lililozoeleka katika Biblia za Kiswahili.
- source_word: אִם תֵּלְכִי עִמִּי
  choice: ukienda pamoja nami
  rationale: Sharti la Kiebrania linatafsiriwa kwa u-ki- wa Kiswahili; umbo la kitenzi ni la nafsi ya pili ya kike na linamrejelea Debora. ‘Pamoja nami’ huonyesha wazi maana ya kuandamana.
- source_word: וְהָלָכְתִּי
  choice: nitaenda
  rationale: Kitenzi timilifu baada ya kishazi cha sharti kinafanya kazi kama matokeo ya sharti; wakati ujao wa Kiswahili unaifikisha maana hiyo kwa kawaida.
- source_word: וְאִם לֹא תֵלְכִי עִמִּי
  choice: lakini usipoenda pamoja nami
  rationale: Kiunganishi kinaanzisha sharti la pili linalotofautiana na la kwanza. ‘Lakini’ huleta utofautishaji huo, na ‘usipoenda’ huhifadhi muundo wa sharti hasi.
- source_word: לֹא אֵלֵךְ
  choice: sitaenda
  rationale: 'Hili ni tamko hasi la matokeo ya sharti: Baraka hatakwenda ikiwa Debora hataandamana naye.'
