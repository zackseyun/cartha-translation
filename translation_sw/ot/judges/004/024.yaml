  text: And the hand of the sons of Israel went on[a], growing stronger against Jabin king of Canaan[c][b], until they cut off Jabin king of Canaan.
translation:
  language: sw
  text: Nao mkono wa wana wa Israeli ukazidi kuwa mzito dhidi ya Yabini, mfalme wa Kanaani, mpaka walipomwangamiza Yabini, mfalme wa Kanaani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “walipomwangamiza” ni, kwa maana ya moja kwa moja, “walimkatilia mbali”; hapa humaanisha walimwondoa au kumwangamiza kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ יַד
  choice: mkono ... ukazidi
  rationale: Neno kwa neno ni ‘mkono ukaenda,’ lakini hapa ‘mkono’ ni tamathali ya nguvu au uwezo, na kitenzi pamoja na muundo unaofuata huonyesha mwendelezo unaoongezeka. ‘Mkono ... ukazidi’ huhifadhi picha ya Kiebrania kwa Kiswahili kinachoeleweka.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hii inafuata kwa karibu usemi wa Kiebrania ‘wana wa Israeli’ badala ya kuufanya moja kwa moja ‘Waisraeli.’
- source_word: הָלוֹךְ וְקָשָׁה
  choice: ukazidi kuwa mzito
  rationale: Muundo huu unaonyesha shinikizo lililozidi kuongezeka. ‘Kuwa mzito dhidi ya’ huhifadhi tamathali ya mkono uliowalemea maadui na maana ya nguvu iliyoongezeka.
- source_word: עַל
  choice: dhidi ya
  rationale: Katika muktadha wa uhasama na vita, ‘dhidi ya’ huonyesha kwa kawaida nguvu iliyoelekezwa juu ya mpinzani.
- source_word: הִכְרִיתוּ
  choice: walipomwangamiza
  rationale: Hifili ya כרת ina maana ya kukatilia mbali au kuondoa kabisa; katika muktadha huu Yabini anaondolewa kwa ushindi wa mwisho. ‘Kumwangamiza’ huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi picha halisi ya ‘kumkatilia mbali.’
