  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Picha ya ‘mkono’ imehifadhiwa, huku muundo usio wa kawaida wa Kiebrania ‘ukaenda na kuwa mzito’ ukitolewa kwa usemi wa asili zaidi: ‘ukazidi kuwa mzito.’'
