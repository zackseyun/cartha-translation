  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/אֵה֖וּד מֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh after Ehud died[a].
translation:
  language: sw
  text: Baada ya Ehudi kufa, wana wa Israeli wakafanya tena yaliyo mabaya machoni pa Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Waisraeli.” Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: wakafanya tena
  rationale: Kitenzi יסף pamoja na kitenzi-jina huonyesha kurudia au kuendelea kufanya jambo. Katika mzunguko wa simulizi la Waamuzi, “wakafanya tena” linaeleza wazi kurudia kwa uovu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi muundo wa Kiebrania “wana wa Israeli,” huku tanbihi ikitoa usemi wa kawaida zaidi wa Kiswahili.
- source_word: לַעֲשׂוֹת הָרַע
  choice: wakafanya ... yaliyo maovu
  rationale: Kirai hiki ni njia ya asili ya Kiswahili ya kuwasilisha kivumishi cha Kiebrania kilichotumika kama nomino, yaani mambo yaliyo maovu.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahweh
  rationale: Huhifadhi taswira halisi ya nahau ya Kiebrania “machoni pa” na inaeleweka vizuri katika Kiswahili sanifu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne katika Kiebrania limetolewa kama jina binafsi “Yahweh,” si kubadilishwa kuwa cheo.
- source_word: וְאֵהוּד מֵת
  choice: Baada ya Ehudi kufa
  rationale: 'Ingawa kwa umbo ni kiunganishi pamoja na kitenzi timilifu, muktadha unaonyesha hali ya wakati: kurudia kwa uovu kulitokea baada ya kifo cha Ehudi. Kuliweka mwanzoni ni mtiririko wa asili wa Kiswahili.'
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Jina la pamoja lenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: “Wana wa Israeli” hufuata umbo la Kiebrania, ambalo ni la kiume lakini linawakilisha jumuiya nzima. Tanbihi inalinda maana hiyo ya kijumuiya kwa usemi wa kawaida.
- issue: Uhusiano wa kisintaksia wa וְאֵהוּד מֵת
  choice: Baada ya Ehudi kufa
  alternative: na Ehudi akafa / Ehudi akiwa amekufa
  rationale: Katika muktadha, kishazi hiki kinaweka wakati wa kurudia kwa dhambi baada ya kifo cha mwamuzi. Tafsiri ya wakati inafaa zaidi katika Kiswahili bila kubadili hoja ya simulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa kishazi cha wakati mwanzoni huleta mtiririko wa asili; “machoni pa” huhifadhi taswira ya Kiebrania.
