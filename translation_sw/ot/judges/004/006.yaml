  text: וַ/תִּשְׁלַ֗ח וַ/תִּקְרָא֙ לְ/בָרָ֣ק בֶּן אֲבִינֹ֔עַם מִ/קֶּ֖דֶשׁ נַפְתָּלִ֑י וַ/תֹּ֨אמֶר אֵלָ֜י/ו הֲ/לֹ֥א צִוָּ֣ה יְהוָ֣ה אֱלֹהֵֽי יִשְׂרָאֵ֗ל לֵ֤ךְ וּ/מָֽשַׁכְתָּ֙ בְּ/הַ֣ר תָּב֔וֹר וְ/לָקַחְתָּ֣ עִמְּ/ךָ֗ עֲשֶׂ֤רֶת אֲלָפִים֙ אִ֔ישׁ מִ/בְּנֵ֥י נַפְתָּלִ֖י וּ/מִ/בְּנֵ֥י זְבֻלֽוּן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/006.yaml
  text: 'She sent and summoned Barak son of Abinoam from Kedesh-naphtali, and said to him, “Has not the LORD, the God of Israel, commanded: ‘Go, draw up to Mount Tabor, and take with you ten thousand men from the sons of Naphtali and from the sons of Zebulun’?”'
translation:
  language: sw
  text: 'Basi akatuma, akamwita Baraka mwana wa Abinoamu kutoka Kedeshi-naftali, akamwambia, “Je, BWANA, Mungu wa Israeli, hajaamuru hivi: ‘Nenda, ukusanye watu kwenye Mlima Tabori, nawe uchukue pamoja nawe wanaume elfu kumi kutoka kwa wana wa Naftali na kutoka kwa wana wa Zabuloni’?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: akatuma watu wamwite
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida tendo la kutuma wajumbe ili kumwita Baraka, bila kuongeza maelezo yasiyokuwapo katika chanzo.
- source_word: מִקֶּדֶשׁ נַפְתָּלִי
  choice: kutoka Kedeshi-naftali
  rationale: Jina la mahali limehifadhiwa kama kitengo kimoja na kutofautishwa na kabila la Naftali linalotajwa baadaye.
- source_word: הֲלֹא צִוָּה
  choice: Je, ... hajaamuru hivi
  rationale: Huhifadhi swali la balagha la Kiebrania, ambalo linatarajia jibu la kukubali.
- source_word: לֵךְ וּמָשַׁכְתָּ בְּהַר תָּבוֹר
  choice: Nenda, uwakusanye watu wako kwenye Mlima Tabori
  rationale: מָשַׁךְ kimsingi ni ‘kuvuta/kuongoza’; katika muktadha wa kijeshi inaweza kumaanisha kuwakusanya au kuwaongoza askari kuelekea eneo hilo. ‘Uwakusanye watu wako’ ni Kiswahili cha kawaida kinacholingana na muktadha bila kudai kwa uhakika kwamba maana ni kupanda mlima.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: wanaume elfu kumi
  rationale: אִישׁ hapa inawahusu wanaume waliokusanywa kwa shughuli ya kijeshi; idadi imewasilishwa kwa mtindo wa kawaida wa Kiswahili.
- source_word: מִבְּנֵי נַפְתָּלִי וּמִבְּנֵי זְבֻלוּן
  choice: kutoka kwa wana wa Naftali na wana wa Zabuloni
  rationale: ‘Wana wa’ huhifadhi lugha ya ukoo/kikabila ya chanzo huku ikieleweka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ ni desturi iliyoenea katika Biblia za Kiswahili kwa tetragramatoni, imeandikwa kwa herufi kubwa ili kuitofautisha na cheo cha kawaida, bila kuingiza msimamo wa dhehebu.
- issue: Nguvu ya swali la Debora
  choice: Je, BWANA ... hajaamuru hivi
  alternative: BWANA ... amekuamuru
  rationale: Swali la balagha limehifadhiwa badala ya kubadilishwa kuwa taarifa ya moja kwa moja; hivyo sauti na msisitizo wa chanzo vinabaki.
- issue: Mhusika anayeelekezwa na kitenzi מָשַׁךְ
  choice: uwakusanye watu wako
  alternative: uende kuelekea / upande
  rationale: Kiebrania hakitaji wazi kitu cha kitenzi. Tafsiri imeonyesha maana inayowezekana ya kijeshi, lakini ‘watu wako’ inaeleweka kutokana na amri inayofuata ya kuchukua wanaume elfu kumi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Majina yametoholewa kwa mazoea ya Kiswahili: Baraka, Abinoamu, Kedeshi-naftali, Tabori, Naftali, na Zabuloni.'
