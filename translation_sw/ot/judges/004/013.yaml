  yaml_path: translation/ot/judges/004/013.yaml
  text: Then Sisera called together all his chariots[a], nine hundred iron chariots, and all the people who were with him, from Harosheth-haggoyim to the Wadi Kishon.
translation:
  language: sw
  text: Ndipo Sisera akakusanya magari yake yote ya vita—magari ya vita mia tisa ya chuma—pamoja na watu wote waliokuwa naye, kutoka Haroshethi-Hagoyimu hadi Kijito cha Kishoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mto Kishoni,” “mkondo wa Kishoni,” au “bonde la Kishoni.” Neno la Kiebrania naḥal linaweza kumaanisha kijito, mkondo wa maji wa msimu, au bonde lenye mkondo huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: akakusanya
  rationale: Katika muktadha huu wa kijeshi, kitenzi זעק kinamaanisha kuita vikosi vije pamoja au kuvipanga kwa mapambano. “Akakusanya” ni Kiswahili cha kawaida kinachobeba maana hiyo bila kuongeza maelezo yasiyokuwapo katika Kiebrania.
- source_word: רִכְבּוֹ
  choice: magari yake yote ya vita
  rationale: רכב hapa ni magari ya vita kwa ujumla; kirai kinachofuata cha magari mia tisa kinafafanua idadi yake. Neno “vita” linaondoa uwezekano wa kuyaelewa kama magari ya kawaida ya kisasa.
- source_word: תְּשַׁע מֵאוֹת רֶכֶב בַּרְזֶל
  choice: magari mia tisa ya vita ya chuma
  rationale: Tafsiri hii inahifadhi idadi na maelezo ya Kiebrania. “Ya chuma” haikulazimishi dhana kwamba kila sehemu ya magari hayo ilikuwa ya chuma; yanaweza kuwa yalitiwa au kuimarishwa kwa chuma.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: watu wote waliokuwa naye
  rationale: עָם kimsingi ni “watu.” Ingawa hapa muktadha ni wa kijeshi, “watu wote waliokuwa naye” hudumisha upana wa usemi wa Kiebrania bila kuubadili moja kwa moja kuwa “jeshi.”
- source_word: מֵחֲרֹשֶׁת הַגּוֹיִם
  choice: kutoka Haroshethi-hagoyimu
  rationale: Jina hili la mahali limetoholewa kwa matamshi yanayofaa Kiswahili badala ya kutafsiriwa kama “Haroshethi ya Mataifa.” Kiambishi מִן kimetafsiriwa “kutoka.”
- source_word: נַחַל קִישׁוֹן
  choice: Kijito cha Kishoni
  rationale: נַחַל inaweza kumaanisha kijito, mkondo wa maji wa msimu, au bonde lake. “Kijito cha Kishoni” ni cha kawaida na kinachoeleweka, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
