translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye staha. Majina yametoholewa kwa tahajia inayosomeka kwa Waswahili. Muundo wa marudio kuhusu magari umehifadhiwa kwa sababu kirai cha “magari mia tisa” kinafafanua “magari yake yote ya vita.”
