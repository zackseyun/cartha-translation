  yaml_path: translation/ot/judges/004/019.yaml
  text: And he said to her[a], “Please give me a little water to drink, for I am thirsty.” So she opened the skin of milk and gave him a drink and covered him.
translation:
  language: sw
  text: Akamwambia, “Tafadhali nipe maji kidogo ninywe, kwa maana nina kiu.” Basi akafungua kiriba[a] cha maziwa, akamnywesha, kisha akamfunika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiriba ni chombo kilichotengenezwa kwa ngozi ya mnyama, si chupa ya kisasa.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁקִי־נִי
  choice: nipe ... ninywe
  rationale: Kauli ya kusababisha ya שׁקה pamoja na kiambishi cha nafsi ya kwanza ina maana ya kumpa mtu kitu anywe. Usemi huu ni wa kawaida katika Kiswahili na unahifadhi ombi pamoja na wazo la kumpa kinywaji.
- source_word: נָא
  choice: Tafadhali
  rationale: Hiki ni kipashio cha adabu kinacholegeza amri; “tafadhali” ndilo neno la kawaida na la heshima katika Kiswahili cha sasa.
- source_word: מְעַט מַיִם
  choice: maji kidogo
  rationale: מְעַט huonyesha kiasi kidogo. Mpangilio “maji kidogo” ni wa kawaida katika Kiswahili.
- source_word: כִּי צָמֵאתִי
  choice: kwa maana nina kiu
  rationale: Kishazi hiki kinatoa sababu ya ombi. “Nina kiu” ni usemi wa asili na unaoeleweka kwa urahisi.
- source_word: נֹאוד הֶחָלָב
  choice: kiriba cha maziwa
  rationale: נֹאוד ni chombo kilichotengenezwa kwa ngozi, si chupa ya kisasa. “Kiriba” hudumisha mazingira ya kale, na “cha maziwa” huonyesha kilichokuwa ndani yake.
- source_word: וַתַּשְׁקֵהוּ
  choice: akampa anywe
  rationale: Kauli ya kusababisha inaonyesha kwamba alimpa kinywaji. Maziwa yametajwa mara moja kabla, hivyo hayahitaji kurudiwa; pia usemi huu haudokezi kwamba alilazimishwa kunywa.
- source_word: וַתְּכַסֵּהוּ
  choice: akamfunika
  rationale: כסה humaanisha kufunika au kuficha. Tafsiri inaacha kifuniko chenyewe bila kutajwa, kama ilivyo katika Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Mfuatano wa simulizi umehifadhiwa kwa “Basi,” na tofauti kati ya ombi la maji na kutolewa kwa maziwa imeachwa wazi bila maelezo ya ziada.
