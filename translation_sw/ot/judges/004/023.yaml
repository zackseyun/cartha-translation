  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּכְנַ֤ע אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/ה֔וּא אֵ֖ת יָבִ֣ין מֶֽלֶךְ כְּנָ֑עַן לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/023.yaml
  text: So on that day God subdued Jabin king of Canaan before the sons of Israel[a].
translation:
  language: sw
  text: Basi siku hiyo Mungu akamtiisha Yabini, mfalme wa Kanaani, mbele ya wana wa Israeli[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watoto wa Israeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: akamtiisha
  rationale: Hifili ya כנע humaanisha kumfanya adhalilike au awe chini ya mamlaka. Katika muktadha huu wa ushindi dhidi ya adui, “akamtiisha” huonyesha kushindwa na kuwekwa chini ya nguvu nyingine bila kuifanya kuwa hali ya ndani tu.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Nomino hii inamtaja Mungu wa Israeli anayechukua hatua katika historia; kwa hiyo umoja “Mungu” unafaa.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Hii ni tafsiri ya kawaida na ya asili ya kirai cha wakati, nayo inadumisha kiashiria cha simulizi.
- source_word: אֵת יָבִין
  choice: Yabini
  rationale: אֵת ni alama ya yambwa tendwa, na jina יָבִין limetoholewa kwa mwandiko wa kawaida wa Kiswahili kuwa “Yabini.”
- source_word: מֶלֶךְ כְּנָעַן
  choice: mfalme wa Kanaani
  rationale: Muundo wa viambatanisho unamaanisha moja kwa moja “mfalme wa Kanaani”; hapa ni maelezo yanayofafanua Yabini.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: 'Tafsiri hii inahifadhi taswira na uhusiano wa Kiebrania: Yabini alitiishwa mbele ya, au akikabiliwa na, wana wa Israeli.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Kiebrania kinasema kihalisi “wana wa Israeli.” Tafsiri hii huhifadhi usemi wa chanzo, huku tanbihi ikitoa “Waisraeli” kama namna ya kawaida zaidi ya kueleza kundi hilo.
theological_decisions:
- issue: Utendaji wa Mungu katika ushindi wa Israeli
  choice: Mungu ametajwa moja kwa moja kuwa ndiye aliyemtiisha Yabini.
  alternative: Kutumia kauli isiyo na mtendaji au kueleza tu kwamba Israeli walimshinda Yabini.
  rationale: Kiebrania kinamtaja אֱלֹהִים waziwazi kuwa kiima cha kitenzi. Tafsiri inadumisha utendaji huo wa Mungu badala ya kuwasilisha tukio kana kwamba lilikuwa ushindi wa wanadamu pekee.
- issue: Usemi wa kijinsia kuhusu watu wa agano
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Chanzo kina usemi wa kiume wa wingi בְּנֵי יִשְׂרָאֵל. Matini kuu inahifadhi umbo hilo, na tanbihi inafafanua namna nyingine za kulielewa bila kuficha wording ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. “Basi” linaunganisha aya hii na matokeo ya simulizi lililotangulia; “akamtiisha” hudumisha maana ya ushindi na kuwekwa chini ya mamlaka.
