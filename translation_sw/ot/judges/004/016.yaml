base_translation:
  language: en
  yaml_path: translation/ot/judges/004/016.yaml
  text: And Barak pursued the chariots and the army as far as Harosheth of the nations[a], and all Sisera’s army fell by the edge of the sword[b]; not even one was left.
translation:
  language: sw
  text: Baraki akafuatilia magari ya vita[a] na jeshi mpaka Haroshethi ya mataifa[b]. Jeshi lote la Sisera likaanguka kwa makali ya upanga; hakuna hata mmoja aliyebaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kikosi cha magari ya vita,” kwa kulichukua neno “magari” kuwa istilahi ya kijeshi yenye maana ya kijumla.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Haroshethi ya mataifa”; kijadi, “Haroshethi-hagoyimu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָדַף אַחֲרֵי
  choice: akayafuatilia
  rationale: Muundo huu unaonyesha kufuatilia adui kwa nguvu katika mapambano; “akayafuatilia” ni wa kawaida na unahifadhi maana ya kijeshi.
- source_word: הָרֶכֶב
  choice: magari ya vita
  rationale: Nomino hii ina maana ya kijumla hapa. “Magari ya vita” inaeleweka wazi katika Kiswahili cha sasa na inafaa katika muktadha wa vita.
- source_word: הַמַּחֲנֶה
  choice: jeshi
  rationale: Katika simulizi hili neno halimaanishi tu kambi, bali kikosi cha kijeshi; “jeshi” linafikisha maana hiyo wazi.
- source_word: עַד חֲרֹשֶׁת הַגּוֹיִם
  choice: mpaka Haroshethi ya Mataifa
  rationale: “Mpaka” huonyesha umbali wa ufuatiliaji. Jina Haroshethi limetoholewa, huku sehemu ya Kiebrania inayomaanisha “ya Mataifa” ikihifadhiwa.
- source_word: וַיִּפֹּל כָּל מַחֲנֵה סִיסְרָא
  choice: Jeshi lote la Sisera likaanguka
  rationale: Kitenzi cha umoja kinaambatana na kundi linalotazamwa kwa ujumla. “Likaanguka” linahifadhi nahau ya Kiebrania ya kuuawa au kushindwa vitani.
- source_word: לְפִי חֶרֶב
  choice: kwa makali ya upanga
  rationale: Hii ni nahau ya Kiebrania kuhusu kuuawa vitani. “Kwa makali ya upanga” huhifadhi taswira ya maneno ya chanzo na ni Kiswahili cha kawaida.
- source_word: לֹא נִשְׁאַר עַד אֶחָד
  choice: hakuna hata mmoja aliyebaki
  rationale: Kauli hii inasisitiza kwamba jeshi hilo liliangamizwa kabisa; tafsiri hii ni ya asili katika Kiswahili na huhifadhi msisitizo wa “hata mmoja.”
