base_translation:
  language: en
  yaml_path: translation/ot/judges/004/002.yaml
  text: So Yahweh sold them into the hand of Jabin king of Canaan[a], who reigned in Hazor; and the commander of his army was Sisera[b], who lived in Harosheth-haggoyim.
translation:
  language: sw
  text: Basi Yahweh akawauza mikononi mwa Yabini, mfalme wa Kanaani,[a] aliyetawala huko Hasori. Mkuu wa jeshi lake alikuwa Sisera, aliyeishi Harosheth-hagoyimu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina sitiari ya ‘kuwauza mikononi mwa,’ yaani, kuwatia chini ya mamlaka ya Yabini kama hukumu.
    reason: lexical_alternative
  - marker: b
    text: Huenda Harosheth-hagoyimu likamaanisha “Harosheth ya Mataifa.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְכְּרֵם
  choice: akawauza
  rationale: Kitenzi cha Kiebrania מָכַר humaanisha kihalisi ‘kuuza.’ Tafsiri hii inadumisha sitiari yenye uzito ya hukumu, badala ya kuilainisha kuwa ‘akawatia chini ya mamlaka.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi, bila kubadilishwa kuwa cheo.
- source_word: בְּיַד
  choice: mikononi mwa
  rationale: Hii ni nahau inayomaanisha kutiwa chini ya mamlaka ya mtu. Kiswahili cha ‘mikononi mwa’ kinahifadhi taswira ya chanzo na ni cha kawaida zaidi kuliko ‘katika mkono wa.’
- source_word: יָבִין מֶלֶךְ כְּנַעַן
  choice: Yabini, mfalme wa Kanaani
  rationale: Muundo huu unawakilisha kwa uwazi jina la mfalme na eneo la ufalme wake.
- source_word: אֲשֶׁר מָלַךְ בְּחָצוֹר
  choice: aliyetawala huko Hasori
  rationale: מָלַךְ humaanisha kutawala akiwa mfalme; ‘huko’ linaonyesha mahali pa utawala kwa Kiswahili cha kawaida.
- source_word: וְשַׂר צְבָאוֹ
  choice: Mkuu wa jeshi lake
  rationale: שַׂר צָבָא ni kiongozi mwenye amri kuu ya kijeshi; ‘mkuu wa jeshi’ ni msemo wazi na wa sasa.
- source_word: סִיסְרָא
  choice: Sisera
  rationale: Hili ni umbo la kawaida la jina hili katika Kiswahili.
- source_word: וְהוּא יוֹשֵׁב
  choice: aliyeishi
  rationale: Kirai cha Kiebrania kinaeleza makao ya Sisera; ‘aliyeishi’ ni Kiswahili cha kawaida kinachodumisha rejeleo hilo.
- source_word: בַּחֲרֹשֶׁת הַגּוֹיִם
  choice: Harosheth-hagoyimu
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa katika matini kuu, ili kuepuka kuwasilisha maana inayokadiriwa ya jina kana kwamba ni hakika.
theological_decisions:
- issue: Utendaji wa Mungu katika kutiishwa kwa Israeli
  choice: Yahweh ndiye aliyewauza moja kwa moja mikononi mwa Yabini.
  alternative: Yahweh aliruhusu tu waanguke chini ya mamlaka ya Yabini.
  rationale: Kitenzi cha Kiebrania kinamhusisha Yahweh moja kwa moja na hukumu hii. Tafsiri haipunguzi kauli hiyo na kuifanya ruhusa tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Sitiari ya ‘kuuza’ imehifadhiwa, huku nahau ya ‘mikononi mwa’ ikifanya sentensi iwe ya kawaida katika Kiswahili. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
