  text: וְ/סִֽיסְרָא֙ נָ֣ס בְּ/רַגְלָ֔י/ו אֶל אֹ֣הֶל יָעֵ֔ל אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י כִּ֣י שָׁל֗וֹם בֵּ֚ין יָבִ֣ין מֶֽלֶךְ חָצ֔וֹר וּ/בֵ֕ין בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/017.yaml
  text: But Sisera fled on foot to the tent of Jael[a], the wife of Heber the Kenite[b], because there was peace between Jabin king of Hazor and the house of Heber the Kenite.
translation:
  language: sw
  text: Lakini Sisera akakimbia kwa miguu hadi kwenye hema la Yaeli[a], mke wa Heberi Mkeni, kwa sababu kulikuwa na amani kati ya Yabini, mfalme wa Hazori, na nyumba ya Heberi Mkeni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Naye Sisera akakimbia kwa miguu.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa tu “na”; “lakini” kinaonyesha tofauti inayoonekana katika muktadha wa simulizi.
    reason: alternative_reading
  - marker: b
    text: “Nyumba ya Heberi” maana yake ni kaya au ukoo wa Heberi.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/סִֽיסְרָא֙
  choice: Lakini Sisera
  rationale: Kiunganishi וְ kinaweza kutafsiriwa “na,” lakini hapa muktadha unaonyesha tofauti kati ya kushindwa kwa jeshi na kukimbia kwa Sisera; “lakini” huwasilisha mpito huo kwa Kiswahili cha kawaida.
- source_word: נָ֣ס
  choice: akakimbia
  rationale: Kitenzi נס katika qal humaanisha kukimbia ili kujiokoa; “akakimbia” ni simulizi la asili na la moja kwa moja kwa Kiswahili.
- source_word: בְּ/רַגְלָ֔י/ו
  choice: kwa miguu
  rationale: Hii ndiyo nahau ya kawaida ya Kiswahili inayoonyesha kwamba alikimbia bila gari.
- source_word: אֶל אֹ֣הֶל יָעֵ֔ל
  choice: hadi kwenye hema la Yaeli
  rationale: Muundo huu unaeleza mahali alipokimbilia. “Hadi kwenye” ni wa kawaida katika Kiswahili na “hema la Yaeli” linatunza uhusiano wa umilikaji.
- source_word: אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י
  choice: mke wa Heberi Mkeni
  rationale: Tafsiri hii inamtambulisha Yaeli kwa uwazi huku ikihifadhi jina la jamii ya Heberi.
- source_word: כִּ֣י
  choice: kwa sababu
  rationale: כִּי hapa inaanzisha sababu ya Sisera kuelekea huko; “kwa sababu” ni wazi katika Kiswahili cha sasa.
- source_word: שָׁל֗וֹם
  choice: amani
  rationale: “Amani” huhifadhi upana wa שָׁלוֹם, ambayo hapa inaashiria mahusiano yasiyo ya uhasama bila kudai kwa lazima kwamba kulikuwa na mkataba rasmi.
- source_word: בֵּ֚ין יָבִ֣ין מֶֽלֶךְ חָצ֔וֹר וּ/בֵ֕ין
  choice: kati ya Yabini, mfalme wa Hazori, na
  rationale: Huu ni uwasilishaji wa moja kwa moja na wa kawaida wa uhusiano na cheo cha Yabini.
- source_word: בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי
  choice: nyumba ya Heberi Mkeni
  rationale: “Nyumba” ni kilinganishi rasmi cha בֵּית na hapa humaanisha kaya au ukoo; tanbihi inaeleza maana hiyo ya kijamii.
