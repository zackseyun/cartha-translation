  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Sisera, Yaeli, Heberi, Yabini, na Hazori. Sentensi inadumisha maana pana ya “amani” na ya “nyumba” bila kuibana kuwa mkataba rasmi au familia ndogo pekee.'
