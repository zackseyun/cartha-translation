  text: And they told Sisera that Barak son of Abinoam had gone up to Mount Tabor.
translation:
  language: sw
  text: Wakamwambia Sisera kwamba Baraka, mwana wa Abinoamu, alikuwa amepanda Mlima Tabori.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: Wakamwambia
  rationale: Hifili ya נגד hapa ina maana ya ‘kumwambia/kumjulisha.’ Kiima cha wingi hakijatajwa; Kiswahili cha kutenda ‘wakamwambia’ kinahifadhi hali hiyo bila kuongeza wahusika.
- source_word: לְסִיסְרָא
  choice: Sisera
  rationale: Kihusishi לְ kinamtambulisha mpokeaji wa taarifa; katika Kiswahili huingizwa kiasili ndani ya kitenzi ‘wakamwambia Sisera.’
- source_word: כִּי
  choice: kwamba
  rationale: Baada ya kitenzi cha kusema, כִּי kinaanzisha taarifa iliyotolewa, si sababu.
- source_word: עָלָה
  choice: alikuwa amepanda kwenda
  rationale: עלה humaanisha kupanda au kwenda juu. Muundo huu unaonyesha kuwa tendo lilikuwa limetangulia taarifa na kwamba Mlima Tabori ulikuwa mahali alikoelekea.
- source_word: בָּרָק
  choice: Baraka
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בֶּן אֲבִינֹעַם
  choice: mwana wa Abinoamu
  rationale: Huhifadhi moja kwa moja uhusiano wa ukoo unaoonyeshwa na muundo wa Kiebrania.
- source_word: הַר תָּבוֹר
  choice: Mlima Tabori
  rationale: הַר pamoja na jina la kilele maalumu hutafsiriwa kiasili kama ‘Mlima’; ‘Tabori’ ni umbo lililozoeleka katika Kiswahili.
