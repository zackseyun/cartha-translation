base_translation:
  language: en
  yaml_path: translation/ot/judges/004/018.yaml
  text: Jael went out to meet Sisera and said to him[a], “Turn aside, my lord, turn aside to me; do not be afraid.” So he turned aside to her into the tent[b], and she covered him with a blanket.
translation:
  language: sw
  text: Yaeli akatoka kumlaki Sisera, akamwambia, “Geuka,[a] bwana wangu, geuka uje kwangu; usiogope.” Basi akageuka, akaingia katika hema, naye akamfunika kwa blanketi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania humaanisha hasa “geuka” au “pinda njia”; linaweza pia kutafsiriwa “ingia.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza pia kumaanisha zulia au kitambaa kingine cha kufunikia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: akatoka
  rationale: Kitenzi יצא kinaonyesha mwendo wa kutoka; “akatoka” ni cha kawaida na kinadumisha mwelekeo wa simulizi.
- source_word: לִקְרַאת
  choice: kwenda kumlaki
  rationale: לִקְרַאת huonyesha mwendo wa makusudi kuelekea mtu ili kukutana naye; “kwenda kumlaki” ni ya asili katika Kiswahili sanifu.
- source_word: סוּרָה
  choice: karibu kwangu
  rationale: Ingawa maana ya msingi ni kugeuka au kupotoka kutoka njiani, katika muktadha huu ni mwaliko wa kuja kwake na kuingia mahali pa hifadhi. “Karibu kwangu” huwasilisha kazi hiyo kwa Kiswahili cha kawaida huku urudiaji ukihifadhiwa.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Ni namna ya heshima ya kumwambia mwanamume mwenye hadhi; “bwana wangu” huhifadhi unyenyekevu wa usemi bila kuifanya kuwa jina la Mungu.
- source_word: אַל תִּירָא
  choice: usiogope
  rationale: Ni katazo la moja kwa moja lenye maana ya kutuliza hofu; “usiogope” ni wazi na la kawaida.
- source_word: וַיָּסַר
  choice: akaingia kwake
  rationale: Kitenzi kilekile cha סוּרָה kinaonyesha kuwa Sisera aliitikia mwaliko. Katika Kiswahili, “akaingia kwake” huonyesha kwa ufasaha matokeo ya kugeuka kutoka njiani kuelekea kwa Yaeli.
- source_word: הָאֹהֱלָה
  choice: ndani ya hema
  rationale: Kiishio cha mwelekeo kinaonyesha mwendo kuelekea au kuingia hemani; muktadha unaunga mkono “ndani ya hema.”
- source_word: וַתְּכַסֵּהוּ
  choice: akamfunika
  rationale: כסה kimsingi ni kufunika; tafsiri hii haiongezi wazo la kumficha ingawa linaweza kudokezwa na muktadha.
- source_word: בַּשְּׂמִיכָה
  choice: kwa blanketi
  rationale: שׂמיכה ni kitambaa cha kufunikia ambacho kinaweza kuwa blanketi, zulia, au kifuniko kingine; “blanketi” ni neno linaloeleweka kwa urahisi katika Kiswahili cha sasa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa mwaliko umehifadhiwa; “karibu kwangu” limetumiwa badala ya tafsiri ngumu zaidi ya moja kwa moja “geuka uje kwangu.”
