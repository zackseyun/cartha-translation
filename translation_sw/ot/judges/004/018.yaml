review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jael's going out, meeting Sisera, reassurance, entry into the tent, and covering him. However, it renders the repeated Hebrew imperative סוּרָה (“turn aside”) as “Karibu kwangu,” and the response verb וַיָּסַר as simply “akaingia,” losing the deliberate repeated turn-aside imagery preserved in the source and English audit trail.
  naturalness: The revision uses idiomatic Standard East African Swahili. “Geuka” naturally expresses changing course, while “geuka uje kwangu” makes the invitation clear without reducing it to a mere greeting. “Akaingia katika hema” is smoother than “akaingia kwake ndani ya hema.”
  terminology: “Bwana wangu” appropriately conveys the polite deferential address אֲדֹנִי. “Blanketi” is suitable, with a footnote preserving the broader sense of the Hebrew covering term.
  issues:
  - severity: medium
    issue: The repeated invitation סוּרָה is translated “Karibu kwangu.”
    rationale: “Karibu” is a welcome/greeting, whereas the Hebrew specifically calls Sisera to turn aside from his course. A direct rendering should retain this image and repetition.
  - severity: medium
    issue: The footnote anchor is assigned only to the covering term, while no note preserves the lexical alternative for the invitation.
    rationale: The English audit trail identifies both the turn-aside invitation and the covering cloth as relevant lexical alternatives. Anchoring notes at both corresponding Swahili expressions makes the audit trail and text support consistent.
  - severity: low
    issue: “Akaingia kwake ndani ya hema” is redundant and slightly awkward.
    rationale: The Hebrew indicates that he turned aside to her and entered the tent. “Akageuka, akaingia katika hema” represents both movements clearly and naturally.
  revised_text: Yaeli akatoka kumlaki Sisera, akamwambia, “Geuka,[a] bwana wangu, geuka uje kwangu; usiogope.” Basi akageuka, akaingia katika hema, naye akamfunika kwa blanketi.[b]
