base_translation:
  language: en
  yaml_path: translation/ot/judges/004/009.yaml
  text: And she said[a], “I will surely go with you. Nevertheless, the honor will not be yours on the way that you are going, for Yahweh will sell Sisera into the hand of a woman.” Then Deborah arose and went with Barak to Kedesh.
translation:
  language: sw
  text: Naye akasema, “Hakika nitaenda pamoja nawe. Lakini heshima haitakuwa yako katika njia unayoifuata, kwa maana Yahwe atamkabidhi Sisera mikononi mwa mwanamke.[a]” Kisha Debora akainuka, akaenda pamoja na Baraka hadi Kedeshi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kihalisi, “Yahwe atamuuza Sisera kwa mwanamke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלֹךְ אֵלֵךְ
  choice: Hakika nitaenda
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi cha wakati usiotimilika unasisitiza uhakika; “Hakika nitaenda” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: עִמָּךְ
  choice: pamoja nawe
  rationale: Huwasilisha moja kwa moja maana ya kuandamana, kwa lugha ya heshima na ya asili.
- source_word: אֶפֶס
  choice: Lakini
  rationale: Hapa chembe hii inaleta sharti au mipaka kwa makubaliano ya Debora; “Lakini” ni kiunganishi cha kawaida na wazi katika Kiswahili.
- source_word: תִּפְאַרְתְּךָ
  choice: heshima haitakuwa yako
  rationale: Katika muktadha wa ushindi wa kijeshi, neno linahusu heshima au sifa ya ushindi, si uzuri wa nje.
- source_word: עַל הַדֶּרֶךְ אֲשֶׁר אַתָּה הוֹלֵךְ
  choice: katika njia unayoifuata
  rationale: Huhifadhi taswira ya njia huku ikieleweka pia kuwa mwenendo au hatua anayochukua Baraka, bila kuifafanua kupita kiasi.
- source_word: בְיַד אִשָּׁה
  choice: mikononi mwa mwanamke
  rationale: Huhifadhi nahau na taswira ya Kiebrania ya kutiwa chini ya mamlaka ya mtu.
- source_word: יִמְכֹּר
  choice: atamuuza
  rationale: Huhifadhi maana ya msingi ya kitenzi “kuuza”; tanbihi inaonyesha maana ya nahau ya kumtia mtu mikononi mwa mwingine.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa kwa tahajia inayosomeka kiasili katika Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: וַתָּקָם
  choice: akaondoka
  rationale: Katika mfululizo huu wa simulizi, kitenzi kinaashiria kujiandaa na kuanza kwenda; “akaondoka” ni cha asili kuliko tafsiri ya kimofimu “akasimama.”
- source_word: קֶדְשָׁה
  choice: hadi Kedeshi
  rationale: Kiambishi elekezi cha Kiebrania kinaonyesha mwendo kuelekea Kedeshi; jina la mahali limetoholewa kwa mfumo wa sauti wa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Wakala wa Mungu katika kuanguka kwa Sisera
  choice: Yahwe atamuuza Sisera mikononi mwa mwanamke
  alternative: Yahwe atamtia Sisera mikononi mwa mwanamke
  rationale: Tafsiri kuu huhifadhi sitiari kali ya Kiebrania ya “kuuza,” ambayo inaonyesha Yahwe akimkabidhi Sisera chini ya mamlaka ya mwanamke; tanbihi hutoa nahau ya kawaida bila kupunguza wakala wa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa urahisi. Taswira muhimu za Kiebrania—njia, kuuza, na mikono—zimehifadhiwa pale zinapoeleweka; tanbihi inaeleza nahau kuu inayoweza kuwa ngumu.
