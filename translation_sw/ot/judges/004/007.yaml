  to: Nitammleta Sisera, mkuu wa jeshi la Yabini, pamoja na magari yake ya vita na umati wake[b], kwako kwenye Mto Kishoni[a], nami nitamtia mikononi mwako.
  rationale: The revision improves idiomatic Swahili, retains the Hebrew's broad wording for Sisera's accompanying force, and refines the Kishon note to reflect the semantic range of נחל without displacing the familiar geographic form “Mto Kishoni.” Footnote markers remain attached to their respective translated terms.
