review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents the principal Hebrew elements: God draws Sisera, Jabin''s military commander, together with his chariots and multitude, toward Barak at the Kishon watercourse, and gives Sisera into Barak''s power. The rendering of נחל as “Mto” is acceptable as a conventional geographic designation when qualified by a note, but the note should more precisely foreground its wadi/torrent-valley range rather than imply an ordinary permanent river.'
  naturalness: The clause “Nitamvuta ... aje kwako” is understandable, but “Nitammleta ... kwako” is more idiomatic in this context and retains the sense of causing Sisera to come. “Mikononi mwako” is the established natural Swahili idiom for being delivered into someone's power.
  terminology: “Mkuu wa jeshi la Yabini,” “magari yake ya vita,” and “umati wake” are appropriate. “Umati wake” preserves the lexical breadth of הֲמוֹנוֹ; its military contextual sense is properly noted as an alternative.
  issues:
  - severity: low
    issue: The primary wording uses a somewhat awkward causative-motion construction.
    rationale: 'Replacing “Nitamvuta ... aje kwako” with “Nitammleta ... kwako” gives natural Standard East African Swahili while conveying the contextual force of משׁך: causing Sisera to come.'
  - severity: low
    issue: The Kishon footnote's lexical description is imprecise.
    rationale: נחל commonly denotes a wadi, torrent bed/valley, or stream course. The revised note preserves the conventional name “Mto Kishoni” in the text but states the terrain-term alternatives more accurately.
  - severity: low
    issue: “Mkononi mwako” is less idiomatic than the usual Swahili expression.
    rationale: “Mikononi mwako” naturally expresses the Hebrew idiom בידך, ‘into your hand/power,’ without altering its meaning.
