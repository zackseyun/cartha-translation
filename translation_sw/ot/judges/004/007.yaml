base_translation:
  language: en
  yaml_path: translation/ot/judges/004/007.yaml
  text: And I will draw Sisera[a], the commander of Jabin’s army, along with his chariots and his multitude, to you at the Wadi Kishon[b], and I will give him into your hand.
translation:
  language: sw
  text: Nitammleta Sisera, mkuu wa jeshi la Yabini, pamoja na magari yake ya vita na umati wake[b], kwako kwenye Mto Kishoni[a], nami nitamtia mikononi mwako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye bonde la Kishoni,” “kwenye kijito cha Kishoni,” au “kwenye mkondo wa Kishoni.” Neno la Kiebrania linaweza kurejelea wadi, bonde la mkondo wa maji, au kijito/mkondo wa maji.
    reason: lexical_alternative
  - marker: b
    text: Au “vikosi vyake” au “jeshi lake.” Neno la Kiebrania lina maana pana zaidi, yaani “umati wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁכְתִּי
  choice: Nitamvuta
  rationale: Kitenzi hiki huhifadhi taswira ya kumfanya Sisera aelekee mahali palipopangwa bila kuongeza wazo mahususi la kumdanganya.
- source_word: אֵלֶיךָ
  choice: aje kwako
  rationale: Hueleza kwa Kiswahili cha kawaida mwendo unaoelekezwa kwa Baraki; neno “aje” linafanya muundo wa sentensi uwe wa asili bila kubadili maana.
- source_word: אֶל נַחַל קִישׁוֹן
  choice: kwenye Mto Kishoni[a]
  rationale: “Mto Kishoni” ni usemi unaoeleweka kwa urahisi, huku tanbihi ikihifadhi upana wa נחל, ambalo linaweza kumaanisha mto, kijito, bonde la mto, au mkondo wa maji wa msimu.
- source_word: סִיסְרָא
  choice: Sisera
  rationale: Hili ni umbo la kawaida la jina hili katika Kiswahili.
- source_word: שַׂר צְבָא יָבִין
  choice: mkuu wa jeshi la Yabini
  rationale: Hueleza wazi cheo cha kijeshi cha Sisera kwa lugha ya sasa na yenye hadhi.
- source_word: רִכְבּוֹ
  choice: magari yake ya vita
  rationale: Katika muktadha huu neno linarejelea magari ya kukokotwa yaliyotumiwa vitani; usemi huu ni wazi kuliko “magari” peke yake.
- source_word: הֲמוֹנוֹ
  choice: umati wake[b]
  rationale: “Umati” huhifadhi maana pana ya kundi kubwa au wingi bila kulifanya moja kwa moja kuwa istilahi ya kitaalamu ya kijeshi.
- source_word: וּנְתַתִּיהוּ בְּיָדֶךָ
  choice: nami nitamtia mkononi mwako
  rationale: Huhifadhi nahau na taswira ya Kiebrania ya kumkabidhi mtu chini ya mamlaka ya mwingine, huku ikiwa ya kueleweka katika Kiswahili.
