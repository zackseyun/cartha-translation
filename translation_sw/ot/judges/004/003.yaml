  yaml_path: translation/ot/judges/004/003.yaml
  text: Then the sons of Israel cried out to the LORD, because he had nine hundred iron chariots, and he oppressed the sons of Israel harshly for twenty years.
translation:
  language: sw
  text: Ndipo wana wa Israeli wakamlilia BWANA, kwa sababu Sisera alikuwa na magari ya chuma mia tisa, naye aliwakandamiza wana wa Israeli kwa nguvu kwa muda wa miaka ishirini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעֲקוּ ... אֶל־יְהוָה
  choice: wakamlilia BWANA
  rationale: Kitenzi צעק pamoja na אֶל huonyesha kilio cha kuomba msaada; “wakamlilia” ni Kiswahili cha kawaida na chenye uzito. Jina la agano יהוה limewakilishwa kwa desturi ya “BWANA.”
- source_word: תְּשַׁע מֵאוֹת רֶכֶב בַּרְזֶל
  choice: magari ya vita mia tisa yenye chuma
  rationale: רֶכֶב hapa ni magari ya kivita. Muundo “yenye chuma” unahifadhi usemi wa Kiebrania bila kudai kwa uhakika kwamba magari hayo yalitengenezwa yote kwa chuma au yalifunikwa kwa chuma.
- source_word: לָחַץ ... בְּחָזְקָה
  choice: alikuwa amewakandamiza ... kwa ukali
  rationale: לָחַץ humaanisha kukandamiza au kuonea, na בְּחָזְקָה huongeza wazo la nguvu na ukali. Tafsiri hii ni ya asili katika Kiswahili na inaonyesha mateso makali ya muda mrefu.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hii inafuata taswira ya ukoo wa taifa katika Kiebrania huku ikiwa lugha ya kibiblia inayoeleweka katika Kiswahili.
theological_decisions:
- issue: Utambulisho wa kiwakilishi לֹו (“alikuwa na”)
  choice: Kutaja “Sisera” kwa uwazi
  alternative: “alikuwa na magari ya vita...” bila kutaja jina
  rationale: Kiwakilishi cha Kiebrania humrejelea Sisera katika mstari uliotangulia. Kutaja jina kunazuia utata usio wa kimakusudi katika Kiswahili, kana kwamba BWANA ndiye mwenye magari hayo, bila kubadili maana ya chanzo.
- issue: Uwakilishi wa jina יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” kwa herufi kubwa ni desturi pana ya tafsiri za Kiswahili kwa Tetragramatoni na inalingana na safu ya mashauriano ya POB, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mtiririko wa simulizi, sababu ya kilio, ukubwa wa nguvu za kijeshi, ukali wa ukandamizaji, na kipindi cha miaka ishirini.
