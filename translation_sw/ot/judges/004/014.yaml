  text: וַ/תֹּאמֶר֩ דְּבֹרָ֨ה אֶל בָּרָ֜ק ק֗וּם כִּ֣י זֶ֤ה הַ/יּוֹם֙ אֲשֶׁר֩ נָתַ֨ן יְהוָ֤ה אֶת סִֽיסְרָא֙ בְּ/יָדֶ֔/ךָ הֲ/לֹ֥א יְהוָ֖ה יָצָ֣א לְ/פָנֶ֑י/ךָ וַ/יֵּ֤רֶד בָּרָק֙ מֵ/הַ֣ר תָּב֔וֹר וַ/עֲשֶׂ֧רֶת אֲלָפִ֛ים אִ֖ישׁ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/014.yaml
  text: Then Deborah said to Barak[a], “Arise, for this is the day on which Yahweh has given Sisera into your hand. Has not Yahweh gone out before you?” So Barak went down from Mount Tabor[b], with ten thousand men following him.
translation:
  language: sw
  text: Ndipo Debora akamwambia Baraka, “Inuka, kwa maana hii ndiyo siku ambayo Yahwe amemtia Sisera mkononi mwako.[a] Je, Yahwe hajakutangulia?[b]” Basi Baraka akashuka kutoka Mlima Tabori, akiwa na wanaume elfu kumi wakimfuata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amemkabidhi Sisera kwako.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania, kwa karibu: “Je, Yahwe hajatoka kwenda mbele yako?”'
    reason: literal_rendering
lexical_decisions:
- source_word: קוּם
  choice: Inuka
  rationale: Amri hii inamtaka Baraka achukue hatua mara moja; “Inuka” ni ya kawaida, yenye nguvu, na yenye hadhi katika Kiswahili.
- source_word: כִּי זֶה הַיּוֹם אֲשֶׁר
  choice: kwa maana hii ndiyo siku ambayo
  rationale: Inahifadhi msisitizo wa demonstrativi “hii ndiyo siku” na kutoa sababu ya himizo la Debora kwa Kiswahili cha kawaida.
- source_word: נָתַן ... בְּיָדֶךָ
  choice: amemtia ... mkononi mwako
  rationale: Inahifadhi sitiari ya Kiebrania ya kumweka mtu chini ya mamlaka ya mwingine, huku ikieleweka kwa urahisi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa jina binafsi la Mungu lililoandikwa moja kwa moja katika maandishi ya Kiebrania.
- source_word: הֲלֹא
  choice: Je, ... haja-?
  rationale: Muundo huu unahifadhi swali la balagha linalotarajia jibu la kukubali.
- source_word: יָצָא לְפָנֶיךָ
  choice: hajakutangulia
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya Yahwe kwenda mbele ya Baraka; taswira halisi zaidi ya “kutoka mbele” imeonyeshwa katika tanbihi.
- source_word: וַיֵּרֶד
  choice: akashuka
  rationale: Ni kitenzi cha kawaida cha masimulizi kinachoonyesha mwendo wa kutoka mlimani kwenda chini.
- source_word: מֵהַר תָּבוֹר
  choice: kutoka Mlima Tabori
  rationale: Inatambua הַר kuwa mlima na kutumia umbo la jina la mahali linalofaa katika Kiswahili.
- source_word: וַעֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: akiwa na wanaume elfu kumi
  rationale: “Wanaume” inalingana na אִישׁ katika muktadha wa jeshi, na muundo huu unaonyesha kuwa waliandamana naye.
- source_word: אַחֲרָיו
  choice: wakimfuata
  rationale: Ni Kiswahili cha kawaida kinachoonyesha wanaume hao wakisonga nyuma ya Baraka.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, si cheo; “Yahwe” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Ukamilifu wa ushindi uliotangazwa kwa נָתַן
  choice: amemtia Sisera mkononi mwako
  alternative: atamtia Sisera mkononi mwako
  rationale: Wakati timilifu wa Kiebrania unahifadhiwa ili kuonyesha ushindi kama jambo lililokwisha kuamuliwa, bila kuubadilisha kuwa ahadi ya wakati ujao pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa masimulizi ni wa sasa, wenye hadhi, na unaoeleweka kwa wasomaji wa kawaida. Sitiari ya “mkononi mwako” imehifadhiwa, huku usemi mgumu zaidi wa Kiebrania kuhusu Yahwe kwenda mbele ukitolewa kwa Kiswahili asilia na kufafanuliwa katika tanbihi.
