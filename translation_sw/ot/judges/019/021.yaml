  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. Mpangilio wa alama za tanbihi umewekwa kulingana na jambo linalofafanuliwa: [a] baada ya chakula cha punda na [b] baada ya kuosha miguu.'
