  text: So he brought him into his house and fed the donkeys[b][a]. Then they washed their feet and ate and drank.
translation:
  language: sw
  text: Basi akamleta ndani ya nyumba yake, akawachanganyia punda chakula.[a] Kisha wakaosha miguu yao,[b] wakala na kunywa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa neno kwa neno zaidi, “akachanganya chakula kwa ajili ya punda.”
    reason: lexical_alternative
  - marker: b
    text: Kuosha miguu kulikuwa desturi ya ukarimu katika Mashariki ya Karibu ya kale.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִיאֵהוּ לְבֵיתוֹ
  choice: akamkaribisha nyumbani mwake
  rationale: Kitenzi cha Kiebrania katika Hifili kina maana ya kumwingiza au kumleta mtu ndani. Katika muktadha huu wa ukarimu, “akamkaribisha nyumbani mwake” ni Kiswahili cha asili kinachoonyesha kuingizwa kwake ndani ya nyumba bila kubadili tendo la mwenyeji.
- source_word: וַיָּבָול
  choice: akawatengenezea ... chakula kilichochanganywa
  rationale: Mzizi בלל humaanisha kuchanganya; hapa unaeleza kutayarisha chakula cha mifugo kwa kukichanganya. Tafsiri hii huhifadhi maana mahsusi kuliko kusema tu “akawalisha.”
- source_word: לַחֲמוֹרִים
  choice: punda
  rationale: חֲמוֹרִים ni wingi wa “punda”; Kiswahili hutumia umbo lilelile “punda” katika umoja na wingi, huku upatanisho wa “akawatengenezea” ukionyesha wingi.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: wakaosha miguu yao
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la wageni kuosha miguu katika muktadha wa ukarimu.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: wakala na kunywa
  rationale: Huhifadhi usimulizi mfupi wa vitendo vinavyofuatana katika Kiebrania na ni lugha ya kawaida ya Kiswahili.
