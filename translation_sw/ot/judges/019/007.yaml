base_translation:
  language: en
  yaml_path: translation/ot/judges/019/007.yaml
  text: Then the man got up to go[a], but his father-in-law urged him, so he turned back and spent the night there.
translation:
  language: sw
  text: Ndipo yule mtu akainuka ili aende, lakini baba mkwe wake akamsihi sana[a]. Basi akarudi na kulala huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamshinikiza sana”; kitenzi cha Kiebrania kinaonyesha kusihi au kushinikiza kwa nguvu na kwa kuendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Kitenzi קום katika mfululizo wa masimulizi kinaonyesha kuinuka ili kutenda jambo; “akainuka” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: הָאִישׁ
  choice: yule mtu
  rationale: אִישׁ humtaja mhusika kama “mtu/mwanamume”; “yule mtu” ni ya asili katika masimulizi ya Kiswahili bila kuongeza utambulisho wa “Mlawi” ambao haujatajwa hapa.
- source_word: לָלֶכֶת
  choice: ili aende
  rationale: Kitenzi-jina cha הלך baada ya קום kinaeleza kusudi la kuinuka. “Ili aende” kinahifadhi maana hiyo bila kuongeza kwa wazi kwamba tayari alikuwa ameondoka.
- source_word: וַיִּפְצַר בּוֹ
  choice: akamsihi sana
  rationale: פצר ב־ huonyesha kusihi au kushinikiza kwa nguvu na kwa kuendelea. “Akamsihi sana” ni Kiswahili cha kawaida kinachoonyesha uzito wa ombi bila kudokeza kwamba alilazimishwa.
- source_word: חֹתְנוֹ
  choice: baba mkwe wake
  rationale: Katika muktadha huu חֹתְנוֹ ni baba ya mwanamke kwa uhusiano wake na huyo mtu; “baba mkwe wake” ndiyo kauli ya kawaida na sahihi.
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: שׁוב humaanisha kurudi au kugeuka na kurudi. “Akarudi” huhifadhi kitenzi cha chanzo bila kufafanua kimyakimya kama alikuwa tayari ametoka au alibadili nia tu.
- source_word: וַיָּלֶן שָׁם
  choice: na kulala huko
  rationale: לון humaanisha kukaa au kulala mahali usiku. “Kulala huko” ni usemi wa kawaida unaowasilisha wazi kukaa kwake usiku huo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. Tafsiri inaepuka “akamshurutisha,” ambalo lingeweza kudokeza kulazimisha kupita nguvu ya neno la Kiebrania, na inaacha wazi kiwango halisi cha shinikizo kupitia tanbihi.
