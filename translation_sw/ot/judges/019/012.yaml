base_translation:
  language: en
  yaml_path: translation/ot/judges/019/012.yaml
  text: But his master said to him[a], “We will not turn aside into a foreign city, which is not of the sons of Israel; rather, we will go on as far as Gibeah.”
translation:
  language: sw
  text: Lakini bwana wake akamwambia, “Hatutageukia mji wa kigeni, ambao si wa wana wa Israeli[a]; badala yake, tutaendelea mpaka Gibea.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Israeli.” “Waisraeli” ni tafsiri nyingine iliyo laini zaidi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָיו
  choice: bwana wake
  rationale: Katika muktadha huu neno hilo linamtaja mkuu wa kijamii wa mtumishi, wala si cheo cha Mungu. “Bwana wake” ni usemi wa kawaida wa Kiswahili unaoonyesha uhusiano huo wa mamlaka.
- source_word: נָסוּר
  choice: hatutageukia
  rationale: Kitenzi סור hapa kina maana ya kuacha njia ili kuingia au kulala mjini; “hatutageukia” kinadumisha wazo la kugeuka kutoka njia bila kuwa kizito.
- source_word: עִיר נָכְרִי
  choice: mji wa wageni
  rationale: נָכְרִי huonyesha kilicho cha watu wa nje au kisicho cha jamii ya Israeli. “Mji wa wageni” ni wazi na cha asili katika muktadha huu kuliko “mji wa kigeni,” ambao unaweza kueleweka kuwa uko katika nchi nyingine.
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵנָּה
  choice: ambao si wa wana wa Israeli
  rationale: Kishazi hicho kinabainisha kuwa mji huo si wa jamii ya Israeli. Kiswahili hiki kinafuata muundo wa chanzo kwa ukaribu huku kikihifadhi jina la kikabila “wana wa Israeli.”
- source_word: וְעָבַרְנוּ
  choice: tutaendelea
  rationale: עבר hapa humaanisha kupita chaguo la sasa na kuendelea na safari. “Tutaendelea” ni wazi na cha kawaida katika Kiswahili.
- source_word: עַד גִּבְעָה
  choice: mpaka Gibea
  rationale: עַד huonyesha kikomo cha mwendo; “mpaka Gibea” huwasilisha kwa usahihi kuendelea hadi mahali hapo.
