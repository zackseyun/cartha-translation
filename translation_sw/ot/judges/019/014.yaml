  yaml_path: translation/ot/judges/019/014.yaml
  text: So they passed on and went their way[a], and the sun set on them near Gibeah, which belongs to Benjamin.
translation:
  language: sw
  text: Basi wakapita, wakaendelea na safari, na jua likawachwea karibu na Gibea, ambayo ni ya Benyamini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambayo iko katika eneo la Benyamini.” Kirai cha Kiebrania kinahusianisha Gibea na kabila au eneo la Benyamini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: wakapita
  rationale: Kitenzi עבר katika mfululizo wa simulizi kinaonyesha kwamba waliendelea kupita mahali walipokuwa wamefikiria kukaa, badala ya kueleza tu mwendo wa kawaida.
- source_word: וַיֵּלֵכוּ
  choice: wakaendelea na safari
  rationale: Kitenzi הלך ni ‘kwenda/kutembea.’ Tafsiri hii inadumisha kitenzi cha pili cha mwendo bila kukifanya kirudie tu ‘wakapita,’ na ni Kiswahili cha kawaida katika muktadha wa safari.
- source_word: וַתָּבֹא לָהֶם הַשֶּׁמֶשׁ
  choice: jua likawachwea
  rationale: Kirai hiki, kihalisi ‘jua likawajia,’ ni nahau ya kuchwa kwa jua huku wasafiri wakiwa njiani. ‘Jua likawachwea’ ni usemi wa asili unaodumisha wazo la kufikiwa na machweo.
- source_word: אֵצֶל
  choice: karibu na
  rationale: Kihusishi hiki huonyesha ukaribu; ‘karibu na’ kinaeleweka wazi katika muktadha wa mahali walipofikiwa na machweo.
- source_word: הַגִּבְעָה
  choice: Gibea
  rationale: Ingawa neno hili pia linaweza kumaanisha ‘kilima,’ hapa ni jina la mahali, kama inavyoonyeshwa na maelezo yanayolihusianisha na Benyamini.
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: uliokuwa wa Benyamini
  rationale: Kirai kinaonyesha uhusiano wa Gibea na kabila au eneo la Benyamini. Tafsiri hii inadumisha uhusiano huo bila kufafanua kupita kiasi aina yake.
- source_word: בִנְיָמִן
  choice: Benyamini
  rationale: Ni jina la mtu na kabila, limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
