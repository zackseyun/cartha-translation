base_translation:
  language: en
  yaml_path: translation/ot/judges/019/023.yaml
  text: Then the man[a], the master of the house, went out to them and said to them, “No, my brothers, please do not act wickedly. Since this man has come into my house, do not do this disgraceful thing.”
translation:
  language: sw
  text: Ndipo yule mtu, mwenye nyumba, akatoka akawaendea na kuwaambia, “Hapana, ndugu zangu, tafadhali msitende uovu. Kwa kuwa mtu huyu ameingia nyumbani mwangu, msifanye jambo hili la aibu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jambo hili ovu” au “tendo hili la kuchukiza.” Neno la Kiebrania humaanisha tendo la aibu na la kuchukiza sana kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעַל הַבַּיִת
  choice: mwenye nyumba
  rationale: Kirai hiki humtaja mtu mwenye mamlaka na wajibu juu ya nyumba. “Mwenye nyumba” ni usemi wa kawaida wa Kiswahili unaoweza kumaanisha mwenye nyumba au mkuu wa kaya bila kuongeza ufafanuzi usio katika maandishi.
- source_word: אַחַי
  choice: ndugu zangu
  rationale: Hii ndiyo maana ya moja kwa moja ya neno la Kiebrania katika wingi wa kiume; hapa ni namna ya kuwahutubia wanaume wenzake wa mjini.
- source_word: תָּרֵעוּ
  choice: msitende uovu
  rationale: Kitenzi hiki kinaonyesha tendo baya kimaadili. “Msitende uovu” huhifadhi uzito wa katazo na ni Kiswahili cha kawaida, chenye hadhi.
- source_word: נָא
  choice: tafadhali
  rationale: Neno hili huongeza ombi la kusihi na uharaka; “tafadhali” linawasilisha jambo hilo kwa kawaida.
- source_word: אַחֲרֵי אֲשֶׁר בָּא ... אֶל/בֵּיתִי
  choice: Kwa kuwa mtu huyu ameingia nyumbani mwangu
  rationale: 'Katika muktadha huu muundo huo unaonyesha hali inayofanya kosa lililokusudiwa kuwa zito zaidi: mtu huyo ameingia chini ya ulinzi wa mwenyeji. “Kwa kuwa” huwasilisha vizuri uhusiano huo wa kimuktadha, na “ameingia nyumbani mwangu” ni usemi wa asili wa Kiswahili.'
- source_word: הַנְּבָלָה הַזֹּאת
  choice: jambo hili la aibu
  rationale: Neno נְבָלָה humaanisha tendo la fedheha na la kuchukiza kimaadili. “Jambo hili la aibu” linaeleweka kwa urahisi na halipunguzi uzito wa tendo.
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: akawatokea
  rationale: Hii huonyesha kwamba alitoka ndani na kwenda mahali walipokuwa. “Akawatokea” ni simulizi la Kiswahili lenye mtiririko wa kawaida.
