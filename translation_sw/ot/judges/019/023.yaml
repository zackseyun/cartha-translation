  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi ombi la kusihi, ukali wa katazo la kimaadili, na lugha ya undugu ya msemaji. Alama ya tanbihi imewekwa baada ya kirai inachokifafanua, yaani “jambo hili la aibu.”
