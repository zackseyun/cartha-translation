id: JDG.19.1
reference: Judges 19:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם וּ/מֶ֖לֶךְ אֵ֣ין בְּ/יִשְׂרָאֵ֑ל וַ/יְהִ֣י אִ֣ישׁ לֵוִ֗י גָּ֚ר בְּ/יַרְכְּתֵ֣י הַר אֶפְרַ֔יִם וַ/יִּֽקַּֽח ל/וֹ֙ אִשָּׁ֣ה פִילֶ֔גֶשׁ מִ/בֵּ֥ית לֶ֖חֶם יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/001.yaml
  text: And it happened in those days[a], when there was no king in Israel, that a Levite man was dwelling in the remote parts of the hill country of Ephraim, and he took for himself a woman, a concubine[b], from Bethlehem in Judah.
translation:
  language: sw
  text: Ikawa katika siku hizo[a], wakati ambapo hakukuwa na mfalme katika Israeli, kulikuwa na mtu Mlawi aliyekuwa akiishi katika sehemu za mbali za nchi ya vilima ya Efraimu. Akajitwalia mwanamke, suria[b], kutoka Bethlehemu katika Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikawa katika siku hizo, na hapakuwa na mfalme katika Israeli.” Kiebrania kina kishazi kilichounganishwa ambacho kinaweza kutafsiriwa kama taarifa tofauti au kama mazingira ya wakati.
    reason: alternative_reading
  - marker: b
    text: “Suria” hapa ni mwanamke aliyekuwa katika muungano uliotambuliwa lakini mwenye hadhi ya kijamii iliyo chini ya mke; si mwenzi wa muda tu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Kauli ya kawaida ya Kiebrania ya kuanzisha tukio jipya katika simulizi; “Ikawa” huhifadhi mtindo huo kwa Kiswahili cha kibiblia kinachoeleweka bila kuwa kirefu.
- source_word: בַּיָּמִים הָהֵם
  choice: katika siku hizo
  rationale: Ni usemi wa wakati unaorudiwa katika Waamuzi na unahifadhi mwangwi wa kifasihi wa simulizi.
- source_word: וּמֶלֶךְ אֵין בְּיִשְׂרָאֵל
  choice: wakati ambapo hapakuwa na mfalme katika Israeli
  rationale: Kisarufi ni kishazi kilichounganishwa, lakini kinaweza kutoa mazingira ya wakati. Tafsiri hii ni ya asili katika Kiswahili huku tanbihi ikihifadhi uwezekano wa kukisoma kama taarifa tofauti.
- source_word: אִישׁ לֵוִי
  choice: mtu Mlawi
  rationale: Huhifadhi nomino zote mbili, “mtu” na “Mlawi,” kama zilivyo katika Kiebrania.
- source_word: גָּר
  choice: aliyekuwa akiishi
  rationale: Kitenzi kinaweza kudokeza kukaa kama mgeni au mkazi asiye wa kudumu; “akiishi” ni cha kawaida na hakilazimishi kiwango cha muda ambacho muktadha haujaweka wazi.
- source_word: בְּיַרְכְּתֵי
  choice: katika sehemu za mbali za
  rationale: Huonyesha kingo, sehemu za ndani au za pembezoni zilizo mbali; kauli hii inaeleza umbali wa kijiografia kwa uwazi.
- source_word: הַר אֶפְרַיִם
  choice: nchi ya vilima ya Efraimu
  rationale: Hurejelea eneo la vilima, si mlima mmoja. “Nchi ya vilima” ni usemi wazi wa kijiografia katika Kiswahili.
- source_word: וַיִּקַּח לוֹ
  choice: Akajitwalia
  rationale: Muundo wa kitenzi pamoja na kiwakilishi cha kujirejelea una maana ya kumchukua mwanamke kwa ajili yake mwenyewe. “Akajitwalia” huhifadhi maana hiyo kwa ufupi.
- source_word: אִשָּׁה פִילֶגֶשׁ
  choice: mwanamke, suria
  rationale: 'Huhifadhi vipashio vyote viwili vya Kiebrania: alikuwa mwanamke mwenye hadhi maalumu ya suria, badala ya kufupisha kuwa “suria” pekee.'
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: kutoka Bethlehemu katika Yuda
  rationale: Hutambulisha Bethlehemu hii kwa eneo lake la Yuda na kuitofautisha na mahali pengine penye jina hilo.
theological_decisions:
- issue: Kauli inayorudiwa katika Waamuzi kuhusu kutokuwapo kwa mfalme
  choice: wakati ambapo hapakuwa na mfalme katika Israeli
  alternative: na hapakuwa na mfalme katika Israeli
  rationale: Chaguo kuu linaifanya kauli hiyo kuwa mazingira ya wakati kwa mtiririko wa kawaida wa Kiswahili, bila kuifanya kuwa sifa au lawama ya utawala wa kifalme. Tanbihi inahifadhi uratibu wa wazi wa Kiebrania na mvutano wa kifasiri.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida wa leo. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili: Israeli, Efraimu, Bethlehemu, na Yuda.'
