  text: He looked up and saw the traveler in the open square of the city[a], and the old man said, “Where are you going[b], and where do you come from?”
translation:
  language: sw
  text: Akainua macho yake, akamwona yule msafiri[a] katika uwanja[b] wa mji. Yule mzee akasema, “Unakwenda wapi, na umetoka wapi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mpita njia” au “mgeni.” Neno la Kiebrania humaanisha mtu aliye safarini na, katika muktadha wa ukarimu, linaweza pia kumaanisha mgeni.
    reason: lexical_alternative
  - marker: b
    text: Au “katika barabara pana ya mji.” Neno la Kiebrania humaanisha hasa eneo pana la wazi la umma au uwanja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Akainua macho
  rationale: Hii inahifadhi nahau ya Kiebrania kwa Kiswahili cha kawaida na inaonyesha kwamba alielekeza macho yake juu au mbele ili kutazama.
- source_word: וַיַּרְא
  choice: akamwona
  rationale: Kitenzi hiki kinaeleza kuona moja kwa moja; kiambishi cha mtendwa kinarejelea msafiri.
- source_word: הָאִישׁ הָאֹרֵחַ
  choice: yule msafiri
  rationale: אֹרֵחַ hapa humtambulisha mtu aliyekuwa safarini. “Msafiri” ni neno la sasa na la kawaida kuliko “mpita njia,” huku “mgeni” lingeweza kusisitiza hali ya kupokewa kuliko safari yake.
- source_word: בִּרְחֹב הָעִיר
  choice: katika uwanja wa mji
  rationale: רְחוֹב kwa kawaida ni eneo pana la wazi la umma, si lazima barabara nyembamba. “Uwanja wa mji” ni usemi wa asili unaowasilisha mahali hapo.
- source_word: הָאִישׁ הַזָּקֵן
  choice: Yule mzee
  rationale: Huu ni utambulisho wa moja kwa moja wa msemaji kama mwanamume mzee; “yule mzee” ni wa asili katika simulizi la Kiswahili.
- source_word: אָנָה תֵלֵךְ
  choice: Unakwenda wapi
  rationale: Swali linauliza mahali anakoelekea. Wakati wa sasa unaoendelea unafaa mazungumzo haya ya papo hapo.
- source_word: וּמֵאַיִן תָּבוֹא
  choice: na umetoka wapi
  rationale: Ingawa kitenzi cha Kiebrania kimsingi ni “kuja,” katika swali hili muundo mzima unauliza mahali safari ilikoanzia. “Umetoka wapi?” ni Kiswahili cha kawaida na sahihi kwa muktadha huu.
