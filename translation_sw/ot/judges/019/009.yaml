base_translation:
  language: en
  yaml_path: translation/ot/judges/019/009.yaml
  text: When the man rose to leave with his concubine and his attendant, his father-in-law, the young woman’s father, said to him, “Look, the day is waning toward evening. Please stay the night. Look, the day is nearly over[a]. Spend the night here and let your heart be glad. Then rise early tomorrow for your journey[b], and go home[c].”
translation:
  language: sw
  text: Mtu huyo alipoinuka ili aondoke pamoja na suria wake na mtumishi wake, mkwe wake, yaani baba ya yule mwanamke, akamwambia, “Tazama, siku inafifia kuelekea jioni. Tafadhali, laleni hapa usiku. Tazama, siku inakaribia kuisha[a]. Lala hapa usiku, na moyo wako ufurahi. Kesho mtaamka mapema kwa safari yenu[b], nawe urudi nyumbani[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “siku inapiga kambi,” taswira ya siku kutulia au kufikia mwisho wake.
    reason: source_image
  - marker: b
    text: “Mtaamka” na “safari yenu” ni vya wingi, vikielekezwa kwa kundi la wasafiri; lakini “urudi” katika sehemu inayofuata ni la umoja, likielekezwa kwa huyo mtu.
    reason: grammar
  - marker: c
    text: Kwa neno halisi, “uende kwenye hema lako,” usemi ambao hapa una maana ya kurudi nyumbani.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: mtu huyo
  rationale: Neno אִישׁ hapa ni ‘mtu/mwanaume’; ‘mtu huyo’ linadumisha mtindo wa simulizi bila kuongeza wazi cheo cha ‘mume’ ambacho hakimo katika kifungu hiki.
- source_word: פִילַגְשׁוֹ
  choice: suria wake
  rationale: ‘Suria’ ni istilahi ya kawaida ya Kiswahili kwa mwanamke mwenye hadhi ya mke wa daraja la pili; haifichi aina ya uhusiano wa kijamii unaotajwa.
- source_word: נַעֲרוֹ
  choice: mtumishi wake
  rationale: Katika muktadha huu נַעַר ni kijana anayehudumu na kusafiri pamoja naye; kazi yake ndiyo muhimu kuliko umri wake.
- source_word: חֹתְנוֹ אֲבִי הַנַּעֲרָה
  choice: mkwe wake, yaani baba ya yule mwanamke
  rationale: ‘Mkwe’ peke yake huweza kuwa na maana pana katika Kiswahili; ufafanuzi unaofuata unatambulisha wazi kuwa ni baba ya mwanamke huyo.
- source_word: רָפָה הַיּוֹם לַעֲרֹב
  choice: siku inafifia kuelekea jioni
  rationale: ‘Inafifia’ linaendeleza taswira ya nguvu au mwanga wa mchana kupungua kadiri jioni inavyokaribia.
- source_word: לִינוּ נָא
  choice: Tafadhali, laleni hapa usiku
  rationale: Kitenzi cha Kiebrania ni cha wingi na kinawaalika wasafiri wote walale hapo usiku.
- source_word: חֲנוֹת הַיּוֹם
  choice: siku karibu imekwisha
  rationale: Hili linawasilisha maana ya wakati kwa Kiswahili cha kawaida; taswira isiyo ya kawaida ya siku ‘kupiga kambi’ imehifadhiwa katika tanbihi.
- source_word: וְיִיטַב לְבָבֶךָ
  choice: moyo wako ufurahi
  rationale: Huhifadhi taswira ya moyo na maana ya kupata furaha au uchangamfu.
- source_word: וְהִשְׁכַּמְתֶּם מָחָר
  choice: Kesho mtaamka mapema
  rationale: Umbo la wingi linawaelekea watu wa kundi la wasafiri, na Kiswahili linaonyesha wingi huo wazi.
- source_word: וְהָלַכְתָּ לְאֹהָלֶךָ
  choice: nawe urudi nyumbani
  rationale: Kwa muktadha huu ‘kwenda kwenye hema lako’ ni usemi wa kwenda nyumbani; tafsiri kuu huepuka kudokeza kimakosa kwamba walikokuwa wakielekea lazima kulikuwa hema halisi.
