translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia ‘baba ya yule mwanamke’ badala ya ‘baba wa’ kwa kuwa uhusiano unaoelezwa ni wa baba na mwanamke huyo; ‘yaani’ hufanya ufafanuzi wa mkwe uwe wa kawaida. Mabadiliko ya wingi kwenda umoja katika amri yamehifadhiwa: ‘laleni’ kwa kundi, kisha ‘lala/moyo wako’ kwa huyo mtu.'
