base_translation:
  language: en
  yaml_path: translation/ot/judges/019/030.yaml
  text: And everyone who saw it said[a], “Nothing like this has happened or been seen from the day the sons of Israel came up from the land of Egypt until this day. Consider it, take counsel, and speak.”
translation:
  language: sw
  text: Na kila mtu aliyeona alisema, “Jambo kama hili halijapata kutokea wala kuonekana tangu siku ambayo wana wa Israeli walipopanda kutoka nchi ya Misri mpaka leo hii. Lifikirieni jambo hili, shaurianeni, na semeni.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כָל הָרֹאֶה וְאָמַר
  choice: Na kila mtu aliyeona alisema
  rationale: Muundo huu unawasilisha hali na mwitikio uliotokea bila kutumia tafsiri ngumu kama ‘ikawa’; wakati uliopita ni wa kawaida katika simulizi la Kiswahili.
- source_word: לֹא נִהְיְתָה וְלֹא נִרְאֲתָה כָּזֹאת
  choice: Jambo kama hili halijapata kutokea wala kuonekana
  rationale: Tafsiri hii inadumisha vitenzi viwili vya Kiebrania na msisitizo kwamba tukio hilo halikuwa na mfano.
- source_word: לְמִיּוֹם עֲלוֹת בְּנֵי יִשְׂרָאֵל מֵאֶרֶץ מִצְרַיִם
  choice: tangu siku wana wa Israeli walipopanda kutoka nchi ya Misri
  rationale: ‘Wana wa Israeli’ ni usemi unaoeleweka na ulio karibu na muundo wa Kiebrania; ‘walipopanda kutoka’ huhifadhi taswira ya kitenzi עלה katika kauli ya kutoka Misri.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo hii
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi kikomo cha wakati hadi siku ya msimulizi.
- source_word: שִׂימוּ לָכֶם עָלֶיהָ
  choice: Lifikirieni jambo hili
  rationale: Nahau hiyo inatoa wito wa kulitia jambo akilini na kulizingatia; kirai hiki ni cha asili katika Kiswahili na kinaweka rejeo wazi.
- source_word: עֻצוּ
  choice: shaurianeni
  rationale: Amri hii inaashiria kushauriana kwa pamoja, si kufikiri kwa mtu mmoja tu.
- source_word: וְדַבֵּרוּ
  choice: kisha semeni
  rationale: Inahifadhi amri fupi yenye mtendwa asiyeelezwa; ‘kisha’ huonyesha mfuatano wa kutafakari, kushauriana, na kusema.
theological_decisions:
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Usemi ‘wana wa Israeli’ huhifadhi kwa karibu muundo wa jina la ukoo wa Kiebrania huku ukiendelea kueleweka katika Kiswahili. Katika muktadha huu ni jina la jamii nzima, si dai kwamba wanaume pekee ndio waliotoka Misri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi uzito wa mwitikio wa pamoja na mfululizo mfupi wa amri katika Kiebrania bila kutumia lugha ya kizamani.
