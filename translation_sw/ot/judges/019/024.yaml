reference: Judges 19:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הִנֵּה֩ בִתִּ֨/י הַ/בְּתוּלָ֜ה וּ/פִֽילַגְשֵׁ֗/הוּ אוֹצִֽיאָה נָּ֤א אוֹתָ/ם֙ וְ/עַנּ֣וּ אוֹתָ֔/ם וַ/עֲשׂ֣וּ לָ/הֶ֔ם הַ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם וְ/לָ/אִ֤ישׁ הַ/זֶּה֙ לֹ֣א תַעֲשׂ֔וּ דְּבַ֖ר הַ/נְּבָלָ֥ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/024.yaml
  text: Look[a], here are my virgin daughter and his concubine. Please let me bring them out. Violate them and do to them what is good in your eyes[c][b]. But to this man do not do this outrageous thing.
translation:
  language: sw
  text: 'Tazama, hawa hapa: binti yangu ambaye ni bikira na suria wake. Hebu niwatoe nje. Wadhalilisheni kingono[a], na watendeeni lililo jema machoni penu[b]. Lakini msimtendee mwanamume huyu jambo hili la aibu[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wabakeni.” Kitenzi cha Kiebrania katika muktadha huu kinaweza kumaanisha kuwadhalilisha kingono.
    reason: lexical_alternative
  - marker: b
    text: “Lililo jema machoni penu” ni nahau ya Kiebrania yenye maana ya jambo mnaloliona kuwa jema au linalowapendeza.
    reason: cultural_note
  - marker: c
    text: Au, “jambo hili ovu” au “kitendo hiki cha aibu kubwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama, hawa hapa
  rationale: Neno hili linavuta uangalifu kwa haraka na kuwatambulisha wanawake hao wawili; usemi huu ni wa kawaida na wenye nguvu katika Kiswahili cha sasa.
- source_word: בִתִּי הַבְּתוּלָה
  choice: binti yangu ambaye ni bikira
  rationale: Huhifadhi wazi dai la maandishi kwamba binti huyo hajawahi kufanya ngono, badala ya kulibadili kuwa taarifa ya hali ya ndoa pekee.
- source_word: וּפִילַגְשֵׁהוּ
  choice: na suria wake
  rationale: ‘Suria’ ni istilahi fupi ya Kiswahili kwa mwanamke mwenye hadhi ya mke wa daraja la pili, na inaendana na mazingira ya kihistoria.
- source_word: אוֹצִיאָה נָּא
  choice: Hebu niwatoe nje
  rationale: ‘Hebu’ huonyesha ombi lenye msisitizo wa chembe נָא pamoja na nia ya msemaji iliyo katika umbo la cohortative.
- source_word: וְעַנּוּ אוֹתָם
  choice: Wadhalilisheni kingono
  rationale: Katika muktadha huu kitenzi cha Piel kinaonyesha udhalilishaji au unyanyasaji wa kingono. Tafsiri hii haitulizi uzito wa uovu huo, lakini tanbihi huhifadhi uwezekano wa tafsiri mahususi zaidi ‘wabake.’
- source_word: וַעֲשׂוּ לָהֶם הַטּוֹב בְּעֵינֵיכֶם
  choice: na watendeeni lililo jema machoni penu
  rationale: Huhifadhi taswira ya Kiebrania ya jambo kuwa jema ‘machoni’ mwa wasikilizaji, huku tanbihi ikifafanua maana ya nahau hiyo.
- source_word: וְלָאִישׁ הַזֶּה לֹא תַעֲשׂוּ
  choice: Lakini msimtendee mtu huyu
  rationale: Muundo huu unaonyesha kwa uwazi utofautishaji kati ya wanawake wanaotolewa na mwanamume ambaye mwenyeji anataka asilengiwe.
- source_word: דְּבַר הַנְּבָלָה הַזֹּאת
  choice: jambo hili la fedheha
  rationale: ‘Fedheha’ huonyesha tendo baya sana linalokiuka maadili na heshima ya jamii, wala si upumbavu wa kiakili tu.
theological_decisions:
- issue: Kutoa wazi maana ya ukatili wa kingono bila kubana kitenzi kuliko ushahidi wake
  choice: Wadhalilisheni kingono
  alternative: Wabakeni; wanyanyaseni; wanyenyekezeni
  rationale: Muktadha unahusu shambulio la kingono, lakini kitenzi ענה chenyewe kina wigo wa udhalilishaji na unyanyasaji. ‘Wadhalilisheni kingono’ huonyesha ukatili wa tukio bila kuufanya usemi huo kuwa istilahi finyu ya kisheria.
- issue: Uzito wa tathmini ya kimaadili katika נְבָלָה
  choice: jambo hili la fedheha
  alternative: jambo hili ovu; kitendo hiki cha aibu kubwa; upumbavu huu
  rationale: Neno hilo linamaanisha tendo la aibu na uovu mkubwa linalovunja mipaka ya maadili ya jamii; halimaanishi upumbavu wa kawaida tu.
- issue: Kuhifadhi hukumu potovu ya msemaji bila kuifanya kuwa idhini ya msimulizi
  choice: Kauli ya mwenyeji imetafsiriwa moja kwa moja bila maelezo yanayoihalalisha
  alternative: Kuongeza katika maandishi kwamba pendekezo lake lilikuwa ovu
  rationale: Aya inaripoti maneno ya mwenyeji, na tafsiri haipaswi kuongeza hukumu ya msimulizi ambayo haijaelezwa moja kwa moja hapa. Lugha yenyewe bado inaonyesha wazi ukatili wa pendekezo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Hebu’ huwasilisha ombi lenye msisitizo bila kuwa cha kale; ‘suria’ huhifadhi istilahi ya kihistoria; lugha ya ukatili wa kingono iko wazi lakini si ya kisheria kupita ushahidi wa Kiebrania.
