base_translation:
  language: en
  yaml_path: translation/ot/judges/019/002.yaml
  text: But his concubine was unfaithful to him[a], and she went away from him to her father's house, to Bethlehem in Judah, and was there for four months.
translation:
  language: sw
  text: Lakini suria wake hakuwa mwaminifu kwake[a], akaondoka kwake, akaenda nyumbani kwa baba yake huko Bethlehemu ya Yuda. Akakaa huko kwa miezi minne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na Kiebrania, “alifanya ukahaba dhidi yake.” Baadhi ya wafasiri wa kale walielewa kifungu hiki kwa namna tofauti, kama vile “alikasirika naye” au “aligombana naye.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְנֶה
  choice: hakumwaminia
  rationale: Kitenzi זנה kwa kawaida huonyesha uasherati au kutokuwa mwaminifu katika uhusiano. “Hakumwaminia” kinaeleza maana inayowezekana zaidi kwa Kiswahili cha kawaida bila kudai kwamba alifanya ukahaba wa biashara.
- source_word: עָלָיו
  choice: hakumwaminia
  rationale: Kihusishi על chenye kiambishi cha nafsi kinaonyesha kutokuwa mwaminifu kulikomwelekea au kulikokuwa dhidi yake; maana hiyo imewasilishwa kwa muundo wa Kiswahili “hakumwaminia.”
- source_word: פִּילַגְשׁוֹ
  choice: suria wake
  rationale: “Suria” ni istilahi fupi ya kawaida ya kibiblia kwa mwanamke aliye katika muungano wa kindoa wenye hadhi ya chini kuliko mke mkuu.
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: akaondoka kwake
  rationale: Huhifadhi tendo la kwenda pamoja na wazo la kujitenga naye.
- source_word: אֶל בֵּית אָבִיהָ
  choice: akarudi nyumbani kwa baba yake
  rationale: “Nyumbani kwa baba yake” ni Kiswahili cha kawaida kwa בית אביה. “Akarudi” linaeleza kwa kawaida mwendo wa kwenda kwenye nyumba ya asili, ingawa kitenzi cha Kiebrania chenyewe ni “akaenda.”
- source_word: אֶל בֵּית לֶחֶם יְהוּדָה
  choice: huko Bethlehemu katika Yuda
  rationale: Hutambulisha mji huo kuwa Bethlehemu iliyoko katika eneo la Yuda.
- source_word: וַתְּהִי שָׁם
  choice: Akakaa huko
  rationale: Katika simulizi la Kiswahili, “akakaa huko” huwasilisha kwa ufasaha maana ya kuwa mahali hapo kwa muda.
- source_word: יָמִים אַרְבָּעָה חֳדָשִׁים
  choice: kwa miezi minne
  rationale: Nahau ya Kiebrania, kihalisi “siku, miezi minne,” huonyesha kipindi cha miezi minne; tafsiri hii ni wazi na sahihi.
theological_decisions:
- issue: Maana ya וַתִּזְנֶה katika simulizi lenye hukumu nzito ya kimaadili
  choice: hakumwaminia, yaani kutokuwa mwaminifu kingono
  alternative: alimkasirikia au aligombana naye
  rationale: Matamshi ya Kimasora na maana ya kawaida ya זנה yanaunga mkono kutokuwa mwaminifu kingono. Hata hivyo, mapokeo fulani ya kale yalielewa kifungu hiki tofauti; maana hiyo imehifadhiwa katika tanbihi ili kutoficha mvutano wa kale wa kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umetumiwa kwa vitenzi vinavyofuatana. Neno “suria” ni sahihi lakini si la mazungumzo ya kila siku; linafaa hapa kwa sababu linaonyesha hadhi maalumu ya uhusiano bila kuifanya iwe sawa kabisa na ndoa ya mke mkuu.
