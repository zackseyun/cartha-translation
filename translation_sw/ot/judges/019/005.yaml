base_translation:
  language: en
  yaml_path: translation/ot/judges/019/005.yaml
  text: On the fourth day[a], they rose early in the morning, and he got up to go. But the young woman’s father said to his son-in-law, “Refresh your heart with a morsel of bread[b], and afterward you may go.”
translation:
  language: sw
  text: Siku ya nne, wakaamka asubuhi na mapema, naye akainuka ili aondoke. Lakini baba wa yule mwanamke kijana akamwambia mume wa binti yake, “Jitie nguvu[a] kwa kipande cha mkate, kisha mtaondoka[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, “Uutie moyo wako nguvu kwa kipande cha mkate.” Nahau hii ina maana ya kujipa nguvu kwa kula.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha mwisho ni cha wingi katika Kiebrania (“mtaondoka”), huenda kikirejelea msafara wote, ingawa baba anamwambia mwana-mkwe wake moja kwa moja.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: Siku ya nne
  rationale: Ni usemi wa moja kwa moja wa wakati, bila kuongeza maelezo yasiyotajwa kuhusu muda wa kukaa.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: wakaamka asubuhi na mapema
  rationale: Kitenzi cha wingi kinawahusu watu waliokuwa wakisafiri, na usemi huu ni wa kawaida katika Kiswahili huku ukihifadhi wazo la kuamka mapema.
- source_word: וַיָּקָם לָלֶכֶת
  choice: naye akainuka ili aondoke
  rationale: Umoja wa kitenzi unarudisha fikira kwa Mlawi; ‘ili aondoke’ linaonyesha kusudi la kuinuka.
- source_word: אֲבִי הַנַּעֲרָה
  choice: baba ya yule mwanamke kijana
  rationale: נַעֲרָה hapa ni mwanamke kijana; tafsiri hii inaepuka neno linaloweza kudokeza mtoto mdogo.
- source_word: חֲתָנוֹ
  choice: mkwe wake
  rationale: Katika muktadha baba anamwambia mwanamume aliye katika uhusiano wa ukwe naye; ‘mkwe wake’ ni usemi wa kawaida wa Kiswahili, ingawa si mahususi kama neno la Kiebrania katika muktadha huu.
- source_word: סְעָד לִבְּךָ
  choice: Jitie nguvu kwa kula
  rationale: Nahau hiyo ina maana ya kujipa nguvu au kujirudishia nguvu kwa chakula. Kiswahili cha asili kinaeleza maana bila kudokeza kwamba ni amri ya kupata ujasiri.
- source_word: פַּת לֶחֶם
  choice: kipande cha mkate
  rationale: Huhifadhi picha halisi ya kiasi kidogo cha mkate na sauti ya ukarimu.
- source_word: וְאַחַר תֵּלֵכוּ
  choice: kisha mtaondoka
  rationale: Kitenzi cha Kiebrania ni cha wingi, kwa hiyo wingi umehifadhiwa ili kuhusisha msafara wote, ingawa baba anasema moja kwa moja na mkwe wake.
