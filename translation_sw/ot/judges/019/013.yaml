base_translation:
  language: en
  yaml_path: translation/ot/judges/019/013.yaml
  text: He said to his young man[a], “Come, and let us draw near to one of these places[b], and spend the night in Gibeah or in Ramah.”
translation:
  language: sw
  text: Akamwambia kijana wake[a], “Twende, tukaribie mojawapo ya sehemu hizi, tukalale huko Gibea au Rama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi wake” au “mhudumu wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ
  choice: kijana wake
  rationale: נַעַר inaweza kumaanisha kijana, mtumishi, au mhudumu. Katika muktadha huu ni mwanaume aliyeandamana na Mlawi; “kijana wake” huhifadhi maana ya msingi bila kusisitiza isivyohitajika hali ya utumishi.
- source_word: לְךָ
  choice: Twende
  rationale: Ingawa imperativi ya הלך kimsingi ni “nenda,” hapa inaambatana na kohortativi ya mwendo wa pamoja. “Twende” ni mwaliko wa kawaida na wa wazi katika Kiswahili.
- source_word: וְנִקְרְבָה
  choice: tukaribie
  rationale: Kohortativi hii inaonyesha azimio au mwaliko wa pamoja; “tukaribie” huhifadhi wazo la kusogea karibu na mahali.
- source_word: בְּאַחַד הַמְּקֹמוֹת
  choice: mojawapo ya maeneo haya
  rationale: Kirai hiki huelekeza kwenye moja ya maeneo ya karibu yanayofikiriwa, ambayo yanafafanuliwa mara moja kuwa Gibea au Rama.
- source_word: וְלַנּוּ
  choice: tukalale
  rationale: Kitenzi לון humaanisha kukaa au kulala usiku. “Tukalale” ni usemi wa kawaida wa Kiswahili katika muktadha wa wasafiri wanaotafuta mahali pa kupitisha usiku.
- source_word: בַגִּבְעָה
  choice: Gibea
  rationale: Jina la mahali limetoholewa kwa namna inayotambulika katika matumizi ya Biblia ya Kiswahili; muktadha wa kitenzi unafanya kihusishi cha mahali kisiwe lazima.
- source_word: בָרָמָה
  choice: Rama
  rationale: Jina la mahali limetoholewa na kuwekwa sambamba na Gibea; muktadha wa kulala mahali unaeleweka bila kuongeza kihusishi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Twende, tukaribie” huwasilisha kwa njia ya kawaida mwaliko wa mwendo wa pamoja, na “tukalale” ni rahisi kueleweka kuliko usemi rasmi zaidi wa kukaa usiku.
