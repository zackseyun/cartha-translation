base_translation:
  language: en
  yaml_path: translation/ot/judges/019/004.yaml
  text: And his father-in-law[a], the young woman's father, urged him to stay, and he remained with him three days; and they ate and drank, and spent the nights there.
translation:
  language: sw
  text: Baba mkwe wake, yaani baba ya yule msichana, akamsisitiza abaki[a]; naye akakaa naye kwa siku tatu. Wakala, wakanywa, na wakalala huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akamshawishi sana,” “akamshinikiza,” au “akamzuia.” Nahau ya Kiebrania kwa maana halisi husema kwamba baba mkwe wake “alikuwa na nguvu dhidi yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק בּוֹ
  choice: akamng’ang’ania abaki
  rationale: Nahau hii ya Kiebrania ina maana halisi ya kuwa na nguvu juu ya au dhidi ya mtu, lakini hapa inaonyesha msisitizo wenye shinikizo ili mtu abaki. “Akamng’ang’ania abaki” ni Kiswahili cha kawaida kinachoonyesha msisitizo huo bila kudai kwamba alitumia nguvu ya kimwili.
- source_word: חֹתְנוֹ
  choice: baba mkwe wake
  rationale: Neno hili hapa linaonyesha uhusiano wa kindoa kwa mtazamo wa Mlawi; “baba mkwe wake” ndilo neno la kawaida na wazi katika Kiswahili.
- source_word: אֲבִי הַנַּעֲרָה
  choice: baba ya yule mwanamke kijana
  rationale: Kirai hiki kinafafanua baba mkwe ni nani. “Mwanamke kijana” linafaa katika muktadha wa mtu aliye katika uhusiano wa kindoa na halimdokezi mtoto mdogo.
- source_word: וַיֵּשֶׁב אִתּוֹ
  choice: naye akakaa pamoja naye
  rationale: Kitenzi ישב kinaweza kumaanisha kuketi, kukaa au kuishi. Katika simulizi hili kinamaanisha kuendelea kukaa pamoja naye kama mgeni.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: kwa siku tatu
  rationale: Hii ni tafsiri ya moja kwa moja ya kipindi kilichotajwa.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: wakala, wakanywa
  rationale: Vitenzi viwili vimetafsiriwa moja kwa moja badala ya kufupishwa kwa neno lenye tafsiri ya ziada kama “wakafanya karamu.”
- source_word: וַיָּלִינוּ שָׁם
  choice: na kulala huko siku hizo
  rationale: Kitenzi לון kinahusu kukaa au kulala mahali wakati wa usiku. “Siku hizo” kinaonyesha kwamba jambo hilo lilitokea katika kipindi cha siku tatu, si usiku mmoja tu.
