base_translation:
  language: en
  yaml_path: translation/ot/judges/019/016.yaml
  text: And behold[a], an old man was coming in from his work in the field at evening. The man was from the hill country of Ephraim, and he was staying in Gibeah[b], but the men of the place were Benjaminites.
translation:
  language: sw
  text: Tazama, mzee mmoja alikuwa akija jioni kutoka kazini kwake shambani. Mzee huyo alitoka eneo la milima la Efraimu, naye aliishi huko Gibea akiwa mgeni[a]; lakini wenyeji wa mahali hapo walikuwa Wabenyamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kiebrania kinaweza pia kutafsiriwa “alikuwa akikaa” au “alikuwa akiishi” huko Gibea; kinadokeza kwamba hakuwa mwenyeji wa huko.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Inahifadhi kiashiria cha kisimulizi kinachovuta fikira kwenye tukio jipya, kwa Kiswahili cha kawaida lakini chenye hadhi.
- source_word: אִישׁ זָקֵן
  choice: mzee mmoja
  rationale: Ni tafsiri ya kawaida na ya asili ya nomino pamoja na kivumishi; “mmoja” humtambulisha mhusika bila kuongeza maana ya pekee.
- source_word: בָּא מִן מַעֲשֵׂהוּ מִן הַשָּׂדֶה
  choice: alikuwa akirudi ... kutoka kazini kwake shambani
  rationale: Muktadha unaonyesha alikuwa akiingia mjini baada ya kazi; “akirudi” ni ya asili kwa Kiswahili, huku “kutoka kazini kwake shambani” ikihifadhi vipashio vyote viwili vya Kiebrania.
- source_word: בָּעֶרֶב
  choice: jioni
  rationale: Tafsiri fupi na ya kawaida ya wakati uliotajwa.
- source_word: מֵהַר אֶפְרַיִם
  choice: kutoka eneo la milima la Efraimu
  rationale: הַר אֶפְרַיִם ni jina la kijiografia la nchi ya vilima, si lazima mlima mmoja; “eneo la milima” linaeleweka vizuri katika Kiswahili cha sasa.
- source_word: גָר
  choice: alikuwa akiishi kama mgeni
  rationale: Kitenzi גור huonyesha kukaa mahali ambapo mtu si mwenyeji, iwe kwa muda au kwa hali ya ugeni; tafsiri hii haiifanyi hali hiyo kuwa makazi ya kudumu.
- source_word: וְאַנְשֵׁי הַמָּקוֹם
  choice: lakini wenyeji wa mahali hapo
  rationale: “Lakini” huonyesha utofautishaji uliodokezwa kati ya asili ya mzee huyo na utambulisho wa wenyeji; “wenyeji” ni Kiswahili cha asili cha watu wa mahali hapo.
- source_word: בְּנֵי יְמִינִי
  choice: Wabenyamini
  rationale: Ni jina la kawaida la Kiswahili kwa watu wa kabila la Benyamini, badala ya tafsiri sisisi “wana wa Benyamini.”
