base_translation:
  language: en
  yaml_path: translation/ot/judges/019/026.yaml
  text: The woman came as morning was dawning and fell at the entrance of the house of the man where her master was[b][a], until it was light.
translation:
  language: sw
  text: Mwanamke huyo akaja kulipokaribia kupambazuka[a], akaanguka mlangoni pa nyumba ya yule mtu ambako bwana wake[b] alikuwapo, mpaka kukawa na mwanga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuelekea asubuhi” au “kabla ya mapambazuko.” Nahau ya Kiebrania kwa maana halisi hurejelea kugeuka kwa asubuhi.
    reason: lexical_alternative
  - marker: b
    text: Au “mkuu wake.” Kiebrania kinasema “bwana wake,” neno linaloonyesha mamlaka, wala halisemi wazi “mume wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: akaja
  rationale: Kitenzi בוא kimsingi humaanisha kuja. “Akarudi” kingeongeza wazo lisilotajwa wazi katika kitenzi, ingawa muktadha unaweza kulidokeza.
- source_word: לִפְנוֹת הַבֹּקֶר
  choice: kulipokaribia kupambazuka
  rationale: Nahau hii inaonyesha kugeuka au kukaribia kwa asubuhi. Tafsiri hii ni ya kawaida katika Kiswahili na huhifadhi wazo la wakati wa mpito kuelekea mapambazuko bila kulifanya kuwa saa kamili ya alfajiri.
- source_word: וַתִּפֹּל
  choice: akaanguka
  rationale: נפל humaanisha moja kwa moja “kuanguka.” Tafsiri “akazimia” au “akaporomoka” ingefafanua hali au sababu zaidi ya inavyosema Kiebrania.
- source_word: פֶּתַח בֵּית
  choice: mlangoni pa nyumba
  rationale: פֶּתַח ni sehemu ya kuingilia au uwazi wa mlango. “Mlangoni pa nyumba” ni usemi wa asili na wazi katika Kiswahili.
- source_word: הָאִישׁ
  choice: yule mtu
  rationale: אִישׁ hapa ni nomino ya kawaida, “mtu/mwanamume.” “Yule mtu” humrejelea mwenye nyumba anayejulikana katika muktadha bila kuongeza cheo kisichopo katika mstari.
- source_word: אֲדוֹנֶיהָ
  choice: bwana wake
  rationale: אדון pamoja na kiambishi cha nafsi ya tatu ya kike humaanisha “bwana wake” au “mkuu wake” na huonyesha mamlaka. Haisemi wazi “mume wake,” hivyo “bwana wake” huhifadhi maana na mvutano wa kijamii wa neno la Kiebrania.
- source_word: אֲשֶׁר ... שָׁם
  choice: ambako ... alikuwapo
  rationale: Muundo huu unaeleza mahali ambako bwana wake alikuwapo. “Ambako ... alikuwapo” ni wa asili katika Kiswahili na huhifadhi uhusiano wa mahali.
- source_word: עַד הָאוֹר
  choice: mpaka kukawa na mwanga
  rationale: Kirai hiki kinaonyesha muda hadi kulipopata nuru ya mchana. Tafsiri hii huepuka kurudia “kupambazuka” na huhifadhi picha ya mwanga iliyo katika Kiebrania.
theological_decisions:
- issue: Uhusiano unaodokezwa na אֲדוֹנֶיהָ
  choice: bwana wake
  alternative: mume wake
  rationale: Neno la Kiebrania ni la mamlaka, si jina la moja kwa moja la uhusiano wa ndoa. Kutumia “mume wake” kungeondoa utata halisi wa maandishi na kuficha hali ya mamlaka inayosisitizwa na neno hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo mfupi wa simulizi na kitenzi “akaanguka” huhifadhi ukali wa mstari bila kuongeza maelezo kuhusu hali ya mwanamke ambayo hayajasemwa wazi.
