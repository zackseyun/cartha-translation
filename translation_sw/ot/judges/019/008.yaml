base_translation:
  language: en
  yaml_path: translation/ot/judges/019/008.yaml
  text: He got up early in the morning on the fifth day to go[a], but the young woman's father said, “Please strengthen your heart with a morsel of food, and wait until the day declines.” So the two of them ate.
translation:
  language: sw
  text: Siku ya tano aliamka asubuhi na mapema ili aondoke, lakini baba wa mwanamke huyo kijana akasema, “Tafadhali, ujitie nguvu kwa chakula kidogo[a], nanyi mkawie mpaka siku ielekee jioni.” Basi wote wawili wakala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “utegemeze moyo wako.” Huu ni usemi unaomaanisha kula na kupata nguvu tena.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: aliamka asubuhi na mapema
  rationale: Kitenzi שׁכם katika Hiphil kinaonyesha kuamka au kuanza mapema; usemi huu ni wa kawaida na unaweka wazi msisitizo wa wakati.
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: Siku ya tano
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha wakati.
- source_word: לָלֶכֶת
  choice: ili aondoke
  rationale: Ingawa הלך kwa msingi ni ‘kwenda,’ katika muktadha huu mtu anajiandaa kuondoka katika nyumba hiyo; ‘aondoke’ huwasilisha maana ya kimuktadha kwa Kiswahili cha kawaida.
- source_word: אֲבִי הַנַּעֲרָה
  choice: baba ya yule mwanamke kijana
  rationale: נַעֲרָה humaanisha msichana au mwanamke kijana; ‘mwanamke kijana’ linafaa kwa mhusika aliye katika uhusiano wa kindoa na halimpunguzi umri isivyofaa.
- source_word: סְעָד נָא לְבָבְךָ
  choice: Tafadhali, ujitie nguvu kwa chakula kidogo
  rationale: Huu ni usemi unaomaanisha kula ili kupata nguvu. Tafsiri kuu ni ya kawaida kwa Kiswahili, huku tanbihi ikihifadhi taswira halisi ya ‘moyo.’
- source_word: וְהִתְמַהְמְהוּ
  choice: nanyi mkawie
  rationale: Umbo la wingi la Hitpael lina maana ya kukawia au kuchelewa. ‘Nanyi mkawie’ huhifadhi mabadiliko kutoka agizo la umoja kwenda la wingi yaliyopo katika Kiebrania.
- source_word: עַד נְטוֹת הַיּוֹם
  choice: mpaka siku ielekee jioni
  rationale: Kirai hiki kinaonyesha mchana unaopinda au kuelekea mwisho wake; tafsiri hii ni ya asili na bado inahifadhi taswira ya mwelekeo wa siku.
- source_word: וַיֹּאכְלוּ שְׁנֵיהֶם
  choice: Basi wote wawili wakala
  rationale: ‘Wote wawili’ huhifadhi msisitizo wa Kiebrania juu ya watu hao wawili, na ‘Basi’ huonyesha matokeo ya ombi la baba.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri imehifadhi mabadiliko ya idadi katika kauli ya baba: kwanza anamwelekeza mtu mmoja (‘ujitie’), kisha kundi (‘nanyi mkawie’).'
