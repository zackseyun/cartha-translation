base_translation:
  language: en
  yaml_path: translation/ot/judges/019/010.yaml
  text: But the man was not willing to spend the night. He rose and went and came opposite Jebus (that is[a], Jerusalem), and with him were a pair of saddled donkeys and his concubine.
translation:
  language: sw
  text: Lakini mtu huyo hakuwa tayari kukaa huko usiku. Akainuka, akaenda, akafika mkabala na Yebusi[a] (yaani Yerusalemu). Alikuwa na punda wawili waliotiwa matandiko, pamoja na suria wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “karibu na Yebusi” au “mahali panapokabiliana na Yebusi.” Usemi wa Kiebrania unaonyesha mahali palipokuwa mbele ya mji au mkabala nao, wala hauelezi wazi kwamba walikuwa wameingia ndani ya mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: hakukubali
  rationale: Kitenzi hiki kinahusu kuwa tayari au kutoa ridhaa. “Hakukubali” linaonyesha uamuzi wake bila kuzidisha maana kuwa uhasama.
- source_word: לָלוּן
  choice: kukaa huko usiku
  rationale: Kitenzi kinamaanisha kubaki mahali usiku. Kauli hii ni ya kawaida katika Kiswahili na inaepuka maana finyu ya kulala usingizi.
- source_word: וַיָּקָם וַיֵּלֶךְ וַיָּבֹא
  choice: Akainuka, akaenda, akafika
  rationale: Mfuatano wa vitenzi vitatu umehifadhiwa ili kudumisha mwendo na mpangilio wa simulizi ya Kiebrania.
- source_word: עַד נֹכַח
  choice: akafika mkabala na
  rationale: Kauli hii inaonyesha kufika sehemu iliyo mbele ya au inayokabiliana na mji, bila kusema wazi kwamba aliingia ndani yake.
- source_word: יְבוּס הִיא יְרוּשָׁלָם
  choice: Yebusi (yaani Yerusalemu)
  rationale: Maelezo ya mabano yanahifadhi ufafanuzi wa jina la zamani Yebusi kuwa ndilo Yerusalemu.
- source_word: צֶמֶד חֲמוֹרִים
  choice: punda wawili
  rationale: צֶמֶד hapa ni jozi ya wanyama. “Punda wawili” ni Kiswahili cha kawaida na wazi.
- source_word: חֲבוּשִׁים
  choice: waliotandikwa matandiko
  rationale: Katika muktadha wa safari, neno linaelekea kumaanisha punda waliowekewa matandiko au vifaa vya kusafiria. Uamuzi huu unafuata maana ya msingi bila kuwaita tu waliolemewa mizigo.
- source_word: פִּילַגְשׁוֹ
  choice: suria wake
  rationale: “Suria” ni istilahi ya Kiswahili inayowakilisha hadhi maalumu ya mwanamke huyu bila kumfanya tu kuwa mke wa kawaida.
