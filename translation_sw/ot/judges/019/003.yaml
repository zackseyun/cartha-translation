base_translation:
  language: en
  yaml_path: translation/ot/judges/019/003.yaml
  text: Then her husband arose and went after her to speak to her heart and bring her back[a]. His young servant was with him, along with a pair of donkeys. She brought him into her father’s house, and when the young woman’s father saw him[b], he rejoiced to meet him.
translation:
  language: sw
  text: Ndipo mume wake akaondoka, akamfuata ili kusema naye kwa upole[a] na kumrudisha[b]. Mtumishi wake mchanga alikuwa pamoja naye, na punda wawili. Mwanamke huyo akampeleka nyumbani kwa baba yake. Baba wa mwanamke huyo alipomwona, akafurahi kumlaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kusema kwa moyo wake,” nahau inayomaanisha kusema naye kwa upole au kwa kusudi la kumshawishi.'
    reason: lexical_alternative
  - marker: b
    text: 'Umbo la Kiebrania la “kumrudisha” lina ugumu wa kimatini: konsonanti zilivyoandikwa zina kiambishi cha kiume, lakini muktadha unaonyesha kwamba alikusudia kumrudisha mwanamke huyo.'
    reason: textual_variant
lexical_decisions:
- source_word: אִישָׁהּ
  choice: mume wake
  rationale: Ingawa neno hilo kihalisi linaweza kuwa ‘mtu wake’ au ‘mwanamume wake,’ katika uhusiano huu wa kindoa maana ya kawaida ni ‘mume wake.’
- source_word: אַחֲרֶיהָ
  choice: akamfuata
  rationale: Kitenzi cha Kiswahili ‘kumfuata’ kinaonyesha mwendo wa kwenda nyuma au baada ya mtu kwa kusudi la kumfikia.
- source_word: לְדַבֵּר עַל־לִבָּהּ
  choice: kusema na moyo wake
  rationale: Usemi huu unahifadhi taswira ya Kiebrania ya kusema kwa moyo wa mtu, huku tanbihi ikifafanua kuwa maana yake ni kusema kwa upole au kwa kusudi la kumshawishi.
- source_word: לַהֲשִׁיבוֹ
  choice: kumrudisha
  rationale: Muktadha unaonyesha kuwa nia ya mwanamume ilikuwa kumrudisha mwanamke huyo, ingawa umbo la konsonanti la Kiebrania lina kiambishi cha kiume na hivyo lina ugumu wa kimatini.
- source_word: נַעֲרוֹ
  choice: mtumishi wake kijana
  rationale: נַעַר inaweza kumaanisha kijana au mtumishi; hapa msafara unaonyesha kijana aliyekuwa akimhudumia na kuandamana naye.
- source_word: צֶמֶד חֲמֹרִים
  choice: punda wawili
  rationale: צֶמֶד ni jozi; ‘punda wawili’ ni Kiswahili cha kawaida kisichodai bila lazima kwamba walikuwa wamefungwa nira.
- source_word: וַתְּבִיאֵהוּ
  choice: akampeleka nyumbani kwa baba yake
  rationale: Kitenzi cha umoja wa kike kinamtaja mwanamke kuwa ndiye aliyempeleka mwanamume ndani ya nyumba ya baba yake.
- source_word: הַנַּעֲרָה
  choice: yule mwanamke kijana
  rationale: Neno linamtaja kama mwanamke kijana; tafsiri hii inaepuka lugha ya kizamani na haifuti namna tofauti ambayo simulizi linamtaja.
- source_word: וַיִּשְׂמַח לִקְרָאתוֹ
  choice: akafurahi kwenda kumlaki
  rationale: Tafsiri hii inaonyesha furaha ya baba pamoja na wazo la kutoka au kwenda kumk迎a mgeni lililomo katika לִקְרָאתוֹ.
