base_translation:
  language: en
  yaml_path: translation/ot/judges/019/019.yaml
  text: Yet there is both straw and fodder for our donkeys[a], and there is bread and wine for me, for your female servant, and for the young man with your servants[c][b]; there is no lack of anything.
translation:
  language: sw
  text: Pia kuna majani makavu ya nafaka na chakula cha wanyama kwa ajili ya punda wetu,[a] na pia kuna mkate na divai kwa ajili yangu, kwa ajili ya mjakazi wako,[b] na kwa ajili ya kijana aliye pamoja na watumishi wako.[c] Hakuna upungufu wa kitu chochote.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinarudia neno “pia” kwa msisitizo: “Na pia kuna majani makavu, pia chakula cha wanyama ...”'
    reason: lexical_alternative
  - marker: b
    text: “Mjakazi wako” ni namna ya unyenyekevu ya kumrejelea mwanamke aliyekuwa akisafiri pamoja naye; haisemi lazima kwamba alikuwa mtumishi wa mwenyeji.
    reason: cultural_note
  - marker: c
    text: Kiebrania ni “pamoja na watumishi wako.” Huenda “watumishi wako” ni namna ya unyenyekevu ambayo msemaji anatumia kujitaja yeye na walio pamoja naye.
    reason: textual_ambiguity
  - marker: d
    text: Au, “Hatukosi kitu chochote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם ... גַם ... וְגַם
  choice: Tena ... na ... na pia
  rationale: Muundo huu unaonyesha nyongeza na msisitizo wa kurudiwa kwa גַם bila kuifanya sentensi ya Kiswahili kuwa nzito kupita kiasi.
- source_word: תֶּבֶן
  choice: majani makavu
  rationale: Ni neno la kawaida la Kiswahili kwa mabaki makavu ya nafaka yanayotumiwa kulisha wanyama au kuwaandalia malazi.
- source_word: מִסְפּוֹא
  choice: malisho
  rationale: Hurejelea chakula cha wanyama na hudumisha tofauti na ‘majani makavu’ pamoja na vyakula vya watu vinavyotajwa baadaye.
- source_word: לַחֲמוֹרֵינוּ
  choice: kwa ajili ya punda wetu
  rationale: Inahifadhi wingi na kiambishi cha umilikaji cha nafsi ya kwanza wingi.
- source_word: לֶחֶם וָיַיִן
  choice: mkate na divai
  rationale: Inataja kwa uhalisi mahitaji maalumu yaliyopo badala ya kuyajumlisha kuwa ‘chakula na kinywaji.’
- source_word: יֶשׁ לִי
  choice: kuna ... kwa ajili yangu
  rationale: Inadumisha muundo wa Kiebrania unaosisitiza kuwapo kwa mahitaji, badala ya kuugeuza moja kwa moja kuwa ‘nina.’
- source_word: אֲמָתֶךָ
  choice: mjakazi wako
  rationale: Inahifadhi jinsia na lugha ya unyenyekevu ya msemaji; tanbihi inaeleza kwamba hapa ni namna ya heshima ya kumrejelea mwanamke anayesafiri naye.
- source_word: לַנַּעַר
  choice: kijana
  rationale: נַעַר inaweza kumaanisha kijana au mtumishi kijana; chaguo pana ‘kijana’ halifungi maana zaidi ya maandishi.
- source_word: עִם עֲבָדֶיךָ
  choice: aliye pamoja na watumishi wako
  rationale: Inahifadhi kiambishi cha nafsi ya pili umoja katika maandishi ya Kiebrania na kuunganisha kishazi na ‘kijana,’ huku tanbihi ikitaja matumizi ya heshima yanayowezekana.
- source_word: אֵין מַחְסוֹר כָּל דָּבָר
  choice: Hakuna upungufu wa kitu chochote
  rationale: Inabaki karibu na nahau ya Kiebrania na kueleza kwamba mahitaji yote yametimizwa.
