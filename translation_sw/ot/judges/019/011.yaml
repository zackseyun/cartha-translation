base_translation:
  language: en
  yaml_path: translation/ot/judges/019/011.yaml
  text: When they were near Jebus[a], and the day was far spent, the young man said to his master, “Please come[c][b], let us turn aside to this city of the Jebusites and spend the night in it.”
translation:
  language: sw
  text: Walipokuwa karibu na Yebusi[a], siku ilikuwa imekwenda sana[b]. Yule kijana[c] akamwambia bwana wake, “Tafadhali, twende tukengeukie mji huu wa Wayebusi, tukalale humo usiku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yebusi ni jina la zamani la Yerusalemu.
    reason: cross_reference
  - marker: b
    text: Au, “siku ilikuwa imesonga sana,” yaani, ilikuwa imechelewa sana.
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania linalotafsiriwa “kijana” linaweza pia kumaanisha mtumishi au msaidizi katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם עִם יְבוּס
  choice: walipokuwa karibu na Yebusi
  rationale: Ingawa עִם kwa kawaida humaanisha ‘pamoja na,’ inapotumiwa katika simulizi la safari pamoja na jina la mahali huonyesha ukaribu. ‘Karibu na Yebusi’ hutoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: יְבוּס
  choice: Yebusi
  rationale: Maandishi ya Kiebrania yanatumia jina la zamani la mahali hapo, hivyo limedumishwa badala ya kubadilishwa moja kwa moja kuwa Yerusalemu.
- source_word: וְהַיּוֹם רַד מְאֹד
  choice: siku ilikuwa imekwenda sana
  rationale: Usemi huu unaonyesha siku iliyokuwa imesonga kuelekea jioni. Tafsiri hii inadumisha taswira ya siku inayokwenda huku ikieleweka katika muktadha.
- source_word: הַנַּעַר
  choice: yule kijana
  rationale: נַעַר inaweza kumaanisha kijana, mvulana, au mtumishi/msaidizi kulingana na muktadha. ‘Kijana’ huhifadhi upana wa neno, huku uhusiano wake wa chini ukionyeshwa na maneno ‘bwana wake.’
- source_word: אֲדֹנָיו
  choice: bwana wake
  rationale: Katika muktadha huu אֲדוֹן humaanisha mtu mwenye mamlaka juu ya kijana huyo. ‘Bwana wake’ ni usemi wa kawaida wa Kiswahili unaofaa kwa uhusiano huo.
- source_word: לְכָה נָּא וְנָסוּרָה
  choice: Tafadhali, twende tukengeuke
  rationale: נָא huleta ombi la heshima, na סוּר katika muktadha wa safari ni kuacha njia na kuelekea kando. ‘Twende tukengeuke’ ni Kiswahili cha asili kinachowasilisha mwaliko wa kwenda pamoja bila kufanya usemi kuwa mgumu.
- source_word: עִיר הַיְבוּסִי הַזֹּאת
  choice: mji huu wa Wayebusi
  rationale: Jina la kikabila הַיְבוּסִי limetumiwa kwa maana ya pamoja, likirejelea watu wa Yebusi; hivyo ‘Wayebusi’ ni wazi na hudumisha kibainishi ‘huu.’
- source_word: וְנָלִין בָּהּ
  choice: na kukaa humo usiku
  rationale: לוּן humaanisha kukaa au kulala mahali usiku. ‘Kukaa humo usiku’ ni usemi wa sasa na wazi usiofinya maana kuwa tendo la kulala pekee.
