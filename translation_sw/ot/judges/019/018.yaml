    issue: Neno “sasa” limeongezwa katika kauli ya kwenda kwenye nyumba ya Yahweh.
    rationale: Kiebrania kinasema tu “ninaenda”; hakuna kiashirio bainifu cha “sasa.” Kuondoa neno hilo huhifadhi ukaribu zaidi na matini chanzi.
  - severity: medium
    issue: “Anayenikaribisha nyumbani mwake” halisemi kwa uwazi kumpokea msafiri ndani ya nyumba kwa ajili ya malazi.
    rationale: אַסֵּף katika muktadha huu ni kumchukua/kumpokea msafiri nyumbani. “Kunipokea nyumbani mwake” ni sahihi zaidi na bado ni Kiswahili cha kawaida.
  - severity: low
    issue: Tanbihi husema “neno la Kiebrania” ingawa suala linahusu usemi/kirungu cha Kiebrania.
    rationale: Kurekebisha kwa “usemi wa Kiebrania” ni sahihi zaidi kielimu.
