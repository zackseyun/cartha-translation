source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֹבְרִ֨ים אֲנַ֜חְנוּ מִ/בֵּֽית לֶ֣חֶם יְהוּדָה֮ עַד יַרְכְּתֵ֣י הַר אֶפְרַיִם֒ מִ/שָּׁ֣ם אָנֹ֔כִי וָ/אֵלֵ֕ךְ עַד בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וְ/אֶת בֵּ֤ית יְהוָה֙ אֲנִ֣י הֹלֵ֔ךְ וְ/אֵ֣ין אִ֔ישׁ מְאַסֵּ֥ף אוֹתִ֖/י הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/018.yaml
  text: He said to him[a], “We are passing through from Bethlehem in Judah to the remote parts of the hill country of Ephraim. I am from there, and I went to Bethlehem in Judah, and I am going to the house of Yahweh, but no man is taking me into his house.”
translation:
  language: sw
  text: Akamwambia, “Tunasafiri kutoka Bethlehemu ya Yuda kuelekea sehemu za mbali za nchi ya vilima ya Efraimu. Mimi ni wa huko, nami nilikwenda Bethlehemu ya Yuda; ninaenda kwenye nyumba ya Yahweh,[a] lakini hakuna mtu wa kunipokea nyumbani mwake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninaenda nyumbani” au “nyumbani kwangu.” Wengine huuelewa usemi wa Kiebrania kwa maana hii au hudhani kuwa hapa kulikuwa na usomaji tofauti, kwa sababu “nyumba ya Yahweh” haitarajiwi katika muktadha huu.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹבְרִים אֲנַחְנוּ
  choice: Tunasafiri
  rationale: Kirai chenye kitenzi-shirikishi kinaonyesha safari inayoendelea. “Tunasafiri” ni Kiswahili cha kawaida kinachohifadhi maana ya kuwa njiani bila kudokeza isivyo lazima kwamba wanapita tu bila kuelekea huko.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: kutoka Bethlehemu ya Yuda
  rationale: Muundo huu unatambulisha Bethlehemu iliyo katika eneo la Yuda na kuitofautisha na mahali pengine penye jina hilo.
- source_word: יַרְכְּתֵי הַר אֶפְרַיִם
  choice: sehemu za mbali za nchi ya vilima ya Efraimu
  rationale: יַרְכְּתֵי humaanisha miisho au sehemu za mbali, na הַר אֶפְרַיִם hapa ni jina la kijiografia la nchi ya vilima ya Efraimu.
- source_word: מִשָּׁם אָנֹכִי
  choice: Mimi ninatoka huko
  rationale: Huhifadhi kauli ya moja kwa moja kuhusu mahali anapotoka pamoja na msisitizo wa kiwakilishi אָנֹכִי.
- source_word: וָאֵלֵךְ עַד בֵּית לֶחֶם יְהוּדָה
  choice: nami nilikwenda Bethlehemu ya Yuda
  rationale: Umbo la wayyiqtol la הלך linaeleweka kiasili kama tendo lililopita; tafsiri hailainishi mvutano wa mfuatano wa safari kwa kulifanya tendo la sasa.
- source_word: וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ
  choice: sasa ninaenda kwenye nyumba ya Yahweh
  rationale: Maandishi ya Kimasora yanasema wazi “nyumba ya Yahweh.” “Sasa” hufanya mfuatano wa kauli ueleweke kwa Kiswahili bila kubadili mahali anaposema anakwenda.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa na cheo.
- source_word: וְאֵין אִישׁ מְאַסֵּף אוֹתִי הַבָּיְתָה
  choice: lakini hakuna mtu anayenikaribisha nyumbani mwake
  rationale: אסף katika muktadha huu wa ukarimu humaanisha kumpokea au kumkaribisha msafiri ndani ya nyumba. Kiswahili “nyumbani mwake” kinaonyesha kwamba anayelalamikiwa ni mwenyeji anayekataa kumpa malazi.
theological_decisions:
- issue: Maana ya וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ
  choice: ninaenda kwenye nyumba ya Yahweh
  alternative: ninaenda nyumbani / nyumbani kwangu
  rationale: Maandishi ya Kimasora yana “nyumba ya Yahweh,” ingawa kauli hiyo haitarajiwi kirahisi katika muktadha na wengine huielewa au huisahihisha kuwa “nyumbani.” Tafsiri kuu inafuata ushahidi wa maandishi, huku maana mbadala ikihifadhiwa katika tanbihi.
- issue: Nomino ya kiume ya umoja אִישׁ
  choice: hakuna mtu
  alternative: hakuna mwanamume
  rationale: Katika tungo hasi ya Kiebrania, אִישׁ inaweza kufanya kazi kama kiwakilishi kisichobainisha mtu fulani. “Hakuna mtu” ni Kiswahili cha kawaida na hakiongezi dai kwamba jinsia ya mwenyeji ndiyo jambo linalosisitizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo ni wa simulizi la moja kwa moja; majina ya maeneo yamewekwa katika maumbo yanayotambulika kwa wasomaji wa Kiswahili. Tanbihi imewekwa mara tu baada ya kirai kinachohusika.
