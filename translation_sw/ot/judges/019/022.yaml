  text: הֵמָּה֮ מֵיטִיבִ֣ים אֶת לִבָּ/ם֒ וְ/הִנֵּה֩ אַנְשֵׁ֨י הָ/עִ֜יר אַנְשֵׁ֣י בְנֵֽי בְלִיַּ֗עַל נָסַ֨בּוּ֙ אֶת הַ/בַּ֔יִת מִֽתְדַּפְּקִ֖ים עַל הַ/דָּ֑לֶת וַ/יֹּאמְר֗וּ אֶל הָ֠/אִישׁ בַּ֣עַל הַ/בַּ֤יִת הַ/זָּקֵן֙ לֵ/אמֹ֔ר הוֹצֵ֗א אֶת הָ/אִ֛ישׁ אֲשֶׁר בָּ֥א אֶל בֵּיתְ/ךָ֖ וְ/נֵדָעֶֽ/נּוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/022.yaml
  text: While they were making their hearts merry[a], behold, the men of the city, worthless men, surrounded the house, pounding on the door. They said to the old man, the master of the house, “Bring out the man who came into your house[b], so that we may know him.”
translation:
  language: sw
  text: Walipokuwa wakijifurahisha, tazama, wanaume wa mji, watu waovu[a], wakaizunguka nyumba wakigonga mlango kwa nguvu. Wakamwambia mwenyeji huyo mzee, “Mtoe nje mwanamume aliyeingia nyumbani mwako, ili tumjue[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi, “wana wa Beliali”; yaani, watu waovu au wasiotii sheria.
    reason: lexical_alternative
  - marker: b
    text: Hapa “kumjua” ni fumbo la kingono; walikusudia kumdhulumu kingono.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיטִיבִים אֶת לִבָּם
  choice: wakifurahisha mioyo yao
  rationale: Nahau ya Kiebrania inasema kihalisi kwamba waliifanya mioyo yao kuwa na hali njema; tafsiri hii inadumisha taswira hiyo huku ikionyesha furaha yao wakati wa karamu.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili linaonyesha mgeuko wa ghafula na wenye uzito katika simulizi; “tazama” linadumisha athari hiyo.
- source_word: אַנְשֵׁי הָעִיר
  choice: wanaume wa mji
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha Kiebrania.
- source_word: אַנְשֵׁי בְנֵי בְלִיַּעַל
  choice: watu waovu
  rationale: Kirai hiki ni nahau inayowataja watu wapotovu kimaadili na wasiotii sheria. “Watu waovu” kinaeleweka kwa urahisi na kinaonyesha maana ya kimaadili; muundo wa karibu zaidi na maneno ya Kiebrania umetolewa katika tanbihi.
- source_word: נָסַבּוּ אֶת הַבַּיִת
  choice: wakaizunguka nyumba
  rationale: Kitenzi kinaonyesha kuizunguka au kuzingira nyumba; tafsiri hii ni ya kawaida na sahihi katika Kiswahili.
- source_word: מִתְדַּפְּקִים עַל הַדָּלֶת
  choice: huku wakigonga mlango kwa nguvu
  rationale: Kauli hii inaonyesha kitendo cha kurudiwa cha kuupiga mlango kwa fujo; “kwa nguvu” kinaweka wazi ukali wa tendo hilo.
- source_word: בַּעַל הַבַּיִת הַזָּקֵן
  choice: yule mzee mwenye nyumba
  rationale: Katika muktadha huu הַזָּקֵן inaonyesha umri, si cheo rasmi, na בַּעַל הַבַּיִת ni mtu mwenye mamlaka juu ya nyumba.
- source_word: הוֹצֵא
  choice: Mtoe nje
  rationale: Amri hiyo inadai mgeni atolewe ndani ya nyumba na kupelekwa nje; “mtoe nje” ni ya asili katika Kiswahili.
- source_word: וְנֵדָעֶנּוּ
  choice: ili tumjue
  rationale: Kitenzi “kujua” kimetumiwa kama sitiari ya kingono. Kudumisha nahau hiyo kunahifadhi lugha ya chanzo na mwangwi wake wa Mwanzo 19, huku tanbihi ikifafanua kusudi la wanaume hao.
theological_decisions:
- issue: Tafsiri ya sitiari ya kingono וְנֵדָעֶנּוּ
  choice: Kudumisha katika matini kuu nahau “ili tumjue” na kufafanua maana yake ya kingono katika tanbihi.
  alternative: “ili tufanye naye ngono” au “ili tumdhulumu kingono”
  rationale: Kiebrania kinatumia kwa makusudi kitenzi “kujua” kama sitiari na hivyo kuhusisha kifungu hiki na Mwanzo 19. Tanbihi inaondoa uwezekano wa msomaji kukosa maana iliyokusudiwa bila kuondoa mtindo wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Tazama” limetumiwa kudumisha mgeuko mkali wa simulizi, na nahau mbili za Kiebrania zimehifadhiwa pale zinapoeleweka kwa msaada wa tanbihi.
