base_translation:
  language: en
  yaml_path: translation/ot/judges/019/027.yaml
  text: Her master got up in the morning and opened the doors of the house and went out to go on his way[a], and behold, the woman, his concubine, was lying at the entrance of the house, with her hands on the threshold.
translation:
  language: sw
  text: Bwana wake aliamka asubuhi, akafungua milango ya nyumba, kisha akatoka ili aende zake. Kumbe, yule mwanamke, suria wake, alikuwa ameanguka[a] mlangoni mwa nyumba, mikono yake ikiwa juu ya kizingiti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, alikuwa ameanguka chini.
    reason: Kitenzi-shirikishi cha Kiebrania kinaeleza hali ya mwanamke kuwa ameanguka; hakisemi wazi katika mstari huu kwamba alikuwa amekufa.
lexical_decisions:
- source_word: אֲדֹנֶיהָ
  choice: Bwana wake
  rationale: Huhifadhi maana ya msingi ya ‘bwana wake’ na uhusiano wa mamlaka uliomo katika Kiebrania, bila kuibadili waziwazi kuwa ‘mume wake.’
- source_word: דַּלְתוֹת הַבַּיִת
  choice: milango ya nyumba
  rationale: Huhifadhi wingi wa דַּלְתוֹת na mazingira halisi ya nyumba.
- source_word: וַיֵּצֵא לָלֶכֶת לְדַרְכּוֹ
  choice: akatoka ili aende zake
  rationale: Huwakilisha kusudi la muundo wa kitenzi na nahau ya kwenda njia yake kwa Kiswahili cha kawaida.
- source_word: וְהִנֵּה
  choice: Kumbe
  rationale: Ni kiashiria hai cha simulizi kinachovuta fikira kwenye tukio la kushtua, bila kuligeuza kuwa kauli ya kuona ambayo haijasemwa moja kwa moja.
- source_word: הָאִשָּׁה פִילַגְשׁוֹ
  choice: yule mwanamke, suria wake
  rationale: Huhifadhi muundo wa ufafanuzi wa Kiebrania na kutafsiri פִילֶגֶשׁ kwa neno mahususi la Kiswahili ‘suria.’
- source_word: נֹפֶלֶת
  choice: alikuwa ameanguka
  rationale: Huhifadhi hali inayotokana na kuanguka iliyo katika kitenzi-shirikishi, bila kuongeza kwamba alikuwa amekufa au amelala usingizi.
- source_word: פֶּתַח הַבַּיִת
  choice: penye mwingilio wa nyumba
  rationale: Hutoa maana ya eneo la kuingilia nyumba kwa Kiswahili cha kawaida na sahihi.
- source_word: וְיָדֶיהָ עַל הַסַּף
  choice: mikono yake ikiwa juu ya kizingiti
  rationale: Huhifadhi picha dhahiri ya kishazi kisicho na kitenzi na kutafsiri סַף kwa ‘kizingiti.’
theological_decisions:
- issue: Hali ya mwanamke haijaelezwa wazi kuwa kifo katika mstari huu
  choice: alikuwa ameanguka
  alternative: alikuwa amekufa
  rationale: Kiebrania נֹפֶלֶת kinaeleza hali au mkao wake, lakini mstari huu wenyewe hautamki wazi kifo; tafsiri haipaswi kutanguliza hitimisho hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Suria’ limetumiwa kwa usahihi wa kihistoria; ‘Kumbe’ huhifadhi mshtuko wa kiashiria cha simulizi. Alama ya tanbihi [a] imewekwa moja kwa moja baada ya kirai kinachohusika.
