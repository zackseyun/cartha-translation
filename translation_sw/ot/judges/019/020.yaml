base_translation:
  language: en
  yaml_path: translation/ot/judges/019/020.yaml
  text: The old man said[a], “Peace be to you. Only let all your needs be my responsibility; only do not spend the night in the open square.”
translation:
  language: sw
  text: Yule mzee akasema, “Amani iwe kwako. Mahitaji yako yote ni jukumu langu; lakini usikeshe katika uwanja wa wazi wa mji[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “barabarani.” Neno la Kiebrania linamaanisha hasa eneo la wazi la umma au uwanja uliokuwa ndani ya mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ הַזָּקֵן
  choice: Yule mzee
  rationale: Katika simulizi, Kiswahili hutumia kwa kawaida ‘yule mzee’ kumrejelea mwanamume mzee ambaye tayari ametajwa; tafsiri hii ni ya asili bila kuwa ya kitabibu kama ‘mwanamume mwenye umri mkubwa.’
- source_word: שָׁלוֹם לָךְ
  choice: Amani iwe kwako
  rationale: Huhifadhi neno ‘amani’ na pia dhima ya msemo huu kama salamu au uhakikisho wa usalama.
- source_word: רַק
  choice: ila
  rationale: Chembe hii huweka mpaka au msisitizo. ‘Ila’ katika ombi la mwisho ni ya kawaida na inaonyesha sharti kuu la mwenyeji; maana ya tukio la kwanza pia inabebwa na kauli inayoweka mahitaji yote chini ya jukumu lake.
- source_word: כָּל מַחְסוֹרְךָ
  choice: mahitaji yako yote
  rationale: Ni tafsiri ya kawaida ya Kiswahili kwa vitu vyote ambavyo msafiri anakosa au anahitaji.
- source_word: עָלַי
  choice: ni jukumu langu
  rationale: Kirai hicho kwa maana halisi ni ‘juu yangu,’ lakini hapa ni nahau ya kuchukua wajibu wa kutoa mahitaji; ‘ni jukumu langu’ hutoa maana hiyo kwa uwazi.
- source_word: בָּרְחוֹב
  choice: katika uwanja wa mji
  rationale: רְחוֹב hapa ni eneo la wazi la umma ndani ya mji, si lazima barabara ya kupitia magari; ‘uwanja wa mji’ huonyesha mazingira hayo.
- source_word: אַל תָּלַן
  choice: usilale usiku
  rationale: Kitenzi לון humaanisha kukaa au kulala mahali usiku. Usemi huu ni wazi na wa kawaida katika Kiswahili.
