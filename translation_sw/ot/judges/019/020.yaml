translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa kawaida na wenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa sasa, huku ukihifadhi salamu ya ‘amani’ na wajibu wa ukarimu wa mzee.
