  yaml_path: translation/ot/judges/019/015.yaml
  text: They turned aside there to go in and spend the night at Gibeah[a]. He went in and sat down in the open square of the city[b], and there was no man gathering them into his house to spend the night.
translation:
  language: sw
  text: Wakapinda kuelekea Gibea ili waingie na kulala huko usiku. Akaingia, akaketi katika uwanja wa mji[a], na hakuna mtu aliyewapokea nyumbani mwake ili walale usiku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika barabara pana ya mji”; neno la Kiebrania linaweza kumaanisha eneo pana la umma au uwanja.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “hakuna mwanamume aliyewakusanya na kuwaingiza ndani ya nyumba yake”; maana yake ni kwamba hakuna mkazi aliyewakaribisha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֻרוּ
  choice: wakageuka huko
  rationale: Kitenzi סור katika muktadha wa safari kinaonyesha kuiacha njia au kugeuka kuelekea mahali fulani, si kusimama tu.
- source_word: לָבוֹא
  choice: ili waingie
  rationale: בוא ina maana ya kuingia; umbo la wingi linaendeleza tendo la kundi la wasafiri.
- source_word: לָלוּן
  choice: kulala usiku
  rationale: לון humaanisha kukaa mahali usiku kucha; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: בַּגִּבְעָה
  choice: huko Gibea
  rationale: Jina la mahali limetoholewa kuwa Gibea, na 'huko' linaendana kiasili na mwendo wa wasafiri kuelekea mji huo.
- source_word: וַיָּבֹא
  choice: Akaingia
  rationale: Kitenzi kinabadilika kutoka wingi kwenda umoja, kikimrejelea msafiri mkuu kama mwakilishi wa kundi.
- source_word: וַיֵּשֶׁב
  choice: na kuketi
  rationale: ישב hapa huonyesha kuketi katika eneo la wazi baada ya kuingia mjini.
- source_word: בִּרְחוֹב הָעִיר
  choice: katika uwanja wa mji
  rationale: רְחוֹב inaweza kumaanisha eneo pana la wazi la umma au uwanja, wala si lazima barabara nyembamba.
- source_word: וְאֵין אִישׁ
  choice: lakini hakuna mtu
  rationale: Ingawa אִישׁ kwa umbo ni 'mwanamume,' katika muktadha huu maana yake ni kwamba hakuna mkazi yeyote aliyewapa ukarimu; 'mtu' ni Kiswahili cha kawaida kisichopoteza maana hiyo.
- source_word: מְאַסֵּף אוֹתָם
  choice: aliyewakaribisha
  rationale: אסף kihalisi ni kukusanya au kuingiza ndani; katika muktadha wa ukarimu, 'kuwakaribisha' huwasilisha tendo la kuwapokea wasafiri chini ya paa la mwenyeji.
- source_word: הַבַּיְתָה
  choice: nyumbani mwake
  rationale: Kiambishi elekezi -ה kinaonyesha mwendo wa kuelekea ndani ya nyumba; 'mwake' linaeleza kwa kawaida nyumba ya mwenyeji anayetarajiwa bila kuongeza mhusika mpya.
