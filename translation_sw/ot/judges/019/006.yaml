base_translation:
  language: en
  yaml_path: translation/ot/judges/019/006.yaml
  text: So the two of them sat down together and ate and drank. Then the young woman's father said to the man[a], "Please, be willing to stay the night, and let your heart be glad."
translation:
  language: sw
  text: Basi hao wawili wakaketi, wakala na kunywa pamoja. Kisha baba ya yule msichana akamwambia yule mwanamume, “Tafadhali, kubali[a] kukaa usiku huu, na moyo wako ufurahi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tafadhali, kubali kulala usiku huu, na moyo wako uchangamke.”
    reason: Mbadala wa kileksia wa הוֹאֶל נָא וְלִין na wa usemi וְיִטַב לִבֶּךָ.
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: wakaketi
  rationale: Kitenzi ישׁב katika mfululizo huu wa masimulizi kinatambulisha kuketi kwa ajili ya chakula; “wakaketi” ni ya kawaida na haiongezi wazo la kubaki.
- source_word: וַיֹּאכְלוּ
  choice: wakala
  rationale: Tafsiri ya moja kwa moja ya אכל katika mfululizo wa masimulizi.
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: hao wawili ... pamoja
  rationale: Inahifadhi msisitizo wa kwamba wote wawili walifanya hivyo pamoja kwa Kiswahili cha kawaida.
- source_word: וַיִּשְׁתּוּ
  choice: kunywa
  rationale: Tafsiri ya moja kwa moja ya שתה; kitu walichokunywa hakijatajwa, kwa hiyo hakijaongezwa.
- source_word: אֲבִי הַנַּעֲרָה
  choice: baba ya yule mwanamke kijana
  rationale: נַעֲרָה humaanisha mwanamke wa umri mdogo; “mwanamke kijana” ni yenye heshima na inafaa katika muktadha kuliko “msichana”.
- source_word: הָאִישׁ
  choice: yule mwanamume
  rationale: Ingawa muktadha mpana unamtambulisha zaidi, Kiebrania hapa kinasema tu “mwanamume,” hivyo tafsiri haiongezi cheo au uhusiano.
- source_word: הוֹאֶל נָא
  choice: Tafadhali, kubali
  rationale: הוֹאֶל huonyesha kuwa tayari au kukubali, na נָא huifanya kuwa ombi la adabu; “Tafadhali, kubali” ni ya asili katika Kiswahili.
- source_word: וְלִין
  choice: ulale hapa usiku huu
  rationale: לון humaanisha kukaa au kulala mahali usiku; usemi huu unaeleweka kwa urahisi na unaonyesha wazi kukaa hadi asubuhi bila kutumia lugha nzito.
- source_word: וְיִטַב לִבֶּךָ
  choice: na moyo wako ufurahi
  rationale: Usemi huo kwa karibu ni kwamba moyo uwe mzuri au wenye kupendeza; tafsiri hii inadumisha taswira ya moyo na maana ya kufurahia ukarimu.
