base_translation:
  language: en
  yaml_path: translation/ot/judges/019/025.yaml
  text: But the men were not willing to listen to him[a], so the man seized his concubine and brought her out to them. And they knew her and abused her all night until morning, and they let her go at the dawn.
translation:
  language: sw
  text: Lakini wale wanaume hawakutaka kumsikiliza. Basi yule mtu akamshika suria wake kwa nguvu na kumtoa nje kwao. Wakamjua[a] na kumtendea ukatili usiku kucha mpaka asubuhi, kisha wakamwacha aende kulipopambazuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “wakamjua,” ni sitiari ya kufanya ngono; katika muktadha huu ni tendo la kingono la kulazimishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוּ ... לִשְׁמֹעַ לוֹ
  choice: hawakutaka kumsikiliza
  rationale: Inaendeleza wazo la kutokuwa tayari au kutokubali lililo katika אָבָה, huku ‘kumsikiliza’ likihifadhi maana ya kukataa ombi lake bila kulifanya moja kwa moja kuwa suala la utii.
- source_word: וַיַּחֲזֵק
  choice: akamshika ... kwa nguvu
  rationale: Huwasilisha kitendo cha kumkamata kwa nguvu, bila kutumia neno linaloweza kudokeza tu kushika kwa kawaida.
- source_word: פִּילַגְשׁוֹ
  choice: suria wake
  rationale: ‘Suria’ ndilo neno la Kiswahili linalotambulika kwa mwanamke aliyekuwa na hadhi ya mke wa daraja la pili katika mazingira haya ya kale.
- source_word: וַיֹּצֵא אֲלֵיהֶם הַחוּץ
  choice: na kumtoa nje kwao
  rationale: Huwakilisha hali sababishi ya kitenzi—alimfanya atoke—pamoja na הַחוּץ, ‘nje,’ kwa Kiswahili cha kawaida.
- source_word: וַיֵּדְעוּ אוֹתָהּ
  choice: wakambaka[a]
  rationale: Kiebrania kimetumia sitiari ya ‘kujua’ kwa tendo la ngono. Katika muktadha huu wa kushikwa kwa nguvu, kutolewa kwa kundi la wanaume, na kutendewa ukatili usiku kucha, Kiswahili ‘wakambaka’ huwasilisha wazi kuwa tendo hilo halikuwa la hiari; tanbihi huhifadhi umbo la sitiari ya chanzo.
- source_word: וַיִּתְעַלְּלוּ בָהּ
  choice: na kumtendea ukatili
  rationale: Hutoa maana pana ya kumtesa, kumdhalilisha, na kumfanyia mabaya, bila kupunguza ukali wa kitendo.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: usiku kucha mpaka asubuhi
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi muda wote na mpaka wa wakati uliotajwa.
- source_word: וַיְשַׁלְּחוּהָ
  choice: wakamwacha aende
  rationale: Katika muktadha huu שׁלח ina maana ya kumwachilia au kumruhusu aondoke, na usemi huu ni wa kawaida katika Kiswahili.
- source_word: בַּעֲלוֹת הַשָּׁחַר
  choice: kulipopambazuka
  rationale: Huwasilisha kwa asili taswira ya ‘kupanda kwa mapambazuko,’ yaani alfajiri ilipoanza.
