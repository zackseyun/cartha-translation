  text: וַ/יֹּ֧אמֶר אֵלֶ֛י/הָ ק֥וּמִי וְ/נֵלֵ֖כָה וְ/אֵ֣ין עֹנֶ֑ה וַ/יִּקָּחֶ֨/הָ֙ עַֽל הַ/חֲמ֔וֹר וַ/יָּ֣קָם הָ/אִ֔ישׁ וַ/יֵּ֖לֶךְ לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/028.yaml
  text: He said to her[a], “Get up, and let us go.” But there was no answer. Then he put her on the donkey[c][b], and the man rose and went to his place.
translation:
  language: sw
  text: Akamwambia, “Inuka, twende.” Lakini hapakuwa na jibu[a]. Kisha akamchukua na kumweka juu ya punda[b]. Yule mtu akainuka, akaenda mahali pake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “hapakuwa na anayejibu” au “hapakuwa na mtu anayejibu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Kisha akamchukua juu ya punda.” Kitenzi cha Kiebrania kihalisi ni “chukua”; hapa kinaeleweka kwa maana ya kumweka au kumnyanyua juu ya mnyama.
    reason: lexical_alternative
  - marker: c
    text: 'Au, “akaenda nyumbani kwake.” Kiebrania: “mahali pake.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: Akamwambia
  rationale: Muundo huu ni wa kawaida katika masimulizi ya Kiswahili na unaonyesha wazi kwamba alisema naye, bila kulazimika kutafsiri kiunganishi cha mwanzo kwa neno tofauti.
- source_word: קוּמִי
  choice: Inuka
  rationale: Ni amri ya nafsi ya pili umoja kwa mwanamke, na “Inuka” ni ya kawaida, wazi, na yenye hadhi katika Kiswahili cha sasa.
- source_word: וְנֵלֵכָה
  choice: twende
  rationale: Huhifadhi maana ya uhamasishaji au azimio la pamoja iliyo katika cohortative ya Kiebrania.
- source_word: וְאֵין עֹנֶה
  choice: Lakini hapakuwa na jibu
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kutokuwapo kwa mwitikio, huku ikihifadhi hali ya kutotaja moja kwa moja sababu ya ukimya huo.
- source_word: וַיִּקָּחֶהָ עַל הַחֲמוֹר
  choice: Kisha akamchukua na kumweka juu ya punda
  rationale: Kitenzi לקח kimsingi ni “chukua,” lakini pamoja na עַל הַחֲמוֹר muktadha unaonyesha kumweka juu ya mnyama. Tafsiri hii inaweka wazi tendo bila kudokeza kwamba mwanamke alipanda kwa nguvu zake mwenyewe.
- source_word: וַיָּקָם הָאִישׁ
  choice: Yule mtu akainuka
  rationale: Hutofautisha tendo la kuinuka na tendo linalofuata la kwenda, kama ilivyo katika Kiebrania.
- source_word: וַיֵּלֶךְ לִמְקֹמוֹ
  choice: akaenda mahali pake
  rationale: “Mahali pake” hudumisha upana wa maana ya מָקוֹם; katika muktadha huenda ikamaanisha nyumbani kwake, lakini chanzo hakitumii neno mahsusi la “nyumbani.”
theological_decisions:
- issue: Hali ya mwanamke wakati hakujibu
  choice: Haijaelezwa moja kwa moja katika aya hii; imetafsiriwa “hapakuwa na jibu.”
  alternative: “Lakini alikuwa amekufa” au kauli nyingine inayotaja sababu ya kutokujibu.
  rationale: Kiebrania cha aya hii kinasema tu kwamba hakukuwa na anayejibu/jibu. Tafsiri haipaswi kutatua kimyakimya sintofahamu hiyo kwa kuingiza maelezo ambayo hayamo wazi katika aya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi ulio wazi na wa hadhi. Lugha imeepuka msamiati wa kizamani na pia imehifadhi ukali na sintofahamu ya simulizi bila kuongeza maelezo ya kiitikadi.
