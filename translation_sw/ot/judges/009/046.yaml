base_translation:
  language: en
  yaml_path: translation/ot/judges/009/046.yaml
  text: When all the leaders of the tower of Shechem heard it[c][b][a], they went into the inner chamber of the house of El-berith.
translation:
  language: sw
  text: Wakuu wote wa mnara wa Shekemu[a] waliposikia hayo, wakaingia katika chumba cha ndani[b] cha nyumba ya El-Berithi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Migdal-Shekemu,” ikiwa maneno haya yanachukuliwa kuwa jina la mahali badala ya “mnara wa Shekemu.”
    reason: alternative_reading
  - marker: b
    text: Neno la Kiebrania linaweza pia kutafsiriwa “kuba,” “ngome,” au “chumba cha ndani kilicholindwa.”
    reason: lexical_alternative
  - marker: c
    text: El-Berithi huenda likamaanisha “Mungu wa agano.” Linganisha na jina linalohusiana, “Baal-Berithi,” mahali pengine katika sura hii.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: waliposikia hayo
  rationale: Kitenzi humaanisha ‘kusikia.’ Kiwakilishi ‘hayo’ kinarejelea kwa kawaida habari ya matukio yaliyotangulia bila kuongeza maelezo yasiyomo katika chanzo.
- source_word: בַּעֲלֵי
  choice: wakuu
  rationale: Ingawa neno linaweza kumaanisha ‘mabwana,’ ‘wenye,’ au ‘wamiliki,’ hapa linaonyesha watu wenye mamlaka au hadhi katika jumuiya ya Mnara wa Shekemu.
- source_word: מִגְדַּל שְׁכֶם
  choice: mnara wa Shekemu
  rationale: מִגְדַּל maana yake ya moja kwa moja ni ‘mnara.’ Tafsiri hii ni wazi, huku uwezekano wa kuwa jina la mahali ukihifadhiwa katika tanbihi.
- source_word: וַיָּבֹאוּ אֶל
  choice: wakaingia katika
  rationale: Katika muktadha huu, mwendo unaelekea ndani ya mahali pa kujikinga; ‘wakaingia katika’ ni Kiswahili cha kawaida kinachoonyesha mwelekeo huo.
- source_word: צְרִיחַ
  choice: chumba cha ndani
  rationale: Neno hilo adimu linaweza kutaja chumba cha ndani kilicholindwa, kuba, au ngome. ‘Chumba cha ndani’ hakilazimishi kwa kupita kiasi aina fulani ya ujenzi.
- source_word: בֵּית אֵל בְּרִית
  choice: nyumba ya El-Berithi
  rationale: בֵּית ni ‘nyumba’ na katika muktadha wa ibada inaweza kuwa hekalu. Kutafsiri jina kwa matamshi kama ‘El-Berithi’ kunahifadhi uwezekano kwamba ni jina au cheo cha mungu badala ya kuamua maana yake kimyakimya.
theological_decisions:
- issue: Jinsi ya kutafsiri jina au cheo cha mahali pa ibada אֵל בְּרִית
  choice: El-Berithi
  alternative: Mungu wa agano; Baal-Berithi
  rationale: Kutumia umbo la jina kunahifadhi utata wa kama אֵל בְּרִית ni jina maalumu au cheo chenye maana ya ‘Mungu wa agano.’ Pia huepuka kulisawazisha bila ushahidi wa moja kwa moja na ‘Baal-Berithi’ katika sehemu nyingine za sura.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. ‘Wakuu’ huepuka maana finyu ya umiliki, na ‘chumba cha ndani’ huhifadhi kutokuwa na uhakika kuhusu muundo wa eneo hilo.
