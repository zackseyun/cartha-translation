  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa na wenye heshima. “Basi” linaunganisha mstari na tukio lililotangulia; majina yametoholewa kuwa Gaali, Shekemu, na Abimeleki.
