  text: So Gaal went out before the leaders of Shechem and fought against Abimelech[a].
translation:
  language: sw
  text: Basi Gaali akatoka akiwa mbele ya viongozi wa Shekemu[a], akapigana na Abimeleki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwaongoza viongozi wa Shekemu.” Kihusishi לִפְנֵי kinaweza kuonyesha kuwa mbele ya watu au, katika muktadha huu wa kijeshi, nafasi ya uongozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Qal wayyiqtol ya יצא ni kitenzi cha kawaida katika simulizi kinachomaanisha kutoka; “akatoka” ni Kiswahili cha asili na hudumisha mfuatano wa matukio.
- source_word: גַעַל
  choice: Gaali
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Huhifadhi maana ya msingi ya kihusishi, yaani kuwa mbele ya wengine, huku muktadha ukiruhusu pia wazo la kuwaongoza.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: viongozi wa Shekemu
  rationale: בעלים hapa inawahusu wenye mamlaka au watu wakuu wa mji; “viongozi” huwasilisha maana hiyo ya kiraia na kisiasa kwa lugha ya sasa.
- source_word: וַיִּלָּחֶם
  choice: akapigana
  rationale: Niphal wayyiqtol ya לחם ina maana ya kupigana au kuingia vitani; “akapigana” ni fupi na ya kawaida katika simulizi.
- source_word: בַּאֲבִימֶלֶךְ
  choice: na Abimeleki
  rationale: Baada ya kitenzi “kupigana,” Kiswahili hutumia “na” kumtaja mpinzani; muktadha unaonyesha wazi kuwa Abimeleki ndiye adui, si mshirika.
