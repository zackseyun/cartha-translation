source:
  edition: WLC
  text: וַ/יַּ֨עַל אֲבִימֶ֜לֶךְ הַר צַלְמ֗וֹן הוּא֮ וְ/כָל הָ/עָ֣ם אֲשֶׁר אִתּ/וֹ֒ וַ/יִּקַּח֩ אֲבִימֶ֨לֶךְ אֶת הַ/קַּרְדֻּמּ֜וֹת בְּ/יָד֗/וֹ וַ/יִּכְרֹת֙ שׂוֹכַ֣ת עֵצִ֔ים וַ/יִּ֨שָּׂאֶ֔/הָ וַ/יָּ֖שֶׂם עַל שִׁכְמ֑/וֹ וַ/יֹּ֜אמֶר אֶל הָ/עָ֣ם אֲשֶׁר עִמּ֗/וֹ מָ֤ה רְאִיתֶם֙ עָשִׂ֔יתִי מַהֲר֖וּ עֲשׂ֥וּ כָמֽוֹ/נִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/048.yaml
  text: Then Abimelek went up Mount Zalmon[a], he and all the people who were with him. Abimelek took the axes in his hand, cut down a bundle of branches, lifted it, and put it on his shoulder. Then he said to the people who were with him, “What you have seen me do, hurry and do as I have done.”
translation:
  language: sw
  text: Kisha Abimeleki akapanda Mlima Salmoni, yeye pamoja na watu wote waliokuwa pamoja naye. Abimeleki akachukua mashoka mkononi mwake, akakata fungu la matawi ya miti[a], akaliinua na kuliweka begani mwake. Kisha akawaambia watu waliokuwa pamoja naye, “Mlichoniona nikifanya, fanyeni haraka kama nilivyofanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tawi kubwa la mti,” “kichaka cha miti,” au “fungu la vichaka vya kuni.” Neno la Kiebrania ni adimu na linamaanisha mkusanyiko wa matawi au vichaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה katika simulizi humaanisha kupanda au kwenda juu; “akapanda” ni Kiswahili cha kawaida kinachohifadhi mwelekeo wa mwendo.
- source_word: הַר צַלְמוֹן
  choice: Mlima Salmoni
  rationale: Muundo wa הַר pamoja na jina maalumu umetafsiriwa kwa namna ya kawaida ya Kiswahili; jina צַלְמוֹן limetoholewa kuwa “Salmoni.”
- source_word: הוּא וְכָל־הָעָם אֲשֶׁר אִתּוֹ
  choice: yeye pamoja na watu wote waliokuwa pamoja naye
  rationale: Neno עָם ni “watu”; ingawa huenda walikuwa wapiganaji, Kiebrania hakisemi hivyo wazi. “Yeye” limehifadhiwa kwa ajili ya msisitizo wa chanzo.
- source_word: הַקַּרְדֻּמּוֹת בְּיָדוֹ
  choice: mashoka mkononi mwake
  rationale: Nomino ya Kiebrania iko katika wingi, kwa hiyo “mashoka” huhifadhi umbo hilo; “mkononi mwake” huonyesha kwamba aliyachukua mwenyewe.
- source_word: וַיִּכְרֹת שׂוֹכַת עֵצִים
  choice: akakata fungu la matawi ya miti
  rationale: שׂוֹכַת ni neno adimu linaloweza kumaanisha mkusanyiko wa matawi, tawi kubwa lenye matawi mengi, au kichaka. Muktadha unaonyesha kitu cha kubebeka begani, hivyo “fungu la matawi ya miti” ni wazi bila kulibana neno kupita kiasi.
- source_word: וַיִּשָּׂאֶהָ וַיָּשֶׂם עַל שִׁכְמוֹ
  choice: akaliinua na kuliweka begani mwake
  rationale: 'Tafsiri hii huhifadhi mfuatano wa vitendo: kwanza aliliinua, kisha akaliweka begani.'
- source_word: מָה רְאִיתֶם עָשִׂיתִי
  choice: Mlichoniona nikifanya
  rationale: Kauli ya Kiebrania imebanwa kisarufi; muundo huu ni wa asili katika Kiswahili na huonyesha kwamba watu walipaswa kuiga tendo walilomwona akifanya.
- source_word: מַהֲרוּ עֲשׂוּ כָמוֹנִי
  choice: fanyeni haraka kama nilivyofanya
  rationale: “Fanyeni haraka” huhifadhi amri ya wingi na uharaka; “kama nilivyofanya” huweka wazi kwamba waige tendo lake lililotangulia.
