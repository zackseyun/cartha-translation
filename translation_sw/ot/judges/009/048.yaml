translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Kiambishi cha tanakali “aka-” kimetumiwa kuonyesha mfuatano wa haraka wa matendo. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, yaani “fungu la matawi ya miti,” badala ya baada ya jina la mlima.
