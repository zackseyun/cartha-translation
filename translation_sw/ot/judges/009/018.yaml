  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אַתֶּ֞ם קַמְתֶּ֨ם עַל בֵּ֤ית אָבִ/י֙ הַ/יּ֔וֹם וַ/תַּהַרְג֧וּ אֶת בָּנָ֛י/ו שִׁבְעִ֥ים אִ֖ישׁ עַל אֶ֣בֶן אֶחָ֑ת וַ/תַּמְלִ֜יכוּ אֶת אֲבִימֶ֤לֶךְ בֶּן אֲמָת/וֹ֙ עַל בַּעֲלֵ֣י שְׁכֶ֔ם כִּ֥י אֲחִי/כֶ֖ם הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/018.yaml
  text: But you have risen up against my father's house today[a], and you killed his sons, seventy men, on one stone, and you made Abimelek, the son of his female servant, king over the leaders of Shechem, because he is your brother.
translation:
  language: sw
  text: Lakini ninyi mmeinuka dhidi ya nyumba ya baba yangu leo, mkawaua wanawe, wanaume sabini, juu ya jiwe moja, na mkamweka Abimeleki, mwana wa mjakazi wake[a], kuwa mfalme juu ya viongozi wa Shekemu, kwa sababu yeye ni ndugu yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwana wa mwanamke mtumwa wake”; kwa tafsiri inayofafanua zaidi, “mwana wa suria wake.” Kiebrania kinasema “mwana wa mjakazi wake.”
    reason: Neno אֲמָה linaweza kueleza mtumishi wa kike au mwanamke mtumwa, ilhali “suria” ni ufafanuzi unaotegemea muktadha mpana.
lexical_decisions:
- source_word: קַמְתֶּם עַל
  choice: mmeinuka dhidi ya
  rationale: Nahau hii huonyesha kusimama kwa uhasama au kuchukua hatua dhidi ya mtu. Tafsiri hii inahifadhi picha ya Kiebrania na nguvu ya shtaka.
- source_word: בֵּית אָבִי
  choice: nyumba ya baba yangu
  rationale: “Nyumba” hapa inamaanisha pia jamaa au ukoo wa baba, si jengo tu; usemi huu unadumisha maana hiyo ya kifamilia na kiukoo.
- source_word: וַתַּהַרְגוּ
  choice: mkawaua
  rationale: Kitenzi cha Kiebrania kinasema kuua bila kutaja moja kwa moja hukumu maalumu ya kisheria kama “kuwaua kwa mauaji ya kukusudia.”
- source_word: שִׁבְעִים אִישׁ
  choice: wanaume sabini
  rationale: אִישׁ katika hesabu hii inarejelea wanaume, na muktadha unaonyesha wana wa kiume wa Yerubaali.
- source_word: עַל אֶבֶן אֶחָת
  choice: juu ya jiwe moja
  rationale: Tafsiri ya moja kwa moja inadumisha taswira kali ya mahali au kifaa kilichotumiwa katika mauaji hayo.
- source_word: וַתַּמְלִיכוּ
  choice: mkamweka ... kuwa mfalme
  rationale: Hifili ya מלך ina maana ya kumsababisha mtu awe mfalme; usemi huu ni wa kawaida na unaonyesha kitendo hicho cha kumtawaza au kumweka atawale.
- source_word: בֶּן אֲמָתוֹ
  choice: mwana wa mjakazi wake
  rationale: אָמָה humaanisha mtumishi wa kike au mwanamke mtumwa. “Mjakazi” ni kifupi, chenye heshima ya lugha, na hakiongezi maana maalumu ya “suria” ambayo haimo wazi katika nomino yenyewe.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: viongozi wa Shekemu
  rationale: Katika muktadha huu wa kisiasa, neno hilo linaelekea kuwataja wenye mamlaka au watu mashuhuri wa mji, si wakazi wote bila ubaguzi.
- source_word: כִּי אֲחִיכֶם הוּא
  choice: kwa sababu yeye ni ndugu yenu
  rationale: כִּי inatoa sababu ya tendo lao, huku maneno ya Yothamu yakibeba shtaka lenye kejeli.
theological_decisions:
- issue: Hadhi ya kijamii ya mama ya Abimeleki katika אֲמָתוֹ
  choice: mjakazi wake
  alternative: mwanamke mtumwa wake; suria wake
  rationale: Neno la Kiebrania lenyewe humaanisha mtumishi wa kike au mwanamke mtumwa na linatumika kwa namna inayoshusha hadhi ya ukoo wa upande wa mama wa Abimeleki. “Suria” huenda ikafaa kutokana na muktadha mpana, lakini ni tafsiri ya kimuktadha iliyo maalumu zaidi kuliko neno lenyewe; kwa hiyo imewekwa katika tanbihi badala ya matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa lakini wenye hadhi. Muundo wa shtaka na marudio ya “ninyi” yanadumishwa kwa viambishi vya nafsi ya pili wingi. “Nyumba ya baba yangu” imeachwa ili kuhifadhi taswira ya Kiebrania na maana yake ya jamaa au ukoo. Alama ya tanbihi imewekwa baada ya “mjakazi wake,” mahali panapohusika moja kwa moja na tanbihi.
