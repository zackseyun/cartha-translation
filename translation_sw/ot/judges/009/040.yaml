  yaml_path: translation/ot/judges/009/040.yaml
  text: Abimelech pursued him[a], and he fled before him; and many slain fell as far as the entrance of the gate.
translation:
  language: sw
  text: Abimeleki akamfukuza, naye akakimbia mbele yake; watu wengi wakauawa hadi kwenye ingilio la lango.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wengi waliouawa wakaanguka hadi kwenye ingilio la lango.” Kiebrania hutumia taswira ya vita ya “walioanguka” pamoja na “walioauawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפֵהוּ
  choice: akamfuatilia
  rationale: Kitenzi רדף humaanisha kumfuata au kumwandama adui. “Akamfuatilia” ni Kiswahili cha kawaida kinachohifadhi maana ya kum追 mtu katika mapigano.
- source_word: וַיָּנָס מִפָּנָיו
  choice: naye akamkimbia
  rationale: נוס ni kukimbia, na מִפָּנָיו katika muktadha huu humaanisha kukimbia mbele ya mtu au kumkimbia. “Akamkimbia” ni usemi wa asili wa Kiswahili na hauleti dhana isiyokusudiwa ya kukimbia akiwa mbele yake.
- source_word: וַיִּפְּלוּ חֲלָלִים רַבִּים
  choice: watu wengi waliouawa wakaanguka
  rationale: נפל ni “kuanguka,” huku חֲלָלִים ikitaja waliopigwa au kuuawa vitani. Tafsiri hii inadumisha taswira dhahiri ya Kiebrania, ingawa Kiswahili kingeweza kuieleza kwa urahisi zaidi kuwa watu wengi waliuawa.
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: mpaka kwenye ingilio la lango
  rationale: עַד huonyesha mpaka uliofikiwa, פתח ni ingilio au uwazi, na שער ni lango. Kauli hii inafuata muundo wa chanzo huku ikiwa wazi kwa msomaji wa Kiswahili.
