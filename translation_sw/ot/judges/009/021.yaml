  yaml_path: translation/ot/judges/009/021.yaml
  text: Then Jotham fled and escaped and went to Beer[a], and he lived there away from Abimelech his brother.
translation:
  language: sw
  text: Ndipo Yothamu akakimbia, akatoroka, akaenda Beera[a], akakaa huko mbali na Abimeleki ndugu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Beer.” Jina la mahali la Kiebrania בְּאֵרָה linaweza kuandikwa “Beera” au “Beer.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס
  choice: akakimbia
  rationale: Kitenzi נוס kinaonyesha kukimbia hatari; “akakimbia” ni lugha ya kawaida na hudumisha mwendo wa simulizi.
- source_word: וַיִּבְרַח
  choice: akatoroka
  rationale: Kitenzi ברח kina maana inayokaribiana na נוס. Kutumia “akatoroka” baada ya “akakimbia” kunahifadhi urudiaji wa makusudi bila kurudia neno lilelile.
- source_word: בְּאֵרָה
  choice: Beeri
  rationale: Jina la mahali בְּאֵר limeandikwa kwa namna inayolingana na matamshi na tahajia ya Kiswahili; ה ya mwisho inaweza kueleweka kama kiambishi cha kuelekea mahali, si lazima sehemu ya jina.
- source_word: וַיֵּשֶׁב שָׁם
  choice: akakaa huko
  rationale: ישב hapa inaweza kumaanisha kukaa, kubaki, au kuishi mahali. “Akakaa huko” ni ya asili katika simulizi na haibainishi bila lazima kama makazi hayo yalikuwa ya kudumu.
- source_word: מִפְּנֵי
  choice: mbali na
  rationale: Kirai hiki kwa msingi ni “kutoka mbele/uweponi pa.” Katika muktadha kinaonyesha kwamba Yothamu alikaa pasipofikiwa na Abimeleki; “mbali na” huhifadhi wazo hilo bila kuongeza wazi kwamba sababu ilikuwa hofu.
- source_word: אָחִיו
  choice: ndugu yake
  rationale: Neno la uhusiano wa kifamilia limehifadhiwa wazi kama katika Kiebrania, likisisitiza mvutano wa tukio.
