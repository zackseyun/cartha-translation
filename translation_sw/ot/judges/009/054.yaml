source:
  edition: WLC
  text: וַ/יִּקְרָ֨א מְהֵרָ֜ה אֶל הַ/נַּ֣עַר נֹשֵׂ֣א כֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ שְׁלֹ֤ף חַרְבְּ/ךָ֙ וּ/מ֣וֹתְתֵ֔/נִי פֶּן יֹ֥אמְרוּ לִ֖/י אִשָּׁ֣ה הֲרָגָ֑תְ/הוּ וַ/יִּדְקְרֵ֥/הוּ נַעֲר֖/וֹ וַ/יָּמֹֽת־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/054.yaml
  text: Then he quickly called to the young man who carried his weapons and said to him[a], “Draw your sword and kill me, lest they say of me, ‘A woman killed him.’” So his young man pierced him through, and he died.
translation:
  language: sw
  text: Kisha akamwita haraka kijana aliyekuwa akibeba silaha zake[a], akamwambia, “Chomoa upanga wako uniue, watu wasije wakasema kunihusu, ‘Mwanamke ndiye aliyemuua.’” Basi kijana wake akamchoma kwa upanga, naye akafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kawaida zaidi, “mbeba-silaha wake” badala ya “kijana aliyekuwa akibeba silaha zake” / “kijana wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא מְהֵרָה
  choice: akamwita haraka
  rationale: Muundo huu unaendeleza simulizi na kuhifadhi wazi maana ya kitendo kilichofanywa kwa haraka.
- source_word: הַנַּעַר
  choice: kijana
  rationale: Neno la Kiebrania kwa kawaida humaanisha kijana; hapa muktadha unaonyesha kuwa alikuwa mhudumu aliyebeba silaha za Abimeleki.
- source_word: נֹשֵׂא כֵלָיו
  choice: aliyekuwa akibeba silaha zake
  rationale: Hii inawasilisha kwa uwazi maana halisi ya mtu aliyebeba vifaa au silaha zake, bila kuanza na cheo cha kimuktadha.
- source_word: שְׁלֹף חַרְבְּךָ
  choice: Chomoa upanga wako
  rationale: ‘Chomoa’ ni kitenzi cha kawaida cha Kiswahili kwa kutoa upanga alani mwake.
- source_word: וּמוֹתְתֵנִי
  choice: uniue
  rationale: Katika muktadha huu, ombi ni la kusababisha kifo chake; ‘uniue’ ni la moja kwa moja na la asili.
- source_word: פֶּן יֹאמְרוּ לִי
  choice: watu wasije wakasema kunihusu
  rationale: פֶּן inaonyesha jambo linalotakiwa kuzuiwa. Ingawa לִי kihalisi inaweza kuwa ‘kwangu,’ hapa usemi unahusu yale yatakayosemwa kumhusu Abimeleki.
- source_word: אִשָּׁה הֲרָגָתְהוּ
  choice: ‘Mwanamke ndiye aliyemuua’
  rationale: Muundo wenye ‘ndiye’ unatanguliza na kusisitiza ‘mwanamke,’ kama ilivyo katika Kiebrania, na kuhifadhi uzito wa kijamii wa kauli hiyo.
- source_word: וַיִּדְקְרֵהוּ
  choice: akamchoma kwa upanga
  rationale: Kitenzi kinaonyesha kuchoma au kutoboa kwa silaha; usemi huu ni wa asili katika Kiswahili na unaonyesha chombo kilichotajwa katika amri.
- source_word: נַעֲרוֹ
  choice: kijana wake
  rationale: Hii inadumisha ulinganifu wa msamiati na הַנַּעַר iliyotangulia.
theological_decisions: []
