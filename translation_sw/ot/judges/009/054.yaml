  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Tafsiri inadumisha marudio ya ‘kijana’ huku tanbihi ikitoa cheo cha kimuktadha ‘mbeba-silaha.’
