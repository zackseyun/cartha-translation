base_translation:
  language: en
  yaml_path: translation/ot/judges/009/035.yaml
  text: Then Gaal son of Ebed went out and stood at the entrance of the city gate[b][a], and Abimelech and the people who were with him rose from the ambush.
translation:
  language: sw
  text: Ndipo Gaali mwana wa Ebedi akatoka[a] na kusimama penye lango la mji. Abimeleki na watu waliokuwa pamoja naye wakainuka kutoka maviziani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akatokea.” Kitenzi cha Kiebrania kinaonyesha mwendo wa kutoka.
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoka mahali pa kuvizia.” Nomino ya Kiebrania inaweza kumaanisha mavizio au mahali pa kuvizia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Kitenzi יצא kinaonyesha mwendo kuelekea nje bila kubainisha kwa lazima mtazamo wa mzungumzaji; “akatoka” ni simulizi la kawaida na la asili katika Kiswahili.
- source_word: גַּעַל בֶּן עֶבֶד
  choice: Gaali mwana wa Ebedi
  rationale: Majina yamenukuliwa kwa tahajia inayosomeka kwa Kiswahili, na muundo wa Kiebrania wa nasaba umehifadhiwa kwa “mwana wa.”
- source_word: וַיַּעֲמֹד
  choice: akasimama
  rationale: עמד humaanisha kwa kawaida kusimama; tafsiri hii haiongezi maana ya kijeshi ambayo haijaelezwa wazi.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: kwenye mwingilio wa lango la mji
  rationale: פתח ni mwingilio au uwazi, na שער העיר ni lango la mji; usemi huu unahifadhi uhusiano wa maneno hayo kwa Kiswahili cha kawaida.
- source_word: וַיָּקָם
  choice: wakainuka
  rationale: קום hapa inaonyesha Abimeleki na wenzake wakianza kuchukua hatua kutoka mafichoni; “wakainuka” huhifadhi taswira ya simulizi.
- source_word: וְהָעָם אֲשֶׁר אִתּוֹ
  choice: pamoja na watu waliokuwa naye
  rationale: עם kimsingi ni “watu.” Ingawa muktadha ni wa kijeshi, “watu waliokuwa naye” haibani maana kuwa askari pekee.
- source_word: מִן הַמַּאְרָב
  choice: kutoka mahali walipokuwa wamejificha ili kuvizia
  rationale: מארב inaweza kumaanisha kuvizia kwenyewe au mahali pa kuvizia. Kiswahili hiki kinaeleza kwa uwazi hali ya kujificha kwa kusudi la kuvizia, huku tanbihi ikihifadhi uwezekano wa tafsiri fupi.
