revisions:
- from: ili ukatili dhidi ya wana sabini wa Yerubaali upate kuwalipia[a], na damu yao iwe juu ya Abimeleki ndugu yao, aliyewaua, na juu ya viongozi wa Shekemu[b], waliouimarisha mkono wake[c] ili kuwaua ndugu zake.
  to: ili ukatili uliofanyiwa wana sabini wa Yerubaali uwajilie[a], na damu yao iwekwe juu ya Abimeleki, ndugu yao, aliyewaua, na juu ya viongozi wa Shekemu[b], waliouimarisha mkono wake[c] ili kuwaua ndugu zake.
  rationale: The revision corrects the semantic and valency problem created by “kuwalipia,” rendering the opening clause as the violent wrong coming upon the culpable parties. It also makes the passive action in the blood-responsibility idiom explicit, while preserving the Hebrew imagery and the ambiguity of the precise mode of retribution. The name forms, political designation, and hand-strengthening idiom are retained.
