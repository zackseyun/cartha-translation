review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately identifies the parties, their kinship, the leaders of Shechem, and their support for Abimelech. However, “upate kuwalipia” is not a faithful or idiomatic rendering of לָבוֹא חֲמַס: kuwalipia normally means paying on someone''s behalf, rather than the violent wrong coming upon or being requited against its perpetrators. The passive force of לָשׂוּם עַל should also be represented explicitly.'
  naturalness: The revised wording uses clear, standard East African Swahili while retaining the Hebrew judicial imagery. “Ukatili uliofanyiwa … uwajilie” naturally expresses the consequence of the outrage coming upon the responsible parties in this context. “Iwekwe juu ya” preserves the passive idiom more clearly than “iwe juu ya.”
  terminology: Yerubaali, Abimeleki, and Shekemu are suitable established Swahili forms. “Viongozi wa Shekemu” is a sound main-text rendering of בעלי שכם; the alternative “wenye mamlaka” is appropriately retained in a note. “Damu yao” preserves the source's blood-responsibility image without prematurely replacing it with “hatia.”
  issues:
  - severity: medium
    issue: “upate kuwalipia” mistranslates the opening purpose/result clause.
    rationale: The Hebrew says that the violent wrong done to Jerubbaal's seventy sons should “come” (in context, upon the responsible persons). The Swahili verb kulipia ordinarily means to pay for/on behalf of someone and can suggest that the victims are being compensated, which reverses or obscures the intended direction of retribution.
  - severity: low
    issue: “damu yao iwe juu ya” leaves the passive action of placing blood upon the guilty parties underexpressed.
    rationale: 'לָשׂוּם עַל is an infinitive passive construction in the purpose clause: their blood is to be placed upon Abimelech and the Shechemite leaders. “Iwekwe juu ya” renders this explicitly and naturally.'
