base_translation:
  language: en
  yaml_path: translation/ot/judges/009/024.yaml
  text: so that the violence done to the seventy sons of Jerubbaal might come[a], and their blood be laid on Abimelech their brother, who killed them, and on the leaders of Shechem[c][b], who strengthened his hands to kill his brothers.
translation:
  language: sw
  text: ili ukatili uliofanyiwa wana sabini wa Yerubaali uwajilie[a], na damu yao iwekwe juu ya Abimeleki, ndugu yao, aliyewaua, na juu ya viongozi wa Shekemu[b], waliouimarisha mkono wake[c] ili kuwaua ndugu zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, ukatili huo uwafikie wale waliowajibika nao kama hukumu au malipo.
    reason: lexical_alternative
  - marker: b
    text: Au, “wenye mamlaka wa Shekemu”; Kiebrania kinamaanisha watu wakuu au wenye nguvu katika mji.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania, “waliouimarisha mkono wake,” yaani, waliomuunga mkono au kumpa nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבוֹא חֲמַס
  choice: ukatili ... upate kuwalipia
  rationale: Infinitivu yenye ל inaonyesha kusudi au matokeo. Kitenzi 'kuwalipia' katika muktadha huu huhifadhi wazo la ukatili kurudi kama malipo juu ya wahusika, huku Kiswahili kikibaki cha kawaida.
- source_word: שִׁבְעִים בְּנֵי יְרֻבָּעַל
  choice: wana sabini wa Yerubaali
  rationale: Muundo wa umilikaji umetafsiriwa moja kwa moja; jina la mtu limetoholewa kwa mfumo wa sauti wa Kiswahili.
- source_word: וְדָמָם לָשׂוּם עַל
  choice: na damu yao iwe juu ya
  rationale: Taswira halisi ya damu kuwekwa juu ya mtu imehifadhiwa; hapa ni nahau ya kuwajibika kwa umwagaji damu.
- source_word: אֲבִימֶלֶךְ אֲחִיהֶם
  choice: Abimeleki ndugu yao
  rationale: Kirai cha ufafanuzi kinahifadhi uhusiano wa kifamilia na uzito wake wa kimantiki.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: viongozi wa Shekemu
  rationale: Katika muktadha huu neno linamaanisha wenye mamlaka au watu wakuu wa mji, si lazima wakazi wote.
- source_word: חִזְּקוּ אֶת יָדָיו
  choice: waliouimarisha mkono wake
  rationale: Nahau ya Kiebrania imehifadhiwa kwa karibu; dokezo linafafanua maana yake ya kumuunga mkono.
- source_word: לַהֲרֹג אֶת אֶחָיו
  choice: ili kuwaua ndugu zake
  rationale: Infinitivu ya kusudi imetolewa kwa 'ili'; 'ndugu zake' hapa inarejelea wanaume waliotajwa katika muktadha.
theological_decisions:
- issue: Taswira ya kuwajibika kwa damu iliyomwagwa
  choice: damu yao iwe juu ya Abimeleki ... na juu ya viongozi wa Shekemu
  alternative: hatia ya damu yao ihesabiwe juu ya
  rationale: Kuhifadhi 'damu' na 'juu ya' kunatunza nahau ya kisheria na kimaadili ya Kiebrania bila kuifafanua moja kwa moja kuwa 'hatia ya damu'.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Nahau muhimu za Kiebrania zimehifadhiwa pale zinapobeba taswira ya kimaadili na kisheria, huku maelezo mafupi yakitolewa katika vidokezo.
