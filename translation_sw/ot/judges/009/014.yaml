translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Usemi wa moja kwa moja umehifadhiwa, na “wewe” limetumiwa kwa msisitizo kama katika Kiebrania.
