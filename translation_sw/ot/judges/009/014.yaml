  text: Then all the trees said to the bramble[a], ‘You come, reign over us.’
translation:
  language: sw
  text: Ndipo miti yote ikakiambia kichaka cha miiba[a], “Njoo wewe, ututawale.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kichaka chenye miiba.” Neno la Kiebrania אָטָד linamaanisha kichaka au mmea wenye miiba; halibainishi kwa hakika spishi fulani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ndipo ... ikakiambia
  rationale: Muundo wa kusimulia unaendeleza mfuatano wa matukio; “Ndipo” pamoja na ka- ya mfululizo unasikika kwa kawaida katika Kiswahili na kuhifadhi maana ya hatua inayofuata.
- source_word: כָל הָעֵצִים
  choice: miti yote
  rationale: Hii ni tafsiri ya moja kwa moja ya kundi zima la miti, kwa mpangilio wa kawaida wa Kiswahili.
- source_word: הָאָטָד
  choice: kichaka cha miiba
  rationale: Neno la Kiebrania linamaanisha mmea au kichaka chenye miiba bila kutaja kwa hakika spishi fulani; chaguo hili ni wazi na la kawaida bila kubainisha mmea kupita ushahidi wa chanzo.
- source_word: לֵךְ אַתָּה
  choice: Njoo wewe
  rationale: Kitenzi hiki kabla ya agizo jingine ni mwito wa kuchukua hatua. “Njoo” ni mwaliko wa kawaida katika muktadha huu, na “wewe” huhifadhi msisitizo wa kiwakilishi cha Kiebrania.
- source_word: מְלָךְ
  choice: ututawale
  rationale: Kitenzi kinamaanisha kutawala au kuwa mfalme. “Ututawale” huhifadhi tendo la kutawala na uhusiano na wale wanaoomba bila kuongeza jina “mfalme” lisilotamkwa hapa.
- source_word: עָלֵינוּ
  choice: -tu- katika “ututawale”
  rationale: Katika Kiswahili, yule anayetawaliwa huonyeshwa kwa kawaida kwa kiambishi cha yambwa ndani ya kitenzi; hivyo maana ya “juu yetu/over us” inawasilishwa kwa njia ya asili.
