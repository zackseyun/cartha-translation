base_translation:
  language: en
  yaml_path: translation/ot/judges/009/023.yaml
  text: Then God sent an evil spirit between Abimelech and the leaders of Shechem[c][b][a], and the leaders of Shechem dealt treacherously with Abimelech.
translation:
  language: sw
  text: Ndipo Mungu akatuma roho mbaya[a] kati ya Abimeleki na viongozi wa Shekemu[b], nao viongozi wa Shekemu wakamsaliti Abimeleki[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho yenye kudhuru.” Neno la Kiebrania linaweza kusisitiza ama ubaya wa kimaadili ama athari yenye kudhuru.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “mabwana” au “wenye mamlaka wa Shekemu”; hapa yaelekea ni watu mashuhuri au viongozi wa mji huo.
    reason: lexical_alternative
  - marker: c
    text: Au, “wakatenda kwa hiana dhidi ya Abimeleki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma
  rationale: Kitenzi שׁלח katika mtiririko wa masimulizi kinamaanisha moja kwa moja ‘kutuma’; uchaguzi huu unadumisha wazi kwamba Mungu ndiye aliyetenda.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu אֱלֹהִים humrejelea Mungu, na ‘Mungu’ ndiyo tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: רוּחַ רָעָה
  choice: roho mbaya
  rationale: Tafsiri hii ni ya moja kwa moja na inadumisha uwezekano wa רָעָה kumaanisha ubaya wa kimaadili; maana ya athari yenye kudhuru imehifadhiwa katika tanbihi.
- source_word: בֵּין ... וּבֵין
  choice: kati ya ... na
  rationale: Muundo huu unaonyesha hali ya mgawanyiko au uhasama baina ya pande mbili, na unatolewa kwa Kiswahili cha kawaida.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: viongozi wa Shekemu
  rationale: Ingawa בַּעֲלֵי kihalisi inaweza kuwa ‘mabwana’ au ‘wenye mamlaka,’ hapa inaelekea kuwataja watu mashuhuri wenye mamlaka ya kiraia katika mji.
- source_word: וַיִּבְגְּדוּ
  choice: wakamsaliti
  rationale: בגד humaanisha kutenda kwa hiana au kukosa uaminifu. ‘Kumsaliti’ ni Kiswahili cha kawaida kinachoeleza tendo hilo wazi bila kuongeza maelezo yasiyomo.
- source_word: בַּאֲבִימֶלֶךְ
  choice: Abimeleki
  rationale: Kiambishi cha yambwa katika ‘wakamsaliti’ kinawasilisha kwa kawaida maana ya ב hapa, yaani tendo la hiana lililoelekezwa dhidi ya Abimeleki.
theological_decisions:
- issue: Mungu ndiye anayetuma roho mbaya
  choice: Mungu akatuma roho mbaya
  alternative: Mungu akaruhusu roho mbaya; Mungu akaruhusu roho ya uhasama
  rationale: Kitenzi na sintaksia ya Kiebrania vinahusisha tendo hilo moja kwa moja na Mungu. Tafsiri haibadili ‘akatuma’ kuwa ‘akaruhusu,’ hivyo inadumisha mvutano wa kiteolojia wa simulizi bila kuamua maswali ya chanzo cha pili au namna ya utendaji huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. ‘Ndipo’ hudumisha mwendelezo wa simulizi, na ‘nao’ huonyesha kwa urahisi kurejea kwa viongozi wa Shekemu. Jina שְׁכֶם limetolewa kwa umbo lililozoeleka la kibiblia, ‘Shekemu.’
