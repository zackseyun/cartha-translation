translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Msururu wa masharti umehifadhiwa kwa sababu sentensi na hoja zinaendelea katika mistari inayofuata. Kistari kirefu mwishoni kinaonyesha kuwa wazo halijakamilika katika mstari huu.
