base_translation:
  language: en
  yaml_path: translation/ot/judges/009/016.yaml
  text: Now therefore[a], if you have acted in truth and integrity when you made Abimelech king, and if you have dealt well with Jerubbaal and with his house, and if you have dealt with him according to the recompense of his hands,
translation:
  language: sw
  text: Basi sasa, ikiwa mlitenda kwa kweli na kwa unyofu mlipomweka Abimeleki kuwa mfalme, na ikiwa mlitenda mema kwa Yerubaali na nyumba yake, na ikiwa mlimtendea kulingana na malipo ya matendo ya mikono yake[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na yale ambayo matendo yake yalistahili.” Nahau ya Kiebrania inamaanisha kumtendea mtu kwa kadiri ya matendo yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Inaonyesha mpito wa hoja na hitimisho linalotokana na yaliyotangulia, huku ikihifadhi pia maana ya wakati ya ‘sasa’.
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: kwa kweli na kwa unyofu
  rationale: Jozi hii inaeleza uaminifu wa mwenendo na ukamilifu wa nia. ‘Unyofu’ ni Kiswahili cha sasa na chenye hadhi kinachoeleweka kwa urahisi.
- source_word: וַתַּמְלִיכוּ אֶת־אֲבִימֶלֶךְ
  choice: mlipomweka Abimeleki kuwa mfalme
  rationale: Hifili ya מלך humaanisha kumsababisha mtu atawale, yaani kumweka kuwa mfalme. ‘Mlipomweka’ huunganisha tendo hilo kwa kawaida na tathmini ya kimaadili iliyotangulia.
- source_word: טוֹבָה עֲשִׂיתֶם עִם
  choice: mlitenda mema kwa
  rationale: Hii ni tafsiri ya kawaida na ya wazi ya nahau ya Kiebrania ya kumfanyia mtu mema.
- source_word: יְרֻבַּעַל
  choice: Yerubaali
  rationale: Jina lililotumiwa katika maandishi ya Kiebrania limehifadhiwa badala ya kubadilishwa kuwa Gideoni.
- source_word: בֵּיתוֹ
  choice: nyumba yake
  rationale: ‘Nyumba’ huhifadhi upana wa neno la Kiebrania, linaloweza kumaanisha jamaa, ukoo, au nyumba ya kifalme.
- source_word: כִּגְמוּל יָדָיו
  choice: kulingana na malipo ya matendo ya mikono yake
  rationale: Tafsiri hii huhifadhi picha halisi ya ‘mikono’ na wazo la kutendewa kwa kadiri ya yale ambayo matendo ya mtu yameleta au kustahili.
- source_word: עֲשִׂיתֶם לוֹ
  choice: mlimtendea
  rationale: Kitenzi hiki ni cha kawaida katika Kiswahili na kinafaa kwa tathmini ya namna Yerubaali alivyotendewa.
