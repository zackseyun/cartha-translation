base_translation:
  language: en
  yaml_path: translation/ot/judges/009/044.yaml
  text: And Abimelech and the leaders who were with him rushed forward and took their stand at the entrance of the city gate[a], while the two other companies rushed against everyone who was in the field and struck them down.
translation:
  language: sw
  text: Abimeleki na viongozi waliokuwa pamoja naye wakasonga mbele na kusimama penye ingilio la lango la mji; vile vikosi viwili vingine[a] navyo vikasonga mbele dhidi ya wote waliokuwa shambani na kuwapiga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “viongozi wawili.” Katika muktadha, inaelekea kuwa ni vikosi viwili vilivyobaki kati ya vikosi vitatu vilivyotajwa katika mstari uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשְׁטוּ
  choice: wakasonga mbele kwa kasi / vikawashambulia
  rationale: Katika muktadha huu wa kijeshi, kitenzi kinaonyesha kusonga au kuvamia kwa lengo la kushambulia. Kauli imebadilishwa kidogo kulingana na muundo wa kila kishazi ili Kiswahili kiwe cha kawaida bila kupoteza hatua ya kijeshi.
- source_word: הָרָאשִׁים
  choice: viongozi
  rationale: Neno hilo humaanisha kihalisi “vichwa,” lakini hapa linawataja viongozi wa kijeshi waliokuwa pamoja na Abimeleki.
- source_word: וַיַּעַמְדוּ
  choice: kujiweka
  rationale: Hii inaonyesha kusimama mahali maalumu kwa kusudi la kijeshi, si kusimama tu bila kusudi.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: kwenye mwingilio wa lango la mji
  rationale: Tafsiri hii inahifadhi maelezo ya mahali—sehemu ya kuingilia katika lango la mji—kwa Kiswahili cha kawaida.
- source_word: וּשְׁנֵי הָרָאשִׁים
  choice: vile vikosi viwili
  rationale: Ingawa maandishi yanasema kihalisi “viongozi wawili,” muktadha wa mstari uliotangulia unaeleza majeshi yaliyogawanywa katika vikosi vitatu; kwa hiyo hapa inaelekea kurejelea vikosi viwili vilivyobaki. Tanbihi inahifadhi usomaji halisi na utata wake.
- source_word: עַל כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: wote waliokuwa mashambani
  rationale: Kiwakilishi cha wingi katika kitenzi kinachofuata kinaonyesha kuwa wanaolengwa ni watu waliokuwa mashambani.
- source_word: וַיַּכּוּם
  choice: kuwapiga
  rationale: Kitenzi kinaweza kumaanisha kupiga, kushinda, au kuua. “Kuwapiga” kinahifadhi ukali wa tendo bila kudai wazi kwamba kila mmoja aliuawa.
