  text: Ndipo miti ikauambia mtini, “Njoo wewe, ututawale.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ndipo ... ikauambia
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “Ndipo” na umbo la mfululizo “ikauambia” vinatoa mwendo wa kawaida wa Kiswahili.
- source_word: הָעֵצִים
  choice: miti
  rationale: Katika mfano huu, עֵצִים ni miti inayozungumza, si mbao wala mimea kwa ujumla.
- source_word: לַתְּאֵנָה
  choice: mtini
  rationale: תְּאֵנָה hapa ni mti wa tini, na kiambishi לְ kinaonyesha anayesemeshwa.
- source_word: לְכִי אַתְּ
  choice: Njoo wewe
  rationale: Amri na kiwakilishi huru cha nafsi ya pili zote zimehifadhiwa; “wewe” linaonyesha mkazo uliopo katika אַתְּ.
- source_word: מָלְכִי
  choice: ututawale
  rationale: Kitenzi מלך hapa kinamaanisha kutawala kama mfalme; “ututawale” ni cha kawaida na huunganisha kwa uwazi maana ya עָלֵינוּ.
- source_word: עָלֵינוּ
  choice: -tu- katika “ututawale”
  rationale: Kwa מלך, עַל huonyesha wale wanaotawaliwa; Kiswahili huwasilisha maana hiyo kwa kawaida kwa kiambishi cha yambwa “-tu-”.
