translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “aka-” umetumiwa kuendeleza simulizi kwa urahisi. Tanbihi imewekwa baada ya kifungu inachofafanua, badala ya baada ya jina Shekemu.
