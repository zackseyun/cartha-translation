  source_fidelity: Marekebisho yanahitajika kwa kifungu cha בֵּית אֲבִי אִמּוֹ. Rasimu ya “wa upande wa babu yake wa mama” hufafanua maana inayowezekana, lakini haidumishi taswira/istilahi ya Kiebrania “nyumba ya baba wa mama yake,” wala haionyeshi wazi kuwa ni kaya au ukoo wa babu huyo. Muundo uliorekebishwa huhifadhi maana hiyo, huku tanbihi ikieleza matumizi ya “nyumba.”
  naturalness: Kiswahili cha rasimu kwa ujumla ni sanifu na kinaeleweka. Hata hivyo, “ukoo wote wa upande wa babu yake wa mama” ni muundo usio mwepesi na wenye utata kidogo katika uhusiano wake na “ukoo.” “Ukoo wote wa nyumba ya baba wa mama yake” ni sahihi kwa tafsiri linganifu, na tanbihi hufanya usemi huo uwe wazi.
  terminology: Majina “Abimeleki,” “Yerubaali,” na “Shekemu” yanafaa. “Ndugu wa kiume wa mama yake” huhifadhi kwa usahihi neno la Kiebrania la “ndugu/brothers,” bila kulibadilisha kuwa “wajomba,” ingawa hao ndio uhusiano unaodokezwa. “Ukoo” ni chaguo zuri kwa מִשְׁפָּחָה.
