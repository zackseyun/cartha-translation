base_translation:
  language: en
  yaml_path: translation/ot/judges/009/001.yaml
  text: Abimelech son of Jerubbaal went to Shechem[a], to his mother's brothers, and spoke to them and to the whole clan of his mother's father's house, saying,
translation:
  language: sw
  text: Abimeleki, mwana wa Yerubaali, akaenda Shekemu kwa ndugu wa kiume wa mama yake, akazungumza nao na ukoo wote wa nyumba ya baba wa mama yake[a], akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “nyumba ya baba wa mama yake” hurejelea kaya au ukoo wa upande wa mama yake, hasa wa baba yake mama.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Kiambishi cha usimulizi “aka-” kinaendeleza mfululizo wa matukio kwa njia ya kawaida katika Kiswahili bila kuongeza neno la wakati lisilokuwapo katika Kiebrania.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleki
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: בֶּן יְרֻבַּעַל
  choice: mwana wa Yerubaali
  rationale: Huhifadhi wazi uhusiano wa kifamilia uliotajwa katika Kiebrania.
- source_word: שְׁכֶמָה
  choice: Shekemu
  rationale: Kiambishi elekezi cha Kiebrania kina motion toward the city; “akaenda Shekemu” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: אֶל אֲחֵי אִמּוֹ
  choice: kwa ndugu wa kiume wa mama yake
  rationale: אֲחֵי ni “ndugu wa kiume”; usemi huu unaonyesha kwamba walikuwa kaka au wadogo wa mama yake bila kubadili neno hilo kuwa istilahi ya jumla zaidi.
- source_word: וַיְדַבֵּר אֲלֵיהֶם
  choice: Akazungumza nao
  rationale: Hutafsiri tendo la kusema kwao na kuepuka marudio yasiyo ya lazima kabla ya kishazi kinachoanzishwa na לֵאמֹר.
- source_word: וְאֶל כָּל מִשְׁפַּחַת
  choice: na ukoo wote
  rationale: מִשְׁפָּחָה hapa ni kundi pana la jamaa; “ukoo” ni neno la kawaida na sahihi katika muktadha huu.
- source_word: בֵּית אֲבִי אִמּוֹ
  choice: wa upande wa babu yake wa mama
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya “nyumba ya baba ya mama yake,” yaani ukoo au jamaa wa upande wa babu wa mama.
- source_word: לֵאמֹר
  choice: akisema,
  rationale: Hutambulisha maneno ya moja kwa moja yanayofuata katika mstari unaofuata.
