base_translation:
  language: en
  yaml_path: translation/ot/judges/009/017.yaml
  text: because my father fought for you[a], cast his life in front of him[b], and delivered you from the hand of Midian.
translation:
  language: sw
  text: kwa maana baba yangu alipigana kwa ajili yenu, akahatarisha maisha yake[a], na kuwaokoa kutoka mikononi mwa Midiani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “aliyatupa maisha yake mbele,” nahau inayomaanisha kwamba alijiweka katika hatari ya kufa.
    reason: lexical_alternative
  - marker: b
    text: Au “kutoka katika mamlaka ya Midiani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: kwa maana
  rationale: Katika muktadha, neno hili linaunganisha sentensi na kutoa sababu ya shtaka la Yothamu; “kwa maana” ni ya kawaida na wazi katika Kiswahili.
- source_word: נִלְחַם ... עֲלֵיכֶם
  choice: alipigana kwa ajili yenu
  rationale: Hapa kitenzi pamoja na kihusishi kinaonyesha kupigana kwa manufaa ya wasikilizaji, si kupigana dhidi yao.
- source_word: וַיַּשְׁלֵךְ אֶת־נַפְשׁוֹ מִנֶּגֶד
  choice: akahatarisha maisha yake
  rationale: Hii ni nahau ya Kiebrania inayosema kihalisi kwamba aliyatupa maisha yake mbele, yaani alijiweka katika hatari ya kufa. Tafsiri hii huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וַיַּצֵּל
  choice: na kuwaokoa
  rationale: Hifili ya נצל humaanisha kuokoa au kukomboa kutoka hatarini au chini ya mamlaka ya adui; “kuwaokoa” inafaa katika muktadha huu wa kijeshi.
- source_word: מִיַּד מִדְיָן
  choice: kutoka mikononi mwa Midiani
  rationale: Nahau ya “mkono” inaashiria nguvu au mamlaka. Kiswahili pia hutumia “mikononi mwa” kwa hali ya kuwa chini ya udhibiti wa mtu au kundi.
