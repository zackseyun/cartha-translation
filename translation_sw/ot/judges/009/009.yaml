  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ הַ/זַּ֔יִת הֶ/חֳדַ֨לְתִּי֙ אֶת דִּשְׁנִ֔/י אֲשֶׁר בִּ֛/י יְכַבְּד֥וּ אֱלֹהִ֖ים וַ/אֲנָשִׁ֑ים וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/009.yaml
  text: But the olive tree said to them[a], ‘Should I stop producing my oil, by which gods and men are honored[b], and go to sway over the trees?’
translation:
  language: sw
  text: Lakini mzeituni ukawaambia, “Je, niache kutoa mafuta yangu[b], ambayo kwa mafuta hayo miungu[a] na wanadamu huheshimiwa, kisha niende nikayumbeyumbe juu ya miti?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu.” Tafsiri nyingi hulichukulia אֱלֹהִים hapa kuwa linamrejelea Mungu wa kweli, kwa kuwa mafuta ya zeituni yalitumika katika ibada; umbo la Kiebrania lenyewe ni la wingi.
    reason: alternative_reading
  - marker: b
    text: Kiebrania, “unono wangu,” usemi wa kitamathali unaomaanisha zao nono la mzeituni.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזַּיִת
  choice: mzeituni
  rationale: Katika mfano huu nomino hiyo inamaanisha mti wa zeituni unaozungumza; “mzeituni” ni neno la kawaida na la asili katika Kiswahili.
- source_word: הֶחֳדַלְתִּי
  choice: Je, niache kutoa
  rationale: Kauli ya wakati timilifu imetumiwa kama swali la balagha baada ya mwaliko wa miti; tafsiri hii inaleta maana hiyo kwa Kiswahili cha kawaida.
- source_word: דִּשְׁנִי
  choice: mafuta yangu
  rationale: Kihalisi neno hili ni “unono wangu” au “utajiri wangu,” lakini katika kinywa cha mzeituni linarejelea zao lake nono, yaani mafuta. Tanbihi inahifadhi sitiari ya Kiebrania.
- source_word: אֲשֶׁר בִּי
  choice: ambayo kwayo
  rationale: Hutoa maana ya chombo au njia bila kulazimisha ufafanuzi zaidi ya Kiebrania.
- source_word: יְכַבְּדוּ
  choice: huheshimiwa
  rationale: Kitenzi cha Kiebrania ni cha wingi na mtendaji wake hajaelezwa wazi. Kauli tendwa ya Kiswahili huhifadhi jambo hilo na kukazia heshima inayotokana na mafuta.
- source_word: אֱלֹהִים
  choice: miungu
  rationale: Umbo la Kiebrania ni la wingi na linaambatana na kitenzi cha wingi; kwa hiyo “miungu” limewekwa katika matini, huku usomaji wa “Mungu” ukihifadhiwa katika tanbihi.
- source_word: וַאֲנָשִׁים
  choice: na wanadamu
  rationale: “Wanadamu” ni neno la kawaida, lenye heshima, na huonyesha watu kwa ujumla katika jozi hii na miungu.
- source_word: וְהָלַכְתִּי לָנוּעַ
  choice: kisha niende nikayumbeyumbe
  rationale: Hufuata mwendelezo wa swali la balagha na kuhifadhi taswira ya mti unaoyumba huku ikidokeza kwa kejeli nafasi ya kuwa juu ya miti mingine.
- source_word: עַל הָעֵצִים
  choice: juu ya miti
  rationale: “Juu ya” huhifadhi picha ya nafasi iliyo juu na pia dokezo la mamlaka juu ya miti mingine.
theological_decisions:
- issue: Mrejelewa wa אֱלֹהִים
  choice: miungu
  alternative: Mungu
  rationale: Umbo na kitenzi vya Kiebrania ni vya wingi, jambo linalounga mkono “miungu.” Hata hivyo, kwa kuwa mafuta ya zeituni yalitumika katika ibada na mapokeo mengi yametafsiri neno hilo kuwa Mungu wa kweli, usomaji huo halali umeonyeshwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. “Nikayumbeyumbe juu ya miti” huhifadhi taswira ya mfano na kejeli ya kutawala bila kubadili kitenzi moja kwa moja kuwa “kutawala.”
