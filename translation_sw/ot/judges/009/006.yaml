base_translation:
  language: en
  yaml_path: translation/ot/judges/009/006.yaml
  text: Then all the leaders of Shechem and all Beth-millo gathered together[b][a], and they went and made Abimelech king beside the oak pillar that was in Shechem.
translation:
  language: sw
  text: Ndipo viongozi wote wa Shekemu na Beth-Milo wote wakakusanyika[b]. Wakaenda wakamfanya Abimeleki kuwa mfalme kando ya mwaloni wa nguzo[a] uliokuwa Shekemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kando ya mwaloni wa jiwe lililosimamishwa.” Kirai cha Kiebrania ni kigumu, na maana kamili ya neno מֻצָּב haijulikani kwa uhakika.
    reason: lexical_alternative
  - marker: b
    text: Beth-Milo huenda likamaanisha “nyumba ya Milo,” lakini hapa inaelekea kutumiwa kama jina la mahali au la ukoo/kundi.
    reason: cultural_note
lexical_decisions:
- source_word: בַּעֲלֵי שְׁכֶם
  choice: viongozi wa Shekemu
  rationale: Ingawa neno hilo kihalisi linaweza kumaanisha wenye mali, mabwana, au wenye mamlaka, katika muktadha huu wa kisiasa linawataja watu wenye ushawishi na mamlaka mjini.
- source_word: בֵּית מִלּוֹא
  choice: Beth-Milo
  rationale: Kirai hiki kinaonekana kutumiwa kama jina la mahali au la kundi. Kulihamisha kifonetiki huepuka kulifasiri kwa uhakika usiokuwapo kuwa nyumba halisi.
- source_word: וַיַּמְלִיכוּ ... לְמֶלֶךְ
  choice: wakamweka Abimeleki kuwa mfalme
  rationale: Hii inaeleza kwamba walimsababisha atawale, bila kuongeza desturi ya kumvika taji ambayo haikutajwa katika Kiebrania.
- source_word: עִם
  choice: kando ya
  rationale: Katika uhusiano na alama ya mahali, neno hili linaonyesha ukaribu wa mahali walipomweka Abimeleki kuwa mfalme.
- source_word: אֵלוֹן
  choice: mwaloni
  rationale: Neno hilo hutaja mti mkubwa ambao kwa kawaida hutafsiriwa mwaloni au mterebinthi; “mwaloni” ni chaguo linaloeleweka na lililozoeleka, ingawa aina kamili ya mti si hakika.
- source_word: מֻצָּב
  choice: nguzo
  rationale: Neno hili linatokana na wazo la kitu kilichowekwa au kusimamishwa. “Nguzo” huhifadhi picha ya alama iliyosimama, huku tanbihi ikionyesha ugumu na uwezekano mwingine wa kirai kizima.
- source_word: וַיֵּאָסְפוּ
  choice: wakakusanyika
  rationale: Hili ni neno la kawaida na la asili katika Kiswahili kwa tendo la kukusanyika kama kundi.
