  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Kauli za agizo zimetolewa kwa kiima tegemezi (“uamke,” “umtendee”), na msamiati wa kijeshi umewekwa wazi bila kuongeza maelezo ya mbinu yasiyokuwamo katika chanzo.
