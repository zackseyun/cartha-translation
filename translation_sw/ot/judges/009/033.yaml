  source_fidelity: 'Maana ya jumla inafuata Kiebrania vizuri: maagizo ya asubuhi, kutoka kwa Abimeleki na watu wake, na kiwakilishi cha umoja katika “umtendee” vyote vimedumishwa. Hata hivyo, “na kuushambulia” si mwendelezo sahihi wa kisarufi wa agizo “uamke”; pia “kadiri utakavyopata nafasi” hupendelea fursa na hupunguza maana pana ya nahau, yaani jambo lililo ndani ya uwezo wa mtu.'
