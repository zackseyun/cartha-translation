base_translation:
  language: en
  yaml_path: translation/ot/judges/009/033.yaml
  text: Then in the morning[a], as soon as the sun rises, you must get up early and spread out against the city. And look, when he and the people who are with him come out to you, you shall do to him as your hand finds.
translation:
  language: sw
  text: Basi, asubuhi, mara tu jua linapochomoza, uamke mapema na uuvamie mji. Na tazama, yeye na watu walio pamoja naye watakapokutokea, umtendee kadiri ya uwezo wako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kadiri mkono wako utakavyopata”; nahau hii humaanisha kutenda kulingana na uwezo wako au fursa utakayoipata.
    reason: Nahau ya Kiebrania haiwezi kuhamishwa neno kwa neno katika Kiswahili bila kuwa ngeni au isiyoeleweka, na inaweza kusisitiza uwezo au fursa.
lexical_decisions:
- source_word: וְהָיָה בַבֹּקֶר
  choice: Basi, asubuhi
  rationale: Muundo huu unaendeleza mfululizo wa maagizo. “Basi” ni wa kawaida katika Kiswahili na hauongezi wazo la ‘kesho,’ ambalo halijasemwa wazi katika Kiebrania.
- source_word: כִּזְרֹחַ הַשֶּׁמֶשׁ
  choice: mara jua litakapochomoza
  rationale: Inaonyesha wakati wa kuchomoza kwa jua na haraka inayokusudiwa katika mpango huu wa kijeshi.
- source_word: תַּשְׁכִּים
  choice: uamke mapema
  rationale: Hifili ya שכם humaanisha kuamka au kuanza mapema; muktadha unaipa kauli hii nguvu ya agizo.
- source_word: וּפָשַׁטְתָּ עַל הָעִיר
  choice: na kuushambulia mji
  rationale: Katika muktadha wa kijeshi, פשט humaanisha kuvamia, kufanya shambulio, au kusambaa dhidi ya mahali. “Kuushambulia mji” ni wazi na ya asili bila kudai mbinu mahsusi ya jeshi.
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Inahifadhi kishazi cha kuvuta fikira kwa jambo linalofuata.
- source_word: הוּא וְהָעָם אֲשֶׁר אִתּוֹ
  choice: yeye na watu walio pamoja naye
  rationale: “Watu” hudumisha upana wa עָם; kuwaita moja kwa moja ‘wanajeshi’ kungefafanua zaidi ya maandishi.
- source_word: יֹצְאִים אֵלֶיךָ
  choice: watakapokutokea
  rationale: Hueleza mwendo wao kutoka kuelekea kwa mhusika katika mazingira ya uhasama, huku ikiepuka kulazimisha kihusishi אֶל kimaanishe moja kwa moja ‘dhidi yako.’
- source_word: וְעָשִׂיתָ לּוֹ
  choice: umtendee
  rationale: Kiwakilishi cha umoja kinadumishwa na kinamlenga hasa kiongozi, ingawa huenda akawakilisha kundi lake.
- source_word: כַּאֲשֶׁר תִּמְצָא יָדֶךָ
  choice: kadiri utakavyopata nafasi
  rationale: Nahau hii ya Kiebrania inahusu jambo lililo ndani ya uwezo wa mtu au nafasi anayoipata. Tafsiri hii ni ya asili kwa Kiswahili, huku tanbihi ikihifadhi picha halisi na wigo wa maana.
