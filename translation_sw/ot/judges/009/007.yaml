base_translation:
  language: en
  yaml_path: translation/ot/judges/009/007.yaml
  text: And they told Jotham[a], and he went and stood on the top of Mount Gerizim, and he lifted up his voice and called out and said to them, “Listen to me, leaders of Shechem[b], that God may listen to you.”
translation:
  language: sw
  text: Wakamjulisha Yothamu, naye akaenda akasimama juu ya Mlima Gerizimu. Akapaza sauti, akawaita na kuwaambia, “Nisikilizeni, enyi viongozi wa Shekemu[a], ili Mungu awasikilize[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “mabwana” au “wenye mamlaka wa Shekemu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “na Mungu awasikilize.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּדוּ לְיוֹתָם
  choice: Wakamjulisha Yothamu
  rationale: Hifili ya נגד humaanisha kumwambia au kumjulisha mtu. “Wakamjulisha” ni ya kawaida katika Kiswahili na inadumisha mfululizo wa simulizi.
- source_word: וַיֵּלֶךְ וַיַּעֲמֹד
  choice: naye akaenda akasimama
  rationale: Vitenzi vya mfululizo vimetafsiriwa kwa mtindo wa kawaida wa simulizi la Kiswahili bila kuongeza maana.
- source_word: בְּרֹאשׁ הַר גְּרִזִים
  choice: juu ya Mlima Gerizimu
  rationale: רֹאשׁ katika matumizi ya kijiografia ni kilele au sehemu ya juu. “Juu ya” ni wazi na ya kawaida; jina Gerizimu limetoholewa kwa mfumo wa Kiswahili.
- source_word: וַיִּשָּׂא קוֹלוֹ
  choice: Akapaza sauti
  rationale: Nahau hii ya Kiebrania humaanisha kuongeza sauti ili kusikika; “kupaza sauti” ni nahau asilia ya Kiswahili.
- source_word: וַיִּקְרָא וַיֹּאמֶר לָהֶם
  choice: akawaita na kuwaambia
  rationale: קרא hapa ni kuita kwa sauti mbele ya watu, kisha kusema nao. Tafsiri inadumisha vitendo vyote bila kufanya usemi huo kuwa tangazo rasmi.
- source_word: שִׁמְעוּ אֵלַי
  choice: Nisikilizeni
  rationale: שמע pamoja na אֵלַי ni agizo la kunisikiliza. Umbo hili ni la moja kwa moja na la asili katika Kiswahili.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: viongozi wa Shekemu
  rationale: בַּעֲלֵי kwa maana ya msingi ni mabwana, wenye mamlaka, au wamiliki; katika muktadha huu inawahusu wenye mamlaka mjini Shekemu. “Viongozi” huwasilisha dhima yao kwa uwazi, huku tanbihi ikihifadhi maana halisi zaidi.
- source_word: וְיִשְׁמַע אֲלֵיכֶם אֱלֹהִים
  choice: ili Mungu naye awasikilize
  rationale: Kiunganishi וְ pamoja na kitenzi kisichotimilika kinaweza kueleza kusudi au matokeo baada ya agizo. “Ili” hudhihirisha usomaji huo, na “awasikilize” hudumisha ulinganifu wa שמע katika vifungu vyote viwili.
theological_decisions:
- issue: Nguvu ya kifungu cha mwisho cha Yothamu
  choice: ili Mungu naye awasikilize
  alternative: na Mungu na awasikilize
  rationale: Kiebrania kinaweza kueleweka kama kusudi/matokeo ya agizo lililotangulia au kama ombi/tamko linalounganishwa nalo. Matini kuu inafuata muundo wa kusudi, lakini tanbihi inahifadhi uwezekano wa pili bila kuamua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mfululizo wa vitenzi umefanywa kuwa wa asili katika simulizi la Kiswahili, huku marudio yenye maana katika Kiebrania yakihifadhiwa. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
