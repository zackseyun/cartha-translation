base_translation:
  language: en
  yaml_path: translation/ot/judges/009/019.yaml
  text: And if today you have acted in truth and integrity toward Jerubbaal and toward his house[a], rejoice in Abimelech[c][b], and let him also rejoice in you.
translation:
  language: sw
  text: Na ikiwa leo mmetenda kwa uaminifu na kwa unyofu kwa Yerubaali na kwa nyumba yake[a], furahini kwa ajili ya Abimeleki, naye pia afurahi kwa ajili yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nyumba yake” hapa inaweza kumaanisha watu wa nyumbani mwake, familia yake, au ukoo wake.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Na ikiwa
  rationale: Inahifadhi kiunganishi pamoja na sharti, na kuendeleza mtiririko wa hoja ya masharti katika hotuba ya Yothamu.
- source_word: בֶּאֱמֶת
  choice: kwa uaminifu
  rationale: Katika muktadha huu אֱמֶת inaeleza kutenda kwa kweli na kwa uaminifu; “kwa uaminifu” ni Kiswahili cha kawaida kinachoonyesha ubora wa mwenendo.
- source_word: וּבְתָמִים
  choice: na kwa unyofu
  rationale: תָמִים hapa ina maana ya ukamilifu wa kimaadili au mwenendo usio na hila; “unyofu” ni wa asili na unaeleweka kwa wasomaji wa sasa.
- source_word: עֲשִׂיתֶם עִם
  choice: mmetenda ... kwa
  rationale: Inawasilisha nahau ya kutenda au kushughulika na mtu kwa namna fulani, huku Kiswahili kikibaki cha kawaida.
- source_word: יְרֻבַּעַל
  choice: Yerubaali
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: בֵּיתוֹ
  choice: nyumba yake
  rationale: Inahifadhi upana wa בַּיִת, ambao unaweza kumaanisha nyumba, watu wa nyumbani, familia, au ukoo.
- source_word: הַיּוֹם הַזֶּה
  choice: leo
  rationale: Ni tafsiri ya asili ya Kiswahili ya usemi halisi “siku hii,” bila kupoteza maana ya wakati.
- source_word: שִׂמְחוּ
  choice: mfurahie
  rationale: Amri ya wingi inaelekezwa kwa wasikilizaji; kitenzi chenye yambwa kinawasilisha kufurahia kwa sababu ya Abimeleki.
- source_word: בַּאֲבִימֶלֶךְ
  choice: Abimeleki
  rationale: Yambwa wa “mfurahie” huingiza kwa kawaida maana ya kihusishi ב katika Kiswahili bila kuhitaji “katika,” ambayo ingesikika isiyo ya asili.
- source_word: וְיִשְׂמַח גַּם הוּא בָּכֶם
  choice: naye pia awafurahie ninyi
  rationale: Umbo la utegemezi “awafurahie” linahifadhi nguvu ya jussive na ulinganifu wa furaha ya pande zote.
