  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sharti na sauti ya kejeli ya hotuba umeachwa wazi bila kuufafanua kupita maandishi; “basi” huonyesha kwa kawaida matokeo ya sharti. Alama ya tanbihi [a] imewekwa mara moja baada ya kirai kinachohusika.
