  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Majina yameandikwa kwa maumbo yaliyozoeleka katika tafsiri za Biblia za Kiswahili. Maswali ya Gaali yamehifadhiwa kama maswali makali ya balagha, na utata wa ‘Shekemu’ pamoja na wigo wa cheo cha Zebuli umeelezwa katika tanbihi badala ya kuondolewa katika matini.
