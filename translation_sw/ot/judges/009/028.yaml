  text: וַ/יֹּ֣אמֶר גַּ֣עַל בֶּן עֶ֗בֶד מִֽי אֲבִימֶ֤לֶךְ וּ/מִֽי שְׁכֶם֙ כִּ֣י נַעַבְדֶ֔/נּוּ הֲ/לֹ֥א בֶן יְרֻבַּ֖עַל וּ/זְבֻ֣ל פְּקִיד֑/וֹ עִבְד֗וּ אֶת אַנְשֵׁ֤י חֲמוֹר֙ אֲבִ֣י שְׁכֶ֔ם וּ/מַדּ֖וּעַ נַעַבְדֶ֥/נּוּ אֲנָֽחְנוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/028.yaml
  text: And Gaal son of Ebed said[a], “Who is Abimelek, and who is Shechem, that we should serve him? Is he not the son of Jerubbaal, and Zebul his officer? Serve the men of Hamor[c][b], the father of Shechem! But why should we serve him?”
translation:
  language: sw
  text: Gaali mwana wa Ebedi akasema, “Abimeleki ni nani, na Shekemu ni nani,[a] hata tumtumikie? Je, yeye si mwana wa Yerubaali, na Zebuli si afisa wake?[b] Watumikieni watu wa Hamori, baba wa Shekemu![c] Lakini kwa nini sisi tumtumikie?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Abimeleki ni nani, na Shekemu ni nini...?” Kiebrania kinataja Shekemu moja kwa moja; jina hilo huenda likamaanisha mji au jamii yake yenye mamlaka.
    reason: lexical_alternative
  - marker: b
    text: “Afisa wake” pia yaweza kutafsiriwa “naibu wake” au “mtendaji wake aliyeteuliwa.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, watu waliohusishwa na Hamori. Hamori anatajwa kuwa baba wa Shekemu; tazama Mwanzo 34.
    reason: cross_reference
lexical_decisions:
- source_word: מִי אֲבִימֶלֶךְ וּמִי שְׁכֶם
  choice: Abimeleki ni nani, na Shekemu ni nani
  rationale: Maswali ya balagha yanadharau hadhi na uhalali wa Abimeleki na Shekemu. Kutaja Shekemu moja kwa moja huhifadhi metonimia ya Kiebrania, ambapo jina linaweza kumaanisha mji au jamii yake.
- source_word: כִּי נַעַבְדֶנּוּ
  choice: hata tumtumikie
  rationale: Kitenzi עבד hapa kinahusu utumishi au utiifu wa kisiasa, si kazi ya kawaida. ‘Hata tumtumikie’ linaendeleza swali la kupinga uhalali wake kwa Kiswahili cha kawaida.
- source_word: הֲלֹא בֶן יְרֻבַּעַל
  choice: Je, yeye si mwana wa Yerubaali
  rationale: Muundo wa swali unaotarajia kukubaliwa umehifadhiwa, pamoja na msisitizo wa ukoo wa Abimeleki.
- source_word: פְּקִידוֹ
  choice: afisa wake
  rationale: Neno hilo humaanisha mtu aliyeteuliwa kuwa msimamizi au mtendaji aliye chini ya mwingine. ‘Afisa wake’ ni pana vya kutosha bila kubainisha cheo kisichotajwa katika matini.
- source_word: עִבְדוּ
  choice: Watumikieni
  rationale: Hii ni amri ya wingi kwa wasikilizaji wa Gaali; Kiswahili kinahifadhi ukali wa amri hiyo.
- source_word: אַנְשֵׁי חֲמוֹר אֲבִי שְׁכֶם
  choice: watu wa Hamori, baba wa Shekemu
  rationale: ‘Watu wa Hamori’ huhifadhi maana pana ya watu waliohusishwa na Hamori, huku ‘baba wa Shekemu’ ikiacha wazi kama Shekemu hapa ni mtu wa kale, mji, au jamii inayohusishwa naye.
- source_word: וּמַדּוּעַ נַעַבְדֶנּוּ אֲנָחְנוּ
  choice: Lakini kwa nini sisi tumtumikie?
  rationale: ‘Lakini’ huonyesha changamoto ya kilele, na ‘sisi’ huhifadhi msisitizo wa kiwakilishi אֲנָחְנוּ.
