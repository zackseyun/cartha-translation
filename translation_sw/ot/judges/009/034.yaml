base_translation:
  language: en
  yaml_path: translation/ot/judges/009/034.yaml
  text: So Abimelech and all the people who were with him got up by night[a], and they lay in ambush against Shechem in four companies.
translation:
  language: sw
  text: Basi Abimeleki pamoja na watu wote waliokuwa naye wakainuka usiku, wakaivizia Shekemu wakiwa katika vikundi vinne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “vichwa vinne,” yaani vikundi au mafungu manne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: wakaondoka
  rationale: Kitenzi קום hapa kinaonyesha kuinuka na kuanza kutenda. Katika muktadha wa kijeshi, “wakaondoka” ni Kiswahili cha kawaida kinachoonyesha kuanza safari au operesheni bila kudai kwamba walikuwa wamelala.
- source_word: לָיְלָה
  choice: usiku
  rationale: Nomino hii imetumiwa kama kielezi cha wakati; “usiku” ni tafsiri fupi na ya kawaida.
- source_word: וַיֶּאֶרְבוּ
  choice: wakaivizia
  rationale: Kitenzi ארב humaanisha kujificha na kungoja ili kushambulia. “Kuivizia” huwasilisha kwa kawaida wazo la kuvizia kwa nia ya uhasama.
- source_word: עַל שְׁכֶם
  choice: Shekemu
  rationale: עַל pamoja na ארב humtaja mlengwa wa uviziaji. Kiambishi cha yambwa katika “wakaivizia” kinaonyesha kwamba Shekemu ndiyo iliyolengwa, si mahali tu walipokuwa karibu nako.
- source_word: אַרְבָּעָה רָאשִׁים
  choice: wakiwa katika vikundi vinne
  rationale: Kwa maana halisi ni “vichwa vinne,” lakini hapa ni nahau inayomaanisha mafungu au vikosi vinne. “Vikundi vinne” ni wazi na hakiongezi kiwango maalumu cha kijeshi kisichotajwa katika Kiebrania.
- source_word: הָעָם אֲשֶׁר עִמּוֹ
  choice: watu wote waliokuwa naye
  rationale: עָם ni “watu.” Ingawa muktadha ni wa kijeshi, chanzo hakisemi wazi “wanaume” au “askari,” hivyo tafsiri pana imehifadhiwa.
