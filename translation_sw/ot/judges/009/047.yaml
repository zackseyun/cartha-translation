lexical_decisions:
- source_word: וַיֻּגַּד
  choice: akaambiwa
  rationale: Kitenzi cha Kiebrania ni hali tendwa, ‘ikaambiwa/ikaripotiwa’; ‘akaambiwa’ ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: בַּעֲלֵי
  choice: viongozi
  rationale: Kwa muktadha huu neno linaweza kumaanisha wenye mamlaka au watu mashuhuri wa jumuiya; ‘viongozi’ linaeleweka kwa urahisi na huepuka maana ya moja kwa moja ya ‘wamiliki’ isiyofaa hapa.
- source_word: מִגְדַּל שְׁכֶם
  choice: mnara wa Shekemu
  rationale: Huhifadhi muundo wa jina katika chanzo bila kuamua kimyakimya kama ni jengo lenyewe au eneo/jumuiya iliyoitwa hivyo.
- source_word: הִתְקַבְּצוּ
  choice: walikuwa wamekusanyika
  rationale: Huwasilisha kitendo kilichokuwa tayari kimetokea wakati taarifa ilipomfikia Abimeleki.
