base_translation:
  language: en
  yaml_path: translation/ot/judges/009/038.yaml
  text: Then Zebul said to him[a], “Where is your mouth now, you who said, ‘Who is Abimelech, that we should serve him?’ Is this not the people whom you despised? Go out now and fight against them.”
translation:
  language: sw
  text: Ndipo Zebuli akamwambia, “Kinywa chako kiko wapi sasa[a], wewe uliyesema, ‘Abimeleki ni nani hata tumtumikie?’ Je, hawa si wale watu uliowadharau? Toka sasa ukapigane nao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “Kinywa chako kiko wapi sasa?” Hii ni nahau ya kumdhihaki kwa sababu ya maneno yake ya ujasiri aliyosema awali.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה אֵפוֹא פִיךָ
  choice: Kiko wapi sasa kinywa chako
  rationale: Inahifadhi taswira halisi ya Kiebrania na dhihaka ya Zebuli kuhusu maneno ya ujasiri ambayo Gaali alikuwa amesema awali; tanbihi inafafanua nahau hiyo.
- source_word: אֲשֶׁר תֹּאמַר
  choice: wewe uliyesema
  rationale: Kifungu hiki kinamtaja wazi Gaali kuwa ndiye aliyetoa kauli iliyofuata, na muundo huu ni wa kawaida katika Kiswahili.
- source_word: מִי אֲבִימֶלֶךְ כִּי נַעַבְדֶנּוּ
  choice: Abimeleki ni nani hata tumtumikie?
  rationale: Neno 'hata' linaendeleza nguvu ya swali la dharau bila kulifanya kuwa ombi au pendekezo.
- source_word: הֲלֹא זֶה הָעָם
  choice: Je, hawa si wale watu
  rationale: Inadumisha swali la balagha huku ikitumia upatanisho wa kawaida wa Kiswahili kwa kundi la watu.
- source_word: מָאַסְתָּה בּוֹ
  choice: uliowadharau
  rationale: Kitenzi kinaonyesha kukataa kwa dharau; 'dharau' linafaa sauti ya kejeli na makabiliano hapa.
- source_word: צֵא נָא עַתָּה
  choice: Toka sasa
  rationale: Amri hiyo inamtaka Gaali atoke kukabiliana na jeshi; נָא ina nguvu ya msisitizo au himizo hapa, si ombi la adabu.
- source_word: וְהִלָּחֶם בּוֹ
  choice: ukapigane nao
  rationale: Kiwakilishi cha Kiebrania ni umoja kisarufi lakini kinarejelea הָעָם, jina la mkusanyiko. Kiswahili cha kawaida hutumia wingi kwa watu hao.
