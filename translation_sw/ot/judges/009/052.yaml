  yaml_path: translation/ot/judges/009/052.yaml
  text: Abimelech came up to the tower and fought against it, and he came near to the entrance of the tower to burn it with fire.
translation:
  language: sw
  text: Abimeleki akafika kwenye mnara na kuupiga vita. Akakaribia mlango wa mnara ili kuuteketeza kwa moto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא ... עַד הַמִּגְדָּל
  choice: akafika kwenye mnara
  rationale: Muundo unaonyesha kufika mpaka kwenye mnara; Kiswahili hiki ni cha kawaida na hakiongezi wazo lisilo wazi la kupanda.
- source_word: וַיִּלָּחֶם בּוֹ
  choice: kuupiga vita
  rationale: Kiwakilishi cha Kiebrania kinarejelea mnara; usemi huu unahifadhi tendo la kupigana dhidi yake.
- source_word: פֶּתַח הַמִּגְדָּל
  choice: mlango wa mnara
  rationale: פֶּתַח ni sehemu ya kuingilia au uwazi wa kuingilia; 'mlango' ni neno la kawaida na la asili katika muktadha huu.
- source_word: לְשָׂרְפוֹ בָאֵשׁ
  choice: ili kuuteketeza kwa moto
  rationale: Inahifadhi kusudi la Abimeleki na msisitizo wa Kiebrania kwamba alitaka kuuchoma mnara kwa moto.
