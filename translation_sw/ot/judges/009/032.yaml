  text: Now then[a], arise by night, you and the people who are with you[b], and lie in wait in the field.
translation:
  language: sw
  text: Sasa basi, inuka usiku[a], wewe pamoja na watu walio nawe, mkaotee shambani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa usiku.” Usemi wa Kiebrania unaonyesha tendo linalofanyika usiku, bila kulazimisha maana ya “usiku wa leo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mvizie.” Kitenzi cha Kiebrania humaanisha kuotea au kuvizia, yaani kuchukua mahali pa kungojea kwa shambulio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Ni kiashiria cha mpito kinachoanzisha agizo la haraka; “Basi sasa” huwasilisha nguvu ya וְ pamoja na עַתָּה kwa Kiswahili cha kawaida.
- source_word: קוּם
  choice: inuka
  rationale: Kitenzi cha amri kwa nafsi ya pili umoja; “inuka” hudumisha agizo la moja kwa moja bila kukifanya kimaanishe tu kuanza safari.
- source_word: לַיְלָה
  choice: wakati wa usiku
  rationale: Ni usemi wa wakati unaoonyesha kwamba hatua ifanyike usiku, lakini hautaji kwa lazima usiku huohuo.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi kilicho wazi katika Kiebrania kimehifadhiwa ili kuonyesha msisitizo kwa anayeelekezwa.
- source_word: וְהָעָם אֲשֶׁר אִתָּךְ
  choice: na watu walio pamoja nawe
  rationale: “Watu” ni tafsiri ya moja kwa moja ya עָם; ingawa katika muktadha ni kikosi, “wanajeshi” au “askari” ingeongeza ufafanuzi usiotajwa wazi.
- source_word: וֶאֱרֹב
  choice: ukajifiche kwa kuvizia
  rationale: Kitenzi ארב humaanisha kujificha au kukaa mahali kwa kusudi la kuvizia. Usemi huu wa Kiswahili unaonyesha kuchukua nafasi ya kuvizia, si shambulio lenyewe.
- source_word: בַּשָּׂדֶה
  choice: shambani
  rationale: שָׂדֶה kwa kawaida ni shamba au eneo la wazi; “shambani” ni tafsiri ya moja kwa moja inayofaa mazingira ya mbinu ya kijeshi.
