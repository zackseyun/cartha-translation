  yaml_path: translation/ot/judges/009/008.yaml
  text: The trees once went to anoint a king over themselves[a], and they said to the olive tree, ‘Reign over us.’
translation:
  language: sw
  text: Miti ilikwenda[a] kumtia mafuta mfalme awatawale. Ikauambia mzeituni, “Tawale juu yetu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia muundo wa msisitizo, kwa maana halisi, “kwenda ilikwenda”; pia yaweza kutafsiriwa, “Miti kweli ilikwenda” au “Miti ilianza safari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלֹוךְ הָלְכוּ
  choice: iliondoka
  rationale: Muundo wa kitenzi-jina halisi pamoja na kitenzi kilichokamilika unasisitiza kuondoka kwa miti. ‘Iliondoka’ ni simulizi la kawaida na la asili kwa Kiswahili; tanbihi inahifadhi msisitizo wa Kiebrania bila kutumia uradidi usio wa kawaida.
- source_word: הָעֵצִים
  choice: Miti
  rationale: Wingi huu unarejelea miti katika mfano wa Yothamu; upatanisho wa ngeli ya mi-/i- umetumiwa katika simulizi.
- source_word: לִמְשֹׁחַ
  choice: kumweka kwa kumtia mafuta
  rationale: ‘Kumtia mafuta’ huhifadhi tendo halisi la uwekaji katika wadhifa, huku ‘kumweka’ ikifanya kusudi lake la kifalme lieleweke kwa Kiswahili cha kawaida.
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: mfalme wa kuitawala
  rationale: Kirai hiki kinaonyesha kwamba mfalme angekuwa na mamlaka juu ya miti. Umbo la urejeshi ‘i-’ linarejelea miti kama kundi na huepuka kirai kisicho cha kawaida ‘mfalme juu yao’.
- source_word: וַיֹּאמְרוּ לַזַּיִת
  choice: Ikauambia mzeituni
  rationale: Muendelezo wa kisimulizi umehifadhiwa kwa ‘ika-’; ‘mzeituni’ ni jina la kawaida la mti wa zeituni na ndiye anayesemeshwa katika mfano.
- source_word: מְלֹכָה עָלֵינוּ
  choice: Tawale juu yetu
  rationale: Amri ‘Tawale’ inaonyesha kutenda kama mfalme, na ‘juu yetu’ huhifadhi maana ya mamlaka ya kifalme juu ya wanaotawaliwa.
