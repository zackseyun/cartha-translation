translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imetumia mtiririko wa simulizi ulio wa kawaida, huku sitiari ya Kiebrania ya hasira kuwaka ikihifadhiwa na kufafanuliwa katika tanbihi.
