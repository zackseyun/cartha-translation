base_translation:
  language: en
  yaml_path: translation/ot/judges/009/030.yaml
  text: When Zebul[a], the ruler of the city, heard the words of Gaal son of Ebed, his anger burned.
translation:
  language: sw
  text: Zebuli, mtawala wa mji, aliposikia maneno ya Gaali mwana wa Ebeli, hasira yake ikawaka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “pua yake ikawaka,” nahau yenye maana ya “alikasirika” au “hasira yake ikawaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: aliposikia
  rationale: Muundo huu unaendeleza simulizi na hapa unaonyesha kwamba kusikia maneno ya Gaali kulitangulia kuwaka kwa hasira ya Zebuli; “aliposikia” ni Kiswahili cha kawaida na cha asili.
- source_word: זְבֻל
  choice: Zebuli
  rationale: Jina limetoholewa kwa tahajia inayofaa muundo wa Kiswahili.
- source_word: שַׂר הָעִיר
  choice: mtawala wa mji
  rationale: שַׂר humaanisha kiongozi, mkuu, au mwenye mamlaka. “Mtawala” linaonyesha mamlaka yake ya kiraia bila kulazimisha cheo maalumu cha kisasa kama “gavana.”
- source_word: אֶת דִּבְרֵי
  choice: maneno ya
  rationale: Tafsiri hii inadumisha usemi halisi wa Kiebrania na ni ya kawaida katika simulizi la Kiswahili.
- source_word: גַּעַל בֶּן עָבֶד
  choice: Gaali mwana wa Ebedi
  rationale: Majina yametoholewa kwa Kiswahili, huku muundo wa nasaba “mwana wa” ukihifadhiwa.
- source_word: וַיִּחַר אַפּוֹ
  choice: hasira yake ikawaka
  rationale: Usemi wa Kiebrania kwa maana halisi unahusisha kuwaka kwa pua/hasira. Kiswahili hiki kinahifadhi sitiari ya kuwaka huku kikitoa maana wazi ya kukasirika.
