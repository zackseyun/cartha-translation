  yaml_path: translation/ot/judges/009/050.yaml
  text: Then Abimelech went to Thebez[a], camped against Thebez, and captured it.
translation:
  language: sw
  text: Kisha Abimeleki akaenda Tebesi, akapiga kambi dhidi ya Tebesi,[a] akauteka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akapiga kambi katika Tebesi.” Kihusishi cha Kiebrania kinaweza kutafsiriwa hivyo kihalisi, lakini katika mazingira haya ya kijeshi yaelekea kinamaanisha kwamba alipiga kambi dhidi ya mji huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Kitenzi הלך katika mfululizo wa masimulizi kina maana ya kawaida ya kwenda; ‘akaenda’ hakiongezi wazo la kijeshi lisilotajwa moja kwa moja.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleki
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: אֶל
  choice: Tebesi
  rationale: Kihusishi אֶל kinaonyesha mwendo kuelekea mahali; katika Kiswahili maana hiyo inaelezwa kwa kawaida bila kihusishi cha ziada baada ya ‘akaenda’.
- source_word: תֵּבֵץ
  choice: Tebesi
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: וַיִּחַן
  choice: akapiga kambi
  rationale: חנה humaanisha kupiga au kuweka kambi; ‘akapiga kambi’ ni usemi wa sasa na wa kawaida wa Kiswahili.
- source_word: בְּתֵבֵץ
  choice: dhidi ya Tebesi
  rationale: Ingawa בְּ mara nyingi humaanisha ‘katika,’ katika mazingira haya ya kijeshi inaweza kuonyesha kupiga kambi kwenye mji kwa nia ya kuushambulia; ‘dhidi ya’ huwasilisha mkao huo bila kuficha uwezekano wa tafsiri halisi, ambao umewekwa katika tanbihi.
- source_word: וַיִּלְכְּדָהּ
  choice: akauteka
  rationale: לכד hutumiwa kwa kuuteka mji. Kiambishi ‘-u-’ kinarejelea mji wa Tebesi na kutoa Kiswahili cha asili.
