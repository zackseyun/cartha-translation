  text: Wanaume wa Israeli waliona kwamba Abimeleki alikuwa amekufa, kila mmoja akaenda mahali pake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: walipoona
  rationale: Kitenzi ראה hapa kinaonyesha kuona kunakoleta kutambua hali; “walipoona” ni ya kawaida katika simulizi la Kiswahili na huunganisha kwa asili na tendo linalofuata.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: watu wa Israeli
  rationale: Ingawa אִישׁ ni umoja wa kiume, hapa imetumiwa kwa maana ya kundi pamoja na vitenzi vya wingi. “Watu wa Israeli” huwasilisha maana hiyo ya pamoja kwa Kiswahili sanifu bila kuifanya kuwa “kila Mwisraeli,” jambo ambalo lingetanguliza mno wazo la ugawaji.
- source_word: כִּי
  choice: kwamba
  rationale: 'כִּי inatambulisha yaliyotambuliwa walipoona: kwamba Abimeleki alikuwa amekufa.'
- source_word: מֵת
  choice: alikuwa amekufa
  rationale: Neno hili linaeleza hali ya Abimeleki kuwa mfu wakati walipotambua jambo hilo. Kiswahili “alikuwa amekufa” huwasilisha hali hiyo kwa njia ya kawaida katika muktadha wa simulizi.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleki
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya kibiblia katika Kiswahili.
- source_word: וַיֵּלְכוּ
  choice: akaenda
  rationale: הלך humaanisha kwa kawaida “kwenda.” Umoja wa “akaenda” unapatana na kiima cha ugawaji “kila mmoja”; “akarudi” lingeongeza wazo ambalo halijasemwa wazi.
- source_word: אִישׁ לִמְקֹמוֹ
  choice: kila mmoja akaenda mahali pake
  rationale: אִישׁ baada ya kitenzi cha wingi ina maana ya ugawaji, ambayo Kiswahili huiwasilisha vizuri kwa “kila mmoja.” מָקוֹם ni “mahali,” si lazima “nyumbani,” hivyo “mahali pake” huhifadhi upana wa asili.
