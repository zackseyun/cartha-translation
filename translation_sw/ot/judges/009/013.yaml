source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הַ/גֶּ֔פֶן הֶ/חֳדַ֨לְתִּי֙ אֶת תִּ֣ירוֹשִׁ֔/י הַֽ/מְשַׂמֵּ֥חַ אֱלֹהִ֖ים וַ/אֲנָשִׁ֑ים וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/013.yaml
  text: But the vine said to them[a], ‘Should I stop producing my new wine, which gladdens gods and men, and go to sway over the trees?’
translation:
  language: sw
  text: Lakini mzabibu ukawaambia, “Je, niache kutoa divai yangu mpya, inayofurahisha miungu na wanadamu,[a] na niende kuyumbayumba juu ya miti?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “inayomfurahisha Mungu na wanadamu.”
    reason: Usomaji mwingine unaowezekana wa אֱלֹהִים kama jina la umoja “Mungu” badala ya wingi “miungu”.
lexical_decisions:
- source_word: הַגֶּפֶן
  choice: mzabibu
  rationale: Ni mmea unaozungumza katika mfano wa Yothamu; ‘mzabibu’ ni neno la kawaida na lenye hadhi katika Kiswahili.
- source_word: הֶחֳדַלְתִּי
  choice: Je, niache kutoa
  rationale: Kauli timilifu ya nafsi ya kwanza inatumika hapa kama swali la kujadiliana. ‘Kutoa’ huonyesha kwa njia ya asili uhusiano na ‘divai yangu mpya’ bila kubadili maana.
- source_word: תִּירוֹשִׁי
  choice: divai yangu mpya
  rationale: תִּירוֹשׁ kwa kawaida humaanisha divai mpya au changa; tafsiri hii huhifadhi tofauti yake na neno la jumla la divai.
- source_word: הַמְשַׂמֵּחַ
  choice: inayofurahisha
  rationale: Huhifadhi maana ya kisababishi ya kitenzi na hueleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: אֱלֹהִים וַאֲנָשִׁים
  choice: miungu na wanadamu
  rationale: אֱלֹהִים ina umbo la wingi, na katika mazingira ya kifasihi ya mfano huu inaweza kurejelea miungu. ‘Wanadamu’ ni ya asili na inajumuisha maana ya jumla ya אֲנָשִׁים.
- source_word: וְהָלַכְתִּי
  choice: ili niende
  rationale: 'Huendeleza swali la kusudi kwa Kiswahili cha asili: kuacha kutoa divai ili kwenda kufanya jambo jingine.'
- source_word: לָנוּעַ
  choice: kuyumbayumba
  rationale: Huhifadhi taswira ya mwendo wa huku na huku wa mmea, huku muktadha wa kuwa juu ya miti ukidokeza utawala.
- source_word: עַל הָעֵצִים
  choice: juu ya miti
  rationale: Huhifadhi kwa makusudi maana mbili zinazowezekana za nafasi juu ya miti na mamlaka juu yao katika mfano.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika usemi ‘inayofurahisha אֱלֹהִים na wanadamu’
  choice: miungu
  alternative: Mungu
  rationale: Umbo la Kiebrania ni la wingi, na mazingira ya mfano yanaweza kuunga mkono maana ya viumbe vya kiungu au miungu. Hata hivyo, ‘Mungu’ ni usomaji wa jadi unaowezekana, kwa hiyo umehifadhiwa katika tanbihi badala ya kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la balagha na taswira ya mzabibu unaoyumbayumba juu ya miti vimehifadhiwa; tanbihi inadumisha utata halisi wa אֱלֹהִים.
