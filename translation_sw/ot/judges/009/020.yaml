  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִם אַ֕יִן תֵּ֤צֵא אֵשׁ֙ מֵ/אֲבִימֶ֔לֶךְ וְ/תֹאכַ֛ל אֶת בַּעֲלֵ֥י שְׁכֶ֖ם וְ/אֶת בֵּ֣ית מִלּ֑וֹא וְ/תֵצֵ֨א אֵ֜שׁ מִ/בַּעֲלֵ֤י שְׁכֶם֙ וּ/מִ/בֵּ֣ית מִלּ֔וֹא וְ/תֹאכַ֖ל אֶת אֲבִימֶֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/020.yaml
  text: But if not[a], let fire come out from Abimelech and consume the leaders of Shechem and Beth-millo[b]; and let fire come out from the leaders of Shechem and from Beth-millo and consume Abimelech.
translation:
  language: sw
  text: Lakini ikiwa sivyo, moto utoke kwa Abimeleki na uwateketeze viongozi wa Shekemu[a] na Beth-Milo[b]; na moto utoke kwa viongozi wa Shekemu na kwa Beth-Milo, na umteketeze Abimeleki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mabwana wa Shekemu.” Usemi wa Kiebrania unawahusu watawala au viongozi mashuhuri wa mji huo.
    reason: lexical_alternative
  - marker: b
    text: Beth-Milo pia inaweza kutafsiriwa “nyumba ya Milo”; huenda ni mahali au kundi la watawala lililohusishwa na Shekemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם אַיִן
  choice: Lakini ikiwa sivyo
  rationale: Hutoa mpito wa masharti wenye ukinzani unaoendeleza kauli ya Yothamu kutoka mstari uliotangulia.
- source_word: תֵּצֵא אֵשׁ
  choice: moto na utoke
  rationale: Muundo huu wa Kiswahili huwasilisha nguvu ya ombi la laana ya yiqtol bila kuifanya iwe utabiri wa kawaida tu.
- source_word: מֵאֲבִימֶלֶךְ
  choice: kwa Abimeleki
  rationale: Huhifadhi wazo la moto kutoka kwa Abimeleki kwa Kiswahili cha kawaida.
- source_word: וְתֹאכַל
  choice: na kuwateketeza
  rationale: Kitenzi אכל kinapotumiwa kuhusu moto humaanisha kuteketeza au kuangamiza; 'kuteketeza' hudumisha taswira ya moto.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: viongozi wa Shekemu
  rationale: Katika muktadha huu neno hilo linawahusu watu wenye mamlaka au wakuu mashuhuri wa mji, si wakazi wote tu.
- source_word: בֵּית מִלּוֹא
  choice: Beth-Milo
  rationale: Limetoholewa kama jina la mahali au kundi lililojulikana, huku tanbihi ikihifadhi uwezekano wa maana halisi ya muundo wa Kiebrania.
- source_word: וְתֵצֵא אֵשׁ מִבַּעֲלֵי שְׁכֶם וּמִבֵּית מִלּוֹא
  choice: nao moto utoke kwa viongozi wa Shekemu na kwa Beth-Milo
  rationale: Huhifadhi ulinganifu wa laana ya pande mbili na kishazi cha kwanza.
- source_word: אֶת אֲבִימֶלֶךְ
  choice: Abimeleki
  rationale: Ni yambwa ya moja kwa moja ya kitenzi cha mwisho na huhitimisha muundo wa kuangamizana.
theological_decisions:
- issue: Asili ya taswira ya “moto”
  choice: Kudumisha “moto” kama taswira halisi ya kileksia ndani ya laana, bila kuifafanua katika matini kuwa sitiari tu au moto wa Mungu moja kwa moja.
  alternative: Kuitafsiri wazi kuwa mapigano ya kikatili, au kuwa hukumu ya Mungu iliyoelezwa moja kwa moja.
  rationale: Kiebrania kinatumia taswira thabiti ya moto. Muktadha unaashiria kuangamizana, lakini tafsiri haipaswi kuondoa utata wa iwapo moto huo ni wa kisitiari, halisi, au vyote viwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa pande mbili umehifadhiwa ili kuonyesha laana ya kuangamizana; majina yametoholewa kwa maumbo yanayoeleweka katika Kiswahili.
