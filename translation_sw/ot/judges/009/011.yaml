base_translation:
  language: en
  yaml_path: translation/ot/judges/009/011.yaml
  text: But the fig tree said to them[a], ‘Should I stop producing my sweetness and my good fruit, and go to sway over the trees?’
translation:
  language: sw
  text: Lakini mtini ukawaambia, “Je, niache utamu wangu na matunda yangu mazuri, kisha niende kuyumbayumba juu ya miti?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutawala miti.” Kitenzi cha Kiebrania humaanisha kihalisi “kuyumba” au “kusogea”; hivyo kinahifadhi taswira ya mti huku katika fumbo kikidokeza utawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lakini ... ukawaambia
  rationale: Waw ya usimulizi inaendeleza hadithi, huku “Lakini” ikionyesha tofauti ya jibu hili la kukataa na mwaliko uliotolewa.
- source_word: הַתְּאֵנָה
  choice: mtini
  rationale: Nomino hii humaanisha mti wa tini; “mtini” ni neno la kawaida na la asili katika Kiswahili.
- source_word: הֶחֳדַלְתִּי
  choice: Je, niache
  rationale: 'Kauli timilifu katika swali hili la balagha ina nguvu ya kujadiliana: “Je, niache...?”'
- source_word: מָתְקִי
  choice: utamu wangu
  rationale: Huhifadhi moja kwa moja dhana ya utamu na lugha ya kumfanya mtini kuwa kama mtu, bila kuibadili tu kuwa “matunda matamu.”
- source_word: תְּנוּבָתִי הַטּוֹבָה
  choice: matunda yangu mazuri
  rationale: Kwa mtini, “matunda” ni tafsiri ya kawaida ya mazao yake, na “mazuri” huhifadhi kivumishi cha Kiebrania.
- source_word: וְהָלַכְתִּי
  choice: kisha niende
  rationale: Huendeleza swali la balagha kwa Kiswahili cha kawaida na kuonyesha hatua inayofuata.
- source_word: לָנוּעַ
  choice: kuyumbayumba
  rationale: Kitenzi נוע humaanisha kusogea, kutikisika, au kuyumba. Tafsiri hii huhifadhi taswira ya mti unaoyumba, huku muktadha wa fumbo ukidokeza mamlaka.
- source_word: עַל הָעֵצִים
  choice: juu ya miti mingine
  rationale: “Juu ya” huhifadhi uwezekano wa nafasi na mamlaka; “mingine” hufanya rejeo lieleweke kwa kuwa msemaji mwenyewe ni mti.
theological_decisions:
- issue: Taswira ya kuyumba dhidi ya maana ya kutawala katika fumbo
  choice: kuyumbayumba juu ya miti mingine
  alternative: kutawala miti mingine
  rationale: Maandishi ya Kiebrania yanatumia kitenzi cha kusogea au kuyumba, ambacho katika fumbo kinadokeza utawala. Maandishi makuu yanahifadhi taswira hiyo, na tanbihi inaeleza maana inayowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mtini” na “matunda” ni maneno yanayoeleweka kwa urahisi; “kuyumbayumba” huhifadhi mchezo wa picha wa fumbo bila kuficha maana ya utawala, ambayo imefafanuliwa katika tanbihi.
