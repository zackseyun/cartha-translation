  yaml_path: translation/ot/judges/009/041.yaml
  text: And Abimelech stayed in Arumah[a], and Zebul drove Gaal and his brothers out from dwelling in Shechem.
translation:
  language: sw
  text: Abimeleki akakaa Aruma, naye Zebuli akawafukuza Gali na ndugu zake, wasiweze kukaa Shekemu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawafukuza Gali na ndugu zake wasikae Shekemu.” Muundo wa Kiebrania unaonyesha kwamba walizuiwa kukaa huko.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: akakaa
  rationale: Kitenzi ישׁב kinaweza kumaanisha kukaa, kuishi, au kubaki. Katika muktadha huu, “akakaa” ni cha kawaida na hakiashirii kwa lazima makazi ya kudumu.
- source_word: בָּארוּמָה
  choice: Aruma
  rationale: Jina la mahali limetoholewa kwa matamshi yanayofaa katika Kiswahili; kiambishi cha mahali kinaeleweka pamoja na kitenzi “kukaa.”
- source_word: וַיְגָרֶשׁ
  choice: akawafukuza
  rationale: גרשׁ huonyesha kuwatoa au kuwafukuza watu mahali; “akawafukuza” ni ya kawaida na inadumisha nguvu ya tendo hilo.
- source_word: זְבֻל
  choice: Zebuli
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida katika Kiswahili.
- source_word: גַּעַל
  choice: Gaali
  rationale: Jina la mtu limetoholewa kwa Kiswahili huku likidumisha kwa kadiri inayowezekana umbo la Kiebrania.
- source_word: אֶחָיו
  choice: ndugu zake
  rationale: אח kwa msingi humaanisha ndugu wa kiume, lakini wingi wa Kiswahili “ndugu zake” ni wa kawaida na unaweza kubeba maana ya kifamilia bila kuingiza maana ya washirika isiyothibitishwa.
- source_word: מִשֶּׁבֶת
  choice: wasiweze kukaa
  rationale: Muundo wa מן pamoja na kitenzi-jina cha ישׁב unaonyesha kuzuiwa au kuondolewa katika hali ya kukaa mahali; “wasiweze kukaa” huwasilisha matokeo hayo kwa Kiswahili cha kawaida.
- source_word: בִּשְׁכֶם
  choice: Shekemu
  rationale: Jina la mahali limetoholewa kwa desturi ya Kiswahili; mahali panabainishwa na muundo wa kitenzi “kukaa Shekemu.”
