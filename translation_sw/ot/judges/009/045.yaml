  source_fidelity: 'Tafsiri inafuata kwa uaminifu mfuatano na maana ya Kiebrania: Abimeleki alipigana dhidi ya mji siku hiyo yote, akauteka, akawaua watu waliokuwamo, akaubomoa, na akaipanda chumvi. “Dhidi ya” ni uwasilishaji sahihi wa maana ya kijeshi ya נלחם ב katika muktadha huu, bila kuifanya kuwa tafsiri ya lazima ya “kushambulia.”'
