  text: וַ/אֲבִימֶ֜לֶךְ נִלְחָ֣ם בָּ/עִ֗יר כֹּ֚ל הַ/יּ֣וֹם הַ/ה֔וּא וַ/יִּלְכֹּד֙ אֶת הָ/עִ֔יר וְ/אֶת הָ/עָ֥ם אֲשֶׁר בָּ֖/הּ הָרָ֑ג וַ/יִּתֹּץ֙ אֶת הָ/עִ֔יר וַ/יִּזְרָעֶ֖/הָ מֶֽלַח־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/045.yaml
  text: And Abimelech fought against the city all that day[a], and he captured the city and killed the people who were in it[b]. Then he tore down the city and sowed it with salt.
translation:
  language: sw
  text: Abimeleki akapigana dhidi ya mji huo siku ile yote[a]. Akauteka mji, akawaua watu waliokuwa ndani yake. Kisha akaubomoa mji na kuupanda chumvi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaushambulia mji huo.” Kitenzi cha Kiebrania humaanisha kihalisi “kupigana,” na pamoja na kihusishi kilichotumiwa hapa huenda kinamaanisha kuchukua hatua za kijeshi dhidi ya mji.
    reason: lexical_alternative
  - marker: b
    text: “Kuupanda chumvi” ulikuwa tendo la ishara lililoonyesha uharibifu na laana, likitia alama kwamba mji ulikuwa umeangamizwa.
    reason: cultural_note
lexical_decisions:
- source_word: נִלְחָם בָּעִיר
  choice: akapigana dhidi ya mji huo
  rationale: Kitenzi נלחם pamoja na ב katika muktadha huu wa vita kinaeleza kupigana dhidi ya mji. Tafsiri hii inadumisha maana halisi ya ‘kupigana’ bila kuifasiri moja kwa moja kuwa ‘kuushambulia.’
- source_word: כֹּל הַיּוֹם הַהוּא
  choice: siku ile yote
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayoonyesha kwamba mapigano yaliendelea katika muda wote wa siku hiyo maalumu.
- source_word: וַיִּלְכֹּד
  choice: akauteka
  rationale: Katika muktadha wa kijeshi, לכד humaanisha kuutwaa au kuuteka mji; ‘akauteka’ ni wazi na ya kawaida.
- source_word: הָעָם אֲשֶׁר בָּהּ
  choice: watu waliokuwa ndani yake
  rationale: Kauli hii inarejelea watu waliokuwamo mjini, bila kuongeza dhana ya kikabila au kufafanua zaidi ya maandishi.
- source_word: הָרָג
  choice: akawaua
  rationale: Kitenzi הרג humaanisha kuua; umbo la Kiswahili linaonyesha wazi kwamba waliouawa ni watu waliotajwa.
- source_word: וַיִּתֹּץ
  choice: akaubomoa
  rationale: נתץ hueleza kubomoa au kuangusha majengo; ‘akaubomoa mji’ ni ya asili na inafaa uharibifu wa mji.
- source_word: וַיִּזְרָעֶהָ מֶלַח
  choice: kuupanda chumvi
  rationale: Tafsiri hii inadumisha picha halisi ya Kiebrania ya ‘kuupanda’ mji chumvi badala ya kuibadili kuwa ‘kuunyunyizia chumvi.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Viunganishi vya usimulizi vya ‘aka-’ vinatunza mfuatano wa matendo, huku picha ya Kiebrania ya kupanda chumvi ikihifadhiwa.
