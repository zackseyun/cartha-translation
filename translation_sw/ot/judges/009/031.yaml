base_translation:
  language: en
  yaml_path: translation/ot/judges/009/031.yaml
  text: And he sent messengers to Abimelek secretly[a], saying, “Look, Gaal son of Ebed and his brothers have come to Shechem, and look, they are besieging the city against you.”
translation:
  language: sw
  text: Naye akatuma wajumbe kwa Abimeleki kwa siri[a], akisema, “Tazama, Gaali mwana wa Ebedi na ndugu zake wamefika Shekemu, na tazama, wanauchochea mji dhidi yako[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa hila.” Neno la Kiebrania linaweza kumaanisha tendo la siri au la udanganyifu.
    reason: lexical_alternative
  - marker: b
    text: Au “wanaufanya mji uwe dhidi yako.” Kitenzi cha Kiebrania ni kigumu; wengine hukielewa kwa maana ya karibu zaidi ya “wanauzingira mji,” lakini katika muktadha huenda kinamaanisha kuuchochea mji umpinge Abimeleki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Naye akatuma
  rationale: Ka- ya usimulizi huendeleza mtiririko wa matukio kwa Kiswahili; ‘naye’ hudumisha kiunganishi cha Kiebrania bila kufanya sentensi kuwa nzito.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu wa kisiasa na kijeshi ni watu waliotumwa kupeleka ujumbe, si malaika.
- source_word: אֶל אֲבִימֶלֶךְ
  choice: kwa Abimeleki
  rationale: Hueleza kwa kawaida mlengwa wa ujumbe kwa Kiswahili; jina limetoholewa kwa tahajia inayosomeka kwa Waswahili.
- source_word: בְּתָרְמָה
  choice: kwa siri
  rationale: Neno gumu linaonyesha ujumbe wa kificho au wa hila; ‘kwa siri’ huwasilisha hali ya kuficha bila kuongeza hukumu nzito ya kimaadili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Ni utangulizi wa kawaida na wa asili wa maneno ya moja kwa moja katika usimulizi wa Kiswahili.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Huhifadhi nguvu ya neno la kuvuta usikivu katika sajili yenye heshima lakini inayoeleweka.
- source_word: גַעַל בֶּן עֶבֶד
  choice: Gaali mwana wa Ebedi
  rationale: Muundo wa nasaba umetafsiriwa moja kwa moja, huku majina yakitoholewa kwa mfumo wa sauti wa Kiswahili.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: Huhifadhi maana ya msingi ya ‘ndugu zake’ bila kuamua kama ni ndugu wa damu, jamaa, au washirika wa karibu.
- source_word: בָּאִים שְׁכֶמָה
  choice: wamefika Shekemu
  rationale: Hali timilifu inaonyesha kuwa walifika na sasa wapo huko, jambo linalopatana na shughuli yao inayofuata.
- source_word: וְהִנָּם
  choice: nao
  rationale: Kiunganishi hiki cha Kiswahili huendeleza taarifa yenye msisitizo kwa urahisi; kurudia ‘tazama’ hapa kungekuwa na uzito usio wa lazima.
- source_word: צָרִים אֶת הָעִיר עָלֶיךָ
  choice: wanauchochea mji dhidi yako
  rationale: Kitenzi ni kigumu katika muktadha huu. Sintaksia na simulizi la uasi zinaunga mkono wazo la kuwashawishi au kuwafanya watu wa mji wamwendee Abimeleki kinyume, huku tanbihi ikihifadhi uwezekano wa maana halisi ya kuuzingira mji.
