  text: וַ/יֵּצְא֨וּ הַ/שָּׂדֶ֜ה וַֽ/יִּבְצְר֤וּ אֶת כַּרְמֵי/הֶם֙ וַֽ/יִּדְרְכ֔וּ וַֽ/יַּעֲשׂ֖וּ הִלּוּלִ֑ים וַ/יָּבֹ֨אוּ֙ בֵּ֣ית אֱֽלֹֽהֵי/הֶ֔ם וַ/יֹּֽאכְלוּ֙ וַ/יִּשְׁתּ֔וּ וַֽ/יְקַלְל֖וּ אֶת אֲבִימֶֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/027.yaml
  text: And they went out into the field and gathered the grapes from their vineyards and trod them[a], and they held a festival[b]. Then they went into the house of their god and ate and drank and cursed Abimelek.
translation:
  language: sw
  text: Nao wakatoka kwenda mashambani, wakachuma zabibu katika mashamba yao ya mizabibu, wakazikanyaga, wakafanya sherehe[a]. Kisha wakaingia katika nyumba ya mungu wao[b], wakala, wakanywa, wakamlaani Abimeleki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakafanya sherehe za mavuno” au “wakafurahi.” Neno la Kiebrania linamaanisha maadhimisho ya furaha, huenda yakihusiana na mavuno ya zabibu.
    reason: lexical_alternative
  - marker: b
    text: Au, “nyumba ya miungu yao.” Umbo la Kiebrania linaweza kusomwa kwa wingi, ingawa hapa huenda lina maana ya umoja na linarejelea mungu aliyeabudiwa mahali hapo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ הַשָּׂדֶה
  choice: wakatoka kwenda mashambani
  rationale: Kiambishi cha mwelekeo katika הַשָּׂדֶה kinaonyesha kutoka mjini au makazi na kuelekea eneo la mashamba. “Kwenda mashambani” ni Kiswahili cha kawaida na huhifadhi wazo la mwendo kuelekea huko.
- source_word: וַיִּבְצְרוּ אֶת כַּרְמֵיהֶם
  choice: wakachuma zabibu katika mashamba yao ya mizabibu
  rationale: בצר katika muktadha wa mizabibu humaanisha kuchuma zabibu hasa, si kuvuna mazao kwa ujumla. Kutaja zabibu wazi kunafanya maana ieleweke kwa urahisi.
- source_word: וַיִּדְרְכוּ
  choice: wakazikanyaga
  rationale: דרך hapa hurejelea kukanyaga zabibu ili kukamua maji yake. Kiwakilishi “-zi-” kinarejelea zabibu zilizotajwa bila kuongeza maelezo yasiyokuwapo katika chanzo.
- source_word: וַיַּעֲשׂוּ הִלּוּלִים
  choice: wakafanya sherehe
  rationale: הִלּוּלִים humaanisha maadhimisho ya furaha, huenda yaliyounganishwa na mavuno ya zabibu. “Wakafanya sherehe” ni lugha ya sasa na yenye kueleweka, huku tanbihi ikihifadhi uwezekano wa maana nyingine.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: nyumba ya mungu wao
  rationale: “Nyumba” inafuata sitiari ya Kiebrania kwa karibu kuliko “hekalu,” ambalo lingekuwa tafsiri fafanuzi zaidi. אֱלֹהֵיהֶם ina umbo linaloweza kueleweka kwa wingi, lakini muktadha unaelekea kuonyesha mungu mmoja wa mahali hapo.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: wakala, wakanywa
  rationale: Tafsiri ya moja kwa moja huhifadhi mfuatano wa matendo na haiongezi wazo la karamu, ingawa muktadha unaweza kulidokeza.
- source_word: וַיְקַלְלוּ אֶת אֲבִימֶלֶךְ
  choice: wakamlaani Abimeleki
  rationale: קלל katika kauli hii humaanisha kulaani, jambo lenye nguvu zaidi kuliko kumtukana tu. Kiambishi cha yambwa “-m-” huhifadhi tendo lililoelekezwa moja kwa moja kwa Abimeleki.
theological_decisions:
- issue: Maana ya אֱלֹהֵיהֶם katika muktadha wa ibada ya kipagani
  choice: mungu wao
  alternative: miungu yao
  rationale: Ingawa umbo la neno linaweza kusomwa kwa wingi, muktadha unaelekea kurejelea mungu maalumu aliyeabudiwa katika nyumba hiyo. Umoja umetumiwa katika matini, na uwezekano wa wingi umehifadhiwa katika tanbihi bila kuingiza msimamo wa kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa maandiko. Vitenzi vinavyofuatana kwa “waka-” vinahifadhi mfuatano wa masimulizi ya Kiebrania. “Mashamba yao ya mizabibu” ni wazi zaidi kwa msomaji wa kawaida kuliko istilahi fupi isiyozoeleka, na “nyumba ya mungu wao” huhifadhi picha ya chanzo bila kuifafanua moja kwa moja kuwa hekalu.
