base_translation:
  language: en
  yaml_path: translation/ot/judges/009/042.yaml
  text: And it happened on the next day that the people went out into the field[a], and it was reported to Abimelek.
translation:
  language: sw
  text: Ikawa siku iliyofuata, watu walitoka kwenda shambani, naye Abimeleki akapewa habari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Kesho yake
  rationale: Kirai hiki kinatoa kwa Kiswahili cha kawaida mpito wa kisimulizi na maana ya siku iliyofuata, bila kutumia muundo mzito wa moja kwa moja kama ‘ikawa siku iliyofuata.’
- source_word: וַיֵּצֵא
  choice: walitoka kwenda
  rationale: Kitenzi יצא kinaonyesha kutoka mahali walipokuwa; ‘walitoka kwenda’ huunganika kwa kawaida na mahali pa kufikiwa katika Kiswahili.
- source_word: הָעָם
  choice: watu
  rationale: עם ni nomino ya pamoja inayowarejelea watu kwa jumla, si wanaume pekee.
- source_word: הַשָּׂדֶה
  choice: shambani
  rationale: שׂדה hapa ni eneo la wazi au la kilimo nje ya mji; ‘shambani’ ni usemi wa kawaida na unaofaa katika muktadha.
- source_word: וַיַּגִּדוּ
  choice: nao wakamjulisha
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu wingi. Kiswahili kinaweza kudumisha wingi huo kwa kawaida; kiwakilishi ‘nao’ kinaweza kurejelea watu waliotoka, ingawa katika Kiebrania mtendaji anaweza kuwa asiyeainishwa.
- source_word: לַאֲבִימֶלֶךְ
  choice: Abimeleki
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili, huku kiambishi cha yambwa katika ‘wakamjulisha’ kikitoa maana ya לְ.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa kisimulizi ni wa sasa, rahisi na wenye heshima. Hakuna tanbihi iliyohitajika, kwa kuwa muundo wa wingi wa Kiebrania unaweza kutolewa moja kwa moja na kwa ufasaha katika Kiswahili.
