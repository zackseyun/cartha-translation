source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הָ/אָטָד֮ אֶל הָ/עֵצִים֒ אִ֡ם בֶּ/אֱמֶ֣ת אַתֶּם֩ מֹשְׁחִ֨ים אֹתִ֤/י לְ/מֶ֨לֶךְ֙ עֲלֵי/כֶ֔ם בֹּ֖אוּ חֲס֣וּ בְ/צִלִּ֑/י וְ/אִם אַ֕יִן תֵּ֤צֵא אֵשׁ֙ מִן הָ֣/אָטָ֔ד וְ/תֹאכַ֖ל אֶת אַרְזֵ֥י הַ/לְּבָנֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/015.yaml
  text: Then the bramble said to the trees[a], ‘If you are truly anointing me as king over you, come, take refuge in my shade; but if not[c][b], let fire come out from the bramble and consume the cedars of Lebanon.’
translation:
  language: sw
  text: Ndipo kichaka cha miiba[a] kikawaambia miti, “Ikiwa kweli mnanitia mafuta niwe mfalme juu yenu, njooni, mkimbilie kivuli changu[b]. Lakini ikiwa sivyo, moto utoke[c] katika kichaka cha miiba na kuiteketeza mierezi ya Lebanoni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mmea wenye miiba.” Neno la Kiebrania אָטָד humaanisha kichaka au mmea wenye miiba.
    reason: lexical_alternative
  - marker: b
    text: “Mkimbilie kivuli changu” pia inaweza kutafsiriwa “tafuteni hifadhi chini ya kivuli changu.” Maneno haya huenda yana kejeli, kwa kuwa kichaka cha miiba hakitoi kivuli halisi cha kutosha.
    reason: lexical_alternative
  - marker: c
    text: Au “moto utatoka.” Kitenzi cha Kiebrania kinaweza kueleweka kama kauli ya matakwa yenye nguvu au laana, au kama taarifa ya jambo litakalotokea.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָטָד
  choice: kichaka cha miiba
  rationale: Neno hili humaanisha kichaka au mmea wenye miiba. “Kichaka cha miiba” ni Kiswahili cha kawaida na hudumisha tofauti ya kimakusudi kati yake na miti mikubwa katika mfano huu.
- source_word: אִם בֶּאֱמֶת
  choice: Ikiwa kweli
  rationale: Hueleza sharti linalohusu unyofu au uhalisi wa tendo; “ikiwa kweli” ni ya asili na huhifadhi changamoto iliyomo.
- source_word: מֹשְׁחִים אֹתִי לְמֶלֶךְ
  choice: mnanitia mafuta niwe mfalme
  rationale: Huhifadhi taswira halisi ya kitendo cha kifalme cha kutia mafuta badala ya kukirahisisha kuwa kumteua mtu tu.
- source_word: עֲלֵיכֶם
  choice: juu yenu
  rationale: Katika muktadha wa ufalme, kirai hiki huonyesha mamlaka ya kutawala; “juu yenu” huhifadhi muundo na maana hiyo.
- source_word: בֹּאוּ חֲסוּ
  choice: njooni mkimbilie
  rationale: Kitenzi חוס kina wazo la kukimbilia mahali kwa ajili ya hifadhi na ulinzi. “Mkimbilie” ni usemi wa sasa na wa kawaida unaobeba maana hiyo.
- source_word: בְצִלִּי
  choice: kivuli changu
  rationale: צֵל ni kivuli au mahali penye kinga. Tafsiri hii pia huacha kejeli ya kichaka kidogo kudai kuwa na kivuli cha kuwahifadhi miti.
- source_word: וְאִם אַיִן
  choice: Lakini ikiwa sivyo
  rationale: Huleta matokeo yaliyo kinyume na sharti la kwanza kwa Kiswahili wazi na cha kawaida.
- source_word: תֵּצֵא אֵשׁ מִן הָאָטָד
  choice: moto na utoke katika kichaka cha miiba
  rationale: Muundo wa “na utoke” huhifadhi uwezekano wa kauli hii kuwa laana au matakwa yenye nguvu, bila kuifunga kuwa utabiri wa wakati ujao pekee.
- source_word: וְתֹאכַל
  choice: na kuiteketeza
  rationale: Kitenzi cha kula kinapotumiwa kuhusu moto humaanisha kuangamiza kwa kuunguza; “kuteketeza” ni usemi wa asili na wenye uzito unaofaa.
- source_word: אַרְזֵי הַלְּבָנוֹן
  choice: mierezi ya Lebanoni
  rationale: Ni tafsiri ya moja kwa moja ya kirai kinachotaja mierezi mikubwa na mashuhuri ya Lebanoni.
theological_decisions:
- issue: Nguvu ya kitenzi תֵּצֵא katika tishio
  choice: moto na utoke
  alternative: moto utatoka
  rationale: Kiebrania kinaweza kusikika kama tamko la matakwa/laana au kama utabiri. Matini kuu huhifadhi nguvu ya kimatakwa, na tanbihi inataja uwezekano wa utabiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mtindo wa mfano wa kifalme, taswira ya kutia mafuta, na kejeli ya kichaka cha miiba kuwapa miti hifadhi chini ya kivuli chake.
