  yaml_path: translation/ot/judges/009/026.yaml
  text: Then Gaal son of Ebed came with his brothers and crossed into Shechem[c][b][a], and the leaders of Shechem put their trust in him.
translation:
  language: sw
  text: Kisha Gaal mwana wa Ebedi akaja pamoja na ndugu zake, wakaingia Shekemu,[a] na viongozi wa Shekemu[b] wakamtumaini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakapita katika Shekemu” au “wakavuka kuingia Shekemu”; kitenzi cha Kiebrania kinaweza kumaanisha kuvuka au kupita, na maana kamili hapa si dhahiri.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “mabwana wa Shekemu”; hapa neno la Kiebrania linawahusu watu wa mji wenye mamlaka au ushawishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Kisha ... akaja
  rationale: Waw ya usimulizi inaendeleza mfululizo wa matukio; “Kisha” na “akaja” ni Kiswahili cha kawaida kinachohifadhi mwendo wa simulizi.
- source_word: גַּעַל בֶּן עֶבֶד
  choice: Gaali mwana wa Ebedi
  rationale: Majina yametoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili, huku muundo wa nasaba “mwana wa” ukihifadhiwa.
- source_word: וְאֶחָיו
  choice: pamoja na ndugu zake
  rationale: Ingawa kiunganishi cha Kiebrania ni “na,” katika muktadha huu ndugu zake wanaandamana naye; “pamoja na” huwasilisha hilo kwa Kiswahili cha asili.
- source_word: וַיַּעַבְרוּ בִּשְׁכֶם
  choice: wakaingia Shekemu
  rationale: Kitenzi עבר kina wazo la kuvuka au kupita, na בְּ pamoja na jina la mahali hapa huweza kueleza mwendo wa kuingia au kupita katika mji. “Wakaingia” ni cha kawaida katika muktadha, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: וַיִּבְטְחוּ בוֹ
  choice: wakamtumaini
  rationale: בטח pamoja na בְּ huonyesha kumtegemea au kumwekea mtu imani; “wakamtumaini” ni usemi mfupi na wa kawaida unaohifadhi uhusiano huo.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: viongozi wa Shekemu
  rationale: Neno בעלי likitumiwa kuhusu mji humaanisha watu wake wenye mamlaka au ushawishi, si lazima wakazi wote. “Viongozi” hueleza maana hiyo wazi katika Kiswahili cha sasa.
