base_translation:
  language: en
  yaml_path: translation/ot/judges/009/056.yaml
  text: Thus God repaid Abimelech for the evil that he had done to his father by killing his seventy brothers[a].
translation:
  language: sw
  text: Hivyo Mungu akamrudishia Abimeleki uovu aliomtendea baba yake kwa kuwaua ndugu zake sabini[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu akaurudisha juu ya Abimeleki uovu wake.” Nahau ya Kiebrania inaeleza Mungu akifanya uovu wa Abimeleki umrudie yeye mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: akamlipiza
  rationale: Hifili ya שׁוב hapa ina maana ya kusababisha uovu umrudie mhusika, yaani kumlipa kwa tendo lake. ‘Akamlipiza’ ni Kiswahili cha kawaida kinachoonyesha tendo la hukumu na nguvu ya kisababishi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la nomino ni la wingi, kitenzi na muktadha humrejelea Mungu mmoja; kwa hiyo ‘Mungu’ ndiyo tafsiri inayofaa.
- source_word: רָעַת
  choice: uovu
  rationale: Katika muktadha huu neno linaonyesha ubaya wa kimaadili wa tendo la Abimeleki, si madhara tu.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleki
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: אֲשֶׁר עָשָׂה
  choice: aliomtendea
  rationale: Muundo huu wa Kiswahili unaunganisha kwa kawaida uovu na mtu aliyeathiriwa, huku ukihifadhi maana ya tendo lililofanywa.
- source_word: לְאָבִיו
  choice: baba yake
  rationale: Kihusishi ל kinamtaja mtu aliyeathiriwa na uovu; ‘aliomtendea baba yake’ huwasilisha uhusiano huo kwa Kiswahili fasaha.
- source_word: לַהֲרֹג
  choice: kwa kuwaua
  rationale: Kitenzi-jina chenye ל kinafafanua tendo lililokuwa uovu huo; ‘kwa kuwaua’ huonyesha namna au maudhui yake bila kulazimisha tofauti hiyo ya kisintaksia.
- source_word: שִׁבְעִים אֶחָיו
  choice: ndugu zake sabini
  rationale: ‘Ndugu’ katika Kiswahili inaweza kuwa pana, lakini hapa muktadha wa wana wa baba mmoja unaonyesha ndugu wa kiume; mpangilio huu ni wa kawaida na huhifadhi idadi na uhusiano.
- source_word: וַ
  choice: Hivyo
  rationale: Ingawa kiunganishi kimsingi ni ‘na,’ hapa kinaanzisha hitimisho la masimulizi; ‘Hivyo’ huonyesha matokeo hayo kwa lugha ya kawaida.
theological_decisions:
- issue: Utendaji wa Mungu katika hukumu
  choice: Mungu ndiye aliyemlipiza Abimeleki kwa uovu wake.
  alternative: Mungu aliruhusu tu uovu wa Abimeleki umrudie.
  rationale: Kiebrania humweka Mungu wazi kuwa kiima cha kitenzi cha kusababisha uovu kurudi. Tafsiri haipunguzi kauli hiyo ya utendaji wa moja kwa moja wa Mungu katika hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya masimulizi na inaeleweka kwa msomaji wa kawaida. ‘Akamlipiza’ imetumiwa bila kuongeza ‘kisasi,’ ili kuepuka maana za ziada na kuhifadhi picha ya nahau ya Kiebrania katika tanbihi.
