translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha simulizi, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mfululizo wa ‘aka-’ umehifadhi mwendo wa haraka wa simulizi la Kiebrania. Alama ya tanbihi [a] imewekwa mara tu baada ya kirai kinachoifafanua.
