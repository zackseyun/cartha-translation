base_translation:
  language: en
  yaml_path: translation/ot/judges/009/043.yaml
  text: He took the people[a], divided them into three companies, and lay in wait in the field. When he saw that the people were coming out of the city, he rose up against them and struck them down.
translation:
  language: sw
  text: Akawachukua watu, akawagawa katika vikosi vitatu,[a] akavizia shambani. Alipoona watu wakitoka mjini, akawashambulia na kuwaangusha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “katika vichwa vitatu”; hii ni nahau ya Kiebrania inayomaanisha makundi au vikosi vitatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח אֶת־הָעָם
  choice: Akawachukua watu wake
  rationale: עָם kwa msingi humaanisha ‘watu,’ lakini katika simulizi hili la kijeshi inarejelea watu waliokuwa chini ya Abimeleki. ‘Watu wake’ ni Kiswahili cha kawaida kinachoweka wazi rejeo la kimuktadha bila kuwaita moja kwa moja wanajeshi.
- source_word: וַיֶּחֱצֵם לִשְׁלֹשָׁה רָאשִׁים
  choice: akawagawa katika vikosi vitatu
  rationale: חצה ni ‘gawa,’ na רָאשִׁים, kwa neno halisi ‘vichwa,’ hapa ni nahau ya sehemu au makundi ya kijeshi. ‘Vikosi vitatu’ ni ya asili na inafaa muktadha.
- source_word: וַיֶּאֱרֹב בַּשָּׂדֶה
  choice: akavizia shambani
  rationale: ארב huonyesha kusubiri kwa kujificha ili kushambulia. ‘Kuvizia’ huwasilisha maana hiyo kwa ufupi; בַּשָּׂדֶה ni ‘shambani/uwandani,’ na ‘shambani’ ni ya kawaida hapa.
- source_word: וַיַּרְא וְהִנֵּה
  choice: Alipoona
  rationale: Muundo wa simulizi pamoja na הִנֵּה unaleta ugunduzi wa jambo lililokuwa likitokea. ‘Alipoona’ ni wa asili katika Kiswahili na huunganisha tukio hilo na shambulio linalofuata.
- source_word: הָעָם יֹצֵא מִן־הָעִיר
  choice: watu wakitoka mjini
  rationale: Kitenzi shirikishi יֹצֵא kinaonyesha kitendo kinachoendelea wakati wa kuona. ‘Wakitoka’ huhifadhi hali hiyo; מִן־הָעִיר kwa kawaida ni ‘mjini’ katika Kiswahili.
- source_word: וַיָּקָם עֲלֵיהֶם
  choice: akawashambulia
  rationale: קום על ni nahau ya kuinuka dhidi ya mtu, yaani kumshambulia. Tafsiri ya moja kwa moja ‘akainuka dhidi yao’ si ya kawaida sana katika Kiswahili cha sasa, hivyo ‘akawashambulia’ hutoa maana ya kimuktadha.
- source_word: וַיַּכֵּם
  choice: na kuwaangusha
  rationale: נכה inaweza kumaanisha kupiga, kushinda, au kuua kulingana na muktadha. ‘Kuwaangusha’ huonyesha kipigo kikali na cha ushindi bila kudai wazi kwamba wote waliuawa.
