id: JDG.9.2
reference: Judges 9:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: דַּבְּרוּ נָ֞א בְּ/אָזְנֵ֨י כָל בַּעֲלֵ֣י שְׁכֶם֮ מַה טּ֣וֹב לָ/כֶם֒ הַ/מְשֹׁ֨ל בָּ/כֶ֜ם שִׁבְעִ֣ים אִ֗ישׁ כֹּ֚ל בְּנֵ֣י יְרֻבַּ֔עַל אִם מְשֹׁ֥ל בָּ/כֶ֖ם אִ֣ישׁ אֶחָ֑ד וּ/זְכַרְתֶּ֕ם כִּֽי עַצְמֵ/כֶם וּ/בְשַׂרְ/כֶ֖ם אָנִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/002.yaml
  text: 'Please speak in the hearing of all the leaders of Shechem: Which is better for you—that seventy men[a], all the sons of Jerubbaal, rule over you, or that one man rule over you? And remember that I am your bone and your flesh.'
translation:
  language: sw
  text: 'Tafadhali waambieni wakuu wote wa Shekemu: “Ni lipi lililo bora kwenu—kutawaliwa na wanaume sabini, ambao wote ni wana wa Yerubaali, au kutawaliwa na mtu mmoja? Kumbukeni kwamba mimi ni mfupa wenu na nyama yenu.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mfupa wenu na nyama yenu”; ni nahau inayomaanisha kuwa yeye ni ndugu yao wa damu au jamaa yao wa karibu.
    reason: Nahau halisi imehifadhiwa katika matini, hivyo maana yake ya undugu inafafanuliwa kwa msomaji.
lexical_decisions:
- source_word: דַּבְּרוּ נָא בְּאָזְנֵי
  choice: Tafadhali semeni mbele ya
  rationale: Kauli ya ombi pamoja na nahau ya kusema ‘masikioni mwa’ imetolewa kwa Kiswahili cha kawaida kinachoonyesha kuwa ujumbe usemwe wazi mbele ya wasikilizaji.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: wakuu wote wa Shekemu
  rationale: בַּעֲלֵי hapa inaashiria watu wenye mamlaka au ushawishi katika mji. ‘Wakuu’ inaweka maana hiyo bila kutumia ‘mabwana,’ ambalo lingeweza kudokeza umiliki usiokusudiwa kwa uhakika.
- source_word: מַה טּוֹב לָכֶם
  choice: Ni lipi lililo bora kwenu
  rationale: Muktadha unaweka chaguzi mbili katika ulinganisho; swali hili linaonyesha ulinganisho huo kwa Kiswahili cha asili.
- source_word: הַמְשֹׁל בָּכֶם ... מְשֹׁל בָּכֶם
  choice: wawatawale ... awatawale
  rationale: Kitenzi משל katika muktadha huu ni kutawala kisiasa. Urudiaji wa kitenzi umehifadhiwa.
- source_word: שִׁבְעִים אִישׁ כֹּל בְּנֵי יְרֻבַּעַל
  choice: wanaume sabini, yaani wana wote wa Yerubaali
  rationale: ‘Wanaume’ huhifadhi jinsia inayotajwa na אִישׁ na inayothibitishwa na ‘wana’; ‘yaani’ huonyesha kwamba wana hao ndio wale sabini.
- source_word: אִישׁ אֶחָד
  choice: mtu mmoja
  rationale: Katika Kiswahili, ‘mtu mmoja’ ni usemi wa kawaida na hapa rejeo lake kwa mwanamume linaeleweka kutokana na muktadha wa Abimeleki na ulinganisho na wana wa Yerubaali.
- source_word: וּזְכַרְתֶּם
  choice: Kumbukeni
  rationale: Kauli hii ina nguvu ya agizo kwa wingi na inadumisha uzito wa rufaa ya Abimeleki kwa undugu.
- source_word: עַצְמֵכֶם וּבְשַׂרְכֶם
  choice: mfupa wenu na nyama yenu
  rationale: Taswira halisi ya nahau ya Kiebrania imehifadhiwa badala ya kufupishwa kuwa ‘jamaa yenu’; tanbihi inaeleza maana yake.
theological_decisions:
- issue: Nahau ya undugu na uwezekano wa kuifafanua kupita kiasi
  choice: Kuhifadhi ‘mfupa wenu na nyama yenu’ katika matini
  alternative: mimi ni mtu wa damu yenu; mimi ni jamaa yenu wa karibu
  rationale: Kauli halisi huhifadhi taswira na nguvu ya madai ya undugu katika Kiebrania, huku tanbihi ikitoa maana bila kubadili matini kuwa ufafanuzi.
- issue: Lugha ya kijinsia kuhusu wana wa Yerubaali
  choice: wanaume sabini ... mtu mmoja
  alternative: watu sabini ... mtu mmoja
  rationale: אִישׁ na muktadha wa wana wa kiume wa Yerubaali zinaunga mkono ‘wanaume sabini.’ Kwa umoja, ‘mtu mmoja’ ni Kiswahili cha asili na muktadha unabainisha kuwa ni mwanamume.
- issue: Utambulisho wa בַּעֲלֵי שְׁכֶם
  choice: wakuu wa Shekemu
  alternative: wenyeji wa Shekemu; mabwana wa Shekemu; raia wa Shekemu
  rationale: Neno linaweza kumaanisha wenye mamlaka, wenye mali, au kundi la raia wenye hadhi. ‘Wakuu’ linafaa kwa jukumu lao la kiraia katika simulizi, bila kudai kwa uhakika kwamba ni wakazi wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la balagha na urudiaji wa ‘wawatawale/awatawale’ umehifadhiwa. Jina Yerubaali limetoholewa kwa mfumo unaosomeka kwa urahisi.
