base_translation:
  language: en
  yaml_path: translation/ot/judges/009/037.yaml
  text: Gaal spoke again and said[a], “Look, people are coming down from the center of the land[b], and one company is coming by the way of the Oak of the Soothsayers.”
translation:
  language: sw
  text: Gaali akasema tena, “Tazama, watu wanashuka kutoka katikati ya nchi[a], na kundi moja linakuja kwa njia ya Mwaloni wa Waaguzi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “kitovu cha nchi,” yaani sehemu ya kati ya nchi.
    reason: lexical_alternative
  - marker: b
    text: Au “Mti wa Terebinthi wa Wabashiri,” au jina la mahali, “Mwaloni wa Meonenimu.” Maana ya jina hili la mwisho si hakika; huenda linawarejelea waaguzi au wabashiri.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד גַּעַל לְדַבֵּר
  choice: Gaali akasema tena
  rationale: Muundo wa Kiebrania una maana halisi ya ‘akaongeza tena kusema,’ lakini katika Kiswahili cha kawaida unaeleweka kwa urahisi na kwa usahihi kama ‘akasema tena.’
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira za msikilizaji kwa jambo linaloonekana; ‘Tazama’ linadumisha nguvu hiyo katika lugha yenye hadhi na inayoeleweka.
- source_word: עָם יֹרְדִים
  choice: watu wanashuka
  rationale: עָם ni ‘watu’ bila kulazimisha maana mahususi ya kijeshi, na kitenzi kishirikishi kinaonyesha mwendo unaoendelea unaoonekana na Gaali.
- source_word: מֵעִם טַבּוּר הָאָרֶץ
  choice: kutoka katikati ya nchi
  rationale: טַבּוּר maana yake halisi ni ‘kitovu,’ lakini hapa ni sitiari ya eneo la kati; tafsiri kuu inatoa maana huku tanbihi ikihifadhi taswira ya Kiebrania.
- source_word: וְרֹאשׁ אֶחָד
  choice: na kundi moja
  rationale: Ingawa רֹאשׁ maana yake ya msingi ni ‘kichwa,’ hapa inaashiria sehemu au kikosi kimoja cha watu wanaokuja. ‘Kundi moja’ ni la asili na haliongezi kwa lazima maana ya kijeshi.
- source_word: מִדֶּרֶךְ
  choice: kwa njia ya
  rationale: Kirai hiki kinaonyesha njia au upande ambao kundi linapitia.
- source_word: אֵלוֹן מְעוֹנְנִים
  choice: Mwaloni wa Waaguzi
  rationale: Kirai kinaonekana kutumiwa kama jina la mahali. אֵלוֹן linaweza kumaanisha mwaloni, mti wa terebinthi, au mti mkubwa; מְעוֹנְנִים huenda linahusiana na uaguzi, lakini maana na namna ya jina hilo si hakika, hivyo tofauti zimewekwa katika tanbihi.
