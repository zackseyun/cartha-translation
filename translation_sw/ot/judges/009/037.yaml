  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Tafsiri imetumia sentensi ya moja kwa moja inayofaa taarifa ya Gaali kuhusu anachokiona, huku sitiari ya ‘kitovu’ na utata wa jina la mahali vikihifadhiwa katika tanbihi.
