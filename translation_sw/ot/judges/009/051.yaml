  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia mtiririko wa masimulizi unaoeleweka kwa wasomaji wa kawaida; ‘humo’ hurejelea mnara, na alama zote za tanbihi zimewekwa katika matini kuu.
