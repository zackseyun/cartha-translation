  text: וּ/מִגְדַּל עֹז֮ הָיָ֣ה בְ/תוֹךְ הָ/עִיר֒ וַ/יָּנֻ֨סוּ שָׁ֜מָּ/ה כָּל הָ/אֲנָשִׁ֣ים וְ/הַ/נָּשִׁ֗ים וְ/כֹל֙ בַּעֲלֵ֣י הָ/עִ֔יר וַֽ/יִּסְגְּר֖וּ בַּעֲדָ֑/ם וַֽ/יַּעֲל֖וּ עַל גַּ֥ג הַ/מִּגְדָּֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/051.yaml
  text: But there was a strong tower in the middle of the city[a], and all the men and women and all the leaders of the city fled there and shut themselves in[b], and they went up onto the roof of the tower.
translation:
  language: sw
  text: Lakini kulikuwa na mnara imara katikati ya mji[a]. Wanaume wote, wanawake wote, na wakuu wote wa mji[b] wakakimbilia humo na kujifungia ndani; kisha wakapanda juu ya paa la mnara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnara ulioimarishwa.” Kirai cha Kiebrania kwa maana halisi huunganisha “mnara” na “nguvu,” kikisisitiza uimara wake wa kujihami.
    reason: lexical_alternative
  - marker: b
    text: Au, “watu wote mashuhuri wa mji.” Neno la Kiebrania kwa maana halisi ni “wenye” au “mabwana wa mji”; katika muktadha huu huenda linamaanisha wakazi wenye hadhi au viongozi wa mji, si lazima wakazi wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  choice: mnara imara
  rationale: Kirai hiki huunganisha ‘mnara’ na ‘nguvu,’ hivyo ‘mnara imara’ ni Kiswahili cha asili kinachoonyesha uwezo wake wa kujihami bila kuifanya iwe sitiari.
- source_word: בְּתוֹךְ הָעִיר
  choice: katikati ya mji
  rationale: Huhifadhi maana ya mahali ya בְּתוֹךְ, yaani ‘katikati’ au ‘ndani kabisa,’ kwa usahihi zaidi kuliko kusema tu ‘ndani ya mji.’
- source_word: וַיָּנֻסוּ שָׁמָּה
  choice: wakakimbilia humo
  rationale: נוּס humaanisha kukimbia ili kuuepuka hatari. ‘Wakakimbilia humo’ huonyesha mwendo kuelekea mnara uliotajwa bila kuongeza wazi wazo la kupata hifadhi.
- source_word: כָּל הָאֲנָשִׁים וְהַנָּשִׁים
  choice: wanaume wote na wanawake wote
  rationale: Tafsiri hii huhifadhi kutajwa kwa makundi yote mawili kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: וְכֹל בַּעֲלֵי הָעִיר
  choice: pamoja na wakuu wote wa mji
  rationale: בַּעֲלֵי kwa maana halisi ni ‘wenye’ au ‘mabwana,’ lakini katika muktadha huu wa kiraia huenda inawataja watu wenye mamlaka au hadhi mjini. ‘Wakuu wa mji’ hutoa maana hiyo, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: וַיִּסְגְּרוּ בַעֲדָם
  choice: na kujifungia ndani
  rationale: Kirai hiki kina maana ya kujifungia au kufunga nyuma yao. Kiswahili hiki huonyesha kujisitiri kwao ndani bila kuongeza kitu kama ‘mlango,’ ambacho hakitajwi wazi katika Kiebrania.
- source_word: וַיַּעֲלוּ עַל גַּג הַמִּגְדָּל
  choice: kisha wakapanda juu ya paa la mnara
  rationale: עָלָה ni ‘kupanda/kwenda juu,’ na גַּג ni ‘paa’; tafsiri hii huhifadhi mwendo pamoja na sehemu mahususi ya jengo.
