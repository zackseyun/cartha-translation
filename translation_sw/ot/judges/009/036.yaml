translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye hadhi. Majina ‘Gaali’ na ‘Zebuli’ yameandikwa kwa umbo linalosomeka kwa kawaida katika Kiswahili. Tafsiri haijaongeza ‘askari’ au ‘jeshi,’ kwa kuwa hayo hayajasemwa wazi katika Kiebrania.
