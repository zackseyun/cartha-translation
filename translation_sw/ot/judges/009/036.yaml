base_translation:
  language: en
  yaml_path: translation/ot/judges/009/036.yaml
  text: When Gaal saw the people[a], he said to Zebul, “Look, people are coming down from the tops of the mountains.” But Zebul said to him, “You are seeing the shadow of the mountains as men.”
translation:
  language: sw
  text: Gaal alipowaona watu, akamwambia Zebuli, “Tazama! Watu wanateremka kutoka vilele vya milima.” Lakini Zebuli akamwambia, “Unaona kivuli cha milima kana kwamba ni wanaume.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Unaona kivuli cha milima kuwa wanaume.”
    reason: Hutoa kwa Kiswahili fasaha usomaji wa karibu wa kifungu cha Kiebrania, ambapo kivuli ndicho kinachoonekana kuwa wanaume.
lexical_decisions:
- source_word: וַיַּרְא
  choice: alipowaona
  rationale: Kitenzi ראה katika simulizi kinamaanisha kuona; umbo la Kiswahili linaunganisha kwa kawaida tendo hili na kauli inayofuata.
- source_word: הָעָם / עָם
  choice: watu
  rationale: עָם humaanisha ‘watu’; ingawa hapa ni kundi linalokaribia kwa kusudi la mapigano, Kiebrania hakisemi wazi ‘jeshi’ au ‘askari’.
- source_word: הִנֵּה
  choice: Tazama!
  rationale: Ni neno la kuvuta usikivu katika usemi wa moja kwa moja; ‘Tazama!’ ni la sasa, wazi, na lenye hadhi.
- source_word: יוֹרֵד
  choice: wanateremka
  rationale: Ingawa kitenzi cha Kiebrania ni umoja kwa sababu עָם ni nomino ya jumla, Kiswahili hutumia upatanisho wa wingi pamoja na ‘watu’.
- source_word: מֵרָאשֵׁי הֶהָרִים
  choice: kutoka vilele vya milima
  rationale: רֹאשׁ hapa hurejelea sehemu za juu au vilele vya milima; tafsiri hii ni sahihi na ya kawaida katika Kiswahili.
- source_word: צֵל הֶהָרִים
  choice: kivuli cha milima
  rationale: צֵל ni ‘kivuli’; umoja wa Kiebrania umehifadhiwa, na ‘cha milima’ linaonyesha chanzo cha kivuli hicho.
- source_word: אַתָּה רֹאֶה כָּאֲנָשִׁים
  choice: Unaona ... kana kwamba ni wanaume
  rationale: Kauli inaonyesha kwamba Zebuli anadai Gaali amekosea katika alichokiona. ‘Kana kwamba’ huwasilisha ulinganisho huo bila kuufanya kuwa uhakika.
- source_word: אֲנָשִׁים
  choice: wanaume
  rationale: Nomino ni wingi wa kiume na, katika mazingira haya ya kijeshi, inaelekea kumaanisha watu wa kiume; ‘wanaume’ huhifadhi maana hiyo.
