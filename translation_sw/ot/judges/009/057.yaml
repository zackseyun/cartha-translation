base_translation:
  language: en
  yaml_path: translation/ot/judges/009/057.yaml
  text: And God repaid all the evil of the men of Shechem on their own heads, and the curse of Jotham son of Jerubbaal came upon them.
translation:
  language: sw
  text: Mungu akauurudisha uovu wote wa watu wa Shekemu juu ya vichwa vyao wenyewe, nayo laana ya Yothamu mwana wa Yerubaali ikawapata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵשִׁיב
  choice: akauwarudisha
  rationale: Hifili ya שוב hapa inaonyesha Mungu akisababisha uovu wao uwarudie kama adhabu. Neno hili linahifadhi wazo la kurudishwa bila kupunguza utendaji wa Mungu.
- source_word: רָעַת
  choice: uovu wote
  rationale: Katika muktadha huu רעה ni ubaya wa kimaadili walioutenda watu wa Shekemu, si msiba tu. Umoja wa kisarufi wa Kiebrania umehifadhiwa kwa kutumia “uovu,” huku כָּל ikitafsiriwa “wote.”
- source_word: בְּרֹאשָׁם
  choice: juu ya vichwa vyao wenyewe
  rationale: Hii inahifadhi taswira ya Kiebrania ya matokeo ya uovu kuwarudia walioutenda na inaweka wazi mkazo wa kwamba yaliwarudia wao wenyewe.
- source_word: קִלֲלַת
  choice: laana
  rationale: Nomino hii inarejelea laana aliyotamka Yothamu mapema katika sura hii; “laana” ni tafsiri ya kawaida na sahihi katika Kiswahili.
- source_word: וַתָּבֹא אֲלֵיהֶם
  choice: ikawapata
  rationale: Katika lugha ya hukumu, kirai hiki kinaonyesha kuwa laana iliwafikia na kutimia dhidi yao. “Ikawapata” ni ya asili katika Kiswahili na inahifadhi maana hiyo.
- source_word: אַנְשֵׁי שְׁכֶם
  choice: watu wa Shekemu
  rationale: Ingawa אֲנָשִׁים ni ya kiume kisarufi, katika kirai cha wakazi wa mji “watu wa Shekemu” ni Kiswahili cha kawaida na hakiongezi wazo lisilokuwapo la kwamba walikuwa viongozi pekee.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Kitenzi cha umoja na muktadha vinaonyesha wazi kwamba neno hili linamrejelea Mungu anayetekeleza hukumu.
- source_word: יוֹתָם בֶּן יְרֻבָּעַל
  choice: Yothamu mwana wa Yerubaali
  rationale: Majina yametoholewa kwa mtindo wa kawaida wa Kiswahili, na uhusiano wa kifamilia umehifadhiwa moja kwa moja.
theological_decisions:
- issue: Lugha ya malipo ya hukumu ya Mungu
  choice: Mungu ndiye anayeurudisha uovu wao juu ya vichwa vyao wenyewe.
  alternative: Mungu aliruhusu tu uovu wao uwarudie.
  rationale: Katika Kiebrania Mungu ndiye kiima cha הֵשִׁיב, hivyo simulizi linamwonyesha akitenda hukumu moja kwa moja. Tafsiri hailegezi utendaji huo kuwa ruhusa tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Taswira ya Kiebrania “juu ya vichwa vyao wenyewe” imehifadhiwa kwa sababu ni wazi katika muktadha na ni muhimu kwa wazo la malipo ya uovu.
