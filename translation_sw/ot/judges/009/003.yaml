base_translation:
  language: en
  yaml_path: translation/ot/judges/009/003.yaml
  text: And his mother’s brothers spoke all these words about him in the hearing of all the leaders of Shechem[a], and their hearts turned after Abimelech, for they said[b], “He is our brother.”
translation:
  language: sw
  text: Ndugu wa kiume wa mama yake waliwaambia viongozi wote wa Shekemu[a] maneno haya yote[b] kumhusu. Mioyo yao ikamwelekea Abimeleki, kwa sababu walisema, “Yeye ni ndugu yetu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mabwana wote wa Shekemu” au “watu wote mashuhuri wa Shekemu.” Usemi wa Kiebrania unawahusu wanaume wenye ushawishi mjini.
    reason: lexical_alternative
  - marker: b
    text: Au “mambo haya yote.” Neno la Kiebrania linaweza kumaanisha maneno yaliyosemwa au mambo; hapa huenda linarejelea pendekezo lililotolewa katika mstari uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: wakasema
  rationale: Katika simulizi, kitenzi hiki pamoja na ‘maneno’ kinaonyesha kutoa ujumbe kwa mdomo; ‘wakasema’ ni Kiswahili cha kawaida na cha wazi.
- source_word: אֲחֵי אִמּוֹ
  choice: ndugu wa kiume wa mama yake
  rationale: Kirai hiki kinamaanisha ndugu wa kiume wa mama yake Abimeleki, si jamaa zake kwa ujumla.
- source_word: עָלָיו
  choice: kumhusu
  rationale: Hapa walizungumza habari za Abimeleki ili kuwashawishi watu wa Shekemu. ‘Kumhusu’ huhifadhi maana hiyo bila kuongeza wazi kwamba walikuwa mawakili wake.
- source_word: בְּאָזְנֵי
  choice: masikioni mwa
  rationale: Hii huhifadhi taswira ya Kiebrania, ‘katika masikio ya,’ na inaeleweka kuwa walizungumza mbele ya watu hao ili wasikie.
- source_word: כָּל בַּעֲלֵי שְׁכֶם
  choice: viongozi wote wa Shekemu
  rationale: בעלי inaweza kumaanisha mabwana, wenye mamlaka, au watu mashuhuri. Katika mazingira haya ya kisiasa, ‘viongozi’ huwasilisha vizuri nafasi yao ya ushawishi mjini.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: maneno haya yote
  rationale: דברים inaweza kumaanisha maneno au mambo. Hapa inarejelea ujumbe uliotolewa katika mstari uliotangulia, hivyo ‘maneno haya yote’ hudumisha uhusiano wa usemi huku tanbihi ikihifadhi maana mbadala.
- source_word: וַיֵּט לִבָּם
  choice: Mioyo yao ikamwelekea
  rationale: Nahau hiyo inaonyesha mwelekeo wa ndani au uamuzi wa kumpendelea Abimeleki. Kiswahili cha wingi ni cha kawaida ingawa Kiebrania kinatumia ‘moyo wao’ kwa maana ya pamoja.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: ikamwelekea Abimeleki
  rationale: Kiebrania hutumia taswira ya kuelekea au kufuata mtu kama ishara ya utii na uungaji mkono. ‘Kumwelekea’ ni ya asili katika Kiswahili na haiingizi maelezo zaidi ya maandishi.
- source_word: כִּי אָמְרוּ
  choice: kwa sababu walisema
  rationale: כִּי inaleta sababu iliyowafanya wamuunge mkono Abimeleki.
- source_word: אָחִינוּ הוּא
  choice: Yeye ni ndugu yetu
  rationale: ‘Ndugu’ huhifadhi moja kwa moja mwito wa mshikamano wa kifamilia; katika muktadha huo walimhesabu kuwa wa ukoo wao kupitia mama yake wa Shekemu.
