lexical_decisions:
- source_word: וַיָּשַׂר
  choice: akatawala
  rationale: Kitenzi kinamaanisha kutumia mamlaka au kutawala. “Akatawala” ni Kiswahili cha kawaida na cha moja kwa moja katika muktadha huu wa kisiasa.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleki
  rationale: Jina limetoholewa kwa namna inayotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: עַל
  choice: Israeli
  rationale: Pamoja na kitenzi “kutawala,” uhusiano wa mamlaka unaeleweka kwa kiswahili bila kulazimika kutafsiri kihusishi hiki kwa neno tofauti kama “juu ya.”
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Hili ndilo umbo la kawaida la jina la taifa katika Kiswahili Sanifu.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: kwa miaka mitatu
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili inayoonyesha muda ambao utawala ulidumu.
