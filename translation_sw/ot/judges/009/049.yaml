  text: וַ/יִּכְרְת֨וּ גַם כָּל הָ/עָ֜ם אִ֣ישׁ שׂוֹכֹ֗/ה וַ/יֵּ֨לְכ֜וּ אַחֲרֵ֤י אֲבִימֶ֨לֶךְ֙ וַ/יָּשִׂ֣ימוּ עַֽל הַ/צְּרִ֔יחַ וַ/יַּצִּ֧יתוּ עֲלֵי/הֶ֛ם אֶֽת הַ/צְּרִ֖יחַ בָּ/אֵ֑שׁ וַ/יָּמֻ֜תוּ גַּ֣ם כָּל אַנְשֵׁ֧י מִֽגְדַּל שְׁכֶ֛ם כְּ/אֶ֖לֶף אִ֥ישׁ וְ/אִשָּֽׁה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/049.yaml
  text: So all the people also cut down a branch each[a], and they went after Abimelech and piled them against the inner chamber, and set the inner chamber on fire over them, so that all the people of the tower of Shechem also died[b], about a thousand men and women.
translation:
  language: sw
  text: Basi watu wote nao wakakata matawi, kila mtu tawi lake,[a] wakamfuata Abimeleki. Wakayaweka juu ya sehemu ya ndani ya ngome,[b] kisha wakaitia moto sehemu hiyo juu yao. Hivyo watu wote wa mnara wa Shekemu wakafa, wanaume na wanawake wapatao elfu moja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “kila mtu tawi lake.”'
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza pia kutafsiriwa “ngome” au “chumba cha ndani”; huenda lilimaanisha sehemu iliyofungwa ya kujisitiri ndani ya mnara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ
  choice: wakakata
  rationale: Kitenzi כרת hapa kinaeleza kukata matawi; ‘wakakata’ ni cha kawaida na hakiongezi wazo lisilokuwamo la kuangusha mti mzima.
- source_word: אִישׁ שׂוֹכֹה
  choice: kila mmoja tawi lake
  rationale: Huhifadhi mgawanyo wa tendo kwa kila mtu na umoja wa nomino ‘tawi’ katika Kiebrania.
- source_word: וַיֵּלְכוּ אַחֲרֵי אֲבִימֶלֶךְ
  choice: wakamfuata Abimeleki
  rationale: Ingawa muundo halisi ni ‘wakaenda nyuma ya,’ katika simulizi hili una maana ya kufuata uongozi wake; ‘wakamfuata’ ni Kiswahili cha asili.
- source_word: הַצְּרִיחַ
  choice: sehemu ya ndani ya ngome
  rationale: Neno hili adimu linaonekana kumaanisha mahali pa ndani palipolindwa ambako watu walikimbilia, si mnara wote; tafsiri hii pia hulitofautisha na מִגְדַּל, ‘mnara.’
- source_word: וַיָּשִׂימוּ עַל הַצְּרִיחַ
  choice: wakayarundika matawi hayo kwenye sehemu ya ndani ya ngome
  rationale: ‘Wakayarundika’ huonyesha tendo la pamoja lililotangulia uchomaji. ‘Kwenye’ halilazimishi sana ikiwa matawi yaliwekwa juu ya sehemu hiyo au dhidi yake.
- source_word: וַיַּצִּיתוּ עֲלֵיהֶם אֶת הַצְּרִיחַ בָּאֵשׁ
  choice: wakaitia moto sehemu hiyo juu yao
  rationale: Huhifadhi picha ya kieneo ya עֲלֵיהֶם, ‘juu yao,’ bila kuamua zaidi ikiwa waliokuwa ndani walikuwa chini ya paa, chumba, au sehemu nyingine ya hifadhi.
- source_word: אַנְשֵׁי מִגְדַּל שְׁכֶם
  choice: watu wote wa mnara wa Shekemu
  rationale: Ingawa אַנְשֵׁי ina umbo la kiume, kishazi kinachofuata kinataja wazi wanaume na wanawake; ‘watu’ huwasilisha kundi lote bila kuleta mkanganyiko katika Kiswahili.
- source_word: כְּאֶלֶף
  choice: wapatao elfu moja
  rationale: Kiambishi כ־ kinaonyesha makadirio; ‘wapatao’ ni usemi wa kawaida na wenye hadhi.
- source_word: אִישׁ וְאִשָּׁה
  choice: wanaume na wanawake
  rationale: Hii ni tafsiri ya kawaida ya jozi hii inayosisitiza kwamba jinsia zote zilikuwa miongoni mwa waliokufa.
