revisions:
- from: Basi watu wote pia wakakata tawi, kila mmoja tawi lake,[a] wakamfuata Abimeleki. Wakayarundika matawi hayo kwenye sehemu ya ndani ya ngome,[b] kisha wakaitia moto sehemu hiyo juu yao. Hivyo, watu wote wa mnara wa Shekemu wakafa—wanaume na wanawake wapatao elfu moja.
  to: Basi watu wote nao wakakata matawi, kila mtu tawi lake,[a] wakamfuata Abimeleki. Wakayaweka juu ya sehemu ya ndani ya ngome,[b] kisha wakaitia moto sehemu hiyo juu yao. Hivyo watu wote wa mnara wa Shekemu wakafa, wanaume na wanawake wapatao elfu moja.
  rationale: Marekebisho yanaondoa marudio yasiyo ya kawaida katika sentensi ya kwanza, yanahifadhi idiomu ya mgawanyo ya Kiebrania kwa maelezo ya tanbihi, na yanatoa 'juu ya' kwa עַל. Taarifa ya tanbihi kuhusu הצריח imerahisishwa ili itoe mbadala wa kileksia bila kuwasilisha utambulisho wa muundo huo kama jambo la hakika.
