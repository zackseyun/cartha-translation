base_translation:
  language: en
  yaml_path: translation/ot/judges/009/005.yaml
  text: Then he went to his father’s house at Ophrah and killed his brothers[a], the sons of Jerubbaal—seventy men—on one stone. But Jotham, the youngest son of Jerubbaal, was left[c][b], because he hid himself.
translation:
  language: sw
  text: Kisha akaenda nyumbani kwa baba yake huko Ofra, akawaua ndugu zake, wana wa Yerubaali—wanaume sabini—juu ya jiwe moja.[a] Lakini Yothamu, mwana mdogo zaidi wa Yerubaali, alibaki hai, kwa sababu alikuwa amejificha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Juu ya jiwe moja” huenda ikamaanisha kwamba wote waliuawa katika sehemu moja ya kutekelezea mauaji, kwenye jiwe moja.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא בֵית אָבִיו עָפְרָתָה
  choice: akaenda nyumbani kwa baba yake huko Ofra
  rationale: Mfuatano wa simulizi unaendelezwa kwa “akaenda.” Ingawa kitenzi kwa msingi ni “akaja,” mwelekeo kuelekea Ofra na mtazamo wa simulizi hufanya “akaenda” kuwa Kiswahili cha kawaida. “Nyumbani kwa baba yake” linaweza kumaanisha makao ya baba bila kulazimisha maana ya ukoo mzima.
- source_word: וַיַּהֲרֹג
  choice: akawaua
  rationale: “Akawaua” hutoa maana ya msingi ya kuua na kukubaliana na kiambishi cha yambwa cha wingi kinachowarejelea ndugu zake, bila kuongeza istilahi ya kisheria isiyomo wazi katika kitenzi.
- source_word: אֶת אֶחָיו בְּנֵי יְרֻבַּעַל
  choice: ndugu zake, wana wa Yerubaali
  rationale: Kirai cha pili kinawatambulisha ndugu hao. Kutunza semi zote mbili kunahifadhi msisitizo na uwazi wa Kiebrania.
- source_word: שִׁבְעִים אִישׁ
  choice: wanaume sabini
  rationale: אִישׁ baada ya namba humaanisha wanaume au watu; hapa wanaotajwa ni wana wa Yerubaali, kwa hiyo “wanaume” ni sahihi na inaweka wazi idadi.
- source_word: עַל אֶבֶן אֶחָת
  choice: juu ya jiwe moja
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya taswira ya Kiebrania. Haielezi kimabavu kama jiwe hilo lilikuwa madhabahu, eneo, au kifaa cha mauaji.
- source_word: וַיִּוָּתֵר
  choice: alibaki hai
  rationale: Nifali inaweza kumaanisha kubaki au kuachwa. Katika muktadha wa kuuawa kwa wengine, “alibaki hai” huwasilisha maana inayokusudiwa kwa Kiswahili wazi.
- source_word: הַקָּטֹן
  choice: mwana mdogo zaidi
  rationale: Katika muktadha wa familia, neno hili kwa kawaida humaanisha aliye mdogo zaidi kwa umri. Kuongeza “mwana” huunganisha kirai kwa kawaida na “wa Yerubaali.”
- source_word: כִּי נֶחְבָּא
  choice: kwa sababu alikuwa amejificha
  rationale: Kishazi kinaeleza sababu ya kuokoka kwa Yothamu. Wakati timilifu “alikuwa amejificha” unaonyesha kwamba kujificha kulitangulia kubaki kwake hai, huku umbo la kujirejelea likihifadhiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa vitenzi vya mfululizo (“akaenda ... akawaua”) unaendeleza kasi ya simulizi. Jina Yerubaali limetumika kwa tahajia ya Kiswahili; Yothamu pia imeandikwa kwa namna ya kawaida ya Kibiblia. Taswira kali ya “juu ya jiwe moja” imehifadhiwa, huku ufafanuzi wake unaowezekana ukiwekwa katika tanbihi.
