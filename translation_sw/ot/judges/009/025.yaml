base_translation:
  language: en
  yaml_path: translation/ot/judges/009/025.yaml
  text: Then the leaders of Shechem set men in ambush for him on the tops of the mountains[a], and they robbed everyone who passed by them on the road; and it was reported to Abimelech.
translation:
  language: sw
  text: Ndipo viongozi wa Shekemu[a] wakaweka waviziaji juu ya vilele vya milima ili wamvizie Abimeleki; nao wakawapora wote waliopita karibu nao njiani. Abimeleki akapewa habari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wenye mamlaka wa Shekemu,” “watu mashuhuri wa Shekemu,” au “wenyeji wa Shekemu.” Neno la Kiebrania kwa maana halisi ni “mabwana/wamiliki wa Shekemu” na linaweza kumaanisha watu wenye mamlaka katika mji huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַעֲלֵי שְׁכֶם
  choice: viongozi wa Shekemu
  rationale: Katika muktadha huu wa kisiasa na kiraia, neno hilo linamaanisha wenye mamlaka au watu mashuhuri wa mji; “viongozi” ni Kiswahili cha kawaida kisichodokeza mfumo maalumu wa utawala.
- source_word: וַיָּשִׂימוּ לוֹ מְאָרְבִים
  choice: wakawaweka watu wavizie kwa ajili yake
  rationale: Muundo huu unaeleza kuwa watu waliwekwa mahali ili kuvizia; “kwa ajili yake” huhifadhi uwezekano wa maana ya kumlenga Abimeleki bila kuongeza kwamba yeye mwenyewe angepita hapo.
- source_word: עַל רָאשֵׁי הֶהָרִים
  choice: juu ya vilele vya milima
  rationale: Hii inafuata picha halisi ya Kiebrania, “vichwa vya milima,” kwa usemi wa asili na wenye kueleweka katika Kiswahili.
- source_word: וַיִּגְזְלוּ
  choice: wakamnyang’anya
  rationale: Kitenzi kinaonyesha kunyang’anya au kupora kwa nguvu; umoja wa yambwa unaendana na “kila mtu.”
- source_word: אֵת כָּל אֲשֶׁר יַעֲבֹר עֲלֵיהֶם בַּדָּרֶךְ
  choice: kila mtu aliyepita karibu nao njiani
  rationale: “Kila mtu” huwasilisha maana ya mgawanyo ya כָּל pamoja na kitenzi cha umoja, na “njiani” huonyesha mahali walipopita wasafiri.
- source_word: וַיֻּגַּד לַאֲבִימֶלֶךְ
  choice: Jambo hilo likaripotiwa kwa Abimeleki
  rationale: Kauli tendwa huhifadhi kwamba mtoa taarifa hajatajwa, na “jambo hilo” hufanya sentensi iwe ya kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi ya maandiko. Jina “Abimeleki” limeandikwa kwa umbo linalotamkika kwa kawaida katika Kiswahili. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusiana na “viongozi wa Shekemu,” ingawa inatokea baada ya maelezo ya mahali ili kutokatiza mtiririko.
