base_translation:
  language: en
  yaml_path: translation/ot/judges/009/004.yaml
  text: And they gave him seventy pieces of silver from the house of Baal-berith[a], and with them Abimelek hired worthless and reckless men[c][b], and they followed him.
translation:
  language: sw
  text: Nao wakampa vipande sabini vya fedha[b] kutoka katika nyumba ya Baal-Berithi[a]. Kwa fedha hizo Abimeleki akaajiri watu wasio na maana na wasio na nidhamu[c], nao wakamfuata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika hekalu la Baal-Berithi.” Kiebrania kinasema “nyumba,” neno ambalo katika muktadha wa ibada linaweza kumaanisha mahali patakatifu au hekalu.
    reason: lexical_alternative
  - marker: b
    text: Au, “shekeli sabini za fedha.” Kiebrania kinasema kihalisi “fedha sabini,” kiasi cha fedha kilichoelezwa kwa uzito.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “watu watupu na wasio na nidhamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעִים כֶּסֶף
  choice: vipande sabini vya fedha
  rationale: Kiebrania kinasema kihalisi ‘fedha sabini,’ yaani kiasi cha fedha kilichohesabiwa kwa uzito. ‘Vipande sabini vya fedha’ ni Kiswahili cha kawaida na hakiongezi waziwazi kipimo cha shekeli ambacho hakikutajwa katika maandishi.
- source_word: מִבֵּית בַּעַל בְּרִית
  choice: kutoka katika nyumba ya Baal-Berithi
  rationale: בַּיִת humaanisha ‘nyumba,’ ingawa katika muktadha wa ibada inaweza kumaanisha hekalu au mahali patakatifu. ‘Nyumba’ huhifadhi taswira ya Kiebrania, na jina Baal-Berithi limetoholewa badala ya kutafsiriwa.
- source_word: וַיִּשְׂכֹּר בָּהֶם
  choice: Kwa fedha hizo ... akaajiri
  rationale: Kiwakilishi kinarejelea fedha kuwa njia iliyotumiwa kuwalipa au kuwaajiri watu. Muundo huu ni wa asili katika Kiswahili na unaweka rejeo hilo wazi.
- source_word: אֲנָשִׁים רֵיקִים
  choice: watu wasiofaa
  rationale: רֵיקִים ni kihalisi ‘watupu,’ lakini hapa huonyesha watu wasio na thamani au sifa njema. ‘Wasiofaa’ huwasilisha hukumu hiyo kwa lugha ya kawaida bila kudokeza kuwa hawakuwa na kazi tu.
- source_word: וּפֹחֲזִים
  choice: wenye kufanya mambo bila kujali
  rationale: Neno hilo hueleza watu wenye pupa, wasio na nidhamu, au wasiotabirika. Kauli hii ya Kiswahili huwasilisha tabia ya kutojali matokeo huku tanbihi ikihifadhi tafsiri ya karibu zaidi.
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: nao wakamfuata
  rationale: Nahau ya Kiebrania ni kihalisi ‘wakaenda nyuma yake,’ lakini hapa maana yake ni kwamba walijiunga naye kuwa wafuasi wake. ‘Wakamfuata’ ni wazi na ya asili.
