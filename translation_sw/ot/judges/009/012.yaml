translation:
  language: sw
  text: Kisha miti ikauambia mzabibu[a], “Njoo, tawala juu yetu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Nenda wewe, tawala juu yetu.” Katika Kiswahili, mwito huu unasikika kwa kawaida zaidi kama, “Njoo, tawala juu yetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Kisha ... ikauambia
  rationale: Waw-consecutive inaendeleza simulizi. “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, huku “ikauambia” ikihifadhi mwendelezo wa tendo.
- source_word: הָעֵצִים
  choice: miti
  rationale: Katika mfano wa Yothamu, wingi wa עֵץ unarejelea miti, si mbao kama kitu.
- source_word: לַגָּפֶן
  choice: mzabibu
  rationale: גֶּפֶן ni mzabibu; neno hili ni la kawaida na linafaa kwa uhuishaji wa mmea katika mfano.
- source_word: לְכִי
  choice: Njoo
  rationale: Ingawa הלך kimsingi ni “kwenda,” hapa amri hiyo pamoja na amri inayofuata ni mwito wa kuchukua jukumu; “Njoo” ni usemi wa asili kwa Kiswahili.
- source_word: אַתְּ
  choice: wewe (imeeleweka katika kitenzi)
  rationale: Kiwakilishi ni nafsi ya pili umoja wa kike, kikirejelea mzabibu. Kiswahili hakihitaji kiwakilishi huru hapa kwa kuwa nafsi inaonyeshwa katika “utawale.”
- source_word: מְלֹכִי
  choice: utawale
  rationale: Amri ya מלך inamaanisha kutawala kama mfalme. Katika mwito huu, “Njoo, utawale” ni Kiswahili cha asili na huhifadhi nguvu ya amri bila kulazimisha jinsia ya cheo.
- source_word: עָלֵינוּ
  choice: juu yetu
  rationale: Pamoja na מלך, עַל huonyesha wale wanaotawaliwa; “juu yetu” huhifadhi taswira na maana ya mamlaka.
