translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeundwa kwa mtiririko wa simulizi wa kawaida; uhuishaji wa miti na mzabibu umehifadhiwa. Alama ya tanbihi [a] imewekwa baada ya “mzabibu” kama katika safu ya mashauriano ya Kiingereza.
