  text: But a certain woman threw an upper millstone on Abimelech’s head and crushed his skull[a].
translation:
  language: sw
  text: Lakini mwanamke mmoja akatupa kipande cha jiwe la juu la kusagia juu ya kichwa cha Abimeleki, kikaliponda fuvu lake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jiwe la juu la kusagia”; usemi wa Kiebrania unaweza kumaanisha jiwe la juu lenyewe, ingawa neno hilo laweza kukazia sehemu au kipande chake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁלֵךְ
  choice: akatupa
  rationale: Kitenzi שׁלך katika usimulizi kinaonyesha tendo la kutupa; “akatupa” ni Kiswahili cha kawaida na huhifadhi nguvu ya tendo hilo.
- source_word: אִשָּׁה אַחַת
  choice: mwanamke mmoja
  rationale: Hutafsiri moja kwa moja maana ya “mwanamke mmoja” na kudumisha mkazo juu ya mtu huyu asiyepewa jina aliyefanya tendo la kuamua matokeo.
- source_word: פֶּלַח רֶכֶב
  choice: jiwe la juu la kusagia
  rationale: רֶכֶב ni jiwe la juu la kinu; tafsiri hii inaonyesha kwa uwazi ni jiwe gani, huku tanbihi ikihifadhi uwezekano kwamba פֶּלַח inamaanisha kipande chake.
- source_word: עַל רֹאשׁ
  choice: juu ya kichwa cha
  rationale: Ni usemi wa kawaida wa mahali unaolingana na maana ya Kiebrania.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleki
  rationale: Umbo hili la jina linafuata matamshi na uandishi unaofaa katika Kiswahili.
- source_word: וַתָּרִץ
  choice: likamponda
  rationale: Kitenzi רצץ humaanisha kuponda au kuvunja kwa nguvu; “likamponda” ni wazi na linafaa katika simulizi hili.
- source_word: גֻּלְגָּלְתּוֹ
  choice: fuvu lake
  rationale: Nomino hii inamaanisha hasa fuvu, si kichwa kwa ujumla, hivyo tafsiri inadumisha usahihi wa kimaumbile.
