base_translation:
  language: en
  yaml_path: translation/ot/judges/009/029.yaml
  text: If only this people were in my hand[a], then I would remove Abimelek. And he said to Abimelek[b], “Increase your army and come out!”
translation:
  language: sw
  text: Laiti watu hawa wangekuwa mikononi mwangu,[a] ningemwondoa Abimeleki. Akamwambia Abimeleki,[b] “Ongeza jeshi lako, utoke nje!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Ni nani angeniwapa watu hawa mikononi mwangu? Ningemwondoa Abimeleki.” Kiebrania kinatumia nahau ya kuonyesha tamanio: “Ni nani atakayetoa...?”'
    reason: lexical_alternative
  - marker: b
    text: Inaelekea changamoto hii, “Ongeza jeshi lako, utoke nje,” ni kejeli iliyoelekezwa kwa Abimeleki, iwe ilisemwa kwake moja kwa moja au kwa njia ya balagha.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִי יִתֵּן
  choice: Laiti
  rationale: Ni nahau ya Kiebrania inayoonyesha tamanio, si swali halisi. “Laiti” ni Kiswahili cha kawaida kinachohifadhi nguvu ya tamanio hilo.
- source_word: הָעָם הַזֶּה
  choice: watu hawa
  rationale: עָם hapa ni kundi la watu linalozungumziwa. Kiswahili kwa kawaida hutumia wingi wa kisarufi, “watu hawa,” bila kulifanya neno hilo limaanishe jeshi pekee.
- source_word: בְּיָדִי
  choice: ningekuwa na mamlaka juu ya
  rationale: Nahau halisi ni “katika mkono wangu,” ikimaanisha kuwa chini ya uwezo au udhibiti wa mtu. Tafsiri hii inaleta maana hiyo kwa Kiswahili cha asili.
- source_word: וְאָסִירָה
  choice: ningemwondoa
  rationale: Hifili ya סוּר ina maana pana ya kumwondoa au kumweka mbali. “Ningemwondoa” haibainishi bila msingi kama angeuawa, angefukuzwa, au angeondolewa madarakani.
- source_word: וַיֹּאמֶר לַאֲבִימֶלֶךְ
  choice: Kisha akamwambia Abimeleki
  rationale: Kihusishi ל kwa kawaida humtambulisha anayeelekezewa maneno. Muktadha unaweza kuwa changamoto ya moja kwa moja au kejeli ya mbali, hivyo tanbihi inalinda mvutano huo.
- source_word: רַבֶּה
  choice: Ongeza
  rationale: Amri ya רבה humtaka mtu kufanya kitu kiwe kingi au kikubwa; “ongeza” inaendana kwa kawaida na jeshi.
- source_word: צְבָאֲךָ
  choice: jeshi lako
  rationale: צָבָא mara nyingi humaanisha jeshi au vikosi vya kijeshi. “Jeshi” ni neno la kawaida na wazi katika muktadha huu.
- source_word: וָצֵאָה
  choice: utoke uje
  rationale: Amri ya יצא ni kutoka. Katika changamoto kwa mpinzani, “utoke uje” huwasilisha mwito wa kujitokeza kukabiliana naye kwa Kiswahili cha asili.
