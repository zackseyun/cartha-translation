translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Laiti” hudumisha tamanio la Kiebrania; “mamlaka juu ya” hufafanua nahau ya mkono kwa urahisi, huku tanbihi ikihifadhi umbo lake la asili. Jina limetolewa kama “Abimeleki” kwa tahajia ya Kiswahili.
