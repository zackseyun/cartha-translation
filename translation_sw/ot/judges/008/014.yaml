translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye hadhi, na unaoeleweka kwa wasomaji wa kawaida. Jina Sukothi limetoholewa kwa tahajia ya Kiswahili. Alama ya tanbihi imewekwa baada ya “wakuu,” neno ambalo tanbihi inalifafanua.
