  text: וַ/יִּלְכָּד נַ֛עַר מֵ/אַנְשֵׁ֥י סֻכּ֖וֹת וַ/יִּשְׁאָלֵ֑/הוּ וַ/יִּכְתֹּ֨ב אֵלָ֜י/ו אֶת שָׂרֵ֤י סֻכּוֹת֙ וְ/אֶת זְקֵנֶ֔י/הָ שִׁבְעִ֥ים וְ/שִׁבְעָ֖ה אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/014.yaml
  text: And he captured a young man from the men of Succoth and questioned him[a], and he wrote down for him the officials of Succoth and its elders, seventy-seven men.
translation:
  language: sw
  text: Akamkamata kijana mmoja miongoni mwa watu wa Sukothi, akamhoji. Kijana huyo akamwandikia majina ya wakuu[a] wa Sukothi na wazee wa mji huo, jumla yao wanaume sabini na saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viongozi wa Sukothi.” Neno la Kiebrania linaweza kumaanisha wakuu, maafisa, au watawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכָּד
  choice: akamkamata
  rationale: Kitenzi לכד humaanisha kukamata au kutwaa. “Akamkamata” kinafaa katika simulizi hili bila kuongeza dhana ya namna alivyotiwa kizuizini.
- source_word: נַעַר
  choice: kijana mmoja
  rationale: נַעַר inaweza kumaanisha mvulana, kijana, au mtumishi. Hapa anaweza kutoa taarifa kuhusu viongozi wa mji, kwa hiyo “kijana” huepuka kumfanya mtoto au mtumishi bila ushahidi.
- source_word: מֵאַנְשֵׁי סֻכּוֹת
  choice: miongoni mwa watu wa Sukothi
  rationale: Kirai hiki kinaonyesha kwamba kijana huyo alikuwa mmoja wa watu wa Sukothi. Tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: akamhoji
  rationale: שׁאל hapa ni kumuuliza mtu kwa kusudi la kupata taarifa. “Akamhoji” huwasilisha maana hiyo bila kulazimisha picha kali zaidi ya mateso au shinikizo.
- source_word: וַיִּכְתֹּב אֵלָיו
  choice: Kijana huyo akamwandikia
  rationale: Mhusika anayeandika anaeleweka kuwa yule kijana aliyekamatwa, naye anamwandikia Gideoni. Kumtaja tena kijana huondoa utata wa viwakilishi unaoweza kujitokeza katika Kiswahili.
- source_word: אֶת שָׂרֵי סֻכּוֹת וְאֶת זְקֵנֶיהָ
  choice: majina ya wakuu wa Sukothi na wazee wa mji huo
  rationale: Kiebrania kinasema kihalisi kwamba aliwaandika wakuu na wazee; katika muktadha maana ni kuandika majina yao. “Wakuu” linafaa kwa viongozi wa kiraia, na “wazee wa mji huo” huweka wazi kwamba kiambishi cha Kiebrania kinarejelea Sukothi.
- source_word: שִׁבְעִים וְשִׁבְעָה אִישׁ
  choice: jumla yao wanaume sabini na saba
  rationale: Hesabu ni sabini na saba, na אִישׁ inataja wazi wanaume. “Jumla yao” huonyesha kwa kawaida kwamba idadi hiyo inawahusu wakuu na wazee kwa pamoja.
