  yaml_path: translation/ot/judges/008/035.yaml
  text: And they did not show kindness to the house of Jerubbaal (that is, Gideon), in keeping with all the good that he had done for Israel.
translation:
  language: sw
  text: Nao hawakuonyesha fadhili kwa nyumba ya Yerubaali, yaani Gideoni, kulingana na wema wote aliowatendea Israeli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד
  choice: fadhili
  rationale: Katika muktadha huu neno linaeleza wema au uaminifu wenye shukrani ambao Israeli walipaswa kuuonyesha kwa familia ya Gideoni; “fadhili” ni la kawaida, lenye heshima, na halifinyangi maana kuwa agano pekee.
- source_word: בֵּית
  choice: nyumba
  rationale: Hapa “nyumba” humaanisha ukoo au familia ya Yerubaali; matumizi hayo yanaeleweka katika lugha ya kibiblia na yanadumisha picha ya Kiebrania.
- source_word: כְּכָל הַטּוֹבָה
  choice: kulingana na mema yote
  rationale: Huhifadhi wazo la kwamba walipaswa kuitendea familia yake kwa namna inayolingana na wema wote aliowatendea Israeli.
- source_word: עָשָׂה עִם
  choice: aliyowatendea
  rationale: Kiswahili asilia hutumia “kumtendea mema”; kiambishi cha wingi kinawarejelea watu wa Israeli.
theological_decisions:
- issue: Utambulisho wa Yerubaali na Gideoni
  choice: Yerubaali, yaani Gideoni
  alternative: Yerubaali Gideoni
  rationale: Sintaksia ya Kiebrania inaweka majina yote mawili pamoja bila kiunganishi. “Yaani” huonyesha wazi kwamba ni mtu mmoja, bila kugeuza “Gideoni” kuwa jina la ukoo au mtu mwingine.
- issue: Maana ya חֶסֶד katika wajibu wa Israeli kwa familia ya Gideoni
  choice: fadhili
  alternative: uaminifu wa agano
  rationale: Muktadha unasisitiza kutokuwa na shukrani na kutowatendea mema watu wa nyumba yake; tafsiri pana “fadhili” huepuka kuingiza kwa lazima dhana maalumu ya agano ambayo haijaelezwa wazi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi muundo wa lawama wa Kiebrania huku ikitumia “aliyowatendea Israeli” kwa mtiririko wa kawaida wa Kiswahili.
