  text: וַ/יְהִ֗י כַּֽ/אֲשֶׁר֙ מֵ֣ת גִּדְע֔וֹן וַ/יָּשׁ֨וּבוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּזְנ֖וּ אַחֲרֵ֣י הַ/בְּעָלִ֑ים וַ/יָּשִׂ֧ימוּ לָ/הֶ֛ם בַּ֥עַל בְּרִ֖ית לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/033.yaml
  text: And it happened that[a], when Gideon died, the sons of Israel turned back and prostituted themselves after the Baals[b], and they made Baal-berith their god.
translation:
  language: sw
  text: Ikawa Gideoni alipokufa, Waisraeli wakarudia kufanya ukahaba kwa kuwafuata Mabaali,[a] wakamfanya Baal-Berithi kuwa mungu wao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno, “wakafanya ukahaba kwa kuwafuata Mabaali”; Kiebrania kinatumia taswira ya kingono kueleza kutokuwa waaminifu kwa Mungu kwa kufuata miungu mingine.
    reason: lexical_alternative
  - marker: b
    text: Huenda Baal-Berithi humaanisha “Baali wa agano” au “Bwana wa agano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ikawa ... alipokufa
  rationale: Muundo huu unadumisha mpito wa kisimulizi wa Kiebrania na kuwasilisha kwa Kiswahili cha kawaida sentensi ya wakati.
- source_word: מֵת גִּדְעוֹן
  choice: Gideoni alipokufa
  rationale: Kitenzi kinaonyesha tukio lililokamilika na kwa kawaida huunganishwa na kishazi cha wakati katika Kiswahili.
- source_word: וַיָּשׁוּבוּ
  choice: wakarudia
  rationale: Hapa neno linaonyesha kurudia mwenendo wa awali wa kuasi, si kurudi mahali fulani.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Hili ni neno la kawaida, wazi na jumuishi kwa watu wa Israeli kwa ujumla, huku likihifadhi rejeo la pamoja la chanzo.
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: kufanya ukahaba kwa kuwafuata
  rationale: Tafsiri inadumisha taswira kali ya kingono ambayo Kiebrania hutumia kueleza kutokuwa waaminifu kwa kuabudu miungu mingine.
- source_word: הַבְּעָלִים
  choice: Mabaali
  rationale: Wingi huu unarejelea maumbo au miungu mbalimbali iliyoitwa Baali; 'Mabaali' hudumisha wingi wa chanzo.
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: wakamfanya
  rationale: Katika muktadha huu, usemi una maana ya kumteua au kumkubali kuwa mungu wao.
- source_word: בַּעַל בְּרִית
  choice: Baal-Berithi
  rationale: Jina maalumu la ibada limenukuliwa kwa sauti badala ya kutafsiriwa katika andiko kuu; maana yake imeelezwa katika tanbihi.
- source_word: לֵאלֹהִים
  choice: kuwa mungu wao
  rationale: Kirai kinaonyesha uteuzi wa Baal-Berithi kuwa mungu kwa ajili yao; umilikishi unaeleweka kutokana na לָהֶם.
theological_decisions:
- issue: Kudumisha taswira ya kingono kwa ibada ya sanamu
  choice: kufanya ukahaba kwa kuwafuata Mabaali
  alternative: kukosa uaminifu kwa kumwacha Mungu na kufuata Mabaali
  rationale: Kiebrania kinatumia waziwazi זנה, neno lenye taswira ya ukahaba. Kulidumisha kunahifadhi uzito wa kitheolojia wa uasi wa Israeli bila kuufafanua kupita kiasi.
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  alternative: wana wa Israeli
  rationale: Ingawa muundo wa Kiebrania kwa neno ni 'wana wa Israeli,' hapa unawataja watu wa Israeli kwa pamoja. 'Waisraeli' ni Kiswahili cha asili na hakibadili rejeo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wa sasa lakini wenye heshima. Taswira kali ya chanzo imehifadhiwa, huku 'Waisraeli' ikitumiwa badala ya tafsiri ya neno kwa neno isiyo ya kawaida katika Kiswahili.
