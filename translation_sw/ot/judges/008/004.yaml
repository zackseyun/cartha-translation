base_translation:
  language: en
  yaml_path: translation/ot/judges/008/004.yaml
  text: Then Gideon came to the Jordan and crossed over[a], he and the three hundred men who were with him, exhausted yet pursuing.
translation:
  language: sw
  text: Ndipo Gideoni akafika Yordani, akavuka, yeye pamoja na watu mia tatu waliokuwa naye, wakiwa wamechoka lakini wakiendelea kuwafukuza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakiwa hoi, lakini bado wakiwafukuza,” au “wakiwa dhaifu, lakini wakiendelea kuwafukuza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akafika
  rationale: Kitenzi בוא hapa kinaonyesha kufika mahali palipotajwa; “akafika” ni Kiswahili cha kawaida kinachofaa mwendo wa simulizi.
- source_word: הַיַּרְדֵּנָה
  choice: Yordani
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha kwenda mpaka Yordani. Katika Kiswahili, “akafika Yordani” huwasilisha mwelekeo huo bila kulazimika kuongeza neno “Mto.”
- source_word: עֹבֵר הוּא
  choice: na kuvuka, yeye
  rationale: Kauli ya kishirikishi pamoja na kiwakilishi inasisitiza kwamba Gideoni mwenyewe alivuka. Muundo huu umeunganishwa kwa Kiswahili asilia na kuendelezwa na “yeye pamoja na...”
- source_word: וּשְׁלֹשׁ מֵאוֹת הָאִישׁ אֲשֶׁר אִתּוֹ
  choice: yeye pamoja na wale watu mia tatu waliokuwa naye
  rationale: Hutambulisha kundi la Gideoni na kudumisha idadi pamoja na mazingira ya kijeshi. “Watu” ni ya kawaida na yenye heshima katika Kiswahili, huku muktadha ukionyesha kwamba ni wapiganaji.
- source_word: עֲיֵפִים
  choice: wakiwa wamechoka
  rationale: Neno hili linaeleza uchovu wa mwili. “Wamechoka” ni wazi na la kawaida; kiwango halisi cha uchovu kinaweza pia kutafsiriwa kwa nguvu zaidi, kama inavyoonyeshwa katika tanbihi.
- source_word: וְרֹדְפִים
  choice: lakini wakiendelea kuwafuatilia
  rationale: Ingawa וְ kimsingi ni “na,” muktadha unaweka uchovu wao kinyume na kuendelea kwa msako. “Lakini wakiendelea” huwasilisha uhusiano huo bila kudai kwamba tendo lilikuwa rahisi. Kiambishi “-wa-” kinarejelea maadui waliokuwa wakifuatwa katika muktadha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Muundo “wakiwa wamechoka lakini wakiendelea” unadumisha mvutano wa maandishi kati ya uchovu na kuendelea na msako.
