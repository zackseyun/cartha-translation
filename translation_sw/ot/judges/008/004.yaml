  rationale: The revision retains the draft's faithful rendering of arrival, crossing, number, and fatigue, while changing the pursuit verb from the broader "kufuatilia" to "kufukuza" to represent the Hebrew military pursuit more precisely. The footnote is correspondingly updated so its alternatives retain the same pursuit sense.
