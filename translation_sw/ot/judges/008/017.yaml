lexical_decisions:
- source_word: מִגְדַּל
  choice: mnara
  rationale: Neno hili kwa kawaida humaanisha mnara au jengo refu lenye ulinzi; “mnara” ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: פְּנוּאֵל
  choice: Penueli
  rationale: Jina la mahali limetoholewa kwa tahajia ya kawaida ya Kiswahili, kwa kuzingatia umbo la konsonanti la Kiebrania hapa.
- source_word: נָתָץ
  choice: akabomoa
  rationale: Kitenzi humaanisha kuangusha au kubomoa jengo; “akabomoa” ni cha asili, wazi, na hudumisha nguvu ya tendo.
- source_word: וַיַּהֲרֹג
  choice: kuwaua
  rationale: Kitenzi הרג humaanisha moja kwa moja kuua; “kuwaua” ni lugha ya sasa na yenye uwazi.
- source_word: אַנְשֵׁי הָעִיר
  choice: wanaume wa mji huo
  rationale: Kirai hicho kihalisi ni “wanaume wa mji.” Katika muktadha huu wa adhabu ya kijeshi, maana ya kiume imehifadhiwa badala ya kupanuliwa kuwa wakazi wote.
