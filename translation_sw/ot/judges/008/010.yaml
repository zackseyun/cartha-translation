translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unafuata kwa kiasi kikubwa mfululizo wa Kiebrania, huku “yaani” ikisaidia kufafanua kuwa elfu kumi na tano ndio wote waliobaki. Alama ya tanbihi [a] imewekwa baada ya nahau inayofafanuliwa.
