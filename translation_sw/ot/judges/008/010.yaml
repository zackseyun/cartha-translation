base_translation:
  language: en
  yaml_path: translation/ot/judges/008/010.yaml
  text: Zebah and Zalmunna were in Karkor[a], and their camps were with them, about fifteen thousand men, all who were left from all the camp of the sons of the east; and those who had fallen were one hundred twenty thousand men drawing the sword.
translation:
  language: sw
  text: Zeba na Salmuna walikuwa huko Karkori, na majeshi yao yalikuwa pamoja nao, watu wapatao elfu kumi na tano, wote waliokuwa wamebaki kutoka katika jeshi lote la watu wa mashariki; nao waliokuwa wameanguka walikuwa watu laki moja na elfu ishirini wenye kuchomoa upanga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּקַּרְקֹר
  choice: walikuwa Karkori
  rationale: Kiambishi בְּ kinaonyesha mahali; katika Kiswahili, jina la mahali linaweza kufuata kitenzi moja kwa moja. Umbo “Karkori” linafuata uandishi wa kawaida wa majina ya kibiblia kwa Kiswahili.
- source_word: וּמַחֲנֵיהֶם עִמָּם
  choice: na majeshi yao yalikuwa pamoja nao
  rationale: מַחֲנֵיהֶם ni wingi na katika muktadha wa kijeshi inaweza kumaanisha vikosi vilivyopiga kambi. “Majeshi” ni ya asili zaidi kuliko “kambi zao” kwa kuwa idadi ya askari inafuata mara moja, huku “pamoja nao” ikihifadhi עִמָּם.
- source_word: כַּחֲמֵשֶׁת עָשָׂר אֶלֶף
  choice: watu wapatao elfu kumi na tano
  rationale: כְּ inaonyesha ukadiriaji; “wapatao” huwasilisha maana ya takribani kwa Kiswahili cha kawaida.
- source_word: כֹּל הַנּוֹתָרִים
  choice: wote waliokuwa wamebaki
  rationale: 'Kauli hii inahifadhi hali ya matokeo ya kitenzi cha Kiebrania: hawa ndio waliosalia baada ya wengine kuanguka.'
- source_word: מִכֹּל מַחֲנֵה בְנֵי קֶדֶם
  choice: kutoka katika jeshi lote la watu wa mashariki
  rationale: מִן imehifadhiwa kwa “kutoka katika”; מַחֲנֶה ni nomino ya umoja yenye maana ya kundi zima la kijeshi. “Watu wa mashariki” ni usemi wa asili unaowasilisha בְנֵי קֶדֶם bila kulazimisha nahau ya Kiebrania “wana wa mashariki.”
- source_word: וְהַנֹּפְלִים
  choice: nao waliokuwa wameanguka
  rationale: Katika taarifa ya vita, נפל hutaja waliouawa; “wameanguka” huhifadhi taswira ya chanzo bila kuongeza moja kwa moja neno “kuuawa.”
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: laki moja na elfu ishirini
  rationale: Huu ni uwasilishaji wa kawaida wa Kiswahili wa 120,000.
- source_word: אִישׁ שֹׁלֵף חָרֶב
  choice: watu ... wenye kufuta upanga
  rationale: Nahau ya Kiebrania imehifadhiwa kwa karibu. Kwa kuwa Kiswahili “kufuta upanga” kinaweza kueleweka vibaya, tanbihi inaeleza maana yake ya kijeshi.
