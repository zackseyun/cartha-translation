base_translation:
  language: en
  yaml_path: translation/ot/judges/008/020.yaml
  text: Then he said to Jether his firstborn[a], “Get up, kill them.” But the young man did not draw his sword, because he was afraid, for he was still a young man.
translation:
  language: sw
  text: Kisha akamwambia Yetheri, mwanawe wa kwanza, “Simama, uwaue.” Lakini yule kijana[a] hakuchomoa upanga wake, kwa sababu aliogopa, maana bado alikuwa kijana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mvulana.” Neno la Kiebrania naʿar linaweza kumaanisha mvulana au kijana, likihusu umri kuanzia utotoni hadi ujana au utu uzima wa mapema. Hapa “kijana” limetumiwa kwa sababu alikuwa na upanga na aliamriwa kuwaua watu hao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: לְיֶתֶר
  choice: Yetheri
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: בְּכוֹרוֹ
  choice: mzaliwa wake wa kwanza
  rationale: Huhifadhi maana ya moja kwa moja ya בכור kama mwana wa kwanza kwa mpangilio wa kuzaliwa.
- source_word: קוּם
  choice: Inuka
  rationale: Ni amri ya moja kwa moja na ya kawaida kwa kitenzi קום.
- source_word: הֲרֹג אוֹתָם
  choice: uwaue
  rationale: הרג ni kitenzi cha kawaida cha kuua; tafsiri hii ni ya moja kwa moja bila lugha ya kizamani.
- source_word: וְלֹא שָׁלַף
  choice: Lakini ... hakuchomoa
  rationale: “Lakini” huonyesha tofauti kati ya amri na kutotenda kwa Yetheri; “kuchomoa” hueleza kutoa upanga mahali ulipowekwa.
- source_word: הַנַּעַר
  choice: yule kijana
  rationale: נער inaweza kumaanisha mvulana au kijana. Muktadha unaonyesha alikuwa na umri wa kubeba upanga na kuagizwa kuwaua mateka, hivyo “kijana” inafaa huku upana wa neno ukielezwa katika tanbihi.
- source_word: חַרְבּוֹ
  choice: upanga wake
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kiambishi cha umilikaji.
- source_word: כִּי יָרֵא
  choice: kwa sababu aliogopa
  rationale: כִּי inaonyesha sababu ya kutochomoa upanga; “kwa sababu” huweka wazi uhusiano huo.
- source_word: כִּי עוֹדֶנּוּ נָעַר
  choice: maana bado alikuwa kijana
  rationale: “Bado” huhifadhi wazo la kuendelea katika עוֹדֶנּוּ, na kurudia “kijana” huhifadhi urudiaji wa נער katika Kiebrania.
