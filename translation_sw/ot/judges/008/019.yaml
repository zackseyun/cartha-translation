base_translation:
  language: en
  yaml_path: translation/ot/judges/008/019.yaml
  text: And he said[a], “They were my brothers, the sons of my mother. As Yahweh lives, if you had let them live[b], I would not have killed you.”
translation:
  language: sw
  text: Akasema, “Hao walikuwa ndugu zangu, wana wa mama yangu.[a] Kama Yahweh aishivyo, kama mngewaacha waishi, nisingewaua ninyi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai “wana wa mama yangu” kinaonyesha kwamba walikuwa ndugu zake wenye mama mmoja naye, si jamaa tu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Akasema
  rationale: Kauli ya kawaida ya masimulizi ya Kiebrania; Kiswahili hakihitaji kuongeza kiunganishi ili kuendeleza mtiririko wa simulizi.
- source_word: אַחַי בְּנֵי אִמִּי הֵם
  choice: Hao walikuwa ndugu zangu, wana wa mama yangu
  rationale: “Ndugu zangu” huhifadhi maana ya kindugu, nayo kirai cha ufafanuzi “wana wa mama yangu” kinaonyesha uhusiano wao wa karibu bila kubadili kirai hicho kuwa tafsiri pana zaidi.
- source_word: חַי יְהוָה
  choice: Kama Yahwe aishivyo
  rationale: Hii ni kauli ya kiapo. Muundo huu ni wa asili na wenye heshima katika Kiswahili, huku jina la Mungu יְהוָה likitafsiriwa kwa namna ya matamshi kama “Yahwe.”
- source_word: לוּ הַחֲיִתֶם אוֹתָם
  choice: kama mngewaacha waishi
  rationale: לוּ huanzisha sharti lisilotimia, na Hifili ya חיה humaanisha kusababisha au kuruhusu mtu aishi. Muundo wa “kama mnge-” unaonyesha hali ya wakati uliopita ambayo haikutokea.
- source_word: לֹא הָרַגְתִּי אֶתְכֶם
  choice: nisingewaua ninyi
  rationale: Kauli hii ni matokeo ya sharti lisilotimia. “Nisingewaua” ni njia ya kawaida ya Kiswahili ya kueleza jambo ambalo lisingetokea; “ninyi” huweka wazi kuwa kiwakilishi cha Kiebrania ni cha wingi na kinawahusu wale anaosema nao.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה katika kiapo
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina maalumu la Mungu, si cheo. “Yahwe” hulihifadhi kama jina binafsi bila kulibadili kuwa cheo.
- issue: Nguvu ya kiapo חַי יְהוָה
  choice: Kama Yahwe aishivyo
  alternative: Kwa uhai wa Yahwe
  rationale: Muundo uliochaguliwa huhifadhi kiapo chenye uzito bila kukifanya kuwa dai la kawaida tu kwamba Yahwe yu hai.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida lakini wa heshima. “Hao” huwarejelea wanaume waliokwisha kuuawa, na “ninyi” husisitiza wingi wa watu wanaoambiwa. Alama za tanbihi zimewekwa karibu na maneno yanayofafanuliwa.
