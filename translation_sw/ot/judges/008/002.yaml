  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם מֶה עָשִׂ֥יתִי עַתָּ֖ה כָּ/כֶ֑ם הֲ/ל֗וֹא ט֛וֹב עֹלְל֥וֹת אֶפְרַ֖יִם מִ/בְצִ֥יר אֲבִיעֶֽזֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/002.yaml
  text: But he said to them[a], “What have I done now compared to you? Are not the gleanings of Ephraim better than the grape harvest of Abiezer?”
translation:
  language: sw
  text: Lakini akawaambia, “Nimefanya nini sasa nikilinganishwa nanyi? Je, mabaki ya zabibu[a] ya Efraimu si bora kuliko mavuno ya zabibu ya Abiezeri?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, zabibu zilizobaki baada ya mavuno makuu.
    reason: Ufafanuzi wa maana ya kilimo ya עֹלְלוֹת bila kubadili sitiari ya mstari.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Lakini akawaambia
  rationale: Kiunganishi cha simulizi kinaendeleza tukio, lakini muktadha wa jibu la Gideoni kwa malalamiko yao unaonyesha utofautishaji; “Lakini” ni ya asili hapa. “Akawaambia” huunganisha kitenzi na walengwa wake kwa Kiswahili fasaha.
- source_word: מֶה עָשִׂיתִי עַתָּה כָּכֶם
  choice: Nimefanya nini sasa nikilinganishwa nanyi?
  rationale: Muundo wenye כָּ unaonyesha ulinganisho. Tafsiri hii inahifadhi swali la kujishusha la Gideoni bila kuongeza maana isiyokuwapo.
- source_word: הֲלוֹא
  choice: Je, ... si
  rationale: Huanzisha swali la balagha linalotarajia jibu la kukubali; muundo “Je, ... si” ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: טוֹב ... מִן
  choice: bora kuliko
  rationale: Ingawa טוֹב kimsingi ni “nzuri,” pamoja na מִן hapa ina maana ya ulinganisho, “bora kuliko.”
- source_word: עֹלְלוֹת אֶפְרַיִם
  choice: mabaki ya zabibu ya Efraimu
  rationale: עֹלְלוֹת ni zabibu zinazobaki shambani baada ya mavuno makuu. “Mabaki ya zabibu” huweka wazi picha ya shamba la mizabibu kwa msomaji wa kawaida.
- source_word: בְצִיר אֲבִיעֶזֶר
  choice: mavuno ya zabibu ya Abiezeri
  rationale: בָּצִיר hurejelea uvunaji au mavuno ya zabibu. Kutaja “zabibu” huhifadhi kwa uwazi ulinganisho wa picha ileile ya shamba la mizabibu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha na sitiari ya mavuno ya zabibu vimehifadhiwa; usemi umewekwa katika muundo unaoeleweka kwa wasomaji wa kawaida.
