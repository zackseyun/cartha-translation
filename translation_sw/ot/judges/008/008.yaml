base_translation:
  language: en
  yaml_path: translation/ot/judges/008/008.yaml
  text: From there he went up to Penuel and spoke to them in the same way[b][a], and the men of Penuel answered him just as the men of Succoth had answered.
translation:
  language: sw
  text: Kutoka huko akapanda hadi Penueli[b], akazungumza nao vivyo hivyo[a]. Wanaume wa Penueli wakamjibu kama wanaume wa Sukothi walivyokuwa wamemjibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “akazungumza nao hivi.” Kiebrania kinarejelea ombi au maneno kama yale yaliyoandikwa katika aya iliyotangulia.
    reason: lexical_alternative
  - marker: b
    text: Penueli pia huandikwa “Penieli” katika sehemu nyingine.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda kwenda
  rationale: Kitenzi עלה kina maana ya kupanda au kwenda juu. Kauli hii inahifadhi mwelekeo wa safari kutoka Sukothi hadi Penueli kwa Kiswahili cha kawaida.
- source_word: מִשָּׁם
  choice: Kutoka huko
  rationale: Ni usemi wa kawaida unaorejelea mahali palipotajwa katika simulizi lililotangulia.
- source_word: פְּנוּאֵל
  choice: Penueli
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili, huku likifuata umbo la konsonanti la Kiebrania katika aya hii.
- source_word: וַיְדַבֵּר אֲלֵיהֶם כָּזֹאת
  choice: akazungumza nao vivyo hivyo
  rationale: Kiebrania kinasema kihalisi ‘akazungumza nao hivi.’ Katika muktadha huu maneno hayo yanarejelea ombi la Gideoni katika aya iliyotangulia; ‘vivyo hivyo’ huonyesha rejeo hilo kwa Kiswahili cha asili bila kurudia ombi.
- source_word: וַיַּעֲנוּ אוֹתוֹ
  choice: wakamjibu
  rationale: ענה pamoja na yambwa hapa humaanisha kumjibu mtu; ‘wakamjibu’ ni tafsiri fupi na ya kawaida.
- source_word: אַנְשֵׁי פְנוּאֵל
  choice: Watu wa Penueli
  rationale: Ingawa אַנְשֵׁי kihalisi ni ‘wanaume wa,’ katika taarifa kuhusu wakazi au viongozi wa mji, ‘watu wa’ ni usemi wa kawaida wa Kiswahili na hauongezi dai kwamba kila mkazi ndiye aliyejibu.
- source_word: כַּאֲשֶׁר עָנוּ אַנְשֵׁי סֻכּוֹת
  choice: kama watu wa Sukothi walivyokuwa wamemjibu
  rationale: כַּאֲשֶׁר huonyesha ulinganisho. ‘Walivyokuwa wamemjibu’ huweka wazi kuwa jibu la watu wa Sukothi lilitangulia hili bila kubadili maana.
- source_word: סֻכּוֹת
  choice: Sukothi
  rationale: Jina la mahali limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili.
