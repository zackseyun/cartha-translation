base_translation:
  language: en
  yaml_path: translation/ot/judges/008/001.yaml
  text: Then the men of Ephraim said to him[a], “What is this thing you have done to us[b], not calling us when you went to fight against Midian?” And they contended with him strongly.
translation:
  language: sw
  text: Ndipo watu wa Efraimu[a] wakamwambia, “Ni jambo gani hili ulilotufanyia—kutotuita ulipokwenda kupigana na Midiani?” Wakagombana naye vikali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waefraimu.” Kiebrania kinasema kihalisi “mtu wa Efraimu,” lakini usemi huo ni wa kijumla kwa ajili ya watu wa kabila hilo.
    reason: lexical_alternative
  - marker: b
    text: Au, “Wakabishana naye kwa nguvu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶפְרַיִם
  choice: watu wa Efraimu
  rationale: Ingawa אִישׁ iko katika umoja kisarufi, hapa ni usemi wa kijumla unaowataja watu wa kabila la Efraimu; vitenzi vya wingi vinathibitisha maana hiyo. “Watu wa Efraimu” huhifadhi muundo wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: מָה הַדָּבָר הַזֶּה עָשִׂיתָ לָּנוּ
  choice: Ni jambo gani hili ulilotufanyia
  rationale: Tafsiri hii huhifadhi nomino דָּבָר, “jambo,” na nguvu ya swali la malalamiko bila kuongeza wazi maana ya “dhidi yetu.”
- source_word: לְבִלְתִּי קְרֹאות לָנוּ
  choice: kutotuita
  rationale: Muundo huu wa kitenzi-jina unaeleza kosa walilolalamikia kwa ufupi na kwa Kiswahili cha asili; “kuita” haiweki nguvu ya ziada ya “kuamuru waitwe.”
- source_word: כִּי הָלַכְתָּ לְהִלָּחֵם בְּמִדְיָן
  choice: ulipokwenda kupigana na Midiani
  rationale: כִּי inaeleweka hapa kwa maana ya wakati katika malalamiko yao. “Kupigana na Midiani” huonyesha wazi kwamba Midiani ndiye adui.
- source_word: וַיְרִיבוּן אִתּוֹ
  choice: Wakagombana naye
  rationale: ריב inaonyesha ugomvi au mabishano makali. “Kugombana” huhifadhi uzito wa mzozo bila kuufanya lazima uwe shauri la kisheria.
- source_word: בְּחָזְקָה
  choice: vikali
  rationale: Kirai hiki kinatumika kielezi kuonyesha nguvu ya ugomvi. “Vikali” ni cha asili na kinaonyesha ukali wa mabishano.
