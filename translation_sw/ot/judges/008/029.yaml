  text: Then Jerubbaal son of Joash went and lived in his house[a].
translation:
  language: sw
  text: Yerubaali mwana wa Yoashi akaenda, akakaa nyumbani kwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaenda na kuishi nyumbani kwake” au “akaenda na kufanya makao nyumbani kwake.” Kitenzi cha Kiebrania kinaweza kumaanisha “kukaa,” “kuishi,” au “kufanya makao”; katika muktadha huu kinahusu makazi, si kuketi tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Katika mfululizo wa masimulizi, kitenzi hiki humaanisha kwa kawaida ‘akaenda.’ Kutafsiri ‘akarudi’ kungeongeza wazo la mwelekeo ambalo halijaelezwa wazi katika kitenzi chenyewe.
- source_word: יְרֻבַּעַל
  choice: Yerubaali
  rationale: Aya hii inatumia jina Yerubaali; kwa hiyo limetoholewa badala ya kubadilishwa na jina jingine linalojulikana zaidi, Gideoni.
- source_word: בֶּן יוֹאָשׁ
  choice: mwana wa Yoashi
  rationale: Huu ni muundo wa kawaida unaoonyesha uhusiano wa mwana na baba.
- source_word: וַיֵּשֶׁב
  choice: kuishi
  rationale: Kitenzi ישב kinaweza kumaanisha kukaa, kuishi, au kufanya makao. Katika kirai hiki chenye ‘nyumba yake,’ maana inayofaa ni kuishi huko.
- source_word: בְּבֵיתוֹ
  choice: nyumbani kwake
  rationale: Hii ni tafsiri ya asili na wazi katika Kiswahili ya ‘katika nyumba yake,’ huku ikihifadhi wazo la makao yake mwenyewe.
- source_word: וַ...וַ
  choice: Kisha ... akaenda na kuishi
  rationale: Miundo hii miwili ya vitenzi huendeleza masimulizi kwa mfuatano; ‘Kisha’ na ‘akaenda na kuishi’ huwasilisha mtiririko huo kwa Kiswahili cha kawaida.
