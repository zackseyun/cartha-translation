  text: Then Gideon son of Joash returned from the battle by the ascent of Heres[a].
translation:
  language: sw
  text: Kisha Gideoni mwana wa Yoashi akarudi kutoka vitani kwa njia ya mwinuko wa Heresi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au yawezekana, “kutoka kwenye kupanda kwa jua.” Kirai cha Kiebrania ni kigumu; neno Heresi linaweza kueleweka kuwa jina la mahali au “jua.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Kisha ... akarudi
  rationale: Kitenzi hiki kinaendeleza simulizi kwa tendo lililofuata; “akarudi” ni maana yake ya kawaida, na “Kisha” huonyesha mwendelezo wa matukio kwa Kiswahili cha asili.
- source_word: גִּדְעוֹן
  choice: Gideoni
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: בֶּן יוֹאָשׁ
  choice: mwana wa Yoashi
  rationale: Muundo wa Kiebrania wa kumtambulisha mtu kwa jina la baba yake umetafsiriwa moja kwa moja na kwa ufasaha.
- source_word: מִן הַמִּלְחָמָה
  choice: kutoka vitani
  rationale: Katika muktadha huu neno linarejelea mapigano hususa; “kutoka vitani” ni usemi wa kawaida wa Kiswahili kuliko tafsiri pana ya “kutoka katika vita.”
- source_word: מִלְמַעֲלֵה
  choice: kwa njia ya mwinuko wa
  rationale: Kirai hiki kinaweza kueleza njia au eneo alilopitia aliporudi. “Kwa njia ya mwinuko wa” huhifadhi dhana ya kijiografia bila kulazimisha mwelekeo usio hakika.
- source_word: הֶחָרֶס
  choice: Heresi
  rationale: Neno hili linaweza kueleweka kama jina la mahali au kama “jua.” Jina “Heresi” limetumiwa katika maandishi makuu ili kuhifadhi uwezekano wa mahali, huku maana nyingine ikionyeshwa katika tanbihi.
