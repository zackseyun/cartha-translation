base_translation:
  language: en
  yaml_path: translation/ot/judges/008/022.yaml
  text: Then the men of Israel said to Gideon[a], “Rule over us—you, your son, and your grandson as well—for you have saved us from the hand of Midian.”
translation:
  language: sw
  text: Kisha wanaume wa Israeli wakamwambia Gideoni, “Utawale juu yetu—wewe, mwanao, na mwana wa mwanao pia—kwa maana umetuokoa kutoka mkononi mwa Midiani.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Kisha ... wakamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, huku “wakamwambia” ikidumisha mwendo wa kisimulizi.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: watu wa Israeli
  rationale: Ingawa אִישׁ iko katika umoja wa kisarufi, hapa ina maana ya kundi na inaambatana na kitenzi cha wingi. “Watu wa Israeli” ni usemi wa asili wa Kiswahili unaowakilisha kundi hilo bila kugeuza maana kuwa taifa kwa ujumla kupita kiasi.
- source_word: מְשָׁל בָּנוּ
  choice: Tutawale
  rationale: Kitenzi משל hapa ni amri ya kutawala au kuwa na mamlaka ya kisiasa. “Tutawale” ni fupi, wazi, na ya kawaida katika Kiswahili.
- source_word: גַּם אַתָּה גַּם בִּנְךָ גַּם בֶּן בְּנֶךָ
  choice: wewe, mwanao, na mwana wa mwanao pia
  rationale: Kurudiwa kwa גַּם kunasisitiza mfululizo wa vizazi. “Mwana wa mwanao” huhifadhi kwa uwazi muundo halisi wa Kiebrania na wazo la urithi wa utawala.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza sababu ya ombi lao; “kwa maana” inafaa katika lugha yenye hadhi na inayosomeka kwa urahisi.
- source_word: הוֹשַׁעְתָּנוּ
  choice: umetuokoa
  rationale: Mzizi ישׁע una maana ya kuokoa au kukomboa kutoka hatarini. “Umetuokoa” huhifadhi msamiati mpana wa wokovu huku muktadha ukiweka wazi kuwa ni ukombozi wa kijeshi.
- source_word: מִיַּד מִדְיָן
  choice: kutoka mkononi mwa Midiani
  rationale: “Mkono” ni sitiari ya Kiebrania kwa nguvu au udhibiti. Usemi huu unaeleweka katika Kiswahili cha Biblia na huhifadhi ladha ya maandishi ya chanzo.
theological_decisions:
- issue: Aina ya utawala ambao Gideoni anaombwa
  choice: 'Ombi limetafsiriwa kuwa utawala wa kisiasa unaorithishwa: “Tutawale—wewe, mwanao, na mwana wa mwanao pia.”'
  alternative: Ombi la uongozi wa jumla lisilodokeza urithi wa kifamilia.
  rationale: Amri משל pamoja na kutajwa kwa Gideoni, mwanawe, na mwana wa mwanawe inaonyesha ombi la utawala unaoendelea katika ukoo, si uongozi wa muda wa kijeshi tu. Tafsiri haijaingiza neno la kifalme ambalo halimo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida na kinachoeleweka. Muundo “mwana wa mwanao” umechaguliwa badala ya “mjukuu wako” ili kuhifadhi msisitizo wa Kiebrania kuhusu vizazi vinavyofuatana bila kuhitaji tanbihi.
