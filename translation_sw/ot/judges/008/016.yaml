  text: וַ/יִּקַּח֙ אֶת זִקְנֵ֣י הָ/עִ֔יר וְ/אֶת קוֹצֵ֥י הַ/מִּדְבָּ֖ר וְ/אֶת הַֽ/בַּרְקֳנִ֑ים וַ/יֹּ֣דַע בָּ/הֶ֔ם אֵ֖ת אַנְשֵׁ֥י סֻכּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/016.yaml
  text: Then he took the elders of the city[a], and thorns of the wilderness and briers, and with them he disciplined the men of Succoth.
translation:
  language: sw
  text: Kisha akawachukua wazee wa mji, pamoja na miiba ya nyikani na mibigili, na kwa vitu hivyo akawaadhibu[a] wanaume wa Sukoth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi kinaweza kueleweka kuwa “kwa vitu hivyo akawafanya wanaume wa Sukoth wajue” au “akawafundisha.” Usemi huo ni mgumu, na katika muktadha huu unaonekana kumaanisha kuwa aliwatendea kwa njia ya kuwaadhibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעִיר
  choice: wazee wa mji
  rationale: Neno זִקְנֵי humaanisha kihalisi ‘wazee’ na hapa linataja viongozi wa kiraia wa Sukoth; ‘wazee wa mji’ linahifadhi cheo hicho cha kijamii na kisiasa.
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: miiba ya nyikani
  rationale: Kirai hiki kinataja mimea yenye miiba inayopatikana nyikani; tafsiri hii inahifadhi taswira halisi na uhusiano wa maneno ya Kiebrania.
- source_word: הַבַּרְקֳנִים
  choice: mibigili
  rationale: Neno hili linamaanisha mimea michongoma au yenye miiba. ‘Mibigili’ ni neno la kawaida la Kiswahili linalotofautisha mimea hii na ‘miiba’ iliyotajwa kabla yake.
- source_word: וַיֹּדַע בָּהֶם
  choice: kwa vitu hivyo akawaadhibu
  rationale: Kitenzi ידע katika Hiphil kwa kawaida humaanisha ‘kufanya ajue,’ lakini hapa ni usemi mgumu unaoeleza kitendo cha Gideoni dhidi ya watu wa Sukoth kwa kutumia miiba na mibigili. ‘Akawaadhibu’ huwasilisha nguvu ya kimuktadha bila kudai kwa uhakika njia maalumu zaidi kama ‘kuwapura.’ Maana ya kawaida ya kitenzi imehifadhiwa katika tanbihi.
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: wanaume wa Sukoth
  rationale: אַנְשֵׁי ni umbo la wingi wa kiume, kihalisi ‘wanaume wa’; tafsiri hii inahifadhi jinsia iliyo wazi katika matini ya Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unahifadhi mfululizo wa matendo na taswira halisi ya vifaa vya adhabu, huku tanbihi ikihifadhi ugumu wa usemi wa Kiebrania.
