base_translation:
  language: en
  yaml_path: translation/ot/judges/008/007.yaml
  text: And Gideon said[a], “Therefore, when Yahweh gives Zebah and Zalmunna into my hand, I will thresh your flesh with the thorns of the wilderness and with briers.”
translation:
  language: sw
  text: Gideoni akasema, “Kwa hiyo, Yahwe atakapowatia Zeba na Salmuna mkononi mwangu, nitapura nyama yenu kwa miiba ya nyika na kwa mimea yenye miiba.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa vichaka vyenye miiba”; aina kamili ya mmea unaotajwa na neno la Kiebrania haijulikani kwa hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Inaonyesha kwamba tishio la Gideoni ni matokeo ya kukataa kwa watu wa Sukothi katika mstari uliotangulia.
- source_word: בְּתֵת
  choice: atakapowatia
  rationale: Muundo wa ב pamoja na kitenzi-jina una maana ya wakati ujao hapa; ‘atakapowatia’ ni Kiswahili cha kawaida na huhifadhi maana ya ‘Yahwe atakapowatia chini ya mamlaka yangu.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatamka jina la Mungu lililoandikwa kwa herufi YHWH badala ya kulibadilisha kuwa cheo.
- source_word: בְּיָדִי
  choice: mkononi mwangu
  rationale: Huhifadhi taswira halisi ya nahau ya Kiebrania inayomaanisha kutiwa chini ya uwezo au mamlaka ya mtu.
- source_word: וְדַשְׁתִּי
  choice: nitapura
  rationale: Huhifadhi sitiari kali ya kilimo ya kupura badala ya kuilegeza kuwa adhabu au kupiga kwa ujumla.
- source_word: בְּשַׂרְכֶם
  choice: nyama yenu
  rationale: Ni tafsiri ya moja kwa moja yenye ukali unaofaa kwa tishio hili; ‘miili yenu’ ingepunguza taswira ya kikatili.
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: miiba ya nyikani
  rationale: Huhifadhi taswira ya mimea yenye miiba na mazingira ya מִדְבָּר kwa Kiswahili kifupi na cha asili.
- source_word: הַבַּרְקֳנִים
  choice: mimea yenye miiba
  rationale: Aina mahususi ya mmea haijulikani kwa uhakika; kauli hii huonyesha sifa yake ya kuchoma bila kudai utambulisho wa kibotania usio na hakika.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ina jina maalumu la Mungu, YHWH. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘nitapura nyama yenu’ umeachwa kwa makusudi ili kuhifadhi sitiari kali na isiyo ya kawaida ya Kiebrania. Alama ya tanbihi imewekwa baada ya kirai kinachohusika.
