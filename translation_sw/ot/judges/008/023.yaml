base_translation:
  language: en
  yaml_path: translation/ot/judges/008/023.yaml
  text: But Gideon said to them[a], “I will not rule over you, and my son will not rule over you; Yahweh will rule over you.”
translation:
  language: sw
  text: Lakini Gideoni akawaambia[a], “Mimi sitawatawala, wala mwanangu hatawatawala; Yahwe atawatawala.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Gideoni akawaambia.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa tu kama mwendelezo wa simulizi, lakini hapa “Lakini” huonyesha tofauti kati ya jibu la Gideoni na ombi la watu katika mstari uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini ... akawaambia
  rationale: Muunganisho wa Kiebrania unaendeleza simulizi, lakini katika muktadha huu jibu la Gideoni linapingana na ombi la watu katika mstari uliotangulia; ‘Lakini’ huonyesha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: לֹא אֶמְשֹׁל אֲנִי בָּכֶם
  choice: Mimi sitawatawala
  rationale: Kitenzi מָשַׁל kinamaanisha kutawala. Kiwakilishi huru אֲנִי kimewakilishwa kwa ‘Mimi,’ kikihifadhi mkazo wa wazi katika Kiebrania.
- source_word: וְלֹא יִמְשֹׁל בְּנִי בָּכֶם
  choice: wala mwanangu hatawatawala
  rationale: ‘Wala’ huendeleza ukanushaji kwa njia ya asili, na ‘mwanangu’ huhifadhi umoja wa בְּנִי pamoja na wazo la kukataa urithi wa utawala bila kulieleza kupita maandishi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: יְהוָה יִמְשֹׁל בָּכֶם
  choice: Yahwe ndiye atakayewatawala
  rationale: Kurudia mzizi wa ‘kutawala’ kunahifadhi ulinganifu wa balagha kati ya Gideoni, mwanawe, na Yahwe. ‘Ndiye’ huonyesha mkazo wa nafasi ya jina la Mungu bila kuongeza wazo la ufalme lisilotajwa.
theological_decisions:
- issue: Kukataliwa kwa utawala wa Gideoni na wa ukoo wake
  choice: Gideoni anakataa yeye mwenyewe na mwanawe kuwatawala watu, na anasema Yahwe ndiye atakayewatawala.
  alternative: Gideoni anakataa tu cheo rasmi cha mfalme huku akiendelea kutawala kwa vitendo.
  rationale: Mstari unatumia kitenzi kilekile מָשַׁל kwa Gideoni, mwanawe, na Yahwe, bila kutumia neno maalumu la ‘mfalme.’ Tafsiri inadumisha tofauti hiyo bila kuamua zaidi ya yale yanayosemwa na mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Kutawala’ limerudiwa ili kuhifadhi neno kuu na ulinganifu wa Kiebrania; ‘wala’ ni uratibu wa asili wa vifungu viwili hasi.
