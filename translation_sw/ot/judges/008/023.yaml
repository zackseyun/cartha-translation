  verdict: revise
  source_fidelity: The translation accurately renders Gideon’s refusal of both personal and filial rule and preserves the repeated ruling terminology. However, “ndiye” in the final clause adds an explicit exclusivity/emphasis not overtly expressed by the Hebrew.
  naturalness: The Swahili is clear, idiomatic, and appropriately dignified. “Mimi sitawatawala, wala mwanangu hatawatawala” reads naturally in Standard East African Swahili.
  terminology: “Kutawala” consistently represents מָשַׁל and effectively retains the rhetorical parallel. “Yahwe” is a suitable transliteration of the divine name in this translation’s stated naming practice.
  issues:
  - severity: low
    issue: The final clause includes “ndiye.”
    rationale: Hebrew has “Yahweh will rule over you,” with Yahweh placed first for the contrast, but it has no separate particle equivalent to Swahili “ndiye.” Omitting it retains the contrast without making exclusivity more explicit than the source does.
