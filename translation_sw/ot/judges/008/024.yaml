base_translation:
  language: en
  yaml_path: translation/ot/judges/008/024.yaml
  text: 'Then Gideon said to them, “Let me ask one request of you: each man, give me an earring from his spoil.” For they had gold earrings, because they were Ishmaelites.'
translation:
  language: sw
  text: 'Ndipo Gideoni akawaambia, “Nina ombi moja kwenu: kila mmoja anipe pete ya sikio kutoka katika nyara zake.” Kwa maana watu hao walikuwa na pete za masikio za dhahabu, kwa sababu walikuwa Waishmaeli.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶשְׁאֲלָה מִכֶּם שְׁאֵלָה
  choice: Nina ombi moja kwenu
  rationale: Muundo wa Kiebrania una kitenzi na nomino zenye mzizi mmoja, yaani kwa maana halisi ‘naomba kwenu ombi.’ Tafsiri hii inatoa maana hiyo kwa Kiswahili cha kawaida bila kurudia maneno kwa namna isiyo ya asili.
- source_word: אִישׁ
  choice: kila mmoja
  rationale: 'Ingawa neno lenyewe ni ‘mtu/mwanaume,’ katika agizo hili lina nguvu ya mgawanyo: kila mtu katika kundi atoaye pete moja.'
- source_word: נֶזֶם
  choice: pete ya sikio
  rationale: Katika muktadha, kifungu kinachofuata kinataja pete za dhahabu walizovaa Waishmaeli; ‘pete ya sikio’ ni sahihi na wazi kuliko ‘pete’ peke yake.
- source_word: שְׁלָלוֹ
  choice: nyara zake
  rationale: 'Kiwakilishi cha umoja kinadumishwa: kila mmoja atoe katika sehemu ya nyara aliyokuwa amechukua.'
- source_word: יִשְׁמְעֵאלִים
  choice: Waishmaeli
  rationale: Hili ni jina la kikundi cha watu, likitafsiriwa kwa umbo la kawaida la Kiswahili.
theological_decisions:
- issue: Utambulisho wa waliouawa kuwa Waishmaeli
  choice: kwa sababu walikuwa Waishmaeli
  alternative: kwa sababu walikuwa Wamidiani waliotajwa kwa upana kuwa Waishmaeli
  rationale: Maandishi yanatoa tu sababu kwamba walikuwa Waishmaeli. Tafsiri haijaribu kusuluhisha uhusiano kati ya majina ‘Wamidiani’ na ‘Waishmaeli’ katika simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Sentensi ya Gideoni imetolewa kwa mtiririko wa kawaida, huku mgawanyo wa ‘kila mmoja’ na umoja wa ‘nyara zake’ vikihifadhiwa.
