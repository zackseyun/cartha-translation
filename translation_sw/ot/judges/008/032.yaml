translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa simulizi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Muundo ‘uzee mwema’ umehifadhiwa ili kutunza kauli chanya ya Kiebrania bila kuifafanua kupita kiasi.
