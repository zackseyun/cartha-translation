base_translation:
  language: en
  yaml_path: translation/ot/judges/008/032.yaml
  text: And Gideon son of Joash died at a good old age and was buried in the tomb of Joash his father[b][a], in Ophrah of the Abiezrites.
translation:
  language: sw
  text: Gideoni mwana wa Yoashi akafa katika uzee mwema, akazikwa katika kaburi la Yoashi baba yake, huko Ofra ya ukoo wa Abiezeri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania husema “Ofra ya Mwaabiezeri,” yaani Ofra iliyohusishwa na ukoo wa Abiezeri.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kitenzi מות kinamaanisha moja kwa moja ‘kufa’; ‘akafa’ ni tafsiri wazi isiyolainisha kauli ya Kiebrania.
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: Gideoni mwana wa Yoashi
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili, na fungu la nasaba limetafsiriwa kwa mpangilio wa kawaida wa Kiswahili.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: akiwa na uzee mwema
  rationale: שֵׂיבָה ni uzee au mvi, na טוֹבָה inaeleza hali hiyo kwa namna chanya. Kauli hii huhifadhi taswira na tathmini ya Kiebrania bila kuongeza wazo la kushiba maisha au kutaja idadi ya miaka.
- source_word: וַיִּקָּבֵר
  choice: naye akazikwa
  rationale: Nifali ya קבר hapa ina maana ya kutendwa, ‘alizikwa’; ‘naye’ huendeleza mtiririko wa simulizi.
- source_word: בְּקֶבֶר
  choice: katika kaburi
  rationale: קֶבֶר inaweza kuwa shimo la kuzikia, kaburi, au mahali pa maziko. ‘Kaburi’ ni neno la kawaida la Kiswahili na linaweza pia kumaanisha jengo au mahali pa maziko kulingana na muktadha.
- source_word: יוֹאָשׁ אָבִיו
  choice: la Yoashi baba yake
  rationale: Tafsiri hii inaonyesha kuwa kaburi lilihusishwa na Yoashi na kwamba Yoashi alikuwa baba yake Gideoni.
- source_word: בְּעָפְרָה
  choice: huko Ofra
  rationale: ‘Ofra’ ni uhamishaji wa jina la mahali; ‘huko’ huonyesha wazi kwamba fungu hili linataja mahali kaburi lilipokuwa.
- source_word: אֲבִי הָעֶזְרִי
  choice: ya ukoo wa Abiezeri
  rationale: Nomino hii ya utambulisho hutaja Mwaabiezeri, yaani mtu au ukoo unaotokana na Abiezeri. Katika muktadha wa mji, Kiswahili cha ‘ukoo wa Abiezeri’ huwasilisha maana hiyo kwa uwazi.
