  text: וַ/יֹּ֜אמֶר זֶ֣בַח וְ/צַלְמֻנָּ֗ע ק֤וּם אַתָּה֙ וּ/פְגַע בָּ֔/נוּ כִּ֥י כָ/אִ֖ישׁ גְּבוּרָת֑/וֹ וַ/יָּ֣קָם גִּדְע֗וֹן וַֽ/יַּהֲרֹג֙ אֶת זֶ֣בַח וְ/אֶת צַלְמֻנָּ֔ע וַ/יִּקַּח֙ אֶת הַ/שַּׂ֣הֲרֹנִ֔ים אֲשֶׁ֖ר בְּ/צַוְּארֵ֥י גְמַלֵּי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/021.yaml
  text: Then Zebah and Zalmunna said[a], “Rise yourself and strike us down, for as the man is, so is his strength.” So Gideon rose and killed Zebah and Zalmunna[c][b], and he took the crescent ornaments that were on the necks of their camels.
translation:
  language: sw
  text: Ndipo Zeba na Salmuna wakasema, “Inuka wewe mwenyewe, utuue, kwa maana mtu alivyo, ndivyo nguvu zake zilivyo.” Basi Gideoni akainuka, akawaua Zeba na Salmuna, kisha akachukua mapambo yenye umbo la hilali[a] yaliyokuwa shingoni mwa ngamia wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mapambo yenye umbo la mwezi mwandamo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... זֶבַח וְצַלְמֻנָּע
  choice: Ndipo Zeba na Salmuna wakasema
  rationale: Kitenzi cha Kiebrania kiko katika umoja ingawa kiima ni cha watu wawili; Kiswahili cha kawaida hutumia wingi. “Ndipo” linaonyesha mwendelezo wa simulizi.
- source_word: קוּם אַתָּה
  choice: Simama wewe mwenyewe
  rationale: Kiwakilishi cha wazi אַתָּה kinakazia kwamba Gideoni mwenyewe, si kijana wake, afanye tendo hilo.
- source_word: וּפְגַע בָּנוּ
  choice: utuue
  rationale: Ingawa פגע inaweza kumaanisha kukutana, kushambulia, au kupiga, katika muktadha huu wafalme wanaomba pigo la kuwaua. Kiswahili “utuue” huwasilisha maana ya kimuktadha kwa uwazi.
- source_word: כִּי כָאִישׁ גְּבוּרָתוֹ
  choice: kwa maana alivyo mtu, ndivyo zilivyo nguvu zake
  rationale: Huhifadhi muundo wa kimethali na uhusiano kati ya mtu na nguvu zake bila kuufafanua kupita kiasi kuwa ukubwa wa mwili au ushujaa pekee.
- source_word: וַיָּקָם גִּדְעוֹן
  choice: Basi Gideoni akasimama
  rationale: “Akasimama” linaitikia moja kwa moja amri “simama” na kudumisha mfuatano wa simulizi.
- source_word: וַיַּהֲרֹג
  choice: akawaua
  rationale: Ni tafsiri ya moja kwa moja na ya sasa ya kitenzi cha kuua, huku kiambishi cha wingi kikiwarejelea Zeba na Salmuna.
- source_word: הַשַּׂהֲרֹנִים
  choice: mapambo yenye umbo la mwezi mwandamo
  rationale: Neno hilo linataja mapambo ya umbo la hilali au mwezi mwandamo. Usemi huu ni wazi kwa msomaji wa kawaida na hauyafanyi yaonekane kuwa miezi halisi.
- source_word: אֲשֶׁר בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: yaliyokuwa shingoni mwa ngamia wao
  rationale: Hutoa mahali pa mapambo kwa Kiswahili sanifu na cha kawaida.
theological_decisions:
- issue: Usemi wa kimethali wenye jinsia כָאִישׁ
  choice: alivyo mtu, ndivyo zilivyo nguvu zake
  alternative: alivyo mwanamume, ndivyo zilivyo nguvu zake
  rationale: Katika Kiswahili, “mtu” linaweza kutumika kwa kawaida ndani ya methali huku muktadha ukionyesha kwamba anayelengwa ni shujaa wa kiume. Hii huhifadhi wazo bila kuingiza ufafanuzi wa kimadhehebu au kupunguza mvutano wa usemi.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usimulizi wa Biblia. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili: Zeba, Salmuna, na Gideoni. Muundo wa methali umehifadhiwa badala ya kufafanuliwa kimatumizi.'
