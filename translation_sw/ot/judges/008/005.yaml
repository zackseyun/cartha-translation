base_translation:
  language: en
  yaml_path: translation/ot/judges/008/005.yaml
  text: And he said to the men of Succoth[a], “Please give loaves of bread to the people who are with me, for they are weary, and I am pursuing Zebah and Zalmunna, the kings of Midian.”
translation:
  language: sw
  text: Akawaambia wanaume wa Sukothi, “Tafadhali wapeni watu walio pamoja nami[a] mikate, kwa maana wamechoka, nami ninawafuatia Zeba na Salmuna, wafalme wa Midiani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “watu walio miguuni pangu,” nahau inayomaanisha watu wanaoandamana nami au kunifuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַנְשֵׁי סֻכּוֹת
  choice: wanaume wa Sukothi
  rationale: Neno אַנְשֵׁי linaonyesha wanaume, huenda wawakilishi wa kiume wa mji; ‘wanaume wa Sukothi’ linahifadhi maana hiyo badala ya kuifanya kuwa wakazi kwa ujumla.
- source_word: תְּנוּ נָא
  choice: Tafadhali wapeni
  rationale: Amri pamoja na נָא ni ombi la heshima au lenye kusisitiza; ‘Tafadhali wapeni’ ni Kiswahili cha kawaida na huonyesha ombi hilo.
- source_word: כִּכְּרוֹת לֶחֶם
  choice: mikate
  rationale: Katika muktadha huu כִּכָּר ni mkate mzima au donge la mkate. ‘Mikate’ ni usemi wa kawaida wa Kiswahili usiohitaji marudio ya ‘mikate ya mkate.’
- source_word: לָעָם אֲשֶׁר בְּרַגְלָי
  choice: watu walio pamoja nami
  rationale: Kauli hiyo kwa neno moja moja ni ‘watu walio miguuni pangu,’ lakini ni nahau inayomaanisha wanaoandamana au kufuatana naye. Tafsiri hii huwasilisha maana kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi taswira ya Kiebrania.
- source_word: עֲיֵפִים
  choice: wamechoka
  rationale: Kivumishi hiki kinaonyesha uchovu unaotokana na juhudi; ‘wamechoka’ ni sahihi na cha kawaida bila kudokeza kwamba wamezimia.
- source_word: רֹדֵף אַחֲרֵי
  choice: ninawafuatia
  rationale: Umbo la kitenzi linaonyesha shughuli inayoendelea ya kuwafuatia kwa lengo la kuwakamata; ‘ninawafuatia’ huhifadhi hali hiyo bila kudokeza kwamba anawafukuza waondoke.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Zeba na Salmuna
  rationale: Majina haya yametoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: מַלְכֵי מִדְיָן
  choice: wafalme wa Midiani
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania unaomaanisha wafalme wa eneo au taifa la Midiani.
