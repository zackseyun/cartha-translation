base_translation:
  language: en
  yaml_path: translation/ot/judges/008/018.yaml
  text: Then he said to Zebah and Zalmunna[a], “Where are the men whom you killed at Tabor?” And they said, “As you are, so were they[b]; each one had the appearance of the sons of a king.”
translation:
  language: sw
  text: Kisha akawaambia Zeba na Salmuna, “Wale watu mliowaua huko Tabori walikuwaje?” Nao wakasema, “Walikuwa kama wewe; kila mmoja alionekana kama mwana wa mfalme.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵיפֹה הָאֲנָשִׁים
  choice: Wale watu ... walikuwaje?
  rationale: Ingawa אֵיפֹה kwa kawaida huuliza mahali, katika muktadha huu watu hao tayari wameuawa, na jibu linaeleza sura yao. Kwa hiyo Kiswahili cha asili ‘walikuwaje?’ kinafikisha maana inayodokezwa na swali na jibu bila kudai kwamba bado walikuwa hai.
- source_word: הָאֲנָשִׁים
  choice: wale watu
  rationale: ‘Watu’ ni neno la kawaida na lenye hadhi kwa wanaume wanaotajwa; kiashiria ‘wale’ kinawatambulisha kama wahanga maalumu wanaojulikana katika mazungumzo.
- source_word: הֲרַגְתֶּם
  choice: mliowaua
  rationale: Hutoa maana ya msingi ya ‘kuua’ na kuhifadhi nafsi ya pili wingi bila kuongeza hukumu ya kisheria kama ‘kuwaua kwa jinai.’
- source_word: בְּתָבוֹר
  choice: huko Tabori
  rationale: ‘Huko’ huonyesha mahali palipotajwa, na ‘Tabori’ ni umbo la jina linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: כָּמוֹךָ כְמוֹהֶם
  choice: Walikuwa kama wewe
  rationale: Kiebrania ni linganisho fupi lenye mpangilio usio wa kawaida. Tafsiri hii huhifadhi ulinganisho wao na Gideoni kwa Kiswahili kinachoeleweka.
- source_word: אֶחָד
  choice: kila mmoja
  rationale: Neno limetumiwa kwa maana ya kugawa kwa kila mtu katika kundi.
- source_word: כְּתֹאַר בְּנֵי הַמֶּלֶךְ
  choice: alionekana kama mwana wa mfalme
  rationale: תֹאַר huhusu sura au mwonekano. ‘Alionekana kama’ ni Kiswahili cha kawaida, na ‘mwana wa mfalme’ huhifadhi tashbihi ya kifalme bila kuifasiri moja kwa moja kuwa ‘mwana-mfalme.’
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: Kisha akawaambia ... Nao wakasema
  rationale: Huhifadhi mfuatano wa simulizi. ‘Akawaambia’ huweka wazi kwamba hotuba inaelekezwa kwa watu wawili.
