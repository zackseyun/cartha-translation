base_translation:
  language: en
  yaml_path: translation/ot/judges/008/034.yaml
  text: And the sons of Israel did not remember Yahweh their God[a], who had delivered them from the hand of all their enemies all around.
translation:
  language: sw
  text: Nao wana wa Israeli[a] hawakumkumbuka Yahwe, Mungu wao, aliyewaokoa kutoka mkononi mwa maadui zao wote waliokuwa pande zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Waisraeli.” Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Nao ... hawaku-
  rationale: “Nao” linaendeleza mtiririko wa simulizi, huku kitenzi hasi “hawakumkumbuka” kikibeba ukanushi wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: זָכְרוּ
  choice: hawakumkumbuka
  rationale: Kitenzi זכר kinaweza kumaanisha zaidi ya kukumbuka akilini; katika muktadha huu kinadokeza pia uaminifu unaotokana na kukumbuka. “Kumkumbuka” huhifadhi upana huo bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hili linafuata kwa karibu usemi wa Kiebrania “wana wa Israeli,” huku likibaki wazi na lenye hadhi katika Kiswahili. “Waisraeli” limetolewa kama njia mbadala ya kawaida zaidi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵיהֶם
  choice: Mungu wao
  rationale: Ingawa umbo la אֱלֹהִים ni la wingi kisarufi, hapa linamrejelea Yahwe mmoja na linaonyesha uhusiano wake na Israeli.
- source_word: הַמַּצִּיל
  choice: aliyekuwa amewaokoa
  rationale: Kivumishi-tendaji chenye kibainishi kinamtambulisha Yahwe kwa tendo lake la kuokoa. Kauli hii ya Kiswahili inaonyesha kwamba wokovu huo ulitangulia kushindwa kwao kumkumbuka.
- source_word: מִיַּד
  choice: kutoka mkononi mwa
  rationale: Usemi huu huhifadhi picha ya Kiebrania ya “mkono” kama mamlaka au nguvu ya adui, na unaeleweka katika Kiswahili.
- source_word: כָּל אֹיְבֵיהֶם
  choice: adui zao wote
  rationale: Hili linawasilisha kwa uwazi maana jumuishi ya “adui zao wote.”
- source_word: מִסָּבִיב
  choice: waliowazunguka
  rationale: Hili linaonyesha kwamba maadui walikuwa pande zote na linaungana kwa kawaida na nomino “adui” katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo kama “Bwana.”
- issue: Usemi wa kijumuiya wenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: “Wana wa Israeli” hufuata kwa karibu muundo wa Kiebrania bila kudai kwamba kundi lilikuwa la wanaume pekee; njia mbadala ya kawaida zaidi imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida. Muundo wa Kiebrania umehifadhiwa pale unapobaki wa asili katika Kiswahili, hasa katika “mkono” kama picha ya mamlaka.
