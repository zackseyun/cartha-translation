translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia “bila kuhesabu ... wala” kuonyesha wazi kwamba mapambo na mavazi hayakujumuishwa katika jumla ya uzito. Alama zote za tanbihi zimewekwa katika matini; [b] imewekwa baada ya sentensi kwa kuwa inafafanua neno “pete” lililo mwanzoni.
