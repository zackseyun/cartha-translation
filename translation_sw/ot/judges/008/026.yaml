base_translation:
  language: en
  yaml_path: translation/ot/judges/008/026.yaml
  text: And the weight of the gold rings that he requested was 1,700 shekels of gold[a], besides the crescent ornaments and the pendants and the purple garments that were on the kings of Midian[b], and besides the necklaces that were on the necks of their camels.
translation:
  language: sw
  text: Uzito wa pete[b] za dhahabu alizoomba ulikuwa shekeli 1,700 za dhahabu[a], mbali na mapambo yenye umbo la mwezi mwandamo, vidani, na mavazi ya rangi ya zambarau yaliyovaliwa na wafalme wa Midiani; na mbali na mikufu iliyokuwa shingoni mwa ngamia wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “1,700 za dhahabu”; neno “shekeli” limeongezwa kama kipimo cha uzito kinachoeleweka katika muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au, “vipete vya masikio” badala ya “pete”; neno la Kiebrania linaweza kumaanisha pete inayovaliwa sikioni au puani.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקַ֞ל
  choice: Uzito
  rationale: Nomino hii humaanisha uzito uliopimwa, si kiasi tu; “uzito” ni Kiswahili cha kawaida na sahihi katika orodha ya vitu vya thamani.
- source_word: נִזְמֵי הַזָּהָב
  choice: pete za dhahabu
  rationale: נזם inaweza kuwa pete inayovaliwa sikioni au puani. “Pete” huhifadhi upana huo bila kutaja mahali pasipotajwa wazi katika Kiebrania.
- source_word: אֲשֶׁר שָׁאָל
  choice: alizoomba
  rationale: Kitenzi kinarejelea ombi la Gideoni kwa wanaume kuhusu sehemu ya nyara; “alizoomba” ni cha asili na chenye hadhi katika Kiswahili.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת זָהָב
  choice: shekeli 1,700 za dhahabu
  rationale: Kiebrania kinasema kihalisi “1,700 dhahabu,” lakini katika taarifa ya uzito kipimo kinachoeleweka ni shekeli; kimetajwa wazi kwa ufafanuzi.
- source_word: לְבַד מִן
  choice: bila kuhesabu ... wala
  rationale: Kirai hiki kinaonyesha kwamba vitu vinavyofuata havikujumuishwa katika uzito uliotangulia. Muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: הַשַּׂהֲרֹנִים
  choice: mapambo yenye umbo la mwezi mwandamo
  rationale: Neno linarejelea mapambo yenye umbo la hilali; usemi huu unaeleweka kwa urahisi kuliko mkopo usio wa kawaida huku ukihifadhi umbo linalokusudiwa.
- source_word: הַנְּטִפוֹת
  choice: vidani
  rationale: Nomino inaelekea kumaanisha mapambo yanayoning’inia. “Vidani” ni neno pana la mapambo ya kuning’inia na halibainishi kwa uhakika zaidi ya Kiebrania.
- source_word: בִגְדֵי הָאַרְגָּמָן
  choice: mavazi ya rangi ya zambarau
  rationale: Hutaja mavazi yaliyotambulishwa kwa rangi au kitambaa cha zambarau, alama ya kifalme; tafsiri hii ni wazi na ya asili.
- source_word: שֶׁעַל מַלְכֵי מִדְיָן
  choice: yaliyovaliwa na wafalme wa Midiani
  rationale: Kwa habari ya mavazi, על huonyesha yaliyokuwa juu yao, yaani waliyoyavaa. Kiswahili hiki huwasilisha picha hiyo kwa kawaida.
- source_word: הָעֲנָקוֹת
  choice: mikufu
  rationale: Neno humaanisha mapambo ya shingoni; “mikufu” ni neno la Kiswahili linaloeleweka, hasa kwa kuwa kirai kinachofuata kinataja shingo za ngamia.
- source_word: בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: iliyokuwa shingoni mwa ngamia wao
  rationale: Kirai kinabainisha mahali mapambo hayo yalipokuwa; “shingoni mwa” ni muundo wa asili na sahihi katika Kiswahili.
