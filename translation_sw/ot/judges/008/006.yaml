base_translation:
  language: en
  yaml_path: translation/ot/judges/008/006.yaml
  text: Then the leaders of Succoth said, “Are the hands of Zebah and Zalmunna already in your hand, that we should give bread to your army?”
translation:
  language: sw
  text: Ndipo wakuu wa Sukothi wakasema, “Je, Zebahi na Salmuna tayari wako mikononi mwako, hata tuwape jeshi lako mkate?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי סֻכּוֹת
  choice: viongozi wa Sukothi
  rationale: Neno שָׂרֵי hapa linamaanisha watawala au wakuu wa mji; “viongozi” ni la kawaida na linafaa katika muktadha huu.
- source_word: הֲכַף זֶבַח וְצַלְמֻנָּע ... בְּיָדֶךָ
  choice: Je, Zebahi na Salmuna tayari wako mikononi mwako
  rationale: Kiebrania halisi hutaja “kiganja/mkono wa Zebahi na Salmuna” kama sehemu inayowakilisha watu wenyewe. Kiswahili cha “wako mikononi mwako” kinahifadhi picha ya kuwakamata au kuwatiisha bila kuwa kigumu kueleweka.
- source_word: עַתָּה
  choice: tayari
  rationale: Katika swali hili la dhihaka, עַתָּה lina maana ya “hivi sasa/tayari”; “tayari” huonyesha kwamba viongozi wanadai Gideoni bado hajawakamata.
- source_word: צְבָאֲךָ
  choice: wanajeshi wako
  rationale: Ingawa neno linaweza kumaanisha jeshi, hapa linawahusu watu wa Gideoni ambao wangepewa chakula.
- source_word: לֶחֶם
  choice: mikate
  rationale: Maana ya msingi ni mkate, lakini inaweza pia kumaanisha chakula kwa jumla. “Mikate” inadumisha picha halisi ya mahitaji ya jeshi.
theological_decisions: []
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Swali la viongozi limehifadhiwa kama kejeli yenye masharti: hawataki kutoa chakula kabla Gideoni hajawakamata wafalme hao.'
