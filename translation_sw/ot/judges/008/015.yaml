base_translation:
  language: en
  yaml_path: translation/ot/judges/008/015.yaml
  text: Then he came to the men of Succoth and said[a], “Here are Zebah and Zalmunna, about whom you taunted me, saying, ‘Are Zebah and Zalmunna already in your hand[b], that we should give bread to your weary men?’”
translation:
  language: sw
  text: Kisha akaja kwa watu wa Sukothi, akasema, “Hawa hapa Zeba na Salmuna, ambao mlinidhihaki kuhusu hao[a], mkisema, ‘Je, Zeba na Salmuna tayari wako mkononi mwako[b], hata tuwape watu wako waliochoka mkate?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlinilaumu kwa dharau” au “mlinikejeli.” Kitenzi cha Kiebrania kina maana ya shutuma au dhihaka yenye dharau.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “Je, kiganja/mkono wa Zeba na Salmuna sasa uko mkononi mwako?” Hii ni nahau yenye maana ya, “Je, tayari umewakamata?”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: watu wa Sukothi
  rationale: Ingawa neno la Kiebrania lina maana halisi ya ‘wanaume wa,’ katika Kiswahili ‘watu wa Sukothi’ ni njia ya kawaida na ya asili ya kutaja wakazi au viongozi wanaosemeshwa; muktadha unabainisha kundi husika.
- source_word: הִנֵּה
  choice: Hawa hapa
  rationale: Kauli hii ya kuonyesha inavuta fikira kwa wafungwa waliopo mbele yao, na ni ya asili katika Kiswahili cha sasa.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Zeba na Salmuna
  rationale: Majina haya ya watu yametoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: אֲשֶׁר חֵרַפְתֶּם אוֹתִי
  choice: ambao kwa habari yao mlinidhihaki
  rationale: Kitenzi חרף kinaonyesha dharau au shutuma ya kejeli; muundo ‘kwa habari yao’ unaonyesha kuwa dhihaka dhidi ya Gideoni ilihusu kutowakamata wafalme hao.
- source_word: לֵאמֹר
  choice: mkisema
  rationale: Ni kauli ya kawaida ya kuanzisha maneno yaliyonukuliwa, huku ikilingana na nafsi ya wasemaji.
- source_word: הֲכַף ... בְּיָדֶךָ
  choice: Je, Zeba na Salmuna tayari wako mkononi mwako
  rationale: Inahifadhi taswira ya Kiebrania ya kuwa ‘mkononi’ huku ikitoa maana ya kuwa wamekamatwa na wako chini ya mamlaka ya Gideoni.
- source_word: כִּי נִתֵּן
  choice: hata tuwape
  rationale: 'Katika swali hili la kejeli, ‘hata’ linaonyesha matokeo yanayokanushwa: hawakuona sababu ya kutoa chakula kabla wafalme hao hawajakamatwa.'
- source_word: לַאֲנָשֶׁיךָ הַיְּעֵפִים
  choice: watu wako waliochoka
  rationale: ‘Waliochoka’ huwasilisha kwa lugha ya kawaida hali ya uchovu kutokana na kuwafuatia adui.
- source_word: לָחֶם
  choice: mikate
  rationale: Neno la Kiebrania linaweza kumaanisha mkate au chakula kwa upana; hapa ‘mikate’ huhifadhi maana ya moja kwa moja ya chakula walichoombwa wapiganaji.
