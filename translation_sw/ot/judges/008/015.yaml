  to: Kisha akaja kwa watu wa Sukothi, akasema, “Hawa hapa Zeba na Salmuna, ambao mlinidhihaki kuhusu hao[a], mkisema, ‘Je, Zeba na Salmuna tayari wako mkononi mwako[b], hata tuwape watu wako waliochoka mkate?’”
