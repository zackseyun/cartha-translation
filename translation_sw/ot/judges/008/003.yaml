  - severity: low
    issue: Umoja wa ‘neno’ haujahifadhiwa katika sentensi kuu.
    rationale: הַדָּבָר iko katika umoja. Ingawa ‘maneno hayo’ inaweza kusikika kawaida, ‘neno hilo’ ni ya asili na ya karibu zaidi na matini chanzo.
  - severity: low
    issue: Maneno ya utangulizi wa tanbihi si ya kawaida.
    rationale: ‘Kwa neno moja moja’ si usemi wa kawaida; ‘Kwa neno kwa neno’ ni sahihi zaidi.
