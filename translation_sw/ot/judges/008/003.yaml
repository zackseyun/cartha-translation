  text: בְּ/יֶדְ/כֶם֩ נָתַ֨ן אֱלֹהִ֜ים אֶת שָׂרֵ֤י מִדְיָן֙ אֶת עֹרֵ֣ב וְ/אֶת זְאֵ֔ב וּ/מַה יָּכֹ֖לְתִּי עֲשׂ֣וֹת כָּ/כֶ֑ם אָ֗ז רָפְתָ֤ה רוּחָ/ם֙ מֵֽ/עָלָ֔י/ו בְּ/דַבְּר֖/וֹ הַ/דָּבָ֥ר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/003.yaml
  text: Into your hand God gave the princes of Midian[a], Oreb and Zeeb; and what was I able to do compared with you? Then their spirit relaxed toward him when he spoke this word.
translation:
  language: sw
  text: Mungu aliwatia mikononi mwenu wakuu wa Midiani, Orebu na Zeebu. Je, mimi niliweza kufanya nini kama ninyi? Aliposema neno hilo, hasira yao dhidi yake ikatulia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, Kiebrania kinasema, “roho yao ikalegea kutoka juu yake.”
    reason: Nahau ya Kiebrania imetafsiriwa kwa maana yake katika matini kuu; tanbihi inahifadhi taswira halisi ya lugha chanzo.
lexical_decisions:
- source_word: בְּיֶדְכֶם נָתַן אֱלֹהִים
  choice: Mungu aliwatia mikononi mwenu
  rationale: Usemi wa Kiebrania wa kuwaweka watu katika mkono wa mtu humaanisha kuwatia chini ya mamlaka yake. Kiswahili hutumia kwa kawaida wingi ‘mikononi mwenu,’ huku kitenzi ‘aliwatia’ kikidumisha picha ya matini chanzo.
- source_word: שָׂרֵי מִדְיָן
  choice: wakuu wa Midiani
  rationale: שָׂרִים ni watawala au viongozi wenye cheo. ‘Wakuu’ ni neno la kawaida, lenye heshima, na halibainishi bila lazima kwamba walikuwa wana wa mfalme.
- source_word: עֹרֵב וְאֶת זְאֵב
  choice: Orebu na Zeebu
  rationale: Majina yametoholewa kwa namna inayoeleweka na inayofaa mfumo wa sauti wa Kiswahili.
- source_word: וּמַה יָּכֹלְתִּי עֲשׂוֹת כָּכֶם
  choice: Je, mimi niliweza kufanya nini kulinganishwa na mlivyofanya ninyi?
  rationale: Kauli hii ni swali la kujishusha linalolinganisha matendo ya Gideoni na yale ya Waefraimu. Tafsiri hii inaweka wazi ulinganisho bila kuondoa nguvu ya swali.
- source_word: רָפְתָה רוּחָם מֵעָלָיו
  choice: hasira yao dhidi yake ikatulia
  rationale: Kirai hiki kwa neno moja moja husema kwamba ‘roho yao ililegea kutoka juu yake,’ lakini katika muktadha ni nahau ya kupungua kwa hasira au uhasama. ‘Hasira ... ikatulia’ ni Kiswahili cha kawaida na huhifadhi mwelekeo wa hisia hizo ‘dhidi yake.’
- source_word: בְּדַבְּרוֹ הַדָּבָר הַזֶּה
  choice: Aliposema maneno hayo
  rationale: Muundo huu unaonyesha wakati au tukio lililosababisha mabadiliko. Ingawa דָּבָר iko katika umoja, ‘maneno hayo’ ni njia ya kawaida ya Kiswahili ya kurejelea kauli aliyotoa.
