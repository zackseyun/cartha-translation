base_translation:
  language: en
  yaml_path: translation/ot/judges/008/025.yaml
  text: And they said[a], “We will surely give them.” Then they spread out the cloak[c][b], and each man threw there an earring from his spoil.
translation:
  language: sw
  text: Nao wakasema[a], “Hakika tutavitoa.” Kisha wakalitandaza vazi[b], na kila mtu akatupa humo pete[c] kutoka katika nyara zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiebrania, muundo wa maneno hapa unalisisitiza tendo: “Hakika tutatoa” au “Bila shaka tutatoa.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “joho” au “vazi la nje”; lilitandazwa ili kupokea pete.
    reason: cultural_note
  - marker: c
    text: Neno la Kiebrania linaweza kumaanisha pete kwa ujumla, pete ya sikio, au pete ya puani.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן נִתֵּן
  choice: Hakika tutavitoa
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi chenye kikomo unasisitiza tendo. ‘Hakika’ huonyesha msisitizo huo bila kuongeza wazo la furaha au utayari ambalo halijasemwa moja kwa moja. Kiambishi ‘-vi-’ kinarejelea pete zilizoombwa katika mstari uliotangulia.
- source_word: הַשִּׂמְלָה
  choice: vazi
  rationale: Neno hili humaanisha vazi, joho, au vazi la nje. ‘Vazi’ ni la kawaida na linaacha upana wa maana wa Kiebrania bila kulazimisha aina maalumu.
- source_word: וַיִּפְרְשׂוּ
  choice: wakalitandaza
  rationale: פרשׂ hapa ni kutandaza au kufunua kitu ili kiwe wazi; ‘wakalitandaza’ ni Kiswahili cha kawaida kwa vazi lililowekwa tayari kupokea vitu.
- source_word: וַיַּשְׁלִיכוּ שָׁמָּה
  choice: akatupa humo
  rationale: שלך ni ‘kutupa,’ yenye nguvu kuliko ‘kuweka.’ שָׁמָּה ni ‘huko/humo’; ‘humo’ hurejelea kwa kawaida mahali palipotengenezwa na vazi lililotandazwa.
- source_word: אִישׁ
  choice: kila mtu
  rationale: Neno linatumika kwa maana ya mgawanyo, ‘kila mmoja.’ ‘Kila mtu’ ni la kawaida katika Kiswahili na linaendana na kitenzi cha umoja ‘akatupa.’
- source_word: נֶזֶם
  choice: pete
  rationale: נֶזֶם inaweza kuwa pete ya sikio au ya puani. ‘Pete’ huhifadhi kutokuwa bayana kwa neno la Kiebrania; tanbihi inaeleza uwezekano wa mahali ilipovaliwa.
- source_word: שְׁלָלוֹ
  choice: nyara zake
  rationale: שָׁלָל ni mali iliyotekwa vitani. ‘Nyara’ ni neno la kawaida na linalofaa muktadha wa kijeshi; ‘zake’ hudumisha umilikaji wa kila mtu mmoja mmoja.
