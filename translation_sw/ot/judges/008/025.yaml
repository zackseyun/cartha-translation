translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Tafsiri inatumia masimulizi ya kawaida ya kibiblia (‘Nao wakasema,’ ‘Kisha’) bila lugha ya kale isiyo ya lazima. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
