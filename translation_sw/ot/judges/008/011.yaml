base_translation:
  language: en
  yaml_path: translation/ot/judges/008/011.yaml
  text: Then Gideon went up by the route of those who dwell in tents[a], east of Nobah and Jogbehah, and struck the camp while the camp was unsuspecting.
translation:
  language: sw
  text: Kisha Gideoni akapanda kwa njia ya watu waishio mahemani, mashariki ya Noba na Yogbeha, akaishambulia kambi, nayo kambi ilikuwa salama[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila kutarajia shambulio.” Neno la Kiebrania linaweza kumaanisha hali ya usalama au kujiamini; katika muktadha huu huenda linaonyesha kwamba kambi haikuwa tayari kwa shambulio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה kwa kawaida humaanisha kupanda au kwenda juu. Hapa kinaeleza mwendo wa Gideoni bila kulazimisha maana ya kuanza mashambulizi.
- source_word: דֶּרֶךְ הַשְּׁכוּנֵי בָאֳהָלִים
  choice: kwa njia ya watu waliokaa mahemani
  rationale: Tafsiri hii inaonyesha wazi kuwa מדובר kwa watu wenye makao ya mahema, bila kuongeza kwa uhakika zaidi kwamba walikuwa wahamaji.
- source_word: מִקֶּדֶם לְנֹבַח וְיָגְבֳּהָה
  choice: upande wa mashariki wa Noba na Yogbeha
  rationale: Katika muktadha huu wa kijiografia, קדם pamoja na kihusishi huonyesha eneo lililo mashariki ya miji hiyo.
- source_word: וַיַּךְ אֶת־הַמַּחֲנֶה
  choice: akaishambulia kambi
  rationale: נכה ni kitenzi kipana cha kupiga. Katika muktadha wa kijeshi, ‘kuishambulia’ ni Kiswahili cha kawaida na hakidai kwamba kambi ilishindwa kabisa.
- source_word: וְהַמַּחֲנֶה הָיָה בֶטַח
  choice: wakati watu waliokuwa kambini hawakutarajia shambulio
  rationale: בֶּטַח huonyesha hali ya usalama au kujiamini. Katika shambulio hili la kijeshi, maana inayowasilishwa ni kwamba waliokuwa kambini hawakuwa wakitarajia kushambuliwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na heshima. Majina ya mahali yametoholewa kuwa Noba na Yogbeha. Kirai ‘watu waliokaa mahemani’ kinahifadhi maelezo ya Kiebrania bila kutumia neno la kufasiri zaidi ‘wahamaji.’
