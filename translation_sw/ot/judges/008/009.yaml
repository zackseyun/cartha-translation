translation:
  language: sw
  text: Pia akawaambia wanaume wa Penueli[a], “Nitakaporudi kwa amani[b], nitaubomoa mnara huu[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wanaume wa Penueli”; huenda ikimaanisha viongozi au wawakilishi wanaume wa mji huo, si lazima wakazi wote wa mji.'
    reason: cultural_note
  - marker: b
    text: Au “salama”; usemi wa Kiebrania unaweza kumaanisha kurejea salama na baada ya kufanikiwa.
    reason: lexical_alternative
  - marker: c
    text: “Mnara” unaweza kumaanisha mnara wa ulinzi au sehemu ya ngome ya Penueli.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Pia
  rationale: Inaonyesha kwamba Gideoni aliwaambia watu wa Penueli jambo jingine baada ya kusema na kundi lililotangulia.
- source_word: לְאַנְשֵׁי פְנוּאֵל
  choice: watu wa Penueli
  rationale: Neno אַנְשֵׁי kihalisi linaweza kuwa ‘wanaume wa,’ lakini katika muktadha huu linawahusu wanaume waliowakilisha mji au viongozi wake; ‘watu wa Penueli’ ni Kiswahili cha kawaida, huku tanbihi ikihifadhi ufafanuzi wa kijamii.
- source_word: בְּשׁוּבִי
  choice: Nitakaporudi
  rationale: Muundo wa Kiebrania una maana ya wakati; tafsiri hii ni ya asili na sahihi katika Kiswahili.
- source_word: בְשָׁלוֹם
  choice: salama
  rationale: Katika muktadha wa kurejea kutoka vitani, שָׁלוֹם inaweza kumaanisha kurudi bila madhara na baada ya kufanikiwa. ‘Salama’ huwasilisha maana ya kimuktadha bila kudai kwamba ni amani kwa maana finyu.
- source_word: אֶתֹּץ
  choice: nitaubomoa
  rationale: Kitenzi נתץ humaanisha kubomoa au kuangusha jengo; ‘kubomoa’ ni neno la kawaida, lenye nguvu inayofaa.
- source_word: הַמִּגְדָּל הַזֶּה
  choice: mnara huu
  rationale: מִגְדָּל kimsingi ni ‘mnara’; tafsiri halisi imehifadhiwa, huku matumizi yake kama ngome yakielezwa katika tanbihi.
