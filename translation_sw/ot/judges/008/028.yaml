  text: וַ/יִּכָּנַ֣ע מִדְיָ֗ן לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/לֹ֥א יָסְפ֖וּ לָ/שֵׂ֣את רֹאשָׁ֑/ם וַ/תִּשְׁקֹ֥ט הָ/אָ֛רֶץ אַרְבָּעִ֥ים שָׁנָ֖ה בִּ/ימֵ֥י גִדְעֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/028.yaml
  text: So Midian was subdued before the sons of Israel[a], and they did not again lift up their head. And the land had rest forty years in the days of Gideon.
translation:
  language: sw
  text: Basi Midiani walitiishwa mbele ya wana wa Israeli, wala hawakuinua kichwa chao tena.[a] Nayo nchi ikapata pumziko kwa miaka arobaini katika siku za Gideoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hawakupata nguvu tena.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: walitiishwa
  rationale: Kauli ya kutendwa ya kitenzi hiki inaonyesha kuwa Midiani waliwekwa chini ya mamlaka ya Israeli; “walitiishwa” ni ya kawaida na inafaa muktadha wa kijeshi.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Inahifadhi nahau ya Kiebrania ya kutiishwa katika uhusiano na taifa jingine bila kuipanua kuwa “kwa mikono ya.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inafuata kwa karibu muundo wa Kiebrania na bado ni usemi unaoeleweka na wenye hadhi katika Kiswahili.
- source_word: וְלֹא יָסְפוּ
  choice: wala ... tena
  rationale: Katika muundo huu יסף pamoja na kitenzi-jina huonyesha kutorudia tendo; “tena” huwasilisha maana hiyo kwa ufasaha.
- source_word: לָשֵׂאת רֹאשָׁם
  choice: hawakuinua kichwa chao
  rationale: Inahifadhi taswira halisi ya Kiebrania, ambayo hapa yadokeza kurejea kwa nguvu, ujasiri, au uwezo wa kujitokeza tena.
- source_word: וַתִּשְׁקֹט
  choice: ikapata pumziko
  rationale: Katika Waamuzi kitenzi hiki mara nyingi hufupisha kipindi cha amani baada ya vita; “ikapata pumziko” ni ya asili na huhifadhi wazo hilo.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Hurejelea nchi ya Israeli kwa maana ya eneo na jamii yake; “nchi” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אַרְבָּעִים שָׁנָה
  choice: kwa miaka arobaini
  rationale: Ni usemi wa moja kwa moja wa muda; kihusishi “kwa” huifanya sentensi iwe ya kawaida katika Kiswahili.
- source_word: בִּימֵי גִדְעוֹן
  choice: katika siku za Gideoni
  rationale: Inahifadhi usemi wa muda wa Kiebrania bila kuamua kwamba maana yake lazima iwe kipindi chote cha maisha ya Gideoni.
theological_decisions:
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: “Wana wa Israeli” huhifadhi muundo wa jina la kitaifa la Kiebrania; “Waisraeli” ni mbadala wa asili zaidi lakini ungepunguza ulinganifu wa kifasihi.
- issue: Uhifadhi wa nahau לָשֵׂאת רֹאשָׁם
  choice: hawakuinua kichwa chao tena
  alternative: hawakupata nguvu tena
  rationale: Maandishi yanatumia taswira halisi inayoweza kumaanisha kupata tena nguvu, ujasiri, au uwezo wa kujitokeza. Taswira imehifadhiwa katika matini na maana yake imeelezwa katika tanbihi ili kutosuluhisha kimya kimya utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa Kiebrania umehifadhiwa pale unapoeleweka kwa urahisi, huku mtiririko wa Kiswahili ukipewa nafasi katika usemi wa muda na uratibu wa sentensi.
