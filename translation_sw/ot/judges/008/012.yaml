base_translation:
  language: en
  yaml_path: translation/ot/judges/008/012.yaml
  text: Zebah and Zalmunna fled[a], and he pursued them and captured the two kings of Midian, Zebah and Zalmunna; and he threw the whole camp into panic.
translation:
  language: sw
  text: Zeba na Salmuna wakakimbia, naye akawafuatilia na kuwakamata wafalme wawili wa Midiani, Zeba na Salmuna; kisha akaingiza hofu katika kambi yote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaitetemesha kambi yote,” au “akaivuruga kambi yote.” Kitenzi cha Kiebrania kinaweza kumaanisha kusababisha kutetemeka, kuogopa, au kuingiwa na hofu; katika muktadha wa vita kinaweza kudokeza vurugu au taharuki kambini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנוּסוּ
  choice: wakakimbia
  rationale: Kitenzi נוּס katika Qal kina maana ya kukimbia au kutoroka. “Wakakimbia” ni lugha ya kawaida ya simulizi na inaonyesha wazi kuwa waliondoka ili kujiokoa.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Zeba na Salmuna
  rationale: Majina haya ya watu yameandikwa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: וַיִּרְדֹּף אַחֲרֵיהֶם
  choice: naye akawafuatilia
  rationale: רדף pamoja na אחרי humaanisha kufuatilia au kuwinda wanaokimbia. “Akawafuatilia” inafaa kwa muktadha wa kijeshi bila kuongeza maana isiyokuwamo.
- source_word: וַיִּלְכֹּד
  choice: kuwakamata
  rationale: לכד katika muktadha wa vita humaanisha kukamata au kuteka. “Kuwakamata” inaeleza wazi kutiwa mikononi kwa wafalme hao.
- source_word: שְׁנֵי מַלְכֵי מִדְיָן
  choice: wale wafalme wawili wa Midiani
  rationale: Uundaji huu unahifadhi uhusiano wa Kiebrania wa “wafalme wawili wa Midiani”; “wale” hurejelea wafalme waliotajwa katika muktadha.
- source_word: אֶת זֶבַח וְאֶת צַלְמֻנָּע
  choice: Zeba na Salmuna
  rationale: Kurudiwa kwa majina kunahifadhi ufafanuzi na msisitizo wa maandishi ya Kiebrania kuhusu utambulisho wa wafalme hao wawili.
- source_word: וְכָל הַמַּחֲנֶה
  choice: kambi yote
  rationale: מַחֲנֶה hapa ni kambi ya kijeshi, na inaweza pia kuwakilisha watu wa jeshi waliomo kambini. “Kambi yote” huhifadhi taswira ya maandishi asilia.
- source_word: הֶחֱרִיד
  choice: akaitia ... hofu
  rationale: Hiphil ya חרד huonyesha kusababisha kutetemeka, kuogopa, au kuingiwa na hofu. “Akaitia kambi yote hofu” huhifadhi maana ya kisababishi na inafaa kwa vurugu ya kijeshi katika muktadha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye hadhi. Muundo wa vitenzi vya mfululizo umehifadhi mwendo wa haraka wa simulizi, na neno “kambi” limeachwa ili kudumisha taswira ya kijeshi ya Kiebrania.
