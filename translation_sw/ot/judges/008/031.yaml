  text: וּ/פִֽילַגְשׁ/וֹ֙ אֲשֶׁ֣ר בִּ/שְׁכֶ֔ם יָֽלְדָה לּ֥/וֹ גַם הִ֖יא בֵּ֑ן וַ/יָּ֥שֶׂם אֶת שְׁמ֖/וֹ אֲבִימֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/031.yaml
  text: And his concubine who was in Shechem also bore him a son[a], and he named him Abimelek.
translation:
  language: sw
  text: Suria wake aliyekuwa katika Shekemu pia alimzalia mwana, na Gideoni akamwita Abimeleki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: Suria wake
  rationale: Neno פִּילֶגֶשׁ humaanisha mwanamke mwenye hadhi ya mke wa daraja la pili; “suria” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili cha Biblia bila kulifanya kuwa “kimada” au “mke” tu.
- source_word: אֲשֶׁר בִּשְׁכֶם
  choice: aliyekuwa Shekemu
  rationale: Kifungu hiki kinamtambulisha suria kwa mahali alikokuwa. “Aliyekuwa Shekemu” hudumisha maana ya בְּ bila kuongeza dai mahsusi kwamba huko ndiko alikoishi daima.
- source_word: יָלְדָה לּוֹ
  choice: alimzalia
  rationale: Kitenzi יָלַד pamoja na לּוֹ kinaeleza kwamba alimzaa mtoto kwa ajili yake; “alimzalia” ni usemi wa asili na wenye maana hiyo katika Kiswahili.
- source_word: גַּם הִיא
  choice: pia
  rationale: “Pia” huonyesha kwamba mwanamke huyu naye alimzalia mwana, bila kuzidisha msisitizo wa Kiebrania.
- source_word: בֵּן
  choice: mwana
  rationale: “Mwana” ni tafsiri ya kawaida, yenye hadhi, ya בֵּן katika muktadha huu na inaonyesha mtoto wa kiume.
- source_word: וַיָּשֶׂם אֶת־שְׁמוֹ
  choice: naye akampa jina
  rationale: Nahau ya Kiebrania ya ‘kuweka jina lake’ humaanisha kumpa jina. “Akampa jina” ni Kiswahili cha asili; kiwakilishi cha mtendaji hakiongezwi kwa jina kwa kuwa hakitajwi wazi katika mstari huu.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleki
  rationale: “Abimeleki” ni umbo la kawaida la Kiswahili linalokaribia matamshi ya jina la Kiebrania אֲבִימֶלֶךְ.
theological_decisions:
- issue: Utambulisho wa aliyempa mtoto jina
  choice: naye akampa jina
  alternative: Gideoni akampa jina
  rationale: Kitenzi cha Kiebrania ni cha kiume umoja, lakini jina la mtendaji halirudiwi katika mstari huu. Tafsiri haiongezi “Gideoni” moja kwa moja, hivyo inaacha muktadha utoe rejeo huku ikifuata mwendelezo wa sentensi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo ni mfupi na wa asili; “suria” huhifadhi tofauti ya hadhi ya kijamii iliyo katika maandishi ya Kiebrania.
