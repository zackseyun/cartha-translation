  text: Gideon had seventy sons[a], his own offspring, because he had many wives.
translation:
  language: sw
  text: Gideoni alikuwa na wana sabini[a], waliokuwa wametokana naye, kwa sababu alikuwa na wake wengi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, “waliotoka katika viuno vyake,” nahau inayomaanisha watoto wake wa kuzaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגִדְעוֹן הָיוּ
  choice: Gideoni alikuwa na
  rationale: Muundo wa Kiebrania wenye היה pamoja na ל unaonyesha umilikaji, kwa maana ya ‘Gideoni alikuwa na.’ Kiunganishi וּ kinaunganisha sentensi na muktadha, lakini si lazima kitafsiriwe kwa neno tofauti hapa.
- source_word: שִׁבְעִים בָּנִים
  choice: wana sabini
  rationale: בָּנִים humaanisha wana wa kiume, si watoto kwa ujumla.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: wazao wake mwenyewe
  rationale: Hii ni nahau inayomaanisha watoto wake wa kuzaa. Tafsiri hii inatoa maana yake kwa Kiswahili cha sasa, huku taswira halisi ya Kiebrania ikihifadhiwa katika tanbihi.
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי hapa inaleta sababu ya Gideoni kuwa na wana wengi.
- source_word: נָשִׁים רַבּוֹת הָיוּ לוֹ
  choice: alikuwa na wake wengi
  rationale: Katika muktadha huu נָשִׁים ni wake, na היה pamoja na ל huonyesha umilikaji.
theological_decisions:
- issue: Maelezo ya familia yenye wake wengi
  choice: Kutafsiri kwa maelezo tu kama ‘alikuwa na wake wengi,’ bila kuongeza hukumu ya kimaadili.
  alternative: Kutumia ‘wanawake wengi’ au kuongeza kwamba hali hiyo ilikubaliwa au ilikataliwa.
  rationale: Aya inaeleza hali ya familia ya Gideoni bila kuitolea hukumu wazi. Tafsiri haipaswi kuficha maana ya ndoa wala kuingiza tathmini ambayo haimo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wazao wake mwenyewe’ linaeleza nahau ya Kiebrania kwa lugha inayoeleweka, huku tanbihi ikihifadhi picha yake halisi.
