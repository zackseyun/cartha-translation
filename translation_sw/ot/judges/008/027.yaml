base_translation:
  language: en
  yaml_path: translation/ot/judges/008/027.yaml
  text: Gideon made it into an ephod and set it up in his city[a], in Ophrah. And all Israel prostituted themselves after it there[b], and it became a snare to Gideon and to his house.
translation:
  language: sw
  text: Gideoni akaitengeneza iwe efodi[a], na kuiweka katika mji wake, huko Ofra. Waisraeli wote wakafanya ukahaba kwa kuifuata huko[b], nayo ikawa mtego kwa Gideoni na nyumba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efodi ilikuwa kitu cha ibada kilichohusishwa na matumizi ya kikuhani; hapa andiko halibainishi kikamilifu umbo au kazi yake.
    reason: cultural_note
  - marker: b
    text: Kiebrania kinatumia hapa taswira ya ukahaba kueleza Israeli kuacha uaminifu wao katika ibada na kuifuata efodi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֵפוֹד
  choice: kuwa efodi
  rationale: 'Muundo wa ל pamoja na עשה unaonyesha matokeo: Gideoni alikitengeneza kile kitu kikawa efodi. Neno la kiufundi “efodi” limehifadhiwa kwa sababu andiko halibainishi kikamilifu umbo au kazi yake hapa.'
- source_word: וַיַּצֵּג
  choice: kuiweka
  rationale: Kitenzi kina maana ya kusimamisha au kuweka kitu mahali. “Kuiweka” ni Kiswahili cha kawaida kisichoongeza dai kwamba ilikuwa sanamu au pambo tu.
- source_word: בְעִירוֹ
  choice: katika mji wake
  rationale: עִיר kwa kawaida ni “mji”; tafsiri hii inahifadhi pia kiambishi cha umilikaji.
- source_word: בְּעָפְרָה
  choice: huko Ofra
  rationale: Jina la mahali limetoholewa kwa namna ya kawaida ya Kiswahili, na “huko” linaunganisha Ofra na mji uliotajwa.
- source_word: וַיִּזְנוּ ... אַחֲרָיו
  choice: wakafanya ukahaba kwa kuifuata
  rationale: זנה inatumia taswira wazi ya ukahaba kueleza kutokuwa waaminifu katika ibada. “Kwa kuifuata” linawakilisha אַחֲרָיו na kiwakilishi chake kinarejelea efodi.
- source_word: שָׁם
  choice: huko
  rationale: Neno limehifadhiwa ili kuonyesha kwamba tendo hilo lilifanyika mahali pale, yaani Ofra.
- source_word: לְמוֹקֵשׁ
  choice: mtego
  rationale: מוֹקֵשׁ ni mtego halisi au, kama hapa, kitu kinachomwingiza mtu katika dhambi au maangamizi.
- source_word: וּלְבֵיתוֹ
  choice: na nyumba yake
  rationale: “Nyumba” huhifadhi upana wa בַּיִת, ambayo inaweza kumaanisha watu wa nyumbani, ukoo, au nasaba ya Gideoni.
theological_decisions:
- issue: Taswira inayotumiwa kueleza ibada ya sanamu ya Israeli
  choice: wakafanya ukahaba kwa kuifuata
  alternative: wakakosa uaminifu kwa kuifuata
  rationale: Tafsiri iliyochaguliwa inahifadhi taswira kali ya kingono ya זנה na uzito wa kutokuwa waaminifu katika ibada, bila kuipunguza kuwa kutotii kwa jumla.
- issue: Efodi ya Gideoni ilikuwa kitu cha aina gani
  choice: efodi
  alternative: vazi la kikuhani; sanamu; kitu kitakatifu
  rationale: Andiko linataja efodi lakini halisemi wazi kama hapa ilikuwa vazi, sanamu, au chombo cha kutafutia uamuzi wa Mungu. Neno lenyewe limehifadhiwa ili kutoondoa utata huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata kwa karibu mfuatano wa Kiebrania, huku viunganishi na marejeo ya mahali yakitolewa kwa namna ya kawaida ya Kiswahili. “Nyumba yake” imehifadhiwa badala ya kufafanuliwa kuwa familia au nasaba pekee.
