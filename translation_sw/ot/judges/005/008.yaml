base_translation:
  language: en
  yaml_path: translation/ot/judges/005/008.yaml
  text: They chose new gods[a]; then war was at the gates[b]. Was a shield or spear to be seen among forty thousand in Israel?
translation:
  language: sw
  text: Walichagua miungu mipya[a]; ndipo vita vikawa malangoni[b]. Je, ngao au mkuki ulionekana miongoni mwa watu elfu arobaini katika Israeli?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata umbo la Kiebrania kwa karibu zaidi, “Alichagua miungu mipya.” Kitenzi cha Kiebrania kiko katika umoja, lakini kwa kawaida maana yake inaeleweka kuwahusu watu wa Israeli kwa pamoja.
    reason: alternative_reading
  - marker: b
    text: Kiebrania cha kifungu hiki ni kigumu; pia yaweza kutafsiriwa, “ndipo mapigano yakawa malangoni,” au kwa namna inayofanana.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְחַר
  choice: Walichagua
  rationale: Kitenzi cha Kiebrania kiko katika umoja wa nafsi ya tatu, lakini katika muktadha kinaeleweka kuwa na kiima kisichotajwa kinachowakilisha watu wa Israeli kwa pamoja. Wingi ni wa asili katika Kiswahili na unaweka wazi shtaka la uasi bila kumfanya Mungu kuwa kiima.
- source_word: אֱלֹהִים חֲדָשִׁים
  choice: miungu mipya
  rationale: Katika muktadha huu usemi unarejelea miungu mingine ya kigeni, si Mungu wa Israeli. Huu ndio usemi wa kawaida na wenye nguvu inayofaa katika Kiswahili.
- source_word: אָז
  choice: ndipo
  rationale: Neno hili linaonyesha mfuatano wa wakati na linaunganisha uchaguzi wa miungu mipya na janga lililofuata.
- source_word: לָחֶם שְׁעָרִים
  choice: vita vikafika malangoni
  rationale: Kiebrania ni kifupi na kigumu. Kuchukua לָחֶם kwa maana ya vita au mapigano kunatoa picha ya vita kufika kwenye malango ya miji. Kiswahili hiki ni wazi huku tanbihi ikihifadhi uwezekano wa tafsiri nyingine.
- source_word: מָגֵן
  choice: ngao
  rationale: Ni neno la kawaida la kijeshi, na “ngao” ndilo neno la moja kwa moja katika Kiswahili.
- source_word: אִם יֵרָאֶה
  choice: Je, ... ulionekana
  rationale: Muundo huu una nguvu ya swali la balagha linalosisitiza kutokuwapo kwa silaha. Kiswahili cha swali kinaendeleza maana hiyo kwa kawaida.
- source_word: וָרֹמַח
  choice: au mkuki
  rationale: “Mkuki” ni neno la kisasa, wazi, na la kawaida kwa silaha inayotajwa.
- source_word: בְּאַרְבָּעִים אֶלֶף
  choice: miongoni mwa watu elfu arobaini
  rationale: Kihusishi kinaonyesha kundi ambalo ndani yake silaha hazikuonekana. Kuongeza “watu” hufanya idadi isikike kwa kawaida katika Kiswahili bila kubadili maana.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Hii inatoa maana ya mahali na jamii ya taifa kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kiima cha kitenzi cha kwanza
  choice: 'Kiima kinaeleweka kwa pamoja kuwa watu wa Israeli: “Walichagua miungu mipya.”'
  alternative: “Alichagua miungu mipya” au kumchukulia Mungu kuwa kiima.
  rationale: Ingawa kitenzi cha Kiebrania ni cha umoja, muktadha unahusu uasi wa Israeli na dhiki iliyofuata. Kumfanya Mungu kuwa kiima kungezalisha kauli isiyopatana na muktadha kwamba Mungu alichagua “miungu mipya.” Tanbihi inahifadhi umbo halisi la kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi inayofaa Wimbo wa Debora. Sentensi ni wazi kwa msomaji wa kawaida, huku alama za tanbihi [a] na [b] zikihifadhi utata halisi wa Kiebrania.
