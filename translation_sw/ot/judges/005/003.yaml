base_translation:
  language: en
  yaml_path: translation/ot/judges/005/003.yaml
  text: Hear[a], O kings; give ear, O rulers. I, to Yahweh[b], I will sing; I will make music to Yahweh, the God of Israel.
translation:
  language: sw
  text: Sikieni[a], enyi wafalme; tegeeni masikio, enyi watawala. Mimi, kwa Yahwe, mimi nitaimba; nitampigia Yahwe muziki[b], Mungu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinatumia amri mbili zenye maana zinazokaribiana—“sikieni” na “tegeeni masikio”—ili kutoa mkazo wa kishairi.
    reason: lexical_alternative
  - marker: b
    text: 'Au “nitamwimbia Yahwe sifa.” Kiebrania kinatumia vitenzi viwili vinavyohusiana lakini tofauti: “kuimba” na “kupiga muziki.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Sikieni
  rationale: Amri ya wingi ya שׁמע; “sikieni” ni mwito wa kishairi unaoeleweka na unaolingana na kuwaambia wafalme moja kwa moja.
- source_word: מְלָכִים
  choice: wafalme
  rationale: Nomino ya wingi inayowataja watawala wa kifalme moja kwa moja.
- source_word: הַאֲזִינוּ
  choice: tegeni masikio
  rationale: Kauli hii ni karibu na שׁמע lakini ina picha ya kuelekeza sikio kwa makini; tafsiri hii inadumisha usambamba wa kishairi bila kurudia tu “sikilizeni”.
- source_word: רֹזְנִים
  choice: watawala
  rationale: Neno hili humaanisha wenye mamlaka au wakuu; “watawala” ni la sasa, wazi, na halibani maana kuwa wana wa kifalme pekee.
- source_word: אָנֹכִי ... אָנֹכִי
  choice: Mimi ... mimi
  rationale: Kurudiwa kwa kiwakilishi hutoa mkazo wa kujitangaza; marudio yamehifadhiwa ingawa ni ya kishairi zaidi kuliko Kiswahili cha kawaida.
- source_word: לַיהוָה
  choice: kwa Yahwe / Yahwe kama shamirisho la kitenzi
  rationale: ל inaweza kuonyesha uelekeo au wakfu wa wimbo. “Kwa Yahwe” huhifadhi uwezekano huo katika kauli ya kwanza, na “nitampigia muziki Yahwe” ni Kiswahili cha kawaida kwa tendo linaloelekezwa kwake.
- source_word: יהוה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo kama “Bwana.”
- source_word: אָשִׁירָה
  choice: nitaimba
  rationale: Umbo hili lina hisia ya nia au azimio; “nitaimba” linaonyesha azimio hilo kwa lugha ya kawaida ya kishairi.
- source_word: אֲזַמֵּר
  choice: nitampigia muziki
  rationale: זמר huhusu kufanya muziki au kuimba sifa. “Nitampigia muziki” hutofautisha kitenzi hiki na “nitaimba” bila kudai kwamba ala fulani ilitumika.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni kirai cha uhusiano kinachomtambulisha Yahwe kuwa Mungu wa Israeli; tafsiri ni ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja. “Yahwe” huhifadhi jina maalumu la agano badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa לַיהוָה na kuimba
  choice: kwa Yahwe
  alternative: nitamwimbia Yahwe
  rationale: Kihusishi ל kinaweza kuonyesha kwamba wimbo unaelekezwa kwa Yahwe au umewekwa wakfu kwake. “Kwa Yahwe” huhifadhi mvutano huo badala ya kuamua kwa lazima kuwa ni shamirisho tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika sajili ya kishairi yenye heshima lakini inayoeleweka. “Tegeni masikio” huhifadhi taswira na usambamba wa shairi. Muundo “Mimi, kwa Yahwe, mimi nitaimba” ni wa kimakusudi na wenye alama ya kishairi ili kuhifadhi marudio ya אָנֹכִי na uhusiano usioamuliwa kabisa wa לַיהוָה.
