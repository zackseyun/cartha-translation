base_translation:
  language: en
  yaml_path: translation/ot/judges/005/013.yaml
  text: Then the remnant came down against the nobles[b][a]; the people of Yahweh came down for me against the mighty.
translation:
  language: sw
  text: Ndipo waliosalia wakashuka dhidi ya wakuu[a]; watu wa Yahweh wakashuka kwa ajili yangu[b] dhidi ya mashujaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ndipo aliyenusurika akashuka kwa wakuu.” Kiebrania cha mstari huu wa kishairi ni kigumu, na vihusishi vinaweza pia kueleweka bila maana ya uhasama, yaani “kwa,” “kuelekea,” au “pamoja na.”
    reason: alternative_reading
  - marker: b
    text: Kiebrania, “kwa ajili yangu”; huenda Debora anajirejelea mwenyewe katika shairi.
    reason: cultural_note
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Kielezi hiki kinaanzisha hatua inayofuata katika wimbo; “Ndipo” ni kifupi, cha asili, na kinafaa katika masimulizi ya kishairi.
- source_word: יְרַד / יְרַד
  choice: wakashuka / wakashuka
  rationale: Kitenzi ירד humaanisha kushuka. Kurudia “wakashuka” kunahifadhi urudiaji na mwendo wa mstari wa Kiebrania.
- source_word: שָׂרִיד
  choice: waliosalia
  rationale: Neno linaweza kumaanisha aliyenusurika au mabaki. “Waliosalia” linasomeka kwa kawaida kama kundi la watu huku tanbihi ikihifadhi uwezekano wa umoja.
- source_word: לְאַדִּירִים
  choice: dhidi ya wakuu
  rationale: אַדִּירִים ni watu wenye nguvu, hadhi, au ukuu. Katika muktadha wa vita, ל־ limeeleweka kwa maana ya uhasama; “wakuu” pia linatofautisha neno hili na גִּבּוֹרִים.
- source_word: עָם יְהוָה
  choice: watu wa Yahweh
  rationale: Kauli hii inawatambulisha Israeli kuwa watu wanaomilikiwa na Yahweh; muundo huu ni wazi na wa kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa na cheo.
- source_word: לִי
  choice: kwa ajili yangu
  rationale: Hili ndilo tendo la moja kwa moja la kiwakilishi cha nafsi ya kwanza; huenda ni rejeo la kishairi la Debora mwenyewe.
- source_word: בַּגִּבּוֹרִים
  choice: dhidi ya mashujaa
  rationale: גִּבּוֹרִים humaanisha watu hodari au mashujaa. Muktadha wa vita unaunga mkono maana ya uhasama ya ב־, bila kuficha kwamba sarufi ya kishairi inaweza kueleweka vingine.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya vihusishi katika vipande viwili vya mstari
  choice: 'Maana ya uhasama: “dhidi ya wakuu” na “dhidi ya mashujaa”'
  alternative: 'Maana isiyo ya uhasama: “kwa/kuelekea wakuu” na “pamoja na/miongoni mwa mashujaa”'
  rationale: Muktadha wa wimbo wa ushindi na ulinganifu wa vipande viwili unaunga mkono maana ya uhasama, lakini ugumu halisi wa Kiebrania umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Urudiaji wa “wakashuka” umehifadhiwa kwa sababu ni sehemu ya muundo wa Kiebrania. Tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
