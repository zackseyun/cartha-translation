  text: יְהוָ֗ה בְּ/צֵאתְ/ךָ֤ מִ/שֵּׂעִיר֙ בְּ/צַעְדְּ/ךָ֙ מִ/שְּׂדֵ֣ה אֱד֔וֹם אֶ֣רֶץ רָעָ֔שָׁה גַּם שָׁמַ֖יִם נָטָ֑פוּ גַּם עָבִ֖ים נָ֥טְפוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/004.yaml
  text: O Yahweh[a], when you went out from Seir, when you marched from the field of Edom, the earth trembled; the heavens also dripped[b], the clouds also dripped water.
translation:
  language: sw
  text: 'Ee Yahwe, ulipotoka Seiri,

    ulipopiga hatua kutoka uwanda wa Edomu[a],

    dunia ilitetemeka[b];

    mbingu nazo zilidondosha,

    mawingu nayo yalidondosha maji.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka nchi ya Edomu.” Kiebrania kinasema kihalisi, “kutoka shamba la Edomu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nchi ilitetemeka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetafsiriwa kwa namna ya matamshi ya Kiswahili badala ya kubadilishwa kuwa cheo; “Ee” linaonyesha kwamba wimbo unamwita Mungu moja kwa moja.
- source_word: בְּצֵאתְךָ
  choice: ulipotoka
  rationale: Muundo wa kihusishi pamoja na kitenzi-jina una maana ya wakati hapa; tafsiri hii ni ya kawaida na inadumisha nafsi ya pili.
- source_word: מִשֵּׂעִיר
  choice: Seiri
  rationale: Ni jina la mahali, nalo limetoholewa kwa tahajia ya Kiswahili huku kiambishi מִן kikionyeshwa na “-toka.”
- source_word: בְּצַעְדְּךָ
  choice: ulipopiga hatua
  rationale: צעד huonyesha kupiga hatua au kwenda kwa mwendo wa makusudi; usemi huu unadumisha taswira ya mwendo wa Mungu bila kuongeza wazo la kijeshi lisilo lazima.
- source_word: מִשְּׂדֵה אֱדוֹם
  choice: kutoka uwanda wa Edomu
  rationale: שׂדה inaweza kuwa shamba, eneo la wazi, au uwanda. “Uwanda” ni wa asili katika Kiswahili na unadumisha taswira ya eneo la wazi la Edomu.
- source_word: אֶרֶץ רָעָשָׁה
  choice: dunia ilitetemeka
  rationale: Kwa kuwa mstari unataja pia mbingu na mawingu, אֶרֶץ imeeleweka kwa maana pana ya “dunia”; רָעשׁ ni kutikisika au kutetemeka.
- source_word: גַּם שָׁמַיִם נָטָפוּ
  choice: hata mbingu zilidondosha matone
  rationale: נטף huonyesha kudondoka kwa matone. “Zilidondosha matone” ni Kiswahili kinachoeleweka na kinahifadhi taswira hiyo bila kuifanya kuwa mvua kubwa.
- source_word: גַּם עָבִים נָטְפוּ מָיִם
  choice: hata mawingu yalidondosha maji
  rationale: Tafsiri inadumisha kurudiwa kwa נטף na kutaja wazi מָיִם, “maji,” kama ilivyo katika Kiebrania.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano YHWH. “Yahwe” linawasilisha jina hilo kwa matamshi yanayofaa Kiswahili bila kulibadilisha kuwa cheo.
- issue: Upeo wa אֶרֶץ katika taswira ya kujidhihirisha kwa Mungu
  choice: dunia
  alternative: nchi
  rationale: Ulinganifu na mbingu na mawingu unaelekeza kwenye taswira pana ya ulimwengu, ingawa neno lenyewe linaweza pia kumaanisha nchi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki chenye mtindo wa kishairi na wenye heshima. Mistari imepangwa ili kudumisha ulinganifu wa wimbo, marudio ya “hata,” na taswira ya kujidhihirisha kwa Mungu. Alama za tanbihi zimewekwa kwenye maneno yanayohusika, kwa kuwa nafasi zake katika safu ya Kiingereza hazikulingana na yaliyomo katika tanbihi.
