base_translation:
  language: en
  yaml_path: translation/ot/judges/005/016.yaml
  text: Why did you sit among the sheepfolds[a], to hear the whistling for the flocks? For the divisions of Reuben there were great searchings of heart.
translation:
  language: sw
  text: Kwa nini ulikaa kati ya mazizi ya kondoo, ukisikiliza miluzi ya kuwaita makundi? Kwa makundi ya Reubeni[a] kulikuwa na tafakari kubwa za moyoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kando ya vijito vya Reubeni.” Neno la Kiebrania linaweza kumaanisha “makundi/sehemu” au “vijito/mikondo ya maji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Hutoa swali la moja kwa moja kuhusu sababu ya Reubeni kutoshiriki.
- source_word: יָשַׁבְתָּ
  choice: ulikaa
  rationale: Hudumisha picha halisi na nguvu ya karipio la kishairi kuliko tafsiri ya kufafanua zaidi kama ‘ulibaki’.
- source_word: בֵּין הַמִּשְׁפְּתַיִם
  choice: kati ya mazizi ya kondoo
  rationale: Katika muktadha huu wa kichungaji, neno linaeleweka kwa kawaida kuwa mazizi au sehemu za kuwafungia kondoo; ‘kati ya’ pia huakisi בֵּין.
- source_word: לִשְׁמֹעַ
  choice: ukisikiliza
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la kukaa kwa kusudi la kusikiliza sauti zinazofuata.
- source_word: שְׁרִקוֹת עֲדָרִים
  choice: miluzi ya kuita makundi
  rationale: שְׁרִקוֹת ni sauti za miluzi, na muktadha unaelekeza kwenye miito ya wachungaji kwa makundi ya mifugo; ‘ya kuita’ huonyesha uhusiano huo bila kuifanya miluzi kuwa ya wanyama wenyewe.
- source_word: לִפְלַגּוֹת רְאוּבֵן
  choice: Kwa migawanyiko ya Reubeni
  rationale: ‘Migawanyiko’ huhifadhi maana inayowezekana ya sehemu au makundi na inafaa na kusita kwa kabila; kihusishi ‘kwa’ huakisi לִ־ bila kuamua mno uhusiano wake wa kimantiki.
- source_word: גְּדוֹלִים חִקְרֵי לֵב
  choice: kulikuwa na tafakari nyingi za moyoni
  rationale: Huwasilisha uchunguzi au mjadala wa ndani kwa Kiswahili cha asili na cha kishairi; ‘nyingi’ hapa huonyesha ukubwa au wingi unaosisitizwa na גְּדוֹלִים.
