translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Umoja wa nafsi ya pili katika ‘ulikaa’ umehifadhiwa kwa kuwa wimbo unamwambia Reubeni kama kundi moja. Alama ya tanbihi imewekwa kwenye neno lenye utata halisi, ‘migawanyiko,’ badala ya ‘mazizi.’
