  text: לִבִּ/י֙ לְ/חוֹקְקֵ֣י יִשְׂרָאֵ֔ל הַ/מִּֽתְנַדְּבִ֖ים בָּ/עָ֑ם בָּרֲכ֖וּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/009.yaml
  text: My heart is with the leaders of Israel[a], who volunteered among the people. Bless Yahweh!
translation:
  language: sw
  text: Moyo wangu uko pamoja na viongozi wa Israeli[a], waliojitolea kwa hiari miongoni mwa watu. Mbarikini Yahweh!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Moyo wangu uko pamoja na watoa sheria wa Israeli, wale waliojitolea kwa hiari miongoni mwa watu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי
  choice: Moyo wangu
  rationale: Neno halisi lenye kiambishi cha nafsi ya kwanza umoja; linahifadhi nahau ya Kiebrania inayoonyesha mshikamano na kuthamini.
- source_word: לְחוֹקְקֵי
  choice: uko pamoja na viongozi
  rationale: Muundo unaotokana na חקק unaweza kumaanisha wanaoamuru, kutawala, au kutoa maamuzi. Katika wimbo huu, “viongozi” ni Kiswahili cha kawaida na hakifungi maana kwenye utungaji wa sheria pekee.
- source_word: יִשְׂרָאֵל
  choice: wa Israeli
  rationale: 'Uhusiano wa umilikaji/utambulisho: viongozi hao ni wa Israeli.'
- source_word: הַמִּתְנַדְּבִים
  choice: waliojitolea kwa hiari
  rationale: Kauli ya Hitpaeli ya נדב inaonyesha kujitoa kwa hiari. Tafsiri hii inaweka wazi hiari iliyomo katika neno la Kiebrania.
- source_word: בָּעָם
  choice: miongoni mwa watu
  rationale: עם kwa kawaida ni “watu”; hapa haipaswi kufinywa bila lazima kuwa “wanajeshi” au “vikosi.”
- source_word: בָּרֲכוּ
  choice: Mbarikini
  rationale: Amri ya wingi kutoka ברך; “Mbarikini” huhifadhi wito wa moja kwa moja kwa wasikilizaji wengi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetolewa kwa unukuzi “Yahweh,” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Maandishi yanatumia jina la pekee יהוה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Utambulisho wa חוֹקְקֵי
  choice: viongozi
  alternative: watoa sheria
  rationale: Mzizi unaweza kuhusishwa na kutoa amri au sheria, lakini katika muktadha wa Wimbo wa Debora neno linaweza kuwataja kwa upana wale wanaobeba wajibu wa uongozi. Tanbihi huhifadhi maana mbadala bila kuifanya tafsiri kuu kuwa ya kisheria kupita kiasi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau “Moyo wangu uko pamoja na” inahifadhi picha ya Kiebrania huku ikieleweka kwa urahisi; “waliojitolea kwa hiari” huwasilisha wazi hali ya kujitoa wenyewe.
