base_translation:
  language: en
  yaml_path: translation/ot/judges/005/031.yaml
  text: So may all your enemies perish[a], O Yahweh, but may those who love him be like the rising of the sun in its strength[b]. And the land had rest forty years.
translation:
  language: sw
  text: Basi adui zako wote waangamie, Ee Yahweh, lakini wanaompenda wawe kama jua linavyochomoza kwa nguvu zake.[a] Nchi ikapata pumziko kwa miaka arobaini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa maana halisi zaidi, “lakini wanaompenda [ni] kama kuchomoza kwa jua katika nguvu zake.” Kitenzi “wawe” hakijaandikwa wazi katika kishazi hiki.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “nchi ikatulia.” Katika kitabu cha Waamuzi, usemi huu kwa kawaida humaanisha kipindi cha amani au pumziko baada ya vita.
    reason: cross_reference
lexical_decisions:
- source_word: כֵּן יֹאבְדוּ
  choice: Basi ... na waangamie
  rationale: “Basi” linaunganisha hitimisho hili na wimbo uliotangulia, huku “na waangamie” likitoa kwa Kiswahili cha kawaida nguvu ya hali ya kutakia iliyo katika kitenzi cha Kiebrania.
- source_word: כָל אוֹיְבֶיךָ
  choice: adui zako wote
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kishazi cha Kiebrania, ikihifadhi nafsi ya pili katika “zako.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וְאֹהֲבָיו
  choice: lakini wanaompenda
  rationale: Kiunganishi kinaonyesha utofautishaji na maadui, na kiambishi cha nafsi ya tatu kimedumishwa katika “wanaompenda,” bila kulainisha badiliko la Kiebrania kutoka kumsemesha Mungu moja kwa moja hadi kumrejelea kwa nafsi ya tatu.
- source_word: כְּצֵאת הַשֶּׁמֶשׁ
  choice: kama jua lichomozavyo
  rationale: Kitenzi יצא pamoja na “jua” kinaonyesha kujitokeza au kuchomoza kwake; usemi huu ni wa asili na wenye hadhi katika Kiswahili.
- source_word: בִּגְבֻרָתוֹ
  choice: kwa nguvu zake
  rationale: Hurejelea nguvu au uangavu kamili wa jua, huku ikihifadhi taswira ya maandishi ya Kiebrania.
- source_word: וַתִּשְׁקֹט הָאָרֶץ
  choice: Nchi ikapata pumziko
  rationale: Katika Waamuzi, usemi huu kwa kawaida huonyesha kipindi cha amani na kutokuwapo kwa vita baada ya mapambano, si ukimya wa sauti tu.
- source_word: אַרְבָּעִים שָׁנָה
  choice: kwa miaka arobaini
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha muda uliotajwa.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Mrejelewa wa kiambishi katika וְאֹהֲבָיו
  choice: “wanaompenda,” yaani wanaompenda Yahwe
  alternative: “wanaokupenda,” kwa kulainisha badiliko la nafsi
  rationale: Kiambishi cha Kiebrania ni cha nafsi ya tatu umoja na kwa kawaida humrejelea Yahwe aliyetajwa mara moja kabla yake. Tafsiri inadumisha badiliko hilo la nafsi.
- issue: Nguvu ya kishazi kuhusu wanaompenda
  choice: “na wawe,” kama mwendelezo wa ombi au takio
  alternative: “ni,” kama kauli ya moja kwa moja
  rationale: Kiebrania hakina kitenzi kilichoandikwa katika kishazi hiki. Muktadha wa hitimisho la wimbo na ulinganifu na “na waangamie” unaunga mkono takio, lakini tanbihi inadumisha umbo halisi lisilo na kitenzi na hivyo kuacha uwezekano wa kauli ya moja kwa moja wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. “Ee” hudumisha mwito wa moja kwa moja, na badiliko kutoka “zako” hadi “wanaompenda” limehifadhiwa kwa uaminifu kwa maandishi ya Kiebrania. Alama za tanbihi zimewekwa baada ya vifungu vinavyofafanuliwa.
