base_translation:
  language: en
  yaml_path: translation/ot/judges/005/017.yaml
  text: Gilead stayed beyond the Jordan[b][a]; and Dan—why did he sojourn by the ships? Asher sat by the seashore and stayed by his harbors.
translation:
  language: sw
  text: Gileadi alibaki ng’ambo ya Yordani; naye Dani—kwa nini alikaa kando ya meli?[a] Asheri alikaa kando ya ufuo wa bahari, akabaki kando ya ghuba zake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa nini aliishi kwa muda kando ya meli?” Kitenzi cha Kiebrania kinaweza kumaanisha kukaa au kuishi kwa muda kama mgeni, na uhusiano wake na “meli” haujaelezwa waziwazi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwenye bandari zake” au “kwenye maingilio yake ya pwani.” Neno la Kiebrania humaanisha mianya au sehemu zilizo wazi na katika muktadha huu huenda linataja bandari, ghuba, au maingilio ya pwani.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלְעָד
  choice: Gileadi
  rationale: Jina la eneo au jamii limehifadhiwa moja kwa moja; katika muktadha linaweza kuwakilisha watu wa Gileadi bila kuongeza ufafanuzi huo ndani ya mstari.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ng’ambo ya Yordani
  rationale: Ni usemi wa kawaida wa kijiografia unaoonyesha upande mwingine wa Mto Yordani.
- source_word: שָׁכֵן
  choice: alibaki
  rationale: Kitenzi kina maana ya kukaa au kuendelea kuwapo mahali; “alibaki” pia hudokeza kutoshiriki vitani bila kuzidisha tafsiri.
- source_word: וְדָן
  choice: naye Dani
  rationale: Jina la kabila limetoholewa kwa namna iliyozoeleka katika Kiswahili, na “naye” linaendeleza ulinganisho wa kishairi.
- source_word: לָמָּה
  choice: kwa nini
  rationale: Swali la moja kwa moja limehifadhiwa kama karipio la balagha.
- source_word: יָגוּר
  choice: alikaa
  rationale: Kitenzi kinaweza kumaanisha kukaa au kuishi kwa muda kama mgeni. “Alikaa” ni cha asili katika Kiswahili na hakifungi maana kwenye ukaaji wa kudumu.
- source_word: אֳנִיּוֹת
  choice: meli
  rationale: Nomino ya wingi ya vyombo vya baharini imetafsiriwa kwa neno la kawaida na lenye heshima.
- source_word: אָשֵׁר
  choice: Asheri
  rationale: Jina la kabila limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: יָשַׁב
  choice: alikaa
  rationale: Huhifadhi picha ya kuketi au kukaa bila kushiriki, inayofaa sauti ya wimbo huu.
- source_word: לְחוֹף יַמִּים
  choice: ufukweni mwa bahari
  rationale: Hutoa kwa Kiswahili cha kawaida mazingira ya pwani; wingi wa Kiebrania “bahari” umetolewa kwa usemi wa asili bila kubadili picha.
- source_word: מִפְרָצָיו
  choice: bandari zake
  rationale: Katika muktadha wa pwani, mianya au sehemu zilizoingia baharini huenda ni ghuba, maingilio ya pwani, au bandari; “bandari” inafaa muktadha huku mbadala ukielezwa katika tanbihi.
- source_word: יִשְׁכּוֹן
  choice: akabaki
  rationale: Kitenzi cha kukaa au kuishi kimetafsiriwa kwa namna inayoendeleza wazo la kutoshiriki na pia kutofautisha kidogo na יָשַׁב.
