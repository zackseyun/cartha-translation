  yaml_path: translation/ot/judges/005/027.yaml
  text: Between her feet he sank[a], he fell, he lay; between her feet he sank, he fell; where he sank[c][b], there he fell—destroyed.
translation:
  language: sw
  text: 'Kati ya miguu yake[a] aliinama, akaanguka, akalala;

    kati ya miguu yake aliinama, akaanguka[b];

    mahali alipoinama, hapo akaanguka—ameangamizwa.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miguuni pake.” Tafsiri ya moja kwa moja zaidi ni “kati ya miguu yake.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinarudia mfuatano wa vitenzi vifupi—“aliinama, akaanguka, akalala ... aliinama, akaanguka”—ili kuleta mdundo na msisitizo wa kishairi.
    reason: cultural_note
  - marker: c
    text: Au, “ameharibiwa kabisa” au “ameuawa kikatili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין רַגְלֶיהָ
  choice: katikati ya miguu yake
  rationale: Huhifadhi taswira halisi ya mahali na urudiaji wa Kiebrania. Kiswahili cha kawaida kingeweza kusema “miguuni pake,” lakini kingepunguza maana ya בֵּין, “katikati ya.”
- source_word: כָּרַע
  choice: aliinama
  rationale: Kitenzi hiki huonyesha kupinda magoti, kuinama, au kushuka chini. “Aliinama” ni kifupi, cha kishairi, na hakilazimishi wazo la kusujudu kwa hiari.
- source_word: נָפַל
  choice: akaanguka
  rationale: Ni tafsiri ya moja kwa moja; imerudiwa bila kubadilishwa ili kuhifadhi mdundo na msisitizo wa shairi.
- source_word: שָׁכָב
  choice: akalala
  rationale: Huhifadhi mfuatano mfupi wa vitenzi na taswira kali ya mtu aliyeanguka na kubaki chini.
- source_word: בַּאֲשֶׁר
  choice: mahali alipo-
  rationale: Hutenda kama kielezi cha mahali, yaani “mahali ambapo”; muundo huu ni wa asili katika Kiswahili.
- source_word: שָׁם
  choice: hapo
  rationale: 'Huhifadhi msisitizo wa mahali katika kishazi cha mwisho: “hapo akaanguka.”'
- source_word: שָׁדוּד
  choice: ameangamizwa
  rationale: Hutoa maana ya mtu aliyebomolewa au kuharibiwa kabisa. Katika muktadha huu inaashiria kifo cha vurugu bila kubadili neno moja la Kiebrania kuwa maelezo marefu.
