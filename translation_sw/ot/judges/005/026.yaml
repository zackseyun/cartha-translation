base_translation:
  language: en
  yaml_path: translation/ot/judges/005/026.yaml
  text: She reached out her hand for the tent peg[a], her right hand for the workmen’s hammer; then she struck Sisera, she shattered his head[c][b], she smashed and pierced his temple.
translation:
  language: sw
  text: Aliunyoosha mkono wake kuelekea kigingi cha hema, na mkono wake wa kuume kuelekea nyundo ya wafanyakazi[a]; akampiga Sisera, akakiponda kichwa chake[b], akaubonda na kuupenya upande wa kichwa chake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “rungu la wafanyakazi” au “nyundo ya mafundi.” Kirai cha Kiebrania si cha kawaida sana, na kinaweza kumaanisha nyundo, rungu, au chombo kingine kizito cha kupigia.
    reason: lexical_alternative
  - marker: b
    text: Au “akakivunja kichwa chake.” Kiebrania kinatumia mfululizo wa vitenzi vikali ili kuongeza nguvu ya picha ya kishairi.
    reason: lexical_alternative
  - marker: c
    text: Au “akaupenya upande wa kichwa chake” au “akapita katika upande wa kichwa chake.” Kitenzi cha Kiebrania huenda kina maana ya kupita au kupenya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדָהּ ... תִּשְׁלַחְנָה
  choice: Aliunyosha mkono wake
  rationale: Muundo huu unaonyesha tendo la kupeleka au kunyoosha mkono na kudumisha picha halisi ya kishairi.
- source_word: לַיָּתֵד
  choice: kwenye kigingi cha hema
  rationale: Katika muktadha wa Yaeli, kigingi hiki ni cha hema; kutaja hema kunabainisha rejeo bila kubadili maana.
- source_word: וִימִינָהּ
  choice: mkono wake wa kuume
  rationale: Tafsiri ya moja kwa moja inayohifadhi usambamba wa kishairi na ‘mkono wake.’
- source_word: לְהַלְמוּת עֲמֵלִים
  choice: kwenye nyundo ya mafundi
  rationale: Kirai kinaeleza chombo cha kupigia kinachotumiwa na wafanyakazi au mafundi; ‘nyundo ya mafundi’ ni Kiswahili cha kawaida huku utata mdogo wa aina ya chombo ukitajwa katika tanbihi.
- source_word: וְהָלְמָה סִיסְרָא
  choice: akampiga Sisera
  rationale: Kitenzi kina maana ya kupiga kwa nguvu; tafsiri hii ni wazi na inaendeleza mfululizo wa matendo.
- source_word: מָחֲקָה רֹאשׁוֹ
  choice: akakiponda kichwa chake
  rationale: Kitenzi chenye nguvu huonyesha kuponda au kuvunja; ‘ponda’ linafaa kwa picha kali ya shairi.
- source_word: וּמָחֲצָה
  choice: akakipasua
  rationale: Kitenzi cha pili cha nguvu kimetafsiriwa kwa neno tofauti ili kuhifadhi mrundikano wa vitenzi vya kishairi.
- source_word: וְחָלְפָה רַקָּתוֹ
  choice: kukipenya kipaji chake
  rationale: Kitenzi kinaweza kuonyesha kupita au kupenya, na ‘kipaji’ hapa ni upande wa kichwa karibu na jicho na sikio.
