  - severity: medium
    issue: “Akakipasua na kukipenya kipaji chake” ina uhusiano wa kisarufi usio wazi wa viambishi vya yambwa.
    rationale: Msomaji anaweza kushindwa kubaini kwa urahisi ni nini kinapasuliwa na nini kinapenya. Kurudia nomino inayorejelewa katika kishazi cha mwisho huweka wazi tendo bila kupunguza msisitizo wa kishairi.
