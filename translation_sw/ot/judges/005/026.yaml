  source_fidelity: Tafsiri inafuata kwa jumla mfuatano wa matendo na ukali wa lugha ya Kiebrania. Hata hivyo, “kipaji” kwa Kiswahili cha kawaida humaanisha zaidi paji la uso kuliko upande wa kichwa/hekalu (רַקָּתוֹ). Pia mpangilio wa “akakipasua na kukipenya kipaji chake” unaacha kiima cha vitu na uhusiano wa vitenzi ukiwa wenye utata usio wa lazima.
  naturalness: Mwanzo umeboreshwa kwa kutumia “kuelekea,” unaoeleza kwa kawaida kunyoosha mkono ili kuchukua chombo. Mwishoni, kutaja “upande wa kichwa chake” huondoa utata wa “kipaji” na hufanya sintaksia ya mfululizo wa vitenzi iwe wazi.
  terminology: “Kigingi cha hema,” “mkono wake wa kuume,” na “nyundo ya wafanyakazi” zinafaa. “Nyundo ya wafanyakazi” huhifadhi maana ya chombo cha kupigia kinachohusishwa na wafanyakazi bila kudai kwa uhakika aina mahsusi ya nyundo.
