base_translation:
  language: en
  yaml_path: translation/ot/judges/005/015.yaml
  text: And the princes of Issachar were with Deborah[a]; and Issachar was likewise with Barak; into the valley they were sent at his feet[c][b]. Among the divisions of Reuben there were great searchings of heart.
translation:
  language: sw
  text: 'Wakuu wa Isakari walikuwa pamoja na Debora[a];

    naye Isakari, vivyo hivyo, alikuwa pamoja na Baraka.

    Walitumwa bondeni, miguuni pake[b].

    Katika migawanyiko ya Rubeni

    kulikuwa na tafakari nzito moyoni[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “viongozi wa Isakari” au “wakuu wangu katika Isakari.” Muundo wa Kiebrania ni wa kishairi na unaweza kueleweka kwa njia zaidi ya moja.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “miguuni pake,” yaani, wakimfuata Baraka kwa karibu.
    reason: lexical_alternative
  - marker: c
    text: Au “maazimio makubwa ya moyoni,” “mawazo mazito ya moyoni,” au “kujichunguza sana moyoni.” Kirai cha Kiebrania ni kigumu; katika muktadha huenda kinakazia mjadala wa ndani wa Rubeni badala ya hatua.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂרַי בְּיִשָּׂשכָר
  choice: Wakuu wa Isakari
  rationale: “Wakuu” inaendeleza hadhi ya lugha ya kishairi na inaeleweka kwa urahisi. Muundo wa Kiebrania ni wa kishairi na unaweza pia kusomwa kwa karibu zaidi kama “wakuu wangu katika Isakari”; tanbihi inahifadhi uwezekano huo.
- source_word: עִם
  choice: pamoja na
  rationale: Hueleza ushirika au kuandamana bila kuongeza maana ya kiufundi ya kijeshi.
- source_word: וְיִשָּׂשכָר כֵּן בָּרָק
  choice: naye Isakari, vivyo hivyo, alikuwa pamoja na Baraka
  rationale: Kitenzi hakijaandikwa wazi katika Kiebrania cha kishairi; “alikuwa pamoja na” kinakamilisha sentensi kwa Kiswahili huku “vivyo hivyo” kikihifadhi ulinganifu unaoonyeshwa na כֵּן.
- source_word: בָּעֵמֶק
  choice: bondeni
  rationale: Katika muktadha wa kutumwa vitani, neno hili linaonyesha mahali walikoelekea au walikopelekwa, si mahali walipokuwapo tu.
- source_word: שֻׁלַּח
  choice: Walitumwa
  rationale: Kitenzi ni cha umoja kimaumbo, lakini Isakari ni jina la pamoja la kabila; wingi wa Kiswahili unaonyesha vikosi vya kabila hilo bila kuondoa tabia ya kishairi.
- source_word: בְּרַגְלָיו
  choice: miguuni pake
  rationale: Tafsiri ya karibu inadumisha taswira ya Kiebrania. Katika muktadha huu maana yake ni kumfuata Baraka kwa karibu, jambo linalofafanuliwa katika tanbihi.
- source_word: בִּפְלַגּוֹת רְאוּבֵן
  choice: Katika migawanyiko ya Rubeni
  rationale: “Migawanyiko” huhifadhi maana ya sehemu, makundi, au pande ndani ya kabila na pia mvutano wa kishairi kati ya kugawanyika na kusita kuchukua hatua.
- source_word: גְּדֹלִים חִקְקֵי לֵב
  choice: palikuwa na mashauri mazito ya moyoni
  rationale: Kirai cha Kiebrania ni kigumu na kinaweza kumaanisha kutafakari, kujichunguza, au kufanya maazimio. “Mashauri mazito ya moyoni” ni Kiswahili cha kawaida chenye uzito wa kishairi na, katika muktadha, kinaonyesha mjadala wa ndani wa Rubeni bila kudai kwamba alifikia uamuzi thabiti.
