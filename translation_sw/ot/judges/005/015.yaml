    issue: The final clause uses “palikuwa na mashauri mazito ya moyoni.”
    rationale: Use “kulikuwa na” for idiomatic existential phrasing. Replacing “mashauri” with “tafakari” avoids the usual sense of advice/counsel and better reflects the contextual sense of inward searching or deliberation.
