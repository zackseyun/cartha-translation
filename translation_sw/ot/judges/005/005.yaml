  text: הָרִ֥ים נָזְל֖וּ מִ/פְּנֵ֣י יְהוָ֑ה זֶ֣ה סִינַ֔י מִ/פְּנֵ֕י יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/005.yaml
  text: The mountains quaked before Yahweh[a], this Sinai before Yahweh[b], the God of Israel.
translation:
  language: sw
  text: Milima ilitiririka[a] mbele ya Yahweh[b]; Sinai hii, mbele ya Yahweh, Mungu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliyeyuka.” Kitenzi cha Kiebrania humaanisha kutiririka au kudondoka kama majimaji.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi zaidi, “kutoka mbele ya uso au uwepo wa Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  choice: Milima
  rationale: Nomino hii ina kibainishi katika Kiebrania na kwa kawaida humaanisha milima; katika Kiswahili, muktadha na nafasi yake mwanzoni mwa mstari vinaifanya ‘Milima’ kuwa ya kawaida bila kulazimisha neno la ziada.
- source_word: נָזְלוּ
  choice: ilitiririka
  rationale: Kitenzi נזל humaanisha kutiririka au kudondoka kama majimaji. ‘Ilitiririka’ huhifadhi taswira ya kishairi ya milima kana kwamba inatiririka, badala ya kuibadili moja kwa moja kuwa ‘ilitetemeka’ au ‘iliyeyuka.’
- source_word: מִפְּנֵי
  choice: mbele za
  rationale: Hii ni nahau yenye maana halisi ya kutoka mbele ya uso au uwepo wa mtu. ‘Mbele za’ ni usemi wa Kiswahili unaoeleweka na unaohifadhi maana ya kukabili uwepo wa Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi, badala ya kubadilishwa kuwa cheo.
- source_word: זֶה סִינַי
  choice: Sinai hii
  rationale: Mpangilio huu huhifadhi kiashiria cha ghafla na cha kishairi ‘hii’ pamoja na jina Sinai, bila kuongeza neno ‘Mlima’ ambalo halipo katika maandishi.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Tafsiri hii ya kawaida ya Kiswahili huhifadhi utambulisho wa Yahweh kuwa Mungu wa Israeli.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu moja kwa moja. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Taswira ya kishairi katika נָזְלוּ
  choice: Milima ilitiririka
  alternative: Milima iliyeyuka au ilitetemeka
  rationale: ‘Ilitiririka’ ndiyo inayokaribia zaidi maana ya msingi ya kitenzi na huhifadhi mvutano wa taswira ya kishairi. ‘Iliyeyuka’ ni ufafanuzi unaowezekana, lakini ‘ilitetemeka’ huonyesha tukio kwa jumla bila kuakisi maana ya kitenzi chenyewe.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Nukta mkato huhifadhi mshororo wa pili wa kishairi na muundo wake wa kudondosha kitenzi: ‘Sinai hii, mbele za Yahweh.’'
