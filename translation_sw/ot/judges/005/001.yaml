  yaml_path: translation/ot/judges/005/001.yaml
  text: 'Then Deborah and Barak son of Abinoam sang on that day[a], saying:'
translation:
  language: sw
  text: 'Ndipo Debora na Baraka mwana wa Abinoamu wakaimba siku hiyo[a], wakisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina kitenzi cha umoja, “Debora akaimba,” kisha kinaongeza “na Baraka”; katika muktadha maana yake ni kwamba Debora na Baraka waliimba pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשַׁר
  choice: wakaimba
  rationale: Kitenzi kinatokana na שׁיר, ‘kuimba.’ Katika Kiebrania kitenzi ni cha umoja wa kike na kinakubaliana na Debora, ambaye ametajwa kwanza, kisha Baraka anaunganishwa naye. Kiswahili cha kawaida hutumia wingi kwa kiima ambatani ‘Debora na Baraka,’ kwa hiyo ‘wakaimba’ huwasilisha maana ya kwamba waliimba pamoja bila kuongeza neno ‘wimbo,’ ambalo halipo wazi katika mstari huu.
- source_word: דְּבוֹרָה
  choice: Debora
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: וּבָרָק
  choice: na Baraka
  rationale: Kiunganishi pamoja na jina la mtu; ‘Baraka’ ni umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בֶּן אֲבִינֹעַם
  choice: mwana wa Abinoamu
  rationale: Huu ni usemi wa Kiebrania unaotaja ukoo wa baba; ‘mwana wa Abinoamu’ ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Kishazi hiki kinataja siku maalumu ya ushindi. Kiswahili huonyesha maana ya wakati kwa kawaida bila kulazimika kuongeza kihusishi ‘katika.’
- source_word: לֵאמֹר
  choice: 'wakisema:'
  rationale: Ni neno la kawaida la Kiebrania linalotanguliza maneno yanayofuata. Wingi unalingana kiasili na kiima ambatani cha Kiswahili, na nukta mbili zinaonyesha kuwa wimbo unaanza baada yake.
theological_decisions: []
