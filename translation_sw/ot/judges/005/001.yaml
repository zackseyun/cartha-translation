  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wazi na wenye hadhi. ‘Ndipo’ linaendeleza mfuatano wa simulizi wa וַ־, huku majina yakitumia maumbo yanayotambulika katika matumizi ya Biblia za Kiswahili.
