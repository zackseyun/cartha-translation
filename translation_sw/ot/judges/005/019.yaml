base_translation:
  language: en
  yaml_path: translation/ot/judges/005/019.yaml
  text: Kings came; they fought. Then the kings of Canaan fought at Taanach[a], by the waters of Megiddo; they took no plunder of silver.
translation:
  language: sw
  text: Wafalme walikuja, wakapigana. Ndipo wafalme wa Kanaani wakapigana huko Taanaki, karibu na maji ya Megido; hawakuchukua nyara za fedha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “faida ya fedha” au “pato la fedha.” Usemi wa Kiebrania unaweza kumaanisha faida ya mali kwa ujumla, lakini katika muktadha huu wa vita tafsiri “nyara za fedha” inafaa zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאוּ מְלָכִים
  choice: Wafalme walikuja
  rationale: Huhifadhi mwanzo mfupi wa kishairi na kutotajwa wazi kwa wafalme hao kwa kutumia nomino isiyo na kibainishi.
- source_word: נִלְחָמוּ
  choice: wakapigana
  rationale: Niphal ya לחם hapa ina maana ya kupigana; muundo huu ni mfupi na wa kawaida katika Kiswahili.
- source_word: אָז
  choice: Ndipo
  rationale: Huonyesha hatua inayofuata katika simulizi la kishairi bila kuongeza maelezo yasiyokuwamo.
- source_word: מַלְכֵי כְנַעַן
  choice: wafalme wa Kanaani
  rationale: Huwakilisha kwa uwazi muundo wa Kiebrania unaomaanisha wafalme wa nchi au watu wa Kanaani.
- source_word: בְּתַעְנַךְ
  choice: huko Taanaki
  rationale: Kihusishi ב kinaonyesha mahali pa mapigano; 'huko' ni cha kawaida kwa kurejelea eneo hilo.
- source_word: עַל מֵי מְגִדּוֹ
  choice: karibu na maji ya Megido
  rationale: עַל katika muktadha huu wa kijiografia huonyesha ukaribu na maji ya Megido; tafsiri hii huepuka kudokeza kwamba walikuwa juu ya maji.
- source_word: בֶּצַע כֶּסֶף
  choice: nyara za fedha
  rationale: בצע inaweza kumaanisha faida au pato, na katika muktadha wa vita inaweza kumaanisha nyara; 'nyara za fedha' inafaa muktadha huku maana mbadala zikibainishwa katika tanbihi.
- source_word: לֹא לָקָחוּ
  choice: hawakupata
  rationale: Ingawa kitenzi kwa msingi ni 'hawakuchukua,' katika usemi wa nyara za vita 'hawakupata' ni Kiswahili cha kawaida na huhifadhi maana ya kutofanikiwa kupata nyara.
