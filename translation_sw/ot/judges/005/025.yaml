  text: He asked for water[a]; she gave milk[b]. In a bowl fit for nobles she brought him curds.
translation:
  language: sw
  text: Aliomba maji; akampa maziwa. Katika bakuli la wakuu[b] alimletea maziwa yaliyoganda[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “siagi” au “krimu”; neno la Kiebrania linaweza kumaanisha bidhaa tajiri ya maziwa.
    reason: lexical_alternative
  - marker: b
    text: Au “katika bakuli linalowafaa wakuu”; kihalisi, “katika bakuli la wakuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם
  choice: maji
  rationale: Maana ya msingi ni maji halisi, nayo yanatofautishwa na maziwa ambayo Yaeli alimpa.
- source_word: שָׁאַל
  choice: aliomba
  rationale: Kitenzi hiki kinamaanisha kuomba au kutaka apewe kitu; “aliomba” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: חָלָב
  choice: maziwa
  rationale: Hii ndiyo maana ya kawaida ya neno la Kiebrania na inadumisha tofauti kati ya ombi la Sisera na ukarimu wa Yaeli.
- source_word: נָתָנָה
  choice: akampa
  rationale: Umbo la kitenzi ni la kike na linamhusu Yaeli. Kiambishi “-m-” kinamtaja kwa kawaida mpokeaji anayeeleweka katika muktadha.
- source_word: בְּסֵפֶל
  choice: katika bakuli
  rationale: סֵפֶל ni chombo kama bakuli au beseni; “bakuli” ni neno la kawaida na linalofaa katika mazingira ya kuandaa kinywaji.
- source_word: אַדִּירִים
  choice: la wakuu
  rationale: Neno hili linaweza kumaanisha wakuu, wenye nguvu, au watu mashuhuri. Tafsiri hii inadumisha muundo halisi “bakuli la wakuu” na kutoruhusu maana ya uhusiano huo iamuliwe kupita kiasi.
- source_word: הִקְרִיבָה
  choice: alimletea
  rationale: Hifili ya קרב ni kuleta au kusogeza karibu. Katika muktadha wa ukarimu, “alimletea” ni ya kawaida na haileti bila sababu maana ya sadaka ya kidini.
- source_word: חֶמְאָה
  choice: maziwa yaliyoganda
  rationale: Neno hili hutaja bidhaa nzito ya maziwa, na linaweza kueleweka kuwa maziwa yaliyoganda, siagi, au krimu. “Maziwa yaliyoganda” linaeleweka kwa urahisi na linafaa kwa bidhaa ya maziwa ya kale huku mbadala zikihifadhiwa katika tanbihi.
