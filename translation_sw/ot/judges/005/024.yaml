  yaml_path: translation/ot/judges/005/024.yaml
  text: Most blessed among women is Jael[a], the wife of Heber the Kenite; among women in the tent[b], most blessed is she.
translation:
  language: sw
  text: Abarikiwe kuliko wanawake, Yaeli, mke wa Heberi, Mkeni; abarikiwe kuliko wanawake hemani.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Abarikiwe miongoni mwa wanawake Yaeli … miongoni mwa wanawake hemani.” Muundo wa Kiebrania unaweza kueleweka kuwa wa kulinganisha (“kuliko”) au wa kutaja aliye bora zaidi katika kundi (“miongoni mwa”).
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya moja kwa moja, “katika hema.” Huenda usemi huu unarejelea wanawake waishio hemani, lakini Kiebrania kinatumia umoja.
    reason: cultural_note
lexical_decisions:
- source_word: תְּבֹרַךְ
  choice: Abarikiwe
  rationale: Umbo la Pual la ברך linaweza kueleza kubarikiwa au kusifiwa. Kiswahili cha kutakia, “Abarikiwe,” huhifadhi nguvu ya kishairi bila kulazimisha iwe taarifa tu.
- source_word: מִנָּשִׁים
  choice: kuliko wanawake wote
  rationale: מִן hapa inaonyesha ulinganisho. “Kuliko wanawake wote” ni Kiswahili cha kawaida kinachobeba maana ya kulinganisha iliyo katika Kiebrania.
- source_word: יָעֵל
  choice: Yaeli
  rationale: Jina limetoholewa kwa namna inayotumika katika Kiswahili.
- source_word: אֵשֶׁת חֶבֶר הַקֵּינִי
  choice: mke wa Heberi Mkeni
  rationale: Huhifadhi uhusiano wa ndoa na utambulisho wa ukoo kwa mtiririko wa kawaida wa Kiswahili.
- source_word: בָּאֹהֶל
  choice: walio hemani
  rationale: Huhifadhi nomino ya umoja “hema” huku ikiruhusu maana ya wanawake wanaohusishwa na maisha ya hemani.
- source_word: תְּבֹרָךְ
  choice: yeye ndiye abarikiwe zaidi
  rationale: Huhifadhi urudiaji wa kitenzi na mkazo wa kishairi wa mstari wa pili.
