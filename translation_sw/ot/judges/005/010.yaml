base_translation:
  language: en
  yaml_path: translation/ot/judges/005/010.yaml
  text: You who ride on white donkeys[a], you who sit on carpets[b], and you who walk on the road—speak!
translation:
  language: sw
  text: Ninyi mnaopanda punda weupe, ninyi mnaoketi juu ya mazulia[a], na ninyi mnaotembea njiani—simulieni![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “juu ya vitambaa vya tandiko” au “juu ya matandiko”; neno la Kiebrania ni adimu na maana yake si hakika.
    reason: lexical_alternative
  - marker: b
    text: Au “semeni” au “tafakarini”; kitenzi cha Kiebrania kinaweza kumaanisha kusema, kusimulia, au kutafakari.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְבֵי
  choice: ninyi mnaopanda
  rationale: Ni kauli ya kushirikisha yenye wingi inayotumiwa kama mwito; tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: אֲתֹנוֹת
  choice: punda
  rationale: Neno la Kiebrania humaanisha hasa punda wa kike, lakini jinsia yao si kiini cha taswira hapa; Kiswahili cha kawaida hutumia “punda.”
- source_word: צְחֹרוֹת
  choice: weupe
  rationale: Huhifadhi maana ya msingi ya weupe au uangavu na taswira ya wanyama mashuhuri wa kupandwa.
- source_word: יֹשְׁבֵי
  choice: ninyi mnaoketi
  rationale: Kauli nyingine ya kushirikisha inayotumiwa kama mwito; “kuketi” inafaa kwa kitu kinachotajwa baada yake.
- source_word: מִדִּין
  choice: matandiko
  rationale: Neno hili adimu halina maana ya hakika. Katika muktadha wa wapandaji na wasafiri, huenda linarejelea matandiko, mazulia, au vitambaa vya kukalia.
- source_word: וְהֹלְכֵי
  choice: na ninyi mnaotembea
  rationale: Huhifadhi muundo sambamba wa miito mitatu na taswira halisi ya kusafiri kwa miguu.
- source_word: דֶּרֶךְ
  choice: njiani
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha mazingira ya barabara au njia.
- source_word: שִׂיחוּ
  choice: simulieni
  rationale: Amri hii inaweza kumaanisha kusema, kusimulia, au kutafakari. Katika wimbo wa ushindi, “simulieni” huonyesha mwito wa kutangaza matendo yaliyotokea bila kuondoa upana wa maana, ambao umeonyeshwa katika tanbihi.
