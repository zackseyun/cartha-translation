  yaml_path: translation/ot/judges/005/022.yaml
  text: Then the horses’ hoofs pounded from the galloping[a], the galloping of his mighty steeds.
translation:
  language: sw
  text: Ndipo kwato za farasi zikagonga kwa kishindo, kwa mbio[a], mbio za farasi wake hodari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbio za mashujaa wake.” Neno la Kiebrania linaweza kurejelea farasi wenye nguvu au mashujaa wanaohusishwa nao.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Kiambishi hiki cha wakati kinaendeleza kwa uhai mfululizo wa wimbo; “Ndipo” ni cha kawaida na cha kishairi katika Kiswahili.
- source_word: הָלְמוּ
  choice: zikagonga kwa kishindo
  rationale: Kitenzi kinaonyesha kupiga kwa nguvu na sauti; usemi huu unawasilisha mwendo na kishindo cha kwato.
- source_word: עִקְּבֵי סוּס
  choice: kwato za farasi
  rationale: Ingawa עִקְּבֵי kwa msingi inaweza kumaanisha visigino, katika muktadha wa farasi inarejelea kwato; umoja סוּס unatumiwa kwa maana ya jumla.
- source_word: מִדַּהֲרוֹת דַּהֲרוֹת
  choice: kwa sababu ya mbio, mbio
  rationale: מִן inaonyesha sababu au chanzo cha kishindo, na kurudiwa kwa דַּהֲרוֹת kumehifadhiwa ili kudumisha msisitizo wa kishairi.
- source_word: אַבִּירָיו
  choice: mashujaa wake
  rationale: Neno linaweza kumaanisha wenye nguvu au mashujaa, na katika muktadha huu linaweza kuhusishwa na wapiganaji au farasi wao; “mashujaa wake” ni tafsiri ya moja kwa moja kiasi, huku tanbihi ikihifadhi uwezekano mwingine.
theological_decisions:
- issue: Kirejelewa cha kiambishi cha nafsi ya tatu umoja katika אַבִּירָיו
  choice: mashujaa wake
  alternative: farasi wake hodari / madume yake yenye nguvu
  rationale: Kiambishi huenda kinarejelea mkuu wa jeshi la adui, lakini kishairi kirai kinaweza kueleweka kuwa wapiganaji au farasi wenye nguvu. Maandishi yanaweka neno la jumla na tanbihi inaonyesha utata huo bila kuutatua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya “mbio” yamehifadhiwa kwa ajili ya nguvu na mahadhi ya wimbo.
