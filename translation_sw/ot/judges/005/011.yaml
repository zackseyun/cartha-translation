reference: Judges 5:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִ/קּ֣וֹל מְחַֽצְצִ֗ים בֵּ֚ין מַשְׁאַבִּ֔ים שָׁ֤ם יְתַנּוּ֙ צִדְק֣וֹת יְהוָ֔ה צִדְקֹ֥ת פִּרְזֹנ֖/וֹ בְּ/יִשְׂרָאֵ֑ל אָ֛ז יָרְד֥וּ לַ/שְּׁעָרִ֖ים עַם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/011.yaml
  text: From the sound of archers among the watering places[a], there they recount the righteous acts of Yahweh, the righteous acts of his villagers in Israel[c][b]. Then the people of Yahweh went down to the gates.
translation:
  language: sw
  text: 'Kutoka katika sauti za wapiga mishale miongoni mwa mahali pa kutekea maji,[a]

    huko wanasimulia matendo ya haki ya Yahwe,

    matendo ya haki ya wanavijiji wake katika Israeli.[b]

    Ndipo watu wa Yahwe wakashuka malangoni.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa sauti za wapiga mishale karibu na mahali pa kutekea maji.” Mwanzo wa mstari huu ni mgumu; huenda unaonyesha mahali ambapo usimulizi unasikika badala ya kuonyesha kutoka au kujitenga na sauti hizo.
    reason: alternative_reading
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “wanavijiji” ni gumu. Linaweza pia kumaanisha watu wa mashambani, makazi yasiyozungushiwa kuta, au, ingawa ina uwezekano mdogo, watawala. Huenda kishazi hiki kinarejelea matendo ya haki aliyowatendea watu hao.
    reason: lexical_alternative
  - marker: c
    text: Katika Israeli ya kale, malango ya mji yalikuwa mahali pa mikutano ya umma, hukumu, shughuli za kiraia, na ulinzi.
    reason: cultural_note
lexical_decisions:
- source_word: מִקּוֹל מְחַצְצִים
  choice: Kutoka katika sauti za wapiga mishale
  rationale: Tafsiri hii inadumisha maana ya msingi ya מִן pamoja na קוֹל, huku מְחַצְצִים ikieleweka katika muktadha kuwa wapiga mishale. Kwa kuwa mwanzo wa mstari ni mgumu na unaweza kueleweka kwa namna nyingine, uwezekano huo umewekwa katika tanbihi.
- source_word: בֵּין מַשְׁאַבִּים
  choice: katikati ya mahali pa kuteka maji
  rationale: מַשְׁאַבִּים ni mahali ambapo watu huchota maji, kama visima au sehemu za kunyweshea mifugo. ‘Katikati ya’ inadumisha בֵּין bila kubainisha aina moja tu ya mahali hapo.
- source_word: יְתַנּוּ
  choice: wanasimulia
  rationale: Kitenzi hiki katika Piel kina maana ya kukariri, kutangaza, au kusimulia kwa sauti. ‘Wanasimulia’ kinafaa kwa ushuhuda wa hadharani bila kulazimisha kwamba waliimba.
- source_word: צִדְקוֹת יְהוָה
  choice: matendo ya haki ya Yahwe
  rationale: צִדְקוֹת hapa ni matendo halisi yanayoonyesha haki na uaminifu wa Yahwe, si sifa ya kinadharia tu. Tafsiri haipunguzi maana kuwa ushindi au wokovu pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa ‘Yahwe’ badala ya kubadilishwa na cheo, ili kuhifadhi jina la agano lililo katika maandishi ya Kiebrania.
- source_word: צִדְקֹת פִּרְזֹנוֹ
  choice: matendo ya haki ya wanavijiji wake
  rationale: פִּרְזוֹן ni neno gumu linalohusiana na maisha ya vijijini, watu wa vijijini, au makazi yasiyozungushiwa kuta. Tafsiri ya msingi inadumisha muundo wa Kiebrania na hali yake ya kutobainika kikamilifu; maana nyingine zinaelezwa katika tanbihi.
- source_word: אָז יָרְדוּ לַשְּׁעָרִים
  choice: Ndipo ... waliposhuka kwenda malangoni
  rationale: אָז inaonyesha hatua inayofuata, na ירד inadumishwa kwa ‘waliposhuka.’ Malango yalikuwa pia maeneo ya shughuli za umma, jambo linalofafanuliwa katika tanbihi.
- source_word: עַם יְהוָה
  choice: watu wa Yahwe
  rationale: Tafsiri hii inadumisha utambulisho wa watu hao kwa jina la Mungu bila kuongeza ufafanuzi wa kimadhehebu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu la herufi nne. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha na cheo.
- issue: Maana ya צִדְקוֹת katika wimbo wa ushindi
  choice: matendo ya haki
  alternative: matendo ya kuokoa; ushindi
  rationale: Neno hilo linaweza kumaanisha matendo yanayodhihirisha haki na uaminifu, ambayo katika muktadha huu yanahusisha ukombozi. ‘Matendo ya haki’ huhifadhi upana wa neno bila kuingiza maana nyembamba zaidi.
- issue: Uhusiano katika צִדְקֹת פִּרְזֹנוֹ
  choice: matendo ya haki ya wanavijiji wake
  alternative: matendo ya haki aliyowatendea watu wake wa vijijini; matendo ya haki katika makazi yake yasiyozungushiwa kuta
  rationale: Muundo wa Kiebrania na maana ya פִּרְזוֹן vina utata wa kweli. Maandishi makuu yanahifadhi muundo huo, na tanbihi inaonyesha uwezekano wa kuelewa matendo hayo kuwa kwa ajili ya watu wa vijijini au kuhusiana na makazi yasiyo na kuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi ulio wa sasa, wenye heshima na unaoeleweka. Mpangilio wa mistari unadumisha usambamba wa wimbo. Jina ‘Yahwe’ limetumiwa kwa uthabiti, na utata wa mwanzo wa mstari pamoja na neno פִּרְזוֹן haujafichwa.
