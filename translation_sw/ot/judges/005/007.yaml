  text: חָדְל֧וּ פְרָז֛וֹן בְּ/יִשְׂרָאֵ֖ל חָדֵ֑לּוּ עַ֤ד שַׁ/קַּ֨מְתִּי֙ דְּבוֹרָ֔ה שַׁ/קַּ֥מְתִּי אֵ֖ם בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/007.yaml
  text: Village life ceased in Israel; it ceased until I[a], Deborah, arose—until I arose as a mother in Israel.
translation:
  language: sw
  text: 'Maisha ya vijijini[a] yalikoma katika Israeli;

    yalikoma mpaka mimi, Debora, nilipoinuka—

    mpaka nilipoinuka kama mama katika Israeli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanavijiji walikoma katika Israeli,” au “wakazi wa maeneo ya vijijini walikoma katika Israeli.” Nomino ya Kiebrania ni ngumu na inaweza kumaanisha wakazi wa vijijini au maisha ya vijijini kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְלוּ / חָדֵלּוּ
  choice: yalikoma / yalikoma
  rationale: Kitenzi kinachorudiwa kinaonyesha kusitishwa kwa hali iliyokuwapo. “Yalikoma” huhifadhi marudio ya kishairi na sauti ya huzuni kuhusu kuvurugika kwa maisha ya kawaida.
- source_word: פְרָזוֹן
  choice: maisha ya vijijini
  rationale: Nomino hii ya Kiebrania ni ngumu na huenda ikarejelea wakazi wa vijijini au maisha katika makazi yasiyozungushiwa kuta. “Maisha ya vijijini” huwasilisha kwa Kiswahili cha kawaida maana pana ya kuvunjika kwa maisha ya maeneo hayo bila kuifanya nomino hiyo kuwa jina la mahali tu.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Kihusishi hapa kina maana ya mahali au mazingira ya taifa; “katika Israeli” ni wazi na huhifadhi muundo wa chanzo.
- source_word: עַד
  choice: mpaka
  rationale: 'Neno hili linaonyesha hatua ya mabadiliko: hali hiyo iliendelea mpaka Debora alipoinuka.'
- source_word: שַׁקַּמְתִּי
  choice: mimi ... nilipoinuka / nilipoinuka
  rationale: Kitenzi kutoka קום kinaonyesha kuinuka ili kuchukua hatua. Kiwakilishi “mimi” katika kutajwa kwa kwanza huonyesha wazi nafsi ya kwanza, na marudio huhifadhi msisitizo wa wimbo.
- source_word: דְּבוֹרָה
  choice: Debora
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: אֵם
  choice: mama
  rationale: Neno hili linaweza kuwa la sitiari au heshima, likionyesha nafasi ya Debora ya ulinzi, ulezi na uongozi. “Kama mama” huonyesha matumizi hayo bila kudai kuwa alikuwa mama mzazi wa taifa.
theological_decisions:
- issue: Maana ya sitiari katika Debora kujiita אֵם בְּיִשְׂרָאֵל
  choice: “kama mama katika Israeli,” likibaki wazi kama taswira ya nafasi ya ulinzi, ulezi na uongozi
  alternative: “mama wa Israeli,” kama cheo chenye nguvu zaidi
  rationale: Kiebrania kinasema “mama katika Israeli,” si “mama wa Israeli.” Tafsiri hii huhifadhi kihusishi na kuepuka kuimarisha cheo kuliko chanzo, huku maana ya sitiari ikiendelea kusikika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na hadhi inayofaa wimbo wa kale. Marudio ya “yalikoma” na “nilipoinuka” yamehifadhiwa kwa sababu ni sehemu ya msisitizo wa maandishi ya chanzo. Alama ya tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja.
