  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya amri na usemi usio wa kawaida “sema wimbo” yamehifadhiwa ili kudumisha nguvu na upekee wa Kiebrania.
