  yaml_path: translation/ot/judges/005/012.yaml
  text: Awake[a], awake, Deborah! Awake, awake, sing a song! Rise up, Barak, and take captive your captives[b], son of Abinoam.
translation:
  language: sw
  text: Amka, amka, Debora! Amka, amka, sema wimbo[a]! Inuka, Baraka, wateke mateka wako[b], mwana wa Abinoamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imba wimbo.” Kitenzi cha Kiebrania kwa maana halisi ni “sema,” na huenda kimekusudiwa kudumisha nguvu ya kishairi ya mwito huu.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “wateke mateka wako”; ni nahau ya Kiebrania inayoeleza kuwashinda maadui kwa kuwachukua kuwa wafungwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי
  choice: Amka
  rationale: Amri ya umoja wa kike imerudiwa mara nne kwa msisitizo wa kishairi. “Amka” ni ya kawaida, wazi, na inadumisha mwito huo.
- source_word: דְּבוֹרָה
  choice: Debora
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: דַּבְּרִי שִׁיר
  choice: sema wimbo
  rationale: Kitenzi דּבר humaanisha “sema,” si kitenzi cha kawaida cha “imba.” Tafsiri hii inahifadhi usemi wa pekee wa shairi, ingawa Kiswahili cha kawaida kingesema “imba wimbo.”
- source_word: קוּם
  choice: Inuka
  rationale: Amri ya umoja wa kiume kwa Baraka; inafaa mwito wa kishairi na wa kivita.
- source_word: בָּרָק
  choice: Baraka
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika mapokeo ya Biblia ya Kiswahili.
- source_word: וּשֲׁבֵה
  choice: uwateke mateka
  rationale: Kitenzi kina maana ya kuwachukua watu kuwa mateka. Muundo huu unadumisha maana ya kijeshi na mwangwi wa maneno ya Kiebrania.
- source_word: שֶׁבְיְךָ
  choice: mateka wako
  rationale: Nomino inaweza kumaanisha mateka kwa ujumla au hali ya utumwa. Katika wimbo huu wa ushindi, “mateka wako” inafaa na huhifadhi kirai cha Kiebrania “uwateke mateka wako.”
- source_word: בֶּן אֲבִינֹעַם
  choice: mwana wa Abinoamu
  rationale: Utambulisho wa ukoo umehifadhiwa kwa namna rasmi na ya kawaida katika Kiswahili cha Biblia.
