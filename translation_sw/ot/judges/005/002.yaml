  language: sw
  text: 'Viongozi walipochukua uongozi katika Israeli,


    watu walipojitolea kwa hiari,


    msifuni YHWH![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: YHWH ni jina maalumu la Mungu katika Kiebrania, ambalo kwa kawaida husomwa “BWANA.” Mwanzo wa mstari huu wa kishairi ni mgumu; pia umetafsiriwa, “Nywele zilipoachwa huru katika Israeli,” huenda ikirejelea ishara ya wapiganaji waliojiweka wakfu.
    reason: Kueleza jina la Mungu na kuhifadhi utata halisi wa kirai cha kwanza cha Kiebrania bila kutanguliza tafsiri mbadala kama hakika.
lexical_decisions:
- source_word: בִּפְרֹעַ פְּרָעוֹת
  choice: Viongozi walipoongoza
  rationale: Kirai hiki cha kishairi ni kigumu na kinaweza kueleweka kwa njia kadhaa. Katika muktadha wa wimbo huu, tafsiri hii inafuata maana inayokubalika sana ya uongozi kujitokeza au viongozi kuongoza, huku ikihifadhi uradidi wa Kiebrania kwa kiasi fulani.
- source_word: בְּהִתְנַדֵּב עָם
  choice: watu walipojitolea kwa hiari
  rationale: Kitenzi kinamaanisha kujitoa kwa hiari; nyongeza 'kwa hiari' inaweka wazi kipengele hicho muhimu katika Kiswahili cha kawaida.
- source_word: בָּרֲכוּ
  choice: msifuni
  rationale: Katika mwito wa ibada unaomwelekea Mungu, kitenzi cha Kiebrania 'barikini' hutumika kwa maana ya kumsifu au kumtukuza; 'msifuni' ni ya kawaida na wazi kwa msomaji wa Kiswahili.
- source_word: יְהוָה
  choice: YHWH
  rationale: Herufi za jina la agano zimehifadhiwa moja kwa moja ili kutoficha jina maalumu nyuma ya cheo kama 'BWANA'; tanbihi inaeleza usomaji wa kawaida.
theological_decisions:
- issue: Utambulisho wa jina la Mungu יְהוָה
  choice: YHWH
  alternative: BWANA / Yahwe
  rationale: Kutumia YHWH huhifadhi jina maalumu katika matini bila kulazimisha matamshi fulani; tanbihi inasaidia usomaji wa hadhara.
- issue: Maana ya בִּפְרֹעַ פְּרָעוֹת
  choice: Viongozi walipoongoza
  alternative: Nywele zilipoachwa wazi / vizuizi vilipoondolewa
  rationale: Muktadha sambamba wa watu kujitolea unaunga mkono wazo la viongozi kuchukua uongozi. Hata hivyo, kwa kuwa umbo la kishairi lina utata wa kweli, tafsiri mbadala imeandikwa katika tanbihi badala ya kufichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini rahisi kueleweka. Mistari mitatu inaakisi mpangilio wa wimbo na ulinganifu wa sentensi. Neno 'Israeli' limetumiwa badala ya 'Israeli' yenye miundo ya kizamani; mwito 'msifuni' ni wa hadhara na wenye hadhi.
