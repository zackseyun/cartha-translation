base_translation:
  language: en
  yaml_path: translation/ot/judges/005/020.yaml
  text: From heaven the stars fought[b][a]; from their courses they fought against Sisera.
translation:
  language: sw
  text: 'Kutoka mbinguni nyota zilipigana;

    kutoka katika njia zao zilipigana dhidi ya Sisera.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “pamoja na Sisera”; katika muktadha wa vita maana yake ni “dhidi ya Sisera.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן שָׁמַיִם
  choice: Kutoka mbinguni
  rationale: Kirai hiki kinawasilisha chanzo au upande wa mapambano. “Mbinguni” ni Kiswahili cha kawaida na cha kishairi kinacholingana na שָׁמַיִם bila kulazimisha wingi wa kimofolojia wa Kiebrania.
- source_word: נִלְחָמוּ
  choice: zilipigana
  rationale: Kitenzi hiki humaanisha kushiriki katika vita. “Zilipigana” ni cha moja kwa moja, kinafaa kwa nyota kama kiima, na kinahifadhi urudiaji wa kishairi.
- source_word: הַכּוֹכָבִים
  choice: nyota
  rationale: כּוֹכָבִים humaanisha nyota. Kiswahili kwa kawaida hakihitaji kibainishi tofauti ili kuonyesha ule uainisho wa Kiebrania.
- source_word: מִמְּסִלּוֹתָם
  choice: katika njia zake
  rationale: מְסִלּוֹת inaweza kumaanisha barabara, mapito, au njia. Katika muktadha wa nyota, “njia zake” ni ya asili na inadumisha taswira ya mapito yaliyowekwa angani bila kuingiza dhana ya kisasa ya obiti.
- source_word: עִם סִיסְרָא
  choice: dhidi ya Sisera
  rationale: Ingawa עִם kwa kawaida ni “pamoja na,” pamoja na kitenzi cha kupigana hutaja mpinzani; kwa hiyo “dhidi ya Sisera” huwasilisha maana ya kimuktadha kwa uwazi.
theological_decisions:
- issue: Namna nyota zilivyoshiriki vitani
  choice: Kauli ya kishairi kwamba nyota zilipigana imeachwa bila kufafanua namna ilivyotukia.
  alternative: Kuitafsiri wazi kuwa nguvu za asili, jeshi la malaika, au ushiriki halisi wa vitu vya angani.
  rationale: Wimbo huu unasema nyota zilipigana lakini hauelezi utaratibu wake. Kudumisha taswira hiyo kunahifadhi utata na mvutano wa kiteolojia wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari na urudiaji wa “zilipigana” vinadumisha usambamba wa shairi la Kiebrania. “Njia zake” limechaguliwa badala ya istilahi ya kisayansi ili kutoharibu taswira ya kale.
