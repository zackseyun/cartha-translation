  text: Zebulun was a people that risked its life to the death[a], and Naphtali also[b], on the heights of the field.
translation:
  language: sw
  text: Zebuluni ni watu waliohatarisha maisha yao hadi kufa[a], na Naftali pia, juu ya miinuko ya nchi ya wazi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliodharau maisha yao mpaka kufa,” yaani, “walihatarisha maisha yao hata kufa.” Kiebrania kinatumia umoja wa kijamii kwa Zebuluni na kitenzi chenye maana ya kutendea kwa dharau.
    reason: lexical_alternative
  - marker: b
