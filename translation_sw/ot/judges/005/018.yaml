lexical_decisions:
- source_word: זְבֻלוּן
  choice: Zebuluni
  rationale: Jina la kabila limetolewa kwa umbo la Kiswahili linalotumika kwa kawaida.
- source_word: עַם
  choice: watu
  rationale: Nomino ya jamii inahifadhi wazo la kabila kama kundi, huku upatanisho wa 'walio-' ukifuata maana ya wingi.
- source_word: חֵרֵף נַפְשׁוֹ
  choice: waliohatarisha maisha yao
  rationale: Katika muktadha wa vita, usemi halisi wa kuyadharau maisha una maana ya kutoyathamini kwa sababu ya kujitia hatarini; tafsiri hii ni ya asili na inaeleweka wazi kwa Kiswahili.
- source_word: לָמוּת
  choice: hadi kufa
  rationale: Inaonyesha kiwango au matokeo ya kujihatarisha, yaani mpaka kufikia kifo.
- source_word: וְנַפְתָּלִי
  choice: na Naftali pia
  rationale: '''Pia'' linaweka wazi usambamba unaodokezwa: Naftali alishiriki sifa ileile iliyotajwa kuhusu Zebuluni.'
- source_word: עַל מְרוֹמֵי שָׂדֶה
  choice: kwenye miinuko ya uwanja
  rationale: Inahifadhi taswira ya mahali palipoinuka katika eneo la wazi bila kulifanya moja kwa moja kuwa 'uwanja wa vita.'
