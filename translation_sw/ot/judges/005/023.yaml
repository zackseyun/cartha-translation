  text: א֣וֹרוּ מֵר֗וֹז אָמַר֙ מַלְאַ֣ךְ יְהוָ֔ה אֹ֥רוּ אָר֖וֹר יֹשְׁבֶ֑י/הָ כִּ֤י לֹֽא בָ֨אוּ֙ לְ/עֶזְרַ֣ת יְהוָ֔ה לְ/עֶזְרַ֥ת יְהוָ֖ה בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/023.yaml
  text: Curse Meroz[a], said the angel of Yahweh; curse, utterly curse its inhabitants, because they did not come to the help of Yahweh[b], to the help of Yahweh against the mighty.
translation:
  language: sw
  text: “Laanini Merozi,” akasema malaika[a] wa Yahweh. “Laanini kabisa wakazi wake, kwa sababu hawakuja kumsaidia Yahweh, kumsaidia Yahweh dhidi ya mashujaa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe wa Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kumsaidia Yahweh ... miongoni mwa mashujaa.” Kirai cha mwisho kinaweza pia kueleweka “dhidi ya mashujaa” au “pamoja na mashujaa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: א֣וֹרוּ / אֹ֥רוּ אָר֖וֹר
  choice: Laanini / Laanini kabisa
  rationale: Kitenzi ארר kinatoa amri kali ya kulaani. ‘Kabisa’ linaonyesha msisitizo wa infinitivi kamili אָרוֹר baada ya amri bila kufanya Kiswahili kisicho cha kawaida.
- source_word: מֵר֗וֹז
  choice: Merozi
  rationale: Ni jina la mahali; umbo ‘Merozi’ linafuata matamshi ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: מַלְאַ֣ךְ יְהוָ֔ה
  choice: malaika wa Yahweh
  rationale: מַלְאָךְ linaweza kumaanisha ‘malaika’ au ‘mjumbe.’ Katika kirai hiki cha kibiblia, ‘malaika wa Yahweh’ ni cha kawaida huku tanbihi ikihifadhi uwezekano wa ‘mjumbe.’
- source_word: יֹשְׁבֶ֑י/הָ
  choice: wakazi wake
  rationale: Kirai kinawataja kwa pamoja wale wanaokaa Merozi; ‘wakazi wake’ ni Kiswahili cha asili na kifupi.
- source_word: כִּ֤י לֹֽא בָ֨אוּ֙
  choice: kwa sababu hawakuja
  rationale: כִּי linaanzisha sababu ya laana; ‘kwa sababu’ linaweka wazi uhusiano huo.
- source_word: לְ/עֶזְרַ֣ת יְהוָ֔ה
  choice: kumsaidia Yahweh
  rationale: Ingawa Kiebrania kinatumia nomino ‘kwa msaada wa,’ Kiswahili cha asili hutumia kitenzi ‘kumsaidia.’ Kurudiwa kwa kirai kumehifadhiwa.
- source_word: בַּ/גִּבּוֹרִֽים
  choice: dhidi ya mashujaa
  rationale: Kirai hiki kina utata wa kisintaksia. ‘Dhidi ya mashujaa’ kinafaa na muktadha wa vita, lakini tanbihi inahifadhi uwezekano wa ‘miongoni mwa mashujaa’ au ‘pamoja na mashujaa.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Jina la agano linawasilishwa moja kwa moja kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- issue: Utambulisho wa מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  alternative: mjumbe wa Yahweh
  rationale: Tafsiri haifafanui ikiwa huyu ni malaika wa kiumbe, mjumbe wa kibinadamu, au udhihirisho maalumu wa Mungu; tanbihi inahifadhi utata wa neno.
- issue: Maana ya בַּגִּבּוֹרִים
  choice: dhidi ya mashujaa
  alternative: miongoni mwa mashujaa / pamoja na mashujaa
  rationale: Muktadha wa wimbo wa vita unaunga mkono ‘dhidi ya,’ lakini kihusishi ב na nomino גִּבּוֹרִים vinaweza kueleweka kwa njia nyingine, kwa hiyo utata umeandikwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya kishairi ya Kiebrania yamehifadhiwa; ‘kabisa’ linaonyesha msisitizo, na alama zote za tanbihi [a] na [b] zipo katika matini kuu.
