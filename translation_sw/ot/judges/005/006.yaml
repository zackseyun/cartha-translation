  text: בִּ/ימֵ֞י שַׁמְגַּ֤ר בֶּן עֲנָת֙ בִּ/ימֵ֣י יָעֵ֔ל חָדְל֖וּ אֳרָח֑וֹת וְ/הֹלְכֵ֣י נְתִיב֔וֹת יֵלְכ֕וּ אֳרָח֖וֹת עֲקַלְקַלּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/006.yaml
  text: In the days of Shamgar son of Anath[a], in the days of Jael, the highways were deserted[b], and travelers went by roundabout paths.
translation:
  language: sw
  text: Katika siku za Shamgari mwana wa Anathi, katika siku za Yaeli, njia kuu ziliacha kutumiwa[a], na waendao katika vijia walipitia njia zilizopindapinda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “njia zilikoma”—yaani, safari za kawaida katika njia kuu zilikoma.
    reason: lexical_alternative
  - marker: b
    text: “Njia zilizopindapinda” huenda ni njia zisizo za moja kwa moja zilizotumiwa ili kuepuka hatari, wala si mfano wa upotovu wa maadili.
    reason: cultural_note
lexical_decisions:
- source_word: בִּימֵי
  choice: katika siku za
  rationale: Ni nahau ya wakati inayotaja kipindi kilichohusishwa na watu waliotajwa; tafsiri hii ni ya kawaida na yenye hadhi katika Kiswahili cha Biblia.
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: Shamgari mwana wa Anathi
  rationale: Majina yametoholewa kwa namna inayosomeka kiasili katika Kiswahili, na בֶּן limetafsiriwa moja kwa moja kuwa “mwana wa”.
- source_word: יָעֵל
  choice: Yaeli
  rationale: Jina limetoholewa kwa kufuata matamshi na matumizi yaliyozoeleka katika Kiswahili.
- source_word: חָדְלוּ אֳרָחוֹת
  choice: njia kuu ziliacha kutumiwa
  rationale: Kitenzi חָדְלוּ kimsingi humaanisha “zilikoma”; pamoja na “njia,” maana ya muktadha ni kwamba safari za kawaida katika njia hizo zilikoma. Kauli hii ni wazi bila kuondoa taswira ya kukoma.
- source_word: הֹלְכֵי נְתִיבוֹת
  choice: wasafiri
  rationale: Kirai hiki kwa halisi ni “waendao katika vijia/njia.” “Wasafiri” huwasilisha watu hao kwa Kiswahili cha kawaida bila kudai kwamba walikuwa wakitembea kwa miguu tu.
- source_word: יֵלְכוּ
  choice: walifuata
  rationale: Hali ya kitenzi katika wimbo huu inaeleza tendo la kawaida la wakati uliopita; “walifuata” inaungana kiasili na njia walizolazimika kutumia.
- source_word: אֳרָחוֹת עֲקַלְקַלּוֹת
  choice: njia zilizopindapinda
  rationale: Kivumishi עֲקַלְקַלּוֹת huonyesha njia zilizopotoka, zenye mikunjo, au zisizo za moja kwa moja. “Zilizopindapinda” huhifadhi taswira ya kimwili bila kuingiza maana ya upotovu wa maadili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. “Njia kuu” huepuka wazo la lazima la barabara za kisasa zilizojengwa, na “ziliacha kutumiwa” huweka wazi maana inayodokezwa na kitenzi cha Kiebrania. Alama za tanbihi zimewekwa karibu na maneno yanayozifafanua.
