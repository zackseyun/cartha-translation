base_translation:
  language: en
  yaml_path: translation/ot/judges/005/021.yaml
  text: The torrent of Kishon swept them away— the ancient torrent[a], the torrent of Kishon. March on, my soul[b], with strength!
translation:
  language: sw
  text: 'Mto wa Kishoni uliwafagia mbali—

    mto wa kale[a], Mto wa Kishoni.

    Songa mbele, nafsi yangu[b], kwa nguvu!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mto wa zamani” au “mto wa tangu kale.” Neno la Kiebrania קְדוּמִים linaweza kurejelea mambo ya zamani sana; huenda pia ni maelezo ya kishairi yanayosisitiza sifa ya mto kuliko kutaja tu umri wake.
    reason: lexical_alternative
  - marker: b
    text: Au “Kanyaga, nafsi yangu, kwa nguvu” au “Ponda, nafsi yangu, kwa uweza.” Kiebrania ni kifupi na cha kishairi, na kitenzi kinaweza kumaanisha kukanyaga au kuponda, pamoja na kusonga mbele.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל
  choice: mto
  rationale: Katika muktadha huu neno linaashiria mkondo wa maji wenye nguvu unaofagilia jeshi. “Mto” ni neno la kawaida na la asili katika Kiswahili; nguvu ya gharika inaonyeshwa na kitenzi “uliwafagilia mbali.”
- source_word: קִישׁוֹן
  choice: Kishoni
  rationale: Jina la mkondo wa maji limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: גְּרָפָם
  choice: uliwafagilia mbali
  rationale: Kitenzi גרף humaanisha kufagilia, kuburuta, au kuosha na kuondoa. Usemi huu unadumisha taswira ya maji yenye nguvu na unaeleweka kwa urahisi.
- source_word: נַחַל קְדוּמִים
  choice: mto wa kale
  rationale: קְדוּמִים huelekeza kwenye nyakati za zamani. “Mto wa kale” hudumisha mtindo wa kishairi bila kulazimisha maana ya kimitholojia.
- source_word: תִּדְרְכִי
  choice: Songa mbele
  rationale: דרך inaweza kumaanisha kukanyaga, kwenda kwa hatua, au kusonga. Katika kujihimiza huku, “Songa mbele” ni ya asili na inadumisha nguvu ya agizo la kishairi.
- source_word: נַפְשִׁי
  choice: nafsi yangu
  rationale: Hifadhi ya usemi wa moja kwa moja kwa nafsi ya msemaji inadumisha balagha ya shairi kuliko kuibadili kuwa “mimi.”
- source_word: עֹז
  choice: kwa nguvu
  rationale: עֹז ni nguvu au uweza. “Kwa nguvu” huwasilisha kwa ufupi hali ya kitendo katika muundo huu wa kishairi.
