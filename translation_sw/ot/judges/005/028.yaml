base_translation:
  language: en
  yaml_path: translation/ot/judges/005/028.yaml
  text: 'Through the window Sisera’s mother looked out and wailed through the lattice: “Why is his chariot so late in coming? Why do the hoofbeats of his chariots delay?”[a][b]'
translation:
  language: sw
  text: 'Kupitia dirishani, mama yake Sisera akachungulia na kulia kupitia kimiani: “Kwa nini gari lake la vita limechelewa kuja? Kwa nini vishindo vya magari yake ya vita vimekawia?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akapiga yowe”; kitenzi cha Kiebrania kilichotafsiriwa “kulia” ni adimu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “hatua” au “mapigo ya magari yake”; “vishindo” huonyesha sauti inayodokezwa na mwendo wa magari bila kuamua kama ni ya kwato au magurudumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַד הַחַלּוֹן
  choice: Kupitia dirishani
  rationale: Kirai kinaonyesha kutazama kupitia uwazi wa dirisha; ‘kupitia dirishani’ ni Kiswahili cha kawaida kinachohifadhi maana ya mahali.
- source_word: נִשְׁקְפָה
  choice: akachungulia
  rationale: Kitenzi kinaeleza kutazama nje kutoka dirishani au mahali palipoinuka; ‘akachungulia’ kinafaa katika mandhari hii bila kuongeza wazo la kutazama kwa muda mrefu.
- source_word: וַתְּיַבֵּב
  choice: na kulia
  rationale: Hiki ni kitenzi adimu kinachoonekana kumaanisha kutoa kilio cha huzuni au wasiwasi. ‘Kulia’ huhifadhi upana huo wa maana; uwezekano wa ‘kupiga yowe’ umeelezwa katika tanbihi.
- source_word: אֵם סִיסְרָא
  choice: mama yake Sisera
  rationale: Muundo wa umilikaji umetafsiriwa kwa Kiswahili cha asili.
- source_word: בְּעַד הָאֶשְׁנָב
  choice: kupitia kimiani
  rationale: Nomino inarejelea uwazi wenye kimia; ‘kimiani’ ni usemi mfupi unaohifadhi picha ya jengo.
- source_word: בֹּשֵׁשׁ רִכְבּוֹ לָבוֹא
  choice: gari lake limechelewa sana kuja
  rationale: ‘Limechelewa ... kuja’ huwasilisha kuchelewa kwa gari linalotarajiwa kurudi, huku ‘sana’ ikitoa msisitizo wa swali la wasiwasi kwa lugha ya kawaida.
- source_word: אֶחֱרוּ פַּעֲמֵי מַרְכְּבוֹתָיו
  choice: vishindo vya magari yake vimekawia
  rationale: פַּעֲמֵי maana yake ya msingi ni hatua au mapigo. Katika muktadha wa magari ya vita, ‘vishindo’ huhifadhi taswira ya sauti ya mwendo bila kuibainisha isivyofaa kuwa kwato au magurudumu.
