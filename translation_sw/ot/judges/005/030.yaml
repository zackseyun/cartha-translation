  text: הֲ/לֹ֨א יִמְצְא֜וּ יְחַלְּק֣וּ שָׁלָ֗ל רַ֤חַם רַחֲמָתַ֨יִם֙ לְ/רֹ֣אשׁ גֶּ֔בֶר שְׁלַ֤ל צְבָעִים֙ לְ/סִ֣יסְרָ֔א שְׁלַ֥ל צְבָעִ֖ים רִקְמָ֑ה צֶ֥בַע רִקְמָתַ֖יִם לְ/צַוְּארֵ֥י שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/030.yaml
  text: ‘Are they not finding and dividing the spoil? A womb[a], two wombs for each man; spoil of dyed cloths for Sisera, spoil of dyed cloths, embroidered cloth, dyed cloth[b], two embroideries for the necks of the spoil.’
translation:
  language: sw
  text: “Je, hawapati na kugawana nyara? Tumbo la uzazi[a], matumbo mawili ya uzazi kwa kila mwanamume; nyara ya vitambaa vilivyotiwa rangi kwa ajili ya Sisera, nyara ya vitambaa vilivyotiwa rangi, kitambaa kilichotariziwa, kitambaa kilichotiwa rangi[b], tarizi mbili kwa shingo za nyara.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania husema moja kwa moja, “tumbo la uzazi, matumbo mawili ya uzazi,” metonimia kali inayowarejelea wanawake waliotekwa kama nyara za ngono.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa shingo za mateka” au “kwa shingo za waliotekwa kuwa nyara.” Kirai cha mwisho cha Kiebrania ni kigumu, na huenda kinarejelea vitambaa vilivyotariziwa ambavyo wanawake mateka wangevaa.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יִמְצְאוּ יְחַלְּקוּ
  choice: Je, hawapati na kugawana
  rationale: Swali la balagha linaonyesha matarajio ya sasa yaliyo hai katika wimbo; vitenzi vya wakati wa sasa vinafuata mfuatano wa kupata kisha kugawana.
- source_word: שָׁלָל
  choice: nyara
  rationale: Ni istilahi ya kawaida ya Kiswahili kwa mali au watu waliotekwa vitani, na inafaa katika lugha ya kishairi.
- source_word: רַחַם רַחֲמָתַיִם
  choice: Tumbo la uzazi, matumbo mawili ya uzazi
  rationale: Maana ya moja kwa moja na umbo la uwili vimehifadhiwa ili kutoondoa lugha kali inayowafanya wanawake waliotekwa waonekane kama nyara za ngono.
- source_word: לְרֹאשׁ גֶּבֶר
  choice: kwa kila mwanamume
  rationale: Kirai hiki ni nahau ya ugawaji kwa kila mtu; tafsiri hii ni ya asili katika Kiswahili huku ikihifadhi jinsia ya גֶּבֶר.
- source_word: צְבָעִים
  choice: vitambaa vilivyotiwa rangi
  rationale: Hurejelea nguo au vitambaa vya rangi vilivyo miongoni mwa nyara; ‘vitambaa’ huepuka kudai kwa uhakika kwamba tayari vilikuwa mavazi.
- source_word: רִקְמָה
  choice: kitambaa kilichotariziwa
  rationale: Hufanya rejeo la nguo lieleweke katika Kiswahili na kuhifadhi taswira ya kazi ya tarizi.
- source_word: צֶבַע רִקְמָתַיִם
  choice: kitambaa kilichotiwa rangi, tarizi mbili
  rationale: Mpangilio uliobanwa wa Kiebrania na umbo la uwili vimehifadhiwa kadiri Kiswahili kinavyoruhusu, bila kulainisha marudio.
- source_word: לְצַוְּארֵי שָׁלָל
  choice: kwa shingo za nyara
  rationale: Tafsiri ya karibu huhifadhi ugumu na utata wa kirai cha mwisho badala ya kukifafanua kwa uhakika usio katika maandishi.
theological_decisions:
- issue: Iwapo lugha ya nyara za kingono רַחַם רַחֲמָתַיִם ilainishwe
  choice: Kuhifadhi sitiari ya moja kwa moja ‘tumbo la uzazi, matumbo mawili ya uzazi’
  alternative: ‘mwanamke mmoja, wanawake wawili’ au ‘msichana mmoja, wasichana wawili’
  rationale: Maneno haya yanaonyesha matarajio ya kikatili ya watu wa nyumbani kwa Sisera, si kibali cha msimuliaji. Kuyahifadhi kunadumisha mshtuko wa kimaadili wa wimbo.
- issue: Maana ya kirai kigumu לְצַוְּארֵי שָׁלָל
  choice: Kutoa tafsiri ya karibu katika andiko na kuweka ufafanuzi mbadala katika tanbihi
  alternative: ‘kwa shingo za mateka’ au ‘kwa shingo za waliotekwa kuwa nyara’
  rationale: Sintaksia ya Kiebrania imebanwa na maana yake inajadiliwa; tanbihi huhifadhi utata bila kulazimisha ufafanuzi mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wenye heshima lakini unaoeleweka. Marudio ya orodha ya vitambaa na ukali wa ‘tumbo la uzazi’ yamehifadhiwa kwa makusudi; tanbihi zinafafanua bila kuficha ukatili au kutatua kupita kiasi sintaksia yenye utata.
