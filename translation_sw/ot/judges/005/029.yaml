  yaml_path: translation/ot/judges/005/029.yaml
  text: 'Her wisest princesses answer her; indeed, she herself repeats her words to herself:'
translation:
  language: sw
  text: 'Mabibi wake wa cheo wenye hekima zaidi wanamjibu; naam, yeye mwenyewe anayajirudishia mwenyewe maneno yake:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַכְמוֹת שָׂרוֹתֶיהָ
  choice: wanawake wenye hekima zaidi miongoni mwa mabibi zake wa kifalme
  rationale: חַכְמוֹת ni wingi wa kike unaoonyesha walio na hekima, na שָׂרוֹתֶיהָ ni mabibi wa hadhi ya juu wa malkia. Muundo huu unasawiri hali ya juu ya hekima bila kuwalazimisha kuitwa binti za kifalme.
- source_word: תַּעֲנֶינָּה
  choice: wanamjibu
  rationale: Kitenzi ni wingi wa kike na maana yake ya moja kwa moja ni ‘wanamjibu’.
- source_word: אַף
  choice: naam
  rationale: Hapa neno hilo linaongeza na kusisitiza kwamba mama mwenyewe pia anaitikia; ‘naam’ ni kiunganishi cha heshima kinachofaa ushairi.
- source_word: תָּשִׁיב אֲמָרֶיהָ לָהּ
  choice: yeye mwenyewe anajirudishia maneno yake
  rationale: Kirai kwa ukaribu ni ‘anayarudisha maneno yake kwake mwenyewe.’ Tafsiri hii inadumisha wazo la kujisemea au kujirudia bila kulifanya kwa uhakika kuwa jibu tofauti.
