source:
  edition: WLC
  text: מִנִּ֣י אֶפְרַ֗יִם שָׁרְשָׁ/ם֙ בַּ/עֲמָלֵ֔ק אַחֲרֶ֥י/ךָ בִנְיָמִ֖ין בַּֽ/עֲמָמֶ֑י/ךָ מִנִּ֣י מָכִ֗יר יָֽרְדוּ֙ מְחֹ֣קְקִ֔ים וּ/מִ֨/זְּבוּלֻ֔ן מֹשְׁכִ֖ים בְּ/שֵׁ֥בֶט סֹפֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/014.yaml
  text: From Ephraim those whose root was in Amalek[a]; after you, Benjamin, among your peoples. From Machir commanders came down[e][d][c][b], and from Zebulun those who wield the staff of the scribe.
translation:
  language: sw
  text: Kutoka Efraimu—wale ambao mzizi wao ulikuwa katika Amaleki[a]; baada yako, Benyamini, miongoni mwa watu wako[b]. Kutoka Makiri[c] makamanda[d] walishuka, na kutoka Zabuloni wale wanaoshika fimbo ya mwandishi[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mzizi wao ulikuwa dhidi ya Amaleki,” au “mzizi wao ulikuwa katika nchi ya vilima ya Amaleki.” Mstari huu wa Kiebrania ni mgumu na huenda unaeleza eneo kwa lugha ya kishairi.
    reason: alternative_reading
  - marker: b
    text: Au “Benyamini alikufuata, miongoni mwa koo au jamaa zako.” Usemi “miongoni mwa watu wako” unafuata kwa karibu maneno yasiyo ya kawaida ya Kiebrania.
    reason: lexical_alternative
  - marker: c
    text: Makiri ni ukoo mkuu wa Manase; kwa hiyo tafsiri nyingine hutumia jina pana la kabila, “Manase.”
    reason: cultural_note
  - marker: d
    text: Au “waweka-sheria” au “watawala.” Neno la Kiebrania linaweza kumaanisha wenye kutawala au kutoa amri.
    reason: lexical_alternative
  - marker: e
    text: Au “wale wanaovuta kwa fimbo ya mwandishi,” au “wale wanaobeba fimbo ya mkuu wa jeshi.” Usemi wa Kiebrania ni adimu na huenda unahusu kuwakusanya wanajeshi au kutunza kumbukumbu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּי אֶפְרַיִם
  choice: Kutoka Efraimu
  rationale: Kihusishi kinaonyesha chanzo au asili; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha orodha ya kishairi ya makabila.
- source_word: שָׁרְשָׁם
  choice: mzizi wao
  rationale: Neno hilo kihalisi ni ‘mzizi.’ Kudumisha sitiari huepuka kulifasiri moja kwa moja kuwa uzao au vizazi.
- source_word: בַּעֲמָלֵק
  choice: katika Amaleki
  rationale: Maana ya mahali ndiyo ya moja kwa moja zaidi, ingawa mstari ni mgumu na unaweza kueleweka kwa njia nyingine.
- source_word: אַחֲרֶיךָ בִנְיָמִין
  choice: baada yako, Benyamini
  rationale: Tafsiri hii inadumisha usemi mfupi wa kishairi bila kuongeza kitenzi ambacho hakipo katika Kiebrania.
- source_word: בַּעֲמָמֶיךָ
  choice: miongoni mwa watu wako
  rationale: Hii inafuata kwa karibu usemi usio wa kawaida wa Kiebrania huku ikibaki wazi kwa wasomaji wa Kiswahili.
- source_word: מִנִּי מָכִיר
  choice: Kutoka Makiri
  rationale: Kiebrania kinamtaja Makiri moja kwa moja, kwa hiyo jina hilo linadumishwa badala ya kubadilishwa kuwa Manase.
- source_word: יָרְדוּ
  choice: walishuka
  rationale: Kitenzi hiki kinatoa maana ya moja kwa moja ya kushuka bila kubainisha zaidi mwelekeo au sababu.
- source_word: מְחֹקְקִים
  choice: makamanda
  rationale: Katika muktadha wa kuitwa kwa makabila vitani, neno hili linaelekea kumaanisha viongozi wenye mamlaka; tanbihi inadumisha uwezekano wa ‘waweka-sheria.’
- source_word: וּמִזְּבוּלֻן
  choice: na kutoka Zabuloni
  rationale: Tafsiri ya moja kwa moja inayoendeleza orodha ya makabila.
- source_word: מֹשְׁכִים
  choice: waliotumia
  rationale: Kitenzi kihalisi kina wazo la kuvuta; ‘kutumia’ ni cha kawaida zaidi pamoja na chombo kinachofuata, bila kufafanua matumizi yake.
- source_word: בְּשֵׁבֶט סֹפֵר
  choice: fimbo ya mwandishi
  rationale: Neno שֵׁבֶט linaweza kumaanisha fimbo, ufito au fimbo ya mamlaka, na סֹפֵר ni mwandishi. Tafsiri hii inadumisha taswira na utata wa usemi adimu.
