revisions:
- from: Kutoka Efraimu walitokea wale ambao mzizi wao ulikuwa katika Amaleki[a]; baada yako, Benyamini, miongoni mwa watu wako[b]. Kutoka Makiri[c] makamanda[d] walishuka, na kutoka Zabuloni walitokea wale waliotumia fimbo ya mwandishi[e].
  to: Kutoka Efraimu—wale ambao mzizi wao ulikuwa katika Amaleki[a]; baada yako, Benyamini, miongoni mwa watu wako[b]. Kutoka Makiri[c] makamanda[d] walishuka, na kutoka Zabuloni wale wanaoshika fimbo ya mwandishi[e].
  rationale: The revision removes unsupported finite verbs in the first and final tribal clauses, preserving the Hebrew song's concise, elliptical listing. It also adjusts the Benjamin alternative note so that it does not replace the source's 'among' relation with the more definite 'together with.' No doctrinal interpretation has been introduced.
