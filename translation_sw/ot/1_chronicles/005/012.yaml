translation:
  language: sw
  text: Yoeli alikuwa mkuu, Shafamu wa pili[a], na Yaanai na Shafati katika Bashani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naibu” au “wa pili kwa cheo.”
    reason: Neno la Kiebrania הַמִּשְׁנֶה linaweza kumaanisha mtu wa pili kwa cheo; “naibu” ni tafsiri inayowezekana lakini yenye maelezo zaidi.
lexical_decisions:
- source_word: יוֹאֵל
  choice: Yoeli
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: הָרֹאשׁ
  choice: alikuwa mkuu
  rationale: Ingawa רֹאשׁ maana yake ya msingi ni ‘kichwa,’ hapa inaonyesha uongozi au cheo cha kwanza. ‘Alikuwa mkuu’ ni Kiswahili cha kawaida na huweka wazi muundo wa kirai.
- source_word: וְשָׁפָם
  choice: Shafamu
  rationale: Jina la mtu limetoholewa kwa kufuata mfumo wa sauti wa Kiswahili.
- source_word: הַמִּשְׁנֶה
  choice: alikuwa wa pili kwa cheo
  rationale: מִשְׁנֶה huonyesha nafasi ya pili au cheo kinachofuata. Tafsiri hii ni wazi kuliko ‘wa pili’ peke yake bila kulazimisha maana mahususi ya ‘naibu.’
- source_word: וְיַעְנַי
  choice: Yaanai
  rationale: Jina la mtu limetoholewa kwa karibu na umbo la Kiebrania יַעְנַי.
- source_word: וְשָׁפָט
  choice: Shafati
  rationale: Jina la mtu limetoholewa kwa umbo la Kiswahili linalowakilisha שָׁפָט.
- source_word: בַּבָּשָׁן
  choice: huko Bashani
  rationale: Kiambishi בַּ־ kinaonyesha mahali; ‘huko Bashani’ ni usemi wa asili wa Kiswahili na huhifadhi rejeo la eneo.
