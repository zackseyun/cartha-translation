  text: 'The sons of Joel: Shemaiah his son[a], Gog his son, Shimei his son.'
translation:
  language: sw
  text: 'Wana wa Yoeli: Shemaya mwanawe[a], Gogu mwanawe, Shimei mwanawe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wazao wa Yoeli.” Mfumo huu wa ukoo wa Kiebrania wakati mwingine unaweza kumaanisha uzao mpana zaidi, lakini kurudiwa kwa “mwanawe” hapa kunaunga mkono mfululizo wa moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa hali ya kuambatanisha wa בֵּן, unaoanzisha orodha ya ukoo. “Wana wa” ni tafsiri ya moja kwa moja na ya kawaida; ingawa inaweza kumaanisha wazao kwa upana, mfululizo wa בְנוֹ unaunga mkono ukoo wa mwana kwa baba.
- source_word: יוֹאֵל
  choice: Yoeli
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Jina la mtu limetoholewa kwa Kiswahili kwa kuhifadhi sauti kuu za jina la Kiebrania.
- source_word: בְנוֹ
  choice: mwanawe
  rationale: Nomino בֵּן yenye kiambishi cha nafsi ya tatu umoja wa kiume ina maana ya “mwana wake”; “mwanawe” ni usemi mfupi na wa asili katika orodha ya ukoo.
- source_word: גּוֹג
  choice: Gogu
  rationale: Jina la mtu limetoholewa kwa muundo wa Kiswahili; hapa ni jina katika orodha ya ukoo bila kuingiza maana kutoka sehemu nyingine.
- source_word: שִׁמְעִי
  choice: Shimei
  rationale: Jina la mtu limetoholewa kwa umbo linalotambulika katika matumizi ya kawaida ya Biblia za Kiswahili.
