  text: וַ/יֵּעָזְר֣וּ עֲלֵי/הֶ֔ם וַ/יִּנָּתְנ֤וּ בְ/יָדָ/ם֙ הַֽ/הַגְרִיאִ֔ים וְ/כֹ֖ל שֶׁ֣/עִמָּ/הֶ֑ם כִּ֠י לֵ/אלֹהִ֤ים זָעֲקוּ֙ בַּ/מִּלְחָמָ֔ה וְ/נַעְתּ֥וֹר לָ/הֶ֖ם כִּי בָ֥טְחוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/020.yaml
  text: They were helped against them[a], and the Hagrites and all who were with them were given into their hand, because they cried out to God in the battle[c][b], and he answered them because they trusted in him.
translation:
  language: sw
  text: Walisaidiwa dhidi yao, na Wahagri na wote waliokuwa pamoja nao wakatiwa mikononi mwao,[a] kwa sababu walimlilia Mungu vitani, naye akawajibu,[b] kwa sababu walimtumaini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wakatiwa mikononi mwao,” nahau inayomaanisha walikabidhiwa kwao na kushindwa.'
    reason: lexical_alternative
  - marker: b
    text: Au, “naye alikubali kusihiwa nao,” yaani, Mungu aliitikia sala yao kwa fadhili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּעָזְרוּ עֲלֵיהֶם
  choice: Walisaidiwa dhidi yao
  rationale: Nifali ya עזר ni ya kutendwa; tafsiri hii inaacha mtendaji wa msaada bila kutajwa moja kwa moja, kama Kiebrania, huku muktadha ukionyesha kuwa msaada ulitoka kwa Mungu.
- source_word: וַיִּנָּתְנוּ בְיָדָם
  choice: wakatiwa mikononi mwao
  rationale: Nahau ya נתן ביד inaeleza kukabidhiwa chini ya mamlaka ya mshindi; taswira ya mkono imehifadhiwa kwa Kiswahili kinachoeleweka.
- source_word: הַהַגְרִיאִים
  choice: Wahagri
  rationale: Jina la kundi la watu limetoholewa kwa muundo wa kawaida wa majina ya mataifa katika Kiswahili.
- source_word: וְכֹל שֶׁעִמָּהֶם
  choice: pamoja na wote waliokuwa nao
  rationale: Inarejelea washirika au majeshi yaliyoandamana na Wahagri.
- source_word: כִּי לֵאלֹהִים זָעֲקוּ בַּמִּלְחָמָה
  choice: kwa sababu walimlilia Mungu vitani
  rationale: זעק huonyesha kilio cha dharura cha kuomba msaada; בַּמִּלְחָמָה imewasilishwa kwa Kiswahili asilia kama ‘vitani.’
- source_word: וְנַעְתּוֹר לָהֶם
  choice: naye akakubali maombi yao
  rationale: Nifali ya עתר hapa hueleza Mungu kukubali kusihiwa na kuitikia kwa fadhili; tanbihi inahifadhi muundo na upeo wa maana ya asili.
- source_word: כִּי בָטְחוּ בוֹ
  choice: kwa sababu walimtumaini
  rationale: בטח ב huonyesha kumtegemea au kumwekea mtu tumaini; kirejeshi cha Kiswahili kinamtaja Mungu kwa uwazi bila kuongeza wazo jipya.
theological_decisions:
- issue: Mtendaji wa msaada vitani
  choice: Kauli tendwa ‘Walisaidiwa’ imehifadhiwa, bila kumtaja Mungu moja kwa moja kama kiima cha kishazi hicho.
  alternative: Mungu aliwasaidia dhidi yao.
  rationale: Umbo la Kiebrania ni la kutendwa na halimtaji mtendaji, ingawa sentensi inayofuata inadhihirisha msaada wa Mungu kwa kuunganisha ushindi na kilio chao kwake.
- issue: Jinsi Mungu alivyoitikia sala
  choice: ‘akakubali maombi yao’
  alternative: ‘akakubali kusihiwa nao’ au ‘akawajibu’
  rationale: עָתַר katika Nifali huonyesha kukubali kusihiwa na kuitikia kwa fadhili. Tafsiri kuu ni ya kawaida katika Kiswahili, huku tanbihi ikihifadhi ukaribu zaidi na muundo wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Vitani’ na ‘walimlilia’ ni vya kawaida na vinaendeleza uzito wa simulizi. Jina ‘Wahagri’ limetoholewa badala ya kutafsiriwa.
