  text: Eleazari akamzaa Finehasi; Finehasi akamzaa Abishua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְעָזָר
  choice: Eleazari
  rationale: Jina la mtu limetoholewa kwa umbo la kawaida katika Biblia za Kiswahili, huku likibaki karibu na jina la Kiebrania.
- source_word: הוֹלִיד / הֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, kausativi ya ילד inaonyesha kumzaa au kuwa baba wa mtu; “akamzaa” ni fupi, ya asili katika Kiswahili, na inafaa kwa mfululizo wa nasaba.
- source_word: אֶת
  choice: halijatafsiriwa kwa neno tofauti
  rationale: Ni kiashiria cha yambwa mahususi katika Kiebrania; kazi yake inaonyeshwa na mpangilio na muundo wa kitenzi cha Kiswahili.
- source_word: פִּינְחָס
  choice: Finehasi
  rationale: Jina limetoholewa kwa umbo linalotambulika katika matumizi ya Biblia za Kiswahili na limerudiwa katika kishazi cha pili ili kuhifadhi mfuatano wa nasaba.
- source_word: אֲבִישׁוּעַ
  choice: Abishua
  rationale: Jina la mtu limetoholewa kwa namna iliyo karibu na matamshi ya chanzo na inayoeleweka kwa msomaji wa Kiswahili.
