base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/036.yaml
  text: And Johanan fathered Azariah[a]; he was the one who served as priest in the house that Solomon built in Jerusalem.
translation:
  language: sw
  text: Yohanani alimzaa Azaria; ndiye aliyehudumu kama kuhani katika nyumba[a] ambayo Sulemani aliijenga Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “katika hekalu.” Kiebrania: “katika nyumba,” njia iliyozoeleka ya kurejelea hekalu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹחָנָן
  choice: Yohanani
  rationale: Kiunganishi ו kinawakilishwa kwa mtiririko wa kisimulizi na kitenzi cha mfululizo “akamzaa”; jina יוֹחָנָן limetoholewa kwa umbo la kawaida la Kiswahili “Yohanani.”
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, Hifili ya ילד humaanisha kumzaa au kuwa baba wa mtu. “Akamzaa” ni fupi, ya kawaida, na huhifadhi mlolongo wa nasaba.
- source_word: אֶת עֲזַרְיָה
  choice: Azaria
  rationale: Alama ya yambwa אֶת haitafsiriwi; jina עֲזַרְיָה limetoholewa kama “Azaria.”
- source_word: הוּא אֲשֶׁר
  choice: ndiye aliye
  rationale: Muundo huu unamtambulisha Azaria kwa msisitizo. “Ndiye aliye” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: כִּהֵן
  choice: alitumika kama kuhani
  rationale: Kitenzi כהן kinaeleza kutekeleza huduma ya kikuhani; “alitumika kama kuhani” huhifadhi nguvu yake ya kitenzi bila kuifanya hali tu ya kuwa kuhani.
- source_word: בַּ/בַּיִת
  choice: katika nyumba
  rationale: Kiebrania kinasema kihalisi “katika nyumba.” Muktadha unaonyesha kuwa ni hekalu, lakini matini kuu inadumisha neno la chanzo na tanbihi inafafanua maana yake.
- source_word: אֲשֶׁר בָּנָה שְׁלֹמֹה
  choice: ambayo Sulemani aliijenga
  rationale: Hii ni tafsiri ya kawaida na ya asili ya kishazi rejeshi, huku upatanisho wa “aliijenga” ukirejelea nyumba.
- source_word: בִּ/ירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Jina la mahali limetolewa kwa umbo la kawaida la Kiswahili, na “huko” linaonyesha mahali ambako nyumba ilijengwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi inayofaa maandiko. Muundo “ndiye aliye” umehifadhi msisitizo wa Kiebrania, na “nyumba” imeachwa katika matini kuu ili kutodokeza tafsiri kuliko chanzo.
