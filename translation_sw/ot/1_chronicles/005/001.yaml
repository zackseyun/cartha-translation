  text: וּ/בְנֵ֨י רְאוּבֵ֥ן בְּכֽוֹר יִשְׂרָאֵל֮ כִּ֣י ה֣וּא הַ/בְּכוֹר֒ וּֽ/בְ/חַלְּל/וֹ֙ יְצוּעֵ֣י אָבִ֔י/ו נִתְּנָה֙ בְּכֹ֣רָת֔/וֹ לִ/בְנֵ֥י יוֹסֵ֖ף בֶּן יִשְׂרָאֵ֑ל וְ/לֹ֥א לְ/הִתְיַחֵ֖שׂ לַ/בְּכֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/001.yaml
  text: The sons of Reuben[a], the firstborn of Israel—for he was the firstborn, but because he defiled his father’s bed, his birthright was given to the sons of Joseph son of Israel[b], though not to be enrolled by birthright—
translation:
  language: sw
  text: Wana wa Reubeni, mzaliwa wa kwanza wa Israeli—kwa maana yeye ndiye aliyekuwa mzaliwa wa kwanza; lakini kwa sababu alikinajisi kitanda cha baba yake[a], haki yake ya mzaliwa wa kwanza ikapewa wana wa Yosefu, mwana wa Israeli, lakini bila kuorodheshwa katika nasaba kwa mujibu wa haki ya mzaliwa wa kwanza[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya moja kwa moja, Kiebrania husema “vitanda vya baba yake”; hapa wingi huo ni nahau inayorejelea kitanda cha ndoa.
    reason: lexical_alternative
  - marker: b
    text: Au, “lakini si kuhesabiwa katika nasaba kwa mujibu wa haki ya mzaliwa wa kwanza.” Kishazi hiki kinaonyesha kwamba wana wa Yosefu walipewa haki hiyo bila kufanywa wazaliwa wa kwanza katika mpangilio wa nasaba.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי רְאוּבֵן
  choice: Wana wa Reubeni
  rationale: Muundo huu wa kawaida wa nasaba unawakilisha kirai cha Kiebrania kwa uwazi; kiunganishi waw hakihitaji kuongezewa neno la wakati kama “Sasa” katika Kiswahili.
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: mzaliwa wa kwanza wa Israeli
  rationale: בכור hapa hutaja nafasi ya Reubeni kwa kuzaliwa, na kirai cha Kiswahili ni cha kawaida na sahihi.
- source_word: כִּי הוּא הַבְּכוֹר
  choice: kwa maana yeye ndiye aliyekuwa mzaliwa wa kwanza
  rationale: כִּי kinaanzisha maelezo ya sababu au ufafanuzi; “kwa maana” huhifadhi kazi hiyo bila kufanya kauli iwe nzito kupita kiasi.
- source_word: וּבְחַלְּלוֹ
  choice: lakini kwa sababu alikitia unajisi
  rationale: Kitenzi חלל kina maana ya kunajisi au kuvunjia utakatifu/heshima; muundo wa ב pamoja na kitenzi-jina hapa unaonyesha sababu.
- source_word: יְצוּעֵי אָבִיו
  choice: kitanda cha baba yake
  rationale: Ingawa nomino ya Kiebrania iko katika wingi, ni nahau inayorejelea kitanda cha ndoa cha baba; umoja ni wa asili katika Kiswahili.
- source_word: נִתְּנָה בְּכֹרָתוֹ
  choice: haki yake ya mzaliwa wa kwanza ikapewa
  rationale: בכורה hapa ni hadhi na manufaa yanayoambatana na kuwa mzaliwa wa kwanza, si mpangilio wa kuzaliwa pekee.
- source_word: לִבְנֵי יוֹסֵף בֶּן יִשְׂרָאֵל
  choice: wana wa Yosefu mwana wa Israeli
  rationale: Tafsiri hii huhifadhi maelezo ya wazi ya nasaba yaliyomo katika Kiebrania.
- source_word: וְלֹא לְהִתְיַחֵשׂ לַבְּכֹרָה
  choice: lakini bila kuorodheshwa katika nasaba kwa mujibu wa haki ya mzaliwa wa kwanza
  rationale: התיחשׂ ni istilahi ya kuandikishwa au kuhesabiwa kwa nasaba. Muundo usiotaja mtendaji wazi huhifadhi ufupi na kiasi cha utata wa Kiebrania kuhusu uhusiano sahihi wa kishazi hiki.
theological_decisions:
- issue: Tofauti kati ya kuzaliwa kwanza kwa Reubeni na kuhamishwa kwa haki zake
  choice: Reubeni anaendelea kutajwa kuwa mzaliwa wa kwanza kwa kuzaliwa, huku haki ya mzaliwa wa kwanza ikihamishiwa kwa wana wa Yosefu; kishazi cha mwisho kinaonyesha kwamba uhamisho huo haukubadili moja kwa moja mpangilio wa kuorodheshwa kwa nasaba.
  alternative: Kusema kwamba Yosefu au wanawe walichukua nafasi ya Reubeni kama wazaliwa wa kwanza katika kila maana.
  rationale: Andiko lenyewe linadumisha mvutano kati ya cheo cha kuzaliwa, haki zinazohusiana nacho, na uorodheshaji wa nasaba; tafsiri haipaswi kuvifanya kuwa jambo moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina “Reubeni” na “Yosefu” yanafuata matumizi yaliyozoeleka katika Biblia za Kiswahili. Alama ya mwisho ya mstari mrefu imehifadhiwa kwa kuwa aya hii ni mwanzo wa sentensi inayoendelea.
