  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: אֶת
  choice: '[halikutafsiriwa kivyake]'
  rationale: Ni kiashiria cha yambwa mahususi katika Kiebrania; kazi yake imewakilishwa na muundo wa sentensi ya Kiswahili.
- source_word: אֲמַרְיָה
  choice: Amaria
  rationale: Jina la mtu limetoholewa kwa uthabiti kulingana na matumizi ya Kiswahili.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Ni kitenzi kilekile ילד katika Hifili kinachotumiwa kama kauli ya nasaba; kimetafsiriwa kwa uthabiti kuwa “akamzaa.”
- source_word: אֲחִיטוּב
  choice: Ahitubu
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa matamshi na maumbo ya Kiswahili.
