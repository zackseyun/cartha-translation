base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/007.yaml
  text: 'And his brothers by their clans[a], in the genealogy of their generations: the chief was Jeiel, and Zechariah.'
translation:
  language: sw
  text: 'Na ndugu zake kwa koo zao, walipoandikishwa katika nasaba kulingana na vizazi vyao: mkuu alikuwa Yeieli, na Zekaria.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶחָיו
  choice: Na ndugu zake
  rationale: Neno אָח katika muktadha wa nasaba linaweza kumaanisha ndugu au jamaa wa kiume; “ndugu zake” ni tafsiri ya moja kwa moja na ya asili katika Kiswahili huku ikibaki na upana unaofaa.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: kwa koo zao
  rationale: מִשְׁפָּחָה katika orodha za kikabila humaanisha koo, si familia za nyumbani tu. Ingawa kiambishi cha Kiebrania ni nafsi ya tatu umoja wa kiume, maana yake hapa inawahusu ndugu hao kwa mgawanyo wa koo zao.
- source_word: בְּהִתְיַחֵשׂ
  choice: walipoandikishwa katika nasaba
  rationale: Hitpaeli ya יחס katika Mambo ya Nyakati hueleza kuhesabiwa au kuandikishwa kwa msingi wa nasaba. Kishazi cha wakati ni cha kawaida katika Kiswahili na kinaendeleza maana hiyo.
- source_word: לְתֹלְדוֹתָם
  choice: kulingana na vizazi vyao
  rationale: תּוֹלְדוֹת hapa huelekeza kwenye vizazi au mistari ya ukoo. “Kulingana na vizazi vyao” huhifadhi muundo na maana ya kumbukumbu za kizazi.
- source_word: הָרֹאשׁ
  choice: mkuu alikuwa
  rationale: רֹאשׁ inaweza kumaanisha kichwa, mkuu, au kiongozi. Katika orodha hii “mkuu” inaeleza wazi cheo au nafasi ya uongozi.
- source_word: יְעִיאֵל
  choice: Yeieli
  rationale: Jina limetoholewa kwa tahajia inayotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וּזְכַרְיָהוּ
  choice: na Zekaria
  rationale: Jina limetoholewa kwa umbo linalotambulika na kutumika kwa kawaida katika Kiswahili.
