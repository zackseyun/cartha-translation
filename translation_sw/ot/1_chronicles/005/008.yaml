base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/008.yaml
  text: and Bela son of Azaz[a], son of Shema, son of Joel; he lived in Aroer, as far as Nebo and Baal-meon.
translation:
  language: sw
  text: Naye Bela, mwana wa Azazi, mwana wa Shema, mwana wa Yoeli, ndiye aliyekaa[a] Aroeri mpaka Nebo na Baal-meoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliishi”; neno la Kiebrania hapa linaonyesha kukaa au kuishi mahali fulani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֶלַע
  choice: na Bela
  rationale: Kiunganishi ו kimedumishwa ili kuendeleza orodha ya nasaba; jina limetoholewa kwa kawaida ya Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika nasaba, בן kwa kawaida huonyesha uhusiano wa mwana au ukoo; “mwana wa” linadumisha muundo rasmi bila kudai zaidi ya muktadha.
- source_word: עָזָז
  choice: Azazi
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kiasili katika Kiswahili.
- source_word: שֶׁמַע
  choice: Shema
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa.
- source_word: יוֹאֵל
  choice: Yoeli
  rationale: Jina la mtu limetoholewa kwa umbo la Kiswahili linalotumika kwa kawaida.
- source_word: הוּא
  choice: Yeye
  rationale: Kiwakilishi huru kinaendeleza na kutilia mkazo mhusika baada ya mlolongo wa nasaba.
- source_word: יוֹשֵׁב
  choice: aliishi
  rationale: Kitenzi-shirikishi cha Kiebrania kinaonyesha kukaa au kuishi mahali; “aliishi” ni Kiswahili cha sasa, cha kawaida na kinachofaa taarifa hii ya makazi.
- source_word: בַּ/עֲרֹעֵר
  choice: Aroeri
  rationale: Kiambishi cha mahali -i kinaonyesha makazi ndani au katika eneo la mji kwa Kiswahili cha kawaida.
- source_word: וְ/עַד
  choice: hadi
  rationale: Neno hili linaonyesha mpaka au upeo wa eneo kuanzia Aroeri kuelekea maeneo yanayotajwa.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Jina la mahali limetoholewa.
- source_word: וּ/בַעַל מְעוֹן
  choice: na Baal-Meoni
  rationale: Kiunganishi kimedumishwa katika orodha ya maeneo, na jina la mahali limetoholewa kama jina ambatani.
