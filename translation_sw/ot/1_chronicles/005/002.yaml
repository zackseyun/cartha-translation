base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/002.yaml
  text: For Judah prevailed over his brothers[a], and from him came the ruler, though the birthright belonged to Joseph.
translation:
  language: sw
  text: Kwa maana Yuda alikuwa na nguvu kuliko ndugu zake, na kiongozi[a] alitoka kwake; lakini haki ya mzaliwa wa kwanza ilikuwa ya Yosefu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtawala” au “mkuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaanzisha maelezo ya yaliyotangulia kuhusu kupoteza kwa Reubeni hadhi ya mzaliwa wa kwanza.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: גָּבַר בְּאֶחָיו
  choice: alikuwa na nguvu kuliko ndugu zake
  rationale: Kitenzi גבר kinaonyesha kuwa na nguvu au kupata ukuu; pamoja na בְּ kinaeleza ubora wa Yuda kwa kulinganishwa na ndugu zake.
- source_word: וּלְנָגִיד מִמֶּנּוּ
  choice: na kiongozi alitoka kwake
  rationale: נָגִיד humaanisha kiongozi, mtawala, au mkuu. Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba uongozi ulitokea katika ukoo wa Yuda bila kumtaja kiongozi fulani.
- source_word: וְהַבְּכֹרָה לְיוֹסֵף
  choice: lakini haki ya mzaliwa wa kwanza ilikuwa ya Yosefu
  rationale: בְּכֹרָה ni hadhi na haki inayomhusu mzaliwa wa kwanza. 'Lakini' inaonyesha utofauti kati ya ukuu wa Yuda na haki iliyokuwa ya Yosefu.
theological_decisions:
- issue: Uhusiano kati ya ukuu wa Yuda na haki ya Yosefu ya mzaliwa wa kwanza
  choice: Kutofautisha uongozi uliotoka kwa Yuda na haki ya mzaliwa wa kwanza iliyokuwa ya Yosefu.
  alternative: Kusema kwa ujumla tu kwamba Yuda alikuwa mkuu huku Yosefu akiwa na mapendeleo ya urithi.
  rationale: Kiebrania kinaweka mambo hayo mawili sambamba lakini hakiyafanyi kuwa kitu kimoja; tafsiri inahifadhi mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni wazi kwa msomaji wa kawaida huku ikihifadhi tofauti kati ya nguvu ya Yuda, uongozi uliotoka kwake, na haki ya Yosefu.
