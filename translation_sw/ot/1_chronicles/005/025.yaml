base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/025.yaml
  text: But they acted unfaithfully against the God of their fathers and prostituted themselves after the gods of the peoples of the land[b][a], whom God had destroyed before them.
translation:
  language: sw
  text: Lakini walikosa uaminifu kwa Mungu wa baba zao, wakafanya uasherati kwa kufuata miungu ya watu wa nchi[a]—watu ambao Mungu alikuwa amewaangamiza mbele yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakafanya ukahaba kwa kufuata.” Kiebrania hutumia sitiari ya kingono kueleza ibada ya sanamu na kuvunja uaminifu wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ
  choice: walikosa uaminifu
  rationale: Kitenzi מעל kinaonyesha kuvunja uaminifu katika uhusiano wa agano; usemi huu ni wa kawaida na unaeleweka bila kuufanya kuwa kosa la jumla tu.
- source_word: בֵּאלֹהֵי אֲבוֹתֵיהֶם
  choice: kwa Mungu wa baba zao
  rationale: Kihusishi ב pamoja na מעל humtaja yule ambaye uaminifu umevunjwa dhidi yake. Kiswahili cha kawaida hutumia ‘kukosa uaminifu kwa’.
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: wakafanya ukahaba kwa kuifuata
  rationale: זנה ni sitiari ya kingono ya kutokuwa waaminifu kwa agano kwa njia ya ibada ya sanamu, na אַחֲרֵי huonyesha kuwafuata hao miungu. Tafsiri hii inadumisha sitiari na wazo la kufuata.
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: miungu ya watu wa nchi
  rationale: Hii inafuata mnyororo wa nomino wa Kiebrania na kuwakilisha עַמֵּי kama ‘watu’ katika muktadha huu wa wenyeji wa nchi.
- source_word: אֲשֶׁר הִשְׁמִיד אֱלֹהִים מִפְּנֵיהֶם
  choice: watu ambao Mungu alikuwa amewaangamiza mbele yao
  rationale: Kishazi rejeshi kinawarejelea watu wa nchi. ‘Alikuwa amewaangamiza’ huonyesha kwamba tendo hilo lilitangulia ukosefu wao wa uaminifu, na ‘mbele yao’ huhifadhi picha ya מִפְּנֵיהֶם.
theological_decisions:
- issue: Kudumisha sitiari ya kingono kuhusu ibada ya sanamu
  choice: wakafanya ukahaba kwa kuifuata miungu
  alternative: wakakosa uaminifu kwa kumfuata miungu
  rationale: Kiebrania kinatumia kwa makusudi lugha ya ukahaba kuonyesha uzito wa kuvunja agano. Kuibadilisha kuwa ukosefu wa uaminifu pekee kungepunguza nguvu ya sitiari hiyo.
- issue: Maana ya אֱלֹהִים katika kishazi rejeshi
  choice: Mungu
  alternative: miungu
  rationale: Ingawa umbo la nomino linaweza kuwa la wingi, kitenzi הִשְׁמִיד ni cha umoja na humtaja Mungu mmoja aliyewaangamiza watu hao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Walikuwa wamekosa’ limeepukwa kwa kuwa mfululizo wa simulizi unahitaji wakati uliopita rahisi, huku ‘alikuwa amewaangamiza’ ukionyesha tendo lililotangulia. Alama ya mkato imetumiwa kufafanua wazi kwamba kishazi rejeshi kinawahusu watu, si miungu.
