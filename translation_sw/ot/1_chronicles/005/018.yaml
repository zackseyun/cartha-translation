source:
  edition: WLC
  text: בְּנֵֽי רְאוּבֵ֨ן וְ/גָדִ֜י וַ/חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁה֮ מִן בְּנֵי חַיִל֒ אֲ֠נָשִׁים נֹשְׂאֵ֨י מָגֵ֤ן וְ/חֶ֨רֶב֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת וּ/לְמוּדֵ֖י מִלְחָמָ֑ה אַרְבָּעִ֨ים וְ/אַרְבָּעָ֥ה אֶ֛לֶף וּ/שְׁבַע מֵא֥וֹת וְ/שִׁשִּׁ֖ים יֹצְאֵ֥י צָבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/018.yaml
  text: The sons of Reuben and the Gadites and the half-tribe of Manasseh[a], valiant men, men who carried shield and sword, who drew the bow, and who were trained for war, were forty-four thousand seven hundred sixty[c][b], able to go out to war.
translation:
  language: sw
  text: Wana wa Reubeni, Wagadi, na nusu ya kabila la Manase walikuwa mashujaa[a], watu waliobeba ngao na upanga, waliovuta upinde[b], na waliozoezwa vita; walikuwa 44,760 walio tayari kwenda vitani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wenye nguvu” au “watu mashujaa.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “walioukanyaga upinde”; ni nahau ya Kiebrania inayomaanisha kuupinda upinde ili kupiga mshale.
    reason: cultural_note
  - marker: c
    text: Au “waliostahili utumishi wa kijeshi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רְאוּבֵן
  choice: Wana wa Reubeni
  rationale: Inahifadhi wazi lugha ya undugu ya Kiebrania בְּנֵי, huku ikibaki ya kawaida na inayoeleweka katika Kiswahili.
- source_word: וְגָדִי
  choice: Wagadi
  rationale: Umbo la Kiebrania ni jina la watu wa kabila la Gadi, si jina la Gadi kama mtu mmoja.
- source_word: וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: na watu wa nusu ya kabila la Manase
  rationale: Neno “watu wa” limewekwa wazi kwa Kiswahili cha kawaida ili orodha yote irejelee watu, huku “nusu ya kabila la Manase” ikihifadhi maana ya muundo wa Kiebrania.
- source_word: מִן בְּנֵי חַיִל
  choice: mashujaa hodari
  rationale: Katika muktadha huu wa kijeshi, kirai hiki kinaeleza wanaume wenye uwezo, nguvu, na ushujaa; “mashujaa hodari” huwasilisha maana hiyo kwa lugha ya sasa.
- source_word: נֹשְׂאֵי מָגֵן וְחֶרֶב
  choice: waliobeba ngao na upanga
  rationale: Tafsiri hii inahifadhi tendo halisi la kubeba pamoja na taswira mahususi ya vifaa vya kijeshi.
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: walioweza kuvuta upinde
  rationale: Kirai cha Kiebrania kwa halisi huhusisha kuukanyaga au kuupinda upinde; Kiswahili “kuvuta upinde” huwasilisha kwa kawaida tendo la kuutayarisha ili kupiga mshale bila kukifanya kuwa nomino “wapiga mishale.”
- source_word: וּלְמוּדֵי מִלְחָמָה
  choice: waliozoezwa vita
  rationale: Huhifadhi hali ya kuwa wamefundishwa au kuzoeshwa kwa ajili ya mapigano.
- source_word: אַרְבָּעִים וְאַרְבָּעָה אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: 44,760
  rationale: Tarakimu hufanya idadi ndefu isomeke kwa urahisi bila kubadili thamani yake.
- source_word: יֹצְאֵי צָבָא
  choice: waliofaa kwenda vitani
  rationale: Kirai hiki cha kijeshi kinawahusu watu waliostahili au waliokuwa tayari kushiriki katika kampeni ya vita; uchaguzi huu unahifadhi picha ya “kwenda vitani” na pia maana ya kustahili huduma hiyo.
