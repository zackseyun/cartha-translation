translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Sentensi imegawanywa mara mbili ili orodha ndefu ya sifa ibaki wazi. Neno “vita” limetumiwa badala ya istilahi nzito za kitaalamu, na taswira za ngao, upanga, na upinde zimehifadhiwa.
