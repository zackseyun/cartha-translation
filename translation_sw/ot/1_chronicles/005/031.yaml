  text: Abishua akamzaa Buki, naye Buki akamzaa Uzi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲבִישׁוּעַ
  choice: Abishua
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, kausativi ya ילד humaanisha kumzaa au kuwa baba wa mtu; “akamzaa” ni ya kawaida, fupi, na inafaa mfululizo wa nasaba.
- source_word: אֶת
  choice: '[halijatafsiriwa]'
  rationale: Ni kiashiria cha yambwa mahususi katika Kiebrania na hakihitaji neno linalolingana nalo katika Kiswahili.
- source_word: בֻּקִּי
  choice: Buki
  rationale: Jina la mtu limetoholewa kwa Kiswahili kwa konsonanti moja ya k, kwa kuwa Kiswahili hakionyeshi uradidi wa konsonanti wa Kiebrania kwa tahajia mbili.
- source_word: וּ/בֻקִּי
  choice: naye Buki
  rationale: Kiunganishi ו kimewasilishwa kwa “naye,” kinachounganisha hatua za nasaba kwa Kiswahili cha asili huku kikimweka Buki kuwa kiima cha kishazi kinachofuata.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Kitenzi cha nasaba kimerudiwa kwa namna ileile ili kudumisha uwazi na ulinganifu.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Jina la mtu limetoholewa kwa Kiswahili bila konsonanti maradufu, kulingana na mfumo wa tahajia ya Kiswahili.
