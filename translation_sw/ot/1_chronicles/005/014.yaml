base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/014.yaml
  text: These were the sons of Abihail son of Huri[a], son of Jaroah, son of Gilead, son of Michael, son of Jeshishai, son of Jahdo, son of Buz.
translation:
  language: sw
  text: Hawa walikuwa wana wa Abihaili mwana wa Huri,[a] mwana wa Yaroa, mwana wa Gileadi, mwana wa Mikaeli, mwana wa Yeshishai, mwana wa Yahdo, mwana wa Buzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno ya Kiebrania “wana wa” na “mwana wa” yanayorudiwa yanaweza kutaja ukoo kwa ujumla; si lazima kila kizazi kiwe kimetajwa moja baada ya kingine.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hawa walikuwa
  rationale: Kiwakilishi cha wingi kinaanzisha orodha ya ukoo; wakati uliopita unasomeka kwa kawaida katika simulizi hili.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Huhifadhi maana ya moja kwa moja na muundo rasmi wa nasaba, huku tanbihi ikieleza uwezekano wa maana pana ya kiukoo.
- source_word: אֲבִיחַיִל
  choice: Abihaili
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huhifadhi mnyororo wa nasaba unaorudiwa katika Kiebrania bila kudai kwamba lazima kila kizazi kimetajwa.
- source_word: חוּרִי
  choice: Huri
  rationale: Utohozi wa karibu wa jina la Kiebrania.
- source_word: יָרוֹחַ
  choice: Yaroa
  rationale: Utohozi unaowakilisha yod ya mwanzo na sauti ya mwisho ya ח kwa namna inayosomeka katika Kiswahili.
- source_word: גִּלְעָד
  choice: Gileadi
  rationale: Umbo la jina lililozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: מִיכָאֵל
  choice: Mikaeli
  rationale: Umbo la Kiswahili lililozoeleka la jina hili.
- source_word: יְשִׁישַׁי
  choice: Yeshishai
  rationale: Utohozi unaohifadhi kwa karibu konsonanti na vokali za jina la Kiebrania.
- source_word: יַחְדּוֹ
  choice: Yahdo
  rationale: Utohozi unaosomeka unaohifadhi yod ya mwanzo na mkusanyiko wa konsonanti wa jina.
- source_word: בּוּז
  choice: Buzi
  rationale: Utohozi wa jina kwa muundo unaotamkika kwa urahisi katika Kiswahili.
