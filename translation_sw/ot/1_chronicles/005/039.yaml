  text: And Shallum fathered Hilkiah, and Hilkiah fathered Azariah.
translation:
  language: sw
  text: Shalumu akamzaa Hilkia, naye Hilkia akamzaa Azaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ
  choice: -ka- / naye
  rationale: Kiunganishi cha Kiebrania huendeleza orodha ya ukoo. Katika sentensi ya kwanza kimewakilishwa kwa mfuatano wa kitenzi “akamzaa,” na katika ya pili kwa “naye,” ili Kiswahili kiwe cha kawaida bila kupoteza uhusiano wa vipashio.
- source_word: שַׁלּוּם
  choice: Shalumu
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika muktadha wa ukoo, Hiphil ya ילד humaanisha kumzaa au kuwa baba wa mtu. “Akamzaa” ni fupi, ya kawaida, na inadumisha mstari wa ukoo unaotajwa.
- source_word: אֶת
  choice: '[halijatafsiriwa moja kwa moja]'
  rationale: Ni kiashiria cha yambwa mahsusi kisicho na maana huru ya kileksika; mpangilio na kiambishi cha yambwa “-m-” katika kitenzi vinawakilisha kazi yake.
- source_word: חִלְקִיָּה
  choice: Hilkia
  rationale: Jina limetoholewa kwa umbo la kawaida na linalosomeka katika Kiswahili.
- source_word: עֲזַרְיָה
  choice: Azaria
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili, bila kutafsiri maana ya jina.
