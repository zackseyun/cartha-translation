  register: Kiswahili sanifu cha Afrika Mashariki; mtindo mfupi na wenye hadhi unaofaa orodha ya ukoo. “Akamzaa” limetumiwa mara zote mbili kwa uthabiti, huku “naye” likifanya hatua ya pili isomeke kwa urahisi.
