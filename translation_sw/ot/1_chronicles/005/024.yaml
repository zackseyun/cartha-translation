  text: וְ/אֵ֖לֶּה רָאשֵׁ֣י בֵית אֲבוֹתָ֑/ם וְ/עֵ֡פֶר וְ/יִשְׁעִ֡י וֶ/אֱלִיאֵ֡ל וְ֠/עַזְרִיאֵל וְ/יִרְמְיָ֨ה וְ/הוֹדַוְיָ֜ה וְ/יַחְדִּיאֵ֗ל אֲנָשִׁים֙ גִּבּ֣וֹרֵי חַ֔יִל אַנְשֵׁ֣י שֵׁמ֔וֹת רָאשִׁ֖ים לְ/בֵ֥ית אֲבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/024.yaml
  text: 'These were the heads of their fathers’ houses: Epher[a], Ishi, Eliel, Azriel, Jeremiah, Hodaviah, and Jahdiel, mighty men of valor, men of renown[b], heads of their fathers’ houses.'
translation:
  language: sw
  text: 'Hawa ndio waliokuwa wakuu wa koo za baba zao[a]: Eferi, Ishi, Elieli, Azrieli, Yeremia, Hodavia na Yahdieli. Walikuwa mashujaa hodari, watu mashuhuri[b], na wakuu wa koo za baba zao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, vikundi vya kifamilia vilivyotokana na baba au babu mmoja.
    reason: cultural_note
  - marker: b
    text: 'Kiebrania: “watu wa majina,” yaani, watu mashuhuri au wenye sifa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Hawa ndio waliokuwa
  rationale: Hutambulisha orodha ya watu kwa namna ya kawaida katika Kiswahili, huku kiunganishi cha Kiebrania kikimezwa kiasili katika mwanzo wa taarifa.
- source_word: רָאשֵׁי בֵית אֲבוֹתָם
  choice: wakuu wa koo za baba zao
  rationale: Neno hili linahusu vikundi vya kifamilia vilivyotokana na babu mmoja. “Koo za baba zao” linaeleweka katika Kiswahili na linahifadhi muundo wa kijamii wa matini ya Kiebrania.
- source_word: עֵפֶר
  choice: Eferi
  rationale: Jina limetoholewa kwa mfumo wa sauti na tahajia unaosomeka kwa urahisi katika Kiswahili, bila kulichanganya na jina jingine linalofanana.
- source_word: יִשְׁעִי
  choice: Ishi
  rationale: Utohozi wa karibu wa jina la Kiebrania kwa tahajia ya Kiswahili.
- source_word: אֱלִיאֵל
  choice: Elieli
  rationale: Umbo la Kiswahili linalofuata kwa karibu matamshi ya jina la Kiebrania.
- source_word: עַזְרִיאֵל
  choice: Azrieli
  rationale: Utohozi wa moja kwa moja na unaosomeka kwa urahisi katika Kiswahili.
- source_word: יִרְמְיָה
  choice: Yeremia
  rationale: Umbo la jina lililozoeleka katika Biblia za Kiswahili.
- source_word: הוֹדַוְיָה
  choice: Hodavia
  rationale: Utohozi wa kihafidhina unaofuata umbo la jina katika mstari huu.
- source_word: יַחְדִּיאֵל
  choice: Yahdieli
  rationale: Utohozi unaohifadhi konsonanti kuu za jina la Kiebrania na kufaa mfumo wa sauti wa Kiswahili.
- source_word: אֲנָשִׁים גִּבּוֹרֵי חַיִל
  choice: mashujaa hodari
  rationale: Kirai hiki cha kawaida huonyesha nguvu, ujasiri na uwezo wa kivita. “Mashujaa hodari” ni cha asili na chenye uzito katika Kiswahili.
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: watu mashuhuri
  rationale: Hii ni nahau yenye maana halisi ya “watu wa majina,” ikimaanisha watu waliojulika na kuheshimiwa.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: wakuu wa koo za baba zao
  rationale: Marudio ya hadhi yao mwishoni mwa mstari yamehifadhiwa badala ya kufupishwa, kwa kuwa yapo wazi katika Kiebrania.
