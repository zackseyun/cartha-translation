lexical_decisions:
- source_word: אֲחִיטוּב
  choice: Ahitubu
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili na kupewa irabu ya mwisho ili litamkike kwa urahisi.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, Hifili ya ילד humaanisha kumzaa au kuwa baba wa mtu. ‘Akamzaa’ ni fupi, ya kawaida, na inaendeleza mfuatano wa nasaba.
- source_word: אֶת
  choice: '[halijatafsiriwa moja kwa moja]'
  rationale: Ni kiashiria cha yambwa mahsusi katika Kiebrania; kazi yake imewakilishwa na muundo wa kisarufi wa Kiswahili.
- source_word: צָדוֹק
  choice: Sadoki
  rationale: Jina la mtu limetoholewa kwa namna inayofaa mfumo wa sauti wa Kiswahili.
- source_word: וְ
  choice: na
  rationale: Kiunganishi rahisi kinachounganisha vifungu viwili vya nasaba.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Kitenzi cha nasaba kilichorudiwa kimetafsiriwa kwa uthabiti kama katika kifungu cha kwanza.
- source_word: אֲחִימָעַץ
  choice: Ahimaasi
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayoeleweka katika Kiswahili.
