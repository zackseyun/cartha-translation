base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/017.yaml
  text: All of them were enrolled by genealogy in the days of Jotham king of Judah[a], and in the days of Jeroboam king of Israel.
translation:
  language: sw
  text: Wote waliandikishwa katika orodha ya nasaba[a] katika siku za Yothamu, mfalme wa Yuda, na katika siku za Yeroboamu, mfalme wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliandikishwa kwa nasaba” au “walihesabiwa kwa nasaba.” Kitenzi cha Kiebrania kinamaanisha kuingizwa katika kumbukumbu ya nasaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Wote
  rationale: Neno hili linaonyesha jumla pamoja na kiambishi cha nafsi ya tatu wingi; “Wote” ni usemi wa kawaida wa Kiswahili unaohifadhi maana hiyo.
- source_word: הִתְיַחְשׂוּ
  choice: waliandikishwa katika orodha ya nasaba
  rationale: Hitpaeli ya יחשׂ katika Mambo ya Nyakati hurejelea watu kuingizwa au kuhesabiwa katika kumbukumbu za ukoo; tafsiri hii inaeleza kwa uwazi tendo la kiutawala na muktadha wa nasaba.
- source_word: בִּימֵי
  choice: katika siku za
  rationale: Huhifadhi nahau ya wakati ya Kiebrania bila kuifanya isieleweke katika Kiswahili.
- source_word: יוֹתָם
  choice: Yothamu
  rationale: Jina limeandikwa kwa umbo lililozoeleka katika mapokeo ya Biblia ya Kiswahili.
- source_word: מֶלֶךְ יְהוּדָה
  choice: mfalme wa Yuda
  rationale: Ni tafsiri ya moja kwa moja ya muundo wa nomino tegemezi.
- source_word: וּבִימֵי
  choice: na katika siku za
  rationale: Kurudiwa kwa kirai cha wakati kumehifadhiwa ili kuendeleza usambamba na usahihi wa matini ya Kiebrania.
- source_word: יָרָבְעָם
  choice: Yeroboamu
  rationale: Jina limeandikwa kwa umbo lililozoeleka katika mapokeo ya Biblia ya Kiswahili.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: mfalme wa Israeli
  rationale: Ni tafsiri ya moja kwa moja ya muundo wa nomino tegemezi.
