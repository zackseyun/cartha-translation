source:
  edition: WLC
  text: וּ/בְנֵ֗י חֲצִי֙ שֵׁ֣בֶט מְנַשֶּׁ֔ה יָשְׁב֖וּ בָּ/אָ֑רֶץ מִ/בָּשָׁ֞ן עַד בַּ֧עַל חֶרְמ֛וֹן וּ/שְׂנִ֥יר וְ/הַר חֶרְמ֖וֹן הֵ֥מָּה רָבֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/023.yaml
  text: And the sons of the half-tribe of Manasseh lived in the land from Bashan as far as Baal-hermon[a], Senir, and Mount Hermon[b]; they became numerous.
translation:
  language: sw
  text: Nao wazao wa nusu ya kabila la Manase waliishi katika nchi kuanzia Bashani mpaka Baal-Hermoni, Seniri, na Mlima Hermoni[b]; nao waliongezeka kwa idadi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakawa wengi” au “wakaongezeka.” Kitenzi cha Kiebrania kinakazia kuongezeka kwa idadi.
    reason: lexical_alternative
  - marker: b
    text: Baal-Hermoni, Seniri, na Mlima Hermoni ni majina ya maeneo yanayoonyesha mpaka wa kaskazini wa nchi hiyo.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: Nao wazao wa
  rationale: Katika muktadha wa kikabila, בְּנֵי humaanisha wana, wazao, au watu wa kundi hilo. “Wazao wa” huhifadhi dhana ya nasaba kwa Kiswahili cha kawaida bila kudokeza kwamba wanaume wa kizazi kimoja tu ndio wanaotajwa.
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: nusu ya kabila la Manase
  rationale: Kirai hiki kinataja sehemu iliyotambuliwa ya kabila la Manase. Muundo huu ni wazi na wa kawaida katika Kiswahili.
- source_word: יָשְׁבוּ
  choice: waliishi
  rationale: Kitenzi hiki kinaweza kumaanisha kukaa, kuishi, au kufanya makao. Hapa kinaeleza kuishi kwao katika eneo hilo, hivyo “waliishi” ni sahihi na ya asili.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: אֶרֶץ hapa ni nchi au eneo walilokalia. “Katika nchi” huhifadhi usemi mpana wa Kiebrania.
- source_word: מִבָּשָׁן עַד
  choice: kuanzia Bashani mpaka
  rationale: Jozi ya vihusishi inaonyesha mipaka ya kijiografia kutoka Bashani hadi maeneo ya kaskazini yaliyotajwa.
- source_word: בַּעַל חֶרְמוֹן
  choice: Baal-Hermoni
  rationale: Jina la mahali limetoholewa kwa tahajia inayoeleweka katika Kiswahili; kistari huonyesha kuwa ni jina ambatani.
- source_word: וּשְׂנִיר
  choice: Seniri
  rationale: Jina la mahali limetoholewa kwa kufuata matamshi ya Kiebrania kwa namna inayofaa Kiswahili.
- source_word: וְהַר חֶרְמוֹן
  choice: na Mlima Hermoni
  rationale: הַר humaanisha mlima; kirai hiki ni jina la kijiografia linalojulikana kama Mlima Hermoni.
- source_word: הֵמָּה רָבוּ
  choice: nao waliongezeka kwa idadi
  rationale: רבה katika hali hii hueleza kuwa wengi au kuongezeka kwa idadi. Kiwakilishi הֵמָּה kina mkazo, unaowakilishwa na “nao.”
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaosomeka kwa urahisi. “Wazao” huepuka ukakasi wa “wana wa nusu ya kabila” huku ikihifadhi muktadha wa nasaba na kabila. Alama za tanbihi zimewekwa kwenye vifungu vinavyohusika moja kwa moja.
