  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁבּ֣וּ מִקְנֵי/הֶ֗ם גְּֽמַלֵּי/הֶ֞ם חֲמִשִּׁ֥ים אֶ֨לֶף֙ וְ/צֹ֗אן מָאתַ֤יִם וַ/חֲמִשִּׁים֙ אֶ֔לֶף וַ/חֲמוֹרִ֖ים אַלְפָּ֑יִם וְ/נֶ֥פֶשׁ אָדָ֖ם מֵ֥אָה אָֽלֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/021.yaml
  text: 'They captured their livestock: 50,000 camels[a], 250,000 sheep, 2,000 donkeys, and 100,000 people.'
translation:
  language: sw
  text: Waliteka mifugo yao—ngamia wao 50,000, kondoo 250,000, na punda 2,000—pamoja na watu 100,000[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “nafsi ya mwanadamu” (נֶפֶשׁ אָדָם), yaani watu 100,000 waliotekwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: Waliteka
  rationale: Kitenzi שׁבה humaanisha kuteka au kuchukua mateka/nyara; ‘waliteka’ kinaweza kutumiwa kwa wanyama na watu katika muktadha huu.
- source_word: מִקְנֵיהֶם
  choice: mifugo yao
  rationale: מִקְנֶה hapa inaelekezwa na orodha inayofuata ya ngamia, kondoo, na punda, kwa hiyo ‘mifugo’ ndiyo maana inayofaa.
- source_word: גְּמַלֵּיהֶם
  choice: ngamia wao
  rationale: Huhifadhi kiambishi cha umilikaji kilicho wazi katika Kiebrania.
- source_word: וְצֹאן
  choice: kondoo
  rationale: צֹאן ni jina la jumla la mifugo midogo, hasa kondoo na wakati mwingine mbuzi; ‘kondoo’ ni tafsiri ya kawaida na inayofaa katika orodha hii.
- source_word: וַחֲמוֹרִים
  choice: punda
  rationale: Ni neno la kawaida la Kiswahili cha sasa kwa wanyama hawa.
- source_word: וְנֶפֶשׁ אָדָם
  choice: watu
  rationale: Kirai hiki, kwa neno halisi ‘nafsi ya mwanadamu,’ kinawahesabu wanadamu mmoja mmoja; ‘watu’ ni Kiswahili cha kawaida, huku tanbihi ikihifadhi muundo wa asili.
- source_word: מֵאָה אָלֶף
  choice: 100,000
  rationale: Tarakimu zimetumiwa kwa uwazi na ulinganifu na idadi nyingine katika mstari.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wazi, na wenye heshima. Mistari mirefu imetenga mifugo na watu ili orodha isitoe maana kwamba watu ni sehemu ya mifugo, bila kubadili kitenzi kimoja kinachotawala vitu vyote katika Kiebrania.
