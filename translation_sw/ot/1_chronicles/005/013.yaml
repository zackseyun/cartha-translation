base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/013.yaml
  text: 'And their brothers[a], according to their fathers’ houses: Michael, Meshullam, Sheba, Jorai, Jachan, Zia[d][c][b], and Eber—seven.'
translation:
  language: sw
  text: Nao ndugu zao[a], kwa nyumba za baba zao[b], walikuwa Mikaeli, Meshulamu, Sheba, Yorai, Yaakani, Zia[c], na Eberi—walikuwa saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa ukoo wao”; katika orodha za nasaba, neno la Kiebrania linalomaanisha “ndugu” linaweza pia kuwahusu jamaa wa ukoo kwa upana zaidi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “kwa nyumba za baba zao,” yaani kwa koo au jamaa zilizohesabiwa kwa upande wa baba.
    reason: cultural_note
  - marker: c
    text: Baadhi ya mapokeo ya maandishi au unukuzi huandika jina hili “Ziza.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Nao ndugu zao
  rationale: Neno la Kiebrania kimsingi humaanisha ndugu, lakini katika orodha za nasaba linaweza kuwahusu pia watu wa ukoo; tafsiri ya moja kwa moja imehifadhiwa na maana pana imeelezwa katika tanbihi.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: kwa kufuata jamaa za baba zao
  rationale: Usemi huu unaonyesha upangaji kwa nyumba au koo za upande wa baba. 'Jamaa za baba zao' ni Kiswahili cha sasa kinachoeleweka bila kupoteza muundo wa kijamii wa asili.
- source_word: מִיכָאֵל
  choice: Mikaeli
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: וּמְשֻׁלָּם
  choice: Meshulamu
  rationale: Unukuzi wa jina la Kiebrania unaofaa matamshi na tahajia ya Kiswahili.
- source_word: וְשֶׁבַע
  choice: Sheba
  rationale: Hapa neno limechukuliwa kuwa jina la mtu katika orodha; tahajia inakaribia umbo la Kimasora.
- source_word: וְיוֹרַי
  choice: Yorai
  rationale: Unukuzi wa kawaida wa jina kwa mfumo wa sauti wa Kiswahili.
- source_word: וְיַעְכָּן
  choice: Yakani
  rationale: Jina limetoholewa kwa Kiswahili huku konsonanti za msingi za Kiebrania zikihifadhiwa kwa kadiri inayowezekana.
- source_word: וְזִיעַ
  choice: Zia
  rationale: Umbo la Kimasora la WLC linaunga mkono 'Zia'; tofauti ya 'Ziza' imehifadhiwa katika tanbihi.
- source_word: וָעֵבֶר
  choice: na Eberi
  rationale: Unukuzi wa Kiswahili wa עֵבֶר; tofauti ya Kiingereza 'Heber' si lazima iingizwe katika matini ya Kiswahili kwa kuwa haitokani na konsonanti ya kwanza ya Kiebrania.
- source_word: שִׁבְעָה
  choice: watu saba
  rationale: Nambari hii ni muhtasari wa majina saba yaliyotangulia; kuongeza 'watu' kunafanya Kiswahili kiwe cha kawaida bila kubadili maana.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Majina yametoholewa kwa mfumo wa Kiswahili; sentensi imewekwa wazi kwa kuongeza 'walikuwa' na 'watu' kama vipengele vya kisarufi vinavyodokezwa na orodha ya Kiebrania. Alama zote za tanbihi zimo katika matini kuu.
