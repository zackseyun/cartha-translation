    text: Au, “watu wa ukoo wao”; katika orodha za nasaba, neno la Kiebrania linalomaanisha “ndugu” linaweza pia kuwahusu jamaa wa ukoo kwa upana zaidi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “kwa nyumba za baba zao,” yaani kwa koo au jamaa zilizohesabiwa kwa upande wa baba.
    reason: cultural_note
  - marker: c
    text: Baadhi ya mapokeo ya maandishi au unukuzi huandika jina hili “Ziza.”
    reason: alternative_reading
  revision_rationale: The revision restores the explicit paternal-household terminology of the Hebrew, adjusts Yaakani to a more faithful and established Swahili transliteration, and retains the draft’s clear names, genealogical register, and footnote support. The concluding “walikuwa saba” supplies natural Swahili syntax without adding substantive information.
