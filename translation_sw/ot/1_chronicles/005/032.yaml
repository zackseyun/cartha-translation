  text: Uzi akamzaa Zerahia, na Zerahia akamzaa Merayothi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עֻזִּי
  choice: Uzi
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili; kiunganishi וְ kinaendeleza orodha ya nasaba na katika mstari huu kinawakilishwa kwa mtiririko wa simulizi.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika muktadha wa nasaba, Hifili ya ילד humaanisha kumzaa au kuwa baba wa mtu. “Akamzaa” ni fupi, ya kawaida, na hudumisha mlolongo wa nasaba.
- source_word: אֶת
  choice: '[haijatafsiriwa kando]'
  rationale: Hiki ni kiashiria cha yambwa mahususi katika Kiebrania; hakina neno linganifu linalohitajika katika Kiswahili.
- source_word: זְרַחְיָה
  choice: Zerahia
  rationale: Jina la mtu limetoholewa kwa mfumo unaosomeka kwa urahisi katika Kiswahili na kuhifadhi umbo lake la Kiebrania.
- source_word: וּֽ/זְרַֽחְיָה
  choice: naye Zerahia
  rationale: Kiunganishi pamoja na kurudiwa kwa jina kimetafsiriwa kwa “naye” ili kuonyesha wazi kwamba Zerahia ndiye kiima cha hatua inayofuata katika mlolongo.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Kitenzi cha nasaba kimerudiwa kwa namna ileile ili kuhifadhi ulinganifu na uwazi wa mlolongo.
- source_word: מְרָיֽוֹת
  choice: Merayothi
  rationale: Jina la mtu limetoholewa moja kwa moja kutoka Kiebrania kwa tahajia inayofaa matamshi ya Kiswahili.
