lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa neno בֵּן katika hali ya kuunganisha. Katika nasaba, “wana wa” ni tafsiri ya kawaida na ya wazi; hapa inaelekea kuwataja wana watatu wa moja kwa moja wa Lawi.
- source_word: לֵוִי
  choice: Lawi
  rationale: Jina la mtu limetolewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: גֵּרְשׁוֹן
  choice: Gershoni
  rationale: Jina hili linawakilisha umbo la Kiebrania Gershon na kulitofautisha na Gershomu, ambalo ni jina jingine linalohusiana lakini tofauti.
- source_word: קְהָת
  choice: Kohathi
  rationale: Unukuzi wa jina la Kiebrania kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: מְרָרִי
  choice: Merari
  rationale: Unukuzi wa jina la Kiebrania kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: וּ
  choice: na
  rationale: Kiunganishi rahisi kinachounganisha jina la mwisho katika orodha.
