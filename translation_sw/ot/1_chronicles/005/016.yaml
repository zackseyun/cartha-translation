base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/016.yaml
  text: They lived in Gilead[a], in Bashan and its towns, and in all the pasturelands of Sharon[c][b], as far as their borders.
translation:
  language: sw
  text: Waliishi katika Gileadi, katika Bashani na miji yake[a], na katika maeneo yote ya malisho ya Sharoni[b], hadi kwenye mipaka yao[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “binti zake”; huu ni msemo wa Kiebrania unaomaanisha miji au vijiji vilivyotegemea eneo kuu.
    reason: lexical_alternative
  - marker: b
    text: Au “ardhi za wazi za Sharoni” au “ardhi za pamoja za Sharoni.”
    reason: lexical_alternative
  - marker: c
    text: Kwa neno halisi, “juu ya kutoka kwao”; yaani, hadi kwenye miisho yao ya nje au mipaka yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Waliishi
  rationale: Kitenzi ישב hapa kinaeleza kukaa au kuishi katika eneo fulani. “Waliishi” ni Kiswahili cha kawaida na hakisisitizi mwanzo wa kuanzisha makazi kama ambavyo “walikaa” au “walijenga makazi” kingeweza kueleweka.
- source_word: בַּגִּלְעָד
  choice: katika Gileadi
  rationale: Jina la mahali limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: בַּבָּשָׁן
  choice: katika Bashani
  rationale: Jina la eneo limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: וּבִבְנֹתֶיהָ
  choice: na miji yake
  rationale: Kwa neno moja ni “na binti zake,” lakini huu ni msemo wa Kiebrania unaomaanisha miji au vijiji vilivyotegemea eneo kuu. Kiambishi cha umoja wa kike kinaelekea kurejelea Bashani, jina lililo karibu zaidi.
- source_word: מִגְרְשֵׁי
  choice: maeneo ... ya malisho
  rationale: מִגְרָשׁ ni ardhi ya wazi karibu na makazi, mara nyingi iliyotumiwa kwa malisho. “Maeneo ya malisho” linafaa katika maelezo haya ya eneo la kikabila huku tanbihi ikihifadhi maana nyingine inayowezekana.
- source_word: שָׁרוֹן
  choice: Sharoni
  rationale: Jina la eneo limetoholewa badala ya kutafsiriwa.
- source_word: עַל תּוֹצְאוֹתָם
  choice: hadi kwenye mipaka yake
  rationale: Kwa neno moja msemo huu ni “juu ya/kufikia matokeo yao” au “mahali pa kutokea kwao,” lakini katika maelezo ya kijiografia unaonyesha miisho ya nje au mipaka. Kiswahili “hadi kwenye mipaka yake” kinawasilisha ukubwa kamili wa eneo bila kutumia tafsiri ngumu isiyo ya kawaida.
