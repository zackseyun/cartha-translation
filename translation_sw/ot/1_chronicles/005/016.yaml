translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maeneo umehifadhiwa kwa uwazi, huku misemo ya Kiebrania iliyotafsiriwa kimaanisho ikifafanuliwa katika tanbihi. Alama zote za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
