  text: Azaria akamzaa Seraya, naye Seraya akamzaa Yehosadaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: Azaria
  rationale: Jina la mtu limetoholewa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili; kiambishi וַ kimewakilishwa na mtiririko wa kitenzi unaoendeleza nasaba.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, Hifili ya ילד humaanisha kwamba mwanamume alimzaa au alikuwa baba wa mtu; “akamzaa” ni fupi, ya kawaida, na hudumisha mfuatano wa simulizi.
- source_word: אֶת
  choice: '[haijatafsiriwa kivyake]'
  rationale: Ni kiashiria cha yambwa mahsusi kisicho na neno huru linalolingana nacho katika Kiswahili; kazi yake inaonekana katika muundo wa sentensi.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Jina la mtu limetoholewa kwa namna inayoakisi matamshi ya Kiebrania na kubaki rahisi kusomeka kwa Waswahili.
- source_word: וּ/שְׂרָיָה
  choice: naye Seraya
  rationale: Kiunganishi וּ kinaunganisha kishazi kinachofuata; “naye” huonyesha kwa kawaida kwamba Seraya sasa ndiye kiima cha tendo linalofuata.
- source_word: יְהוֹצָדָק
  choice: Yehozadaki
  rationale: Jina limetoholewa kutoka Kiebrania kwa umbo linalosomeka kiasili katika Kiswahili na kutofautishwa wazi na majina mengine.
