  text: אֲחִי֙ בֶּן עַבְדִּיאֵ֣ל בֶּן גּוּנִ֔י רֹ֖אשׁ לְ/בֵ֥ית אֲבוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/015.yaml
  text: Ahi son of Abdiel[a], son of Guni, was head of their fathers’ houses.
translation:
  language: sw
  text: Ahi mwana wa Abdieli, mwana wa Guni, alikuwa mkuu wa nyumba ya baba zao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkuu wa ukoo wao” au “mkuu wa jamaa ya mababu zao.”
    reason: Kirai cha Kiebrania “nyumba ya baba zao” ni istilahi inayoweza kumaanisha ukoo au jamaa pana ya kifamilia.
lexical_decisions:
- source_word: אֲחִי
  choice: Ahi
  rationale: Ni jina la mtu; limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kutafsiriwa maana yake.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika taarifa hii ya nasaba, neno hili kwa kawaida humaanisha mwana wa moja kwa moja, ingawa katika miktadha mingine linaweza kumaanisha mzao.
- source_word: עַבְדִּיאֵל
  choice: Abdieli
  rationale: Ni jina la mtu; umbo hili linafuata utaratibu wa kawaida wa Kiswahili wa kutohoa majina ya Kiebrania.
- source_word: גּוּנִי
  choice: Guni
  rationale: Ni jina la mtu; limetoholewa bila kutafsiri maana yake.
- source_word: רֹאשׁ
  choice: mkuu
  rationale: Hapa neno hilo humaanisha kiongozi au mtu mwenye mamlaka. “Mkuu” ni la asili katika Kiswahili na linahifadhi maana ya cheo.
- source_word: לְבֵית אֲבוֹתָם
  choice: wa nyumba ya baba zao
  rationale: Kirai hiki ni istilahi ya ukoo inayorejelea kundi la kifamilia lililotokana na mababu. Tafsiri hii inadumisha taswira halisi ya “nyumba” na “baba,” huku tanbihi ikitoa maana yake ya kiutendaji.
