lexical_decisions:
- source_word: וְלַמִּזְרָח
  choice: Kwa upande wa mashariki
  rationale: Hutoa mwelekeo wa kijiografia kwa Kiswahili cha kawaida; kiunganishi וְ hakihitaji kutafsiriwa kwa neno tofauti mwanzoni mwa sentensi.
- source_word: יָשַׁב
  choice: alikaa
  rationale: Kitenzi cha umoja kimedumishwa, kikimtaja mwakilishi wa ukoo kwa maana ya pamoja; katika muktadha kinahusu kukaa au kuweka makazi katika eneo.
- source_word: עַד לְבוֹא מִדְבָּרָה
  choice: mpaka njia ya kuingia nyikani
  rationale: Neno בּוֹא katika muundo huu linaweza kumaanisha mahali au njia ya kuingia/kukaribia; tafsiri hii inadumisha taswira ya mpaka bila kuifanya sentensi kuwa ngumu kupita kiasi.
- source_word: לְמִן הַנָּהָר פְּרָת
  choice: kutoka Mto Frati
  rationale: Inafuata kwa karibu alama ya asili au mwanzo iliyomo katika לְמִן, huku ikidumisha ufupi na utata wa maelezo ya mpaka katika Kiebrania.
- source_word: כִּי
  choice: kwa sababu
  rationale: Inaonyesha sababu ya kupanuka kwa makazi kuelekea mashariki.
- source_word: מִקְנֵיהֶם
  choice: mifugo yao
  rationale: מִקְנֶה ni neno pana kwa wanyama wanaofugwa, si ng'ombe pekee.
- source_word: רָבוּ
  choice: ilikuwa imeongezeka
  rationale: Inaonyesha kwamba mifugo ilikuwa tayari imekuwa mingi, jambo lililosababisha upanuzi wa makazi.
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: katika nchi ya Gileadi
  rationale: Inadumisha maana ya eneo au nchi inayobebwa na אֶרֶץ pamoja na jina la mahali.
