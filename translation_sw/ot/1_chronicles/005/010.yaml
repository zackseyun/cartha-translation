base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/010.yaml
  text: In the days of Saul they made war with the Hagrites[a], and they fell into their hand[b]; and they lived in their tents throughout all the region east of Gilead.
translation:
  language: sw
  text: Katika siku za Sauli walipigana vita na Wahagari[a]. Wahagari wakaanguka mikononi mwao[b], nao wakaishi katika mahema yao katika eneo lote lililo mashariki ya Gileadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wahagri.” Jina hili la kikabila la Kiebrania huenda linarejelea watu waliohusishwa na Hagari.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wakaanguka mkononi mwao,” yaani, wakawa chini ya mamlaka yao. Wanaoanguka ni Wahagari, kama muktadha unavyodokeza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי שָׁאוּל
  choice: Katika siku za Sauli
  rationale: Nahau hii ya Kiebrania huonyesha kipindi cha utawala au maisha ya mtu. Tafsiri hii inadumisha muundo na hadhi ya matini huku ikieleweka kwa Kiswahili cha kawaida.
- source_word: עָשׂוּ מִלְחָמָה עִם
  choice: walipigana vita na
  rationale: Kirai עשה מלחמה ni nahau ya kushiriki katika vita. Katika Kiswahili, “kupigana vita na” ni ya asili na huonyesha wazi kwamba huyo alikuwa adui.
- source_word: הַהַגְרִאִים
  choice: Wahagri
  rationale: Hili ni jina la kikabila. “Wahagri” linanakili kwa ufupi umbo la Kiebrania; tanbihi inaonyesha pia umbo mbadala linalodhihirisha uhusiano unaowezekana na Hagari.
- source_word: וַיִּפְּלוּ בְּיָדָם
  choice: Wahagri wakaanguka mikononi mwao
  rationale: Nahau ya Kiebrania ina maana ya kuanguka chini ya mamlaka ya mwingine. Kutaja “Wahagri” huondoa utata wa kiwakilishi cha Kiswahili bila kubadili mhusika anayedokezwa na muktadha, huku “mikononi mwao” ikihifadhi taswira ya asili.
- source_word: וַיֵּשְׁבוּ
  choice: wakaishi
  rationale: Kitenzi ישב kinaweza kumaanisha kukaa, kuishi, au kufanya makao. “Wakaishi” ni cha kawaida na hakiongezi dai la kudumu ambalo “wakajenga makao” lingeweza kudokeza.
- source_word: בְּאָהֳלֵיהֶם
  choice: katika mahema yao
  rationale: Tafsiri hii huhifadhi picha halisi ya mahema na kiwakilishi ambacho katika muktadha kinawarejelea Wahagri walioshindwa.
- source_word: עַל כָּל פְּנֵי מִזְרָח לַגִּלְעָד
  choice: katika eneo lote lililo mashariki ya Gileadi
  rationale: Nahau עַל כָּל פְּנֵי huonyesha kuenea katika sehemu yote ya eneo fulani. Kiswahili hiki ni cha asili na kinaeleza kwa uwazi mahali panapohusika.
