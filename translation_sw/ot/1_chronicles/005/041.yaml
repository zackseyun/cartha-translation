  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu muundo na maana ya Kiebrania: Yehosadaki ndiye mtendaji wa “aliondoka,” Yahwe ndiye mtendaji wa kupeleka uhamishoni, na Nebukadneza anaonyeshwa kwa usahihi kama wakala kwa nahau “kwa mkono wa.” Uhusiano wa wakati katika בְּהַגְלוֹת umehifadhiwa kwa “wakati ... alipowapeleka.”'
