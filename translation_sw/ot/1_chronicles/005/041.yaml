  terminology: “Yahwe,” “Yehosadaki,” “Yuda,” “Yerusalemu,” na “Nebukadneza” ni maumbo yanayofaa Kiswahili cha Biblia. “Kwa mkono wa” huhifadhi nahau ya chanzo bila kuficha uwakala wa kibinadamu wa Nebukadneza.
