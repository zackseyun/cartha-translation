source:
  edition: WLC
  text: וִ/יהוֹצָדָ֣ק הָלַ֔ךְ בְּ/הַגְל֣וֹת יְהוָ֔ה אֶת יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם בְּ/יַ֖ד נְבֻכַדְנֶאצַּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/041.yaml
  text: And Jehozadak went away when Yahweh sent Judah and Jerusalem into exile by the hand of Nebuchadnezzar[a].
translation:
  language: sw
  text: Naye Yehosadaki aliondoka wakati Yahwe alipowapeleka Yuda na Yerusalemu uhamishoni kwa mkono wa Nebukadneza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “Naye Yehosadaki alienda wakati Yahwe alipowahamisha Yuda na Yerusalemu kwa mkono wa Nebukadneza.”'
    reason: Mbadala wa kimsamiati na wa kimuundo unaoakisi kwa karibu zaidi הָלַךְ na בְּהַגְלוֹת.
lexical_decisions:
- source_word: וִ/יהוֹצָדָק
  choice: Naye Yehosadaki
  rationale: Kiunganishi ו kimetafsiriwa kwa mtiririko wa simulizi kama “Naye,” na jina limeandikwa kwa namna ya Kiswahili inayofuata umbo kamili la Kiebrania.
- source_word: הָלַךְ
  choice: aliondoka
  rationale: Katika muktadha wa kupelekwa uhamishoni, “aliondoka” huonyesha kuondoka katika nchi bila kudokeza kwamba yeye ndiye aliyeanzisha tukio hilo.
- source_word: בְּ/הַגְלוֹת
  choice: wakati ... alipowapeleka ... uhamishoni
  rationale: ב pamoja na kitenzi-jina cha גלה ina maana ya wakati; muundo wa kitenzi kamili ni wa kawaida na wazi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limedumishwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אֶת יְהוּדָה וִ/ירוּשָׁלָם
  choice: Yuda na Yerusalemu
  rationale: Majina ya ufalme au eneo na mji yametafsiriwa moja kwa moja bila kuongeza “watu wa,” ingawa upatanisho wa kisarufi wa Kiswahili huyaelekeza kama waliotendewa tendo.
- source_word: בְּ/יַד
  choice: kwa mkono wa
  rationale: Nahau hii inadumisha picha ya Kiebrania na kuonyesha Nebukadneza kuwa wakala wa kibinadamu wa tendo hilo.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nebukadneza
  rationale: Hili ni umbo la jina linalotambulika sana katika matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Utendaji wa Mungu na wa mwanadamu katika uhamisho
  choice: Yahwe anaonyeshwa kuwa aliyewapeleka Yuda na Yerusalemu uhamishoni, huku Nebukadneza akiwa wakala aliyetumiwa.
  alternative: Kumfanya Nebukadneza peke yake kuwa mtendaji mkuu wa uhamisho.
  rationale: Muundo wa Kiebrania unamweka Yahwe kuwa mtendaji wa tendo la kuhamisha, na “kwa mkono wa Nebukadneza” huonyesha wakala wa pili; tafsiri inadumisha pande zote mbili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Uhamishoni” ni neno linaloeleweka kwa urahisi; nahau “kwa mkono wa” imehifadhiwa kwa sababu ni wazi katika muktadha na inadumisha taswira ya chanzo.
