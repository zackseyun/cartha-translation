base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/022.yaml
  text: For many slain fell[a], because the battle was from God; and they lived in their place until the exile.
translation:
  language: sw
  text: Kwa maana wengi walianguka, wakiwa wameuawa vitani, kwa sababu vita hivyo vilitoka kwa Mungu[a]; nao wakaishi mahali pao hadi wakati wa uhamisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu vita hivyo vilikuwa vya Mungu.” Kirai cha Kiebrania kinakazia kwamba matokeo ya vita yalitoka kwa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: כִּי ya kwanza inaeleza sababu ya ushindi uliotajwa kabla; “Kwa maana” huunganisha maelezo hayo kwa Kiswahili cha kawaida.
- source_word: חֲלָלִים רַבִּים
  choice: watu wengi ... wakiwa wameuawa
  rationale: חֲלָלִים humaanisha waliouawa, hasa katika mapigano. Tafsiri hii inahifadhi maana ya vifo vya vitani bila kutumia neno lisilo la kawaida.
- source_word: נָפָלוּ
  choice: walianguka
  rationale: נפל hutumiwa kwa kuanguka na kufa vitani. “Walianguka” inadumisha taswira hiyo, huku “wakiwa wameuawa” ikifafanua kwamba walikufa.
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי ya pili inatoa sababu ya watu wengi kuuawa, kwa hiyo “kwa sababu” huonyesha wazi uhusiano wa kisababu.
- source_word: מֵהָאֱלֹהִים
  choice: vilitoka kwa Mungu
  rationale: Kihusishi מִן huonyesha chanzo. “Vilitoka kwa Mungu” kinaakisi muundo na dai la Kiebrania bila kuongeza maelezo ya namna Mungu alivyohusika.
- source_word: הַמִּלְחָמָה
  choice: vita hivyo
  rationale: מִלְחָמָה hurejelea mapigano yaliyosimuliwa katika muktadha. “Vita hivyo” ni Kiswahili cha asili kinachoelekeza kwenye pambano hilo.
- source_word: וַיֵּשְׁבוּ
  choice: nao wakaishi
  rationale: ישב inaweza kumaanisha kukaa, kuishi, au kufanya makao. “Wakaishi” ni ya sasa na inaeleweka, huku kirai kinachofuata kikionyesha kuchukua eneo la walioshindwa.
- source_word: תַחְתֵּיהֶם
  choice: mahali pao
  rationale: Katika muktadha huu, neno hilo ni nahau ya kuchukua mahali pa watu walioshindwa, si kukaa chini yao kihalisi.
- source_word: עַד הַגֹּלָה
  choice: hadi wakati wa uhamisho
  rationale: גּוֹלָה hurejelea uhamisho wa watu kutoka nchi yao. Kuongeza “wakati wa” hufanya kikomo cha muda kiwe cha kawaida katika Kiswahili.
theological_decisions:
- issue: Kuhusika kwa Mungu katika vita
  choice: kwa sababu vita hivyo vilitoka kwa Mungu
  alternative: kwa sababu vita hivyo vilikuwa vya Mungu
  rationale: Kiebrania kinamtaja Mungu kuwa chanzo cha vita au matokeo yake. Tafsiri kuu inadumisha wazo la chanzo bila kufafanua zaidi namna ya utendaji wa Mungu; tanbihi inahifadhi uwezekano wa kuelewa vita kuwa vya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “walianguka wakiwa wameuawa” umehifadhi taswira ya Kiebrania huku ukieleza wazi kifo cha vitani; “wakaishi mahali pao” ni ya kawaida kuliko “wakakaa badala yao” na bado inaonyesha kuchukua makao ya walioshindwa.
