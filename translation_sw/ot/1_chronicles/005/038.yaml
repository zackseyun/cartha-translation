  text: Ahitub fathered Zadok, and Zadok fathered Shallum.
translation:
  language: sw
  text: Ahitubu akamzaa Sadoki, naye Sadoki akamzaa Shalumu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחִיטוּב
  choice: Ahitubu
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili; kiambishi cha uunganishi וַ kinawakilishwa na muundo wa kitenzi “akamzaa,” unaoendeleza nasaba kutoka mstari uliotangulia.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, Hifili ya ילד humaanisha kumzaa au kuwa baba wa mtu. “Akamzaa” ni usemi mfupi, wa kawaida katika nasaba za Kiswahili, na unaonyesha mwendelezo wa matukio.
- source_word: אֶת
  choice: '[hakijatafsiriwa kivyake]'
  rationale: Hiki ni kiashiria cha yambwa dhahiri katika Kiebrania; kazi yake inaonyeshwa na mpangilio na mofolojia ya Kiswahili.
- source_word: צָדוֹק
  choice: Sadoki
  rationale: Jina la mtu limetoholewa kwa umbo linalotamkika kwa kawaida katika Kiswahili.
- source_word: וְ/צָדוֹק
  choice: naye Sadoki
  rationale: Kiunganishi וְ kinaunganisha kizazi kinachofuata; “naye” ni cha asili katika Kiswahili na kinaonyesha wazi kwamba Sadoki ndiye kiima kipya.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Kitenzi cha nasaba kimetafsiriwa kwa uthabiti kama ilivyo katika sehemu ya kwanza ya mstari.
- source_word: שַׁלּוּם
  choice: Shalumu
  rationale: Jina la mtu limetoholewa kutoka Kiebrania kwa umbo linalofaa fonolojia ya Kiswahili na kutofautishwa na jina Salumu pale inapohitajika kuhifadhi konsonanti ya Kiebrania.
