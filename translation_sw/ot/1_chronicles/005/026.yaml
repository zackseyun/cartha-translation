  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּעַר֩ אֱלֹהֵ֨י יִשְׂרָאֵ֜ל אֶת ר֣וּחַ פּ֣וּל מֶֽלֶךְ אַשּׁ֗וּר וְ/אֶת ר֨וּחַ֙ תִּלְּגַ֤ת פִּלְנֶ֨סֶר֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּגְלֵ/ם֙ לָ/ראוּבֵנִ֣י וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֣בֶט מְנַשֶּׁ֑ה וַ֠/יְבִיאֵ/ם לַ/חְלַ֨ח וְ/חָב֤וֹר וְ/הָרָא֙ וּ/נְהַ֣ר גּוֹזָ֔ן עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/026.yaml
  text: So the God of Israel stirred up the spirit of Pul king of Assyria[a], even the spirit of Tilgath-pilneser king of Assyria, and he took the Reubenites, the Gadites, and the half-tribe of Manasseh into exile, and brought them to Halah, Habor, Hara, and the river Gozan[b], to this day.
translation:
  language: sw
  text: Kwa hiyo Mungu wa Israeli akachochea roho ya Pulu, mfalme wa Ashuru[a], na roho ya Tilgath-Pilneseri[b], mfalme wa Ashuru; naye akawapeleka uhamishoni Wareubeni, Wagadi, na nusu ya kabila la Manase, akawaleta Hala, Habori, Hara, na kwenye mto Gozani hadi leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda Pulu na Tilgath-Pilneseri ni majina mawili ya mfalme yuleyule wa Ashuru. Au maneno haya yanaweza kueleweka kuwa yanataja watawala wawili tofauti.
    reason: alternative_reading
  - marker: b
    text: “Tilgath-Pilneseri” linafuata umbo la jina katika Kiebrania hapa; umbo linalojulikana zaidi ni “Tiglath-Pileseri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַר
  choice: akaichochea
  rationale: Kitenzi hiki humaanisha kuamsha au kusukuma mtu atende. “Akaichochea” ni Kiswahili cha kawaida kinachoonyesha kwamba Mungu alisababisha msukumo huo bila kudokeza kwamba kitendo hicho kilikuwa kiovu.
- source_word: רוּחַ ... רוּחַ
  choice: roho ya ... na roho ya
  rationale: “Roho” inahifadhi maana ya moja kwa moja ya רוּחַ na hapa inaelekeza kwenye msukumo au mwelekeo wa ndani wa mtawala. Kurudia neno hilo kunafuata muundo wa Kiebrania na kutohitimisha kimya kimya uhusiano kati ya majina hayo mawili.
- source_word: פּוּל
  choice: Pulu
  rationale: Jina limeandikwa kwa namna inayokaribia Kiebrania na inayoweza kutamkwa kwa urahisi katika Kiswahili.
- source_word: תִּלְּגַת פִּלְנֶסֶר
  choice: Tilgath-Pilneseri
  rationale: Umbo hili linafuata kwa karibu tahajia ya jina katika maandishi ya Kiebrania ya Mambo ya Nyakati; umbo linalojulikana zaidi limeelezwa katika tanbihi.
- source_word: וַיַּגְלֵם
  choice: akawapeleka uhamishoni
  rationale: Hifili ya גלה humaanisha kuwahamisha watu kwa nguvu kutoka nchi yao. Kauli hii ni ya asili katika Kiswahili na huepuka mtindo wa kirasimu wa “kuwafukuza nchini.”
- source_word: לָראוּבֵנִי וְלַגָּדִי
  choice: Wareubeni, Wagadi
  rationale: Majina haya ya watu wa makabila yametolewa kwa maumbo ya Kiswahili yanayoeleweka.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: nusu ya kabila la Manase
  rationale: Hili ni tamko wazi na la kawaida linalorejelea sehemu ya kabila la Manase iliyokuwa ng’ambo ya Yordani.
- source_word: וַיְבִיאֵם
  choice: akawaleta
  rationale: Hili linatoa maana ya moja kwa moja ya umbo la kisababishi la בוא katika mfululizo wa kuhamishwa na kupelekwa mahali pengine.
- source_word: לַחְלַח וְחָבוֹר וְהָרָא וּנְהַר גּוֹזָן
  choice: Hala, Habori, Hara, na kwenye mto Gozani
  rationale: Majina ya mahali yametoholewa kwa matamshi ya Kiswahili. “Kwenye mto Gozani” ni usemi wa kawaida unaohifadhi rejeo la kijiografia.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Huu ndio usemi wa kawaida wa Kiswahili kwa nahau ya Kiebrania inayomaanisha kuendelea hadi wakati wa mwandishi.
theological_decisions:
- issue: Uhusiano kati ya Pulu na Tilgath-Pilneseri
  choice: 'Majina yametajwa kwa uratibu: “roho ya Pulu ... na roho ya Tilgath-Pilneseri,” kama yalivyo katika muundo wa Kiebrania.'
  alternative: Majina hayo yanaweza kueleweka kuwa majina mawili ya mfalme yuleyule wa Ashuru, yaani Pulu alikuwa Tilgath-Pilneseri.
  rationale: Kiebrania kinarudia “roho ya” na kuunganisha vifungu kwa וְ, jambo linaloweza kusikika kama watawala wawili; hata hivyo, historia na kitenzi cha umoja kinachofuata vinaweza kuunga mkono utambulisho wa mtu mmoja. Maandishi makuu hayalazimishi mojawapo, na uwezekano mwingine umehifadhiwa katika tanbihi.
- issue: Mtendaji wa kitendo cha kuwapeleka uhamishoni
  choice: “Naye” imeachwa irejelee mtawala wa Ashuru aliyetajwa karibu zaidi, bila kuongeza jina.
  alternative: Kutaja wazi “mfalme huyo wa Ashuru” au “Mungu.”
  rationale: Kitenzi cha Kiebrania kina kiima cha umoja kisichotajwa wazi. Kiwakilishi cha Kiswahili kinadumisha mfululizo wa simulizi na hakiongezi ufafanuzi usiokuwamo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kihistoria lakini kinachoeleweka kwa wasomaji wa kawaida. Viunganishi na mpangilio wa sentensi huhifadhi mfululizo wa Kiebrania bila kufanya sentensi kuwa nzito. Majina ya watu na mahali yametoholewa kwa mfumo wa sauti wa Kiswahili.
