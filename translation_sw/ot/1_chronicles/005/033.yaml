  text: Meraioth fathered Amariah, and Amariah fathered Ahitub.
translation:
  language: sw
  text: Merayothi akamzaa Amaria, naye Amaria akamzaa Ahitubu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרָיוֹת
  choice: Merayothi
  rationale: Jina la mtu limetoholewa kwa mfumo unaosomeka kwa kawaida katika Kiswahili huku likihifadhi sauti kuu za Kiebrania.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, kausativi ya ילד humaanisha kumzaa au kuwa baba wa mtu; “akamzaa” ni fupi, ya kawaida, na inafaa mtiririko wa orodha ya nasaba.
- source_word: אֶת
  choice: '[halikutafsiriwa kando]'
  rationale: Ni kiashiria cha yambwa mahususi cha Kiebrania kisicho na neno huru linalolingana nacho katika Kiswahili; kazi yake inaonyeshwa na muundo wa kitenzi na yambwa.
- source_word: אֲמַרְיָה
  choice: Amaria
  rationale: Jina la mtu limetoholewa kwa namna inayotambulika na kusomeka kwa urahisi katika Kiswahili.
- source_word: וַ/אֲמַרְיָה
  choice: naye Amaria
  rationale: Waw imewasilishwa kwa kiunganishi “naye,” ambacho huunganisha vifungu kwa njia ya asili na kumtaja Amaria kama mhusika wa tendo linalofuata.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Kitenzi cha nasaba kilichorudiwa kimetafsiriwa kwa uthabiti ili kuhifadhi usambamba wa maandishi.
- source_word: אֲחִיטוּב
  choice: Ahitubu
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa matamshi na muundo wa Kiswahili.
