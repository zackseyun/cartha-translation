base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/011.yaml
  text: And the sons of Gad lived opposite them in the land of Bashan[b][a], as far as Salecah.
translation:
  language: sw
  text: Nao wana wa Gadi waliishi mkabala nao[a] katika nchi ya Bashani, mpaka Salka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “karibu nao” au “wakikabiliana nao”; usemi wa Kiebrania unaonyesha mahali walipokuwa kwa kulinganishwa na kundi lililotajwa kabla.
    reason: lexical_alternative
  - marker: b
    text: Jina Salka pia huandikwa “Saleka” katika baadhi ya tafsiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי גָד
  choice: Nao wana wa Gadi
  rationale: Katika muktadha wa kikabila, בְּנֵי inaweza kumaanisha wana au wazao. “Wana wa Gadi” huhifadhi muundo wa Kiebrania na ni usemi wa kawaida wa kibiblia katika Kiswahili.
- source_word: לְ/נֶגְדָּ/ם
  choice: mkabala nao
  rationale: נגד pamoja na kiambishi cha nafsi huonyesha mahali palipo mbele, panapokabiliana, au karibu kwa uhusiano na watu waliotangulia kutajwa. “Mkabala nao” huhifadhi maana ya nafasi bila kubainisha zaidi jiografia isiyowazi.
- source_word: יָשְׁבוּ
  choice: waliishi
  rationale: Katika taarifa ya makazi ya kikabila, ישב inaeleza kukaa au kuishi katika eneo. “Waliishi” ni ya sasa, ya kawaida, na haiongezi wazo maalumu la tendo la kuanzisha makazi.
- source_word: בְּ/אֶרֶץ הַ/בָּשָׁן
  choice: katika nchi ya Bashani
  rationale: אֶרֶץ hapa ni eneo linaloitwa Bashani. “Nchi ya Bashani” ni tafsiri ya kawaida na inayoeleweka ya jina hilo la kijiografia.
- source_word: עַד
  choice: mpaka
  rationale: Katika maelezo ya mipaka au ukubwa wa eneo, עַד huonyesha umbali unaofikia mahali fulani. “Mpaka” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: סַלְכָה
  choice: Salka
  rationale: Jina hili la mahali limetoholewa moja kwa moja kutoka Kiebrania סַלְכָה; “Salka” hufuata kwa karibu matamshi ya konsonanti za jina hilo.
