  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa asili bila kuwa wa kizamani; utata wa usemi wa mahali לְנֶגְדָּם umehifadhiwa na kuelezwa katika tanbihi.
