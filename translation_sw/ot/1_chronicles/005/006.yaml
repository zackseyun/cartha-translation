base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/006.yaml
  text: Beerah his son[a], whom Tilgath-pilneser king of Assyria carried away into exile—he was a chief of the Reubenites.
translation:
  language: sw
  text: Beera mwanawe, ambaye Tilgath-Pilneseri[a], mfalme wa Ashuru, alimpeleka uhamishoni; yeye alikuwa mkuu wa Wareubeni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Umbo la Kiebrania la jina la mfalme wa Ashuru hapa ni “Tilgath-Pilneseri”; tafsiri nyingi hutumia umbo la kihistoria linalojulikana zaidi, “Tiglath-Pileseri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵרָה
  choice: Beera
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayoeleweka katika Kiswahili, huku likifuata umbo la Kiebrania.
- source_word: בְנוֹ
  choice: mwanawe
  rationale: Nomino yenye kiambishi cha nafsi ya tatu ya umoja; ‘mwanawe’ ni Kiswahili cha kawaida katika mfululizo wa nasaba.
- source_word: אֲשֶׁר
  choice: ambaye
  rationale: Kiwakilishi rejeshi kinamtambulisha Beera kama mtendewa wa tendo la kupelekwa uhamishoni.
- source_word: הֶגְלָה
  choice: alimpeleka uhamishoni
  rationale: Hifili ya גלה ina maana ya kusababisha mtu aende uhamishoni; usemi huu unahifadhi maana hiyo ya kisababishi kwa Kiswahili cha kawaida.
- source_word: תִּלְגַת פִּלְנְאֶסֶר
  choice: Tilgath-Pilneseri
  rationale: Tahajia hii inawakilisha moja kwa moja umbo la jina lililo katika maandishi ya Kiebrania ya aya hii, badala ya kulisawazisha na umbo jingine linalojulikana zaidi.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: mfalme wa Ashuru
  rationale: Huu ni mfuatano wa nomino katika hali ya kuambatana; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: הוּא
  choice: yeye
  rationale: Kiwakilishi huru kimetafsiriwa wazi ili kuhifadhi msisitizo wa Kiebrania na kumrejelea tena Beera baada ya kishazi rejeshi.
- source_word: נָשִׂיא
  choice: mkuu
  rationale: Katika muktadha wa kabila na nasaba, neno hili humaanisha kiongozi mwenye cheo; ‘mkuu’ huepuka maana ya kifalme ambayo ‘mwana-mfalme’ ingeweza kuleta.
- source_word: לָרְאוּבֵנִי
  choice: wa Wareubeni
  rationale: Herufi ל inaonyesha uhusiano wa uongozi kati ya mkuu na kundi; ‘mkuu wa Wareubeni’ ni usemi wa asili katika Kiswahili.
