  source_fidelity: 'Tafsiri inafuata kwa usahihi muundo wa Kiebrania: Beera ni mwana katika nasaba, ndiye anayerejelewa na kishazi cha uhamisho, na kiwakilishi “yeye” hurudisha mkazo kwa Beera baada ya kutajwa kwa mfalme wa Ashuru. “Alimpeleka uhamishoni” hudumisha maana ya kisababishi ya הֶגְלָה.'
