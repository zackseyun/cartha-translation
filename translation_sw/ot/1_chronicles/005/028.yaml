lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Na wana wa
  rationale: Kiunganishi וּ kimetafsiriwa “Na” ili kuendeleza orodha ya ukoo, huku בְנֵי katika hali ya muundo ikitafsiriwa “wana wa,” maana inayofaa katika muktadha huu.
- source_word: קְהָת
  choice: Kehathi
  rationale: Jina la mtu limetoholewa kwa tahajia inayotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: עַמְרָם
  choice: Amramu
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida na inayosomeka kwa Kiswahili.
- source_word: יִצְהָר
  choice: Ishari
  rationale: Jina limetoholewa kutoka Kiebrania kwa kuzingatia matamshi na umbo linalofaa Kiswahili.
- source_word: וְ/חֶבְרוֹן
  choice: Hebroni
  rationale: Hapa ni jina la mtu katika ukoo, si jina la mahali; kiambishi וְ kinawakilishwa na mpangilio wa orodha ya Kiswahili.
- source_word: וְ/עֻזִּיאֵל
  choice: na Uzieli
  rationale: Jina limetoholewa kwa Kiswahili, na kiunganishi וְ kimetafsiriwa wazi kuwa “na” kabla ya jina la mwisho.
