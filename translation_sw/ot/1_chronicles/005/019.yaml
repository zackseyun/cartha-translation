  text: They made war against the Hagrites[a], Jetur, Naphish, and Nodab.
translation:
  language: sw
  text: Nao wakapigana vita dhidi ya Wahagri[a], Yeturi, Nafishi, na Nodabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wahagari.” Jina hili la watu katika Kiebrania linaweza kutoholewa kwa namna zote mbili.
