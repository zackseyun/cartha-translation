lexical_decisions:
- source_word: וַיַּעֲשׂוּ מִלְחָמָה
  choice: wakapigana vita
  rationale: Nahau ya Kiebrania yenye maana halisi ya ‘wakafanya vita’ inawasilishwa kwa Kiswahili cha kawaida kama ‘wakapigana vita,’ huku ikihifadhi maana ya shughuli ya kivita.
- source_word: עִם
  choice: dhidi ya
  rationale: Ingawa kihusishi hiki mara nyingi humaanisha ‘pamoja na,’ katika muktadha wa vita kinaonyesha upande unaopingwa; ‘dhidi ya’ ni wazi na asilia.
- source_word: הַהַגְרִיאִים
  choice: Wahagri
  rationale: Jina la kabila limetoholewa kwa kufuata umbo la Kiebrania; kiambishi Wa- kinaonyesha kundi la watu kwa Kiswahili.
- source_word: וִיטוּר
  choice: Yeturi
  rationale: Jina limetoholewa kutoka Kiebrania kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: וְנָפִישׁ
  choice: Nafishi
  rationale: Jina limetoholewa kutoka Kiebrania kwa mfumo wa sauti wa Kiswahili.
- source_word: וְנוֹדָב
  choice: na Nodabu
  rationale: Kiunganishi kimehifadhiwa katika orodha, na jina limetoholewa kwa tahajia ya Kiswahili.
