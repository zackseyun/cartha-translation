  yaml_path: translation/ot/1_chronicles/005/005.yaml
  text: Micah his son[a], Reaiah his son, Baal his son.
translation:
  language: sw
  text: Mika mwanawe, Reaya mwanawe, Baali[a] mwanawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “Baali” hapa ni jina la mtu katika nasaba, si cheo kinachotafsiriwa “bwana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיכָה
  choice: Mika
  rationale: Ni jina la mtu; limetoholewa kwa umbo la kawaida na la asili katika Kiswahili.
- source_word: בְנוֹ
  choice: mwanawe
  rationale: Nomino yenye kiambishi cha nafsi ya tatu umoja humaanisha moja kwa moja “mwana wake.” Katika mfuatano huu wa nasaba, “mwanawe” ni fupi, wazi, na ya kawaida.
- source_word: רְאָיָה
  choice: Reaya
  rationale: Ni jina la mtu, hivyo limetoholewa badala ya kutafsiriwa; umbo “Reaya” linafuata kwa karibu matamshi ya jina la Kiebrania na linafaa katika Kiswahili.
- source_word: בַּעַל
  choice: Baali
  rationale: Katika muktadha huu ni jina la mtu katika nasaba. “Baali” ni utohozi wa Kiswahili unaohifadhi jina hilo bila kuligeuza kuwa cheo kama “bwana.”
theological_decisions:
- issue: Iwapo בַּעַל itafsiriwe kama cheo au rejeo kwa mungu, au ihifadhiwe kama jina la mtu
  choice: Imehifadhiwa kama jina la mtu, “Baali”
  alternative: Kutafsiriwa kama cheo “bwana” au kueleweka moja kwa moja kuwa jina la mungu
  rationale: Muundo wa mstari ni orodha ya nasaba yenye majina ya watu yanayofuatwa na “mwanawe.” Kwa hiyo, hapa בַּעַל hufanya kazi kama jina la mtu; kuitafsiri “bwana” kungeficha sintaksia na aina ya maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye hadhi unaofaa orodha ya nasaba. Alama ya tanbihi imewekwa baada ya “Baali,” neno linalofafanuliwa.
