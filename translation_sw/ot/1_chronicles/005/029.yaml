base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/029.yaml
  text: 'The sons of Amram: Aaron[a], Moses, and Miriam; and the sons of Aaron: Nadab and Abihu, Eleazar and Ithamar.'
translation:
  language: sw
  text: Watoto[a] wa Amramu walikuwa Haruni, Musa na Miriamu. Wana wa Haruni walikuwa Nadabu, Abihu, Eleazari na Ithamari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa.” Katika orodha hii ya nasaba, neno hilo linawahusu watoto wa Amramu, kwa kuwa Miriamu ametajwa pamoja na Haruni na Musa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עַמְרָם
  choice: Watoto wa Amramu
  rationale: Neno בְּנֵי kwa maana ya msingi ni “wana,” lakini orodha hii inamtaja Miriamu pamoja na Haruni na Musa. “Watoto” huwasilisha uhusiano wa kizazi kwa usahihi na kwa Kiswahili cha kawaida bila kumwondoa Miriamu.
- source_word: אַהֲרֹן
  choice: Haruni
  rationale: Jina limetolewa kwa umbo lililozoeleka sana katika Kiswahili sanifu cha Biblia.
- source_word: וּמֹשֶׁה
  choice: Musa
  rationale: Jina limetolewa kwa umbo la kawaida katika Kiswahili sanifu; viunganishi vya Kiebrania vimepangwa kwa mtindo wa kawaida wa orodha ya Kiswahili.
- source_word: וּמִרְיָם
  choice: na Miriamu
  rationale: Jina limetoholewa kwa umbo linalotambulika katika Kiswahili, na kiunganishi kimedumishwa kabla ya jina la mwisho katika orodha.
- source_word: וּבְנֵי אַהֲרֹן
  choice: Wana wa Haruni
  rationale: Hapa wote wanaoorodheshwa ni wana wa kiume wa Haruni; “wana” ni sahihi na hudumisha mtindo wa nasaba.
- source_word: נָדָב וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר
  choice: Nadabu, Abihu, Eleazari na Ithamari
  rationale: Majina yametoholewa kwa maumbo yanayotambulika katika mapokeo ya Kiswahili, huku marudio ya viunganishi vya Kiebrania yakibadilishwa kuwa orodha ya asili ya Kiswahili.
theological_decisions:
- issue: Je, בְּנֵי katika orodha ya watoto wa Amramu itafsiriwe “wana” au “watoto”?
  choice: Watoto
  alternative: Wana
  rationale: Kwa kuwa andiko lenyewe linajumuisha Miriamu, “watoto” huepuka kutoa maana kwamba waliotajwa wote ni wa kiume. Tanbihi inadumisha taarifa kwamba Kiebrania kimetumia neno la kiume “wana.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha nyepesi lakini yenye hadhi. Kitenzi “walikuwa” kimeongezwa ili sentensi za orodha zisomeke kwa kawaida; hakibadili uhusiano wa kinasaba uliomo katika Kiebrania.
