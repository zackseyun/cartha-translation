  text: Ahimaaz fathered Azariah, and Azariah fathered Johanan.
translation:
  language: sw
  text: Ahimaasi akamzaa Azaria, naye Azaria akamzaa Yohanani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחִימַעַץ
  choice: Ahimaasi
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili; kiunganishi cha mwanzo hakijahitaji kutafsiriwa peke yake katika mwanzo wa sentensi.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, Hiphil ya ילד humaanisha kumzaa au kuwa baba wa mtu; “akamzaa” ni fupi, ya kawaida, na huhifadhi mtiririko wa nasaba.
- source_word: אֶת
  choice: '[halijatafsiriwa peke yake]'
  rationale: Ni alama ya yambwa mahsusi katika Kiebrania, isiyo na kisawe cha pekee kinachohitajika katika Kiswahili.
- source_word: עֲזַרְיָה
  choice: Azaria
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida na inayoeleweka katika Kiswahili.
- source_word: וַ/עֲזַרְיָה
  choice: naye Azaria
  rationale: Kiunganishi וַ kimetafsiriwa kwa “naye” ili kuunganisha vifungu vya nasaba kwa Kiswahili cha asili na kuonyesha kuwa Azaria ndiye mtendaji wa kifungu kinachofuata.
- source_word: יוֹחָנָן
  choice: Yohanani
  rationale: Jina la mtu limetoholewa kutoka Kiebrania kwa muundo unaofaa tahajia na matamshi ya Kiswahili.
