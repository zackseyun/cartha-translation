  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima, na unaoeleweka kwa urahisi. “Hodari” huhifadhi uzito wa גִּבּוֹר bila kudai kwa uhakika kwamba walikuwa wakuu wa cheo; tanbihi ya [a] huhifadhi utata wa בֶאֱמוּנָה.
