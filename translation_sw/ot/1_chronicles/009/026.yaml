  text: כִּ֣י בֶ/אֱמוּנָ֞ה הֵ֗מָּה אַרְבַּ֨עַת֙ גִּבֹּרֵ֣י הַ/שֹּׁעֲרִ֔ים הֵ֖ם הַ/לְוִיִּ֑ם וְ/הָיוּ֙ עַל הַ/לְּשָׁכ֔וֹת וְ/עַ֥ל הָ/אֹצְר֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/026.yaml
  text: For these four mighty gatekeepers[a], who were Levites[b], were entrusted with the chambers and with the storehouses of the house of God.
translation:
  language: sw
  text: Kwa maana hawa walinda malango wanne hodari, ambao walikuwa Walawi, waliaminika[a] kusimamia vyumba na maghala[b] ya nyumba ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walikuwa waaminifu” au “kwa uaminifu.” Kiebrania kinaweza kusisitiza uaminifu wao au kwamba walikuwa katika wajibu wa kuaminiwa.
    reason: lexical_alternative
  - marker: b
    text: Au “hazina.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaendeleza maelezo ya mpangilio wa majukumu uliotangulia; “kwa maana” kinafaa katika mtiririko huo.
- source_word: בֶאֱמוּנָה
  choice: walihudumu kwa uaminifu
  rationale: אֱמוּנָה huonyesha uaminifu, kutegemeka, au kuwa katika nafasi ya kuaminiwa. Katika muktadha wa utumishi wa hekalu, usemi huu wa Kiswahili ni wa kawaida na unabaki karibu na msisitizo wa Kiebrania bila kuufanya dhamana ya kiutawala kuwa maana pekee.
- source_word: אַרְבַּעַת גִּבֹּרֵי הַשֹּׁעֲרִים
  choice: wale walinda malango wanne hodari
  rationale: “Walinda malango” ni istilahi ya kawaida kwa watumishi waliolinda malango ya hekalu; “hodari” huhifadhi nguvu ya גִּבּוֹר, ambayo hapa inaweza kuonyesha uwezo au hadhi yao.
- source_word: הֵם הַלְוִיִּם
  choice: Wao walikuwa Walawi
  rationale: Kauli hii inawatambulisha wazi wale walinda malango kuwa Walawi, huku ikihifadhi msisitizo wa kiwakilishi cha Kiebrania.
- source_word: וְהָיוּ עַל
  choice: walikuwa na jukumu la
  rationale: Muundo היה על katika muktadha huu huonyesha kuwa chini ya usimamizi au wajibu wa mtu; tafsiri hii ni ya kawaida katika Kiswahili na haitilii ndani wazo lisilokuwapo la umiliki.
- source_word: הַלְּשָׁכוֹת
  choice: vyumba
  rationale: Neno hili hurejelea vyumba vilivyohusiana na huduma ya hekalu; “vyumba” ni wazi na la kawaida kwa wasomaji wa sasa.
- source_word: הָאֹצְרוֹת
  choice: maghala
  rationale: אֹצָר inaweza kumaanisha ghala au hazina. “Maghala” linafaa kwa maana pana ya mahali pa kuhifadhi vitu, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Hii ni tafsiri ya moja kwa moja ya usemi wa Kiebrania na katika muktadha humaanisha hekalu bila kubadili taswira ya “nyumba.”
