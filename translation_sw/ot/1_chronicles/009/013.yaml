base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/013.yaml
  text: And their brothers[a], heads of their fathers’ houses[c][b], were 1,760 mighty men of valor for the work of the service of the house of God.
translation:
  language: sw
  text: Nao ndugu zao[a], waliokuwa viongozi wa koo za baba zao, walikuwa watu 1,760, watu hodari[b] kwa kazi ya utumishi wa nyumba ya Mungu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa ukoo wao.” Neno la Kiebrania linalotafsiriwa “ndugu” linaweza pia kumaanisha jamaa wa ukoo, si ndugu wa kuzaliwa tu.
    reason: lexical_alternative
  - marker: b
    text: Au “watu mashujaa” au “watu wenye uwezo.” Kirai cha Kiebrania kinaonyesha nguvu, ushujaa, au uwezo uliothibitishwa; hapa si lazima kimaanishe mashujaa wa vita.
    reason: lexical_alternative
  - marker: c
    text: Yaani, hekalu.
    reason: clarification
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Nao ndugu zao
  rationale: Neno אָח katika wingi linaweza kumaanisha ndugu wa kuzaliwa au wanaume wengine wa ukoo. “Ndugu zao” linahifadhi lugha ya kifamilia ya Kiebrania, huku tanbihi ikionyesha upana wake wa maana.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: viongozi wa koo za baba zao
  rationale: Hiki ni kirai cha kiukoo na kiutawala. “Viongozi” linaonyesha רָאשִׁים, na “koo za baba zao” linahifadhi wazo la nasaba ya upande wa baba bila kutumia Kiswahili kisicho cha kawaida cha “nyumba za baba.”
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: 1,760
  rationale: Mfuatano wa namba za Kiebrania una jumla ya 1,760; tarakimu zinafaa kwa usomaji wa kawaida wa Kiswahili cha sasa.
- source_word: גִּבּוֹרֵי חֵיל
  choice: watu hodari na wenye uwezo
  rationale: Kirai hiki huonyesha nguvu, ushujaa, uwezo, au uthabiti uliothibitishwa. Kwa kuwa muktadha ni huduma ya nyumba ya Mungu, tafsiri hii haiwalazimishi waeleweke kuwa askari.
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: kazi ya huduma
  rationale: “Kazi” linawakilisha מְלָאכָה na “huduma” linawakilisha עֲבוֹדָה. Muundo huu wa kawaida wa Kiswahili unahifadhi dhana zote mbili bila kurudia maneno kwa namna nzito.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Hii ndiyo maana ya moja kwa moja ya kirai cha Kiebrania. Katika muktadha inarejelea hekalu, lakini “nyumba ya Mungu” inahifadhi taswira na uzito wa usemi wa chanzo.
theological_decisions:
- issue: Lugha ya undugu katika wingi wa kiume
  choice: ndugu zao
  alternative: watu wa ukoo wao
  rationale: Muktadha wa nasaba na ukuhani unawahusu wanaume, na neno la chanzo ni la kifamilia. “Ndugu” linadumisha usemi huo huku tanbihi ikizuia maana yake kufungiwa kwa ndugu wa kuzaliwa pekee.
- issue: Maana ya גִּבּוֹרֵי חֵיל katika huduma ya hekalu
  choice: watu hodari na wenye uwezo
  alternative: mashujaa wa vita
  rationale: Kirai kinaweza kutumiwa kwa mashujaa wa vita, lakini hapa kazi yao ni huduma katika nyumba ya Mungu. Tafsiri iliyochaguliwa huhifadhi sifa ya nguvu na ustadi bila kuingiza muktadha wa kijeshi usiotajwa.
- issue: Jina la mahali pa ibada
  choice: nyumba ya Mungu
  alternative: hekalu la Mungu
  rationale: Chanzo kinasema kihalisi “nyumba ya Mungu.” Ingawa mahali panaporejelewa ni hekalu, tafsiri ya moja kwa moja huepuka kubadili taswira ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umewekwa wazi kwa kuongeza kitenzi “walikuwa,” kinachodokezwa katika sentensi ya Kiebrania isiyo na kitenzi. “Kazi ya huduma” ni ya kawaida zaidi kuliko urudiaji mzito kama “kazi ya utumishi,” huku ikihifadhi nomino zote mbili za chanzo.
