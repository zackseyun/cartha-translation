  naturalness: Kiswahili ni sanifu, wazi, na kinafaa kwa orodha ya nasaba. Urudiaji wa “mwana wa” ni wa asili katika mtindo wa kibiblia na unadumisha muundo wa chanzo. Nusu koloni hutenganisha matawi mawili ya orodha kwa ufasaha bila kubadili uhusiano wa kisintaksia.
