id: 1CH.9.12
reference: 1 Chronicles 9:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/עֲדָיָה֙ בֶּן יְרֹחָ֔ם בֶּן פַּשְׁח֖וּר בֶּן מַלְכִּיָּ֑ה וּ/מַעְשַׂ֨י בֶּן עֲדִיאֵ֧ל בֶּן יַחְזֵ֛רָה בֶּן מְשֻׁלָּ֥ם בֶּן מְשִׁלֵּמִ֖ית בֶּן אִמֵּֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/012.yaml
  text: and Adaiah son of Jeroham[a], son of Pashhur, son of Malchijah, and Maasai son of Adiel, son of Jahzerah, son of Meshullam, son of Meshillemith, son of Immer.
translation:
  language: sw
  text: na Adaya mwana wa Yerohamu, mwana wa Pashuri, mwana wa Malkiya; na Maasai mwana wa Adieli, mwana wa Yahzera, mwana wa Meshulamu, mwana wa Meshilemiti[a], mwana wa Imeri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hapa kina jina Meshilemiti; mahali pengine linapatikana umbo linalohusiana, Meshilemoti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲדָיָה
  choice: na Adaya
  rationale: Kiunganishi ו kimetafsiriwa “na” kwa kuwa kinaendeleza orodha ya mstari uliotangulia; jina limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika mfuatano huu wa nasaba, “mwana wa” ndilo linalolingana kwa karibu na muundo wa Kiebrania, bila kuondoa uwezekano wa matumizi mapana ya neno hilo katika nasaba.
- source_word: יְרֹחָם
  choice: Yerohamu
  rationale: Jina limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: פַּשְׁחוּר
  choice: Pashuri
  rationale: Jina limetoholewa kwa Kiswahili huku konsonanti kuu za Kiebrania zikihifadhiwa.
- source_word: מַלְכִּיָּה
  choice: Malkiya
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania; “ki” inadumisha konsonanti k badala ya kuingiza desturi ya Kiingereza ya “ch.”
- source_word: וּ/מַעְשַׂי
  choice: na Maasai
  rationale: Kiunganishi kimetafsiriwa “na”; jina limewasilishwa kulingana na umbo fupi la Kiebrania la mahali hapa, bila kulipanua kuwa Maaseya.
- source_word: עֲדִיאֵל
  choice: Adieli
  rationale: Jina limetoholewa kwa tahajia ya kawaida inayotamkika kwa Kiswahili.
- source_word: יַחְזֵרָה
  choice: Yahzera
  rationale: Y ya mwanzo inawakilisha י moja kwa moja kuliko J ya mapokeo ya Kiingereza, na umbo lote limetoholewa kwa Kiswahili.
- source_word: מְשֻׁלָּם
  choice: Meshulamu
  rationale: Jina limetoholewa kwa mfumo wa silabi unaosomeka kwa Kiswahili.
- source_word: מְשִׁלֵּמִית
  choice: Meshilemiti
  rationale: Chaguo hili linafuata moja kwa moja umbo la MT katika mstari huu, yaani מְשִׁלֵּמִית, na kulitofautisha na umbo linalohusiana Meshilemoti.
- source_word: אִמֵּר
  choice: Imeri
  rationale: Jina limetoholewa kwa tahajia na muundo wa silabi unaofaa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, kwa mtindo wa heshima na ulio wazi. Muundo unaorudiwa wa “mwana wa” umehifadhiwa kwa sababu ni orodha ya nasaba. Alama ya nusu koloni imetumiwa kutenganisha mistari miwili ya ukoo bila kubadili maana.
