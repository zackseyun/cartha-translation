  text: 'And from the sons of Zerah: Jeuel and their brothers[a], six hundred and ninety.'
translation:
  language: sw
  text: 'Na kutoka kwa wana wa Zera: Yeueli na ndugu zao[a], mia sita na tisini.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yeueli na ndugu zake, mia sita na tisini,” ikiwa Yeueli anaeleweka kuwa mwakilishi wa ukoo. Kiambishi cha Kiebrania katika “ndugu zao” ni cha wingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן
  choice: Na miongoni mwa
  rationale: Kiunganishi ו huendeleza orodha kutoka mstari uliotangulia, na מִן huonyesha kwamba watu hawa walitoka katika ukoo huo.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Hili ni tafsiri ya moja kwa moja inayofaa katika orodha ya nasaba, huku ikiruhusu maana pana ya wazao au watu wa ukoo.
- source_word: זֶרַח
  choice: Zera
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: יְעוּאֵל
  choice: Yeueli
  rationale: Jina limetoholewa kwa mfumo unaosomeka kwa urahisi katika Kiswahili.
- source_word: וַ/אֲחֵי/הֶם
  choice: na ndugu zao
  rationale: Kiambishi cha Kiebrania ni cha nafsi ya tatu wingi, kwa hiyo tafsiri hii inahifadhi wingi wa maandishi badala ya kuubadili kuwa umoja.
- source_word: שֵׁשׁ מֵאוֹת וְ/תִשְׁעִים
  choice: watu mia sita na tisini
  rationale: Idadi imeandikwa kwa maneno kwa mtindo wa kawaida wa Biblia; neno 'watu' linaweka wazi kuwa hii ni jumla ya walioorodheshwa bila kubadili thamani ya namba.
