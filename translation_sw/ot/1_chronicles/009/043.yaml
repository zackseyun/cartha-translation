  yaml_path: translation/ot/1_chronicles/009/043.yaml
  text: And Moza fathered Binea[a], and his son was Rephaiah, his son Eleasah, his son Azel.
translation:
  language: sw
  text: Na Moza akamzaa Binea[a], na mwanawe alikuwa Refaya, mwanawe Eleasa, mwanawe Aseli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, kwa tafsiri ya moja kwa moja, “na Refaya mwanawe, Eleasa mwanawe, Aseli mwanawe.” Neno “alikuwa” limeongezwa katika kishazi cha kwanza ili mfuatano wa nasaba usomeke kwa kawaida katika Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא
  choice: Moza
  rationale: Jina la mtu limetoholewa kwa kufuata matamshi ya Kiebrania na matumizi ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, kausativi ya ילד humaanisha kumzaa au kuwa baba wa mtu. ‘Akamzaa’ ni ya asili, fupi, na wazi katika Kiswahili.
- source_word: אֶת
  choice: '[halijatafsiriwa kivyake]'
  rationale: Ni kiashiria cha yambwa tendwa katika Kiebrania, kisicho na neno huru linalolingana nacho katika Kiswahili.
- source_word: בִּנְעָא
  choice: Binea
  rationale: Jina limetoholewa kwa karibu na umbo lenye irabu katika maandishi ya Kimasora.
- source_word: וּרְפָיָה בְנוֹ
  choice: na mwanawe alikuwa Refaya
  rationale: Kiebrania kinaendeleza nasaba kwa kishazi kisicho na kitenzi, ‘na Refaya mwanawe.’ Kiswahili kinaongezewa ‘alikuwa’ ili sentensi isomeke kwa kawaida bila kuongeza tendo jipya la kuzaa.
- source_word: אֶלְעָשָׂה בְנוֹ
  choice: mwanawe Eleasa
  rationale: Huhifadhi mtiririko wa nasaba na urudiaji wa uhusiano wa mwana kwa muundo mfupi wa Kiswahili.
- source_word: אָצֵל בְנוֹ
  choice: mwanawe Aseli
  rationale: Huhifadhi mshiriki wa mwisho wa nasaba pamoja na uhusiano wake wa mwana; jina limetoholewa kama Aseli kwa matamshi ya kawaida ya Kiswahili.
