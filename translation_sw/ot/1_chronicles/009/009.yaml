base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/009.yaml
  text: And their brothers[a], according to their generations, were nine hundred and fifty-six[b]. All these men were heads of fathers’ houses in their fathers’ households.
translation:
  language: sw
  text: Ndugu zao, kwa nasaba zao[a], walikuwa mia tisa hamsini na sita. Wanaume hawa wote walikuwa wakuu wa jamaa za baba, wa nyumba za baba zao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa kumbukumbu za vizazi vyao.” Neno la Kiebrania linahusu mistari ya uzao au kumbukumbu za kifamilia.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “wakuu wa baba ... wa nyumba za baba zao.” Huu ni usemi wa kinasaba unaorejelea wakuu wa vitengo vya familia/ukoo vinavyohesabiwa kwa nasaba ya baba.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Ndugu zao
  rationale: Neno אָח kwa kawaida humaanisha ndugu, lakini katika orodha za nasaba linaweza pia kuwahusu watu wa ukoo mmoja. “Ndugu zao” linahifadhi lugha ya undugu ya Kiebrania bila kuibana zaidi ya muktadha.
- source_word: לְתֹלְדוֹתָם
  choice: kwa nasaba zao
  rationale: Katika muktadha huu תּוֹלְדוֹת hurejelea mistari au kumbukumbu za uzao. “Kwa nasaba zao” ni ya kawaida na wazi zaidi katika Kiswahili kuliko tafsiri sisisi “kwa vizazi vyao.”
- source_word: תְּשַׁע מֵאוֹת וַחֲמִשִּׁים וְשִׁשָּׁה
  choice: mia tisa hamsini na sita
  rationale: Hii ni tafsiri ya kawaida ya idadi 956 katika Kiswahili.
- source_word: כָּל אֵלֶּה אֲנָשִׁים
  choice: Wanaume hawa wote
  rationale: אֲנָשִׁים hapa inawahusu wanaume waliotajwa katika orodha ya nasaba, hivyo jinsia ya rejeleo imehifadhiwa.
- source_word: רָאשֵׁי אָבוֹת
  choice: wakuu wa jamaa za ukoo
  rationale: Hili ni jina la kijamii na kinasaba kwa viongozi wa vitengo vya kifamilia vinavyotokana na mababu. Tafsiri hii inaleta maana hiyo kwa Kiswahili cha kawaida bila kutumia usemi usio wa asili kama “vichwa vya baba.”
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: katika nyumba za baba zao
  rationale: “Nyumba za baba” hapa ni kaya au koo pana zinazofuatwa kwa upande wa baba. Muundo huo umehifadhiwa ili kudumisha taswira ya kijamii ya Kiebrania.
