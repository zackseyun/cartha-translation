translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Istilahi “nasaba,” “jamaa za ukoo,” na “nyumba za baba” zinadumisha mtindo wa orodha ya kinasaba ya Mambo ya Nyakati huku zikiepuka tafsiri sisisi isiyo ya kawaida.
