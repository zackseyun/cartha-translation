translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Usemi “hao ndio” umetumika kuhifadhi mkazo wa Kiebrania; “kambi” limeachwa ili kutatua kwa tahadhari maana inayoweza kuwa ya mahali au ya mpangilio wa vikundi.
