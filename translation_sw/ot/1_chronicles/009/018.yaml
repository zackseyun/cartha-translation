  yaml_path: translation/ot/1_chronicles/009/018.yaml
  text: Until then they were at the king’s gate on the east[b][a]; they were the gatekeepers for the camps of the sons of Levi.
translation:
  language: sw
  text: Mpaka wakati huo walikuwa kwenye lango la mfalme upande wa mashariki; hao ndio waliokuwa walinzi wa malango kwa ajili ya kambi za wana wa Lawi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mpaka sasa” au “Hadi hapo.” Neno “kambi” pia linaweza kumaanisha vikundi au makundi yaliyopangwa ya wana wa Lawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד הֵנָּה
  choice: Mpaka wakati huo
  rationale: Nahau hii inaonyesha mwendelezo hadi wakati unaotajwa katika simulizi; tafsiri hii ni ya asili kwa Kiswahili huku ikihifadhi uwezekano wa maana ya “mpaka sasa.”
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: kwenye lango la mfalme
  rationale: בְּ ni ya mahali hapa, na “kwenye lango la mfalme” ni Kiswahili cha kawaida kinachohifadhi muundo wa Kiebrania.
- source_word: מִזְרָחָה
  choice: upande wa mashariki
  rationale: Umbo hili linaeleza mahali au mwelekeo wa mashariki; “upande wa mashariki” linafaa kwa mahali pa lango.
- source_word: הֵמָּה
  choice: hao ndio waliokuwa
  rationale: Kiwakilishi huru kina mkazo wa kuwatambulisha watu waliotajwa; “hao ndio” huhifadhi mkazo huo.
- source_word: הַשֹּׁעֲרִים
  choice: walinda malango
  rationale: Nomino hii inawataja watu waliowekwa kulinda au kusimamia malango; “walinda malango” ni wazi na ya kawaida katika Kiswahili.
- source_word: לְמַחֲנוֹת
  choice: wa kambi
  rationale: מַחֲנוֹת kimsingi ni “kambi,” ingawa katika muktadha huu inaweza pia kumaanisha vikundi vilivyopangwa; tafsiri ya moja kwa moja inalinda utata huo.
- source_word: בְּנֵי לֵוִי
  choice: wana wa Lawi
  rationale: Huhifadhi usemi wa ukoo wa Kiebrania badala ya kuufupisha kuwa “Walawi.”
