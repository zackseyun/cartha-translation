base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/002.yaml
  text: The first inhabitants who lived in their possessions in their cities were Israel[a], the priests, the Levites, and the temple servants.
translation:
  language: sw
  text: Wakazi wa kwanza waliokaa katika milki zao, katika miji yao, walikuwa Waisraeli, makuhani, Walawi na watumishi wa Hekalu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, Wanethini, jina la jadi la kundi lililowekwa kufanya huduma ya Hekalu.
    reason: 'Mbadala wa kileksika: tanbihi huhifadhi jina la jadi la kundi hili huku matini kuu ikieleza kazi yao.'
lexical_decisions:
- source_word: וְהַיּוֹשְׁבִים
  choice: Wakazi
  rationale: Kivumishi-tendo kutoka ישׁב kinamaanisha watu wanaokaa mahali; “wakazi” ni Kiswahili cha kawaida na kinachofaa katika muktadha huu.
- source_word: הָרִאשֹׁנִים
  choice: wa kwanza
  rationale: Neno hili linaweza kumaanisha “wa kwanza” au “wa awali”; hapa linaonyesha wakazi wa kwanza katika muktadha wa kurejea na kukaa tena.
- source_word: אֲשֶׁר
  choice: waliokaa
  rationale: Kiwakilishi cha uhusiano kimeunganishwa kiasili na kitenzi katika Kiswahili ili kuunda kishazi “waliokaa.”
- source_word: בַּאֲחֻזָּתָם
  choice: katika milki zao
  rationale: אֲחֻזָּה hueleza milki au eneo linalomilikiwa, mara nyingi likiwa milki ya kudumu au ya kurithi; “milki zao” huhifadhi maana hiyo bila kuongeza ufafanuzi usiotajwa wazi.
- source_word: בְּעָרֵיהֶם
  choice: katika miji yao
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya kishazi hicho.
- source_word: יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa Kiebrania kina jina la pamoja “Israeli,” hapa linataja kundi la watu sambamba na makuhani, Walawi na watumishi wa Hekalu; “Waisraeli” ni wazi na ya asili kwa Kiswahili.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֲנִים.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi la Walawi.
- source_word: וְהַנְּתִינִים
  choice: na watumishi wa Hekalu[a]
  rationale: נְתִינִים ni jina la kundi maalumu lililopewa kazi za huduma ya Hekalu. Tafsiri ya kazi yao inaeleweka kwa msomaji wa leo, huku jina la Kiebrania likihifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa orodha na tofauti kati ya Waisraeli, makuhani, Walawi na watumishi wa Hekalu umehifadhiwa. Kiunganishi cha mwanzo וְ hakijatafsiriwa kwa “Basi” au “Sasa,” kwa kuwa hapa hakionyeshi neno la wazi la wakati.
