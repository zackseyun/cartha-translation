  text: 'The gatekeepers were at the four directions: east[a], west, north, and south.'
translation:
  language: sw
  text: 'Walinda malango walikuwa katika pande nne[a]: mashariki, magharibi, kaskazini na kusini.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, neno kwa neno, “kwa pepo nne”; hapa “pepo” humaanisha pande nne za dira.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבַּע רוּחוֹת
  choice: katika pande nne
  rationale: Kirai hiki kwa neno halisi ni ‘kwa pepo nne,’ lakini katika muktadha wa orodha ya sehemu kuu za dira kinamaanisha pande nne. ‘Katika’ linaeleza mahali walipokuwa bila kuongeza wazi wazo la kupangiwa vituo.
- source_word: יִהְיוּ
  choice: walikuwa
  rationale: Kitenzi cha Kiebrania ni ‘walikuwa/watakuwa.’ Muktadha wa simulizi unaunga mkono wakati uliopita, na tafsiri hii haiongezi dhana isiyotajwa wazi ya ‘kuwekwa vituoni.’
- source_word: הַשֹּׁעֲרִים
  choice: walinda malango
  rationale: Nomino hii inawataja watu waliokuwa na jukumu la kulinda au kutunza malango, hasa katika mazingira ya hekalu.
- source_word: מִזְרָח
  choice: mashariki
  rationale: Ni upande wa mashariki katika orodha ya pande kuu za dira.
- source_word: יָמָּה
  choice: magharibi
  rationale: Ingawa umbo hili lina maana ya kuelekea baharini, katika jiografia ya Israeli na katika orodha hii humaanisha magharibi.
- source_word: צָפוֹנָה
  choice: kaskazini
  rationale: Umbo elekezi limetafsiriwa kwa kawaida kama upande wa kaskazini.
- source_word: וָנֶגְבָּה
  choice: na kusini
  rationale: Hapa נגב ni upande wa kusini katika orodha ya pande za dira, si lazima eneo maalumu la Negebu.
