id: 1CH.9.16
reference: 1 Chronicles 9:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עֹבַדְיָה֙ בֶּֽן שְׁמַֽעְיָ֔ה בֶּן גָּלָ֖ל בֶּן יְדוּת֑וּן וּ/בֶרֶכְיָ֤ה בֶן אָסָא֙ בֶּן אֶלְקָנָ֔ה הַ/יּוֹשֵׁ֖ב בְּ/חַצְרֵ֥י נְטוֹפָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/016.yaml
  text: and Obadiah son of Shemaiah[a], son of Galal, son of Jeduthun, and Berechiah son of Asa, son of Elkanah, who lived in the villages of the Netophathites.
translation:
  language: sw
  text: na Obadia mwana wa Shemaya, mwana wa Galali, mwana wa Yeduthuni; na Berekia mwana wa Asa, mwana wa Elkana, aliyekaa katika vijiji vya Wanetofa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika makazi ya Netofa”—neno la Kiebrania linaweza kumaanisha ama watu wa Netofa ama mahali paitwapo Netofa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עֹבַדְיָה
  choice: na Obadia
  rationale: Kiunganishi cha Kiebrania kinaendeleza orodha iliyotangulia; jina limetoholewa kwa namna ya kawaida ya Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika nasaba, tafsiri hii huhifadhi kwa kawaida uhusiano wa kifamilia unaoelezwa na neno la Kiebrania.
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: גָּלָל
  choice: Galali
  rationale: Jina limetoholewa kwa muundo unaofaa matamshi ya Kiswahili.
- source_word: יְדוּתוּן
  choice: Yeduthuni
  rationale: Jina limetoholewa kwa kufuata kwa karibu umbo la Kiebrania na fonolojia ya Kiswahili.
- source_word: וּ/בֶרֶכְיָה
  choice: na Berekia
  rationale: Kiunganishi kinaendeleza orodha kwa mtu wa pili; jina limetoholewa kwa Kiswahili.
- source_word: אָסָא
  choice: Asa
  rationale: Jina la mtu limehifadhiwa kwa umbo lake linalofaa Kiswahili.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Jina limetoholewa kwa karibu kutoka Kiebrania.
- source_word: הַ/יּוֹשֵׁב
  choice: aliyekaa
  rationale: Kishirikishi chenye kibainishi kina kazi ya kishazi rejeshi na kinaeleza makao ya Berekia; 'aliyekaa' ni ya kawaida na yenye heshima katika Kiswahili.
- source_word: בְּ/חַצְרֵי
  choice: katika vijiji vya
  rationale: Katika muktadha huu wa kijiografia, neno linaashiria makazi madogo au vijiji, si nyua halisi.
- source_word: נְטוֹפָתִי
  choice: Wanetofa
  rationale: Umbo hili ni la jina la watu wanaohusishwa na Netofa; 'Wanetofa' huhifadhi maana hiyo kwa Kiswahili, huku uwezekano wa kulieleza kama jina la mahali ukiwekwa katika tanbihi.
