  text: Zechariah son of Meshelemiah was gatekeeper at the entrance to the tent of meeting[a].
translation:
  language: sw
  text: Zekaria mwana wa Meshelemia alikuwa mlinzi wa lango kwenye mwingilio wa hema ya kukutania.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bawabu kwenye mlango wa hema ya kukutania.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכַרְיָה
  choice: Zekaria
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: בֶּן
  choice: mwana wa
  rationale: Muktadha wa nasaba unaunga mkono maana ya moja kwa moja ya uhusiano wa mwana na baba.
- source_word: מְשֶׁלֶמְיָה
  choice: Meshelemia
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa.
- source_word: שֹׁעֵר
  choice: mlinzi wa lango
  rationale: Neno hili humaanisha mtu anayelinda njia ya kuingilia; usemi huu ni wazi na wa kawaida katika Kiswahili cha sasa.
- source_word: פֶּתַח
  choice: mwingilio
  rationale: Neno linataja nafasi au njia ya kuingilia, na 'mwingilio' linaendana kiasili na jukumu la mlinzi wa lango.
- source_word: לְאֹהֶל
  choice: wa hema
  rationale: Kiambishi ל kinaeleweka hapa kwa uhusiano na פתח, yaani mwingilio unaoelekea au ulio wa hema; Kiswahili cha kawaida hutumia 'mwingilio wa hema'.
- source_word: מוֹעֵד
  choice: kukutania
  rationale: Katika kirai maalumu אֹהֶל מוֹעֵד, neno hili linaonyesha kukutana katika mahali palipowekwa kwa kusudi hilo.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Hili ni jina la mahali patakatifu linalofuata kwa karibu muundo wa Kiebrania na ni usemi unaotambulika katika Kiswahili cha Biblia.
