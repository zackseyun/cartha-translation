  register: Kiswahili sanifu cha Afrika Mashariki, kwa mtindo wa orodha ya ukoo ulio wazi na wenye hadhi. Majina yametoholewa kwa kuzingatia maandishi ya Kiebrania na matamshi ya Kiswahili, si tahajia za Kiingereza.
