  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/יִבְנְיָה֙ בֶּן יְרֹחָ֔ם וְ/אֵלָ֥ה בֶן עֻזִּ֖י בֶּן מִכְרִ֑י וּ/מְשֻׁלָּם֙ בֶּן שְׁפַטְיָ֔ה בֶּן רְעוּאֵ֖ל בֶּן יִבְנִיָּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/008.yaml
  text: and Ibneiah son of Jeroham[a], and Elah son of Uzzi, son of Michri, and Meshullam son of Shephatiah, son of Reuel, son of Ibnijah.
translation:
  language: sw
  text: na Yibneya mwana wa Yerohamu[a], na Ela mwana wa Uzi, mwana wa Mikri, na Meshulamu mwana wa Shefatia, mwana wa Reueli, mwana wa Yibnia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Majina ya watu ya Kiebrania yametoholewa, si kutafsiriwa; katika tafsiri nyingine yanaweza kuandikwa kwa tahajia tofauti, kama vile Jibneya au Ragueli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: na
  rationale: Kiunganishi hiki kinaendeleza orodha ya majina kutoka mstari uliotangulia; kurudia “na” kunahifadhi mtiririko wa Kiebrania huku kukiwa kwa kawaida katika Kiswahili.
- source_word: יִבְנְיָה
  choice: Yibneya
  rationale: Ni jina la mtu; limetoholewa moja kwa moja kutoka umbo la Kiebrania kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika orodha hii ya ukoo, neno hili kwa kawaida linaonyesha uhusiano wa mwana na baba; muktadha hautoi sababu ya kulipanua kuwa “mzao wa.”
- source_word: יְרֹחָם
  choice: Yerohamu
  rationale: Jina la mtu limetoholewa kwa kufuata matamshi ya Kiebrania na muundo wa majina unaofaa Kiswahili.
- source_word: אֵלָה
  choice: Ela
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Jina la mtu limetoholewa kwa tahajia rahisi na ya asili katika Kiswahili.
- source_word: מִכְרִי
  choice: Mikri
  rationale: Tahajia “Mikri” inaakisi konsonanti za Kiebrania na huepuka kutumia “ch” ya Kiingereza, ambayo ingetamkwa tofauti katika Kiswahili.
- source_word: מְשֻׁלָּם
  choice: Meshulamu
  rationale: Jina limetoholewa kwa kuhifadhi sauti kuu za Kiebrania na kulifanya lisomeke kwa urahisi katika Kiswahili.
- source_word: שְׁפַטְיָה
  choice: Shefatia
  rationale: Jina limetoholewa kutoka Kiebrania; “sh” huwakilisha sauti שׁ na umbo hili linafaa matamshi ya Kiswahili.
- source_word: רְעוּאֵל
  choice: Reueli
  rationale: Jina limetoholewa moja kwa moja kutoka umbo la Kimasora רְעוּאֵל, bila kutumia lahaja ya mapokeo “Ragueli.”
- source_word: יִבְנִיָּה
  choice: Yibnia
  rationale: Jina la mtu limetoholewa kutoka Kiebrania; linatofautishwa na יִבְנְיָה mwanzoni mwa mstari kwa kufuata tofauti ya irabu katika maandishi ya Kimasora.
