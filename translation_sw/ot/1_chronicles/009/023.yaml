base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/023.yaml
  text: They and their sons were over the gates of the house of Yahweh[a], that is, the house of the tent, as guards.
translation:
  language: sw
  text: Wao na wana wao walikuwa wasimamizi wa malango ya nyumba ya Yahwe, yaani, nyumba ya hema[a], wakifanya kazi ya ulinzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “nyumba ya maskani.” Kiebrania: “nyumba ya hema.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם וּבְנֵיהֶם
  choice: Wao pamoja na wana wao
  rationale: Muundo huu unawasilisha kiwakilishi cha msisitizo pamoja na wana wao kwa Kiswahili cha kawaida, huku ukihifadhi kwamba מדובר ni wana wa kiume katika wajibu wa kurithi.
- source_word: עַל הַשְּׁעָרִים
  choice: walikuwa wasimamizi wa malango
  rationale: Katika muktadha huu עַל huonyesha mamlaka na wajibu juu ya malango, si kuwapo tu mahali hapo.
- source_word: לְבֵית יְהוָה
  choice: ya nyumba ya Yahwe
  rationale: Kirai hiki kinabainisha kwamba malango yalikuwa ya nyumba ya Yahwe; jina la Mungu יהוה limetoholewa kama “Yahwe.”
- source_word: לְבֵית הָאֹהֶל
  choice: yaani, nyumba ya hema
  rationale: Tafsiri hii inahifadhi maneno ya Kiebrania “nyumba ya hema” na kuyawasilisha kama maelezo yanayoambatana na “nyumba ya Yahwe,” bila kuyabadilisha moja kwa moja kuwa istilahi ya kiufafanuzi.
- source_word: לְמִשְׁמָרוֹת
  choice: wakifanya kazi ya ulinzi
  rationale: Nomino hii hurejelea zamu au wajibu wa kulinda; kauli hii ni ya asili katika Kiswahili na inaweka wazi kazi yao.
theological_decisions:
- issue: Uhusiano kati ya “nyumba ya Yahwe” na “nyumba ya hema”
  choice: 'Kukitafsiri kirai cha pili kama maelezo yanayofafanua cha kwanza: “yaani, nyumba ya hema.”'
  alternative: Kuvitafsiri kama mahali pawili tofauti, au kubadili “nyumba ya hema” moja kwa moja kuwa “maskani.”
  rationale: Muundo wa Kiebrania unaweza kuonyesha uhusiano wa kimfafanuzi unaounganisha huduma ya nyumba ya Yahwe na patakatifu pa hema. Kuhifadhi virai vyote kunadumisha taswira hiyo bila kuvifanya kuwa maeneo mawili yasiyohusiana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Wasimamizi wa malango” linaonyesha wajibu wao, na “wakifanya kazi ya ulinzi” linaepuka tafsiri ngumu ya neno kwa neno ya zamu za ulinzi.
