  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מַתִּתְיָה֙ מִן הַ/לְוִיִּ֔ם ה֥וּא הַ/בְּכ֖וֹר לְ/שַׁלֻּ֣ם הַ/קָּרְחִ֑י בֶּ/אֱמוּנָ֕ה עַ֖ל מַעֲשֵׂ֥ה הַ/חֲבִתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/031.yaml
  text: And Mattithiah[a], from the Levites, the firstborn of Shallum the Korahite[b], was entrusted with the work of the flat cakes.
translation:
  language: sw
  text: Naye Matithia, mmoja wa Walawi, mzaliwa wa kwanza wa Shalumu wa ukoo wa Kora, alikabidhiwa[a] jukumu la kutengeneza mikate bapa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alitekeleza kwa uaminifu.” Kirai cha Kiebrania kinaweza kueleza ama uaminifu wa Matithia katika kazi yake, ama kwamba alipewa kwa dhamana jukumu hilo.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linarejelea aina fulani ya mkate uliookwa, huenda mkate wa kikaangio.
    reason: cultural_note
lexical_decisions:
- source_word: וּמַתִּתְיָה
  choice: Naye Matithia
  rationale: Kiunganishi kinaendeleza orodha, na jina limetoholewa kwa namna ya kawaida ya Kiswahili.
- source_word: מִן הַלְוִיִּם
  choice: mmoja wa Walawi
  rationale: מן hapa huonyesha kuwa Matithia alikuwa mshiriki wa kundi la Walawi; usemi huu ni wa asili katika Kiswahili.
- source_word: הוּא הַבְּכוֹר לְשַׁלֻּם
  choice: mzaliwa wa kwanza wa Shalumu
  rationale: בכור kwa kawaida humaanisha mzaliwa wa kwanza, na hapa inaonyesha uhusiano wa kifamilia.
- source_word: הַקָּרְחִי
  choice: wa ukoo wa Kora
  rationale: Neno hili ni jina la ukoo linalomaanisha mtu wa uzao au ukoo wa Kora; tafsiri ya wazi huepuka utata wa neno ‘mkora’ katika Kiswahili cha sasa.
- source_word: בֶּאֱמוּנָה עַל
  choice: alikabidhiwa jukumu
  rationale: Katika muktadha wa usimamizi, kirai kinaweza kuonyesha dhamana aliyokabidhiwa au namna yake ya uaminifu. Tafsiri kuu inaeleza jukumu la kuaminiwa, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: מַעֲשֵׂה
  choice: kutengeneza
  rationale: Ingawa neno lenyewe ni ‘kazi’ au ‘utendaji,’ katika muktadha wa chakula linarejelea kazi ya kuandaa au kutengeneza mikate.
- source_word: הַחֲבִתִּים
  choice: mikate bapa
  rationale: Neno la Kiebrania hurejelea aina ya mikate iliyookwa, huenda juu ya kikaangio au bamba; ‘mikate bapa’ huhifadhi maana halisi bila kuingiza wazo la dhabihu lisilotajwa wazi hapa.
theological_decisions:
- issue: Maana ya בֶּאֱמוּנָה katika wajibu wa Matithia
  choice: alikabidhiwa jukumu
  alternative: alitekeleza kwa uaminifu jukumu
  rationale: Muundo wa Kiebrania unaweza kueleweka kuwa alipewa dhamana au kuwa alifanya kazi kwa uaminifu. Maandishi makuu yanatumia maana inayofaa muktadha wa mgawanyo wa majukumu, lakini tanbihi inaacha utata huo wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wa ukoo wa Kora’ limetumiwa badala ya ‘Mkora’ ili kuepuka maana hasi ya kawaida ya neno hilo katika Kiswahili cha sasa. Alama za tanbihi zimewekwa kwenye virai vinavyohusika moja kwa moja.
