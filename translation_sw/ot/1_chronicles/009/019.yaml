  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/שַׁלּ֣וּם בֶּן ק֠וֹרֵא בֶּן אֶבְיָסָ֨ף בֶּן קֹ֜רַח וְֽ/אֶחָ֧י/ו לְ/בֵית אָבִ֣י/ו הַ/קָּרְחִ֗ים עַ֚ל מְלֶ֣אכֶת הָ/עֲבוֹדָ֔ה שֹׁמְרֵ֥י הַ/סִּפִּ֖ים לָ/אֹ֑הֶל וַ/אֲבֹֽתֵי/הֶם֙ עַל מַחֲנֵ֣ה יְהוָ֔ה שֹׁמְרֵ֖י הַ/מָּבֽוֹא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/019.yaml
  text: And Shallum son of Kore[a], son of Ebiasaph, son of Korah, and his brothers from his father’s house, the Korahites, were over the work of the service, keepers of the thresholds of the tent; and their fathers had been over the camp of Yahweh[b], keepers of the entrance.
translation:
  language: sw
  text: Naye Shalumu mwana wa Kore, mwana wa Ebiasafu, mwana wa Kora, na ndugu zake wa nyumba ya baba yake, Wakora, walisimamia kazi ya huduma, wakilinda vizingiti vya hema[a]. Nao baba zao walikuwa wamesimamia kambi ya Yahwe[b], wakilinda mahali pa kuingilia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakilinda malango ya hema.” Kwa Kiebrania, kihalisi ni “wakilinda vizingiti vya hema.”
    reason: lexical_alternative
  - marker: b
    text: Jina “Yahwe” linawakilisha jina la Mungu YHWH; kwa desturi mara nyingi hutafsiriwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁלּוּם
  choice: Naye Shalumu
  rationale: Kiunganishi cha Kiebrania kinaendeleza orodha iliyotangulia; “Naye” ni mwendelezo wa kawaida na wa asili katika Kiswahili.
- source_word: בֶּן ... בֶּן ... בֶּן
  choice: mwana wa ... mwana wa ... mwana wa
  rationale: Muundo wa nasaba umerudiwa kama ulivyo katika chanzo, kwa kuwa mstari unataja mlolongo mahususi wa ukoo.
- source_word: וְאֶחָיו לְבֵית אָבִיו
  choice: pamoja na ndugu zake wa ukoo wa baba yake
  rationale: “Ndugu” huhifadhi maana ya msingi ya אחים, na “ukoo wa baba yake” huwasilisha kwa Kiswahili cha kawaida wazo la nyumba au jamaa ya upande wa baba.
- source_word: הַקָּרְחִים
  choice: Wakora
  rationale: Umbo la Kiebrania linawataja watu wa ukoo wa Kora; “Wakora” ni namna ya kawaida ya Kiswahili ya kutaja kundi hilo.
- source_word: עַל מְלֶאכֶת הָעֲבוֹדָה
  choice: walisimamia kazi ya huduma
  rationale: עַל hapa huonyesha jukumu la usimamizi. “Huduma” huhifadhi maana ya kazi ya mahali patakatifu bila kuingiza kwa lazima dhana ya cheo cha kanisa.
- source_word: שֹׁמְרֵי הַסִּפִּים
  choice: wakilinda vizingiti
  rationale: Kitenzi-shirikishi kinaonyesha jukumu la kudumu la ulinzi, na “vizingiti” huhifadhi picha halisi ya neno ספים.
- source_word: לָאֹהֶל
  choice: vya hema
  rationale: Chanzo kinasema tu “hema”; tafsiri haikibadili kuwa istilahi ya kiufundi zaidi kama “maskani.”
- source_word: וַאֲבֹתֵיהֶם
  choice: Nao baba zao walikuwa wamesimamia
  rationale: “Baba zao” huhifadhi lugha ya kifamilia, huku “walikuwa wamesimamia” ikionyesha kuwa sentensi inatazama jukumu la kizazi cha zamani.
- source_word: עַל מַחֲנֵה יְהוָה
  choice: kambi ya Yahwe
  rationale: “Kambi” hudumisha taswira ya kambi ya Israeli iliyohusiana na mahali patakatifu, na “Yahwe” huwasilisha jina la Mungu lililoandikwa YHWH.
- source_word: שֹׁמְרֵי הַמָּבוֹא
  choice: wakilinda mahali pa kuingilia
  rationale: Kifungu hiki kinaonyesha kulinda sehemu ya kuingilia; tafsiri hii ni ya asili katika Kiswahili bila kuamua kimya kimya kwamba lazima palikuwa “lango.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kina jina binafsi YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, huku tanbihi ikifafanua desturi ya “BWANA.”
- issue: Iwapo אהל itafsiriwe kwa istilahi ya kiufundi ya mahali patakatifu
  choice: hema
  alternative: maskani
  rationale: Neno la Kiebrania ni “hema.” Tafsiri hii huhifadhi usemi wa chanzo na kuacha dokezo la kihistoria lisifafanuliwe kupita kiasi.
- issue: Iwapo ספים ielezwe kama malango
  choice: vizingiti
  alternative: malango
  rationale: “Vizingiti” ndiyo maana halisi ya neno, ingawa muktadha wa ulinzi unaweza kueleweka kuwa ni kazi ya walinda-malango. Uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa nasaba na urudiaji wa jukumu la ulinzi vimehifadhiwa, huku sentensi ikipangwa kwa mtiririko wa asili wa Kiswahili.
