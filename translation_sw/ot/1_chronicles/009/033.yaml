base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/033.yaml
  text: These were the singers[a], heads of fathers’ houses of the Levites, in the chambers, free from other duties, for they were occupied in the work day and night.
translation:
  language: sw
  text: Hawa ndio waimbaji, wakuu wa koo za Walawi, waliokuwa katika vyumba, wakiwa huru kutokana na majukumu mengine[a], kwa sababu walikuwa na jukumu la kazi hiyo mchana na usiku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wameachiliwa.” Neno la Kiebrania ni adimu, na huenda linamaanisha kwamba waliachiliwa kutoka majukumu mengine kwa sababu walikuwa na wajibu wa kudumu katika kazi ya uimbaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: waimbaji
  rationale: Kitenzi-jina hiki kutoka שׁיר kinamaanisha watu walioimba; “waimbaji” ni sahihi zaidi kuliko neno pana “wanamuziki.”
- source_word: רָאשֵׁי אָבוֹת
  choice: wakuu wa jamaa za ukoo
  rationale: Usemi huu unataja viongozi wa vikundi vya kifamilia vya mababu. Tafsiri hii inahifadhi muundo wa kijamii wa ukoo huku ikieleweka kwa Kiswahili cha sasa.
- source_word: לַלְוִיִּם
  choice: za Walawi
  rationale: Inaonyesha kuwa jamaa hizo na wakuu wake walikuwa za Walawi.
- source_word: בַּלְּשָׁכוֹת
  choice: katika vyumba
  rationale: לשכה ni chumba, mara nyingi ndani ya eneo la hekalu; “vyumba” haiingizi wazi neno “hekalu,” ambalo halimo katika kirai chenyewe.
- source_word: פטירים
  choice: walikuwa wameondolewa katika majukumu mengine
  rationale: Neno hili adimu linaelekea kumaanisha walioachiliwa au kusamehewa wajibu mwingine. Kutaja “majukumu mengine” kunaonyesha maana inayodokezwa na sababu inayofuata bila kudai kwamba hawakuwa na jukumu lolote.
- source_word: כִּי
  choice: kwa kuwa
  rationale: Kiunganishi hiki kinatoa sababu ya kuondolewa kwao katika majukumu mengine.
- source_word: יוֹמָם וָלַיְלָה
  choice: mchana na usiku
  rationale: Hii ni tafsiri ya moja kwa moja ya jozi ya wakati na inadokeza wajibu wa kudumu.
- source_word: עֲלֵיהֶם
  choice: waliwajibika kufanya
  rationale: Kihalisi ni “juu yao”; katika muktadha huu ni nahau ya jukumu au wajibu, inayotolewa kwa Kiswahili cha kawaida bila kupoteza nguvu yake.
- source_word: בַּמְּלָאכָה
  choice: kazi hiyo
  rationale: מלאכה ni kazi au shughuli. “Kazi hiyo” inabaki pana na kuacha muktadha uonyeshe aina ya huduma iliyohusika.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa baada ya utambulisho wa waimbaji ili kuepuka mlolongo mzito wa virai. “Walikaa katika vyumba” haiongezi “vya hekalu,” ingawa mazingira yanaelekea kuwa ya hekalu. Alama ya tanbihi imewekwa baada ya kirai kinachotafsiri neno adimu פטירים, si baada ya “waimbaji.”
