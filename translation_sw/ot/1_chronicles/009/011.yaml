  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/עֲזַרְיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖יד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/011.yaml
  text: and Azariah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub, chief officer of the house of God.
translation:
  language: sw
  text: na Azaria mwana wa Hilkia, mwana wa Meshulamu, mwana wa Sadoki, mwana wa Merayothi, mwana wa Ahitubu, kiongozi[a] wa nyumba ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, mkuu au mtawala.
    reason: Neno נְגִיד linaweza kumaanisha kiongozi, mkuu, au mtawala; muktadha unaonyesha mamlaka katika nyumba ya Mungu bila kutaja kwa usahihi cheo chake cha kiutawala.
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: na Azaria
  rationale: Kiunganishi וַ kimetafsiriwa “na” ili kuonyesha kuwa orodha ya mstari uliotangulia inaendelea; jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: בֶן
  choice: mwana wa
  rationale: Neno hili la nasaba limetafsiriwa kwa uthabiti kama “mwana wa.” Ingawa nasaba za Kiebrania zinaweza kuruka vizazi, muundo wa moja kwa moja hapa ni wa “mwana wa.”
- source_word: חִלְקִיָּה
  choice: Hilkia
  rationale: Jina limetoholewa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: מְשֻׁלָּם
  choice: Meshulamu
  rationale: Jina limetoholewa kwa kufuata matamshi ya Kiebrania na matumizi yaliyozoeleka ya Kiswahili.
- source_word: צָדוֹק
  choice: Sadoki
  rationale: Jina limetoholewa kwa umbo linalotumiwa kwa kawaida katika Kiswahili.
- source_word: מְרָיוֹת
  choice: Merayothi
  rationale: Jina limetoholewa kwa namna inayokaribia umbo la Kiebrania na inayosomeka kwa Kiswahili.
- source_word: אֲחִיטוּב
  choice: Ahitubu
  rationale: Jina limetoholewa kwa namna ya kawaida na inayosomeka kwa Kiswahili.
- source_word: נְגִיד
  choice: kiongozi
  rationale: נְגִיד humaanisha mtu aliyewekwa kusimamia au kuongoza. “Kiongozi” ni neno la kawaida, lenye heshima, na halibani maana kuwa cheo kimoja maalumu.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Tafsiri hii inahifadhi picha ya Kiebrania ya “nyumba” huku ikieleweka katika muktadha kuwa ni mahali patakatifu pa Mungu.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika jina la mahali patakatifu
  choice: Mungu
  alternative: miungu
  rationale: Katika muktadha wa mahali patakatifu pa Israeli, אֱלֹהִים humrejelea Mungu wa Israeli; kwa hiyo umoja “Mungu” ndio tafsiri sahihi.
- issue: Upeo wa cheo נְגִיד
  choice: kiongozi
  alternative: mkuu au mtawala
  rationale: Neno la Kiebrania linaweza kueleza uongozi, ukuu, au mamlaka ya usimamizi. “Kiongozi” huhifadhi upana huo bila kuamua kwa lazima aina maalumu ya cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaosomeka kwa urahisi. Mfuatano wa nasaba umehifadhiwa, na istilahi “nyumba ya Mungu” imeachwa badala ya kufafanuliwa moja kwa moja kuwa “hekalu la Mungu.”
