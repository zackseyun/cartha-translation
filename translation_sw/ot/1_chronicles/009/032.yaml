base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/032.yaml
  text: And some of the sons of the Kohathites[a], from among their brothers, were in charge of the bread of the arrangement, to prepare it Sabbath by Sabbath.
translation:
  language: sw
  text: Na baadhi ya wana wa ukoo wa Kohathi, kutoka miongoni mwa ndugu zao, walikuwa na jukumu la mikate iliyopangwa[a], ili kuandaa mikate hiyo kila Sabato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kimapokeo, “mikate ya wonyesho” au “mikate ya Uwepo.” Kiebrania kinarejelea kihalisi mikate iliyopangwa au kuwekwa kwa utaratibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Na baadhi ya
  rationale: Muunganiko wa kiunganishi na kihusishi unaonyesha sehemu ya kundi kubwa la Walawi; usemi huu unawasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: בְּנֵי הַקְּהָתִי
  choice: wana wa ukoo wa Kohathi
  rationale: Huhifadhi lugha ya kifamilia ya Kiebrania huku ikifafanua kwamba wanaotajwa ni watu wa ukoo wa Kohathi.
- source_word: מִן אֲחֵיהֶם
  choice: kutoka miongoni mwa ndugu zao
  rationale: Kihusishi מִן kina maana ya kuchagua baadhi kutoka katika kundi; “ndugu zao” hudumisha neno la kifamilia la Kiebrania bila kulifasiri zaidi.
- source_word: עַל
  choice: walikuwa na jukumu la
  rationale: Katika muktadha wa utumishi na usimamizi, עַל huonyesha kuwajibika kwa jambo fulani.
- source_word: לֶחֶם הַמַּעֲרָכֶת
  choice: mikate iliyopangwa
  rationale: Usemi huu unaonyesha mikate iliyowekwa kwa mpangilio; tafsiri hii ni ya asili kwa Kiswahili na huepuka istilahi ya kimapokeo isiyo wazi.
- source_word: לְהָכִין
  choice: ili kuiandaa
  rationale: Kitenzi-jina kinaonyesha kusudi la jukumu lao; kiwakilishi cha kitu kinarejelea mikate kama kitu kimoja kwa ujumla.
- source_word: שַׁבַּת שַׁבָּת
  choice: kila Sabato
  rationale: Kurudiwa kwa nomino kuna maana ya ugawaji au utaratibu unaojirudia; “kila Sabato” ni Kiswahili cha kawaida kinachowasilisha maana hiyo.
