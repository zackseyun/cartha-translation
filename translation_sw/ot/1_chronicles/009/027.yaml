base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/027.yaml
  text: They spent the night around the house of God[a], because the duty of guarding it was upon them, and they were in charge of opening it morning by morning.
translation:
  language: sw
  text: Walilala katika maeneo yaliyoizunguka nyumba ya Mungu, kwa sababu walikuwa na jukumu la ulinzi; nao walikuwa na jukumu la kufungua[a] kila asubuhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wasimamizi wa ufunguo.” Kiebrania kwa maana halisi kinaweza kumaanisha “ufunguo”; katika muktadha huu kinaweza pia kumaanisha wajibu wa kufungua nyumba ya Mungu kila asubuhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְבִיבוֹת
  choice: kandokando ya
  rationale: Inaonyesha eneo linaloizunguka nyumba ya Mungu; ‘kandokando ya’ ni Kiswahili cha kawaida chenye maana ya mahali pa kuizunguka.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Huhifadhi usemi halisi wa Kiebrania bila kuubadili moja kwa moja kuwa ‘hekalu,’ ingawa hapa unarejelea eneo la hekalu.
- source_word: יָלִינוּ
  choice: walikaa usiku
  rationale: Kitenzi kina maana ya kukaa au kulala mahali usiku; tafsiri hii ni ya kawaida na haidokezi lazima kuwa walilala bila kutekeleza ulinzi.
- source_word: עֲלֵיהֶם מִשְׁמֶרֶת
  choice: jukumu la kuilinda lilikuwa lao
  rationale: Huwasilisha kwa Kiswahili cha kawaida wajibu wa zamu au ulinzi uliowekwa juu yao.
- source_word: וְהֵם עַל הַמַּפְתֵּחַ
  choice: walikuwa na jukumu la ufunguo
  rationale: Huhifadhi taswira ya Kiebrania ya kuwa ‘juu ya ufunguo’ kwa namna inayoeleweka, bila kuamua kabisa ikiwa ni kutunza ufunguo au kusimamia kufungua.
- source_word: וְלַבֹּקֶר לַבֹּקֶר
  choice: kila asubuhi
  rationale: Urudiaji wa ‘asubuhi kwa asubuhi’ unaonyesha tendo la mara kwa mara; ‘kila asubuhi’ ni usemi wa asili katika Kiswahili.
