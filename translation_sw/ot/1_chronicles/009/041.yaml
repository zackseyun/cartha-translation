lexical_decisions:
- source_word: וּבְנֵי
  choice: Nao wana wa
  rationale: Kiunganishi וּ pamoja na wingi wa muundo tegemezi wa בֵּן huendeleza orodha ya ukoo; “Nao wana wa” hudumisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: מִיכָה
  choice: Mika
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: פִּיתוֹן
  choice: Pithoni
  rationale: Jina la mtu limetoholewa kwa namna inayolingana na matamshi na tahajia ya Kiswahili.
- source_word: וָמֶלֶךְ
  choice: Meleki
  rationale: Jina la mtu limetoholewa kwa Kiswahili; kiunganishi cha Kiebrania hakijarudiwa kwa sababu mtindo wa kawaida wa orodha ya Kiswahili hutumia “na” kabla ya jina la mwisho.
- source_word: וְתַחְרֵעַ
  choice: na Tahrea
  rationale: Kiunganishi וְ kimetafsiriwa “na,” nacho linafaa kabla ya kipengele cha mwisho katika orodha ya Kiswahili; jina limetoholewa kwa ukaribu na umbo la Kiebrania.
