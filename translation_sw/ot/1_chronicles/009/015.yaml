translation:
  language: sw
  text: na Bakbakari, Hereshi, na Galali, na Matania mwana[a] wa Mika[b], mwana wa Zikri, mwana wa Asafu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “mwana” linaweza wakati mwingine kumaanisha mzao wa baadaye; hapa limetafsiriwa moja kwa moja katika mfuatano wa nasaba.
    reason: lexical_alternative
  - marker: b
