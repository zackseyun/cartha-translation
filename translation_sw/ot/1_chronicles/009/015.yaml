lexical_decisions:
- source_word: וּ/בַקְבַּקַּר
  choice: na Bakbakari
  rationale: Kiunganishi וּ kimetafsiriwa “na” kwa kuwa kinaendeleza orodha; jina limeandikwa kwa umbo la Kiswahili linalokaribia matamshi ya Kiebrania.
- source_word: חֶרֶשׁ
  choice: Hereshi
  rationale: Jina la mtu limetoholewa kwa mfumo wa kawaida wa Kiswahili huku sauti ya mwisho ya Kiebrania ikiwakilishwa kwa “shi”.
- source_word: וְ/גָלָל
  choice: Galali
  rationale: Jina limetoholewa kwa Kiswahili; kiunganishi cha Kiebrania kinawakilishwa katika mtiririko wa orodha bila kulazimika kurudiwa kabla ya kila jina.
- source_word: וּ/מַתַּנְיָה
  choice: na Matania
  rationale: Kiunganishi kimedumishwa ili kuonyesha mshiriki wa mwisho wa sehemu hii ya orodha, na jina limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika mfuatano huu wa nasaba, maana ya moja kwa moja “mwana wa” inafaa zaidi, ingawa neno la Kiebrania linaweza pia kumaanisha mzao wa mbali zaidi.
- source_word: מִיכָא
  choice: Mika
  rationale: Umbo hili linafuata jina la Kiebrania מִיכָא na ni la asili katika tahajia ya Kiswahili.
- source_word: זִכְרִי
  choice: Zikri
  rationale: Jina limetoholewa kwa namna inayoakisi konsonanti za Kiebrania na inayosomeka kwa urahisi katika Kiswahili.
- source_word: אָסָף
  choice: Asafu
  rationale: Limetumiwa umbo la jina lililozoeleka katika Biblia za Kiswahili.
