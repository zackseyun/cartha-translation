  yaml_path: translation/ot/1_chronicles/009/014.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, from the sons of Merari.'
translation:
  language: sw
  text: 'Na kutoka kwa Walawi: Shemaya mwana wa Hashubu, mwana wa Azrikamu, mwana wa Hashabia, kutoka kwa wana wa Merari.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwa wazao wa Merari.” Neno la Kiebrania “wana” linaweza pia kurejelea ukoo mpana au wazao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Na miongoni mwa
  rationale: Kiunganishi וּ kinaendeleza orodha iliyotangulia, na מִן hapa humtenga mtu mmoja kutoka kundi; “Na miongoni mwa” ni ya kawaida na huhifadhi maana hiyo.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa watu wa kabila na huduma ya Lawi; umbo la Kiswahili halihitaji kibainishi tofauti cha Kiebrania.
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likifuata umbo la Kiebrania.
- source_word: בֶן
  choice: mwana wa
  rationale: Katika mfululizo huu wa nasaba, בֶן kwa kawaida huonyesha uhusiano wa baba na mwana; “mwana wa” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: חַשּׁוּב
  choice: Hashubu
  rationale: Jina limetoholewa kwa mfumo wa sauti wa Kiswahili; konsonanti iliyokaziwa katika Kiebrania haihitaji kuandikwa mara mbili katika tahajia ya Kiswahili.
- source_word: עַזְרִיקָם
  choice: Azrikamu
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili yenye irabu ya mwisho ili lisomeke kwa kawaida.
- source_word: חֲשַׁבְיָה
  choice: Hashabia
  rationale: Jina limetoholewa kwa umbo linalokaribia Kiebrania na kusomeka kwa kawaida katika Kiswahili.
- source_word: מִן בְּנֵי מְרָרִי
  choice: wa ukoo wa Merari
  rationale: Kirai hiki kinatambulisha tawi la nasaba ndani ya Walawi. “Wa ukoo wa Merari” hutoa maana ya kimuktadha kwa Kiswahili cha kawaida bila kudai kwamba wote waliotajwa ni wana wa moja kwa moja wa Merari.
