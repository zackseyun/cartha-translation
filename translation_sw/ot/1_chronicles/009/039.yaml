  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/039.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: sw
  text: Neri akamzaa Kishi, Kishi akamzaa Sauli, naye Sauli akawazaa Yonathani, Malki-Shua, Abinadabu, na Eshbaali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eshbaali anaitwa Ish-Boshethi katika 2 Samweli 2:8 na vifungu vingine vinavyohusiana.
    reason: Jina tofauti katika kifungu sambamba
lexical_decisions:
- source_word: הוֹלִיד
  choice: akamzaa / akawazaa
  rationale: Katika nasaba, Hiphil ya ילד humaanisha kumzaa au kuwa baba wa mtu. “Akamzaa” ni usemi wa kawaida, mfupi, na wenye hadhi katika Kiswahili; umbo la wingi “akawazaa” limetumiwa kwa wana wanne.
- source_word: נֵר
  choice: Neri
  rationale: Jina la mtu limetolewa kwa umbo linalotumika kwa kawaida katika tafsiri za Kiswahili.
- source_word: קִישׁ
  choice: Kishi
  rationale: Jina la mtu limetoholewa kwa mfumo wa kawaida wa majina ya Biblia katika Kiswahili.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Umbo la jina linalotambulika kwa kawaida na wasomaji wa Biblia ya Kiswahili.
- source_word: יְהוֹנָתָן
  choice: Yonathani
  rationale: Umbo la Kiswahili linalohifadhi utambulisho wa jina la Kiebrania na kueleweka kwa urahisi.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malki-Shua
  rationale: Jina ambatani limeandikwa kwa kistari ili kuonyesha kuwa vipashio viwili vya Kiebrania vinaunda jina moja.
- source_word: אֲבִינָדָב
  choice: Abinadabu
  rationale: Umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: אֶשְׁבָּעַל
  choice: Eshbaali
  rationale: Maandishi ya Mambo ya Nyakati yana jina אֶשְׁבָּעַל; limetafsiriwa moja kwa moja bila kulipatanisha kimya kimya na jina tofauti katika Samweli.
- source_word: וְ
  choice: aka- / naye / na
  rationale: Viunganishi vinavyorudiwa vimewakilishwa kwa mfululizo wa vitenzi vya Kiswahili na viunganishi vya kawaida, huku mtiririko wa nasaba ukihifadhiwa.
- source_word: אֶת
  choice: halijatafsiriwa kando
  rationale: Kihusishi hiki ni alama ya yambwa tendwa katika Kiebrania na hakina neno la moja kwa moja katika Kiswahili; kazi yake inaonekana katika muundo wa sentensi.
theological_decisions:
- issue: Tofauti ya jina אֶשְׁבָּעַל na Ish-Boshethi katika Samweli
  choice: Eshbaali katika maandishi makuu
  alternative: Ish-Boshethi
  rationale: Jina la maandishi ya msingi limehifadhiwa; tofauti inayojulikana katika 2 Samweli imetajwa katika tanbihi bila kudai kwamba ni usomaji mbadala wa mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa nasaba ni mfupi, wa sasa, na wenye hadhi. Kiambishi cha usimulizi “aka-” kinahifadhi mfululizo wa matukio bila kurudia “na” kupita kiasi. Alama ya tanbihi imewekwa mara moja baada ya jina linalohusika.
