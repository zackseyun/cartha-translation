  text: עוּתַ֨י בֶּן עַמִּיה֤וּד בֶּן עָמְרִי֙ בֶּן אִמְרִ֣י בֶן בני/מן בְּנֵי פֶ֖רֶץ בֶּן יְהוּדָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/004.yaml
  text: Uthai son of Ammihud[a], son of Omri, son of Imri, son of Bani, from the sons of Perez son of Judah.
translation:
  language: sw
  text: Utai mwana wa Amihudi, mwana wa Omri, mwana wa Imri, mwana wa Bani,[a] kutoka kwa wazao wa Peresi mwana wa Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mapokeo ya maandishi ya Kiebrania hapa yana utata. Neno lililotafsiriwa “Bani” linaweza pia kusomwa “kutoka kwa,” na hivyo kifungu kingekuwa: “mwana wa Imri, kutoka kwa wazao wa Peresi mwana wa Yuda.” Maandishi makuu yanafuata usomaji wa jina la nasaba kwa sababu unafaa zaidi mfululizo wa majina.'
    reason: textual_variant
lexical_decisions:
- source_word: עוּתַי
  choice: Utai
  rationale: Jina la mtu limetoholewa kwa mfumo unaosomeka kwa kawaida katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika nasaba, maana ya moja kwa moja ni “mwana wa”; muundo huu pia unaweza kutumika kwa vizazi vilivyorukwa katika orodha za nasaba.
- source_word: עַמִּיהוּד
  choice: Amihudi
  rationale: Jina la mtu limetoholewa kwa Kiswahili.
- source_word: עָמְרִי
  choice: Omri
  rationale: Jina la mtu limetoholewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: אִמְרִי
  choice: Imri
  rationale: Jina la mtu limetoholewa kwa Kiswahili huku likitofautishwa na Omri.
- source_word: בני/מן
  choice: Bani
  rationale: Usomaji kama jina la mtu unafaa mfululizo wa majina katika nasaba, ingawa mapokeo ya maandishi hapa yanaweza pia kuelekeza kwenye kihusishi “kutoka kwa”; uwezekano huo umehifadhiwa katika tanbihi.
- source_word: בְּנֵי
  choice: wazao wa
  rationale: Katika usemi wa ukoo, wingi wa בן humaanisha watu wa mstari wa nasaba; “wazao wa” ni Kiswahili cha asili na huepuka kueleweka kuwa wana wa moja kwa moja tu.
- source_word: פֶּרֶץ
  choice: Peresi
  rationale: Jina la mtu limetoholewa kwa umbo la Kiswahili.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Jina la mtu na kabila limetoholewa kwa umbo lililozoeleka katika Kiswahili.
