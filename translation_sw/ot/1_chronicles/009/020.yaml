  text: וּ/פִֽינְחָ֣ס בֶּן אֶלְעָזָ֗ר נָגִ֨יד הָיָ֧ה עֲלֵי/הֶ֛ם לְ/פָנִ֖ים יְהוָ֥ה עִמּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/020.yaml
  text: And Phinehas son of Eleazar had formerly been chief over them[a]; Yahweh was with him.
translation:
  language: sw
  text: Naye Finehasi mwana wa Eleazari hapo zamani alikuwa mkuu wao[a]; Yahwe alikuwa pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Naye Finehasi mwana wa Eleazari alikuwa mkuu wao hapo zamani.” Mpangilio wa maneno ya Kiebrania unaruhusu “hapo zamani” kuhusishwa kwa karibu ama na “alikuwa mkuu wao” ama na kauli nzima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס
  choice: Naye Finehasi
  rationale: Kiunganishi וּ kinaendeleza simulizi, na “Naye” ni njia ya asili ya Kiswahili ya kuunganisha sentensi huku jina likifuata tahajia ya kawaida ya kibiblia ya Kiswahili.
- source_word: בֶּן אֶלְעָזָר
  choice: mwana wa Eleazari
  rationale: Muundo huu unahifadhi kwa ufupi uhusiano wa ukoo unaoelezwa na Kiebrania.
- source_word: נָגִיד
  choice: mkuu
  rationale: Neno hili huonyesha mtu mwenye cheo cha uongozi au usimamizi; “mkuu” linafaa katika muktadha huu bila kuingiza maana mahususi ya kifalme.
- source_word: הָיָה
  choice: alikuwa
  rationale: Pamoja na לְפָנִים, kitenzi kinaeleza hali iliyokuwapo wakati uliopita; Kiswahili “alikuwa” huwasilisha jambo hilo kwa kawaida.
- source_word: עֲלֵיהֶם
  choice: mkuu wao
  rationale: Kiswahili cha asili huonyesha mamlaka inayodokezwa na על kwa kusema “mkuu wao,” yaani mwenye uongozi juu yao.
- source_word: לְפָנִים
  choice: hapo zamani
  rationale: Kirai hiki hutumika kama kielezi cha wakati uliopita. “Hapo zamani” ni cha sasa, kinachoeleweka, na huhifadhi uwezekano wa kukihusisha ama na kuwa mkuu ama na kauli nzima.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo; “Yahwe” ni umbo la kawaida la Kiswahili.
- source_word: עִמּוֹ
  choice: alikuwa pamoja naye
  rationale: Tafsiri ya moja kwa moja huhifadhi maana ya uwepo na kibali cha Mungu bila kuiongeza kwa ufafanuzi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Kifungu kinatumia moja kwa moja Tetragramatoni, hivyo jina binafsi “Yahwe” limehifadhiwa badala ya kuweka cheo mbadala.
- issue: Maana ya uwepo wa Mungu katika עִמּוֹ
  choice: alikuwa pamoja naye
  alternative: alimsaidia
  rationale: Kauli ya chanzo inaweza kujumuisha uwepo, kibali, na msaada wa Mungu. Tafsiri rahisi huhifadhi upana huo bila kuamua kimya-kimya kuwa inamaanisha msaada pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo umewekwa wa asili kwa Kiswahili huku utata halisi wa nafasi ya לְפָנִים ukihifadhiwa katika tanbihi.
