  text: Miklothi akamzaa Shimeamu[a]. Hao pia waliishi Yerusalemu mkabala na ndugu zao[b], pamoja na ndugu zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Shimeamu; tafsiri nyingine zina “Shimea,” huenda kwa kulinganisha na maumbo yanayofanana katika nasaba nyingine.'
    reason: alternative_reading
  - marker: b
    text: Au “mbele ya ndugu zao” au “karibu na ndugu zao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: Miklothi
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili; kiambishi וּ kinaendelezwa kwa mtiririko wa simulizi unaodokezwa na kitenzi “akamzaa”.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, Hifili ya ילד humaanisha kumzaa au kuwa baba wa mtu. “Akamzaa” ni fupi, ya kawaida katika Kiswahili, na inafaa kwa mwendelezo wa nasaba.
- source_word: אֶת שִׁמְאָם
  choice: Shimeamu
  rationale: Kiashiria cha yambwa אֶת hakitafsiriwi. Jina limetoholewa kulingana na umbo la konsonanti la maandishi haya, bila kulisawazisha na maumbo ya nasaba yanayofanana.
- source_word: וְאַף הֵם
  choice: Hao pia
  rationale: “Pia” huhifadhi maana ya nyongeza na msisitizo wa וְאַף, huku “hao” ikirejelea kundi lililotangulia kwa lugha ya asili na iliyo wazi.
- source_word: נֶגֶד
  choice: mkabala na
  rationale: Neno hili lina maana ya mahali panapokabiliana au palipo mbele ya kitu kingine. “Mkabala na” huhifadhi uhusiano huo wa mahali bila kuufasiri kupita kiasi.
- source_word: אֲחֵיהֶם
  choice: ndugu zao
  rationale: Tafsiri ya moja kwa moja ya neno la Kiebrania. Ingawa katika muktadha wa nasaba linaweza kumaanisha watu wa ukoo, “ndugu zao” huhifadhi usemi wa chanzo.
- source_word: יָשְׁבוּ
  choice: waliishi
  rationale: Katika taarifa hii ya makazi, ישב inaeleza kuishi mahali. “Waliishi” ni Kiswahili cha sasa na cha kawaida kuliko usemi wa kizamani.
- source_word: בִירוּשָׁלִַם
  choice: Yerusalemu
  rationale: Jina la mahali limetolewa kwa umbo lake la kawaida katika Kiswahili, huku kihusishi בִ kikiwakilishwa na muundo wa kitenzi “waliishi Yerusalemu”.
- source_word: עִם אֲחֵיהֶם
  choice: pamoja na ndugu zao
  rationale: “Pamoja na” huonyesha uhusiano wa ushirika wa עִם. Kurudiwa kwa “ndugu zao” kumehifadhiwa kwa kuwa kunapatikana pia katika Kiebrania na huenda kunasisitiza ukaribu wa watu wa ukoo.
