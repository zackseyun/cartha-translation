  yaml_path: translation/ot/1_chronicles/009/005.yaml
  text: 'And from the Shilonites: Asaiah the firstborn and his sons[a].'
translation:
  language: sw
  text: 'Na kutoka kwa Washiloni: Asaya, mzaliwa wa kwanza, na wanawe.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au yawezekana, “Washeloni,” kwa kufuata utambulisho mwingine wa kimapokeo wa jina hili la ukoo.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִן
  choice: Na kutoka kwa
  rationale: Kiunganishi וּ kinaunganisha kipengele hiki na orodha iliyotangulia, huku מִן ikionyesha asili ya ukoo; ‘Na kutoka kwa’ huhifadhi muundo huo wa nyongeza.
- source_word: הַ/שִּׁילוֹנִי
  choice: Washiloni
  rationale: Ingawa umbo la Kiebrania ni la umoja, katika orodha hii jina la kundi linatumika kwa maana ya pamoja. ‘Washiloni’ ni umbo la kawaida la Kiswahili kwa watu wa kundi hilo na linafuata usomaji wa moja kwa moja wa maandishi ya konsonanti.
- source_word: עֲשָׂיָה
  choice: Asaya
  rationale: Jina la mtu limetoholewa kwa mfumo wa majina ya kibiblia wa Kiswahili badala ya kutafsiriwa.
- source_word: הַ/בְּכוֹר
  choice: mzaliwa wa kwanza
  rationale: Neno בכור humaanisha mwana aliyezaliwa kwanza, si tu mtu mwenye umri mkubwa zaidi; tafsiri hii huhifadhi maana ya kifamilia.
- source_word: וּ/בָנָיו
  choice: na wanawe
  rationale: בנים hapa humaanisha ‘wana’ hasa, na kiambishi cha umilikaji kinaonyesha kuwa ni wana wa Asaya.
