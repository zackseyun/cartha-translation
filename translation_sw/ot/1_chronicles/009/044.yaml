  yaml_path: translation/ot/1_chronicles/009/044.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan[b]. These were the sons of Azel.'
translation:
  language: sw
  text: 'Azeli alikuwa na wana sita[a], na haya ndiyo majina yao: Azrikamu, mwana wake wa kwanza[b], Ishmaeli, Shearia, Obadia na Hanan. Hao ndio wana wa Azeli.'
  philosophy: optimal-equivalence
  footnotes:
