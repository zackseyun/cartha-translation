    text: 'Kwa tafsiri ya neno kwa neno zaidi: “Na kwa Azeli: wana sita.” Hii ni fomula ya kawaida ya nasaba katika Kiebrania.'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania “mwana wake wa kwanza” kinamtambulisha Azrikamu kuwa mwana wa kwanza wa Azeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָצֵל
  choice: Azeli alikuwa na
  rationale: Muundo wa Kiebrania wenye ל katika nasaba unaonyesha kuwa Azeli alikuwa na wana; Kiswahili hiki ni cha kawaida na kinahifadhi maana bila kunakili muundo usio wa asili.
- source_word: שִׁשָּׁה בָנִים
  choice: wana sita
  rationale: בָנִים humaanisha wana wa kiume, si watoto kwa ujumla.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: na haya ndiyo majina yao
  rationale: Kiwakilishi tamati cha wingi kinarejelea wana sita waliotajwa.
- source_word: עַזְרִיקָם
  choice: Azrikamu
  rationale: Jina limeandikwa kwa namna inayofuata matamshi ya Kiebrania na mazoea ya Kiswahili ya kuongeza irabu ya mwisho inapofaa.
- source_word: בֹּכְרוּ
  choice: mzaliwa wake wa kwanza
  rationale: Tamati ya umilikishi inaonyesha wazi kuwa Azrikamu ndiye mzaliwa wa kwanza wa Azeli.
- source_word: יִשְׁמָעֵאל
  choice: Ishmaeli
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: שְׁעַרְיָה
  choice: Shearia
  rationale: Unukuzi wa jina la Kiebrania unaosomeka kwa urahisi katika Kiswahili.
- source_word: עֹבַדְיָה
  choice: Obadia
  rationale: Umbo la kawaida la Kiswahili la jina hili la Kiebrania.
- source_word: חָנָן
  choice: Hanani
  rationale: Jina limenukuliwa kwa umbo la Kiswahili linalohifadhi kwa karibu matamshi ya Kiebrania.
- source_word: אֵלֶּה בְּנֵי אָצַל
  choice: Hao ndio wana wa Azeli
  rationale: Kauli hii inahifadhi fomula ya kufunga nasaba na kurudia jina la Azeli kwa uwazi.
