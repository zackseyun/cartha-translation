  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. Tafsiri inadumisha usemi wa nasaba “wana wa makuhani,” huku ikitumia sentensi ya kawaida ya Kiswahili kwa kazi ya kuandaa mchanganyiko wenye harufu nzuri.
