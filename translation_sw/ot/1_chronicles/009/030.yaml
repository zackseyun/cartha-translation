  text: And some of the sons of the priests were compounders of the ointment of spices[a].
translation:
  language: sw
  text: Baadhi ya wana wa makuhani walikuwa watengenezaji wa marhamu ya viungo vya kunukia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waandaaji wa mchanganyiko wa manukato.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Baadhi ya
  rationale: Muundo huu una maana ya sehemu ya kundi, yaani baadhi ya watu waliotoka miongoni mwa kundi lililotajwa. Kiswahili hiki ni cha kawaida na kinaepuka tafsiri ngumu ya neno kwa neno.
- source_word: בְּנֵי הַכֹּהֲנִים
  choice: wana wa makuhani
  rationale: Inahifadhi usemi wa kifamilia wa Kiebrania na ladha ya nasaba iliyo muhimu katika Mambo ya Nyakati.
- source_word: רֹקְחֵי
  choice: walitengeneza
  rationale: Kitenzi hiki hapa kinamaanisha kuandaa kitu kwa kuchanganya viambato. “Walitengeneza” ni cha asili katika Kiswahili na kinaonyesha kazi hiyo bila kudokeza taaluma maalumu isiyotajwa wazi.
- source_word: הַמִּרְקַחַת
  choice: mchanganyiko
  rationale: Nomino hii humaanisha kitu kilichotengenezwa kwa kuchanganya viambato, kama dawa ya kupaka au manukato. “Mchanganyiko” huhifadhi upana huo wa maana.
- source_word: לַבְּשָׂמִים
  choice: wa manukato
  rationale: Neno בְּשָׂמִים hurejelea vitu vyenye harufu nzuri au viungo vya kunukia. Katika muktadha huu, “manukato” ni usemi mfupi na wa kawaida, ingawa uhusiano unaoonyeshwa na ל unaweza pia kueleweka kuwa kwa ajili ya viungo vya kunukia.
