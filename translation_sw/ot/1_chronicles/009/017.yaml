  text: And the gatekeepers were Shallum[a], Akkub, Talmon, Ahiman, and their brothers; Shallum was the chief.
translation:
  language: sw
  text: Nao walinzi wa malango walikuwa Shalumu, Akubu, Talmoni, Ahimani, na ndugu zao[a]; Shalumu alikuwa mkuu wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa zao”; Kiebrania kinasema moja kwa moja “ndugu zao,” lakini katika orodha kama hii neno hilo linaweza kumaanisha ndugu wa damu au watu wa ukoo mmoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  choice: walinzi wa malango
  rationale: Neno hili linataja watu waliopewa jukumu la kulinda na kusimamia malango; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: שַׁלּוּם
  choice: Shalumu
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: עַקּוּב
  choice: Akubu
  rationale: Jina la mtu limetoholewa kwa muundo wa sauti unaofaa Kiswahili.
- source_word: טַלְמֹן
  choice: Talmoni
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: אֲחִימָן
  choice: Ahimani
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: אֲחִיהֶם
  choice: ndugu zao[a]
  rationale: Maana ya moja kwa moja ni ‘ndugu zao,’ lakini katika orodha kama hii neno linaweza pia kuwahusu jamaa wa ukoo; utata huo umehifadhiwa kwa tanbihi.
- source_word: הָרֹאשׁ
  choice: mkuu wao
  rationale: Katika muktadha huu neno linaonyesha cheo cha uongozi. Kiwakilishi ‘wao’ kinaweka wazi kwa Kiswahili cha kawaida kwamba Shalumu alikuwa mkuu wa kundi lililotajwa.
- source_word: וְ...וְ...וַ...וַ
  choice: Nao ... , ... , ... , na ...
  rationale: Viunganishi vinavyorudiwa katika Kiebrania vimewasilishwa kwa orodha ya kawaida ya Kiswahili huku nguvu ya kujumlisha ikihifadhiwa.
