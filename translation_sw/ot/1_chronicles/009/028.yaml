  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מֵ/הֶ֖ם עַל כְּלֵ֣י הָ/עֲבוֹדָ֑ה כִּֽי בְ/מִסְפָּ֣ר יְבִיא֔וּ/ם וּ/בְ/מִסְפָּ֖ר יוֹצִיאֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/028.yaml
  text: Some of them were in charge of the vessels of service[a], for they brought them in by count and took them out by count.
translation:
  language: sw
  text: Baadhi yao walisimamia vyombo vilivyotumiwa katika huduma[a], kwa maana waliviingiza kwa kuvihesabu na kuvitoa kwa kuvihesabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vifaa vya huduma” au “zana zilizotumiwa katika huduma.” Neno la Kiebrania linaweza kurejelea kwa upana vyombo, vifaa, au zana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם
  choice: Baadhi yao
  rationale: Muundo wa sehemu unaonyesha watu fulani kutoka katika kundi lililotangulia; ‘Baadhi yao’ ni Kiswahili cha kawaida na sahihi.
- source_word: עַל
  choice: walisimamia
  rationale: Katika muktadha wa wajibu, neno hili linaonyesha kuwa na uangalizi au dhamana juu ya kitu.
- source_word: כְּלֵי הָעֲבוֹדָה
  choice: vyombo vilivyotumiwa katika huduma
  rationale: כְּלִי ni neno pana linaloweza kumaanisha vyombo, vifaa, au zana; עֲבוֹדָה hapa ni huduma ya Hekalu. Tafsiri hii ni wazi bila kulifanya neno kuwa la kiufundi kupita kiasi.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha maelezo yanayoonyesha msingi au uthibitisho wa wajibu wao.
- source_word: בְמִסְפָּר
  choice: kwa kuvihesabu
  rationale: Kirai hiki kinaonyesha utunzaji wa hesabu kamili ya vyombo; muundo huo ni wa asili katika Kiswahili.
- source_word: יְבִיאוּם
  choice: waliviingiza
  rationale: Hifili ya בוא pamoja na kiambishi cha yambwa humaanisha kuvileta au kuviingiza; hali ya kutokamilika hapa inaeleza desturi ya mara kwa mara katika simulizi la wakati uliopita.
- source_word: וּבְמִסְפָּר
  choice: na ... kwa kuvihesabu
  rationale: Kurudiwa kwa kirai kunahifadhi msisitizo wa uwajibikaji na hesabu katika kuingiza na kutoa.
- source_word: יוֹצִיאוּם
  choice: kuvitoa
  rationale: Hifili ya יצא humaanisha kuvileta nje au kuvitoa, na hapa inalingana kwa kawaida na ‘waliviingiza.’
theological_decisions: []
