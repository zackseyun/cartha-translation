  text: וְ/אָחָז֙ הוֹלִ֣יד אֶת יַעְרָ֔ה וְ/יַעְרָ֗ה הוֹלִ֛יד אֶת עָלֶ֥מֶת וְ/אֶת עַזְמָ֖וֶת וְ/אֶת זִמְרִ֑י וְ/זִמְרִ֖י הוֹלִ֥יד אֶת מוֹצָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/042.yaml
  text: Ahaz fathered Jarah[a], and Jarah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: sw
  text: Ahazi akamzaa Yaara[a], naye Yaara akawazaa Alemethi, Azmawethi na Zimri; naye Zimri akamzaa Moza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nasaba inayolingana katika 1 Mambo ya Nyakati 8:36 ina jina “Yehoada” badala ya “Yaara.” Hati za Mambo ya Nyakati katika mstari huu zina “Yaara,” ambalo limehifadhiwa katika maandishi makuu.
    reason: textual_variant
lexical_decisions:
- source_word: הוֹלִיד
  choice: akamzaa / akawazaa
  rationale: Katika nasaba, umbo la Hifili la ילד humaanisha kumzaa au kuwa baba wa mtu. 'Akamzaa' ni lugha ya kawaida, yenye hadhi, na hudumisha maana ya nasaba ya upande wa baba; wingi 'akawazaa' umetumiwa kwa watoto watatu.
- source_word: יַעְרָה
  choice: Yaara
  rationale: Jina la mtu limenukuliwa kwa tahajia inayofaa Kiswahili na inayowakilisha matamshi ya Kiebrania.
- source_word: עָלֶמֶת
  choice: Alemethi
  rationale: Jina la mtu limenukuliwa kwa mfumo wa sauti wa Kiswahili.
- source_word: עַזְמָוֶת
  choice: Azmawethi
  rationale: Jina la mtu limenukuliwa kwa tahajia ya Kiswahili, huku sauti ya Kiebrania ikihifadhiwa kadiri inavyowezekana.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Jina la mtu limenukuliwa moja kwa moja na linaendana na mfumo wa sauti wa Kiswahili.
- source_word: מוֹצָא
  choice: Moza
  rationale: Jina la mtu limenukuliwa kwa namna iliyo wazi na ya kawaida katika Kiswahili.
- source_word: וְ
  choice: na / naye
  rationale: Kiunganishi kinaendeleza mfuatano wa nasaba. 'Naye' husaidia kubainisha mhusika mpya bila kuongeza maana isiyokuwapo katika chanzo.
- source_word: אֶת
  choice: '[hakikutafsiriwa moja kwa moja]'
  rationale: Kihisishi hiki cha Kiebrania hutambulisha yambwa mahususi na hakina kisawe cha moja kwa moja katika Kiswahili; kazi yake inaonekana katika muundo wa sentensi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa katika mtindo mfupi wa kinasaba. Majina yamenukuliwa kwa tahajia inayosomeka kwa Waswahili, na kiambishi cha yambwa cha nafsi kimetumiwa katika 'akamzaa/akawazaa' kwa mtiririko wa asili.
