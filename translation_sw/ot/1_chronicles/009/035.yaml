  yaml_path: translation/ot/1_chronicles/009/035.yaml
  text: In Gibeon lived Jeiel the father of Gibeon[b][a], and his wife's name was Maacah.
translation:
  language: sw
  text: Huko Gibeoni aliishi Yeieli[b], baba wa Gibeoni[a], na jina la mke wake lilikuwa Maaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwanzilishi wa Gibeoni” au “kiongozi wa Gibeoni”; Kiebrania halisi ni “baba wa Gibeoni.”
    reason: lexical_alternative
  - marker: b
    text: Katika baadhi ya namna za kulinakili jina hili kutoka Kiebrania, pia huandikwa “Yeueli”; linganisha kifungu sambamba katika 1 Mambo ya Nyakati 8:29.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְ/גִבְע֛וֹן
  choice: Huko Gibeoni
  rationale: Kiambishi cha mahali בְּ kinawakilishwa kwa Kiswahili cha kawaida kwa ‘huko’; וּ inaweza kutotafsiriwa wazi mwanzoni mwa taarifa hii bila kupoteza maana.
- source_word: יָשְׁב֥וּ
  choice: aliishi
  rationale: Kitenzi ישב hapa kinaonyesha makazi. Ingawa umbo la Kiebrania ni la wingi, desturi ya nasaba inamtambulisha mtu mmoja anayetajwa, hivyo Kiswahili cha kawaida hutumia umoja.
- source_word: אֲבִֽי גִבְע֖וֹן
  choice: baba wa Gibeoni
  rationale: Huhifadhi kwa uwazi usemi halisi wa Kiebrania. Katika muktadha huu ‘baba’ huenda ikamaanisha mwanzilishi, babu wa ukoo, au kiongozi wa mji; uwezekano huo umewekwa katika tanbihi.
- source_word: יעואל
  choice: Yeieli
  rationale: Umbo Yeieli linaungwa mkono na mapokeo ya usomaji na kifungu sambamba katika 1 Mambo ya Nyakati 8:29; tofauti ya umbo la jina imeelezwa katika tanbihi.
- source_word: וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ
  choice: na jina la mke wake lilikuwa
  rationale: Tafsiri hii ni ya kawaida na yenye hadhi katika Kiswahili, huku ikihifadhi muundo na uhusiano wa umilikaji.
- source_word: מַעֲכָֽה
  choice: Maaka
  rationale: Ni unukuzi wa kawaida wa jina hili la Kiebrania kwa tahajia ya Kiswahili.
