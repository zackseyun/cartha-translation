source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵל֙ הִתְיַחְשׂ֔וּ וְ/הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֖פֶר מַלְכֵ֣י יִשְׂרָאֵ֑ל וִ/יהוּדָ֛ה הָגְל֥וּ לְ/בָבֶ֖ל בְּ/מַעֲלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/001.yaml
  text: So all Israel was enrolled by genealogy[a], and behold, they are written in the Book of the Kings of Israel[b]; and Judah was taken into exile to Babylon because of their unfaithfulness.
translation:
  language: sw
  text: Basi, Waisraeli wote waliorodheshwa kwa nasaba zao[a], na tazama, wameandikwa katika Kitabu cha Wafalme wa Israeli; na watu wa Yuda walipelekwa uhamishoni Babeli kwa sababu ya ukosefu wao wa uaminifu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walihesabiwa kwa nasaba zao” au “walisajiliwa kwa nasaba zao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa sababu ya kuvunja uaminifu wao” au “kwa sababu ya usaliti wao.” Neno la Kiebrania lina maana ya kuvunja uaminifu au kutenda kwa hiana, hasa katika uhusiano na Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַחְשׂוּ
  choice: waliandikishwa kulingana na nasaba zao
  rationale: Kitenzi hiki kinamaanisha kuthibitisha au kuandika ukoo wa mtu katika kumbukumbu za nasaba, si kuwahesabu watu tu. Kauli hii ni ya kawaida na inaendeleza maana ya usajili wa kin asaba.
- source_word: וְהִנָּם
  choice: na tazama
  rationale: Neno hili linavuta fikira za msomaji kwenye taarifa inayofuata; “tazama” linahifadhi msisitizo huo kwa lugha yenye hadhi.
- source_word: כְּתוּבִים
  choice: wameandikwa
  rationale: Kauli-tendwa ya hali inaonyesha kwamba majina au nasaba zao zimo katika kumbukumbu iliyoandikwa.
- source_word: עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: katika Kitabu cha Wafalme wa Israeli
  rationale: Katika muktadha wa nyaraka, עַל pamoja na כתב hueleweka kiasili kama “katika.” “Kitabu” hapa ni kumbukumbu rasmi inayotambulika.
- source_word: וִיהוּדָה הָגְלוּ
  choice: nao watu wa Yuda walipelekwa uhamishoni
  rationale: Yuda ni jina la pamoja linalowakilisha watu wa ufalme huo. Umbo la kauli-tendwa linaonyesha walifanywa waende uhamishoni, si kwamba waliondoka kwa hiari.
- source_word: לְבָבֶל
  choice: Babeli
  rationale: Hili ni jina sanifu la Kiswahili la mahali walikopelekwa; kitenzi “walipelekwa” tayari kinaonyesha mwelekeo.
- source_word: בְּמַעֲלָם
  choice: kwa sababu ya kukosa kwao uaminifu
  rationale: מַעַל humaanisha kuvunja uaminifu au kutenda kwa hiana, hasa katika uhusiano na Mungu. Tafsiri hii inaonyesha sababu na uzito wa kosa bila kupanua matini.
theological_decisions:
- issue: Asili ya kosa la Yuda katika בְּמַעֲלָם
  choice: kukosa kwao uaminifu
  alternative: kosa lao; kuvunja kwao uaminifu
  rationale: Neno la Kiebrania lina maana ya kuvunja uaminifu, mara nyingi uaminifu wa agano, badala ya kosa la kawaida tu. Tafsiri haiongezi neno “agano,” ambalo halimo wazi katika mstari.
- issue: Kauli ya הָגְלוּ
  choice: walipelekwa uhamishoni
  alternative: walienda uhamishoni; walihamishwa
  rationale: Umbo la Kiebrania ni la kutendwa na linaonyesha kwamba Yuda walipatwa na uhamisho. Hivyo muktadha wa hukumu haupunguzwi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki chenye mtindo wa sasa, wa heshima na unaoeleweka. “Na tazama” limehifadhiwa kama kiashiria cha msisitizo wa kisimulizi. “Watu wa Yuda” linafafanua jina la pamoja na kuruhusu upatanisho wa kawaida wa Kiswahili.
