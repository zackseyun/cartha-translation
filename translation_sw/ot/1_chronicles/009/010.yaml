- source_word: וִיהוֹיָרִיב
  choice: Yehoyaribu
  rationale: Jina limenukuliwa kutoka Kiebrania, huku kiunganishi chake kikionyeshwa katika mtiririko wa orodha; umbo hili linafuata matumizi yanayotambulika katika Kiswahili cha Biblia.
- source_word: וְיָכִין
  choice: na Yakini
  rationale: Kiunganishi ו kimetafsiriwa “na,” na jina יָכִין limenukuliwa kwa umbo la Kiswahili linalotambulika.
