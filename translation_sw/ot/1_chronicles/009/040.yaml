translation:
  language: sw
  text: Na mwana wa Yehonathani alikuwa Merib-Baali[b][a], naye Merib-Baali akamzaa Mika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Katika mstari huu, Kiebrania linaandika jina la Merib-Baali kwa maumbo mawili yanayotofautiana kidogo: “Merib-Baali” na umbo fupi “Meri-Baali.” Tafsiri imetumia umbo moja kwa ajili ya uwazi.'
    reason: textual_variant
  - marker: b
    text: Katika 1 Samweli 14:49, mwana wa Sauli anaitwa “Yonathani” badala ya “Yehonathani.” Hapa umbo la Kiebrania katika Mambo ya Nyakati ni Yehonathani.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: Na mwana wa
  rationale: בֶן ni ‘mwana’; kiunganishi וּ kimetafsiriwa ‘Na’ ili kudumisha mwendelezo wa ukoo kutoka mstari uliotangulia.
- source_word: יְהוֹנָתָן
  choice: Yehonathani
  rationale: Jina limenukuliwa kwa kufuata umbo la Kiebrania lililo katika Mambo ya Nyakati, bila kulisawazisha kuwa Yonathani.
- source_word: מְרִיב בָּעַל
  choice: Merib-Baali
  rationale: Jina ambatani limenukuliwa kwa kistari; umbo ‘Baali’ linafuata namna ya kawaida ya kuingiza majina ya Kiebrania katika Kiswahili.
- source_word: וּ/מְרִי בַעַל
  choice: naye Merib-Baali
  rationale: וּ limetolewa kwa ‘naye’ kwa mtiririko wa asili. Ingawa hapa Kiebrania kina umbo fupi Meri-Baali, jina limesawazishwa na umbo kamili lililotangulia kwa uwazi, huku tofauti hiyo ikielezwa katika tanbihi.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, Hiphil ya ילד humaanisha baba kumzaa au kumzaa mwana; ‘akamzaa’ ni usemi mfupi, wa kawaida na unaofaa kwa nasaba.
- source_word: אֶת מִיכָה
  choice: Mika
  rationale: אֶת ni kiashiria cha yambwa mahususi na hakitafsiriwi; מִיכָה limenukuliwa kwa umbo la Kiswahili ‘Mika.’
