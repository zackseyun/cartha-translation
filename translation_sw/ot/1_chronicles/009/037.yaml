  rationale: Umbo “Zekaria” ni la kawaida na linalotambulika katika Biblia za Kiswahili kwa jina זְכַרְיָה; וּ limetafsiriwa “na”.
- source_word: וּ/מִקְלֽוֹת
  choice: na Miklothi
  rationale: Jina מִקְלוֹת limetoholewa kwa kuhifadhi sauti ya konsonanti ya mwisho th huku irabu ya mwisho ikirahisisha matamshi ya Kiswahili; וּ limetafsiriwa “na”.
