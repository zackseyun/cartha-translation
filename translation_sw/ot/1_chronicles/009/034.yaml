  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Jamaa za ukoo” linaeleza muundo wa kifamilia wa mababu kwa uwazi zaidi kuliko “nyumba za baba,” huku “viongozi wakuu” likihifadhi msisitizo wa marudio ya Kiebrania.
