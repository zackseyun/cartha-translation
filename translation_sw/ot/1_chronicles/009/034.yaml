base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/034.yaml
  text: These were the heads of the fathers’ houses of the Levites[a], according to their generations, heads[b]. These lived in Jerusalem.
translation:
  language: sw
  text: Hawa ndio waliokuwa viongozi wa jamaa za ukoo za Walawi, kulingana na vizazi vyao—viongozi wakuu.[a] Hawa waliishi Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinarudia neno lilelile la msingi lililotafsiriwa “viongozi” mwanzoni mwa mstari ili kusisitiza hadhi yao; linaweza pia kutafsiriwa “wakuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי
  choice: viongozi wa
  rationale: Katika hali ya muundo, neno hili linawataja watu walioongoza vitengo vya kijamii; “viongozi wa” ni Kiswahili cha sasa na cha kawaida.
- source_word: הָאָבוֹת
  choice: jamaa za ukoo
  rationale: Usemi huu unahusu vitengo vya kifamilia vya mababu au koo, si kaya za baba mmoja mmoja.
- source_word: לַלְוִיִּם
  choice: za Walawi
  rationale: Kiambishi ל hapa kinaonyesha uhusiano au uainishaji; jamaa hizo zilikuwa za Walawi.
- source_word: לְתֹלְדוֹתָם
  choice: kulingana na vizazi vyao
  rationale: תֹּלְדוֹת katika muktadha wa nasaba hurejelea vizazi au mistari ya uzao; tafsiri hii haiongezi wazo la kumbukumbu zilizoandikwa.
- source_word: רָאשִׁים
  choice: viongozi wakuu
  rationale: Nomino inayorudiwa inasisitiza hadhi yao. “Viongozi wakuu” huhifadhi msisitizo huo kwa Kiswahili cha asili bila kurudia “viongozi” kwa namna ngumu.
- source_word: יָשְׁבוּ
  choice: waliishi
  rationale: Hapa kitenzi kinaonyesha makao; “waliishi” ni cha wazi na cha sasa.
- source_word: בִירוּשָׁלִָם
  choice: Yerusalemu
  rationale: Jina la mahali limetolewa kwa umbo lake la kawaida katika Kiswahili.
theological_decisions: []
