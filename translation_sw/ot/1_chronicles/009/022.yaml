base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/022.yaml
  text: All these who were chosen as gatekeepers at the thresholds were two hundred and twelve[a]. They were enrolled by genealogy in their villages. David and Samuel the seer established them in their office of trust.
translation:
  language: sw
  text: Wote hao waliochaguliwa kuwa walinzi wa malango kwenye vizingiti walikuwa mia mbili na kumi na wawili. Waliandikishwa kwa nasaba katika vijiji vyao. Daudi na Samweli, mwonaji, waliwaweka katika wajibu wao wa uaminifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Daudi na Samweli, mwonaji, waliwaweka kwa sababu ya uaminifu wao,” au “waliwaweka katika uaminifu wao.”
    reason: Kirai cha Kiebrania בֶּאֱמוּנָתָם kinaweza kueleweka kuwa wajibu au utumishi wenye sifa ya uaminifu, au kuwa uaminifu wa watu hao.
lexical_decisions:
- source_word: הַבְּרוּרִים
  choice: waliochaguliwa
  rationale: Kitenzi hiki kinaonyesha watu walioteuliwa kutoka miongoni mwa wengine; “waliochaguliwa” huhifadhi maana ya uteuzi bila kufafanua utaratibu ambao maandiko hayautaji.
- source_word: לְשֹׁעֲרִים
  choice: kuwa walinzi wa malango
  rationale: Neno hili humaanisha watu wanaolinda malango au maingilio; usemi huu ni wazi na wa kawaida katika muktadha wa huduma ya hekalu.
- source_word: בַּסִּפִּים
  choice: kwenye vizingiti
  rationale: סַף kimsingi ni kizingiti au sehemu ya kuingilia. Tafsiri hii inadumisha picha halisi ya maandishi badala ya kuipanua kuwa “malangoni” tu.
- source_word: מָאתַיִם וּשְׁנֵים עָשָׂר
  choice: mia mbili na kumi na wawili
  rationale: Ni tafsiri ya moja kwa moja ya idadi iliyotajwa; upatanisho wa “wawili” unarejelea watu.
- source_word: בְחַצְרֵיהֶם
  choice: katika vijiji vyao
  rationale: Katika muktadha wa makazi na nasaba, חָצֵר humaanisha vijiji au makazi, si nyua za hekalu.
- source_word: הִתְיַחְשָׂם
  choice: waliandikishwa kwa nasaba
  rationale: Umbo hili la יחס linaeleza kuingizwa katika kumbukumbu rasmi kwa kufuata ukoo au nasaba.
- source_word: יִסַּד
  choice: waliwaweka
  rationale: יסד ina wazo la kuanzisha au kuweka mpangilio imara. “Waliwaweka” ni ya asili katika Kiswahili kwa kuwaweka watu katika jukumu, bila kuingiza istilahi ya kidhehebu.
- source_word: הָרֹאֶה
  choice: mwonaji
  rationale: רֹאֶה ni cheo maalumu cha kale, “mwonaji”; hakijafanywa kuwa “nabii,” ili tofauti ya msamiati wa Kiebrania ihifadhiwe.
- source_word: בֶּאֱמוּנָתָם
  choice: katika jukumu lao la dhamana
  rationale: אֱמוּנָה inaweza kuonyesha uaminifu, kutegemeka, au dhamana waliyopewa. Katika muktadha wa upangaji wa walinzi wa malango, “jukumu lao la dhamana” huwasilisha maana ya kiutawala huku tanbihi ikihifadhi uwezekano wa maana ya tabia yao ya uaminifu.
theological_decisions:
- issue: Maana ya בֶּאֱמוּנָתָם mwishoni mwa aya
  choice: Daudi na Samweli waliwaweka katika jukumu lao la dhamana
  alternative: Daudi na Samweli waliwaweka kwa sababu ya uaminifu wao; au waliwaimarisha katika uaminifu wao
  rationale: Kirai hiki ni kifupi kisintaksia na kinaweza kueleweka kama jukumu walilokabidhiwa au kama uaminifu wao. Muktadha wa kuandikishwa na kugawiwa kazi unaunga mkono maana ya jukumu la dhamana, lakini tanbihi inadumisha maana nyingine halali bila kuondoa mvutano wa maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mwonaji” huhifadhi cheo mahususi cha Samweli, na “vizingiti” huhifadhi picha halisi ya sehemu za kuingilia.
