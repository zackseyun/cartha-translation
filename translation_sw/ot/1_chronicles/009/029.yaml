id: 1CH.9.29
reference: 1 Chronicles 9:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מֵ/הֶ֗ם מְמֻנִּים֙ עַל הַ/כֵּלִ֔ים וְ/עַ֖ל כָּל כְּלֵ֣י הַ/קֹּ֑דֶשׁ וְ/עַל הַ/סֹּ֨לֶת֙ וְ/הַ/יַּ֣יִן וְ/הַ/שֶּׁ֔מֶן וְ/הַ/לְּבוֹנָ֖ה וְ/הַ/בְּשָׂמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/029.yaml
  text: And some of them were appointed over the vessels[a], over all the holy vessels, and over the fine flour, the wine, the oil, the frankincense, and the spices.
translation:
  language: sw
  text: Baadhi yao waliwekwa kusimamia vyombo, vyombo vyote vitakatifu,[a] unga laini, divai, mafuta, ubani na vitu vya kunukia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vyombo vyote vya mahali patakatifu.”
    reason: Muundo כְּלֵי הַקֹּדֶשׁ unaweza kueleweka kama vyombo vitakatifu au vyombo vya mahali patakatifu.
lexical_decisions:
- source_word: וּמֵהֶם
  choice: Baadhi yao
  rationale: Huhifadhi maana ya kuchaguliwa kwa sehemu ya kundi kubwa kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: מְמֻנִּים עַל
  choice: waliwekwa kusimamia
  rationale: Muundo huu unaonyesha kupewa jukumu rasmi bila kudokeza cheo maalumu ambacho hakikutajwa katika Kiebrania.
- source_word: הַכֵּלִים
  choice: vyombo
  rationale: Neno hili pana linaweza kumaanisha vifaa au vyombo; katika muktadha wa huduma takatifu, “vyombo” ni la kawaida na lenye heshima.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: vyombo vyote vitakatifu
  rationale: Huhifadhi kwa ufupi wazo la vyombo vilivyotengwa kwa matumizi matakatifu; uwezekano wa kuelewa הַקֹּדֶשׁ kama mahali patakatifu umewekwa katika tanbihi.
- source_word: הַסֹּלֶת
  choice: unga laini
  rationale: סֹלֶת ni unga uliosagwa vizuri uliotumiwa katika matoleo, si unga kwa ujumla.
- source_word: הַיַּיִן
  choice: divai
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya neno la Kiebrania katika muktadha huu.
- source_word: הַשֶּׁמֶן
  choice: mafuta
  rationale: Kiebrania kinasema mafuta bila kutaja wazi kwamba ni mafuta ya zeituni, hivyo tafsiri haiongezi maelezo hayo.
- source_word: הַלְּבוֹנָה
  choice: ubani
  rationale: Neno hili humaanisha hasa ubani, si uvumba kwa maana pana.
- source_word: הַבְּשָׂמִים
  choice: vitu vya kunukia
  rationale: Hueleza vitu vyenye harufu nzuri vilivyotumiwa katika maandalizi matakatifu bila kuleta maana ya viungo vya kupikia au vipodozi pekee.
