  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Waliwekwa kusimamia” ni cha asili kuliko tafsiri sisisi ya kihusishi עַל, huku marudio marefu ya “kusimamia” yakiepukwa bila kupoteza orodha ya majukumu.
