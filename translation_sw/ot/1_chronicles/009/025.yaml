  yaml_path: translation/ot/1_chronicles/009/025.yaml
  text: And their brothers in their villages were to come in every seven days[a], from time to time[b], with these.
translation:
  language: sw
  text: Nao ndugu zao waliokuwa katika vijiji vyao walipaswa kuja kila baada ya siku saba[a], mara kwa mara, kuwa pamoja na hawa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa siku saba”; inaelekea kwamba usemi wa Kiebrania unahusu zamu ya huduma iliyodumu au kurudiwa kila baada ya siku saba.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “pamoja na hawa,” yaani wale waliokuwa tayari wakihudumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Nao ndugu zao
  rationale: Neno אֲחֵיהֶם kihalisi ni ‘ndugu zao’; katika muktadha huu linaweza kuwahusu pia Walawi wenzao, lakini ‘ndugu zao’ huhifadhi namna ya usemi wa Kiebrania.
- source_word: בְּחַצְרֵיהֶם
  choice: waliokuwa katika vijiji vyao
  rationale: חָצֵר hapa ina maana ya kijiji au makazi, si ua wa Hekalu; muundo huu pia unatoa Kiswahili cha kawaida na kinachoeleweka.
- source_word: לָבוֹא
  choice: walipaswa kuja
  rationale: Infinitivu yenye ל katika maelezo haya ya utaratibu inaonyesha wajibu uliopangwa, si tukio la wakati uliopita tu.
- source_word: לְשִׁבְעַת הַיָּמִים
  choice: kila baada ya siku saba
  rationale: Usemi huu unaelekea kuonyesha kipindi cha zamu ya siku saba, huku tanbihi ikihifadhi uwezekano wa maana ‘kwa siku saba.’
- source_word: מֵעֵת אֶל עֵת
  choice: mara kwa mara
  rationale: Nahau hii huonyesha nyakati zinazojirudia; ‘mara kwa mara’ ni Kiswahili cha asili bila kufafanua ratiba kuliko Kiebrania.
- source_word: עִם אֵלֶּה
  choice: kuwa pamoja na hawa
  rationale: Kihalisi ni ‘pamoja na hawa’; ‘hawa’ huwahusu wale waliokuwa tayari wakihudumu na huhifadhi demonstrativi ya Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Walipaswa’ huonyesha wajibu wa ratiba, na ‘hawa’ huhifadhi rejeo la karibu la Kiebrania bila kulibainisha kupita kiasi.
