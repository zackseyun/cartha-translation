  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בִ/ירוּשָׁלִַ֨ם֙ יָשְׁב֔וּ מִן בְּנֵ֥י יְהוּדָ֖ה וּ/מִן בְּנֵ֣י בִנְיָמִ֑ן וּ/מִן בְּנֵ֥י אֶפְרַ֖יִם וּ/מְנַשֶּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/003.yaml
  text: And in Jerusalem some from the sons of Judah, and some from the sons of Benjamin, and some from the sons of Ephraim and Manasseh, lived there.
translation:
  language: sw
  text: Na katika Yerusalemu waliishi baadhi ya wazao wa Yuda, baadhi ya wazao wa Benyamini, na baadhi ya wazao wa Efraimu na Manase.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, “kutoka kwa wana wa Yuda ... kutoka kwa wana wa Benyamini ... kutoka kwa wana wa Efraimu na Manase.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/ירוּשָׁלִַם
  choice: Na katika Yerusalemu
  rationale: Kiunganishi וּ pamoja na kihusishi בִ kinaendeleza simulizi na kuweka wazi mahali; Kiswahili cha kawaida hutumia “katika Yerusalemu” kwa maana hii.
- source_word: יָשְׁבוּ
  choice: waliishi
  rationale: Kitenzi ישב hapa kina maana ya kukaa au kuishi mahali. “Waliishi” ni cha kawaida na huonyesha makazi bila kuongeza wazo la kuanzisha makazi mapya.
- source_word: מִן
  choice: baadhi ya
  rationale: מִן iliyorudiwa inaonyesha watu waliotoka katika makundi hayo, si kila mtu wa kabila husika. “Baadhi ya” huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: בְּנֵי יְהוּדָה
  choice: wazao wa Yuda
  rationale: בני katika muktadha wa kikabila ni wazao au watu wa ukoo wa Yuda. “Wazao” huhifadhi maana ya nasaba kwa uwazi zaidi kuliko tafsiri halisi “wana.”
- source_word: בְּנֵי בִנְיָמִן
  choice: wazao wa Benyamini
  rationale: Uamuzi huu unadumisha muundo na maana ya kikabila-nasaba sawa na kifungu kinachohusu Yuda.
- source_word: בְּנֵי אֶפְרַיִם
  choice: wazao wa Efraimu
  rationale: “Wazao wa Efraimu” huhifadhi usemi wa nasaba na urudiaji wa muundo wa Kiebrania kwa Kiswahili kinachoeleweka.
- source_word: וּ/מְנַשֶּׁה
  choice: na Manase
  rationale: Kiebrania hakirudii בני kabla ya Manase; katika “wazao wa Efraimu na Manase,” neno “wazao” linaeleweka kuwa linawahusu wote wawili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wazao” limetumiwa badala ya “wana” ili usemi wa kikabila-nasaba ueleweke kwa msomaji wa kawaida; alama ya tanbihi imewekwa baada ya sentensi kwa kuwa inahusu mfululizo mzima wa makabila.
