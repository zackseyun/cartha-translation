base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/007.yaml
  text: 'And from the sons of Benjamin: Sallu son of Meshullam[a], son of Hodaviah[c][b], son of Hassenuah.'
translation:
  language: sw
  text: 'Na kutoka miongoni mwa wana wa Benyamini[a]: Salu mwana wa Meshulamu, mwana wa Hodavia[c], mwana wa Hasenua.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya karibu, Kiebrania kinasema, “wana wa Benyamini.” Hapa maana yake ni watu au wazao wa kabila la Benyamini.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinarudia “mwana wa” katika mlolongo huu wa nasaba. Usemi huu unaweza kumaanisha mwana wa moja kwa moja au mzao katika ukoo.
    reason: cultural_note
  - marker: c
    text: Jina Hodavia lina tahajia tofauti katika baadhi ya mapokeo yanayohusiana ya nasaba.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִן
  choice: Na kutoka miongoni mwa
  rationale: Kiunganishi וּ kinaendeleza orodha iliyotangulia, na מִן kinaonyesha kwamba Salu ni mmoja wa kundi linalotajwa.
- source_word: בְּנֵי בִּנְיָמִן
  choice: wana wa Benyamini
  rationale: Hii ndiyo tafsiri ya karibu ya nahau ya Kiebrania, ambayo hapa humaanisha watu au wazao wa kabila la Benyamini.
- source_word: סַלּוּא
  choice: Salu
  rationale: Jina limetoholewa kwa tahajia ya kawaida na inayoeleweka katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Neno limerudiwa katika mlolongo wote wa nasaba. Tafsiri rasmi imehifadhiwa, ingawa katika nasaba linaweza pia kumaanisha mzao wa kizazi cha baadaye.
- source_word: מְשֻׁלָּם
  choice: Meshulamu
  rationale: Jina limetoholewa kwa namna inayolingana na mfumo wa sauti wa Kiswahili.
- source_word: הוֹדַוְיָה
  choice: Hodavia
  rationale: Tafsiri inafuata umbo la jina katika matini ya Kimasora ya mstari huu.
- source_word: הַ/סְּנֻאָה
  choice: Hasenua
  rationale: Katika muktadha huu wa nasaba, umbo hili limechukuliwa kuwa jina la mtu; kiambishi cha Kiebrania kimewakilishwa kama sehemu ya jina.
