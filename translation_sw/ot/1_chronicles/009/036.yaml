  text: And his firstborn son was Abdon[a], then Zur, Kish, Baal, Ner, and Nadab.
translation:
  language: sw
  text: Na mwanawe wa kwanza alikuwa Abdoni, kisha Suri, Kishi, Baali, Neri na Nadabu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya neno kwa neno: “Na mwanawe, mzaliwa wa kwanza: Abdoni, na Suri, na Kishi, na Baali, na Neri, na Nadabu.” Viunganishi vinavyotangulia kila jina katika Kiebrania vimewasilishwa kwa mtindo wa kawaida wa orodha katika Kiswahili.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנוֹ
  choice: Na wanawe walikuwa
  rationale: Ingawa umbo la Kiebrania ni la umoja, orodha inayofuata inataja wana kadhaa; Kiswahili cha asili hutumia wingi ili kuwasilisha ukoo huo kwa uwazi bila kupoteza uhusiano wa umiliki.
- source_word: הַבְּכוֹר
  choice: mzaliwa wa kwanza
  rationale: Hili ndilo neno la kawaida na lenye hadhi kwa 'firstborn' katika muktadha wa ukoo.
- source_word: עַבְדּוֹן
  choice: Abdoni
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: וְצוּר
  choice: kisha Suri
  rationale: Kishirikishi kinachorudiwa katika Kiebrania kinawasilishwa kwa mtiririko wa kawaida wa orodha; 'kisha' kinaendeleza majina bila kudai kwa lazima mpangilio wa kuzaliwa.
- source_word: וְקִישׁ
  choice: Kishi
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili, huku kishirikishi kikimezwa katika muundo wa orodha.
- source_word: וּבַעַל
  choice: Baali
  rationale: Jina la mtu linahifadhiwa kama lilivyo katika matini ya Kiebrania na kutoholewa kwa Kiswahili, bila kulibadili kwa sababu ya uhusiano wake wa kimaumbo na jina la mungu wa Kanaani.
- source_word: וְנֵר
  choice: Neri
  rationale: Jina la mtu limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: וְנָדָב
  choice: na Nadabu
  rationale: Kishirikishi cha mwisho kimetafsiriwa kwa 'na' ili kuhitimisha orodha kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la mtu בַּעַל katika ukoo wa Kiisraeli
  choice: Baali kama jina la mtu
  alternative: Kulibadili au kutumia jina la badala ili kuepuka uhusiano na jina la mungu wa Kanaani
  rationale: Matini ya Kiebrania inatoa wazi jina בַּעַל. Kulihifadhi kunafuata ushahidi wa chanzo na hakumaanishi kuunga mkono ibada ya sanamu.
