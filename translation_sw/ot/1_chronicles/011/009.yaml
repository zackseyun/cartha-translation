base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/009.yaml
  text: And David became greater and greater[a], and Yahweh of hosts was with him.
translation:
  language: sw
  text: Daudi akawa mkuu zaidi na zaidi,[a] naye Yahwe wa majeshi alikuwa pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiebrania, kwa maana halisi: “Daudi akaenda, akienda na kuwa mkuu”; huu ni msemo unaomaanisha kwamba aliendelea kuwa mkuu zaidi hatua kwa hatua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדוֹל
  choice: akazidi kuwa mkuu zaidi na zaidi
  rationale: Muundo huu wa Kiebrania unaonyesha kuendelea na kuongezeka hatua kwa hatua, si kwenda mahali kihalisi. Kiswahili hiki kinawasilisha maendeleo hayo kwa lugha ya kawaida huku kikiendeleza wazo la ukuu.
- source_word: דָּוִיד
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia ya Kiswahili.
- source_word: וַיהוָה צְבָאוֹת
  choice: na Yahwe wa majeshi
  rationale: Jina la agano יְהוָה limetolewa kama Yahwe, na צְבָאוֹת kama 'wa majeshi' ili kuhifadhi taswira ya cheo cha Kiebrania bila kutumia tafsiri pana zaidi kama 'Mwenyezi.' Kiunganishi 'na' kinawakilisha וַ bila kuongeza maana ya sababu.
- source_word: עִמּוֹ
  choice: alikuwa pamoja naye
  rationale: Huwasilisha moja kwa moja maana ya uwepo au uandamani wa Mungu pamoja na Daudi.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko lina jina maalumu la Mungu, si neno la cheo 'Bwana'; 'Yahwe' hulihifadhi kama jina la agano.
- issue: Uhusiano kati ya ukuu wa Daudi na uwepo wa Yahwe
  choice: na
  alternative: kwa sababu
  rationale: Kiebrania kina kiunganishi וַ; kwa hiyo tafsiri haifanyi uhusiano huo kuwa wa kisababishi waziwazi, ingawa muktadha unaweza kumruhusu msomaji kuuona.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Akazidi kuwa mkuu zaidi na zaidi' ni usemi unaoeleweka kwa wasomaji wa kawaida na huhifadhi nguvu ya kuongezeka ya muundo wa Kiebrania.
