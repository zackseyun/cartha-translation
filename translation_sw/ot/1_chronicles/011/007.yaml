  yaml_path: translation/ot/1_chronicles/011/007.yaml
  text: David lived in the stronghold[a]; therefore they called it the City of David.
translation:
  language: sw
  text: Daudi akaishi katika ngome[a]; kwa hiyo wakaiita Mji wa Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “boma.” Neno la Kiebrania מְצָד linamaanisha mahali palipoimarishwa kwa ulinzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: akaishi
  rationale: Katika simulizi, kitenzi ישב kikifuatwa na mahali humaanisha kukaa au kuishi mahali hapo. “Akaishi” ni Kiswahili cha kawaida kinachoonyesha Daudi alifanya mahali hapo kuwa makao yake.
- source_word: בַּמְצָד
  choice: katika ngome
  rationale: מְצָד ni mahali palipoimarishwa kwa ulinzi. “Ngome” ni neno la kawaida na lenye maana ya kijeshi na kiulinzi; kiambishi בַּ kimetafsiriwa “katika.”
- source_word: עַל כֵּן
  choice: kwa hiyo
  rationale: Nahau hii inaonyesha matokeo au sababu inayotokana na jambo lililotangulia. “Kwa hiyo” ni ya asili na huhifadhi uhusiano huo wa kimantiki.
- source_word: קָרְאוּ לוֹ
  choice: wakaiita
  rationale: Kiebrania kina kauli tendi ya wingi. “Wakaiita” huhifadhi kauli hiyo na kueleza kwa kawaida kitendo cha kukipa mahali jina.
- source_word: עִיר דָּוִיד
  choice: Mji wa Daudi
  rationale: Hili ni jina maalumu la mahali katika matumizi ya Biblia. Muundo “Mji wa Daudi” ni wa kawaida katika Kiswahili na umetumiwa kama jina rasmi.
