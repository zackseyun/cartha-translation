  text: Zelek the Ammonite[a], Naharai the Beerothite, the armor-bearer of Joab son of Zeruiah;
translation:
  language: sw
  text: Seleki Mwamoni, Naharai Mbeerothi, mchukua-silaha wa Yoabu mwana wa Seruia;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֶלֶק
  choice: Seleki
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: הָעַמּוֹנִי
  choice: Mwamoni
  rationale: Nomino ya asili yenye kibainishi humtambulisha Seleki kuwa mtu wa Amoni; ‘Mwamoni’ ndiyo namna ya kawaida na fasaha katika Kiswahili.
- source_word: נַחְרַי
  choice: Naharai
  rationale: Jina la mtu limetoholewa kwa kufuata kwa karibu umbo la Kiebrania.
- source_word: הַבֵּרֹתִי
  choice: Mbeerothi
  rationale: Nomino ya asili inayotokana na Beerothi; umbo hili linadumisha uhusiano wake na jina la mahali.
- source_word: נֹשֵׂא כְּלֵי
  choice: mchukua-silaha
  rationale: Kirai hiki ni cheo cha mtu aliyebeba silaha au vifaa vya kivita vya kiongozi; ‘mchukua-silaha’ ni tafsiri ya asili na inayoeleweka katika Kiswahili.
- source_word: יוֹאָב
  choice: Yoabu
  rationale: Jina limetolewa kwa umbo lililozoeleka katika mapokeo ya Biblia ya Kiswahili.
- source_word: בֶּן צְרוּיָה
  choice: mwana wa Seruia
  rationale: Muundo huu unamtambulisha Yoabu kwa ukoo wa upande wa mama, sawa na Kiebrania, bila kuongeza kibainishi kisichohitajika.
