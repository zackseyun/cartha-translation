translation_notes:
  register: Lugha ni fupi na yenye hadhi, ikifaa mtindo wa orodha ya mashujaa. Majina yametoholewa kwa maumbo yanayoeleweka katika Kiswahili cha Afrika Mashariki, na kirai ‘mchukua-silaha’ kinatoa maana ya wadhifa kwa lugha ya kawaida huku tanbihi ikihifadhi muundo wa moja kwa moja zaidi wa Kiebrania.
