  text: Wakati huo Daudi alikuwa ngomeni[a], na wakati huo kikosi cha Wafilisti[b] kilikuwa katika Bethlehemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, mahali pa kujihami.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza kumaanisha kituo cha kijeshi au kikosi cha wanajeshi kilichowekwa mahali fulani.
