lexical_decisions:
- source_word: מְּצוּדָה
  choice: ngome
  rationale: Neno hili humaanisha mahali palipoimarishwa kwa ulinzi au mahali salama pa kujihami. “Ngome” ni neno la kawaida na lenye kufaa katika muktadha huu wa kijeshi.
- source_word: נְצִיב
  choice: kituo cha kijeshi
  rationale: Katika muktadha wa Wafilisti waliokuwa Bethlehemu, neno hili linaeleweka kuwa kituo au kikosi cha jeshi kilichowekwa hapo, si utawala wa kiraia.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hili la watu.
- source_word: בְּבֵית לָחֶם
  choice: Bethlehemu
  rationale: Kiambishi בְּ kinaonyesha mahali; kwa Kiswahili mahali hapa panaelezwa kwa kawaida bila kuhitaji “katika.”
- source_word: אָז ... אָז
  choice: wakati huo ... wakati huo
  rationale: Marudio ya Kiebrania yamehifadhiwa ili kuonyesha wazi kwamba hali zote mbili zilikuwepo kwa wakati mmoja.
- source_word: וְדָוִיד
  choice: Daudi
  rationale: Waw ya mwanzo inaunganisha sentensi na simulizi linalotangulia; katika Kiswahili muunganiko huo unaweza kuachwa bila kuanza kwa “na,” huku uhusiano wa kisimulizi ukibaki wazi.
