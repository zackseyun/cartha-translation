translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, kwa mtindo mfupi wa orodha ya majina. Majina yametoholewa kwa urahisi wa matamshi ya Kiswahili, huku utata wa jina la asili au ukoo ukihifadhiwa katika tanbihi.
