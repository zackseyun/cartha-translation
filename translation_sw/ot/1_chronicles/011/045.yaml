  text: Jediael son of Shimri[a], and Joha his brother, the Tizite;
translation:
  language: sw
  text: Yediaeli mwana wa Shimri, na Yoha ndugu yake, Mtizi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda “Mzizi,” kutegemea jinsi neno הַתִּיצִי linavyotiwa irabu na kuhusishwa na jina la mahali au ukoo.
