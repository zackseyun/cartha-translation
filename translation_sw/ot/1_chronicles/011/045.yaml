lexical_decisions:
- source_word: יְדִיעֲאֵל
  choice: Yediaeli
  rationale: Jina la mtu limetoholewa kwa kufuata sauti za Kiebrania na mtindo wa kawaida wa majina ya Biblia katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika orodha hii, neno hili linaeleweka kwa kawaida kuwa uhusiano wa moja kwa moja wa mwana na baba.
- source_word: שִׁמְרִי
  choice: Shimri
  rationale: Jina la mtu limetoholewa kwa kuzingatia umbo la konsonanti za Kiebrania.
- source_word: וְיֹחָא
  choice: na Yoha
  rationale: Kiunganishi וְ kimetafsiriwa kuwa “na,” nalo jina limetoholewa kwa mtindo wa Kiswahili.
- source_word: אָחִיו
  choice: ndugu yake
  rationale: Neno אָח hapa lina maana yake ya kawaida ya ndugu wa kiume; Kiswahili “ndugu yake” ni cha asili na hakiongezi maelezo yasiyokuwapo.
- source_word: הַתִּיצִי
  choice: Mtizi
  rationale: Ni jina la kuonyesha asili ya ukoo au mahali; umbo la Kiswahili lenye kiambishi M- linaonyesha mtu wa kundi au mahali paitwapo Tizi bila kubainisha zaidi.
