base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/017.yaml
  text: And David longed and said[b][a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: sw
  text: Daudi akatamani sana, akasema[a], “Ni nani atakayenipa maji ya kunywa kutoka katika kisima[b] cha Bethlehemu kilicho langoni?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kawaida zaidi, “Laiti mtu angenipa maji ya kunywa kutoka katika kisima cha Bethlehemu kilicho langoni!”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “kisima” linaweza pia kumaanisha shimo la kuhifadhia maji au shimo; hapa linarejelea chanzo cha maji ya kunywa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתאו
  choice: akatamani sana
  rationale: Kitenzi kinaonyesha tamaa au hamu yenye nguvu. “Akatamani sana” ni Kiswahili cha kawaida kinachohifadhi uzito wa hamu ya Daudi.
- source_word: מי
  choice: Ni nani atakayenipa
  rationale: Kiwakilishi cha kuuliza kinaendeleza muundo wa swali la Kiebrania, huku katika muktadha swali hilo likieleza pia tamanio.
- source_word: ישקני מים
  choice: atakayenipa maji ya kunywa
  rationale: Hifili ya שקה ina maana ya kumpa mtu anywe; tafsiri hii pia inataja wazi “maji” kama ilivyo katika Kiebrania.
- source_word: מבּור
  choice: kutoka katika kisima
  rationale: בּוֹר inaweza kumaanisha kisima, shimo, au shimo la kuhifadhia maji. Kwa kuwa hapa ni chanzo cha maji ya kunywa, “kisima” ndiyo tafsiri iliyo wazi zaidi, na upana wa neno umehifadhiwa katika tanbihi.
- source_word: בית לחם
  choice: Bethlehemu
  rationale: Hili ndilo umbo la kawaida la jina hili la mahali katika Kiswahili cha Biblia.
- source_word: אשר בשער
  choice: kilicho langoni
  rationale: Usemi huu unaonyesha mahali kilipo kisima kwa kukihusianisha na lango la mji. “Kilicho langoni” ni wa asili na hauongezi umbali usiotajwa na Kiebrania.
