  yaml_path: translation/ot/1_chronicles/011/026.yaml
  text: 'And the mighty warriors were: Asahel the brother of Joab[a], Elhanan son of Dodo, from Bethlehem.'
translation:
  language: sw
  text: 'Nao mashujaa hodari walikuwa: Asaheli ndugu ya Yoabu, Elhanani mwana wa Dodo, kutoka Bethlehemu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגִבּוֹרֵי הַחֲיָלִים
  choice: Nao mashujaa hodari
  rationale: Kirai hiki kinataja wapiganaji mashujaa au askari mashuhuri. “Mashujaa hodari” ni Kiswahili cha sasa, cha kawaida na chenye maana ya kijeshi; “Nao” linaendeleza orodha kama וְ ya Kiebrania.
- source_word: עֲשָׂהאֵל
  choice: Asaheli
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili inayotumika kwa kawaida.
- source_word: אֲחִי יוֹאָב
  choice: ndugu ya Yoabu
  rationale: Kirai hiki kinamtambulisha Asaheli kwa uhusiano wake na Yoabu. “Ndugu” linahifadhi maana ya Kiebrania bila kuongeza neno lisilohitajika.
- source_word: אֶלְחָנָן
  choice: Elhanani
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili.
- source_word: בֶּן דּוֹדוֹ
  choice: mwana wa Dodo
  rationale: Muundo wa nasaba umetafsiriwa moja kwa moja; hapa Dodo ni jina la mtu.
- source_word: מִבֵּית לָחֶם
  choice: kutoka Bethlehemu
  rationale: Kihusishi מִן pamoja na jina la mahali kinaonyesha asili au alikotoka mtu; tafsiri ya moja kwa moja ni wazi na ya kawaida kwa Kiswahili.
