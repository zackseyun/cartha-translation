  text: גַּם תְּמ֣וֹל גַּם שִׁלְשׁ֗וֹם גַּ֚ם בִּ/הְי֣וֹת שָׁא֣וּל מֶ֔לֶךְ אַתָּ֛ה הַ/מּוֹצִ֥יא וְ/הַ/מֵּבִ֖יא אֶת יִשְׂרָאֵ֑ל וַ/יֹּאמֶר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אַתָּ֨ה תִרְעֶ֤ה אֶת עַמִּ/י֙ אֶת יִשְׂרָאֵ֔ל וְ/אַתָּה֙ תִּהְיֶ֣ה נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/002.yaml
  text: Even in times past[a], even before, when Saul was king, you were the one who led Israel out and brought them in; and Yahweh your God said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over my people Israel.’
translation:
  language: sw
  text: Hata zamani za kale[a], hata Sauli alipokuwa mfalme, wewe ndiye uliyeiongoza Israeli katika kutoka na kuingia[b]. Naye Yahwe, Mungu wako, alikuambia, ‘Wewe utawachunga watu wangu Israeli, nawe utakuwa mtawala[c] juu ya watu wangu Israeli.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “jana na juzi,” nahau ya Kiebrania inayomaanisha zamani au wakati uliopita.
    reason: lexical_alternative
  - marker: b
    text: Au kwa tafsiri iliyo karibu zaidi na muundo wa Kiebrania, “wewe ndiye uliyewatoa na kuwaingiza Israeli”; msemo huu unaonyesha kuwa Daudi aliwaongoza watu.
    reason: lexical_alternative
  - marker: c
    text: Au “kiongozi” au “mkuu.” Neno la Kiebrania hapa si neno la kawaida linalomaanisha “mfalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם תְּמוֹל גַּם שִׁלְשׁוֹם
  choice: Hata zamani
  rationale: Kirai hiki kwa maana halisi hutaja jana na juzi, lakini ni nahau ya Kiebrania inayomaanisha wakati uliopita. ‘Hata zamani’ ni Kiswahili cha kawaida kinachowasilisha maana hiyo na msisitizo wake.
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ
  choice: hata Sauli alipokuwa mfalme
  rationale: Muundo wenye בִּ unaanzisha kishazi cha wakati. ‘Alipokuwa mfalme’ ni tafsiri ya kawaida na ya moja kwa moja; ‘hata’ inawakilisha גַּם inayotangulia kishazi hiki.
- source_word: אַתָּה הַמּוֹצִיא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  choice: wewe ndiye uliyeiongoza Israeli kutoka na kuirudisha
  rationale: Tafsiri hii inadumisha taswira ya kuwatoa na kuwarudisha watu huku ikionyesha kwamba Daudi ndiye aliyewaongoza, badala ya kuifanya kauli hiyo ionekane kuwa safari yake binafsi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: תִרְעֶה
  choice: utawachunga
  rationale: Kitenzi hiki kinatumia taswira ya mchungaji kwa uongozi wa kifalme. ‘Utawachunga’ huihifadhi kwa Kiswahili cha kawaida bila kuipunguza kuwa ‘utatawala.’
- source_word: נָגִיד
  choice: mtawala
  rationale: Neno hili humaanisha mtu aliyewekwa kuwa kiongozi au mtawala, lakini si neno la kawaida la Kiebrania kwa ‘mfalme.’ ‘Mtawala’ hudumisha tofauti hiyo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Taswira ya uongozi katika תִרְעֶה
  choice: utawachunga watu wangu Israeli
  alternative: utawaongoza watu wangu Israeli; utawatawala watu wangu Israeli
  rationale: Kiebrania kinatumia waziwazi taswira ya mchungaji. Tafsiri iliyochaguliwa huhifadhi mvutano wa taswira ya kichungaji na ya kifalme bila kuiwekea ufafanuzi wa kimadhehebu.
- issue: Tofauti kati ya נָגִיד na מֶלֶךְ
  choice: mtawala
  alternative: kiongozi; mkuu; mfalme
  rationale: Aya inamwita Sauli ‘mfalme’ kwa מֶלֶךְ, lakini kwa Daudi inatumia נָגִיד. ‘Mtawala’ huepuka kufuta tofauti hiyo ya kimsamiati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inahifadhi marudio ya msisitizo kwa ‘Hata … hata,’ taswira ya kuwatoa na kuwarudisha watu, na sitiari ya mchungaji. ‘Israeli’ imetumiwa kama jina la pamoja la watu, kulingana na maandishi chanzi.
