lexical_decisions:
- source_word: עַזְמָוֶת
  choice: Azmawethi
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, huku likihifadhi kwa karibu umbo la Kiebrania.
- source_word: הַבַּחֲרוּמִי
  choice: Mbaharumi
  rationale: Nomino ya asili yenye kibainishi humtambulisha Azmawethi kwa mahali au ukoo. Umbo hili linafuata matamshi ya maandishi ya Kimasoreti; uhusiano unaowezekana na Bahurimu umewekwa katika tanbihi.
- source_word: אֶלְיַחְבָּא
  choice: Eliyahba
  rationale: Jina la mtu limetoholewa moja kwa moja, likihifadhi kwa uwazi silabi za umbo la Kiebrania.
- source_word: הַשַּׁעַלְבֹנִי
  choice: Mshaalboni
  rationale: Nomino ya asili yenye kibainishi inaonyesha mtu wa Shaalboni; umbo fupi la Kiswahili linafaa mtindo wa orodha na linafuata umbo la Kimasoreti kwa karibu.
