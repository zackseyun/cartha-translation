  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ דָּוִ֧יד וְ/כָל יִשְׂרָאֵ֛ל יְרוּשָׁלִַ֖ם הִ֣יא יְב֑וּס וְ/שָׁם֙ הַ/יְבוּסִ֔י יֹשְׁבֵ֖י הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/004.yaml
  text: Then David and all Israel went to Jerusalem—that is[a], Jebus—where the Jebusites, the inhabitants of the land, were.
translation:
  language: sw
  text: Kisha Daudi na Israeli wote wakaenda Yerusalemu—yaani, Yebusi—ambako Wayebusi, wenyeji wa nchi hiyo, waliishi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Kisha ... wakaenda
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi. “Kisha” na kitenzi cha usimulizi “wakaenda” vinatoa Kiswahili cha kawaida huku vikihifadhi hatua inayofuata katika habari.
- source_word: וְכָל יִשְׂרָאֵל
  choice: na Israeli wote
  rationale: Hili linahifadhi kiunganishi na jina la pamoja la taifa. Katika Kiswahili, “Israeli wote” linaeleweka kuwa watu wote wa Israeli waliotajwa kwa pamoja.
- source_word: יְרוּשָׁלִַם הִיא יְבוּס
  choice: Yerusalemu—yaani, Yebusi
  rationale: Kiwakilishi הִיא kinatambulisha Yerusalemu kuwa ndilo Yebusi. “Yaani” linaonyesha wazi ulinganifu wa majina hayo mawili kwa Kiswahili cha sasa.
- source_word: וְשָׁם
  choice: ambako
  rationale: Ingawa maana ya karibu ni “na huko,” “ambako” linaunganisha kwa ufasaha maelezo ya mahali na watu waliokaa humo bila kubadili maana.
- source_word: הַיְבוּסִי
  choice: Wayebusi
  rationale: Neno la Kiebrania liko katika umoja wa kijumla, lakini linarejelea kundi, kama inavyoonyeshwa na kishiriki cha wingi kinachofuata. Kwa hiyo wingi “Wayebusi” ni wa kawaida na sahihi katika Kiswahili.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: wenyeji wa nchi hiyo
  rationale: Kishiriki katika hali ya muundo kinamaanisha watu wanaokaa mahali. “Wenyeji wa nchi hiyo” ni usemi wa asili unaoonyesha eneo la mahali lililokaliwa na Wayebusi, si dunia nzima.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo wa simulizi umetolewa kwa “Kisha ... wakaenda,” na majina Yerusalemu, Yebusi, Wayebusi na Israeli yametumika kwa maumbo yanayotambulika kwa wasomaji wa Biblia. Hakuna tanbihi iliyohitajika kwa kuwa umoja wa kijumla הַיְבוּסִי umetolewa moja kwa moja kwa wingi wa kawaida wa Kiswahili.
