base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/005.yaml
  text: The inhabitants of Jebus said to David[a], “You will not come in here.” But David captured the stronghold of Zion, that is, the City of David.
translation:
  language: sw
  text: Wakazi wa Yebusi wakamwambia Daudi, “Hutaingia humu.”[a] Lakini Daudi akauteka ngome ya Sayuni, yaani, Mji wa Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Hutakuja hapa.” Kiebrania kinasema kwa neno kwa neno, “Hutakuja hapa,” ikiwa ni kauli ya kumkatalia kuingia.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי יְבוּס
  choice: Wakazi wa Yebusi
  rationale: Kirai hiki humaanisha watu waliokaa Yebusi; “wakazi” ni Kiswahili cha kawaida na huhifadhi maana ya kundi hilo.
- source_word: לֹא תָבוֹא הֵנָּה
  choice: Hutaingia humu
  rationale: Ingawa kwa neno kwa neno ni “hutakuja hapa,” katika muktadha huu kauli hiyo ni kukataa kumruhusu Daudi aingie; “humu” huhifadhi hisia ya kuingia ndani ya eneo hilo.
- source_word: וַיִּלְכֹּד
  choice: akauteka
  rationale: Katika muktadha wa kijeshi, kitenzi hiki humaanisha kuteka au kuchukua mahali kwa nguvu.
- source_word: מְצֻדַת צִיּוֹן
  choice: ngome ya Sayuni
  rationale: מְצוּדָה ni mahali palipoimarishwa kwa ulinzi; “ngome” ni neno la kawaida, wazi, na linalofaa katika muktadha wa kijeshi.
- source_word: הִיא עִיר דָּוִיד
  choice: yaani, Mji wa Daudi
  rationale: Kishazi hiki kinaitambulisha ngome ya Sayuni kwa jina jingine; “yaani” huonyesha kazi hiyo ya ufafanuzi kwa Kiswahili cha asili.
- source_word: עִיר דָּוִיד
  choice: Mji wa Daudi
  rationale: Hili ni jina maalumu la mahali katika muktadha huu, kwa hiyo herufi kubwa inafaa.
