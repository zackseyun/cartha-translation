  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania הַמְּצֹבָיָה ni jina linalomtambulisha Yaasieli kwa mahali au ukoo wake, huenda likimaanisha kwamba alitoka Mezoba au mahali au ukoo wenye jina linalofanana. Jina hasa la mahali hilo halina uhakika; kwa hiyo pia linaweza kutoholewa kuwa “Mmisoba” au “Mmezobahi.”
