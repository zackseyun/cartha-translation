lexical_decisions:
- source_word: אֱלִיאֵל
  choice: Elieli
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi ya kawaida ya Kiswahili badala ya kutafsiriwa maana yake.
- source_word: וְעוֹבֵד
  choice: Obedi
  rationale: Jina la mtu limetoholewa kwa Kiswahili; kiunganishi cha Kiebrania kimewakilishwa kwa mtindo wa kawaida wa orodha ya Kiswahili.
- source_word: וְיַעֲשִׂיאֵל
  choice: na Yaasieli
  rationale: Jina la mtu limetoholewa kwa Kiswahili, huku kiunganishi וְ kikionyeshwa kwa “na” kabla ya jina la mwisho katika orodha.
- source_word: הַמְּצֹבָיָה
  choice: Mmezoba
  rationale: Hili ni jina la kumtambulisha mtu kwa mahali au ukoo anaotoka. Muundo wa Kiswahili wenye M- unaonyesha mtu wa Mezoba bila kukisia zaidi kuhusu jina la msingi lisilo na uhakika.
