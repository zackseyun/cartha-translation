source:
  edition: WLC
  text: וַ/יִּֽתְיַצְּב֤וּ בְ/תוֹךְ הַ/חֶלְקָה֙ וַ/יַּצִּיל֔וּ/הָ וַ/יַּכּ֖וּ אֶת פְּלִשְׁתִּ֑ים וַ/יּ֥וֹשַׁע יְהוָ֖ה תְּשׁוּעָ֥ה גְדוֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/014.yaml
  text: And they took their stand in the middle of the plot and delivered it[a], and they struck down the Philistines, and Yahweh saved by a great victory.
translation:
  language: sw
  text: Nao wakasimama imara katikati ya shamba hilo, wakaliokoa, wakawapiga Wafilisti, naye Yahwe akaleta ushindi mkubwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe akaleta ukombozi mkubwa” au “Yahwe akaokoa kwa ushindi mkubwa.”
    reason: תשועה linaweza kutafsiriwa kuwa ushindi, ukombozi, au wokovu; pia muundo wa Kiebrania unaweza kuwasilishwa kwa kitenzi ‘kuokoa.’
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: wakasimama imara
  rationale: Kauli ya kujirejelea ya יצב inaonyesha kuchukua msimamo thabiti au kutorudi nyuma; tafsiri hii ni ya kawaida na inadumisha maana ya kijeshi.
- source_word: בְתוֹךְ הַחֶלְקָה
  choice: katikati ya shamba hilo
  rationale: תוך ni ‘katikati,’ na חלקה hapa ni kipande cha ardhi kilicholimwa. ‘Shamba hilo’ ni Kiswahili cha kawaida na muktadha wa aya iliyotangulia unalitambulisha.
- source_word: וַיַּצִּילוּהָ
  choice: wakaliokoa
  rationale: Kiambishi cha yambwa cha kike kinarejelea חלקה, yaani shamba; ‘kuliokoa’ huonyesha kulinusuru lisitekwe na adui.
- source_word: וַיַּכּוּ אֶת־פְּלִשְׁתִּים
  choice: wakawapiga Wafilisti
  rationale: נכה katika mapigano humaanisha kupiga au kuangamiza. ‘Wakawapiga’ inadumisha upana wa kitenzi bila kuongeza wazi kwamba wote waliuawa.
- source_word: וַיּוֹשַׁע יְהוָה תְּשׁוּעָה גְדוֹלָה
  choice: Yahwe akaleta ushindi mkubwa
  rationale: Muundo wa kitenzi ישע pamoja na nomino תשועה ni nahau ya kuleta ukombozi au ushindi. Katika muktadha wa vita, ‘akaleta ushindi mkubwa’ ni ya asili na haiongezi yambwa lisilotajwa katika Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Maana ya וַיּוֹשַׁע ... תְּשׁוּעָה katika muktadha wa vita
  choice: Yahwe akaleta ushindi mkubwa
  alternative: Yahwe akaleta wokovu mkubwa
  rationale: תשועה linaweza kumaanisha wokovu, ukombozi, au ushindi. ‘Ushindi’ unafaa muktadha wa kijeshi, huku tanbihi ikihifadhi uwezekano mpana wa kileksika.
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania ina jina binafsi la Mungu; ‘Yahwe’ hulihifadhi badala ya kuweka cheo mahali pake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi na hadhi inayofaa maandiko. Viunganishi vya ‘waka-’ vinadumisha mfululizo wa vitendo vya Kiebrania bila kufanya sentensi iwe nzito.
