  text: וְ/אַבְשַׁ֣י אֲחִֽי יוֹאָ֗ב ה֤וּא הָיָה֙ רֹ֣אשׁ הַ/שְּׁלוֹשָׁ֔ה וְ/הוּא֙ עוֹרֵ֣ר אֶת חֲנִית֔/וֹ עַל שְׁלֹ֥שׁ מֵא֖וֹת חָלָ֑ל ו/לא שֵׁ֖ם בַּ/שְּׁלוֹשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/020.yaml
  text: And Abishai[a], the brother of Joab, was chief of the Three. He brandished his spear against three hundred slain[c][b], and had a name among the Three.
translation:
  language: sw
  text: Naye Abishai, ndugu yake Yoabu, alikuwa mkuu wa wale Watatu.[a] Aliinua mkuki wake juu ya watu mia tatu, akawaua,[b] akawa na sifa miongoni mwa wale Watatu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wale Watatu.” Katika kifungu sambamba (2 Samweli 23:18), baadhi ya tafsiri hutaja kundi hili kwa namna tofauti kwa sababu ya matatizo ya maandishi na ya muktadha yanayohusu “watatu” na “thelathini.”'
    reason: textual_variant
  - marker: b
    text: Au “aliutikisa mkuki wake” au “aliutumia mkuki wake.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kwa maana halisi ni “akawa na jina,” yaani, akawa mashuhuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: mkuu
  rationale: Katika muktadha huu wa kijeshi neno hili linaonyesha cheo au uongozi, si kichwa halisi.
- source_word: הַשְּׁלוֹשָׁה / בַּשְּׁלוֹשָׁה
  choice: wale Watatu / miongoni mwa wale Watatu
  rationale: Huhifadhi usomaji wa moja kwa moja wa maandishi ya Kiebrania, ‘watatu,’ bila kuupatanisha kimyakimya na ‘thelathini’ katika mapokeo mengine ya maandishi.
- source_word: עוֹרֵר אֶת חֲנִיתוֹ
  choice: aliinua mkuki wake
  rationale: Ni tafsiri ya asili na iliyo wazi ya kitendo cha kijeshi; Kiebrania kinaweza pia kumaanisha kuushika au kuutikisa mkuki kwa ajili ya shambulio.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: dhidi ya watu mia tatu aliowaua
  rationale: חָלָל humaanisha mtu aliyeuawa au kuchomwa; tafsiri hii huonyesha kwa Kiswahili cha kawaida matokeo ya ushujaa huo bila kuficha uhusiano wake na kitendo cha Abishai.
- source_word: שֵׁם
  choice: akawa na sifa
  rationale: Nahau ya Kiebrania ‘kuwa na jina’ humaanisha kupata sifa au kujulikana; ‘akawa na sifa’ ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: אַבְשַׁי
  choice: Abishai
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: אֲחִי יוֹאָב
  choice: ndugu yake Yoabu
  rationale: Hufuata maana ya muundo wa Kiebrania na ni Kiswahili cha kawaida.
theological_decisions:
- issue: Utambulisho wa kundi la mashujaa
  choice: wale Watatu
  alternative: wale Thelathini
  rationale: Maandishi ya Kimasora katika mstari huu yanasema ‘watatu.’ Tofauti na ugumu wa maandishi katika kifungu sambamba vinaelezwa katika tanbihi badala ya kuoanisha maandishi kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye hadhi. ‘Wale Watatu’ imeandikwa kwa herufi kubwa kama jina la kundi maalumu la mashujaa. Mpangilio wa alama za tanbihi umewekwa kwenye vipashio vinavyohusika moja kwa moja.
