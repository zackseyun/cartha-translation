  yaml_path: translation/ot/1_chronicles/011/024.yaml
  text: These things Benaiah son of Jehoiada did[a], and he had a name among the three mighty men.
translation:
  language: sw
  text: Haya ndiyo aliyofanya Benaya mwana wa Yehoyada, naye alikuwa mashuhuri miongoni mwa wale mashujaa watatu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye alikuwa na jina miongoni mwa wale mashujaa watatu.” Kiebrania kinasema kihalisi “alikuwa na jina.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: Haya ndiyo aliyofanya
  rationale: Kirai hiki kinarejelea matendo ya Benaya yaliyosimuliwa kabla yake. Muundo huu ni wa kawaida katika Kiswahili na unaendeleza nguvu ya muhtasari ya Kiebrania.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaya mwana wa Yehoyada
  rationale: Majina yamenukuliwa kwa tahajia inayofaa Kiswahili, na uhusiano wa ukoo umeelezwa kwa muundo wa kawaida ‘mwana wa.’
- source_word: וְלוֹ שֵׁם
  choice: naye alikuwa mashuhuri
  rationale: Kiebrania kinasema kihalisi ‘naye alikuwa na jina,’ nahau inayomaanisha kuwa na sifa au umaarufu. ‘Alikuwa mashuhuri’ huwasilisha maana hiyo kwa Kiswahili cha kawaida; tafsiri ya karibu zaidi imehifadhiwa katika tanbihi.
- source_word: בִּשְׁלוֹשָׁה
  choice: miongoni mwa wale ... watatu
  rationale: Kihusishi ב hapa kinaonyesha nafasi au kutambuliwa kwake kuhusiana na kundi la wale watatu.
- source_word: הַגִּבֹּרִים
  choice: mashujaa
  rationale: Katika muktadha huu neno hili linawataja wapiganaji hodari wa Daudi. ‘Mashujaa’ ni neno la asili na lenye hadhi katika Kiswahili, huku muktadha ukionyesha kwamba walikuwa wapiganaji.
