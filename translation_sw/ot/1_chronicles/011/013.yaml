base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/013.yaml
  text: He was with David at Pas-dammim[a], where the Philistines had gathered for battle. Now the plot of the field was full of barley[b], and the people fled from before the Philistines.
translation:
  language: sw
  text: Alikuwa pamoja na Daudi huko Pas-Damimu[a], ambako Wafilisti walikuwa wamekusanyika kwa vita. Sehemu ya shamba ilikuwa imejaa shayiri, nao watu wakakimbia mbele ya Wafilisti.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pas-Damimu ni jina la mahali; linganisha simulizi sambamba katika 1 Samweli 17:1, ambapo eneo hilo linaitwa Efes-Damimu.
    reason: cross_reference
  - marker: b
    text: Au, “wakakimbia kutoka mbele ya Wafilisti.” Kiebrania kinatumia nahau yenye maana ya kukimbia au kurudi nyuma mbele ya adui.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּפַּס דַּמִּים
  choice: huko Pas-Damimu
  rationale: Kirai hiki kinachukuliwa kuwa jina la mahali. Jina limetoholewa kwa mfumo wa sauti unaoeleweka katika Kiswahili badala ya kutafsiriwa kwa maana yake ya kietimolojia.
- source_word: נֶאֱסְפוּ
  choice: walikuwa wamekusanyika
  rationale: Nifali ya אסף hapa inaeleza kukusanyika pamoja; wakati timilifu uliopita unaonyesha kuwa mkusanyiko huo ulitangulia hali inayosimuliwa.
- source_word: לַמִּלְחָמָה
  choice: kwa ajili ya vita
  rationale: Katika muktadha huu, neno linamaanisha mapambano ya kijeshi yaliyokusudiwa, na 'vita' ni usemi wa kawaida na mpana katika Kiswahili.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: sehemu fulani ya shamba
  rationale: חלקה ni kipande au sehemu maalumu ya ardhi; 'sehemu fulani ya shamba' ni ya asili katika Kiswahili na haidai kwamba shamba lote lilikuwa na zao hilo.
- source_word: מְלֵאָה שְׂעוֹרִים
  choice: ilikuwa imejaa shayiri
  rationale: Tafsiri inahifadhi zao mahususi la shayiri badala ya kulipanua kuwa nafaka kwa ujumla.
- source_word: וְהָעָם
  choice: nao watu
  rationale: עם limetafsiriwa kwa upana wake kama 'watu' bila kulibana kuwa wanajeshi au wanaume, ingawa muktadha unaweza kuwarejelea wapiganaji wa Israeli.
- source_word: נָסוּ מִפְּנֵי פְלִשְׁתִּים
  choice: wakawakimbia Wafilisti
  rationale: Hii ni Kiswahili cha kawaida kinachoonyesha kuwa watu walitoroka kwa sababu ya Wafilisti; tanbihi inahifadhi picha halisi ya nahau ya Kiebrania, 'walikimbia kutoka mbele ya Wafilisti.'
