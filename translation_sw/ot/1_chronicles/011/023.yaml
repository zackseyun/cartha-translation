base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/023.yaml
  text: And he struck down the Egyptian[a], a man five cubits tall. In the Egyptian’s hand was a spear like a weaver’s beam, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[c][b], and killed him with his own spear.
translation:
  language: sw
  text: Naye akampiga Mmisri, mtu mwenye kimo cha dhiraa tano[a][b]. Mkononi mwa Mmisri kulikuwa na mkuki kama mti wa mfumaji; naye akashuka kumwendea akiwa na fimbo[c], akanyakua mkuki kutoka mkononi mwa Mmisri, kisha akamuua kwa mkuki wake mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu wa kimo kikubwa, mwenye kimo cha dhiraa tano.” Kirai cha Kiebrania kinasema kihalisi “mtu wa kipimo.”
    reason: lexical_alternative
  - marker: b
    text: Dhiraa ilikuwa kipimo cha kale cha urefu, takribani umbali kutoka kwenye kiwiko hadi ncha za vidole.
    reason: cultural_note
  - marker: c
    text: Au, “kwa rungu” au “kwa gongo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: akampiga
  rationale: Kitenzi hiki kina maana pana ya kupiga na katika muktadha huu tendo hilo linaelekea kwenye ushindi wa mapigano. “Akampiga” hakitangulizi maana ya kumuua, kwa kuwa kitenzi kinachosema wazi kuwa alimuua kinatokea mwishoni mwa aya.
- source_word: הָאִישׁ הַמִּצְרִי
  choice: Mmisri
  rationale: “Mmisri” humtambulisha mtu huyo kwa kawaida katika Kiswahili bila ulazima wa kurudia neno “mtu.”
- source_word: אִישׁ מִדָּה
  choice: mtu mwenye kimo
  rationale: Kirai cha Kiebrania, kihalisi “mtu wa kipimo,” kinaeleza kimo au ukubwa wa ajabu; tafsiri hii ni ya kawaida na inaunganishwa moja kwa moja na kipimo kinachofuata.
- source_word: חָמֵשׁ בָּאַמָּה
  choice: cha dhiraa tano
  rationale: Kipimo cha kale kimehifadhiwa badala ya kubadilishwa kuwa kipimo cha kisasa, ili kudumisha uwazi wa kihistoria wa matini.
- source_word: חֲנִית
  choice: mkuki
  rationale: “Mkuki” ndilo neno la kawaida na linalofaa kwa silaha hii ndefu, hasa inapolinganishwa na mti wa mfumaji.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: kama mti wa mfumaji
  rationale: Hii huwasilisha ulinganisho wa mpini wa mkuki na boriti au mti mzito wa kifaa cha kufumia kwa lugha inayoeleweka.
- source_word: וַיֵּרֶד אֵלָיו
  choice: akamshukia
  rationale: Tafsiri hii huhifadhi wazo la kushuka kumwelekea au kumvamia adui bila kulifanya kwa lazima kuwa neno la jumla la kushambulia.
- source_word: בַּשָּׁבֶט
  choice: akiwa na fimbo
  rationale: שבט inaweza kuwa fimbo, rungu, au gongo. “Fimbo” ni chaguo pana lisiloamua zaidi ya matini, huku likionyesha tofauti na mkuki wa Mmisri.
- source_word: וַיִּגְזֹל
  choice: akanyakua
  rationale: Kitenzi kinaonyesha kunyang’anya kwa nguvu; “akanyakua” kinafaa kwa tendo la haraka katika mapigano.
- source_word: וַיַּהַרְגֵהוּ
  choice: akamuua
  rationale: Hiki ndicho kitenzi kinachosema wazi kuwa Mmisri aliuawa, na “akamuua” ni lugha ya sasa, wazi na yenye hadhi.
- source_word: בַּחֲנִיתוֹ
  choice: kwa mkuki wake mwenyewe
  rationale: Kiwakilishi kinarejelea kwa kawaida mkuki wa Mmisri uliokuwa umenyakuliwa; “wake mwenyewe” huweka wazi kejeli ya Mmisri kuuawa kwa silaha yake.
