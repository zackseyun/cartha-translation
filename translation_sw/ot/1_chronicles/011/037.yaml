lexical_decisions:
- source_word: חֶצְרוֹ
  choice: Hezro
  rationale: Jina la mtu limetoholewa moja kwa moja kutoka umbo la Kiebrania katika Mambo ya Nyakati; umbo tofauti katika simulizi sambamba halibadilishwi kimyakimya.
- source_word: הַכַּרְמְלִי
  choice: Mkarmeli
  rationale: Jina hili la kimahali lenye kibainishi humaanisha mtu wa Karmeli. ‘Mkarmeli’ ni usemi mfupi na wa kawaida kwa Kiswahili, bila kurejelea shirika la kidini la baadaye.
- source_word: נַעֲרַי
  choice: Naarai
  rationale: Jina la mtu limetoholewa kutoka Kiebrania huku mfuatano wa vokali ukihifadhiwa.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika orodha ya majina, maana ya kawaida ni uhusiano wa mwana na baba; hakuna sababu ya kuipanua kuwa ‘mzao wa’.
- source_word: אֶזְבָּי
  choice: Ezbai
  rationale: Jina la mtu limetoholewa moja kwa moja kutoka umbo la Kiebrania.
