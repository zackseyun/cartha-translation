  text: Ittai son of Ribai[a], from Gibeah of the sons of Benjamin; Benaiah the Pirathonite;
translation:
  language: sw
  text: Itai mwana wa Ribai, kutoka Gibea ya watu wa kabila la Benyamini[a]; Benaya, Mpirathoni;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “wana wa Benyamini,” yaani, watu wa kabila la Benyamini.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִיתַי
  choice: Itai
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili inayowakilisha matamshi ya Kiebrania.
- source_word: בֶּן רִיבַי
  choice: mwana wa Ribai
  rationale: Muundo huu unaonyesha moja kwa moja uhusiano wa mtoto wa kiume na baba yake; “mwana wa” ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: מִ/גִּבְעַת
  choice: kutoka Gibea
  rationale: Kihusishi מִן kinaonyesha asili au mahali alikotoka, nalo גִּבְעַת hapa ni jina la mahali.
- source_word: בְּנֵי בִנְיָמִן
  choice: ya watu wa kabila la Benyamini
  rationale: Ingawa kwa neno kwa neno ni “wana wa Benyamini,” katika muktadha huu usemi huo unaonyesha watu wa kabila la Benyamini. Tafsiri hii inaeleweka kwa urahisi huku tanbihi ikihifadhi usemi halisi.
- source_word: בְּנָיָה
  choice: Benaya
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: הַ/פִּרְעָתֹנִי
  choice: Mpirathoni
  rationale: Nomino ya uhusiano inaonyesha mtu wa Pirathoni au anayehusishwa na mahali hapo; umbo la Kiswahili “Mpirathoni” ni fupi na la kawaida kwa mtu anayetoka mahali fulani.
