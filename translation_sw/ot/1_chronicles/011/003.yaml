  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ כָּל זִקְנֵ֨י יִשְׂרָאֵ֤ל אֶל הַ/מֶּ֨לֶךְ֙ חֶבְר֔וֹנָ/ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם דָּוִ֥יד בְּרִ֛ית בְּ/חֶבְר֖וֹן לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּמְשְׁח֨וּ אֶת דָּוִ֤יד לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל כִּ/דְבַ֥ר יְהוָ֖ה בְּ/יַד שְׁמוּאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and David made a covenant with them at Hebron before Yahweh. Then they anointed David king over Israel, according to the word of Yahweh by Samuel.
translation:
  language: sw
  text: Basi wazee wote wa Israeli wakaja kwa mfalme huko Hebroni, naye Daudi akafanya agano nao huko Hebroni mbele za Yahwe. Kisha wakamtia Daudi mafuta awe mfalme juu ya Israeli, sawasawa na neno la Yahwe kupitia kwa Samweli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kwa mkono wa Samweli,” nahau yenye maana ya “kupitia kwa Samweli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: wazee
  rationale: Neno hili linamaanisha wawakilishi waliotambuliwa rasmi katika jamii na taifa; “wazee” ni tafsiri ya kawaida na mahususi kuliko “viongozi.”
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Kiebrania kinatumia cheo chenye kibainishi bila kutaja jina katika kishazi hiki; kumtaja baadaye kuwa Daudi kunafuata muundo wa simulizi.
- source_word: חֶבְרוֹנָה / בְּחֶבְרוֹן
  choice: huko Hebroni
  rationale: Umbo la kwanza linaonyesha mwendo kuelekea Hebroni, na la pili linaonyesha mahali agano lilipofanywa. “Huko Hebroni” ni usemi wa kawaida wa Kiswahili unaofaa katika miktadha yote miwili.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: akafanya agano
  rationale: Nahau ya Kiebrania ni, kwa maana halisi, “alikata agano”; “akafanya agano” huwasilisha maana yake kwa Kiswahili cha sasa bila kuleta taswira isiyoeleweka.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Usemi huu unadumisha wazo la uwepo na ushuhuda wa Mungu katika tendo hilo rasmi la agano.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: וַיִּמְשְׁחוּ
  choice: wakamtia Daudi mafuta
  rationale: Tafsiri hii inadumisha tendo halisi la kumpaka au kumtia mafuta katika kusimikwa kuwa mfalme, badala ya kutumia neno la jumla kama “kumweka wakfu.”
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: kuwa mfalme wa Israeli
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoeleza wazi kuwekwa kwake atawale Israeli.
- source_word: כִּדְבַר יְהוָה
  choice: sawasawa na neno la Yahwe
  rationale: “Neno” linafuata דָבָר kwa karibu na halifupishi maana yake kuwa ahadi pekee.
- source_word: בְּיַד שְׁמוּאֵל
  choice: kupitia kwa Samweli
  rationale: Nahau “kwa mkono wa Samweli” inaonyesha kwamba Samweli alikuwa njia au mjumbe ambaye kupitia kwake neno hilo lilitolewa; “kupitia kwa Samweli” ni wazi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia Tetragramatoni, jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha na cheo.
- issue: Wakala katika usemi בְּיַד שְׁמוּאֵל
  choice: kupitia kwa Samweli
  alternative: kwa mkono wa Samweli
  rationale: Tafsiri iliyochaguliwa inaonyesha kwamba neno lilitoka kwa Yahwe na likawasilishwa kupitia Samweli, bila kumfanya Samweli kuwa chanzo chake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kawaida kwa usomaji wa Biblia. “Hebroni” na “Samweli” ni maumbo yaliyozoeleka katika Kiswahili. Alama ya tanbihi imewekwa baada ya “Samweli,” ambako nahau ya Kiebrania inayofafanuliwa inatokea.
