  text: Uzzia the Ashterathite[a], Shama and Jeiel[b], the sons of Hotham the Aroerite.
translation:
  language: sw
  text: Uzia, Mwashterathi[a], Shama na Yeueli[b], wana wa Hothamu, Mwaroeri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwashtarothi.” Huenda humaanisha mtu wa Ashterothi.
    reason: lexical_alternative
  - marker: b
    text: Jina hili pia limetoholewa “Yeyeli” katika mapokeo fulani.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻזִּיָא
  choice: Uzia
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili, kwa kufuata umbo la Kiebrania lililo katika mstari huu.
- source_word: הָעֲשְׁתְּרָתִי
  choice: Mwashterathi
  rationale: Ni jina la kabila au la mkazi linalotokana na jina la mahali Ashterathi; kiambishi Mwa- kinatoa Kiswahili cha asili kwa maana ya mtu anayetoka huko.
- source_word: שָׁמָע
  choice: Shama
  rationale: Jina limetoholewa moja kwa moja kutoka katika umbo la Kiebrania bila kuongeza konsonanti isiyoonyeshwa katika matini hii.
- source_word: ויעואל
  choice: na Yeueli
  rationale: Kiunganishi ו kimetafsiriwa ‘na’; jina limetoholewa kwa kufuata konsonanti za matini ya Kiebrania, ambazo zinaunga mkono Yeueli.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Wingi wa neno ‘mwana’ katika hali ya muundo unaonyesha uhusiano wa kifamilia kwa Kiswahili cha kawaida.
- source_word: חוֹתָם
  choice: Hothamu
  rationale: Jina la mtu limetoholewa kwa mfumo wa sauti unaosomeka kwa urahisi katika Kiswahili.
- source_word: הָעֲרֹעֵרִי
  choice: Mwaroeri
  rationale: Ni jina la mkazi linalotokana na Aroeri; umbo la Kiswahili linaonyesha mtu wa mahali hapo bila kufafanua zaidi.
