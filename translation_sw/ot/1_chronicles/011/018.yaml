  text: וַ/יִּבְקְע֨וּ הַ/שְּׁלֹשָׁ֜ה בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בּ֤וֹר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑יד וְ/לֹֽא אָבָ֤ה דָוִיד֙ לִ/שְׁתּוֹתָ֔/ם וַ/יְנַסֵּ֥ךְ אֹתָ֖/ם לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/018.yaml
  text: So the three broke through into the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But David was not willing to drink it; instead, he poured it out to Yahweh.
translation:
  language: sw
  text: Basi wale watatu wakapenya kwa nguvu mpaka ndani ya kambi ya Wafilisti, wakachota maji kutoka katika kisima cha Bethlehemu, kilichokuwa penye lango, wakayachukua na kumletea Daudi. Lakini Daudi hakutaka kuyanywa; badala yake, akayamimina kwa Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa ufafanuzi zaidi, “akayamimina kama sadaka ya kinywaji kwa Yahwe.” Kitenzi cha Kiebrania kinaweza kuwa na maana ya kumimina kama sadaka ya kinywaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: wakapenya kwa nguvu mpaka ndani ya
  rationale: Katika muktadha wa kijeshi, kitenzi kinaonyesha kuvunja au kupenya katika safu za adui. Usemi huu ni wa asili katika Kiswahili na unaendeleza nguvu ya tendo.
- source_word: הַשְּׁלֹשָׁה
  choice: wale watatu
  rationale: Kiebrania kinasema tu ‘wale watatu’; utambulisho wao unapatikana katika muktadha, hivyo ‘mashujaa’ halijaongezwa.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: mpaka ndani ya kambi ya Wafilisti
  rationale: Pamoja na kitenzi cha kupenya, kirai hiki kinaeleza kuingia katika eneo la adui bila kudai kwamba walipita kambi yote.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: wakateka maji
  rationale: ‘Kuteka maji’ ni usemi wa kawaida wa Kiswahili kwa kuchota maji kisimani.
- source_word: מִבּוֹר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: kutoka katika kisima cha Bethlehemu kilichokuwa karibu na lango
  rationale: בּוֹר inaweza kuwa shimo, birika, au kisima; kwa kuwa maji yanatekwa kwa ajili ya kunywa, ‘kisima’ ndilo chaguo la kawaida zaidi. ‘Karibu na lango’ linaonyesha mahali bila kuongeza maelezo yasiyokuwapo.
- source_word: וַיִּשְׂאוּ
  choice: wakayachukua
  rationale: Katika mfuatano huu maana ni kuyabeba au kuyasafirisha maji; kiwakilishi cha ngeli ya maji kinawekwa wazi kwa Kiswahili cha kawaida.
- source_word: וַיָּבִיאוּ אֶל דָּוִיד
  choice: na kumletea Daudi
  rationale: Hutoa mfuatano wa simulizi kwa kawaida bila kuongeza ‘kurudi,’ ambalo linaeleweka katika muktadha lakini halijasemwa wazi.
- source_word: וְלֹא אָבָה דָוִיד לִשְׁתּוֹתָם
  choice: Daudi hakutaka kuyanywa
  rationale: אָבָה huhusu kutaka au kuwa tayari. ‘Hakutaka’ ni ya asili na haiongezi ukali unaoweza kudokezwa na ‘alikataa.’ Wingi wa maji umehifadhiwa kwa ‘kuyanywa.’
- source_word: וַיְנַסֵּךְ אֹתָם לַיהוָה
  choice: akayamimina mbele za Yahwe
  rationale: נסך linaweza kumaanisha kumimina kama sadaka ya kinywaji. Matini kuu inahifadhi tendo linaloonekana, huku tanbihi ikieleza maana yake ya kiibada. ‘Mbele za’ ni Kiswahili cha kawaida kwa tendo la ibada linaloelekezwa kwa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa Kiswahili ‘Yahwe’ badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
theological_decisions:
- issue: Maana ya kiibada ya tendo la Daudi kwa maji
  choice: Matini kuu iseme kwamba Daudi ‘akayamimina mbele za Yahwe,’ na tanbihi ieleze kuwa tendo hilo linaweza kueleweka kama sadaka ya kinywaji.
  alternative: Kutafsiri moja kwa moja, ‘akayatoa kwa Yahwe kama sadaka ya kinywaji.’
  rationale: Kitenzi cha Kiebrania kina maana ya kimiminiko cha sadaka, lakini simulizi pia linaonyesha tendo halisi la kumimina. Njia hii huhifadhi picha ya tendo na maana yake ya kiibada bila kuufanya ufafanuzi mmoja kuwa sehemu isiyoweza kuepukika ya matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa, na wenye heshima. ‘Wale watatu’ huhifadhi ufupi wa Kiebrania; ‘wakapenya kwa nguvu’ huwasilisha muktadha wa kijeshi; na jina ‘Yahwe’ huhifadhi jina binafsi la Mungu.
