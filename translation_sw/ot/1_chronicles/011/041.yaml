lexical_decisions:
- source_word: אֽוּרִיָּה
  choice: Uria
  rationale: Jina la mtu limetoholewa kwa umbo lililozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: הַ/חִתִּי
  choice: Mhiti
  rationale: Nomino ya nasaba yenye kibainishi humtambulisha Uria kwa asili yake; “Mhiti” ni umbo la kawaida la Kiswahili kwa mtu wa jamii ya Wahiti.
- source_word: זָבָד
  choice: Zabadi
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kiasili katika Kiswahili huku likihifadhi umbo la jina la Kiebrania.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huu ni uhusiano wa muundo wa Kiebrania unaoonyesha kuwa Zabadi ni mwana wa Ahlai; “mwana wa” ni usemi wa kawaida na wenye heshima katika orodha ya majina.
- source_word: אַחְלָי
  choice: Ahlai
  rationale: Jina la mtu limenukuliwa kwa karibu, kwa kuwa umbo hili linaweza kutamkwa wazi katika Kiswahili.
