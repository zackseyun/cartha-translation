  yaml_path: translation/ot/1_chronicles/011/001.yaml
  text: Then all Israel gathered to David at Hebron, saying, “Look, we are your bone and your flesh.”
translation:
  language: sw
  text: Ndipo Israeli wote wakakusanyika kwa Daudi huko Hebroni, wakisema, “Tazama, sisi ni mfupa wako na nyama yako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: wakakusanyika
  rationale: Kitenzi hiki kinaonyesha kukusanyika pamoja; umbo la wakati uliopita linafaa katika masimulizi ya Kiswahili.
- source_word: כָל יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Hurejelea watu wa Israeli kwa ujumla, wala si eneo la nchi pekee.
- source_word: אֶל דָּוִיד
  choice: kwa Daudi
  rationale: Kihusishi אֶל kinaonyesha kumwendea Daudi na kukusanyika alikokuwa.
- source_word: חֶבְרוֹנָה
  choice: huko Hebroni
  rationale: Umbo la Kiebrania linaashiria mwendo kuelekea Hebroni; katika Kiswahili, 'huko Hebroni' huwasilisha mahali pa kukusanyika kwa ufasaha.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta fikira kwa mkazo; 'Tazama' linahifadhi uzito wa usemi wa moja kwa moja na hadhi ya kibiblia.
- source_word: עַצְמְךָ וּבְשָׂרְךָ אֲנָחְנוּ
  choice: sisi ni mfupa wako na nyama yako
  rationale: Tafsiri ya karibu huhifadhi nahau ya Kiebrania inayosema kwamba wao ni jamaa zake au watu wa ukoo mmoja, bila kuifafanua kupita kiasi ndani ya matini.
theological_decisions:
- issue: Maana ya kauli 'mfupa wako na nyama yako'
  choice: Kuhifadhi nahau hiyo moja kwa moja
  alternative: sisi ni watu wa damu yako / sisi ni jamaa zako
  rationale: Nahau hii inaonyesha mshikamano wa kindugu na utambulisho wa pamoja; kuihifadhi huepuka kupunguza maana yake pana au kuingiza ufafanuzi usio katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa asili na hadhi ya simulizi la Maandiko. 'Ndipo' huunganisha tukio hili na mfululizo wa masimulizi; 'Tazama' huhifadhi mkazo wa הִנֵּה.
