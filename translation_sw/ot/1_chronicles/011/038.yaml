lexical_decisions:
- source_word: יוֹאֵל
  choice: Yoeli
  rationale: Jina la mtu limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: אֲחִי
  choice: ndugu yake
  rationale: Ni hali ya uambatanisho ya neno ‘ndugu wa kiume’; ‘ndugu yake’ ni Kiswahili cha kawaida na hudumisha uhusiano unaotajwa bila kuupanua kuwa ukoo wa mbali.
- source_word: נָתָן
  choice: Nathani
  rationale: Jina la mtu limetoholewa kwa desturi ya majina ya kibiblia katika Kiswahili.
- source_word: מִבְחָר
  choice: Mibhari
  rationale: Limechukuliwa kuwa jina la mtu na kutoholewa badala ya kutafsiriwa kama nomino ya kawaida.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika orodha hii, maana ya kawaida ya uhusiano wa moja kwa moja wa baba na mwana inafaa zaidi kuliko ‘mzao wa’.
- source_word: הַגְרִי
  choice: Hagri
  rationale: Katika matini kuu limechukuliwa kama jina la mtu baada ya ‘mwana wa’; hata hivyo, umbo lenye kiambishi cha utambulisho linaweza kueleweka kama jina la kabila au asili, jambo linalowekwa wazi katika tanbihi.
