base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/006.yaml
  text: And David said[a], “Whoever strikes down a Jebusite first shall become chief and commander.” So Joab son of Zeruiah went up first[b], and he became chief.
translation:
  language: sw
  text: Daudi akasema, “Yeyote atakayemshinda Myebusi kwanza atakuwa mkuu na jemadari.” Basi Yoabu mwana wa Seruya akapanda kwanza[a], naye akawa mkuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi “akapanda” huenda kinadokeza kupanda ili kushambulia ngome, lakini maneno ya Kiebrania yenyewe yanasema tu “akapanda.”
    reason: cultural_note
lexical_decisions:
- source_word: כָּל מַכֵּה יְבוּסִי
  choice: Yeyote atakayekuwa wa kwanza kumshinda Myebusi
  rationale: כָּל pamoja na participle hutumika kama kishazi cha uhusiano kisicho na mtajwa maalumu, ‘yeyote.’ Katika muktadha wa kijeshi נכה ina maana ya kumpiga na kumshinda; ‘kumshinda’ ni ya kawaida katika Kiswahili na inaepuka wazo la pigo moja tu. יְבוּסִי ni umoja unaotumiwa kwa mtu mmoja wa Wayebusi.
- source_word: בָּרִאשׁוֹנָה
  choice: wa kwanza / kwanza
  rationale: Neno hili linaonyesha kutangulia katika tendo. Katika kauli ya Daudi limeunganishwa kwa njia ya asili na ‘yeyote atakayekuwa wa kwanza’; katika simulizi limetafsiriwa ‘kwanza.’
- source_word: יִהְיֶה לְרֹאשׁ וּלְשָׂר
  choice: atakuwa mkuu na jemadari
  rationale: רֹאשׁ hapa ni cheo cha uongozi, kwa hiyo ‘mkuu’; שַׂר katika muktadha huu wa kijeshi ni ‘jemadari.’ ‘Atakuwa’ huhifadhi moja kwa moja kitenzi היה pamoja na לְ.
- source_word: וַיַּעַל
  choice: akapanda
  rationale: עלה kimsingi ni ‘kupanda/kwenda juu.’ ‘Akapanda’ huhifadhi maana ya Kiebrania bila kuifafanua kimyakimya kuwa ‘akashambulia.’
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: Yoabu mwana wa Seruya
  rationale: Majina yameandikwa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia, na uhusiano wa kifamilia umetafsiriwa moja kwa moja.
- source_word: וַיְהִי לְרֹאשׁ
  choice: naye akawa mkuu
  rationale: ‘Akawa mkuu’ hurudia kwa makusudi neno רֹאשׁ lililotumiwa katika ahadi. Hapa maandishi hayarudii שַׂר, hivyo ‘jemadari’ halijaongezwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo umefanywa wa kawaida kwa Kiswahili huku marudio ya ‘mkuu’ na maana halisi ya ‘akapanda’ yakihifadhiwa. Tanbihi ya kwanza ya Kiingereza haikuhamishwa kwa sababu ‘mkuu’ tayari hutoa maana ya רֹאשׁ kwa usahihi; ‘kichwa’ hapa ingekuwa tafsiri isiyo ya kawaida na yenye kupotosha katika Kiswahili.
