  yaml_path: translation/ot/1_chronicles/011/015.yaml
  text: Then three of the thirty chiefs went down to the rock[a], to David, at the cave of Adullam, while the camp of the Philistines was encamped in the Valley of Rephaim.
translation:
  language: sw
  text: Ndipo viongozi watatu kati ya wale thelathini wakashuka kwa Daudi, kwenye mwamba, katika pango la Adulamu, wakati Wafilisti walipokuwa wamepiga kambi katika Bonde la Refaimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa karibu zaidi na mpangilio wa Kiebrania: “Viongozi watatu kati ya wale thelathini wakashuka kwenye mwamba kwa Daudi, kwenye pango la Adulamu.” Muundo wa Kiebrania ni mfupi na uhusiano wa virai vya mahali una utata; tafsiri kuu hufafanua kwamba walimwendea Daudi aliyekuwa kwenye mwamba, katika pango la Adulamu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: wakashuka
  rationale: Kitenzi ירד kinaonyesha kwenda chini; umbo la “waka-” linaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida.
- source_word: שְׁלוֹשָׁה מִן־הַשְּׁלוֹשִׁים רֹאשׁ
  choice: viongozi watatu kati ya wale thelathini
  rationale: Huwatambulisha watatu waliotoka katika kundi linalojulikana la wale thelathini na kuhifadhi wazo la hadhi ya uongozi bila kutaja cheo maalumu cha kijeshi.
- source_word: עַל־הַצּוּר
  choice: mpaka kwenye mwamba
  rationale: עַל inaweza kuonyesha kufika juu ya, kwenye, au kuelekea mahali. “Mpaka kwenye mwamba” ni ya kawaida kwa Kiswahili na inadumisha rejeo halisi la kijiografia; uwezekano wa “juu ya mwamba” umehifadhiwa katika tanbihi.
- source_word: אֶל־דָּוִיד
  choice: kwa Daudi
  rationale: אֶל inaonyesha mwelekeo kuelekea kwa mtu; “kwa Daudi” ni usemi wa kawaida wa Kiswahili.
- source_word: אֶל־מְעָרַת עֲדֻלָּם
  choice: aliyekuwa katika pango la Adulamu
  rationale: Ingawa אֶל mara nyingi humaanisha “kwenda,” hapa kirai kinaeleweka kama ufafanuzi wa mahali Daudi alipokuwa. Muundo huu huepuka urudiaji usio wa kawaida kwa Kiswahili.
- source_word: וּמַחֲנֵה פְלִשְׁתִּים חֹנָה
  choice: wakati Wafilisti walipokuwa wamepiga kambi
  rationale: Kiunganishi kinaanzisha mazingira ya tukio, na participio חֹנָה inaonyesha hali iliyokuwa ikiendelea. Kiswahili hutumia kwa kawaida watu kama kiima katika usemi “kupiga kambi,” badala ya kusema kambi ilipiga kambi.
- source_word: בְּעֵמֶק רְפָאִים
  choice: katika Bonde la Refaimu
  rationale: Ni jina la mahali; “Refaimu” ni uhawilishaji unaolingana na mifumo ya sauti ya Kiswahili.
