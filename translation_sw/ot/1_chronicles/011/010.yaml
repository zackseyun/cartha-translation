id: 1CH.11.10
reference: 1 Chronicles 11:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה רָאשֵׁ֤י הַ/גִּבּוֹרִים֙ אֲשֶׁ֣ר לְ/דָוִ֔יד הַ/מִּתְחַזְּקִ֨ים עִמּ֧/וֹ בְ/מַלְכוּת֛/וֹ עִם כָּל יִשְׂרָאֵ֖ל לְ/הַמְלִיכ֑/וֹ כִּ/דְבַ֥ר יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/010.yaml
  text: These were the chiefs of the mighty men who belonged to David[a], who strengthened themselves with him in his kingdom, together with all Israel, to make him king[b], according to the word of Yahweh concerning Israel.
translation:
  language: sw
  text: Hawa ndio wakuu wa mashujaa wa Daudi, waliomuunga mkono kwa nguvu[a] katika ufalme wake, pamoja na Israeli wote, ili kumfanya awe mfalme, kulingana na neno la Yahweh kuhusu Israeli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliojiimarisha pamoja naye.” Usemi wa Kiebrania unaweza kutafsiriwa kwa karibu zaidi hivyo, lakini katika muktadha huu huenda unamaanisha kwamba walijikusanya upande wa Daudi na kumuunga mkono kwa nguvu katika ufalme wake.
    reason: lexical_alternative
  - marker: b
    text: Au, “juu ya Israeli.” Kiebrania kinasema kwa karibu zaidi “juu ya Israeli,” lakini katika muundo huu yaelekea maana yake ni “kuhusu Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הַגִּבּוֹרִים
  choice: wakuu wa mashujaa
  rationale: Neno רָאשֵׁי linaonyesha viongozi au watu wa cheo cha kwanza, na הַגִּבּוֹרִים hapa linawahusu mashujaa hodari wa kijeshi wa Daudi.
- source_word: אֲשֶׁר לְדָוִיד
  choice: wa Daudi
  rationale: Muundo wa Kiebrania unaonyesha uhusiano au kuwa upande wa Daudi; umilikishi wa Kiswahili ni wa kawaida na wazi bila kulazimisha maana ya umiliki halisi.
- source_word: הַמִּתְחַזְּקִים עִמּוֹ
  choice: waliojiimarisha pamoja naye
  rationale: Huhifadhi umbo la kujirejelea la kitenzi na maana yake ya msingi, huku tanbihi ikionyesha uwezekano wa maana ya kumuunga Daudi mkono kwa nguvu.
- source_word: בְמַלְכוּתוֹ
  choice: katika ufalme wake
  rationale: מַלְכוּת inaweza kumaanisha ufalme, utawala, au hali ya kuwa mfalme. Kauli hii pana inahifadhi sehemu ya wigo huo wa maana.
- source_word: עִם כָּל יִשְׂרָאֵל
  choice: pamoja na Israeli wote
  rationale: Huonyesha kwamba mashujaa hao walitenda kwa ushirikiano na taifa lote la Israeli.
- source_word: לְהַמְלִיכוֹ
  choice: ili kumfanya awe mfalme
  rationale: Hiphil ya מלך ina maana ya kumsimika au kumfanya mtu kuwa mfalme; tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: כִּדְבַר יְהוָה
  choice: kulingana na neno la Yahweh
  rationale: Huhifadhi dhana ya neno au tamko la Mungu bila kuibana kuwa ahadi pekee, na jina יהוה limetafsiriwa kwa jina binafsi Yahweh.
- source_word: עַל יִשְׂרָאֵל
  choice: kuhusu Israeli
  rationale: Baada ya דְבַר, kihusishi עַל kwa kawaida kinaweza kumaanisha 'kuhusu'; hii pia huepusha kuifanya kimakosa irejelee eneo la utawala wa Daudi.
theological_decisions:
- issue: Maana ya tendo la הַמִּתְחַזְּקִים עִמּוֹ
  choice: waliojiimarisha pamoja naye
  alternative: waliomuunga mkono kwa nguvu
  rationale: Matini kuu inahifadhi hali ya kujirejelea na uwezekano wa kuimarika pamoja na Daudi; tanbihi inaeleza maana inayowezekana katika muktadha wa kisiasa na kijeshi bila kuifunga kabisa kauli hiyo kwa tafsiri moja.
- issue: Wigo wa maana wa בְמַלְכוּתוֹ
  choice: katika ufalme wake
  alternative: katika utawala wake
  rationale: Neno la Kiebrania linaweza kumaanisha ufalme, utawala, au umfalme. 'Ufalme wake' huhifadhi upana fulani badala ya kuamua kwamba linamaanisha kipindi cha utawala pekee.
- issue: Uhusiano wa עַל יִשְׂרָאֵל
  choice: neno la Yahweh kuhusu Israeli
  alternative: neno la Yahweh juu ya Israeli
  rationale: Muundo wa sentensi unaelekea kuunganisha kishazi hiki na neno la Yahweh. 'Kuhusu' hutoa maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi usemi wa karibu zaidi na kihusishi cha Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima, wa sasa na unaoeleweka kwa wasomaji wa kawaida. Muundo wa mstari umewekwa kwa kiasi rasmi ili kuhifadhi mfuatano wa hoja wa Kiebrania, huku tanbihi zikihifadhi maana mbadala halisi.
