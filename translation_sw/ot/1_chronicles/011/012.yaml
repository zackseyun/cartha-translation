base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/012.yaml
  text: After him was Eleazar son of Dodo the Ahohite[a]; he was among the three mighty men.
translation:
  language: sw
  text: Baada yake alikuwa Eleazari mwana wa Dodo, Mwahohi;[a] yeye alikuwa miongoni mwa wale mashujaa watatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mmoja wa wale mashujaa watatu.” Usemi wa Kiebrania unaweza kumaanisha kwamba alikuwa mshiriki wa kundi hilo maalumu la watatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרָיו
  choice: Baada yake
  rationale: Kirai hiki kinaonyesha mfuatano katika orodha ya mashujaa wa Daudi. Kiunganishi וְ hakihitaji kutafsiriwa kando ili sentensi iwe ya asili katika Kiswahili.
- source_word: אֶלְעָזָר
  choice: Eleazari
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika orodha hii, maana ya moja kwa moja ya uhusiano wa baba na mwana ndiyo inayofaa zaidi.
- source_word: דּוֹדוֹ
  choice: Dodo
  rationale: Umbo la Kiebrania katika mstari huu linaunga mkono jina Dodo.
- source_word: הָ/אֲחוֹחִי
  choice: Mwahohi
  rationale: Hili ni jina la ukoo au kundi; limetoholewa kwa kutumia muundo wa kawaida wa Kiswahili wa kumtaja mtu wa kundi fulani.
- source_word: הוּא
  choice: yeye alikuwa
  rationale: Kiwakilishi huru kimehifadhiwa na kitenzi kishirikishi kuongezwa kwa Kiswahili cha asili.
- source_word: בִּ/שְׁלוֹשָׁה
  choice: miongoni mwa wale ... watatu
  rationale: Muundo wa ב pamoja na namba unaonyesha kuwa Eleazari alihesabiwa katika kundi maalumu la watatu, bila kuongeza maelezo yasiyokuwapo.
- source_word: הַ/גִּבֹּרִים
  choice: mashujaa
  rationale: Neno hili humaanisha wapiganaji hodari wa Daudi na hapa lina ladha ya cheo cha kikundi; “mashujaa” ni la kawaida, lenye heshima, na linaeleweka vizuri kwa Kiswahili.
