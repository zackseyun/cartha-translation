  text: Adina son of Shiza the Reubenite[a], a chief of the Reubenites, and with him were thirty.
translation:
  language: sw
  text: Adina mwana wa Shiza, Mreubeni, aliyekuwa mkuu wa Wareubeni; pamoja naye walikuwa watu thelathini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “na juu yake walikuwa thelathini.” Katika orodha hii ya kijeshi, huenda maana yake ni kwamba watu thelathini walihusishwa naye.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדִינָא
  choice: Adina
  rationale: Jina la mtu limetoholewa kwa namna inayofaa Kiswahili huku likihifadhi umbo la jina la Kiebrania.
- source_word: בֶן שִׁיזָא
  choice: mwana wa Shiza
  rationale: בֶן katika orodha hii humaanisha uhusiano wa moja kwa moja wa baba na mwana; “mwana wa” ni usemi wa kawaida na wenye heshima.
- source_word: הָרְאוּבֵנִי
  choice: Mreubeni
  rationale: Nomino hii ya kikabila yenye kiambishi bainishi inamtambulisha Adina kuwa wa kabila la Reubeni.
- source_word: רֹאשׁ לָרְאוּבֵנִי
  choice: mkuu wa Wareubeni
  rationale: רֹאשׁ hapa inaonyesha cheo cha uongozi, si kichwa cha mwili; “mkuu” haibainishi kupita kiasi aina ya wadhifa.
- source_word: וְעָלָיו שְׁלוֹשִׁים
  choice: pamoja naye walikuwa watu thelathini
  rationale: Katika orodha hii ya kijeshi, עָלָיו yaelekea kuonyesha watu walioambatana naye au waliokuwa chini ya uongozi wake. Neno “watu” limewekwa wazi kutokana na muktadha.
