translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kisasa, wenye hadhi na unaoeleweka kwa urahisi. Muundo wa Kiebrania umefuatwa kwa karibu pale unapobaki wa asili katika Kiswahili; nahau ya mkuki imetafsiriwa kwa ulinganifu unaofaa, huku uwezekano wa tafsiri ya moja kwa moja zaidi ukihifadhiwa katika tanbihi.
