base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/011.yaml
  text: 'And these are the number of David’s mighty men: Jashobeam son of Hachmoni[a], the chief of the Thirty; he wielded his spear against three hundred slain in one encounter.'
translation:
  language: sw
  text: 'Hii ndiyo hesabu ya mashujaa waliokuwa wa Daudi: Yashobeamu mwana wa Hakmoni, mkuu wa Thelathini; aliutumia mkuki wake dhidi ya watu mia tatu waliouawa katika pambano moja.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliuinua au aliupunga mkuki wake dhidi ya watu mia tatu waliouawa katika tukio moja.” Nahau ya Kiebrania ni fupi, na inaweza kutafsiriwa kwa njia tofauti kuhusu tendo lililofanywa kwa mkuki na kuhusu tukio hilo moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: hesabu
  rationale: Neno hili kimsingi humaanisha idadi au hesabu; hapa linatanguliza kutajwa kwa mashujaa wa Daudi huku likihifadhi namna ya usemi wa Kiebrania.
- source_word: הַגִּבֹּרִים
  choice: mashujaa
  rationale: Katika muktadha huu wa kijeshi, neno hili humaanisha watu hodari au mashujaa wa vita. “Mashujaa” ni la kawaida, lenye hadhi, na haliongezi maelezo yasiyokuwapo.
- source_word: אֲשֶׁר לְדָוִיד
  choice: waliokuwa wa Daudi
  rationale: Kiambishi לְ kinaonyesha uhusiano na Daudi. Usemi huu wa Kiswahili unaacha wazi ikiwa walikuwa chini ya mamlaka yake au walihusishwa naye, badala ya kulazimisha maana ya umiliki.
- source_word: יָשָׁבְעָם בֶּן חַכְמוֹנִי
  choice: Yashobeamu mwana wa Hakmoni
  rationale: Majina yameandikwa kwa sauti zinazofaa Kiswahili, na uhusiano wa mwana na baba umehifadhiwa wazi.
- source_word: רֹאשׁ הַשלושים
  choice: mkuu wa wale Thelathini
  rationale: רֹאשׁ huonyesha cheo cha uongozi, kwa hiyo “mkuu” ni ya asili kuliko “kichwa.” “Wale Thelathini” imehifadhiwa kama jina au utambulisho wa kikundi maalumu.
- source_word: עוֹרֵר אֶת חֲנִיתוֹ
  choice: aliutumia mkuki wake
  rationale: Kitenzi עורר kwa kawaida ni kuamsha au kuchochea, lakini pamoja na mkuki ni nahau fupi ya tendo la kijeshi. “Aliutumia” ni Kiswahili cha kawaida kinachoonyesha matumizi ya silaha bila kudai kwamba tendo lilikuwa kuinua tu au kupunga tu.
- source_word: עַל שְׁלֹשׁ מֵאוֹת
  choice: dhidi ya watu mia tatu
  rationale: Katika muktadha wa silaha na mapigano, עַל huonyesha tendo lililoelekezwa dhidi ya wapinzani.
- source_word: חָלָל
  choice: waliouawa
  rationale: Neno hili humaanisha watu waliopigwa na kuuawa, hasa vitani. “Waliouawa” linaeleza hali yao kwa usahihi bila kutumia neno lisilo la kawaida.
- source_word: בְּפַעַם אֶחָת
  choice: katika pambano moja
  rationale: Kifungu hiki kimsingi ni “kwa wakati/tukio moja.” Katika muktadha wa kijeshi, “katika pambano moja” kinaeleza tukio moja la mapigano bila kudai kwamba wote walianguka kwa pigo moja la mkuki.
