  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa 'aka-' umetumiwa kudumisha mtiririko wa simulizi. Jina la kitopografia Milo limehifadhiwa kwa sababu rejeo lake halina uhakika. Alama zote za tanbihi zimo katika matini kuu karibu na maneno yanayohusika.
