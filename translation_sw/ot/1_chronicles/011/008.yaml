base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/008.yaml
  text: He built the city all around[a], from the Millo even to the surrounding area[b], and Joab restored the rest of the city.
translation:
  language: sw
  text: Akaujenga mji pande zote, kuanzia Milo[a] na kuendelea kuuzunguka; naye Yoabu akakarabati[b] sehemu iliyobaki ya mji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Milo” ni istilahi ya kijiografia katika Yerusalemu ambayo maana yake kamili haijulikani. Huenda ikarejelea muundo wa matuta au tuta lililojazwa udongo.
    reason: cultural_note
  - marker: b
    text: Kitenzi cha Kiebrania kilichotafsiriwa “akakarabati” kwa halisi humaanisha “akafanya kuwa hai”; hapa yaelekea kinamaanisha kuurejesha au kuurekebisha mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Akaujenga
  rationale: Qal wayyiqtol ya בנה inaendeleza simulizi kwa tendo la wakati uliopita. Kiambishi cha nafsi kinamrejelea Daudi katika mstari uliotangulia, na 'aka-' huhifadhi mwendelezo wa simulizi.
- source_word: הָעִיר
  choice: mji
  rationale: עִיר kwa kawaida humaanisha mji, na hapa inarejelea Yerusalemu/Zayuni.
- source_word: מִסָּבִיב
  choice: pande zote
  rationale: Usemi huu wa kielezi unaonyesha eneo linalozunguka; 'pande zote' ni Kiswahili cha kawaida na chenye kueleweka.
- source_word: מִן הַמִּלּוֹא
  choice: kutoka Milo[a]
  rationale: מִלּוֹא imehifadhiwa kama jina la mahali kwa sababu maana yake halisi ya kijiografia haijulikani kwa uhakika; tanbihi inaeleza utata huo.
- source_word: וְעַד הַסָּבִיב
  choice: mpaka eneo lililouzunguka
  rationale: Kifungu cha Kiebrania kimebanwa na kinaonyesha mpaka au upeo wa ujenzi. Tafsiri hii ni ya asili bila kulazimisha maana mahususi ya kitaalamu.
- source_word: וְיוֹאָב
  choice: naye Yoabu
  rationale: Jina limeandikwa kwa namna iliyozoeleka katika Kiswahili, huku kiunganishi kikionyesha mhusika tofauti anayefanya tendo linalofuata.
- source_word: יְחַיֶּה
  choice: akakarabati
  rationale: Piel ya חיה kwa halisi ni 'akafanya kuwa hai,' lakini ikihusishwa na mji inaelekea kumaanisha kuurekebisha au kuurudisha katika hali nzuri. 'Akakarabati' huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: אֶת שְׁאָר הָעִיר
  choice: sehemu nyingine ya mji
  rationale: שְׁאָר ni sehemu iliyobaki. 'Sehemu nyingine ya mji' inaonyesha kwamba Yoabu alishughulikia sehemu iliyosalia baada ya kazi iliyotajwa kwanza.
