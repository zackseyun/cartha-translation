reference: 1 Chronicles 11:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר חָלִילָ/ה֩ לִּ֨/י מֵ/אֱלֹהַ֜/י מֵ/עֲשׂ֣וֹת זֹ֗את הֲ/דַ֣ם הָ/אֲנָשִׁים֩ הָ/אֵ֨לֶּה אֶשְׁתֶּ֤ה בְ/נַפְשׁוֹתָ/ם֙ כִּ֣י בְ/נַפְשׁוֹתָ֣/ם הֱבִיא֔וּ/ם וְ/לֹ֥א אָבָ֖ה לִ/שְׁתּוֹתָ֑/ם אֵ֣לֶּה עָשׂ֔וּ שְׁלֹ֖שֶׁת הַ/גִּבּוֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/019.yaml
  text: And he said[a], “Far be it from me, by my God, to do this! Shall I drink the blood of these men at the cost of their lives? For they brought it at the cost of their lives.” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: sw
  text: Naye akasema, “Mungu wangu asiniruhusu kamwe kufanya jambo hili! Je, ninywe damu ya watu hawa kwa kuhatarisha maisha yao?[a] Kwa maana waliyaleta maji haya kwa kuhatarisha maisha yao.” Kwa hiyo hakukubali kuyanywa.[b] Hayo ndiyo waliyofanya wale mashujaa watatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maisha yao.” Kiebrania kinarudia usemi huu mara mbili; katika muktadha huu unamaanisha kwamba walihatarisha maisha yao.
    reason: lexical_alternative
  - marker: b
    text: Neno “damu” limehifadhiwa kama lilivyo. Daudi anayazungumzia maji kana kwamba ni damu yao kwa sababu waliyapata kwa kuhatarisha maisha yao.
    reason: cultural_note
lexical_decisions:
- source_word: חָלִילָה לִּי מֵאֱלֹהַי
  choice: Mungu wangu asiniruhusu kamwe
  rationale: Nahau hii inaonyesha kukataa kwa nguvu huku ikimhusisha Mungu. Kiswahili hiki ni cha kawaida na chenye heshima, bila kugeuza kauli hiyo kuwa kiapo dhahiri zaidi kuliko Kiebrania.
- source_word: מֵעֲשׂוֹת זֹאת
  choice: kufanya jambo hili
  rationale: Muundo wa Kiebrania unaonyesha jambo ambalo msemaji analikataa kabisa; tafsiri hii ni ya moja kwa moja na ya asili kwa Kiswahili.
- source_word: הֲדַם הָאֲנָשִׁים הָאֵלֶּה אֶשְׁתֶּה
  choice: Je, ninywe damu ya watu hawa
  rationale: Swali la balagha limehifadhiwa, na neno 'damu' limeachwa kama lilivyo ili kudumisha picha yenye nguvu ya Kiebrania.
- source_word: בְנַפְשׁוֹתָם
  choice: kwa gharama ya maisha yao / kwa kuhatarisha maisha yao
  rationale: נֶפֶשׁ hapa humaanisha uhai. Kauli ya kwanza inadumisha wazo la gharama, huku urudiaji wa pili ukifafanua kwamba hawakufa bali waliweka maisha yao hatarini; tanbihi huhifadhi urudiaji na upeo wa maana ya Kiebrania.
- source_word: כִּי בְנַפְשׁוֹתָם הֱבִיאוּם
  choice: Kwa maana waliyaleta maji haya kwa kuhatarisha maisha yao
  rationale: Kiambishi cha yambwa kinarejelea maji. Kutaja 'maji haya' huondoa utata wa kisarufi unaoweza kutokea katika Kiswahili na kueleza hali ya hatari iliyokusudiwa.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: Kwa hiyo hakukubali kuyanywa
  rationale: אָבָה huhusu utashi au kukubali. 'Hakukubali' huhifadhi maana hiyo vizuri kuliko kauli inayodokeza kutoweza.
- source_word: אֵלֶּה עָשׂוּ שְׁלֹשֶׁת הַגִּבּוֹרִים
  choice: Hayo ndiyo waliyofanya wale mashujaa watatu
  rationale: גִּבּוֹרִים ni mashujaa au wapiganaji hodari wa Daudi. 'Mashujaa' ni neno la asili, lenye hadhi, na linalohifadhi uzito wa kijeshi na kishujaa.
theological_decisions:
- issue: Maana ya 'damu' katika kauli ya Daudi
  choice: Kuhifadhi neno halisi 'damu' na kuacha muktadha uonyeshe kwamba maji yanafananishwa na damu kwa sababu yalipatikana kwa hatari ya kufa.
  alternative: Kufafanua moja kwa moja kuwa ni 'maji yaliyopatikana kwa kuhatarisha maisha.'
  rationale: Kiebrania kinataja damu waziwazi, na nguvu ya kimaadili ya kauli ya Daudi inategemea picha hiyo; kuiparafrezi katika matini kuu kungeondoa mvutano huo.
- issue: Maana ya נֶפֶשׁ
  choice: maisha
  alternative: roho
  rationale: Katika muktadha huu neno linamaanisha uhai wa kimwili uliowekwa hatarini, si dai kuhusu sehemu isiyo ya mwili ya mwanadamu.
- issue: Nguvu ya מֵאֱלֹהַי katika kauli ya kukataa
  choice: Mungu wangu asiniruhusu kamwe
  alternative: Na iwe mbali nami mbele ya Mungu wangu / kwa Mungu wangu
  rationale: Kiswahili kilichochaguliwa huhifadhi rejeo kwa Mungu na nguvu ya kukataa bila kulazimisha tafsiri yenye utata kati ya maana ya kiapo na maana ya kuwa mbele za Mungu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa optimal-equivalence: picha ya ''damu,'' swali la balagha, na maana ya utashi katika אָבָה zimehifadhiwa; ufafanuzi mdogo umetumiwa ili Kiswahili kiwe wazi na cha kawaida.'
