lexical_decisions:
- source_word: שַׁמּוֹת
  choice: Shamothi
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili; umbo hili linafuata matamshi ya jina la Kiebrania kwa njia inayoeleweka kwa msomaji wa Kiswahili.
- source_word: הֲרוֹרִי
  choice: Mharori
  rationale: Nomino ya asili yenye kiambishi bainishi, ikimtaja mtu wa ukoo au mahali paitwapo Harori. Tafsiri hii inafuata umbo la Maandishi ya Kimasora katika Mambo ya Nyakati bila kulilinganisha kimyakimya na simulizi sambamba.
- source_word: חֶלֶץ
  choice: Helezi
  rationale: Jina la mtu limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: פְּלוֹנִי
  choice: Mpeloni
  rationale: Nomino ya asili yenye kiambishi bainishi, ikimtaja mtu wa ukoo au mahali paitwapo Peloni. Inahifadhi usomaji wa Mambo ya Nyakati badala ya kuubadili kufuata orodha sambamba katika 2 Samweli.
