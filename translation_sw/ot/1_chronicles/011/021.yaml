  yaml_path: translation/ot/1_chronicles/011/021.yaml
  text: He was more honored than the two among the three[a], and he became their commander; but he did not attain to the three.
translation:
  language: sw
  text: Aliheshimiwa zaidi kuliko wale wawili miongoni mwa wale watatu[a], naye akawa mkuu wao; lakini hakufikia cheo cha wale watatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Aliheshimiwa kuliko wale watatu, kwa wale wawili.” Kiebrania hapa kimebanwa na ni kigumu; maana ya jumla ni kwamba aliheshimiwa sana ndani ya kundi lenye madaraja, lakini bado hakulingana na “wale watatu.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשָׁה בַשְּׁנַיִם
  choice: kuliko wale wawili kati ya wale watatu
  rationale: Kirai cha Kiebrania kimebanwa na ni kigumu. Tafsiri hii inaonyesha ulinganisho ndani ya kundi lenye vyeo, huku tanbihi ikihifadhi uwezekano mwingine wa kisarufi.
- source_word: נִכְבָּד
  choice: mwenye kuheshimiwa zaidi
  rationale: Nifali ya כבד hapa ina maana ya kupewa heshima au kuthaminiwa; muundo wa ulinganisho unahitaji neno “zaidi.”
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: naye akawa kamanda wao
  rationale: שׂר humaanisha mkuu, kiongozi, au kamanda. “Kamanda” inafaa katika muktadha wa kijeshi na ni Kiswahili cha sasa kinachoeleweka.
- source_word: וְעַד הַשְּׁלוֹשָׁה לֹא בָא
  choice: lakini hakufikia cheo cha wale watatu
  rationale: בוא pamoja na עד hapa inaeleza kufikia hadhi au daraja, si kufika mahali kimwili. Kutaja “cheo” hufanya maana hiyo iwe wazi kwa Kiswahili cha kawaida.
