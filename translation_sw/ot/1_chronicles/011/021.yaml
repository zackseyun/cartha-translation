translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefanywa uwe wa kawaida kwa msomaji, lakini utata halisi wa kirai cha kwanza umehifadhiwa katika tanbihi.
