  text: wana wa Hashemu, Mgizoni[a], Yonathani mwana wa Shage, Mharari;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maandishi ya Kiebrania yanasema, “wana wa Hashemu, Mgizoni.” Orodha inayolingana katika 2 Samweli 23:32 ina mpangilio tofauti wa majina, ambao mara nyingi huonekana katika tafsiri au maandishi yaliyoundwa upya.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Ni wingi wa hali ya kutegemea wa בֵּן, hivyo maana yake ya moja kwa moja ni “wana wa.” Uwingi wa maandishi ya Kimasoreti umehifadhiwa bila kuoanisha mstari huu na 2 Samweli 23:32.
- source_word: הָשֵׁם
  choice: Hashemu
  rationale: Ni jina la mtu; limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: הַגִּזוֹנִי
  choice: Mgizoni
  rationale: Ni jina la nasaba au mahali lenye kibainishi; kiambishi M- huonyesha mtu mmoja wa kundi au mahali paitwapo Gizoni.
- source_word: יוֹנָתָן
  choice: Yonathani
  rationale: Jina la mtu limetoholewa kwa muundo unaotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Ni umoja wa hali ya kutegemea unaoonyesha uhusiano wa uzazi katika orodha ya majina.
- source_word: שָׁגֵה
  choice: Shage
  rationale: Ni jina la mtu lililotoholewa moja kwa moja, huku sauti ya mwisho ya Kiebrania ikiwakilishwa kwa “e” ya Kiswahili.
- source_word: הַהֲרָרִי
  choice: Mharari
  rationale: Ni jina la nasaba au asili lenye kibainishi; muundo wa Kiswahili wenye M- unamtambulisha mtu wa Harari.
