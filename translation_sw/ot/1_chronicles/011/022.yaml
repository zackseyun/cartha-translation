  text: בְּנָיָ֨ה בֶן יְהוֹיָדָ֧ע בֶּן אִֽישׁ חַ֛יִל רַב פְּעָלִ֖ים מִֽן קַבְצְאֵ֑ל ה֣וּא הִכָּ֗ה אֵ֣ת שְׁנֵ֤י אֲרִיאֵל֙ מוֹאָ֔ב וְ֠/הוּא יָרַ֞ד וְ/הִכָּ֧ה אֶֽת הָ/אֲרִ֛י בְּ/ת֥וֹךְ הַ/בּ֖וֹר בְּ/י֥וֹם הַ/שָּֽׁלֶג־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/022.yaml
  text: Benaiah son of Jehoiada[a], son of a mighty man, a man of many deeds, from Kabzeel—he struck down the two heroes of Moab. He also went down and struck down the lion in the midst of a pit on a snowy day.
translation:
  language: sw
  text: Benaya, mwana wa Yehoyada, mwana wa mtu shujaa, mwenye matendo mengi, kutoka Kabseeli—aliwapiga mashujaa wawili wa Moabu.[a] Pia alishuka, akampiga simba ndani ya shimo siku ya theluji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maana ya maneno ya Kiebrania אֲרִיאֵל מוֹאָב si hakika. Huenda yakamaanisha “wana wawili wa Arieli wa Moabu,” “Arieli wawili wa Moabu,” au “mashujaa wawili wa Moabu walio kama simba.”
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ חַיִל
  choice: mtu shujaa
  rationale: Katika muktadha wa mashujaa wa vita, kirai hiki humaanisha mtu mwenye nguvu, uhodari, au uwezo uliothibitishwa. “Mtu shujaa” ni Kiswahili cha kawaida na cha heshima kinachowasilisha maana hiyo.
- source_word: רַב פְּעָלִים
  choice: mwenye matendo mengi
  rationale: Maneno haya kihalisi yanamaanisha mwenye matendo mengi. Tafsiri hii inabaki karibu na Kiebrania bila kuamua wazi kama yalikuwa matendo makuu au ushujaa wa vita pekee.
- source_word: מִן קַבְצְאֵל
  choice: kutoka Kabseeli
  rationale: Kihusishi מִן kinaonyesha mahali alikotoka; “kutoka” kinawasilisha uhusiano huo kwa uwazi.
- source_word: הִכָּה
  choice: aliwaua / kumuua
  rationale: Katika orodha hii ya matendo ya shujaa, נכה humaanisha kumpiga na kumwangusha, na kwa kawaida kifo hudokezwa. “Kuua” ni usemi wa asili na ulio wazi katika Kiswahili kwa matukio haya.
- source_word: שְׁנֵי אֲרִיאֵל מוֹאָב
  choice: mashujaa wawili wa Moabu
  rationale: אֲרִיאֵל ni neno lenye utata, lakini katika muktadha huu huenda linawataja wapiganaji mashuhuri au wenye nguvu kama simba. Maana nyingine zinazowezekana zimehifadhiwa katika tanbihi.
- source_word: יָרַד
  choice: alishuka
  rationale: Kitenzi hiki kwa kawaida humaanisha kushuka, na hapa kinaelekea kueleza kuingia chini ndani ya shimo.
- source_word: הָאֲרִי
  choice: simba
  rationale: Nomino hii humaanisha simba moja kwa moja katika muktadha huu.
- source_word: בְּתוֹךְ הַבּוֹר
  choice: ndani ya shimo
  rationale: Kirai kinaonyesha mahali ndani ya shimo. “Ndani ya shimo” ni Kiswahili cha kawaida kuliko tafsiri ya neno kwa neno “katikati ya shimo.”
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: siku yenye theluji
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida hali ya siku ambayo theluji ilikuwapo, huku ikihifadhi taarifa ya mazingira ya tukio.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo umegawanywa katika sentensi mbili ili kuepuka mlolongo mzito wa viambishi na kufanya wazi kwamba tendo la kuwaua mashujaa linamhusu Benaya. Utata wa אֲרִיאֵל umeonyeshwa katika tanbihi badala ya kutatuliwa kimyakimya.
