base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/046.yaml
  text: Eliel the Mahavite[a], and Jeribai and Joshaviah, the sons of Elnaam[b], and Ithmah the Moabite.
translation:
  language: sw
  text: Elieli, Mmahavi[a], na Yeribai na Yoshavia, wana wa Elnaamu, na Yitma, Mmoabu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Mahavi; haijulikani kwa uhakika ni mahali gani au ukoo gani unaorejelewa na jina hili la asili.'
    reason: cultural_note
  - marker: b
    text: Kwa tahajia nyingine za kutohowa majina ya Kiebrania, Yeribai huweza kuandikwa Yaribai, na Yitma huweza kuandikwa Ithma.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיאֵל
  choice: Elieli
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili inayotambulika na kusomeka kwa urahisi.
- source_word: הַמַּחֲוִים
  choice: Mmahavi
  rationale: Ni jina la asili au ukoo lenye utambulisho usio hakika; limetoholewa bila kulihusisha kwa uhakika na mahali fulani. Kiambishi M- kinaonyesha mtu mmoja wa kundi hilo.
- source_word: וִירִיבַי
  choice: Yeribai
  rationale: Jina la mtu limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili.
- source_word: וְיוֹשַׁוְיָה
  choice: Yoshavia
  rationale: Jina limetoholewa kwa kutumia “sh” kuwakilisha sauti ya Kiebrania ש na “y” kwa mwanzo wa jina.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Wingi wa neno “mwana” katika hali ya kuonyesha uhusiano; hapa unawatambulisha Yeribai na Yoshavia kuwa watoto wa Elnaamu.
- source_word: אֶלְנָעַם
  choice: Elnaamu
  rationale: Jina la mtu limetoholewa kwa muundo unaosomeka kwa kawaida katika Kiswahili.
- source_word: וְיִתְמָה
  choice: na Yitma
  rationale: Yod ya mwanzo imewakilishwa kwa “Y,” kwa kufuata matamshi ya Kiebrania badala ya tahajia ya Kiingereza.
- source_word: הַמּוֹאָבִי
  choice: Mmoabi
  rationale: Jina la asili lenye kibainishi limetafsiriwa kama lakabu ya kumtambulisha Yitma kuwa mtu wa Moabu.
