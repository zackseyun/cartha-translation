translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. Majina ya vikundi maalumu “wale Thelathini” na “wale Watatu” yameandikwa kwa herufi kubwa ili kuonyesha kuwa ni makundi yanayotambulika ya mashujaa wa Daudi. Utata halisi wa מִן na מִשְׁמַעַת umehifadhiwa katika tanbihi.
