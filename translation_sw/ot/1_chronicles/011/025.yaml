base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/025.yaml
  text: Among the Thirty[a], he was indeed honored, but he did not attain to the Three[b]; and David appointed him over his bodyguard.
translation:
  language: sw
  text: Hakika, aliheshimiwa kuliko wale Thelathini[a], lakini hakufikia cheo cha wale Watatu; naye Daudi akamteua kuwa msimamizi wa walinzi wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Miongoni mwa wale Thelathini alikuwa mwenye heshima.” Kihusishi cha Kiebrania kinaweza kueleweka kwa maana ya ulinganisho (“kuliko”) au kuwa sehemu ya kundi (“miongoni mwa”).
    reason: lexical_alternative
  - marker: b
    text: Au, “juu ya kikosi chake cha ulinzi,” au “juu ya wale waliokuwa chini ya amri yake.” Neno la Kiebrania linaweza kumaanisha walinzi, kikosi cha ulinzi, au kwa upana zaidi kundi lililo chini ya mamlaka ya Daudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשִׁים ... נִכְבָּד
  choice: mwenye kuheshimiwa kuliko wale Thelathini
  rationale: 'מִן pamoja na נִכְבָּד inaweza kueleza ulinganisho: alikuwa ameheshimiwa kuliko kundi la wale Thelathini. Hii pia inadumisha ulinganisho na kutofikia cheo cha wale Watatu, huku tanbihi ikitaja uwezekano wa maana ya kigawanyo.'
- source_word: הִנּוֹ
  choice: alikuwa
  rationale: Katika muundo huu chembe hiyo ina nguvu ya kusisitiza. Kiswahili cha sasa hakihitaji neno kama “tazama” hapa; mpangilio wa sentensi unatoa kauli yenye mkazo bila kufanya lugha kuwa ngumu.
- source_word: וְאֶל הַשְּׁלוֹשָׁה לֹא בָא
  choice: lakini hakufikia cheo cha wale Watatu
  rationale: בוא pamoja na אֶל imetumiwa kwa maana ya kufikia hadhi au daraja, si kusogea mahali. Kuongeza “cheo” kunafanya nahau hiyo ieleweke wazi katika Kiswahili bila kudai kwamba alikuwa mmoja wao.
- source_word: וַיְשִׂימֵהוּ דָוִיד
  choice: naye Daudi akamweka kuwa mkuu
  rationale: שׂים hapa inaonyesha kumpa jukumu au mamlaka. “Akamweka kuwa mkuu” ni Kiswahili cha kawaida kinachoeleza uteuzi huo katika mazingira ya kijeshi.
- source_word: עַל מִשְׁמַעְתּוֹ
  choice: wa kikosi chake cha walinzi
  rationale: מִשְׁמַעַת inaweza kumaanisha kundi lililo chini ya amri, kikosi cha ulinzi, au jukumu. Katika muktadha wa mpangilio wa kijeshi wa Daudi, “kikosi chake cha walinzi” ni tafsiri yenye uwezekano mkubwa, huku tanbihi ikihifadhi upana wa neno la Kiebrania.
