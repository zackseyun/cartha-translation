  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֣י יַעְבֵּ֔ץ נִכְבָּ֖ד מֵ/אֶחָ֑י/ו וְ/אִמּ֗/וֹ קָרְאָ֨ה שְׁמ֤/וֹ יַעְבֵּץ֙ לֵ/אמֹ֔ר כִּ֥י יָלַ֖דְתִּי בְּ/עֹֽצֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/009.yaml
  text: Jabez was more honored than his brothers[a], and his mother called his name Jabez, saying[b], “Because I bore him in pain.”
translation:
  language: sw
  text: Yabesi[a] aliheshimiwa kuliko ndugu zake, na mama yake akamwita Yabesi, akisema, “Kwa sababu nilimzaa kwa uchungu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Yabesi linahusishwa hapa kwa mchezo wa maneno na neno la Kiebrania linalomaanisha uchungu au huzuni.
    reason: lexical_alternative
  - marker: b
    text: Au “nilimzaa kwa huzuni.” Neno la Kiebrania עֹצֶב linaweza kumaanisha uchungu, huzuni, au taabu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: alikuwa / aliheshimiwa
  rationale: Muundo huu unaanzisha taarifa ya simulizi. Katika Kiswahili cha sasa, maana yake imeunganishwa kwa kawaida na kitenzi cha hali “aliheshimiwa,” bila kuongeza kiashiria cha wakati kisichokuwapo wazi katika Kiebrania.
- source_word: יַעְבֵּץ
  choice: Yabesi
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili; kurudiwa kwake katika aya kunahifadhi uhusiano na maelezo ya mama kuhusu uchungu.
- source_word: נִכְבָּד מֵאֶחָיו
  choice: aliheshimiwa kuliko ndugu zake
  rationale: נִכְבָּד ina maana ya kuwa na heshima au kuheshimiwa, na מִן inaonyesha ulinganisho. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi maana ya kwamba alipata heshima zaidi yao.
- source_word: וְאִמּוֹ
  choice: na mama yake
  rationale: Huhifadhi moja kwa moja kiunganishi na umilikaji wa nafsi ya tatu.
- source_word: קָרְאָה שְׁמוֹ יַעְבֵּץ
  choice: akamwita Yabesi
  rationale: Nahau ya Kiebrania ni “akaliita jina lake,” lakini “akamwita Yabesi” ndiyo njia ya asili na iliyo wazi ya kueleza kumpa jina katika Kiswahili cha sasa.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hutanguliza moja kwa moja maneno ya mama yanayoeleza sababu ya jina.
- source_word: כִּי
  choice: Kwa sababu
  rationale: Hapa neno hili linatanguliza sababu iliyotolewa na mama kwa kumpa mtoto jina hilo.
- source_word: יָלַדְתִּי
  choice: nilimzaa
  rationale: Kitenzi kinaonyesha mama kumzaa mtoto; kiambishi cha yambwa “-m-” kinaweka wazi yule anayezungumziwa, kama muktadha unavyodokeza.
- source_word: בְּעֹצֶב
  choice: kwa uchungu
  rationale: עֹצֶב inaweza kumaanisha maumivu, huzuni, au taabu. Katika muktadha wa kuzaa, “uchungu” ni wa kawaida na unadumisha pia uwezekano wa maumivu ya mwili na taabu ya moyoni.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. “Aliheshimiwa kuliko” ni ya asili zaidi kuliko muundo mzito wa “alikuwa mwenye kuheshimiwa,” huku ikihifadhi ulinganisho wa Kiebrania. “Uchungu” unafaa katika muktadha wa kuzaa bila kufuta maana pana ya huzuni au taabu, ambayo imeonyeshwa katika tanbihi.
