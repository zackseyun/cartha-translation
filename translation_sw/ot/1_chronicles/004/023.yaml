  yaml_path: translation/ot/1_chronicles/004/023.yaml
  text: These were the potters and the inhabitants of Netaim and Gederah[a]; they lived there with the king for his work.
translation:
  language: sw
  text: Hawa ndio waliokuwa wafinyanzi na wakazi wa Netaimu na Gedera[a]; waliishi huko pamoja na mfalme kwa ajili ya kazi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au huenda: “Hawa ndio waliokuwa wafinyanzi, na watu walioishi kati ya mimea iliyopandwa na kuta au maboma.” Maneno ya Kiebrania Netaimu na Gedera yanaweza kueleweka ama kama majina ya mahali ama kama nomino za kawaida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Hawa ndio waliokuwa
  rationale: Kiwakilishi hiki kinarejelea watu waliotajwa katika nasaba iliyotangulia; Kiswahili hutumia kishazi hiki kwa utambulisho wa wakati uliopita.
- source_word: הַיּוֹצְרִים
  choice: wafinyanzi
  rationale: Neno linalotokana na יצר hapa kwa kawaida humaanisha mafundi wanaoumba udongo, yaani wafinyanzi.
- source_word: וְיֹשְׁבֵי
  choice: na wakazi wa
  rationale: Kitenzi-shirikishi katika hali ya kutegemezwa kinaonyesha watu waliokaa mahali fulani; “wakazi wa” ni Kiswahili cha kawaida chenye nguvu ya nomino.
- source_word: נְטָעִים
  choice: Netaimu
  rationale: Katika muktadha huu wa nasaba na maeneo, linaeleweka vizuri zaidi kama jina la mahali, ingawa pia linaweza kumaanisha “mimea iliyopandwa” au “mashamba ya kupandwa.”
- source_word: וּגְדֵרָה
  choice: na Gedera
  rationale: Sambamba na Netaimu, linaeleweka vizuri zaidi kama jina la mahali; maana ya kawaida ya “ukuta” au “boma” imehifadhiwa katika tanbihi.
- source_word: עִם הַמֶּלֶךְ
  choice: pamoja na mfalme
  rationale: עִם kwa msingi humaanisha “pamoja na.” Tafsiri hii haifichi uwezekano kwamba walikuwa katika utumishi wa kifalme.
- source_word: בִּמְלַאכְתּוֹ
  choice: wakimfanyia kazi
  rationale: מְלָאכָה linaweza kumaanisha kazi, shughuli, au utumishi. Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba kazi hiyo ilikuwa ya mfalme bila kuifanya maana kuwa ya kiufundi kupita kiasi.
- source_word: יָשְׁבוּ שָׁם
  choice: waliishi huko
  rationale: Kitenzi ישב pamoja na שָׁם kinaonyesha kukaa au kuishi mahali hapo; “waliishi huko” ni lugha ya sasa na ya kawaida.
