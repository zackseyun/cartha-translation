base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/039.yaml
  text: They went to the entrance of Gedor[a], as far as the east side of the valley[b], to seek pasture for their flocks.
translation:
  language: sw
  text: Wakaenda kwenye njia ya kuingia Gedori[a], hadi upande wa mashariki wa bonde[b], ili kutafuta malisho kwa ajili ya makundi yao ya mifugo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “njia ya kuikaribia Gedori”; neno la Kiebrania linaweza kumaanisha ingilio, njia ya kukaribia, au mahali pa kuingilia.
    reason: lexical_alternative
  - marker: b
    text: Au, “mashariki mwa bonde” au “kuelekea mashariki mwa bonde”; usemi wa Kiebrania ni maelezo mafupi ya kijiografia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Wakaenda
  rationale: Kitenzi hiki kinaendeleza mfululizo wa simulizi; “wakaenda” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: לִמְבוֹא
  choice: mpaka njia ya kuingilia
  rationale: מָבוֹא inaweza kumaanisha mwingilio, njia ya kukaribia, au mahali pa kuingilia; usemi huu wa Kiswahili huhifadhi maana ya mahali bila kudokeza lazima lango halisi.
- source_word: גְדֹר
  choice: Gedori
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: עַד
  choice: hadi
  rationale: Hapa neno linaonyesha mwisho au upeo wa kijiografia, si wakati.
- source_word: לְמִזְרַח הַגָּיְא
  choice: upande wa mashariki wa bonde
  rationale: Tafsiri hii ni ya asili katika Kiswahili na inawakilisha usemi mfupi wa Kiebrania kuhusu eneo la mashariki, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: לְבַקֵּשׁ
  choice: ili kutafuta
  rationale: Muundo wa kitenzi-jina unaonyesha kusudi la safari.
- source_word: מִרְעֶה
  choice: malisho
  rationale: “Malisho” ni neno la kawaida la Kiswahili kwa eneo au chakula ambako mifugo hulishwa.
- source_word: לְצֹאנָם
  choice: kwa ajili ya makundi yao
  rationale: צֹאן linaweza kujumuisha kondoo na mbuzi; “makundi” huepuka kulibana kwa aina moja tu ya mifugo.
