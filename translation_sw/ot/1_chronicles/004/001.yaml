  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania lililotafsiriwa “wana” linaweza kutumiwa katika nasaba kumaanisha wana wa moja kwa moja au, kwa upana zaidi, wazao.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana
  rationale: Ni wingi wa hali ya kutegemea wa בֵּן katika orodha ya ukoo. “Wana” ndiyo tafsiri ya moja kwa moja na ya kawaida, ingawa katika muktadha wa nasaba inaweza pia kumaanisha wazao kwa upana zaidi; uwezekano huo umeelezwa katika tanbihi.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Jina la babu na kabila; limetolewa kwa umbo la Kiswahili lililozoeleka.
- source_word: פֶּרֶץ
  choice: Peresi
  rationale: Jina la mtu limetoholewa moja kwa moja kutoka Kiebrania kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: חֶצְרוֹן
  choice: Hezroni
  rationale: Jina la mtu limetoholewa kutoka Kiebrania kwa kufuata mfumo wa sauti wa Kiswahili.
- source_word: כַרְמִי
  choice: Karmi
  rationale: Jina la mtu; kifungu hiki kinataja jina tu bila kufafanua uhusiano wake na mistari mingine ya ukoo.
- source_word: חוּר
  choice: Huri
  rationale: Jina la mtu limetoholewa kutoka Kiebrania kwa umbo la Kiswahili.
- source_word: שׁוֹבָל
  choice: Shobali
  rationale: Jina la mtu limetoholewa kutoka Kiebrania kwa umbo la Kiswahili.
- source_word: וְ
  choice: na
  rationale: Viunganishi vinavyorudiwa katika orodha ya Kiebrania vimewakilishwa kwa koma na “na” kabla ya jina la mwisho, kama ilivyo kawaida katika Kiswahili cha sasa.
