base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/024.yaml
  text: 'The sons of Simeon: Nemuel[a], Jamin, Jarib, Zerah[c][b], and Shaul.'
translation:
  language: sw
  text: Wana wa Simeoni walikuwa Nemueli[a], Yamini, Yaribu, Zera[b], na Shauli[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nemueli anaitwa Yemueli katika nasaba sambamba ya Mwanzo 46:10; hapa maandishi ya Kiebrania yanasema Nemueli.
    reason: alternative_reading
  - marker: b
    text: Zera analingana na Zohari katika nasaba sambamba za Mwanzo 46:10 na Kutoka 6:15.
    reason: textual_variant
  - marker: c
    text: Shauli ni utohozi wa karibu wa jina la Kiebrania; pia jina hili hutolewa kama Sauli.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa neno ‘mwana’ katika hali ya kuunganisha, ukitanguliza orodha ya wana waliotajwa; ‘wana wa’ ni tafsiri ya moja kwa moja na ya kawaida katika nasaba.
- source_word: שִׁמְעוֹן
  choice: Simeoni
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: נְמוּאֵל
  choice: Nemueli
  rationale: Jina limetoholewa kutoka katika umbo la Kiebrania lililo katika mstari huu; umbo tofauti ‘Yemueli’ linahifadhiwa katika tanbihi.
- source_word: וְיָמִין
  choice: Yamini
  rationale: Kiunganishi ו kinawakilishwa kiasili katika orodha kwa koma na ‘na’ kabla ya jina la mwisho; jina יָמִין limetoholewa kuwa Yamini.
- source_word: יָרִיב
  choice: Yaribu
  rationale: Jina limetoholewa badala ya kutafsiri maana yake ya kimsamiati, kwa kuwa hapa ni jina la mtu.
- source_word: זֶרַח
  choice: Zera
  rationale: Hili linaakisi moja kwa moja umbo זֶרַח katika mstari huu; umbo Zohari katika nasaba sambamba linatajwa katika tanbihi.
- source_word: שָׁאוּל
  choice: Shauli
  rationale: Jina limetoholewa kwa Kiswahili kutoka katika Kiebrania שָׁאוּל; umbo Sauli ni mbadala uliozoeleka katika mapokeo fulani.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na ulio wazi. ‘Walikuwa’ imeongezwa kwa ufasaha wa sentensi ya Kiswahili, ingawa Kiebrania kina kishazi kifupi cha orodha bila kitenzi. Majina yametoholewa kwa maumbo yanayotamkika kiasili katika Kiswahili, huku tofauti za nasaba zikihifadhiwa katika tanbihi.
