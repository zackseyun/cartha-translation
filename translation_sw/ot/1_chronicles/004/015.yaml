  yaml_path: translation/ot/1_chronicles/004/015.yaml
  text: 'And the sons of Caleb son of Jephunneh: Iru[a], Elah, and Naam; and the sons of Elah: Kenaz.'
translation:
  language: sw
  text: 'Nao wana wa Kalebu mwana wa Yefune: Iru,[a] Ela na Naamu; na wana wa Ela: Kenazi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana pana zaidi, “wazao wa Kalebu mwana wa Yefune.” Katika nasaba, “wana” wakati mwingine humaanisha jamaa wa vizazi vya baadaye, ingawa hapa orodha ya majina inaelekea kumaanisha wana wa moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי כָּלֵב
  choice: Nao wana wa Kalebu
  rationale: בְּנֵי kwa kawaida humaanisha ‘wana wa’ katika nasaba. Kiunganishi וּ kimetafsiriwa ‘Nao’ ili kuendeleza orodha kwa Kiswahili cha kawaida.
- source_word: בֶּן יְפֻנֶּה
  choice: mwana wa Yefune
  rationale: Hii ni taarifa ya nasaba inayomtambulisha Kalebu anayekusudiwa.
- source_word: עִירוּ
  choice: Iru
  rationale: Jina la mtu limetoholewa kwa kufuata matamshi ya maandishi ya Kiebrania.
- source_word: אֵלָה
  choice: Ela
  rationale: Katika muktadha huu ni jina la mtu, si nomino ya kawaida.
- source_word: וָנָעַם
  choice: na Naamu
  rationale: Muundo na irabu za Kiebrania zinaunga mkono jina la kiume Naam; umbo ‘Naamu’ linafuata utaratibu wa kawaida wa Kiswahili wa kuepuka konsonanti ya mwisho.
- source_word: וּבְנֵי אֵלָה
  choice: na mwana wa Ela
  rationale: Ingawa בְּנֵי ni wingi kisarufi, maandishi yanataja Kenazi peke yake. Kiswahili cha asili hutumia umoja hapa bila kupoteza jina lolote; tanbihi huhifadhi muundo halisi wa Kiebrania.
- source_word: וּקְנַז
  choice: Kenazi
  rationale: Jina la mtu limetoholewa katika umbo linalotumika kwa kawaida katika Kiswahili.
