  text: and Meshobab[a], and Jamlech, and Joshah son of Amaziah.
translation:
  language: sw
  text: na Meshobabu, na Yamleki, na Yosha mwana wa Amazia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשׁוֹבָב
  choice: Meshobabu
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, likiongezewa irabu ya mwisho bila kutafsiri maana ya jina.
- source_word: יַמְלֵךְ
  choice: Yamleki
  rationale: Yod ya Kiebrania imewakilishwa kwa Y, kama inavyofaa kwa matamshi na tahajia ya Kiswahili; irabu ya mwisho imeongezwa ili kurahisisha matamshi.
- source_word: יוֹשָׁה
  choice: Yosha
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa Y ya mwanzo, badala ya kufuata desturi ya Kiingereza ya kutumia J.
- source_word: בֶּן
  choice: mwana wa
  rationale: Hii ndiyo njia ya kawaida na ya asili ya Kiswahili kuonyesha uhusiano wa nasaba katika orodha.
- source_word: אֲמַצְיָה
  choice: Amazia
  rationale: Jina limetoholewa kwa umbo linalotambulika na linalosomeka kwa kawaida katika Kiswahili.
- source_word: וְ
  choice: na
  rationale: Kiunganishi kilichorudiwa katika Kiebrania kimehifadhiwa ili kudumisha muundo wa orodha.
