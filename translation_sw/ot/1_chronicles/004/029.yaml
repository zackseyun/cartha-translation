lexical_decisions:
- source_word: וּ/בְ/בִלְהָה
  choice: na huko Bilha
  rationale: Kiunganishi וּ pamoja na kihusishi בְ kinaendeleza orodha ya makazi. Katika Kiswahili, “huko” ni ya asili kwa kutaja mahali katika orodha, huku jina la mahali בִלְהָה likinakiliwa kuwa “Bilha”.
- source_word: וּ/בְ/עֶצֶם
  choice: na huko Ezemu
  rationale: Muundo וּבְ unaendelea kwa maana ya mahali. עֶצֶם hapa ni jina la mji, hivyo limenakiliwa “Ezemu” kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: וּ/בְ/תוֹלָד
  choice: na huko Toladi
  rationale: Muundo huohuo unaendeleza orodha ya makazi. תוֹלָד ni jina la mahali na limenakiliwa “Toladi” kwa mtindo wa majina ya Biblia katika Kiswahili.
