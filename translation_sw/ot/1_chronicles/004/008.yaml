base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/008.yaml
  text: Koz fathered Anub[a], Hazzobebah[b], and the families of Aharhel son of Harum.
translation:
  language: sw
  text: Kosi akawazaa Anubu, Hasobeba[a], na jamaa[b] za Aharheli mwana wa Harumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Sobeba,” ikiwa kiambishi cha mwanzo katika Kiebrania hakihusishwi na jina lenyewe.
    reason: lexical_alternative
  - marker: b
    text: “Jamaa” pia inaweza kutafsiriwa “koo” katika muktadha huu wa nasaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹץ
  choice: Kosi
  rationale: Jina limenukuliwa kwa tahajia inayosomeka kwa kawaida katika Kiswahili; sauti ya צ imewakilishwa kwa “s,” na irabu ya mwisho imetumiwa kulifanya jina litamkike kwa urahisi.
- source_word: הוֹלִ֔יד
  choice: akawazaa
  rationale: Katika orodha ya nasaba, Hiphil ya ילד huonyesha kuzaa au kuwa chanzo cha ukoo. “Akawazaa” ni fupi, ya kawaida, na inadumisha muundo wa moja kwa moja wa Kiebrania.
- source_word: עָנ֖וּב
  choice: Anubu
  rationale: Jina limenukuliwa kwa namna inayofaa mfumo wa sauti wa Kiswahili.
- source_word: הַ/צֹּבֵבָ֑ה
  choice: Hasobeba
  rationale: Tahajia hii inadumisha sauti ya mwanzo inayotokana na kiambishi הַ־ katika umbo la Kimasora; “Sobeba” pia inawezekana ikiwa kiambishi hicho hakihusishwi na jina.
- source_word: וּ/מִשְׁפְּח֥וֹת
  choice: na jamaa za
  rationale: Katika muktadha wa nasaba, מִשְׁפָּחוֹת ni makundi ya watu wenye ukoo mmoja. “Jamaa” ni ya kawaida na pana, huku “koo” ikiwa tafsiri mbadala inayowezekana.
- source_word: אֲחַרְחֵ֖ל
  choice: Aharheli
  rationale: Jina limenukuliwa moja kwa moja kwa tahajia inayotamkika kwa Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Hiki ndicho kiungo cha kawaida cha nasaba katika Kiswahili.
- source_word: הָרֽוּם
  choice: Harumu
  rationale: Jina linafuata matamshi ya Kimasora na limepewa irabu ya mwisho ili lisomeke kwa kawaida katika Kiswahili.
