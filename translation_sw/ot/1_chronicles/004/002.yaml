base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/002.yaml
  text: Reaiah son of Shobal fathered Jahath[a], and Jahath fathered Ahumai and Lahad. These were the clans of the Zorathites.
translation:
  language: sw
  text: Reaya mwana wa Shobali alimzaa Yahathi, naye Yahathi akawazaa Ahumai na Lahadi. Hizi ndizo koo[a] za Wasora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa.” Neno la Kiebrania linaweza kumaanisha makundi mapana ya watu wenye undugu; hapa “koo” limetumiwa kwa sababu ya muktadha wa nasaba ya kikabila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאָיָה
  choice: Reaya
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili, bila kulitafsiri maana yake.
- source_word: בֶן
  choice: mwana wa
  rationale: Huhifadhi namna rasmi ya ukoo katika Kiebrania; katika orodha za vizazi neno hili linaweza pia kumaanisha mzao.
- source_word: הוֹלִיד / הֹלִיד
  choice: alimzaa / akawazaa
  rationale: Hifili ya ילד katika nasaba humaanisha kuzaa au kuwa baba wa mtu. Kitenzi “zaa” ni cha kawaida na kifupi katika nasaba za Kiswahili; umoja na wingi vimeonyeshwa kulingana na waliotajwa.
- source_word: יַחַת
  choice: Yahathi
  rationale: Jina la mtu limetoholewa kwa mfumo wa sauti wa Kiswahili.
- source_word: אֲחוּמַי
  choice: Ahumai
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa.
- source_word: לָהַד
  choice: Lahadi
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: אֵלֶּה
  choice: Hizi ndizo
  rationale: Kiwakilishi kinaelekeza kwenye koo zinazotokana na watu waliotajwa; muundo huu ni wa asili katika Kiswahili.
- source_word: מִשְׁפְּחֹות
  choice: koo
  rationale: Katika muktadha wa kikabila na kinasaba, “koo” huonyesha makundi mapana ya jamaa vizuri kuliko “familia,” ambalo mara nyingi humaanisha nyumba moja.
- source_word: הַצָּרְעָתִי
  choice: Wasorathi
  rationale: Ni jina la watu linalotokana na mahali paitwapo Sora; kiambishi Wa- kinaonyesha kundi la watu kwa Kiswahili.
