base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/018.yaml
  text: And his wife the Jewess bore Jered the father of Gedor[a], Heber the father of Soco, and Jekuthiel the father of Zanoah. These are the sons of Bithiah daughter of Pharaoh[c][b], whom Mered took as wife.
translation:
  language: sw
  text: Na mke wake, mwanamke wa Kiyahudi,[a] akamzaa Yered, baba wa Gedor;[b] Heberi, baba wa Soko; na Yekuthieli, baba wa Zanoa. Hao ndio wana wa Bithia, binti ya Farao,[c] ambaye Mered alimchukua kuwa mke wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwanamke wa Yuda.”
    reason: lexical_alternative
  - marker: b
    text: Katika Mambo ya Nyakati, “baba wa” pia inaweza kumaanisha mwanzilishi, babu wa ukoo, au mkuu wa ukoo aliyehusishwa na mahali fulani.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania hapa ni kigumu: haijulikani wazi ikiwa “mke wake, mwanamke wa Kiyahudi” na Bithia, binti ya Farao, ni mwanamke mmoja au wake wawili tofauti wa Mered.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַיְהֻדִיָּה
  choice: yule mwanamke Myahudi
  rationale: Nomino ya kike ya Kiebrania inaonyesha mwanamke wa Kiyahudi au wa Yuda. Kiswahili sanifu hutumia ‘mwanamke Myahudi’; tanbihi huhifadhi uwezekano wa maana ya kijiografia ‘mwanamke wa Yuda’.
- source_word: יָלְדָה
  choice: akamzaa
  rationale: Katika nasaba, kitenzi hiki humaanisha kuzaa; ‘akamzaa’ ni cha asili na kifupi katika Kiswahili.
- source_word: אֲבִי
  choice: baba wa
  rationale: Huhifadhi nahau ya Kiebrania bila kuamua ikiwa anayelengwa ni baba halisi, mwanzilishi, babu wa ukoo, au mkuu aliyehusishwa na mahali.
- source_word: שׂוֹכוֹ
  choice: Soko
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: יְקוּתִיאֵל
  choice: Yekuthieli
  rationale: Jina la mtu limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: זָנוֹחַ
  choice: Zanoa
  rationale: Jina la mahali limetoholewa kwa Kiswahili.
- source_word: בְּנֵי
  choice: wana
  rationale: Neno la Kiebrania linasema kihalisi ‘wana’; Kiswahili ‘wana’ linafaa katika mtindo wa nasaba.
- source_word: בִּתְיָה בַת פַּרְעֹה
  choice: Bithia, binti ya Farao
  rationale: Huhifadhi wazi uhusiano wa kifamilia ulio katika Kiebrania.
- source_word: לָקַח
  choice: alimchukua kuwa mke wake
  rationale: Ingawa maana ya msingi ni ‘alichukua’, katika muktadha wa ndoa usemi huo humaanisha kumchukua mwanamke awe mke.
- source_word: וְאֵלֶּה
  choice: Hao ndio
  rationale: Hutoa utambulisho wa muhtasari kwa Kiswahili cha kawaida huku kiunganishi cha Kiebrania kikieleweka kutokana na mtiririko.
theological_decisions:
- issue: Uhusiano kati ya ‘mke wake, yule mwanamke Myahudi’ na ‘Bithia, binti ya Farao’
  choice: Kuhifadhi mfuatano na mvutano wa Kiebrania bila kuyatambulisha wazi kuwa mwanamke mmoja wala kuyatenganisha kuwa wake wawili.
  alternative: Kuelewa mwanamke Myahudi kuwa Bithia mwenyewe, au kupangilia sentensi upya ili yatofautishwe wazi kuwa wake wawili wa Meredi.
  rationale: Sintaksia ya mstari ni ngumu, na maandishi hayatatui wazi ikiwa majina hayo yanamhusu mwanamke mmoja au wanawake tofauti. Tafsiri inaacha swali hilo wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yametoholewa kwa mfumo wa kawaida wa Kiswahili; sintaksia tata ya nasaba imegawanywa kwa alama za uakifishaji bila kuondoa utata wa maandishi.
