base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/038.yaml
  text: These[a], who were mentioned by name, were leaders in their clans[b], and their ancestral houses increased greatly.
translation:
  language: sw
  text: Hawa[a], waliotajwa kwa majina, walikuwa viongozi katika koo zao, na nyumba za baba zao zikaongezeka sana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hawa waliokuja kwa majina.” Neno la Kiebrania kihalisi humaanisha “wanaokuja,” lakini katika muktadha huu wa orodha ya nasaba huenda linarejelea watu walioandikwa au waliotambuliwa kwa majina.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “na nyumba za baba zao zilipanuka kuwa nyingi.” “Nyumba za baba” hapa humaanisha kaya au matawi ya ukoo wa upande wa baba.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hawa
  rationale: Kiwakilishi cha wingi kinarejelea watu waliotangulia katika orodha ya nasaba; “Hawa” ni cha kawaida na wazi katika Kiswahili.
- source_word: הַבָּאִים
  choice: waliotajwa
  rationale: Ingawa umbo hili la kitenzi בוא kwa kawaida humaanisha “wanaokuja,” pamoja na בְּשֵׁמוֹת katika muktadha wa nasaba linaelekea kumaanisha watu walioingizwa au kutajwa katika orodha.
- source_word: בְּשֵׁמוֹת
  choice: kwa majina
  rationale: Ni usemi wa kawaida unaoonyesha kwamba watu walitajwa mmoja mmoja kwa majina.
- source_word: נְשִׂיאִים
  choice: viongozi
  rationale: Neno hili humaanisha wakuu wa kijamii au wa koo; “viongozi” ni la asili na halileti dhana ya kifalme isiyokusudiwa.
- source_word: בְּמִשְׁפְּחוֹתָם
  choice: katika koo zao
  rationale: Katika nasaba, מִשְׁפָּחָה mara nyingi ni kundi pana la ukoo kuliko familia ya nyumbani.
- source_word: וּבֵית אֲבוֹתֵיהֶם
  choice: jamaa za mababu zao
  rationale: Usemi huo unaashiria nyumba au mistari ya ukoo wa baba; “jamaa za mababu zao” ni ya kueleweka na huhifadhi maana ya nasaba.
- source_word: פָּרְצוּ
  choice: ziliongezeka
  rationale: Kitenzi kina taswira ya kupanuka au kuenea kwa nguvu; hapa kinaonyesha kuongezeka kwa idadi ya jamaa hizo.
- source_word: לָרֹב
  choice: sana
  rationale: Kirai hiki husisitiza wingi mkubwa; “sana” kinaendana kwa kawaida na “ziliongezeka.”
