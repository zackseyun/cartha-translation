base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/040.yaml
  text: And they found rich and good pasture[a], and the land was broad, quiet, and peaceful, for those from Ham who had lived there formerly were there before.
translation:
  language: sw
  text: Nao wakapata malisho yenye rutuba na mazuri, nayo nchi ilikuwa pana, tulivu, na yenye amani, kwa maana wazao wa Hamu walikuwa wameishi huko zamani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana wale waliokuwa wameishi huko zamani walitokana na Hamu.”
    reason: Kiebrania cha kifungu cha mwisho kinaweza kueleweka ama kama rejeo la wazao wa Hamu waliokaa huko zamani, ama kwa mpangilio wa karibu zaidi na maneno ya asili, kwamba wakaaji wa zamani walitokana na Hamu.
lexical_decisions:
- source_word: מִרְעֶה
  choice: malisho
  rationale: Nomino hii humaanisha mahali pa kulishia mifugo; “malisho” ni neno la kawaida na linalofaa muktadha.
- source_word: שָׁמֵן
  choice: yenye rutuba
  rationale: Ingawa maana halisi ni “nono,” kuhusu malisho neno hili huonyesha wingi na ustawi wa mimea; “yenye rutuba” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: טוֹב
  choice: mazuri
  rationale: Huhifadhi tathmini rahisi na chanya ya Kiebrania na hukubaliana kisarufi na “malisho.”
- source_word: רַחֲבַת יָדַיִם
  choice: pana
  rationale: Nahau hiyo humaanisha eneo lenye nafasi nyingi au lililoenea; “pana” ni tafsiri fupi na ya asili.
- source_word: שֹׁקֶטֶת
  choice: tulivu
  rationale: Kivumishi hiki kinaonyesha hali ya kutosumbuliwa au kuwa katika utulivu.
- source_word: שְׁלֵוָה
  choice: yenye amani
  rationale: Neno linaweza kumaanisha usalama, starehe, au utulivu; hapa “yenye amani” hudumisha maana yake bila kulazimisha wazo la ufanisi wa kiuchumi.
- source_word: כִּי מִן חָם הַיֹּשְׁבִים שָׁם לְפָנִים
  choice: kwa maana wazao wa Hamu walikuwa wameishi huko zamani
  rationale: Kifungu kinaeleza kwamba wakaaji wa awali walitokana na Hamu. “Wazao wa Hamu” ni njia ya asili ya kueleza nasaba inayodokezwa, na “zamani” hutafsiri לְפָנִים.
- source_word: חָם
  choice: Hamu
  rationale: Jina la mtu limetolewa kwa umbo lililozoeleka katika Biblia za Kiswahili.
