base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/043.yaml
  text: And they struck down the remnant of the survivors of Amalek[b][a], and they lived there to this day.
translation:
  language: sw
  text: Nao wakawapiga mabaki ya Waamaleki waliokuwa wameponyoka[a], wakaishi huko mpaka leo hii[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi ya muundo wa Kiebrania, “mabaki ya walionusurika wa Amaleki.” Kiebrania kinaunganisha maneno mawili yanayokaribiana kimaana kuhusu wale waliobaki baada ya maangamizi.
    reason: lexical_alternative
  - marker: b
    text: Au “wakafanya makao huko mpaka leo hii.” Kitenzi kinaweza kumaanisha kuishi mahali au kufanya makao huko.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: wakawapiga
  rationale: Kitenzi נכה katika simulizi la kijeshi humaanisha kupiga au kuwaangusha, mara nyingi kwa matokeo ya kifo. “Wakawapiga” huhifadhi maana ya msingi bila kutaja wazi zaidi ya Kiebrania kwamba wote waliuawa.
- source_word: שְׁאֵרִית הַפְּלֵטָה
  choice: mabaki ... waliokuwa wameponyoka
  rationale: Maneno mawili yanayokaribiana kimaana yanasisitiza watu wachache waliobaki baada ya maangamizi ya awali. Tafsiri hii inawakilisha yote mawili kwa Kiswahili cha kawaida.
- source_word: לַעֲמָלֵק
  choice: ya Waamaleki
  rationale: Jina Amaleki hapa linatumika kwa maana ya kundi la watu; “Waamaleki” ni namna ya asili na iliyo wazi katika Kiswahili.
- source_word: וַיֵּשְׁבוּ
  choice: wakaishi
  rationale: Kitenzi ישב kinaweza kumaanisha kukaa, kuishi, au kufanya makao. “Wakaishi” ni cha kawaida na hakiondoi uwezekano wa maana ya kufanya makao.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki cha mahali kinarejelea eneo lililotajwa katika muktadha uliotangulia.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo hii
  rationale: Hii ni tafsiri ya kawaida ya msemo wa Kiebrania unaoonyesha kwamba hali hiyo iliendelea hadi wakati wa msimulizi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa “waka-” na hadhi inayofaa maandiko. Muundo wa Kiebrania wenye msisitizo wa mabaki yaliyoponyoka umehifadhiwa kwa lugha ya kawaida, huku tanbihi zikidumisha mbadala halisi wa kileksika.
