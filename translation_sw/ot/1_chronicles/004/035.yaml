  rationale: Jina la mtu limetoholewa kwa namna inayokaribia umbo la Kiebrania na inayotambulika katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika kanuni hii ya nasaba, neno hili kwa kawaida huonyesha uhusiano wa mwana na baba; tafsiri ileile imedumishwa katika marudio yote.
- source_word: יֹשִׁבְיָה
