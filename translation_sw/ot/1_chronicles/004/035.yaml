  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa tahajia ya asili ya Kiswahili.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Jina limetoholewa kwa umbo linalotambulika katika mapokeo ya Biblia ya Kiswahili.
- source_word: עֲשִׂיאֵל
  choice: Asieli
  rationale: Jina limetoholewa kutoka Kiebrania kwa muundo wa silabi unaosomeka kwa urahisi katika Kiswahili.
