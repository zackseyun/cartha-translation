base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/021.yaml
  text: 'The sons of Shelah son of Judah: Er the father of Lecah[a], and Laadah the father of Mareshah, and the clans of the house of linen workers of the house of Ashbea.'
translation:
  language: sw
  text: 'Wana wa Shela, mwana wa Yuda: Eri, baba wa Leka; Laada, baba wa Maresha; na koo za nyumba ya wafanyakazi wa kitani, za Beth-Ashbea.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “koo za nyumba ya wale waliofanya kazi ya kitani safi, za nyumba ya Ashbea.” Kifungu cha Kiebrania kimebanwa. Katika orodha hii, “baba wa” pia inaweza kumaanisha “babu wa ukoo” au “mwanzilishi wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Inahifadhi lugha ya moja kwa moja ya ukoo; katika muktadha huu inaweza pia kuwahusu wazao kwa maana pana.
- source_word: שֵׁלָה בֶן יְהוּדָה
  choice: Shela mwana wa Yuda
  rationale: Majina yametoholewa kwa mwandiko wa kawaida wa Kiswahili, na uhusiano wa ukoo uliotajwa wazi katika Kiebrania umehifadhiwa.
- source_word: אֲבִי
  choice: baba wa
  rationale: Ni tafsiri ya moja kwa moja, huku muktadha wa orodha za ukoo ukiruhusu pia maana ya babu wa ukoo au mwanzilishi wa mahali.
- source_word: לֵכָה
  choice: Leka
  rationale: Jina limetoholewa kwa mfumo unaosomeka kwa Kiswahili bila kuliamulia kuwa jina la mtu, ukoo, au mahali.
- source_word: לַעְדָּה
  choice: Laada
  rationale: Jina la mtu limetoholewa kwa mwandiko wa Kiswahili.
- source_word: מָרֵשָׁה
  choice: Maresha
  rationale: Jina limetoholewa kwa mwandiko wa Kiswahili; linaweza kuhusishwa na mahali au ukoo katika orodha hii.
- source_word: מִשְׁפְּחוֹת
  choice: koo
  rationale: Neno hili linaonyesha vikundi vipana vya kindugu kuliko familia ndogo ya kisasa.
- source_word: בֵּית עֲבֹדַת הַבֻּץ
  choice: nyumba ya wafanyakazi wa kitani
  rationale: Linawasilisha kundi la kifamilia au kikazi lililohusishwa na utengenezaji wa kitani, bila kubana kazi hiyo kuwa kusokota au kufuma pekee.
- source_word: לְבֵית אַשְׁבֵּעַ
  choice: yaani nyumba ya Ashbea
  rationale: Kishazi cha Kiebrania kimebanwa. Tafsiri hii inaeleza uhusiano wa koo hizo na nyumba ya Ashbea bila kuamua kwa uhakika kuwa ni eneo pekee.
