base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/017.yaml
  text: 'The sons of Ezrah: Jether[a], Mered, Epher, and Jalon; and she conceived Miriam, Shammai, and Ishbah[c][b], the father of Eshtemoa.'
translation:
  language: sw
  text: Wana wa Ezra walikuwa Yetheri[a], Meredi, Eferi na Yaloni. Naye akapata mimba, akazaa Miriamu, Shamai na Ishba, baba wa Eshtemoa[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “Na mwana wa Ezra.” Kwa kuwa majina kadhaa yanafuata, kauli hiyo kwa kawaida inaeleweka kwa maana ya jumla kuwa “wana wa Ezra.”
    reason: textual_variant
  - marker: b
    text: Kiebrania kinasema tu “naye akapata mimba”; mwanamke huyo hatambulishwi katika kifungu hiki.
    reason: lexical_alternative
  - marker: c
    text: Au “mwanzilishi wa Eshtemoa,” ikiwa Eshtemoa inaeleweka kuwa ukoo au makazi badala ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן עֶזְרָה
  choice: Wana wa Ezra
  rationale: Ingawa umbo la Kiebrania ni la umoja, kihalisi ‘Na mwana wa Ezra,’ majina kadhaa yanayofuata yanaonyesha kwamba hapa linafanya kazi kama kichwa cha orodha ya wana. Usomaji wa umoja umehifadhiwa katika tanbihi.
- source_word: יֶתֶר
  choice: Yetheri
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili huku sauti ya Kiebrania ikihifadhiwa.
- source_word: וּמֶרֶד
  choice: Meredi
  rationale: Jina la mtu limetoholewa kwa Kiswahili.
- source_word: וְעֵפֶר
  choice: Eferi
  rationale: Jina la mtu limetoholewa kwa Kiswahili; ע ya kwanza haijawakilishwa kwa konsonanti maalumu isiyo ya kawaida katika Kiswahili.
- source_word: וְיָלוֹן
  choice: Yaloni
  rationale: Jina la mtu limetoholewa kwa Kiswahili.
- source_word: וַתַּהַר
  choice: Naye akapata mimba ya
  rationale: Kitenzi הרה humaanisha ‘kupata mimba’ au ‘kuchukua mimba.’ Kiswahili kimehifadhi kiima cha kike kisichotajwa bila kuongeza jina la mwanamke; ‘ya’ linaunganisha kwa kawaida majina yanayofuata.
- source_word: מִרְיָם
  choice: Miriamu
  rationale: Jina limetoholewa kwa matumizi yaliyozoeleka katika Kiswahili cha Biblia, bila kuamua jinsia yake kutokana na matumizi yake mahali pengine.
- source_word: שַׁמַּי
  choice: Shamai
  rationale: Jina la mtu limetoholewa kwa Kiswahili.
- source_word: יִשְׁבָּח
  choice: Ishba
  rationale: Jina la mtu limetoholewa; konsonanti ya mwisho ח haijapewa sauti ya ziada isiyo ya lazima.
- source_word: אֲבִי אֶשְׁתְּמֹעַ
  choice: baba yake Eshtemoa
  rationale: Hii ni tafsiri ya moja kwa moja ya uhusiano wa ukoo. Neno אָב linaweza pia kumaanisha mwanzilishi wa ukoo au mahali, jambo lililohifadhiwa katika tanbihi.
theological_decisions:
- issue: Utambulisho wa mwanamke anayepata mimba
  choice: 'Kiima kimeachwa bila jina: ‘Naye akapata mimba’'
  alternative: Kumtaja mke fulani kutokana na muktadha wa aya zinazozunguka
  rationale: Kifungu hiki cha Kiebrania hakimtaji mwanamke huyo; kuongeza jina kungeondoa utata halisi wa matini.
- issue: Maana ya ‘baba’ katika nasaba
  choice: baba yake Eshtemoa
  alternative: mwanzilishi wa Eshtemoa
  rationale: Tafsiri rasmi inahifadhi maana ya msingi ya אָב, huku uwezekano wa kuwa mwanzilishi wa ukoo au makazi ukielezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Majina yametoholewa kwa muundo wa kawaida wa Kiswahili. Utata wa kiima cha kike na wa maana ya ‘baba’ umehifadhiwa badala ya kutatuliwa kimyakimya.
