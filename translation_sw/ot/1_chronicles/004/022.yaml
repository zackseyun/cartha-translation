base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/022.yaml
  text: and Jokim[a], and the men of Cozeba, and Joash, and Saraph, who ruled in Moab and returned to Lehem[c][b]. These records are ancient.
translation:
  language: sw
  text: na Yokimu, na watu wa Kozeba, na Yoashi na Sarafu, waliotawala Moabu[a], na Yashubi-Lehemu[b]. Mambo haya ni ya zamani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliimiliki Moabu,” “wakawa mabwana katika Moabu,” au labda “walioa wanawake wa Moabu.” Usemi wa Kiebrania ni mfupi na maana yake haina uhakika.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hakina uhakika; huenda ikawa, “na walirudi Lehemu,” badala ya jina Yashubi-Lehemu (au Yashubu-Lehemu). Wengine pia huhusisha mahali hapa na Bethlehemu.
    reason: alternative_reading
  - marker: c
    text: Au, “maneno haya ni ya kale,” “habari hizi ni za kale,” au “mambo haya ni ya nyakati za zamani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹקִים
  choice: Yokimu
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili, huku sauti kuu za Kiebrania zikihifadhiwa.
- source_word: אַנְשֵׁי כֹזֵבָא
  choice: watu wa Kozeba
  rationale: Ingawa אַנְשֵׁי kwa umbo ni ‘wanaume wa,’ katika orodha hii ya ukoo ‘watu wa’ ni Kiswahili cha kawaida na inaweza kumaanisha kundi linalohusishwa na mahali paitwapo Kozeba bila kuongeza dai lisilo la lazima kuhusu jinsia.
- source_word: יוֹאָשׁ
  choice: Yoashi
  rationale: Jina limetoholewa kwa umbo linaloeleweka na wasomaji wa Kiswahili.
- source_word: שָׂרָף
  choice: Sarafu
  rationale: Katika muktadha huu wa ukoo, neno linachukuliwa kuwa jina la mtu, si nomino ya kawaida yenye maana ya kitu kinachowaka.
- source_word: אֲשֶׁר בָּעֲלוּ לְמוֹאָב
  choice: ambao walitawala katika Moabu
  rationale: בעל hapa inaweza kueleza kuwa na mamlaka, kumiliki, au kuwa bwana. ‘Walitawala katika Moabu’ ni tafsiri ya asili inayofaa muktadha, huku maana nyingine zikihifadhiwa katika tanbihi.
- source_word: יָשֻׁבִי לָחֶם
  choice: Yashubi-Lehemu
  rationale: Usemi huu wa Kiebrania ni mgumu na unaweza kuwa jina ambatani. Maandishi makuu yanahifadhi umbo hilo kama jina badala ya kulazimisha uchanganuzi wa kitenzi usio na uhakika; uwezekano wa ‘walirudi Lehemu’ umetajwa katika tanbihi.
- source_word: הַדְּבָרִים עַתִּיקִים
  choice: Mambo haya ni ya zamani
  rationale: דברים inaweza kumaanisha maneno, mambo, au habari. ‘Mambo haya ni ya zamani’ hudumisha upana wa maana na ni ya kawaida kwa Kiswahili, bila kudai kwa uhakika kwamba yanarejelea kumbukumbu zilizoandikwa.
