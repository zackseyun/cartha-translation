  register: Kiswahili sanifu cha Afrika Mashariki, cha hadhi lakini kinachoeleweka kwa urahisi. Majina yametoholewa kwa mtindo wa Kiswahili. Kwa kuwa mstari wa Kiebrania una misemo miwili yenye utata mkubwa, tafsiri kuu haisuluhishi kwa lazima utata huo, na njia nyingine zimetolewa katika tanbihi.
