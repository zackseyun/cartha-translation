  yaml_path: translation/ot/1_chronicles/004/026.yaml
  text: 'The sons of Mishma: Hammuel his son, Zaccur his son, Shimei his son.'
translation:
  language: sw
  text: 'Wana wa Mishma: Hamueli mwanawe, Zakuri mwanawe, Shimei mwanawe.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Wana wa
  rationale: בְנֵי ni wingi wa hali ya kuambatana wa neno ‘wana’. Katika orodha hii ya ukoo, ‘Wana wa’ huhifadhi muundo wa Kiebrania kwa Kiswahili cha kawaida; kiunganishi וּ hakihitaji kutafsiriwa moja kwa moja mwanzoni mwa mstari.
- source_word: מִשְׁמָע
  choice: Mishma
  rationale: Ni jina la mtu; limeandikwa kwa namna inayokaribia matamshi ya Kiebrania na inayofaa tahajia ya Kiswahili.
- source_word: חַמּוּאֵל
  choice: Hamuel
  rationale: Ni jina la mtu; ‘Hamuel’ linafuata umbo la Kiebrania huku likiepuka konsonanti maradufu isiyo ya lazima katika tahajia ya Kiswahili.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Nomino ya umoja yenye kiambishi cha nafsi ya tatu kiume humaanisha ‘mwana wake’; ‘mwanawe’ ni usemi wa asili na mfupi katika Kiswahili na hapa unaonyesha mfuatano wa moja kwa moja wa baba na mwana.
- source_word: זַכּוּר
  choice: Zakuri
  rationale: Ni jina la mtu; ‘Zakuri’ linawakilisha Zakkur/Zaccur kwa tahajia na muundo wa silabi unaosomeka kwa urahisi katika Kiswahili.
- source_word: שִׁמְעִי
  choice: Shimei
  rationale: Ni jina la mtu; ‘Shimei’ huhifadhi umbo la jina la Kiebrania na pia ni tahajia inayotambulika katika mapokeo ya Biblia ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye heshima unaofaa orodha ya ukoo. Kitenzi ‘walikuwa’ kimeongezwa ili sentensi iwe ya asili kwa Kiswahili bila kubadili uhusiano wa majina katika maandishi ya Kiebrania.
