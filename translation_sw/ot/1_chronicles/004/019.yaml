base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/019.yaml
  text: And the sons of the wife of Hodiah[a], the sister of Naham[b], were the father of Keilah the Garmite and Eshtemoa the Maacathite.
translation:
  language: sw
  text: Na wana wa mke wa Hodia, dada ya Nahamu, walikuwa baba[a] wa Keila Mgerami na Eshtemoa Mmaakathi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika orodha za vizazi, neno la Kiebrania linalotafsiriwa “baba” linaweza kumaanisha baba wa moja kwa moja, babu, mwasisi, au mkuu wa ukoo au wa mahali fulani.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema “wana” kwa wingi lakini “baba” kwa umoja. Huenda taarifa hii imefupisha uhusiano wa ukoo badala ya kueleza tu mlolongo rahisi wa baba na mwana.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: Na wana wa
  rationale: Neno בנים kwa kawaida humaanisha wana, ingawa katika orodha za vizazi linaweza pia kuwahusu wazao. Tafsiri ya moja kwa moja imehifadhiwa.
- source_word: אֵשֶׁת הוֹדִיָּה
  choice: mke wa Hodia
  rationale: Muundo wa Kiebrania unaonyesha uhusiano wa ndoa; jina הוֹדִיָּה limetoholewa kuwa Hodia.
- source_word: אֲחוֹת נַחַם
  choice: dada ya Nahamu
  rationale: Neno אחות hapa linamtambulisha huyo mwanamke kuwa dada wa Nahamu. 'Dada' huondoa utata ambao neno pana 'ndugu' lingeweza kuleta.
- source_word: אֲבִי
  choice: baba wa
  rationale: אבי linaweza kumaanisha baba wa moja kwa moja, babu/mwasisi wa ukoo, au mkuu wa kundi. Neno 'baba' linahifadhi taswira na upana wa usemi wa chanzo, huku tanbihi ikieleza matumizi yake katika nasaba.
- source_word: קְעִילָה הַגַּרְמִי
  choice: Keila Mgarmi
  rationale: Keila limetoholewa kama jina; הַגַּרְמִי ni jina la utambulisho wa ukoo au kundi, limetafsiriwa kwa umbo la kawaida la Kiswahili 'Mgarmi' bila kulifafanua kupita ushahidi.
- source_word: וְאֶשְׁתְּמֹעַ הַמַּעֲכָתִי
  choice: na Eshtemoa Mmaaka
  rationale: Eshtemoa limetoholewa kama jina. הַמַּעֲכָתִי linaonyesha uhusiano na Maaka—wa ukoo, kundi, au mahali—na 'Mmaaka' huhifadhi utambulisho huo bila kuamua aina yake.
theological_decisions:
- issue: Uhusiano wa 'baba' katika nasaba
  choice: Kuhifadhi 'baba' na kueleza upana wake katika tanbihi
  alternative: mwasisi wa / babu wa / mkuu wa ukoo wa
  rationale: Chanzo hakiamui wazi kama מדובר baba wa moja kwa moja, babu, mwasisi, au mkuu wa ukoo. Kuchagua mojawapo kungefunga maana ambayo Kiebrania limeiacha wazi.
- issue: Kutopatana kwa 'wana' ya wingi na 'baba' ya umoja
  choice: Kuhifadhi mvutano huo katika maandishi na kuueleza katika tanbihi
  alternative: Kusawazisha kuwa 'mababa wa' au kufafanua mlolongo wa ukoo
  rationale: Kiebrania lenyewe lina kiima cha wingi 'wana' lakini baadaye lina umbo la umoja 'baba wa.' Kusawazisha kimya kimya kungeficha ufupisho au utata wa taarifa ya nasaba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi na wenye hadhi unaofaa orodha ya nasaba. Majina yametoholewa kwa maumbo rahisi kutamkika, na utata halisi wa sarufi na mahusiano ya ukoo umehifadhiwa badala ya kusawazishwa kimya kimya.
