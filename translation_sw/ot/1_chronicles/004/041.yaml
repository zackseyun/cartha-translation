  text: וַ/יָּבֹ֡אוּ אֵלֶּה֩ הַ/כְּתוּבִ֨ים בְּ/שֵׁמ֜וֹת בִּ/ימֵ֣י יְחִזְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֗ה וַ/יַּכּ֨וּ אֶת אָהֳלֵי/הֶ֜ם וְ/אֶת ה/מעינים אֲשֶׁ֤ר נִמְצְאוּ שָׁ֨מָּ/ה֙ וַ/יַּחֲרִימֻ/ם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יֵּשְׁב֖וּ תַּחְתֵּי/הֶ֑ם כִּֽי מִרְעֶ֥ה לְ/צֹאנָ֖/ם שָֽׁם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/041.yaml
  text: These[a], who were recorded by name, came in the days of Hezekiah king of Judah, and they struck down their tents and the Meunites who were found there, and devoted them to destruction to this day. Then they settled in their place, because there was pasture there for their flocks.
translation:
  language: sw
  text: Hawa walioorodheshwa kwa majina walikuja katika siku za Hezekia, mfalme wa Yuda. Wakayapiga mahema yao na Wameuni[a] waliokuwako huko, wakaviweka wakfu kwa maangamizi hadi leo. Kisha wakakaa mahali pao, kwa sababu huko kulikuwa na malisho kwa ajili ya mifugo yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania הַמְּעִינִים ni gumu. Kwa mapokeo hueleweka kuwa “Wameuni,” yaani kundi la watu; wengine hulielewa kuwa “makao” au “maskani.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּתוּבִים בְּשֵׁמוֹת
  choice: walioorodheshwa kwa majina
  rationale: Kirai hiki humaanisha watu walioingizwa katika orodha au nasaba; tafsiri hii ni ya asili katika Kiswahili na inadumisha maana ya kiutawala.
- source_word: וַיָּבֹאוּ
  choice: walikuja
  rationale: Kitenzi בוא kwa kawaida humaanisha kuja au kufika; 'walikuja' kinafaa katika mtiririko wa simulizi.
- source_word: וַיַּכּוּ
  choice: wakayapiga ... na ...
  rationale: נכה katika simulizi la kijeshi huonyesha shambulio lenye nguvu lililoleta kushindwa au kuuawa; 'kupiga' inadumisha ukali bila kubainisha kupita chanzo.
- source_word: אָהֳלֵיהֶם
  choice: mahema yao
  rationale: Neno la Kiebrania ni neno la kawaida kwa mahema na linaakisi mazingira ya watu walioishi maisha ya kuhamahama.
- source_word: המעינים
  choice: Wameuni
  rationale: Maandishi ya konsonanti yanaweza kueleweka kama jina la kabila, kwa mapokeo 'Wameuni,' jambo linalofaa katika muktadha wa watu waliopatikana huko. Ugumu na usomaji mbadala umehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר נִמְצְאוּ שָׁמָּה
  choice: waliopatikana huko
  rationale: Kwa kuwa 'Wameuni' limechaguliwa kama kundi la watu, kishazi hiki kimetafsiriwa kwa kurejelea watu.
- source_word: וַיַּחֲרִימֻם
  choice: wakawaangamiza kabisa
  rationale: Hifili ya חרם humaanisha kuwaweka chini ya heremu, yaani kuwatenga kwa maangamizi. Kiswahili hiki ni wazi na kinabeba matokeo ya uharibifu kamili, ingawa wazo la kiufundi la heremu halina kisawe kifupi cha kawaida.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hadi leo
  rationale: Hii ndiyo tafsiri ya kawaida na ya asili ya fomula ya wakati ya Kiebrania.
- source_word: וַיֵּשְׁבוּ תַּחְתֵּיהֶם
  choice: wakakaa mahali pao
  rationale: תחת pamoja na watu hapa humaanisha kuchukua mahali pao; tafsiri hii inaeleza makazi ya kuchukua nafasi kwa Kiswahili cha sasa.
- source_word: מִרְעֶה לְצֹאנָם
  choice: malisho kwa ajili ya mifugo yao
  rationale: מִרְעֶה ni eneo la malisho, na צֹאן linaweza kujumuisha kondoo na mbuzi; 'mifugo' huepuka kulibana kwa kondoo pekee.
theological_decisions:
- issue: Maana ya kiufundi ya וַיַּחֲרִימֻם (heremu)
  choice: wakawaangamiza kabisa
  alternative: wakawaweka wakfu kwa maangamizi
  rationale: Chaguo la kwanza ni la kawaida na lenye kueleweka zaidi kwa wasomaji wa Kiswahili, huku likidumisha ukali wa kitendo. Haliongezi maelezo ya kimadhehebu kuhusu sababu au tabia ya heremu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umetiririshwa kwa vitenzi vya mfululizo, huku utata halisi wa הַמְּעִינִים ukihifadhiwa katika tanbihi.
