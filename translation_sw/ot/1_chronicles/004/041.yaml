  source_fidelity: 'Rasimu inafuata vizuri muundo na maana ya Kiebrania: watu waliotajwa kwa majina, ujio wakati wa Hezekia, mahema pamoja na Wameuni, makazi ya kuchukua nafasi yao, na malisho ya mifugo. Hata hivyo, kiwakilishi katika “wakawaangamiza” ni cha ngeli ya watu na hivyo kwa kawaida huwarejelea Wameuni pekee, ilhali kiambishi cha Kiebrania katika וַיַּחֲרִימֻם hurejelea kundi lililotajwa—mahema na Wameuni. Pia “kabisa” pekee haionyeshi kikamilifu dhana ya ḥerem ya kuwekwa wakfu kwa maangamizi.'
