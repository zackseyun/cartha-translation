base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/032.yaml
  text: And their settlements were Etam[a], Ain, Rimmon, Tochen, and Ashan—five cities.
translation:
  language: sw
  text: Na makazi yao yalikuwa Etamu[a], Aini, Rimoni, Tokeni na Ashani—miji mitano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vijiji vyao.” Neno la Kiebrania linaweza kumaanisha makazi madogo au maeneo yaliyozungushiwa uzio.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: makazi yao
  rationale: חָצֵר inaweza kumaanisha kijiji, makazi madogo, au eneo lililozungushiwa uzio. Katika orodha hii ya mahali, “makazi” ni neno la kawaida lenye upana unaohifadhi maana bila kubainisha ukubwa wake.
- source_word: עֵיטָם
  choice: Etamu
  rationale: Jina la mahali; limeandikwa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: עַיִן
  choice: Aini
  rationale: Hapa ni jina la mahali katika orodha ya miji, si nomino ya kawaida yenye maana ya “jicho” au “chemchemi.”
- source_word: רִמּוֹן
  choice: Rimoni
  rationale: Jina la mahali; maana yake ya kawaida, “komamanga,” haitumiki hapa.
- source_word: תֹכֶן
  choice: Tokeni
  rationale: Jina la mahali lililonukuliwa kutoka umbo la Kiebrania תֹכֶן na kurekebishwa kwa matamshi ya Kiswahili.
- source_word: עָשָׁן
  choice: Ashani
  rationale: Jina la mahali; limenukuliwa kwa namna inayosomeka katika Kiswahili.
- source_word: עָרִים חָמֵשׁ
  choice: miji mitano
  rationale: עִיר humaanisha mji; “miji mitano” huhifadhi hesabu na maana ya muhtasari wa orodha.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina ya mahali yameongezewa irabu za mwisho ili yasomeke kwa kawaida katika Kiswahili; sentensi imehifadhi muundo wa orodha na muhtasari wa “miji mitano.”
