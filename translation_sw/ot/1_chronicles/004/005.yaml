  text: וּ/לְ/אַשְׁחוּר֙ אֲבִ֣י תְק֔וֹעַ הָי֖וּ שְׁתֵּ֣י נָשִׁ֑ים חֶלְאָ֖ה וְ/נַעֲרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/005.yaml
  text: 'Ashhur the father of Tekoa had two wives: Helah and Naarah[a].'
translation:
  language: sw
  text: 'Ashuri, baba wa Tekoa,[a] alikuwa na wake wawili: Hela na Naara.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwanzilishi wa Tekoa” au “babu wa ukoo wa Tekoa”; katika nasaba, “baba wa” anaweza kumaanisha mwanzilishi wa ukoo au wa makazi, si lazima baba mzazi wa moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַשְׁחוּר
  choice: Ashuri
  rationale: Kiunganishi na kihusishi vinatanguliza taarifa nyingine katika nasaba; Kiswahili cha kawaida hakihitaji tafsiri ngumu kama ‘na kwa Ashuri.’ Jina limetoholewa kwa namna ya kawaida ya Kiswahili.
- source_word: אֲבִי תְקוֹעַ
  choice: baba wa Tekoa
  rationale: Hii ndiyo tafsiri ya moja kwa moja na inahifadhi upana wa neno אָב, ambalo katika nasaba linaweza kumaanisha baba, babu wa ukoo, au mwanzilishi wa mahali.
- source_word: הָיוּ
  choice: alikuwa na
  rationale: Ingawa Kiebrania hutumia kitenzi ‘walikuwako/walikuwa,’ Kiswahili huonyesha umilikaji kwa kawaida kwa kusema ‘alikuwa na.’
- source_word: שְׁתֵּי נָשִׁים
  choice: wake wawili
  rationale: Katika taarifa hii ya kinasaba, נָשִׁים humaanisha wake, si wanawake kwa ujumla.
- source_word: חֶלְאָה
  choice: Hela
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku ikifuata umbo la Kiebrania.
- source_word: וְנַעֲרָה
  choice: na Naara
  rationale: Kiunganishi kimehifadhiwa katika orodha ya majina, na jina limetoholewa kwa tahajia ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kawaida lakini wenye heshima. Muundo ‘alikuwa na wake wawili’ ni wa asili katika Kiswahili; tanbihi inadumisha utata halisi wa neno la Kiebrania אָב.
