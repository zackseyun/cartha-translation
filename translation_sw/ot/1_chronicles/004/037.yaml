base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/037.yaml
  text: and Ziza son of Shiphi[a], son of Allon, son of Jedaiah, son of Shimri, son of Shemaiah.
translation:
  language: sw
  text: na Ziza mwana wa Shifi, mwana wa Aloni, mwana wa Yedaya, mwana wa Shimri, mwana wa Shemaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/זִיזָא
  choice: na Ziza
  rationale: Kiunganishi וְ kimetafsiriwa “na” ili kuendeleza orodha ya nasaba. Jina זִיזָא limetoholewa kama “Ziza,” kwa kuzingatia matamshi ya Kiebrania na umbo linalosomeka kwa urahisi katika Kiswahili.
- source_word: בֶן
  choice: mwana wa
  rationale: Katika mfuatano huu wa nasaba, בֶן humaanisha “mwana wa.” Kurudiwa kwake kumehifadhiwa ili kuonyesha wazi muundo wa Kiebrania.
- source_word: שִׁפְעִי
  choice: Shifi
  rationale: Jina limetoholewa kwa Kiswahili; “sh” huwakilisha shin, na “f” hufuata matamshi ya pe yenye dageshi hafifu isiyosisitizwa katika mapokeo ya Kimasora.
- source_word: אַלּוֹן
  choice: Aloni
  rationale: Hili ni jina la mtu, si nomino ya kawaida yenye maana ya mti wa mwaloni. Irabu ya mwisho imeongezwa kwa upole ili jina lisomeke kwa kawaida katika Kiswahili.
- source_word: יְדָיָה
  choice: Yedaya
  rationale: 'Jina limetoholewa kwa kufuata sauti za Kiebrania na kaida za Kiswahili: yod ya mwanzo ni “Y,” na sehemu ya mwisho ya jina imewakilishwa kama “-aya.”'
- source_word: שִׁמְרִי
  choice: Shimri
  rationale: “Sh” huhifadhi tofauti ya shin ya Kiebrania, huku umbo “Shimri” likifuata kwa karibu konsonanti na irabu za jina.
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Jina limetoholewa kwa umbo linalokaribia Kiebrania na linaloweza kusomeka kwa urahisi katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Lugha ni ya kawaida, yenye heshima, na inafaa kwa orodha ya nasaba. Majina yametoholewa kwa kaida zinazosomeka katika Kiswahili bila kutafsiri maana zake; urudiaji wa “mwana wa” umehifadhi muundo na uwazi wa chanzo.
