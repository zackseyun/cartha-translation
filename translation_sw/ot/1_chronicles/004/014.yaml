base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/014.yaml
  text: Meonothai fathered Ophrah[a], and Seraiah fathered Joab, the father of Ge-harashim[b], for they were craftsmen.
translation:
  language: sw
  text: Meonothai akamzaa Ofra, na Seraya akamzaa Yoabu, baba wa[a] Ge-Harashimu[b], kwa maana walikuwa mafundi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwanzilishi wa.” Katika taarifa za nasaba, “baba wa” linaweza kumaanisha mwanzilishi au mkuu wa ukoo.
    reason: alternative_reading
  - marker: b
    text: Ge-Harashimu huenda linamaanisha “Bonde la Mafundi.” Kiebrania hulitumia kama jina la mahali, kisha kishazi hiki kinaeleza jina hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעוֹנֹתַי
  choice: Meonothai
  rationale: Jina la mtu limenukuliwa kwa herufi za Kiswahili bila kutafsiriwa.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, Hiphil ya ילד huonyesha kumzaa au kuwa baba wa mtu; “akamzaa” ni ya kawaida na wazi katika Kiswahili.
- source_word: עָפְרָה
  choice: Ofra
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Jina limetoholewa kwa namna inayolingana na matamshi ya Kiebrania na matumizi ya Kiswahili.
- source_word: יוֹאָב
  choice: Yoabu
  rationale: Tahajia ya jina inayotambulika katika mapokeo ya Biblia ya Kiswahili.
- source_word: אֲבִי
  choice: baba wa
  rationale: Huhifadhi usemi halisi wa Kiebrania, huku tanbihi ikionyesha maana inayowezekana ya mwanzilishi au mkuu wa ukoo.
- source_word: גֵּיא חֲרָשִׁים
  choice: Ge-Harashimu
  rationale: Muundo umetunzwa kama jina la mahali; maana yake inaelezwa katika tanbihi na katika kishazi kinachofuata.
- source_word: כִּי
  choice: kwa maana
  rationale: 'Huonyesha uhusiano wa maelezo: kishazi kinachofuata kinafafanua jina la mahali.'
- source_word: חֲרָשִׁים
  choice: mafundi
  rationale: Neno lina maana pana ya wafanyakazi wenye ustadi, bila kulibana kwa wahunzi pekee.
- source_word: הָיוּ
  choice: walikuwa
  rationale: Kitenzi cha hali kinarejelea watu waliohusishwa na mahali hapo.
theological_decisions:
- issue: Maana ya “baba wa” katika taarifa ya nasaba
  choice: Kudumisha “baba wa” katika matini
  alternative: “mwanzilishi wa” au “mkuu wa ukoo wa”
  rationale: Kiebrania kinaweza kumaanisha ubaba wa moja kwa moja, mwanzilishi, au mkuu wa ukoo; matini haipaswi kuondoa utata huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. Majina yametoholewa kwa mfumo unaosomeka kwa Kiswahili; usemi wa nasaba umetolewa kwa mtiririko wa kawaida.
