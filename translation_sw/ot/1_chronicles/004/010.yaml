source:
  edition: WLC
  text: וַ/יִּקְרָ֣א יַ֠עְבֵּץ לֵ/אלֹהֵ֨י יִשְׂרָאֵ֜ל לֵ/אמֹ֗ר אִם בָּרֵ֨ךְ תְּבָרֲכֵ֜/נִי וְ/הִרְבִּ֤יתָ אֶת גְּבוּלִ/י֙ וְ/הָיְתָ֤ה יָדְ/ךָ֙ עִמִּ֔/י וְ/עָשִׂ֥יתָ מֵּ/רָעָ֖ה לְ/בִלְתִּ֣י עָצְבִּ֑/י וַ/יָּבֵ֥א אֱלֹהִ֖ים אֵ֥ת אֲשֶׁר שָׁאָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/010.yaml
  text: And Jabez called on the God of Israel[a], saying, “If you would indeed bless me and enlarge my territory, and let your hand be with me[b], and keep me from harm so that I may not suffer pain!” And God granted what he asked.
translation:
  language: sw
  text: Yabezi akamwomba Mungu wa Israeli akisema, “Laiti ungenibariki kweli, ukapanua eneo langu, mkono wako ukawa pamoja nami, na uniepushe na mabaya[a], ili nisipate maumivu!”[b] Mungu akampa alichoomba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na uniepushe na uovu.” Neno la Kiebrania רָעָה linaweza kumaanisha uovu wa kimaadili au janga lenye kudhuru; hapa muktadha unaelekea kwenye madhara.
    reason: lexical_alternative
  - marker: b
    text: Maneno “nisipate maumivu” yanarejelea maelezo ya jina la Yabezi katika mstari uliotangulia; jina lake linahusishwa huko na maumivu.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamwomba
  rationale: Katika muktadha wa sala, kitenzi hiki kina maana ya kumwita Mungu kwa kumwomba msaada; “akamwomba” ni Kiswahili cha kawaida na wazi.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni uundaji wa kawaida wa umilikaji unaomtambulisha Mungu ambaye Israeli anamwabudu.
- source_word: אִם בָּרֵךְ תְּבָרֲכֵנִי
  choice: Laiti ungenibariki kweli
  rationale: אִם hapa huanzisha ombi la dhati, nalo muundo wa infinitivu pamoja na kitenzi chenye nafsi unasisitiza tendo la kubariki. “Laiti ... kweli” huwasilisha ombi na msisitizo kwa Kiswahili cha asili.
- source_word: וְהִרְבִּיתָ אֶת גְּבוּלִי
  choice: ukapanua eneo langu
  rationale: גְּבוּל inaweza kumaanisha mpaka au eneo lililo ndani ya mpaka. Katika ombi hili, “eneo langu” linaeleza kwa kawaida upanuzi wa ardhi bila kuufanya kuwa sitiari ya ushawishi.
- source_word: וְהָיְתָה יָדְךָ עִמִּי
  choice: mkono wako ukawa pamoja nami
  rationale: Nahau ya Kiebrania kuhusu mkono wa Mungu inadumishwa kwa sababu inaeleweka kama nguvu na msaada wake, bila kuifafanua kupita kiasi ndani ya matini.
- source_word: וְעָשִׂיתָ מֵּרָעָה
  choice: na kuniepusha na madhara
  rationale: Kauli ya Kiebrania ni fupi na inaweza kuhusisha uovu au janga lenye kudhuru. Muktadha wa maumivu unaunga mkono “madhara,” huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: לְבִלְתִּי עָצְבִּי
  choice: ili nisipate maumivu
  rationale: Kauli hii inaeleza kusudi la kutopata uchungu au huzuni na inarejelea kimawazo maelezo ya jina la Yabezi katika mstari uliotangulia.
- source_word: וַיָּבֵא אֱלֹהִים אֵת אֲשֶׁר שָׁאָל
  choice: Mungu akampa alichoomba
  rationale: Nahau ya kuleta kile kilichoombwa humaanisha kutimiza au kukubali ombi. “Akampa alichoomba” ni ya kawaida na hudumisha maana hiyo.
theological_decisions:
- issue: Maana ya kupanuliwa kwa גְּבוּל
  choice: Imetafsiriwa kwa maana ya kawaida ya eneo la ardhi.
  alternative: “upanue mipaka ya ushawishi wangu”
  rationale: Maana ya msingi hapa ni mpaka au eneo. Tafsiri haiongezi wazo la kisasa la mafanikio wala kugeuza eneo hilo kuwa sitiari bila ushahidi wa matini.
- issue: Maana ya רָעָה katika sala
  choice: “madhara” katika matini kuu
  alternative: “uovu”
  rationale: Neno linaweza kumaanisha uovu wa kimaadili au janga lenye kudhuru. Uhusiano wake na maumivu unaelekeza kwenye madhara, lakini tanbihi inahifadhi uwezekano wa “uovu.”
- issue: Mwelekeo wa לְבִלְתִּי עָצְבִּי
  choice: “ili nisipate maumivu”
  alternative: “ili yasiniletee huzuni” au “ili nisije nikasababisha maumivu”
  rationale: Muktadha na mchezo wa maana wa jina la Yabezi unaunga mkono kupata maumivu, lakini muundo wa Kiebrania ni mfupi na unaweza kuelezwa kwa namna tofauti; tanbihi inaonyesha mwangwi huo bila kuingiza fundisho la ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa “Laiti ungenibariki kweli” una sauti ya ombi la dhati; nahau “mkono wako” imehifadhiwa kwa kuwa ni picha muhimu ya matini ya Kiebrania. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
