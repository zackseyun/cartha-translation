  text: Chelub[a], the brother of Shuhah, fathered Mehir; he was the father of Eshton.
translation:
  language: sw
  text: Kelubu, ndugu wa kiume wa Shuha, alimzaa Mehiri; naye alikuwa baba wa Eshtoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “babu wa ukoo au mwanzilishi wa Eshtoni.” Katika orodha za nasaba, “baba wa” wakati mwingine humaanisha babu wa ukoo au mwanzilishi wa ukoo au makazi, wala si lazima baba aliyemzaa moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/כְל֥וּב
  choice: Kelubu
  rationale: Jina limetoholewa kwa kufuata matamshi ya Kiebrania na muundo wa kawaida wa majina katika Kiswahili. Kiunganishi וּ kimewakilishwa kwa mtiririko wa simulizi kupitia kitenzi ‘akamzaa’.
- source_word: אֲחִֽי שׁוּחָ֖ה
  choice: ndugu yake Shuha
  rationale: Neno אח hapa linaonyesha uhusiano wa kindugu; ‘ndugu yake’ ni Kiswahili cha kawaida na wazi, huku muktadha wa nasaba ukielekeza kwa ndugu wa kiume.
- source_word: הוֹלִ֣יד
  choice: akamzaa
  rationale: Katika orodha za nasaba, Hiphil ya ילד hueleza kuzaa au kuwa mzazi wa mtu. ‘Akamzaa’ ni usemi mfupi, wa asili, na unaofaa muktadha wa nasaba.
- source_word: מְחִ֑יר
  choice: Mehiri
  rationale: Jina limetoholewa badala ya kutafsiriwa, kwa muundo unaosomeka kwa urahisi katika Kiswahili.
- source_word: ה֖וּא
  choice: naye
  rationale: Kiwakilishi huru kinamrejelea Mehiri kama mhusika wa kishazi kinachofuata; ‘naye’ huhifadhi urejeo huo kwa mtiririko wa kawaida wa Kiswahili.
- source_word: אֲבִ֥י
  choice: baba yake
  rationale: Hii ndiyo maana ya msingi ya אב, lakini katika nasaba inaweza pia kumaanisha babu, babu wa ukoo, au mwanzilishi; upana huo umeelezwa katika tanbihi.
- source_word: אֶשְׁתּֽוֹן
  choice: Eshtoni
  rationale: Jina limetoholewa kwa kufuata umbo la Kiebrania na mtindo wa majina ya kibiblia katika Kiswahili.
