lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Na wana
  rationale: Kiunganishi וּ kimetafsiriwa kwa “Na” ili kuendeleza orodha, na בְנֵי kwa “wana,” kama ilivyo kawaida katika taarifa za nasaba; neno hilo linaweza pia kuwahusu wazao wa ukoo kwa maana pana.
- source_word: חֶלְאָה
  choice: Hela
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili, huku sauti zake kuu za Kiebrania zikihifadhiwa.
- source_word: צֶרֶת
  choice: Serethi
  rationale: Jina limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili; צ imewakilishwa kwa “S,” na ת ya mwisho kwa “thi.”
- source_word: יצחר
  choice: Yitshari
  rationale: Tahajia hii inafuata kwa karibu konsonanti za jina la Kiebrania, ikihifadhi yod ya mwanzo na sauti ya tsade, huku irabu ya mwisho ikiongezwa ili jina litamkike kwa kawaida katika Kiswahili.
- source_word: וְ/אֶתְנָן
  choice: na Ethnani
  rationale: Kiunganishi וְ kimetafsiriwa kwa “na,” na jina limetoholewa kwa namna inayofaa matamshi ya Kiswahili.
