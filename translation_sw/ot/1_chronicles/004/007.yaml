  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili linaweza pia kuandikwa “Hele,” kutegemea utaratibu wa kunukuu vokali za Kiebrania.
    reason: lexical_alternative
  - marker: b
    text: Katika orodha za nasaba za Kiebrania, “wana” linaweza kumaanisha wana wa moja kwa moja au, kwa maana pana zaidi, wazao wa ukoo.
