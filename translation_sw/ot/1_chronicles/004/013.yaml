  yaml_path: translation/ot/1_chronicles/004/013.yaml
  text: 'The sons of Kenaz: Othniel and Seraiah[a]. And the sons of Othniel: Hathath.'
translation:
  language: sw
  text: 'Wana wa Kenazi: Othnieli na Seraia. Wana wa Othnieli: Hathathi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְנַז
  choice: Wana wa Kenazi
  rationale: Muundo wa nasaba בְּנֵי + jina una maana ya “wana wa”; kiunganishi cha mwanzo hakihitaji kutafsiriwa kwa “na” kwa kuwa mstari unaanzisha orodha mpya ya nasaba.
- source_word: עָתְנִיאֵל
  choice: Othnieli
  rationale: Jina la mtu limetoholewa kwa tahajia inayotambulika katika Kiswahili.
- source_word: וּשְׂרָיָה
  choice: na Seraya
  rationale: Kiunganishi וּ kimetafsiriwa “na”; jina limetoholewa kwa kufuata matamshi ya Kiebrania.
- source_word: וּבְנֵי עָתְנִיאֵל
  choice: Wana wa Othnieli
  rationale: Kauli ileile ya nasaba imetafsiriwa kwa uwazi; sentensi mpya ya Kiswahili inafanya uhusiano wa kizazi kinachofuata kuwa wa kawaida bila kulazimisha “na” ya mwanzo.
- source_word: חֲתַת
  choice: Hathathi
  rationale: Jina la mtu limetoholewa kwa karibu na umbo la Kiebrania huku likipewa mwisho unaosomeka kwa kawaida katika Kiswahili.
