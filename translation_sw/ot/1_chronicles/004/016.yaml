lexical_decisions:
- source_word: וּבְנֵי
  choice: Nao wana wa
  rationale: Nomino ya wingi katika hali ya kuambatanisha ina maana ya “wana wa” na huanzisha orodha ya ukoo; kiunganishi cha mwanzo kimetafsiriwa “Nao” ili kuhifadhi uhusiano na muktadha uliotangulia.
- source_word: יְהַלֶּלְאֵל
  choice: Yehaleli
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likifuata konsonanti za Kiebrania.
- source_word: זִיף
  choice: Zifu
  rationale: Jina la mtu limetoholewa kwa kuongezwa irabu ya mwisho ili kupatana na matamshi ya kawaida ya Kiswahili.
- source_word: וְזִיפָה
  choice: Zifa
  rationale: Jina la mtu limetoholewa moja kwa moja kulingana na umbo la Kiebrania; kiunganishi hakijarudiwa kwa kuwa orodha ya Kiswahili hulitumia kwa kawaida kabla ya jina la mwisho.
- source_word: תִּירְיָא
  choice: Tiria
  rationale: Jina la mtu limetoholewa kwa karibu na vokali na konsonanti za maandishi ya Kimasoreti.
- source_word: וַאֲשַׂרְאֵל
  choice: na Asareli
  rationale: Jina la mtu limetoholewa kutoka umbo la Kimasoreti, na kiunganishi kimetafsiriwa “na” kabla ya jina la mwisho katika orodha.
