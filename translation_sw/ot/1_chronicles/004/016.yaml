  text: 'And the sons of Jehallelel: Ziph[a], Ziphah, Tiria, and Asarel.'
translation:
  language: sw
  text: 'Nao wana wa Yehaleli: Zifu, Zifa, Tiria na Asareli[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Asareli pia huandikwa “Asareeli” katika baadhi ya tahajia za uhamishaji wa jina hili.
