base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/031.yaml
  text: and in Beth-marcaboth[a], and in Hazar-susim, and in Beth-biri, and in Shaaraim[d][c][b]. These were their cities until David reigned.
translation:
  language: sw
  text: na Beth-Markabothi[a], na Hasar-Susimu[b], na Beth-Biri[c], na Shaaraimu[d]. Miji hii ilikuwa yao mpaka Daudi alipotawala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beth-Markabothi linaweza kutafsiriwa kihalisi zaidi kuwa “Nyumba ya Magari ya Vita,” lakini hapa limetumiwa kama jina la mahali.
    reason: lexical_alternative
  - marker: b
    text: Hasar-Susimu linaweza kutafsiriwa kihalisi zaidi kuwa “Ua wa Farasi” au “Kijiji cha Farasi,” lakini hapa limetumiwa kama jina la mahali.
    reason: lexical_alternative
  - marker: c
    text: Beth-Biri pia linaweza kutoholewa kuwa “Beth-Birei.”
    reason: alternative_reading
  - marker: d
    text: Shaaraimu huenda lina maana ya kietimolojia kama “Malango Mawili,” lakini hapa limetumiwa kama jina la mahali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/בֵית מַרְכָּבוֹת
  choice: na huko Beth-Markabothi
  rationale: Ni jina la mahali katika orodha ya makazi, hivyo limetoholewa kwa tahajia inayosomeka kwa Kiswahili badala ya kutafsiriwa kama “Nyumba ya Magari ya Vita.”
- source_word: וּ/בַ/חֲצַר סוּסִים
  choice: Hasar-Susimu
  rationale: Muktadha unaonyesha jina la mahali; limetoholewa badala ya kutafsiriwa kwa maana ya vipashio vyake.
- source_word: וּ/בְ/בֵית בִּרְאִי
  choice: Beth-Biri
  rationale: Limechukuliwa kuwa jina la mahali sambamba na majina yanayolizunguka; tahajia mbadala imewekwa katika tanbihi.
- source_word: וּֽ/בְ/שַׁעֲרָיִם
  choice: Shaaraimu
  rationale: Ni jina la makazi, kwa hiyo limetoholewa; maana inayowezekana ya kietimolojia haijaingizwa katika matini kuu.
- source_word: אֵלֶּה עָרֵיהֶם
  choice: Hiyo ilikuwa miji yao
  rationale: Kiwakilishi cha umoja “hiyo” kinarejelea kwa kawaida orodha nzima iliyotangulia, huku “miji” ikitoa maana ya moja kwa moja ya עָרִים katika muktadha huu.
- source_word: עַד מְלֹךְ דָּוִיד
  choice: mpaka Daudi alipotawala
  rationale: Tafsiri hii inahifadhi kikomo cha wakati na nguvu ya kitenzi bila kufafanua zaidi kama ni mwanzo au kipindi chote cha utawala.
