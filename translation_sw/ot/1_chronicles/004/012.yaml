  text: וְ/אֶשְׁתּ֗וֹן הוֹלִ֞יד אֶת בֵּ֤ית רָפָא֙ וְ/אֶת פָּסֵ֔חַ וְ/אֶת תְּחִנָּ֖ה אֲבִ֣י עִ֣יר נָחָ֑שׁ אֵ֖לֶּה אַנְשֵׁ֥י רֵכָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/012.yaml
  text: Eshton fathered Beth-rapha[a], Paseah, and Tehinnah, the father of Ir-nahash[b]. These were the men of Rekah.
translation:
  language: sw
  text: Eshtoni akamzaa Beth-rafa, Pasea na Tehina, baba[a] wa Ir-nahashi[b]. Hao ndio watu wa Reka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanzilishi wa.” Katika nasaba, “baba wa” anaweza kuwa babu wa ukoo au mwanzilishi, si lazima baba mzazi wa moja kwa moja.
    reason: lexical_alternative
  - marker: b
    text: Ir-nahashi huenda likamaanisha “mji wa Nahashi,” lakini hapa inaelekea kuwa jina la mahali.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, kausativi ya ילד humaanisha kumzaa au kuwa baba wa mtu. ‘Akamzaa’ ni Kiswahili cha kawaida na chenye hadhi kinachohifadhi maana ya kinasaba.
- source_word: בֵּית רָפָא
  choice: Beth-rafa
  rationale: Muundo huu umetumiwa kama jina maalumu katika orodha ya nasaba, si kutafsiriwa moja kwa moja kuwa ‘nyumba ya Rafa.’
- source_word: פָּסֵחַ
  choice: Pasea
  rationale: Ni jina maalumu; limetoholewa kwa namna inayosomeka kwa urahisi katika Kiswahili.
- source_word: תְּחִנָּה
  choice: Tehina
  rationale: Ni jina maalumu hapa, hivyo limetoholewa badala ya kutafsiriwa kwa maana yake ya kawaida ya ‘dua’ au ‘kusihi.’
- source_word: אֲבִי עִיר נָחָשׁ
  choice: baba wa Ir-nahashi
  rationale: '‘Baba wa’ huhifadhi nahau ya Kiebrania na utata wake halisi: inaweza kumaanisha baba wa moja kwa moja, babu wa ukoo, au mwanzilishi wa mahali. Ir-nahashi limetendewa kama jina la mahali.'
- source_word: אֵלֶּה אַנְשֵׁי רֵכָה
  choice: Hao ndio watu wa Reka
  rationale: ‘Watu wa Reka’ ni Kiswahili cha asili kinachoweza kumaanisha watu wa ukoo au eneo hilo bila kulazimisha mojawapo.
- source_word: רֵכָה
  choice: Reka
  rationale: Ni jina maalumu, huenda la mahali au ukoo, na limetoholewa.
theological_decisions:
- issue: Maana ya ‘baba wa’ katika taarifa ya nasaba
  choice: Kuhifadhi ‘baba wa’ katika maandishi na kueleza upana wake katika tanbihi
  alternative: Kutafsiri moja kwa moja ‘mwanzilishi wa Ir-nahashi’
  rationale: Kiebrania אֲבִי kinaweza kuonyesha uzazi wa moja kwa moja, asili ya ukoo, au uanzilishi wa makao. Maandishi hayatoshi kuamua maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kisasa, wa kawaida na wenye hadhi. Majina yametoholewa kwa urahisi wa matamshi ya Kiswahili, huku utata wa taarifa ya nasaba ukihifadhiwa kwa tanbihi.
