  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/לְ/שִׁמְעִ֞י בָּנִ֨ים שִׁשָּׁ֤ה עָשָׂר֙ וּ/בָנ֣וֹת שֵׁ֔שׁ וּ/לְ/אֶחָ֕י/ו אֵ֖ין בָּנִ֣ים רַבִּ֑ים וְ/כֹל֙ מִשְׁפַּחְתָּ֔/ם לֹ֥א הִרְבּ֖וּ עַד בְּנֵ֥י יְהוּדָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/027.yaml
  text: Shimei had sixteen sons and six daughters[a], but his brothers did not have many sons, and all their clans did not multiply as much as the sons of Judah.
translation:
  language: sw
  text: Shimei alikuwa na wana kumi na sita na mabinti sita, lakini ndugu zake hawakuwa na wana wengi, na koo zao zote hazikuongezeka kufikia idadi ya wazao wa Yuda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hazikuwa nyingi kama wazao wa Yuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשִׁמְעִי
  choice: Shimei alikuwa na
  rationale: Muundo wa kihusishi ל katika orodha ya nasaba unaonyesha umilikaji au kuwapo; Kiswahili cha kawaida husema ‘alikuwa na.’
- source_word: בָּנִים שִׁשָּׁה עָשָׂר
  choice: wana kumi na sita
  rationale: Inahifadhi idadi na kurekebisha mpangilio kwa Kiswahili cha kawaida.
- source_word: וּבָנוֹת שֵׁשׁ
  choice: na mabinti sita
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya jinsia na idadi iliyotajwa.
- source_word: וּלְאֶחָיו אֵין בָּנִים רַבִּים
  choice: lakini ndugu zake hawakuwa na wana wengi
  rationale: Ingawa ו ni ‘na,’ hapa inaonyesha ulinganisho wenye tofauti; ‘lakini’ huonyesha uhusiano huo kwa uwazi bila kubadili maana.
- source_word: וְכֹל מִשְׁפַּחְתָּם
  choice: na koo zao zote
  rationale: Katika muktadha wa nasaba, מִשְׁפָּחָה humaanisha makundi mapana ya ukoo kuliko familia ndogo ya nyumbani.
- source_word: לֹא הִרְבּוּ
  choice: hazikuongezeka
  rationale: Hiphil ya רבה hapa ina maana ya kuongezeka kwa idadi; kitenzi hiki ni cha kawaida na kinabaki karibu na maana ya chanzo.
- source_word: עַד בְּנֵי יְהוּדָה
  choice: kufikia idadi ya wazao wa Yuda
  rationale: עַד inaonyesha kiwango kilichofikiwa, na בְּנֵי katika muktadha huu inawahusu wazao wa Yuda, si lazima wana wake wa moja kwa moja.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Koo’ linafaa kwa muktadha wa nasaba, na ‘wazao wa Yuda’ huzuia dhana isiyo sahihi kwamba ni wana wa moja kwa moja tu. Alama ya tanbihi imewekwa mwishoni mwa kishazi kinachohusika.
