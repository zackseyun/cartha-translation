base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/006.yaml
  text: Naarah bore to him Ahuzzam[a], Hepher, Temeni, and Haahashtari[b]. These were the sons of Naarah.
translation:
  language: sw
  text: Naara akamzalia Ahuzamu, Heferi, Temeni[a], na Haahashtari[b]. Hao ndio wana wa Naara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Temeni pia linaweza kueleweka kama jina lenye matumizi ya kivumishi, kama vile “Mtemeni” au “mwenyeji wa kusini”; lakini katika nasaba hii limetoholewa kama jina la mtu.
    reason: lexical_alternative
  - marker: b
    text: Haahashtari pia linaweza kutoholewa “Ahashtari.” Umbo la Kiebrania lina kibainishi cha awali ambacho huenda kilikuwa sehemu thabiti ya jina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: akamzalia
  rationale: Kitenzi hiki katika taarifa ya nasaba kinaonyesha kuwa Naara ndiye aliyezaa; umbo la Kiswahili “akamzalia” pia linawakilisha לוֹ, yaani alimzalia mwanamume aliyetajwa katika muktadha.
- source_word: לוֹ
  choice: -m- katika “akamzalia”
  rationale: Kiambishi cha yambwa katika kitenzi kinawasilisha kwa kawaida maana ya “alimzalia yeye” bila kulazimisha kutaja upya jina la baba.
- source_word: נַעֲרָה
  choice: Naara
  rationale: Ni jina la mtu; limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili na limetumiwa vivyo hivyo mara zote mbili.
- source_word: אֲחֻזָּם
  choice: Ahuzamu
  rationale: Jina limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili, huku konsonanti na vokali za msingi za Kiebrania zikihifadhiwa.
- source_word: חֵפֶר
  choice: Heferi
  rationale: Ni jina la mtu lililotoholewa kwa namna ya kawaida na inayotamkika kwa wasomaji wa Kiswahili.
- source_word: תֵּימְנִי
  choice: Temeni
  rationale: Ingawa umbo hili linaweza kuwa na nguvu ya kivumishi, katika orodha hii ya nasaba linafanya kazi kama jina la mtu; kulitohoa huhifadhi uwezekano huo bila kulifasiri kupita kiasi.
- source_word: הָאֲחַשְׁתָּרִי
  choice: Haahashitari
  rationale: Kiambishi הָ־ kilicho katika umbo la Kiebrania kimehifadhiwa kama sehemu ya jina, kwa kuwa huenda kilikwisha kuwa sehemu thabiti ya jina lenyewe.
- source_word: אֵלֶּה בְּנֵי נַעֲרָה
  choice: Hao ndio waliokuwa wana wa Naara
  rationale: Kauli hii ya muhtasari inabainisha kwamba majina yaliyotangulia ni wana wa Naara; “wana” huhifadhi jinsia ya בְּנֵי katika muktadha wa nasaba.
