  text: וּ/מֵ/הֶ֣ם מִן בְּנֵ֣י שִׁמְע֗וֹן הָלְכוּ֙ לְ/הַ֣ר שֵׂעִ֔יר אֲנָשִׁ֖ים חֲמֵ֣שׁ מֵא֑וֹת וּ/פְלַטְיָ֡ה וּ֠/נְעַרְיָה וּ/רְפָיָ֧ה וְ/עֻזִּיאֵ֛ל בְּנֵ֥י יִשְׁעִ֖י בְּ/רֹאשָֽׁ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/042.yaml
  text: And some of them[a], from the sons of Simeon, went to Mount Seir—five hundred men—with Pelatiah, Neariah, Rephaiah, and Uzziel, sons of Ishi, at their head.
translation:
  language: sw
  text: Na baadhi yao, kutoka miongoni mwa wana wa Simeoni—watu mia tano—walikwenda kwenye Mlima Seiri, wakiwa na Pelatia, Nearia, Refaya na Uzieli, wana wa Ishi, waliokuwa mbele yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “... Pelatia, Nearia, Refaya na Uzieli, wana wa Ishi, walikuwa viongozi wao.” Mpangilio wa Kiebrania huorodhesha majina haya kabla ya kirai “wana wa Ishi, mbele yao,” ukionyesha kwamba watu hawa walikuwa viongozi wa kundi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם מִן בְּנֵי שִׁמְעוֹן
  choice: Na baadhi yao, yaani, wana wa Simeoni
  rationale: Muundo huu unaonyesha kwamba kundi hili lilikuwa sehemu ya wale waliotajwa awali, kisha linawatambulisha kwa nasaba kama wana wa Simeoni. Neno “yaani” linafanya uhusiano huo uwe wazi katika Kiswahili cha kawaida bila kuondoa maana ya sehemu kutoka katika kundi.
- source_word: הָלְכוּ לְהַר שֵׂעִיר
  choice: wakaenda kwenye Mlima Seiri
  rationale: “Wakaenda” ni tafsiri ya moja kwa moja ya kitenzi cha mwendo, bila kuongeza wazo la safari ya kijeshi. “Mlima Seiri” linahifadhi jina la mahali lililozoeleka kibiblia.
- source_word: אֲנָשִׁים חֲמֵשׁ מֵאוֹת
  choice: watu mia tano
  rationale: Kirai hiki kinataja idadi ya kundi kwa urahisi na bila kuongeza maana ya kijeshi ambayo haijasemwa wazi.
- source_word: וּפְלַטְיָה וּנְעַרְיָה וּרְפָיָה וְעֻזִּיאֵל
  choice: Pelatia, Nearia, Refaya na Uzieli
  rationale: Majina yamenukuliwa kwa tahajia inayosomeka kwa kawaida katika Kiswahili huku yakifuata kwa karibu matamshi ya Kiebrania.
- source_word: בְּנֵי יִשְׁעִי
  choice: wana wa Ishi
  rationale: Hili linahifadhi utambulisho wa kinasaba wa viongozi hao wanne.
- source_word: בְּרֹאשָׁם
  choice: wakiongozwa na
  rationale: Nahau ya Kiebrania, kihalisi “kichwani mwao,” inaonyesha kwamba wanaume waliotajwa walikuwa viongozi wa kundi. Kiswahili “wakiongozwa na” kinawasilisha kazi hiyo kwa ufasaha.
