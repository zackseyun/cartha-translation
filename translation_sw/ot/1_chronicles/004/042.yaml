translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo umepangwa upya kiasi ili idadi ya watu na uongozi wa kundi usomeke kwa urahisi, huku tanbihi ikihifadhi uwezekano wa muundo wa karibu zaidi na Kiebrania.
