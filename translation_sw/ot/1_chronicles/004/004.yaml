base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/004.yaml
  text: Penuel[a], the father of Gedor, and Ezer, the father of Hushah—these were the sons of Hur, the firstborn of Ephrathah[b], the father of Bethlehem.
translation:
  language: sw
  text: Penueli[a], baba wa Gedori, na Ezeri, baba wa Husha—hao walikuwa wana wa Huri, mzaliwa wa kwanza wa Efratha, baba wa Bethlehemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika nasaba hii, neno la Kiebrania linalotafsiriwa “baba wa” linaweza pia kumaanisha “mwanzilishi wa” au “babu wa ukoo wa,” hasa linapohusishwa na mji au ukoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנוּאֵל
  choice: Penueli
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, huku likifuata umbo la Kiebrania la mstari huu.
- source_word: אֲבִי
  choice: baba wa
  rationale: Huhifadhi nahau ya Kiebrania; katika muktadha huu wa nasaba na makao inaweza pia kumaanisha mwanzilishi au babu wa ukoo, jambo linalofafanuliwa katika tanbihi.
- source_word: גְדֹר
  choice: Gedori
  rationale: Jina la mahali au ukoo limetoholewa badala ya kutafsiriwa.
- source_word: עֵזֶר
  choice: Ezeri
  rationale: Jina la mtu limetoholewa kwa muundo wa kawaida wa Kiswahili.
- source_word: חוּשָׁה
  choice: Husha
  rationale: Jina la mahali au ukoo limetoholewa.
- source_word: אֵלֶּה
  choice: hao walikuwa
  rationale: Kishazi cha Kiebrania hakina kitenzi wazi; wakati uliopita unasomeka kwa kawaida katika simulizi la nasaba.
- source_word: בְנֵי
  choice: wana wa
  rationale: Huhifadhi maana ya msingi ya neno la Kiebrania bila kuipanua kimya kimya kuwa 'wazao.'
- source_word: חוּר
  choice: Huri
  rationale: Jina la mtu limetoholewa kwa Kiswahili.
- source_word: בְּכֹר
  choice: mzaliwa wa kwanza wa
  rationale: Hueleza hadhi ya Huri kuhusiana na Efratha bila kuongeza neno 'mwana,' ambalo halipo wazi katika kirai hiki.
- source_word: אֶפְרָתָה
  choice: Efratha
  rationale: Jina limetoholewa kwa namna ya kawaida na inayotambulika katika Kiswahili.
- source_word: בֵּית לָחֶם
  choice: Bethlehemu
  rationale: Jina la mahali limetoholewa kwa umbo lililozoeleka katika Biblia za Kiswahili badala ya kutafsiri maana ya vipashio vyake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa moja kwa moja, na unaosomeka kwa kawaida. Nahau ya nasaba “baba wa” na “wana wa” imehifadhiwa ili kutoondoa upana wa maana wa Kiebrania. Taarifa ya Kiingereza kuhusu tahajia mbadala Penieli haikupewa alama tofauti kwa sababu alama yake ilikuwa imeambatanishwa kimakosa na Efratha; maelezo muhimu ya mstari huu yamewekwa kwa usahihi baada ya Penueli.
