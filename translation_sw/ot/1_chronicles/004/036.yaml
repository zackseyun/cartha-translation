  text: and Elioenai, and Jaakobah, and Jeshohaiah, and Asaiah, and Adiel, and Jesimiel, and Benaiah.
translation:
  language: sw
  text: Na Elioenai, na Yaakoba, na Yeshohaya, na Asaya, na Adieli, na Yesimieli, na Benaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְיוֹעֵינַי
  choice: Elioenai
  rationale: Jina la mtu limetoholewa kwa herufi za Kiswahili bila kutafsiri maana yake; umbo hili linahifadhi kwa karibu muundo wa Kiebrania.
- source_word: יַעֲקֹבָה
  choice: Yaakoba
  rationale: Jina limetoholewa kwa kufuata matamshi ya Kiebrania; yod ya mwanzo imewakilishwa kwa Y, na vokali mbili zinaonyesha mfuatano wa sauti kuliko umbo lililozoeleka la Yakoba.
- source_word: יְשׁוֹחָיָה
  choice: Yeshohaya
  rationale: Utohozi unawakilisha yod kwa Y, shin kwa sh, na sehemu ya mwisho -yāh kwa -ya katika tahajia ya Kiswahili.
- source_word: עֲשָׂיָה
  choice: Asaya
  rationale: Jina limetoholewa kwa namna rahisi na inayosomeka katika Kiswahili, huku sehemu ya mwisho ya Kiebrania -yāh ikiwakilishwa kwa -ya.
- source_word: עֲדִיאֵל
  choice: Adieli
  rationale: Jina limetoholewa kwa umbo linalotamkika kiasili katika Kiswahili; vokali ya mwisho imeongezwa ili kuepuka kufunga neno kwa konsonanti.
- source_word: יְשִׂימִאֵל
  choice: Yesimieli
  rationale: Jina limetoholewa kwa Y ya mwanzo na umbo la Kiswahili linalotamkika kwa urahisi; -eli imepanuliwa kuwa -eli yenye vokali ya mwisho katika tahajia ya kawaida ya majina.
- source_word: בְּנָיָה
  choice: Benaya
  rationale: Utohozi huu unafuata kwa karibu konsonanti na vokali za jina la Kiebrania na una matamshi ya kawaida ya Kiswahili.
- source_word: וְ / וַ / וִ / וּ
  choice: na
  rationale: Kila kiambishi cha waw kimetafsiriwa kuwa “na” ili kuhifadhi mtindo wa Kiebrania wa kuunganisha kila jina kwa kiunganishi.
theological_decisions: []
translation_notes:
  register: Lugha ni ya orodha rasmi na yenye hadhi. Majina yametoholewa moja kwa moja kutoka Kiebrania kwa kanuni za matamshi ya Kiswahili, badala ya kunakili maumbo ya Kiingereza. Kurudiwa kwa “na” kumehifadhiwa kwa sababu ndilo muundo wa chanzo.
