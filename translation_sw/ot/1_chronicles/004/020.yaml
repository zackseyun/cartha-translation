translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaosomeka kwa urahisi. Kitenzi “walikuwa” kimeongezwa ili sentensi za orodha ziwe za asili katika Kiswahili bila kubadili uhusiano wa kinasaba. Majina yametoholewa kwa maumbo yanayoweza kutamkwa kwa urahisi katika Kiswahili.
