base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/020.yaml
  text: 'The sons of Shimon: Amnon and Rinnah[a], Ben-Hanan and Tilon[b]. And the sons of Ishi: Zoheth and Ben-Zoheth.'
translation:
  language: sw
  text: Wana wa Shimoni walikuwa Amnoni, Rina, Ben-Hanani[a] na Tiloni. Nao wana wa Ishi walikuwa Zohethi na Ben-Zohethi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwana wa Hanan”; hata hivyo, katika orodha hii ya nasaba huenda usemi huu ni jina la mtu.
    reason: lexical_alternative
  - marker: b
    text: Au, “mwana wa Zohethi”; hata hivyo, katika orodha hii ya nasaba huenda usemi huu ni jina la mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁימוֹן
  choice: Wana wa Shimoni
  rationale: Muundo wa nasaba וּבְנֵי unamaanisha “wana wa.” Jina שִׁימוֹן limetoholewa kuwa “Shimoni” kwa namna inayoeleweka na inayolingana na fonolojia ya Kiswahili.
- source_word: אַמְנוֹן
  choice: Amnoni
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili, likihifadhi kwa karibu sauti za Kiebrania.
- source_word: וְרִנָּה
  choice: Rina
  rationale: Jina la mtu limetoholewa kwa Kiswahili; kiunganishi cha Kiebrania kinawakilishwa katika mpangilio wa orodha badala ya kurudiwa kabla ya kila jina.
- source_word: בֶּן חָנָן
  choice: Ben-Hanani
  rationale: Katika mfululizo huu wa majina, maneno haya yanaeleweka vizuri zaidi kama jina moja la mtu. Kistari kinaonyesha umoja wa jina huku kikihifadhi sehemu zake.
- source_word: וְתולון
  choice: na Tiloni
  rationale: Jina limetoholewa kuwa “Tiloni,” na kiunganishi kimetafsiriwa moja kwa moja kuwa “na.”
- source_word: וּבְנֵי יִשְׁעִי
  choice: Nao wana wa Ishi
  rationale: “Wana wa” huhifadhi fomula ya nasaba; “Nao” huonyesha kuendelea kwa orodha kama inavyofanya וּ־ ya Kiebrania.
- source_word: זוֹחֵת
  choice: Zohethi
  rationale: Jina limetoholewa kwa mfumo wa sauti na tahajia unaofaa Kiswahili.
- source_word: וּבֶן זוֹחֵת
  choice: na Ben-Zohethi
  rationale: Kwa kuwa hakuna jina jingine linalofuata ambalo lingekuwa mwana wa Zohethi, kirai hiki kimechukuliwa kuwa jina la mtu katika orodha, huku uwezekano mwingine ukitajwa katika tanbihi.
