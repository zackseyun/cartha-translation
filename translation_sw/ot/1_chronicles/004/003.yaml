base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/003.yaml
  text: 'These were the sons of the father of Etam: Jezreel[a], Ishma, and Idbash[b]; and the name of their sister was Hazzelelponi.'
translation:
  language: sw
  text: Hawa ndio wana[a] wa baba wa Etamu:[b] Yezreeli, Ishma na Idbashi; na jina la dada yao lilikuwa Haselelponi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “wana” halimo wazi katika maandishi ya Kiebrania, lakini linaeleweka kutokana na muundo wa nasaba na kutajwa kwa “dada yao.”
    reason: textual_clarification
  - marker: b
    text: “Baba wa Etamu” huenda ikamaanisha pia babu wa ukoo au mwanzilishi wa Etamu; katika nasaba za Mambo ya Nyakati, neno la Kiebrania linalomaanisha “baba” linaweza kutumiwa kwa maana pana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Hawa ndio
  rationale: Hutoa utambulisho wa orodha ya nasaba kwa Kiswahili cha kawaida; kiunganishi cha Kiebrania hakihitaji kutafsiriwa kwa neno “na” hapa.
- source_word: אֲבִי עֵיטָם
  choice: baba wa Etamu
  rationale: Ni tafsiri ya moja kwa moja ya hali ya muundo wa Kiebrania. Neno “baba” linaweza kumaanisha mzazi, babu wa ukoo, au mwanzilishi wa mahali au ukoo, hivyo maana pana imehifadhiwa katika tanbihi.
- source_word: יִזְרְעֶאל
  choice: Yezreeli
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likifuata umbo la Kiebrania.
- source_word: וְיִשְׁמָא
  choice: Ishma
  rationale: Jina la mtu limetoholewa moja kwa moja kutoka Kiebrania.
- source_word: וְיִדְבָּשׁ
  choice: na Idbashi
  rationale: Jina limetoholewa, na kiunganishi kimehifadhi muundo wa orodha.
- source_word: וְשֵׁם אֲחוֹתָם
  choice: na jina la dada yao lilikuwa
  rationale: Huhifadhi usemi wa Kiebrania na kiambishi cha wingi kinachowaelekezea wanaume waliotajwa.
- source_word: הַצְלֶלְפּוֹנִי
  choice: Haselelponi
  rationale: Jina la mwanamke limetoholewa kwa sauti na tahajia zinazofaa Kiswahili.
theological_decisions:
- issue: Uhusiano wa watu waliotajwa na “baba wa Etamu”
  choice: Neno “wana” limeongezwa katika matini na kuwekewa tanbihi.
  alternative: Kutafsiri kihalisi, “Hawa ndio baba wa Etamu,” jambo ambalo halipatani kisarufi na orodha ya watu kadhaa na kutajwa kwa dada yao.
  rationale: Kiebrania cha Kimasora hakina neno “wana,” lakini sentensi inaonekana kulihitaji ili kueleza uhusiano wa watu hao bila kubadili “baba wa Etamu” kuwa mmoja wao. Tanbihi inaweka wazi hali ya matini badala ya kuficha nyongeza hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Majina yametoholewa badala ya kutafsiriwa; utata wa muundo wa nasaba umewekwa wazi kwa tanbihi.
