  yaml_path: translation/ot/1_chronicles/004/033.yaml
  text: And all their villages that were around these cities, as far as Baal—these were their settlements, and they had their genealogy recorded.
translation:
  language: sw
  text: Na vijiji vyao vyote[a] vilivyokuwa kandokando ya miji hii, mpaka Baali. Hayo yalikuwa makao yao, nao waliorodheshwa kwa nasaba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vitongoji vyao” au “makazi yao madogo.”
    reason: lexical_alternative
  - marker: b
    text: Au “nasaba yao iliandikishwa”; usemi wa Kiebrania unahusu kuorodheshwa kwa kufuata nasaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: vijiji vyao
  rationale: Katika orodha hii ya maeneo yanayokaliwa kuzunguka miji, neno hili lina maana ya vijiji au makazi madogo, si nyua halisi.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: vilivyozunguka miji hii
  rationale: Hutoa kwa njia ya kawaida ya Kiswahili uhusiano wa kijiografia wa vijiji hivyo na miji iliyotajwa.
- source_word: עַד בָּעַל
  choice: mpaka Baali
  rationale: עַד huonyesha mpaka wa eneo, na בָּעַל hapa ni jina la mahali, hivyo limetoholewa kuwa Baali.
- source_word: זֹאת מוֹשְׁבֹתָם
  choice: Hayo ndiyo yaliyokuwa makao yao
  rationale: זֹאת ya umoja inatumika kwa muhtasari wa maeneo yaliyotangulia; Kiswahili cha kawaida hutumia rejeo la wingi 'hayo' kwa makao hayo.
- source_word: וְהִתְיַחְשָׂם לָהֶם
  choice: nao walijiandikisha kwa nasaba
  rationale: Kitenzi cha Hitpael cha יחס hueleza kuorodheshwa au kujiandikisha kwa msingi wa ukoo; tafsiri hii huhifadhi hali yake ya kujirejelea bila kuongeza maelezo yasiyokuwapo.
