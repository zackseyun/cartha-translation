base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/006.yaml
  text: Eluzai[a], Jerimoth, Bealiah, Shemariahu, and Shephatiah the Haruphite.
translation:
  language: sw
  text: Eluzai, Yerimothi, Bealia, Shemariahu na Shefatia, Mharifi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mharufi.” Huenda jina hili la ukoo linahusiana na jina Harifu linalopatikana mahali pengine.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלְעוּזַי
  choice: Eluzai
  rationale: Jina la mtu limetoholewa kwa kufuata umbo la Kiebrania bila kutafsiri maana yake.
- source_word: וִירִימוֹת
  choice: Yerimothi
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa Kiswahili; kiunganishi cha Kiebrania kimewasilishwa kwa uakifishaji wa orodha badala ya kurudiwa.
- source_word: וּבְעַלְיָה
  choice: Bealia
  rationale: Jina la mtu limetoholewa kwa mfumo wa sauti unaoeleweka kwa msomaji wa Kiswahili.
- source_word: וּשְׁמַרְיָהוּ
  choice: Shemariahu
  rationale: Mwisho kamili wa jina, -yahu, umehifadhiwa kwa sababu umo wazi katika maandishi ya Kiebrania.
- source_word: וּשְׁפַטְיָהוּ
  choice: Shefatia
  rationale: Jina limetoholewa kwa namna ya kawaida na rahisi kutamkwa katika Kiswahili, huku likibaki karibu na umbo la Kiebrania.
- source_word: הַחֲרִיפִי
  choice: Mharifi
  rationale: Ni jina la ukoo au kundi lenye kibainishi. Umbo la Kiswahili Mharifi linafuata vokali za maandishi ya Kimasora na kuonyesha mtu wa ukoo huo.
