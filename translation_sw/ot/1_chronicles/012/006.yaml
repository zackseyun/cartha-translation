  register: Kiswahili sanifu cha Afrika Mashariki; mtindo mfupi wa orodha ya majina. Majina yametoholewa kwa tahajia inayosomeka kwa Kiswahili, na utata wa jina la ukoo umehifadhiwa katika tanbihi.
