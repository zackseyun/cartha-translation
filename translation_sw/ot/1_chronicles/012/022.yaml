id: 1CH.12.22
reference: 1 Chronicles 12:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הֵ֗מָּה עָזְר֤וּ עִם דָּוִיד֙ עַֽל הַ/גְּד֔וּד כִּֽי גִבּ֥וֹרֵי חַ֖יִל כֻּלָּ֑/ם וַ/יִּהְי֥וּ שָׂרִ֖ים בַּ/צָּבָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/022.yaml
  text: And they helped David against the raiding band[a], for all of them were mighty men of valor[c][b], and they became commanders in the army.
translation:
  language: sw
  text: Nao walimsaidia Daudi dhidi ya kikosi cha wavamizi[a], kwa maana wote walikuwa mashujaa hodari[b], nao wakawa makamanda katika jeshi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhidi ya kikosi” au “dhidi ya kundi la askari”; neno la Kiebrania גְּדוּד linaweza kumaanisha kikosi cha kijeshi au kundi la wavamizi.
    reason: lexical_alternative
  - marker: b
    text: Au “wapiganaji mashujaa”; kirai cha Kiebrania גִבּוֹרֵי חַיִל ni usemi wa kawaida kwa wapiganaji hodari, wenye uwezo na ushujaa.
    reason: lexical_alternative
  - marker: c
    text: Au “wakuu” au “majemadari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Nao
  rationale: Kiwakilishi huru cha Kiebrania kinakazia wahusika; “Nao” kinahifadhi kiunganishi na msisitizo huo kwa Kiswahili cha asili.
- source_word: עָזְרוּ עִם דָּוִיד
  choice: walimsaidia Daudi
  rationale: Ingawa עִם kwa kawaida ni “pamoja na,” pamoja na kitenzi עזר maana ya kisarufi na ya kimuktadha ni kumpa Daudi msaada; Kiswahili huieleza kwa yambwa moja kwa moja.
- source_word: עַל הַגְּדוּד
  choice: dhidi ya kikosi cha wavamizi
  rationale: עַל hapa inaeleza upinzani, na גְּדוּד inaweza kumaanisha kikosi, kundi la kijeshi, au kundi la wavamizi. Tafsiri hii inaonyesha mazingira ya mapigano bila kuficha upana wa neno; mbadala umeandikwa katika tanbihi.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinaanzisha maelezo ya sababu na kuhifadhi uhusiano wa hoja kwa mtindo wenye hadhi.
- source_word: גִבּוֹרֵי חַיִל
  choice: mashujaa hodari
  rationale: Kirai hiki cha kawaida cha kijeshi humaanisha wapiganaji wenye nguvu, uwezo, na ushujaa. “Mashujaa hodari” ni cha asili na kinabeba maana hizo bila tafsiri ndefu isiyo ya kawaida.
- source_word: כֻּלָּם
  choice: wote
  rationale: Huhifadhi mkazo kwamba kila mmoja katika kundi alistahili sifa hiyo.
- source_word: וַיִּהְיוּ
  choice: wakawa
  rationale: Muundo huu unaonyesha hali iliyotokea katika mwendelezo wa simulizi, si tu hali tuli.
- source_word: שָׂרִים
  choice: makamanda
  rationale: Katika muktadha wa jeshi, שָׂרִים ni viongozi wenye mamlaka; “makamanda” ni neno wazi la kisasa, huku maana mbadala zikitajwa katika tanbihi.
- source_word: בַּצָּבָא
  choice: katika jeshi
  rationale: צָבָא hapa ni jeshi lililopangwa; “jeshi” ni neno la kawaida na sahihi katika Kiswahili.
theological_decisions: []
