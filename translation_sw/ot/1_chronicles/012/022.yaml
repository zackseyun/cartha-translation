  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Mpangilio wa tanbihi umewekwa karibu na maneno yanayohusika: [a] kwa גְּדוּד, [b] kwa גִבּוֹרֵי חַיִל, na [c] kwa שָׂרִים.'
