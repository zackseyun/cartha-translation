  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa Kiebrania ni wa kifupisho cha orodha na hauna kitenzi wazi; 'pamoja na' limeongezwa ili kuweka wazi uhusiano wa Sadoki na makamanda bila kubadili maana.
