base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/029.yaml
  text: And Zadok[a], a young man mighty in valor[b], and from his father’s house twenty-two commanders.
translation:
  language: sw
  text: Na Sadoki, kijana shujaa mwenye uhodari; kutoka katika jamaa ya baba yake walikuwepo makamanda ishirini na wawili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָדוֹק
  choice: Sadoki
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: נַעַר
  choice: kijana
  rationale: Katika muktadha huu wa kijeshi neno hilo linaonyesha umri wake bila kulifanya kimahususi kuwa cheo au jukumu la kijeshi.
- source_word: גִּבּוֹר חָיִל
  choice: shujaa mwenye uhodari
  rationale: Kirai hiki kinaonyesha mtu mwenye nguvu na ushujaa, hasa katika mazingira ya kijeshi; tafsiri hii ni ya asili na yenye hadhi katika Kiswahili.
- source_word: בֵית אָבִיו
  choice: jamaa ya baba yake
  rationale: Nahau ya Kiebrania inahusu ukoo au kundi la kifamilia linalohesabiwa kwa upande wa baba; 'jamaa ya baba yake' huhifadhi maana hiyo kwa Kiswahili kinachoeleweka.
- source_word: שָׂרִים
  choice: makamanda
  rationale: Muktadha wa orodha ya kijeshi unaunga mkono viongozi wenye mamlaka ya kuamuru kuliko maana pana ya 'viongozi'.
- source_word: עֶשְׂרִים וּשְׁנָיִם
  choice: ishirini na wawili
  rationale: Idadi imetafsiriwa moja kwa moja kwa upatanisho wa ngeli unaowarejelea watu.
- source_word: וְ
  choice: Na
  rationale: Kiunganishi hiki kinaendeleza muundo wa orodha kutoka kifungu kilichotangulia.
