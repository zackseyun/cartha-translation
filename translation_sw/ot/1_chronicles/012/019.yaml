base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/019.yaml
  text: And the Spirit clothed Amasai, chief of the Thirty, and he said, “Yours are we, David, and with you, son of Jesse! Peace, peace to you, and peace to your helpers, for your God helps you.” Then David received them and made them chiefs of the troops.
translation:
  language: sw
  text: 'Roho akamvika Amasai[a], mkuu wa wale Thelathini, naye akasema,


    “Sisi ni wako, Daudi,

    nasi tuko pamoja nawe, mwana wa Yese!

    Amani, amani iwe kwako,

    na amani iwe kwa wanaokusaidia,[b]

    kwa maana Mungu wako anakusaidia.”[c]


    Ndipo Daudi akawapokea na kuwaweka kuwa wakuu wa kikosi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “roho ilimvika Amasai,” au “roho ilimjia Amasai.” Kiebrania kinasema kihalisi, “roho ilimvika Amasai.”
    reason: alternative_reading
  - marker: b
    text: Au “anayekusaidia.” Neno la Kiebrania liko katika umoja lakini linaweza kueleweka kwa maana ya kijumla.
    reason: lexical_alternative
  - marker: c
    text: Au “kwa maana Mungu wako amekusaidia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ לָבְשָׁה
  choice: Roho akamvika
  rationale: Huhifadhi sitiari isiyo ya kawaida ya Kiebrania, ambamo roho ndiye anayemvika Amasai. Herufi kubwa inaonyesha uwezekano mkubwa kwamba anayelengwa ni Roho wa Mungu, huku tanbihi ikihifadhi uwezekano wa tafsiri nyingine.
- source_word: אֶת עֲמָשַׂי
  choice: Amasai
  rationale: Jina la mtu limenukuliwa kwa namna inayofaa mfumo wa sauti wa Kiswahili.
- source_word: רֹאשׁ הַשְּׁלֹשִׁים
  choice: mkuu wa wale Thelathini
  rationale: Neno רֹאשׁ humaanisha mkuu au kiongozi; ‘wale Thelathini’ linaonyesha kundi maalumu la kijeshi badala ya idadi isiyo maalumu.
- source_word: לְךָ דָוִיד
  choice: Sisi ni wako, Daudi
  rationale: Kauli fupi ya Kiebrania inaeleza utii na kujitoa kwa Daudi; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: וְעִמְּךָ בֶן יִשַׁי
  choice: nasi tuko pamoja nawe, mwana wa Yese
  rationale: Kitenzi ‘tuko’ kimejazwa ili kishazi kisicho na kitenzi katika Kiebrania kisomeke kwa kawaida katika Kiswahili, bila kubadili maana yake.
- source_word: שָׁלוֹם שָׁלוֹם לְךָ
  choice: Amani, amani iwe kwako
  rationale: Marudio ya ‘amani’ yamehifadhiwa kwa sababu yanatoa mkazo wa maandishi ya Kiebrania.
- source_word: וְשָׁלוֹם לְעֹזְרֶךָ
  choice: na amani iwe kwa wanaokusaidia
  rationale: Ingawa umbo la Kiebrania ni la umoja, linaweza kutumiwa kwa maana ya kijumla. Wingi unafaa muktadha wa kundi la wafuasi, na umoja umeandikwa katika tanbihi.
- source_word: כִּי עֲזָרְךָ אֱלֹהֶיךָ
  choice: kwa maana Mungu wako anakusaidia
  rationale: Kauli timilifu ya Kiebrania inaweza kueleza msaada uliotolewa au ukweli unaoendelea. Wakati wa sasa unaonyesha msaada wa Mungu unaothibitisha utii wao, huku tafsiri ya wakati uliopita ikihifadhiwa katika tanbihi.
- source_word: וַיְקַבְּלֵם
  choice: Daudi akawapokea
  rationale: Kitenzi kina maana ya kupokea au kukubali; ‘kuwapokea’ kinafaa mtiririko wa simulizi bila kuongeza dhana ya sherehe rasmi.
- source_word: וַיִּתְּנֵם בְּרָאשֵׁי הַגְּדוּד
  choice: kuwaweka kuwa wakuu wa kikosi
  rationale: Hii ni kauli ya kuwapa nafasi ya uongozi. Umoja ‘kikosi’ unafuata הַגְּדוּד, na ‘wakuu’ unafuata wingi wa רָאשֵׁי.
theological_decisions:
- issue: Iwapo רוּחַ ni Roho wa Mungu au roho kwa maana nyingine
  choice: Roho
  alternative: roho fulani; roho
  rationale: Katika Mambo ya Nyakati, kuwezeshwa na Roho katika tamko la uongozi ni wazo linalojirudia, na sitiari ya roho kumvika mtu inaelekea kuonyesha utendaji wa Mungu. Hata hivyo, kwa kuwa Kiebrania hakina kibainishi hapa, uwezekano mwingine umehifadhiwa katika tanbihi.
- issue: Iwapo msaada wa Mungu ni wa sasa au uliokwisha kutolewa
  choice: Mungu wako anakusaidia
  alternative: Mungu wako amekusaidia
  rationale: Umbo la kitenzi linaweza kueleweka kama tendo lililotimia au kama hali yenye nguvu inayoendelea. Muktadha unaruhusu msaada wa sasa, lakini tanbihi haifuti uwezekano wa wakati uliopita.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kibiblia lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari ya usemi imepangwa kishairi ili kuhifadhi ulinganifu na marudio. ‘Akamvika’ imeachwa kwa makusudi ili kuhifadhi sitiari ya Kiebrania badala ya kuibadili kimya kimya kuwa ‘akamjia’.
