  verdict: revise
  source_fidelity: 'Tafsiri inafuata kwa karibu maana ya Kiebrania: Daudi anatoka, anatangaza masharti ya ujio wa amani na msaada dhidi ya hila kwa niaba ya maadui, anathibitisha kutokuwa na dhuluma, na kumwomba Mungu atazame na aamue hukumu. Hata hivyo, ‘akatoka kwenda mbele yao’ si ujenzi wa kawaida wa Kiswahili kwa לִפְנֵיהֶם, na ‘na aone na kuhukumu’ huchanganya umbo la ombi na infinitivu. Marekebisho yanadumisha ombi/kiapo cha mwisho na hali ya tahadhari ya kifungu.'
  naturalness: Kiswahili cha rasimu kinaeleweka na kina hadhi inayofaa, lakini ‘Daudi akatoka, akawa mbele yao’ ni mwafaka zaidi kwa maana ya mahali kuliko ‘akatoka kwenda mbele yao.’ ‘Mungu wa baba zetu na aone, naye ahukumu’ ni Kiswahili Sanifu cha asili na chenye ulinganifu wa vitenzi.
  terminology: ‘Daudi,’ ‘amani,’ ‘moyo,’ ‘dhuluma,’ na ‘Mungu wa baba zetu’ zinafaa. ‘Kusaliti’ ni chaguo salama katika muktadha huu, huku tanbihi ikihifadhi maana mbadala ya kudanganya kwa hila. ‘Ahukumu’ huwasilisha vizuri יוכח katika muktadha wa Mungu kuchunguza na kutoa uamuzi; tanbihi ihifadhi ‘kukemea’ na ‘kuamua mgogoro.’
  issues:
