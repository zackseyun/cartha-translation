    rationale: לִפְנֵיהֶם ni kirai cha nafasi, ‘mbele yao.’ ‘Akatoka, akawa mbele yao’ hudumisha tendo la kutoka na uhusiano wa mahali bila kuongeza wazi wazo la kuwalaki.
  - severity: medium
    issue: ‘Mungu wa baba zetu na aone na kuhukumu’ ina umbo lisilolingana la kitenzi cha pili.
    rationale: Baada ya ‘na aone,’ kitenzi sambamba cha ombi kinapaswa kuwa ‘ahukumu,’ si infinitivu ‘kuhukumu.’ ‘Naye’ pia huweka wazi uratibu wa vitenzi viwili vya Kiebrania.
  - severity: low
    issue: ‘Mikononi mwangu hamna dhuluma’ inaeleweka, lakini ‘mikono yangu haina dhuluma’ ni mwafaka zaidi kisintaksia.
    rationale: Huhifadhi nahau ya Kiebrania ya kutokuwa na hatia katika mikono ya mtu na husomeka kwa urahisi katika Kiswahili cha sasa.
