  text: וַ/יֵּצֵ֣א דָוִיד֮ לִ/פְנֵי/הֶם֒ וַ/יַּ֨עַן֙ וַ/יֹּ֣אמֶר לָ/הֶ֔ם אִם לְ/שָׁל֞וֹם בָּאתֶ֤ם אֵלַ/י֙ לְ/עָזְרֵ֔/נִי יִֽהְיֶה לִּ֧/י עֲלֵי/כֶ֛ם לֵבָ֖ב לְ/יָ֑חַד וְ/אִֽם לְ/רַמּוֹתַ֣/נִי לְ/צָרַ֗/י בְּ/לֹ֤א חָמָס֙ בְּ/כַפַּ֔/י יֵ֛רֶא אֱלֹהֵ֥י אֲבוֹתֵ֖י/נוּ וְ/יוֹכַֽח־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/018.yaml
  text: David went out before them and answered and said to them[a], “If you have come to me in peace to help me, my heart will be united with you; but if you have come to betray me to my enemies, though there is no violence in my hands[b], may the God of our fathers see and judge.”
translation:
  language: sw
  text: Daudi akatoka, akawa mbele yao, akajibu na kuwaambia, “Ikiwa mmekuja kwangu kwa amani ili kunisaidia, moyo wangu utaungana nanyi. Lakini ikiwa mmekuja kunisaliti[a] kwa adui zangu, ingawa mikono yangu haina dhuluma, Mungu wa baba zetu na aone, naye ahukumu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kunidanganya kwa hila.” Kitenzi cha Kiebrania kinaweza kumaanisha udanganyifu wa hila; “kunisaliti” kimetumiwa hapa kwa sababu muktadha unahusu maadui wa Daudi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kukemea” au “kuamua mgogoro.” Kitenzi cha mwisho cha Kiebrania kinaweza kumaanisha kukemea, kuamua mgogoro, au kutoa hukumu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא ... לִפְנֵיהֶם
  choice: akatoka kwenda mbele yao
  rationale: Inahifadhi tendo la kutoka na maana ya mahali ya ‘mbele yao’ bila kuongeza waziwazi wazo la kwenda kuwalaki.
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: akajibu na kuwaambia
  rationale: Inabaki na vitenzi vyote viwili vya fomula ya Kiebrania kwa Kiswahili cha kawaida na kinachoeleweka.
- source_word: לְשָׁלוֹם
  choice: kwa amani
  rationale: Inaonyesha kwamba ujio wao ulikuwa wa kirafiki na wenye nia njema huku ikibaki karibu na kirai cha Kiebrania.
- source_word: יִהְיֶה לִּי עֲלֵיכֶם לֵבָב לְיָחַד
  choice: moyo wangu utaungana nanyi
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa nahau inayomaanisha mshikamano wa moyo mmoja, bila kuifanya kuwa kauli nzito isiyo ya kawaida.
- source_word: לְרַמּוֹתַנִי
  choice: kunisaliti
  rationale: Kitenzi kinaweza kumaanisha kudanganya kwa hila; katika muktadha wa maadui, ‘kunisaliti’ kinaonyesha vizuri hila yenye kusudi la kumweka Daudi mikononi mwao.
- source_word: בְּלֹא חָמָס בְּכַפַּי
  choice: ingawa mikononi mwangu hamna dhuluma
  rationale: ‘Dhuluma’ huwasilisha חמס kama tendo ovu au la kikatili, na ‘mikononi mwangu’ huhifadhi nahau ya Kiebrania kuhusu kuwajibika kwa matendo.
- source_word: אֱלֹהֵי אֲבוֹתֵינוּ
  choice: Mungu wa baba zetu
  rationale: Inahifadhi usemi wa agano na umbo la kiume lililo wazi katika chanzo.
- source_word: יֵרֶא ... וְיוֹכַח
  choice: na aone na kuhukumu
  rationale: Miundo hii inaeleweka hapa kama ombi zito kwa Mungu achunguze jambo na kutoa hukumu; ‘kuhukumu’ pia hudumisha mwelekeo wa kimahakama wa muktadha.
theological_decisions:
- issue: Tendo la Mungu katika ombi la mwisho
  choice: Mungu wa baba zetu na aone na kuhukumu
  alternative: Mungu wa baba zetu ataona na kuhukumu; au, na aone na kukemea/kuamua
  rationale: Kauli ya Kiebrania inaweza kusomwa kama ombi au tamko, na kitenzi cha mwisho kinaweza kuonyesha kukemea, kuamua mgogoro, au kutoa hukumu. Kiswahili cha ombi kwa ‘na’ kinadumisha mwito rasmi kwa Mungu bila kuugeuza kuwa utabiri wa uhakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kibiblia lakini kinachoeleweka kwa msomaji wa kawaida. Mfuatano wa vitenzi vya simulizi umehifadhiwa kwa kiasi kinachobaki kuwa wa asili katika Kiswahili; nahau ngumu ya ‘moyo’ imetolewa kwa lugha ya sasa bila kuondoa wazo la umoja na mshikamano.
