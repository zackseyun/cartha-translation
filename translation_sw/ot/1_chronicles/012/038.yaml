  text: וּ/מֵ/עֵ֣בֶר לַ֠/יַּרְדֵּן מִן הָ/ראוּבֵנִ֨י וְ/הַ/גָּדִ֜י וַ/חֲצִ֣י שֵׁ֣בֶט מְנַשֶּׁ֗ה בְּ/כֹל֙ כְּלֵי֙ צְבָ֣א מִלְחָמָ֔ה מֵאָ֥ה וְ/עֶשְׂרִ֖ים אָֽלֶף־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/038.yaml
  text: And from beyond the Jordan[a], from the Reubenites, the Gadites, and the half-tribe of Manasseh, with every kind of military equipment for war, there were one hundred twenty thousand.
translation:
  language: sw
  text: Na kutoka ng’ambo ya Yordani[a], kutoka kwa Wareubeni, Wagadi, na nusu ya kabila la Manase, wakiwa na kila aina ya vifaa vya kijeshi kwa ajili ya vita, walikuwapo watu 120,000.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka upande wa pili wa Yordani.” Usemi wa Kiebrania unaweza kutafsiriwa kwa namna tofauti kutegemea mtazamo wa kijiografia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לַיַּרְדֵּן
  choice: Na kutoka ng’ambo ya Yordani
  rationale: Kirai hiki kinataja eneo lililo upande wa pili wa Yordani bila kubainisha kabisa mtazamo wa kijiografia. “Ng’ambo ya Yordani” ni Kiswahili cha kawaida na huhifadhi usemi huo.
- source_word: מִן הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: kutoka kwa Wareubeni, Wagadi, na nusu ya kabila la Manase
  rationale: Majina ya kwanza mawili yako katika umoja wa Kiebrania lakini yanawakilisha makundi ya kikabila; kwa hiyo wingi wa Kiswahili unafaa. “Nusu ya kabila la Manase” ni wazi na inafuata muundo wa chanzo.
- source_word: בְּכֹל כְּלֵי צְבָא מִלְחָמָה
  choice: wakiwa na kila aina ya vifaa vya kijeshi kwa ajili ya vita
  rationale: כְּלֵי inaweza kumaanisha vyombo, zana, au vifaa, na katika muktadha huu inahusu kwa upana vifaa au silaha za kijeshi. “Kila aina” huwasilisha בְּכֹל bila kuibana maana iwe silaha pekee.
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: watu 120,000
  rationale: Namba imetafsiriwa moja kwa moja. Neno “watu” limewekwa wazi kwa sababu muktadha unahesabu wapiganaji, na hufanya sentensi ya Kiswahili iwe kamili na ya kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo unaendeleza orodha ya mstari uliotangulia huku ukikamilisha sentensi kwa njia ya kawaida katika Kiswahili.
