lexical_decisions:
- source_word: יֽוֹחָנָן
  choice: Yohanani
  rationale: Jina la Kiebrania limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili, badala ya kutafsiriwa maana yake.
- source_word: הַ/שְּׁמִינִי
  choice: wa nane
  rationale: Namba ya mpangilio yenye kibainishi inaeleza nafasi ya Yohanani katika orodha; Kiswahili cha kawaida hutumia muundo wa namba 'wa nane'.
- source_word: אֶלְזָבָד
  choice: Elzabadi
  rationale: Jina la Kiebrania limetoholewa kwa mtindo wa majina unaoeleweka na wasomaji wa Kiswahili.
- source_word: הַ/תְּשִׁיעִי
  choice: wa tisa
  rationale: Namba hii ya mpangilio inalingana na kishazi kilichotangulia na inaonyesha nafasi katika orodha.
