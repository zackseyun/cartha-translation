  text: Ezeri, mkuu[a]; Obadia, wa pili; Eliabu, wa tatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiongozi”; Kiebrania kihalisi, “kichwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵזֶר
  choice: Ezeri
  rationale: Jina la mtu limetoholewa kwa umbo linalotambulika na linalotamkika kwa urahisi katika Kiswahili.
- source_word: הָרֹאשׁ
  choice: mkuu
  rationale: Ingawa רֹאשׁ maana yake ya msingi ni ‘kichwa,’ katika orodha hii inaonyesha cheo au uongozi; ‘mkuu’ ni Kiswahili cha kawaida na chenye hadhi kinachohifadhi dhana hiyo.
- source_word: עֹבַדְיָה
  choice: Obadia
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: הַשֵּׁנִי
  choice: wa pili
  rationale: Nambari ya mpangilio yenye kibainishi inaonyesha nafasi ya pili katika orodha.
- source_word: אֱלִיאָב
  choice: Eliabu
  rationale: Jina la mtu limetoholewa kwa umbo la kawaida na linalotamkika kiasili katika Kiswahili.
- source_word: הַשְּׁלִשִׁי
  choice: wa tatu
  rationale: Nambari ya mpangilio imetafsiriwa moja kwa moja ili kuhifadhi muundo na mpangilio wa orodha.
