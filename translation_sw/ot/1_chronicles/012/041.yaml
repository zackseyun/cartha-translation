  text: וְ/גַ֣ם הַ/קְּרֽוֹבִים אֲ֠לֵי/הֶם עַד יִשָׂשכָ֨ר וּ/זְבֻל֜וּן וְ/נַפְתָּלִ֗י מְבִיאִ֣ים לֶ֡חֶם בַּ/חֲמוֹרִ֣ים וּ/בַ/גְּמַלִּ֣ים וּ/בַ/פְּרָדִ֣ים וּֽ/בַ/בָּקָ֡ר מַאֲכָ֡ל קֶ֠מַח דְּבֵלִ֨ים וְ/צִמּוּקִ֧ים וְ/יַֽיִן וְ/שֶׁ֛מֶן וּ/בָקָ֥ר וְ/צֹ֖אן לָ/רֹ֑ב כִּ֥י שִׂמְחָ֖ה בְּ/יִשְׂרָאֵֽל־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/041.yaml
  text: 'Also those near them[a], as far as Issachar and Zebulun and Naphtali, were bringing food on donkeys, camels, mules, and cattle: provisions of flour, fig cakes, raisin cakes, wine, oil, cattle, and sheep in abundance[c][b], for there was joy in Israel.'
translation:
  language: sw
  text: 'Pia wale waliokuwa karibu nao, hata kufikia Isakari, Zabuloni na Naftali,[a] walikuwa wakileta chakula[b] kwa punda, ngamia, nyumbu na ng’ombe: mahitaji ya chakula, yaani unga, mikate ya tini, zabibu kavu,[c] divai, mafuta, ng’ombe na kondoo kwa wingi; kwa maana kulikuwa na furaha katika Israeli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka Isakari, Zabuloni na Naftali.” Maneno haya yanaonyesha mpaka wa kijiografia wa watu waliokuwa wakileta mahitaji.
    reason: alternative_reading
  - marker: b
    text: Neno la Kiebrania לֶחֶם kwa kawaida humaanisha “mkate,” lakini hapa linatanguliza orodha pana ya vyakula; kwa hiyo limetafsiriwa “chakula.”
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania צִמּוּקִים linaweza kumaanisha “zabibu kavu” au zabibu kavu zilizoshindiliwa kuwa mikate.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Pia
  rationale: Inaendeleza na kuongeza taarifa ya mstari uliotangulia kwa Kiswahili cha kawaida.
- source_word: הַקְּרֹבִים אֲלֵיהֶם
  choice: watu waliokuwa karibu nao
  rationale: Inahifadhi maana ya moja kwa moja ya watu waliokuwa karibu nao bila kuwalazimisha kuwa majirani waliokaa karibu tu.
- source_word: עַד יִשָׂשכָר וּזְבֻלוּן וְנַפְתָּלִי
  choice: hata kufikia Isakari, Zabuloni na Naftali
  rationale: Neno עַד linaonyesha kiwango au mpaka wa kijiografia; tafsiri hii pia inaacha wazi uhusiano kamili wa makabila hayo na watu waliokuwa karibu.
- source_word: מְבִיאִים
  choice: walikuwa wakileta
  rationale: Umbo la kitenzi ni participle na katika simulizi linaonyesha tendo lililoendelea au kurudiwa.
- source_word: לֶחֶם
  choice: chakula
  rationale: Ingawa kwa kawaida humaanisha mkate, hapa linaanzisha orodha pana ya vyakula na mahitaji.
- source_word: בַּחֲמוֹרִים וּבַגְּמַלִּים וּבַפְּרָדִים וּבַבָּקָר
  choice: kilichopakiwa juu ya punda, ngamia, nyumbu na ng’ombe
  rationale: Kihusishi ב kinaonyesha njia ya usafirishaji. Tafsiri inataja wanyama wenyewe, bila kuingiza magari ya kukokotwa ambayo hayatajwi katika Kiebrania.
- source_word: מַאֲכָל
  choice: orodha inayofuata baada ya nukta mbili
  rationale: Neno lina maana ya chakula au mahitaji ya chakula; katika Kiswahili orodha inaunganishwa kwa kawaida baada ya kutaja chakula tayari, hivyo halijarudiwa kwa namna nzito.
- source_word: קֶמַח
  choice: unga
  rationale: Ni neno la kawaida la Kiswahili kwa nafaka iliyosagwa inayotajwa hapa.
- source_word: דְּבֵלִים
  choice: mikate ya tini
  rationale: Hurejelea tini zilizoshindiliwa pamoja ili zihifadhiwe na kusafirishwa; ‘mikate ya tini’ ni wazi na ya kawaida.
- source_word: צִמּוּקִים
  choice: zabibu kavu
  rationale: Maana ya msingi ni zabibu zilizokaushwa; tafsiri hii haiongezi kwa uhakika umbo la mikate ambalo linawezekana lakini haliko wazi kabisa.
- source_word: יַיִן
  choice: divai
  rationale: Ni tafsiri sanifu na ya moja kwa moja.
- source_word: שֶׁמֶן
  choice: mafuta
  rationale: Kiebrania hakisemi wazi kuwa ni mafuta ya zeituni, kwa hiyo neno la jumla limehifadhiwa.
- source_word: לָרֹב
  choice: kwa wingi
  rationale: Inaonyesha kiasi kikubwa cha ng’ombe na kondoo waliotolewa.
- source_word: כִּי שִׂמְחָה בְּיִשְׂרָאֵל
  choice: kwa maana kulikuwa na furaha katika Israeli
  rationale: Inahifadhi sababu iliyotolewa na muundo wa sentensi ya Kiebrania kwa Kiswahili cha kawaida.
