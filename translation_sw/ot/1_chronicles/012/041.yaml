translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili. Muundo wa ‘kilichopakiwa juu ya’ unaweka wazi usafirishaji bila kubadili ng’ombe kuwa magari ya kukokotwa.
