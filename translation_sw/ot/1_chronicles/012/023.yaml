base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/023.yaml
  text: For day by day they came to David to help him[a], until there was a great camp, like the camp of God.
translation:
  language: sw
  text: Kwa maana siku baada ya siku walimjia Daudi ili kumsaidia, mpaka ikawa kambi kubwa, kama kambi ya Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama kambi ya kimungu” au “kama kambi ya mbinguni.” Kiebrania kinaacha usemi huu ukiwa mfupi na wenye kuamsha taswira.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kinaunganisha kauli hii na simulizi linalotangulia kwa kutoa maelezo; ‘Kwa maana’ linafaa kuliko kauli yenye mkazo zaidi.
- source_word: לְעֶת יוֹם בְּיוֹם
  choice: siku baada ya siku
  rationale: Nahau hii inaonyesha tendo lililorudiwa kwa mfululizo wa siku; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: יָבֹאוּ
  choice: walimjia
  rationale: Kauli isiyotimilika hapa inaeleza tendo lililorudiwa wakati uliopita; kiambishi cha mahali -ji- kinaonyesha kwamba walikwenda kwa Daudi.
- source_word: עַל דָּוִיד
  choice: Daudi
  rationale: Pamoja na kitenzi cha kuja na kusudi la kumsaidia, kihusishi kinaonyesha kuelekea kwa Daudi, si uadui dhidi yake; maana hiyo imebebwa na ‘walimjia Daudi.’
- source_word: לְעָזְרוֹ
  choice: ili kumsaidia
  rationale: Kitenzi-jina chenye kiambishi cha nafsi kinaonyesha kusudi; ‘ili kumsaidia’ ni wazi na cha kawaida.
- source_word: עַד
  choice: mpaka kukawa na
  rationale: Kinaonyesha matokeo au kiwango kilichofikiwa kutokana na watu kuendelea kuwasili; muundo huu unakamilisha sentensi kwa Kiswahili bila kubadili maana.
- source_word: לְמַחֲנֶה גָדוֹל
  choice: kambi kubwa
  rationale: מַחֲנֶה ni kambi, mara nyingi ya kijeshi; ‘kambi’ inadumisha taswira ya Kiebrania na ‘kubwa’ inatafsiri גָדוֹל moja kwa moja.
- source_word: כְּמַחֲנֵה אֱלֹהִים
  choice: kama kambi ya Mungu
  rationale: Tashbihi na muundo wa Kiebrania vimedumishwa, bila kuamua kimya-kimya kama usemi huo unamaanisha ukubwa, utukufu, au jeshi la mbinguni.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika tashbihi כְּמַחֲנֵה אֱלֹהִים
  choice: Mungu
  alternative: ya kimungu au ya mbinguni
  rationale: ‘Kambi ya Mungu’ ndiyo maana ya moja kwa moja na inadumisha uzito na utata wa usemi wa Kiebrania badala ya kuugeuza kuwa kivumishi kinachoamua maana yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Walimjia’ huepuka kuongeza nomino kama ‘watu’ ambayo haijaandikwa wazi katika Kiebrania. Alama ya tanbihi imewekwa baada ya usemi unaohusika.
