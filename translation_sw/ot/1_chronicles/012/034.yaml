  text: מִ/זְּבֻל֞וּן יוֹצְאֵ֣י צָבָ֗א עֹרְכֵ֧י מִלְחָמָ֛ה בְּ/כָל כְּלֵ֥י מִלְחָמָ֖ה חֲמִשִּׁ֣ים אָ֑לֶף וְ/לַ/עֲדֹ֖ר בְּ/לֹא לֵ֥ב וָ/לֵֽב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/034.yaml
  text: From Zebulun[a], fifty thousand men fit for military service, prepared for battle with every kind of weapon of war[b], to help without a divided heart.
translation:
  language: sw
  text: Kutoka Zabuloni, watu elfu hamsini waliokuwa tayari kwa utumishi wa kijeshi, waliojipanga kwa vita wakiwa na vifaa vyote vya vita, ili kusaidia[a] kwa moyo usiogawanyika.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ili kujiunga katika safu” au “ili kuunga mkono.” Kitenzi cha Kiebrania kilichotumiwa hapa ni adimu, na maana yake kamili si hakika.
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “bila moyo na moyo,” nahau ya Kiebrania inayomaanisha bila uaminifu uliogawanyika au nia mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְּבֻלוּן
  choice: Kutoka Zabuloni
  rationale: Kihusishi מִ־ kinaonyesha asili ya kikosi; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: יוֹצְאֵי צָבָא
  choice: watu ... waliofaa kwa utumishi wa jeshi
  rationale: Kirai hiki ni nahau ya kijeshi inayowataja waliostahili au waliokuwa tayari kufanya utumishi wa jeshi, si tu watu waliokuwa wakitoka kwenda vitani.
- source_word: עֹרְכֵי מִלְחָמָה
  choice: wakiwa tayari kwa vita
  rationale: Kitenzi ערך katika muktadha wa vita huhusu kupanga safu za mapigano au kuwa tayari kupigana; usemi huu ni wa asili na unaeleweka kwa urahisi.
- source_word: בְּכָל כְּלֵי מִלְחָמָה
  choice: kwa kila aina ya silaha za vita
  rationale: כְּלֵי מִלְחָמָה ni vifaa au silaha za kijeshi; ‘kila aina’ huwasilisha wazo la בְּכָל bila kudai kwamba kila mtu alikuwa na kila silaha.
- source_word: חֲמִשִּׁים אָלֶף
  choice: elfu hamsini
  rationale: Hii ni tafsiri ya moja kwa moja ya idadi.
- source_word: וְלַעֲדֹר
  choice: ili kusaidia
  rationale: Maana ya kitenzi hiki adimu katika mstari huu haijathibitika kikamilifu; katika muktadha kinaelekea kumaanisha kujiunga katika safu au kutoa msaada. ‘Kusaidia’ hudumisha maana ya jumla bila kubainisha kupita kiasi.
- source_word: בְּלֹא לֵב וָלֵב
  choice: kwa moyo usiogawanyika
  rationale: Nahau hiyo, kihalisi ‘bila moyo na moyo,’ inaonyesha uaminifu usiogawanyika au kutokuwa na nia mbili; tafsiri hii inadumisha taswira ya moyo.
theological_decisions:
- issue: Lengo mahususi la msaada
  choice: Kutoingiza jina la Daudi ndani ya mstari
  alternative: ‘ili kumsaidia Daudi’
  rationale: Muktadha mpana unaonyesha kuwa walikuja kumuunga mkono Daudi, lakini jina lake halipo katika maandishi ya mstari huu; kutolitaja kunahifadhi umbo na kiwango cha ubainifu cha Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kijeshi umehifadhiwa bila kutumia istilahi nzito zisizo za lazima; utata halisi wa וְלַעֲדֹר umeonyeshwa katika tanbihi.
