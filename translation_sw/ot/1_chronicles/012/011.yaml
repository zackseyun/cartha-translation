lexical_decisions:
- source_word: מִשְׁמַנָּה
  choice: Mishmana
  rationale: Jina la mtu limetoholewa kwa tahajia inayolingana na matamshi ya Kiswahili; konsonanti iliyosisitizwa katika Kiebrania haihitaji kuandikwa mara mbili kwa Kiswahili.
- source_word: הָרְבִיעִי
  choice: wa nne
  rationale: Namba ya mpangilio yenye kibainishi inaonyesha nafasi yake katika orodha; ‘wa nne’ ndiyo namna ya kawaida na wazi katika Kiswahili.
- source_word: יִרְמְיָה
  choice: Yeremia
  rationale: Jina la mtu limetolewa kwa umbo la kawaida la kibiblia linalotambulika kwa urahisi katika Kiswahili.
- source_word: הַחֲמִשִׁי
  choice: wa tano
  rationale: Namba ya mpangilio inaonyesha nafasi inayofuata katika orodha; ‘wa tano’ huhifadhi muundo huo kwa Kiswahili cha kawaida.
