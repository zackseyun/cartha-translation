  text: and Ishmaiah the Gibeonite[b][a], a mighty man among the Thirty and over the Thirty.
translation:
  language: sw
  text: na Ishmaya, Mgibeoni, shujaa miongoni mwa wale Thelathini[a], na juu ya wale Thelathini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mmoja wa wale Thelathini”; kihusishi cha Kiebrania kinaweza kuonyesha uanachama katika kikundi hiki cha mashujaa.
    reason: lexical_alternative
  - marker: b
    text: Kauli ya Kiebrania ni “juu ya wale Thelathini”; inaweza kuonyesha uongozi au cheo cha juu kuhusiana na kikundi hicho.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/יִֽשְׁמַֽעְיָ֧ה
  choice: na Ishmaya
  rationale: Kiunganishi וְ kinaendeleza orodha, na jina la Kiebrania limetoholewa kwa namna inayosomeka kwa Kiswahili.
- source_word: הַ/גִּבְעוֹנִ֛י
  choice: Mgibeoni
  rationale: Jina hili la uhusiano hutambulisha asili au ushirika wake na Gibeoni; umbo la Kiswahili ni fupi na la kawaida.
- source_word: גִּבּ֥וֹר
  choice: shujaa
  rationale: Katika muktadha huu wa kijeshi, neno linamaanisha mtu hodari au mpiganaji mahiri; “shujaa” ni la asili na lenye hadhi kwa Kiswahili.
- source_word: בַּ/שְּׁלֹשִׁ֖ים
  choice: miongoni mwa wale Thelathini
  rationale: בְּ hapa kwa kawaida huonyesha kuwa alikuwa mwanachama wa kikundi maalumu kilichoitwa “wale Thelathini,” huku tanbihi ikihifadhi uwezekano wa tafsiri ya “wa wale Thelathini.”
- source_word: וְ/עַל הַ/שְּׁלֹשִֽׁים
  choice: naye alikuwa mkuu wao
  rationale: עַל katika muktadha huu huonyesha mamlaka au cheo juu ya wale Thelathini. Kiswahili hiki cha kawaida kinaweka wazi uhusiano huo bila kuongeza wadhifa maalumu usiotajwa.
