  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wale Thelathini” limetumiwa kama jina la kikundi maalumu cha mashujaa. Mpangilio wa alama za tanbihi umewekwa katika mtiririko wa kawaida wa maandishi, na kila alama ipo katika matini kuu.
