base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/021.yaml
  text: 'As he went to Ziklag[a], some from Manasseh defected to him: Adnah, Jozabad, Jediael, Michael, another Jozabad, Elihu, and Zillethai[c][b], chiefs of the thousands that belonged to Manasseh.'
translation:
  language: sw
  text: 'Alipokuwa akienda Siklagi, watu wa Manase walihamia upande wake[a]: Adna, Yozabadi, Yediaeli, Mikaeli, Yozabadi mwingine[b], Elihu, na Siletai. Hao walikuwa viongozi wa maelfu ya Manase[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa neno halisi, “walianguka kwake”; hii ni nahau inayomaanisha kwamba walihamia upande wa Daudi.
    reason: lexical_alternative
  - marker: b
    text: Jina Yozabadi linatajwa mara mbili katika orodha ya Kiebrania, likimaanisha watu wawili tofauti wenye jina moja.
    reason: cultural_note
  - marker: c
    text: “Viongozi wa maelfu” huenda ikamaanisha makamanda wa vikosi vya kijeshi au viongozi wa migawanyo ya koo za Manase.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתּוֹ אֶל צִיקְלַג
  choice: Alipokuwa akienda Siklagi
  rationale: Muundo wa ב pamoja na kitenzi-jina una maana ya wakati; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha hali ya tendo lililokuwa likiendelea. אֶל huonyesha mwendo kuelekea mahali lengwa.
- source_word: נָפְלוּ עָלָיו
  choice: walijiunga naye
  rationale: Hii ni nahau ya kijeshi na kisiasa yenye maana ya kuhamia upande wa mtu. ‘Walijiunga naye’ ni ya asili na wazi katika Kiswahili; tanbihi inadumisha taswira halisi ya Kiebrania na uwezekano wa kubadili utii.
- source_word: מִמְּנַשֶּׁה
  choice: baadhi ya watu kutoka Manase
  rationale: Kihusishi kinataja asili yao katika kabila la Manase. ‘Baadhi ya watu’ huweka wazi kwamba wanaofuata ni watu kadhaa kutoka kundi hilo bila kudai kwamba maandishi yametaja kabila zima.
- source_word: עַדְנַח וְיוֹזָבָד וִידִיעֲאֵל וּמִיכָאֵל וְיוֹזָבָד וֶאֱלִיהוּא וְצִלְּתָי
  choice: Adna, Yozabadi, Yediaeli, Mikaeli, Yozabadi mwingine, Elihu na Siletai
  rationale: Majina yameandikwa kwa mfumo unaosomeka katika Kiswahili. Neno ‘mwingine’ linafafanua kwamba maandishi yanataja watu wawili tofauti wenye jina Yozabadi, bila kubadili orodha ya Kiebrania.
- source_word: רָאשֵׁי הָאֲלָפִים אֲשֶׁר לִמְנַשֶּׁה
  choice: viongozi wa maelfu ya Manase
  rationale: רָאשֵׁי ni viongozi au wakuu, na אֲלָפִים inaweza kumaanisha vikosi vya elfu au migawanyo ya koo. ‘Viongozi wa maelfu’ huhifadhi usemi wa Kiebrania na kutouamua zaidi ya maandishi.
