base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/039.yaml
  text: All these were men of war[a], arrayed for battle, who came to Hebron with a whole heart to make David king over all Israel; and also all the rest of Israel were of one heart to make David king.
translation:
  language: sw
  text: Watu hawa wote walikuwa wapiganaji, waliopangwa katika safu za vita; walikuja Hebroni kwa moyo wote ili kumweka Daudi kuwa mfalme juu ya Israeli yote. Pia, watu wengine wote wa Israeli[a] walikuwa na moyo mmoja wa kumweka Daudi kuwa mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mabaki yote ya Israeli.” Katika muktadha huu, inaelekea maana ni watu wengine wote wa Israeli, si “mabaki” kwa maana yake maalumu ya kinabii na kiteolojia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: wapiganaji
  rationale: Kirai hiki kihalisi ni ‘watu wa vita.’ ‘Wapiganaji’ ni Kiswahili cha kawaida kinachohifadhi maana ya wanaume wenye jukumu la kijeshi bila kutumia kirai kisicho cha kawaida ‘watu wa vita.’
- source_word: עֹדְרֵי מַעֲרָכָה
  choice: waliojiweka katika safu za vita
  rationale: Kirai cha Kiebrania kinaonyesha kupanga au kuunda safu ya mapigano. Tafsiri hii inahifadhi wazo la mpangilio wa kijeshi badala ya kulirahisisha kuwa ‘waliokuwa tayari kwa vita.’
- source_word: בְּלֵבָב שָׁלֵם
  choice: kwa moyo wote
  rationale: Hueleza nia kamili na isiyogawanyika. Usemi huu ni wa asili katika Kiswahili, unahifadhi taswira ya moyo, na huepuka maana ya ukamilifu wa kimaadili ambayo ‘moyo mkamilifu’ ingeweza kudokeza.
- source_word: בָּאוּ חֶבְרוֹנָה
  choice: Walikuja Hebroni
  rationale: Kiambishi cha mwelekeo katika jina la Hebroni kinaonyesha kwenda kuelekea mahali hapo; ‘walikuja Hebroni’ ni usemi wa kawaida katika muktadha huu wa simulizi.
- source_word: לְהַמְלִיךְ אֶת דָּוִיד
  choice: kumweka Daudi kuwa mfalme
  rationale: Hiphil ya מלך hapa ina maana ya kumsababisha mtu atawale au kumtawaza katika nafasi ya ufalme. ‘Kumweka ... kuwa mfalme’ ni wazi na haiingizi sherehe maalumu ya taji ambayo haikutajwa.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: juu ya Israeli yote
  rationale: Huhifadhi kwa ufupi uhusiano wa utawala wa kifalme juu ya taifa lote.
- source_word: כָּל שֵׁרִית יִשְׂרָאֵל
  choice: watu wengine wote wa Israeli
  rationale: Ingawa שֵׁרִית linaweza kumaanisha ‘mabaki,’ hapa linarejelea sehemu nyingine ya taifa ambayo haikuhesabiwa katika makundi yaliyotangulia. ‘Watu wengine wote’ ni wazi katika simulizi na haileti bila sababu maana ya kiteolojia ya ‘mabaki.’
- source_word: לֵב אֶחָד
  choice: moyo mmoja
  rationale: Tafsiri hii inahifadhi taswira halisi ya moyo na maana ya umoja wa nia, badala ya kuibadili kuwa taswira ya akili.
theological_decisions:
- issue: Maana inayowezekana ya kiteolojia ya שֵׁרִית (‘mabaki’)
  choice: watu wengine wote wa Israeli
  alternative: mabaki yote ya Israeli
  rationale: Katika muktadha huu wa muhtasari wa uungaji mkono wa taifa kwa Daudi, neno hilo linaonyesha wengine wa taifa ambao hawakuwa katika orodha iliyotangulia. Hivyo tafsiri kuu haipaswi kuingiza dhana maalumu ya kinabii ya ‘mabaki,’ lakini uwezekano wa kileksika umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimegawanywa kwa usomaji rahisi, huku urudiaji wa kumweka Daudi kuwa mfalme na taswira sambamba za ‘moyo wote’ na ‘moyo mmoja’ zikihifadhiwa.
