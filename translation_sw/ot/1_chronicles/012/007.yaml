  register: Lugha ni fupi na yenye hadhi, kama inavyofaa orodha ya majina. Majina yametoholewa kutoka Kiebrania kwa tahajia inayotamkika kwa urahisi katika Kiswahili cha Afrika Mashariki. Alama ya tanbihi imewekwa baada ya “Wakora,” neno ambalo tanbihi inalifafanua.
