lexical_decisions:
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili, kwa kuondoa h ya mwisho isiyotamkwa kama konsonanti tofauti.
- source_word: יִשִּׁיָּהוּ
  choice: Ishia
  rationale: Jina la mtu limetoholewa kwa umbo linalosomeka kwa urahisi katika Kiswahili huku likifuata matamshi ya Kiebrania kwa ukaribu unaofaa.
- source_word: עֲזַרְאֵל
  choice: Azareli
  rationale: Jina limetoholewa kwa Kiswahili; irabu ya mwisho imeongezwa ili kuepuka kumalizia kwa konsonanti na kuwezesha matamshi ya kawaida.
- source_word: יוֹעֶזֶר
  choice: Yoezeri
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania; mwanzo Yo- umeandikwa kwa Y badala ya kufuata desturi ya Kiingereza ya Jo-.
- source_word: יָשָׁבְעָם
  choice: Yashobeamu
  rationale: Jina limetoholewa kutoka umbo lililo katika mstari huu, bila kulibadilisha kwa umbo tofauti la jina linalopatikana mahali pengine.
- source_word: הַקָּרְחִים
  choice: Wakora
  rationale: Ni jina la wingi la ukoo au kundi linalotokana na Kora; kiambishi Wa- ni namna ya asili ya Kiswahili ya kutaja watu wa kundi hilo.
