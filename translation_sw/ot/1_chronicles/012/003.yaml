translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini cha sasa. Majina yametoholewa kwa mfumo wa Kiswahili, na vivumishi vya mahali vimefafanuliwa kwa usemi wa kawaida “mtu wa ...”. Alama za tanbihi zimewekwa moja kwa moja baada ya majina yanayohusika, kwa kuwa katika safu ya Kiingereza zilionekana kuambatanishwa na maneno yasiyolingana na maelezo yake.
