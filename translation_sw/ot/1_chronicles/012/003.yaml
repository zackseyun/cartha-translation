base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/003.yaml
  text: The chief was Ahiezer[a], then Joash, the sons of Shemaah the Gibeathite; and Jeziel and Pelet, the sons of Azmaveth[b]; and Beracah and Jehu the Anathothite.
translation:
  language: sw
  text: Mkuu wao alikuwa Ahiezeri, kisha Yoashi—wana wa Shemaa, mtu wa Gibea; pia Yezieli[a] na Peleti, wana wa Azmawethi; na Baraka[b] na Yehu, mtu wa Anathothi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili linaweza pia kutoholewa kuwa “Izieli.”
    reason: lexical_alternative
  - marker: b
    text: Jina “Baraka” pia huandikwa “Beraka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: Mkuu wao alikuwa
  rationale: Katika orodha hii רֹאשׁ humaanisha kiongozi au mkuu, si kichwa halisi. Kitenzi “alikuwa” na kiwakilishi “wao” vinafanya kishazi kisicho na kitenzi katika Kiebrania kiwe cha kawaida na wazi kwa Kiswahili.
- source_word: אֲחִיעֶזֶר
  choice: Ahiezeri
  rationale: Jina la mtu limetoholewa kwa namna inayofaa matamshi na tahajia ya Kiswahili.
- source_word: וְיוֹאָשׁ
  choice: kisha Yoashi
  rationale: Kiunganishi cha Kiebrania kimsingi ni “na”; hapa “kisha” kinaonyesha mfuatano wa majina baada ya kumtaja mkuu bila kubadili uhusiano wa Yoashi na Shemaa.
- source_word: בְּנֵי הַשְּׁמָעָה
  choice: wana wa Shemaa
  rationale: בְּנֵי ni usemi wa kawaida wa nasaba, “wana wa”; הַשְּׁמָעָה imechukuliwa kuwa jina la mtu, Shemaa.
- source_word: הַגִּבְעָתִי
  choice: mtu wa Gibea
  rationale: Kivumishi hiki huonyesha kwamba Shemaa alitoka Gibea. Usemi “mtu wa Gibea” ni wa asili na unaoeleweka zaidi katika Kiswahili cha sasa kuliko kuunda jina la kikabila lisilozoeleka.
- source_word: ויזואל
  choice: Yezieli
  rationale: Jina hili limetoholewa kuwa “Yezieli,” umbo linalotambulika katika mapokeo ya majina ya Biblia; uwezekano wa “Izieli” umehifadhiwa katika tanbihi.
- source_word: וָפֶלֶט
  choice: na Peleti
  rationale: Jina la mtu limetoholewa moja kwa moja bila kuongeza maana ya kietimolojia.
- source_word: בְּנֵי עַזְמָוֶת
  choice: wana wa Azmawethi
  rationale: Muundo wa nasaba umetafsiriwa kwa “wana wa,” na jina limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: וּבְרָכָה
  choice: na Baraka
  rationale: Jina בְרָכָה limetoholewa kwa umbo la Kiswahili “Baraka”; tahajia “Beraka” imetajwa katika tanbihi ili kutofautisha jina hili na neno la kawaida kwa msomaji.
- source_word: וְיֵהוּא
  choice: na Yehu
  rationale: Jina la mtu limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: הָעֲנְּתֹתִי
  choice: mtu wa Anathothi
  rationale: Kivumishi hiki huonyesha asili ya Yehu kutoka Anathothi. Usemi wazi “mtu wa Anathothi” ni wa sasa na unaeleweka kwa urahisi.
