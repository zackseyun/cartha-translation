base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/020.yaml
  text: Some from Manasseh also defected to David when he came with the Philistines against Saul for battle[a], though they did not help them, because the lords of the Philistines, after taking counsel, sent him away, saying[b], “He may defect to his master Saul at the cost of our heads.”
translation:
  language: sw
  text: Baadhi ya watu wa Manase pia walihamia upande wa Daudi[a] alipokuja pamoja na Wafilisti kupigana na Sauli. Hata hivyo, hawakuwasaidia, kwa sababu wakuu wa Wafilisti, baada ya kushauriana, walimwondoa, wakisema, “Huenda akahamia upande wa bwana wake Sauli kwa gharama ya vichwa vyetu.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi “walianguka kwa Daudi”; hii ni nahau yenye maana ya kuhamia au kujiunga na upande wake.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi “kwa vichwa vyetu,” yaani kwa gharama ya maisha yetu au kwa maangamizi yetu wenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמְּנַשֶּׁה
  choice: Baadhi ya watu wa Manase pia
  rationale: Kihusishi מן kina maana ya sehemu ya kundi, ingawa neno ‘baadhi’ halijaandikwa wazi; muktadha wa mstari unaofuata unaonyesha kuwa ni watu fulani wa Manase. ‘Pia’ linabeba nguvu ya kiunganishi וּ.
- source_word: נָפְלוּ עַל דָּוִיד
  choice: walihamia upande wa Daudi
  rationale: Hii ni nahau ya kijeshi na kisiasa yenye maana ya kujiunga na upande wa mtu, si kuanguka kihalisi. Kauli hii pia inalingana na hofu ya Wafilisti kwamba Daudi angehamia tena upande wa Sauli.
- source_word: בְּבֹאוֹ עִם פְּלִשְׁתִּים עַל שָׁאוּל לַמִּלְחָמָה
  choice: alipokuja pamoja na Wafilisti kupigana na Sauli
  rationale: בְּ pamoja na kitenzi-jina huonyesha wakati; עִם huonyesha ushirika, עַל uelekeo wa uadui, na לַמִּלְחָמָה kusudi la kwenda vitani.
- source_word: וְלֹא עֲזָרֻם
  choice: Hata hivyo, hawakuwasaidia
  rationale: Kiwakilishi cha Kiebrania ni cha wingi na kinaachwa bila kutaja wazi waliolengwa. Kiswahili ‘hawakuwasaidia’ kinahifadhi kutotajwa huko; muktadha unaelekeza kwa Wafilisti.
- source_word: כִּי בְעֵצָה
  choice: kwa sababu ... baada ya kushauriana
  rationale: בְעֵצָה hueleza shauri au mashauriano; muundo huu wa Kiswahili unaonyesha kwamba uamuzi wa kumrudisha ulifanywa baada ya kushauriana.
- source_word: שִׁלְּחֻהוּ
  choice: walimrudisha
  rationale: Katika muktadha huu piel ya שלח inamaanisha kumwondoa Daudi katika msafara na kumtuma arudi. ‘Walimrudisha’ ni usemi wa kawaida unaofaa tukio hilo.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: wakuu wa Wafilisti
  rationale: סַרְנֵי ni cheo maalumu cha watawala wa miji ya Wafilisti. ‘Wakuu’ huhifadhi hadhi ya uongozi bila kuwawekea kwa lazima cheo cha kijeshi.
- source_word: בְרָאשֵׁינוּ
  choice: kwa gharama ya vichwa vyetu
  rationale: Tafsiri hii inahifadhi picha halisi ya ‘vichwa vyetu’ huku ‘kwa gharama ya’ ikionyesha hatari ya kupoteza maisha.
- source_word: יִפּוֹל אֶל אֲדֹנָיו שָׁאוּל
  choice: Huenda akahamia upande wa bwana wake Sauli
  rationale: נפל אל hapa ni nahau ya kuhamia upande mwingine. Kitenzi cha hali ya uwezekano ‘huenda’ kinaonyesha hofu iliyo katika kauli, na ‘bwana wake’ huhifadhi uhusiano wa kisiasa na kiutumishi bila kuupa maana ya kiungu.
