base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/001.yaml
  text: These are the men who came to David at Ziklag while he was still kept back because of Saul son of Kish[a]; and they were among the mighty warriors[b], helpers in war.
translation:
  language: sw
  text: Hawa ndio waliomjia Daudi huko Siklagi, alipokuwa bado amezuiliwa kwa sababu ya Sauli mwana wa Kishi[a]; nao walikuwa miongoni mwa wapiganaji mashujaa[b], wasaidizi vitani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “amebanwa” au “amewekewa kizuizi” kwa sababu ya Sauli mwana wa Kishi.
    reason: lexical_alternative
  - marker: b
    text: Au “miongoni mwa mashujaa”; neno la Kiebrania gibbôrîm humaanisha wapiganaji hodari au mashujaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Hawa ndio
  rationale: Hutambulisha orodha mpya kwa Kiswahili cha kawaida; kiunganishi וְ hakihitaji kutafsiriwa kwa lazima kwa “na” mwanzoni.
- source_word: הַבָּאִים אֶל דָּוִיד לְצִיקְלַג
  choice: watu waliokuja kwa Daudi huko Siklagi
  rationale: Kirai tegemezi “waliokuja” huwakilisha nomino-kitenzi cha Kiebrania kwa ufasaha. “Kwa Daudi huko Siklagi” humtaja Daudi kama mtu waliyemjia na Siklagi kama mahali alipokuwa.
- source_word: עוֹד עָצוּר
  choice: alipokuwa bado amezuiliwa
  rationale: “Bado” huhifadhi hali iliyoendelea, na “amezuiliwa” huonyesha kuwa Daudi alikuwa chini ya kizuizi bila kudai kwamba alikuwa gerezani.
- source_word: מִפְּנֵי שָׁאוּל בֶּן קִישׁ
  choice: kwa sababu ya Sauli mwana wa Kishi
  rationale: מִפְּנֵי hapa hueleza sababu ya hali ya Daudi; tafsiri hii ni wazi na ya kawaida.
- source_word: בַּגִּבּוֹרִים
  choice: miongoni mwa mashujaa hodari
  rationale: גִּבּוֹרִים katika muktadha huu ni wapiganaji mashujaa; “mashujaa hodari” huhifadhi maana ya ushujaa na uwezo wa kivita.
- source_word: עֹזְרֵי הַמִּלְחָמָה
  choice: wasaidizi vitani
  rationale: Huhifadhi kwa ufupi jukumu lao la kumsaidia Daudi katika vita, huku ikisomeka kwa Kiswahili cha sasa.
