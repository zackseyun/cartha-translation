base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/033.yaml
  text: 'From the sons of Issachar[a], men who understood the times, to know what Israel should do: their chiefs were two hundred[b], and all their brothers were under their command.'
translation:
  language: sw
  text: Kutoka kwa wana wa Isakari, watu walioelewa nyakati[a], ili kujua Israeli ilipaswa kufanya nini—viongozi wao walikuwa mia mbili, na ndugu zao wote walikuwa chini ya amri yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wenye ufahamu wa nyakati”; Kiebrania kinakazia utambuzi uliofaa kwa hali ya wakati huo.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “ndugu zao wote walikuwa kwa kinywa chao,” nahau yenye maana ya kuwa chini ya maelekezo au amri yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי יִשָּׂשכָר
  choice: Nao kutoka kwa wana wa Isakari
  rationale: Huhifadhi wazo la asili au kundi linalotoka katika kabila la Isakari, huku kiunganishi וּ kikionyesha mwendelezo wa orodha.
- source_word: יֹדְעֵי בִינָה לָעִתִּים
  choice: watu waliozielewa nyakati
  rationale: Kishazi hiki kinaonyesha watu wenye ufahamu na utambuzi kuhusu hali ya wakati wao. Tafsiri hii ni ya kawaida katika Kiswahili na haibadili ‘nyakati’ kuwa ‘mazingira’ kwa njia ya kufasiri kupita kiasi.
- source_word: לָדַעַת מַה־יַּעֲשֶׂה יִשְׂרָאֵל
  choice: ili kujua Israeli ilipaswa kufanya nini
  rationale: לָדַעַת inaonyesha kusudi, na kitenzi cha Kiebrania katika muktadha huu kinaelekea kueleza hatua iliyofaa kuchukuliwa, si utabiri wa kile ambacho Israeli ingefanya.
- source_word: רָאשֵׁיהֶם מָאתַיִם
  choice: viongozi wao walikuwa mia mbili
  rationale: רָאשֵׁיהֶם humaanisha wakuu au viongozi. ‘Viongozi’ ni wazi na yenye hadhi katika Kiswahili cha sasa.
- source_word: וְכָל־אֲחֵיהֶם
  choice: na ndugu zao wote
  rationale: ‘Ndugu’ huhifadhi maana ya msingi ya אֲחֵיהֶם, huku muktadha ukionyesha kuwa ni watu wenzao wa kabila.
- source_word: עַל־פִּיהֶם
  choice: walikuwa chini ya amri yao
  rationale: Nahau hii, kwa neno halisi ‘juu ya kinywa chao,’ inaonyesha kuwa wengine walifuata uongozi au maagizo yao. ‘Chini ya amri yao’ hutoa maana hiyo kwa Kiswahili cha kawaida.
