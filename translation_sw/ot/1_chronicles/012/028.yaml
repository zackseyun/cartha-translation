lexical_decisions:
- source_word: וִ/יהוֹיָדָע
  choice: na Yehoyada
  rationale: Kiunganishi ו kimetafsiriwa “na” ili kuendeleza orodha, na jina limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: הַ/נָּגִיד
  choice: kiongozi
  rationale: Neno נָגִיד humaanisha kiongozi, mkuu, au mtawala; “kiongozi” linaeleweka kwa urahisi na halidokezi ufalme bila sababu.
- source_word: לְ/אַהֲרֹן
  choice: wa uzao wa Haruni
  rationale: Katika muktadha huu לְ linaonyesha uhusiano au uwakilishi. Nyongeza “uzao wa” inaweka wazi kwamba Yehoyada alikuwa kiongozi aliyehusishwa na jamaa ya kikuhani ya Haruni, si kiongozi wa Haruni binafsi.
- source_word: וְ/עִמּ/וֹ
  choice: pamoja naye
  rationale: Kirai hiki kinaonyesha kwamba idadi inayofuata ni ya wale walioandamana na Yehoyada.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּ/שְׁבַע מֵאוֹת
  choice: watu elfu tatu mia saba
  rationale: Idadi imehifadhiwa kamili; “watu” imeongezwa kwa uwazi wa kawaida wa Kiswahili kutokana na muktadha wa orodha ya watu.
