  text: They were there with David for three days[a], eating and drinking, because their brothers had prepared for them.
translation:
  language: sw
  text: 'Walikuwa huko pamoja na Daudi kwa siku tatu, wakila na kunywa, kwa sababu ndugu zao[a] walikuwa wamewaandalia.


    [a] Au “jamaa zao” au “watu wa ukoo wao.” Kiebrania kinasema kihalisi “ndugu zao,” lakini katika muktadha huu neno hilo linaweza kumaanisha kwa upana zaidi watu wa ukoo au wa kabila moja.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa zao” au “watu wa ukoo wao.” Kiebrania kinasema kihalisi “ndugu zao,” lakini katika muktadha huu neno hilo linaweza kumaanisha kwa upana zaidi watu wa ukoo au wa kabila moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ שָׁם
  choice: Walikuwa huko
  rationale: Kitenzi היה pamoja na kielezi שָׁם kinaonyesha kuwapo mahali hapo katika simulizi; “walikuwa huko” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: עִם דָּוִיד
  choice: pamoja na Daudi
  rationale: Kihusishi עִם kinaonyesha kuwa walikuwapo kwa kuandamana au kushirikiana na Daudi.
- source_word: יָמִים שְׁלוֹשָׁה
  choice: kwa siku tatu
  rationale: Kirai hiki kinaonyesha muda ambao walikuwapo huko; Kiswahili cha kawaida hutumia “kwa siku tatu.”
- source_word: אֹכְלִים וְשׁוֹתִים
  choice: wakila na kunywa
  rationale: Vivumishi-tendaji vya Kiebrania vinaonyesha shughuli zilizoendelea wakati wa kukaa kwao; tafsiri inahifadhi vitendo vyote badala ya kuvifupisha kuwa “wakifanya karamu.”
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי inaanzisha sababu ya wao kula na kunywa.
- source_word: הֵכִינוּ לָהֶם
  choice: walikuwa wamewaandalia
  rationale: Hiphil ya כון humaanisha kutayarisha au kuandaa. Wakati timilifu unaonyesha kwamba maandalizi yalikuwa yamefanywa kwa ajili yao; kitu kilichoandaliwa kinaachwa wazi kama katika Kiebrania.
- source_word: אֲחֵיהֶם
  choice: ndugu zao
  rationale: Hii ndiyo maana ya kihalisi ya neno la Kiebrania. Maana pana ya jamaa au watu wa ukoo/kabila imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya אֲחֵיהֶם katika mazingira ya ukoo na makabila
  choice: ndugu zao
  alternative: jamaa zao; watu wa ukoo wao
  rationale: Hakuna sababu ya kufuta neno mahususi la undugu katika matini kuu, lakini tanbihi inadumisha uwezekano kwamba linawahusu kwa upana washirika wa ukoo au kabila.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. Muundo “walikuwa wamewaandalia” unaacha kitu kilichoandaliwa bila kutajwa, kama chanzo cha Kiebrania, huku muktadha wa kula na kunywa ukiifanya maana ieleweke.
