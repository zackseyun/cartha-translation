base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/031.yaml
  text: And from the sons of Ephraim[a], twenty thousand eight hundred mighty men of valor, men of renown according to their fathers’ houses.
translation:
  language: sw
  text: Na kutoka kwa wana wa Efraimu, mashujaa hodari ishirini elfu na mia nane, watu mashuhuri[a] katika koo za baba zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu maarufu”; kihalisi, “watu wa majina,” nahau inayomaanisha watu wenye kujulikana au wenye sifa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Na kutoka kwa
  rationale: Kiunganishi na kihusishi vinaendeleza orodha ya makabila katika muktadha.
- source_word: בְּנֵי אֶפְרַיִם
  choice: wana wa Efraimu
  rationale: Huhifadhi sura ya usemi wa Kiebrania na maana yake ya watu au wazao wa kabila la Efraimu.
- source_word: עֶשְׂרִים אֶלֶף וּשְׁמוֹנֶה מֵאוֹת
  choice: ishirini elfu na mia nane
  rationale: Huwasilisha kwa usahihi idadi ya 20,800 kwa maneno ya kawaida ya Kiswahili.
- source_word: גִּבּוֹרֵי חַיִל
  choice: mashujaa hodari
  rationale: Usemi huu unaonyesha nguvu, ushujaa na uwezo wa kivita; tafsiri hii ni fupi na ya asili katika Kiswahili.
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: watu mashuhuri
  rationale: Usemi halisi ‘watu wa majina’ ni nahau inayomaanisha watu wanaojulikana au wenye sifa; ‘watu mashuhuri’ huwasilisha maana hiyo wazi.
- source_word: לְבֵית אֲבוֹתָם
  choice: katika koo za baba zao
  rationale: Hurejelea mpangilio au uhusiano wao katika jamaa za ukoo wa upande wa baba bila kuufanya usemi kuwa mzito.
