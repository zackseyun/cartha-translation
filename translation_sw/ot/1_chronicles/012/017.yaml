  text: And some of the sons of Benjamin and Judah came to the stronghold[b][a], to David.
translation:
  language: sw
  text: Baadhi ya watu wa makabila ya Benyamini na Yuda[a] wakamjia Daudi katika ngome[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu kutoka miongoni mwa Benyamini na Yuda.” Kiebrania kinaonyesha kwamba waliokuja walikuwa sehemu tu ya watu wa makabila hayo.
    reason: lexical_alternative
  - marker: b
    text: Au, “boma.” Neno la Kiebrania hurejelea mahali palipoimarishwa kwa ajili ya ulinzi au makimbilio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: wakaja
  rationale: Kitenzi hiki kinaendeleza simulizi na kueleza mwendo kuelekea mahali alipokuwa Daudi; “wakaja” ni usemi wa kawaida na unaofaa katika muktadha huu.
- source_word: מִן בְּנֵי בִנְיָמִן וִיהוּדָה
  choice: baadhi ya watu wa Benyamini na Yuda
  rationale: מִן lina maana ya sehemu ya kundi, hivyo “baadhi ya” huonyesha wazi kwamba si watu wote wa makabila hayo waliokuja. “Watu wa Benyamini na Yuda” ni Kiswahili cha sasa na cha asili kuliko kunakili moja kwa moja usemi wa kiukoo “wana wa.”
- source_word: עַד לַמְצָד
  choice: kwenye ngome
  rationale: Katika muktadha wa mwendo, עַד linaonyesha mwisho wa safari, nayo מְצָד ni mahali pa kukimbilia palipoimarishwa kwa ulinzi. “Kwenye ngome” ni tafsiri fupi na ya kawaida.
- source_word: לְדָוִיד
  choice: kwa Daudi
  rationale: Kihusishi kinaonyesha kwamba Daudi ndiye mtu waliyemwendea katika mahali hapo; “kwa Daudi” hudumisha maana hiyo kwa Kiswahili cha kawaida.
