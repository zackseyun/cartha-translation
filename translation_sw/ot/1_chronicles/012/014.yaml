lexical_decisions:
- source_word: יִרְמְיָהוּ
  choice: Yeremia
  rationale: Jina hili limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
- source_word: הָעֲשִׂירִי
  choice: wa kumi
  rationale: Kivumishi cha mpangilio chenye kibainishi kinamtaja Yeremia kuwa mtu wa kumi katika orodha; Kiswahili cha kawaida hutumia ‘wa kumi’.
- source_word: מַכְבַּנַּי
  choice: Makbanai
  rationale: Jina la mtu limenukuliwa kwa tahajia inayolingana kwa urahisi na konsonanti za Kiebrania na mfumo wa sauti wa Kiswahili.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: wa kumi na moja
  rationale: Kiebrania kina namba ya kuhesabu ‘kumi na moja,’ lakini katika muktadha huu wa orodha inafanya kazi kama namba ya mpangilio; hivyo Kiswahili cha asili ni ‘wa kumi na moja.’
