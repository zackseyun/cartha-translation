base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/032.yaml
  text: And from the half-tribe of Manasseh[a], eighteen thousand, who were designated by name, came to make David king.
translation:
  language: sw
  text: Na kutoka nusu ya kabila la Manase, watu elfu kumi na nane walioteuliwa kwa majina[a] ili waje kumweka Daudi kuwa mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliotajwa kwa majina,” yaani, kila mmoja alitambuliwa au kutajwa waziwazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: Na kutoka nusu ya kabila la Manase
  rationale: Muundo huu unawakilisha kiunganishi, kihusishi, na maana ya חֲצִי מַטֵּה kwa Kiswahili cha kawaida. Katika muktadha huu מַטֵּה humaanisha kabila, si fimbo wala tawi.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: watu elfu kumi na nane
  rationale: Nambari imetafsiriwa moja kwa moja; neno “watu” limewekwa wazi kwa sababu kifungu kinawahesabu watu na hivyo sentensi inasomeka kwa kawaida katika Kiswahili.
- source_word: אֲשֶׁר נִקְּבוּ בְּ/שֵׁמוֹת
  choice: walioteuliwa kwa majina
  rationale: Niphal ya נקב inaonyesha kwamba watu hao walitambuliwa au kuteuliwa waziwazi. “Kwa majina” inadumisha wazo la kila mmoja kutajwa binafsi bila kudai kwa lazima kwamba kulikuwa na orodha rasmi.
- source_word: לָ/בוֹא
  choice: kuja
  rationale: Infinitivu ya Kiebrania imehifadhiwa kama infinitivu ya kusudi, badala ya kuibadili kuwa kitenzi kikuu cha wakati uliopita.
- source_word: לְ/הַמְלִיךְ אֶת דָּוִיד
  choice: kumweka Daudi kuwa mfalme
  rationale: Hiphil ya מלך humaanisha kumfanya au kumweka mtu kuwa mfalme. Tafsiri hii ni ya kawaida na haibani maana kwenye tendo la sherehe ya kumvika taji pekee.
