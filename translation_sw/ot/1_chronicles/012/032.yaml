translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa infinitivu katika לָבוֹא umehifadhiwa ili kutoamua kimyakimya kwamba watu hao tayari walikuwa wamekuja, ilhali chanzo kinasema waliteuliwa kwa kusudi la kuja.
