lexical_decisions:
- source_word: יִרְמְיָה
  choice: Yeremia
  rationale: Jina la mtu limetolewa kwa umbo la Kiswahili lililozoeleka na linalotambulika kwa urahisi.
- source_word: יַחֲזִיאֵל
  choice: Yahazieli
  rationale: Jina la mtu limenakiliwa kwa sauti katika umbo la kawaida la Kiswahili, huku likidumisha sehemu ya mwanzo inayohusiana na jina la Mungu.
- source_word: יוֹחָנָן
  choice: Yohanani
  rationale: Jina la mtu limetolewa kwa umbo la Kiswahili linalofuata matamshi ya Kiebrania na matumizi yaliyozoeleka katika majina ya Biblia.
- source_word: יוֹזָבָד
  choice: Yozabadi
  rationale: Jina la mtu limenakiliwa kwa namna ya asili katika Kiswahili, pamoja na irabu ya mwisho inayorahisisha matamshi.
- source_word: הַגְּדֵרָתִי
  choice: Mgedera
  rationale: Nomino ya Kiswahili yenye kiambishi M- humtambulisha Yozabadi kwa uhusiano wake na Gedera, bila kulazimisha iwapo uhusiano huo ni wa mahali alikotoka au wa ukoo.
