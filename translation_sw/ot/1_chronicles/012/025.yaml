  yaml_path: translation/ot/1_chronicles/012/025.yaml
  text: From the sons of Judah[a], carrying shield and spear, there were 6,800 equipped for battle.
translation:
  language: sw
  text: Wana wa Yuda waliobeba ngao na mkuki walikuwa 6,800, waliojihami kwa vita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walio tayari kwenda vitani.” Kirai cha Kiebrania חֲלוּצֵי צָבָא kinaweza kumaanisha watu waliojihami au walioandaliwa kwa mapigano.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: Kutoka kwa wana wa Yuda
  rationale: Kirai hiki kinawatambulisha watu wa kabila la Yuda katika orodha ya vikosi. “Wana wa Yuda” kinahifadhi namna ya Kiebrania na maana ya ukoo wa kikabila.
- source_word: נֹשְׂאֵי
  choice: waliobeba
  rationale: Kitenzi hiki hapa kinaeleza askari waliokuwa wamebeba vifaa vya kijeshi; “waliobeba” ni cha kawaida na wazi katika Kiswahili cha sasa.
- source_word: צִנָּה
  choice: ngao
  rationale: Neno hili humaanisha ngao, mara nyingi ngao kubwa. “Ngao” linatoa maana kuu kwa lugha rahisi bila kuongeza ufafanuzi usiolazimu.
- source_word: וָרֹמַח
  choice: na mkuki
  rationale: רמח ni mkuki au fumo; “mkuki” ni neno la kawaida na linaloeleweka kwa urahisi.
- source_word: שֵׁשֶׁת אֲלָפִים וּשְׁמוֹנֶה מֵאוֹת
  choice: 6,800
  rationale: Hesabu ya Kiebrania ni elfu sita na mia nane. Tarakimu hurahisisha kusoma orodha hii ya kijeshi bila kubadili maana.
- source_word: חֲלוּצֵי צָבָא
  choice: wakiwa wamejihami kwa vita
  rationale: Katika muktadha wa kijeshi, kirai hiki hueleza watu waliowekewa au waliokuwa na vifaa tayari kwa mapigano. “Wamejihami kwa vita” ni cha asili katika Kiswahili na kinaendana na kutajwa kwa ngao na mkuki.
