  text: na Yoeela na Zebadia, wana wa Yerohamu kutoka Gedori.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יוֹעֵאלָה
  choice: na Yoela
  rationale: Kiunganishi וְ kimetafsiriwa “na,” na jina la mtu limetoholewa kwa tahajia ya kawaida na inayosomeka kwa Kiswahili.
- source_word: וּ/זְבַדְיָה
  choice: na Zebadia
  rationale: Kiunganishi וּ kimetafsiriwa “na.” Jina limetoholewa kuwa “Zebadia,” umbo linalofaa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii, umbo la wingi la בן linaeleweka kwa kawaida kuwa watoto wa kiume wa Yerohamu; “wana wa” ni fasiri ya moja kwa moja na yenye hadhi kwa Kiswahili.
- source_word: יְרֹחָם
  choice: Yerohamu
  rationale: Jina la mtu limetoholewa kutoka Kiebrania kwa namna inayosomeka kwa Kiswahili.
- source_word: מִן הַ/גְּדֽוֹר
  choice: kutoka Gedori
  rationale: מִן huonyesha asili au mahali walikotoka. גְּדוֹר limechukuliwa kuwa jina la mahali na kutoholewa “Gedori,” bila kutafsiri kiambishi cha Kiebrania kwa namna isiyo ya kawaida katika Kiswahili.
