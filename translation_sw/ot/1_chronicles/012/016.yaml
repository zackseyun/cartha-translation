  text: אֵ֣לֶּה הֵ֗ם אֲשֶׁ֨ר עָבְר֤וּ אֶת הַ/יַּרְדֵּן֙ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן וְ/ה֥וּא מְמַלֵּ֖א עַל כָּל גדיתי/ו וַ/יַּבְרִ֨יחוּ֙ אֶת כָּל הָ֣/עֲמָקִ֔ים לַ/מִּזְרָ֖ח וְ/לַֽ/מַּעֲרָֽב־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/016.yaml
  text: These are the men who crossed the Jordan in the first month[a], when it was overflowing all its banks, and they put to flight all those in the valleys, to the east and to the west.
translation:
  language: sw
  text: Hawa ndio watu waliouvuka Yordani katika mwezi wa kwanza, wakati mto huo ulipokuwa umefurika kingo zake zote. Wakawafanya wakimbie watu wote waliokuwa mabondeni[a], upande wa mashariki na wa magharibi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “mabonde yote”; maana yake ni watu waliokuwa mabondeni, kwa kuwa kitenzi humaanisha “kuwafanya wakimbie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הֵם
  choice: Hawa ndio watu
  rationale: Muundo huu unasisitiza utambulisho. Neno “watu” limewekwa wazi kutokana na muktadha wa wapiganaji wanaotajwa, na linafanya Kiswahili kiwe cha kawaida bila kubadili maana.
- source_word: אֲשֶׁר עָבְרוּ אֶת הַיַּרְדֵּן
  choice: waliouvuka Yordani
  rationale: Kitenzi עָבַר hapa kina maana ya kuvuka. Kiambishi cha yambwa “-u-” kinarejelea Mto Yordani unaotajwa kwa jina.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: katika mwezi wa kwanza
  rationale: Hii inafuata moja kwa moja usemi wa wakati katika Kiebrania, bila kuamua zaidi ni mwezi gani katika kalenda.
- source_word: וְהוּא מְמַלֵּא עַל כָּל גְּדִיתָיו
  choice: wakati mto huo ulipokuwa umefurika kingo zake zote
  rationale: Kiwakilishi kinarejelea Yordani. Muktadha unaonyesha hali ya mafuriko ambapo maji yalipita au kujaa juu ya kingo zote; “umefurika kingo zake zote” ni Kiswahili cha kawaida kinachohifadhi picha hiyo.
- source_word: וַיַּבְרִיחוּ
  choice: Wakawafanya wakimbie
  rationale: 'Hii ni kausativi ya ברח: waliwasababisha wengine wakimbie. Tafsiri hii inaonyesha wazi maana ya kisababishi bila kuongeza wazo la ushindi kamili.'
- source_word: אֶת כָּל הָעֲמָקִים
  choice: watu wote waliokuwa mabondeni
  rationale: Kiebrania kinasema kihalisi “mabonde yote,” lakini yambwa la kitenzi cha kuwafanya wakimbie lazima lieleweke kimetonimia kuwa watu waliokaa mabondeni. Ufafanuzi huo umewekwa katika maandishi na tafsiri halisi imeonyeshwa katika tanbihi.
- source_word: לַמִּזְרָח וְלַמַּעֲרָב
  choice: upande wa mashariki na wa magharibi
  rationale: Usemi huu unahifadhi mielekeo yote miwili kwa Kiswahili cha kawaida. Haulazimishi iwapo unaeleza mahali walipokuwa watu hao au mwelekeo walikofukuzwa.
