base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/009.yaml
  text: Some of the Gadites separated themselves to David at the stronghold in the wilderness[a], mighty warriors, men of the army for battle, able to handle shield and spear, whose faces were like the faces of lions[c][b], and who were as swift as gazelles on the mountains.
translation:
  language: sw
  text: Baadhi ya Wagadi walijitenga wakamwendea Daudi katika ngome iliyokuwa jangwani[a]. Walikuwa mashujaa hodari, wanajeshi walio tayari kwa vita, wenye ustadi wa kutumia ngao na mkuki[b]. Nyuso zao zilikuwa kama nyuso za simba, nao walikuwa wepesi kama swala milimani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuelekea kwenye ngome jangwani.” Muundo wa vihusishi katika Kiebrania unaweza kumaanisha kuelekea kwenye ngome au kufika humo.
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “wenye kupanga ngao na mkuki,” yaani watu waliokuwa tayari na wenye ustadi kwa mapigano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַגָּדִי
  choice: Baadhi ya Wagadi
  rationale: Kirai kinaonyesha kwamba watu hawa walitoka kabila la Gadi na walikuwa sehemu tu ya kabila hilo.
- source_word: נִבְדְּלוּ אֶל דָּוִיד
  choice: walijitenga na kujiunga na Daudi
  rationale: Kitenzi cha Kiebrania kinadumisha wazo la kujitenga, huku muktadha wa kuelekea kwa Daudi ukionyesha wazi kujiunga naye.
- source_word: לַמְצַד מִדְבָּרָה
  choice: katika ngome iliyokuwa jangwani
  rationale: מְצַד ni ngome; muundo wa vihusishi unaweza kueleweka kama kufika katika ngome au kuelekea huko, hivyo tofauti hiyo imewekwa katika tanbihi.
- source_word: גִּבֹּרֵי הַחַיִל
  choice: mashujaa hodari
  rationale: Hili ni tamko la kijeshi kwa wapiganaji wenye nguvu na uhodari; tafsiri hii ni ya asili na yenye hadhi katika Kiswahili cha sasa.
- source_word: אַנְשֵׁי צָבָא לַמִּלְחָמָה
  choice: wanajeshi walio tayari kwa vita
  rationale: Kirai kinawasilisha utambulisho na utayari wao wa kijeshi bila kuongeza wazo lisilo wazi la mafunzo rasmi.
- source_word: עֹרְכֵי צִנָּה וָרֹמַח
  choice: wenye ustadi wa kutumia ngao na mkuki
  rationale: Kihalisi ni kupanga au kuandaa ngao na mkuki; katika muktadha wa kijeshi humaanisha utayari na uwezo wa kutumia silaha hizo.
- source_word: וּפְנֵי אַרְיֵה פְּנֵיהֶם
  choice: Nyuso zao zilikuwa kama nyuso za simba
  rationale: Inahifadhi tashbihi na marudio ya neno 'nyuso' yaliyopo katika Kiebrania.
- source_word: וְכִצְבָאִים עַל הֶהָרִים לְמַהֵר
  choice: walikuwa wepesi kama swala milimani
  rationale: לְמַהֵר huweka wazi kwamba ulinganisho na swala unahusu kasi na wepesi wao katika eneo la milima.
