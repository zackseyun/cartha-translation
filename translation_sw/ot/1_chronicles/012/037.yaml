  text: And from Asher[a], forty thousand who went out for military service, to array themselves for battle.
translation:
  language: sw
  text: Na kutoka Asheri, watu elfu arobaini waliokwenda kwa utumishi wa kijeshi[a], ili wajipange katika safu za vita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu elfu arobaini walioweza kujipanga kwa vita.” Kiebrania kinaunganisha usemi unaomaanisha “kwenda kwa utumishi wa kijeshi” na kitenzi chenye maana ya kupanga vikosi katika safu za vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/אָשֵׁר
  choice: Na kutoka Asheri
  rationale: Kiunganishi וּ pamoja na kihusishi מֵ yametafsiriwa kwa kawaida kuwa “Na kutoka.” Asheri ni jina la kabila, hivyo halijapanuliwa kwa kuongeza “kabila la” bila ulazima.
- source_word: יוֹצְאֵי
  choice: waliotoka
  rationale: Kitenzi-partisipio kutoka יצא humaanisha kwenda au kutoka. “Waliotoka” kinahifadhi wazo hilo katika muktadha wa kijeshi bila kukifafanua kupita kiasi.
- source_word: צָבָא
  choice: kwa ajili ya utumishi wa kijeshi
  rationale: Neno hili linaweza kumaanisha jeshi, kikosi, au utumishi wa kijeshi. Katika muundo יוֹצְאֵי צָבָא, tafsiri hii inaeleza kwa Kiswahili cha kawaida kwamba walitoka kutekeleza wajibu wa kijeshi.
- source_word: לַ/עֲרֹךְ
  choice: ili wajipange
  rationale: Katika muktadha wa vita, ערך humaanisha kupanga au kuweka vikosi katika mpangilio wa mapambano. “Wajipange” ni ya kawaida na inadokeza kujipanga katika safu za vita.
- source_word: מִלְחָמָה
  choice: kwa vita
  rationale: Pamoja na ערך, nomino hii yenye maana ya vita au mapambano imewasilishwa kwa usemi wa kawaida “kujipanga kwa vita.”
- source_word: אַרְבָּעִים אָלֶף
  choice: watu elfu arobaini
  rationale: Idadi imetafsiriwa moja kwa moja; “watu” imeongezwa kwa uwazi wa kisarufi kwa sababu muktadha unahesabu wapiganaji.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa Kiebrania unaorudia mawazo mawili ya kijeshi umehifadhiwa, huku tanbihi ikionyesha uwezekano wa kuyachukulia pamoja kama maelezo ya uwezo wa kujipanga kwa vita.
