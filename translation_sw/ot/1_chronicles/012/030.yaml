base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/030.yaml
  text: And from the sons of Benjamin[a], Saul’s brothers, three thousand[b]; until then most of them had been keeping watch over the house of Saul.
translation:
  language: sw
  text: Na kutoka kwa wana wa Benyamini, ndugu wa Sauli[a], watu elfu tatu; mpaka wakati huo wengi wao walikuwa wakilinda nyumba ya Sauli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa wa Sauli.” Neno la Kiebrania linalotafsiriwa “ndugu” linaweza pia kumaanisha watu wa ukoo mpana, si ndugu wa tumbo moja tu.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya Sauli” inaweza kumaanisha kaya yake au, kwa upana zaidi, masilahi ya ukoo wake wa kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Na kutoka kwa
  rationale: Huhifadhi kiunganishi na kihusishi vinavyoendeleza orodha ya makabila yaliyomjia Daudi.
- source_word: בְּנֵי בִנְיָמִן
  choice: wana wa Benyamini
  rationale: Huhifadhi usemi wa Kiebrania wa ukoo na kabila kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: אֲחֵי שָׁאוּל
  choice: ndugu zake Sauli
  rationale: Neno la Kiebrania linaweza kumaanisha ndugu wa karibu au jamaa wa ukoo mpana; “ndugu” huhifadhi upana huo vizuri kuliko usemi unaodokeza kaka na wadogo wa tumbo moja pekee.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: watu elfu tatu
  rationale: Neno “watu” linaongezwa kwa uwazi wa Kiswahili katika orodha hii ya idadi bila kubadili maana.
- source_word: וְעַד הֵנָּה
  choice: mpaka wakati huo
  rationale: Katika simulizi hili usemi huo unaelekeza kwenye wakati wa tukio linalosimuliwa, si wakati wa msomaji.
- source_word: מַרְבִּיתָם
  choice: wengi wao
  rationale: Hutoa kwa lugha ya kawaida maana ya sehemu kubwa au walio wengi.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת
  choice: walikuwa wakilinda
  rationale: Huwasilisha tendo lililokuwa likiendelea la kuweka ulinzi, huku ikiepuka marudio yasiyo ya kawaida kama “kulinda ulinzi.”
- source_word: בֵּית שָׁאוּל
  choice: nyumba ya Sauli
  rationale: Huhifadhi upana wa “nyumba,” ambao unaweza kuhusisha kaya, ukoo wa kifalme, au masilahi ya nasaba ya Sauli.
theological_decisions:
- issue: Maana ya “nyumba ya Sauli”
  choice: Imeachwa kama “nyumba ya Sauli” katika matini kuu.
  alternative: kaya ya Sauli; nasaba ya Sauli; utawala wa Sauli
  rationale: Kuchagua mojawapo ya maana hizo kungelifinya kimakusudi usemi mpana wa Kiebrania; tanbihi inaonyesha uwezekano bila kuamua kupita ushahidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa orodha na taswira ya “nyumba” zimehifadhiwa, huku sentensi ikisomeka kwa urahisi kwa wasomaji wa kawaida.
