base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/024.yaml
  text: And these are the numbers of the heads of the armed troops for war[a], who came to David at Hebron to turn Saul’s kingdom over to him, according to the word of Yahweh.
translation:
  language: sw
  text: Na hizi ndizo hesabu za wakuu wa vikosi vilivyojihami kwa vita, waliokuja kwa Daudi huko Hebroni ili kuuhamisha ufalme wa Sauli kwake, sawasawa na neno la Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiebrania, kihalisi: “kama kinywa cha Yahweh,” nahau yenye maana ya “sawasawa na neno la Yahweh” au “kama Yahweh alivyosema.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפְּרֵי
  choice: hesabu za
  rationale: Wingi wa neno la Kiebrania unatanguliza orodha ya idadi za makundi mbalimbali; “hesabu za” ni ya asili katika muktadha huu.
- source_word: רָאשֵׁי
  choice: viongozi wa
  rationale: Ingawa maana ya msingi ni “vichwa vya,” hapa neno linamaanisha viongozi au wakuu wa vikosi; “viongozi” ni Kiswahili cha kawaida na wazi.
- source_word: הֶחָלוּץ לַצָּבָא
  choice: wale waliokuwa wamejihami kwa ajili ya vita
  rationale: Kirai kinaeleza watu waliokuwa na vifaa au silaha na tayari kwa huduma ya kijeshi, si askari kwa maana ya jumla tu.
- source_word: בָּאוּ עַל דָּוִיד
  choice: waliokuja kwa Daudi
  rationale: Katika muktadha huu, עַל pamoja na בוא inaonyesha kumwendea Daudi na kujiunga naye, wala si kumshambulia.
- source_word: חֶבְרוֹנָה
  choice: huko Hebroni
  rationale: He ya mwelekeo inaonyesha kwenda Hebroni; kwa kuwa walikuja kwa Daudi aliyekuwa huko, Kiswahili cha asili ni “kwa Daudi huko Hebroni.”
- source_word: לְהָסֵב ... אֵלָיו
  choice: ili kuuhamishia kwake
  rationale: Hiphil ya סבב hapa ina maana ya kusababisha utawala upite au uhamie kwa Daudi; “kuuhamishia kwake” huonyesha uhamisho huo kwa uwazi.
- source_word: מַלְכוּת שָׁאוּל
  choice: ufalme wa Sauli
  rationale: מַלְכוּת inaweza kumaanisha ufalme au mamlaka ya kifalme. “Ufalme wa Sauli” huhifadhi usemi wa simulizi bila kufafanua kupita kiasi.
- source_word: כְּפִי יְהוָה
  choice: sawasawa na neno la Yahweh
  rationale: Kwa neno halisi ni “kama kinywa cha Yahweh,” lakini ni nahau yenye maana ya kufuatana na alichosema au kuamuru Yahweh.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina maalumu la agano, YHWH. “Yahweh” hulitofautisha na cheo “Bwana” na kuwakilisha jina lenyewe.
- issue: Maana ya מַלְכוּת katika uhamisho kutoka kwa Sauli kwenda kwa Daudi
  choice: ufalme
  alternative: ufalme wake / mamlaka ya kifalme
  rationale: Neno linaweza kuelekeza eneo la ufalme au utawala wa kifalme. “Ufalme” huhifadhi upana huo badala ya kuamua kuwa ni mamlaka pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Wamejihami” huhifadhi wazo la kuwa tayari na silaha; “kuuhamishia kwake ufalme” ni wazi bila kuondoa uwezekano kwamba מַלְכוּת humaanisha ufalme au mamlaka ya kifalme.
