  text: From Dan[a], twenty-eight thousand six hundred prepared for battle.
translation:
  language: sw
  text: Kutoka Dani[a], watu 28,600 waliojiweka tayari kwa vita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliopanga safu za vita” au “waliojipanga kwa vita.” Kirai cha Kiebrania kinakazia utayari wa kijeshi au mpangilio wa kivita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Kutoka
  rationale: Ingawa kiunganishi na kihusishi vinaweza kutafsiriwa kihalisi ‘Na kutoka’, katika mfululizo huu wa makabila ‘Kutoka’ ni Kiswahili cha asili na kinahifadhi maana.
- source_word: הַדָּנִי
  choice: Dani
  rationale: Jina la kiukoo hapa linawakilisha kabila la Dani; kutaja ‘Dani’ huepuka taswira potovu ya mtu mmoja.
- source_word: עֹרְכֵי מִלְחָמָה
  choice: waliojiweka tayari kwa vita
  rationale: Kirai cha kivumishi-tendo kinaonyesha kupanga safu za mapigano au utayari wa kijeshi; usemi huu ni wazi kwa wasomaji wa sasa bila kuondoa wazo hilo.
- source_word: עֶשְׂרִים וּשְׁמוֹנָה אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: watu 28,600
  rationale: Hii ndiyo idadi ya moja kwa moja; neno ‘watu’ limeongezwa kwa uwazi wa kisintaksia kwa kuwa Kiebrania kinaacha nomino hiyo ieleweke kutokana na muktadha.
