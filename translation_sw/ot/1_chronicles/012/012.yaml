  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili, likikaribia umbo la Kiebrania.
- source_word: הַשִּׁשִּׁי
  choice: wa sita
  rationale: Namba ya mpangilio yenye kibainishi inaonyesha nafasi ya Atai katika orodha; ‘wa sita’ ndiyo kauli ya kawaida ya Kiswahili kwa mtu.
- source_word: אֱלִיאֵל
  choice: Elieli
  rationale: Jina la mtu limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili huku likihifadhi utambulisho wa jina la Kiebrania.
- source_word: הַשְּׁבִעִי
  choice: wa saba
  rationale: Namba ya mpangilio inaonyesha nafasi ya Elieli katika orodha; ‘wa saba’ ni ya asili na sahihi katika Kiswahili.
