  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa orodha umehifadhiwa; “wenye ngao na mikuki” ni wa asili zaidi kuliko tafsiri ya neno kwa neno ya kihusishi cha Kiebrania.
