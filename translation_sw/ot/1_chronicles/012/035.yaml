base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/035.yaml
  text: 'From Naphtali: 1,000 commanders[b][a], and with them 37,000 with shield and spear.'
translation:
  language: sw
  text: 'Kutoka Naftali: viongozi 1,000[a], na pamoja nao watu 37,000 wenye ngao[b] na mikuki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakuu” au “makamanda.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linalotafsiriwa “ngao” linaweza kumaanisha hasa ngao kubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנַּפְתָּלִי
  choice: Kutoka Naftali
  rationale: Katika mtindo wa orodha, kifungu hiki kinaonyesha kabila walikotoka; kiunganishi cha Kiebrania hakihitaji kutafsiriwa wazi katika Kiswahili.
- source_word: שָׂרִים
  choice: viongozi
  rationale: Neno hili humaanisha wakuu au viongozi. Katika muktadha huu wa kijeshi, “viongozi” ni la kawaida na lenye hadhi bila kulazimisha cheo mahsusi kisichotajwa.
- source_word: אָלֶף
  choice: 1,000
  rationale: Tarakimu zinafaa kwa usomaji rahisi katika orodha hii ya idadi.
- source_word: וְעִמָּהֶם
  choice: na pamoja nao
  rationale: Huhifadhi kiunganishi na kuonyesha kwamba kundi kubwa liliandamana na hao viongozi.
- source_word: בְּצִנָּה
  choice: wenye ngao
  rationale: Kiambishi בְּ hapa kinaeleza silaha walizokuwa nazo; צִנָּה ni ngao, na mara nyingi ngao kubwa.
- source_word: וַחֲנִית
  choice: na mikuki
  rationale: חֲנִית ni neno la kawaida kwa mkuki; wingi wa Kiswahili unapatana na watu 37,000.
- source_word: שְׁלֹשִׁים וְשִׁבְעָה אָלֶף
  choice: 37,000
  rationale: Tarakimu zinaendeleza mtindo wa orodha na kurahisisha usomaji.
