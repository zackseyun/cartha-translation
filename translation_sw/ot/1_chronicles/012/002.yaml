base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/002.yaml
  text: They were archers[a], able to use both the right hand and the left in hurling stones and shooting arrows with the bow; they were from Saul’s brothers, from Benjamin.
translation:
  language: sw
  text: Walikuwa wapiga upinde, nao waliweza kutumia mkono wa kulia na wa kushoto katika kurusha mawe na kupiga mishale kwa upinde. Walitoka miongoni mwa ndugu zake Sauli[a], wa kabila la Benyamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa zake Sauli” au “watu wa ukoo wa Sauli.” Neno la Kiebrania linalotafsiriwa “ndugu” linaweza pia kumaanisha watu wa familia pana au wa kabila moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשְׁקֵי קֶשֶׁת
  choice: wamejihami kwa pinde
  rationale: Kirai hiki kinamaanisha watu waliokuwa na pinde na wenye uwezo wa kuzitumia. Tafsiri hii inafuata maana ya msingi bila kuwafanya tu ‘wapiga mishale,’ kwa kuwa mstari pia unataja kurusha mawe.
- source_word: מַיְמִינִים וּמַשְׂמִאלִים
  choice: waliweza kutumia mkono wa kulia na wa kushoto
  rationale: Vitenzi hivi vinaonyesha ustadi wa kutumia upande wowote, si hali ya kuzaliwa ya kutumia mkono mmoja tu.
- source_word: בָּאֲבָנִים
  choice: kurusha mawe
  rationale: Katika muktadha wa kijeshi, mawe yanatumika kama silaha za kurushwa. Neno ‘kombeo’ halijaelezwa wazi katika Kiebrania, hivyo halijaongezwa.
- source_word: וּבַחִצִּים בַּקָּשֶׁת
  choice: kupiga mishale kwa upinde
  rationale: Hii ni njia ya kawaida na wazi ya Kiswahili ya kueleza kutumia upinde kurusha mishale.
- source_word: מֵאֲחֵי שָׁאוּל
  choice: miongoni mwa ndugu zake Sauli
  rationale: ‘Ndugu’ ndiyo tafsiri ya moja kwa moja ya אחים, huku tanbihi ikihifadhi uwezekano wa maana pana ya jamaa, watu wa ukoo, au watu wa kabila moja.
- source_word: מִבִּנְיָמִן
  choice: wa kabila la Benyamini
  rationale: Kirai hiki kinataja asili yao ya kikabila; kuongeza ‘kabila’ hufanya maana hiyo iwe wazi na ya kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo umeweka sambamba ustadi wa kurusha mawe na wa kupiga mishale, na umehifadhi maana ya moja kwa moja ya ‘ndugu’ huku upana wake ukifafanuliwa katika tanbihi.
