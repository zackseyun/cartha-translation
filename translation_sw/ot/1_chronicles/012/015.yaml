  text: These were from the sons of Gad[a], heads of the army; the least was for a hundred, and the greatest for a thousand.
translation:
  language: sw
  text: Hawa walikuwa miongoni mwa wana wa Gadi, wakuu wa jeshi; mmoja wao, aliye mdogo zaidi, alikuwa sawa na mia moja, na aliye mkuu zaidi sawa na elfu moja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya neno kwa neno zaidi: “mmoja kwa mia moja, na aliye mkuu kwa elfu moja.” Huenda huu ni usemi unaoonyesha uwezo au ufanisi wao vitani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מִבְּנֵי גָד
  choice: Hawa walikuwa miongoni mwa wazawa wa Gadi
  rationale: Kauli ya Kiebrania haina kitenzi na maana yake halisi ni ‘hawa, kutoka kwa wana wa Gadi.’ ‘Walikuwa miongoni mwa wazawa wa Gadi’ ni ya kawaida kwa Kiswahili na huhifadhi namna ya kifamilia/kikabila ya usemi.
- source_word: רָאשֵׁי הַצָּבָא
  choice: wakuu wa jeshi
  rationale: רָאשֵׁי humaanisha ‘vichwa’ kwa maana ya viongozi au wakuu; ‘wakuu wa jeshi’ ni ya asili na yenye hadhi katika Kiswahili.
- source_word: הַקָּטָן
  choice: aliye mdogo
  rationale: Katika ulinganisho huu neno linaweza kurejelea aliye mdogo kwa cheo, umuhimu, au uwezo; tafsiri hii haifungi maana kwa udhaifu wa kimwili pekee.
- source_word: אֶחָד לְמֵאָה
  choice: alikuwa kwa mia moja
  rationale: Kiebrania ni kifupi na kina maana halisi ya ‘mmoja kwa mia moja.’ Tafsiri hii huhifadhi uwiano usioelezwa kikamilifu badala ya kuamua kimyakimya kwamba ni ‘aliweza kukabiliana na’ mia moja.
- source_word: וְהַגָּדוֹל לְאָלֶף
  choice: na aliye mkuu kwa elfu moja
  rationale: Huhifadhi ulinganifu wa kifungu cha Kiebrania na tofauti kati ya mdogo na mkuu; kitenzi kilichoeleweka hakirudiwi kwa Kiswahili.
