source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לְ/כֹ֣ל קְהַ֣ל יִשְׂרָאֵ֗ל אִם עֲלֵי/כֶ֨ם ט֜וֹב וּ/מִן יְהוָ֣ה אֱלֹהֵ֗י/נוּ נִפְרְצָה֙ נִשְׁלְחָ֞ה עַל אַחֵ֣י/נוּ הַ/נִּשְׁאָרִ֗ים בְּ/כֹל֙ אַרְצ֣וֹת יִשְׂרָאֵ֔ל וְ/עִמָּ/הֶ֛ם הַ/כֹּהֲנִ֥ים וְ/הַ/לְוִיִּ֖ם בְּ/עָרֵ֣י מִגְרְשֵׁי/הֶ֑ם וְ/יִקָּבְצ֖וּ אֵלֵֽי/נוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/002.yaml
  text: And David said to all the assembly of Israel[a], “If it seems good to you, and if it is from Yahweh our God, let us send word to our brothers who remain in all the lands of Israel, and also to the priests and Levites with them in the cities of their pasturelands[d][c][b], that they may gather to us.”
translation:
  language: sw
  text: Naye Daudi akaliambia kusanyiko lote la Israeli, “Ikiwa mnaona ni vyema, na ikiwa jambo hili linatoka kwa Yahwe Mungu wetu, basi na tupeleke ujumbe kila mahali[a] kwa ndugu zetu[b] waliobaki katika maeneo yote ya Israeli[c], na pia kwa makuhani na Walawi walio pamoja nao katika miji yao na malisho yake[d], ili wakusanyike kwetu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, maneno haya ni kama “na tujieneze; na tutume.” Usemi huo huenda unamaanisha kutuma ujumbe kwa mapana au kila mahali.
    reason: lexical_alternative
  - marker: b
    text: “Ndugu” hapa linamaanisha Waisraeli wenzao kwa ujumla, si wanaume pekee wala ndugu wa tumbo tu.
    reason: lexical_alternative
  - marker: c
    text: Au “katika nchi zote za Israeli.” Kiebrania kina neno “nchi” katika wingi.
    reason: lexical_alternative
  - marker: d
    text: Yaani, ardhi wazi au maeneo ya malisho yaliyohusishwa na miji yao.
    reason: cultural_note
lexical_decisions:
- source_word: קְהַל
  choice: kusanyiko
  rationale: Neno hili linaonyesha mkutano wa taifa uliokusanyika, bila kuingiza maana maalumu ya baadaye ya kidini.
- source_word: אִם עֲלֵיכֶם טוֹב
  choice: Ikiwa mnaona ni vyema
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kueleza kibali au ridhaa ya wasikilizaji.
- source_word: וּמִן יְהוָה אֱלֹהֵינוּ
  choice: na ikiwa jambo hili linatoka kwa Yahwe Mungu wetu
  rationale: Kitenzi kinachodokezwa kimewekwa wazi ili Kiswahili kiwe cha kawaida, huku kibali cha Mungu kikibaki sambamba na kibali cha watu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: נִפְרְצָה נִשְׁלְחָה
  choice: na tutume ujumbe kila upande
  rationale: Muunganiko huu una wazo la kupeleka mwito kwa upana. Tafsiri hii ni ya kawaida katika Kiswahili na tanbihi inalinda taswira halisi ya ‘kujitokeza kwa nguvu’ au ‘kuenea.’
- source_word: עַל אַחֵינוּ
  choice: kwa ndugu zetu
  rationale: ‘Ndugu’ linahifadhi neno la kifamilia la Kiebrania, ambalo hapa linawakilisha Waisraeli wenzao.
- source_word: הַנִּשְׁאָרִים
  choice: waliobaki
  rationale: Hii inatafsiri hali ya wale waliokuwa bado wametawanyika bila kulifanya neno hilo kuwa istilahi maalumu ya kitheolojia.
- source_word: בְּכֹל אַרְצוֹת יִשְׂרָאֵל
  choice: katika maeneo yote ya Israeli
  rationale: ‘Maeneo’ linawasilisha wingi wa neno la Kiebrania kwa Kiswahili cha kawaida na kuonyesha upana wa eneo.
- source_word: מִגְרְשֵׁיהֶם
  choice: maeneo yao ya malisho
  rationale: Neno hilo linamaanisha ardhi wazi iliyohusishwa na miji, mara nyingi kwa ajili ya kulishia mifugo.
- source_word: וְיִקָּבְצוּ אֵלֵינוּ
  choice: ili wakusanyike kwetu
  rationale: Muundo huu unaonyesha kusudi la kutumwa kwa ujumbe na kuhifadhi mwelekeo wa kuja kwa Daudi na kusanyiko.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya kibali cha watu na chanzo cha Mungu
  choice: Ikiwa mnaona ni vyema, na ikiwa jambo hili linatoka kwa Yahwe Mungu wetu
  alternative: Ikiwa mnaona ni vyema kwa sababu jambo hili linatoka kwa Yahwe
  rationale: Visharti viwili vimehifadhiwa sambamba ili kutovifanya kibali cha watu na kibali cha Mungu kuwa kitu kimoja au kuamua uhusiano wao zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Basi na tutume’ hudumisha sauti ya pendekezo la pamoja; ‘ujumbe kila upande’ huwasilisha upana unaodokezwa na kitenzi cha Kiebrania bila kufanya taswira yake isiyo ya kawaida kuwa sentensi kuu.
