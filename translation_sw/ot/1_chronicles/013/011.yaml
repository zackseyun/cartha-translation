base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/011.yaml
  text: And David was angry because Yahweh had broken out against Uzza[a]; so he called that place Perez-uzza to this day.
translation:
  language: sw
  text: Daudi akakasirika kwa sababu Yahweh alikuwa amefanya mpasuko dhidi ya Uza[a]; kwa hiyo akapa mahali pale jina la Peres-Uza, hadi leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Peres-Uza linasikika kama “mpasuko dhidi ya Uza” au “kutokea kwa nguvu dhidi ya Uza,” likirejelea mchezo wa maneno wa Kiebrania katika kauli kwamba Yahweh alifanya mpasuko dhidi ya Uza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְדָוִיד
  choice: Daudi akakasirika
  rationale: Nahau hii inaonyesha hasira iliyowaka ndani ya Daudi. ‘Akakasirika’ ni ya kawaida na yenye uzito katika Kiswahili cha sasa.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya Daudi kukasirika.
- source_word: פָרַץ יְהוָה פֶּרֶץ
  choice: Yahweh alikuwa amefanya ufa
  rationale: Kitenzi na nomino za mzizi mmoja פרץ zinaeleza kutokea kwa nguvu kunakoleta ufa au pengo. ‘Amefanya ufa’ huhifadhi taswira na kuwezesha mwangwi wa jina Peres-Uza, ingawa mchezo kamili wa maneno hauwezi kuhamishwa kwa kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa kutoholewa badala ya kubadilishwa kuwa cheo.
- source_word: בְּעֻזָּא
  choice: dhidi ya Uza
  rationale: Katika muktadha huu בְּ humtambulisha Uza kama aliyelengwa na tukio hilo.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: kwa hiyo akapaita mahali pale
  rationale: Hii ni kauli ya kawaida ya kupatia mahali jina; ‘kwa hiyo’ huonyesha matokeo kwa Kiswahili cha asili.
- source_word: פֶּרֶץ עֻזָּא
  choice: Peres-Uza
  rationale: Jina la mahali limetoholewa, huku maana na mchezo wake wa maneno vikielezwa katika tanbihi.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: kama panavyoitwa hadi leo
  rationale: Maana ni kwamba jina hilo liliendelea kutumiwa mpaka wakati wa mwandishi. Ufafanuzi mdogo huzuia ‘hadi leo’ kueleweka kana kwamba kitendo cha kupaita kiliendelea.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Kitu kilichomkasirisha Daudi
  choice: kwa sababu Yahweh alikuwa amefanya ufa dhidi ya Uza
  alternative: kwa sababu ya pigo ambalo Yahweh alimpiga Uza
  rationale: Kiebrania kinasema kwa taswira ya פרץ, si kwa kitenzi cha kawaida cha ‘kupiga’ au ‘kuua.’ Tafsiri inahifadhi lugha hiyo yenye mvutano bila kueleza wazi ikiwa Daudi alimkasirikia Mungu au alikasirishwa tu na tukio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. ‘Ufa’ huhifadhi taswira ya mzizi פרץ; tanbihi hufafanua maana pana ya kupasuka au kulipuka kwa nguvu.
