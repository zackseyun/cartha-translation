base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/013.yaml
  text: So David did not bring the ark to himself[a], into the City of David; instead[b], he turned it aside to the house of Obed-edom the Gittite.
translation:
  language: sw
  text: Basi Daudi hakulipeleka Sanduku kwake[a], katika Jiji la Daudi; badala yake, aliligeuza njia na kulipeleka kwenye nyumba ya Obed-Edomu, mtu wa Gathi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuliondoa Sanduku na kulipeleka kwake.” Kitenzi cha Kiebrania kinaweza kumaanisha “kuondoa”; katika muktadha huu pia kinaweza kumaanisha “kuleta” au “kupeleka.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akalielekeza kando” au “akaligeuza.” Neno la Kiebrania humtaja Obed-Edomu kuwa Mgiti, yaani mtu wa Gathi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: hakulileta
  rationale: Kitenzi סור katika Hifili kinaweza kumaanisha kuondoa au kugeuza; katika muktadha huu kinaeleza kwamba Daudi hakulisafirisha sanduku hadi mahali pake. ‘Hakulileta’ ni Kiswahili cha kawaida na huendana na kirai kinachotaja mahali lilipokusudiwa.
- source_word: אֵלָיו
  choice: kwake
  rationale: Kirai hiki ni ‘kwake’ kihalisi; kikirejelea Daudi mwenyewe, kinaonyesha kwamba sanduku halikuletwa mahali pake.
- source_word: עִיר דָּוִיד
  choice: Jiji la Daudi
  rationale: Hili ni jina la mahali; ‘Jiji la Daudi’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וַיַּטֵּהוּ
  choice: alilielekeza kando
  rationale: Kitenzi נטה hapa kinaonyesha kubadili mwelekeo wa sanduku kutoka njia au kusudi la awali. ‘Alilielekeza kando’ huhifadhi taswira hiyo bila kudokeza kwa lazima jinsi lilivyosafirishwa.
- source_word: בֵּית
  choice: nyumbani kwa
  rationale: בַּיִת inaweza kuwa nyumba au kaya. Kwa kuwa sanduku lilipelekwa mahali pa kukaa, ‘nyumbani kwa’ ni usemi wa asili unaoweza kuhusisha nyumba na kaya bila kulazimisha tofauti hiyo.
- source_word: עֹבֵד אֱדֹם
  choice: Obed-Edomu
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili, huku likihifadhi utambulisho wa jina la Kiebrania.
- source_word: הַגִּתִּי
  choice: Mgiti
  rationale: Hili ni jina la kabila au asili linalohusiana na Gathi; ‘Mgiti’ ni umbo fupi la Kiswahili linalolingana na majina ya aina hii.
