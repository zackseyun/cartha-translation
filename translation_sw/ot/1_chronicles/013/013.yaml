translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Sanduku’ limeachwa bila nyongeza ya ‘la Agano’ kwa sababu maandishi ya Kiebrania katika aya hii yanasema tu ‘sanduku.’ Alama zote za tanbihi zimewekwa kwenye matini.
