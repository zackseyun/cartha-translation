  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֨עַל דָּוִ֤יד וְ/כָל יִשְׂרָאֵל֙ בַּעֲלָ֔תָ/ה אֶל קִרְיַ֥ת יְעָרִ֖ים אֲשֶׁ֣ר לִ/יהוּדָ֑ה לְ/הַעֲל֣וֹת מִ/שָּׁ֗ם אֵת֩ אֲר֨וֹן הָ/אֱלֹהִ֧ים יְהוָ֛ה יוֹשֵׁ֥ב הַ/כְּרוּבִ֖ים אֲשֶׁר נִקְרָ֥א שֵֽׁם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/006.yaml
  text: So David and all Israel went up to Baalah[a], that is, to Kiriath-jearim, which belongs to Judah, to bring up from there the ark of God, Yahweh who is enthroned above the cherubim, whose name is called upon it.
translation:
  language: sw
  text: Basi Daudi na Israeli wote wakapanda hadi Baala, yaani Kiriath-yearimu, uliokuwa wa Yuda, ili kulipandisha kutoka huko Sanduku la Mungu, Yahwe aliyetawazwa juu ya makerubi, linaloitwa kwa Jina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kawaida zaidi, “Sanduku la Mungu, Yahwe aliyetawazwa juu ya makerubi, ambalo huitwa kwa Jina.” Kifungu cha Kiebrania ni kifupi; linganisha 2 Samweli 6:2.
    reason: Tafsiri mbadala ya kifungu kifupi na chenye utata אֲשֶׁר נִקְרָא שֵׁם.
lexical_decisions:
- source_word: וַיַּעַל
  choice: wakapanda kwenda
  rationale: Kitenzi עלה kina maana ya kupanda au kwenda juu; katika simulizi la safari, “wakapanda kwenda” huhifadhi mwelekeo bila kuwa lugha ngumu.
- source_word: בַּעֲלָתָה
  choice: Baala
  rationale: Ni jina la mahali, na umbo la Kiswahili “Baala” linafuata matamshi ya Kiebrania.
- source_word: אֶל קִרְיַת יְעָרִים
  choice: yaani Kiriath-yearimu
  rationale: Kirai hiki kinaitambulisha Baala kwa jina jingine; “yaani” huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: uliokuwa wa Yuda
  rationale: Muundo wa Kiebrania unaonyesha kuwa mji huo ulihusishwa na eneo la kabila la Yuda; tafsiri hii haiubani kuwa maelezo ya mahali tu.
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: ili kulipandisha kutoka huko
  rationale: Huhifadhi maana sababishi ya עלה na pia uhusiano wake na “wakapanda kwenda” mwanzoni mwa mstari.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: sanduku la Mungu
  rationale: Hii ni tafsiri ya moja kwa moja na iliyozoeleka ya muundo wa umilikaji wa Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: יוֹשֵׁב הַכְּרוּבִים
  choice: anayeketi katika kiti cha enzi juu ya makerubi
  rationale: Kirai kinaonyesha ufalme wa Yahwe kuhusiana na sanduku; “juu ya” huepuka kuongeza wazo la “katikati ya” ambalo halijaonyeshwa wazi na kihusishi katika Kiebrania.
- source_word: אֲשֶׁר נִקְרָא שֵׁם
  choice: ambalo jina lake linaitwa juu yake
  rationale: Kifungu cha Kiebrania kimefupishwa na kina utata. Tafsiri hii huhifadhi hali tendwa na uhusiano wa jina na sanduku bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la agano lenyewe, si cheo; “Yahwe” hulihifadhi kama jina binafsi katika Kiswahili.
- issue: Maana ya kifungu cha mwisho אֲשֶׁר נִקְרָא שֵׁם
  choice: ambalo jina lake linaitwa juu yake
  alternative: linaloitwa kwa Jina hilo
  rationale: Kiebrania ni cha mkato na kinaweza kueleweka kwa njia zaidi ya moja, hasa kwa kuzingatia 2 Samweli 6:2. Maandishi makuu yanabaki karibu na muundo wa chanzo, huku tanbihi ikitoa usemi wa kawaida zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Majina ya mahali yametoholewa kwa uthabiti; marudio ya kitenzi “kupanda” yamehifadhiwa kwa sababu yanaakisi uhusiano wa kimakusudi katika Kiebrania.
