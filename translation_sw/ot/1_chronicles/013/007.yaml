base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/007.yaml
  text: So they set the ark of God on a new cart from the house of Abinadab[a], and Uzza and Ahio were guiding the cart.
translation:
  language: sw
  text: Basi wakaliweka sanduku la Mungu juu ya mkokoteni mpya kutoka nyumbani kwa Abinadabu; Uza na Ahio waliendesha mkokoteni huo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliongoza mkokoteni huo.” Neno la Kiebrania linaweza kumaanisha kuongoza au kuendesha chombo cha usafiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכִּיבוּ
  choice: wakaliweka
  rationale: Hifili ya רכב hapa ina maana ya kusababisha kitu kibebwe juu ya chombo cha usafiri; ‘wakaliweka ... juu ya’ ni Kiswahili cha kawaida na huhifadhi tendo halisi.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: sanduku la Mungu
  rationale: ‘Sanduku’ ni istilahi ya kawaida ya kibiblia kwa אֲרוֹן katika muktadha huu, na muundo wa ‘la Mungu’ unaakisi hali ya umilikaji.
- source_word: עַל עֲגָלָה חֲדָשָׁה
  choice: juu ya gari jipya
  rationale: עֲגָלָה ni gari la kubebea linalokokotwa; ‘gari jipya’ ni usemi wa kawaida na kivumishi ‘jipya’ kimehifadhiwa wazi.
- source_word: מִבֵּית אֲבִינָדָב
  choice: na kulitoa katika nyumba ya Abinadabu
  rationale: מן inaonyesha mahali walikotoa sanduku. Kuongeza ‘kulitoa’ kunafanya uhusiano wa chanzo uwe wazi katika Kiswahili bila kubadili maana.
- source_word: עֻזָּא
  choice: Uza
  rationale: Unukuzi wa jina la Kiebrania kwa mwandiko wa kawaida wa Kiswahili.
- source_word: אַחְיוֹ
  choice: Ahio
  rationale: Unukuzi wa moja kwa moja wa jina la mtu.
- source_word: נֹהֲגִים
  choice: walikuwa wakiliendesha
  rationale: Kitenzi kishirikishi נהג kinaonyesha tendo linaloendelea la kuongoza au kuendesha gari; ‘walikuwa wakiliendesha’ ni cha kawaida katika muktadha huu.
- source_word: בָּעֲגָלָה
  choice: gari hilo
  rationale: Pamoja na נהג, ב inaweza kuhusiana na chombo kinachoendeshwa; Kiswahili hutumia yambwa ya moja kwa moja, na ‘hilo’ hurejelea gari lililotajwa.
