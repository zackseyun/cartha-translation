  text: וְ/דָוִ֣יד וְ/כָל יִשְׂרָאֵ֗ל מְשַׂחֲקִ֛ים לִ/פְנֵ֥י הָ/אֱלֹהִ֖ים בְּ/כָל עֹ֑ז וּ/בְ/שִׁירִ֤ים וּ/בְ/כִנֹּרוֹת֙ וּ/בִ/נְבָלִ֣ים וּ/בְ/תֻפִּ֔ים וּ/בִ/מְצִלְתַּ֖יִם וּ/בַ/חֲצֹצְרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/008.yaml
  text: And David and all Israel were celebrating before God with all their might[a], with songs, lyres, harps, tambourines, cymbals, and trumpets.
translation:
  language: sw
  text: Daudi na Israeli wote walikuwa wakisherehekea[a] mbele ya Mungu kwa nguvu zao zote, kwa nyimbo, vinubi, vinanda, matari, matoazi na tarumbeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walikuwa wakicheza” au “walikuwa wakifurahi”; kitenzi cha Kiebrania kinaweza kumaanisha shughuli ya sherehe yenye furaha.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: walikuwa wakisherehekea
  rationale: Kitenzi שׂחק hapa kinaonyesha shughuli ya furaha ya hadharani katika maandamano ya ibada. “Walikuwa wakisherehekea” ni Kiswahili cha kawaida kinacholeta maana hiyo bila kudokeza kwamba walikuwa wakipiga vyombo tu.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: mbele za Mungu
  rationale: Hii ni tafsiri ya kawaida na yenye heshima inayoonyesha kwamba shughuli hiyo ilifanyika katika uwepo wa Mungu na kwa kumwelekea yeye.
- source_word: בְּכָל עֹז
  choice: kwa nguvu zao zote
  rationale: עֹז humaanisha nguvu au uwezo. Kiwakilishi cha wingi kinaafikiana na Daudi na Israeli wote na kuonyesha juhudi yao kubwa katika sherehe.
- source_word: שִׁירִים
  choice: nyimbo
  rationale: Nomino ya wingi imetafsiriwa moja kwa moja kama “nyimbo,” bila kuibadili kuwa kitenzi cha kuimba.
- source_word: כִנֹּרוֹת
  choice: vinubi
  rationale: כִּנּוֹר ni chombo cha nyuzi cha aina ya kinubi; “vinubi” ni neno linaloeleweka na linaweza kutofautishwa na נְבָלִים.
- source_word: נְבָלִים
  choice: zeze
  rationale: נֵבֶל ni chombo kingine cha nyuzi, tofauti na כִּנּוֹר. “Zeze” huhifadhi tofauti hiyo kwa neno la Kiswahili linalojulikana, ingawa muundo halisi wa chombo cha kale haujulikani kwa uhakika.
- source_word: תֻפִּים
  choice: matari
  rationale: תֹּף ni ngoma ndogo ya mkononi au chombo kinachofanana na tari; “matari” ni kisawe cha Kiswahili kinachofikika.
- source_word: מְצִלְתַּיִם
  choice: matoazi
  rationale: Hili ni neno la kawaida la Kiswahili kwa vyombo vya kugonganishwa vinavyotajwa na neno la Kiebrania.
- source_word: חֲצֹצְרוֹת
  choice: tarumbeta
  rationale: Neno hili humaanisha tarumbeta, hasa za sherehe. Aya haisemi kwamba zilikuwa za fedha, kwa hiyo maelezo hayo hayajaongezwa.
- source_word: וְדָוִיד וְכָל יִשְׂרָאֵל
  choice: Daudi na Israeli wote
  rationale: Muundo huu ni wa asili katika Kiswahili na unadumisha maana ya Daudi pamoja na jumuiya yote ya Israeli.
theological_decisions:
- issue: Tafsiri ya הָאֱלֹהִים
  choice: Mungu
  alternative: huyo Mungu
  rationale: Ingawa nomino ya Kiebrania ina kiambishi cha uainishaji, hapa ni jina la kawaida linalomtaja Mungu wa Israeli. “Mungu” ni tafsiri ya asili ya Kiswahili na haitoi maana ya uainishaji isiyokusudiwa.
- issue: Maana ya מְשַׂחֲקִים katika mazingira ya ibada
  choice: walikuwa wakisherehekea
  alternative: walikuwa wakicheza / wakifurahi
  rationale: Muktadha wa maandamano yenye nyimbo na vyombo unaunga mkono sherehe ya furaha, lakini kitenzi chenyewe kina upeo mpana. Uwezekano huo umehifadhiwa katika tanbihi badala ya kuufunga kwa tafsiri moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeweka mtiririko wa simulizi na orodha wazi ya vyombo, huku tanbihi ikihifadhi upana wa maana ya kitenzi cha Kiebrania.
