translation:
  language: sw
  text: Kusanyiko lote likasema kwamba jambo hilo lifanywe[a], kwa maana jambo hilo lilikuwa jema machoni pa watu wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kusanyiko lote likasema kwamba ifanywe hivyo”; maneno ya Kiebrania yanaonyesha ridhaa ya kusanyiko kwa pendekezo hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: likasema
  rationale: Kitenzi אמר kinamaanisha ‘kusema’; umoja unapatana kwa kawaida na nomino ya pamoja ‘kusanyiko,’ huku muktadha ukionyesha ridhaa yao.
- source_word: כָל הַקָּהָל
  choice: kusanyiko lote
  rationale: קָהָל ni jamii iliyokusanyika; ‘kusanyiko lote’ ni Kiswahili cha kawaida na huhifadhi maana ya כָל bila kuleta rangi maalumu ya kimadhehebu.
- source_word: לַעֲשׂוֹת כֵּן
  choice: kwamba jambo hilo lifanywe
  rationale: Muundo huu unaonyesha ridhaa ya kusanyiko kwamba pendekezo lililotangulia litekelezwe; tafsiri hii ni ya asili kwa Kiswahili na huhifadhi rejeo la כֵּן.
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי hapa inaleta sababu ya jibu la kusanyiko.
- source_word: יָשַׁר
  choice: lilikuwa jema
  rationale: יָשַׁר hapa hutathmini jambo kuwa jema, sawa, au linalofaa; ‘jema’ ni la asili katika nahau ‘jema machoni pa.’
- source_word: הַדָּבָר
  choice: jambo hilo
  rationale: דָּבָר katika muktadha huu ni jambo au pendekezo lililokuwa likijadiliwa; kiashiria ‘hilo’ huonyesha rejeo hilo bila kulifafanua kupita kiasi.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Huhifadhi nahau ya Kiebrania ya mtazamo au tathmini, nayo inaeleweka katika Kiswahili cha Biblia.
- source_word: כָל הָעָם
  choice: watu wote
  rationale: עָם hapa ni watu kwa ujumla, na כָל inadumishwa kwa ‘wote.’
