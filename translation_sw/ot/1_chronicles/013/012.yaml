base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/012.yaml
  text: And David feared God that day[a], saying, “How can I bring the ark of God to me?”
translation:
  language: sw
  text: Naye Daudi akamwogopa Mungu siku hiyo[a], akisema, “Nitaliletaje kwangu sanduku la Mungu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akamcha Mungu”; kitenzi cha Kiebrania kinaweza kumaanisha kuogopa, kuwa na hofu kuu, au kuwa na staha, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: akamwogopa
  rationale: Katika muktadha wa kifo cha Uza, kitenzi ירא kinaonyesha hofu halisi mbele ya hukumu ya Mungu. ‘Akamwogopa’ huhifadhi uzito huo na bado kinaweza kujumuisha hofu yenye staha.
- source_word: אֶת הָאֱלֹהִים
  choice: Mungu
  rationale: Kiashiria cha yambwa אֶת pamoja na הָאֱלֹהִים humtaja Mungu kama yambwa wa kitenzi; Kiswahili cha kawaida husema ‘akamwogopa Mungu.’
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Ni usemi wa kawaida wa wakati unaorejelea siku ya tukio hilo.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hutambulisha maneno ya moja kwa moja na kuakisi kwa kawaida kazi ya infinitivi ya Kiebrania.
- source_word: הֵיךְ
  choice: Nitaliletaje
  rationale: Neno la swali linauliza jinsi au uwezekano wa kulifanya jambo; muundo huu wa Kiswahili unaacha mvutano huo bila kuongeza maelezo.
- source_word: אָבִיא
  choice: nitalileta
  rationale: Hifili ya בוא ina maana ya kusababisha kitu kije, yaani ‘kuleta.’ Wakati ujao katika Kiswahili unafaa kwa swali la Daudi kuhusu hatua inayotarajiwa.
- source_word: אֵלַי
  choice: kwangu
  rationale: Huhifadhi maana ya ‘kwangu’ bila kubainisha zaidi kama ni kwa Daudi binafsi, nyumbani kwake, au katika mji wake.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: sanduku la Mungu
  rationale: Huhifadhi muundo na istilahi ya simulizi kwa lugha ya Kiswahili iliyo wazi na yenye uzito.
theological_decisions:
- issue: Asili ya mwitikio wa Daudi kwa hukumu ya Mungu
  choice: akamwogopa Mungu
  alternative: akamcha Mungu
  rationale: Muktadha wa kifo cha Uza unaonyesha hofu na taharuki, si staha pekee. ‘Akamwogopa’ huhifadhi mvutano wa hofu mbele ya utakatifu na hukumu ya Mungu bila kuufafanua kidhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Sanduku la Mungu’ limetumiwa kama istilahi wazi ya kibiblia; ‘kwangu’ kwa makusudi hakufafanuliwi zaidi.
