base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/010.yaml
  text: Then Yahweh’s anger burned against Uzza[a], and he struck him down because he had put out his hand to the ark; and he died there before God.
translation:
  language: sw
  text: Ndipo hasira ya Yahweh ikawaka dhidi ya Uza, naye akampiga kwa sababu alikuwa amenyosha mkono wake kuelekea Sanduku[a]; akafa pale mbele ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa amenyosha mkono wake juu ya Sanduku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: Ndipo hasira ya Yahweh ikawaka
  rationale: Nahau ya Kiebrania inaonyesha hasira iliyowaka; tafsiri hii inadumisha nguvu ya picha hiyo kwa Kiswahili cha kawaida.
- source_word: בְּעֻזָּא
  choice: dhidi ya Uza
  rationale: Kihusishi ב pamoja na nahau ya hasira humtambulisha Uza kuwa mlengwa wa hasira.
- source_word: וַיַּכֵּהוּ
  choice: naye akampiga
  rationale: Kitenzi נכה humaanisha kupiga au kuangusha kwa pigo. 'Akampiga' hakitangulizi matokeo kabla ya kauli inayofuata kwamba alikufa.
- source_word: עַל אֲשֶׁר
  choice: kwa sababu
  rationale: Kirai hiki kinatanguliza sababu ya hukumu kwa uwazi.
- source_word: שָׁלַח יָדוֹ עַל הָאָרוֹן
  choice: alikuwa amenyoosha mkono wake kuelekea sanduku
  rationale: Tafsiri hii inadumisha tendo la kunyoosha mkono bila kuongeza kwamba alilishika au kuligusa; 'kuelekea' linaacha uhusiano wa kihusishi עַל bila kuufasiri kupita kiasi.
- source_word: הָאָרוֹן
  choice: sanduku
  rationale: Neno אָרוֹן ni sanduku maalumu la agano katika muktadha huu; mstari wenyewe unasema tu 'sanduku,' hivyo hakuna nyongeza ya maneno yasiyokuwapo.
- source_word: וַיָּמָת שָׁם
  choice: naye akafa pale
  rationale: Hii inafuata mfululizo wa simulizi na kuhifadhi kielezi שָׁם.
- source_word: לִפְנֵי אֱלֹהִים
  choice: mbele za Mungu
  rationale: Ni usemi wa kawaida na wenye heshima kwa maana ya kuwa mbele au katika uwepo wa Mungu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina la agano יְהוָה; 'Yahweh' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Tofauti kati ya יְהוָה na אֱלֹהִים katika mstari mmoja
  choice: Kudumisha 'Yahweh' katika kishazi cha kwanza na 'Mungu' katika kishazi cha mwisho
  alternative: Kusawazisha yote kuwa Yahweh au Mungu
  rationale: Kiebrania kinatumia majina mawili tofauti, na kuyadumisha huepuka kulainisha tofauti ya maandishi.
- issue: Kiwango cha tendo la Uza kuhusu sanduku
  choice: amenyoosha mkono wake kuelekea sanduku
  alternative: ameweka mkono wake juu ya sanduku
  rationale: Kiebrania kinaeleza kunyoosha mkono kwa/juu ya sanduku lakini hakisemi wazi katika mstari huu kwamba aliligusa; tafsiri inadumisha uwezekano huo bila kuamua zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Sanduku' linatumika kwa אָרוֹן kulingana na muktadha wa Sanduku la Agano; alama ya tanbihi [a] imewekwa mara moja katika matini kuu.
