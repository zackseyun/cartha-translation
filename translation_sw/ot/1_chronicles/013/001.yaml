  text: And David consulted with the commanders of the thousands and the hundreds[a], with every leader.
translation:
  language: sw
  text: Daudi akashauriana na wakuu wa maelfu na mamia, na kila kiongozi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Daudi alishauriana na wakuu wa maelfu na mamia, na kila kiongozi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: akashauriana
  rationale: Kauli hii hudokeza kushiriki katika mashauriano; “akashauriana” ni Kiswahili cha kawaida na huhifadhi maana ya kujadiliana na wengine.
- source_word: עִם
  choice: na
  rationale: Kihusishi hiki kinaonyesha wale ambao Daudi alishauriana nao; “na” ni usemi wa kawaida katika muundo wa Kiswahili “kushauriana na.”
- source_word: שָׂרֵי
  choice: majemadari wa vikosi
  rationale: Katika uhusiano na “maelfu” na “mamia,” neno hili linaelekea kumaanisha viongozi wa vitengo vya kijeshi au kiutawala. Kuongeza “vikosi” kunafanya maana hiyo ieleweke kwa msomaji wa kawaida bila kubadili ngazi za vitengo.
- source_word: הָאֲלָפִים
  choice: vya maelfu
  rationale: Usemi huu huhifadhi idadi ya Kiebrania na kuonyesha vikosi au vitengo vyenye ukubwa wa maelfu.
- source_word: וְהַמֵּאוֹת
  choice: na vya mamia
  rationale: Huhifadhi ulinganifu wa Kiebrania kati ya vitengo vya maelfu na vya mamia.
- source_word: לְכָל
  choice: pamoja na kila
  rationale: Ingawa לְ mara nyingi humaanisha “kwa” au “kwa ajili ya,” hapa inaendeleza orodha ya watu walioshirikishwa katika mashauriano. “Pamoja na kila” ni wazi na ya kawaida katika Kiswahili.
- source_word: נָגִיד
  choice: kiongozi
  rationale: Neno hili humaanisha mtu mwenye nafasi ya kuongoza au kutawala; “kiongozi” huhifadhi upana wake bila kulifanya liwe cheo cha kifalme.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imeweka wazi kwamba “maelfu” na “mamia” ni vikosi au vitengo, huku tanbihi ikihifadhi tafsiri iliyo karibu zaidi na muundo halisi wa Kiebrania.
