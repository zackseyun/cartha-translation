base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/014.yaml
  text: And the ark of God remained with the household of Obed-edom[a], in his house, for three months. And Yahweh blessed the household of Obed-edom and all that belonged to him.
translation:
  language: sw
  text: Sanduku la Mungu likabaki pamoja na watu wa nyumbani mwa Obed-Edomu[a], katika nyumba yake, kwa miezi mitatu. Yahweh akawabariki watu wa nyumbani mwa Obed-Edomu na kila kitu alichokuwa nacho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyumba ya Obed-Edomu” katika matukio yote mawili; neno la Kiebrania בֵּית linaweza kumaanisha nyumba ya kimwili au watu wa nyumbani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: likakaa
  rationale: Kitenzi יָשַׁב kinaweza kumaanisha kukaa, kuishi, au kubaki. Katika muktadha huu, “likakaa” linaeleza kwa kawaida kuwepo kwa sanduku mahali hapo kwa muda uliotajwa.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: Sanduku la Mungu
  rationale: Hili ndilo jina lililo katika Kiebrania cha aya hii; maneno “la agano” hayajaongezwa kwa kuwa hayapo katika matini.
- source_word: עִם בֵּית עֹבֵד אֱדֹם
  choice: kwa jamaa ya Obed-Edomu
  rationale: בֵּית inaweza kumaanisha nyumba ya kimwili au watu wa nyumba/jamaa. Hapa “jamaa” hutofautisha watu wa nyumba hiyo na mahali halisi panapotajwa mara moja baadaye.
- source_word: בְּבֵיתוֹ
  choice: ndani ya nyumba yake
  rationale: Kirai hiki kinataja mahali halisi ambapo sanduku lilikuwapo.
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: kwa miezi mitatu
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kuonyesha muda ambao hali iliendelea.
- source_word: וַיְבָרֶךְ יְהוָה
  choice: Yahwe akaibariki
  rationale: Muundo huu unadumisha mfuatano wa simulizi na kumtaja Yahwe kuwa mtendaji wa baraka.
- source_word: אֶת בֵּית עֹבֵד אֱדֹם
  choice: jamaa ya Obed-Edomu
  rationale: Hapa בֵּית inaeleweka kwa kawaida kuwa watu wa nyumba au jamaa waliobarikiwa, huku uwezekano wa maana “nyumba” ukihifadhiwa katika tanbihi.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: na vitu vyote alivyokuwa navyo
  rationale: Tafsiri hii inawasilisha upana wa kirai cha Kiebrania bila kuainisha vitu au mali ambazo matini haijaainisha.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini inatumia jina la Mungu la herufi nne moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Jamaa” limetumiwa kwa maana ya watu wa nyumba, huku “ndani ya nyumba yake” likitaja jengo lenyewe. Jina Obed-Edomu limeumbwa kwa namna inayotamkika kwa kawaida katika Kiswahili.
