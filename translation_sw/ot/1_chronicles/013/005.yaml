  text: וַ/יַּקְהֵ֤ל דָּוִיד֙ אֶת כָּל יִשְׂרָאֵ֔ל מִן שִׁיח֥וֹר מִצְרַ֖יִם וְ/עַד לְב֣וֹא חֲמָ֑ת לְ/הָבִיא֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים מִ/קִּרְיַ֖ת יְעָרִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/005.yaml
  text: So David assembled all Israel[a], from the Shihor of Egypt to Lebo-hamath[b], to bring the ark of God from Kiriath-jearim.
translation:
  language: sw
  text: Basi Daudi akakusanya Israeli yote, kutoka Shihori wa Misri[a] mpaka Lebo-Hamathi[b], ili kulileta sanduku la Mungu kutoka Kiriath-Yearimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Shihori wa Misri” ni jina linalotaja mpaka wa kusini; wengine hulielewa kuwa “kijito cha Misri.”
    reason: cultural_note
  - marker: b
    text: Au, kwa tafsiri ya moja kwa moja zaidi, “mpaka maingilio ya Hamathi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: akaikusanya
  rationale: Hifili ya קהל inaonyesha Daudi alisababisha watu wakusanyike. ‘Akaikusanya’ ni ya asili kwa Kiswahili na inaendana na ‘Israeli yote’ kama jumuiya ya taifa.
- source_word: כָּל יִשְׂרָאֵל
  choice: Israeli yote
  rationale: Inahifadhi usemi wa Kiebrania unaolitaja taifa kwa ujumla; si lazima umaanishe kila mtu mmoja mmoja.
- source_word: מִן שִׁיחוֹר מִצְרַיִם
  choice: kutoka Shihori ya Misri
  rationale: Jina Shihori limetoholewa badala ya kutambulishwa moja kwa moja kuwa kijito fulani, hivyo utata halisi wa kijiografia unabaki.
- source_word: וְעַד לְבוֹא חֲמָת
  choice: mpaka Lebo-hamathi
  rationale: Kirai hiki kinaweza kufanya kazi kama jina la mahali au fomula ya mpaka. Jina limetoholewa katika matini, huku maana yake ya moja kwa moja ikitolewa katika tanbihi.
- source_word: לְהָבִיא
  choice: ili kulileta
  rationale: Kitenzi-jina hiki kinaonyesha kusudi; ‘ili kulileta’ huwasilisha kusudi hilo kwa uwazi katika Kiswahili.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: sanduku la Mungu
  rationale: Hii ni tafsiri ya kawaida na sahihi ya muundo wa umilikaji wa Kiebrania bila kuongeza ufafanuzi wa kiteolojia.
- source_word: מִקִּרְיַת יְעָרִים
  choice: kutoka Kiriath-yearimu
  rationale: Jina la mahali limetoholewa kwa namna inayokaribia matamshi ya Kiebrania na kueleweka katika maandishi ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Majina ya mahali yametoholewa bila kuyafafanua kupita ushahidi wa Kiebrania.
