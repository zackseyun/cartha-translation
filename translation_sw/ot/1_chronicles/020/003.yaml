base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/003.yaml
  text: He brought out the people who were in it and put them to work with saws[a], iron tools, and axes. Thus David did to all the cities of the Ammonites[b]. Then David and all the people returned to Jerusalem.
translation:
  language: sw
  text: Aliwatoa watu waliokuwa humo na kuwaweka wafanye kazi kwa kutumia misumeno, vifaa vya chuma, na mashoka.[a][b] Ndivyo Daudi alivyofanya kwa miji yote ya Waamoni. Kisha Daudi na watu wote wakarudi Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au huenda: “akawaweka chini ya misumeno, vyombo vya kupuria vya chuma, na vifaa vya kukatia.” Baadhi, kwa kuzingatia 2 Samweli 12:31, huelewa kuwa Daudi aliwaua kwa vifaa hivyo.'
    reason: alternative_reading
  - marker: b
    text: Majina ya Kiebrania ya baadhi ya vifaa hivi hayana uhakika; maneno yaliyotafsiriwa “vifaa vya chuma, na mashoka” yanaweza kumaanisha kwa ujumla zaidi vifaa vya chuma vyenye makali.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיא
  choice: Aliwatoa
  rationale: Hifili ya יצא humaanisha kuwatoa au kuwaongoza watoke; “aliwatoa” ni ya kawaida na inadumisha tendo la kuwatoa wakazi mjini.
- source_word: וַיָּשַׂר
  choice: kuwaweka wafanye kazi
  rationale: Kitenzi hiki ni kigumu na maana yake inabishaniwa. Muktadha wa orodha ya vifaa unaweza kueleweka kuwa Daudi aliwaweka watu katika kazi, bila kuingiza moja kwa moja maana kali zaidi kutoka 2 Samweli 12:31.
- source_word: בַּמְּגֵרָה
  choice: kwa kutumia misumeno
  rationale: מְגֵרָה ni msumeno; wingi wa Kiswahili unafaa katika orodha ya vifaa vya kazi.
- source_word: בַּחֲרִיצֵי הַבַּרְזֶל
  choice: vifaa vya chuma
  rationale: Neno hilo linaashiria vifaa vyenye makali au vya kukatia, lakini aina kamili ya kifaa haina uhakika. Tafsiri ya jumla huepuka usahihi usiothibitishwa.
- source_word: וּבַמְּגֵרוֹת
  choice: na mashoka
  rationale: Umbo hili ni gumu kimsamiati na linafanana na neno la awali la “msumeno”; “mashoka” linatoa maana inayowezekana ya vifaa vya kukatia, huku kutokuwa na uhakika kukitajwa katika tanbihi.
- source_word: וְכֵן יַעֲשֶׂה
  choice: Ndivyo Daudi alivyofanya
  rationale: Muundo huu unatoa muhtasari wa tendo la Daudi kwa miji ya Waamoni; kauli hii ni ya asili katika simulizi la Kiswahili.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: katika miji yote ya Waamoni
  rationale: “Waamoni” ni jina la kawaida la watu wa Ammoni katika Kiswahili, na kihusishi kinaeleza tendo lililofanywa kwa miji hiyo.
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  choice: wakarudi Yerusalemu
  rationale: שוב pamoja na mahali pa kwenda kwa kawaida humaanisha kurudi; umoja wa kitenzi cha Kiebrania unaongozwa na Daudi, lakini Kiswahili hutumia wingi kwa kiima “Daudi na watu wote.”
theological_decisions:
- issue: Iwapo mstari unaeleza kuuawa/kuteswa kwa Waamoni au kulazimishwa kufanya kazi
  choice: Matini kuu inasema Daudi aliwaweka mateka wafanye kazi kwa vifaa vilivyotajwa.
  alternative: Huenda mstari ukamaanisha kwamba Daudi aliwaua kwa misumeno na vifaa vya chuma, hasa ukilinganishwa na 2 Samweli 12:31.
  rationale: Maneno ya Mambo ya Nyakati yanatofautiana na yale ya 2 Samweli na yanaweza kueleweka kwa maana isiyo ya mauaji. Tofauti hii muhimu kimaadili na kiteolojia haipaswi kuamuliwa kimya kimya, hivyo maana kali zaidi imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye staha. “Kuwaweka wafanye kazi” ni rahisi kueleweka na huhifadhi uwezekano mkuu wa matini ya Mambo ya Nyakati; tanbihi zinahifadhi utata wa kitenzi na wa majina ya vifaa.
