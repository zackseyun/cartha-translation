  text: וַ/יְחָרֵ֖ף אֶת יִשְׂרָאֵ֑ל וַ/יַּכֵּ֨/הוּ֙ יְה֣וֹנָתָ֔ן בֶּן שִׁמְעָ֖א אֲחִ֥י דָוִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/007.yaml
  text: And when he taunted Israel[a], Jonathan son of Shimea, David’s brother, struck him down.
translation:
  language: sw
  text: Alipoitukana Israeli[a], Yonathani mwana wa Shimea, ndugu yake Daudi, akampiga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alipoikaidi Israeli.” Kitenzi cha Kiebrania kinaweza kumaanisha kutukana kwa dharau au kukaidi waziwazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: alipoitukana
  rationale: Kitenzi חרף hapa kinaonyesha maneno ya dharau na uchokozi dhidi ya Israeli. “Kuitukana” ni Kiswahili cha kawaida kinachohifadhi tendo la kusema kwa dharau; “kuikaidi” ni uwezekano mwingine unaosisitiza uasi wa wazi.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israeli
  rationale: Kiebrania kinataja taifa la Israeli moja kwa moja, likiwakilisha watu wake kwa ujumla; hivyo jina la taifa limehifadhiwa.
- source_word: וַיַּכֵּהוּ
  choice: akampiga na kumuua
  rationale: Kitenzi נכה kimsingi ni kupiga, na katika muktadha huu pigo hilo ni la kifo. Kauli hii ya Kiswahili inaweka wazi matokeo yanayoeleweka katika simulizi bila kutumia neno la kale au lisilo la kawaida.
- source_word: יְהוֹנָתָן
  choice: Yonathani
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בֶּן שִׁמְעָא
  choice: mwana wa Shimea
  rationale: Huhifadhi uhusiano wa ukoo uliotajwa katika Kiebrania na kulinakili jina kwa umbo linaloeleweka kwa Kiswahili.
- source_word: אֲחִי דָוִיד
  choice: ndugu yake Daudi
  rationale: Kirai cha Kiebrania kinamaanisha ndugu wa kiume wa Daudi. Katika muktadha wa nasaba, “ndugu yake Daudi” ni usemi wa asili wa Kiswahili.
