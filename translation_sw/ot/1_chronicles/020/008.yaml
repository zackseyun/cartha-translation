base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/008.yaml
  text: These were born to Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: sw
  text: Hawa walizaliwa kwa Rafa[a] huko Gathi, nao wakaanguka kwa mkono wa Daudi na kwa mkono wa watumishi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wazao wa Rafa.” Huenda “Rafa” humrejelea babu wa ukoo au jina la ukoo unaohusishwa na Warefai, yaani, ukoo wa majitu huko Gathi.
    reason: 'Maana ya Rafa hapa ina utata: inaweza kumtaja babu binafsi au ukoo unaohusishwa na Warefai.'
lexical_decisions:
- source_word: אֵל
  choice: Hawa
  rationale: Ni kiwakilishi cha kuonyesha kinachowarejelea wapiganaji waliotajwa kabla; ‘Hawa’ kinaepuka kuongeza nomino isiyokuwamo wazi katika Kiebrania.
- source_word: נוּלְּדוּ
  choice: walizaliwa
  rationale: Nifali ya ילד kwa kawaida humaanisha ‘kuzaliwa.’ Katika muktadha huu inaweza pia kuonyesha ukoo, lakini tafsiri hii inadumisha usemi wa Kiebrania.
- source_word: לְהָרָפָא
  choice: kwa Rafa
  rationale: Kirai hiki kinaonyesha kuzaliwa au nasaba inayohusishwa na Rafa. Jina linaachwa bila kutafsiriwa kuwa ‘jitu’ ili kutohitimisha utambulisho wenye utata.
- source_word: בְּגַת
  choice: huko Gathi
  rationale: Kiambishi ב hapa kinaonyesha mahali; ‘huko Gathi’ ni usemi wa kawaida wa Kiswahili.
- source_word: וַיִּפְּלוּ
  choice: nao wakaanguka
  rationale: נפל humaanisha ‘kuanguka’; katika vita inadokeza kuuawa au kushindwa, lakini ‘wakaanguka’ inadumisha taswira ya chanzo.
- source_word: בְיַד
  choice: kwa mkono wa
  rationale: Nahau hii ya Kiebrania huonyesha mtendaji au chombo; Kiswahili pia kinaweza kuitunza kwa njia iliyoeleweka katika muktadha wa vita.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: עבד humaanisha ‘mtumishi’; katika mazingira ya kifalme na kijeshi inaweza kuwahusu walio katika utumishi wa Daudi, wakiwemo wapiganaji wake.
theological_decisions:
- issue: Utambulisho wa הָרָפָא
  choice: Rafa, jina linaloweza kumaanisha babu au ukoo
  alternative: jitu; Warefaimu; uzao wa Rafa
  rationale: Umbo la Kiebrania ni la umoja lenye kibainishi, si umbo la kawaida la wingi ‘Warefaimu.’ Kutumia ‘Rafa’ na kuweka maelezo ya chini kunahifadhi uwezekano wa kuwa mtu wa ukoo au jina la kundi bila kulazimisha maana ya ‘jitu.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘kwa mkono wa’ yamedumishwa ili kuhifadhi ulinganifu wa Kiebrania.
