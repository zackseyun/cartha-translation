base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/001.yaml
  text: And it happened at the time of the turning of the year[a], at the time when kings go out, that Joab led out the army and devastated the land of the Ammonites, and he came and besieged Rabbah. But David stayed in Jerusalem. And Joab struck Rabbah and tore it down.
translation:
  language: sw
  text: Ikawa, wakati wa kugeuka kwa mwaka[a], wakati wafalme wanapotoka, Yoabu akaongoza jeshi na kuiharibu nchi ya Waamoni. Akaja akauzingira mji wa Raba. Lakini Daudi alibaki Yerusalemu. Yoabu akaushambulia mji wa Raba na kuubomoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri yenye kufafanua zaidi, “majira ya kuchipua, wakati wafalme wanapotoka kwenda vitani.” Kiebrania kinasema kwa uhalisi zaidi, “wakati wa kugeuka kwa mwaka, wakati wafalme wanapotoka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשׁוּבַת הַשָּׁנָה
  choice: wakati wa kugeuka kwa mwaka
  rationale: Huhifadhi taswira halisi ya Kiebrania ya mwaka kugeuka au kurudi, bila kuitafsiri moja kwa moja kuwa majira ya kuchipua.
- source_word: לְעֵת צֵאת הַמְּלָכִים
  choice: wakati wafalme wanapotoka
  rationale: Huhifadhi kauli ya Kiebrania na kuacha lengo la kutoka likiwa halikutajwa wazi; muktadha wa kijeshi unaelekeza maana.
- source_word: וַיִּנְהַג
  choice: akaongoza
  rationale: Kitenzi kina maana ya kuongoza au kupeleka mbele; hapa kinamwonyesha Yoabu akiongoza jeshi katika kampeni.
- source_word: חֵיל הַצָּבָא
  choice: jeshi
  rationale: Jozi hii ya nomino humaanisha kikosi cha kijeshi; 'jeshi' ni tafsiri fupi na ya kawaida katika Kiswahili.
- source_word: וַיַּשְׁחֵת אֶת אֶרֶץ בְּנֵי עַמּוֹן
  choice: akaiharibu nchi ya Waamoni
  rationale: Kitenzi huonyesha kuharibu au kufanya ukiwa katika kampeni ya kijeshi; 'Waamoni' ni jina la kawaida la taifa hilo.
- source_word: וַיָּצַר
  choice: kuuzingira
  rationale: Ni istilahi ya kawaida ya kijeshi kwa kuzunguka mji ili kuushambulia na kuukata msaada.
- source_word: וְדָוִיד יֹשֵׁב בִּירוּשָׁלִָם
  choice: Lakini Daudi alibaki Yerusalemu
  rationale: Umbo la Kiebrania linaonyesha hali inayoendelea ya Daudi kubaki mjini; 'lakini' huleta utofauti wa kimuktadha na matendo ya Yoabu.
- source_word: וַיַּךְ
  choice: akaushambulia
  rationale: Kitenzi kina wigo wa kupiga, kushambulia, au kushinda. 'Kushambulia' hufaa kwa mji na hakitangulizi kwa nguvu matokeo yanayotolewa na kitenzi kinachofuata.
- source_word: וַיֶּהֶרְסֶהָ
  choice: kuubomoa
  rationale: Kitenzi humaanisha kubomoa au kuangusha, hasa majengo au mji, na kinatofautisha tendo hili na uharibifu wa nchi uliotajwa awali.
- source_word: רַבָּה
  choice: Raba
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
