reference: 1 Chronicles 20:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/תַּעֲמֹ֧ד מִלְחָמָ֛ה בְּ/גֶ֖זֶר עִם פְּלִשְׁתִּ֑ים אָ֣ז הִכָּ֞ה סִבְּכַ֣י הַ/חֻֽשָׁתִ֗י אֶת סִפַּ֛י מִ/ילִדֵ֥י הָ/רְפָאִ֖ים וַ/יִּכָּנֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/004.yaml
  text: After this[a], war arose at Gezer with the Philistines. Then Sibbecai the Hushathite struck down Sippai, one of the descendants of the Rephaim[b], and they were subdued.
translation:
  language: sw
  text: Baada ya hayo, vita vilizuka huko Gezeri dhidi ya Wafilisti. Ndipo Sibekai Mhushathi akamwangusha Sipai[a], mmoja wa wazao wa Warefai[b], nao wakatiishwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Safai.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Warefai”; kwa mapokeo pia hutafsiriwa “majitu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Ni kiunganishi cha kawaida cha masimulizi kinachoonyesha mfuatano wa wakati bila kutafsiri kimekanika fomula nzima ya Kiebrania.
- source_word: וַתַּעֲמֹד מִלְחָמָה
  choice: vita vilizuka
  rationale: Katika muktadha huu, עמד pamoja na מלחמה huonyesha kuanza kwa mapigano; usemi huu ni wa asili na wa sasa katika Kiswahili.
- source_word: בְּגֶזֶר
  choice: huko Gezeri
  rationale: Kiambishi cha mahali pamoja na jina lililotoholewa huonyesha eneo la vita kwa Kiswahili cha kawaida.
- source_word: עִם פְּלִשְׁתִּים
  choice: dhidi ya Wafilisti
  rationale: Ingawa עם kimsingi ni ‘pamoja na,’ muktadha wa vita unaonyesha wazi uhasama; ‘dhidi ya’ huwasilisha uhusiano huo kwa Kiswahili cha asili.
- source_word: אָז
  choice: Ndipo
  rationale: Huendeleza mfuatano wa tukio na kuonyesha kilichotokea wakati huo.
- source_word: הִכָּה
  choice: akamwangusha
  rationale: נכה katika vita inaweza kumaanisha kumpiga na kumwangusha au kumuua. ‘Akamwangusha’ huhifadhi nguvu ya kijeshi bila kulazimisha wazi maana ya ‘akamuua.’
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: Sibekai Mhushathi
  rationale: Majina yametoholewa kwa mfumo wa sauti wa Kiswahili, huku jina la utambulisho wa kikundi au mahali likihifadhiwa.
- source_word: סִפַּי
  choice: Sipai
  rationale: Hufuata vokali za maandishi ya WLC; umbo jingine la jina limehifadhiwa katika tanbihi.
- source_word: מִילִדֵי הָרְפָאִים
  choice: mmoja wa wazao wa Warefai
  rationale: ילידי huonyesha waliozaliwa katika ukoo au waliotokana na kundi hilo. ‘Mmoja wa wazao’ huweka wazi kwamba Sipai ni mtu mmoja katika kundi hilo.
- source_word: וַיִּכָּנֵעוּ
  choice: nao wakatiishwa
  rationale: Nifali ya כנע huonyesha kushindwa na kutiishwa. Kauli hii inadumisha wingi usiotajwa tena kwa jina katika Kiebrania, ambao katika muktadha unaelekea kwa Wafilisti.
theological_decisions:
- issue: Tafsiri ya הָרְפָאִים
  choice: Warefai
  alternative: majitu
  rationale: Neno hilo linaweza kuwa jina la watu au ukoo, si lazima maelezo ya moja kwa moja ya ukubwa wao. Kulitohoa huepuka kuingiza dai la kifasiri lenye nguvu kuliko maandishi yanavyolazimisha.
- issue: Nguvu ya maana ya הִכָּה
  choice: akamwangusha
  alternative: akamuua
  rationale: Kitenzi kinaweza kudokeza kuua katika vita, lakini si lazima kila mara kiseme hivyo moja kwa moja. Tafsiri iliyochaguliwa huhifadhi uwezekano huo bila kuufanya kuwa wa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. Majina yametoholewa kwa urahisi wa matamshi ya Kiswahili; sentensi imehifadhi mfuatano, nguvu ya kijeshi, na utata halisi wa maneno ya Kiebrania.
