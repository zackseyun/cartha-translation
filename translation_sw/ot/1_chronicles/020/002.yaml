base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/002.yaml
  text: And David took the crown of their king from his head and found that it weighed a talent of gold, and in it was a precious stone; and it was placed on David’s head. And he carried off very much plunder from the city.
translation:
  language: sw
  text: Daudi akalichukua taji la mfalme wao[a] kutoka kichwani mwake, akakuta kwamba uzito wake ulikuwa talanta moja ya dhahabu[b], na ndani yake kulikuwa na jiwe la thamani; nalo likawa kichwani mwa Daudi. Akachukua nyara nyingi sana kutoka katika mji huo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taji la Milkomu” (au “Malkamu”), ikiwa neno מַלְכָּם linachukuliwa kuwa jina la mungu wa Waamoni badala ya “mfalme wao.”
    reason: alternative_reading
  - marker: b
    text: Talanta ilikuwa kipimo kikubwa cha uzito cha nyakati za kale, ambacho mara nyingi hukadiriwa kuwa karibu kilogramu 34, ingawa uzito wake halisi ulitofautiana.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: taji
  rationale: Neno la kawaida na linaloeleweka kwa vazi la kifalme la kichwani.
- source_word: מַלְכָּם
  choice: mfalme wao
  rationale: Muundo wa neno kwa kawaida unaeleweka kuwa מֶלֶךְ pamoja na kiambishi cha nafsi ya tatu wingi, yaani ‘mfalme wao’; uwezekano wa kuwa jina la mungu wa Waamoni umehifadhiwa katika tanbihi.
- source_word: מֵעַל רֹאשׁוֹ
  choice: kutoka kichwani mwake
  rationale: Tafsiri ya asili ya Kiswahili inayohifadhi picha halisi ya kuliondoa taji kichwani.
- source_word: וַיִּמְצָאָהּ מִשְׁקַל כִּכַּר זָהָב
  choice: akakuta kwamba uzito wake ulikuwa talanta moja ya dhahabu
  rationale: Inaonyesha kwamba Daudi aligundua uzito wa taji, huku ikihifadhi kipimo cha kale badala ya kukibadili kwa makadirio yasiyo hakika.
- source_word: אֶבֶן יְקָרָה
  choice: jiwe la thamani
  rationale: Tafsiri ya moja kwa moja isiyobainisha aina ya jiwe ambayo chanzo hakitaji.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִיד
  choice: nalo likawa kichwani mwa Daudi
  rationale: Inafuata kwa karibu kauli ya Kiebrania ‘likawa juu ya kichwa cha Daudi’ bila kuongeza wazi tendo la mtu kuliweka.
- source_word: וּשְׁלַל הָעִיר הוֹצִיא הַרְבֵּה מְאֹד
  choice: Akachukua nyara nyingi sana kutoka mjini
  rationale: ‘Nyara’ linafaa katika muktadha wa vita, na ‘nyingi sana’ huhifadhi msisitizo wa wingi.
theological_decisions:
- issue: Iwapo מַלְכָּם humaanisha ‘mfalme wao’ au jina la mungu wa Waamoni, Milkomu/Malkamu
  choice: mfalme wao
  alternative: taji la Milkomu (au Malkamu)
  rationale: Sarufi na kirai ‘kutoka kichwani mwake’ vinaelekea zaidi kumtaja mfalme wa kibinadamu, lakini konsonanti zilezile zinaweza kusomwa kama jina la mungu wa Waamoni. Uwezekano huo wa kweli umehifadhiwa katika tanbihi.
- issue: Iwapo וַתְּהִי עַל רֹאשׁ דָּוִיד husema tu kwamba taji lilikuwa kichwani mwa Daudi au hudokeza kwamba liliwekwa huko
  choice: nalo likawa kichwani mwa Daudi
  alternative: nalo likawekwa kichwani mwa Daudi
  rationale: Kauli kuu inahifadhi muundo wa chanzo na haiongezi mtendaji au tendo la kuweka ambalo halijasemwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mtindo wa masimulizi umetumia viambishi vya mfululizo ‘aka-’. Kipimo cha kale ‘talanta’ kimehifadhiwa na kufafanuliwa katika tanbihi; utata wa מַלְכָּם pia umehifadhiwa.
