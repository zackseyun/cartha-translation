base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/005.yaml
  text: And there was war with the Philistines again[a], and Elhanan son of Jair struck down Lahmi, the brother of Goliath the Gittite, whose spear shaft was like a weaver’s beam.
translation:
  language: sw
  text: Kulikuwa tena na vita dhidi ya Wafilisti.[a] Elhanani mwana wa Yairi akamuua Lahmi, ndugu ya Goliathi Mgathi; mpini wa mkuki wake ulikuwa kama boriti ya mfumaji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Simulizi sambamba katika 2 Samweli 21:19 lina maandishi magumu ya Kiebrania na mara nyingi hujadiliwa kuhusiana na aya hii. Mambo ya Nyakati yanasema wazi kwamba Elhanani alimuua Lahmi, ndugu ya Goliathi.
    reason: textual_variant
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: Kulikuwa tena na vita
  rationale: Kauli hii inaanzisha tukio jingine katika mfululizo; “tena” huwakilisha עוֹד kwa Kiswahili cha kawaida.
- source_word: אֶת פְּלִשְׁתִּים
  choice: dhidi ya Wafilisti
  rationale: Katika muktadha wa vita, אֶת hutaja upande pinzani; “dhidi ya” ni usemi wa kawaida na ulio wazi katika Kiswahili.
- source_word: וַיַּךְ
  choice: akamuua
  rationale: Ingawa נכה kimsingi ni kupiga, katika simulizi hili la vita tendo hilo linaishia katika kifo; “akamuua” huwasilisha maana ya muktadha kwa uwazi.
- source_word: אֶלְחָנָן בֶּן יעור
  choice: Elhanani mwana wa Yairi
  rationale: Majina yameandikwa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia, na uhusiano wa mwana umehifadhiwa moja kwa moja.
- source_word: אֶת לַחְמִי
  choice: Lahmi
  rationale: לַחְמִי limechukuliwa kuwa jina la mtu kulingana na uakifishaji wa Kimasora na muundo wa Mambo ya Nyakati.
- source_word: אֲחִי גָּלְיָת
  choice: ndugu ya Goliathi
  rationale: Muundo wa Kiebrania unasema wazi kuwa Lahmi ni ndugu ya Goliathi; Kiswahili hakilazimishi jinsia ya ndugu katika neno lenyewe.
- source_word: הַגִּתִּי
  choice: Mgathi
  rationale: Neno hili la nasaba au mahali humtambulisha Goliathi kuwa mtu wa Gathi; “Mgathi” huhifadhi umbo hilo kwa ufupi.
- source_word: וְעֵץ חֲנִיתוֹ
  choice: mpini wa mkuki wake
  rationale: עֵץ hapa ni sehemu ya mbao au mpini wa mkuki, si “mti” kwa maana ya mmea; usemi huu ni wa kawaida katika Kiswahili.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: ulikuwa kama mti wa mfumaji
  rationale: מְנוֹר ni boriti au mti wa kifaa cha kufumia; “mti wa mfumaji” hudumisha taswira ya kitu kikubwa cha mbao huku ikieleweka kwa wasomaji wa kawaida.
theological_decisions:
- issue: Uhusiano na simulizi sambamba la 2 Samweli 21:19, ambalo maandishi yake ya Kiebrania yana tatizo na yanaweza kueleweka kana kwamba Elhanani alimuua Goliathi mwenyewe
  choice: 'Kufuata maneno yaliyo wazi ya Mambo ya Nyakati: Elhanani alimuua Lahmi, ndugu ya Goliathi.'
  alternative: Kuingiza katika aya hii usawazishaji wa 2 Samweli, au kulichanganua jina Lahmi kama sehemu ya neno linalomaanisha Mbethlehemu.
  rationale: Tafsiri inapaswa kuwasilisha maandishi ya Kiebrania ya aya hii yenyewe. Hapa Lahmi ametajwa wazi kuwa ndugu ya Goliathi; tatizo la simulizi sambamba linaelezwa katika tanbihi badala ya kubadili matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimewekwa kwa mtiririko wa kawaida bila kuondoa taswira za Kiebrania. Alama ya tanbihi [a] imewekwa katika matini.
