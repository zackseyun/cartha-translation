  text: וַ/תְּהִי ע֥וֹד מִלְחָמָ֖ה בְּ/גַ֑ת וַ/יְהִ֣י אִ֣ישׁ מִדָּ֗ה וְ/אֶצְבְּעֹתָ֤י/ו שֵׁשׁ וָ/שֵׁשׁ֙ עֶשְׂרִ֣ים וְ/אַרְבַּ֔ע וְ/גַם ה֖וּא נוֹלַ֥ד לְ/הָ/רָפָֽא־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/006.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six each, twenty-four in all; he also was born to Rapha.
translation:
  language: sw
  text: Kulikuwa tena na vita huko Gathi, na kulikuwa na mtu mwenye umbo kubwa, aliyekuwa na vidole sita katika kila mkono na kila mguu, jumla ya vidole ishirini na vinne. Naye pia alizaliwa kwa Rapha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alikuwa mzao wa lile jitu,” au “alikuwa mmoja wa Warefai.” Kiebrania kinasema “alizaliwa kwa Rapha.”
    reason: alternative_reading
lexical_decisions:
- source_word: עוֹד
  choice: tena
  rationale: Katika mfululizo wa simulizi neno hili linaonyesha kwamba vita vilitokea mara nyingine.
- source_word: מִלְחָמָה
  choice: vita
  rationale: Nomino hii inaeleza mapigano kwa upana; “vita” inafaa kwa muhtasari huu wa kisimulizi.
- source_word: בְּגַת
  choice: huko Gathi
  rationale: Kihusishi ב kinaonyesha mahali; “huko Gathi” ni Kiswahili cha kawaida katika usimulizi.
- source_word: אִישׁ מִדָּה
  choice: mtu mwenye umbo kubwa
  rationale: Kirai halisi ni mtu wa kipimo/kimo, na katika muktadha huu kinaonyesha ukubwa wa mwili usio wa kawaida bila kumwita moja kwa moja jitu.
- source_word: אֶצְבְּעֹתָיו
  choice: vidole ... katika kila mkono na kila mguu
  rationale: Nomino yenyewe ni “vidole,” lakini hesabu ya ishirini na vinne na kifungu sambamba cha 2 Samweli 21:20 vinaonyesha vidole vya mikono na miguu.
- source_word: שֵׁשׁ וָשֵׁשׁ
  choice: sita katika kila mkono na kila mguu
  rationale: 'Hii huwasilisha maana ya ugawaji kwa uwazi: vidole sita kwa kila mkono na kila mguu.'
- source_word: עֶשְׂרִים וְאַרְבַּע
  choice: jumla vidole ishirini na vinne
  rationale: Namba hii inatoa jumla ya vidole vyote, na “jumla” huweka uhusiano wa kihesabu wazi.
- source_word: וְגַם הוּא
  choice: Yeye pia
  rationale: Maneno haya yanamlinganisha mtu huyu na mashujaa wengine wa ukoo au kundi hilo katika muktadha.
- source_word: נוֹלַד לְהָרָפָא
  choice: alizaliwa katika ukoo wa Rapha
  rationale: Kwa kuwa לְהָרָפָא huonyesha uhusiano wa kuzaliwa na Rapha, Kiswahili hiki cha asili kinafikisha wazo la nasaba huku jina Rapha likihifadhi utata wa babu au kundi.
theological_decisions:
- issue: Utambulisho wa הָרָפָא
  choice: Rapha kama jina la babu au ukoo, likihifadhiwa kwa unukuzi
  alternative: jitu; Warefai
  rationale: Kiebrania kina umbo la umoja lenye kibainishi, lakini muktadha unaweza kurejelea babu, ukoo, au kundi linalohusishwa na Warefai. Matini kuu huhifadhi “Rapha,” na tanbihi huonyesha tafsiri nyingine bila kutatua kimyakimya utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kimaandiko. Sentensi imegawanywa ili hesabu ya vidole 24 ieleweke kwa urahisi; “umbo kubwa” huepuka kuongeza tafsiri ya moja kwa moja ya “jitu.”
