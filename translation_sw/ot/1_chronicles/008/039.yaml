  yaml_path: translation/ot/1_chronicles/008/039.yaml
  text: 'The sons of Eshek his brother: Ulam his firstborn[a], Jeush the second, and Eliphelet the third.'
translation:
  language: sw
  text: 'Nao wana wa Esheki, ndugu yake, walikuwa: Ulamu, mwana wake wa kwanza; Yeushi, wa pili; na Elifeleti, wa tatu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Nao wana wa
  rationale: Kiunganishi וּ kimedhihirishwa kwa “Nao,” huku muundo wa nasaba “wana wa” ukihifadhiwa kwa Kiswahili cha kawaida.
- source_word: עֵשֶׁק
  choice: Esheki
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili, likiongeza irabu ya mwisho kulingana na matumizi ya majina ya kibiblia.
- source_word: אָחִיו
  choice: ndugu yake
  rationale: Neno אָח kwa msingi humaanisha ndugu wa kiume; Kiswahili “ndugu yake” ni cha asili na hakilazimishi maana pana ya ukoo.
- source_word: אוּלָם
  choice: Ulamu
  rationale: Jina limetoholewa kwa mfumo wa sauti wa Kiswahili.
- source_word: בְּכֹרוֹ
  choice: mzaliwa wake wa kwanza
  rationale: Huhifadhi maana mahsusi ya mwana wa kwanza kuzaliwa, badala ya kusema tu “mkubwa wake.”
- source_word: יְעוּשׁ
  choice: Yeushi
  rationale: Jina limetoholewa kwa Kiswahili huku sauti ya chanzo ikihifadhiwa kwa kadiri iwezekanavyo.
- source_word: הַשֵּׁנִי
  choice: wa pili
  rationale: Namba ya mpangilio wa kuzaliwa imetafsiriwa moja kwa moja.
- source_word: וֶאֱלִיפֶלֶט
  choice: na Elifeleti
  rationale: Kiunganishi cha Kiebrania kimehifadhiwa kabla ya mshiriki wa mwisho katika orodha; jina limetoholewa kwa Kiswahili.
- source_word: הַשְּׁלִשִׁי
  choice: wa tatu
  rationale: Namba ya mpangilio imetafsiriwa moja kwa moja.
