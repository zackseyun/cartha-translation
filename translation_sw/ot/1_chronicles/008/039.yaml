  register: Lugha ni ya sasa, yenye heshima na inayofaa orodha ya nasaba. Kitenzi “walikuwa” kimeongezwa kwa ufasaha wa Kiswahili, bila kubadili taarifa. Kiunganishi cha mwanzo kimehifadhiwa kama “Nao,” hivyo hakuna tanbihi ya mbadala inayohitajika.
