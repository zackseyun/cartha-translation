  text: His firstborn son was Abdon[a], then Zur, Kish, Baal, and Nadab.
translation:
  language: sw
  text: Mwanawe mzaliwa wa kwanza alikuwa Abdoni[a], kisha Suri, Kishi, Baali na Nadabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Na mwanawe mzaliwa wa kwanza: Abdoni, Suri, Kishi, Baali na Nadabu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנוֹ
  choice: Mwanawe
  rationale: Kiunganishi וְ kinaendeleza orodha ya nasaba, lakini Kiswahili cha kawaida hakihitaji kuanza kwa “Na”; בְנוֹ ni “mwanawe.”
- source_word: הַבְּכוֹר
  choice: mzaliwa wa kwanza
  rationale: Huhifadhi maana ya mwana aliyezaliwa kwanza katika mpangilio wa uzazi na ni usemi wa kawaida wa Kiswahili.
- source_word: עַבְדּוֹן
  choice: Abdoni
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Biblia ya Kiswahili.
- source_word: וְצוּר
  choice: kisha Suri
  rationale: צוּר ni jina la mtu; “kisha” hufanya orodha isomeke kwa kawaida baada ya “alikuwa Abdoni” bila kubadili maana ya kinasaba.
- source_word: וְקִישׁ
  choice: Kishi
  rationale: Jina la mtu limetoholewa kwa namna inayoeleweka katika Kiswahili.
- source_word: וּבַעַל
  choice: Baali
  rationale: Katika muktadha huu ni jina la mtu katika nasaba, kwa hiyo limetoholewa badala ya kutafsiriwa kama cheo au jina la mungu.
- source_word: וְנָדָב
  choice: Nadabu
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Biblia ya Kiswahili.
