lexical_decisions:
- source_word: יִפְדְיָה
  choice: Yifdeya
  rationale: Jina la mtu limetoholewa kwa kuzingatia matamshi ya Kiebrania na tahajia ya kawaida ya Kiswahili; konsonanti ya mwanzo yod imewakilishwa kwa “Y”.
- source_word: פניאל
  choice: Penieli
  rationale: Tahajia ya konsonanti katika maandishi yaliyotolewa inaunga mkono umbo Penieli; jina limetoholewa badala ya kutafsiriwa. Umbo Penueli, linalotumiwa katika baadhi ya mapokeo ya majina, limehifadhiwa katika tanbihi.
- source_word: בְּנֵי
  choice: walikuwa wana wa
  rationale: Ni wingi wa neno “mwana” katika muundo wa utegemezi. Kwa kuwa orodha hii ya nasaba haina kitenzi waziwazi, “walikuwa” limeongezwa ili sentensi iwe ya kawaida na wazi katika Kiswahili bila kubadili maana.
- source_word: שָׁשָׁק
  choice: Shashaki
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
