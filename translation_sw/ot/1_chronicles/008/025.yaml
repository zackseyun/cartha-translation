  text: Yifdeya na Penieli[a] walikuwa wana wa Shashaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Penueli.” Hili ni umbo jingine la kutoholesha jina la Kiebrania.
