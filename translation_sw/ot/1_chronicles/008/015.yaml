  rationale: Kiunganishi וּ kimetafsiriwa “na.” Jina זְבַדְיָה limeandikwa kwa umbo la Kiswahili “Zebadia,” linalosomeka kwa urahisi huku likihifadhi jina la Kiebrania.
- source_word: וַ/עֲרָד
  choice: Aradi
  rationale: Jina עֲרָד limeandikwa “Aradi” kwa tahajia ya kawaida ya majina ya kibiblia katika Kiswahili. Kiunganishi chake kinawakilishwa na muundo wa orodha ya Kiswahili bila kulazimika kurudia “na” hapa.
- source_word: וָ/עָדֶר
  choice: na Ederi
  rationale: Kiunganishi וָ kimetafsiriwa “na” kabla ya jina la mwisho katika orodha. Jina עָדֶר limeandikwa “Ederi,” kwa kuzingatia matamshi ya Kiebrania ya Kimasora.
