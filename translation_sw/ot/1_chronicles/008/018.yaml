  text: Yishmerai, Yizliya na Yobabu walikuwa wana wa Elpaali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׁמְרַי
  choice: Yishmerai
  rationale: Jina la mtu limetoholewa kwa kufuata matamshi ya Kiebrania; yod ya mwanzo imewakilishwa kwa Y, na shin kwa sh.
- source_word: יִזְלִיאָה
  choice: Yizlia
  rationale: Jina la mtu limetoholewa kwa Kiswahili kwa kuwakilisha yod ya mwanzo kwa Y; umbo hili pia huepuka tahajia ya Kiingereza yenye J.
- source_word: יוֹבָב
  choice: Yobabu
  rationale: Jina la mtu limetoholewa kwa muundo unaosomeka kwa urahisi katika Kiswahili huku likihifadhi sauti kuu za jina la Kiebrania.
- source_word: בְּנֵי
  choice: walikuwa wana wa
  rationale: Ni wingi wa neno 'mwana' katika hali ya kutegemezwa. Kitenzi 'walikuwa' kimeongezwa ili orodha hii ya ukoo iwe ya asili na wazi katika Kiswahili bila kubadili maana.
- source_word: אֶלְפָּעַל
  choice: Elpaali
  rationale: Jina la mtu limetoholewa kwa Kiswahili bila alama ya mkato, ili lisomeke kwa urahisi huku likibaki karibu na umbo la Kiebrania.
