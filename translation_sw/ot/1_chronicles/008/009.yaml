  text: And he fathered Jobab[a], Zibia, Mesha, and Malcam by Hodesh his wife.
translation:
  language: sw
  text: Kwa Hodeshi, mkewe[a], akawazaa Yobabu, Sibia, Mesha na Malkamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kutokana na Hodeshi, mkewe.” Kihusishi cha Kiebrania kinaweza kutafsiriwa kwa namna zote mbili katika kauli hii ya ukoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: akawazaa
  rationale: Hifili ya ילד katika orodha ya ukoo humaanisha kwamba mwanaume huyo aliwazaa watoto akiwa baba yao. Kiswahili “akawazaa” ni cha kawaida na muktadha unaonyesha wazi kuwa mhusika ni baba.
- source_word: מִן
  choice: kwa
  rationale: Katika kauli hii ya ukoo, kihusishi kinaonyesha kwamba Hodeshi ndiye mama ambaye watoto hao walizaliwa kupitia kwake. “Kwa” ni kifupi na cha asili, huku tanbihi ikihifadhi maana halisi mbadala ya “kutokana na.”
- source_word: חֹדֶשׁ
  choice: Hodeshi
  rationale: Ni jina la mtu; limeandikwa kwa namna inayoweza kutamkwa kwa urahisi katika Kiswahili bila kulitafsiri kama nomino ya kawaida.
- source_word: אִשְׁתּוֹ
  choice: mkewe
  rationale: Katika muktadha huu אשה pamoja na kiambishi cha umilikaji humaanisha mwenzi wa ndoa, si mwanamke kwa ujumla.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: majina yameorodheshwa kwa koma na “na”
  rationale: Kiashiria cha yambwa הישירה hakina neno sambamba linalohitajika katika Kiswahili; uratibu unaonyeshwa kwa orodha ya kawaida.
- source_word: יוֹבָב
  choice: Yobabu
  rationale: Unukuzi wa jina la Kiebrania kwa tahajia na matamshi ya kawaida ya Kiswahili.
- source_word: צִבְיָא
  choice: Sibia
  rationale: Unukuzi wa jina la Kiebrania unaowakilisha konsonanti ya צ kwa “s” katika umbo linalotamkika kwa Kiswahili.
- source_word: מֵישָׁא
  choice: Mesha
  rationale: Unukuzi wa moja kwa moja wa jina la mtu kwa tahajia inayosomeka kwa Kiswahili.
- source_word: מַלְכָּם
  choice: Malkamu
  rationale: Jina limenukuliwa badala ya kutafsiriwa; “k” linawakilisha כ na vokali ya mwisho hurahisisha matamshi ya Kiswahili.
