lexical_decisions:
- source_word: וּ/זְבַדְיָה
  choice: na Zebadia
  rationale: Jina la mtu זְבַדְיָה limetoholewa kwa tahajia ya kawaida ya Kiswahili; kiunganishi וּ kimetafsiriwa “na”.
- source_word: וּ/מְשֻׁלָּם
  choice: na Meshulamu
  rationale: Jina la mtu מְשֻׁלָּם limetoholewa kwa mfumo wa sauti na tahajia unaosomeka kwa urahisi katika Kiswahili; kiunganishi kimedumishwa.
- source_word: וְ/חִזְקִי
  choice: na Hizki
  rationale: Tahajia “Hizki” inafuata kwa karibu umbo la Kiebrania חִזְקִי bila kulichanganya na jina tofauti Hezekia; וְ limetafsiriwa “na”.
- source_word: וָ/חָבֶר
  choice: na Heberi
  rationale: Jina חָבֶר limetoholewa kuwa “Heberi,” umbo linalolingana na desturi ya majina ya Biblia katika Kiswahili; kiunganishi וָ kimetafsiriwa “na”.
