  text: And the son of Jehonathan was Merib-baal[a], and Merib-baal fathered Micah.
translation:
  language: sw
  text: Na mwana wa Yehonathani alikuwa Merib-Baali; naye Merib-Baali akamzaa Mika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Katika nasaba inayolingana katika 2 Samweli 9:12, jina hili limeandikwa kwa tahajia tofauti kidogo katika Kiebrania: “Mika” (Mica), ilhali hapa ni “Mika” (Micah).'
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: Na mwana wa
  rationale: Kiunganishi וּ kinaendeleza mtiririko wa nasaba, na בֶן humaanisha “mwana wa.” Muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: יְהוֹנָתָן
  choice: Yehonathani
  rationale: Jina limenukuliwa kwa kufuata umbo la Kiebrania Yehonatan badala ya kulisawazisha na umbo fupi Yonathani; irabu ya mwisho imeongezwa kulingana na matamshi ya kawaida ya Kiswahili.
- source_word: מְרִיב בָּעַל / מְרִיב בַּעַל
  choice: Merib-Baali
  rationale: Jina hili la mtu limeandikwa kwa vipashio viwili katika Kiebrania. Kistari huonyesha kuwa ni jina moja, na irabu ya mwisho hulifanya litamkike kwa kawaida katika Kiswahili. Kurudiwa kwa jina katika aya kumehifadhiwa.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, kausativi ya ילד humaanisha kuwa baba alimzaa mtu. “Akamzaa” ni usemi mfupi, wa kawaida katika nasaba za Kiswahili, na unaonyesha uhusiano wa moja kwa moja wa uzazi.
- source_word: אֶת מִיכָה
  choice: Mika
  rationale: אֶת ni kiashiria cha yambwa tendwa na hakitafsiriwi kivyake. מִיכָה limenukuliwa kwa umbo la kawaida la Kiswahili “Mika.”
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi na wenye hadhi unaofaa nasaba. Neno “alikuwa” limewekwa ili sentensi isiyo na kitenzi katika Kiebrania iwe ya kawaida kwa Kiswahili, huku kurudiwa kwa jina Merib-Baali na mtiririko wa aya vikihifadhiwa. Alama ya tanbihi imewekwa baada ya “Mika,” kwa kuwa tofauti inayotajwa inahusu jina hilo.
