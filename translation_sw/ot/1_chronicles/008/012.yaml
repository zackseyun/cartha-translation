  yaml_path: translation/ot/1_chronicles/008/012.yaml
  text: 'The sons of Elpaal: Eber[a], Misham, and Shemed[b]; he built Ono and Lod and its villages.'
translation:
  language: sw
  text: Wana wa Elpaali walikuwa Eberi, Mishamu, na Shemedi[a]. Yeye alijenga Ono na Lodi na vijiji vyake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa kawaida, “Yeye” humrejelea Shemedi, jina la mwisho lililotajwa; wengine hukielewa kiwakilishi hiki kwa upana zaidi kuwa kinahusiana na ukoo huo.
    reason: alternative_reading
  - marker: b
    text: Kwa maana halisi, “na binti zake,” nahau ya Kiebrania inayomaanisha vijiji au makazi yaliyotegemea mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶלְפַּעַל
  choice: Wana wa Elpaali walikuwa
  rationale: Kirai cha muundo wa nasaba kinatanguliza orodha ya wana; ‘walikuwa’ hufanya sentensi iwe ya kawaida katika Kiswahili bila kubadili maana.
- source_word: עֵבֶר וּמִשְׁעָם וָשָׁמֶד
  choice: Eberi, Mishamu, na Shemedi
  rationale: Majina ya watu yametoholewa kwa matamshi yanayofaa Kiswahili huku yakifuata kwa karibu maumbo ya Kiebrania.
- source_word: הוּא
  choice: Yeye
  rationale: Kiwakilishi huru cha nafsi ya tatu umoja wa kiume kimehifadhiwa wazi; kwa kawaida humrejelea Shemedi, jina la mwisho katika orodha.
- source_word: בָּנָה
  choice: alijenga
  rationale: Kitenzi cha Qal timilifu cha בנה kina maana ya kawaida ya ‘kujenga’; hakilazimishi maana maalumu ya ‘kuanzisha’ au ‘kujenga upya.’
- source_word: אוֹנוֹ וְאֶת לֹד
  choice: Ono na Lodi
  rationale: Majina ya mahali yametoholewa moja kwa moja kutoka Kiebrania; viashiria vya yambwa havina kifani cha kutafsiriwa katika Kiswahili.
- source_word: וּבְנֹתֶיהָ
  choice: pamoja na vijiji vyake
  rationale: Kwa maana halisi ni ‘na binti zake,’ nahau ya Kiebrania inayomaanisha vijiji au makazi yaliyotegemea mji. Kiswahili cha kawaida kinahitaji kutoa maana ya nahau hiyo.
theological_decisions:
- issue: Mrejelewa wa kiwakilishi הוּא
  choice: ‘Yeye’ amewekwa baada ya Shemedi, huku tanbihi ikisema kwamba kwa kawaida humrejelea Shemedi.
  alternative: Kukihusisha kiwakilishi kwa upana zaidi na ukoo wa Elpaali.
  rationale: Sarufi na ukaribu wa jina vinaelekeza zaidi kwa Shemedi, lakini andiko halimtaji tena kwa jina; hivyo uwezekano mpana zaidi haujafichwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa nasaba umewekwa kwa lugha rahisi; majina yametoholewa kwa mtindo wa kawaida wa Kibiblia wa Kiswahili. Alama zote za tanbihi zimewekwa kwenye sehemu husika za maandishi.
