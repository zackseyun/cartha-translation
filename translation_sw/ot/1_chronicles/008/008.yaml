base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/008.yaml
  text: And Shaharaim fathered children in the country of Moab after he sent away Hushim and Baara[b][a], his wives.
translation:
  language: sw
  text: Shaharaimu akawa baba wa watoto katika eneo la Moabu[a], baada ya kuwaacha[b] Hushimu na Baara, wake zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika nchi ya Moabu” au “katika uwanda wa Moabu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kutokana na kuwaacha kwake”; inaelekea usemi huu unamaanisha “baada ya kuwaacha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׁחֲרַיִם
  choice: Shaharaimu
  rationale: Jina la mtu limetoholewa kwa mfumo unaosomeka kwa Kiswahili. Kiunganishi וְ hakikutafsiriwa kwa neno tofauti kwa sababu mfululizo wa nasaba unaendelea kwa kawaida bila kuanza na “na” katika Kiswahili.
- source_word: הוֹלִיד
  choice: akazaa watoto
  rationale: Katika muktadha wa nasaba, Hiphil ya ילד humaanisha kuzaa au kuwa baba wa watoto. Usemi huu ni wa kawaida katika nasaba za Kiswahili na hauongezi majina ya watoto yanayotajwa katika mstari unaofuata.
- source_word: בִּ/שְׂדֵה מוֹאָב
  choice: katika eneo la Moabu
  rationale: שָׂדֶה humaanisha kihalisi “shamba/uwanda,” lakini katika usemi wa kijiografia inaweza kumaanisha nchi au eneo. “Eneo la Moabu” ni la kawaida na linahifadhi maana hiyo pana.
- source_word: מִן שִׁלְח/וֹ אֹתָם
  choice: baada ya kuwaacha
  rationale: מִן pamoja na kitenzi-jina hapa inaonyesha hali ya wakati, yaani baada ya tendo la kuwaondoa au kuwaacha. Kiambishi cha yambwa katika “kuwaacha” kinawakilisha אֹתָם, ambao wanafafanuliwa mara moja kuwa Hushimu na Baara.
- source_word: חוּשִׁים
  choice: Hushimu
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa matamshi ya Kiswahili.
- source_word: וְ/אֶת בַּעֲרָא
  choice: na Baara
  rationale: אֶת ni kiashiria cha yambwa kisichohitaji neno tofauti katika Kiswahili; וְ imetafsiriwa “na” kati ya majina hayo mawili.
- source_word: נָשָׁיו
  choice: wake zake
  rationale: Wingi wa אִשָּׁה wenye kiambishi cha umilikaji hapa unamaanisha wake wa ndoa. Ufafanuzi huu umewekwa baada ya majina kama ulivyo katika Kiebrania.
