base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/013.yaml
  text: And Beriah and Shema—they were heads of fathers’ houses among the inhabitants of Aijalon[b][a]; they were the ones who drove out the inhabitants of Gath.
translation:
  language: sw
  text: Nao Beria na Shema walikuwa viongozi wa jamaa za ukoo[a] miongoni mwa wakazi wa Aiyaloni; wao ndio waliowafukuza[b] wakazi wa Gathi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wakuu wa nyumba za baba,” yaani viongozi wa jamaa za ukoo.'
    reason: cultural_note
  - marker: b
    text: Au “waliowafanya wakimbie.” Kitenzi cha Kiebrania kinasisitiza kusababisha wakazi wa Gathi wakimbie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרִעָה וָשֶׁמַע
  choice: Nao Beria na Shema
  rationale: Majina ya watu yametoholewa kwa namna inayosomeka kwa Kiswahili; viunganishi vya Kiebrania vimewakilishwa kwa “Nao ... na” ili kudumisha mtiririko wa nasaba.
- source_word: הֵמָּה
  choice: walikuwa / wao ndio
  rationale: Kiwakilishi huru cha msisitizo kimetafsiriwa kwa muundo wa kawaida wa Kiswahili; katika kutokea kwake kwa pili, “wao ndio” inadumisha msisitizo wa Kiebrania.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: viongozi wa jamaa za ukoo
  rationale: Kirai hiki kinawahusu wakuu wa vitengo vya kifamilia vya ukoo. Tafsiri hii ni ya asili kuliko “vichwa vya nyumba za baba” huku ikihifadhi maana ya kijamii ya Kiebrania.
- source_word: לְיוֹשְׁבֵי אַיָּלוֹן
  choice: miongoni mwa wakazi wa Aiyaloni
  rationale: לְ hapa inaeleweka kuwa inahusisha nafasi yao ya uongozi ndani ya jamii ya wakazi wa Aiyaloni, si lazima kuwataja kama walioongoza kwa niaba yao.
- source_word: אַיָּלוֹן
  choice: Aiyaloni
  rationale: Jina la mahali limetoholewa kwa tahajia na umbo linalofaa matamshi ya Kiswahili.
- source_word: הִבְרִיחוּ
  choice: waliowafukuza
  rationale: Hifili ya ברח ina maana ya kusababisha watu wakimbie. “Kuwafukuza” huonyesha kitendo hicho na matokeo yanayowezekana katika muktadha.
- source_word: אֶת יֹשְׁבֵי גַת
  choice: wakazi wa Gathi
  rationale: Tafsiri ya moja kwa moja inayodumisha ulinganifu wa neno “wakazi” na kirai kilichotangulia.
