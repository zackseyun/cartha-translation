lexical_decisions:
- source_word: יַעֲרֶשְׁיָה
  choice: Yaareshia
  rationale: Jina la mtu limetoholewa kwa kufuata matamshi ya Kiebrania na tahajia ya kawaida ya Kiswahili.
- source_word: אֵלִיָּה
  choice: Eliya
  rationale: Hili ni jina la mtu; umbo la Kiswahili “Eliya” linawakilisha kwa kawaida jina la Kiebrania Eliyyah.
- source_word: זִכְרִי
  choice: Zikri
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili, ambapo sauti ya herufi ya Kiebrania כ hapa imewakilishwa kwa “k.”
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii ya wanaume, neno hili kwa msingi humaanisha wana wa mtu; “wana wa” ni usemi wa asili na wa heshima katika Kiswahili, huku maana pana ya ukoo ikibainishwa katika tanbihi.
- source_word: יְרֹחָם
  choice: Yerohamu
  rationale: Jina la mtu limetoholewa kwa kufuata umbo la Kiebrania na kanuni za majina katika Kiswahili.
