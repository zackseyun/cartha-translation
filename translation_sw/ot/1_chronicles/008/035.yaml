  yaml_path: translation/ot/1_chronicles/008/035.yaml
  text: 'And the sons of Micah: Pithon[a], Melech, Tarea, and Ahaz.'
translation:
  language: sw
  text: Nao wana wa Mika walikuwa Pithoni, Meleki, Tarea[a] na Ahazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili pia huandikwa “Tahrea” katika baadhi ya mapokeo ya tahajia za Kiingereza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Nao wana wa
  rationale: Kiunganishi וּ kinaendeleza mfuatano wa nasaba, na בְנֵי hapa humaanisha wana wa moja kwa moja wanaotajwa kwa majina.
- source_word: מִיכָה
  choice: Mika
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: פִּיתוֹן
  choice: Pithoni
  rationale: Jina limetoholewa kutoka Kiebrania kwa tahajia na matamshi ya kawaida ya Kiswahili.
- source_word: וָמֶלֶךְ
  choice: Meleki
  rationale: Katika muktadha huu wa nasaba, מֶלֶךְ ni jina la mtu, si nomino ya kawaida inayomaanisha mfalme; kiunganishi hakijarudiwa katika orodha kwa mtindo wa asili wa Kiswahili.
- source_word: וְתַאְרֵעַ
  choice: Tarea
  rationale: Jina limetoholewa kwa kufuata kwa karibu umbo la Kiebrania תַאְרֵעַ.
- source_word: וְאָחָז
  choice: Ahazi
  rationale: Jina la mtu limetoholewa kwa umbo lililozoeleka katika Biblia za Kiswahili.
