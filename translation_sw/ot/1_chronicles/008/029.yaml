  - marker: b
    text: Kiebrania kina kitenzi cha wingi, “waliishi,” ingawa “baba wa Gibeoni” ni umoja. Huenda wingi huo unarejelea watu wa nyumbani au unaonyesha hali ya maandishi isiyo wazi.
