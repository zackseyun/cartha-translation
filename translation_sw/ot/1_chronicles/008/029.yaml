  text: Na huko Gibeoni waliishi[b] baba wa Gibeoni[a], na jina la mke wake lilikuwa Maaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanzilishi wa Gibeoni” au “mkuu wa Gibeoni”; Kiebrania hasa, “baba wa Gibeoni.”
