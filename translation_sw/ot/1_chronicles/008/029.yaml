lexical_decisions:
- source_word: וּ/בְ/גִבְעוֹן
  choice: Huko Gibeoni
  rationale: Kiambishi cha mahali בְּ kinaonyesha mahali anapoishi. “Huko Gibeoni” ni Kiswahili cha kawaida kinachotanguliza eneo, huku וּ ikiachwa bila kutafsiriwa moja kwa moja kwa kuwa ni kiunganishi cha mfululizo wa simulizi.
- source_word: יָשְׁבוּ
  choice: aliishi
  rationale: Ingawa umbo la Kiebrania ni wingi, mada inayofuata, אֲבִי גִבְעוֹן, ni mtu mmoja; tafsiri nyingi hulichukulia kama kutopatana kwa kisarufi au ushahidi wa tofauti ya maandishi. Kiswahili huhitaji upatanisho wa wazi, hivyo umoja umetumiwa kulingana na mada iliyopo.
- source_word: אֲבִי גִבְעוֹן
  choice: baba wa Gibeoni
  rationale: Hii ndiyo tafsiri ya karibu ya muundo wa Kiebrania. “Baba” katika taarifa za nasaba inaweza pia kumaanisha mwanzilishi au mkuu wa mahali; uwezekano huo umewekwa katika tanbihi bila kuufanya kuwa maana pekee.
- source_word: וְ/שֵׁם אִשְׁתּוֹ
  choice: na jina la mke wake lilikuwa
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida prediketi ya Kiebrania, yaani kwamba jina la mke wake lilikuwa Maaka.
- source_word: מַעֲכָה
  choice: Maaka
  rationale: Jina la Kiebrania מַעֲכָה limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
