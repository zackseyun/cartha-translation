- source_word: יִשְׁפָּן
  choice: Yishpani
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili kutoka umbo la Kiebrania; konsonanti ya mwanzo yod imewakilishwa kwa Y, na vokali ya mwisho imeongezwa ili jina litamkike kwa kawaida katika Kiswahili.
- source_word: עֵבֶר
  choice: Eberi
  rationale: Jina la mtu limetoholewa moja kwa moja kutoka Kiebrania; hakuna sauti ya H mwanzoni katika maandishi ya Kiebrania, na vokali ya mwisho husaidia matamshi ya Kiswahili.
- source_word: אֱלִיאֵל
  choice: Elieli
  rationale: Jina la mtu limetoholewa badala ya kutafsiri maana ya vipashio vyake; umbo hili linafuata kwa karibu matamshi ya Kiebrania na muundo wa sauti wa Kiswahili.
- source_word: וְ / וָ / וֶ
  choice: na
  rationale: Viambishi hivi ni viunganishi vinavyounganisha majina katika orodha; Kiswahili cha kawaida hutumia koma kati ya majina na “na” kabla ya jina la mwisho.
