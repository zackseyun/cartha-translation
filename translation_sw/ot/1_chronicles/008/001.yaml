  text: Benyamini akamzaa Bela, mzaliwa wake wa kwanza, Ashbeli wa pili, na Aharah[a] wa tatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania husoma Aharah; baadhi ya tafsiri za Kiingereza huandika Ahrah.
