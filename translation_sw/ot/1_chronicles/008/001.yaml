lexical_decisions:
- source_word: וּבִנְיָמִן
  choice: Benyamini
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia; kiunganishi וּ kinawakilishwa kwa mtiririko wa kitenzi “akamzaa” katika mfululizo wa nasaba.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika muktadha wa nasaba, Hifili ya ילד humaanisha mwanaume kumzaa au kuwa baba ya mtu. “Akamzaa” ni usemi wa kawaida na wazi katika nasaba za Kiswahili.
- source_word: אֶת
  choice: '[hakijatafsiriwa kivyake]'
  rationale: Hiki ni kiashiria cha yambwa mahususi katika Kiebrania na hakihitaji neno tofauti katika Kiswahili.
- source_word: בֶּלַע
  choice: Bela
  rationale: Jina limenukuliwa kwa umbo la kawaida la Kiswahili.
- source_word: בְּכֹרוֹ
  choice: mzaliwa wake wa kwanza
  rationale: Huhifadhi wazi wazo la hadhi na mpangilio wa mzaliwa wa kwanza, si tu mwana mkubwa kwa umri.
- source_word: אַשְׁבֵּל
  choice: Ashbeli
  rationale: Umbo la jina limebadilishwa kidogo kulingana na matamshi na matumizi yaliyozoeleka katika Kiswahili.
- source_word: הַשֵּׁנִי
  choice: wa pili
  rationale: Nambari ya mpangilio imetafsiriwa kwa muundo wa asili wa orodha ya watu katika Kiswahili.
- source_word: וְאַחְרַח
  choice: na Ahara
  rationale: Kiunganishi וְ kimetafsiriwa “na”; jina limeandikwa “Ahara” kwa umbo linalosomeka kwa kawaida katika Kiswahili huku tanbihi ikitaja tofauti ya uandishi.
- source_word: הַשְּׁלִישִׁי
  choice: wa tatu
  rationale: Huhifadhi mpangilio wa wazi wa nasaba katika Kiebrania.
