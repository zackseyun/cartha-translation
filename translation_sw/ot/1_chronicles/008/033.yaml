  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִֽינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/033.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: sw
  text: Neri akamzaa Kishi, Kishi akamzaa Sauli, naye Sauli akawazaa Yonathani, Malki-shua, Abinadabu na Eshbaali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eshbaali anaitwa Ish-boshethi katika 2 Samweli.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלִיד
  choice: akamzaa / akawazaa
  rationale: Katika nasaba, kausativi ya ילד humaanisha mtu kuwa baba wa uzao unaotajwa. “Akamzaa” ni usemi wa kawaida na wenye heshima katika Kiswahili cha Biblia; umbo la wingi “akawazaa” limetumiwa watoto kadhaa wanapotajwa.
- source_word: נֵר
  choice: Neri
  rationale: Jina la mtu limetoholewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: קִישׁ
  choice: Kishi
  rationale: Jina la mtu limetoholewa kwa kufuata matamshi na maumbo ya majina yaliyozoeleka katika Kiswahili.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: יְהוֹנָתָן
  choice: Yonathani
  rationale: Umbo la Kiswahili linalotambulika kwa mwana wa Sauli, huku likiwakilisha jina la Kiebrania יְהוֹנָתָן.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malki-shua
  rationale: Jina ambatani limetoholewa na kuwekewa kistari ili kuonyesha sehemu zake mbili.
- source_word: אֲבִינָדָב
  choice: Abinadabu
  rationale: Jina la mtu limetoholewa kwa umbo la Kiswahili lililozoeleka.
- source_word: אֶשְׁבָּעַל
  choice: Eshbaali
  rationale: Maandishi ya Kiebrania ya Mambo ya Nyakati yana jina אֶשְׁבָּעַל; kwa hiyo jina hilo limetoholewa moja kwa moja badala ya kulinganishwa kimya kimya na umbo la jina katika Samweli.
theological_decisions:
- issue: Umbo la jina la mwana wa mwisho wa Sauli katika orodha
  choice: Eshbaali katika maandishi makuu
  alternative: Ish-boshethi
  rationale: Hili ni suala la umbo la jina katika mapokeo tofauti ya maandishi, si tofauti ya mafundisho. Kiebrania cha Mambo ya Nyakati kinasema “Eshbaali,” ilhali katika 2 Samweli mtu huyu anaitwa “Ish-boshethi.” Maandishi makuu yanafuata chanzo cha Kiebrania, na tanbihi inamsaidia msomaji kutambua jina jingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa nasaba umehifadhiwa kwa kurudia “akamzaa,” huku “naye” ikisaidia mtiririko wa kawaida wa sentensi.
