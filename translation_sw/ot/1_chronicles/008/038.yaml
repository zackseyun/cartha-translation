base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/038.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan. All these were the sons of Azel.'
translation:
  language: sw
  text: 'Azeli alikuwa na wana sita[a]. Majina yao yalikuwa haya: Azrikamu, mzaliwa wake wa kwanza, Ishmaeli, Shearia, Obadia na Hanani. Hao wote walikuwa wana wa Azeli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na mpangilio wa Kiebrania, “Azeli, wana sita.” Kiebrania hutumia muundo wa nasaba unaoonyesha umilikaji. Maandishi yanasema wana sita, lakini yanataja majina matano tu.
    reason: lexical_alternative_and_textual_observation
lexical_decisions:
- source_word: וּלְאָצֵל
  choice: Azeli alikuwa na
  rationale: Muundo wa nasaba wenye kihusishi ל unaonyesha umilikaji; Kiswahili cha kawaida hueleza maana hiyo kwa ‘alikuwa na’ badala ya tafsiri neno kwa neno ‘kwa Azeli walikuwa.’
- source_word: שִׁשָּׁה בָנִים
  choice: wana sita
  rationale: Katika nasaba hii בָנִים inawahusu wazao wa kiume, hivyo ‘wana’ ni sahihi kuliko ‘watoto.’
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: Majina yao yalikuwa haya
  rationale: Huu ni mtindo wa kawaida wa kutambulisha orodha ya majina; ‘yao’ huhifadhi kiambishi cha wingi wa kiume katika Kiebrania.
- source_word: עַזְרִיקָם בֹּכְרוּ
  choice: Azrikamu, mzaliwa wake wa kwanza
  rationale: בֹּכְרוּ humtambulisha Azrikamu kuwa mzaliwa wa kwanza wa Azeli; viakifishi vinaweka uhusiano huo wazi kwa Kiswahili cha kawaida.
- source_word: יִשְׁמָעֵאל וּשְׁעַרְיָה וְעֹבַדְיָה וְחָנָן
  choice: Ishmaeli, Shearia, Obadia na Hanani
  rationale: Majina yametoholewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili, huku orodha ikiwasilishwa kwa mtiririko wa kawaida.
- source_word: כָּל אֵלֶּה בְּנֵי אָצַל
  choice: Hao wote walikuwa wana wa Azeli
  rationale: Tafsiri hii inahifadhi hitimisho la wazi la nasaba na kurudia jina Azeli kama lilivyo katika Kiebrania.
