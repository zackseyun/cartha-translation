  rationale: Jina la mtu limetoholewa kwa Kiswahili huku sauti kuu za Kiebrania zikihifadhiwa.
- source_word: גֵרָא
  choice: Gera
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa.
- source_word: הוּא
  choice: yeye
  rationale: Kiwakilishi huru kina mkazo au kinarejelea upya mhusika; “yeye” huhifadhi hali hiyo na pia ugumu wa kubainisha rejeleo lake.
- source_word: הֶגְלָם
  choice: aliwapeleka uhamishoni
  rationale: Hifili ya גלה pamoja na kiambishi cha nafsi ya tatu wingi ina maana ya kuwasababisha waende uhamishoni; usemi huu huhifadhi maana ya kisababishi na yambwa “wao.”
- source_word: וְהוֹלִיד
  choice: naye akawazaa
  rationale: Katika nasaba, Hifili ya ילד humaanisha kuwa baba wa au kuzaa watoto; “akawazaa” ni ya sasa, fupi, na ya kawaida katika Kiswahili.
- source_word: עֻזָּא
  choice: Uza
  rationale: Jina la mtu limetoholewa kwa Kiswahili.
- source_word: אֲחִיחֻד
  choice: Ahihudi
  rationale: Jina la mtu limetoholewa kwa Kiswahili huku muundo wa jina la Kiebrania ukihifadhiwa.
