base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/040.yaml
  text: The sons of Ulam were mighty men of valor[a], drawers of the bow, and had many sons and grandsons, one hundred and fifty[c][b]. All these were from the sons of Benjamin.
translation:
  language: sw
  text: Wana wa Ulamu walikuwa wapiganaji hodari, wapiga mishale,[a] nao walikuwa na wana na wajukuu wengi, jumla yao mia moja na hamsini.[b] Hao wote walikuwa wazao wa Benyamini.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “wenye kuukanyaga upinde,” yaani wenye kuupinda upinde; ni nahau ya wapiga mishale.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinaweka tu “mia moja na hamsini” baada ya “wana na wajukuu,” bila neno la moja kwa moja linalomaanisha “jumla.”
    reason: source_ambiguity
  - marker: c
    text: Au “walitokana na wana wa Benyamini,” yaani walikuwa wa kabila la Benyamini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי אוּלָם
  choice: Wana wa Ulamu walikuwa
  rationale: Muundo huu unafuata kauli ya maelezo katika nasaba na unasikika kwa kawaida katika Kiswahili.
- source_word: אֲנָשִׁים גִּבֹּרֵי חַיִל
  choice: wapiganaji hodari
  rationale: Kirai hiki humaanisha watu wenye nguvu na ushujaa, mara nyingi katika muktadha wa kijeshi; tafsiri hii ni ya asili na yenye hadhi katika Kiswahili cha sasa.
- source_word: דֹּרְכֵי קֶשֶׁת
  choice: wapiga mishale
  rationale: Kihalisi kirai hiki hueleza wanaoukanyaga au kuupinda upinde, yaani wapiganaji waliotumia upinde; ‘wapiga mishale’ ndilo neno la kawaida la Kiswahili.
- source_word: וּמַרְבִּים בָּנִים וּבְנֵי בָנִים
  choice: nao walikuwa na wana na wajukuu wengi
  rationale: Hiphil ya רבה hapa inaeleza kuwa walikuwa na uzao mwingi; ‘wana na wajukuu’ huwasilisha kwa wazi ‘wana na wana wa wana.’
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: jumla yao mia moja na hamsini
  rationale: Namba imewekwa kama jumla ya wana na wajukuu waliotajwa, huku neno lililoongezwa ‘jumla’ likizuia isieleweke kuwa ni idadi ya wajukuu pekee.
- source_word: כָּל אֵלֶּה מִבְּנֵי בִנְיָמִן
  choice: Hao wote walikuwa wazao wa Benyamini
  rationale: מן pamoja na בני katika hitimisho hili la nasaba huonyesha chimbuko la kikabila; ‘wazao wa Benyamini’ ni wazi na ya kawaida kwa msomaji wa Kiswahili.
