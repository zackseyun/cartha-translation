  text: Adaiah[a], Beraiah, and Shimrath, the sons of Shimei.
translation:
  language: sw
  text: Adaya, Beraya[a], na Shimrathi, wana wa Shimei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania Beraya; baadhi ya mapokeo hutumia umbo fupi Beria.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדָיָה
  choice: Adaya
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili, bila kutafsiri maana yake.
- source_word: בְרָאיָה
  choice: Beraya
  rationale: Jina limetoholewa kwa kuzingatia alefu iliyo katikati ya umbo la Kiebrania; “Beraya” linaakisi umbo hilo kwa uwazi zaidi kuliko “Beria.”
- source_word: שִׁמְרָת
  choice: Shimrathi
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili, huku konsonanti ya mwisho tav ikiwakilishwa kwa “thi.”
- source_word: בְּנֵי
  choice: wana wa
  rationale: Ni wingi wa neno “mwana” katika hali ya uhusiano; “wana wa” ni usemi wa kawaida na unaofaa katika orodha ya nasaba.
- source_word: שִׁמְעִי
  choice: Shimei
  rationale: Jina la mtu limetoholewa kwa umbo linalotambulika katika matumizi ya Biblia ya Kiswahili.
