  register: Lugha ni fupi, yenye hadhi, na ya kawaida kwa orodha ya nasaba. Kiunganishi “na” kimehifadhiwa kabla ya jina la mwisho, na majina yametoholewa kwa namna inayosomeka katika Kiswahili sanifu cha Afrika Mashariki.
