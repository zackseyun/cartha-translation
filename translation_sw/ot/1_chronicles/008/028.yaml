base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/028.yaml
  text: These were heads of fathers’ houses according to their generations[a], chief men. These lived in Jerusalem.
translation:
  language: sw
  text: Hawa walikuwa wakuu wa nyumba za mababu kulingana na vizazi vyao[a]; walikuwa viongozi. Hawa waliishi Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakuu wa nyumba za mababu ... viongozi.” Kiebrania kinarudia mzizi wenye maana ya “kichwa/kiongozi” ili kusisitiza.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי אָבוֹת
  choice: viongozi wa jamaa za mababu
  rationale: Kirai hiki ni nahau inayowataja viongozi wa vikundi vya ukoo au nyumba za mababu. Tafsiri hii inaeleweka katika Kiswahili cha sasa huku ikihifadhi muundo wa kijamii wa Kiebrania.
- source_word: לְתֹלְדוֹתָם
  choice: kulingana na vizazi vyao
  rationale: Neno תולדות hapa linahusu vizazi au mistari ya ukoo; tafsiri hii inadumisha maana ya mpangilio wa kizazi bila kudai wazi kwamba yalikuwa maandishi ya nasaba.
- source_word: רָאשִׁים
  choice: wakuu
  rationale: Neno linarudia dhana ya 'kichwa/kiongozi' ili kusisitiza hadhi yao. 'Wakuu' huhifadhi msisitizo huo bila kurudia kwa namna ngumu kirai cha kwanza.
- source_word: יָשְׁבוּ
  choice: waliishi
  rationale: Katika taarifa hii ya nasaba, kitenzi kinaonyesha makao ya kudumu, si tendo la kuketi.
- source_word: בִירוּשָׁלָם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali katika Kiswahili, huku kihusishi בִּ kikitafsiriwa kwa maana ya mahali katika muundo wa kitenzi 'waliishi Yerusalemu'.
- source_word: אֵלֶּה ... אֵלֶּה
  choice: Hawa ... Hawa
  rationale: Kurudia kiwakilishi cha kuonyesha kunahifadhi muundo na msisitizo wa matini ya Kiebrania.
