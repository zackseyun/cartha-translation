base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/010.yaml
  text: and Jeuz[a], and Sachia, and Mirmah. These were his sons, heads of fathers’ houses.
translation:
  language: sw
  text: na Yeusi, na Sakia, na Mirma. Hawa walikuwa wanawe, wakuu wa nyumba za baba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “vichwa vya baba”; yaani, wakuu wa nyumba za mababu au koo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְעוּץ
  choice: Yeusi
  rationale: Jina la mtu limenukuliwa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, likifuata kwa karibu matamshi ya Kiebrania.
- source_word: שָׂכְיָה
  choice: Sakia
  rationale: Jina la mtu limenukuliwa badala ya kutafsiriwa; tahajia hii inawakilisha konsonanti na vokali za Kiebrania kwa namna ya asili katika Kiswahili.
- source_word: מִרְמָה
  choice: Mirma
  rationale: Katika nasaba hili ni jina la mtu, hivyo halitafsiriwi kwa maana ya nomino ya kawaida inayoweza kumaanisha udanganyifu.
- source_word: אֵלֶּה
  choice: Hao
  rationale: Kiwakilishi cha wingi kinawarejelea watu waliotajwa; 'hao' ni cha kawaida na wazi katika Kiswahili.
- source_word: בָנָיו
  choice: wanawe
  rationale: Huwakilisha 'wana wake' kwa ufupi na kwa lugha ya kawaida; katika muktadha wa nasaba, neno la Kiebrania linarejelea wana wa kiume.
- source_word: רָאשֵׁי אָבוֹת
  choice: viongozi wa jamaa za ukoo
  rationale: Nahau ya Kiebrania, kihalisi 'vichwa vya baba,' inamaanisha viongozi wa vitengo vya kifamilia vya ukoo. Tafsiri hii inaeleweka kwa wasomaji wa Kiswahili bila kupotosha maana.
