  text: and Michael, Ishpah, and Joha, the sons of Beriah.
translation:
  language: sw
  text: na Mikaeli, na Yishpa, na Yoha, wana wa Beria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִיכָאֵל
  choice: na Mikaeli
  rationale: Kiunganishi cha Kiebrania kimetafsiriwa kuwa “na”; jina limetoholewa kwa umbo la Kiswahili linalotambulika, “Mikaeli.”
- source_word: וְ/יִשְׁפָּה
  choice: na Yishpa
  rationale: Kiunganishi kinachorudiwa katika orodha kimehifadhiwa, na jina limenukuliwa kwa sauti kwa kuzingatia yod ya mwanzo na konsonanti sh.
- source_word: וְ/יוֹחָא
  choice: na Yoha
  rationale: Jina limenukuliwa kwa sauti kutoka Kiebrania, huku yod ya mwanzo ikiwakilishwa kwa Y na ח kwa h inayosomeka kwa urahisi katika Kiswahili.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii ya ukoo neno hilo linamaanisha wana wa kiume, lakini “wana wa” ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: בְרִיעָה
  choice: Beria
  rationale: Jina limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili bila kuongeza maana isiyokuwamo katika chanzo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo mfupi wa orodha ya ukoo. Kurudiwa kwa “na” kunahifadhi mpangilio na msisitizo wa viunganishi vya Kiebrania.
