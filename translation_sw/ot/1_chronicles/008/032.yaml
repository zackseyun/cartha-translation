  yaml_path: translation/ot/1_chronicles/008/032.yaml
  text: Mikloth fathered Shimeah[a]. They too lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: sw
  text: Miklothi akamzaa Shimea. Nao pia waliishi Yerusalemu, mkabala na ndugu zao[a], pamoja na ndugu zao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “karibu na ndugu zao”; kihusishi cha Kiebrania kinaweza kumaanisha mbele ya, mkabala na, au karibu na mtu.
    reason: lexical_alternative
  - marker: b
    text: Hapa “ndugu” huenda inamaanisha watu wa ukoo au jamaa wenzao katika nasaba ya Benyamini, wala si lazima ndugu wa tumbo moja tu.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: Miklothi
  rationale: Jina limetoholewa kwa umbo linalosomeka kwa urahisi katika Kiswahili; kiunganishi וּ kimetolewa kwa kitenzi cha masimulizi “akamzaa”.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, kitenzi hiki humaanisha kumzaa au kuwa baba wa mtu; “akamzaa” ni kifupi, cha kawaida, na kinahifadhi maana ya nasaba ya kiume.
- source_word: אֶת שִׁמְאָה
  choice: Shimea
  rationale: אֶת ni alama ya yambwa na haitafsiriwi; jina limetoholewa kama “Shimea”.
- source_word: וְאַף הֵמָּה
  choice: Nao pia
  rationale: Kauli hii inaunganisha sentensi na kusisitiza kwamba watu hao vilevile walihusika.
- source_word: נֶגֶד
  choice: mkabala na
  rationale: Neno linaonyesha mahali palipo mbele ya au panapokabiliana na pengine; “mkabala na” huhifadhi maana hiyo ya kijiografia bila kuipunguza kuwa ukaribu tu.
- source_word: אֲחֵיהֶם
  choice: ndugu zao
  rationale: Hii ndiyo maana ya moja kwa moja; katika muktadha wa nasaba inaweza pia kuwahusu watu wa ukoo mmoja.
- source_word: יָשְׁבוּ
  choice: waliishi
  rationale: Katika taarifa ya makazi, kitenzi hiki kwa kawaida humaanisha kukaa au kuishi mahali.
- source_word: בִירוּשָׁלִַם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali katika Kiswahili.
- source_word: עִם אֲחֵיהֶם
  choice: pamoja na ndugu zao
  rationale: עִם maana yake ni “pamoja na.” Kurudia “ndugu zao” kunafuata msisitizo wa Kiebrania na kuhifadhi mvutano wake na kauli “mkabala na”.
