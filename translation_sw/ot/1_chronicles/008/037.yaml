  text: And Moza fathered Binea; Rephah was his son, Eleasah his son, Azel his son.
translation:
  language: sw
  text: Mosa akamzaa Binea; Refa mwanawe, Eleasa mwanawe, Aseli mwanawe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֹוצָא
  choice: Mosa
  rationale: Kiunganishi וּ kinaendelezwa kwa mtindo wa simulizi kupitia kitenzi “akamzaa,” huku jina מֹוצָא likinakiliwa kwa tahajia ya Kiswahili kama “Mosa.”
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika orodha ya ukoo, Hifili ya ילד humaanisha kumzaa au kuwa baba wa mtu. “Akamzaa” ni fupi, ya kawaida, na inafaa mtiririko wa nasaba.
- source_word: בִּנְעָא
  choice: Binea
  rationale: Jina limenakiliwa kwa mfumo unaokaribia vokali za Kiebrania na unaosomeka kwa urahisi katika Kiswahili.
- source_word: רָפָה
  choice: Refa
  rationale: Tahajia “Refa” huakisi matamshi ya Kiebrania cha Kim soreti na kanuni za sauti za Kiswahili.
- source_word: בְנוֹ
  choice: mwanawe
  rationale: Kirai hiki humaanisha kihalisi “mwana wake.” Kurudiwa kwake kunahifadhi mtindo mfupi wa orodha ya ukoo na mfuatano wa vizazi.
- source_word: אֶלְעָשָׂה
  choice: Eleasa
  rationale: Jina limenakiliwa kwa kuzingatia silabi za Kiebrania na tahajia ya kawaida ya Kiswahili.
- source_word: אָצֵל
  choice: Aseli
  rationale: Jina limenakiliwa kwa tahajia inayolingana na sauti za Kiswahili; צ imewakilishwa kwa “s,” na vokali ya mwisho imesaidia jina kutamkika kwa kawaida.
theological_decisions: []
translation_notes:
  register: Lugha ni ya sasa, yenye heshima, na fupi kama inavyofaa orodha ya ukoo. “Alikuwa” imeongezwa katika kutaja Refa ili sentensi iwe ya kawaida katika Kiswahili, huku vifungu vinavyofuata vikibaki vya mkato na kuhifadhi muundo wa chanzo. Kurudiwa kwa “mwanawe” hakujafafanuliwa kwa majina ya baba katika kila hatua, ili kutoweka wazi zaidi ya chanzo uhusiano wa viwakilishi.
