base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/011.yaml
  text: And by Hushim he fathered Abitub and Elpaal[a].
translation:
  language: sw
  text: Naye, kwa Hushimu, akawa baba wa Abitubu na Elpaali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwa Hushimu.” Kihusishi cha Kiebrania kinaweza kutafsiriwa hivyo kwa uhalisi zaidi, lakini katika nasaba “kwa Hushimu” hueleza vizuri zaidi uhusiano wa uzazi kupitia kwake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֻשִׁים
  choice: Naye kwa Hushimu
  rationale: Kiunganishi וּ kinaendeleza mtiririko wa nasaba, na מֵ־ huonyesha chanzo au uhusiano. Katika muktadha huu, “kwa Hushimu” hueleza kwa kawaida kwamba watoto walizaliwa kupitia kwake, huku maana halisi zaidi ya “kutoka kwa Hushimu” ikihifadhiwa katika tanbihi.
- source_word: הוֹלִיד
  choice: akawazaa
  rationale: Hifili ya ילד katika nasaba humaanisha kuzaa au kuwa baba wa. “Akawazaa” ni Kiswahili cha sasa, fasaha, na huonyesha kwamba Abitubu na Elpaali ndio watoto wanaorejelewa.
- source_word: אֶת
  choice: '[haikutafsiriwa kando]'
  rationale: Ni kiashiria cha yambwa tendwa dhahiri katika Kiebrania, kisicho na neno linalolingana nacho moja kwa moja katika Kiswahili.
- source_word: אֲבִיטוּב
  choice: Abitubu
  rationale: Jina limetoholewa kwa mwandiko unaosomeka kwa kawaida katika Kiswahili, huku sauti kuu za jina la Kiebrania zikihifadhiwa.
- source_word: וְ/אֶת
  choice: na
  rationale: Kiunganishi וְ kimetafsiriwa “na”; kiashiria cha yambwa אֶת hakihitaji tafsiri tofauti.
- source_word: אֶלְפָּעַל
  choice: Elpaali
  rationale: Jina limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili bila alama ya mkato, huku muundo wake wa Kiebrania ukihifadhiwa kwa kiasi kinachofaa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye hadhi unaofaa orodha ya nasaba. “Naye” na “akawazaa” vinadumisha mwendelezo wa simulizi; majina yametoholewa kwa maumbo yanayosomeka kwa urahisi katika Kiswahili.
