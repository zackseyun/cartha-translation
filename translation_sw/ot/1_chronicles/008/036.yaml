base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/036.yaml
  text: Ahaz fathered Jehoaddah[a], and Jehoaddah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: sw
  text: Ahazi akamzaa Yehoadda[a], naye Yehoadda akawazaa Alemethi, Azmawethi na Zimri; naye Zimri akamzaa Moza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Yehoadda; baadhi ya mapokeo ya tafsiri huandika Yehoada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: akamzaa / akawazaa
  rationale: Katika nasaba, kausativi ya ילד inaonyesha kwamba mtu alikuwa baba wa aliyetajwa. Kitenzi “kuzaa” ni cha kawaida na kifupi katika nasaba za Kiswahili; upatanisho wa umoja au wingi umefuata idadi ya watoto waliotajwa.
- source_word: אֶת
  choice: '[haijatafsiriwa kivyake]'
  rationale: Hiki ni kiashiria cha yambwa bainifu katika Kiebrania; kazi yake inaonyeshwa na mpangilio wa kawaida wa maneno ya Kiswahili.
- source_word: יְהוֹעַדָּה
  choice: Yehoada
  rationale: Jina limenukuliwa kwa herufi za Kiswahili kwa kuzingatia umbo la konsonanti la maandishi ya Kiebrania yaliyotolewa.
- source_word: עָלֶמֶת
  choice: Alemethi
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili huku likihifadhi kwa karibu sauti ya Kiebrania.
- source_word: עַזְמָוֶת
  choice: Azmawethi
  rationale: Jina limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili, huku konsonanti kuu za Kiebrania zikihifadhiwa.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Jina limenukuliwa kwa uthabiti katika sehemu zote mbili linapotokea.
- source_word: מוֹצָא
  choice: Moza
  rationale: Jina limenukuliwa kwa umbo la Kiswahili linalokaribia matamshi ya Kiebrania.
- source_word: וְ
  choice: aka- / naye / na
  rationale: Kiunganishi cha Kiebrania huunganisha vizazi na orodha ya majina. Kiswahili cha asili hutumia kiambishi cha mfululizo “aka-”, “naye” katika mpito wa mhusika, na “na” katika orodha.
