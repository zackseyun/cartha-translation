lexical_decisions:
- source_word: גֵרָא
  choice: Gera
  rationale: Jina la mtu limetoholewa kwa kufuata matamshi ya Kiebrania na namna ya kawaida ya kuandika majina kwa Kiswahili.
- source_word: שְׁפוּפָן
  choice: Shefufani
  rationale: Jina la mtu limetoholewa kwa karibu kutoka katika umbo la Kiebrania la aya hii; umbo jingine, Shufamu, linapatikana katika orodha zinazohusiana.
- source_word: חוּרָם
  choice: Huramu
  rationale: Jina la mtu limetoholewa kutoka katika umbo la Kiebrania Huram, kwa kuongeza irabu ya mwisho ili liwe la kawaida katika tahajia na matamshi ya Kiswahili.
- source_word: וְ
  choice: na
  rationale: Kiunganishi hiki kinaunganisha majina katika orodha sahili; Kiswahili hutumia “na” kabla ya jina la mwisho.
