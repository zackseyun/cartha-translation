  rationale: Jina la mtu limetoholewa kwa kufuata matamshi ya Kiebrania na mtindo wa kawaida wa majina katika Kiswahili.
- source_word: הָרְבִיעִי
  choice: wa nne
  rationale: Kivumishi cha mp ترتيب kinachoonyesha nafasi yake katika orodha ya wana; “wa nne” ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: וְ
  choice: na
  rationale: Kiunganishi rahisi kinachounganisha jina linalofuata katika orodha.
- source_word: רָפָא
