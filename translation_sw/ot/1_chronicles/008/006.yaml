base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/006.yaml
  text: 'These were the sons of Ehud[a]. These were the heads of fathers’ houses for the inhabitants of Geba[b], and they carried them into exile to Manahath:'
translation:
  language: sw
  text: 'Hawa ndio wana wa Ehudi. Hawa ndio waliokuwa wakuu wa koo za mababu[a] za wakazi wa Geba, nao wakawapeleka uhamishoni Manahathi[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Usemi huu humaanisha viongozi wa koo au nyumba za mababu.
    reason: cultural_note
  - marker: b
    text: Au, “nao wakawahamisha hadi Manahathi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Hawa ndio
  rationale: Hutambulisha taarifa mpya ya nasaba kwa Kiswahili cha kawaida; kiunganishi cha mwanzo hakihitajiki ili kuhifadhi kazi yake katika mtiririko wa habari.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Ni tafsiri ya kawaida katika nasaba na inaweza pia kuwahusisha wazao bila kulazimisha ufafanuzi huo katika matini.
- source_word: אֵחוּד
  choice: Ehudi
  rationale: Jina la mtu limeandikwa kwa namna inayolingana na matumizi ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: אֵלֶּה הֵם
  choice: Hawa ndio waliokuwa
  rationale: Huhifadhi msisitizo wa usemi wa Kiebrania huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: רָאשֵׁי אָבוֹת
  choice: wakuu wa jamaa za ukoo
  rationale: Huwasilisha viongozi wa vitengo vya kijamii vilivyotokana na nyumba za mababu bila kutumia usemi mgumu usio wa kawaida katika Kiswahili.
- source_word: לְיֹשְׁבֵי גֶבַע
  choice: za wakazi wa Geba
  rationale: Kiambishi ל kinaonyesha uhusiano wa wakuu hao na wakazi wa Geba; 'za' huueleza uhusiano huo kwa kawaida bila kuufafanua kupita kiasi.
- source_word: גֶבַע
  choice: Geba
  rationale: Jina la mahali limenukuliwa kwa umbo linalotambulika katika Kiswahili.
- source_word: וַיַּגְלוּם
  choice: nao wakawapeleka uhamishoni
  rationale: Hifili ya גלה pamoja na kiambishi cha yambwa inaonyesha kuwafanya watu waende uhamishoni. Viwakilishi vya nafsi vimeachwa bila kuwataja wahusika ili kuhifadhi ukosefu wa uwazi wa marejeo katika Kiebrania.
- source_word: אֶל מָנָחַת
  choice: Manahathi
  rationale: Kihusishi cha mwelekeo kinaweza kuwasilishwa kwa Kiswahili bila 'hadi' au 'kwenda' baada ya 'wakawapeleka'; jina la mahali limenukuliwa kwa umbo la Kiswahili.
theological_decisions:
- issue: Marejeo ya mtenda na watendwa katika וַיַּגְלוּם
  choice: nao wakawapeleka
  alternative: na wakahamishwa
  rationale: Kitenzi cha Kiebrania kina mtenda wa wingi na yambwa wa wingi, lakini muktadha hauwataji wazi. Tafsiri inahifadhi viwakilishi hivyo badala ya kuamua kimyakimya ni makundi gani yaliyokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Wakuu wa jamaa za ukoo' huepuka tafsiri sisisi isiyo ya kawaida ya 'vichwa vya nyumba za baba,' na 'wakawapeleka uhamishoni' huhifadhi dhana ya kuhamishwa kwa lazima.
