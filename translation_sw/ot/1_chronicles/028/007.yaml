base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/007.yaml
  text: And I will establish his kingdom forever[a], if he is strong to do my commandments and my judgments[c][b], as at this day.
translation:
  language: sw
  text: Nami nitaimarisha ufalme wake milele[a], ikiwa atakuwa imara katika kutenda amri zangu na hukumu zangu[b], kama anavyofanya leo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitauthibitisha” au “nitaufanya ufalme wake usimame imara.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ikiwa atadumu kwa uthabiti kutenda amri zangu na hukumu zangu.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi katika Kiebrania, “kama siku hii,” yaani, kama anavyofanya sasa.
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲכִינוֹתִי
  choice: Nami nitaimarisha
  rationale: Hifili ya כון ina maana ya kusababisha kitu kisimame imara au kukithibitisha. “Nitaimarisha” ni Kiswahili cha kawaida kinachofaa katika muktadha wa ufalme.
- source_word: מַלְכוּתוֹ
  choice: ufalme wake
  rationale: מַלְכוּת inaweza kumaanisha ufalme, utawala, au mamlaka ya kifalme. “Ufalme wake” ni pana, ya asili katika Kiswahili, na inafaa kwa ahadi kuhusu kudumu kwa nasaba.
- source_word: עַד לְעוֹלָם
  choice: milele
  rationale: Kirai hiki kinaonyesha kudumu bila kikomo; “milele” kina nguvu hiyo kwa lugha fupi na ya kawaida.
- source_word: אִם
  choice: ikiwa
  rationale: Neno hili linaanzisha sharti wazi. “Ikiwa” linahifadhi moja kwa moja hali ya masharti ya ahadi.
- source_word: יֶחֱזַק
  choice: atakuwa imara
  rationale: חזק hapa huonyesha nguvu, uthabiti, au azimio la kushikilia utii. “Atakuwa imara” huhifadhi maana hiyo bila kuigeuza kuwa sifa ya kimwili pekee.
- source_word: לַעֲשׂוֹת
  choice: katika kutenda
  rationale: Infinitivu ya עשה ni “kutenda/kufanya.” “Katika kutenda” inaunganika kwa kawaida na “atakuwa imara” na kubaki karibu na kitenzi cha Kiebrania.
- source_word: מִצְוֺתַי
  choice: amri zangu
  rationale: “Amri” ni neno la kawaida na lenye hadhi kwa מִצְוֹת, huku likihifadhi maana yake ya maagizo yenye mamlaka.
- source_word: וּמִשְׁפָּטַי
  choice: na hukumu zangu
  rationale: מִשְׁפָּטִים inaweza kuwa hukumu, masharti ya sheria, au kanuni. “Hukumu” huhifadhi ladha ya kisheria na ulinganifu wake na “amri.”
- source_word: כַּיּוֹם הַזֶּה
  choice: kama anavyofanya leo
  rationale: Nahau ya Kiebrania ni kihalisi “kama siku hii,” lakini katika muktadha inaelekeza kwenye mwenendo wake wa sasa. Utoaji huu ni wa kawaida kwa Kiswahili na maelezo ya kihalisi yanawekwa katika tanbihi.
theological_decisions:
- issue: Masharti ya ahadi kuhusu ufalme wa Sulemani
  choice: 'Ahadi imetolewa kwa sharti la wazi: “ikiwa atakuwa imara katika kutenda.”'
  alternative: Kuitoa kama maelezo tu ya tabia ya Sulemani na hivyo kupunguza nguvu ya sharti.
  rationale: אִם linaanzisha sharti dhahiri. Tafsiri inapaswa kuhifadhi mvutano huo wa kiteolojia badala ya kuupatanisha kimya kimya na sehemu nyingine zinazosisitiza ahadi ya Daudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida; maneno ya kisheria “amri” na “hukumu” yamehifadhiwa, na sharti la ahadi halijapunguzwa.
