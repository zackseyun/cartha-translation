id: 1CH.28.4
reference: 1 Chronicles 28:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּבְחַ֡ר יְהוָ֣ה אֱלֹהֵי֩ יִשְׂרָאֵ֨ל בִּ֜/י מִ/כֹּ֣ל בֵּית אָבִ֗/י לִ/הְי֨וֹת לְ/מֶ֤לֶךְ עַל יִשְׂרָאֵל֙ לְ/עוֹלָ֔ם כִּ֤י בִֽ/יהוּדָה֙ בָּחַ֣ר לְ/נָגִ֔יד וּ/בְ/בֵ֥ית יְהוּדָ֖ה בֵּ֣ית אָבִ֑/י וּ/בִ/בְנֵ֣י אָבִ֔/י בִּ֣/י רָצָ֔ה לְ/הַמְלִ֖יךְ עַל כָּל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/004.yaml
  text: Yet Yahweh[a], the God of Israel, chose me from all my father's house to be king over Israel forever; for he chose Judah as leader, and in the house of Judah, my father's house, and among my father's sons[b], he took pleasure in me to make me king over all Israel.
translation:
  language: sw
  text: Hata hivyo Yahweh, Mungu wa Israeli, alinichagua kutoka katika jamaa yote ya baba yangu ili niwe mfalme juu ya Israeli milele[a]. Kwa maana alimchagua Yuda awe kiongozi[b]; na katika nyumba ya Yuda, katika jamaa ya baba yangu, na miongoni mwa wana wa baba yangu, alipendezwa nami na kunifanya mfalme juu ya Israeli yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “milele” hapa linaelekeza kwenye kudumu kwa ufalme wa ukoo wa Daudi, si lazima muda wa maisha ya Daudi peke yake.
    reason: cultural_note
  - marker: b
    text: Au “mtawala” au “mkuu”; neno la Kiebrania nagid humaanisha kiongozi mwenye mamlaka aliyewekwa rasmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA,” ili kuhifadhi jina binafsi lililo katika Kiebrania.
- source_word: וַיִּבְחַר / בָּחַר
  choice: alinichagua / alimchagua / akaichagua
  rationale: 'Mzizi בחר una maana ya kuchagua. Kurudia kitenzi katika sehemu ya ukoo wa Yuda kunadhihirisha mfululizo wa uchaguzi unaodokezwa na muundo wa Kiebrania: Yuda, jamaa ya baba yake, kisha Daudi.'
- source_word: בֵּית אָבִי
  choice: jamaa ya baba yangu
  rationale: Hapa “nyumba” ni kundi pana la kifamilia, si jengo wala watu wa nyumbani tu; “jamaa” ni Kiswahili cha kawaida kinacholeta maana hiyo.
- source_word: לִהְיוֹת לְמֶלֶךְ
  choice: ili niwe mfalme
  rationale: Muundo huu unaonyesha kusudi au matokeo ya uchaguzi wa Daudi kuwa mfalme.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Neno linahifadhi upeo wa kudumu wa ufalme wa Daudi bila kuamua ndani ya tafsiri namna ahadi hiyo inavyotimizwa.
- source_word: לְנָגִיד
  choice: awe kiongozi
  rationale: נָגִיד humaanisha mwenye uongozi au utawala aliyewekwa rasmi. “Kiongozi” ni neno la sasa na la kawaida, huku tanbihi ikihifadhi uwezekano wa “mtawala” au “mkuu.”
- source_word: בְּבֵית יְהוּדָה
  choice: katika ukoo wa Yuda
  rationale: “Ukoo wa Yuda” huonyesha kundi la nasaba na kuhifadhi kihusishi “katika,” huku ikiepuka dhana ya jengo.
- source_word: וּבִבְנֵי אָבִי
  choice: miongoni mwa wana wa baba yangu
  rationale: Tafsiri hii inahifadhi usemi mahususi wa Kiebrania badala ya kuufupisha kuwa “ndugu zangu.”
- source_word: בִּי רָצָה
  choice: alipendezwa nami
  rationale: רצה hapa huonyesha kibali au kupendezwa, si tendo la kuchagua tu; hivyo tofauti na בחר inadumishwa.
- source_word: לְהַמְלִיךְ
  choice: kunifanya mfalme
  rationale: 'Hifili ya מלך ni ya kusababisha: kumweka au kumfanya mtu awe mfalme.'
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: juu ya Israeli yote
  rationale: Usemi huu unahifadhi mamlaka ya kifalme na upeo wake kwa Israeli nzima.
theological_decisions:
- issue: Maana ya לְעוֹלָם kuhusu ufalme wa Daudi
  choice: milele
  alternative: kwa wakati wote / daima
  rationale: “Milele” huhifadhi uzito wa ahadi na upeo wa kudumu wa nasaba ya Daudi, bila kuufanya mstari useme wazi namna ya utimilifu wa baadaye.
- issue: Maana ya נָגִיד
  choice: kiongozi
  alternative: mtawala / mkuu
  rationale: Neno la Kiebrania linaweza kuonyesha kiongozi mwenye mamlaka rasmi bila kulazimisha tofauti ya kitaalamu kati ya “mfalme” na “mkuu.” Tanbihi inaacha upana huo wazi.
- issue: Mfululizo wa uchaguzi ndani ya Yuda
  choice: Kitenzi “akaichagua” kimewekwa wazi katika Kiswahili kwa jamaa ya baba ya Daudi
  alternative: Kuacha kishazi bila kitenzi kama katika muundo mkato wa Kiebrania
  rationale: Kiebrania kinadokeza hatua zinazozidi kuwa mahususi. Kurudia kitenzi kunafanya Kiswahili kiwe wazi bila kubadili mhusika wa uchaguzi au kuongeza dai jipya la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. “Jamaa” na “ukoo” zimetumiwa kutofautisha makundi ya kifamilia na jengo la nyumba. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayofafanuliwa.
