  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/לְ/מִזְבַּ֧ח הַ/קְּטֹ֛רֶת זָהָ֥ב מְזֻקָּ֖ק בַּ/מִּשְׁקָ֑ל וּ/לְ/תַבְנִ֣ית הַ/מֶּרְכָּבָ֗ה הַ/כְּרֻבִ֤ים זָהָב֙ לְ/פֹ֣רְשִׂ֔ים וְ/סֹכְכִ֖ים עַל אֲר֥וֹן בְּרִית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/018.yaml
  text: and for the altar of incense[a], refined gold by weight; and for the pattern of the chariot[b], the cherubim of gold spreading out their wings and overshadowing the ark of the covenant of Yahweh.
translation:
  language: sw
  text: na kwa ajili ya madhabahu ya kufukizia uvumba, dhahabu iliyosafishwa kwa uzani; na kwa ajili ya kielelezo cha gari[a], makerubi wa dhahabu waliotandaza mabawa yao, wakilifunika[b] sanduku la agano la Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mpango” au “mfano wa gari.” Kirai cha Kiebrania ni kigumu; huenda kinarejelea muundo wa makerubi uliohusishwa na sanduku na kiti cha enzi.
    reason: alternative_reading
  - marker: b
    text: Au “kulikinga kwa juu.” Taswira ni ya makerubi waliotandaza mabawa yao juu ya sanduku.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: madhabahu ya kufukizia uvumba
  rationale: Hutaja kwa uwazi madhabahu iliyotumiwa kufukizia uvumba na ni Kiswahili cha kawaida katika muktadha wa ibada.
- source_word: זָהָב מְזֻקָּק
  choice: dhahabu iliyosafishwa
  rationale: Kitenzi cha Kiebrania kinaonyesha dhahabu iliyopitishwa katika mchakato wa kusafishwa; tafsiri hii inalinda maana hiyo ya kimetali.
- source_word: בַּמִּשְׁקָל
  choice: kwa uzani
  rationale: Kirai kinaonyesha kwamba dhahabu ilitengwa au kuainishwa kwa kipimo cha uzani.
- source_word: תַבְנִית
  choice: kielelezo
  rationale: Neno linaweza kumaanisha umbo, mfano, ramani, au mpango. “Kielelezo” kinafaa katika muktadha wa muundo wa hekalu bila kuamua kupita kiasi kama ulikuwa mchoro au mfano wa kitu.
- source_word: הַמֶּרְכָּבָה
  choice: gari
  rationale: Maana ya msingi ni gari, hasa gari la kukokotwa. Tafsiri hii inalinda usemi mgumu wa Kiebrania bila kuufafanua kimyakimya kuwa kiti cha enzi.
- source_word: הַכְּרֻבִים
  choice: makerubi
  rationale: Hili ni neno la kawaida la kibiblia la Kiswahili kwa viumbe hawa na linaonyesha wazi wingi wa neno la Kiebrania.
- source_word: לְפֹרְשִׂים
  choice: yaliyotandaza mabawa yao
  rationale: Kitenzi kina maana ya kutandaza au kunyoosha. Mabawa, ingawa hayatajwi moja kwa moja katika kirai hiki, yanaeleweka kutokana na taswira inayojulikana ya makerubi juu ya sanduku.
- source_word: וְסֹכְכִים
  choice: na kulifunika
  rationale: Kitenzi kina maana ya kufunika au kukinga juu ya kitu; “kulifunika” ni cha kawaida na kinaacha taswira ya mabawa yaliyoenea juu ya sanduku.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahwe
  rationale: Tafsiri hii inahifadhi mfuatano kamili wa maneno na kulitaja jina la agano יְהוָה moja kwa moja kama “Yahwe.”
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina maalumu la Mungu, si cheo cha jumla. “Yahwe” hulihifadhi kama jina bila kulibadilisha kuwa cheo.
- issue: Maana ya הַמֶּרְכָּבָה katika muundo wa makerubi
  choice: gari
  alternative: gari-kiti cha enzi; muundo wa makerubi unaofanana na kiti cha enzi
  rationale: Ingawa huenda taswira hiyo inahusiana na kiti cha enzi cha Mungu juu ya makerubi, mstari wenyewe unasema “gari.” Tafsiri haipaswi kuondoa mvutano huo wa kiteolojia na kitamathali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha unaoanza kwa “na kwa ajili ya” umehifadhiwa kwa sababu mstari huu unaendeleza maelezo yaliyotangulia. Neno “gari” limeachwa bila nyongeza ya “la vita” au “la enzi” ili kutohitimisha maana ya kirai kigumu cha Kiebrania.
