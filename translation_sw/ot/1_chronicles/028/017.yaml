base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/017.yaml
  text: and the forks, the basins, and the pitchers of pure gold; and for the golden bowls, by weight for each bowl and bowl; and for the silver bowls, by weight for each bowl and bowl.
translation:
  language: sw
  text: na uma, mabeseni, na mitungi[b], vyote vya dhahabu safi; na kwa mabakuli ya dhahabu, uzito uliowekwa kwa kila bakuli[a]; na kwa mabakuli ya fedha, uzito uliowekwa kwa kila bakuli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hurudia neno “bakuli,” yaani kihalisi, “kwa bakuli na bakuli.” Huu ni usemi wa kugawa unaomaanisha kwamba kila bakuli lilikuwa na uzito wake uliowekwa.
    reason: lexical_alternative
  - marker: b
    text: 'Au: vyombo vya kumiminia. Neno la Kiebrania hutaja chombo kinachotumiwa kumiminia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּזְלָגוֹת
  choice: uma
  rationale: Neno hili hutaja vyombo vya Hekalu vyenye meno kama uma. “Uma” ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa.
- source_word: מִּזְרָקוֹת
  choice: mabeseni
  rationale: Neno hili hutaja vyombo vya ibada vilivyotumiwa katika huduma ya dhabihu. “Mabeseni” linavitofautisha na כְפוֹרֵי, zilizotafsiriwa “bakuli” baadaye katika mstari.
- source_word: קְּשָׂוֹת
  choice: mitungi
  rationale: Neno hili linaelekea kutaja vyombo vya kumiminia. “Mitungi” ni tafsiri ya kawaida na yenye hadhi, huku tanbihi ikihifadhi uwezekano wa kuvieleza kwa kazi yake.
- source_word: זָהָב טָהוֹר
  choice: ya dhahabu safi
  rationale: Kirai hiki kinaeleza nyenzo ya vyombo vitatu vilivyotajwa kabla yake; muundo huu ni wa asili katika Kiswahili.
- source_word: כְפוֹרֵי
  choice: bakuli
  rationale: Katika orodha hii neno linataja vyombo vinavyoelekea kuwa na umbo la bakuli. “Bakuli” pia linadumisha tofauti na מִּזְרָקוֹת, yaani “mabeseni.”
- source_word: בְּמִשְׁקָל
  choice: uzito uliowekwa
  rationale: Kirai kinaonyesha kwamba kiasi cha metali kilipangwa kwa kufuata uzito wa kila chombo. Hii huwasilisha maana hiyo kwa Kiswahili cha kawaida kuliko tafsiri ngumu ya neno kwa neno.
- source_word: לִכְפוֹר וּכְפוֹר
  choice: kwa kila bakuli
  rationale: Kurudiwa kwa nomino katika Kiebrania ni matumizi ya kigawanyo, yaani kila bakuli lilitengewa uzito wake. Kiswahili cha asili huwasilisha hilo kwa “kila bakuli,” huku tanbihi ikitaja umbo la Kiebrania.
- source_word: כֶּסֶף
  choice: fedha
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa metali hii, likitofautishwa na dhahabu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida. Muundo wa mstari umehifadhiwa kama mwendelezo wa orodha ya mstari uliotangulia. Marudio ya kigawanyo ya Kiebrania yamewasilishwa kwa “kila bakuli” ili kuepuka usemi usio wa kawaida wa Kiswahili, na umbo halisi limehifadhiwa katika tanbihi.
