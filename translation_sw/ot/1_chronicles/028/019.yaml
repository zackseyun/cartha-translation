base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/019.yaml
  text: All this he made clear to me in writing from the hand of Yahweh[b][a], all the works of the pattern.
translation:
  language: sw
  text: Haya yote—kazi zote za mpango—Yahwe alinifanya niyaelewe kwa maandishi, kutoka mkononi mwake[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mkono wa Yahwe ulikuwa juu yangu, naye alinifanya nielewe kazi zote za mpango kwa maandishi.”
    reason: alternative_reading
  - marker: b
    text: “Mpango” pia inaweza kutafsiriwa “kielelezo” au “mchoro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: Haya yote
  rationale: Muktadha unaonyesha kuwa Daudi anarejelea maelezo yote ya Hekalu aliyokuwa ametoka kuyataja; “haya yote” ni Kiswahili cha kawaida kinachohifadhi maana pana ya כֹּל.
- source_word: בִּכְתָב
  choice: kwa maandishi
  rationale: Kirai hiki kinaonyesha kuwa maelekezo yalitolewa katika namna iliyoandikwa, si kwa maneno ya mdomo pekee.
- source_word: מִיַּד יְהוָה
  choice: yaliyotoka mkononi mwa Yahwe
  rationale: Taswira ya Kiebrania ya kitu kutoka “mkononi” mwa Yahwe imehifadhiwa ili kuonyesha kwamba kilitokana naye moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kulibadilisha kuwa cheo.
- source_word: הִשְׂכִּיל
  choice: alinielewesha
  rationale: Hifili ya שׂכל ina maana ya kumwezesha mtu kuelewa; “alinielewesha” ni ya asili katika Kiswahili na inadumisha maana yake ya kisababishi.
- source_word: כֹּל מַלְאֲכוֹת
  choice: kazi zote
  rationale: Usemi huu unajumuisha kazi, shughuli, au ufundi wote uliohitajika kutekeleza mpango.
- source_word: הַתַּבְנִית
  choice: mpango
  rationale: Katika muktadha wa ujenzi wa Hekalu, “mpango” ni neno la kawaida na wazi; tanbihi inadumisha uwezekano wa “kielelezo” au “mchoro.”
theological_decisions:
- issue: Jinsi ya kuelewa kirai kifupi עָלַי הִשְׂכִּיל
  choice: Yahwe ndiye kiima kilichodokezwa cha “alinielewesha,” na maandishi yanatoka mkononi mwake.
  alternative: “Mkono wa Yahwe ulikuwa juu yangu, naye akanielewesha kazi zote za mpango.”
  rationale: Kiebrania kina muundo mfupi unaoweza kuhusianisha עָלַי na “mkono wa Yahwe” au na tendo la kumpa Daudi ufahamu. Tafsiri kuu ni wazi kwa Kiswahili bila kuondoa usomaji mwingine, ambao umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umefanywa wa asili kwa Kiswahili, huku taswira ya “mkono wa Yahwe,” namna ya maandishi, na utata halisi wa sintaksia ya Kiebrania vikihifadhiwa.
