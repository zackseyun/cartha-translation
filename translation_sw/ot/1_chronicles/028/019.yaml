  terminology: “Yahwe,” “mkono,” “kazi zote,” na “mpango” zinafaa. “Mpango” ni tafsiri nzuri ya תַּבְנִית katika muktadha huu; tanbihi ya “kielelezo” au “mchoro” inadumisha upeo wa neno. Neno “maelekezo” katika sentensi kuu husaidia kueleza kwa Kiswahili kitu kinachotolewa “kwa maandishi,” bila kupunguza maana ya chanzo.
