base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/014.yaml
  text: the weight of the gold for all the articles of every kind of service[a], and the weight of the silver for all the articles of every kind of service.
translation:
  language: sw
  text: uzito wa dhahabu kwa ajili ya vyombo vyote vya kila aina ya huduma[a], na uzito wa fedha kwa ajili ya vyombo vyote vya kila aina ya huduma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinarudia “huduma na huduma,” usemi wa ugawaji wenye maana kama “kwa kila aina ya huduma” au “kwa kila matumizi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָהָב
  choice: dhahabu
  rationale: Ni jina la msingi la metali hii; katika mtindo huu wa orodha Kiswahili hakihitaji kurudia kiashiria cha uainisho cha Kiebrania.
- source_word: בַּמִּשְׁקָל
  choice: uzito wa
  rationale: Katika sentensi hii fupi ya kiorodha, kifungu kinaonyesha kiasi kilichopimwa cha metali; ‘uzito wa’ kinaendana kiasili na mpangilio sambamba wa dhahabu na fedha.
- source_word: כְּלֵי
  choice: vyombo
  rationale: Neno hili pana linataja vitu vilivyotumiwa katika huduma ya hekalu bila kuvifunga kuwa makasha au zana pekee.
- source_word: עֲבוֹדָה
  choice: huduma
  rationale: Katika muktadha wa hekalu neno hili linahusu kazi au huduma inayofanywa; ‘huduma’ ni la kawaida, lenye staha, na linafaa kimuktadha.
- source_word: עֲבוֹדָה וַעֲבוֹדָה
  choice: kila aina ya huduma
  rationale: Urudiaji wa Kiebrania una nguvu ya ugawaji, ukitofautisha matumizi au kazi mbalimbali; tafsiri hii inahifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: כֶּסֶף
  choice: fedha
  rationale: Hapa ni metali ya fedha, sambamba na dhahabu.
- source_word: לְכָל / לְכֹל
  choice: kwa ajili ya ... vyote
  rationale: Muundo huu unaonyesha kusudi pamoja na upeo wote wa vyombo vinavyohusika.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo mfupi wa orodha umehifadhiwa. ‘Vyombo’ limetumiwa kwa maana pana ya vitu vya huduma ya hekalu, na tanbihi inadumisha uwazi kuhusu urudiaji wa Kiebrania.
