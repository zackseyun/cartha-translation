base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/003.yaml
  text: But God said to me[a], ‘You shall not build a house for my name[b], because you are a man of wars and have shed blood.’
translation:
  language: sw
  text: Lakini Mungu aliniambia, “Hutajenga nyumba kwa ajili ya jina langu[b], kwa sababu wewe ni mtu wa vita[a], nawe umemwaga damu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shujaa wa vita.” Kiebrania kinasema kihalisi “mtu wa vita,” neno “vita” likiwa katika wingi.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba kwa ajili ya jina langu” ni hekalu kama mahali panapohusianishwa na jina na uwepo wa Mungu.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָאֱלֹהִים
  choice: Lakini Mungu
  rationale: 'Kiunganishi וְ hapa kina nguvu ya utofautishaji katika maelezo ya Daudi: alitaka kujenga, lakini Mungu alimkataza. “Mungu” humrejelea Mungu wa Israeli.'
- source_word: אָמַר לִי
  choice: aliniambia
  rationale: Hii ni tafsiri ya kawaida na ya asili ya Kiswahili kwa ‘alisema kwangu,’ huku ikidumisha kwamba Mungu alimwelekezea Daudi maneno hayo.
- source_word: לֹא תִבְנֶה
  choice: Hutajenga
  rationale: Muundo huu wa Kiswahili unaweza kueleza katazo au tamko la kile ambacho Daudi hataruhusiwa kufanya, hivyo unahifadhi kwa kiasi kikubwa mvutano wa Kiebrania.
- source_word: בַיִת
  choice: nyumba
  rationale: Neno la Kiebrania linamaanisha moja kwa moja ‘nyumba.’ Katika muktadha huu ni hekalu, lakini ‘nyumba’ huhifadhi tamathali ya chanzo bila kuifafanua ndani ya matini.
- source_word: לִשְׁמִי
  choice: kwa ajili ya jina langu
  rationale: Huhifadhi usemi wa kibiblia unaohusianisha patakatifu na jina na uwepo wa Mungu, bila kuubadili moja kwa moja kuwa ‘hekalu langu.’
- source_word: כִּי
  choice: kwa sababu
  rationale: Huonyesha wazi sababu ambayo Mungu anaitoa kwa katazo hilo.
- source_word: אִישׁ מִלְחָמוֹת
  choice: mtu wa vita
  rationale: Ingawa Kiebrania kina wingi, yaani ‘mtu wa vita mbalimbali,’ “mtu wa vita” ni usemi wa asili wa Kiswahili na bado unaonyesha kwamba Daudi alitambulika kwa kushiriki vita.
- source_word: וְדָמִים שָׁפָכְתָּ
  choice: nawe umemwaga damu
  rationale: “Kumwaga damu” ni nahau ya asili ya Kiswahili inayolingana na nahau ya Kiebrania. Hailazimishi uamuzi kwamba kila umwagaji huo ulikuwa na hatia ya kimaadili.
theological_decisions:
- issue: Sababu ya Daudi kuzuiwa kujenga hekalu
  choice: Matini inasema kwamba kuwa mtu wa vita na kumwaga damu ndizo sababu Mungu alizotoa za kumzuia Daudi kujenga nyumba kwa ajili ya jina lake.
  alternative: Umwagaji damu ulikuwa hasa dhambi yenye hatia, au ulikuwa tu hali iliyomfanya Daudi asifae kwa jukumu hilo licha ya vita vyake kuwa halali.
  rationale: Aya haisemi wazi ikiwa umwagaji damu huo ulikuwa dhambi, unajisi wa kiibada, au kutofaa tu kwa mjenzi wa hekalu. Tafsiri haiongezi hukumu ambayo Kiebrania hakitamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Hutajenga” hudumisha uzito wa kauli ya Mungu bila kulazimisha tofauti kati ya katazo na tamko. Alama [a] imewekwa kwenye usemi unaohusu vita, ambako maelezo yake yanahusika, na [b] kwenye “jina langu.”
