base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/005.yaml
  text: And from among all my sons—for Yahweh has given me many sons—he chose Solomon my son to sit on the throne of the kingdom of Yahweh over Israel[a][b].
translation:
  language: sw
  text: Na kutoka miongoni mwa wanangu wote—kwa maana Yahwe amenipa wana wengi—Yahwe alimchagua Sulemani, mwanangu, ili akae kwenye kiti cha enzi cha ufalme wa Yahwe juu ya Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai “kiti cha enzi cha ufalme wa Yahwe” kinakazia kwamba ufalme wa Israeli ni wa Yahwe hatimaye, ingawa Sulemani ndiye mfalme wa kibinadamu.
    reason: cross_reference
lexical_decisions:
- source_word: וּמִכָּל בָּנַי
  choice: Na kutoka miongoni mwa wanangu wote
  rationale: Muundo huu unaonyesha wazi kwamba uchaguzi ulifanywa kutoka katika kundi lote la wana wa Daudi; “wanangu” ni Kiswahili cha kawaida na sahihi kwa בָּנַי katika muktadha wa urithi wa kifalme.
- source_word: כִּי רַבִּים בָּנִים נָתַן לִי יְהוָה
  choice: kwa maana Yahwe amenipa wana wengi
  rationale: כִּי linaanzisha maelezo ya ziada, hivyo “kwa maana” linafaa. “Amenipa” linaonyesha matokeo yanayoendelea ya tendo lililopita bila kuondoa uwezekano wa kulitafsiri kwa wakati uliopita.
- source_word: וַיִּבְחַר בִּשְׁלֹמֹה בְנִי
  choice: alimchagua mwanangu Sulemani
  rationale: Kitenzi kina Yahwe kama mtendaji anayeendelea kutoka kishazi kilichotangulia. Mpangilio “mwanangu Sulemani” ni wa asili katika Kiswahili.
- source_word: לָשֶׁבֶת עַל כִּסֵּא
  choice: aketi kwenye kiti
  rationale: Katika muktadha wa kutawazwa, ישׁב pamoja na כִּסֵּא humaanisha kuketi katika nafasi ya kutawala. “Kwenye kiti” ni usemi wa asili kuliko tafsiri ya neno kwa neno “juu ya kiti.”
- source_word: מַלְכוּת יְהוָה
  choice: ufalme wa Yahwe
  rationale: Inahifadhi mnyororo wa umilikaji wa Kiebrania na msisitizo kwamba ufalme huo ni wa Yahwe, si wa mfalme wa kibinadamu pekee.
- source_word: עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: עַל hapa huonyesha mamlaka ya kutawala; “juu ya Israeli” ni usemi unaoeleweka na unaohifadhi uhusiano huo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: “Yahwe” linawakilisha jina binafsi la agano lililo katika maandishi ya Kiebrania bila kulibadilisha kuwa cheo.
- issue: Maana ya כִּסֵּא מַלְכוּת יְהוָה
  choice: kiti cha ufalme wa Yahwe
  alternative: kiti cha kifalme; kiti cha ufalme wa Israeli
  rationale: Tafsiri inahifadhi kirai chote na dai lake la kiteolojia kwamba ufalme wa Israeli ni wa Yahwe hatimaye, ingawa Sulemani ndiye mfalme wa kibinadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mabano marefu yanaonyesha kwamba kishazi kuhusu wana wengi ni maelezo ya ziada. “Wana” limetumiwa kwa usahihi wa muktadha wa wana wa kiume na urithi wa kifalme.
