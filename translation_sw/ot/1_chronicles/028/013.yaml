  yaml_path: translation/ot/1_chronicles/028/013.yaml
  text: for the divisions of the priests and the Levites[a], and for all the work of the service of the house of Yahweh[b], and for all the vessels of service of the house of Yahweh.
translation:
  language: sw
  text: kwa ajili ya makundi ya makuhani na Walawi[a], kwa ajili ya kazi zote za huduma ya nyumba ya Yahwe, na kwa ajili ya vyombo[b] vyote vya huduma ya nyumba ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “zamu za makuhani na Walawi.”
    reason: lexical_alternative
  - marker: b
    text: “Vyombo” hapa linaweza pia kumaanisha vifaa au zana za huduma, si makontena pekee.
    reason: lexical_scope
lexical_decisions:
- source_word: מַחְלְקוֹת
  choice: makundi
  rationale: Katika Mambo ya Nyakati neno hili humaanisha makundi yaliyopangwa ya makuhani na Walawi kwa majukumu au zamu maalumu. “Makundi” ni Kiswahili cha kawaida na huhifadhi maana hiyo ya kiutawala.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kundi la kikuhani la Israeli.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Jina la kabila na kundi la wahudumu limewasilishwa kwa umbo lake la kawaida katika Kiswahili cha Biblia.
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: kazi zote za huduma
  rationale: Muunganiko huu unahusu jumla ya kazi zinazohusiana na huduma ya nyumba ya Yahwe. Tafsiri hii huhifadhi tofauti kati ya “kazi” na “huduma” bila kuwa nzito.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: Tafsiri ya karibu ya usemi wa Kiebrania “nyumba ya YHWH”; “nyumba” huhifadhi taswira ya asili, na jina la agano limetolewa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: כְּלֵי
  choice: vyombo
  rationale: Neno hili pana linaweza kumaanisha vitu, vifaa, au zana zinazotumiwa katika huduma. “Vyombo” ni neno lililozoeleka katika muktadha wa ibada, huku tanbihi ikizuia lisieleweke kuwa makontena pekee.
- source_word: לְכָל
  choice: kwa ajili ya ... vyote
  rationale: Kirai hiki kinachorudiwa kinaendeleza orodha ya mambo yaliyohusishwa na mpango. “Kwa ajili ya” huwasilisha kazi ya kihusishi kwa Kiswahili cha asili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina maalumu la agano, si cheo. “Yahwe” hulihifadhi jina hilo waziwazi bila kulibadilisha kuwa “BWANA”.
- issue: Maana ya עֲבוֹדָה katika muktadha wa hekalu
  choice: huduma
  alternative: utumishi
  rationale: “Huduma” huonyesha majukumu ya ibada na kazi zilizokabidhiwa bila kuingiza maana maalumu ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kirai unaendelezwa kwa “kwa ajili ya,” kwa kuwa mstari huu ni sehemu ya orodha inayoanza katika muktadha uliotangulia. Marudio ya “nyumba ya Yahwe” yamehifadhiwa kwa kufuata msisitizo wa Kiebrania.
