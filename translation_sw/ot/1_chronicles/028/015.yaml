base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/015.yaml
  text: and the weight for the lampstands of gold and their lamps of gold[a], by the weight of each lampstand and its lamps; and for the lampstands of silver, by weight for each lampstand and its lamps, according to the service of each lampstand.
translation:
  language: sw
  text: na uzito kwa ajili ya vinara vya taa vya dhahabu na taa zake za dhahabu, kwa uzito wa kila kinara cha taa pamoja na taa zake; na kwa ajili ya vinara vya taa vya fedha, kwa uzito wa kila kinara cha taa pamoja na taa zake, kulingana na matumizi ya kila kinara cha taa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi kinasema “kinara cha taa na kinara cha taa” katika vifungu vinavyohusu uzito na matumizi; huu ni usemi wa kugawa unaomaanisha kila kinara kimoja kimoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקָל
  choice: uzito
  rationale: Nomino hii humaanisha uzito uliopimwa au kiasi kilichoamuliwa kwa uzito katika orodha ya vifaa vya hekalu.
- source_word: מְנֹרוֹת
  choice: vinara vya taa
  rationale: Neno hilo linataja vitu vinavyobeba taa, si taa zenyewe; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: נֵרֹתֵיהֶם / נֵרֹתֶיהָ
  choice: taa zake
  rationale: Hizi ni taa moja moja zinazowekwa kwenye vinara, hivyo zimetofautishwa na vinara vyenyewe.
- source_word: זָהָב / הַכֶּסֶף
  choice: dhahabu / fedha
  rationale: Majina ya metali yametafsiriwa moja kwa moja, huku urudiaji wa dhahabu kwa vinara na taa ukihifadhiwa.
- source_word: בְּמִשְׁקַל מְנוֹרָה וּמְנוֹרָה
  choice: uzito wa kila kinara cha taa
  rationale: Urudiaji wa Kiebrania una maana ya ugawaji mmoja mmoja; “kila” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: כַּעֲבוֹדַת מְנוֹרָה וּמְנוֹרָה
  choice: kulingana na matumizi ya kila kinara cha taa
  rationale: עֲבוֹדָה hapa inaelekea kumaanisha kazi au matumizi yaliyokusudiwa ya kila kinara; “matumizi” ni ya asili zaidi kuliko “huduma” kwa kitu kisicho na uhai, bila kuondoa muktadha wa hekalu.
