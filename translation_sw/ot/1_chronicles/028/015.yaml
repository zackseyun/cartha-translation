translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha na ulinganifu wa vinara vya dhahabu na vya fedha umehifadhiwa.
