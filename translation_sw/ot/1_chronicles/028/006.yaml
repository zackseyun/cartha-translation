  text: וַ/יֹּ֣אמֶר לִ֔/י שְׁלֹמֹ֣ה בִנְ/ךָ֔ הֽוּא יִבְנֶ֥ה בֵיתִ֖/י וַ/חֲצֵרוֹתָ֑/י כִּי בָחַ֨רְתִּי ב֥/וֹ לִ/י֙ לְ/בֵ֔ן וַ/אֲנִ֖י אֶֽהְיֶה לּ֥/וֹ לְ/אָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/006.yaml
  text: And he said to me[a], ‘Solomon your son—he will build my house and my courts, for I have chosen him for myself as a son, and I will be to him as a father.’
translation:
  language: sw
  text: Naye akaniambia, “Sulemani mwana wako—yeye ndiye atakayejenga nyumba yangu na nyua zangu, kwa maana nimemchagua awe mwanangu, nami nitakuwa baba yake.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “nimemchagua kwa ajili yangu kuwa mwana, nami nitakuwa kwake baba.”'
    reason: Muundo wa Kiebrania לִי לְבֵן ... לוֹ לְאָב unaweza kuakisiwa kwa karibu zaidi kwa maneno haya, ingawa tafsiri kuu ni ya kawaida zaidi katika Kiswahili.
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: Naye akaniambia
  rationale: Kitenzi cha masimulizi וַיֹּאמֶר kimetafsiriwa kwa wakati wa masimulizi, na לִי imeonyeshwa katika kiambishi -ni-; muundo huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: שְׁלֹמֹה בִנְךָ
  choice: Sulemani mwana wako
  rationale: Mpangilio huu unahifadhi mkazo wa Kiebrania unaoanza na jina la Sulemani na kisha kumtambulisha kuwa mwana wa Daudi.
- source_word: הוּא
  choice: yeye ndiye
  rationale: Kiwakilishi huru kina mkazo; “yeye ndiye” kinaonyesha wazi kwamba Sulemani, wala si mwingine, ndiye atakayejenga.
- source_word: יִבְנֶה בֵיתִי
  choice: atakayejenga nyumba yangu
  rationale: “Nyumba” huhifadhi maana ya msingi ya בַּיִת na mwangwi wake wa kitheolojia; muktadha unaonyesha kwamba ni nyumba ya Mungu, yaani hekalu.
- source_word: וַחֲצֵרוֹתָי
  choice: na nyua zangu
  rationale: Katika muktadha wa hekalu, חֲצֵרוֹת ni maeneo ya wazi yaliyozungushiwa majengo au kuta; “nyua” ni neno la kawaida na fasaha la Kiswahili.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya jukumu la Sulemani na kinasomeka kwa kawaida katika masimulizi yenye hadhi.
- source_word: בָחַרְתִּי בוֹ
  choice: nimemchagua
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo la uchaguzi lililofanyika ambalo matokeo yake yanaendelea.
- source_word: לִי לְבֵן
  choice: awe mwanangu
  rationale: Huu ni uwasilishaji wa kawaida wa Kiswahili wa muundo wenye vihusishi viwili, huku ukihifadhi uhusiano wa kimwana bila kuufafanua kupita maandishi.
- source_word: וַאֲנִי אֶהְיֶה לוֹ לְאָב
  choice: nami nitakuwa baba yake
  rationale: Huu ni usemi wa asili wa Kiswahili unaowasilisha kwa usahihi maana ya “nitakuwa kwake baba,” bila kudhoofisha lugha ya agano.
theological_decisions:
- issue: Lugha ya uhusiano wa baba na mwana kati ya Mungu na Sulemani
  choice: nimemchagua awe mwanangu, nami nitakuwa baba yake
  alternative: nimemchagua kwa ajili yangu kuwa mwana, nami nitakuwa kwake baba
  rationale: Tafsiri kuu inahifadhi moja kwa moja lugha ya kifalme na ya agano huku ikisomeka kwa Kiswahili cha kawaida. Haipunguzi uhusiano huu kuwa kazi tu, wala haiingizi hitimisho la baadaye la Kikristo katika muktadha wa karibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Alama ya mkato na “yeye ndiye” zinatunza mkazo wa kiwakilishi הוּא. “Nyumba” imetumiwa badala ya “hekalu” ili kuhifadhi taswira ya chanzo.
