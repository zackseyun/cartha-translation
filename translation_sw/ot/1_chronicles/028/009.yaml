  terminology: “Mungu wa baba yako,” “umtumikie,” “kwa moyo wote,” “nafsi yenye hiari,” na “atakutupa mbali milele” ni chaguo zinazofaa na za heshima. “Yahwe” ni tahajia inayokubalika katika Kiswahili kwa jina la Mungu na imedumisha jina badala ya cheo.
