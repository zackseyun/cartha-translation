reference: 1 Chronicles 28:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אַתָּ֣ה שְׁלֹמֹֽה בְנִ֡/י דַּע֩ אֶת אֱלֹהֵ֨י אָבִ֜י/ךָ וְ/עָבְדֵ֗/הוּ בְּ/לֵ֤ב שָׁלֵם֙ וּ/בְ/נֶ֣פֶשׁ חֲפֵצָ֔ה כִּ֤י כָל לְבָבוֹת֙ דּוֹרֵ֣שׁ יְהוָ֔ה וְ/כָל יֵ֥צֶר מַחֲשָׁב֖וֹת מֵבִ֑ין אִֽם תִּדְרְשֶׁ֨/נּוּ֙ יִמָּ֣צֵא לָ֔/ךְ וְ/אִם תַּֽעַזְבֶ֖/נּוּ יַזְנִיחֲ/ךָ֥ לָ/עַֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/009.yaml
  text: And you[a], Solomon my son, know the God of your father and serve him with a whole heart and a willing soul, for Yahweh searches all hearts and understands every intention of the thoughts. If you seek him, he will let himself be found by you; but if you forsake him[b], he will cast you off forever.
translation:
  language: sw
  text: Nawe, mwanangu Solomoni, mjue Mungu wa baba yako, na umtumikie kwa moyo wote na kwa nafsi yenye hiari, kwa maana Yahwe huichunguza mioyo yote na huelewa kila kusudi la mawazo. Ukimtafuta, atakubali kupatikana kwako[a]; lakini ukimwacha, atakutupa mbali milele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atapatikana kwako.” Kitenzi cha Kiebrania kina umbo la kutendwa/kirejezi.
    reason: lexical_alternative
  - marker: b
    text: Au, “atakukataa milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּע
  choice: mjue
  rationale: Amri hii inahusu kumjua na kumtambua Mungu kibinafsi katika uhusiano wa uaminifu, si kuwa na habari zake kiakili tu.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: Mungu wa baba yako
  rationale: Muundo huu wa kawaida wa Kiswahili unahifadhi mwendelezo wa kifamilia na wa agano katika agizo la Daudi kwa Solomoni.
- source_word: וְעָבְדֵהוּ
  choice: na umtumikie
  rationale: ‘Kumtumikia’ huhifadhi maana pana ya utiifu uliojitolea na ibada, bila kuipunguza kuwa tendo la ibada pekee.
- source_word: בְּלֵב שָׁלֵם
  choice: kwa moyo wote
  rationale: שָׁלֵם hapa hudokeza ukamilifu, uadilifu, na moyo usiogawanyika. ‘Kwa moyo wote’ ni Kiswahili cha asili na hakidokezi kutokuwa na dhambi kabisa.
- source_word: וּבְנֶפֶשׁ חֲפֵצָה
  choice: na kwa nafsi yenye hiari
  rationale: ‘Nafsi’ huhifadhi tofauti na ‘moyo,’ huku ‘yenye hiari’ ikionyesha utayari na tamaa ya ndani.
- source_word: כִּי כָל לְבָבוֹת דּוֹרֵשׁ יְהוָה
  choice: kwa maana Yahwe huichunguza mioyo yote
  rationale: דרשׁ hapa ni kuchunguza au kupeleleza kwa kina, si kutafuta kitu ambacho hakijulikani kilipo.
- source_word: וְכָל יֵצֶר מַחֲשָׁבוֹת מֵבִין
  choice: na kuelewa kila kusudi la mawazo
  rationale: יֵצֶר pamoja na מַחֲשָׁבוֹת huelekeza kwenye uundaji, mwelekeo, au kusudi la mawazo ya ndani.
- source_word: אִם תִּדְרְשֶׁנּוּ
  choice: Ukimtafuta
  rationale: Katika muktadha huu, דרשׁ humaanisha kumtafuta Mungu kwa kujitoa na kumtegemea.
- source_word: יִמָּצֵא לָךְ
  choice: atakubali kupatikana nawe
  rationale: Kauli hii inawasilisha umbo la Kiebrania la kutendwa/kirejezi na kudumisha wazo la Mungu kujitoa apatikane, badala ya kulifanya jambo hilo kuwa ugunduzi wa mwanadamu pekee.
- source_word: תַּעַזְבֶנּוּ
  choice: ukimwacha
  rationale: Katika onyo la kiagano, ‘kumwacha’ ni Kiswahili cha sasa na chenye uzito kinachoonyesha kuvunja uaminifu kwake.
- source_word: יַזְנִיחֲךָ לָעַד
  choice: atakutupa mbali milele
  rationale: Kauli hii huhifadhi nguvu ya kukataa au kutupilia mbali pamoja na mwisho wa onyo, ‘milele.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Lugha ya kibinadamu ya ‘moyo’ na ‘nafsi’
  choice: Kudumisha ‘moyo’ na ‘nafsi’ kama maneno mawili tofauti.
  alternative: Kuyafanya yote kuwa dhana moja ya kisaikolojia kama ‘akili.’
  rationale: Kiebrania hutofautisha לֵב na נֶפֶשׁ ili kueleza kujitoa kwa utu wote; kuyadumisha huzuia kufifisha anthropolojia ya kifungu.
- issue: Kupatikana kwa Mungu katika יִמָּצֵא לָךְ
  choice: ‘atakubali kupatikana nawe’
  alternative: ‘atapatikana nawe’ au ‘utampata’
  rationale: Uundaji wa Niphal una nafasi ya maana ya kutendwa au kirejezi. Tafsiri iliyochaguliwa huhifadhi wazo la kujidhihirisha kwa Mungu bila kulazimisha mfumo mpana wa kiteolojia.
- issue: Ukali wa onyo la agano
  choice: ‘atakutupa mbali milele’
  alternative: ‘atakukataa milele’
  rationale: Maneno haya yanahifadhi uzito wa onyo la Daudi bila kulainisha kauli au kutatua maswali mapana ya kiteolojia ambayo mstari wenyewe hauyajadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mjue’ ni sahihi kwa yambwa nafsi; ‘kwa moyo wote’ ni nahau ya kawaida inayoonyesha moyo kamili; jina Yahwe limetumiwa kama jina binafsi. Alama zote za tanbihi zimewekwa katika matini kuu.
