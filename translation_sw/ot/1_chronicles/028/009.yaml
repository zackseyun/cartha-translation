  to: Nawe, mwanangu Solomoni, mjue Mungu wa baba yako, na umtumikie kwa moyo wote na kwa nafsi yenye hiari, kwa maana Yahwe huichunguza mioyo yote na huelewa kila kusudi la mawazo. Ukimtafuta, atakubali kupatikana kwako[a]; lakini ukimwacha, atakutupa mbali milele[b].
