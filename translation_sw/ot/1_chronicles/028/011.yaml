  text: וַ/יִּתֵּ֣ן דָּוִ֣יד לִ/שְׁלֹמֹ֣ה בְנ֡/וֹ אֶת תַּבְנִ֣ית הָ/אוּלָם֩ וְֽ/אֶת בָּ֨תָּ֜י/ו וְ/גַנְזַכָּ֧י/ו וַ/עֲלִיֹּתָ֛י/ו וַ/חֲדָרָ֥י/ו הַ/פְּנִימִ֖ים וּ/בֵ֥ית הַ/כַּפֹּֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/011.yaml
  text: Then David gave to Solomon his son the plan of the portico[a], its houses, its treasuries, its upper rooms, its inner chambers, and the house of the mercy seat.
translation:
  language: sw
  text: Ndipo Daudi akampa mwanawe Sulemani mpango wa ukumbi wa kuingilia, majengo yake, vyumba vyake vya hazina, vyumba vyake vya juu, vyumba vyake vya ndani, na chumba cha kiti cha rehema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kifuniko cha upatanisho.” Neno la Kiebrania linamaanisha kifuniko cha Sanduku la Agano kilichokuwa katika Patakatifu Zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית
  choice: ramani
  rationale: Katika muktadha wa ujenzi wa hekalu, neno hili linamaanisha kielelezo au mpango maalumu wa ujenzi; “ramani” ni Kiswahili cha kawaida na kinachoeleweka.
- source_word: הָאוּלָם
  choice: ukumbi wa kuingilia
  rationale: Neno hili hutaja ukumbi au sehemu yenye paa iliyo mbele ya jengo; tafsiri hii inaeleza kazi yake katika hekalu bila kutumia istilahi ngumu.
- source_word: בָּתָּיו
  choice: majengo yake
  rationale: Ingawa בַּיִת kwa kawaida ni “nyumba,” wingi wake hapa unarejelea sehemu za kimuundo za hekalu; “majengo” ni ya asili zaidi katika muktadha huu.
- source_word: גַנְזַכָּיו
  choice: vyumba vyake vya hazina
  rationale: Neno hili linamaanisha mahali pa kuhifadhia vitu vya thamani au vitu vilivyowekwa wakfu; “vyumba vya hazina” huepuka maana ya hazina zenyewe.
- source_word: עֲלִיֹּתָיו
  choice: vyumba vyake vya juu
  rationale: Hutaja vyumba vilivyo sehemu ya juu ya jengo; tafsiri hii ni wazi na ya kawaida.
- source_word: חֲדָרָיו הַפְּנִימִים
  choice: vyumba vyake vya ndani
  rationale: Tafsiri hii inahifadhi maana ya vyumba vya sehemu ya ndani bila kuongeza dhana ya “ndani kabisa,” ambayo Kiebrania hakisemi wazi.
- source_word: בֵית הַכַּפֹּרֶת
  choice: chumba cha kiti cha rehema
  rationale: בֵית hapa inaelekea kumaanisha chumba kinachohifadhi כַּפֹּרֶת. “Kiti cha rehema” ni istilahi ya patakatifu inayotambulika, huku tanbihi ikifafanua kuwa ni kifuniko cha Sanduku.
- source_word: וַיִּתֵּן
  choice: Ndipo Daudi akampa
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha asili.
theological_decisions:
- issue: Jinsi ya kutafsiri כַּפֹּרֶת katika istilahi za patakatifu
  choice: kiti cha rehema
  alternative: kifuniko cha upatanisho
  rationale: “Kiti cha rehema” huhifadhi istilahi ya kidini inayofahamika, lakini כַּפֹּרֶת pia hutaja kihalisi kifuniko cha Sanduku la Agano. Tanbihi inahifadhi uwezekano huo bila kulazimisha tafsiri moja ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Orodha ya sehemu za hekalu imetolewa kwa maneno ya kawaida ya usanifu, na istilahi ya patakatifu imefafanuliwa katika tanbihi.
