source:
  edition: WLC
  text: וַ/יָּ֨קָם דָּוִ֤יד הַ/מֶּ֨לֶךְ֙ עַל רַגְלָ֔י/ו וַ/יֹּ֕אמֶר שְׁמָע֖וּ/נִי אַחַ֣/י וְ/עַמִּ֑/י אֲנִ֣י עִם לְבָבִ֡/י לִ/בְנוֹת֩ בֵּ֨ית מְנוּחָ֜ה לַ/אֲר֣וֹן בְּרִית יְהוָ֗ה וְ/לַ/הֲדֹם֙ רַגְלֵ֣י אֱלֹהֵ֔י/נוּ וַ/הֲכִינ֖וֹתִי לִ/בְנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/002.yaml
  text: Then King David rose to his feet and said[a], “Hear me, my brothers and my people. It was in my heart to build a house of rest for the ark of the covenant of Yahweh, and for the footstool of our God[c][b], and I made preparations to build it.”
translation:
  language: sw
  text: Ndipo Mfalme Daudi akasimama, akasema, “Nisikilizeni, ndugu zangu[a] na watu wangu. Moyoni mwangu nilikusudia kujenga nyumba ya pumziko[b] kwa ajili ya sanduku la agano la Yahwe, na kwa ajili ya kiti cha kuwekea miguu cha Mungu wetu[c], nami nilifanya maandalizi ya kuijenga.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi “kaka zangu,” umbo la wingi wa kiume linalotumiwa katika hotuba ya hadhara; linaweza pia kueleweka kuwa “jamaa zangu.”
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya pumziko” inaweza pia kutafsiriwa “mahali pa kupumzikia,” yaani, makao ya kudumu ya sanduku.
    reason: lexical_alternative
  - marker: c
    text: Sanduku linaelezwa kuwa kiti cha kuwekea miguu kinachohusishwa na uwepo wa Mungu wa Israeli; linganisha Zaburi 132:7.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּקָם ... עַל רַגְלָיו
  choice: akasimama kwa miguu yake
  rationale: Huwakilisha tendo la kuinuka na kusimama katika hotuba rasmi; Kiswahili hiki ni wazi na kinafuata taswira ya Kiebrania.
- source_word: שְׁמָעוּנִי
  choice: Nisikilizeni
  rationale: Amri ya wingi yenye kiambishi cha nafsi ya kwanza; ‘Nisikilizeni’ ni ya kawaida na inafaa mwito wa hadhara.
- source_word: אַחַי וְעַמִּי
  choice: ndugu zangu na watu wangu
  rationale: ‘Ndugu’ huhifadhi wazo la uhusiano wa karibu bila kulazimisha maana ya kaka wa kuzaliwa pekee; tanbihi inaonyesha umbo la kiume la Kiebrania.
- source_word: אֲנִי עִם לְבָבִי
  choice: Moyoni mwangu nilikusudia
  rationale: Hutoa maana ya nia au azimio la ndani kwa Kiswahili cha asili, huku ikihifadhi taswira ya moyo.
- source_word: בֵּית מְנוּחָה
  choice: nyumba ya pumziko
  rationale: Huhifadhi muundo na taswira ya kifungu cha Kiebrania, ambacho kinaashiria makao ya kudumu ya sanduku.
- source_word: לַאֲרוֹן בְּרִית יְהוָה
  choice: kwa ajili ya sanduku la agano la Yahwe
  rationale: Huwasilisha mfuatano wa umilikaji kwa uwazi na kulitaja sanduku la agano kwa istilahi inayoeleweka.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni namna ya kawaida ya Kiswahili ya kuandika jina la agano YHWH, badala ya kulibadilisha kuwa cheo.
- source_word: וְלַהֲדֹם רַגְלֵי אֱלֹהֵינוּ
  choice: na kwa ajili ya kiti cha kuwekea miguu cha Mungu wetu
  rationale: Huhifadhi kiunganishi ‘na’ pamoja na sitiari ya Kiebrania bila kuamua kimyakimya kama usemi huu ni maelezo mbadala ya sanduku au kitu kinachotajwa sambamba nalo.
- source_word: וַהֲכִינוֹתִי לִבְנוֹת
  choice: nami nilifanya maandalizi ya kuijenga
  rationale: Hutoa maana ya kufanya matayarisho kwa ujenzi; kiambishi ‘-i-’ kinarejelea nyumba iliyotajwa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la pekee la Mungu, hivyo tafsiri inalihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Uhusiano kati ya sanduku na ‘kiti cha kuwekea miguu’
  choice: Kuacha vifungu viwili vikiunganishwa kwa ‘na’, kisha kueleza uwezekano wa uhusiano katika tanbihi
  alternative: yaani, kiti cha kuwekea miguu cha Mungu wetu
  rationale: Kiebrania kina וְ (‘na’), ingawa muktadha unaweza kueleweka kuwa sanduku linaelezwa kama kiti cha kuwekea miguu. Kutumia ‘yaani’ katika matini kungeondoa utata halisi.
- issue: Neno la uhusiano אַחַי
  choice: ndugu zangu
  alternative: kaka zangu; jamaa zangu
  rationale: Umbo la Kiebrania ni wingi wa kiume katika hotuba ya hadhara. ‘Ndugu zangu’ ni la heshima na la kawaida kwa Kiswahili, huku tanbihi ikibainisha umbo la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya hotuba rasmi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umefanywa wa asili bila kuondoa sitiari za ‘moyo,’ ‘nyumba ya pumziko,’ na ‘kiti cha kuwekea miguu.’
