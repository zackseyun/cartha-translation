  text: וְ/תַבְנִ֗ית כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה בָ/ר֨וּחַ֙ עִמּ֔/וֹ לְ/חַצְר֧וֹת בֵּית יְהוָ֛ה וּ/לְ/כָל הַ/לְּשָׁכ֖וֹת סָבִ֑יב לְ/אֹֽצְרוֹת֙ בֵּ֣ית הָ/אֱלֹהִ֔ים וּ/לְ/אֹצְר֖וֹת הַ/קֳּדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/012.yaml
  text: 'and the plan of all that was in the Spirit with him: for the courts of the house of Yahweh[a], for all the surrounding chambers, for the treasuries of the house of God, and for the treasuries of the holy things.'
translation:
  language: sw
  text: 'na ramani ya yote aliyokuwa nayo kwa Roho[a]: ya nyua za nyumba ya Yahwe, ya vyumba vyote vilivyozunguka nyumba hiyo, ya hazina za nyumba ya Mungu, na ya hazina za vitu vitakatifu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yote aliyokuwa nayo katika roho yake,” yaani, yaliyokuwa katika mawazo au moyo wa Daudi.
    reason: alternative_reading
lexical_decisions:
- source_word: תַבְנִית
  choice: ramani
  rationale: Katika muktadha wa ujenzi wa hekalu, neno hili linamaanisha ramani au mpango wa usanifu; “ramani” ni neno la kawaida na wazi kwa wasomaji wa Kiswahili.
- source_word: כֹּל אֲשֶׁר
  choice: yote
  rationale: Linawasilisha ujumla wa vipengele vya ramani bila kufanya sentensi kuwa nzito.
- source_word: הָיָה בָרוּחַ עִמּוֹ
  choice: aliyokuwa nayo kwa Roho
  rationale: Huu ni usemi usio wa kawaida unaoweza kurejelea Roho wa Mungu au roho/mawazo ya Daudi. Tafsiri hii inaonyesha uwezekano wa chanzo cha kimungu huku tanbihi ikihifadhi maana nyingine.
- source_word: לְחַצְרוֹת
  choice: ya nyua
  rationale: “Nyua” ni istilahi ya kawaida na sahihi kwa maeneo ya wazi yanayozunguka au kuwa sehemu ya jengo la hekalu.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: “Nyumba” huhifadhi picha ya Kiebrania, na “Yahwe” huwakilisha jina binafsi יהוה badala ya kulibadilisha kuwa cheo.
- source_word: לְּשָׁכוֹת סָבִיב
  choice: vyumba vyote vilivyoizunguka
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya vyumba vilivyokuwa pande zote za jengo.
- source_word: אֹצְרוֹת
  choice: hazina
  rationale: Katika muktadha huu neno linamaanisha vyumba au mahali pa kuhifadhia mali; “hazina” linafaa kwa matumizi ya hekalu.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Huhifadhi usemi halisi wa Kiebrania na usambamba wake na “nyumba ya Yahwe.”
- source_word: הַקֳּדָשִׁים
  choice: vitu vitakatifu
  rationale: Tafsiri ya moja kwa moja inayoweza kujumuisha vitu vilivyowekwa wakfu na kuhifadhiwa katika hazina za hekalu.
theological_decisions:
- issue: Maana ya בָרוּחַ עִמּוֹ
  choice: kwa Roho, ikielekea kumrejelea Roho wa Mungu
  alternative: katika roho yake, yaani katika mawazo au moyo wa Daudi
  rationale: Muktadha mpana, hasa mstari wa 19, unaunga mkono wazo la ramani iliyofunuliwa na Mungu. Hata hivyo, muundo wa Kiebrania unaweza kueleweka kuwa unarejelea nafsi au mawazo ya Daudi, hivyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha umehifadhiwa, lakini viunganishi vimepangwa ili sentensi isomeke kwa urahisi. Herufi kubwa katika “Roho” inaonyesha usomaji unaomrejelea Roho wa Mungu bila kufuta usomaji mwingine.
