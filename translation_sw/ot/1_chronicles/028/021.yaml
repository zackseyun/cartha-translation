base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/021.yaml
  text: And behold[a], the divisions of the priests and the Levites are for all the service of the house of God, and with you in all the work will be every willing man skilled in wisdom for every kind of service; the officials also, and all the people[b], will be wholly at your command.
translation:
  language: sw
  text: Na tazama, makundi ya makuhani na Walawi yapo kwa ajili ya huduma yote ya nyumba ya Mungu. Nawe, katika kila kazi, kila mtu aliye tayari na mwenye ustadi atakuwa pamoja nawe kwa kila aina ya huduma.[a] Nao viongozi na watu wote watakuwa tayari kutekeleza maagizo yako yote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila mtu aliye tayari, mwenye hekima.” Kihalisi, “kila aliye tayari katika hekima,” kwa kila aina ya huduma; hapa “hekima” inaweza kumaanisha ustadi wa vitendo.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa maneno yako yote”; yaani, tayari kutekeleza maagizo yako au kushughulikia mambo yako yote.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Inahifadhi kishazi cha Kiebrania kinachoelekeza usikivu na kusisitiza uhakikisho wa Daudi, huku kikibaki cha kawaida na chenye hadhi katika Kiswahili.
- source_word: מַחְלְקוֹת
  choice: makundi
  rationale: Neno hili hapa linamaanisha migawanyo iliyopangwa ya makuhani na Walawi kwa ajili ya huduma. “Makundi” ni wazi na ya kawaida kuliko istilahi isiyoeleweka ya zamu, bila kulazimisha kwamba yalikuwa makundi ya wakati pekee.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: makuhani na Walawi
  rationale: Inahifadhi tofauti ya wazi kati ya makundi haya mawili ya wahudumu wa nyumba ya Mungu.
- source_word: לְכָל עֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: kwa ajili ya huduma yote ya nyumba ya Mungu
  rationale: “Kwa ajili ya” huonyesha kusudi, “huduma yote” huonyesha upeo kamili, na “nyumba ya Mungu” huhifadhi taswira halisi ya chanzo badala ya kuibadili kuwa “hekalu.”
- source_word: וְעִמְּךָ בְכָל מְלָאכָה
  choice: Katika kila kazi utakuwa pamoja na
  rationale: Muundo huu unatoa kwa Kiswahili cha kawaida wazo la watu watakaokuwa pamoja na Sulemani katika kazi yote, bila kupoteza maana pana ya מְלָאכָה.
- source_word: לְכָל נָדִיב בַּחָכְמָה
  choice: kila mtu mwenye moyo wa kujitolea na mwenye ustadi
  rationale: נָדִיב katika muktadha huu hueleza mtu mwenye utayari wa ndani au wa kujitolea, na חָכְמָה hueleza hekima ya vitendo, yaani ustadi unaohitajika katika kazi.
- source_word: לְכָל עֲבוֹדָה
  choice: kwa kila aina ya huduma
  rationale: Huwasilisha upana wa huduma mbalimbali na pia hudumisha tofauti ya kimuktadha kati ya עֲבוֹדָה na מְלָאכָה iliyotangulia.
- source_word: וְהַשָּׂרִים
  choice: Nao viongozi
  rationale: שָׂרִים hapa ni wenye mamlaka au wasimamizi katika utawala; “viongozi” ni wazi bila kudokeza lazima kuwa walikuwa wana wa kifalme.
- source_word: וְכָל הָעָם
  choice: na watu wote
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi jumla ya msaada unaotajwa.
- source_word: לְכָל דְּבָרֶיךָ
  choice: kutekeleza maagizo yako yote
  rationale: Kihalisi ni “kwa maneno/mambo yako yote,” lakini katika muktadha huu humaanisha kuwa tayari kufuata maelekezo ya Sulemani. Tafsiri hii ya kiutendaji ni ya kawaida katika Kiswahili, huku maana halisi ikitolewa katika tanbihi.
theological_decisions:
- issue: Rejeo la mtu katika לְכָל נָדִיב
  choice: kila mtu mwenye moyo wa kujitolea
  alternative: kila mwanamume mwenye nia
  rationale: Umbo la Kiebrania ni la kiume umoja, lakini hapa linafanya kazi kama rejeo la kawaida kwa mfanyakazi yeyote aliye tayari. Kiswahili “mtu” hakiongezi dai lisilo la lazima kwamba kundi hilo lilikuwa la wanaume pekee; tanbihi inadumisha uwezekano wa kutafsiri kama mtu aliyejitolea.
- issue: Tafsiri ya בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  alternative: hekalu
  rationale: “Nyumba ya Mungu” huhifadhi usemi halisi na wa ibada wa Kiebrania. Ingawa “hekalu” ni sahihi kimuktadha, ni ufupisho wa kufasiri.
- issue: Nguvu ya לְכָל דְּבָרֶיךָ
  choice: watakuwa tayari kutekeleza maagizo yako yote
  alternative: watakuwa kwa ajili ya maneno yako yote
  rationale: Chaguo kuu linaonyesha utayari wa viongozi na watu kutenda kulingana na maelekezo ya Sulemani, bila kuufanya usemi halisi wa Kiebrania usikike usio wa kawaida katika Kiswahili. Tanbihi inaweka wazi maana ya neno kwa neno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimegawanywa kwa usomaji wa kawaida, lakini uhusiano wa vipashio vya Kiebrania umehifadhiwa. “Na tazama” hudumisha msisitizo wa usemi wa chanzo; “nyumba ya Mungu” hudumisha taswira ya Kiebrania; na istilahi za kazi na huduma zimechaguliwa kwa uwazi bila kuingiza lugha ya dhehebu.
