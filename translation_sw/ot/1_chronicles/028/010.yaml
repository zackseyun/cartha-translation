  yaml_path: translation/ot/1_chronicles/028/010.yaml
  text: See now[a], for Yahweh has chosen you to build a house for the sanctuary. Be strong[b], and do it.
translation:
  language: sw
  text: Zingatia sasa[a], kwa maana Yahweh amekuchagua ujenge nyumba kwa ajili ya patakatifu[b]. Uwe hodari, na utende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Angalia sasa” au “Tafakari sasa.” Amri ya mwanzo inamtaka Sulemani atilie jambo hili maanani, si kulitazama kwa macho tu.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “nyumba kwa ajili ya patakatifu.” Yaani, jengo la hekalu lililokusudiwa kuwa mahali patakatifu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה עַתָּה
  choice: Zingatia sasa
  rationale: Amri ya ראה hapa inaita mtu atilie jambo maanani, si kutazama kwa macho tu; עתה huongeza uzito na uharaka wa wito huo.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza sababu ya himizo lililotangulia na kuunganisha kwa kawaida uchaguzi wa Yahwe na wajibu wa Sulemani.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa jina la Mungu kwa umbo linalotamkika kwa Kiswahili, badala ya kulibadili kuwa cheo kama “BWANA.”
- source_word: בָּחַר בְּךָ
  choice: amekuchagua
  rationale: Wakati timilifu wa Kiswahili unaonyesha uchaguzi uliokwisha kufanywa ambao una matokeo ya sasa.
- source_word: לִבְנוֹת
  choice: ujenge
  rationale: Kiswahili hutumia hali ya utegemezi baada ya “amekuchagua” kueleza kazi aliyochaguliwa kuifanya.
- source_word: בַּיִת לַמִּקְדָּשׁ
  choice: nyumba kwa ajili ya patakatifu
  rationale: Inahifadhi nomino zote mbili za Kiebrania, “nyumba” na “patakatifu,” bila kuzifupisha kiufafanuzi kuwa “hekalu” pekee.
- source_word: חֲזַק
  choice: Uwe hodari
  rationale: Himizo hili linataka nguvu na uthabiti wa kutekeleza agizo; “uwe hodari” ni la kawaida, la heshima, na linafaa katika muktadha wa kukabidhiwa kazi.
- source_word: וַעֲשֵׂה
  choice: na uifanye
  rationale: Kitenzi עשה ni kipana; kiwakilishi “-i-” kinaelekeza kwa kazi ya kujenga iliyotajwa katika muktadha bila kuongeza maelezo yasiyo katika chanzo.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Andiko lina jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi jina hilo katika tahajia inayolingana na mfumo wa sauti wa Kiswahili.
- issue: Iwapo בַּיִת לַמִּקְדָּשׁ itafsiriwe moja kwa moja kuwa “hekalu”
  choice: nyumba kwa ajili ya patakatifu
  alternative: hekalu; nyumba iwe patakatifu
  rationale: Kiebrania kina “nyumba” na “patakatifu.” Tafsiri iliyochaguliwa inadumisha muundo huo na kuepuka kuamua kimyakimya ikiwa ל hapa ina maana ya kusudi (“kwa ajili ya”) au utambulisho (“iwe”).
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Zingatia” huepuka maana finyu ya kuona kwa macho; “uwe hodari” hudumisha sauti ya himizo. Muundo usio wa kawaida kidogo “nyumba kwa ajili ya patakatifu” umehifadhiwa kwa makusudi, huku tanbihi ikifafanua maana yake.
