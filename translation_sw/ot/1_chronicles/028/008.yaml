id: 1CH.28.8
reference: 1 Chronicles 28:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ֠/עַתָּה לְ/עֵינֵ֨י כָל יִשְׂרָאֵ֤ל קְהַל יְהוָה֙ וּ/בְ/אָזְנֵ֣י אֱלֹהֵ֔י/נוּ שִׁמְר֣וּ וְ/דִרְשׁ֔וּ כָּל מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם לְמַ֤עַן תִּֽירְשׁוּ֙ אֶת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה וְ/הִנְחַלְתֶּ֛ם לִ/בְנֵי/כֶ֥ם אַחֲרֵי/כֶ֖ם עַד עוֹלָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/008.yaml
  text: And now[a], in the sight of all Israel, the assembly of Yahweh, and in the hearing of our God, keep and seek all the commandments of Yahweh your God[b], so that you may possess the good land and leave it as an inheritance to your sons after you forever.
translation:
  language: sw
  text: Basi sasa, mbele ya macho ya Israeli wote, yaani kusanyiko la Yahwe, na masikioni mwa Mungu wetu, zishikeni na kuzitafuta amri zote za Yahwe, Mungu wenu, ili mpate kuimiliki[a] nchi ile nzuri na muwaachie wana wenu[b] baada yenu iwe urithi wa milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuirithi.” Kitenzi cha Kiebrania kinaweza kumaanisha kurithi au kumiliki kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “wana”; neno hilo ni la wingi wa kiume, si neno la jumla zaidi “watoto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huhifadhi kiunganishi cha hoja na mpito wa hotuba kwa Kiswahili cha kawaida.
- source_word: לְעֵינֵי כָל יִשְׂרָאֵל
  choice: machoni pa Israeli wote
  rationale: Huhifadhi taswira halisi ya Kiebrania na maana ya tukio kufanyika hadharani mbele ya taifa lote.
- source_word: קְהַל יְהוָה
  choice: kusanyiko la Yahwe
  rationale: קהל ni jumuiya iliyokusanyika; “kusanyiko” ni neno wazi lisiloongeza maana maalumu ya kimadhehebu.
- source_word: וּבְאָזְנֵי אֱלֹהֵינוּ
  choice: na masikioni mwa Mungu wetu
  rationale: Huhifadhi taswira ya Kiebrania kwamba Mungu anasikia, bila kuibadili tu kuwa “mbele ya Mungu wetu.”
- source_word: שִׁמְרוּ וְדִרְשׁוּ
  choice: zishikeni na kuzitafuta kwa bidii
  rationale: “Zishikeni” huonyesha utii kwa amri; “kuzitafuta kwa bidii” huhifadhi wazo la דרשׁ la kuzitafuta au kujielekeza kwazo kwa makusudi, si kuzichunguza kiakili tu.
- source_word: כָּל מִצְוֺת
  choice: amri zote
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya wingi unaotawaliwa na כָּל.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina binafsi la Mungu katika Tetragramatoni badala ya kulibadili kuwa cheo.
- source_word: תִּירְשׁוּ
  choice: mpate kuimiliki
  rationale: ירשׁ inaweza kumaanisha kurithi au kumiliki; katika muktadha huu “kuimiliki” huonyesha kuendelea kushikilia nchi ya agano bila kuondoa uwezekano wa maana ya urithi.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: nchi hii nzuri
  rationale: Huhifadhi maelezo ya kawaida ya kiagano kuhusu nchi; “hii” hufanya rejeo liwe la kawaida katika Kiswahili kulingana na muktadha wa hotuba.
- source_word: וְהִנְחַלְתֶּם
  choice: na kuiwacha iwe urithi
  rationale: Hueleza kwa Kiswahili cha kawaida hali ya kusababisha kizazi kinachofuata kiirithi nchi.
- source_word: לִבְנֵיכֶם
  choice: wana wenu
  rationale: בנים ni wingi wa kiume; “wana wenu” huhifadhi umbo hilo badala ya kulipanua kimyakimya kuwa watoto wote.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Neno la kijinsia בנים kwa vizazi
  choice: wana wenu
  alternative: watoto wenu
  rationale: Kiebrania kimetumia nomino ya wingi wa kiume. Tafsiri inalihifadhi huku tanbihi ikieleza tofauti inayowezekana kwa msomaji.
- issue: Maana ya ירשׁ kuhusu nchi
  choice: kuimiliki
  alternative: kuirithi
  rationale: Kitenzi kinaweza kuonyesha kumiliki au kurithi. Muktadha unaruhusu “kuimiliki,” lakini tanbihi inahifadhi maana nyingine halali badala ya kuifuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya hotuba ya hadharani lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira za “machoni” na “masikioni” zimehifadhiwa kwa sababu ni wazi na hubeba mazingira ya ushuhuda wa hadhara. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
