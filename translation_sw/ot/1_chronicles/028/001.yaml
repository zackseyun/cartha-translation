  text: וַ/יַּקְהֵ֣ל דָּוִ֣יד אֶת כָּל שָׂרֵ֣י יִשְׂרָאֵ֡ל שָׂרֵ֣י הַ/שְּׁבָטִ֣ים וְ/שָׂרֵ֣י הַ/מַּחְלְק֣וֹת הַ/מְשָׁרְתִ֪ים אֶת הַ/מֶּ֟לֶךְ וְ/שָׂרֵ֣י הָ/אֲלָפִ֣ים וְ/שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/שָׂרֵ֣י כָל רְכוּשׁ וּ/מִקְנֶה֩ לַ/מֶּ֨לֶךְ וּ/לְ/בָנָ֜י/ו עִם הַ/סָּרִיסִ֧ים וְ/הַ/גִּבּוֹרִ֛ים וּֽ/לְ/כָל גִּבּ֥וֹר חָ֖יִל אֶל יְרוּשָׁלִָֽם־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/001.yaml
  text: 'Then David assembled at Jerusalem all the leaders of Israel: the leaders of the tribes[a], the leaders of the divisions that served the king, the commanders of thousands and of hundreds, and the leaders over all the property and livestock belonging to the king and to his sons, together with the officials, the mighty men, and every mighty man of valor.'
translation:
  language: sw
  text: 'Kisha Daudi akawakusanya huko Yerusalemu viongozi wote wa Israeli: viongozi wa makabila, viongozi wa makundi yaliyomhudumia mfalme, makamanda wa maelfu na wa mamia, na wasimamizi wa mali yote na mifugo ya mfalme na wanawe, pamoja na maofisa wa ikulu[a], mashujaa, na kila shujaa hodari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “matowashi”; neno la Kiebrania linaweza kumaanisha matowashi kihalisi au, kwa maana pana zaidi, maofisa wa ikulu ya mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: akawakusanya
  rationale: Hifili ya קהל inaonyesha Daudi alisababisha mkutano rasmi; “akawakusanya” ni ya kawaida na inaweka wazi tendo hilo.
- source_word: שָׂרֵי יִשְׂרָאֵל
  choice: viongozi wote wa Israeli
  rationale: שַׂר ni neno pana linaloweza kumaanisha kiongozi, ofisa, au kamanda; “viongozi” linafaa kama kichwa cha makundi yanayofuata.
- source_word: שָׂרֵי הַשְּׁבָטִים
  choice: viongozi wa makabila
  rationale: Tafsiri ya moja kwa moja na ya asili inayodumisha uhusiano na “viongozi wote wa Israeli.”
- source_word: הַמַּחְלְקוֹת הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: vikosi vilivyomhudumia mfalme
  rationale: מַחְלְקוֹת ni makundi yaliyopangwa kwa zamu au mgawanyo; “vikosi” linaeleweka katika orodha hii ya kiutawala na kijeshi bila kuamua kwamba yalikuwa majeshi pekee.
- source_word: שָׂרֵי הָאֲלָפִים וְשָׂרֵי הַמֵּאוֹת
  choice: makamanda wa maelfu na wa mamia
  rationale: Katika muktadha wa kijeshi na kiutawala, “makamanda” linafaa; maelfu na mamia yameachwa kama yalivyo ili kutohitimisha kama ni idadi kamili au vitengo.
- source_word: רְכוּשׁ וּמִקְנֶה
  choice: mali yote na mifugo
  rationale: רְכוּשׁ ni mali au milki, na מִקְנֶה ni wanyama wanaofugwa kwa upana, si ng’ombe pekee.
- source_word: שָׂרֵי כָל רְכוּשׁ וּמִקְנֶה
  choice: wasimamizi wa mali yote na mifugo
  rationale: Ingawa שָׂרֵי limetafsiriwa “viongozi” kwingine, hapa “wasimamizi” linaeleza kwa Kiswahili cha kawaida jukumu lao juu ya mali na mifugo.
- source_word: לַמֶּלֶךְ וּלְבָנָיו
  choice: ya mfalme na wanawe
  rationale: Lamed hapa inaonyesha umiliki au uhusiano; muundo huu ni wa asili na hauongezi maelezo yasiyokuwapo.
- source_word: הַסָּרִיסִים
  choice: maofisa wa ikulu
  rationale: סָרִיסִים linaweza kumaanisha matowashi kihalisi au maofisa wa kifalme. Orodha ya kiutawala inaunga mkono “maofisa wa ikulu,” huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: הַגִּבּוֹרִים
  choice: mashujaa
  rationale: Katika Mambo ya Nyakati neno hili mara nyingi humaanisha wapiganaji mashuhuri wa Daudi; “mashujaa” ni la asili na lenye hadhi.
- source_word: כָל גִּבּוֹר חָיִל
  choice: kila shujaa hodari
  rationale: Usemi huo unaunganisha ushujaa na uwezo au uhodari wa kijeshi; “shujaa hodari” huhifadhi nguvu yake bila kuwa wa kizamani.
