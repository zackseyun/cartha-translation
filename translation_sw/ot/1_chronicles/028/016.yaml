translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na ulio wazi. “Kwa kila meza moja moja” ni ya kawaida zaidi kuliko kuiga moja kwa moja urudiaji wa Kiebrania, lakini bado huhifadhi wazo la mgao wa kila meza kivyake.
