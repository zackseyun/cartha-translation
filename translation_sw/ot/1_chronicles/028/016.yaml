  text: and the weight of the gold for the tables of the arrangement[a], for each table and table, and silver for the silver tables.
translation:
  language: sw
  text: na uzito wa dhahabu kwa ajili ya meza za mpangilio[a], kwa kila meza, na fedha kwa ajili ya meza za fedha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “meza za mikate ya mpangilio”; kwa mapokeo, “meza za mikate ya wonyesho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקָל
  choice: uzito
  rationale: Katika orodha hii ya vifaa vya hekalu, neno hili linaonyesha kiasi cha metali kilichopangwa kwa kupimwa uzito, si thamani yake.
- source_word: שֻׁלְחֲנוֹת הַמַּעֲרֶכֶת
  choice: meza za mpangilio
  rationale: Tafsiri hii inadumisha maana ya msingi ya kitu kilichopangwa kwa utaratibu, huku tanbihi ikieleza kuwa huenda inayokusudiwa ni mikate iliyopangwa mbele za BWANA.
- source_word: לְשֻׁלְחָן וְשֻׁלְחָן
  choice: kwa kila meza moja moja
  rationale: Usemi huu wa Kiswahili unawasilisha mgawanyo kwa kila meza kivyake na kwa kawaida unaakisi urudiaji wa Kiebrania.
- source_word: כֶּסֶף
  choice: fedha
  rationale: Ni jina la kawaida la metali, likitofautishwa hapa na dhahabu.
- source_word: שֻׁלְחֲנוֹת הַכָּסֶף
  choice: meza za fedha
  rationale: Muundo huu kwa kawaida unaonyesha meza zilizotengenezwa kwa fedha au zilizotambulishwa kuwa za fedha; tafsiri haiongezi wazo lisilotajwa la kupakwa fedha.
