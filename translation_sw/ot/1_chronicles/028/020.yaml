  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לִ/שְׁלֹמֹ֣ה בְנ֗/וֹ חֲזַ֤ק וֶ/אֱמַץ֙ וַ/עֲשֵׂ֔ה אַל תִּירָ֖א וְ/אַל תֵּחָ֑ת כִּי֩ יְהוָ֨ה אֱלֹהִ֤ים אֱלֹהַ/י֙ עִמָּ֔/ךְ לֹ֤א יַרְפְּ/ךָ֙ וְ/לֹ֣א יַֽעַזְבֶ֔/ךָּ עַד לִ/כְל֕וֹת כָּל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/020.yaml
  text: And David said to Solomon his son[a], “Be strong and courageous, and do it. Do not fear or be dismayed, for Yahweh God, my God, is with you. He will not fail you or forsake you until all the work for the service of the house of Yahweh is finished.”
translation:
  language: sw
  text: Daudi akamwambia mwanawe Sulemani, “Uwe hodari na moyo mkuu, fanya. Usiogope wala usifadhaike, kwa maana Yahweh Mungu, Mungu wangu, yu pamoja nawe. Hatakuacha bila msaada[a] wala hatakutelekeza, mpaka kazi yote ya huduma ya nyumba ya Yahweh itakapokamilika.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hatakuachilia”; kitenzi cha Kiebrania kinaweza kumaanisha kutolegeza mshiko au kuacha kumtegemeza mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק וֶאֱמַץ
  choice: Uwe hodari na moyo mkuu
  rationale: Jozi ya amri inamhimiza Sulemani awe na nguvu na ujasiri wa kutekeleza kazi. Usemi huu ni wa kawaida na wenye hadhi katika Kiswahili, bila kupunguza nguvu ya amri.
- source_word: וַעֲשֵׂה
  choice: ukafanye kazi hiyo
  rationale: Kitenzi ni amri ya kutenda; muktadha unaonyesha kuwa kinachokusudiwa ni kazi ya nyumba ya Yahwe. ‘Kazi hiyo’ huifanya sentensi iwe wazi na ya asili bila kuongeza wazo jipya.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: Usiogope wala usifadhaike
  rationale: 'Huhifadhi makatazo mawili: kutokuwa na hofu na kutovunjika moyo au kutishwa kiasi cha kupoteza uthabiti.'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa moja kwa moja katika Kiebrania; ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהִים אֱלֹהַי
  choice: Mungu, Mungu wangu
  rationale: Huhifadhi urudiaji wa Kiebrania na msisitizo wa Daudi kuhusu uhusiano wake binafsi na Mungu.
- source_word: עִמָּךְ
  choice: yu pamoja nawe
  rationale: Kirai cha Kiebrania hakina kitenzi kilichoandikwa. ‘Yu pamoja nawe’ huwasilisha hali ya sasa kwa mtindo wenye hadhi na unaoeleweka.
- source_word: לֹא יַרְפְּךָ
  choice: Hatakuacha bila msaada
  rationale: Katika kauli hii, hiphili ya רפה inaweza kumaanisha kutolegeza tegemezo au kumwacha mtu ashindwe. Tafsiri hii hutofautisha maana hiyo na עזב inayofuata.
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: wala hatakutupa
  rationale: עזב hapa ni kuachana kabisa au kumtelekeza mtu. ‘Hatakutupa’ ni usemi wa Kiswahili unaobeba uzito wa kutomwacha mtu kabisa.
- source_word: עַד לִכְלוֹת
  choice: mpaka ... itakapokamilika
  rationale: Huonyesha kikomo kinachohusishwa na kukamilishwa kwa jukumu, bila kudai kwamba uwepo wa Mungu utakoma baada ya hapo.
- source_word: כָּל מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: kazi yote ya huduma ya nyumba ya Yahwe
  rationale: Huhifadhi vipengele vya ‘kazi,’ ‘huduma,’ na ‘nyumba ya Yahwe’ huku ikiepuka mnyororo mzito usio wa asili katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania ina jina la agano, si cheo. Kutumia ‘Yahwe’ huhifadhi tofauti hiyo.
- issue: Maana ya עַד katika ahadi ya uwepo wa Mungu
  choice: mpaka kazi yote ... itakapokamilika
  alternative: hadi kazi itakapokamilika, kisha uwepo wake ukome
  rationale: עַד huweka kukamilika kwa kazi kuwa upeo wa uhakikisho unaohitajika hapa; haisemi kwamba Mungu atamwacha Sulemani baada ya kazi kumalizika.
- issue: Kutofautisha לֹא יַרְפְּךָ na לֹא יַעַזְבֶךָּ
  choice: Hatakuacha bila msaada wala hatakutupa
  alternative: Hatakupungukia wala hatakuacha
  rationale: 'Chaguo hili huhifadhi kauli mbili zinazokaribiana lakini zisizofanana: kutolegeza msaada na kumtelekeza kabisa.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa Kiebrania umehifadhiwa pale unapokuwa wa asili, huku mnyororo mzito wa nomino ukifanywa uwe wazi. Alama ya tanbihi [a] imewekwa baada ya kirai husika.
