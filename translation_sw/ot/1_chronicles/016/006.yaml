base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/006.yaml
  text: And Benaiah and Jahaziel the priests were continually with the trumpets before the ark of the covenant of God[a].
translation:
  language: sw
  text: Nao makuhani Benaya na Yahazieli walikuwa mbele ya sanduku la agano la Mungu daima wakiwa na tarumbeta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wakipiga tarumbeta daima mbele ya sanduku la agano la Mungu.” Kiebrania hakitaji kitenzi waziwazi, ingawa huenda hii ndiyo maana iliyokusudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנָיָהוּ
  choice: Nao Benaya
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili; kiunganishi וּ kimewakilishwa kwa “Nao” ili kuendeleza simulizi na kuwaunganisha watu hao wawili.
- source_word: וְ/יַחֲזִיאֵל
  choice: na Yahazieli
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa, kwa kufuata matamshi ya Kiebrania na muundo wa kawaida wa majina katika Kiswahili.
- source_word: הַ/כֹּהֲנִים
  choice: makuhani
  rationale: Nomino hii ya wingi yenye uainisho inawatambulisha Benaya na Yahazieli kwa wadhifa wao. Katika Kiswahili, “Nao makuhani Benaya na Yahazieli” ni mpangilio wa asili na wenye heshima.
- source_word: בַּ/חֲצֹצְרוֹת
  choice: na tarumbeta
  rationale: חֲצֹצְרוֹת ni tarumbeta maalumu, si pembe kwa ujumla. Kihusishi ב kinaeleweka kwa maana ya chombo au uhusiano; “na tarumbeta” hakiongezi kitenzi ambacho hakijaandikwa wazi.
- source_word: תָּמִיד
  choice: daima
  rationale: Neno hili linaonyesha mwendelezo au utendaji wa kawaida unaorudiwa. “Daima” huhifadhi nguvu yake ya kielezi kwa lugha fupi na ya kawaida.
- source_word: לִ/פְנֵי
  choice: mbele ya
  rationale: Hii ni tafsiri ya kawaida ya nafasi, inayoweza pia kubeba dhana ya kuwapo katika huduma mbele ya kitu kitakatifu.
- source_word: אֲרוֹן בְּרִית
  choice: sanduku la agano
  rationale: Mfuatano wa nomino umefasiriwa kwa usemi wa Kiswahili ulio wazi na unaotambulika, “sanduku la agano.”
- source_word: הָ/אֱלֹהִים
  choice: la Mungu
  rationale: Katika muktadha huu אֱלֹהִים anamrejelea Mungu wa Israeli. Muundo wa Kiswahili wa umilikaji unaohitajika baada ya “sanduku” ni “la Mungu.”
theological_decisions:
- issue: Iwapo kuweka wazi kwamba makuhani walikuwa wakipiga tarumbeta
  choice: Kudumisha usemi “walikuwa daima na tarumbeta” katika matini kuu.
  alternative: “walikuwa wakipiga tarumbeta daima mbele ya sanduku la agano la Mungu”
  rationale: Kiebrania kinawataja makuhani, tarumbeta, hali ya kudumu, na mahali pao mbele ya sanduku, lakini hakina kitenzi kilicho wazi cha “kupiga.” Matini kuu inahifadhi ukosefu huo wa kitenzi, huku tanbihi ikieleza maana inayowezekana sana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio “Nao makuhani Benaya na Yahazieli” umetumiwa kwa mtiririko wa asili, huku sintaksia isiyo na kitenzi cha Kiebrania ikilainishwa kwa “walikuwa” bila kuongeza tendo la kupiga tarumbeta.
