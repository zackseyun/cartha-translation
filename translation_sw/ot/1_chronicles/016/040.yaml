source:
  edition: WLC
  text: לְֽ/הַעֲלוֹת֩ עֹל֨וֹת לַ/יהוָ֜ה עַל מִזְבַּ֧ח הָ/עֹלָ֛ה תָּמִ֖יד לַ/בֹּ֣קֶר וְ/לָ/עָ֑רֶב וּ/לְ/כָל הַ/כָּתוּב֙ בְּ/תוֹרַ֣ת יְהוָ֔ה אֲשֶׁ֥ר צִוָּ֖ה עַל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/040.yaml
  text: to offer burnt offerings to Yahweh on the altar of burnt offering continually[a], morning and evening, and according to all that is written in the law of Yahweh, which he commanded for Israel.
translation:
  language: sw
  text: ili kumtolea Yahwe dhabihu za kuteketezwa juu ya madhabahu ya dhabihu ya kuteketezwa daima, asubuhi na jioni, kulingana na yote yaliyoandikwa katika sheria[a] ya Yahwe, aliyowaamuru Waisraeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maagizo ya Yahwe.” Neno la Kiebrania torah linaweza kumaanisha “sheria” au “maagizo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַעֲלוֹת
  choice: kumtolea
  rationale: Katika muktadha wa dhabihu, Hiphil ya עלה humaanisha kutoa dhabihu; kiambishi cha yambwa kinabainisha kwamba dhabihu zinatolewa kwa Yahwe.
- source_word: עֹלוֹת
  choice: dhabihu za kuteketezwa
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa עֹלָה, dhabihu iliyoteketezwa juu ya madhabahu.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יְהוָה limetoholewa moja kwa moja kuwa Yahwe; maana ya kihusishi imejumuishwa katika kitenzi ‘kumtolea.’
- source_word: מִזְבַּח הָעֹלָה
  choice: madhabahu ya dhabihu ya kuteketezwa
  rationale: Tafsiri hii inatambulisha madhabahu maalumu iliyotumiwa kwa dhabihu za kuteketezwa bila kufupisha istilahi ya ibada.
- source_word: תָּמִיד
  choice: daima
  rationale: Neno hili huhusisha mwendelezo au utaratibu wa kudumu; ‘asubuhi na jioni’ hufafanua ratiba yake ya kila siku.
- source_word: לַבֹּקֶר וְלָעָרֶב
  choice: asubuhi na jioni
  rationale: Usemi huu wa asili na wazi unaonyesha nyakati mbili za utoaji wa dhabihu kila siku.
- source_word: וּלְכָל הַכָּתוּב
  choice: kulingana na yote yaliyoandikwa
  rationale: Kihusishi ל hapa kinaonyesha kufuata masharti yote yaliyoandikwa, si kusudi au mnufaika.
- source_word: בְּתוֹרַת יְהוָה
  choice: katika sheria ya Yahwe
  rationale: Katika muktadha huu wa masharti ya ibada yaliyoandikwa, ‘sheria’ huwasilisha maana kuu ya תּוֹרָה; uwezekano wa ‘maagizo’ umehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר צִוָּה עַל יִשְׂרָאֵל
  choice: ambayo aliwaagiza Israeli
  rationale: Tafsiri hii inaonyesha kwamba Yahwe ndiye aliyetoa agizo lililowekwa juu ya Israeli, huku ikiepuka usemi mgumu wa neno kwa neno.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya תּוֹרָה katika muktadha huu
  choice: sheria
  alternative: maagizo
  rationale: Muktadha unahusu masharti ya ibada yaliyoandikwa, hivyo ‘sheria’ inafaa; hata hivyo, maana pana ya mafundisho au maagizo haijaondolewa na imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi umehifadhi hali ya kishazi tegemezi cha Kiebrania, kwa kuwa mstari huu unaendeleza sentensi ya mstari uliotangulia.
