  text: Splendor and majesty are before him[a]; strength and joy are in his place.
translation:
  language: sw
  text: Fahari na adhama viko mbele zake; nguvu na furaha viko mahali pake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali pake pa kukaa” au “katika patakatifu pake.” Kiebrania hapa husema “mahali pake,” usemi mpana zaidi kuliko usemi sambamba katika Zaburi 96:6.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹד
  choice: fahari
  rationale: Neno hili huonyesha uzuri wenye hadhi na uangavu wa kifalme. “Fahari” linatofautishwa na הָדָר bila kuyafanya maneno hayo mawili kuwa na maana moja kabisa.
- source_word: הָדָר
  choice: utukufu
  rationale: Katika ushairi neno hili huonyesha adhama, heshima, au uzuri wenye hadhi. “Utukufu” ni la asili katika Kiswahili cha kibiblia na linaendana vizuri na “fahari.”
- source_word: לְפָנָיו
  choice: mbele zake
  rationale: Huhifadhi taswira ya Kiebrania ya kuwa mbele ya uso au katika uwepo wake, kwa lugha ya kawaida na yenye heshima.
- source_word: עֹז
  choice: nguvu
  rationale: Ni tafsiri ya moja kwa moja na inayoeleweka ya nguvu au uwezo.
- source_word: חֶדְוָה
  choice: furaha
  rationale: Neno hili humaanisha furaha au shangwe; “furaha” ni wazi, fupi, na linafaa katika ulinganifu wa kishairi na “nguvu.”
- source_word: בִּמְקֹמוֹ
  choice: mahali pake
  rationale: Kiebrania kinasema kwa upana “mahali pake,” wala hakitaji moja kwa moja patakatifu. Tafsiri hii huepuka kuifanya maana kuwa finyu kuliko ilivyo katika matini.
theological_decisions:
- issue: Iwapo מְקוֹמוֹ lifafanuliwe mahsusi kuwa patakatifu au mahali pa makao ya Mungu
  choice: mahali pake
  alternative: mahali pake pa kukaa; katika patakatifu pake
  rationale: Ingawa muktadha ni wa ibada na Zaburi 96:6 ina usemi unaotaja patakatifu, Mambo ya Nyakati hapa hutumia neno pana מָקוֹם, “mahali.” Matini kuu inalihifadhi, na uwezekano wa maana maalumu zaidi unawekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Ulinganifu wa vipashio viwili umehifadhiwa, pamoja na upana wa neno “mahali.”
