base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/010.yaml
  text: Boast in his holy name[a]; let the hearts of those who seek Yahweh rejoice.
translation:
  language: sw
  text: Jivunieni jina lake takatifu; mioyo ya wale wanaomtafuta Yahwe ifurahi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: Jivunieni
  rationale: Kitenzi cha Hitpaeli katika hali ya amri kwa wingi hapa kina maana ya kujivunia au kufurahia kwa fahari. “Jivunieni” huhifadhi nguvu ya amri na uhusiano wake na kitu kinachofuata.
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: jina lake takatifu
  rationale: Muundo huu unaonyesha kitu au msingi wa kujivunia. Kiswahili cha “jivunieni jina lake takatifu” ni cha kawaida na huhifadhi maana ya jina lililo takatifu.
- source_word: יִשְׂמַח
  choice: na ifurahi
  rationale: Ingawa kimaumbo ni kitenzi cha nafsi ya tatu, muktadha wa kishairi na wa kuhimiza unaipa nguvu ya jussive; “na ifurahi” huiwasilisha kwa kawaida katika Kiswahili.
- source_word: לֵב מְבַקְשֵׁי
  choice: mioyo ya wale wanaomtafuta
  rationale: “Moyo” umetumiwa kwa maana ya ndani ya mtu, nao washiriki wanaotafuta ni wengi. Wingi “mioyo” ni wa kawaida katika Kiswahili na huonyesha wazi kwamba maneno yanawahusu watu hao wote.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni jina la Mungu lenye konsonanti nne YHWH, si cheo. “Yahwe” ni umbo la Kiswahili linalotambulika la jina hilo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu YHWH. Kulitoa kama “Yahwe” huhifadhi tofauti kati ya jina hilo na cheo “Bwana,” bila kudai uhakika kamili kuhusu matamshi ya kale.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Muundo wa amri na himizo umehifadhiwa.
