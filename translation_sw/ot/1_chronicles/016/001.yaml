  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּבִ֨יאוּ֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יַּצִּ֣יגוּ אֹת֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָֽטָה ל֖/וֹ דָּוִ֑יד וַ/יַּקְרִ֛יבוּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/001.yaml
  text: So they brought in the ark of God and set it in the midst of the tent that David had pitched for it[b][a], and they offered burnt offerings and peace offerings before God.
translation:
  language: sw
  text: Basi wakaliingiza sanduku la Mungu na kuliweka katikati ya hema[a] ambalo Daudi alikuwa amesimamisha kwa ajili yake; nao wakatoa sadaka za kuteketezwa na sadaka za amani[b] mbele za Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani ya hema.” Neno la Kiebrania linaweza kumaanisha “katikati ya” au, kwa maana pana zaidi, “ndani ya” kitu.
    reason: lexical_alternative
  - marker: b
    text: Au, “sadaka za ushirika” au “sadaka za ustawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: wakaliingiza
  rationale: Hifili ya בוא ina maana ya kuleta au kuingiza. Muktadha unaonyesha sanduku likiingizwa ndani ya hema lililoandaliwa.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: sanduku la Mungu
  rationale: Hili ndilo fungu lililo katika Kiebrania; haliongezi maneno ‘la agano,’ ambayo hayapo katika mstari huu.
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: kuliweka
  rationale: יצג katika muundo huu humaanisha kuweka kitu mahali pake. ‘Kuliweka’ ni Kiswahili cha kawaida na sahihi.
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: katikati ya hema
  rationale: בְּתוֹךְ inaweza kumaanisha katikati au ndani ya kitu. Tafsiri hii huhifadhi taswira ya mahali ya Kiebrania, huku tanbihi ikitaja uwezekano mpana zaidi.
- source_word: הָאֹהֶל
  choice: hema
  rationale: Neno la Kiebrania ni nomino ya kawaida ‘hema.’ ‘Maskani’ lingeweza kuingiza utambulisho wa kiibada ambao mstari wenyewe hautaji wazi.
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִיד
  choice: ambalo Daudi alikuwa amesimamisha kwa ajili yake
  rationale: נטה linapotumiwa kuhusu hema humaanisha kulisimamisha au kulitandaza. Kiwakilishi לוֹ kinaeleweka kwa kawaida kuwa kinarejelea sanduku.
- source_word: וַיַּקְרִיבוּ
  choice: wakatoa
  rationale: Katika muktadha wa dhabihu, Hifili ya קרב humaanisha kutoa au kuwasilisha sadaka. ‘Wakatoa’ ni usemi wa kawaida wa kiibada katika Kiswahili.
- source_word: עֹלוֹת
  choice: sadaka za kuteketezwa
  rationale: עֹלָה ni sadaka iliyoteketezwa juu ya madhabahu; istilahi hii huhifadhi aina mahususi ya sadaka.
- source_word: שְׁלָמִים
  choice: sadaka za amani
  rationale: ‘Sadaka za amani’ ni tafsiri iliyozoeleka inayodumisha uhusiano wa neno hili na mzizi שׁלם, huku tanbihi ikionyesha maana nyingine zinazowezekana.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: mbele za Mungu
  rationale: Fungu hili humaanisha kihalisi kuwa mbele ya uso au katika uwepo wa Mungu. ‘Mbele za Mungu’ ni fupi, asilia, na wazi.
theological_decisions:
- issue: Istilahi za sadaka
  choice: 'Kudumisha aina mbili mahususi: ‘sadaka za kuteketezwa’ na ‘sadaka za amani.’'
  alternative: Kuzijumlisha kama ‘dhabihu,’ au kutafsiri שְׁלָמִים kuwa ‘sadaka za ushirika.’
  rationale: Kiebrania kinataja aina tofauti za sadaka. Kuzihifadhi kunatunza umahususi wa ibada bila kuingiza tafsiri ya kimadhehebu; tanbihi inadumisha upana wa שְׁלָמִים.
- issue: Utambulisho wa hema
  choice: Kutumia ‘hema,’ si ‘maskani.’
  alternative: ‘Maskani.’
  rationale: Mstari unatumia nomino ya kawaida ya hema na unasema Daudi alilisimamisha kwa ajili ya sanduku. ‘Maskani’ ingeweza kudokeza moja kwa moja Maskani ya Musa, jambo ambalo mstari hautamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa maandiko. Istilahi ‘sanduku la Mungu,’ ‘hema,’ na aina mahususi za sadaka zimetumiwa kwa uwazi bila kuongeza maelezo yasiyomo katika Kiebrania.
