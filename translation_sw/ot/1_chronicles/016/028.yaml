  text: הָב֤וּ לַֽ/יהוָה֙ מִשְׁפְּח֣וֹת עַמִּ֔ים הָב֥וּ לַ/יהוָ֖ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/028.yaml
  text: Ascribe to Yahweh[a], families of the peoples, ascribe to Yahweh glory and strength.
translation:
  language: sw
  text: Mpeni Yahweh[a], enyi koo za mataifa; mpeni Yahweh utukufu na nguvu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “BWANA”; Kiebrania: YHWH.'
    reason: Huonyesha jina la Kiebrania lililo katika andiko na tafsiri ya cheo inayotumiwa katika mapokeo mengi.
lexical_decisions:
- source_word: הָבוּ
  choice: Mpeni
  rationale: Amri ya wingi ya יהב humaanisha kutoa au kumpa; katika muktadha huu wa sifa, Kiswahili ‘mpeni ... utukufu’ kwa kawaida hueleweka kama kukiri na kutangaza yanayomstahili Mungu, bila kudokeza kwamba wanadamu wanamwongezea kitu.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Kihusishi ל humtambulisha anayelengwa na amri. Jina la agano יְהוָה limetoholewa kuwa ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: jamaa za mataifa
  rationale: מִשְׁפְּחוֹת ni makundi ya watu wenye uhusiano wa kifamilia au koo, na עַמִּים ni jamii nyingi za watu au mataifa. ‘Jamaa za mataifa’ ni ya asili na inadumisha mwito mpana wa Kiebrania.
- source_word: כָּבוֹד
  choice: utukufu
  rationale: Katika muktadha wa sifa kwa Mungu, כָּבוֹד hurejelea utukufu au heshima inayomstahili; ‘utukufu’ ndiyo neno linalofaa zaidi hapa.
- source_word: וָעֹז
  choice: na nguvu
  rationale: עֹז humaanisha nguvu au uweza. ‘Nguvu’ ni neno la kawaida na wazi linalodumisha ulinganifu na ‘utukufu.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko lina jina la pekee la agano יְהוָה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza fasiri ya kimadhehebu.
- issue: Maana ya kumpa Mungu utukufu na nguvu
  choice: Mpeni Yahweh utukufu na nguvu
  alternative: Mkirieni Yahweh utukufu na nguvu
  rationale: Tafsiri inadumisha taswira halisi ya amri הָבוּ huku muktadha wa ibada ukionyesha kuwa watu wanakiri na kutangaza sifa zake, si kwamba wanampa nguvu ambazo hakuwa nazo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. ‘Enyi’ huweka wazi kwamba ‘jamaa za mataifa’ ndiyo wanaoambiwa. Alama ya nusu-koloni hutenganisha mwito na amri inayorudiwa bila kupoteza usambamba wa mstari.
