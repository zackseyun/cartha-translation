base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/004.yaml
  text: He appointed some of the Levites to minister before the ark of Yahweh[a], to commemorate, to give thanks, and to praise Yahweh, the God of Israel.
translation:
  language: sw
  text: Akawateua baadhi ya Walawi wahudumu mbele ya sanduku la Yahweh, ili waadhimishe[a], watoe shukrani, na wamsifu Yahweh, Mungu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wataje” au “wakumbushe.” Kitenzi cha Kiebrania kinaweza kumaanisha kufanya ukumbusho au kutaja katika muktadha wa ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Akawateua
  rationale: Ingawa kitenzi hiki kwa msingi humaanisha ‘aliweka/alitoa,’ katika muktadha wa kuwapa watu jukumu la huduma, ‘akawateua’ huwasilisha maana yake ya kiutawala kwa Kiswahili cha kawaida.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Huhifadhi maana ya mahali na ya ibada bila kuamua ikiwa msisitizo ni kuwa upande wa mbele au katika uwepo wa sanduku.
- source_word: אֲרוֹן יְהוָה
  choice: sanduku la Yahweh
  rationale: Huhifadhi moja kwa moja uhusiano wa nomino hizo na kulitaja sanduku la agano kwa namna fupi inayolingana na Kiebrania.
- source_word: מִן הַלְוִיִּם
  choice: baadhi ya Walawi
  rationale: Huwakilisha matumizi ya מִן yenye maana ya kuchagua sehemu kutoka katika kundi lote.
- source_word: מְשָׁרְתִים
  choice: wahudumu
  rationale: Hueleza huduma rasmi ya ibada iliyofanywa na Walawi mbele ya sanduku.
- source_word: וּלְהַזְכִּיר
  choice: ili waadhimishe ukumbusho[a]
  rationale: Hujaribu kuhifadhi wazo la tendo la ibada linalosababisha au kuendeleza ukumbusho, huku tanbihi ikionyesha maana nyingine zinazowezekana.
- source_word: וּלְהוֹדוֹת
  choice: watoe shukrani
  rationale: Katika muktadha huu wa ibada, kitenzi ידה kinamaanisha kushukuru badala ya kuungama.
- source_word: וּלְהַלֵּל
  choice: wamsifu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya הלל; haiongezi wazo la kuimba ambalo halijaelezwa wazi katika mstari.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huhifadhi wazi muundo na cheo cha agano kilicho katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Kiebrania kinatumia jina binafsi la Mungu, si cheo; ‘Yahweh’ hulihifadhi kwa unukuzi bila kulibadilisha kuwa cheo.
- issue: Maana ya tendo la ibada katika וּלְהַזְכִּיר
  choice: waadhimishe ukumbusho
  alternative: wakumbushe; wafanye kutajwa; waombe kwa kulitaja jina
  rationale: Kitenzi kinaweza kueleza kusababisha ukumbusho, kuadhimisha, au kutaja katika ibada. Tafsiri kuu inaweka wazo la ukumbusho, na tanbihi inalinda upana wake wa maana bila kuamua kimadhehebu ni nani anayekumbushwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ‘ili’ unaonyesha kusudi la uteuzi; vitenzi vya wingi vinaendelea kumrejelea ‘baadhi ya Walawi.’
