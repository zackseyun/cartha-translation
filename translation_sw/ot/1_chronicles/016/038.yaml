  yaml_path: translation/ot/1_chronicles/016/038.yaml
  text: And Obed-edom and their brothers[a], sixty-eight; and Obed-edom son of Jeduthun and Hosah were gatekeepers.
translation:
  language: sw
  text: Na Obed-Edomu na ndugu zao[a], jumla yao sitini na wanane; na Obed-Edomu mwana wa Yeduthuni na Hosa walikuwa walinzi wa malango.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ndugu zao.” Baadhi ya tafsiri hutumia “ndugu zake” ili kufafanua uhusiano, lakini maandishi makuu yanafuata kiambishi tamati cha wingi katika maandishi ya Kiebrania yaliyopokelewa.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/עֹבֵד אֱדֹם
  choice: na Obed-Edomu
  rationale: Kiunganishi וְ kimetafsiriwa “na” ili kuhifadhi mwendelezo wa orodha; jina limeandikwa kwa namna inayosomeka kwa Kiswahili.
- source_word: וַ/אֲחֵי/הֶם
  choice: pamoja na ndugu zao
  rationale: Kiambishi cha nafsi ya tatu wingi -הֶם kimehifadhiwa kwa “zao,” bila kukisawazisha kuwa umoja. “Pamoja na” linaonyesha kwa kawaida kuwa Obed-Edomu anahesabiwa katika jumla inayofuata.
- source_word: שִׁשִּׁים וּ/שְׁמוֹנָה
  choice: watu sitini na wanane
  rationale: Idadi imetolewa kwa Kiswahili cha kawaida; “watu” imeongezwa kwa uwazi kwa kuwa Kiebrania kinaitumia idadi kama jumla ya watu.
- source_word: בֶּן יְדִיתוּן
  choice: mwana wa Yeduthuni
  rationale: Uhusiano wa kifamilia umehifadhiwa moja kwa moja, kama ilivyo muhimu katika utambulisho wa watu katika Mambo ya Nyakati.
- source_word: וְ/חֹסָה
  choice: na Hosa
  rationale: Kiunganishi kinamunganisha Hosa na Obed-Edomu katika jukumu linalofuata.
- source_word: לְ/שֹׁעֲרִים
  choice: walikuwa walinzi wa malango
  rationale: לְ hapa huonyesha kazi au cheo walichopewa. Kiswahili cha kawaida huhitaji kitenzi “walikuwa”; “walinzi wa malango” linaeleza jukumu la שֹׁעֲרִים kwa uwazi.
