base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/015.yaml
  text: Remember his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: sw
  text: Likumbukeni agano lake milele, neno[a] aliloliamuru kwa vizazi elfu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ahadi aliyoiamuru kwa vizazi elfu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Likumbukeni
  rationale: Ni amri ya wingi inayoelekezwa kwa jumuiya. Kiswahili huhitaji kiambishi cha yambwa kwa mtiririko wa kawaida; “-li-” humrejelea “agano” bila kuongeza msisitizo usiokuwamo katika Kiebrania.
- source_word: לְעוֹלָם
  choice: milele
  rationale: Huwasilisha maana ya kudumu daima kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: בְּרִיתוֹ
  choice: agano lake
  rationale: “Agano” ndilo neno la kawaida la Kiswahili kwa ahadi au uhusiano wenye masharti unaofungwa rasmi, hasa katika muktadha wa Mungu.
- source_word: דָּבָר
  choice: neno
  rationale: Huhifadhi upana wa neno la Kiebrania, ambalo laweza kumaanisha neno, jambo, au katika muktadha huu ahadi; tafsiri finyu zaidi imewekwa katika tanbihi.
- source_word: צִוָּה
  choice: aliloliamuru
  rationale: Huhifadhi maana ya kawaida ya kitenzi “kuamuru” na kuunganisha sentensi ya pili na “neno” kwa Kiswahili cha asili.
- source_word: לְאֶלֶף דּוֹר
  choice: kwa vizazi elfu
  rationale: “Kwa” huonyesha mweneo wa agizo hilo katika vizazi elfu bila kuamua kimya kimya kama idadi hiyo ni halisi au ni namna ya kuonyesha wingi mkubwa.
theological_decisions:
- issue: Iwapo דָּבָר litafsiriwe “neno” au “ahadi” katika usambamba na agano
  choice: neno
  alternative: ahadi
  rationale: “Neno” huhifadhi upana wa Kiebrania na mvutano wa kifungu, ilhali “ahadi” hufafanua maana yake kwa kuongozwa na muktadha wa agano. Uwezekano huo umetolewa katika tanbihi badala ya kuingizwa moja kwa moja katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi umehifadhiwa kwa ufupi bila kufanya lugha kuwa ngumu.
