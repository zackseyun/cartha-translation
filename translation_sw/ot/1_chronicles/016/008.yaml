lexical_decisions:
- source_word: הוֹד֤וּ
  choice: Mshukuruni
  rationale: Kauli ya kuamuru ya wingi ya ידה katika muktadha wa sifa humaanisha kumshukuru au kumsifu Mungu. “Mshukuruni” ni ya kawaida, wazi, na hudumisha maana kuu hapa.
- source_word: לַֽיהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kulibadilisha kuwa cheo, ili kuhifadhi jina la agano lililo katika maandishi ya Kiebrania.
- source_word: קִרְא֣וּ בִ/שְׁמ֔/וֹ
  choice: liitieni jina lake
  rationale: Katika muundo huu, קרא pamoja na בְּשֵׁם hueleza kumwitia au kumwomba Mungu kwa kulitumia jina lake. “Liitieni jina lake” ni usemi wa Kiswahili unaoeleweka na unaohifadhi dhana ya kumwelekea Mungu kwa ibada.
- source_word: הוֹדִ֥יעוּ
  choice: yatangazeni
  rationale: Hifili ya ידע ina maana ya kusababisha jambo lijulikane. “Yatangazeni” huwasilisha kusudi hilo kwa Kiswahili cha kawaida na cha hadhi, bila kutumia muundo mzito wa “fanyeni yajulikane.”
- source_word: בָ/עַמִּ֖ים
  choice: miongoni mwa mataifa
  rationale: עַמִּים ni wingi unaoweza kumaanisha jamii za watu au mataifa. “Miongoni mwa mataifa” huhifadhi wingi na wazo la kutangaza kwa vikundi mbalimbali vya watu.
- source_word: עֲלִילֹתָֽי/ו
  choice: matendo yake
  rationale: Neno hili hurejelea yale aliyoyatenda, mara nyingi matendo yenye kutazamika. “Matendo yake” ni pana na haliongezi kivumishi kama “makuu” ambacho hakipo wazi katika mstari.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina binafsi la Mungu, יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku umbo hilo likiwa la kawaida katika Kiswahili.
- issue: Maana ya קִרְאוּ בִשְׁמוֹ
  choice: liitieni jina lake
  alternative: tangazeni jina lake
  rationale: Muundo huu unaweza kuhusishwa na kumwitia Mungu au kulitangaza jina lake. Muktadha wa maagizo ya ibada unaunga mkono maana ya kumwitia, lakini tafsiri haiongezi maelezo kuhusu namna ya maombi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Vitenzi vya amri ya wingi vimehifadhiwa, na vipashio vitatu sambamba vimetenganishwa kwa nukta mkato ili kuakisi mshororo wa Kiebrania.
