  text: Give thanks to Yahweh[a]; call on his name[b]; make his deeds known among the peoples.
translation:
  language: sw
  text: Mshukuruni Yahwe; liitieni jina lake; wajulisheni mataifa matendo yake[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miongoni mwa jamii za watu.”
    reason: lexical_alternative
  - marker: b
    text: Au “matendo aliyoyafanya.”
