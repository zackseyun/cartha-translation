translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Muundo umehifadhi orodha ya ala na kirai chenye utata kuhusu lango bila kuongeza maelezo ya kimadhehebu.
