base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/042.yaml
  text: And with them were Heman and Jeduthun with trumpets and cymbals for sounding aloud[a], and instruments for the songs of God; and the sons of Jeduthun were at the gate.
translation:
  language: sw
  text: Pamoja nao walikuwa Hemani na Yeduthuni, wakiwa na tarumbeta na matoazi za kupaza sauti, na vyombo vya nyimbo za Mungu; nao wana wa Yeduthuni walikuwa langoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, walikuwa walinzi wa lango; Kiebrania kihalisi kinasema “kwa/kwenye lango,” huenda kikimaanisha kazi waliyopewa langoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Pamoja nao walikuwa
  rationale: Kirai hiki kinawatambulisha watu waliokuwa pamoja na kundi lililotajwa; kitenzi ‘walikuwa’ kinaongezwa ili sentensi iwe kamili na ya kawaida katika Kiswahili.
- source_word: הֵימָן
  choice: Hemani
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: וִידוּתוּן
  choice: Yeduthuni
  rationale: Jina la mtu limetoholewa kwa sauti na tahajia ya Kiswahili.
- source_word: חֲצֹצְרוֹת
  choice: tarumbeta
  rationale: Neno hili hurejelea tarumbeta za chuma zilizotumiwa katika ibada na sherehe.
- source_word: וּמְצִלְתַּיִם
  choice: matoazi
  rationale: ‘Matoazi’ ni neno la kawaida la Kiswahili kwa ala hizi mbili za kugonganisha.
- source_word: לְמַשְׁמִיעִים
  choice: ya kufanya sauti isikike
  rationale: Kauli ya kusababisha ya kitenzi שמע ina maana ya ‘kusababisha isikike’; tafsiri hii inaeleza matumizi ya tarumbeta na matoazi bila kuamua kwamba sauti hiyo ilikuwa melodi.
- source_word: וּכְלֵי שִׁיר
  choice: pamoja na vyombo vya nyimbo
  rationale: Huhifadhi uhusiano wa moja kwa moja wa Kiebrania, ‘vyombo vya nyimbo,’ huku ‘pamoja na’ ikiunganisha orodha kwa Kiswahili cha kawaida.
- source_word: הָאֱלֹהִים
  choice: za Mungu
  rationale: Huhifadhi kirai cha Kiebrania ‘nyimbo za Mungu’ bila kukifafanua kwa namna finyu kuwa nyimbo zinazomilikiwa na Mungu au zinazoimbwa kwa ajili yake.
- source_word: וּבְנֵי יְדוּתוּן
  choice: nao wana wa Yeduthuni
  rationale: ‘Wana’ huhifadhi maana ya ukoo na jinsia katika muktadha huu wa Walawi.
- source_word: לַשָּׁעַר
  choice: walikuwa langoni
  rationale: Kiebrania kinasema kwa ufupi ‘kwa/kwenye lango.’ Tafsiri hii inadumisha ufupi na uwezekano wa kumaanisha mahali au kazi waliyopewa, badala ya kuamua moja kwa moja kwamba walikuwa walinzi wa lango.
