id: 1CH.16.31
reference: 1 Chronicles 16:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יִשְׂמְח֤וּ הַ/שָּׁמַ֨יִם֙ וְ/תָגֵ֣ל הָ/אָ֔רֶץ וְ/יֹאמְר֥וּ בַ/גּוֹיִ֖ם יְהוָ֥ה מָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/031.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; and let them say among the nations, “Yahweh reigns!”
translation:
  language: sw
  text: 'Mbingu na zifurahi, nayo dunia na ishangilie;

    na waseme miongoni mwa mataifa,

    “Yahwe anatawala!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe amekuwa Mfalme!”
    reason: Kitenzi cha Kiebrania מָלָךְ kinaweza kutangaza kwamba Yahwe anatawala sasa au, katika muktadha wa kutawazwa, kwamba amekuwa Mfalme.
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: na zifurahi
  rationale: Kauli ya hiari katika muktadha huu wa kishairi inatoa mwito wa furaha; upatanisho wa ngeli umefuata nomino ya Kiswahili “mbingu”.
- source_word: הַשָּׁמַיִם
  choice: mbingu
  rationale: Katika ulinganifu huu wa ulimwengu mzima, neno hili linamaanisha anga au ulimwengu wa juu, si anga inayoonekana tu.
- source_word: וְתָגֵל
  choice: nayo ... na ishangilie
  rationale: Kitenzi גיל kinaonyesha furaha kuu au shangwe; “ishangilie” huhifadhi nguvu yake na pia utofauti wake na “zifurahi”.
- source_word: הָאָרֶץ
  choice: dunia
  rationale: Kwa kuwa neno hili linalinganishwa na “mbingu,” hapa linarejelea dunia yote badala ya nchi fulani.
- source_word: וְיֹאמְרוּ
  choice: na waseme
  rationale: Muundo huu unaendeleza mwito wa kishairi. Kiima kisichotajwa wazi kimeachwa vivyo hivyo badala ya kuongezwa “watu” katika matini.
- source_word: בַגּוֹיִם
  choice: miongoni mwa mataifa
  rationale: Neno גוים linarejelea mataifa au jamii za ulimwengu kwa upana, wala si lazima tofauti ya baadaye ya kidini inayodokezwa na “Wamataifa.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye konsonanti YHWH limetolewa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: מָלָךְ
  choice: anatawala
  rationale: Katika kauli hii ya sifa, wakati timilifu wa מלך hutangaza uhalisi wa sasa wa ufalme wa Yahwe. “Anatawala” ni usemi wa kawaida na wenye nguvu katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania ina jina binafsi la Mungu, si cheo אֲדֹנָי; kwa hiyo limetoholewa kama “Yahwe” bila kulibadilisha kuwa “BWANA.”
- issue: Maana ya מָלָךְ katika tangazo la kifalme
  choice: Yahwe anatawala
  alternative: Yahwe amekuwa Mfalme
  rationale: “Anatawala” hutangaza ufalme wake kama uhalisi wa sasa bila kulazimisha wazo kwamba alianza kuwa Mfalme wakati fulani. Hata hivyo, maana ya kuingia katika ufalme inawezekana kisarufi na imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kishairi, wenye heshima na unaoeleweka. Ulinganifu wa “mbingu” na “dunia” pamoja na mfululizo wa miito umehifadhiwa. Kiima cha “waseme” hakijaainishwa kwa sababu Kiebrania pia hakikitaji wazi.
