  yaml_path: translation/ot/1_chronicles/016/022.yaml
  text: Do not touch my anointed ones[a], and do not harm my prophets.
translation:
  language: sw
  text: Msiwaguse waliotiwa mafuta wangu, wala msiwadhuru manabii wangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: msiwaguse
  rationale: Kitenzi נגע kwa kawaida humaanisha ‘gusa.’ Katika katazo hili, ‘msiwaguse’ ni tafsiri ya moja kwa moja na, kwa kuzingatia mstari sambamba, inadokeza kuwafanyia uadui bila kufafanua aina fulani ya shambulio.
- source_word: בִּמְשִׁיחָי
  choice: watiwa-mafuta wangu
  rationale: מָשִׁיחַ humaanisha ‘aliyetiwa mafuta.’ Umbo hili ni la wingi lenye kiambishi cha nafsi ya kwanza umoja, kwa hiyo ‘watiwa-mafuta wangu’ linaonyesha wingi wazi na halilazimishi maana ya cheo cha Masihi mmoja.
- source_word: וּבִנְבִיאַי
  choice: manabii wangu
  rationale: נָבִיא humaanisha ‘nabii’; umbo la wingi lenye kiambishi cha nafsi ya kwanza umoja linatafsiriwa kwa kawaida kuwa ‘manabii wangu.’
- source_word: תָּרֵעוּ
  choice: msiwadhuru
  rationale: Kitenzi רעע katika muundo huu wa katazo kina maana ya kuwatendea watu mabaya au kuwadhuru. ‘Msiwadhuru’ ni fupi, ya asili, na inahifadhi upana wa madhara yanayokusudiwa.
- source_word: אַל
  choice: msi- … wala msi-
  rationale: אַל pamoja na vitenzi vinavyofuata huonyesha katazo. Kiswahili hutumia ‘msi-’; ‘wala’ huunganisha katazo la pili kwa ufasaha huku kikihifadhi usambamba wa sentensi.
theological_decisions:
- issue: Maana ya מְשִׁיחָי katika muktadha wa wingi usiomlenga Masihi mmoja
  choice: watiwa-mafuta wangu
  alternative: masihi wangu
  rationale: Neno la Kiebrania lina uhusiano wa kimsamiati na ‘Masihi,’ lakini hapa ni nomino ya kawaida ya wingi inayowataja kwa upana watu waliotiwa mafuta na Mungu. ‘Watiwa-mafuta wangu’ huhifadhi maana hiyo bila kuingiza dai kwamba mstari unamtaja Masihi mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo wa katazo na usambamba wa kishairi umehifadhiwa.
