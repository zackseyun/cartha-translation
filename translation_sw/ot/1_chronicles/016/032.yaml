  variant: Standard East African Swahili
source:
  edition: WLC
  text: יִרְעַ֤ם הַ/יָּם֙ וּ/מְלוֹא֔/וֹ יַעֲלֹ֥ץ הַ/שָּׂדֶ֖ה וְ/כָל אֲשֶׁר בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/032.yaml
  text: Let the sea thunder[a], and all that fills it; let the field exult[b], and all that is in it.
translation:
  language: sw
  text: Bahari na ivume[a], pamoja na vyote vinavyoijaza; shamba na lishangilie, pamoja na vyote vilivyomo ndani yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ingurume.” Kitenzi cha Kiebrania kinaweza kumaanisha kutoa sauti kubwa ya mvumo au mngurumo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעַם
  choice: na ivume
  rationale: Kitenzi רעם huonyesha sauti kubwa ya mngurumo au mvumo. Kiswahili “ivume” ni cha kishairi na cha kawaida kwa sauti kuu ya bahari, huku tanbihi ikihifadhi uwezekano wa “ingurume.”
- source_word: הַיָּם
  choice: bahari
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya יָם katika muktadha huu wa kishairi.
- source_word: וּמְלוֹאוֹ
  choice: pamoja na vyote vinavyoijaza
  rationale: Neno מְלוֹאוֹ kwa halisi ni “ujazo wake,” yaani jumla ya vitu vinavyoijaza bahari. Kauli hii inaweka maana hiyo wazi kwa Kiswahili cha sasa.
- source_word: יַעֲלֹץ
  choice: na lishangilie
  rationale: Kitenzi עלץ huonyesha furaha ya shangwe. “Lishangilie” kinadumisha nguvu ya kishairi na uhuishaji wa shamba.
- source_word: הַשָּׂדֶה
  choice: shamba
  rationale: “Shamba” ni tafsiri ya moja kwa moja ya שָׂדֶה na inafaa katika usambamba wa kishairi na “bahari.”
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: pamoja na vyote vilivyomo ndani yake
  rationale: Kauli hii inarejelea shamba na kuhifadhi maana jumuishi ya כָל pamoja na muundo wa “vilivyomo ndani yake.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Muundo wa “na + kiima + hali ya kutendeka” umetumiwa kuwasilisha jussive za Kiebrania kwa njia ya kawaida. Uhuishaji wa bahari na shamba umehifadhiwa.
