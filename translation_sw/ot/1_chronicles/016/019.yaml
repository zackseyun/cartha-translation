lexical_decisions:
- source_word: בִּהְיוֹתְכֶם
  choice: mlipokuwa
  rationale: Muundo wa ב pamoja na kitenzi-jina cha היה na kiambishi cha nafsi ya pili wingi huanzisha kishazi cha wakati; “mlipokuwa” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: מְתֵי מִסְפָּר
  choice: wachache kwa idadi
  rationale: Nahau hii ya Kiebrania humaanisha watu wachache wanaoweza kuhesabika kwa urahisi; “wachache kwa idadi” huwasilisha maana hiyo wazi.
- source_word: כִּמְעַט
  choice: wachache sana
  rationale: Katika muktadha huu, neno hili linasisitiza zaidi uchache uliotajwa, badala ya kuonyesha tu kiasi kidogo.
- source_word: וְגָרִים
  choice: na wageni mkaao kwa muda
  rationale: Kitenzi גור humaanisha kuishi mahali kama mgeni asiye mwenyeji au mkazi wa kudumu. Usemi huu ni wa kawaida na unahifadhi hali ya kukaa kwa muda.
- source_word: בָּהּ
  choice: katika nchi hiyo
  rationale: Kiambishi cha kike umoja kinarejelea nchi iliyotajwa katika muktadha. Kutaja “nchi hiyo” kunaondoa utata usio wa lazima katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mstari unaendeleza sentensi ya muktadha, kwa hiyo umeanza kwa herufi ndogo na kuishia kwa koma. “Wageni mkaao kwa muda” huepuka neno la kizamani “wapitaji” na kueleza hadhi ya kutokuwa wakazi wa kudumu.
