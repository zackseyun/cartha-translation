  text: mlipokuwa wachache kwa hesabu[a], wachache sana, na wageni waliokuwa wakiishi katika nchi hiyo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wachache kweli” au “karibu hakuna”; Kiebrania kinakazia jinsi walivyokuwa wachache.
