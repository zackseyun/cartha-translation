  text: דִּרְשׁ֤וּ יְהוָה֙ וְ/עֻזּ֔/וֹ בַּקְּשׁ֥וּ פָנָ֖י/ו תָּמִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/011.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: sw
  text: Mtafuteni Yahwe na nguvu zake; tafuteni uso wake[a] daima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwepo wake” (kihalisi, “uso wake”).
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Mtafuteni
  rationale: Kitenzi hiki cha amri kwa wingi kinahimiza kumwelekea Mungu na kumtafuta kwa bidii; “mtafuteni” ni cha kawaida, wazi, na kinafaa katika himizo hili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA,” ili kuhifadhi jina la pekee lililo katika maandishi ya Kiebrania.
- source_word: וְעֻזּוֹ
  choice: na nguvu zake
  rationale: עֹז hapa hueleza nguvu au uweza wa Mungu. “Nguvu zake” ni usemi wa kawaida wa Kiswahili na hudumisha wazo la kutafuta nguvu zitokazo kwake, bila kulifanya neno hilo kuwa “ngome.”
- source_word: בַּקְּשׁוּ
  choice: utafuteni
  rationale: Kitenzi hiki pia ni amri kwa wingi na huonyesha jitihada ya dhati ya kutafuta. Kurudia “tafuta” kunahifadhi ulinganifu wa kishairi wa mistari hiyo.
- source_word: פָנָיו
  choice: uso wake
  rationale: Maana ya moja kwa moja ni “uso wake.” Nahau hiyo inaweza kumaanisha uwepo wake, lakini taswira halisi imehifadhiwa katika maandishi na maana mbadala imeelezwa katika tanbihi.
- source_word: תָּמִיד
  choice: daima
  rationale: Neno hili huonyesha mwendelezo au uthabiti. “Daima” ni fupi, la kawaida, na linafaa kwa sauti ya himizo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina hilo la agano badala ya kulibadilisha na cheo; “Yehova” si utohozi unaowakilisha kwa usahihi uleule umbo la jina la Kiebrania.
- issue: Maana ya “uso wake”
  choice: Kuhifadhi “uso wake” katika maandishi
  alternative: uwepo wake
  rationale: Kiebrania kina usemi halisi “uso wake,” ambao pia huelekeza kwenye uwepo wa Mungu. Kuhifadhi taswira hiyo huepuka kufuta kwa kimya utajiri na mvutano wa nahau; “uwepo wake” umetolewa kama maana mbadala katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Amri za wingi “mtafuteni” na “utafuteni” zinahifadhi mwito unaoelekezwa kwa jumuiya; mpangilio wa kishairi na urudiaji wa chanzo umehifadhiwa.
