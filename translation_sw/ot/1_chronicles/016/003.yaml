  yaml_path: translation/ot/1_chronicles/016/003.yaml
  text: He distributed to every person of Israel[a], from man to woman, to each one a loaf of bread, a portion of meat, and a raisin cake.
translation:
  language: sw
  text: Akawagawia Waisraeli wote, kuanzia wanaume hadi wanawake, kila mmoja mkate mmoja, fungu la nyama[a], na keki ya zabibu kavu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda “fungu” au aina nyingine ya chakula; neno la Kiebrania אֶשְׁפָּר ni nadra, na maana yake kamili haijulikani. Wengi hulielewa hapa kuwa fungu la nyama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: Akawagawia
  rationale: Kitenzi katika Piel hapa kinaonyesha kugawa vitu kwa watu wengi; “akawagawia” ni Kiswahili cha kawaida na hudumisha wazo la kumpa kila mtu fungu.
- source_word: לְכָל אִישׁ יִשְׂרָאֵל
  choice: kila mtu wa Israeli
  rationale: אִישׁ ina nguvu ya ugawaji hapa, na kifungu kinachofuata kinaonyesha wazi kuwa wanaume na wanawake walihusika; “kila mtu” ni wazi na asilia kwa Kiswahili.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: wanaume kwa wanawake
  rationale: Huhifadhi mtindo wa Kiebrania unaotaja makundi yote mawili badala ya kuufupisha kuwa “wote”; katika Kiswahili, wingi unalingana kiasili na kundi zima la wapokeaji.
- source_word: לְאִישׁ
  choice: kila mmoja
  rationale: Ni matumizi ya ugawaji yanayorejelea kila mpokeaji, mwanamume au mwanamke.
- source_word: כִּכַּר לֶחֶם
  choice: mkate mmoja
  rationale: כִּכָּר hapa ni mkate mzima wenye umbo la mviringo; “mkate mmoja” ni usemi wa kawaida na unaeleweka bila kulazimisha maelezo ya umbo.
- source_word: אֶשְׁפָּר
  choice: sehemu ya nyama
  rationale: Neno hili ni nadra na maana yake kamili haijulikani; muktadha wa chakula cha sherehe unaunga mkono tafsiri ya kawaida ya fungu la nyama, huku tanbihi ikihifadhi kutokuwa na uhakika.
- source_word: אֲשִׁישָׁה
  choice: keki ya zabibu kavu
  rationale: Neno hili hutajwa kwingine kama keki iliyoshindiliwa, ambayo kwa kawaida hueleweka kuwa ya zabibu kavu; tafsiri hii ni fupi na wazi.
