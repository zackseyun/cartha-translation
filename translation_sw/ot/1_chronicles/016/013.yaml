id: 1CH.16.13
reference: 1 Chronicles 16:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: זֶ֚רַע יִשְׂרָאֵ֣ל עַבְדּ֔/וֹ בְּנֵ֥י יַעֲקֹ֖ב בְּחִירָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/013.yaml
  text: O offspring of Israel his servant[a], sons of Jacob[c][b], his chosen ones.
translation:
  language: sw
  text: Enyi wazao wa Israeli[a], mtumishi wake; enyi wana wa Yakobo[b], wateule wake.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbegu ya Israeli”; Kiebrania hutumia jina la umoja lenye maana ya pamoja kwa ajili ya wazao.
    reason: lexical_alternative
  - marker: b
    text: Au “watoto wa Yakobo”; Kiebrania ni “wana wa Yakobo” kwa maana halisi.
    reason: lexical_alternative
  - marker: c
    text: Au “wale aliowachagua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  choice: wazao
  rationale: Neno hili linamaanisha uzao au vizazi kwa maana ya pamoja. “Wazao” ni Kiswahili cha kawaida na huonyesha wazi watu wanaotokana na Israeli, huku tanbihi ikihifadhi picha halisi ya “mbegu” na umoja wa kijumla wa Kiebrania.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: עַבְדּוֹ
  choice: mtumishi wake
  rationale: Katika muktadha huu עבד humtambulisha Israeli kwa uhusiano wake wa huduma na Mungu, bila kusisitiza hali ya utumwa wa kijamii. Kiwakilishi “wake” kinahifadhi kiambishi cha nafsi ya tatu katika Kiebrania.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Hii inahifadhi kwa karibu umbo halisi la Kiebrania, “wana wa,” ambalo hapa ni usemi wa ukoo na pia wa jumuiya.
- source_word: יַעֲקֹב
  choice: Yakobo
  rationale: Hili ndilo umbo la kawaida la jina la babu huyo katika Kiswahili cha Biblia.
- source_word: בְּחִירָיו
  choice: wateule wake
  rationale: Neno hili ni la wingi na linamaanisha wale aliowachagua. “Wateule wake” ni fupi, yenye heshima, na huhifadhi wingi pamoja na kiambishi cha umilikaji.
theological_decisions:
- issue: Yule anayerejelewa na viambishi vya nafsi ya tatu katika “mtumishi wake” na “wateule wake”
  choice: Viambishi vimetafsiriwa moja kwa moja kuwa “wake,” huku muktadha ukielekeza kwamba vinamrejelea Mungu.
  alternative: Kuyafanya wazi zaidi kwa kusema “mtumishi wa Mungu” na “wateule wa Mungu.”
  rationale: Kiebrania hutumia viambishi vya nafsi ya tatu bila kurudia jina la Mungu. “Wake” huhifadhi muundo huo na kutoruhusu tafsiri kuondoa kabisa uwezekano wa hali ya kishairi, ingawa katika muktadha rejeo la kawaida ni BWANA.
translation_notes:
  register: Lugha ni ya sasa, yenye heshima, na ya kishairi. “Enyi” inaonyesha wazi kwamba makundi haya yanaelekezewa maneno katika wimbo huu, na nusu mbili za mstari zimeunganishwa kwa nukta mkato ili kuonyesha ulinganifu wa kishairi.
