base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/026.yaml
  text: For all the gods of the peoples are idols[b][a], but Yahweh made the heavens.
translation:
  language: sw
  text: Kwa maana miungu yote ya mataifa[a] ni sanamu, lakini[b] Yahwe alizifanya mbingu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu.”
    reason: lexical_alternative
  - marker: b
    text: Kiunganishi cha Kiebrania kwa maana halisi ni “na,” lakini hapa kinaonyesha tofauti.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kirai hiki kinaanzisha sababu ya mwito unaotangulia wa kumwabudu Yahwe, huku kikibaki cha kawaida katika Kiswahili.
- source_word: כָּל אֱלֹהֵי
  choice: miungu yote
  rationale: Huhifadhi wingi na upeo kamili wa kauli ya Kiebrania.
- source_word: הָעַמִּים
  choice: ya mataifa
  rationale: Katika muktadha wa miungu inayoabudiwa na makundi mbalimbali, ‘mataifa’ ni usemi wa kawaida na unaoeleweka; ‘watu mbalimbali’ pia inawezekana.
- source_word: אֱלִילִים
  choice: sanamu
  rationale: Neno hili humaanisha sanamu za kuabudiwa na lina ladha ya kuzidharau kuwa zisizo na thamani. ‘Sanamu’ ni wazi bila kuongeza ufafanuzi ndani ya matini.
- source_word: וַיהוָה
  choice: lakini Yahwe
  rationale: Ingawa ו ni kiunganishi ambacho kimsingi humaanisha ‘na,’ hapa kinaonyesha tofauti kati ya sanamu na Yahwe, Muumba wa mbingu. Jina la agano יהוה limetafsiriwa ‘Yahwe.’
- source_word: שָׁמַיִם
  choice: mbingu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa wingi wa Kiebrania, hasa katika kauli kuhusu uumbaji.
- source_word: עָשָׂה
  choice: alizifanya
  rationale: Hutafsiri moja kwa moja maana ya ‘kufanya’ na upatanisho wa ngeli unaohitajika kwa ‘mbingu,’ bila kuimarisha maana kuwa ‘kuumba.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ina jina la agano יהוה lenyewe; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Nguvu ya kiunganishi ו kabla ya יהוה
  choice: lakini
  alternative: na
  rationale: Muundo wa mstari unatofautisha sanamu za mataifa na Yahwe aliyefanya mbingu. ‘Lakini’ huonyesha uhusiano huo wa kimuktadha, huku tanbihi ikihifadhi tafsiri halisi ya kiunganishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Mpangilio ni wa asili katika Kiswahili, na tofauti ya kishairi kati ya sanamu na Yahwe imehifadhiwa bila kuongeza mafundisho.
