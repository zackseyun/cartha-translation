  text: לֹא הִנִּ֤יחַ לְ/אִישׁ֙ לְ/עָשְׁקָ֔/ם וַ/יּ֥וֹכַח עֲלֵי/הֶ֖ם מְלָכִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/021.yaml
  text: He allowed no man to oppress them[a], and he rebuked kings on their account,
translation:
  language: sw
  text: Hakumruhusu mtu yeyote kuwaonea, naye aliwakemea wafalme kwa ajili yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנִּיחַ
  choice: hakumruhusu
  rationale: Katika kausativi ikiwa na לֹא na kitenzi-jina, neno hili lina maana ya kutoruhusu tendo lifanyike; Kiswahili cha kawaida huhitaji kiambishi cha yambwa pamoja na ‘mtu yeyote.’
- source_word: אִישׁ
  choice: mtu yeyote
  rationale: Ingawa Kiebrania kina nomino ya umoja ya kiume, hapa imetumiwa kwa maana ya jumla. ‘Mtu yeyote’ ni Kiswahili cha kawaida na huwasilisha maana ya kutokuwapo hata mmoja bila kuibadili kuwa kundi.
- source_word: לְעָשְׁקָם
  choice: kuwaonea
  rationale: עָשַׁק inaweza kumaanisha kuonea, kudhulumu, au kunyanyasa kwa manufaa. ‘Kuwaonea’ ni ya asili, wazi, na inafaa katika muhtasari huu wa kihistoria.
- source_word: וַיּוֹכַח
  choice: aliwakemea
  rationale: יכח hapa huonyesha kukaripia au kukemea kwa mamlaka. ‘Aliwakemea’ hudumisha uzito wa tendo linaloelekezwa kwa wafalme.
- source_word: עֲלֵיהֶם
  choice: kwa ajili yao
  rationale: עַל pamoja na kiambishi hapa huonyesha kwamba Mungu alichukua hatua kuhusiana nao au kwa manufaa yao. ‘Kwa ajili yao’ ni ya kawaida katika Kiswahili na inahifadhi wazo la ulinzi.
- source_word: מְלָכִים
  choice: wafalme
  rationale: Nomino hii ina maana ya moja kwa moja ya wafalme; hakuna sababu ya kuipanua kuwa watawala kwa ujumla.
theological_decisions:
- issue: Kiima kisichotajwa wazi cha vitenzi
  choice: Mungu ndiye kiima, akirejelewa kwa ‘-ku-’ na ‘ali-’ katika vitenzi.
  alternative: Kiima kisichobainishwa
  rationale: Muktadha unaendelea kueleza matendo ya Mungu ya kuwalinda mababu. Kiswahili kinaweza kuonyesha nafsi ya tatu katika vitenzi bila kutaja kiwakilishi tofauti, hivyo maana ya muktadha inahifadhiwa bila kuongeza jina lisilo katika mstari huu.
- issue: Maana ya עֲלֵיהֶם
  choice: kwa ajili yao
  alternative: kwa sababu yao
  rationale: Kirai kinaweza kueleza hatua iliyochukuliwa kwa manufaa yao au kutokana na yaliyowahusu. Muktadha wa ulinzi unapendelea ‘kwa ajili yao,’ huku uwezekano wa kisababishi ukiwa mdogo na usiohitaji tanbihi katika tafsiri hii fupi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni rahisi kusomeka kwa sauti; ‘mtu yeyote’ huepuka usemi usio wa kawaida wa ‘mtu’ peke yake baada ya ukanushi, na ‘kuwaonea’ ni neno linaloeleweka kwa upana.
