base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/005.yaml
  text: Asaph was the chief[a], and second to him was Zechariah; then Jeiel, Shemiramoth, Jehiel, Mattithiah, Eliab, Benaiah, Obed-edom, and Jeiel, with instruments of harps and lyres[b]; and Asaph sounded the cymbals.
translation:
  language: sw
  text: Asafu alikuwa mkuu,[a] na wa pili wake alikuwa Zekaria; Yeieli, Shemiramothi, Yehieli, Matithia, Eliabu, Benaya, Obed-Edomu na Yeieli walikuwa na vinubi na zeze,[b] naye Asafu alipiga matoazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na Zekaria alikuwa wa pili baada yake.” Neno la Kiebrania linaonyesha cheo cha pili kuhusiana na Asafu.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinatofautisha aina mbili za ala za nyuzi: nebalim na kinnorot, zilizotafsiriwa hapa “vinubi” na “zeze.”'
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: mkuu
  rationale: Katika orodha hii neno hilo linaonyesha cheo cha uongozi, si sehemu ya mwili; “mkuu” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: וּמִשְׁנֵהוּ
  choice: na Zekaria alikuwa wa pili baada yake
  rationale: Muundo huu unaonyesha kwamba Zekaria alikuwa katika cheo cha pili akilinganishwa na Asafu.
- source_word: יְעִיאֵל / וִיעִיאֵל
  choice: Yeieli
  rationale: Jina lilelile limetafsiriwa kwa namna moja katika sehemu zote mbili linapotokea.
- source_word: בִּכְלֵי נְבָלִים
  choice: walipiga vinubi
  rationale: Neno נְבָלִים linataja aina ya ala za nyuzi; “vinubi” ni istilahi ya kawaida ya Kiswahili, huku kitenzi “walipiga” kikieleza kwa kawaida matumizi ya ala hizo.
- source_word: וּבְכִנֹּרוֹת
  choice: na zeze
  rationale: כִּנּוֹרוֹת ni aina nyingine ya ala za nyuzi, tofauti na נְבָלִים; “zeze” linahifadhi tofauti hiyo kwa Kiswahili kinachoeleweka.
- source_word: בַּמְצִלְתַּיִם
  choice: matoazi
  rationale: Hizi ni ala za kugonganishwa zinazojulikana kwa Kiswahili kama matoazi.
- source_word: מַשְׁמִיעַ
  choice: akapiga
  rationale: Hifili ya שמע hapa ina maana ya kuzifanya ala zisikike; kwa matoazi, “akapiga” ni usemi wa asili unaowasilisha tendo hilo.
