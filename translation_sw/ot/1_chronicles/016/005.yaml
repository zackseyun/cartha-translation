translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yameandikwa kwa maumbo yanayotumika kwa kawaida katika Biblia za Kiswahili. Sentensi imewekwa wazi kama orodha ya wanamuziki na ala zao bila kuondoa tofauti ya ala mbili katika Kiebrania.
