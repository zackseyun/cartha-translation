base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/020.yaml
  text: And they wandered from nation to nation[a], and from one kingdom to another people.
translation:
  language: sw
  text: Walihamahama kutoka taifa moja hadi taifa lingine,[a] na kutoka ufalme mmoja hadi kwa watu wengine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: Walizunguka kutoka taifa moja hadi taifa lingine.'
    reason: Tofauti halali ya kileksia kwa וַיִּתְהַלְּכוּ; “walizunguka” hukazia kwenda huku na huku, ilhali “walihamahama” hukazia kuhama kutoka sehemu moja hadi nyingine.
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: Walihamahama
  rationale: Hali ya Hitpaeli ya הלך hapa inaonyesha kusonga huku na huku au kutoka mahali pamoja hadi pengine. “Walihamahama” ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya mwendo unaorudiwa bila kudokeza safari moja tu.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: kutoka taifa moja hadi taifa lingine
  rationale: גּוֹי limetafsiriwa “taifa.” Kuongeza “moja” na “lingine” huonyesha wazi muundo wa Kiebrania wa kutoka kwa taifa fulani hadi jingine kwa Kiswahili cha asili.
- source_word: וּמִמַּמְלָכָה
  choice: na kutoka ufalme mmoja
  rationale: מַמְלָכָה maana yake ni “ufalme.” Neno “mmoja” limewekwa wazi kulingana na ulinganifu wa kishairi, ingawa halipo kama namba katika Kiebrania.
- source_word: אֶל עַם אַחֵר
  choice: hadi kwa watu wengine
  rationale: עַם limetafsiriwa “watu,” na hivyo kuhifadhi tofauti yake na גּוֹי, “taifa,” katika mstari wa kwanza. “Watu wengine” linaeleza kundi jingine la watu kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa urahisi. Muundo wa mistari miwili na tofauti kati ya “taifa,” “ufalme,” na “watu” zimehifadhiwa.
