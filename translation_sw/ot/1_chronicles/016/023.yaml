base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/023.yaml
  text: Sing to Yahweh[a], all the earth[b]; proclaim his salvation from day to day.
translation:
  language: sw
  text: Dunia yote, mwimbieni Yahweh[a]; tangazeni[b] wokovu wake siku baada ya siku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa Yahweh” (לַיהוָה). Kihusishi hicho kinaonyeshwa katika “mwimbieni.”'
    reason: alternative_reading
  - marker: b
    text: Au, “hubirini habari njema ya wokovu wake.” Kitenzi cha Kiebrania kina maana ya kuleta au kutangaza habari njema.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Mwimbieni
  rationale: Kitenzi cha amri kwa wingi kinadumisha mwito wa moja kwa moja wa kuimba; kiambishi -ni kinaonyesha kwamba wimbo unaelekezwa kwa Yahwe bila kuongeza wazo la “sifa” ambalo halijasemwa wazi.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la Mungu יְהוָה limetafsiriwa kwa umbo la Kiswahili “Yahwe,” na kihusishi לַ kimewakilishwa kiasili katika kitenzi “Mwimbieni.”
- source_word: כָּל הָאָרֶץ
  choice: dunia yote
  rationale: Ingawa אֶרֶץ linaweza kumaanisha nchi, ardhi, au dunia, katika mwito huu mpana wa wimbo “dunia yote” linaonyesha vizuri upeo wa ulimwengu mzima na ni Kiswahili cha kawaida.
- source_word: בַּשְּׂרוּ
  choice: tangazeni
  rationale: Amri hii hubeba maana ya kutangaza habari njema. “Tangazeni” ni fupi na ya asili katika mstari wa kishairi, huku tanbihi ikihifadhi wazo dhahiri la kuleta habari njema.
- source_word: מִיּוֹם אֶל יוֹם
  choice: siku baada ya siku
  rationale: Usemi huu wa Kiswahili unaonyesha kurudiwa kwa tendo kila siku na unawasilisha vizuri maana ya Kiebrania ya kuendelea kutoka siku moja hadi nyingine.
- source_word: יְשׁוּעָתוֹ
  choice: wokovu wake
  rationale: “Wokovu” ni neno pana linaloweza kujumuisha kuokoa au kukomboa, na kiwakilishi “wake” kinadumisha rejeo la Kiebrania kwa Mungu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יְהוָה moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, huku tanbihi ikitaja desturi mbadala ya “BWANA.”
- issue: Maana ya יְשׁוּעָה
  choice: wokovu
  alternative: ukombozi
  rationale: “Wokovu” huhifadhi upana wa neno la Kiebrania bila kulifunga kwa tukio maalumu la kisiasa au kijeshi; “ukombozi” pia unawezekana kulingana na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Mwimbieni” na “siku baada ya siku” ni miundo ya kawaida na ya sasa; mpangilio wa vifungu viwili unadumisha ulinganifu wa kishairi wa Kiebrania.
