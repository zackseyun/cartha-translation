  text: לֵ/אמֹ֗ר לְ/ךָ֙ אֶתֵּ֣ן אֶֽרֶץ כְּנָ֔עַן חֶ֖בֶל נַחֲלַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/018.yaml
  text: saying[a], “To you I will give the land of Canaan[b], the portion of your inheritance.”
translation:
  language: sw
  text: akisema[a], “Nitakupa nchi ya Kanaani, sehemu[b] ya urithi wenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hubadilika kutoka umoja (“nitakupa”) kwenda wingi (“urithi wenu”), huenda kikihama kutoka kwa baba wa ukoo aliyepewa ahadi hadi kwa wazao wake kama warithi wa agano.
    reason: lexical_alternative
  - marker: b
    text: Au “fungu.” Neno la Kiebrania kimsingi humaanisha kamba au mstari wa kupimia, na kwa upanuzi sehemu ya ardhi iliyopimwa na kugawiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: akisema
  rationale: Kitenzi hiki kinatanguliza maneno ya agano yaliyonukuliwa; “akisema” ni kiunganishi cha kawaida na cha asili katika Kiswahili cha simulizi.
- source_word: לְךָ
  choice: nitakupa
  rationale: Kiambishi “-ku-” katika “nitakupa” kinahifadhi nafsi ya pili umoja ya Kiebrania, yaani ahadi inaelekezwa kwa mhusika mmoja.
- source_word: אֶתֵּן
  choice: nitakupa
  rationale: Hali ya muktadha ni ahadi, hivyo wakati ujao “nita-” unawasilisha vizuri maana ya kitenzi hiki.
- source_word: אֶרֶץ כְּנָעַן
  choice: nchi ya Kanaani
  rationale: Tafsiri hii inahifadhi maana halisi ya eneo maalumu lililoahidiwa, bila kulifanya kuwa jina pekee lisiloonyesha kwamba ni nchi.
- source_word: חֶבֶל
  choice: sehemu
  rationale: Ingawa neno hili kimsingi linaweza kumaanisha kamba au mstari wa kupimia, katika ugawaji wa ardhi humaanisha sehemu iliyopimwa na kugawiwa. “Sehemu” ni ya asili na inaeleweka kwa urahisi.
- source_word: נַחֲלַתְכֶם
  choice: urithi wenu
  rationale: “Urithi” huhifadhi maana ya milki inayorithiwa na uzito wa kiagano wa neno hilo; “wenu” inadumisha wingi uliopo katika Kiebrania.
theological_decisions:
- issue: Kubadilika kutoka kwa mhusika mmoja hadi kwa wengi
  choice: Kuhifadhi umoja katika “nitakupa” na wingi katika “urithi wenu.”
  alternative: Kusawazisha sentensi iwe katika umoja wote, au kufafanua “wewe na wazao wako.”
  rationale: Kiebrania chenyewe hubadilika kutoka nafsi ya pili umoja katika לְךָ kwenda nafsi ya pili wingi katika נַחֲלַתְכֶם. Kuhifadhi badiliko hilo kunadumisha mvutano wa maandishi kati ya baba wa ukoo aliyepewa ahadi na jamii ya wazao wanaoirithi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa asili, huku ukihifadhi badiliko la kimakusudi kutoka umoja kwenda wingi na taswira ya ardhi ya urithi.
