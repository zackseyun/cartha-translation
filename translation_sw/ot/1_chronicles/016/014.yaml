  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
translation:
  language: sw
  text: Yeye ndiye Yahwe[b], Mungu wetu; hukumu zake ziko katika dunia yote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika nchi yote,” ikiwa אֶרֶץ linaeleweka kwa maana ya eneo maalumu; hapa “dunia” imechaguliwa kwa sababu muktadha unasisitiza utawala wa Yahwe wenye upeo wa ulimwengu mzima.
    reason: lexical_alternative
  - marker: b
    text: Jina la Mungu katika Kiebrania ni YHWH, ambalo kwa desturi limetafsiriwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: הוּא
  choice: Yeye ndiye
  rationale: Kiwakilishi huru kina mkazo katika kishazi kisicho na kitenzi; “Yeye ndiye” huonyesha mkazo huo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Ingawa umbo la אֱלֹהִים linaonekana kuwa la wingi, katika muktadha huu linamtaja Mungu mmoja wa Israeli pamoja na kiambishi cha nafsi ya kwanza wingi.
- source_word: בְּכָל הָאָרֶץ
  choice: katika dunia yote
  rationale: Kirai hiki kinaeleweka hapa kuwa na upeo wa ulimwengu mzima, ingawa אֶרֶץ pia linaweza kumaanisha nchi au eneo.
- source_word: מִשְׁפָּטָיו
  choice: hukumu zake
  rationale: “Hukumu” huhifadhi wigo wa maana unaoweza kujumuisha maamuzi ya kihukumu, utekelezaji wa haki, au matendo ya kuhukumu bila kuubana mno.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania ina jina la Mungu moja kwa moja; kulitohowa huhifadhi jina hilo badala ya kuliwakilisha kwa cheo.
- issue: Upeo wa הָאָרֶץ
  choice: dunia
  alternative: nchi
  rationale: Muktadha wa sifa unasisitiza utawala na hukumu za Mungu zenye upeo mpana; hata hivyo, maana ya eneo maalumu inabaki kuwa uwezekano wa kileksika na imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Yeye ndiye” huhifadhi mkazo wa Kiebrania; mpangilio wa tanbihi umewekwa [a][b] kulingana na mahali pa taarifa husika katika tafsiri.
