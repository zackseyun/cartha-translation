  text: which he made with Abraham[a], and his oath to Isaac—
translation:
  language: sw
  text: agano alilofanya na Abrahamu[a], na kiapo chake kwa Isaka—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “agano alilolikata na Abrahamu,” nahau ya Kiebrania inayomaanisha “agano alilofanya na Abrahamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: aliyoifanya
  rationale: Kiwakilishi rejeshi kinarejelea agano katika mstari uliotangulia; umbo hili linaunganisha kishazi hicho kwa Kiswahili cha kawaida.
- source_word: כָּרַת
  choice: alifanya
  rationale: Kitenzi hiki humaanisha kihalisi ‘alikata,’ lakini katika nahau ya Kiebrania kinamaanisha kufanya agano. ‘Alifanya’ huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: אֶת אַבְרָהָם
  choice: na Abrahamu
  rationale: Katika muktadha wa kufanya agano, ‘na Abrahamu’ humtaja mshirika wa agano kwa njia ya kawaida katika Kiswahili.
- source_word: וּשְׁבוּעָתוֹ
  choice: na kiapo chake
  rationale: Nomino ‘kiapo’ na kiambishi cha nafsi ya tatu umoja ‘-ake’ vinahifadhi muundo na umilikaji wa Kiebrania.
- source_word: לְיִצְחָק
  choice: kwa Isaka
  rationale: Kihusishi ל kinaonyesha yule aliyeelekezewa kiapo; ‘kwa Isaka’ ni usemi wa kawaida na sahihi katika Kiswahili.
theological_decisions:
- issue: Nahau ya kufanya agano katika כרת, huku ‘agano’ likieleweka kutoka mstari uliotangulia
  choice: aliyoifanya na Abrahamu
  alternative: aliyoikata na Abrahamu
  rationale: Tafsiri inahifadhi maana ya nahau ya Kiebrania badala ya kuhamisha neno ‘kata’ kwa namna isiyoeleweka katika Kiswahili. Rejeleo la agano linabaki wazi kutokana na muktadha wa mstari uliotangulia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa kishairi unaendelezwa kwa koma na kistari mwishoni, kwa kuwa sentensi inaendelea katika mstari unaofuata.
