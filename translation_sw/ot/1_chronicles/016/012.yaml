    text: Au, “maagizo” au “maamuzi ya kinywa chake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Kumbukeni
  rationale: Ni kauli ya kuamuru kwa wingi kutoka katika mzizi זכר. “Kumbukeni” ni neno la kawaida na la moja kwa moja linalodumisha nguvu ya wito huu.
- source_word: נִפְלְאֹתָיו אֲשֶׁר עָשָׂה
  choice: maajabu aliyoyafanya
  rationale: Neno פלאות hurejelea matendo ya ajabu yanayoamsha mshangao. Muundo huu ni wa asili katika Kiswahili na unaonyesha wazi kwamba Mungu ndiye aliyeyafanya.
- source_word: מֹפְתָיו
  choice: ishara zake
  rationale: מופת inaweza kumaanisha ishara au tukio la ajabu linalodhihirisha nguvu ya Mungu. “Ishara” ni wazi na haibani maana kuwa miujiza pekee.
- source_word: וּמִשְׁפְּטֵי פִיהוּ
  choice: na hukumu za kinywa chake
  rationale: משפטים inaweza kumaanisha hukumu, maagizo, au maamuzi rasmi. Tafsiri hii inadumisha taswira halisi ya Kiebrania ya matamko yanayotoka kinywani mwa Mungu na kuhifadhi upana wa maana.
theological_decisions:
- issue: Istilahi mbili zinazohusiana za matendo ya Mungu katika usambamba wa kishairi
  choice: Kutofautisha פלאות kuwa “maajabu” na מופתים kuwa “ishara.”
  alternative: “matendo ya ajabu” na “miujiza,” au “maajabu” na “matukio ya kutisha”
  rationale: Kiebrania kinatumia maneno mawili tofauti lakini yanayohusiana. Kuyatofautisha kunahifadhi muundo na upana wa maana bila kuyafanya yote yawe istilahi moja.
- issue: Maana ya משפטים katika kirai “za kinywa chake”
  choice: hukumu za kinywa chake
  alternative: maagizo ya kinywa chake; maamuzi yaliyotamkwa na kinywa chake
  rationale: “Hukumu” huhifadhi maana ya kimahakama huku taswira ya “kinywa chake” ikiacha wazi pia uwezekano wa maamuzi au maagizo ya Mungu yaliyotamkwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Taswira ya Kiebrania “za kinywa chake” imehifadhiwa kwa makusudi.
