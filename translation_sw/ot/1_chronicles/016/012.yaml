  text: Remember his wondrous deeds that he has done[a], his signs[c][b], and the judgments of his mouth.
translation:
  language: sw
  text: Kumbukeni maajabu aliyoyafanya[a], ishara zake[b], na hukumu za kinywa chake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matendo yake ya ajabu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “maajabu yake.”
    reason: lexical_alternative
