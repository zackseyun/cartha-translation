id: 1CH.16.35
reference: 1 Chronicles 16:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִמְר֕וּ הוֹשִׁיעֵ֨/נוּ֙ אֱלֹהֵ֣י יִשְׁעֵ֔/נוּ וְ/קַבְּצֵ֥/נוּ וְ/הַצִּילֵ֖/נוּ מִן הַ/גּוֹיִ֑ם לְ/הֹדוֹת֙ לְ/שֵׁ֣ם קָדְשֶׁ֔/ךָ לְ/הִשְׁתַּבֵּ֖חַ בִּ/תְהִלָּתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/035.yaml
  text: And say[a], “Save us, O God of our salvation; gather us and deliver us from the nations[b], that we may give thanks to your holy name and glory in your praise.”
translation:
  language: sw
  text: Nanyi semeni, “Utuokoe, Ee Mungu wa wokovu wetu; utukusanye na utunasue kutoka kwa mataifa[a], ili tulishukuru jina lako takatifu na kujivunia sifa zako[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka kwa watu wa mataifa”; hapa maana pana ni mataifa au makundi ya watu.
    reason: lexical_alternative
  - marker: b
    text: Au “kushangilia katika sifa zako” au “kuona fahari katika sifa zako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִמְרוּ
  choice: Nanyi semeni
  rationale: Kitenzi ni amri ya wingi, na kiunganishi וְ kinaendeleza mtiririko wa liturujia. “Nanyi semeni” ni Kiswahili cha kawaida kinachohifadhi mwito kwa kusanyiko.
- source_word: הוֹשִׁיעֵנוּ
  choice: Utuokoe
  rationale: Amri ya Hifili ya ישׁע inaomba wokovu. “Utuokoe” ni ya asili na pia inaacha “utunasue” kwa נצל ili kudumisha tofauti ya maneno.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: Ee Mungu wa wokovu wetu
  rationale: Muundo wa Kiebrania ni “Mungu wa wokovu wetu.” “Ee” huonyesha wazi kwamba huu ni mwito wa moja kwa moja bila kubadili maana ya kishazi.
- source_word: וְקַבְּצֵנוּ
  choice: utukusanye
  rationale: קבץ humaanisha kukusanya waliotawanyika. Uchaguzi huu ni mfupi, wa kawaida, na unahifadhi uwezekano wa kurejeshwa kutoka kutawanyika.
- source_word: וְהַצִּילֵנוּ
  choice: na utunasue
  rationale: Hifili ya נצל ina maana ya kuokoa au kunusuru kutoka hatarini. “Utunasue” huitofautisha na ישׁע iliyotafsiriwa “utuokoe.”
- source_word: מִן־הַגּוֹיִם
  choice: kutoka kwa mataifa
  rationale: גּוֹיִם hapa ni mataifa au makundi ya watu ambamo Israeli wametawanyika. “Mataifa” huepuka kuingiza mapema mgawanyo wa baadaye wa Wayahudi na watu wa mataifa.
- source_word: לְהוֹדוֹת
  choice: ili tulishukuru
  rationale: ל pamoja na kitenzi-jina huonyesha kusudi hapa. “Ili tulishukuru” hufanya uhusiano huo wa kusudi uwe wazi na hutumia maana ya kawaida ya ידה katika muktadha huu.
- source_word: לְשֵׁם קָדְשֶׁךָ
  choice: jina lako takatifu
  rationale: Hiki ni kirai cha heshima kinachomaanisha jina la Mungu lililo takatifu. Pamoja na “kushukuru,” Kiswahili cha kawaida hakihitaji kutaja kihusishi tofauti kabla ya “jina.”
- source_word: לְהִשְׁתַּבֵּחַ
  choice: na kujivunia
  rationale: Hitpaeli ya שׁבח hapa huonyesha kujisifia, kufurahia, au kuona fahari kwa sababu ya Mungu. “Kujivunia” ni ya asili na inaweza kuwa chanya katika Kiswahili, huku tanbihi ikihifadhi wigo wa maana.
- source_word: בִּתְהִלָּתֶךָ
  choice: sifa zako
  rationale: תְּהִלָּה inaweza kuwa sifa inayotolewa kwa Mungu au ustahili wake wa kusifiwa. “Sifa zako” ni ya kawaida na inaacha huo wigo wazi kuliko tafsiri inayolazimisha upande mmoja.
theological_decisions:
- issue: Iwapo הַגּוֹיִם itafsiriwe kwa maana mahsusi ya “watu wa mataifa” badala ya “mataifa”
  choice: kutoka kwa mataifa
  alternative: kutoka kwa watu wa mataifa
  rationale: Katika muktadha huu ombi linahusu kukusanywa na kuokolewa kutoka miongoni mwa mataifa. “Mataifa” huhifadhi maana ya kihistoria na kijiografia bila kuingiza tofauti ya kiteolojia ya baadaye.
- issue: Jinsi ya kutafsiri lugha ya kujisifia katika לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: kujivunia sifa zako
  alternative: kushangilia katika sifa zako
  rationale: Kiebrania kinaonyesha fahari au shangwe inayomwelekea Mungu. “Kujivunia sifa zako” hudumisha nguvu ya kitenzi na kitu chake bila kuifanya fahari hiyo kuwa ya kujitukuza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya ibada lakini kinachoeleweka kwa wasomaji wa kawaida. “Ee” hudumisha mwito wa heshima; “utuokoe” na “utunasue” zinatofautisha mizizi miwili ya Kiebrania. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
