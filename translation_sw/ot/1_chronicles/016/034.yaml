  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הוֹד֤וּ לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/034.yaml
  text: Give thanks to Yahweh[a], for he is good[b]; for his steadfast love endures forever.
translation:
  language: sw
  text: Mshukuruni Yahwe,[a] kwa maana yeye ni mwema; kwa maana upendo wake thabiti hudumu milele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH,” jina la Mungu; hapa limetolewa “Yahwe.” Tafsiri nyingine hulitoa “BWANA.”'
    reason: alternative_reading
  - marker: b
    text: Au, “uaminifu wake wa agano hudumu milele.” Neno la Kiebrania חֶסֶד lina maana ya upendo wenye ushikamanifu na uaminifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: Mshukuruni
  rationale: Kauli ya amri ya wingi ya ידה katika Hifili hapa ni mwito wa liturujia wa kumshukuru au kumsifu Mungu. “Mshukuruni” ni ya asili na huhifadhi maana kuu bila kufafanua kupita kiasi.
- source_word: לַ/יהוָה֙
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa namna yake ya kawaida katika Kiswahili, “Yahwe,” badala ya kulibadilisha kuwa cheo kama “BWANA”; hivyo marejeo ya jina la agano yanahifadhiwa.
- source_word: כִּי
  choice: kwa maana
  rationale: Katika sehemu zote mbili, כִּי inatoa sababu ya mwito wa kushukuru. Kurudia “kwa maana” kunadumisha usambamba na mtiririko wa kishairi wa Kiebrania.
- source_word: ט֔וֹב
  choice: mwema
  rationale: 'Kwa kuwa neno linamhusu Yahwe, kivumishi cha Kiswahili kinapatana na ngeli ya mtu: “yeye ni mwema.” Huhifadhi maana pana ya wema wa kimaadili na wenye kufadhili.'
- source_word: לְ/עוֹלָ֖ם
  choice: milele
  rationale: Neno hili linaonyesha kudumu bila mwisho. “Milele” ni tafsiri fupi, ya kawaida, na inayofaa kwa kiitikio cha sifa.
- source_word: חַסְדּֽ/וֹ
  choice: upendo wake thabiti
  rationale: חֶסֶד huunganisha upendo, uaminifu, na ushikamanifu wa kudumu. “Upendo wake thabiti” huhifadhi upana huo kwa lugha inayoeleweka bila kuufungia neno katika maana moja tu ya kiteolojia.
- source_word: לְ/עוֹלָ֖ם חַסְדּֽ/וֹ
  choice: upendo wake thabiti hudumu milele
  rationale: Kiebrania hakina kitenzi wazi katika kishazi hiki, lakini Kiswahili cha kawaida huhitaji kiarifu. “Hudumu” huonyesha mwendelezo unaodokezwa bila kuongeza wazo jipya.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina maalumu יהוה. “Yahwe” huhifadhi jina hilo moja kwa moja; tanbihi inaarifu kuwa baadhi ya desturi za tafsiri hutumia “BWANA.”
- issue: Maana ya חֶסֶד katika kiitikio cha agano
  choice: upendo thabiti
  alternative: uaminifu wa agano; rehema; fadhili
  rationale: Neno lina mvutano halisi kati ya upendo, uaminifu, na ushikamanifu. “Upendo thabiti” hubeba vipengele vya hisia na uaminifu bila kulipunguza kuwa rehema pekee au kulifanya agano kuwa wazi zaidi kuliko mstari wenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya “kwa maana” yamehifadhiwa ili kuakisi usambamba wa kiitikio cha Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
