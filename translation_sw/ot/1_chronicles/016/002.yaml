id: 1CH.16.2
reference: 1 Chronicles 16:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְכַ֣ל דָּוִ֔יד מֵ/הַעֲל֥וֹת הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֥רֶךְ אֶת הָ/עָ֖ם בְּ/שֵׁ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/002.yaml
  text: When David finished offering up the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh.
translation:
  language: sw
  text: Daudi alipomaliza kutoa sadaka ya kuteketezwa na sadaka za amani[a], aliwabariki watu kwa jina la Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka za ushirika” au “sadaka za ustawi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: alipomaliza
  rationale: Kitenzi hiki kinaonyesha kukamilika kwa tendo na kuunganisha kwa wakati tendo lililofuata; muundo wa Kiswahili “alipomaliza …, ali…” ni wa kawaida na sahihi.
- source_word: מֵהַעֲלוֹת
  choice: kutoa
  rationale: Baada ya כלה, muundo huu una maana ya kumaliza kutoa dhabihu. “Kutoa” ni wa asili katika Kiswahili na muktadha wa sadaka unahifadhi wazo la kuitoa mbele za Mungu.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni neno la kawaida la dhabihu iliyoteketezwa; tafsiri hii inabainisha aina ya sadaka bila kuongeza maelezo yasiyo katika mstari.
- source_word: וְהַשְּׁלָמִים
  choice: na sadaka za amani
  rationale: Neno hili linataja aina ya sadaka inayohusishwa na amani, ustawi na ushirika. “Sadaka za amani” linadumisha istilahi inayotambulika, huku maana nyingine halali zikitajwa katika tanbihi.
- source_word: וַיְבָרֶךְ
  choice: aliwabariki
  rationale: ברך hapa humaanisha kuwabariki watu; umbo hili ni la moja kwa moja na la kawaida katika Kiswahili.
- source_word: אֶת־הָעָם
  choice: watu
  rationale: Kiebrania kinasema “watu” bila neno linalomaanisha “wote”; hivyo hakuna nyongeza ya “watu wote.”
- source_word: בְּשֵׁם יְהוָה
  choice: kwa jina la Yahwe
  rationale: “Kwa jina la” ni usemi wa kawaida wa Kiswahili unaolingana na בְּשֵׁם, na Yahwe linahifadhi jina binafsi la Mungu lililo katika maandishi ya Kiebrania.
theological_decisions:
- issue: Maana ya istilahi ya dhabihu שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za ustawi
  rationale: Istilahi ya Kiebrania inaweza kusisitiza amani, ustawi au ushirika. Tafsiri kuu inahifadhi jina la aina ya dhabihu bila kuifungia katika maana moja nyembamba; chaguzi nyingine zinawekwa katika tanbihi.
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina la Mungu lenye herufi nne, si cheo. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadili kuwa “BWANA.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Muundo “alipomaliza …, ali…” unaonyesha wazi uhusiano wa wakati. Istilahi za dhabihu ni rahisi kueleweka bila kupoteza upekee wa ibada ya Kiebrania.
