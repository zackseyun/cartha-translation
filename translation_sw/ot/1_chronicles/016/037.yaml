id: 1CH.16.37
reference: 1 Chronicles 16:37
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּֽעֲזָב שָׁ֗ם לִ/פְנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה לְ/אָסָ֖ף וּ/לְ/אֶחָ֑י/ו לְ/שָׁרֵ֞ת לִ/פְנֵ֧י הָ/אָר֛וֹן תָּמִ֖יד לִ/דְבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/037.yaml
  text: So he left Asaph and his brothers there before the ark of the covenant of Yahweh[a], to minister before the ark continually, according to each day's requirement.
translation:
  language: sw
  text: Basi akawaacha Asafu na ndugu zake huko mbele ya sanduku la agano la Yahweh, ili wahudumu mbele ya sanduku daima, kulingana na wajibu wa kila siku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama kila siku ilivyohitaji”; kwa Kiebrania kihalisi, “kulingana na jambo la siku katika siku yake.”
    reason: Nahau ya Kiebrania inaweza kueleweka kama wajibu uliowekwa kwa kila siku au kile ambacho siku hiyo ilihitaji; tanbihi huhifadhi usemi wake halisi na tafsiri mbadala.
lexical_decisions:
- source_word: וַיַּעֲזָב
  choice: akawaacha
  rationale: Kitenzi עזב kwa kawaida humaanisha ‘kuacha.’ Katika muktadha huu kinaonyesha kwamba Daudi aliwaacha Asafu na ndugu zake hapo ili waendelee na huduma; ‘akawaweka’ au ‘akawateua’ kungeongeza tafsiri isiyo wazi moja kwa moja katika kitenzi.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi rahisi cha mahali, kikirejelea eneo la sanduku.
- source_word: לִפְנֵי אֲרוֹן בְּרִית יְהוָה
  choice: mbele ya sanduku la agano la Yahweh
  rationale: ‘Mbele ya’ huhifadhi maana ya mahali na pia mazingira ya ibada; mnyororo wa umilikaji umehifadhiwa, na jina la agano יְהוָה limetolewa kama ‘Yahweh.’
- source_word: לְאָסָף וּלְאֶחָיו
  choice: Asafu na ndugu zake
  rationale: ‘Ndugu zake’ huhifadhi maana ya msingi ya אֶחָיו, ingawa katika mazingira haya inaweza kuwahusu Walawi wenzake au washirika wake wa huduma.
- source_word: לְשָׁרֵת
  choice: ili wahudumu
  rationale: שרת katika mazingira ya ibada humaanisha kufanya huduma takatifu. ‘Wahudumu’ ni Kiswahili cha kawaida kinachobeba maana hiyo vizuri kuliko ‘watumikie,’ ambayo ingehitaji kutaja yule au kile kinachotumikiwa.
- source_word: לִפְנֵי הָאָרוֹן
  choice: mbele ya sanduku
  rationale: Kirai kilichorudiwa kimetafsiriwa kwa uthabiti, kikihifadhi maana ya mahali na ya huduma ya ibada.
- source_word: תָּמִיד
  choice: daima
  rationale: Neno hili linaonyesha mwendelezo au utaratibu usiokatizwa wa huduma; ‘daima’ ni fupi na ya kawaida.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: kulingana na wajibu wa kila siku
  rationale: Nahau hii inaelekea kumaanisha kazi au hitaji lililowekwa kwa siku husika. Tafsiri hii ni ya asili kwa Kiswahili huku tanbihi ikihifadhi umbo halisi na uwezekano mwingine.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano, tetragramatoni יְהוָה. ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. ‘Sanduku la agano’ na ‘wahudumu’ huhifadhi mazingira ya ibada bila kutumia istilahi nzito zisizo za lazima. Alama ya tanbihi imewekwa baada ya kirai kinachoifafanua.
