id: 1CH.16.25
reference: 1 Chronicles 16:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּי֩ גָד֨וֹל יְהוָ֤ה וּ/מְהֻלָּל֙ מְאֹ֔ד וְ/נוֹרָ֥א ה֖וּא עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/025.yaml
  text: For Yahweh is great and greatly to be praised[a], and he is to be feared above all gods.
translation:
  language: sw
  text: Kwa maana Yahweh ni mkuu na anastahili kusifiwa sana; naye ni wa kuogopwa kuliko miungu yote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenye kuamsha hofu na uchaji.” Neno la Kiebrania linajumuisha wazo la hofu yenye kicho; “wa kuogopwa” linahifadhi nguvu hiyo kwa uwazi zaidi hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu inayotegemeza mwito wa kumwabudu katika muktadha, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: גָדוֹל
  choice: ni mkuu
  rationale: Neno hili linaeleza ukuu wa hadhi na utukufu; “mkuu” ni la moja kwa moja na la asili katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika herufi nne za Kiebrania limehifadhiwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: מְהֻלָּל מְאֹד
  choice: anastahili kusifiwa sana
  rationale: Kirai hiki kinawasilisha hali ya kustahili sifa, huku “sana” ikihifadhi msisitizo wa מְאֹד kwa Kiswahili cha kawaida.
- source_word: נוֹרָא
  choice: ni wa kuogopwa
  rationale: Linahifadhi maana ya kuamsha hofu yenye uchaji bila kulifanya liwe hofu ya kutisha tu wala kupunguza uzito wake kuwa mshangao wa kawaida.
- source_word: עַל כָּל אֱלֹהִים
  choice: kuliko miungu yote
  rationale: Katika muktadha huu עַל inaonyesha ulinganisho na ubora; “kuliko” huwasilisha wazi kuwa Yahweh anastahili hofu yenye uchaji zaidi ya miungu yote.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja; kulihifadhi kama “Yahweh” kunatofautisha jina hilo na cheo.
- issue: Maana ya נוֹרָא inapomhusu Mungu
  choice: ni wa kuogopwa
  alternative: anatisha; ni wa kustaajabisha
  rationale: Chaguo hili linadumisha mvutano wa maana kati ya hofu na uchaji, bila kuelekeza neno kwenye kitisho tupu au mshangao pekee.
- issue: Utambulisho wa אֱלֹהִים katika wingi
  choice: miungu
  alternative: viumbe vya kiungu
  rationale: Muktadha wa karibu unazungumzia miungu ya mataifa; tafsiri ya wazi “miungu” inadumisha tofauti ya kimjadala bila kuamua zaidi kuhusu hali yao halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “anastahili kusifiwa sana” ni wa asili kuliko tafsiri ya neno kwa neno ya kauli tendwa, na “ni wa kuogopwa” huhifadhi uzito wa kishairi na wa kitheolojia.
