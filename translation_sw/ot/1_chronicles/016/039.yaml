base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/039.yaml
  text: And Zadok the priest and his fellow priests were before the tabernacle of Yahweh at the high place that was in Gibeon,[a]
translation:
  language: sw
  text: Pia akamwacha Sadoki kuhani, pamoja na makuhani wenzake,[a] mbele ya maskani ya Yahwe, mahali pa juu palipokuwa Gibeoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ndugu zake, wale makuhani.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: Pia akamwacha
  rationale: Waw inaendeleza orodha ya watu walioachwa kwa ajili ya huduma, huku אֵת ikiwa alama ya yambwa isiyotafsiriwa moja kwa moja. Kitenzi “akamwacha” kimechukuliwa kutoka muktadha unaotawala kisarufi ili sentensi iwe kamili na ya kawaida kwa Kiswahili.
- source_word: צָדוֹק הַכֹּהֵן
  choice: Sadoki kuhani
  rationale: Jina limetoholewa kwa matumizi ya kawaida ya Kiswahili, na cheo cha definite kimetafsiriwa kwa muundo wa kawaida wa Kiswahili.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: pamoja na makuhani wenzake
  rationale: Neno אֶחָיו lina maana ya msingi ya “ndugu zake,” lakini katika muktadha huu linaonyesha makuhani waliohudumu pamoja na Sadoki. Tafsiri hii ni ya asili na haidai kuwa walikuwa ndugu wa damu; maana halisi imehifadhiwa katika tanbihi.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Huhifadhi maana ya mahali, yaani kuwa katika eneo la mbele au katika uwepo wa maskani.
- source_word: מִשְׁכַּן יְהוָה
  choice: maskani ya Yahwe
  rationale: “Maskani” ni neno la heshima na linaloeleweka kwa mahali patakatifu pa kukaa; jina la agano יְהוָה limetolewa kama “Yahwe.”
- source_word: בַּבָּמָה
  choice: mahali pa juu
  rationale: Hili ndilo neno la kawaida kwa eneo la ibada lililoinuka. Linahifadhi istilahi ya chanzo bila kulifanya moja kwa moja kuwa eneo la ibada haramu.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: palipokuwa Gibeoni
  rationale: Kiwakilishi cha mahali kinaunganisha kishazi kwa kawaida na “mahali pa juu,” na Gibeoni limetoholewa kwa umbo lililozoeleka katika Kiswahili.
theological_decisions:
- issue: Utoaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni. “Yahwe” huhifadhi jina binafsi la Mungu bila kulibadilisha kuwa cheo.
- issue: Maana ya אֶחָיו katika kundi la makuhani
  choice: makuhani wenzake
  alternative: ndugu zake, wale makuhani
  rationale: Muktadha unaonyesha ushirika wa kikuhani, lakini Kiebrania kinaweza kusomeka kihalisi “ndugu zake.” Tafsiri kuu inaweka maana inayofaa katika Kiswahili, na tanbihi inalinda upeo wa usemi wa chanzo.
- issue: Hadhi ya בָּמָה huko Gibeoni
  choice: mahali pa juu
  alternative: kilima cha ibada; madhabahu ya juu
  rationale: Istilahi imeachwa bila hukumu ya kiibada, kwa sababu katika muktadha huu maskani ya Yahwe ilikuwa Gibeoni. Hivyo tafsiri haiingizi maana hasi inayopatikana katika baadhi ya miktadha mingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “akamwacha” unategemea kitenzi kinachoendelea kutoka muktadha wa awali wa Kiebrania; umetumiwa ili aya isimame kwa ufasaha katika Kiswahili. Istilahi “maskani” na “mahali pa juu” zimehifadhiwa kwa uthabiti wa lugha ya ibada bila kufanya sentensi kuwa ya kizamani.
