  text: שִׁ֤ירוּ ל/וֹ֙ זַמְּרוּ ל֔/וֹ שִׂ֖יחוּ בְּ/כָל נִפְלְאֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/009.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous deeds.
translation:
  language: sw
  text: Mwimbieni; mwimbieni sifa; simulieni[a] matendo yake yote ya ajabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “zungumzeni kuhusu matendo yake yote ya ajabu” au “tafakarini juu ya matendo yake yote ya ajabu.” Kitenzi cha Kiebrania kinaweza kumaanisha kusema au kutafakari, lakini hapa muktadha wa mwito wa hadharani unapendelea maana ya kuwaeleza wengine.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Mwimbieni
  rationale: Ni amri ya wingi kutoka שׁיר, ‘kuimba.’ Kiambishi -eni kinaonyesha kuwa wito unaelekezwa kwa watu wengi, na kiambishi -m- pamoja na muundo wa kitenzi huwasilisha maana ya ‘mwimbieni yeye.’
- source_word: לֹו
  choice: -m- / -ni katika “Mwimbieni”
  rationale: Kiswahili huwasilisha kwa kawaida mhusika anayelengwa na tendo ndani ya kitenzi. Hivyo maana ya ‘kwake/yeye’ imeunganishwa kwa ufasaha katika “Mwimbieni.”
- source_word: זַמְּרוּ
  choice: mwimbieni sifa
  rationale: Kitenzi זמר katika piel kinaweza kumaanisha kuimba sifa au kufanya muziki. “Mwimbieni sifa” kinahifadhi muktadha wa ibada na pia kinatofautisha kishazi hiki na amri ya kwanza ya kuimba.
- source_word: שִׂיחוּ
  choice: simulia
  rationale: שׂיח inaweza kumaanisha kusema, kusimulia, au kutafakari. Katika wito huu wa hadharani, “simulia” linaonyesha kitendo cha kuwaeleza wengine matendo ya Mungu bila kuongeza maana isiyokuwamo katika chanzo.
- source_word: בְּכָל
  choice: '... yote'
  rationale: Ingawa בְּ kwa msingi ni ‘katika/kwa,’ pamoja na kitenzi hiki Kiswahili cha kawaida hutumia yambwa moja kwa moja. “Yote” linahifadhi nguvu jumuishi ya כָּל.
- source_word: נִפְלְאֹתָיו
  choice: matendo yake yote ya ajabu
  rationale: Neno hili hurejelea matendo ya pekee yanayoamsha mshangao, hasa matendo makuu ya Mungu. “Matendo ... ya ajabu” linaonyesha wazi kuwa yanayokusudiwa si mambo ya kushangaza tu bali matendo aliyoyafanya.
theological_decisions:
- issue: Maana pana ya שִׂיחוּ
  choice: Maana ya nje ya kusimulia imetumiwa katika mstari
  alternative: “tafakarini” au “zungumzeni kuhusu”
  rationale: Muktadha ni mwito wa pamoja wa sifa na tangazo la matendo ya Mungu, hivyo maana ya usemi wa hadharani inafaa zaidi. Hata hivyo, uwezekano wa maana ya kutafakari umehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Amri za wingi zimehifadhiwa kwa maumbo ya -eni. Urudiaji wa kishairi wa ‘Mwimbieni’ umeachwa wazi, huku “simulia” likitoa mwito wa kawaida na wenye nguvu wa kutangaza matendo ya Mungu.
