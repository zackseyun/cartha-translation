lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: Naye alilithibitisha
  rationale: Kitenzi עמד katika Hifili kina maana ya kukifanya kitu kisimame imara. Kiambishi cha kitu cha kike katika “alilithibitisha” kinahifadhi rejeleo la jambo lililotangulia—agano au kiapo—bila kulibainisha kupita kiasi.
- source_word: לְיַעֲקֹב
  choice: kwa Yakobo
  rationale: Kihusishi ל hapa kinaonyesha mlengwa au mnufaika; “kwa Yakobo” ni Kiswahili cha kawaida na kinaendana na kirai sawia kuhusu Israeli.
- source_word: לְחֹק
  choice: kuwa amri ya kudumu
  rationale: חֹק ni jambo lililowekwa rasmi na lenye uthabiti, kama amri au sheria. “Amri ya kudumu” huwasilisha nguvu ya kisheria ya neno hilo katika muktadha huu.
- source_word: לְיִשְׂרָאֵל
  choice: kwa Israeli
  rationale: Huhifadhi usambamba wa Kiebrania kati ya Yakobo na Israeli badala ya kuyaunganisha majina hayo.
- source_word: בְּרִית עוֹלָם
  choice: kuwa agano la milele
  rationale: “Agano” huhifadhi istilahi kuu ya בְּרִית, na “la milele” huonyesha kudumu kwa עוֹלָם katika muktadha wa agano.
theological_decisions:
- issue: Rejeleo la kiambishi katika וַיַּעֲמִידֶהָ
  choice: Kiambishi “-li-” katika “alilithibitisha” kinaachwa kirejelee jambo la kike lililotangulia, yaani agano au kiapo katika muktadha.
  alternative: Kukitaja wazi kuwa ni kiapo pekee au agano pekee.
  rationale: Mistari ya karibu inataja agano, neno lililoamriwa, na kiapo kwa usambamba. Kutotaja nomino hapa huhifadhi utata halisi wa rejeleo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Naye” huakisi kiunganishi cha mwanzo; usambamba wa Yakobo/Israeli umehifadhiwa. Alama zote za tanbihi zimewekwa katika matini.
