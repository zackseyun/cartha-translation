base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/024.yaml
  text: Declare his glory among the nations, his wondrous deeds among all the peoples.
translation:
  language: sw
  text: Tangazeni utukufu wake miongoni mwa mataifa, matendo yake ya ajabu miongoni mwa watu wote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סַפְּרוּ
  choice: Tangazeni
  rationale: Kitenzi cha amri kwa wingi kinataka kutolewa kwa habari hadharani; “Tangazeni” ni cha asili na huhifadhi maana ya kutangaza kwa wazi.
- source_word: בַגּוֹיִם
  choice: miongoni mwa mataifa
  rationale: גּוֹיִם hapa humaanisha mataifa kwa upana, na kiambishi ב katika muktadha huu kinaelezwa vizuri kwa “miongoni mwa.”
- source_word: כְּבוֹדוֹ
  choice: utukufu wake
  rationale: כָּבוֹד hapa huonyesha heshima, fahari, na adhama ya Mungu; “utukufu” ndilo neno la kawaida na lenye uzito unaofaa katika Kiswahili cha Biblia.
- source_word: בְּכָל־הָעַמִּים
  choice: miongoni mwa watu wote
  rationale: עַמִּים imetafsiriwa “watu” ili kutofautisha kwa kiasi fulani na גּוֹיִם (“mataifa”) na kuhifadhi ulinganifu wa kishairi; “wote” huwakilisha כָּל.
- source_word: נִפְלְאֹתָיו
  choice: matendo yake ya ajabu
  rationale: Neno hili hurejelea matendo ya kushangaza, si hali ya ajabu pekee; tafsiri hii huonyesha wazi kwamba ni mambo aliyoyatenda.
theological_decisions:
- issue: Mrejeleo wa viambishi vya nafsi (“wake” na “yake”)
  choice: Viambishi vimeachwa vikimrejelea Mungu wa Israeli kulingana na muktadha.
  alternative: Kurudia jina “BWANA” ndani ya mstari.
  rationale: Kiebrania hutumia viambishi vya nafsi, huku muktadha wa karibu ukimtambulisha BWANA kuwa anayesifiwa. Kuhifadhi viambishi huepuka kuongeza ufafanuzi usio ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo sambamba wa vipashio viwili umehifadhiwa.
