base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/033.yaml
  text: Then the trees of the forest will sing for joy before Yahweh[c][b][a], for he comes to judge the earth.
translation:
  language: sw
  text: Ndipo miti ya msituni itaimba kwa shangwe mbele za Yahwe, kwa maana anakuja kuuhukumu dunia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi.” Neno la Kiebrania linaweza kumaanisha nchi au dunia; hapa muktadha mpana wa uumbaji unaunga mkono “dunia.”
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Kielezi hiki cha wakati kinaanzisha tukio linalofuata; “Ndipo” ni cha kawaida na kinafaa katika ushairi.
- source_word: יְרַנְּנוּ
  choice: itaimba kwa shangwe
  rationale: Kitenzi hiki katika Piel huonyesha sauti ya furaha inayolia kwa nguvu; tafsiri hii inadumisha picha ya kishairi, huku maana ya kupaza sauti kwa shangwe ikiwekwa katika tanbihi.
- source_word: עֲצֵי הַיָּעַר
  choice: miti ya msituni
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili ya kirai cha Kiebrania, inayohifadhi uhuishaji wa miti katika ushairi.
- source_word: מִלִּפְנֵי
  choice: mbele za
  rationale: Katika muktadha huu humaanisha kuwa katika uwepo wa Yahwe; “mbele za” ni usemi wa Kiswahili unaoeleweka na wenye hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu linahifadhiwa kwa umbo la Kiswahili “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha sababu ya miti kuimba kwa shangwe.
- source_word: בָא
  choice: anakuja
  rationale: Qatal hii katika ushairi inaweza kuonyesha tendo linalokuja kwa uhakika na uhai; “anakuja” huhifadhi nguvu hiyo bila kulifanya kuwa wakati uliopita.
- source_word: לִשְׁפּוֹט
  choice: kuuhukumu
  rationale: Maana kuu ni kutoa hukumu au kutekeleza utawala wa kimahakama; “kuhukumu” hudumisha uzito huo.
- source_word: הָאָרֶץ
  choice: ulimwengu
  rationale: Ingawa neno linaweza kumaanisha nchi, muktadha mpana wa uumbaji unaosifu unaelekeza kwenye dunia nzima; “ulimwengu” ni Kiswahili cha kawaida kinachoonyesha upeo huo.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la Mungu, si cheo; kwa hiyo jina hilo linahifadhiwa kwa tahajia ya Kiswahili iliyozoeleka.
- issue: Upeo wa הָאָרֶץ
  choice: ulimwengu
  alternative: nchi
  rationale: Muktadha wa sifa za viumbe unaunga mkono maana ya dunia kwa jumla, lakini maana ya eneo au nchi ni uwezekano halisi na imeonyeshwa katika tanbihi.
- issue: Wakati wa בָא
  choice: anakuja
  alternative: amekuja
  rationale: Katika ushairi, umbo kamilifu la Kiebrania linaweza kuwasilisha tukio linalokuja kana kwamba ni la hakika; Kiswahili cha wakati wa sasa unaoendelea huhifadhi uhai na uhakika huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kishairi lakini rahisi kueleweka. “Mbele za” huhifadhi wazo la kuwapo mbele ya Mungu, na “itaimba kwa shangwe” hudumisha uhuishaji wa miti.
