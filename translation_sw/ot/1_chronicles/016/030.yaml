base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/030.yaml
  text: Tremble before him[a], all the earth; indeed, the world is established; it shall not be moved.
translation:
  language: sw
  text: Tetemekeni mbele yake, dunia yote; naam, ulimwengu umewekwa imara, hautayumba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hautatikisika.” Taswira ya Kiebrania ni ya kusimama imara.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִילוּ
  choice: Tetemekeni
  rationale: Amri hii ya mzizi חול hapa inaeleza kutetemeka mbele ya uwepo wa Mungu; “tetemekeni” ni ya asili na yenye hadhi katika muktadha wa ibada.
- source_word: מִלְּפָנָיו
  choice: mbele zake
  rationale: Huwakilisha nahau ya Kiebrania inayomaanisha kuwa mbele ya uso au uwepo wake.
- source_word: כָּל הָאָרֶץ
  choice: enyi watu wote wa dunia
  rationale: Kiebrania kwa muundo wake kinasema “dunia yote,” lakini kwa kuwa kitenzi ni amri ya wingi, Kiswahili cha kawaida huonyesha wazi wakaaji wa dunia wanaoitwa kuitikia; upeo wa ulimwengu mzima umehifadhiwa.
- source_word: אַף
  choice: naam
  rationale: Hutoa msisitizo kwa kauli inayofuata, si nyongeza rahisi tu.
- source_word: תִּכּוֹן
  choice: umethibitishwa
  rationale: Nifali ya כון huonyesha hali ya kuwekwa imara au kuthibitishwa.
- source_word: תֵּבֵל
  choice: ulimwengu
  rationale: Hurejelea ulimwengu uliopangwa na kukaliwa; “ulimwengu” ni tafsiri fupi na ya kawaida.
- source_word: בַּל תִּמּוֹט
  choice: hautatikisika
  rationale: Huhifadhi taswira ya kitu kilicho imara, kisichoyumba wala kutetereka.
theological_decisions:
- issue: Lugha ya uthabiti wa ulimwengu
  choice: Kauli inaeleza kwamba ulimwengu umewekwa imara chini ya utawala wa Mungu na hautatikisika.
  alternative: “Hautasogezwa” inaweza kueleweka kama dai la kutokuwa na mwendo kabisa.
  rationale: Nahau ya kishairi ya Kiebrania hukazia uthabiti na usalama wa mpangilio wa uumbaji, bila kulazimisha dai maalumu la kisayansi kuhusu mwendo wa dunia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Neno “naam” limehifadhi msisitizo wa kishairi; “enyi watu wote wa dunia” limefanya walengwa wa amri ya wingi waeleweke kwa kawaida.
