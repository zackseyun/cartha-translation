  - severity: low
    issue: “utukufu unaolipasa jina lake”
    rationale: Inaeleweka, lakini “utukufu unaostahili jina lake” ni ya kiasili na ya kawaida zaidi katika Kiswahili sanifu kwa maana ya utukufu unaodaiwa/stahiliwa na jina lake.
  - severity: low
