  source_fidelity: 'Tafsiri inafuata kwa uaminifu miito mitatu ya Kiebrania: kumpa Yahweh utukufu, kuleta sadaka na kuja mbele yake, kisha kuinama kwake katika fahari ya utakatifu. Hata hivyo, kiwakilishi katika “mje mbele zake” hakilingani na referenti wa umoja katika Kiebrania (לְפָנָיו, “mbele yake”).'
