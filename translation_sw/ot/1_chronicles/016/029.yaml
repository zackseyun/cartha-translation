  text: הָב֥וּ לַ/יהוָ֖ה כְּב֣וֹד שְׁמ֑/וֹ שְׂא֤וּ מִנְחָה֙ וּ/בֹ֣אוּ לְ/פָנָ֔י/ו הִשְׁתַּחֲו֥וּ לַ/יהוָ֖ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/029.yaml
  text: Ascribe to Yahweh the glory due his name; bring an offering and come before him[a]. Bow down to Yahweh in holy splendor.
translation:
  language: sw
  text: 'Mpeni Yahweh utukufu unaostahili jina lake;


    leteni sadaka, mje mbele yake.


    Mwinamieni Yahweh katika fahari ya utakatifu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika fahari takatifu”; huenda pia, “mkiwa mmevaa mavazi matakatifu.”
    reason: Kirai בְּהַדְרַת קֹדֶשׁ kinaweza kumaanisha fahari ya utakatifu au mapambo na mavazi matakatifu ya waabudu.
lexical_decisions:
- source_word: הָבוּ
  choice: Mpeni
  rationale: Katika mwito huu wa ibada, kitenzi kinawahimiza wasikilizaji wamkubalie na kumtangazia Yahweh utukufu unaomstahili; “mpeni” huhifadhi taswira ya Kiebrania kwa lugha ya kawaida ya Kiswahili.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetolewa kama “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: כְּבוֹד שְׁמוֹ
  choice: utukufu unaolipasa jina lake
  rationale: Kirai hiki cha muundo wa utegemezi kinaonyesha utukufu unaohusishwa na jina lake na unaolistahili; tafsiri hii huwasilisha maana ya mwito wa ibada kwa Kiswahili cha kawaida.
- source_word: שְׂאוּ מִנְחָה
  choice: leteni sadaka
  rationale: שְׂאוּ kwa kuambatana na מִנְחָה humaanisha kuleta au kuwasilisha zawadi ya ibada. “Sadaka” ni neno pana na linaloeleweka bila kubainisha aina isiyotajwa.
- source_word: וּבֹאוּ לְפָנָיו
  choice: mje mbele zake
  rationale: Huhifadhi nahau ya kumkaribia Mungu kwa ibada pamoja na maana yake ya mahali na heshima.
- source_word: הִשְׁתַּחֲווּ
  choice: Msujuduni
  rationale: Kitenzi kinaonyesha kuinama au kujilaza chini kwa heshima na ibada. “Msujuduni” huhifadhi tendo la mwili na pia kusudi lake la ibada.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: katika fahari ya utakatifu
  rationale: Tafsiri hii huhifadhi lugha ya kishairi na uhusiano kati ya fahari na utakatifu bila kuamua kwamba kirai hicho lazima kimaanishe mavazi ya ibada.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה; “Yahweh” hulihifadhi kama jina badala ya cheo.
- issue: Maana ya בְּהַדְרַת קֹדֶשׁ
  choice: katika fahari ya utakatifu
  alternative: katika fahari takatifu; mkiwa mmevaa mavazi matakatifu
  rationale: Kirai cha Kiebrania kinaweza kueleza fahari iliyo ya utakatifu au mapambo/mavazi matakatifu. Matini kuu huhifadhi maana pana ya kishairi, huku uwezekano wa mavazi ukitajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi na ya ibada lakini kinachoeleweka kwa msomaji wa kawaida. Mistari imepangwa kufuata mwendo wa kishairi wa Kiebrania; alama ya tanbihi imewekwa baada ya kirai kinachohusika.
