  terminology: “Yahweh,” “utukufu,” na “sadaka” zinafaa. “Fahari ya utakatifu” huhifadhi utata wa בְּהַדְרַת קֹדֶשׁ; tanbihi huhifadhi uwezekano wa fahari takatifu au mavazi matakatifu.
