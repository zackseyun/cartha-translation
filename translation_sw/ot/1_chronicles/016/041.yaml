  text: וְ/עִמָּ/הֶם֙ הֵימָ֣ן וִֽ/ידוּת֔וּן וּ/שְׁאָר֙ הַ/בְּרוּרִ֔ים אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמ֑וֹת לְ/הֹדוֹת֙ לַֽ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/041.yaml
  text: And with them were Heman and Jeduthun and the rest of those chosen, who were designated by name to give thanks to Yahweh, for his steadfast love endures forever.
translation:
  language: sw
  text: Pamoja nao walikuwako Hemani na Yeduthuni, na wengine wa wale waliochaguliwa, ambao walitajwa kwa majina[a] ili wamshukuru Yahwe, kwa maana upendo wake mwaminifu hudumu milele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambao waliainishwa kwa majina” au “ambao kila mmoja alitajwa kwa jina.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “kwa maana upendo wake mwaminifu ni wa milele”; hiki ni kiitikio cha ibada kinachorudiwa mara nyingi.
    reason: cultural_note
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Pamoja nao walikuwako
  rationale: Kirai hiki kinawatambulisha watu waliokuwa pamoja na waliotajwa awali; kitenzi cha wingi “walikuwako” kinakamilisha sentensi kwa Kiswahili cha kawaida.
- source_word: הֵימָן
  choice: Hemani
  rationale: Jina la mtu limetoholewa kwa namna inayotumika katika Kiswahili.
- source_word: וִידוּתוּן
  choice: Yeduthuni
  rationale: Jina la mtu limetoholewa kwa kuzingatia matamshi ya Kiebrania na muundo wa majina katika Kiswahili.
- source_word: וּשְׁאָר הַבְּרוּרִים
  choice: pamoja na wengine kati ya wale waliochaguliwa
  rationale: שְׁאָר ni waliobaki au wengine, na הַבְּרוּרִים ni wale waliochaguliwa. Tafsiri hii inaonyesha kwamba walikuwa sehemu iliyobaki ya kundi lililochaguliwa bila kuongeza jinsia isiyotajwa.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: ambao walitajwa kwa majina
  rationale: Kauli ya Kiebrania ina maana ya watu kutambulishwa au kuteuliwa waziwazi kwa majina; “walitajwa kwa majina” ni ya asili na haifungi maana kwenye uteuzi wa kiutawala pekee.
- source_word: לְהֹדוֹת
  choice: ili wamshukuru
  rationale: Katika mazingira haya ya ibada, kitenzi ידה kinamaanisha kutoa shukrani au sifa. “Wamshukuru” kinaendana vizuri na kiitikio kinachofuata.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: kwa maana upendo wake thabiti hudumu milele
  rationale: כִּי inaleta sababu au maudhui ya shukrani. חֶסֶד ni upendo mwaminifu na wa kudumu; “upendo wake thabiti” huhifadhi uzito huo, huku “hudumu milele” ikitoa kwa Kiswahili maana ya kirai kifupi cha Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Kiebrania kinatumia moja kwa moja jina la Mungu la herufi nne. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya חֶסֶד katika kiitikio cha ibada
  choice: upendo wake thabiti
  alternative: rehema zake au upendo wake wa agano
  rationale: “Upendo thabiti” huhifadhi wazo la upendo mwaminifu na wa kudumu bila kulifungamanisha kwa wazi zaidi na istilahi ya “agano” kuliko mstari wenyewe unavyosema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Muundo umedumisha urudiaji wa “pamoja na” ili orodha iwe wazi, na umeweka kiitikio katika lugha ya kawaida ya ibada.
