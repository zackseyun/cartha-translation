  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מִן הָ/עוֹלָ֖ם וְ/עַ֣ד הָ/עֹלָ֑ם וַ/יֹּאמְר֤וּ כָל הָ/עָם֙ אָמֵ֔ן וְ/הַלֵּ֖ל לַֽ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/036.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Then all the people said[b], “Amen!” and praised Yahweh.
translation:
  language: sw
  text: Ahimidiwe Yahwe, Mungu wa Israeli, tangu milele hata milele.[a] Kisha watu wote wakasema, “Amina!” nao wakamsifu Yahwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tangu umilele hata umilele” au “milele na milele.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinaweza pia kutafsiriwa: “Amina, na sifa kwa Yahwe,” au “Amina, msifuni Yahwe.” Usemi huo ni mfupi, na maana yake ni kwamba watu waliitikia kwa Amina na sifa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Ahimidiwe
  rationale: Katika kauli hii ya liturujia, umbo hili linaeleza baraka na sifa anazopewa Mungu. “Ahimidiwe” ni Kiswahili cha kawaida, chenye heshima, kinachowasilisha vizuri nguvu ya kauli hiyo bila kuifanya kuwa maelezo tambarare.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huu ni mfuatano wa nomino unaomtambulisha Yahwe kuwa Mungu wa Israeli; tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: מִן הָעוֹלָם וְעַד הָעֹלָם
  choice: tangu milele hata milele
  rationale: Nahau hii inaonyesha muda usio na mpaka katika kauli ya sifa. “Tangu milele hata milele” huhifadhi upana wake wa wakati na mtindo wake wa ibada.
- source_word: וַיֹּאמְרוּ כָל הָעָם
  choice: Kisha watu wote wakasema
  rationale: “Kisha” huonyesha mwendelezo wa simulizi unaobebwa na waw-consecutive, na עָם hapa inawahusu watu wote waliokusanyika.
- source_word: אָמֵן
  choice: Amina!
  rationale: Itikio hili la kusanyiko limetoholewa kwa umbo linalotambulika katika matumizi ya Kiswahili ya ibada.
- source_word: וְהַלֵּל לַיהוָה
  choice: nao wakamsifu Yahwe
  rationale: Kifungu cha Kiebrania ni kifupi na kinaweza kueleweka kama mwito wa kusifu au kama maelezo ya sifa ya watu. Katika muktadha wa simulizi, tafsiri hii inaonyesha kuwa watu waliitikia kwa Amina na sifa, huku tanbihi ikihifadhi uwezekano wa usomaji wa mwito.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu. Kulitohowa kama “Yahwe” huhifadhi jina hilo badala ya kuliweka kwa cheo.
- issue: Upeo wa עוֹלָם katika kauli ya sifa
  choice: tangu milele hata milele
  alternative: tangu umilele hata umilele; milele na milele
  rationale: Kauli hiyo inamsifu Mungu katika muda usio na mpaka, lakini haipaswi kulazimishwa kubeba ufafanuzi wa kifalsafa ulio zaidi ya nahau ya Kiebrania.
- issue: Uhusiano wa אָמֵן na וְהַלֵּל לַיהוָה
  choice: Watu walisema “Amina” nao wakamsifu Yahwe
  alternative: Watu wakasema, “Amina, na msifuni Yahwe”
  rationale: Kiebrania ni kifupi na kinaacha nafasi ya kuelewa sehemu ya mwisho kama tendo la watu au mwito wa kusifu. Matini kuu inafuata mtiririko wa simulizi, na tanbihi inalinda uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima unaofaa kauli ya ibada. “Ahimidiwe,” “Amina,” na “tangu milele hata milele” ni maneno yanayoeleweka kwa wasomaji wa kawaida huku yakihifadhi uzito wa kishairi na wa liturujia.
