base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/043.yaml
  text: Then all the people went[a], each man to his house, and David turned to bless his household.
translation:
  language: sw
  text: Kisha watu wote wakaenda, kila mtu nyumbani kwake; naye Daudi akageuka ili aibariki nyumba yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa nyumbani mwake” au “familia yake.” Neno la Kiebrania linaweza kumaanisha nyumba yenyewe au watu wanaohusishwa nayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: wakaenda
  rationale: Kitenzi hiki kinaendeleza mfululizo wa matukio ya simulizi; “wakaenda” ni tafsiri ya kawaida na ya moja kwa moja ya הלך.
- source_word: כָל הָעָם
  choice: watu wote
  rationale: עַם hapa ni watu waliokuwa wamekusanyika, si lazima kusanyiko kama taasisi; “watu wote” ni ya kawaida na sahihi.
- source_word: אִישׁ לְבֵיתוֹ
  choice: kila mtu nyumbani kwake
  rationale: אִישׁ imetumiwa kwa maana ya kugawa kundi mtu mmoja mmoja. Kiswahili cha kawaida hutumia “kila mtu,” na לְבֵיתוֹ kwa mwelekeo wa kwenda makao ya mtu hutafsiriwa kwa kawaida “nyumbani kwake.”
- source_word: וַיִּסֹּב
  choice: akageuka
  rationale: סבב inaonyesha Daudi kubadili mwelekeo kutoka shughuli ya hadhara kuelekea nyumbani kwake. “Akageuka” huhifadhi maana ya msingi bila kuongeza wazo la kurudi ambalo halijasemwa wazi.
- source_word: לְבָרֵךְ
  choice: ili aibariki
  rationale: Kitenzi-jina chenye לְ kinaonyesha kusudi. “Ili aibariki” ni Kiswahili cha kawaida na huhifadhi maana ya ברך.
- source_word: בֵּיתוֹ
  choice: nyumba yake
  rationale: בַּיִת inaweza kumaanisha jengo au watu wa nyumbani/familia. “Nyumba yake” huhifadhi kwa kiasi kikubwa upana huo wa maana badala ya kuamua kimya kimya kuwa ni jengo au familia.
theological_decisions:
- issue: Kitu au watu waliobarikiwa na Daudi
  choice: nyumba yake
  alternative: watu wa nyumbani mwake / familia yake
  rationale: Kiebrania בֵּיתוֹ kinaweza kueleweka kuwa nyumba yenyewe au jamaa ya nyumbani. Tafsiri haipaswi kuondoa utata huo wa kweli; tanbihi inaueleza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa lakini wa heshima. Muundo wa “kila mtu nyumbani kwake” ni wa kawaida na unaonyesha matumizi ya kigawanyo katika Kiebrania; nukta mkato hutenganisha kwa uwazi tendo la watu na tendo la Daudi.
