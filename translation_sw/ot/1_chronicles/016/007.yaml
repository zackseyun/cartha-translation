base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/007.yaml
  text: On that day then David first appointed Asaph and his brothers to give thanks to Yahweh[a].
translation:
  language: sw
  text: Siku hiyo ndipo Daudi alipowateua Asafu na ndugu zake kwa mara ya kwanza ili wamshukuru Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Daudi aliwaweka Asafu na ndugu zake katika nafasi ya mbele ili wamshukuru Yahwe,” au, “Daudi aliwateua Asafu na ndugu zake kuwa viongozi wa kumshukuru Yahwe.” Kirai cha Kiebrania kinaweza kusisitiza mwanzo, nafasi ya mbele, au uongozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Siku hiyo
  rationale: Ni kirai cha wakati; “Siku hiyo” ni Kiswahili cha kawaida na cha asili.
- source_word: אָז
  choice: ndipo
  rationale: “Ndipo” huonyesha wakati na mfuatano wa tukio kwa njia ya asili katika simulizi la Kiswahili.
- source_word: נָתַן
  choice: alipowateua
  rationale: Ingawa kitenzi hiki kwa msingi humaanisha “kutoa,” katika muktadha huu kinaonyesha kukabidhi au kuweka watu katika jukumu.
- source_word: בָּרֹאשׁ
  choice: kwa mara ya kwanza
  rationale: Kirai hiki kinaweza kuonyesha mwanzo, nafasi ya mbele, au uongozi. Katika muktadha huu, “kwa mara ya kwanza” huwasilisha vizuri uwezekano wa kuanzishwa kwa huduma hii, huku maana nyingine zikihifadhiwa katika tanbihi.
- source_word: לְהֹדוֹת
  choice: wamshukuru
  rationale: Katika muktadha wa ibada, infinitivu hii ya ידה humaanisha kutoa shukrani au sifa; “wamshukuru” ni wazi na ya kawaida.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kwa umbo la Kiswahili “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: בְּיַד אָסָף וְאֶחָיו
  choice: Asafu na ndugu zake
  rationale: Kirai “kwa mkono wa” ni nahau ya wakala au utekelezaji. Kiswahili laini kinawataja Asafu na ndugu zake moja kwa moja kama waliokabidhiwa jukumu.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya בָּרֹאשׁ katika uteuzi wa huduma
  choice: kwa mara ya kwanza
  alternative: kuwa viongozi / mwanzoni
  rationale: Kiebrania kinaweza kusisitiza kuanzishwa kwa mara ya kwanza, nafasi ya mbele, au uongozi. Tafsiri kuu imechagua uwezekano wa mwanzo bila kuficha nyingine, ambazo zimetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. “Ndugu zake” limehifadhiwa badala ya kulipanua kuwa “Walawi wenzake,” kwa kuwa ufafanuzi huo hauko wazi katika mstari wenyewe.
