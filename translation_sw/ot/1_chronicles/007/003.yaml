base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/003.yaml
  text: 'And the sons of Uzzi: Izrahiah. And the sons of Izrahiah: Michael[a], Obadiah, Joel, and Isshiah—five, all of them heads.'
translation:
  language: sw
  text: 'Nao wana wa Uzi: Izrahia. Na wana wa Izrahia: Mikaeli, Obadia, Yoeli, na Ishia—watano, wote wakuu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “watano, wote vichwa.” Majina manne yanatajwa katika orodha, ingawa matini husema “watano.” “Vichwa” hapa humaanisha wakuu, yawezekana wakuu wa jamaa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Nao wana wa / Wana wa
  rationale: Muundo huu wa kawaida wa nasaba unatafsiri בְּנֵי kuwa “wana wa.” Kiunganishi וּ־ katika mwanzo wa mstari kimetolewa kwa “Nao” ili kuendeleza orodha kwa Kiswahili cha asili.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: יִזְרַחְיָה
  choice: Izrahia
  rationale: Jina limetoholewa kwa Kiswahili na limeandikwa kwa namna ileile katika sehemu zote mbili linapotokea.
- source_word: מִיכָאֵל
  choice: Mikaeli
  rationale: Umbo hili la jina limezoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: וְעֹבַדְיָה
  choice: Obadia
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida ya Kiswahili; kiunganishi chake kimewakilishwa kwa upangaji wa orodha.
- source_word: וְיוֹאֵל
  choice: Yoeli
  rationale: Jina limetoholewa kwa tahajia ya kawaida na inayoeleweka katika Kiswahili.
- source_word: יִשִּׁיָּה
  choice: Ishia
  rationale: Jina limetoholewa kwa karibu na umbo la Kiebrania huku likibaki rahisi kutamkwa kwa Kiswahili.
- source_word: חֲמִשָּׁה
  choice: watano
  rationale: Namba imetolewa moja kwa moja, kwa upatanisho wa kisarufi unaowarejelea watu.
- source_word: רָאשִׁים
  choice: wakuu
  rationale: Ingawa maana halisi ni “vichwa,” katika nasaba neno hili humaanisha watu wenye cheo cha uongozi. “Wakuu” ni la asili katika Kiswahili bila kulazimisha kama walikuwa wakuu wa familia, koo, au aina nyingine.
- source_word: כֻּלָּם
  choice: wote
  rationale: Neno hili linadumisha msisitizo kwamba wote waliotajwa katika hesabu hiyo walikuwa wakuu.
theological_decisions:
- issue: Majina manne ya wana yanafuatwa na jumla ya watu watano.
  choice: Kudumisha usemi “wote watano” bila kutaja wazi mtu wa tano.
  alternative: Kumhesabu Izrahia pamoja na wanawe na kusema wazi kwamba yeye na wanawe walikuwa watano.
  rationale: Kiebrania kinataja Mikaeli, Obadia, Yoeli na Ishia, kisha kinasema “watano, wote [ni] wakuu.” Huenda hesabu hiyo inamjumuisha Izrahia, lakini matini haisemi hivyo moja kwa moja; tafsiri haipaswi kuondoa mvutano huo wa nasaba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Muundo mfupi wa nasaba umehifadhiwa, huku “walikuwa” ikiongezwa kwa ulaini wa Kiswahili. Alama ya tanbihi [a] imewekwa baada ya dai linalohitaji ufafanuzi.
