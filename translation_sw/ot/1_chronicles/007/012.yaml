  - marker: b
    text: Kiebrania kina “Hushimu, wana wa Aheri.” Muundo huu ni mgumu kwa sababu “wana” ni wingi, ilhali Hushimu hutajwa kama jina la mtu mmoja. “Aheri” huenda ni jina la mtu; wengine hulielewa neno hilo kuwa “mwingine.”
