  yaml_path: translation/ot/1_chronicles/007/020.yaml
  text: 'The sons of Ephraim: Shuthelah[a], and Bered his son, and Tahath his son, and Eleadah his son, and Tahath his son.'
translation:
  language: sw
  text: 'Wana wa Efraimu: Shuthela, na Beredi mwanawe[a], na Tahathi mwanawe, na Eleada mwanawe, na Tahathi mwanawe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika orodha za nasaba, neno la Kiebrania linalomaanisha “mwana” wakati mwingine linaweza kumaanisha mzao wa kizazi cha baadaye; hata hivyo, katika kila hatua hapa matini inasema kihalisi “mwanawe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶפְרַיִם
  choice: Wana wa Efraimu walikuwa
  rationale: Muundo huu unatambulisha ukoo wa Efraimu kwa Kiswahili cha kawaida; kiunganishi cha mwanzo hakihitaji kutafsiriwa kwa neno “na” katika mwanzo wa mstari huu.
- source_word: שׁוּתָלַח
  choice: Shutela
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likifuata kwa karibu matamshi ya Kiebrania.
- source_word: וּבֶרֶד
  choice: Beredi
  rationale: Jina la mtu limetoholewa kwa mfumo wa sauti unaofaa Kiswahili; kiunganishi chake kinaonyeshwa na mtiririko wa orodha.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Neno בן lenye kiambishi cha nafsi ya tatu ya kiume humaanisha moja kwa moja “mwanawe”; maana pana ya mzao inawezekana katika nasaba na imeelezwa katika tanbihi.
- source_word: וְתַחַת
  choice: Tahathi
  rationale: Katika muktadha huu תַחַת ni jina la mtu, si kihusishi chenye maana ya “chini ya”; limetoholewa kwa Kiswahili.
- source_word: וְאֶלְעָדָה
  choice: Eleada
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa.
- source_word: וְתַחַת בְּנוֹ
  choice: na Tahathi mwanawe
  rationale: Mfumo wa nasaba unaorudiwa umehifadhiwa ili kuonyesha wazi mfululizo uliomo katika matini chanzi.
