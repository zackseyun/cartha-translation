translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametoholewa ili yasomeke kwa kawaida katika Kiswahili, na urudiaji wa nasaba umehifadhiwa. Alama ya tanbihi imewekwa baada ya jina la kwanza kama katika safu ya mashauriano, huku tanbihi ikifafanua matumizi ya “mwanawe” katika mfululizo mzima.
