  text: His sister Hammoleketh bore Ishhod[a], Abiezer, and Mahlah.
translation:
  language: sw
  text: Dada yake, Hamolekethi[a], akawazaa Ishhodi, Abiezeri na Mahla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Molekethi.” Jina hili lina umbo linalohusiana na neno linalomaanisha “malkia” au “mwenye kutawala,” lakini hapa linaeleweka vizuri zaidi kuwa jina la mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֹתוֹ
  choice: Dada yake
  rationale: Nomino אֲחוֹת pamoja na kiambishi cha nafsi ya tatu umoja wa kiume humaanisha ‘dada yake.’ Waw ya kuunganisha imewakilishwa kwa mtiririko wa kitenzi ‘akawazaa’ badala ya kuanza kwa ‘Na,’ ili Kiswahili kisomeke kwa kawaida.
- source_word: הַמֹּלֶכֶת
  choice: Hamolekethi
  rationale: Katika orodha hii ya ukoo, umbo hili linaeleweka vizuri zaidi kama jina la mtu, si cheo ‘malkia.’ ‘Hamolekethi’ huhifadhi kwa ukaribu umbo la Kiebrania lenye ha-.
- source_word: יָלְדָה
  choice: akawazaa
  rationale: Kitenzi hiki cha kike kinaonyesha kwamba mwanamke ndiye aliyewazaa watoto waliotajwa; ‘akawazaa’ ni kifupi na cha kawaida katika taarifa ya ukoo.
- source_word: אִישְׁהוֹד
  choice: Ishihodi
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayosomeka kwa urahisi katika Kiswahili huku likifuatilia umbo la Kiebrania.
- source_word: אֲבִיעֶזֶר
  choice: Abiezeri
  rationale: Jina la mtu limetoholewa kwa matumizi ya Kiswahili, huku sauti kuu za jina la Kiebrania zikihifadhiwa.
- source_word: מַחְלָה
  choice: Mahla
  rationale: Jina la mtu limetoholewa moja kwa moja; ‘Mahla’ linafuata kwa karibu umbo la Kiebrania.
