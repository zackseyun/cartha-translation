lexical_decisions:
- source_word: לַעְדָּן
  choice: Laadani
  rationale: Jina la mtu limetoholewa kwa kufuata matamshi ya Kiebrania na desturi ya Kiswahili ya kuandika majina ya kibiblia; vokali ya mwisho imeongezwa kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Neno hili kihalisi ni ‘mwana wake.’ Katika orodha hii ya ukoo, ‘mwanawe’ ni usemi mfupi na wa asili unaohifadhi uhusiano wa moja kwa moja unaotajwa katika Kiebrania.
- source_word: עַמִּיהוּד
  choice: Amihudi
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa, kwa umbo linalofaa matamshi na uandishi wa Kiswahili.
- source_word: אֱלִישָׁמָע
  choice: Elishama
  rationale: Jina la mtu limetoholewa kwa umbo la kibiblia linalotambulika katika Kiswahili.
