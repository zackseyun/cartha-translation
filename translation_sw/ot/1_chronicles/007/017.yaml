base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/017.yaml
  text: 'And the sons of Ulam: Bedan. These were the sons of Gilead son of Machir[a], son of Manasseh.'
translation:
  language: sw
  text: 'Nao wana wa Ulamu: Bedani. Hawa ndio wana wa Gileadi, mwana wa Makiri[a], mwana wa Manase.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Hawa ndio wana wa Gileadi...” Kishazi hiki huenda ni muhtasari wa nasaba unaounganisha ukoo wa Ulamu na Gileadi, Makiri, na Manase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Nao wana wa
  rationale: Kiunganishi ו kimetafsiriwa kwa “Nao” ili kuendeleza orodha ya nasaba kwa mtiririko wa kawaida; בְנֵי ni muundo wa nasaba, “wana wa.”
- source_word: אוּלָם
  choice: Ulamu
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: בְּדָן
  choice: Bedani
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: אֵלֶּה
  choice: Hawa ndio
  rationale: Kiebrania kina kihisishi “hawa” bila kitenzi; “ndio” hukamilisha kishazi kwa Kiswahili cha kawaida bila kulazimisha tofauti ya wakati uliopo au uliopita.
- source_word: בְּנֵי גִלְעָד
  choice: wana wa Gileadi
  rationale: “Wana” huhifadhi nahau ya nasaba ya Kiebrania kwa uwazi kuliko kuibadili moja kwa moja kuwa “wazao.”
- source_word: בֶּן מָכִיר
  choice: mwana wa Makiri
  rationale: Muunganiko rasmi wa nasaba umehifadhiwa.
- source_word: בֶּן מְנַשֶּׁה
  choice: mwana wa Manase
  rationale: Muunganiko rasmi wa nasaba umehifadhiwa, na jina limetoholewa kwa Kiswahili.
theological_decisions:
- issue: Uhusiano wa kishazi “Hawa ndio wana wa Gileadi” na ukoo wa Ulamu
  choice: Kuhifadhi kishazi kama muhtasari wa nasaba bila kufafanua zaidi
  alternative: Kutafsiri wazi kuwa hawa ni wazao wa Gileadi
  rationale: Muundo wa Kiebrania unaweza kuwa muhtasari unaounganisha ukoo wa Ulamu na Gileadi, Makiri, na Manase; tafsiri haipaswi kuondoa utata huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye hadhi unaofaa orodha ya nasaba. Majina yametoholewa kwa maumbo yaliyozoeleka katika Kiswahili.
