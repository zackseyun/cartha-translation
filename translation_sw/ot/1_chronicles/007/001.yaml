translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama orodha ya ukoo ya Kiebrania, huku “walikuwa” na “jumla yao” vikisaidia sentensi isomeke kwa urahisi katika Kiswahili.
