base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/001.yaml
  text: 'The sons of Issachar: Tola[a], Puah, Jashub[b], and Shimron—four.'
translation:
  language: sw
  text: Wana wa Isakari walikuwa Tola, Pua[a], Yashubu[b] na Shimroni—jumla yao wanne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Pua; baadhi ya mapokeo yana umbo “Puva,” kwa kutegemea namna ya jina hili katika orodha nyingine za ukoo.'
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania hapa: Yashubu; katika Mwanzo 46:13, orodha sambamba ina umbo la jina “Ishvi.”'
    reason: cross_reference
lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  choice: Wana wa
  rationale: Kirai hiki kinaanzisha orodha ya ukoo wa kabila linalofuata. Katika Kiswahili, “Wana wa” ni kichwa cha orodha kilicho wazi na cha kawaida; viambishi vya Kiebrania וְ na לִ havihitaji kutafsiriwa kila kimoja hapa.
- source_word: יִשָׂשכָר
  choice: Isakari
  rationale: Jina la mtu na kabila limetolewa kwa umbo lililozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: תּוֹלָע
  choice: Tola
  rationale: Jina la mtu katika orodha ya ukoo limetoholewa badala ya kutafsiriwa maana yake ya kileksika.
- source_word: וּ/פוּאָה
  choice: Pua
  rationale: Umbo hili linafuata matamshi ya maandishi ya Kimasora katika Mambo ya Nyakati; “Puva” ni umbo mbadala linalotokana na orodha sambamba.
- source_word: ישיב
  choice: Yashubu
  rationale: Jina limetoholewa kwa umbo la Kiebrania lililopo katika mstari huu. Umbo tofauti, “Ishvi,” linapatikana katika Mwanzo 46:13 na halijachukuliwa nafasi ya maandishi ya hapa.
- source_word: וְ/שִׁמְרוֹן
  choice: na Shimroni
  rationale: Kiunganishi kimetafsiriwa kwa “na,” nalo jina limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: אַרְבָּעָה
  choice: jumla yao wanne
  rationale: Namba hii ni muhtasari wa idadi ya wana waliotajwa. “Jumla yao wanne” huonyesha kazi hiyo kwa Kiswahili cha kawaida bila kuongeza taarifa mpya.
