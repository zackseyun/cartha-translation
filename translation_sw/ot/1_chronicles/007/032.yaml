lexical_decisions:
- source_word: חֶבֶר
  choice: Heberi
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida na inayoeleweka katika Kiswahili.
- source_word: הוֹלִיד
  choice: akawazaa
  rationale: Katika nasaba, kausativi ya ילד humaanisha kumzaa au kuwa baba wa; ‘akawazaa’ ni ya asili na fupi katika Kiswahili.
- source_word: אֶת
  choice: '[halikutafsiriwa]'
  rationale: Ni kiashiria cha yambwa mahususi katika Kiebrania na halina neno la moja kwa moja katika Kiswahili.
- source_word: יַפְלֵט
  choice: Yafleti
  rationale: Jina la mtu limetoholewa kwa sauti inayokaribia Kiebrania na muundo unaosomeka kwa urahisi katika Kiswahili.
- source_word: שׁוֹמֵר
  choice: Shomeri
  rationale: Jina limetoholewa moja kwa moja kutoka matamshi ya maandishi ya Kimasoreti; tofauti ya ‘Shemeri’ imehifadhiwa katika tanbihi.
- source_word: חוֹתָם
  choice: Hothamu
  rationale: Jina la mtu limetoholewa, huku ‘th’ ikitumiwa kuwakilisha konsonanti ya Kiebrania inayohusika.
- source_word: שׁוּעָא
  choice: Shua
  rationale: Jina limetoholewa kutoka umbo la Kiebrania; tofauti ya ‘Shuah’ imehifadhiwa katika tanbihi.
- source_word: אֲחוֹתָם
  choice: dada yao
  rationale: Nomino ina kiambishi cha nafsi ya tatu wingi wa kiume, hivyo maana yake ya moja kwa moja ni ‘dada yao,’ ikirejelea majina ya wanaume yaliyotangulia.
