source:
  edition: WLC
  text: וּ/בְנֵ֣י בֶ֗כֶר זְמִירָ֡ה וְ/יוֹעָ֡שׁ וֶ֠/אֱלִיעֶזֶר וְ/אֶלְיוֹעֵינַ֤י וְ/עָמְרִי֙ וִ/ירֵמ֣וֹת וַ/אֲבִיָּ֔ה וַ/עֲנָת֖וֹת וְ/עָלָ֑מֶת כָּל אֵ֖לֶּה בְּנֵי בָֽכֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/008.yaml
  text: 'And the sons of Becher: Zemirah[a], Joash, Eliezer, Elioenai, Omri, Jeremoth, Abijah, Anathoth, and Alemeth. All these were the sons of Becher.'
translation:
  language: sw
  text: Nao wana wa Bekeri walikuwa Zemira, Yoashi, Eliezeri, Elioenai, Omri, Yeremothi[a], Abiya, Anathothi, na Alemethi. Hao wote walikuwa wana wa Bekeri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili linaweza pia kuandikwa “Yerimothi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Nao wana wa
  rationale: Katika orodha ya ukoo, בְּנֵי ina maana ya “wana wa,” nayo וּ inaendeleza orodha; “Nao” ni Kiswahili cha kawaida kinachoonyesha mwendelezo huo.
- source_word: בֶכֶר
  choice: Bekeri
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yaliyozoeleka katika Biblia za Kiswahili.
- source_word: זְמִירָה
  choice: Zemira
  rationale: Jina limetoholewa moja kwa moja kwa mfumo wa sauti wa Kiswahili, bila kuongeza h isiyotamkwa mwishoni.
- source_word: יוֹעָשׁ
  choice: Yoashi
  rationale: Tahajia ya Kiswahili inaakisi sauti za jina la Kiebrania na matumizi yaliyozoeleka.
- source_word: אֱלִיעֶזֶר
  choice: Eliezeri
  rationale: Jina limetoholewa kwa namna ya kawaida na inayotamkika kwa urahisi katika Kiswahili.
- source_word: אֶלְיוֹעֵינַי
  choice: Elioenai
  rationale: Utohozi huu unafuata kwa karibu umbo la jina la Kiebrania na unabaki rahisi kutambua.
- source_word: עָמְרִי
  choice: Omri
  rationale: Hii ndiyo tahajia iliyozoeleka ya jina hili katika Kiswahili.
- source_word: יִרֵמוֹת
  choice: Yeremothi
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili; tofauti ya “Yerimothi” imehifadhiwa katika tanbihi kwa sababu miundo yote miwili hutumiwa katika utohozi.
- source_word: אֲבִיָּה
  choice: Abiya
  rationale: Tahajia hii inawakilisha jina la Kiebrania kwa mfumo wa sauti wa Kiswahili bila kutegemea tahajia ya Kiingereza.
- source_word: עֲנָתוֹת
  choice: Anathothi
  rationale: Muktadha wa ukoo unaonyesha kuwa hapa ni jina la mtu; limetoholewa badala ya kutafsiriwa.
- source_word: עָלָמֶת
  choice: Alemethi
  rationale: Jina la mtu limetoholewa kwa namna inayoakisi umbo la Kiebrania na inayotamkika katika Kiswahili.
- source_word: כָּל אֵלֶּה
  choice: Hao wote
  rationale: Hii ni kauli ya muhtasari iliyo ya kawaida na ya asili katika Kiswahili, huku ikihifadhi maana ya “wote hawa.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Muundo wa kwanza umewekwa kama sentensi kamili kwa kutumia “walikuwa,” jambo linalowasilisha orodha ya ukoo kwa ufasaha bila kubadili maana. Majina yametoholewa moja kwa moja kutoka Kiebrania kwa kuzingatia mfumo wa sauti wa Kiswahili.
