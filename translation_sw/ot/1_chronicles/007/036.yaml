  yaml_path: translation/ot/1_chronicles/007/036.yaml
  text: 'The sons of Zophah: Suah[a], Harnepher, Shual, Beri, and Imrah.'
translation:
  language: sw
  text: 'Wana wa Sofa[a]: Sua, Harneferi, Shuali, Beri na Imra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wazao wa Sofa.” Katika orodha za ukoo, neno la Kiebrania בְּנֵי wakati mwingine linaweza kumaanisha watu wa ukoo mpana zaidi, ingawa “wana wa” ndiyo tafsiri ya moja kwa moja zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa neno la Kiebrania linalomaanisha ‘wana’ katika hali ya kuunganisha; hapa linaanzisha orodha ya ukoo na limetafsiriwa moja kwa moja.
- source_word: צוֹפָח
  choice: Sofa
  rationale: Jina la mtu limenukuliwa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, huku sauti ya Kiebrania צ ikiwakilishwa kwa s.
- source_word: סוּחַ
  choice: Sua
  rationale: Jina la mtu limenukuliwa kwa Kiswahili; herufi h ya mwisho haiongezwi kwa kuwa haionyeshi sauti tofauti inayohitajika katika tahajia ya Kiswahili.
- source_word: חַרְנֶפֶר
  choice: Harneferi
  rationale: Jina la mtu limenukuliwa kwa kufuata sauti za Kiebrania na kupewa irabu ya mwisho ili lisomeke kwa urahisi katika Kiswahili.
- source_word: שׁוּעָל
  choice: Shuali
  rationale: Katika muktadha huu ni jina la mtu, si nomino ya kawaida; limenukuliwa badala ya kutafsiriwa, likiwa na irabu ya mwisho inayofaa matamshi ya Kiswahili.
- source_word: בֵרִי
  choice: Beri
  rationale: Jina la mtu limenukuliwa moja kwa moja kwa namna ya asili na inayosomeka katika Kiswahili.
- source_word: יִמְרָה
  choice: Imra
  rationale: Jina la mtu limenukuliwa kwa kuwakilisha yod ya mwanzo kama sauti ya i na bila h isiyotamkwa mwishoni.
