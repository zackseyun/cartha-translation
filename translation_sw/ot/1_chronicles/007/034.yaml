  text: 'And the sons of Shemer: Ahi[a], Rohgah, Jehubbah[b], and Aram.'
translation:
  language: sw
  text: Nao wana wa Shemeri[a] walikuwa Ahi, Rohga, Yehuba[b], na Aramu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika nasaba za Kiebrania, msemo “wana wa” unaweza kumaanisha wazao wa kiume au watu wa ukoo, si lazima wana wa moja kwa moja tu.
    reason: cultural_note
  - marker: b
    text: Jina hili pia linaweza kutoholewa Hubba; umbo la Kiebrania linakubali tofauti katika utohozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Nao wana wa
  rationale: Muundo huu wa kawaida wa nasaba unatafsiriwa kwa Kiswahili cha asili; neno 'wana' hapa linaweza kumaanisha wana wa kiume, wazao, au watu wa ukoo kulingana na matumizi ya nasaba.
- source_word: שָׁמֶר
  choice: Shemeri
  rationale: Jina limetoholewa kwa mfumo wa kawaida wa Kiswahili, huku kiambishi -i kikisaidia muundo wa umilikaji 'wa Shemeri'.
- source_word: אֲחִי
  choice: Ahi
  rationale: Katika orodha hii ya nasaba neno hili linafanya kazi kama jina la mtu, hivyo limetoholewa badala ya kutafsiriwa kwa maana inayoweza kuhusishwa na 'ndugu'.
- source_word: ו/רוהגה
  choice: Rohga
  rationale: Jina limetoholewa kwa Kiswahili bila h ya mwisho, ambayo haihitajiki kuwakilisha konsonanti ya mwisho katika umbo la Kiebrania.
- source_word: יחבה
  choice: Yehuba
  rationale: Yod ya mwanzo imewakilishwa kwa 'Ye-', na konsonanti maradufu ya mapokeo ya Kiingereza haijahifadhiwa kwa kuwa tahajia ya Kiswahili haiihitaji.
- source_word: וַ/אֲרָם
  choice: na Aramu
  rationale: Kiunganishi kimetafsiriwa kama 'na'; jina אֲרָם limetoholewa 'Aramu' kwa umbo linalosomeka kwa kawaida katika Kiswahili.
