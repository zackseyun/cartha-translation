  yaml_path: translation/ot/1_chronicles/007/022.yaml
  text: And Ephraim their father mourned for many days[a], and his brothers came to comfort him.
translation:
  language: sw
  text: Efraimu, baba yao, akaomboleza kwa siku nyingi, na ndugu zake wakaja kumfariji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַבֵּל
  choice: akaomboleza
  rationale: Kitenzi katika Hitpael kinaonyesha kuingia katika hali ya maombolezo kwa sababu ya msiba; “akaomboleza” linafaa katika muktadha wa vifo vilivyotajwa katika mstari uliotangulia.
- source_word: אֶפְרַיִם
  choice: Efraimu
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אֲבִיהֶם
  choice: baba yao
  rationale: Kiambishi cha nafsi ya tatu wingi kinaonyesha kwamba Efraimu alikuwa baba ya wale waliotajwa kabla yake.
- source_word: יָמִים רַבִּים
  choice: kwa siku nyingi
  rationale: Hii ni nahau ya Kiebrania inayoonyesha muda; “kwa siku nyingi” ni Kiswahili cha kawaida na wazi.
- source_word: וַיָּבֹאוּ
  choice: wakaja
  rationale: Katika simulizi, בוא hapa inaonyesha ndugu zake kumjia Efraimu.
- source_word: אֶחָיו
  choice: ndugu zake
  rationale: Neno kwa kawaida humaanisha ndugu zake wa kiume, lakini Kiswahili sanifu hutumia “ndugu zake” kwa ufasaha bila kuongeza maelezo yasiyopo katika chanzo.
- source_word: לְנַחֲמוֹ
  choice: kumfariji
  rationale: Katika muktadha wa maombolezo, נחם humaanisha kumpa mwenye huzuni faraja; “kumfariji” ni neno la kawaida na linaloeleweka vyema.
