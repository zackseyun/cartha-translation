  text: Rephah his son[a], Resheph, Telah his son, Tahan his son.
translation:
  language: sw
  text: Refa mwanawe[a], Reshefu, Tela mwanawe, na Tahan mwanawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mara nyingi orodha za ukoo za Kiebrania huacha kitenzi bila kukitaja wazi; hapa kuna mfuatano wa wazao: “Refa mwanawe, Reshefu, Tela mwanawe, na Tahan mwanawe.”'
    reason: cultural_note
lexical_decisions:
- source_word: רֶפַח
  choice: Refa
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili; konsonanti ya mwisho ח haionyeshwi kwa herufi maalumu isiyo ya kawaida katika majina ya Kibiblia ya Kiswahili.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Nomino yenye kiambishi cha nafsi ya tatu umoja wa kiume imetafsiriwa kwa Kiswahili cha kawaida kama “mwanawe”; urudiaji wa fomula ya ukoo umehifadhiwa.
- source_word: רֶשֶׁף
  choice: Reshefu
  rationale: Katika muktadha huu neno ni jina la mtu, si maana zake za kawaida kama moto au tauni; limetoholewa badala ya kutafsiriwa.
- source_word: תֶלַח
  choice: Tela
  rationale: Jina la mtu limetoholewa kwa tahajia rahisi na ya kawaida ya Kiswahili.
- source_word: תַחַן
  choice: Tahani
  rationale: Jina la mtu limetoholewa kwa namna inayowezesha matamshi ya Kiswahili huku likifuata konsonanti za Kiebrania.
- source_word: וְ
  choice: virguli / na
  rationale: Kiunganishi cha Kiebrania kinaunganisha majina katika orodha ya ukoo; virguli zimetumika katikati na “na” kabla ya jina la mwisho ili sentensi isomeke kwa kawaida.
