  register: Mtindo ni mfupi na wa heshima, unaofaa orodha ya majina katika nasaba. Majina yametoholewa kwa tahajia na matamshi ya Kiswahili sanifu; kiunganishi cha mwisho ‘na’ kinaakisi וְ/וּ vya Kiebrania kwa Kiswahili cha kawaida bila kurudia ‘na’ kabla ya kila jina.
