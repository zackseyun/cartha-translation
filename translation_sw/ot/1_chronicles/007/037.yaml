  terminology: Majina yameachwa kama majina ya watu badala ya kutafsiriwa kama nomino za kawaida. Tahajia Shama na Shilsha zinafaa kwa matumizi ya Kiswahili; hazihitaji kuhifadhi konsonanti maradufu au h ya mwisho ya matoholeo ya Kiingereza.
