  text: Bezer[a], Hod, Shamma, Shilshah, Ithran[c][b], and Beera.
translation:
  language: sw
  text: Beseri, Hodi, Shama, Shilsha, Yithrani na Beera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּצֶר
  choice: Beseri
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili, badala ya kutafsiriwa.
- source_word: הוֹד
  choice: Hodi
  rationale: Muktadha wa orodha ya nasaba unaonyesha kuwa hili ni jina la mtu, si nomino ya kawaida yenye maana ya fahari au utukufu; irabu ya mwisho imeongezwa kulingana na utamkaji wa kawaida wa Kiswahili.
- source_word: שַׁמָּא
  choice: Shama
  rationale: Tahajia hii inafuata umbo la Kiebrania šammāʾ; konsonanti maradufu haijahifadhiwa kwa kuwa si lazima katika tahajia ya kawaida ya majina ya Kiswahili.
- source_word: שִׁלְשָׁה
  choice: Shilsha
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania; herufi ya mwisho ה hapa haihitaji kuwakilishwa kwa h katika umbo la Kiswahili.
- source_word: יִתְרָן
  choice: Yithrani
  rationale: Yod ya mwanzo imewakilishwa kwa Y, na irabu ya mwisho imeongezwa ili jina lisomeke kwa muundo wa silabi wa Kiswahili.
- source_word: בְאֵרָא
  choice: Beera
  rationale: Umbo hili rahisi la Kiswahili linawakilisha jina la Kiebrania bila alama ya apostrofi isiyo ya lazima kwa msomaji wa kawaida.
