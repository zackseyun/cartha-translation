  verdict: approve
  source_fidelity: 'Majina yote sita yanalingana na orodha ya Kiebrania: בֶּצֶר, הוֹד, שַׁמָּא, שִׁלְשָׁה, יִתְרָן, na בְאֵרָא. Maumbo ya Kiswahili Beseri, Hodi, Shama, Shilsha, Yithrani, na Beera ni matoholeo yanayokubalika katika matumizi ya Biblia ya Kiswahili; irabu za mwisho katika Beseri, Hodi, na Yithrani ni urekebishaji wa kawaida wa kimatamshi, wala hazibadilishi utambulisho wa majina. Orodha yenye koma na kiunganishi cha mwisho ''na'' ni uwakilishi sahihi na wa kawaida wa viunganishi vya Kiebrania katika Kiswahili.'
