base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/006.yaml
  text: 'The sons of Benjamin: Bela[a], Beker, and Jediael—three.'
translation:
  language: sw
  text: 'Wana wa Benyamini: Bela, Bekeri, na Yediaeli—watatu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְיָמִן
  choice: Benyamini
  rationale: Jina la mtu na kabila; limetolewa kwa umbo la Kiswahili lililozoeleka katika majina ya Biblia. Katika muktadha wa nasaba, uhusiano uliodokezwa umewekwa wazi kwa maneno “Wana wa”.
- source_word: בֶּלַע
  choice: Bela
  rationale: Jina la pekee limetoholewa kwa namna iliyo karibu na umbo la Kiebrania na inayosomeka kwa urahisi katika Kiswahili.
- source_word: בֶּכֶר
  choice: Bekeri
  rationale: Jina la pekee limetoholewa kwa kufuata matamshi ya Kiebrania; irabu ya mwisho husaidia umbo hilo kutamkika kwa kawaida katika Kiswahili.
- source_word: יְדִיעֲאֵל
  choice: Yediaeli
  rationale: Jina limetoholewa kutoka Kiebrania kwa kutumia Y badala ya J ya Kiingereza na kwa umbo linalotamkika kwa kawaida katika Kiswahili.
- source_word: שְׁלֹשָׁה
  choice: watatu
  rationale: Namba hii inawahesabu wanaume watatu waliotajwa, hivyo ngeli ya watu “watatu” ndiyo ya kawaida na sahihi katika Kiswahili.
- source_word: '[implicit genealogical heading]'
  choice: 'Wana wa Benyamini:'
  rationale: Kiebrania ni kifungu kisicho na kitenzi na chenye uhusiano uliodokezwa, kama ilivyo kawaida katika nasaba. Kiswahili kinaweka wazi maana ya muktadha bila kuongeza dai jingine.
