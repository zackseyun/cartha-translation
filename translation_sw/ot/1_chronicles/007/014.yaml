base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/014.yaml
  text: 'The sons of Manasseh: Asriel[a], whom his Aramean concubine bore[c][b]; she bore Machir the father of Gilead.'
translation:
  language: sw
  text: 'Wana[a] wa Manase: Asrieli, ambaye suria wake, yule Mwaramu[b], alimzaa; naye akamzaa Makiri, baba wa Gileadi[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wazao wa Manase.” Katika nasaba, “wana” wakati mwingine linaweza kumaanisha wazao kwa upana zaidi.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “yule Mwaramu”; kwa mapokeo, “yule Msiria.”'
    reason: lexical_alternative
  - marker: c
    text: Katika matumizi ya nasaba, “baba wa Gileadi” pia huenda likamaanisha “baba wa ukoo wa Gileadi” au “mwanzilishi wa Gileadi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: Wana wa Manase
  rationale: Huhifadhi muundo wa kawaida wa nasaba; katika muktadha huu neno hili linaweza pia kumaanisha wazao, jambo linalotajwa katika tanbihi.
- source_word: אַשְׂרִיאֵל
  choice: Asrieli
  rationale: Jina limetoholewa kwa tahajia inayofaa Kiswahili na matumizi ya kawaida ya majina ya Biblia.
- source_word: אֲשֶׁר יָלָדָה
  choice: ambaye ... alimzaa
  rationale: Kitenzi kiko katika nafsi ya tatu, umoja wa kike, na humtaja Asrieli kama aliyemzaa; muundo huu huhifadhi uhusiano huo wa kisarufi.
- source_word: פִּילַגְשׁוֹ
  choice: suria wake
  rationale: “Suria” ni neno mahususi la Kiswahili kwa mwanamke mwenye hadhi ya chini kuliko mke katika mpangilio wa ndoa wa kale, bila kulipanua kuwa “mke wa pili.”
- source_word: הָאֲרַמִּיָּה
  choice: Mwaramu
  rationale: Humtambulisha mwanamke kuwa wa jamii ya Waaramu, kwa usahihi zaidi wa kihistoria kuliko “Msiria.”
- source_word: יָלְדָה אֶת מָכִיר
  choice: naye akamzaa Makiri
  rationale: Hurudia taarifa ya kuzaa na mhusika wa kike kama ilivyo katika Kiebrania, huku kiunganishi cha Kiswahili kikifanya mtiririko kuwa wa kawaida.
- source_word: אֲבִי גִלְעָד
  choice: baba wa Gileadi
  rationale: Ni tafsiri ya moja kwa moja ya אָב; uwezekano wa maana pana ya “babu” au “mwanzilishi” katika nasaba umehifadhiwa katika tanbihi.
