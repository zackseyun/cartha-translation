lexical_decisions:
- source_word: וּבֶן
  choice: Na mwana wa
  rationale: Neno בֶן liko katika umoja na katika hali ya kuonyesha uhusiano wa nasaba; kiunganishi וּ־ kimehifadhiwa kwa “Na.”
- source_word: הֵלֶם
  choice: Helemu
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayoeleweka katika Kiswahili.
- source_word: אָחִיו
  choice: ndugu yake
  rationale: Huhifadhi neno la undugu pamoja na kiambishi cha nafsi ya tatu umoja bila kubainisha kwa kulazimisha mtu anayerejelewa na “yake.”
- source_word: צוֹפַח
  choice: Sofa
  rationale: Jina limetoholewa kwa Kiswahili; sauti ya mwisho ח haionyeshwi kwa konsonanti tofauti katika tahajia hii ya kawaida.
- source_word: וְיִמְנָע
  choice: Imna
  rationale: Jina la mtu katika orodha; kiunganishi chake kinawakilishwa kwa mpangilio wa orodha ya Kiswahili.
- source_word: וְשֵׁלֶשׁ
  choice: Sheleshi
  rationale: Jina la mtu limetoholewa kwa namna inayorahisisha matamshi ya Kiswahili.
- source_word: וְעָמָל
  choice: na Amali
  rationale: Kiunganishi cha Kiebrania kimehifadhiwa kama “na” kabla ya jina la mwisho katika orodha.
theological_decisions:
- issue: Umoja wa “mwana” ukifuatiwa na majina manne
  choice: Kuhifadhi umoja “mwana” katika maandishi
  alternative: “wana”
  rationale: Maandishi ya Kiebrania ya WLC yana בֶן katika umoja, ingawa orodha inayofuata ina majina manne. Tafsiri hairekebishi mvutano huo kimya kimya; inaueleza katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, kwa mtindo mfupi na wenye hadhi unaofaa orodha ya nasaba. Muundo “ndugu yake” umeachwa na utata wa kirejeleo uliopo katika Kiebrania.
