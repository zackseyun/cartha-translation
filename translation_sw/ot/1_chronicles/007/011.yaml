  text: כָּל אֵ֜לֶּה בְּנֵ֤י יְדִֽיעֲאֵל֙ לְ/רָאשֵׁ֣י הָ/אָב֔וֹת גִּבּוֹרֵ֖י חֲיָלִ֑ים שִׁבְעָֽה עָשָׂ֥ר אֶ֨לֶף֙ וּ/מָאתַ֔יִם יֹצְאֵ֥י צָבָ֖א לַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/011.yaml
  text: All these were sons of Jediael[a], according to the heads of the fathers’ houses, mighty men of valor, seventeen thousand two hundred[d][c][b], able to go out in the army for war.
translation:
  language: sw
  text: Hawa wote walikuwa wana wa Yediaeli[a], kwa hesabu ya wakuu wa nyumba za baba zao[b]—mashujaa hodari[c] 17,200 waliokuwa tayari kwa utumishi wa kijeshi vitani[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wazao wa Yediaeli.” Katika orodha za nasaba, neno la Kiebrania linalotafsiriwa “wana” linaweza kuwa na maana pana.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kwa wakuu wa nyumba za baba,” yaani, wakuu wa koo au jamaa.'
    reason: cultural_note
  - marker: c
    text: Au “wanaume mashujaa wenye uwezo.”
    reason: lexical_alternative
  - marker: d
    text: Kihalisi, “wale waendao katika jeshi kwa vita,” nahau inayomaanisha watu waliopatikana au waliostahili kufanya utumishi wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Hawa wote
  rationale: Ni muhtasari wa watu waliotajwa kabla yake, bila kuongeza nomino isiyokuwamo katika Kiebrania.
- source_word: בְּנֵי יְדִיעֲאֵל
  choice: wana wa Yediaeli
  rationale: Neno בְּנֵי kwa msingi humaanisha ‘wana,’ lakini katika orodha za nasaba linaweza pia kumaanisha wazao; maana pana imeelezwa katika tanbihi.
- source_word: לְרָאשֵׁי הָאָבוֹת
  choice: kwa kufuata wakuu wa jamaa zao
  rationale: Kirai hiki kinaonyesha uainishaji kwa wakuu wa vikundi vya ukoo. ‘Jamaa zao’ ni Kiswahili cha kawaida kinachoeleza muundo wa kijamii wa nyumba za mababu bila kutumia tafsiri ngumu isiyo ya asili.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: mashujaa hodari
  rationale: Kirai hiki huonyesha wanaume wenye nguvu, ujasiri, na uwezo wa kijeshi; ‘mashujaa hodari’ ni cha asili na chenye hadhi katika Kiswahili.
- source_word: שִׁבְעָה עָשָׂר אֶלֶף וּמָאתַיִם
  choice: watu 17,200
  rationale: Inahifadhi jumla kamili ya sensa; ‘watu’ huweka wazi kuwa idadi hiyo inawahusu mashujaa waliotajwa.
- source_word: יֹצְאֵי צָבָא לַמִּלְחָמָה
  choice: walioweza kwenda vitani
  rationale: Tafsiri hii huwasilisha kwa Kiswahili cha kawaida nahau inayomaanisha watu waliokuwa tayari au wenye uwezo wa kushiriki katika huduma ya kijeshi wakati wa vita.
