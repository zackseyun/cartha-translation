lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii ya ukoo, neno hili linawataja wana wa kiume wa Naftali moja kwa moja.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Jina la mtu na kabila limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: יַחֲצִיאֵל
  choice: Yahzieli
  rationale: Jina limetoholewa kutoka Kiebrania kwa namna inayosomeka kwa kawaida katika Kiswahili, huku likitofautishwa na umbo la jina katika Mwanzo 46:24.
- source_word: גוּנִי
  choice: Guni
  rationale: Jina limetoholewa moja kwa moja kwa tahajia ya Kiswahili.
- source_word: יֵצֶר
  choice: Yezeri
  rationale: Jina limetoholewa kwa kufuata sauti za Kiebrania na muundo unaosomeka kwa Kiswahili.
- source_word: שַׁלּוּם
  choice: Shalumu
  rationale: Imetafsiriwa kulingana na maandishi ya WLC katika Mambo ya Nyakati, ambayo yana umbo Shalumu; tofauti ya Mwanzo imehifadhiwa katika tanbihi.
- source_word: בְּנֵי בִלְהָה
  choice: wana wa Bilha
  rationale: Kirai hiki cha mwisho kinawatambulisha watu waliotajwa kuwa wa ukoo wa Bilha bila kuongeza ufafanuzi usio katika chanzo.
