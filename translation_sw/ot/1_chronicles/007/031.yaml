lexical_decisions:
- source_word: וּבְנֵי בְרִיעָה
  choice: Wana wa Beria walikuwa
  rationale: Kirai cha nasaba kinataja wana wa Beria. Kitenzi “walikuwa” kimeongezwa kwa Kiswahili cha kawaida bila kubadili maana.
- source_word: חֶבֶר
  choice: Heberi
  rationale: Jina la mtu limetoholewa kwa namna inayofaa mfumo wa sauti na uandishi wa Kiswahili.
- source_word: וּמַלְכִּיאֵל
  choice: na Malkieli
  rationale: Kiunganishi וּ kimetafsiriwa “na,” na jina limetoholewa kwa Kiswahili.
- source_word: הוּא
  choice: naye Malkieli
  rationale: Ingawa Kiebrania kina kiwakilishi “yeye,” kurudia jina Malkieli huondoa utata wa rejeleo katika Kiswahili bila kubadili mhusika anayelengwa.
- source_word: אֲבִי
  choice: alikuwa baba wa
  rationale: Tafsiri ya moja kwa moja inahifadhi nahau ya nasaba; inaweza pia kumaanisha babu wa ukoo au mwanzilishi.
- source_word: ברזות
  choice: Birzaiti
  rationale: Jina adimu, huenda la mahali au ukoo, limetoholewa kwa tahadhari kwa kuwa usomaji wake si hakika.
