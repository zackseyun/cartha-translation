translation:
  language: sw
  text: Wana wa Beria ni Heberi na Malkieli; naye Malkieli ndiye baba wa Birzaithi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika nasaba, “baba wa” huenda pia ikamaanisha “mtangulizi wa” au “mwanzilishi wa” Birzaithi, wala si lazima baba wa moja kwa moja.
