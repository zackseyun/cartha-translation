translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa orodha ya kijiografia umehifadhiwa, huku nahau ya Kiebrania kuhusu “miji binti” ikitolewa kwa maana yake ya kawaida. Alama zote za tanbihi zimewekwa katika sehemu za matini zinazohusika.
