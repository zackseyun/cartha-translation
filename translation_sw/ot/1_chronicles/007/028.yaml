base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/028.yaml
  text: Their holdings and settlements were Bethel and its daughter towns[a], and to the east Naaran, and to the west Gezer and its daughter towns, and Shechem and its daughter towns[c][b], as far as Ayyah and its daughter towns.
translation:
  language: sw
  text: Milki zao na makazi yao yalikuwa Betheli na miji yake iliyoitegemea[b], upande wa mashariki Naarani[a], na upande wa magharibi Gezeri na miji yake iliyoitegemea, na Shekemu na miji yake iliyoitegemea, hadi Aya[c] na miji yake iliyoitegemea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi husoma “Naara” badala ya “Naarani,” kwa kutegemea mapokeo yanayohusiana ya jina la mahali pengine.
    reason: alternative_reading
  - marker: b
    text: Kiebrania kinasema kihalisi “binti zake,” nahau inayomaanisha miji midogo au vijiji vilivyokuwa chini ya mji mkuu.
    reason: cultural_note
  - marker: c
    text: Maandishi ya Kiebrania yanasema “Aya”; baadhi ya mashahidi wa kale na tafsiri huonyesha badala yake “Gaza.”
    reason: textual_variant
lexical_decisions:
- source_word: אֲחֻזָּתָם
  choice: milki yao
  rationale: Neno hili linamaanisha ardhi au maeneo yaliyomilikiwa; “milki” linafaa kwa orodha hii ya kijiografia bila kulifanya kuwa “urithi” kwa lazima.
- source_word: מֹשְׁבוֹתָם
  choice: makazi yao
  rationale: Katika muktadha wa maeneo ya kikabila, neno hili linataja mahali walipoishi; “makazi” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: בֵּית אֵל
  choice: Betheli
  rationale: Hili ndilo umbo la kawaida la jina hili la mahali katika Kiswahili cha Biblia.
- source_word: בְנֹתֶיהָ
  choice: miji yake iliyoitegemea
  rationale: Kiebrania kinasema kihalisi “binti zake,” nahau inayomaanisha miji midogo au vijiji vilivyotegemea mji mkuu; tafsiri hii inaeleza uhusiano huo kwa Kiswahili cha kawaida.
- source_word: לַמִּזְרָח
  choice: upande wa mashariki
  rationale: Inaonyesha upande au ukomo wa mashariki wa eneo kwa usemi wa kawaida wa Kiswahili.
- source_word: נַעֲרָן
  choice: Naarani
  rationale: Umbo la Kimasora ni Naaran; “Naarani” limetumiwa kama uhawilishaji unaosomeka kwa Kiswahili, huku mapokeo mbadala yakihifadhiwa katika tanbihi.
- source_word: לַמַּעֲרָב
  choice: upande wa magharibi
  rationale: Ni kilingani cha wazi na cha kawaida cha upande wa mashariki.
- source_word: גֶּזֶר
  choice: Gezeri
  rationale: Uhawilishaji wa jina la mahali unaolingana na matamshi na maumbo ya majina katika Kiswahili.
- source_word: שְׁכֶם
  choice: Shekemu
  rationale: Umbo la kawaida la Kiswahili la jina hili la mahali.
- source_word: עַד
  choice: hadi
  rationale: Linaonyesha mpaka au umbali wa eneo kwa ufupi na kwa kawaida.
- source_word: עַיָּה
  choice: Aya
  rationale: Maandishi ya Kimasora yana עַיָּה; “Aya” yanawakilisha usomaji huo, huku “Gaza” ya baadhi ya mashahidi wa kale ikitajwa katika tanbihi.
