  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/זָבָ֥ד בְּנ֛/וֹ וְ/שׁוּתֶ֥לַח בְּנ֖/וֹ וְ/עֵ֣זֶר וְ/אֶלְעָ֑ד וַ/הֲרָג֗וּ/ם אַנְשֵׁי גַת֙ הַ/נּוֹלָדִ֣ים בָּ/אָ֔רֶץ כִּ֣י יָרְד֔וּ לָ/קַ֖חַת אֶת מִקְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/021.yaml
  text: Zabad his son[a], and Shuthelah his son, and Ezer and Elead; the men of Gath who were born in the land killed them[b], because they had gone down to take their livestock.
translation:
  language: sw
  text: Zabadi mwanawe, na Shuthela mwanawe, na Ezeri na Eleadi; watu wa Gathi waliozaliwa katika nchi[a] waliwaua, kwa sababu walikuwa wameshuka kuchukua mifugo yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa Gathi wenyeji wa nchi.” Kiebrania kinasema kihalisi, “watu wa Gathi, waliozaliwa katika nchi.”
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha, huenda kiima cha “walikuwa wameshuka” ni Ezeri na Eleadi, majina ya wingi yaliyo karibu zaidi.
    reason: source_ambiguity
lexical_decisions:
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Nomino yenye kiambishi cha nafsi ya tatu umoja wa kiume; ‘mwanawe’ ni usemi wa kawaida na wenye hadhi katika orodha ya ukoo. Marudio yake yamehifadhiwa.
- source_word: וְעֵזֶר וְאֶלְעָד
  choice: na Ezeri na Eleadi
  rationale: Majina yametoholewa kwa tahajia inayosomeka kwa Kiswahili, huku viunganishi vya orodha vikihifadhiwa.
- source_word: וַהֲרָגוּם
  choice: waliwaua
  rationale: Kitenzi הרג pamoja na kiambishi cha yambwa wingi humaanisha moja kwa moja ‘waliwaua’; tafsiri hii ni wazi bila kuongeza dhana ya namna walivyouawa.
- source_word: אַנְשֵׁי גַת
  choice: watu wa Gathi
  rationale: Ingawa אַנְשֵׁי kwa umbo ni ‘wanaume wa,’ katika muktadha huu neno hilo linawataja wenyeji wa Gathi; ‘watu wa Gathi’ ni Kiswahili cha kawaida bila kudai kwamba walikuwa askari.
- source_word: הַנּוֹלָדִים בָּאָרֶץ
  choice: waliozaliwa katika nchi hiyo
  rationale: Huhifadhi usemi halisi wa Kiebrania na kuonyesha kwamba kifungu hiki kinawafafanua watu wa Gathi. ‘Hiyo’ hufanya rejeo la nchi lisomeke kwa kawaida katika Kiswahili.
- source_word: כִּי
  choice: kwa sababu
  rationale: Huanzisha sababu ya kuuawa kwao; ‘kwa sababu’ huonyesha uhusiano huo wazi katika Kiswahili cha sasa.
- source_word: יָרְדוּ
  choice: walikuwa wameshuka
  rationale: Huhifadhi wazo la kushuka na kuonyesha kwamba tendo hilo lilitangulia kuuawa. Kiima hakijatajwa wazi ili kutohitimisha kimyakimya utata wa Kiebrania.
- source_word: לָקַחַת
  choice: kuchukua
  rationale: Ni maana pana na ya moja kwa moja ya לקח; ‘kunyakua’ au ‘kupora’ kungeongeza tafsiri ya uvamizi ambayo haijaelezwa moja kwa moja na kitenzi.
- source_word: מִקְנֵיהֶם
  choice: mifugo yao
  rationale: מִקְנֶה kwa kawaida humaanisha wanyama wanaofugwa; ‘mifugo’ ni pana kuliko ‘ng’ombe’ na ni ya kawaida katika Kiswahili.
theological_decisions:
- issue: Kiima cha יָרְדוּ (‘walikuwa wameshuka’)
  choice: Kimeachwa kama ‘walikuwa wameshuka,’ bila kutaja majina ndani ya aya.
  alternative: ‘Ezeri na Eleadi walikuwa wameshuka’
  rationale: Muktadha unaelekeza kwa Ezeri na Eleadi kama kiima cha karibu cha wingi, lakini Kiebrania hakirudii majina hayo. Tafsiri kuu inalinda utata wa kisarufi, na tanbihi inaeleza usomaji unaowezekana zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa orodha ya ukoo umehifadhiwa, na nusu koloni imetumiwa kutenganisha majina na tukio linalofuata. Majina yametoholewa kwa mtindo wa kawaida wa majina ya Biblia katika Kiswahili.
