  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִתְיַחְשָׂ֣/ם לְ/תֹלְדוֹתָ֗/ם רָאשֵׁי֙ בֵּ֣ית אֲבוֹתָ֔/ם גִּבּוֹרֵ֖י חָ֑יִל עֶשְׂרִ֥ים אֶ֖לֶף וּ/מָאתָֽיִם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/009.yaml
  text: 'They were enrolled by genealogy[a], according to their generations, as heads of their fathers’ houses[b], mighty men of valor: twenty thousand two hundred.'
translation:
  language: sw
  text: Waliandikishwa katika orodha za ukoo[a] kulingana na vizazi vyao, wakiwa viongozi wa jamaa za mababu zao[b] na mashujaa hodari; walikuwa elfu ishirini na mia mbili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walisajiliwa kwa nasaba.” Kitenzi cha Kiebrania kinamaanisha kuingizwa katika kumbukumbu za ukoo.
    reason: lexical_alternative
  - marker: b
    text: “Jamaa za mababu” ni vitengo vya kifamilia vilivyotokana na babu mmoja, si familia ndogo ya wazazi na watoto wao pekee.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְיַחְשָׂם
  choice: Waliandikishwa katika orodha za ukoo
  rationale: Kitenzi cha Kiebrania katika hitpael humaanisha kuingizwa au kuhesabiwa katika kumbukumbu za ukoo; tafsiri hii inaonyesha tendo la usajili na muktadha wa nasaba.
- source_word: לְתֹלְדוֹתָם
  choice: kulingana na vizazi vyao
  rationale: Neno תולדות hurejelea vizazi au mfuatano wa ukoo. Tafsiri hii inabaki karibu na muundo wa Kiebrania bila kufasiri kupita kiasi.
- source_word: רָאשֵׁי בֵּית אֲבוֹתָם
  choice: viongozi wa jamaa za mababu zao
  rationale: Kirai hiki kinataja viongozi wa vitengo vya kijamii vilivyotokana na babu mmoja. 'Jamaa za mababu' ni Kiswahili cha asili zaidi kuliko tafsiri ya neno kwa neno ya 'nyumba za baba'.
- source_word: גִּבּוֹרֵי חָיִל
  choice: mashujaa hodari
  rationale: Kirai kinaweza kuonyesha nguvu, ushujaa na uwezo wa kijeshi. 'Mashujaa hodari' huhifadhi maana pana pamoja na muktadha unaowezekana wa kijeshi.
- source_word: עֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: elfu ishirini na mia mbili
  rationale: Hii ni tafsiri ya moja kwa moja ya idadi 20,200 kwa mtindo wa kifasihi wa Kiswahili.
