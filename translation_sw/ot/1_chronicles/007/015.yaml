  text: וּ/מָכִ֞יר לָקַ֤ח אִשָּׁה֙ לְ/חֻפִּ֣ים וּ/לְ/שֻׁפִּ֔ים וְ/שֵׁ֤ם אֲחֹת/וֹ֙ מַעֲכָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖י צְלָפְחָ֑ד וַ/תִּהְיֶ֥נָה לִ/צְלָפְחָ֖ד בָּנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/015.yaml
  text: Machir took a wife for Huppim and for Shuppim. The name of his sister was Maacah[a], and the name of the second was Zelophehad; and Zelophehad had daughters.
translation:
  language: sw
  text: Naye Makiri akawatwalia Hupimu na Shupimu mke. Jina la dada yake lilikuwa Maaka, na jina la huyo wa pili lilikuwa Selofehadi[a]; naye Selofehadi alikuwa na mabinti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na jina la mwana wa pili lilikuwa Selofehadi.” Kiebrania kinasema tu “wa pili,” bila kutaja wazi anayerejelewa.
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח אִשָּׁה
  choice: akawatwalia ... mke
  rationale: Nahau hii kwa kawaida humaanisha ‘kutwaa mke’ au ‘kuoa.’ Hapa viambishi vya ‘kwa ajili ya’ vinavyofuata vinaonyesha kwamba Makiri aliwatwalia Hupimu na Shupimu mke, si kwamba yeye mwenyewe alimwoa.
- source_word: לְחֻפִּים וּלְשֻׁפִּים
  choice: Hupimu na Shupimu
  rationale: Kiambishi cha yambwa katika ‘akawatwalia’ kinawakilisha vihusishi vya Kiebrania vilivyorudiwa, huku sentensi ya Kiswahili ikibaki ya kawaida. Muundo usio wa kawaida wa chanzo, unaoweza kuashiria mpango wa ndoa kwa niaba yao, haujafafanuliwa kupita kiasi.
- source_word: וְשֵׁם אֲחֹתוֹ מַעֲכָה
  choice: Jina la dada yake lilikuwa Maaka
  rationale: Huu ni uwasilishaji wa moja kwa moja wa fomula ya kutaja jina. Kiwakilishi ‘yake’ kimeachwa bila kufafanuliwa zaidi, ingawa kwa ukaribu wa kisarufi huenda kinamrejelea Makiri.
- source_word: וְשֵׁם הַשֵּׁנִי צְלָפְחָד
  choice: na jina la pili lilikuwa Selofehadi
  rationale: Kiebrania kinasema tu ‘wa pili’ bila kutaja wazi mhusika au uhusiano wake. Kiswahili ‘la pili’ kinadumisha ufupi na utata huo badala ya kuongeza ‘mwana.’
- source_word: וַתִּהְיֶנָה לִצְלָפְחָד בָּנוֹת
  choice: naye Selofehadi alikuwa na binti
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuwasilisha muundo wa Kiebrania unaoonyesha umilikaji. ‘Binti’ linaweza kumaanisha mmoja au zaidi kulingana na muktadha, lakini hapa limetumiwa kwa maana ya wingi kama ilivyo kawaida katika Kiswahili.
theological_decisions:
- issue: Utata wa nasaba katika ‘wa pili’
  choice: Kudumisha usemi mfupi ‘jina la pili’ katika andiko kuu bila kuongeza ‘mwana’
  alternative: na jina la mwana wa pili lilikuwa Selofehadi
  rationale: Kiebrania hakitaji wazi nomino inayohusishwa na ‘wa pili.’ Kuongeza ‘mwana’ kungesuluhisha nasaba kwa tafsiri. Tanbihi inahifadhi usomaji huo unaowezekana bila kuufanya kuwa sehemu ya andiko kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka. Majina yameandikwa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili. Muundo wa kwanza umefanywa wa kawaida kwa Kiswahili bila kuficha kwamba Makiri alitenda kwa niaba ya Hupimu na Shupimu; utata halisi wa ‘wa pili’ umehifadhiwa na kufafanuliwa katika tanbihi.
