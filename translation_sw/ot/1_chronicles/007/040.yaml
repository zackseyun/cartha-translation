base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/040.yaml
  text: All these were sons of Asher[a], heads of fathers’ houses, select men, mighty warriors, chief leaders; and they were enrolled for service in the army for war. Their number in men was twenty-six thousand.
translation:
  language: sw
  text: Hao wote walikuwa wana wa Asheri, wakuu wa koo za baba zao, watu waliochaguliwa, mashujaa hodari, na viongozi wakuu. Waliandikishwa kwa nasaba[a] kwa ajili ya utumishi wa jeshi vitani. Jumla ya wanaume hao ilikuwa elfu ishirini na sita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nasaba yao iliandikwa.” Kitenzi cha Kiebrania mara nyingi humaanisha kuorodheshwa kwa kufuata nasaba katika kitabu cha Mambo ya Nyakati.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי בֵית הָאָבוֹת
  choice: wakuu wa jamaa za ukoo wa baba zao
  rationale: Kirai hiki kinataja viongozi wa vitengo vya ukoo. Tafsiri hii huhifadhi dhana ya ukoo wa upande wa baba bila kutumia muundo wa Kiebrania ambao ungekuwa mgumu kwa Kiswahili cha kawaida.
- source_word: בְּרוּרִים
  choice: watu waliochaguliwa
  rationale: Umbile la neno linaonyesha watu walioteuliwa au walioonekana kuwa bora; ‘waliochaguliwa’ ni la kawaida na linafaa katika muktadha wa kijeshi.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: mashujaa hodari
  rationale: Hiki ni kirai cha kijeshi kinachoonyesha ushujaa na uwezo; ‘mashujaa hodari’ huwasilisha maana hizo kwa Kiswahili cha sasa.
- source_word: רָאשֵׁי הַנְּשִׂיאִים
  choice: wakuu wa viongozi
  rationale: Tafsiri hii huhifadhi muundo wa cheo cha juu miongoni mwa viongozi bila kuingiza wazo la kifalme lisilo lazima.
- source_word: וְהִתְיַחְשָׂם
  choice: waliandikishwa kwa nasaba
  rationale: Katika Mambo ya Nyakati, kitenzi hiki mara nyingi huhusu kuandikishwa katika orodha ya nasaba. Kauli hii huhifadhi wazi msingi wa kiukoo wa usajili.
- source_word: בַּצָּבָא בַּמִּלְחָמָה
  choice: kwa ajili ya utumishi wa jeshi vitani
  rationale: Muundo huu unaonyesha kuandikishwa kwa huduma ya kijeshi kwa kusudi la vita; Kiswahili hiki ni cha asili na kifupi.
- source_word: מִסְפָּרָם אֲנָשִׁים
  choice: Jumla ya wanaume hao
  rationale: Huwasilisha wazi kwamba hesabu ni ya wanaume, huku ikiepuka muundo mgumu usio wa kawaida katika Kiswahili.
- source_word: עֶשְׂרִים וְשִׁשָּׁה אָלֶף
  choice: elfu ishirini na sita
  rationale: Huu ndio mpangilio wa kawaida wa namba hiyo katika Kiswahili Sanifu.
