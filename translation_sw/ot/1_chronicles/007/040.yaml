  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Istilahi za ukoo na jeshi zimetolewa kwa uwazi bila kupoteza tabia ya orodha ya kihistoria.
