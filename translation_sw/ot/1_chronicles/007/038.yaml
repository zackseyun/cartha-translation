  text: 'And the sons of Jether: Jephunneh[a], Pispa, and Ara.'
translation:
  language: sw
  text: Na wana wa Yetheri walikuwa Yefune, Pispa[a], na Ara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili linaweza pia kuandikwa “Pispah,” kwa kufuata zaidi herufi ya mwisho ya Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Na wana wa
  rationale: Huhifadhi muundo wa kawaida wa nasaba katika Kiebrania; kiunganishi וּ kimetafsiriwa “Na” kuendeleza orodha.
- source_word: יֶתֶר
  choice: Yetheri
  rationale: Jina la mtu limenukuliwa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, huku sauti ya konsonanti ya Kiebrania ת iliyo hapa bila dageshi ikiwakilishwa kwa “th.”
- source_word: יְפֻנֶּה
  choice: Yefune
  rationale: Jina limenukuliwa badala ya kutafsiriwa, kwa tahajia ya Kiswahili inayokaribia matamshi ya Kiebrania.
- source_word: וּפִסְפָּה
  choice: Pispa
  rationale: Kiunganishi kimewakilishwa katika orodha, na jina limenukuliwa kama “Pispa”; he ya mwisho katika tahajia ya Kiebrania haisikiki kwa kawaida.
- source_word: וַאְרָא
  choice: na Ara
  rationale: Limetambuliwa kama jina la mtu lenye kiunganishi cha orodha; “Ara” huhifadhi umbo la jina kwa Kiswahili.
