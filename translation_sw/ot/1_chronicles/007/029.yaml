  text: וְ/עַל יְדֵ֣י בְנֵי מְנַשֶּׁ֗ה בֵּית שְׁאָ֤ן וּ/בְנֹתֶ֨י/הָ֙ תַּעְנַ֣ךְ וּ/בְנֹתֶ֔י/הָ מְגִדּ֥וֹ וּ/בְנוֹתֶ֖י/הָ דּ֣וֹר וּ/בְנוֹתֶ֑י/הָ בְּ/אֵ֨לֶּה֙ יָשְׁב֔וּ בְּנֵ֥י יוֹסֵ֖ף בֶּן יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/029.yaml
  text: And along the borders of the sons of Manasseh were Beth-shean and its daughter towns[a], Taanach and its daughter towns, Megiddo and its daughter towns, Dor and its daughter towns[b]. In these lived the sons of Joseph son of Israel.
translation:
  language: sw
  text: Kando ya wana wa Manase[b] kulikuwa na Beth-sheani na miji iliyoitegemea[a], Taanaki na miji iliyoitegemea, Megido na miji iliyoitegemea, na Dori na miji iliyoitegemea. Katika maeneo hayo waliishi wana wa Yosefu, mwana wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vijiji vyake.” Kiebrania kinasema kihalisi “binti zake,” usemi wa kawaida kwa makazi madogo yaliyouzunguka na kuutegemea mji mkuu.
    reason: lexical_alternative
  - marker: b
    text: Au, “upande wa wana wa Manase.” Nahau ya Kiebrania hapa inaweza kutafsiriwa kwa namna hiyo iliyo karibu zaidi na maneno yake, lakini katika muktadha huu inaonyesha ukaribu wa maeneo au mpaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יְדֵי
  choice: Kando ya eneo la
  rationale: Nahau hii katika orodha ya maeneo huonyesha ukaribu wa kijiografia au mpaka, si maana halisi ya ‘mikono.’ Tafsiri hii ni ya kawaida katika Kiswahili na bado inaacha uwezekano wa kuelewa kuwa maeneo hayo yalipakana.
- source_word: בְנֵי מְנַשֶּׁה
  choice: wana wa Manase
  rationale: Lugha ya ukoo imehifadhiwa kwa sababu muktadha wa nasaba na maeneo hutumia ‘wana wa’ kumaanisha wazao au kabila la Manase.
- source_word: בֵּית שְׁאָן
  choice: Beth-sheani
  rationale: Hili ni umbo la jina la mahali linaloeleweka katika mapokeo ya majina ya Biblia kwa Kiswahili na linalowakilisha matamshi ya Kiebrania.
- source_word: וּבְנֹתֶיהָ / וּבְנוֹתֶיהָ
  choice: na miji iliyoitegemea
  rationale: Neno la Kiebrania linalomaanisha kihalisi ‘binti zake’ hutumiwa kwa makazi madogo yaliyokuwa chini ya mji mkuu. Kiswahili hiki kinaeleza uhusiano huo kwa uwazi bila kulazimisha sitiari isiyo ya kawaida.
- source_word: תַּעְנַךְ
  choice: Taanaki
  rationale: Utohozi wa jina la mahali unaofaa matamshi na tahajia ya Kiswahili.
- source_word: מְגִדּוֹ
  choice: Megido
  rationale: Utohozi wa kawaida wa jina hili katika Kiswahili.
- source_word: דּוֹר
  choice: Dori
  rationale: Utohozi wa jina la mahali unaolingana na muundo wa majina ya Biblia katika Kiswahili.
- source_word: בְאֵלֶּה
  choice: Katika maeneo hayo
  rationale: Kirai kinarejelea miji na makazi yote yaliyotajwa. ‘Maeneo hayo’ ni wazi zaidi katika Kiswahili kuliko ‘hayo’ pekee.
- source_word: יָשְׁבוּ
  choice: waliishi
  rationale: Kitenzi kinaonyesha kukaa au kuishi mahali; ‘waliishi’ ni lugha ya sasa na ya kawaida bila kudokeza lazima hatua ya kwanza ya kuyamiliki maeneo hayo.
- source_word: בְּנֵי יוֹסֵף
  choice: wana wa Yosefu
  rationale: Usemi wa ukoo umehifadhiwa, huku ukiruhusu maana ya wazao wa Yosefu katika muktadha wa kikabila.
- source_word: בֶּן יִשְׂרָאֵל
  choice: mwana wa Israeli
  rationale: Utambulisho wa Yosefu kuwa mwana wa Israeli umehifadhiwa moja kwa moja na kwa mtiririko wa kawaida wa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Majina ya maeneo yametoholewa kwa maumbo yanayofaa Kiswahili. Usemi wa ukoo ‘wana wa’ umehifadhiwa, lakini istilahi ya makazi tegemezi imefafanuliwa kwa lugha ya kawaida.
