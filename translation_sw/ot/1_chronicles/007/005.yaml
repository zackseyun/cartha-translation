lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Nao ndugu zao
  rationale: Neno אָח kimsingi ni ‘ndugu,’ lakini katika muktadha wa nasaba linaweza kuwahusu pia watu wa ukoo mpana; tafsiri kuu inadumisha nahau ya Kiebrania huku tanbihi ikieleza upana wake.
- source_word: לְכֹל מִשְׁפְּחוֹת יִשָׂשכָר
  choice: katika jamaa zote za Isakari
  rationale: Kirai hiki kinaonyesha wigo unaohusisha migawanyo yote ya kijamaa ya kabila la Isakari. ‘Katika jamaa zote’ ni Kiswahili cha kawaida na wazi.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: mashujaa hodari
  rationale: Kirai hiki cha kawaida humaanisha wanaume wenye nguvu na uwezo wa kivita. ‘Mashujaa hodari’ kinafikisha maana hiyo kwa lugha ya sasa bila kuwa kizito.
- source_word: שְׁמוֹנִים וְשִׁבְעָה אֶלֶף
  choice: elfu themanini na saba
  rationale: Hii ndiyo idadi ya moja kwa moja, 87,000, iliyoandikwa kwa maneno katika nathari ya Biblia.
- source_word: הִתְיַחְשָׂם
  choice: walioandikishwa katika nasaba
  rationale: Hitpaeli ya יחשׂ hurejelea kuingizwa au kuhesabiwa katika kumbukumbu za nasaba. ‘Walioandikishwa katika nasaba’ inaeleza kwa uwazi maana ya kiutawala na kinasaba.
- source_word: לַכֹּל
  choice: Wote ... walikuwa
  rationale: Kirai hiki kinajumlisha idadi yote. Muundo wa Kiswahili ‘Wote ... walikuwa’ unaunganisha kwa kawaida jumla hiyo na walioandikishwa.
