base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/010.yaml
  text: 'And the sons of Jediael: Bilhan. And the sons of Bilhan: Jeush[a], Benjamin, Ehud, Chenaanah, Zethan, Tarshish, and Ahishahar.'
translation:
  language: sw
  text: 'Na wana wa Yediaeli: Bilhani. Na wana wa Bilhani: Yeushi[a], Benyamini, Ehudi, Kenaana, Zethani, Tarshishi, na Ahishahari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Umbo la Kiebrania la jina la mwana wa kwanza si la kawaida (יעיש). Jina “Yeushi” limetoholewa kwa kufuata jina la mtu ambalo huenda lilikusudiwa katika nasaba hii; maumbo mengine yanayowezekana ni “Yaaishi” au “Yaishi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Na wana wa
  rationale: Katika nasaba, בֵּן inaweza kumaanisha wana wa moja kwa moja au wazao; muundo huu unawasilisha orodha ya kizazi cha karibu, kwa hiyo “wana wa” ni sahihi na ya kawaida.
- source_word: יְדִיעֲאֵל
  choice: Yediaeli
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: בִּלְהָן
  choice: Bilhani
  rationale: Jina la mtu limetoholewa moja kwa moja, huku irabu ya mwisho ikisaidia matamshi ya kawaida ya Kiswahili.
- source_word: וּבְנֵי בִלְהָן
  choice: 'Na wana wa Bilhani:'
  rationale: Marudio ya fomula ya nasaba yamehifadhiwa ili kudumisha uwazi na mdundo wa Kiebrania.
- source_word: יעיש
  choice: Yeushi
  rationale: Umbo la Kiebrania si la kawaida; “Yeushi” linafuata jina linalowezekana kukusudiwa katika nasaba hii, huku hali hiyo ikielezwa katika tanbihi.
- source_word: וּבִנְיָמִן
  choice: Benyamini
  rationale: Jina limetoholewa kwa umbo linalotambulika katika Kiswahili cha Biblia.
- source_word: וְאֵהוּד
  choice: Ehudi
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida na rahisi kutamkwa kwa Kiswahili.
- source_word: וּכְנַעֲנָה
  choice: Kenaana
  rationale: Hapa ni jina la mtu, si jina la nchi au watu wa Kanaani; umbo hili linatofautisha matumizi hayo huku likifuata konsonanti za Kiebrania.
- source_word: וְזֵיתָן
  choice: Zethani
  rationale: Jina limetoholewa kwa karibu na umbo la Kiebrania na kurekebishwa kwa matamshi ya Kiswahili.
- source_word: וְתַרְשִׁישׁ
  choice: Tarshishi
  rationale: Muktadha wa nasaba unaonyesha kuwa hili ni jina la mtu, ingawa neno hilo linaweza kutaja mahali katika vifungu vingine.
- source_word: וַאֲחִישָׁחַר
  choice: Ahishahari
  rationale: Jina limetoholewa kutoka Kiebrania bila kulinganisha kwa lazima na majina mengine yanayofanana.
