base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/002.yaml
  text: 'The sons of Tola: Uzzi[a], Rephaiah, Jeriel, Jahmai, Ibsam, and Samuel, heads of their fathers’ houses belonging to Tola, mighty men of valor according to their generations[c][b]. Their number in the days of David was twenty-two thousand six hundred.'
translation:
  language: sw
  text: Wana wa Tola walikuwa Uzi, Refaya, Yerieli, Yamai, Ibsamu na Samweli. Hao walikuwa wakuu[a] wa jamaa za baba zao katika ukoo wa Tola, mashujaa hodari[b], kwa kufuata nasaba zao[c]. Katika siku za Daudi, idadi yao ilikuwa elfu ishirini na mbili na mia sita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viongozi.”
    reason: lexical_alternative
  - marker: b
    text: Kirai hiki kinaweza pia kutafsiriwa “mashujaa wa vita” au “watu mashujaa.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa vizazi vyao” au “katika orodha zao za nasaba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי תוֹלָע
  choice: Wana wa Tola
  rationale: Katika orodha hii ya nasaba, בְּנֵי ina maana ya moja kwa moja ya ‘wana’; kiunganishi cha mwanzo hakihitaji kutafsiriwa ili Kiswahili kisomeke kwa kawaida.
- source_word: רָאשִׁים
  choice: wakuu
  rationale: Neno hili linamaanisha viongozi au wakuu wa vikundi vya kifamilia; ‘wakuu’ ni la kawaida na linahifadhi wazo la mamlaka.
- source_word: לְבֵית אֲבוֹתָם
  choice: wa jamaa za baba zao
  rationale: בֵּית אָבוֹת ni kitengo cha ukoo au jamaa kinachotokana na mababu. Tafsiri hii ni ya kueleweka katika Kiswahili bila kulazimisha nahau ya Kiebrania ‘nyumba za baba’.
- source_word: לְתוֹלָע
  choice: katika ukoo wa Tola
  rationale: Kirai hiki kinaonyesha kuwa wakuu hao walihusishwa na tawi la Tola; ‘katika ukoo wa Tola’ huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: גִּבּוֹרֵי חַיִל
  choice: mashujaa hodari
  rationale: Kirai hiki cha kawaida kinaweza kudokeza ushujaa wa kivita na uwezo; ‘mashujaa hodari’ kinahifadhi nguvu na mwelekeo wake wa kijeshi.
- source_word: לְתֹלְדוֹתָם
  choice: kwa kufuata nasaba zao
  rationale: Katika muktadha huu תּוֹלְדוֹת hurejelea mpangilio wa ukoo au orodha za vizazi; ‘nasaba zao’ huonyesha maana hiyo wazi.
- source_word: מִסְפָּרָם בִּימֵי דָוִיד
  choice: Katika siku za Daudi, idadi yao ilikuwa
  rationale: Muundo huu wa Kiswahili unahifadhi wakati unaotajwa na taarifa ya jumla ya hesabu.
