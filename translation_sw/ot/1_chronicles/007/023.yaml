base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/023.yaml
  text: Then he went in to his wife[a], and she conceived and bore a son, and he called his name Beriah[c][b], because disaster had been in his house.
translation:
  language: sw
  text: Kisha akalala na mke wake, naye akapata mimba, akazaa mwana. Akamwita Beria,[a] kwa sababu msiba ulikuwa katika nyumba yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Beria linafanana kwa sauti na usemi wa Kiebrania unaomaanisha “katika msiba.”
    reason: wordplay
  - marker: b
    text: Au “katika familia yake.” Neno “nyumba” hapa linaweza kumaanisha watu wa familia yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל אִשְׁתּוֹ
  choice: akalala na mke wake
  rationale: Nahau ya Kiebrania בוא אל ikitumiwa kuhusu mke humaanisha kujamiiana. Kiswahili ‘kulala na’ ni tafsida ya kawaida, ya heshima na inayoeleweka wazi.
- source_word: וַתַּהַר
  choice: akapata mimba
  rationale: Hii ni kauli ya kawaida na ya asili katika Kiswahili kwa tendo la kushika mimba.
- source_word: וַתֵּלֶד בֵּן
  choice: akazaa mwana
  rationale: Inafuata kwa ufupi mtiririko wa simulizi la Kiebrania na ni Kiswahili cha kawaida.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ בְּרִיעָה
  choice: akamwita Beria
  rationale: Ni uwasilishaji wa asili wa fomula ya Kiebrania ya kumpa mtoto jina; jina limetoholewa kwa tahajia ya Kiswahili.
- source_word: בְּרִיעָה
  choice: Beria
  rationale: Jina la mtu limetoholewa kwa namna inayosomeka kwa urahisi katika Kiswahili.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaonyesha sababu iliyohusishwa na kumpa mtoto jina hilo.
- source_word: בְרָעָה
  choice: msiba
  rationale: Katika muktadha huu רָעָה ni janga au taabu iliyoipata familia, si uovu wa kimaadili. ‘Msiba’ pia huendana na vifo vya wana wa Efraimu katika muktadha uliotangulia.
- source_word: הָיְתָה בְּבֵיתוֹ
  choice: ulikuwa katika nyumba yake
  rationale: Huhifadhi kwa karibu muundo wa Kiebrania bila kuongeza dhana ya ‘kuja juu ya’; ‘nyumba’ hapa inaweza kumaanisha pia familia au jamaa ya nyumbani.
