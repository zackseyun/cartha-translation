translation:
  language: sw
  text: 'Wana wa Yafleti: Pasaki[a], Bimhali, na Ashwathi. Hawa ndio wana wa Yafleti.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Pasahi”; majina ya Kiebrania yanaweza kutoholewa kwa namna tofauti.
    reason: lexical_alternative
  - marker: b
    text: Au “Hawa ni wana wa Yafleti.” Kauli ya Kiebrania ni fomula ya muhtasari wa orodha ya ukoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי
  choice: wana wa
  rationale: Katika orodha hii ya ukoo, neno hili linataja wana wa kiume wa Yafleti moja kwa moja; “wana wa” ni Kiswahili cha kawaida na hudumisha muundo wa Kiebrania.
- source_word: יַפְלֵט
  choice: Yafleti
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili, huku sauti kuu za jina la Kiebrania zikihifadhiwa.
- source_word: פָּסַךְ
  choice: Pasaki
  rationale: Jina limetoholewa kwa mfumo wa sauti wa Kiswahili; konsonanti ya mwisho ya Kiebrania imewakilishwa kwa “k,” na irabu ya mwisho imeongezwa ili jina litamkike kwa kawaida.
- source_word: וּבִמְהָל
  choice: Bimhali
  rationale: Kiunganishi וּ kimetafsiriwa katika mfululizo wa majina, na jina lenyewe limetoholewa kuwa “Bimhali” kwa matamshi ya kawaida ya Kiswahili.
- source_word: וְעַשְׁוָת
  choice: na Ashvathi
  rationale: Kiunganishi וְ kimetafsiriwa “na”; jina limetoholewa kwa namna inayohifadhi mpangilio wa konsonanti wa Kiebrania na kulifanya litamkike kwa Kiswahili.
- source_word: אֵלֶּה בְּנֵי יַפְלֵט
  choice: Hao ndio wana wa Yafleti
  rationale: Hii inadumisha kauli ya muhtasari inayorudia utambulisho wa wana hao. Muundo wa Kiswahili wenye “ndio” hauhitaji kulazimisha wakati uliopo au uliopita.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi na wenye hadhi unaofaa orodha ya ukoo. Kurudiwa kwa “wana wa Yafleti” kumehifadhiwa kama katika Kiebrania. “Walikuwa” katika sentensi ya kwanza hufanya orodha isomeke kwa kawaida, huku “Hao ndio” ikihifadhi kutobainishwa kwa wakati katika kauli ya mwisho.
