  text: 'The sons of Ulla: Arah[a], Hanniel[d][c][b], and Rizia.'
translation:
  language: sw
  text: 'Nao wana wa Ula: Ara, Hanieli, na Rizia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Nao wana wa
  rationale: וּ huendeleza orodha ya nasaba, na בְנֵי ni wingi wa muundo tegemezi unaomaanisha ‘wana wa’. ‘Nao wana wa’ ni mtiririko wa kawaida wa Kiswahili katika orodha kama hii.
- source_word: עֻלָּא
  choice: Ula
  rationale: Jina la mtu limetoholewa kwa herufi za Kiswahili; konsonanti maradufu ya Kiebrania haihitaji kuandikwa mara mbili katika tahajia ya kawaida ya Kiswahili.
- source_word: אָרַח
  choice: Ara
  rationale: Jina la mtu limetoholewa kulingana na sauti za Kiebrania na tahajia ya Kiswahili; herufi ya mwisho ח haijawakilishwa kwa ‘h’ kwa kuwa sauti hiyo haitamkiki kiasili katika Kiswahili.
- source_word: חַנִּיאֵל
  choice: Hanieli
  rationale: Jina la mtu limetoholewa kwa mfumo wa sauti wa Kiswahili; sehemu ya mwisho אֵל imewakilishwa kwa ‘eli’, na konsonanti maradufu haijahifadhiwa katika tahajia.
- source_word: רִצְיָא
  choice: Rizia
  rationale: Jina limetoholewa moja kwa moja kwa tahajia ya Kiswahili, huku ‘z’ ikiwakilisha צ katika desturi ya majina ya Biblia.
