  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah, and Serah their sister.'
translation:
  language: sw
  text: 'Wana wa Asheri: Imna[a], Ishva, Ishvi, na Beria; na Sera, dada yao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tahajia za majina haya hutofautiana katika mapokeo ya tafsiri: Imna pia huandikwa Jimna, Ishva huandikwa Ishua, na Ishvi huandikwa Ishui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa hali ya kuunganisha wa neno ‘wana.’ Hapa orodha inataja watoto wa moja kwa moja, hivyo ‘Wana wa’ ni sahihi kuliko ‘Wazao wa.’
- source_word: אָשֵׁר
  choice: Asheri
  rationale: Jina la mtu na kabila limetoholewa kwa umbo linalotambulika katika Kiswahili.
- source_word: יִמְנָה
  choice: Imna
  rationale: Jina limetoholewa moja kwa moja kutoka matamshi ya Kiebrania ya Kimasora.
- source_word: יִשְׁוָה
  choice: Ishva
  rationale: Tahajia hii hufuata matamshi ya Kiebrania katika aya hii na kuhifadhi konsonanti v.
- source_word: יִשְׁוִי
  choice: Ishvi
  rationale: Jina limetoholewa kwa kufuata matamshi ya Kimasora.
- source_word: בְרִיעָה
  choice: Beria
  rationale: Jina limetoholewa kwa mfumo wa kawaida na unaosomeka kiasili katika Kiswahili.
- source_word: שֶׂרַח
  choice: Sera
  rationale: Jina limetoholewa kutoka Kiebrania na kutofautishwa na jina lingine la Kiebrania, Sara.
- source_word: אֲחוֹתָם
  choice: dada yao
  rationale: Kiambishi cha nafsi ya tatu wingi wa kiume humtambulisha Sera kuwa dada wa ndugu wote waliotajwa.
