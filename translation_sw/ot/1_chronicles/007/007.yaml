base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/007.yaml
  text: 'And the sons of Bela: Ezbon[a], Uzzi, Uzziel, Jerimoth, and Iri—five heads of fathers’ houses, mighty men of valor; and their genealogical enrollment was twenty-two thousand and thirty-four.'
translation:
  language: sw
  text: 'Wana wa Bela: Esboni, Uzi, Uzieli, Yerimothi na Iri. Hawa watano walikuwa wakuu wa jamaa za baba zao na mashujaa hodari. Idadi ya walioandikishwa kwa nasaba zao[a] ilikuwa elfu ishirini na mbili na thelathini na wanne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nasaba yao” au “kuandikishwa kwao kulingana na nasaba.” Neno la Kiebrania linahusu kuingizwa katika kumbukumbu za nasaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי בֶלַע
  choice: Wana wa Bela
  rationale: Neno בני kimsingi ni ‘wana wa’; katika muktadha huu linaanzisha orodha ya wanaume waliotajwa kwa majina.
- source_word: אֶצְבּוֹן וְעֻזִּי וְעֻזִּיאֵל וִירִימוֹת וְעִירִי
  choice: Esboni, Uzi, Uzieli, Yerimothi na Iri
  rationale: Majina yametoholewa kwa tahajia na matamshi yanayofaa Kiswahili huku yakifuata kwa karibu maumbo ya Kiebrania.
- source_word: חֲמִשָּׁה רָאשֵׁי בֵּית אָבוֹת
  choice: Hao watano walikuwa wakuu wa jamaa za baba zao
  rationale: ‘Hao watano’ linaonyesha wazi kwamba namba inawahusu watu waliotajwa. ‘Jamaa za baba zao’ linawasilisha muundo wa kijamii na unasaba unaomaanishwa na בית אבות bila kutumia tafsiri ngumu isiyo ya kawaida ya ‘nyumba za baba’.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: mashujaa hodari
  rationale: Kirai hiki humaanisha wanaume wenye nguvu, ujasiri au uwezo wa kivita; ‘mashujaa hodari’ ni cha asili na chenye hadhi katika Kiswahili.
- source_word: וְהִתְיַחְשָׂם
  choice: Idadi yao katika orodha ya nasaba
  rationale: Kitenzi יחס katika Hitpaeli katika Mambo ya Nyakati hurejelea kuandikishwa au kuorodheshwa kwa msingi wa nasaba. Tafsiri hii inaonyesha kwamba namba inayofuata ni idadi ya walioandikwa katika kumbukumbu hizo.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף וּשְׁלֹשִׁים וְאַרְבָּעָה
  choice: elfu ishirini na mbili na thelathini na wanne
  rationale: Hii inawakilisha kwa maneno jumla ya 22,034 kama ilivyo katika muundo wa namba wa Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa urahisi. Sentensi ndefu ya Kiebrania imegawanywa ili orodha, nafasi ya watu hao na jumla yao zisomwe kwa uwazi. Alama ya tanbihi imewekwa kwenye ‘orodha ya nasaba,’ ambako maelezo yake yanahusika; kuwekwa kwake baada ya jina Esboni katika tabaka la Kiingereza hakuendani na maudhui ya tanbihi.
