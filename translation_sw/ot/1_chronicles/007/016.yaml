base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/016.yaml
  text: Maacah the wife of Machir bore a son[a], and she called his name Peresh; and the name of his brother was Sheresh[b], and his sons were Ulam and Rakem.
translation:
  language: sw
  text: Maaka, mke wa Makiri, akazaa mwana, akamwita Pereshi.[a] Jina la ndugu yake wa kiume lilikuwa Shereshi, na wanawe[b] walikuwa Ulamu na Rekemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata maneno ya Kiebrania kwa karibu zaidi: “akaliita jina lake Pereshi.”'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania husema “wanawe,” yaani wana wa kiume, wala si neno pana zaidi la watoto.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: akazaa
  rationale: Katika taarifa ya ukoo, kitenzi hiki kwa kawaida humaanisha kuzaa mtoto; ‘akazaa’ ni kifupi, cha asili, na kinafuata mtiririko wa simulizi la Kiebrania.
- source_word: אֵשֶׁת מָכִיר
  choice: mke wa Makiri
  rationale: Muundo huu unamtambulisha Maaka kwa uhusiano wake na Makiri na kuhifadhi mtindo rasmi wa taarifa ya ukoo.
- source_word: בֵּן
  choice: mwana
  rationale: Neno la Kiebrania ni la umoja na humtaja mtoto wa kiume kabla ya jina lake kutolewa.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: akamwita
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kueleza kumpa mtu jina, huku maana ya nahau ya Kiebrania, ‘akaliita jina lake,’ ikihifadhiwa bila tafsiri ngumu isiyo ya kawaida.
- source_word: פֶּרֶשׁ
  choice: Pereshi
  rationale: Jina la mtu limetoholewa kwa mfumo wa sauti unaosomeka kwa kawaida katika Kiswahili.
- source_word: וְשֵׁם אָחִיו
  choice: Ndugu yake wa kiume aliitwa
  rationale: ‘Ndugu yake wa kiume’ huonyesha wazi jinsia iliyomo katika אָחִיו, kwa kuwa ‘ndugu’ peke yake katika Kiswahili inaweza kuwa wa kiume au wa kike.
- source_word: שָׁרֶשׁ
  choice: Shereshi
  rationale: Jina la mtu limetoholewa kwa Kiswahili.
- source_word: וּבָנָיו
  choice: na wanawe
  rationale: ‘Wanawe’ linafaa kwa taarifa ya ukoo na katika muktadha huu hurejelea wana wa kiume; kiambishi cha umilikaji pia kinaacha wazi kiasi fulani rejeleo la kiwakilishi kama lilivyo katika Kiebrania.
- source_word: אוּלָם
  choice: Ulamu
  rationale: Jina la mtu limetoholewa kwa Kiswahili.
- source_word: וָרָקֶם
  choice: na Rekemu
  rationale: Jina רֶקֶם limetoholewa kuwa ‘Rekemu,’ na kiunganishi cha Kiebrania kimewakilishwa kwa ‘na.’
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi na wenye hadhi unaofaa orodha ya ukoo. Majina yametoholewa kwa maumbo yanayosomeka kwa urahisi katika Kiswahili. Tafsiri imeepuka kufanya rejeleo la ‘wanawe’ kuwa wazi kuliko Kiebrania chenyewe.
