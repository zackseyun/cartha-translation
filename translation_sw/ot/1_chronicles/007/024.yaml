base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/024.yaml
  text: His daughter was Sheerah[a], and she built Lower Beth-horon and Upper Beth-horon[b], and Uzzen-sheerah.
translation:
  language: sw
  text: Binti yake alikuwa Sheera,[a] naye akajenga Beth-horoni ya Chini na Beth-horoni ya Juu,[b] na Uzeni-sheera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na binti yake, Sheera”; kiunganishi cha Kiebrania kinaweza kutafsiriwa moja kwa moja zaidi kwa namna hii.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “na ile ya juu”; jina “Beth-horoni” linaeleweka kutokana na fungu lililotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִתּוֹ
  choice: Binti yake alikuwa
  rationale: Kiebrania kinasema kihalisi ‘na binti yake.’ Katika mtiririko wa nasaba, ‘Binti yake alikuwa’ ni Kiswahili cha kawaida kinachotambulisha jina la binti bila kubadili uhusiano wa kifamilia.
- source_word: שֶׁאֱרָה
  choice: Sheera
  rationale: Jina la mtu limetoholewa kwa matamshi yanayofaa Kiswahili badala ya kutafsiriwa maana yake.
- source_word: וַתִּבֶן
  choice: naye akajenga
  rationale: Kitenzi בנה kwa kawaida humaanisha ‘kujenga.’ Tafsiri hii haiongezi dhana isiyothibitishwa ya kuanzisha, kuimarisha, au kujenga upya miji hiyo.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: Beth-horoni ya Chini
  rationale: Jina la mahali limetoholewa kama ‘Beth-horoni,’ na kivumishi ‘ya Chini’ kinatofautisha mji huu na ule wa juu kwa Kiswahili cha kawaida.
- source_word: הָעֶלְיוֹן
  choice: Beth-horoni ya Juu
  rationale: Ingawa Kiebrania kinasema tu ‘ile ya juu,’ jina Beth-horoni limerudiwa ili rejeo liwe wazi na la kawaida kwa msomaji wa Kiswahili.
- source_word: אֻזֵּן שֶׁאֱרָה
  choice: Uzeni-sheera
  rationale: Hili ni jina la mahali lenye sehemu mbili; kistari kinaonyesha kwamba ni jina moja la mahali, si vitu viwili tofauti.
