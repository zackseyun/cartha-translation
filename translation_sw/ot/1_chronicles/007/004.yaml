source:
  edition: WLC
  text: וַ/עֲלֵי/הֶ֨ם לְ/תֹלְדוֹתָ֜/ם לְ/בֵ֣ית אֲבוֹתָ֗/ם גְּדוּדֵי֙ צְבָ֣א מִלְחָמָ֔ה שְׁלֹשִׁ֥ים וְ/שִׁשָּׁ֖ה אָ֑לֶף כִּֽי הִרְבּ֥וּ נָשִׁ֖ים וּ/בָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/004.yaml
  text: And with them, by their generations, according to their fathers' houses, were 36,000 troops for the army of war, for they had many wives and sons.
translation:
  language: sw
  text: Nao, kwa nasaba zao na kwa koo za baba zao, walikuwa na vikosi 36,000 vya jeshi kwa ajili ya vita,[a] kwa sababu walikuwa na wake[b] na wana wengi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai cha Kiebrania kinaweza pia kutafsiriwa, “vikosi vya kijeshi kwa ajili ya mapigano.”
    reason: lexical_alternative
  - marker: b
    text: Au “wanawake”; neno la Kiebrania נָשִׁים linaweza kuwa na maana yoyote kati ya hizo mbili, lakini “wake” linafaa zaidi katika muktadha huu wa nasaba na familia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲלֵיהֶם
  choice: Nao ... walikuwa na
  rationale: Katika muktadha huu wa orodha, עַל yenye kiambishi inataja waliokuwa pamoja nao au waliohusishwa nao; muundo huu ni wa asili zaidi katika Kiswahili kuliko tafsiri ya mahali kama ‘juu yao’.
- source_word: לְתֹלְדוֹתָם
  choice: kwa nasaba zao
  rationale: תּוֹלְדוֹת hapa inahusu migawanyo ya kizazi au ukoo; ‘nasaba’ inaonyesha upangaji wa kikoo katika sensa.
- source_word: לְבֵית אֲבוֹתָם
  choice: kwa koo za baba zao
  rationale: Kirai hiki cha kawaida cha kikabila kinamaanisha jamaa au nyumba za ukoo wa upande wa baba. ‘Koo za baba zao’ kinaeleweka katika Kiswahili cha sasa bila kufuta muundo huo wa kijamii.
- source_word: גְּדוּדֵי צְבָא מִלְחָמָה
  choice: vikosi vya jeshi kwa ajili ya vita
  rationale: Tafsiri hii inadumisha msongamano wa istilahi za kijeshi—vikosi, jeshi, na vita—lakini inasikika kwa kawaida katika Kiswahili.
- source_word: שְׁלֹשִׁים וְשִׁשָּׁה אָלֶף
  choice: 36,000
  rationale: Namba ya tarakimu inawasilisha idadi kamili kwa uwazi kwa msomaji wa kisasa.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya idadi kubwa iliyotajwa.
- source_word: הִרְבּוּ
  choice: walikuwa na ... wengi
  rationale: Hifili ya רבה ina maana ya kufanya kuwa wengi au kuzidisha; pamoja na wake na wana, Kiswahili cha kawaida husema ‘walikuwa na ... wengi’.
- source_word: נָשִׁים
  choice: wake
  rationale: Ingawa neno hili linaweza kumaanisha ‘wanawake,’ kuunganishwa kwake na ‘wana’ katika muktadha wa nasaba na familia kunaunga mkono maana ya ‘wake’.
- source_word: וּבָנִים
  choice: na wana wengi
  rationale: בָּנִים humaanisha kihalisi ‘wana’; maana hiyo imehifadhiwa badala ya kuipanua kuwa ‘watoto’.
theological_decisions: []
