base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/019.yaml
  text: The sons of Shemida were Ahian[a], Shechem, Likhi, and Aniam.
translation:
  language: sw
  text: Wana wa Shemida walikuwa Ahiani,[a] Shekemu, Likhi na Aniamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wazao wa Shemida.” Katika nasaba, “wana” wakati mwingine linaweza kumaanisha wazao wa kiume kwa upana, ingawa muktadha wa karibu hapa unaunga mkono “wana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: walikuwa
  rationale: Katika orodha ya nasaba, kitenzi hiki kinatambulisha kwa njia ya kawaida majina ya wana waliotajwa; “walikuwa” ni Kiswahili cha asili kinachohifadhi muundo huo.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Neno hili linaweza kumaanisha wazao kwa upana katika nasaba, lakini hapa majina ya wanaume yanayofuata yanaunga mkono maana ya moja kwa moja “wana wa.”
- source_word: שְׁמִידָע
  choice: Shemida
  rationale: Jina limenukuliwa kwa mwandiko unaosomeka kwa kawaida katika Kiswahili huku likibaki karibu na matamshi ya Kiebrania.
- source_word: אַחְיָן
  choice: Ahiani
  rationale: Jina limetoholewa kwa mfumo wa sauti wa Kiswahili, kwa kuongeza irabu ya mwisho ili lisomeke kwa urahisi.
- source_word: שֶׁכֶם
  choice: Shekemu
  rationale: Hapa ni jina la mtu katika nasaba; limetoholewa kwa umbo la Kiswahili badala ya kutafsiriwa.
- source_word: לִקְחִי
  choice: Likhi
  rationale: Herufi ya Kiebrania ח imewakilishwa kwa “kh,” na jina limehifadhiwa bila kutafsiriwa.
- source_word: אֲנִיעָם
  choice: Aniamu
  rationale: Jina limetoholewa kwa namna inayokaribia matamshi ya Kiebrania na kufuata muundo wa sauti wa Kiswahili.
