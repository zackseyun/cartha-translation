base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/015.yaml
  text: 'And with you in abundance are workers for the task: stonecutters[a], and craftsmen of stone and wood, and every skilled man for every kind of work.'
translation:
  language: sw
  text: 'Na uko na wafanyakazi wengi: wakataji wa mawe, mafundi wa mawe na mbao, na kila mtu mwenye ustadi katika kila aina ya kazi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia umoja wa kiume, kwa maana ya neno kwa neno, “kila mwenye ustadi”; umbo hilo hapa linawakilisha wafanyakazi wenye ustadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמְּךָ לָרֹב
  choice: Na pamoja nawe kuna ... wengi
  rationale: Muundo huu unahifadhi usemi wa moja kwa moja kwa Sulemani na unaeleza kwa Kiswahili cha kawaida kwamba wafanyakazi hao wako kwake kwa wingi.
- source_word: עֹשֵׂי מְלָאכָה
  choice: wafanyakazi ... wa kufanya kazi hiyo
  rationale: Kirai hiki kinawataja watu wanaotekeleza kazi ya ujenzi iliyozungumziwa; “hiyo” huunganisha mstari huu na muktadha bila kurudia maneno kwa njia nzito.
- source_word: חֹצְבִים
  choice: wachonga mawe
  rationale: Katika muktadha wa ujenzi, kitenzi hiki kinawahusu watu wanaokata au kuchonga mawe; kitu kinachochongwa kinaeleweka kutokana na maneno yanayofuata.
- source_word: וְחָרָשֵׁי אֶבֶן וָעֵץ
  choice: mafundi wa mawe na mbao
  rationale: חָרָשׁ humaanisha fundi mwenye ujuzi. “Mafundi wa mawe na mbao” ni usemi wa asili na unaohifadhi fani zote mbili.
- source_word: וְכָל חָכָם
  choice: na kila mtu mwenye ustadi
  rationale: Katika muktadha huu חָכָם hueleza ustadi wa kazi, si hekima ya jumla. “Mtu mwenye ustadi” hudumisha umoja wa Kiebrania huku ikibeba maana yake ya uwakilishi.
- source_word: בְּכָל מְלָאכָה
  choice: katika kila aina ya kazi
  rationale: Hueleza ustadi unaohitajika katika aina zote za kazi za mradi; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Lugha ya kijinsia katika חָכָם
  choice: kila mtu mwenye ustadi
  alternative: kila mwanamume mwenye ustadi; kila fundi stadi
  rationale: Neno la Kiebrania ni umoja wa kiume kisarufi lakini limetumika kwa maana ya uwakilishi katika orodha ya wafanyakazi. Kiswahili “mtu” huhifadhi rejeleo la mtu mmoja bila kuongeza dai kwamba ni wanaume pekee, huku tanbihi ikieleza umbo la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Msamiati wa ufundi umewekwa wazi kwa wasomaji wa kawaida, na mpangilio wa orodha ya Kiebrania umehifadhiwa.
