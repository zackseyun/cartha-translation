base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/003.yaml
  text: And David prepared iron in abundance for the nails for the doors of the gates and for the fastenings[b][a], and bronze in abundance without weight.
translation:
  language: sw
  text: Daudi akaandaa chuma kwa wingi kwa ajili ya misumari ya milango ya malango na kwa ajili ya viungio[a], na shaba kwa wingi, kiasi kisichoweza kupimwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bawaba”; neno la Kiebrania lina maana pana ya vifaa vya kuunganisha.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “hapakuwa na kipimo cha uzito,” yaani, ilikuwa nyingi mno kuweza kupimwa.'
    reason: idiom_clarification
lexical_decisions:
- source_word: בַרְזֶל
  choice: chuma
  rationale: Neno hili hutaja chuma kama nyenzo; “chuma” ndilo neno la kawaida na sahihi katika muktadha wa ujenzi.
- source_word: לָרֹב
  choice: kwa wingi
  rationale: Kirai hiki huonyesha kiasi kikubwa; “kwa wingi” ni Kiswahili cha kawaida na kinafaa kwa orodha ya vifaa.
- source_word: מִּסְמְרִים
  choice: misumari
  rationale: Katika muktadha wa milango, neno hili linaeleweka kwa kawaida kama misumari bila kulifanya mahususi zaidi kuwa vigingi vikubwa.
- source_word: דַלְתוֹת הַשְּׁעָרִים
  choice: milango ya malango
  rationale: Tafsiri hii inahifadhi tofauti kati ya vibao au milango inayofunga na malango yenyewe, huku ikibaki wazi katika Kiswahili.
- source_word: מְחַבְּרוֹת
  choice: viungio
  rationale: Neno la Kiebrania lina maana pana ya vipande vinavyounganisha; “viungio” huhifadhi upana huo bila kuamua kwamba vilikuwa bawaba.
- source_word: הֵכִין
  choice: akaandaa
  rationale: Kitenzi kinamaanisha kutayarisha au kuweka tayari; “akaandaa” kinafaa kwa ukusanyaji wa vifaa vya ujenzi.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: “Shaba” ni neno la kawaida la Kiswahili katika orodha za metali za kibiblia na linaweza kutumika kwa metali hii katika muktadha wa kale.
- source_word: אֵין מִשְׁקָל
  choice: kiasi kisichoweza kupimwa
  rationale: Nahau hii huonyesha kwamba shaba ilikuwa nyingi mno kuweza kupimwa; tafsiri hii huwasilisha maana hiyo badala ya kudokeza kwamba haikuwa na uzito halisi.
