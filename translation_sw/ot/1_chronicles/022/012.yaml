base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/012.yaml
  text: Only[a], may Yahweh give you insight and understanding, and command you concerning Israel[b], that you may keep the law of Yahweh your God.
translation:
  language: sw
  text: Zaidi ya yote, Yahwe akupe busara na ufahamu, na akukabidhi mamlaka juu ya Israeli[a], ili uishike sheria[b] ya Yahwe Mungu wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akuamuru kuhusu Israeli,” au “akukabidhi jukumu la Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mafundisho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Zaidi ya yote
  rationale: Katika muktadha huu chembe hii inatilia mkazo jambo kuu katika ombi la Daudi; usemi huu ni wa asili katika Kiswahili kuliko tafsiri ya neno kwa neno kama ‘ila tu’.
- source_word: יִתֶּן
  choice: akupe
  rationale: 'Ingawa ni kitenzi cha hali isiyotimilika, hapa kina nguvu ya ombi au baraka: ‘Yahwe akupe.’'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina la agano lililoandikwa moja kwa moja katika Kiebrania.
- source_word: שֵׂכֶל
  choice: busara
  rationale: Neno hili linaashiria akili ya vitendo na uamuzi mwema; ‘busara’ linatofautishwa kwa kawaida na ‘ufahamu.’
- source_word: בִינָה
  choice: ufahamu
  rationale: Linaonyesha uwezo wa kuelewa na kupambanua, huku likihifadhi jozi ya maneno mawili ya Kiebrania.
- source_word: וִיצַוְּךָ עַל יִשְׂרָאֵל
  choice: akukabidhi mamlaka juu ya Israeli
  rationale: צוה pamoja na עַל katika muktadha wa kifalme inaweza kumaanisha kumpa mtu jukumu au mamlaka juu ya watu; tanbihi inahifadhi maana mbadala ya kuamuru kuhusu Israeli.
- source_word: וְלִשְׁמוֹר
  choice: ili uishike
  rationale: Kitenzi-jina chenye kiunganishi hapa kinaeleza kusudi; ‘ili’ huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: תּוֹרַת
  choice: sheria
  rationale: Katika muktadha wa agano ‘sheria’ ni wazi na inayotambulika, ingawa neno la Kiebrania linaweza pia kumaanisha ‘mafundisho.’
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Ni tafsiri ya moja kwa moja ya jina lenye kiambishi cha nafsi ya pili umoja, likimrejelea Solomoni.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina la Mungu la herufi nne moja kwa moja; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya וִיצַוְּךָ עַל יִשְׂרָאֵל katika muktadha wa kifalme
  choice: akukabidhi mamlaka juu ya Israeli
  alternative: akuamuru kuhusu Israeli
  rationale: Muundo unaweza kuonyesha kukabidhiwa jukumu la kuwatawala watu, lakini maana ya kawaida ya צוה, ‘kuamuru,’ ni halisi pia; hivyo mbadala umehifadhiwa katika tanbihi bila kuondoa utata wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Zaidi ya yote’ huleta mkazo wa אַךְ kwa njia ya asili; ‘busara na ufahamu’ huhifadhi jozi ya maneno bila kuyafanya yafanane kabisa.
