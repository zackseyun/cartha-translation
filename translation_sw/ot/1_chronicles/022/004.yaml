translation:
  language: sw
  text: na mbao za mierezi zisizohesabika[a], kwa maana Wasidoni na watu wa Tiro walikuwa wamemletea Daudi mbao nyingi sana za mierezi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miti ya mierezi.” Neno la Kiebrania linaweza kumaanisha miti au mbao zake; katika muktadha huu wa ujenzi, yaelekea linamaanisha mbao za ujenzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲצֵי אֲרָזִים
  choice: na mbao za mierezi
  rationale: Katika muktadha wa vifaa vya ujenzi, עֲצֵי אֲרָזִים inaelekea kumaanisha miti iliyotayarishwa kama mbao, si miti iliyosimama. “Mbao za mierezi” ni Kiswahili cha kawaida na huhifadhi maana ya nyenzo za ujenzi.
- source_word: לְ/אֵין מִסְפָּר
  choice: zisizohesabika
  rationale: Nahau hii inaonyesha wingi usioweza kuhesabiwa. “Zisizohesabika” ni ya asili na yenye hadhi katika Kiswahili.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inaanzisha sababu inayoeleza jinsi mbao hizo zilivyopatikana kwa wingi.
- source_word: הֵבִיאוּ
  choice: walikuwa wamemletea
  rationale: Kitenzi cha Hiphil perfect kina maana ya “walileta.” Muundo huu wa Kiswahili unaonyesha tendo lililotangulia hali inayosimuliwa na pia huweka wazi Daudi kama mpokeaji.
- source_word: הַ/צִּידֹנִים
  choice: Wasidoni
  rationale: Ni jina la watu wa Sidoni; “Wasidoni” ni umbo fupi na la kawaida la Kiswahili.
- source_word: וְ/הַ/צֹּרִים
  choice: na Watiro
  rationale: Ni jina la watu wa Tiro; “Watiro” linaoana kwa mtindo na “Wasidoni.”
- source_word: לָ/רֹב
  choice: nyingi sana
  rationale: Kirai hiki huonyesha kiasi kikubwa. “Nyingi sana” ni cha kawaida na wazi kwa wasomaji wa kisasa.
- source_word: לְ/דָוִד
  choice: wamemletea Daudi
  rationale: לְ humtambulisha Daudi kuwa mpokeaji. Kiambishi -m- pamoja na “Daudi” hutoa Kiswahili cha asili bila kubadili maana.
