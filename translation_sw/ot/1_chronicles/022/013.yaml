  edition: WLC
  text: אָ֣ז תַּצְלִ֔יחַ אִם תִּשְׁמ֗וֹר לַ/עֲשׂוֹת֙ אֶת הַֽ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה עַל יִשְׂרָאֵ֑ל חֲזַ֣ק וֶ/אֱמָ֔ץ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/013.yaml
  text: Then you will prosper[a], if you are careful to do the statutes and the judgments that Yahweh commanded Moses for Israel. Be strong and courageous. Do not fear[b], and do not be dismayed.
translation:
  language: sw
  text: Ndipo utafanikiwa[a], ikiwa utakuwa mwangalifu kuzifanya sheria na hukumu ambazo Yahwe alimwamuru Musa kwa ajili ya Israeli. Uwe hodari na jasiri. Usiogope wala usivunjike moyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utastawi.” Kitenzi cha Kiebrania kinaweza kumaanisha kufanikiwa au kustawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Huonyesha matokeo yanayofuata masharti na mawaidha yaliyotangulia.
- source_word: תַּצְלִיחַ
  choice: utafanikiwa
  rationale: Hifili ya צלח inaweza kumaanisha kufanikiwa au kustawi; hapa ‘utafanikiwa’ ni ya kawaida na inafaa kwa utekelezaji wa kazi aliyopewa Sulemani.
- source_word: אִם תִּשְׁמֹר לַעֲשׂוֹת
  choice: ikiwa utakuwa mwangalifu kuzifanya
  rationale: Muundo huu unaunganisha wazo la kutunza kwa makini na kutenda, hivyo unaonyesha uangalifu pamoja na utiifu.
- source_word: הַחֻקִּים
  choice: sheria
  rationale: Neno hili hurejelea masharti yaliyowekwa; ‘sheria’ ni neno la kawaida na lenye heshima katika Kiswahili.
- source_word: הַמִּשְׁפָּטִים
  choice: hukumu
  rationale: Huhifadhi maana ya kisheria na kimahakama na kulitofautisha neno hili na חֻקִּים.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה עַל יִשְׂרָאֵל
  choice: ambazo Yahwe alimwamuru Musa kwa ajili ya Israeli
  rationale: Muundo wa Kiebrania unamtaja Musa kama aliyeamriwa, huku עַל ikionyesha kuwa maagizo hayo yalihusu au yalikusudiwa Israeli.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa jina la agano יהוה.
- source_word: חֲזַק וֶאֱמָץ
  choice: Uwe hodari na jasiri
  rationale: Hii ni kauli ya kuhimiza uthabiti na ujasiri; tafsiri hii ni ya asili na yenye nguvu katika Kiswahili.
- source_word: אַל תִּירָא
  choice: Usiogope
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya katazo hili.
- source_word: וְאַל תֵּחָת
  choice: wala usivunjike moyo
  rationale: Neno חתת katika muktadha huu huonyesha kuvunjwa moyo, kufadhaishwa, au kukatishwa tamaa; usemi huu ni wazi kwa wasomaji wa sasa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa Musa na maagizo
  choice: Yahwe alimwamuru Musa kwa ajili ya Israeli
  alternative: Yahwe aliamuru kupitia Musa kwa ajili ya Israeli
  rationale: Alama ya kisarufi אֶת inamtaja Musa kuwa mtendewa wa moja kwa moja wa kitenzi ‘aliamuru.’ Tafsiri haibadili hilo kuwa dai kwamba Musa ndiye njia tu ya utoaji wa maagizo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa urahisi. Maneno mawili ya kisheria ya Kiebrania yametofautishwa kama ‘sheria’ na ‘hukumu’; jozi ya makatazo imewasilishwa kwa mtiririko wa kawaida: ‘Usiogope wala usivunjike moyo.’'
