  to: Naye Daudi akasema, “Mwanangu Sulemani ni kijana na hana uzoefu[a], na nyumba itakayojengwa kwa ajili ya Yahweh lazima ijengwe kwa ukubwa mkubwa mno, ili iwe na sifa na fahari katika nchi zote[b][c]. Basi nitafanya maandalizi kwa ajili yake.” Kwa hiyo Daudi akafanya maandalizi mengi sana kabla ya kufa kwake.
