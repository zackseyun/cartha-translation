language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֗יד שְׁלֹמֹ֣ה בְנִ/י֮ נַ֣עַר וָ/רָךְ֒ וְ/הַ/בַּ֜יִת לִ/בְנ֣וֹת לַ/יהוָ֗ה לְ/הַגְדִּ֨יל לְ/מַ֜עְלָ/ה לְ/שֵׁ֤ם וּ/לְ/תִפְאֶ֨רֶת֙ לְ/כָל הָ֣/אֲרָצ֔וֹת אָכִ֥ינָה נָּ֖א ל֑/וֹ וַ/יָּ֧כֶן דָּוִ֛יד לָ/רֹ֖ב לִ/פְנֵ֥י מוֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/005.yaml
  text: And David said[a], “My son Solomon is young and inexperienced, and the house to be built for Yahweh must be made exceedingly great in fame and splendor in all lands[c][b]. I will now make preparation for it.” So David made abundant preparations before his death.
translation:
  language: sw
  text: Naye Daudi akasema, “Mwanangu Sulemani ni kijana na hana uzoefu[a], na nyumba itakayojengwa kwa ajili ya Yahweh lazima ijengwe kwa ukubwa mkubwa mno, ili iwe na sifa na fahari katika nchi zote[b][c]. Basi nitafanya maandalizi kwa ajili yake.” Kwa hiyo Daudi akafanya maandalizi mengi sana kabla ya kufa kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni kijana na mwororo.” Neno la Kiebrania linaweza kumaanisha ulaini au wororo; hapa huenda linaonyesha kutokomaa au kutokuwa na uzoefu.
    reason: lexical_alternative
  - marker: b
    text: 'Au, “hekalu.” Kiebrania: “nyumba.”'
    reason: lexical_alternative
  - marker: c
    text: Au, “ili iwe na jina na utukufu katika nchi zote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר וָרָךְ
  choice: ni kijana na hana uzoefu
  rationale: נַעַר inaonyesha ujana wa Sulemani, huku רַךְ, kihalisi ‘mwororo/laini,’ katika muktadha huu ikidokeza kutokomaa au kutokuwa na uzoefu wa kutosha kwa kazi hiyo.
- source_word: הַבַּיִת
  choice: nyumba
  rationale: Neno la Kiebrania ni ‘nyumba.’ Kulihifadhi huendeleza taswira ya nyumba ya Yahweh bila kuingiza mapema neno la kifafanuzi ‘hekalu.’
- source_word: לַיהוָה
  choice: kwa ajili ya Yahweh
  rationale: Jina la agano יהוה limetafsiriwa kwa kulinakili kama ‘Yahweh.’
- source_word: לְהַגְדִּיל לְמַעְלָה
  choice: lazima iwe kubwa mno
  rationale: Muundo huu unasisitiza ukubwa wa hali ya juu; Kiswahili ‘kubwa mno’ ni cha asili na huhifadhi nguvu ya usemi.
- source_word: לְשֵׁם וּלְתִפְאֶרֶת
  choice: yenye sifa na fahari
  rationale: ‘Sifa’ huwasilisha wazo la jina au umaarufu, na ‘fahari’ huwasilisha utukufu na uzuri wa kuvutia.
- source_word: לְכָל הָאֲרָצוֹת
  choice: katika nchi zote
  rationale: Wingi wa אֶרֶץ hapa unaelekea kwa nchi au maeneo mbalimbali ambako sifa ya nyumba hiyo ingejulikana.
- source_word: אָכִינָה נָּא לוֹ
  choice: Basi nitaiandalia
  rationale: Kitenzi cha hiari kinaonyesha azimio la Daudi. Kiambishi ‘-i-’ kinarejelea nyumba au mradi wake, huku ‘basi’ kikitoa mfuatano wa uamuzi kwa Kiswahili cha asili.
- source_word: וַיָּכֶן דָּוִיד לָרֹב
  choice: Daudi akaandaa vitu vingi sana kwa ajili yake
  rationale: לָרֹב huonyesha wingi mkubwa wa maandalizi; kuongeza ‘vitu’ kunafanya sentensi iwe wazi na ya kawaida kwa Kiswahili bila kubainisha vitu ambavyo chanzo hakuvitaji.
- source_word: לִפְנֵי מוֹתוֹ
  choice: kabla ya kufa kwake
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya usemi wa wakati.
theological_decisions:
- issue: Uwakilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu, hivyo ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Kutafsiri הַבַּיִת
  choice: nyumba
  alternative: hekalu
  rationale: ‘Nyumba’ hufuata neno halisi la chanzo na huhifadhi mwangwi wake wa kitheolojia; muktadha unaonyesha kuwa ni mahali patakatifu pa Yahweh.
- issue: Uhusiano wa לְשֵׁם וּלְתִפְאֶרֶת na ukubwa wa nyumba
  choice: yenye sifa na fahari katika nchi zote
  alternative: ili iwe na jina na utukufu katika nchi zote
  rationale: Muundo uliochaguliwa ni wa asili kwa Kiswahili na unaendeleza uhusiano wa kusudi au matokeo bila kudai kwa ukali zaidi ya Kiebrania.
- issue: Kirejeleo cha לוֹ katika אָכִינָה נָּא לוֹ
  choice: nyumba au mradi wake
  alternative: Sulemani
  rationale: Muktadha wa karibu unaelekeza kwenye nyumba na maandalizi ya ujenzi, lakini umbo la Kiebrania lenyewe ni la kiume na linaweza kisarufi kuhusishwa pia na Sulemani; tafsiri kuu hufuata kirejeleo kinachowezekana zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Hana uzoefu’ linafafanua maana ya kimuktadha ya רַךְ; tanbihi huhifadhi maana yake halisi zaidi. Alama zote za tanbihi [a], [b], na [c] zimewekwa katika matini kuu.
