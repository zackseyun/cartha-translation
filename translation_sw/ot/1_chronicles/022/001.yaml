source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔יד זֶ֣ה ה֔וּא בֵּ֖ית יְהוָ֣ה הָ/אֱלֹהִ֑ים וְ/זֶה מִּזְבֵּ֥חַ לְ/עֹלָ֖ה לְ/יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/001.yaml
  text: Then David said[a], “This is the house of Yahweh God[b], and this is the altar for burnt offering for Israel.”
translation:
  language: sw
  text: Ndipo Daudi akasema, “Hii ndiyo nyumba[a] ya Yahweh Mungu, na hii ndiyo madhabahu ya sadaka ya kuteketezwa[b] kwa ajili ya Israeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “hekalu.” Kiebrania: “nyumba.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “sadaka za kuteketezwa.” Umoja wa Kiebrania unaweza kueleweka kwa maana ya jumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Muundo wa waw-consecutive unaendeleza simulizi; “Ndipo ... akasema” huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: דָּוִיד
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hilo katika Kiswahili.
- source_word: זֶה הוּא
  choice: Hii ndiyo
  rationale: Kiashiria pamoja na kiwakilishi husisitiza utambulisho wa kitu kinachoonyeshwa; “Hii ndiyo” huhifadhi msisitizo huo bila kuongeza neno kama “mahali.”
- source_word: בֵּית
  choice: nyumba
  rationale: Neno la Kiebrania humaanisha kihalisi “nyumba.” Ingawa muktadha unahusu mahali pa hekalu la baadaye, “nyumba” huhifadhi tamathali na mwangwi wa kitheolojia wa chanzo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Neno hili linafuata jina Yahweh kwa uhusiano wa ufafanuzi, hivyo “Yahweh Mungu” ni tafsiri ya moja kwa moja na ya asili.
- source_word: מִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ni neno la kawaida la Kiswahili kwa jengo au sehemu iliyotengwa kwa kutolea dhabihu.
- source_word: לְעֹלָה
  choice: ya sadaka ya kuteketezwa
  rationale: עֹלָה ni dhabihu inayoteketezwa; umoja wa Kiebrania unaweza kutumiwa kwa maana ya jumla. Usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: לְיִשְׂרָאֵל
  choice: kwa ajili ya Israeli
  rationale: Kirai hiki huonyesha uhusiano au kusudi kwa Israeli; “kwa ajili ya Israeli” huwasilisha maana hiyo bila kuongeza maelezo yasiyokuwapo katika chanzo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Iwapo בֵּית יְהוָה הָאֱלֹהִים itafsiriwe kama “nyumba” au “hekalu”
  choice: nyumba ya Yahweh Mungu
  alternative: hekalu la Yahweh Mungu
  rationale: Ingawa muktadha unahusu mahali ambapo hekalu litajengwa, maandishi yenyewe yanasema “nyumba.” Tafsiri hiyo huhifadhi lugha ya chanzo bila kutanguliza ufafanuzi wa kiusanifu.
- issue: Umoja wa עֹלָה
  choice: sadaka ya kuteketezwa, kwa maana ya jumla
  alternative: sadaka za kuteketezwa
  rationale: Nomino ya umoja inaweza kuwa ya kijumla na kurejelea aina nzima ya dhabihu; tafsiri ya umoja huhifadhi umbo la chanzo huku tanbihi ikitaja uwezekano wa maana ya wingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na hadhi inayofaa maandiko. “Hii ndiyo” huhifadhi msisitizo wa Kiebrania; “nyumba” huhifadhi lugha halisi ya chanzo huku tanbihi ikitoa “hekalu” kama ufafanuzi unaowezekana.
