base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/006.yaml
  text: Then he called for Solomon his son and commanded him to build a house for Yahweh[a], the God of Israel.
translation:
  language: sw
  text: Kisha Daudi akamwita mwanawe Sulemani, akamwagiza amjengee Yahwe, Mungu wa Israeli, nyumba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu.” Kiebrania kinasema kihalisi “nyumba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לִשְׁלֹמֹה בְנוֹ
  choice: Kisha Daudi akamwita mwanawe Sulemani
  rationale: Kitenzi קרא pamoja na ל humaanisha kumwita au kumwagiza mtu aje. Kiunganishi cha usimulizi kimetafsiriwa “Kisha.” Jina “Daudi” limewekwa wazi kutokana na muktadha ili Kiswahili kiwe cha kawaida na kuepuka kiwakilishi kisicho na rejeleo katika mstari huu wa pekee.
- source_word: וַיְצַוֵּהוּ
  choice: akamwagiza
  rationale: צוה hubeba maana ya kumpa mtu agizo lenye mamlaka. “Akamwagiza” ni ya asili katika Kiswahili na huhifadhi nguvu hiyo bila kutumia lugha nzito kupita kiasi.
- source_word: לִבְנוֹת
  choice: amjengee
  rationale: 'Infinitivu בנה inaeleza jambo aliloagizwa kufanya. Muundo wa Kiswahili “amjengee” unaonyesha pia maana ya לַיהוָה: nyumba ijengwe kwa ajili ya Yahwe.'
- source_word: בַּיִת
  choice: nyumba
  rationale: בית kwa maana ya msingi ni “nyumba.” Katika muktadha huu inarejelea hekalu, lakini “nyumba” huhifadhi tamathali na msamiati halisi wa Kiebrania.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kuwa “Yahwe.” Maana ya kihusishi ל imewasilishwa katika umbo la kitendo “amjengee,” yaani kujenga kwa ajili yake.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huu ni muundo wa umilikaji unaomtambulisha Yahwe kuwa Mungu wa Israeli; “Mungu wa Israeli” ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, יהוה. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Maana ya בית katika muktadha wa ibada
  choice: nyumba
  alternative: hekalu
  rationale: Ingawa jengo linalokusudiwa ni hekalu, Kiebrania chenyewe kinasema “nyumba.” Tafsiri kuu inadumisha neno hilo, huku tanbihi ikifafanua maana ya kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio umefanywa kuwa wa kawaida katika Kiswahili huku ukihifadhi mfuatano wa simulizi na neno “nyumba” la Kiebrania.
