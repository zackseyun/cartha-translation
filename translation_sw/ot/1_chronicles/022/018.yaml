source:
  edition: WLC
  text: הֲ/לֹ֨א יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ עִמָּ/כֶ֔ם וְ/הֵנִ֥יחַ לָ/כֶ֖ם מִ/סָּבִ֑יב כִּ֣י נָתַ֣ן בְּ/יָדִ֗/י אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נִכְבְּשָׁ֥ה הָ/אָ֛רֶץ לִ/פְנֵ֥י יְהוָ֖ה וְ/לִ/פְנֵ֥י עַמּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/018.yaml
  text: Is not Yahweh your God with you? And has he not given you rest on every side? For he has given the inhabitants of the land into my hand[a], and the land has been subdued before Yahweh and before his people.
translation:
  language: sw
  text: Je, Yahweh Mungu wenu hayuko pamoja nanyi? Je, hajawapa pumziko pande zote? Kwa maana amewatia wenyeji wa nchi mkononi mwangu, nayo nchi imetiishwa mbele ya Yahweh na mbele ya watu wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiwakilishi umilikishi -ake katika “watu wake” huenda kinamrejelea Yahweh, kama ilivyofasiriwa hapa, au Daudi. “Mbele ya” pia inaweza kutafsiriwa “machoni pa.”
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... hayuko ...? Je, haja...?
  rationale: Kipashio hiki kinaanzisha swali la balagha linalotarajia jibu la kukubali. Muundo wa ‘Je’ unahifadhi nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Kiebrania limeandikwa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Katika muungano wake na Yahweh na katika muktadha wa Israeli, umbo hili linamtaja Mungu mmoja, si miungu mingi.
- source_word: עִמָּכֶם
  choice: pamoja nanyi
  rationale: Hueleza kuwapo kwa Mungu pamoja nao na kuwasaidia; hii ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וְהֵנִיחַ לָכֶם מִסָּבִיב
  choice: hajawapa pumziko pande zote
  rationale: Kitenzi kinaeleza kupewa pumziko au utulivu kutokana na maadui wanaowazunguka. ‘Pande zote’ huwasilisha מִסָּבִיב kwa ufasaha.
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha sababu inayothibitisha maswali ya balagha yaliyotangulia.
- source_word: נָתַן בְּיָדִי
  choice: amewatia ... mkononi mwangu
  rationale: Inahifadhi sitiari ya Kiebrania ya kuwakabidhi watu chini ya mamlaka ya mtu, huku ikieleweka kwa Kiswahili.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: wenyeji wa nchi
  rationale: Ni usemi wa kawaida unaowataja wale wanaokaa katika nchi hiyo.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: nayo nchi imetiishwa
  rationale: Kauli tendwa ya כבש huonyesha nchi kuletwa chini ya mamlaka; wakati timilifu unaonyesha tendo lililokamilika lenye matokeo yanayoendelea.
- source_word: לִפְנֵי יְהוָה וְלִפְנֵי עַמּוֹ
  choice: mbele za Yahweh na mbele za watu wake
  rationale: ‘Mbele za’ huhifadhi urudiaji na usambamba wa Kiebrania, ikidokeza uwepo, mamlaka, au mtazamo bila kuubana usemi kwa maana moja tu.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Chanzo kinatumia Tetragramatoni yenyewe; ‘Yahweh’ hulihifadhi kama jina binafsi la Mungu badala ya kulibadilisha kuwa cheo.
- issue: Kirejelewa cha kiwakilishi katika עַמּוֹ (‘watu wake’)
  choice: Kimeachwa katika maandishi kama ‘watu wake,’ huku tanbihi ikieleza uwezekano
  alternative: Kukitaja wazi kuwa ‘watu wa Yahweh’ au ‘watu wa Daudi’
  rationale: Yahweh ndiye kirejelewa kinachowezekana zaidi katika kifungu cha karibu, lakini umbo la Kiebrania linaweza pia kueleweka likimrejelea Daudi. Kutotaja jina badala ya kiwakilishi kunahifadhi mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maswali ya balagha yamehifadhiwa, na sitiari ya ‘mkononi mwangu’ imeachwa kwa kuwa inaeleweka na kuhifadhi taswira ya chanzo.
