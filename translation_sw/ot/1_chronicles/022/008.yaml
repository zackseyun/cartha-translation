  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֨י עָלַ֤/י דְּבַר יְהוָה֙ לֵ/אמֹ֔ר דָּ֤ם לָ/רֹב֙ שָׁפַ֔כְתָּ וּ/מִלְחָמ֥וֹת גְּדֹל֖וֹת עָשִׂ֑יתָ לֹֽא תִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י כִּ֚י דָּמִ֣ים רַבִּ֔ים שָׁפַ֥כְתָּ אַ֖רְצָ/ה לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/008.yaml
  text: But the word of Yahweh came to me[a], saying, ‘You have shed much blood and fought great wars. You shall not build a house for my name[d][c][b], because you have shed much blood on the earth before me.’
translation:
  language: sw
  text: Lakini neno la Yahweh likanijia, likisema, “Umemwaga damu nyingi[a] na umepigana vita vikubwa[b]. Hutajenga nyumba kwa ajili ya jina langu[c], kwa sababu umemwaga damu nyingi ardhini[d] mbele zangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “damu kwa wingi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuendesha vita vikubwa.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, hekalu; Kiebrania ni “nyumba kwa ajili ya jina langu.”
    reason: cultural_note
  - marker: d
    text: Au, “mpaka chini”; pia inaweza kueleweka “katika nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: neno la Yahweh
  rationale: Huhifadhi kauli ya kinabii ya Kiebrania na kulitaja jina la agano יְהוָה moja kwa moja kama ‘Yahweh.’
- source_word: וַיְהִי עָלַי
  choice: likanijia
  rationale: Hii ni tafsiri ya kawaida na ya asili ya nahau inayosema kwamba neno la Mungu lilimfikia msemaji.
- source_word: דָּם לָרֹב
  choice: damu nyingi
  rationale: Huhifadhi taswira halisi ya damu pamoja na wazo la wingi bila kuibadili kuwa nomino dhahania ya ‘mauaji.’
- source_word: וּמִלְחָמוֹת גְּדֹלוֹת עָשִׂיתָ
  choice: na kupigana vita vikubwa
  rationale: Kitenzi עשה ni ‘kufanya,’ lakini pamoja na ‘vita’ Kiswahili cha kawaida husema ‘kupigana vita’; maana ya shughuli kubwa za kijeshi inabaki wazi.
- source_word: לֹא תִבְנֶה בַיִת לִשְׁמִי
  choice: Hutajenga nyumba kwa ajili ya jina langu
  rationale: ‘Nyumba’ huhifadhi sitiari ya Kiebrania na uhusiano wake na hekalu, huku ‘kwa ajili ya jina langu’ ikihifadhi lugha muhimu ya agano badala ya kuirahisisha kuwa ‘kwa ajili yangu.’
- source_word: דָּמִים רַבִּים
  choice: damu nyingi
  rationale: Ingawa wingi דָּמִים unaweza kumaanisha umwagaji damu au hatia ya damu, tafsiri hii huhifadhi taswira halisi na marudio ya kifungu cha kwanza.
- source_word: אַרְצָה
  choice: ardhini
  rationale: Umbo lenye mwelekeo linaweza kumaanisha kuelekea au juu ya ardhi; ‘ardhini’ ni la asili katika muktadha wa kumwaga damu na halipanui maana bila lazima.
- source_word: לְפָנַי
  choice: mbele zangu
  rationale: Huhifadhi usemi wa Kiebrania na uzito wa kitheolojia kwamba umwagaji damu ulitendeka Mungu akiuona.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la agano יְהוָה; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Kama בַיִת itafsiriwe ‘nyumba’ au ‘hekalu’
  choice: nyumba
  alternative: hekalu
  rationale: Ingawa kinachorejelewa ni hekalu, Kiebrania kinasema ‘nyumba.’ Kulihifadhi neno hilo kunadumisha dhamira ya nyumba ya Mungu bila kufasiri kupita maandishi.
- issue: Maana ya דָּמִים katika sababu iliyotolewa kwa Daudi
  choice: damu nyingi
  alternative: umwagaji damu mwingi au hatia nyingi ya damu
  rationale: Muktadha unahusisha vita vya Daudi, lakini maandishi hayafafanui hapa kwa neno la dhahania kama ni umwagaji damu tu au pia hatia; taswira ya damu imehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ni ya moja kwa moja na inaeleweka kwa wasomaji wa kawaida. ‘Likanijia’ na ‘ardhini’ ni nahau za asili; lugha ya chanzo ‘nyumba kwa ajili ya jina langu’ imehifadhiwa kwa sababu ya umuhimu wake wa kifasihi na kitheolojia.
