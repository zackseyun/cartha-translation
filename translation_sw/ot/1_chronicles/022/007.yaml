base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/007.yaml
  text: And David said to Solomon his son[a], “As for me[b], it was in my heart to build a house for the name of Yahweh my God.”
translation:
  language: sw
  text: Daudi akamwambia Sulemani mwanawe, “Mimi nilikuwa nimekusudia moyoni mwangu[a] kujenga nyumba[b] kwa ajili ya jina la Yahwe, Mungu wangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo hilo lilikuwa moyoni mwangu.” Nahau ya Kiebrania inaeleza nia au azimio la ndani la Daudi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kujenga hekalu.” Kiebrania kwa maana ya moja kwa moja ni “kujenga nyumba” kwa ajili ya jina la Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Kiambishi cha usimulizi wa Kiebrania kinaendeleza simulizi; ‘akamwambia’ ni mtiririko wa kawaida na wa asili katika Kiswahili.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: Sulemani mwanawe
  rationale: Huhifadhi mpangilio na maana ya Kiebrania huku ikiwa ya asili katika Kiswahili.
- source_word: אֲנִי
  choice: Kwa habari yangu
  rationale: Kiwakilishi kilichotajwa wazi kina mkazo; usemi huu unaonyesha mkazo huo bila kuongeza maana mpya.
- source_word: הָיָה עִם לְבָבִי
  choice: nilikuwa nimekusudia moyoni mwangu
  rationale: Nahau hii inaeleza nia au azimio la ndani. Tafsiri hii ni wazi katika Kiswahili na bado inadumisha taswira ya moyo.
- source_word: לִבְנוֹת בַּיִת
  choice: kujenga nyumba
  rationale: בַּיִת maana yake ya moja kwa moja ni ‘nyumba.’ Ingawa hapa inarejelea hekalu, ‘nyumba’ inadumisha msamiati wa chanzo.
- source_word: לְשֵׁם
  choice: kwa ajili ya jina la
  rationale: Huhifadhi usemi wa kitheolojia unaohusu jengo lililowekwa wakfu kwa jina la Mungu badala ya kuufupisha kuwa ‘kwa ajili ya.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa kwa namna ya kulitamka kwa Kiswahili, badala ya kubadilishwa na cheo kama ‘BWANA.’
- source_word: אֱלֹהָי
  choice: Mungu wangu
  rationale: Kiambishi cha nafsi ya kwanza umoja ni wazi katika Kiebrania na kinadumishwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Chanzo kinatumia moja kwa moja jina la Mungu la herufi nne. ‘Yahwe’ huhifadhi jina binafsi badala ya kulibadilisha na cheo.
- issue: Iwapo בַּיִת itafsiriwe ‘nyumba’ au ‘hekalu’
  choice: nyumba
  alternative: hekalu
  rationale: Kiebrania kinasema ‘nyumba.’ Muktadha unaonyesha kwamba ni hekalu, lakini kudumisha ‘nyumba’ kunahifadhi usemi wa chanzo na mvutano wake wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku taswira ya ‘moyo,’ neno ‘nyumba,’ na usemi ‘kwa ajili ya jina la’ vikidumishwa kwa ukaribu na chanzo.
