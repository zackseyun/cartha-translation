lexical_decisions:
- source_word: וַיְצַו
  choice: Kisha ... akawaamuru
  rationale: Kitenzi hiki kinaendeleza masimulizi na kuonyesha agizo lenye mamlaka. “Kisha” huwasilisha kwa Kiswahili cha kawaida mfuatano unaodokezwa na muundo wa Kiebrania.
- source_word: שָׂרֵי
  choice: viongozi
  rationale: Neno hili humaanisha watu wenye mamlaka ya utawala au uongozi. “Viongozi” ni neno la sasa, pana, na haliongezi cheo maalumu kisichotajwa katika chanzo.
- source_word: לְכָל שָׂרֵי יִשְׂרָאֵל
  choice: viongozi wote wa Israeli
  rationale: Tafsiri hii inadumisha maana jumuishi ya “wote” na uhusiano wao na Israeli bila kufafanua kupita kiasi nyadhifa zao.
- source_word: לַעְזֹר
  choice: wamsaidie
  rationale: Kitenzi עזר humaanisha kusaidia. Muundo wa “wamsaidie” ni wa asili katika Kiswahili baada ya “akawaamuru” na unaonyesha wazi anayesaidiwa.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: mwanawe Sulemani
  rationale: Muundo huu wa Kiswahili unasomeka kwa kawaida, unamtambulisha Sulemani kuwa mwana wa Daudi, na kuhifadhi msisitizo wa uhusiano huo.
