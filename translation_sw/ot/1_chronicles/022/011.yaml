base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/011.yaml
  text: Now[a], my son, may Yahweh be with you, and may you prosper and build the house of Yahweh your God[c][b], as he has spoken concerning you.
translation:
  language: sw
  text: Sasa, mwanangu, Yahwe na awe pamoja nawe; nawe ufanikiwe[a], na ujenge nyumba[b] ya Yahwe Mungu wako, kama alivyosema kuhusu wewe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ustawi”; kitenzi cha Kiebrania kinaweza kumaanisha kufanikiwa au kustawi.
    reason: lexical_alternative
  - marker: b
    text: Au, “hekalu la Yahwe Mungu wako.” Kiebrania kinasema moja kwa moja, “nyumba ya Yahwe Mungu wako.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kama alivyoahidi kuhusu wewe.” Kiebrania kinasema moja kwa moja, “kama alivyosema kuhusu wewe.”
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: Sasa
  rationale: Ni kiashiria cha wakati kinachoanzisha baraka na himizo la Daudi; “Sasa” ni la kawaida na la moja kwa moja katika Kiswahili.
- source_word: בְנִי
  choice: mwanangu
  rationale: Huhifadhi mwito wa moja kwa moja na sauti ya upendo wa baba kwa mwanawe.
- source_word: יְהִי יְהוָה עִמָּךְ
  choice: Yahwe na awe pamoja nawe
  rationale: Kitenzi cha hali ya kutakia kinaonyesha baraka au ombi, si taarifa ya kawaida kuhusu wakati ujao. “Na awe” huwasilisha nguvu hiyo kwa Kiswahili cha asili.
- source_word: וְהִצְלַחְתָּ
  choice: nawe ufanikiwe
  rationale: Hiphil ya צלח inaweza kumaanisha kufanikiwa au kustawi. “Ufanikiwe” inaendana na kazi ya kujenga bila kuifanya baraka hii ihusu mali pekee.
- source_word: וּבָנִיתָ
  choice: na kuijenga
  rationale: Huunganisha ujenzi na baraka/tarajio lililoanzishwa na “na awe” na “ufanikiwe,” bila kugeuza mfuatano huo kuwa taarifa kavu ya wakati ujao.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: nyumba ya Yahwe Mungu wako
  rationale: “Nyumba” huhifadhi tamathali halisi ya Kiebrania na maana yake ya kitheolojia; “hekalu” ni ufafanuzi unaowezekana lakini ulio finyu zaidi.
- source_word: כַּאֲשֶׁר דִּבֶּר עָלֶיךָ
  choice: kama alivyosema kuhusu wewe
  rationale: Huhifadhi maana ya kusema juu ya au kuhusu mtu bila kuamua kimyakimya kwamba kauli hiyo lazima itafsiriwe kuwa ahadi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina binafsi la Mungu katika Tetragramatoni badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia Tetragramatoni moja kwa moja; “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya mfuatano wa vitenzi katika maneno ya Daudi kwa Sulemani
  choice: 'Baraka au takwa: “na awe ... ufanikiwe ... na kuijenga”'
  alternative: 'Utabiri: “atakuwa ... utafanikiwa na kuijenga”'
  rationale: יְהִי ni hali ya kutakia, hivyo mfuatano mzima unasomwa kwa kawaida kama baraka yenye matarajio ya kutimizwa, ingawa maumbo yanayofuata yanaweza pia kusikika kama matokeo yanayotarajiwa.
- issue: Maana ya “nyumba ya Yahwe”
  choice: Kudumisha neno “nyumba” katika maandishi
  alternative: “hekalu la Yahwe”
  rationale: “Nyumba” ndiyo taswira ya moja kwa moja ya Kiebrania na ina upana wa maana unaostahili kuhifadhiwa; katika muktadha inarejelea hekalu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa urahisi. Muundo “na awe ... ufanikiwe” unatunza sauti ya baraka; “nyumba” inadumisha picha ya Kiebrania, huku tanbihi ikifafanua rejeo la hekalu.
