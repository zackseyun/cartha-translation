  text: הִנֵּה בֵ֞ן נוֹלָ֣ד לָ֗/ךְ ה֤וּא יִהְיֶה֙ אִ֣ישׁ מְנוּחָ֔ה וַ/הֲנִח֥וֹתִי ל֛/וֹ מִ/כָּל אוֹיְבָ֖י/ו מִ/סָּבִ֑יב כִּ֤י שְׁלֹמֹה֙ יִהְיֶ֣ה שְׁמ֔/וֹ וְ/שָׁל֥וֹם וָ/שֶׁ֛קֶט אֶתֵּ֥ן עַל יִשְׂרָאֵ֖ל בְּ/יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/009.yaml
  text: Behold[a], a son will be born to you. He will be a man of rest, and I will give him rest from all his enemies all around; for Solomon will be his name[b], and I will give peace and quiet to Israel in his days.
translation:
  language: sw
  text: Tazama, mwana atazaliwa kwako. Atakuwa mtu wa pumziko, nami nitampa pumziko kutoka kwa adui zake wote wanaomzunguka; kwa maana jina lake litakuwa Sulemani.[a] Nami nitaipa Israeli amani na utulivu katika siku zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kiebrania, jina “Sulemani” lina uhusiano wa kimatamshi na neno shalom, yaani “amani”; mstari huu pia unamwita “mtu wa pumziko.”
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Inadumisha nguvu ya neno la Kiebrania linalovuta fikira na uzito wa tangazo bila kutumia lugha isiyo ya kawaida.
- source_word: בֵן נוֹלָד לָךְ
  choice: mwana atazaliwa kwako
  rationale: Inaonyesha ahadi ya tukio la wakati ujao na kwamba mwana huyo atazaliwa kwa Daudi, huku ikibaki ya kawaida na wazi katika Kiswahili.
- source_word: אִישׁ מְנוּחָה
  choice: mtu wa pumziko
  rationale: Inahifadhi wazo la מְנוּחָה na uhusiano wake wa kimakusudi na kitenzi kinachofuata, badala ya kulichanganya mapema na שָׁלוֹם, ‘amani.’
- source_word: וַהֲנִחוֹתִי לוֹ
  choice: nami nitampa pumziko
  rationale: Inarudia mzizi wa wazo la ‘pumziko’ kama ilivyo katika Kiebrania na kuonyesha kwamba Mungu ndiye anayempa usalama huo.
- source_word: מִכָּל אוֹיְבָיו מִסָּבִיב
  choice: kutoka kwa adui zake wote wanaomzunguka
  rationale: Inahifadhi maana ya adui wote walioko pande zote na inaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: שְׁלֹמֹה יִהְיֶה שְׁמוֹ
  choice: jina lake litakuwa Sulemani
  rationale: Ni mpangilio wa kawaida wa Kiswahili na unadumisha jina la mtu kwa umbo lake linalotumiwa kwa kawaida.
- source_word: וְשָׁלוֹם וָשֶׁקֶט
  choice: amani na utulivu
  rationale: 'Maneno mawili tofauti yanahifadhiwa: שָׁלוֹם ni ‘amani,’ na שֶׁקֶט ni hali ya utulivu au kutokuwa na misukosuko.'
- source_word: עַל יִשְׂרָאֵל בְּיָמָיו
  choice: kwa Israeli ... katika siku zake
  rationale: Inafuata maana ya Kiebrania bila kuongeza kwa wazi dhana ya ‘utawala,’ ingawa muktadha unaweza kuidokeza.
theological_decisions:
- issue: Uhusiano wa mada kati ya pumziko, jina Sulemani, na amani
  choice: Kutofautisha ‘pumziko’ (מְנוּחָה/נוח) na ‘amani’ (שָׁלוֹם), huku tanbihi ikieleza mwangwi uliopo kati ya Sulemani na shalom.
  alternative: Kutafsiri אִישׁ מְנוּחָה kuwa ‘mtu wa amani’ ili sentensi isikike laini zaidi.
  rationale: Kiebrania kinatumia maneno yanayohusiana lakini si sawa. Kuyatofautisha kunahifadhi muundo na mvutano wa maandishi bila kuifanya ‘amani’ ibebe maana zote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na uwazi. Usemi ‘mtu wa pumziko’ una uzito wa kibiblia lakini bado unaeleweka, na umetumiwa ili kuhifadhi marudio ya kimakusudi ya Kiebrania. Alama ya tanbihi [a] imewekwa baada ya jina linaloelezwa.
