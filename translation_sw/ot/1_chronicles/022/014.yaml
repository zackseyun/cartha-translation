  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה בְ/עָנְיִ֜/י הֲכִינ֣וֹתִי לְ/בֵית יְהוָ֗ה זָהָ֞ב כִּכָּרִ֤ים מֵֽאָה אֶ֨לֶף֙ וְ/כֶ֗סֶף אֶ֤לֶף אֲלָפִים֙ כִּכָּרִ֔ים וְ/לַ/נְּחֹ֤שֶׁת וְ/לַ/בַּרְזֶל֙ אֵ֣ין מִשְׁקָ֔ל כִּ֥י לָ/רֹ֖ב הָיָ֑ה וְ/עֵצִ֤ים וַ/אֲבָנִים֙ הֲכִינ֔וֹתִי וַ/עֲלֵי/הֶ֖ם תּוֹסִֽיף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/014.yaml
  text: Behold[a], in my affliction I have prepared for the house of Yahweh one hundred thousand talents of gold, and one million talents of silver; and for the bronze and the iron there is no weighing, for it was in abundance. I have prepared timber and stones[c][b], and you may add to them.
translation:
  language: sw
  text: Tazama, katika taabu yangu[a] nimeandaa kwa ajili ya nyumba ya Yahweh talanta laki moja za dhahabu na talanta milioni moja[b] za fedha. Shaba na chuma havikupimwa uzani, kwa maana vilikuwa vingi sana. Nimeandaa pia mbao na mawe, nawe utaongeza juu ya hayo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika umaskini wangu.” Neno la Kiebrania linaweza kumaanisha taabu, dhiki, hali ngumu, au umaskini.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “elfu moja za maelfu.”'
    reason: lexical_alternative
  - marker: c
    text: Au, “nawe unaweza kuongeza juu ya hayo.” Umbo la Kiebrania linaweza kueleweka kama kauli ya baadaye/agizo au kama ruhusa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta fikira za msikilizaji kwa jambo linalofuata. “Tazama” ni ulinganifu wa kawaida na wenye hadhi, bila kuongeza kiashirio cha wakati kisichopo katika Kiebrania.
- source_word: בְעָנְיִי
  choice: katika taabu yangu
  rationale: עֳנִי inaweza kumaanisha mateso, dhiki, hali ngumu, au umaskini. “Katika taabu yangu” huhifadhi upana wa maana na inafaa katika muktadha wa maandalizi magumu ya Daudi; uwezekano wa “umaskini wangu” umewekwa katika tanbihi.
- source_word: הֲכִינוֹתִי
  choice: nimeandaa
  rationale: Hifili ya כון hapa ni kuandaa au kuweka tayari. Wakati timilifu wa Kiswahili unaonyesha maandalizi yaliyokamilika ambayo bado yana umuhimu kwa Sulemani.
- source_word: לְבֵית יְהוָה
  choice: kwa ajili ya nyumba ya Yahweh
  rationale: “Nyumba” huhifadhi sitiari ya Kiebrania, ingawa katika muktadha huu ni hekalu. Jina la agano יְהוָה limetolewa kama “Yahweh.”
- source_word: כִּכָּרִים
  choice: talanta
  rationale: כִּכָּר ni kipimo kikubwa cha uzani cha kale. “Talanta” ni istilahi ya Kibiblia inayotambulika na huepuka kubadili kiasi kwa makadirio yasiyo hakika ya kisasa.
- source_word: מֵאָה אֶלֶף
  choice: laki moja
  rationale: Hii ni njia ya kawaida na iliyo wazi katika Kiswahili cha Afrika Mashariki ya kutaja 100,000.
- source_word: אֶלֶף אֲלָפִים
  choice: milioni moja
  rationale: Kiebrania husema kihalisi “elfu moja za maelfu.” “Milioni moja” huwasilisha kiasi hicho kwa Kiswahili cha sasa; muundo wa asili umehifadhiwa katika tanbihi.
- source_word: וְלַנְּחֹשֶׁת וְלַבַּרְזֶל אֵין מִשְׁקָל
  choice: Shaba na chuma hazina kipimo cha uzani
  rationale: Kauli hii haimaanishi metali hizo hazina uzito, bali kiasi chake hakikupimwa au kilikuwa kikubwa mno kuorodheshwa kwa uzani. “Hazina kipimo cha uzani” ni ya asili zaidi kuliko “hazina uzani” na huhifadhi wazo la מִשְׁקָל.
- source_word: כִּי לָרֹב הָיָה
  choice: kwa maana zilikuwa nyingi sana
  rationale: 'Kishazi kinaeleza sababu ya kutotajwa kwa uzani: metali hizo zilikuwa kwa wingi mkubwa. Ngeli ya wingi hurejelea shaba na chuma kwa njia ya kawaida katika Kiswahili.'
- source_word: וְעֵצִים וַאֲבָנִים
  choice: pia mbao na mawe
  rationale: Katika muktadha wa ujenzi, עֵצִים inafaa kutafsiriwa “mbao” badala ya “miti” au “kuni.” “Pia” huonyesha kuongezwa kwa vifaa hivi katika orodha.
- source_word: וַעֲלֵיהֶם תּוֹסִיף
  choice: nawe utaongeza zaidi
  rationale: Umbo la wakati usiotimilika linaweza kusikika kama kauli ya baadaye au agizo lenye upole. “Utaongeza zaidi” huhifadhi mvutano huo vizuri kuliko kulazimisha ruhusa pekee; uwezekano wa “unaweza kuongeza zaidi” umeonyeshwa katika tanbihi.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko linatumia Tetragramatoni moja kwa moja. “Yahweh” huhifadhi jina binafsi la agano bila kulibadilisha kuwa cheo.
- issue: Maana ya בְעָנְיִי kuhusu hali ya Daudi
  choice: katika taabu yangu
  alternative: katika umaskini wangu
  rationale: Neno linaweza kueleza mateso, hali ngumu, au umaskini. Tafsiri kuu haifanyi dai la lazima kwamba Daudi alikuwa maskini kifedha, huku tanbihi ikihifadhi usomaji huo unaowezekana.
- issue: Nguvu ya וַעֲלֵיהֶם תּוֹסִיף
  choice: nawe utaongeza zaidi
  alternative: nawe unaweza kuongeza zaidi
  rationale: Kiebrania kinaweza kueleweka kama matarajio/agizo au ruhusa. Wakati ujao wa Kiswahili huacha kiwango fulani cha uwazi, na tanbihi inataja usomaji wa ruhusa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimegawanywa ili orodha ndefu ibaki rahisi kusomeka. Istilahi “talanta” imehifadhiwa kama kipimo cha kale, “nyumba ya Yahweh” imehifadhi nahau ya Kiebrania, na tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
