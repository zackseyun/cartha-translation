  text: הֽוּא יִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י וְ/הוּא֙ יִהְיֶה לִּ֣/י לְ/בֵ֔ן וַ/אֲנִי ל֖/וֹ לְ/אָ֑ב וַ/הֲכִ֨ינוֹתִ֜י כִּסֵּ֧א מַלְכוּת֛/וֹ עַל יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/010.yaml
  text: He will build a house for my name[a], and he will be a son to me, and I will be a father to him, and I will establish the throne of his kingdom over Israel forever.
translation:
  language: sw
  text: Yeye atajenga nyumba kwa ajili ya jina langu,[a] naye atakuwa mwanangu, nami nitakuwa baba yake. Nami nitakifanya imara kiti cha enzi cha ufalme wake juu ya Israeli milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu kwa ajili ya jina langu.” Kiebrania kinasema kihalisi “nyumba kwa ajili ya jina langu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיִת
  choice: hekalu
  rationale: Ingawa maana ya msingi ni “nyumba,” katika muktadha huu nyumba inayojengwa kwa jina la Mungu ni hekalu. Kiswahili cha kawaida huhitaji “hekalu” ili maana iwe wazi; maana halisi imehifadhiwa katika tanbihi.
- source_word: לִשְׁמִי
  choice: kwa ajili ya jina langu
  rationale: Huhifadhi usemi wa Kiebrania unaoonyesha kwamba hekalu limewekwa wakfu kwa jina na uwepo wa Mungu, bila kuufafanua kupita kiasi.
- source_word: לְבֵן ... לְאָב
  choice: atakuwa mwanangu ... nitakuwa baba yake
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza uhusiano wa moja kwa moja wa mwana na baba uliomo katika agano.
- source_word: וַהֲכִינוֹתִי
  choice: nitakifanya imara
  rationale: Hifili ya כון ina wazo la kufanya kitu kiwe thabiti au imara. Tafsiri hii ni wazi na inasisitiza uthabiti wa ahadi ya kifalme.
- source_word: כִּסֵּא מַלְכוּתוֹ
  choice: kiti cha ufalme wake
  rationale: Huhifadhi vipengele vyote viwili vya usemi wa Kiebrania—kiti cha enzi na ufalme—katika muundo wa Kiswahili unaoeleweka.
- source_word: עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: Kihusishi עַל katika muktadha wa utawala huonyesha kutawala juu ya Israeli.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Ni tafsiri ya kawaida na yenye nguvu ya Kiswahili kwa ahadi ya kudumu isiyo na mwisho.
theological_decisions:
- issue: Kauli ya agano kuhusu uhusiano wa baba na mwana, inayomhusu Sulemani moja kwa moja na yenye umuhimu mpana katika ahadi ya Daudi
  choice: atakuwa mwanangu, nami nitakuwa baba yake
  alternative: nitamtendea kama mwanangu, nami nitakuwa kama baba kwake
  rationale: Kiebrania kinataja uhusiano huo moja kwa moja, si kwa njia ya tashbihi. Tafsiri iliyochaguliwa hudumisha maana ya karibu kuhusu Sulemani na mvutano wake mpana wa kikanoni bila kuingiza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Hekalu” limetumiwa katika matini kuu kwa uwazi wa kimuktadha; tanbihi huhifadhi usemi halisi “nyumba.” Muundo wa baba na mwana umewekwa katika lugha ya kawaida ya Kiswahili bila kudhoofisha kauli ya agano.
