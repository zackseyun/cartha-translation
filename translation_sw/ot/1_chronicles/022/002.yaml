  text: וַ/יֹּ֣אמֶר דָּוִ֔יד לִ/כְנוֹס֙ אֶת הַ/גֵּרִ֔ים אֲשֶׁ֖ר בְּ/אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יַּעֲמֵ֣ד חֹֽצְבִ֗ים לַ/חְצוֹב֙ אַבְנֵ֣י גָזִ֔ית לִ/בְנ֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/002.yaml
  text: And David ordered the foreigners who were in the land of Israel to be gathered[c][b][a], and he appointed stonecutters to cut dressed stones for building the house of God.
translation:
  language: sw
  text: Daudi akaamuru wageni[a] waliokuwa katika nchi ya Israeli wakusanywe, kisha akateua wakataji wa mawe ili wakate mawe yaliyochongwa[b] kwa ajili ya kujenga nyumba ya Mungu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakaaji wageni.” Kiebrania kinawahusu watu wasio Waisraeli walioishi katika nchi hiyo.
    reason: lexical_alternative
  - marker: b
    text: Au “mawe yaliyokatwa” au “mawe yaliyochongwa kwa zana.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, hekalu.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akaamuru
  rationale: Ingawa kitenzi hiki kwa msingi humaanisha ‘akasema,’ hapa kinafuatwa na kitenzi-jina kinachoeleza agizo; ‘akaamuru’ huwasilisha nguvu ya kauli hiyo kwa Kiswahili cha kawaida.
- source_word: לִכְנוֹס
  choice: wakusanywe
  rationale: Kauli ya kutendwa inaonyesha kwamba Daudi aliagiza watu hao wakusanywe, si kwamba yeye mwenyewe aliwakusanya.
- source_word: הַגֵּרִים
  choice: wageni
  rationale: Neno hili linawahusu watu wasio Waisraeli waliokaa katika nchi ya Israeli. ‘Wageni’ ni neno wazi na la kawaida, huku tanbihi ikifafanua kwamba walikuwa wakazi, si wageni wa muda mfupi tu.
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: katika nchi ya Israeli
  rationale: ‘Nchi’ limehifadhiwa ili kuakisi אֶרֶץ na maana yake ya eneo.
- source_word: וַיַּעֲמֵד
  choice: akateua
  rationale: Katika muktadha huu kitenzi kinaonyesha kuwa Daudi aliwapa wafanyakazi jukumu rasmi; ‘akateua’ ni cha asili na wazi.
- source_word: חֹצְבִים
  choice: wakataji wa mawe
  rationale: Kirai hiki kinawataja wafanyakazi wenye kazi ya kukata au kuchonga mawe, na kinaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: לַחְצוֹב
  choice: ili wakate
  rationale: Muundo wa ‘ili’ unaonyesha kusudi la kuwateua, na ‘wakate’ hudumisha uhusiano wa mzizi na ‘wakataji wa mawe.’
- source_word: אַבְנֵי גָזִית
  choice: mawe yaliyochongwa
  rationale: Haya ni mawe yaliyokatwa na kutengenezwa kwa ajili ya ujenzi; ‘yaliyochongwa’ huonyesha kuwa hayakuwa mawe ghafi.
- source_word: לִבְנוֹת
  choice: kwa ajili ya kujenga
  rationale: Kirai hiki kinaonyesha kusudi la kutayarisha mawe kwa njia ya kawaida katika Kiswahili.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Hili linahifadhi kwa karibu maneno ya Kiebrania bila kubadili moja kwa moja kuwa ‘hekalu,’ ingawa hekalu ndilo linalokusudiwa.
theological_decisions:
- issue: Jinsi ya kutafsiri בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  alternative: hekalu la Mungu
  rationale: Kirai hicho kinarejelea mradi wa hekalu, lakini Kiebrania chenyewe kinasema ‘nyumba ya Mungu.’ Tafsiri kuu inahifadhi usemi huo, na tanbihi inabainisha kinachorejelewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa sasa na unaoeleweka kwa wasomaji wa kawaida. Viunganishi na miundo ya vitenzi vimechaguliwa kwa mtiririko wa asili bila kufuta maana ya matini ya Kiebrania.
