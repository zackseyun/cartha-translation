base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/019.yaml
  text: Now set your heart and your soul to seek Yahweh your God[a]. Rise up and build the sanctuary of Yahweh God[b], to bring the ark of the covenant of Yahweh and the holy vessels of God into the house that is to be built for the name of Yahweh.
translation:
  language: sw
  text: Sasa elekezeni mioyo yenu na nafsi zenu kumtafuta Yahweh Mungu wenu.[a] Inukeni, mkajenge mahali patakatifu pa Yahweh Mungu, ili kuleta sanduku la agano la Yahweh na vyombo vitakatifu vya Mungu ndani ya nyumba[b] itakayojengwa kwa ajili ya jina la Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya neno kwa neno zaidi: “toeni mioyo yenu na nafsi zenu” ili kumtafuta Yahweh Mungu wenu.'
    reason: lexical_alternative
  - marker: b
    text: “Nyumba” hapa ni jengo la hekalu litakalojengwa kwa ajili ya jina la Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: Sasa
  rationale: Ni kiashirio cha wakati na cha mwendelezo wa hotuba kinachoanzisha himizo la haraka.
- source_word: תְּנוּ לְבַבְכֶם וְנַפְשְׁכֶם
  choice: elekezeni mioyo yenu na nafsi zenu
  rationale: Kiebrania halisi ni ‘toeni mioyo yenu na nafsi zenu,’ lakini ‘elekezeni’ huwasilisha kwa Kiswahili cha kawaida azimio la makusudi huku kikihifadhi istilahi zote mbili.
- source_word: לְבָב / נֶפֶשׁ
  choice: mioyo ... na nafsi
  rationale: Inahifadhi jozi ya Kiebrania bila kuifupisha kuwa dhana moja; hapa moyo unahusisha nia na utashi, huku nafsi ikisisitiza utu mzima.
- source_word: לִדְרוֹשׁ
  choice: kumtafuta
  rationale: Katika uhusiano na Mungu, kitenzi hiki humaanisha kumtafuta kwa kujitoa na kumtegemea.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inawakilisha moja kwa moja jina la agano יהוה kwa umbo la Kiswahili.
- source_word: וְקוּמוּ
  choice: Simameni
  rationale: Amri ya wingi ya קום ni himizo la kuanza kutenda; ‘Simameni’ ni ya asili na yenye hadhi katika Kiswahili.
- source_word: מִקְדַּשׁ
  choice: mahali patakatifu
  rationale: מקדשׁ ni patakatifu au sanctuary; tafsiri hii inalinda tofauti yake na ‘nyumba’ inayotajwa baadaye.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahwe
  rationale: Inahifadhi kwa uwazi mfuatano wa umilikaji katika Kiebrania.
- source_word: כְלֵי קֹדֶשׁ הָאֱלֹהִים
  choice: vyombo vitakatifu vya Mungu
  rationale: כלי inaweza kumaanisha vifaa au vyombo; katika muktadha wa ibada ya hekalu, ‘vyombo’ ni istilahi ya kawaida na inayoeleweka.
- source_word: לַבַּיִת הַנִּבְנֶה לְשֵׁם יְהוָה
  choice: ndani ya nyumba itakayojengwa kwa ajili ya jina la Yahwe
  rationale: Inahifadhi taswira ya ‘nyumba’ na usemi muhimu wa kitheolojia ‘kwa ajili ya jina la Yahwe’ bila kuubadili kuwa ‘kwa ajili ya Yahwe’.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina la agano moja kwa moja; ‘Yahwe’ hulihifadhi badala ya kulibadili kuwa cheo.
- issue: Jozi ya kianthropolojia ‘moyo na nafsi’
  choice: 'Kuhifadhi istilahi zote mbili: mioyo na nafsi'
  alternative: Kuzijumlisha kuwa ‘utu wenu wote’
  rationale: Jozi hiyo inasisitiza kujitoa kikamilifu, lakini maandiko hayalazimishi ufafanuzi wa kiufundi wa uhusiano kati ya moyo na nafsi.
- issue: Usemi ‘kwa ajili ya jina la Yahwe’
  choice: Kuhifadhi usemi huo moja kwa moja
  alternative: ‘kwa ajili ya Yahwe’ au ‘kwa heshima ya Yahwe’
  rationale: ‘Jina’ lina uzito wa kitheolojia katika Kiebrania, na kuliondoa au kulifafanua kungepunguza maana na mvutano wa usemi wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Amri za wingi zimehifadhiwa. ‘Mahali patakatifu’ limetumiwa kwa מִקְדָּשׁ ili kutolitambulisha kabisa na ‘nyumba’ kabla ya kifungu chenyewe kufanya hivyo; ‘sanduku la agano’ na ‘vyombo vitakatifu’ ni istilahi zinazoeleweka katika muktadha wa ibada.
