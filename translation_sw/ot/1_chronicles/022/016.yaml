base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/016.yaml
  text: For the gold[a], the silver, the bronze, and the iron, there is no number. Rise up and work[c][b], and may Yahweh be with you.
translation:
  language: sw
  text: Kwa habari ya dhahabu, fedha, shaba[a] na chuma, hakuna hesabu[b]. Inuka, ufanye kazi, na Yahweh awe pamoja nawe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shaba nyekundu.” Neno la Kiebrania linaweza kutaja bronzi au shaba nyekundu kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “hakuna idadi”; yaani, ni vingi mno visivyoweza kuhesabika.'
    reason: lexical_alternative
  - marker: c
    text: Au, “Yahweh atakuwa pamoja nawe,” au “Yahweh na awe pamoja nawe.” Umbo la Kiebrania linaweza kueleza ombi au baraka.
    reason: alternative_reading
lexical_decisions:
- source_word: לַזָּהָב לַכֶּסֶף וְלַנְּחֹשֶׁת וְלַבַּרְזֶל
  choice: Kwa habari ya dhahabu, fedha, shaba na chuma
  rationale: Viambishi ל־ vinaeleweka hapa kama vya kuanzisha mada (‘kwa habari ya’), vikirejelea vifaa vya ujenzi vilivyotajwa katika muktadha uliotangulia.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: ‘Shaba’ ni neno la kawaida na lenye hadhi katika Kiswahili kwa metali hii katika orodha za vifaa vya kale; kulingana na muktadha, neno la Kiebrania linaweza kumaanisha bronzi au shaba nyekundu.
- source_word: אֵין מִסְפָּר
  choice: hakuna hesabu
  rationale: Hifadhi nahau ya Kiebrania inayomaanisha kuwa vitu hivyo ni vingi mno kiasi cha kutohesabika, bila kuibadili kuwa idadi maalumu.
- source_word: קוּם וַעֲשֵׂה
  choice: Inuka, ufanye kazi
  rationale: Amri hizi mbili ni wito wa kuanza kutenda; katika muktadha wa ujenzi, ‘ufanye kazi’ ni ya asili kuliko ‘ufanye’ peke yake.
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: na Yahwe awe pamoja nawe
  rationale: Umbo la kitenzi linafaa kueleweka kama ombi au baraka. ‘Awe pamoja nawe’ huhifadhi maana hiyo badala ya kuifanya ahadi ya wakati ujao.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko lina jina la agano moja kwa moja; ‘Yahwe’ hulitofautisha na cheo ‘Bwana’ bila kuingiza tafsiri ya kimadhehebu.
- issue: Nguvu ya וִיהִי katika baraka
  choice: awe pamoja nawe
  alternative: atakuwa pamoja nawe
  rationale: Tafsiri iliyochaguliwa huhifadhi uwezekano mkubwa wa tamko la kutakia au kubariki, badala ya kulazimisha maana ya ahadi ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kwa habari ya’ huhifadhi muundo wa mada; ‘Inuka, ufanye kazi’ ni wito wazi na wa kawaida. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
