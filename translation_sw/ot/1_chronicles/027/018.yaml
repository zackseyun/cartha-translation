  text: For Judah[a], Elihu, one of David’s brothers; for Issachar, Omri son of Michael.
translation:
  language: sw
  text: Kwa Yuda, Elihu[a], mmoja wa ndugu za Daudi; kwa Isakari, Omri mwana wa Mikaeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Elihu.” Baadhi ya tafsiri za kale na wafafanuzi husoma “Eliabu,” huenda kwa kulinganisha na jina la ndugu ya Daudi anayetajwa mahali pengine.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִיהוּדָה
  choice: Kwa Yuda
  rationale: Kiambishi ל־ kinaanzisha jina la kabila katika orodha hii ya kiutawala; “Kwa Yuda” ni fupi, ya asili, na inadumisha muundo wa orodha.
- source_word: אֱלִיהוּ
  choice: Elihu
  rationale: Maandishi ya Kiebrania ya WLC yanasoma אֱלִיהוּ, hivyo jina limetoholewa kuwa “Elihu” bila kulibadilisha kufuatana na mapokeo mengine.
- source_word: מֵאֲחֵי דָוִיד
  choice: mmoja wa ndugu za Daudi
  rationale: 'מִן pamoja na wingi wa neno “ndugu” ina maana ya sehemu ya kundi: Elihu alikuwa mmoja miongoni mwa ndugu za Daudi.'
- source_word: לְיִשָּׂשכָר
  choice: kwa Isakari
  rationale: Kama ilivyo kwa Yuda, ל־ linaonyesha kabila ambalo mwakilishi alihusika nalo.
- source_word: עָמְרִי
  choice: Omri
  rationale: Jina limetoholewa kwa tahajia inayotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בֶּן מִיכָאֵל
  choice: mwana wa Mikaeli
  rationale: Huu ni muundo wa kawaida wa Kiebrania unaotaja jina la baba.
