base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/008.yaml
  text: The fifth[a], for the fifth month, was the commander Shamhuth the Izrahite; and over his division were twenty-four thousand.
translation:
  language: sw
  text: Kikosi cha tano, kwa mwezi wa tano, kiliongozwa na jemadari Shamhuthi, Mwizrahi[a]; katika kikosi chake walikuwamo watu elfu ishirini na nne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mzerahi.” Baadhi ya tafsiri hulihusianisha jina hili la ukoo na Zera.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: Kikosi cha tano
  rationale: Namba ya mpangilio imetumiwa kama nomino katika orodha ya vikosi; kutaja “kikosi” wazi huleta maana ya muktadha kwa Kiswahili cha kawaida.
- source_word: לַחֹדֶשׁ הַחֲמִישִׁי
  choice: kwa ajili ya mwezi wa tano
  rationale: Herufi ל inaonyesha kwamba kikosi hicho kilipangiwa kuhudumu katika mwezi huo.
- source_word: הַשַּׂר
  choice: jemadari
  rationale: Katika muktadha huu wa kijeshi, שַׂר ni mkuu wa kikosi; “jemadari” ni neno la sasa, lenye heshima na linaloeleweka.
- source_word: שַׁמְהוּת
  choice: Shamhuthi
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili huku likifuata kwa karibu vokali za Kiebrania.
- source_word: הַיִּזְרָח
  choice: Mwiz'rahi
  rationale: Jina la ukoo au asili limetoholewa kutoka umbo la Kiebrania יזרח bila kulisawazisha kimya kimya na “Mzerahi”; apostrofi husaidia kuzuia kusomwa kwa “zr” kama mkusanyiko usio wa kawaida katika Kiswahili.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: katika kikosi chake walikuwamo
  rationale: מַחֲלֻקָה hapa ni kitengo cha kijeshi. Kiswahili hiki kinaonyesha idadi ya waliokuwa chini ya uongozi wake kwa njia ya kawaida.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: watu elfu ishirini na nne
  rationale: Hii ndiyo namna ya kawaida ya kutaja 24,000 kwa Kiswahili; “watu” inaeleweka kutokana na orodha ya wanajeshi.
