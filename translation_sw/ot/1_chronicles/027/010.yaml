base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/010.yaml
  text: 'The seventh[a], for the seventh month: Helez the Pelonite, from the sons of Ephraim; and over his division were twenty-four thousand.'
translation:
  language: sw
  text: Wa saba, kwa mwezi wa saba, alikuwa Helezi Mpeloni[a], kutoka kwa wana wa Efraimu; na kikosi chake kilikuwa na watu elfu ishirini na nne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda “Mpaltiti,” kulingana na mapokeo mengine kuhusu utambulisho wa ukoo wa Helezi.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְּׁבִיעִי
  choice: Wa saba
  rationale: Kivumishi cha mpangilio kimetumiwa bila nomino katika orodha hii, kikimaanisha mkuu wa saba; Kiswahili kinaweza kuhifadhi ufupi huo kwa njia ya asili.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: kwa mwezi wa saba
  rationale: Kiambishi ל hapa kinaonyesha mgawo wa huduma kwa mwezi; ‘kwa mwezi wa saba’ ni wazi na cha kawaida.
- source_word: חֶלֶץ
  choice: Helezi
  rationale: Jina la mtu limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: הַפְּלוֹנִי
  choice: Mpeloni
  rationale: Jina la ukoo au mahali limewasilishwa kwa kufuata umbo la konsonanti la maandishi ya Kiebrania ya mstari huu; utambulisho mwingine wa kimapokeo umewekwa katika tanbihi.
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: kutoka kwa wana wa Efraimu
  rationale: Inahifadhi nahau ya kikabila ya Kiebrania, ‘wana wa Efraimu,’ huku ikieleweka katika Kiswahili cha kawaida.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: na katika kikosi chake walikuwa
  rationale: מַחֲלֻקָה ni kikosi cha kijeshi katika sura hii. Kiswahili hiki kinaeleza kwa asili kwamba idadi inayofuata ni ya watu waliokuwa chini ya uongozi wake, bila kubadili maana ya kiutawala.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: watu elfu ishirini na nne
  rationale: Idadi imetolewa kwa maneno; ‘watu’ inawekwa wazi kwa kawaida ya Kiswahili kutokana na muktadha wa kikosi cha kijeshi.
