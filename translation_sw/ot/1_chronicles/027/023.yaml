base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/023.yaml
  text: But David did not count them from twenty years old and under[b][a], because Yahweh had said he would multiply Israel like the stars of the heavens.
translation:
  language: sw
  text: Lakini Daudi hakuwahesabu wale wenye umri wa miaka ishirini na kwenda chini[a], kwa sababu Yahwe alikuwa amesema kwamba angeifanya Israeli kuwa nyingi kama nyota za mbinguni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuchukua idadi yao.” Nahau ya Kiebrania ni, kihalisi, “hakuinua idadi yao,” yaani, hakuwahesabu au hakufanya sensa yao.
    reason: lexical_alternative
  - marker: b
    text: Au, “kama nyota za anga.” Maneno haya yanakumbusha ahadi ya Yahwe ya kuifanya Israeli kuwa na watu wengi sana.
    reason: cross_reference
lexical_decisions:
- source_word: וְלֹא
  choice: Lakini ... haku-
  rationale: Kiunganishi kinaunganisha mstari huu na habari ya sensa iliyotangulia kwa maana ya utofautishaji; “Lakini” huonyesha hilo kwa Kiswahili cha kawaida.
- source_word: נָשָׂא ... מִסְפָּרָם
  choice: hakuwahesabu
  rationale: Nahau ya Kiebrania, kihalisi “hakuinua idadi yao,” hapa humaanisha kuhesabu watu au kufanya sensa.
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וּלְמָטָּה
  choice: wale wenye umri wa miaka ishirini na kwenda chini
  rationale: Kauli hii inajumuisha walio na miaka ishirini na wote walio chini ya umri huo; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: כִּי
  choice: kwa sababu
  rationale: Chembe hii inatoa sababu ya Daudi kutowahesabu watu wa kundi hilo la umri.
- source_word: אָמַר יְהוָה
  choice: Yahwe alikuwa amesema
  rationale: Jina la agano יְהוָה limetolewa kama “Yahwe,” na wakati wa kitendo unaonyesha kwamba ahadi hiyo ilitangulia uamuzi wa Daudi.
- source_word: לְהַרְבּוֹת אֶת יִשְׂרָאֵל
  choice: angeifanya Israeli kuwa nyingi
  rationale: Kitenzi cha Kiebrania kina maana ya kuongeza sana au kufanya kuwa wengi; muundo huu unaeleza kwa kawaida yaliyomo katika ahadi.
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: kama nyota za mbinguni
  rationale: Huhifadhi tashbihi na mwangwi wa lugha ya ahadi kwamba Israeli ingekuwa na watu wengi sana.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya ahadi ya kuifanya Israeli kuwa nyingi
  choice: angeifanya Israeli kuwa nyingi kama nyota za mbinguni
  alternative: angeongeza Israeli kama nyota za mbinguni
  rationale: Tafsiri inadumisha lugha ya ahadi na tashbihi yake bila kuamua ikiwa “Israeli” hapa inasisitiza watu, taifa, au uzao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kuwahesabu” ni cha kawaida kuliko tafsiri halisi ya nahau ya Kiebrania, huku tanbihi ikihifadhi picha yake. “Kwenda chini” huweka wazi kwamba umri wa miaka ishirini umejumuishwa.
