translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kitenzi ‘alikuwa’ kimeongezwa ili kukamilisha kishazi nomino cha Kiebrania kwa Kiswahili; kiwakilishi ‘naye’ kinaweka wazi kwamba mtu huyo huyo ndiye mkuu. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
