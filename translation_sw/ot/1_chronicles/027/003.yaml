  yaml_path: translation/ot/1_chronicles/027/003.yaml
  text: From the sons of Perez[b][a], the chief over all the commanders of the divisions for the first month.
translation:
  language: sw
  text: Alikuwa mmoja wa wana wa Peresi[a], mkuu juu ya makamanda wote wa vikosi[b] kwa mwezi wa kwanza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wazao wa Peresi.” Kiebrania kinasema kihalisi “wana wa Peresi,” usemi wa ukoo unaoweza kurejelea kizazi kipana cha wazao.
    reason: lexical_alternative
  - marker: b
    text: Au, “majeshi.” Neno la Kiebrania mara nyingi humaanisha majeshi, lakini katika sura hii linarejelea vikosi vya kijeshi vilivyopangwa kwa zamu za kila mwezi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: miongoni mwa
  rationale: Katika sentensi hii isiyo na kitenzi wazi, kihusishi hiki kinamtambulisha kiongozi kuwa wa ukoo wa Peresi; ‘miongoni mwa’ ni ya asili katika Kiswahili na haiongezi dai kwamba yeye ndiye aliyekuwa mwana wa moja kwa moja.
- source_word: בְּנֵי פֶרֶץ
  choice: wana wa Peresi
  rationale: Huhifadhi muundo halisi wa Kiebrania, huku tanbihi ikifafanua kwamba katika matumizi ya ukoo inaweza kumaanisha wazao wa Peresi.
- source_word: הָרֹאשׁ
  choice: mkuu
  rationale: Neno hili hapa ni cheo cha mwenye mamlaka ya juu; ‘mkuu’ ni la kawaida, lenye hadhi, na linafaa katika muktadha wa kijeshi na kiutawala.
- source_word: לְכָל
  choice: juu ya ... wote
  rationale: Huwasilisha upeo wa mamlaka ya mkuu huyo kwa Kiswahili cha kawaida.
- source_word: שָׂרֵי הַצְּבָאוֹת
  choice: makamanda wote wa vikosi
  rationale: שָׂרִים ni wakuu au makamanda, na צְבָאוֹת inaweza kuwa majeshi; katika sura hii inahusu vikosi vya kijeshi vilivyopangwa kwa zamu za kila mwezi.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: kwa mwezi wa kwanza
  rationale: Kirai hiki hutaja zamu ya mwezi inayohusika; ‘kwa mwezi wa kwanza’ ni wazi na cha asili.
