base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/005.yaml
  text: The commander of the third division for the third month was Benaiah son of Jehoiada the chief[a], and in his division were twenty-four thousand.
translation:
  language: sw
  text: Mkuu wa kikosi cha tatu kwa mwezi wa tatu alikuwa Benaya mwana wa Yehoyada, kuhani; naye alikuwa mkuu.[a] Kikosi chake kilikuwa na watu elfu ishirini na nne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Benaya mwana wa Yehoyada, kuhani aliye mkuu.” Kiebrania kinaweza kueleweka kwamba neno “mkuu” linaunganishwa na “kuhani” likimweleza Yehoyada, badala ya kumweleza Benaya.
    reason: Sintaksia ya Kiebrania haionyeshi bila shaka kama “mkuu” linamweleza Benaya au linaunganishwa na “kuhani” kumweleza Yehoyada.
lexical_decisions:
- source_word: שַׂר הַצָּבָא
  choice: Mkuu wa kikosi
  rationale: שַׂר huonyesha mwenye mamlaka au kamanda. Katika orodha hii anasimamia kikosi cha kijeshi cha zamu ya mwezi, hivyo “mkuu wa kikosi” ni sahihi na ya kawaida katika Kiswahili.
- source_word: הַשְּׁלִישִׁי לַחֹדֶשׁ הַשְּׁלִישִׁי
  choice: wa kikosi cha tatu, cha mwezi wa tatu
  rationale: Neno la kwanza “tatu” linahusu kikosi kilichodokezwa na muundo wa sura, na la pili linahusu mwezi. Kurudia “cha” kunafanya uhusiano huo uwe wazi bila kubadili maana.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaya mwana wa Yehoyada
  rationale: Majina yamenukuliwa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: הַכֹּהֵן
  choice: Yehoyada kuhani
  rationale: Maana ya moja kwa moja ni “kuhani.” Mpangilio huu unalihusisha jina hilo hasa na Yehoyada bila kulifanya moja kwa moja kuwa cheo maalumu cha “kuhani mkuu.”
- source_word: רֹאשׁ
  choice: naye alikuwa kiongozi mkuu
  rationale: רֹאשׁ humaanisha kichwa, mkuu, au kiongozi. Hapa imetolewa kama maelezo ya cheo cha Benaya, huku tanbihi ikihifadhi uwezekano wa kuiunganisha na “kuhani.”
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Kikosi chake kilikuwa na watu
  rationale: Ingawa עַל inaweza kuonyesha kuwa mtu yuko juu ya kikosi, katika fomula inayorudiwa hapa kishazi kinataja idadi ya watu wa kikosi. Kiswahili hiki ni cha kawaida na kinafikisha kazi ya kishazi.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: elfu ishirini na nne
  rationale: Hii ndiyo namna ya kawaida ya kutaja idadi 24,000 kwa Kiswahili.
theological_decisions:
- issue: Uhusiano wa הַכֹּהֵן רֹאשׁ na majina yaliyotangulia
  choice: 'Yehoyada ametajwa kuwa kuhani, kisha רֹאשׁ imeelezwa kuwa cheo cha Benaya: “naye alikuwa kiongozi mkuu.”'
  alternative: Maneno hayo yanaweza kuunganishwa kuwa “Yehoyada, kuhani mkuu,” au kueleweka kwa karibu zaidi kama “Yehoyada kuhani, mkuu.”
  rationale: Sintaksia fupi ya Kiebrania inaruhusu zaidi ya uhusiano mmoja. Matini kuu inatoa usomaji unaofaa muktadha wa uongozi wa kijeshi, na tanbihi inahifadhi usomaji mwingine bila kuamua kimadhehebu kuhusu cheo cha ukuhani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. “Kiongozi mkuu” huepuka kuchanganya cheo hiki na “mkuu wa kikosi” mwanzoni, huku tanbihi ikihifadhi utata halisi wa Kiebrania.
