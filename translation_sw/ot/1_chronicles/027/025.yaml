  text: וְ/עַל֙ אֹצְר֣וֹת הַ/מֶּ֔לֶךְ עַזְמָ֖וֶת בֶּן עֲדִיאֵ֑ל וְ/עַ֣ל הָֽ/אֹצָר֡וֹת בַּ/שָּׂדֶ֞ה בֶּ/עָרִ֤ים וּ/בַ/כְּפָרִים֙ וּ/בַ/מִּגְדָּל֔וֹת יְהוֹנָתָ֖ן בֶּן עֻזִּיָּֽהוּ־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/025.yaml
  text: Over the king’s treasuries was Azmaveth son of Adiel[a], and over the treasuries in the countryside, in the cities, in the villages, and in the towers[b], was Jehonathan son of Uzziah.
translation:
  language: sw
  text: Aliyesimamia hazina za mfalme alikuwa Azmawethi mwana wa Adieli; naye aliyesimamia hazina zilizokuwa mashambani[a], mijini, vijijini na katika minara alikuwa Yehonathani[b] mwana wa Uzia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwandani.” Neno la Kiebrania liko katika umoja, “shambani,” lakini huenda hapa lina maana ya kijumla ya maeneo ya mashambani, yaliyotofautishwa na miji, vijiji na minara.
    reason: lexical_alternative
  - marker: b
    text: “Yehonathani” linaonyesha umbo kamili la jina la Kiebrania lililotumiwa hapa; mahali pengine jina hilo huandikwa kwa umbo fupi, “Yonathani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Aliyesimamia ... alikuwa
  rationale: Katika orodha hii ya watumishi wa utawala, עַל huonyesha kuwa mtu alikuwa na wajibu wa kusimamia. Muundo huu ni wa kawaida katika Kiswahili na unadumisha maana ya mamlaka ya kiutawala.
- source_word: אֹצְרוֹת / הָאֹצָרוֹת
  choice: hazina / hazina
  rationale: אֹצָר inaweza kumaanisha hazina, ghala, au vitu vilivyohifadhiwa. Katika muktadha wa usimamizi wa kifalme na wa maeneo mbalimbali, “hazina” ni pana vya kutosha bila kuamua kama zilikuwa fedha, bidhaa, au majengo ya kuhifadhia.
- source_word: הַמֶּלֶךְ
  choice: za mfalme
  rationale: Huu ni uwasilishaji wa kawaida na wa wazi wa muundo wa Kiebrania unaomaanisha hazina zilizokuwa mali au chini ya mamlaka ya mfalme.
- source_word: עַזְמָוֶת
  choice: Azmawethi
  rationale: Jina limeandikwa kwa mfumo unaosomeka kwa kawaida katika Kiswahili huku likifuata konsonanti za jina la Kiebrania.
- source_word: בֶּן עֲדִיאֵל
  choice: mwana wa Adieli
  rationale: בֶּן katika utambulisho wa ukoo imetafsiriwa moja kwa moja kuwa “mwana wa”; umbo “Adieli” linaendana na matamshi na uandishi wa majina ya Biblia katika Kiswahili.
- source_word: בַּשָּׂדֶה
  choice: mashambani
  rationale: Ingawa Kiebrania kina nomino ya umoja, hapa ina maana ya kijumla ya maeneo ya mashambani, tofauti na miji, vijiji na minara. Wingi wa Kiswahili huwasilisha maana hiyo kwa kawaida.
- source_word: בֶּעָרִים
  choice: mijini
  rationale: Tafsiri ya mahali inayolingana na orodha ya maeneo ambako hazina zilipatikana.
- source_word: וּבַכְּפָרִים
  choice: vijijini
  rationale: כְּפָרִים humaanisha vijiji au makazi madogo ya mashambani; “vijijini” ni Kiswahili cha sasa na kilicho wazi.
- source_word: וּבַמִּגְדָּלוֹת
  choice: katika minara
  rationale: מִגְדָּלוֹת humaanisha “minara.” Chanzo hakisemi wazi kwamba ilikuwa minara ya ulinzi au yenye ngome, hivyo maelezo hayo hayajaongezwa.
- source_word: יְהוֹנָתָן
  choice: Yehonathani
  rationale: Umbo hili linahifadhi jina kamili la Kiebrania יְהוֹנָתָן na kulitofautisha na umbo fupi יוֹנָתָן, huku likibadilishwa kwa matamshi ya Kiswahili.
- source_word: בֶּן עֻזִּיָּהוּ
  choice: mwana wa Uzia
  rationale: “Mwana wa” ni tafsiri ya kawaida ya utambulisho wa ukoo, na “Uzia” ni umbo lililozoeleka la jina hili katika Kiswahili.
