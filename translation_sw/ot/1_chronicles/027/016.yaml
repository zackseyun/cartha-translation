  text: 'And over the tribes of Israel: for the Reubenites[a], Eliezer son of Zichri was leader; for the Simeonites, Shephatiah son of Maacah.'
translation:
  language: sw
  text: 'Na juu ya makabila ya Israeli: kwa Wareubeni, Eliezeri mwana wa Zikri alikuwa kiongozi[a]; kwa Wasimeoni, Shefatia mwana wa Maaka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkuu” au “mtawala” kwa neno la Kiebrania נָגִיד (nagid).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Na juu ya
  rationale: Huhifadhi kiunganishi na wazo la kuwa na mamlaka ya usimamizi katika orodha hii ya viongozi.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: makabila ya Israeli
  rationale: Ni tafsiri ya kawaida na ya wazi ya mnyororo wa umilikaji wa Kiebrania.
- source_word: לָרְאוּבֵנִי
  choice: kwa Wareubeni
  rationale: Umbo la jina la kabila linawarejelea watu wa kabila la Reubeni, si Reubeni binafsi.
- source_word: נָגִיד
  choice: kiongozi
  rationale: Neno hili humaanisha mtu aliyewekwa katika mamlaka; katika muktadha huu wa kiutawala, “kiongozi” ni la kawaida na haliongezi dhana ya kifalme.
- source_word: אֱלִיעֶזֶר בֶּן זִכְרִי
  choice: Eliezeri mwana wa Zikri
  rationale: Majina yamenukuliwa kwa maumbo yanayotambulika katika Kiswahili, na patronimiki imetafsiriwa moja kwa moja.
- source_word: לַשִּׁמְעוֹנִי
  choice: kwa Wasimeoni
  rationale: Umbo la jina la kabila linarejelea watu wa kabila la Simeoni na kudumisha ulinganifu wa orodha.
- source_word: שְׁפַטְיָהוּ בֶּן מַעֲכָה
  choice: Shefatia mwana wa Maaka
  rationale: Majina yamenukuliwa, na “mwana wa” huhifadhi muundo wa Kiebrania bila kubainisha jinsia ya Maaka zaidi ya maandishi.
