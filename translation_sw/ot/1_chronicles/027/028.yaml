id: 1CH.27.28
reference: 1 Chronicles 27:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַל הַ/זֵּיתִ֤ים וְ/הַ/שִּׁקְמִים֙ אֲשֶׁ֣ר בַּ/שְּׁפֵלָ֔ה בַּ֥עַל חָנָ֖ן הַ/גְּדֵרִ֑י וְ/עַל אֹצְר֥וֹת הַ/שֶּׁ֖מֶן יוֹעָֽשׁ־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/028.yaml
  text: Over the olive trees and the sycamore trees in the Shephelah was Baal-hanan the Gederite[b][a]; and over the stores of oil was Joash.
translation:
  language: sw
  text: Msimamizi wa miti ya mizeituni na mikuyu[a] iliyokuwa katika Shefela[b] alikuwa Baal-Hanani, Mgederi; naye Yoashi alikuwa msimamizi wa ghala za mafuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, miti ya mikuyu-mtini.
    reason: lexical_alternative
  - marker: b
    text: Au, “nchi ya chini.” Shefela ni eneo la vilima vya chini vya Yuda.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל
  choice: Msimamizi wa ... alikuwa
  rationale: Katika orodha hii ya kiutawala, עַל huonyesha mtu aliyepewa dhamana ya kusimamia eneo au mali fulani. Muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: הַזֵּיתִים
  choice: miti ya mizeituni
  rationale: Katika muktadha wa usimamizi wa ardhi, nomino hii inarejelea miti, si matunda ya zeituni.
- source_word: וְהַשִּׁקְמִים
  choice: na mikuyu
  rationale: שִׁקְמִים ni miti aina ya sycamore-fig. Neno la kawaida la Kiswahili 'mikuyu' linafaa, huku tanbihi ikibainisha aina inayokusudiwa.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: iliyokuwa katika Shefela
  rationale: שְׁפֵלָה hapa yaelekea ni jina la eneo maalumu la vilima vya chini vya Yuda; jina limetoholewa na maana yake imeelezwa katika tanbihi.
- source_word: בַּעַל חָנָן
  choice: Baal-Hanani
  rationale: Jina la Kiebrania limetoholewa kwa namna inayosomeka katika Kiswahili, bila kutafsiri vipashio vyake.
- source_word: הַגְּדֵרִי
  choice: Mgederi
  rationale: Umbo hili ni la kimahali/kikabila, likimaanisha mtu wa Gederi; demonymu ya Kiswahili huhifadhi ufupi wa asili.
- source_word: אֹצְרוֹת
  choice: ghala
  rationale: Katika muktadha huu neno linaweza kumaanisha mahali pa kuhifadhia au akiba iliyohifadhiwa. 'Ghala' linaeleza vyema vituo vya kuhifadhi mafuta bila kudokeza hazina ya fedha.
- source_word: הַשֶּׁמֶן
  choice: za mafuta
  rationale: Muundo wa Kiebrania unamaanisha ghala zinazohusiana na mafuta, yaelekea mafuta ya zeituni; tafsiri haiongezi 'ya zeituni' kwa kuwa haijasemwa wazi hapa.
- source_word: יוֹעָשׁ
  choice: Yoashi
  rationale: Jina limetoholewa kwa kufuata maumbo ya kawaida ya majina ya Biblia katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini rahisi. Muundo wa 'msimamizi' unaweka wazi kazi ya kiutawala iliyodokezwa na עַל. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
