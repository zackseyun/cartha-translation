  text: kwa ajili ya Zabuloni, Ishmaya mwana wa Obadia; kwa ajili ya Naftali, Yerimothi mwana wa Azrieli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִזְבוּלֻן
  choice: kwa ajili ya Zabuloni
  rationale: Kiambishi ל katika orodha hii kinaonyesha jukumu la mwakilishi kwa kabila husika. Kauli hii ni ya kawaida na inaweka wazi maana hiyo bila kuongeza neno “kabila” lisilomo wazi katika Kiebrania.
- source_word: יִשְׁמַעְיָהוּ
  choice: Ishmaya
  rationale: Jina limetoholewa kwa muundo unaosomeka kwa urahisi katika Kiswahili huku likifuata umbo la Kiebrania.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika utambulisho wa nasaba, בן humaanisha mwana wa moja kwa moja; “mwana wa” ni kauli ya kawaida na yenye heshima katika Kiswahili.
- source_word: עֹבַדְיָהוּ
  choice: Obadia
  rationale: Hili ni umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili na linafaa kwa wasomaji wa Afrika Mashariki.
- source_word: לְנַפְתָּלִי
  choice: kwa ajili ya Naftali
  rationale: Kama ilivyo kwa Zabuloni, ל linaonyesha mgawo au uwakilishi wa afisa kwa kabila hilo.
- source_word: יְרִימוֹת
  choice: Yerimothi
  rationale: Jina limetoholewa kwa kufuata sauti za Kiebrania na kupewa umbo linaloweza kutamkwa kwa kawaida katika Kiswahili.
- source_word: עַזְרִיאֵל
  choice: Azrieli
  rationale: Jina limetoholewa kwa namna inayohifadhi utambulisho wake wa Kiebrania na kutamkika kwa urahisi katika Kiswahili.
