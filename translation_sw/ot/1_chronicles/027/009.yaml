base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/009.yaml
  text: 'The sixth, for the sixth month: Ira son of Ikkesh the Tekoite; and over his division were twenty-four thousand.'
translation:
  language: sw
  text: Wa sita, kwa mwezi wa sita, alikuwa Ira mwana wa Ikeshi, Mtekoa; kikosi chake kilikuwa na watu elfu ishirini na nne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: Wa sita
  rationale: Nambari ya mpangilio imetumika kwa ufupi katika orodha hii, ikimaanisha kiongozi wa sita; Kiswahili kinadumisha ufupi huo bila kuongeza cheo kisichotajwa wazi.
- source_word: לַחֹדֶשׁ הַשִּׁשִּׁי
  choice: kwa ajili ya mwezi wa sita
  rationale: Herufi ל katika muktadha huu wa utawala inaonyesha mgawo wa huduma kwa mwezi husika.
- source_word: עִירָא
  choice: Ira
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida katika Kiswahili.
- source_word: בֶן עִקֵּשׁ
  choice: mwana wa Ikeshi
  rationale: Huu ni muundo wa kawaida unaoonyesha uhusiano wa baba na mwana.
- source_word: הַתְּקוֹעִי
  choice: Mtekoa
  rationale: Neno la Kiebrania humtambulisha mtu anayetoka Tekoa; umbo la Kiswahili linadumisha utambulisho huo kwa ufupi.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: katika kikosi chake walikuwa
  rationale: מַחֲלֻקָה hapa ni kikosi cha kijeshi kilichopangwa kwa zamu; muundo huu wa Kiswahili unaeleza kwa kawaida idadi ya watu walio chini ya uongozi wake.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: watu elfu ishirini na nne
  rationale: Idadi imetolewa kwa mtindo wa kawaida wa Kiswahili; neno 'watu' limewekwa wazi kutokana na muktadha wa kikosi.
