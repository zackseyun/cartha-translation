  register: 'Lugha ni sanifu, yenye staha na inayoeleweka kwa urahisi. Majina yametolewa kwa maumbo yanayofaa Kiswahili: Asaheli, Yoabu na Zebadia. Usemi mfupi ‘Wa nne’ unadumisha mtindo wa orodha ya Kiebrania.'
