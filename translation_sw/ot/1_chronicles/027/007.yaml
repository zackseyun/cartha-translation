base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/007.yaml
  text: The fourth[a], for the fourth month, was Asahel the brother of Joab, and Zebadiah his son after him; and over his division were twenty-four thousand.
translation:
  language: sw
  text: Wa nne, kwa mwezi wa nne, alikuwa Asaheli ndugu yake Yoabu, na baada yake Zebadia mwanawe.[a] Kikosi chake kilikuwa na watu elfu ishirini na nne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Zebadia mwanawe alimfuata katika nafasi hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְבִיעִי
  choice: Wa nne
  rationale: Kivumishi cha mpangilio kimetumiwa kama nomino katika orodha hii. Kiswahili kinadumisha usemi huo mfupi bila kuongeza waziwazi ‘kamanda’ au ‘kikosi’.
- source_word: לַחֹדֶשׁ הָרְבִיעִי
  choice: kwa mwezi wa nne
  rationale: Kiambishi ל kinaonyesha zamu au mgawo unaohusiana na mwezi; usemi huu ni wa kawaida na unaweka wazi mpangilio wa kila mwezi.
- source_word: עֲשָׂהאֵל
  choice: Asaheli
  rationale: Hili ni umbo la jina linalofaa matamshi na tahajia za Kiswahili.
- source_word: אֲחִי יוֹאָב
  choice: ndugu yake Yoabu
  rationale: Kirai cha Kiebrania kinamtambulisha Asaheli kwa uhusiano wake na Yoabu; ‘ndugu yake Yoabu’ ni cha asili katika Kiswahili.
- source_word: וּזְבַדְיָה בְנוֹ אַחֲרָיו
  choice: na baada yake Zebadia mwanawe
  rationale: אַחֲרָיו maana yake ya msingi ni ‘baada yake’ na katika muktadha huu inaashiria kuwa Zebadia alifuatia katika nafasi hiyo. Tafsiri inadumisha usemi wa chanzo bila kufafanua kupita kiasi.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Kikosi chake kilikuwa na
  rationale: מַחֲלֻקָה hapa ni kikosi au zamu ya kijeshi. Kiswahili hiki cha kawaida kinaeleza idadi ya waliokuwa katika kikosi bila kuiga kwa ugumu nahau ya Kiebrania ya ‘juu ya kikosi chake’.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: watu elfu ishirini na nne
  rationale: Huu ni uwasilishaji wa kawaida wa Kiswahili wa idadi 24,000; ‘watu’ imeongezwa kutokana na muktadha wa kikosi cha kijeshi.
