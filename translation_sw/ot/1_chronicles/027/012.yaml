base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/012.yaml
  text: 'The ninth, for the ninth month: Abiezer the Anathothite, from Benjamin; and over his division were twenty-four thousand.'
translation:
  language: sw
  text: Kiongozi wa tisa, kwa mwezi wa tisa, alikuwa Abiezeri, Mwanathothi, Mbenyamini. Kikosi chake kilikuwa na watu elfu ishirini na nne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַתְּשִׁיעִי לַחֹדֶשׁ הַתְּשִׁיעִי
  choice: Wa tisa, kwa mwezi wa tisa
  rationale: Imehifadhi mpangilio wa orodha na urudiaji wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: הָעַנְּתֹתִי
  choice: Mw-Anathothi
  rationale: Ni jina la kuonyesha mtu aliyetoka Anathothi; umbo hili ni fupi na linaeleweka katika mtindo wa majina ya kibiblia.
- source_word: ל/בנימיני
  choice: kutoka Benyamini
  rationale: Maandishi ya Kimasora yana ketiv isiyo na vokali ל/בנימיני, huku muktadha ukionyesha uhusiano na Benyamini. 'Kutoka Benyamini' huhifadhi uhusiano huo bila kulazimisha maana ya kikabila iliyo mahususi zaidi.
- source_word: מַחֲלֻקְתּוֹ
  choice: kikosi chake
  rationale: Katika muktadha wa makundi ya kijeshi yanayohudumu kwa zamu, 'kikosi' ni neno la asili na sahihi kuliko 'mgawanyiko'.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: watu 24,000
  rationale: Idadi inarejelea wanajeshi wa kikosi; 'watu' huifanya sentensi iwe wazi kwa Kiswahili bila kubadili idadi.
