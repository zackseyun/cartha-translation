  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַל הַ֨/כְּרָמִ֔ים שִׁמְעִ֖י הָ/רָֽמָתִ֑י וְ/עַ֤ל שֶׁ/בַּ/כְּרָמִים֙ לְ/אֹצְר֣וֹת הַ/יַּ֔יִן זַבְדִּ֖י הַ/שִּׁפְמִֽי־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/027.yaml
  text: Over the vineyards was Shimei the Ramathite[b][a]; and over the produce of the vineyards for the wine cellars was Zabdi the Shiphmite.
translation:
  language: sw
  text: Shimei Mramathi alikuwa msimamizi wa mashamba ya mizabibu; naye Zabdi Mshifmi alikuwa msimamizi wa mazao ya mashamba hayo[a] kwa ajili ya maghala ya divai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kile kilichokuwa katika mashamba ya mizabibu”; huenda hapa inamaanisha mazao ya mashamba hayo.
    reason: lexical_alternative
  - marker: b
    text: Au, “hazina za divai.” Neno la Kiebrania linaweza kumaanisha ghala, hazina, au mahali pa kuhifadhia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַכְּרָמִים
  choice: alikuwa msimamizi wa mashamba ya mizabibu
  rationale: Katika orodha hii ya watumishi, עַל humaanisha kuwa na usimamizi au wajibu juu ya kitu. Muundo huu ni wa asili katika Kiswahili na unaonyesha dhima ya kiutawala.
- source_word: שִׁמְעִי
  choice: Shimei
  rationale: Jina la mtu limetoholewa kwa namna inayotambulika katika mapokeo ya Biblia ya Kiswahili.
- source_word: הָרָמָתִי
  choice: Mramathi
  rationale: Neno hili ni jina la kinasaba au la mahali linalomhusianisha Shimei na Rama; umbo la Kiswahili linahifadhi sifa hiyo bila kuamua kimyakimya kuwa maana yake lazima iwe ‘kutoka Rama.’
- source_word: שֶׁבַּכְּרָמִים
  choice: mazao ya mashamba hayo
  rationale: Kihalisi ni ‘kile kilichokuwa katika mashamba ya mizabibu.’ Katika muktadha wa usimamizi wa divai, linaelekea kumaanisha mazao ya mashamba hayo, tofauti na mashamba yenyewe. Tanbihi inahifadhi maana halisi na uwezekano wake.
- source_word: לְאֹצְרוֹת הַיַּיִן
  choice: kwa ajili ya maghala ya divai
  rationale: אֹצָר inaweza kuwa ghala, hazina, au mahali pa kuhifadhia. Pamoja na ‘divai,’ ‘maghala ya divai’ hueleza kwa uwazi vituo vya kuhifadhia divai, huku ‘kwa ajili ya’ ikihifadhi uhusiano wa לְ bila kuongeza tendo lisilotajwa kama ‘kupelekwa.’
- source_word: זַבְדִּי
  choice: Zabdi
  rationale: Jina la mtu limetoholewa kwa namna inayotambulika katika Kiswahili.
- source_word: הַשִּׁפְמִי
  choice: Mshifmi
  rationale: Ni jina la kinasaba au la mahali ambalo mahali pake hasa hapana uhakika. Kulihifadhi kama jina la kumtambulisha mtu huepuka ufafanuzi wa kubahatisha.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida na unaoeleweka. ‘Msimamizi’ hufanya muundo wa kiutawala uwe wazi; ‘mashamba ya mizabibu’ na ‘maghala ya divai’ ni maneno ya sasa na ya asili. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyofafanuliwa.
