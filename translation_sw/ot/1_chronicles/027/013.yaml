  terminology: “Mnetofa” ni umbo la kawaida na linaloeleweka zaidi la gentiliki inayotokana na Netofa kuliko “Mnetofathi.” “Zera” huhifadhi jina la ukoo kwa uwazi; “wa ukoo wa Zera” hutoa kwa kawaida maana ya uhusiano wa ukoo bila kudai zaidi ya matini.
