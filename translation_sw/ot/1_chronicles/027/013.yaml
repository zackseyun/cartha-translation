base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/013.yaml
  text: 'The tenth[a], for the tenth month: Mahrai the Netophathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: sw
  text: Wa kumi, kwa mwezi wa kumi, alikuwa Maharai Mnetofa, wa ukoo wa Zera; kikosi chake kilikuwa na watu elfu ishirini na nne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲשִׂירִי
  choice: Wa kumi
  rationale: Kivumishi cha mpangilio kimetumiwa kama nomino katika orodha hii; muktadha unaonyesha kuwa ni kiongozi wa zamu ya kumi.
- source_word: לַחֹדֶשׁ הָעֲשִׂירִי
  choice: kwa ajili ya mwezi wa kumi
  rationale: Kirai kinaonyesha mgawo wa zamu ya huduma ya mwezi wa kumi.
- source_word: מַהְרַי
  choice: Maharai
  rationale: Jina limetoholewa kwa namna inayokaribia umbo la Kiebrania na inayosomeka kwa Kiswahili.
- source_word: הַנְּטוֹפָתִי
  choice: Mnetofathi
  rationale: Neno la nasaba/mahali linaonyesha mtu wa Netofa; umbo la Kiswahili limetumiwa kwa ufupi.
- source_word: לַזַּרְחִי
  choice: wa ukoo wa Wazerahi
  rationale: Ingawa umbo la Kiebrania ni la kivumishi cha nasaba, hapa linaonyesha uhusiano wa ukoo wa Zerahi.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: na katika kikosi chake walikuwa watu
  rationale: מַחֲלֻקָה katika sura hii ni kikosi cha kijeshi kilichopangiwa zamu; tafsiri hii inaeleza kwa Kiswahili cha kawaida idadi ya watu waliokuwa chini ya uongozi wake.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: elfu ishirini na nne
  rationale: Huu ni uwasilishaji wa kawaida wa Kiswahili wa idadi hiyo.
