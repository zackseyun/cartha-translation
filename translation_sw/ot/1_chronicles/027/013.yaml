  verdict: revise
  source_fidelity: 'Maana ya msingi imehifadhiwa: mgawo wa kumi wa mwezi wa kumi, Maharai, asili yake ya Netofa, uhusiano wake na Zera, na idadi ya watu 24,000. Hata hivyo, majina ya mahali/ukoo yanahitaji kusawazishwa ili yalingane kwa karibu zaidi na umbo la Kiebrania na matumizi ya kawaida ya Kiswahili.'
