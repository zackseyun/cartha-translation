source:
  edition: WLC
  text: יוֹאָ֨ב בֶּן צְרוּיָ֜ה הֵחֵ֤ל לִ/מְנוֹת֙ וְ/לֹ֣א כִלָּ֔ה וַ/יְהִ֥י בָ/זֹ֛את קֶ֖צֶף עַל יִשְׂרָאֵ֑ל וְ/לֹ֤א עָלָה֙ הַ/מִּסְפָּ֔ר בְּ/מִסְפַּ֥ר דִּבְרֵֽי הַ/יָּמִ֖ים לַ/מֶּ֥לֶךְ דָּוִֽיד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/024.yaml
  text: Joab son of Zeruiah began to count[a], but he did not finish; and because of this wrath came upon Israel[b]. And the number was not entered in the account of the chronicles of King David.
translation:
  language: sw
  text: Yoabu mwana wa Seruya alianza kuhesabu, lakini hakumaliza; na kwa sababu ya jambo hilo, ghadhabu ikawapata Israeli. Nayo idadi hiyo haikuingizwa[a] katika orodha ya kumbukumbu za matukio ya Mfalme Daudi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “haikujumuishwa” au “haikuandikwa.” Kiebrania kinasema kihalisi “haikupanda,” nahau inayomaanisha kuingizwa katika kumbukumbu rasmi.
    reason: lexical_alternative
  - marker: b
    text: “Kumbukumbu za matukio” ni annali za kifalme, yaani kumbukumbu rasmi zilizohusishwa na Mfalme Daudi.
    reason: cultural_note
lexical_decisions:
- source_word: הֵחֵל לִמְנוֹת
  choice: alianza kuhesabu
  rationale: Muundo huu unaakisi kitenzi ‘kuanza’ pamoja na ‘kuhesabu’ bila kuongeza wazi wazo la sensa ambalo halitajwi moja kwa moja katika kifungu hiki.
- source_word: וְלֹא כִלָּה
  choice: lakini hakumaliza
  rationale: Kitenzi כִּלָּה hapa kina maana ya kukamilisha au kumaliza; ‘hakumaliza’ ni Kiswahili cha kawaida na chenye uwazi.
- source_word: וַיְהִי בָזֹאת קֶצֶף עַל יִשְׂרָאֵל
  choice: na kwa sababu ya jambo hilo, ghadhabu ikawapata Israeli
  rationale: ‘Kwa sababu ya jambo hilo’ huwasilisha uhusiano wa sababu katika בָזֹאת, huku ‘ghadhabu ikawapata Israeli’ ikiacha chanzo cha ghadhabu bila kutajwa, kama ilivyo katika Kiebrania.
- source_word: הַמִּסְפָּר
  choice: idadi hiyo
  rationale: Neno hili linarejelea jumla iliyotokana na kuhesabu; ‘idadi hiyo’ linaunganisha kwa kawaida na tendo lililotajwa awali.
- source_word: וְלֹא עָלָה
  choice: haikuingizwa
  rationale: Ingawa עָלָה kwa kawaida ni ‘kupanda’, hapa ni nahau ya kiutawala yenye maana ya kuingizwa au kuandikwa katika kumbukumbu rasmi.
- source_word: בְּמִסְפַּר דִּבְרֵי הַיָּמִים
  choice: katika kumbukumbu za matukio
  rationale: דִּבְרֵי הַיָּמִים humaanisha kumbukumbu rasmi za matukio au annali. Tafsiri hii ni ya kawaida na inaeleweka kwa wasomaji wa Kiswahili bila kutokeza usemi mgumu wa neno kwa neno.
- source_word: לַמֶּלֶךְ דָּוִיד
  choice: ya Mfalme Daudi
  rationale: Kiambishi ל hapa huonyesha uhusiano wa kumbukumbu hizo na Mfalme Daudi; ‘ya Mfalme Daudi’ ni asilia katika Kiswahili na hakidokezi kwamba idadi hiyo iliwasilishwa kwake binafsi.
theological_decisions:
- issue: Ikiwa chanzo cha ghadhabu kitajwe wazi kuwa Mungu
  choice: 'Chanzo hakitajwi: ‘ghadhabu ikawapata Israeli’'
  alternative: ‘ghadhabu ya BWANA ikawapata Israeli’ au ‘Mungu akawakasirikia Israeli’
  rationale: Kifungu cha Kiebrania hakimtaji Mungu wazi kuwa mtendaji, ingawa muktadha mpana unaelekeza kwenye ghadhabu ya Mungu. Kuacha mtendaji bila kutajwa kunahifadhi namna ya matini na mvutano wake wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Nayo’ linaendeleza kiunganishi cha Kiebrania na kuhamisha mkazo kwa idadi iliyopatikana. Alama za tanbihi zimewekwa karibu na maneno yanayofafanuliwa.
