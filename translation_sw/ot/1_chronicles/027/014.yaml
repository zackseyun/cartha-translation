base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/014.yaml
  text: For the twelfth month[a], Benaiah the Pirathonite, from the sons of Ephraim; and over his division were twenty-four thousand.
translation:
  language: sw
  text: Wa kumi na moja, kwa mwezi wa kumi na moja, alikuwa Benaya Mpirathoni, mmoja wa wana wa Efraimu[a]; katika kikosi chake walikuwa watu 24,000.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mmoja wa kabila la Efraimu.” Kiebrania kinasema kihalisi, “kutoka kwa wana wa Efraimu,” kikionyesha asili ya kikabila.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר לְעַשְׁתֵּי עָשָׂר הַחֹדֶשׁ
  choice: Wa kumi na moja, kwa mwezi wa kumi na moja
  rationale: Kirai cha Kiebrania עַשְׁתֵּי עָשָׂר kinamaanisha ‘kumi na moja,’ si ‘kumi na mbili.’ Muundo unaofuata orodha ya sura hii unamtaja kiongozi wa kumi na moja na mwezi wake wa kumi na moja. Hivyo tafsiri inafuata ushahidi wa WLC hata ingawa matini ya mashauriano ya Kiingereza ina ‘twelfth.’
- source_word: בְּנָיָה
  choice: Benaya
  rationale: Jina limetoholewa kwa tahajia ya kawaida na inayoeleweka katika Kiswahili.
- source_word: הַפִּרְעָתוֹנִי
  choice: Mpirathoni
  rationale: Jina hili la mahali au asili linawakilishwa kwa umbo la Kiswahili linalomaanisha mtu wa Pirathoni.
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: mmoja wa wana wa Efraimu
  rationale: Kiebrania kinasema kihalisi ‘kutoka kwa wana wa Efraimu.’ Katika muktadha huu ni usemi wa nasaba ya kikabila, si lazima mwana wa moja kwa moja; ‘mmoja wa wana wa Efraimu’ huhifadhi ladha ya ukoo huku ikiwa ya kawaida kwa Kiswahili.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: katika kikosi chake walikuwa
  rationale: מַחֲלֻקָה hapa ni kikosi au zamu ya kijeshi chini ya uongozi wake. Kiswahili hiki huwasilisha maana ya kiutawala na kuunganisha kwa kawaida idadi inayofuata.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: watu 24,000
  rationale: Idadi ni elfu ishirini na nne. Neno ‘watu’ linafafanua kwa kawaida kuwa kinachohesabiwa ni wanajeshi wa kikosi, jambo linaloonyeshwa na muktadha wa sura.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaosomeka kwa urahisi. Neno ‘kikosi’ linafaa muktadha wa mgawanyo wa kijeshi. Marudio ‘wa kumi na moja, kwa mwezi wa kumi na moja’ yamehifadhiwa kwa sababu ni sehemu ya muundo wa orodha ya Kiebrania.
