base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/015.yaml
  text: The twelfth[a], for the twelfth month, was Heldai the Netophathite, of Othniel[b]; and over his division were twenty-four thousand.
translation:
  language: sw
  text: Wa kumi na mbili, kwa mwezi wa kumi na mbili, alikuwa Heldai[a] Mnetofathi, wa Othnieli[b]; kikosi chake kilikuwa na watu elfu ishirini na nne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya mapokeo yanayolingana yana jina “Heledi” badala ya “Heldai.”
    reason: cross_reference
  - marker: b
    text: Au, “aliye wa ukoo wa Othnieli” au “aliyetokana na Othnieli.” Muundo wa Kiebrania yaelekea unaonyesha uhusiano wa familia au ukoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: Kikosi cha kumi na mbili
  rationale: Kirai cha Kiebrania ni cha kiidadi na kimefupishwa; muktadha wa orodha ya zamu za kijeshi unaonyesha kuwa kinachokusudiwa ni kikosi cha kumi na mbili.
- source_word: לִשְׁנֵים עָשָׂר הַחֹדֶשׁ
  choice: kwa mwezi wa kumi na mbili
  rationale: Kiambishi ל־ kinaonyesha mwezi ambao kikosi kilipewa zamu; tafsiri hii ni ya kawaida na inaendeleza muundo wa chanzo.
- source_word: חֶלְדַּי
  choice: Heldai
  rationale: Jina limetoholewa moja kwa moja kulingana na umbo la maandishi ya Kiebrania katika aya hii.
- source_word: הַנְּטוֹפָתִי
  choice: Mnetofathi
  rationale: Ni jina la kumtambulisha mtu kwa asili yake kutoka Netofa; umbo la Kiswahili ni fupi na la kawaida katika lugha ya Biblia.
- source_word: לְעָתְנִיאֵל
  choice: wa Othnieli
  rationale: Kirai hiki huenda kinaonyesha uhusiano wa familia au ukoo. Neno “wa” linahifadhi kiasi fulani cha uwazi wa Kiebrania bila kudai uhusiano mahsusi.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: katika kikosi chake walikuwa
  rationale: מַחֲלֻקָה hapa ni kikosi au zamu ya kijeshi. Muundo huu ni Kiswahili cha kawaida kwa kutaja idadi ya watu wa kikosi.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: watu elfu ishirini na nne
  rationale: Idadi imeandikwa kwa maneno katika mtindo wa masimulizi; “watu” imewekwa wazi kutokana na muktadha wa wanajeshi.
