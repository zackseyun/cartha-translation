  text: And Ahithophel was counselor to the king[a], and Hushai the Archite was the king’s friend.
translation:
  language: sw
  text: Naye Ahithofeli alikuwa mshauri wa mfalme, na Hushai Mwariki alikuwa rafiki[a] wa mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwenzi” au “mshirika”; neno la Kiebrania linaweza kumaanisha rafiki kwa ujumla, na katika mazingira ya kifalme linaweza pia kumaanisha mtu wa karibu na mfalme katika ikulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיתֹפֶל
  choice: Ahithofeli
  rationale: Jina la mtu limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili huku likifuata sauti za Kiebrania.
- source_word: יוֹעֵץ
  choice: mshauri
  rationale: Neno hili humaanisha mtu anayetoa shauri; hapa linafaa katika mazingira ya utumishi wa kifalme bila kulifanya kwa lazima kuwa cheo rasmi.
- source_word: לַמֶּלֶךְ
  choice: wa mfalme
  rationale: Ingawa kihusishi cha Kiebrania kinaweza kutafsiriwa kwa muundo wa ‘kwa mfalme,’ Kiswahili cha kawaida hutumia ‘mshauri wa mfalme’ kuonyesha uhusiano wa huduma kwa mfalme.
- source_word: חוּשַׁי
  choice: Hushai
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa.
- source_word: הָאַרְכִּי
  choice: Mwarki
  rationale: Ni jina la uhusiano wa ukoo au mahali; limetoholewa katika umbo la Kiswahili linalomtambulisha mtu wa kundi au eneo hilo.
- source_word: רֵעַ
  choice: rafiki
  rationale: Hili ndilo neno la kawaida na la wazi katika Kiswahili; linaweza pia kudokeza mwandamani au mtu wa karibu wa mfalme katika mazingira ya ikulu, jambo linalobainishwa katika tanbihi.
- source_word: הַמֶּלֶךְ
  choice: wa mfalme
  rationale: Muundo huu unaonyesha uhusiano na mfalme, na ‘rafiki wa mfalme’ ni Kiswahili cha asili na kilicho wazi.
- source_word: וַ / וְ
  choice: Naye ... na
  rationale: Viunganishi vinaendeleza orodha ya maafisa na kuunganisha taarifa mbili; ‘Naye’ na ‘na’ vinatoa mtiririko wa kawaida wa Kiswahili.
