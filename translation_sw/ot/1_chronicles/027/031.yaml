translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ya kwanza umewekwa wa asili kwa Kiswahili huku ukihifadhi maana ya usimamizi katika orodha ya maafisa. Alama ya tanbihi [a] imewekwa moja kwa moja baada ya jina la jamii.
