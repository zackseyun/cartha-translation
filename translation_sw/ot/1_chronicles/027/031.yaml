  text: Over the flocks was Jaziz the Hagrite[a]. All these were officers over the property that belonged to King David.
translation:
  language: sw
  text: Yazizi, Mhagri,[a] ndiye aliyesimamia mifugo ya kondoo na mbuzi. Hao wote walikuwa maafisa waliosimamia mali ya Mfalme Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mhagari.” Jina la kikabila la Kiebrania linaweza kutoholewa kwa namna zote mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַצֹּאן
  choice: aliyesimamia makundi ya kondoo na mbuzi
  rationale: Katika orodha hii, עַל huonyesha wajibu wa usimamizi. צֹאן ni mifugo midogo inayoweza kujumuisha kondoo na mbuzi; kutaja wote wawili kunahifadhi upana wa neno la Kiebrania kwa Kiswahili cha kawaida.
- source_word: יָזִיז
  choice: Jazizi
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: הַהַגְרִי
  choice: Mhagri
  rationale: Ni jina la mtu kwa mujibu wa kabila au jamii yake; umbo la Kiswahili lenye kiambishi M- linaonyesha mtu mmoja bila kulifanya kuwa maelezo ya ziada.
- source_word: כָּל אֵלֶּה
  choice: Hao wote
  rationale: Ni muhtasari wa watu waliotajwa katika orodha iliyotangulia, kwa Kiswahili cha asili na kinachoeleweka.
- source_word: שָׂרֵי
  choice: maafisa waliosimamia
  rationale: Katika muktadha huu שָׂרֵי ni wasimamizi wa rasilimali za kifalme, si lazima wakuu wa kijeshi au wana wa kifalme.
- source_word: הָרְכוּשׁ
  choice: mali
  rationale: רְכוּשׁ humaanisha mali au milki; 'mali' ni neno pana, la kawaida, na linalofaa muhtasari wa rasilimali zilizoorodheshwa.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: ya Mfalme Daudi
  rationale: Muundo huu unaonyesha kwamba mali hiyo ilikuwa ya Mfalme Daudi; Kiswahili hiki ni kifupi na cha asili.
