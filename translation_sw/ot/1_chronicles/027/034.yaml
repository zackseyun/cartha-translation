base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/034.yaml
  text: After Ahithophel came Jehoiada son of Benaiah and Abiathar[a]; and Joab was commander of the army for the king.
translation:
  language: sw
  text: Baada ya Ahithofeli wakaja Yehoyada mwana wa Benaya na Abiathari[a]; naye Yoabu alikuwa mkuu wa jeshi la mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “Baada ya Ahithofeli, Yehoyada mwana wa Benaya na Abiathari.” Kiebrania hakitaji kitenzi waziwazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי
  choice: Baada ya ... wakaja
  rationale: אַחֲרֵי humaanisha ‘baada ya’. Kwa kuwa Kiebrania hakitaji kitenzi, ‘wakaja’ kinawekwa wazi ili kuonyesha mfuatano wa watu katika orodha hii, bila kudai zaidi ya muktadha.
- source_word: אֲחִיתֹפֶל
  choice: Ahithofeli
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: יְהוֹיָדָע
  choice: Yehoyada
  rationale: Jina la mtu limetoholewa moja kwa moja kutoka Kiebrania kwa muundo unaofaa Kiswahili.
- source_word: בֶּן בְּנָיָהוּ
  choice: mwana wa Benaya
  rationale: Ni muundo wa kawaida wa Kiebrania unaotaja nasaba; ‘mwana wa’ ni Kiswahili cha kawaida na sahihi.
- source_word: וְ/אֶבְיָתָר
  choice: na Abiathari
  rationale: Kiunganishi וְ kimetafsiriwa ‘na’; mpangilio wa sentensi unamjumuisha Abiathari pamoja na Yehoyada baada ya Ahithofeli.
- source_word: וְ/שַׂר צָבָא
  choice: naye ... alikuwa mkuu wa jeshi
  rationale: שַׂר צָבָא humaanisha kiongozi mkuu wa kijeshi. Kitenzi ‘alikuwa’ kimeongezwa kwa ulazima wa Kiswahili kwa sababu kishazi cha Kiebrania hakina kitenzi kilichotajwa wazi.
- source_word: לַ/מֶּלֶךְ
  choice: la mfalme
  rationale: לַמֶּלֶךְ huonyesha uhusiano au utumishi kwa mfalme; katika Kiswahili, ‘jeshi la mfalme’ ni usemi wa kawaida unaowasilisha uhusiano huo.
- source_word: יוֹאָב
  choice: Yoabu
  rationale: Jina la mtu limetoholewa kwa umbo linalotambulika na kusomeka kwa urahisi katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inatumia ‘wakaja’ kuifanya sentensi ya orodha ieleweke kwa kawaida, huku tanbihi ikihifadhi muundo usio na kitenzi wa Kiebrania.
