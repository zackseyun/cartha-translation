  yaml_path: translation/ot/1_chronicles/027/026.yaml
  text: And over those who did the work of the field for the cultivation of the ground was Ezri son of Chelub[a][b].
translation:
  language: sw
  text: Na aliyewasimamia wale waliokuwa wakifanya kazi za shambani[a] kwa kuifanyia kazi ardhi[b] alikuwa Ezri mwana wa Kelubu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wafanyakazi wa mashambani.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa kazi ya ardhi.” Kirai hiki kinarejelea kazi ya kilimo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Na aliyesimamia
  rationale: Katika orodha hii ya wasimamizi, עַל humtambulisha mtu aliyewekwa juu ya eneo fulani la wajibu. Tafsiri hii inadumisha kiunganishi וְ na maana ya usimamizi kwa Kiswahili cha kawaida.
- source_word: עֹשֵׂי מְלֶאכֶת הַשָּׂדֶה
  choice: wale waliofanya kazi mashambani
  rationale: Kirai hiki kinawataja watu waliojihusisha na kazi za kilimo. ‘Mashambani’ ni usemi wa asili wa Kiswahili unaowasilisha maana ya kazi ya shambani bila kuipanua kupita Kiebrania.
- source_word: לַעֲבֹדַת הָאֲדָמָה
  choice: kwa ajili ya kulima ardhi
  rationale: עֲבֹדָה pamoja na אֲדָמָה hapa hurejelea kuitumia au kuifanyia kazi ardhi kwa kilimo. ‘Kulima ardhi’ ni wazi na ya kawaida kwa wasomaji wa sasa.
- source_word: עֶזְרִי בֶּן כְּלוּב
  choice: Ezri mwana wa Kelubu
  rationale: 'Majina yametoholewa kwa mwandiko wa Kiswahili, na בֶּן limetafsiriwa kwa mtindo wa kawaida wa taarifa za ukoo na utawala: ‘mwana wa.’'
