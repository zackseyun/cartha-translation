base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/020.yaml
  text: 'For the sons of Ephraim: Hoshea son of Azaziah[a]; for the half-tribe of Manasseh: Joel son of Pedaiah.'
translation:
  language: sw
  text: 'Kwa wana wa Efraimu: Hoshea[a] mwana wa Azazia; kwa nusu ya kabila la Manase: Yoeli mwana wa Pedaya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Hoshea pia huandikwa “Hosea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Kwa wana wa
  rationale: Kiambishi ל־ katika orodha hii kinaonyesha mgawo au wajibu kwa kundi fulani, na בְנֵי ni usemi wa kawaida wa kikabila, ‘wana wa.’
- source_word: אֶפְרַיִם
  choice: Efraimu
  rationale: Jina la kabila limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: הוֹשֵׁעַ
  choice: Hoshea
  rationale: Jina hili limetoholewa kwa kufuata umbo la Kiebrania na kulitofautisha na tahajia iliyozoeleka zaidi ya Hosea.
- source_word: בֶּן
  choice: mwana wa
  rationale: Huu ndio usemi wa kawaida wa Kiswahili unaoonyesha uhusiano wa kizazi katika orodha za majina.
- source_word: עֲזַזְיָהוּ
  choice: Azazia
  rationale: Jina la mtu limetoholewa kwa mtindo wa kawaida wa Kiswahili.
- source_word: לַחֲצִי שֵׁבֶט
  choice: kwa nusu ya kabila la
  rationale: ל־ inaonyesha mgawo, חֲצִי ni ‘nusu,’ na שֵׁבֶט ni ‘kabila’; muundo huu ni wa asili na wazi katika Kiswahili.
- source_word: מְנַשֶּׁה
  choice: Manase
  rationale: Jina la kabila limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: יוֹאֵל
  choice: Yoeli
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: פְּדָיָהוּ
  choice: Pedaya
  rationale: Jina la mtu limetoholewa kwa mtindo wa kawaida wa Kiswahili.
