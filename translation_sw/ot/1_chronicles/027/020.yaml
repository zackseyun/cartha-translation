  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa orodha na mgawo unaoonyeshwa na ל־: “Kwa wana wa Efraimu” na “kwa nusu ya kabila la Manase.” Majina, uhusiano wa mwana, na tofauti kati ya Efraimu na nusu ya Manase vimehifadhiwa. Cheo cha msimamizi hakimo ndani ya mstari huu wenyewe bali kinadokezwa na muktadha wa orodha, hivyo kutokiongeza kunahifadhi ufupi wa Kiebrania.'
