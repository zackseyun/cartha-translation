translation:
  language: sw
  text: 'Kwa Dani: Azareli mwana wa Yerohamu. Hao ndio waliokuwa viongozi[a] wa makabila ya Israeli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakuu” au “maafisa” badala ya “viongozi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/דָן
  choice: Kwa Dani
  rationale: Kiambishi לְ kinaanzisha kichwa cha kabila katika orodha hii ya kiutawala; “Kwa Dani” kinaonyesha kwa njia ya kawaida kiongozi aliyehusishwa na kabila hilo.
- source_word: עֲזַרְאֵל
  choice: Azareli
  rationale: Jina limetoholewa kwa kufuata namna ya kawaida ya Kiswahili ya kuandika majina ya Biblia huku likibaki karibu na matamshi ya Kiebrania.
- source_word: בֶּן
  choice: mwana wa
  rationale: Muundo huu unaonyesha uhusiano wa uzazi; “mwana wa” ni tafsiri ya kawaida na iliyo wazi katika taarifa za nasaba na kiutawala.
- source_word: יְרֹחָם
  choice: Yerohamu
  rationale: Tahajia hii inahifadhi sauti ya mwanzo ya Kiebrania na kutumia umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: אֵלֶּה
  choice: Hao
  rationale: Kiwakilishi hiki cha wingi kinarejelea watu waliotajwa katika orodha iliyotangulia; “hao” ni cha asili zaidi kwa watu kuliko “hawa” katika muhtasari wa kurejelea nyuma.
- source_word: שָׂרֵי
  choice: viongozi
  rationale: Katika muktadha wa usimamizi wa makabila, “viongozi” huwasilisha wazi jukumu lao bila kudokeza lazima cheo cha kifalme au urasimu wa kisasa.
- source_word: שִׁבְטֵי
  choice: wa makabila ya
  rationale: Wingi wa hali ya kuambatanisha umetafsiriwa moja kwa moja katika kishazi “viongozi wa makabila ya Israeli.”
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Hili ndilo umbo la kawaida la jina la taifa katika Kiswahili cha Biblia.
