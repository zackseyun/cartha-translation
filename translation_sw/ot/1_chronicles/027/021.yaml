base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/021.yaml
  text: 'for the half-tribe of Manasseh in Gilead: Iddo son of Zechariah[a]; for Benjamin: Jaasiel son of Abner.'
translation:
  language: sw
  text: 'kwa ajili ya nusu ya kabila la Manase huko Gileadi: Ido mwana wa Zekaria; kwa ajili ya Benyamini: Yaasieli mwana wa Abneri.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַ/חֲצִי הַֽ/מְנַשֶּׁה
  choice: kwa ajili ya nusu ya kabila la Manase
  rationale: Katika orodha hii ya kiutawala, לַחֲצִי hutaja sehemu ya kabila iliyowakilishwa na mkuu. Neno ‘kabila’ limeongezwa kwa uwazi kwa kuwa kinachokusudiwa ni nusu ya kabila la Manase.
- source_word: גִּלְעָדָ/ה
  choice: huko Gileadi
  rationale: Kiambishi elekezi hapa kinatambulisha eneo la ng’ambo ya Yordani lililohusishwa na nusu hii ya Manase; ‘huko Gileadi’ ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: יִדּוֹ
  choice: Ido
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili inayofuata matamshi ya Kiebrania.
- source_word: בֶּן זְכַרְיָהוּ
  choice: mwana wa Zekaria
  rationale: בֶּן ni kauli ya kawaida ya ukoo, ‘mwana wa’; Zekaria ni umbo la jina lililozoeleka katika Kiswahili cha Biblia.
- source_word: לְ/בִנְיָמִן
  choice: kwa ajili ya Benyamini
  rationale: Kiambishi לְ kinaonyesha kundi la kikabila lililowakilishwa na mkuu aliyetajwa; tafsiri hii pia inadumisha muundo sambamba wa orodha.
- source_word: יַעֲשִׂיאֵל
  choice: Yaasieli
  rationale: Tahajia hii inafuata vokali za maandishi ya Kimasora na kanuni za utohozi wa majina kwa Kiswahili.
- source_word: בֶּן אַבְנֵר
  choice: mwana wa Abneri
  rationale: Kauli ya ukoo imetafsiriwa kwa Kiswahili cha kawaida; Abneri ni umbo la jina lililozoeleka katika Biblia za Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo mfupi wa orodha na ulinganifu wa vipashio viwili umehifadhiwa. Tanbihi ya Kiingereza kuhusu ‘Jashiel son of Abner’ haijaingizwa kwa sababu inaonekana kuhamisha ‘mwana wa Abneri’ na si kutoa mbadala wa moja kwa moja unaoungwa mkono na maandishi ya WLC ya kifungu hiki.
