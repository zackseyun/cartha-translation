translation:
  language: sw
  text: 'Kwa Lawi: Hashabia mwana wa Kemueli; kwa Haruni[a]: Sadoki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “kwa Haruni”; huenda ikimaanisha ukoo wa kikuhani wa Haruni, yaani wazao wa Haruni.
    reason: cultural_note
lexical_decisions:
- source_word: לְ/לֵוִי
  choice: kwa Lawi
  rationale: Kiambishi לְ katika orodha hii ya kiutawala kinaonyesha kundi ambalo mtu alisimamia. Kutaja jina la babu ‘Lawi’ kunahifadhi umbo la Kiebrania bila kulipanua kuwa ‘Walawi.’
- source_word: חֲשַׁבְיָה
  choice: Hashabia
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: בֶן
  choice: mwana wa
  rationale: Huu ndio ulinganifu wa kawaida na wa asili wa muundo wa nasaba wa Kiebrania.
- source_word: קְמוּאֵל
  choice: Kemueli
  rationale: Jina la mtu limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: לְ/אַהֲרֹן
  choice: kwa Haruni
  rationale: Kama ilivyo kwa Lawi, לְ linaonyesha kundi au ukoo unaowakilishwa kwa jina la babu. Tafsiri hii inahifadhi usemi wa Kiebrania badala ya kuufafanua moja kwa moja kuwa ‘ukoo wa Haruni.’
- source_word: צָדוֹק
  choice: Sadoki
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Ikiwa ‘Haruni’ ifafanuliwe wazi kuwa ukoo wa kikuhani wa Haruni
  choice: Jina la babu ‘Haruni’ limehifadhiwa katika matini kuu.
  alternative: kwa ukoo wa Haruni; kwa wazao wa Haruni
  rationale: Kiebrania kinasema tu ‘kwa Haruni.’ Hili linadumisha metonimia na uwiano wa orodha bila kuingiza ufafanuzi katika matini; tanbihi inasaidia msomaji wa sasa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye hadhi unaofaa orodha ya kiutawala. Alama ya tanbihi imewekwa baada ya ‘Haruni,’ ambako maelezo yake yanahusika.
