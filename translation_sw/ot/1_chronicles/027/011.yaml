base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/011.yaml
  text: 'The eighth[a], for the eighth month: Sibbecai the Hushathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: sw
  text: Wa nane, kwa mwezi wa nane, alikuwa Sibekai Mhushathi, wa ukoo wa Zerahi[a]. Kikosi chake kilikuwa na watu elfu ishirini na nne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mzerahi.” Neno la Kiebrania linaweza kumtaja Sibekai moja kwa moja kuwa Mzerahi, lakini katika muktadha huu huenda linaonyesha kuwa alikuwa wa ukoo wa Zerahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: Wa nane
  rationale: Namba ya mpangilio imetumiwa kwa ufupi katika orodha hii; muktadha unaonyesha kuwa anayezungumziwa ni mkuu wa nane bila kulazimika kuongeza cheo kisichotajwa moja kwa moja hapa.
- source_word: לַחֹדֶשׁ הַשְּׁמִינִי
  choice: kwa mwezi wa nane
  rationale: Kirai hiki kinaonyesha mwezi ambao kikosi kilipangiwa kutumika; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: סִבְּכַי
  choice: Sibekai
  rationale: Jina limeandikwa kwa mwandiko unaofuata kwa karibu matamshi ya Kiebrania na unaosomeka kwa urahisi katika Kiswahili.
- source_word: הַחֻשָׁתִי
  choice: Mhushathi
  rationale: Umbo la jina linaonyesha asili au uhusiano wa ukoo/mahali; kiambishi M- kinatoa umbo la kawaida la jina la mtu wa kundi fulani katika Kiswahili.
- source_word: לַזַּרְחִי
  choice: wa ukoo wa Zerahi
  rationale: Katika muktadha wa orodha ya kijeshi, lamed pamoja na jina la nasaba inaeleweka vizuri kama uhusiano wa ukoo. Tafsiri hii inaeleza maana hiyo bila kuifanya kuwa jina la mtu mwingine.
- source_word: מַחֲלֻקְתּוֹ
  choice: kikosi chake
  rationale: Neno hili linamaanisha kundi la kijeshi lililopangwa kwa zamu; “kikosi” ni neno la sasa na linaloeleweka, bila kudokeza ukubwa mdogo kuliko idadi iliyotajwa.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: watu elfu ishirini na nne
  rationale: Hii ndiyo idadi ya walio chini ya mkuu huyo. Neno “watu” limeongezwa kwa uwazi wa Kiswahili kutokana na muktadha wa kikosi.
