translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. “Kikosi” kinaendeleza mazingira ya kijeshi ya sura hii, na “kilikuwa chini ya” kinaeleza uongozi kwa njia ya kawaida bila kuondoa utata wa kifungu kinachomhusu Miklothi.
