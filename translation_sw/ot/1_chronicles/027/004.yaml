base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/004.yaml
  text: Over the division for the second month was Dodai the Ahohite[a], and Mikloth was the leader over his division; and in his division were twenty-four thousand.
translation:
  language: sw
  text: Kikosi cha mwezi wa pili kilikuwa chini ya Dodai Mwahohi[a], naye Miklothi alikuwa kiongozi wa kikosi chake. Kikosi hicho kilikuwa na watu elfu ishirini na nne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Dodai Mwahohi na kikosi chake, Miklothi akiwa mkuu.” Mpangilio wa maneno ya Kiebrania umebanwa, na haiko wazi kabisa ikiwa Miklothi alikuwa msaidizi mkuu katika kikosi cha Dodai au ndiye aliyekiendesha moja kwa moja.
    reason: alternative_reading
lexical_decisions:
- source_word: מַחֲלֹקֶת
  choice: kikosi
  rationale: Katika muktadha huu wa kijeshi na kiutawala, neno hili linamaanisha kundi lililopangiwa zamu ya huduma ya kila mwezi. “Kikosi” ni neno la kawaida na la wazi katika Kiswahili.
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  choice: mwezi wa pili
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayoonyesha mwezi wa pili katika mpangilio wa zamu.
- source_word: דּוֹדַי
  choice: Dodai
  rationale: Umbo la jina katika aya hii limehifadhiwa kwa unukuzi wa kawaida badala ya kulibadilisha kuwa Dodo, umbo linalopatikana kwingine.
- source_word: הָאֲחוֹחִי
  choice: Mwahohi
  rationale: Ni jina la ukoo au asili ya mtu; umbo la Kiswahili lenye kiambishi Mwa- linaeleza kwa kawaida kwamba Dodai alikuwa wa ukoo wa Ahohi.
- source_word: וּמַחֲלֻקְתּוֹ
  choice: kikosi chake
  rationale: Kiambishi cha nafsi ya tatu umoja kimewasilishwa kwa “chake,” na neno limetafsiriwa kwa uthabiti kama “kikosi.”
- source_word: וּמִקְלוֹת
  choice: Miklothi
  rationale: Jina la mtu limenukuliwa kwa umbo linalosomeka kwa urahisi katika Kiswahili.
- source_word: הַנָּגִיד
  choice: kiongozi
  rationale: Neno la Kiebrania linaweza kumaanisha mkuu, mtawala, au kamanda. “Kiongozi” linafaa katika mazingira haya bila kubainisha cheo ambacho maandishi yenyewe hayabainishi.
- source_word: וְעַל־מַחֲלֻקְתּוֹ
  choice: wa kikosi chake
  rationale: Katika sentensi ya Kiswahili, uhusiano wa mamlaka unaonyeshwa kwa kumtaja Miklothi kuwa “kiongozi wa kikosi chake.” Hii inawasilisha maana ya עַל kwa njia ya asili, huku utata wa mpangilio wa Kiebrania ukielezwa katika tanbihi.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: elfu ishirini na nne
  rationale: Huu ni usemi wa kawaida wa Kiswahili kwa idadi 24,000.
