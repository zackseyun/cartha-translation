  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. Muundo wa sentensi umewekwa wazi na wa asili, huku usemi usio kamili kuhusu nafasi ya Yehieli ukihifadhiwa. Alama za tanbihi za safu ya Kiingereza zilionekana kutolingana na sehemu zilizoalamishwa; rasimu hii imeweka tanbihi kwenye kishazi kinachohusika.
