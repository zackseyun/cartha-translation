base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/032.yaml
  text: Jonathan[a], David’s uncle, was a counselor, a man of understanding, and a scribe[b]; and Jehiel son of Hachmoni was with the king’s sons.
translation:
  language: sw
  text: Yonathani, ndugu wa Daudi, alikuwa mshauri, mtu mwenye ufahamu na mwandishi; naye Yehieli mwana wa Hakmoni alikuwa pamoja na wana wa mfalme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi “alikuwa pamoja na wana wa mfalme.” Huenda maneno hayo yakadokeza kwamba aliwahudumia au aliwasimamia, lakini jukumu lake halijaelezwa wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד
  choice: mjomba
  rationale: Katika muktadha huu wa jamaa na maofisa wa Daudi, neno hili linaeleweka kwa kawaida kuwa uhusiano wa kifamilia. Kiswahili hulazimisha kubainisha upande wa ukoo; “mjomba” linafuata mapokeo ya tafsiri, ingawa Kiebrania hakibainishi upande huo.
- source_word: יוֹעֵץ
  choice: mshauri
  rationale: Ni mtu anayetoa mashauri, hasa katika nafasi rasmi ya kifalme.
- source_word: אִישׁ מֵבִין
  choice: mtu mwenye ufahamu
  rationale: Huhifadhi sifa ya uwezo wa kuelewa na kupambanua bila kuibana kuwa elimu au akili pekee.
- source_word: סוֹפֵר
  choice: mwandishi
  rationale: Neno linaweza kumaanisha mwandishi au afisa mwenye shughuli za uandishi; “mwandishi” huhifadhi upana huo bila kudai wazi kuwa alikuwa katibu.
- source_word: עִם
  choice: alikuwa pamoja na
  rationale: Hii ndiyo maana ya moja kwa moja ya kihusishi. Haiongezi wazo la usimamizi ambalo halijasemwa wazi katika Kiebrania.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: wana wa mfalme
  rationale: Hufuata kwa karibu Kiebrania kinachosema kihalisi “wana wa mfalme”; katika muktadha wanaweza pia kuitwa wana wa kifalme.
- source_word: חַכְמוֹנִי
  choice: Hakmoni
  rationale: Jina limetoholewa kwa tahajia inayoeleweka na wasomaji wa Kiswahili.
