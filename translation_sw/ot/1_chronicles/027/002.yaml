base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/002.yaml
  text: Over the first division for the first month was Jashobeam son of Zabdiel[a], and in his division were twenty-four thousand.
translation:
  language: sw
  text: Msimamizi wa kikosi cha kwanza kwa mwezi wa kwanza alikuwa Yashobeamu mwana wa Zabdieli, na kikosi chake kilikuwa na watu elfu ishirini na nne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “na juu ya kikosi chake, elfu ishirini na nne.” Kiebrania kinaacha kitenzi; maneno “kilikuwa na watu” yameongezwa ili kueleza idadi ya kikosi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הַמַּחֲלֹקֶת
  choice: Msimamizi wa kikosi
  rationale: Katika orodha hii ya kiutawala, עַל humtambulisha aliyewekwa juu ya kundi, na מַחֲלֹקֶת ni kikosi kilichopangwa kwa zamu. Muundo huu ni wa asili katika Kiswahili na unaonyesha mamlaka ya usimamizi.
- source_word: הָרִאשׁוֹנָה
  choice: cha kwanza
  rationale: Kivumishi hiki kinaonyesha nafasi ya kikosi katika mfululizo wa zamu za kila mwezi.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: kwa mwezi wa kwanza
  rationale: Kirai kinaonyesha mwezi ambao kikosi hicho kilipewa kuhudumu, si uhusiano wa umiliki tu.
- source_word: יָשָׁבְעָם
  choice: Yashobeamu
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili huku likibaki karibu na umbo la Kiebrania.
- source_word: בֶּן זַבְדִּיאֵל
  choice: mwana wa Zabdieli
  rationale: בֶּן katika utambulisho huu wa nasaba ina maana yake ya kawaida ya 'mwana wa'; jina Zabdieli limetoholewa kwa Kiswahili.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: na kikosi chake kilikuwa na watu
  rationale: Kiebrania ni kifupi, kihalisi 'na juu ya kikosi chake,' kisha hutaja idadi. Kiswahili huhitaji kitenzi kilichodokezwa; 'kilikuwa na watu' huonyesha ukubwa wa kikosi bila kubadili maana.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: elfu ishirini na nne
  rationale: Hii ndiyo namna ya kawaida na inayoeleweka ya kuandika idadi 24,000 kwa maneno katika Kiswahili.
theological_decisions: []
