base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/006.yaml
  text: This was Benaiah[a], a mighty man of the Thirty and over the Thirty; and his division was under Ammizabad his son.
translation:
  language: sw
  text: Huyu ndiye Benaya,[a] shujaa miongoni mwa wale Thelathini na mkuu wao; na katika kikosi chake alikuwamo Amizabadi, mwanawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yeye alikuwa Benaya, shujaa miongoni mwa wale Thelathini na juu ya wale Thelathini.”
    reason: Huhifadhi kwa karibu zaidi mpangilio na urudiaji wa Kiebrania, unaomwonyesha Benaya kuwa wa kundi la Thelathini na mwenye mamlaka juu yake.
lexical_decisions:
- source_word: הוּא בְנָיָהוּ
  choice: Huyu ndiye Benaya
  rationale: Kiashiria hiki kinaunganisha mstari na Benaya aliyetajwa katika mstari uliotangulia na kuhifadhi mkazo wa הוּא kwa Kiswahili cha kawaida.
- source_word: גִּבּוֹר
  choice: shujaa
  rationale: Katika muktadha huu neno linamaanisha mpiganaji hodari au mwenye ushujaa; “shujaa” ni la asili, lenye heshima, na haliongezi maelezo yasiyokuwamo.
- source_word: הַשְּׁלֹשִׁים
  choice: wale Thelathini
  rationale: Hili ni jina la kundi maalumu la mashujaa wa Daudi, si idadi isiyo na utambulisho; herufi kubwa inaonyesha hadhi hiyo.
- source_word: וְעַל הַשְּׁלֹשִׁים
  choice: na mkuu wao
  rationale: עַל hapa huonyesha mamlaka juu ya kundi. “Mkuu wao” hutoa maana hiyo kwa Kiswahili sanifu bila kulazimisha cheo mahususi kama “kamanda.”
- source_word: מַחֲלֻקְתּוֹ
  choice: kikosi chake
  rationale: Katika sura hii neno linamaanisha kikosi cha kijeshi kilichopangwa kwa zamu; “kikosi” ni wazi zaidi kuliko “mgawanyo” katika Kiswahili.
- source_word: עַמִּיזָבָד בְּנוֹ
  choice: mwanawe Amizabadi
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unaonyesha wazi kwamba Amizabadi alikuwa mwana wa Benaya.
