  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wale Thelathini” limetumiwa kama jina la kikundi maalumu, na “kikosi” linaafikiana na muktadha wa kijeshi wa sura nzima.
