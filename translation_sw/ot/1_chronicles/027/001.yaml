id: 1CH.27.1
reference: 1 Chronicles 27:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֣ל לְֽ/מִסְפָּרָ֡/ם רָאשֵׁ֣י הָ/אָב֣וֹת וְ/שָׂרֵ֣י הָֽ/אֲלָפִ֣ים וְ/הַ/מֵּא֡וֹת וְ/שֹׁטְרֵי/הֶם֩ הַ/מְשָׁרְתִ֨ים אֶת הַ/מֶּ֜לֶךְ לְ/כֹ֣ל דְּבַ֣ר הַֽ/מַּחְלְק֗וֹת הַ/בָּאָ֤ה וְ/הַ/יֹּצֵאת֙ חֹ֣דֶשׁ בְּ/חֹ֔דֶשׁ לְ/כֹ֖ל חָדְשֵׁ֣י הַ/שָּׁנָ֑ה הַֽ/מַּחֲלֹ֨קֶת֙ הָֽ/אַחַ֔ת עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׀׀־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/001.yaml
  text: The sons of Israel according to their number—the heads of fathers’ houses[a], and the commanders of thousands and of hundreds[c][b], and their officers who served the king in every matter of the divisions that came in and went out month by month throughout all the months of the year—each division was twenty-four thousand.
translation:
  language: sw
  text: Wana wa Israeli, kwa hesabu yao—viongozi wa jamaa za ukoo[a], makamanda wa maelfu na wa mamia, na maafisa wao waliomtumikia mfalme katika mambo yote yanayohusu makundi ya zamu yaliyoingia na kutoka, mwezi baada ya mwezi[b], katika miezi yote ya mwaka—kila kundi la zamu lilikuwa na watu elfu ishirini na nne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina istilahi ya kijamii na kiutawala inayomaanisha viongozi wa vikundi vya kifamilia vilivyotokana na babu mmoja.
    reason: cultural_note
  - marker: b
    text: Yaani, makundi ya zamu yalipokezana kuingia na kutoka katika huduma ya mfalme kila mwezi.
    reason: clarification
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Wana wa Israeli
  rationale: Inahifadhi usemi rasmi wa Kiebrania “wana wa Israeli,” ambao hapa unalitaja taifa kwa ujumla.
- source_word: לְמִסְפָּרָם
  choice: kwa hesabu yao
  rationale: Inaonyesha upangaji wao kwa mujibu wa idadi iliyohesabiwa.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: viongozi wa jamaa za ukoo
  rationale: Ni istilahi ya kiutawala inayohusu vikundi vya kifamilia vya asili ya pamoja; tafsiri hii ni ya asili kwa Kiswahili kuliko “vichwa vya nyumba za baba.”
- source_word: וְשָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: makamanda wa maelfu na wa mamia
  rationale: Katika muktadha wa vikosi, שרים ni viongozi au makamanda wenye mamlaka juu ya vitengo vya maelfu na mamia.
- source_word: וְשֹׁטְרֵיהֶם
  choice: maafisa wao
  rationale: Neno linaweza kumaanisha wasimamizi au maafisa wenye kazi za kiutawala; “maafisa” linaacha upeo huo wazi.
- source_word: הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: waliomtumikia mfalme
  rationale: Inawasilisha huduma rasmi na endelevu kwa mfalme bila kuibana kuwa ya kijeshi pekee.
- source_word: לְכֹל דְּבַר הַמַּחְלְקוֹת
  choice: katika shughuli zote za vikosi
  rationale: דבר hapa ni mambo au shughuli, na מחלקות ni makundi yaliyopangwa kwa zamu; “vikosi” linafaa katika muktadha huu.
- source_word: הַבָּאָה וְהַיֹּצֵאת
  choice: vilivyoingia na kutoka katika zamu ya huduma
  rationale: Maneno halisi ni “vilivyoingia na kutoka”; nyongeza “katika zamu ya huduma” inaweka wazi maana ya mzunguko bila kubadili picha ya kuingia na kutoka.
- source_word: חֹדֶשׁ בְּחֹדֶשׁ
  choice: mwezi baada ya mwezi
  rationale: Ni usemi wa mgawanyo unaoonyesha zamu zinazofuatana kila mwezi.
- source_word: לְכֹל חָדְשֵׁי הַשָּׁנָה
  choice: katika miezi yote ya mwaka
  rationale: Inaonyesha kwamba mpangilio huo uliendelea katika mwaka mzima.
- source_word: הַמַּחֲלֹקֶת הָאַחַת
  choice: kila kikosi
  rationale: 'Ingawa muundo wake ni “kikosi kimoja,” katika muktadha una maana ya mgawanyo: kila kikosi katika mzunguko.'
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: watu elfu ishirini na nne
  rationale: Idadi inahusu waliokuwa katika kila kikosi; “watu” imeongezwa kwa uwazi wa kawaida wa Kiswahili.
