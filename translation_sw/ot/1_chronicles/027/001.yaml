  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi ndefu ya orodha ya Kiebrania imehifadhiwa, huku vistari virefu vikitenganisha orodha na hitimisho. “Jamaa za ukoo” huepuka tafsiri ngumu ya neno kwa neno, na “zamu ya huduma” hufafanua mzunguko unaodokezwa na muktadha.
