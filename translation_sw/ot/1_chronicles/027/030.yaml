base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/030.yaml
  text: Over the camels was Obil the Ishmaelite[a], and over the female donkeys was Jehdeiah the Meronothite.
translation:
  language: sw
  text: Msimamizi wa ngamia alikuwa Obili, Mwishmaeli, na msimamizi wa punda-jike alikuwa Yehdeya, Mmeronoti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: Msimamizi wa ... alikuwa
  rationale: Katika orodha hii ya kiutawala, עַל huonyesha kuwa mtu amepewa jukumu la kusimamia mali. Muundo huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: הַגְּמַלִּים
  choice: ngamia
  rationale: Nomino hii ya wingi humaanisha ngamia; Kiswahili hakihitaji kibainishi tofauti ili kuonyesha uainisho wa Kiebrania hapa.
- source_word: אוֹבִיל
  choice: Obili
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: הַיִּשְׁמְעֵאלִי
  choice: Mwishmaeli
  rationale: Ni jina la nasaba au kundi linalomtambulisha Obili kwa uhusiano wake na Ishmaeli; umbo la Kiswahili 'Mwishmaeli' ni fupi na la kawaida.
- source_word: הָאֲתֹנוֹת
  choice: punda-jike
  rationale: אָתוֹן humaanisha hasa punda wa kike. 'Punda-jike' huhifadhi umahususi huo kwa lugha ya kawaida na yenye kueleweka.
- source_word: יֶחְדְּיָהוּ
  choice: Yekdeya
  rationale: Jina limetoholewa kutoka umbo la Kiebrania kwa kuzingatia sauti za Kiswahili.
- source_word: הַמֵּרֹנֹתִי
  choice: Mmeronoti
  rationale: Huenda ni jina la kumtambulisha mtu wa mahali paitwapo Meronoti; umbo la kivumishi cha nasaba/mahali limehifadhiwa bila kulazimisha ufafanuzi usio hakika.
