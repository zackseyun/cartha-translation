base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/029.yaml
  text: Over the herds grazing in Sharon was Shitrai the Sharonite[b][a], and over the herds in the valleys was Shaphat son of Adlai.
translation:
  language: sw
  text: Aliyesimamia makundi ya ng’ombe waliokuwa wakila malishoni katika Sharoni alikuwa Shitrai, Msharoni[a]; na aliyesimamia makundi ya ng’ombe katika mabonde alikuwa Shafati mwana wa Adlai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sharoni lilikuwa eneo tambarare la pwani ya Israeli; “Msharoni” maana yake ni mtu kutoka Sharoni.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל
  choice: aliyesimamia
  rationale: Katika orodha hii ya kiutawala, neno hili linaonyesha kuwa mtu alikuwa na jukumu la uangalizi; “aliyesimamia” ni Kiswahili cha kawaida na wazi.
- source_word: הַבָּקָר
  choice: makundi ya ng’ombe
  rationale: Neno בקר humaanisha ng’ombe au kundi la ng’ombe; usemi huu unaonyesha wanyama pamoja na hali ya kuwa katika makundi.
- source_word: הָרֹעִים
  choice: waliokuwa wakilisha
  rationale: Kitenzi-shirikishi cha רעה kinaonyesha ng’ombe waliokuwa wakila malishoni; “wakilisha” ni usemi wa kawaida wa Kiswahili cha Afrika Mashariki.
- source_word: בַּשָּׁרוֹן
  choice: katika Sharoni
  rationale: Sharoni ni jina la eneo, hivyo limetoholewa na kutanguliwa na kihusishi cha mahali.
- source_word: שטרי
  choice: Shitrai
  rationale: Jina la mtu limetoholewa kwa kufuata umbo la Kiebrania.
- source_word: הַשָּׁרוֹנִי
  choice: Msharoni
  rationale: Umbo la Kiebrania humtambulisha mtu kwa eneo alikotoka; “Msharoni” huhifadhi muundo huo kwa ufupi na kwa njia ya asili katika Kiswahili.
- source_word: בָּעֲמָקִים
  choice: katika mabonde
  rationale: Hili ndilo tafsiri ya moja kwa moja ya wingi wa עֵמֶק, nalo linafaa katika muktadha wa maeneo ya malisho.
- source_word: שָׁפָט
  choice: Shafati
  rationale: Jina la mtu limetoholewa katika umbo linalosomeka kwa urahisi katika Kiswahili.
- source_word: בֶּן עַדְלָי
  choice: mwana wa Adlai
  rationale: Huhifadhi kwa uwazi muundo wa kawaida wa Kiebrania unaotaja ukoo wa baba.
