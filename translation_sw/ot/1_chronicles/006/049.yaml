lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: wakawapa
  rationale: Ni Qal wayyiqtol ya נתן, yenye maana ya kawaida ya ‘kutoa/kumpa.’ ‘Wakawapa’ inaendeleza mtiririko wa simulizi kwa Kiswahili cha asili.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa kwa neno kwa neno ni ‘wana wa Israeli,’ hapa usemi huo unalitaja taifa kwa ujumla. ‘Waisraeli’ ni tafsiri ya kawaida, sahihi, na isiyoleta dhana kwamba wanaume pekee ndio waliokusudiwa.
- source_word: לַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa watu wa kabila la Lawi, likiwa hapa na maana ya wapokeaji.
- source_word: הֶעָרִים
  choice: miji hiyo
  rationale: עָרִים ni ‘miji’ au ‘majiji.’ ‘Miji’ inafaa kwa makazi yaliyotengewa Walawi; ‘hiyo’ huwakilisha uainishaji wa Kiebrania na kurejelea miji inayozungumziwa katika muktadha.
- source_word: מִגְרְשֵׁיהֶם
  choice: maeneo yake ya malisho
  rationale: מִגְרָשׁ ni ardhi ya wazi iliyouzunguka mji, iliyotumiwa hasa kwa malisho. Kiwakilishi cha Kiebrania kinarejelea miji, na kwa hiyo Kiswahili kinatumia ‘yake.’
