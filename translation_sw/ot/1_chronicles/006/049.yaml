translation:
  language: sw
  text: Nao Waisraeli wakawapa Walawi miji na maeneo yake ya malisho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ardhi ya matumizi ya pamoja,” au “maeneo yanayoizunguka miji hiyo.”
