  text: וּ/מֵ/עֵ֜בֶר לְ/יַרְדֵּ֣ן יְרֵחוֹ֮ לְ/מִזְרַ֣ח הַ/יַּרְדֵּן֒ מִ/מַּטֵּ֣ה רְאוּבֵ֔ן אֶת בֶּ֥צֶר בַּ/מִּדְבָּ֖ר וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת יַ֖הְצָ/ה וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/063.yaml
  text: 'And beyond the Jordan at Jericho[a], east of the Jordan, from the tribe of Reuben: Bezer in the wilderness, with its pasturelands, and Jahzah, with its pasturelands.'
translation:
  language: sw
  text: 'Na ng’ambo ya Yordani karibu na Yeriko, upande wa mashariki wa Yordani, kutoka kabila la Reubeni: Bezeri katika nyika, pamoja na malisho yake, na Yahsa[a], pamoja na malisho yake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahsa pia huandikwa “Yahazi” katika baadhi ya tafsiri za Kiingereza.
    reason: Huhifadhi tahajia nyingine ya jina יַהְצָה inayotumiwa katika mapokeo ya tafsiri za Kiingereza.
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן יְרֵחוֹ
  choice: Na ng’ambo ya Yordani, mkabala na Yeriko
  rationale: Kirai hiki kinaonyesha eneo lililokuwa upande mwingine wa Yordani kwa kutazamwa kutoka Yeriko. “Mkabala na Yeriko” linaeleza mahali kwa Kiswahili cha kawaida bila kuufanya mto kuwa sehemu ya jina.
- source_word: לְמִזְרַח הַיַּרְדֵּן
  choice: upande wa mashariki wa Yordani
  rationale: Huwasilisha wazi mwelekeo wa kijiografia unaotajwa na מִזְרָח.
- source_word: מִמַּטֵּה רְאוּבֵן
  choice: kutoka kabila la Reubeni
  rationale: Katika muktadha wa ugawaji wa maeneo, מַטֶּה humaanisha kabila, si fimbo.
- source_word: בֶּצֶר
  choice: Bezeri
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: בַּמִּדְבָּר
  choice: katika nyika
  rationale: “Nyika” linaonyesha eneo kame au lisilolimwa bila kudokeza kwamba lazima liwe jangwa la mchanga.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: Katika orodha za miji ya Walawi, neno hili hutaja maeneo ya wazi yaliyouzunguka mji, hasa kwa ajili ya mifugo.
- source_word: יַהְצָה
  choice: Yahsa
  rationale: Ni utohozi wa karibu wa umbo la jina la Kiebrania katika mstari huu; umbo “Yahazi” limehifadhiwa katika tanbihi kama tahajia nyingine inayojulikana.
- source_word: אֶת ... וְאֶת
  choice: walipewa ... na
  rationale: Kitenzi “walipewa” kimejazwa kutokana na muundo wa orodha na muktadha wa ugawaji wa miji katika mistari iliyotangulia, ili sentensi isimame kwa kawaida katika Kiswahili.
