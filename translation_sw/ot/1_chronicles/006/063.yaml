- from: 'Na ng’ambo ya Yordani, mkabala na Yeriko, upande wa mashariki wa Yordani, kutoka kabila la Reubeni, walipewa Bezeri katika nyika pamoja na maeneo yake ya malisho, na Yahsa[a] pamoja na maeneo yake ya malisho.


