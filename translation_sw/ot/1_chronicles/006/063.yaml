translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha umehifadhiwa, huku kitenzi kinachodokezwa na muktadha kikijazwa kwa uwazi. Alama ya tanbihi imewekwa baada ya “Yahsa,” ambako maelezo yake yanahusika.
