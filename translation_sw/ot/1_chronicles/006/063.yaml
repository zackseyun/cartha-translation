  to: 'Na ng’ambo ya Yordani karibu na Yeriko, upande wa mashariki wa Yordani, kutoka kabila la Reubeni: Bezeri katika nyika, pamoja na malisho yake, na Yahsa[a], pamoja na malisho yake.'
  rationale: Marekebisho yanaondoa tafsiri ya ziada ya “mkabala na” na kitenzi kilichojazwa “walipewa,” yakihifadhi muundo wa orodha na kutokukamilisha kwa makusudi katika Kiebrania. Tanbihi imefafanuliwa ili ilingane na upeo wa tanbihi ya ukaguzi wa Kiingereza.
