base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/024.yaml
  text: 'And his brother Asaph stood at his right hand: Asaph son of Berechiah[a], son of Shimea.'
translation:
  language: sw
  text: 'Na ndugu yake Asafu, aliyesimama upande wake wa kulia[a]: Asafu mwana wa Berekia, mwana wa Shimea.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “juu ya mkono wake wa kulia”; msemo wa Kiebrania unaonyesha nafasi upande wa kulia wa mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָחִיו
  choice: Na ndugu yake
  rationale: Kiunganishi וְ kimetafsiriwa “Na,” na אָחִיו kwa maana yake ya kawaida “ndugu yake.” Ingawa אָח wakati mwingine inaweza kumaanisha mtu wa ukoo, muktadha huu hauhitaji kupanua maana hiyo.
- source_word: אָסָף
  choice: Asafu
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili. Kurudiwa kwa jina hilo katika Kiebrania kumehifadhiwa.
- source_word: הָעֹמֵד
  choice: aliyesimama
  rationale: Umbo la kitenzi ni participio ya Qal yenye maana ya kuwa katika hali au nafasi ya kusimama. “Aliyesimama” linaunganisha Asafu na maelezo ya mahali kwa Kiswahili cha kawaida bila kupoteza muundo wa maelezo.
- source_word: עַל יְמִינוֹ
  choice: upande wake wa kulia
  rationale: Msemo huu unaonyesha nafasi katika upande wa kulia wa mtu. Kiwakilishi “wake” kimehifadhiwa bila kubainisha kimyakimya kinamrejelea nani.
- source_word: בֶּן
  choice: mwana wa
  rationale: 'Huu ni mtindo wa kawaida wa nasaba. Umerudiwa ili kuhifadhi mfuatano wa Kiebrania: “mwana wa Berekia, mwana wa Shimea.”'
- source_word: בֶּרֶכְיָהוּ
  choice: Berekia
  rationale: Jina limetoholewa kwa umbo linalotambulika na linalofaa katika Kiswahili.
- source_word: שִׁמְעָא
  choice: Shimea
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili.
theological_decisions: []
