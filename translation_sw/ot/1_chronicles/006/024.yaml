  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaoeleweka. Muundo wa maelezo unaoendelea kutoka katika muktadha wa nasaba umehifadhiwa kwa kutumia alama ya nukta mbili, na utata wa kirejeleo cha “wake” haujaondolewa.
