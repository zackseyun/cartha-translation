  text: son of Izhar[a], son of Kohath, son of Levi, son of Israel.
translation:
  language: sw
  text: mwana wa Ishari, mwana wa Kohathi, mwana wa Lawi, mwana wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Israeli”; yaani, Yakobo kwa jina lake la agano.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika mfuatano huu wa ukoo, neno בֶּן limetumiwa kwa kurudiwa-rudiwa na kwa kawaida humaanisha “mwana wa.” Ingawa katika orodha fulani za ukoo linaweza kumaanisha mzao wa vizazi vya baadaye, hakuna jambo katika mstari huu linalolazimisha maana hiyo pana.
- source_word: יִצְהָר
  choice: Ishari
  rationale: Jina la Kiebrania limetoholewa kwa umbo la Kiswahili linalotambulika katika majina ya Biblia.
- source_word: קְהָת
  choice: Kohathi
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili badala ya kutafsiriwa.
- source_word: לֵוִי
  choice: Lawi
  rationale: Hili ndilo umbo la Kiswahili lililozoeleka la jina la mtu לֵוִי.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Maandishi ya Kiebrania yanasema “Israeli,” si “Yakobo”; kwa hiyo jina lililo katika chanzo limehifadhiwa katika matini kuu.
theological_decisions:
- issue: Utambulisho wa Israeli katika mfuatano huu wa ukoo
  choice: Israeli katika matini kuu, huku tanbihi ikifafanua kuwa ni Yakobo kwa jina lake jipya
  alternative: Yakobo
  rationale: Kutumia “Yakobo” katika matini kuu kungefafanua utambulisho lakini kungebadili jina halisi יִשְׂרָאֵל lililotumiwa na chanzo. Tanbihi huhifadhi uwazi bila kuondoa tofauti ya majina.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi na wenye hadhi unaofaa orodha ya ukoo. Kurudiwa kwa “mwana wa” kunahifadhi muundo wa Kiebrania na uwazi wa uhusiano wa ukoo. Alama ya tanbihi imewekwa baada ya “Israeli,” ambako maelezo yake yanahusika.
