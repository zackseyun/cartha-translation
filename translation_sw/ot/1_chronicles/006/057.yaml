  yaml_path: translation/ot/1_chronicles/006/057.yaml
  text: 'And from the tribe of Issachar: Kedesh with its pasturelands[a], and Daberath with its pasturelands.'
translation:
  language: sw
  text: 'Na kutoka katika kabila la Isakari: Kedeshi pamoja na maeneo yake ya malisho, na Daberathi[a] pamoja na maeneo yake ya malisho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili pia huandikwa Daberethi katika baadhi ya tafsiri. Jiji hilo pia linatajwa katika orodha inayolingana ya miji (linganisha Yoshua 21:28).
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: Na kutoka katika kabila la
  rationale: מַטֶּה katika muktadha wa ugawaji wa nchi humaanisha kabila; viambishi וּ na מִ vinaendeleza orodha kwa maana ya “na kutoka katika.”
- source_word: יִשָׂשכָר
  choice: Isakari
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la kabila hilo.
- source_word: קֶדֶשׁ
  choice: Kedeshi
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi ya kawaida ya Kiswahili bila kuongeza ufafanuzi usiopo katika Kiebrania.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: מִגְרָשׁ hurejelea ardhi ya wazi iliyozunguka mji wa Walawi, iliyotumiwa hasa kwa malisho; kiambishi cha nafsi kimetafsiriwa “yake” kikirejelea kila mji.
- source_word: דָּבְרַת
  choice: Daberathi
  rationale: Jina la mahali limetoholewa kwa Kiswahili; tofauti ndogo za tahajia katika tafsiri nyingine zimehifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa orodha ulio wazi na wenye hadhi. Muundo usio na kitenzi wa Kiebrania umehifadhiwa kwa kutumia nukta mbili, badala ya kuongeza kitenzi kama “walipewa” ambacho hakipo wazi katika mstari huu. Alama ya tanbihi imewekwa baada ya jina Daberathi, ambako maelezo yake yanahusika moja kwa moja.
