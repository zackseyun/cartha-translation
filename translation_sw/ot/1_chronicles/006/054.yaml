lexical_decisions:
- source_word: אַיָּלוֹן
  choice: Aiyaloni
  rationale: Jina la mahali limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kutafsiriwa.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: Neno hilo linamaanisha ardhi ya wazi iliyohusishwa na mji, hasa kwa matumizi ya malisho; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: גַּת רִמּוֹן
  choice: Gath-rimoni
  rationale: Jina ambatani la mahali limetoholewa kama jina moja, kwa mtindo unaosomeka kwa Kiswahili huku likihifadhi utambulisho wa jina la Kiebrania.
- source_word: וְאֶת
  choice: na
  rationale: Kiunganishi kimetafsiriwa kama “na,” huku alama ya yambwa ya Kiebrania ikiachwa bila neno maalumu kwa kuwa haihitajiki katika Kiswahili.
