  text: וּ/מִ֨/מַּטֵּה גָ֔ד אֶת רָאמ֥וֹת בַּ/גִּלְעָ֖ד וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶֽת מַחֲנַ֖יִם וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/065.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead with its pasturelands[a], and Mahanaim with its pasturelands.'
translation:
  language: sw
  text: Na kutoka katika kabila la Gadi walipewa Ramothi katika Gileadi pamoja na maeneo yake ya malisho, na Mahanaimu pamoja na maeneo yake ya malisho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: Na kutoka katika kabila la
  rationale: Katika muktadha wa ugawaji wa maeneo, מַטֶּה humaanisha kabila; viambishi וּ na מִ vimetafsiriwa kwa mtiririko wa kawaida kuwa “Na kutoka katika.”
- source_word: גָד
  choice: Gadi
  rationale: Jina la kabila limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: רָאמוֹת בַּגִּלְעָד
  choice: Ramothi katika Gileadi
  rationale: Huhifadhi maana ya kihusishi בְּ, yaani mahali palipo ndani ya Gileadi, na kutumia majina yaliyotoholewa kwa Kiswahili.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: מִגְרָשׁ hurejelea ardhi ya wazi iliyozunguka mji wa Walawi, hasa kwa ajili ya malisho; usemi huu ni wazi na wa kawaida kwa msomaji wa sasa.
- source_word: מַחֲנַיִם
  choice: Mahanaimu
  rationale: Jina la mahali limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וְאֶת
  choice: na
  rationale: Kiunganishi pamoja na kiashiria cha yambwa huendeleza orodha; “na” ni tafsiri ya kawaida na fasaha katika Kiswahili.
theological_decisions:
- issue: Kitenzi kisichoandikwa wazi katika mstari huu
  choice: walipewa
  alternative: 'kuacha kishazi bila kitenzi: “Na kutoka katika kabila la Gadi: …”'
  rationale: Kiebrania kinaendeleza kitenzi cha ugawaji kutoka muktadha uliotangulia. Kiswahili huhitaji kitenzi ili sentensi iwe ya kawaida; “walipewa” huonyesha mwendelezo huo bila kuongeza fundisho la kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa urahisi. Majina yametoholewa kwa mapokeo ya kawaida ya Kiswahili. Hakuna tanbihi iliyoongezwa kwa sababu tofauti ya Kiingereza “Ramoth-gilead” haihitajiki katika toleo la Kiswahili.
