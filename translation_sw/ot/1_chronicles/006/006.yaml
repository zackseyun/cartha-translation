lexical_decisions:
- source_word: יוֹאָח
  choice: Yoa
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili, likihifadhi matamshi ya jina la Kiebrania.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Katika orodha hii ya ukoo, בֵּן yenye kiambishi cha nafsi ya tatu umoja kwa kawaida humaanisha “mwanawe.” Ingawa orodha za ukoo zinaweza kuruka vizazi, maana ya msingi ya neno imehifadhiwa.
- source_word: עִדּוֹ
  choice: Ido
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi ya kawaida ya Kiswahili.
- source_word: זֶרַח
  choice: Zera
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa maana yake.
- source_word: יְאָתְרַי
  choice: Yeatherai
  rationale: Utohozi huu unawakilisha irabu za maandishi ya Kimasora; umbo “Yetherai” limehifadhiwa katika tanbihi kama tahajia mbadala.
