  text: 'The sons of Merari: Mahli[a], Libni his son, Shimei his son, Uzzah his son.'
translation:
  language: sw
  text: 'Wana wa Merari[a]: Mahli, Libni mwanawe, Shimei mwanawe, Uza mwanawe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana pana zaidi katika mtindo wa nasaba, “Wazao wa Merari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni hali ya wingi ya בֵּן katika muundo tegemezi, ikianzisha nasaba. “Wana wa” ndiyo tafsiri ya moja kwa moja; katika lugha ya nasaba inaweza pia kumaanisha “wazao wa.”
- source_word: מְרָרִי
  choice: Merari
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: מַחְלִי
  choice: Mahli
  rationale: Jina la mtu limetoholewa kwa tahajia iliyo karibu na Kiebrania na iliyozoeleka katika Biblia za Kiswahili.
- source_word: לִבְנִי
  choice: Libni
  rationale: Jina la mtu limetoholewa kwa Kiswahili.
- source_word: בְנוֹ
  choice: mwanawe
  rationale: Nomino בֵּן pamoja na kiambishi cha nafsi ya tatu umoja wa kiume huonyesha uhusiano wa mwana katika mfululizo wa nasaba; “mwanawe” ni usemi wa asili na mfupi katika Kiswahili.
- source_word: שִׁמְעִי
  choice: Shimei
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: עֻזָּה
  choice: Uza
  rationale: Jina la mtu limetoholewa moja kwa moja kutoka Kiebrania; konsonanti maradufu ya Kiebrania haihitaji kuonyeshwa katika tahajia ya Kiswahili.
