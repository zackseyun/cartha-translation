translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa nasaba umehifadhiwa, huku kiunganishi “na” kabla ya jina la mwisho kikisaidia mtiririko wa kawaida wa Kiswahili. Alama ya tanbihi [a] imewekwa baada ya Mahli ili kufuata safu ya maandishi ya mashauriano, ingawa tanbihi yenyewe inafafanua kirai cha mwanzo “Wana wa Merari.”
