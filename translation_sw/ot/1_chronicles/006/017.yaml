base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/017.yaml
  text: They were ministering before the tabernacle[a], the tent of meeting, with song until Solomon built the house of Yahweh in Jerusalem[c][b], and they stood according to their ordinance over their service.
translation:
  language: sw
  text: Nao walikuwa wakihudumu mbele ya maskani, Hema la Kukutania, kwa kuimba[a], mpaka Sulemani alipoijenga nyumba ya Yahwe[b] huko Yerusalemu. Nao walisimama kulingana na utaratibu wao katika huduma yao[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa wimbo” au “katika kuimba.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “nyumba ya Yahwe”; yaani, hekalu.
    reason: lexical_clarification
  - marker: c
    text: Au “kulingana na kanuni yao” au “kulingana na desturi yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתִים
  choice: wakihudumu
  rationale: Kitenzi hiki kinaeleza kutekeleza majukumu ya ibada; “kuhudumu” ni cha asili katika Kiswahili na kinafaa katika muktadha wa patakatifu.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: maskani, yaani, Hema la Kukutania
  rationale: Maneno yote mawili ya Kiebrania yamehifadhiwa, huku kirai cha pili kikieleza cha kwanza bila kuyachanganya kuwa jina moja.
- source_word: בַּשִּׁיר
  choice: kwa kuimba
  rationale: Kirai hiki kinaonyesha namna walivyohudumu. “Kwa kuimba” ni Kiswahili cha kawaida na kinabainisha tendo la muziki.
- source_word: עַד בְּנוֹת שְׁלֹמֹה
  choice: mpaka Sulemani alipoijenga
  rationale: Muundo wa Kiebrania unaonyesha kikomo cha kipindi; muundo wa kitenzi ni wazi na wa kawaida katika Kiswahili.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: “Nyumba” huhifadhi neno la Kiebrania badala ya kulitafsiri moja kwa moja kuwa “hekalu,” ingawa hapa linarejelea hekalu.
- source_word: וַיַּעַמְדוּ
  choice: walisimama
  rationale: Tafsiri hii huhifadhi maana ya msingi ya kitenzi na hali ya wao kuchukua au kushikilia nafasi zao za huduma.
- source_word: כְמִשְׁפָּטָם
  choice: kulingana na utaratibu wao
  rationale: Katika muktadha huu neno linamaanisha kanuni, desturi, au mpangilio uliowekwa kwa ajili yao; “utaratibu wao” ni wazi bila kuamua kupita kiasi kati ya maana hizo.
- source_word: עַל עֲבוֹדָתָם
  choice: katika huduma yao
  rationale: Hii inaeleza uhusiano wao na wajibu waliokabidhiwa kwa Kiswahili cha asili, bila kudokeza mamlaka juu ya watu wengine.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: “Yahwe” huhifadhi jina binafsi la Mungu lililo katika matini ya Kiebrania badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi inayofaa matini ya Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Hema la Kukutania” limeandikwa kama jina linalotambulika la patakatifu; sentensi imegawanywa mara mbili ili kuepuka msongamano bila kupoteza mfuatano wa Kiebrania.
