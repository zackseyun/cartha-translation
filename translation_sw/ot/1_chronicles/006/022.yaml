  text: son of Tahath[a], son of Assir, son of Ebiasaph, son of Korah.
translation:
  language: sw
  text: mwana wa Tahathi, mwana wa Asiri, mwana wa Ebiasafu[a], mwana wa Kora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Abiasafu” badala ya “Ebiasafu”; zote ni tahajia za jina lilelile.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika mfuatano huu wa nasaba, neno hili linaonyesha uhusiano wa mwana na baba. “Mwana wa” ndiyo tafsiri ya kawaida na ya moja kwa moja; ingawa nasaba wakati mwingine huruka vizazi, mstari huu wenyewe haulazimishi maana pana ya “mzao wa.”
- source_word: תַּחַת
  choice: Tahathi
  rationale: Ni jina la mtu; limeandikwa kwa namna inayofuata matamshi ya Kiebrania na iliyo ya asili katika Kiswahili.
- source_word: אַסִּיר
  choice: Asiri
  rationale: Ni jina la mtu; limeandikwa kwa herufi za Kiswahili kwa kufuata matamshi ya Kiebrania.
- source_word: אֶבְיָסָף
  choice: Ebiasafu
  rationale: Ni jina la mtu. “Ebiasafu” linafuata kwa karibu umbo la Kiebrania lenye vokali katika mstari huu; “Abiasafu” ni tahajia nyingine inayotumika.
- source_word: קֹרַח
  choice: Kora
  rationale: Ni jina la mtu; “Kora” ni umbo la Kiswahili linalotumiwa kwa jina hili.
