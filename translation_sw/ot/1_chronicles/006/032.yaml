- source_word: מְרָרִי
  choice: Merari
  rationale: Jina la mtu limetoholewa kwa namna inayofaa Kiswahili.
- source_word: לֵוִי
  choice: Lawi
  rationale: Umbo la jina lililozoeleka katika Biblia za Kiswahili limetumiwa; hapa linamtaja babu wa ukoo, si kabila kwa maana ya jumla.
