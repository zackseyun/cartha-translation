base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/062.yaml
  text: 'To the sons of Merari who remained[a], from the tribe of Zebulun: Rimmono and its pasturelands, Tabor and its pasturelands.'
translation:
  language: sw
  text: 'Kwa wana wa Merari waliobaki, kutoka kabila la Zabuloni: Rimono[a] pamoja na maeneo yake ya malisho, na Tabori pamoja na maeneo yake ya malisho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hapa kinasema “Rimono”; kifungu sambamba katika Yoshua 21:35 kinasema “Dimna.”
    reason: textual_variant
lexical_decisions:
- source_word: לִבְנֵי
  choice: Kwa wana wa
  rationale: Kiambishi ל־ katika orodha hii huonyesha wale wanaogawiwa miji; “Kwa wana wa” huhifadhi muundo wa orodha bila kuongeza kitenzi kisichopo katika mstari huu.
- source_word: מְרָרִי
  choice: Merari
  rationale: Ni jina la mtu na babu wa ukoo; limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: הַנּוֹתָרִים
  choice: waliobaki
  rationale: Kivumishi-shirikishi hiki huonyesha wale waliosalia baada ya migawo iliyotangulia; “waliobaki” ni Kiswahili cha kawaida na sahihi.
- source_word: מִמַּטֵּה זְבוּלֻן
  choice: kutoka kabila la Zabuloni
  rationale: Katika muktadha wa mgawanyo wa nchi, מַטֶּה humaanisha “kabila,” si fimbo halisi.
- source_word: רִמּוֹנוֹ
  choice: Rimono
  rationale: Maandishi ya Kiebrania ya WLC hapa yana jina Rimono; tofauti ya jina katika kifungu sambamba imeelezwa katika tanbihi.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: Katika orodha za miji ya Walawi, neno hili humaanisha ardhi wazi iliyoizunguka miji, iliyotumiwa hasa kwa malisho; usemi huu ni wazi kwa msomaji wa sasa.
- source_word: תָּבוֹר
  choice: Tabori
  rationale: Ni jina la mahali; umbo “Tabori” linafuata matumizi ya kawaida ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya heshima na inayoeleweka. Muundo wa orodha wa Kiebrania umehifadhiwa, na “pamoja na” limetumiwa kuonyesha uhusiano wa kila mji na maeneo yake ya malisho. Alama ya tanbihi imewekwa baada ya “Rimono,” ambako tofauti ya maandishi inahusika.
