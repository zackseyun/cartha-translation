  text: 'And the sons of Samuel: the firstborn[a], Vashni, and Abijah.'
translation:
  language: sw
  text: 'Nao wana wa Samweli: mzaliwa wa kwanza, Vashni, na Abiya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Nao wana wa
  rationale: Kiunganishi ו kinaendeleza orodha ya nasaba, na בְנֵי katika muundo wa umilikaji pamoja na jina la mtu humaanisha “wana wa.”
- source_word: שְׁמוּאֵל
  choice: Samweli
  rationale: Jina la mtu limetolewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: הַבְּכֹר
  choice: mzaliwa wa kwanza
  rationale: Neno hili linaonyesha cheo au mpangilio wa kuzaliwa katika familia; “mzaliwa wa kwanza” ni usemi sahihi na wa kawaida wa Kiswahili.
- source_word: וַשְׁנִי
  choice: Vashni
  rationale: Uwekaji wa irabu wa Kimasora unaruhusu umbo hili lichukuliwe kama jina la mtu, ingawa konsonanti zake zinaweza pia kueleweka kuwa “na wa pili.” Utata huo umehifadhiwa katika tanbihi.
- source_word: וַאֲבִיָּה
  choice: na Abiya
  rationale: Kiunganishi pamoja na jina la mtu kimetafsiriwa moja kwa moja; “Abiya” ni umbo la kawaida la Kiswahili la jina hili.
theological_decisions:
- issue: Ugumu wa jina na mpangilio wa wana wa Samweli katika nasaba
  choice: Kuhifadhi “Vashni” katika matini kuu kulingana na umbo la Kimasora
  alternative: Kusoma “mzaliwa wa kwanza, na wa pili, Abiya,” au kuingiza jina “Yoeli” kwa kulinganisha na 1 Samweli 8:2
  rationale: Hili ni suala la kimatini na kinasaba, si fundisho la imani. Matini kuu haijapatanishwa kimya kimya na 1 Samweli 8:2; badala yake, usomaji mwingine muhimu umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi, wenye hadhi, na unaofaa nasaba. “Nao” linaendeleza mfululizo wa majina kwa njia ya asili, huku utata halisi wa Kiebrania ukihifadhiwa katika tanbihi.
