- source_word: חֲשַׁבְיָה
  choice: Hashabia
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa Kiswahili huku likibaki karibu na umbo la Kiebrania.
- source_word: אֲמַצְיָה
  choice: Amazia
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa, kwa umbo linalotambulika katika mapokeo ya Biblia ya Kiswahili.
- source_word: חִלְקִיָּה
  choice: Hilkia
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa, kwa tahajia ya kawaida na inayotambulika katika Kiswahili.
