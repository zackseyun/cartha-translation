base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/018.yaml
  text: 'And these are the ones who stood[a], and their sons: from the sons of the Kohathites: Heman the singer, son of Joel[b], son of Samuel.'
translation:
  language: sw
  text: 'Na hawa ndio waliosimama[a], na wana wao: miongoni mwa wana wa Kohathi, Hemani, mwimbaji, mwana wa Yoeli, mwana wa Samweli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliohudumu.” Kiebrania kinasema kihalisi “waliosimama”; katika muktadha huu linaweza pia kumaanisha kusimama katika huduma rasmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Na hawa ndio
  rationale: Inahifadhi kiunganishi waw na nguvu ya kiwakilishi cha kuonyesha huku ikianzisha orodha kwa Kiswahili cha kawaida.
- source_word: הָעֹמְדִים
  choice: waliosimama
  rationale: Inahifadhi taswira halisi ya kitenzi עמד, ingawa katika muktadha huu kusimama kunaweza kumaanisha kuwa katika huduma au wadhifa.
- source_word: וּבְנֵיהֶם
  choice: pamoja na wana wao
  rationale: Waw inaunganisha wana na wale waliosimama. ‘Pamoja na’ huonyesha kwa kawaida uhusiano huo katika Kiswahili; tafsiri ya karibu zaidi na muundo ni ‘na wana wao.’
- source_word: מִבְּנֵי הַקְּהָתִי
  choice: kutoka kwa wazao wa Kohathi
  rationale: Kifungu hiki kinataja ukoo wa Kohathi. ‘Wazao’ ni cha kawaida na wazi zaidi kuliko muundo wa moja kwa moja ‘wana wa Mkohathi.’
- source_word: הֵימָן
  choice: Hemani
  rationale: Umbo la jina linalofaa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: הַמְשׁוֹרֵר
  choice: mwimbaji
  rationale: Nomino hii humaanisha mtu anayeimba; ‘mwimbaji’ ni sahihi na ya kawaida kuliko neno pana ‘mwanamuziki.’
- source_word: בֶּן יוֹאֵל בֶּן שְׁמוּאֵל
  choice: mwana wa Yoeli, mwana wa Samweli
  rationale: Inahifadhi moja kwa moja mfuatano wa nasaba katika Kiebrania.
theological_decisions:
- issue: Maana ya ‘waliosimama’ katika huduma ya ibada
  choice: Taswira halisi ‘waliosimama’ imehifadhiwa katika maandiko, na uwezekano wa maana ya huduma umeelezwa katika tanbihi.
  alternative: waliohudumu
  rationale: Muktadha unaweza kuashiria kusimama katika huduma rasmi, lakini kitenzi chenyewe hakisemi wazi ‘kutumikia’; hivyo tafsiri haipaswi kufuta mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Sentensi imegawanywa baada ya ‘wana wao’ ili orodha ya ukoo isomeke kwa urahisi bila kuondoa uhusiano wake na kishazi kilichotangulia.
