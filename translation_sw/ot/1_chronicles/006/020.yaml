lexical_decisions:
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika orodha ya nasaba, neno hili huonyesha uhusiano wa mwana na baba; kurudia “mwana wa” kunahifadhi muundo wa Kiebrania na ni Kiswahili cha kawaida.
- source_word: ציף
  choice: Sifu
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: מַחַת
  choice: Mahathi
  rationale: Jina la mtu limetoholewa kwa kuwakilisha konsonanti ya mwisho ya Kiebrania kwa “th” na kuongeza irabu ili litamkike kwa urahisi katika Kiswahili.
- source_word: עֲמָשָׂי
  choice: Amasai
  rationale: Jina la mtu limetoholewa kwa kufuata kwa karibu matamshi ya Kiebrania katika muundo wa Kiswahili.
