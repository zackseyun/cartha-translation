lexical_decisions:
- source_word: רָאמוֹת
  choice: Ramothi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kiasili katika Kiswahili, bila kulitafsiri.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: Neno מִגְרָשׁ linaonyesha ardhi ya wazi iliyoambatana na mji, mara nyingi kwa ajili ya kulishia mifugo; usemi huu ni wazi na wa kawaida katika Kiswahili cha sasa.
- source_word: עָנֵם
  choice: Anemu
  rationale: Jina la mahali limetoholewa kutoka usomaji wa WLC/MT עָנֵם; tofauti ya 'Aneri' katika orodha sambamba imehifadhiwa katika tanbihi.
- source_word: וְאֶת
  choice: na
  rationale: Kiunganishi וְ kimewakilishwa kwa 'na'; kiashiria cha yambwa אֶת hakina neno sambamba linalohitajika katika Kiswahili.
