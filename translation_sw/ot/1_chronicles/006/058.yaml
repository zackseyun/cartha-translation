  source_fidelity: 'Tafsiri inafuata kwa usahihi orodha ya Kiebrania: Ramothi na eneo/malisho yake, kisha Anemu na eneo/malisho yake. Kiambishi cha umilikaji wa kike umoja katika מִגְרָשֶׁיהָ kimewasilishwa ipasavyo kwa “yake,” kikirejelea kila mji.'
