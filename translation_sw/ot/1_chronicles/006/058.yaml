  text: Ramothi pamoja na maeneo yake ya malisho, na Anemu pamoja na maeneo yake ya malisho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hapa kinasema “Anemu”; orodha sambamba katika Yoshua 21:25 inasema “Aneri.”
