base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/056.yaml
  text: 'To the sons of Gershom[a], from the clan of the half-tribe of Manasseh: Golan in Bashan with its pasturelands, and Ashtaroth with its pasturelands.'
translation:
  language: sw
  text: Wana wa Gershomu, kutoka katika ukoo wa nusu ya kabila la Manase, walipewa Golani katika Bashani pamoja na maeneo yake ya malisho[a], na Ashtarothi pamoja na maeneo yake ya malisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ardhi yake ya wazi” au “ardhi yake ya jumuiya.” Neno la Kiebrania hurejelea ardhi inayohusishwa na mji, mara nyingi ikitumiwa kwa malisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גֵּרְשׁוֹם
  choice: Wana wa Gershomu
  rationale: Neno לְ linaonyesha wapokeaji wa mgao, huku idiomu ya Kiebrania 'wana wa' ikihifadhiwa kwa maana ya ukoo mpana; kitenzi 'walipewa' kinafanya uhusiano wa mgao uwe wazi katika Kiswahili.
- source_word: מִמִּשְׁפַּחַת
  choice: kutoka katika ukoo wa
  rationale: Katika muktadha wa migawanyo ya makabila, מִשְׁפָּחָה ni kitengo cha ukoo ndani ya kabila; 'ukoo' ni sahihi na ya kawaida kuliko 'familia'.
- source_word: חֲצִי מַטֵּה מְנַשֶּׁה
  choice: nusu ya kabila la Manase
  rationale: Hii ni lugha ya kawaida ya Kiswahili inayoeleza sehemu ya kabila la Manase iliyokuwa katika eneo hili bila kuunda neno lisilo la kawaida.
- source_word: אֶת גּוֹלָן בַּבָּשָׁן
  choice: Golani katika Bashani
  rationale: Golani ni mji na Bashani ni eneo; 'katika' huonyesha kwa kawaida kuwa mji huo ulikuwa ndani ya eneo hilo.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: מִגְרָשׁ hurejelea ardhi wazi inayohusiana na mji, hasa kwa malisho; tafsiri hii ni wazi na ya asili, huku tanbihi ikitaja upana wa maana.
- source_word: עַשְׁתָּרוֹת
  choice: Ashtarothi
  rationale: Uhawilishaji huu unafuata umbo la jina la mahali la Kiebrania na kuongeza irabu ya mwisho ili litamkike kwa urahisi katika Kiswahili.
- source_word: וְאֶת ... וְאֶת
  choice: na ... pamoja na
  rationale: Muundo huu unahifadhi orodha ya miji na kuhusisha kila mji na maeneo yake kwa Kiswahili cha asili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Kitenzi 'walipewa' kimeongezwa kwa uwazi kwa sababu mstari wa Kiebrania ni kipande cha sentensi kinachoendeleza orodha ya mgao kutoka muktadha uliotangulia. Majina yameandikwa kwa maumbo yanayotamkika kwa urahisi katika Kiswahili.
