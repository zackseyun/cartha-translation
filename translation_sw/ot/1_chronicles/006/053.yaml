  text: and Jokmeam with its pasturelands[b][a], and Beth-horon with its pasturelands.
translation:
  language: sw
  text: na Yokmeamu[a] pamoja na maeneo yake ya malisho[b], na Beth-horoni pamoja na maeneo yake ya malisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Yokmeamu”; baadhi ya mapokeo ya tafsiri husoma “Yokneamu” kwa kuhusianisha jina hili na majina ya mahali yanayofanana katika vifungu vingine.'
    reason: alternative_reading
  - marker: b
    text: Au “ardhi ya matumizi ya pamoja” au “ardhi zilizoizunguka,” yaani ardhi iliyotengwa kwa ajili ya kila mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקְמְעָם
  choice: Yokmeamu
  rationale: Jina la mahali limetoholewa kwa kufuata umbo la konsonanti la maandishi ya Kiebrania katika Mambo ya Nyakati; umbo la Kiswahili linaishia -u ili lisomeke kwa kawaida.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: Katika muktadha wa miji ya Walawi, neno hili humaanisha ardhi zilizo wazi zilizouzunguka mji, hasa kwa malisho; tafsiri hii ni wazi kwa msomaji wa Kiswahili.
- source_word: בֵּית חוֹרוֹן
  choice: Beth-horoni
  rationale: Jina la mahali limetoholewa kwa namna inayotambulika na kusomeka kwa urahisi katika Kiswahili, huku kistari kikihifadhi muundo wa jina ambatani la Kiebrania.
- source_word: וְאֶת
  choice: na
  rationale: Katika orodha hii, kiunganishi pamoja na kiashiria cha yambwa hutafsiriwa kwa kawaida kwa ‘na’; kiashiria cha yambwa hakihitaji kutafsiriwa kivyake.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa orodha ulio wazi na wenye hadhi. ‘Pamoja na’ huonyesha kuwa maeneo ya malisho yalikuwa sehemu zilizoambatanishwa na kila mji. Alama zote za tanbihi zimewekwa mara tu baada ya kirai kinachohusika.
