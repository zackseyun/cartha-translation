  text: And from the families of the sons of Kohath[b][a], the cities of their territory were from the tribe of Ephraim.
translation:
  language: sw
  text: Na kutoka katika koo za wana wa Kohathi[a], miji ya eneo lao ilitolewa kutoka katika kabila la Efraimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka miongoni mwa jamaa za wana wa Kohathi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמִּשְׁפְּחוֹת
  choice: Na kutoka katika koo za
  rationale: Neno מִשְׁפָּחוֹת humaanisha vikundi vya kifamilia au koo. “Koo” linafaa katika muktadha wa nasaba na mgawanyo wa makabila; “kutoka katika” linahifadhi nguvu ya kihusishi מִן, na “Na” linaendeleza mtiririko wa orodha.
- source_word: בְּנֵי קְהָת
  choice: wana wa Kohathi
  rationale: Hili linatafsiri kwa karibu muundo wa Kiebrania “wana wa Kohathi,” ambao katika muktadha huu unawahusu wazao wake.
- source_word: וַיְהִי
  choice: ilikuwa
  rationale: Katika sentensi hii היה ni kiunganishi cha taarifa ya mgao. Umoja wa “ilikuwa” unakubaliana na kirai cha jumla “miji ya eneo lao,” huku maana ikiwa kwamba miji hiyo ilitoka katika kabila lililotajwa.
- source_word: עָרֵי גְבוּלָם
  choice: miji ya eneo lao
  rationale: גְבוּל inaweza kumaanisha mpaka, mipaka, au eneo. Hapa “eneo lao” linaonyesha eneo la mgao bila kuamua kimakosa kwamba miji yote ilikuwa kwenye mstari wa mpaka.
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: kutoka katika kabila la Efraimu
  rationale: Katika muktadha wa mgao wa ardhi, מַטֶּה humaanisha kabila, si fimbo. Kirai hiki kinaonyesha kabila ambamo miji ilitolewa.
