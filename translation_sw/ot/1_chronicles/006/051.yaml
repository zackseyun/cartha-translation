  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Muundo wa mstari umehifadhi mtiririko wa orodha ya Kiebrania, huku “eneo lao” likitumiwa kwa ufasaha wa kawaida na ili kudumisha wigo wa maana wa גְבוּל.
