base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/052.yaml
  text: 'They gave them the cities of refuge: Shechem with its pasturelands in the hill country of Ephraim[a], and Gezer with its pasturelands.'
translation:
  language: sw
  text: 'Wakawapa miji ya makimbilio: Shekemu pamoja na maeneo yake ya malisho katika nchi ya vilima ya Efraimu[a], na Gezeri pamoja na maeneo yake ya malisho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “miji ya makimbilio: Shekemu na maeneo yake ya malisho katika nchi ya vilima ya Efraimu, na Gezeri na maeneo yake ya malisho.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Wakawapa
  rationale: Kitenzi cha mfululizo wa simulizi kimetafsiriwa kwa umbo la Kiswahili linaloonyesha tendo lililofuata; kiambishi -wa- kinawakilisha wapokeaji.
- source_word: לָהֶם
  choice: -wa- katika “Wakawapa”
  rationale: Kiswahili huingiza kiwakilishi cha watendewa ndani ya kitenzi badala ya kutumia neno tofauti.
- source_word: עָרֵי הַמִּקְלָט
  choice: miji ya makimbilio
  rationale: Hili ni tamko wazi na linaloeleweka kwa miji iliyotengwa kuwa mahali pa kukimbilia kwa usalama.
- source_word: שְׁכֶם
  choice: Shekemu
  rationale: Jina la mahali limeandikwa kwa umbo lililozoeleka katika Kiswahili.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: Neno linamaanisha ardhi ya wazi inayohusishwa na mji, hasa kwa ajili ya kulishia mifugo; tafsiri hii ni ya sasa na inaeleweka kuliko “viunga” pekee.
- source_word: בְּהַר אֶפְרָיִם
  choice: katika nchi ya vilima ya Efraimu
  rationale: Kirai hiki kinataja eneo la nyanda za juu linalohusishwa na Efraimu, si kilele kimoja cha mlima.
- source_word: גֶּזֶר
  choice: Gezeri
  rationale: Jina la mahali limeandikwa kwa umbo la Kiswahili linalozoeleka.
- source_word: וְאֶת ... וְאֶת
  choice: pamoja na ... na ... pamoja na
  rationale: Muundo huu unaunganisha kila mji na maeneo yake ya malisho kwa Kiswahili cha kawaida huku ukihifadhi uratibu wa Kiebrania.
theological_decisions:
- issue: Uhusiano wa kirai “miji ya makimbilio” na majina Shekemu na Gezeri
  choice: Kutumia nukta mbili baada ya “miji ya makimbilio,” kama katika mpangilio wa maandishi ya Kiebrania.
  alternative: Kutafsiri wazi kwamba Shekemu pekee ndiyo mji wa makimbilio, kisha kutaja Gezeri kama mji mwingine.
  rationale: Kiebrania cha mstari huu kinaweza kusomwa kana kwamba majina yanaitaja miji ya makimbilio, ingawa muktadha sambamba unaweza kuhimiza ufafanuzi tofauti. Tafsiri haiongezi maneno ya kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. Majina Shekemu, Efraimu, na Gezeri yanafuata maumbo yaliyozoeleka katika matumizi ya Biblia za Kiswahili.
