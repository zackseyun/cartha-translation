base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/055.yaml
  text: 'And from the half-tribe of Manasseh: Aner with its pasturelands[a], and Bileam with its pasturelands, for the clan of the remaining sons of Kohath.'
translation:
  language: sw
  text: Na kutoka nusu ya kabila la Manase, walipewa Aneri pamoja na maeneo yake ya malisho, na Bileamu[a] pamoja na maeneo yake ya malisho, kwa ajili ya ukoo wa wana wa Kohathi waliosalia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Bileam; sehemu inayolingana katika Yoshua 21:25 inasoma Ibleamu.'
    reason: textual_variant
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה מְנַשֶּׁה
  choice: Na kutoka nusu ya kabila la Manase
  rationale: מַחֲצִית ni ‘nusu,’ na מַטֶּה katika muktadha wa mgao wa ardhi ni ‘kabila.’ Muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: אֶת עָנֵר
  choice: Aneri
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: מִגְרָשׁ hurejelea ardhi ya wazi iliyozunguka mji, hasa kwa malisho katika orodha za miji ya Walawi. Tafsiri hii inaeleza matumizi yake kwa lugha ya kawaida.
- source_word: בִּלְעָם
  choice: Bileamu
  rationale: Maandishi ya Kiebrania ya WLC hapa yanasoma בִּלְעָם; tofauti ya Ibleamu katika Yoshua 21:25 imehifadhiwa katika tanbihi.
- source_word: לְמִשְׁפַּחַת לִבְנֵי קְהָת הַנּוֹתָרִים
  choice: kwa ajili ya ukoo wa wana wa Kohathi waliosalia
  rationale: מִשְׁפָּחָה ya umoja inaweza kutaja kundi la ukoo, na הַנּוֹתָרִים inamaanisha waliobaki au waliosalia. ‘Wana wa Kohathi’ inadumisha usemi wa chanzo bila kuamua kimya kimya kama unamaanisha wana wa moja kwa moja au wazao.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Kitenzi ‘walipewa’ kimewekwa wazi ili kukamilisha orodha ya mgao katika Kiswahili, ingawa mstari huu wa Kiebrania unaendeleza kisarufi sentensi kutoka muktadha uliotangulia. Alama ya tanbihi imewekwa baada ya ‘Bileamu,’ mahali tofauti ya maandishi inapohusika.
