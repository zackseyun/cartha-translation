  text: Shimea mwanawe[a], Hagia mwanawe, Asaya mwanawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hurudia kihalisi fomula ya ukoo, “mwanawe ... mwanawe ... mwanawe,” kuonyesha vizazi vinavyofuatana katika nasaba.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁמְעָא
  choice: Shimea
  rationale: Jina la mtu limetoholewa kwa umbo linalofuatilia Kiebrania na linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: בְנוֹ
  choice: mwanawe
  rationale: Nomino 'mwana' pamoja na kiambishi cha nafsi ya tatu umoja huhifadhi maana ya 'mwana wake' na urudiaji wa fomula ya ukoo kwa Kiswahili fasaha.
- source_word: חַגִּיָּה
  choice: Hagia
  rationale: Jina la mtu limetoholewa kwa Kiswahili; konsonanti mbili za tahajia ya Kiingereza hazihitajiki ili kuwakilisha matamshi kwa mwandiko wa Kiswahili.
- source_word: עֲשָׂיָה
  choice: Asaya
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa tahajia ya Kiswahili, likihifadhi sehemu ya mwisho -ya.
