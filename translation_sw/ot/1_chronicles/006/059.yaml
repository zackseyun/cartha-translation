lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: na kutoka katika kabila la
  rationale: Katika muktadha wa ugawaji wa maeneo, מַטֶּה humaanisha kabila; viambishi vya kiunganishi na kihusishi vimetafsiriwa kuwa “na kutoka katika.”
- source_word: אָשֵׁר
  choice: Asheri
  rationale: Jina la kabila limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: אֶת מָשָׁל
  choice: Mashali
  rationale: Kiashiria cha yambwa אֶת hakihitaji kutafsiriwa. Jina la mahali limetoholewa kutoka umbo la Mambo ya Nyakati, מָשָׁל; tofauti ya Yoshua 21:30 imehifadhiwa katika tanbihi.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: מִגְרָשׁ hurejelea ardhi wazi iliyolizunguka jiji na kutumiwa hasa kwa malisho. Kiwakilishi cha nafsi ya tatu, kike, umoja kinarejelea jiji.
- source_word: עַבְדּוֹן
  choice: Abdoni
  rationale: Jina la mahali limetoholewa kwa muundo wa kawaida wa Kiswahili.
