  text: 'and from the tribe of Asher: Mashal with its pasturelands[a], and Abdon with its pasturelands.'
translation:
  language: sw
  text: 'na kutoka katika kabila la Asheri: Mashali pamoja na maeneo yake ya malisho[a], na Abdoni pamoja na maeneo yake ya malisho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa Mambo ya Nyakati ina jina Mashali; orodha sambamba katika Yoshua 21:30 ina Mishali.
