base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/050.yaml
  text: They assigned by lot from the tribe of the sons of Judah[a], and from the tribe of the sons of Simeon, and from the tribe of the sons of Benjamin, these cities, which they called by name.
translation:
  language: sw
  text: Nao wakagawa kwa kura, kutoka katika kabila la wazao wa Yuda, kabila la wazao wa Simeoni, na kabila la wazao wa Benyamini, miji hii ambayo waliita kwa majina[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa maana iliyo wazi zaidi, “miji hii iliyoorodheshwa kwa majina.” Kiebrania hutumia kihalisi kitenzi “kuita” pamoja na maneno “kwa majina”; huu ni usemi unaotanguliza orodha ya majina inayofuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: wakagawa
  rationale: Kitenzi נתן kimsingi humaanisha ‘kutoa,’ lakini hapa kinahusu ugawaji wa miji kwa kura. ‘Wakagawa’ linaonyesha tendo hilo la ugawaji bila kuongeza mpokeaji ambaye hajatajwa katika mstari huu.
- source_word: בַגּוֹרָל
  choice: kwa kura
  rationale: Huhifadhi njia ya ugawaji iliyoonyeshwa na גּוֹרָל na ni usemi wa kawaida wa Kiswahili.
- source_word: מִמַּטֵּה
  choice: kutoka katika kabila la
  rationale: Katika orodha za Israeli, מַטֶּה humaanisha ‘kabila’; ‘kutoka katika’ huonyesha kwamba miji hiyo ilitolewa katika maeneo ya makabila hayo.
- source_word: בְנֵי יְהוּדָה / בְנֵי שִׁמְעוֹן / בְּנֵי בִנְיָמִן
  choice: wazao wa Yuda / wazao wa Simeoni / wazao wa Benyamini
  rationale: ‘Wazao wa’ huwasilisha maana ya kifamilia na kikabila ya בְנֵי kwa Kiswahili cha sasa kwa ufasaha zaidi kuliko tafsiri ya moja kwa moja ‘wana wa.’
- source_word: הֶעָרִים הָאֵלֶּה
  choice: miji hii
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino pamoja na kiashiria chake.
- source_word: אֲשֶׁר יִקְרְאוּ אֶתְהֶם בְּשֵׁמוֹת
  choice: miji ambayo waliita kwa majina
  rationale: Huhifadhi kitenzi קרא, ‘kuita,’ na usemi ‘kwa majina,’ huku ikionyesha kwamba majina ya miji yatafuata katika orodha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. ‘Wazao wa’ limetumiwa badala ya ‘wana wa’ ili lugha ya kikabila iwe ya kawaida kwa msomaji wa sasa. Alama ya tanbihi imewekwa kwenye kishazi kinachoelezwa na tanbihi.
