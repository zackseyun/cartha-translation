lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: Heshboni
  rationale: Jina la mahali limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili, badala ya kutafsiriwa.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: Katika muktadha wa miji ya Walawi, neno hili humaanisha ardhi ya wazi iliyokuwa mali ya mji na iliyotumiwa hasa kwa malisho; kiambishi cha nafsi ya tatu umoja wa kike kimetafsiriwa kwa ‘yake,’ kikirejelea kila mji.
- source_word: יַעְזֵיר
  choice: Yazeri
  rationale: Jina la mahali limetoholewa kwa tahajia ya Kiswahili inayowakilisha jina la Kiebrania kwa uwazi.
- source_word: וְאֶת
  choice: na
  rationale: Alama ya yambwa את haitafsiriwi moja kwa moja katika Kiswahili; וְ limetolewa kama ‘na’ ili kudumisha muundo wa orodha.
