  footnotes:
  - marker: a
    text: Au “ardhi ya mji iliyotengwa kwa matumizi ya pamoja” au “ardhi ya wazi inayoizunguka mji”; neno la Kiebrania humaanisha ardhi ya wazi inayohusishwa na mji.
