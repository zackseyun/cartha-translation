  text: Elkana mwanawe, na Ebiasafu mwanawe, na Asiri mwanawe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia, bila kulitafsiri kimaana.
- source_word: בְנוֹ
  choice: mwanawe
  rationale: Neno בֵּן lenye kiambishi cha nafsi ya tatu, umoja, kiume humaanisha moja kwa moja ‘mwanawe.’ Ingawa katika nasaba linaweza wakati mwingine kumaanisha mzao wa baadaye, hapa usemi wa moja kwa moja umehifadhiwa.
- source_word: וְ
  choice: na
  rationale: Kiunganishi rahisi kinachounganisha hatua za nasaba.
- source_word: אֶבְיָסָף
  choice: Ebiasafu
  rationale: Jina limetoholewa kutoka tahajia ya Kiebrania ya fungu hili; irabu ya mwisho imeongezwa ili jina lisomeke kwa kawaida katika Kiswahili.
- source_word: אַסִּיר
  choice: Asiri
  rationale: Jina limetoholewa moja kwa moja kwa mfumo wa sauti na tahajia unaofaa Kiswahili.
theological_decisions: []
translation_notes:
  register: Lugha ni fupi, yenye heshima, na ya kawaida kwa orodha ya nasaba. Muundo unaorudiwa ‘mwanawe’ unahifadhi mfuatano na msisitizo wa maandishi ya Kiebrania. Hakuna tanbihi iliyoongezwa kwa tofauti ya Ebiasafu/Abiasafu kwa sababu ‘Ebiasafu’ linafuata moja kwa moja maandishi ya WLC, na tofauti hiyo ya unukuzi wa Kiingereza si lazima iwe mbadala wenye umuhimu katika Kiswahili.
