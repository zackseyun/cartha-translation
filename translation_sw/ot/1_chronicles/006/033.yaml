translation:
  language: sw
  text: Nao ndugu zao, Walawi, waliwekwa kwa ajili ya utumishi wote wa Maskani ya nyumba ya Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walipewa”; neno la Kiebrania ni “waliotolewa/kupewa,” lakini hapa lina maana ya kupewa au kupangiwa wajibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Nao ndugu zao
  rationale: Huhifadhi kiunganishi cha mwendelezo na neno la undugu; hapa “ndugu” linaweza pia kumaanisha watu wa ukoo au kabila moja.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida na sahihi la watu wa kabila la Lawi katika Kiswahili cha Biblia.
- source_word: נְתוּנִים
  choice: waliwekwa
  rationale: Kitenzi hiki ni hali ya kutendwa inayomaanisha kihalisi “waliotolewa,” lakini katika muktadha huu huonyesha kupewa au kupangiwa wajibu.
- source_word: לְכָל עֲבוֹדַת
  choice: kwa ajili ya utumishi wote
  rationale: Kirai hiki kinaonyesha kusudi na eneo lote la kazi waliyopewa; “utumishi” linafaa kwa kazi ya ibada bila kuingiza istilahi ya baadaye ya kikanisa.
- source_word: מִשְׁכַּן
  choice: Maskani
  rationale: “Maskani” ni istilahi inayotambulika kwa hema takatifu, na pia huhifadhi wazo la mahali pa kukaa.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi neno “nyumba” badala ya kulibadili kuwa “hekalu.”
theological_decisions:
- issue: Uhusiano kati ya “Maskani” na “nyumba ya Mungu” katika muktadha wa Mwandishi wa Mambo ya Nyakati
  choice: Maskani ya nyumba ya Mungu
  alternative: nyumba ya Mungu; Maskani ya Mungu
  rationale: Kiebrania kina maneno yote mawili, מִשְׁכַּן na בֵּית הָאֱלֹהִים. Kuyahifadhi yote huepuka kufuta mvutano wa kimakusudi kati ya lugha ya Maskani na ya nyumba/hekalu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. “Nao” huendeleza orodha kwa kawaida; “Maskani” limeandikwa kwa herufi kubwa kama jina la mahali patakatifu maalumu.
