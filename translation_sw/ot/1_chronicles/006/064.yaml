base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/064.yaml
  text: and Kedemoth with its pasturelands[a], and Mephaath with its pasturelands.
translation:
  language: sw
  text: na Kedemothi pamoja na maeneo yake ya malisho,[a] na Mefaathi pamoja na maeneo yake ya malisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maeneo yake ya wazi”; neno la Kiebrania linamaanisha ardhi ya wazi iliyokuwa chini ya mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵמוֹת
  choice: Kedemothi
  rationale: Jina la mahali limetoholewa kwa mwandiko unaosomeka kwa kawaida katika Kiswahili, huku sauti ya jina la Kiebrania ikihifadhiwa.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: Neno מִגְרָשׁ linamaanisha ardhi ya wazi iliyo chini ya mji, mara nyingi ikitumiwa kwa malisho; usemi huu ni wazi na wa kawaida katika Kiswahili cha sasa. Kiambishi cha nafsi ya tatu, umoja, kike kinarejelea kila mji na kutafsiriwa kuwa “yake.”
- source_word: מֵיפַעַת
  choice: Mefaathi
  rationale: Jina la mahali limetoholewa kwa kufuata matamshi yanayokaribia Kiebrania na muundo wa majina katika Kiswahili.
- source_word: וְאֶת ... וְאֶת
  choice: na ... pamoja na
  rationale: Viunganishi na viashiria vya yambwa vinaunda orodha ya miji na ardhi yake. Kiswahili hutumia “na” kuendeleza orodha na “pamoja na” kuhusisha kila mji na maeneo yake kwa mtiririko wa kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Majina yametoholewa ili yasomeke kiasili kwa Kiswahili; muundo wa orodha umehifadhiwa.
