base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/045.yaml
  text: 'and from the tribe of Benjamin: Geba with its pasturelands[a], Alemeth with its pasturelands, and Anathoth with its pasturelands—all their cities were thirteen cities according to their families.'
translation:
  language: sw
  text: 'na kutoka katika kabila la Benyamini: Geba pamoja na malisho yake, Alemethi[a] pamoja na malisho yake, na Anathothi pamoja na malisho yake. Miji yao yote ilikuwa kumi na mitatu, kulingana na jamaa zao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “Alemethi”; orodha sambamba katika Yoshua 21:18 inasema “Almoni.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה בִנְיָמִן
  choice: na kutoka katika kabila la Benyamini
  rationale: מַטֶּה katika muktadha wa mgao wa Israeli humaanisha kabila; viambishi vya kuunganisha na vya mahali vinaendeleza orodha ya mstari uliotangulia.
- source_word: גֶּבַע
  choice: Geba
  rationale: Ni jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa.
- source_word: מִגְרָשֶׁיהָ
  choice: malisho yake
  rationale: מִגְרָשׁ hurejelea ardhi ya wazi iliyozunguka mji, hasa iliyotumiwa kulishia mifugo; 'malisho yake' ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: עָלֶמֶת
  choice: Alemethi
  rationale: Jina lililo katika maandishi ya Mambo ya Nyakati limehifadhiwa kwa kutoholewa; tofauti ya orodha sambamba imeonyeshwa katika tanbihi.
- source_word: עֲנָתוֹת
  choice: Anathothi
  rationale: Ni jina la mahali lililotoholewa kwa namna inayoweza kutamkwa kwa kawaida katika Kiswahili.
- source_word: כָּל עָרֵיהֶם
  choice: miji yao yote
  rationale: Huhitimisha orodha kwa kujumlisha miji iliyotolewa kwa vikundi vinavyohusika.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: miji ... kumi na mitatu
  rationale: Muundo wa Kiebrania wenye nomino ya umoja baada ya namba umetolewa kwa wingi kama inavyohitajika katika Kiswahili.
- source_word: בְּמִשְׁפְּחוֹתֵיהֶם
  choice: kulingana na jamaa zao
  rationale: מִשְׁפָּחוֹת inaweza kumaanisha jamaa pana au koo; 'jamaa zao' huhifadhi upana huo bila kubana maana kuwa ukoo pekee.
