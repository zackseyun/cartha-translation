  text: But the fields of the city and its pasturelands they gave to Caleb son of Jephunneh[a].
translation:
  language: sw
  text: Lakini waliwapa Kalebu mwana wa Yefune mashamba ya mji huo na vijiji vyake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “makazi yake” au “maeneo yake ya malisho.” Neno la Kiebrania linaweza kumaanisha vijiji au makazi yanayohusishwa na mji, na katika miktadha mingine pia ardhi ya wazi inayouzunguka.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: mashamba ya mji huo
  rationale: שָׂדֶה humaanisha eneo la wazi, shamba, au ardhi ya kilimo. Katika muundo huu wa pamoja unaohusishwa na mji, “mashamba ya mji huo” ni Kiswahili cha kawaida kinachoonyesha ardhi iliyokuwa mali ya mji, si sehemu ya mji iliyojengwa.
- source_word: חֲצֵרֶיהָ
  choice: maeneo yake ya malisho
  rationale: Katika muktadha wa ugawaji wa miji, חָצֵר inaweza kumaanisha vijiji au makazi yaliyo chini ya mji, au maeneo ya wazi yanayohusishwa nao. “Maeneo yake ya malisho” linaonyesha vizuri matumizi ya ardhi inayozunguka mji, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: נָתְנוּ
  choice: walipewa
  rationale: Kitenzi נתן kimsingi humaanisha “kutoa.” Kiswahili cha kutendwa, “walipewa,” ni cha asili hapa kwa kuwa vitu vilivyotolewa vinatangulia na mpokeaji anafuata; hakibadili maana ya tendo wala utambulisho wa mpokeaji.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: Kalebu mwana wa Yefune
  rationale: Kiambishi לְ kinamtambulisha mpokeaji. Majina yameandikwa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: וְאֶת ... וְאֶת
  choice: Lakini ... na ...
  rationale: 'וְ ya kwanza inaunganisha sentensi hii na iliyotangulia kwa utofautishaji: mji wenyewe ulitolewa kwa makuhani, lakini ardhi yake ikapewa Kalebu. “Lakini” huonyesha uhusiano huo kwa Kiswahili cha kawaida.'
