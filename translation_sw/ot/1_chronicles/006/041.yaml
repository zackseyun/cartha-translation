    rationale: The Hebrew can refer to villages, settlements, or associated open lands. In the city-allotment formulation here, “villages” is the most direct, non-interpretive Swahili equivalent; “pasturelands” may be an interpretive contextual alternative.
  - severity: low
    issue: “walipewa Kalebu” uses a passive construction where the active Hebrew is clearer in Swahili.
    rationale: “Waliwapa Kalebu ...” explicitly retains the unspecified plural givers and marks Caleb naturally as recipient.
  revised_text: Lakini waliwapa Kalebu mwana wa Yefune mashamba ya mji huo na vijiji vyake[a].
