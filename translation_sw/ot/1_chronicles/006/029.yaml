base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/029.yaml
  text: 'And the sons of Merari[a], their brothers, were on the left: Ethan son of Kishi, son of Abdi, son of Malluch.'
translation:
  language: sw
  text: 'Na wana wa Merari, ndugu zao[a], walikuwa upande wa kushoto: Ethani mwana wa Kishi, mwana wa Abdi, mwana wa Maluki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa zao”; neno la Kiebrania linalomaanisha “ndugu” linaweza kutumiwa kwa upana zaidi kuhusu watu wa ukoo mmoja katika nasaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Na wana wa
  rationale: Neno בני kimsingi humaanisha “wana wa,” ingawa katika nasaba linaweza pia kumaanisha wazao; muundo wa Kiebrania umehifadhiwa kwa Kiswahili cha kawaida.
- source_word: מְרָרִי
  choice: Merari
  rationale: Jina limetoholewa kwa tahajia inayotumika katika Kiswahili.
- source_word: אֲחֵיהֶם
  choice: ndugu zao
  rationale: אחים linaweza kumaanisha ndugu wa tumbo au, katika muktadha wa kikabila na nasaba, jamaa wa ukoo. “Ndugu zao” huhifadhi upana huo wa maana kwa Kiswahili.
- source_word: עַל הַשְּׂמֹאול
  choice: walikuwa upande wa kushoto
  rationale: Kirai hiki ni “upande wa kushoto”; kitenzi “walikuwa” kimeongezwa ili kukamilisha sentensi ya Kiswahili bila kubadili maana ya mahali.
- source_word: אֵיתָן
  choice: Ethani
  rationale: Jina limetoholewa kwa namna ya Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika mfuatano huu wa nasaba, בן limetafsiriwa kwa maana yake ya kawaida, “mwana wa,” bila kulifanya moja kwa moja kuwa “mzao wa.”
- source_word: קִישִׁי
  choice: Kishi
  rationale: Jina limetoholewa kwa namna ya Kiswahili.
- source_word: עַבְדִּי
  choice: Abdi
  rationale: Jina limetoholewa kwa namna ya Kiswahili.
- source_word: מַלּוּךְ
  choice: Maluki
  rationale: Jina limetoholewa kwa namna ya Kiswahili.
