base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/004.yaml
  text: 'The sons of Merari: Mahli and Mushi[b][a]. These were the clans of the Levites according to their fathers’ houses.'
translation:
  language: sw
  text: Wana wa Merari walikuwa Mahli na Mushi. Hizi ndizo koo[a] za Walawi, kulingana na nyumba za baba zao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jamaa.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “kulingana na baba zao”; katika muktadha huu wa nasaba maana yake ni kupangwa kwa kufuata nyumba za ukoo wa upande wa baba.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa neno בן katika hali ya kutegemea, likitambulisha wana waliotajwa katika orodha ya nasaba. “Wana wa” ni wazi na la kawaida katika Kiswahili cha nasaba.
- source_word: מְרָרִי
  choice: Merari
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: מַחְלִי
  choice: Mahli
  rationale: Jina la mtu limetoholewa.
- source_word: וּמֻשִׁי
  choice: na Mushi
  rationale: Kiunganishi cha Kiebrania וּ kimetafsiriwa “na,” na jina limetoholewa.
- source_word: וְאֵלֶּה
  choice: Hizi ndizo
  rationale: Kishazi hiki kinatambulisha muhtasari wa vikundi vilivyotajwa. “Hizi ndizo” ni ya asili katika Kiswahili na inafaa kwa nomino “koo.”
- source_word: מִשְׁפְּחוֹת
  choice: koo
  rationale: Katika muktadha wa kikabila na kinasaba, neno hili humaanisha vikundi vya kindugu, si familia ndogo pekee. “Koo” linaonyesha maana hiyo; “jamaa” limewekwa kama uwezekano katika tanbihi.
- source_word: הַלֵּוִי
  choice: za Walawi
  rationale: Ingawa umbo la Kiebrania ni la umoja, hapa lina maana ya pamoja ya watu wa kabila la Lawi. “Walawi” ni Kiswahili cha kawaida na huwasilisha maana hiyo bila kufanya sentensi kuwa ngumu.
- source_word: לַאֲבוֹתֵיהֶם
  choice: kulingana na nyumba za baba zao
  rationale: Kiebrania kinasema kihalisi “kulingana na baba zao.” Katika orodha za nasaba, usemi huo huonyesha mpangilio kwa nyumba au jamii za ukoo wa baba. Tafsiri imeweka wazi wazo la “nyumba” huku ikihifadhi mtazamo wa nasaba ya upande wa baba.
