lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa neno בֵּן katika hali ya kuunganisha, nao unaanzisha orodha ya ukoo. “Wana wa” huhifadhi muundo wa Kiebrania na hufaa katika nasaba.
- source_word: קְהָת
  choice: Kohathi
  rationale: Jina la mtu limeandikwa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: עַמִּינָדָב
  choice: Aminadabu
  rationale: Jina hili limeendelezwa kama jina la mtu. Ingawa nasaba sambamba hutaja jina tofauti, maandishi ya Kiebrania ya mstari huu yanasoma Aminadabu.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Nomino ya umoja yenye kiambishi cha nafsi ya tatu ya kiume inaonyesha uhusiano wa mwana katika mfululizo wa nasaba. “Mwanawe” ni fasaha na hudumisha urudiaji wa maandishi ya Kiebrania.
- source_word: קֹרַח
  choice: Kora
  rationale: Jina la mtu limeandikwa kwa umbo la Kiswahili linalotambulika.
- source_word: אַסִּיר
  choice: Asiri
  rationale: Neno hili limetumiwa hapa kama jina la mtu, kwa hiyo limetoholewa badala ya kutafsiriwa kwa maana yake ya kawaida.
