  text: וְ/אֵ֗לֶּה אֲשֶׁ֨ר הֶעֱמִ֥יד דָּוִ֛יד עַל יְדֵי שִׁ֖יר בֵּ֣ית יְהוָ֑ה מִ/מְּנ֖וֹחַ הָ/אָרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/016.yaml
  text: These are the men whom David appointed over the service of song in the house of Yahweh[b][a], after the ark came to rest.
translation:
  language: sw
  text: Hawa ndio watu ambao Daudi aliwaweka kusimamia huduma ya uimbaji[a] katika nyumba ya Yahweh, tangu sanduku lilipotulia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya kuimba” au “kusimamia uimbaji.” Kirai cha Kiebrania huonyesha wajibu wa uimbaji katika ibada.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “tangu kutulia kwa sanduku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Hawa ndio
  rationale: Hutambulisha orodha inayofuata. Kiswahili hiki ni cha kawaida na kinadumisha nguvu ya kiashiria bila kulazimisha kiunganishi cha mwanzo.
- source_word: אֲשֶׁר הֶעֱמִיד דָּוִיד
  choice: ambao Daudi aliwaweka
  rationale: Hiphili ya עמד hapa inaonyesha kuwaweka watu katika jukumu rasmi, si kuwasimamisha kimwili tu.
- source_word: עַל יְדֵי שִׁיר
  choice: wasimamie uimbaji
  rationale: Katika muktadha huu, kirai hiki kinaonyesha kuwajibika kwa kazi ya kuimba katika ibada. Tafsiri hii ni ya asili kwa Kiswahili na inadumisha wazo la usimamizi.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Neno בַּיִת limehifadhiwa kama ‘nyumba’ badala ya kufasiriwa kuwa ‘hekalu,’ na jina la agano יְהוָה limetolewa kama Yahweh.
- source_word: מִמְּנוֹחַ הָאָרוֹן
  choice: tangu sanduku lilipopata mahali pa kupumzika
  rationale: מִן pamoja na מְנוֹחַ huonyesha mwanzo wa kipindi kuanzia sanduku lilipotulia mahali pake. ‘Tangu’ inadumisha vizuri zaidi nguvu ya ‘kutoka wakati wa’ kuliko ‘baada ya’ pekee.
- source_word: הָאָרוֹן
  choice: sanduku
  rationale: Chanzo kinasema tu ‘sanduku’; hakuna nyongeza ya ‘la agano’ katika aya hii.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja Tetragramatoni. ‘Yahweh’ hulihifadhi kama jina la pekee badala ya kulibadilisha kuwa cheo.
- issue: Maana ya מִמְּנוֹחַ kuhusiana na sanduku
  choice: tangu sanduku lilipopata mahali pa kupumzika
  alternative: baada ya sanduku kutulia
  rationale: ‘Tangu’ huhifadhi maana ya mwanzo wa kipindi iliyo katika preposisheni מִן, huku ‘baada ya’ ikiwezekana lakini ikisisitiza tu mpangilio wa matukio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. ‘Uimbaji’ limetumiwa badala ya istilahi nzito ya kidini, na ‘nyumba ya Yahweh’ huhifadhi taswira ya Kiebrania bila kuongeza ‘hekalu.’
