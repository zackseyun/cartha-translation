  text: 'The sons of Levi: Gershom[a], Kohath[b], and Merari.'
translation:
  language: sw
  text: 'Wana wa Lawi[a]: Gershomu[b], Kohathi, na Merari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika lugha ya nasaba ya Kiebrania, neno “wana” linaweza kumaanisha wana wa moja kwa moja au, katika mazingira mengine, wazao kwa upana. Hapa muktadha unaonyesha kuwa hawa ni wana wa moja kwa moja wa Lawi.
    reason: cultural_note
  - marker: b
    text: Maandishi ya Kiebrania hapa yana jina “Gershom.” “Gershomu” ni utohozi wa jina hilo katika Kiswahili; katika vifungu vinavyohusiana, baadhi ya mapokeo hutumia tahajia “Gershoni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Hili ni umbo la wingi la neno ‘mwana’ katika hali ya kuunganisha. Katika nasaba linaweza wakati mwingine kumaanisha wazao kwa upana, lakini hapa linawataja wana wa moja kwa moja wa Lawi.
- source_word: לֵוִי
  choice: Lawi
  rationale: Jina hili la mtu limetolewa kwa tahajia iliyozoeleka katika Kiswahili cha Biblia.
- source_word: גֵּרְשֹׁם
  choice: Gershomu
  rationale: Tahajia hii inafuata umbo la Kiebrania lenye konsonanti ya mwisho m, huku ikiongezewa vokali ya mwisho ili lisomeke kwa kawaida katika Kiswahili.
- source_word: קְהָת
  choice: Kohathi
  rationale: Jina hili limetoholewa kwa namna inayoeleweka na iliyozoeleka katika Kiswahili cha Biblia.
- source_word: וּ/מְרָרִי
  choice: na Merari
  rationale: Kiunganishi וּ kimetafsiriwa ‘na’, nacho jina מְרָרִי limetoholewa kuwa ‘Merari’.
