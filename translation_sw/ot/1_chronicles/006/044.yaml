lexical_decisions:
- source_word: עָשָׁן
  choice: Ashani
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili; andiko la Kimasora la Mambo ya Nyakati lina עָשָׁן (Ashani).
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: Neno hili humaanisha maeneo ya wazi yaliyokuwa mali ya mji, hasa kwa ajili ya malisho; usemi huu ni wazi na wa kawaida katika muktadha wa miji ya Walawi.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Beth-shemeshi
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa kihalisi kuwa ‘Nyumba ya Jua,’ na limepewa umbo linalotamkika kwa urahisi katika Kiswahili.
- source_word: וְאֶת
  choice: na / pamoja na
  rationale: Kiunganishi וְ kimewakilishwa kwa ‘na’; alama ya yambwa אֶת haina kisawe cha moja kwa moja katika Kiswahili. ‘Pamoja na’ huonyesha kwa kawaida uhusiano wa kila mji na maeneo yake.
