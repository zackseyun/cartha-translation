lexical_decisions:
- source_word: חוּקֹק
  choice: Hukoki
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kiasili katika Kiswahili, huku usomaji wa WLC/Masoreti ukihifadhiwa katika matini kuu.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: Neno hili linamaanisha ardhi ya wazi iliyohusishwa na mji, hasa kwa matumizi ya malisho; tafsiri hii ni wazi na ya kawaida kwa msomaji wa kisasa.
- source_word: רְחֹב
  choice: Rehobu
  rationale: Jina la mahali limetoholewa kwa muundo wa Kiswahili bila kulitafsiri kama neno la kawaida.
- source_word: וְאֶת
  choice: na ... pamoja na
  rationale: Kiunganishi na kiashiria cha yambwa vinawakilishwa kwa uratibu wa kawaida wa Kiswahili; 'pamoja na' kinaonyesha uhusiano wa kila mji na maeneo yake ya malisho.
