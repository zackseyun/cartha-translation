translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo mfupi na wenye hadhi unaofaa orodha ya nasaba. Marudio ya ‘mwanawe’ yamehifadhiwa ili kufuata muundo wa Kiebrania. Alama ya tanbihi imewekwa baada ya jina la mwisho na fomula yake ili isivuruge usomaji.
