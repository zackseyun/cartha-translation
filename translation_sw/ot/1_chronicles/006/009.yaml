  text: Tahath his son[a], Uriel his son, Uzziah his son, and Shaul his son.
translation:
  language: sw
  text: Tahathi mwanawe, Urieli mwanawe, Uzia mwanawe, na Shauli mwanawe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Shauli ni umbo la Kiswahili la jina la Kiebrania Shaul; katika tafsiri nyingi huandikwa Sauli.
