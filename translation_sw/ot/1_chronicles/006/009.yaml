lexical_decisions:
- source_word: תַּחַת
  choice: Tahathi
  rationale: Jina la mtu katika nasaba; limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Katika orodha hii ya nasaba, neno בֵּן limetafsiriwa kwa maana yake ya kawaida, ‘mwana’; hata hivyo, katika nasaba linaweza pia kumaanisha mzao wa baadaye.
- source_word: אוּרִיאֵל
  choice: Urieli
  rationale: Jina la mtu limetoholewa kwa muundo wa kawaida wa majina ya Biblia katika Kiswahili.
- source_word: עֻזִּיָּה
  choice: Uzia
  rationale: Jina la mtu limetoholewa kwa umbo la Kiswahili linalolingana na matamshi ya Kiebrania.
- source_word: וְשָׁאוּל
  choice: na Shauli
  rationale: Kiunganishi וְ kimetafsiriwa ‘na,’ na jina שָׁאוּל limetoholewa ‘Shauli’ ili kuhifadhi sauti ya Kiebrania kwa namna ya asili katika Kiswahili.
