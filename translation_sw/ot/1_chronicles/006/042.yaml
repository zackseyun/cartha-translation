base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/042.yaml
  text: 'And to the sons of Aaron they gave the cities of refuge: Hebron[a], and Libnah with its pasturelands, and Jattir, and Eshtemoa with its pasturelands.'
translation:
  language: sw
  text: 'Nao wakawapa wana wa Aroni miji ya makimbilio: Hebroni, Libna pamoja na maeneo yake ya malisho[a], Yatiri, na Eshtemoa pamoja na maeneo yake ya malisho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ardhi yake ya wazi”; neno la Kiebrania linamaanisha ardhi ya wazi inayohusishwa na mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי אַהֲרֹן
  choice: Nao wana wa Aroni
  rationale: לִ־ huonyesha wapokeaji; muundo huu wa Kiswahili unaendeleza simulizi kwa kawaida huku ukihifadhi maana ya wana wa Aroni.
- source_word: נָתְנוּ
  choice: walipewa
  rationale: Kiebrania kinasema kihalisi ‘walitoa/wakawapa’; kauli tendwa ya Kiswahili inawasilisha kwa uwazi ugawaji kwa wana wa Aroni bila kulazimika kutaja tena watoaji wanaoeleweka kutokana na muktadha.
- source_word: עָרֵי הַמִּקְלָט
  choice: miji ya makimbilio
  rationale: Ni istilahi ya kisheria kwa miji iliyotengwa ambako mtu angeweza kukimbilia kupata hifadhi.
- source_word: חֶבְרוֹן
  choice: Hebroni
  rationale: Tahajia ya jina hili iliyozoeleka katika Kiswahili.
- source_word: לִבְנָה
  choice: Libna
  rationale: Uhamishaji wa kawaida wa jina la mahali kwa Kiswahili.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: מִגְרָשׁ hurejelea ardhi ya wazi inayouzunguka na kuuhusu mji, ambayo inaweza kutumiwa kwa malisho; ‘maeneo ya malisho’ ni ya asili na inaeleweka katika Kiswahili cha sasa.
- source_word: יַתִּר
  choice: Yatiri
  rationale: Uhamishaji wa jina la mahali unaofuata matamshi ya Kiebrania na mtindo wa Kiswahili.
- source_word: אֶשְׁתְּמֹעַ
  choice: Eshtemoa
  rationale: Uhamishaji wa jina la mahali unaohifadhi kwa karibu umbo la Kiebrania.
