translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Orodha na alama za uakifishaji zimewekwa wazi ili Hebroni isitafsiriwe kana kwamba inaunganishwa na maeneo ya malisho ya Libna; katika maandishi ya Kiebrania yaliyotolewa, maeneo ya malisho yanatajwa kwa Libna na Eshtemoa.
