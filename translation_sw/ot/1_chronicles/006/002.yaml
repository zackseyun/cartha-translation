  rationale: Muktadha huu wa nasaba unawataja Libni na Shimei kuwa wana wa moja kwa moja wa Gershomu, ingawa neno hilo katika miktadha mingine linaweza kumaanisha wazao.
- source_word: גֵרְשׁוֹם
  choice: Gershomu
  rationale: Jina limeandikwa גֵרְשׁוֹם katika maandishi ya Kiebrania; umbo la Kiswahili “Gershomu” hurahisisha matamshi bila kulitafsiri jina.
- source_word: לִבְנִי
  choice: Libni
  rationale: Ni jina la mtu, limenukuliwa kwa umbo linalofaa Kiswahili.
- source_word: וְשִׁמְעִי
  choice: na Shimei
  rationale: Kiunganishi וְ kinaunganisha jina la pili katika orodha; “Shimei” ni unukuzi wa jina la mtu.
