lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Haya ndiyo
  rationale: Muundo huu unatambulisha orodha kwa Kiswahili cha kawaida na kuhifadhi msisitizo wa uwasilishaji wa Kiebrania; kiunganishi וְ hakihitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: שְׁמוֹת
  choice: majina
  rationale: Katika muundo שְׁמוֹת בְּנֵי, tafsiri ya kawaida na sahihi ni “majina ya wana wa.”
- source_word: בְּנֵי
