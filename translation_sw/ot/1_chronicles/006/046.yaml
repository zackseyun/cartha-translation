base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/046.yaml
  text: And to the sons of Kohath[a] who remained, from the families of the tribe, from the half-tribe, the half of Manasseh, ten cities were given by lot.
translation:
  language: sw
  text: Nao wana wa Kohathi waliobaki, kutoka katika jamaa ya kabila, kutoka katika nusu ya kabila, ile nusu ya Manase,[a] walipewa miji kumi kwa kura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania, kwa maana halisi: “kutoka katika jamaa ya kabila, kutoka katika nusu ya kabila, nusu ya Manase.” Huu ni usemi wa kifomula unaorejelea nusu ya kabila la Manase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: Nao wana wa Kohathi
  rationale: Muundo huu unaendeleza orodha ya ugawaji. “Wana wa” huhifadhi nahau ya ukoo ya Kiebrania, huku “Kohathi” likifuata umbo la jina lililozoeleka katika Kiswahili cha Biblia.
- source_word: הַנּוֹתָרִים
  choice: waliobaki
  rationale: Huwaonyesha Wakohathi waliokuwa bado hawajapokea mgao baada ya migao iliyotangulia.
- source_word: מִמִּשְׁפַּחַת הַמַּטֶּה
  choice: kutoka katika jamaa za kabila
  rationale: מִשְׁפָּחָה hapa ni kundi la kijamaa au ukoo ndani ya kabila, na מַטֶּה katika muktadha huu humaanisha “kabila,” si fimbo.
- source_word: מִֽמַּחֲצִית מַטֵּה חֲצִי מְנַשֶּׁה
  choice: kutoka katika nusu-kabila, nusu ya Manase
  rationale: Tafsiri inahifadhi marudio yasiyo ya kawaida ya Kiebrania badala ya kuyasawazisha kimya kimya kuwa “nusu-kabila la Manase.” Tanbihi inaeleza maana ya fomula hiyo.
- source_word: בַּגּוֹרָל
  choice: kwa kura
  rationale: Ni usemi mfupi na wa kawaida wa Kiswahili unaoonyesha kwamba mgao uliamuliwa kwa kupiga kura.
- source_word: עָרִים עָשֶׂר
  choice: walipewa ... miji kumi
  rationale: Kiebrania hakina kitenzi wazi katika fomula hii; “walipewa” hujazwa kutokana na muktadha wa ugawaji. עָרִים imetafsiriwa “miji.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi na marudio ya kifomula yamehifadhiwa kwa kiasi kikubwa ili kuonyesha upekee wa maandishi ya Kiebrania, huku kitenzi “walipewa” kikiongezwa kwa uwazi wa Kiswahili.
