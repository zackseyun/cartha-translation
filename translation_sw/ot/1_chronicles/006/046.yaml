  source_fidelity: Rasimu inawakilisha wahusika, Manase, miji kumi, na ugawaji kwa kura kwa uaminifu wa jumla. Hata hivyo, ״מִמִּשְׁפַּחַת״ ni umoja, hivyo “jamaa za” hubadilisha idadi bila sababu. Muundo wa sehemu ya kabila unahitaji pia ufafanuzi mdogo wa kiambatisho ili usomeke kwa Kiswahili huku ukihifadhi marudio ya kifomula ya Kiebrania.
  naturalness: “Nusu-kabila, nusu ya Manase” inaiga muundo wa Kiebrania lakini haisomeki kwa urahisi katika Kiswahili Sanifu. “Nusu ya kabila, ile nusu ya Manase” huhifadhi marudio hayo na hueleweka kiasili zaidi. Nafasi ya “kwa kura” mwishoni pia ni mtiririko wa kawaida.
  terminology: “Wana wa Kohathi,” “kabila,” “Manase,” “miji,” na “kwa kura” ni istilahi zinazofaa. “Kwa kura” katika muktadha huu hurejelea ugawaji kwa kura/lot, si kura ya uchaguzi; maelezo ya uamuzi wa kileksika yanayosema “kupiga kura” yangeweza kupotosha, ingawa hayamo katika maandishi ya mstari.
