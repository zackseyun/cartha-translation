  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֨י גֵרְשׁ֜וֹם לְ/מִשְׁפְּחוֹתָ֗/ם מִ/מַּטֵּ֣ה יִ֠שָׂשכָר וּ/מִ/מַּטֵּ֨ה אָשֵׁ֜ר וּ/מִ/מַּטֵּ֣ה נַפְתָּלִ֗י וּ/מִ/מַּטֵּ֤ה מְנַשֶּׁה֙ בַּ/בָּשָׁ֔ן עָרִ֖ים שְׁלֹ֥שׁ עֶשְׂרֵֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/047.yaml
  text: 'And to the sons of Gershom[a], according to their clans, from the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali[b], and from the tribe of Manasseh in Bashan: thirteen cities.'
translation:
  language: sw
  text: Na wana wa Gershomu[a], kwa koo zao, walipewa kutoka kabila la Isakari, kutoka kabila la Asheri, kutoka kabila la Naftali, na kutoka kabila la Manase katika Bashani[b], miji kumi na mitatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaandika jina la ukoo hapa kuwa “Gershomu”; katika mapokeo mengine ya Biblia jina hili huandikwa “Gershoni.”
    reason: alternative_reading
  - marker: b
    text: Baadhi ya tafsiri hupanua “Manase katika Bashani” kuwa “nusu ya kabila la Manase katika Bashani” ili kufafanua eneo linalokusudiwa; maneno “nusu ya kabila” hayapo katika Kiebrania cha mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: Na wana wa ... walipewa
  rationale: Kirai hiki kinaendeleza orodha ya ugawaji wa miji. Kitenzi “walipewa” kimewekwa wazi kwa Kiswahili cha kawaida kutokana na muktadha, ingawa hakirudiwi katika mstari huu wa Kiebrania.
- source_word: גֵרְשׁוֹם
  choice: Gershomu
  rationale: Jina la Kiebrania katika mstari huu ni Gershom; umbo la Kiswahili “Gershomu” huhifadhi tahajia hiyo na kurahisisha matamshi.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: kwa koo zao
  rationale: Katika muktadha wa kikabila na ugawaji, מִשְׁפָּחָה humaanisha vikundi vya ukoo ndani ya kabila; “koo” ni sahihi kuliko “familia” hapa.
- source_word: מִמַּטֵּה
  choice: kutoka kabila la
  rationale: מַטֶּה katika muktadha huu humaanisha kabila; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: יִשָׂשכָר
  choice: Isakari
  rationale: Hili ni umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אָשֵׁר
  choice: Asheri
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la kabila.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la kabila.
- source_word: מְנַשֶּׁה בַּבָּשָׁן
  choice: Manase katika Bashani
  rationale: Kiebrania kinasema tu “Manase katika Bashani”; tafsiri haiongezi “nusu ya kabila,” jambo ambalo halijasemwa wazi katika mstari huu.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: miji kumi na mitatu
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya idadi hiyo katika Kiswahili.
theological_decisions:
- issue: Utambulisho wa sehemu ya Manase iliyokuwa Bashani
  choice: Manase katika Bashani
  alternative: nusu ya kabila la Manase katika Bashani
  rationale: Ingawa muktadha wa kijiografia unahusu sehemu ya Manase iliyokuwa ng’ambo ya Yordani, mstari wa Kiebrania hautaji wazi “nusu ya kabila”; tafsiri imehifadhi ufupi na mvutano wa matini chanzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umefanywa kuwa wa asili kwa kuongeza “walipewa” kutokana na muktadha wa orodha, huku taarifa ya chanzo na alama zote za tanbihi zikihifadhiwa.
