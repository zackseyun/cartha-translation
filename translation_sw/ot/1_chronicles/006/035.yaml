  text: 'And these were the sons of Aaron: Eleazar his son, Phinehas his son, Abishua his son.'
translation:
  language: sw
  text: 'Na hawa ndio wana wa Aroni: Eleazari mwanawe, Finehasi mwanawe, Abishua mwanawe.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Na hawa ndio
  rationale: Muunganiko wa kiunganishi na kiwakilishi cha kuonyesha unaanzisha orodha ya ukoo; “Na hawa ndio” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Mfuatano unaotajwa ni wa uhusiano wa moja kwa moja wa baba na mwana, hivyo “wana wa” ni sahihi kuliko neno pana zaidi “wazao wa”.
- source_word: אַהֲרֹן
  choice: Aroni
  rationale: Umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: אֶלְעָזָר
  choice: Eleazari
  rationale: Umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Nomino yenye kiambishi cha nafsi ya tatu ya kiume inaonyesha uhusiano wa moja kwa moja; “mwanawe” ni tafsiri fupi na ya asili katika orodha ya ukoo.
- source_word: פִּינְחָס
  choice: Finehasi
  rationale: Umbo linalotambulika katika mapokeo ya majina ya Biblia ya Kiswahili huku likiwakilisha jina la Kiebrania.
- source_word: אֲבִישׁוּעַ
  choice: Abishua
  rationale: Unukuzi unaoeleweka wa jina la Kiebrania na unaolingana na matumizi ya kawaida ya Biblia.
