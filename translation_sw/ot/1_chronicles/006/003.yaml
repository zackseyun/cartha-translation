  text: 'Na wana wa Kohathi: Amramu, Ishari, Hebroni, na Uzieli.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Na wana wa
  rationale: Kiunganishi וּ־ kimehifadhiwa kwa “Na” ili kuendeleza mfululizo wa nasaba; בְנֵי ni hali ya muundo tegemezi inayomaanisha “wana wa.” Hapa majina manne ni wana wa moja kwa moja wa Kohathi.
- source_word: קְהָת
  choice: Kohathi
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika tafsiri za Biblia za Kiswahili.
- source_word: עַמְרָם
  choice: Amramu
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida na inayosomeka kwa Kiswahili.
- source_word: וְיִצְהָר
  choice: Ishari
  rationale: Jina limetoholewa kwa kufuata matamshi ya Kiebrania kwa namna ya kawaida katika Kiswahili; kiunganishi chake kinawakilishwa na mpangilio wa orodha.
- source_word: וְחֶבְרוֹן
  choice: Hebroni
  rationale: Hapa חֶבְרוֹן ni jina la mtu, si rejeo la kijiografia; umbo la Kiswahili “Hebroni” linafaa katika nasaba hii.
- source_word: וְעֻזִּיאֵל
  choice: Uzieli
  rationale: Jina la mtu limetoholewa kwa Kiswahili, na kiunganishi וְ־ kimetolewa kwa “na” kabla ya jina la mwisho.
