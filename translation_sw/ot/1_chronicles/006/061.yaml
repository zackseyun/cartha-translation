base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/061.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee with its pasturelands[a], Hammon with its pasturelands, and Kiriathaim with its pasturelands.'
translation:
  language: sw
  text: 'Na kutoka katika kabila la Naftali: Kedeshi katika Galilaya pamoja na maeneo yake ya malisho[a], Hamoni pamoja na maeneo yake ya malisho, na Kiriathaimu pamoja na maeneo yake ya malisho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ardhi ya wazi”; neno la Kiebrania hurejelea ardhi ya wazi inayouzunguka kila mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: Na kutoka katika kabila la
  rationale: Katika muktadha wa kugawa miji kwa makabila, מַטֶּה humaanisha ‘kabila’; viambishi וּ na מִ־ vimetafsiriwa kwa kawaida kama ‘Na kutoka katika.’
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Jina la kabila limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: Kedeshi katika Galilaya
  rationale: בַּגָּלִיל ni maelezo ya eneo yanayotofautisha mji huu; ‘katika Galilaya’ ni Kiswahili cha kawaida na wazi.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: מִגְרָשׁ hurejelea ardhi ya wazi iliyokuwa ya mji, hasa kwa matumizi ya malisho; kiambishi cha nafsi ya tatu umoja wa kike kinarejelea kila mji.
- source_word: חַמּוֹן
  choice: Hamoni
  rationale: Jina la mahali limetoholewa moja kwa moja kwa muundo unaosomeka kwa kawaida katika Kiswahili.
- source_word: קִרְיָתַיִם
  choice: Kiriathaimu
  rationale: Jina la mahali limetoholewa kwa kufuata umbo la Kiebrania huku likipewa matamshi ya kawaida ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa orodha na marudio ya maandishi ya Kiebrania yamehifadhiwa. Kitenzi ‘walipewa’ kimeongezwa ili kukamilisha kishazi hiki kwa Kiswahili kwa kuzingatia muktadha wa orodha inayoendelea.
