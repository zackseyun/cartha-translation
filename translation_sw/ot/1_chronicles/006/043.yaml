  text: and Hilen with its pasturelands[a], Debir with its pasturelands.
translation:
  language: sw
  text: na Hileni pamoja na maeneo yake ya malisho[a], na Debiri pamoja na maeneo yake ya malisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina “Hileni” linafuata umbo la Kiebrania katika Mambo ya Nyakati. Orodha inayofanana katika Yoshua 21:15 ina “Holoni.”
    reason: alternative_reading
lexical_decisions:
- source_word: חִילֵז
  choice: Hileni
  rationale: Jina la mahali limetoholewa moja kwa moja kutokana na umbo la Kiebrania la kitabu cha Mambo ya Nyakati, kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: Neno hili linamaanisha ardhi ya wazi inayozunguka mji, hasa iliyotumiwa kwa malisho; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: דְּבִיר
  choice: Debiri
  rationale: Jina la mahali limetoholewa kwa tahajia inayolingana na mfumo wa sauti wa Kiswahili.
- source_word: וְ/אֶת
  choice: na
  rationale: Katika orodha hii, kiunganishi kinaendeleza vitu vinavyotajwa, huku alama ya yambwa ya Kiebrania ikiwa haina neno linalolingana moja kwa moja katika Kiswahili.
- source_word: אֶת
  choice: —
  rationale: Alama ya yambwa dhahiri ya Kiebrania haitafsiriwi kwa neno tofauti katika Kiswahili; kazi yake inaonekana katika muundo wa orodha.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa orodha umehifadhiwa, na “pamoja na” linaonyesha kwamba kila mji umetajwa na maeneo yake ya malisho.
