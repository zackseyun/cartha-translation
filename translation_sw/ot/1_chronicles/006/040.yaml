  text: They gave them Hebron in the land of Judah[a], with its pasturelands around it.
translation:
  language: sw
  text: Wakawapa Hebroni katika nchi ya Yuda, pamoja na maeneo ya malisho yaliyoizunguka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ardhi yake ya wazi ya matumizi ya pamoja.” Neno la Kiebrania linamaanisha ardhi ya wazi inayohusishwa na mji, ambayo mara nyingi ilitumiwa kwa malisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Wakawapa
  rationale: Kauli ya masimulizi ya kitenzi נתן inaendeleza matukio kwa maana ya ‘na ndipo wakawapa’; ‘Wakawapa’ ni ya asili katika simulizi la Kiswahili.
- source_word: לָהֶם
  choice: -wa- katika ‘Wakawapa’
  rationale: Kiambishi cha yambwa ‘-wa-’ kinawakilisha kwa kawaida wale waliopewa.
- source_word: חֶבְרוֹן
  choice: Hebroni
  rationale: Jina la mahali limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: katika nchi ya Yuda
  rationale: Neno אֶרֶץ lina maana ya nchi au eneo; tafsiri hii inadumisha maelezo ya kijiografia bila kuyabana kupita kiasi.
- source_word: מִגְרָשֶׁיהָ
  choice: maeneo yake ya malisho
  rationale: מִגְרָשׁ hurejelea ardhi ya wazi iliyohusishwa na mji, mara nyingi kwa malisho; usemi huu ni wazi kwa wasomaji wa sasa.
- source_word: סְבִיבֹתֶיהָ
  choice: yaliyolizunguka
  rationale: Inaonyesha kwamba maeneo hayo yalikuwa kuuzunguka mji wa Hebroni.
