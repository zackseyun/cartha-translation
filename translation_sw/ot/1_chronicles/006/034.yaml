base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/034.yaml
  text: And Aaron and his sons were offering on the altar of burnt offering and on the altar of incense[a], for all the work of the Most Holy Place and to make atonement for Israel, according to all that Moses the servant of God had commanded.
translation:
  language: sw
  text: Naye Haruni na wanawe walikuwa wakifukiza juu ya madhabahu ya sadaka ya kuteketezwa na juu ya madhabahu ya uvumba, wakitekeleza huduma yote ya mahali patakatifu kabisa[a] na kufanya upatanisho kwa ajili ya Israeli, sawasawa na yote ambayo Musa, mtumishi wa Mungu, alikuwa ameamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vitu vitakatifu sana”; kirai cha Kiebrania kinaweza kumaanisha mahali patakatifu kuliko yote au vitu vilivyo vitakatifu sana, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְטִירִים
  choice: walikuwa wakiteketeza matoleo
  rationale: Kitenzi hiki katika kauli ya Hifili hueleza kufanya sadaka au uvumba upande kama moshi. Tafsiri hii inafaa kwa madhabahu zote mbili bila kuifanya tendo hilo kuwa sadaka za wanyama pekee.
- source_word: מִזְבַּח הָעֹלָה
  choice: madhabahu ya sadaka ya kuteketezwa
  rationale: Hili ni neno la kawaida la ibada kwa madhabahu iliyotumiwa kwa sadaka ya kuteketezwa.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: madhabahu ya uvumba
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili kwa madhabahu iliyotumiwa kufukizia uvumba.
- source_word: לְכֹל מְלֶאכֶת
  choice: wakifanya huduma yote ya
  rationale: Katika muktadha wa patakatifu, מְלָאכָה ni kazi au huduma waliyopewa makuhani; 'huduma' ni ya asili na inaonyesha kazi ya ibada bila kuibana kupita kiasi.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: mahali patakatifu kabisa
  rationale: Kirai hiki kinaweza kurejelea sehemu ya ndani kabisa ya patakatifu au vitu vitakatifu sana. Muktadha wa huduma ya makuhani unaruhusu maana ya mahali, huku tanbihi ikihifadhi utata wa Kiebrania.
- source_word: וּלְכַפֵּר עַל יִשְׂרָאֵל
  choice: na kufanya upatanisho kwa ajili ya Israeli
  rationale: '''Kufanya upatanisho'' huhifadhi maana pana ya kiibada ya כפר bila kuingiza nadharia maalumu ya kitheolojia.'
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: sawasawa na yote ambayo ... alikuwa ameamuru
  rationale: Huwasilisha kufuata kwa ukamilifu kila jambo lililoamriwa.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: mtumishi wa Mungu
  rationale: Huhifadhi cheo rasmi na chenye heshima alichopewa Musa.
theological_decisions:
- issue: Rejeleo la קֹדֶשׁ הַקֳּדָשִׁים
  choice: mahali patakatifu kabisa
  alternative: vitu vitakatifu sana
  rationale: Kirai cha Kiebrania kinaweza kumaanisha mahali patakatifu kuliko yote au mambo/vitu vitakatifu sana. Maana ya mahali inafaa katika muktadha, lakini tanbihi inahifadhi uwezekano mwingine.
- issue: Tafsiri ya כפר
  choice: kufanya upatanisho
  alternative: kufunika dhambi / kufanya fidia
  rationale: Chaguo hili linabaki pana na la kiibada, bila kuamua kwa niaba ya msomaji namna maalumu ya kitheolojia ambayo haijaelezwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Muundo wa sentensi umewekwa wa asili kwa Kiswahili, huku istilahi za ibada na utata halisi wa Kiebrania vikihifadhiwa.
