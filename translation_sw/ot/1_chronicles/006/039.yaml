base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/039.yaml
  text: These were their dwelling places according to their settlements within their territory[a], for the sons of Aaron, of the family of the Kohathites; for the lot was theirs.
translation:
  language: sw
  text: Haya ndiyo makao yao, kulingana na makazi yao katika eneo lao[a], ya wana wa Aroni, wa ukoo wa Wakohathi; kwa maana kura ilikuwa yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kulingana na kambi zao” au “katika vijiji vyao” badala ya “kulingana na makazi yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשְׁבוֹתָם
  choice: makao yao
  rationale: Neno hili humaanisha mahali pa kukaa au kuishi; “makao yao” ni Kiswahili cha sasa, cha kawaida na chenye uzito unaofaa.
- source_word: לְטִירוֹתָם
  choice: kulingana na makazi yao
  rationale: טִירָה linaweza kumaanisha makazi, kambi, au kijiji chenye uzio. “Makazi” linafaa katika muktadha wa maeneo waliyogawiwa bila kufungia maana kwenye kambi za kuhamahama au vijiji pekee.
- source_word: בִּגְבוּלָם
  choice: katika eneo lao
  rationale: גְּבוּל linaweza kumaanisha mpaka au eneo lililo ndani ya mpaka; hapa “eneo lao” linaeleza kwa kawaida sehemu waliyogawiwa.
- source_word: לִבְנֵי אַהֲרֹן
  choice: kwa ajili ya wana wa Aroni
  rationale: Huhifadhi usemi wa ukoo wa Kiebrania na utambulisho wa kikuhani bila kuubadili kuwa maelezo ya ziada.
- source_word: לְמִשְׁפַּחַת הַקְּהָתִי
  choice: wa jamaa ya Wakohathi
  rationale: Hutambulisha uhusiano wao na kundi pana la ukoo wa Kohathi kwa Kiswahili kinachoeleweka.
- source_word: כִּי לָהֶם הָיָה הַגּוֹרָל
  choice: kwa maana kura ilikuwa yao
  rationale: Hufuata kwa karibu muundo wa Kiebrania na kuhifadhi picha ya ugawaji kwa kura bila kuongeza kitenzi kisichotajwa wazi kama “iliwaangukia”.
