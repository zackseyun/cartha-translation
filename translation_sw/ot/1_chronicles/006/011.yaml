lexical_decisions:
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili cha Biblia.
- source_word: בְּנוֹ / בנו
  choice: mwanawe
  rationale: Nomino yenye kiambishi cha nafsi ya tatu umoja wa kiume; “mwanawe” ni Kiswahili cha kawaida na huhifadhi urudiaji na mdundo wa nasaba ya Kiebrania.
- source_word: צוֹפַי
  choice: Sofai
  rationale: Jina la mtu limetoholewa kwa kufuata matamshi ya maandishi ya Kimasora; namna nyingine ya kulitamka imehifadhiwa katika tanbihi.
- source_word: וְ
  choice: na
  rationale: Kiunganishi cha kawaida kinachounganisha mshiriki wa mwisho katika orodha ya nasaba.
- source_word: נַחַת
  choice: Nahathi
  rationale: Jina la mtu limetoholewa kwa namna ya asili na inayoeleweka katika Kiswahili.
