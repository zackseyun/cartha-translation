translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha fupi na yenye hadhi inayofaa orodha ya nasaba. Urudiaji wa “mwanawe” umehifadhiwa kwa uaminifu kwa muundo wa Kiebrania. Alama ya tanbihi imewekwa baada ya jina Sofai, ambalo ndilo linalohusika na tofauti hiyo.
