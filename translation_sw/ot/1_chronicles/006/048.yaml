base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/048.yaml
  text: To the sons of Merari, according to their clans, from the tribe of Reuben, from the tribe of Gad, and from the tribe of Zebulun, twelve cities by lot.
translation:
  language: sw
  text: Wana wa Merari, kwa kufuata koo zao, walipewa kwa kura miji kumi na miwili kutoka katika kabila la Reubeni, kabila la Gadi, na kabila la Zabuloni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי
  choice: Wana wa
  rationale: Katika muktadha huu wa nasaba na ugawaji, neno hili linawataja wazao wa Merari kama wapokeaji; “wana wa” huhifadhi usemi wa Kiebrania unaotumika katika nasaba.
- source_word: מְרָרִי
  choice: Merari
  rationale: Jina la mtu limetoholewa kwa umbo linalotambulika katika Kiswahili.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: kwa kufuata koo zao
  rationale: מִשְׁפָּחָה hapa ni kitengo cha ukoo ndani ya kundi la kikabila; “koo” ni sahihi kuliko “familia” katika muktadha huu.
- source_word: מִמַּטֵּה
  choice: kutoka katika kabila la
  rationale: מַטֶּה humaanisha kabila katika orodha za ugawaji; kurudiwa kwake kunahifadhiwa kwa kiasi kinachofaa katika Kiswahili cha kawaida.
- source_word: רְאוּבֵן
  choice: Reubeni
  rationale: Umbo la jina la kibiblia linalotumika na kutambulika katika Kiswahili.
- source_word: גָד
  choice: Gadi
  rationale: Umbo la jina la kibiblia linalotumika na kutambulika katika Kiswahili.
- source_word: זְבוּלֻן
  choice: Zabuloni
  rationale: Umbo la jina la kibiblia linalotumika na kutambulika katika Kiswahili.
- source_word: בַּגּוֹרָל
  choice: kwa kura
  rationale: Hueleza njia ya kugawa miji; “kwa kura” ni usemi mfupi na wa kawaida unaohifadhi maana ya chanzo.
- source_word: עָרִים
  choice: miji
  rationale: עָרִים hurejelea vituo vya makazi katika orodha hii ya ugawaji; “miji” ndilo neno la kawaida na mwafaka.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: kumi na miwili
  rationale: Umbo la kawaida la namba kumi na mbili likipatana kisarufi na nomino “miji”.
