  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika orodha hii ya ukoo, neno hili linaonyesha uhusiano wa kizazi. Kurudia “mwana wa” kunahifadhi muundo wa Kiebrania na ni lugha ya kawaida katika nasaba za Kiswahili.
- source_word: אֶתְנִי
  choice: Ethni
  rationale: Jina hili la mtu limetoholewa kwa herufi za Kilatini kwa kuzingatia umbo la Kiebrania; “th” husaidia kutofautisha konsonanti ת na ט katika majina ya nasaba.
- source_word: זֶרַח
  choice: Zera
  rationale: Jina la mtu limetoholewa kwa umbo linalosomeka kwa urahisi katika Kiswahili; konsonanti ya mwisho ח haijawakilishwa moja kwa moja kwa kuwa haina sauti inayolingana kikamilifu katika tahajia ya kawaida ya Kiswahili.
- source_word: עֲדָיָה
  choice: Adaya
  rationale: Jina la mtu limetoholewa moja kwa moja kutoka Kiebrania kwa umbo la Kiswahili linalosomeka kwa urahisi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo mfupi na wenye hadhi unaofaa orodha ya nasaba. Majina yametoholewa kutoka Kiebrania badala ya kuigwa moja kwa moja kutoka maumbo ya Kiingereza.
