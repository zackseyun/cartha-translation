lexical_decisions:
- source_word: וַיֹּסִיפוּ עוֹד
  choice: wakaja tena na
  rationale: Maneno haya mawili kwa pamoja yanaonyesha kurudiwa kwa tendo. Kiswahili cha asili kinatumia “tena”; “wakaja” linaunganisha kwa kawaida tendo la kurudi kwao na tendo linalofuata bila kutafsiri kitenzi יסף kwa namna ngumu ya neno kwa neno.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili cha Biblia.
- source_word: וַיִּפְשְׁטוּ
  choice: kuenea
  rationale: Katika muktadha huu wa kijeshi, פשט inaeleza vikosi kusambaa au kujipanga katika eneo. “Kuenea” huhifadhi wazo la kusambaa bila kuongeza dhana mahsusi ya kupora.
- source_word: בָּעֵמֶק
  choice: bondeni
  rationale: Kiambishi ב hapa kina maana ya mahali, na “bondeni” ni usemi wa kawaida wa Kiswahili unaomaanisha ndani ya bonde.
