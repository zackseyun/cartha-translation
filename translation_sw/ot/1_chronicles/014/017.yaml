base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/017.yaml
  text: And David’s name went out into all the lands[b][a], and Yahweh put the fear of him on all the nations.
translation:
  language: sw
  text: Jina la Daudi likaenea katika nchi zote[a], na Yahwe akafanya mataifa yote yamwogope Daudi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “Jina la Daudi likatoka kwenda katika nchi zote”; maana yake ni kwamba sifa au umaarufu wake ulienea.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kwa maneno halisi: “Yahwe akaweka hofu yake juu ya mataifa yote.” Kiambishi cha “yake” huenda kinamrejelea Daudi; kisarufi kinaweza pia kueleweka kuwa kinamrejelea Yahwe.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא שֵׁם דָּוִיד
  choice: Jina la Daudi likaenea
  rationale: Kitenzi יָצָא kwa msingi humaanisha ‘kutoka,’ lakini kinapotumiwa pamoja na ‘jina’ hapa ni nahau ya kuenea kwa sifa au umaarufu. ‘Jina ... likaenea’ linahifadhi taswira ya Kiebrania huku likieleweka kwa Kiswahili cha sasa.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: katika nchi zote
  rationale: Wingi אֲרָצוֹת unarejelea nchi au maeneo mbalimbali yanayomzunguka Daudi. ‘Katika nchi zote’ ni usemi wa kawaida na unaolingana na upana wa kishazi hicho.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetolewa kama jina binafsi ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: נָתַן אֶת פַּחְדּוֹ עַל
  choice: akayafanya ... yamwogope Daudi
  rationale: Kiebrania kwa muundo wake ni ‘akaweka hofu yake juu ya.’ Kiswahili kilichochaguliwa kinatoa maana ya nahau hiyo kwa uwazi na kwa mtiririko wa kawaida.
- source_word: כָּל הַגּוֹיִם
  choice: mataifa yote
  rationale: גּוֹיִם hapa humaanisha mataifa au makundi ya watu yaliyozunguka Israeli; ‘mataifa yote’ ni sawia na ya kawaida katika muktadha huu.
theological_decisions:
- issue: Mrejelewa wa kiambishi cha nafsi katika פַּחְדּוֹ (‘hofu yake’)
  choice: Mataifa yalimwogopa Daudi.
  alternative: Mataifa yalimwogopa Yahwe.
  rationale: Muktadha wa karibu unahusu jina la Daudi kuenea baada ya ushindi wake, hivyo Daudi ndiye mrejelewa anayowezekana zaidi. Hata hivyo, umbo la Kiebrania linaweza kisarufi kueleweka kuwa linarejelea Yahwe; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Usemi ‘Jina la Daudi likaenea’ unadumisha taswira ya Kiebrania bila kuwa mgumu; kishazi cha pili kimetolewa kwa Kiswahili cha kinahau huku utata wa kisarufi ukielezwa katika tanbihi.
