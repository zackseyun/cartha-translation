base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/012.yaml
  text: And they left their gods there[a], and David gave the order[b], and they were burned with fire.
translation:
  language: sw
  text: Nao wakaacha miungu yao huko[a]; Daudi akaamuru[b], nayo ikateketezwa kwa moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sanamu zao.” Kiebrania kinasema kihalisi “miungu yao,” ingawa huenda kinarejelea sanamu zao za ibada.
    reason: lexical_alternative
  - marker: b
    text: Simulizi sambamba katika 2 Samweli 5:21 linasema kwa kauli ya kutenda zaidi kwamba Daudi na watu wake walivichukua. Hapa katika Mambo ya Nyakati, miungu hiyo inasemwa kuwa iliteketezwa kwa moto kwa amri ya Daudi.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: wakaziacha
  rationale: Kitenzi עזב humaanisha kuacha au kutelekeza. Muundo huu unaonyesha kwamba Wafilisti waliiacha miungu yao walipokimbia bila kuongeza tafsiri isiyo katika matini.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki cha mahali kimetafsiriwa kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: אֶת אֱלֹהֵיהֶם
  choice: miungu yao
  rationale: Hii ndiyo maana ya moja kwa moja ya Kiebrania. Ingawa kinachokusudiwa huenda ni sanamu zao za ibada, tafsiri kuu inadumisha usemi wa matini chanzi.
- source_word: וַיֹּאמֶר דָּוִיד
  choice: Daudi akaamuru
  rationale: Kihalisi ni ‘Daudi akasema,’ lakini katika muktadha usemi huo ni agizo lililosababisha kuteketezwa. ‘Akaamuru’ huwasilisha kazi ya usemi kwa Kiswahili cha asili.
- source_word: וַיִּשָּׂרְפוּ
  choice: ikateketezwa
  rationale: Umbo hili linaeleweka hapa kwa maana ya kutendwa, huku ‘miungu yao’ ikiwa rejeleo la pamoja. Umoja wa ngeli katika ‘ikateketezwa’ ni wa kawaida kwa nomino ya ngeli ya mi-/m- inapotazamwa kwa ujumla na huepuka kuongeza mtendaji ambaye hajatajwa.
- source_word: בָּאֵשׁ
  choice: kwa moto
  rationale: Kirai hiki huonyesha njia au chombo kilichotumiwa; ‘kwa moto’ ni Kiswahili cha kawaida na wazi.
theological_decisions:
- issue: Tafsiri ya אֱלֹהֵיהֶם katika muktadha wa vitu vya ibada vya kipagani
  choice: miungu yao
  alternative: sanamu zao
  rationale: Matini ya Kiebrania inasema kihalisi ‘miungu yao.’ Kudumisha usemi huo huepuka kuingiza lugha ya kifafanuzi katika matini kuu, huku tanbihi ikieleza rejeleo linalowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa masimulizi ya Biblia ulio wazi kwa msomaji wa kawaida. ‘Miungu yao’ inadumisha ukaribu na Kiebrania, na ‘Daudi akaamuru’ ni ulinganifu bora wa kiutendaji kuliko tafsiri ya neno kwa neno ‘akasema.’
