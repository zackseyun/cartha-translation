base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/002.yaml
  text: And David knew that Yahweh had established him as king over Israel[b][a], for his kingdom had been greatly exalted for the sake of his people Israel.
translation:
  language: sw
  text: Daudi akajua kwamba Yahwe alikuwa amemweka imara kuwa mfalme juu ya Israeli, kwa maana ufalme wake ulikuwa umeinuliwa sana kwa ajili ya Israeli, watu wake.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Israeli kama watu wa Yahwe; wengine huelewa “watu wake” kuwa watu wa Daudi.
    reason: Huhifadhi utata wa mrejelewa wa kiambishi katika Kiebrania.
  - marker: b
    text: Au “ulikuwa umeinuliwa juu.”
    reason: Hutoa mbadala wa karibu zaidi wa usemi wa Kiebrania.
lexical_decisions:
- source_word: וַיֵּדַע
  choice: akajua
  rationale: Huwasilisha moja kwa moja kitenzi cha Kiebrania ידע katika mtiririko wa simulizi, bila kulazimisha maana finyu ya ‘alitambua’.
- source_word: הֱכִינוֹ
  choice: alikuwa amemthibitisha
  rationale: Hifili ya כון hapa ina wazo la kumweka imara au kuthibitisha Daudi katika cheo chake cha kifalme; ‘amemthibitisha’ ni ya asili katika Kiswahili na inafaa muktadha.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa uhamishaji wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: לְמֶלֶךְ
  choice: kuwa mfalme
  rationale: Kihusishi לְ kinaonyesha cheo au matokeo ya kuthibitishwa kwake.
- source_word: עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: Hueleza mamlaka ya kifalme ya Daudi dhidi ya Israeli kwa namna iliyo wazi katika Kiswahili.
- source_word: נִשֵּׂאת לְמַעְלָה
  choice: ulikuwa umeinuliwa sana
  rationale: Huhifadhi taswira ya kuinuliwa iliyo katika נשׂא pamoja na nguvu ya לְמַעְלָה, huku ikisomeka kwa kawaida.
- source_word: מַלְכוּתוֹ
  choice: ufalme wake
  rationale: מַלְכוּת inaweza kuwa ufalme, umfalme, au utawala; ‘ufalme wake’ huhifadhi upana wa maana na mwangwi wa kifalme.
- source_word: בַּעֲבוּר
  choice: kwa ajili ya
  rationale: 'Hutoa maana ya kusudi au manufaa: kuinuliwa kwa ufalme kulikuwa kwa manufaa ya Israeli.'
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: watu wake Israeli
  rationale: Hufuata kwa karibu muundo wa Kiebrania na kuhifadhi uwezekano wa kisarufi kuhusu anayerejelewa na kiwakilishi ‘wake’.
theological_decisions:
- issue: Mrejelewa wa kiwakilishi katika ‘watu wake Israeli’
  choice: Maandishi makuu yanaacha ‘wake’ bila kutaja wazi kama ni Yahwe au Daudi
  alternative: Kutafsiri wazi ‘Israeli, watu wa Yahwe’ au ‘watu wa Daudi’
  rationale: Kisarufi, kiambishi cha nafsi kinaweza kurejelea Yahwe au Daudi. Muktadha unaunga mkono kwa nguvu Israeli kuwa watu wa Yahwe, lakini tafsiri haipaswi kuondoa kabisa utata halisi wa chanzo; tanbihi inaueleza.
- issue: Nguvu ya כִּי ya pili
  choice: kwa maana
  alternative: kwamba
  rationale: Kishazi cha pili kinaeleza msingi wa Daudi kujua kuwa Yahwe alikuwa amemthibitisha, hivyo uhusiano wa kisababishi unaelezwa kwa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ‘akajua’ umehifadhiwa; wakati timilifu ‘alikuwa amemthibitisha/ulikuwa umeinuliwa’ unaonyesha matendo yaliyotangulia utambuzi wa Daudi.
