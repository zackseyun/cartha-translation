base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/008.yaml
  text: When the Philistines heard that David had been anointed king over all Israel[a], all the Philistines went up to seek David. And David heard, and went out before them.
translation:
  language: sw
  text: Wafilisti waliposikia kwamba Daudi alikuwa ametiwa mafuta kuwa mfalme juu ya Israeli yote, Wafilisti wote walipanda kwenda kumtafuta Daudi. Daudi naye aliposikia, akatoka mbele yao[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akatoka kwenda kukutana nao” au “akatoka kwenda kuwakabili.” Kiebrania kinasema kihalisi, “akatoka mbele yao”; huenda usemi huo ukadokeza ukabiliano wa kijeshi bila kuusema waziwazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: waliposikia
  rationale: Katika simulizi, שׁמע humaanisha kupokea habari. Muundo wa ‘waliposikia’ unaunganisha kwa kawaida habari hiyo na hatua iliyofuata.
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili cha Biblia.
- source_word: כִּי
  choice: kwamba
  rationale: כִּי hapa inaanzisha maudhui ya habari waliyosikia.
- source_word: נִמְשַׁח
  choice: alikuwa ametiwa mafuta
  rationale: Nifali ya משׁח ina maana ya kutiwa mafuta; hali timilifu inaonyesha tendo lililokuwa limekamilika kabla ya Wafilisti kusikia.
- source_word: לְמֶלֶךְ
  choice: kuwa mfalme
  rationale: לְ hapa huonyesha cheo au matokeo ya kutiwa mafuta.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: juu ya Israeli yote
  rationale: עַל pamoja na cheo cha kifalme huonyesha utawala juu ya watu, na כָּל huhifadhi upeo wa Israeli yote.
- source_word: וַיַּעֲלוּ
  choice: walipanda
  rationale: עלה kimsingi ni ‘kupanda’; tafsiri hii inadumisha taswira ya kijiografia bila kuongeza moja kwa moja wazo la kuandamana kijeshi.
- source_word: כָל פְּלִשְׁתִּים
  choice: Wafilisti wote
  rationale: Inafuata moja kwa moja usemi wa Kiebrania, bila kuubadili kuwa ‘jeshi lote la Wafilisti.’
- source_word: לְבַקֵּשׁ אֶת דָּוִיד
  choice: kwenda kumtafuta Daudi
  rationale: בקשׁ ni kutafuta. Muktadha unaonyesha nia ya uhasama, lakini ‘kumtafuta’ haiongezi kusudi ambalo kitenzi chenyewe hakilitaji waziwazi.
- source_word: וַיִּשְׁמַע דָּוִיד
  choice: Daudi naye aliposikia habari hiyo
  rationale: ‘Naye’ huhifadhi ulinganifu wa kusikia kwa Wafilisti na kwa Daudi; ‘habari hiyo’ hufanya kishazi chenye yambwa iliyodokezwa kiwe cha kawaida katika Kiswahili.
- source_word: וַיֵּצֵא לִפְנֵיהֶם
  choice: akatoka kwenda kuwakabili
  rationale: Kihalisi ni ‘akatoka mbele yao,’ lakini katika muktadha wa kijeshi inaelekea kumaanisha alitoka kukutana nao au kuwakabili. Tanbihi inadumisha usemi halisi na uwezekano wake mbalimbali.
