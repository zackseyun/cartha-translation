translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Muundo wa simulizi umefanywa wa kawaida kwa Kiswahili huku urudiaji wa wazo la ‘kusikia’ na upeo wa ‘Israeli yote’ vikihifadhiwa. Alama ya tanbihi imewekwa baada ya kishazi inachokifafanua.
