  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa urahisi. Tafsiri inahifadhi uratibu wa sentensi ya Kiebrania kwa namna ya asili katika Kiswahili na haitatui kimya kimya uwezekano wa “nyumba” kumaanisha makao ya kifalme.
