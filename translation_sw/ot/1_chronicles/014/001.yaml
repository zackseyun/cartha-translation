id: 1CH.14.1
reference: 1 Chronicles 14:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ֠/יִּשְׁלַח חירם מֶֽלֶךְ צֹ֥ר מַלְאָכִים֮ אֶל דָּוִיד֒ וַ/עֲצֵ֣י אֲרָזִ֔ים וְ/חָרָשֵׁ֣י קִ֔יר וְ/חָרָשֵׁ֖י עֵצִ֑ים לִ/בְנ֥וֹת ל֖/וֹ בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/001.yaml
  text: Then Hiram king of Tyre sent messengers to David[a], and cedar timber, masons, and carpenters[b], to build a house for him.
translation:
  language: sw
  text: Kisha Hiramu, mfalme wa Tiro, akatuma wajumbe kwa Daudi[a], pamoja na mbao za mierezi, waashi, na maseremala, ili wamjengee nyumba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wawakilishi.” Neno la Kiebrania linaweza kumaanisha wawakilishi rasmi katika mazingira ya kifalme.
    reason: lexical_alternative
  - marker: b
    text: Au “ikulu.” Neno la Kiebrania linalotafsiriwa “nyumba” linaweza kumaanisha makao ya kifalme katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Kisha ... akatuma
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” huonyesha mfuatano wa matukio kwa Kiswahili cha kawaida.
- source_word: חירם
  choice: Hiramu
  rationale: Umbo la jina linafuata desturi ya majina ya Biblia katika Kiswahili huku likiwakilisha Hiram ya Kiebrania.
- source_word: מֶלֶךְ צֹר
  choice: mfalme wa Tiro
  rationale: Huu ni mfuatano wa utegemezi unaotaja cheo cha Hiramu na ufalme wake.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Neno lina maana pana ya watu waliotumwa; katika muktadha huu huenda walikuwa wawakilishi rasmi, bila kulazimisha hadhi maalumu ya kidiplomasia.
- source_word: וַעֲצֵי אֲרָזִים
  choice: pamoja na mbao za mierezi
  rationale: Katika muktadha wa ujenzi, kinachokusudiwa ni mbao za ujenzi, si miti hai; “pamoja na” huweka wazi kwamba vifaa na mafundi pia walitumwa.
- source_word: חָרָשֵׁי קִיר
  choice: waashi
  rationale: Kirai kinamaanisha mafundi wa kuta; “waashi” ni istilahi ya kawaida na fupi katika muktadha wa ujenzi.
- source_word: חָרָשֵׁי עֵצִים
  choice: maseremala
  rationale: Ni mafundi wanaofanya kazi ya mbao; “maseremala” ni neno la kawaida la Kiswahili katika ujenzi.
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: ili wamjengee nyumba
  rationale: Infinitivu inaonyesha kusudi. Kiambishi “-m-...-ee” kinawakilisha לוֹ, na “nyumba” huhifadhi maana ya msingi ya בָּיִת bila kuitafsiri moja kwa moja kuwa ikulu.
