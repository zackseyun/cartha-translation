base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/016.yaml
  text: So David did as God had commanded him, and they struck down the Philistine army from Gibeon as far as Gezer.
translation:
  language: sw
  text: Basi Daudi akafanya kama Mungu alivyomwamuru, nao wakalishinda jeshi la Wafilisti[a] kuanzia Gibeoni mpaka Gezeri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kambi ya Wafilisti”; hapa neno hilo linarejelea jeshi lililopiga kambi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּאֲשֶׁר צִוָּהוּ
  choice: akafanya kama ... alivyomwamuru
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha wazi kwamba Daudi alitenda kulingana na amri aliyokuwa amepewa.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu neno lenye kibainishi humrejelea Mungu wa Israeli; Kiswahili cha kawaida hakihitaji kibainishi tofauti.
- source_word: וַיַּכּוּ
  choice: nao wakalishinda
  rationale: Kitenzi cha Kiebrania kiko katika wingi na katika muktadha wa vita kinaweza kumaanisha kupiga au kushinda. 'Nao wakalishinda' hudumisha wingi na kutoa maana ya kijeshi kwa Kiswahili cha asili.
- source_word: מַחֲנֵה פְלִשְׁתִּים
  choice: jeshi la Wafilisti
  rationale: Ingawa מַחֲנֶה kimsingi ni 'kambi,' hapa linaweza kurejelea kwa njia ya metonimia kikosi kilichopiga kambi. 'Jeshi la Wafilisti' linaeleza maana hiyo kwa uwazi; maana halisi imehifadhiwa katika tanbihi.
- source_word: מִגִּבְעוֹן וְעַד גָּזְרָה
  choice: kuanzia Gibeoni mpaka Gezeri
  rationale: Muundo huu unaonyesha eneo lote la mapigano au kuwafuatilia, kutoka Gibeoni hadi kikomo cha Gezeri.
theological_decisions:
- issue: Mtendaji wa kitenzi וַיַּכּוּ
  choice: 'Wingi: Daudi pamoja na watu au jeshi lake'
  alternative: Daudi peke yake kama mtendaji wa umoja
  rationale: Umbo la kitenzi katika Kiebrania ni la wingi. 'Nao wakalishinda' huhifadhi jambo hilo bila kuongeza wazi kundi ambalo halijatajwa katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha simulizi la heshima na kinachoeleweka kwa urahisi. Kiunganishi 'nao' kinaendeleza simulizi huku kikihifadhi mtendaji wa wingi wa kitenzi cha Kiebrania.
