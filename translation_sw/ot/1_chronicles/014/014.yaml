base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/014.yaml
  text: So David inquired of God again[a], and God said to him, “You shall not go up after them. Circle around from behind them, and come against them opposite the balsam trees.”
translation:
  language: sw
  text: Basi Daudi akamwuliza Mungu tena, naye Mungu akamwambia, “Usipande kuwafuata. Pita kando yao, kisha uwajie mkabala na miti ya balisamu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “miti ya baka”; aina halisi ya miti hiyo haijulikani kwa uhakika. Tafsiri za kimapokeo mara nyingi husema “miforsadi” (mulberry trees).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: akamwuliza Mungu
  rationale: Kitenzi שׁאל pamoja na ב hapa kina maana ya kumwendea Mungu ili kupata mwongozo. ‘Akamwuliza Mungu’ ni Kiswahili cha kawaida na kinahifadhi wazo hilo katika muktadha.
- source_word: עוֹד
  choice: tena
  rationale: Neno hili linaonyesha kuwa Daudi alirudia kumwuliza Mungu baada ya tukio lililotangulia.
- source_word: לֹא תַעֲלֶה אַחֲרֵיהֶם
  choice: Usipande kuwafuata
  rationale: ‘Kupanda’ linahifadhi lugha ya mwendo ya עלה, huku ‘kuwafuata’ likiwakilisha אַחֲרֵיהֶם bila kulifanya agizo hilo kuwa maelezo ya shambulio yasiyosemwa wazi katika Kiebrania.
- source_word: הָסֵב מֵעֲלֵיהֶם
  choice: Zunguka mbali nao
  rationale: הָסֵב inaagiza kubadili njia au kuzunguka, na מֵעֲלֵיהֶם inaonyesha kuacha njia ya moja kwa moja kuelekea kwao. Tafsiri hii haiongezi kwa uhakika wazo la kwenda nyuma yao, ambalo halijaelezwa wazi hapa.
- source_word: וּבָאתָ לָהֶם
  choice: kisha uwajie
  rationale: בוא pamoja na ל katika muktadha huu wa kijeshi ni kuwafikia au kuwajia maadui. ‘Uwajie’ ni fupi, ya asili, na muktadha wenyewe unaonyesha kusudi la uhasama.
- source_word: מִמּוּל
  choice: mkabala na
  rationale: Neno hili linaonyesha mahali panapokabiliana au kuelekeana na kitu kingine; ‘mkabala na’ ni usemi sahihi na wa kawaida katika Kiswahili sanifu.
- source_word: הַבְּכָאִים
  choice: miti ya balisamu
  rationale: Aina halisi ya miti haijulikani kwa uhakika. ‘Miti ya balisamu’ inafuata utambulisho mmoja unaokubalika bila kutumia tafsiri ya kimapokeo ya mik桑/miforsadi ambayo huenda si sahihi; tanbihi inaweka wazi kutokuwa na uhakika.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa lakini wenye heshima. Muundo ‘Usipande kuwafuata’ umeachwa kwa ukaribu na lugha ya Kiebrania, ingawa si usemi wa mazungumzo kabisa; unafaa katika muktadha wa harakati za kijeshi. Alama ya tanbihi imewekwa baada ya istilahi ya mmea inayohusika.
