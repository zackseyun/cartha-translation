lexical_decisions:
- source_word: יִבְחָר
  choice: Yibhari
  rationale: Jina la mtu limetoholewa kwa mwandiko unaosomeka kwa Kiswahili; umbo hili linawakilisha kwa karibu jina la Kiebrania Yiḇḥār.
- source_word: אֱלִישׁוּעַ
  choice: Elishua
  rationale: Jina limetoholewa moja kwa moja kutoka usomaji wa Kimasoreti, bila kulibadilisha kuwa jina tofauti linalopatikana katika simulizi sambamba.
- source_word: אֶלְפָּלֶט
  choice: Elpeleti
  rationale: Jina limetoholewa kwa mfumo wa sauti na tahajia unaofaa Kiswahili huku likifuata vokali za maandishi ya Kimasoreti.
- source_word: וְ
  choice: na
  rationale: Kiunganishi hiki kimerudiwa kabla ya kila jina, kama ilivyo katika orodha ya Kiebrania na kama mwendelezo wa mstari uliotangulia.
