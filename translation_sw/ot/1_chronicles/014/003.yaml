  yaml_path: translation/ot/1_chronicles/014/003.yaml
  text: And David took more wives in Jerusalem[a], and David fathered more sons and daughters.
translation:
  language: sw
  text: Daudi akachukua wake zaidi Yerusalemu[a], naye Daudi akazaa wana na binti zaidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaoa wanawake zaidi”; Kiebrania kihalisi husema, “akachukua wake zaidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akajitwalia
  rationale: Kitenzi לקח kimsingi humaanisha ‘chukua.’ Katika muktadha huu, ‘akajitwalia’ huhifadhi namna ya usemi wa Kiebrania huku ikionyesha kwamba Daudi aliwachukua kuwa wake; maana laini zaidi ya ‘akaoa’ imewekwa katika tanbihi.
- source_word: עוֹד
  choice: wengine
  rationale: Hapa עוֹד ina maana ya kiasi cha nyongeza, kwa wake na pia kwa wana na binti; ‘wengine’ ni usemi wa kawaida na wa asili katika Kiswahili.
- source_word: נָשִׁים
  choice: wake
  rationale: Ingawa נָשִׁים inaweza kumaanisha ‘wanawake’ au ‘wake,’ muktadha wa Daudi kuwachukua unaonyesha uhusiano wa kindoa.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Kihusishi ב hapa kina matumizi ya mahali. ‘Huko Yerusalemu’ ni tafsiri ya asili inayoweka wazi mahali tendo lilipotokea.
- source_word: וַיּוֹלֶד
  choice: akazaa
  rationale: Katika Kiebrania, ילד ikiwa na mtendaji wa kiume humaanisha kuwa baba wa watoto. Kiswahili ‘akazaa’ kinaweza kutumiwa kwa baba na ni kifupi, cha kawaida, na sahihi katika muktadha huu.
- source_word: בָּנִים וּבָנוֹת
  choice: wana na binti
  rationale: Kiebrania kinataja jinsia zote mbili waziwazi; ‘wana na binti’ huhifadhi ubainifu huo kuliko neno la jumla ‘watoto.’
- source_word: דָּוִיד
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia ya Kiswahili.
theological_decisions:
- issue: Maelezo ya simulizi kuhusu Daudi kuwa na wake wengi
  choice: Aya imetafsiriwa kama taarifa ya simulizi bila kuongeza hukumu ya kimaadili.
  alternative: Kuongeza kauli au kidokezo kinachoonyesha kukubaliwa au kukataliwa kwa tendo hilo.
  rationale: Aya yenyewe inaripoti kwamba Daudi alijitwalia wake wengine na akazaa watoto zaidi, lakini haitoi tathmini ya kimaadili. Tafsiri inadumisha msimamo huo wa kimasimulizi bila kuingiza hukumu ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Akajitwalia’ huhifadhi kwa kiasi kikubwa taswira ya kitenzi cha Kiebrania, huku tanbihi ikitoa tafsiri laini zaidi ya kimuktadha.
