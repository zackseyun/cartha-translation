base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/004.yaml
  text: 'And these are the names of the children born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
translation:
  language: sw
  text: 'Na haya ndiyo majina ya watoto waliozaliwa kwake[a] huko Yerusalemu: Shamua, Shobabu, Nathani, na Sulemani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi “waliozaliwa kwake” na hakitumii nomino ya kawaida inayomaanisha “wana,” ingawa majina yote katika orodha hii ni ya wanaume.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Na haya ndiyo
  rationale: Kiunganishi pamoja na kiwakilishi huunganisha mstari huu na simulizi iliyotangulia na kutambulisha orodha kwa Kiswahili cha kawaida.
- source_word: שְׁמוֹת
  choice: majina ya
  rationale: Ni wingi wa neno ‘jina’ katika hali ya kutegemea neno linalofuata, ukitambulisha orodha ya watu.
- source_word: הַיְלוּדִים
  choice: watoto waliozaliwa
  rationale: Ni umbo la kitenzi-tendwa linalomaanisha kihalisi ‘waliozaliwa.’ Neno ‘watoto’ linafanya sentensi iwe ya asili kwa Kiswahili bila kulifanya umbo hili kuwa nomino ya kawaida ya Kiebrania inayomaanisha ‘wana.’
- source_word: אֲשֶׁר הָיוּ לוֹ
  choice: kwake
  rationale: Muundo wenye kitenzi ‘kuwa’ na kihusishi ל unaonyesha uhusiano wa kuwa wake; pamoja na ‘waliozaliwa,’ Kiswahili ‘waliozaliwa kwake’ huwasilisha maana hiyo kwa ufupi na kawaida.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Ni kishazi cha mahali kinachoonyesha mahali walipozaliwa; ‘huko’ husaidia mtiririko wa Kiswahili.
- source_word: שַׁמּוּעַ
  choice: Shamua
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: שׁוֹבָב
  choice: Shobabu
  rationale: Jina la mtu limetoholewa kwa mfumo wa kawaida wa majina ya kibiblia katika Kiswahili.
- source_word: נָתָן
  choice: Nathani
  rationale: Jina la mtu limetolewa kwa umbo lililozoeleka katika Biblia za Kiswahili.
- source_word: שְׁלֹמֹה
  choice: Sulemani
  rationale: Hili ndilo umbo la jina lililozoeleka katika Kiswahili.
