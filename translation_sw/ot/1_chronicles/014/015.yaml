  text: וִ֠/יהִי כְּֽ/שָׁמְעֲ/ךָ֞ אֶת ק֤וֹל הַ/צְּעָדָה֙ בְּ/רָאשֵׁ֣י הַ/בְּכָאִ֔ים אָ֖ז תֵּצֵ֣א בַ/מִּלְחָמָ֑ה כִּֽי יָצָ֤א הָֽ/אֱלֹהִים֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת אֶת מַחֲנֵ֥ה פְלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/015.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then go out to battle, for God has gone out before you to strike down the camp of the Philistines.
translation:
  language: sw
  text: Na utakaposikia sauti ya hatua katika vilele vya miti ya zeri[a], ndipo utoke kwenda vitani, kwa maana Mungu ametoka mbele yako ili kuipiga kambi ya Wafilisti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miti ya baka”; kimapokeo, “miti ya mulberry.” Aina kamili ya mti unaotajwa kwa neno la Kiebrania haijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי כְּשָׁמְעֲךָ
  choice: Na utakaposikia
  rationale: Muundo huu unaanzisha hali ya wakati; tafsiri hii ni ya kawaida katika Kiswahili na haiongezi wazo la ‘mara tu’ lisiloelezwa wazi.
- source_word: קוֹל הַצְּעָדָה
  choice: sauti ya hatua zikipiga
  rationale: קוֹל ni sauti inayosikika, na הַצְּעָדָה hurejelea kupiga hatua au mwendo wa kijeshi. Usemi huu huhifadhi taswira ya hatua zinazosikika bila kulazimisha kwamba waandamanaji wanaonekana.
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: juu ya vilele vya miti ya zeri
  rationale: בְּרָאשֵׁי huonyesha mahali katika sehemu za juu za miti. Utambulisho wa בְּכָאִים haujulikani kwa uhakika; ‘miti ya zeri’ ni utambulisho mmoja wa kawaida na kutokuwa na uhakika kunatajwa katika tanbihi.
- source_word: אָז תֵּצֵא בַמִּלְחָמָה
  choice: ndipo utoke kwenda vitani
  rationale: ‘Ndipo’ huonyesha hatua inayofuata ishara hiyo; ‘utoke kwenda vitani’ huhifadhi kitenzi יצא pamoja na maana ya kijeshi ya kirai kinachofuata.
- source_word: כִּי יָצָא הָאֱלֹהִים לְפָנֶיךָ
  choice: kwa maana Mungu atakuwa ametoka mbele yako
  rationale: כִּי inatoa sababu ya agizo. Kauli ‘atakuwa ametoka’ huonyesha kwamba wakati ishara itakaposikika, Mungu tayari atakuwa ameanza kwenda mbele ya Daudi.
- source_word: לְהַכּוֹת אֶת מַחֲנֵה פְלִשְׁתִּים
  choice: ili kulishinda jeshi la Wafilisti
  rationale: נכה katika muktadha wa vita inaweza kumaanisha kupiga au kushinda. מַחֲנֶה hapa ni kambi au jeshi lililopiga kambi; ‘jeshi’ hutoa Kiswahili cha asili kinachoeleza walengwa wa ushindi bila kudai kuharibiwa kwa kila mtu.
theological_decisions:
- issue: Maana ya הָאֱלֹהִים
  choice: Mungu
  alternative: miungu
  rationale: Ingawa אֱלֹהִים ina umbo la wingi, kitenzi cha umoja na muktadha unaomhusu Mungu wa Israeli huonyesha wazi kwamba rejeo ni Mungu mmoja.
- issue: Wakati wa יָצָא katika unabii/agizo
  choice: atakuwa ametoka
  alternative: ametoka / anatoka
  rationale: Kauli timilifu ya Kiebrania inaonyesha tendo la Mungu kuwa limeanza kabla ya Daudi kuingia vitani. Kiswahili cha wakati ujao timilifu huhifadhi uhusiano huo katika agizo linalohusu wakati ujao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Vilele vya miti’ na ‘kwenda vitani’ ni misemo ya kawaida; tanbihi huhifadhi kutokuwa na uhakika kuhusu aina ya mti.
