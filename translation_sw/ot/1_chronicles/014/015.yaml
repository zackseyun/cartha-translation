    rationale: Usemi huu ni wa ajabu kisarufi na kimatumizi. Chanzo kinamaanisha sauti ya hatua/mwendo; “sauti ya hatua” hutoa maana hiyo kwa Kiswahili cha asili.
  - severity: medium
    issue: “ili kulishinda jeshi la Wafilisti”
    rationale: Chanzo kinasema Mungu ametoka “kuipiga kambi ya Wafilisti.” “Kulishinda jeshi” hubadili mtenda-kitenzi na walengwa, na hufanya maana iwe ya jumla zaidi kuliko ilivyo.
  - severity: high
    issue: Tanbihi ina “mikuyu” kama tafsiri ya kimapokeo
    rationale: Hii si sawa na “mulberry trees” ya mapokeo ya Kiingereza na inaweza kumpa msomaji utambulisho wa spishi usio sahihi. Kutokuwa na uhakika wa leksia ya Kiebrania kunapaswa kubaki wazi.
  - severity: low
    issue: “atakuwa ametoka”
    rationale: Ni tafsiri inayowezekana kiwakati, lakini inasikika nzito na huongeza uundaji wa wakati ujao timilifu usiohitajika. “Mungu ametoka mbele yako” huhifadhi vizuri timilifu ya Kiebrania katika muktadha wa amri.
