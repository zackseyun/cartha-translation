  text: The Philistines came and raided the Valley of Rephaim[a].
translation:
  language: sw
  text: Wafilisti wakaja, wakafanya uvamizi katika Bonde la Refaimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakajitawanya katika Bonde la Refaimu.” Kitenzi cha Kiebrania kinaweza kumaanisha kujitawanya au kujiweka katika nafasi za kijeshi, au kufanya uvamizi; muktadha unaonyesha kuingia kwa uhasama wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Jina la kabila פְלִשְׁתִּים limetolewa kwa namna iliyozoeleka katika Kiswahili. Kiunganishi ו kimewakilishwa ndani ya mwendelezo wa simulizi kwa kitenzi ‘wakaja’.
- source_word: בָּאוּ
  choice: wakaja
  rationale: Qal timilifu, nafsi ya tatu wingi, ya בוא humaanisha moja kwa moja ‘walikuja’; ‘wakaja’ ni ya kawaida katika mfululizo wa simulizi.
- source_word: וַֽ/יִּפְשְׁטוּ
  choice: na kufanya uvamizi
  rationale: Katika muktadha huu wa kijeshi, פשט inaweza kumaanisha kuenea au kujitawanya kwa ajili ya mapambano, lakini pia kufanya uvamizi. ‘Kufanya uvamizi’ huonyesha tendo la kijeshi bila kuongeza wazo mahususi la uporaji ambalo halijasemwa wazi.
- source_word: בְּ/עֵמֶק
  choice: katika Bonde la
  rationale: עֵמֶק ni bonde, na ב inaonyesha mahali ambapo tendo lilifanyika. Muundo ‘katika Bonde la’ ni wa kawaida na huhifadhi kihusishi cha Kiebrania.
- source_word: רְפָאִים
  choice: Refaimu
  rationale: Hapa רְפָאִים ni sehemu ya jina la mahali ‘Bonde la Refaimu’; limetoholewa badala ya kutafsiriwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Wakaja’ hudumisha mtiririko wa kisimulizi, huku tanbihi ikihifadhi utata halisi wa kitenzi פשט.
