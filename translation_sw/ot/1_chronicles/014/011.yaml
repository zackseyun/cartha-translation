  text: וַ/יַּעֲל֥וּ בְּ/בַֽעַל פְּרָצִים֮ וַ/יַּכֵּ֣/ם שָׁ֣ם דָּוִיד֒ וַ/יֹּ֣אמֶר דָּוִ֔יד פָּרַ֨ץ הָֽ/אֱלֹהִ֧ים אֶת אוֹיְבַ֛/י בְּ/יָדִ֖/י כְּ/פֶ֣רֶץ מָ֑יִם עַל כֵּ֗ן קָֽרְא֛וּ שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בַּ֥עַל פְּרָצִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/011.yaml
  text: So they went up to Baal-perazim[a], and David struck them down there. And David said, “God has broken through my enemies by my hand, like a bursting flood of waters.” Therefore they called the name of that place Baal-perazim.
translation:
  language: sw
  text: Basi wakapanda hadi Baal-Perasimu[a], na Daudi akawapiga huko. Daudi akasema, “Mungu amewavunja adui zangu kwa mkono wangu, kama maji yavunjavyo.” Kwa hiyo wakapaita mahali pale Baal-Perasimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Baal-Perasimu lina sauti ya maana ya “bwana wa mipasuko” au “mwenye mipasuko.” Linacheza kwa mzizi uleule wa neno lililotumiwa katika kauli ya Daudi kwamba Mungu “amewavunja” adui zake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: wakapanda mpaka
  rationale: Kitenzi עלה katika mwendo wa kijeshi humaanisha kupanda au kwenda juu; ‘wakapanda mpaka’ ni Kiswahili cha kawaida kinachohifadhi mwelekeo bila kuongeza maelezo ya kivita.
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: Baal-Perasimu
  rationale: Ni jina la mahali, hivyo limetoholewa badala ya kutafsiriwa. Tanbihi inaeleza maana na mchezo wa maneno unaohusiana na פרץ.
- source_word: וַיַּכֵּם
  choice: Daudi akawapiga
  rationale: Katika muktadha wa vita, נכה humaanisha kupiga au kushinda. ‘Akawapiga’ huhifadhi nguvu halisi ya tendo bila kulazimisha maana ya kuwaua wote.
- source_word: פָּרַץ
  choice: amewavunja
  rationale: פרץ huonyesha kuvunja kizuizi na kupenya. ‘Amewavunja’ inafaa kwa adui kama yambwa na pia inadumisha uhusiano na taswira ya maji yanayobomoa na kupenya.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Ingawa nomino ina kibainishi katika Kiebrania, hapa inamtaja Mungu mmoja; kitenzi cha umoja kinathibitisha hilo.
- source_word: אֶת אֹיְבַי
  choice: adui zangu
  rationale: Hii ni tafsiri ya moja kwa moja, ya kawaida, na inayoeleweka ya kirai hicho.
- source_word: בְּיָדִי
  choice: kwa mkono wangu
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania ya mkono kama chombo cha utendaji, huku ikibaki wazi katika Kiswahili.
- source_word: כְּפֶרֶץ מָיִם
  choice: kama maji yanavyobomoa na kupenya
  rationale: Kirai kinaonyesha maji yanayovunja kizuizi na kupenya. Uundaji huu ni wa asili katika Kiswahili na huhifadhi taswira pamoja na mwangwi wa mzizi פרץ.
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Ni kiunganishi cha kawaida cha kuonyesha sababu na matokeo katika simulizi.
- source_word: קָרְאוּ שֵׁם הַמָּקוֹם הַהוּא
  choice: wakapaita mahali pale
  rationale: Kitenzi cha Kiebrania ni wingi, kwa hiyo ‘waka-’ kimehifadhiwa. Kiswahili cha kawaida husema ‘kupaita mahali’ badala ya kuiga neno kwa neno ‘kuliita jina la mahali.’
theological_decisions:
- issue: Mhusika anayerejelewa na אֱלֹהִים katika kauli ya Daudi
  choice: Mungu ndiye mtendaji wa kimungu anayetenda kwa mkono wa Daudi
  alternative: Kutafsiri kana kwamba Daudi pekee ndiye aliyepata ushindi kwa uwezo wake mwenyewe
  rationale: Kitenzi פָּרַץ ni cha umoja na kinamtaja Mungu kuwa mtendaji, huku ‘kwa mkono wangu’ kikimtaja Daudi kuwa chombo cha kibinadamu. Tafsiri huhifadhi kwa pamoja utendaji wa Mungu na ushiriki wa Daudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. Jina la mahali limetoholewa, muundo wa kitenzi cha wingi umehifadhiwa, na mchezo wa maneno umeelezwa katika tanbihi.
