  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֨ל דָּוִ֤יד בֵּ/אלֹהִים֙ לֵ/אמֹ֔ר הַ/אֶֽעֱלֶה֙ עַל פלשתיים וּ/נְתַתָּ֖/ם בְּ/יָדִ֑/י וַ/יֹּ֨אמֶר ל֤/וֹ יְהוָה֙ עֲלֵ֔ה וּ/נְתַתִּ֖י/ם בְּ/יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/010.yaml
  text: And David inquired of God[a], saying, “Shall I go up against the Philistines, and will you give them into my hand?” And Yahweh said to him, “Go up, and I will give them into your hand.”
translation:
  language: sw
  text: Daudi akamwuliza Mungu, akisema, “Je, niende kupigana na Wafilisti, nawe utawatia mkononi mwangu[a]?” Yahwe akamwambia, “Nenda, nami nitawatia mkononi mwako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, ‘utawaweka chini ya uwezo wangu.’ Kiebrania kinasema kihalisi, ‘utawatia mkononi mwangu.’
    reason: Ufafanuzi wa nahau ya Kiebrania.
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: akamwuliza Mungu
  rationale: Muundo huu unaonyesha Daudi akitafuta mwongozo kutoka kwa Mungu. ‘Akamwuliza Mungu’ ni Kiswahili cha kawaida na huacha muktadha uonyeshe uzito wa shauri hilo.
- source_word: הַאֶעֱלֶה עַל פלשתיים
  choice: niende kupigana na Wafilisti
  rationale: Kitenzi עלה katika muktadha huu kinaeleza kwenda vitani. Tafsiri hii ni ya asili katika Kiswahili na inaonyesha wazi kuwa safari hiyo ilikuwa ya kupigana nao, bila kutumia usemi mgumu ‘nipande juu ya Wafilisti.’
- source_word: וּנְתַתָּם בְּיָדִי
  choice: utawatia mkononi mwangu
  rationale: Inahifadhi taswira ya nahau ya Kiebrania נתן ביד, yaani kumweka adui chini ya uwezo wa mtu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: עֲלֵה
  choice: Nenda
  rationale: Katika jibu, amri hii inalingana na swali la Daudi kuhusu kwenda vitani. ‘Nenda’ ni ya asili zaidi katika Kiswahili kuliko ‘Panda’ pasipo muktadha wa wazi wa kupanda mahali.
- source_word: וּנְתַתִּים בְּיָדֶךָ
  choice: nami nitawatia mkononi mwako
  rationale: Inarudia kwa makusudi maneno na taswira ya swali la Daudi, kama ilivyo katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu, YHWH. ‘Yahwe’ hulihifadhi kama jina kwa tahajia inayofaa Kiswahili badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inadumisha urudiaji kati ya swali la Daudi na jibu la Yahwe, huku ikitoa kwa lugha ya kawaida maana ya kijeshi ya עלה.
