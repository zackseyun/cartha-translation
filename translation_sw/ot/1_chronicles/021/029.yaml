  text: וּ/מִשְׁכַּ֣ן יְ֠הוָה אֲשֶׁר עָשָׂ֨ה מֹשֶׁ֧ה בַ/מִּדְבָּ֛ר וּ/מִזְבַּ֥ח הָ/עוֹלָ֖ה בָּ/עֵ֣ת הַ/הִ֑יא בַּ/בָּמָ֖ה בְּ/גִבְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/029.yaml
  text: The tabernacle of Yahweh, which Moses had made in the wilderness, and the altar of burnt offering were at that time on the high place at Gibeon.
translation:
  language: sw
  text: Maskani ya Yahweh, ambayo Mose aliifanya nyikani, pamoja na madhabahu ya sadaka ya kuteketezwa, zilikuwa wakati huo katika mahali pa juu huko Gibeoni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכַּן
  choice: maskani
  rationale: Katika muktadha huu wa ibada, neno hili linamaanisha maskani takatifu ya Yahweh iliyotengenezwa wakati wa Mose; “maskani” ni istilahi ya kawaida na yenye hadhi katika Kiswahili cha Biblia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetolewa kama jina binafsi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: אֲשֶׁר עָשָׂה מֹשֶׁה
  choice: ambayo Mose alikuwa ameifanya
  rationale: Muundo huu unaonyesha tendo la Mose lililotangulia wakati unaosimuliwa; wakati uliopita timilifu unaeleza uhusiano huo kwa kawaida katika Kiswahili.
- source_word: בַמִּדְבָּר
  choice: nyikani
  rationale: “Nyikani” ni tafsiri fupi na ya kawaida ya eneo lisilokaliwa linalohusishwa na safari ya Israeli baada ya kutoka Misri.
- source_word: מִזְבַּח הָעוֹלָה
  choice: madhabahu ya sadaka ya kuteketezwa
  rationale: Kifungu hiki kinaitaja madhabahu iliyotumiwa kwa sadaka iliyoteketezwa yote; tafsiri hii ni wazi na inahifadhi istilahi ya kiibada.
- source_word: בָּעֵת הַהִיא
  choice: wakati huo
  rationale: Hii ndiyo njia ya kawaida na sahihi ya kuonyesha mazingira ya wakati katika simulizi.
- source_word: בַּבָּמָה
  choice: mahali pa juu
  rationale: Neno linamaanisha eneo la juu lililotumiwa kwa ibada; “mahali pa juu” huhifadhi maana ya mahali na kazi yake ya kiibada bila kuifasiri kupita kiasi.
- source_word: בְּגִבְעוֹן
  choice: huko Gibeoni
  rationale: “Huko” huonyesha kwa kawaida mahali panapotajwa katika simulizi, na “Gibeoni” ni umbo lililozoeleka la jina hilo katika Kiswahili.
- source_word: וּ
  choice: pamoja na
  rationale: Viunganishi vya Kiebrania vinaunganisha “maskani” na “madhabahu” kama kiima ambatani. Kiswahili cha sasa hakihitaji kiunganishi cha ziada mwanzoni mwa sentensi.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza fasiri ya kimadhehebu.
- issue: Maana ya בָּמָה katika eneo la Gibeoni
  choice: mahali pa juu
  alternative: madhabahu ya kilimani; patakatifu pa juu
  rationale: “Mahali pa juu” huhifadhi istilahi pana ya Kiebrania na haiongezi hukumu ya kidini wala kudai kwamba neno hilo linamaanisha madhabahu peke yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imedumisha mpangilio wa habari wa chanzo huku ikitumia upatanisho wa kisarufi wa kiima ambatani (“vilikuwa”). Hakuna alama za tanbihi kwa kuwa hakuna tanbihi inayohitajika katika mstari huu.
