  text: But he did not count Levi and Benjamin among them[a], because the king’s command was detestable to Joab.
translation:
  language: sw
  text: Lakini hakuwahesabu Walawi na Wabenyamini miongoni mwao, kwa sababu amri ya mfalme[a] ilimchukiza sana Yoabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neno la mfalme lilimchukiza sana Yoabu.”
    reason: Huhifadhi uwezekano wa kutafsiri דְּבַר kama “neno” badala ya “amri,” huku ikidumisha maana ya נִתְעַב katika muktadha.
lexical_decisions:
- source_word: וְ/לֵוִי֙ וּ/בִנְיָמִ֔ן
  choice: Lakini ... Walawi na Wabenyamini
  rationale: Kiunganishi cha kwanza kinaonyesha utofauti na jumla za sensa zilizotangulia. Majina ya makabila yametolewa kwa maumbo ya kawaida ya Kiswahili.
- source_word: לֹ֥א פָקַ֖ד
  choice: hakuwahesabu
  rationale: Katika muktadha wa sensa, פקד humaanisha kuhesabu watu; umbo hili ni la kawaida na wazi kwa Kiswahili cha sasa.
- source_word: בְּ/תוֹכָ֑/ם
  choice: pamoja nao
  rationale: Hutoa maana ya kutowajumuisha katika makundi yaliyohesabiwa, bila kutumia Kiswahili kizito cha 'katikati yao.'
- source_word: כִּֽי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaanzisha sababu ya Yoabu kutowahesabu makabila hayo.
- source_word: נִתְעַ֥ב
  choice: ilikuwa chukizo
  rationale: Niphal inaonyesha kuwa jambo hilo lilionekana kuwa la kuchukiza sana; 'chukizo' huhifadhi uzito wa neno la Kiebrania.
- source_word: דְּבַר הַ/מֶּ֖לֶךְ
  choice: amri ya mfalme
  rationale: Ingawa דבר kwa msingi ni 'neno' au 'jambo,' hapa inarejelea agizo la mfalme la kufanya sensa.
- source_word: אֶת יוֹאָֽב
  choice: kwa Yoabu
  rationale: Baada ya kitenzi cha tathmini au hisia, אֶת humtaja mtu ambaye kwake jambo linaonekana hivyo.
