id: 1CH.21.28
reference: 1 Chronicles 21:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֔יא בִּ/רְא֤וֹת דָּוִיד֙ כִּי עָנָ֣/הוּ יְהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֣ן הַ/יְבוּסִ֑י וַ/יִּזְבַּ֖ח שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/028.yaml
  text: At that time[a], when David saw that Yahweh had answered him at the threshing floor of Ornan the Jebusite, he sacrificed there.
translation:
  language: sw
  text: Wakati huo, Daudi alipoona kwamba Yahweh alikuwa amemjibu katika uwanja wa kupuria wa Ornani, Myebusi, akatoa dhabihu huko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Wakati huo
  rationale: Ni usemi wa kawaida wa wakati unaounganisha tukio hili na simulizi lililotangulia bila kulifanya kuwa la papo hapo kupita kiasi.
- source_word: בִּרְאוֹת
  choice: Daudi alipoona
  rationale: Muundo wa ב pamoja na kitenzi-jina unaonyesha mazingira ya wakati; “alipoona” ni Kiswahili cha asili na huhifadhi uhusiano huo.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי inatanguliza jambo ambalo Daudi alitambua, si lazima sababu iliyoelezwa waziwazi.
- source_word: עָנָהוּ
  choice: alikuwa amemjibu
  rationale: ענה humaanisha kujibu au kuitikia; wakati timilifu unaonyesha kuwa jibu la Yahweh lilitangulia utambuzi wa Daudi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika maandishi ya Kiebrania limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: בְּגֹרֶן
  choice: katika uwanja wa kupuria
  rationale: גֹּרֶן ni eneo la kupuria nafaka; “uwanja wa kupuria” ni usemi wazi na wa kawaida katika Kiswahili.
- source_word: אָרְנָן הַיְבוּסִי
  choice: Ornani, Myebusi
  rationale: Jina limetoholewa kwa umbo linalosomeka kwa Kiswahili, na neno la kabila limetafsiriwa kwa umbo la Kiswahili.
- source_word: וַיִּזְבַּח
  choice: akatoa dhabihu
  rationale: זבח hapa ina maana ya kutoa dhabihu; usemi huu ni wa asili na wenye heshima katika Kiswahili.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki hurejelea mahali palipotajwa, yaani uwanja wa kupuria.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu; “Yahweh” huhifadhi jina hilo badala ya kuliweka kama cheo.
- issue: Maana ya עָנָהוּ katika muktadha wa ibada
  choice: alikuwa amemjibu
  alternative: alikuwa amemwitikia
  rationale: “Kumjibu” huhifadhi maana pana ya kitenzi bila kuamua zaidi ya maandishi ikiwa jibu lilihusiana hasa na sala au dhabihu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa kwa mtiririko wa simulizi unaoeleweka kwa wasomaji wa kawaida, huku tofauti kati ya kuona kwa Daudi, jibu lililokamilika la Yahweh, na tendo la baadaye la kutoa dhabihu ikihifadhiwa.
