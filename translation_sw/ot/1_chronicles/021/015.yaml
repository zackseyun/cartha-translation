  to: Mungu akatuma malaika kwenda Yerusalemu ili auangamize[a]. Lakini alipokuwa akiuangamiza, Yahwe akaona, akaghairi juu ya maafa hayo, akamwambia malaika aliyeangamiza, “Imetosha![b] Sasa uondoe mkono wako.” Naye malaika wa Yahwe alikuwa amesimama kando ya uwanja wa kupuria nafaka wa Ornani, Myebusi.
