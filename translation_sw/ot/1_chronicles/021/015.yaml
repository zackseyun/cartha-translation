  terminology: «Mungu», «malaika», «Yahwe», «maafa», «malaika wa Yahwe», «uwanja wa kupuria nafaka», na «Myebusi» zinafaa. «Malaika wa Yahwe» huhifadhi kirai bila kuamua utambulisho wa malaika huyo. Jina «Ornani» linaendana na umbo la Kiswahili la jina la Kiebrania Ornan.
