reference: 1 Chronicles 21:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ הָ/אֱלֹהִ֨ים מַלְאָ֥ךְ לִֽ/ירוּשָׁלִַם֮ לְ/הַשְׁחִיתָ/הּ֒ וּ/כְ/הַשְׁחִ֗ית רָאָ֤ה יְהוָה֙ וַ/יִּנָּ֣חֶם עַל הָֽ/רָעָ֔ה וַ/יֹּ֨אמֶר לַ/מַּלְאָ֤ךְ הַ/מַּשְׁחִית֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֔ד עִם גֹּ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי׀׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/015.yaml
  text: And God sent an angel to Jerusalem to destroy it[a], but as he was destroying it, Yahweh saw and relented concerning the calamity, and he said to the destroying angel, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was standing by the threshing floor of Ornan the Jebusite.
translation:
  language: sw
  text: Mungu akatuma malaika kwenda Yerusalemu ili auangamize[a]. Lakini alipokuwa akiuangamiza, Yahwe akaona, akaghairi juu ya maafa hayo, akamwambia malaika aliyeangamiza, “Imetosha![b] Sasa uondoe mkono wako.” Naye malaika wa Yahwe alikuwa amesimama kando ya uwanja wa kupuria nafaka wa Ornani, Myebusi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili auharibu.” Kiambishi katika “auangamize” kinarejelea Yerusalemu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina tamko fupi lenye maana ya “Yatosha!” au “Imetosha!”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Kitenzi cha umoja na muktadha vinamtaja Mungu wa Israeli; ‘Mungu’ ndiyo tafsiri ya kawaida na ya wazi.
- source_word: מַלְאָךְ
  choice: malaika
  rationale: Hapa mjumbe ni kiumbe wa mbinguni aliyetumwa kutekeleza hukumu; ‘malaika’ huonyesha rejeo hilo kwa asili katika Kiswahili.
- source_word: לִירוּשָׁלִַם
  choice: kwenda Yerusalemu
  rationale: Kihusishi kinaonyesha mwelekeo kuelekea mjini; kusudi la uhasama linafuata katika ‘ili auangamize’.
- source_word: לְהַשְׁחִיתָהּ
  choice: ili auangamize
  rationale: Hifili ya שׁחת hapa inaeleza kuleta uharibifu juu ya jiji; kiambishi ‘-u-’ kinarejelea mji wa Yerusalemu.
- source_word: וּכְהַשְׁחִית
  choice: Lakini alipokuwa akiangamiza
  rationale: Muundo unaonyesha tendo lililokuwa likiendelea wakati Yahwe alipoingilia kati; ‘Lakini’ huonyesha wazi badiliko la simulizi.
- source_word: וַיִּנָּחֶם עַל הָרָעָה
  choice: akaghairi kuhusu maafa hayo
  rationale: ‘Akaghairi’ huhifadhi picha ya simulizi ya Mungu kuacha kuendeleza hukumu bila kufafanua zaidi namna ya mabadiliko hayo; ‘maafa’ hapa ni hukumu yenye uharibifu, si uovu wa kimaadili.
- source_word: הַמַּלְאָךְ הַמַּשְׁחִית
  choice: malaika aliyekuwa akiangamiza
  rationale: Kifungu hiki cha kawaida cha Kiswahili huhifadhi nguvu tendaji ya kirai cha Kiebrania na kuhusianisha malaika huyo na tendo linaloendelea.
- source_word: רַב
  choice: Yatosha!
  rationale: Ni tamko fupi la kusimamisha tendo; ‘Yatosha!’ ni la kawaida, lenye nguvu, na linalofaa katika usemi wa moja kwa moja.
- source_word: הֶרֶף יָדֶךָ
  choice: rudisha mkono wako
  rationale: Nahau inaamuru kukomesha tendo lililokuwa likifanywa; tafsiri hii huhifadhi taswira ya mkono na kueleweka kwa Kiswahili cha sasa.
- source_word: גֹּרֶן
  choice: uwanja wa kupuria nafaka
  rationale: Hutaja eneo la wazi la kupuria nafaka, si chombo au kitendo pekee.
- source_word: הַיְבוּסִי
  choice: Myebusi
  rationale: Nomino ya mtu mmoja wa taifa la Wayebusi hutafsiriwa kwa umbo la kawaida la Kiswahili ‘Myebusi’.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Huhifadhi jina la agano lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- issue: Lugha inayomhusisha Mungu na kughairi katika וַיִּנָּחֶם עַל הָרָעָה
  choice: akaghairi kuhusu maafa hayo
  alternative: akajuta kwa sababu ya maafa hayo; akabadili nia kuhusu maafa hayo
  rationale: Huhifadhi mvutano wa simulizi kwamba Mungu aliitikia hali na kusimamisha hukumu, bila kuufanya mstari utoe dai la kifalsafa lisilosemwa wazi.
- issue: Utambulisho wa מַלְאַךְ יְהוָה
  choice: malaika wa Yahwe
  alternative: Yahwe mwenyewe katika udhihirisho wa kimalaika; malaika aliyeumbwa
  rationale: Kirai kimetafsiriwa kwa uwazi bila kuamua mjadala wa kitheolojia kuhusu asili ya mhusika huyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Simulizi limetumia mfululizo wa ‘aka-’ kwa mtiririko wa kawaida, huku ‘alipokuwa akiangamiza’ ikihifadhi tendo linaloendelea. Jina ‘Yahwe’ na kirai ‘malaika wa Yahwe’ vimeachwa bila ufafanuzi wa kimadhehebu.
