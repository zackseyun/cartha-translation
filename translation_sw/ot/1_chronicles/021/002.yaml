base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/002.yaml
  text: Then David said to Joab and to the commanders of the people[a], “Go, count Israel from Beersheba to Dan, and bring it to me, so that I may know their number.”
translation:
  language: sw
  text: Ndipo Daudi akawaambia Yoabu na wakuu wa watu, “Nendeni mkawahesabu Israeli kutoka Beer-sheba hadi Dani[a], kisha mniletee, ili nijue idadi yao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai “kutoka Beer-sheba hadi Dani” kinamaanisha kutoka mwisho mmoja wa Israeli hadi mwingine.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo Daudi akawaambia
  rationale: Waw-consecutive inaendeleza masimulizi; “Ndipo” huonyesha mfuatano kwa Kiswahili cha kawaida, huku umbo la “akawaambia” likifaa kwa walengwa wengi.
- source_word: שָׂרֵי הָעָם
  choice: wakuu wa watu
  rationale: שָׂרִים inaweza kumaanisha wakuu, maafisa, au viongozi. “Wakuu” huhifadhi upana wa neno bila kulifanya kwa lazima cheo cha kijeshi.
- source_word: לְכוּ סִפְרוּ
  choice: Nendeni mkawahesabu
  rationale: Amri hizi mbili zinaonyesha kwenda na kutekeleza zoezi la kuhesabu; “mkawahesabu” ni ya asili na inaonyesha watu wa Israeli kama wanaohesabiwa.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina linahifadhiwa kama lilivyo katika Kiebrania na hapa linatumika kwa maana ya pamoja ya taifa au watu.
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: kutoka Beer-sheba hadi Dani
  rationale: Majina ya maeneo yanahifadhiwa, na kirai kinaonyesha eneo lote la Israeli kuanzia kusini hadi kaskazini; maana hiyo inafafanuliwa katika tanbihi.
- source_word: וְהָבִיאוּ אֵלַי
  choice: kisha mniletee habari
  rationale: Kiebrania hakitaji wazi kitu kinacholetwa. “Habari” hudokeza taarifa ya matokeo kwa Kiswahili cha kawaida bila kurudia mapema “idadi yao.”
- source_word: וְאֵדְעָה אֶת מִסְפָּרָם
  choice: ili nijue idadi yao
  rationale: Cohortative inaonyesha kusudi la amri; “ili nijue” hulihifadhi, na “idadi yao” ni tafsiri ya moja kwa moja na ya kawaida ya מִסְפָּרָם.
