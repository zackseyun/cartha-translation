translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Tafsiri imetumia “wakuu” badala ya “makamanda” ili kuhifadhi upana wa שָׂרֵי, na imeweka alama ya tanbihi mara tu baada ya kirai kinachofafanuliwa.
