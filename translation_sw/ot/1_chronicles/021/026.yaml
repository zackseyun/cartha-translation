  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּבֶן֩ שָׁ֨ם דָּוִ֤יד מִזְבֵּ֨חַ֙ לַ/יהוָ֔ה וַ/יַּ֥עַל עֹל֖וֹת וּ/שְׁלָמִ֑ים וַ/יִּקְרָא֙ אֶל יְהוָ֔ה וַ/יַּֽעֲנֵ֤/הוּ בָ/אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם עַ֖ל מִזְבַּ֥ח הָ/עֹלָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/026.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings. He called on Yahweh[a], and he answered him with fire from heaven on the altar of burnt offering.
translation:
  language: sw
  text: Hapo Daudi akamjengea Yahweh madhabahu, akatoa sadaka za kuteketezwa na sadaka za amani[a]. Akamwomba Yahweh, naye akamjibu kwa moto kutoka mbinguni juu ya madhabahu ya sadaka ya kuteketezwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka za ushirika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן שָׁם דָּוִיד מִזְבֵּחַ לַיהוָה
  choice: Hapo Daudi akamjengea Yahweh madhabahu
  rationale: “Hapo” hurejelea mahali palipotajwa, na kiambishi cha kutendea katika “akamjengea” huonyesha kwamba madhabahu ilijengwa kwa ajili ya Yahweh.
- source_word: עֹלוֹת
  choice: sadaka za kuteketezwa
  rationale: Hili ni jina la kawaida na linaloeleweka la sadaka zilizoteketezwa kabisa madhabahuni.
- source_word: שְׁלָמִים
  choice: sadaka za amani
  rationale: Hifadhi maana ya msingi inayohusiana na amani na ukamilifu; “sadaka za ushirika” imewekwa katika tanbihi kama tafsiri mbadala inayowezekana.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: Akamwomba Yahweh
  rationale: Katika muktadha huu wa ibada, kirai kinamaanisha kumwita Mungu kwa sala. “Akamwomba” ni Kiswahili cha kawaida na huepuka dhana ya kumwita mtu aje.
- source_word: וַיַּעֲנֵהוּ בָאֵשׁ מִן הַשָּׁמַיִם
  choice: naye akamjibu kwa moto kutoka mbinguni
  rationale: “Kwa moto” huonyesha njia au ishara ya jibu, huku “kutoka mbinguni” ikihifadhi chanzo kinachotajwa na maandishi.
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: juu ya madhabahu ya sadaka ya kuteketezwa
  rationale: Tafsiri hii huhifadhi uhusiano wa madhabahu na sadaka ya kuteketezwa pamoja na mahali moto ulipofika.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano, hivyo “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Jibu la Mungu kwa moto
  choice: naye akamjibu kwa moto kutoka mbinguni
  alternative: Yahweh akateremsha moto kutoka mbinguni
  rationale: Tafsiri inasema tu kwamba Yahweh alimjibu kwa moto kutoka mbinguni, bila kuongeza kitenzi au ufafanuzi wa kitheolojia usiotajwa wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi na hadhi inayofaa maandiko. Viambishi vya mfululizo “aka-” vinadumisha mwendo wa simulizi, na istilahi za ibada zimewekwa kwa lugha inayoeleweka kwa wasomaji wa kawaida.
