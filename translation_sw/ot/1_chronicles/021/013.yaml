base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/013.yaml
  text: Then David said to Gad[a], “I am in great distress. Please let me fall into the hand of Yahweh, for his mercies are very great; but do not let me fall into the hand of man.”
translation:
  language: sw
  text: Ndipo Daudi akamwambia Gadi, “Niko katika dhiki kubwa. Naomba nianguke mkononi mwa Yahwe, kwa maana rehema zake ni nyingi sana; lakini nisianguke mkononi mwa mwanadamu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mikono ya wanadamu.” Kiebrania kina umoja, “mkono wa mwanadamu,” kikitofautisha mamlaka ya binadamu na mkono wa Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: Nimebanwa sana
  rationale: Nahau hii huonyesha kuwa katika dhiki kali au hali yenye kumweka mtu katika nafasi finyu. ‘Nimebanwa sana’ ni Kiswahili cha kawaida chenye kuhifadhi taswira na uzito wa hali hiyo.
- source_word: אֶפְּלָה נָּא
  choice: Tafadhali, na nianguke
  rationale: Kitenzi cha kutaka pamoja na נָא huonyesha ombi la dharura lakini la unyenyekevu. Kauli hii huhifadhi ombi hilo bila kulifanya kuwa amri.
- source_word: בְיַד יְהוָה
  choice: mkononi mwa Yahwe
  rationale: Nahau ya Kiebrania huonyesha kutiwa chini ya mamlaka au hukumu ya mwingine. ‘Mkononi mwa’ huhifadhi taswira inayorudiwa katika utofautishaji wa mstari huu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni jina la agano lililoandikwa moja kwa moja katika matini ya Kiebrania; ‘Yahwe’ hulitaja kama jina badala ya kulibadili kuwa cheo.
- source_word: כִּי רַבִּים רַחֲמָיו מְאֹד
  choice: kwa maana rehema zake ni nyingi sana
  rationale: רַחֲמִים hapa ni wingi unaoweza kuwakilishwa kiasili kwa ‘rehema,’ na רַבִּים pamoja na מְאֹד husisitiza wingi wake mkubwa.
- source_word: וּבְיַד אָדָם אַל אֶפֹּל
  choice: lakini nisianguke mkononi mwa mwanadamu
  rationale: Kauli hii huhifadhi ulinganifu na ‘mkononi mwa Yahwe’ pamoja na ombi hasi la Daudi. ‘Mwanadamu’ humaanisha binadamu kwa ujumla katika utofautishaji na Mungu.
- source_word: אָדָם
  choice: mwanadamu
  rationale: Nomino ya umoja hapa humwakilisha binadamu kwa ujumla, si lazima mwanamume mmoja. ‘Mwanadamu’ huhifadhi umoja wa kisarufi na maana ya kijumla.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ina jina la Mungu lenye herufi nne, si cheo. ‘Yahwe’ huhifadhi jina hilo waziwazi bila kulichanganya na neno la Kiebrania la ‘Bwana.’
- issue: Maana ya kuanguka mkononi mwa Yahwe badala ya mwanadamu
  choice: Taswira ya ‘mkono’ imehifadhiwa katika pande zote mbili
  alternative: Kutiwa chini ya mamlaka ya Yahwe au ya wanadamu
  rationale: Ulinganifu wa Kiebrania unaweka mamlaka na hukumu ya Mungu dhidi ya ile ya binadamu. Kuhifadhi ‘mkono’ hakufuti mvutano wa Daudi kuchagua hukumu ya Mungu kwa kutegemea rehema zake.
- issue: Umoja wa אָדָם
  choice: mwanadamu
  alternative: mikono ya wanadamu
  rationale: Kiebrania ni umoja na kinatumia ‘mkono wa mwanadamu’ kwa maana wakilishi. Tafsiri ya umoja huhifadhi muundo huo, huku tanbihi ikitoa tafsiri ya kawaida zaidi ya kijumla.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa sasa. ‘Nimebanwa sana’ huhifadhi nguvu ya nahau bila kutumia lugha ya kizamani; ‘na nianguke’ na ‘nisianguke’ huunda ulinganifu wa asili na wa heshima.
