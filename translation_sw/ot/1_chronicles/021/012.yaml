id: 1CH.21.12
reference: 1 Chronicles 21:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אִם שָׁל֨וֹשׁ שָׁנִ֜ים רָעָ֗ב וְ/אִם שְׁלֹשָׁ֨ה חֳדָשִׁ֜ים נִסְפֶּ֥ה מִ/פְּנֵי צָרֶי/ךָ֮ וְ/חֶ֣רֶב אוֹיְבֶ֣/ךָ לְ/מַשֶּׂגֶת֒ וְ/אִם שְׁלֹ֣שֶׁת יָ֠מִים חֶ֣רֶב יְהוָ֤ה וְ/דֶ֨בֶר֙ בָּ/אָ֔רֶץ וּ/מַלְאַ֣ךְ יְהוָ֔ה מַשְׁחִ֖ית בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה רְאֵ֔ה מָֽה אָשִׁ֥יב אֶת שֹׁלְחִ֖/י דָּבָֽר־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/012.yaml
  text: either three years of famine[a], or three months of being swept away before your foes while the sword of your enemies overtakes you, or three days of the sword of Yahweh, even pestilence in the land, with the angel of Yahweh destroying throughout all the territory of Israel[b]. Now consider what answer I should return to the one who sent me.
translation:
  language: sw
  text: Ama miaka mitatu ya njaa, au miezi mitatu ya kuangamizwa mbele ya adui zako, huku upanga wa maadui zako ukikufikia, au siku tatu za upanga wa Yahwe, yaani tauni katika nchi, huku malaika wa Yahwe akiharibu katika eneo lote la Israeli. Sasa fikiria ni jibu gani nimrudishie yule aliyenituma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָב
  choice: njaa
  rationale: Ni istilahi ya kawaida ya Kiswahili kwa ukosefu mkubwa wa chakula unaolikumba taifa.
- source_word: נִסְפֶּה
  choice: kuangamizwa
  rationale: Huwasilisha hali ya kuletwa kwenye maangamizi au kuharibiwa vitani bila kuibana maana kuwa kifo cha mtu mmoja tu.
- source_word: מִפְּנֵי צָרֶיךָ
  choice: mbele ya watesi wako
  rationale: Inahifadhi taswira ya kijeshi ya kushindwa au kukimbia mbele ya mahasimu, na pia huepuka kurudia neno 'adui' katika kishazi kinachofuata.
- source_word: חֶרֶב אוֹיְבֶיךָ
  choice: upanga wa adui zako
  rationale: Inahifadhi taswira halisi ya upanga kama nguvu ya kijeshi ya maadui.
- source_word: לְמַשֶּׂגֶת
  choice: ukikufikia
  rationale: Katika muktadha wa kuw追a, kitenzi kina maana ya kufikia au kushika; 'kukufikia' ni cha asili na hakiongezi maelezo yasiyokuwapo.
- source_word: חֶרֶב יְהוָה
  choice: upanga wa Yahwe
  rationale: Inahifadhi muundo na ulinganisho wa kitheolojia kati ya upanga wa maadui na upanga wa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa jina la agano YHWH kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: דֶבֶר
  choice: tauni
  rationale: Neno hili linaeleweka kama ugonjwa wa mlipuko wenye kuua katika muktadha wa hukumu.
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahwe
  rationale: Ni tafsiri ya kawaida katika simulizi na haibainishi zaidi utambulisho wa kiumbe huyo kuliko maandishi yenyewe.
- source_word: מַשְׁחִית
  choice: akiharibu
  rationale: Inawakilisha tendo linaloendelea la malaika kwa lugha ya kawaida na yenye uzito.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: katika eneo lote la Israeli
  rationale: Hapa גְּבוּל inaashiria ukubwa wote wa nchi, si mistari ya mipaka pekee.
- source_word: רְאֵה
  choice: fikiria
  rationale: Amri hii inamtaka Daudi atafakari na kuamua, wala si kutazama kwa macho.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja; kulihifadhi kama jina maalumu kunafuata ushahidi wa chanzo bila kulibadilisha kuwa cheo.
- issue: Utambulisho wa מַלְאַךְ יְהוָה
  choice: malaika wa Yahwe
  alternative: mjumbe wa Yahwe
  rationale: Tafsiri hii huhifadhi maana ya kawaida katika simulizi bila kuamua ikiwa mhusika huyo ni malaika aliyeumbwa au udhihirisho maalumu wa Mungu.
- issue: Uhusiano wa דֶבֶר na חֶרֶב יְהוָה
  choice: yaani, tauni nchini
  alternative: na tauni nchini
  rationale: Neno 'yaani' linaonyesha kuwa tauni inaeleza jinsi 'upanga wa Yahwe' unavyodhihirika hapa, huku likidumisha uwezekano wa uhusiano wa ufafanuzi uliomo katika mpangilio wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaofaa simulizi la kibiblia. Muundo wa chaguo tatu na taswira ya 'upanga' vimehifadhiwa. Hakuna tanbihi, kwa kuwa mbadala za kileksika zinaweza kuelezwa katika vifaa vya uhariri bila kulemea aya.
