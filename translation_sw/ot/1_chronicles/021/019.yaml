translation:
  language: sw
  text: Daudi akapanda kwa kufuata neno la Gadi, ambalo Gadi alikuwa amelisema kwa jina la Yahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה kina maana ya kwenda au kupanda juu; “akapanda” kinahifadhi mwelekeo wa tendo katika muktadha.
- source_word: בִּדְבַר
  choice: kwa kufuata neno la
  rationale: Muundo huu unaonyesha kwamba Daudi alitenda kwa kutii au kwa kupatana na ujumbe wa Gadi; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: גָּד
  choice: Gadi
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: אֲשֶׁר דִּבֶּר
  choice: alilokuwa amesema
  rationale: Kishazi hiki kinarejelea neno la Gadi na kuonyesha kwamba alikuwa ameshalisema kabla Daudi hajachukua hatua.
- source_word: בְּשֵׁם יְהוָה
  choice: kwa jina la Yahwe
  rationale: Tafsiri hii inadumisha usemi wa Kiebrania unaoonyesha kwamba Gadi alisema akiwa mwakilishi na chini ya mamlaka ya Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu; “Yahwe” linahifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Maana ya kusema kwa jina la Yahwe
  choice: kwa jina la Yahwe
  alternative: kwa mamlaka ya Yahwe
  rationale: Usemi halisi umehifadhiwa kwa kuwa unaeleweka katika Kiswahili na pia unabaki na upana wake wa maana, unaohusisha uwakilishi na mamlaka.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kwa kufuata neno la Gadi” linaeleza kwa uwazi utii wa Daudi bila kupoteza dhana ya kutenda kwa mujibu wa ujumbe; “akapanda” linahifadhi mwelekeo wa kitenzi cha Kiebrania.
