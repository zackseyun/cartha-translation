  text: וַ/יִּשָּׂ֨א דָוִ֜יד אֶת עֵינָ֗י/ו וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֗ד בֵּ֤ין הָ/אָ֨רֶץ֙ וּ/בֵ֣ין הַ/שָּׁמַ֔יִם וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ נְטוּיָ֖ה עַל יְרוּשָׁלִָ֑ם וַ/יִּפֹּ֨ל דָּוִ֧יד וְ/הַ/זְּקֵנִ֛ים מְכֻסִּ֥ים בַּ/שַּׂקִּ֖ים עַל פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/016.yaml
  text: David lifted up his eyes and saw the angel of Yahweh standing between the earth and the heavens[a], with his sword drawn in his hand, stretched out over Jerusalem. Then David and the elders, covered in sackcloth, fell on their faces.
translation:
  language: sw
  text: Daudi akainua macho yake, akamwona malaika wa Yahweh amesimama kati ya dunia na mbingu[a], akiwa na upanga wake uliotolewa alani mkononi mwake, ukiwa umenyoshwa juu ya Yerusalemu. Ndipo Daudi na wazee, wakiwa wamevaa nguo za magunia, wakaanguka kifudifudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kati ya nchi na mbingu.” Neno la Kiebrania linaweza kumaanisha “dunia” au “nchi”; hapa utofautishaji na mbingu unapendelea “dunia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו
  choice: akainua macho yake
  rationale: Inahifadhi nahau na taswira ya Kiebrania kwa Kiswahili cha kawaida chenye uzito wa simulizi.
- source_word: מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  rationale: Muundo wa uhusiano umetafsiriwa moja kwa moja, huku jina la Mungu likihifadhiwa kama jina binafsi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ni uhawilishaji wa jina la Mungu lililoandikwa kwa Tetragramatoni, badala ya kulibadilisha kuwa cheo.
- source_word: עֹמֵד
  choice: amesimama
  rationale: Inaonyesha wazi mkao unaoonekana wa malaika katika tukio.
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמַיִם
  choice: kati ya dunia na mbingu
  rationale: Dunia na mbingu zinaendeleza utofautishaji wa kikoa cha chini na cha juu; Kiswahili hutumia 'mbingu' kwa umbo lilelile katika maana ya umoja au wingi.
- source_word: וְחַרְבּוֹ שְׁלוּפָה
  choice: akiwa na upanga wake uliofutwa katika ala
  rationale: Inaeleza hali ya upanga baada ya kutolewa alani na kudumisha taswira ya tishio.
- source_word: בְּיָדוֹ
  choice: mkononi mwake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishazi hicho.
- source_word: נְטוּיָה עַל יְרוּשָׁלִָם
  choice: ukiwa umenyoshwa juu ya Yerusalemu
  rationale: Inahifadhi taswira ya upanga ulioelekezwa kwa kutisha juu ya mji bila kufafanua zaidi ya maandishi.
- source_word: וַיִּפֹּל ... עַל פְּנֵיהֶם
  choice: wakaanguka kifudifudi
  rationale: Ni nahau ya kawaida ya Kiswahili inayoonyesha tendo la kimwili la kusujudu kwa unyenyekevu au hofu.
- source_word: וְהַזְּקֵנִים
  choice: na wazee
  rationale: Inatafsiri kiunganishi na kundi la viongozi kwa uwazi bila kuongeza maelezo yasiyokuwapo.
- source_word: מְכֻסִּים בַּשַּׂקִּים
  choice: wakiwa wamejifunika nguo za magunia
  rationale: Inaonyesha kuwa walikuwa wamefunikwa kwa vazi la maombolezo na toba; 'nguo za magunia' inaeleweka kuliko 'magunia' peke yake.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; 'Yahweh' hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Utambulisho wa מַלְאַךְ יְהוָה
  choice: malaika wa Yahweh
  alternative: Malaika wa Yahweh
  rationale: Herufi ndogo haitangulizi hitimisho la kitheolojia kuhusu utambulisho wa malaika; maandishi yenyewe yanaonyesha uhusiano wake na Yahweh bila kuufafanua zaidi.
