  yaml_path: translation/ot/1_chronicles/021/007.yaml
  text: But this matter was evil in the sight of God[a], so he struck Israel.
translation:
  language: sw
  text: Lakini jambo hili lilikuwa ovu machoni pa Mungu[a], kwa hiyo akawapiga Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo hili halikumpendeza Mungu.” Kiebrania kinasema kihalisi, “jambo hili lilikuwa ovu machoni pa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: lilikuwa ovu
  rationale: Kitenzi kinatathmini jambo hilo kwa nguvu kuwa baya au ovu, si tu kwamba halikumpendeza Mungu. Muundo huu unahifadhi uzito wa Kiebrania kwa Kiswahili cha sasa.
- source_word: בְּעֵינֵי הָאֱלֹהִים
  choice: machoni pa Mungu
  rationale: Hii ni tafsiri ya karibu na ya kawaida ya nahau ya Kiebrania ‘machoni pa Mungu,’ ikionyesha tathmini ya Mungu.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Neno lililotumika ni Elohim, wala si jina la Mungu YHWH; kwa hiyo limetafsiriwa ‘Mungu,’ si ‘BWANA.’
- source_word: עַל הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: דבר hapa humaanisha jambo au tendo linalozungumziwa. ‘Jambo hili’ ni wazi bila kufafanua zaidi ya maandishi.
- source_word: וַיַּךְ
  choice: akawapiga
  rationale: נכה humaanisha kupiga. ‘Akawapiga’ huhifadhi kauli ya moja kwa moja bila kuongeza kwamba wote waliuawa; kiambishi wa- kinaonyesha Israeli kama watu kwa namna ya kawaida katika Kiswahili.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israeli
  rationale: Yambwa ni taifa la Israeli. Jina lenyewe linatosha katika muktadha, huku upatanisho wa ‘akawapiga’ ukilitazama taifa kama watu.
- source_word: וַ ... וַ
  choice: Lakini ... kwa hiyo
  rationale: Kiunganishi cha kwanza kinaonyesha utofauti na simulizi lililotangulia, na cha pili kinaonyesha matokeo ya tathmini ya Mungu.
theological_decisions:
- issue: Tathmini ya Mungu kuhusu sensa ya Daudi na hukumu iliyofuata
  choice: Jambo hilo lilikuwa ovu machoni pa Mungu, kwa hiyo akawapiga Israeli.
  alternative: Jambo hilo halikumpendeza Mungu, naye akawaadhibu Israeli.
  rationale: Tafsiri inahifadhi nguvu ya tathmini ‘ovu’ na tendo la moja kwa moja ‘akawapiga.’ Pia haiondoi mvutano wa simulizi kwamba tendo la Daudi linahukumiwa lakini Israeli ndio wanaopigwa, wala hauelezi zaidi ya mstari wenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ovu machoni pa Mungu’ huhifadhi nahau na nguvu ya maandishi ya Kiebrania, huku tanbihi ikitoa usemi laini zaidi wa Kiswahili.
