base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/020.yaml
  text: Ornan turned and saw the angel[a], and his four sons with him were hiding themselves, while Ornan was threshing wheat.
translation:
  language: sw
  text: Ornani akageuka, akamwona malaika, nao wanawe wanne waliokuwa pamoja naye walikuwa wakijificha, huku Ornani akipura ngano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: akageuka
  rationale: Kitenzi שוב hapa kinaonyesha Ornani aligeuka kimwili, ndipo akamwona malaika. ‘Akageuka’ ni cha kawaida na hakiongezi wazo lisilokuwapo la kurudi mahali fulani.
- source_word: וַיַּרְא אֶת הַמַּלְאָךְ
  choice: akamwona malaika
  rationale: מַלְאָךְ yaweza kumaanisha mjumbe au malaika, lakini katika simulizi hili mhusika huyo ni wa mbinguni; hivyo ‘malaika’ linafaa zaidi.
- source_word: וְאַרְבַּעַת בָּנָיו עִמּוֹ
  choice: nao wanawe wanne waliokuwa pamoja naye
  rationale: Huhifadhi idadi, uhusiano wao na Ornani, na maana ya עִמּוֹ kwa Kiswahili cha asili na kilicho wazi.
- source_word: מִתְחַבְּאִים
  choice: wakajificha
  rationale: Umbo la Kiebrania ni la kujirejelea/kati. Kitenzi ‘kujificha’ huhifadhi maana hiyo kwa kawaida kabisa katika Kiswahili.
- source_word: וְאָרְנָן דָּשׁ חִטִּים
  choice: huku Ornani akiwa anapura ngano
  rationale: Kishazi hiki kinaonyesha tendo la nyuma lililokuwa likiendelea. ‘Huku ... akiwa anapura’ huwasilisha hali hiyo, na ‘ngano’ hutafsiri חִטִּים kwa usahihi kuliko ‘nafaka’.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa sasa na wenye hadhi. ‘Kupura ngano’ ni istilahi sahihi na inayoeleweka kwa tendo la kutenganisha nafaka na masuke au makapi. Hakuna tanbihi inayohitajika: maana ya kujirejelea katika מִתְחַבְּאִים imewasilishwa moja kwa moja na kitenzi cha Kiswahili ‘kujificha’.'
