base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/024.yaml
  text: But King David said to Ornan[a], “No, for I will surely buy it for the full price in silver, because I will not take for Yahweh what is yours[b], nor offer up a burnt offering for nothing.”
translation:
  language: sw
  text: Lakini Mfalme Daudi akamwambia Ornani, “Hapana, hakika nitakinunua kwa bei kamili kwa fedha, kwa maana sitachukua kwa ajili ya Yahwe kilicho chako, wala kutoa sadaka ya kuteketezwa bure.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא כִּי
  choice: Hapana! ... kwa maana
  rationale: Kauli hii inaonyesha kwanza kukataa kwa uthabiti, kisha sababu ya kukataa huko; mgawanyo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: קָנֹה אֶקְנֶה
  choice: Hakika nitanunua
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichonyambuliwa unasisitiza azimio la Daudi; “hakika” huhifadhi msisitizo huo.
- source_word: בְּכֶסֶף מָלֵא
  choice: kwa kiasi kamili cha fedha
  rationale: Kirai hiki kinaonyesha malipo kamili ya fedha, si malipo ya mfano au sehemu tu.
- source_word: אֶשָּׂא אֲשֶׁר לְךָ
  choice: sitachukua kilicho chako
  rationale: Katika muktadha huu נשׂא humaanisha kuchukua au kujipatia mali ya mwingine; tafsiri hii pia huhifadhi usemi wa umilikaji.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahwe
  rationale: Kirai kinaeleza kwamba kitu hicho kingechukuliwa kwa kusudi la kutolewa au kuwekwa wakfu kwa Yahwe.
- source_word: וְהַעֲלוֹת עוֹלָה
  choice: wala kutoa sadaka ya kuteketezwa
  rationale: “Wala” huendeleza ukanushaji, na “sadaka ya kuteketezwa” ni istilahi inayoeleweka kwa dhabihu iliyoteketezwa yote.
- source_word: חִנָּם
  choice: bure
  rationale: Neno hili humaanisha bila malipo au gharama; “bure” ni fupi, asilia, na huhifadhi hoja ya Daudi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה; “Yahwe” hulitambulisha kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Uhusiano wa לַיהוָה na tendo la kuchukua
  choice: sitachukua kilicho chako kwa ajili ya Yahwe
  alternative: sitachukua kilicho chako na kumpa Yahwe
  rationale: Mpangilio uliochaguliwa hufuata kwa karibu sintaksia ya Kiebrania na hauongezi wazi tendo la “kumpa,” ambalo halijaandikwa moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi fupi baada ya “Hapana” huwasilisha uthabiti wa jibu bila kufanya lugha kuwa nzito.
