  text: וַ/יֹּ֣אמֶר דָּוִ֣יד אֶֽל הָ/אֱלֹהִ֡ים הֲ/לֹא֩ אֲנִ֨י אָמַ֜רְתִּי לִ/מְנ֣וֹת בָּ/עָ֗ם וַ/אֲנִי ה֤וּא אֲשֶׁר חָטָ֨אתִי֙ וְ/הָרֵ֣עַ הֲרֵע֔וֹתִי וְ/אֵ֥לֶּה הַ/צֹּ֖אן מֶ֣ה עָשׂ֑וּ יְהוָ֣ה אֱלֹהַ֗/י תְּהִ֨י נָ֤א יָֽדְ/ךָ֙ בִּ֚/י וּ/בְ/בֵ֣ית אָבִ֔/י וּֽ/בְ/עַמְּ/ךָ֖ לֹ֥א לְ/מַגֵּפָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/017.yaml
  text: Then David said to God[a], “Was it not I who ordered the people to be counted? I am the one who has sinned and done great evil. But these sheep—what have they done? O Yahweh my God, please let your hand be against me and against my father’s house[d][c][b], but not against your people for a plague.”
translation:
  language: sw
  text: Ndipo Daudi akamwambia Mungu, “Je, si mimi niliyeamuru watu wahesabiwe? Mimi ndiye niliyetenda dhambi na kufanya uovu mkubwa. Lakini kondoo hawa wamefanya nini? Ee Yahwe, Mungu wangu, tafadhali mkono wako uwe dhidi yangu na dhidi ya nyumba ya baba yangu, wala usiwe dhidi ya watu wako kwa tauni.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא אֲנִי אָמַרְתִּי לִמְנוֹת בָּעָם
  choice: Je, si mimi niliyeamuru watu wahesabiwe?
  rationale: Swali la balagha linahifadhi msisitizo wa Daudi kuhusu wajibu wake; ‘niliyeamuru’ linaeleza kwa Kiswahili cha kawaida agizo lake la kuanzisha sensa.
- source_word: וַאֲנִי הוּא אֲשֶׁר חָטָאתִי
  choice: Mimi ndiye niliyetenda dhambi
  rationale: Muundo ‘Mimi ndiye’ unahifadhi msisitizo wa Kiebrania kwamba Daudi mwenyewe ndiye mwenye hatia.
- source_word: וְהָרֵעַ הֲרֵעוֹתִי
  choice: na kufanya uovu mkubwa
  rationale: Infinitivu kamili pamoja na kitenzi kilichopinda inaongeza nguvu ya kauli; ‘uovu mkubwa’ huwasilisha uzito huo kwa lugha ya kawaida.
- source_word: וְאֵלֶּה הַצֹּאן
  choice: Lakini kondoo hawa
  rationale: Inadumisha sitiari ya kichungaji ambayo Daudi anaitumia kwa watu.
- source_word: יְהוָה אֱלֹהַי
  choice: Ee Yahwe, Mungu wangu
  rationale: Jina la Mungu linatoholewa moja kwa moja, na ‘Ee’ linaonyesha mwito wa moja kwa moja kwa Kiswahili cha heshima.
- source_word: תְּהִי נָא יָדְךָ בִּי וּבְבֵית אָבִי
  choice: tafadhali mkono wako na uwe dhidi yangu na dhidi ya jamaa ya baba yangu
  rationale: Inahifadhi sitiari ya ‘mkono’ kama nguvu inayotenda hukumu; ‘jamaa ya baba yangu’ hueleweka kama nyumba au ukoo wa kifamilia.
- source_word: וּבְעַמְּךָ לֹא לְמַגֵּפָה
  choice: lakini usiwe dhidi ya watu wako kwa kuwaletea tauni
  rationale: Kiswahili hiki kinaweka wazi ombi kwamba hukumu ya tauni isiwaangukie watu, bila kuondoa uhusiano wa kishazi cha Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ina jina binafsi la Mungu, tetragramatoni, si cheo tu; ‘Yahwe’ hulihifadhi kama jina huku ikiepuka kulibadilisha kuwa cheo.
- issue: Maana ya ‘mkono wako’ katika hukumu
  choice: Kudumisha ‘mkono wako’ na kuongeza ‘dhidi ya’
  alternative: nguvu yako ya hukumu inipate
  rationale: Chaguo hili linahifadhi taswira ya Kiebrania huku muktadha wa adhabu ukibainishwa kwa Kiswahili.
- issue: Utambulisho wa ‘kondoo hawa’
  choice: Kudumisha sitiari bila kuibadili kuwa ‘watu hawa’
  alternative: watu hawa
  rationale: Matini yenyewe inawaeleza watu kwa sitiari ya kondoo; kuiacha wazi kunahifadhi mvutano na nguvu ya ombi la Daudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeundwa kwa uwazi wa usomaji wa kawaida, huku sitiari za ‘kondoo’ na ‘mkono’ na msisitizo wa Daudi juu ya hatia yake vikihifadhiwa.
