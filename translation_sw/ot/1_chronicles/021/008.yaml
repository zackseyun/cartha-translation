  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִיד֙ אֶל הָ֣/אֱלֹהִ֔ים חָטָ֣אתִֽי מְאֹ֔ד אֲשֶׁ֥ר עָשִׂ֖יתִי אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/עַתָּ֗ה הַֽעֲבֶר נָא֙ אֶת עֲו֣וֹן עַבְדְּ/ךָ֔ כִּ֥י נִסְכַּ֖לְתִּי מְאֹֽד־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/008.yaml
  text: Then David said to God[a], “I have sinned greatly in doing this thing. But now, please take away the guilt of your servant, for I have acted very foolishly.”
translation:
  language: sw
  text: Ndipo Daudi akamwambia Mungu, “Nimetenda dhambi kubwa sana kwa kufanya jambo hili. Lakini sasa, tafadhali ondoa hatia[a] ya mtumishi wako, kwa maana nimetenda kipumbavu sana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uovu wa mtumishi wako.” Neno la Kiebrania linaweza kumaanisha uovu, hatia, au dhima inayotokana na hatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “Ndipo” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: אֶל הָאֱלֹהִים
  choice: akamwambia Mungu
  rationale: Katika muktadha huu אֱלֹהִים humrejelea Mungu wa Israeli; “Mungu” ndiyo tafsiri ya kawaida na ya asili.
- source_word: חָטָאתִי מְאֹד
  choice: Nimetenda dhambi kubwa sana
  rationale: Huwasilisha ungamo la tendo lililokamilika pamoja na msisitizo wa מְאֹד, kwa lugha ya Kiswahili iliyo wazi na yenye uzito.
- source_word: אֲשֶׁר עָשִׂיתִי אֶת הַדָּבָר הַזֶּה
  choice: kwa kufanya jambo hili
  rationale: Kirai hiki kinahusianisha dhambi moja kwa moja na tendo husika bila kulifafanua zaidi ya maandishi ya Kiebrania.
- source_word: וְעַתָּה
  choice: Lakini sasa
  rationale: Huonyesha badiliko la usemi kutoka ungamo kwenda ombi, huku “Lakini” ikifanya mpito huo kuwa wazi kwa Kiswahili.
- source_word: הַעֲבֶר נָא
  choice: tafadhali ondoa
  rationale: Hiphil ya עבר katika nahau hii ina maana ya kuondoa, na נָא huonyesha ombi la unyenyekevu linalowasilishwa kwa “tafadhali.”
- source_word: עֲוֹן
  choice: hatia
  rationale: Neno hili linaweza kumaanisha uovu, hatia, au dhima/adhabu inayotokana na hatia. Katika ombi la msamaha, “hatia” huwasilisha vizuri mzigo wa kimaadili anaotaka Mungu auondoe bila kuufanya uwe adhabu pekee.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Hapa ni namna ya Daudi kujitaja kwa unyenyekevu mbele za Mungu, si msisitizo wa hali ya utumwa; “mtumishi wako” inafaa kimuktadha.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya ombi la Daudi na ni kiunganishi cha kawaida, chenye heshima katika Kiswahili.
- source_word: נִסְכַּלְתִּי מְאֹד
  choice: nimetenda kipumbavu sana
  rationale: Kitenzi kinaonyesha kutenda kwa upumbavu, si kuwa na sifa ya upumbavu tu; “sana” huhifadhi msisitizo wa מְאֹד.
theological_decisions:
- issue: Maana ya עָוֹן katika ombi la Daudi
  choice: hatia
  alternative: uovu; adhabu au dhima inayotokana na uovu
  rationale: Muktadha ni ungamo na ombi la kuondolewa kile kinachotokana na dhambi. “Hatia” huwasilisha mzigo wa kimaadili bila kuamua kimya kimya kwamba neno linamaanisha tendo la uovu pekee au adhabu pekee; tanbihi huhifadhi upana wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida, huku uzito wa ungamo na unyenyekevu wa ombi vikihifadhiwa. Alama ya tanbihi imewekwa baada ya “hatia,” neno linalohusika moja kwa moja na ufafanuzi wake.
