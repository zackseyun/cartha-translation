  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa Kiebrania umehifadhiwa kadiri inavyowezekana bila kufanya sentensi iwe ngumu; tarakimu zimetumiwa kwa usomaji rahisi.
