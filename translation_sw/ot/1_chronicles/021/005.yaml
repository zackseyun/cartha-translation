base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/005.yaml
  text: Joab gave the number of the census of the people to David. All Israel was 1,100,000 men drawing the sword[a], and Judah was 470,000 men drawing the sword.
translation:
  language: sw
  text: Joabu akampa Daudi idadi ya sensa ya watu. Israeli yote ilikuwa na wanaume 1,100,000[a] wenye kuuchomoa upanga, na Yuda ilikuwa na wanaume 470,000 wenye kuuchomoa upanga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “elfu elfu moja na elfu mia moja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: idadi ya sensa ya watu
  rationale: Muundo huu unahifadhi maana ya מִסְפַּר kama ‘idadi’ na מִפְקַד kama ‘sensa’ kwa Kiswahili cha sasa na kinachoeleweka.
- source_word: וַיְהִי כָל יִשְׂרָאֵל
  choice: Israeli yote ilikuwa na
  rationale: Hii inaonyesha jumla iliyopatikana huku ikidumisha maana ya pamoja ya ‘Israeli yote’; ‘ilikuwa na’ ni ya kawaida zaidi kwa kutaja idadi ya watu kwa Kiswahili.
- source_word: אֶלֶף אֲלָפִים וּמֵאָה אֶלֶף
  choice: 1,100,000
  rationale: Tarakimu huwasilisha idadi kubwa kwa uwazi; tanbihi inadumisha muundo halisi wa Kiebrania.
- source_word: אִישׁ
  choice: wanaume
  rationale: Katika muktadha wa sensa ya kijeshi, neno hili linawahusu wanaume mmoja mmoja kwa maana ya pamoja.
- source_word: שֹׁלֵף חֶרֶב
  choice: wenye kuchomoa upanga
  rationale: Tafsiri hii inadumisha taswira ya kitenzi שׁלף, ‘kuchomoa/kuufuta upanga alani,’ badala ya kuibadili kwa jumla kuwa ‘wenye silaha.’
- source_word: וִיהוּדָה
  choice: na Yuda ilikuwa na
  rationale: Kiunganishi kinaendeleza jumla ya pili inayolingana na ile ya Israeli, na kitenzi kilichodokezwa kimewekwa wazi kwa Kiswahili.
- source_word: אַרְבַּע מֵאוֹת וְשִׁבְעִים אֶלֶף
  choice: 470,000
  rationale: Tarakimu ni wazi na za kawaida katika uwasilishaji wa idadi kubwa kwa Kiswahili cha kisasa.
theological_decisions: []
