  yaml_path: translation/ot/1_chronicles/021/025.yaml
  text: And David gave Ornan six hundred shekels of gold by weight for the place[a].
translation:
  language: sw
  text: Daudi akampa Ornani dhahabu yenye uzani wa shekeli mia sita kwa ajili ya mahali pale.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Simulizi sambamba katika 2 Samweli 24:24 linataja shekeli hamsini za fedha; hapa katika Mambo ya Nyakati zimetajwa shekeli mia sita za dhahabu. Huenda tofauti hiyo inaonyesha ukubwa tofauti wa eneo lililonunuliwa au mapokeo tofauti ya maandishi.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akampa
  rationale: Kitenzi נתן kwa kawaida humaanisha ‘kutoa/kumpa.’ ‘Akampa’ kinahifadhi usemi wa Kiebrania, huku muktadha na kiasi vikionyesha kuwa ilikuwa malipo.
- source_word: לְאָרְנָן
  choice: Ornani
  rationale: Maandishi ya Mambo ya Nyakati yana jina Ornan; umbo ‘Ornani’ linafuata matumizi ya kawaida ya jina hili katika Kiswahili bila kulibadilisha kuwa Arauna la simulizi sambamba.
- source_word: בַּמָּקוֹם
  choice: kwa ajili ya mahali pale
  rationale: Katika muktadha wa ununuzi, בַּמָּקוֹם linaeleweka kuwa malipo yalitolewa kwa ajili ya eneo hilo. ‘Mahali pale’ ni lugha ya kawaida na huhifadhi maana ya msingi ya מָקוֹם.
- source_word: שִׁקְלֵי זָהָב
  choice: shekeli ... za dhahabu
  rationale: Huhifadhi kipimo cha kale na kutaja wazi nyenzo iliyopimwa, bila kukibadili kuwa thamani ya kisasa.
- source_word: מִשְׁקָל
  choice: kwa uzani
  rationale: Neno hili linaonyesha kwamba shekeli hizo ni kipimo cha uzani; tafsiri inalifanya jambo hilo wazi kwa Kiswahili cha kawaida.
- source_word: שֵׁשׁ מֵאוֹת
  choice: mia sita
  rationale: Hii ndiyo namba iliyo wazi katika maandishi ya Kiebrania ya Mambo ya Nyakati, kwa hiyo imehifadhiwa bila kupatanishwa na simulizi sambamba.
theological_decisions:
- issue: Tofauti ya kiasi na aina ya metali ikilinganishwa na 2 Samweli 24:24
  choice: Kuhifadhi ‘shekeli mia sita za dhahabu’ kama ilivyo katika Mambo ya Nyakati.
  alternative: Kupatanisha kifungu hiki na ‘shekeli hamsini za fedha’ katika 2 Samweli 24:24.
  rationale: Maandishi ya Kiebrania hapa yanasema wazi shekeli mia sita za dhahabu. Tafsiri inapaswa kuwakilisha kifungu hiki kama kilivyo na kutatua mvutano wa kisimulizi katika tanbihi badala ya kubadili matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘akampa Ornani’ ni wa kawaida na unaakisi kitenzi cha Kiebrania; ‘kwa ajili ya mahali pale’ huonyesha muktadha wa ununuzi bila kuufanya usemi kuwa wa kiufundi kupita kiasi.
