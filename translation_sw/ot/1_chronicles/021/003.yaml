  text: וַ/יֹּ֣אמֶר יוֹאָ֗ב יוֹסֵף֩ יְהוָ֨ה עַל עַמּ֤/וֹ כָּ/הֵם֙ מֵאָ֣ה פְעָמִ֔ים הֲ/לֹא֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֻּלָּ֥/ם לַ/אדֹנִ֖/י לַ/עֲבָדִ֑ים לָ֣/מָּה יְבַקֵּ֥שׁ זֹאת֙ אֲדֹנִ֔/י לָ֛/מָּה יִהְיֶ֥ה לְ/אַשְׁמָ֖ה לְ/יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/003.yaml
  text: But Joab said[a], “May Yahweh add to his people a hundred times as many as they are! Are they not all, my lord the king[c][b], servants of my lord? Why does my lord seek this? Why should it become guilt for Israel?”
translation:
  language: sw
  text: Lakini Yoabu akasema, “Yahweh na awaongezee watu wake mara mia ya idadi yao ya sasa![a] Je, wote si watumishi wa bwana wangu, mfalme?[b] Kwa nini bwana wangu anataka jambo hili? Kwa nini jambo hili liwaletee Israeli hatia?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahweh na awaongezee watu wake mara mia zaidi ya walivyo sasa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Je, wote si watumwa wa bwana wangu?”
    reason: lexical_alternative
  - marker: c
    text: Au, “Kwa nini jambo hili liwe sababu ya hatia kwa Israeli?” Hapa ‘hatia’ inaweza kumaanisha pia wajibu au lawama inayompata Israeli kwa sababu ya tendo hili.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹסֵף
  choice: na awazidishe
  rationale: Muundo wa ombi unaonyesha tamanio au dua ya Yoabu. Kiswahili cha ‘na awazidishe’ kinawasilisha nguvu hiyo ya hiari kwa kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi, badala ya kubadilishwa kuwa cheo.
- source_word: עַל עַמּוֹ כָּהֵם מֵאָה פְעָמִים
  choice: watu wake mara mia kuliko walivyo sasa
  rationale: Nahau hii inaonyesha kuongezeka hadi kufikia mara mia ya idadi iliyopo; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: הֲלֹא
  choice: Je, ... si
  rationale: Hili ni swali la balagha linalotarajia jibu la kukubali.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu, mfalme
  rationale: Hifadhi ya heshima ya kimahakama kwa mfalme; koma inaonyesha kwamba ‘mfalme’ anamfafanua ‘bwana wangu.’
- source_word: כֻּלָּם לַאדֹנִי לַעֲבָדִים
  choice: wote si watumishi wa bwana wangu
  rationale: Katika muktadha huu עֲבָדִים inaonyesha kuwa chini ya mamlaka na utumishi wa mfalme; ‘watumishi’ huepuka kusisitiza bila sababu hali ya utumwa wa kumilikiwa.
- source_word: יְבַקֵּשׁ זֹאת
  choice: anataka jambo hili
  rationale: בקש hapa ni kufuatilia au kutaka jambo lifanywe, yaani sensa; ‘anataka’ ni ya kawaida kwa Kiswahili na haifungi maana kwa ‘kuomba’ tu.
- source_word: יִהְיֶה לְאַשְׁמָה לְיִשְׂרָאֵל
  choice: jambo hili liwaletee Israeli hatia
  rationale: Kifungu kinaonyesha hatia au uwajibikaji unaowapata Israeli kutokana na hatua hii. Tafsiri hii ni ya kawaida huku tanbihi ikihifadhi muundo mbadala wa ‘sababu ya hatia.’
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina binafsi la Mungu moja kwa moja; ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya עֲבָדִים chini ya mfalme
  choice: watumishi
  alternative: watumwa
  rationale: Ingawa neno linaweza kumaanisha watumwa, hapa hoja ni kwamba watu wote wako chini ya mamlaka ya mfalme. ‘Watumishi’ linafaa zaidi kwa muktadha huu bila kuondoa uwezekano wa maana nyingine, ambao umeonyeshwa katika tanbihi.
- issue: Maana ya לְאַשְׁמָה kwa Israeli
  choice: kuwaletea Israeli hatia
  alternative: kuwa sababu ya hatia kwa Israeli
  rationale: Neno linaashiria hatia au hali ya kuwajibika, wala si sadaka ya hatia katika muktadha huu. Tafsiri kuu ni ya kawaida, na mbadala umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Usemi wa kimahakama ‘bwana wangu, mfalme’ umehifadhiwa, huku sentensi nyingine zikitumia mpangilio wa kawaida wa Kiswahili.
