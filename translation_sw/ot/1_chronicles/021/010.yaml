  text: לֵךְ֩ וְ/דִבַּרְתָּ֨ אֶל דָּוִ֜יד לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה שָׁל֕וֹשׁ אֲנִ֖י נֹטֶ֣ה עָלֶ֑י/ךָ בְּחַר לְ/ךָ֛ אַחַ֥ת מֵ/הֵ֖נָּה וְ/אֶֽעֱשֶׂה לָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/010.yaml
  text: 'Go and speak to David[a], saying, ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: sw
  text: 'Nenda ukazungumze na Daudi, ukisema, “Yahweh asema hivi: Ninaweka mambo matatu mbele yako.[a] Jichagulie moja kati ya hayo, nami nitakutendea hilo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, “Matatu ninayanyosha juu yako.” Kiebrania hakitaji kitu kinachohesabiwa; muktadha unaonyesha kwamba Yahweh anaweka mambo matatu mbele ya Daudi ili achague moja.
    reason: Kufafanua usemi halisi na nomino iliyoachwa bila kutajwa katika Kiebrania.
lexical_decisions:
- source_word: לֵךְ
  choice: Nenda
  rationale: Ni amri ya moja kwa moja ya kwenda, katika nafsi ya pili umoja.
- source_word: וְדִבַּרְתָּ אֶל דָּוִיד
  choice: ukazungumze na Daudi
  rationale: Kitenzi דבר pamoja na אֶל hapa kina maana ya kuzungumza na mtu; muundo wa “uka-” unaunganisha kwa kawaida amri hii na “Nenda.”
- source_word: לֵאמֹר
  choice: ukisema
  rationale: Ni kiingizio cha kawaida cha maneno yanayonukuliwa moja kwa moja.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh asema hivi
  rationale: Inahifadhi mtindo wa ujumbe wa kinabii na kulitaja jina la Mungu lililo katika maandishi ya Kiebrania.
- source_word: שָׁלֹושׁ אֲנִי נֹטֶה עָלֶיךָ
  choice: Ninaweka mambo matatu mbele yako
  rationale: Kiebrania hakitaji nomino inayohesabiwa. “Mambo” ni kijalizo kisichoainisha sana, huku “mbele yako” kikitoa maana ya chaguo zinazowasilishwa bila kuficha usemi halisi unaoelezwa katika tanbihi.
- source_word: בְּחַר לְךָ אַחַת מֵהֵנָּה
  choice: Jichagulie moja kati ya hayo
  rationale: “Jichagulie” huonyesha nguvu ya לְךָ, yaani Daudi achague mwenyewe; “moja kati ya hayo” ni usemi wa kawaida wa sehemu kutoka katika matatu.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: nami nitakutendea hilo
  rationale: Muktadha unaonyesha jambo litakalompata Daudi, hivyo “nitakutendea” hufaa kuliko “nitakufanyia,” ambalo lingeweza kusikika kama tendo la kumfaidi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina la agano יְהוָה; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nomino isiyotajwa baada ya “matatu”
  choice: mambo matatu
  alternative: hukumu tatu / mapigo matatu / machaguo matatu
  rationale: Kiebrania hakitaji wazi mambo hayo ni nini. “Mambo” huhifadhi kutokubainishwa huko, tofauti na “hukumu,” “mapigo,” au “machaguo,” ambazo zingefasiri mapema.
- issue: Maana ya וְאֶעֱשֶׂה לָּךְ
  choice: nitakutendea hilo
  alternative: nitakufanyia hilo / nitalileta juu yako
  rationale: Kiambishi לָּךְ kinaweza kumaanisha “kwako,” “kwa ajili yako,” au katika muktadha huu “juu yako.” Tafsiri iliyochaguliwa inaonyesha athari kwa Daudi bila kuongeza maelezo ya aina ya adhabu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ukazungumze” na “ukisema” huleta mtiririko wa kawaida wa maagizo, na “Jichagulie” huonyesha uwajibikaji binafsi bila kuwa lugha nzito.
