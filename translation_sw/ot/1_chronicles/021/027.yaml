  text: And Yahweh spoke to the angel[b][a], and he returned his sword to its sheath.
translation:
  language: sw
  text: Ndipo Yahweh akamwambia malaika, naye akaurudisha upanga wake katika ala yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania, badala ya kulibadili kuwa cheo.
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Kitenzi אמר kimsingi humaanisha ‘kusema’; pamoja na לַמַּלְאָךְ, ‘akamwambia malaika’ ni Kiswahili cha kawaida na hakiongezi maana maalumu ya ‘kuamuru’ ambayo haijaelezwa wazi.
- source_word: לַמַּלְאָךְ
  choice: malaika
  rationale: Ingawa מַלְאָךְ pia inaweza kumaanisha ‘mjumbe,’ katika muktadha huu ni kiumbe wa mbinguni mwenye upanga, hivyo ‘malaika’ ndiyo maana inayofaa.
- source_word: וַיָּשֶׁב
  choice: akaurudisha
  rationale: Hifili ya שוב ina maana ya kusababisha kitu kirudi au kukirudisha; ‘akaurudisha’ huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: חַרְבּוֹ
  choice: upanga wake
  rationale: Kiambishi cha umilikaji kinarejelea upanga wa malaika katika muktadha wa karibu.
- source_word: אֶל נְדָנָהּ
  choice: alani mwake
  rationale: נְדָן ni ala au kifuniko cha kuwekea upanga. ‘Alani mwake’ ni usemi mfupi na wa asili unaoonyesha upanga kurudishwa ndani ya ala yake.
theological_decisions:
- issue: Kiima cha וַיָּשֶׁב (‘akaurudisha’)
  choice: Malaika ndiye anayeueleweka kuwa aliurudisha upanga wake.
  alternative: Yahweh ndiye aliyeurudisha upanga, au ndiye aliyesababisha urudi kwa amri yake.
  rationale: Malaika ndiye mtajwa wa karibu, na ‘upanga wake’ unaelekeza kwa malaika mwenye upanga katika simulizi. Kiswahili kinaacha rejeo la ‘naye’ lieleweke kutokana na muktadha bila kuongeza ufafanuzi usiokuwapo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo wa simulizi ‘Ndipo … aka- … naye aka-’ unahifadhi mtiririko wa vitenzi vya Kiebrania bila kuwa mgumu.
