review_pass:
  verdict: revise
  source_fidelity: Draft accurately represents Ornan's invitation and the three items supplied for the sacrifice. However, the two Hebrew perfect verbs נָתַתִּי are best represented here by completed-offer wording, not the present-tense "ninakupa." The purpose phrase for the threshing implements should state that they are for use as firewood without the potentially awkward or optative "viwe kuni."
  naturalness: The register is suitably dignified and modern. "Jitwalie," "Tazama," and "bwana wangu, mfalme" are natural in a formal biblical narrative. "Vyombo vya kupuria vitumike kama kuni" clearly conveys the contextual function of the implements.
  terminology: '"Ng’ombe," "sadaka za kuteketezwa," "vyombo vya kupuria," and "sadaka ya nafaka" are appropriate Standard East African Swahili renderings. Footnote b is revised because the Hebrew term may denote cattle broadly or oxen specifically, but does not itself mean working bulls.'
  issues:
  - severity: medium
    issue: The repeated "Ninakupa" renders completed Hebrew perfect verbs as present-tense giving.
    rationale: נָתַתִּי occurs both in the itemized offer and in the summary. "Nimetoa" preserves the completed, comprehensive offer while allowing the recipient to be understood from context.
  - severity: low
    issue: '"Vyombo vya kupuria viwe kuni" is less idiomatic and may sound like a wish.'
    rationale: The Hebrew means that the threshing implements are supplied for wood/fuel. "Vitumike kama kuni" expresses this purpose naturally and clearly.
  - severity: low
    issue: Footnote b over-specifies one alternative as work bulls.
    rationale: בָּקָר can be collective cattle or, contextually, oxen; the lexical alternative should not add an unsupported functional qualification.
  revised_text: Ornani akamwambia Daudi, “Jitwalie, na bwana wangu, mfalme, afanye lile analoona kuwa jema.[a] Tazama, nimetoa ng’ombe kwa ajili ya sadaka za kuteketezwa,[b] vyombo vya kupuria vitumike kama kuni,[c] na ngano kwa ajili ya sadaka ya nafaka.[d] Nimetoa vyote.”
