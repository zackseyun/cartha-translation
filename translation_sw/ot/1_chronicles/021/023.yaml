  text: וַ/יֹּ֨אמֶר אָרְנָ֤ן אֶל דָּוִיד֙ קַֽח לָ֔/ךְ וְ/יַ֛עַשׂ אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ הַ/טּ֣וֹב בְּ/עֵינָ֑י/ו רְאֵה֩ נָתַ֨תִּי הַ/בָּקָ֜ר לָֽ/עֹל֗וֹת וְ/הַ/מּוֹרִגִּ֧ים לָ/עֵצִ֛ים וְ/הַ/חִטִּ֥ים לַ/מִּנְחָ֖ה הַ/כֹּ֥ל נָתָֽתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/023.yaml
  text: And Ornan said to David, “Take it for yourself, and let my lord the king do what is good in his eyes. See, I have given the cattle for burnt offerings, the threshing sledges for wood, and the wheat for the grain offering. I have given it all.”
translation:
  language: sw
  text: Ornani akamwambia Daudi, “Jitwalie, na bwana wangu, mfalme, afanye lile analoona kuwa jema.[a] Tazama, nimetoa ng’ombe kwa ajili ya sadaka za kuteketezwa,[b] vyombo vya kupuria vitumike kama kuni,[c] na ngano kwa ajili ya sadaka ya nafaka.[d] Nimetoa vyote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, “afanye lililo jema machoni pake,” yaani, afanye analoona linafaa.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza kumaanisha ng’ombe kwa ujumla au, kwa maana mahsusi zaidi, maksai.
    reason: lexical_alternative
  - marker: c
    text: Yaani, vyombo hivyo vya kupuria vitumike kama kuni za kuchomea sadaka.
    reason: cultural_note
  - marker: d
    text: Neno hili pia linaweza kutafsiriwa “sadaka” au “sadaka ya heshima”; katika muktadha wa dhabihu kwa kawaida humaanisha sadaka ya nafaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לָךְ
  choice: Jitwalie
  rationale: Kauli hii inaunganisha amri ya ‘chukua’ na wazo la kujitwalia kwa matumizi ya Daudi; ni fupi na ya asili katika Kiswahili.
- source_word: וְיַעַשׂ אֲדֹנִי הַמֶּלֶךְ הַטּוֹב בְּעֵינָיו
  choice: na bwana wangu mfalme afanye lile analoona kuwa jema
  rationale: Inahifadhi ruhusa kwa mfalme kutenda kulingana na uamuzi wake, huku nahau ya Kiebrania ‘jema machoni pake’ ikitolewa kwa Kiswahili kinachoeleweka.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Hii ni salamu ya heshima kwa Daudi, si jina la Mungu; ‘bwana wangu mfalme’ inadumisha hadhi ya lugha ya kifalme.
- source_word: רְאֵה
  choice: Tazama
  rationale: Neno hili linaingiza kwa msisitizo maelezo ya Ornani na linafaa katika simulizi ya kibiblia bila kuwa la kizamani kupita kiasi.
- source_word: הַבָּקָר לָעֹלוֹת
  choice: ng’ombe kwa ajili ya sadaka za kuteketezwa
  rationale: הַבָּקָר ni jina la jumla la ng’ombe na halilazimishi kubainisha jinsia; עֹלוֹת ni istilahi ya sadaka zinazoteketezwa kabisa.
- source_word: הַמּוֹרִגִּים לָעֵצִים
  choice: vyombo vya kupuria viwe kuni
  rationale: מוֹרִגִּים ni zana za kupuria; hapa zinatolewa zitumike kama kuni za sadaka. ‘Vyombo vya kupuria’ ni wazi zaidi kwa msomaji wa kawaida kuliko jina la kifaa maalumu lisilozoeleka.
- source_word: הַחִטִּים לַמִּנְחָה
  choice: ngano kwa ajili ya sadaka ya nafaka
  rationale: Katika muktadha wa ibada, מִנְחָה kwa kawaida ni sadaka ya nafaka; ‘ngano’ inadumisha malighafi inayotajwa wazi.
- source_word: הַכֹּל נָתָתִּי
  choice: Ninakupa vyote
  rationale: Kauli ya Kiebrania inatangaza utoaji kamili; wakati uliopo wa Kiswahili unaonyesha kwa kawaida kitendo cha kutoa kinachofanywa katika usemi huu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi ya Maandiko. ‘Ornani’ na ‘Daudi’ zinafuata maumbo yaliyozoeleka katika Kiswahili cha Biblia. Muundo ni wa asili bila kuficha nahau au upana wa maana ya Kiebrania.
