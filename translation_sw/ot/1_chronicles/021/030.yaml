id: 1CH.21.30
reference: 1 Chronicles 21:30
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לֹא יָכֹ֥ל דָּוִ֛יד לָ/לֶ֥כֶת לְ/פָנָ֖י/ו לִ/דְרֹ֣שׁ אֱלֹהִ֑ים כִּ֣י נִבְעַ֔ת מִ/פְּנֵ֕י חֶ֖רֶב מַלְאַ֥ךְ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/030.yaml
  text: But David could not go before it to seek God[a], because he was terrified by the sword of the angel of Yahweh.
translation:
  language: sw
  text: Lakini Daudi hakuweza kwenda mbele yake ili kumtafuta Mungu[a], kwa sababu aliogopa sana upanga wa malaika wa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda “yake” inarejelea Hema la Yahwe huko Gibeoni; au inaweza kueleweka kuwa inamrejelea Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לֹא
  choice: Lakini ... hakuweza
  rationale: Kiunganishi kinaendeleza simulizi kwa utofauti mdogo na mstari uliotangulia; “Lakini” ni ya asili katika Kiswahili.
- source_word: יָכֹל ... לָ/לֶכֶת
  choice: hakuweza kwenda
  rationale: Muundo huu unaonyesha kutokuwa na uwezo wa kwenda, na tafsiri hii ni ya moja kwa moja na ya kawaida.
- source_word: לְ/פָנָי/ו
  choice: mbele yake
  rationale: Kiwakilishi cha Kiebrania ni cha kiume umoja na rejeo lake lina utata. “Mbele yake” huhifadhi utata huo kuliko kulazimisha “mbele ya Hema” au “mbele za Mungu.”
- source_word: לִ/דְרֹשׁ אֱלֹהִים
  choice: ili kumtafuta Mungu
  rationale: דרשׁ inapohusishwa na Mungu inaweza kujumuisha kumwendea katika ibada, sala, au kutaka mwongozo wake; “kumtafuta Mungu” huhifadhi upana huo.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hapa kinatoa sababu ya Daudi kutoweza kwenda.
- source_word: נִבְעַת
  choice: aliogopa sana
  rationale: Kitenzi kinaonyesha hofu kali au kutishwa sana; usemi huu ni wa kawaida na unaeleweka kwa wasomaji wa Kiswahili.
- source_word: מִ/פְּנֵי חֶרֶב
  choice: upanga ... ulimwogopesha sana / aliogopa sana upanga
  rationale: Kihusishi kinaonyesha chanzo cha hofu; Kiswahili cha asili kinaweza kukieleza kwa “aliogopa sana upanga.”
- source_word: מַלְאַךְ
  choice: malaika
  rationale: Katika simulizi hili anatajwa kiumbe wa mbinguni, kwa hiyo “malaika” inafaa kuliko “mjumbe.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili linawakilisha jina binafsi la Mungu badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Rejeo la kiwakilishi katika לְפָנָיו (“mbele yake”)
  choice: Kuhifadhi kiwakilishi kisichoamua rejeo katika maandishi makuu, huku tanbihi ikieleza uwezekano wa Hema huko Gibeoni.
  alternative: Kutafsiri wazi kuwa “mbele ya Hema” au kuelewa kuwa “mbele za Mungu.”
  rationale: Muktadha wa karibu unataja Hema la Yahwe huko Gibeoni, hivyo huenda kiwakilishi kinarejelea Hema; hata hivyo, umbo la Kiebrania lenyewe linaweza kueleweka kuwa linamrejelea Mungu. Tafsiri haipaswi kuondoa utata huu kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa wazi na rahisi, huku utata halisi wa kiwakilishi ukihifadhiwa na kufafanuliwa katika tanbihi.
