base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/022.yaml
  text: Then David said to Ornan, “Give me the place of the threshing floor, so that I may build on it an altar to the LORD. Give it to me for the full price, so that the plague may be stopped from upon the people.”
translation:
  language: sw
  text: Ndipo Daudi akamwambia Ornani, “Nipe mahali pa uwanja wa kupuria nafaka, ili nijenge hapo madhabahu kwa BWANA. Nipe kwa bei kamili, ili tauni ikome kuwakumba watu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְקוֹם הַגֹּרֶן
  choice: mahali pa uwanja wa kupuria nafaka
  rationale: Neno מָקוֹם ni ‘mahali,’ na גֹּרֶן ni eneo la wazi ambako nafaka hupurwa; tafsiri hii ni wazi kwa msomaji wa Kiswahili cha sasa.
- source_word: בְּכֶסֶף מָלֵא
  choice: kwa bei kamili
  rationale: Kirai hiki kinamaanisha malipo yote bila punguzo; ‘bei kamili’ ni Kiswahili cha kawaida na hudumisha mkazo wa Daudi kwamba hatapokea eneo hilo bure.
- source_word: וְתֵעָצַר
  choice: ili ... izuiliwe isiendelee
  rationale: Kitenzi עצר hapa huonyesha kuzuiwa au kusimamishwa kwa tauni; muundo huu unaeleza kwa asili kusudi linalotolewa na Daudi.
- source_word: מֵעַל הָעָם
  choice: isiendelee kuwapata watu
  rationale: Kihalisi ni ‘kutoka juu ya watu,’ lakini katika muktadha wa tauni kirai kinaonyesha kuondolewa kwa janga lililokuwa likiwakumba watu.
theological_decisions:
- issue: Jina la agano יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ kwa herufi kubwa linafuata desturi pana ya Biblia za Kiswahili ya kuwakilisha tetragramatoni bila kuingiza matamshi mahususi katika maandishi.
- issue: Uhusiano wa madhabahu na kusimamishwa kwa tauni
  choice: ili tauni izuiliwe isiendelee kuwapata watu
  alternative: na tauni itazuiliwa kutoka juu ya watu
  rationale: וְ inaweza kuendeleza matokeo au kusudi katika ombi hili. ‘Ili’ hudumisha mantiki ya kauli ya Daudi bila kudai kwamba tendo lenyewe lilifanya kazi kiotomatiki au bila uhusiano na agizo la Mungu katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kupuria nafaka’ limetumiwa badala ya ‘kupuria’ peke yake ili maana iwe wazi kwa wasomaji wa kawaida. Hakuna tanbihi zinazohitajika kwa aya hii.
