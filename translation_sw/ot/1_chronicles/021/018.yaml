  text: וּ/מַלְאַ֧ךְ יְהוָ֛ה אָמַ֥ר אֶל גָּ֖ד לֵ/אמֹ֣ר לְ/דָוִ֑יד כִּ֣י יַעֲלֶ֣ה דָוִ֗יד לְ/הָקִ֤ים מִזְבֵּ֨חַ֙ לַ/יהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבֻסִֽי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/018.yaml
  text: And the angel of Yahweh said to Gad to tell David that David should go up to set up an altar to Yahweh on the threshing floor of Ornan the Jebusite[a][b].
translation:
  language: sw
  text: Malaika wa Yahweh[a] akamwambia Gadi amwambie Daudi kwamba Daudi apande[b] ili asimamishe madhabahu kwa Yahweh katika uwanja wa kupuria wa Ornani, Myebusi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mjumbe wa Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Au, “lazima apande” au “anapaswa kupanda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: Malaika wa Yahweh
  rationale: מַלְאַךְ inaweza kumaanisha “mjumbe” au “malaika”; katika muktadha huu ni kiumbe wa mbinguni, hivyo “malaika” ndiyo tafsiri ya kawaida, huku tanbihi ikihifadhi maana nyingine.
- source_word: אָמַר אֶל גָּד לֵאמֹר לְדָוִיד
  choice: akamwambia Gadi amwambie Daudi
  rationale: Muundo huu unaonyesha kwamba malaika alimpa Gadi ujumbe wa kumfikishia Daudi; tafsiri hii ni ya asili katika Kiswahili na inahifadhi urudiaji wa tendo la kusema.
- source_word: כִּי יַעֲלֶה דָוִיד
  choice: kwamba Daudi apande
  rationale: Kitenzi עלה kimetafsiriwa moja kwa moja kuwa “apande,” na hali ya utegemezi “apande” inaonyesha agizo bila kulifanya liwe kali kuliko Kiebrania.
- source_word: לְהָקִים מִזְבֵּחַ
  choice: na kumjengea ... madhabahu
  rationale: הקים humaanisha kusimamisha au kuanzisha; kwa madhabahu, “kujenga” ni Kiswahili cha kawaida. Kiunganishi “na” kinaonyesha kwamba kupanda kunaelekea kwenye tendo la kujenga madhabahu.
- source_word: לַיהוָה
  choice: kumjengea Yahweh
  rationale: Kiambishi ל־ kinaonyesha kwamba madhabahu ni kwa ajili ya Yahweh; “kumjengea” huwasilisha uhusiano huo kwa Kiswahili cha asili.
- source_word: בְּגֹרֶן אָרְנָן הַיְבֻסִי
  choice: katika uwanja wa kupuria wa Ornani, Myebusi
  rationale: גֹרֶן ni mahali pa kupuria nafaka. Jina אָרְנָן limetoholewa kuwa “Ornani,” na הַיְבֻסִי kuwa “Myebusi.”
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יְהוָה. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Nguvu ya agizo katika יַעֲלֶה
  choice: apande
  alternative: lazima apande; anapaswa kupanda
  rationale: Hali ya utegemezi ya Kiswahili huonyesha maelekezo yaliyotolewa kupitia Gadi bila kuamua kimya-kimya kama yanasisitiza wajibu mkali au mpango uliowekwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. “Uwanja wa kupuria” ni usemi unaoeleweka kwa eneo la kupuria nafaka; “Myebusi” ni umbo la kawaida la jina la mtu wa taifa la Wayebusi.
