  text: וַ/יִּתֵּ֧ן יְהוָ֛ה דֶּ֖בֶר בְּ/יִשְׂרָאֵ֑ל וַ/יִּפֹּל֙ מִ/יִּשְׂרָאֵ֔ל שִׁבְעִ֥ים אֶ֖לֶף אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/014.yaml
  text: So Yahweh sent a plague on Israel[a], and seventy thousand men of Israel fell.
translation:
  language: sw
  text: Basi Yahwe akaleta tauni juu ya Israeli[a], na wanaume elfu sabini wa Israeli wakaanguka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pigo la ugonjwa.” Neno la Kiebrania linamaanisha mlipuko hatari wa ugonjwa, mara nyingi katika muktadha wa hukumu ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: וַיִּתֵּן
  choice: akaleta
  rationale: Kitenzi kwa msingi ni “akatoa/akaweka,” lakini pamoja na דֶּבֶר maana ya kawaida katika Kiswahili ni kwamba Yahwe alileta tauni; usemi huu unahifadhi utendaji wake wa moja kwa moja.
- source_word: דֶּבֶר
  choice: tauni
  rationale: Neno hili linamaanisha mlipuko hatari wa ugonjwa, mara nyingi ukiwa hukumu ya Mungu; “tauni” ni neno fupi na linaloeleweka katika Kiswahili cha Biblia.
- source_word: בְּיִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: Kirai hiki kinaonyesha tauni iliyowajia watu wa Israeli; “juu ya Israeli” kinadumisha taswira ya jambo lililowafikia.
- source_word: וַיִּפֹּל
  choice: wakaanguka
  rationale: Hii inahifadhi nahau ya Kiebrania ya kuanguka kwa maana ya kufa katika hukumu bila kuifafanua kupita kiasi.
- source_word: מִיִּשְׂרָאֵל
  choice: wa Israeli
  rationale: Hueleza kwamba walianguka walikuwa sehemu ya watu wa Israeli.
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: wanaume elfu sabini
  rationale: אִישׁ imetumiwa kwa umoja wa kijumla baada ya idadi, lakini inataja wanaume; tafsiri inadumisha maelezo hayo ya kijinsia.
theological_decisions:
- issue: Utendaji wa Mungu katika hukumu
  choice: Yahwe akaleta tauni
  alternative: Yahwe akaruhusu tauni ije
  rationale: Kiebrania kinamhusisha Yahwe moja kwa moja na tendo hili, bila kitenzi kinachomaanisha “kuruhusu.” Tafsiri haipunguzi mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi “akaleta… wakaanguka” unafaa mfuatano wa matendo katika kifungu. “Tauni” ni sahihi na fupi, huku tanbihi ikifafanua upana wa neno la Kiebrania.
