base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/021.yaml
  text: When David came to Ornan[a], Ornan looked and saw David, and he went out from the threshing floor and bowed down before David with his face to the ground.
translation:
  language: sw
  text: Daudi alipofika kwa Ornani, Ornani alitazama na kumwona Daudi. Kisha akatoka katika uwanja wa kupuria, akainama kifudifudi mbele ya Daudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamsujudia Daudi.” Kiebrania kinaeleza kuinama kikamilifu, uso ukiwa umeelekea ardhini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא דָוִיד עַד אָרְנָן
  choice: Daudi alipofika kwa Ornani
  rationale: בוא pamoja na עַד hapa inaeleza Daudi kufika mahali alipokuwa Ornani; Kiswahili cha kawaida hutumia ‘kufika kwa’ mtu.
- source_word: וַיַּבֵּט אָרְנָן וַיַּרְא אֶת דָּוִיד
  choice: Ornani alitazama na kumwona Daudi
  rationale: Ufuatano wa vitenzi נבט na ראה umehifadhiwa badala ya kuunganishwa kuwa tendo moja.
- source_word: וַיֵּצֵא מִן הַגֹּרֶן
  choice: akatoka katika uwanja wa kupuria nafaka
  rationale: גורן ni sehemu ambako nafaka hupuriwa; ‘uwanja wa kupuria nafaka’ ni wazi kwa msomaji wa kawaida.
- source_word: וַיִּשְׁתַּחוּ לְדָוִיד
  choice: akamsujudia Daudi
  rationale: השתחוה hapa inaonyesha kuinama sana mbele ya mfalme. ‘Kumsujudia’ huwasilisha tendo la kimwili bila kutumia neno ‘kuabudu,’ ambalo lingedokeza ibada ya Mungu.
- source_word: אַפַּיִם אָרְצָה
  choice: kifudifudi mpaka chini
  rationale: Nahau hii ya Kiebrania inaeleza kusujudu kikamilifu uso ukiwa umeelekezwa ardhini; Kiswahili hiki ni cha asili na kinaweka wazi mkao huo.
theological_decisions:
- issue: Ikiwa tendo la Ornani lielezwe kwa namna inayodokeza kumwabudu Daudi
  choice: akamsujudia Daudi
  alternative: akamwabudu Daudi; akainama mbele ya Daudi
  rationale: השתחוה inaweza kumaanisha ibada au kusujudu mbele ya mkuu kulingana na muktadha. Hapa Daudi ndiye anayepewa heshima ya kifalme, kwa hiyo tafsiri inaonyesha tendo lenyewe bila kulifafanua kuwa ibada ya kimungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa kwa urahisi wa kusoma huku mfuatano wa matendo ya Kiebrania ukihifadhiwa.
