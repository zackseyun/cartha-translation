  text: Then Satan stood up against Israel and incited David to count Israel[a][b].
translation:
  language: sw
  text: Ndipo Shetani akasimama dhidi ya Israeli, akamchochea Daudi kuwahesabu Israeli[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpinzani.” Neno la Kiebrania satan linaweza kumaanisha “mpinzani” au kutumiwa kama jina au cheo “Shetani.”
    reason: lexical_alternative
  - marker: b
    text: Katika 2 Samweli 24:1, uchochezi huo unahusishwa na hasira ya BWANA dhidi ya Israeli. Mambo ya Nyakati humtaja Shetani kuwa mhusika wa moja kwa moja, hivyo maelezo hayo mawili yanaacha mvutano wa kiteolojia bila kuondolewa.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: akasimama
  rationale: Kitenzi עמד kimsingi humaanisha ‘kusimama’; hapa kinaonyesha kuchukua msimamo wa uadui na kuanzisha hatua dhidi ya Israeli.
- source_word: שָׂטָן
  choice: Shetani
  rationale: Ingawa שׂטן linaweza kumaanisha ‘mpinzani,’ katika muktadha huu linaeleweka zaidi kama jina au cheo cha kiumbe binafsi, Shetani; maana nyingine imehifadhiwa katika tanbihi.
- source_word: עַל יִשְׂרָאֵל
  choice: dhidi ya Israeli
  rationale: Kihusishi עַל katika muktadha wa uadui kinaelezwa kwa kawaida na kwa usahihi kama ‘dhidi ya.’
- source_word: וַיָּסֶת
  choice: akamchochea
  rationale: Hifili ya סות humaanisha kushawishi au kuchochea mtu afanye jambo; ‘akamchochea’ huonyesha msukumo bila kudai kwamba Daudi alilazimishwa.
- source_word: לִמְנוֹת
  choice: kuwahesabu
  rationale: Kitenzi מנה humaanisha ‘kuhesabu.’ Kiambishi ‘wa-’ kinaweka wazi kwa Kiswahili cha kawaida kwamba Israeli hapa ni watu wa taifa hilo, bila kupanua sentensi kuwa zoezi rasmi la sensa.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israeli
  rationale: Kiebrania kinasema kwa ufupi ‘Israeli’; jina hilo limehifadhiwa, huku muundo wa kitenzi cha Kiswahili ukionyesha kwamba wanaokusudiwa ni watu.
theological_decisions:
- issue: Utambulisho na maana ya שָׂטָן
  choice: Shetani kama kiumbe binafsi mwenye kupinga
  alternative: mpinzani fulani
  rationale: Neno la Kiebrania linaweza kuwa nomino ya kawaida yenye maana ya ‘mpinzani,’ lakini hapa linaelekea kutumiwa kama jina au cheo cha Shetani. Kwa kuwa utata wa kileksika ni halisi, maana nyingine imeonyeshwa katika tanbihi badala ya kufutwa.
- issue: Uhusiano na 2 Samweli 24:1
  choice: Kumwonyesha Shetani kuwa mtendaji wa karibu katika simulizi la Mambo ya Nyakati
  alternative: Kuhusisha uchochezi moja kwa moja na hasira ya BWANA kama ilivyo katika 2 Samweli 24:1
  rationale: Tafsiri haijaribu kusawazisha kimya kimya maelezo hayo mawili. Inahifadhi jinsi kila simulizi linavyowasilisha chanzo au wakala wa uchochezi, na kueleza mvutano huo katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ndipo’ linaendeleza simulizi kwa kawaida; ‘akasimama dhidi ya’ linahifadhi picha halisi ya Kiebrania, na ‘akamchochea’ ni wazi kwa msomaji wa kawaida bila kudokeza kulazimishwa.
