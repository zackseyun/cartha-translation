  text: And Yahweh spoke to Gad[a], David’s seer, saying,
translation:
  language: sw
  text: Yahwe[a] akasema na Gadi, mwonaji wa Daudi, akisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; limetafsiriwa hapa “Yahwe.”'
    reason: Ufafanuzi wa jina la Mungu katika maandishi ya Kiebrania.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akasema na
  rationale: Kitenzi דּבר pamoja na אֶל kinaonyesha tendo linalofuata katika simulizi na kumtaja anayeelekezewa maneno; “akasema na” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa moja kwa moja kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: גָּד
  choice: Gadi
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: חֹזֵה
  choice: mwonaji
  rationale: Neno hili humaanisha mtu anayepokea ufunuo kwa kuona; “mwonaji” huhifadhi tofauti yake na istilahi pana zaidi ya “nabii.”
- source_word: דָוִיד
  choice: wa Daudi
  rationale: Muundo wa Kiebrania unaonyesha uhusiano wa mwonaji huyo na Daudi; “mwonaji wa Daudi” ni wa asili katika Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Muundo huu wa Kiebrania hutanguliza maneno ya moja kwa moja; “akisema” huhifadhi muundo huo rasmi bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina la agano moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo; tahajia hiyo ni ya kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “akisema” umehifadhiwa kwa sababu mstari huu ni utangulizi wa maneno ya moja kwa moja katika mstari unaofuata.
