  text: So Gad came to David and said to him[a], “Thus says Yahweh, ‘Choose for yourself—’”
translation:
  language: sw
  text: 'Basi Gadi akaja kwa Daudi, akamwambia, “Yahweh asema hivi: ‘Jichagulie[a]—’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana halisi zaidi, “Pokea kwa ajili yako—”; katika muktadha amri hiyo ina maana ya kuchagua kati ya mambo yatakayotajwa katika mstari unaofuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaja
  rationale: Kitenzi בוא katika simulizi kinaonyesha mwendo wa kumfikia Daudi; “akaja” ni cha kawaida na cha asili katika Kiswahili.
- source_word: גָד
  choice: Gadi
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: אֶל דָּוִיד
  choice: kwa Daudi
  rationale: Kirai hiki kinaonyesha mwendo kuelekea kwa mtu; “kwa Daudi” ni Kiswahili cha kawaida.
- source_word: וַיֹּאמֶר לוֹ
  choice: akamwambia
  rationale: אמר pamoja na kiwakilishi cha yule anayeambiwa imetafsiriwa kwa njia ya asili kama “akamwambia,” bila kuongeza habari nyingine.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Hii ni fomula ya kawaida ya ujumbe wa kinabii; wakati wa sasa unafaa kwa kutangaza ujumbe wa moja kwa moja unaotoka kwa Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa kutoholewa badala ya kubadilishwa kuwa cheo.
- source_word: קַבֶּל
  choice: Jichagulie
  rationale: Maana ya msingi ni kupokea au kujikubalia, lakini katika muktadha Daudi anaagizwa kuchagua mojawapo ya mambo yatakayoorodheshwa katika mstari unaofuata. Maana halisi zaidi imehifadhiwa katika tanbihi.
- source_word: לָךְ
  choice: -ji- katika “Jichagulie”
  rationale: Kiambishi cha kujirejelea kinaonyesha kwamba Daudi achague kwa ajili yake mwenyewe, kwa Kiswahili cha asili na kifupi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu lenye herufi nne; “Yahweh” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umetiririshwa kwa viambishi vya mfululizo, huku fomula ya kinabii na mkato wa mwisho wa mstari vikihifadhiwa.
