base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/004.yaml
  text: But the king’s word prevailed against Joab[a]. So Joab went out and went throughout all Israel[b], and he came to Jerusalem.
translation:
  language: sw
  text: Lakini neno la mfalme likamzidi Yoabu[a]. Basi Yoabu akaondoka, akapitia Israeli yote[b], kisha akaja Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “agizo la mfalme likawa na nguvu kuliko Yoabu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akasafiri kotekote katika Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבַר הַמֶּלֶךְ
  choice: Lakini neno la mfalme
  rationale: Neno “neno” linahifadhi tamathali ya Kiebrania דָּבָר, ambayo katika muktadha huu ni agizo lenye mamlaka; “Lakini” linaonyesha tofauti na pingamizi la Yoabu katika mstari uliotangulia.
- source_word: חָזַק עַל
  choice: likamshinda Yoabu
  rationale: Nahau hii ina maana ya kuwa na nguvu dhidi ya mtu au kumzidi. “Likamshinda” ni Kiswahili cha kawaida kinachoonyesha kwamba neno la mfalme lilizidi upinzani wa Yoabu bila kufafanua zaidi ya maandishi.
- source_word: וַיֵּצֵא יוֹאָב
  choice: Basi Yoabu akaondoka
  rationale: יָצָא kwa kawaida ni kutoka au kuondoka. “Basi” linaonyesha matokeo ya agizo la mfalme kushinda upinzani wa Yoabu.
- source_word: וַיִּתְהַלֵּךְ בְּכָל יִשְׂרָאֵל
  choice: akazunguka katika Israeli yote
  rationale: Umbo la hitpael la הָלַךְ hapa linaashiria kwenda huku na huku au kusafiri katika eneo lote. “Akazunguka” ni la asili na linafaa kwa safari hii bila kuingiza maelezo yasiyotajwa.
- source_word: כָּל יִשְׂרָאֵל
  choice: Israeli yote
  rationale: Hili linawasilisha kwa uwazi upeo kamili wa taifa unaodokezwa na kifungu cha Kiebrania.
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: kisha akaja Yerusalemu
  rationale: בּוֹא humaanisha kuja au kuingia. Ingawa muktadha unaweza kudokeza kurudi, “akaja” linahifadhi usemi wa maandishi ya Kiebrania.
