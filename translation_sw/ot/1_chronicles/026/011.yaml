translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. Kiunganishi 'na' kabla ya jina la mwisho kinafanya orodha isomeke kwa kawaida; tanbihi huhifadhi uwezekano wa maana pana ya neno la Kiebrania kwa 'ndugu'.
