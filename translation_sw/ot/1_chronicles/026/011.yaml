  text: חִלְקִיָּ֤הוּ הַ/שֵּׁנִי֙ טְבַלְיָ֣הוּ הַ/שְּׁלִשִׁ֔י זְכַרְיָ֖הוּ הָ/רְבִעִ֑י כָּל בָּנִ֧ים וְ/אַחִ֛ים לְ/חֹסָ֖ה שְׁלֹשָׁ֥ה עָשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/011.yaml
  text: Hilkiah the second[a], Tebaliah the third, Zechariah the fourth. All the sons and brothers of Hosah were thirteen.
translation:
  language: sw
  text: Hilkia wa pili, Tebalia wa tatu, na Zekaria wa nne. Wana wote na ndugu[a] wa Hosa walikuwa kumi na watatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au yawezekana, “jamaa wa kiume,” ikiwa neno hili linaeleweka kwa maana pana ya watu wa ukoo wa Hosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִלְקִיָּהוּ
  choice: Hilkia
  rationale: Jina la mtu limetoholewa kwa umbo linalotumiwa kwa kawaida katika Kiswahili cha Biblia.
- source_word: הַשֵּׁנִי
  choice: wa pili
  rationale: Kivumishi cha mpangilio chenye kibainishi; kimetafsiriwa kwa mpangilio wa kawaida wa Kiswahili.
- source_word: טְבַלְיָהוּ
  choice: Tebalia
  rationale: Jina la mtu limetoholewa kwa namna ya asili na inayoeleweka katika Kiswahili.
- source_word: הַשְּׁלִשִׁי
  choice: wa tatu
  rationale: Namba ya mpangilio imehifadhiwa sambamba na majina mengine katika orodha.
- source_word: זְכַרְיָהוּ
  choice: Zekaria
  rationale: Jina la mtu limetoholewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: הָרְבִעִי
  choice: wa nne
  rationale: Namba ya mpangilio imetafsiriwa moja kwa moja na kwa Kiswahili cha kawaida.
- source_word: כָּל
  choice: wote
  rationale: Neno la kujumlisha limetolewa kwa upatanisho wa kawaida na kundi la watu.
- source_word: בָּנִים
  choice: wana
  rationale: Kiebrania kinataja wana wa kiume, si watoto kwa ujumla; 'wana' huhifadhi maana hiyo.
- source_word: וְאַחִים
  choice: na ndugu
  rationale: '''Ndugu'' ni tafsiri ya kawaida ya uhusiano huu katika Kiswahili, ingawa katika muktadha wa ukoo inaweza kujumuisha jamaa wa kiume kwa maana pana zaidi.'
- source_word: לְחֹסָה
  choice: wa Hosa
  rationale: Kiambishi kinaonyesha uhusiano na Hosa; umbo la kimilikishi ni la asili katika Kiswahili.
- source_word: שְׁלֹשָׁה עָשָׂר
  choice: kumi na watatu
  rationale: Idadi imetolewa kwa upatanisho wa ngeli unaofaa kwa watu.
