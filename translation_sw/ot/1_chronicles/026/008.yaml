  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa ili jumla ya watu sitini na wawili iwe wazi; 'huduma' imeachwa bila kuongezewa 'ya hekalu' kwa kuwa Kiebrania hakutaji hekalu moja kwa moja katika mstari huu.
