base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/008.yaml
  text: All these were from the sons of Obed-edom—they and their sons and their brothers, able men with strength for the service—sixty-two belonging to Obed-edom.
translation:
  language: sw
  text: Wote hawa walitokana na wana wa Obed-edom—wao, wana wao, na ndugu zao[a]—wanaume wenye uwezo na nguvu kwa ajili ya huduma[b]. Jumla ya watu wa familia ya Obed-edom ilikuwa sitini na wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa zao wa kiume,” ikiwa neno hilo linaeleweka kwa maana pana ya watu wa ukoo.
    reason: lexical_alternative
  - marker: b
    text: “Wanaume wenye uwezo” hutafsiri usemi wa Kiebrania unaoweza pia kumaanisha “wanaume mashujaa” au “wanaume hodari.” Hapa inaelekea kusisitiza uwezo na nguvu zinazofaa kwa huduma.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי עֹבֵד אֱדֹם
  choice: miongoni mwa wana wa Obed-edom
  rationale: מן pamoja na 'wana' huonyesha ushirika katika ukoo au kundi. 'Miongoni mwa' ni Kiswahili cha kawaida na huhifadhi maana ya kwamba watu hawa walitoka katika ukoo wa Obed-edom.
- source_word: הֵמָּה וּבְנֵיהֶם וַאֲחֵיהֶם
  choice: wao, wana wao na ndugu zao
  rationale: Orodha hii inawajumuisha watu wenyewe, wana wao, na ndugu zao wa kiume. 'Ndugu' huhifadhi maana ya msingi ya אחים bila kuipanua kimya kimya kuwa jamaa wote.
- source_word: אִישׁ חַיִל
  choice: watu hodari
  rationale: Katika muktadha wa huduma ya walinzi wa malango, usemi huu unaonyesha uwezo, uimara na kufaa kwa wajibu, si ushujaa wa kivita pekee.
- source_word: בַּכֹּחַ לַעֲבֹדָה
  choice: wenye nguvu za kufanya huduma
  rationale: Tafsiri hii huhifadhi wazo la nguvu zinazowawezesha kutekeleza wajibu huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: שִׁשִּׁים וּשְׁנַיִם לְעֹבֵד אֱדֹם
  choice: Jumla ya watu wa Obed-edom ilikuwa sitini na wawili
  rationale: לְ ya mwisho huonyesha uhusiano na kundi la Obed-edom na sentensi inatoa jumla yao. Muundo huu unaweka wazi hesabu hiyo kwa Kiswahili bila kubadili maana.
