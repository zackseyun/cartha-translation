base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/017.yaml
  text: On the east were six Levites; on the north[a], four a day; on the south, four a day; and at the storehouses, two by two.
translation:
  language: sw
  text: Upande wa mashariki walikuwa Walawi sita; upande wa kaskazini, wanne kila siku; upande wa kusini, wanne kila siku; na kwenye maghala[a], wawili wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania Asuppim; huenda neno hili ni jina la mahali maalumu au linarejelea mkusanyiko wa vyumba, badala ya kumaanisha maghala kwa ujumla.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמִּזְרָח
  choice: upande wa mashariki
  rationale: Kirai chenye kihusishi kinaonyesha eneo au upande wa mgawo; tafsiri hii ni ya kawaida katika orodha ya maeneo ya ulinzi.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Linataja walinzi wa malango wa ukoo wa Lawi katika muktadha huu.
- source_word: שִׁשָּׁה
  choice: sita
  rationale: Ni idadi ya Walawi waliowekwa upande wa mashariki.
- source_word: לַצָּפוֹנָה
  choice: upande wa kaskazini
  rationale: Ni usemi wa mahali unaolingana na mashariki na kusini.
- source_word: לַיּוֹם
  choice: kila siku
  rationale: Katika muktadha wa mgawo wa kazi, kirai hiki kinaonyesha idadi iliyohudumu kwa siku.
- source_word: אַרְבָּעָה
  choice: wanne
  rationale: Nomino inayohesabiwa ni watu, hivyo umbo la ngeli ya watu limetumiwa.
- source_word: לַנֶּגְבָּה
  choice: upande wa kusini
  rationale: Ni usemi wa mahali uliotafsiriwa sambamba na pande nyingine.
- source_word: וְלָאֲסֻפִּים
  choice: na kwenye maghala[a]
  rationale: Neno hilo huenda linamaanisha vyumba vya kuhifadhia au eneo maalumu la majengo ya hekalu; “maghala” linaeleweka kwa urahisi, huku uwezekano wa kuwa jina maalumu ukihifadhiwa katika tanbihi.
- source_word: שְׁנַיִם שְׁנָיִם
  choice: wawili wawili
  rationale: Kurudiwa kwa namba kunaonyesha mgawo wa jozi; huu ni usemi wa kawaida na wazi wa Kiswahili.
