  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Mpangilio sambamba wa pande umehifadhiwa, na tofauti ya kwamba “kila siku” haipo katika kifungu cha mashariki imeachwa kama ilivyo katika Kiebrania.
