base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/029.yaml
  text: For the Izharites[a], Chenaniah and his sons were assigned to the outside work over Israel, as officers and judges.
translation:
  language: sw
  text: Kwa wazao wa Ishari, Kenania na wanawe walipewa kazi ya nje[a] ya kusimamia Israeli, wakiwa maafisa na waamuzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, majukumu yaliyokuwa nje ya huduma kuu ya patakatifu; yaelekea yalihusu shughuli za utawala na utoaji wa hukumu miongoni mwa Israeli.
    reason: Hufafanua kwa tahadhari maana inayowezekana ya “kazi ya nje,” bila kuifanya tafsiri kuu kuwa mahususi zaidi kuliko Kiebrania.
lexical_decisions:
- source_word: לַיִּצְהָרִי
  choice: Kwa wazao wa Ishari
  rationale: Kiambishi לְ pamoja na jina la ukoo kinaanzisha kundi katika orodha; Kiswahili cha asili hutumia “Kwa wazao wa Ishari” kwa uwazi.
- source_word: כְּנַנְיָהוּ
  choice: Kenania
  rationale: Jina limetoholewa kwa mfumo unaoeleweka katika Kiswahili na unaokaribia umbo la Kiebrania.
- source_word: וּבָנָיו
  choice: na wanawe
  rationale: בנים katika muktadha huu wa ukoo humaanisha wana wa kiume; “wanawe” ni sahihi na ya kawaida.
- source_word: לַמְּלָאכָה הַחִיצוֹנָה
  choice: walipewa kazi ya nje
  rationale: מְלָאכָה ni kazi au jukumu, na הַחִיצוֹנָה ni la nje. Kitenzi “walipewa” kinaeleza mgawo unaodokezwa na orodha bila kubadili maana.
- source_word: עַל יִשְׂרָאֵל
  choice: kwa ajili ya Israeli
  rationale: Ingawa עַל inaweza kuonyesha mamlaka juu ya watu, hapa “kwa ajili ya Israeli” ni Kiswahili cha kawaida kinachoeleza eneo la huduma bila kudokeza utawala mkuu kupita kiasi.
- source_word: לְשֹׁטְרִים
  choice: wawe maafisa
  rationale: שֹׁטְרִים ni watendaji au maafisa wa utawala, si lazima polisi; “maafisa” huhifadhi maana hiyo pana.
- source_word: וּלְשֹׁפְטִים
  choice: na waamuzi
  rationale: Neno hili hutaja watu waliotekeleza wajibu wa kutoa hukumu; “waamuzi” ni tafsiri ya moja kwa moja na inayoeleweka.
theological_decisions:
- issue: Mahali na aina ya “kazi ya nje”
  choice: Kudumisha usemi “kazi ya nje” bila kuifafanua ndani ya mstari
  alternative: Kuitafsiri wazi kuwa kazi nje ya huduma ya patakatifu
  rationale: Kiebrania hakitaji patakatifu moja kwa moja. Muktadha unaelekea kwenye majukumu nje ya huduma yake ya ndani, lakini tafsiri kuu haipaswi kuondoa upana huo wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo umewekwa mfupi ili kuakisi orodha ya majukumu ya Walawi.
