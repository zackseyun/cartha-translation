  variant: Standard East African Swahili
source:
  edition: WLC
  text: ה֧וּא שְׁלֹמ֣וֹת וְ/אֶחָ֗י/ו עַ֣ל כָּל אֹצְר֤וֹת הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר הִקְדִּ֜ישׁ דָּוִ֣יד הַ/מֶּ֗לֶךְ וְ/רָאשֵׁ֧י הָ/אָב֛וֹת לְ/שָׂרֵֽי הָ/אֲלָפִ֥ים וְ/הַ/מֵּא֖וֹת וְ/שָׂרֵ֥י הַ/צָּבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/026.yaml
  text: Shelomoth and his brothers were over all the treasuries of the holy things that King David[a], the heads of the fathers’ houses, the commanders of thousands and of hundreds[b], and the commanders of the army had dedicated.
translation:
  language: sw
  text: Shelomothi na ndugu zake walikuwa wasimamizi wa hazina zote za vitu vitakatifu[a] ambavyo Mfalme Daudi, wakuu wa koo[b], makamanda wa maelfu na wa mamia, na makamanda wa jeshi walikuwa wameviweka wakfu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vitu vilivyowekwa wakfu” au “matoleo yaliyowekwa wakfu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “wakuu wa nyumba za baba,” istilahi ya kiutawala iliyotegemea koo.
    reason: cultural_note
lexical_decisions:
- source_word: הוּא שְׁלֹמוֹת וְאֶחָיו
  choice: Shelomothi na ndugu zake ndio waliokuwa
  rationale: Kiwakilishi cha umoja הוּא kinatangulia mhusika aliyetajwa pamoja na ndugu zake. Kiswahili cha kawaida hutumia kiima cha wingi na ‘ndio waliokuwa’ ili kuonyesha mkazo uliopo bila kudumisha upatanisho wa umoja usio wa kawaida.
- source_word: עַל כָּל אֹצְרוֹת
  choice: wasimamizi wa hazina zote
  rationale: Katika muktadha wa kiutawala, עַל huonyesha usimamizi au mamlaka. ‘Wasimamizi wa’ ni ya asili kwa Kiswahili, nayo אֹצְרוֹת hapa ni hazina za taasisi ambamo vitu vilihifadhiwa.
- source_word: הַקֳּדָשִׁים
  choice: vitu vitakatifu
  rationale: Hili ni tafsiri ya moja kwa moja ya vitu vilivyotengwa kuwa vitakatifu; kitenzi kinachofuata kinaeleza kwamba viliwekwa wakfu. Maana mbadala imehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: ambavyo ... walikuwa wameviweka wakfu
  rationale: Hifili ya קדשׁ humaanisha kutenga au kuweka wakfu. Upatanisho wa wingi unaonyesha kwa kawaida kwamba watu wote waliotajwa walishiriki kuviweka wakfu.
- source_word: דָּוִיד הַמֶּלֶךְ
  choice: Mfalme Daudi
  rationale: Mpangilio huu wa cheo na jina ni wa kawaida katika Kiswahili.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: wakuu wa koo
  rationale: Hii ni istilahi ya kijamaa na kiutawala. ‘Wakuu wa koo’ hutoa maana yake kwa Kiswahili cha sasa bila kutumia tafsiri neno kwa neno isiyo ya asili.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: makamanda wa maelfu na wa mamia
  rationale: שָׂרִים hapa ni makamanda au maafisa; ‘maelfu’ na ‘mamia’ huhifadhi ukubwa wa vikosi vya kiutawala vya maandishi ya Kiebrania.
- source_word: שָׂרֵי הַצָּבָא
  choice: makamanda wa jeshi
  rationale: צָבָא katika muktadha huu ni jeshi la kijeshi, na si jeshi la mbinguni.
theological_decisions:
- issue: Wigo wa watu walioviweka vitu vitakatifu wakfu
  choice: Mfalme Daudi pamoja na makundi yote yanayofuata wanaeleweka kuwa waliweka vitu hivyo wakfu.
  alternative: Ni Daudi peke yake aliyeviweka wakfu, huku makundi yanayofuata yakihusishwa kwa namna nyingine.
  rationale: Muundo wa Kiebrania unaunganisha Daudi na makundi yanayofuata kwa וְ zinazojirudia. Ingawa kitenzi cha Kiebrania kiko katika umoja, orodha nzima inaeleweka kwa kawaida kuwa kiima cha pamoja; tafsiri ya Kiswahili hutumia wingi kwa upatanisho wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Ndio waliokuwa wasimamizi’ huepuka muundo mgumu wa Kiebrania huku ikihifadhi mkazo, na ‘wakuu wa koo’ hutafsiri istilahi ya kijamaa kwa njia ya asili.
