base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/001.yaml
  text: 'For the divisions of the gatekeepers: of the Korahites[a], Meshelemiah son of Kore, from the sons of Asaph.'
translation:
  language: sw
  text: 'Kuhusu migawanyo ya walinda malango: Kwa Wakora: Meshelemia mwana wa Kore, kutoka miongoni mwa wana wa Asafu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa migawanyo ya walinda malango.” Kirai cha mwanzo hufanya kazi kama kichwa cha sehemu kinachoanzisha migawanyo ya walinda malango.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַחְלְקוֹת לְשֹׁעֲרִים
  choice: Kuhusu migawanyo ya walinda malango
  rationale: Kirai chenye לְ kinaanzisha mada au kichwa cha sehemu, huku מַחְלְקוֹת ikimaanisha vikundi vya zamu au migawanyo ya utumishi. Tafsiri hii ni ya asili kwa Kiswahili na inadumisha maana ya mpangilio.
- source_word: לַקָּרְחִים
  choice: miongoni mwa Wakora
  rationale: Neno hilo linatambulisha ukoo mdogo ambamo mlinzi wa kwanza alitoka. 'Wakora' ni namna ya kawaida ya kutaja wazao wa Kora.
- source_word: מְשֶׁלֶמְיָהוּ
  choice: Meshelemia
  rationale: Jina limenukuliwa kwa mfumo unaosomeka kwa Kiswahili huku likifuata umbo la Kiebrania katika mstari huu.
- source_word: בֶן קֹרֵא
  choice: mwana wa Kore
  rationale: בֶן hapa ina maana yake ya moja kwa moja ya 'mwana wa'; jina קֹרֵא limenukuliwa kama Kore.
- source_word: מִן בְּנֵי אָסָף
  choice: wa wazao wa Asafu
  rationale: Kirai hiki kinaonyesha asili au uanachama katika nasaba ya Asafu. 'Wazao' ni Kiswahili cha kawaida kinachohifadhi uwezekano kwamba בְּנֵי ina maana pana ya ukoo, si lazima wana wa moja kwa moja.
