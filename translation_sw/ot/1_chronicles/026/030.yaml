base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/030.yaml
  text: 'For the Hebronites: Hashabiah and his brothers[a], 1,700 capable men, were in charge of the oversight of Israel west of the Jordan, for all the work of the LORD and for the service of the king.'
translation:
  language: sw
  text: 'Wahebroni: Hashabia na ndugu zake[a], wanaume 1,700 wenye uwezo, walikuwa wasimamizi wa Israeli upande wa magharibi wa Yordani[b], kwa kazi yote ya Yahwe na kwa utumishi wa mfalme.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “ndugu” linaweza pia kumaanisha jamaa wa ukoo.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “ng’ambo ya Yordani kuelekea magharibi,” yaani, upande wa magharibi wa Yordani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  choice: Kwa upande wa Wahebroni
  rationale: Katika orodha hii jina hilo linarejelea ukoo au kundi la Walawi wa Hebroni, si mtu mmoja; usemi huu unaingiza sehemu yao kwa Kiswahili cha kawaida.
- source_word: חֲשַׁבְיָהוּ
  choice: Hashabia
  rationale: Jina la mtu limetoholewa kwa tahajia inayoeleweka katika Kiswahili.
- source_word: וְאֶחָיו
  choice: na ndugu zake[a]
  rationale: Neno la Kiebrania limetafsiriwa moja kwa moja kama ‘ndugu,’ huku tanbihi ikihifadhi uwezekano kwamba linamaanisha jamaa wa ukoo kwa maana pana.
- source_word: בְּנֵי חַיִל
  choice: wanaume wenye uwezo
  rationale: Muktadha ni wa usimamizi, kwa hiyo tafsiri hii inaonyesha umahiri na uwezo bila kulazimisha maana ya kijeshi.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת
  choice: 1,700
  rationale: Idadi imetolewa kwa tarakimu kwa mtindo wa kawaida na ulio wazi.
- source_word: עַל פְּקֻדַּת יִשְׂרָאֵל
  choice: walipewa jukumu la kuisimamia Israeli
  rationale: Kirai kinaonyesha kuwa walikuwa na mamlaka au wajibu wa usimamizi juu ya Israeli; tafsiri hii ni ya asili bila kuongeza mfumo maalumu wa kiutawala.
- source_word: מֵעֵבֶר לַיַּרְדֵּן מַעְרָבָה
  choice: upande wa magharibi wa Yordani[b]
  rationale: Hii ndiyo maana ya kijiografia inayokusudiwa katika muktadha; tanbihi inahifadhi muundo halisi zaidi wa Kiebrania.
- source_word: לְכֹל מְלֶאכֶת יְהוָה
  choice: kwa ajili ya kazi yote ya Yahwe
  rationale: ‘Kazi’ huhifadhi upana wa majukumu yanayohusiana na Yahwe bila kuyafafanua kupita kiasi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa konsonanti YHWH limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וְלַעֲבֹדַת הַמֶּלֶךְ
  choice: na utumishi wa mfalme
  rationale: ‘Utumishi’ linaonyesha wajibu kwa mfalme na kudumisha utofauti kati ya kazi ya Yahwe na huduma ya kifalme.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu; ‘Yahwe’ hulihifadhi badala ya kuliwakilisha kwa cheo.
- issue: Upeo wa neno אֶחָיו
  choice: ndugu zake, pamoja na tanbihi ya maana pana
  alternative: jamaa zake
  rationale: ‘Ndugu zake’ huhifadhi maana ya moja kwa moja, huku tanbihi ikikiri kwamba katika muktadha wa ukoo neno hilo linaweza kuwahusu jamaa wa kundi pana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya heshima, ya sasa na inayoeleweka kwa wasomaji wa kawaida. Miundo ya kiutawala imetolewa kwa uwazi bila kuingiza istilahi za urasimu wa kisasa, na utata halisi wa ‘ndugu/jamaa’ pamoja na usemi wa kijiografia umehifadhiwa katika tanbihi.
