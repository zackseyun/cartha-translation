lexical_decisions:
- source_word: לַעַמְרָמִי
  choice: Kwa Waamrami
  rationale: Kiambishi ל kinaeleweka hapa kama utangulizi wa kichwa katika orodha ya koo. “Kwa Waamrami” ni usemi mfupi na wa kawaida unaohifadhi muundo huo bila kuongeza kitenzi kisichokuwapo katika Kiebrania.
- source_word: לַיִּצְהָרִי
  choice: Waishari
  rationale: Ni jina la ukoo unaotokana na Ishari; umbo la Kiswahili lenye kiambishi Wa- linaonyesha kundi la watu na linafaa katika orodha ya koo.
- source_word: לַחֶבְרוֹנִי
  choice: Wahebroni
  rationale: Ni jina la ukoo wa Hebroni. Umbo la Wa- linadumisha mtindo mmoja katika orodha yote.
- source_word: לָעָזִּיאֵלִי
  choice: na Wauzieli
  rationale: Ni jina la ukoo wa Uzieli. Kiunganishi “na” kimeongezwa kwa mujibu wa mtiririko wa kawaida wa orodha katika Kiswahili, bila kubadili maana.
