base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/020.yaml
  text: And of the Levites[b][a], Ahijah was over the treasuries of the house of God and the treasuries of the holy things.
translation:
  language: sw
  text: Na kuhusu Walawi,[a] Ahia alisimamia hazina za nyumba ya Mungu na hazina za vitu vitakatifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Na Walawi: Ahia alisimamia ...” Mwanzo wa sentensi ya Kiebrania una udondoshaji fulani na huenda ukatumika kama mpito unaofanana na kichwa cha habari.'
    reason: alternative_reading
  - marker: b
    text: “Vitu vitakatifu” pia vinaweza kutafsiriwa “vitu vilivyowekwa wakfu,” yaani, vitu vilivyotengwa kwa matumizi matakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Na kuhusu Walawi
  rationale: Kirai hiki kinaanzisha mada mpya kwa namna yenye udondoshaji fulani katika Kiebrania. “Na kuhusu Walawi” ni Kiswahili cha asili kinachohifadhi kazi yake kama mpito wa kimada bila kukifanya moja kwa moja kuwa kiima cha wingi.
- source_word: אֲחִיָּה
  choice: Ahiya
  rationale: Jina la mtu limetoholewa kwa tahajia inayoakisi matamshi ya Kiebrania na inayosomeka kwa urahisi katika Kiswahili.
- source_word: עַל
  choice: alisimamia
  rationale: Katika muktadha wa kiutawala, neno hili huonyesha mamlaka au wajibu wa uangalizi. “Alisimamia” ni la asili na wazi kuliko tafsiri ya neno kwa neno “alikuwa juu ya.”
- source_word: אֹצְרוֹת
  choice: hazina
  rationale: Katika muktadha wa nyumba ya Mungu, neno hili linaweza kumaanisha mahali au akiba za vitu vya thamani na vifaa. “Hazina” linahifadhi upana huo vizuri.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Hii ni tafsiri ya moja kwa moja ya usemi wa Kiebrania na inahifadhi istilahi ya chanzo badala ya kuifasiri mahsusi kuwa “hekalu.”
- source_word: וּלְאֹצְרוֹת
  choice: na hazina za
  rationale: Kihusishi kinaunganisha kundi la pili la hazina na usimamizi uleule wa Ahiya. Si lazima kurudia kitenzi katika Kiswahili.
- source_word: הַקֳּדָשִׁים
  choice: vitu vitakatifu
  rationale: Wingi huu unataja vitu vilivyotengwa kwa matumizi matakatifu. “Vitu vitakatifu” ni tafsiri ya moja kwa moja, huku uwezekano wa kuelewa kuwa vitu vilivyowekwa wakfu ukielezwa katika tanbihi.
