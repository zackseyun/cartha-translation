lexical_decisions:
- source_word: וַיַּפִּילוּ גוֹרָלוֹת
  choice: wakapiga kura
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kutumia kura kufanya mgao; tafsiri ya neno kwa neno, ‘wakaangusha kura,’ isingekuwa ya kawaida katika Kiswahili.
- source_word: כַּקָּטֹן כַּגָּדוֹל
  choice: wadogo na wakubwa sawasawa
  rationale: Inahifadhi tofauti ya ‘mdogo’ na ‘mkubwa’ bila kuifasiri kuwa tofauti ya umri pekee, na ‘sawasawa’ inaonyesha kwamba wote walishiriki bila ubaguzi.
- source_word: לְבֵית אֲבוֹתָם
  choice: kwa kufuata nyumba za baba zao
  rationale: ‘Nyumba za baba’ inawakilisha vitengo vya kifamilia vya ukoo wa upande wa baba; ‘kwa kufuata’ inaonyesha kwamba mgao ulipangwa kwa vitengo hivyo.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: kwa kila lango
  rationale: Kurudiwa kwa nomino ya umoja katika Kiebrania kuna maana ya ugawaji mmoja baada ya mwingine; ‘kwa kila lango’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
