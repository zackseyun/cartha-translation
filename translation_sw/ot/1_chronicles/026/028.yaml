source:
  edition: WLC
  text: וְ/כֹ֨ל הַֽ/הִקְדִּ֜ישׁ שְׁמוּאֵ֤ל הָ/רֹאֶה֙ וְ/שָׁא֣וּל בֶּן קִ֔ישׁ וְ/אַבְנֵ֣ר בֶּן נֵ֔ר וְ/יוֹאָ֖ב בֶּן צְרוּיָ֑ה כֹּ֚ל הַ/מַּקְדִּ֔ישׁ עַ֥ל יַד שְׁלֹמִ֖ית וְ/אֶחָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/028.yaml
  text: And all that Samuel the seer[a], Saul son of Kish, Abner son of Ner[b], and Joab son of Zeruiah had dedicated—everything that anyone had dedicated—was under the care of Shelomith and his brothers.
translation:
  language: sw
  text: Na yote ambayo Samweli mwonaji[a], Sauli mwana wa Kishi, Abneri mwana wa Neri, na Yoabu mwana wa Seruya walikuwa wameweka wakfu—yote yaliyowekwa wakfu—yalikuwa chini ya uangalizi wa Shelomithi na ndugu zake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mwonaji” ni cheo cha Kiebrania רֹאֶה, neno la zamani linalomtaja mtu mwenye kazi ya kinabii.
    reason: cultural_note
  - marker: b
    text: Au, “yalikuwa chini ya mamlaka ya Shelomithi na ndugu zake.” Neno “ndugu” pia linaweza kumaanisha jamaa zake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: Na vitu vyote
  rationale: Katika muktadha huu כֹל inahusu kwa ujumla vitu vilivyowekwa wakfu. Kiswahili huhitaji nomino kama “vitu” ili sentensi iwe wazi na ya kawaida.
- source_word: הַהִקְדִּישׁ
  choice: walikuwa wameviweka wakfu
  rationale: Hifili ya קדשׁ hapa ina maana ya kutenga vitu kwa matumizi matakatifu. “Kuweka wakfu” ni usemi wa kawaida wa Kiswahili unaofaa katika muktadha wa hazina za vitu vitakatifu.
- source_word: שְׁמוּאֵל הָרֹאֶה
  choice: Samweli mwonaji
  rationale: “Mwonaji” huhifadhi cheo mahsusi רֹאֶה badala ya kukisawazisha kimya kimya na neno pana zaidi “nabii.”
- source_word: בֶּן
  choice: mwana wa
  rationale: Huu ni mfumo wa kawaida wa nasaba, na hapa unamaanisha moja kwa moja “mwana wa.”
- source_word: צְרוּיָה
  choice: Seruya
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: כֹּל הַמַּקְדִּישׁ
  choice: kila kitu ambacho mtu yeyote alikuwa amekiweka wakfu
  rationale: Kirai hiki cha kurejelea kwa muhtasari kinaweza kueleweka kuhusu kila kilichowekwa wakfu na kila mwekaji wakfu. Tafsiri hii inaonyesha upana wa usemi bila kuifanya irudio lisiloeleweka.
- source_word: עַל יַד
  choice: vilikuwa chini ya usimamizi wa
  rationale: Katika muktadha wa utawala, nahau hii inaonyesha kuwa vitu vilikuwa chini ya uangalizi au mamlaka ya mtu, si tu kwamba vilikuwa “mkononi” mwake kihalisi.
- source_word: שְׁלֹמִית
  choice: Shelomithi
  rationale: Jina limetoholewa kwa kufuata umbo la Kiebrania na mpangilio wa sauti unaosomeka kwa Kiswahili.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: Neno linaweza kumaanisha ndugu wa kiume au jamaa wa karibu. “Ndugu zake” ni tafsiri ya moja kwa moja na bado inaweza kubeba upana fulani wa kindugu katika Kiswahili.
theological_decisions:
- issue: Utambulisho wa Samweli kwa neno רֹאֶה
  choice: mwonaji
  alternative: nabii
  rationale: Maandishi yanatumia cheo cha zamani na mahsusi cha kinabii; kukihifadhi huepuka kuondoa tofauti ya msamiati wa Kiebrania.
- issue: Upeo wa כֹּל הַמַּקְדִּישׁ
  choice: kila kitu ambacho mtu yeyote alikuwa amekiweka wakfu
  alternative: kila kitu kilichowekwa wakfu
  rationale: Kishiriki cha umoja kinaweza kuelekeza kwa mwekaji wakfu, huku muktadha ukihusu vitu. Tafsiri iliyochaguliwa inahifadhi pande zote mbili za maana bila kuamua zaidi ya ushahidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kurejelea kwa msisitizo umehifadhiwa kwa “naam,” na majina yametoholewa kwa maumbo yanayofaa usomaji wa Kiswahili.
