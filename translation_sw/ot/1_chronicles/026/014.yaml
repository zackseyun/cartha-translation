base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/014.yaml
  text: The lot for the east fell to Shelemyahu. Then they cast lots for his son Zekaryahu[a], a counselor with insight, and his lot came out for the north.
translation:
  language: sw
  text: Kura ya upande wa mashariki ilimwangukia Shelemia. Kisha wakapiga kura kwa ajili ya Zekaria, mwanawe, mshauri mwenye ufahamu,[a] na kura yake ikatokea kuwa ya upande wa kaskazini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mshauri mwenye busara.” Kifungu cha Kiebrania kinamweleza Zekaria kuwa mshauri aliye na ufahamu au busara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל הַגּוֹרָל
  choice: kura ... ilimwangukia
  rationale: Nahau hii ya Kiebrania inaeleza kura kumwangukia au kupewa mtu; Kiswahili hiki kinahifadhi taswira ya kuanguka na maana ya kugawiwa.
- source_word: מִזְרָחָה
  choice: ya upande wa mashariki
  rationale: He ya mwelekeo inaonyesha eneo lililogawiwa; katika muktadha huu ni upande wa lango la mashariki.
- source_word: לְשֶׁלֶמְיָהוּ
  choice: ilimwangukia Shelemia
  rationale: Lamed inaonyesha mpokeaji wa mgawo; jina limetoholewa kwa umbo linalozoeleka katika Kiswahili cha Biblia.
- source_word: וּזְכַרְיָהוּ בְנוֹ
  choice: Kisha wakampigia kura Zekaria mwanawe
  rationale: Waw inaendeleza mfuatano wa simulizi, na muundo huu unaweka wazi kuwa Zekaria ni mwana wa Shelemia.
- source_word: יוֹעֵץ בְּשֶׂכֶל
  choice: mshauri mwenye busara
  rationale: Tafsiri hii huhifadhi יוֹעֵץ kama ‘mshauri’ na בְּשֶׂכֶל kama sifa ya busara au ufahamu, bila kuvifupisha kabisa kuwa kivumishi kimoja.
- source_word: הִפִּילוּ גּוֹרָלוֹת
  choice: wakampigia kura
  rationale: Hiphil ya נפל pamoja na גורלות ni nahau ya kupiga kura; kiambishi cha mtendewa kinaifanya sentensi iwe ya kawaida katika Kiswahili.
- source_word: וַיֵּצֵא גוֹרָלוֹ
  choice: na kura yake ikatokea kuwa
  rationale: יצא hapa inaeleza matokeo ya kura kujitokeza; ‘ikatokea kuwa’ ni ya asili katika Kiswahili na inaitofautisha na nahau ya awali ya kura kuanguka.
- source_word: צָפוֹנָה
  choice: ya upande wa kaskazini
  rationale: He ya mwelekeo inaonyesha upande uliogawiwa, sambamba na ‘upande wa mashariki’ mwanzoni.
theological_decisions: []
