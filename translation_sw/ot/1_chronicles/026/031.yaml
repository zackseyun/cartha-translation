base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/031.yaml
  text: For the Hebronites[a], Jeriah was the chief of the Hebronites according to his generations by fathers’ houses. In the fortieth year of David’s reign they were sought out[c][b], and among them mighty men of valor were found at Jazer of Gilead.
translation:
  language: sw
  text: Kwa Wahabroni, Yerija alikuwa mkuu wa Wahabroni, kwa vizazi vyake, kwa koo za mababu.[a] Katika mwaka wa arobaini wa utawala wa Daudi, walifanyiwa uchunguzi,[b] na miongoni mwao wakapatikana mashujaa hodari[c] huko Yaazeri katika Gileadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Koo za mababu” ni makundi ya ukoo yanayotokana na nyumba za mababu, si familia ndogo za wazazi na watoto pekee.
    reason: cultural_note
  - marker: b
    text: Au “walichunguzwa” au “walitafutwa kwa uchunguzi.” Hii yaelekea kumaanisha uchunguzi rasmi wa ukoo au wa kiutawala.
    reason: lexical_alternative
  - marker: c
    text: Au “watu mashujaa” au “watu wenye uwezo.” Kifungu cha Kiebrania kinaweza kumaanisha watu mashuhuri kwa nguvu, ushujaa, au uwezo uliothibitishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  choice: Kwa upande wa Wahebroni
  rationale: Kiambishi ל־ kinaanzisha ukoo kama mada mpya; usemi huu wa Kiswahili ni wa kawaida na huhifadhi dhima hiyo.
- source_word: יְרִיָּה
  choice: Yeriya
  rationale: Unukuzi wa jina la Kiebrania יְרִיָּה unaofuata matamshi yake kwa Kiswahili.
- source_word: הָרֹאשׁ
  choice: alikuwa mkuu
  rationale: Katika muktadha wa ukoo na utawala, רֹאשׁ ni kiongozi au mkuu wa kundi.
- source_word: לְתֹלְדֹתָיו לְאָבוֹת
  choice: kulingana na vizazi vyao na koo za mababu
  rationale: Huhifadhi wazo la mistari ya uzao pamoja na makundi ya kifamilia ya mababu, huku Kiswahili cha wingi kikirejelea ukoo unaowakilishwa na Yeriya.
- source_word: בִּשְׁנַת הָאַרְבָּעִים לְמַלְכוּת דָּוִיד
  choice: Katika mwaka wa arobaini wa utawala wa Daudi
  rationale: Ni usemi wa kawaida wa Kiswahili kwa tarehe inayohesabiwa kwa miaka ya utawala wa mfalme.
- source_word: נִדְרָשׁוּ
  choice: walitafutwa katika uchunguzi
  rationale: Nifali ya דרש inaonyesha kutafutwa au kuchunguzwa kwa makusudi; nyongeza ya 'katika uchunguzi' huzuia maana isieleweke kama kutafutwa kwa watu waliopotea tu.
- source_word: וַיִּמָּצֵא בָהֶם
  choice: na miongoni mwao wakapatikana
  rationale: Hufikisha kwa Kiswahili maana isiyoainisha mtendaji ya kwamba watu hao waligunduliwa miongoni mwa kundi.
- source_word: גִּבּוֹרֵי חַיִל
  choice: mashujaa hodari
  rationale: Huhifadhi maana ya ushujaa na uwezo wa kipekee bila kulazimisha kama ni nguvu za kijeshi pekee.
- source_word: בְּיַעְזֵיר גִּלְעָד
  choice: huko Yazeri katika Gileadi
  rationale: Hutaja mahali walikopatikana; 'katika Gileadi' ni mahusiano ya kijiografia yaliyo wazi na ya kawaida kwa Kiswahili.
