  text: וְ/אֶחָ֣י/ו בְּנֵי חַ֗יִל אַלְפַּ֛יִם וּ/שְׁבַ֥ע מֵא֖וֹת רָאשֵׁ֣י הָ/אָב֑וֹת וַ/יַּפְקִידֵ֞/ם דָּוִ֣יד הַ/מֶּ֗לֶךְ עַל הָ/ראוּבֵנִ֤י וְ/הַ/גָּדִי֙ וַ/חֲצִי֙ שֵׁ֣בֶט הַֽ/מְנַשִּׁ֔י לְ/כָל דְּבַ֥ר הָ/אֱלֹהִ֖ים וּ/דְבַ֥ר הַ/מֶּֽלֶךְ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/032.yaml
  text: And his brothers[a], valiant men, were two thousand seven hundred heads of fathers’ houses; and King David appointed them over the Reubenites, the Gadites, and the half-tribe of Manasseh for every matter of God and of the king.
translation:
  language: sw
  text: Ndugu zake, watu hodari, walikuwa elfu mbili na mia saba, wakuu wa jamaa za ukoo; naye Mfalme Daudi akawateua kuwasimamia Wareubeni, Wagadi, na nusu ya kabila la Manase katika kila jambo la Mungu na la mfalme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa shughuli zote za Mungu na shughuli za mfalme.”
    reason: Njia mbadala ya kutafsiri דָּבָר kama “shughuli” badala ya “jambo,” huku ikidumisha ulinganifu wa maneno hayo mawili.
lexical_decisions:
- source_word: וְאֶחָיו
  choice: Ndugu zake
  rationale: Hurejelea Hashabia katika mstari uliotangulia. “Ndugu” ndiyo maana ya moja kwa moja, ingawa katika muktadha wa ukoo inaweza pia kumaanisha jamaa zake.
- source_word: בְּנֵי חַיִל
  choice: waliokuwa mashujaa
  rationale: Kirai hiki huonyesha watu wenye nguvu, ushujaa, au uwezo. “Mashujaa” huhifadhi uzito wa nahau hiyo katika maelezo ya viongozi hawa.
- source_word: אַלְפַּיִם וּשְׁבַע מֵאוֹת
  choice: elfu mbili na mia saba
  rationale: Hii ni tafsiri ya moja kwa moja ya idadi hiyo.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: viongozi wa jamaa za ukoo
  rationale: Hili ni jina la kiutawala na kimnasaba kwa viongozi wa vikundi vya kifamilia vya ukoo. Kiswahili hiki ni cha kawaida zaidi kuliko tafsiri sisisi ya “vichwa vya nyumba za baba.”
- source_word: וַיַּפְקִידֵם
  choice: akawaweka wasimamie
  rationale: Hifili ya פקד hapa ina maana ya kuwapa wajibu rasmi wa usimamizi; “akawaweka wasimamie” huonyesha uteuzi huo kwa Kiswahili cha kawaida.
- source_word: עַל
  choice: wasimamie
  rationale: Katika muktadha huu עַל huonyesha mamlaka au wajibu juu ya makundi yaliyotajwa.
- source_word: הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: Wareubeni, Wagadi, na nusu ya kabila la Manase
  rationale: Majina ya kikabila ya umoja katika Kiebrania yanarejelea watu kwa pamoja; Kiswahili huyatoa kiasili kama Wareubeni na Wagadi.
- source_word: לְכָל דְּבַר הָאֱלֹהִים
  choice: katika kila jambo la Mungu
  rationale: דבר hapa inaweza kuwa jambo, shughuli, au kazi. “Jambo la Mungu” huhifadhi ufupi na upana wa maana bila kulifafanua zaidi kuwa la ibada pekee.
- source_word: וּדְבַר הַמֶּלֶךְ
  choice: na la mfalme
  rationale: Hukamilisha kwa ulinganifu “jambo la Mungu”; neno “jambo” linaeleweka kutoka kirai kilichotangulia, kama ilivyo katika Kiebrania.
theological_decisions:
- issue: Upeo wa wajibu katika mambo ya Mungu na ya mfalme
  choice: Waliwekwa kusimamia mambo yanayomhusu Mungu na yale yanayomhusu mfalme.
  alternative: “Kwa shughuli zote za Mungu na shughuli za mfalme.”
  rationale: Kiebrania hutofautisha nyanja hizi mbili bila kueleza daraja la kitheolojia kati yake. Tafsiri inadumisha tofauti hiyo bila kuingiza dhana za baadaye kuhusu mamlaka ya dini na dola.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Jamaa za ukoo” linaeleza muundo wa kifamilia wa kale bila tafsiri sisisi isiyo ya kawaida; “katika kila jambo la Mungu na la mfalme” huhifadhi ulinganifu na utata wa Kiebrania.
