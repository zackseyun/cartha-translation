base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/022.yaml
  text: 'The sons of Jehieli: Zetham and Joel his brother were over the treasuries of the house of Yahweh[a].'
translation:
  language: sw
  text: 'Wana wa Yehieli: Zethamu na Yoeli, ndugu yake, walikuwa wasimamizi wa hazina za nyumba ya Yahwe.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “nyumba ya Yahwe”; kwa mapokeo hutafsiriwa “nyumba ya BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa hali ya kuambatana wa בן; katika muktadha huu wa ukoo na utawala, “wana wa” ndiyo tafsiri ya moja kwa moja.
- source_word: יְחִיאֵלִי
  choice: Yehieli
  rationale: Imetafsiriwa kama jina la mtu linalofuata “wana wa”; ingawa umbo hilo linaweza kueleweka kama kivumishi cha ukoo, muktadha unapendelea jina maalumu.
- source_word: זֵתָם
  choice: Zethamu
  rationale: Jina maalumu limenukuliwa kwa tahajia inayofaa Kiswahili huku sauti ya Kiebrania ikihifadhiwa.
- source_word: וְיוֹאֵל
  choice: na Yoeli
  rationale: Kiunganishi na jina maalumu vimetolewa moja kwa moja.
- source_word: אָחִיו
  choice: ndugu yake
  rationale: Nomino ya umoja yenye kiambishi cha nafsi ya tatu umoja wa kiume kwa kawaida humrejelea Yoeli kuwa ndugu ya Zethamu; umoja wa Kiebrania umehifadhiwa.
- source_word: עַל
  choice: walikuwa wasimamizi wa
  rationale: Katika muktadha wa kiutawala, עַל huonyesha mamlaka au jukumu la kusimamia; usemi huu ni wa asili katika Kiswahili.
- source_word: אֹצְרוֹת
  choice: hazina
  rationale: Neno hili hapa linahusu mahali au mali zilizowekwa chini ya usimamizi wa nyumba ya ibada; “hazina” huhifadhi maana pana ya kitaasisi.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: “Nyumba” huhifadhi taswira halisi ya בֵּית badala ya kuifafanua moja kwa moja kuwa hekalu, na jina la agano יְהוָה limetolewa kama Yahwe.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni moja kwa moja. “Yahwe” hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo, huku tanbihi ikitaja utoaji wa kimapokeo.
- issue: Maana ya בֵּית יְהוָה
  choice: nyumba ya Yahwe
  alternative: hekalu la Yahwe
  rationale: Tafsiri halisi “nyumba” huhifadhi usemi wa chanzo na uwezekano wake wa kitheolojia; “hekalu” ni ufafanuzi sahihi kimuktadha lakini si lazima uwekwe katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa orodha ya kiutawala umehifadhiwa, huku “walikuwa wasimamizi wa” ukifanya sentensi isomeke kwa kawaida.
