  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: Shemaya anatambulishwa kuwa mwana wa Obed-Edomu, wana walizaliwa kwake, walikuwa na mamlaka katika kitengo cha familia cha baba yao, na sababu inayotolewa ni kuwa walikuwa גִּבּוֹרֵי חַיִל. Muundo wa kibiblia “alizaliwa wana” unawakilisha ipasavyo taarifa ya kuzaliwa ya Kiebrania.'
