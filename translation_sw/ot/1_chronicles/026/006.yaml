  terminology: Majina na istilahi zimetumiwa kwa uthabiti. “Mashujaa hodari” hudumisha uzito wa גִּבּוֹרֵי חַיִל; tanbihi b huzuia msomaji kuifunga maana hiyo kwa mashujaa wa vitani pekee. Tanbihi a inafafanua kwa usahihi mrejeo wa “mwanawe.”
