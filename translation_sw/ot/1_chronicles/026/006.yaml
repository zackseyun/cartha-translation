  text: וְ/לִֽ/שְׁמַֽעְיָ֤ה בְנ/וֹ֙ נוֹלַ֣ד בָּנִ֔ים הַ/מִּמְשָׁלִ֖ים לְ/בֵ֣ית אֲבִי/הֶ֑ם כִּֽי גִבּ֥וֹרֵי חַ֖יִל הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/006.yaml
  text: And to Shemaiah his son[a], sons were born who ruled over their fathers’ house[b], for they were mighty men of valor.
translation:
  language: sw
  text: Naye Shemaya mwanawe[a] alizaliwa wana waliotawala jamaa ya baba yao, kwa maana walikuwa mashujaa hodari[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Shemaya alikuwa mwana wa Obed-Edomu aliyetajwa katika mstari uliotangulia.
    reason: referent_clarification
  - marker: b
    text: Usemi wa Kiebrania unaweza pia kumaanisha watu wenye nguvu, uwezo uliothibitishwa, au hadhi, wala si mashujaa wa vita tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁמַעְיָה
  choice: Naye Shemaya
  rationale: Muundo wa Kiebrania huendeleza orodha ya ukoo na kumtaja Shemaya kama yule aliyezaliwa wana; Kiswahili cha kawaida hutumia “Naye” kwa uendelezaji huu.
- source_word: בְנוֹ
  choice: mwanawe
  rationale: Hapa neno בן lenye kiambishi cha nafsi ya tatu umoja humtambulisha Shemaya kuwa mwana wa Obed-Edomu aliyetajwa kabla.
- source_word: נוֹלַד בָּנִים
  choice: alizaliwa wana
  rationale: Ingawa kitenzi cha Kiebrania kiko katika umoja, huu ni mtindo wa taarifa za kuzaliwa. Muundo “alizaliwa wana” ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: הַמִּמְשָׁלִים
  choice: waliotawala
  rationale: Kitenzi משל hapa kina maana ya kutawala au kuwa na mamlaka, si kuwa na cheo tu.
- source_word: לְבֵית אֲבִיהֶם
  choice: jamaa ya baba yao
  rationale: Neno בית אב humaanisha kitengo cha kifamilia au ukoo wa upande wa baba. “Jamaa ya baba yao” ni ya asili kwa Kiswahili na huhifadhi umoja wa בית.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya wana hao kuwa na mamlaka.
- source_word: גִּבּוֹרֵי חַיִל
  choice: mashujaa hodari
  rationale: Usemi huu unaweza kueleza ushujaa, nguvu, uwezo uliothibitishwa, au hadhi. “Mashujaa hodari” huhifadhi uzito wake bila kuufanya uwe wa kijeshi pekee.
- source_word: הֵמָּה
  choice: walikuwa
  rationale: Kiwakilishi huru cha Kiebrania hutia mkazo, lakini Kiswahili huwasilisha maana hiyo kwa kawaida ndani ya kishazi bila kuongeza kiwakilishi kizito.
