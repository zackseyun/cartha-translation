lexical_decisions:
- source_word: וְ/לִ/מְשֶׁלֶמְיָהוּ
  choice: Kwa Meshelemia
  rationale: Kihusishi לְ humtambulisha mtu ambaye watu wake wanahesabiwa; “kwa Meshelemia” ni muundo wa kawaida wa Kiswahili katika orodha. Jina limetoholewa moja kwa moja kutoka מְשֶׁלֶמְיָהוּ kuwa “Meshelemia,” likihifadhi konsonanti ya mwanzo mem.
- source_word: בָּנִים
  choice: wanawe
  rationale: Nomino hii humaanisha watoto wa kiume; “wanawe” hudumisha maana hiyo na kuonyesha kwa kawaida uhusiano wao na Meshelemia.
- source_word: וְ/אַחִים
  choice: na ndugu zake
  rationale: Katika muktadha huu אַחִים ina maana ya ndugu wa kiume. Kiswahili “ndugu” hakiainishi jinsia kimaumbo, lakini hapa marejeo yake kwa wanaume yanaeleweka kutokana na orodha na kirai kinachofuata.
- source_word: בְּנֵי חָיִל
  choice: watu hodari
  rationale: Nahau hii, kihalisi “wana wa nguvu/ushujaa,” humaanisha wanaume wenye uwezo, nguvu au ushujaa. “Watu hodari” ni ya asili, yenye heshima, na haibani maana katika ushujaa wa vitani pekee.
- source_word: שְׁמוֹנָה עָשָׂר
  choice: kumi na wanane
  rationale: Hii ndiyo namna ya kawaida ya kutaja idadi kumi na nane kwa watu katika Kiswahili.
