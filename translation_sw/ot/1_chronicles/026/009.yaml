  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Vistari virefu vinaonyesha kwamba “watu hodari” ni maelezo ya wana na ndugu, huku mpangilio wa mwisho ukihifadhi kwa kadiri inayowezekana muundo wa Kiebrania: sifa, kisha jumla ya idadi.'
