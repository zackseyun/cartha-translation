  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵילָם
  choice: Elamu
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili, kwa kuongeza irabu ya mwisho ili litamkike kwa urahisi.
- source_word: הַחֲמִישִׁי
  choice: wa tano
  rationale: Namba ya mpangilio yenye kibainishi imetafsiriwa kwa muundo wa kawaida wa Kiswahili katika orodha ya watu.
- source_word: יְהוֹחָנָן
  choice: Yehohanani
  rationale: Jina limetoholewa kutoka kwa Kiebrania kwa namna inayosomeka kwa kawaida katika Kiswahili na inayohifadhi sauti zake kuu.
- source_word: הַשִּׁשִּׁי
  choice: wa sita
  rationale: Muundo huu unadumisha ulinganifu wa orodha na namba nyingine za mpangilio.
- source_word: אֶלְיְהוֹעֵינַי
  choice: Eliehoenai
  rationale: Jina limetoholewa kwa namna inayohifadhi vipashio na utambulisho wa jina la Kiebrania huku likisomeka kwa Kiswahili.
- source_word: הַשְּׁבִיעִי
  choice: wa saba
  rationale: Namba ya mpangilio imetafsiriwa kwa muundo wa kawaida wa Kiswahili, sambamba na “wa tano” na “wa sita”.
