  yaml_path: translation/ot/1_chronicles/026/019.yaml
  text: These were the divisions of the gatekeepers for the sons of the Korahites and for the sons of Merari[a].
translation:
  language: sw
  text: Haya ndiyo makundi ya walinzi wa malango, ya wana wa Kora na ya wana wa Merari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Haya ndiyo
  rationale: Kiwakilishi cha wingi kinaanzisha muhtasari wa makundi yaliyotangulia. Kwa kuwa Kiebrania hakina kitenzi hapa, Kiswahili cha sasa kinatumia kwa kawaida muundo wa utambulisho “Haya ndiyo” bila kulazimisha wakati uliopita.
- source_word: מַחְלְקוֹת
  choice: makundi
  rationale: Neno hili linamaanisha migawanyo au vikundi vilivyopangiwa huduma. “Makundi” ni la kawaida na linaeleweka vizuri katika muktadha wa mpangilio wa huduma ya Hekalu.
- source_word: הַשֹּׁעֲרִים
  choice: walinzi wa malango
  rationale: Hawa ni watu waliowekwa kulinda au kusimamia malango. “Walinzi wa malango” linaeleza wajibu wao kwa uwazi kuliko tafsiri yenye maana ya watunza milango tu.
- source_word: לִבְנֵי הַקָּרְחִי
  choice: ya wana wa Kora
  rationale: Kiambishi לְ kinaonyesha uhusiano wa makundi hayo na ukoo husika. “Wana wa Kora” huhifadhi muundo wa ukoo wa Kiebrania na ni Kiswahili cha kibiblia kinachoeleweka.
- source_word: וְלִבְנֵי מְרָרִי
  choice: na ya wana wa Merari
  rationale: Tafsiri inadumisha ulinganifu wa vifungu viwili vya Kiebrania na kutaja wazi wana wa Merari badala ya kufupisha kuwa jina la ukoo.
theological_decisions: []
