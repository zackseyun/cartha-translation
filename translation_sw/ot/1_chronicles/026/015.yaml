  text: To Obed-edom[a], the south; and to his sons, the house of stores.
translation:
  language: sw
  text: Obed-Edomu akapangiwa upande wa kusini, na wanawe wakapangiwa jengo la maghala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jengo la vitu vilivyokusanywa.” Neno la Kiebrania linarejelea mahali pa kuhifadhia vitu au maghala.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹבֵד אֱדֹם
  choice: Obed-Edomu akapangiwa
  rationale: Kiambishi לְ katika muktadha wa kugawa kwa kura kinaonyesha sehemu aliyogawiwa; muundo wa kitenzi ni wa kawaida na wazi katika Kiswahili.
- source_word: נֶגְבָּה
  choice: upande wa kusini
  rationale: Nomino yenye kiishio cha kuelekea inaonyesha upande au eneo la kusini katika mgawanyo wa vituo vya walinzi.
- source_word: וּלְבָנָיו
  choice: na wanawe wakapangiwa
  rationale: Hurejelea wana wa Obed-Edomu kama waliopokea mgawo mwingine; kurudia kitenzi kilichodokezwa hufanya sentensi iwe wazi katika Kiswahili.
- source_word: בֵּית
  choice: jengo la
  rationale: Katika hali ya muungano na neno linalofuata, בֵּית hapa huonyesha jengo au eneo maalumu; “jengo la” ni la asili zaidi kuliko “nyumba ya” katika muktadha huu.
- source_word: הָאֲסֻפִּים
  choice: ghala
  rationale: Neno linalohusiana na אסף, ‘kukusanya,’ linaonyesha mahali pa kuhifadhi vitu au vifaa vilivyokusanywa; “ghala” huwasilisha maana hiyo kwa ufupi.
