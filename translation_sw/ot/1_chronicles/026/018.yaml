  text: 'For the Parbar on the west: four at the road[b][a], and two at the Parbar.'
translation:
  language: sw
  text: 'Kwa Parbari upande wa magharibi: walinzi wanne kwenye barabara[b], na wawili kwenye Parbari.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “eneo,” “ua,” “jengo la pembeni,” au kwa mapokeo “kitongoji.” Parbari ni utohozi wa neno adimu la Kiebrania, na sehemu hasa ya jengo au eneo linalotajwa haijulikani kwa hakika.
    reason: lexical_alternative
  - marker: b
    text: Au “njia iliyoinuliwa” au “barabara kuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּרְבָּר
  choice: Parbari
  rationale: Neno hili la Kiebrania ni nadra, na maana yake kamili ya kiusanifu haijulikani. Kulitohoa kama jina la eneo kunahifadhi kutokuwa na uhakika bila kulifasiri kwa usahihi usiothibitishwa.
- source_word: מַעֲרָב
  choice: upande wa magharibi
  rationale: Hutaja mwelekeo au upande wa magharibi; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: אַרְבָּעָה
  choice: walinzi wanne
  rationale: Ingawa matini ina namba pekee, muktadha wa ugawaji wa walinzi wa malango unaruhusu nomino iliyodokezwa kuwekwa wazi kwa usomaji wa asili.
- source_word: מְסִלָּה
  choice: barabara
  rationale: Neno linaweza kumaanisha barabara, njia iliyoinuliwa, au barabara kuu. 'Barabara' ni tafsiri ya kawaida isiyoweka ufafanuzi wa kiusanifu usio na hakika.
- source_word: שְׁנַיִם
  choice: wawili
  rationale: Namba hii inawahusu walinzi waliodokezwa na muktadha, hivyo ngeli ya watu imetumiwa.
- source_word: לְ
  choice: kwa / kwenye
  rationale: Vihusishi vinavyorudiwa vinaonyesha maeneo ya mgawo; 'kwa' na 'kwenye' ni vya asili katika Kiswahili kulingana na mazingira ya kila kishazi.
