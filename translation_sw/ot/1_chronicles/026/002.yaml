base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/002.yaml
  text: 'And Shelemiah had sons: Zechariah the firstborn[a], Jediael the second, Zebadiah the third[b], and Jathniel the fourth.'
translation:
  language: sw
  text: Naye Meshelemia alikuwa na wana:[a] Zekaria, mzaliwa wa kwanza; Yediaeli, wa pili; Zebadia, wa tatu; na Yathnieli,[b] wa nne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “na kwa Meshelemia, wana,” muundo wa nasaba unaomaanisha kwamba Meshelemia alikuwa na wana.'
    reason: cultural_note
  - marker: b
    text: Jina hili pia huandikwa “Jathnieli” katika mapokeo yanayotumia J badala ya Y kwa konsonanti ya kwanza ya Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמְשֶׁלֶמְיָהוּ בָּנִים
  choice: Naye Meshelemia alikuwa na wana hawa
  rationale: Kiebrania kinasema kihalisi, “na kwa Meshelemia, wana.” Huu ni muundo usio na kitenzi unaoonyesha kwamba hao ndio wana wake; Kiswahili cha kawaida huhitaji “alikuwa na wana hawa.” Kiunganishi “Naye” kinadumisha uhusiano na orodha iliyotangulia.
- source_word: זְכַרְיָהוּ
  choice: Zekaria
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: הַבְּכוֹר
  choice: mzaliwa wa kwanza
  rationale: Neno hili humaanisha mwana aliyezaliwa kwanza, si tu aliye mkubwa kwa umri.
- source_word: יְדִיעֲאֵל
  choice: Yediaeli
  rationale: Unukuzi wa jina unaofuata matamshi ya Kiebrania na mazoea ya Kiswahili.
- source_word: הַשֵּׁנִי
  choice: wa pili
  rationale: Namba ya mpangilio imetafsiriwa moja kwa moja, huku nomino “mwana” ikieleweka kutokana na muktadha.
- source_word: זְבַדְיָהוּ
  choice: Zebadia
  rationale: Umbo la jina linalofaa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: הַשְּׁלִישִׁי
  choice: wa tatu
  rationale: Namba ya mpangilio imetafsiriwa moja kwa moja na kwa ulinganifu.
- source_word: יַתְנִיאֵל
  choice: Yathnieli
  rationale: Herufi ya kwanza ya Kiebrania ni yod, hivyo “Y” huiwakilisha moja kwa moja katika Kiswahili; mwisho “-eli” unaakisi sehemu ya jina inayorejelea Mungu.
- source_word: הָרְבִיעִי
  choice: wa nne
  rationale: Namba ya mpangilio imetafsiriwa moja kwa moja na kwa ulinganifu.
