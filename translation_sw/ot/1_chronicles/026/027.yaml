translation:
  language: sw
  text: Kutoka katika vita na nyara, walikuwa wameweka wakfu vitu ili kuimarisha nyumba ya Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kutoka katika mapigano na nyara, walikuwa wameweka wakfu [vitu].” Kiebrania hakitaji wazi yambwa wa “walikuwa wameweka wakfu”; “nyara” pia yaweza kutafsiriwa “mateka ya vita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַמִּלְחָמוֹת
  choice: Kutokana na vita
  rationale: מִן huonyesha chanzo, na wingi מִלְחָמוֹת una maana ya vita au mapigano; “vita” ni usemi mpana na wa kawaida katika Kiswahili.
- source_word: וּמִן הַשָּׁלָל
  choice: na nyara
  rationale: שָׁלָל ni mali iliyotekwa vitani; “nyara” ni neno la kawaida na fasaha katika muktadha huu.
- source_word: הִקְדִּישׁוּ
  choice: walikuwa wameviweka wakfu
  rationale: Hifili ya קדשׁ hapa ina maana ya kutenga vitu kwa kusudi takatifu. Kiambishi “-vi-” kinadokeza vitu vilivyotengwa, ingawa Kiebrania hakitaji yambwa wazi; wakati timilifu uliotangulia unafaa katika mtiririko wa simulizi.
- source_word: לְחַזֵּק
  choice: ili kuimarisha
  rationale: Kitenzi חזק humaanisha kufanya imara au kutia nguvu. “Kuimarisha” huhifadhi maana hiyo bila kuibana kuwa ukarabati pekee.
- source_word: לְבֵית יְהוָה
  choice: nyumba ya Yahwe
  rationale: “Nyumba” huhifadhi sitiari ya Kiebrania kwa hekalu, na יהוה imetafsiriwa kwa jina “Yahwe.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana Tetragramatoni moja kwa moja; “Yahwe” huhifadhi jina la agano bila kulibadili kuwa cheo.
- issue: Kusudi la mali iliyowekwa wakfu
  choice: ili kuimarisha nyumba ya Yahwe
  alternative: ili kukarabati nyumba ya Yahwe; ili kutegemeza nyumba ya Yahwe
  rationale: לְחַזֵּק inaweza kumaanisha kuimarisha, kutegemeza, au katika muktadha huu hata kukarabati. “Kuimarisha” huhifadhi upana na mvutano wa maana ya asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nyumba ya Yahwe” imehifadhi nahau ya Kiebrania, na “kuimarisha” huepuka kuamua kimyakimya kwamba kazi iliyokusudiwa ilikuwa ukarabati pekee.
