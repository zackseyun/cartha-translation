  yaml_path: translation/ot/1_chronicles/026/005.yaml
  text: Ammiel the sixth[a], Issachar the seventh, Peullethai the eighth; for God had blessed him.
translation:
  language: sw
  text: Amieli, wa sita[a]; Isakari, wa saba; Peuletai, wa nane; kwa maana Mungu alikuwa amembariki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu Mungu alimbariki.” Kiunganishi na kitenzi cha Kiebrania vinaweza kutafsiriwa moja kwa moja zaidi bila wakati timilifu wa zamani.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּיאֵל
  choice: Ammieli
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: הַשִּׁשִּׁי
  choice: wa sita
  rationale: Nambari ya mpangilio yenye kibainishi, ikiendeleza orodha ya wana kwa utaratibu.
- source_word: יִשָׂשכָר
  choice: Isakari
  rationale: Hapa ni jina la mwana, si jina la kabila; limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: הַשְּׁבִיעִי
  choice: wa saba
  rationale: Nambari ya mpangilio inayolingana na muundo wa orodha.
- source_word: פְּעֻלְּתַי
  choice: Peuletai
  rationale: Jina la mtu limetoholewa kwa kufuata matamshi ya Kiebrania huku likibaki rahisi kusomwa kwa Kiswahili.
- source_word: הַשְּׁמִינִי
  choice: wa nane
  rationale: Nambari ya mpangilio inayokamilisha mfuatano.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinaanzisha sababu ya maelezo yaliyotangulia; “kwa maana” ni cha asili na cha heshima katika Kiswahili.
- source_word: בֵרֲכוֹ
  choice: alikuwa amembariki
  rationale: Kitenzi kina kiambishi cha nafsi ya tatu umoja kinachomrejelea Obed-edomu; wakati uliotimilika unaonyesha baraka iliyotangulia matokeo ya kuwa na wana wengi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu ni jina la kawaida la Mungu likiwa na maana ya umoja.
theological_decisions:
- issue: Mrejelewa wa kiwakilishi katika “amembariki”
  choice: Kiwakilishi kinamrejelea Obed-edomu, baba anayetajwa katika muktadha wa karibu.
  alternative: Kinaweza kueleweka kwa upana kuwa kinarejelea ukoo au nyumba yake.
  rationale: Muktadha wa 1 Mambo ya Nyakati 26:4–8 unaorodhesha wana na wazao wa Obed-edomu, hivyo kauli hii inaeleweka kwa kawaida kuwa idadi yao ilitokana na baraka ya Mungu juu yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. Muundo mfupi wa orodha ya Kiebrania umehifadhiwa kwa alama za mkato; majina yametoholewa kwa maumbo yanayosomeka kwa kawaida.
