  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kinasa lakini kinachoeleweka kwa msomaji wa kawaida. Mistari mirefu imetenganishwa kwa vistari ili kufafanua sintaksia iliyobanwa ya Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
