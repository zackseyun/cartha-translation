base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/021.yaml
  text: 'The sons of Ladan[b][a], the sons of the Gershonite belonging to Ladan: the heads of the fathers’ houses belonging to Ladan the Gershonite were Jehieli.'
translation:
  language: sw
  text: 'Wana wa Ladani[a], wana wa Gershoni wa Ladani: wakuu wa nyumba za mababu[b] wa Ladani, wa Gershoni, walikuwa Yehieli.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika orodha za nasaba, “wana” linaweza pia kumaanisha “wazao.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “wakuu wa nyumba za mababu,” yaani, viongozi wa jamaa au koo zilizotokana na mababu.
    reason: cultural_note
  - marker: c
    text: Kiebrania kinaweza pia kueleweka kuwa kinamtaja Yehieli mwenyewe; muundo wa sentensi ni mfupi na wenye utata.
    reason: textual_ambiguity
lexical_decisions:
- source_word: בְּנֵי
  choice: wana wa
  rationale: Neno hili kwa msingi humaanisha wana, lakini katika orodha za nasaba linaweza pia kumaanisha wazao; tafsiri hii inadumisha mtindo wa kinasa huku tanbihi ikitaja maana pana.
- source_word: לַעְדָּן
  choice: Ladani
  rationale: Jina limetoholewa kwa tahajia ya kawaida na inayosomeka kwa Kiswahili, likihifadhi umbo la jina la Kiebrania.
- source_word: הַגֵּרְשֻׁנִּי
  choice: Mgershoni
  rationale: Umbo la Kiebrania linaonyesha mtu au ukoo unaohusishwa na Gershoni; kiambishi M- ni cha kawaida kwa mtu wa kundi fulani katika Kiswahili.
- source_word: לְלַעְדָּן
  choice: waliokuwa wa ukoo wa Ladani
  rationale: Kiambishi לְ hapa kinaonyesha uhusiano au mgawanyo wa kinasa, si mwelekeo. Usemi huu unaweka wazi uhusiano huo katika Kiswahili.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: wakuu wa jamaa zao za mababu
  rationale: Huu ni usemi wa kinasa unaorejelea viongozi wa vitengo vya kifamilia vilivyotokana na babu mmoja. 'Jamaa za mababu' ni wazi zaidi kuliko tafsiri sisisi isiyo ya kawaida ya 'nyumba za baba'.
- source_word: יְחִיאֵלִי
  choice: wa ukoo wa Yehieli
  rationale: Katika muktadha huu umbo hilo linaweza kutaja Yehieli au kundi lake la kifamilia. Kwa kuwa 'wakuu' ni wingi, tafsiri ya kiukoo inaleta Kiswahili cha kawaida bila kuficha ugumu wa Kiebrania, ambao umeelezwa katika tanbihi.
