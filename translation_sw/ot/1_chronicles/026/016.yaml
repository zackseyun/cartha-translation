base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/016.yaml
  text: For Shuppim and Hosah[a], the lot fell to the west, with the Gate of Shallecheth on the ascending highway, guard corresponding to guard.
translation:
  language: sw
  text: Kwa Shupimu na Hosa, kura iliangukia upande wa magharibi, pamoja na Lango la Shalekethi[a] kwenye barabara ipandayo; lindo likikabiliana na lindo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda, “Lango la Kutupia Nje.” Huenda “Shalekethi” ni jina maalumu la lango linalotokana na kitenzi chenye maana ya “kutupa nje” au “kutupa chini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֻׁפִּים וּלְחֹסָה
  choice: Kwa Shupimu na Hosa
  rationale: Viambishi vya ל vinaonyesha mgao katika muktadha wa kugawa zamu kwa kura. Muundo huu ni wa kawaida katika Kiswahili na unaendeleza maana ya mgao.
- source_word: לַמַּעֲרָב
  choice: upande wa magharibi
  rationale: Neno hilo linaonyesha eneo la upande wa magharibi lililogawiwa kwa kura.
- source_word: עִם שַׁעַר שַׁלֶּכֶת
  choice: pamoja na Lango la Shalekethi
  rationale: עִם linaonyesha kuhusishwa kwa sehemu hiyo na lango. שַׁלֶּכֶת limehifadhiwa kama jina maalumu badala ya kufasiriwa moja kwa moja.
- source_word: בַּמְסִלָּה הָעוֹלָה
  choice: lililokuwa kwenye barabara inayopanda
  rationale: מְסִלָּה ni barabara iliyotengenezwa au njia kuu, na הָעוֹלָה huonyesha kwamba inapanda. Muundo huu ni wa asili na wazi kwa msomaji wa Kiswahili.
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: zamu ya ulinzi ikilingana na zamu ya ulinzi
  rationale: מִשְׁמָר inaweza kumaanisha zamu, lindo, au kituo cha ulinzi. לְעֻמַּת huonyesha ulinganifu au kukabiliana; 'ikilingana na' huhifadhi uhusiano huo bila kudokeza uadui.
