  yaml_path: translation/ot/1_chronicles/026/025.yaml
  text: 'And his brothers belonging to Eliezer: Rehabiah his son[a], and Jeshaiah his son, and Joram his son, and Zichri his son, and Shelomith his son.'
translation:
  language: sw
  text: 'Na ndugu zake wa Eliezeri[a]: Rehabia mwanawe, na Yeshaya mwanawe, na Yoramu mwanawe, na Zikri mwanawe, na Shelomothi mwanawe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi, “na ndugu zake wa Eliezeri.” Yaelekea muundo wa Kiebrania unatambulisha tawi la ukoo linalohusishwa na Eliezeri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶחָיו לֶאֱלִיעֶזֶר
  choice: Na ndugu zake wa upande wa Eliezeri
  rationale: Muundo wa Kiebrania ni mgumu na kwa uhalisi unasema karibu ‘na ndugu zake kwa Eliezeri.’ ‘Wa upande wa Eliezeri’ hudokeza tawi la ukoo linalohusishwa na Eliezeri bila kubadili ‘ndugu’ kuwa neno pana zaidi.
- source_word: רְחַבְיָהוּ
  choice: Rehabia
  rationale: Jina limetoholewa kwa namna inayosomeka kwa urahisi katika Kiswahili huku likifuata umbo la Kiebrania.
- source_word: בְנוֹ
  choice: mwanawe
  rationale: Kirai hiki cha ukoo kimerudiwa kila mara ili kuhifadhi wazi mfululizo wa vizazi uliomo katika Kiebrania.
- source_word: וִישַׁעְיָהוּ
  choice: na Yeshaya
  rationale: Umbo hili linatofautisha jina hilo na Isaya anayejulikana zaidi, huku likiwakilisha jina la Kiebrania kwa kawaida ya Kiswahili.
- source_word: וְיֹרָם
  choice: na Yoramu
  rationale: Huwakilisha umbo fupi la jina lililoandikwa hapa, badala ya umbo refu linalolingana nalo.
- source_word: וְזִכְרִי
  choice: na Zikri
  rationale: Utohozi wa moja kwa moja na unaosomeka wa jina la mtu.
- source_word: וּשְׁלֹמוֹת
  choice: na Shelomithi
  rationale: Utohozi unaotambulika wa jina hili la mtu katika Mambo ya Nyakati, bila kulitafsiri kama neno la kawaida.
