  text: בְּנֵ֣י שְׁמַֽעְיָ֗ה עָ֠תְנִי וּ/רְפָאֵ֨ל וְ/עוֹבֵ֧ד אֶלְזָבָ֛ד אֶחָ֖י/ו בְּנֵי חָ֑יִל אֱלִיה֖וּ וּ/סְמַכְיָֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/007.yaml
  text: 'The sons of Shemaiah: Othni[a], Rephael, Obed, Elzabad, whose brothers were capable men, Elihu and Semakiah.'
translation:
  language: sw
  text: Wana wa Shemaya walikuwa Othni, Refaeli, Obedi, Elzabadi, na ndugu zake—Elihu na Semakia—ambao walikuwa watu hodari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mashujaa” au “watu wenye uwezo.” Kirai cha Kiebrania kinaweza kumaanisha nguvu, ushujaa au uwezo; hapa huenda kinakazia kufaa kwao katika huduma.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שְׁמַעְיָה
  choice: Wana wa Shemaya
  rationale: Muundo wa nomino tegemezi unaonyesha uhusiano wa ukoo; mtindo huu unafaa orodha ya nasaba.
- source_word: עָתְנִי
  choice: Othni
  rationale: Jina limenukuliwa kwa herufi za Kiswahili huku umbo la Kiebrania likihifadhiwa.
- source_word: וּרְפָאֵל
  choice: Refaeli
  rationale: Jina limetoholewa kwa matamshi ya kawaida ya Kiswahili na linaakisi umbo la Kiebrania.
- source_word: וְעוֹבֵד
  choice: Obedi
  rationale: Jina limetoholewa kwa namna ya kawaida katika Kiswahili cha Biblia.
- source_word: אֶלְזָבָד
  choice: Elzabadi
  rationale: Jina limetoholewa kwa namna inayoeleweka kwa msomaji wa Kiswahili.
- source_word: אֶחָיו
  choice: ndugu zake
  rationale: Kiambishi cha Kiebrania ni cha nafsi ya tatu umoja, hivyo ‘zake’ kinahifadhi rejeo la umoja, ambalo kwa karibu zaidi linamrejelea Elzabadi.
- source_word: בְּנֵי חָיִל
  choice: watu hodari
  rationale: Kirai kinaweza kueleza nguvu, ushujaa au uwezo. ‘Watu hodari’ ni cha asili katika Kiswahili na hakifungi maana kwenye vita pekee.
- source_word: אֱלִיהוּ
  choice: Elihu
  rationale: Jina limehifadhiwa katika umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: וּסְמַכְיָהוּ
  choice: Semakia
  rationale: Jina limetoholewa kutoka umbo la Kimasora kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
