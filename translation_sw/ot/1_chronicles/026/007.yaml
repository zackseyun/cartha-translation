translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayofaa orodha ya nasaba. Mistari mirefu imetumika kubainisha kwamba Elihu na Semakia ndio ndugu wanaotajwa bila kubadili kiambishi cha umoja katika ‘ndugu zake’.
