base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/012.yaml
  text: For these divisions of the gatekeepers[a], the chief men had assigned duties corresponding to those of their brothers, to minister in the house of Yahweh.
translation:
  language: sw
  text: Kwa makundi haya ya walinda-malango[a], viongozi wa wanaume hao walikuwa na majukumu ya huduma sambamba na yale ya ndugu zao, ili kuhudumu katika nyumba ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viongozi wa wanaume hao walikuwa na zamu/majukumu pamoja na ndugu zao.” Kiebrania ni kifupi, na מִשְׁמָרוֹת linaweza pia kutafsiriwa “zamu” au “majukumu ya huduma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֵלֶּה מַחְלְקוֹת
  choice: Kwa makundi haya
  rationale: Kirai hiki kinatanguliza mpangilio unaotajwa. “Makundi” ni neno la kawaida na linaloeleweka kwa vitengo vya huduma vilivyopangwa.
- source_word: הַשֹּׁעֲרִים
  choice: walinda malango
  rationale: Neno hili linawahusu watu waliolinda na kusimamia malango; “walinda malango” ni Kiswahili cha sasa na cha wazi.
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: wakuu wa wanaume
  rationale: Tafsiri hii inadumisha maana ya uongozi katika רָאשֵׁי na pia rejeo la kiume la גְּבָרִים bila kulifanya neno hilo kuwa la kijeshi.
- source_word: מִשְׁמָרוֹת
  choice: walikuwa na zamu
  rationale: Nomino hiyo inaweza kumaanisha zamu za ulinzi au majukumu ya huduma. Kitenzi “walikuwa na” kinakamilisha kwa njia ya kawaida sentensi ya Kiebrania iliyofupishwa bila kuingiza wazo mahususi la kwamba mtu fulani aliwagawia zamu hizo.
- source_word: לְעֻמַּת אֲחֵיהֶם
  choice: zilizolingana na za ndugu zao
  rationale: לְעֻמַּת inaonyesha ulinganifu au uhusiano wa sambamba; “ndugu zao” inadumisha neno halisi la kifamilia la Kiebrania.
- source_word: לְשָׁרֵת
  choice: ili kuhudumu
  rationale: Katika muktadha wa hekalu, “kuhudumu” huonyesha huduma takatifu kwa usahihi zaidi kuliko neno pana “kutumikia.”
- source_word: בְּבֵית יְהוָה
  choice: katika nyumba ya Yahwe
  rationale: “Nyumba” inadumisha sitiari ya Kiebrania kuhusu hekalu, na jina la agano יְהוָה limetoholewa kuwa “Yahwe.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni. “Yahwe” linadumisha jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Iwapo גְּבָרִים litafsiriwe kwa neno mahususi kwa wanaume
  choice: wanaume
  alternative: watu; viongozi
  rationale: Neno la Kiebrania ni la kiume kwa wingi na katika mazingira haya linawahusu wahudumu wa kiume wa hekalu; kwa hiyo rejeo hilo halijawekwa katika lugha isiyoonyesha jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo umewekwa wazi kiasi kwa kuongeza “walikuwa na,” huku ufupi na uwezekano wa maana zaidi ya moja katika Kiebrania ukihifadhiwa katika tanbihi.
