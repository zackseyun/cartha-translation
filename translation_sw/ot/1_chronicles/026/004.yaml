base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/004.yaml
  text: 'And Obed-edom had sons: Shemaiah the firstborn[a], Jehozabad the second, Joah the third, and Sakar the fourth[b], and Nethanel the fifth.'
translation:
  language: sw
  text: 'Obed-Edomu alikuwa na wana[a]: Shemaya, mzaliwa wa kwanza; Yehozabadi, wa pili; Yoa, wa tatu; Sakari, wa nne[b]; na Nethaneli, wa tano.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “Na kwa Obed-Edomu, wana”; kitenzi “alikuwa na” kimeongezwa ili kuwasilisha kwa Kiswahili cha kawaida muundo huu wa nasaba.
    reason: lexical_alternative
  - marker: b
    text: Jina “Sakari” hapa ni tofauti na “Isakari” katika umbo la Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/עֹבֵד אֱדֹם בָּנִים
  choice: Obed-Edomu alikuwa na wana
  rationale: Muundo wa Kiebrania ni wa kifupi, kihalisi ‘na kwa Obed-Edomu, wana.’ Kiswahili cha kawaida huhitaji kitenzi; ‘alikuwa na wana’ huwasilisha kwa ufasaha kanuni hii ya nasaba bila kuongeza maana.
- source_word: שְׁמַעְיָה הַ/בְּכוֹר
  choice: Shemaya, mzaliwa wa kwanza
  rationale: Jina limetoholewa kwa matamshi ya Kiswahili, na בכור limetafsiriwa ‘mzaliwa wa kwanza’ ili kuhifadhi maana ya kifamilia, si mpangilio wa namba tu.
- source_word: יְהוֹזָבָד הַ/שֵּׁנִי
  choice: Yehozabadi, wa pili
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania; kivumishi cha mpangilio kimetafsiriwa kwa Kiswahili cha kawaida.
- source_word: יוֹאָח הַ/שְּׁלִשִׁי
  choice: Yoa, wa tatu
  rationale: יוֹאָח limetoholewa ‘Yoa’ kwa kufuata muundo wa sauti wa Kiebrania na tahajia ya Kiswahili.
- source_word: וְ/שָׂכָר הָ/רְבִיעִי
  choice: Sakari, wa nne
  rationale: שָׂכָר ni jina Sakar/Sakari katika mstari huu, si jina la kabila Isakari. Umbo ‘Sakari’ linaendana na utamkaji wa Kiswahili huku tofauti hiyo ikibaki wazi katika tanbihi.
- source_word: וּ/נְתַנְאֵל הַ/חֲמִישִׁי
  choice: Nethaneli, wa tano
  rationale: Jina limetoholewa kutoka umbo la Kiebrania נתנאל, badala ya kutumia umbo lililoathiriwa na Kigiriki; ‘wa tano’ huonyesha wazi mpangilio.
