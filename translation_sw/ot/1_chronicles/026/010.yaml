base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/010.yaml
  text: 'And Hosah[a], from the sons of Merari, had sons: Shimri the chief, though he was not the firstborn; his father made him chief.'
translation:
  language: sw
  text: 'Naye Hosa, wa wana wa Merari, alikuwa na wana: Shimri, mkuu, ingawa hakuwa mzaliwa wa kwanza[a]; baba yake alimweka kuwa mkuu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana hakuwa mzaliwa wa kwanza”; kiunganishi cha Kiebrania kinaweza kueleweka kuwa cha maelezo au cha kuonyesha hali ya kinyume.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְחֹסָה
  choice: Naye Hosa
  rationale: Kiunganishi kinaendeleza orodha, na kihusishi pamoja na jina katika muktadha huu kinamtambulisha Hosa kama mwenye wana wanaotajwa. “Naye Hosa” ni ya kawaida na huunganisha taarifa hii na iliyotangulia.
- source_word: מִן בְּנֵי מְרָרִי
  choice: wa wana wa Merari
  rationale: Huhifadhi wazo la ukoo kwamba Hosa alikuwa miongoni mwa wazao wa Merari, kwa muundo unaoeleweka katika Kiswahili.
- source_word: בָּנִים
  choice: alikuwa na wana
  rationale: Kiebrania kina nomino “wana” bila kitenzi; kitenzi kimeongezwa kwa kiasi kidogo ili sentensi ya Kiswahili iwe kamili na ya kawaida.
- source_word: שִׁמְרִי
  choice: Shimri
  rationale: Jina la mtu limetoholewa kwa herufi za Kiswahili bila kutafsiri maana yake.
- source_word: הָרֹאשׁ
  choice: mkuu
  rationale: רֹאשׁ hapa hueleza cheo au uongozi wa jamaa, si kichwa cha mwili. “Mkuu” pia hudumisha urudiaji wa neno hilo katika sehemu ya mwisho.
- source_word: כִּי לֹא הָיָה בְכוֹר
  choice: ingawa hakuwa mzaliwa wa kwanza
  rationale: כִּי inaweza kuwa ya maelezo au sababu, lakini hapa usomaji wa hali ya kukubali kinyume unaonyesha tofauti kati ya kutokuwa mzaliwa wa kwanza na kuwekwa kuwa mkuu. Utata huo umetajwa katika tanbihi.
- source_word: בְכוֹר
  choice: mzaliwa wa kwanza
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa cheo cha kuzaliwa kwanza; muktadha tayari unaonyesha kuwa anazungumziwa mwana.
- source_word: וַיְשִׂימֵהוּ אָבִיהוּ לְרֹאשׁ
  choice: baba yake alimweka kuwa mkuu
  rationale: שׂים pamoja na ל huonyesha kuwekwa au kuteuliwa katika nafasi fulani. Tafsiri hii ni ya kawaida na huhifadhi uhusiano wa kimsamiati na “mkuu” iliyotangulia.
