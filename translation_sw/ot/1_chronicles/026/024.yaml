  source_fidelity: 'Tafsiri inadumisha muundo wa Kiebrania: kiunganishi cha mwendelezo, ukoo wa Shebueli kupitia Gershomu hadi Musa, na wajibu wake wa usimamizi juu ya hazina. “Hazina” inaweza kubeba maana ya hazina zilizohifadhiwa na, katika matumizi ya Kiswahili, pia inaweza kuwa nomino yenye umbo lilelile kwa wingi; hivyo haibani isivyostahili maana ya אֹצָרוֹת.'
