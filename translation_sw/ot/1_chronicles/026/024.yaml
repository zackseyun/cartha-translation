  text: וּ/שְׁבֻאֵל֙ בֶּן גֵּרְשׁ֣וֹם בֶּן מֹשֶׁ֔ה נָגִ֖יד עַל הָ/אֹצָרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/024.yaml
  text: And Shebuel son of Gershom[a], son of Moses[b], was chief over the treasuries.
translation:
  language: sw
  text: Naye Shebueli mwana wa Gershomu, mwana wa Musa, alikuwa mkuu[a] wa hazina[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kiongozi,” “msimamizi,” au “mwenye mamlaka.” Neno la Kiebrania humaanisha mtu aliyewekwa katika nafasi ya mamlaka.
    reason: lexical_alternative
  - marker: b
    text: Au “vyumba vya hazina.” Neno hili linaweza kumaanisha mahali mali za thamani zinapohifadhiwa au mali hizo zenyewe, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁבֻאֵל
  choice: Naye Shebueli
  rationale: Kiunganishi וּ kinahifadhi muunganiko wa mstari huu na orodha iliyotangulia; jina limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: בֶּן גֵּרְשׁוֹם בֶּן מֹשֶׁה
  choice: mwana wa Gershomu, mwana wa Musa
  rationale: 'Marudio ya בֶּן yanaonyesha mlolongo wa moja kwa moja wa ukoo: Shebueli ni mwana wa Gershomu, naye Gershomu ni mwana wa Musa.'
- source_word: נָגִיד
  choice: mkuu
  rationale: Katika muktadha huu wa kiutawala, neno hilo humaanisha mtu aliyewekwa katika mamlaka. “Mkuu” ni la asili na lenye heshima bila kuingiza wazo la ufalme.
- source_word: עַל
  choice: wa
  rationale: Muundo “mkuu wa” unaeleza kwa Kiswahili cha kawaida kuwa alikuwa na mamlaka na usimamizi juu ya hazina.
- source_word: הָ/אֹצָרוֹת
  choice: hazina
  rationale: “Hazina” linaweza kurejelea mali za thamani zilizohifadhiwa au mahali zinapohifadhiwa, hivyo linadumisha upana wa maana ya neno la Kiebrania katika muktadha huu.
