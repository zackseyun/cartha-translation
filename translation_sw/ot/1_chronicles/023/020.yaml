  text: 'The sons of Uzziel: Micah the first[b][a], and Isshiah the second.'
translation:
  language: sw
  text: 'Wana wa Uzieli: Mika, wa kwanza,[a] na Yishiya, wa pili.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mika, mkuu”; neno la Kiebrania kwa kawaida humaanisha “kichwa.”
    reason: lexical_alternative
  - marker: b
    text: Jina “Yishiya” pia hutoholewa kwa namna nyingine, kama vile “Yeshaya” au “Ishiya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa neno ‘mwana’ katika hali ya kuunganisha majina, likitanguliza orodha ya wana wa Uzieli.
- source_word: עֻזִּיאֵל
  choice: Uzieli
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili huku likifuata kwa karibu umbo la Kiebrania.
- source_word: מִיכָה
  choice: Mika
  rationale: Ni utohozi wa moja kwa moja na wa kawaida wa jina hili katika Kiswahili.
- source_word: הָרֹאשׁ
  choice: wa kwanza
  rationale: Ingawa רֹאשׁ maana yake ya msingi ni ‘kichwa’ na inaweza kumaanisha ‘mkuu,’ hapa inalinganishwa na ‘wa pili,’ hivyo ‘wa kwanza’ huwasilisha vizuri maana ya mpangilio bila kuficha uwezekano wa maana ya cheo.
- source_word: וְיִשִּׁיָּה
  choice: na Yishiya
  rationale: Kiunganishi וְ kimetafsiriwa ‘na,’ na jina limetoholewa kwa kuakisi yod ya mwanzo na konsonanti za Kiebrania.
- source_word: הַשֵּׁנִי
  choice: wa pili
  rationale: Ni kivumishi cha mpangilio kinachomtaja mwana wa pili katika orodha.
