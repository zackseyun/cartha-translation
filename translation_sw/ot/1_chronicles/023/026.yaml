base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/026.yaml
  text: And also[a], the Levites no longer need to carry the tabernacle and all its utensils for its service.
translation:
  language: sw
  text: Vilevile, Walawi hawana haja tena[a] ya kuibeba Maskani na vyombo vyake vyote kwa ajili ya huduma yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “hakuna haja kwa Walawi kuibeba Maskani na vyombo vyake vyote kwa ajili ya huduma yake.”'
    reason: Muundo wa Kiebrania unaweza kuwasilishwa kwa namna isiyo ya moja kwa moja kama “hakuna haja kwa Walawi”; maandishi makuu yanatumia Kiswahili cha kawaida na yanaonyesha kutokana na muktadha kwamba wajibu huo haukuhitajika tena.
lexical_decisions:
- source_word: וְגַם
  choice: Vilevile
  rationale: Muunganiko huu unaendeleza wazo lililotangulia na kuongeza jambo jingine. “Vilevile” huwasilisha maana hizo kwa Kiswahili cha kawaida bila ugumu.
- source_word: לַלְוִיִּם
  choice: Walawi
  rationale: Kiambishi ל־ kinaonyesha wale wanaohusika katika kauli hii; katika Kiswahili, “Walawi” hutumika kwa kawaida kama kiima cha kishazi.
- source_word: אֵין לָשֵׂאת
  choice: hawana haja tena ya kuibeba
  rationale: Muundo huu ni halisi zaidi kama “hakuna [kwao] kubeba,” lakini katika muktadha wa kupangwa upya kwa kazi za Walawi unaonyesha kwamba kubeba hakuhitajiki tena, si kwamba kumekatazwa.
- source_word: הַמִּשְׁכָּן
  choice: Maskani
  rationale: “Maskani” ni istilahi inayotambulika katika Kiswahili cha Biblia kwa hema takatifu la Israeli, na hapa inafaa zaidi kuliko neno la jumla la makao.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: na vyombo vyake vyote
  rationale: Tafsiri hii inadumisha kiunganishi וְ pamoja na maana kamili ya כָּל, huku כֵּלִים ikitafsiriwa kwa neno pana “vyombo” linalofaa katika muktadha wa ibada.
- source_word: לַעֲבֹדָתוֹ
  choice: kwa ajili ya huduma yake
  rationale: 'Tafsiri hii inahifadhi uhusiano wa kiwakilishi cha nafsi na Maskani: vyombo vilivyohusika katika huduma yake.'
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hawana haja tena” huepuka kutoa maana ya marufuku, na “na vyombo vyake vyote” hudumisha kwa usahihi ujumla wa maandishi ya Kiebrania.
