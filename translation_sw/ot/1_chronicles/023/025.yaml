source:
  edition: WLC
  text: כִּ֚י אָמַ֣ר דָּוִ֔יד הֵנִ֛יחַ יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל לְ/עַמּ֑/וֹ וַ/יִּשְׁכֹּ֥ן בִּ/ירוּשָׁלִַ֖ם עַד לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/025.yaml
  text: For David said[a], “Yahweh, the God of Israel, has given rest to his people, and he has dwelt in Jerusalem forever.”
translation:
  language: sw
  text: Kwa maana Daudi alisema, “Yahwe, Mungu wa Israeli, amewapa watu wake pumziko, naye anakaa Yerusalemu milele.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye amekaa Yerusalemu milele” au “naye atakaa Yerusalemu milele.” Kitenzi cha Kiebrania kinaweza kueleweka kuwa kinaonyesha makao ya Yahwe yaliyoimarishwa na yanayodumu huko.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya maagizo yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: אָמַר דָּוִיד
  choice: Daudi alisema
  rationale: Ni usimulizi wa moja kwa moja wa tendo lililopita.
- source_word: הֵנִיחַ
  choice: amewapa ... pumziko
  rationale: Hifili ya נוח ina maana ya kusababisha wapumzike au kuwapa pumziko; muundo huu huhifadhi maana ya kisababishi na matokeo yake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huhifadhi muundo wa umilikaji na tamko linalomfafanua Yahwe.
- source_word: לְעַמּוֹ
  choice: watu wake
  rationale: Kwa kitenzi 'kuwapa,' kiambishi cha yambwa 'wa-' na nomino hii huwasilisha walengwa wa pumziko kwa Kiswahili cha asili.
- source_word: וַיִּשְׁכֹּן
  choice: naye atakaa
  rationale: Katika mfululizo wa kauli ya Daudi, wayyiqtol hii inaweza kuonyesha matokeo au makao yatakayodumu; wakati ujao unasomeka kwa kawaida bila kuficha uwezekano wa hali iliyokwisha kuanzishwa.
- source_word: בִּירוּשָׁלִַם
  choice: Yerusalemu
  rationale: Uwasilishaji wa moja kwa moja wa mahali; Kiswahili hakihitaji kihusishi baada ya 'kukaa' katika matumizi haya.
- source_word: עַד לְעוֹלָם
  choice: milele
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha udumu usio na mwisho.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina maalumu la Mungu; kulitaja kama Yahwe huhifadhi tofauti kati ya jina hilo na cheo.
- issue: Wakati na hali ya makao ya Yahwe Yerusalemu
  choice: naye atakaa Yerusalemu milele
  alternative: naye amekaa Yerusalemu milele / naye anakaa Yerusalemu milele
  rationale: וַיִּשְׁכֹּן inaweza kueleweka katika muktadha huu kama matokeo yanayoendelea au makao ya kudumu. Tafsiri kuu hutumia wakati ujao, huku tanbihi ikihifadhi uwezekano wa hali iliyokwisha kuanzishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa sasa na unaoeleweka kwa wasomaji wa kawaida. 'Pumziko' hudumisha istilahi muhimu ya kibiblia, na 'Yahwe' hutumiwa kama jina binafsi.
