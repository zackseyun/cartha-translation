id: 1CH.23.30
reference: 1 Chronicles 23:30
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לַ/עֲמֹד֙ בַּ/בֹּ֣קֶר בַּ/בֹּ֔קֶר לְ/הֹד֥וֹת וּ/לְ/הַלֵּ֖ל לַ/יהוָ֑ה וְ/כֵ֖ן לָ/עָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/030.yaml
  text: and to stand every morning to give thanks and to praise Yahweh[a], and likewise at evening,
translation:
  language: sw
  text: na kusimama kila asubuhi ili kumshukuru na kumsifu Yahwe, na vivyo hivyo jioni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לַ/עֲמֹד
  choice: na kusimama
  rationale: Kitenzi hiki kinaonyesha wajibu au kusudi katika muktadha wa huduma rasmi, huku kikihifadhi picha halisi ya kusimama.
- source_word: בַּ/בֹּקֶר בַּ/בֹּקֶר
  choice: kila asubuhi
  rationale: Urudiaji wa Kiebrania una maana ya jambo linalofanywa kwa kawaida siku baada ya siku; “kila asubuhi” ni Kiswahili cha kawaida na wazi.
- source_word: לְ/הֹדֹות
  choice: ili kumshukuru
  rationale: Katika muktadha wa ibada, ידה katika Hifili humaanisha kutoa shukrani; umbo lenye kiambishi cha nafsi linafaa kwa Yahwe kama yule anayeshukuriwa.
- source_word: וּ/לְ/הַלֵּל
  choice: na kumsifu
  rationale: הלל katika Pieli humaanisha kusifu; tafsiri hii ni ya moja kwa moja bila kuongeza wazo la kuimba ambalo halijaelezwa wazi.
- source_word: לַ/יהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: וְ/כֵן
  choice: na vivyo hivyo
  rationale: Kirai hiki kinaonyesha kwamba wajibu huohuo wa shukrani na sifa ulifanywa pia wakati wa jioni.
- source_word: לָ/עָרֶב
  choice: jioni
  rationale: Hutaja wakati wa jioni unaolingana na huduma ya asubuhi; “jioni” ni fupi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Utoaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni kama jina la Mungu; “Yahwe” hulihifadhi kama jina binafsi bila kuligeuza kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umehifadhi kusimama kama tendo la huduma rasmi, na “kila asubuhi” umeonyesha maana ya urudiaji wa Kiebrania bila kuhitaji tanbihi.
