base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/024.yaml
  text: These were the sons of Levi by their fathers’ houses[a], the heads of the fathers’ houses, according to those counted of them, by the number of names, head by head, doing the work for the service of the house of Yahweh, from twenty years old and upward.
translation:
  language: sw
  text: 'Hawa ndio wana wa Lawi, kwa koo za baba zao: wakuu wa koo hizo, kama walivyoorodheshwa kwa hesabu ya majina, mmoja mmoja,[a] waliokuwa wakifanya kazi kwa ajili ya huduma ya nyumba ya Yahweh, kuanzia wenye umri wa miaka ishirini na zaidi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi “kwa mafuvu/vichwa vyao”; ni nahau inayomaanisha kwamba kila mtu alihesabiwa kivyake.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: kwa koo za baba zao
  rationale: Kirai hiki kinaainisha Walawi kwa vitengo vyao vya ukoo. “Koo za baba zao” ni Kiswahili cha kawaida kinachoonyesha nasaba ya upande wa baba bila kutumia lugha ngumu isiyo ya lazima.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: wakuu wa koo hizo
  rationale: Kiebrania kinasema kwa ufupi “wakuu wa baba,” lakini katika muktadha kinawarejelea viongozi wa koo za kifamilia. “Hizo” kinaunganisha kirai hiki na koo zilizotajwa kabla yake.
- source_word: לִפְקוּדֵיהֶם
  choice: kama walivyoorodheshwa
  rationale: Neno linahusu kuhesabiwa au kusajiliwa rasmi. “Walivyoorodheshwa” linaendeleza wazo la sensa yenye majina na linabaki la kawaida kwa msomaji wa sasa.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: kwa hesabu ya majina
  rationale: Taswira halisi ya majina yaliyohesabiwa katika orodha imehifadhiwa badala ya kuigeuza kuwa dhana ya jumla ya usajili.
- source_word: לְגֻלְגְּלֹתָם
  choice: mmoja mmoja
  rationale: Maana ya nahau ni kwamba kila mtu alihesabiwa kivyake. Tafsiri hii ni ya asili katika Kiswahili; taswira halisi ya “mafuvu/vichwa” imehifadhiwa katika tanbihi.
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: waliofanya kazi
  rationale: Hali ya umoja ya kitenzi-shirikishi cha Kiebrania inatumika kwa maana ya mkusanyiko. Wingi wa Kiswahili unapatana na kundi la Walawi waliohesabiwa.
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: kwa ajili ya huduma ya nyumba ya Yahweh
  rationale: “Huduma” inajumuisha wajibu wa ibada na kazi nyingine za hekalu bila kuingiza istilahi za baadaye za kimadhehebu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetafsiriwa kwa unukuzi “Yahweh,” si kwa kulibadilisha kuwa cheo.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: kuanzia wenye umri wa miaka ishirini na zaidi
  rationale: Hii inaeleza wazi na kwa Kiswahili cha kawaida kiwango cha chini cha umri wa wale waliohusika katika huduma.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko lina jina binafsi la Mungu, si cheo. “Yahweh” hulihifadhi kama jina huku likifuata unukuzi unaokubalika wa kisasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeweka muundo wa orodha ya Kiebrania lakini imetumia “mmoja mmoja” na “wenye umri wa miaka ishirini na zaidi” ili maana iwe wazi kwa msomaji wa kawaida.
