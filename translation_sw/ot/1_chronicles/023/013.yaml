source:
  edition: WLC
  text: בְּנֵ֥י עַמְרָ֖ם אַהֲרֹ֣ן וּ/מֹשֶׁ֑ה וַ/יִּבָּדֵ֣ל אַהֲרֹ֡ן לְֽ/הַקְדִּישׁ/וֹ֩ קֹ֨דֶשׁ קָֽדָשִׁ֤ים הֽוּא וּ/בָנָי/ו֙ עַד עוֹלָ֔ם לְ/הַקְטִיר֩ לִ/פְנֵ֨י יְהוָ֧ה לְ/שָׁרְת֛/וֹ וּ/לְ/בָרֵ֥ךְ בִּ/שְׁמ֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/013.yaml
  text: 'The sons of Amram: Aaron and Moses. And Aaron was set apart[a], he and his sons forever, to sanctify him as most holy, to burn incense before Yahweh, to minister to him, and to bless in his name forever.'
translation:
  language: sw
  text: 'Wana wa Amramu: Haruni na Musa. Haruni alitengwa, yeye na wanawe milele, ili awekwe wakfu kuwa mtakatifu sana[a], kufukiza uvumba mbele za Bwana, kumtumikia, na kubariki kwa jina lake milele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtakatifu wa watakatifu.” Kirai cha Kiebrania ni muundo wa kiwango cha juu, wenye maana ya “mtakatifu sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי עַמְרָם
  choice: Wana wa Amramu
  rationale: בְּנֵי humaanisha moja kwa moja ‘wana wa’; hapa Aroni na Musa ndio wanaotajwa mara moja, kwa hiyo hakuna haja ya kupanua kuwa ‘wazao.’
- source_word: וַיִּבָּדֵל
  choice: alitengwa
  rationale: Nifali ya בדל inaonyesha kutengwa kwa kusudi maalumu; ‘alitengwa’ ni ya kawaida, yenye heshima, na inafaa muktadha wa kikuhani.
- source_word: לְהַקְדִּישׁוֹ קֹדֶשׁ קָדָשִׁים
  choice: ili awekwe wakfu kuwa mtakatifu sana
  rationale: Tafsiri hii inahifadhi kiambishi cha umoja kinachomrejelea Aroni na maana ya kikuhani ya קדש. ‘Mtakatifu sana’ huwasilisha muundo wa Kiebrania wa kiwango cha juu bila kuufanya mahali patakatifu.
- source_word: הוּא וּבָנָיו עַד עוֹלָם
  choice: yeye na wanawe milele
  rationale: Inahifadhi umbo la ukoo na mwendelezo wa kudumu wa huduma ya Aroni na wanawe.
- source_word: לְהַקְטִיר
  choice: afukize uvumba
  rationale: Katika muktadha wa huduma ya makuhani, kitenzi hiki kwa kawaida huhusu kufukiza uvumba; ‘afukize uvumba’ ni usemi wazi wa Kiswahili.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: לִפְנֵי huonyesha kuwapo mbele zake, na jina יהוה limetolewa kama jina binafsi ‘Yahwe.’
- source_word: לְשָׁרְתוֹ
  choice: amtumikie
  rationale: שרת hapa ni huduma ya kikuhani. Kiambishi cha nafsi ya tatu umoja kinadumishwa, huku muktadha ukielekeza kwa Yahwe.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: na kubariki kwa jina lake
  rationale: ‘Kwa jina lake’ huhifadhi uwezekano wa maana ya kutumia jina au kutenda chini ya mamlaka yake bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Marejeo ya viambishi vya umoja katika לְהַקְדִּישׁוֹ na לְשָׁרְתוֹ
  choice: Katika ‘awekwe wakfu,’ kiambishi kinamrejelea Aroni; katika ‘amtumikie,’ kinamrejelea Yahwe.
  alternative: Kiambishi cha kwanza kueleweka bila mhusika maalumu au cha pili kumrejelea Aroni.
  rationale: Aroni ndiye mtajwa wa karibu baada ya kutengwa, kwa hiyo ndiye anayewekwa wakfu. Baada ya ‘mbele za Yahwe,’ huduma inaelekezwa kwa Yahwe. Tafsiri inafuata mtiririko huu wa kisarufi bila kuongeza maelezo ya kimadhehebu.
- issue: Maana ya קֹדֶשׁ קָדָשִׁים
  choice: mtakatifu sana
  alternative: patakatifu pa patakatifu; utakatifu wa utakatifu
  rationale: Hapa kirai kinaeleza hadhi ya kuwekwa wakfu ya Aroni, si sehemu ya patakatifu. Muundo wa Kiebrania ni wa kiwango cha juu, lakini tafsiri halisi zaidi inaweza kupotosha; mbadala umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umegawanywa kwa ufasaha wa kawaida, huku urudiaji wa ‘milele’ na majukumu ya kikuhani ukihifadhiwa.
