translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Akawagawa’ ni cha asili na huhifadhi yambwa ya Kiebrania; ‘wana wa Lawi’ huhifadhi mtazamo wa ukoo. Tahajia za majina zinafuata maumbo yaliyozoeleka katika Biblia za Kiswahili.
