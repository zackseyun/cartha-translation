lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: akawagawa
  rationale: Kitenzi חלק katika piel kina maana ya kugawa au kupanga kwa kugawanya; kiambishi cha nafsi ya tatu wingi kinahifadhiwa katika kiambishi -wa- (‘wao’).
- source_word: מַחְלְקוֹת
  choice: katika makundi
  rationale: Nomino hii humaanisha migawanyo au vikundi vilivyopangwa. ‘Katika makundi’ ni Kiswahili cha kawaida kinachoonyesha matokeo ya tendo la kugawa bila kuongeza wazo lisilokuwapo katika Kiebrania.
- source_word: לִבְנֵי לֵוִי
  choice: kwa ajili ya wana wa Lawi
  rationale: Huhifadhi usemi wa ukoo ulio wazi katika Kiebrania, badala ya kuufupisha kuwa ‘Walawi,’ na huandaa orodha ya wana watatu inayofuata.
- source_word: לְגֵרְשׁוֹן קְהָת וּמְרָרִי
  choice: Gershoni, Kohathi na Merari
  rationale: Majina haya yanatolewa kama orodha inayofafanua ‘wana wa Lawi.’ Kiambishi ל kilicho mbele ya Gershoni kinaweza kueleweka kuwa kinatawala orodha nzima; uwezekano wa kukihusisha wazi na kila jina umehifadhiwa katika tanbihi.
