  text: 'The sons of Hebron: Jeriah the first[a], Amariah the second, Jahaziel the third, and Jekameam the fourth.'
translation:
  language: sw
  text: 'Wana wa Hebroni: Yeriah, mkuu[a]; Amaria, wa pili; Yahazieli, wa tatu; na Yekameamu, wa nne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi, Kiebrania kinasema “kichwa” au “mkuu.” Katika muktadha wa orodha hii, neno hilo laweza pia kueleweka kuwa “wa kwanza,” sambamba na “wa pili,” “wa tatu,” na “wa nne.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa neno בן katika hali ya kuunganishwa, unaoanzisha orodha ya ukoo. “Wana wa” ni tafsiri ya moja kwa moja na inafaa kwa majina ya watoto wanaoorodheshwa hapa.
- source_word: חֶבְרוֹן
  choice: Hebroni
  rationale: Jina la mtu limetoholewa kwa tahajia inayotumika kwa kawaida katika Kiswahili.
- source_word: יְרִיָּהוּ
  choice: Yeria
  rationale: Jina limetoholewa kwa mfumo wa kawaida wa majina ya Biblia katika Kiswahili.
- source_word: הָרֹאשׁ
  choice: wa kwanza[a]
  rationale: Ingawa רֹאשׁ kwa kawaida humaanisha “kichwa” au “mkuu,” hapa linafanya kazi kama neno la mpangilio sambamba na “wa pili,” “wa tatu,” na “wa nne.” Tanbihi inahifadhi maana yake ya karibu zaidi na Kiebrania.
- source_word: אֲמַרְיָה
  choice: Amaria
  rationale: Jina limetoholewa kwa mtindo wa kawaida wa Kiswahili.
- source_word: הַשֵּׁנִי
  choice: wa pili
  rationale: Ni neno la mpangilio linaloonyesha nafasi ya pili katika orodha.
- source_word: יַחֲזִיאֵל
  choice: Yahazieli
  rationale: Jina limetoholewa kwa kuwakilisha sauti za Kiebrania kwa njia ya kawaida na inayosomeka katika Kiswahili.
- source_word: הַשְּׁלִישִׁי
  choice: wa tatu
  rationale: Ni neno la mpangilio linaloonyesha nafasi ya tatu katika orodha.
- source_word: וִיקַמְעָם
  choice: na Yekameamu
  rationale: Kiunganishi וְ kimetafsiriwa “na,” huku jina likitoholewa kwa mfumo wa sauti unaofaa Kiswahili.
- source_word: הָרְבִיעִי
  choice: wa nne
  rationale: Ni neno la mpangilio linaloonyesha nafasi ya nne katika orodha.
