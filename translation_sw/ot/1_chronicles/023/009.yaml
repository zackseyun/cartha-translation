base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/009.yaml
  text: 'The sons of Shimei: Shelomoth[a], Haziel, and Haran—three. These were the heads of the fathers’ houses of Ladan.'
translation:
  language: sw
  text: Wana wa Shimei walikuwa Shelomoth[a], Hazieli, na Harani—watatu. Hao walikuwa wakuu wa koo za Laadani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Shelomithi,” unukuzi mwingine wa jina hili.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שִׁמְעִי
  choice: Wana wa Shimei
  rationale: Katika orodha hii ya ukoo, kirai hiki kinawataja wana wa moja kwa moja wa Shimei; kwa hiyo “wana” ni sahihi kuliko “wazao.”
- source_word: שלמות
  choice: Shelomoth
  rationale: Jina limenukuliwa kwa kufuata umbo la Kiebrania lililowekewa irabu katika WLC; “Shelomithi” ni namna nyingine inayotumiwa katika mapokeo.
- source_word: וַחֲזִיאֵל
  choice: Hazieli
  rationale: Unukuzi unafuata moja kwa moja umbo חֲזִיאֵל bila kuingiza jina tofauti lakini linalohusiana, “Yahazieli.”
- source_word: וְהָרָן
  choice: na Harani
  rationale: Kiunganishi na jina la mtu vimetolewa kwa unukuzi wa kawaida unaofaa Kiswahili.
- source_word: שְׁלֹשָׁה
  choice: watatu
  rationale: Idadi iliyotajwa wazi katika Kiebrania imehifadhiwa, huku ngeli ya watu ikitumiwa kwa Kiswahili cha kawaida.
- source_word: אֵלֶּה
  choice: Hao
  rationale: Kiwakilishi hiki kinawarejelea wale watu watatu waliotajwa, bila kuongeza nomino isiyokuwamo katika chanzo.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: wakuu wa jamaa za ukoo
  rationale: Katika muktadha wa nasaba na utawala wa Mambo ya Nyakati, kirai hiki humaanisha viongozi wa vitengo vya kifamilia vinavyotokana na mababu; tafsiri hii ni ya asili na inaeleweka kwa wasomaji wa Kiswahili.
- source_word: לְלַעְדָּן
  choice: wa Ladani
  rationale: Kihusishi ל kinaonyesha uhusiano wao na ukoo au mstari wa Ladani.
