base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/017.yaml
  text: 'The sons of Eliezer: Rehabiah was the chief[a], and Eliezer had no other sons; but the sons of Rehabiah became very many.'
translation:
  language: sw
  text: 'Wana wa Eliezeri: Rehabia alikuwa mkuu[a]. Eliezeri hakuwa na wana wengine, lakini wana wa Rehabia waliongezeka sana.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wa kwanza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי אֱלִיעֶזֶר
  choice: 'Wana wa Eliezeri:'
  rationale: Muundo huu unaanzisha orodha ya ukoo. Kiswahili cha kichwa kifupi kinatoa maana hiyo kwa njia ya kawaida bila kupoteza uhusiano wa ukoo.
- source_word: רְחַבְיָה
  choice: Rehabia
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: הָרֹאשׁ
  choice: alikuwa mkuu[a]
  rationale: Neno hili linaweza kumaanisha mkuu wa ukoo au wa kwanza. Matini kuu inadumisha maana ya hadhi/uongozi, huku tanbihi ikihifadhi uwezekano wa mpangilio wa kuzaliwa.
- source_word: וְלֹא הָיָה לֶאֱלִיעֶזֶר בָּנִים אֲחֵרִים
  choice: Eliezeri hakuwa na wana wengine
  rationale: Huu ni uwasilishaji wa kawaida wa Kiswahili wa muundo wa Kiebrania wa kumiliki, na unaonyesha wazi kwamba Rehabia alikuwa mwana wake pekee.
- source_word: וּבְנֵי רְחַבְיָה
  choice: lakini wana wa Rehabia
  rationale: Kiunganishi kimetafsiriwa kwa kuonyesha tofauti kati ya Eliezeri kutokuwa na wana wengine na Rehabia kuwa na wazao wengi.
- source_word: רָבוּ לְמָעְלָה
  choice: waliongezeka sana
  rationale: Kitenzi kinaonyesha kuongezeka kwa idadi, na לְמָעְלָה hapa inatilia mkazo kiwango kikubwa cha ongezeko hilo.
