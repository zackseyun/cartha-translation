  rationale: Ni jina la mwana wa Musa; “Gershomu” hutofautisha jina hili na Gershoni, ambalo ni jina jingine linalofanana katika Kiebrania.
- source_word: וֶ/אֱלִיעֶזֶר
  choice: na Eliezeri
  rationale: Kiunganishi ו kimetafsiriwa “na,” huku jina אֱלִיעֶזֶר likitolewa kwa umbo la Kiswahili “Eliezeri,” bila kulichanganya na Eleazari.
