  text: 'Wana wa Mushi: Mahli, Ederi, na Yeremothi—watatu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa neno ‘mwana’ katika hali ya kutegemea, unaotanguliza orodha ya ukoo; ‘Wana wa’ ni tafsiri ya moja kwa moja na ya kawaida hapa.
- source_word: מוּשִׁי
  choice: Mushi
  rationale: Jina la mtu limetoholewa kwa mwandiko unaoeleweka katika Kiswahili.
- source_word: מַחְלִי
  choice: Mahli
  rationale: Jina la mtu limetoholewa kwa kufuata umbo la Kiebrania.
- source_word: וְעֵדֶר
  choice: Ederi
  rationale: Kiunganishi וְ kimewakilishwa katika uratibu wa orodha, na jina עֵדֶר limetoholewa kwa umbo la Kiswahili ‘Ederi’.
- source_word: וִירֵמוֹת
  choice: Yeremothi
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa umbo linalotamkika kwa kawaida katika Kiswahili.
- source_word: שְׁלֹשָׁה
  choice: watatu
  rationale: Nambari ya kujumlisha waliotajwa imetafsiriwa kwa ngeli ya watu; dashihati inadumisha muundo wa orodha ikifuatiwa na jumla.
