base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/032.yaml
  text: And they were to keep charge of the tent of meeting[a], the charge of the holy place, and the charge of the sons of Aaron their brothers, for the service of the house of Yahweh.
translation:
  language: sw
  text: Nao walipaswa kutekeleza wajibu wa Hema la Kukutania, wajibu wa mahali patakatifu[a], na wajibu wa wana wa Aroni, ndugu zao, kwa ajili ya huduma ya nyumba ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “patakatifu.” Neno la Kiebrania linaweza kumaanisha mahali patakatifu au eneo takatifu kwa maana pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: Nao walipaswa kutekeleza wajibu
  rationale: Kitenzi שׁמר katika muhtasari huu wa majukumu ya Walawi kinaeleza jukumu walilokabidhiwa, si tukio rahisi la wakati uliopita. ‘Walipaswa’ huonyesha wajibu huo kwa Kiswahili cha kawaida.
- source_word: מִשְׁמֶרֶת
  choice: wajibu
  rationale: Nomino hii inaweza kumaanisha ulinzi, zamu, au jukumu lililokabidhiwa. ‘Wajibu’ linafaa kwa majukumu ya kiibada na linaweza kurudiwa kwa kawaida kama ilivyo katika Kiebrania.
- source_word: אֹהֶל מוֹעֵד
  choice: Hema la Kukutania
  rationale: Hili ni jina la moja kwa moja na linaloeleweka la hema takatifu ambako Mungu alikutana na watu wake; pia linahifadhi vipengele vya neno la Kiebrania.
- source_word: הַקֹּדֶשׁ
  choice: mahali patakatifu
  rationale: Katika muktadha wa ibada, neno hili hurejelea eneo takatifu, ingawa linaweza pia kutumiwa kwa maana pana ya patakatifu au vitu vitakatifu.
- source_word: בְּנֵי אַהֲרֹן אֲחֵיהֶם
  choice: wana wa Aroni, ndugu zao
  rationale: ‘Wana wa Aroni’ huhifadhi lugha ya kifamilia na utambulisho wa kikuhani wa Kiebrania; ‘ndugu zao’ huonyesha uhusiano wao na Walawi.
- source_word: לַעֲבֹדַת
  choice: katika huduma ya
  rationale: עֲבֹדָה hapa ni kazi au huduma inayofanywa katika mpangilio wa ibada; ‘huduma’ huhifadhi maana hiyo ya kiibada.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: ‘Nyumba’ hutafsiri בֵּית moja kwa moja, na ‘Yahwe’ huwasilisha jina la Mungu יְהוָה badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Kiebrania kinatumia jina la agano יְהוָה moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa wajibu wa Walawi na wana wa Aroni
  choice: wajibu wao kwa wana wa Aroni
  alternative: wajibu waliokabidhiwa na wana wa Aroni
  rationale: Muundo wa Kiebrania unasema kwa ufupi ‘wajibu wa wana wa Aroni’ bila kubainisha wazi kama ni wajibu kwao au uliotolewa nao. ‘Kwa wana wa Aroni’ ni Kiswahili kinachoeleweka bila kuongeza dhana ya kwamba makuhani ndio walioukabidhi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Urudiaji wa ‘wajibu’ umehifadhiwa ili kuakisi muundo wa Kiebrania. Herufi kubwa katika ‘Hema la Kukutania’ zinaonyesha jina maalumu la hema hilo.
