base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/012.yaml
  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel—four.'
translation:
  language: sw
  text: 'Wana wa Kohathi: Amramu, Ishari, Hebroni na Uzieli—wote wanne.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa neno בן katika hali ya muundo tegemezi, unaotambulisha orodha ya nasaba. Hapa majina manne yanatajwa kuwa wana wa moja kwa moja, hivyo “Wana wa” ni sahihi kuliko “Wazao wa.”
- source_word: קְהָת
  choice: Kohathi
  rationale: Jina la mtu limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: עַמְרָם
  choice: Amramu
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi ya Kiswahili yaliyozoeleka.
- source_word: יִצְהָר
  choice: Ishari
  rationale: Jina la mtu limetoholewa kwa umbo linalosomeka kwa urahisi katika Kiswahili huku likifuata jina la Kiebrania.
- source_word: חֶבְרוֹן
  choice: Hebroni
  rationale: Hapa ni jina la mtu katika orodha ya nasaba, ingawa jina hilo hutumiwa pia kwa mahali kwingine.
- source_word: וְעֻזִּיאֵל
  choice: na Uzieli
  rationale: Kiunganishi וְ kimetafsiriwa “na,” na jina limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: אַרְבָּעָה
  choice: wote wanne
  rationale: Namba hii inajumlisha wanaume wanne waliotajwa. “Wote wanne” ni usemi wa kawaida wa Kiswahili na hudumisha kazi ya neno hilo kama muhtasari wa orodha.
