  text: 'The sons of Merari: Mahli and Mushi. The sons of Mahli: Eleazar and Kish.'
translation:
  language: sw
  text: 'Wana wa Merari: Mahli na Mushi. Wana wa Mahli: Eleazari na Kishi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa neno בֵּן katika hali ya kutegemea, likianzisha orodha ya ukoo. “Wana wa” ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: מְרָרִי
  choice: Merari
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: מַחְלִי
  choice: Mahli
  rationale: Jina la mtu limetoholewa; linatokea mara mbili, kwanza kama mwana wa Merari na kisha katika kirai “wana wa Mahli.”
- source_word: וּמוּשִׁי
  choice: na Mushi
  rationale: Kiunganishi pamoja na jina la mtu; limetafsiriwa moja kwa moja kama jina la pili katika orodha ya wana wa Merari.
- source_word: בְּנֵי מַחְלִי
  choice: Wana wa Mahli
  rationale: Ni kichwa cha pili cha ukoo ndani ya aya. Kurudia “Wana wa” kunahifadhi muundo wa Kiebrania na kuweka uhusiano wa ukoo wazi.
- source_word: אֶלְעָזָר
  choice: Eleazari
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: וְקִישׁ
  choice: na Kishi
  rationale: Kiunganishi pamoja na jina la mtu; limetafsiriwa kama jina la pili la mwana anayetajwa chini ya Mahli.
