  text: וַ/יֶּאֱסֹף֙ אֶת כָּל שָׂרֵ֣י יִשְׂרָאֵ֔ל וְ/הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/002.yaml
  text: And he gathered all the leaders of Israel[a], and the priests and the Levites.
translation:
  language: sw
  text: Akawakusanya viongozi wote wa Israeli[a], pamoja na makuhani na Walawi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakuu wa Israeli,” “maofisa wa Israeli,” au “watawala wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: Akawakusanya
  rationale: Kitenzi cha masimulizi chenye waw-consecutive kinaendeleza tukio; “akawakusanya” ni Kiswahili cha kawaida kinachoakisi maana ya kukusanya watu.
- source_word: כָּל
  choice: wote
  rationale: Kiwakilishi hiki kinaonyesha ujumla, na “wote” kinakubaliana kwa kawaida na “viongozi” katika Kiswahili.
- source_word: שָׂרֵי יִשְׂרָאֵל
  choice: viongozi wa Israeli
  rationale: שָׂרִים inaweza kumaanisha wakuu, watawala, au maofisa. “Viongozi” ni wazi katika muktadha huu wa utawala bila kudokeza kwamba walikuwa wana wa mfalme.
- source_word: וְהַכֹּהֲנִים
  choice: pamoja na makuhani
  rationale: “Makuhani” ni tafsiri ya kawaida ya nomino hii ya wingi; “pamoja na” huunganisha makundi kwa Kiswahili cha asili huku ikihifadhi orodha ya Kiebrania.
- source_word: וְהַלְוִיִּם
  choice: na Walawi
  rationale: “Walawi” ni jina la kawaida la Kiswahili kwa kundi hili la kikabila na kiutumishi.
