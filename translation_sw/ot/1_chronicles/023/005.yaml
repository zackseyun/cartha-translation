  text: na elfu nne walinzi wa malango, na elfu nne wa kumsifu Yahweh kwa ala nilizotengeneza ili kumsifu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁעֲרִים
  choice: walinzi wa malango
  rationale: Neno hili linataja watu waliowekwa kusimamia malango; usemi huu ni wa kawaida na unaeleweka katika muktadha wa huduma ya Hekalu.
- source_word: מְהַלְלִים
  choice: waliomsifu
  rationale: Umbo la kushiriki linaonyesha jukumu la kudumu la kikundi hiki. Kiswahili huhitaji kishazi cha kitenzi ili kulieleza kwa ufasaha.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יְהוָה limetolewa kama jina binafsi, Yahweh, badala ya kubadilishwa kuwa cheo.
- source_word: בַּכֵּלִים
  choice: kwa vyombo
  rationale: כֵּלִים lina maana pana ya vyombo au vifaa. 'Vyombo' huhifadhi upana huo, huku muktadha wa kusifu ukidokeza matumizi ya kimuziki.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: nilivyotengeneza
  rationale: Hiki ni kishazi rejeshi kinachovirejelea vyombo na kuhifadhi nafsi ya kwanza ya kitenzi cha Kiebrania.
- source_word: לְהַלֵּל
  choice: kwa ajili ya kumsifu
  rationale: Kitenzi-jina chenye לְ kinaonyesha kusudi; kiwakilishi cha yambwa huweka wazi kwa Kiswahili kwamba Yahweh ndiye anayesifiwa, kama muktadha unavyoonyesha.
- source_word: וְאַרְבַּעַת אֲלָפִים ... וְאַרְבַּעַת אֲלָפִים
  choice: na elfu nne ... na elfu nne
  rationale: Marudio ya idadi yamehifadhiwa ili kutofautisha makundi mawili kama katika Kiebrania.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Kutumia 'Yahweh' huhifadhi jina binafsi la agano lililo katika matini badala ya kulibadilisha kuwa cheo.
- issue: Mhusika wa nafsi ya kwanza katika עָשִׂיתִי
  choice: nilivyotengeneza
  alternative: alivyotengeneza
  rationale: Matini ya Kiebrania ina nafsi ya kwanza umoja na haisemi wazi ndani ya mstari huu mhusika ni nani; tafsiri haiibadilishi kuwa nafsi ya tatu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa makundi mawili na hali ya nafsi ya kwanza umehifadhiwa; 'vyombo' limechaguliwa badala ya 'ala za muziki' ili kutopanua neno la Kiebrania kupita kiasi.
