  verdict: revise
  source_fidelity: 'Rasimu inafuata kwa jumla maana ya Kiebrania: wajibu wa Walawi ulihusisha kuwasaidia wana wa Haruni katika huduma ya nyumba ya Yahwe, pamoja na majukumu kuhusu nyua, vyumba, utakaso wa vitakatifu, na kazi ya huduma. Hata hivyo, kitenzi “kutakasa” hubadilisha nomino טָהֳרַת (“utakaso/purification”) kuwa tendo moja kwa moja na kinaweza kudokeza watendaji au kitendo mahsusi ambacho hakijaelezwa. “Utakaso wa kila kitu kitakatifu” huhifadhi muundo na utata wa chanzo vizuri zaidi.'
  naturalness: “Kuhusu nyua na vyumba” ni pana na haionyeshi wazi uwanja wa wajibu unaodokezwa na עַל. “Kusimamia nyua na vyumba” ni Kiswahili cha asili na kinaeleza wajibu bila kubainisha kwa ziada aina ya usimamizi. Msururu wa infinitivu pamoja na nomino umewekwa katika muundo unaosomeka vizuri.
  terminology: “Wana wa Haruni,” “huduma,” “nyumba ya Yahwe,” na “nyumba ya Mungu” zinafaa na zinadumisha tofauti ya majina ya Mungu katika Kiebrania. Dokezo b lilibadilishwa kwa sababu “kuwa mkononi mwa” si tafsiri sahihi ya moja kwa moja ya לְיַד; usemi huo ni “kando/ubavuni mwa” kwa maana ya kihalisi.
