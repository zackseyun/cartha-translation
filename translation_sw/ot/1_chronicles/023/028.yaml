    rationale: לְיַד humaanisha kihalisi “kando ya/ubavuni mwa” (kwa namna ya usemi, “katika huduma ya” au “kusaidia”), wala si “kuwa mkononi mwa.”
  - severity: low
    issue: “kuhusu nyua na vyumba” haionyeshi wajibu kwa uwazi
    rationale: Katika orodha ya majukumu, עַל inaelekea kuashiria eneo la usimamizi au wajibu. “Kusimamia” ni wazi na ya kawaida kwa Kiswahili.
