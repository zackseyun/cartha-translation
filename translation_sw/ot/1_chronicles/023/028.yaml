  text: כִּ֣י מַעֲמָדָ֞/ם לְ/יַד בְּנֵ֣י אַהֲרֹ֗ן לַ/עֲבֹדַת֙ בֵּ֣ית יְהוָ֔ה עַל הַ/חֲצֵרוֹת֙ וְ/עַל הַ/לְּשָׁכ֔וֹת וְ/עַֽל טָהֳרַ֖ת לְ/כָל קֹ֑דֶשׁ וּ/מַֽעֲשֵׂ֔ה עֲבֹדַ֖ת בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/028.yaml
  text: For their duty was to assist the sons of Aaron in the service of the house of Yahweh, concerning the courts and the chambers, and the purification of all that is holy, and the work of the service of the house of God.
translation:
  language: sw
  text: 'Kwa maana wajibu wao[a] ulikuwa kuwasaidia wana wa Haruni[b] katika huduma ya nyumba ya Yahwe: kusimamia nyua na vyumba, na utakaso wa kila kitu kitakatifu[c], na kufanya kazi ya huduma ya nyumba ya Mungu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafasi yao” au “wadhifa wao.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kando ya wana wa Haruni”; yaani, kuwa upande wao na kuwasaidia.
    reason: lexical_alternative
  - marker: c
    text: Au “utakaso wa kila kilicho kitakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza maelezo yanayofafanua sababu ya mgawo wa Walawi katika muktadha unaozunguka.
- source_word: מַעֲמָדָם
  choice: wajibu wao
  rationale: Nomino hii inaashiria nafasi au kazi waliyopewa; ‘wajibu wao’ inaeleza kwa Kiswahili cha kawaida kazi yao rasmi katika huduma ya hekalu.
- source_word: לְיַד בְּנֵי אַהֲרֹן
  choice: kuwasaidia wana wa Haruni
  rationale: Usemi huu ni ‘mkono/upande wa wana wa Haruni’ kihalisi, lakini hapa unaonyesha huduma ya kuwasaidia makuhani wa ukoo wa Haruni bila kulazimisha maana yenye nguvu zaidi ya kuwa chini ya mamlaka yao.
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: katika huduma ya nyumba ya Yahwe
  rationale: עֲבֹדָה hapa ni huduma ya kidini katika hekalu; ‘nyumba ya Yahwe’ inadumisha lugha ya hekalu na jina la Mungu lililo katika maandishi.
- source_word: עַל הַחֲצֵרוֹת וְעַל הַלְּשָׁכוֹת
  choice: kuhusu nyua na vyumba
  rationale: עַל inaonyesha maeneo yaliyohusika katika wajibu wao. ‘Nyua’ na ‘vyumba’ ni maneno ya kawaida na yanayoeleweka kwa maeneo hayo ya hekalu.
- source_word: וְעַל טָהֳרַת לְכָל קֹדֶשׁ
  choice: na kutakasa kila kilicho kitakatifu
  rationale: Inawasilisha kazi ya kudumisha usafi wa kiibada wa vitu vitakatifu huku ikihifadhi upana wa nomino ya pamoja קֹדֶשׁ.
- source_word: וּמַעֲשֵׂה עֲבֹדַת בֵּית הָאֱלֹהִים
  choice: na kufanya kazi ya huduma ya nyumba ya Mungu
  rationale: Inahifadhi kwa njia ya asili kwa Kiswahili nomino zote mbili zinazohusiana, ‘kazi’ na ‘huduma,’ badala ya kuziunganisha kuwa dhana moja.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana Tetragramatoni moja kwa moja; ‘Yahwe’ linahifadhi jina la agano badala ya kulibadilisha kuwa cheo kama ‘BWANA’.
- issue: Uhusiano wa Walawi na makuhani wa ukoo wa Haruni katika לְיַד בְּנֵי אַהֲרֹן
  choice: kuwasaidia wana wa Haruni
  alternative: kuwa kando ya wana wa Haruni; kuwa chini ya uongozi wa wana wa Haruni
  rationale: ‘Kuwasaidia’ linaonyesha jukumu lao la utegemezi na usaidizi bila kufanya dai kali zaidi kuhusu mfumo wa mamlaka kuliko usemi wa Kiebrania unavyoruhusu.
- issue: Maana ya טָהֳרַת לְכָל קֹדֶשׁ
  choice: kutakasa kila kilicho kitakatifu
  alternative: utakasaji wa kila kitu kitakatifu
  rationale: Tafsiri hii inaonyesha utakaso wa kiibada bila kubainisha kwa ziada vitu gani hasa vilihusika; wigo mpana wa usemi wa Kiebrania unabaki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umefanywa wa asili kwa Kiswahili huku msururu wa majukumu na tofauti kati ya ‘Yahwe’ na ‘Mungu’ ukihifadhiwa.
