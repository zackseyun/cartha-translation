  text: מֵ/אֵ֗לֶּה לְ/נַצֵּ֨חַ֙ עַל מְלֶ֣אכֶת בֵּית יְהוָ֔ה עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָ֑לֶף וְ/שֹׁטְרִ֥ים וְ/שֹׁפְטִ֖ים שֵׁ֥שֶׁת אֲלָפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/004.yaml
  text: Of these, twenty-four thousand were to oversee the work of the house of Yahweh, and six thousand were officers and judges.
translation:
  language: sw
  text: Kati yao, elfu ishirini na nne waliteuliwa kusimamia kazi ya nyumba ya Yahweh, na elfu sita walikuwa maafisa na waamuzi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: Kati yao
  rationale: Muundo wa מִן pamoja na אֵלֶּה unaonyesha sehemu iliyochaguliwa kutoka kwa Walawi waliotajwa kabla; “Kati yao” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: לְנַצֵּחַ
  choice: walikuwa wasimamie
  rationale: Katika muktadha huu, piel infinitive ya נצח ina maana ya kusimamia au kuongoza kazi. Muundo huu pia unaonyesha uteuzi au kusudi la wajibu wao.
- source_word: עַל מְלֶאכֶת
  choice: kazi ya
  rationale: מְלָאכָה hapa ni kazi au shughuli zinazofanywa; “kazi” ni pana na haibani maana kuwa ibada pekee.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: “Nyumba” huhifadhi taswira ya Kiebrania בַּיִת bila kuifafanua kimahususi kuwa hekalu, na jina la agano יְהוָה limetafsiriwa Yahweh.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: elfu ishirini na nne
  rationale: Hii ni tafsiri ya moja kwa moja ya idadi 24,000 kwa mpangilio wa kawaida wa Kiswahili.
- source_word: וְשֹׁטְרִים
  choice: maafisa
  rationale: שֹׁטְרִים ni watendaji wenye wajibu wa kiutawala; “maafisa” ni neno pana na la kawaida linalofaa muktadha huu.
- source_word: וְשֹׁפְטִים
  choice: waamuzi
  rationale: שֹׁפְטִים humaanisha watu wanaotekeleza wajibu wa kutoa hukumu; “waamuzi” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: שֵׁשֶׁת אֲלָפִים
  choice: elfu sita
  rationale: Hii ni tafsiri ya moja kwa moja ya idadi 6,000 kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania ina jina la agano יְהוָה moja kwa moja. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Sentensi imehifadhi mgawanyo wa makundi na maana ya kiutawala ya mstari.
