  text: And as for Moses, the man of God, his sons were counted among the tribe of Levi.
translation:
  language: sw
  text: Nao Musa, mtu wa Mungu, wanawe walihesabiwa katika kabila la Lawi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֹשֶׁה
  choice: Nao wana wa Musa
  rationale: Muundo wa mada uliotangulizwa unaweka Musa katika hali tofauti na mgawanyo uliotajwa kabla; Kiswahili asilia huhitaji kutaja wanawe mapema ili sentensi iwe wazi bila kubadili maana.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hili ni jina la heshima la kinabii lililozoeleka katika Kiswahili cha Biblia na linafuata muundo wa Kiebrania kwa karibu.
- source_word: בָּנָיו
  choice: wana wa Musa
  rationale: Nomino imetumiwa badala ya kiwakilishi pekee ili kuzuia utata katika Kiswahili na kudumisha rejeo la wazi kwa Musa.
- source_word: יִקָּרְאוּ
  choice: walihesabiwa
  rationale: Kitenzi cha Kiebrania kwa msingi ni ‘waliitwa/walitajwa,’ lakini katika muktadha wa orodha ya kikabila kina maana ya kuorodheshwa au kuhesabiwa kuwa sehemu ya kabila.
- source_word: עַל שֵׁבֶט הַלֵּוִי
  choice: miongoni mwa kabila la Lawi
  rationale: Kihusishi עַל hapa kinaonyesha kuhusishwa na au kuingizwa katika kabila, si mahali halisi ‘juu ya’ kabila.
theological_decisions:
- issue: Hadhi ya wana wa Musa katika mpangilio wa Walawi
  choice: walihesabiwa miongoni mwa kabila la Lawi
  alternative: waliitwa kwa jina la kabila la Lawi
  rationale: Muktadha wa 1 Mambo ya Nyakati 23 unahusu kuhesabu na kupanga Walawi. Tafsiri hii inaonyesha kwamba wana wa Musa waliwekwa katika hesabu ya Lawi, bila kudai cheo maalumu cha ukuhani ambacho maandishi hayasemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na rahisi kusomeka. ‘Nao’ huhifadhi mpito wa Kiebrania, na ‘Lawi’ hufuata matumizi ya kawaida ya majina ya kibiblia.
