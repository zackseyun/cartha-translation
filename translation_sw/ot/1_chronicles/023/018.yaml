lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa muundo tegemezi wa בֵּן, unaotambulisha wana wa Ishari katika orodha ya ukoo. “Wana wa” ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: יִצְהָר
  choice: Ishari
  rationale: Jina la mtu limetoholewa kwa kufuata matumizi ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: שְׁלֹמִית
  choice: Shelomithi
  rationale: Jina la mtu limetoholewa kwa namna inayosomeka kwa urahisi katika Kiswahili huku likihifadhi umbo la jina la Kiebrania.
- source_word: הָרֹאשׁ
  choice: mkuu
  rationale: Katika orodha hii ya ukoo na mpangilio wa huduma, neno lenye kibainishi linaweza kuonyesha mwenye cheo au aliyeongoza. “Mkuu” ni la asili na wazi katika Kiswahili, huku uwezekano wa maana “kichwa” au “wa kwanza” ukihifadhiwa katika tanbihi.
