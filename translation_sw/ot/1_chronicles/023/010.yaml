base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/010.yaml
  text: 'And the sons of Shimei: Jahath[a], Zina, Jeush, and Beriah. These were the sons of Shimei—four.'
translation:
  language: sw
  text: Na wana wa Shimei walikuwa Yahathi, Zina[a], Yeushi na Beria. Hawa ndio wana wa Shimei, wanne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya tafsiri husoma jina la pili kuwa “Ziza” (linganisha 1 Nya 23:11); Kiebrania hapa kinasomeka Zina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעִי
  choice: Na wana wa Shimei
  rationale: Kiunganishi וּ kimetafsiriwa kwa “Na” ili kuhifadhi mwendelezo wa orodha, na בְנֵי kwa “wana,” neno la kawaida katika nasaba ambalo pia linaweza kumaanisha wazao wa ukoo.
- source_word: יַחַת
  choice: Yahathi
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: זִינָא
  choice: Zina
  rationale: Muundo wa Kiebrania katika mstari huu unasomeka Zina; tofauti ya jina katika mstari unaofuata imehifadhiwa katika tanbihi.
- source_word: וִיעוּשׁ
  choice: Yeushi
  rationale: Jina limetoholewa kwa namna inayoeleweka katika Kiswahili; kiunganishi kilichoambatanishwa katika Kiebrania kimewakilishwa kiasili ndani ya orodha.
- source_word: וּבְרִיעָה
  choice: na Beria
  rationale: Kiunganishi kimetafsiriwa wazi ili kukamilisha orodha, na jina limetoholewa kwa tahajia ya Kiswahili.
- source_word: אֵלֶּה בְנֵי שִׁמְעִי אַרְבָּעָה
  choice: Hawa ndio wana wanne wa Shimei
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba majina yaliyotangulia ndiyo jumla ya wana wanne, huku ukihifadhi marudio ya “wana wa Shimei” yaliyomo katika Kiebrania.
