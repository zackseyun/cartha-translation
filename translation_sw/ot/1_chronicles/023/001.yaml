source:
  edition: WLC
  text: וְ/דָוִ֥יד זָקֵ֖ן וְ/שָׂבַ֣ע יָמִ֑ים וַ/יַּמְלֵ֛ךְ אֶת שְׁלֹמֹ֥ה בְנ֖/וֹ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/001.yaml
  text: David was old and full of days[a], and he made his son Solomon king over Israel.
translation:
  language: sw
  text: Daudi alikuwa mzee, mwenye siku nyingi[a], naye akamweka mwanawe Sulemani kuwa mfalme juu ya Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyeendelea sana katika miaka”; kwa neno halisi, “mzee na aliyeshiba siku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  choice: alikuwa mzee
  rationale: Hutoa kwa uwazi hali ya Daudi kuwa katika umri mkubwa bila kuongeza wazo lisilokuwamo katika Kiebrania.
- source_word: וְשָׂבַע יָמִים
  choice: mwenye siku nyingi
  rationale: Ni usemi wa Kiswahili unaoeleweka kwa urahisi na unaohifadhi taswira ya nahau ya Kiebrania ya kuwa amefikia wingi au utimilifu wa siku.
- source_word: וַיַּמְלֵךְ
  choice: akamweka ... kuwa mfalme
  rationale: 'Hifadhi nguvu ya kisababishi ya kitenzi cha Hifili: Daudi alimfanya au alimweka Sulemani atawale; haisemi tu kwamba Sulemani alianza kutawala, wala haiongezi sherehe ya kutawazwa.'
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  choice: mwanawe Sulemani
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unahifadhi wazi uhusiano wa Sulemani kuwa mwana wa Daudi.
- source_word: עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: Katika muktadha wa ufalme, עַל huonyesha mamlaka ya kutawala juu ya watu; 'Israeli yote' haijaandikwa hapa na haijaongezwa.
- source_word: וְ
  choice: naye
  rationale: Kiunganishi kinaendeleza simulizi na kuunganisha hali ya Daudi na tendo lake linalofuata kwa Kiswahili cha kawaida, bila kuongeza kielezi cha wakati kama 'basi' au 'wakati huo'.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Nahau ya Kiebrania imewasilishwa kwa 'mwenye siku nyingi' katika maandishi, huku tafsiri ya karibu zaidi ya maneno ikihifadhiwa katika tanbihi.
