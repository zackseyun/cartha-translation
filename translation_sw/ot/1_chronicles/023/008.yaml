  yaml_path: translation/ot/1_chronicles/023/008.yaml
  text: 'The sons of Ladan: Jehiel the head[a], and Zetham and Joel—three.'
translation:
  language: sw
  text: 'Wana wa Ladani: Yehieli, mkuu[a], na Zethamu na Yoeli—watatu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kiongozi” au “kichwa”; huenda Kiebrania kinamtaja Yehieli kuwa mwana aliyeongoza au mwana wa kwanza.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni hali ya muundo ya wingi wa neno ‘wana.’ Ingawa katika nasaba linaweza kumaanisha wazao, hapa linaanzisha orodha ya watu watatu wanaotajwa moja kwa moja.
- source_word: לַעְדָּן
  choice: Ladani
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: הָרֹאשׁ
  choice: mkuu
  rationale: Neno hili kwa msingi humaanisha ‘kichwa’ na kwa matumizi humaanisha mkuu au kiongozi. ‘Mkuu’ huhifadhi maana hiyo bila kuligeuza kuwa namba ya mpangilio ‘wa kwanza.’
- source_word: יְחִיאֵל
  choice: Yehieli
  rationale: Jina limetoholewa kwa mfumo wa majina ya Biblia unaofaa Kiswahili.
- source_word: וְזֵתָם
  choice: na Zethamu
  rationale: Kiunganishi na jina vimetafsiriwa moja kwa moja, huku jina likitoholewa kwa Kiswahili.
- source_word: וְיוֹאֵל
  choice: na Yoeli
  rationale: Kiunganishi na jina vimetafsiriwa moja kwa moja, huku jina likitoholewa kwa Kiswahili.
- source_word: שְׁלֹשָׁה
  choice: watatu
  rationale: Namba ya jumla imehifadhiwa wazi; ngeli ya watu ndiyo ya asili katika Kiswahili.
