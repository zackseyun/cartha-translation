base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/029.yaml
  text: and for the bread of the arrangement[a], and for the fine flour for the grain offering, and for the wafers of unleavened bread, and for what is cooked on the griddle, and for what is well-mixed, and for every measure and size,
translation:
  language: sw
  text: na mikate iliyopangwa[a], na unga laini kwa ajili ya sadaka ya nafaka, na mikate myembamba isiyotiwa chachu, na vilivyopikwa kwenye kikaango, na vilivyochanganywa, na vipimo vyote vya ujazo na ukubwa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mikate ya wonyesho” au “mikate ya Uwepo.” Kwa Kiebrania, kwa maana halisi ni “mikate ya mpangilio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: mikate iliyopangwa
  rationale: Kirai hiki kwa maana halisi ni mikate iliyowekwa kwa mpangilio. Tafsiri hii inabaki karibu na neno מַעֲרֶכֶת bila kuingiza moja kwa moja maana ya kiibada inayotokana na vifungu vingine.
- source_word: סֹלֶת
  choice: unga laini
  rationale: Ni unga uliosafishwa na kutumiwa katika matoleo; ‘unga laini’ ni Kiswahili cha kawaida na kinachoeleweka.
- source_word: מִנְחָה
  choice: sadaka ya nafaka
  rationale: Katika muktadha huu wa ibada neno hilo linamaanisha sadaka iliyotayarishwa kwa nafaka, si zawadi au sadaka kwa ujumla.
- source_word: רְקִיקֵי הַמַּצּוֹת
  choice: mikate myembamba isiyotiwa chachu
  rationale: רְקִיקִים ni mikate au maandazi membamba, na מַצּוֹת inaonyesha kuwa haikutiwa chachu. Kauli hii inaweka wazi sifa zote mbili kwa Kiswahili cha kawaida.
- source_word: מַּחֲבַת
  choice: vilivyopikwa kwenye kikaango
  rationale: Neno hilo hutaja chombo bapa cha kupikia, lakini sintaksia ya orodha inalenga vyakula vilivyotayarishwa. Tafsiri hii inaonyesha chakula pamoja na namna ya kukitayarisha.
- source_word: מֻּרְבָּכֶת
  choice: vilivyochanganywa vizuri
  rationale: Umbo la neno linaelekea kutaja kitu kilichochanganywa katika utayarishaji, huenda unga na mafuta. Tafsiri haibainishi viungo ambavyo mstari wenyewe hautaji.
- source_word: מְשׂוּרָה
  choice: vipimo vya ujazo
  rationale: Neno hili huelekea kumaanisha kipimo au kiasi kilichopimwa, hasa cha ujazo; ufafanuzi huu unalitofautisha kwa njia ya kawaida na מִדָּה.
- source_word: מִדָּה
  choice: ukubwa
  rationale: Likiwa pamoja na מְשׂוּרָה, neno hili linapanua wazo kutoka kiasi hadi kiwango au vipimo vya ukubwa.
