  text: For by the last words of David[a], the sons of Levi were numbered from twenty years old and upward.
translation:
  language: sw
  text: Kwa maana, kwa mujibu wa maneno ya mwisho ya Daudi[a], wazao wa Lawi walihesabiwa kuanzia umri wa miaka ishirini na kuendelea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maneno ya mwisho ya Daudi.” Kiebrania kinaweza kumaanisha kwamba kuhesabiwa huku kulifanywa kwa msingi wa agizo la mwisho la Daudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaunganisha mstari huu na maelezo yaliyotangulia kwa kutoa sababu au ufafanuzi.
- source_word: בְּדִבְרֵי דָוִיד הָאַחֲרֹנִים
  choice: kwa maneno ya mwisho ya Daudi
  rationale: Kihusishi ב kinaweza kuonyesha msingi au njia; tafsiri hii inadumisha uwezekano kwamba kuhesabiwa kulifanywa kwa msingi wa agizo la mwisho la Daudi.
- source_word: הָאַחֲרֹנִים
  choice: ya mwisho
  rationale: Huelekeza kwenye maneno au maagizo ya mwisho ya Daudi, si maneno ya baadaye tu.
- source_word: הֵמָּה מִסְפַּר
  choice: walihesabiwa
  rationale: Kiebrania ni cha mkato, lakini katika muktadha kinaonyesha kwamba wazao wa Lawi walijumuishwa katika hesabu.
- source_word: בְּנֵי לֵוִי
  choice: wazao wa Lawi
  rationale: Ingawa kwa umbo ni ‘wana wa Lawi,’ hapa usemi unawahusu watu wa ukoo wa Lawi kwa ujumla; ‘wazao’ ni wazi na wa kawaida katika Kiswahili.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וּלְמַעְלָה
  choice: kuanzia umri wa miaka ishirini na kuendelea
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kwa usahihi kiwango cha umri wa miaka ishirini na zaidi.
