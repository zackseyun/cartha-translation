translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida na unaoeleweka. Mpangilio wa sentensi umewekwa kwa ufupi ili kuakisi mtindo wa simulizi na nasaba wa Mambo ya Nyakati. Alama za tanbihi zimepangwa upya kwa usahihi: maelezo ya undugu yanafuata ‘ndugu zao,’ na mbadala wa kitenzi cha ndoa unafuata ‘wakawaoa.’'
