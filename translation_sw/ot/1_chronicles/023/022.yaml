base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/022.yaml
  text: Eleazar died and had no sons[a], but only daughters; and the sons of Kish, their brothers[b], married them.
translation:
  language: sw
  text: Eleazari akafa, naye hakuwa na wana, ila binti tu; nao wana wa Kishi, waliokuwa ndugu zao[a], wakawaoa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu zao” hapa yaelekea humaanisha jamaa wa karibu wa ukoo katika tawi la familia linalohusiana, si lazima ndugu waliozaliwa na mama mmoja.
    reason: cultural_note
  - marker: b
    text: Kwa tafsiri ya neno kwa neno zaidi, “wakawachukua kuwa wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kitenzi מות kinamaanisha moja kwa moja ‘kufa’; ‘akafa’ ni tafsiri ya kawaida, wazi, isiyo ya kiuficho.
- source_word: אֶלְעָזָר
  choice: Eleazari
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: וְלֹא הָיוּ לוֹ בָּנִים
  choice: bila kuwa na wana
  rationale: Ingawa בנים wakati mwingine humaanisha watoto kwa ujumla, hapa utofautishaji na ‘binti’ unahitaji maana mahususi ya wana wa kiume.
- source_word: כִּי אִם בָּנוֹת
  choice: ila binti tu
  rationale: Kauli כִּי אִם inaonyesha isipokuwa au utofautishaji; ‘ila binti tu’ ni ya asili na inahifadhi mkazo huo.
- source_word: וַיִּשָּׂאוּם
  choice: wakawaoa
  rationale: Katika muktadha huu נשׂא, ikiwa na wanawake kama yambwa, humaanisha kuwachukua kuwa wake, yaani kuwaoa. ‘Wakawaoa’ ni Kiswahili cha sasa kilicho wazi.
- source_word: בְּנֵי קִישׁ
  choice: wana wa Kishi
  rationale: Hii inafuata moja kwa moja muundo wa nasaba wa Kiebrania na kuhifadhi mtindo wa Kitabu cha Mambo ya Nyakati.
- source_word: אֲחֵיהֶם
  choice: ndugu zao
  rationale: Neno אח linaweza kumaanisha ndugu wa karibu au mtu wa ukoo. ‘Ndugu zao’ huhifadhi upana huo kuliko kulifafanua moja kwa moja kuwa ‘jamaa zao’.
