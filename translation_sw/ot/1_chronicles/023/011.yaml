base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/011.yaml
  text: Jahath was the first and Zizah the second[a]; Jeush and Beriah did not have many sons[b], so they became one father’s house for one reckoning.
translation:
  language: sw
  text: Yahathi alikuwa wa kwanza, na Ziza wa pili; Yeushi na Beria hawakuwa na wana wengi, kwa hiyo wakawa ukoo mmoja wa upande wa baba, wakihesabiwa kama kundi moja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaweza kutafsiriwa kihalisi, “wakawa nyumba moja ya baba kwa hesabu moja.” Maana yake ni kwamba walitambuliwa kama ukoo mmoja na kuhesabiwa kama kitengo kimoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יַחַת הָרֹאשׁ
  choice: Yahathi alikuwa wa kwanza
  rationale: Katika orodha hii, הָרֹאשׁ inaonyesha nafasi ya kwanza kwa kuwa inalinganishwa na הַשֵּׁנִי, “wa pili”; si lazima imaanishe kiongozi.
- source_word: זִיזָה הַשֵּׁנִי
  choice: Ziza wa pili
  rationale: Jina limetoholewa kwa namna ya kawaida ya Kiswahili, na neno la Kiebrania linaonyesha nafasi ya pili katika mpangilio.
- source_word: לֹא הִרְבּוּ בָנִים
  choice: hawakuwa na wana wengi
  rationale: Nahau hiyo, kihalisi “hawakuzidisha wana,” ina maana kwamba hawakuwa na wana wengi; “wana” linadumisha rejeo mahususi la kiume.
- source_word: לְבֵית אָב
  choice: ukoo mmoja wa upande wa baba
  rationale: בֵּית אָב ni istilahi ya kijamii na kiukoo inayomaanisha jamaa au ukoo unaohesabiwa kupitia upande wa baba.
- source_word: לִפְקֻדָּה אֶחָת
  choice: wakihesabiwa kama kundi moja
  rationale: Katika muktadha wa upangaji wa Walawi, פְּקֻדָּה linahusu kuhesabiwa au kuorodheshwa kama kitengo cha kiutawala; tafsiri hii ni wazi na ya kawaida kwa msomaji wa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Istilahi ya kiukoo “ukoo wa upande wa baba” imetumiwa badala ya tafsiri ngumu ya moja kwa moja “nyumba ya baba,” huku maana ya kiutawala ya kuhesabiwa pamoja ikihifadhiwa.
