  text: וּ/לְ/כֹ֨ל הַעֲל֤וֹת עֹלוֹת֙ לַ/יהוָ֔ה לַ/שַּׁבָּת֔וֹת לֶ/חֳדָשִׁ֖ים וְ/לַ/מֹּעֲדִ֑ים בְּ/מִסְפָּ֨ר כְּ/מִשְׁפָּ֧ט עֲלֵי/הֶ֛ם תָּמִ֖יד לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/031.yaml
  text: and for all the burnt offerings offered to Yahweh on the Sabbaths[a], at the new moons, and at the appointed feasts, by number according to the ordinance concerning them, continually before Yahweh.
translation:
  language: sw
  text: na kwa ajili ya kutoa sadaka zote za kuteketezwa kwa Yahwe siku za Sabato, wakati wa miandamo ya mwezi, na wakati wa sikukuu zilizowekwa, kwa idadi, kulingana na utaratibu uliowekwa kwa ajili yao, daima mbele ya Yahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְכֹל הַעֲלוֹת עֹלוֹת
  choice: na kwa ajili ya kutoa sadaka zote za kuteketezwa
  rationale: Kirai hiki kinahifadhi kusudi la huduma katika orodha na muundo wa Kiebrania wa kitenzi-jina, huku Kiswahili kikibaki cha kawaida na wazi.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Katika muktadha wa dhabihu, kihusishi kinaonyesha sadaka zinazotolewa kwa Mungu; jina la agano יהוה limetoholewa kuwa Yahwe.
- source_word: לַשַּׁבָּתוֹת
  choice: siku za Sabato
  rationale: Wingi wa Kiebrania unaonyesha matukio ya Sabato yanayojirudia; 'siku za Sabato' ni wazi katika Kiswahili.
- source_word: לֶחֳדָשִׁים
  choice: wakati wa miandamo ya mwezi
  rationale: Katika kalenda ya ibada, neno hili humaanisha miandamo ya mwezi, si miezi kwa ujumla.
- source_word: וְלַמּוֹעֲדִים
  choice: na wakati wa sikukuu zilizowekwa
  rationale: מוֹעֲדִים hapa ni nyakati maalumu za sikukuu za ibada; tafsiri hii huhifadhi dhana ya kuwekwa na kusudi lake la kidini.
- source_word: בְּמִסְפָּר כְּמִשְׁפָּט עֲלֵיהֶם
  choice: kwa idadi iliyoagizwa kwa ajili yake
  rationale: Maneno haya yanaonyesha kwamba idadi ya sadaka ilipaswa kufuata agizo lililowekwa. Umoja wa 'yake' unarejelea kwa ujumla kila tukio au aina husika bila kulazimisha rejeo lisilo na uhakika.
- source_word: תָּמִיד לִפְנֵי יְהוָה
  choice: daima mbele za Yahwe
  rationale: Tafsiri hii huhifadhi wazo la huduma ya mara kwa mara inayoendelea katika uwepo wa Yahwe.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה; 'Yahwe' hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya תָּמִיד katika huduma ya ibada
  choice: daima
  alternative: kwa ukawaida
  rationale: Neno linaweza kusisitiza uendelevu au kurudiwa kwa utaratibu. 'Daima' huhifadhi upana huo katika kauli ya huduma mbele za Yahwe bila kudai kuwa tendo hilo halikukatika kamwe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Istilahi 'sadaka za kuteketezwa', 'Sabato', na 'miandamo ya mwezi' zinatunza muktadha wa ibada ya Israeli bila kuongeza ufafanuzi wa kimadhehebu.
