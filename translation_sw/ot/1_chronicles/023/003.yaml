  yaml_path: translation/ot/1_chronicles/023/003.yaml
  text: The Levites were counted from thirty years old and upward[a], and their number by heads, man by man, was thirty-eight thousand.
translation:
  language: sw
  text: Walawi walihesabiwa kuanzia umri wa miaka thelathini na kuendelea. Idadi yao, kwa kuhesabiwa kichwa kwa kichwa kama wanaume, ilikuwa elfu thelathini na nane.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kwa vichwa vyao, kama wanaume”; usemi huo unaonyesha kwamba waliohesabiwa walikuwa wanaume mmoja mmoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּפְרוּ
  choice: walihesabiwa
  rationale: Kauli ya kutendwa inaakisi umbo la Kiebrania na muktadha wa sensa kwa Kiswahili cha kawaida.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa Walawi.
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמָעְלָה
  choice: kuanzia wenye umri wa miaka thelathini na kuendelea
  rationale: Usemi huu unaonyesha kikomo cha chini cha umri na unasikika kwa kawaida katika Kiswahili cha sasa.
- source_word: וַיְהִי מִסְפָּרָם
  choice: Idadi yao ... ilikuwa
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kifungu kinachotanguliza jumla.
- source_word: לְגֻלְגְּלֹתָם
  choice: kichwa kwa kichwa
  rationale: Inahifadhi taswira halisi ya Kiebrania huku ikionyesha kuhesabiwa kwa kila mtu binafsi.
- source_word: לִגְבָרִים
  choice: mwanaume mmoja mmoja
  rationale: Inabainisha kwamba waliohesabiwa walikuwa wanaume na inaendeleza maana ya hesabu ya kila mtu.
- source_word: שְׁלֹשִׁים וּשְׁמוֹנָה אָלֶף
  choice: elfu thelathini na nane
  rationale: Ni uwasilishaji wa moja kwa moja na wa kawaida wa jumla hiyo kwa Kiswahili.
