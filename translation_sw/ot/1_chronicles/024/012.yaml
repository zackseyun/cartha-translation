    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/אֶלְיָשִׁיב
  choice: kwa Eliashibu
  rationale: Kiambishi לְ katika orodha hii kinaonyesha mgawo; ‘kwa’ ni Kiswahili cha kawaida kwa sehemu iliyomwangukia mtu. Jina limetoholewa kwa muundo unaosomeka kwa Kiswahili.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: wa kumi na moja
  rationale: Ingawa umbo la Kiebrania ni la namba ya kuhesabu, katika mfululizo huu wa kura linafanya kazi kama namba ya mpangilio. ‘Kura’ haijaongezwa kwa kuwa inaeleweka kutokana na muktadha.
- source_word: לְ/יָקִים
  choice: kwa Yakimu
  rationale: Kiambishi לְ kinaonyesha mgawo kama katika kishazi cha kwanza. Jina limetoholewa kutoka יָקִים kwa tahajia ya Kiswahili.
- source_word: שְׁנֵים עָשָׂר
  choice: wa kumi na mbili
  rationale: Namba ya kuhesabu imetafsiriwa kwa maana yake ya mpangilio katika orodha ya kura, bila kuongeza nomino ‘kura’ isiyomo katika mstari huu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo mfupi wa orodha umehifadhiwa. ‘Wa’ inarejelea kura inayofahamika kutokana na muktadha uliotangulia. Majina yametoholewa kuwa Eliashibu na Yakimu.
