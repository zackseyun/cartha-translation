  text: ya kumi na moja kwa Eliashibu[a][b], ya kumi na mbili kwa Yakimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya Eliashibu … kwa ajili ya Yakimu.” Kihusishi cha Kiebrania kinaweza kutafsiriwa kwa njia zote mbili katika orodha hii ya migawo.
    reason: lexical_alternative
  - marker: b
