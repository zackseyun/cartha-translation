base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/002.yaml
  text: But Nadab and Abihu died before their father[a], and they had no sons; so Eleazar and Ithamar served as priests.
translation:
  language: sw
  text: Lakini Nadabu na Abihu walikufa kabla ya baba yao[a], nao hawakuwa na wana; kwa hiyo Eleazari na Ithamari wakatumikia kama makuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele ya baba yao.” Kirai cha Kiebrania kinaweza kueleweka kwa maana ya mahali (“mbele ya/katika uwepo wa”) au ya wakati (“kabla ya,” yaani, baba yao akiwa bado hai).
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּמָת
  choice: walikufa
  rationale: Wayyiqtol ya מוּת inasimulia tukio lililopita; ‘walikufa’ ni namna ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: לִפְנֵי
  choice: kabla ya
  rationale: Katika muktadha huu inaweza kumaanisha kwamba walikufa baba yao akiwa bado hai. Hata hivyo, maana ya mahali, ‘mbele ya/katika uwepo wa,’ bado inawezekana na imehifadhiwa katika tanbihi.
- source_word: אֲבִיהֶם
  choice: baba yao
  rationale: Ni nomino yenye kiambishi cha nafsi ya tatu wingi, ikimtaja baba ya Nadabu na Abihu.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: nao hawakuwa na wana
  rationale: בָּנִים humaanisha hasa wana wa kiume, si watoto kwa ujumla; ‘wana’ huhifadhi umahususi huo.
- source_word: וַיְכַהֲנוּ
  choice: wakatumikia kama makuhani
  rationale: Piel ya כָּהַן huonyesha kutekeleza huduma ya kikuhani; tafsiri hii huhifadhi maana ya kitendo badala ya hali tu.
- source_word: אֶלְעָזָר וְאִיתָמָר
  choice: Eleazari na Ithamari
  rationale: Majina yameandikwa kwa maumbo yanayotumika kwa kawaida katika Biblia za Kiswahili.
