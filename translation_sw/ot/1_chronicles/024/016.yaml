lexical_decisions:
- source_word: לִפְתַחְיָה
  choice: kwa Pethahia
  rationale: Kiambishi ל katika orodha hii huonyesha mgawo wa zamu; jina limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: תִּשְׁעָה עָשָׂר
  choice: wa kumi na tisa
  rationale: Ingawa umbo la Kiebrania ni la idadi, katika mfululizo huu linafanya kazi kama namba ya mpangilio; nomino ‘zamu’ inaeleweka kutokana na muktadha.
- source_word: לִיחֶזְקֵאל
  choice: kwa Yehezkeli
  rationale: Kiambishi ל huonyesha mgawo, na jina limetoholewa kwa kufuata umbo la Kiebrania lililo hapa badala ya kulisawazisha kimya kimya na umbo jingine linalojulikana.
- source_word: הָעֶשְׂרִים
  choice: wa ishirini
  rationale: Namba yenye kibainishi hutumika kama namba ya mpangilio katika orodha; ‘wa’ hurejelea zamu iliyodokezwa na muktadha.
