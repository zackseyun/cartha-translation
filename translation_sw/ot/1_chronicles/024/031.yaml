translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Jamaa za ukoo’ limetumiwa kueleza muundo wa kijamii wa בית־אב bila kutumia tafsiri ngumu ya neno kwa neno. Alama zote za tanbihi [a] na [b] zimo katika matini kuu.
