source:
  edition: WLC
  text: וַ/יַּפִּילוּ֩ גַם הֵ֨ם גּוֹרָל֜וֹת לְ/עֻמַּ֣ת אֲחֵי/הֶ֣ם בְּנֵֽי אַהֲרֹ֗ן לִ/פְנֵ֨י דָוִ֤יד הַ/מֶּ֨לֶךְ֙ וְ/צָד֣וֹק וַ/אֲחִימֶ֔לֶךְ וְ/רָאשֵׁי֙ הָֽ/אָב֔וֹת לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם אָב֣וֹת הָ/רֹ֔אשׁ לְ/עֻמַּ֖ת אָחִ֥י/ו הַ/קָּטָֽן־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/031.yaml
  text: These also cast lots alongside their brothers[a], the sons of Aaron, before King David, Zadok, Ahimelech[b], and the heads of the fathers’ houses of the priests and of the Levites—the chief fathers’ houses as well as those of their younger brothers.
translation:
  language: sw
  text: Nao pia walipiga kura sambamba na ndugu zao,[a] wana wa Aroni, mbele ya Mfalme Daudi, Sadoki, Ahimeleki, na viongozi wa jamaa za ukoo za makuhani na Walawi—jamaa za ukoo za wakuu sawa na zile za ndugu zao wadogo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na ndugu zao, wana wa Aroni.” Neno la Kiebrania linaweza kumaanisha kuwa mkabala na, kulingana na, au sambamba na.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, Kiebrania kinasema, “jamaa za ukoo za mkuu kulingana na ndugu yake mdogo.” Maumbo ya umoja huenda yametumiwa kwa maana ya kila mmoja, yakionyesha kwamba matawi ya wakuu na yale ya ndugu wadogo yalitendewa sawa katika kupiga kura.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ ... גּוֹרָלוֹת
  choice: walipiga kura
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kufanya uteuzi kwa kura. ‘Kupiga kura’ ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya utaratibu huo.
- source_word: גַם הֵם
  choice: Nao pia
  rationale: Maneno haya yanawarejelea Walawi waliotajwa katika muktadha uliotangulia na kuonyesha kwamba wao pia walishiriki katika kupiga kura.
- source_word: לְעֻמַּת אֲחֵיהֶם בְּנֵי אַהֲרֹן
  choice: sambamba na ndugu zao, wana wa Aroni
  rationale: לְעֻמַּת inaweza kumaanisha ‘mkabala na,’ ‘kulingana na,’ au ‘sambamba na.’ Katika mazingira haya ya upangaji, ‘sambamba na’ huonyesha hadhi au utaratibu unaolingana bila kufafanua kupita kiasi.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Hutaja kwamba upigaji kura ulifanyika hadharani katika uwepo wa viongozi hawa.
- source_word: דָוִיד הַמֶּלֶךְ
  choice: Mfalme Daudi
  rationale: Mpangilio huu wa cheo na jina ni wa kawaida na wa asili katika Kiswahili.
- source_word: וְצָדוֹק וַאֲחִימֶלֶךְ
  choice: Sadoki, Ahimeleki
  rationale: Majina yamenukuliwa kwa maumbo yanayoeleweka katika Kiswahili huku yakifuata majina ya Kiebrania.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: viongozi wa jamaa za ukoo
  rationale: Kirai hiki kinawataja viongozi wa vitengo vya kijamaa vya mababu. ‘Jamaa za ukoo’ ni wazi zaidi katika Kiswahili cha sasa kuliko tafsiri ya neno kwa neno ya ‘nyumba za baba.’
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: za makuhani na Walawi
  rationale: Kiunganishi hiki kinazitambulisha jamaa za ukoo zilizohusiana na makuhani na Walawi.
- source_word: אָבוֹת הָרֹאשׁ
  choice: jamaa za ukoo za wakuu
  rationale: Tafsiri hii inadumisha mkazo wa kirai kwenye vitengo vya ukoo vinavyohusishwa na mkuu au mkubwa, badala ya kukigeuza kiwe rejeo la watu binafsi pekee.
- source_word: לְעֻמַּת אָחִיו הַקָּטָן
  choice: sawa na zile za ndugu zao wadogo
  rationale: Kiebrania ni kifupi na kina umoja unaoweza kutumiwa kwa maana ya kila mmoja. Tafsiri hii inaonyesha usawa katika kupiga kura baina ya tawi la mkuu na la ndugu mdogo huku tanbihi ikihifadhi umbo halisi na utata wa kirai.
