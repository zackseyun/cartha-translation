  text: 'The sons of Merari: of Jaaziah, his son, Shoham, Zaccur, and Ibri.'
translation:
  language: sw
  text: 'Wana wa Merari: wa Yaazia, mwanawe[a], Shohamu, Zakuri na Ibri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mwanawe.” Muundo wa sentensi ni mgumu; wengine hulichukulia neno hili kuwa jina la mtu, “Beno,” na wengine hulielewa kwa maana ya wingi, kama vile “wanawe.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa neno ‘mwana’ katika hali ya kuunganisha majina, ukitanguliza orodha ya ukoo. ‘Wana wa’ ni tafsiri ya moja kwa moja na ya kawaida katika nasaba.
- source_word: מְרָרִי
  choice: Merari
  rationale: Ni jina la mtu; limetoholewa kwa namna inayofahamika katika Kiswahili.
- source_word: לְיַעֲזִיָּהוּ
  choice: wa Yazia
  rationale: Kiambishi לְ hapa kinaonyesha tawi la ukoo linalohusishwa na Yazia. ‘Wa Yazia’ huhifadhi uhusiano huo kwa ufupi, ingawa sintaksia ya mstari mzima ni ngumu.
- source_word: בְנוֹ
  choice: mwanawe
  rationale: Maandishi ya Kimasoreti yaliyowekewa irabu yanasomeka kihalisi ‘mwanawe.’ Tafsiri hii imehifadhiwa katika maandishi makuu, huku uwezekano wa kulichukulia kama jina ‘Beno’ au kuelewa wingi ukielezwa katika tanbihi.
- source_word: וְשֹׁהַם
  choice: Shohamu
  rationale: Ni jina la mtu; limetoholewa kwa tahajia ya Kiswahili.
- source_word: וְזַכּוּר
  choice: Zakuri
  rationale: Ni jina la mtu; limetoholewa kwa tahajia ya Kiswahili.
- source_word: וְעִבְרִי
  choice: Ibri
  rationale: Ni jina la mtu; limetoholewa kwa tahajia ya Kiswahili.
