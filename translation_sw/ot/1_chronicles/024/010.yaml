lexical_decisions:
- source_word: לְהַקּוֹץ
  choice: kwa Hakosi
  rationale: Kihusishi לְ kinaonyesha mgao katika orodha ya zamu; “kwa” ni usemi wa kawaida wa Kiswahili unaofaa kwa maana ya zamu iliyomwangukia mtu. Jina הַקּוֹץ limetoholewa kuwa “Hakosi” kulingana na muundo wa matamshi ya Kiswahili.
- source_word: הַשְּׁבִעִי
  choice: wa saba
  rationale: Namba ya mpangilio yenye kibainishi inarejelea zamu ya saba; “wa saba” hudumisha mtindo mfupi wa orodha na kuacha nomino “zamu” ieleweke kutokana na muktadha.
- source_word: לַאֲבִיָּה
  choice: kwa Abiya
  rationale: Kihusishi לַ־ kinaonyesha mgao uleule katika mfuatano. אֲבִיָּה limetoholewa “Abiya,” namna ya kawaida na inayoeleweka katika Kiswahili.
- source_word: הַשְּׁמִינִי
  choice: wa nane
  rationale: Namba ya mpangilio inalingana na “wa saba” na kutaja zamu ya nane kwa mtindo mfupi wa orodha.
