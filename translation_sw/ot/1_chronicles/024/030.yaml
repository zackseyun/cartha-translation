  yaml_path: translation/ot/1_chronicles/024/030.yaml
  text: 'And the sons of Mushi: Mahli[a], Eder, and Jeremoth. These were the sons of the Levites according to their fathers'' houses.'
translation:
  language: sw
  text: 'Na wana wa Mushi: Mahli, Ederi na Yerimothi. Hawa ndio wana wa Walawi, kwa nyumba za baba zao.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי מוּשִׁי
  choice: Na wana wa Mushi
  rationale: Kiunganishi וּ pamoja na muundo wa nasaba בְנֵי huendeleza orodha; Kiswahili ‘Na wana wa’ huhifadhi uhusiano huo kwa lugha ya kawaida.
- source_word: מַחְלִי וְעֵדֶר וִירִימוֹת
  choice: Mahli, Ederi na Yerimothi
  rationale: Majina ya watu yametoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, huku viunganishi vya Kiebrania vikiwakilishwa kwa ‘na’ kabla ya jina la mwisho katika orodha.
- source_word: אֵלֶּה בְּנֵי הַלְוִיִּם
  choice: Hao ndio waliokuwa wana wa Walawi
  rationale: אֵלֶּה inarejelea watu waliotajwa; wakati uliopita umeongezwa kwa mtiririko wa taarifa ya nasaba. ‘Wana wa Walawi’ huhifadhi nahau ya nasaba ya Kiebrania.
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: kwa kufuata jamaa za baba zao
  rationale: Kirai hiki kinaonyesha upangaji kwa koo au familia za upande wa baba. ‘Jamaa za baba zao’ ni ya kueleweka na huhifadhi dhana ya nyumba za ukoo wa baba.
