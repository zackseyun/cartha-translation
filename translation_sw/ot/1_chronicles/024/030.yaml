  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima, wa kisasa na unaofaa taarifa fupi ya nasaba. Hakuna tanbihi iliyowekwa kwa sababu tofauti ya tahajia katika English POB imeunganishwa kimakosa na Mahli, ilhali maelezo yake yanahusu Yerimothi; matini ya Kiebrania yenyewe haihitaji tanbihi ya maana.
