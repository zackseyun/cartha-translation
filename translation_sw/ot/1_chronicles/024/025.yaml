  text: 'The brother of Micah: Isshiah; of the sons of Isshiah[a], Zechariah.'
translation:
  language: sw
  text: Ndugu wa Mika alikuwa Yishia; na miongoni mwa wana wa Yishia[a] alikuwa Zekaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Yishia pia huandikwa Ishia au Jeshia katika mapokeo mbalimbali ya tahajia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִי
  choice: Ndugu yake
  rationale: Ni umbo la uhusiano linalomaanisha “ndugu wa.” Kiwakilishi “yake” kinaunganisha uhusiano huo na Mika kwa Kiswahili cha kawaida, bila kubainisha zaidi aina ya undugu kuliko Kiebrania.
- source_word: מִיכָה
  choice: Mika
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka na inayoeleweka katika Kiswahili.
- source_word: יִשִּׁיָּה
  choice: Yishia
  rationale: Jina limetoholewa kutoka umbo la Kiebrania; tahajia hii ni rahisi kusoma katika Kiswahili huku ikihifadhi sauti kuu za jina.
- source_word: לִבְנֵי
  choice: miongoni mwa wana wa
  rationale: Katika orodha hii ya ukoo, לְ inaonyesha mtu anayehusishwa na kundi la wazao. “Miongoni mwa wana wa” ni Kiswahili cha asili zaidi kuliko tafsiri ya moja kwa moja “kwa wana wa.”
- source_word: זְכַרְיָהוּ
  choice: Zekaria
  rationale: Hili ndilo umbo la jina linalotambulika na wasomaji wa Kiswahili.
