  register: Sentensi imehifadhi mtindo mfupi wa orodha ya ukoo, lakini imeongezewa kitenzi “alikuwa” ili isomeke kwa urahisi katika Kiswahili cha sasa. Lugha ni ya heshima, ya kawaida, na haitoi maelezo ya ukoo yasiyokuwamo katika Kiebrania.
