lexical_decisions:
- source_word: לְחָרִם
  choice: kwa Harimu
  rationale: Kiambishi לְ kinaonyesha mgawo uliopatikana kwa kura katika orodha hii; “kwa” ni usemi wa kawaida wa Kiswahili. Jina חָרִם limenukuliwa kama Harimu.
- source_word: הַשְּׁלִישִׁי
  choice: wa tatu
  rationale: Ni namba ya mpangilio yenye kiambishi bainishi, ikirejelea kwa ufupi kura au zamu ya tatu. Mtindo mfupi wa orodha ya Kiebrania umehifadhiwa.
- source_word: לִשְׂעֹרִים
  choice: kwa Seorimu
  rationale: Kama katika kishazi cha kwanza, לִ kinaonyesha mgawo kwa kura. Jina שְׂעֹרִים limenukuliwa kama Seorimu.
- source_word: הָרְבִעִי
  choice: wa nne
  rationale: Ni namba ya mpangilio inayolingana na “wa tatu” na inarejelea kwa ufupi kura au zamu ya nne.
