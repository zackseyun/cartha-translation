  rationale: Hii ni hali ya kutegemeana ya wingi wa neno “mwana.” Ingawa katika nasaba inaweza kumaanisha “wazao wa,” hapa kutajwa kwa mtu mmoja mara moja kunapendelea tafsiri ya karibu zaidi, “wana wa.”
- source_word: קִישׁ
