base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/019.yaml
  text: These were their appointed duties for their service[a], to enter the house of Yahweh according to their ordinance, under the hand of Aaron their father, as Yahweh, the God of Israel[b], had commanded him.
translation:
  language: sw
  text: 'Haya ndiyo majukumu waliyopangiwa kwa ajili ya huduma yao: kuingia katika nyumba ya Yahweh kwa kufuata utaratibu wao uliowekwa[a], chini ya uongozi wa Aroni[b], baba yao, kama Yahweh, Mungu wa Israeli, alivyomwamuru.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa kufuata kanuni zao.” Neno la Kiebrania linaweza kumaanisha kanuni, agizo, au utaratibu rasmi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “kwa/chini ya mkono wa Aroni,” nahau inayoweza kumaanisha usimamizi au mamlaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: majukumu waliyopangiwa
  rationale: Nomino hii inaonyesha mgawo au wajibu uliowekwa rasmi. Kauli hii ya Kiswahili inaeleza kwa kawaida majukumu ya kikuhani yaliyogawiwa.
- source_word: לַעֲבֹדָתָם
  choice: kwa ajili ya huduma yao
  rationale: Katika muktadha wa kikuhani, עֲבֹדָה ni huduma inayofanywa katika nyumba ya Mungu; “huduma” huhifadhi maana hiyo bila kuingiza istilahi ya dhehebu fulani.
- source_word: לָבוֹא לְבֵית יְהוָה
  choice: kuingia katika nyumba ya Yahweh
  rationale: Ingawa בוא kimsingi ni kuja, hapa inaeleza kuingia katika nyumba ya Yahweh kwa huduma. “Nyumba” huhifadhi taswira ya Kiebrania badala ya kuibadili kuwa “hekalu.”
- source_word: כְּמִשְׁפָּטָם
  choice: kwa kufuata utaratibu wao uliowekwa
  rationale: מִשְׁפָּט hapa inahusu kanuni au utaratibu rasmi wa zamu za kikuhani. Tafsiri hii ni ya kawaida na pia huhifadhi wazo la utaratibu uliowekwa.
- source_word: בְּיַד אַהֲרֹן
  choice: chini ya uongozi wa Aroni
  rationale: Nahau ya Kiebrania “kwa/chini ya mkono wa” hapa inaonyesha usimamizi au mamlaka. “Chini ya uongozi wa” huwasilisha maana yake kwa Kiswahili cha kawaida.
- source_word: אֲבִיהֶם
  choice: baba yao
  rationale: Hii ndiyo tafsiri ya moja kwa moja; katika nasaba Aroni ndiye baba wa ukoo wao, hivyo usemi wa Kiebrania umehifadhiwa.
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: kama ... alivyomwamuru
  rationale: Kiambishi cha umoja katika kitenzi kinamrejelea Aroni. Kiswahili hiki kinaonyesha wazi kwamba Yahweh alimwamuru yeye.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Yahweh, Mungu wa Israeli
  rationale: Jina la agano יְהוָה limetoholewa kuwa “Yahweh,” na “Mungu wa Israeli” limetumiwa kama kirai cha ufafanuzi kama lilivyo katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko linatumia Tetragramatoni moja kwa moja. “Yahweh” huhifadhi jina la agano bila kulibadili kuwa cheo.
- issue: Maana ya בְּיַד אַהֲרֹן katika mpangilio wa kikuhani
  choice: chini ya uongozi wa Aroni
  alternative: kwa mkono wa Aroni; chini ya mamlaka ya Aroni
  rationale: Nahau inaweza kueleza utendaji, usimamizi, au mamlaka. Muktadha wa utaratibu wa huduma unaelekeza kwenye usimamizi, bila kudai zaidi ya andiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo umefanywa wa kawaida kwa Kiswahili huku istilahi za ibada na taswira ya “nyumba ya Yahweh” zikihifadhiwa.
