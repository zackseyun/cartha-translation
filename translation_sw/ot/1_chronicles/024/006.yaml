  to: Shemaya mwana wa Nethaneli, mwandishi mmoja wa Walawi, aliwaandika mbele ya mfalme, maafisa, kuhani Sadoki, Ahimeleki mwana wa Abiathari, na wakuu wa jamaa za ukoo za makuhani na Walawi—jamaa moja ya ukoo ikichukuliwa kwa Eleazari, na moja ikichukuliwa kwa Ithamari.[a]
