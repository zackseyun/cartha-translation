base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/006.yaml
  text: Shemaiah son of Nethanel[a], the scribe from among the Levites, recorded them in the presence of the king, the officials, Zadok the priest, Ahimelech son of Abiathar, and the heads of the fathers’ houses of the priests and of the Levites—one father’s house being taken for Eleazar, and one being taken for Ithamar.
translation:
  language: sw
  text: Shemaya mwana wa Nethaneli, mwandishi mmoja wa Walawi, aliwaandika mbele ya mfalme, maafisa, kuhani Sadoki, Ahimeleki mwana wa Abiathari, na wakuu wa jamaa za ukoo za makuhani na Walawi—jamaa moja ya ukoo ikichukuliwa kwa Eleazari, na moja ikichukuliwa kwa Ithamari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kina usemi mfupi unaojirudia: “jamaa moja ya baba ikichukuliwa kwa Eleazari, na ikichukuliwa, ikichukuliwa kwa Ithamari.” Tafsiri imeongeza “moja” katika sehemu ya pili ili kufanya sentensi ieleweke. Muundo huo hauelezi kikamilifu mpangilio wa uteuzi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתְּבֵם
  choice: akawaorodhesha
  rationale: Kitenzi כתב chenye kiambishi cha wingi kinarejelea kuyaandika rasmi makundi au watu waliotajwa katika muktadha. “Akawaorodhesha” ni Kiswahili cha kawaida kinachoonyesha tendo la kuweka kumbukumbu bila kuongeza namna ya uandishi.
- source_word: הַסּוֹפֵר
  choice: mwandishi
  rationale: סֹפֵר ni mwandishi rasmi au karani. “Mwandishi” linaeleweka kwa urahisi na linafaa kwa jukumu la kuandika orodha mbele ya viongozi.
- source_word: מִן הַלֵּוִי
  choice: kutoka miongoni mwa Walawi
  rationale: Neno מן lina maana ya sehemu ya kundi; tafsiri hii inahifadhi kwamba Shemaya alikuwa mmoja wa Walawi.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Katika mazingira haya, לִפְנֵי huonyesha kwamba tendo lilifanyika viongozi hao wakiwepo kama mashahidi. “Mbele ya” ni usemi wa asili na wenye hadhi katika Kiswahili.
- source_word: הַשָּׂרִים
  choice: maofisa
  rationale: שָׂרִים hapa ni viongozi wenye mamlaka katika utawala, si lazima wana wa kifalme. “Maofisa” huepuka maana finyu ya “wakuu” au “wana wa mfalme.”
- source_word: רָאשֵׁי הָאָבוֹת
  choice: wakuu wa jamaa za mababu
  rationale: Huu ni usemi wa kiukoo na kiutawala unaowataja viongozi wa vitengo vya ukoo. “Jamaa za mababu” ni wazi zaidi kwa msomaji wa Kiswahili kuliko tafsiri ya neno kwa neno ya “nyumba za baba.”
- source_word: בֵּית אָב אֶחָד
  choice: jamaa moja ya ukoo
  rationale: בֵּית אָב ni kitengo cha ukoo, si jengo halisi. Tafsiri hii huwasilisha maana ya kijamii kwa Kiswahili cha sasa.
- source_word: אָחֻז
  choice: ikichukuliwa
  rationale: Hii ni kauli tendwa ya אחז, “kushika/kuchukua.” “Ikichukuliwa” huhifadhi picha ya Kiebrania na kutolazimisha maana maalumu zaidi kama “ikichaguliwa kwa kura.”
- source_word: לְאֶלְעָזָר ... לְאִיתָמָר
  choice: kwa upande wa Eleazari ... kwa upande wa Ithamari
  rationale: ל hapa huonyesha uhusiano na mistari miwili ya kikuhani. “Kwa upande wa” huweka wazi kuwa ni jamaa za nasaba zao, si kwamba kitu kilikabidhiwa moja kwa moja kwa watu hao.
