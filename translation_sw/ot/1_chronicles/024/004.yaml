base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/004.yaml
  text: 'The sons of Eleazar were found to be more numerous[a], as heads of the men, than the sons of Ithamar, and they divided them thus: for the sons of Eleazar, sixteen heads of fathers’ houses, and for the sons of Ithamar, according to their fathers’ houses[b], eight.'
translation:
  language: sw
  text: 'Wana wa Eleazari walibainika kuwa wengi zaidi kwa idadi ya wakuu wa watu[a] kuliko wana wa Ithamari. Hivyo wakawagawanya: kwa wana wa Eleazari, wakuu kumi na sita wa nyumba za baba; na kwa wana wa Ithamari, wakuu wanane wa nyumba za baba zao[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakuu wa wanaume mashujaa.” Neno la Kiebrania גְּבָרִים linaweza kumaanisha wanaume wenye nguvu au mashujaa, lakini katika muktadha huu huenda linawarejelea wanaume wakuu wa koo za kikuhani.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba za baba” ni familia pana za mababu, zilizotumika kama vitengo vya kindugu na kiutawala katika Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמָּצְאוּ
  choice: walionekana kuwa
  rationale: Nifali ya מצא hapa inaonyesha hali iliyobainika, si tendo la kupata kitu kimwili.
- source_word: רַבִּים
  choice: wengi zaidi
  rationale: Muktadha una ulinganisho wa wana wa Eleazari na wana wa Ithamari, hivyo maana ya kulinganisha imewekwa wazi.
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: miongoni mwa viongozi
  rationale: Kirai kinaelekea kuwataja wanaume wakuu au viongozi wa koo za kikuhani; tafsiri hii ni ya kawaida kwa Kiswahili na haileti bila ulazima wazo la wapiganaji.
- source_word: וַיַּחְלְקוּם
  choice: wakawagawa hivi
  rationale: Kitenzi kinahusu kuwapanga katika migawanyo ya huduma, na neno 'hivi' linaanzisha vizuri hesabu inayofuata.
- source_word: רָאשִׁים
  choice: viongozi
  rationale: Katika muktadha wa muundo wa koo, רָאשִׁים ni wakuu au viongozi wa vikundi husika.
- source_word: לְבֵית אָבוֹת
  choice: wa jamaa za ukoo
  rationale: בֵּית אָבוֹת ni kitengo cha kindugu na kiutawala cha kifamilia; 'jamaa za ukoo' kinaeleweka kwa wasomaji wa Kiswahili cha sasa.
- source_word: שִׁשָּׁה עָשָׂר
  choice: kumi na sita
  rationale: Ni idadi ya viongozi wa migawanyo ya wana wa Eleazari.
- source_word: לְבֵית אֲבוֹתָם
  choice: kulingana na jamaa zao za ukoo
  rationale: Kiambishi cha umilikaji kinaonyesha kuwa mpangilio wa wana wa Ithamari ulifuata jamaa zao wenyewe za ukoo.
- source_word: שְׁמוֹנָה
  choice: wanane
  rationale: Umbo la ngeli ya watu linaonyesha idadi ya viongozi wa wana wa Ithamari.
