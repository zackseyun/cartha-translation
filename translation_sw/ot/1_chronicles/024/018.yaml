  text: for Delaiah, the twenty-third; for Maaziah, the twenty-fourth.
translation:
  language: sw
  text: Kwa Delaya, zamu ya ishirini na tatu; kwa Maazia, zamu ya ishirini na nne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/דְלָיָהוּ
  choice: kwa Delaya
  rationale: Kiambishi לְ־ kinaonyesha sehemu au zamu iliyomwangukia Delaya katika orodha ya migawanyo ya makuhani. “Kwa Delaya” ni kauli fupi na ya kawaida inayofaa muundo wa orodha.
- source_word: שְׁלֹשָׁה וְ/עֶשְׂרִים
  choice: wa ishirini na tatu
  rationale: Ingawa Kiebrania kimatumizi kina muundo wa namba ya kuhesabu, hapa namba inaonyesha nafasi ya zamu katika mfuatano; hivyo namba ya mpangilio ndiyo ya asili katika Kiswahili.
- source_word: לְ/מַֽעַזְיָהוּ
  choice: kwa Maazia
  rationale: Kama katika kishazi cha kwanza, לְ־ inaonyesha mgawo au zamu inayohusishwa na Maazia. Jina limetoholewa kwa tahajia rahisi ya Kiswahili.
- source_word: אַרְבָּעָה וְ/עֶשְׂרִים
  choice: wa ishirini na nne
  rationale: Namba hii inatumika kama nafasi ya mwisho katika mfuatano wa zamu, kwa hiyo “wa ishirini na nne” huwasilisha kazi yake kwa Kiswahili cha kawaida.
