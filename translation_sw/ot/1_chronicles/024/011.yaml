  text: Ya tisa kwa Yeshua, ya kumi kwa Shekania.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיֵשׁוּעַ
  choice: kwa Yeshua
  rationale: Katika orodha ya zamu za makuhani zilizopangwa kwa kura, kiambishi לְ kinaonyesha mtu aliyepewa nafasi hiyo. Kiswahili ‘kwa Yeshua’ kinaendeleza kwa kawaida muundo wa orodha unaotangulia.
- source_word: הַתְּשִׁעִי
  choice: wa tisa
  rationale: Namba ya mpangilio yenye kibainishi imetumika kama nomino na inaonyesha kura au zamu ya tisa; ‘wa tisa’ ni muundo wa kawaida wa Kiswahili katika orodha hii.
- source_word: לִשְׁכַנְיָהוּ
  choice: kwa Shekania
  rationale: Kama katika kishazi cha kwanza, לְ inaonyesha mtu aliyepewa nafasi katika mpangilio. Jina la Kiebrania limetoholewa kwa namna inayoeleweka katika Kiswahili.
- source_word: הָעֲשִׂירִי
  choice: wa kumi
  rationale: Namba hii ya mpangilio inaonyesha kura au zamu ya kumi; tafsiri fupi inadumisha mtindo wa orodha wa Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi wa orodha. Muundo ‘wa tisa kwa …, wa kumi kwa …’ unategemea muktadha wa aya zilizotangulia na unasikika kwa kawaida zaidi kuliko kurudia ‘kura’ au ‘zamu’ ambazo hazitajwi wazi katika aya hii.
