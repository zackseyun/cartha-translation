base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/005.yaml
  text: So they divided them by lots[a], these with those[b], because there were officers of the sanctuary and officers of God from the sons of Eleazar and from the sons of Ithamar.
translation:
  language: sw
  text: Basi wakawagawa kwa kura, hawa pamoja na wale[a], kwa sababu kulikuwa na wakuu wa mahali patakatifu na wakuu wa Mungu[b] miongoni mwa wana wa Eleazari na wana wa Ithamari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kundi moja pamoja na jingine”; Kiebrania kinasema kihalisi, “hawa pamoja na wale.”
    reason: lexical_alternative
  - marker: b
    text: Au, “viongozi wa mahali patakatifu na viongozi wa Mungu,” au “maofisa wa mahali patakatifu na maofisa wa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְלְקוּם
  choice: wakawagawa
  rationale: Kitenzi hiki kinaonyesha kuwagawa au kuwapangia watu katika makundi. “Wakawagawa” ni cha moja kwa moja na kinahifadhi kiambishi cha yambwa cha wingi.
- source_word: בְּגוֹרָלוֹת
  choice: kwa kura
  rationale: Neno גוֹרָל linamaanisha kura iliyotumiwa kuamua mgao au mpangilio. Kiswahili kwa kawaida hutumia “kwa kura,” hata kama Kiebrania kina umbo la wingi.
- source_word: אֵלֶּה עִם אֵלֶּה
  choice: hawa pamoja na wale
  rationale: Tafsiri hii inadumisha usemi mfupi wa Kiebrania na kuonyesha kwamba makundi ya pande zote mbili yalihusishwa pamoja, bila kufafanua zaidi ya maandishi.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa kiunganishi kinaeleza sababu ya kutumia kura katika kuwagawa.
- source_word: שָׂרֵי קֹדֶשׁ
  choice: wakuu wa patakatifu
  rationale: שָׂרִים inaweza kumaanisha wakuu, viongozi, au maofisa. “Wakuu” ni neno la heshima na la kawaida, nalo “patakatifu” linaonyesha eneo au shughuli takatifu bila kulifanya neno kuwa dhana ya jumla ya utakatifu.
- source_word: וְשָׂרֵי הָאֱלֹהִים
  choice: na wakuu wa Mungu
  rationale: Tafsiri hii inafuata kwa karibu maneno ya Kiebrania, ambayo hayana neno “nyumba,” na kuhifadhi ulinganifu wenye utata na “wakuu wa patakatifu.”
- source_word: מִבְּנֵי אֶלְעָזָר וּבִבְנֵי אִיתָמָר
  choice: miongoni mwa wana wa Eleazari na wana wa Ithamari
  rationale: “Wana wa” ni usemi wa kawaida wa nasaba, unaoweza kumaanisha wana au wazao. “Miongoni mwa” huwasilisha kwa Kiswahili fasaha kwamba wakuu hao walitoka katika koo zote mbili.
theological_decisions:
- issue: Maana ya שָׂרֵי קֹדֶשׁ וְשָׂרֵי הָאֱלֹהִים
  choice: wakuu wa patakatifu na wakuu wa Mungu
  alternative: maofisa wa mahali patakatifu na maofisa wa nyumba ya Mungu
  rationale: Maneno haya mawili yanadumishwa kama majina yanayolingana ya viongozi wa kikuhani. Tafsiri haiongezi “nyumba” au “huduma,” kwa kuwa hayapo wazi katika Kiebrania, hivyo utata na mvutano wa usemi wa asili vinabaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo “wakuu wa Mungu” umeachwa kwa makusudi ingawa si usemi wa kawaida sana, ili kutopanua au kufasiri kupita kiasi maneno ya Kiebrania.
