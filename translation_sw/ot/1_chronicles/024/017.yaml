translation:
  language: sw
  text: Ya ishirini na moja ilikuwa ya Yakini; ya ishirini na mbili, ya Gamuli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָכִין
  choice: kwa Yakini
  rationale: Katika orodha hii, kihusishi לְ kinaonyesha zamu iliyomwangukia au iliyohusishwa na mtu huyu. “Kwa” ni kifupi na cha kawaida katika muundo wa orodha; jina יָכִין limetoholewa kuwa Yakini.
- source_word: אֶחָד וְ/עֶשְׂרִים
  choice: wa ishirini na moja
  rationale: 'Ingawa Kiebrania hutumia muundo wa namba ya kuhesabu, katika mfululizo huu maana yake ni ya mpangilio: zamu ya ishirini na moja. “Wa” linapatana na nomino iliyodokezwa “zamu.”'
- source_word: לְ/גָמוּל
  choice: kwa Gamuli
  rationale: Kama katika kishazi cha kwanza, לְ linaonyesha mgawo wa zamu. Jina גָמוּל limetoholewa kwa tahajia na matamshi ya kawaida ya Kiswahili kuwa Gamuli.
- source_word: שְׁנַיִם וְ/עֶשְׂרִים
  choice: wa ishirini na mbili
  rationale: Namba ya kuhesabu ya Kiebrania inafanya kazi kama namba ya mpangilio katika orodha hii, yaani zamu ya ishirini na mbili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi wa orodha. Neno “zamu” halijaongezwa wazi kwa sababu linaeleweka kutokana na muktadha wa aya zinazotangulia; muundo “kwa [jina], wa...” unahifadhi ufupi wa Kiebrania.
