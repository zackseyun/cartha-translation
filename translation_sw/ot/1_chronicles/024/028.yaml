  language: sw
  text: 'Kwa Mahli: Eleazari[a], naye hakuwa na wana.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Kwa habari ya Mahli: Eleazari; naye hakuwa na wana.” Huenda kihusishi cha mwanzo kinatumika kama alama ya kichwa au mada ya orodha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַחְלִי
  choice: Kwa Mahli
  rationale: Kiambishi לְ kinafanya kazi kama alama ya mada au kichwa katika orodha hii ya ukoo. “Kwa Mahli” ni Kiswahili cha kawaida kinachohifadhi muundo huo wa orodha.
- source_word: אֶלְעָזָר
  choice: Eleazari
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וְלֹא הָיָה לוֹ
  choice: naye hakuwa na
  rationale: Nahau ya Kiebrania, kihalisi ‘hakuwapo kwake,’ imetafsiriwa kwa Kiswahili cha kawaida ‘hakuwa na.’ Kiunganishi וְ kimehifadhiwa bila kuongeza utofautishaji usio wazi katika chanzo.
- source_word: בָּנִים
  choice: wana
  rationale: Neno hili hapa linamaanisha wana wa kiume katika muktadha wa ukoo, si watoto kwa ujumla.
