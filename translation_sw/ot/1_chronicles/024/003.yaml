  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Majina yametoholewa kwa maumbo yanayotambulika katika matumizi ya Biblia za Kiswahili; sentensi imeweka wazi ushiriki wa Sadoki na Ahimeleki bila kuondoa uwezekano kwamba ‘wana wa’ humaanisha ukoo mpana.
