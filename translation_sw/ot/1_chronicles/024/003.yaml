base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/003.yaml
  text: David[a], with Zadok from the sons of Eleazar and Ahimelech from the sons of Ithamar, divided them according to their appointment in their service.
translation:
  language: sw
  text: Daudi, pamoja na Sadoki aliyekuwa mmoja wa wana wa Eleazari na Ahimeleki aliyekuwa mmoja wa wana wa Ithamari, aliwagawanya kulingana na majukumu waliyopewa[a] katika utumishi wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mpangilio wa kazi zao katika utumishi wao.” Neno la Kiebrania linaweza kujumuisha maana ya kuteuliwa, kusimamiwa, au kupangiwa kazi kwa utaratibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: aliwagawanya
  rationale: Kitenzi חלק pamoja na kiambishi cha nafsi ya tatu wingi humaanisha moja kwa moja kwamba aliwagawanya. Muktadha unaonyesha upangaji wa makundi ya makuhani, lakini tafsiri hii inabaki karibu na Kiebrania.
- source_word: וְצָדוֹק
  choice: pamoja na Sadoki
  rationale: Kiunganishi ו ni ‘na’; ‘pamoja na’ kinaonyesha kwa Kiswahili cha kawaida kwamba Sadoki alishiriki na Daudi katika tendo hilo.
- source_word: מִן בְּנֵי אֶלְעָזָר
  choice: aliyekuwa mmoja wa wana wa Eleazari
  rationale: Kirai hiki kinamtambulisha Sadoki kuwa wa ukoo wa Eleazari. ‘Mmoja wa wana wa’ ni cha asili katika Kiswahili na hakilazimishi maana ya mwana wa moja kwa moja.
- source_word: וַאֲחִימֶלֶךְ
  choice: na Ahimeleki
  rationale: Jina limetoholewa kwa namna inayotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: מִן בְּנֵי אִיתָמָר
  choice: aliyekuwa mmoja wa wana wa Ithamari
  rationale: Sambamba na kirai kinachomhusu Sadoki, maneno haya yanamtambulisha Ahimeleki kuwa wa ukoo wa Ithamari.
- source_word: לִפְקֻדָּתָם
  choice: kulingana na majukumu waliyopewa
  rationale: Neno פקדה linaweza kuhusisha uteuzi, usimamizi, cheo, au mpangilio wa kazi. Katika muktadha huu wa kiutawala, ‘majukumu waliyopewa’ huwasilisha kazi zilizopangwa bila kufafanua taasisi hiyo kupita kiasi.
- source_word: בַּעֲבֹדָתָם
  choice: katika utumishi wao
  rationale: עבודה ni kazi au utumishi; hapa ni utumishi wa kikuhani. ‘Utumishi’ huhifadhi maana hiyo bila kuongeza istilahi ya kimadhehebu.
