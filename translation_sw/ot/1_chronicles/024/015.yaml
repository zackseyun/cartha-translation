  yaml_path: translation/ot/1_chronicles/024/015.yaml
  text: to Hezir the seventeenth, to Happizzez the eighteenth.
translation:
  language: sw
  text: ya kumi na saba ilikuwa ya Heziri, na ya kumi na nane ilikuwa ya Hapisesi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְחֵזִיר
  choice: ilikuwa ya Heziri
  rationale: Kiambishi לְ katika orodha hii kinaonyesha mgawo wa kura. Kiswahili cha kawaida hutumia muundo “ilikuwa ya” kuonyesha aliyepangiwa zamu hiyo; jina limetoholewa kuwa Heziri.
- source_word: שִׁבְעָה עָשָׂר
  choice: ya kumi na saba
  rationale: Katika muktadha wa orodha ya kura na migawanyo, namba hii inatumika kama namba ya mpangilio, hivyo “ya kumi na saba” ni ya asili katika Kiswahili.
- source_word: לְהַפִּצֵּץ
  choice: ilikuwa ya Hapisesi
  rationale: Kiambishi לְ kinaonyesha mgawo wa kura kama katika kishazi cha kwanza. Jina la Kiebrania limetoholewa kwa mwandiko unaosomeka kwa wasemaji wa Kiswahili.
- source_word: שְׁמוֹנָה עָשָׂר
  choice: ya kumi na nane
  rationale: Namba hii ina maana ya mpangilio katika mfululizo wa kura, kwa hiyo imetafsiriwa “ya kumi na nane.”
theological_decisions: []
translation_notes:
  register: Lugha ni fupi, yenye hadhi, na ya kawaida kwa orodha ya migawo. Kitenzi “ilikuwa” kimeongezwa kwa uwazi wa Kiswahili ingawa hakijaandikwa wazi katika Kiebrania; kinaeleweka kutokana na muktadha wa orodha.
