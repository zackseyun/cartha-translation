  text: 'And the sons of Jeriah: Amariah the second[a], Jahaziel the third, Jekameam the fourth.'
translation:
  language: sw
  text: 'Na wana wa Yerija: Amaria, wa pili; Yahazieli, wa tatu; Yekameamu, wa nne.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Muundo wa orodha katika Kiebrania umeacha kitenzi: kihalisi, “Na wana wa Yerija: Amaria, wa pili; Yahazieli, wa tatu; Yekameamu, wa nne.” Pia inaweza kusemwa, “Amaria alikuwa wa pili,” na kadhalika.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנָי
  choice: Na wana wa
  rationale: Kiunganishi waw kinaendeleza orodha iliyotangulia, na muundo wa hali ya umilikaji בְנֵי unamaanisha ‘wana wa’ katika ukoo huu.
- source_word: יְרִיָּהוּ
  choice: Yeria
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili inayokaribia matamshi ya Kiebrania.
- source_word: אֲמַרְיָהוּ
  choice: Amaria
  rationale: Jina limetoholewa kwa mtindo wa kawaida wa majina ya Biblia katika Kiswahili.
- source_word: הַשֵּׁנִי
  choice: wa pili
  rationale: Namba ya mpangilio imehifadhiwa katika muundo mfupi wa orodha; kitenzi ‘alikuwa’ kinaeleweka bila kutajwa.
- source_word: יַחֲזִיאֵל
  choice: Yahazieli
  rationale: Jina limetoholewa kwa kuzingatia konsonanti na irabu za Kiebrania huku likiwa rahisi kutamkwa kwa Kiswahili.
- source_word: הַשְּׁלִישִׁי
  choice: wa tatu
  rationale: Namba ya mpangilio imehifadhiwa moja kwa moja katika muundo wa orodha.
- source_word: יְקַמְעָם
  choice: Yekameamu
  rationale: Jina limetoholewa kutoka katika matamshi ya Kimasora kwa muundo unaotamkika kwa Kiswahili.
- source_word: הָרְבִיעִי
  choice: wa nne
  rationale: Namba ya mpangilio imehifadhiwa bila kuongeza ufafanuzi usiokuwamo wazi katika matini.
