translation:
  language: sw
  text: Kura ya tano ikamwangukia Malkiya[a], na kura ya sita ikamwangukia Miyamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kura ya tano kwa Malkiya, na kura ya sita kwa Miyamini.” Kihusishi cha Kiebrania katika orodha hii ya mgao wa kura kinaweza kutafsiriwa kwa namna zote mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַלְכִּיָּה
  choice: ya Malkiya
  rationale: Katika orodha hii ya kura, kiambishi לְ kinaonyesha kwamba zamu au kura ilimwangukia mtu huyo. Muundo wa Kiswahili “ikawa ya” unaeleza mgao huo kwa njia ya kawaida. Jina limetoholewa kuwa “Malkiya” kwa kufuata umbo la Kiebrania.
- source_word: הַחֲמִישִׁי
  choice: ya tano
  rationale: Nambari ya mpangilio yenye kibainishi imetumiwa kama nomino, ikimaanisha kura au zamu ya tano; muktadha unawezesha Kiswahili kutumia usemi mfupi “ya tano.”
- source_word: לְמִיָּמִן
  choice: ya Miyamini
  rationale: Kama katika kishazi cha kwanza, לְ huonyesha mgao wa kura au zamu. Jina limetoholewa kuwa “Miyamini” ili kuakisi umbo la Kiebrania.
- source_word: הַשִּׁשִּׁי
  choice: ya sita
  rationale: Nambari hii ya mpangilio inaendeleza mtindo wa orodha ya mgao, ikirejelea kura au zamu ya sita.
