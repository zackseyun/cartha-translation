translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha fupi na yenye hadhi inayolingana na orodha ya zamu za kikuhani. Neno “ikawa” limeongezwa kwa uwazi wa kisintaksia bila kubadili maana ya mgao wa kura.
