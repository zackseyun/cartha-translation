lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa hali ya kuambatanisha wa בֵּן, unaotumiwa kama kauli ya kawaida katika orodha ya ukoo. “Wana wa” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: עֻזִּיאֵל
  choice: Uzzieli
  rationale: Jina la mtu limetoholewa kwa umbo lililozoeleka katika Kiswahili cha Biblia, huku sauti na muundo wa jina la Kiebrania zikidumishwa.
- source_word: מִיכָה
  choice: Mika
  rationale: Jina la mtu limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: לִ/בְנֵי
  choice: na wa wana wa
  rationale: Kiambishi ל katika orodha hii kinaunganisha kichwa kingine cha ukoo. Tafsiri hii inaonyesha uhusiano huo kwa Kiswahili cha kawaida bila kukifanya kimaanishe kusudi au manufaa.
- source_word: שמור
  choice: Shamiri
  rationale: Ni jina la mtu; “Shamiri” linafuata umbo la jina linalojulikana kutoka 1 Mambo ya Nyakati 23:20 na desturi ya kulitoh Ebra kwa Kiswahili, huku tahajia ya konsonanti za mstari huu ikibainishwa katika tanbihi.
