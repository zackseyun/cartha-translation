translation:
  language: sw
  text: Kwa Bilga, kura ya kumi na tano[a]; kwa Imeri, kura ya kumi na sita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi “kumi na tano” na “kumi na sita”; katika muktadha huu wa kura zilizopangwa kwa namba, maana yake ni “ya kumi na tano” na “ya kumi na sita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/בִלְגָּה
  choice: Kwa Bilga
  rationale: Kiambishi לְ kinaonyesha mgawo katika orodha ya zamu za makuhani. “Kwa Bilga” ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba mgawo huo ulimwangukia Bilga.
- source_word: חֲמִשָּׁה עָשָׂר
  choice: kura ya kumi na tano
  rationale: Ingawa Kiebrania kimetumia namba ya kuhesabu, “kumi na tano,” muktadha wa kura zinazofuatana unaipa maana ya mpangilio. Neno “kura” limewekwa wazi kutokana na muktadha ili sentensi iwe ya kawaida na inayoeleweka kwa Kiswahili.
- source_word: לְ/אִמֵּר
  choice: kwa Imeri
  rationale: Kama ilivyo kwa Bilga, kiambishi לְ kinaonyesha anayepokea mgawo katika orodha hii. Jina אִמֵּר limetoholewa kuwa “Imeri” kwa matamshi ya kawaida ya Kiswahili.
- source_word: שִׁשָּׁה עָשָׂר
  choice: kura ya kumi na sita
  rationale: Umbo la namba “kumi na sita” linafanya kazi kama namba ya mpangilio katika mfululizo wa kura; Kiswahili cha kawaida husema “kura ya kumi na sita.”
