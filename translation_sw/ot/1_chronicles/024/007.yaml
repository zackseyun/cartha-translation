  text: Kura ya kwanza ilimwangukia Yehoyaribu,[a] na ya pili Yedaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa karibu zaidi na Kiebrania: “Kura ya kwanza ilitoka kwa Yehoyaribu, na ya pili kwa Yedaya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ikamtokea
  rationale: Kitenzi יצא kimsingi humaanisha ‘kutoka’; katika muktadha wa kupiga kura, ‘ikamtokea’ ni Kiswahili cha kawaida kinachoonyesha matokeo ya kura bila kuingiza wazo lisilokuwamo katika Kiebrania.
- source_word: הַגּוֹרָל
  choice: kura
  rationale: גּוֹרָל hapa ni kura iliyotumiwa kuamua mgao wa zamu za kikuhani; ‘kura’ ni neno fupi na la kawaida katika Kiswahili.
- source_word: הָרִאשׁוֹן
  choice: ya kwanza
  rationale: Huhifadhi mpangilio wa kwanza katika orodha na huunda kifungu cha kawaida cha Kiswahili pamoja na ‘kura.’
- source_word: לִיהוֹיָרִיב
  choice: Yehoyaribu
  rationale: Kiambishi ל kinaonyesha aliyepata mgao; maana hiyo imewasilishwa kwa kiambishi cha yambwa katika ‘ikamtokea.’ Jina limenukuliwa kwa mfumo unaokaribia matamshi ya Kiebrania.
- source_word: לִידַעְיָה
  choice: Yedaya
  rationale: Kiambishi ל kinaonyesha mpokeaji wa kura ya pili, kikielezwa na ‘ikamtokea.’ Jina limenukuliwa kwa namna ya kawaida na inayokaribia Kiebrania.
- source_word: הַשֵּׁנִי
  choice: ya pili
  rationale: Huonyesha nafasi ya pili katika mfuatano na kudumisha ulinganifu na ‘ya kwanza.’
