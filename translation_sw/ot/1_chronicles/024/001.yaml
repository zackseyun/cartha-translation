  text: 'Haya ndiyo makundi[a] ya wana wa Aroni: wana wa Aroni walikuwa Nadabu na Abihu, Eleazari na Ithamari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “migawanyo”; neno la Kiebrania linamaanisha makundi ya makuhani yaliyopangwa kwa utumishi.
