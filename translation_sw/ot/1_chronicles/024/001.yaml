lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  choice: Haya ndiyo ... ya wana wa
  rationale: Katika kichwa hiki cha sehemu, muundo huu wa Kiswahili unawasilisha kwa ufasaha utangulizi wa mpangilio unaowahusu wana wa Aroni, bila kuongeza neno la wakati lisilokuwapo katika Kiebrania.
- source_word: מַחְלְקוֹתָם
  choice: makundi
  rationale: Nomino hii inamaanisha migawanyo au vikundi vilivyopangwa kwa utumishi. “Makundi” ni neno la kawaida na linaloeleweka, huku tanbihi ikifafanua kuwa ni makundi yaliyopangwa ya kikuhani.
- source_word: בְּנֵי אַהֲרֹן
  choice: wana wa Aroni
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya muundo wa Kiebrania; jinsia ya kiume imehifadhiwa kwa kuwa kifungu kinawataja wana wa kiume wa Aroni.
- source_word: נָדָב
  choice: Nadabu
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וַאֲבִיהוּא
  choice: na Abihu
  rationale: Jina limetolewa katika umbo la kawaida la Kiswahili na kiunganishi kimehifadhiwa.
- source_word: אֶלְעָזָר
  choice: Eleazari
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וְאִיתָמָר
  choice: na Ithamari
  rationale: Jina limetolewa katika umbo la kawaida la Kiswahili na kiunganishi kimehifadhiwa.
