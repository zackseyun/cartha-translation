  yaml_path: translation/ot/1_chronicles/024/013.yaml
  text: for Huppah[a], the thirteenth; for Jeshebeab, the fourteenth.
translation:
  language: sw
  text: kwa Hupa, ya kumi na tatu; kwa Yeshebeabu, ya kumi na nne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ya Hupa, ya kumi na tatu; ya Yeshebeabu, ya kumi na nne.” Kihusishi cha Kiebrania kinaweza kueleweka kama kuonyesha mgao kwa mtu au nyumba iliyotajwa katika orodha hii ya kura za zamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/חֻפָּה
  choice: ya Hupa
  rationale: Katika orodha hii ya kura za zamu za kikuhani, kiambishi לְ kinaonyesha fungu au zamu iliyomhusu mtu aliyetajwa. Kiswahili cha orodha hutumia kwa asili muundo “ya Hupa,” huku maana mbadala “kwa Hupa” ikibaki inawezekana.
- source_word: שְׁלֹשָׁה עָשָׂר
  choice: ya kumi na tatu
  rationale: Ingawa Kiebrania kimetumia umbo la idadi ya kawaida, katika mfuatano huu linafanya kazi kama namba ya mpangilio wa kura; “ya kumi na tatu” ni usemi wa kawaida wa Kiswahili.
- source_word: לְ/יֶשֶׁבְאָב
  choice: ya Yeshebeabu
  rationale: Kiambishi לְ kinaonyesha zamu iliyohusishwa na nyumba hii ya kikuhani. Jina limenukuliwa kwa mwandiko unaosomeka kwa Kiswahili, na “ya” linafaa katika orodha ya kura.
- source_word: אַרְבָּעָה עָשָׂר
  choice: ya kumi na nne
  rationale: Idadi hii ya kawaida inatumika kwa maana ya mpangilio katika mfuatano wa kura; “ya kumi na nne” huwasilisha kazi hiyo kwa Kiswahili cha kawaida.
