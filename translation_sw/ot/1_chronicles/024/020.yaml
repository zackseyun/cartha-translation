  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Muundo wa orodha ya kiutawala umehifadhiwa bila kufanya sentensi iwe ngumu isivyo lazima. Tanbihi imewekwa baada ya orodha nzima kwa kuwa ufafanuzi wake unahusu majina yote mawili.
