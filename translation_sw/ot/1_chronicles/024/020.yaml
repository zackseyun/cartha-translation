base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/020.yaml
  text: 'And for the remaining sons of Levi: for the sons of Amram[a], Shubael; for the sons of Shubael[b], Jehdeiah.'
translation:
  language: sw
  text: 'Na kwa wana wa Lawi waliosalia: kwa wana wa Amramu, Shubaeli[a]; kwa wana wa Shubaeli, Yehdeya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika orodha hii ya Kiebrania, majina ya watu yanatumika kwa ufupi; yaelekea yanamwakilisha kiongozi au mwakilishi wa kila tawi la ukoo.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/בְנֵי לֵוִי הַ/נּוֹתָרִים
  choice: Na kuhusu wana wengine wa Lawi
  rationale: Kirai hiki kinaendeleza orodha na kuwataja Walawi waliosalia baada ya makundi yaliyotangulia. “Kuhusu” ni njia ya kawaida ya Kiswahili ya kutambulisha kipengele katika orodha, huku “wengine” ikitoa maana ya הַנּוֹתָרִים kwa kawaida.
- source_word: לִ/בְנֵי עַמְרָם
  choice: miongoni mwa wana wa Amramu
  rationale: Kiebrania ni cha mkato katika orodha hii. “Miongoni mwa” kinaonyesha kwamba jina linalofuata linatoka katika tawi hilo la ukoo bila kuongeza kitenzi kisichokuwapo katika chanzo.
- source_word: שׁוּבָאֵל
  choice: Shubaeli
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili na kuhifadhi umbo la jina la Kiebrania.
- source_word: לִ/בְנֵי שׁוּבָאֵל
  choice: miongoni mwa wana wa Shubaeli
  rationale: Muundo unaorudiwa umehifadhiwa ili kuonyesha tawi dogo linalofuata katika orodha ya ukoo.
- source_word: יֶחְדְּיָהוּ
  choice: Yehdeya
  rationale: Tahajia hii ya Kiswahili inawakilisha konsonanti na mpangilio wa jina la Kiebrania kwa namna inayoweza kutamkwa kwa kawaida.
theological_decisions: []
