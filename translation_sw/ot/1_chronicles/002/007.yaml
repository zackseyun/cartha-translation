base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/007.yaml
  text: 'And the sons of Karmi: Achar[a], the troubler of Israel[b], who acted unfaithfully regarding the devoted things.'
translation:
  language: sw
  text: 'Na wana wa Karmi: Akari[a], aliyeleta taabu kwa Israeli, ambaye alikosa uaminifu kuhusu vitu vilivyowekwa wakfu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Akani.” Mambo ya Nyakati hutumia umbo “Akari,” huenda likiwa na mchezo wa maneno unaohusiana na neno la Kiebrania linalomaanisha “anayeleta taabu.” Tazama Yoshua 7.
    reason: alternative_reading
  - marker: b
    text: Kwa Kiebrania, “kitu kilichowekwa wakfu”; yaani, kitu kilichowekwa chini ya agizo la kuangamizwa. Katika muktadha huu neno hilo linaweza kurejelea vitu hivyo kwa jumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי כַּרְמִי
  choice: Na wana wa Karmi
  rationale: Muundo wa nasaba umehifadhiwa kwa kutumia “wana wa,” huku kiunganishi וּ kikitafsiriwa “Na.”
- source_word: עָכָר
  choice: Akari
  rationale: Jina limetoholewa kwa kufuata umbo עָכָר lililo katika Mambo ya Nyakati, badala ya kulisawazisha na עָכָן (Akani) katika Yoshua 7.
- source_word: עוֹכֵר יִשְׂרָאֵל
  choice: aliyewaletea Israeli taabu
  rationale: Kirai hiki kinaonyesha kwamba Akari ndiye aliyeisababishia Israeli taabu. Kiswahili hiki ni cha kawaida na wazi, ingawa mchezo wa sauti kati ya עָכָר na עוֹכֵר hauwezi kuhifadhiwa kikamilifu; umeelezwa katika tanbihi.
- source_word: מָעַל
  choice: alikosa uaminifu
  rationale: Kitenzi hiki huonyesha kuvunja uaminifu, hasa katika jambo takatifu. Tafsiri hii huhifadhi uzito wa kimaadili na kidini bila kutumia istilahi isiyoeleweka kwa urahisi.
- source_word: בַּחֵרֶם
  choice: kuhusu vitu vilivyowekwa wakfu
  rationale: חֵרֶם hapa inahusu mali iliyotengwa chini ya marufuku ya Mungu, katika muktadha huu kwa ajili ya kuangamizwa. Wingi wa “vitu” unaonyesha maana ya kijumla katika simulizi la Yoshua 7, huku tanbihi ikifafanua dhana hiyo.
theological_decisions:
- issue: Maana ya חֵרֶם katika simulizi la kosa na hukumu
  choice: vitu vilivyowekwa wakfu
  alternative: vitu vilivyotengwa kwa ajili ya kuangamizwa; vitu vilivyokuwa chini ya marufuku
  rationale: Neno hilo linaunganisha wazo la kutengwa kwa ajili ya Mungu na, katika muktadha huu, kuamriwa kuangamizwa. Matini kuu inahifadhi lugha fupi ya kuwekwa wakfu, na tanbihi inaeleza maana mahsusi bila kuondoa mvutano wa neno la Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaoeleweka. Muundo mfupi wa nasaba umehifadhiwa, lakini kirai cha kishiriki עוֹכֵר kimetolewa kwa sentensi ya kawaida ya Kiswahili ili kuepuka nomino nzito au isiyo ya kawaida.
