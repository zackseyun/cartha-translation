  source_fidelity: The draft correctly preserves the genealogical construction, the distinct Chronicler form Akari (עָכָר), the appositional identification of him as Israel’s troubler, and the breach-of-faith sense of מָעַל. The plural “vitu” is a defensible contextual rendering of the singular collective חֵרֶם in the Achan narrative.
  naturalness: “Aliyewaletea Israeli taabu” is understandable, but “aliyeleta taabu kwa Israeli” is more idiomatic and directly reflects “troubler of Israel.”
  terminology: “Vitu vilivyowekwa wakfu” can suggest ordinary consecrated objects without adequately signaling the חרם category. The footnote should explicitly retain both dedication and destruction while avoiding the imprecise phrase “marufuku ya Mungu.”
