  - severity: medium
    issue: The footnote’s explanation of חֵרֶם is imprecise.
    rationale: “Vimetengwa chini ya marufuku ya Mungu” is not natural terminology for the Hebrew concept and may obscure that these were items devoted/placed under the ban for destruction. A revised note states this directly while preserving the lexical nuance.
