  text: 'The sons of Nadab: Seled and Appaim[a]. Seled died without sons.'
translation:
  language: sw
  text: 'Wana wa Nadabu: Seledi na Apaimu. Seledi alikufa bila kuwa na wana.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Wana wa
  rationale: Nomino ya wingi katika hali ya kuunganisha inaanzisha taarifa ya ukoo; katika Kiswahili, “Wana wa” ni ya kawaida na kiunganishi cha mwanzo hakihitaji kutafsiriwa tofauti.
- source_word: נָדָב
  choice: Nadabu
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: סֶלֶד
  choice: Seledi
  rationale: Jina la mtu limetoholewa na kutumiwa kwa uthabiti katika sehemu zote mbili.
- source_word: וְאַפָּיִם
  choice: na Apaimu
  rationale: Katika muktadha huu wa ukoo, umbo hili ni jina la mtu, si nomino ya kawaida; kiunganishi וְ kimetafsiriwa “na.”
- source_word: וַיָּמָת
  choice: alikufa
  rationale: Kitenzi cha מוּת kinaeleza tukio linalofuata; wakati uliopita wa Kiswahili unawasilisha maana hiyo kwa kawaida.
- source_word: לֹא בָנִים
  choice: bila kuwa na wana
  rationale: Kiebrania kinasema kihalisi “si wana.” Usemi huu wa Kiswahili unaonyesha kwamba hakuwa na wana wa kiume, bila kuupanua kuwa “watoto.”
