base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/019.yaml
  text: Azubah died[a], and Caleb took Ephrath as his wife[b], and she bore Hur to him.
translation:
  language: sw
  text: Azuba akafa, na Kalebu akamwoa Efrati[a], naye akamzalia Huri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “akamchukua Efrati kwa ajili yake,” ambayo ni nahau yenye maana ya kumwoa. Jina hili pia huonekana kwa umbo “Efrata” mahali pengine, lakini hapa Kiebrania kina umbo fupi Efrati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: akafa
  rationale: Kitenzi מות katika Qal kina maana ya kawaida ya kufa; “akafa” ni Kiswahili cha moja kwa moja bila kutumia lugha ya kuficha maana.
- source_word: עֲזוּבָה
  choice: Azuba
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: וַיִּקַּח לוֹ
  choice: akamwoa
  rationale: לקח pamoja na mwanamke kama yambwa ni nahau ya kumchukua kuwa mke. “Akamwoa” huwasilisha maana ya ndoa kwa Kiswahili cha kawaida bila kuleta dhana isiyokusudiwa ya kumiliki au kubeba.
- source_word: כָלֵב
  choice: Kalebu
  rationale: Jina la mtu limetoholewa kwa umbo lililozoeleka katika Biblia za Kiswahili.
- source_word: אֶפְרָת
  choice: Efrati
  rationale: Jina limetoholewa kutoka umbo fupi la Kiebrania אֶפְרָת; “Efrati” ni umbo linalotamkika kwa urahisi katika Kiswahili.
- source_word: וַתֵּלֶד לוֹ
  choice: akamzalia
  rationale: ילד katika Qal pamoja na לוֹ huonyesha kuzaa mtoto kwa ajili ya au kwa uhusiano na baba; “akamzalia” huhifadhi kitenzi cha kuzaa na rejeo la ‘kwake’ kwa Kiswahili asilia.
- source_word: חוּר
  choice: Huri
  rationale: Jina la mtu limetoholewa kwa umbo linalofaa mfumo wa sauti wa Kiswahili.
