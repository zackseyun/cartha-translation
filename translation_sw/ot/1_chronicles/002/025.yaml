base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/025.yaml
  text: The sons of Jerahmeel[a], the firstborn of Hezron, were Ram his firstborn, Bunah, Oren, Ozem, and Ahijah.
translation:
  language: sw
  text: 'Wana wa Yerameeli[a], mzaliwa wa kwanza wa Hesroni, walikuwa hawa: Rama, mzaliwa wake wa kwanza, na Buna, na Oreni, na Osemu, na Ahiya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Muundo wa sentensi ya Kiebrania unaweza kueleweka kuwa unaorodhesha wana watano wa Yerameeli, huku Rama akitajwa kuwa mzaliwa wake wa kwanza. Baadhi ya watafsiri wamependekeza kulielewa jina “Ahiya” kwa namna tofauti kuhusiana na orodha hii, lakini usomaji wa moja kwa moja unalichukulia kuwa jina jingine katika mfululizo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: walikuwa
  rationale: Katika orodha ya ukoo, kitenzi hiki kinatanguliza watu wa familia; “walikuwa” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: בְנֵי
  choice: Wana wa
  rationale: Muundo huu wa ukoo unaonyesha wana wa kiume wa mtu aliyetajwa; “wana wa” huhifadhi maana ya kijinsia na ya kiukoo.
- source_word: יְרַחְמְאֵל
  choice: Yerahmeeli
  rationale: Jina limetoholewa kwa tahajia inayofaa katika Kiswahili.
- source_word: בְּכוֹר חֶצְרוֹן
  choice: mzaliwa wa kwanza wa Hezroni
  rationale: Kirai hiki kinaonyesha hadhi ya Yerahmeeli kuwa mzaliwa wa kwanza wa Hezroni.
- source_word: הַבְּכוֹר
  choice: mzaliwa wake wa kwanza
  rationale: Kirai kinamfafanua Ramu kuwa mzaliwa wa kwanza wa Yerahmeeli; kiwakilishi “wake” kinaweka uhusiano huo wazi bila kuondoa urudiaji wa Kiebrania.
- source_word: רָם
  choice: Ramu
  rationale: Jina limetoholewa kwa matumizi ya kawaida ya Kiswahili.
- source_word: וּבוּנָה
  choice: Buna
  rationale: Jina limetoholewa kwa tahajia inayofaa katika Kiswahili.
- source_word: וָאֹרֶן
  choice: Oreni
  rationale: Jina limetoholewa kwa tahajia inayofaa katika Kiswahili.
- source_word: וָאֹצֶם
  choice: Ozemu
  rationale: Jina limetoholewa kwa tahajia inayofaa katika Kiswahili.
- source_word: אֲחִיָּה
  choice: Ahiya
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
theological_decisions:
- issue: Uhusiano wa אֲחִיָּה na orodha ya wana
  choice: Ahiya ametafsiriwa kuwa mwana wa tano katika orodha.
  alternative: Kulichukulia neno hili kwa namna nyingine kisintaksia kuhusiana na orodha iliyotangulia.
  rationale: Usomaji wa moja kwa moja wa sintaksia ya Kiebrania unalitambua kama jina jingine la mtu katika mfululizo, huku tanbihi ikihifadhi uwezekano wa uchambuzi mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ukoo umehifadhiwa kwa uwazi, na majina yametoholewa kwa namna inayosomeka kiasili kwa wasomaji wa Kiswahili.
