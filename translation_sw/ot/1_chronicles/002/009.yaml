lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Wana wa
  rationale: Nomino ya wingi katika hali ya kutegemea huonyesha wana wa Hesroni. Kiunganishi cha mwanzo וּ hakihitaji kutafsiriwa kwa neno tofauti katika mtindo huu wa orodha ya ukoo.
- source_word: חֶצְרוֹן
  choice: Hesroni
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: waliozaliwa kwake
  rationale: Huhifadhi maana ya kauli tendwa ya kitenzi ילד pamoja na לוֹ, huku upatanisho wa wingi ukifanya sentensi iwe ya kawaida katika Kiswahili.
- source_word: אֶת
  choice: —
  rationale: Ni kiashiria cha yambwa katika Kiebrania na hakina neno la moja kwa moja linalohitajika katika Kiswahili.
- source_word: יְרַחְמְאֵל
  choice: Yerahmeeli
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: רָם
  choice: Ramu
  rationale: Jina la mtu limetoholewa kwa muundo wa kawaida wa Kiswahili.
- source_word: כְּלוּבָי
  choice: Kelubai
  rationale: Jina lililo katika maandishi ya Kiebrania limetafsiriwa moja kwa moja badala ya kulisawazisha kimyakimya na jina Kalebu.
