base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/004.yaml
  text: Tamar[a], his daughter-in-law, bore Perez and Zerah to him[b]. All the sons of Judah were five.
translation:
  language: sw
  text: Tamari, binti-mkwe wake, alimzalia Peresi[b] na Zera. Wana wote wa Yuda walikuwa watano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kauli hii inatoa jumla baada ya Peresi na Zera kuongezwa kwa wana wa Yuda waliotajwa kabla: Eri, Onani na Shela.'
    reason: cross_reference
  - marker: b
    text: Jina Peresi pia huandikwa “Peretsi” katika mifumo fulani ya unukuzi wa herufi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָמָר
  choice: Tamari
  rationale: Jina la mtu limetoholewa kwa umbo la kawaida la Kiswahili la majina ya Biblia.
- source_word: כַּלָּתוֹ
  choice: mkwewe
  rationale: Neno כַּלָּה lenye kiambishi cha nafsi ya tatu ya kiume humaanisha mke wa mwana wake, yaani mkwe wa kike. ‘Mkwewe’ ni neno la kawaida na lenye heshima katika Kiswahili, ingawa jinsia hiyo inabainishwa na muktadha.
- source_word: יָלְדָה ... לוֹ
  choice: akamzalia
  rationale: Kitenzi hiki kinaunganisha kwa Kiswahili cha kawaida tendo la kuzaa na uhusiano unaoonyeshwa na לוֹ, bila kuongeza wazo lisilokuwamo katika Kiebrania.
- source_word: פֶּרֶץ
  choice: Peresi
  rationale: Ni umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili; tahajia mbadala iliyo karibu zaidi na matamshi ya Kiebrania imeonyeshwa katika tanbihi.
- source_word: זָרַח
  choice: Zera
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: כָּל בְּנֵי יְהוּדָה
  choice: Wana wote wa Yuda
  rationale: ‘Wana’ huhifadhi maana mahususi ya בְּנֵי kama wana wa kiume katika orodha hii ya ukoo.
- source_word: חֲמִשָּׁה
  choice: walikuwa watano
  rationale: Kiswahili huhitaji upatanisho wa ngeli; usemi huu unahifadhi kauli ya moja kwa moja ya jumla ya wana watano.
theological_decisions:
- issue: Muhtasari wa ukoo baada ya kutajwa kwa Peresi na Zera
  choice: Wana wote wa Yuda walikuwa watano.
  alternative: Hao ndio wana wote watano wa Yuda.
  rationale: Kiebrania kinatoa jumla rahisi ya wana wa Yuda. Tafsiri iliyochaguliwa huhifadhi muundo wa kauli hiyo bila kuigeuza kuwa ufafanuzi.
- issue: Istilahi za ukoo zenye jinsia mahususi
  choice: mkwewe; wana
  alternative: jamaa yake kwa ndoa; watoto
  rationale: Maneno ya Kiebrania yanataja uhusiano wa mke wa mwana na wana wa kiume; kuyafanya yasiyo na jinsia kungepunguza umahususi wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni mfupi na wenye hadhi unaofaa orodha ya ukoo. ‘Akamzalia’ ni wa kawaida na huwasilisha kwa pamoja יָלְדָה לוֹ. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
