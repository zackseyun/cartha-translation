  text: וְ/אַחַ֥ר מוֹת חֶצְר֖וֹן בְּ/כָלֵ֣ב אֶפְרָ֑תָה וְ/אֵ֤שֶׁת חֶצְרוֹן֙ אֲבִיָּ֔ה וַ/תֵּ֣לֶד ל֔/וֹ אֶת אַשְׁח֖וּר אֲבִ֥י תְקֽוֹעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/024.yaml
  text: After Hezron died in Caleb-ephrathah[a], Hezron’s wife Abijah bore to him Ashhur[b], the father of Tekoa.
translation:
  language: sw
  text: Baada ya Hesron kufa huko Kalebu-Efratha[a], Abiya, mke wa Hesron, akamzalia Ashuri, baba wa Tekoa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai cha Kiebrania “huko Kalebu-Efratha” ni kigumu. Huenda kinataja mahali au ukoo; kwa kawaida hutafsiriwa “Kalebu-Efratha” au “Kalebu Efratha.”
    reason: alternative_reading
  - marker: b
    text: Au “mwanzilishi wa Tekoa.” Katika orodha za vizazi, “baba wa” anaweza kumaanisha mwanzilishi au babu mkuu wa makazi au ukoo, si lazima baba mzazi wa moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר מוֹת חֶצְרוֹן
  choice: Baada ya Hesron kufa
  rationale: Muundo huu unaonyesha wakati kwa njia ya kawaida na wazi katika Kiswahili, huku ukihifadhi maana ya ‘baada ya kifo cha Hesron.’
- source_word: בְּכָלֵב אֶפְרָתָה
  choice: huko Kalebu-Efratha
  rationale: Herufi בְּ imeeleweka kwa maana ya mahali. ‘Huko’ inasomeka kwa u自然 katika Kiswahili, lakini tanbihi inadumisha kwamba kirai hiki cha Kiebrania ni kigumu na huenda ni jina la mahali au ukoo.
- source_word: וְאֵשֶׁת חֶצְרוֹן אֲבִיָּה
  choice: Abiya, mke wa Hesron
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unaonyesha wazi kwamba Abiya ndiye mke wa Hesron.
- source_word: וַתֵּלֶד לוֹ
  choice: akamzalia
  rationale: Kitenzi ‘akamzalia’ kinahifadhi wazo la kwamba alimzaa mtoto kwa ajili yake au kuwa mtoto wake, bila kuongeza maelezo yasiyomo katika chanzo.
- source_word: אַשְׁחוּר
  choice: Ashuri
  rationale: Hili ni umbo la jina linalosomeka kwa urahisi katika Kiswahili na linawakilisha jina la Kiebrania Ashhur.
- source_word: אֲבִי תְקוֹעַ
  choice: baba wa Tekoa
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya אָב; maana pana ya mwanzilishi au babu mkuu wa mji au ukoo imewekwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Majina yametoholewa kwa tahajia inayofaa Kiswahili. Alama za tanbihi zimewekwa kwenye virai husika, zikirekebisha kutolingana kwa alama katika safu ya ushauri ya Kiingereza.
