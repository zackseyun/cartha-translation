base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/016.yaml
  text: 'Their sisters were Zeruiah and Abigail. The sons of Zeruiah: Abishai, Joab, and Asahel—three.'
translation:
  language: sw
  text: Dada zao walikuwa Seruya na Abigaili. Wana wa Seruya walikuwa Abishai, Yoabu na Asaheli—watatu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲחֹתֵיהֶם
  choice: Dada zao walikuwa
  rationale: Kirai hiki kinahifadhi wingi wa ‘dada’ na kiambishi cha nafsi ya tatu wingi ‘zao’; kuacha kiunganishi cha mwanzo kunatoa Kiswahili cha asili katika muktadha wa nasaba.
- source_word: צְרוּיָה
  choice: Seruya
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: וַאֲבִיגָיִל
  choice: na Abigaili
  rationale: Kiunganishi ו kimetafsiriwa ‘na,’ na jina limetoholewa kwa tahajia ya Kiswahili.
- source_word: וּבְנֵי צְרוּיָה
  choice: Wana wa Seruya walikuwa
  rationale: Kirai cha uambatanisho kinamaanisha ‘wana wa Seruya’; ‘walikuwa’ imeongezwa ili orodha isomeke kwa kawaida na kwa uwazi katika Kiswahili.
- source_word: אַבְשַׁי
  choice: Abishai
  rationale: Jina la mtu limetoholewa kwa tahajia inayotambulika katika Kiswahili.
- source_word: וְיוֹאָב
  choice: Yoabu
  rationale: Jina limetoholewa kwa mfumo wa sauti wa Kiswahili; kiunganishi cha Kiebrania kinawakilishwa katika mpangilio wa orodha.
- source_word: וַעֲשָׂהאֵל
  choice: na Asaheli
  rationale: Jina limetoholewa ‘Asaheli,’ na kiunganishi kimetafsiriwa ‘na’ mbele ya jina la mwisho katika orodha.
- source_word: שְׁלֹשָׁה
  choice: watatu
  rationale: Namba ya jumla imehifadhiwa wazi kama ilivyo katika Kiebrania; ngeli ya watu inahitaji ‘watatu.’
