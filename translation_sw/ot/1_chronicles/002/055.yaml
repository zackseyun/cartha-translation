base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/055.yaml
  text: 'and the families of the scribes who lived at Jabez: the Tirathites[a], the Shimeathites, and the Sucathites. These are the Kenites who came from Hammath, the father of the house of Rechab.'
translation:
  language: sw
  text: 'Na koo za waandishi walioishi Yabesi zilikuwa Watirathi, Washimeathi, na Wasukathi. Hao ndio Wakeni waliotoka kwa Hamathi, baba wa ukoo wa Rekabu.[a]


    [a] Au, “babu wa ukoo wa Rekabu,” au “mwanzilishi wa ukoo wa Rekabu.” Katika orodha za vizazi, neno la Kiebrania linalomaanisha “baba” linaweza pia kumaanisha babu wa ukoo au mwanzilishi wake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “babu wa ukoo wa Rekabu,” au “mwanzilishi wa ukoo wa Rekabu.” Katika orodha za vizazi, neno la Kiebrania linalomaanisha “baba” linaweza pia kumaanisha babu wa ukoo au mwanzilishi wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִשְׁפְּחוֹת
  choice: Na koo za
  rationale: Kiunganishi וּ kimetafsiriwa “Na” ili kuhifadhi mwendelezo wa orodha ya ukoo; מִשְׁפְּחוֹת hapa ni makundi ya kifamilia au koo.
- source_word: סֹפְרִים
  choice: waandishi
  rationale: Neno hili humaanisha watu waliohusika na uandishi na utunzaji wa kumbukumbu; “waandishi” ni istilahi ya kawaida na haibainishi zaidi ya ushahidi wa maandishi.
- source_word: ישבו יַעְבֵּץ
  choice: walioishi Yabesi
  rationale: Kitenzi kinaonyesha makao yao, huku Yabesi likiwa jina la mahali; kishazi tegemezi ni cha kawaida katika Kiswahili.
- source_word: תִּרְעָתִים שִׁמְעָתִים שׂוּכָתִים
  choice: Watirathi, Washimeathi, na Wasukathi
  rationale: Haya ni majina ya vikundi au koo; kiambishi Wa- kinaonyesha makundi ya watu kwa Kiswahili, huku sauti za majina zikihifadhiwa kwa unukuzi.
- source_word: הֵמָּה הַ/קִּינִים
  choice: Hao ndio Wakeni
  rationale: Muundo wa utambulisho umehifadhiwa kwa “Hao ndio,” na jina la kikundi קִּינִים limetolewa kwa umbo la kawaida la Kiswahili “Wakeni.”
- source_word: הַ/בָּאִים מֵ/חַמַּת
  choice: waliotoka kwa Hamathi
  rationale: “Waliotoka kwa” huhifadhi maana ya asili au kutoka bila kulazimisha iwapo kinachokusudiwa ni uhamaji au nasaba.
- source_word: אֲבִי בֵית רֵכָב
  choice: baba wa ukoo wa Rekabu
  rationale: “Baba” huhifadhi taswira ya moja kwa moja ya Kiebrania, na “ukoo” huwasilisha maana ya בֵית kama jamaa au nasaba katika muktadha huu; maana zinazowezekana za babu au mwanzilishi zimeelezwa katika tanbihi.
theological_decisions:
- issue: Maana ya אָב katika kauli אֲבִי בֵית רֵכָב
  choice: baba wa ukoo wa Rekabu
  alternative: babu wa ukoo wa Rekabu; mwanzilishi wa ukoo wa Rekabu
  rationale: Tafsiri kuu inadumisha nahau ya Kiebrania bila kuamua kimya kimya ikiwa Hamathi alikuwa mzazi wa moja kwa moja, babu wa nasaba, au mwanzilishi wa ukoo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Majina ya koo yamepewa kiambishi Wa-. Alama ya tanbihi imewekwa baada ya “Rekabu,” mahali inapohusika na neno “baba”; hii inasahihisha kutolingana kwa nafasi ya alama katika safu ya ushauri ya Kiingereza.
