  text: Jerahmeel also had another wife, and her name was Atarah; she was the mother of Onam.
translation:
  language: sw
  text: Yerameeli pia alikuwa na mke mwingine; jina lake lilikuwa Atara. Yeye alikuwa mama wa Onamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: pia alikuwa na
  rationale: Muundo wa Kiebrania היה pamoja na ל unaweza kuonyesha kuwa mtu alikuwa na kitu au mtu. Katika taarifa hii ya ukoo, Kiswahili cha kawaida husema “alikuwa na”; “pia” huonyesha nyongeza katika muktadha.
- source_word: אִשָּׁה אַחֶרֶת
  choice: mke mwingine
  rationale: אִשָּׁה katika muktadha huu ni “mke,” na אַחֶרֶת humtofautisha au kumwongeza kwa mke aliyetajwa katika muktadha.
- source_word: לִירַחְמְאֵל
  choice: Yerameeli
  rationale: Kiambishi ל kimewakilishwa katika muundo wa umilikaji “Yerameeli ... alikuwa na.” Jina limetoholewa kwa tahajia inayosomeka kiasili katika Kiswahili.
- source_word: וּשְׁמָהּ
  choice: jina lake
  rationale: Hii ni fomula ya kawaida ya kutaja jina; katika Kiswahili, “jina lake Atara” ni fupi, wazi, na ya asili.
- source_word: עֲטָרָה
  choice: Atara
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa maana yake.
- source_word: הִיא
  choice: huyo ndiye
  rationale: Kiwakilishi huru kina uzito wa utambulisho au ufafanuzi; “huyo ndiye” kinahifadhi msisitizo huo kwa Kiswahili cha kawaida bila kuuzidisha.
- source_word: אֵם
  choice: mama yake
  rationale: Tafsiri ya moja kwa moja na ya kawaida katika taarifa ya ukoo.
- source_word: אוֹנָם
  choice: Onamu
  rationale: Jina la mtu limetoholewa kwa umbo linaloweza kutamkwa kwa urahisi katika Kiswahili.
