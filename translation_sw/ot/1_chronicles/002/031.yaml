  yaml_path: translation/ot/1_chronicles/002/031.yaml
  text: 'The sons of Appaim: Ishi[a]; and the sons of Ishi: Sheshan; and the sons of Sheshan: Ahlai.'
translation:
  language: sw
  text: 'Na wana[a] wa Apaimu: Yishi; na wana wa Yishi: Sheshani; na wana wa Sheshani: Ahlai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wazao wa” katika kila kutokea kwa “wana wa”; neno la Kiebrania linaweza kumaanisha ukoo katika nasaba, ingawa “wana wa” ndiyo tafsiri ya moja kwa moja hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: na wana wa
  rationale: Katika nasaba, בְּנֵי inaweza kutaja wana wa moja kwa moja au wazao kwa upana. “Wana wa” ndilo chaguo la moja kwa moja na la kawaida katika Kiswahili, huku uwezekano mpana zaidi ukihifadhiwa katika tanbihi.
- source_word: אַפַּיִם
  choice: Apaimu
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, huku muundo wa sauti za Kiebrania ukihifadhiwa.
- source_word: יִשְׁעִי
  choice: Yishi
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania; herufi Y huhifadhi sauti ya mwanzo ya jina.
- source_word: שֵׁשָׁן
  choice: Sheshani
  rationale: Jina limetoholewa kwa muundo unaofaa matamshi na tahajia ya Kiswahili.
- source_word: אַחְלָי
  choice: Ahlai
  rationale: Jina limetoholewa kutoka Kiebrania bila kulipa maana au kuongeza ufafanuzi ambao haupo katika mstari.
