translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo mfupi wa kinasaba umehifadhiwa kwa kutumia nukta mbili na nuktamkato. Kiunganishi “na” cha mwanzo kimehifadhiwa kwa sababu kipo katika maandishi ya Kiebrania na kinaunganisha mstari huu na nasaba inayotangulia.
