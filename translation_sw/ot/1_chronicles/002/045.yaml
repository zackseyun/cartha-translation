lexical_decisions:
- source_word: וּ/בֶן
  choice: Mwana wa
  rationale: Katika mfululizo huu wa nasaba, בֶן ina maana ya “mwana wa.” Kiunganishi ו hakihitaji kutafsiriwa kwa neno tofauti hapa kwa kuwa Kiswahili huendeleza nasaba kwa ufasaha bila “na” mwanzoni.
- source_word: שַׁמַּי
  choice: Shamai
  rationale: Jina la mtu limenukuliwa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: מָעוֹן
  choice: Maoni
  rationale: Muundo wa kisarufi katika nasaba unalitambulisha kama jina la mtu; limenukuliwa kwa namna inayofaa matamshi ya Kiswahili.
- source_word: וּ/מָעוֹן
  choice: naye Maoni
  rationale: Kurudiwa kwa jina kumehifadhiwa, huku “naye” ikionyesha mwendelezo wa asili wa taarifa katika Kiswahili.
- source_word: אֲבִי
  choice: alikuwa baba wa
  rationale: Huhifadhi nahau ya kawaida ya nasaba bila kuamua kimya kimya ikiwa uhusiano ni wa baba wa moja kwa moja, babu, mwanzilishi, au mkuu wa ukoo/makazi.
- source_word: בֵית צוּר
  choice: Beth-suri
  rationale: Jina la mahali au ukoo limenukuliwa kama jina maalumu badala ya kutafsiriwa kihalisi kuwa “nyumba ya Suri.”
