  text: Naye mwana wa Shamai alikuwa Maoni, naye Maoni alikuwa baba wa Beth-suri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “babu au mwanzilishi wa Beth-suri.” Katika nasaba, usemi “baba wa” unaweza pia kumaanisha babu au mwanzilishi wa ukoo au makazi.
