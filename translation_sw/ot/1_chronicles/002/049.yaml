id: 1CH.2.49
reference: 1 Chronicles 2:49
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/תֵּ֗לֶד שַׁ֚עַף אֲבִ֣י מַדְמַנָּ֔ה אֶת שְׁוָ֛א אֲבִ֥י מַכְבֵּנָ֖ה וַ/אֲבִ֣י גִבְעָ֑א וּ/בַת כָּלֵ֖ב עַכְסָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/049.yaml
  text: Shepha fathered Sheva, the father of Machbenah and the father of Gibea; and Caleb’s daughter was Acsah.
translation:
  language: sw
  text: Naye akamzaa Shaafu, baba wa Madmana, na Sheva, baba wa Makbena na baba wa Gibea. Binti wa Kalebu alikuwa Aksa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Naye akamzaa
  rationale: Kitenzi ni cha kike na kinarejelea Maaka katika muktadha uliotangulia; tafsiri inadumisha uhusiano huo bila kutaja jina ambalo halirudiwi katika mstari huu.
- source_word: שַׁעַף
  choice: Shaafu
  rationale: Unukuzi wa jina la Kiebrania unaofuata matamshi ya Kiswahili na kuonyesha konsonanti ya mwisho kwa vokali ya kusaidia.
- source_word: אֲבִי
  choice: baba ya
  rationale: Maana ya msingi ni ‘baba wa’; katika orodha za nasaba inaweza pia kumaanisha babu au mwanzilishi wa mahali, lakini tafsiri haijafafanua zaidi ya maandishi.
- source_word: מַדְמַנָּה
  choice: Madmana
  rationale: Unukuzi wa kawaida na rahisi kutamkwa kwa Kiswahili.
- source_word: שְׁוָא
  choice: Sheva
  rationale: Unukuzi unaowakilisha konsonanti za jina la Kiebrania bila kulichanganya na Shaafu.
- source_word: מַכְבֵּנָה
  choice: Makbena
  rationale: Unukuzi wa jina la mahali au mtu kwa muundo wa sauti unaofaa Kiswahili.
- source_word: גִבְעָא
  choice: Gibea
  rationale: Unukuzi unaohifadhi umbo la jina la Kiebrania.
- source_word: עַכְסָה
  choice: Aksa
  rationale: Unukuzi wa moja kwa moja, unaosomeka kwa urahisi katika Kiswahili.
theological_decisions:
- issue: Uhusiano wa Maaka, Shaafu, na Sheva katika nasaba
  choice: Maaka ndiye anayemzaa Shaafu na Sheva; Shaafu ni baba ya Madmana, na Sheva ni baba ya Makbena na Gibea.
  alternative: Shaafu alimzaa Sheva, huku Madmana ikiachwa nje.
  rationale: Sarufi ya maandishi ya Kimasora ina kitenzi cha kike וַתֵּלֶד, kisha inataja Shaafu pamoja na cheo chake ‘baba ya Madmana,’ na את kabla ya Sheva humweka Sheva kama mtoto mwingine wa yule mwanamke. Hivyo muundo wa chanzo umepewa uzito kuliko safu ya mashauriano ya Kiingereza.
- issue: Maana ya ‘baba’ katika orodha ya ukoo na maeneo
  choice: Kudumisha neno ‘baba’ bila kulifasiri kuwa mwanzilishi au babu.
  alternative: Kutafsiri ‘mwanzilishi wa’ au ‘babu wa.’
  rationale: אֲבִי inaweza kuonyesha baba wa kawaida, babu, au mwanzilishi wa ukoo/mahali. Maandishi hayalazimishi maana moja, kwa hiyo utata umehifadhiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kusomeka. Muundo wa sentensi umewekwa wazi ili kutenganisha matawi ya nasaba, huku urudiaji wa ‘baba ya’ ukihifadhi msisitizo na mpangilio wa chanzo.
