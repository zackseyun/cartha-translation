base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/018.yaml
  text: 'And Caleb son of Hezron fathered children by Azubah his wife[a], and by Jerioth; and these were her sons: Jesher, Shobab[b], and Ardon.'
translation:
  language: sw
  text: 'Kalebu mwana wa Hesroni akawa na watoto kwa Azuba, mke wake[a], na kwa Yeriyothi; na hawa ndio waliokuwa wanawe[b]: Yesheri, Shobabu, na Ardoni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Muundo wa Kiebrania ni mgumu. Yeriyothi anaweza kueleweka kuwa mwanamke wa pili aliyehusishwa na Kalebu, au, katika tafsiri nyingine, kama jina linalohusishwa na Azuba kwa maelezo.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “wanawe”; neno hilo lina kiambishi cha kike cha umoja. Baadhi ya wafasiri huuelewa ukoo huu kwa njia tofauti, lakini Andiko la Kimasora lina kiambishi cha kike hapa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: akapata watoto kwa
  rationale: Hifili ya ילד hapa ina maana ya kuzaa au kuwa baba wa watoto. Katika Kiswahili, “akapata watoto kwa” huonyesha kwa kawaida uhusiano wa kizazi na wanawake wanaotajwa bila kutumia lugha ngumu isiyo ya kawaida.
- source_word: אֶת עֲזוּבָה אִשָּׁה וְאֶת יְרִיעוֹת
  choice: kwa Azuba mke wake, na kwa Yeriothi
  rationale: Muundo wa Kiebrania ni mgumu na umebanwa. “Mke wake” linaelewa אִשָּׁה kama maelezo ya Azuba, huku Yeriothi akiratibiwa kama mwanamke mwingine; tanbihi inahifadhi uwezekano wa uelewa mwingine.
- source_word: אִשָּׁה
  choice: mke wake
  rationale: Ingawa hakuna kiambishi cha umilikaji kilicho wazi, maana ya “mke” inafaa katika muktadha huu wa ukoo, na Kiswahili cha kawaida huhitaji “wake” ili uhusiano uwe wazi.
- source_word: יְרִיעוֹת
  choice: Yeriothi
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: וְאֵלֶּה בָנֶיהָ
  choice: na hawa ndio waliokuwa wanawe
  rationale: Kiambishi cha בָנֶיהָ ni cha kike, nafsi ya tatu umoja; “wanawe” huhifadhi umilikaji huo bila kulazimisha jina la mwanamke anayerejelewa. Wakati uliopita unafaa masimulizi ya ukoo.
- source_word: יֵשֶׁר וְשׁוֹבָב וְאַרְדּוֹן
  choice: Yesheri, Shobabu na Ardoni
  rationale: Majina yametoholewa kwa mfumo wa sauti wa Kiswahili huku yakibaki yanatambulika.
theological_decisions:
- issue: Utata wa ukoo kuhusu wanawake wanaotajwa katika mstari
  choice: Kalebu alipata watoto kwa Azuba mke wake na kwa Yeriothi; majina yanayofuata yanaitwa “wanawe” kulingana na kiambishi cha kike katika Andiko la Kimasora.
  alternative: Yeriothi anaweza kuwa jina linalomfafanua Azuba badala ya mwanamke wa pili; au muundo unaweza kueleweka kwa njia nyingine katika upangaji wa ukoo.
  rationale: Hili ni suala la kisarufi na la ufasiri wa ukoo. Tafsiri kuu inafuata kwa ukaribu sarufi ya Kimasora bila kuondoa utata wake, nao unaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Akapata watoto kwa” ni usemi wa kawaida unaowasilisha maana ya ukoo; majina yametoholewa kwa maumbo yanayosomeka kwa Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu.
