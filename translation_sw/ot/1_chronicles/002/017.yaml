  yaml_path: translation/ot/1_chronicles/002/017.yaml
  text: Abigail bore Amasa[a], and the father of Amasa was Jether the Ishmaelite.
translation:
  language: sw
  text: Abigaili akamzaa Amasa[a]; baba wa Amasa alikuwa Yetheri, Mwisimaeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati na kifungu sambamba katika 2 Samweli 17:25 vinasema “Ithra, Mwisraeli” badala ya “Yetheri, Mwisimaeli.” Maandishi ya Kimasora hapa yanasema “Yetheri, Mwisimaeli.”
    reason: textual_variant
lexical_decisions:
- source_word: יָלְדָה
  choice: akamzaa
  rationale: Katika qal ikiwa na mtenda wa kike, ילד humaanisha ‘kuzaa.’ ‘Akamzaa’ ni ya kawaida na inahifadhi wazi uhusiano wa kimama katika nasaba.
- source_word: אֶת עֲמָשָׂא
  choice: Amasa
  rationale: אֶת ni alama ya yambwa tendwa na haitafsiriwi kando; jina עֲמָשָׂא limetoholewa kuwa ‘Amasa.’
- source_word: וַאֲבִי עֲמָשָׂא
  choice: na baba yake Amasa
  rationale: Muundo huu wa nomino tegemezi unamaanisha ‘na baba wa Amasa.’ Kiswahili cha kawaida hutumia ‘baba yake Amasa’ kwa uhusiano huu.
- source_word: יֶתֶר
  choice: Yetheri
  rationale: Jina la Kiebrania limetoholewa kwa namna inayohifadhi sauti ya konsonanti ya kwanza na kulifanya litamkike kwa kawaida katika Kiswahili.
- source_word: הַיִּשְׁמְעֵאלִי
  choice: Mwishmaeli
  rationale: Ni jina la mtu kwa kabila lenye kibainishi katika Kiebrania; ‘Mwishmaeli’ ni umbo la asili na fasaha la Kiswahili la kumtambulisha mtu wa uzao au jamii hiyo.
