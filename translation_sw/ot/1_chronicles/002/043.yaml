  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Na wana wa
  rationale: בְּנֵי ni wingi wa hali ya kuambatanisha wa neno ‘wana,’ na hapa inaanzisha orodha ya wana katika nasaba. Kiunganishi וּ־ kimetafsiriwa ‘Na’ kwa kuwa mstari huu unaendeleza orodha iliyotangulia.
- source_word: חֶבְרוֹן
  choice: Hebroni
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: קֹרַח
  choice: Kora
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida na inayoeleweka katika Kiswahili.
- source_word: תַפֻּחַ
  choice: Tapua
  rationale: Hapa ni jina la mtu, kwa hiyo limetoholewa badala ya kutafsiriwa kwa maana ya nomino ya kawaida.
- source_word: רֶקֶם
  choice: Rekemu
  rationale: Jina la mtu limetoholewa kwa namna ya asili katika Kiswahili, kwa kuongeza irabu ya mwisho ili kuepuka mkusanyiko usio wa kawaida wa konsonanti.
- source_word: שָׁמַע
  choice: Shema
  rationale: Jina la mtu limetoholewa kwa kufuata matamshi ya maandishi ya Kiebrania ya WLC.
