  register: Lugha ni ya kisasa, yenye heshima na rahisi kusomeka. Kitenzi ‘walikuwa’ kimeongezwa kwa ulaini wa sentensi ya Kiswahili bila kubadili uhusiano wa kinasaba katika Kiebrania. Hakuna tanbihi iliyowekwa kwa sababu tanbihi ya Kiingereza imeambatanishwa na jina lisilo sahihi, na maandishi ya WLC yenyewe hayahitaji mbadala wa lazima hapa.
