  yaml_path: translation/ot/1_chronicles/002/006.yaml
  text: 'And the sons of Zerah: Zimri[a], Ethan, Heman, Kalkol[b], and Dara—five in all.'
translation:
  language: sw
  text: 'Na wana wa Zera: Zimri, Ethani, Hemani, Kalkoli[a], na Dara[b]—wote watano.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika tafsiri nyingine, jina hili huandikwa ‘Kalkol’ au ‘Calcol.’
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hapa kinasema ‘Dara’; sehemu inayolingana katika 1 Wafalme 4:31 inasema ‘Darda.’
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: Na wana wa
  rationale: Neno בְּנֵי ni wingi wa hali ya kuambatana wa ‘wana’; katika nasaba, ‘wana wa’ ni tafsiri ya kawaida na sahihi. Kiunganishi וּ kimetafsiriwa ‘Na’ ili kudumisha mwendelezo wa orodha.
- source_word: זֶרַח
  choice: Zera
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Jina la mtu limetoholewa moja kwa moja kwa Kiswahili.
- source_word: וְאֵיתָן
  choice: Ethani
  rationale: Jina la mtu limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili; kiunganishi chake kinawakilishwa na muundo wa orodha.
- source_word: וְהֵימָן
  choice: Hemani
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa mfumo wa sauti wa Kiswahili.
- source_word: וְכַלְכֹּל
  choice: Kalkoli
  rationale: Jina hili limetoholewa kwa kufuata konsonanti za Kiebrania כ־ל־כ־ל na kupewa umbo linalotamkika kwa kawaida katika Kiswahili.
- source_word: וָדָרַע
  choice: Dara
  rationale: Maandishi ya Kiebrania ya mstari huu yanasoma Dara; tafsiri haijapatanisha jina hilo kimya kimya na ‘Darda’ la 1 Wafalme 4:31.
- source_word: כֻּלָּם חֲמִשָּׁה
  choice: wote watano
  rationale: Kirai hiki kihalisi kina maana ya ‘wote, watano’; ‘wote watano’ ni Kiswahili cha asili kinachohifadhi idadi na maana ya ujumla.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye heshima unaofaa orodha ya nasaba. Muundo usio na kitenzi wa Kiebrania umehifadhiwa kwa kutumia koloni, na majina yametoholewa kwa maumbo yanayotamkika kwa kawaida katika Kiswahili.
