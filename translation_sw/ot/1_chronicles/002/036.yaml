  text: וְ/עַתַּי֙ הֹלִ֣יד אֶת נָתָ֔ן וְ/נָתָ֖ן הוֹלִ֥יד אֶת זָבָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/036.yaml
  text: Attai fathered Nathan, and Nathan fathered Zabad.
translation:
  language: sw
  text: Atai akamzaa Nathani, naye Nathani akamzaa Zabadi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עַתַּי
  choice: Atai
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida na inayosomeka kwa Kiswahili; kiunganishi וְ kinaendeleza mfululizo wa nasaba na kinawakilishwa kwa mtiririko wa sentensi.
- source_word: הֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, Hifili ya ילד humaanisha kumzaa au kuwa baba wa mtu. “Akamzaa” ni fupi, ya kawaida, na hudumisha maana ya uhusiano wa kizazi.
- source_word: אֶת
  choice: '[hakijatafsiriwa kivyake]'
  rationale: Kihisishi hiki cha yambwa hakina neno la moja kwa moja katika Kiswahili; maana yake inaonyeshwa na mpangilio wa kisarufi.
- source_word: נָתָן
  choice: Nathani
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: וְ/נָתָן
  choice: naye Nathani
  rationale: וְ imetafsiriwa “naye” ili kuunganisha kwa kawaida vifungu viwili vinavyofuatana na kumweka Nathani kama kiima cha pili.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Kitenzi kilekile cha Kiebrania katika kazi ileile ya kinasaba kimetafsiriwa kwa uthabiti.
- source_word: זָבָד
  choice: Zabadi
  rationale: Jina la mtu limetoholewa kwa muundo wa Kiswahili unaosomeka kwa urahisi.
