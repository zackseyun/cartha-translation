base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/028.yaml
  text: The sons of Onam were Shammai and Jada[a]. The sons of Shammai were Nadab and Abishur.
translation:
  language: sw
  text: Wana wa Onamu walikuwa Shamai na Yada; nao wana wa Shamai walikuwa Nadabu na Abishuri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: walikuwa
  rationale: Katika orodha ya ukoo, kitenzi היה kinatumika kama kiunganishi kinachotaja wana wa mtu; “walikuwa” ni Kiswahili cha kawaida na kinaendeleza muundo huo.
- source_word: בְנֵי
  choice: wana wa
  rationale: Muktadha unataja wana wa kiume katika ukoo wa karibu, hivyo “wana wa” ni sahihi kuliko neno pana zaidi kama “watoto wa” au “wazao wa”.
- source_word: אוֹנָם
  choice: Onamu
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yaliyozoeleka katika Kiswahili.
- source_word: שַׁמַּי
  choice: Shamai
  rationale: Jina la mtu limetoholewa kwa Kiswahili na limeandikwa kwa namna ileile katika sehemu zote mbili za aya.
- source_word: יָדָע
  choice: Yada
  rationale: Jina la mtu limetoholewa kutoka umbo la Kiebrania kwa kufuata tahajia ya kawaida ya Kiswahili.
- source_word: וּבְנֵי
  choice: nao wana wa
  rationale: “Nao” linahifadhi kiunganishi cha Kiebrania huku likianzisha kwa ufasaha tawi linalofuata la ukoo.
- source_word: נָדָב
  choice: Nadabu
  rationale: Jina la mtu limetoholewa kwa umbo linaloeleweka na lililozoeleka katika Kiswahili.
- source_word: אֲבִישׁוּר
  choice: Abishuri
  rationale: Jina la mtu limetoholewa kwa umbo la kawaida la Kiswahili.
theological_decisions: []
