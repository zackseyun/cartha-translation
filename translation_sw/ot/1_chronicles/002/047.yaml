  yaml_path: translation/ot/1_chronicles/002/047.yaml
  text: 'The sons of Jahdai: Regem, Jotham, Geshan, Pelet, Ephah, and Shaaph.'
translation:
  language: sw
  text: Na wana wa Yahdai walikuwa Regemu, Yothamu, Geshani, Peleti, Efa na Shaafu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Na wana wa
  rationale: Kiunganishi וּ־ kimehifadhiwa kwa “Na,” na בְנֵי limetafsiriwa kwa maana yake ya moja kwa moja katika nasaba, “wana wa.”
- source_word: יָהְדָּי
  choice: Yahdai
  rationale: Jina la mtu limetoholewa kwa kufuata matamshi ya Kiebrania, huku yod ya mwanzo ikiwakilishwa kwa “Y,” jambo la kawaida katika Kiswahili.
- source_word: רֶגֶם
  choice: Regemu
  rationale: Jina limetoholewa kwa muundo unaotamkika kwa kawaida katika Kiswahili; irabu ya mwisho imeongezwa ili kuepuka konsonanti kufunga neno.
- source_word: יוֹתָם
  choice: Yothamu
  rationale: Jina limetoholewa kwa namna inayotambulika katika mapokeo ya majina ya Biblia ya Kiswahili na inayokaribia umbo la Kiebrania.
- source_word: גֵישָׁן
  choice: Geshani
  rationale: Jina limetoholewa kwa Kiswahili, na irabu ya mwisho imeongezwa kwa urahisi wa matamshi.
- source_word: פֶלֶט
  choice: Peleti
  rationale: Jina la mtu limetoholewa moja kwa moja, likiwekewa irabu ya mwisho kulingana na fonolojia ya Kiswahili.
- source_word: עֵיפָה
  choice: Efa
  rationale: Hapa ni jina la mtu, si jina la kipimo; limetoholewa kwa umbo fupi na linalotambulika la Kiswahili.
- source_word: שָׁעַף
  choice: Shaafu
  rationale: Jina limetoholewa kwa kuhifadhi sauti ya “sh” na mpangilio wa vokali wa Kiebrania kwa kadiri inayowezekana katika Kiswahili.
