source:
  edition: WLC
  text: וַ/יִּהְי֤וּ בָנִים֙ לְ/שׁוֹבָ֔ל אֲבִ֖י קִרְיַ֣ת יְעָרִ֑ים הָרֹאֶ֖ה חֲצִ֥י הַ/מְּנֻחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/052.yaml
  text: 'And Shobal the father of Kiriath-jearim had sons: Haroeh[c][b][a], half of the Manahathites.'
translation:
  language: sw
  text: 'Shobali, baba[a] wa Kiriath-yearimu, alikuwa na wana: Haroe[b], nusu ya Wamenuhothi.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanzilishi wa Kiriath-yearimu.” Katika nasaba, “baba wa” anaweza kumaanisha babu, mwanzilishi, au kiongozi mkuu aliyehusishwa na mji.
    reason: lexical_alternative
  - marker: b
    text: Haroe huenda ni jina la mtu ambalo katika mapokeo mengine limetolewa kama “Reaya.”
    reason: alternative_reading
  - marker: c
    text: 'Kiebrania: “nusu ya Menuhothi.” Huenda maana yake ni “nusu ya Menuhothi” au “nusu ya wakazi, au ukoo, wa Menuhothi (Manahathi).” Uhusiano wa maneno haya na Haroe hauko wazi kabisa katika Kiebrania.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בָנִים לְשׁוֹבָל
  choice: Shobali ... alikuwa na wana
  rationale: Nahau ya Kiebrania inayosema kihalisi ‘kulikuwa na wana kwa Shobali’ imetolewa kwa Kiswahili cha kawaida bila kupoteza maana ya nasaba.
- source_word: אֲבִי קִרְיַת יְעָרִים
  choice: baba wa Kiriath-yearimu
  rationale: Tafsiri ya karibu ‘baba wa’ inadumisha usemi wa nasaba, ambao hapa unaweza kumaanisha babu, mwanzilishi, au kiongozi aliyehusishwa na mji.
- source_word: קִרְיַת יְעָרִים
  choice: Kiriath-yearimu
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa kuwa ‘Mji wa Misitu,’ kwa kufuata matumizi ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: הָרֹאֶה
  choice: Haroe
  rationale: Katika orodha hii ya nasaba neno linaeleweka kuwa jina la mtu; kutoholewa kunahifadhi umbo la Kiebrania bila kulifasiri kwa uhakika usiokuwapo.
- source_word: חֲצִי הַמְּנֻחוֹת
  choice: nusu ya Wamenuhothi
  rationale: Kiebrania kinasema kihalisi ‘nusu ya Menuhothi/Menuhothi.’ Umbo la jina la jamii linafaa muktadha wa nasaba, huku uwezekano wa kurejelea mahali au wakazi wake ukibainishwa katika tanbihi.
theological_decisions:
- issue: Uhusiano wa kisarufi kati ya Haroe na ‘nusu ya Wamenuhothi’
  choice: 'Kudumisha uambatanisho usio na kiunganishi: ‘Haroe, nusu ya Wamenuhothi’'
  alternative: ‘Haroe na nusu ya Wamenuhothi’ au ‘Haroe, baba wa nusu ya Wamenuhothi’
  rationale: Matini ya Kiebrania haina kiunganishi wala neno ‘baba’ katika sehemu hii. Kuongeza mojawapo kungeamua kimyakimya uhusiano ambao matini yenyewe hauelezi wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi na wenye hadhi unaofaa orodha ya nasaba. Majina yametoholewa kwa maumbo yanayosomeka kwa urahisi katika Kiswahili. Sintaksia isiyo ya kawaida mwishoni imedumishwa kwa makusudi ili kutatua kimyakimya utata wa matini ya Kiebrania.
