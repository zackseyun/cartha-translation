  terminology: “Wana wa,” “mzaliwa wake wa kwanza,” na “baba wa” zinahifadhi istilahi na upana wa maana wa nasaba ya Kiebrania. Tanbihi ya “baba wa” inaeleza kwa usahihi kwamba usemi huo unaweza kumaanisha zaidi ya baba wa kimwili, bila kulazimisha tafsiri moja ya ukoo au mahali.
