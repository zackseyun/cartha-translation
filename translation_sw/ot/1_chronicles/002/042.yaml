  source_fidelity: 'Tafsiri inafuata kwa uaminifu matini ya Kiebrania: Kalebu anatambulishwa kuwa ndugu ya Yerahmeeli; Mesha ni mzaliwa wa kwanza wa Kalebu na “baba wa Zifu”; kisha muundo mgumu wa “wana wa Maresha, baba wa Hebroni” umehifadhiwa bila kusawazisha au kuamua utata wake. “Walikuwa:” ni nyongeza ya kawaida ya Kiswahili ya kuanzisha orodha ya nasaba, bila kubadili maana.'
