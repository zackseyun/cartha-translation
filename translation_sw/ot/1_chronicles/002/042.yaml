source:
  edition: WLC
  text: וּ/בְנֵ֤י כָלֵב֙ אֲחִ֣י יְרַחְמְאֵ֔ל מֵישָׁ֥ע בְּכֹר֖/וֹ ה֣וּא אֲבִי זִ֑יף וּ/בְנֵ֥י מָרֵשָׁ֖ה אֲבִ֥י חֶבְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/042.yaml
  text: 'And the sons of Caleb the brother of Jerahmeel: Mesha his firstborn[a], who was the father of Ziph[b], and the sons of Mareshah the father of Hebron.'
translation:
  language: sw
  text: 'Nao wana wa Kalebu, ndugu yake Yerahmeeli, walikuwa: Mesha, mzaliwa wake wa kwanza, ambaye alikuwa baba wa Zifu[a], na wana wa Maresha, baba wa Hebroni.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Mambo ya Nyakati, “baba wa” si lazima iwe baba wa kimwili tu; inaweza pia kumaanisha babu, mkuu wa ukoo, au mwanzilishi anayehusishwa na mahali.
    reason: cultural_note
  - marker: b
    text: Sintaksia ya Kiebrania katika kifungu cha mwisho ni ngumu. Maandishi ya Kimasoreti yanasema kihalisi, “na wana wa Maresha, baba wa Hebroni.” Wengine huelewa maana kuwa “Maresha, baba wa Hebroni,” lakini tafsiri hii imehifadhi muundo wa Kiebrania.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי כָלֵב
  choice: Nao wana wa Kalebu
  rationale: Neno בְּנֵי ni kauli ya kawaida ya nasaba, “wana wa,” ambayo inaweza pia kujumuisha wazao; muundo rasmi umehifadhiwa. Kiunganishi וּ kimetafsiriwa “Nao” ili kuendeleza orodha ya nasaba kwa Kiswahili cha kawaida.
- source_word: אֲחִי יְרַחְמְאֵל
  choice: ndugu yake Yerahmeeli
  rationale: אֲחִי humaanisha “ndugu wa” katika uhusiano wa kiume. “Ndugu yake Yerahmeeli” ni usemi wa asili wa Kiswahili katika apposition na Kalebu.
- source_word: מֵישָׁע בְּכֹרוֹ
  choice: Mesha, mzaliwa wake wa kwanza
  rationale: בְּכוֹרוֹ humtaja mtoto wa kwanza wa kiume na pia inaweza kudokeza hadhi yake; “mzaliwa wake wa kwanza” huhifadhi maana hiyo kwa lugha wazi.
- source_word: הוּא אֲבִי זִיף
  choice: ambaye alikuwa baba wa Zifu
  rationale: הוּא inarejelea tena Mesha, na אֲבִי זִיף imehifadhiwa kwa namna halisi. “Baba wa” inaweza kumaanisha baba wa kimwili, babu, mkuu wa ukoo, au mwanzilishi anayehusishwa na mahali.
- source_word: וּבְנֵי מָרֵשָׁה אֲבִי חֶבְרוֹן
  choice: na wana wa Maresha, baba wa Hebroni
  rationale: Tafsiri inahifadhi kwa karibu sintaksia ngumu ya Maandishi ya Kimasoreti bila kuirekebisha kimya kimya. Koma inaonyesha usomaji unaowezekana unaomhusisha “baba wa Hebroni” na Maresha, huku tanbihi ikitaja ugumu huo.
theological_decisions:
- issue: Maana ya “baba wa” katika nasaba za Mambo ya Nyakati
  choice: Kuhifadhi “baba wa” katika matini
  alternative: “mwanzilishi wa,” “babu wa,” au “mkuu wa ukoo wa”
  rationale: Neno la Kiebrania אָב lina wigo mpana katika muktadha huu. Kuchagua maana moja kungeondoa kwa lazima utata halisi wa kama jina linalofuata ni mtu, ukoo, au mahali.
- issue: Uhusiano wa kifungu אֲבִי חֶבְרוֹן
  choice: Kuhifadhi muundo wa Kimasoreti na kueleza ugumu katika tanbihi
  alternative: Kutafsiri moja kwa moja “Maresha, baba wa Hebroni” na kuondoa “wana wa”
  rationale: Maandishi yaliyopokelewa yanasema kihalisi “na wana wa Maresha, baba wa Hebroni.” Tafsiri haipaswi kusahihisha sintaksia hiyo bila ushahidi wa kutosha.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yametoholewa kwa mazoea ya Kiswahili: Kalebu, Yerahmeeli, Mesha, Zifu, Maresha, na Hebroni. Muundo “walikuwa:” umeongezwa kwa uwazi wa kisarufi baada ya kichwa cha nasaba bila kubadili yaliyomo.'
