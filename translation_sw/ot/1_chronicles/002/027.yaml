  text: 'The sons of Ram: Jerahmeel the firstborn[a], Maaz, Jamin, and Eker.'
translation:
  language: sw
  text: Wana wa Ramu walikuwa Yerameeli, mzaliwa wa kwanza, Maazi, Yamini na Ekeri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: walikuwa
  rationale: Kitenzi cha Kiebrania kinatanguliza orodha ya ukoo; “walikuwa” huhifadhi maana yake kwa Kiswahili cha kawaida bila kuifanya sentensi kuwa nzito.
- source_word: בְנֵי
  choice: wana wa
  rationale: Katika muktadha huu wa ukoo, neno hilo linawataja watoto wa kiume wa Ramu.
- source_word: רָם
  choice: Ramu
  rationale: Jina la mtu limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: בְּכוֹר
  choice: mzaliwa wa kwanza
  rationale: Neno hili linamtambulisha Yerameeli kuwa mwana wa kwanza; tafsiri hii ni ya moja kwa moja na ya kawaida.
- source_word: יְרַחְמְאֵל
  choice: Yerameeli
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili huku likihifadhi umbo la jina la Kiebrania.
- source_word: מַעַץ
  choice: Maazi
  rationale: Jina la mtu limetoholewa kwa mfumo wa sauti unaosomeka kwa Kiswahili.
- source_word: יָמִין
  choice: Yamini
  rationale: Hapa ni jina la mtu, si maana ya kawaida ya neno; limetoholewa kwa Kiswahili.
- source_word: עֵקֶר
  choice: Ekeri
  rationale: Jina la mtu limetoholewa kwa namna inayorahisisha matamshi ya Kiswahili.
