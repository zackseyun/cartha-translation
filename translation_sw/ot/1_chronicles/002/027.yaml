  verdict: revise
  source_fidelity: 'Rasimu imekosea uhusiano wa ukoo: בְּכוֹר יְרַחְמְאֵל (''mzaliwa wa kwanza wa Yerameeli'') humfafanua Ramu, si Yerameeli kama mwana wa Ramu. Orodha ya wana wa Ramu ina Maazi, Yamini, na Ekeri pekee. Hii pia inatofautiana na tafsiri ya Kiingereza ya POB, ambayo inaonekana kugawa kisintaksia kifungu cha Kiebrania kwa namna isiyo sahihi.'
  naturalness: Muundo uliorekebishwa ni wa kawaida katika Kiswahili sanifu na unaweka wazi uhusiano wa ukoo bila kuongeza taarifa nje ya matini.
  terminology: “Wana wa,” “mzaliwa wa kwanza,” na tahajia za majina Ramu, Yerameeli, Maazi, Yamini, na Ekeri zinafaa kwa Kiswahili sanifu katika muktadha wa ukoo.
  issues:
  - severity: high
    issue: Yerameeli ameorodheshwa kimakosa kama mwana wa Ramu.
    rationale: Katika Kiebrania, 'Ramu, mzaliwa wa kwanza wa Yerameeli' ni kitengo kimoja cha ufafanuzi. Majina yanayofuata—Maazi, Yamini, na Ekeri—ndiyo wana wa Ramu.
  - severity: medium
    issue: Njia ya ukaguzi ya Kiingereza imeathiri uchanganuzi wa sintaksia.
    rationale: Tafsiri ya Kiingereza inayomweka 'Jerahmeel the firstborn' ndani ya orodha ya wana wa Ramu haipatani na muktadha wa karibu (1 Nya. 2:25) wala na ujenzi wa Kiebrania. Kiswahili kirekebishwe kulingana na chanzo cha Kiebrania.
  revised_text: Wana wa Ramu, mzaliwa wa kwanza wa Yerameeli, walikuwa Maazi, Yamini na Ekeri.
  revised_footnotes: []
  revision_rationale: Marekebisho yanaondoa Yerameeli katika orodha ya wana wa Ramu na kumtambua Ramu kuwa mzaliwa wa kwanza wa Yerameeli, kama inavyosema Kiebrania na muktadha wa nasaba unavyothibitisha. Hakuna dokezo la chini linalohitajika, kwa kuwa Kiswahili kinaweza kueleza sintaksia hiyo kwa uwazi ndani ya sentensi.
