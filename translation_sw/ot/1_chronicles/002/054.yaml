base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/054.yaml
  text: 'The sons of Salma: Bethlehem[a], the Netophathites, Atroth-beth-joab, half of the Manahathites[b], the Zorites.'
translation:
  language: sw
  text: 'Wana wa Salma: Bethlehemu, Wanethofathi, Atroth-beth-yoabu, nusu ya Wamanahathi[a], Wazori[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda “Wamenuhothi.” Haijulikani kwa hakika jina hili la watu linahusishwa na jina gani la mahali.
    reason: lexical_alternative
  - marker: b
    text: Au “Wasoreathi,” yaani, watu waliohusishwa na Sora.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Katika orodha za nasaba, neno hili linaweza kumaanisha wana, wazao, au vikundi vya koo. “Wana wa” huhifadhi nahau ya nasaba bila kulazimisha maana ya wana wa moja kwa moja pekee.
- source_word: שַׂלְמָא
  choice: Salma
  rationale: Jina la mtu limetoholewa moja kwa moja kutoka umbo la Kiebrania.
- source_word: בֵּית לֶחֶם
  choice: Bethlehemu
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la mahali; katika muktadha huu huenda pia linawakilisha watu au ukoo unaohusishwa na mahali hapo.
- source_word: וּנְטוֹפָתִי
  choice: Wanetofathi
  rationale: Umbo la Kiebrania ni jina la watu au ukoo; kiambishi “Wa-” kinaonyesha kundi la watu kwa Kiswahili.
- source_word: עַטְרוֹת בֵּית יוֹאָב
  choice: Atroth-beth-yoabu
  rationale: Kirai hiki kimehifadhiwa kama jina ambatani la mahali au ukoo badala ya kutafsiriwa neno kwa neno.
- source_word: וַחֲצִי
  choice: nusu ya
  rationale: Hutoa maana ya moja kwa moja ya sehemu moja kati ya mbili, huku mpangilio wa orodha ukibeba uhusiano wa kiunganishi.
- source_word: הַמָּנַחְתִּי
  choice: Wamanahathi
  rationale: Ni jina la watu lenye kibainishi, hivyo limetafsiriwa kama kundi la watu. Uhusiano wake kamili na jina la mahali hauna uhakika na umeelezwa katika tanbihi.
- source_word: הַצָּרְעִי
  choice: Wazori
  rationale: Ni jina la watu ambalo huenda linawahusu watu wanaohusishwa na Sora; umbo fupi la jina limehifadhiwa, na mbadala umewekwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi na wenye hadhi unaofaa orodha ya nasaba. Majina ya watu yamepewa kiambishi cha ngeli “Wa-”; alama za tanbihi zimewekwa kwenye maneno yanayohusika. Kutokuwapo kwa kiunganishi kabla ya “Wazori” kunahifadhi muundo na uwezekano wa uhusiano wa kiapposisheni katika Kiebrania badala ya kuufafanua kimabavu.
