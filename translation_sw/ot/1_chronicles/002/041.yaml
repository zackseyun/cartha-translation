lexical_decisions:
- source_word: שַׁלּוּם
  choice: Shalumu
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: הוֹלִיד / הֹלִיד
  choice: akamzaa
  rationale: Katika muktadha wa ukoo, Hiphil ya ילד ina maana ya kumzaa au kuwa baba wa mtu. ‘Akamzaa’ ni fupi, ya asili katika Kiswahili, na inadumisha mfuatano wa nasaba.
- source_word: אֶת
  choice: '[halikutafsiriwa kando]'
  rationale: Ni kiashiria cha yambwa mahsusi katika Kiebrania na halina neno linalolingana nalo moja kwa moja katika Kiswahili.
- source_word: יְקַמְיָה / וִיקַמְיָה
  choice: Yekamia / naye Yekamia
  rationale: Jina limetoholewa; kurudiwa kwake kumehifadhiwa kama katika Kiebrania. Kiunganishi ו kimetolewa kwa ‘naye’ ili mfuatano uwe wazi na wa asili.
- source_word: אֱלִישָׁמָע
  choice: Elishama
  rationale: Jina la mtu limetoholewa kwa namna inayofaa mfumo wa sauti na tahajia ya Kiswahili.
