lexical_decisions:
- source_word: וּבְנֵי יוֹנָתָן
  choice: Nao wana wa Yonathani
  rationale: Kiunganishi וּ kinaendeleza orodha ya nasaba, huku בְנֵי katika muundo tegemezi ikitafsiriwa kwa kawaida kuwa “wana wa.” Jina יוֹנָתָן limetoholewa kwa namna inayofaa Kiswahili.
- source_word: פֶּלֶת וְזָזָא
  choice: Pelethi na Zaza
  rationale: Majina yametoholewa kutoka Kiebrania, na kiunganishi וְ kimewakilishwa kwa “na.”
- source_word: אֵלֶּה
  choice: Hao ndio
  rationale: Kiwakilishi cha kuonyesha cha wingi kinawarejelea wanaume waliotajwa; “Hao ndio” ni kauli ya kawaida na yenye msisitizo unaofaa katika sentensi ya muhtasari.
- source_word: הָיוּ
  choice: waliokuwa
  rationale: Katika muhtasari huu wa nasaba, kitenzi היה kinaonyesha utambulisho, si mabadiliko ya hali.
- source_word: בְּנֵי יְרַחְמְאֵל
  choice: wana wa Yerahmeeli
  rationale: Neno בְּנֵי limehifadhiwa kama “wana” badala ya kupanuliwa kuwa “wazao,” kwa kuwa muundo wa Kiebrania na muktadha wa nasaba vinaeleweka bila upanuzi huo.
