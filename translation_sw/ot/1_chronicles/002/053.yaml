base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/053.yaml
  text: 'And the clans of Kiriath-jearim: the Ithrites[a], the Puthites, the Shumathites, and the Mishraites[b]. From these came the Zorathites and the Eshtaolites.'
translation:
  language: sw
  text: 'Na koo[a] za Kiriath-yearimu: Waithri, Waputhi, Washumathi na Wamishrai. Kutoka katika koo hizi walitokea[b] Wazorathi na Waeshtaoli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “familia”; neno la Kiebrania hapa mara nyingi humaanisha makundi mapana ya watu wenye undugu ndani ya nasaba.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “walitoka”; katika nasaba, maana inaweza kuwa kwamba makundi haya yalitokana na koo zilizotajwa au yaliibuka miongoni mwao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת
  choice: Na koo
  rationale: Katika muktadha wa nasaba, מִשְׁפָּחוֹת humaanisha makundi mapana ya watu wenye undugu, si familia ndogo tu; “koo” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: קִרְיַת יְעָרִים
  choice: Kiriath-yearimu
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa, kwa namna inayoweza kutamkwa kwa urahisi katika Kiswahili huku ikihifadhi umbo lake la Kiebrania.
- source_word: הַיִּתְרִי
  choice: Waithri
  rationale: Ni jina la ukoo au la watu; kiambishi Wa- kinaonyesha kundi la watu, huku sehemu kuu ya jina ikitoholewa kutoka Kiebrania.
- source_word: וְהַפּוּתִי
  choice: Waputhi
  rationale: Jina la ukoo limetoholewa na kupewa kiambishi cha Kiswahili Wa- kwa kundi la watu.
- source_word: וְהַשֻּׁמָתִי
  choice: Washumathi
  rationale: Jina la ukoo limehifadhiwa kwa utohozi unaokaribia umbo la Kiebrania na unaotamkika kwa Kiswahili.
- source_word: וְהַמִּשְׁרָעִי
  choice: Wamishrai
  rationale: Jina la ukoo limetoholewa bila kulipa maana isiyothibitishwa na maandishi.
- source_word: מֵאֵלֶּה
  choice: Kutoka kwao
  rationale: Kirai hiki kinarejelea koo zilizotajwa na kinaeleza chanzo cha makundi yanayofuata kwa Kiswahili cha kawaida.
- source_word: יָצְאוּ
  choice: walitokea
  rationale: Kitenzi kwa msingi wake ni “walitoka,” lakini hapa kinaonyesha asili au kuibuka kwa makundi ya nasaba; “walitokea” huhifadhi wazo hilo bila kulifanya kwa lazima kuwa uzao wa moja kwa moja.
- source_word: הַצָּרְעָתִי
  choice: Wazorathi
  rationale: Jina la watu wanaohusishwa na Zora limetoholewa kwa muundo wa majina ya makundi katika Kiswahili.
- source_word: וְהָאֶשְׁתָּאֻלִי
  choice: Waeshtaoli
  rationale: Jina la watu wanaohusishwa na Eshtaoli limetoholewa kwa muundo wa Kiswahili.
