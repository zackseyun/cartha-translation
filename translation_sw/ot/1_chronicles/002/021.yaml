base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/021.yaml
  text: Afterward Hezron went in to the daughter of Machir the father of Gilead[a], and he took her when he was sixty years old[c][b], and she bore Segub to him.
translation:
  language: sw
  text: Baadaye Hesroni akamwingilia[a] binti wa Makiri, baba wa Gileadi[b]; akamwoa[c], naye alikuwa na miaka sitini. Binti huyo akamzalia Hesroni Segubu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akaenda kwa.” Nahau hii ya Kiebrania inaweza kutumiwa kwa staha kurejelea muungano wa kindoa au kingono.
    reason: lexical_alternative
  - marker: b
    text: Katika lugha ya nasaba, “baba wa Gileadi” anaweza kumaanisha baba wa moja kwa moja, babu au mtangulizi, au mwanzilishi wa Gileadi.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema kihalisi “akamchukua”; hapa inaweza kumaanisha “akamchukua kuwa mke wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Baadaye
  rationale: Huonyesha kwamba tendo hili lilifuata matukio yaliyotangulia katika nasaba; ni usemi wa kawaida na wa asili katika Kiswahili.
- source_word: בָּא אֶל
  choice: akamwingilia
  rationale: Katika muktadha wa mwanamume na mwanamke, nahau hii ya Kiebrania hurejelea kwa staha muungano wa kingono au kindoa. ‘Akamwingilia’ huhifadhi maana hiyo bila kuifanya kuwa ya wazi kupita kiasi.
- source_word: בַּת מָכִיר
  choice: binti wa Makiri
  rationale: Huwakilisha kwa kawaida muundo wa Kiebrania unaoonyesha uhusiano wa kifamilia.
- source_word: אֲבִי גִלְעָד
  choice: baba wa Gileadi
  rationale: Hili ndilo tafsiri ya moja kwa moja; katika nasaba neno ‘baba’ linaweza pia kumaanisha babu wa zamani au mwanzilishi wa ukoo.
- source_word: לְקָחָהּ
  choice: alimwoa
  rationale: Kitenzi ‘kumchukua’ mwanamke katika muktadha huu humaanisha kumchukua kuwa mke. ‘Alimwoa’ ni Kiswahili cha kawaida na wazi, huku tanbihi ikihifadhi usemi wa karibu zaidi na Kiebrania.
- source_word: וְהוּא בֶּן שִׁשִּׁים שָׁנָה
  choice: akiwa na umri wa miaka sitini
  rationale: Hutoa kwa Kiswahili cha kawaida nahau ya Kiebrania inayosema kihalisi ‘mwana wa miaka sitini.’
- source_word: וַתֵּלֶד לוֹ
  choice: akamzalia
  rationale: Muundo huu wa Kiswahili unahifadhi wazo kwamba alimzaa mtoto kwa ajili yake au kwake, kama kiwakilishi cha Kiebrania לוֹ kinavyoonyesha.
- source_word: שְׂגוּב
  choice: Segubu
  rationale: Ni umbo la jina hili linalofaa katika utaratibu wa majina ya kibiblia kwa Kiswahili.
theological_decisions:
- issue: Maana ya ‘baba wa Gileadi’ katika nasaba
  choice: baba wa Gileadi
  alternative: babu wa Gileadi / mwanzilishi wa Gileadi
  rationale: Maandishi hayalazimishi maana moja kati ya baba wa moja kwa moja, babu wa ukoo, au mwanzilishi; tafsiri kuu inabaki ya moja kwa moja na tanbihi inahifadhi upana huo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Akamwingilia’ huhifadhi staha ya nahau ya Kiebrania, huku ‘alimwoa’ ikitoa maana ya kindoa kwa lugha ya kawaida. Majina yametolewa kwa maumbo ya kawaida ya kibiblia ya Kiswahili: Hesroni, Makiri, Gileadi, na Segubu.'
