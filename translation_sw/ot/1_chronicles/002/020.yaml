- source_word: אוּרִי
  choice: Uri
  rationale: Jina la mtu limetoholewa moja kwa moja kwa Kiswahili.
- source_word: וְ
  choice: naye
  rationale: Kiunganishi hiki kinaunganisha hatua mbili zinazofuatana za nasaba; ‘naye’ hutiririka kwa kawaida huku kikirejelea Uri kama kiima cha kishazi cha pili.
- source_word: בְּצַלְאֵל
  choice: Bezaleli
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
