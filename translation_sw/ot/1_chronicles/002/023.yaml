base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/023.yaml
  text: But Geshur and Aram took the villages of Jair from them[a], along with Kenath and its daughter towns—sixty cities. All these were the sons of Machir[c][b], the father of Gilead.
translation:
  language: sw
  text: Lakini Geshuri na Aramu wakatwaa vijiji vya Yairi[a] kutoka kwao, pamoja na Kenathi na miji yake midogo[b]—jumla ya miji sitini. Hawa wote walikuwa wana wa Makiri[c], baba wa Gileadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Havoth-Yairi,” jina la mahali linalomaanisha “vijiji vya mahema vya Yairi.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “binti zake,” yaani makazi madogo yaliyotegemea Kenathi.
    reason: cultural_note
  - marker: c
    text: Maneno “wana wa Makiri” yanaweza kumaanisha wazao wake au watu wa ukoo wake, si lazima wanawe wa moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: wakawanyang’anya
  rationale: Katika muktadha wa maeneo kuondolewa chini ya mamlaka ya watu wengine, kitenzi hiki kinaonyesha kutwaa kutoka kwao bila kulazimisha maelezo mahususi ya namna ya kijeshi.
- source_word: גְּשׁוּר וַאֲרָם
  choice: Geshuri na Aramu
  rationale: Majina ya mahali au makundi yamenukuliwa kwa maumbo yanayoeleweka katika Kiswahili, huku Aramu likihifadhi jina la Kiebrania badala ya kulibadili kuwa Siria.
- source_word: חַוֺּת יָאִיר
  choice: vijiji vya Yairi
  rationale: Kirai hiki kinaweza kuwa jina la mahali, lakini maana yake ya kijumla iko wazi; tafsiri hii ni ya asili kwa Kiswahili, na jina la mahali limehifadhiwa katika tanbihi.
- source_word: מֵאִתָּם
  choice: wakawanyang’anya
  rationale: Kiambishi cha yambwa katika kitenzi cha Kiswahili kinawakilisha maana ya ‘kutoka kwao’ na kuonyesha kuwa maeneo yaliondolewa katika milki au mamlaka yao.
- source_word: קְנָת
  choice: Kenathi
  rationale: Hili ni umbo la Kiswahili la jina la mahali Kenath.
- source_word: בְּנֹתֶיהָ
  choice: miji yake midogo
  rationale: Neno halisi ni ‘binti zake,’ nahau inayomaanisha makazi madogo yaliyo chini ya mji mkuu; tafsiri ya maana ni wazi kwa msomaji wa kawaida, huku sitiari ya asili ikielezwa katika tanbihi.
- source_word: שִׁשִּׁים עִיר
  choice: jumla ya miji sitini
  rationale: עִיר linaweza kumaanisha mji; ‘jumla ya’ huweka wazi kuwa idadi hiyo inajumlisha Kenathi na makazi yanayoihusu.
- source_word: כָּל אֵלֶּה
  choice: Hawa wote
  rationale: Kiwakilishi kimeachwa bila kufafanua zaidi ili kutohitimisha kimabavu ikiwa rejeo lake ni watu, koo, au waliotajwa kupitia maeneo yao; kishazi kinachofuata kinaelekea kwenye maana ya nasaba.
- source_word: בְּנֵי מָכִיר
  choice: wana wa Makiri
  rationale: Tafsiri ya moja kwa moja huhifadhi lugha ya nasaba; katika matumizi ya Kiebrania ‘wana’ inaweza pia kujumuisha wazao au watu wa ukoo.
- source_word: אֲבִי גִלְעָד
  choice: baba yake Gileadi
  rationale: Huhifadhi nahau ya Kiebrania ‘baba wa,’ ambayo inaweza kumaanisha baba au babu wa ukoo bila kuamua zaidi ya matini.
