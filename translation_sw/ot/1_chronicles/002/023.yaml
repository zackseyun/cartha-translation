  to: Lakini Geshuri na Aramu wakatwaa vijiji vya Yairi[a] kutoka kwao, pamoja na Kenathi na miji yake midogo[b]—jumla ya miji sitini. Hawa wote walikuwa wana wa Makiri[c], baba wa Gileadi.
