  text: Segub fathered Jair, and he had twenty-three cities in the land of Gilead.
translation:
  language: sw
  text: Segubu akamzaa Yairi, naye alikuwa na miji ishirini na mitatu katika nchi ya Gileadi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׂגוּב
  choice: Segubu
  rationale: Jina la Kiebrania limetoholewa kwa namna ya kawaida na inayoeleweka katika Kiswahili; kiunganishi cha mwanzo kimewakilishwa katika mtiririko wa simulizi.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, kausativi ya ילד humaanisha kumzaa au kuwa baba wa mtu. ‘Akamzaa’ ni ya asili katika Kiswahili na inahifadhi maana ya unasaba.
- source_word: יָאִיר
  choice: Yairi
  rationale: Jina limetoholewa kutoka Kiebrania kwa umbo linalofaa matamshi ya Kiswahili.
- source_word: וַיְהִי לוֹ
  choice: naye alikuwa na
  rationale: Muundo היה + ל unaonyesha umiliki. ‘Alikuwa na’ ni usemi wa kawaida wa Kiswahili na haubainishi zaidi ya maandishi kama umiliki huo ulikuwa wa aina gani.
- source_word: עֶשְׂרִים וְשָׁלוֹשׁ
  choice: ishirini na mitatu
  rationale: Idadi imetolewa kwa mpangilio wa kawaida wa Kiswahili na kupatanishwa kisarufi na ‘miji’.
- source_word: עָרִים
  choice: miji
  rationale: עִיר inaweza kumaanisha mji wa ukubwa mbalimbali. ‘Miji’ ndiyo tafsiri pana na ya kawaida katika taarifa hii ya eneo.
- source_word: בְּאֶרֶץ הַגִּלְעָד
  choice: katika nchi ya Gileadi
  rationale: Tafsiri hii inahifadhi nomino אֶרֶץ na maana yake ya nchi au eneo, badala ya kufupisha kuwa jina la mahali pekee.
