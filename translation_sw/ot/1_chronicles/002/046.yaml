translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye heshima unaofaa taarifa ya nasaba. Muundo wa asili umehifadhiwa, kutia ndani kutajwa kwa Gazezi kama mwana wa Efa na pia kama mwana wa Harani, bila kujaribu kuondoa mvutano huo wa maandishi.
