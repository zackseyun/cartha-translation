base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/046.yaml
  text: And Ephah[a], Caleb’s concubine, bore Haran, Moza, and Gazez; and Haran fathered Gazez.
translation:
  language: sw
  text: Efa, suria wa Kalebu, aliwazaa Harani, Mosa na Gazezi; naye Harani akawa baba wa Gazezi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּילֶגֶשׁ
  choice: suria
  rationale: Neno hili humaanisha mwanamke mwenye hadhi ya kindoa inayotambuliwa lakini iliyo chini ya mke mkuu; “suria” ni istilahi fupi na inayofaa katika muktadha huu wa nasaba.
- source_word: יָלְדָה
  choice: aliwazaa
  rationale: Kwa kuwa mhusika ni mwanamke na watoto waliotajwa ni wengi, “aliwazaa” linaeleza kwa asili tendo la kuzaa katika taarifa ya nasaba.
- source_word: הֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, umbo hili la kitenzi ילד huonyesha kwamba mwanamume alikuwa baba wa mtu anayetajwa; “akamzaa” ni usemi wa kawaida wa kibiblia na wa moja kwa moja kwa Kiswahili.
- source_word: עֵיפָה
  choice: Efa
  rationale: Jina la mtu limetoholewa kwa umbo linalotambulika katika Kiswahili.
- source_word: כָּלֵב
  choice: Kalebu
  rationale: Jina la mtu limetolewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: חָרָן
  choice: Harani
  rationale: Jina limetolewa kwa umbo la Kiswahili na limetumika kwa uthabiti katika sehemu zote mbili za mstari.
- source_word: מוֹצָא
  choice: Mosa
  rationale: Jina la mtu limetoholewa kwa urahisi wa matamshi ya Kiswahili.
- source_word: גָּזֵז
  choice: Gazezi
  rationale: Jina la mtu limetoholewa kwa umbo la Kiswahili na kudumishwa sawasawa katika mara zote mbili.
- source_word: וְ
  choice: na; naye
  rationale: 'Kiunganishi kimetafsiriwa kulingana na kazi yake: “na” katika orodha, na “naye” kuanzisha kishazi kinachomrejelea Harani.'
- source_word: אֶת
  choice: halijatafsiriwa kando
  rationale: Kiashiria cha yambwa tendwa katika Kiebrania hakina neno linalolingana moja kwa moja katika Kiswahili; maana yake inaonyeshwa na mpangilio na viambishi vya kitenzi.
