    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, kausativi ya ילד kwa kawaida humaanisha kumzaa au kuwa baba wa mtu. “Akamzaa” ni fupi, ya kawaida, na hudumisha uhusiano wa ukoo.
- source_word: אֲבִי
  choice: baba yake
  rationale: Muundo huu unahifadhi maana ya msingi ya Kiebrania, huku uwezekano wa kumaanisha mwanzilishi au babu wa ukoo/makazi ukielezwa katika tanbihi.
- source_word: יָרְקֳעָם
  choice: Yorkeamu
  rationale: Jina hili limenukuliwa kwa mfumo unaosomeka kwa kawaida katika Kiswahili.
- source_word: שֶׁמַע
  choice: Shema
  rationale: Jina maalumu limenukuliwa kwa kufuata matumizi ya kawaida ya Kiswahili.
- source_word: רַחַם
  choice: Rahamu
  rationale: Jina maalumu limenukuliwa kwa umbo linalofaa matamshi na maendelezo ya Kiswahili.
- source_word: רֶקֶם
  choice: Rekemu
  rationale: Jina maalumu limenukuliwa kwa umbo linalofaa matamshi na maendelezo ya Kiswahili.
- source_word: שַׁמָּי
  choice: Shamai
  rationale: Jina maalumu limenukuliwa moja kwa moja, huku konsonanti maradufu ya tahajia ya Kiingereza ikiwa si lazima katika Kiswahili.
theological_decisions:
- issue: Maana ya אֲבִי kabla ya jina Yorkeamu
  choice: baba yake Yorkeamu
  alternative: mwanzilishi au babu wa ukoo wa Yorkeamu
  rationale: Matini kuu huhifadhi muundo wa wazi wa Kiebrania bila kuamua ikiwa Yorkeamu ni mtu, ukoo, au makazi; tanbihi huhifadhi maana pana inayowezekana katika nasaba.
translation_notes:
