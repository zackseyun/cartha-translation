- source_word: חָרֵף
  choice: Harefu
  rationale: Jina la mtu limetoholewa kwa kufuata umbo la konsonanti za Kiebrania hapa; tofauti ya jina hilo imeelezwa katika tanbihi.
- source_word: בֵית גָּדֵר
  choice: Beth-gaderi
  rationale: Limewasilishwa kama jina la mahali, huku umbo la Beth- likihifadhi muundo wa jina la Kiebrania na tahajia ikirekebishwa kwa usomaji wa Kiswahili.
