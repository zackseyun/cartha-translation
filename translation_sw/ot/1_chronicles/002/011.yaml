base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/011.yaml
  text: Nahshon fathered Salma[a], and Salma fathered Boaz.
translation:
  language: sw
  text: Nashoni akamzaa Salma[a], naye Salma akamzaa Boazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Salma; tafsiri nyingine zina Salmoni ili kulinganisha na nasaba zinazohusiana (kwa mfano, Ruthu 4:20–21; Mathayo 1:4–5).'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/נַחְשׁוֹן
  choice: Nashoni
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, huku likihifadhi utambulisho wa jina la Kiebrania נַחְשׁוֹן.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, Hiphil ya ילד humaanisha kumzaa au kuwa baba wa mtu. ‘Akamzaa’ ni fupi, ya kawaida katika Kiswahili cha Biblia, na inafaa kwa muundo wa nasaba.
- source_word: אֶת
  choice: '[halikutafsiriwa moja kwa moja]'
  rationale: Ni kiashiria cha yambwa katika Kiebrania, kisicho na maana huru inayohitaji neno tofauti katika Kiswahili.
- source_word: שַׂלְמָא
  choice: Salma
  rationale: Umbo la Kiebrania katika aya hii ni שַׂלְמָא, ambalo linawakilishwa moja kwa moja na ‘Salma’ kuliko ‘Salmoni’.
- source_word: וְ/שַׂלְמָא
  choice: naye Salma
  rationale: Kiunganishi וְ kimetolewa kwa ‘naye’ ili kuunganisha vifungu kwa Kiswahili cha asili bila kupoteza mwendelezo wa nasaba.
- source_word: בֹּעַז
  choice: Boazi
  rationale: Hili ni umbo la jina la בֹּעַז lililozoeleka na linalotamkika kwa urahisi katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Muundo wa ‘akamzaa’ umetumiwa kwa ufupi wa kinasa; ‘naye’ huleta mtiririko wa kawaida. Alama ya tanbihi [a] imewekwa mara tu baada ya jina linalohusika.
