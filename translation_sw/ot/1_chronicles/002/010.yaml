  yaml_path: translation/ot/1_chronicles/002/010.yaml
  text: Ram fathered Amminadab[a], and Amminadab fathered Nahshon, leader of the sons of Judah.
translation:
  language: sw
  text: Ramu akamzaa Aminadabu, naye Aminadabu akamzaa Nashoni, kiongozi wa wana wa Yuda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkuu wa wana wa Yuda.”
    reason: Neno la Kiebrania נְשִׂיא linaweza kumaanisha kiongozi, mkuu, au mtu mwenye cheo kikuu.
lexical_decisions:
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika muktadha wa nasaba, Hifili ya ילד humaanisha mwanaume kumzaa au kuwa baba wa mtu. “Akamzaa” ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya ukoo wa upande wa baba.
- source_word: נְשִׂיא
  choice: kiongozi
  rationale: נְשִׂיא humaanisha mtu mwenye cheo cha uongozi, kama kiongozi, mkuu, au mkuu wa ukoo. “Kiongozi” ni wazi na haidokezi bila lazima kwamba Nashoni alikuwa mwana wa mfalme.
- source_word: בְּנֵי יְהוּדָה
  choice: wana wa Yuda
  rationale: Tafsiri hii inafuata kwa karibu muundo wa Kiebrania na kuhifadhi sura ya kikabila na kinasaba ya kifungu.
- source_word: רָם / עַמִּינָדָב / נַחְשׁוֹן
  choice: Ramu / Aminadabu / Nashoni
  rationale: Majina yametoholewa kwa maumbo yanayotambulika na yanayotamkika kwa urahisi katika Kiswahili cha Biblia.
