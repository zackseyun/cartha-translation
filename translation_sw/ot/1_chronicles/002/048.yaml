  text: Caleb’s concubine Maacah bore Sheber and Tirhanah[a].
translation:
  language: sw
  text: Maaka, suria wa Kalebu, akawazaa Sheberi na Tirhana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda, “Maaka, suria wa Kalebu, akawa mzazi wa Sheberi na Tirhana,” ikiwa יָלַד limetumiwa hapa kwa maana pana ya kinasaba; kwa kuwa mtendaji anayetajwa wazi ni mwanamke, maandishi makuu yametumia “akawazaa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּלֶגֶשׁ
  choice: suria
  rationale: Neno hili humaanisha mwanamke aliye katika uhusiano wa ndoa au kingono unaotambuliwa lakini wenye hadhi ya chini kuliko ya mke mkuu. “Suria” ni neno fupi na la kawaida katika tafsiri za Biblia za Kiswahili.
- source_word: כָּלֵב
  choice: Kalebu
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: מַעֲכָה
  choice: Maaka
  rationale: Jina la mtu limetoholewa kwa kufuata sauti za Kiebrania na desturi ya Kiswahili.
- source_word: יָלַד
  choice: akawazaa
  rationale: Ingawa kitenzi hiki kinaweza kutumiwa kwa maana pana katika nasaba, hapa mtendaji anatajwa wazi kuwa mwanamke; kwa hiyo “akawazaa” ni tafsiri ya kawaida na inayolingana na jinsia yake.
- source_word: שֶׁבֶר
  choice: Sheberi
  rationale: Jina la mtu limetoholewa katika umbo linalosomeka kwa urahisi katika Kiswahili.
- source_word: וְאֶת
  choice: na
  rationale: Kiunganishi kinaunganisha yambwa ya pili; alama ya yambwa ya Kiebrania haitafsiriwi kando katika Kiswahili.
- source_word: תִּרְחֲנָה
  choice: Tirhana
  rationale: Jina la mtu limetoholewa kwa kufuata kwa karibu matamshi ya Kiebrania.
