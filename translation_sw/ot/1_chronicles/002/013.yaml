base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/013.yaml
  text: And Jesse fathered his firstborn Eliab[a], Abinadab the second, and Shimea the third.
translation:
  language: sw
  text: Naye Yese akamzaa Eliabu, mzaliwa wake wa kwanza, na Abinadabu wa pili, na Shimea[a] wa tatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina “Shimea”; orodha sambamba katika 1 Samweli 16:9 ina “Shama.”
    reason: cross_reference
lexical_decisions:
- source_word: וְאִישַׁי
  choice: Naye Yese
  rationale: Kiunganishi וְ kinaendeleza nasaba, na “Naye” ni njia ya kawaida ya Kiswahili ya kuunganisha taarifa hii na iliyotangulia. אִישַׁי ni jina Yese.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Hifili ya ילד katika nasaba humaanisha kuwa baba wa mtu au kumzaa; “akamzaa” ni fupi, ya kawaida, na inadumisha maana ya nasaba ya upande wa baba.
- source_word: אֶת בְּכֹרוֹ
  choice: mzaliwa wake wa kwanza
  rationale: בְּכוֹרוֹ humtaja mzaliwa wake wa kwanza. Muundo huu unaeleza wazi nafasi ya Eliabu bila kuongeza neno “mwana,” ambalo limeeleweka kutokana na muktadha.
- source_word: אֶת אֱלִיאָב
  choice: Eliabu
  rationale: אֶת ni alama ya yambwa na haitafsiriwi; jina אֱלִיאָב linatolewa kwa umbo la kawaida la Kiswahili, “Eliabu.”
- source_word: וַאֲבִינָדָב הַשֵּׁנִי
  choice: na Abinadabu wa pili
  rationale: Kiunganishi kinaendeleza orodha, na הַשֵּׁנִי ni namba ya mpangilio “wa pili.” Umbo “Abinadabu” linafuata matumizi ya kawaida ya majina ya Biblia kwa Kiswahili.
- source_word: וְשִׁמְעָא הַשְּׁלִישִׁי
  choice: na Shimea wa tatu
  rationale: Jina שִׁמְעָא limetoholewa moja kwa moja kuwa “Shimea,” bila kulibadilisha kwa umbo tofauti lililo katika 1 Samweli 16:9; הַשְּׁלִישִׁי ni “wa tatu.”
