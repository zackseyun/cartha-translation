base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/003.yaml
  text: 'The sons of Judah: Er[a], Onan, and Shelah; three were born to him by Bath-shua the Canaanite. Er, Judah’s firstborn, was evil in the sight of Yahweh[b], and he put him to death.'
translation:
  language: sw
  text: 'Wana wa Yuda: Eri, Onani, na Shela; hawa watatu walizaliwa kwake na binti wa Shua, Mkanaani. Eri, mzaliwa wa kwanza wa Yuda, alikuwa mwovu machoni pa Yahwe, naye akamwua.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hakimtaji mtenda kwa jina tena; maana ya kawaida ni, “Yahwe akamwua.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: Wana wa Yuda
  rationale: Muundo wa nasaba unaotaja wana wa Yuda; Kiswahili hiki ni cha kawaida na chenye heshima.
- source_word: שְׁלוֹשָׁה נוֹלַד לוֹ
  choice: Hao watatu alizaliwa
  rationale: Huhifadhi idadi iliyotajwa wazi na hali ya kutendwa ya kitenzi ילד kwa Kiswahili cha kawaida.
- source_word: מִבַּת שׁוּעַ הַכְּנַעֲנִית
  choice: na binti ya Shua, Mkanaani
  rationale: Hufuata mgawanyo wa kawaida wa Kiebrania, 'binti ya Shua, Mkanaani,' badala ya kulazimisha Bath-shua kuwa jina la pekee.
- source_word: בְּכוֹר יְהוּדָה
  choice: mzaliwa wa kwanza wa Yuda
  rationale: Hutoa uhusiano wa muundo tegemezi kwa Kiswahili cha asili na kuhifadhi msisitizo wa kinasaba.
- source_word: רַע בְּעֵינֵי יְהוָה
  choice: alikuwa mwovu machoni pa Yahwe
  rationale: Huhifadhi nahau ya Kiebrania kuhusu tathmini ya Mungu kwa usemi unaoeleweka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina la Mungu la herufi nne kama jina binafsi badala ya kulibadili kuwa cheo.
- source_word: וַיְמִיתֵהוּ
  choice: naye akamwua
  rationale: Kitenzi cha kusababisha kufa kimetafsiriwa kwa Kiswahili fasaha; kiwakilishi cha mtenda kinaendeleza rejeo la Yahwe katika kishazi kilichotangulia.
theological_decisions:
- issue: Mtenda asiye tajwa wazi katika וַיְמִיתֵהוּ
  choice: naye akamwua, ambapo 'yeye' anamrejelea Yahwe
  alternative: Yahwe akamwua
  rationale: Kiebrania kinaacha mtenda akiwa amedokezwa; rejeo la kawaida zaidi ni Yahwe aliyetajwa mara moja kabla. Matini kuu huhifadhi mtiririko wa kiwakilishi, na tanbihi inaweka wazi uwezekano huo.
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Huhifadhi jina binafsi lililo katika matini ya Kiebrania bila kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi wa nasaba na lugha ya kisasa yenye heshima. Jina Eri limetumiwa ili kusaidia matamshi ya Kiswahili; Mkanaani linamfafanua binti ya Shua.
