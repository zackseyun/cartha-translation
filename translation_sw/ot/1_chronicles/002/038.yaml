  text: Obed fathered Jehu, and Jehu fathered Azariah.
translation:
  language: sw
  text: Obedi akamzaa Yehu, naye Yehu akamzaa Azaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹבֵד
  choice: Obedi
  rationale: Jina la mtu limetoholewa kwa tahajia inayotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika ukoo, kausativi ya ילד humaanisha kuwa baba wa mtu. ‘Akamzaa’ ni usemi mfupi na wa kawaida wa Kiswahili unaohifadhi maana ya ukoo wa upande wa baba.
- source_word: אֶת
  choice: '[halijatafsiriwa kivyake]'
  rationale: Ni kiashiria cha yambwa dhahiri katika Kiebrania, bila neno la moja kwa moja linalolingana nalo katika Kiswahili.
- source_word: יֵהוּא
  choice: Yehu
  rationale: Jina la mtu limetoholewa kwa umbo linalotambulika katika matumizi ya kawaida ya Biblia za Kiswahili.
- source_word: וְ
  choice: naye
  rationale: Kiunganishi hiki kinaunganisha vifungu viwili vya ukoo; ‘naye’ huleta mtiririko wa asili kwa Kiswahili bila kuongeza maana mpya.
- source_word: עֲזַרְיָה
  choice: Azaria
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili.
