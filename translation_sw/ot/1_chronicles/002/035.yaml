  text: Sheshani alimpa Yarha, mtumwa wake, binti yake awe mke wa Yarha; naye akamzalia Atai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akampa
  rationale: Kitenzi נתן maana yake ya msingi ni ‘kutoa/kumpa’; katika muktadha huu ‘akampa’ pamoja na ‘awe mke wake’ huonyesha wazi ndoa bila kupanua zaidi ya Kiebrania.
- source_word: שֵׁשָׁן
  choice: Sheshani
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: בִּתּוֹ
  choice: binti yake
  rationale: Huhifadhi wazi uhusiano wa kifamilia na kiambishi cha nafsi ya tatu umoja.
- source_word: לְיַרְחָע
  choice: Yarha
  rationale: Jina la mtu limetoholewa moja kwa moja; kiambishi cha yambwa katika ‘akampa’ kinawasilisha לְ ya mpokeaji.
- source_word: עַבְדּוֹ
  choice: mtumwa wake
  rationale: עֶבֶד inaweza kumaanisha mtumishi au mtumwa. Hapa utambulisho wa Yarha kuwa mtu aliye chini ya mamlaka na umiliki wa nyumba ya Sheshani una umuhimu katika nasaba, hivyo ‘mtumwa’ huhifadhi uzito wa kijamii wa neno.
- source_word: לְאִשָּׁה
  choice: awe mke wake
  rationale: Usemi wa Kiebrania unamaanisha kumpa mwanamke kuwa mke; muundo huu ni wa asili na wazi katika Kiswahili.
- source_word: וַתֵּלֶד
  choice: akamzalia
  rationale: ילד ikiwa na mtendaji wa kike humaanisha kuzaa; ‘akamzalia’ pia huunganisha kwa kawaida kiwakilishi לוֹ.
- source_word: לוֹ
  choice: -m- katika ‘akamzalia’
  rationale: Kiwakilishi cha yambwa katika kitenzi kinaonyesha kuwa alimzalia Yarha mtoto, kwa Kiswahili cha kawaida.
- source_word: עַתָּי
  choice: Atai
  rationale: Jina la mtu limetoholewa kwa kuzingatia matamshi ya Kiebrania na mfumo wa sauti wa Kiswahili.
