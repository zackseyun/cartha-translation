  text: 'Hawa ndio wana wa Israeli: Reubeni, Simeoni, Lawi, Yuda, Isakari na Zabuloni.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hawa ndio
  rationale: Kiashirio cha wingi kinaanzisha orodha; muundo huu ni wa kawaida na wazi katika Kiswahili, huku ‘ndio’ ikitoa kishazi unganishi kinachohitajika.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Hapa neno hilo linawataja moja kwa moja watoto wa kiume wa Israeli, si wazao wa jumla; ‘wana wa’ ni sahihi na yenye hadhi katika muktadha wa nasaba.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la agano lililotumiwa katika Kiebrania linahifadhiwa badala ya kubadilishwa kuwa Yakobo.
- source_word: רְאוּבֵן
  choice: Reubeni
  rationale: Umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: שִׁמְעוֹן
  choice: Simeoni
  rationale: Umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: לֵוִי
  choice: Lawi
  rationale: Umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: וִיהוּדָה
  choice: Yuda
  rationale: Jina limetolewa kwa umbo la kawaida la Kiswahili. Kiunganishi cha Kiebrania hakijalazimishwa hapa, kwa kuwa Kiswahili cha kawaida huweka ‘na’ kabla ya mshiriki wa mwisho wa orodha.
- source_word: יִשָּׂשכָר
  choice: Isakari
  rationale: Umbo la kawaida la jina hili katika Biblia ya Kiswahili, linalowakilisha jina la Kiebrania kwa njia inayotambulika.
- source_word: וּזְבֻלוּן
  choice: na Zabuloni
  rationale: Kiunganishi cha mwisho kimehifadhiwa kwa ‘na’; ‘Zabuloni’ ni umbo la kawaida la jina hilo katika matumizi ya Kiswahili.
