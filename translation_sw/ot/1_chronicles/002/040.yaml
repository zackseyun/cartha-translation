  text: Eleasah fathered Sismai, and Sismai fathered Shallum.
translation:
  language: sw
  text: Eleasa akamzaa Sismai, na Sismai akamzaa Shalumu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְעָשָׂה
  choice: Eleasa
  rationale: Jina la mtu limetoholewa kwa mwandiko unaosomeka kwa urahisi katika Kiswahili huku likifuata umbo la Kiebrania.
- source_word: הֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, Hifili ya ילד humaanisha kumzaa au kuwa baba wa mtu. Kiswahili ‘akamzaa’ ni cha kawaida, kifupi, na huhifadhi maana ya uhusiano wa kizazi.
- source_word: אֶת
  choice: '[halikutafsiriwa kando]'
  rationale: Ni kiashiria cha yambwa mahususi katika Kiebrania, kisicho na neno la pekee linalolingana nacho katika Kiswahili; kazi yake imewakilishwa na muundo wa sentensi.
- source_word: סִסְמָי
  choice: Sismai
  rationale: Jina la mtu limetoholewa moja kwa moja kwa namna inayolingana na matamshi ya Kiebrania na kanuni za mwandiko wa Kiswahili.
- source_word: וְ
  choice: naye
  rationale: Kiunganishi hiki kinaunganisha vifungu viwili vya nasaba. ‘Naye’ huleta mtiririko wa kawaida wa Kiswahili na kuonyesha wazi kwamba Sismai ndiye kiima cha kifungu cha pili.
- source_word: שַׁלּוּם
  choice: Shalumu
  rationale: Jina la mtu limetoholewa kwa umbo linaloweza kutamkwa kwa kawaida katika Kiswahili, huku likihifadhi kwa karibu konsonanti za jina la Kiebrania.
