base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/037.yaml
  text: Zabad fathered Ephlal, and Ephlal fathered Obed.
translation:
  language: sw
  text: Zabadi akamzaa Eflali, naye Eflali akamzaa Obedi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָבָד
  choice: Zabadi
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili, kwa kuongezwa irabu ya mwisho ili lisomeke kwa urahisi.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, kauli ya Hifili ya ילד humaanisha kumzaa au kuwa baba wa mtu. “Akamzaa” ni ya kawaida, fupi, na inadumisha mfuatano wa masimulizi ya nasaba.
- source_word: אֶת
  choice: '[halikutafsiriwa moja kwa moja]'
  rationale: Ni kiashiria cha yambwa dhahiri katika Kiebrania na hakina neno huru linalolingana nalo katika Kiswahili.
- source_word: אֶפְלָל
  choice: Eflali
  rationale: Jina la mtu limetoholewa kulingana na matamshi ya Kiebrania na muundo wa sauti wa Kiswahili.
- source_word: וְ
  choice: naye
  rationale: Kiunganishi kinaunganisha vipashio viwili vya nasaba; “naye” hutoa Kiswahili cha asili huku kikidumisha uhusiano wa mwendelezo.
- source_word: עוֹבֵד
  choice: Obedi
  rationale: Jina la mtu limetoholewa badala ya kutafsiri maana yake ya kimsingi, kwa kuongezwa irabu ya mwisho inayofaa Kiswahili.
