  text: וַ/עֲזַרְיָה֙ הֹלִ֣יד אֶת חָ֔לֶץ וְ/חֶ֖לֶץ הֹלִ֥יד אֶת אֶלְעָשָֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/039.yaml
  text: Azariah fathered Helez[a], and Helez fathered Eleasah.
translation:
  language: sw
  text: Azaria akamzaa Helezi, naye Helezi akamzaa Eleasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “Elasa”; umbo la Kiebrania hapa limewakilishwa moja kwa moja zaidi kwa “Eleasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲזַרְיָה
  choice: Azaria
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia. Kiambishi waw kinaakisiwa kwa mtiririko wa simulizi katika kitenzi “akamzaa”.
- source_word: הֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, Hifili ya ילד humaanisha mwanaume kumzaa au kuwa baba wa mtu. “Akamzaa” ni fupi, ya asili katika Kiswahili, na inafaa kwa mtiririko wa orodha ya nasaba.
- source_word: אֶת
  choice: '[hakijatafsiriwa kando]'
  rationale: Ni kiashiria cha yambwa tendwa katika Kiebrania na hakihitaji neno maalumu katika Kiswahili.
- source_word: חָלֶץ / וְחֶלֶץ
  choice: Helezi / naye Helezi
  rationale: Jina limetoholewa kwa namna inayoweza kutamkwa kwa urahisi katika Kiswahili. “Naye” linaunganisha kiungo cha pili cha nasaba kwa uwazi na kuwakilisha waw.
- source_word: אֶלְעָשָׂה
  choice: Eleasa
  rationale: Utohozi huu unafuata kwa karibu umbo la Kiebrania lenye sehemu ya mwanzo ʾel- na unafaa katika fonolojia ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na rahisi kueleweka. Muundo wa “akamzaa” umechaguliwa kwa mtiririko wa kawaida wa nasaba, huku majina yakitoholewa kwa namna inayofaa Kiswahili.
