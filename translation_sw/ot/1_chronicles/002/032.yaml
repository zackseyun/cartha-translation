base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/032.yaml
  text: 'The sons of Jada[a], Shammai’s brother: Jether and Jonathan. Jether died without sons.'
translation:
  language: sw
  text: Wana wa Yada, ndugu ya Shamai, walikuwa Yetheri na Yonathani. Yetheri alikufa bila kuwa na wana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Wana wa
  rationale: Nomino ya wingi katika hali ya kutegemeana inaanzisha sehemu mpya ya nasaba; kiunganishi ו hakihitaji kutafsiriwa wazi katika Kiswahili hapa.
- source_word: יָדָע
  choice: Yada
  rationale: Jina la Kiebrania limenukuliwa kwa mfumo unaosomeka kwa kawaida katika Kiswahili.
- source_word: אֲחִי שַׁמַּי
  choice: ndugu yake Shamai
  rationale: אֲחִי hapa humtambulisha Yada kuwa ndugu wa Shamai; muundo huu ni wa asili na wazi katika Kiswahili.
- source_word: יֶתֶר
  choice: Yetheri
  rationale: Unukuzi wa jina la Kiebrania יֶתֶר unaotofautisha konsonanti ya th na kuongeza irabu ya mwisho kwa urahisi wa matamshi ya Kiswahili.
- source_word: וְיוֹנָתָן
  choice: na Yonathani
  rationale: Kiunganishi kimetafsiriwa kwa 'na', nalo jina limenukuliwa kwa namna inayofaa matamshi ya Kiswahili.
- source_word: וַיָּמָת
  choice: alikufa
  rationale: Umbo la masimulizi linaeleza tukio linalofuata katika taarifa ya nasaba; wakati uliopita wa Kiswahili unafaa.
- source_word: לֹא בָנִים
  choice: bila kuwa na wana
  rationale: Kirai kifupi cha Kiebrania, kihalisi 'si wana', katika muktadha humaanisha kwamba Yetheri alikufa pasipo wana wa kiume.
theological_decisions:
- issue: Je, לֹא בָנִים inamaanisha kutokuwa na watoto kabisa au kutokuwa na wana wa kiume?
  choice: bila kuwa na wana
  alternative: bila kuwa na watoto
  rationale: בָנִים humaanisha 'wana' na katika nasaba mkazo ni kutokuwepo kwa wazao wa kiume; tafsiri haipaswi kupanua dai hilo hadi kutokuwa na watoto wa jinsia yoyote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na rahisi kusomeka. Muundo wa kwanza umegeuzwa kuwa sentensi kamili kwa kutumia 'walikuwa', bila kubadili taarifa ya nasaba.
