  text: 'These were the sons of Caleb son of Hur[a], the firstborn of Ephrathah: Shobal, father of Kiriath-jearim.'
translation:
  language: sw
  text: 'Hawa walikuwa wana wa Kalebu, mwana wa Huri, mzaliwa wa kwanza wa Efratha: Shobali, baba wa Kiriath-yearimu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwanzilishi wa Kiriath-yearimu” au “babu wa Kiriath-yearimu”; katika orodha za vizazi, neno la Kiebrania linalomaanisha “baba wa” linaweza kurejelea mwanzilishi wa ukoo au wa makao.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הָיוּ
  choice: Hawa ndio waliokuwa
  rationale: Muundo huu unawakilisha kiwakilishi cha wingi pamoja na kitenzi cha wakati uliopita, na unasikika kwa kawaida katika simulizi la Kiswahili.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Neno la Kiebrania linamaanisha kihalisi “wana wa”; ingawa katika nasaba linaweza kujumuisha wazao, hakuna ulazima wa kupanua maana hiyo katika matini kuu.
- source_word: כָלֵב
  choice: Kalebu
  rationale: Umbo la kawaida la Kiswahili la jina hili la mtu.
- source_word: בֶּן חוּר
  choice: mwana wa Huri
  rationale: Inahifadhi muundo wa Kiebrania wa uhusiano wa nasaba bila kuamua kwamba lazima uwe uhusiano mpana zaidi wa uzao.
- source_word: בְּכֹר אֶפְרָתָה
  choice: mzaliwa wa kwanza wa Efratha
  rationale: Kirai hiki kimewekwa baada ya Huri ili kuhifadhi uhusiano unaowezekana zaidi katika mfuatano wa Kiebrania, yaani Huri ndiye mzaliwa wa kwanza wa Efratha.
- source_word: שׁוֹבָל
  choice: Shobali
  rationale: Umbo linalofaa la jina hili katika tahajia na matamshi ya Kiswahili.
- source_word: אֲבִי
  choice: baba wa
  rationale: Inahifadhi nahau ya Kiebrania katika matini kuu; tanbihi inaonyesha maana nyingine zinazowezekana katika muktadha wa nasaba na makao.
- source_word: קִרְיַת יְעָרִים
  choice: Kiriath-yearimu
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa, kwa tahajia inayoweza kusomeka kwa Kiswahili.
