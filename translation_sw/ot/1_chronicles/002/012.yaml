base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/012.yaml
  text: Boaz fathered Obed, and Obed fathered Jesse.
translation:
  language: sw
  text: Boazi akamzaa Obedi, na Obedi akamzaa Yese.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בֹעַז
  choice: Boazi
  rationale: Jina la mtu limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia; kiunganishi וּ kinaendelezwa kwa mtiririko wa simulizi kupitia kitenzi chenye kiambishi 'aka-'.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Katika nasaba, Hifili ya ילד humaanisha kumzaa au kuwa mzazi wa mtu. 'Akamzaa' ni ya kawaida, wazi, na huhifadhi mfuatano wa nasaba bila kutumia lugha ya kizamani.
- source_word: אֶת
  choice: '[haijatafsiriwa moja kwa moja]'
  rationale: Ni kiashiria cha yambwa mahsusi; dhima yake inaonyeshwa kiasili na mpangilio wa maneno pamoja na kiambishi cha yambwa '-m-' katika kitenzi.
- source_word: עוֹבֵד
  choice: Obedi
  rationale: Jina la mtu limetoholewa kwa umbo linalotambulika na wasomaji wa Kiswahili.
- source_word: וְ/עוֹבֵד
  choice: na Obedi
  rationale: Kiunganishi וְ kimetafsiriwa 'na' ili kuunganisha vifungu viwili vya nasaba, huku jina likitolewa kama 'Obedi'.
- source_word: הוֹלִיד
  choice: akamzaa
  rationale: Kitenzi cha nasaba kimetafsiriwa kwa namna ileile kama katika kifungu cha kwanza ili kudumisha uwazi na ulinganifu.
- source_word: יִשָׁי
  choice: Yese
  rationale: Jina limetolewa kwa umbo la Kiswahili lililozoeleka katika mapokeo mapana ya tafsiri za Biblia.
