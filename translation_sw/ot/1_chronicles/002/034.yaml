  text: Sheshan had no sons[a], only daughters. And Sheshan had an Egyptian servant whose name was Jarha.
translation:
  language: sw
  text: Sheshani hakuwa na wana wa kiume, bali mabinti tu. Naye Sheshani alikuwa na mtumwa[a] Mmisri aliyeitwa Yarha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtumishi.” Neno la Kiebrania עֶבֶד linaweza kumaanisha mtumishi au mtumwa; hapa “mtumwa” limetumiwa ili kuhifadhi maana ya mtu aliyekuwa chini ya umiliki au mamlaka ya mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיָה לְשֵשָׁן
  choice: Sheshani hakuwa na / alikuwa na
  rationale: Muundo wa Kiebrania wa ‘kuwa kwa mtu’ unaonyesha umilikaji; Kiswahili cha kawaida hutumia ‘kuwa na.’
- source_word: בָּנִים
  choice: wana
  rationale: Neno hili hapa linamaanisha wana wa kiume kwa sababu linatofautishwa moja kwa moja na ‘mabinti.’
- source_word: כִּי אִם
  choice: bali ... tu
  rationale: Baada ya ukanushi, usemi huu una maana ya ‘isipokuwa/bali tu’; muundo huu ni wa kawaida na unaweka wazi tofauti iliyokusudiwa.
- source_word: בָּנוֹת
  choice: mabinti
  rationale: Ni kisawe cha moja kwa moja kinachohifadhi tofauti kati ya wana na mabinti katika nasaba.
- source_word: עֶבֶד
  choice: mtumwa
  rationale: Neno linaweza kumaanisha mtumishi au mtumwa, lakini ‘mtumwa’ hapa huhifadhi wazi hali ya kuwa chini ya mamlaka ya mwenyewe bila kuilegeza.
- source_word: מִצְרִי
  choice: Mmisri
  rationale: Linabainisha asili au utaifa wa mtu huyo; ‘Mmisri’ ni tafsiri ya kawaida.
- source_word: וּשְׁמוֹ
  choice: aliyeitwa
  rationale: Kiebrania ni ‘na jina lake [lilikuwa]’; ‘aliyeitwa’ ni Kiswahili cha asili kinachowasilisha habari ileile.
- source_word: יַרְחָע
  choice: Yarha
  rationale: Jina limetoholewa kwa kufuata kwa karibu matamshi ya Kiebrania na kanuni za tahajia ya Kiswahili.
