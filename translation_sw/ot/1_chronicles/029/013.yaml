  yaml_path: translation/ot/1_chronicles/029/013.yaml
  text: And now[a], our God, we give thanks to you and praise the name of your glory.
translation:
  language: sw
  text: Na sasa, Mungu wetu, tunakushukuru na kusifu jina lako tukufu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “jina la utukufu wako.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Huhifadhi kiunganishi וְ pamoja na alama ya wakati עַתָּה, na kuendeleza mtiririko wa sala kwa Kiswahili cha kawaida.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Hutoa wazi nomino yenye kiambishi cha nafsi ya kwanza wingi bila kuongeza kihisishi cha mwito ambacho hakipo katika Kiebrania.
- source_word: מוֹדִים אֲנַחְנוּ לָךְ
  choice: tunakushukuru
  rationale: Katika muktadha huu wa ibada, ידה katika Hiphil humaanisha kutoa shukrani. Muundo wa Kiswahili wenye kiambishi cha yambwa unaeleza kwa kawaida maana ya ‘tunatoa shukrani kwako.’
- source_word: וּמְהַלְלִים
  choice: na kulisifu
  rationale: הלל katika Piel hapa ni kusifu. Kiambishi ‘-li-’ kinaelekea kwa ‘jina’ na kuhifadhi jina la Mungu kama kitu kinachosifiwa.
- source_word: לְשֵׁם תִּפְאַרְתֶּךָ
  choice: jina lako tukufu
  rationale: Hili ni Kiswahili cha asili kinachohifadhi ‘jina’ na maana ya תִּפְאֶרֶת kama utukufu, huku tanbihi ikionyesha kwa karibu zaidi muundo wa Kiebrania ‘jina la utukufu wako.’
theological_decisions:
- issue: Namna ya kutafsiri lugha ya kibiblia kuhusu ‘jina’ la Mungu
  choice: kulisifu jina lako tukufu
  alternative: kulisifu jina la utukufu wako
  rationale: ‘Jina’ limehifadhiwa kwa sababu lina uzito katika ibada ya kibiblia na linahusu jinsi Mungu anavyojifunua na kuheshimiwa. Tafsiri kuu ni ya kawaida kwa Kiswahili, nayo tanbihi huhifadhi muundo wa karibu zaidi na Kiebrania.
- issue: Mwito kwa Mungu bila kuongeza mtindo wa kiliturujia
  choice: Mungu wetu
  alternative: Ee Mungu wetu
  rationale: Muktadha unaonyesha wazi kuwa ni mwito katika sala, lakini matini ya Kiebrania hailazimishi kuongeza ‘Ee’; hivyo tafsiri haiongezi neno hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi katika usomaji wa pamoja au wa binafsi.
