  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּזְבְּח֣וּ לַ/יהוָ֣ה זְ֠בָחִים וַ/יַּעֲל֨וּ עֹל֜וֹת לַ/יהוָ֗ה לְֽ/מָחֳרַת֮ הַ/יּ֣וֹם הַ/הוּא֒ פָּרִ֨ים אֶ֜לֶף אֵילִ֥ים אֶ֛לֶף כְּבָשִׂ֥ים אֶ֖לֶף וְ/נִסְכֵּי/הֶ֑ם וּ/זְבָחִ֥ים לָ/רֹ֖ב לְ/כָל יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/021.yaml
  text: 'They sacrificed sacrifices to Yahweh and offered up burnt offerings to Yahweh on the next day after that day: one thousand bulls[a], one thousand rams, one thousand lambs, and their drink offerings[c][b], and sacrifices in abundance for all Israel.'
translation:
  language: sw
  text: 'Siku iliyofuata[a], wakamtolea Yahweh dhabihu na sadaka za kuteketezwa: ng’ombe dume elfu moja, kondoo dume elfu moja, wana-kondoo elfu moja, pamoja na sadaka zao za kinywaji[b]. Pia walitoa dhabihu nyingi kwa ajili ya Israeli wote[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kwa namna halisi zaidi: “kesho baada ya siku hiyo.”'
    reason: lexical_alternative
  - marker: b
    text: “Sadaka za kinywaji” zilikuwa vimiminika vilivyomiminwa kama sadaka pamoja na dhabihu za wanyama; pia zinaweza kuitwa “sadaka za kumimina.”
    reason: cultural_note
  - marker: c
    text: Au, “kwa niaba ya Israeli wote.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְבְּחוּ ... זְבָחִים
  choice: wakamtolea ... dhabihu
  rationale: Muundo huu unaeleza kwa Kiswahili cha kawaida tendo la kuchinja na kutoa dhabihu bila kurudia mzizi kwa namna isiyo ya asili; pia unatofautisha dhabihu hizi na sadaka za kuteketezwa zinazofuata.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetolewa moja kwa moja kama “Yahweh,” huku kiambishi cha kumwelekezea sadaka kikionyeshwa na “wakamtolea.”
- source_word: עֹלוֹת
  choice: sadaka za kuteketezwa
  rationale: Hili ni neno linaloeleweka kwa sadaka zilizoteketezwa madhabahuni na linadumisha tofauti yake na זְבָחִים.
- source_word: לְמָחֳרַת הַיּוֹם הַהוּא
  choice: Siku iliyofuata
  rationale: Ni usemi wa asili na ulio wazi katika Kiswahili; tanbihi inahifadhi namna ya mkazo ya Kiebrania, “kesho baada ya siku hiyo.”
- source_word: פָּרִים אֶלֶף
  choice: ng’ombe dume elfu moja
  rationale: פָּרִים hapa ni ng’ombe dume waliotolewa kama sadaka; tafsiri hii ni sahihi na wazi.
- source_word: אֵילִים אֶלֶף
  choice: kondoo dume elfu moja
  rationale: אֵילִים humaanisha hasa kondoo dume, si kondoo kwa ujumla.
- source_word: כְּבָשִׂים אֶלֶף
  choice: wana-kondoo elfu moja
  rationale: Katika muktadha wa dhabihu, כְּבָשִׂים huonyesha kondoo wachanga; “wana-kondoo” ni neno la kawaida la kibiblia na linaloeleweka.
- source_word: וְנִסְכֵּיהֶם
  choice: pamoja na sadaka zao za kinywaji
  rationale: Hizi ni sadaka za kimiminika zilizoambatana na wanyama waliotolewa; “zao” inadumisha urejeo wa wingi wa Kiebrania.
- source_word: וּזְבָחִים לָרֹב
  choice: Pia walitoa dhabihu nyingi
  rationale: לָרֹב huonyesha wingi. Sentensi mpya hufanya muhtasari huu wa dhabihu za ziada uwe wazi kwa msomaji.
- source_word: לְכָל יִשְׂרָאֵל
  choice: kwa ajili ya Israeli wote
  rationale: Huhifadhi maana pana ya ל bila kulazimisha wazo maalumu zaidi la uwakilishi au upatanisho.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la Mungu יהוה. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Ikiwa לְכָל יִשְׂרָאֵל inamaanisha dhabihu za uwakilishi
  choice: kwa ajili ya Israeli wote
  alternative: kwa niaba ya Israeli wote
  rationale: “Kwa ajili ya” huhifadhi upana wa kihusishi ל na upeo unaohusu Israeli wote bila kuingiza kwa lazima dai maalumu zaidi la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo umefanywa wa asili bila kufuta tofauti kati ya dhabihu za kawaida na sadaka za kuteketezwa. Alama zote za tanbihi zimewekwa mara moja katika sehemu husika ya matini.
