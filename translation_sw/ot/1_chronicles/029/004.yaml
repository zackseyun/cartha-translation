base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/004.yaml
  text: three thousand talents of gold[a], from the gold of Ophir, and seven thousand talents of refined silver, to overlay the walls of the buildings[b],
translation:
  language: sw
  text: talanta elfu tatu za dhahabu ya Ofiri[a], na talanta elfu saba za fedha iliyosafishwa, ili kufunika kuta za majengo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhahabu kutoka Ofiri.” Kiebrania kinaweza kumaanisha dhahabu iliyotoka Ofiri au “dhahabu ya Ofiri.”
    reason: lexical_alternative
  - marker: b
    text: Talanta ni kipimo cha uzito, si kipawa au uwezo wa mtu.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלֹשֶׁת אֲלָפִים כִּכְּרֵי זָהָב
  choice: talanta elfu tatu za dhahabu
  rationale: Muundo wa idadi umetafsiriwa kwa Kiswahili cha kawaida, huku 'talanta' ikihifadhi kipimo cha kihistoria cha uzito.
- source_word: מִזְּהַב אוֹפִיר
  choice: yaani dhahabu ya Ofiri
  rationale: Kirai hiki kinafafanua dhahabu iliyotajwa kuwa dhahabu yenye uhusiano na Ofiri; Kiswahili hiki ni cha asili na hakilazimishi ikiwa uhusiano huo ni wa asili yake au aina/sifa yake.
- source_word: וְשִׁבְעַת אֲלָפִים כִּכַּר כֶּסֶף
  choice: na talanta elfu saba za fedha
  rationale: Neno כִּכָּר ni kipimo cha uzito; mpangilio umewekwa katika Kiswahili cha kawaida bila kubadili kiasi.
- source_word: מְזֻקָּק
  choice: iliyosaﬁshwa
  rationale: Kitenzi-shirikishi cha Kiebrania kinaonyesha fedha ambayo imepitishwa katika mchakato wa kuondoa uchafu.
- source_word: לָטוּחַ
  choice: kufunika
  rationale: Katika muktadha wa madini ya thamani kuwekwa juu ya kuta, 'kufunika' hutoa maana ya kupaka au kutandaza tabaka juu ya uso bila kudokeza chokaa.
- source_word: קִירוֹת הַבָּתִּים
  choice: kuta za majengo
  rationale: Ingawa הַבָּתִּים kwa msingi ni 'nyumba,' muktadha wa ujenzi wa hekalu unaelekea kwenye majengo au sehemu zake, si makazi ya kawaida.
