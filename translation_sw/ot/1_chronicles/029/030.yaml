  text: along with all his reign and his might[b][a], and the times that passed over him and over Israel and over all the kingdoms of the lands.
translation:
  language: sw
  text: pamoja na utawala wake wote na uweza wake, na nyakati zilizompitia yeye, zikaipitia Israeli, na kuzipitia falme zote za nchi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zilizowapata.” Kwa tafsiri ya neno kwa neno, Kiebrania husema, “zilizopita juu yake.” Neno “nchi” katika Kiebrania liko katika wingi, likirejelea maeneo au mataifa mbalimbali.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִם
  choice: pamoja na
  rationale: Huunganisha mambo haya na taarifa iliyotangulia kwa Kiswahili cha kawaida, huku ikihifadhi maana ya kuambatana.
- source_word: מַלְכוּתוֹ
  choice: utawala wake wote
  rationale: Katika muhtasari wa maisha ya Daudi, neno hili linaelekea kumaanisha kipindi na shughuli za kutawala kwake, si eneo la ufalme pekee.
- source_word: גְבוּרָתוֹ
  choice: uweza wake
  rationale: Huhifadhi upana wa maana ya nguvu, ushujaa, au uwezo bila kulifanya neno hili limaanishe matendo makuu tu.
- source_word: הָעִתִּים
  choice: nyakati
  rationale: Ni tafsiri ya moja kwa moja inayoweza kujumuisha vipindi na hali mbalimbali za historia.
- source_word: אֲשֶׁר עָבְרוּ עָלָיו
  choice: zilizompitia yeye
  rationale: Huhifadhi taswira ya Kiebrania ya nyakati kupita juu ya mtu, lakini kwa muundo unaoeleweka katika Kiswahili.
- source_word: וְעַל יִשְׂרָאֵל
  choice: Israeli
  rationale: Kitenzi cha 'zilizompitia' kinaendelezwa kwa Israeli katika orodha; muundo huu wa Kiswahili huepuka marudio yasiyo ya kawaida bila kupoteza ulinganifu wa maana.
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: falme zote za nchi mbalimbali
  rationale: Huhifadhi wingi wa 'nchi' na kuonyesha falme za maeneo au mataifa yanayozungumziwa, bila kupanua maana kuwa dunia nzima.
