base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/002.yaml
  text: 'And with all my strength I have prepared for the house of my God: the gold for the things of gold[a], and the silver for the things of silver, and the bronze for the things of bronze, the iron for the things of iron, and the wood for the things of wood; onyx stones, settings, stones of antimony, variegated stones, every precious stone[d][c][b], and marble stones in abundance.'
translation:
  language: sw
  text: 'Nami nimeandaa kwa nguvu zangu zote kwa ajili ya nyumba ya Mungu wangu: dhahabu kwa vitu vya dhahabu, fedha kwa vitu vya fedha, shaba kwa vitu vya shaba, chuma kwa vitu vya chuma, na mbao kwa vitu vya mbao; mawe ya shohamu[a], viwekeo[b], mawe ya wanja[c], mawe ya rangi mbalimbali[d], kila jiwe la thamani, na mawe mengi ya marumaru[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho kamili wa baadhi ya mawe katika mstari huu hauna uhakika. “Shohamu” (שֹׁהַם) imehawilishwa kutoka Kiebrania; mara nyingi hutafsiriwa “oniksi.” “Marumaru” kwa שַׁיִשׁ ni tafsiri ya kimapokeo, lakini mapendekezo mengine yametolewa.
    reason: lexical_alternative
  - marker: b
    text: Au “sehemu za kufungia” au “vipachiko” kwa וּמִלּוּאִים.
    reason: lexical_alternative
  - marker: c
    text: Kifungu “mawe ya wanja” (אַבְנֵי פוּךְ) ni kigumu. Huenda kinataja mawe yanayohusishwa na madini meusi ya kujipamba macho, mapambo ya kupachika, au nyenzo nyingine ya urembo.
    reason: lexical_alternative
  - marker: d
    text: “Mawe ya rangi mbalimbali” linatafsiri רִקְמָה kulingana na orodha hii ya mawe na vifaa vya ujenzi; mahali pengine neno hilo linaweza kumaanisha kazi iliyotariziwa au yenye michoro ya rangi mbalimbali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכָל־כֹּחִי
  choice: kwa nguvu zangu zote
  rationale: כֹּחַ huonyesha nguvu au uwezo; usemi huu wa kawaida unaonyesha kwamba Daudi alitumia uwezo na rasilimali zake kikamilifu.
- source_word: הֲכִינוֹתִי
  choice: nimeandaa
  rationale: Kauli timilifu inaonyesha tendo lililokamilika lenye umuhimu katika hotuba ya sasa.
- source_word: לְבֵית אֱלֹהַי
  choice: kwa ajili ya nyumba ya Mungu wangu
  rationale: Inahifadhi taswira ya Kiebrania ya patakatifu kama nyumba ya Mungu na hisia binafsi ya msemaji.
- source_word: הַזָּהָב לַזָּהָב ... וְהָעֵצִים לָעֵצִים
  choice: dhahabu kwa vitu vya dhahabu ... mbao kwa vitu vya mbao
  rationale: Muundo unaorudia jina la nyenzo pamoja na ל unaonyesha nyenzo iliyotengwa kwa vitu vinavyotengenezwa nayo; kuongeza 'vitu vya' huweka maana wazi kwa Kiswahili.
- source_word: וְהַנְּחֹשֶׁת לַנְּחֹשֶׁת
  choice: shaba kwa vitu vya shaba
  rationale: נְחֹשֶׁת inaweza kumaanisha shaba au aloi ya bronzi; 'shaba' ni neno la kawaida la Kiswahili katika muktadha huu bila kudai kwa uhakika muundo wa metali.
- source_word: אַבְנֵי שֹׁהַם
  choice: mawe ya shohamu
  rationale: Utambulisho halisi wa jiwe hili hauna uhakika. Uhawilishaji 'shohamu' huepuka kulazimisha utambulisho wa kisasa usio na uhakika.
- source_word: וּמִלּוּאִים
  choice: viwekeo
  rationale: Neno linaweza kutaja sehemu za kuweka, kufungia, au kupachika mawe katika kazi ya mapambo.
- source_word: אַבְנֵי פוּךְ
  choice: mawe ya wanja
  rationale: פּוּךְ kwa kawaida ni madini meusi ya kujipamba macho; tafsiri ya karibu inadumisha ugumu wa kifungu bila kukisia aina maalumu ya jiwe.
- source_word: וְרִקְמָה
  choice: mawe ya rangi mbalimbali
  rationale: Katika orodha ya mawe na vifaa vya ujenzi, neno linaelekea kueleza mawe yenye rangi au michoro mbalimbali, ingawa mahali pengine hutaja kazi iliyotariziwa.
- source_word: וְאַבְנֵי שַׁיִשׁ לָרֹב
  choice: na mawe mengi ya marumaru
  rationale: '''Marumaru'' hufuata tafsiri ya kimapokeo ya שַׁיִשׁ, huku wingi wa לָרֹב ukitolewa kwa Kiswahili cha kawaida.'
