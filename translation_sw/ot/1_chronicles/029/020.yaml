base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/020.yaml
  text: Then David said to all the assembly, “Now bless Yahweh your God.” And all the assembly blessed Yahweh, the God of their fathers, and bowed their heads and prostrated themselves before Yahweh and before the king.
translation:
  language: sw
  text: Kisha Daudi akaliambia kusanyiko lote, “Sasa mbarikini Yahwe, Mungu wenu.”[a] Kusanyiko lote likambariki Yahwe, Mungu wa baba zao; wakainama na kujilaza kifudifudi mbele ya Yahwe na mbele ya mfalme.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tafadhali mbarikini Yahwe, Mungu wenu.” Neno נָא linaweza kuonyesha ombi au msisitizo wa haraka.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema walijilaza kifudifudi mbele ya “Yahwe na mfalme.” Maneno hayo yanaeleza tendo la mwili la kutoa heshima; heshima hiyo kwa mfalme pia inaweza kuelezwa kuwa “kumpa heshima.”
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרְכוּ נָא
  choice: Sasa mbarikini
  rationale: Kitenzi ברך kimetafsiriwa kwa ‘bariki’ ili kuhifadhi picha ya kusema baraka au sifa kwa Mungu. נָא hapa inaongeza msisitizo au ombi; ‘sasa’ ni himizo la kawaida na la moja kwa moja katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama jina binafsi ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Katika muktadha huu אֱלֹהִים pamoja na kiambishi cha nafsi ina maana ya umoja, yaani Mungu wa Israeli.
- source_word: הַקָּהָל
  choice: kusanyiko lote
  rationale: קָהָל ni jamii ya watu waliokusanyika rasmi; ‘kusanyiko’ ni neno la kawaida na lenye hadhi linalofaa mazingira haya ya hadhara.
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: Mungu wa baba zao
  rationale: Tafsiri hii inahifadhi usemi wa Kiebrania unaorejelea baba wa vizazi vilivyotangulia na historia ya agano.
- source_word: וַיִּקְּדוּ
  choice: wakainama
  rationale: קדד inaeleza kuinama. Tafsiri haiongezi kiungo cha mwili ambacho hakikutajwa katika Kiebrania, na inatofautisha tendo hili na kujilaza kifudifudi linalofuata.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: kujilaza kifudifudi
  rationale: שׁחה hapa inaeleza tendo halisi la mwili la kujishusha mpaka chini. Usemi huu unaepuka kulitafsiri moja kwa moja kuwa ‘kuabudu,’ kwa kuwa Yahwe na mfalme wote wanatajwa baada ya kitenzi hicho.
- source_word: לַיהוָה וְלַמֶּלֶךְ
  choice: mbele ya Yahwe na mbele ya mfalme
  rationale: ‘Mbele ya’ linafaa katika Kiswahili pamoja na tendo la kujilaza kifudifudi. Kurudia kirai kunahifadhi vitu vyote viwili vya heshima hiyo bila kudai kwamba aina ya heshima kwa kila mmoja ilikuwa sawa.
theological_decisions:
- issue: Tendo la kusujudu lililoelekezwa kwa Yahwe na pia kwa mfalme
  choice: wakainama na kujilaza kifudifudi mbele ya Yahwe na mbele ya mfalme
  alternative: wakamwabudu Yahwe na kumpa mfalme heshima
  rationale: Kiebrania kinatumia matendo yale yale ya mwili na kisha kuwataja Yahwe na mfalme. Kutaja tendo halisi kunahifadhi mvutano wa maandishi bila kulifanya tendo kwa mfalme kuwa ibada ya kimungu wala kutenganisha kimafasiri yale ambayo maandishi yameunganisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. ‘Mbarikini’ limehifadhiwa licha ya ‘msifuni’ kuwa mbadala wa kimawazo, kwa sababu linaendeleza picha ya Kiebrania ya kumbariki Mungu. ‘Kujilaza kifudifudi’ linaweka wazi tendo la mwili na kuepuka maana ya kidhehebu inayoweza kuletwa na ‘kuabudu’ au ‘kusujudu.’
