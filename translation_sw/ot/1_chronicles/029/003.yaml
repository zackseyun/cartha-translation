  text: וְ/ע֗וֹד בִּ/רְצוֹתִ/י֙ בְּ/בֵ֣ית אֱלֹהַ֔/י יֶשׁ לִ֥/י סְגֻלָּ֖ה זָהָ֣ב וָ/כָ֑סֶף נָתַ֤תִּי לְ/בֵית אֱלֹהַ/י֙ לְ/מַ֔עְלָ/ה מִ/כָּל הֲכִינ֖וֹתִי לְ/בֵ֥ית הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/003.yaml
  text: Moreover[a], because of my delight in the house of my God, I have a personal treasure of gold and silver, and I have given it to the house of my God[c][b], over and above all that I have prepared for the holy house.
translation:
  language: sw
  text: Zaidi ya hayo, kwa kuwa ninafurahia nyumba ya Mungu wangu, nina hazina yangu binafsi[a] ya dhahabu na fedha, nami nimeitoa kwa ajili ya nyumba ya Mungu wangu, zaidi ya yote niliyotayarisha kwa ajili ya nyumba takatifu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mali yangu ya pekee” au “hazina yangu mwenyewe.” Neno la Kiebrania humaanisha mali ya mtu mwenyewe yenye thamani kubwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “mahali patakatifu.” Kiebrania kwa neno moja ni “nyumba ya utakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: Zaidi ya hayo
  rationale: Huendeleza kauli iliyotangulia kwa kuongeza jambo jingine lenye mkazo; ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: בִּרְצוֹתִי בְּבֵית אֱלֹהַי
  choice: kwa sababu ninaipenda nyumba ya Mungu wangu
  rationale: Nomino רָצוֹן pamoja na kiambishi cha nafsi ya kwanza inaonyesha kupendezwa au kuwa na shauku; hapa בְּ ya kwanza inaeleza sababu, na ya pili inaonyesha kitu kinachopendwa. ‘Ninaipenda’ ni ya asili zaidi katika Kiswahili kuliko muundo mzito wa ‘kwa kupendezwa kwangu’.
- source_word: יֶשׁ לִי
  choice: nina
  rationale: Muundo wa Kiebrania wa kuonyesha umilikaji kwa njia ya uwepo hutafsiriwa kwa kawaida katika Kiswahili kwa ‘nina’.
- source_word: סְגֻלָּה
  choice: hazina yangu binafsi
  rationale: Neno hili humaanisha mali yenye thamani iliyo ya mtu mwenyewe. Katika muktadha huu linatofautisha mali binafsi ya Daudi na maandalizi aliyokuwa amekwisha kufanya.
- source_word: זָהָב וָכָסֶף
  choice: dhahabu na fedha
  rationale: Majina ya vifaa hivi yana maana ya moja kwa moja katika muktadha.
- source_word: נָתַתִּי
  choice: nimeitoa
  rationale: Kauli timilifu inaonyesha tendo lililokamilika lenye umuhimu katika mazungumzo ya sasa. Kiambishi ‘-i-’ kinarejelea hazina kama jumla ya mali iliyotolewa.
- source_word: לְבֵית אֱלֹהַי
  choice: kwa ajili ya nyumba ya Mungu wangu
  rationale: לְ baada ya נתן huonyesha lengo au kusudi la zawadi. ‘Kwa ajili ya’ ni ya asili katika Kiswahili kwa mali inayotengwa kwa ujenzi huu.
- source_word: לְמַעְלָה מִכָּל
  choice: zaidi ya yote
  rationale: Huhifadhi maana ya nyongeza inayozidi maandalizi yote yaliyotajwa.
- source_word: הֲכִינוֹתִי
  choice: niliyotayarisha
  rationale: Huwakilisha moja kwa moja tendo la Daudi la kuandaa vitu kwa ajili ya nyumba hiyo.
- source_word: לְבֵית הַקֹּדֶשׁ
  choice: kwa ajili ya nyumba takatifu
  rationale: Huhifadhi nomino בית, ‘nyumba,’ na sifa ya utakatifu, badala ya kuibadili kimyakimya kuwa istilahi ya kufasiri kama ‘hekalu’.
theological_decisions:
- issue: Istilahi ya jengo la ibada katika hotuba ya Daudi
  choice: nyumba / nyumba takatifu
  alternative: hekalu / mahali patakatifu
  rationale: Kiebrania kinarudia בית, ‘nyumba.’ Kudumisha ‘nyumba’ kunahifadhi taswira ya makao ya Mungu na mwangwi wake wa kiteolojia bila kuingiza ufafanuzi usio lazima; ‘hekalu’ au ‘mahali patakatifu’ bado ni tafsiri zinazowezekana kulingana na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa wasomaji wa kawaida huku urudiaji wa ‘nyumba’ na tofauti kati ya maandalizi ya awali na hazina binafsi vikihifadhiwa.
