  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵ֔י/נוּ כֹ֣ל הֶ/הָמ֤וֹן הַ/זֶּה֙ אֲשֶׁ֣ר הֲכִינֹ֔נוּ לִ/בְנֽוֹת לְ/ךָ֥ בַ֖יִת לְ/שֵׁ֣ם קָדְשֶׁ֑/ךָ מִ/יָּדְ/ךָ֥ היא וּ/לְ/ךָ֥ הַ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/016.yaml
  text: O Yahweh our God[a], all this abundance that we have prepared to build you a house for your holy name is from your hand[c][b], and all things are yours.
translation:
  language: sw
  text: Ee Yahweh Mungu wetu, wingi huu wote ambao tumeuandaa ili kukujengea nyumba kwa ajili ya jina lako takatifu unatoka mkononi mwako, na vyote ni vyako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh Mungu wetu
  rationale: Jina la agano יְהוָה limetoholewa kama “Yahweh,” nalo אֱלֹהֵינוּ katika muktadha huu ni umoja wenye maana ya “Mungu wetu.” Kiingizi “Ee” kinaonyesha usemi wa moja kwa moja katika sala.
- source_word: כֹל הֶהָמוֹן הַזֶּה
  choice: wingi huu wote
  rationale: הָמוֹן hapa inaeleza kiasi kikubwa cha mali na vifaa vilivyokusanywa, si umati wa watu. “Wingi huu wote” huhifadhi upana wa neno bila kulifungia katika aina moja ya mali.
- source_word: הֲכִינֹנוּ
  choice: tumeuandaa
  rationale: Kauli timilifu inaonyesha maandalizi yaliyokamilishwa yenye umuhimu wa sasa. Kiambishi -u- kinarejelea “wingi huu.”
- source_word: לִבְנוֹת לְךָ בַיִת
  choice: ili kukujengea nyumba
  rationale: “Kukujengea nyumba” ni Kiswahili cha kawaida kinachowakilisha לְךָ, huku “nyumba” ikihifadhi בַיִת na taswira yake badala ya kuitafsiri moja kwa moja kuwa “hekalu.”
- source_word: לְשֵׁם קָדְשֶׁךָ
  choice: kwa ajili ya jina lako takatifu
  rationale: Tafsiri hii ni ya asili na inahifadhi msisitizo wa Kiebrania juu ya jina takatifu la Mungu na kusudi la nyumba hiyo.
- source_word: מִיָּדְךָ הִיא
  choice: unatoka mkononi mwako
  rationale: Huhifadhi taswira halisi ya “mkono wako” huku “unatoka” ikieleza kwa Kiswahili cha kawaida kwamba wingi huo umetolewa na Mungu.
- source_word: וּלְךָ הַכֹּל
  choice: na vyote ni vyako
  rationale: Kauli fupi inadumisha upana wa הַכֹּל na muundo wa umilikaji wa maandishi ya Kiebrania bila kuongeza ufafanuzi usiokuwamo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano YHWH. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Maana ya nyumba inayokusudiwa
  choice: nyumba
  alternative: hekalu
  rationale: Ingawa muktadha unahusu hekalu, Kiebrania kinasema בַיִת, “nyumba.” Kulihifadhi neno hili kunatunza taswira ya nyumba ya Mungu bila kuondoa maana ya kimuktadha.
- issue: Upeo wa umiliki wa Mungu katika וּלְךָ הַכֹּל
  choice: vyote ni vyako
  alternative: kila kitu ni chako
  rationale: '“Vyote” hudumisha kauli pana ya Kiebrania na mvutano wake wa kiteolojia: hata vitu walivyoandaa watu vilitoka kwa Mungu na ni vyake.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala ya hadharani. Sentensi imeweka urudiaji wa “wote/vyote” ili kudumisha msisitizo wa כֹל ... הַכֹּל. Hakuna tanbihi zilizohitajika kwa kuwa tofauti za kileksika zinaweza kuhifadhiwa katika maamuzi ya tafsiri bila kuusumbua mstari.
