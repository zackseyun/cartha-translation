base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/009.yaml
  text: Then the people rejoiced because they had offered willingly[a], for with a whole heart they had offered willingly to Yahweh[b]; and David the king also rejoiced with great joy.
translation:
  language: sw
  text: Ndipo watu wakafurahi kwa sababu ya utoaji wao wa hiari[a], kwa maana walimtolea Yahwe kwa moyo mkamilifu[b] na kwa hiari; Mfalme Daudi pia akafurahi sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu walitoa kwa hiari”; mzizi wa Kiebrania unakazia kutoa kwa utashi, bila kulazimishwa.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kwa moyo mkamilifu,” yaani kwa unyoofu na moyo usiogawanyika.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ הָעָם
  choice: Ndipo watu wakafurahi
  rationale: Muundo huu unaendeleza masimulizi kwa Kiswahili cha kawaida na kuhifadhi maana ya furaha ya watu.
- source_word: עַל הִתְנַדְּבָם
  choice: kwa sababu walikuwa wametoa kwa hiari
  rationale: Kitenzi cha Kiebrania kutoka mzizi נדב kinasisitiza kutoa kwa utashi, bila kulazimishwa; muktadha ni michango kwa ajili ya hekalu.
- source_word: כִּי
  choice: kwa maana
  rationale: Kinaanzisha ufafanuzi wa sababu iliyowafanya watu wafurahi.
- source_word: בְּלֵב שָׁלֵם
  choice: kwa moyo mkamilifu
  rationale: Huhifadhi taswira halisi ya Kiebrania na wazo la unyoofu, utimilifu, na moyo usiogawanyika.
- source_word: הִתְנַדְּבוּ לַיהוָה
  choice: walikuwa wamemtolea Yahwe
  rationale: Muktadha wa sadaka unaifanya 'kumtolea' iwe ya asili; kihusishi na kiambishi cha yambwa vinaonyesha kuwa walitoa kwa Yahwe, huku hiari ikielezwa tayari katika kishazi cha kwanza.
- source_word: וְגַם דָּוִיד הַמֶּלֶךְ
  choice: Mfalme Daudi pia
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unadumisha mkazo wa nyongeza kwamba Daudi alijiunga na furaha ya watu.
- source_word: שָׂמַח שִׂמְחָה גְדוֹלָה
  choice: akafurahi sana
  rationale: Ni Kiswahili cha asili kinachowasilisha nguvu ya muundo wa Kiebrania wenye kurudia mzizi wa neno 'furaha'.
theological_decisions:
- issue: Jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la agano; 'Yahwe' hulitaja moja kwa moja badala ya kulibadilisha kuwa cheo.
- issue: Maana ya בְּלֵב שָׁלֵם
  choice: kwa moyo mkamilifu
  alternative: kwa moyo wote / kwa moyo usiogawanyika
  rationale: Chaguo hili huhifadhi nahau ya Kiebrania bila kuifungia katika tafsiri moja pekee ya kiroho au kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. 'Walikuwa wametoa' huonyesha kwamba utoaji ulitangulia furaha; 'akafurahi sana' huepuka urudiaji usio wa asili wa 'alifurahi furaha kubwa'.
