revisions:
- from: Wakala na kunywa mbele za Yahweh siku hiyo kwa furaha kubwa[a]. Wakamfanya Sulemani mwana wa Daudi kuwa mfalme mara ya pili[b], wakamtia mafuta kwa ajili ya Yahweh awe mtawala[c][d], na wakamtia Sadoki mafuta awe kuhani.
  to: Wakala na wakanywa mbele za Yahweh siku hiyo kwa furaha kubwa[a]. Wakamfanya Sulemani, mwana wa Daudi, kuwa mfalme kwa mara ya pili[b], wakamtia mafuta kwa ajili ya Yahweh awe mtawala[c][d], na Sadoki awe kuhani.
