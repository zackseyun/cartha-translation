base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/022.yaml
  text: And they ate and drank before Yahweh on that day with great joy[a], and they made Solomon son of David king a second time, and they anointed him for Yahweh as ruler[d][c][b], and Zadok as priest.
translation:
  language: sw
  text: Wakala na wakanywa mbele za Yahweh siku hiyo kwa furaha kubwa[a]. Wakamfanya Sulemani, mwana wa Daudi, kuwa mfalme kwa mara ya pili[b], wakamtia mafuta kwa ajili ya Yahweh awe mtawala[c][d], na Sadoki awe kuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika uwepo wa Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Au, “tena.”
    reason: lexical_alternative
  - marker: c
    text: Au, “wakamtia mafuta mbele za Yahweh awe mtawala.” Kiebrania kinaweza kumaanisha kuwekwa kwa ajili ya Yahweh au tendo lililofanywa mbele zake.
    reason: alternative_reading
  - marker: d
    text: “Mtawala” limetafsiri neno la Kiebrania nagid, ambalo katika mazingira mengine linaweza kutafsiriwa “kiongozi” au “mkuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Kirai hiki humaanisha kuwa mbele ya au katika uwepo wa Yahweh. ‘Mbele za Yahweh’ ni Kiswahili cha kawaida kinachohifadhi mazingira ya ibada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: בְּשִׂמְחָה גְדוֹלָה
  choice: kwa furaha kubwa
  rationale: Huwasilisha kwa njia ya kawaida maana ya namna walivyokula na kunywa.
- source_word: וַיַּמְלִיכוּ
  choice: wakamfanya ... kuwa mfalme
  rationale: Hifili ya מלך humaanisha kumsababisha mtu atawale au kumweka kuwa mfalme; tafsiri hii haiongezi sherehe ya kumvika taji ambayo haikutajwa.
- source_word: שֵׁנִית
  choice: mara ya pili
  rationale: Huhifadhi kwa wazi kwamba tendo hilo lilifanyika kwa mara ya pili, si tu ‘tena’ kwa maana pana.
- source_word: וַיִּמְשְׁחוּ
  choice: wakamtia mafuta
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa tendo la kumweka rasmi mtu katika wadhifa wa kifalme au wa kikuhani kwa mafuta.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahweh
  rationale: Huhifadhi wazo la kuwekwa kwa uhusiano na Yahweh au kwa utumishi wake bila kulazimisha maana moja nyembamba; uwezekano wa ‘mbele za Yahweh’ umeelezwa katika tanbihi.
- source_word: לְנָגִיד
  choice: awe mtawala
  rationale: נָגִיד humaanisha kiongozi mwenye mamlaka juu ya watu. ‘Mtawala’ huonyesha mamlaka hiyo bila kuingiza maana ya mwana wa mfalme ambayo ‘mwana-mfalme’ ingeweza kudokeza.
- source_word: לְכֹהֵן
  choice: awe kuhani
  rationale: Hueleza moja kwa moja kuwekwa kwa Sadoki katika wadhifa wa ukuhani.
- source_word: בֶן דָּוִיד
  choice: mwana wa Daudi
  rationale: Huhifadhi utambulisho wa Sulemani kwa uhusiano wake wa kifamilia na wa nasaba kwa Daudi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Maandishi yana jina binafsi la Mungu, kwa hiyo ‘Yahweh’ hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לַיהוָה katika kifungu cha kutiwa mafuta
  choice: wakamtia mafuta kwa ajili ya Yahweh awe mtawala
  alternative: wakamtia mafuta mbele za Yahweh awe mtawala
  rationale: Herufi ל inaweza kuonyesha kuwekwa wakfu au uhusiano na Yahweh, lakini inaweza pia kueleweka kuwa tendo lilifanywa mbele zake. Tafsiri kuu na tanbihi kwa pamoja zinahifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ya pili imerudia kitenzi ‘wakamtia ... mafuta’ kwa Sadoki ili uhusiano wa kisarufi uwe wazi kwa msomaji wa kawaida, ingawa Kiebrania kinaacha kitenzi hicho kieleweke kutokana na kifungu kilichotangulia.
