base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/023.yaml
  text: Then Solomon sat on the throne of Yahweh as king in place of David his father[a], and he prospered, and all Israel listened to him.
translation:
  language: sw
  text: Ndipo Sulemani akaketi kwenye kiti cha enzi cha Yahwe akiwa mfalme badala ya Daudi baba yake; akafanikiwa, na Israeli wote wakamtii[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakamsikiliza” au “wakamsikiliza kwa makini.” Kiebrania kinaweza kumaanisha kusikiliza kwa makini, lakini katika muktadha huu wa kifalme kinadokeza utiifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: akaketi
  rationale: Huhifadhi taswira halisi ya kuketi juu ya kiti cha enzi, huku muktadha ukionyesha kutawazwa kwake.
- source_word: כִּסֵּא יְהוָה
  choice: kiti cha enzi cha Yahwe
  rationale: Huhifadhi muundo wa Kiebrania na dai kwamba ufalme wa Daudi ulitekelezwa chini ya utawala wa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uhamishaji wa jina binafsi la Mungu katika herufi za Kiswahili badala ya kulibadilisha kuwa cheo.
- source_word: לְמֶלֶךְ
  choice: akiwa mfalme
  rationale: Hueleza kwa Kiswahili cha kawaida nafasi au wadhifa ambao Sulemani alichukua.
- source_word: תַּחַת דָּוִיד אָבִיו
  choice: badala ya Daudi baba yake
  rationale: Katika muktadha wa urithi wa kifalme, תַּחַת humaanisha kuchukua nafasi ya mtangulizi.
- source_word: וַיַּצְלַח
  choice: akafanikiwa
  rationale: Kitenzi kinaeleza kupata mafanikio au kufaulu, bila kuongeza maelezo yasiyosemwa wazi katika mstari.
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: wakamtii
  rationale: Katika muktadha wa watu kumwitikia mfalme mwenye mamlaka, kishazi hiki hubeba maana ya kumsikiliza kwa kumtii; tanbihi huhifadhi maana halisi iliyo pana zaidi.
- source_word: כָּל יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Ni usemi wa kawaida unaolirejelea taifa kwa ujumla.
theological_decisions:
- issue: Maana ya “kiti cha enzi cha Yahwe” kuhusiana na ufalme wa Sulemani
  choice: Kuhifadhi usemi “kiti cha enzi cha Yahwe” kama ulivyo
  alternative: Kuufafanua kuwa kiti kilichokuwa mali ya Yahwe au kuufanya usemi wa kawaida tu wa kisiasa
  rationale: Mwandishi wa Mambo ya Nyakati anaonyesha ufalme wa Daudi kama unaotekelezwa chini ya utawala na kwa niaba ya Yahwe. Tafsiri huhifadhi dai hilo bila kulipanua kwa mfumo fulani wa kimadhehebu.
- issue: Nguvu ya maana ya וַיִּשְׁמְעוּ אֵלָיו
  choice: wakamtii
  alternative: wakamsikiliza / wakamsikia kwa makini
  rationale: Muktadha wa kifalme unaelekeza kwenye kuitikia mamlaka kwa utiifu, lakini tanbihi huhifadhi upana halisi wa kitenzi cha Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye staha na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi wa Kiebrania umefanywa wa kawaida kwa Kiswahili bila kuondoa taswira ya kiti cha enzi wala mvutano wa kimaana katika ‘kusikiliza/kutii’.
