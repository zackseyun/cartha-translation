base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/001.yaml
  text: Then King David said to all the assembly, “Solomon my son, the one God has chosen, is young and inexperienced, and the work is great; for the palace is not for man, but for the LORD God.”
translation:
  language: sw
  text: Kisha Mfalme Daudi akaliambia kusanyiko lote, “Sulemani mwanangu, yule ambaye Mungu amemchagua, ni kijana na hana uzoefu, nayo kazi hii ni kubwa; kwa maana jumba hili si kwa ajili ya mwanadamu, bali ni kwa ajili ya BWANA Mungu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקָּהָל
  choice: kusanyiko lote
  rationale: Neno hili humaanisha jamii au mkutano uliokusanyika; “kusanyiko lote” ni la kawaida na linaendana na muktadha wa viongozi na watu waliokusanywa.
- source_word: אֶחָד בָּחַר בּוֹ אֱלֹהִים
  choice: ndiye ambaye Mungu amemchagua
  rationale: Muundo wa Kiebrania unamtenga Sulemani kama yule aliyechaguliwa na Mungu bila kulazimisha maana ya kwamba Mungu hakumchagua mtu mwingine yeyote kwa kusudi jingine.
- source_word: נַעַר וָרָךְ
  choice: ni kijana na hana uzoefu
  rationale: Kwa neno, kifungu ni “kijana na mwororo”; katika muktadha huu kinaonyesha ujana na kutokuwa tayari au kutokuwa na uzoefu wa kutosha kwa kazi kubwa.
- source_word: הַמְּלָאכָה
  choice: kazi hii
  rationale: Hurejelea kazi ya kujenga hekalu inayozungumziwa katika muktadha; kiwakilishi “hii” huifanya rejea hiyo iwe wazi kwa Kiswahili.
- source_word: הַבִּירָה
  choice: jumba hili
  rationale: Neno linaweza kumaanisha jumba kubwa au ngome; hapa linarejelea jengo la hekalu. “Jumba” huhifadhi taswira ya jengo kuu bila kulifanya kuwa makao ya mfalme.
- source_word: יהוה אֱלֹהִים
  choice: BWANA Mungu
  rationale: “BWANA” ni desturi iliyoenea ya Kiswahili ya kuwakilisha jina la agano YHWH, ikifuatiwa na “Mungu” kama katika chanzo.
theological_decisions:
- issue: Maana ya אֶחָד katika kauli kuhusu kuchaguliwa kwa Sulemani
  choice: ndiye ambaye Mungu amemchagua
  alternative: ambaye peke yake Mungu amemchagua
  rationale: Tafsiri iliyochaguliwa inahifadhi msisitizo kwa Sulemani kuwa yule aliyechaguliwa kwa kazi hii, lakini haiongezi dai pana la upekee lisilo lazima katika Kiebrania.
- issue: Jumba kuwa “kwa ajili ya BWANA Mungu”
  choice: si kwa ajili ya mwanadamu, bali ni kwa ajili ya BWANA Mungu
  alternative: si la mwanadamu, bali ni la BWANA Mungu
  rationale: “Kwa ajili ya” huhifadhi kwa uwazi wazo la kusudi au mnufaika lililo katika viambishi לְ vya Kiebrania, bila kudai tu umiliki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi inadumisha ulinganifu wa kauli ya Daudi na tofauti kati ya mwanadamu na BWANA Mungu.
