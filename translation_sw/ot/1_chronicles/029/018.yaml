base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/018.yaml
  text: O Yahweh[a], God of Abraham, Isaac, and Israel, our fathers, keep this forever in the intentions of the thoughts of the heart of your people[d][c][b], and direct their heart toward you.
translation:
  language: sw
  text: Ee Yahweh, Mungu wa Abrahamu, Isaka, na Israeli,[a] baba zetu, hifadhi hili milele kama mwelekeo wa mawazo ya mioyo ya watu wako, na uielekeze mioyo yao kwako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina “Israeli”; wasomaji wengine huenda wakatarajia “Yakobo” katika orodha hii ya mababu, lakini maandishi hapa yanasema “Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “na uithibitishe mioyo yao kwako.” Neno la Kiebrania linaweza kumaanisha kuelekeza, kuimarisha, au kufanya imara.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano limetafsiriwa moja kwa moja kwa umbo linalotambulika katika Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי
  choice: Mungu wa
  rationale: Hili ni umbo la uambatanisho linalounganisha Mungu na majina ya mababu wanaofuata.
- source_word: אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל אֲבֹתֵינוּ
  choice: Abrahamu, Isaka, na Israeli, baba zetu
  rationale: Maandishi ya Kiebrania yana 'Israeli,' si 'Yakobo'; 'baba zetu' linahifadhi rejeo mahsusi kwa mababu hawa wa kiume.
- source_word: שֳׁמְרָה זֹּאת לְעוֹלָם
  choice: liifadhi hili milele
  rationale: Ombi linamtaka Mungu audumishe daima mwelekeo ulioonekana katika watu; kiambishi cha ngeli katika 'liifadhi' kinarejelea 'hili' kwa mtindo wa asili wa Kiswahili.
- source_word: לְיֵצֶר מַחְשְׁבוֹת לְבַב עַמֶּךָ
  choice: kuwa mwelekeo wa mawazo ya mioyo ya watu wako
  rationale: יֵצֶר inaweza kumaanisha mwelekeo, kusudi, au msukumo wa ndani. 'Mwelekeo' huhifadhi maana ya hali ya ndani bila kufanya mnyororo huo kuwa mzito kupita kiasi; 'mioyo' huwasilisha kwa kawaida wazo la ndani la watu wengi.
- source_word: וְהָכֵן לְבָבָם אֵלֶיךָ
  choice: na uielekeze mioyo yao kwako
  rationale: Hifili ya כון inaweza kumaanisha kuimarisha, kutayarisha, au kuelekeza; pamoja na אֵלֶיךָ, 'uielekeze ... kwako' huonyesha wazi mwelekeo wa moyo kwa Mungu.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia Tetragramatoni yenyewe; 'Yahweh' huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Jina la babu יִשְׂרָאֵל
  choice: Israeli
  alternative: Yakobo
  rationale: Ingawa katika orodha hii baadhi ya wasomaji wanaweza kutarajia 'Yakobo,' chanzo kinasema 'Israeli,' hivyo hakikupatanishwa na fomula iliyozoeleka zaidi.
- issue: Maana ya וְהָכֵן kuhusu moyo
  choice: uielekeze mioyo yao kwako
  alternative: uithibitishe mioyo yao kwako
  rationale: Neno linaweza kuhusisha kuelekeza au kuimarisha. Tafsiri kuu inaonyesha uhusiano wa kuelekea kwa Mungu, huku tanbihi ikihifadhi uwezekano wa kuimarisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika sajili ya sala yenye heshima na inayoeleweka. 'Ee' linaonyesha mwito wa moja kwa moja. Uwingi 'mioyo' ni wa kawaida zaidi katika Kiswahili kwa watu wengi, ingawa Kiebrania hutumia nomino ya umoja kwa maana ya pamoja.
