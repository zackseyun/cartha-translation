base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/024.yaml
  text: And all the officials[a], the mighty men, and also all the sons of King David pledged allegiance to King Solomon.
translation:
  language: sw
  text: Na maafisa wote, mashujaa, na pia wana wote wa Mfalme Daudi walimwahidi Mfalme Sulemani utii.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “walitoa mkono chini ya Mfalme Sulemani,” nahau ya Kiebrania inayomaanisha kujitiisha au kuahidi utii.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָּׂרִים
  choice: maafisa
  rationale: Neno hili humaanisha watawala au maafisa wenye vyeo vya juu; “maafisa” ni Kiswahili cha sasa kinachofaa muktadha wa utawala wa kifalme bila kulifanya neno hilo kuwa la kijeshi pekee.
- source_word: גִּבֹּרִים
  choice: mashujaa
  rationale: Neno hili humaanisha watu hodari au wenye nguvu, na mara nyingi lina maana ya kijeshi; “mashujaa” huhifadhi maana ya ushujaa na uwezo wa kivita kwa lugha ya kawaida.
- source_word: בְּנֵי הַמֶּלֶךְ דָּוִיד
  choice: wana wote wa Mfalme Daudi
  rationale: “Wana” linaweza kurejelea watoto wa kiume kama ilivyo katika muktadha huu, na muundo huu huhifadhi uhusiano wa kifamilia pamoja na cheo cha Daudi.
- source_word: נָתְנוּ יָד תַּחַת
  choice: walikubali kuwa chini ya mamlaka ya
  rationale: Nahau hiyo, kihalisi “walitoa mkono chini ya,” huonyesha kujitiisha au kukiri utii kwa mtawala. Tafsiri hii huwasilisha wazi wazo la kukubali mamlaka bila kulazimisha dhana maalumu ya kiapo ambayo haijaelezwa moja kwa moja.
- source_word: שְׁלֹמֹה הַמֶּלֶךְ
  choice: Mfalme Sulemani
  rationale: Huu ndio mpangilio wa kawaida na wa heshima katika Kiswahili, huku ukihifadhi wazi hadhi ya kifalme ya Sulemani.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi ni wa kawaida kwa wasomaji wengi; nahau ya Kiebrania imetafsiriwa kwa maana yake na umbo lake halisi limehifadhiwa katika tanbihi.
