  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יִּתְּנ֞וּ לַ/עֲבוֹדַ֣ת בֵּית הָ/אֱלֹהִ֗ים זָהָ֞ב כִּכָּרִ֣ים חֲמֵֽשֶׁת אֲלָפִים֮ וַ/אֲדַרְכֹנִ֣ים רִבּוֹ֒ וְ/כֶ֗סֶף כִּכָּרִים֙ עֲשֶׂ֣רֶת אֲלָפִ֔ים וּ/נְחֹ֕שֶׁת רִבּ֛וֹ וּ/שְׁמוֹנַ֥ת אֲלָפִ֖ים כִּכָּרִ֑ים וּ/בַרְזֶ֖ל מֵֽאָה אֶ֥לֶף כִּכָּרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/007.yaml
  text: And they gave for the service of the house of God five thousand talents of gold and ten thousand darics[a], and ten thousand talents of silver, and eighteen thousand talents of bronze[c][b], and one hundred thousand talents of iron.
translation:
  language: sw
  text: Nao wakatoa kwa ajili ya kazi ya nyumba ya Mungu talanta elfu tano za dhahabu na dariki elfu kumi,[a] talanta elfu kumi za fedha, talanta elfu kumi na nane za shaba,[b] na talanta laki moja za chuma.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dariki ilikuwa sarafu ya dhahabu ya Kiajemi.
    reason: cultural_note
  - marker: b
    text: Kwa neno kwa neno, Kiebrania kinasema, “elfu kumi na elfu nane” za shaba, yaani elfu kumi na nane.
    reason: lexical_alternative
  - marker: c
    text: Talanta ilikuwa kipimo kikubwa cha uzito, si talanta kwa maana ya kipawa au uwezo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Nao wakatoa
  rationale: Kitenzi נתן kinasimulia tendo lililokamilika. “Wakatoa” ni Kiswahili cha kawaida katika muktadha wa michango na hakiongezi wazo lisilokuwamo wazi katika neno la Kiebrania.
- source_word: לַעֲבוֹדַת
  choice: kwa ajili ya kazi ya
  rationale: עֲבוֹדָה inaweza kumaanisha kazi au huduma. “Kazi” ni ya kawaida na inafaa katika muktadha wa vifaa vya nyumba ya Mungu bila kuiwekea maana finyu ya ujenzi pekee.
- source_word: בֵּית הָאֱלֹהִים
  choice: nyumba ya Mungu
  rationale: Hii inafuata usemi wa Kiebrania kwa uwazi. “Hekalu” lingeweka istilahi maalumu zaidi kuliko ilivyo katika matini.
- source_word: כִּכָּרִים
  choice: talanta
  rationale: כִּכָּר ni kipimo kikubwa cha uzito. Istilahi ya kihistoria “talanta” imehifadhiwa na kufafanuliwa katika tanbihi.
- source_word: אֲדַרְכֹנִים
  choice: dariki
  rationale: Ni neno la mkopo la Kiajemi linalotaja sarafu maalumu ya dhahabu. Kutumia “dariki” kunahifadhi umaalumu wake wa kihistoria kuliko kusema tu “sarafu za dhahabu.”
- source_word: רִבּוֹ
  choice: elfu kumi
  rationale: Namba hii humaanisha 10,000; “elfu kumi” ni usemi wa kawaida na ulio wazi katika Kiswahili.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: נְחֹשֶׁת inaweza kutaja shaba au bronzi kulingana na muktadha. “Shaba” ni istilahi ya kawaida ya kibiblia katika Kiswahili na inaeleweka katika orodha hii ya metali.
- source_word: רִבּוֹ וּשְׁמוֹנַת אֲלָפִים
  choice: elfu kumi na nane
  rationale: Kiebrania hujumlisha elfu kumi na elfu nane. Kutaja jumla ya elfu kumi na nane ni Kiswahili cha kawaida na hudumisha thamani ileile.
- source_word: מֵאָה אֶלֶף
  choice: laki moja
  rationale: Usemi huu ni 100,000. “Laki moja” ni namna ya kawaida ya kutaja idadi hiyo katika Kiswahili cha Afrika Mashariki.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha umerahisishwa kwa ufasaha bila kupunguza aina za metali, idadi, au vipimo vya matini ya Kiebrania. “Nyumba ya Mungu” imehifadhiwa badala ya “hekalu,” na “kazi” imechaguliwa ili kutobana עֲבוֹדָה kuwa ibada au ujenzi pekee.
