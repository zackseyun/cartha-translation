base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/015.yaml
  text: For we are sojourners before you[a], and temporary residents, as all our fathers were. Our days on the earth are like a shadow[c][b], and there is no hope.
translation:
  language: sw
  text: Kwa maana sisi ni wageni mbele zako[a], na wakazi wa muda[b], kama walivyokuwa mababu zetu wote. Siku zetu duniani ni kama kivuli, wala hakuna tumaini[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wageni wanaoishi ugenini.”
    reason: lexical_alternative
  - marker: b
    text: Au “wakazi wasio wenyeji.”
    reason: lexical_alternative
  - marker: c
    text: Katika muktadha huu, “hakuna tumaini” linahusu kutodumu na kupita upesi kwa maisha ya mwanadamu duniani; si lazima liwe kauli kwamba hakuna tumaini katika Mungu.
    reason: cross_reference
lexical_decisions:
- source_word: גֵרִים
  choice: wageni
  rationale: Neno hili humaanisha watu wanaoishi mahali pasipo kwao na bila hadhi kamili ya wenyeji. “Wageni” ni la kawaida katika Kiswahili na, pamoja na muktadha na tanbihi, linahifadhi maana ya ukaaji wa ugenini.
- source_word: לְפָנֶיךָ
  choice: mbele zako
  rationale: Ni tafsiri ya moja kwa moja ya usemi wa Kiebrania unaoelekeza sala hii kwa Mungu; pia ni Kiswahili cha kawaida na chenye hadhi.
- source_word: תוֹשָׁבִים
  choice: wakazi wa muda
  rationale: Hueleza watu wanaokaa mahali bila kudumu au bila kuwa wenyeji kamili. Chaguo hili linaweka sambamba na “wageni” huku likisisitiza kutodumu.
- source_word: כְּכָל אֲבֹתֵינוּ
  choice: kama walivyokuwa mababu zetu wote
  rationale: “Mababu” hapa huwajumuisha watangulizi wa Israeli na kuhifadhi taswira ya kifamilia ya neno la Kiebrania bila kufanya sentensi kuwa nzito.
- source_word: כַּצֵּל
  choice: kama kivuli
  rationale: Huhifadhi sitiari ya Kiebrania kuhusu ufupi na kutodumu kwa maisha.
- source_word: יָמֵינוּ עַל הָאָרֶץ
  choice: siku zetu duniani
  rationale: Ni usemi wa asili na ulio wazi katika Kiswahili kwa muda wa maisha ya mwanadamu hapa duniani.
- source_word: וְאֵין מִקְוֶה
  choice: wala hakuna tumaini
  rationale: מִקְוֶה linaweza kumaanisha tumaini au matarajio. “Hakuna tumaini” huhifadhi ukali na mvutano wa kauli ya Kiebrania bila kuongeza ufafanuzi ndani ya mstari.
theological_decisions:
- issue: Maana ya וְאֵין מִקְוֶה katika muktadha wa maisha mafupi ya mwanadamu
  choice: wala hakuna tumaini
  alternative: wala hakuna matarajio; wala hakuna kudumu
  rationale: Kauli imeachwa ikiwa kali kama ilivyo katika Kiebrania. Muktadha unaielekeza kwenye kutodumu kwa maisha ya duniani, lakini tafsiri kuu haiongezi maneno yatakayoondoa mvutano wa kiteolojia; tanbihi hutoa ufafanuzi wa muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na sitiari ya kivuli zimehifadhiwa; msamiati umewekwa wazi kwa msomaji wa kawaida bila kuondoa mvutano wa maandishi.
