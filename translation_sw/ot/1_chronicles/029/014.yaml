  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כִ֨י מִ֤י אֲנִי֙ וּ/מִ֣י עַמִּ֔/י כִּֽי נַעְצֹ֣ר כֹּ֔חַ לְ/הִתְנַדֵּ֖ב כָּ/זֹ֑את כִּֽי מִמְּ/ךָ֣ הַ/כֹּ֔ל וּ/מִ/יָּדְ/ךָ֖ נָתַ֥נּוּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/014.yaml
  text: But who am I[a], and who are my people, that we should be able to offer willingly like this? For everything comes from you, and from your hand we have given to you.
translation:
  language: sw
  text: Lakini mimi ni nani, na watu wangu ni nani, hata tuweze[a] kutoa kwa hiari namna hii? Kwa maana vitu vyote vinatoka kwako, na kutoka mkononi mwako tumekupa wewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa maneno kwa karibu zaidi, “hata tuwe na nguvu za kutoa kwa hiari namna hii?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Lakini
  rationale: Kiunganishi kinaanzisha utofautishaji wa unyenyekevu katika sala ya Daudi; “Lakini” ni ya kawaida na huhifadhi mgeuko wa hoja.
- source_word: מִי אֲנִי וּמִי עַמִּי
  choice: mimi ni nani, na watu wangu ni nani
  rationale: Maswali haya ya balagha yanaonyesha kutostahili au hadhi ndogo mbele za Mungu, bila kuyageuza kuwa swali kuhusu asili yao.
- source_word: נַעְצֹר כֹּחַ
  choice: tuweze
  rationale: Kirai hiki kwa neno moja moja huhusu kuwa na au kudumisha nguvu, lakini hapa maana yake ni kuwa na uwezo au rasilimali za kutoa.
- source_word: לְהִתְנַדֵּב
  choice: kutoa kwa hiari
  rationale: Kitenzi kinaonyesha tendo la kujitolea au kutoa kwa moyo wa hiari; tafsiri hii ni wazi bila kuingiza istilahi maalumu ya kiibada.
- source_word: כָּזֹאת
  choice: namna hii
  rationale: Kinarejelea utoaji wa ukarimu uliotajwa katika muktadha na kinasikika kwa kawaida katika Kiswahili.
- source_word: מִמְּךָ הַכֹּל
  choice: vitu vyote vinatoka kwako
  rationale: Hueleza wazi kwamba Mungu ndiye chanzo cha vyote, huku ikidumisha muundo wa sentensi unaoeleweka.
- source_word: וּמִיָּדְךָ
  choice: na kutoka mkononi mwako
  rationale: Taswira ya mkono kama chanzo cha riziki na utoaji imehifadhiwa kwa kuwa ni wazi na muhimu katika mstari huu.
- source_word: נָתַנּוּ לָךְ
  choice: tumekupa wewe
  rationale: Wakati timilifu unaonyesha tendo lililofanywa, na kiwakilishi “wewe” kinahifadhi msisitizo wa kwamba kilichotolewa kilitolewa kwa Mungu.
theological_decisions:
- issue: Umiliki wa Mungu na utoaji wa wanadamu
  choice: Tafsiri inasisitiza kwamba kila walichotoa watu kilitokana kwanza na Mungu.
  alternative: Tungeweza kufafanua zaidi kwa kusema, “tumekurudishia tu kile ambacho tayari ni chako.”
  rationale: Kiebrania kinasema moja kwa moja kwamba vyote vinatoka kwa Mungu na kwamba walichompa kilitoka mkononi mwake. Tafsiri inadumisha dai hilo bila kuongeza ufafanuzi wa kimafundisho usiotamkwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ya sala ni ya kawaida kwa msomaji wa leo; taswira ya “mkono” imehifadhiwa, na nahau ya Kiebrania kuhusu nguvu imewasilishwa katika tanbihi.
