base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/005.yaml
  text: gold for the things of gold[a], and silver for the things of silver, and for every kind of work by the hands of craftsmen. And who is willing to fill his hand today for Yahweh?
translation:
  language: sw
  text: dhahabu kwa ajili ya vitu vya dhahabu, fedha kwa ajili ya vitu vya fedha, na kwa kila aina ya kazi itakayofanywa na mafundi. Ni nani anayejitolea leo kuujaza mkono wake[a] kwa ajili ya Yahwe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kuujaza mkono wake.” Nahau hii ya Kiebrania inaweza kumaanisha kujiweka wakfu au kuleta sadaka kwa ajili ya huduma takatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַזָּהָב לַזָּהָב
  choice: dhahabu kwa vitu vya dhahabu
  rationale: Kirudio cha Kiebrania ni usemi wa mkato unaoonyesha dhahabu iliyokusudiwa kwa vitu vinavyotengenezwa kwa dhahabu. Neno “vitu” linawekwa wazi kwa Kiswahili bila kubainisha aina ya vitu ambayo matini haijaitaja.
- source_word: וְלַכֶּסֶף לַכֶּסֶף
  choice: fedha kwa vitu vya fedha
  rationale: Muundo huu unalingana na kifungu cha dhahabu na unaonyesha fedha iliyotengwa kwa vitu vya fedha.
- source_word: וּלְכָל מְלָאכָה בְּיַד חָרָשִׁים
  choice: na kwa kila kazi ya mikono ya mafundi
  rationale: “Kazi ya mikono ya mafundi” ni Kiswahili cha kawaida kinachohifadhi taswira ya mkono katika Kiebrania na kuonyesha kazi iliyotekelezwa na watu wenye ustadi.
- source_word: וּמִי מִתְנַדֵּב
  choice: Ni nani anayejitolea
  rationale: Kitenzi cha Kiebrania kinaonyesha tendo la hiari. “Anayejitolea” hudumisha mwito wa hiari na swali la balagha.
- source_word: לְמַלֹּאות יָדוֹ
  choice: kuujaza mkono wake
  rationale: Tafsiri ya karibu inalinda nahau ya ibada ambayo katika muktadha huu inaweza kuhusisha kujiweka wakfu au kutoa kwa ajili ya huduma takatifu. Tanbihi inaeleza maana zake bila kuamua moja pekee katika matini kuu.
- source_word: הַיּוֹם
  choice: leo
  rationale: Ni kielezi cha wakati cha moja kwa moja na cha kawaida katika Kiswahili.
- source_word: לַיהוָה
  choice: kwa ajili ya Yahwe
  rationale: Kihusishi kinaonyesha kwamba tendo hilo linaelekezwa kwa Yahwe; “kwa ajili ya” ni cha kawaida katika Kiswahili. Jina la agano יהוה limetolewa kama “Yahwe” kwa tahajia ya Kiswahili.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia moja kwa moja Tetragramatoni. “Yahwe” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Nahau ya ibada לְמַלֹּאות יָדוֹ
  choice: kuujaza mkono wake, pamoja na tanbihi
  alternative: kujiweka wakfu / kutoa sadaka kwa ukamilifu
  rationale: Nahau inaweza kuashiria kuwekwa wakfu au kuleta toleo kwa huduma takatifu. Tafsiri ya karibu na tanbihi hudumisha mvutano huo badala ya kuufanya uwe na maana moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mkato wa mwanzo umehifadhiwa kwa sababu aya hii inaendeleza orodha kutoka muktadha uliotangulia.
