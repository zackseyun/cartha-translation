  text: וַ/יְגַדֵּ֨ל יְהוָ֤ה אֶת שְׁלֹמֹה֙ לְ/מַ֔עְלָ/ה לְ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּתֵּ֤ן עָלָי/ו֙ ה֣וֹד מַלְכ֔וּת אֲ֠שֶׁר לֹֽא הָיָ֧ה עַל כָּל מֶ֛לֶךְ לְ/פָנָ֖י/ו עַל יִשְׂרָאֵֽל־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/025.yaml
  text: And Yahweh made Solomon exceedingly great in the sight of all Israel[a], and gave him royal majesty such as had not been on any king before him over Israel.
translation:
  language: sw
  text: Yahwe akamfanya Sulemani kuwa mkuu sana mbele ya Israeli yote, naye akampa adhama ya kifalme[a] ambayo haikuwa imewahi kuwa juu ya mfalme yeyote aliyemtangulia kutawala Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fahari ya kifalme” au “utukufu wa ufalme.”
    reason: הוֹד מַלְכוּת inaweza kueleza adhama, fahari au utukufu unaohusiana na ufalme.
lexical_decisions:
- source_word: וַיְגַדֵּל ... לְמַעְלָה
  choice: akamfanya ... kuwa mkuu sana
  rationale: Hifili ya גדל ina maana ya kusababisha kuwa mkuu, na לְמַעְלָה hapa inatilia nguvu kiwango hicho. Kauli hii ni ya asili katika Kiswahili na inadumisha maana zote mbili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa moja kwa moja kwa umbo la kawaida la Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: mbele ya Israeli yote
  rationale: Nahau ya Kiebrania inaonyesha jambo lililofanyika hadharani na kutambuliwa na taifa zima; ‘mbele ya’ ni ya kawaida na yenye kueleweka katika Kiswahili.
- source_word: וַיִּתֵּן עָלָיו
  choice: naye akampa
  rationale: Kiebrania halisi ni ‘akaweka/akatoa juu yake,’ lakini hapa ni nahau ya kukirimu au kumpa mtu sifa fulani. ‘Akampa’ ni fupi na ya asili.
- source_word: הוֹד מַלְכוּת
  choice: adhama ya kifalme
  rationale: הוֹד huonyesha adhama, fahari au utukufu, na מַלְכוּת huweka maana hiyo katika mazingira ya ufalme. ‘Adhama ya kifalme’ ni ya heshima na ya kawaida.
- source_word: אֲשֶׁר לֹא הָיָה עַל כָּל מֶלֶךְ לְפָנָיו עַל יִשְׂרָאֵל
  choice: ambayo haikuwa imewahi kuwa na mfalme yeyote aliyemtangulia kutawala Israeli
  rationale: Muundo huu unaonyesha kwamba hakuna mfalme wa Israeli aliyekuwa kabla ya Sulemani aliyepata adhama kama hiyo. Kiswahili hiki kinaweka wazi uhusiano wa ‘kutawala Israeli’ bila kubadili dai la mstari.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, si cheo. ‘Yahwe’ huhifadhi jina hilo kwa tahajia inayofaa Kiswahili.
- issue: Upekee wa adhama ya Sulemani
  choice: Hakuna mfalme wa Israeli aliyemtangulia aliyekuwa na adhama kama hiyo
  alternative: Hakuna mfalme yeyote popote aliyekuwa na adhama kama hiyo
  rationale: Kirai עַל יִשְׂרָאֵל kinahusisha ulinganisho na wafalme waliotawala Israeli, hivyo tafsiri haipanui dai hilo kwa wafalme wote wa mataifa yote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi wenye ‘aka-’ unafaa muktadha wa kihistoria; istilahi zimechaguliwa ili mstari ueleweke kwa wasomaji wa kawaida bila kupoteza uzito wa kifalme.
