  text: וְ/לִ/שְׁלֹמֹ֣ה בְנִ֗/י תֵּ֚ן לֵבָ֣ב שָׁלֵ֔ם לִ/שְׁמוֹר֙ מִצְוֺתֶ֔י/ךָ עֵדְוֺתֶ֖י/ךָ וְ/חֻקֶּ֑י/ךָ וְ/לַ/עֲשׂ֣וֹת הַ/כֹּ֔ל וְ/לִ/בְנ֖וֹת הַ/בִּירָ֥ה אֲשֶׁר הֲכִינֽוֹתִי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/019.yaml
  text: And give to Solomon my son a whole heart to keep your commandments[a], your testimonies, and your statutes, and to do all of them, and to build the fortress that I have prepared.
translation:
  language: sw
  text: Na umpe Sulemani, mwanangu, moyo kamili, ili azishike amri zako, shuhuda zako na sheria zako, na kuzifanya zote, na kujenga ngome[a] ambayo nimeiandaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ikulu” au kwa ufupi “hekalu.” Neno la Kiebrania si la kawaida; linaweza kumaanisha jengo kubwa au lenye ulinzi, na hapa linarejelea patakatifu ambayo Daudi alikuwa ameiandaa ili Sulemani ajenge.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה בְנִי תֵּן
  choice: Nawe umpe Sulemani mwanangu
  rationale: Muundo huu unahifadhi ombi linaloelekezwa kwa Mungu na unaonyesha wazi kwamba Sulemani ndiye anayepokea kile kinachoombwa.
- source_word: לֵבָב שָׁלֵם
  choice: moyo kamili
  rationale: Neno לֵבָב linahusu moyo kama kitovu cha nia na fikira, huku שָׁלֵם likimaanisha ukamilifu, utimilifu au kutokuwa na mgawanyiko. ‘Moyo kamili’ huhifadhi sitiari bila kufafanua kupita kiasi.
- source_word: לִשְׁמוֹר
  choice: ili azishike
  rationale: Kitenzi שׁמר kinapotumiwa kuhusu maagizo ya Mungu humaanisha kuyashika au kuyatii. ‘Azishike’ ni usemi wa kawaida wa Kibiblia na unaunganika kisarufi na nomino tatu zinazofuata.
- source_word: מִצְוֺתֶיךָ
  choice: amri zako
  rationale: ‘Amri’ ni kisawe cha kawaida na cha moja kwa moja cha מצוה katika muktadha wa agano.
- source_word: עֵדְוֺתֶיךָ
  choice: shuhuda zako
  rationale: ‘Shuhuda’ huhifadhi tofauti ya neno עדות na ‘amri’ pamoja na ‘sheria,’ ingawa hapa lina maana maalumu ya masharti yanayoshuhudia mapenzi ya Mungu katika agano.
- source_word: וְחֻקֶּיךָ
  choice: na sheria zako
  rationale: חקים ni masharti yaliyowekwa. ‘Sheria’ ni neno la asili na linaloeleweka katika Kiswahili huku likitofautishwa na ‘amri’ na ‘shuhuda.’
- source_word: וְלַעֲשׂוֹת הַכֹּל
  choice: na kuzifanya zote
  rationale: Kifungu hiki kwa maana ya karibu ni ‘na kufanya yote.’ Kiambishi ‘-zi-’ kinarejelea kwa kawaida amri, shuhuda na sheria zilizotangulia.
- source_word: וְלִבְנוֹת הַבִּירָה
  choice: na kujenga ngome[a]
  rationale: בִּירָה ni neno lisilo la kawaida linaloweza kumaanisha ngome, jumba au jengo kubwa lenye ulinzi. ‘Ngome’ huhifadhi maana yake ya msingi, huku tanbihi ikieleza kwamba hapa linarejelea patakatifu palipotayarishwa kujengwa.
- source_word: אֲשֶׁר הֲכִינוֹתִי
  choice: ambayo nimeiandaa
  rationale: Hiphil ya כון humaanisha kuandaa au kufanya tayari. Kauli ‘nimeiandaa’ pia huhifadhi hali ya tendo lililokwisha kufanywa.
theological_decisions:
- issue: Maana ya בִּירָה kuhusiana na patakatifu pa Yerusalemu
  choice: ngome
  alternative: ikulu; hekalu; ngome ya hekalu
  rationale: Neno lenyewe linaweza kumaanisha jengo kubwa, jumba au ngome, lakini katika muktadha huu linarejelea mradi wa patakatifu ambao Daudi alimwandalia Sulemani. ‘Ngome’ huhifadhi upekee wa msamiati wa Kiebrania, na tanbihi huzuia lisieleweke kama ngome ya kijeshi isiyohusiana na hekalu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya neno ‘ngome,’ ambalo ndilo linalofafanuliwa.
