review_pass:
  verdict: revise
  source_fidelity: The conjunction וְ introduces the request concerning Solomon; it does not contain an independent second-person pronoun. “Nawe” can therefore misleadingly mean “and you,” whereas “Na umpe” accurately preserves the prayer request. The remaining wording conveys the Hebrew well, including the complete/integral heart, the three legal terms, doing all of them, and building the marked structure called בִּירָה.
  naturalness: The revised wording is natural Standard East African Swahili in a reverent prayer register. “Moyo kamili,” “azishike,” and “shuhuda zako” are appropriate biblical diction. Appositional commas around “mwanangu” improve readability without changing emphasis.
  terminology: “Amri,” “shuhuda,” and “sheria” appropriately retain the Hebrew threefold terminology. “Ngome” is a defensible primary rendering of בִּירָה when its sanctuary referent is explained in a footnote. The footnote should describe the sanctuary structure/project itself rather than say merely that David prepared at a location.
  issues:
  - severity: medium
    issue: “Nawe” adds an explicit second-person pronoun absent from the Hebrew.
    rationale: The source says, literally, “and to Solomon my son, give.” In Swahili, “Nawe umpe” can be heard as “And you, give him,” adding emphasis not expressed by the source.
  - severity: low
    issue: The footnote’s phrase “patakatifu ambapo Daudi alikuwa amefanya maandalizi ili Sulemani apajenge” makes the preparation primarily locative.
    rationale: 'The Hebrew relative clause modifies בִּירָה: David prepared the structure/project that Solomon is to build. The note should state this relation more directly.'
  revised_text: Na umpe Sulemani, mwanangu, moyo kamili, ili azishike amri zako, shuhuda zako na sheria zako, na kuzifanya zote, na kujenga ngome[a] ambayo nimeiandaa.
  revised_footnotes:
  - marker: a
    text: Au “ikulu” au kwa ufupi “hekalu.” Neno la Kiebrania si la kawaida; linaweza kumaanisha jengo kubwa au lenye ulinzi, na hapa linarejelea patakatifu ambayo Daudi alikuwa ameiandaa ili Sulemani ajenge.
    reason: lexical_alternative
  revision_rationale: 'Removed the added pronoun in “Nawe” and clarified the footnote’s account of what David prepared. No other change is needed: the draft otherwise represents the Hebrew syntax and vocabulary faithfully and naturally.'
