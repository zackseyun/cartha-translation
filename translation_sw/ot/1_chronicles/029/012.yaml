base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/012.yaml
  text: Both riches and honor come from before you[a], and you rule over all. In your hand are power and might[c][b], and in your hand it is to make great and to strengthen all.
translation:
  language: sw
  text: Utajiri na heshima[b] hutoka mbele zako[a], nawe unatawala juu ya vyote. Mkononi mwako mna nguvu na uweza, na mkononi mwako mna uwezo wa kuwafanya wakuu[c] na kuwatia nguvu wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa maana halisi, “hutoka mbele zako”; pia yaweza kutafsiriwa, “hutoka kwako” au “hutoka katika uwepo wako.”
    reason: lexical_alternative
  - marker: b
    text: “Heshima” pia yaweza kutafsiriwa “utukufu.”
    reason: lexical_alternative
  - marker: c
    text: “Kuwafanya wakuu” pia yaweza kutafsiriwa “kuwainua” au “kuwatukuza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹשֶׁר
  choice: utajiri
  rationale: Neno hili humaanisha mali au wingi wa mali; “utajiri” ni la kawaida, lenye hadhi, na linafaa katika sala hii ya sifa.
- source_word: הַכָּבוֹד
  choice: heshima
  rationale: Katika muktadha huu linaashiria hadhi na fahari inayotolewa na Mungu. “Heshima” huambatana kwa kawaida na “utajiri,” huku “utukufu” ukibaki kuwa maana nyingine inayowezekana.
- source_word: מִלְּפָנֶיךָ
  choice: hutoka kwako
  rationale: Nahau ya Kiebrania, kwa maana halisi “kutoka mbele zako,” inaonyesha kwamba Mungu ndiye chanzo. “Hutoka kwako” ni Kiswahili cha kawaida; taswira halisi imehifadhiwa katika tanbihi.
- source_word: מוֹשֵׁל בַּכֹּל
  choice: unatawala juu ya vyote
  rationale: Umbo la kitenzi linaonyesha utawala unaoendelea, na “juu ya vyote” huhifadhi upana wa כֹּל bila kuufanya uhusu watu pekee.
- source_word: בְיָדְךָ
  choice: mkononi mwako
  rationale: Huhifadhi sitiari halisi ya mkono kama mahali pa mamlaka, uwezo, na udhibiti.
- source_word: כֹּחַ
  choice: nguvu
  rationale: Hueleza uwezo au nguvu iliyo kwa Mungu na ni tafsiri ya moja kwa moja katika Kiswahili.
- source_word: גְבוּרָה
  choice: uweza
  rationale: Hueleza nguvu kuu au uwezo wa kutenda mambo makuu. “Uweza” hutofautisha neno hili kwa kiasi fulani na כֹּחַ bila kufuta ukaribu wa maana zao.
- source_word: לְגַדֵּל
  choice: kuwafanya ... kuwa wakuu
  rationale: Huhifadhi maana ya kisababishi, “kufanya kuwa mkuu”; katika muktadha inaweza pia kumaanisha kuinua au kutukuza.
- source_word: לְחַזֵּק
  choice: kuwapa nguvu
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha maana ya kufanya imara au kutia nguvu.
- source_word: לַכֹּל
  choice: wote
  rationale: Katika kishazi hiki tendo la kuwafanya wakuu na kuwapa nguvu linaelekea kuwalenga watu, lakini “wote” linaendelea kuwa pana na halibainishi kundi fulani.
theological_decisions:
- issue: Jinsi ya kutafsiri מִלְּפָנֶיךָ kuhusu Mungu kuwa chanzo cha utajiri na heshima
  choice: hutoka kwako
  alternative: hutoka mbele zako / hutoka katika uwepo wako
  rationale: Tafsiri kuu hutumia nahau ya kawaida ya Kiswahili na kueleza wazi kwamba Mungu ndiye chanzo, huku tanbihi ikihifadhi taswira ya Kiebrania ya vitu kutoka mbele ya uso au uwepo wake.
- issue: Upana wa לַכֹּל katika tendo la kufanya wakuu na kuimarisha
  choice: wote
  alternative: vyote / kila kitu
  rationale: Muktadha wa kuwafanya wakuu na kuwapa nguvu kwa kawaida huelekeza kwa watu, lakini “wote” huepuka kutaja kundi maalumu na kuhifadhi dai pana la mamlaka ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala ya hadharani. Muundo ni wa kawaida kwa wasomaji wengi, huku sitiari ya “mkononi mwako” ikihifadhiwa. Viradidi vya Kiebrania kuhusu mkono, nguvu, na mamlaka vimedumishwa bila kuongeza msimamo wa kimadhehebu.
