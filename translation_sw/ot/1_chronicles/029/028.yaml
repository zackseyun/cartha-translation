  text: And he died in a good old age[a], full of days, riches, and honor; and Solomon his son reigned in his place.
translation:
  language: sw
  text: Naye akafa katika uzee mwema, akiwa ametosheka kwa siku nyingi[a], utajiri, na heshima; Sulemani mwanawe akatawala mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa ametosheka kwa siku”; Kiebrania kwa halisi, “ameshiba siku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Naye akafa
  rationale: Kitenzi hiki kinaendeleza mfululizo wa simulizi. “Naye akafa” ni cha kawaida katika Kiswahili na hakiongezi tafsiri isiyokuwamo.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: akiwa na uzee mwema
  rationale: Kirai hiki kinaeleza hali nzuri ya uzee alipokufa. Tafsiri hii inadumisha tathmini chanya ya Kiebrania bila kuibadili kuwa maelezo ya ziada kama “uzee mkubwa sana.”
- source_word: שְׂבַע יָמִים
  choice: ametosheka kwa siku nyingi
  rationale: Kiebrania kinatumia picha ya kushiba au kutosheka kwa siku. “Ametosheka kwa siku nyingi” ni Kiswahili kinachoeleweka na kinahifadhi wazo la maisha marefu yaliyotimia.
- source_word: עֹשֶׁר וְכָבוֹד
  choice: utajiri na heshima
  rationale: עֹשֶׁר ni mali au utajiri, na כָבוֹד katika muktadha huu wa kifalme ni hadhi au heshima. “Utajiri na heshima” ni ya kawaida na sahihi katika Kiswahili.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Mzizi מלך hapa una maana ya kuwa mfalme au kutawala. “Akatawala” hufaa katika simulizi la urithi wa ufalme na kuendeleza mtiririko wa matukio.
- source_word: שְׁלֹמֹה בְנוֹ
  choice: Sulemani mwanawe
  rationale: Mpangilio huu unafuata Kiebrania na bado ni wa kawaida katika Kiswahili.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Katika kauli za kurithi ufalme, neno hili humaanisha kuchukua nafasi ya mtawala aliyetangulia. “Mahali pake” huhifadhi maana hiyo kwa uwazi.
