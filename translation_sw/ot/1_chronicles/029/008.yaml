base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/008.yaml
  text: Whoever had precious stones gave them to the treasury of the house of Yahweh, into the care of Jehiel the Gershonite.
translation:
  language: sw
  text: Kila mtu aliyekuwa na mawe ya thamani aliyatoa kwa hazina ya nyumba ya Yahwe, chini ya usimamizi wa Yehieli Mgershoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa mkono wa Yehieli,” nahau yenye maana ya kuwa chini ya uangalizi au usimamizi wake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנִּמְצָא אִתּוֹ
  choice: Kila aliyekuwa na
  rationale: Muundo wa Kiebrania unaeleza kitu kilichopatikana katika milki ya mtu; Kiswahili cha kawaida huwasilisha maana hiyo kwa 'kila aliyekuwa na'.
- source_word: אֲבָנִים
  choice: mawe ya thamani
  rationale: Ingawa neno lenyewe ni 'mawe,' muktadha wa michango kwa hazina ya hekalu unaonyesha mawe yenye thamani, si mawe ya kawaida.
- source_word: נָתְנוּ
  choice: aliyatoa
  rationale: Kitenzi נתן hapa kinamaanisha kutoa vitu hivyo kama mchango; kiambishi '-ya-' kinarejelea mawe.
- source_word: לְאוֹצַר בֵּית יְהוָה
  choice: kwa hazina ya nyumba ya Yahwe
  rationale: Tafsiri hii huhifadhi picha ya 'nyumba' na maana ya hazina iliyohifadhi mali za ibada.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi kwa umbo la Kiswahili linalotumika kwa YHWH, badala ya kulibadilisha kuwa cheo.
- source_word: עַל יַד
  choice: yakisimamiwe na
  rationale: Nahau hiyo, neno kwa neno 'juu ya/kwa mkono wa,' hapa inaonyesha kwamba mawe yaliwekwa chini ya uangalizi au usimamizi wa Yehieli.
- source_word: יְחִיאֵל
  choice: Yehieli
  rationale: Jina limeandikwa kwa namna inayolingana na sauti za Kiebrania na mazoea ya majina ya Biblia katika Kiswahili.
- source_word: הַגֵּרְשֻׁנִּי
  choice: Mgershoni
  rationale: Neno hili linamtambulisha Yehieli kuwa mtu wa ukoo wa Gershoni; umbo la Kiswahili 'Mgershoni' ni fupi na wazi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kina jina binafsi YHWH. 'Yahwe' hulihifadhi kama jina, bila kulibadilisha kuwa cheo, na ni umbo la kawaida la Kiswahili.
- issue: Maana ya אֲבָנִים katika muktadha huu
  choice: mawe ya thamani
  alternative: mawe
  rationale: Kiebrania kinasema kwa ujumla 'mawe,' lakini katika orodha ya michango kwa nyumba ya Mungu maana inayokusudiwa ni mawe yenye thamani. Tafsiri haibainishi aina fulani ya vito.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia umoja wa kugawa ('kila aliyekuwa ... aliyatoa') na imefafanua nahau ya Kiebrania kwa lugha ya kawaida huku tanbihi ikihifadhi taswira yake halisi.
