lexical_decisions:
- source_word: וְ/דָוִיד
  choice: Naye Daudi
  rationale: Kiunganishi וְ kinaendeleza simulizi; “Naye” ni muunganisho wa kawaida wa Kiswahili unaomrejesha mhusika Daudi katika muhtasari huu.
- source_word: בֶּן יִשָׁי
  choice: mwana wa Yese
  rationale: Muundo wa hali ya kutegemeana unamaanisha moja kwa moja “mwana wa Yese” na kuhifadhi utambulisho wa ukoo.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Kitenzi cha Qal timilifu hapa kinaeleza kutenda kazi ya kifalme, si kuanza tu kuwa mfalme; “akatawala” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: עַל
  choice: '[imewasilishwa katika muundo wa kitenzi “kutawala”]'
  rationale: Katika Kiswahili, “kutawala” huchukua yambwa moja kwa moja; kutafsiri עַל kwa neno tofauti kungezalisha muundo usio wa asili.
- source_word: כָּל יִשְׂרָאֵל
  choice: Israeli yote
  rationale: כָּל huonyesha taifa lote; “Israeli yote” ni usemi mfupi na wa asili unaohifadhi upeo kamili wa utawala wa Daudi.
