  text: וְ/הַ/יָּמִ֗ים אֲשֶׁ֤ר מָלַךְ֙ עַל יִשְׂרָאֵ֔ל אַרְבָּעִ֖ים שָׁנָ֑ה בְּ/חֶבְר֤וֹן מָלַךְ֙ שֶׁ֣בַע שָׁנִ֔ים וּ/בִ/ירוּשָׁלִַ֥ם מָלַ֖ךְ שְׁלֹשִׁ֥ים וְ/שָׁלֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/027.yaml
  text: The days that he reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: sw
  text: Muda ambao alitawala juu ya Israeli ulikuwa miaka arobaini. Huko Hebroni alitawala miaka saba, na huko Yerusalemu alitawala miaka thelathini na mitatu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: Muda ambao alitawala
  rationale: Kirai cha Kiebrania kinataja jumla ya kipindi cha utawala. Kiswahili cha kawaida hutumia “muda” badala ya tafsiri ya neno kwa neno “siku,” ambayo hapa ingeweza kueleweka vibaya.
- source_word: עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: Kihusishi עַל pamoja na מָלַךְ huonyesha watu waliokuwa chini ya utawala wake. “Juu ya Israeli” kinahifadhi muundo na maana ya chanzo bila kuongeza “Israeli yote.”
- source_word: אַרְבָּעִים שָׁנָה
  choice: miaka arobaini
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kutaja idadi hiyo ya miaka.
- source_word: בְּחֶבְרוֹן
  choice: Huko Hebroni
  rationale: Kihusishi kinaonyesha mahali. “Huko” ni cha asili katika Kiswahili kwa kurejelea mji, na “Hebroni” ni umbo la jina lililozoeleka katika Kiswahili.
- source_word: מָלַךְ שֶׁבַע שָׁנִים
  choice: alitawala miaka saba
  rationale: Kurudia kitenzi kunahifadhi usambamba na mdundo wa sentensi ya Kiebrania.
- source_word: וּבִירוּשָׁלִַם
  choice: na huko Yerusalemu
  rationale: Tafsiri hii inahifadhi kiunganishi, mahali, na usambamba na Hebroni; “Yerusalemu” ni jina la kawaida katika Kiswahili.
- source_word: שְׁלֹשִׁים וְשָׁלוֹשׁ
  choice: thelathini na mitatu
  rationale: Ni namna ya kawaida ya Kiswahili ya kuunda namba 33 na inalingana moja kwa moja na sehemu mbili za namba katika Kiebrania.
