id: 1CH.29.11
reference: 1 Chronicles 29:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לְ/ךָ֣ יְ֠הוָה הַ/גְּדֻלָּ֨ה וְ/הַ/גְּבוּרָ֤ה וְ/הַ/תִּפְאֶ֨רֶת֙ וְ/הַ/נֵּ֣צַח וְ/הַ/ה֔וֹד כִּי כֹ֖ל בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֑רֶץ לְ/ךָ֤ יְהוָה֙ הַ/מַּמְלָכָ֔ה וְ/הַ/מִּתְנַשֵּׂ֖א לְ/כֹ֥ל לְ/רֹֽאשׁ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/011.yaml
  text: Yours[a], O Yahweh, are the greatness and the power and the splendor and the victory and the majesty, for everything in the heavens and on the earth is yours. Yours, O Yahweh, is the kingdom, and you are exalted as head over all.
translation:
  language: sw
  text: Ee Yahwe, ukuu na uweza na utukufu na ushindi[a] na adhama ni vyako, kwa maana vyote vilivyo mbinguni na duniani ni vyako. Ee Yahwe, ufalme ni wako, nawe umetukuka kuwa mkuu juu ya vyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “udumifu” au “ukuu usio na kifani”; neno la Kiebrania נֵצַח hapa linaweza kumaanisha ukuu unaodumu pamoja na ushindi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetafsiriwa moja kwa moja kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: לְךָ
  choice: ni vyako / ni wako / ni chako
  rationale: Kiambishi hiki kinaonyesha umilikaji. Miundo ya Kiswahili imepatanishwa na ngeli za nomino huku msisitizo unaorudiwa wa Kiebrania ukihifadhiwa.
- source_word: הַגְּדֻלָּה
  choice: ukuu
  rationale: Ni tafsiri ya moja kwa moja ya nomino inayoonyesha ukubwa au adhama.
- source_word: הַגְּבוּרָה
  choice: uweza
  rationale: Neno hili linaonyesha nguvu au uwezo; “uweza” linafaa katika sifa za kifalme na lugha ya sifa kwa Mungu.
- source_word: הַתִּפְאֶרֶת
  choice: utukufu
  rationale: Neno linaweza kumaanisha uzuri, fahari au utukufu; “utukufu” ni la asili na lenye heshima katika muktadha huu wa ibada.
- source_word: הַנֵּצַח
  choice: ushindi
  rationale: Katika orodha hii ya sifa za kifalme, “ushindi” ni maana inayofaa, ingawa neno la Kiebrania linaweza pia kudokeza udumifu au ukuu usio na kifani; utata huo umehifadhiwa katika tanbihi.
- source_word: הַהוֹד
  choice: adhama
  rationale: “Adhama” huwasilisha utukufu na heshima ya kifalme bila kurudia “utukufu” lililotumiwa kwa תִּפְאֶרֶת.
- source_word: כִּי כֹל בַּשָּׁמַיִם וּבָאָרֶץ
  choice: kwa maana vyote vilivyo mbinguni na duniani
  rationale: כִּי imetafsiriwa kama kiunganishi cha sababu, na כֹל kwa maana jumuishi ya vitu vyote.
- source_word: הַמַּמְלָכָה
  choice: ufalme
  rationale: Neno linaweza kumaanisha ufalme, mamlaka ya kifalme au utawala; “ufalme” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וְהַמִּתְנַשֵּׂא
  choice: nawe umetukuka
  rationale: Kirai cha Kiebrania kinaonyesha kuinuliwa au kuwa juu. “Umetukuka” huepuka dhana isiyokusudiwa kwamba mtu mwingine ndiye aliyemwinua Mungu.
- source_word: לְכֹל לְרֹאשׁ
  choice: kuwa mkuu juu ya vyote
  rationale: ראש hapa ina maana ya kichwa kwa sitiari, yaani mkuu au mwenye cheo cha juu. Kiswahili cha kawaida huwasilisha maana hiyo kwa “mkuu juu ya vyote.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya נֵצַח katika orodha ya sifa
  choice: ushindi
  alternative: udumifu au ukuu usio na kifani
  rationale: “Ushindi” unafaa katika mfululizo wa sifa za kifalme, lakini upeo wa maana ya Kiebrania unaweza kujumuisha kudumu na kuwa juu; tanbihi inahifadhi uwezekano huo.
- issue: Maana ya וְהַמִּתְנַשֵּׂא
  choice: nawe umetukuka
  alternative: nawe unajiinua
  rationale: Umbo la Kiebrania linaweza kuonekana kama la kujirejelea, lakini katika sifa hii humweleza Yahwe kuwa aliye juu kuliko wote. Tafsiri iliyochaguliwa huhifadhi ukuu huo bila kuleta hisia ya kujikweza kwa kiburi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima unaofaa sala ya sifa. Mpangilio wa sifa na urudiaji wa umilikaji umehifadhiwa, huku miundo mizito isiyo ya kawaida katika Kiswahili ikirahisishwa bila kuondoa maana.
