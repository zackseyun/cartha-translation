  text: וַ/יְבָ֤רֶךְ דָּוִיד֙ אֶת יְהוָ֔ה לְ/עֵינֵ֖י כָּל הַ/קָּהָ֑ל וַ/יֹּ֣אמֶר דָּוִ֗יד בָּר֨וּךְ אַתָּ֤ה יְהוָה֙ אֱלֹהֵי֙ יִשְׂרָאֵ֣ל אָבִ֔י/נוּ מֵ/עוֹלָ֖ם וְ/עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/010.yaml
  text: Then David blessed Yahweh in the sight of all the assembly[a], and David said, “Blessed are you, Yahweh, the God of Israel our father, from everlasting to everlasting.”
translation:
  language: sw
  text: Ndipo Daudi akambariki Yahwe machoni pa kusanyiko lote. Daudi akasema, “Umebarikiwa wewe, Yahwe, Mungu wa Israeli baba yetu[a], tangu milele hata milele.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu wa Israeli, Baba yetu,” ikiwa “Baba yetu” inaeleweka kuwa mwito wa moja kwa moja kwa Mungu badala ya kumrejelea Israeli/Yakobo.
    reason: Usomaji mbadala wa uhusiano wa kisintaksia wa אָבִינוּ.
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: akambariki
  rationale: Kitenzi ברך katika piel, Mungu akiwa ndiye mtendewa, kina maana ya kutamka baraka au sifa kwake. ‘Akambariki’ huhifadhi uhusiano wa kileksika na בָּרוּךְ inayofuata na uzito wa kiliturujia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa na cheo kama ‘BWANA’.
- source_word: לְעֵינֵי
  choice: machoni pa
  rationale: Huhifadhi picha halisi ya ‘machoni pa’ pamoja na maana ya tendo kufanywa hadharani mbele ya waliokusanyika.
- source_word: כָּל הַקָּהָל
  choice: kusanyiko lote
  rationale: קהל ni jumuiya iliyokusanyika; ‘kusanyiko lote’ ni Kiswahili cha sasa, wazi na kinachofaa mazingira rasmi.
- source_word: בָּרוּךְ אַתָּה
  choice: Ubarikiwe wewe
  rationale: Huhifadhi usemi wa moja kwa moja wa baraka na msisitizo wa kiwakilishi אַתָּה, huku ukiendelea kuwa usemi wa heshima wa Kiswahili.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo huu wa umilikaji.
- source_word: אָבִינוּ
  choice: baba yetu
  rationale: Huhifadhi maana ya msingi na kiambishi cha nafsi ya kwanza wingi. Katika matini kuu imeunganishwa na ‘Israeli’ bila koma ili kuonyesha usomaji unaomwona Israeli/Yakobo kuwa baba yetu, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: tangu milele hata milele
  rationale: Ni usemi wa Kiswahili wenye hadhi unaoeleza muda usio na mpaka na kuhifadhi muundo wa chanzo.
theological_decisions:
- issue: Kirejelewa cha ‘baba yetu’ katika kirai ‘Mungu wa Israeli baba yetu’
  choice: ‘baba yetu’ inamrejelea Israeli/Yakobo
  alternative: ‘Baba yetu’ inaweza kuwa mwito wa moja kwa moja kwa Mungu
  rationale: Mpangilio wa Kiebrania unaweza kusomwa אָבִינוּ ikiwa katika uhusiano wa ufafanuzi na ‘Israeli.’ Matini kuu inafuata usomaji huo bila kufuta uwezekano wa kisintaksia na kiteolojia unaotolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya ibada lakini kinachoeleweka kwa msomaji wa kawaida. ‘Machoni pa’ huhifadhi taswira ya Kiebrania; ‘tangu milele hata milele’ hudumisha toni ya sifa. Alama ya tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja.
