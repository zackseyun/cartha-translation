id: 1CH.29.17
reference: 1 Chronicles 29:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/יָדַ֣עְתִּי אֱלֹהַ֔/י כִּ֤י אַתָּה֙ בֹּחֵ֣ן לֵבָ֔ב וּ/מֵישָׁרִ֖ים תִּרְצֶ֑ה אֲנִ֗י בְּ/יֹ֤שֶׁר לְבָבִ/י֙ הִתְנַדַּ֣בְתִּי כָל אֵ֔לֶּה וְ/עַתָּ֗ה עַמְּ/ךָ֙ הַ/נִּמְצְאוּ פֹ֔ה רָאִ֥יתִי בְ/שִׂמְחָ֖ה לְ/הִֽתְנַדֶּב לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/017.yaml
  text: And I know[a], my God, that you test the heart and take pleasure in uprightness. I, in the uprightness of my heart, have willingly offered all these things[b], and now I have seen your people who are present here willingly offer to you with joy.
translation:
  language: sw
  text: Nami najua, Mungu wangu, kwamba wewe huuchunguza moyo na hupendezwa na unyofu. Mimi, kwa unyofu wa moyo wangu, nimetoa kwa hiari vitu hivi vyote; na sasa nimewaona kwa furaha watu wako waliopo hapa wakikupa kwa hiari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּחֵן לֵבָב
  choice: huuchunguza moyo
  rationale: Kitenzi בּחן kina maana ya kuchunguza au kupima ili kutambua hali halisi. “Huuchunguza moyo” ni Kiswahili cha kawaida na kinahifadhi maana ya kutathmini utu wa ndani.
- source_word: וּמֵישָׁרִים תִּרְצֶה
  choice: na kupendezwa na unyofu
  rationale: מֵישָׁרִים huonyesha unyofu au uadilifu, na רצה hapa huonyesha kupendezwa au kukubali. Tafsiri hii inadumisha hali ya maadili pamoja na kibali cha Mungu.
- source_word: בְּיֹשֶׁר לְבָבִי
  choice: kwa unyofu wa moyo wangu
  rationale: Kirai hiki kinaeleza namna na nia ya Daudi katika kutoa. Muundo huu unafuata Kiebrania kwa karibu na bado unasomeka kwa kawaida.
- source_word: הִתְנַדַּבְתִּי
  choice: nimetoa kwa hiari
  rationale: Hitpaeli ya נדב inaonyesha kutoa kwa utashi bila kulazimishwa. “Kutoa kwa hiari” inafaa muktadha wa matoleo.
- source_word: כָל אֵלֶּה
  choice: vitu hivi vyote
  rationale: Kiwakilishi hiki kinaelekea kurejelea zawadi au mali zilizotajwa kabla. “Vitu hivi vyote” huweka rejeo wazi bila kulifafanua kupita kiasi.
- source_word: עַמְּךָ הַנִּמְצְאוּ פֹה
  choice: watu wako waliopo hapa
  rationale: Nifali ya מצא inaweza kumaanisha ‘kupatikana,’ lakini hapa ni nahau ya kuwapo. “Waliopo hapa” ni ya asili na wazi katika Kiswahili.
- source_word: רָאִיתִי בְשִׂמְחָה
  choice: nimewaona kwa furaha
  rationale: Kirai בְשִׂמְחָה kinaeleza furaha ya Daudi alipowaona. Tafsiri inadumisha uhusiano huo wa kisarufi badala ya kuifanya furaha kuwa ya watu pekee.
- source_word: לְהִתְנַדֶּב לָךְ
  choice: wakikupa kwa hiari
  rationale: Kitenzi hiki tena kinaonyesha utoaji wa hiari. “Wakikupa kwa hiari” ni cha asili katika Kiswahili na kinaonyesha wazi kuwa Mungu ndiye mpokeaji.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya mwito wenye umilikaji.
theological_decisions:
- issue: Maana ya kiantropolojia ya לֵבָב
  choice: moyo kama utu wa ndani, fikira na nia
  alternative: akili; utu wa ndani
  rationale: Katika mtazamo wa Kiebrania, moyo unahusisha fikira, nia na maamuzi. “Moyo” huhifadhi sitiari ya maandiko bila kuipunguza kuwa hisia au akili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘unyofu’ na ‘kwa hiari’ yamehifadhiwa ili kuonyesha ulinganifu wa msamiati katika Kiebrania. Hakuna tanbihi iliyohitajika kwa kuwa mbadala za kileksika zinaweza kuwakilishwa wazi katika matini bila kuleta utata muhimu.
