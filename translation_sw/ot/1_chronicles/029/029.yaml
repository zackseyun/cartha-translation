  text: וְ/דִבְרֵי֙ דָּוִ֣יד הַ/מֶּ֔לֶךְ הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחרֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֗ים עַל דִּבְרֵי֙ שְׁמוּאֵ֣ל הָ/רֹאֶ֔ה וְ/עַל דִּבְרֵי֙ נָתָ֣ן הַ/נָּבִ֔יא וְ/עַל דִּבְרֵ֖י גָּ֥ד הַ/חֹזֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/029.yaml
  text: The acts of David the king[a], the former and the latter, are written in the records of Samuel the seer, and in the records of Nathan the prophet[c][b], and in the records of Gad the seer.
translation:
  language: sw
  text: Matendo ya Mfalme Daudi[a], ya kwanza na ya mwisho, yameandikwa katika kumbukumbu[b] za Samweli mwonaji, za Nathani nabii, na za Gadi mwonaji[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mambo ya Mfalme Daudi, ya kwanza na ya mwisho.” Neno la Kiebrania linaweza kumaanisha maneno, mambo, matukio au matendo; hapa linahusu yaliyotokea katika maisha na utawala wake.
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu zaidi Kiebrania ni “yameandikwa juu ya maneno ya Samweli … Nathani … Gadi.” Hapa “kumbukumbu” inaonyesha kwamba vinatajwa vyanzo vya maandishi.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinatumia vyeo viwili tofauti kwa Samweli (רֹאֶה, ro’eh) na Gadi (חֹזֶה, hozeh). Vyote vimetafsiriwa “mwonaji”; cha pili pia kingeweza kutafsiriwa “mwenye maono.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי דָּוִיד
  choice: Matendo ya Daudi
  rationale: Katika muundo huu, דִּבְרֵי haimaanishi tu ‘maneno,’ bali mambo au matukio ya utawala wa Daudi. ‘Matendo’ ni Kiswahili cha kawaida na chenye heshima kwa muhtasari wa maisha na utawala wa mfalme.
- source_word: הָרִאשֹׁנִים וְהָאֲחרֹנִים
  choice: ya kwanza na ya mwisho
  rationale: Tafsiri hii inafuata kwa karibu jozi ya Kiebrania huku ikidokeza kipindi chote cha utawala wa Daudi bila kukifanya kifungu kuwa kirefu.
- source_word: הִנָּם כְּתוּבִים
  choice: yameandikwa
  rationale: Kiswahili hakihitaji kuongeza ‘tazama’ ili kutoa kauli hii kwa kawaida; umbo la kitenzi linawasilisha wazi kwamba habari hizo zinapatikana kwa maandishi.
- source_word: עַל דִּבְרֵי
  choice: katika kumbukumbu
  rationale: Ingawa kwa karibu ni ‘juu ya maneno/mambo ya,’ muktadha unaonyesha vyanzo vya maandishi. ‘Katika kumbukumbu’ ni usemi wa asili wa Kiswahili bila kubainisha kupita kiasi aina ya maandishi hayo.
- source_word: הָרֹאֶה
  choice: mwonaji
  rationale: Hili ni jina la cheo cha kinabii linalotokana na kitenzi cha kuona; ‘mwonaji’ hulitofautisha na ‘nabii’ wa Nathani.
- source_word: הַנָּבִיא
  choice: nabii
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa נָבִיא.
- source_word: הַחֹזֶה
  choice: mwonaji
  rationale: Neno hili pia ni cheo cha kinabii kinachohusiana na kuona maono. ‘Mwonaji’ ni tafsiri ya kawaida, huku tofauti yake na רֹאֶה ikielezwa katika tanbihi.
theological_decisions:
- issue: Tofauti kati ya vyeo רֹאֶה na חֹזֶה
  choice: Vyote vimetafsiriwa ‘mwonaji’ katika matini kuu.
  alternative: Kutafsiri רֹאֶה kuwa ‘mwonaji’ na חֹזֶה kuwa ‘mwenye maono.’
  rationale: Kiebrania kinatumia maneno mawili tofauti, lakini yote ni vyeo vya kinabii vinavyohusiana na kuona. Kutumia ‘mwonaji’ mara zote mbili ni kwa kawaida zaidi katika Kiswahili; tanbihi inahifadhi tofauti ya kileksia bila kuipa uzito wa kimafundisho usio wazi katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Marudio ya ‘katika kumbukumbu’ yamepunguzwa baada ya kutajwa mara ya kwanza, kwa kuwa ‘za’ huunganisha vyanzo vitatu kwa uwazi bila kupoteza maana.
