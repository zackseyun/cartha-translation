  text: וַ/יִּֽתְנַדְּבוּ֩ שָׂרֵ֨י הָ/אָב֜וֹת וְ/שָׂרֵ֣י שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וְ/שָׂרֵ֤י הָ/אֲלָפִים֙ וְ/הַ/מֵּא֔וֹת וּ/לְ/שָׂרֵ֖י מְלֶ֥אכֶת הַ/מֶּֽלֶךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/006.yaml
  text: Then the leaders of the fathers’ houses[a], and the leaders of the tribes of Israel, and the commanders of the thousands and of the hundreds, and the overseers of the king’s work[c][b], gave willingly.
translation:
  language: sw
  text: Ndipo viongozi wa jamaa za ukoo,[a] viongozi wa makabila ya Israeli, wakuu wa maelfu na mamia,[b] na wasimamizi wa kazi ya mfalme wakatoa kwa hiari.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, migawanyiko ya kifamilia iliyotokana na mababu au koo.
    reason: cultural_note
  - marker: b
    text: “Maelfu na mamia” ni vitengo vya kijeshi au vya kiutawala vilivyoongozwa na wakuu hawa.
    reason: cultural_note
  - marker: c
    text: Au “wakatoa matoleo kwa hiari” au “wakajitolea.” Kitenzi cha Kiebrania kinakazia mwitikio wa hiari; hapa muktadha unaonyesha hasa kutoa mchango kwa hiari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְנַדְּבוּ
  choice: wakatoa kwa hiari
  rationale: Kitenzi katika hitpaeli ya נדב kinaonyesha tendo la hiari. Katika muktadha wa michango ya ujenzi, kinamaanisha kutoa mali kwa hiari, si kujitolea kufanya huduma tu.
- source_word: שָׂרֵי הָאָבוֹת
  choice: viongozi wa jamaa za ukoo
  rationale: Kirai hiki kinataja viongozi wa migawanyiko ya kifamilia iliyotokana na mababu. ‘Jamaa za ukoo’ ni ya asili katika Kiswahili na huhifadhi wazo la muundo wa kifamilia wa mababu.
- source_word: שָׂרֵי שִׁבְטֵי יִשְׂרָאֵל
  choice: viongozi wa makabila ya Israeli
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya viongozi wa vitengo vya kikabila vya Israeli.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: makamanda wa vikosi vya maelfu na mamia
  rationale: ‘Maelfu’ na ‘mamia’ yanaashiria vitengo vya kijeshi au kiutawala. Kutaja ‘vikosi’ kunafanya maana ya viongozi hao iwe wazi kwa msomaji wa sasa.
- source_word: וּלְשָׂרֵי מְלֶאכֶת הַמֶּלֶךְ
  choice: na wasimamizi wa kazi ya mfalme
  rationale: ל pamoja na שׂרי inaendeleza orodha ya maafisa. ‘Wasimamizi’ inafaa kwa wenye wajibu juu ya shughuli au kazi ya mfalme, huku ‘kazi’ ikiacha upeo wa מְלָאכָה kuwa mpana.
