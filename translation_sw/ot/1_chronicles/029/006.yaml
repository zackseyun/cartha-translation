  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa orodha ya Kiebrania umehifadhiwa, huku maana ya vitengo vya ‘maelfu na mamia’ ikifafanuliwa kwa neno ‘vikosi’.
