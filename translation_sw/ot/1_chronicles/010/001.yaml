lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Wafilisti
  rationale: Jina la taifa limetafsiriwa kwa umbo la kawaida la Kiswahili. Kiunganishi ו־ kimewakilishwa na mfuatano wa vitenzi vya kisimulizi, bila kuongeza neno la wakati lisilokuwapo katika chanzo.
- source_word: נִלְחֲמוּ בְיִשְׂרָאֵל
  choice: wakapigana na Israeli
  rationale: Kitenzi Niphal cha לחם pamoja na ב־ kinaeleza kupigana dhidi ya upande mwingine. Katika Kiswahili, “kupigana na” ni usemi wa kawaida na muktadha wa vita unaonyesha wazi uhasama.
- source_word: וַיָּנָס אִישׁ יִשְׂרָאֵל
  choice: wanaume wa Israeli wakawakimbia
  rationale: אִישׁ ni umoja wa kisarufi lakini hapa linatumika kwa maana ya mkusanyo. “Wanaume wa Israeli” linahifadhi marejeo ya kiume ya jeshi, huku “wakawakimbia” likieleza kukimbia ili kuwaepuka adui.
- source_word: מִפְּנֵי פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Katika muundo “wakawakimbia Wafilisti,” maana ya nahau ya Kiebrania “kutoka mbele/uweponi mwa Wafilisti” imewasilishwa kwa Kiswahili cha kawaida bila tafsiri halisi ambayo ingeweza kueleweka vibaya.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: wakaanguka wakiwa wameuawa
  rationale: Muungano huu ni usemi wa kivita unaomaanisha kuanguka kama waliouawa, si kuanguka tu. Tafsiri hii inahifadhi hali ya kuuawa iliyo katika חֲלָלִים.
- source_word: בְּהַר גִּלְבֹּעַ
  choice: juu ya Mlima Gilboa
  rationale: “Mlima Gilboa” ni umbo la kawaida la jina la mahali, na “juu ya” linafaa kwa eneo la mapigano lililokuwa mlimani.
