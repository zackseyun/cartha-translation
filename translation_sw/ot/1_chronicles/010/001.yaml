  text: The Philistines fought against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: sw
  text: Wafilisti wakapigana dhidi ya Israeli, nao wanaume wa Israeli[a] wakawakimbia Wafilisti; wakaanguka wameuawa katika Mlima Gilboa.
  philosophy: optimal-equivalence
  footnotes:
