  text: וַ/יֹּ֣אמֶר שָׁאוּל֩ אֶל נֹשֵׂ֨א כֵלָ֜י/ו שְׁלֹ֥ף חַרְבְּ/ךָ֣ וְ/דָקְרֵ֣/נִי בָ֗/הּ פֶּן יָבֹ֜אוּ הָ/עֲרֵלִ֤ים הָ/אֵ֨לֶּה֙ וְ/הִתְעַלְּלוּ בִ֔/י וְ/לֹ֤א אָבָה֙ נֹשֵׂ֣א כֵלָ֔י/ו כִּ֥י יָרֵ֖א מְאֹ֑ד וַ/יִּקַּ֤ח שָׁאוּל֙ אֶת הַ/חֶ֔רֶב וַ/יִּפֹּ֖ל עָלֶֽי/הָ־׀־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and mistreat me.” But his armor-bearer was not willing, because he was very afraid[c][b]. So Saul took the sword and fell on it.
translation:
  language: sw
  text: Ndipo Sauli akamwambia mbeba silaha zake, “Vuta upanga wako, unichome nao, wasije watu hawa wasiotahiriwa wakaja kunifanyia mabaya.” Lakini mbeba silaha zake hakutaka, kwa sababu aliogopa sana. Basi Sauli akauchukua upanga, akaangukia upanga huo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: mchukua silaha zake
  rationale: Kirai hiki humaanisha mtu aliyebeba vifaa au silaha za Sauli; tafsiri hii ni ya kawaida, wazi, na inafaa muktadha wa kijeshi.
- source_word: שְׁלֹף
  choice: Futa
  rationale: Katika muktadha wa upanga, kitenzi hiki humaanisha kuutoa upanga alani mwake; “futa upanga” ni usemi wa kawaida wa Kiswahili.
- source_word: וְדָקְרֵנִי בָהּ
  choice: unichome nao
  rationale: דקר humaanisha kuchoma au kutoboa kwa silaha. “Unichome nao” huonyesha kitendo kilichokusudiwa bila kuongeza maelezo yasiyomo.
- source_word: פֶּן
  choice: wasije ... wakaja
  rationale: Muundo huu wa Kiswahili huwasilisha hofu ya jambo lisilotakiwa kutokea, sawa na maana ya פֶּן.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: watu hawa wasiotahiriwa
  rationale: Huhifadhi wazi jina la dharau la kikabila na kidini lililo katika Kiebrania bila kuingiza moja kwa moja jina “Wafilisti,” ambalo halipo katika mstari huu.
- source_word: וְהִתְעַלְּלוּ בִי
  choice: kunifanyia ukatili
  rationale: Kitenzi katika muktadha huu huonyesha kutendewa vibaya kwa namna ya kikatili na ya kufedhehesha, bila kubainisha aina kamili ya unyanyasaji.
- source_word: וְלֹא אָבָה
  choice: hakutaka
  rationale: Hutoa kwa uwazi maana ya kutokubali au kutokuwa tayari kufanya jambo hilo.
- source_word: כִּי יָרֵא מְאֹד
  choice: kwa sababu aliogopa sana
  rationale: Huhifadhi sababu iliyotajwa na kiwango cha hofu kinachoonyeshwa na מְאֹד.
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: akaangukia juu yake
  rationale: Ni tafsiri ya karibu ya usemi wa Kiebrania, huku kiwakilishi kikirejelea upanga.
theological_decisions:
- issue: Aina ya mateso ambayo Sauli alihofia
  choice: kunifanyia ukatili
  alternative: kunifanyia mzaha wa kikatili; kunitendea vibaya; kunifedhehesha
  rationale: Kiebrania kinaashiria kutendewa kwa ukatili na fedheha lakini hakielezi kwa usahihi aina ya kitendo. Chaguo hili huhifadhi uzito na upana wa maana bila kuingiza hali maalumu isiyotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “wasije ... wakaja” umetumiwa kwa tahadhari ili kuwasilisha hofu ya Sauli kwa ufasaha wa Kiswahili.
