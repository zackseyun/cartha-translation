  text: When all Jabesh-gilead heard all that the Philistines had done to Saul[b][a],
translation:
  language: sw
  text: Watu wote wa Yabeshi-gileadi waliposikia yote ambayo Wafilisti walikuwa wamemtendea Sauli[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wamemfanyia Sauli”; au, “walikuwa wametenda dhidi ya Sauli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: waliposikia
  rationale: Muundo huu unaendeleza simulizi na hapa una kazi ya wakati, ukitayarisha tendo linalofuata katika mstari unaofuata. ‘Waliposikia’ ni Kiswahili cha kawaida na huonyesha uhusiano huo bila kuongeza maana.
- source_word: כֹּל יָבֵישׁ גִּלְעָד
  choice: Watu wote wa Yabeshi-gileadi
  rationale: Kiebrania ni halisi ‘Yabeshi-gileadi yote,’ lakini jina la mahali linawakilisha wakazi wake. Kiswahili huhitaji kutaja ‘watu’ ili maana iwe ya kawaida na wazi.
- source_word: אֵת כָּל אֲשֶׁר
  choice: yote ambayo
  rationale: Huwakilisha kwa ufupi jumla ya mambo yaliyofanywa na kuhifadhi muundo wa kishazi tegemezi.
- source_word: עָשׂוּ
  choice: walikuwa wamemtendea
  rationale: Wakati timilifu unaonyesha kwamba matendo ya Wafilisti yalitangulia kusikiwa kwa habari hiyo. Kitenzi chenye kiambishi cha mtendewa kinafaa kwa mtu aliyeathiriwa.
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hili la watu.
- source_word: לְשָׁאוּל
  choice: Sauli
  rationale: Herufi ya mbele לְ inaweza kumtaja mtu aliyeathiriwa na tendo. Katika ‘wamemtendea Sauli,’ maana hiyo hutolewa kwa kawaida bila kuitilia nguvu kama ‘dhidi ya Sauli.’
