  text: וַ/יַּ֨פְשִׁיטֻ֔/הוּ וַ/יִּשְׂא֥וּ אֶת רֹאשׁ֖/וֹ וְ/אֶת כֵּלָ֑י/ו וַ/יְשַׁלְּח֨וּ בְ/אֶֽרֶץ פְלִשְׁתִּ֜ים סָבִ֗יב לְ/בַשֵּׂ֛ר אֶת עֲצַבֵּי/הֶ֖ם וְ/אֶת הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/009.yaml
  text: They stripped him[a], took his head and his weapons, and sent word throughout the land of the Philistines to proclaim the news to their idols and to the people.
translation:
  language: sw
  text: Wakamvua[a], wakachukua kichwa chake na silaha zake, kisha wakapeleka habari kotekote katika nchi ya Wafilisti ili kutangaza habari hizo kwa sanamu zao na kwa watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakimvua mavazi yake ya kivita.” Kiebrania kinaweza kumaanisha kumvua mavazi au vifaa vya vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשִׁיטֻהוּ
  choice: Wakamvua mavazi
  rationale: Kitenzi פשט katika mnyambuliko huu humaanisha kumvua mtu mavazi au vifaa vya vita. Kiebrania hakitaji wazi silaha au mavazi ya kivita hapa, hivyo tafsiri hii inaeleza kitendo kwa Kiswahili cha kawaida bila kukifanya kiwe mahususi kupita chanzo.
- source_word: וַיִּשְׂאוּ אֶת רֹאשׁוֹ
  choice: wakachukua kichwa chake
  rationale: נשא inaweza kumaanisha kuinua, kubeba, au kuchukua. Katika muktadha wa nyara za vita, “wakachukua” linaonyesha kukitwaa kichwa bila kuongeza maelezo yasiyotajwa wazi katika mstari huu.
- source_word: כֵּלָיו
  choice: silaha zake
  rationale: כְּלִי ni neno pana linaloweza kumaanisha vyombo, vifaa, au silaha. Katika muktadha wa uwanja wa vita, “silaha” ndilo chaguo linaloeleweka zaidi, huku likiepuka kulibana kuwa mavazi ya kivita pekee.
- source_word: וַיְשַׁלְּחוּ
  choice: wakapeleka habari
  rationale: Kitenzi chenyewe ni “walituma,” na לְבַשֵּׂר inayofuata inaonyesha kusudi la kutangaza habari. Kiswahili “wakapeleka habari” ni cha kawaida na hakiongezi wajumbe ambao hawakutajwa wazi.
- source_word: בְאֶרֶץ פְלִשְׁתִּים סָבִיב
  choice: kotekote katika nchi ya Wafilisti
  rationale: סָבִיב hapa huonyesha kuenea pande zote katika eneo hilo; “kotekote” linawasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: לְבַשֵּׂר
  choice: ili kutangaza habari hizo
  rationale: בשר humaanisha kuleta au kutangaza habari, mara nyingi habari za ushindi. “Kutangaza habari hizo” huhifadhi maana ya tangazo la hadharani bila kuingiza maana maalumu ya kiinjili.
- source_word: עֲצַבֵּיהֶם
  choice: sanamu zao
  rationale: עֶצֶב inaweza kumaanisha sanamu ya ibada au kinyago cha mungu. “Sanamu zao” ni wazi na la kawaida katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa kulielewa kama vinyago vyao vya miungu.
- source_word: הָעָם
  choice: watu
  rationale: Kiebrania kina nomino ya umoja yenye maana ya mkusanyiko, “watu.” Muktadha unaonyesha watu wa Wafilisti, lakini kutoongeza “wao” kunafuata umbo la chanzo.
theological_decisions:
- issue: Maana ya עֲצַבֵּיהֶם katika muktadha wa ibada
  choice: sanamu zao
  alternative: vinyago vyao vya miungu
  rationale: Neno hilo hurejelea vitu vilivyotumiwa kuwakilisha miungu ya Wafilisti. “Sanamu” linadumisha tathmini hasi ya Biblia ya Kiebrania bila kuongeza msimamo wa dhehebu; tanbihi inadokeza mbadala wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi wenye kiambishi -ka- unatoa usimulizi wa asili. “Kotekote” na “wakapeleka habari” vinaeleweka kwa wasomaji wa kawaida bila kuongeza habari isiyosemwa wazi katika Kiebrania.
