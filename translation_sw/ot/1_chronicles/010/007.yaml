base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/007.yaml
  text: When all the men of Israel who were in the valley saw that they had fled and that Saul and his sons were dead[a], they abandoned their cities and fled[c][b]; then the Philistines came and lived in them.
translation:
  language: sw
  text: Wanaume wote wa Israeli[b] waliokuwa bondeni[a] walipoona kwamba walikuwa wamekimbia na kwamba Sauli na wanawe walikuwa wamekufa, waliiacha miji yao na kukimbia. Ndipo Wafilisti wakaja na kukaa humo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uwandani.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatumia neno la kiume, “wanaume wote wa Israeli.”
    reason: lexical_alternative
  - marker: c
    text: Au “wakafanya makao humo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: walipoona
  rationale: Kitenzi ראה kimsingi humaanisha kuona; muundo wa “walipoona” unaonyesha kwa kawaida kwamba matendo yaliyofuata yalitokana na walichoshuhudia.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: wanaume wote wa Israeli
  rationale: אִישׁ ni neno la kiume, na pamoja na כָּל lina maana ya kijumla ya wanaume wote wanaohusika katika eneo hilo.
- source_word: אֲשֶׁר בָּעֵמֶק
  choice: waliokuwa bondeni
  rationale: עֵמֶק kwa kawaida ni bonde, ingawa katika muktadha fulani inaweza kueleweka kuwa uwanda.
- source_word: כִּי נָסוּ
  choice: kwamba walikuwa wamekimbia
  rationale: Kauli ya Kiebrania haimtaji wazi mtendaji; tafsiri hii inadumisha kiwakilishi hicho bila kuongeza jeshi au kundi lisilotajwa.
- source_word: וְכִי מֵתוּ שָׁאוּל וּבָנָיו
  choice: na kwamba Sauli na wanawe walikuwa wamekufa
  rationale: Kauli hii inaeleza hali iliyogunduliwa baada ya kifo chao na inafuata mfuatano wa simulizi kwa Kiswahili cha kawaida.
- source_word: וַיַּעַזְבוּ עָרֵיהֶם
  choice: waliiacha miji yao
  rationale: עזב hapa ni kuacha nyuma; “waliiacha” ni ya kawaida na inaonyesha kwamba miji iliachwa wakati wakikimbia.
- source_word: וַיָּנֻסוּ
  choice: na kukimbia
  rationale: נוס ni kukimbia ili kujiokoa; usemi huu ni wazi na wa kawaida katika simulizi.
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: Ndipo Wafilisti wakaja
  rationale: “Ndipo” huonyesha mwendelezo wa matukio unaowakilishwa na waw ya kisimulizi bila kuongeza sababu mpya.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: na kukaa humo
  rationale: ישב inaweza kumaanisha kukaa, kuishi, au kufanya makao. “Kukaa humo” ni pana na inadumisha uwezekano wa makazi au umilikaji wa miji hiyo.
