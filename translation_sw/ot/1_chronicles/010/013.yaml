  text: וַ/יָּ֣מָת שָׁא֗וּל בְּ/מַֽעֲל/וֹ֙ אֲשֶׁ֣ר מָעַ֣ל בַּֽ/יהוָ֔ה עַל דְּבַ֥ר יְהוָ֖ה אֲשֶׁ֣ר לֹא שָׁמָ֑ר וְ/גַם לִ/שְׁא֥וֹל בָּ/א֖וֹב לִ/דְרֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/013.yaml
  text: So Saul died for his unfaithfulness by which he was unfaithful to Yahweh[a], because of the word of Yahweh, which he did not keep, and also because he asked counsel of a medium[b], to inquire.
translation:
  language: sw
  text: 'Basi Sauli alikufa kwa sababu ya kutokuwa mwaminifu kwake, kwa kuwa hakuwa mwaminifu kwa Yahweh: hakulishika neno la Yahweh, na pia alimwendea mwenye pepo wa uaguzi[b] kutafuta mwongozo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Mwenye pepo wa uaguzi” ni mtu ambaye watu humwendea kutafuta habari kutoka kwa wafu au kwa roho; linganisha 1 Samweli 28:7.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: Basi ... alikufa
  rationale: Waw-consecutive inaendeleza simulizi na, katika muktadha, inaonyesha matokeo; “Basi” ni ya kawaida na yenye uzito unaofaa.
- source_word: בְּמַעֲלוֹ אֲשֶׁר מָעַל
  choice: kwa sababu ya kukosa uaminifu; hakumwaminia
  rationale: Nomino na kitenzi vya mzizi mmoja מעל vinasisitiza kuvunja uaminifu wa agano. Kiswahili hakiwezi kuhifadhi uradidi huo kwa ulaini bila kuwa kizito; vifungu hivi vinahifadhi dhana hiyo.
- source_word: בַּיהוָה
  choice: Yahweh
  rationale: Kiambishi ב pamoja na מעל kinamtaja yule ambaye Sauli alikosa kuwa mwaminifu kwake; muundo wa Kiswahili “hakumwaminia Yahweh” unaonyesha uhusiano huo.
- source_word: עַל דְּבַר יְהוָה
  choice: kwa kuwa hakulishika neno la Yahweh
  rationale: עַל hapa inaeleza msingi wa hatia, na kishazi kinachofuata kinafafanua kwamba Sauli hakulishika neno hilo.
- source_word: שָׁמָר
  choice: kulishika
  rationale: “Kushika neno” ni usemi wa kibiblia unaoeleweka kwa kutii au kufuata agizo, huku ukihifadhi taswira ya kitenzi cha Kiebrania.
- source_word: וְגַם לִשְׁאוֹל בָּאוֹב
  choice: na pia alimwomba ushauri mwenye pepo wa utambuzi
  rationale: Muundo wa infinitivu unawakilishwa kwa kishazi kamili cha Kiswahili. אוֹב katika muktadha wa 1 Samweli 28 humtaja mtu anayehusishwa na kuwasiliana na roho ili kupata habari.
- source_word: לִדְרוֹשׁ
  choice: ili apate jibu
  rationale: Infinitivu hii inaonyesha kusudi la kumwendea huyo mtu—kutafuta habari au mwongozo. “Ili apate jibu” ni ya asili kwa Kiswahili na huepuka uradidi usio laini wa “kuuliza ... ili kuuliza.”
theological_decisions:
- issue: Uwasilishaji wa jina la agano יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu יהוה; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Tabia ya dhambi ya Sauli
  choice: kukosa uaminifu
  alternative: kufanya kosa; kuvunja uaminifu
  rationale: Mzizi מעל unaeleza kutokuwa mwaminifu, hasa katika uhusiano wa agano, si kosa la jumla tu.
- issue: Utambulisho wa אוֹב
  choice: mwenye pepo wa utambuzi
  alternative: mpiga ramli; mwaguzi; mtu wa kuwasiliana na wafu
  rationale: Neno lina utata wa kihistoria kati ya roho inayohusishwa na uaguzi na mtu anayeitumia. Chaguo hili linafuata matumizi ya kibiblia ya Kiswahili na tanbihi inafafanua bila kulazimisha nadharia moja ya jambo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa kwa nuktamkato ili kupunguza uradidi mzito wa mzizi מעל huku ikihifadhi uhusiano wa sababu. Jina Yahweh limehifadhiwa, na istilahi ya tendo la kiroho imefafanuliwa kwa tanbihi.
