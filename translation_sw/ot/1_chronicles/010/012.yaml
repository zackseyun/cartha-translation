  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa mfululizo wa vitenzi unahifadhi mwendo wa simulizi la Kiebrania. Alama zote za tanbihi zimewekwa katika matini; tanbihi ya mahali imeambatanishwa na kutajwa kwa Yabeshi mwishoni mwa sentensi ili kuepuka kukatiza mtiririko wa sentensi ya kwanza.
