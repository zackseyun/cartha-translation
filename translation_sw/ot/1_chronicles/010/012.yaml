base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/012.yaml
  text: Then all the valiant men arose and carried away the body of Saul and the bodies of his sons[a], and brought them to Jabesh[b]. They buried their bones under the oak in Jabesh and fasted seven days.
translation:
  language: sw
  text: Ndipo mashujaa wote wakainuka, wakaichukua maiti ya Sauli na maiti za wanawe, wakazileta Yabeshi[b]. Wakaizika mifupa yao chini ya mti mkubwa[a] huko Yabeshi, wakafunga siku saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chini ya mti wa terebinthi” au “chini ya mwaloni.” Neno la Kiebrania linaweza kutaja mti mkubwa wa aina hizo.
    reason: lexical_alternative
  - marker: b
    text: Simulizi pana linatambulisha mahali hapa kuwa Yabeshi-gileadi; katika mstari huu Kiebrania kinasema tu “Yabeshi.”
    reason: cross_reference
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: mashujaa wote
  rationale: Kirai hiki humaanisha wanaume wenye nguvu, ujasiri, au sifa za kivita. “Mashujaa wote” ni Kiswahili cha kawaida na huhifadhi maana ya ujasiri bila kulazimisha umoja wa kisarufi wa Kiebrania.
- source_word: גּוּפַת ... גּוּפֹת
  choice: maiti ya Sauli na maiti za wanawe
  rationale: Neno גּוּפָה hapa linamaanisha mwili wa mtu aliyekufa. “Maiti” linaweka wazi hali hiyo na ni la kawaida na lenye heshima katika muktadha wa mazishi.
- source_word: וַיִּשְׂאוּ
  choice: wakaichukua
  rationale: Katika muktadha huu נשא ni kuinua na kuondoa maiti kutoka mahali ilipokuwa. “Wakaichukua” ni ya asili kwa Kiswahili na inaendana na tendo la kuisafirisha hadi Yabeshi.
- source_word: וַיְבִיאוּם יָבֵישָׁה
  choice: wakazileta Yabeshi
  rationale: Kiebrania cha mstari huu kinataja Yabeshi pekee. Tafsiri haiongezi “Gileadi” katika matini, ingawa simulizi pana linaonyesha kuwa ni Yabeshi-gileadi.
- source_word: עַצְמוֹתֵיהֶם
  choice: mifupa yao
  rationale: עֶצֶם ni “mfupa” kwa maana halisi. Tafsiri inadumisha picha halisi ya Kiebrania badala ya kuirahisisha kuwa “mabaki yao.”
- source_word: תַּחַת הָאֵלָה
  choice: chini ya mti mkubwa
  rationale: אֵלָה linaweza kumaanisha mti mkubwa wa aina ya terebinthi au mwaloni. “Mti mkubwa” ni wazi kwa wasomaji wa kawaida na huepuka uhakika wa kibotania ambao neno la chanzo halitoi.
- source_word: וַיָּצֻמוּ שִׁבְעַת יָמִים
  choice: wakafunga siku saba
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya mfungo wa maombolezo uliodumu siku saba.
