base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/002.yaml
  text: And the Philistines pursued Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua, the sons of Saul.
translation:
  language: sw
  text: Wafilisti wakawafuatilia Sauli na wanawe[a], nao Wafilisti wakawapiga Yonathani, Abinadabu na Malki-shua, wana wa Sauli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawafuatilia Sauli na wanawe kwa karibu.” Kitenzi cha Kiebrania kwa maana halisi huhusisha kushikamana; hapa kinaonyesha kuwafuatia kwa nguvu bila kuwaachia katika vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ ... אַחֲרֵי
  choice: wakawafuatilia
  rationale: Kitenzi דבק kwa kawaida humaanisha kushikamana au kugandamana, lakini kikifuatwa na אַחֲרֵי katika simulizi la vita kinaonyesha kuwafuatia watu bila kuwaachia. “Wakawafuatilia” ni Kiswahili cha kawaida kinachobeba maana hiyo; uzito wa ufuatiliaji wa karibu umeelezwa katika tanbihi.
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la taifa hilo. Jina limerudiwa katika kishazi cha pili kama lilivyorudiwa katika Kiebrania.
- source_word: בָנָיו / בְּנֵי שָׁאוּל
  choice: wanawe / wana wa Sauli
  rationale: Muktadha na majina yanayofuata yanaonyesha kuwa בנים hapa ni wana wa kiume. Miundo hii ni ya kawaida na inahifadhi urejeo wa kwanza na ufafanuzi wa mwisho.
- source_word: וַיַּכּוּ
  choice: wakawaua
  rationale: נכה kimsingi ni kupiga, lakini katika muktadha huu wa vita inaeleza kuwapiga hadi kufa, kama simulizi linavyothibitisha. “Wakawaua” huwasilisha matokeo kwa Kiswahili cha kawaida bila kutumia usemi usio wazi.
- source_word: יוֹנָתָן
  choice: Yonathani
  rationale: Umbo la jina linalotambulika katika matumizi ya Biblia ya Kiswahili na linalokaribia jina la Kiebrania.
- source_word: אֲבִינָדָב
  choice: Abinadabu
  rationale: Umbo la kawaida la Kiswahili la jina hili la Kiebrania.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malki-shua
  rationale: Unukuzi unaohifadhi wazi sehemu mbili za jina la Kiebrania huku ukiendelea kusomeka kwa urahisi.
