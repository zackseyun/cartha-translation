translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. Mpangilio wa sentensi ni wa asili katika Kiswahili, huku taswira ya Kiebrania ya Sauli na wanawe kuwa “wameanguka” ikihifadhiwa.
