base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/008.yaml
  text: It happened on the next day that the Philistines came to strip the slain[b][a], and they found Saul and his sons fallen on Mount Gilboa.
translation:
  language: sw
  text: Siku iliyofuata[a], Wafilisti walikuja kuwavua waliouawa[b], wakawakuta Sauli na wanawe wakiwa wameanguka juu ya Mlima Gilboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kesho yake.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi “kuwavua” hapa kinamaanisha kuondoa vitu kama mavazi na silaha kutoka kwa waliouawa vitani.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Kesho yake
  rationale: Kirai hiki kinaonyesha siku iliyofuata baada ya matukio ya vita yaliyosimuliwa; “Kesho yake” ni Kiswahili cha kawaida na fasaha katika simulizi.
- source_word: לְפַשֵּׁט
  choice: kuwavua
  rationale: Katika muktadha huu kitenzi kinamaanisha kuvua mavazi, silaha, au vitu vingine kutoka kwa waliokufa vitani, si kupora kwa maana pana tu.
- source_word: הַחֲלָלִים
  choice: waliouawa
  rationale: Neno hili linawahusu hasa watu waliouawa vitani; “waliouawa” huhifadhi maana hiyo ya kimapigano kwa lugha inayoeleweka.
- source_word: נֹפְלִים
  choice: wakiwa wameanguka
  rationale: Huhifadhi taswira halisi ya Kiebrania ya walioanguka, huku muktadha ukionyesha kwamba walikuwa wamekufa vitani.
- source_word: בְּהַר גִּלְבֹּעַ
  choice: juu ya Mlima Gilboa
  rationale: Hii ni tafsiri ya kawaida na ya asili ya mahali palipotajwa, yaani Mlima Gilboa.
