translation:
  language: sw
  text: Mapigano yakawa makali dhidi ya Sauli; wapiga mishale wakamkuta, naye akajeruhiwa na wapiga mishale[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawa katika dhiki kuu kwa sababu ya wapiga mishale.” Kitenzi cha Kiebrania kinaweza kueleweka kuwa kinaonyesha dhiki kali badala ya jeraha la mwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד הַמִּלְחָמָה עַל שָׁאוּל
  choice: Mapigano yakawa makali dhidi ya Sauli
  rationale: Kitenzi כבד kwa msingi humaanisha kuwa kizito, lakini katika muktadha wa vita kinaonyesha mapigano kuzidi kuwa makali au kumwelemea mtu. Kiswahili hiki kinawasilisha maana ya nahau kwa lugha ya kawaida.
- source_word: וַיִּמְצָאֻהוּ
  choice: wakamkuta
  rationale: מצא humaanisha kupata au kukuta. Katika simulizi hili, “wakamkuta” ni ya asili kwa Kiswahili na inaonyesha kwamba wapiga mishale walimfikia Sauli.
- source_word: הַמּוֹרִים בַּקָּשֶׁת
  choice: wapiga mishale
  rationale: Kirai hiki kwa halisi ni “wale wanaopiga kwa upinde.” “Wapiga mishale” ni tafsiri fupi, wazi na ya kawaida.
- source_word: וַיָּחֶל
  choice: akajeruhiwa vibaya
  rationale: Kitenzi hiki kigumu kinaweza kuhusishwa na kujeruhiwa au na kupata maumivu na dhiki kali. Katika muktadha wa mashambulizi ya wapiga mishale, kujeruhiwa kunafaa mtiririko wa simulizi; “vibaya” kinaonyesha uzito unaodokezwa bila kuficha uwezekano mwingine, ambao umewekwa katika tanbihi.
- source_word: מִן הַיּוֹרִים
  choice: na wapiga mishale
  rationale: מן hapa inaonyesha chanzo au mtendaji wa jambo. Baada ya kitenzi cha kutendwa, Kiswahili hutumia kwa kawaida “na” kumtaja mtendaji.
theological_decisions:
- issue: Iwapo וַיָּחֶל inaeleza jeraha la mwili au dhiki kali
  choice: Maandishi makuu yanasema “akajeruhiwa vibaya.”
  alternative: “akapatwa na maumivu makali kwa sababu ya wapiga mishale” au “akawa na dhiki kuu kwa sababu ya wapiga mishale.”
  rationale: Muktadha wa kijeshi unaunga mkono jeraha la mwili, lakini umbo la Kiebrania linaweza kueleweka kuwa maumivu au dhiki kali. Tanbihi inadumisha utata huo wa kweli badala ya kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya kisimulizi; “mapigano yakawa makali” na “wakamkuta” vinaeleweka kwa wasomaji wa kawaida bila kupoteza mwelekeo wa maandishi ya Kiebrania.
