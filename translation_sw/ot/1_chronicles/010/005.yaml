  yaml_path: translation/ot/1_chronicles/010/005.yaml
  text: When his armor-bearer saw that Saul was dead[b][a], he too fell on the sword and died.
translation:
  language: sw
  text: Mbeba silaha wake[a] alipoona kwamba Sauli amekufa, yeye pia akauangukia upanga[b] na akafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya asili, “mbeba vyombo vyake vya vita.”
    reason: lexical_alternative
  - marker: b
    text: Kirai “kuuangukia upanga” ni nahau inayomaanisha kujiua kwa upanga.
    reason: cultural_note
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: Mbeba silaha wake
  rationale: Kirai hiki humaanisha kihalisi mtu aliyebeba silaha au vifaa vya Sauli. “Mbeba silaha wake” ni tafsiri ya kawaida na inayoeleweka ya jukumu hilo la kijeshi.
- source_word: כִּי
  choice: kwamba
  rationale: 'Hapa neno hili linaanzisha jambo aliloliona mbeba silaha: kwamba Sauli alikuwa amekufa.'
- source_word: מֵת
  choice: amekufa
  rationale: Hueleza hali ya Sauli wakati mbeba silaha alipomwona. Kauli “amekufa” ni ya asili katika Kiswahili na inafaa katika mfuatano huu wa simulizi.
- source_word: וַיִּפֹּל
  choice: akauangukia
  rationale: Kitenzi cha Kiebrania kwa kawaida humaanisha “kuanguka.” Muundo huu unadumisha taswira ya asili huku muktadha ukionyesha kuwa alijiua.
- source_word: גַּם הוּא
  choice: yeye pia
  rationale: Hudumisha msisitizo kwamba mbeba silaha alimfuata Sauli katika tendo lililosababisha kifo.
- source_word: עַל הַחֶרֶב
  choice: upanga
  rationale: Kiebrania husema kihalisi “juu ya ule upanga.” Kiswahili “akauangukia upanga” hudumisha nahau hiyo bila kuongeza kwamba ulikuwa upanga wake mwenyewe.
- source_word: וַיָּמֹת
  choice: na akafa
  rationale: Tafsiri ya moja kwa moja hudumisha mfuatano mfupi wa matukio na kuthibitisha matokeo ya tendo hilo.
