base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/010.yaml
  text: They put his armor in the house of their gods[b][a], and they fastened his skull in the house of Dagon.
translation:
  language: sw
  text: Wakaweka vifaa vyake vya vita katika nyumba ya miungu yao[a], na wakafunga fuvu lake[b] katika nyumba ya Dagoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika hekalu la miungu yao.” Kiebrania husema kihalisi “nyumba,” neno ambalo pia hutumiwa kwa hekalu la miungu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kichwa chake.” Neno la Kiebrania linaweza kurejelea fuvu au kichwa, lakini “fuvu” ndilo lenye maana mahususi zaidi hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Wakaweka
  rationale: Kitenzi שׂים humaanisha kuweka; ‘wakaweka’ ni cha kawaida na kinafuata mfuatano wa simulizi.
- source_word: כֵּלָיו
  choice: vifaa vyake vya vita
  rationale: כְּלִי inaweza kumaanisha vyombo, vifaa, silaha, au zana. Katika muktadha wa kifo vitani, ‘vifaa vya vita’ huhifadhi upana wake bila kuibana kuwa silaha pekee au vazi la kujikinga pekee.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: katika nyumba ya miungu yao
  rationale: בַּיִת maana yake ya msingi ni ‘nyumba,’ lakini katika muktadha huu ni mahali pa ibada; tafsiri ya moja kwa moja imehifadhiwa huku tanbihi ikifafanua matumizi hayo.
- source_word: גֻּלְגָּלְתּוֹ
  choice: fuvu lake
  rationale: גֻּלְגֹּלֶת hutaja fuvu, na wakati mwingine kichwa; ‘fuvu’ ndilo neno mahususi zaidi katika muktadha huu.
- source_word: תָקְעוּ
  choice: wakafunga
  rationale: תקע inaweza kumaanisha kuchomeka, kukaza, au kufunga kitu mahali. ‘Wakafunga’ huonyesha kuwa fuvu liliwekwa kwa uthabiti ili lionyeshwe bila kuongeza wazo lisilo hakika la kulichoma kwa mti.
- source_word: בֵּית דָּגוֹן
  choice: katika nyumba ya Dagoni
  rationale: ‘Nyumba’ huhifadhi בַּיִת, na Dagoni ni jina la mungu linalotoholewa kwa kawaida katika Kiswahili.
theological_decisions: []
