base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/006.yaml
  text: So Saul died[a], and his three sons, and all his house died together.
translation:
  language: sw
  text: Basi Sauli, wanawe watatu, na nyumba yake yote[a] wakafa pamoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa nyumbani mwake,” “familia yake yote,” au “ukoo wake wote.” Kiebrania kinasema “nyumba yake yote”; hapa neno hilo linaweza kurejelea watu wa nyumbani, familia, au ukoo/nasaba, wala si jengo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Basi ... akafa
  rationale: Kitenzi cha kisimulizi kinaendeleza matukio na kueleza matokeo ya yaliyotangulia. “Basi” ni kiunganishi cha kawaida cha Kiswahili katika muktadha huu, na “akafa” huhifadhi maana rahisi ya kitenzi.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: pamoja na wanawe watatu
  rationale: Kirai kinamaanisha wana watatu wa Sauli waliotajwa katika muktadha. “Pamoja na” huonyesha kwa ufasaha kwamba nao walikufa katika tukio lilelile.
- source_word: וְכָל בֵּיתוֹ
  choice: na nyumba yake yote
  rationale: “Nyumba” huhifadhi taswira na upana wa neno la Kiebrania בַּיִת, ambalo hapa linaweza kumaanisha watu wa nyumbani, familia, au ukoo, wala si jengo.
- source_word: יַחְדָּו
  choice: pamoja
  rationale: Kielezi hiki kinaonyesha kwamba wote waliotajwa walikufa kwa pamoja katika tukio hilo.
- source_word: מֵתוּ
  choice: wote wakafa
  rationale: Kitenzi cha wingi kimerudiwa katika Kiebrania. Kiswahili kinahitaji kiima cha wazi zaidi; “wote wakafa” huhifadhi marudio na msisitizo wa jumla bila kudai kwamba kila ndugu wa Sauli alikufa.
theological_decisions:
- issue: Upeo wa maana ya “nyumba yake yote”
  choice: Kudumisha “nyumba yake yote” katika matini kuu na kufafanua uwezekano wake katika tanbihi.
  alternative: watu wote wa nyumbani mwake; familia yake yote; ukoo wake wote
  rationale: Neno la Kiebrania lina maana pana, na muktadha haupaswi kufinywa kuwa dai kwamba kila mtu wa ukoo mpana wa Sauli alikufa. Tafsiri ya moja kwa moja pamoja na tanbihi huhifadhi utata huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa kisimulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi umefanywa wa kawaida katika Kiswahili huku marudio ya kitenzi cha kufa na utata wa “nyumba” vikihifadhiwa.
