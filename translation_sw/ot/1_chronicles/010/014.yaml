  text: וְ/לֹֽא דָרַ֥שׁ בַּֽ/יהוָ֖ה וַ/יְמִיתֵ֑/הוּ וַ/יַּסֵּב֙ אֶת הַ/מְּלוּכָ֔ה לְ/דָוִ֖יד בֶּן יִשָֽׁי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/014.yaml
  text: He did not seek Yahweh[b][a], so he put him to death and turned the kingdom over to David son of Jesse.
translation:
  language: sw
  text: Wala hakumtafuta Yahwe[a]; basi Yahwe akamwua na kumkabidhi Daudi mwana wa Yese ufalme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakumwuliza Yahwe” au “hakutafuta shauri la Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mamlaka ya kifalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דָרַשׁ בַּיהוָה
  choice: hakumtafuta Yahwe
  rationale: Kitenzi דָרַשׁ pamoja na ב na jina la Mungu kinaweza kumaanisha kumtafuta, kumwuliza au kutafuta shauri lake. “Kumtafuta Yahwe” ni Kiswahili cha kawaida kinachodumisha maana pana ya kumgeukia Mungu, huku dokezo likifafanua maana ya kuomba mwongozo katika muktadha huu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo kama “BWANA,” ili kudumisha jina binafsi lililo katika Kiebrania.
- source_word: וַיְמִיתֵהוּ
  choice: Yahwe akamwua
  rationale: Hifili ya מות inaonyesha usababishaji wa kifo. “Akamwua” ni usemi wa kawaida na wa moja kwa moja wa Kiswahili unaodumisha uwakala wa Yahwe bila kuupunguza kuwa ruhusa tu.
- source_word: וַיַּסֵּב אֶת הַמְּלוּכָה לְדָוִיד
  choice: kumkabidhi Daudi ... ufalme
  rationale: Hifili ya סבב hapa inaonyesha kuhamisha au kuelekeza utawala kwa mtu mwingine. “Kumkabidhi ... ufalme” ni Kiswahili cha asili kinachoonyesha ufalme kuondolewa kwa Sauli na kuwekwa mikononi mwa Daudi.
- source_word: הַמְּלוּכָה
  choice: ufalme
  rationale: מְלוּכָה linaweza kumaanisha ufalme, utawala wa kifalme au mamlaka ya mfalme. “Ufalme” ni neno fupi na la kawaida, huku tanbihi ikihifadhi maana mbadala.
- source_word: לְדָוִיד בֶּן־יִשַׁי
  choice: Daudi mwana wa Yese
  rationale: Huu ni uwasilishaji wa kawaida na wa heshima wa jina la ukoo la Kiebrania katika Kiswahili.
theological_decisions:
- issue: Uwakala katika kifo cha Sauli
  choice: Mstari unamtaja Yahwe kuwa aliyemwua Sauli.
  alternative: Yahwe aliruhusu tu Sauli afe bila kusababisha kifo chake moja kwa moja.
  rationale: Mfuatano wa vitenzi na Hifili וַיְמִיתֵהוּ unamhusisha Yahwe moja kwa moja na kifo hicho. Tafsiri hailegezi dai hili kuwa ruhusa tu, wala haiongezi maelezo kuhusu visababishi vya pili ambayo hayamo katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wala” huunganisha mstari na mashtaka yaliyotangulia; “basi” huonyesha matokeo bila kufafanua zaidi uhusiano wa kisababishi. Jina “Yahwe” limedumishwa kama jina binafsi.
