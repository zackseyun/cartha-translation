  text: The fourth[a], to Izri, his sons and his brothers, twelve.
translation:
  language: sw
  text: Ya nne[a], kwa Izri; wanawe na ndugu zake walikuwa kumi na wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi kulingana na muktadha, “Kura ya nne ilimwangukia Izri.” Neno “kura” linaeleweka kutokana na orodha inayozunguka mstari huu, lakini halikutajwa katika mstari wenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְבִיעִי
  choice: Wa nne
  rationale: Namba ya mpangilio imetumika kwa ufupi katika orodha hii. Kiswahili kinaweza kuhifadhi mtindo huo; neno “kura” linaeleweka kutokana na muktadha lakini halimo wazi katika mstari huu.
- source_word: לַיִּצְרִי
  choice: kwa Izri
  rationale: Kiambishi ל־ kinaonyesha ugawaji; “kwa Izri” ni usemi wa asili katika Kiswahili kwa sehemu iliyomwangukia au aliyopangiwa.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania linamaanisha hasa wana wa kiume; “wanawe” huhifadhi maana hiyo kwa lugha fupi na ya kawaida.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: אֶחָיו humaanisha moja kwa moja ndugu zake wa kiume, ingawa katika orodha hii huenda ikajumuisha jamaa wa karibu; “ndugu zake” ndiyo tafsiri ya kawaida isiyoongeza ufafanuzi usiotajwa.
- source_word: שְׁנֵים עָשָׂר
  choice: kumi na wawili
  rationale: Idadi hii ni jumla ya watu wa kundi. Umbo la ngeli ya watu, “wawili,” linaonyesha kwa kawaida kwamba wanaohesabiwa ni watu.
