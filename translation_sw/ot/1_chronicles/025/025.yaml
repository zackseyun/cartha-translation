  text: 'Kwa wa kumi na nane[a]: Hanani; wanawe na ndugu zake, kumi na wawili.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa uhalisi, “Kwa wa kumi na nane, kwa Hanani; wanawe na ndugu zake, kumi na wawili.” Neno “kura” au “zamu” halijatajwa hapa, lakini linaeleweka kutokana na mpangilio unaorudiwa katika sura hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמוֹנָה עָשָׂר
  choice: Kwa zamu ya kumi na nane
  rationale: Kiambishi ל־ kinaonyesha mgao. Katika muktadha wa kura na makundi katika sura hii, “zamu” huifanya sentensi iwe ya asili kwa Kiswahili bila kutaja wazi “kura,” neno ambalo halipo katika mstari huu.
- source_word: לַחֲנָנִי
  choice: Hanani
  rationale: Jina la mtu limetoholewa kwa namna inayolingana na matumizi ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Huhifadhi maana mahususi ya Kiebrania ya wana wa kiume na muundo wa kifamilia wa orodha.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: Neno “ndugu” ni tafsiri ya kawaida na ya asili ya אחים katika Kiswahili; katika muktadha huu linarejelea ndugu wa kiume au washiriki wa ukoo bila kulazimisha ufafanuzi usiotolewa na mstari.
- source_word: שְׁנֵים עָשָׂר
  choice: walikuwa kumi na wawili
  rationale: Idadi hii ni jumla ya wanawe na ndugu zake. Kitenzi “walikuwa” kinaongezwa kwa ulaini wa Kiswahili, huku “wawili” ikikubaliana na watu.
