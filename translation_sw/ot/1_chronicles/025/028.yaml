lexical_decisions:
- source_word: לְ/אֶחָד וְ/עֶשְׂרִים
  choice: ya ishirini na moja
  rationale: Katika mfululizo huu, kihusishi לְ kinaonyesha mgawo wa nafasi katika kura. Kiswahili cha kawaida hutaja nafasi hiyo kwa ‘ya ishirini na moja’; neno ‘kura’ linaeleweka kutokana na muktadha lakini halijaongezwa katika matini.
- source_word: לְ/הוֹתִיר
  choice: kwa Hothiri
  rationale: הוֹתִיר ni jina la mtu. Kihusishi לְ kimetafsiriwa ‘kwa’ ili kuonyesha aliyepangiwa nafasi hiyo bila kupoteza muundo mfupi wa orodha.
- source_word: בָּנָי/ו
  choice: wanawe
  rationale: בנים hapa humaanisha wana wa kiume katika orodha hii; ‘wanawe’ ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: וְ/אֶחָי/ו
  choice: na ndugu zake
  rationale: אחים kimsingi ni ndugu wa kiume, lakini neno la kawaida la Kiswahili ‘ndugu’ linaweza kuwa lisilobainisha jinsia. Muktadha wa kikundi hiki unabaki wazi bila kulipanua kuwa jamaa au washirika.
- source_word: שְׁנֵים עָשָׂר
  choice: kumi na wawili
  rationale: Idadi hii ni jumla ya wanawe na ndugu zake. Kiainishi cha ngeli ya watu ‘wawili’ kinapatana na kundi la watu, na mtindo mfupi wa orodha umehifadhiwa bila kuongeza kitenzi.
