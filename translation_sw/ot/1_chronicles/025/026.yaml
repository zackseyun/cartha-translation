  text: Kwa zamu ya kumi na tisa[a], Maloti; wanawe na ndugu zake, kumi na wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kwa wa kumi na tisa.” Katika muundo unaorudiwa katika sura hii, maana yake ni zamu au kura ya kumi na tisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/תִשְׁעָה עָשָׂר
  choice: kwa wa kumi na tisa
  rationale: Katika orodha hii, namba ya mpangilio inaonyesha zamu au kura ya kumi na tisa. Kihusishi לְ kimetafsiriwa kwa ‘kwa’ ili kuhifadhi muundo wa kifungu cha Kiebrania.
- source_word: לְ/מַלּוֹתִי
  choice: Maloti
  rationale: Hili ni jina la mtu; limetoholewa kwa tahajia ya kawaida na iliyo wazi katika Kiswahili.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania linamaanisha hasa wana wa kiume; ‘wanawe’ huhifadhi maana hiyo na linafaa katika orodha hii.
- source_word: וְ/אֶחָיו
  choice: na ndugu zake
  rationale: אֶחָיו kimsingi humaanisha ndugu zake wa kiume, ingawa katika orodha ya kikundi linaweza pia kuwahusu jamaa wa karibu. Kiswahili ‘ndugu zake’ huhifadhi upana huo wa kiasili bila kulazimisha ufafanuzi.
- source_word: שְׁנֵים עָשָׂר
  choice: kumi na wawili
  rationale: Ni idadi ya watu katika kikundi, hivyo imetafsiriwa kwa namba ya kawaida inayopatana na watu.
