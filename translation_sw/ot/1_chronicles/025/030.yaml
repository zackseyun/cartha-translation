translation_notes:
  register: Lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Muundo wa kifungu kifupi cha orodha umehifadhiwa, huku “zamu” na “jumla yao” vikiongezwa kwa uwazi wa asili wa Kiswahili kulingana na muktadha wa kugawa huduma kwa kura.
