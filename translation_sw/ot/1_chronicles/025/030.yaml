translation:
  language: sw
  text: Kura ya ishirini na tatu ilimwangukia Mahaziothi; wanawe na ndugu zake walikuwa kumi na wawili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/שְׁלֹשָׁה וְ/עֶשְׂרִים
  choice: kwa ajili ya zamu ya ishirini na tatu
  rationale: Katika muktadha wa orodha ya kura katika sura hii, kiambishi לְ kinaonyesha mgao, na usemi wa namba unafanya kazi kama namba ya mpangilio. Kutaja “zamu” kwa uwazi kunaleta maana ya muktadha kwa Kiswahili cha kawaida.
- source_word: לְ/מַחֲזִיאוֹת
  choice: Mahaziothi
  rationale: Ni jina la mtu, kwa hiyo limetoholewa badala ya kutafsiriwa; umbo “Mahaziothi” linafuata matamshi yanayofaa kwa Kiswahili huku likihifadhi muundo wa jina la Kiebrania.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania linamaanisha hasa wana wa kiume; “wanawe” ni tafsiri fupi na ya kawaida katika orodha hii.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: Katika Kiswahili sanifu, “ndugu zake” ni njia ya kawaida ya kutaja ndugu zake wa kiume katika muktadha huu, bila kutumia lugha ya kizamani.
- source_word: שְׁנֵים עָשָׂר
  choice: jumla yao kumi na wawili
  rationale: Namba hii ni jumla ya wanawe na ndugu zake. “Kumi na wawili” hupatana na watu, na “jumla yao” huweka wazi kazi ya namba katika sentensi.
