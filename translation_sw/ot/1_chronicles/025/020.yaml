base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/020.yaml
  text: The thirteenth[a], Shubael; his sons and his brothers, twelve.
translation:
  language: sw
  text: Wa kumi na tatu[a], Shubaeli; wanawe na ndugu zake, kumi na wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “Kwa wa kumi na tatu, Shubaeli.” Neno “kura” linaeleweka kutokana na muktadha wa mistari inayozunguka.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹשָׁה עָשָׂר
  choice: Wa kumi na tatu
  rationale: Kiambishi ל־ kinaonyesha nafasi au mgawo katika orodha. Kiswahili cha orodha hutumia kwa kawaida “wa kumi na tatu”; neno “kura” linaeleweka kutokana na muktadha lakini halipo wazi katika mstari huu.
- source_word: שׁוּבָאֵל
  choice: Shubaeli
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likihifadhi umbo la jina la Kiebrania.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania linamaanisha wana wa kiume, si watoto kwa ujumla; “wanawe” ni tafsiri sahihi na ya kawaida.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: אָח inaweza kumaanisha ndugu wa kiume na, kwa upana katika mazingira haya, watu wa ukoo au kundi lake. Kiswahili “ndugu zake” huhifadhi upana huo bila kulazimisha maana finyu.
- source_word: שְׁנֵים עָשָׂר
  choice: kumi na wawili
  rationale: Idadi hii inatoa jumla ya wana na ndugu waliohusishwa na Shubaeli. Umbo la kuhesabu watu limetumiwa.
