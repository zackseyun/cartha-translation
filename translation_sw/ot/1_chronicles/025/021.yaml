translation:
  language: sw
  text: Wa kumi na nne alikuwa Matithia[a]; wanawe na ndugu zake walikuwa kumi na wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, “Kwa wa kumi na nne, Matithia.” Katika muktadha wa orodha hii, namba hiyo inahusu kura au zamu ya kumi na nne.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבָּעָה עָשָׂר
  choice: Wa kumi na nne
  rationale: Katika orodha hii, לְ ikifuatwa na namba hutambulisha zamu au kura ya mpangilio. Kiswahili cha kawaida hutumia ‘wa kumi na nne’; neno ‘kura’ halijaandikwa wazi katika mstari huu.
- source_word: מַתִּתְיָהוּ
  choice: Matithia
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likifuata umbo la Kiebrania.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania linamaanisha hasa wana wa kiume, si watoto kwa ujumla.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: Katika Kiswahili, ‘ndugu zake’ ni usemi wa kawaida kwa wanaume wa familia au kundi lake; muktadha ndio unaobainisha maana ya ndugu wa kiume.
- source_word: שְׁנֵים עָשָׂר
  choice: walikuwa kumi na wawili
  rationale: Hii inaeleza jumla ya wana na ndugu waliokuwa pamoja na Matithia. Kitenzi na ngeli ya watu vimeongezwa ili sentensi iwe wazi na ya kawaida kwa Kiswahili.
