lexical_decisions:
- source_word: לְאַרְבָּעָה וְעֶשְׂרִים
  choice: Kwa wa ishirini na nne
  rationale: Kiambishi לְ kinaonyesha mgao, na katika muktadha huu namba hiyo ina maana ya mpangilio. Neno “kura” au “kikundi” linaeleweka kutokana na muktadha lakini halipo wazi katika mstari huu, kwa hiyo halijaongezwa katika matini.
- source_word: לְרוֹמַמְתִּי עָזֶר
  choice: Romamti-Ezeri
  rationale: Ni jina la mtu; limetoholewa kwa tahajia inayosomeka kwa Kiswahili badala ya kutafsiriwa maana yake.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania linamaanisha hasa wana wake wa kiume katika orodha hii.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: Neno lina maana ya ndugu zake wa kiume, ingawa katika muktadha wa kikundi linaweza pia kuwa na maana pana ya jamaa au washirika. Kiswahili “ndugu zake” huhifadhi upana huo kwa kawaida.
- source_word: שְׁנֵים עָשָׂר
  choice: jumla yao kumi na wawili
  rationale: Namba hii inaonyesha jumla ya watu wa kundi lililotajwa; “jumla yao” huweka wazi kazi yake katika sentensi ya orodha bila kubadili idadi.
