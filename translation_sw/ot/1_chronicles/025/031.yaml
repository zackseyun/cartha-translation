translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa orodha ulio mfupi na wenye heshima. Muundo wa asili umehifadhiwa kadiri unavyoweza kueleweka, huku “jumla yao” ikisaidia kuonyesha kwamba kumi na wawili ndiyo idadi ya kundi.
