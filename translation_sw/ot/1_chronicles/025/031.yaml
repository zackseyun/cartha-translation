translation:
  language: sw
  text: 'Kwa wa ishirini na nne[a]: Romamti-Ezeri, wanawe na ndugu zake, kumi na wawili.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kwa wa ishirini na nne”; katika sehemu hii yote, usemi huu unarejelea kura au mgawo wa ishirini na nne.
