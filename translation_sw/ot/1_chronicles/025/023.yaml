  text: Wa kumi na sita alikuwa Hananiahu[a], pamoja na wanawe na ndugu zake; jumla yao walikuwa kumi na wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa maelezo yaliyo wazi zaidi kulingana na muktadha: “Kura ya kumi na sita ilikuwa ya Hananiahu.” Neno “kura” linaeleweka kutokana na mistari inayozunguka, lakini halikutajwa katika Kiebrania cha mstari huu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשִׁשָּׁה עָשָׂר
  choice: Wa kumi na sita alikuwa
  rationale: Kiambishi לְ pamoja na namba ya mpangilio huonyesha nafasi ya mgawo katika mfululizo. Kiswahili kimetumia muundo wa kawaida wa kutaja aliyepata nafasi hiyo bila kuongeza neno “kura,” ambalo halipo wazi katika mstari huu.
- source_word: לַחֲנַנְיָהוּ
  choice: Hananiahu
  rationale: Jina limenukuliwa kwa namna inayokaribia umbo la Kiebrania חֲנַנְיָהוּ na inayoweza kutamkwa kwa kawaida katika Kiswahili.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno בָּנִים hapa linamaanisha wana wa kiume katika orodha hii, si watoto kwa ujumla.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: אָח kwa msingi humaanisha ndugu wa kiume, ingawa katika orodha kama hii inaweza pia kuwahusu jamaa wa karibu au washirika. “Ndugu zake” ni la kawaida na huhifadhi upana huo kwa Kiswahili.
- source_word: שְׁנֵים עָשָׂר
  choice: walikuwa kumi na wawili
  rationale: Namba ya mwisho inaonyesha jumla ya watu wa kundi lililotajwa. Kitenzi “walikuwa” kimeongezwa ili sentensi iwe ya kawaida na wazi katika Kiswahili, huku “wawili” ikionyesha kuwa wanaohesabiwa ni watu.
theological_decisions:
- issue: Ikiwa neno “kura” litatajwa wazi katika matini kuu
  choice: Halijaongezwa katika matini kuu; limeelezwa katika tanbihi.
  alternative: “Kura ya kumi na sita ilikuwa ya Hananiahu...”
  rationale: Muktadha unaonyesha ugawaji kwa kura, lakini neno lenyewe halipo katika Kiebrania cha mstari huu. Uamuzi huu unahifadhi ufupi wa chanzo bila kuficha maana ya muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo mfupi wa orodha umehifadhiwa, huku alama ya nukta mkato na kitenzi kilichoongezwa vikifanya jumla ya kundi ieleweke kwa kawaida.
