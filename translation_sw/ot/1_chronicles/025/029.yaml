translation:
  language: sw
  text: 'Kura ya ishirini na mbili[a] ilimwangukia Gidalti, wanawe na ndugu zake; jumla yao: kumi na wawili.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Kwa kura ya ishirini na mbili: Gidalti, wanawe na ndugu zake, kumi na wawili.” Mtindo wa orodha wa Kiebrania umefupishwa, na neno “kura” linaeleweka kutokana na muktadha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁנַיִם וְעֶשְׂרִים
  choice: Kura ya ishirini na mbili
  rationale: Katika orodha hii, kirai hiki hutaja kura kwa mpangilio. Neno “kura” halijaandikwa katika mstari huu, lakini linaeleweka kutokana na muktadha wa 1 Mambo ya Nyakati 25:8–31.
- source_word: לְגִדַּלְתִּי
  choice: ilimwangukia Gidalti
  rationale: Kiambishi ל־ kinaonyesha kwamba nafasi hiyo iligawiwa kwa Gidalti; usemi “kura ... ilimwangukia” ni Kiswahili cha kawaida katika muktadha wa kupiga kura.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania linamaanisha wana wa kiume, si watoto kwa ujumla.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: “Ndugu” ni tafsiri ya kawaida ya אחים katika Kiswahili; katika muktadha huu inarejelea wanaume wa kundi lake, ingawa Kiebrania linaweza pia kutumiwa kwa jamaa au washirika.
- source_word: שְׁנֵים עָשָׂר
  choice: jumla yao walikuwa kumi na wawili
  rationale: Nambari ya mwisho inaonyesha jumla ya watu katika kundi. Kitenzi na “jumla yao” vimeongezwa kwa uwazi wa Kiswahili bila kubadili maana.
