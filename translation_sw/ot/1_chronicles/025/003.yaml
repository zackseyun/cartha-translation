base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/003.yaml
  text: 'Of Jeduthun: the sons of Jeduthun—Gedaliah, Zeri, Jeshaiah, Hashabiah, and Mattithiah, six—under the direction of their father Jeduthun, who prophesied with the lyre in giving thanks and praise to Yahweh.'
translation:
  language: sw
  text: 'Wa Yeduthuni: wana wa Yeduthuni—Gedalia, Seri, Yeshaya, Hashabia na Matithia—wana sita[a], chini ya uongozi wa baba yao Yeduthuni, aliyetabiri kwa kinubi, akitoa shukrani na sifa kwa BWANA.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Matini ya Kiebrania inataja majina matano hapa, lakini kisha inasema “sita.” Baadhi ya wafafanuzi hudhani kwamba jina la mwana mwingine liliachwa katika orodha, au kwamba Yeduthuni mwenyewe amehesabiwa.
    reason: textual_variant
  - marker: b
    text: Au, “aliyetabiri kwa kinubi kwa ajili ya shukrani na sifa kwa BWANA.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִידוּתוּן
  choice: Kwa Yeduthuni
  rationale: Kiambishi לְ kinaanzisha sehemu inayomhusu Yeduthuni katika orodha hii; “Kwa Yeduthuni” ni kichwa kifupi na cha kawaida katika Kiswahili.
- source_word: בְּנֵי יְדוּת֡וּן
  choice: wana wa Yeduthuni
  rationale: Inadumisha lugha ya uhusiano wa kifamilia; katika muktadha inaweza pia kuwahusu wazao au watu wa nyumba yake waliokuwa katika zamu ya muziki.
- source_word: גְּדַלְיָהוּ וּצְרִי וִישַׁעְיָהוּ חֲשַׁבְיָהוּ וּמַתִּתְיָהוּ
  choice: Gedalia, Seri, Yeshaya, Hashabia na Matithia
  rationale: Majina yameandikwa kwa maumbo yanayotamkika kwa kawaida katika Kiswahili huku yakifuata majina ya Kiebrania.
- source_word: שִׁשָּׁה
  choice: wana sita
  rationale: Namba sita iliyomo wazi katika Kiebrania imedumishwa, ingawa majina matano tu yametajwa; tofauti hiyo haijasawazishwa kimya kimya.
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: chini ya uongozi wa baba yao
  rationale: Nahau ya Kiebrania, kihalisi “kwa mikono ya baba yao,” inaonyesha usimamizi au uongozi katika mpangilio huu wa huduma ya muziki.
- source_word: בַּכִּנּוֹר
  choice: kwa kinubi
  rationale: כִּנּוֹר ni ala ya nyuzi inayolingana zaidi na kinubi; “kwa” huonyesha kwamba ala hiyo ilitumika katika kitendo cha kutabiri.
- source_word: הַנִּבָּא
  choice: aliyetabiri
  rationale: Kitenzi cha kawaida cha unabii kimedumishwa badala ya kupunguzwa kuwa uimbaji au upigaji wa muziki wenye msukumo.
- source_word: עַל הֹדוֹת וְהַלֵּל
  choice: huku akimshukuru na kumsifu
  rationale: Tafsiri hii ya asili inaonyesha tendo au maudhui ya unabii wa muziki, huku tanbihi ikihifadhi uwezekano wa maana ya kusudi.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi יהוה limetolewa kama jina maalumu “Yahwe,” si kama cheo.
theological_decisions:
- issue: Maana ya “kutabiri” kwa muziki katika ibada ya Hekalu
  choice: aliyetabiri kwa kinubi
  alternative: aliyepiga muziki kwa uvuvio; aliyeimba kiunabii
  rationale: Mwandishi wa Mambo ya Nyakati anatumia wazi msamiati wa unabii kuhusu wanamuziki wa Hekalu. “Alitabiri” huhifadhi mvutano huo wa kiteolojia, na kutajwa kwa kinubi, shukrani na sifa hufafanua mazingira yake bila kuubadili unabii kuwa burudani tu.
- issue: Kutolingana kwa majina matano na jumla ya sita
  choice: Kudumisha “wana sita” na kueleza tatizo katika tanbihi
  alternative: Kubadili kuwa watano au kumhesabu Yeduthuni waziwazi katika matini
  rationale: Matini ya Kiebrania ina majina matano lakini inasema sita. Tafsiri haipaswi kusahihisha au kutatua kimya kimya hali ambayo chanzo chenyewe kimeiacha wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha na ukinzani wa ndani wa matini umehifadhiwa; istilahi ya unabii haijafafanuliwa kupita kiasi.
