translation:
  language: sw
  text: 'Ya kumi na tano[a]: kwa Yeremothi[b], wanawe na ndugu zake, kumi na wawili.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “Ya kumi na tano, kwa Yeremothi.” Neno “kura” linaeleweka kutokana na mtindo unaorudiwa katika sura hii, lakini halikutajwa hapa katika Kiebrania.
    reason: cross_reference
  - marker: b
    text: Au, “kwa ajili ya Yeremothi.” Kihusishi cha Kiebrania kinaweza kuonyesha mtu aliyepangiwa sehemu katika orodha hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֲמִשָּׁה עָשָׂר
  choice: Kwa ajili ya wa kumi na tano
  rationale: Kirai hiki kina maana ya namba ya mpangilio katika orodha ya ugawaji kwa kura. Kiswahili kinatumia “wa kumi na tano”; “kura” inaeleweka kutokana na muktadha lakini haikutajwa katika Kiebrania, hivyo haijaongezwa katika matini kuu.
- source_word: לִירֵמוֹת
  choice: Yeremothi
  rationale: Jina limetoholewa kwa tahajia inayosomeka kiasili kwa Kiswahili. Kihusishi ל kinaonyesha aliyepewa mgao; maana hiyo tayari imewasilishwa na “Kwa ajili ya” mwanzoni, huku tanbihi ikihifadhi uwezekano wa kuhusisha kihusishi hicho moja kwa moja na jina.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania linamaanisha hasa wana wa kiume; “wanawe” ni tafsiri fupi na ya moja kwa moja.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: Neno linaweza kumaanisha ndugu wa kiume na, katika mazingira ya ukoo au kikundi, jamaa wa karibu. “Ndugu zake” ni la kawaida na lenye uwazi wa kutosha katika Kiswahili bila kuamua zaidi ya matini.
- source_word: שְׁנֵים עָשָׂר
  choice: jumla yao kumi na wawili
  rationale: Hii ni idadi ya watu wanaohusishwa na Yeremothi. “Jumla yao” hufanya sentensi ya orodha ieleweke kwa Kiswahili bila kubadili hesabu.
