translation:
  language: sw
  text: Kura ya kumi na mbili[a] ilimwangukia Hashabia, pamoja na wanawe na ndugu zake—jumla yao watu kumi na wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale kumi na wawili,” kwa tafsiri ya kihalisi zaidi; muktadha unaonyesha “ya kumi na mbili,” kwa kuwa sura hii huorodhesha kura kwa mfululizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: ya kumi na mbili
  rationale: Ingawa umbo la Kiebrania kwa kawaida hutaja idadi kumi na mbili, katika orodha hii linaonyesha nafasi ya kura inayofuata katika mfululizo; Kiswahili cha kawaida hutumia ‘ya kumi na mbili’.
- source_word: לַחֲשַׁבְיָה
  choice: ilimwangukia Hashabia
  rationale: Kiambishi ל־ kinaonyesha mtu aliyepewa kura. Kauli ‘kura ... ilimwangukia’ ni ya asili katika Kiswahili na huweka wazi mgawo bila kuongeza maana mpya.
- source_word: חֲשַׁבְיָה
  choice: Hashabia
  rationale: Jina limetoholewa kwa tahajia inayofaa matamshi ya Kiswahili.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno בנים hapa linamaanisha wana wa kiume katika orodha ya wahudumu; ‘wanawe’ ni fupi, sahihi, na la kawaida.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: אחים kimsingi humaanisha ndugu wa kiume, lakini ‘ndugu zake’ ni usemi wa kawaida wa Kiswahili katika orodha hii na hauwalazimishi wasomaji kuelewa uhusiano kwa upana zaidi ya maandishi.
- source_word: שְׁנֵים עָשָׂר
  choice: jumla yao watu kumi na wawili
  rationale: Namba ya mwisho inaonyesha ukubwa wa kundi lililopewa zamu. Kuongeza ‘jumla yao watu’ hufanya maana hiyo iwe wazi katika Kiswahili bila kubadili hesabu.
