translation_notes:
  register: Lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo umewekwa kama sentensi kamili kwa sababu mstari wa Kiebrania ni kipashio kifupi cha orodha; kistari kirefu hutenganisha mgawo na jumla ya watu.
