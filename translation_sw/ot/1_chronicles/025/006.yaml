base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/006.yaml
  text: 'All these were under the direction of their father in the music of the house of Yahweh[a], with cymbals, harps, and lyres, for the service of the house of God, under the direction of the king: Asaph, Jeduthun[c][b], and Heman.'
translation:
  language: sw
  text: Hawa wote walikuwa chini ya uongozi wa baba yao katika muziki[a] wa nyumba ya Yahwe, wakitumia matoazi, vinubi na zeze[b] kwa ajili ya huduma ya nyumba ya Mungu, chini ya uongozi wa mfalme—Asafu, Yeduthuni na Hemani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika wimbo” au “katika uimbaji.”
    reason: lexical_alternative
  - marker: b
    text: Utambulisho kamili wa ala za kale zinazotafsiriwa hapa “vinubi” na “zeze” haujulikani kwa uhakika.
    reason: cultural_note
lexical_decisions:
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: chini ya uongozi wa baba yao
  rationale: Nahau ya Kiebrania, kwa herufi ‘chini ya mkono wa baba yao,’ hapa inaonyesha usimamizi au uongozi katika huduma ya muziki.
- source_word: בַּשִּׁיר
  choice: katika uimbaji
  rationale: Neno שִׁיר linaweza kumaanisha wimbo au tendo la kuimba; ‘uimbaji’ linafaa kwa muktadha huu wa huduma ya waimbaji na ala, huku uwezekano wa ‘muziki’ ukibainishwa katika tanbihi.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: ‘Nyumba’ hudumisha picha ya Kiebrania na ni tamko linaloeleweka kwa hekalu; jina la agano יְהוָה limetoholewa kuwa ‘Yahwe.’
- source_word: בִּמְצִלְתַּיִם
  choice: wakitumia matoazi
  rationale: Kihusishi kinaonyesha ala iliyotumiwa; מְצִלְתַּיִם ni matoazi ya muziki wa ibada.
- source_word: נְבָלִים וְכִנֹּרוֹת
  choice: vinubi na zeze
  rationale: Majina tofauti yanadumishwa ili kutochanganya ala hizi mbili za kale, ingawa ulinganifu wake kamili na ala za kisasa hauna uhakika.
- source_word: לַעֲבֹדַת בֵּית הָאֱלֹהִים
  choice: kwa ajili ya huduma ya nyumba ya Mungu
  rationale: עֲבֹדָה hapa ni kazi au huduma ya ibada; ‘huduma’ ni ya kawaida na haiingizi istilahi ya dhehebu.
- source_word: עַל יְדֵי הַמֶּלֶךְ
  choice: chini ya uongozi wa mfalme
  rationale: Nahau ileile inaonyesha usimamizi au mamlaka ya mfalme juu ya mpangilio wa huduma.
- source_word: אָסָף וִידוּתוּן וְהֵימָן
  choice: Asafu, Yeduthuni na Hemani
  rationale: Majina yametoholewa kwa maumbo yaliyo ya kawaida na yanayotamkika kiasili katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina maalumu la Mungu, Tetragramatoni; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Muundo wa kishazi cha mwisho עַל יְדֵי הַמֶּלֶךְ אָסָף וִידוּתוּן וְהֵימָן
  choice: Asafu, Yeduthuni na Hemani walikuwa chini ya uongozi wa mfalme
  alternative: chini ya uongozi wa mfalme, Asafu, Yeduthuni na Hemani
  rationale: Mpangilio wa Kiebrania ni mgumu na unaweza kuacha uhusiano wa majina hayo na kishazi kilichotangulia ukiwa na utata. Uundaji huu unawachukulia hawa watatu kuwa chini ya mamlaka ya mfalme, bila kuwafanya wao wenyewe kuwa wafalme au kuunganisha majina isivyo kawaida.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa ili kishazi cha mwisho kisomeke kwa kawaida. ‘Matoazi,’ ‘vinubi,’ na ‘zeze’ ni istilahi zinazoeleweka, huku tanbihi ikihifadhi kutokuwa na uhakika kuhusu utambulisho wa ala za kale.
