  text: 'Kwa kura ya ishirini[a]: Eliatha, wanawe na ndugu zake, jumla yao watu kumi na wawili.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kwa ishirini.” Neno “kura” halijaandikwa wazi hapa, lakini linadokezwa na muundo unaorudiwa katika sura hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/עֶשְׂרִים
  choice: Kwa zamu ya ishirini
  rationale: Katika orodha hii, kiambishi לְ kinaonyesha mgao, na עֶשְׂרִים hutaja nafasi ya ishirini katika mfuatano. Neno “zamu” linawekwa wazi kwa sababu linadokezwa na muundo unaorudiwa katika sura nzima.
- source_word: לֶ/אֱלִיָּתָה
  choice: Eliatha
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa Kiswahili. Kiambishi לֶ kinaeleweka ndani ya fomula ya mgao iliyoelezwa kwa “Kwa zamu ya ishirini.”
- source_word: בָּנָי/ו
  choice: wanawe
  rationale: Nomino בנים pamoja na kiambishi cha nafsi ya tatu umoja wa kiume humaanisha wana wake wa kiume; “wanawe” huhifadhi maana hiyo kwa lugha ya kawaida na yenye hadhi.
- source_word: וְ/אֶחָי/ו
  choice: na ndugu zake
  rationale: אחים inaweza kumaanisha ndugu wa kiume au jamaa wa karibu. “Ndugu zake” ni ya asili katika Kiswahili na haiipanui maana kuliko lazima.
- source_word: שְׁנֵים עָשָׂר
  choice: watu kumi na wawili
  rationale: Namba hiyo ni jumla ya kundi lote. Kuongeza “watu” hufanya Kiswahili kiwe wazi na kuruhusu upatanisho wa kawaida wa namba kwa watu bila kubadili idadi.
