  yaml_path: translation/ot/1_chronicles/025/010.yaml
  text: The third was Zaccur[a], his sons and his brothers, twelve.
translation:
  language: sw
  text: Wa tatu alikuwa Zakuri[a], wanawe na ndugu zake, jumla yao kumi na wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kulingana na muktadha, “Kura ya tatu ilimwangukia Zakuri; wanawe na ndugu zake walikuwa kumi na wawili.” Neno “kura” linaeleweka kutokana na mistari inayozunguka, ingawa halijarudiwa hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁלִשִׁי
  choice: Wa tatu
  rationale: Namba ya mpangilio yenye kibainishi inatumika kama alama ya nafasi katika mfululizo wa kura au vikundi; “wa tatu” ni ya kawaida katika Kiswahili, huku wazo la “kura” likieleweka kutokana na muktadha.
- source_word: זַכּוּר
  choice: Zakuri
  rationale: Jina la mtu limetoholewa kwa mwandiko unaosomeka kwa kawaida katika Kiswahili.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Ni wingi wa kiume wenye kiambishi cha nafsi ya tatu umoja, hivyo humaanisha moja kwa moja “wanawe,” si neno pana zaidi “watoto wake.”
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: Neno hilo humaanisha moja kwa moja ndugu zake wa kiume; katika Kiswahili “ndugu zake” ni tamko la kawaida, na muktadha wa kundi hili huhifadhi maana inayokusudiwa bila kutumia lugha nzito.
- source_word: שְׁנֵים עָשָׂר
  choice: jumla yao kumi na wawili
  rationale: Namba hii inaonyesha jumla ya watu katika kundi. Kirai “jumla yao” kinafanya sentensi ya Kiswahili iwe wazi na ya kawaida bila kubadili hesabu ya chanzo.
