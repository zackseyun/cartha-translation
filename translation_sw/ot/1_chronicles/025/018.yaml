translation:
  language: sw
  text: Kura ya kumi na mbili ikamwangukia Azareli[a], wanawe na ndugu zake, watu kumi na wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, Azareeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר
  choice: Kura ya kumi na mbili
  rationale: Katika muktadha wa orodha ya kura, namba hii inaonyesha nafasi ya kumi na mbili. Neno “kura” limewekwa wazi kutokana na muktadha ili Kiswahili kiwe cha kawaida na kinachoeleweka.
- source_word: עֲזַרְאֵל
  choice: Azareli
  rationale: Jina la mtu limetoholewa kwa namna inayofaa muundo wa majina katika Kiswahili badala ya kutafsiriwa maana yake.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania linamaanisha hasa wana wa kiume; “wanawe” linadumisha maana hiyo kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: “Ndugu zake” ni tafsiri ya asili ya Kiswahili kwa ndugu wa kiume katika muktadha huu, bila kulazimisha maana pana ya jamaa au washirika.
- source_word: שְׁנֵים עָשָׂר
  choice: walikuwa kumi na wawili
  rationale: Namba ya mwisho ni jumla ya watu wa kundi la Azareli. Kitenzi “walikuwa” kinatamka kwa kawaida sentensi iliyodokezwa katika muundo mfupi wa Kiebrania.
