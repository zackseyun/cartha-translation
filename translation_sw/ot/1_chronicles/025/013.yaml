  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo mfupi wa orodha ya Kiebrania umehifadhiwa; alama ya nusu koloni hutenganisha jina la mkuu wa kundi na maelezo ya kundi lake.
