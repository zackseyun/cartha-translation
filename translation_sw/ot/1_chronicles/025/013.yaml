  text: wa sita[a], Bukia; wanawe wa kiume na ndugu zake wa kiume, kumi na wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kuweka wazi zaidi maana ya muktadha, “kura ya sita ilimwangukia Bukia, wanawe wa kiume na ndugu zake wa kiume, kumi na wawili.” Orodha ya Kiebrania inaacha maneno “kura ilimwangukia” yaeleweke kutokana na mistari inayozunguka.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: wa sita
  rationale: Namba ya mpangilio yenye kibainishi imetumiwa kwa ufupisho katika orodha hii. Kiswahili ‘wa sita’ huhifadhi mtindo huo mfupi, huku ‘kura’ ikieleweka kutokana na muktadha.
- source_word: בֻקִּיָּהוּ
  choice: Bukia
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania linamaanisha wana wa kiume; ‘wanawe’ ni tafsiri fupi na ya moja kwa moja inayofaa orodha hii.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: ‘Ndugu zake’ ni Kiswahili cha kawaida kwa ndugu wa kiume au watu wa ukoo wa karibu, bila kulazimisha maana finyu kuliko muktadha unavyoruhusu.
- source_word: שְׁנֵים עָשָׂר
  choice: kumi na wawili
  rationale: Namba hii inaonyesha jumla ya watu katika kundi; ngeli ya watu imeonyeshwa kwa ‘wawili,’ huku mtindo wa orodha wa Kiebrania ukihifadhiwa bila kuongeza kitenzi.
