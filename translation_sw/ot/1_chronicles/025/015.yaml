  text: the eighth to Jeshaiah[a], his sons and his brothers, twelve.
translation:
  language: sw
  text: 'Wa nane: Yeshaya, wanawe na ndugu zake, kumi na wawili.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: wa nane
  rationale: Namba ya mpangilio yenye kibainishi katika orodha ya kura au zamu. Kiswahili cha kawaida huhitaji muundo wa ‘wa nane’; neno ‘kura’ halipo wazi katika mstari huu, hivyo halijaongezwa katika matini kuu.
- source_word: יְשַׁעְיָהוּ
  choice: Yeshaya
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili huku likifuata umbo la Kiebrania.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania linamaanisha wana wa kiume katika muktadha huu; ‘wanawe’ huhifadhi maana hiyo kwa lugha ya asili na fasaha.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: אחים kimsingi ni ndugu wa kiume. Katika Kiswahili ‘ndugu zake’ ni usemi wa kawaida, ingawa jinsia haionekani wazi katika nomino yenyewe; muktadha wa kikundi cha waimbaji wa kiume unaihifadhi.
- source_word: שְׁנֵים עָשָׂר
  choice: jumla yao kumi na wawili
  rationale: Idadi hii inatoa jumla ya kundi. Kiebrania hakina kitenzi; Kiswahili cha kawaida huwasilisha apposition hii kwa uwazi kwa ‘jumla yao,’ na ‘wawili’ huonyesha kuwa wanaohesabiwa ni watu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, kwa mtindo mfupi wa orodha lakini wenye uwazi wa kisarufi. ‘Alikuwa’ limeongezwa ili sentensi isomeke kwa kawaida bila kufanya neno ‘kura’ lililodokezwa kuwa sehemu ya matini kuu.
