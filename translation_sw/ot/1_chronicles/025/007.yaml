base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/007.yaml
  text: Their number[a], together with their brothers who were trained in singing to Yahweh, all who were skillful[b], was two hundred eighty-eight.
translation:
  language: sw
  text: Idadi yao, pamoja na ndugu zao waliofundishwa kumwimbia Yahweh[a]—wote waliokuwa stadi[b]—ilikuwa mia mbili themanini na wanane.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuimba kwa ajili ya Yahweh.” Kihusishi cha Kiebrania kinaweza kuonyesha uelekeo au kusudi katika muktadha huu wa huduma ya muziki.
    reason: lexical_alternative
  - marker: b
    text: Au, “waliokuwa na ufahamu,” yaani, waliokuwa na uwezo au utaalamu katika kazi ya muziki.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפָּרָם
  choice: Idadi yao
  rationale: Nomino hii inaonyesha jumla iliyohesabiwa; “Idadi yao” ni Kiswahili cha kawaida na cha karibu na muundo wa Kiebrania.
- source_word: עִם אֲחֵיהֶם
  choice: pamoja na ndugu zao
  rationale: עִם huonyesha kuandamana au kujumuishwa pamoja; “ndugu zao” inadumisha maana ya moja kwa moja katika muktadha wa huduma hii ya Walawi wanaume.
- source_word: מְלֻמְּדֵי שִׁיר
  choice: waliofundishwa kumwimbia
  rationale: Kauli tendwa ya למד huonyesha kwamba walikuwa wamefundishwa au kuzoezwa. Muundo huu unadumisha dhana ya mafunzo badala ya kuwataja tu kuwa waimbaji.
- source_word: לַיהוָה
  choice: kumwimbia Yahweh
  rationale: Kiambishi ל katika muktadha huu kinaweza kuonyesha anayeimbishwa au kusudi la huduma. Kiswahili “kumwimbia Yahweh” ni cha asili na huunganisha maana hiyo na tendo la kuimba.
- source_word: כָּל הַמֵּבִין
  choice: wote waliokuwa stadi
  rationale: בין hapa huonyesha ufahamu wenye uwezo au ustadi katika kazi ya muziki, si kuelewa kiakili tu.
- source_word: מָאתַיִם שְׁמוֹנִים וּשְׁמוֹנָה
  choice: mia mbili themanini na wanane
  rationale: Mfuatano wa namba za Kiebrania unatoa jumla ya 288; kuiandika kwa maneno inafaa mtindo wa maandiko.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni יהוה. “Yahweh” huhifadhi jina la agano bila kulibadili kuwa cheo.
- issue: Uhusiano wa לַיהוָה na uimbaji
  choice: kumwimbia Yahweh
  alternative: waliofundishwa kuimba kwa ajili ya Yahweh
  rationale: ל inaweza kuonyesha anayeelekezewa wimbo au kusudi la huduma. Tafsiri kuu inatumia uelekeo wa tendo, huku tanbihi ikihifadhi uwezekano wa kusudi.
- issue: Maana ya כָּל הַמֵּבִין katika kazi ya muziki
  choice: wote waliokuwa stadi
  alternative: wote waliokuwa na ufahamu
  rationale: Muktadha unaelekea kwenye umahiri wa muziki, lakini tafsiri halisi zaidi ya ufahamu inabaki kuwa uwezekano halali na imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Dashi ndefu zinatenga kifungu kinachofafanua kuwa jumla hiyo ilihusu watu wote stadi. Viashiria vyote vya tanbihi vimewekwa katika maandishi.
