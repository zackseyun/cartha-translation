  text: And they cast lots for duties[a], the small as well as the great[b], the teacher with the student.
translation:
  language: sw
  text: Nao wakapiga kura kwa ajili ya zamu za huduma, mdogo sawa na mkubwa,[a] mwalimu[b] pamoja na mwanafunzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mdogo na mkubwa”; ni nahau inayoonyesha kuwa wote walitendewa kwa usawa bila kujali cheo au hadhi.'
    reason: cultural_note
  - marker: b
    text: Au “mwenye ujuzi pamoja na mwanafunzi.” Neno la Kiebrania lililotafsiriwa “mwalimu” kihalisi ni “mwenye kuelewa” na linaweza kumaanisha mtu stadi au mtaalamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ גּוֹרָלוֹת
  choice: wakapiga kura
  rationale: Hii ni nahau ya Kiebrania ya kutumia kura kufanya uteuzi au kugawa majukumu; “kupiga kura” ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: מִשְׁמֶרֶת
  choice: zamu za huduma
  rationale: Katika muktadha wa huduma ya muziki hekaluni, neno hili linamaanisha zamu au jukumu la huduma lililogawiwa. Wingi wa Kiswahili unaonyesha kwa kawaida zamu mbalimbali zilizogawiwa kwa kura.
- source_word: לְעֻמַּת
  choice: sawa na
  rationale: Hapa neno hili linaonyesha ulinganifu au kutotofautishwa kwa makundi, si mahali yalipokabiliana.
- source_word: כַּקָּטֹן כַּגָּדוֹל
  choice: mdogo sawa na mkubwa
  rationale: Tafsiri hii inadumisha nahau ya Kiebrania huku ikionyesha kuwa hadhi haikuathiri ugawaji wa kura.
- source_word: מֵבִין
  choice: mwalimu
  rationale: Kishirikishi hiki kihalisi humaanisha “mwenye kuelewa” au mwenye ustadi. Katika jozi yake na תַּלְמִיד, “mwalimu” huwasilisha kwa Kiswahili uhusiano unaowezekana wa kufundisha na kujifunza, huku tanbihi ikihifadhi maana pana zaidi.
- source_word: עִם
  choice: pamoja na
  rationale: Huunganisha moja kwa moja makundi mawili yaliyoshiriki katika ugawaji wa kura.
- source_word: תַּלְמִיד
  choice: mwanafunzi
  rationale: Neno hili humaanisha anayefundishwa au anayejifunza; “mwanafunzi” ni la kawaida na halileti maana za kidhehebu zisizohitajika.
