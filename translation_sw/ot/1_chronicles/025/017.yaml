  text: the tenth[a], Shimei; his sons and his brothers, twelve.
translation:
  language: sw
  text: Ya kumi[a], Shimei; wanawe na ndugu zake, kumi na wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi kulingana na muktadha, “kura ya kumi ilimwangukia Shimei.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲשִׂירִי
  choice: wa kumi
  rationale: Ni namba ya mpangilio yenye kibainishi, ikiendeleza mfuatano wa kura katika muktadha. Kiswahili kinaweza kusema kwa ufupi “wa kumi,” huku muktadha ukionyesha kuwa inahusu kura au zamu.
- source_word: שִׁמְעִי
  choice: Shimei
  rationale: Ni jina la mtu; limetoholewa kwa kufuata umbo linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno hili linamaanisha wana wa kiume katika orodha hii, si watoto kwa maana pana.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: Hii ndiyo tafsiri ya kawaida ya kifungu hiki. Katika muktadha wa kundi la waimbaji inaweza pia kurejelea jamaa wa kiume au washirika wa ukoo, lakini tafsiri pana haijaingizwa kimyakimya katika matini.
- source_word: שְׁנֵים עָשָׂר
  choice: kumi na wawili
  rationale: Ni namba ya kawaida inayoonyesha jumla ya wanawe na ndugu zake waliohusishwa naye.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi wa orodha na lugha ya sasa yenye heshima. “Wa kumi” huhifadhi ufupi wa Kiebrania, huku tanbihi ikifafanua wazo la kura linalotokana na muktadha.
