translation:
  language: sw
  text: Kura ya kumi na saba[a] ilikuwa ya Yashbekasha; wanawe na ndugu zake wa kiume walikuwa kumi na wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kwa wa kumi na saba, kwa Yashbekasha.” Katika Kiebrania nomino kama “kura” au “zamu” imedokezwa kutokana na muktadha wa orodha inayozunguka.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשִׁבְעָה עָשָׂר
  choice: Kwa zamu ya kumi na saba
  rationale: Katika orodha hii, לְ pamoja na namba ya mpangilio huonyesha mgao wa zamu; neno linalomaanisha zamu au kura limeachwa katika Kiebrania lakini linaeleweka kutokana na muktadha.
- source_word: לְיָשְׁבְּקָשָׁה
  choice: Yashbekasha
  rationale: Jina limetoholewa kwa kuzingatia umbo la Kiebrania. Kiambishi לְ kinaonyesha kwamba zamu hiyo ilimhusu Yashbekasha; Kiswahili huwasilisha uhusiano huo kiasili kupitia muundo wa sentensi.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno hili linamaanisha wana wa kiume katika muktadha huu; 'wanawe' ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: אֶחָיו humaanisha ndugu zake wa kiume, ingawa katika orodha kama hii inaweza pia kuwahusu jamaa wa karibu wa kiume. 'Ndugu zake' ni tafsiri ya kawaida ya Kiswahili inayohifadhi upeo huo bila kuufafanua kupita kiasi.
- source_word: שְׁנֵים עָשָׂר
  choice: jumla yao kumi na wawili
  rationale: Namba hii inatoa idadi ya kundi lote. 'Jumla yao' huweka wazi kwa Kiswahili kazi ya namba hiyo katika sentensi fupi ya orodha.
