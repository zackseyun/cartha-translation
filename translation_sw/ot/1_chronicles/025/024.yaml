  naturalness: «Kwa zamu ya kumi na saba» inaeleweka, lakini «Kura ya kumi na saba ilikuwa ya ...» ni muundo wa kawaida zaidi kwa orodha hii ya kura. Kumbuka chini ya ukurasa lina hitilafu ya usemi katika «kwa wa kumi na saba»; kama nukuu ya kihalisi, lazima lieleze kwamba nomino imeachwa katika Kiebrania badala ya kujaribu kufanya kishazi hicho kiwe sentensi ya Kiswahili.
  terminology: «Kura» ndilo chaguo linalofaa kwa muktadha wa 1 Nyakati 25, ambako mgao hufanywa kwa kura. «Wanawe» ni sahihi. «Ndugu zake wa kiume» hutoa maana ya moja kwa moja ya אֶחָיו bila kudai zaidi ya ilivyo katika matini.
