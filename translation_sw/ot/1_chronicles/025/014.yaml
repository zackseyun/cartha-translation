translation:
  language: sw
  text: Kura ya saba ilimwangukia Yesharela[a]; wanawe na ndugu zake walikuwa kumi na wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya neno kwa neno: “Wa saba, Yesharela, wanawe na ndugu zake, kumi na wawili.” Kitenzi “ilimwangukia” kimeongezwa kwa kuzingatia muundo wa mgao wa kura unaojirudia katika mistari inayozunguka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁבִעִי
  choice: Kura ya saba
  rationale: Ingawa Kiebrania kina kivumishi cha mp ترتيب pekee, muktadha wa orodha unaonyesha kuwa kinamaanisha kura ya saba; kutaja “kura” kunafanya Kiswahili kiwe wazi na cha kawaida.
- source_word: יְשַׂרְאֵלָה
  choice: Yesharela
  rationale: Jina la mtu limetoholewa kwa tahajia inayokaribia umbo la Kiebrania na inayosomeka kwa urahisi katika Kiswahili.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania linamaanisha hasa wana wa kiume; “wanawe” linahifadhi maana hiyo kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: “Ndugu zake” ni tafsiri ya kawaida ya Kiswahili; katika muktadha huu wa orodha ya wanaume inarejelea ndugu wa kiume, bila kulazimisha maana pana ya jamaa.
- source_word: שְׁנֵים עָשָׂר
  choice: kumi na wawili
  rationale: Idadi hii inatoa jumla ya kundi; umbo la ngeli ya watu “wawili” linafaa kwa wana na ndugu wanaohesabiwa.
- source_word: '[kitenzi kinachodokezwa na kanuni ya ugawaji wa kura]'
  choice: ilimwangukia
  rationale: Kiebrania cha mstari huu hakina kitenzi, lakini mistari inayozunguka ina kanuni inayorudiwa ya ugawaji kwa kura. “Ilimwangukia” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kufafanua kupita kiasi.
