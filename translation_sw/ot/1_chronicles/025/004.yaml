base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/004.yaml
  text: 'To Heman: the sons of Heman: Bukkiah[a], Mattaniah, Uzziel, Shebuel, and Jerimoth, Hananiah, Hanani, Eliathah, Giddalti, and Romamti-ezer, Joshbekashah, Mallothi, Hothir[c][b], Mahazioth.'
translation:
  language: sw
  text: 'Kwa Hemani: wana wa Hemani walikuwa Bukia, Matania, Uzieli, Shebueli[c], Yerimothi[b], Hanania, Hanani, Eliatha, Gidalti na Romamti-ezeri[a], Yoshbekasha, Malothi, Hothiri na Mahaziothi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya wafafanuzi wamependekeza kwamba sehemu ya orodha hii, hasa karibu na “Gidalti” na “Romamti-ezeri,” inaweza kusomwa kama kishazi badala ya majina pekee. Hapa imetafsiriwa kama majina ya watu kwa sababu ya muktadha wa orodha.
    reason: alternative_reading
  - marker: b
    text: Jina “Yerimothi” linaweza pia kutoholewa “Yeremothi.”
    reason: lexical_alternative
  - marker: c
    text: Jina “Shebueli” linaweza pia kutoholewa “Shubaeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/הֵימָן
  choice: Kwa Hemani
  rationale: Kiambishi לְ katika muktadha wa orodha ya zamu kinaonyesha mgawo au kundi linalomhusu Hemani; “Kwa Hemani” hudumisha muundo huo wa kichwa cha orodha.
- source_word: בְּנֵי הֵימָן
  choice: wana wa Hemani
  rationale: בְּנֵי kwa kawaida humaanisha “wana”; hapa muktadha ni orodha ya watoto wa Hemani.
- source_word: שְׁבוּאֵל
  choice: Shebueli
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, huku umbo mbadala likiwekwa katika tanbihi.
- source_word: וִֽ/ירִימוֹת
  choice: Yerimothi
  rationale: Tahajia hii inafuata kwa karibu irabu za maandishi ya Kiebrania; kiunganishi וְ kinaonyeshwa kiasili katika mpangilio wa orodha.
- source_word: גִדַּלְתִּי
  choice: Gidalti
  rationale: Ingawa umbo hili linaweza kufanana na kitenzi, muktadha wa karibu unalifanya lieleweke kama jina la mtu.
- source_word: וְ/רֹמַמְתִּי עֶזֶר
  choice: na Romamti-ezeri
  rationale: Katika orodha hii maneno hayo yamechukuliwa kuwa jina ambatani; kistari huonyesha kuwa vipashio hivyo vinaunda jina moja.
theological_decisions:
- issue: Iwapo baadhi ya maumbo katika orodha hii yasomwe kama sentensi yenye maana badala ya majina ya watu
  choice: Mfuatano wote baada ya “wana wa Hemani” umetafsiriwa kama orodha ya majina ya watu.
  alternative: Baadhi ya majina, hasa Gidalti na Romamti-ezeri, yanaweza kuunganishwa na kusomwa kama kishazi kama “nimekuza na kuinua msaada.”
  rationale: Muktadha wa kifungu ni orodha ya wana na wanamuziki waliopangiwa huduma. Kusoma maumbo hayo kama majina hudumisha maana ya wazi ya muktadha bila kufuta uwezekano mwingine, ambao umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Majina yametoholewa kwa maumbo yanayoweza kutamkwa kiasili kwa Kiswahili; alama za tanbihi zimewekwa moja kwa moja baada ya majina yanayohusika.
