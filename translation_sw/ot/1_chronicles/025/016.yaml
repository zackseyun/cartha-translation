base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/016.yaml
  text: The ninth was Mattanyahu[a], his sons and his brothers, twelve.
translation:
  language: sw
  text: Wa tisa alikuwa Matania[a], wanawe na ndugu zake, jumla yao kumi na wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Mattanyahu; jina hili pia huandikwa Matania.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשִׁיעִי
  choice: Wa tisa alikuwa
  rationale: Nambari ya mpangilio yenye kibainishi imetumiwa kwa kudokeza nafasi katika orodha; kitenzi “alikuwa” kinaifanya sentensi iwe ya kawaida kwa Kiswahili bila kuongeza nomino kama “kura” ambayo haikutajwa wazi katika Kiebrania.
- source_word: מַתַּנְיָהוּ
  choice: Matania
  rationale: Hili ni umbo la jina linalosomeka kwa kawaida katika Kiswahili; tanbihi inahifadhi umbo la Kiebrania Mattanyahu.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania linamaanisha hasa wana wa kiume, na “wanawe” huhifadhi maana hiyo kwa ufupi.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: “Ndugu zake” ni tafsiri ya kawaida ya Kiswahili kwa ndugu wa kiume katika muktadha huu wa orodha, bila kuipanua kimakusudi kuwa jamaa au washirika wa ukoo.
- source_word: שְׁנֵים עָשָׂר
  choice: jumla yao kumi na wawili
  rationale: Idadi hii ni jumla ya watu waliotajwa katika kikundi. “Jumla yao” huweka uhusiano huo wazi kwa Kiswahili cha kawaida, huku “wawili” ikipatana na watu.
