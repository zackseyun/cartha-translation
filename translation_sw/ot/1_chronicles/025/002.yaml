  yaml_path: translation/ot/1_chronicles/025/002.yaml
  text: 'Of the sons of Asaph: Zaccur[a], Joseph, Nethaniah, and Asharelah, sons of Asaph, under the direction of Asaph, who prophesied under the direction of the king.'
translation:
  language: sw
  text: 'Kwa wana wa Asafu: Zakuri, Yosefu, Nethania na Asharela, wana wa Asafu waliokuwa chini ya uongozi wa Asafu[a], aliyekuwa akitabiri chini ya uongozi wa mfalme.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “kwa mkono wa Asafu … kwa mkono wa mfalme.” Nahau hii inaweza kuonyesha kutenda kwa niaba ya mwingine, usimamizi, au uongozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Kwa wana wa
  rationale: Katika orodha hii, לִבְנֵי inaanzisha kundi linaloorodheshwa. “Kwa wana wa” ni ya asili katika Kiswahili na bado inahifadhi maana ya kiambishi ל kuliko kuifanya tu kuwa kichwa cha habari.
- source_word: אָסָף
  choice: Asafu
  rationale: Jina la mtu limetoholewa kwa namna inayotambulika na inayofaa mfumo wa sauti wa Kiswahili.
- source_word: זַכּוּר
  choice: Zakuri
  rationale: Jina la mtu limetoholewa moja kwa moja kwa tahajia ya Kiswahili.
- source_word: יוֹסֵף
  choice: Yosefu
  rationale: Imetumiwa namna ya kawaida ya jina hili katika Kiswahili cha Biblia.
- source_word: נְתַנְיָה
  choice: Nethania
  rationale: Jina limetoholewa kutoka Kiebrania huku likibaki rahisi kutambuliwa na wasomaji wa Kiswahili.
- source_word: אֲשַׂרְאֵלָה
  choice: Asharela
  rationale: Tahajia hii inafuata kwa karibu umbo la jina katika maandishi ya WLC na inafaa matamshi ya Kiswahili.
- source_word: בְּנֵי אָסָף
  choice: wana wa Asafu
  rationale: Kirai kilichorudiwa katika Kiebrania kimehifadhiwa ili kuweka wazi kuwa majina yaliyotajwa ni ya kundi la Asafu.
- source_word: עַל יַד
  choice: chini ya uongozi wa
  rationale: Nahau hii, ambayo kihalisi ni “kwa mkono wa,” hapa inaonyesha usimamizi au mamlaka. “Chini ya uongozi wa” ni Kiswahili cha kawaida kinachowasilisha maana hiyo.
- source_word: הַנִּבָּא
  choice: aliyetabiri
  rationale: Kauli ya wakati unaoendelea kutoka נבא inaeleza shughuli ya kinabii ya Asafu. Tafsiri hii huhifadhi dai la maandishi badala ya kulipunguza kuwa uimbaji au upigaji wa muziki tu.
- source_word: עַל יְדֵי הַמֶּלֶךְ
  choice: chini ya uongozi wa mfalme
  rationale: Nahau ileile imetafsiriwa kwa ulinganifu, ikionyesha kwamba shughuli ya Asafu ilifanywa chini ya mamlaka ya mfalme.
theological_decisions:
- issue: Maana ya “aliyetabiri” katika muktadha wa muziki wa hekaluni
  choice: aliyetabiri
  alternative: aliimba kinabii; alipiga muziki kwa uvuvio
  rationale: Kitenzi נבא kinaweka dai la shughuli ya kinabii katika huduma ya muziki. Neno “aliyetabiri” linahifadhi dai hilo na mvutano wake bila kulifafanua kuwa maonyesho ya muziki pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa orodha na urudiaji wa “wana wa Asafu” umehifadhiwa; nahau ya Kiebrania imetolewa kwa Kiswahili cha kawaida na maana yake halisi imewekwa katika tanbihi.
