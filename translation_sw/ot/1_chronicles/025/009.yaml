base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/009.yaml
  text: The first lot came out for Asaph[a], for Joseph; Gedaliah the second, he and his brothers and his sons[b], twelve.
translation:
  language: sw
  text: Kura ya kwanza ilimwangukia Yosefu wa Asafu[a]; ya pili ikamwangukia Gedalia[b], yeye pamoja na ndugu zake na wanawe—jumla yao walikuwa kumi na wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “Kura ya kwanza ilitoka kwa Asafu, kwa Yosefu.”
    reason: Kiebrania hurudia kihusishi “kwa” mbele ya Asafu na Yosefu. Tafsiri kuu huonyesha kwa wazi uhusiano wa Yosefu na Asafu unaoonekana katika muktadha wa orodha.
  - marker: b
    text: 'Kiebrania: Gedaliahu.'
    reason: Tanbihi inahifadhi umbo kamili la jina katika maandishi ya Kiebrania, huku maandishi makuu yakitumia umbo la kawaida la Kiswahili.
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל הָרִאשׁוֹן
  choice: Kura ya kwanza ... ilimwangukia
  rationale: Katika muktadha wa kupiga kura, Kiswahili cha kawaida husema kura ‘ilimwangukia’ mtu. Hii inawasilisha kwa ufasaha maana ya neno la Kiebrania וַיֵּצֵא, yaani ‘ilitoka,’ bila kupoteza wazo la ugawaji kwa kura.
- source_word: לְאָסָף לְיוֹסֵף
  choice: kwa ajili ya Asafu ... Yosefu
  rationale: 'Viambishi viwili vya לְ vinahifadhiwa kwa maana ya uhusiano na ugawaji: kura ya kwanza katika kundi la Asafu ilimwangukia Yosefu. Mpangilio huu pia unaepusha dhana kwamba Asafu na Yosefu walikuwa wapokeaji wawili tofauti wa kura moja.'
- source_word: גְּדַלְיָהוּ הַשֵּׁנִי
  choice: ya pili ikamwangukia Gedalia
  rationale: Kitenzi kinachodokezwa katika kishazi kisicho na kitenzi kimejazwa kwa Kiswahili cha asili. ‘Gedalia’ ni umbo la kawaida la jina hili katika Kiswahili, huku umbo kamili la Kiebrania likitajwa katika tanbihi.
- source_word: הוּא וְאֶחָיו וּבָנָיו
  choice: yeye pamoja na ndugu zake na wanawe
  rationale: Kiwakilishi הוּא kimehifadhiwa ili kuonyesha kwamba Gedalia mwenyewe anahesabiwa pamoja na ndugu na wanawe. ‘Wanawe’ huhifadhi umahususi wa בָנָיו kama wana wa kiume.
- source_word: שְׁנֵים עָשָׂר
  choice: jumla yao walikuwa kumi na wawili
  rationale: Kishazi cha Kiebrania hakina kitenzi; Kiswahili kinaweka wazi kwamba kumi na wawili ni jumla ya kundi lililotajwa.
