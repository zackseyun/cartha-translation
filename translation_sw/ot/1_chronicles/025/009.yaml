translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. Usemi ‘kura ilimwangukia’ ni wa asili katika muktadha wa kupiga kura. Alama ya mkwaju mrefu inatenganisha kwa uwazi taarifa ya jumla ya watu kumi na wawili.
