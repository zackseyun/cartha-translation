base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/001.yaml
  text: 'And David and the commanders of the army set apart for the service the sons of Asaph[a], Heman, and Jeduthun, who prophesied with lyres, harps, and cymbals; and their number, the men for the work of their service[b], was:'
translation:
  language: sw
  text: 'Daudi na majemadari wa jeshi wakawatenga kwa ajili ya huduma wana wa Asafu, Hemani na Yeduthuni,[a][b] waliotabiri kwa vinubi, vinanda na matoazi. Idadi yao, yaani watu waliokuwa wakifanya kazi katika huduma yao, ilikuwa kama ifuatavyo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa muundo rasmi zaidi, “manabii waliotumia vinubi, vinanda na matoazi.” Kiebrania kinaweza kueleweka kuwa neno “manabii” linawaelezea Asafu, Hemani na Yeduthuni.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “wana wa Asafu, Hemani na Yeduthuni”; neno “wana” linaweza kumaanisha wazao wao au washiriki wa vikundi vyao, wala si wana wao wa moja kwa moja pekee.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבְדֵּל
  choice: wakawatenga
  rationale: Hifili ya בדל ina maana ya kutenga kwa kusudi maalumu; hapa ni kutengwa kwa ajili ya huduma iliyopangwa.
- source_word: שָׂרֵי הַצָּבָא
  choice: majemadari wa jeshi
  rationale: Kirai hiki kwa kawaida humaanisha viongozi wa kijeshi; tafsiri hii ni ya asili na wazi katika Kiswahili cha sasa.
- source_word: לַעֲבֹדָה
  choice: kwa ajili ya huduma
  rationale: עֲבֹדָה katika muktadha huu ni huduma rasmi ya ibadani, si kazi ya kawaida tu.
- source_word: לִבְנֵי אָסָף וְהֵימָן וִידוּתוּן
  choice: wana wa Asafu, Hemani na Yeduthuni
  rationale: Wana huhifadhi upana wa בְּנֵי, ambao unaweza kumaanisha wana halisi, wazao, au washiriki wa kundi lao.
- source_word: הנביאים
  choice: waliotabiri
  rationale: Ingawa umbo la Kiebrania ni nomino, kishazi cha kitenzi huleta sintaksia ya kawaida ya Kiswahili huku kikihifadhi madai kwamba huduma yao ya muziki ilikuwa ya kinabii.
- source_word: בְּכִנֹּרוֹת
  choice: kwa vinubi
  rationale: כִּנּוֹר ni ala ya nyuzi aina ya lyre; 'kinubi' ni neno linaloeleweka na hulitofautisha na נֵבֶל.
- source_word: בִּנְבָלִים
  choice: vinanda
  rationale: נֵבֶל ni ala ya nyuzi tofauti na כִּנּוֹר; 'vinanda' hutoa istilahi ya kawaida ya kibiblia bila kutumia neno lilelile kwa ala zote mbili.
- source_word: וּבִמְצִלְתָּיִם
  choice: na matoazi
  rationale: מְצִלְתַּיִם ni matoazi, ala zinazogonganishwa.
- source_word: וַיְהִי מִסְפָּרָם
  choice: 'Idadi yao ... ilikuwa kama ifuatavyo:'
  rationale: Kishazi hiki kinaanzisha orodha inayofuata; nukta mbili huhifadhi mwelekeo huo wa mbele.
- source_word: אַנְשֵׁי מְלָאכָה
  choice: watu waliofanya kazi
  rationale: Tafsiri hii haiongezi dhana ya ustadi wa kitaalamu ambayo inawezekana lakini haisemwi wazi.
- source_word: לַעֲבֹדָתָם
  choice: ya huduma yao
  rationale: Huhifadhi uhusiano wa kazi hiyo na huduma yao ya ibadani.
theological_decisions:
- issue: Iwapo הַנְּבִיאִים itafsiriwe kama nomino 'manabii' au kama kishazi kinachoeleza shughuli yao
  choice: waliotabiri
  alternative: manabii waliotumia vinubi, vinanda na matoazi
  rationale: Kiebrania kinaweza kusomwa kiambatano kwa Asafu, Hemani na Yeduthuni. Kishazi 'waliotabiri' ni cha asili zaidi katika Kiswahili na huhifadhi uhusiano wa unabii na muziki bila kuamua kupita kiasi aina ya cheo chao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili. Muundo wa sentensi umefanywa uwe wa kawaida bila kufuta utata wa neno 'manabii' wala upana wa maana ya 'wana'.
