base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/012.yaml
  text: The fifth was Nethaniah[a]; his sons and his brothers were twelve.
translation:
  language: sw
  text: Wa tano alikuwa Nethania[a]; wanawe na ndugu zake walikuwa kumi na wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kulingana na muktadha, “Kura ya tano ilikuwa ya Nethania; wanawe na ndugu zake walikuwa kumi na wawili.” Kiebrania hakitaji maneno kama “kura” au “ilikuwa ya”; yanaeleweka kutokana na orodha inayozunguka mstari huu.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: Wa tano
  rationale: Ni kivumishi cha mpangilio chenye kibainishi, kilichotumiwa kwa udondoshaji katika orodha hii. Kiswahili ‘Wa tano’ kinafuata ufupi wa Kiebrania bila kuongeza ‘kura’ au ‘kikundi’ katika matini kuu.
- source_word: נְתַנְיָהוּ
  choice: Nethania
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Wingi wa kiume wa בֵּן pamoja na kiambishi cha nafsi ya tatu umoja humaanisha hasa wana wa kiume katika muktadha huu.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: אח katika wingi humaanisha ‘ndugu zake’; muktadha hauhitaji maana pana zaidi ya jamaa.
- source_word: שְׁנֵים עָשָׂר
  choice: kumi na wawili
  rationale: Idadi hii inaonyesha jumla ya kundi lililotajwa. Ngeli ya watu imetumiwa kwa sababu wanaohesabiwa ni watu.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa sentensi umefanywa wa kawaida kwa Kiswahili huku udondoshaji wa Kiebrania ukihifadhiwa kwa kutoweka ‘kura’ katika matini kuu.
