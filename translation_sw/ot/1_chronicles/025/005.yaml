  text: כָּל אֵ֨לֶּה בָנִ֜ים לְ/הֵימָ֗ן חֹזֵ֥ה הַ/מֶּ֛לֶךְ בְּ/דִבְרֵ֥י הָ/אֱלֹהִ֖ים לְ/הָרִ֣ים קָ֑רֶן וַ/יִּתֵּ֨ן הָ/אֱלֹהִ֜ים לְ/הֵימָ֗ן בָּנִ֛ים אַרְבָּעָ֥ה עָשָׂ֖ר וּ/בָנ֥וֹת שָׁלֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/005.yaml
  text: All these were sons of Heman[a], the king’s seer in the words of God, to exalt the horn[b]. And God gave Heman fourteen sons and three daughters.
translation:
  language: sw
  text: Hawa wote walikuwa wana wa Hemani, mwonaji wa mfalme kuhusu maneno ya Mungu[a], ili kuinua pembe[b]. Mungu akampa Hemani wana kumi na wanne na mabinti watatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika mambo ya Mungu” au “kwa maneno ya Mungu.” Kirai cha Kiebrania ni kifupi na kinaweza kueleza kazi ya Hemani kuhusiana na ufunuo wa Mungu.
    reason: alternative_reading
  - marker: b
    text: Yaani, kuinua nguvu, heshima, au hadhi. Kiebrania hakitaji wazi ni pembe ya nani inayoinuliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Hawa wote
  rationale: Ni tafsiri ya kawaida na ya asili ya muhtasari huu unaorejelea waliotajwa.
- source_word: חֹזֵה
  choice: mwonaji
  rationale: Neno hili humaanisha mtu anayepokea ufunuo; “mwonaji” linahifadhi dhana ya nafasi ya kiufunuo katika ikulu bila kulipanua kuwa “nabii.”
- source_word: בְּדִבְרֵי הָאֱלֹהִים
  choice: kuhusu maneno ya Mungu
  rationale: Kirai cha Kiebrania ni kifupi na uhusiano wake wa kisintaksia uko wazi kwa sehemu tu. “Kuhusu” kinaeleza eneo la kazi ya Hemani huku tanbihi ikihifadhi uwezekano wa maana nyingine.
- source_word: לְהָרִים קָרֶן
  choice: ili kuinua pembe
  rationale: Inahifadhi sitiari ya Kiebrania na kutokubainishwa kwa mwenye pembe; lengo linaweza kuhusiana na kuinuliwa kwa nguvu, heshima, au hadhi.
- source_word: קָרֶן
  choice: pembe
  rationale: Pembe ni picha ya kibiblia ya nguvu, heshima, au hadhi iliyoinuliwa; kuitafsiri moja kwa moja huepuka kuifupisha kuwa maana moja tu.
- source_word: וַיִּתֵּן הָאֱלֹהִים לְהֵימָן
  choice: Mungu akampa Hemani
  rationale: Muundo huu ni wa asili katika Kiswahili na unaonyesha wazi kuwa Mungu ndiye aliyemjalia Hemani watoto.
- source_word: בָנִים ... וּבָנוֹת
  choice: wana ... mabinti
  rationale: Huhifadhi utofautishaji wa wazi wa watoto wa kiume na wa kike uliomo katika Kiebrania.
- source_word: אַרְבָּעָה עָשָׂר וּבָנוֹת שָׁלֹשׁ
  choice: wana kumi na wanne na mabinti watatu
  rationale: Huwasilisha idadi na mpangilio wa maana kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya “mwonaji wa mfalme katika/kuhusu maneno ya Mungu”
  choice: Hemani anaelezwa kuwa mwonaji wa mfalme kuhusu maneno ya Mungu.
  alternative: Hemani alikuwa mwonaji wa mfalme katika mambo ya Mungu, au kwa njia ya maneno ya Mungu.
  rationale: Muundo wa Kiebrania hauamui kwa uthabiti uhusiano mahususi wa kirai hicho. Tafsiri kuu ni ya asili, na tanbihi inadumisha uwezekano mwingine wa kisintaksia na kiteolojia.
- issue: Maana ya “kuinua pembe”
  choice: Sitiari ya pembe imehifadhiwa bila kutaja pembe ya nani.
  alternative: Kuongeza nguvu, kumpa heshima, au kuinua hadhi.
  rationale: Kiebrania hakimtaji wazi mwenye pembe wala hakifupishi picha hiyo kuwa wazo moja. Kuhifadhi sitiari kunadumisha utata halisi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Mwonaji” na “pembe” zimehifadhiwa kama istilahi na picha za kibiblia; tanbihi zinafafanua bila kuondoa utata wa asili.
