base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/004.yaml
  text: Six were born to him in Hebron, and he reigned there seven years and six months; and in Jerusalem he reigned thirty-three years.
translation:
  language: sw
  text: Wana sita walizaliwa kwake huko Hebroni, naye alitawala huko kwa miaka saba na miezi sita. Huko Yerusalemu alitawala kwa miaka thelathini na mitatu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁשָּׁה
  choice: Wana sita
  rationale: Nambari hii inatoa muhtasari wa wana sita waliotajwa kabla. Kuongeza “Wana” kunafanya rejeo hilo liwe wazi na la kawaida katika Kiswahili bila kuongeza habari mpya.
- source_word: נוֹלַד לוֹ
  choice: walizaliwa kwake
  rationale: Muundo wa Kiebrania ni wa kutendwa pamoja na ל pronominali; tafsiri hii huhifadhi mtazamo wa “walizaliwa kwake” badala ya kuugeuza kuwa usemi tendaji wa “aliwazaa.”
- source_word: בְחֶבְרוֹן
  choice: huko Hebroni
  rationale: Ni usemi wa mahali. “Huko” huunganisha mahali na kitenzi cha kuzaliwa kwa njia ya kawaida, na “Hebroni” ni umbo la jina linalotumika katika Kiswahili cha Biblia.
- source_word: וַיִּמְלָךְ שָׁם
  choice: naye alitawala huko
  rationale: מלך hapa humaanisha kutumia mamlaka ya kifalme kwa muda, si tu kuanza kuwa mfalme. “Alitawala” ni Kiswahili cha kawaida na sahihi.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: kwa miaka saba na miezi sita
  rationale: Huu ni usemi wa kawaida wa Kiswahili wa muda wa utawala.
- source_word: וּשְׁלֹשִׁים וְשָׁלוֹשׁ שָׁנָה
  choice: kwa miaka thelathini na mitatu
  rationale: Mpangilio wa nambari wa Kiebrania umetolewa kwa muundo wa kawaida wa Kiswahili.
- source_word: מָלַךְ בִּירוּשָׁלִָם
  choice: Huko Yerusalemu alitawala
  rationale: Kuweka mahali mwanzoni huhifadhi msisitizo wa Kiebrania juu ya eneo jipya la utawala huku sentensi ikibaki ya kawaida katika Kiswahili.
