  register: Mtindo ni mfupi na wa heshima, unaofaa kwa orodha ya nasaba. Majina yametoholewa kwa tahajia na matamshi ya kawaida ya Kiswahili huku mpangilio wa viunganishi vya Kiebrania ukihifadhiwa.
