lexical_decisions:
- source_word: יִבְחָר
  choice: Yibhari
  rationale: Jina la mtu limetoholewa moja kwa moja kutoka Kiebrania yiḇḥār. Herufi ya mwanzo yod imetolewa kwa “Y,” na irabu ya mwisho imeongezwa ili jina litamkike kwa kawaida katika Kiswahili.
- source_word: אֱלִישָׁמָע
  choice: Elishama
  rationale: Jina limetoholewa kutoka Kiebrania ’ĕlîšāma‘ kwa tahajia ya Kiswahili; konsonanti ya mwisho ayin haiongezewi sauti isiyo dhahiri katika matini.
- source_word: אֱלִיפָלֶט
  choice: Elifaleti
  rationale: Jina limetoholewa kwa kufuata matamshi ya matini ya Kiebrania ’ĕlîp̄āleṭ. “f” huwakilisha pe yenye spiranti, na “i” ya mwisho hufanya jina litamkike kwa kawaida katika Kiswahili.
- source_word: וְ
  choice: na
  rationale: Kiunganishi hiki kimeandikwa kabla ya kila jina, kama ilivyo katika orodha ya Kiebrania, na pia kinaonyesha kwamba mstari huu unaendeleza orodha ya mstari uliotangulia.
