base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/019.yaml
  text: 'The sons of Pedaiah: Zerubbabel and Shimei[a]. And the sons of Zerubbabel: Meshullam and Hananiah; and Shelomith was their sister.'
translation:
  language: sw
  text: Wana wa Pedaya walikuwa Zerubabeli na Shimei. Wana wa Zerubabeli[a] walikuwa Meshulamu na Hanania; na Shelomithi alikuwa dada yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kwa umoja, “mwana wa Zerubabeli.” Kwa kuwa kisha mstari huu unawataja Meshulamu na Hanania, wengi huliona hili kuwa hitilafu ya maandishi au matumizi ya kiukoo yenye maana ya jumla; kwa hiyo, “wana wa Zerubabeli” imetumiwa katika maandishi makuu.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי פְדָיָה
  choice: Wana wa Pedaya
  rationale: בְנֵי katika orodha ya ukoo kwa kawaida humaanisha wana halisi. Kiunganishi cha Kiebrania hakihitaji kutafsiriwa mwanzoni mwa sentensi hii katika Kiswahili.
- source_word: זְרֻבָּבֶל
  choice: Zerubabeli
  rationale: Jina limetoholewa kwa tahajia inayotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: וְשִׁמְעִי
  choice: na Shimei
  rationale: Kiunganishi kimehifadhiwa ili kuunganisha majina mawili ya wana wa Pedaya.
- source_word: וּבֶן זְרֻבָּבֶל
  choice: Wana wa Zerubabeli[a]
  rationale: Maandishi ya Kiebrania yana umoja, ‘mwana wa Zerubabeli,’ lakini yanayofuata yanataja wanaume wawili na dada yao. Wingi unaonyesha maana inayoelekea kukusudiwa, huku umbo halisi la maandishi likihifadhiwa katika tanbihi.
- source_word: מְשֻׁלָּם
  choice: Meshulamu
  rationale: Jina limetoholewa kwa tahajia ya asili iliyozoeleka katika Kiswahili.
- source_word: וַחֲנַנְיָה
  choice: na Hanania
  rationale: Kiunganishi kinaonyesha uratibu wa jina la pili katika orodha.
- source_word: וּשְׁלֹמִית
  choice: na Shelomithi
  rationale: Jina limetoholewa kwa muundo unaofaa fonolojia na tahajia ya Kiswahili.
- source_word: אֲחוֹתָם
  choice: alikuwa dada yao
  rationale: Kiambishi cha Kiebrania ni cha wingi na kwa kawaida kinawarejelea Meshulamu na Hanania. ‘Alikuwa’ imetumiwa kufanya kishazi kisicho na kitenzi katika Kiebrania kiwe cha kawaida kwa Kiswahili.
