  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye hadhi unaofaa orodha ya ukoo. Majina yametoholewa kwa namna inayoeleweka kwa wasomaji wa Biblia ya Kiswahili; sintaksia imefanywa ya kawaida bila kuficha umoja usiotarajiwa wa maandishi ya Kiebrania.
