  text: 'The sons of Neariah: Elioenai[a], Hezekiah, and Azrikam—three.'
translation:
  language: sw
  text: Wana wa Nearia[a] walikuwa Elioenai, Hezekia, na Azrikamu—watatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina “na mwana wa Nearia,” lakini katika muktadha huu wa nasaba kauli hiyo inaanzisha orodha ya wazao kadhaa; ndiyo sababu imetafsiriwa “wana wa Nearia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: Wana wa
  rationale: Ingawa umbo la Kiebrania ni la umoja, kihalisi ‘na mwana wa,’ hapa linaanzisha orodha ya watu watatu, kama inavyothibitishwa na majina matatu na neno la mwisho ‘watatu.’ Kwa hiyo wingi unatoa maana ya muktadha kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi umbo halisi.
- source_word: נְעַרְיָה
  choice: Nearia
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili.
- source_word: אֶלְיוֹעֵינַי
  choice: Elioenai
  rationale: Jina la mtu limetoholewa kwa namna inayofuata kwa karibu konsonanti za Kiebrania na kusomeka kwa Kiswahili.
- source_word: וְחִזְקִיָּה
  choice: Hezekia
  rationale: Jina la mtu limetolewa kwa umbo linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: וְעַזְרִיקָם
  choice: na Azrikamu
  rationale: Kiunganishi וְ kimetafsiriwa ‘na’; jina limetoholewa kwa tahajia inayosomeka kiasili katika Kiswahili.
- source_word: שְׁלֹשָׁה
  choice: watatu
  rationale: Namba imehifadhiwa wazi na kupatanishwa na ngeli ya watu kwa Kiswahili.
