  text: All these were David’s sons[a], besides the sons of the concubines; and Tamar was their sister.
translation:
  language: sw
  text: Hawa wote walikuwa wana wa Daudi,[a] mbali na wana wa masuria; na Tamari alikuwa dada yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hawa wote walikuwa wana wa Daudi, bila kuhesabu wana wa masuria.” Kifungu cha Kiebrania kinaweza kueleweka kuwa kinawatenga wana hao na jumla iliyotangulia au kinawataja kama nyongeza nje ya orodha kuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Hawa wote
  rationale: Kifungu hiki kinakusanya kwa kawaida majina yote yaliyotangulia na kuhifadhi wazo la ujumla.
- source_word: בְּנֵי דָוִיד
  choice: wana wa Daudi
  rationale: Neno la Kiebrania ni la wingi wa kiume; “wana” ni sahihi na linafaa katika nasaba.
- source_word: מִלְּבַד
  choice: bila kuhesabu
  rationale: Kauli hii huonyesha walio nje ya orodha au jumla iliyotangulia, huku kutotatua kimya kimya uwezekano wa maana ya nyongeza.
- source_word: בְּנֵי פִילַגְשִׁים
  choice: wana wa masuria
  rationale: Inahifadhi jinsia ya neno “wana” na kundi la kijamii linalotajwa; muktadha unaonyesha kuwa masuria hao walikuwa wa Daudi.
- source_word: פִילַגְשִׁים
  choice: masuria
  rationale: “Masuria” ni neno la kawaida la Kiswahili kwa wanawake wenye hadhi ya wake wa daraja la pili katika nyumba ya kifalme.
- source_word: וְתָמָר
  choice: na Tamari
  rationale: Kiunganishi rahisi na umbo la jina linalotumika katika Biblia za Kiswahili vinaakisi maandishi ya Kiebrania.
- source_word: אֲחוֹתָם
  choice: alikuwa dada yao
  rationale: Kiebrania hakina kitenzi hapa; Kiswahili huongeza “alikuwa” ili sentensi iwe ya kawaida na wazi.
