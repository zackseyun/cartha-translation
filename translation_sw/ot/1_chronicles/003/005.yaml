base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/005.yaml
  text: 'These were born to him in Jerusalem: Shimea[a], Shobab, Nathan[b], and Solomon—four by Bath-shua daughter of Ammiel.'
translation:
  language: sw
  text: 'Hawa ndio waliozaliwa kwake Yerusalemu: Shimea[a], Shobabu, Nathani, na Sulemani—wote wanne walikuwa wana wa Bath-shua[b], binti ya Amieli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika kifungu sambamba cha 2 Samweli 5:14, jina hili lina umbo Shamua.
    reason: textual_variant
  - marker: b
    text: Katika 2 Samweli 11:3, mwanamke huyu anaitwa Bathsheba, binti ya Eliamu.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Hawa ndio
  rationale: Inatambulisha kundi linalofuata katika orodha ya ukoo kwa Kiswahili cha kawaida huku ikihifadhi nguvu ya kiashiria cha Kiebrania.
- source_word: נוּלְּדוּ לוֹ
  choice: waliozaliwa kwake
  rationale: Inahifadhi hali ya kutendwa ya kitenzi ילד na kiwakilishi kinachomrejelea Daudi kutokana na muktadha, bila kumtaja tena katika mstari huu.
- source_word: בִּירוּשָׁלָיִם
  choice: huko Yerusalemu
  rationale: Ni usemi wa mahali pa kuzaliwa; “huko” hufanya sentensi isikike kwa ufasaha katika Kiswahili.
- source_word: שִׁמְעָא
  choice: Shimea
  rationale: Inafuata umbo la jina lililo katika WLC hapa badala ya kulisawazisha na umbo Shamua katika kifungu sambamba.
- source_word: שׁוֹבָב
  choice: Shobabu
  rationale: Ni umbo la jina linalopatana na uhawilishaji wa majina ya Kiebrania katika matumizi ya Biblia ya Kiswahili.
- source_word: נָתָן
  choice: Nathani
  rationale: Ni umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: שְׁלֹמֹה
  choice: Sulemani
  rationale: Ni umbo la kawaida na linalotambulika la jina la mfalme huyu katika Kiswahili.
- source_word: אַרְבָּעָה
  choice: wote wanne
  rationale: Inajumlisha wanaume wanne waliotajwa mara tu kabla yake na kudhihirisha kwamba idadi hiyo inawahusu wote.
- source_word: לְבַת שׁוּעַ
  choice: walikuwa wana wa Bath-shua
  rationale: Kiswahili hiki cha asili kinaeleza uhusiano wa uzazi unaoonyeshwa na לְ katika muktadha wa ukoo, bila kutumia usemi usio wa kawaida “kwa Bath-shua.”
- source_word: בַּת עַמִּיאֵל
  choice: binti ya Amieli
  rationale: Inatoa kwa njia ya moja kwa moja utambulisho wa Bath-shua kwa jina la baba yake.
theological_decisions:
- issue: Umbo la jina la mke wa Daudi katika Mambo ya Nyakati likilinganishwa na vifungu vingine
  choice: Bath-shua, binti ya Amieli
  alternative: Bathsheba, binti ya Eliamu
  rationale: Maandishi ya Kiebrania ya mstari huu yana Bath-shua na Amieli. Tafsiri inafuata maandishi hayo badala ya kuyasawazisha kimya kimya na majina yanayotokea katika Samweli; tofauti hiyo inaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeundwa kwa ufasaha kwa msomaji wa kawaida, huku majina na tofauti za maandishi ya chanzo zikihifadhiwa. Alama zote za tanbihi zimewekwa mara moja katika sehemu husika ya matini.
