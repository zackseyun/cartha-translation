  text: וְ/אֵ֤לֶּה הָיוּ֙ בְּנֵ֣י דָויִ֔ד אֲשֶׁ֥ר נֽוֹלַד ל֖/וֹ בְּ/חֶבְר֑וֹן הַ/בְּכ֣וֹר אַמְנֹ֗ן לַ/אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵאלִ֔ית שֵׁנִי֙ דָּנִיֵּ֔אל לַ/אֲבִיגַ֖יִל הַֽ/כַּרְמְלִֽית־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/001.yaml
  text: 'These were David’s sons who were born to him in Hebron: the firstborn[a], Amnon, by Ahinoam the Jezreelite; the second, Daniel, by Abigail the Carmelite.'
translation:
  language: sw
  text: 'Hawa walikuwa wana wa Daudi waliozaliwa kwake huko Hebroni: mzaliwa wa kwanza,[a] Amnoni, ambaye mama yake alikuwa Ahinoamu wa Yezreeli; wa pili, Danieli, ambaye mama yake alikuwa Abigaili wa Karmeli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika orodha inayolingana na hii kwenye 2 Samweli 3:3, mwana huyu anaitwa Kileabu badala ya Danieli.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה הָיוּ
  choice: Hawa ndio
  rationale: Hufungua orodha mpya kwa Kiswahili cha kawaida huku kiunganishi וְ kikieleweka kutokana na muktadha; hakuna haja ya kuongeza neno la wakati kama “sasa”.
- source_word: בְּנֵי דָוִיד
  choice: wana wa Daudi
  rationale: Neno בְּנֵי linawahusu wana wa kiume katika nasaba; “wana wa Daudi” ni la asili na lenye hadhi katika Kiswahili.
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: waliozaliwa kwake
  rationale: Huhifadhi umbo la kutendwa la kitenzi נולד pamoja na uhusiano unaoonyeshwa na לוֹ bila kuligeuza kuwa dai la kutenda la “aliowazaa”.
- source_word: בְּחֶבְרוֹן
  choice: huko Hebroni
  rationale: Hutoa maana ya mahali kwa namna ya kawaida katika Kiswahili; umbo “Hebroni” linafuata matumizi yaliyozoeleka ya jina hili.
- source_word: הַבְּכוֹר
  choice: mzaliwa wa kwanza
  rationale: Huhifadhi hadhi ya uzaliwa wa kwanza, si mpangilio wa umri pekee.
- source_word: לַאֲחִינֹעַם הַיִּזְרְעֵאלִית
  choice: ambaye mama yake alikuwa Ahinoamu wa Yezreeli
  rationale: Matumizi ya לְ mbele ya jina la mwanamke yanaonyesha mama. Ufafanuzi huu ni wazi na wa kawaida kuliko tafsiri ya moja kwa moja isiyo ya asili kama “kwa Ahinoamu”; kivumishi cha asili ya mahali kinatolewa kwa “wa Yezreeli”.
- source_word: שֵׁנִי דָּנִיֵּאל
  choice: wa pili, Danieli
  rationale: Huhifadhi mpangilio wa nasaba na jina lililo katika maandishi ya Mambo ya Nyakati.
- source_word: לַאֲבִיגַיִל הַכַּרְמְלִית
  choice: ambaye mama yake alikuwa Abigaili wa Karmeli
  rationale: Huwasilisha kwa uwazi uhusiano wa uzazi na asili ya Abigaili inayotajwa kwa kivumishi cha kike.
