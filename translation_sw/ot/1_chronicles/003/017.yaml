  text: וּ/בְנֵי֙ יְכָנְיָ֣ה אַסִּ֔ר שְׁאַלְתִּיאֵ֖ל בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/017.yaml
  text: 'And the sons of Jeconiah: Assir[a], Shealtiel his son.'
translation:
  language: sw
  text: 'Na wana wa Yekonia: Asiri[a], Shealtieli mwanawe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Na wana wa Yekonia aliyekuwa mateka: Shealtieli mwanawe.” Neno la Kiebrania אַסִּר linaweza kusomwa kama jina Asiri au kama nomino yenye maana ya “mateka” au “mfungwa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Na wana wa
  rationale: Kiunganishi ו kimetafsiriwa “Na” ili kudumisha mwendelezo wa nasaba, na בְנֵי kwa maana yake ya kawaida ya “wana wa.”
- source_word: יְכָנְיָה
  choice: Yekonia
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili na linaloakisi jina la Kiebrania.
- source_word: אַסִּר
  choice: Asiri
  rationale: Katika orodha hii ya nasaba, neno hilo limechukuliwa kama jina la mtu; hata hivyo, linaweza pia kuwa nomino yenye maana ya “mateka” au “mfungwa,” hivyo usomaji huo umehifadhiwa katika tanbihi.
- source_word: שְׁאַלְתִּיאֵל
  choice: Shealtieli
  rationale: Jina la Kiebrania limetoholewa kwa umbo la Kiswahili linalotambulika na wasomaji wa Biblia.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Kiambishi cha umilikaji kimetafsiriwa kwa Kiswahili cha kawaida kama “mwanawe”; katika muundo wa mstari, kinamrejelea Yekonia.
theological_decisions:
- issue: Iwapo אַסִּר ni jina la mtu au nomino ya kawaida yenye maana ya “mateka/mfungwa”
  choice: Kulisoma kama jina “Asiri” katika maandishi makuu
  alternative: '“Na wana wa Yekonia aliyekuwa mateka: Shealtieli mwanawe.”'
  rationale: Konsonanti za Kiebrania zinaruhusu usomaji wote wawili. Muktadha wa orodha ya nasaba na uwekaji wa irabu katika mapokeo ya Kimasora vinaunga mkono kulichukulia kama jina, lakini utata halisi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye hadhi unaofaa orodha ya nasaba. Majina yametoholewa kwa maumbo yanayotambulika katika matumizi ya Biblia za Kiswahili, huku utata wa Kiebrania ukihifadhiwa kwa tanbihi.
