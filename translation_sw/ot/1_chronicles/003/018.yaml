base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/018.yaml
  text: Malchiram[a], Pedaiah, Shenazzar, Jekamiah, Hoshama, and Nedabiah.
translation:
  language: sw
  text: Malkiramu, Pedaya, Shenazari, Yekamia, Hoshama na Nedabia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכִּירָם
  choice: Malkiramu
  rationale: Jina la mtu limetoholewa kwa mfumo wa kawaida wa Kiswahili, likifuata konsonanti na irabu za Kiebrania.
- source_word: פְדָיָה
  choice: Pedaya
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania; sehemu ya mwisho יָה imewakilishwa kwa '-ya' kwa matamshi ya asili ya Kiswahili.
- source_word: שֶׁנְאַצַּר
  choice: Shenazari
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili, huku sauti kuu za Kiebrania zikihifadhiwa.
- source_word: יְקַמְיָה
  choice: Yekamia
  rationale: Yod ya mwanzo imewakilishwa kwa 'Y', si 'J' ya desturi ya Kiingereza, na jina limetoholewa kulingana na matamshi ya Kiswahili.
- source_word: הוֹשָׁמָע
  choice: Hoshama
  rationale: Utohozi huu unahifadhi kwa karibu mpangilio wa konsonanti na irabu wa jina la Kiebrania na unasomeka kwa kawaida katika Kiswahili.
- source_word: נְדַבְיָה
  choice: Nedabia
  rationale: Jina limetoholewa kutoka Kiebrania; sehemu ya mwisho ya jina imewasilishwa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: וּ / וְ
  choice: na
  rationale: Viambishi vya kuunganisha majina vimewasilishwa kwa 'na'; koma zimetumiwa kati ya majina mengine ili orodha iwe ya asili katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Mtindo ni mfupi na wenye hadhi, unaofaa orodha ya nasaba. Majina yametoholewa kutoka Kiebrania badala ya kufuata tahajia za Kiingereza; hakuna tanbihi iliyohitajika kwa kuwa tofauti za utohozi wa Kiingereza hazihusu moja kwa moja toleo la Kiswahili.
