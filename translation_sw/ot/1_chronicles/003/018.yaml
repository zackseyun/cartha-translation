  source_fidelity: 'Majina yote sita ya Kiebrania yamehamishwa kwa uaminifu: Malkiramu (מַלְכִּירָם), Pedaya (פְדָיָה), Shenazari (שֶׁנְאַצַּר), Yekamia (יְקַמְיָה), Hoshama (הוֹשָׁמָע), na Nedabia (נְדַבְיָה). Utohozi wa irabu ya mwisho katika Malkiramu na Shenazari ni wa kawaida na unaosomeka katika Kiswahili; hauongezi wala kuondoa mtu katika orodha. Muundo wa orodha na kiunganishi cha mwisho umehifadhiwa.'
