- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika nasaba, neno hili kwa kawaida humaanisha wana, ingawa linaweza pia kujumuisha wazao; urudiaji wa Kiebrania umehifadhiwa.
- source_word: רְפָיָה
