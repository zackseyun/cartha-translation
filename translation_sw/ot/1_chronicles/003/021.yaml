  rationale: Jina la mtu limetoholewa kwa muundo unaotamkika kwa urahisi katika Kiswahili.
- source_word: עֹבַדְיָה
  choice: Obadia
  rationale: Tahajia iliyozoeleka katika tafsiri za Kiswahili imetumiwa.
- source_word: שְׁכַנְיָה
  choice: Shekania
  rationale: Jina limetoholewa kwa Kiswahili huku sauti ya jina la Kiebrania ikihifadhiwa.
