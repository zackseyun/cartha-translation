base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/016.yaml
  text: 'And the sons of Jehoiakim: Jeconiah his son[a], Zedekiah his son.'
translation:
  language: sw
  text: 'Nao wana wa Yehoyakimu: Yekonia mwanawe[a], Sedekia mwanawe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinasema kwa ufupi: “Yekonia mwanawe, Sedekia mwanawe.” Hii inaweza kusomwa kama mfuatano wa kawaida wa ukoo, ingawa kuna tofauti kuhusu kama majina yote mawili ni wana wa Yehoyakimu au kama Sedekia ni mwana wa Yekonia katika mfuatano unaotajwa hapa.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Nao wana wa
  rationale: Nomino ya wingi katika hali ya kutegemea ina maana ya “wana wa”; kiunganishi וּ־ kimehifadhiwa kwa “Nao” ili kuendeleza mtiririko wa orodha ya ukoo.
- source_word: יְהוֹיָקִים
  choice: Yehoyakimu
  rationale: Jina limetoholewa kwa namna inayofaa Kiswahili na inayokaribia umbo la Kiebrania.
- source_word: יְכָנְיָה
  choice: Yekonia
  rationale: Jina limetoholewa kwa umbo la Kiswahili linalowakilisha יְכָנְיָה bila kulichanganya na maumbo mengine ya jina hilo.
- source_word: בְנ֖/וֹ
  choice: mwanawe
  rationale: Nomino בֵּן yenye kiambishi cha nafsi ya tatu umoja wa kiume imetafsiriwa kwa kawaida kuwa “mwanawe”; uradidi wake umehifadhiwa.
- source_word: צִדְקִיָּה
  choice: Sedekia
  rationale: Jina limetoholewa kwa umbo la Kiswahili linalotambulika na linalowakilisha jina la Kiebrania.
- source_word: בְנֽ/וֹ
  choice: mwanawe
  rationale: Kielezi cha ukoo kilichorudiwa kimetafsiriwa waziwazi, bila kuamua kimyakimya jina ambalo kiambishi chake kinarejelea.
theological_decisions:
- issue: Sintaksia ya ukoo na uhusiano katika taarifa hii fupi na yenye utata
  choice: 'Maneno yamehifadhiwa kwa mpangilio wake: “Yekonia mwanawe, Sedekia mwanawe.”'
  alternative: Inaweza kueleweka kuwa Yekonia na Sedekia wote ni wana wa Yehoyakimu, au kuwa Sedekia ni mwana wa Yekonia katika mfuatano unaotajwa.
  rationale: Kiebrania ni kifupi na hurudia “mwanawe” baada ya kila jina. Tafsiri haioanishi mstari huu na vifungu vingine wala kuamua kimyakimya rejeo la kiambishi; tanbihi inaeleza uwezekano wa usomaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo mfupi wa orodha ya ukoo na utata halisi wa Kiebrania vimehifadhiwa; alama ya tanbihi [a] ipo katika matini kuu.
