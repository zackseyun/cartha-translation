base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/020.yaml
  text: and Hashubah[a], Ohel, Berekiah, Hasadiah[b], and Jushab-hesed—five.
translation:
  language: sw
  text: na Hashuba, Oheli, Berekia, Hasadia, na Yushabu-Hesedi—watano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/חֲשֻׁבָה
  choice: na Hashuba
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili, huku kiunganishi ו kikipewa maana ya “na.”
- source_word: וָ/אֹהֶל
  choice: Oheli
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa kama nomino ya kawaida “hema”; irabu ya mwisho husaidia matamshi ya kawaida ya Kiswahili.
- source_word: וּ/בֶרֶכְיָה
  choice: Berekia
  rationale: Tahajia ya Kiswahili inawakilisha jina la Kiebrania kwa urahisi bila kutumia muundo wa Kiingereza “-iah.”
- source_word: וַֽ/חֲסַדְיָה
  choice: Hasadia
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: י֥וּשַׁב חֶ֖סֶד
  choice: Yushabu-Hesedi
  rationale: Vipashio viwili vya Kiebrania vinaeleweka kuwa jina moja la mtu; kistari huonyesha muungano huo, na tahajia imebadilishwa kwa mfumo wa sauti wa Kiswahili.
- source_word: חָמֵשׁ
  choice: watano
  rationale: Kwa kuwa idadi hiyo inahusu watu watano waliotajwa, ngeli ya watu “watano” ni ya asili katika Kiswahili na inadumisha ufupi wa Kiebrania.
