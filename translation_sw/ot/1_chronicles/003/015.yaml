base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/015.yaml
  text: 'And the sons of Josiah: the firstborn[a], Johanan; the second, Jehoiakim; the third, Zedekiah; the fourth, Shallum.'
translation:
  language: sw
  text: 'Na wana wa Yosia walikuwa hawa: mzaliwa wa kwanza, Yohana; wa pili, Yehoyakimu; wa tatu, Sedekia; wa nne, Shalumu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Shalumu mara nyingi hutambulishwa na Yehoahazi anayetajwa katika 2 Wafalme 23:30–34 na Yeremia 22:11; hapa mwandishi wa Mambo ya Nyakati amehifadhi jina Shalumu katika nasaba ya Yosia.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: Na wana wa
  rationale: Kiunganishi ו kimedumishwa kwa “Na” ili kuendeleza mtiririko wa nasaba, na בְנֵי limetafsiriwa “wana wa” kwa kuwa orodha inawataja wana wa moja kwa moja.
- source_word: יֹאשִׁיָּהוּ
  choice: Yosia
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: הַבְּכוֹר
  choice: mzaliwa wa kwanza
  rationale: Neno בכור linaonyesha nafasi ya kuzaliwa na hadhi ya mwana wa kwanza; “mzaliwa wa kwanza” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: יוֹחָנָן
  choice: Yohanani
  rationale: Jina limetoholewa kwa umbo la kawaida na linalotambulika katika Kiswahili.
- source_word: הַשֵּׁנִי
  choice: wa pili
  rationale: Namba ya mpangilio imetafsiriwa moja kwa moja, huku nomino “mwana” ikieleweka kutokana na muktadha.
- source_word: יְהוֹיָקִים
  choice: Yehoyakimu
  rationale: Tafsiri inafuata jina lililo katika maandishi ya Kiebrania hapa, wala si jina lake la awali, Eliakimu.
- source_word: הַשְּׁלִשִׁי
  choice: wa tatu
  rationale: Namba ya mpangilio imetafsiriwa moja kwa moja na kwa ulinganifu na orodha nzima.
- source_word: צִדְקִיָּהוּ
  choice: Sedekia
  rationale: Hili ndilo umbo la kawaida la jina la mfalme huyu katika Kiswahili cha Biblia.
- source_word: הָרְבִיעִי
  choice: wa nne
  rationale: Namba ya mpangilio imetafsiriwa moja kwa moja na kwa ulinganifu na orodha nzima.
- source_word: שַׁלּוּם
  choice: Shalumu
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili bila kubadilishwa kuwa jina jingine linalohusishwa naye katika vitabu vingine.
theological_decisions:
- issue: Mpangilio wa nasaba dhidi ya mpangilio wa kutawala
  choice: Majina yameachwa katika mpangilio wa wana pamoja na namba zao kama zinavyotolewa na maandishi ya Kiebrania.
  alternative: Kupanga majina upya au kuyabadilisha katika matini kuu ili yafuate mfuatano wa wafalme waliotawala baada ya Yosia.
  rationale: Aya yenyewe ni orodha ya nasaba iliyo na namba za mpangilio. Tofauti inayoonekana inapolinganishwa na simulizi za Wafalme na Yeremia haipaswi kusawazishwa kimya kimya ndani ya tafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaosomeka kwa urahisi. Kirai “walikuwa hawa” kimeongezwa kwa uwazi wa kisintaksia bila kuongeza taarifa mpya. Alama ya tanbihi imewekwa baada ya “Shalumu,” ambako maelezo yake yanahusika moja kwa moja.
