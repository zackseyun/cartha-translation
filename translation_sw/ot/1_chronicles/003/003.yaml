lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: wa tano
  rationale: Kivumishi cha idadi chenye kibainishi kinaendeleza orodha ya wana wa Daudi; Kiswahili hutumia kwa kawaida muundo “wa tano”.
- source_word: שְׁפַטְיָה
  choice: Shefatia
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayoeleweka katika Kiswahili.
- source_word: לַאֲבִיטָל
  choice: aliyezaliwa na Abitali
  rationale: Katika mfumo huu wa nasaba, kihusishi ל kinaonyesha uhusiano wa uzazi. Muundo huu wa Kiswahili unaeleza wazi kwamba Abitali ndiye mama bila kutumia tafsiri ngumu ya neno kwa neno.
- source_word: הַשִּׁשִּׁי
  choice: wa sita
  rationale: Huhifadhi muundo wa orodha ulio sambamba na “wa tano”.
- source_word: יִתְרְעָם
  choice: Ithreamu
  rationale: Jina la mtu limetoholewa kwa namna inayofaa mfumo wa sauti wa Kiswahili huku likibaki karibu na umbo la Kiebrania.
- source_word: לְעֶגְלָה
  choice: aliyezaliwa na Egla
  rationale: Kama ilivyo kwa לַאֲבִיטָל, kihusishi kinaonyesha uzazi; Kiswahili cha kawaida kinahitaji uhusiano huo uelezwe wazi.
- source_word: אִשְׁתּוֹ
  choice: mke wake
  rationale: Katika muktadha wa ndoa, אִשָּׁה yenye kiambishi cha nafsi ya tatu ya kiume humaanisha “mke wake”; hapa inamfafanua Egla kama mke wa Daudi.
theological_decisions:
- issue: Mrejelewa na maana ya “mke wake” katika kirai “Egla, mke wake”
  choice: Kuhifadhi taarifa ya moja kwa moja kwamba Egla alikuwa mke wa Daudi, bila kumpa hadhi ya pekee wala kumtambulisha na mtu mwingine.
  alternative: Kumtambua Egla kuwa Mikali, au kuchukulia kirai hiki kuwa kinampa Egla hadhi ya pekee miongoni mwa wake za Daudi.
  rationale: Kiebrania kinamweka Egla sambamba na “mke wake” lakini hakielezi kwa nini maelezo hayo yametajwa. Tafsiri haiongezi utambulisho au dai ambalo mstari wenyewe hautoi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “aliyezaliwa na” umetumiwa kwa uwazi wa kawaida katika nasaba; majina yametoholewa kwa matumizi ya Kiswahili. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
