  text: the fifth[a], Shephatiah, by Abital; the sixth, Ithream[b], by Eglah his wife.
translation:
  language: sw
  text: Wa tano alikuwa Shefatia, aliyezaliwa na Abitali; wa sita alikuwa Ithreamu, aliyezaliwa na Egla[a], mke wa Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya wafasiri humtambua Egla kuwa Mikali, lakini mstari wenyewe hausemi hivyo.
