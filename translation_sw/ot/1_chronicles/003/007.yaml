- source_word: נֹגַהּ
  choice: Noga
  rationale: Jina la mtu katika orodha ya ukoo; limetoholewa kwa tahajia ya Kiswahili badala ya kutafsiriwa maana yake. Umbo “Noga” linaakisi matamshi ya Kiebrania na halihitaji h ya mwisho isiyotamkwa katika Kiswahili.
- source_word: נֶפֶג
  choice: Nefegi
  rationale: Jina la mtu limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili; f inawakilisha פ isiyo na dageshi, na vokali ya mwisho hurahisisha matamshi ya kawaida ya Kiswahili.
- source_word: יָפִיעַ
  choice: Yafia
  rationale: Jina la mtu limetoholewa kwa kuwakilisha yod ya mwanzo kwa Y na sauti kuu za jina la Kiebrania kwa tahajia ya Kiswahili.
- source_word: וְ
  choice: na
  rationale: Kiunganishi hiki kinaunganisha majina katika orodha; kwa Kiswahili cha kawaida, “na” huwekwa kabla ya jina la mwisho huku koma zikitenganisha majina yaliyotangulia.
