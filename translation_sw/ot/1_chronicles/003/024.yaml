  text: 'And the sons of Elyoenai: Hodaviah[a], Eliashib, Pelaiah, Akkub, Johanan, Delaiah, and Anani—seven.'
translation:
  language: sw
  text: 'Na wana wa Elioenai: Hodavia[a], Eliashibu, Pelaya, Akubu, Yohanani, Delaya na Anani—saba.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tahajia ya jina hili katika Kiebrania si ya kawaida. “Hodavia” linafuata utambulisho wa jadi unaowezekana zaidi; maumbo mengine yanayowezekana ni “Hodia” au unukuzi wa karibu zaidi na tahajia hiyo, “Hodevahu.”
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Na wana wa
  rationale: “Wana wa” ndiyo usemi wa kawaida na sahihi katika orodha za nasaba; kiunganishi “Na” kinahifadhi mwendelezo wa orodha.
- source_word: אֶלְיוֹעֵינַי
  choice: Elioenai
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likifuata matamshi ya Kiebrania.
- source_word: הדיוהו
  choice: Hodavia
  rationale: Tahajia ya Kiebrania si ya kawaida; “Hodavia” linafuata utambulisho wa jadi unaowezekana zaidi na kupewa tanbihi ili kutunza tatizo la maandishi.
- source_word: וְאֶלְיָשִׁיב
  choice: Eliashibu
  rationale: Jina limetoholewa kwa muundo wa kawaida wa majina ya Biblia katika Kiswahili.
- source_word: וּפְלָיָה
  choice: Pelaya
  rationale: Unukuzi wa jina la Kiebrania unaolingana na mfumo wa sauti na tahajia ya Kiswahili.
- source_word: וְעַקּוּב
  choice: Akubu
  rationale: Unukuzi wa jina unaohifadhi konsonanti kuu za Kiebrania katika umbo linalotamkika kwa Kiswahili.
- source_word: וְיוֹחָנָן
  choice: Yohanani
  rationale: Unukuzi wa Kiswahili unaokaribia umbo la Kiebrania Yohanan bila kulichanganya na umbo refu la jina hilo.
- source_word: וּדְלָיָה
  choice: Delaya
  rationale: Unukuzi wa kawaida na unaosomeka wa jina la Kiebrania.
- source_word: וַעֲנָנִי
  choice: na Anani
  rationale: Kiunganishi kimetafsiriwa kwa kawaida mbele ya jina la mwisho katika orodha.
- source_word: שִׁבְעָה
  choice: jumla yao saba
  rationale: Neno la hesabu linahifadhiwa kama muhtasari wa wazi wa idadi ya wana waliotajwa.
