  text: אֲמַצְיָ֧הוּ בְנ֛/וֹ עֲזַרְיָ֥ה בְנ֖/וֹ יוֹתָ֥ם בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/012.yaml
  text: Amaziah his son[a], Azariah his son, Jotham his son.
translation:
  language: sw
  text: Amazia mwanawe, Azaria[a] mwanawe, Yothamu mwanawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mfalme huyu anajulikana pia mahali pengine kwa jina Uzia.
    reason: alternative_name
lexical_decisions:
- source_word: אֲמַצְיָהוּ
  choice: Amazia
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: בְנוֹ
  choice: mwanawe
  rationale: Neno בֵּן lenye kiambishi cha nafsi ya tatu umoja wa kiume humaanisha moja kwa moja ‘mwanawe’; umbo hili fupi na la asili linafaa katika orodha ya ukoo.
- source_word: עֲזַרְיָה
  choice: Azaria
  rationale: Tafsiri inafuata moja kwa moja jina lililo katika maandishi ya Kiebrania hapa, badala ya kulibadilisha kuwa jina lake jingine, Uzia.
- source_word: יוֹתָם
  choice: Yothamu
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili.
theological_decisions:
- issue: Lugha ya uhusiano wa mwana katika ukoo wa kifalme
  choice: Kurudia ‘mwanawe’ kama ilivyo katika Kiebrania.
  alternative: Kutumia ‘mzao wake’ ili kuruhusu uwezekano wa vizazi kurukwa katika orodha za ukoo.
  rationale: Maandishi yanarudia wazi בְנוֹ (‘mwanawe’). Hakuna sababu ya kimuktadha au kiteolojia ya kulipanua hapa kuwa ‘mzao wake’; hivyo tafsiri inadumisha uwazi kwa chanzo.
- issue: Majina Azaria na Uzia
  choice: Kutumia ‘Azaria’ katika mstari na kutaja ‘Uzia’ katika tanbihi.
  alternative: Kutumia ‘Uzia’ katika mstari ili kulinganisha jina na sehemu nyingine.
  rationale: Maandishi ya Kiebrania ya mstari huu yana עֲזַרְיָה, Azaria. Kutumia Uzia katika mstari kungeoanisha maandishi badala ya kufuata umbo la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, yenye hadhi, na ya kawaida kwa orodha ya ukoo. ‘Mwanawe’ limerudiwa ili kuhifadhi muundo wa Kiebrania. Alama ya tanbihi imewekwa baada ya ‘Azaria’, jina linalohusika.
