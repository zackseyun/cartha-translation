lexical_decisions:
- source_word: וּ/בֶן
  choice: Mwana wa
  rationale: Muundo huu unaendeleza orodha ya ukoo kwa Kiswahili cha kawaida; kiunganishi cha Kiebrania kinaakisiwa katika mtiririko wa sentensi bila kulazimisha neno la ziada mwanzoni.
- source_word: שְׁלֹמֹה
  choice: Sulemani
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: רְחַבְעָם
  choice: Rehoboamu
  rationale: Umbo la jina linalotambulika katika mapokeo ya Biblia ya Kiswahili na linalowakilisha jina la Kiebrania.
- source_word: אֲבִיָּה
  choice: Abiya
  rationale: Huwakilisha umbo אֲבִיָּה lililotumika hapa katika Mambo ya Nyakati, bila kulichanganya na umbo tofauti Abiyamu linalopatikana katika Wafalme.
- source_word: בְנ/וֹ
  choice: mwanawe alikuwa
  rationale: Kiambishi cha nafsi ya tatu ya kiume kinaonyesha kuwa kila mfalme ni mwana wa yule aliyetajwa kabla yake; kurudia muundo huu kunadumisha mfuatano wa ukoo kwa uwazi.
- source_word: אָסָא
  choice: Asa
  rationale: Ni umbo la kawaida la Kiswahili la jina hili.
- source_word: יְהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Ni umbo linalotambulika katika Kiswahili cha Biblia na linawakilisha jina la Kiebrania.
