  text: Mwana wa Sulemani alikuwa Rehoboamu; Abiya mwanawe[a], Asa mwanawe, na Yehoshafati mwanawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Abiya.” Katika 1 Wafalme, mfalme huyu pia anatajwa kwa jina jingine, “Abiyamu.”'
