lexical_decisions:
- source_word: יוֹרָם
  choice: Yoramu
  rationale: Jina la Kiebrania limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Neno בֵּן lenye kiambishi cha nafsi ya tatu umoja wa kiume humaanisha moja kwa moja ‘mwanawe.’ Ingawa katika nasaba linaweza kumaanisha mzao wa baadaye, hapa mfululizo mfupi wa urithi wa kifalme unaunga mkono maana ya kawaida.
- source_word: אֲחַזְיָהוּ
  choice: Ahazia
  rationale: Jina limetoholewa kwa umbo la kawaida na linalotambulika katika Kiswahili cha Biblia.
- source_word: יוֹאָשׁ
  choice: Yoashi
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili, likihifadhi matamshi ya jina la Kiebrania.
