  text: 'And the sons of Shecaniah: Shemaiah. And the sons of Shemaiah: Hattush[a], Igal, Bariah, Neariah, and Shaphat—six.'
translation:
  language: sw
  text: 'Na wana wa Shekania: Shemaya. Na wana wa Shemaya: Hatushi[a], Igali, Baria, Nearia na Shafati—sita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maandishi ya Kiebrania yanasema “sita,” ingawa majina matano tu yameorodheshwa hapa katika Maandishi ya Kimasoreti. Huenda hii inaonyesha tatizo la maandishi au jina lililoachwa wakati wa kunakili.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Na wana wa
  rationale: Neno בְּנֵי ni wingi tegemezi wa ‘wana.’ Ingawa katika nasaba linaweza kumaanisha wazao kwa upana, hapa fomula inafuatiwa na majina ya watu, hivyo ‘wana wa’ ndilo chaguo la moja kwa moja.
- source_word: שְׁכַנְיָה
  choice: Shekania
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Jina la mtu limetoholewa kwa kufuata sauti za Kiebrania na mfumo wa tahajia ya Kiswahili.
- source_word: חַטּוּשׁ
  choice: Hatushi
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili; ‘sh’ imewakilishwa kwa ‘sh’ na vokali ya mwisho imeongezwa ili kurahisisha matamshi ya kawaida.
- source_word: יִגְאָל
  choice: Igali
  rationale: Jina limetoholewa kwa umbo linalosomeka kwa Kiswahili bila kulibadili kuwa jina jingine linalofanana.
- source_word: בָרִיחַ
  choice: Baria
  rationale: Uandishi wa Kimasoreti hapa ni בָרִיחַ; ‘Baria’ huhifadhi tofauti hiyo badala ya kuingiza umbo la jina Beria kutoka mahali pengine.
- source_word: נְעַרְיָה
  choice: Nearia
  rationale: Jina limetoholewa kwa namna inayoakisi konsonanti na vokali za Kiebrania huku likibaki rahisi kusomeka kwa Kiswahili.
- source_word: שָׁפָט
  choice: Shafati
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili na vokali ya mwisho kusaidia matamshi.
- source_word: שִׁשָּׁה
  choice: wote sita
  rationale: Namba ya Kiebrania imehifadhiwa moja kwa moja. ‘Wote sita’ huwasilisha jumla iliyotajwa katika maandishi hata kama majina matano tu yameorodheshwa.
