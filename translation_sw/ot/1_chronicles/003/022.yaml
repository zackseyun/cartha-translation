translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa moja kwa moja unaofaa orodha ya nasaba. Muundo unaorudiwa ‘Na wana wa’ umehifadhiwa ili kuakisi fomula ya Kiebrania. Kitambulisho cha tanbihi [a] kimewekwa baada ya jina la kwanza katika orodha, kwa kufuata safu ya mashauriano, huku maelezo yakifafanua hitilafu ya idadi bila kuisawazisha kimya kimya.
