lexical_decisions:
- source_word: אֱלִישָׁמָע
  choice: Elishama
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, bila kutafsiri maana yake.
- source_word: אֶלְיָדָע
  choice: Eliada
  rationale: Jina la mtu limetoholewa moja kwa moja kwa muundo unaofaa Kiswahili.
- source_word: אֱלִיפֶלֶט
  choice: Elifeleti
  rationale: Jina la mtu limetoholewa kutokana na umbo kamili la Kiebrania lililo katika aya hii; vokali ya mwisho husaidia matamshi ya kawaida ya Kiswahili.
- source_word: וְ / וֶ
  choice: na
  rationale: Viunganishi vinavyotangulia majina yote vimehifadhiwa, kwa kuwa aya hii ni mwendelezo wa orodha kutoka aya zilizotangulia.
- source_word: תִּשְׁעָה
  choice: jumla yao tisa
  rationale: Neno ni idadi ‘tisa’; katika muktadha ni hesabu ya kuhitimisha wana waliotajwa katika aya 5–8. ‘Jumla yao’ huifanya kazi hiyo ieleweke kwa Kiswahili bila kubadili idadi.
