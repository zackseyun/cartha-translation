base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/002.yaml
  text: the third[a], Absalom son of Maacah, daughter of Talmai king of Geshur; the fourth, Adonijah son of Haggith.
translation:
  language: sw
  text: wa tatu, Absalomu mwana wa Maaka, binti wa Talmai[a] mfalme wa Geshuri; wa nne, Adoniya mwana wa Hagithi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au yawezekana, “mjukuu wa kike wa Talmai,” kwa kuwa neno la Kiebrania linalotafsiriwa “binti” wakati mwingine linaweza kumaanisha mzao wa kike wa mbali zaidi katika nasaba. Hapa Kiebrania husoma moja kwa moja, “binti wa Talmai, mfalme wa Geshuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁלִישִׁי
  choice: wa tatu
  rationale: Nambari ya mpangilio yenye kibainishi inaendeleza orodha ya wana wa Daudi; Kiswahili hutumia kwa kawaida “wa tatu” katika muundo huu.
- source_word: לְאַבְשָׁלוֹם
  choice: Absalomu
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Inaonyesha uhusiano wa uzazi katika nasaba; “mwana wa” ni usemi wa kawaida na unaofaa kwa mwana wa kiume katika Kiswahili.
- source_word: מַעֲכָה
  choice: Maaka
  rationale: Jina la mtu limetoholewa moja kwa moja kwa tahajia inayosomeka kwa Kiswahili.
- source_word: בַּת
  choice: binti ya
  rationale: Maana ya moja kwa moja ni mtoto wa kike wa Talmai. Ingawa neno linaweza kutaja mzao wa kike wa mbali katika baadhi ya nasaba, mstari huu hauhitaji kuacha maana yake ya msingi.
- source_word: תַּלְמַי
  choice: Talmai
  rationale: Jina la mtu limetoholewa kwa karibu na umbo la Kiebrania.
- source_word: מֶלֶךְ גְּשׁוּר
  choice: mfalme wa Geshuri
  rationale: Muundo huu unamtambulisha Talmai kuwa mtawala wa Geshuri; “mfalme wa” ni muundo wa asili wa Kiswahili.
- source_word: הָרְבִיעִי
  choice: wa nne
  rationale: Nambari hii ya mpangilio inaendeleza orodha kwa muundo wa kawaida wa Kiswahili.
- source_word: אֲדֹנִיָּה
  choice: Adoniya
  rationale: Jina limetoholewa kwa umbo linaloeleweka na kutamkika kwa urahisi katika Kiswahili.
- source_word: חַגִּית
  choice: Hagithi
  rationale: Jina limetoholewa kwa kufuata kwa karibu konsonanti za Kiebrania huku likibaki rahisi kutamkwa kwa Kiswahili.
theological_decisions:
- issue: Uhusiano wa Maaka na Talmai
  choice: binti ya Talmai
  alternative: mjukuu wa kike wa Talmai
  rationale: בַּת humaanisha moja kwa moja “binti”; uwezekano wa maana pana zaidi katika nasaba umehifadhiwa katika tanbihi bila kubadili maandishi makuu.
translation_notes:
  register: Mtindo ni mfupi na wa heshima, unaofaa kwa orodha ya nasaba. Koma baada ya “Maaka” inaonyesha wazi kwamba Maaka ndiye binti ya Talmai. Hakuna tanbihi iliyowekwa kwa sababu alama zote za tanbihi lazima ziwe katika maandishi makuu, na maana ya moja kwa moja ya Kiebrania inatosha hapa.
