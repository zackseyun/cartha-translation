base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/036.yaml
  text: 'The sons of Eliphaz: Teman[a], Omar, Zephi, Gatam, Kenaz, Timna[b], and Amalek.'
translation:
  language: sw
  text: Wana wa Elifazi walikuwa Temani, Omari, Sefi[a], Gatamu, Kenazi, Timna[b], na Amaleki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina Sefi; Mwanzo 36:11 una umbo tofauti la jina hilo, Sefo.
    reason: textual_variant
  - marker: b
    text: Mwanzo 36:12 unamtaja Timna kuwa suria wa Elifazi na Amaleki kuwa mwanawe. Hapa Mambo ya Nyakati yanaweka majina yote mawili katika orodha ya wana wa Elifazi.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa neno בן katika hali ya kuunganisha, ukitanguliza orodha ya nasaba. “Wana wa” ni tafsiri ya moja kwa moja na ya kawaida kuliko “wazao wa” katika muktadha huu.
- source_word: אֱלִיפָז
  choice: Elifazi
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: תֵּימָן
  choice: Temani
  rationale: Jina la mtu katika orodha ya nasaba; limetoholewa kwa muundo wa kawaida wa majina ya Biblia katika Kiswahili.
- source_word: אוֹמָר
  choice: Omari
  rationale: Jina la mtu limetoholewa kwa Kiswahili.
- source_word: צְפִי
  choice: Sefi
  rationale: Huhifadhi umbo la jina lililo katika Mambo ya Nyakati, צְפִי, bila kulisawazisha na umbo tofauti la Mwanzo 36:11.
- source_word: גַעְתָּם
  choice: Gatamu
  rationale: Jina la mtu limetoholewa kwa namna inayosomeka kwa urahisi katika Kiswahili.
- source_word: קְנַז
  choice: Kenazi
  rationale: Jina la mtu limetoholewa kwa muundo uliozoeleka katika Kiswahili cha Biblia.
- source_word: תִמְנָע
  choice: Timna
  rationale: Jina limehifadhiwa kama jina la mtu katika orodha hii, kulingana na matini ya Kiebrania.
- source_word: עֲמָלֵק
  choice: Amaleki
  rationale: Jina la mtu au babu wa kabila limetoholewa kwa namna ya kawaida katika Kiswahili.
- source_word: וְ / וַ
  choice: orodha yenye koma na “na” kabla ya jina la mwisho
  rationale: Kiebrania hurudia viunganishi katika orodha. Kiswahili cha sasa hutumia koma na “na” kabla ya kipengele cha mwisho, jambo linalohifadhi muundo wa orodha bila kufanya sentensi iwe nzito.
theological_decisions:
- issue: Uhusiano wa Timna na Amaleki katika mstari huu ukilinganishwa na Mwanzo 36
  choice: Timna na Amaleki wote wameorodheshwa katika matini kuu chini ya “Wana wa Elifazi,” kama Mambo ya Nyakati inavyowasilisha majina hayo.
  alternative: Kumchukulia Timna kuwa suria wa Elifazi na Amaleki kuwa mwanawe, kwa kufuata Mwanzo 36:12.
  rationale: Kiebrania cha mstari huu kinatoa orodha sahili baada ya “Wana wa Elifazi.” Tafsiri haipaswi kuibadili ili kuilinganisha kimya-kimya na simulizi sambamba; tofauti hiyo inaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Majina yametoholewa kwa maumbo yanayofaa usomaji wa Kiswahili. Neno “walikuwa” limeongezwa ili sentensi ya orodha iwe ya asili katika Kiswahili bila kubadili maana.
