  text: na Waarvadi[a], na Wazemari, na Wahamathi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Majina haya ya kikabila katika Kiebrania yako kisarufi katika umoja, lakini yanatumika kwa maana ya pamoja, yakimaanisha watu au koo: Mwarvadi, Mzemari, Mhamathi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: na
  rationale: Katika orodha hii ya nasaba, וְ huunganisha kila kundi linalofuata, huku אֵת ikiwa alama ya yambwa isiyohitaji kutafsiriwa kwa neno tofauti katika Kiswahili.
- source_word: הָאַרְוָדִי
  choice: Waarvadi
  rationale: Ingawa jina hili la kabila liko katika umbo la umoja kwa Kiebrania, hapa linatumika kwa maana ya pamoja. Kiambishi Wa- kinaonyesha watu wa Arvadi kwa Kiswahili cha kawaida.
- source_word: הַצְּמָרִי
  choice: Wazemari
  rationale: Umbo la Kiebrania ni la umoja lakini maana yake ni kundi la watu. Wazemari huhifadhi jina la kikabila na kuonyesha wingi kwa njia ya kawaida ya Kiswahili.
- source_word: הַחֲמָתִי
  choice: Wahamathi
  rationale: Jina hili la kikabila linawataja kwa pamoja watu waliohusishwa na Hamathi; umbo lenye Wa- linafikisha maana hiyo kwa Kiswahili.
