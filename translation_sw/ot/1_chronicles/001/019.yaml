  text: וּ/לְ/עֵ֥בֶר יֻלַּ֖ד שְׁנֵ֣י בָנִ֑ים שֵׁ֣ם הָ/אֶחָ֞ד פֶּ֗לֶג כִּ֤י בְ/יָמָי/ו֙ נִפְלְגָ֣ה הָ/אָ֔רֶץ וְ/שֵׁ֥ם אָחִ֖י/ו יָקְטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/019.yaml
  text: 'And to Eber were born two sons: the name of the one was Peleg[a], because in his days the earth was divided; and his brother’s name was Joktan.'
translation:
  language: sw
  text: 'Eberi alizaliwa wana wawili: jina la mmoja lilikuwa Pelegi, kwa sababu katika siku zake dunia iligawanyika[a]; na jina la ndugu yake lilikuwa Yoktani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nchi iligawanyika.” Neno la Kiebrania linaweza kumaanisha dunia nzima au nchi/eneo fulani; matini haisemi mgawanyiko huo ulikuwa wa aina gani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעֵבֶר יֻלַּד
  choice: Eberi akazaliwa
  rationale: Muundo huu wa Kiswahili unahifadhi kauli tendwa ya Kiebrania kwa njia ya kawaida na yenye kueleweka, bila kuibadili kuwa kauli ya kwamba Eberi aliwazaa.
- source_word: שְׁנֵי בָנִים
  choice: wana wawili
  rationale: Neno 'wana' linahifadhi maana ya watoto wa kiume katika muktadha huu wa nasaba.
- source_word: שֵׁם הָאֶחָד
  choice: Jina la mmoja
  rationale: Huhifadhi utofautishaji wa Kiebrania bila kutafsiri אֶחָד kuwa 'wa kwanza,' jambo ambalo lingezidisha maana ya matini.
- source_word: פֶּלֶג
  choice: Pelegi
  rationale: Jina limetoholewa kulingana na matumizi yanayoeleweka katika Kiswahili.
- source_word: כִּי בְיָמָיו
  choice: kwa sababu katika siku zake
  rationale: Kifungu hiki kinaonyesha sababu inayohusishwa na jina Pelegi na kinadumisha nahau ya wakati ya matini chanzo.
- source_word: נִפְלְגָה הָאָרֶץ
  choice: dunia iligawanyika
  rationale: Kauli tendeka 'iligawanyika' huakisi umbo la Kiebrania; 'dunia' huhifadhi maana pana ya הָאָרֶץ bila kuzuia uwezekano wa maana ya nchi au eneo.
- source_word: וְשֵׁם אָחִיו
  choice: na jina la ndugu yake
  rationale: Ni tafsiri wazi na ya kawaida inayohifadhi uhusiano wa umilikaji katika Kiebrania.
- source_word: יָקְטָן
  choice: Yoktani
  rationale: Jina limetoholewa kwa namna ya kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya kugawanyika kwa הָאָרֶץ katika taarifa kuhusu jina la Pelegi
  choice: dunia iligawanyika
  alternative: nchi iligawanyika; au maelezo mahususi kwamba watu, lugha, maeneo, au mabara yaligawanyika
  rationale: Matini ya Kiebrania haisemi mgawanyiko huo ulikuwa wa aina gani. Tafsiri kuu inadumisha upana huo, na tanbihi inaonyesha uwezekano wa maana ya 'nchi' bila kuingiza ufafanuzi wa kiitikadi au kihistoria.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa sentensi unafuata mtiririko wa nasaba huku ukibaki wa kawaida kwa msomaji wa leo.
