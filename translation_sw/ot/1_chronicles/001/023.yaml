base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/023.yaml
  text: and Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: sw
  text: na Ofiri, na Havila, na Yobabu. Hao wote walikuwa wana wa Yoktani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wazao wa Yoktani.” Kiebrania kinasema “wana wa Yoktani,” lakini katika orodha za nasaba neno “wana” wakati mwingine linaweza kutumiwa kwa maana pana ya watu wa ukoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: na
  rationale: Kiambishi וְ kinaunganisha majina katika orodha, huku אֶת ikiwa alama ya yambwa isiyotafsiriwa moja kwa moja katika Kiswahili.
- source_word: אוֹפִיר
  choice: Ofiri
  rationale: Jina limetoholewa kwa umbo linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: חֲוִילָה
  choice: Havila
  rationale: Jina limetoholewa kwa kufuata matamshi ya Kiebrania na mtindo wa majina ya Biblia katika Kiswahili.
- source_word: יוֹבָב
  choice: Yobabu
  rationale: Jina limetoholewa kwa umbo la kawaida na linalosomeka kwa urahisi katika Kiswahili.
- source_word: כָּל אֵלֶּה
  choice: Hao wote
  rationale: Kauli hii inajumlisha watu waliotajwa kabla yake; kwa watu, “hao wote” ni Kiswahili cha kawaida na huhifadhi msisitizo wa kiashiria.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Neno la Kiebrania ni wingi wa kiume wa “mwana”; “wana wa” huhifadhi maana yake ya moja kwa moja, huku uwezekano wa maana pana ya ukoo ukielezwa katika tanbihi.
- source_word: יָקְטָן
  choice: Yoktani
  rationale: Jina limetoholewa kwa kuzingatia umbo la Kiebrania na kupewa irabu ya mwisho ili lisomeke kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Upeo wa maana ya בְּנֵי katika nasaba
  choice: wana wa
  alternative: wazao wa
  rationale: Maandishi yanasema moja kwa moja “wana wa,” lakini katika nasaba neno hilo linaweza pia kumaanisha watu wa ukoo mpana. Tafsiri kuu huhifadhi umbo la Kiebrania, na tanbihi huhifadhi uwezekano huo bila kuamua zaidi ya ushahidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye hadhi unaofaa orodha ya nasaba. Majina yametoholewa kwa namna inayosomeka kwa urahisi, na urudiaji wa “na” umehifadhi muundo wa orodha ya Kiebrania.
