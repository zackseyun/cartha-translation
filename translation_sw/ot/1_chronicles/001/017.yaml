  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud, and Aram; Uz, Hul, Gether, and Meshech.'
translation:
  language: sw
  text: 'Wana wa Shemu: Elamu, Ashuru, Arpakshadi, Ludi na Aramu; Usi, Huli, Getheri na Mesheki.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika orodha sambamba ya ukoo, Mwanzo 10:23 inasema “Mashi” badala ya “Mesheki.”
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa neno בן katika hali ya kuunganishwa, ukitanguliza orodha ya ukoo; “wana wa” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili cha Biblia.
- source_word: שֵׁם
  choice: Shemu
  rationale: Jina limetoholewa kwa umbo linalotambulika na lililozoeleka katika Kiswahili.
- source_word: עֵילָם
  choice: Elamu
  rationale: Jina limetoholewa kwa kufuata maumbo ya kawaida ya majina ya Kiebrania katika Kiswahili.
- source_word: אַשּׁוּר
  choice: Ashuru
  rationale: Katika orodha hii ya ukoo, neno hili limetolewa kama jina la mtu, si kama jina la nchi ya Ashuru.
- source_word: אַרְפַּכְשַׁד
  choice: Arpakshadi
  rationale: Utohozi unaakisi kwa karibu konsonanti za jina la Kiebrania na unabaki rahisi kutamka kwa Kiswahili.
- source_word: לוּד
  choice: Ludi
  rationale: Neno la Kiebrania hapa ni jina la umoja, si jina la kabila la wingi.
- source_word: אֲרָם
  choice: Aramu
  rationale: Muktadha wa ukoo unapendelea jina la babu Aramu badala ya jina la baadaye la eneo, Shamu.
- source_word: עוּץ
  choice: Usi
  rationale: Jina limetoholewa kwa sauti inayokaribia עוּץ na kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: חוּל
  choice: Huli
  rationale: Utohozi wa moja kwa moja wa jina la Kiebrania kwa muundo wa matamshi ya Kiswahili.
- source_word: גֶתֶר
  choice: Getheri
  rationale: Utohozi unaohifadhi kwa karibu sauti za jina la Kiebrania huku ukilitamkisha kwa kawaida katika Kiswahili.
- source_word: מֶשֶׁךְ
  choice: Mesheki
  rationale: Maandishi ya Kimasora katika mstari huu yanasoma Mesheki; tofauti ya Mashi katika Mwanzo 10:23 imehifadhiwa katika tanbihi.
