  text: Jetur[a], Naphish, and Kedemah. These were the sons of Ishmael.
translation:
  language: sw
  text: Yeturi, Nafishi na Kedema.[a] Hawa ndio wana wa Ishmaeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Kedema linaweza pia kuandikwa “Qedema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְטוּר
  choice: Yeturi
  rationale: Jina hili limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili, huku sauti ya mwanzo ya Kiebrania yod ikiwakilishwa kwa “Y” na kuongezwa irabu ya mwisho kwa urahisi wa matamshi.
- source_word: נָפִישׁ
  choice: Nafishi
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa umbo linalotamkika kwa kawaida katika Kiswahili.
- source_word: וָ/קֵדְמָה
  choice: na Kedema
  rationale: Kiunganishi ו kimetafsiriwa “na”; jina קֵדְמָה limetoholewa “Kedema,” kwa kuwakilisha qof kwa “K,” kama ilivyo kawaida katika majina mengi ya kibiblia ya Kiswahili.
- source_word: אֵלֶּה הֵם
  choice: Hao ndio waliokuwa
  rationale: Muundo huu wa utambulisho umetolewa kwa Kiswahili cha kawaida cha masimulizi ya ukoo. “Hao ndio” hutambulisha majina yaliyotangulia, na “waliokuwa” huafikiana na muktadha wa kihistoria.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika orodha hii neno linawahusu watoto wa kiume wa Ishmaeli; “wana wa” huhifadhi maana mahususi ya Kiebrania bila kulipanua kuwa “wazao.”
- source_word: יִשְׁמָעֵאל
  choice: Ishmaeli
  rationale: Imetumiwa namna ya jina hili iliyozoeleka katika Kiswahili cha Biblia.
