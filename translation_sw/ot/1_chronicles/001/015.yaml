lexical_decisions:
- source_word: וְאֶת
  choice: na
  rationale: Kiunganishi וְ kimetafsiriwa ‘na’; kiashiria cha yambwa אֶת hakina neno la kawaida linalolingana nacho katika Kiswahili, hivyo hakikutafsiriwa tofauti.
- source_word: הַחִוִּי
  choice: Wahivi
  rationale: Hili ni jina la kabila au jamii. Ingawa Kiebrania limetumia umbo la umoja lenye kibainishi, katika orodha hii ya nasaba linawakilisha kundi la watu; umbo la Kiswahili la wingi ‘Wahivi’ ni la asili na wazi.
- source_word: הָעַרְקִי
  choice: Waarki
  rationale: Jina hili la kikabila lina maana ya kijamii katika orodha hii; kwa hiyo limetolewa kwa wingi kama ‘Waarki’.
- source_word: הַסִּינִי
  choice: Wasini
  rationale: Jina hili la kikabila linarejelea jamii, hivyo umbo la wingi ‘Wasini’ linafikisha maana ya muktadha kwa Kiswahili cha kawaida.
