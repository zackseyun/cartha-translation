translation:
  language: sw
  text: Arpakshadi[b] alimza Shela[a], naye Shela alimza Eberi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, Shelah; katika baadhi ya tafsiri na vifungu vinavyohusiana vya nasaba, jina hili huandikwa kwa umbo la kimapokeo “Sala.”
    reason: lexical_alternative
  - marker: b
