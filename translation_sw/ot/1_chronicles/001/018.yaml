lexical_decisions:
- source_word: אַרְפַּכְשַׁד
  choice: Arpakshadi
  rationale: Jina limetoholewa moja kwa moja kutoka umbo la Kiebrania kwa tahajia inayosomeka kwa kawaida katika Kiswahili; umbo la kimapokeo linaloathiriwa na Kigiriki limewekwa katika tanbihi.
- source_word: יָלַד
  choice: alimza
  rationale: Katika nasaba hii kitenzi kinaonyesha kuwa mtu alizaa au akawa mzazi wa mtu aliyetajwa; “alimza” ni kifupi, cha asili katika Kiswahili, na hakidai kwamba nasaba lazima iwe ya kizazi cha moja kwa moja kuliko matumizi ya lugha ya nasaba yanavyoruhusu.
- source_word: אֶת
  choice: '[halikutafsiriwa kando]'
  rationale: Ni kiashiria cha yambwa moja kwa moja katika Kiebrania na hakina neno huru linalolingana nalo katika Kiswahili.
- source_word: שָׁלַח / שֶׁלַח
  choice: Shela
  rationale: Maumbo mawili yenye tofauti ndogo katika vokali za Kimasora yanamtaja mtu yuleyule; yametolewa kwa umbo moja thabiti la Kiswahili. Umbo mbadala la kimapokeo “Sala” limehifadhiwa katika tanbihi.
- source_word: עֵבֶר
  choice: Eberi
  rationale: Jina limetoholewa kutoka Kiebrania עֵבֶר; irabu ya mwisho hurahisisha matamshi ya kawaida ya Kiswahili bila kuingiza umbo lisilo sahihi la “Heberi”.
