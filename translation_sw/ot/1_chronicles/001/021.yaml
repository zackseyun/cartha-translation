  rationale: Jina limetoholewa kwa kuzingatia matamshi ya Kiebrania; herufi ya mwisho ה hapa haihitaji kuwakilishwa kwa konsonanti tofauti katika Kiswahili.
- source_word: וְ/אֶת ... וְ/אֶת ... וְ/אֶת
  choice: na ... na ... na ...
  rationale: Kurudiwa kwa kiunganishi וְ kumehifadhiwa kwa mtindo unaofaa wa orodha ya nasaba; alama ya yambwa אֶת haina neno linalolingana moja kwa moja katika Kiswahili.
