  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּ֨מָת֙ בַּ֣עַל חָנָ֔ן וַ/יִּמְלֹ֤ךְ תַּחְתָּי/ו֙ הֲדַ֔ד וְ/שֵׁ֥ם עִיר֖/וֹ פָּ֑עִי וְ/שֵׁ֨ם אִשְׁתּ֤/וֹ מְהֵיטַבְאֵל֙ בַּת מַטְרֵ֔ד בַּ֖ת מֵ֥י זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/050.yaml
  text: Baal-hanan died[a], and Hadad reigned in his place. The name of his city was Pai, and the name of his wife was Mehetabel daughter of Matred[b], daughter of Mezahab.
translation:
  language: sw
  text: Baali-Hanani akafa, na Hadadi akatawala mahali pake. Jina la mji wake lilikuwa Pai,[a] na jina la mke wake lilikuwa Mehetabeli, binti ya Matredi, binti ya Mezahabu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mwanzo 36:39 lina jina la mji huu kama “Pau,” lakini Mambo ya Nyakati lina “Pai.”
    reason: textual_variant
  - marker: b
    text: Katika matumizi ya nasaba, marudio ya “binti ya” yanaweza kumaanisha “mjukuu wa,” lakini hapa maneno ya Kiebrania yamehifadhiwa kwa tafsiri ya karibu zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kitenzi cha simulizi kutoka מות kinaendeleza mfuatano wa wafalme; Kiswahili hutaja mtenda wazi kwa kiambishi cha nafsi.
- source_word: בַּעַל חָנָן
  choice: Baali-Hanani
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili, huku muundo wake wa sehemu mbili ukihifadhiwa kwa kistari.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: akatawala mahali pake
  rationale: Kauli hii inaonyesha Hadadi kurithi utawala wa Baali-Hanani; tafsiri hii ni ya kawaida na huhifadhi maana ya תחתיו.
- source_word: הֲדַד
  choice: Hadadi
  rationale: Jina limetoholewa kwa mfumo wa kawaida wa Kiswahili.
- source_word: וְשֵׁם עִירוֹ
  choice: Jina la mji wake lilikuwa
  rationale: Kishazi cha Kiebrania kisicho na kitenzi kimewekewa 'lilikuwa' ili kiwe cha asili katika Kiswahili; 'wake' inamrejelea Hadadi aliyetajwa karibuni.
- source_word: פָּעִי
  choice: Pai
  rationale: Huhifadhi umbo la jina lililo katika Mambo ya Nyakati, badala ya kuingiza umbo tofauti la Mwanzo 36:39.
- source_word: וְשֵׁם אִשְׁתּוֹ
  choice: na jina la mke wake lilikuwa
  rationale: Hufuata kauli ya Kiebrania ya kutaja jina kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: מְהֵיטַבְאֵל
  choice: Mehetabeli
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: binti ya Matredi, binti ya Mezahabu
  rationale: Marudio ya בת yamehifadhiwa badala ya kuamua kimya kimya kuwa mtu wa pili ni babu au nyanya; dokezo linaeleza uwezekano wa matumizi mapana ya nasaba.
- source_word: מֵי זָהָב
  choice: Mezahabu
  rationale: Katika muktadha huu neno limetendewa kama jina la mtu na kutoholewa, wala halijatafsiriwa kwa maana yake ya kimsamiati.
