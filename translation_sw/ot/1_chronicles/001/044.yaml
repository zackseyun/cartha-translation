  yaml_path: translation/ot/1_chronicles/001/044.yaml
  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: sw
  text: Bela akafa, na Yobabu mwana wa Zera kutoka Bosra[a] akatawala badala yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wa Bosra.” Kihusishi cha Kiebrania kinaweza kuonyesha asili au uhusiano na mji huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Wayyiqtol ya מוּת inaendeleza mfululizo wa matukio; kiambishi «a-» humrejelea Bela, na «-ka-» huonyesha tukio linalofuata katika simulizi.
- source_word: בָּלַע
  choice: Bela
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika kaida hii ya urithi wa kifalme, מלך humaanisha kuchukua na kushika utawala; «akatawala» ni fupi, ya kawaida, na inafaa mtindo wa orodha hii.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Katika muktadha wa kurithiana kwa watawala, neno hili humaanisha kuchukua nafasi ya mtangulizi.
- source_word: יוֹבָב
  choice: Yobabu
  rationale: Jina la mtu limetoholewa kwa kaida ya Kiswahili.
- source_word: בֶּן זֶרַח
  choice: mwana wa Zera
  rationale: Muundo wa Kiebrania unaotaja nasaba umetafsiriwa wazi na moja kwa moja.
- source_word: מִבָּצְרָה
  choice: kutoka Bosra
  rationale: Kihusishi מִן kwa kawaida huonyesha asili, ingawa hapa kinaweza pia kuonyesha uhusiano na mji wa Bosra; uwezekano huo umehifadhiwa katika tanbihi.
