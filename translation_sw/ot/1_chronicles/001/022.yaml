  text: Ebali[a], Abimaeli, na Sheba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika orodha ya ukoo inayolingana katika Mwanzo 10:28, jina hili linaonekana kama “Obali.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶת
  choice: na
  rationale: Kiunganishi וְ pamoja na kiashiria cha yambwa אֶת hutanguliza kila jina katika orodha. Kiswahili hakihitaji kutafsiri kiashiria hicho kando; uratibu wa orodha unaonyeshwa kwa koma na “na” kabla ya jina la mwisho.
- source_word: עֵיבָל
  choice: Ebali
  rationale: Jina limetoholewa kutoka umbo la Kiebrania עֵיבָל kwa tahajia inayosomeka kwa kawaida katika Kiswahili. Umbo tofauti “Obali” katika Mwanzo 10:28 limehifadhiwa katika tanbihi.
- source_word: אֲבִימָאֵל
  choice: Abimaeli
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa, na vokali ya mwisho imeongezwa kulifanya lisomeke kwa kawaida katika Kiswahili.
- source_word: שְׁבָא
  choice: Sheba
  rationale: Jina limetoholewa kutoka שְׁבָא. “Sheba” hutunza utofauti wake na jina jingine linalofanana, Seba.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye heshima unaofaa orodha ya ukoo. Majina yametoholewa kwa namna inayosomeka kwa wasemaji wa Kiswahili, huku tofauti halisi ya jina katika kifungu sambamba ikihifadhiwa kwa tanbihi.
