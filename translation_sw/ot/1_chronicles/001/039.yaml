  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. Muundo wa nasaba umewekwa kwa ufupi na kwa kawaida; ‘walikuwa’ na ‘alikuwa’ zimetumiwa kufafanua vishazi ambavyo Kiebrania havina kitenzi kishirikishi kilichoandikwa.
