base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/039.yaml
  text: 'The sons of Lotan: Hori and Homam[a]; and Lotan’s sister was Timna.'
translation:
  language: sw
  text: Wana wa Lotani walikuwa Hori na Homamu[a]; na dada ya Lotani alikuwa Timna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika nasaba inayofanana na hii katika Mwanzo 36:22, jina hili limeandikwa Hemamu badala ya Homamu.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Wana wa
  rationale: בְּנֵי ni wingi katika hali ya kuunganisha wa neno ‘wana’; katika orodha ya nasaba, ‘Wana wa’ ni tafsiri ya kawaida na sahihi. Kiunganishi וּ hakihitaji kuonyeshwa mwanzoni mwa sentensi katika Kiswahili.
- source_word: לוֹטָן
  choice: Lotani
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: חֹרִי
  choice: Hori
  rationale: Katika muktadha huu wa nasaba, hili ni jina la mtu, si jina la kabila la Wahori.
- source_word: וְהוֹמָם
  choice: na Homamu
  rationale: Jina הוֹמָם katika Maandiko ya Nyakati limetoholewa ‘Homamu’; tofauti ya jina katika Mwanzo 36:22 imewekwa katika tanbihi badala ya kubadili usomaji wa hapa.
- source_word: וַאֲחוֹת לוֹטָן
  choice: na dada ya Lotani alikuwa
  rationale: אֲחוֹת humaanisha ‘dada.’ Kiswahili huongeza kitenzi ‘alikuwa’ ili kuifanya sentensi nomino ya Kiebrania iwe ya kawaida na wazi.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Jina limetoholewa kwa kufuata umbo la konsonanti katika aya hii, ambalo halina he ya mwisho.
