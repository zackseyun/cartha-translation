  yaml_path: translation/ot/1_chronicles/001/053.yaml
  text: Chief Kenaz[a], chief Teman, chief Mibzar.
translation:
  language: sw
  text: Mkuu Kenazi[a], mkuu Temani, mkuu Mibsari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkuu wa ukoo,” kwa kila neno “mkuu” katika mstari huu.
    reason: Neno la Kiebrania אַלּוּף linaweza kumaanisha hasa kiongozi wa ukoo au kundi la kikabila.
lexical_decisions:
- source_word: אַלּוּף
  choice: mkuu
  rationale: Katika orodha hii ya viongozi wa Edomu, neno hili humaanisha kiongozi wa kundi la ukoo au kabila. “Mkuu” ni neno fupi, la kawaida na lenye hadhi linalofaa mtindo wa orodha bila kuingiza cheo cha kifalme kisichokusudiwa.
- source_word: קְנַז
  choice: Kenazi
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili, huku likihifadhi umbo lake la Kiebrania.
- source_word: תֵּימָן
  choice: Temani
  rationale: Hapa limetumiwa kama jina katika orodha ya wakuu wa Edomu; limetoholewa badala ya kutafsiriwa kama eneo au ukoo.
- source_word: מִבְצָר
  choice: Mibsari
  rationale: Jina limetoholewa kwa mfumo wa sauti na tahajia unaoeleweka katika Kiswahili, badala ya kutafsiri maana yake ya kileksika.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni mfupi na wenye hadhi kulingana na muundo wa orodha ya majina. Kurudiwa kwa “mkuu” kunahifadhi urudiaji wa maandishi ya Kiebrania.
