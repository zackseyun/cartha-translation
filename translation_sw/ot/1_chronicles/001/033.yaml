base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/033.yaml
  text: 'The sons of Midian: Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.'
translation:
  language: sw
  text: Wana wa Midiani walikuwa Efa, Eferi, Hanoki, Abida na Eldaa. Hao wote walikuwa wana wa Ketura.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: Wana wa Midiani
  rationale: Muundo wa nasaba unatafsiriwa kwa Kiswahili cha kawaida; kiunganishi cha mwanzo hakihitaji kutajwa peke yake katika mstari huu wa orodha.
- source_word: עֵיפָה
  choice: Efa
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: וָעֵפֶר
  choice: Eferi
  rationale: Jina limetoholewa kulingana na matamshi ya Kiebrania na mfumo wa sauti wa Kiswahili.
- source_word: וַחֲנוֹךְ
  choice: Hanoki
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania, bila kulibadilisha kuwa jina tofauti lililozoeleka katika mapokeo mengine.
- source_word: וַאֲבִידָע
  choice: Abida
  rationale: Jina limetoholewa kwa umbo fupi na linalosomeka kwa Kiswahili.
- source_word: וְאֶלְדָּעָה
  choice: Eldaa
  rationale: Jina limetoholewa kwa kuzingatia umbo la Kiebrania.
- source_word: כָּל אֵלֶּה
  choice: Hao wote
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayorejelea watu wote waliotajwa katika orodha.
- source_word: בְּנֵי קְטוּרָה
  choice: walikuwa wana wa Ketura
  rationale: Kitenzi 'walikuwa' kinaongezwa kwa sarufi wazi ya Kiswahili, huku uhusiano wa nasaba ukihifadhiwa.
