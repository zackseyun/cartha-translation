  text: וְ/אֵ֣לֶּה הַ/מְּלָכִ֗ים אֲשֶׁ֤ר מָלְכוּ֙ בְּ/אֶ֣רֶץ אֱד֔וֹם לִ/פְנֵ֥י מְלָךְ מֶ֖לֶךְ לִ/בְנֵ֣י יִשְׂרָאֵ֑ל בֶּ֚לַע בֶּן בְּע֔וֹר וְ/שֵׁ֥ם עִיר֖/וֹ דִּנְהָֽבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/043.yaml
  text: 'And these are the kings who reigned in the land of Edom before any king reigned over the sons of Israel: Bela son of Beor, and the name of his city was Dinhabah.'
translation:
  language: sw
  text: Na hawa ndio wafalme waliotawala katika nchi ya Edomu kabla ya mfalme kutawala juu ya wana wa Israeli:[a] Bela mwana wa Beori, na jina la mji wake lilikuwa Dinhaba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kabla mfalme yeyote hajatawala juu ya wana wa Israeli.” Kiebrania kwa karibu ni “kabla ya kutawala kwa mfalme kwa/juu ya wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Na hawa ndio
  rationale: Kiunganishi na kiwakilishi huendeleza orodha iliyotangulia na kuitambulisha kwa mtindo wa kawaida wa Kiswahili.
- source_word: הַמְּלָכִים אֲשֶׁר מָלְכוּ
  choice: wafalme waliotawala
  rationale: Kitenzi מָלְכוּ humaanisha kutumia mamlaka ya kifalme; ‘waliotawala’ ni wazi na cha kawaida katika Kiswahili.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: katika nchi ya Edomu
  rationale: Neno ‘nchi’ limehifadhiwa kwa sababu limo wazi katika Kiebrania, huku ‘Edomu’ likifuata umbo la kawaida la jina hilo katika Kiswahili.
- source_word: לִפְנֵי מְלָךְ מֶלֶךְ
  choice: kabla mfalme yeyote hajatawala
  rationale: Kirai cha Kiebrania kinaeleza wakati uliotangulia kuanza kwa ufalme katika Israeli. ‘Yeyote’ hutoa maana hiyo kwa Kiswahili cha asili bila kudai kuwa Kiebrania kina kiwakilishi hicho waziwazi; tafsiri ya karibu zaidi imewekwa katika tanbihi.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: juu ya wana wa Israeli
  rationale: ‘Juu ya’ huonyesha uhusiano wa kutawala, na ‘wana wa Israeli’ huhifadhi nahau ya Kiebrania inayowataja wazao au watu wa Israeli.
- source_word: בֶּלַע בֶּן בְּעוֹר
  choice: Bela mwana wa Beori
  rationale: Majina yamenukuliwa kwa maumbo yanayotambulika katika Kiswahili, na ‘mwana wa’ huakisi uhusiano wa ukoo.
- source_word: וְשֵׁם עִירוֹ דִּנְהָבָה
  choice: na jina la mji wake lilikuwa Dinhaba
  rationale: Hii huhifadhi muundo na taarifa ya kishazi nomino cha Kiebrania kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Je, מֶלֶךְ humaanisha mfalme mmoja maalumu au mfalme yeyote wa Israeli?
  choice: mfalme yeyote
  alternative: mfalme
  rationale: Muktadha unalinganisha wafalme wa Edomu na kipindi kabla ya kuanzishwa kwa ufalme katika Israeli. Hata hivyo, umbo la Kiebrania ni umoja na halisemi ‘yeyote’ waziwazi, kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha ya kihistoria umehifadhiwa bila kufanya sentensi iwe nzito kupita kiasi.
