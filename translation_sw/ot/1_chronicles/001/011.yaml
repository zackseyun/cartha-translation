  yaml_path: translation/ot/1_chronicles/001/011.yaml
  text: Mizraim fathered the Ludites[a], the Anamites, the Lehabites, and the Naphtuhites.
translation:
  language: sw
  text: Misraimu akawazaa Waludi[a], Waanami, Walehabi, na Wanaftuhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kunakili majina hayo moja kwa moja zaidi: “Ludimu, Anamimu, Lehabimu, na Naftuhimu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: Mizraimu
  rationale: Katika orodha hii ya ukoo, neno hili ni jina la babu wa mataifa, hivyo limetoholewa kama jina badala ya kutafsiriwa kuwa “Misri.”
- source_word: יָלַד
  choice: akawazaa
  rationale: Katika muktadha wa ukoo, kitenzi kinaonyesha kuwa Mizraimu alikuwa babu au chanzo cha makundi yaliyotajwa. “Akawazaa” ni usemi mfupi na wa kawaida katika orodha za vizazi, huku wingi wa kiambishi “-wa-” ukilingana na makundi kadhaa.
- source_word: אֶת
  choice: '[halikutafsiriwa kivyake]'
  rationale: Hiki ni kiashiria cha yambwa mahususi katika Kiebrania; kazi yake inaonekana katika mpangilio wa sentensi ya Kiswahili bila kupewa neno la pekee.
- source_word: לודיים
  choice: Waludi
  rationale: Jina limetolewa kama jina la kundi la watu kwa kutumia kiambishi cha Kiswahili “Wa-,” badala ya kunakili moja kwa moja umbo la wingi la Kiebrania.
- source_word: עֲנָמִים
  choice: Waanami
  rationale: Jina limetolewa kama jina la watu kwa mtindo wa kawaida wa Kiswahili na kwa ulinganifu na majina mengine katika orodha.
- source_word: לְהָבִים
  choice: Walehabi
  rationale: Jina limetolewa kama jina la kundi la watu kwa kutumia “Wa-,” jambo linalofanya orodha ieleweke kwa msomaji wa kawaida.
- source_word: נַפְתֻּחִים
  choice: Wanaftuhi
  rationale: Jina limetolewa kama jina la watu kwa muundo wa Kiswahili, huku sauti za msingi za jina la Kiebrania zikihifadhiwa.
