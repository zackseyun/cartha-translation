  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kiebrania, majina haya ya jamii yako katika umbo la umoja lakini yanatumika kwa maana ya pamoja, yakimaanisha Wayebusi, Waamori, na Wagirgashi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: Wayebusi
  rationale: Ingawa jina hili la jamii katika Kiebrania lina umbo la umoja, hapa linatumika kwa maana ya pamoja kumaanisha watu wa taifa hilo; Kiswahili cha kawaida hutumia kiambishi cha wingi Wa-.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Umbo la umoja la Kiebrania linawakilisha kundi zima la watu katika orodha hii ya nasaba, hivyo limetafsiriwa kwa jina la wingi.
- source_word: הַגִּרְגָּשִׁי
  choice: Wagirgashi
  rationale: Jina hili limetolewa katika wingi ili kuonyesha kuwa ni kundi la watu, sawasawa na majina mengine katika orodha.
- source_word: וְאֶת / וְאֵת
  choice: na
  rationale: אֵת ni kiashiria cha yambwa bainifu kisicho na neno la moja kwa moja katika Kiswahili; וְ limetolewa kwa 'na', huku uratibu mwingine ukionyeshwa kwa koma.
