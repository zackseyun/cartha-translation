  text: אַלּ֥וּף מַגְדִּיאֵ֖ל אַלּ֣וּף עִירָ֑ם אֵ֖לֶּה אַלּוּפֵ֥י אֱדֽוֹם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/054.yaml
  text: Chief Magdiel[a], chief Iram. These were the chiefs of Edom.
translation:
  language: sw
  text: Mkuu Magdieli, mkuu Iramu. Hao ndio waliokuwa wakuu wa Edomu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakuu wa koo za Edomu.” Neno la Kiebrania linaweza kumaanisha viongozi wa makabila au koo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: mkuu
  rationale: Katika orodha za ukoo na uongozi za Waedomu, neno hili humaanisha kiongozi wa kabila au ukoo. “Mkuu” ni neno la sasa, la heshima na fupi linalofaa mtindo wa orodha.
- source_word: מַגְדִּיאֵל
  choice: Magdieli
  rationale: Jina maalumu limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili bila kutafsiri maana yake inayowezekana.
- source_word: עִירָם
  choice: Iramu
  rationale: Jina maalumu limetoholewa kwa kufuata muundo wa kawaida wa majina ya kibiblia katika Kiswahili.
- source_word: אֵלֶּה
  choice: Hao ndio waliokuwa
  rationale: Kiebrania kinasema kihalisi “hao,” bila kitenzi. Kiswahili cha kawaida huhitaji kishirikishi; “hao ndio waliokuwa” linaonyesha kuwa sentensi hii ni muhtasari wa orodha iliyotangulia.
- source_word: אַלּוּפֵי אֱדֹם
  choice: wakuu wa Edomu
  rationale: Kirai hiki kinawajumlisha waliotajwa kuwa viongozi wa Edomu, huku “wakuu” likidumisha istilahi iliyotumiwa mwanzoni mwa mstari.
