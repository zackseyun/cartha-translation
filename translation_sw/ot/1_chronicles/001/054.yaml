  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa Kiebrania: vyeo viwili vya אַלּוּף vinatangulia majina Magdieli na Iramu, kisha sentensi ya muhtasari inawatambulisha kama wakuu wa Edomu. “Hao ndio waliokuwa” ni urekebishaji wa kawaida wa Kiswahili wa kishazi cha muhtasari kisicho na kitenzi katika Kiebrania.'
