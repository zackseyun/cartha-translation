base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/045.yaml
  text: And Yobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: sw
  text: Yobabu[a] akafa, naye Hushamu kutoka nchi ya Watemani[b] akatawala mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa mapokeo, jina hili limeandikwa “Jobabu.”
    reason: lexical_alternative
  - marker: b
    text: Au “nchi ya Temani” au “nchi ya Mtemani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kitenzi hiki kinaendeleza mfululizo wa simulizi; kiambishi cha nafsi katika Kiswahili kinaonyesha kwamba Yobabu ndiye aliyekufa.
- source_word: יוֹבָב
  choice: Yobabu
  rationale: Jina limetoholewa kwa kufuata kwa karibu matamshi ya Kiebrania יוֹבָב na muundo wa kawaida wa majina katika Kiswahili.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika orodha hii ya wafalme, kitenzi מלך kinaonyesha kwamba mtu alianza kutawala akiwa mfalme; “akatawala” ni usemi wa asili na wenye kueleweka katika Kiswahili.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Katika muktadha wa urithi wa kifalme, neno hili linaonyesha kuchukua nafasi ya mtawala aliyekufa.
- source_word: חוּשָׁם
  choice: Hushamu
  rationale: Jina limetoholewa moja kwa moja kutoka umbo la Kiebrania.
- source_word: מֵאֶרֶץ
  choice: kutoka nchi ya
  rationale: Muundo huu unaonyesha mahali Hushamu alikotoka na kuhifadhi maana kamili ya אֶרֶץ, “nchi.”
- source_word: הַתֵּימָנִי
  choice: Watemani
  rationale: Katika muundo “nchi ya,” jina hili linaweza kueleweka kama jina la watu au eneo lao; “nchi ya Watemani” ni Kiswahili cha kawaida, huku tanbihi ikihifadhi tafsiri nyingine zinazowezekana.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo mfupi na wenye hadhi unaofaa orodha ya urithi wa kifalme. Kiunganishi “naye” kinaweka wazi mfuatano wa matukio bila kuongeza maelezo yasiyokuwamo katika Kiebrania.
