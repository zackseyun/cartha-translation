lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa neno ‘mwana’ katika hali ya kuunganisha nomino, nao unaanzisha orodha ya nasaba. ‘Wana wa’ ni usemi wa kawaida na mahususi kuliko ‘watoto wa’ au ‘wazao wa’ katika muktadha huu.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: אֱלִיפַז
  choice: Elifazi
  rationale: Utohozi wa jina la Kiebrania unaofuata matumizi yaliyozoeleka katika Kiswahili.
- source_word: רְעוּאֵל
  choice: Reueli
  rationale: Utohozi wa moja kwa moja wa jina la Kiebrania kwa umbo la Kiswahili; umbo ‘Ragueli’ hutokana na njia nyingine ya utohozi.
- source_word: וִיעוּשׁ
  choice: Yeushi
  rationale: Jina limetoholewa kwa kuzingatia sauti ya mwanzo ya Kiebrania na muundo wa majina uliozoeleka katika Kiswahili.
- source_word: וְיַעְלָם
  choice: Yalamu
  rationale: Utohozi wa karibu wa jina la Kiebrania katika umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: וְקֹרַח
  choice: na Kora
  rationale: Kiunganishi cha Kiebrania kimetafsiriwa ‘na’ kwa jina la mwisho katika orodha; ‘Kora’ ni utohozi wa Kiswahili wa jina hilo.
