base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/051.yaml
  text: 'Hadad died[a], and the chiefs of Edom were: Chief Timna, Chief Aliah[c][b], Chief Jetheth.'
translation:
  language: sw
  text: 'Hadadi akafa, nao wakuu[a] wa Edomu walikuwa hawa: Mkuu Timna[b], Mkuu Alia[c], na Mkuu Yethethi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika orodha hii, neno la Kiebrania lililotafsiriwa “wakuu” humaanisha kiongozi wa ukoo au kabila la Waedomu; tafsiri za zamani wakati mwingine hutumia cheo “duke.”
    reason: lexical_alternative
  - marker: b
    text: Jina Timna pia linaweza kuandikwa Timnah katika utohozi mwingine.
    reason: lexical_alternative
  - marker: c
    text: Katika Mwanzo 36:40, jina linalolingana na hili ni Alva; hapa Mambo ya Nyakati linasoma Alia.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kitenzi cha Kiebrania kinaendeleza mfululizo wa simulizi; ‘akafa’ ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: הֲדָד
  choice: Hadadi
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: וַיִּהְיוּ
  choice: walikuwa hawa
  rationale: Katika muktadha huu kitenzi kinaanzisha orodha; ‘walikuwa hawa’ huifanya orodha hiyo isomeke kwa kawaida bila kubadili maana kuwa ‘wakawa.’
- source_word: אַלּוּפֵי אֱדוֹם
  choice: wakuu wa Edomu
  rationale: אַלּוּף katika orodha za Waedomu humaanisha viongozi wa koo au makabila. ‘Wakuu’ ni neno la sasa, lenye heshima, na lisiloingiza cheo cha kifalme kisichokuwamo katika chanzo.
- source_word: אַלּוּף
  choice: Mkuu
  rationale: Cheo hicho kimerudiwa mbele ya kila jina ili kuhifadhi muundo wa orodha ya Kiebrania.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Tahajia hii inafuata kwa karibu umbo la jina la Kiebrania.
- source_word: עליה
  choice: Alia
  rationale: Umbo la Mambo ya Nyakati linaunga mkono ‘Alia’; tofauti ya jina katika Mwanzo 36:40 imehifadhiwa katika tanbihi.
- source_word: יְתֵת
  choice: Yethethi
  rationale: Jina limetoholewa kwa sauti na tahajia zinazosomeka kwa kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye heshima na ulio wazi. ‘Wakuu’ limechaguliwa badala ya ‘madiwani,’ ‘machifu,’ au cheo cha kigeni, na majina yametoholewa kwa namna inayosomeka kwa wasomaji wa Kiswahili. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika; tanbihi [a] inahusu cheo kinachorudiwa katika orodha nzima.
