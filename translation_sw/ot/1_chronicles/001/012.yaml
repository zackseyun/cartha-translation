base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/012.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: sw
  text: na Wapathrusi, na Wakasluhi (ambao Wafilisti walitoka kwao)[a], na Wakaftori.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya moja kwa moja, “ambao Wafilisti walitoka kutoka huko.” Hapa katika Mambo ya Nyakati, Kiebrania kwa kawaida huiunganisha kauli hii na Wakasluhi. Hata hivyo, Mwanzo 10:14 ina maneno hayohayo, na sehemu nyingine za Maandiko pia zinawahusisha Wafilisti na Wakaftori (tazama Amosi 9:7; Yeremia 47:4).
    reason: Kuhifadhi maana ya moja kwa moja, utata wa rejeleo, na uhusiano wake na vifungu vingine.
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: Wapathrusi
  rationale: Jina la kundi la watu limetoholewa kwa mtindo wa Kiswahili kwa kiambishi Wa-, huku umbo la jina la asili likihifadhiwa.
- source_word: כַּסְלֻחִים
  choice: Wakasluhi
  rationale: Kwa kuwa utambulisho kamili wa kundi hili haujulikani, jina limetoholewa badala ya kutafsiriwa kwa namna inayoweza kuongeza maana isiyokuwamo katika Kiebrania.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: ambao kutoka kwao ... walitokea
  rationale: Kauli hii inaonyesha chimbuko na kwa kawaida humrejelea mtajwa wa karibu, yaani Wakasluhi. Neno 'kutoka kwao' ni la kawaida katika muktadha wa nasaba, huku tanbihi ikihifadhi maana ya moja kwa moja ya 'kutoka huko' na utata wa uhusiano wake.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hili la watu.
- source_word: כַּפְתֹּרִים
  choice: Wakaftori
  rationale: Jina la watu wanaohusishwa na Kaftori limetoholewa kwa muundo wa kawaida wa majina ya makundi ya watu katika Kiswahili.
- source_word: וְאֶת
  choice: na
  rationale: Kiunganishi kimetafsiriwa kwa 'na'; alama ya Kiebrania ya yambwa haitaji kuwakilishwa kando katika Kiswahili.
theological_decisions:
- issue: Wafilisti walitoka kwa kundi gani katika mpangilio huu?
  choice: Kauli husomwa pamoja na Wakasluhi, waliotajwa mara moja kabla yake.
  alternative: Kauli inaweza kueleweka kwa maana pana ya mahali, 'kutoka huko,' huku mapokeo mengine yakiwahusisha Wafilisti na Kaftori.
  rationale: Sarufi na mpangilio wa Kiebrania katika Mambo ya Nyakati humwelekeza msomaji kwa Wakasluhi, lakini ushahidi mpana wa Maandiko haupaswi kufichwa; kwa hiyo tofauti hiyo imeelezwa katika tanbihi bila kubadili matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo ni mfupi na wenye hadhi unaofaa orodha ya nasaba. Majina ya makundi ya watu yametoholewa kwa kiambishi Wa-, na mabano yametumiwa kuonyesha kauli elezi bila kuvuruga mfuatano wa orodha.
