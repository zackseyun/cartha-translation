base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/041.yaml
  text: 'The sons of Anah: Dishon. And the sons of Dishon: Hamran[a], Eshban, Ithran, and Keran.'
translation:
  language: sw
  text: 'Wana wa Ana: Dishoni. Na wana wa Dishoni: Hamrani[a], Eshbani, Ithrani, na Kerani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Orodha ya ukoo inayolingana katika Mwanzo 36:26 ina jina “Hemdani” badala ya “Hamrani.” Matini kuu hapa inafuata Maandishi ya Kimasora ya 1 Mambo ya Nyakati.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Katika orodha hii ya ukoo, wingi wa kiume wa בן una maana ya moja kwa moja ya “wana wa”; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: עֲנָה
  choice: Ana
  rationale: Jina la mtu limetoholewa kwa kufuata matamshi ya Kiebrania na mtindo wa kawaida wa majina ya Biblia katika Kiswahili.
- source_word: דִּישׁוֹן
  choice: Dishoni
  rationale: Jina limetoholewa kama Dishoni na kudumishwa vilevile linapotaja mwana wa Ana na baba wa majina manne yanayofuata.
- source_word: וּבְנֵי
  choice: Na wana wa
  rationale: Kiunganishi וּ kimetafsiriwa “Na” ili kuhifadhi muundo wa mfululizo wa nasaba; “wana wa” inadumisha ulinganifu na kishazi cha kwanza.
- source_word: חַמְרָן
  choice: Hamrani
  rationale: Maandishi ya Kimasora ya 1 Mambo ya Nyakati yana חַמְרָן, hivyo matini kuu inafuata usomaji huo; tofauti ya Mwanzo 36:26 imehifadhiwa katika tanbihi.
- source_word: אֶשְׁבָּן
  choice: Eshbani
  rationale: Jina limetoholewa moja kwa moja kwa mfumo wa majina ya Kiebrania unaotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: יִתְרָן
  choice: Ithrani
  rationale: Jina limetoholewa kwa kuakisi kwa karibu umbo la Kiebrania, huku likipewa umbo linalotamkika kiasili kwa Kiswahili.
- source_word: כְרָן
  choice: Kerani
  rationale: Jina limetoholewa moja kwa moja; kiunganishi kilichotangulia jina kimewakilishwa kwa “na” kabla ya jina la mwisho katika orodha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, kwa mtindo mfupi na wenye hadhi unaofaa orodha ya ukoo. Majina yametoholewa kwa maumbo yanayotamkika kwa urahisi katika Kiswahili, na alama ya tanbihi [a] imewekwa katika matini kuu.
