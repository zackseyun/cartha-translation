base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/032.yaml
  text: 'And the sons of Keturah[a], Abraham’s concubine: she bore Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah. And the sons of Jokshan: Sheba and Dedan.'
translation:
  language: sw
  text: 'Nao wana wa Ketura[a], suria wa Abrahamu: aliwazaa Zimrani, Yokshani, Medani, Midiani, Ishbaki na Shua. Nao wana wa Yokshani: Sheba na Dedani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mwanzo 25:1 humwita Ketura mke wa Abrahamu; hapa mwandishi wa Mambo ya Nyakati anamwita hasa suria wake.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: Nao wana wa
  rationale: Muundo huu unahifadhi kiunganishi cha mfululizo wa nasaba na hali ya uhusiano ya wingi, huku ukisomeka kwa kawaida katika Kiswahili.
- source_word: קְטוּרָה
  choice: Ketura
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: פִּילֶגֶשׁ
  choice: suria
  rationale: Neno hili huonyesha mwanamke aliye katika muungano unaotambuliwa lakini mwenye hadhi ya chini kuliko mke mkuu; “suria” ni neno fupi na linalofaa katika muktadha huu wa nasaba.
- source_word: אַבְרָהָם
  choice: wa Abrahamu
  rationale: Uhusiano wa kisarufi na פִּילֶגֶשׁ umetafsiriwa kwa kiunganishi cha umilikaji cha Kiswahili.
- source_word: יָלְדָה
  choice: alimzaa
  rationale: Kitenzi cha umoja wa kike kinamrejelea Ketura; Kiswahili hakihitaji kurudia kiwakilishi, na umbo hili linafaa kwa taarifa ya nasaba.
- source_word: אֶת
  choice: '[hakikutafsiriwa]'
  rationale: Ni kiashiria cha yambwa mahsusi katika Kiebrania na hakina neno la moja kwa moja linalohitajika katika Kiswahili.
- source_word: זִמְרָן
  choice: Zimrani
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: יָקְשָׁן
  choice: Yokshani
  rationale: Jina limetoholewa kutoka Kiebrania kwa kuakisi konsonanti ya mwanzo yod na kwa umbo linalotamkika kwa kawaida katika Kiswahili.
- source_word: מְדָן
  choice: Medani
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: מִדְיָן
  choice: Midiani
  rationale: Jina limetoholewa kwa umbo la kibiblia linalofahamika katika Kiswahili.
- source_word: יִשְׁבָּק
  choice: Ishbaki
  rationale: Jina limetoholewa kwa kuhifadhi sauti kuu za Kiebrania na kulifanya litamkike kwa kawaida katika Kiswahili.
- source_word: שׁוּחַ
  choice: Shua
  rationale: Jina limetoholewa kwa umbo fupi linaloendana na matamshi ya Kiswahili.
- source_word: שְׁבָא
  choice: Sheba
  rationale: Jina limetoholewa kwa umbo la kibiblia linalotambulika katika Kiswahili.
- source_word: דְדָן
  choice: Dedani
  rationale: Jina limetoholewa kwa umbo la kawaida la Kiswahili.
theological_decisions:
- issue: Hadhi ya Ketura katika uhusiano wake na Abrahamu
  choice: suria
  alternative: mke; mke wa cheo cha pili
  rationale: Aya hii inatumia wazi פִּילֶגֶשׁ. Tafsiri haipaswi kulisawazisha kimya kimya na Mwanzo 25:1, ambako Ketura anaitwa mke; tanbihi inahifadhi tofauti hiyo ya maandiko.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya heshima na mtindo mfupi wa orodha ya nasaba. Kiunganishi “Nao” kinadumisha mfululizo wa taarifa. Majina yametoholewa kwa matamshi yanayofaa Kiswahili, bila kutegemea tu maumbo ya Kiingereza.
