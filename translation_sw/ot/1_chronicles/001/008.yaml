lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa hali ya kuunganisha wa בֵּן katika orodha ya ukoo. “Wana wa” ni usemi wa kawaida na wa heshima katika Kiswahili, huku ukiweza pia kumaanisha wazao wa ukoo kwa upana.
- source_word: חָם
  choice: Hamu
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili cha Biblia.
- source_word: כּוּשׁ
  choice: Kushi
  rationale: Jina limetoholewa kwa namna ya kawaida katika Kiswahili; katika orodha hii linafanya kazi kama jina la babu wa ukoo, ingawa pia huhusishwa na watu au eneo.
- source_word: מִצְרַיִם
  choice: Misraimu
  rationale: Katika muktadha huu wa ukoo, jina la Kiebrania limetoholewa badala ya kutafsiriwa “Misri,” ili kudumisha kazi yake kama jina la mtu au babu wa ukoo sambamba na majina mengine.
- source_word: פּוּט
  choice: Puti
  rationale: Jina la pekee limetoholewa moja kwa moja katika umbo linalosikika kwa kawaida katika Kiswahili.
- source_word: כְנָעַן
  choice: Kanaani
  rationale: Jina la pekee limetoholewa kwa umbo lililozoeleka katika Kiswahili; hapa linamtaja babu wa ukoo.
