base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/046.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab; and the name of his city was Avith.
translation:
  language: sw
  text: Hushamu akafa, naye Hadadi mwana wa Bedadi akawa mfalme mahali pake, aliyewapiga Wamidiani katika uwanda wa Moabu; na jina la mji wake lilikuwa Avithi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Aiothi,” namna nyingine ya kutoholewa kwa jina hili la mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kitenzi מות katika mtiririko wa simulizi humaanisha moja kwa moja “akafa”; tafsiri hii ni wazi na haileti lugha ya kuficha maana.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: akatawala mahali pake
  rationale: מלך hapa inaonyesha kutawala kama mfalme baada ya mtangulizi, na תחתיו ni “mahali pake.” Kiswahili hiki ni cha kawaida na huhifadhi wazo la urithi wa utawala.
- source_word: הֲדַד בֶּן בְּדַד
  choice: Hadadi mwana wa Bedadi
  rationale: Majina yametoholewa kwa namna inayoendana na matamshi na desturi ya majina ya Biblia katika Kiswahili; בן imetafsiriwa moja kwa moja kuwa “mwana wa.”
- source_word: הַמַּכֶּה אֶת־מִדְיָן
  choice: Hadadi ndiye aliyeipiga Midiani
  rationale: Nomino ya kishiriki kutoka נכה humtambulisha Hadadi kwa tendo hilo. “Aliyeipiga” hubaki karibu na maana ya msingi bila kuamua kwa lazima kama ilikuwa kushambulia au kushinda kabisa. Kurudia “Hadadi ndiye” huondoa utata wa kirejeleo katika Kiswahili.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: katika uwanda wa Moabu
  rationale: שׂדה inaweza kumaanisha shamba au eneo la wazi. “Uwanda” huhifadhi picha ya eneo la wazi na inafaa zaidi kuliko kudokeza shamba moja la kilimo.
- source_word: וְשֵׁם עִירוֹ
  choice: na jina la mji wake lilikuwa
  rationale: Hii huhifadhi muundo wa kawaida wa Kiebrania wa kutaja jina huku ikibaki Kiswahili cha asili.
- source_word: עיות
  choice: Avithi
  rationale: Jina la mahali limetoholewa kama Avithi kwa kufuata umbo la jadi linalohusishwa na jina hili; maandishi ya hapa yanaweza pia kutoholewa Ayothi, jambo lililoonyeshwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imegawanywa ili kuepuka mlolongo mzito wa vishazi; maana na mpangilio wa taarifa za Kiebrania zimehifadhiwa. Alama ya tanbihi imewekwa baada ya jina la mji linalohusika.
