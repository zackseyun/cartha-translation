  text: Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: sw
  text: Hadadi akafa, naye Samla kutoka Masreka akatawala mahali pake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kitenzi מוּת kinaonyesha kifo moja kwa moja; “akafa” ni Kiswahili cha kawaida na wazi bila kutumia lugha ya kuficha maana.
- source_word: הֲדָד
  choice: Hadadi
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika tafsiri za Kiswahili.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika mfululizo wa wafalme, מָלַךְ humaanisha kutawala akiwa mfalme. “Akatawala” huhifadhi mtindo mfupi wa orodha na maana ya utawala wa kifalme bila kuongeza maelezo yasiyosemwa wazi.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Hapa תַּחַת pamoja na kiambishi cha nafsi huonyesha kumrithi mtawala katika cheo; “mahali pake” ni usemi wa asili unaoonyesha kuchukua nafasi yake.
- source_word: שַׂמְלָה
  choice: Samla
  rationale: Jina la mtu limetoholewa kwa matamshi rahisi na ya kawaida ya Kiswahili.
- source_word: מִמַּשְׂרֵקָה
  choice: kutoka Masreka
  rationale: Kiambishi מִן huonyesha asili au mahali anapohusishwa nako; “kutoka Masreka” huwasilisha maana hiyo kwa uwazi.
