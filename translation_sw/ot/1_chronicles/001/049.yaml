  yaml_path: translation/ot/1_chronicles/001/049.yaml
  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: sw
  text: Shauli akafa, naye Baal-Hanani mwana wa Akbori akatawala mahali pake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Ni Qal wayyiqtol ya מות, ikieleza mfuatano wa simulizi kwa maana ya kawaida ya kufa; Kiswahili hutumia kitenzi hiki wazi bila tasfida.
- source_word: שָׁאוּל
  choice: Shauli
  rationale: Umbo Shauli ni uhawilishaji uliozoeleka na wa asili katika Kiswahili kwa jina la Kiebrania שָׁאוּל.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika fomula ya urithi wa kifalme, מלך humaanisha kutawala kama mfalme; “akatawala” ni fupi, ya kawaida, na inadumisha mfuatano wa wayyiqtol.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: תחת pamoja na kiambishi cha nafsi huonyesha kuchukua nafasi ya mwingine, hasa katika urithi wa ufalme.
- source_word: בַּעַל חָנָן
  choice: Baal-Hanani
  rationale: Jina limehawilishwa kwa muundo unaosomeka kwa kawaida katika Kiswahili, huku kistari kikidumisha vipashio vya jina ambatani la Kiebrania.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika muktadha huu wa nasaba, בן inaonyesha uhusiano wa moja kwa moja wa mwana na baba.
- source_word: עַכְבּוֹר
  choice: Akbori
  rationale: Uhawilishaji huu unaakisi konsonanti za Kiebrania kwa mfumo unaotamkika kwa urahisi katika Kiswahili.
