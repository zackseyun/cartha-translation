base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/013.yaml
  text: And Canaan fathered Sidon his firstborn[b][a], and Heth.
translation:
  language: sw
  text: Naye Kanaani akamzaa Sidoni[a], mzaliwa wake wa kwanza, na Hethi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sidon,” kufuatana na unukuzi mwingine wa jina hili.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Heth,” babu wa nasaba anayehusishwa na Wahiti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: Naye Kanaani
  rationale: Kiunganishi וּ־ kimewasilishwa kwa “Naye” ili kudumisha mfululizo wa nasaba; jina כְנַעַן limeandikwa kwa umbo la Kiswahili linalotambulika, “Kanaani.”
- source_word: יָלַד
  choice: akamzaa
  rationale: Katika muktadha wa nasaba, kitenzi hiki humaanisha mwanaume kumzaa au kuwa baba wa mtu. “Akamzaa” ni cha kawaida, kifupi, na hudumisha maana ya nasaba bila kutumia lugha ya kizamani.
- source_word: אֶת
  choice: '[hakijatafsiriwa kivyake]'
  rationale: Hiki ni kiashiria cha yambwa mahsusi katika Kiebrania na hakihitaji neno linalolingana nacho katika sarufi ya Kiswahili.
- source_word: צִידוֹן
  choice: Sidoni
  rationale: Jina limetolewa kwa umbo la Kiswahili linalotambulika, huku tanbihi ikihifadhi uwezekano wa kuliandika “Sidon” kwa unukuzi wa karibu zaidi.
- source_word: בְּכֹר/וֹ
  choice: mzaliwa wake wa kwanza
  rationale: Neno בְּכוֹר pamoja na kiambishi cha nafsi ya tatu ya kiume humaanisha “mzaliwa wake wa kwanza.” Tafsiri hii inahifadhi wazi msisitizo wa mpangilio wa kuzaliwa.
- source_word: וְ/אֶת
  choice: na
  rationale: Kiunganishi וְ־ kimetafsiriwa “na,” huku kiashiria cha yambwa אֶת kisitafsiriwe kivyake.
- source_word: חֵת
  choice: Hethi
  rationale: Hapa חֵת ni jina la mtu katika nasaba, si jina la jamii katika wingi. Kwa hiyo “Hethi” limetumiwa badala ya tafsiri fafanuzi “Wahiti.”
theological_decisions:
- issue: Kumtambulisha Hethi kama mtu au jamii
  choice: Hethi, jina la mtu binafsi katika nasaba
  alternative: Wahiti, jina la jamii
  rationale: Muundo wa Kiebrania unataja חֵת kama mwana wa Kanaani sambamba na Sidoni. Kutafsiri “Wahiti” katika matini kuu kungebadili jina la babu wa nasaba kuwa jina la jamii na kuingiza ufafanuzi usiosemwa moja kwa moja.
translation_notes:
  register: Lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida wa Afrika Mashariki. “Akamzaa” linafaa katika mfululizo wa nasaba, na maumbo “Kanaani,” “Sidoni,” na “Hethi” yanafuata matumizi ya kawaida ya majina ya kibiblia katika Kiswahili huku tanbihi zikihifadhi tofauti za unukuzi.
