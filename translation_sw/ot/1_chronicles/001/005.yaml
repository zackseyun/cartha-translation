  text: 'Wana wa Yafethi[a]: Goma, Magogu, Madai, Yavani, Tubali, Mesheki na Tirasi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “wana wa” linaweza kutumiwa katika nasaba kumaanisha wana wa moja kwa moja au wazao kwa maana pana; hapa linaanzisha ukoo wa Yafethi katika mfumo wa orodha.
