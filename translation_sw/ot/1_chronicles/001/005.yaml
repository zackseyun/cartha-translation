lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa neno בֵּן katika hali ya kuunganishwa, likianzisha orodha ya nasaba. “Wana wa” ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili, ingawa katika nasaba neno hilo wakati mwingine linaweza kujumuisha wazao wa baadaye.
- source_word: יֶפֶת
  choice: Yafethi
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili inayotambulika katika mapokeo ya Biblia.
- source_word: גֹּמֶר
  choice: Gomeri
  rationale: Jina la mtu katika orodha ya nasaba; limetoholewa badala ya kutafsiriwa.
- source_word: מָגוֹג
  choice: Magogu
  rationale: Jina maalumu limetoholewa kwa muundo wa kawaida wa Kiswahili.
- source_word: מָדַי
  choice: Madai
  rationale: Hapa ni jina katika nasaba; limedumishwa kama jina badala ya kufasiriwa kuwa jina la kabila la Wamedi.
- source_word: יָוָן
  choice: Yavani
  rationale: Jina la nasaba limetoholewa; uhusiano wake na Ionia au Ugiriki haujaingizwa katika matini kuu.
- source_word: תֻבָל
  choice: Tubali
  rationale: Jina maalumu limetoholewa kwa Kiswahili.
- source_word: מֶשֶׁךְ
  choice: Mesheki
  rationale: Jina maalumu limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: תִירָס
  choice: Tirasi
  rationale: Jina maalumu limetoholewa kwa Kiswahili.
- source_word: וְ / וּ
  choice: orodha yenye koma na “na” kabla ya jina la mwisho
  rationale: Kiebrania hurudia kiunganishi mbele ya karibu kila jina; mtindo wa Kiswahili wa koma na “na” ya mwisho huhifadhi kazi ya orodha bila kuwa mzito.
