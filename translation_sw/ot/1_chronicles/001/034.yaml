  text: 'Abraham fathered Isaac[a]. The sons of Isaac: Esau and Israel.'
translation:
  language: sw
  text: 'Abrahamu akamzaa Isaka. Wana wa Isaka: Esau na Israeli.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Israeli,” yaani Yakobo.'
    reason: Kufafanua kwamba jina “Israeli” katika nasaba hii linamtaja Yakobo, huku tafsiri ikihifadhi jina lililo katika maandishi ya Kiebrania.
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: akamzaa
  rationale: Katika nasaba, kausativi ya ילד humaanisha kwamba Abrahamu alimzaa Isaka akiwa baba yake. Kitenzi “akamzaa” ni cha kawaida, kifupi, na kinafaa katika mfululizo wa nasaba.
- source_word: אֶת
  choice: '[halijatafsiriwa kando]'
  rationale: Ni kiashiria cha yambwa moja kwa moja, kisicho na neno huru linalolingana nacho katika Kiswahili; kazi yake inaonekana katika muundo “akamzaa Isaka.”
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa hali ya kuambatana wa בֵּן, unaoanzisha kizazi kinachofuata katika nasaba. “Wana wa” ni usemi wa asili na wenye hadhi katika Kiswahili.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: וְיִשְׂרָאֵל
  choice: na Israeli
  rationale: Maandishi ya Kiebrania yanatumia jina “Israeli,” yaani jina alilopewa Yakobo. Tafsiri inadumisha jina lililo katika chanzo badala ya kulibadili kuwa “Yakobo.”
theological_decisions:
- issue: Kutafsiri יִשְׂרָאֵל katika nasaba ambamo anayelengwa ni Yakobo
  choice: Israeli
  alternative: Yakobo
  rationale: Aya yenyewe inawataja wana wa Isaka kuwa Esau na Israeli. Ingawa Israeli hapa ni Yakobo, kuhifadhi jina lililoandikwa katika Kiebrania huepuka kuoanisha maandishi kimyakimya na jina lake la kuzaliwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akamzaa” na “wana wa” hudumisha ufupi na mtindo wa nasaba. Neno “walikuwa” limeongezwa kwa ulaini wa sarufi ya Kiswahili bila kuongeza dai jipya.
