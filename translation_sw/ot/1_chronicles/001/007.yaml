  text: 'And the sons of Javan: Elishah[a], Tarshish, Kittim, and Rodanim.'
translation:
  language: sw
  text: 'Nao wana wa Yavani: Elisha, Tarshishi, Kitimu na Rodanimu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mwanzo 10:4 inasema “Dodanimu” badala ya “Rodanimu,” jambo linaloonyesha tofauti ya maandishi katika jina hilo.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Nao wana wa
  rationale: Neno בְּנֵי kwa maana ya msingi ni “wana wa.” Muundo huu pia unadumisha mtindo wa nasaba, ingawa katika muktadha mpana unaweza kumaanisha wazao.
- source_word: יָוָן
  choice: Yavani
  rationale: Ni jina la mtu katika nasaba; limetoholewa badala ya kutafsiriwa kuwa “Ugiriki” au “Wayunani.”
- source_word: אֱלִישָׁה
  choice: Elisha
  rationale: Ni jina maalumu lililotoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: תַּרְשִׁישָׁה
  choice: Tarshishi
  rationale: Ni jina maalumu; limetoholewa kwa umbo la kawaida la Kiswahili. Herufi he ya mwisho katika umbo la Kiebrania haitafsiriwi kando.
- source_word: כִּתִּים
  choice: Kitimu
  rationale: Ni jina la kikundi cha watu au mahali; umbo hili la Kiswahili linawakilisha matamshi ya jina la Kiebrania kwa uwazi.
- source_word: וְרוֹדָנִים
  choice: na Rodanimu
  rationale: Maandishi ya Kimasora ya 1 Mambo ya Nyakati yana רוֹדָנִים, “Rodanimu.” Tofauti ya “Dodanimu” katika Mwanzo 10:4 imewekwa katika tanbihi.
