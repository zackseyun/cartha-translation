lexical_decisions:
- source_word: וּבְנֵי
  choice: Nao wana wa
  rationale: Muundo huu unahifadhi kiunganishi ו na lugha rasmi ya nasaba ya בְּנֵי, huku ukisomeka kwa kawaida katika Kiswahili.
- source_word: שֵׂעִיר
  choice: Seiri
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili.
- source_word: לוֹטָן
  choice: Lotani
  rationale: Jina limetoholewa kwa mfumo wa sauti na tahajia unaosomeka kwa Kiswahili.
- source_word: שׁוֹבָל
  choice: Shobali
  rationale: Jina limetoholewa kwa Kiswahili huku sauti kuu za Kiebrania zikihifadhiwa.
- source_word: צִבְעוֹן
  choice: Sibeoni
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili; 'S' huwakilisha sauti ya צ kwa namna inayofikika kwa wasomaji wa kawaida.
- source_word: עֲנָה
  choice: Ana
  rationale: Jina limetoholewa moja kwa moja kwa Kiswahili bila kuongeza herufi h isiyotamkwa.
- source_word: דִישֹׁן
  choice: Dishoni
  rationale: Jina limetoholewa kwa Kiswahili na kutofautishwa na דִישָׁן, Dishani.
- source_word: אֵצֶר
  choice: Ezeri
  rationale: Jina limetoholewa kwa Kiswahili kwa tahajia inayosomeka kwa urahisi.
- source_word: דִישָׁן
  choice: Dishani
  rationale: Jina limetoholewa kwa Kiswahili na tofauti yake na Dishoni imehifadhiwa.
theological_decisions:
- issue: Maana ya 'wana wa' katika orodha ya nasaba
  choice: Kuhifadhi usemi rasmi 'wana wa' na kueleza upana wake katika tanbihi
  alternative: Kutafsiri moja kwa moja kama 'wazao wa' au 'watu wa ukoo wa'
  rationale: בְּנֵי inaweza kumaanisha wana wa moja kwa moja au, katika nasaba, wazao/watu wa ukoo. Maandishi yenyewe hayalazimishi maana moja, hivyo utata huo umehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima, wazi na wa kisasa. Majina yametoholewa kwa tahajia inayosomeka kwa Kiswahili, na mfuatano wa nasaba umehifadhiwa.
