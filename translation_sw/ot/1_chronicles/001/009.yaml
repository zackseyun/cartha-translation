base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/009.yaml
  text: 'The sons of Cush: Seba[a], Havilah, Sabta, Raama, and Sabteca[c][b]. And the sons of Raama: Sheba and Dedan.'
translation:
  language: sw
  text: 'Wana wa Kushi: Seba, Havila, Sabta, Raama na Sabteka. Na wana wa Raama: Sheba na Dedani.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי כוּשׁ
  choice: Wana wa Kushi
  rationale: Neno בְּנֵי kwa kawaida humaanisha “wana”; katika orodha hii ya ukoo maana hiyo ya moja kwa moja imehifadhiwa. Jina כּוּשׁ limetoholewa kuwa “Kushi” kulingana na matumizi yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: סְבָא
  choice: Seba
  rationale: Jina limetoholewa moja kwa moja kwa namna ya kawaida katika Kiswahili.
- source_word: חֲוִילָה
  choice: Havila
  rationale: Jina limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: סַבְתָּא
  choice: Sabta
  rationale: Jina limetoholewa kwa kufuata kwa karibu konsonanti na matamshi ya Kiebrania, bila kuongeza herufi ya mwisho isiyotamkwa.
- source_word: רַעְמָא
  choice: Raama
  rationale: Umbo “Raama” huhifadhi silabi na vokali za jina la Kiebrania na kulitofautisha na jina jingine la kibiblia, Rama.
- source_word: סַבְתְּכָא
  choice: Sabteka
  rationale: Jina limetoholewa kwa mfumo wa sauti wa Kiswahili; “k” inawakilisha כ, na vokali za mwisho hurahisisha matamshi ya kawaida.
- source_word: וּבְנֵי רַעְמָא
  choice: Na wana wa Raama
  rationale: Kiunganishi וּ־ kimehifadhiwa hapa kwa “Na” kwa sababu kinaanzisha tawi dogo jipya katika orodha ya ukoo.
- source_word: שְׁבָא
  choice: Sheba
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: דְדָן
  choice: Dedani
  rationale: Jina limetoholewa kwa umbo la Kiswahili linaloishia kwa vokali, kama ilivyo kawaida katika majina ya kibiblia yaliyotoholewa.
