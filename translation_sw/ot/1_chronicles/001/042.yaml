  text: 'The sons of Ezer: Bilhan[a], Zaavan, and Jaakan[b]. The sons of Dishon: Uz and Aran.'
translation:
  language: sw
  text: 'Wana wa Eseri: Bilhani, Zaavani[a], na Yaakani[b]. Wana wa Dishoni: Usi na Arani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika orodha sambamba ya Mwanzo 36:27, jina hili limeandikwa Zavani.
