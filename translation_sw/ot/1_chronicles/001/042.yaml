lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Ni wingi wa neno ‘mwana’ katika hali ya kutegemea jina linalofuata, na hapa linatanguliza orodha ya nasaba; ‘wana wa’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אֵצֶר
  choice: Ezeri
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: בִּלְהָן
  choice: Bilhani
  rationale: Jina la mtu limetoholewa kutoka Kiebrania kwa muundo unaotamkika kwa urahisi katika Kiswahili.
- source_word: זַעֲוָן
  choice: Zaavani
  rationale: Tahajia hii inaonyesha irabu mbili za silabi tofauti katika matamshi ya Kiebrania; ‘Zavani’ ni tahajia nyingine inayotumiwa katika orodha sambamba.
- source_word: יַעֲקָן
  choice: Jaakani
  rationale: Jina limetoholewa kulingana na umbo la Kiebrania katika Mambo ya Nyakati; orodha sambamba ya Mwanzo 36:27 ina umbo Akani.
- source_word: דִישׁוֹן
  choice: Dishoni
  rationale: Tahajia hii inafuata Dishon na kulitofautisha jina hili na jina linalofanana, Dishani, katika nasaba hiyo.
- source_word: עוּץ
  choice: Usi
  rationale: Ni utohozi wa kawaida wa Kiswahili wa jina la Kiebrania עוּץ, linalojulikana pia kama jina la nchi ya Usi.
- source_word: אֲרָן
  choice: Arani
  rationale: Jina la mtu limetoholewa kwa tahajia ya asili huku likifanywa litamkike kwa kawaida katika Kiswahili.
