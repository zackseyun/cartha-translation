lexical_decisions:
- source_word: יָקְטָן
  choice: Yoktani
  rationale: Jina la mtu limetoholewa kwa kufuata umbo linalotambulika katika mapokeo ya Biblia ya Kiswahili na sauti ya Kiebrania.
- source_word: יָלַד
  choice: akawazaa
  rationale: Katika orodha ya ukoo, kitenzi hiki humaanisha kuwa baba wa watoto waliotajwa. Kiswahili hutumia kwa kawaida 'kuzaa' pia kwa baba; kiambishi '-wa-' kinaonyesha kuwa vitu vya kitenzi ni watu kadhaa.
- source_word: אֶת
  choice: '[halijatafsiriwa kivyake; ni kiashiria cha yambwa tendwa]'
  rationale: Ni kiashiria cha yambwa tendwa katika Kiebrania, kisicho na neno tofauti linalolingana nacho katika Kiswahili.
- source_word: אַלְמוֹדָד
  choice: Almodadi
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: שָׁלֶף
  choice: Shelefu
  rationale: Jina limetoholewa kutoka katika matamshi ya Kiebrania huku likipewa umbo linalosomeka kwa urahisi katika Kiswahili.
- source_word: חֲצַרְמָוֶת
  choice: Hasarmaveti
  rationale: Jina limetoholewa kwa kuzingatia konsonanti na irabu za maandishi ya Kiebrania, kwa tahajia ya kawaida ya Kiswahili.
- source_word: יָרַח
  choice: Yera
  rationale: Jina limetoholewa moja kwa moja kutoka Yeraḥ; sauti ya mwisho ya koo haina kilinganishi kamili katika tahajia ya kawaida ya Kiswahili.
