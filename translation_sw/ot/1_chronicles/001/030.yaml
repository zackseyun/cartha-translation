lexical_decisions:
- source_word: מִשְׁמָע
  choice: Mishma
  rationale: Jina la pekee katika orodha ya ukoo; limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: וְ/דוּמָה
  choice: Duma
  rationale: דוּמָה limetoholewa kama jina la pekee. Kiunganishi וְ hakijarudiwa hapa kwa kuwa Kiswahili cha kawaida huweka “na” kabla ya kipengele cha mwisho katika orodha.
- source_word: מַשָּׂא
  choice: Masa
  rationale: Katika muktadha huu neno ni jina la pekee, si nomino ya kawaida yenye maana ya mzigo au unabii; limetoholewa kwa tahajia ya Kiswahili.
- source_word: חֲדַד
  choice: Hadadi
  rationale: Jina limetoholewa kwa umbo la Kiswahili linalowakilisha usomaji wa Kiebrania Hadad; usomaji tofauti wa orodha sambamba umeelezwa katika tanbihi.
- source_word: וְ/תֵימָא
  choice: na Tema
  rationale: תֵימָא limetoholewa kama jina la pekee, na וְ limetafsiriwa “na” ili kuunganisha kipengele cha mwisho cha orodha.
