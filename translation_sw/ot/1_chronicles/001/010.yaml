base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/010.yaml
  text: And Cush fathered Nimrod[a]; he began to be a mighty one in the land.
translation:
  language: sw
  text: Naye Kushi akamzaa Nimrodi; yeye alianza kuwa mtu hodari katika nchi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “duniani.” Neno la Kiebrania אֶרֶץ linaweza kumaanisha “nchi” au “dunia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כּוּשׁ
  choice: Naye Kushi
  rationale: Kiunganishi וְ kinaendeleza orodha ya nasaba; “Naye” ni mwendelezo wa kawaida katika Kiswahili, na כּוּשׁ limetoholewa kuwa “Kushi.”
- source_word: יָלַד
  choice: akamzaa
  rationale: Katika muktadha wa nasaba, ילד humaanisha kumzaa au kuwa baba wa mtu; “akamzaa” ni fupi, wazi, na ya kawaida katika Kiswahili.
- source_word: אֶת
  choice: '[halijatafsiriwa kwa neno tofauti]'
  rationale: אֶת ni kiashiria cha yambwa tendwa dhahiri katika sarufi ya Kiebrania, kwa hiyo halihitaji neno lake katika Kiswahili.
- source_word: נִמְרֹד
  choice: Nimrodi
  rationale: Jina hili limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: הוּא
  choice: huyo
  rationale: Kiwakilishi huru kinamrejelea Nimrodi kwa msisitizo; “huyo” kinahifadhi urejeleaji huo kwa Kiswahili cha kawaida.
- source_word: הֵחֵל
  choice: alianza
  rationale: Hifili ya חלל pamoja na kitenzi-jina kwa kawaida humaanisha “kuanza”; tafsiri hii haiongezi wazo kwamba alikuwa wa kwanza.
- source_word: לִהְיוֹת
  choice: kuwa
  rationale: Kitenzi-jina cha היה hapa ni “kuwa,” na kinaungana kwa kawaida na “alianza.”
- source_word: גִּבּוֹר
  choice: mtu hodari
  rationale: גִּבּוֹר inaweza kumaanisha mtu mwenye nguvu, shujaa, au mpiganaji. “Mtu hodari” huhifadhi maana pana bila kuifanya iwe ya kijeshi pekee.
- source_word: בָּאָרֶץ
  choice: nchini
  rationale: אֶרֶץ inaweza kumaanisha nchi au dunia. “Nchini” inawakilisha maana isiyo pana kupita kiasi, huku maana ya “duniani” ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Upeo wa בָּאָרֶץ katika kueleza uhodari wa Nimrodi
  choice: nchini
  alternative: duniani
  rationale: Neno אֶרֶץ linaweza kurejelea nchi au dunia. Aya yenyewe haitaji wazi kwamba uhodari wa Nimrodi ulikuwa wa ulimwengu mzima, kwa hiyo matini kuu inatumia “nchini,” na uwezekano mpana zaidi unawekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa nasaba umewekwa kwa ufupi, na “mtu hodari” huepuka kubana maana kuwa ya kijeshi tu.
