base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/037.yaml
  text: 'The sons of Reuel: Nahath, Zerah, Shammah, and Mizzah.'
translation:
  language: sw
  text: 'Wana wa Reueli: Nahathi, Zera, Shama na Miza.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Huu ni wingi wa neno ‘mwana’ katika hali ya kuunganisha, ukitambulisha orodha ya ukoo. Hapa majina yaliyotajwa yanaeleweka kuwa watoto wa moja kwa moja wa Reueli.
- source_word: רְעוּאֵל
  choice: Reueli
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili, pamoja na irabu ya mwisho inayorahisisha matamshi.
- source_word: נַחַת
  choice: Nahathi
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa; ‘th’ inawakilisha konsonanti ya mwisho ya Kiebrania kwa namna iliyozoeleka katika majina ya Biblia ya Kiswahili.
- source_word: זֶרַח
  choice: Zera
  rationale: Limetoholewa kama jina la mtu, si kutafsiriwa kwa maana ya mzizi wake; umbo hili ni la kawaida na rahisi kutamkwa kwa Kiswahili.
- source_word: שַׁמָּה
  choice: Shama
  rationale: Jina la mtu limetoholewa kwa mfumo wa sauti wa Kiswahili; konsonanti maradufu ya Kiebrania haibadilishi maana ya jina hapa.
- source_word: וּ/מִזָּה
  choice: na Miza
  rationale: Kiunganishi וּ kimetafsiriwa ‘na,’ nalo jina מִזָּה limetoholewa ‘Miza’ kwa tahajia ya asili ya Kiswahili.
