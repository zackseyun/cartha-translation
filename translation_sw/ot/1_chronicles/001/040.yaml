  text: בְּנֵ֣י שׁוֹבָ֔ל עַלְיָ֧ן וּ/מָנַ֛חַת וְ/עֵיבָ֖ל שְׁפִ֣י וְ/אוֹנָ֑ם וּ/בְנֵ֥י צִבְע֖וֹן אַיָּ֥ה וַ/עֲנָֽהס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/040.yaml
  text: 'The sons of Shobal: Alian[a], Manahath, Ebal, Shephi, and Onam[b]. And the sons of Zibeon: Aiah and Anah.'
translation:
  language: sw
  text: Wana wa Shobali walikuwa Aliani[a], Manahathi, Ebali, Shefi[b], na Onamu. Wana wa Sibeoni walikuwa Aya na Ana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “Aliani”; orodha ya nasaba inayolingana katika Mwanzo 36:23 inasema “Alvani.”
    reason: alternative_reading
  - marker: b
    text: Mambo ya Nyakati inasema “Shefi”; sehemu inayolingana katika Mwanzo 36:23 inasema “Shefo.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: Wana wa
  rationale: Katika orodha hii ya nasaba, neno hili linamaanisha moja kwa moja wana wa kiume waliotajwa, na kauli hii ni ya kawaida na wazi katika Kiswahili.
- source_word: שׁוֹבָל
  choice: Shobali
  rationale: Jina limetoholewa kwa kufuata umbo la Kiebrania na mtindo wa kawaida wa majina ya Biblia katika Kiswahili.
- source_word: עַלְיָן
  choice: Aliani
  rationale: Hili linafuata moja kwa moja umbo la jina katika maandishi ya Mambo ya Nyakati; tofauti ya Mwanzo 36:23 imeonyeshwa katika tanbihi.
- source_word: מָנַחַת
  choice: Manahathi
  rationale: Jina limetoholewa kutoka Kiebrania kwa namna inayoweza kutamkwa kwa urahisi katika Kiswahili.
- source_word: עֵיבָל
  choice: Ebali
  rationale: Jina limetoholewa moja kwa moja kutoka katika umbo la Kiebrania la aya hii.
- source_word: שְׁפִי
  choice: Shefi
  rationale: Hufuata usomaji wa Mambo ya Nyakati; umbo tofauti katika Mwanzo 36:23 limehifadhiwa katika tanbihi.
- source_word: אוֹנָם
  choice: Onamu
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa tahajia ya asili ya Kiswahili.
- source_word: צִבְעוֹן
  choice: Sibeoni
  rationale: Jina limetoholewa kutoka Kiebrania kwa kuzingatia mfumo wa sauti na tahajia ya Kiswahili.
- source_word: אַיָּה
  choice: Aya
  rationale: Jina limetoholewa kwa uwazi kutoka umbo la Kiebrania bila kuongeza herufi isiyotamkwa katika Kiswahili.
- source_word: עֲנָה
  choice: Ana
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa mfumo wa tahajia ya Kiswahili.
- source_word: וְ / וּ / וַ
  choice: na
  rationale: Viunganishi hivi vinaunganisha majina na sehemu za orodha bila kuhitaji maana ya ziada ya kiusemi.
