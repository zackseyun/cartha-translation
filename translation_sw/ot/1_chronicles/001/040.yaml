  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. Kitenzi “walikuwa” kimeongezwa kwa ulaini wa Kiswahili katika orodha, bila kubadili maana ya muundo wa Kiebrania. Majina yametoholewa kwa tahajia inayofaa Kiswahili.
