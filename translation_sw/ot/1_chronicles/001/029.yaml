base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/029.yaml
  text: 'These are their generations: the firstborn of Ishmael[a], Nebaioth, Kedar, Adbeel, and Mibsam.'
translation:
  language: sw
  text: 'Haya ndiyo vizazi vyao: mzaliwa wa kwanza wa Ishmaeli, Nebayothi, na Kedari, Adbeeli, na Mibsamu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Hawa ndio
  rationale: Kiwakilishi hiki cha wingi kinatanguliza orodha ya watu; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: תֹּלְדוֹתָם
  choice: wazao wao
  rationale: Katika muktadha huu wa nasaba, neno hilo linarejelea watu waliotokana nao. “Wazao wao” ni wazi zaidi kwa msomaji wa sasa kuliko “vizazi vyao,” ambalo linaweza kueleweka kama vipindi vya wakati.
- source_word: בְּכוֹר
  choice: mzaliwa wa kwanza
  rationale: Huhifadhi moja kwa moja hadhi ya Nebayothi kuwa mwana aliyezaliwa kwanza bila kuongeza wazo lisilokuwamo katika chanzo.
- source_word: יִשְׁמָעֵאל
  choice: Ishmaeli
  rationale: Umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: נְבָיוֹת
  choice: Nebayothi
  rationale: Unukuzi wa Kiswahili unaofuata matamshi ya jina la Kiebrania na matumizi yaliyozoeleka katika Biblia za Kiswahili.
- source_word: קֵדָר
  choice: Kedari
  rationale: Umbo la jina linalosomeka kwa kawaida katika Kiswahili huku likibaki karibu na Kiebrania.
- source_word: אַדְבְּאֵל
  choice: Adbeeli
  rationale: Unukuzi wa Kiswahili wa jina la Kiebrania.
- source_word: מִבְשָׂם
  choice: Mibsamu
  rationale: Unukuzi wa Kiswahili wa jina la Kiebrania.
