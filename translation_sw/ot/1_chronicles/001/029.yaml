  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini ulio wazi. Vitenzi “alikuwa” na “walikuwa” vimeongezwa kwa ulaini wa sarufi ya Kiswahili; haviongezi madai mapya. “Na wengine” hutofautisha Nebayothi, aliyeelezwa kuwa mzaliwa wa kwanza, na majina yanayofuata bila kudai kwamba וְ yenyewe humaanisha “wengine.”
