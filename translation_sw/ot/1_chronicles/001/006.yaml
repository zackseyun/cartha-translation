  text: 'Na wana wa Gomeri: Ashkenazi, Difathi[a], na Togarma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika nasaba sambamba, Mwanzo 10:3 ina jina “Rifathi”; hapa maandishi ya Kiebrania ya Mambo ya Nyakati yana “Difathi.”
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Na wana wa
  rationale: Neno בְּנֵי ni wingi wa hali ya kuunganisha wa ‘wana’; katika nasaba, ‘wana wa’ huhifadhi wazi lugha ya ukoo. Kiambishi וּ־ kimetafsiriwa ‘Na’ ili kuendeleza orodha.
- source_word: גֹּמֶר
  choice: Gomeri
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayotumika kwa kawaida katika Kiswahili.
- source_word: אַשְׁכֲּנַז
  choice: Ashkenazi
  rationale: Jina la pekee limetoholewa kwa namna inayoeleweka na wasomaji wa Kiswahili.
- source_word: דִיפַת
  choice: Difathi
  rationale: Maandishi ya Kiebrania ya 1 Mambo ya Nyakati yana דִיפַת (Difathi). Tofauti ya jina katika nasaba sambamba imehifadhiwa katika tanbihi badala ya kubadili matini kuu.
- source_word: תוֹגַרְמָה
  choice: Togarma
  rationale: Jina la pekee limetoholewa kwa namna ya kawaida ya Kiswahili.
