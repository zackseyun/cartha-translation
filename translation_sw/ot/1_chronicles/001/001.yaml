lexical_decisions:
- source_word: אָדָם
  choice: Adamu
  rationale: Katika mfuatano huu wa nasaba, neno hili ni jina la mtu, si nomino ya kawaida inayomaanisha mwanadamu au wanadamu. Limetolewa kwa umbo la jina lililozoeleka katika Kiswahili.
- source_word: שֵׁת
  choice: Sethi
  rationale: Ni jina la mtu katika nasaba; limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: אֱנוֹשׁ
  choice: Enoshi
  rationale: Ni jina la mtu katika nasaba; umbo Enoshi linawakilisha konsonanti ya mwisho ya Kiebrania na linafuata namna ya kutohowa majina katika Kiswahili.
theological_decisions:
- issue: Maana ya אָדָם katika mstari huu
  choice: Adamu kama jina la mtu
  alternative: mwanadamu au wanadamu
  rationale: Muundo wa kifungu ni orodha ya majina ya mababu. Kwa hiyo, muktadha unamtambulisha Adamu kama mtu binafsi bila kuondoa maana nyingine ambazo neno hilo linaweza kuwa nazo katika miktadha mingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, kwa mtindo mfupi na wenye hadhi unaofaa orodha ya nasaba. Majina yametolewa kwa maumbo yanayoeleweka kwa wasomaji wa Biblia ya Kiswahili.
