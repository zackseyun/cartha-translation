- source_word: אַלּוּף
  choice: mkuu
  rationale: Katika orodha ya viongozi wa Edomu, neno hili humaanisha kiongozi wa kikundi cha ukoo au kabila. “Mkuu” ni neno fupi, la kawaida na lenye hadhi, na linafaa katika muundo unaorudiwa kabla ya kila jina.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Jina hili limenakiliwa kwa kufuata matamshi ya Kiebrania na muundo wa majina unaoeleweka kwa wasomaji wa Kiswahili.
- source_word: אֵלָה
  choice: Ela
  rationale: Jina la pekee limenakiliwa moja kwa moja badala ya kutafsiriwa.
- source_word: פִּינֹן
  choice: Pinoni
  rationale: Jina la pekee limetoholewa kwa tahajia ya Kiswahili, huku irabu ya mwisho ikirahisisha matamshi ya kawaida ya Kiswahili.
