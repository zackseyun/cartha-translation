  text: Samlah died[a], and Shaul from Rehoboth by the River reigned in his place.
translation:
  language: sw
  text: Samla akafa, naye Shauli kutoka Rehobothi kando ya Mto[a] akatawala mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mto”; wengi huelewa kuwa hapa panarejelea Mto Eufrate.
    reason: Neno la Kiebrania ni “Mto” kwa maana halisi na linaweza kuwa jina maalumu la kijiografia, lakini kifungu hakitaji Eufrate moja kwa moja.
lexical_decisions:
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kitenzi מות katika Qal kina maana ya moja kwa moja ya kufa; ‘akafa’ ni simulizi la kawaida, wazi, lisilo na lugha ya kupunguza ukali.
- source_word: שַׂמְלָה
  choice: Samla
  rationale: Jina la mtu limetoholewa kwa matamshi yanayokaribia Kiebrania na kwa umbo linalofaa Kiswahili.
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Katika taarifa hii ya urithi wa kifalme, מלך humaanisha kutawala kama mfalme. ‘Akatawala’ ni fupi na ya asili katika Kiswahili bila kuongeza maneno yasiyokuwamo wazi katika kifungu.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Katika muktadha wa urithi wa ufalme, תחתיו humaanisha kuchukua nafasi ya mtangulizi; ‘mahali pake’ huonyesha maana hiyo moja kwa moja.
- source_word: שָׁאוּל
  choice: Shauli
  rationale: Jina limetoholewa katika umbo la Kiswahili linalofuata matamshi ya Kiebrania na kulitofautisha kwa uwazi kama jina la mtu.
- source_word: מֵרְחֹבוֹת
  choice: kutoka Rehobothi
  rationale: Kiambishi מ־ huonyesha asili au mahali alikotoka; ‘kutoka’ huwasilisha maana hiyo wazi. Rehobothi limehifadhiwa kama jina la mahali.
- source_word: הַנָּהָר
  choice: Mto
  rationale: Neno נהר lenye kibainishi humaanisha kihalisi ‘Mto’ na huenda limetumiwa kama jina maalumu la kijiografia. Herufi kubwa huhifadhi uwezekano huo bila kulitaja moja kwa moja kuwa Eufrate.
