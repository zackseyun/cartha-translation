  text: So Hanun took David’s servants[a], shaved them, cut their garments in half up to the hips[b], and sent them away.
translation:
  language: sw
  text: Basi Hanuni akawachukua watumishi wa Daudi[a], akawanyoa, akakata mavazi yao kwa nusu hadi matakoni[b], kisha akawafukuza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika simulizi sambamba la 2 Samweli 10:4, imeelezwa kwamba Hanuni alinyoa nusu ya ndevu zao. Hapa Mambo ya Nyakati inasema tu kwamba aliwanyoa.
    reason: cross_reference
  - marker: b
    text: Au “hadi sehemu ya nyuma.” Neno la Kiebrania hurejelea eneo la nyuma au matako, likionyesha fedheha ya kuwaacha wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: watumishi
  rationale: Nomino hii inaweza kumaanisha watumishi au watumwa. Hapa inawahusu wajumbe waliokuwa katika utumishi wa kifalme wa Daudi, hivyo “watumishi” linafaa kwa muktadha bila kudokeza hali ya utumwa isiyosisitizwa.
- source_word: וַיְגַלְּחֵם
  choice: akawanyoa
  rationale: Kitenzi kinamaanisha kunyoa, na Mambo ya Nyakati hakitaji wazi kilichonyolewa. Tafsiri hii inadumisha kutokubainishwa huko badala ya kuingiza maelezo ya simulizi sambamba.
- source_word: מַדְוֵיהֶם
  choice: mavazi yao
  rationale: Neno hili hurejelea nguo au mavazi, huenda mavazi rasmi. “Mavazi” ni neno la kawaida lakini lenye hadhi inayofaa simulizi.
- source_word: בַּחֵצִי
  choice: katikati
  rationale: Katika muundo huu linaonyesha kwamba mavazi yalikatwa kwa nusu; “katikati” ni Kiswahili cha asili na kinaunganika vizuri na mpaka uliotajwa baadaye.
- source_word: עַד הַמִּפְשָׂעָה
  choice: mpaka kwenye matako
  rationale: Nomino ya Kiebrania hurejelea sehemu ya nyuma au matako. Tafsiri ya moja kwa moja inadumisha picha ya kufedheheshwa kwa kuwaacha wazi.
- source_word: וַיְשַׁלְּחֵם
  choice: akawaacha waende
  rationale: Kitenzi ni “kutuma/kuondosha.” Katika Kiswahili, “akawaacha waende” huonyesha kwa kawaida kwamba aliwafukuza baada ya kuwafedhehesha.
