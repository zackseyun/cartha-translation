  text: וַ/יֹּאמְרוּ֩ שָׂרֵ֨י בְנֵי עַמּ֜וֹן לְ/חָנ֗וּן הַֽ/מְכַבֵּ֨ד דָּוִ֤יד אֶת אָבִ֨י/ךָ֙ בְּ/עֵינֶ֔י/ךָ כִּֽי שָׁלַ֥ח לְ/ךָ֖ מְנַחֲמִ֑ים הֲ/לֹ֡א בַּ֠/עֲבוּר לַ/חְקֹ֨ר וְ/לַ/הֲפֹ֤ךְ וּ/לְ/רַגֵּל֙ הָ/אָ֔רֶץ בָּ֥אוּ עֲבָדָ֖י/ו אֵלֶֽי/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/003.yaml
  text: But the princes of the Ammonites said to Hanun[a], “Is David honoring your father in your sight because he has sent comforters to you? Have not his servants come to you in order to search out, to overthrow[b], and to spy out the land?”
translation:
  language: sw
  text: Lakini wakuu wa Waamoni wakamwambia Hanuni, “Je, unadhani Daudi anamheshimu baba yako kwa sababu amekutumia watu wa kukufariji? Je, watumishi wake hawajaja kwako ili kuichunguza, kuipindua[a], na kuipeleleza nchi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuigeuza.” Kitenzi cha Kiebrania kinaweza kumaanisha kugeuza au kupindua; hapa huenda kinadokeza kuivuruga au kuiangusha nchi kwa uhasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: wakuu
  rationale: Neno hili linaonyesha watawala au maafisa wa ngazi ya juu; “wakuu” ni la kawaida na lenye hadhi katika muktadha wa kifalme.
- source_word: הַמְכַבֵּד
  choice: anamheshimu
  rationale: Kitenzi כבד hapa humaanisha kumpa mtu heshima au kumtendea kwa staha.
- source_word: בְּעֵינֶיךָ
  choice: unadhani
  rationale: Nahau ya Kiebrania, kihalisi “machoni pako,” inahusu mtazamo au hukumu ya Hanuni; muundo wa swali kwa Kiswahili unawasilisha maana hiyo kwa kawaida.
- source_word: מְנַחֲמִים
  choice: watu wa kukufariji
  rationale: Hawa ni watu waliotumwa kumpa Hanuni faraja baada ya kufiwa; kifungu hiki ni wazi na cha kawaida kuliko nomino “wafariji” katika muktadha huu.
- source_word: בַּעֲבוּר
  choice: ili
  rationale: Kihusishi hiki kinaonyesha kusudi la kuja kwa watumishi.
- source_word: לַחְקֹר
  choice: kuichunguza
  rationale: חקר humaanisha kuchunguza au kutafuta habari kwa makini, jambo linalofaa katika mlolongo huu wa upelelezi.
- source_word: וְלַהֲפֹךְ
  choice: kuipindua
  rationale: הפך humaanisha kugeuza au kupindua; hapa inaweza kudokeza njama ya kuangusha au kuvuruga nchi, bila kufuta taswira ya msingi ya kitenzi.
- source_word: וּלְרַגֵּל
  choice: kuipeleleza
  rationale: Katika piel, רגל hutaja upelelezi wa nchi au eneo kwa kusudi la kijeshi.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: אֶרֶץ hapa ni eneo au nchi ya Waamoni; “nchi” ni tafsiri ya asili katika Kiswahili.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika mazingira ya kifalme neno linaweza kumaanisha watumishi au wajumbe wa mfalme; “watumishi wake” halibainishi cheo kisichotajwa.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, katika mtindo wa simulizi wenye heshima na unaoeleweka kwa msomaji wa kawaida. Swali la kwanza limewekwa kwa mtindo wa asili wa Kiswahili huku likihifadhi mashaka ya wakuu kuhusu nia ya Daudi.
