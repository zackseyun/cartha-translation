base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/012.yaml
  text: And he said[a], “If Aram is too strong for me, then you shall be my salvation; but if the Ammonites are too strong for you[b], then I will save you.”
translation:
  language: sw
  text: Naye akasema, “Ikiwa Aramu ina nguvu kuliko mimi[a], basi utaniokoa[b]; lakini ikiwa Waamoni wana nguvu kuliko wewe, basi nitakuokoa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa Aramu inanizidi nguvu”; vivyo hivyo baadaye, “ikiwa Waamoni wanakuzidi nguvu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi zaidi, “utakuwa kwangu kwa ajili ya wokovu”; katika muktadha huu ni nahau ya kuja kumsaidia au kumwokoa mtu vitani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Naye akasema
  rationale: Huwakilisha mtiririko wa simulizi wa wayyiqtol kwa Kiswahili cha kawaida na kuunganisha mstari huu na uliotangulia.
- source_word: אֲרָם
  choice: Aramu
  rationale: Jina la eneo au taifa limetoholewa moja kwa moja badala ya kubadilishwa kuwa jina la kisasa la kisiasa. Upatanisho wa umoja unalingana pia na kitenzi cha umoja katika Kiebrania.
- source_word: תֶּחֱזַק / יֶחֶזְקוּ (חזק)
  choice: ina/wana nguvu kuliko
  rationale: Muundo חזק מן unaonyesha ulinganisho wa nguvu katika mapigano. Kauli hii ya Kiswahili huhifadhi ulinganisho huo bila kuamua zaidi ya maandishi iwapo tayari adui ameshinda.
- source_word: וְהָיִיתָ לִּי לִתְשׁוּעָה
  choice: basi utaniokoa
  rationale: Neno kwa neno ni ‘utakuwa kwangu kwa ajili ya wokovu/ukombozi,’ lakini hapa ni nahau ya kumwendea mwenzake na kumwokoa vitani. ‘Utaniokoa’ ni ya kawaida na wazi katika Kiswahili.
- source_word: בְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Hili ndilo jina la kawaida la watu hao kwa Kiswahili; huepuka tafsiri ngumu ya neno kwa neno ‘wana wa Amoni’ huku likihifadhi rejeleo.
- source_word: וְהוֹשַׁעְתִּיךָ (ישע)
  choice: basi nitakuokoa
  rationale: Hiphil ya ישע humaanisha kuokoa au kukomboa. Katika muktadha huu ni kuokoa vitani, na ‘nitakuokoa’ ni ya asili na inalingana na kauli ya kwanza.
