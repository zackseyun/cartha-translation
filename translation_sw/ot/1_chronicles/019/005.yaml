translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa sasa na hadhi inayofaa maandiko. “Kuwalaki” ni neno sanifu na linaloeleweka kwa maana ya kwenda kuwapokea wanaokuja. Tanbihi imewekwa baada ya kishazi kinachohusika moja kwa moja; tanbihi ya pili ya Kiingereza haikuhamishwa kwenye alama isiyolingana, kwa kuwa maelezo yake yanahusu “wamefedheheshwa sana,” si kuota kwa ndevu.
