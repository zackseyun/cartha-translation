base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/005.yaml
  text: They went and told David about the men[a], and he sent to meet them, because the men were greatly humiliated. And the king said, “Stay in Jericho until your beards have grown back[b], then return.”
translation:
  language: sw
  text: Wakaenda wakamweleza Daudi habari za watu hao, naye akatuma[a] kuwalaki, kwa sababu watu hao walikuwa wamefedheheshwa sana.[b] Mfalme akasema, “Kaeni Yeriko mpaka ndevu zenu zitakapoota tena; kisha mrudi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hakitaji wazi ni nani au nini aliyetumwa kuwalaki; yaweza pia kutafsiriwa, “naye akatuma wajumbe kwenda kuwalaki.”
    reason: lexical_alternative
  - marker: b
    text: “Walikuwa wamefedheheshwa sana” yaweza pia kutafsiriwa, “walikuwa na aibu kubwa” au “walikuwa wamedhalilishwa sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיַּגִּידוּ לְדָוִיד עַל הָאֲנָשִׁים
  choice: Watu wakaenda wakamweleza Daudi habari za wale watu
  rationale: Muundo huu unafuata mfululizo wa simulizi wa vitenzi vya Kiebrania na kutofautisha kwa kawaida wale waliotoa taarifa na wale waliokuwa wameaibishwa.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: naye akatuma watu kwenda kuwalaki
  rationale: Kiebrania hakitaji wazi waliotumwa. Kiswahili huhitaji kijalizo cha kawaida hapa; “watu” ni kidokezo kisicho maalumu kuliko “wajumbe,” huku tanbihi ikihifadhi kutotajwa huko katika chanzo.
- source_word: נִכְלָמִים מְאֹד
  choice: walikuwa wamefedheheshwa sana
  rationale: “Kufedheheshwa” linaonyesha aibu na kudhalilishwa hadharani katika muktadha huu; “sana” linawakilisha מְאֹד.
- source_word: שְׁבוּ בִירֵחוֹ
  choice: Kaeni Yeriko
  rationale: ישׁב hapa humaanisha kubaki au kukaa kwa muda, na “Kaeni” ni amri ya kawaida ya Kiswahili. Jina la mahali limetoholewa kuwa “Yeriko.”
- source_word: עַד אֲשֶׁר יְצַמַּח זְקַנְכֶם
  choice: mpaka ndevu zenu zitakapoota tena
  rationale: צמח ni kuota au kukua; “tena” linaeleweka kutokana na ndevu zilizokatwa katika mstari uliotangulia. Wingi wa “ndevu zenu” unafaa kwa kundi linalosemewa.
- source_word: וְשַׁבְתֶּם
  choice: kisha mrudi
  rationale: Muundo unaonyesha tendo linalofuata baada ya ndevu kuota; “kisha” huwasilisha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Cheo cha Daudi kimehifadhiwa kama kilivyo katika Kiebrania badala ya kubadilishwa kuwa jina lake.
