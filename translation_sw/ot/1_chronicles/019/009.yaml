translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. “Waamoni” ni asili kuliko tafsiri ya neno kwa neno “wana wa Amoni”; tanbihi huhifadhi muundo wa Kiebrania. “Mwingilio” huzuia kuamua bila ushahidi kwamba פֶּתַח lazima iwe lango rasmi.
