base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/009.yaml
  text: And the sons of Ammon came out and drew up for battle at the entrance of the city[d][c][b][a], while the kings who had come were by themselves in the field.
translation:
  language: sw
  text: Nao Waamoni[a] wakatoka, wakajipanga kwa vita[b] kwenye mwingilio wa mji[c], huku wafalme waliokuwa wamekuja wakiwa peke yao uwanjani.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “wana wa Amoni.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wakajipanga katika safu za vita.” Msemo wa Kiebrania unahusu kupanga vikosi tayari kwa mapigano.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwenye lango la mji.” Hata hivyo, neno la Kiebrania hapa lina maana pana zaidi ya “mwingilio” au “uwazi” kuliko neno la kawaida linalomaanisha lango.
    reason: lexical_alternative
  - marker: d
    text: Yaani, wafalme waliokuwa wamekuja walikuwa kando na Waamoni, katika eneo la wazi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: wakatoka
  rationale: Kitenzi יצא katika simulizi kina maana ya kutoka; “wakatoka” ni cha kawaida na hakilazimishi mtazamo wa “kuja” au “kwenda” usioelezwa wazi katika Kiswahili.
- source_word: בְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Ingawa Kiebrania kinasema kihalisi “wana wa Amoni,” “Waamoni” ndilo jina la kawaida na wazi la watu hao katika Kiswahili.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: wakajipanga kwa ajili ya vita
  rationale: Msemo huu wa kijeshi unaeleza kupanga vikosi katika mpangilio wa mapigano, si kuanza kupigana tu.
- source_word: פֶּתַח הָעִיר
  choice: kwenye mwingilio wa mji
  rationale: פֶּתַח ni sehemu ya kuingilia au uwazi; “mwingilio” huhifadhi maana hiyo bila kuibadili moja kwa moja kuwa lango.
- source_word: וְהַמְּלָכִים אֲשֶׁר בָּאוּ
  choice: huku wale wafalme waliokuwa wamekuja
  rationale: “Huku” huonyesha tofauti ya mahali kati ya Waamoni na wafalme washirika kwa Kiswahili cha asili.
- source_word: לְבַדָּם
  choice: peke yao
  rationale: Maneno haya yanaonyesha kuwa wafalme na majeshi yao walikuwa kando na Waamoni, si kwamba kila mfalme alikuwa bila watu wengine.
- source_word: בַּשָּׂדֶה
  choice: uwanjani
  rationale: Katika muktadha wa kijeshi, “uwanjani” huwasilisha eneo la wazi nje ya mji kwa lugha ya kawaida, huku maana ya msingi ya שׂדה ikihifadhiwa.
