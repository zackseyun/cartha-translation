  yaml_path: translation/ot/1_chronicles/019/001.yaml
  text: After this, Nahash king of the Ammonites died, and his son reigned in his place.
translation:
  language: sw
  text: Baada ya hayo, Nahashi, mfalme wa Waamoni, akafa, na mwanawe akawa mfalme mahali pake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Kirai hiki cha masimulizi kinaonyesha mpito wa wakati. “Baada ya hayo” ni cha asili katika Kiswahili na kinahifadhi maana bila uzito wa tafsiri ya neno kwa neno, “ikawa baada ya hayo.”
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kitenzi מות humaanisha kufa moja kwa moja. “Akafa” ni wazi na hakipunguzi ukali wa usemi wa Kiebrania.
- source_word: נָחָשׁ
  choice: Nahashi
  rationale: Jina limetoholewa kwa namna inayosomeka kwa urahisi katika Kiswahili, kwa kuongezwa irabu ya mwisho kulingana na matumizi yaliyozoeleka ya majina ya kibiblia.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: mfalme wa Waamoni
  rationale: Ingawa muundo halisi ni “mfalme wa wana wa Amoni,” “Waamoni” ni jina la kawaida la watu hao katika Kiswahili na linawasilisha rejeo kwa usahihi na kwa ufupi.
- source_word: וַיִּמְלֹךְ
  choice: akawa mfalme
  rationale: Katika muktadha huu מלך inaonyesha mwana kuingia katika utawala wa kifalme. “Akawa mfalme” ni ya kawaida zaidi katika Kiswahili kuliko “akatawala,” ambayo peke yake inaweza isionyeshe wazi kurithi ufalme.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Kiambishi cha nafsi kinamrejelea Nahashi waziwazi; “mwanawe” ni tafsiri fupi na ya asili.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Neno hili linaonyesha kurithi nafasi au cheo cha mtangulizi. “Mahali pake” ni usemi wa kawaida wa Kiswahili kwa urithi wa kifalme.
