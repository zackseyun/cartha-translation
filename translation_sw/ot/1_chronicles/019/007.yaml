  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa Biblia lakini kinachoeleweka kwa wasomaji wa sasa. Majina yameandikwa Maaka, Medeba, na Amoni; ‘vitani’ limetumiwa badala ya usemi mzito zaidi ‘kwenye vita.’
