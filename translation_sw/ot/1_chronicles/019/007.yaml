base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/007.yaml
  text: So they hired for themselves thirty-two thousand chariots[a], and the king of Maacah with his people. They came and camped before Medeba[b], and the sons of Ammon gathered from their cities and came to battle.
translation:
  language: sw
  text: Basi wakajikodishia magari ya vita elfu thelathini na mbili[a], pamoja na mfalme wa Maaka na watu wake. Wakaja wakapiga kambi mbele ya Medeba; nao wana wa Amoni[b] wakakusanyika kutoka miji yao, wakaja vitani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Magari ya vita” yanaweza pia kumaanisha kikosi cha magari ya vita kwa ujumla, si lazima idadi ya magari yenyewe tu.
    reason: lexical_alternative
  - marker: b
    text: Au “Waamoni.” Kiebrania kinasema kihalisi “wana wa Amoni,” jina la kawaida la kabila au taifa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכְּרוּ לָהֶם
  choice: wakajikodishia
  rationale: Kitenzi kina maana ya kupata kwa malipo, na kiwakilishi cha manufaa kinaonyesha kuwa walifanya hivyo kwa ajili yao wenyewe. ‘Wakajikodishia’ ni usemi mfupi na wa kawaida wa Kiswahili unaobeba maana hizo bila kutaja wazi askari wa kukodi.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף
  choice: elfu thelathini na mbili
  rationale: Mpangilio wa namba umewekwa katika mtindo wa kawaida wa Kiswahili huku thamani ya 32,000 ikihifadhiwa kikamilifu.
- source_word: רֶכֶב
  choice: magari ya vita
  rationale: Neno la Kiebrania linaweza kumaanisha magari ya vita yenyewe au kikosi cha magari hayo kwa ujumla. ‘Magari ya vita’ ni wazi kwa msomaji wa sasa na halifungi maana ya jumla ya kijeshi.
- source_word: מֶלֶךְ מַעֲכָה
  choice: mfalme wa Maaka
  rationale: Muundo wa Kiebrania unaonyesha mfalme anayetawala Maaka, si mfalme mwenye jina Maaka.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: Neno עם kwa kawaida ni ‘watu.’ Ingawa muktadha wa vita unaweza kumaanisha jeshi lake, tafsiri hii haibani maana kuliko ilivyo katika Kiebrania.
- source_word: וַיַּחֲנוּ לִפְנֵי מֵידְבָא
  choice: wakapiga kambi mbele ya Medeba
  rationale: Usemi huu unahifadhi tendo la kuweka kambi na uhusiano wa mahali unaoweza kumaanisha mbele ya mji au kuukabili.
- source_word: בְנֵי עַמּוֹן
  choice: wana wa Amoni
  rationale: Hii inafuata kwa karibu usemi halisi wa Kiebrania, ambao ni jina la kawaida la kabila au taifa; ‘Waamoni’ ni tafsiri mbadala ya asili.
- source_word: נֶאֶסְפוּ מֵעָרֵיהֶם
  choice: wakakusanyika kutoka miji yao
  rationale: Tafsiri inahifadhi maana ya kukusanyika kwa ajili ya vita na chanzo chao katika miji mbalimbali.
- source_word: וַיָּבֹאוּ לַמִּלְחָמָה
  choice: wakaja vitani
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaomaanisha walikuja kushiriki katika vita, bila kuongeza maelezo yasiyokuwapo katika chanzo.
