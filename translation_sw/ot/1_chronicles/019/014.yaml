base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/014.yaml
  text: So Joab and the people who were with him advanced before Aram for battle[a], and they fled before him.
translation:
  language: sw
  text: Basi Yoabu na watu waliokuwa pamoja naye wakakaribia Aramu ili kupigana[a], lakini Waaramu wakamkimbia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakasogea mbele ya Aramu kwa ajili ya vita,” au “wakasonga dhidi ya Aramu ili kupigana.” Kiebrania kinasema kihalisi “mbele ya Aramu,” kikitumia jina Aramu na nahau ya mahali katika muktadha wa vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: wakaisogelea
  rationale: Kitenzi נגשׁ humaanisha kukaribia au kusogea karibu. Katika muktadha wa kijeshi, “wakaisogelea” kinaonyesha kusonga kuelekea mapambano bila kuongeza wazo lisilokuwamo katika Kiebrania.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: na watu waliokuwa pamoja naye
  rationale: Huhifadhi maana ya kawaida ya הָעָם, “watu,” huku muktadha ukionyesha kuwa hawa ndio wapiganaji waliokuwa chini ya Yoabu.
- source_word: לִפְנֵי אֲרָם
  choice: Aramu
  rationale: Muundo wa Kiswahili “wakaisogelea Aramu” huwasilisha mwendo wa kwenda mbele ya au kuelekea jeshi la Aramu kwa lugha ya kawaida. Tanbihi inadumisha nahau ya mahali ya Kiebrania na uwezekano wa kuitafsiri kuwa “mbele ya Aramu” au “dhidi ya Aramu.”
- source_word: אֲרָם
  choice: Aramu
  rationale: Jina la mahali na taifa limetoholewa kama “Aramu,” badala ya kutumia “Siria,” ambalo lingeweza kuleta dhana ya taifa la kisasa, au kubadili moja kwa moja kuwa “Waaramu.”
- source_word: לַמִּלְחָמָה
  choice: ili kupigana
  rationale: Kiambishi לְ hapa kinaonyesha kusudi. “Ili kupigana” ni Kiswahili cha asili kinachowasilisha wazi kusudi la kukaribia kwao.
- source_word: וַיָּנוּסוּ
  choice: nao wakamkimbia
  rationale: נוס ni kukimbia ili kujiokoa. “Wakamkimbia” ni tafsiri ya moja kwa moja na huonyesha kuwa walitoroka, si kwamba walirudi nyuma kwa mpangilio tu.
- source_word: מִפָּנָיו
  choice: wakamkimbia
  rationale: Kirai hiki ni “kutoka mbele yake/uso wake.” Kiambishi cha umoja kinamrejelea Yoabu kwa kawaida; katika Kiswahili maana hiyo imebeba katika kiambishi cha yambwa “-m-.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wakaisogelea Aramu” ni usemi wa kawaida kiasi unaohifadhi jina Aramu na wazo la kukaribia, huku tanbihi ikihifadhi nahau halisi ya Kiebrania. Kiwakilishi katika “nao” kinawarejelea majeshi ya Aramu, na “-m-” katika “wakamkimbia” kinamrejelea Yoabu.
