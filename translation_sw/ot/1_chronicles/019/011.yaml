  yaml_path: translation/ot/1_chronicles/019/011.yaml
  text: He put the rest of the troops under the command of Abishai his brother[a], and they drew up in battle formation to meet the Ammonites.
translation:
  language: sw
  text: Akawaweka askari waliobaki chini ya uongozi wa Abishai, ndugu yake[a], nao wakajipanga kwa vita ili kukabiliana na Waamoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “akawatia mkononi mwa Abishai, ndugu yake,” nahau inayomaanisha kuwakabidhi chini ya mamlaka au uongozi wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: askari waliobaki
  rationale: Ingawa הָעָם kwa kawaida ni ‘watu,’ katika muktadha huu wa kijeshi inarejelea kikosi kilichobaki; ‘askari waliobaki’ ni wazi na ya kawaida katika Kiswahili.
- source_word: נָתַן בְּיַד
  choice: akawaweka chini ya uongozi wa
  rationale: Nahau hiyo, kwa maana halisi ‘akawatia mkononi mwa,’ hapa inaonyesha kuwakabidhi askari kwa mamlaka na uongozi wa Abishai.
- source_word: אַבְשַׁי אָחִיו
  choice: Abishai ndugu yake
  rationale: Jina limeandikwa kwa umbo linalotambulika katika mapokeo ya Biblia ya Kiswahili, na אָחִיו imetafsiriwa moja kwa moja bila kubainisha zaidi uhusiano huo.
- source_word: וַיַּעַרְכוּ
  choice: wakajipanga kwa vita
  rationale: Katika muktadha wa kijeshi, ערך humaanisha kupanga vikosi tayari kwa mapambano; usemi huu ni wa asili na unaeleweka kwa wasomaji wa sasa.
- source_word: לִקְרַאת
  choice: ili kukabiliana na
  rationale: לִקְרַאת inaweza kumaanisha ‘kukutana na’ au ‘kukabili’; hapa mazingira ya vita yanafanya ‘kukabiliana na’ kuwa tafsiri ya kawaida bila kuongeza matokeo ya mapambano.
- source_word: בְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Hili ndilo jina la kawaida la taifa hilo katika Kiswahili, badala ya tafsiri halisi ‘wana wa Amoni.’
