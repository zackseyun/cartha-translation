translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaoeleweka kwa urahisi. Kiunganishi ‘Nao’ kinaendeleza simulizi, huku ‘akawaweka’ kikihifadhi mhusika mmoja wa kitenzi cha kwanza na ‘wakajipanga’ kikihifadhi wingi wa kitenzi kinachofuata.
