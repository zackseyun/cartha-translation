base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/013.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: sw
  text: Uwe hodari, nasi tujitie nguvu[a] kwa ajili ya watu wetu na kwa ajili ya miji ya Mungu wetu; Yahweh afanye lililo jema machoni pake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nasi tuwe hodari.” Kitenzi cha Kiebrania kina maana ya kujirejelea yenye mkazo.
    reason: lexical_alternative
  - marker: b
    text: Au, “Yahweh atafanya lililo jema machoni pake.” Umbo la Kiebrania linaweza kueleweka hapa kuwa la kutakia au la kutabiri.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: Uwe hodari
  rationale: Amri ya Qal kwa nafsi ya pili umoja inahimiza nguvu na ujasiri; “uwe hodari” ni usemi wa kawaida na wenye hadhi katika muktadha wa vita.
- source_word: וְנִתְחַזְּקָה
  choice: nasi na tujitie nguvu
  rationale: Kitenzi cha Hitpael cha kuhimiza nafsi ya kwanza wingi kina maana ya kujihusisha wenyewe kwa uthabiti; “tujitie nguvu” huhifadhi hali hiyo ya kujirejelea bila kuwa nzito.
- source_word: בְּעַד
  choice: kwa ajili ya
  rationale: Katika muktadha huu huonyesha kutenda kwa manufaa au kwa utetezi wa watu na miji; tafsiri hii ni ya kawaida na haiongezi wazi wazo la kupigana ambalo halimo katika neno lenyewe.
- source_word: עַמֵּנוּ
  choice: watu wetu
  rationale: עַם humaanisha watu kwa ujumla, si jeshi pekee, hata ingawa usemi unatolewa wakati wa vita.
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: miji ya Mungu wetu
  rationale: Huhifadhi kwa uwazi muundo wa Kiebrania na dai kwamba miji hiyo ni ya Mungu wao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: lililo jema machoni pake
  rationale: Huhifadhi taswira ya nahau ya Kiebrania huku ikieleweka kwa Kiswahili cha kawaida.
- source_word: יַעֲשֶׂה
  choice: afanye
  rationale: Umbo la utegemezi linaonyesha ombi au kukabidhi matokeo kwa Mungu, huku uwezekano wa maana ya wakati ujao ukielezwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina la agano lenyewe; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya hiari au utabiri katika kishazi cha mwisho
  choice: Yahweh afanye lililo jema machoni pake
  alternative: Yahweh atafanya lililo jema machoni pake
  rationale: Katika mfululizo wa mahimizo, umbo hili linaweza kuwa la kutakia au la kukabidhi matokeo kwa Mungu, lakini pia linaweza kueleweka kama utabiri. Tafsiri kuu huhifadhi msisitizo wa hiari, na tanbihi hutaja uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Tujitie nguvu” ni cha kawaida na huhifadhi maana ya kujirejelea; sentensi imeweka uwiano kati ya azimio la kibinadamu na kukabidhi matokeo kwa Yahweh.
