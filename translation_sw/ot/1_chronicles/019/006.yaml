base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/006.yaml
  text: When the Ammonites saw that they had become odious to David[a], Hanun and the Ammonites sent a thousand talents of silver to hire for themselves chariots and horsemen from Aram-naharaim, from Aram-maacah[b], and from Zobah.
translation:
  language: sw
  text: Waamoni walipoona kwamba walikuwa wamekuwa wenye kuchukiza kwa Daudi[a], Hanuni na Waamoni walituma talanta elfu moja za fedha ili kujikodishia magari ya vita na wapanda farasi kutoka Aramu-Naharaimu[b], Aramu-Maaka, na Soba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “walikuwa wamejifanya wanuke kwa Daudi,” nahau inayomaanisha kuwa wenye kuchukiza au wenye kuudhi kwake.'
    reason: lexical_alternative
  - marker: b
    text: Jina Aramu-Naharaimu kwa kawaida hueleweka kuwa “Aramu ya Mito Miwili,” yaani Mesopotamia.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: walipoona
  rationale: Huhifadhi maana ya msingi ya ‘kuona’ huku katika muktadha ikidokeza kutambua hali yao.
- source_word: בְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Hili ndilo jina la kawaida na la asili kwa Kiswahili la watu wa Amoni, badala ya tafsiri sisisi ‘wana wa Amoni.’
- source_word: הִתְבָּאֲשׁוּ עִם דָּוִיד
  choice: wamekuwa chukizo kwa Daudi
  rationale: Huwasilisha maana ya nahau kwamba walikuwa wamejifanya wenye kuchukiza mbele ya Daudi, bila kulazimisha taswira sisisi ya kunuka katika matini kuu.
- source_word: אֶלֶף כִּכַּר כֶּסֶף
  choice: talanta elfu moja za fedha
  rationale: Huhifadhi kipimo cha uzito cha kale bila kukibadili kwa makadirio ya kisasa yasiyo hakika.
- source_word: לִשְׂכֹּר לָהֶם
  choice: ili kujikodishia
  rationale: Kitenzi cha kujirejelea kinaonyesha kuwa walikodi vikosi hivyo kwa matumizi yao wenyewe.
- source_word: אֲרַם נַהֲרַיִם
  choice: Aramu-Naharaimu
  rationale: Unukuzi huu huhifadhi tabia ya jina la mahali; maana yake ya kijiografia inaelezwa katika tanbihi.
- source_word: אֲרַם מַעֲכָה
  choice: Aramu-Maaka
  rationale: Jina ambatani la eneo limenukuliwa kwa maumbo yanayosomeka kiasili katika Kiswahili.
- source_word: מִצּוֹבָה
  choice: Soba
  rationale: Ni umbo la Kiswahili la jina la mahali צובה.
- source_word: רֶכֶב
  choice: magari ya vita
  rationale: Nomino ya umoja inatumika kwa maana ya mkusanyiko; wingi huu unaeleza kwa uwazi magari ya kijeshi yanayokokotwa.
- source_word: וּפָרָשִׁים
  choice: wapanda farasi
  rationale: Hurejelea askari waliopanda farasi na kuoanisha kwa kawaida na ‘magari ya vita.’
