base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/019.yaml
  text: When the servants of Hadadezer saw that they had been defeated before Israel[a], they made peace with David and served him. And Aram was no longer willing to help the sons of Ammon.
translation:
  language: sw
  text: Watumishi wa Hadadezeri walipoona kwamba walikuwa wameshindwa mbele ya Israeli, wakafanya amani na Daudi na wakamtumikia. Na Aramu haikuwa tayari tena kuwasaidia Waamoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa maana halisi: “wana wa Amoni.” Hili ni jina la kikabila linalomaanisha Waamoni.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: Watumishi
  rationale: Katika muktadha huu wa kifalme na kisiasa, neno hili linaonyesha watu waliokuwa chini ya mamlaka ya Hadadezeri, bila kulazimisha maana ya utumwa wa kumilikiwa.
- source_word: נִגְּפוּ
  choice: walikuwa wameshindwa
  rationale: Hali ya Niphal hapa inaonyesha kushindwa vitani; tafsiri hii ni ya kawaida na haidai kwamba wote waliuawa.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: mbele ya Israeli
  rationale: Huhifadhi kwa namna ya kawaida nahau ya Kiebrania ya kushindwa mbele ya Israeli, ambayo katika muktadha inaweza pia kueleweka kuwa kushindwa na Israeli.
- source_word: וַיַּשְׁלִימוּ עִם דָּוִיד
  choice: wakafanya amani na Daudi
  rationale: Hiphil ya שלם pamoja na עִם ina maana ya kufanya au kufikia amani na mtu.
- source_word: וַיַּעַבְדֻהוּ
  choice: wakamtumikia
  rationale: Kitenzi kinaonyesha huduma au utiifu wa kisiasa kwa Daudi baada ya kufanya amani naye; tafsiri hii huhifadhi ufupi na upana wa maana ya chanzo.
- source_word: אֲרָם
  choice: Aramu
  rationale: Jina la taifa limehamishwa kwa umbo linalofaa Kiswahili badala ya kubadilishwa kuwa jina la kisasa la kijiografia.
- source_word: לְהוֹשִׁיעַ
  choice: kuwasaidia
  rationale: Katika muktadha wa muungano wa kijeshi, kitenzi kinamaanisha kuwapa msaada; ‘kuwasaidia’ ni cha asili na hakiongezi maana ya kiroho isiyokusudiwa hapa.
- source_word: בְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Ingawa maneno ya Kiebrania ni ‘wana wa Amoni,’ hapa ni jina la kikabila; ‘Waamoni’ ni tafsiri ya kawaida na wazi ya Kiswahili, huku maana halisi ikihifadhiwa katika tanbihi.
- source_word: עוֹד
  choice: tena
  rationale: Pamoja na ukanushaji, neno hili linaonyesha kwamba Aramu haikuwa tayari kuendelea kutoa msaada.
