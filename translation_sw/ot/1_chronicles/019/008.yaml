base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/008.yaml
  text: When David heard, he sent Joab and all the army of the mighty men.
translation:
  language: sw
  text: Daudi aliposikia hayo[a], akamtuma Yoabu pamoja na jeshi lote la mashujaa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipoarifiwa kuhusu hayo” au “alipopata habari hiyo.”
    reason: lexical_alternative
  - marker: b
    text: “Mashujaa” huenda ikamaanisha wapiganaji hodari wa Daudi au kikosi chake maalumu cha wapiganaji bora.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: aliposikia hayo
  rationale: Kitenzi שׁמע katika muktadha huu kinaonyesha kwamba Daudi alipokea habari. “Aliposikia hayo” ni Kiswahili cha kawaida na huunganisha kwa uwazi sentensi hii na taarifa iliyotangulia bila kuongeza maelezo mapya.
- source_word: וַיִּשְׁלַח
  choice: akamtuma
  rationale: שלח hapa ni kutuma mtu kwa shughuli ya kijeshi. Kiambishi cha yambwa “-m-” kinamtaja Yoabu kwa njia ya kawaida katika Kiswahili.
- source_word: יוֹאָב
  choice: Yoabu
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika tafsiri za Biblia za Kiswahili.
- source_word: כָּל
  choice: lote
  rationale: כָּל inahusu jeshi zima; “lote” linapatana kisarufi na nomino “jeshi.”
- source_word: צָבָא
  choice: jeshi
  rationale: Katika muktadha wa vita, צָבָא ni kikosi kilichopangwa kwa mapigano; “jeshi” ni neno la sasa, wazi na lenye hadhi.
- source_word: הַגִּבּוֹרִים
  choice: mashujaa
  rationale: גִּבּוֹרִים humaanisha wapiganaji hodari au mashujaa, na huenda hapa ikarejelea kikosi cha wapiganaji bora wa Daudi. “Mashujaa” huhifadhi maana hiyo bila kuifanya iwe ya kiufundi kupita kiasi.
- source_word: וְאֵת כָּל צָבָא הַגִּבּוֹרִים
  choice: pamoja na jeshi lote la mashujaa
  rationale: Muundo huu huhifadhi uhusiano wa hali ya kumiliki/kuhusisha katika צְבָא הַגִּבּוֹרִים na pia unaonyesha kwamba Yoabu na jeshi ndio waliotumwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa urahisi. Muundo “aliposikia … akamtuma” unaonyesha mfuatano wa matendo wa vitenzi vya Kiebrania kwa Kiswahili cha kawaida. Viashiria vyote vya tanbihi vimewekwa katika matini kuu.
