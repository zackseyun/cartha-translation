base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/010.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose some of the best men from all Israel and arranged them to meet Aram.
translation:
  language: sw
  text: Yoabu alipoona kwamba safu ya vita ilikuwa ikimkabili mbele na nyuma, akachagua baadhi ya mashujaa bora kutoka katika Israeli yote[a], akawapanga wakabiliane na Aramu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka miongoni mwa mashujaa wote walioteuliwa wa Israeli.” Neno la Kiebrania linaweza kumaanisha wapiganaji teule au bora.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Aramu”; hapa maana yake ni majeshi ya Waaramu.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: alipoona
  rationale: Kitenzi 'ona' kinahifadhi mtindo wa simulizi wa Kiebrania na hapa kwa kawaida kinajumuisha kutambua hali ya kivita.
- source_word: פְנֵי הַמִּלְחָמָה אֵלָיו פָּנִים וְאָחוֹר
  choice: alikabiliwa na vita mbele na nyuma
  rationale: Usemi unaonyesha kwamba adui alikuwa amemwelekea kutoka pande mbili; tafsiri hii ni ya asili kwa Kiswahili bila kuongeza wazo la kuzingirwa kabisa.
- source_word: מִכָּל בָּחוּר בְּיִשְׂרָאֵל
  choice: baadhi ya mashujaa bora kutoka katika Israeli yote
  rationale: 'בָּחוּר katika muktadha huu wa kijeshi humaanisha wapiganaji walioteuliwa au bora, na מִן inaeleweka kuwa ya sehemu: alichagua baadhi yao.'
- source_word: וַיַּעֲרֹךְ
  choice: akawapanga
  rationale: Katika muktadha wa vita, ערך ni kupanga wanajeshi katika safu au mpangilio wa mapigano.
- source_word: לִקְרַאת אֲרָם
  choice: wakabiliane na Aramu
  rationale: לִקְרַאת hapa ina maana ya kwenda kukutana na adui au kumkabili; 'wakabiliane na' huonyesha wazi muktadha wa kijeshi.
- source_word: אֲרָם
  choice: Aramu
  rationale: Jina la Kiebrania limehifadhiwa kwa umbo linalotumika kwa kawaida katika Kiswahili, badala ya kutumia jina la kijiografia la baadaye.
