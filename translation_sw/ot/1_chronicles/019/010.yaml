translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Mashujaa' limetumiwa kwa wapiganaji hodari, na 'akawapanga' linaendeleza mfululizo wa simulizi huku muktadha ukibainisha mpangilio wa kijeshi.
