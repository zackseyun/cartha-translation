  text: וַ/יֻּגַּ֣ד לְ/דָוִ֗יד וַ/יֶּאֱסֹ֤ף אֶת כָּל יִשְׂרָאֵל֙ וַ/יַּעֲבֹ֣ר הַ/יַּרְדֵּ֔ן וַ/יָּבֹ֣א אֲלֵ/הֶ֔ם וַֽ/יַּעֲרֹ֖ךְ אֲלֵ/הֶ֑ם וַ/יַּעֲרֹ֨ךְ דָּוִ֜יד לִ/קְרַ֤את אֲרָם֙ מִלְחָמָ֔ה וַ/יִּֽלָּחֲמ֖וּ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, came against them, and drew up in battle formation against them. Then David drew up for battle to meet Aram, and they fought with him.
translation:
  language: sw
  text: Daudi alipoarifiwa, aliwakusanya Waisraeli wote, akavuka Yordani, akawaendea, akapanga safu za vita dhidi yao. Daudi akapanga safu za vita kukutana na Aramu vitani, nao wakapigana naye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nao wakapigana dhidi yake.” Kiebrania kinasema kihalisi “naye,” na katika muktadha huu maana yake ni kwamba walipigana dhidi ya Daudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִיד
  choice: Daudi alipoarifiwa
  rationale: Muundo huu unaonyesha hali ya kutendwa na mfuatano wa wakati bila kuongeza aliyempa Daudi taarifa.
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: aliwakusanya Waisraeli wote
  rationale: ‘Kukusanya’ lina maana ya kuwakutanisha au kuwaita pamoja; katika muktadha huu linaweza kueleweka kama kuwakusanya kwa ajili ya vita bila kulazimisha maelezo hayo ndani ya kifungu.
- source_word: וַיַּעֲבֹר הַיַּרְדֵּן
  choice: akavuka Yordani
  rationale: Huu ni usemi mfupi na wa kawaida wa Kiswahili unaowakilisha kitendo cha kuvuka mto uliotajwa.
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: akawaendea
  rationale: Neno hili linahifadhi wazo la kuelekea walikokuwa; katika muktadha wa kijeshi linaweza pia kudokeza kuwaendea kwa uhasama bila kulipanua kupita kiasi.
- source_word: וַיַּעֲרֹךְ אֲלֵיהֶם
  choice: na kupanga safu za vita dhidi yao
  rationale: Katika muktadha wa kijeshi, ערך humaanisha kupanga au kuandaa safu. ‘Safu za vita’ huifanya maana hiyo ieleweke kwa msomaji wa kawaida.
- source_word: וַיַּעֲרֹךְ דָּוִיד לִקְרַאת אֲרָם מִלְחָמָה
  choice: Daudi akapanga safu za vita ili kukabiliana na Aramu
  rationale: Tafsiri inahifadhi kurudiwa kwa kitendo cha kupanga safu, huku לִקְרַאת ikitolewa kwa maana ya kuelekea kukutana na adui vitani.
- source_word: אֲרָם
  choice: Aramu
  rationale: Jina la kale limehifadhiwa badala ya kubadilishwa kuwa jina la baadaye la kisiasa ‘Siria’ au kufasiriwa kuwa ‘Waaramu.’
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: nao wakapigana naye
  rationale: ‘Wakapigana naye’ linafuata kwa karibu kiambishi עִמּוֹ, ‘pamoja naye/na yeye,’ huku muktadha ukionyesha kuwa walipigana dhidi ya Daudi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Kurudiwa kwa ‘akapanga safu za vita’ kumehifadhiwa kwa sababu kunalingana na kurudiwa kwa kitenzi cha Kiebrania.
