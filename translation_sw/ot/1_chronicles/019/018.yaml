base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/018.yaml
  text: And Aram fled before Israel[a], and David killed seven thousand chariot warriors from Aram and forty thousand foot soldiers[b], and he put Shophach the commander of the army to death.
translation:
  language: sw
  text: Waaramu wakakimbia kutoka mbele ya Israeli, naye Daudi akaua miongoni mwa Waaramu askari elfu saba wa magari ya vita[a] na askari wa miguu elfu arobaini. Pia akamuua Shofaki[b], mkuu wa jeshi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kifungu sambamba katika 2 Samweli 10:18 kinasema, “magari ya vita mia saba na wapanda farasi elfu arobaini.” Hapa katika Mambo ya Nyakati imeandikwa, “askari elfu saba wa magari ya vita na askari wa miguu elfu arobaini.”
    reason: textual_variant
  - marker: b
    text: Katika simulizi sambamba la 2 Samweli 10:16, 18, Shofaki anaitwa Shobaki.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרָם
  choice: Waaramu
  rationale: Katika muktadha huu jina la pamoja ‘Aramu’ linamaanisha vikosi vya watu wa Aramu; ‘Waaramu’ ni Kiswahili cha kawaida na huepuka jina la baadaye la kisiasa ‘Siria’.
- source_word: וַיָּנָס
  choice: wakakimbia
  rationale: Kitenzi נוּס humaanisha kukimbia au kutoroka, hasa baada ya kushindwa vitani.
- source_word: מִלִּפְנֵי יִשְׂרָאֵל
  choice: mbele ya Israeli
  rationale: Huhifadhi nahau ya Kiebrania inayowasilisha Waaramu wakikimbia kutoka mbele ya jeshi la Israeli baada ya kushindwa.
- source_word: וַיַּהֲרֹג דָּוִיד
  choice: Daudi akaua
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya הרג katika simulizi la vita.
- source_word: שִׁבְעַת אֲלָפִים רֶכֶב
  choice: askari elfu saba wa magari ya vita
  rationale: רֶכֶב kwa msingi humaanisha magari ya vita au kikosi chake; hapa imetumiwa kimetonimia kwa askari wa kikosi cha magari bila kuwafanya kuwa madereva pekee.
- source_word: וְאַרְבָּעִים אֶלֶף אִישׁ רַגְלִי
  choice: askari wa miguu elfu arobaini
  rationale: אִישׁ רַגְלִי ni nahau ya kijeshi inayomaanisha askari anayepigana kwa miguu.
- source_word: שׁוֹפַךְ
  choice: Shofaki
  rationale: Ni umbo la jina katika Mambo ya Nyakati lililorekebishwa kwa tahajia na matamshi ya Kiswahili; umbo tofauti katika Samweli linaelezwa katika tanbihi.
- source_word: שַׂר הַצָּבָא
  choice: mkuu wa jeshi
  rationale: Ni usemi wa asili, wazi na wenye hadhi kwa cheo cha kiongozi wa jeshi.
- source_word: הֵמִית
  choice: akamuua
  rationale: Hifili ya מות humaanisha kusababisha afe. ‘Akamuua’ ni ya asili katika Kiswahili na muktadha haudai maana mahsusi ya hukumu rasmi ya kifo.
