base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/016.yaml
  text: When Aram saw that they had been defeated before Israel[a], they sent messengers and brought out the Arameans who were from beyond the River[b], with Shophach the commander of Hadadezer’s army before them.
translation:
  language: sw
  text: Aramu[a] walipoona kwamba walikuwa wameshindwa mbele ya Israeli, walituma wajumbe na wakawatoa Waaramu waliokuwa ng’ambo ya Mto[b], huku Shofaki, mkuu wa jeshi la Hadadezeri, akiwa mbele yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa mapokeo, “Shamu” au “Washami”; Kiebrania ni “Aramu/Waaramu.”
    reason: lexical_alternative
  - marker: b
    text: Au “ng’ambo ya Frati”; Kiebrania kinasema tu “ng’ambo ya Mto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: Waaramu
  rationale: Katika muktadha huu jina hilo linawakilisha watu na majeshi ya Aramu. “Waaramu” ni ya kawaida na ya kueleweka katika Kiswahili, huku ikihifadhi jina la Kiebrania badala ya kutumia “Washami.”
- source_word: נִגְּפוּ
  choice: walikuwa wameshindwa
  rationale: Kauli hii ya Kiebrania inaonyesha kushindwa vitani; tafsiri hii ni wazi bila kudokeza kwamba wote waliangamizwa.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: mbele ya Israeli
  rationale: Inahifadhi tamathali ya Kiebrania, ambayo katika muktadha huu humaanisha kushindwa na Israeli.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika mazingira haya ya kisiasa na kijeshi, neno hili linamaanisha wajumbe wa kibinadamu, si malaika.
- source_word: וַיּוֹצִיאוּ אֶת אֲרָם
  choice: kuwaleta Waaramu
  rationale: Hiphil ya יצא ina maana ya kuwatoa au kuwaleta watoke; hapa inahusu kuleta vikosi vya ziada vya Waaramu. “Kuwaleta” ni ya asili katika Kiswahili na inaeleza hatua hiyo bila kuongeza maelezo yasiyokuwapo.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: ng’ambo ya Mto
  rationale: Hii ndiyo maana ya moja kwa moja ya maneno ya Kiebrania. Ingawa huenda Mto unaokusudiwa ni Frati, jina hilo halitajwi wazi katika maandishi.
- source_word: וְשׁוֹפַךְ
  choice: huku Shofaki
  rationale: Kiunganishi kinamtambulisha Shofaki kama aliyekuwa pamoja na vikosi hivyo; “huku” huunganisha kifungu kwa Kiswahili cha asili.
- source_word: שַׂר צְבָא הֲדַדְעֶזֶר
  choice: mkuu wa jeshi la Hadadezeri
  rationale: Ni tafsiri ya kawaida na wazi ya cheo hiki cha kijeshi.
- source_word: לִפְנֵיהֶם
  choice: akiwa mbele yao
  rationale: Inahifadhi usemi wa Kiebrania na uwezekano wake wa kumaanisha kwamba alikuwa upande wa mbele au alikuwa akiwaongoza, bila kulazimisha maana moja.
theological_decisions: []
