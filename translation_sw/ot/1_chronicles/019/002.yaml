base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, because his father showed kindness to me.” So David sent messengers to comfort him concerning his father. And David’s servants came to the land of the Ammonites, to Hanun, to comfort him.
translation:
  language: sw
  text: 'Daudi akasema, “Nitamtendea wema Hanuni mwana wa Nahashi, kwa sababu baba yake alinitendea wema.” Basi Daudi akatuma wajumbe wamfariji kuhusu baba yake.[a] Watumishi wa Daudi wakafika katika nchi ya Waamoni kwa Hanuni ili wamfariji.


    [a] Yaani, wamfariji kwa sababu ya kifo cha baba yake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, wamfariji kwa sababu ya kifo cha baba yake.
    reason: Ufafanuzi wa muktadha wa maombolezo unaodokezwa na usemi wa Kiebrania bila kuuelezwa wazi katika maandishi makuu.
lexical_decisions:
- source_word: חֶסֶד
  choice: wema
  rationale: Katika muktadha huu wa uhusiano wa kisiasa na wa kibinafsi, neno hili linaonyesha tendo la fadhili na uaminifu kati ya wahusika. “Wema” ni la kawaida na linafaa katika sehemu zote mbili za mstari.
- source_word: עָשָׂה חֶסֶד עִם
  choice: kumtendea wema
  rationale: Hii ni tafsiri ya asili ya nahau ya Kiebrania katika Kiswahili na hudumisha wazo la kumfanyia mtu tendo la fadhili.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Wanaotajwa ni wawakilishi wa kibinadamu waliotumwa na Daudi; “wajumbe” ni wazi bila kulazimisha hadhi rasmi zaidi ya maandishi.
- source_word: לְנַחֲמוֹ
  choice: wamfariji
  rationale: Kitenzi hiki katika muktadha wa kufiwa kinamaanisha kumpa mtu faraja; “kumfariji” ni Kiswahili cha kawaida na chenye heshima.
- source_word: עַל אָבִיו
  choice: kwa ajili ya baba yake
  rationale: Kirai hiki kinaonyesha sababu au tukio lililoleta haja ya faraja. Tafsiri kuu inadumisha usemi mpana, huku tanbihi ikifafanua kwamba kinachodokezwa ni kifo cha baba yake.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: nchi ya Waamoni
  rationale: “Waamoni” ni jina la kawaida la watu hawa kwa Kiswahili, na “nchi ya Waamoni” huwasilisha maana ya kijiografia kwa njia ya asili.
- source_word: בֶּן נָחָשׁ
  choice: mwana wa Nahashi
  rationale: Muundo wa ukoo umetafsiriwa moja kwa moja, na jina limeandikwa kwa namna inayofaa fonolojia ya Kiswahili.
- source_word: וַיֹּאמֶר ... וַיִּשְׁלַח ... וַיָּבֹאוּ
  choice: akasema ... Basi ... akatuma ... wakafika
  rationale: Mfululizo wa masimulizi umeonyeshwa kwa viambishi vya wakati vya Kiswahili; “Basi” linaonyesha kwamba kutuma wajumbe kulitokana na kusudi alilolitaja Daudi.
- source_word: עַבְדֵי דָוִיד
  choice: watumishi wa Daudi
  rationale: Neno linawahusu watu waliokuwa katika utumishi wa Daudi. “Watumishi” ni tafsiri ya moja kwa moja na haiongezi kwa lazima wazo la maafisa wa serikali.
