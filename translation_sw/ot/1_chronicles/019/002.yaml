translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wazi, wa sasa na wenye heshima. Majina “Hanuni,” “Nahashi,” na “Waamoni” yameumbwa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
