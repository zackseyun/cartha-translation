base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/015.yaml
  text: When the Ammonites saw that Aram had fled[a], they also fled before Abishai his brother and entered the city[b]. Then Joab came to Jerusalem.
translation:
  language: sw
  text: Waamoni walipoona kwamba Waaramu walikuwa wamekimbia[a], wao pia wakamkimbia Abishai, ndugu yake Yoabu, wakaingia mjini. Kisha Yoabu akaja Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “Aramu”; hapa jina hilo linarejelea majeshi ya Kiaramu, yaani Waaramu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: Waamoni
  rationale: Nahau ya Kiebrania ‘wana wa Amoni’ inamaanisha watu wa Amoni; jina la kawaida la taifa hilo katika Kiswahili ni ‘Waamoni’.
- source_word: רָאוּ כִּי נָס אֲרָם
  choice: walipoona kwamba Waaramu walikuwa wamekimbia
  rationale: ‘Walipoona kwamba’ huonyesha kwa kawaida maudhui ya kile walichokiona, na wakati timilifu unaonyesha kuwa kukimbia kwa Waaramu kulitangulia mwitikio wa Waamoni.
- source_word: אֲרָם
  choice: Waaramu
  rationale: Ingawa Kiebrania kina jina la umoja ‘Aramu,’ hapa linarejelea kwa pamoja majeshi ya Kiaramu; ‘Waaramu’ huweka wazi maana hiyo katika Kiswahili bila kutumia jina la jadi ‘Washami’.
- source_word: וַיָּנוּסוּ גַם הֵם מִפְּנֵי
  choice: wao pia wakamkimbia
  rationale: Usemi huu katika muktadha wa vita unaonyesha kukimbia mbele ya adui; ‘wakamkimbia’ ni wa kawaida na unaendeleza mtiririko wa simulizi.
- source_word: אַבְשַׁי אָחִיו
  choice: Abishai, ndugu yake Yoabu
  rationale: Kiwakilishi ‘yake’ kwa kawaida kinamrejelea Yoabu katika muktadha. Kutaja Yoabu huondoa utata wa kisarufi usio wa lazima katika Kiswahili bila kubadili mrejelewa wa kifungu.
- source_word: וַיָּבֹאוּ הָעִירָה
  choice: wakaingia mjini
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha kuingia ndani ya mji; ‘wakaingia mjini’ ni tafsiri ya kawaida na sahihi.
- source_word: וַיָּבֹא יוֹאָב יְרוּשָׁלִָם
  choice: Kisha Yoabu akaenda Yerusalemu
  rationale: Kitenzi kinaonyesha mwendo kuelekea Yerusalemu na mfululizo wa simulizi. ‘Akaenda’ ni asilia kwa mtazamo wa msimulizi; ‘akarudi’ lingeongeza wazo lisilotajwa wazi na kitenzi.
