lexical_decisions:
- source_word: בֶּרֶכְיָה
  choice: Berekia
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida na inayoeleweka katika Kiswahili cha Biblia.
- source_word: אֶלְקָנָה
  choice: Elikana
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili iliyozoeleka.
- source_word: שֹׁעֲרִים
  choice: walinzi wa malango
  rationale: Neno hili linamaanisha watu waliolinda au kusimamia malango/maingilio; usemi huu ni wa asili na unaweka wazi wajibu wao kuliko neno pana kama ‘walinzi’ peke yake.
- source_word: לָאָרוֹן
  choice: kwa ajili ya Sanduku
  rationale: Kihusishi ל kinaweza kuonyesha mgawo au uhusiano na Sanduku; ‘kwa ajili ya’ huwasilisha kwamba walipewa jukumu hilo kuhusiana nalo bila kulifanya dhahiri kuwa ni mahali tu.
- source_word: וְ
  choice: na
  rationale: Kiunganishi cha kawaida kinachounganisha majina hayo mawili.
