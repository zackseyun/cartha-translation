base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/021.yaml
  text: and Mattithiah[a], Eliphelehu, Mikneiah, Obed-edom, Jeiel, and Azaziah were to lead with lyres according to the Sheminith.
translation:
  language: sw
  text: Nao Matithia, Elifelehu, Mikneya, Obed-Edomu, Yeieli na Azazia walipaswa kuongoza kwa vinubi kulingana na Sheminithi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa vinubi katika sauti ya nane,” au “kwa vinubi katika oktava ya chini.” Maneno ya Kiebrania yanayotafsiriwa “kulingana na Sheminithi” ni istilahi ya muziki ambayo maana yake kamili haijulikani.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתִּתְיָהוּ
  choice: Matithia
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida na inayosomeka kwa Kiswahili.
- source_word: אֱלִיפְלֵהוּ
  choice: Elifelehu
  rationale: Jina limetoholewa huku umbo kamili la Kiebrania lenye kiishio -hu likihifadhiwa.
- source_word: מִקְנֵיָהוּ
  choice: Mikneya
  rationale: Jina limetoholewa kwa mfumo unaosomeka kwa Kiswahili na unaoakisi konsonanti za Kiebrania.
- source_word: עֹבֵד אֱדֹם
  choice: Obed-Edomu
  rationale: Jina ambatani limetoholewa na kuunganishwa kwa kistari; irabu ya mwisho husaidia matamshi ya Kiswahili.
- source_word: יעִיאֵל
  choice: Yeieli
  rationale: Jina limetoholewa moja kwa moja kwa sauti zinazofaa Kiswahili.
- source_word: עֲזַזְיָהוּ
  choice: Azazia
  rationale: Jina limetoholewa kwa umbo la Kiswahili linalohifadhi msingi wa jina la Kiebrania.
- source_word: בְּכִנֹּרוֹת
  choice: kwa vinubi
  rationale: כִּנּוֹר ni ala ya nyuzi inayokaribia kinubi; kihusishi ב kimetafsiriwa kwa maana ya ala iliyotumiwa.
- source_word: עַל הַשְּׁמִינִית
  choice: kulingana na Sheminithi
  rationale: Hili ni neno la kiufundi la muziki ambalo maana yake kamili haijulikani; kulitohowa kunahifadhi utata wa chanzo.
- source_word: לְנַצֵּחַ
  choice: walipaswa kuongoza
  rationale: Katika muktadha wa muziki, kitenzi hiki huonyesha kuongoza au kusimamia utendaji; tafsiri hii ni ya asili bila kubainisha kupita kiasi.
