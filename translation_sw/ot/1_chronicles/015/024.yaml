translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaoeleweka. Muundo wa tendo linaloendelea umehifadhiwa kwa ‘walikuwa wakipiga.’ Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja, badala ya kufuata uwekaji usiolingana katika safu ya ushauri ya Kiingereza.
