base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/024.yaml
  text: And Shebaniah[a], Jehoshaphat, Nethanel, Amasai, Zechariah, Benaiah, and Eliezer the priests were blowing the trumpets before the ark of God[c][b], and Obed-edom and Jehiah were gatekeepers for the ark.
translation:
  language: sw
  text: Shebania, Yehoshafati, Nethaneli, Amasai, Zekaria, Benaya na Eliezeri, makuhani, walikuwa wakipiga[a] tarumbeta[b] mbele ya sanduku la Mungu; Obed-Edomu na Yehia walikuwa walinda malango kwa ajili ya sanduku[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walikuwa wakizivumisha tarumbeta.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linalotumiwa hapa mara nyingi humaanisha tarumbeta zilizonyooka zilizotumiwa na makuhani katika ibada.
    reason: cultural_note
  - marker: c
    text: Au “walinzi wa malango kwa ajili ya sanduku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Kibainishi cha Kiebrania kinaonyesha kwamba wanaume waliotajwa ni makuhani; katika Kiswahili, neno hili limewekwa kama ufafanuzi baada ya orodha ya majina.
- source_word: מחצצרים
  choice: walikuwa wakipiga
  rationale: Kauli ya hali inayoendelea inaonyesha tendo lililokuwa likiendelea wakati wa maandamano; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: בַּחֲצֹצְרוֹת
  choice: tarumbeta
  rationale: Neno hili humaanisha tarumbeta, hasa tarumbeta zilizonyooka zilizotumiwa na makuhani katika ibada. Haijaongezwa sifa ya ‘fedha’ kwa kuwa haikutajwa wazi katika mstari huu.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Hii inadumisha maana ya mahali pa makuhani katika maandamano, yaani walikuwa mbele ya sanduku.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: sanduku la Mungu
  rationale: Huu ni usemi wa moja kwa moja na wa kawaida wa kibiblia katika Kiswahili kwa muundo wa Kiebrania ‘sanduku la Mungu.’
- source_word: שֹׁעֲרִים
  choice: walinzi wa milango
  rationale: Neno hilo huonyesha watu waliopewa jukumu la kulinda au kusimamia malango katika mazingira matakatifu; tafsiri hii inadumisha dhana ya jukumu rasmi.
- source_word: לָאָרוֹן
  choice: kwa ajili ya sanduku
  rationale: Kiambishi ל hapa kinaonyesha mgawo au wajibu wao kuhusiana na sanduku, bila kulazimisha maana ya mahali pekee.
- source_word: וְעֹבֵד אֱדֹם
  choice: Obed-Edomu
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili huku likibaki karibu na umbo la Kiebrania.
- source_word: וִיחִיָּה
  choice: Yehia
  rationale: Jina limetoholewa kutoka Kiebrania kwa umbo linalosomeka kwa urahisi katika Kiswahili.
