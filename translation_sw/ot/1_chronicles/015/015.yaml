  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׂא֣וּ בְנֵֽי הַ/לְוִיִּ֗ם אֵ֚ת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים כַּ/אֲשֶׁ֛ר צִוָּ֥ה מֹשֶׁ֖ה כִּ/דְבַ֣ר יְהוָ֑ה בִּ/כְתֵפָ֥/ם בַּ/מֹּט֖וֹת עֲלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/015.yaml
  text: And the sons of the Levites carried the ark of God on their shoulders with the poles upon them[a], just as Moses had commanded according to the word of Yahweh.
translation:
  language: sw
  text: Nao wana wa Walawi wakalibeba Sanduku la Mungu mabegani mwao, kwa miti yake ya kubebea iliyokuwa juu yao[a], kama Musa alivyoamuru kulingana na neno la Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa miti yake ya kubebea iliyotulia juu yao.” Usemi wa Kiebrania unaeleza kwamba miti hiyo ilikuwa juu ya mabega yao walipolibeba Sanduku.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: wakalibeba
  rationale: Katika simulizi hili, נשא humaanisha kubeba na kusafirisha Sanduku, si kuliinua kwa muda mfupi tu. Kiambishi -li- kinarejelea Sanduku.
- source_word: בְנֵי הַלְוִיִּם
  choice: wana wa Walawi
  rationale: Huhifadhi usemi wa kifamilia na kikabila wa Kiebrania, ambao unasema kihalisi ‘wana wa Walawi,’ badala ya kuufupisha kuwa ‘Walawi.’
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: Sanduku la Mungu
  rationale: Aya inasema ‘Sanduku la Mungu’ bila kuongeza ‘la Agano.’ Herufi kubwa katika ‘Sanduku’ husaidia kuonyesha chombo hiki mahususi.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: kama Musa alivyoamuru
  rationale: Hutoa maana ya ulinganifu au kufuata sawasawa amri iliyotolewa na Musa, kwa Kiswahili cha kawaida na fasaha.
- source_word: כִּדְבַר יְהוָה
  choice: kulingana na neno la Yahwe
  rationale: Huhifadhi neno דָּבָר kama ‘neno’ na kuonyesha kwamba amri ya Musa ilipatana na maagizo ya Mungu.
- source_word: בִּכְתֵפָם
  choice: mabegani mwao
  rationale: Ni usemi wa asili wa Kiswahili unaoeleza mahali ambapo mzigo ulitegemezwa wakati wa kubebwa.
- source_word: בַּמֹּטוֹת עֲלֵיהֶם
  choice: kwa miti yake ya kubebea iliyokuwa juu yao
  rationale: ‘Miti ya kubebea’ hueleza kwa kawaida fimbo ndefu zilizotumiwa kulibeba Sanduku. Usemi ‘iliyokuwa juu yao’ huhifadhi uhusiano wa Kiebrania bila kuamua zaidi ya maandishi kama miti hiyo iliegemea mabegani.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano YHWH moja kwa moja. ‘Yahwe’ hulitaja kama jina badala ya kulibadilisha kuwa cheo, na ni tahajia inayosomeka kiasili katika Kiswahili.
- issue: Usemi wa kikabila wenye jinsia katika בְנֵי הַלְוִיִּם
  choice: wana wa Walawi
  alternative: Walawi
  rationale: Kiebrania kinatumia wazi usemi wa kiume na wa kifamilia ‘wana wa Walawi.’ Tafsiri hailainishi usemi huo kuwa jina la kundi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa sasa. ‘Nao ... waka-’ huendeleza mfululizo wa matukio. ‘Miti ya kubebea’ ni wazi zaidi kuliko ‘fimbo’ katika muktadha huu, huku tanbihi ikihifadhi uwezekano wa maana ya ‘kutulia juu yao.’
