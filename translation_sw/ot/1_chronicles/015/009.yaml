  text: 'For the sons of Hebron: Eliel the chief[a], and eighty of his brothers.'
translation:
  language: sw
  text: 'Kwa wana wa Hebroni: Elieli, mkuu, pamoja na ndugu zake themanini.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa zake” badala ya “ndugu zake”; Kiebrania kinasema kihalisi “ndugu zake,” na hapa huenda kinawarejelea wanaume wa kundi la ukoo lililowakilishwa na Elieli.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Kwa wana wa
  rationale: Kiambishi ל־ kinaanzisha kundi la ukoo katika orodha; “Kwa wana wa” huhifadhi namna ya Kiebrania ya kueleza ukoo huku ikiwa ya kawaida katika Kiswahili.
- source_word: חֶבְרוֹן
  choice: Hebroni
  rationale: Jina la mtu au ukoo limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: אֱלִיאֵל
  choice: Elieli
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida katika Kiswahili.
- source_word: הַשָּׂר
  choice: mkuu
  rationale: שַׂר humaanisha kiongozi, mkuu, au mwenye cheo; “mkuu” inafaa kwa mwakilishi wa ukoo bila kudokeza ufalme au nafasi mahususi ya kijeshi.
- source_word: וְאֶחָיו
  choice: pamoja na ndugu zake
  rationale: Kiebrania kihalisi ni “na ndugu zake.” Katika orodha hii huenda ni wanaume wa ukoo au jamaa zake; “ndugu zake” huhifadhi usemi na utata wa chanzo.
- source_word: שְׁמוֹנִים
  choice: themanini
  rationale: Ni namba kamili inayotaja idadi ya waliokuwa pamoja na Elieli.
