lexical_decisions:
- source_word: לִ/בְנֵי מְרָרִי
  choice: Kwa wana wa Merari
  rationale: Kiambishi ל־ kinatambulisha kundi linalofuata katika orodha. “Kwa wana wa Merari” huhifadhi muundo huo na usemi wa ukoo bila kuufafanua kupita kiasi kuwa “wazao.”
- source_word: עֲשָׂיָה
  choice: Asaya
  rationale: Jina limetoholewa kwa tahajia ya kawaida na inayosomeka kwa Kiswahili.
- source_word: הַ/שָּׂר
  choice: mkuu
  rationale: שַׂר hapa humaanisha kiongozi au mkuu wa kundi; “mkuu” huonyesha hadhi hiyo bila kudokeza ufalme kama ambavyo “mwana-mfalme” lingeweza kufanya.
- source_word: וְ/אֶחָי/ו
  choice: pamoja na ndugu zake
  rationale: אֶחָיו kwa msingi ni “ndugu zake,” lakini katika orodha hii ya Walawi inaweza pia kuwahusu jamaa wa kiume wa ukoo. “Pamoja na” huunganisha idadi hiyo kwa Kiswahili cha kawaida.
- source_word: מָאתַיִם וְ/עֶשְׂרִים
  choice: '220'
  rationale: Nambari ya Kiebrania ni mia mbili na ishirini; tarakimu zimetumiwa kwa usomaji rahisi wa kisasa.
