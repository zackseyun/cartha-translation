translation:
  language: sw
  text: Daudi akawakusanya wana wa Aroni na Walawi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: akawakusanya
  rationale: Kitenzi אסף katika masimulizi humaanisha kuwaleta watu pamoja. Kiambishi cha wakati uliopita pamoja na kiambishi cha yambwa cha ngeli ya watu kinatoa Kiswahili cha kawaida na kinachoeleweka.
- source_word: דָּוִיד
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili na matumizi mapana ya Kiswahili.
- source_word: בְּנֵי אַהֲרֹן
  choice: wana wa Aroni
  rationale: Tafsiri hii huhifadhi usemi wa moja kwa moja wa Kiebrania, ‘wana wa Aroni,’ bila kuufafanua kimya kimya kuwa ‘wazao’ au ‘makuhani.’
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kundi la ukoo wa Lawi katika muktadha wa huduma ya ibada.
- source_word: אֵת ... וְאֵת
  choice: '[halikutafsiriwa kando; yambwa mbili zimeunganishwa kwa ‘na’]'
  rationale: 'אֵת ni kiashiria cha yambwa mahsusi kisicho na neno linalolingana nacho moja kwa moja katika Kiswahili. Kurudiwa kwake kunawakilishwa kwa uratibu wa kawaida: ‘wana wa Aroni na Walawi.’'
theological_decisions:
- issue: Utambulisho wa ‘wana wa Aroni’
  choice: Usemi wa kindugu ‘wana wa Aroni’ umehifadhiwa.
  alternative: ‘Wazao wa Aroni’ au ‘makuhani’
  rationale: Katika muktadha usemi huo unaweza kutaja uzao wa kikuhani, lakini maandishi yenyewe yanasema ‘wana’; tafsiri haipaswi kufuta upana huo wa maana kwa kuingiza ufafanuzi wa kimuktadha ndani ya mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kisimulizi; ‘akawakusanya’ ni wa asili zaidi kuliko ‘akawakusanya pamoja,’ ambalo lingerudia maana iliyomo tayari katika kitenzi.
