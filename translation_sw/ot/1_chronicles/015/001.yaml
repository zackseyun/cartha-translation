id: 1CH.15.1
reference: 1 Chronicles 15:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּֽעַשׂ ל֥/וֹ בָתִּ֖ים בְּ/עִ֣יר דָּוִ֑יד וַ/יָּ֤כֶן מָקוֹם֙ לַֽ/אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יֶּט ל֖/וֹ אֹֽהֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/001.yaml
  text: And he made houses for himself in the city of David[a], and he prepared a place for the ark of God and pitched a tent for it.
translation:
  language: sw
  text: Akajijengea nyumba katika Jiji la Daudi, akatayarisha mahali kwa ajili ya sanduku la Mungu, na kulisimamishia hema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akajisimamishia hema.” Kiambishi cha Kiebrania kinaweza kurejelea ama sanduku ama Daudi, ingawa muktadha wa karibu unapendelea sanduku.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ בָתִּים
  choice: Akajijengea nyumba
  rationale: Ingawa עשה kwa msingi ni ‘fanya/tengeneza,’ ikiwa na בָּתִּים usemi wa kawaida wa Kiswahili ni ‘jenga nyumba.’ Kiambishi לוֹ kinaonyeshwa kwa ‘-ji-...-ea,’ yaani kwa ajili yake mwenyewe. ‘Nyumba’ katika Kiswahili inaweza kutumika kwa umoja wa kimuundo bila kupoteza maana ya majengo ya makazi, lakini hapa inaeleweka kwa wingi kutokana na muktadha.
- source_word: בְּעִיר דָּוִיד
  choice: katika Jiji la Daudi
  rationale: Ni kirai cha mahali na jina maalumu linalojulikana; ‘Jiji la Daudi’ ni tafsiri ya kawaida na ya wazi.
- source_word: וַיָּכֶן מָקוֹם
  choice: akatayarisha mahali
  rationale: Hifili ya כון hapa ina maana ya kutayarisha au kuweka tayari, na מָקוֹם ni ‘mahali.’
- source_word: לַאֲרוֹן הָאֱלֹהִים
  choice: kwa ajili ya sanduku la Mungu
  rationale: ‘Sanduku la Mungu’ ni tafsiri ya moja kwa moja ya אֲרוֹן הָאֱלֹהִים na katika muktadha huu humaanisha sanduku takatifu la agano bila kulazimika kuongeza neno lisilopo katika mstari.
- source_word: וַיֶּט לוֹ אֹהֶל
  choice: na kulisimamishia hema
  rationale: נטה pamoja na אֹהֶל hueleza kusimamisha hema. ‘Kuli-...-ia’ hurejelea sanduku na kuonyesha kuwa hema lilisimamishwa kwa ajili yake; ‘hema’ linabaki lisilo na kibainishi kama ilivyo katika Kiebrania.
theological_decisions:
- issue: Kirejelewa cha kiambishi katika וַיֶּט לוֹ אֹהֶל
  choice: 'Kiambishi kinarejelea sanduku: ‘kulisimamishia hema.’'
  alternative: 'Kiambishi kinaweza kurejelea Daudi: ‘akajisimamishia hema.’'
  rationale: Muktadha wa karibu unaeleza matayarisho kwa ajili ya sanduku la Mungu, hivyo kurejelea sanduku kunafanya mtiririko uwe wa kawaida. Hata hivyo, sarufi ya Kiebrania inaweza kuruhusu kirejelewa kuwa Daudi, kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi ya kibiblia lakini kinachoeleweka kwa msomaji wa kawaida. ‘Kulisimamishia hema’ ni usemi wa asili unaohifadhi uhusiano wa kisarufi na sanduku; tanbihi inalinda utata halisi wa Kiebrania.
