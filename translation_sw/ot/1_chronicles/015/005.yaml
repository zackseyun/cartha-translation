  yaml_path: translation/ot/1_chronicles/015/005.yaml
  text: 'For the sons of Kohath: Uriel the chief[a], and 120 of his brothers.'
translation:
  language: sw
  text: 'Kwa wana wa Kohathi: Urieli, mkuu, na ndugu zake 120.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa zake”; hapa “ndugu” huenda inamaanisha wanaume wengine wa ukoo wa Kohathi, si lazima ndugu zake wa tumbo moja tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי קְהָת
  choice: Kwa wana wa Kohathi
  rationale: Kiambishi לְ kinaitambulisha sehemu hii ya ukoo katika orodha, na בְּנֵי hapa ina maana ya wana au wazao wa ukoo. “Kwa wana wa Kohathi” huhifadhi muundo wa Kiebrania na husikika kwa kawaida katika orodha hii.
- source_word: אוּרִיאֵל
  choice: Urieli
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: הַשָּׂר
  choice: mkuu
  rationale: שַׂר humaanisha kiongozi, mkuu, au afisa. Katika orodha hii ya vikundi vya Walawi, “mkuu” huonyesha kichwa cha kundi bila kudokeza ufalme.
- source_word: וְאֶחָיו
  choice: na ndugu zake
  rationale: Neno אָח kwa msingi humaanisha ndugu, lakini katika muktadha huu linaweza kuwahusu jamaa wa kiume au watu wengine wa ukoo mmoja. Tafsiri kuu huhifadhi neno pana la kawaida “ndugu,” huku tanbihi ikifafanua uwezekano wa maana ya kiukoo.
- source_word: מֵאָה וְעֶשְׂרִים
  choice: '120'
  rationale: Idadi imetolewa kwa tarakimu kwa uwazi na urahisi wa kusoma katika orodha ya watu.
