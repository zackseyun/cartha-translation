source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֔ם אַתֶּ֛ם רָאשֵׁ֥י הָ/אָב֖וֹת לַ/לְוִיִּ֑ם הִֽתְקַדְּשׁוּ֙ אַתֶּ֣ם וַ/אֲחֵי/כֶ֔ם וְ/הַֽעֲלִיתֶ֗ם אֵ֣ת אֲר֤וֹן יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֶל הֲכִינ֖וֹתִי לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/012.yaml
  text: And he said to them[a], “You are the heads of the fathers’ houses of the Levites. Sanctify yourselves, you and your brothers, and bring up the ark of Yahweh, the God of Israel, to the place I have prepared for it.”
translation:
  language: sw
  text: Akawaambia, “Ninyi ndio wakuu wa koo za Walawi. Jitakaseni[a], ninyi pamoja na ndugu zenu, kisha lipandisheni sanduku la Yahwe, Mungu wa Israeli, mpaka mahali nilipopaweka tayari kwa ajili yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jiwekeni wakfu.” Kitenzi cha Kiebrania kinarejelea kujitayarisha kwa utakaso wa kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת לַלְוִיִּם
  choice: wakuu wa koo za Walawi
  rationale: Kirai hiki kinawataja viongozi wa vikundi vya kifamilia vya Walawi vinavyofuatiliwa kwa ukoo wa baba. “Wakuu wa koo” ni Kiswahili cha kawaida kinachohifadhi muundo wa kijamii unaokusudiwa bila kutumia tafsiri ngumu isiyo ya kawaida.
- source_word: הִתְקַדְּשׁוּ
  choice: Jitakaseni
  rationale: Kitenzi cha Kiebrania katika hitpael kina maana ya kujiandaa kwa utakaso wa kiibada. “Jitakaseni” ni wazi na chenye hadhi; tanbihi inahifadhi uwezekano wa “jiwekeni wakfu.”
- source_word: וַאֲחֵיכֶם
  choice: ninyi pamoja na ndugu zenu
  rationale: “Ndugu zenu” huhifadhi maana ya msingi ya neno la Kiebrania huku muktadha ukionyesha kuwa wanaorejelewa ni Walawi wenzao wa ukoo.
- source_word: וְהַעֲלִיתֶם
  choice: kisha lipandisheni
  rationale: Hifili ya עלה ina maana ya kusababisha kitu kipande au kukipandisha. Hapa inarejelea kulipeleka sanduku juu kuelekea mahali palipotayarishwa; kiunganishi “kisha” kinaeleza kwa kawaida uhusiano wa maagizo yanayofuatana.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: sanduku la Yahwe, Mungu wa Israeli
  rationale: “Sanduku” ni istilahi ya kawaida ya sanduku takatifu katika Kiswahili cha Biblia. Kirai cha ufafanuzi “Mungu wa Israeli” kimehifadhiwa kikamilifu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa moja kwa moja; “Yahwe” ndiyo tahajia ya Kiswahili inayolingana na matamshi ya kawaida ya Kiswahili.
- source_word: אֶל הֲכִינוֹתִי לוֹ
  choice: mpaka mahali nilipolitayarisha kwa ajili yake
  rationale: Kihusishi אֶל kinaelekeza kwenye mahali panapokusudiwa, ingawa nomino “mahali” haijaandikwa wazi katika Kiebrania. Muktadha wa eneo lililotayarishwa kwa sanduku unahalalisha kuifanya maana hiyo dhahiri katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia Tetragramatoni yenyewe. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kwa cheo, huku tahajia ikifuata matumizi ya kawaida ya Kiswahili.
- issue: Maana ya הִתְקַדְּשׁוּ katika muktadha wa ibada
  choice: Jitakaseni
  alternative: Jiwekeni wakfu
  rationale: Agizo linaweza kujumuisha utakaso na kujiweka wakfu kwa huduma takatifu. Tafsiri kuu inaacha upeo huo wazi, na tanbihi inaonyesha tafsiri mbadala bila kulazimisha tofauti ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Koo” limetumiwa badala ya tafsiri halisi lakini isiyo ya kawaida ya “nyumba za baba”; “lipandisheni” huhifadhi mwelekeo wa kitenzi cha Kiebrania. Alama ya tanbihi imewekwa mara tu baada ya neno linalohusika.
