base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/013.yaml
  text: Because you were not there the first time[a], Yahweh our God broke out against us[b], because we did not seek him according to the ordinance.
translation:
  language: sw
  text: Kwa sababu ninyi hamkuwapo mara ya kwanza[a], Yahwe Mungu wetu alitufanyia ufa, kwa kuwa hatukumtafuta kulingana na utaratibu uliowekwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa sababu hapo mwanzo hamkuwa ninyi, Yahwe Mungu wetu alitufanyia ufa.” Mwanzo wa sentensi ya Kiebrania umebanwa, na huenda ukadokeza kwamba Walawi hawakuhusika katika jaribio la kwanza la kulipandisha sanduku.
    reason: alternative_reading
  - marker: b
    text: Au, “kwa kuwa hatukumwuliza kulingana na kanuni iliyowekwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַ בָּרִאשׁוֹנָה לֹא אַתֶּם
  choice: ninyi hamkuwapo mara ya kwanza
  rationale: Kifungu cha Kiebrania kimebanwa kisarufi. Katika muktadha, Daudi anawaambia Walawi kwamba hawakuhusika katika jaribio la kwanza la kulipandisha sanduku. Tafsiri hii inaweka wazi maana inayodokezwa bila kuongeza kwamba walipaswa kulibeba.
- source_word: פָּרַץ ... בָּנוּ
  choice: alitufyatukia
  rationale: Kitenzi פרץ hapa kinaonyesha tendo la ghafla na kali la hukumu ya Mungu dhidi ya watu. ‘Alitufyatukia’ ni Kiswahili cha sasa kinachohifadhi wazo la kufyatuka dhidi yao na mwangwi wa jina Peres-uza.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna inayotambulika katika Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Hii inatafsiri muundo wenye kiambishi cha nafsi ya kwanza wingi kwa njia ya moja kwa moja na ya kawaida.
- source_word: דְרַשְׁנֻהוּ
  choice: hatukumtafuta
  rationale: דרשׁ inaweza kumaanisha kutafuta, kuuliza, au kutaka mwongozo. ‘Kumtafuta’ huhifadhi upana wake wa kitheolojia katika muktadha wa kumkaribia Mungu kwa njia inayofaa.
- source_word: כַּמִּשְׁפָּט
  choice: kulingana na utaratibu uliowekwa
  rationale: מִשְׁפָּט hapa ni kanuni au utaratibu ulioamriwa kuhusu kulisafirisha sanduku. Usemi huu ni wa kawaida na unaonyesha kwamba utaratibu huo ulikuwa wa lazima, si desturi tu.
theological_decisions:
- issue: Kijalizo kinachodokezwa katika mwanzo wa aya
  choice: Kufasiri kwamba Walawi hawakuwapo au hawakuhusika mara ya kwanza
  alternative: Kwa sababu hapo kwanza si ninyi; au, Kwa sababu mara ya kwanza Yahwe Mungu wetu alitufanyia ufa
  rationale: Kiebrania kina usemi uliobanwa na wenye uwezekano wa zaidi ya uchanganuzi mmoja. Muktadha wa aya 2 na 12–15 unaunga mkono kutokuhusika kwa Walawi, lakini tanbihi inahifadhi ubadala wa kisarufi.
- issue: Asili ya tendo la Mungu katika פָּרַץ
  choice: Hukumu ya ghafla ya Yahwe dhidi ya watu
  alternative: Yahwe alifanya ufa kati yetu
  rationale: Tafsiri inahifadhi ukali wa utakatifu na hukumu ya Mungu pamoja na uhusiano wa simulizi na Peres-uza, bila kupunguza tendo hilo kuwa tukio lisilo na mhusika.
- issue: Maana ya kumtafuta Mungu ‘kulingana na utaratibu’
  choice: Kutenda kwa kufuata agizo lililowekwa kuhusu sanduku
  alternative: Kumwuliza Mungu kulingana na kanuni
  rationale: Kitenzi kinaweza kuhusisha kuuliza au kutafuta, lakini muktadha unasisitiza pia kutii utaratibu uliowekwa. Tafsiri kuu inahifadhi maana pana, huku tanbihi ikionyesha ubadala.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Alitufyatukia’ huhifadhi picha ya tendo la ghafla la פרץ; ‘utaratibu uliowekwa’ huepuka lugha nzito mno ya kisheria. Alama zote za tanbihi zimo katika matini kuu.
