language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֥י דָוִ֛יד וְ/זִקְנֵ֥י יִשְׂרָאֵ֖ל וְ/שָׂרֵ֣י הָ/אֲלָפִ֑ים הַ/הֹֽלְכִ֗ים לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מִן בֵּ֥ית עֹבֵֽד אֱדֹ֖ם בְּ/שִׂמְחָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/025.yaml
  text: So David, and the elders of Israel, and the commanders of the thousands went to bring up the ark of the covenant of Yahweh from the house of Obed-edom with joy.
translation:
  language: sw
  text: Basi Daudi, wazee wa Israeli, na majemadari wa maelfu wakaenda kulipandisha sanduku la agano la Yahweh kutoka nyumbani kwa Obed-Edomu kwa furaha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי ... הַהֹלְכִים
  choice: Basi ... wakaenda
  rationale: Muundo huu unaanzisha hatua inayofuata katika simulizi, huku kitenzi kishirikishi הַהֹלְכִים kikieleza kwenda kwa kundi lililotajwa. Kiswahili cha simulizi ‘Basi ... wakaenda’ kinadumisha kazi hiyo kwa mtiririko wa kawaida.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: wazee wa Israeli
  rationale: Ni usemi wa kawaida na sahihi kwa kundi la viongozi waliotambuliwa katika Israeli.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: majemadari wa maelfu
  rationale: שָׂרֵי humaanisha wakuu au makamanda, na הָאֲלָפִים inaelekea kurejelea vikosi au migawanyo ya maelfu. Tafsiri hii inadumisha muundo na maana ya kijeshi au kiutawala ya Kiebrania.
- source_word: לְהַעֲלוֹת
  choice: kulipandisha
  rationale: Kitenzi עלה katika muktadha huu humaanisha kulipeleka sanduku juu kwenda mahali palipokusudiwa. Kiambishi ‘li-’ kinarejelea sanduku kwa Kiswahili cha kawaida.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahweh
  rationale: 'Tafsiri hii inadumisha mfuatano wa uhusiano katika Kiebrania: sanduku linalohusiana na agano la Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa tetragramatoni linawakilishwa kama jina binafsi ‘Yahweh,’ si kubadilishwa kuwa cheo.
- source_word: מִן בֵּית עֹבֵד אֱדֹם
  choice: kutoka nyumbani kwa Obed-Edomu
  rationale: ‘Nyumbani kwa’ ni Kiswahili cha sasa na cha asili kinachoonyesha nyumba au makao ya Obed-Edomu.
- source_word: בְּשִׂמְחָה
  choice: kwa furaha
  rationale: Kirai hiki kinaeleza hali ya shangwe iliyoandamana na tendo lao; ‘kwa furaha’ ni kifupi, cha kawaida, na sahihi.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko lina jina la agano la Mungu moja kwa moja. ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Uhusiano katika אֲרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahweh
  alternative: sanduku la agano la Yahweh / sanduku la agano la BWANA
  rationale: Muundo wa Kiebrania unaunganisha sanduku na agano la Yahweh. Tafsiri iliyochaguliwa inahifadhi uhusiano huo bila kuamua zaidi ya maandishi yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Muundo wa simulizi umetolewa kwa ufasaha bila kupoteza majina, vikundi vya uongozi, au shangwe ya tukio.
