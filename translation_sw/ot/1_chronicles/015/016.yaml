revisions:
- from: Kisha Daudi akawaambia viongozi wa Walawi wawaweke ndugu zao[a], yaani waimbaji, pamoja na vyombo vya muziki—vinanda, vinubi na matoazi—watoe sauti kubwa, ili kuinua sauti kwa furaha.[b]
  to: Kisha Daudi akawaambia viongozi wa Walawi wawateue ndugu zao[a], waimbaji, watumie vyombo vya muziki—vinanda, vinubi na matoazi—na watoe sauti kwa nguvu, wakipaza sauti kwa furaha.[b]
  rationale: Marekebisho yanaondoa utata wa “kuwaweka pamoja na vyombo” kwa kutumia “wawateue” na “watumie vyombo,” bila kubadili maana ya msingi. “Wakipaza sauti kwa furaha” ni usemi wa kawaida wa Kiswahili unaowasilisha kwa karibu לְהָרִים בְּקוֹל לְשִׂמְחָה; tanbihi huhifadhi mbadala wa karibu zaidi na muundo wa Kiebrania.
