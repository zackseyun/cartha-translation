  verdict: revise
  source_fidelity: 'Msingi wa tafsiri unafuata Kiebrania vizuri: Daudi anawaagiza wakuu wa Walawi, na “ndugu zao” hurejelea Walawi wenzao. Hata hivyo, “wawaweke ... pamoja na vyombo” inaweza kusikika kana kwamba waimbaji wanawekwa pamoja kimwili na vyombo, badala ya kuteuliwa kwa huduma ya muziki. Kishazi cha mwisho kinahitaji uundaji wa Kiswahili ulio wazi zaidi huku kikihifadhi taswira ya Kiebrania ya kupaza/kuinua sauti kwa furaha.'
  naturalness: “Wawateue ... waimbaji” ni ya asili na sahihi kwa muktadha wa upangaji wa watumishi. “Watumie vyombo ... na watoe sauti kwa nguvu, wakipaza sauti kwa furaha” husoma kwa kawaida katika Kiswahili Sanifu na huunganisha waimbaji, vyombo, na sauti bila utata usio wa lazima.
  terminology: “Walawi,” “waimbaji,” “vinanda, vinubi na matoazi” vinafaa. “Ndugu zao” limehifadhiwa kwa uaminifu, na tanbihi yake inafafanua marejeo yake ya kimuktadha. Tanbihi ya pili imerekebishwa ili mbadala wake ulingane na usemi wa Kiebrania na uambatane na kishazi husika.
