base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/016.yaml
  text: Then David told the leaders of the Levites to appoint their brothers, the singers, with musical instruments—harps, lyres, and cymbals—sounding aloud, to raise songs of joy.
translation:
  language: sw
  text: Kisha Daudi akawaambia viongozi wa Walawi wawateue ndugu zao[a], waimbaji, watumie vyombo vya muziki—vinanda, vinubi na matoazi—na watoe sauti kwa nguvu, wakipaza sauti kwa furaha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu zao” hapa ni Walawi wenzao.
    reason: cultural_note
  - marker: b
    text: Au “ili kuinua sauti kwa furaha.” Kiebrania, kwa maana halisi, husema “kuinua kwa sauti kwa ajili ya furaha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִיד
  choice: Kisha Daudi akawaambia
  rationale: Kiunganishi cha masimulizi kinaendeleza mfululizo wa matukio; “Kisha” ni cha kawaida katika Kiswahili, na “akawaambia” linafaa kwa agizo linalofuata.
- source_word: לְשָׂרֵי הַלְוִיִּם
  choice: viongozi wa Walawi
  rationale: שָׂרִים humaanisha wakuu au viongozi; “viongozi” ni neno la sasa na linaloeleweka kwa urahisi.
- source_word: לְהַעֲמִיד
  choice: wawaweke
  rationale: Hifili ya עמד inaweza kumaanisha kusimamisha, kuweka mahali, au kuteua. “Wawaweke” huhifadhi wazo pana la kuwaweka katika jukumu bila kulazimisha maana ya uteuzi rasmi pekee.
- source_word: אֶת אֲחֵיהֶם
  choice: ndugu zao
  rationale: Tafsiri hii inadumisha istilahi halisi ya undugu; katika muktadha inawahusu Walawi wenzao, jambo linalofafanuliwa katika tanbihi.
- source_word: הַמְשֹׁרְרִים
  choice: waimbaji
  rationale: Neno linalotokana na שׁיר linawataja hasa waimbaji, si wanamuziki kwa ujumla.
- source_word: בִּכְלֵי שִׁיר
  choice: pamoja na vyombo vya muziki
  rationale: Hii ni tafsiri ya kawaida na ya asili ya vyombo vilivyotumiwa kufanya muziki.
- source_word: נְבָלִים וְכִנֹּרוֹת וּמְצִלְתָּיִם
  choice: vinanda, vinubi na matoazi
  rationale: Majina haya ya kawaida katika Kiswahili yanatofautisha aina mbili za vyombo vya nyuzi na vyombo vya kugongana, ingawa utambulisho kamili wa vyombo vya kale vya nyuzi haujulikani kwa hakika.
- source_word: מַשְׁמִיעִים
  choice: watoe sauti kubwa
  rationale: Hifili ya שׁמע ina maana ya kusababisha kitu kisikike; usemi huu unaonyesha sauti ya wazi na yenye nguvu bila kudai kwamba tendo hilo lilikuwa kuimba au kupiga vyombo pekee.
- source_word: לְהָרִים בְּקוֹל לְשִׂמְחָה
  choice: ili kuinua sauti kwa furaha
  rationale: Tafsiri hii inafuata kwa karibu usemi wa Kiebrania na kuhifadhi uwezekano kwamba “sauti” ni sauti ya waimbaji au sauti pana ya muziki.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umefanywa kuwa wa asili kwa Kiswahili huku mpangilio wa agizo na utata wa kishazi cha mwisho vikihifadhiwa.
