  - severity: low
    issue: Tanbihi b inasema “kuongeza sauti ya shangwe.”
    rationale: “Kuongeza” huweka mkazo wa kuongeza kiwango cha sauti, ambao hauko wazi katika Kiebrania. Mbadala wa “kuinua sauti kwa furaha” uko karibu zaidi na usemi wa chanzo.
