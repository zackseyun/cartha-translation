base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/018.yaml
  text: 'And with them were their brothers of the second rank: Zechariah[a], Ben-Jaaziel, and Shemiramoth, and Jehiel, and Unni, Eliab, and Benaiah, and Maaseiah, and Mattithiah, and Eliphelehu, and Mikneiah, and Obed-edom, and Jeiel, the gatekeepers.'
translation:
  language: sw
  text: 'Na pamoja nao walikuwapo ndugu zao wa daraja la pili: Zekaria[a], Ben na Yaazieli, Shemiramothi, Yehieli, Uni, Eliabu, Benaya, Maaseya, Matithia, Elifelehu, Mikneya, Obed-Edomu na Yeieli, walinzi wa malango.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu zao, kundi la pili” au “ndugu zao wa mpangilio wa pili.” Usemi wa Kiebrania huenda unatofautisha cheo au kundi la pili miongoni mwa Walawi au wanamuziki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Nao pamoja nao walikuwa
  rationale: Kirai hiki kinatambulisha kundi lililoandamana na waliotajwa awali; kitenzi ‘walikuwa’ kimeongezwa ili sentensi ya Kiswahili iwe ya kawaida.
- source_word: אֲחֵיהֶם
  choice: ndugu zao
  rationale: Huhifadhi maana ya msingi ya neno la Kiebrania, ambalo katika muktadha huu linaweza kumaanisha ndugu au Walawi wenzao.
- source_word: הַמִּשְׁנִים
  choice: wa daraja la pili
  rationale: Neno linatokana na dhana ya kuwa wa pili na hapa linaonekana kutofautisha cheo au kundi la pili; tafsiri hii huhifadhi uwezekano huo bila kuufanya kuwa mahususi kupita kiasi.
- source_word: זְכַרְיָהוּ
  choice: Zekaria
  rationale: Umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: בֵּן וְיַעֲזִיאֵל
  choice: Ben-Yazieli
  rationale: Masora na mapokeo ya kifungu hiki yana utata wa ugawaji, lakini ushahidi uliotolewa unalichukulia kama jina lililounganishwa badala ya ‘Ben’ kuwa mtu tofauti au nomino ‘mwana wa’; kistari huonyesha muungano huo.
- source_word: הַשֹּׁעֲרִים
  choice: walinzi wa malango
  rationale: Katika muktadha wa huduma ya Walawi, neno humaanisha maafisa waliolinda au kusimamia malango, si malango yenyewe.
theological_decisions:
- issue: Hadhi ya kundi linaloitwa הַמִּשְׁנִים
  choice: wa daraja la pili
  alternative: kundi la pili / wa zamu ya pili
  rationale: Andiko halielezi kwa hakika kama tofauti ni ya cheo, mpangilio, au kundi la utendaji; tafsiri ya msingi pamoja na tanbihi huhifadhi utata huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yameandikwa kwa maumbo yanayosomeka kwa Kiswahili; viunganishi vimepunguzwa kwa uorodheshaji wa kawaida bila kuondoa mtu yeyote.
