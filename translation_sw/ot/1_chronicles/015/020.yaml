  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Muundo 'wakipiga vinanda' ni wa kawaida kwa wasomaji, na istilahi ya muziki isiyo na maana hakika imehifadhiwa badala ya kufasiriwa kupita ushahidi.
