base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/020.yaml
  text: and Zechariah[a], Aziel, Shemiramoth, Jehiel, Unni, Eliab, Maaseiah, and Benaiah, with harps according to Alamoth.
translation:
  language: sw
  text: na Zekaria, Azieli, Shemiramothi, Yehieli, Uni, Eliabu, Maaseya, na Benaya, wakipiga vinanda kwa Alamoth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakipiga vinanda kwa sauti za juu”; neno la Kiebrania “Alamoth” huenda ni maelekezo ya muziki yanayohusiana na wasichana au rejista ya sauti za juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְבָלִים
  choice: wakipiga vinanda
  rationale: Neno נְבָלִים linataja ala za nyuzi, ambazo kwa Kiswahili cha Biblia zinaweza kuitwa vinanda. Kiambishi ב kinaonyesha ala iliyotumiwa; muundo wa kitenzi 'wakipiga' ni wa kawaida na wazi katika orodha hii ya wanamuziki.
- source_word: עַל
  choice: kwa mtindo wa
  rationale: Katika muktadha wa muziki, עַל huenda inaonyesha namna, mpangilio, au rejista ya uchezaji, si mahali halisi. 'Kwa mtindo wa' huhifadhi maana hiyo bila kudai uhakika usiokuwapo.
- source_word: עֲלָמוֹת
  choice: Alamoth
  rationale: Hili linaonekana kuwa neno la kitaalamu la muziki ambalo maana yake kamili haijulikani; huenda linahusiana na sauti za juu au za wasichana. Kulihamisha kama 'Alamoth' kunahifadhi utata wa Kiebrania, huku maelezo yakitolewa katika tanbihi.
- source_word: וּזְכַרְיָה וַעֲזִיאֵל וּשְׁמִירָמוֹת וִיחִיאֵל וְעֻנִּי וֶאֱלִיאָב וּמַעֲשֵׂיָהוּ וּבְנָיָהוּ
  choice: na Zekaria, Azieli, Shemiramothi, Yehieli, Uni, Eliabu, Maaseya, na Benaya
  rationale: Majina yameandikwa kwa namna inayokaribia matamshi ya Kiebrania lakini inayoweza kusomeka kwa urahisi katika Kiswahili. Kiunganishi cha mwanzo kimehifadhiwa kwa kuwa mstari huu unaendeleza orodha ya mstari uliotangulia.
