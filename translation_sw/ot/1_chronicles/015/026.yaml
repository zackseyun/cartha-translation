base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/026.yaml
  text: And when God helped the Levites who were carrying the ark of the covenant of Yahweh[a], they sacrificed seven bulls and seven rams.
translation:
  language: sw
  text: Ikawa, Mungu alipowasaidia Walawi waliokuwa wakilibeba sanduku la agano la Yahweh[a], wakachinja mafahali saba na kondoo dume saba kuwa dhabihu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sanduku la agano la BWANA.”
    reason: Hutoa desturi nyingine iliyoenea ya kuwakilisha jina la Kiebrania יהוה kwa cheo “BWANA” badala ya kulitamka “Yahweh.”
lexical_decisions:
- source_word: בֶּעְזֹר
  choice: alipowasaidia
  rationale: 'Muundo wa ב pamoja na kitenzi-jina baada ya ויהי unaonyesha wakati: “alipowasaidia.” Hii ni Kiswahili cha kawaida na inadumisha maana ya עזר.'
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Ingawa neno la Kiebrania lina kibainishi, hapa linamtaja Mungu wa Israeli; “Mungu” ndiyo tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi la Walawi; umbo la nomino lenyewe linatosha bila kibainishi tofauti.
- source_word: נֹשְׂאֵי
  choice: waliokuwa wakilibeba
  rationale: Kauli hii inaonyesha tendo lililokuwa likiendelea na inalitaja sanduku kwa upatanisho wa ngeli unaofaa.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahweh
  rationale: Tafsiri hii inadumisha mnyororo wa umilikaji wa Kiebrania bila kuongeza ufafanuzi usio katika matini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limewasilishwa kama “Yahweh” badala ya kubadilishwa kuwa cheo; tanbihi inatoa desturi nyingine ya kulitafsiri.
- source_word: וַיִּזְבְּחוּ
  choice: wakatoa dhabihu
  rationale: Katika muktadha wa ibada, זבח ni kutoa mnyama kuwa dhabihu. Usemi huu ni wa kawaida, wenye heshima, na hauongezi maelezo yasiyotajwa.
- source_word: שִׁבְעָה פָרִים
  choice: mafahali saba
  rationale: פָרִים hapa ni ng’ombe wa kiume wanaotolewa dhabihu; “mafahali” ni sahihi na wazi kuliko “ng’ombe” pekee.
- source_word: וְשִׁבְעָה אֵילִים
  choice: na kondoo dume saba
  rationale: אֵילִים humaanisha kondoo wa kiume waliokomaa; “kondoo dume” ni Kiswahili cha kawaida na hudumisha kurudiwa kwa idadi.
theological_decisions:
- issue: Mtendaji wa tendo la kutoa dhabihu
  choice: wakatoa dhabihu
  alternative: akatoa dhabihu
  rationale: Kitenzi וַיִּזְבְּחוּ kiko katika nafsi ya tatu wingi. Tafsiri inadumisha wingi huo bila kubainisha zaidi kama walikuwa Walawi peke yao au washiriki wengine wa msafara.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. “Ikawa” inadumisha mtindo wa usimulizi wa Kiebrania, huku “alipowasaidia” na “waliokuwa wakilibeba” zikitoa mtiririko wa kawaida wa Kiswahili.
