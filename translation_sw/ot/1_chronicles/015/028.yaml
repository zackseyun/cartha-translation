  text: וְ/כָל יִשְׂרָאֵ֗ל מַעֲלִים֙ אֶת אֲר֣וֹן בְּרִית יְהוָ֔ה בִּ/תְרוּעָה֙ וּ/בְ/ק֣וֹל שׁוֹפָ֔ר וּ/בַ/חֲצֹצְר֖וֹת וּ/בִ/מְצִלְתָּ֑יִם מַשְׁמִעִ֕ים בִּ/נְבָלִ֖ים וְ/כִנֹּרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/028.yaml
  text: And all Israel was bringing up the ark of the covenant of Yahweh with shouting[a], with the sound of a horn, with trumpets, and with cymbals[b], making music with harps and lyres.
translation:
  language: sw
  text: Nao Israeli wote walikuwa wakilipandisha sanduku la agano la Yahweh kwa shangwe[a], kwa sauti ya pembe[b], kwa tarumbeta na matoazi, huku wakipiga vinubi na zeze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa kilio kikubwa”; neno la Kiebrania linaweza kumaanisha kilio cha sherehe au cha kumsifu mtu.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: shofar, yaani pembe iliyopulizwa; ni tofauti na tarumbeta zinazotajwa baadaye.'
    reason: lexical_clarification
lexical_decisions:
- source_word: מַעֲלִים
  choice: walikuwa wakilipandisha
  rationale: Kauli shirikishi ya Hiphil inaonyesha tendo lililokuwa likiendelea; kiambishi cha ngeli “li-” kinarejelea sanduku.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahweh
  rationale: Inahifadhi mnyororo wa nomino na utambulisho maalumu wa sanduku.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Inatunza jina la Mungu lililoandikwa katika matini ya Kiebrania badala ya kulibadili kuwa cheo.
- source_word: תְרוּעָה
  choice: shangwe
  rationale: Katika maandamano haya ya sherehe, neno linaashiria kilio kikubwa cha furaha au sifa; “shangwe” ni usemi wa kawaida na wenye hadhi kwa muktadha huu.
- source_word: קוֹל שׁוֹפָר
  choice: sauti ya pembe
  rationale: Inatafsiri קוֹל waziwazi kuwa “sauti” na kutofautisha shofar na tarumbeta zinazotajwa baadaye.
- source_word: חֲצֹצְרוֹת
  choice: tarumbeta
  rationale: Ni jina la kawaida la ala hizi za kupuliza na linazitofautisha na pembe.
- source_word: מְצִלְתַּיִם
  choice: matoazi
  rationale: Ni istilahi ya Kiswahili inayotumika kwa ala za kugonganishwa aina ya cymbals.
- source_word: מַשְׁמִעִים
  choice: huku wakipiga
  rationale: Hiphil ina wazo la kufanya sauti isikike; katika Kiswahili, “wakipiga” ala za nyuzi ni usemi wa asili unaoonyesha muziki uliosikika.
- source_word: נְבָלִים
  choice: vinubi
  rationale: Hutumia jina la kawaida la ala ya nyuzi na kudumisha tofauti na כִנֹּרוֹת.
- source_word: כִנֹּרוֹת
  choice: zeze
  rationale: Hutumia istilahi tofauti kwa ala ya pili ya nyuzi, ingawa ulinganisho na ala za kisasa si kamili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina la Mungu lenye herufi nne; “Yahweh” hulihifadhi kama jina binafsi bila kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa tendo linaloendelea umehifadhiwa; majina ya ala yametolewa kwa istilahi zinazoeleweka huku tofauti za Kiebrania zikidumishwa.
