  text: The singers were Heman[a], Asaph, and Ethan, with bronze cymbals to sound aloud.
translation:
  language: sw
  text: Nao waimbaji—Hemani, Asafu na Ethani—walikuwa na matoazi ya shaba ili yasikike.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili kuyafanya yasikike.” Kitenzi cha Kiebrania kihalisi humaanisha “kusababisha [kitu] kisikike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְשֹׁרְרִים
  choice: Nao waimbaji
  rationale: Nomino-tendaji yenye kibainishi inawataja hasa waimbaji; kiunganishi וְ kimetafsiriwa kwa “Nao” ili kuunganisha mstari huu na orodha inayotangulia kwa Kiswahili cha kawaida.
- source_word: הֵימָן אָסָף וְאֵיתָן
  choice: Hemani, Asafu na Ethani
  rationale: Majina ya watu yamenukuliwa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia, huku kiunganishi cha jina la mwisho kikihifadhiwa kwa “na.”
- source_word: בִּמְצִלְתַּיִם
  choice: walikuwa na matoazi
  rationale: מְצִלְתַּיִם ni matoazi, ala za muziki zinazogonganishwa. Kwa kuwa kishazi cha Kiebrania hakina kitenzi kikuu, “walikuwa na” hukifanya kiwe sentensi ya asili bila kudai wazi zaidi ya maandishi kwamba walikuwa wakiyapiga wakati huo.
- source_word: נְחֹשֶׁת
  choice: ya shaba
  rationale: “Shaba” ndilo neno la kawaida la Kiswahili katika muktadha wa ala za kale za נחשת; huepuka “brass,” ambayo ingekuwa isiyo sahihi kihistoria, ingawa neno la Kiebrania linaweza kurejelea shaba au aloi yake.
- source_word: לְהַשְׁמִיעַ
  choice: ili yatoe sauti kubwa
  rationale: Hii ni infinitivi ya Hifili ya שׁמע, kihalisi “kusababisha kisikike.” Katika muktadha wa matoazi, “ili yatoe sauti kubwa” ni Kiswahili cha kawaida kinachoonyesha sauti inayosikika wazi bila kuongeza kiwakilishi kisichokuwamo katika Kiebrania.
