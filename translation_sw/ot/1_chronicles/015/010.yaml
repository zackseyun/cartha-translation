  text: 'For the sons of Uzziel: Amminadab the chief[a], and his brothers, one hundred and twelve.'
translation:
  language: sw
  text: 'Kwa wana wa Uzieli: Aminadabu, mkuu[a], na ndugu zake, watu mia moja na kumi na wawili.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kiongozi” au “mtawala.”
    reason: Neno la Kiebrania שַׂר linaweza kumaanisha mkuu, kiongozi, afisa mwenye mamlaka, au mtawala kulingana na muktadha.
lexical_decisions:
- source_word: לִ/בְנֵי
  choice: Kwa wana wa
  rationale: Kiambishi לְ־ kinatambulisha kundi linalofuata katika orodha; “kwa wana wa” ni Kiswahili cha kawaida kinachohifadhi lugha ya ukoo ya בנים.
- source_word: עֻזִּיאֵל
  choice: Uzieli
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: עַמִּינָדָב
  choice: Aminadabu
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: הַ/שָּׂר
  choice: mkuu
  rationale: שַׂר humaanisha mkuu, kiongozi, afisa, au mtawala. Katika orodha hii ya viongozi wa koo, “mkuu” ni fupi, ya kawaida, na inafaa muktadha.
- source_word: וְ/אֶחָי/ו
  choice: na ndugu zake
  rationale: אָח inaweza kumaanisha ndugu wa damu au wanaume wengine wa ukoo/kundi. “Ndugu zake” huhifadhi lugha ya kifamilia na upana unaowezekana wa neno hilo.
- source_word: מֵאָה וּ/שְׁנֵים עָשָׂר
  choice: watu mia moja na kumi na wawili
  rationale: Idadi imetafsiriwa moja kwa moja; “watu” imeongezwa kwa uwazi wa Kiswahili, na “wawili” inapatanishwa na watu wanaohesabiwa.
