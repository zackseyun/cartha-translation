base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/017.yaml
  text: So the Levites appointed Heman son of Joel[a], and from his brothers Asaph son of Berechiah, and from the sons of Merari, their brothers[b], Ethan son of Kushaiah.
translation:
  language: sw
  text: Basi Walawi wakawateua[a] Hemani mwana wa Yoeli, na kutoka miongoni mwa ndugu zake Asafu mwana wa Berekia, na kutoka miongoni mwa wana wa Merari[b], ndugu zao, Ethani mwana wa Kushiaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakawaweka katika nafasi zao”; kitenzi cha Kiebrania kinaweza kumaanisha kuwafanya watu wasimame katika jukumu walilopewa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “wana wa Merari,” yaani watu wa ukoo wa Merari.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲמִידוּ
  choice: wakawateua
  rationale: Hifili ya עמד humaanisha kuwafanya watu wasimame au kuwaweka katika jukumu walilopewa. Katika muktadha wa kupanga wanamuziki Walawi, “wakawateua” huwasilisha uteuzi rasmi kwa Kiswahili cha kawaida.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa watu wa kabila la Lawi; umaalumu wa nomino unaeleweka bila kibainishi tofauti.
- source_word: הֵימָן בֶּן יוֹאֵל
  choice: Hemani mwana wa Yoeli
  rationale: Majina yametoholewa kwa mazoea ya Kiswahili, na uhusiano wa nasaba unaoonyeshwa na בֶּן umehifadhiwa wazi.
- source_word: וּמִן אֶחָיו
  choice: na kutoka miongoni mwa ndugu zake
  rationale: מִן huonyesha kuchaguliwa kwa mtu kutoka katika kundi; “kutoka miongoni mwa” huifanya maana hiyo iwe wazi na ya kawaida katika Kiswahili.
- source_word: אָסָף בֶּן בֶּרֶכְיָהוּ
  choice: Asafu mwana wa Berekia
  rationale: Majina yametoholewa kwa maumbo yaliyozoeleka katika Kiswahili, huku uhusiano wa nasaba ukihifadhiwa.
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: na kutoka miongoni mwa wana wa Merari
  rationale: Usemi halisi wa Kiebrania, “wana wa Merari,” umehifadhiwa ili kuonyesha ukoo, huku “miongoni mwa” ikionyesha uteuzi kutoka katika kundi hilo.
- source_word: אֲחֵיהֶם
  choice: ndugu zao
  rationale: Neno la kifamilia limehifadhiwa bila kulibadili kuwa “jamaa”; katika muktadha linawahusu Walawi wenzao wa ukoo unaohusiana.
- source_word: אֵיתָן בֶּן קוּשָׁיָהוּ
  choice: Ethani mwana wa Kushaya
  rationale: Majina yametoholewa kwa Kiswahili na uhusiano wa mwana kwa baba umehifadhiwa.
