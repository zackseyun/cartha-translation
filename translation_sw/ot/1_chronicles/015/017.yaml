  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa orodha wa Kiebrania umehifadhiwa, huku “kutoka miongoni mwa” ikitumiwa kufafanua kwamba kila mtu alichaguliwa kutoka katika kundi lake.
