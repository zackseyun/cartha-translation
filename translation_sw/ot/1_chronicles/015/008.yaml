  yaml_path: translation/ot/1_chronicles/015/008.yaml
  text: 'For the sons of Elizaphan: Shemaiah the chief[a], and two hundred of his brothers.'
translation:
  language: sw
  text: 'Kwa wana wa Elisafani: Shemaya, mkuu, na ndugu zake mia mbili.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa ukoo wake”; neno la Kiebrania linaweza kumaanisha ndugu wa kuzaliwa au watu wengine wa ukoo mmoja katika orodha za koo au za kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי
  choice: Kwa wana wa
  rationale: Kiambishi לְּ kinaanzisha kundi la ukoo katika orodha, hivyo “kwa” ni ya asili hapa; בְּנֵי imetafsiriwa kihalisi “wana wa,” huku ikidokeza ukoo wa kiume.
- source_word: אֱלִיצָפָן
  choice: Elisafani
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: שְׁמַעְיָה
  choice: Shemaya
  rationale: Jina limetoholewa kwa namna iliyo wazi na ya kawaida katika Kiswahili.
- source_word: הַ/שָּׂר
  choice: mkuu
  rationale: שַׂר humaanisha mkuu, kiongozi, au afisa; “mkuu” linafaa kwa kiongozi wa kundi la ukoo bila kudokeza cheo cha kifalme au kijeshi.
- source_word: וְ/אֶחָי/ו
  choice: na ndugu zake
  rationale: אָח inaweza kumaanisha ndugu wa kuzaliwa au watu wa ukoo mmoja. “Ndugu zake” huhifadhi upana huo wa maana kwa Kiswahili cha kawaida.
- source_word: מָאתַיִם
  choice: mia mbili
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya idadi hiyo.
