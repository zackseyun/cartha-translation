id: 1CH.15.14
reference: 1 Chronicles 15:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּֽתְקַדְּשׁ֔וּ הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְ/הַעֲל֕וֹת אֶת אֲר֥וֹן יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/014.yaml
  text: So the priests and the Levites consecrated themselves to bring up the ark of Yahweh[a], the God of Israel.
translation:
  language: sw
  text: Basi makuhani na Walawi wakajiweka wakfu[a] ili kulipandisha Sanduku la Yahweh, Mungu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakajitakasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַדְּשׁוּ
  choice: wakajiweka wakfu
  rationale: Kitenzi cha Kiebrania katika Hitpael kinaonyesha kwamba walijiandaa wenyewe kwa huduma takatifu. ‘Wakajiweka wakfu’ ni Kiswahili cha sasa na cha heshima kinachohifadhi maana ya maandalizi ya kiibada.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa wahudumu wa kikuhani katika muktadha wa ibada ya Israeli.
- source_word: וְהַלְוִיִּם
  choice: na Walawi
  rationale: ‘Walawi’ ni tafsiri iliyozoeleka ya watu wa kabila la Lawi wanaotajwa hapa kama kundi maalumu.
- source_word: לְהַעֲלוֹת
  choice: ili kulipandisha
  rationale: Hiphil ya עלה ina maana ya kusababisha kitu kipande au kukipeleka juu. ‘Kulipandisha’ huhifadhi mwelekeo wa kwenda juu bila kubainisha isivyohitajika namna ya kulibeba.
- source_word: אֶת אֲרוֹן
  choice: Sanduku
  rationale: Katika muktadha huu ארון ni Sanduku takatifu la agano; ‘Sanduku’ ni istilahi inayotambulika kwa urahisi, na herufi kubwa inaonyesha chombo hiki maalumu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Muundo wa Kiebrania umetafsiriwa moja kwa moja kama maelezo yanayomtambulisha Yahweh kuwa Mungu wa Israeli.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi יהוה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku ‘Yehova’ likiwa umbo jingine la kimapokeo.
- issue: Maana ya kujitayarisha kwa utakatifu
  choice: wakajiweka wakfu
  alternative: wakajitakasa
  rationale: ‘Wakajiweka wakfu’ huonyesha maandalizi yao wenyewe kwa huduma takatifu bila kuamua kwamba tendo hilo lilihusu hasa kuondoa unajisi; ‘wakajitakasa’ bado ni tafsiri halali ya maana ya utakatifu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inafuata mtiririko wa simulizi, na ‘Basi’ inawakilisha kiunganishi cha Kiebrania bila kukitia uzito wa kimantiki usio lazima.
