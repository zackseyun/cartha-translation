  text: And Chenaniah[a], chief of the Levites, directed the carrying[b], because he was skillful at it.
translation:
  language: sw
  text: Kenania[a], mkuu wa Walawi, alisimamia ubebaji[b], kwa sababu alikuwa stadi katika kazi hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kenania, mkuu wa Walawi, aliongoza uimbaji ... kwa sababu alikuwa stadi katika uimbaji.” Neno la Kiebrania מַשָּׂא kwa kawaida humaanisha “mzigo” au “ubebaji,” lakini hapa wengine hulielewa kwa maana ya kimuziki kwa sababu mistari inayozunguka inawataja waimbaji na wanamuziki.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania kinarudia nomino ileile: “katika ubebaji ... katika ubebaji.” Tafsiri imetoa sehemu ya pili kwa Kiswahili cha kawaida kuwa “katika kazi hiyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְנַנְיָהוּ
  choice: Kenania
  rationale: Jina limetoholewa kwa kufuata umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: שַׂר
  choice: mkuu
  rationale: Katika muktadha huu wa utumishi wa Walawi, neno hili humaanisha kiongozi au msimamizi mwenye cheo.
- source_word: הַלְוִיִּם
  choice: wa Walawi
  rationale: Ni tafsiri ya kawaida ya jina la kundi hilo, huku kiambishi cha umilikaji kikiliunganisha na 'mkuu' kwa Kiswahili cha asili.
- source_word: בְּמַשָּׂא
  choice: ubebaji
  rationale: מַשָּׂא kwa kawaida humaanisha mzigo au tendo la kubeba; katika simulizi la kuhamishwa kwa sanduku, 'ubebaji' ndio maana ya moja kwa moja zaidi.
- source_word: יָסֹר
  choice: alisimamia
  rationale: Kitenzi kinaonyesha kutoa mwongozo au kusimamia kazi; 'alisimamia' ni cha asili na hakibainishi kupita kiasi namna halisi ya uongozi huo.
- source_word: בַּמַּשָּׂא
  choice: katika kazi hiyo
  rationale: Kirai hiki kinarudia nomino ileile ya Kiebrania. Kiswahili kinakitoa kwa namna ya kawaida huku rejeleo lake kwa ubebaji likibaki wazi.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya jukumu lake.
- source_word: מֵבִין הוּא
  choice: alikuwa stadi
  rationale: Katika muktadha huu, umbo la בין linaonyesha umahiri wa kutenda, si ufahamu wa kiakili tu.
theological_decisions:
- issue: Iwapo מַשָּׂא inamaanisha ubebaji au uimbaji
  choice: ubebaji katika matini kuu
  alternative: uimbaji
  rationale: Maana ya kawaida ya nomino hiyo ni mzigo au ubebaji, na muktadha mpana unahusu kulihamisha sanduku. Hata hivyo, mazingira ya karibu yanawataja waimbaji na wanamuziki, hivyo tafsiri ya kimuziki imehifadhiwa katika tanbihi bila kuondoa utata wa kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Ubebaji' linaweka wazi kuwa ni tendo lililosimamiwa, na 'katika kazi hiyo' huepuka marudio mazito bila kuficha kwamba Kiebrania hurudia neno lilelile.
