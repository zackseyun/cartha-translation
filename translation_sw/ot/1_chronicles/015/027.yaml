  text: וְ/דָוִ֞יד מְכֻרְבָּ֣ל בִּ/מְעִ֣יל בּ֗וּץ וְ/כָל הַ/לְוִיִּם֙ הַ/נֹּשְׂאִ֣ים אֶת הָ/אָר֔וֹן וְ/הַ/מְשֹׁ֣רְרִ֔ים וּ/כְנַנְיָ֛ה הַ/שַּׂ֥ר הַ/מַּשָּׂ֖א הַ/מְשֹֽׁרְרִ֑ים וְ/עַל דָּוִ֖יד אֵפ֥וֹד בָּֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/027.yaml
  text: David was clothed with a robe of fine linen[a], as were all the Levites who were carrying the ark, and the singers, and Chenaniah, the leader of the singing of the singers; and on David was a linen ephod.
translation:
  language: sw
  text: Daudi alikuwa amevaa joho la kitani bora, kama walivyokuwa wamevaa Walawi wote waliolibeba Sanduku, waimbaji, na Kenania, mkuu wa jukumu la waimbaji[a]; naye Daudi alikuwa amevaa efodi ya kitani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “mkuu wa uimbaji,” “mkuu wa muziki,” au “mkuu wa ubebaji.” Kirai cha Kiebrania ni kigumu.
    reason: alternative_reading
lexical_decisions:
- source_word: מְכֻרְבָּל
  choice: alikuwa amevaa
  rationale: Huwasilisha hali ya kuwa amevikwa au amevalia vazi kwa Kiswahili cha kawaida na cha heshima.
- source_word: מְעִיל בּוּץ
  choice: joho la kitani safi
  rationale: Joho linaonyesha vazi la nje, na kitani safi huhifadhi ubora unaodokezwa na בּוּץ.
- source_word: הַלְוִיִּם הַנֹּשְׂאִים אֶת הָאָרוֹן
  choice: Walawi wote waliolibeba Sanduku
  rationale: Hutaja kundi na tendo lao katika msafara kwa lugha ya asili; herufi kubwa katika Sanduku hulitambulisha kama Sanduku la agano katika muktadha.
- source_word: הַמְשֹׁרְרִים
  choice: waimbaji
  rationale: Mzizi wa Kiebrania unahusu kuimba hasa, si wanamuziki kwa ujumla.
- source_word: כְנַנְיָה
  choice: Kenania
  rationale: Unukuzi wa kawaida wa jina hili katika Kiswahili, unaofuata konsonanti za Kiebrania.
- source_word: הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים
  choice: kiongozi wa shughuli ya waimbaji
  rationale: Ni tafsiri yenye tahadhari ya kirai kigumu, inayobakiza wazo la jukumu au shughuli bila kukifafanua bila msingi kuwa uimbaji pekee au ubebaji pekee.
- source_word: אֵפוֹד בָּד
  choice: efodi ya kitani
  rationale: Efodi huhifadhi jina la vazi maalumu la ibada bila kulifasiri kuwa uthibitisho wa cheo cha ukuhani.
- source_word: וְעַל דָּוִיד
  choice: pia Daudi alikuwa amevaa
  rationale: Kiswahili asilia kinawasilisha kwamba efodi ilikuwa vazi la ziada juu ya Daudi, bila muundo mgumu wa neno kwa neno.
theological_decisions:
- issue: Mavazi ya Daudi katika mazingira ya ibada
  choice: Kuhifadhi neno “efodi” kama jina la vazi maalumu bila kudai kwamba Daudi alikuwa akifanya kazi ya kuhani.
  alternative: “vazi la kikuhani,” au maelezo kwamba Daudi alikuwa kuhani
  rationale: Mstari unasema alichovaa Daudi, lakini hautamki wazi cheo wala tendo la kikuhani.
- issue: Kirai kigumu הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים
  choice: “kiongozi wa shughuli ya waimbaji,” pamoja na tanbihi ya mibadala
  alternative: “kiongozi wa uimbaji,” “kiongozi wa muziki,” au “kiongozi wa ubebaji”
  rationale: Muundo wa Kimasora una utata wa kisintaksia. Tafsiri kuu ya tahadhari na tanbihi huhifadhi utata huo badala ya kuutatua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umerahisishwa kwa usomaji wa kawaida huku tofauti kati ya joho na efodi ikihifadhiwa; tanbihi inaonyesha kwa uwazi utata halisi wa kirai kinachomhusu Kenania.
