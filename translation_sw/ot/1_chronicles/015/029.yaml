  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֗י אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה בָּ֖א עַד עִ֣יר דָּוִ֑יד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִיד֙ מְרַקֵּ֣ד וּ/מְשַׂחֵ֔ק וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/029.yaml
  text: And as the ark of the covenant of Yahweh came to the city of David[a], Michal the daughter of Saul looked out through the window and saw King David dancing and playing, and she despised him in her heart.
translation:
  language: sw
  text: Ikawa kwamba sanduku la agano la Yahweh lilipofika katika Mji wa Daudi, Mikali binti Sauli alitazama kupitia dirishani, akamwona Mfalme Daudi akicheza na kufanya shangwe[a], akamdharau moyoni mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akicheza kwa furaha” au “akijiburudisha.”
    reason: Neno la Kiebrania וּמְשַׂחֵק linaweza kumaanisha tendo la shangwe, kujiburudisha, au kucheza; “kufanya shangwe” linafaa kwa muktadha wa maandamano bila kufunga maana yote ya neno.
lexical_decisions:
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahweh
  rationale: Muundo huu wa Kiswahili unawakilisha mnyororo wa viambatishi wa Kiebrania kwa uwazi na kwa lugha ya kawaida ya Biblia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetoholewa badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: בָּא עַד עִיר דָּוִיד
  choice: lilipofika katika Mji wa Daudi
  rationale: Kitenzi בוא pamoja na עַד kinaonyesha kufika kwenye mwisho wa safari; 'lilipofika katika' ni Kiswahili cha asili bila kusisitiza kupita kiasi tendo la kuingia.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Mikali binti Sauli
  rationale: Huhifadhi utambulisho wa Mikali kwa ukoo wake wa Sauli na ni muundo wa kawaida, wenye hadhi katika Kiswahili.
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: alichungulia dirishani
  rationale: Kitenzi kinaeleza kutazama kutoka au kupitia dirishani; 'alichungulia dirishani' ni cha asili na hakilazimishi mwelekeo wa chini ambao haujawekwa wazi kabisa.
- source_word: וַתֵּרֶא אֶת הַמֶּלֶךְ דָּוִיד
  choice: akamwona Mfalme Daudi
  rationale: Hutoa kwa kawaida mfuatano wa simulizi wa Kiebrania na kuhifadhi cheo pamoja na jina.
- source_word: מְרַקֵּד
  choice: akicheza
  rationale: Katika muktadha wa maandamano ya shangwe, neno hili linaonyesha kucheza kwa mwili kama dansi; 'akicheza' ni la kawaida na linaeleweka.
- source_word: וּמְשַׂחֵק
  choice: na kufurahi
  rationale: שורש שׂחק inaweza kuonyesha kucheza, kufanya shangwe, au kufurahi; hapa 'kufurahi' hutofautisha tendo hili na מְרַקֵּד na kufaa muktadha wa sherehe.
- source_word: וַתִּבֶז לוֹ
  choice: akamdharau
  rationale: בזה huonyesha dharau kali; 'akamdharau' ni fupi, wazi, na sahihi.
- source_word: בְּלִבָּהּ
  choice: moyoni mwake
  rationale: Huhifadhi taswira ya moyo na kuonyesha kwamba dharau hiyo ilikuwa ya ndani.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Matini inatumia Tetragramatoni kama jina binafsi; 'Yahweh' hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya tendo la Daudi katika וּמְשַׂחֵק
  choice: kufurahi
  alternative: kucheza / kufanya shangwe
  rationale: Neno lina upana wa maana unaohusisha mchezo na shangwe. Katika maandamano haya, 'kufurahi' huwasilisha hali ya sherehe bila kuingiza hukumu ya kitheolojia kuhusu mwenendo wa Daudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetiririshwa kwa viambishi vya mfululizo, huku utambulisho wa Mikali kama binti Sauli na dharau yake ya ndani vikihifadhiwa.
