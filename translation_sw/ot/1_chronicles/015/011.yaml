base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/011.yaml
  text: 'Then David called for Zadok and Abiathar the priests, and for the Levites: Uriel, Asaiah, Joel, Shemaiah, Eliel, and Amminadab.'
translation:
  language: sw
  text: 'Ndipo Daudi akawaita makuhani Sadoki na Abiathari, na Walawi: Urieli, Asaya, Yoeli, Shemaya, Elieli na Aminadabu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akawaita
  rationale: Kitenzi קרא katika muktadha huu kina maana ya kuwaita watu maalumu waje kwake; “akawaita” ni Kiswahili cha kawaida na huhifadhi maana hiyo bila kuongeza uzito usio lazima wa “akawaitisha.”
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Nomino hii inawatambulisha Sadoki na Abiathari kwa nafasi yao ya kikuhani. Katika Kiswahili, mpangilio “makuhani Sadoki na Abiathari” huonyesha utambulisho huo kwa kawaida bila kuhitaji kibainishi tofauti cha uamilifu.
- source_word: וְלַלְוִיִּם
  choice: pamoja na Walawi
  rationale: Herufi ל inarudia walengwa wa mwito. “Pamoja na Walawi” huendeleza orodha ya walioitwa kwa Kiswahili cha asili, huku ikitofautisha kundi la Walawi na makuhani waliotangulia.
- source_word: לְאוּרִיאֵל עֲשָׂיָה וְיוֹאֵל שְׁמַעְיָה וֶאֱלִיאֵל וְעַמִּינָדָב
  choice: Urieli, Asaya, Yoeli, Shemaya, Elieli na Aminadabu
  rationale: Majina yametoholewa kwa tahajia zinazofaa Kiswahili. Nukta mbili baada ya “Walawi” zinaonyesha kwamba majina sita yanawataja Walawi walioitwa.
- source_word: דָוִיד
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili na matumizi ya Kiswahili.
