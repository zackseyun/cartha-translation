  yaml_path: translation/ot/1_chronicles/015/003.yaml
  text: And David assembled all Israel at Jerusalem to bring up the ark of Yahweh to its place[b][a], which he had prepared for it.
translation:
  language: sw
  text: Daudi akawakusanya Israeli wote kwenda Yerusalemu ili kulipandisha sanduku la Yahweh hadi mahali pake,[a] mahali alipokuwa amekwishaandaa kwa ajili yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yerusalemu”; Kiebrania hutumia kihusishi chenye maana ya “kwenda,” ingawa Kiswahili kinaweza kutaja mahali pa mkusanyiko moja kwa moja.
    reason: lexical_alternative
  - marker: b
    text: Kiwakilishi cha Kiebrania kinaweza kutafsiriwa “kwa ajili yake”; katika muktadha huu kwa kawaida hurejelea sanduku, ingawa kisarufi kinaweza kurejelea Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: akawakusanya
  rationale: Hifili ya קהל inaonyesha kwamba Daudi alisababisha watu wakusanyike; “akawakusanya” ni Kiswahili cha kawaida na huonyesha tendo hilo wazi.
- source_word: כָּל יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Huhifadhi usemi wa pamoja unaorejelea taifa lote au wawakilishi wake bila kuongeza ufafanuzi usiomo katika Kiebrania.
- source_word: אֶל יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Baada ya kitenzi “kuwakusanya,” Kiswahili cha kawaida kinaweza kutaja mahali bila kihusishi; maana ya kuelekea na kukusanyika huko Yerusalemu hubaki wazi.
- source_word: לְהַעֲלוֹת
  choice: ili kulipandisha
  rationale: Kitenzi עלה hapa ni cha kusababisha kupanda na kinadokeza kulipeleka sanduku juu kuelekea Yerusalemu; “kulipandisha” huhifadhi wazo hilo kuliko “kulileta” pekee.
- source_word: אֲרוֹן יְהוָה
  choice: sanduku la Yahweh
  rationale: “Sanduku” ndilo neno la kawaida la kibiblia kwa ארון katika muktadha huu, na muundo wa umilikaji unafuata Kiebrania kwa kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa kwa tetragramatoni badala ya kulibadilisha kuwa cheo.
- source_word: אֶל מְקוֹמוֹ
  choice: hadi mahali pake
  rationale: Kiambishi cha nafsi katika מְקוֹמוֹ kwa kawaida zaidi hurejelea sanduku; “mahali pake” ni kifupi na hakiongezi wazo la “mahali panapostahili.”
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: ambapo alikuwa amepatayarisha kwa ajili yake
  rationale: Kiswahili huhitaji kuonyesha kwamba Daudi alikuwa tayari amepatayarisha mahali hapo kwa ajili ya sanduku. “Ambapo” linaunganisha kishazi na “mahali,” huku “yake” likihifadhi uwezekano wa kisarufi wa kiwakilishi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina יְהוָה moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi bila kuligeuza kuwa cheo.
- issue: Kirejelewa cha kiwakilishi לוֹ
  choice: kwa ajili yake, kikieleweka kwa kawaida kuwa sanduku
  alternative: kwa ajili yake, kikirejelea Yahweh
  rationale: Kiwakilishi cha Kiebrania ni cha kiume kisarufi na kinaweza kurejelea sanduku (ארון, nomino ya kiume) au Yahweh. Muktadha wa mahali pa sanduku unapendelea sanduku, lakini tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akalikusanya” limeepukwa kwa sababu Israeli hapa ni watu, hivyo “akawakusanya Israeli wote” ni ya asili zaidi. Alama zote za tanbihi zimewekwa katika matini kuu.
