lexical_decisions:
- source_word: לִ/בְנֵי
  choice: Kwa wana wa
  rationale: Kiambishi ל־ kinaanzisha kundi linalofuata katika orodha; “Kwa wana wa” kinadumisha kazi hiyo ya uorodheshaji na neno בני kama jina la kundi la ukoo.
- source_word: גֵּרְשׁוֹם
  choice: Gershom
  rationale: Maandishi ya Kiebrania hapa yana umbo Gershom; jina limetoholewa moja kwa moja bila kulibadili kuwa Gershoni.
- source_word: יוֹאֵל
  choice: Yoeli
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la Kiebrania יוֹאֵל.
- source_word: הַ/שָּׂר
  choice: mkuu
  rationale: Katika orodha hii ya koo, שַׂר humtaja kiongozi au mkuu wa kundi, bila kudokeza cheo cha kifalme.
- source_word: וְ/אֶחָי/ו
  choice: pamoja na ndugu zake
  rationale: אחים kimsingi ni “ndugu,” lakini hapa linawahusu wanaume wa kundi lilelile la ukoo; “pamoja na” linaunganisha idadi hiyo na Yoeli kwa Kiswahili cha kawaida.
- source_word: מֵאָה וּ/שְׁלֹשִׁים
  choice: '130'
  rationale: Nambari ya Kiebrania ni mia moja na thelathini; tarakimu zinafaa katika muktadha wa orodha.
