base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/002.yaml
  text: Then David said[a], “No one is to carry the ark of God except the Levites[b], for Yahweh has chosen them to carry the ark of Yahweh and to minister to him forever.”
translation:
  language: sw
  text: Ndipo Daudi akasema, “Hakuna mtu anayepaswa kulibeba sanduku la Mungu isipokuwa Walawi[a], kwa maana Yahwe amewachagua kulibeba sanduku la Yahwe na kumhudumia[b] milele.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sanduku la Mungu halipaswi kubebwa na mtu yeyote isipokuwa Walawi.” Kiebrania kimeacha mtenda anayeeleweka bila kumtaja wazi.
    reason: lexical_alternative
  - marker: b
    text: “Kumhudumia” pia yaweza kutafsiriwa “kumtumikia.” Kitenzi cha Kiebrania mara nyingi humaanisha huduma takatifu au ya ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Ni kiashiria cha wakati na mfuatano wa simulizi; ‘Ndipo’ huunganisha kauli ya Daudi kwa kawaida na matukio yaliyotangulia.
- source_word: אָמַר דָּוִיד
  choice: Daudi akasema
  rationale: Hii ndiyo namna ya kawaida na isiyo na uzito wa ziada ya kuripoti kauli katika simulizi la Kiswahili.
- source_word: לֹא לָשֵׂאת אֶת אֲרוֹן הָאֱלֹהִים כִּי אִם הַלְוִיִּם
  choice: Hakuna mtu anayepaswa kulibeba sanduku la Mungu isipokuwa Walawi
  rationale: Kiebrania kimeacha mtenda anayeeleweka; Kiswahili kinahitaji kumtaja. ‘Hakuna mtu anayepaswa’ huhifadhi maana ya zuio bila kuongeza ukali usiotajwa.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: sanduku la Mungu
  rationale: ‘Sanduku’ ni neno la kawaida na linaloeleweka kwa אֲרוֹן katika muktadha huu; ‘la agano’ halijaongezwa kwa sababu neno ‘agano’ halipo katika mstari huu.
- source_word: הַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hili la Israeli.
- source_word: כִּי בָם בָּחַר יְהוָה
  choice: kwa maana Yahwe amewachagua wao
  rationale: כִּי inatoa sababu ya zuio, na umbo ‘amewachagua’ linaonyesha tendo la awali ambalo matokeo yake yanaendelea. ‘Wao’ inasisitiza Walawi kama ilivyo בָם.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa namna ya kawaida ya matamshi ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: לָשֵׂאת
  choice: kulibeba
  rationale: Katika muktadha huu נשא humaanisha kubeba sanduku kimwili; kiambishi ‘-li-’ hurejelea sanduku kwa uwazi.
- source_word: אֲרוֹן יְהוָה
  choice: sanduku la Yahwe
  rationale: Huhifadhi wazi uhusiano wa umilikaji na urudiaji wa maneno uliopo katika Kiebrania.
- source_word: וּלְשָׁרְתוֹ
  choice: na kumhudumia
  rationale: שרת katika muktadha wa Walawi mara nyingi huhusu huduma takatifu. ‘Kumhudumia’ huhifadhi maana hiyo, huku ‘kumtumikia’ pia ikiwa tafsiri inayowezekana.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Ni usemi wa Kiswahili ulio wa kawaida na wenye uzito unaofaa kwa uteuzi wa kudumu.
theological_decisions:
- issue: Kirejelewa cha kiambishi cha nafsi katika וּלְשָׁרְתוֹ
  choice: Walawi wamechaguliwa ‘kumhudumia,’ yaani kumhudumia Yahwe.
  alternative: Kuhudumu mbele ya sanduku au kulihudumia kwa kuhusianisha kiambishi na sanduku lililotajwa karibu.
  rationale: Yahwe ndiye mtangulizi wa karibu mwenye nafsi, na huduma ya Walawi kwa kawaida huelezwa kuwa huduma kwa Yahwe. Tafsiri hii inafuata sarufi na muktadha wa ibada bila kuifanya huduma kuwa utunzaji wa kitu tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku urudiaji wa ‘sanduku’ na jina ‘Yahwe’ ukihifadhi msisitizo wa Kiebrania. Alama zote za tanbihi zimewekwa mahali zinapohusika katika matini.
