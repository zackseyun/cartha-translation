  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֛ר יָשַׁ֥ב דָּוִ֖יד בְּ/בֵית֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜יד אֶל נָתָ֣ן הַ/נָּבִ֗יא הִנֵּ֨ה אָנֹכִ֤י יוֹשֵׁב֙ בְּ/בֵ֣ית הָֽ/אֲרָזִ֔ים וַ/אֲר֥וֹן בְּרִית יְהוָ֖ה תַּ֥חַת יְרִיעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/001.yaml
  text: It happened[a], when David was living in his house, that David said to Nathan the prophet, “Look, I am living in a house of cedar, but the ark of the covenant of Yahweh is under curtains.”
translation:
  language: sw
  text: Ikawa, Daudi alipokuwa akiishi katika nyumba yake, akamwambia nabii Nathani, “Tazama, mimi ninaishi katika nyumba ya mbao za mierezi, lakini sanduku la agano la Yahwe liko chini ya mapazia[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitambaa vya hema.” Neno la Kiebrania יְרִיעוֹת linamaanisha vitambaa au mapazia, hasa vile vya hema au maskani.
    reason: Hufafanua maana ya karibu zaidi ya יְרִיעוֹת bila kuilazimisha katika matini kuu.
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni kauli ya kawaida ya Kiebrania ya kuendeleza simulizi na kuanzisha tukio jipya; “Ikawa” huhifadhi dhima hiyo bila kuongeza neno la wakati lisilokuwapo katika chanzo.
- source_word: כַּאֲשֶׁר
  choice: alipokuwa
  rationale: Huanzisha hali ya wakati inayozunguka tendo kuu; muundo huu ni wa asili katika Kiswahili.
- source_word: יָשַׁב ... יוֹשֵׁב
  choice: alipokuwa akiishi ... ninaishi
  rationale: Katika muktadha wa makao, ישׁב humaanisha kuishi au kukaa. “Kuishi” linaeleza makazi ya kudumu na kuhifadhi urudiaji wa kitenzi katika simulizi na maneno ya Daudi.
- source_word: בְּבֵיתוֹ
  choice: nyumbani mwake
  rationale: Hutafsiri kwa kawaida maana ya “katika nyumba yake” bila kulifanya neno hilo kuwa “ikulu,” ingawa nyumba inayotajwa ni makao ya kifalme.
- source_word: נָתָן הַנָּבִיא
  choice: nabii Nathani
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili kwa jina linalotambulishwa kwa wadhifa wake.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Huvuta fikira za msikilizaji kwenye hali anayoieleza Daudi na hudumisha uzito wa usemi bila kuwa wa kizamani kupita kiasi.
- source_word: בְּבֵית הָאֲרָזִים
  choice: katika nyumba ya mbao za mierezi
  rationale: Huweka wazi kwamba nyumba imejengwa kwa mbao za mierezi, huku ikihifadhi neno “nyumba” na tofauti yake na makao ya sanduku.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: lakini sanduku la agano la Yahwe
  rationale: Ingawa ו ni kiunganishi cha kawaida, hapa muktadha unaonyesha tofauti kati ya nyumba ya Daudi na mahali lilipo sanduku; “lakini” huwasilisha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: תַּחַת יְרִיעוֹת
  choice: liko chini ya mapazia
  rationale: יריעות ni vitambaa vilivyotandazwa au kuning’inizwa, hasa vya hema au maskani. “Mapazia” ni tafsiri fupi na ya karibu; maana mahsusi ya hema imeonyeshwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Chanzo kinatumia jina la agano moja kwa moja. “Yahwe” ni unukuzi unaokubalika wa jina hilo na haulibadilishi kuwa cheo kama “BWANA.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa kawaida. Muundo unahifadhi urudiaji wa “kuishi” na “nyumba,” pamoja na tofauti kati ya makao ya Daudi na mahali lilipo sanduku.
