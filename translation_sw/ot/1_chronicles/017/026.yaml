base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/026.yaml
  text: And now[a], Yahweh, you are God, and you have spoken this good thing concerning your servant.
translation:
  language: sw
  text: Na sasa, Ee Yahweh, wewe ndiye Mungu, nawe umesema jambo hili jema kuhusu mtumishi wako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umesema ahadi hii njema kuhusu mtumishi wako.” Kiebrania kinasema kihalisi, “umesema jambo hili jema kuhusu mtumishi wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Huhifadhi kiunganishi pamoja na mpito wa wakati katika mwendelezo wa sala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa tetragramatoni limetoholewa moja kwa moja kama Yahweh.
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: wewe ndiye Mungu
  rationale: Muundo huu wa Kiswahili huonyesha msisitizo wa viwakilishi vya Kiebrania kwa lugha ya kawaida na yenye hadhi.
- source_word: וַתְּדַבֵּר
  choice: umesema
  rationale: Kauli hiyo inarejelea maneno ambayo Mungu tayari amesema na ambayo bado yana umuhimu katika sala hii; haijatafsiriwa kwa njia finyu zaidi kuwa 'umeahidi'.
- source_word: עַל
  choice: kuhusu
  rationale: Pamoja na kitenzi cha kusema, kihusishi hiki huonyesha mada inayozungumziwa.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika sala ya mfalme mbele za Mungu, neno hili ni jina la unyenyekevu; 'mtumishi' linafaa zaidi kuliko 'mtumwa' katika muktadha huu.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: jambo hili jema
  rationale: Huhifadhi maana ya moja kwa moja ya 'hili jema,' huku 'jambo' likikamilisha usemi kwa Kiswahili bila kulifafanua kimakusudi kuwa ahadi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; 'Yahweh' hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Ikiwa הַטּוֹבָה הַזֹּאת litafsiriwe wazi kuwa ahadi
  choice: jambo hili jema
  alternative: ahadi hii njema
  rationale: Muktadha unaweza kuelekeza kwenye ahadi, lakini nomino 'ahadi' haipo wazi katika Kiebrania; tafsiri kuu huhifadhi upana huo na tanbihi hutoa uwezekano wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Ee Yahweh' ni mwito wa kawaida katika sala; 'wewe ndiye Mungu' huhifadhi msisitizo bila kuwa mgumu. Alama ya tanbihi imewekwa baada ya sentensi inayohusika.
