source:
  edition: WLC
  text: וְ֠/יֵֽאָמֵן וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֱלֹהִ֖ים לְ/יִשְׂרָאֵ֑ל וּ/בֵית דָּוִ֥יד עַבְדְּ/ךָ֖ נָכ֥וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/024.yaml
  text: May it be established[a], and may your name be magnified forever, saying, ‘Yahweh of hosts, the God of Israel[b], is God to Israel,’ and may the house of David your servant be established before you.
translation:
  language: sw
  text: Na ithibitike, na jina lako na likuzwe milele, wakisema, “Yahweh wa majeshi, Mungu wa Israeli, ni Mungu kwa Israeli[a].” Na nyumba[b] ya Daudi, mtumishi wako, na ithibitike mbele zako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “Mungu kwa Israeli.” Inaweza pia kutafsiriwa, “Mungu wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Hapa “nyumba” inamaanisha ukoo wa kifalme au nasaba ya Daudi.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֵאָמֵן וְיִגְדַּל שִׁמְךָ
  choice: Jina lako na lithibitike na kutukuzwa
  rationale: Kisarufi, nomino ‘jina lako’ inaweza kuwa kiima cha vitenzi vyote viwili vya ombi. Muundo huu ni wa asili katika Kiswahili na huhifadhi wazo la jina kufanywa imara na kuu. Uhusiano unaowezekana wa kitenzi cha kwanza na ahadi iliyotangulia umeelezwa katika tanbihi.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha udumu unaokusudiwa na Kiebrania.
- source_word: לֵאמֹר
  choice: watu wakisema
  rationale: Hufanya maana ya usemi unaofuata iwe wazi kwa Kiswahili bila kubadili yaliyomo katika tangazo hilo.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahwe wa majeshi
  rationale: ‘Yahwe’ huhifadhi jina la Mungu, na ‘wa majeshi’ huwasilisha cheo צְבָאוֹת bila kukipunguza kuwa jeshi moja tu.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huu ni ujenzi wa kawaida wa Kiswahili kwa kishazi cha Kiebrania kinachomtambulisha Yahwe kwa uhusiano wake na Israeli.
- source_word: אֱלֹהִים לְיִשְׂרָאֵל
  choice: ndiye Mungu wa Israeli
  rationale: Hii ndiyo kauli ya asili na inayoeleweka katika Kiswahili. Tanbihi huhifadhi uwezekano mpana wa kihusiano wa kihusishi ל, ambacho kwa neno kwa neno ni ‘Mungu kwa Israeli.’
- source_word: וּבֵית דָּוִיד עַבְדְּךָ
  choice: Nayo nyumba ya Daudi, mtumishi wako
  rationale: ‘Nyumba’ huhifadhi sitiari ya Kiebrania; katika muktadha huu inamaanisha ukoo wa kifalme au nasaba ya Daudi, jambo linalofafanuliwa katika tanbihi.
- source_word: נָכוֹן לְפָנֶיךָ
  choice: na ithibitike mbele zako
  rationale: Huwasilisha hali ya kuwekwa imara kwa namna ya ombi na kuhifadhi usemi wa kihusiano ‘mbele zako.’
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo tu; kwa hiyo linatoholewa moja kwa moja kuwa ‘Yahwe.’
- issue: Nguvu ya vitenzi vya ombi
  choice: na lithibitike ... na kutukuzwa ... na ithibitike
  alternative: litathibitishwa ... litatukuzwa ... itathibitishwa
  rationale: Muktadha ni sala ya Daudi, hivyo miundo hii inaeleweka vizuri kama maombi au matakwa, si taarifa za wakati ujao pekee.
- issue: Maana ya אֱלֹהִים לְיִשְׂרָאֵל
  choice: ndiye Mungu wa Israeli
  alternative: ni Mungu kwa Israeli
  rationale: Kihusishi ל kinaweza kuonyesha uhusiano au manufaa. Tafsiri kuu ni ya kawaida kwa Kiswahili, huku tanbihi ikihifadhi muundo halisi na upana wake bila kuongeza fundisho.
- issue: Kiima cha וְיֵאָמֵן
  choice: jina lako
  alternative: ahadi/jambo lililotajwa kabla
  rationale: ‘Jina lako’ ni nomino ya kiume umoja inayoweza kuwa kiima cha vitenzi vyote viwili. Hata hivyo, kitenzi cha kwanza kinaweza pia kurejelea jambo lililotangulia; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa heshima lakini unaoeleweka kwa wasomaji wa leo. Muundo ‘na lithibitike’ na ‘na ithibitike’ umetumiwa kuonyesha ombi. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyofafanuliwa.
