  text: יְהוָה֙ אֵ֣ין כָּמ֔וֹ/ךָ וְ/אֵ֥ין אֱלֹהִ֖ים זוּלָתֶ֑/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/020.yaml
  text: O Yahweh[a], there is none like you, and there is no God besides you, in all that we have heard with our own ears.
translation:
  language: sw
  text: Ee Yahwe, hakuna aliye kama wewe, wala hakuna Mungu mwingine ila wewe, katika yote tuliyoyasikia kwa masikio yetu wenyewe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la agano la Mungu lililoandikwa moja kwa moja katika Kiebrania, kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: אֵין כָּמוֹךָ
  choice: hakuna aliye kama wewe
  rationale: Linaeleza kwa Kiswahili cha kawaida kwamba hakuna kiumbe anayelingana naye, huku likifuata muundo na maana ya Kiebrania.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: wala hakuna Mungu mwingine ila wewe
  rationale: Linasisitiza dai la moja kwa moja la Kiebrania kwamba hakuna Mungu mwingine isipokuwa Yahwe; neno “mwingine” linafanya sentensi iwe ya asili katika Kiswahili bila kudhoofisha upekee huo.
- source_word: בְּכֹל אֲשֶׁר
  choice: kulingana na yote
  rationale: 'Kiambishi בְ hapa kinaeleweka kuwa kinaonyesha msingi au kipimo cha ungamo hilo: yote yaliyosikiwa.'
- source_word: שָׁמַעְנוּ בְּאָזְנֵינוּ
  choice: tuliyoyasikia kwa masikio yetu wenyewe
  rationale: Linaendeleza picha halisi ya kusikia kwa masikio na msisitizo wa ushuhuda uliopokewa moja kwa moja.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu, si cheo; kwa hiyo jina linahifadhiwa badala ya kubadilishwa kuwa “BWANA.”
- issue: Nguvu ya dai katika וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: wala hakuna Mungu mwingine ila wewe
  alternative: wala hakuna mungu kama wewe
  rationale: Kiebrania kinakanusha kuwapo kwa Mungu mwingine, si kusema tu kwamba Yahwe ni mkuu kuliko miungu mingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Ee” linafaa kwa maombi ya moja kwa moja; “wala” linaunganisha makanusho mawili kwa mtiririko wa asili. Hakuna tanbihi iliyoongezwa kwa sababu mbadala wa Kiingereza hauleti tofauti muhimu inayohitaji kufafanuliwa katika Kiswahili.
