  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֲנִי֙ אֶֽהְיֶה לּ֣/וֹ לְ/אָ֔ב וְ/ה֖וּא יִֽהְיֶה לִּ֣/י לְ/בֵ֑ן וְ/חַסְדִּ/י֙ לֹא אָסִ֣יר מֵֽ/עִמּ֔/וֹ כַּ/אֲשֶׁ֣ר הֲסִיר֔וֹתִי מֵ/אֲשֶׁ֥ר הָיָ֖ה לְ/פָנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/013.yaml
  text: I will be a father to him[a], and he will be a son to me. And I will not remove my steadfast love from him[b], as I removed it from the one who was before you.
translation:
  language: sw
  text: Mimi nitakuwa baba yake,[a] naye atakuwa mwanangu. Wala sitamwondolea upendo wangu thabiti, kama nilivyomwondolea yule aliyekuwa kabla yako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mimi nitakuwa baba kwake, naye atakuwa mwana kwangu.”
    reason: lexical_alternative
  - marker: b
    text: “Yule aliyekuwa kabla yako” ni Sauli, aliyemtangulia Daudi kuwa mfalme.
    reason: cross_reference
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: nitakuwa baba yake
  rationale: Muundo huu ni wa kawaida na wenye hadhi katika Kiswahili, na unahifadhi uhusiano wa moja kwa moja wa ubaba unaoelezwa na Kiebrania.
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: naye atakuwa mwanangu
  rationale: Huu unaakisi kishazi cha kwanza kwa Kiswahili cha asili na kuhifadhi wazi lugha ya uhusiano wa baba na mwana.
- source_word: חַסְדִּי
  choice: upendo wangu thabiti
  rationale: חֶסֶד hapa huunganisha upendo na uaminifu wa kudumu katika uhusiano wa agano; ‘upendo wangu thabiti’ huhifadhi vipengele hivyo bila kuufupisha kuwa rehema pekee.
- source_word: לֹא אָסִיר מֵעִמּוֹ
  choice: sitamwondolea
  rationale: Kitenzi hiki huwasilisha kwa ufupi tendo la kuondoa kitu kutoka kwa mtu na kinaendeleza maana ya Hiphil ya סור.
- source_word: כַּאֲשֶׁר הֲסִירוֹתִי
  choice: kama nilivyomwondolea
  rationale: Kinarudia kwa makusudi kitenzi cha awali kama ilivyo katika Kiebrania; kitu kinachoondolewa, yaani upendo thabiti, kinaeleweka kutokana na kishazi kilichotangulia.
- source_word: מֵאֲשֶׁר הָיָה לְפָנֶיךָ
  choice: yule aliyekuwa kabla yako
  rationale: Tafsiri hii inadumisha namna isiyo ya moja kwa moja ya Kiebrania badala ya kumtaja Sauli katika matini kuu; ‘kabla yako’ humaanisha aliyekutangulia katika ufalme.
theological_decisions:
- issue: Lugha ya baba na mwana katika agano la Daudi
  choice: Kuhifadhi kauli ya moja kwa moja ‘nitakuwa baba yake, naye atakuwa mwanangu.’
  alternative: Nitamtunza kama baba, naye atakuwa kwangu kama mwana.
  rationale: Kiebrania kinaeleza uhusiano wa kifalme wa agano kwa lugha halisi ya baba na mwana. Ufafanuzi wa ‘kama’ ungelegeza dai hilo na kupunguza mvutano wake wa kitheolojia.
- issue: Maana ya חֶסֶד katika muktadha wa agano
  choice: upendo wangu thabiti
  alternative: fadhili zangu; rehema yangu; uaminifu wangu wa agano
  rationale: Chaguo hili linabeba pamoja upendo, uaminifu, na udumu bila kuifunga istilahi katika hisia pekee, wajibu wa kisheria pekee, au rehema pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Matini imetumia miundo ya kawaida ‘baba yake’ na ‘mwanangu’; tanbihi [a] inahifadhi kwa ukaribu zaidi muundo wa Kiebrania. ‘Upendo thabiti’ hutoa maana ya חֶסֶד kwa lugha inayoeleweka huku ikidumisha uzito wa agano.
