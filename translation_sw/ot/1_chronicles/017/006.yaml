id: 1CH.17.6
reference: 1 Chronicles 17:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שֹׁפְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר צִוִּ֛יתִי לִ/רְע֥וֹת אֶת עַמִּ֖/י לֵ/אמֹ֑ר לָ֛/מָּה לֹא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/006.yaml
  text: In all the places where I have walked among all Israel[a], did I ever speak a word to one of the judges of Israel, whom I commanded to shepherd my people, saying, ‘Why have you not built for me a house of cedar?’
translation:
  language: sw
  text: Popote nilipokwenda miongoni mwa Israeli wote,[a] je, niliwahi kusema neno kwa mmoja wa waamuzi wa Israeli, niliowaamuru wachunge watu wangu, nikisema, ‘Kwa nini hamkunijengea nyumba ya mierezi?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kifungu sambamba katika 2 Samweli 7:7 kinasema “makabila ya Israeli” (huku baadhi ya mashahidi yakiwa na usomaji unaoakisi “viongozi” au “fimbo za utawala”) badala ya “waamuzi wa Israeli.” Hapa maandishi ya Kiebrania ya Mambo ya Nyakati yanasema “waamuzi.”
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: nilipokwenda
  rationale: Hali ya hitpael hapa inaonyesha Mungu kwenda huku na huku pamoja na watu wake; ‘nilipokwenda’ ni ya kawaida katika Kiswahili huku ikihifadhi wazo la mwendo.
- source_word: בְּכָל יִשְׂרָאֵל
  choice: kati ya Israeli wote
  rationale: Kirai hiki pamoja na kitenzi cha mwendo kinaonyesha kuwapo katikati ya taifa zima, si eneo la kijiografia pekee.
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: je, niliwahi kusema neno
  rationale: Swali pamoja na nomino na kitenzi vyenye mzizi mmoja lina nguvu ya swali la balagha; ‘niliwahi kusema neno’ huhifadhi msisitizo huo.
- source_word: אֶת אַחַד שֹׁפְטֵי יִשְׂרָאֵל
  choice: kwa mmoja wa waamuzi wa Israeli
  rationale: אֶת pamoja na דבר hapa humtambulisha anayeambiwa; ‘kwa mmoja’ huwasilisha wazi anayeelekezewa maneno.
- source_word: שֹׁפְטֵי יִשְׂרָאֵל
  choice: waamuzi wa Israeli
  rationale: Maandishi ya Kiebrania ya Mambo ya Nyakati yanasema ‘waamuzi’; hayapaswi kupatanishwa kimya kimya na usomaji wa kifungu sambamba katika 2 Samweli.
- source_word: צִוִּיתִי לִרְעוֹת
  choice: niliowaamuru wachunge
  rationale: רעה ni sitiari ya kichungaji kwa kutawala na kuwatunza watu; ‘wachunge’ huihifadhi kwa Kiswahili cha kawaida.
- source_word: עַמִּי
  choice: watu wangu
  rationale: Huhifadhi moja kwa moja usemi wa agano bila kuupanua au kuupunguza.
- source_word: לָמָּה לֹא בְנִיתֶם לִי
  choice: Kwa nini hamkunijengea
  rationale: Wingi wa kitenzi cha Kiebrania umehifadhiwa, na ‘kunijengea’ huonyesha kwa kawaida kwamba nyumba hiyo ingejengwa kwa ajili ya Mungu.
- source_word: בֵּית אֲרָזִים
  choice: nyumba ya mierezi
  rationale: Kirai kinamaanisha nyumba iliyojengwa kwa mbao za mierezi; tafsiri hii ni ya asili na yenye hadhi katika Kiswahili.
theological_decisions:
- issue: Tofauti kati ya ‘waamuzi’ katika Mambo ya Nyakati na ‘makabila’ katika kifungu sambamba cha 2 Samweli 7:7
  choice: Kutafsiri maandishi ya Mambo ya Nyakati kuwa ‘waamuzi wa Israeli’ katika matini kuu
  alternative: ‘Makabila ya Israeli,’ au usomaji unaoakisi ‘viongozi/fimbo za utawala’ katika baadhi ya mashahidi wa 2 Samweli 7:7
  rationale: Kipaumbele cha chanzo cha lugha ya awali kinahitaji kufuata maandishi ya Kiebrania ya Mambo ya Nyakati, huku tofauti ya kifungu sambamba ikielezwa katika tanbihi badala ya kupatanishwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha na sitiari ya kuchunga zimehifadhiwa. Alama ya tanbihi [a] imewekwa katika matini kuu.
