base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/025.yaml
  text: For you[a], my God, have revealed to your servant that you will build him a house[b]; therefore your servant has found courage to pray before you.
translation:
  language: sw
  text: Kwa maana wewe, Mungu wangu, umemfunulia mtumishi wako[a] kwamba utamjengea nyumba[b]. Kwa hiyo mtumishi wako amepata ujasiri wa kuomba mbele zako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, Kiebrania kinasema, “umelifunua sikio la mtumishi wako,” nahau yenye maana ya “umemfunulia mtumishi wako.”
    reason: lexical_alternative
  - marker: b
    text: Au “utamjengea nasaba ya kifalme”; hapa “nyumba” yaelekea pia kumaanisha nasaba ya kifalme inayodumu.
    reason: alternative_reading
lexical_decisions:
- source_word: גָּלִיתָ אֶת אֹזֶן עַבְדְּךָ
  choice: umemfunulia mtumishi wako
  rationale: Nahau ya Kiebrania kwa neno ni ‘umelifunua sikio la mtumishi wako.’ Kiswahili cha maana kinawasilisha tendo la Mungu la kufichua jambo bila kutumia taswira ambayo ingekuwa tata katika Kiswahili.
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: kwamba utamjengea nyumba
  rationale: Kitenzi-jina kinaeleza yaliyofunuliwa. Muundo huu ni wa asili katika Kiswahili na unahifadhi taswira ya Mungu kumjengea Daudi ‘nyumba.’
- source_word: בָּיִת
  choice: nyumba
  rationale: ‘Nyumba’ huhifadhi taswira na utata halisi wa Kiebrania; katika muktadha huu inaweza pia kumaanisha ukoo wa kifalme unaodumu. Maana hiyo inaelezwa katika tanbihi badala ya kuwekwa moja kwa moja katika matini.
- source_word: מָצָא ... לְהִתְפַּלֵּל
  choice: amepata ujasiri wa kuomba
  rationale: Muundo wa Kiebrania wenye ‘amepata’ na kitenzi-jina unaonyesha kupata ujasiri au moyo wa kutenda. Tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: לְפָנֶיךָ
  choice: mbele zako
  rationale: Huu ni usemi wa heshima unaofaa katika sala na unaohifadhi wazo la kuwa katika uwepo wa Mungu.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika sala ya kifalme, neno hili ni namna ya kujitaja kwa unyenyekevu mbele za Mungu. ‘Mtumishi’ linafaa kwa sajili hii kuliko ‘mtumwa.’
theological_decisions:
- issue: Maana ya ‘nyumba’ katika ahadi kwa Daudi
  choice: Kuhifadhi ‘nyumba’ katika matini kuu na kuacha maana ya ukoo wa kifalme ikiwa ndani ya taswira
  alternative: Kutafsiri moja kwa moja kuwa ‘ukoo wa kifalme’ au ‘nasaba’
  rationale: Kiebrania kinadumisha maana yenye tabaka katika muktadha wa agano la Daudi. ‘Nyumba’ haifungi maana katika jengo halisi wala katika nasaba pekee; tanbihi hufafanua uwezekano huo bila kuondoa mvutano wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi wa sala ‘mbele zako’ na kujitaja kama ‘mtumishi wako’ huhifadhi sajili ya unyenyekevu; sentensi zimeunganishwa kwa mtiririko wa kawaida bila kufuta taswira ya ‘nyumba.’
