  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יְהוָ֔ה הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ יֵאָמֵ֖ן עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/023.yaml
  text: And now[a], Yahweh, let the word that you have spoken concerning your servant and concerning his house be established forever, and do as you have spoken.
translation:
  language: sw
  text: Na sasa, Ee Yahwe, neno ulilosema kuhusu mtumishi wako na kuhusu nyumba yake[a] lithibitike milele, nawe ufanye kama ulivyosema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nasaba yake ya kifalme” au “ukoo wake.” Neno la Kiebrania linalotafsiriwa “nyumba” linaweza kumaanisha watu wa nyumbani, ukoo, au nasaba ya kifalme katika muktadha huu wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Huhifadhi kiunganishi na kielezi cha wakati vinavyoonyesha mpito kutoka sifa ya Daudi kwenda ombi lake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo; kihisishi “Ee” kinaonyesha kwamba Daudi anamwita Mungu moja kwa moja.
- source_word: הַדָּבָר
  choice: neno
  rationale: Ingawa katika muktadha huu neno hilo ni ahadi, “neno” linafuata Kiebrania kwa karibu na kudumisha uhusiano na yale ambayo Mungu alisema.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: ulilosema
  rationale: Kauli hii inarejelea jambo ambalo Mungu tayari alisema; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: עַל עַבְדְּךָ וְעַל בֵּיתוֹ
  choice: kuhusu mtumishi wako na kuhusu nyumba yake
  rationale: Hapa עַל ina maana ya “kuhusu.” Kurudia “kuhusu” kunahifadhi uwiano wa Kiebrania, huku “nyumba” ikidumisha istilahi yenye maana pana katika agano la Daudi.
- source_word: יֵאָמֵן
  choice: lithibitike
  rationale: Niphal ya אמן hapa huonyesha neno kufanywa imara au kuthibitishwa. “Lithibitike” linafaa kwa ombi kwamba ahadi ya Mungu iwe na uthabiti wa kudumu.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Ni tafsiri ya kawaida na ya asili ya muda usio na mwisho au wenye kudumu.
- source_word: וַעֲשֵׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: nawe ufanye kama ulivyosema
  rationale: Hili ni ombi la moja kwa moja kwamba Mungu atende sawasawa na neno lake; kurudia kitenzi “sema” kunahifadhi ulinganifu wa kifungu.
theological_decisions:
- issue: Maana ya “nyumba yake” katika muktadha wa agano la Daudi
  choice: “nyumba yake” imehifadhiwa katika matini kuu
  alternative: “nasaba yake ya kifalme” au “ukoo wake”
  rationale: Ahadi inahusu zaidi ya jengo au watu wa nyumbani; inajumuisha ukoo wa kifalme wa Daudi. Hata hivyo, “nyumba” ndilo neno pana na lenye uzito wa kiagano katika Kiebrania, hivyo halijafasiriwa kwa maana moja tu katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki chenye mtindo wa sala ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. “Ee Yahwe” hudumisha usemi wa moja kwa moja kwa Mungu, na sentensi imehifadhi urari na marudio ya matini ya Kiebrania.
