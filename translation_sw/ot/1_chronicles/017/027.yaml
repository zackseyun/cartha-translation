source:
  edition: WLC
  text: וְ/עַתָּ֗ה הוֹאַ֨לְתָּ֙ לְ/בָרֵךְ֙ אֶת בֵּ֣ית עַבְדְּ/ךָ֔ לִ/הְי֥וֹת לְ/עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽי אַתָּ֤ה יְהוָה֙ בֵּרַ֔כְתָּ וּ/מְבֹרָ֖ךְ לְ/עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/027.yaml
  text: And now[a], you have been pleased to bless the house of your servant, that it may be before you forever; for you, O Yahweh, have blessed it[c][b], and it is blessed forever.
translation:
  language: sw
  text: Na sasa, umeona vema kuibariki[a] nyumba ya mtumishi wako[b], ili iwe mbele zako milele; kwa maana wewe, Yahweh, umeibariki, nayo imebarikiwa milele.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umeridhia kuibariki” au “umeamua kuibariki.”
    reason: lexical_alternative
  - marker: b
    text: Hapa “nyumba” huenda inamaanisha ukoo wa mtumishi huyo, hasa nasaba yake ya kifalme, wala si jengo lake tu.
    reason: cultural_note
  - marker: c
    text: Au “nayo ibarikiwe milele.” Baadhi huyaelewa maneno ya Kiebrania kama ombi, ingawa umbo lake linaelekea zaidi kuwa kauli ya hali ya kudumu ya kubarikiwa.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inahifadhi kiunganishi וְ pamoja na kielezi cha wakati עַתָּה, na ni mpito wa kawaida katika Kiswahili.
- source_word: הוֹאַלְתָּ
  choice: umeona vema
  rationale: Katika muktadha wa sala, kitenzi hiki huonyesha utayari au ridhaa ya neema; msemo huu ni wa asili na wenye heshima bila kuifanya maana kuwa ya kiufundi.
- source_word: לְבָרֵךְ
  choice: kuibariki
  rationale: Ni kitenzi-jina kinachokamilisha הוֹאַלְתָּ; kiambishi cha kitu -i- kinairejelea nyumba iliyo kitu cha baraka.
- source_word: בֵּית עַבְדְּךָ
  choice: nyumba ya mtumishi wako
  rationale: Neno 'nyumba' linahifadhi upana wa בַּיִת, ambao hapa unaweza kumaanisha ukoo wa kifalme wa Daudi, si jengo tu.
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: ili iwe mbele zako milele
  rationale: Inahifadhi muundo na wazo la kuwapo daima mbele za Mungu bila kufafanua kupita kiasi ikiwa ni kuwapo, kukubaliwa, au kuendelea chini ya fadhili zake.
- source_word: כִּי
  choice: kwa maana
  rationale: Inatanguliza msingi wa kauli inayotangulia kwa mtindo wa kawaida wa Kiswahili cha maandiko.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Inawakilisha jina binafsi la Mungu lililoandikwa katika Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: בֵּרַכְתָּ
  choice: umeibariki
  rationale: Kauli timilifu inaelezwa kama tendo lililotokea lenye matokeo ya sasa; kiambishi -i- kinarejelea nyumba ya mtumishi.
- source_word: וּמְבֹרָךְ לְעוֹלָם
  choice: nayo imebarikiwa milele
  rationale: 'Kiambishi-tendaji cha hali ya kutendwa מְבֹרָךְ kinaeleweka kwa kawaida kama hali inayotokana na baraka ya Yahweh: nyumba hiyo inabaki imebarikiwa milele.'
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina la agano moja kwa moja; 'Yahweh' hulihifadhi kama jina binafsi badala ya kuweka cheo mahali pake.
- issue: Maana ya kifungu cha mwisho וּמְבֹרָךְ לְעוֹלָם
  choice: 'Kauli ya hali/matokeo: “nayo imebarikiwa milele”'
  alternative: 'Ombi: “nayo na ibarikiwe milele”'
  rationale: Kiebrania kina umbo la kushirikisha la kutendwa, si amri wala jussive iliyo wazi. Usomaji wa kauli unaendana zaidi na sarufi, huku tanbihi ikihifadhi uwezekano wa kuelewa maneno hayo kama ombi.
- issue: Maana ya “nyumba” katika ahadi kwa Daudi
  choice: Kudumisha neno “nyumba” huku tanbihi ikieleza maana ya kiukoo
  alternative: Kutafsiri moja kwa moja “ukoo wa kifalme”
  rationale: Neno la chanzo linaweza kubeba maana ya familia, ukoo wa kifalme, au nyumba; kutaja ukoo moja kwa moja kungeondoa upana wake wa kimakusudi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa msomaji wa kawaida. “Umeona vema” hudumisha sauti ya sala bila kuwa nzito kupita kiasi; “mbele zako” huhifadhi taswira ya chanzo na utata wake wa kiagano.
