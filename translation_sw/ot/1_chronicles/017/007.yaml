  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗יד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מִֽן אַחֲרֵ֖י הַ/צֹּ֑אן לִ/הְי֣וֹת נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/007.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people Israel.'
translation:
  language: sw
  text: 'Kwa hiyo sasa, hivi ndivyo utakavyomwambia mtumishi wangu Daudi: “Yahwe wa majeshi asema hivi: Mimi nilikuchukua kutoka malishoni[a], katika kulifuata kundi la kondoo, ili uwe mtawala[b] juu ya watu wangu Israeli.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka zizini.”
    reason: lexical_alternative
  - marker: b
    text: Au “kiongozi” au “mkuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huonyesha mpito wenye maana ya hitimisho au matokeo, huku ikihifadhi pia wazo la wakati la ‘sasa.’
- source_word: כֹּה תֹאמַר
  choice: hivi ndivyo utakavyomwambia
  rationale: Ni Kiswahili cha sasa na cha kawaida kinachohifadhi agizo la fomula ya mjumbe wa kinabii.
- source_word: לְעַבְדִּי
  choice: mtumishi wangu
  rationale: Katika muktadha huu עֶבֶד ni cheo cha heshima kinachoonyesha huduma ya Daudi kwa Mungu, si msisitizo wa hali ya utumwa.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahwe wa majeshi
  rationale: Huhifadhi jina la agano יְהוָה na upana wa צְבָאוֹת, ambalo linaweza kurejelea majeshi ya kidunia au ya mbinguni.
- source_word: לְקַחְתִּיךָ
  choice: Mimi nilikuchukua
  rationale: Hutoa maana ya moja kwa moja ya לקח na kusisitiza kwamba Mungu ndiye aliyeanzisha kuinuliwa kwa Daudi.
- source_word: מִן הַנָּוֶה
  choice: kutoka malishoni
  rationale: Katika mazingira ya uchungaji, נָוֶה inaelekea kumaanisha sehemu ya malisho; umbo la mahali ‘malishoni’ ni la asili katika Kiswahili.
- source_word: מִן אַחֲרֵי הַצֹּאן
  choice: kutoka nyuma ya kundi la kondoo
  rationale: Huhifadhi kwa ukaribu taswira ya Kiebrania ya Daudi akiwa nyuma ya kundi, badala ya kuifafanua tu kuwa alikuwa akilichunga.
- source_word: לִהְיוֹת נָגִיד
  choice: ili uwe mtawala
  rationale: נָגִיד humaanisha mtu aliyewekwa kuongoza au kutawala; ‘mtawala’ huwasilisha mamlaka hiyo bila kuifanya moja kwa moja kuwa cheo maalumu cha kifalme.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: wa watu wangu Israeli
  rationale: Kiswahili hutumia kwa kawaida ‘mtawala wa’ kueleza mamlaka juu ya watu; pia huhifadhi utambulisho wao kuwa watu wa Mungu na Israeli.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יְהוָה; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya cheo עַבְדִּי kwa Daudi
  choice: mtumishi wangu
  alternative: mtumwa wangu
  rationale: Hapa neno hilo linamtambulisha Daudi kama aliyechaguliwa kumtumikia Mungu na lina hadhi ya kiagano; ‘mtumwa’ ungesisitiza kupita kiasi hali ya utumwa.
- issue: Upana wa צְבָאוֹת katika jina la Mungu
  choice: wa majeshi
  alternative: wa majeshi ya mbinguni
  rationale: ‘Majeshi’ huhifadhi utata na upana wa neno la Kiebrania bila kulifungia kwa majeshi ya mbinguni pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa kinabii umetolewa kwa lugha inayoeleweka kwa urahisi, huku taswira ya uchungaji na utata wa neno נָגִיד vikihifadhiwa. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
