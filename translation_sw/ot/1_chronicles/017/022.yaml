source:
  edition: WLC
  text: וַ֠/תִּתֵּן אֶת עַמְּ/ךָ֨ יִשְׂרָאֵ֧ל לְ/ךָ֛ לְ/עָ֖ם עַד עוֹלָ֑ם וְ/אַתָּ֣ה יְהוָ֔ה הָיִ֥יתָ לָ/הֶ֖ם לֵ/אלֹהִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/022.yaml
  text: And you made your people Israel your people forever[a], and you, O Yahweh, became their God.
translation:
  language: sw
  text: Nawe uliwafanya watu wako Israeli kuwa watu wako milele[a], nawe, Ee Yahwe, ukawa Mungu wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulikuwa Mungu wao.” Kiebrania kinaweza kutafsiriwa kwa namna inayoonyesha hali iliyokuwapo; lakini maandishi makuu yanaonyesha kuanzishwa kwa uhusiano wa agano katika muktadha huu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: uliwafanya
  rationale: Ingawa kitenzi נתן kwa msingi humaanisha ‘kutoa,’ muundo wake hapa pamoja na לְךָ לְעָם una maana ya kuweka au kuanzisha hadhi; ‘uliwafanya’ ni Kiswahili cha kawaida kinachoonyesha kwamba Mungu aliwaweka Israeli kuwa watu wake.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: watu wako Israeli
  rationale: Inahifadhi umilikaji na utambulisho wa taifa kwa mtiririko wa kawaida wa Kiswahili.
- source_word: לְךָ לְעָם
  choice: kuwa watu wako
  rationale: 'Viambishi viwili vya ל vinaonyesha kusudi au hadhi iliyowekwa: Israeli walifanywa kuwa watu wanaomilikiwa na Mungu katika uhusiano wa agano.'
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Ni usemi wa kawaida na wenye heshima kwa kudumu bila mwisho unaokusudiwa katika muktadha huu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi la Kiebrania.
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: ukawa Mungu wao
  rationale: Kitenzi היה pamoja na לֵאלֹהִים kinaweza kuonyesha kuanzishwa kwa uhusiano wa agano; ‘ukawa’ huhifadhi nguvu hiyo ya kimuktadha kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Tafsiri ya kauli ya agano היה + ל + אלהים
  choice: ukawa Mungu wao
  alternative: ulikuwa Mungu wao
  rationale: ‘Ukawa’ huonyesha kuanzishwa kwa uhusiano wa agano kati ya Mungu na Israeli bila kudokeza mabadiliko katika asili ya Mungu. Hata hivyo, Kiebrania pia kinaweza kueleweka kwa hali tulivu, hivyo tafsiri mbadala imewekwa katika tanbihi ili kuhifadhi utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Ee Yahwe’ inafikisha mwito wa moja kwa moja wa Kiebrania, na sentensi inadumisha usambamba wa kauli ya agano.
