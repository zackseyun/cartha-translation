  text: וַ/תִּקְטַ֨ן זֹ֤את בְּ/עֵינֶ֨י/ךָ֙ אֱלֹהִ֔ים וַ/תְּדַבֵּ֥ר עַל בֵּֽית עַבְדְּ/ךָ֖ לְ/מֵ/רָח֑וֹק וּ/רְאִיתַ֗/נִי כְּ/ת֧וֹר הָ/אָדָ֛ם הַֽ/מַּעֲלָ֖ה יְהוָ֥ה אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/017.yaml
  text: And this was a small thing in your eyes[a], O God; yet you have spoken concerning your servant’s house for a long time to come, and you have regarded me according to the rank of man on high, O Yahweh God.
translation:
  language: sw
  text: Jambo hili lilikuwa dogo machoni pako[a], Ee Mungu; hata hivyo, umesema kuhusu nyumba ya mtumishi wako kwa ajili ya wakati ujao wa mbali, nawe umenihesabu kulingana na cheo cha mtu wa juu, Ee Yahweh Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nawe umenionyesha vizazi vya wanadamu vijavyo,” au, “nawe umeniona kama mwanadamu mwenye cheo cha juu.” Kiebrania cha kishazi cha mwisho ni kigumu na kinaweza kufasiriwa kwa njia kadhaa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן זֹאת
  choice: Jambo hili lilikuwa dogo
  rationale: Inahifadhi tamathali ya Kiebrania kwamba jambo hilo lilihesabiwa kuwa dogo au lisilo kubwa, kwa Kiswahili cha kawaida.
- source_word: בְּעֵינֶיךָ
  choice: machoni pako
  rationale: Ni nahau ya Kiebrania ya kutathmini au kuhesabu jambo; Kiswahili kinaweza kuihifadhi kwa uwazi.
- source_word: אֱלֹהִים
  choice: Ee Mungu
  rationale: Hapa ni usemi wa moja kwa moja kwa Mungu, hivyo kiingizi cha mwito “Ee” kinafaa.
- source_word: וַתְּדַבֵּר עַל בֵּית עַבְדְּךָ
  choice: umesema kuhusu nyumba ya mtumishi wako
  rationale: Inafuata maana ya msingi ya ‘kusema kuhusu’ bila kubadili moja kwa moja kuwa ‘kuahidi,’ ingawa muktadha una nguvu ya ahadi.
- source_word: לְמֵרָחוֹק
  choice: kwa wakati mrefu ujao
  rationale: Katika muktadha huu, umbali una maana ya wakati wa baadaye ulio mbali.
- source_word: וּרְאִיתַנִי
  choice: nawe umeniona
  rationale: Inadumisha kitenzi cha msingi ‘kuona’ na kuacha kishazi kinachofuata kueleza namna Mungu alivyomwona au kumhesabu Daudi.
- source_word: כְּתוֹר
  choice: kulingana na cheo cha
  rationale: Neno hili gumu linaweza kuonyesha utaratibu, nafasi, au daraja; ‘cheo’ kinahifadhi wazo la hadhi bila kulifanya hakika kupita maandishi.
- source_word: הָאָדָם הַמַּעֲלָה
  choice: mwanadamu aliye juu
  rationale: Tafsiri hii inabaki karibu na maneno ya Kimasora na kuhifadhi utata wa kama ‘juu’ ni hadhi, kuinuliwa, au dhana nyingine.
- source_word: יְהוָה אֱלֹהִים
  choice: Ee Yahwe Mungu
  rationale: Inahifadhi jina binafsi la Mungu, Yahwe, pamoja na cheo ‘Mungu,’ katika mwito wa moja kwa moja.
theological_decisions:
- issue: Maana ya kishazi kigumu וּרְאִיתַנִי כְּתוֹר הָאָדָם הַמַּעֲלָה
  choice: nawe umeniona kulingana na cheo cha mwanadamu aliye juu
  alternative: nawe umenionyesha vizazi vya wanadamu vijavyo; au, nawe umeniona kama mwanadamu mwenye cheo cha juu
  rationale: Kiebrania kipo thabiti kimaandishi lakini maana yake si wazi. Tafsiri kuu inafuata kwa ukaribu mpangilio wa maandishi huku tanbihi ikihifadhi tafsiri nyingine muhimu bila kuamua kimya-kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa wasomaji wa kawaida. Nahau ‘machoni pako’ imehifadhiwa; kishazi cha mwisho kimeachwa na ugumu wake wa asili na kufafanuliwa kwa tanbihi.
