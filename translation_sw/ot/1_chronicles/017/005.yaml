  text: כִּ֣י לֹ֤א יָשַׁ֨בְתִּי֙ בְּ/בַ֔יִת מִן הַ/יּ֗וֹם אֲשֶׁ֤ר הֶעֱלֵ֨יתִי֙ אֶת יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָֽ/אֶהְיֶ֛ה מֵ/אֹ֥הֶל אֶל אֹ֖הֶל וּ/מִ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/005.yaml
  text: For I have not lived in a house from the day that I brought up Israel to this day[a], but I have gone from tent to tent and from dwelling place to dwelling place.
translation:
  language: sw
  text: Kwa maana sijakaa katika nyumba tangu siku nilipowapandisha Israeli mpaka leo, bali nimekuwa nikihama kutoka hema moja hadi jingine na kutoka makao moja hadi mengine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “bali nimekuwa nikihama kutoka hema hadi hema na kutoka maskani hadi maskani.”'
    reason: Kiebrania kinaweza kutafsiriwa kwa kufuata muundo wake kwa karibu zaidi, na משכן linaweza kumaanisha ‘maskani.’
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: sijakaa
  rationale: Kitenzi ישב kinapotumiwa pamoja na mahali humaanisha kukaa au kuishi. ‘Sijakaa’ ni Kiswahili cha kawaida na kinafaa kwa makao bila kudokeza kitendo cha kuketi tu.
- source_word: בְּבַיִת
  choice: katika nyumba
  rationale: בית hapa ni nyumba kwa maana ya jengo la kudumu, kinyume na hema; ‘hekalu’ kingeongeza maana ambayo neno la Kiebrania halitaji wazi.
- source_word: הֶעֱלֵיתִי אֶת יִשְׂרָאֵל
  choice: nilipowapandisha Israeli
  rationale: Hifili ya עלה ina maana ya kuwapandisha au kuwaleta juu. Tafsiri hii inadumisha taswira ya chanzo na utendaji wa Mungu bila kuongeza wazi ‘kutoka Misri,’ ingawa hilo ndilo tukio linalokusudiwa katika muktadha.
- source_word: וָאֶהְיֶה
  choice: nimekuwa nikihama
  rationale: Kihalisi ni ‘nimekuwa,’ lakini virai vinavyofuata vya kutoka hema moja hadi jingine vinaonyesha kuhamahama. ‘Nimekuwa nikihama’ huifanya maana hiyo iwe ya asili katika Kiswahili.
- source_word: מֵאֹהֶל אֶל אֹהֶל
  choice: kutoka hema moja hadi jingine
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza mwendo ‘kutoka hema hadi hema’ na inadumisha wazo la makao yanayohamishika.
- source_word: וּמִמִּשְׁכָּן
  choice: na kutoka makao moja hadi mengine
  rationale: משכן inaweza kumaanisha makao au maskani. ‘Makao’ hudumisha maana ya msingi bila kulifanya lazima liwe jina maalumu la Maskani; urudiaji wa mahali pa kufikia unaeleweka kutokana na ulinganifu wa kishairi.
theological_decisions:
- issue: Istilahi za mahali patakatifu bila kuingiza mapema teolojia ya Hekalu
  choice: Kutumia ‘nyumba,’ ‘hema,’ na ‘makao’ katika matini kuu.
  alternative: Kutumia ‘hekalu’ kwa בית na ‘Maskani’ kama jina maalumu kwa משכן.
  rationale: Mstari unatofautisha jengo la kudumu na makao ya hema yanayohamishika. ‘Hekalu’ lingetaja kwa uwazi zaidi ya Kiebrania, ilhali ‘makao’ huhifadhi maana pana ya משכן. Tafsiri yenye ‘maskani’ imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku ‘Israeli’ ikihifadhiwa kama jina la pamoja la taifa na sintaksia ya mwisho ikisawazishwa kwa ulinganifu unaodokezwa na Kiebrania.
