  text: And Nathan said to David, “Do all that is in your heart, for God is with you.”
translation:
  language: sw
  text: Ndipo Nathani akamwambia Daudi, “Fanya yote yaliyo moyoni mwako, kwa maana Mungu yu pamoja nawe.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo ... akamwambia” ni Kiswahili cha kawaida kinachoonyesha hatua inayofuata na kueleza wazi mlengwa wa usemi.
- source_word: נָתָן
  choice: Nathani
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: אֶל דָּוִיד
  choice: Daudi
  rationale: Katika muundo wa “akamwambia Daudi,” kiambishi -m- na jina Daudi kwa pamoja vinawasilisha kwa ufasaha maana ya kusema kwa Daudi.
- source_word: כֹּל אֲשֶׁר
  choice: yote yaliyo
  rationale: Kauli hii inahifadhi wazo la jumla la mambo yote yaliyomo katika nia ya Daudi huku ikiwa ya asili katika Kiswahili.
- source_word: בִּלְבָבְךָ
  choice: moyoni mwako
  rationale: לֵבָב inaweza kumaanisha moyo kama kitovu cha nia, mawazo na maamuzi. “Moyoni mwako” huhifadhi taswira ya Kiebrania bila kuibana kuwa akili au hisia pekee.
- source_word: עֲשֵׂה
  choice: Fanya
  rationale: Amri ya עשה ni pana; “Fanya” ni ya moja kwa moja na inaendana vizuri na “yote yaliyo moyoni mwako.”
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inaleta sababu ya ushauri uliotangulia; “kwa maana” ni ya heshima, wazi na ya kawaida katika usimulizi wa kibiblia.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Ingawa nomino ina kibainishi katika Kiebrania, hapa inamtaja Mungu kwa uhakika. Kiswahili cha kawaida hakihitaji muundo usio wa asili kama “yule Mungu.”
- source_word: עִמָּךְ
  choice: yu pamoja nawe
  rationale: Kauli hii inawasilisha uwepo na uungaji mkono wa Mungu. “Yu pamoja nawe” ni fupi, yenye hadhi na inayoeleweka katika Kiswahili sanifu.
theological_decisions:
- issue: Jina au cheo cha Mungu katika הָאֱלֹהִים
  choice: Mungu
  alternative: BWANA
  rationale: Chanzo kinatumia אֱלֹהִים, si jina la agano YHWH; kwa hiyo “Mungu” huhifadhi tofauti ya maneno ya chanzo bila kuingiza jina jingine.
- issue: Maana ya uwepo wa Mungu katika עִמָּךְ
  choice: yu pamoja nawe
  alternative: anakuunga mkono
  rationale: Tafsiri iliyochaguliwa huhifadhi usemi mpana wa chanzo, ambao unaweza kudokeza uwepo, kibali au msaada wa Mungu, bila kuufasiri kuwa msaada pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “akamwambia” ni wa asili katika simulizi; “moyoni mwako” huhifadhi sitiari ya chanzo, na “yu pamoja nawe” hudumisha ufupi na uzito wa kauli.
