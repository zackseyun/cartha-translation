  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י יִשְׂרָאֵ֤ל וּ/נְטַעְתִּ֨י/הוּ֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹא יוֹסִ֤יפוּ בְנֵי עַוְלָה֙ לְ/בַלֹּת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/009.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], and they will dwell in their own place and be disturbed no more. And the sons of wickedness will no longer wear them down, as at the first[b],
translation:
  language: sw
  text: Nami nitawateulia watu wangu Israeli mahali, nami nitawapanda, nao watakaa mahali pao wenyewe, wala hawatasumbuliwa tena. Watu waovu[a] hawataendelea kuwadhoofisha kama hapo kwanza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “wana wa uovu.”'
    reason: lexical_alternative
  - marker: b
    text: Au “kama zamani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: nitawateulia ... mahali
  rationale: Kitenzi שׂוּם kimsingi ni ‘kuweka,’ lakini pamoja na מָקוֹם hapa kina maana ya kuwapa au kuwateulia mahali. Usemi huu ni wa kawaida katika Kiswahili na unahifadhi tendo la Mungu.
- source_word: לְעַמִּי יִשְׂרָאֵל
  choice: watu wangu Israeli
  rationale: Inahifadhi wazi uhusiano wa agano unaoonyeshwa na kiambishi cha umilikaji ‘wangu’ na jina Israeli.
- source_word: וּנְטַעְתִּיהוּ
  choice: nami nitawapanda
  rationale: ‘Kupanda’ linahifadhi tamathali ya Kiebrania ya kuwafanya watu wawe imara na wenye kudumu katika nchi. Ingawa kiambishi cha Kiebrania ni cha umoja, kinamrejelea Israeli kama jumuiya; Kiswahili cha kawaida hutumia wingi kwa ‘watu wangu Israeli.’
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: nao watakaa mahali pao wenyewe
  rationale: Maana ya kimuktadha ni kukaa kwa uthabiti katika mahali walipopewa. Tafsiri ya neno kwa neno ‘chini yake’ ingekuwa yenye utata usio wa lazima katika Kiswahili.
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: wala hawatasumbuliwa tena
  rationale: רָגַז inaweza kueleza kutikisika, kufadhaika, au kusumbuliwa. Katika muktadha wa usalama wa taifa, ‘hawatasumbuliwa tena’ huwasilisha kutotikiswa na maadui bila kuongeza maana ya ziada.
- source_word: בְנֵי עַוְלָה
  choice: watu waovu
  rationale: Hii ni nahau ya Kiebrania, kwa neno ‘wana wa uovu.’ Kiswahili cha kawaida hueleza maana yake kwa ‘watu waovu,’ huku tanbihi ikihifadhi umbo halisi.
- source_word: לְבַלֹּתוֹ
  choice: kuwadhoofisha
  rationale: Kitenzi בלה katika muundo huu kina wazo la kumaliza nguvu au kudhoofisha hatua kwa hatua. ‘Kuwadhoofisha’ ni sahihi zaidi kuliko neno pana ‘kuwatesa.’
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: kama hapo kwanza
  rationale: Usemi huu unaelekeza kwenye kipindi cha awali cha historia ya Israeli. ‘Kama hapo kwanza’ ni mfupi na karibu na Kiebrania, huku ‘kama zamani’ pia ikiwezekana.
theological_decisions:
- issue: Umoja wa kijumuiya na wingi katika ahadi kwa Israeli
  choice: Viambishi vya wingi vimetumiwa kwa ‘watu wangu Israeli.’
  alternative: 'Kutumia umoja kwa kufuata maumbo ya Kiebrania: ‘nitampanda, naye atakaa.’'
  rationale: Kiebrania humtaja Israeli kama jumuiya moja, lakini Kiswahili humrejelea kwa kawaida ‘watu’ kwa wingi. Hili linafafanua rejeo bila kubadili ahadi ya Mungu kwa Israeli kama taifa.
- issue: Maana ya nahau תַּחְתָּיו
  choice: mahali pao wenyewe
  alternative: chini yake
  rationale: Muktadha unaonyesha makao salama na ya kudumu. ‘Chini yake’ lingeweza kueleweka vibaya kuwa chini ya kitu au mtu fulani, badala ya mahali walipopangiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. Tamathali ya ‘kupanda’ imehifadhiwa; nahau zisizoeleweka kwa urahisi zimewasilishwa kwa Kiswahili cha kawaida. Alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
