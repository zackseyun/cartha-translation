  to: Na itakuwa kwamba siku zako zitakapotimia, utakapokwenda kuwa pamoja na baba zako[a], nitamwinua mzao wako baada yako, ambaye atakuwa mmoja wa wanao, nami nitauimarisha ufalme wake.
  rationale: The revision corrects the Swahili sentence structure without changing the verse's meaning. It preserves the Hebrew's distinct 'go with your fathers' death idiom in a note, retains the historically immediate dynastic reference without importing later theological interpretation, and renders the establishment of the kingdom with the natural verb 'nitauimarisha.'
