review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the future-transition formula, the completion of David's lifetime, the death idiom, a successor from among David's sons, and the establishment of that successor's kingdom. The wording immediately after 'siku zako zitakapotimia' is grammatically incomplete in Swahili because 'nawe uende' is subjunctive and lacks a governing construction.
  naturalness: The proposed revision supplies the needed finite temporal verb ('utakapokwenda') and uses a more idiomatic direct verb for making the kingdom firm. It retains a dignified contemporary Standard East African Swahili register.
  terminology: '''Mzao wako,'' ''wanao,'' ''ufalme wake,'' and ''baba zako'' are appropriate. The note correctly identifies the expression as a Hebrew death idiom; its quoted literal wording is adjusted to match the Hebrew more precisely (''kwenda na baba zako''), while the main text remains naturally explicit (''kwenda kuwa pamoja na baba zako'').'
  issues:
  - severity: medium
    issue: The clause 'siku zako zitakapotimia, nawe uende kuwa pamoja na baba zako' is syntactically defective.
    rationale: The subjunctive 'uende' does not naturally continue the temporal clause in this construction. 'Utakapokwenda' supplies the required finite verb and clearly expresses the temporal relation conveyed by the Hebrew infinitive phrase.
  - severity: low
    issue: The footnote quotes 'uende pamoja na baba zako' as the literal expression.
    rationale: The Hebrew wording is literally 'to go with your fathers.' The note should quote 'kwenda na baba zako'; the fuller main-text expression is an idiomatic clarification rather than the literal wording.
  revised_text: Na itakuwa kwamba siku zako zitakapotimia, utakapokwenda kuwa pamoja na baba zako[a], nitamwinua mzao wako baada yako, ambaye atakuwa mmoja wa wanao, nami nitauimarisha ufalme wake.
