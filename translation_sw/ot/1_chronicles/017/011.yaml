  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי מָלְא֤וּ יָמֶ֨י/ךָ֙ לָ/לֶ֣כֶת עִם אֲבֹתֶ֔י/ךָ וַ/הֲקִֽימוֹתִ֤י אֶֽת זַרְעֲ/ךָ֙ אַחֲרֶ֔י/ךָ אֲשֶׁ֥ר יִהְיֶ֖ה מִ/בָּנֶ֑י/ךָ וַ/הֲכִינוֹתִ֖י אֶת מַלְכוּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/011.yaml
  text: And it shall be[a], when your days are fulfilled to go to be with your fathers, that I will raise up your offspring after you, who shall be one of your sons, and I will establish his kingdom.
translation:
  language: sw
  text: Na itakuwa kwamba siku zako zitakapotimia, utakapokwenda kuwa pamoja na baba zako[a], nitamwinua mzao wako baada yako, ambaye atakuwa mmoja wa wanao, nami nitauimarisha ufalme wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kwenda na baba zako”; hii ni nahau ya Kiebrania inayomaanisha kufa na kujiunga na mababu zako.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Na itakuwa
  rationale: Ni fomula ya mpito kuelekea jambo la wakati ujao; inadumisha mtindo wa heshima bila kuwa wa kizamani kupita kiasi.
- source_word: כִּי מָלְאוּ יָמֶיךָ
  choice: siku zako zitakapotimia
  rationale: Muundo huu una maana ya wakati na ni nahau ya kukamilika kwa muda wa maisha ya mtu.
- source_word: לָלֶכֶת עִם אֲבֹתֶיךָ
  choice: uende kuwa pamoja na baba zako
  rationale: Inahifadhi kitenzi cha pekee cha Mambo ya Nyakati, ‘kwenda,’ huku ‘kuwa pamoja na’ ikifanya nahau ya kifo na kujiunga na mababu ieleweke kwa Kiswahili.
- source_word: וַהֲקִימוֹתִי
  choice: nitamwinua
  rationale: Hapa mzizi קום katika kausativi unaeleza Mungu kumleta mrithi atokee; ‘kumwinua’ pia huitofautisha na הכין baadaye katika mstari.
- source_word: זַרְעֲךָ
  choice: mzao wako
  rationale: ‘Mzao’ ni Kiswahili cha kawaida kinachoweza kumaanisha mrithi mmoja huku kikihifadhi wazo la kizazi kinachotokana na Daudi.
- source_word: אַחֲרֶיךָ
  choice: baada yako
  rationale: Huonyesha mfuatano wa wakati na wa kifalme kwa ufupi na kwa uaminifu.
- source_word: אֲשֶׁר יִהְיֶה מִבָּנֶיךָ
  choice: ambaye atakuwa mmoja wa wanao
  rationale: 'Inawakilisha wazi kishazi husishi na maana ya sehemu ya מן: mrithi huyo atatoka miongoni mwa wana wa Daudi.'
- source_word: וַהֲכִינוֹתִי אֶת מַלְכוּתוֹ
  choice: nami nitaufanya ufalme wake kuwa imara
  rationale: הכין hapa ni kuufanya utawala uthibitike na udumu. Kauli hii ni ya asili kwa Kiswahili na huepuka kurudia ‘kuinua.’
theological_decisions:
- issue: Ahadi ya nasaba ya Daudi na mwangwi wake wa Kimasihi
  choice: Kutafsiri maana ya moja kwa moja kuhusu mrithi wa Daudi kutoka miongoni mwa wanawe bila kuongeza cheo cha Kimasihi.
  alternative: Kumtaja mrithi huyo wazi kuwa Masihi katika matini kuu.
  rationale: Mstari wenyewe unazungumzia kwanza mzao wa Daudi aliye mmoja wa wanawe na kuimarishwa kwa ufalme wake. Maana pana ya Kimasihi inaweza kujitokeza katika muktadha wa kanoni, lakini haipaswi kuingizwa moja kwa moja katika maneno ya mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la kifalme. Muundo wa Kiebrania umehifadhiwa inapowezekana, lakini sentensi imeundwa kwa mtiririko wa kawaida wa Kiswahili. Alama ya tanbihi [a] imewekwa baada ya nahau inayofafanuliwa.
