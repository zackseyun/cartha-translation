base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/019.yaml
  text: O Yahweh[a], for the sake of your servant and according to your heart, you have done all this greatness[b], to make known all these great things.
translation:
  language: sw
  text: Ee Yahwe, kwa ajili ya mtumishi wako na kulingana na moyo wako,[a] umetenda ukuu huu wote ili kuyafanya mambo haya yote makuu yajulikane.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “kulingana na mapenzi yako.” Kiebrania: “kulingana na moyo wako.”'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinabadilika kutoka umoja, “ukuu huu wote,” hadi wingi, “mambo haya yote makuu”; huenda umoja ni muhtasari wa pamoja, na wingi unaonyesha maonyesho yake mbalimbali.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatumiwa jina la Mungu kwa namna yake inayokubalika katika Kiswahili, badala ya kulibadilisha kuwa cheo kama “BWANA”.
- source_word: בַּעֲבוּר עַבְדְּךָ
  choice: kwa ajili ya mtumishi wako
  rationale: Kirai hiki kinaonyesha sababu au kumjali mtumishi; “kwa ajili ya” ni cha kawaida na kinafaa katika sala ya kifalme.
- source_word: וּכְלִבְּךָ
  choice: na kulingana na moyo wako
  rationale: Tafsiri hii inadumisha sitiari ya Kiebrania ya “moyo,” inayoweza kumaanisha nia au mapenzi ya ndani, bila kuifafanua kupita kiasi.
- source_word: עָשִׂיתָ
  choice: umetenda
  rationale: Kauli timilifu ya Kiswahili inaonyesha tendo lililofanyika lenye umuhimu wa sasa; “kutenda” inafaa kwa matendo ya Mungu katika rejesta hii.
- source_word: כָּל הַגְּדוּלָּה הַזֹּאת
  choice: ukuu huu wote
  rationale: Muundo wa umoja wa Kiebrania unahifadhiwa kama muhtasari wa pamoja wa tendo kuu la Mungu.
- source_word: לְהֹדִיעַ
  choice: ili kuyajulisha
  rationale: Muundo wa kusababisha wa kitenzi ידע unatolewa kwa “julisha,” huku “ili” ikionyesha kusudi.
- source_word: כָּל הַגְּדֻלּוֹת
  choice: matendo haya yote makuu
  rationale: Nomino ya wingi inaelekezwa kwenye maonyesho mengi ya ukuu; “matendo makuu” ni Kiswahili asilia zaidi kuliko “ukuu mbalimbali” na bado kinadumisha maana.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Jina binafsi linahifadhiwa badala ya kubadilishwa kuwa cheo, kwa uaminifu kwa maandishi ya Kiebrania.
- issue: Usemi wa kumwelezea Mungu “kulingana na moyo wako”
  choice: kulingana na moyo wako
  alternative: kulingana na mapenzi yako
  rationale: Sitiari ya “moyo” inahifadhiwa ili kutofuta upana wa maana unaojumuisha nia, kusudi na mapenzi ya Mungu.
- issue: Mabadiliko kutoka umoja hadi wingi
  choice: ukuu huu wote … matendo haya yote makuu
  alternative: mambo haya yote makuu … mambo haya yote makuu
  rationale: Tofauti ya Kiebrania kati ya umoja wa pamoja na wingi wa maonyesho yake inadumishwa badala ya kusawazishwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa msomaji wa kawaida. “Ee” inaonyesha mwito wa moja kwa moja; sintaksia imewekwa asilia bila kuondoa mpangilio wa hoja wa Kiebrania.
