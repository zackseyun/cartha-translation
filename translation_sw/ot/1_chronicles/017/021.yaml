revisions:
- from: Naye ni nani aliye kama watu wako Israeli—taifa moja duniani—ambao Mungu alikwenda kuwakomboa kwa ajili yake mwenyewe wawe watu wake, ili ujifanyie jina kwa mambo makuu na ya kutisha[a], kwa kuyafukuza mataifa kutoka mbele ya watu wako[b], ambao uliwakomboa kutoka Misri?
  to: Naye ni nani aliye kama watu wako, Israeli, taifa moja duniani, ambao Mungu alikwenda kuwakomboa ili uwe nao kuwa watu wako, ili ujipatie jina kwa matendo makuu na ya kuogofya[a], kwa kuyafukuza mataifa kutoka mbele ya watu wako[b], ambao uliwakomboa kutoka Misri?
  rationale: The revision resolves the ambiguous number agreement, replaces less idiomatic phrasing with natural Standard East African Swahili, and explicitly supplies 'matendo' for the implied great and awe-inspiring acts. It preserves the Hebrew's third-person/second-person shift, the rhetorical force, and the qualified textual note regarding the final clause.
