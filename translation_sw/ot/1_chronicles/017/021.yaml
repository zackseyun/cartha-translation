  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מִי֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁר֩ הָלַ֨ךְ הָ/אֱלֹהִ֜ים לִ/פְדּ֧וֹת ל֣/וֹ עָ֗ם לָ/שׂ֤וּם לְ/ךָ֙ שֵׁ֚ם גְּדֻלּ֣וֹת וְ/נֹרָא֔וֹת לְ/גָרֵ֗שׁ מִ/פְּנֵ֧י עַמְּ/ךָ֛ אֲשֶׁר פָּדִ֥יתָ מִ/מִּצְרַ֖יִם גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/021.yaml
  text: And who is like your people Israel[a], one nation on the earth, whom God went to redeem for himself as a people, to make for yourself a name by great and fearsome deeds, driving out nations from before your people[b], whom you redeemed from Egypt?
translation:
  language: sw
  text: Naye ni nani aliye kama watu wako, Israeli, taifa moja duniani, ambao Mungu alikwenda kuwakomboa ili uwe nao kuwa watu wako, ili ujipatie jina kwa matendo makuu na ya kuogofya[a], kwa kuyafukuza mataifa kutoka mbele ya watu wako[b], ambao uliwakomboa kutoka Misri?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mambo makuu na ya kutisha.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kihalisi: “kwa kuyafukuza mataifa kutoka mbele ya watu wako.” Mpangilio wa maneno mwishoni mwa sentensi umeeleweka kwa njia tofauti, hasa kwa sababu kifungu sambamba katika 2 Samweli 7:23 kina tatizo la kimaandishi.'
    reason: textual_variant
lexical_decisions:
- source_word: וּמִי
  choice: Naye ni nani
  rationale: Huhifadhi swali la balagha na kiunganishi cha Kiebrania; “nani” linawasilisha ulinganisho wa watu kama kundi la watu bila kuugeuza kuwa “taifa gani.”
- source_word: כְעַמְּךָ יִשְׂרָאֵל
  choice: aliye kama watu wako Israeli
  rationale: Huhifadhi ulinganisho ulio wazi na usemi wa agano kwamba Israeli ni watu wa Mungu.
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: taifa moja duniani
  rationale: Ni Kiswahili cha kawaida kinachohifadhi dai la kuwa taifa moja duniani bila kulipanua moja kwa moja kuwa “taifa la pekee.”
- source_word: אֲשֶׁר הָלַךְ הָאֱלֹהִים
  choice: ambao Mungu alikwenda
  rationale: Huhifadhi lugha ya kitendo na mwendo wa Mungu iliyo katika kitenzi הָלַךְ badala ya kuifuta kwa kusema tu kwamba Mungu aliamua.
- source_word: לִפְדּוֹת לוֹ עָם
  choice: kuwakomboa kwa ajili yake mwenyewe wawe watu wake
  rationale: “Kuwakomboa” ni neno la kawaida la ukombozi; kifungu cha kusudi na matokeo kinaonyesha kuwa Mungu aliwakomboa kwa ajili yake mwenyewe wawe watu wake.
- source_word: לָשׂוּם לְךָ שֵׁם
  choice: ili ujifanyie jina
  rationale: Huhifadhi nafsi ya pili katika maombi na nahau ya kujipatia sifa au kujulikana, bila kuifafanua zaidi ya maandishi.
- source_word: גְּדֻלּוֹת וְנוֹרָאוֹת
  choice: kwa mambo makuu na ya kutisha
  rationale: Huhifadhi ukubwa wa matendo na uwezo wake wa kuleta hofu na kicho; “mambo” hutoa Kiswahili kamili bila kubana maana kuwa matendo pekee.
- source_word: לְגָרֵשׁ
  choice: kwa kuyafukuza
  rationale: Inaunganisha kufukuzwa kwa mataifa na mambo makuu na ya kutisha aliyoyatenda Mungu.
- source_word: מִפְּנֵי עַמְּךָ
  choice: kutoka mbele ya watu wako
  rationale: Huhifadhi kwa kiasi kikubwa nahau ya Kiebrania ya kuondoa mataifa mbele au katika uwepo wa watu wa Mungu.
- source_word: אֲשֶׁר פָּדִיתָ מִמִּצְרַיִם
  choice: ambao uliwakomboa kutoka Misri
  rationale: Huhifadhi mazungumzo ya moja kwa moja na Mungu na kutaja wazi ukombozi kutoka Misri.
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Huwasilisha wingi usio na kibainishi maalumu na kulifanya neno kuwa yambwa la kitendo cha kuyafukuza.
theological_decisions:
- issue: Lugha ya Mungu kujifanyia jina katika לָשׂוּם לְךָ שֵׁם
  choice: ili ujifanyie jina
  alternative: ili ulifanye jina lako kuwa kuu
  rationale: Maandishi yanasema kwamba matendo ya ukombozi yanamjengea Mungu jina; tafsiri imehifadhi dai hilo bila kulainisha wala kuingiza maelezo ya kiteolojia yasiyosemwa.
- issue: Nguvu ya נוֹרָאוֹת
  choice: ya kutisha
  alternative: ya kustaajabisha
  rationale: Neno linahusu mambo yanayoamsha hofu na kicho. “Ya kutisha” huhifadhi ukali huo kuliko “ya kustaajabisha,” ingawa halimaanishi kwamba matendo hayo ni mabaya.
- issue: Mbadiliko kutoka kumtaja Mungu kwa nafsi ya tatu hadi kumsemesha kwa nafsi ya pili
  choice: Mungu alikwenda ... ili ujifanyie ... uliwakomboa
  alternative: ulikwenda ... ili ujifanyie ... uliwakomboa
  rationale: Kiebrania chenyewe kinamtaja “Mungu” kwa nafsi ya tatu kisha kinatumia nafsi ya pili katika maombi. Mbadiliko huo umehifadhiwa badala ya kusawazishwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa msomaji wa kawaida. Vistari virefu vinatenga kirai elezi “taifa moja duniani” ili sentensi ndefu ibaki wazi. Lugha ya ukombozi, jina la Mungu, na matendo yanayoleta hofu na kicho imehifadhiwa bila kuongezwa mafundisho ya dhehebu.
