  text: What more can David add before you for honoring your servant? You know your servant.
translation:
  language: sw
  text: Daudi anaweza kuongeza nini tena kwako kwa heshima uliyompa mtumishi wako?[a][b] Wewe unamjua mtumishi wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Daudi anaweza kusema nini tena kwako?” Baadhi ya tafsiri huongeza neno “kusema” ili kufanya maana iwe laini zaidi, lakini halijaandikwa moja kwa moja katika Kiebrania.
    reason: lexical_alternative
  - marker: b
    text: Kirai cha Kiebrania kilichotafsiriwa “kwa heshima uliyompa mtumishi wako” ni kigumu. Kinaweza pia kueleweka kuwa “kwa heshima ya mtumishi wako” au “ili kumheshimu mtumishi wako.”
    reason: alternative_reading
lexical_decisions:
- source_word: מַה
  choice: nini
  rationale: 'Kiwakilishi cha kuuliza kinaanzisha swali la balagha: “nini tena?”'
- source_word: יוֹסִיף עוֹד
  choice: anaweza kuongeza ... tena
  rationale: Kitenzi יסף pamoja na עוד kina maana ya kuongeza zaidi. Muundo huu unabaki karibu na Kiebrania bila kuingiza wazi kitenzi “kusema,” ambacho hakimo katika matini.
- source_word: דָּוִיד
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: אֵלֶיךָ
  choice: mbele zako
  rationale: Ingawa אל kwa kawaida humaanisha “kwa” au “kuelekea,” katika sala hii “mbele zako” linaonyesha kwa kawaida na kwa heshima kuwa Daudi ananena akiwa katika uwepo wa Mungu.
- source_word: לְכָבוֹד אֶת עַבְדֶּךָ
  choice: kwa heshima uliyompa mtumishi wako
  rationale: Kirai hiki cha Kiebrania kimebanwa na kina utata wa kisintaksia. Tafsiri hii inaeleza maana inayofaa muktadha—heshima ambayo Mungu amempa Daudi—huku tanbihi ikihifadhi uwezekano mwingine wa kuelewa muundo huo.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Daudi anajitaja kwa Mungu kwa unyenyekevu. “Mtumishi” ni neno la kawaida na lenye hadhi katika muktadha huu wa sala ya kifalme.
- source_word: וְאַתָּה ... יָדָעְתָּ
  choice: Wewe unamjua
  rationale: Kiwakilishi “Wewe” kinadumisha mkazo wa Kiebrania, na wakati uliotimilika wa ידע unaelezwa kwa hali ya sasa inayoonyesha ujuzi wa Mungu ulio thabiti.
theological_decisions:
- issue: Maana ya kirai kigumu לְכָבוֹד אֶת עַבְדֶּךָ
  choice: 'Mungu ndiye aliyempa mtumishi wake heshima: “kwa heshima uliyompa mtumishi wako.”'
  alternative: “kwa heshima ya mtumishi wako” au “ili kumheshimu mtumishi wako”
  rationale: Muktadha unaonyesha Daudi akistaajabia heshima ambayo Mungu amempa. Hata hivyo, kwa kuwa Kiebrania kimebanwa na kinaweza kuchanganuliwa kwa namna zaidi ya moja, tanbihi inaweka wazi usomaji mwingine bila kuufuta utata halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “anaweza kuongeza nini tena” unadumisha picha ya Kiebrania, ilhali “mbele zako” linafaa sauti ya sala. Marudio ya “mtumishi wako” yamehifadhiwa kwa sababu ni ya kimakusudi katika matini chanzi.
