  yaml_path: translation/ot/1_chronicles/017/014.yaml
  text: But I will establish him in my house and in my kingdom forever[c][b][a], and his throne will be established forever.
translation:
  language: sw
  text: Lakini nitamweka imara katika nyumba yangu na katika ufalme wangu milele[c][b][a], na kiti chake cha enzi kitakuwa imara milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitamweka katika nyumba yangu na juu ya ufalme wangu milele.” Kihusishi cha Kiebrania kinaweza kufasiriwa kwa namna inayoonyesha mamlaka, ingawa matini kuu huhifadhi ulinganifu wa “katika ... na katika ...” na upana wa maana.
    reason: lexical_alternative
  - marker: b
    text: Kiwakilishi kinachomaanisha “yeye” huenda kinamrejelea moja kwa moja mzao wa kifalme wa Daudi, hasa Solomoni, huku pia kikichangia ahadi pana kwa ukoo wa Daudi ambayo baadaye ilieleweka kwa namna ya Kimasihi.
    reason: alternative_reading
  - marker: c
    text: “Nyumba yangu” yaweza kumaanisha nyumba ya Mungu kwa maana pana ya agano; wengine huielewa hasa kuwa hekalu au jamaa ya kifalme ya Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַעֲמַדְתִּיהוּ
  choice: Lakini nitamweka imara
  rationale: Hifili ya עמד ina maana ya kumsababisha mtu asimame kwa uthabiti au kumweka katika nafasi thabiti. Kauli hii ni ya kawaida na inaeleweka katika Kiswahili, huku ikihifadhi mwangwi wa uthabiti unaojitokeza tena mwishoni mwa mstari. Kiunganishi וְ kimetafsiriwa “Lakini” kwa sababu hapa ahadi chanya ya Mungu inatofautishwa na onyo lililotangulia.
- source_word: בְּבֵיתִי
  choice: katika nyumba yangu
  rationale: Tafsiri hii inafuata kihusishi בְּ na kuhifadhi upana wa maana ya בית, ambayo hapa yaweza kumaanisha nyumba, jamaa ya kifalme, hekalu, au eneo la agano la Mungu bila kuamua maana moja pekee.
- source_word: וּבְמַלְכוּתִי
  choice: na katika ufalme wangu
  rationale: “Katika” huhifadhi ulinganifu na “katika nyumba yangu” na kuacha wazi wazo la kuwekwa ndani ya eneo la utawala au katika nafasi ya mamlaka. מלכות limetafsiriwa kwa neno la kawaida “ufalme.”
- source_word: עַד הָעוֹלָם
  choice: milele
  rationale: Kirai hiki huonyesha kudumu bila mwisho au kudumu kwa daima katika muktadha wa ahadi ya agano. “Milele” ni Kiswahili cha kawaida, kifupi na chenye hadhi.
- source_word: וְכִסְאוֹ
  choice: na kiti chake cha enzi
  rationale: כסא ni kiti cha enzi, istilahi muhimu ya kifalme. Tafsiri ya moja kwa moja imehifadhiwa badala ya kuibadili kuwa “utawala” au “nasaba.”
- source_word: יִהְיֶה נָכוֹן
  choice: kitakuwa imara
  rationale: נכון katika matumizi haya huonyesha kuwa thabiti, salama, au iliyowekwa kwa uthabiti. “Kitakuwa imara” ni cha asili katika Kiswahili na huhifadhi maana bila kudokeza kwamba uthabiti huo ni tendo la mwanadamu.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Kama ilivyo katika kirai cha kwanza, maneno haya yanaonyesha kudumu. Kurudia “milele” kunahifadhi msisitizo na ulinganifu wa Kiebrania.
theological_decisions:
- issue: Mhusika anayerejelewa na kiwakilishi cha nafsi “-m-” katika ahadi kwa Daudi
  choice: Kuhifadhi kiwakilishi bila kutaja Solomoni, ukoo wa kifalme, au Masihi katika matini kuu.
  alternative: Kumtaja Solomoni moja kwa moja; kukitafsiri kiwakilishi kuwa ukoo wa Daudi; au kumtaja Masihi moja kwa moja.
  rationale: Kiebrania kinatumia kiwakilishi cha kiume umoja bila kumtambulisha mhusika ndani ya mstari huu. Muktadha una uhusiano wa karibu na mzao wa kifalme wa Daudi, hasa Solomoni, na pia unachangia ahadi pana ya Daudi iliyoeleweka baadaye kwa namna ya Kimasihi. Tafsiri haipaswi kuondoa mvutano huo.
- issue: Upeo wa maana ya “nyumba yangu”
  choice: Kutafsiri moja kwa moja “nyumba yangu” bila kuibana kuwa hekalu au jamaa ya kifalme.
  alternative: “Hekalu langu,” “jamaa yangu,” au “nyumba yangu ya kifalme.”
  rationale: בית inaweza kuibua maana ya nyumba ya Mungu kwa upana, hekalu, kaya au eneo lake la agano. Usemi mpana huhifadhi tabaka hizi za maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nitamweka imara” na “kitakuwa imara” hudumisha uhusiano wa kimawazo kati ya vitenzi vya Kiebrania bila kutumia lugha nzito isiyo ya kawaida. Alama zote za tanbihi zimewekwa katika matini kuu kwa mpangilio uliotolewa.
