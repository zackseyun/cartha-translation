id: 1CH.17.10
reference: 1 Chronicles 17:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/לְ/מִ/יָּמִ֗ים אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הִכְנַ֖עְתִּי אֶת כָּל אוֹיְבֶ֑י/ךָ וָ/אַגִּ֣ד לָ֔/ךְ וּ/בַ֖יִת יִֽבְנֶה לְּ/ךָ֥ יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/010.yaml
  text: from the days when I appointed judges over my people Israel. And I will subdue all your enemies. Moreover[a], I tell you that Yahweh will build you a house.
translation:
  language: sw
  text: tangu siku zile nilipowateua waamuzi juu ya watu wangu Israeli. Nami nitawatiisha adui zako wote. Tena, ninakuambia kwamba Yahwe atakujengea nyumba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa “nyumba” inaweza kumaanisha ukoo wa kifalme; yaani, Yahwe atamwanzishia Daudi nasaba ya wafalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמִיָּמִים
  choice: tangu siku
  rationale: Kirai hiki cha wakati kinaendeleza wazo kutoka muktadha uliotangulia; ‘tangu siku’ ni cha asili katika Kiswahili na kinahifadhi maana ya kuanzia kipindi hicho.
- source_word: אֲשֶׁר צִוִּיתִי שֹׁפְטִים
  choice: nilipowateua waamuzi
  rationale: Ingawa צוה mara nyingi humaanisha ‘kuamuru,’ hapa kinahusu Mungu kuwaweka au kuwapa waamuzi mamlaka katika historia ya Israeli. ‘Kuwateua’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: waongoze watu wangu Israeli
  rationale: עַל huonyesha mamlaka juu ya watu. Kitenzi ‘waongoze’ kinafanya uhusiano huo uwe wa asili katika Kiswahili, huku ‘watu wangu Israeli’ kikihifadhi umilikaji muhimu wa agano.
- source_word: וְהִכְנַעְתִּי
  choice: nami nitawatiisha
  rationale: Katika mfululizo huu wa ahadi, umbo hili lina nguvu ya wakati ujao. ‘Kuwatiisha’ linafaa kwa adui wanaowekwa chini ya mamlaka.
- source_word: אֶת כָּל אֹיְבֶיךָ
  choice: adui zako wote
  rationale: Hili ni tamko la kawaida la Kiswahili linalohifadhi ujumla unaoonyeshwa na כָּל na umilikaji wa nafsi ya pili umoja.
- source_word: וָאַגִּד לָךְ
  choice: Tena, ninakuambia
  rationale: ‘Tena’ huonyesha hatua mpya katika tangazo, na wakati wa sasa ‘ninakuambia’ huwasilisha tangazo la Mungu linalotolewa wakati huo.
- source_word: וּבַיִת יִבְנֶה לְּךָ יְהוָה
  choice: Yahwe atakujengea nyumba
  rationale: Muundo wa kutendea ‘atakujengea’ unaonyesha kuwa nyumba hiyo ni kwa ajili ya Daudi. ‘Nyumba’ limehifadhiwa ili kudumisha mchezo wa maana kati ya jengo na ukoo wa kifalme.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa na cheo kama ‘BWANA.’
theological_decisions:
- issue: Maana ya ‘nyumba’ katika kishazi cha mwisho
  choice: Neno ‘nyumba’ limehifadhiwa katika matini kuu, huku maana ya ukoo wa kifalme ikifafanuliwa katika tanbihi.
  alternative: Yahwe atakuanzishia nasaba ya kifalme.
  rationale: בַּיִת hubeba mchezo wa maana unaohusisha nyumba au hekalu na nyumba ya kifalme au nasaba. Kutafsiri moja kwa moja kuwa ‘nasaba’ kungeondoa mvutano wa kifasihi na kitheolojia wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. ‘Waongoze’ linafanya dhana ya mamlaka ya waamuzi iwe ya kawaida bila kuacha maana ya chanzo, na ‘nyumba’ limeachwa bila kufasiriwa katika matini kuu ili kuhifadhi utata wenye kusudi.
