base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/004.yaml
  text: 'Go and say to David my servant[b][a], ‘Thus says Yahweh: You shall not build for me the house to dwell in.’'
translation:
  language: sw
  text: 'Nenda ukamwambie Daudi mtumishi wangu, ‘Yahwe asema hivi: Si wewe utakayenijengea nyumba[b] ili nikae ndani yake.’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Hutanijengea nyumba ili nikae ndani yake.” Kihalisi, kwa mkazo zaidi: “Si wewe utakayenijengea nyumba ili nikae ndani yake.”'
    reason: lexical_alternative
  - marker: b
    text: Yaani, nyumba iliyokusudiwa kuwa makao ya Yahwe—hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ וְאָמַרְתָּ
  choice: Nenda ukamwambie
  rationale: Mfuatano wa amri una maana ya kwenda kisha kumwambia Daudi; muundo huu ni wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: דָּוִיד עַבְדִּי
  choice: Daudi mtumishi wangu
  rationale: ‘Mtumishi’ linafaa kwa hadhi ya Daudi kama aliyepewa kazi na Mungu bila kusisitiza hali ya utumwa.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahwe asema hivi
  rationale: Huhifadhi kauli rasmi ya mjumbe wa Mungu na kulitaja jina la agano יהוה moja kwa moja.
- source_word: לֹא אַתָּה תִּבְנֶה
  choice: Si wewe utakayenijengea
  rationale: Kiwakilishi אַתָּה kimetajwa kwa msisitizo; ‘Si wewe’ huhifadhi mkazo kwamba Daudi si mtu atakayejenga, badala ya kuifanya kauli hii kuwa katazo tupu.
- source_word: לִּי הַבַּיִת
  choice: nyumba
  rationale: Kiambishi ‘-ni-’ katika ‘utakayenijengea’ kinawasilisha לִּי, huku ‘nyumba’ likihifadhi neno la Kiebrania הַבַּיִת badala ya kulifafanua moja kwa moja kuwa hekalu.
- source_word: לָשָׁבֶת
  choice: nikae ndani yake
  rationale: Muundo wa kusudi unaonyesha kwamba nyumba hiyo ingekuwa mahali pa kukaa kwa Yahwe; ‘ndani yake’ huifanya sentensi iwe ya asili na wazi kwa Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu lenye herufi nne; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Mkazo wa לֹא אַתָּה
  choice: Si wewe utakayenijengea
  alternative: Hutanijengea
  rationale: Kiebrania kinatumia kiwakilishi huru אַתָּה baada ya ukanushi, hivyo kinamkazia Daudi kuwa si yeye mjenzi; tafsiri mbadala inaweza kusikika kama katazo la kawaida tu.
- issue: Maana ya הַבַּיִת
  choice: nyumba
  alternative: hekalu
  rationale: Katika muktadha nyumba ni hekalu lililokusudiwa kuwa makao ya Yahwe, lakini neno lenyewe ni ‘nyumba’; maandishi makuu yanahifadhi taswira hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Nenda ukamwambie’ na ‘nikae ndani yake’ ni miundo ya kawaida, huku ‘Si wewe’ ikihifadhi mkazo wa Kiebrania.
