  text: וָֽ/אֶהְיֶ֣ה עִמְּ/ךָ֗ בְּ/כֹל֙ אֲשֶׁ֣ר הָלַ֔כְתָּ וָ/אַכְרִ֥ית אֶת כָּל אוֹיְבֶ֖י/ךָ מִ/פָּנֶ֑י/ךָ וְ/עָשִׂ֤יתִֽי לְ/ךָ֙ שֵׁ֔ם כְּ/שֵׁ֥ם הַ/גְּדוֹלִ֖ים אֲשֶׁ֥ר בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/008.yaml
  text: And I have been with you wherever you have gone[a], and I have cut off all your enemies from before you[b], and I will make for you a name like the name of the great ones who are on the earth.
translation:
  language: sw
  text: Nami nilikuwa pamoja nawe kila mahali ulipokwenda, nikawaondoa maadui zako wote mbele yako, nami nitakufanyia jina kama jina la wakuu walio duniani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nami nitakupa umashuhuri kama ule wa wakuu walio nchini.” Kiebrania ni “nitakufanyia jina”; neno linalotafsiriwa “duniani” laweza pia kumaanisha “nchini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: nilikuwa pamoja nawe
  rationale: Wayyiqtol ya היה inarejelea uwepo na msaada wa BWANA kwa Daudi katika wakati uliopita; Kiswahili cha wakati uliopita kinafuata mfululizo wa simulizi.
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: kila mahali ulipokwenda
  rationale: Nahau ya Kiebrania ina maana ya popote Daudi alipokwenda; usemi huu ni wa asili na wazi katika Kiswahili.
- source_word: וָאַכְרִית אֶת כָּל אוֹיְבֶיךָ
  choice: nikawaondoa maadui zako wote
  rationale: Hiphil ya כרת humaanisha kuwakatilia mbali au kuwaondoa. ‘Nikawaondoa’ huwasilisha matokeo kwa Kiswahili cha kawaida bila kulazimisha picha isiyo ya asili ya ‘kukata’ maadui.
- source_word: מִפָּנֶיךָ
  choice: mbele yako
  rationale: 'Huhifadhi taswira ya mahali ya Kiebrania: maadui waliondolewa mbele ya Daudi au kutoka katika njia yake.'
- source_word: וְעָשִׂיתִי לְךָ שֵׁם
  choice: nami nitakufanyia jina
  rationale: Kitenzi hiki kina nguvu ya wakati ujao katika mfululizo wa ahadi. ‘Kukufanyia jina’ huhifadhi nahau muhimu ya Kiebrania, huku maana ya sifa au umashuhuri ikielezwa katika tanbihi.
- source_word: כְּשֵׁם הַגְּדוֹלִים
  choice: kama jina la wakuu
  rationale: ‘Wakuu’ huonyesha watu mashuhuri au wenye cheo bila kuongeza jinsia ambayo kivumishi cha Kiebrania hakilazimishi hapa.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: walio duniani
  rationale: אָרֶץ yaweza kumaanisha dunia au nchi; muktadha wa sifa pana unaunga mkono ‘duniani,’ huku uwezekano wa ‘nchini’ ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Mpangilio wa nyakati katika matendo ya Mungu
  choice: Matendo mawili ya kwanza yamesimuliwa kama ya wakati uliopita, na tendo la mwisho kama ahadi ya wakati ujao.
  alternative: Kuyatafsiri mafungu yote kuwa ya wakati uliopita au yote kuwa ya wakati ujao.
  rationale: Muktadha unakumbusha uaminifu wa Mungu kwa Daudi uliopita, kisha unaelekea kwenye ahadi kuhusu jina lake.
- issue: Maana ya ‘jina’ katika ahadi
  choice: Kudumisha ‘jina’ katika matini kuu, likiwa na maana ya sifa au umashuhuri.
  alternative: Kutafsiri moja kwa moja ‘nitakupa umashuhuri.’
  rationale: Hii huhifadhi taswira na uzito wa nahau ya Kiebrania bila kuficha maana yake; tanbihi hutoa ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Pamoja nawe’ na ‘ulipokwenda’ ni miundo ya kawaida ya kibiblia isiyo ya kizamani kupita kiasi. Kiunganishi ‘nami’ huhifadhi mtiririko wa usemi wa Mungu.
