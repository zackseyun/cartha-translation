base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/012.yaml
  text: He will build a house for me[a], and I will establish his throne forever.
translation:
  language: sw
  text: Yeye atanijengea nyumba[a], nami nitakiimarisha kiti chake cha enzi milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hekalu” badala ya “nyumba”; neno la Kiebrania kwa maana halisi ni “nyumba,” na katika muktadha linarejelea hekalu ambalo Sulemani angejenga.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Yeye
  rationale: Kiwakilishi huru cha nafsi ya tatu, umoja wa kiume, kinamtaja mhusika wazi na kuhifadhi msisitizo wa sentensi ya Kiebrania.
- source_word: יִבְנֶה לִּי
  choice: atanijengea
  rationale: Kauli ya wakati ujao inaonyesha tendo lililoahidiwa; kiambishi tamati cha kutendea pamoja na -ni- kinawasilisha kwa Kiswahili maana ya ‘atajenga kwa ajili yangu.’
- source_word: בָּיִת
  choice: nyumba
  rationale: Maana ya msingi ni ‘nyumba.’ Katika muktadha ni mahali patakatifu ambapo Sulemani angejenga, lakini tafsiri ya msingi huhifadhi neno pana lililotumiwa katika Kiebrania.
- source_word: וְכֹנַנְתִּי
  choice: nami nitakiimarisha
  rationale: Kitenzi kina maana ya kukifanya kitu kiwe thabiti au salama. ‘Nitakiimarisha’ ni Kiswahili cha kawaida kinachofaa ahadi kuhusu ufalme.
- source_word: אֶת כִּסְאוֹ
  choice: kiti chake cha enzi
  rationale: Huwasilisha picha ya kiti cha mtawala pamoja na kiambishi cha umilikaji cha nafsi ya tatu.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Hili ni neno la kawaida na lenye hadhi kwa ahadi ya kudumu bila mwisho uliotajwa.
theological_decisions:
- issue: Ikiwa בָּיִת itafsiriwe ‘nyumba’ au ifafanuliwe kuwa ‘hekalu’
  choice: nyumba
  alternative: hekalu
  rationale: Kiebrania kinasema ‘nyumba.’ Kuhifadhi neno hilo kunadumisha uhusiano wa kifasihi katika agano la Daudi bila kuongeza ufafanuzi usiotajwa moja kwa moja.
- issue: Nguvu ya עַד עוֹלָם katika ahadi kwa nasaba ya Daudi
  choice: milele
  alternative: daima
  rationale: ‘Milele’ huwasilisha dai la andiko moja kwa moja bila kutatua kwa tafsiri mabishano ya kitheolojia kuhusu utimilifu wa mwisho wa ahadi hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘atanijengea’ unawasilisha kwa kawaida maana ya kujenga kwa ajili ya msemaji, huku ‘kiti chake cha enzi’ ikihifadhi taswira ya kifalme.
