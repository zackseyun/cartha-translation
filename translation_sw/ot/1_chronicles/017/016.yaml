  text: וַ/יָּבֹא֙ הַ/מֶּ֣לֶךְ דָּוִ֔יד וַ/יֵּ֖שֶׁב לִ/פְנֵ֣י יְהוָ֑ה וַ/יֹּ֗אמֶר מִֽי אֲנִ֞י יְהוָ֤ה אֱלֹהִים֙ וּ/מִ֣י בֵיתִ֔/י כִּ֥י הֲבִיאֹתַ֖/נִי עַד הֲלֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/016.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, O Yahweh God, and what is my house, that you have brought me this far?”
translation:
  language: sw
  text: Ndipo Mfalme Daudi akaingia, akaketi mbele za Yahwe, akasema, “Mimi ni nani, Ee Yahwe Mungu, na nyumba yangu ni nini[a], hata umenifikisha mpaka hapa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nyumba yangu” pia inaweza kumaanisha “watu wa nyumbani mwangu,” “familia yangu,” au “nasaba yangu ya kifalme.” Katika muktadha huu, neno la Kiebrania “nyumba” linaweza kurejelea kaya ya Daudi na ukoo wake wa kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaingia
  rationale: Kitenzi בוא kinaweza kumaanisha kuja, kwenda, au kuingia. Katika muktadha huu wa Daudi kwenda mbele za Yahwe, “akaingia” kinaeleza tendo hilo kwa kawaida bila kubainisha mahali pasipotajwa.
- source_word: וַיֵּשֶׁב
  choice: akaketi
  rationale: Ingawa ישב pia linaweza kumaanisha kukaa mahali au kuishi, mfuatano wa simulizi baada ya kuingia unaunga mkono maana halisi ya kuketi.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Hii ni tafsiri ya kawaida na yenye hadhi ya wazo la kuwa mbele au katika uwepo wa Yahwe.
- source_word: מִי אֲנִי
  choice: Mimi ni nani
  rationale: Kauli hii ya Kiswahili huwasilisha mshangao na unyenyekevu wa Daudi kwa njia ya kawaida.
- source_word: וּמִי בֵיתִי
  choice: na nyumba yangu ni nini
  rationale: Kiebrania hutumia “nani” mara ya pili, lakini Kiswahili cha kawaida husema “ni nini” kuhusu nyumba. “Nyumba” inadumisha sitiari pana inayoweza kuhusisha familia, jamaa, na nasaba ya kifalme.
- source_word: הֲבִיאֹתַנִי עַד הֲלֹם
  choice: umenifikisha hapa
  rationale: Hiphil ya בוא ina maana ya kusababisha mtu afike. “Umenifikisha hapa” huonyesha kwa ufupi kwamba Mungu ndiye aliyemleta Daudi hadi hatua hii.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יְהוָה. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Maana ya “nyumba yangu” katika muktadha wa ahadi kwa Daudi
  choice: Kudumisha “nyumba yangu” katika maandishi na kueleza upana wake katika tanbihi
  alternative: familia yangu; jamaa yangu; nasaba yangu ya kifalme
  rationale: Neno בֵּיתִי lina maana pana inayoweza kuhusisha kaya au familia na, katika muktadha huu, ukoo wa kifalme. Kutumia “nyumba” hakulazimishi maana moja na kunadumisha mvutano wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi vya “aka-” unadumisha mwendo wa simulizi, na “Ee” huonyesha wazi usemi wa moja kwa moja kwa Mungu.
