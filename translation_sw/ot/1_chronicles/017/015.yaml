  language: sw
  text: Kwa mujibu wa maneno haya yote[a] na kwa mujibu wa maono haya[b], ndivyo Nathani alivyomwambia Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mambo haya”; neno la Kiebrania דְּבָרִים linaweza kumaanisha maneno, mambo, au masuala kulingana na muktadha.
