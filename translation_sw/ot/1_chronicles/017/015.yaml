lexical_decisions:
- source_word: כְּכֹל
  choice: Kwa mujibu wa ... yote
  rationale: Muundo wa כ pamoja na כֹל unaonyesha ulingano na ujumbe uliotolewa; “kwa mujibu wa” ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: maneno haya yote
  rationale: דְּבָרִים inaweza kumaanisha maneno, mambo, au masuala. Katika muktadha huu ni ujumbe wa Mungu uliotolewa kwa Nathani, hivyo “maneno” huhifadhi vizuri maana ya yaliyosemwa.
- source_word: וּכְכֹל
  choice: na kwa mujibu wa ... yote
  rationale: Marudio ya muundo wa kwanza yamehifadhiwa ili kudumisha usawaziko wa sentensi ya Kiebrania.
- source_word: הֶחָזוֹן הַזֶּה
  choice: maono haya yote
  rationale: חָזוֹן hurejelea maono ya kinabii au ufunuo; “maono” ndiyo tafsiri ya moja kwa moja na iliyozoeleka. Neno la umoja la Kiebrania limewasilishwa kwa nomino ya Kiswahili ambayo kwa kawaida hutumika katika umbo la ngeli ya 6.
- source_word: כֵּן
  choice: ndivyo ... alivyosema
  rationale: כֵּן huonyesha kwamba Nathani alisema sawasawa na maneno na maono aliyopokea; muundo huu ni wa asili katika Kiswahili na huhifadhi ulingano huo.
- source_word: דִּבֶּר
  choice: alisema
  rationale: דבר ni kitenzi cha kawaida cha kusema au kunena. “Alisema” ni cha asili katika simulizi la Kiswahili bila kupunguza uzito wa ujumbe.
- source_word: נָתָן
  choice: Nathani
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אֶל דָּוִיד
  choice: na Daudi
  rationale: Ingawa אֶל huonyesha mwelekeo wa usemi, Kiswahili cha kawaida husema mtu “alisema na” mwingine; hapa si lazima kutumia muundo usio wa asili wa “alisema kwa Daudi.”
