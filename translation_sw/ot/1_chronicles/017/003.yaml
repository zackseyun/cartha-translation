  yaml_path: translation/ot/1_chronicles/017/003.yaml
  text: But that night the word of God came to Nathan[a], saying,
translation:
  language: sw
  text: Lakini usiku huo neno la Mungu likamjia Nathani[a], kusema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neno kutoka kwa Mungu likamjia Nathani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Lakini ... likamjia
  rationale: Matumizi ya וַיְהִי yanaendeleza simulizi. “Lakini” linaonyesha utofauti mdogo na muktadha uliotangulia, huku tukio la pili likiwasilishwa kiasili kwa “likamjia” bila kurudia kwa namna ngumu “ikawa.”
- source_word: בַּלַּיְלָה הַהוּא
  choice: usiku huo
  rationale: Huu ni usemi wa kawaida wa wakati unaohifadhi nguvu ya kiashiria הַהוּא kwa Kiswahili cha sasa.
- source_word: דְּבַר אֱלֹהִים
  choice: neno la Mungu
  rationale: דָּבָר linaweza kumaanisha neno, jambo, au ujumbe. Katika fomula ya ufunuo wa kinabii, “neno la Mungu” huhifadhi kwa usahihi uzito na muundo wa usemi wa Kiebrania.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu אֱלֹהִים linamtaja Mungu wa Israeli katika maana ya umoja.
- source_word: אֶל נָתָן
  choice: likamjia Nathani
  rationale: אֶל huonyesha mwelekeo kuelekea kwa mpokeaji. Kitenzi “likamjia” ni usemi wa asili wa Kiswahili kwa kufika kwa neno kwa mtu, na jina limetoholewa kuwa “Nathani.”
- source_word: לֵאמֹר
  choice: kusema
  rationale: Kitenzi-jina hiki hutanguliza maneno ya moja kwa moja. “Kusema” kinahifadhi kwa uwazi kazi yake katika simulizi la Kiebrania.
theological_decisions:
- issue: Tafsiri ya fomula ya ufunuo דְּבַר אֱלֹהִים
  choice: neno la Mungu
  alternative: neno kutoka kwa Mungu; ujumbe wa Mungu
  rationale: '“Neno la Mungu” huhifadhi muundo rasmi na uzito wa ufunuo wa kinabii bila kuongeza maelezo ya kimadhehebu. Tanbihi inahifadhi uwezekano wa kuelewa uhusiano wa maneno hayo kama chanzo: “neno kutoka kwa Mungu.”'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili lakini unahifadhi fomula rasmi ya ufunuo na utata halisi wa דְּבַר אֱלֹהִים.
