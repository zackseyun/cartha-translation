  terminology: «BWANA» ni uwakilishi wa kawaida wa יהוה katika Biblia za Kiswahili. «Waedomu», «Edomu», na «Daudi» ni maumbo ya kawaida. «Watumishi» ni chaguo linalohifadhi utata wa עֲבָדִים kwa taifa lililotiishwa, tofauti na «watumwa» ambayo ingebainisha zaidi ya mstari unavyodai.
