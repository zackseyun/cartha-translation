  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: נְצִיבִים imetolewa kwa maana ya vikosi vilivyowekwa Edomu; עֲבָדִים imehifadhiwa kama «watumishi» bila kulazimisha maana finyu ya utumwa wa mali; na וַיּוֹשַׁע katika muktadha wa vita imetolewa kiasili kama BWANA kumpa Daudi ushindi. «Kila mahali alikokwenda» ni uwasilishaji sahihi wa usemi «katika yote aliyokwenda».'
