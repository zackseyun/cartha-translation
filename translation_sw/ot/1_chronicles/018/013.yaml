  text: וַ/יָּ֤שֶׂם בֶּֽ/אֱדוֹם֙ נְצִיבִ֔ים וַ/יִּהְי֥וּ כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑יד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔יד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/013.yaml
  text: He placed garrisons in Edom, and all Edom became servants to David. And the LORD gave David victory wherever he went.
translation:
  language: sw
  text: Akaweka vikosi vya walinzi katika Edomu, na Waedomu wote wakawa watumishi wa Daudi. BWANA akampa Daudi ushindi kila mahali alikokwenda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְצִיבִים
  choice: vikosi vya walinzi
  rationale: Katika muktadha huu neno la wingi linaelekea kumaanisha vikosi vilivyowekwa ili kudhibiti eneo; tafsiri hii ni ya kawaida na inaeleweka kuliko tafsiri halisi isiyo wazi ya “waliowekwa.”
- source_word: עֲבָדִים
  choice: watumishi
  rationale: Neno linaweza kumaanisha watumwa, watumishi, au watu waliotiishwa. Hapa linaeleza Waedomu waliowekwa chini ya mamlaka ya Daudi; “watumishi” huhifadhi upana huo bila kupunguza hali yao ya kutiishwa.
- source_word: וַיּוֹשַׁע
  choice: akampa ... ushindi
  rationale: Kitenzi kwa msingi wake ni “aliokoa,” lakini katika simulizi la vita kinamaanisha kumwezesha Daudi kushinda; usemi huu ni wa asili katika Kiswahili na huhifadhi BWANA kuwa mtendaji.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: kila mahali alikokwenda
  rationale: Huwasilisha moja kwa moja maana ya kishazi cha Kiebrania katika Kiswahili sanifu.
theological_decisions:
- issue: Jina la agano יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” kwa herufi kubwa ni desturi iliyoenea katika Biblia za Kiswahili kwa kuwakilisha tetragramatoni, huku ikitofautishwa na cheo cha kawaida.
- issue: Maana ya עֲבָדִים katika hali ya taifa lililotiishwa
  choice: watumishi
  alternative: watumwa
  rationale: Muktadha unaweza kuhusisha utumwa au utumishi wa kulazimishwa, lakini neno lenyewe pia hutumika kwa raia waliotiishwa. “Watumishi” haifungi maana kwa namna isiyolazimishwa na mstari huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini rahisi kueleweka. Muundo wa sentensi umefuata mpangilio na msisitizo wa Kiebrania bila kuwa mgumu.
