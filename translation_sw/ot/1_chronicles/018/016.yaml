base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/016.yaml
  text: Zadok son of Ahitub and Abimelech son of Abiathar were priests[a], and Shavsha was secretary.
translation:
  language: sw
  text: Sadoki mwana wa Ahitubu na Abimeleki mwana wa Abiathari walikuwa makuhani[a], naye Shavsha alikuwa katibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kifungu sambamba katika 2 Samweli 8:17 kinasema “Ahimeleki mwana wa Abiathari” badala ya “Abimeleki mwana wa Abiathari.” Tafsiri hapa inafuata maandishi ya Kiebrania ya Mambo ya Nyakati.
    reason: textual_variant
lexical_decisions:
- source_word: צָדוֹק
  choice: Sadoki
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili inayotumika kwa kawaida katika majina ya Biblia.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika orodha hii ya maafisa, neno hili linaonyesha kwa kawaida uhusiano wa moja kwa moja wa baba na mwana.
- source_word: אֲחִיטוּב
  choice: Ahitubu
  rationale: Jina la mtu limetoholewa kwa mfumo wa kawaida wa Kiswahili.
- source_word: אֲבִימֶלֶךְ
  choice: Abimeleki
  rationale: Tafsiri inafuata maandishi ya Kiebrania ya Mambo ya Nyakati, ambayo hapa yana Abimeleki, huku tofauti ya kifungu sambamba ikielezwa katika tanbihi.
- source_word: אֶבְיָתָר
  choice: Abiathari
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili inayotambulika.
- source_word: כֹּהֲנִים
  choice: makuhani
  rationale: Hii ndiyo maana ya kawaida na inayofaa katika muktadha huu wa Sadoki na ukoo wa Abiathari.
- source_word: שַׁוְשָׁא
  choice: Shavsha
  rationale: Jina limehamishwa kwa kufuata kwa karibu umbo la Kiebrania la Mambo ya Nyakati; sauti /v/ inawakilisha beti isiyo na dageshi.
- source_word: סוֹפֵר
  choice: mwandishi wa serikali
  rationale: Katika utawala wa kifalme neno hili humaanisha afisa aliyeshughulika na uandishi na nyaraka; usemi huu unaeleza wajibu huo wazi kuliko 'mwandishi' peke yake.
