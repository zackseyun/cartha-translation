base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/003.yaml
  text: David struck Hadadezer king of Zobah[b][a], as he went to establish his power at the Euphrates River.
translation:
  language: sw
  text: Daudi akampiga Hadadezeri[a], mfalme wa Soba, kuelekea Hamathi, wakati Hadadezeri huyo alipokwenda kuimarisha mamlaka yake[b] kwenye Mto Frati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili limeandikwa “Hadadezeri” hapa; katika kifungu sambamba cha 2 Samweli 8:3 kuna umbo tofauti la jina, ambalo mara nyingi hutafsiriwa “Hadarezeri.”
    reason: textual_variant
  - marker: b
    text: Au “kurudisha udhibiti wake”; kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “kusimamisha mkono wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: akampiga
  rationale: Kitenzi נכה kimsingi humaanisha kupiga; katika muktadha huu kinaeleza tendo la kijeshi bila kulazimisha maana ya kushindwa kabisa.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezeri
  rationale: Jina limetoholewa kwa tahajia ya Mambo ya Nyakati na kwa muundo unaosomeka kwa kawaida katika Kiswahili.
- source_word: מֶלֶךְ צוֹבָה
  choice: mfalme wa Soba
  rationale: Huu ni mfuatano wa moja kwa moja unaotaja cheo cha kifalme na eneo alilotawala.
- source_word: חֲמָתָה
  choice: kuelekea Hamathi
  rationale: Herufi ya mwelekeo iliyoambatanishwa na jina la mahali inaonyesha mwendo kuelekea Hamathi; tafsiri hii huhifadhi maana hiyo bila kuifanya Hamathi kuwa lazima mahali hasa pa shambulio.
- source_word: בְּלֶכְתּוֹ
  choice: alipokwenda
  rationale: Muundo wa kitenzi-jina wenye kiambishi בְּ unaonyesha hali ya wakati; Kiswahili hiki ni cha kawaida na huacha rejeo la kiwakilishi litegemee muktadha kama katika Kiebrania.
- source_word: לְהַצִּיב יָדוֹ
  choice: kuimarisha mamlaka yake
  rationale: Nahau ya 'kusimamisha mkono wake' katika muktadha wa kijeshi na kisiasa inaelekea kumaanisha kuthibitisha au kurudisha udhibiti. 'Kuimarisha mamlaka yake' ni ya asili huku tanbihi ikihifadhi tafsiri nyingine.
- source_word: בִּנְהַר פְּרָת
  choice: kwenye Mto Frati
  rationale: נְהַר פְּרָת ni Mto Frati; 'kwenye' linafaa kwa eneo la utekelezaji wa mamlaka bila kubana zaidi uhusiano wa mahali.
