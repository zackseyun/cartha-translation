base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/007.yaml
  text: And David took the shields of gold that were on the servants of Hadadezer and brought them to Jerusalem[a][b][c].
translation:
  language: sw
  text: Daudi akazitwaa ngao za dhahabu[a] zilizokuwa kwa watumishi wa Hadadezeri[b], akazileta Yerusalemu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaweza kumaanisha ngao zilizofunikwa kwa dhahabu.
    reason: lexical_alternative
  - marker: b
    text: “Watumishi” hapa huenda ni wafuasi wa kifalme au wahudumu wa kijeshi wa Hadadezeri, si lazima watumwa wa nyumbani kwa maana finyu ya kisasa.
    reason: cultural_note
  - marker: c
    text: Baadhi ya mapokeo ya matini na simulizi inayolingana katika 2 Samweli huandika jina hili “Hadarezeri.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akazitwaa
  rationale: Kitenzi לקח kwa kawaida humaanisha ‘kutwaa/kuchukua.’ Katika muktadha wa vita kinaweza kudokeza kuteka, lakini ‘akazitwaa’ hudumisha maana ya msingi bila kuongeza ufafanuzi usiotajwa wazi.
- source_word: שִׁלְטֵי הַזָּהָב
  choice: ngao za dhahabu
  rationale: שׁלטים ni ngao, huenda ngao ndogo za kivita. Muundo ‘ngao za dhahabu’ unafuata kirai cha Kiebrania na hauamui kimya-kimya kama zilitengenezwa kabisa kwa dhahabu au zilifunikwa kwa dhahabu.
- source_word: אֲשֶׁר הָיוּ עַל
  choice: zilizokuwa kwa
  rationale: Kiebrania kinasema kihalisi ‘zilizokuwa juu ya/kwenye.’ ‘Zilizokuwa kwa’ ni Kiswahili cha kawaida kinachohifadhi uwezekano wa kuwa walizivaa, walizibeba, au walikuwa nazo bila kuamua zaidi ya matini.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: watumishi wa Hadadezeri
  rationale: עבדים humaanisha watumishi, lakini katika mazingira ya mfalme na jeshi inaweza kutaja wafuasi wa kifalme, maofisa, au wahudumu wa kijeshi. ‘Watumishi’ ni pana na ya uwazi.
- source_word: הֲדַדְעָזֶר
  choice: Hadadezeri
  rationale: Hili ndilo umbo la jina katika matini ya Kimasora ya aya hii; ‘-i’ ya mwisho hufanya jina litamkike kwa kawaida katika Kiswahili.
- source_word: וַיְבִיאֵם יְרוּשָׁלִָם
  choice: akazileta Yerusalemu
  rationale: Katika kausativi, בוא humaanisha ‘kuleta.’ Kiambishi ‘-zi-’ kinawakilisha ngao zilizotajwa, na ‘Yerusalemu’ ni umbo la kawaida la Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi wa Biblia ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. ‘Akazitwaa’ na ‘akazileta’ huendeleza mtiririko wa matendo ya mfululizo. Kirai ‘zilizokuwa kwa’ kimechaguliwa ili kuepuka Kiswahili kisicho cha kawaida cha ‘zilizokuwa juu ya’ huku kikihifadhi kutokubainishwa kwa uhusiano halisi wa ngao na watumishi.
