  text: וַ/יִּמְלֹ֥ךְ דָּוִ֖יד עַל כָּל יִשְׂרָאֵ֑ל וַ/יְהִ֗י עֹשֶׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה לְ/כָל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/014.yaml
  text: So David reigned over all Israel[a], and he administered justice and righteousness to all his people.
translation:
  language: sw
  text: Basi Daudi akatawala juu ya Israeli yote, naye akawatendea watu wake wote haki na uadilifu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Kitenzi מלך katika muktadha huu kinaeleza utawala wa kifalme wa Daudi. “Akatawala” ni Kiswahili cha kawaida na chenye hadhi; utambulisho wake kama mfalme tayari unaeleweka katika simulizi.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: juu ya Israeli yote
  rationale: Kirai hiki huonyesha eneo na watu waliokuwa chini ya utawala; “juu ya Israeli yote” kinahifadhi wazi upeo kamili wa utawala wa Daudi.
- source_word: וַיְהִי עֹשֶׂה
  choice: naye aliwatendea ... kwa
  rationale: Muundo היה pamoja na participle unaonyesha mwenendo wa kudumu au wa kawaida. Kiswahili “aliwatendea ... kwa” huwasilisha utendaji endelevu wa kifalme kwa namna ya asili kuliko tafsiri neno kwa neno.
- source_word: מִשְׁפָּט
  choice: haki
  rationale: Katika muktadha wa utawala wa kifalme, neno hili linahusu hukumu au usimamizi wenye haki. “Haki” linaeleweka kwa urahisi na linabeba maana ya kisheria hapa.
- source_word: וּצְדָקָה
  choice: uadilifu
  rationale: Neno צְדָקָה linaonyesha unyoofu na kutenda yaliyo sawa. “Uadilifu” hulitofautisha na מִשְׁפָּט huku likihifadhi upande wa kimaadili wa jozi hiyo.
- source_word: לְכָל עַמּוֹ
  choice: watu wake wote
  rationale: Kiambishi cha nafsi katika עַמּוֹ kinahifadhiwa kwa “wake,” na ל linaeleweka kama kuonyesha walionufaika na utawala wake wenye haki.
theological_decisions:
- issue: Tafsiri ya jozi ya kifalme מִשְׁפָּט וּצְדָקָה
  choice: haki na uadilifu
  alternative: hukumu na haki
  rationale: '“Haki na uadilifu” huhifadhi vipengele viwili vinavyokaribiana lakini si sawa: usimamizi wa haki katika mambo ya kisheria na mwenendo wa kimaadili ulionyooka. Hivyo jozi hiyo haifupishwi kuwa dhana moja wala kupewa maana ya kimadhehebu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo umefanywa wa asili bila kufuta maana ya tendo la kawaida au la kudumu katika Kiebrania.
