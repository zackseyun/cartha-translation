source:
  edition: WLC
  text: וְ/אַבְשַׁ֣י בֶּן צְרוּיָ֗ה הִכָּ֤ה אֶת אֱדוֹם֙ בְּ/גֵ֣יא הַמֶּ֔לַח שְׁמוֹנָ֥ה עָשָׂ֖ר אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/012.yaml
  text: And Abishai son of Zeruiah struck down eighteen thousand Edomites in the Valley of Salt[a].
translation:
  language: sw
  text: Naye Abishai mwana wa Seruya aliwapiga Waedomu elfu kumi na nane katika Bonde la Chumvi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְשַׁי
  choice: Naye Abishai
  rationale: Kiunganishi וְ kinahifadhi muunganiko wa simulizi; “naye” ni njia ya asili ya Kiswahili ya kuendeleza taarifa kuhusu mhusika.
- source_word: בֶּן צְרוּיָה
  choice: mwana wa Seruya
  rationale: Huhifadhi utambulisho wa ukoo kwa lugha ya kawaida na yenye heshima.
- source_word: הִכָּה
  choice: aliwaua
  rationale: Katika muktadha wa vita wenye idadi ya watu elfu kumi na nane, kitenzi נכה kinaelekea kumaanisha kuwapiga na kuwaua, si kushinda eneo tu. Kiambishi cha wingi kinaonyesha kuwa ‘Edomu’ hapa ni watu.
- source_word: אֶת אֱדוֹם
  choice: Waedomu
  rationale: Ingawa Kiebrania kina jina ‘Edomu,’ kitenzi cha vita pamoja na hesabu kinaonyesha watu wa Edomu, si nchi yenyewe.
- source_word: בְּ/גֵיא הַמֶּלַח
  choice: katika Bonde la Chumvi
  rationale: Tafsiri ya moja kwa moja ya jina la mahali, huku herufi kubwa zikionyesha kuwa ni toponimu.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: elfu kumi na nane
  rationale: Hutoa idadi hiyo kwa mpangilio wa kawaida wa Kiswahili na mtindo wa kifasihi wa Biblia.
theological_decisions:
- issue: Je, ‘Edomu’ ni watu au eneo?
  choice: Watu wa Edomu (‘Waedomu’)
  alternative: Nchi au eneo la Edomu
  rationale: Hesabu ya elfu kumi na nane baada ya kitenzi cha vita inaonyesha watu waliouawa, wala si eneo lililopigwa.
- issue: Nguvu ya kitenzi נכה katika taarifa ya vita
  choice: aliwaua
  alternative: aliwapiga / aliwashinda
  rationale: Muktadha wa idadi ya wahanga unaunga mkono maana ya kuua. Hata hivyo, kitenzi chenyewe kinaweza kuwa na wigo mpana zaidi katika miktadha mingine; uchaguzi huu unatokana na muktadha huu maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo ‘Naye’ unaendeleza simulizi kwa ulaini, na ‘Waedomu’ huweka wazi kwamba walengwa ni watu.
