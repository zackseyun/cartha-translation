  to: Basi Tou akamtuma mwanawe Hadoramu kwa Mfalme Daudi ili kumjulia hali na kumbariki, kwa sababu Daudi alikuwa amepigana na Hadadezeri na kumshinda, maana Hadadezeri alikuwa katika vita na Tou. Naye akatuma vyombo vya kila aina vya dhahabu, fedha na shaba.[a]
  rationale: Marekebisho yanatatua hitilafu ya kisarufi, yanarejesha wazi maana ya nahau ya Kiebrania ya kuulizia hali njema, na yanaweka kwa kawaida zaidi hali ya vita kati ya Hadadezeri na Tou. Kitenzi kinachodokezwa katika kifungu cha mwisho kimehifadhiwa pamoja na tanbihi yake.
