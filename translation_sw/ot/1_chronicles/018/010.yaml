  text: וַ/יִּשְׁלַ֣ח אֶת הֲדֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִיד ל/שאול ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עוּ הָיָ֣ה הֲדַדְעָ֑זֶר וְ/כֹ֗ל כְּלֵ֛י זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/010.yaml
  text: So he sent Hadoram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Tou[d][c][b]; and he sent all kinds of articles of gold and silver and bronze.
translation:
  language: sw
  text: Basi Tou akamtuma mwanawe Hadoramu kwa Mfalme Daudi ili kumjulia hali na kumbariki, kwa sababu Daudi alikuwa amepigana na Hadadezeri na kumshinda, maana Hadadezeri alikuwa katika vita na Tou. Naye akatuma vyombo vya kila aina vya dhahabu, fedha na shaba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, Kiebrania humalizia, “na vyombo vyote vya dhahabu, fedha na shaba”; kitenzi “akatuma” kimetolewa katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Basi ... akamtuma
  rationale: Muundo wa masimulizi unaendeleza tukio linalofuata; “Basi” ni kiunganishi cha kawaida cha Kiswahili. Mtendaji Tou anafahamika kutokana na muktadha wa aya iliyotangulia.
- source_word: הֲדוֹרָם בְּנוֹ
  choice: mwanawe Hadoramu
  rationale: Kiswahili cha kawaida huweka uhusiano wa kifamilia kabla ya jina; jina limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: לִשְׁאוֹל לוֹ לְשָׁלוֹם
  choice: ili amsalimu
  rationale: Nahau ya Kiebrania, kwa maana halisi ‘kumwuliza kuhusu amani/hali njema yake,’ katika ujumbe wa kidiplomasia humaanisha kumsalimu na kujulia hali.
- source_word: וּלְבָרֲכוֹ
  choice: na kumbariki
  rationale: Inadumisha maana ya msingi ya ברך bila kuifupisha kuwa pongezi pekee, ingawa katika muktadha huu baraka hizo zinahusiana na ushindi.
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: kwa sababu Daudi alikuwa amepigana na Hadadezeri na kumshinda
  rationale: ‘Kumshinda’ huwasilisha matokeo ya kijeshi ya נכה bila kudai kwamba Hadadezeri aliuawa. Jina ‘Daudi’ limerudiwa ili kuondoa utata wa viwakilishi katika Kiswahili.
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעוּ הָיָה הֲדַדְעָזֶר
  choice: maana Hadadezeri alikuwa amepigana vita na Tou
  rationale: Hii ni tafsiri ya asili ya nahau ‘alikuwa mtu wa vita na Tou,’ ikihifadhi uhasama wa kijeshi.
- source_word: וְכֹל כְּלֵי זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: Pia alimpelekea Daudi vyombo vya kila aina vya dhahabu, fedha na shaba
  rationale: Kitenzi ‘alimpelekea’ kimetolewa katika muktadha kwa sababu kifungu cha Kiebrania hakina kitenzi wazi. ‘Vyombo’ ni tafsiri pana ya כְּלֵי, na ‘shaba’ ndiyo istilahi ya kawaida ya Kiswahili kwa metali hii ya kale.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi ulio wazi na heshima inayofaa maandiko. Nahau za Kiebrania zimetafsiriwa kwa Kiswahili cha sasa bila kupoteza maana ya kidiplomasia na kijeshi.
