base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/017.yaml
  text: And Benaiah son of Jehoiada was over the Kerethites and the Pelethites[c][b][a], and David’s sons were the chief officials at the king’s side.
translation:
  language: sw
  text: Naye Benaya mwana wa Yehoyada alikuwa msimamizi wa Wakerethi na Wapelethi; nao wana wa Daudi walikuwa maafisa wakuu[a] karibu na mfalme.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wa kwanza” au “walio mbele”; huenda ni cheo cha maafisa wakuu wa ikulu.'
    reason: lexical_alternative
  - marker: b
    text: 'Kwa maana ya karibu, Kiebrania: “kando ya mkono wa mfalme,” nahau inayomaanisha kuwa karibu naye katika utumishi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: alikuwa msimamizi wa
  rationale: Katika muktadha wa kijeshi au kiutawala, neno hili huonyesha mamlaka au usimamizi juu ya kikundi.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: Wakerethi na Wapelethi
  rationale: Haya ni majina ya vikundi, kwa hiyo yametoholewa badala ya kufasiriwa; kiambishi Wa- kinaonyesha watu kwa Kiswahili cha kawaida.
- source_word: הָרִאשֹׁנִים
  choice: viongozi wa kwanza
  rationale: Maana ya msingi ni ‘wa kwanza’ au ‘walio mbele’; katika muktadha wa ikulu inaashiria cheo cha juu, huku tafsiri hii ikihifadhi kwa kiasi fulani utata wa Kiebrania.
- source_word: לְיַד הַמֶּלֶךְ
  choice: kando ya mfalme
  rationale: Kirai hiki ni ‘kwenye/karibu na mkono wa mfalme’ kwa tafsiri sisisi, kikimaanisha kuwa karibu naye katika utumishi; ‘kando ya mfalme’ huhifadhi picha ya ukaribu.
- source_word: וּבְנֵי דָוִיד
  choice: wana wa Daudi
  rationale: Ni kirai cha moja kwa moja kinachoonyesha wana halisi wa Daudi bila kuongeza ufafanuzi usiotolewa na maandishi.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaya mwana wa Yehoyada
  rationale: Majina yametoholewa kwa umbo linalofaa Kiswahili, na uhusiano wa kifamilia umetafsiriwa moja kwa moja.
