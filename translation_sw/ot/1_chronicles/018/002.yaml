  text: וַ/יַּ֖ךְ אֶת מוֹאָ֑ב וַ/יִּהְי֤וּ מוֹאָב֙ עֲבָדִ֣ים לְ/דָוִ֔יד נֹשְׂאֵ֖י מִנְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/002.yaml
  text: And he struck Moab[a], and the Moabites became servants to David, bringing tribute.
translation:
  language: sw
  text: Naye akaipiga Moabu, na Wamoabu wakawa watumishi[a] wa Daudi, wakimletea ushuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, watumwa. Neno la Kiebrania linaweza kumaanisha watumishi au watumwa; hapa linaonyesha kwamba Wamoabu walitiishwa chini ya Daudi na kulipa ushuru.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: akaipiga
  rationale: Kitenzi נכה kimsingi humaanisha kupiga. Hapa kinaonyesha tendo la kijeshi bila kuongeza wazi wazo la ushindi kamili, ingawa ushindi unaonekana katika matokeo yaliyofuata.
- source_word: אֶת
  choice: '[hakijatafsiriwa kivyake]'
  rationale: Ni kiashiria cha yambwa katika Kiebrania na hakina neno la lazima linalolingana nacho katika Kiswahili.
- source_word: מוֹאָב
  choice: Moabu / Wamoabu
  rationale: Kutajwa kwa kwanza kunaonyesha taifa kama yambwa la shambulio; kutajwa kwa pili kunaonyesha watu wake, kwa hiyo 'Wamoabu' ni Kiswahili cha kawaida.
- source_word: וַיִּהְיוּ
  choice: wakawa
  rationale: Katika masimulizi, היה pamoja na kiarifu mara nyingi huonyesha kuingia katika hali mpya; baada ya kupigwa, Wamoabu wakawa chini ya Daudi.
- source_word: עֲבָדִים
  choice: watumishi
  rationale: עֲבָדִים inaweza kumaanisha watumishi au watumwa. Katika muktadha huu wa kisiasa baada ya vita, 'watumishi' huonyesha hali ya kutiishwa bila kudai kwa uhakika mfumo wa utumwa wa kumilikiwa kama mali.
- source_word: לְדָוִיד
  choice: wa Daudi
  rationale: Kiambishi ל hapa kinaonyesha uhusiano wa kumtumikia na kuwa chini ya Daudi; muundo 'watumishi wa Daudi' ni wa kawaida katika Kiswahili.
- source_word: נֹשְׂאֵי
  choice: wakimletea
  rationale: Mshiriki wa נשׂא humaanisha kubeba au kuleta. Katika muktadha wa ushuru, 'wakimletea' hueleza kwa kawaida uwasilishaji kwa mtawala.
- source_word: מִנְחָה
  choice: ushuru
  rationale: Ingawa מִנְחָה pia inaweza kumaanisha zawadi, sadaka, au tunu, katika muktadha wa taifa lililotiishwa inamaanisha malipo ya lazima kwa mtawala.
theological_decisions:
- issue: Hali ya Wamoabu iliyoelezwa kwa עֲבָדִים
  choice: watumishi
  alternative: watumwa
  rationale: Neno la Kiebrania lina wigo mpana. Muktadha unaonyesha utiifu wa kisiasa na ulipaji wa ushuru, lakini hauamui wazi aina mahususi ya utumwa; kwa hiyo maana mbadala imehifadhiwa katika tanbihi badala ya kuifanya maandishi ya msingi yawe mahususi kupita chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaoeleweka kwa urahisi. 'Akaipiga Moabu' huhifadhi taswira ya Kiebrania, huku 'wakimletea ushuru' ikieleza kwa kawaida uhusiano wa taifa tegemezi.
