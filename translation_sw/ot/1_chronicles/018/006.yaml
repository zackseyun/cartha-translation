  text: וַ/יָּ֤שֶׂם דָּוִיד֙ בַּ/אֲרַ֣ם דַּרְמֶ֔שֶׂק וַ/יְהִ֤י אֲרָם֙ לְ/דָוִ֔יד עֲבָדִ֖ים נֹשְׂאֵ֣י מִנְחָ֑ה וַ/יּ֤וֹשַׁע יְהוָה֙ לְ/דָוִ֔יד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and the Arameans became David’s servants, bringing tribute[c][b]. And Yahweh gave victory to David wherever he went.
translation:
  language: sw
  text: Daudi akaweka vikosi vya kijeshi katika Aramu ya Damasko[a], nao Waaramu wakawa watumishi wa Daudi, wakileta ushuru[b]. Yahweh akampa Daudi ushindi[c] kila alikokwenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaweka majeshi”; kwa tafsiri ya neno kwa neno, “akaweka.” Kiebrania hakitaji wazi kitu alichoweka, lakini muktadha wa kijeshi unaonyesha vikosi au vituo vya kijeshi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinaweza pia kueleweka “wakileta zawadi”; hapa zawadi hizo ni ushuru uliotolewa kwa mtawala.
    reason: lexical_alternative
  - marker: c
    text: Au, “Yahweh alimwokoa Daudi” au “alimkomboa Daudi”; katika muktadha huu wa vita, “akampa ushindi” huonyesha maana inayokusudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: akaweka vikosi vya kijeshi
  rationale: Kitenzi שׂוּם humaanisha ‘kuweka’; kitu kilichowekwa hakitajwi katika Kiebrania, lakini muktadha wa kijeshi na simulizi sambamba vinaonyesha vikosi au vituo vya kijeshi. Tafsiri hii inaweka wazi maana inayodokezwa bila kuifanya kuwa ngome hasa.
- source_word: בַּאֲרָם דַּרְמֶשֶׂק
  choice: katika Aramu ya Damasko
  rationale: Huhifadhi jina la Kiebrania la eneo au taifa, Aramu, pamoja na uhusiano wake na Damasko, badala ya kulifupisha kuwa Damasko pekee.
- source_word: אֲרָם
  choice: Waaramu
  rationale: Hapa jina Aramu linawarejelea watu waliotiishwa na Daudi. ‘Waaramu’ linaakisi moja kwa moja jina hilo la watu kuliko ‘Wasyria.’
- source_word: עֲבָדִים
  choice: watumishi
  rationale: Neno עֶבֶד linaweza kumaanisha mtumwa, mtumishi, au mtu aliye chini ya mamlaka. Katika muktadha huu wa kisiasa, ‘watumishi’ huhifadhi upana wa neno bila kulazimisha wazo la utumwa wa kumilikiwa.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: wakileta ushuru
  rationale: Katika muktadha wa taifa lililotiishwa, מִנְחָה ni malipo au zawadi ya lazima kwa mtawala mkuu; ‘ushuru’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וַיּוֹשַׁע
  choice: akampa Daudi ushindi
  rationale: Hifili ya יָשַׁע kimsingi ni ‘kuokoa’ au ‘kukomboa,’ lakini katika simulizi la vita inaeleza Yahweh kumpatia Daudi mafanikio ya kijeshi. Maana ya msingi imeonyeshwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limetolewa kama ‘Yahweh,’ si kubadilishwa na cheo.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: kila alikokwenda
  rationale: Ni usemi wa jumla unaohusu mahali pote Daudi alikokwenda; haujabanwa kuwa kuandamana vitani pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya wokovu katika simulizi la vita
  choice: akampa Daudi ushindi
  alternative: alimwokoa Daudi au alimkomboa Daudi
  rationale: Muktadha unaonyesha mafanikio ya kijeshi, lakini uwezekano wa kutafsiri kitenzi kwa maana yake ya moja kwa moja ya kuokoa umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, kimetumiwa. ‘Waaramu’ na ‘Aramu ya Damasko’ huhifadhi majina ya kale bila kutumia jina la baadaye ‘Syria.’ Muundo wa sentensi ni wa simulizi la kihistoria na unaeleweka kwa msomaji wa kawaida.
