translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mtindo wa orodha ya maofisa, lakini inatumia “mkuu wa jeshi” badala ya ufuataji wa neno kwa neno usio wa kawaida. Alama ya tanbihi imewekwa baada ya cheo kinachohusika.
