  yaml_path: translation/ot/1_chronicles/018/015.yaml
  text: And Joab son of Zeruiah was over the army[a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: sw
  text: Naye Yoabu mwana wa Seruya alikuwa mkuu wa jeshi, na Yehoshafati mwana wa Ahiludi alikuwa mwandishi wa kumbukumbu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katibu” au “mweka kumbukumbu”; neno la Kiebrania humaanisha afisa wa kifalme aliyehusika na kutunza kumbukumbu na kuwasilisha mambo kwa mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: Naye Yoabu
  rationale: Kiunganishi וְ kinaendeleza orodha ya maofisa; “Naye” ni njia ya kawaida ya Kiswahili ya kudumisha uhusiano huo. Jina limetoholewa kuwa Yoabu kwa matumizi yaliyozoeleka ya kibiblia.
- source_word: בֶּן צְרוּיָה
  choice: mwana wa Seruya
  rationale: Muundo wa kawaida wa Kiebrania wa kutaja ukoo umetafsiriwa moja kwa moja na kwa Kiswahili cha kawaida.
- source_word: עַל הַצָּבָא
  choice: alikuwa mkuu wa jeshi
  rationale: עַל katika taarifa ya cheo huonyesha mamlaka juu ya jeshi. “Mkuu wa jeshi” ni ya asili na inaeleza wadhifa bila kutumia Kiswahili kisicho cha kawaida cha “juu ya jeshi.”
- source_word: וִ/יהוֹשָׁפָט
  choice: na Yehoshafati
  rationale: “Na” linaendeleza orodha ya maofisa; jina limetoholewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: בֶּן אֲחִילוּד
  choice: mwana wa Ahiludi
  rationale: Utambulisho wa ukoo umetolewa moja kwa moja kwa muundo wa kawaida wa Kiswahili.
- source_word: מַזְכִּיר
  choice: mwandishi wa kumbukumbu
  rationale: Katika mazingira ya utawala wa kifalme, neno hili humaanisha ofisa aliyehusika na kumbukumbu na kuwasilisha mambo kwa mfalme. Tafsiri hii ni wazi kwa msomaji wa sasa huku tanbihi ikihifadhi uwezekano wa majina mengine ya cheo hicho.
