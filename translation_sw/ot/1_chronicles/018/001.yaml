base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/001.yaml
  text: After this[a], David struck the Philistines and subdued them, and he took Gath and its surrounding towns from the hand of the Philistines.
translation:
  language: sw
  text: Baada ya hayo, Daudi aliwapiga Wafilisti na kuwatiisha, akautwaa Gathi pamoja na miji yake ya kandokando[a] kutoka mikononi mwa Wafilisti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “binti zake”; ni nahau inayomaanisha miji midogo au vijiji vilivyokuwa chini ya Gathi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Ni kiunganishi cha simulizi kinachoonyesha mfuatano wa wakati; tafsiri hii ni ya kawaida na ya asili katika Kiswahili bila kuiga kwa ugumu muundo wa Kiebrania wa 'ikawa baada ya hayo.'
- source_word: וַיַּךְ
  choice: akawashambulia
  rationale: Kitenzi נכה katika muktadha wa vita kina maana ya kupiga au kushambulia. 'Akawashambulia' ni ya asili katika Kiswahili na haichanganyi tendo hilo na matokeo yake, ambayo yanaelezwa na kitenzi kinachofuata.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la Kiswahili la kundi hili la watu.
- source_word: וַיַּכְנִיעֵם
  choice: kuwatiisha
  rationale: Hifili ya כנע humaanisha kusababisha mtu ajisalimishe au awe chini ya mamlaka. 'Kuwatiisha' huhifadhi maana ya kijeshi na kisiasa kwa ufupi.
- source_word: וַיִּקַּח
  choice: akautwaa
  rationale: לקח kwa msingi ni 'chukua'; hapa ni kutwaa udhibiti wa eneo. 'Akautwaa' linafaa kwa muktadha wa kijeshi na bado linabaki karibu na maana ya chanzo.
- source_word: גַּת
  choice: Gathi
  rationale: Huu ni uandishi wa kawaida wa jina la mji huu katika mapokeo ya Biblia ya Kiswahili.
- source_word: וּבְנֹתֶיהָ
  choice: miji iliyoizunguka
  rationale: Kwa neno moja ni 'binti zake,' lakini ni nahau ya Kiebrania kwa makazi madogo yaliyo chini ya mji mkuu. Tafsiri hii huwasilisha maana wazi, huku taswira halisi ikihifadhiwa katika tanbihi.
- source_word: מִיַּד
  choice: kutoka mikononi mwa
  rationale: Nahau hii ya Kiebrania huonyesha mamlaka au umiliki. Kiswahili 'kutoka mikononi mwa' kinaeleweka na huhifadhi taswira ya chanzo.
