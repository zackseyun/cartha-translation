base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: sw
  text: Waaramu wa Damasko wakaja kumsaidia Hadadezeri[a], mfalme wa Soba, na Daudi akawapiga watu elfu ishirini na mbili wa Aramu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili limeandikwa “Hadadezeri” hapa; katika baadhi ya vifungu sambamba lina umbo “Hadarezeri.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרַם דַּרְמֶשֶׂק
  choice: Waaramu wa Damasko
  rationale: Hapa אֲרַם inaweza kumaanisha eneo au watu wake. Kwa kuwa kitenzi kiko katika umoja kwa mtindo wa Kiebrania lakini tendo ni la kijeshi, Kiswahili cha asili hutumia jina la watu, “Waaramu wa Damasko,” bila kuingiza jina la baadaye la kisiasa “Syria.”
- source_word: לַעְזוֹר
  choice: kumsaidia
  rationale: Kitenzi עזר humaanisha kusaidia; kiambishi cha nafsi kinamtaja Hadadezeri moja kwa moja na kinafanya sentensi iwe ya kawaida kwa Kiswahili.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezeri
  rationale: Umbo la jina katika mstari huu ni Hadadezer; tahajia ya Kiswahili “Hadadezeri” hurahisisha matamshi na kutofautishwa kwa ngeli, huku lahaja ya Hadarezeri ikielezwa katika tanbihi.
- source_word: מֶלֶךְ צוֹבָה
  choice: mfalme wa Soba
  rationale: Tafsiri ya moja kwa moja inahifadhi cheo cha kifalme na jina la mahali; “Soba” ni uhawilishaji unaofaa wa צוֹבָה kwa tahajia ya Kiswahili.
- source_word: וַיַּךְ
  choice: akawaua
  rationale: Katika muktadha wa vita, נכה inaweza kumaanisha kupiga, kushinda, au kuua. Kwa kuwa idadi inayofuata ni ya watu waliopigwa na masimulizi sambamba yanaonyesha hasara ya maisha, “akawaua” ni Kiswahili cha kawaida na chenye uwazi; maana pana zaidi imehifadhiwa katika tanbihi.
- source_word: בַּאֲרָם
  choice: wa Aramu
  rationale: Nomino ya eneo/watu yenye kihusishi inarejelea Waaramu; baada ya “watu elfu ishirini na mbili,” “wa Aramu” ni muundo wa kawaida wa Kiswahili unaohifadhi utambulisho wao.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: watu elfu ishirini na mbili
  rationale: Hii inawakilisha idadi halisi bila kuongeza “askari” au “wapiganaji,” maneno ambayo hayapo wazi katika Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. “Waaramu” limetumiwa badala ya “Wasyria” ili kuhifadhi maana ya kikabila na kijiografia ya maandishi ya Kiebrania; “Damasko” na “Soba” zimeandikwa kwa namna inayosomeka kwa urahisi katika Kiswahili.
