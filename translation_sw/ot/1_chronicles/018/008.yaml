base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/008.yaml
  text: And from Tibhath and from Cun, cities of Hadadezer, David took a very great amount of bronze; with it Solomon made the bronze sea, the pillars, and the bronze articles.
translation:
  language: sw
  text: Kutoka Tibhathi na Kuni, miji ya Hadadezeri, Daudi alichukua shaba nyingi sana. Kwa shaba hiyo, Solomoni alitengeneza Bahari ya shaba, nguzo na vyombo vya shaba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Katika muktadha huu neno hilo linamaanisha metali iliyotumiwa kutengeneza Bahari, nguzo na vyombo; “shaba” ni neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: יָם הַנְּחֹשֶׁת
  choice: Bahari ya shaba
  rationale: Hili ni jina la beseni kubwa la hekalu; “Bahari” limehifadhiwa kama jina maalumu badala ya kulifafanua kimyakimya.
- source_word: כְּלֵי הַנְּחֹשֶׁת
  choice: vyombo vya shaba
  rationale: “Vyombo” huwasilisha maana pana ya vitu au vifaa vilivyotengenezwa kwa shaba bila kubana aina zake.
- source_word: בָּהּ
  choice: Kwa shaba hiyo
  rationale: Kiwakilishi cha kike cha Kiebrania kinarejelea shaba iliyotajwa; kurudia nomino huondoa utata usio wa lazima katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina ya mahali na watu yametoholewa kuwa Tibhathi, Kuni, Hadadezeri, Daudi na Solomoni. Sentensi mbili zimetumiwa kwa usomaji wa kawaida huku uhusiano wa mawazo wa Kiebrania ukidumishwa.
