  text: גַּם אֹתָ֗/ם הִקְדִּ֞ישׁ הַ/מֶּ֤לֶךְ דָּוִיד֙ לַ/יהוָ֔ה עִם הַ/כֶּ֨סֶף֙ וְ/הַ/זָּהָ֔ב אֲשֶׁ֥ר נָשָׂ֖א מִ/כָּל הַ/גּוֹיִ֑ם מֵֽ/אֱד֤וֹם וּ/מִ/מּוֹאָב֙ וּ/מִ/בְּנֵ֣י עַמּ֔וֹן וּ/מִ/פְּלִשְׁתִּ֖ים וּ/מֵֽ/עֲמָלֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/011.yaml
  text: 'King David also dedicated these to Yahweh[a], along with the silver and the gold that he had taken from all the nations: from Edom, Moab, the Ammonites, the Philistines[c][b], and Amalek.'
translation:
  language: sw
  text: 'Mfalme Daudi pia akaviweka vitu hivyo wakfu kwa Yahweh, pamoja na fedha na dhahabu aliyokuwa amechukua kutoka kwa mataifa yote: Edomu, Moabu, Waamoni[a], Wafilisti, na Amaleki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Amoni,” yaani, Waamoni.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֹתָם
  choice: pia akaviweka vitu hivyo
  rationale: “Pia” linaendeleza wazo la mstari uliotangulia, na “vitu hivyo” linaonyesha wazi kuwa kiwakilishi kinarejelea vitu vya shaba vilivyotajwa huko.
- source_word: הִקְדִּישׁ
  choice: akaviweka ... wakfu
  rationale: Ni usemi wa kawaida na wenye heshima unaodumisha maana ya kutenga vitu kwa matumizi au milki takatifu.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Linahifadhi jina la agano יהוה kama jina binafsi badala ya kulibadili kuwa cheo.
- source_word: עִם הַכֶּסֶף וְהַזָּהָב
  choice: pamoja na fedha na dhahabu
  rationale: Linaonyesha kwamba vitu vilivyotajwa vilitengwa wakfu pamoja na fedha na dhahabu.
- source_word: אֲשֶׁר נָשָׂא
  choice: aliyokuwa amechukua
  rationale: Katika muktadha huu נשא lina maana ya kuchukua mali kutoka kwa mataifa yaliyoshindwa; “amechukua” ni la asili na halibainishi bila lazima kama ilikuwa nyara au ushuru.
- source_word: מִכָּל הַגּוֹיִם
  choice: kutoka kwa mataifa yote
  rationale: “Mataifa” linafaa kwa muktadha wa kisiasa na kijeshi wa watu wa nchi jirani.
- source_word: מִבְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Hili ni jina la kawaida la Kiswahili kwa maana ya nahau ya Kiebrania “wana wa Amoni.”
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandiko ya Kiebrania yana jina binafsi la Mungu; “Yahweh” linahifadhi jina hilo bila kuligeuza kuwa cheo.
- issue: Maana ya kuweka vitu wakfu
  choice: akaviweka vitu hivyo wakfu kwa Yahweh
  alternative: akavifanya vitu hivyo kuwa vitakatifu
  rationale: “Kuweka wakfu” hudumisha tendo la kuvitenga kwa Mungu bila kudokeza kwamba asili ya vitu yenyewe ilibadilishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kusomeka. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
