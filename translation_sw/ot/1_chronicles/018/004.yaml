  text: וַ/יִּלְכֹּד֩ דָּוִ֨יד מִמֶּ֜/נּוּ אֶ֣לֶף רֶ֗כֶב וְ/שִׁבְעַ֤ת אֲלָפִים֙ פָּֽרָשִׁ֔ים וְ/עֶשְׂרִ֥ים אֶ֖לֶף אִ֣ישׁ רַגְלִ֑י וַ/יְעַקֵּ֤ר דָּוִיד֙ אֶת כָּל הָ/רֶ֔כֶב וַ/יּוֹתֵ֥ר מִמֶּ֖/נּוּ מֵ֥אָה רָֽכֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/004.yaml
  text: David captured from him 1,000 chariots, 7,000 horsemen, and 20,000 foot soldiers. Then David hamstrung all the chariot horses, but left from them enough for 100 chariots.
translation:
  language: sw
  text: Daudi akateka magari ya vita 1,000, wapanda farasi 7,000[a], na askari wa miguu 20,000 kutoka kwake. Kisha Daudi akawakata farasi wote wa magari ya vita kano za miguu ya nyuma[b], lakini akabakiza farasi wa kutosha kwa magari 100.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika 2 Samweli 8:4 kuna “wapanda farasi 1,700” badala ya “wapanda farasi 7,000.” Hii ni tofauti ya idadi katika mapokeo ya maandishi ya vifungu sambamba.
    reason: textual_variant
  - marker: b
    text: Kwa Kiebrania, “magari yote” au “kikosi chote cha magari.” Kwa kuwa kitenzi kinamaanisha kukata kano, kirai hicho kinaeleweka hapa kuwa kinawarejelea farasi wa kikosi cha magari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: akateka
  rationale: Kitenzi לכד katika muktadha wa vita humaanisha kukamata au kutwaa; “akateka” ni usemi wa kawaida na wenye maana sahihi katika Kiswahili.
- source_word: מִמֶּנּוּ
  choice: kutoka kwake
  rationale: Kiambishi cha Kiebrania ni cha umoja na kinamrejelea Hadadezeri katika muktadha uliotangulia; tafsiri inadumisha umoja huo.
- source_word: אֶלֶף רֶכֶב
  choice: magari 1,000
  rationale: רכב inaweza kumaanisha jeshi la magari kwa ujumla, lakini ikiwa na idadi hapa inaeleweka kwa kawaida kuwa magari ya vita yanayohesabika.
- source_word: פָּרָשִׁים
  choice: wapanda farasi
  rationale: Neno hili linamaanisha wapiganaji waliopanda farasi; “wapanda farasi” ni la moja kwa moja na linaeleweka kwa urahisi.
- source_word: אִישׁ רַגְלִי
  choice: askari wa miguu
  rationale: Kirai hiki ni halisi, “watu wa miguu,” na katika muktadha wa kijeshi humaanisha askari wanaopigana kwa miguu.
- source_word: וַיְעַקֵּר
  choice: akakata kano za miguu
  rationale: Katika muktadha huu עקר humaanisha kuwafanya farasi wasiweze kutumika kwa kukata kano zao; tafsiri hii inaeleza tendo hilo kwa Kiswahili cha kawaida bila kutumia istilahi isiyoeleweka.
- source_word: אֶת כָּל הָרֶכֶב
  choice: farasi wote wa magari
  rationale: Ingawa רכב kwa kawaida ni “magari” au kikosi cha magari, tendo la kukata kano linawahusu farasi wa magari. Tafsiri inaonyesha matumizi haya ya kimajazi huku tanbihi ikihifadhi umbo la Kiebrania.
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: lakini akabakiza farasi wa kutosha kwa magari 100
  rationale: Kifungu kinaonyesha kwamba Daudi aliacha bila kuwakata kano farasi waliohitajika kwa magari mia moja; kutaja “farasi wa kutosha” kunafanya rejeo lililodokezwa lieleweke.
theological_decisions:
- issue: Tofauti ya idadi kati ya 1 Mambo ya Nyakati 18:4 na kifungu sambamba cha 2 Samweli 8:4
  choice: 'Kufuata maandishi ya WLC hapa: wapanda farasi 7,000, na kutaja tofauti hiyo katika tanbihi'
  alternative: Kusawazisha idadi na 2 Samweli 8:4 kuwa 1,700
  rationale: Ushahidi wa chanzo uliotolewa kwa mstari huu unasema 7,000. Kusawazisha kimya kimya kungeficha tofauti halisi iliyopo katika mapokeo ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Magari” linaeleweka kutokana na muktadha kuwa magari ya vita; “askari wa miguu” na “wapanda farasi” ni misemo ya kawaida isiyo ya kitaalamu kupita kiasi.
