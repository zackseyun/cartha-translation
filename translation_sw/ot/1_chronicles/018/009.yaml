base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/009.yaml
  text: When Tou king of Hamath heard that David had struck down all the army of Hadadezer king of Zobah,[a]
translation:
  language: sw
  text: Tou, mfalme wa Hamathi, aliposikia kwamba Daudi alikuwa amelishinda jeshi lote la Hadadezeri, mfalme wa Soba,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina “Tou”; simulizi sambamba katika 2 Samweli 8:9 lina “Toi.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: aliposikia
  rationale: Waw-consecutive inaendeleza simulizi, na hapa kishazi hiki kinaweka msingi wa tendo linalofuata katika mstari unaofuata; “aliposikia” ni ya asili katika Kiswahili.
- source_word: תֹּעוּ
  choice: Tou
  rationale: Jina la mtu limenukuliwa kwa kufuata umbo la Kiebrania katika Mambo ya Nyakati.
- source_word: מֶלֶךְ חֲמָת
  choice: mfalme wa Hamathi
  rationale: Muundo huu wa nomino unaonyesha cheo cha Tou na eneo alilotawala.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linaanzisha habari aliyosikia Tou.
- source_word: הִכָּה
  choice: alikuwa amelishinda
  rationale: Katika muktadha wa kijeshi, נכה huonyesha kupiga na kulishinda jeshi; “amelishinda” ni Kiswahili cha kawaida kinachowasilisha matokeo ya mapambano bila kudai kwamba kila askari aliuawa.
- source_word: כָּל
  choice: lote
  rationale: Kiwakilishi hiki kinahifadhi kwa wazi maana ya ujumla iliyomo katika Kiebrania.
- source_word: חֵיל
  choice: jeshi
  rationale: Katika muktadha huu חֵיל inamaanisha majeshi au kikosi cha kijeshi, si mali au nguvu kwa ujumla.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezeri
  rationale: Jina limenukuliwa kutoka umbo la Kiebrania la Mambo ya Nyakati na kupewa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: מֶלֶךְ צוֹבָה
  choice: mfalme wa Soba
  rationale: Tafsiri ya moja kwa moja ya cheo pamoja na jina la mahali, kwa tahajia inayofaa Kiswahili.
