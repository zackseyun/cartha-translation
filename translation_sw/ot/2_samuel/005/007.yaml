  yaml_path: translation/ot/2_samuel/005/007.yaml
  text: But David captured the stronghold of Zion[a], that is, the City of David.
translation:
  language: sw
  text: Lakini Daudi akauteka ngome ya Sayuni[a], yaani, Mji wa Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “boma la Sayuni.” Neno la Kiebrania linamaanisha mahali imara palipoimarishwa kwa ajili ya ulinzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: akauteka
  rationale: Kitenzi לכד katika muktadha wa kijeshi humaanisha kuteka au kuutwaa mahali kwa nguvu. “Akauteka” ni Kiswahili cha kawaida na sahihi kwa simulizi hili; kiambishi -ka- pia kinaendeleza mfuatano wa matukio.
- source_word: וַ
  choice: Lakini
  rationale: Ingawa waw inaweza kuendeleza simulizi kwa “na/kisha,” hapa inaonyesha utofauti mdogo na majivuno ya Wayebusi katika mstari uliotangulia. “Lakini” huwasilisha uhusiano huo wa kimuktadha kwa kawaida.
- source_word: מְצֻדַת
  choice: ngome
  rationale: Nomino מצודה humaanisha mahali imara palipojengwa au kuandaliwa kwa ulinzi. “Ngome” ni neno la kawaida la Kiswahili linalohifadhi maana ya kijeshi bila kubainisha kupita kiasi aina ya jengo.
- source_word: צִיּוֹן
  choice: Sayuni
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: הִיא
  choice: yaani
  rationale: Kiwakilishi hiki kina kazi ya ufafanuzi hapa, kikitambulisha ngome ya Sayuni kuwa Mji wa Daudi. “Yaani” huonyesha uhusiano huo wa maelezo kwa Kiswahili cha kawaida.
- source_word: עִיר דָּוִד
  choice: Mji wa Daudi
  rationale: Muundo huu unahifadhi uhusiano wa Kiebrania wa jina na ni jina la mahali linaloeleweka kwa urahisi katika Kiswahili.
