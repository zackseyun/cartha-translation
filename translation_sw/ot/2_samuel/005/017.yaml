base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/017.yaml
  text: When the Philistines heard that they had anointed David king over Israel[a], all the Philistines went up to seek David. When David heard of it, he went down to the stronghold.
translation:
  language: sw
  text: Wafilisti waliposikia kwamba Daudi alikuwa ametiwa mafuta kuwa mfalme juu ya Israeli, Wafilisti wote wakapanda kumtafuta Daudi. Daudi aliposikia jambo hilo, akashuka kwenda ngomeni[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pa kujihami.” Neno la Kiebrania humaanisha mahali palipoimarishwa kwa ulinzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Jina la kawaida la kundi hili la watu katika Kiswahili cha Biblia.
- source_word: כִּי
  choice: kwamba
  rationale: Hutambulisha habari waliyoisikia Wafilisti, yaani, kutiwa mafuta kwa Daudi.
- source_word: מָשְׁחוּ
  choice: alikuwa ametiwa mafuta
  rationale: Kauli tendwa ni ya asili zaidi kwa Kiswahili hapa kwa kuwa mtendaji wa wingi hakutajwa wazi katika mstari; wakati uliotangulia unaonyesha kwamba tendo hilo lilitokea kabla ya Wafilisti kusikia habari.
- source_word: לְמֶלֶךְ
  choice: kuwa mfalme
  rationale: Hueleza wazi cheo ambacho Daudi aliwekwa baada ya kutiwa mafuta.
- source_word: עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: Inahifadhi wazo la mamlaka ya kifalme juu ya Israeli bila kulipanua.
- source_word: וַיַּעֲלוּ
  choice: wakapanda
  rationale: Inahifadhi maana ya kijiografia ya kwenda juu iliyo katika kitenzi cha Kiebrania, bila kuongeza wazo lisilotajwa la kuandamana kijeshi.
- source_word: כָל פְּלִשְׁתִּים
  choice: Wafilisti wote
  rationale: Inadumisha msisitizo wa כָל kwamba Wafilisti walijitokeza kwa ujumla wao.
- source_word: לְבַקֵּשׁ אֶת דָּוִד
  choice: kumtafuta Daudi
  rationale: Kitenzi hiki kinaweza kumaanisha kutafuta kwa nia mbalimbali; tafsiri hii haiongezi kwa uwazi nia ya kumkamata au kumuua, ingawa muktadha unaonyesha uhasama.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: Daudi aliposikia jambo hilo
  rationale: ‘Jambo hilo’ hutaja kwa kawaida habari iliyodokezwa na muktadha, huku muundo wa ‘aliposikia’ ukiendeleza mfululizo wa simulizi.
- source_word: וַיֵּרֶד
  choice: akashuka
  rationale: Inahifadhi maana ya msingi ya kushuka na mtiririko wa simulizi.
- source_word: הַמְּצוּדָה
  choice: ngomeni
  rationale: Neno hili hutaja mahali palipoimarishwa kwa ulinzi; ‘ngome’ ni neno la kawaida, fupi na linaloeleweka katika Kiswahili sanifu.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kauli tendwa katika sentensi ya kwanza unaepusha kuongeza mtendaji ambaye maandishi ya mstari hayamtaji wazi. Alama ya tanbihi imewekwa baada ya ‘ngomeni,’ ambako mbadala wake wa kileksika unahusika.
