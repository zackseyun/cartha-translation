- source_word: יִבְחָר
  choice: Yibhari
  rationale: Ni jina la mtu; limetoholewa kwa tahajia inayofaa Kiswahili, huku sauti ya yod ya mwanzo na konsonanti kuu za Kiebrania zikihifadhiwa.
- source_word: אֱלִישׁוּעַ
