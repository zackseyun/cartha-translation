  rationale: Ni jina la mtu; limetoholewa kwa namna iliyo wazi na ya kawaida katika Kiswahili, bila kujaribu kuwakilisha ayin ya mwisho kwa alama isiyo ya kawaida.
- source_word: נֶפֶג
  choice: Nefegi
  rationale: Ni jina la mtu; vokali ya mwisho imeongezwa ili jina lisomeke kwa urahisi katika mfumo wa sauti wa Kiswahili.
- source_word: יָפִיעַ
  choice: Yafia
  rationale: Ni jina la mtu; Y ya mwanzo inawakilisha yod ya Kiebrania, na umbo lote linasomeka kwa kawaida katika Kiswahili.
- source_word: וְ
  choice: na
  rationale: Kiunganishi hiki kimerudiwa kabla ya kila jina katika Kiebrania. Kurudia “na” pia ni kwa kawaida na kunaeleweka katika orodha ya Kiswahili, hivyo muundo wa chanzo umehifadhiwa.
