base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/019.yaml
  text: And David inquired of Yahweh[a], saying, “Should I go up against the Philistines? Will you give them into my hand?” And Yahweh said to David, “Go up, for I will certainly give the Philistines into your hand.”
translation:
  language: sw
  text: Daudi akamwuliza Yahweh, akisema, “Je, nipande dhidi ya Wafilisti? Je, utawatia mikononi mwangu[a]?” Yahweh akamwambia Daudi, “Panda, kwa maana hakika nitawatia Wafilisti mikononi mwako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, utawakabidhi mikononi mwangu?” Nahau ya Kiebrania “kutia mikononi” kwa kawaida humaanisha kumpa mtu ushindi juu ya adui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: akamwuliza
  rationale: Katika muktadha huu kitenzi שׁאל kinaonyesha Daudi alitafuta mwongozo wa Mungu. ‘Akamwuliza’ ni Kiswahili cha kawaida na hakiongezi njia maalumu ya kiibada ambayo maandishi hayaitaji.
- source_word: בַּיהוָה / יְהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetolewa kama ‘Yahweh,’ kwa kufuata ushahidi wa maandishi na kulihifadhi kama jina maalumu.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Infinitivi hii inaanzisha maneno yenyewe ya swali la Daudi; ‘akisema’ huhifadhi muundo wa simulizi wa Kiebrania kwa Kiswahili cha asili.
- source_word: הַאֶעֱלֶה
  choice: Je, nipande
  rationale: עלה ni ‘kupanda’ au ‘kwenda juu’; hapa lina nguvu ya swali la kutafuta ruhusa au mwongozo kabla ya hatua ya kijeshi. ‘Je, nipande’ huhifadhi taswira na hali ya kuuliza.
- source_word: אֶל פְּלִשְׁתִּים
  choice: dhidi ya Wafilisti
  rationale: Ingawa אֶל kwa kawaida ni ‘kwa/kuelekea,’ muktadha wa kijeshi unaonyesha mwendo wa kuwashambulia adui; ‘dhidi ya’ huwasilisha maana hiyo wazi.
- source_word: הֲתִתְּנֵם ... בְּיָדִי
  choice: Je, utawatia mkononi mwangu?
  rationale: Nahau ya Kiebrania ‘kutia/kutoa mkononi’ ina maana ya kumweka adui chini ya mamlaka ya mwingine na kumpa ushindi. Muundo wa mkono umehifadhiwa kwa kuwa unaeleweka na unaendeleza taswira ya chanzo.
- source_word: עֲלֵה
  choice: Panda
  rationale: Amri inarudia mzizi עלה uliotumiwa katika swali la Daudi. ‘Panda’ huhifadhi urudiaji huo bila kuongeza kwa uwazi ‘shambulia.’
- source_word: כִּי נָתוֹן אֶתֵּן
  choice: kwa maana hakika nitawatia
  rationale: Infinitivi halisi pamoja na kitenzi chenye ukanushaji wa baadaye hutilia mkazo uhakika. ‘Hakika nitawatia’ huonyesha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: בְּיָדֶךָ
  choice: mkononi mwako
  rationale: Nahau ileile ya ushindi imetafsiriwa kwa uthabiti ili kudumisha ulinganifu kati ya swali la Daudi na jibu la Yahweh.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yanatumia Tetragramatoni kama jina maalumu. ‘Yahweh’ hulihifadhi wazi badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu fulani.
- issue: Asili ya ushindi dhidi ya Wafilisti
  choice: Yahweh ndiye atakayewatia Wafilisti mkononi mwa Daudi
  alternative: Daudi atawashinda Wafilisti kwa uwezo wake
  rationale: Muundo wa נתן ... ביד unaweka wazi kuwa ushindi unaahidiwa na kutolewa na Yahweh; tafsiri inadumisha msisitizo huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘kupanda’ na taswira ya ‘mkono’ zimehifadhiwa kwa sababu ni muhimu katika urudiaji wa Kiebrania, huku ‘dhidi ya’ ikifanya muktadha wa kijeshi uwe wazi. Alama ya tanbihi [a] imewekwa baada ya ‘Yahweh’ kama ilivyo katika safu ya ushauri ya Kiingereza, ingawa yaliyomo kwenye tanbihi yanafafanua nahau ya baadaye katika sentensi.
