  yaml_path: translation/ot/2_samuel/005/023.yaml
  text: So David inquired of Yahweh[a], and he said, “You shall not go up; circle around behind them, and come against them opposite the balsam trees.”
translation:
  language: sw
  text: Basi Daudi akamwuliza Yahweh, naye akasema, “Usipande; zunguka uende nyuma yao, kisha uwajie mkabala wa miti ya zeri[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miti ya baka”; kwa mapokeo, “miti ya mulberry.” Aina kamili ya miti inayomaanishwa na neno la Kiebrania haijulikani kwa hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: akamwuliza Yahweh
  rationale: Muundo huu unaonyesha Daudi akitafuta mwongozo wa Mungu. ‘Akamwuliza’ ni wa kawaida na unaeleweka, huku muktadha ukionyesha kuwa hili ni tendo la kutaka uongozi wa Mungu.
- source_word: לֹא תַעֲלֶה
  choice: Usipande
  rationale: Huhifadhi kitenzi cha Kiebrania עלה, ambacho katika muktadha wa kijeshi kinaweza kumaanisha kupanda au kusonga mbele kwenda kushambulia, bila kuondoa utata huo.
- source_word: הָסֵב אֶל אַחֲרֵיהֶם
  choice: zunguka uende nyuma yao
  rationale: Hueleza kwa Kiswahili cha kawaida ujanja wa kijeshi wa kuzunguka mpaka upande wa nyuma wa adui.
- source_word: וּבָאתָ לָהֶם
  choice: kisha uwajie
  rationale: Kitenzi בוא pamoja na ל katika muktadha huu kinaonyesha kuwaendea kwa nia ya kupambana nao. ‘Uwajie’ huhifadhi kwa kiasi kikubwa namna ya usemi wa chanzo bila kufafanua kupita kiasi.
- source_word: מִמּוּל
  choice: kutoka upande unaoelekeana na
  rationale: Huhifadhi maana ya mahali palipo mkabala au panapotazamana na kitu kingine.
- source_word: בְּכָאִים
  choice: miti ya zeri
  rationale: ‘Miti ya zeri’ ni utambulisho unaokubalika wa mmea huu, lakini aina kamili ya miti inayomaanishwa na neno la Kiebrania haijulikani kwa hakika; kwa hiyo maelezo ya chini yanahifadhi uwezekano mwingine.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi ni rahisi kueleweka lakini unahifadhi lugha ya mwendo wa kijeshi na kutokuwa na uhakika kuhusu aina ya miti. Alama ya tanbihi imewekwa baada ya ‘miti ya zeri,’ ambako maelezo yake yanahusika.
