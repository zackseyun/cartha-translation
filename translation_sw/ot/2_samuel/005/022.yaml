lexical_decisions:
- source_word: וַיֹּסִפוּ עוֹד ... לַעֲלוֹת
  choice: wakaja tena
  rationale: Muundo wa יסף pamoja na עוֹד na kitenzi-jina לעלות unaonyesha kurudiwa kwa tendo la kupanda au kusonga kwenda juu. ‘Wakaja tena’ ni Kiswahili cha kawaida kinachohifadhi mtazamo wa simulizi.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili cha Biblia.
- source_word: וַיִּנָּטְשׁוּ
  choice: na kujipanga
  rationale: Katika muktadha huu wa kijeshi, kitenzi kinaelekea kueleza askari wakitawanyika kwa mpangilio au wakichukua nafasi katika eneo, si kuacha kitu. ‘Kujipanga’ ni wazi na ya asili, huku tanbihi ikihifadhi uwezekano mwingine wa kileksia.
- source_word: בְּעֵמֶק רְפָאִים
  choice: katika Bonde la Warefai
  rationale: בְּ inaonyesha mahali, עֵמֶק ni ‘bonde,’ na רְפָאִים ni jina linalohamishwa kwa umbo la Kiswahili ‘Warefai.’ Herufi kubwa inaonyesha jina maalumu la mahali.
