  footnotes:
  - marker: a
    text: Au “wakajitawanya” au “wakavamia na kuenea.” Huenda kitenzi cha Kiebrania kinaeleza Wafilisti wakijieneza au wakichukua nafasi zao sehemu mbalimbali za bonde.
