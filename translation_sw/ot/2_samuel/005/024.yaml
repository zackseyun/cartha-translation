  terminology: “Miti ya zeri” inaweza kubaki kama uamuzi wa leksia, mradi tanbihi ieleze wazi kwamba utambulisho wa mmea hauna uhakika. ‘Mikuyu’ haifai kama kielelezo cha tafsiri ya kale ya ‘mulberry,’ kwa kuwa mikuyu kwa kawaida hurejelea mtini/fig tree, si mulberry.
