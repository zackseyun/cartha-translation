base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/024.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then act decisively, for then Yahweh has gone out before you to strike down the camp of the Philistines.
translation:
  language: sw
  text: Na utakaposikia sauti ya hatua katika vilele vya miti ya zeri[a], ndipo uchukue hatua kwa uthabiti, kwa maana wakati huo Yahwe atakuwa amekwisha kwenda mbele yako ili kuipiga kambi ya Wafilisti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miti ya baka.” Aina hasa ya mti unaotajwa na neno la Kiebrania haijulikani kwa uhakika; tafsiri za kale za Kiingereza mara nyingi husema “miti ya mulberry.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי בְשָׁמְעֲךָ
  choice: Na utakaposikia
  rationale: 'Muundo wa waw pamoja na היה na kitenzi-jina chenye kiambishi cha nafsi unaweka hali ya wakati ujao: ‘utakaposikia.’'
- source_word: קוֹל צְעָדָה
  choice: sauti ya hatua za jeshi
  rationale: צְעָדָה humaanisha hatua au mwendo wa kuandamana; nyongeza ‘za jeshi’ huonyesha muktadha wa kijeshi bila kudai kwamba neno lenyewe linataja jeshi moja kwa moja.
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: katika vilele vya miti ya zeri
  rationale: רָאשֵׁי ni ‘vilele’; utambulisho kamili wa miti הַבְּכָאִים hauna uhakika, lakini ‘miti ya zeri’ ni ulinganifu unaokubalika, huku tanbihi ikihifadhi kutokuwa na uhakika.
- source_word: אָז תֶּחֱרָץ
  choice: ndipo uchukue hatua kwa uthabiti
  rationale: חרץ hapa hudokeza kutenda kwa nguvu, haraka na uamuzi; Kiswahili hiki huhifadhi wito wa tendo thabiti bila kuufanya uwe kasi peke yake.
- source_word: כִּי אָז
  choice: kwa maana wakati huo
  rationale: כִּי inatoa sababu ya agizo, na אָז inaelekeza kwenye wakati wa ishara hiyo.
- source_word: יָצָא יְהוָה לְפָנֶיךָ
  choice: Yahwe atakuwa ametoka akutangulie
  rationale: Kauli timilifu ya Kiebrania, ndani ya hali ya wakati ujao, inaonyesha tendo litakalokuwa tayari limeanza David atakaposikia ishara; לְפָנֶיךָ ni kwenda mbele yake vitani.
- source_word: לְהַכּוֹת בְּמַחֲנֵה פְלִשְׁתִּים
  choice: ili kulishambulia jeshi la Wafilisti
  rationale: נכה ni kupiga au kushambulia katika vita. מַחֲנֶה kimsingi ni kambi, lakini hapa kwa metonimia ni jeshi lililopiga kambi; ‘jeshi’ ni ya kawaida na wazi katika Kiswahili.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza tafsiri ya kidhehebu.
- issue: Wakati wa tendo la Yahwe kwenda mbele ya Daudi
  choice: atakuwa ametoka akutangulie
  alternative: ametoka mbele yako; atatoka akutangulie
  rationale: Timilifu יָצָא iko katika hali inayotazamia wakati Daudi atakaposikia sauti. Wakati timilifu wa baadaye huhifadhi kwamba kwenda kwa Yahwe kutakuwa tayari kumeanza wakati ishara itakaposikika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inahifadhi mpangilio wa ishara, agizo, na sababu. ‘Hatua za jeshi’ inaeleweka kwa wasomaji wa kawaida; ‘uchukue hatua kwa uthabiti’ hudumisha nguvu ya agizo bila kuwa ya kizamani.
