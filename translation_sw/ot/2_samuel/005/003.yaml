base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and King David made a covenant with them at Hebron before Yahweh[b], and they anointed David king over Israel.
translation:
  language: sw
  text: Basi wazee wote wa Israeli wakamjia mfalme huko Hebroni, naye Mfalme Daudi akafanya agano nao[a] huko Hebroni mbele za Yahweh[b]; wakamtia Daudi mafuta awe mfalme juu ya Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hasa, “alikata agano”; hii ni nahau yenye maana ya “alifanya agano.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika uwepo wa Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: wakamjia
  rationale: Kitenzi בוא katika mfuatano wa simulizi kinaonyesha kuja; kiambishi cha mtendewa katika “wakamjia” kinaeleza kwa kawaida kwamba walikuja kwa mfalme.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: wazee wote wa Israeli
  rationale: Huhifadhi ukamilifu wa כָּל na maana ya זקנים kama viongozi wa jamii, si wazee kwa umri tu.
- source_word: אֶל הַמֶּלֶךְ חֶבְרוֹנָה
  choice: wakamjia mfalme huko Hebroni
  rationale: Kiishio cha mwelekeo katika חֶבְרוֹנָה kinaonyesha mwendo kuelekea Hebroni; Kiswahili hiki huonyesha kwa kawaida kwamba mfalme alikuwa huko.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: akafanya agano
  rationale: Nahau ya Kiebrania ina maana halisi ya ‘kukata agano’; ‘kufanya agano’ ni Kiswahili cha kawaida kinachohifadhi uzito wa tendo hilo.
- source_word: לָהֶם
  choice: nao
  rationale: Katika muundo wa כרת ברית, uhusiano unaokusudiwa ni kufanya agano pamoja nao.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Huhifadhi wazo la tendo kufanywa mbele ya Mungu kama shahidi katika mazingira rasmi ya agano.
- source_word: וַיִּמְשְׁחוּ
  choice: wakamtia ... mafuta
  rationale: משׁח katika muktadha wa kifalme ni tendo maalumu la kumtia mtu mafuta ili kumweka rasmi kuwa mfalme.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: awe mfalme juu ya Israeli
  rationale: Hueleza wazi kuwekwa kwake katika ufalme na mamlaka yake juu ya Israeli.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Mfalme Daudi
  rationale: Muundo wa cheo na jina ni wa kawaida na wa heshima katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: ‘Yahweh’ hulitambulisha jina binafsi la Mungu katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- issue: Lugha ya agano katika בְּרִית
  choice: agano
  alternative: makubaliano
  rationale: ‘Agano’ huhifadhi uzito wa kidini, rasmi na kisiasa wa neno katika muktadha wa kumweka Daudi kuwa mfalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wa heshima. ‘Hebroni’ ni umbo lililozoeleka katika Kiswahili cha Biblia; ‘wakamtia mafuta’ linaepuka maana pana ya ‘kumweka wakfu’ na kuhifadhi tendo halisi la kifalme.
