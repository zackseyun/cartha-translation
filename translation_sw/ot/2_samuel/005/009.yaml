translation:
  language: sw
  text: Basi Daudi akaishi katika ngome hiyo, akaiita Jiji la Daudi. Daudi akajenga pande zote, kuanzia Milo kuelekea ndani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuanzia Milo na kuelekea ndani,” au “kuanzia Milo kuelekea sehemu ya ndani.” “Milo” huenda lilikuwa jina la muundo fulani uliojulikana au matuta yaliyojazwa udongo katika Yerusalemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: akaishi
  rationale: Kitenzi ישב hapa kinaonyesha Daudi kukaa na kufanya ngome hiyo makao yake; “akaishi” ni Kiswahili cha kawaida na cha asili katika simulizi.
- source_word: בַּמְּצֻדָה
  choice: katika ngome hiyo
  rationale: מְצֻדָה ni mahali palipoimarishwa kwa ulinzi. “Ngome” huhifadhi maana ya kijeshi, na “hiyo” hurejelea ngome iliyotajwa katika muktadha uliotangulia.
- source_word: וַיִּקְרָא לָהּ
  choice: akaiita
  rationale: Muundo קרא + ל unaonyesha kuita au kupatia jina; “akaiita” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: עִיר דָּוִד
  choice: Jiji la Daudi
  rationale: Hili ni jina maalumu la mahali. “Jiji la Daudi” ni wazi na linaendana na matumizi ya kawaida ya Kiswahili.
- source_word: וַיִּבֶן
  choice: akajenga
  rationale: בנה kimsingi humaanisha kujenga. Tafsiri hii haiongezi dhana zisizotajwa wazi, kama kuimarisha au kujenga upya.
- source_word: סָבִיב
  choice: pande zote
  rationale: סָבִיב huonyesha eneo linalozunguka; “pande zote” hutoa maana hiyo kwa Kiswahili cha asili.
- source_word: מִן הַמִּלּוֹא
  choice: kuanzia Milo
  rationale: מִלּוֹא huenda ni jina au istilahi maalumu ya muundo wa Yerusalemu. Kwa kuwa kitu kinachorejelewa hakijulikani kwa hakika, jina “Milo” limehifadhiwa badala ya kufafanuliwa kwa kubahatisha.
- source_word: וָבָיְתָה
  choice: kuelekea ndani
  rationale: Umbo hili linaonyesha mwelekeo wa kwenda upande wa ndani. “Kuelekea ndani” huhifadhi maana inayowezekana ya mahali bila kuamua kwamba מדובר ni jengo moja mahususi.
