base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/025.yaml
  text: And David did so[a], just as Yahweh had commanded him[b], and he struck down the Philistines from Geba as far as Gezer.
translation:
  language: sw
  text: Daudi akafanya hivyo, kama vile Yahwe alivyomwamuru, naye akawapiga Wafilisti kutoka Geba[a] mpaka kufikia Gezeri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka Geba.” Baadhi ya tafsiri zina jina tofauti hapa kwa kuzingatia tofauti za maandishi au simulizi sambamba.'
    reason: textual_variant
  - marker: b
    text: Kwa uhalisi, “hadi kufika kwako Gezeri,” yaani, hadi eneo la kuikaribia Gezeri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כֵּן
  choice: akafanya hivyo
  rationale: Muundo huu wa kawaida unarejelea maagizo yaliyotangulia na kuhifadhi ufupi wa simulizi la Kiebrania.
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: kama vile ... alivyomwamuru
  rationale: Tafsiri hii inaonyesha kwamba Daudi alitenda sawasawa na agizo alilopewa, bila kuongeza maelezo yasiyokuwamo katika maandishi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limeandikwa kwa namna inayotumika na kueleweka katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: וַיַּךְ
  choice: akawapiga
  rationale: Katika muktadha wa vita, kitenzi hiki huonyesha kuwapiga adui kwa nguvu. ‘Akawapiga’ kinahifadhi picha ya kijeshi bila kulazimisha maana finyu zaidi kama kuwaua wote.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la watu hao katika Kiswahili cha Biblia.
- source_word: מִגֶּבַע
  choice: kutoka Geba
  rationale: Maandishi ya Kimasora yanasoma Geba; jina hilo limehifadhiwa badala ya kusawazishwa na simulizi sambamba.
- source_word: עַד בֹּאֲכָה גָזֶר
  choice: hadi njia ya kuingia Gezeri
  rationale: Kirai hiki kwa uhalisi husema ‘hadi kufika kwako Gezeri’ na huonyesha njia ya kuikaribia au kuingia mahali hapo. Tafsiri hii inahifadhi picha hiyo ya kijiografia.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: ‘Yahwe’ linahifadhi jina binafsi lililo katika chanzo badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu fulani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo ni wa simulizi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
