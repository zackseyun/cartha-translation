  text: וְ/אֵ֗לֶּה שְׁמ֛וֹת הַ/יִּלֹּדִ֥ים ל֖/וֹ בִּ/ירוּשָׁלִָ֑ם שַׁמּ֣וּעַ וְ/שׁוֹבָ֔ב וְ/נָתָ֖ן וּ/שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/014.yaml
  text: 'These are the names of those born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
translation:
  language: sw
  text: 'Haya ndiyo majina ya wale waliozaliwa kwake huko Yerusalemu: Shamua[a], Shobabu, Nathani, na Sulemani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto waliozaliwa kwake huko Yerusalemu.” Neno la Kiebrania linamaanisha kihalisi “wale waliozaliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Haya ndiyo
  rationale: Muundo huu unatambulisha orodha kwa Kiswahili cha kawaida; kiunganishi cha Kiebrania hakihitaji kutafsiriwa moja kwa moja hapa.
- source_word: שְׁמוֹת
  choice: majina
  rationale: Ni wingi wa neno 'jina' katika hali ya kutegemezwa, ukitanguliza orodha inayofuata.
- source_word: הַיִּלֹּדִים
  choice: wale waliozaliwa
  rationale: Huhifadhi maana ya kirai cha Kiebrania cha kitenzi katika hali ya kutendwa, 'wale waliozaliwa,' bila kuongeza 'wana' au 'watoto' katika matini kuu.
- source_word: לוֹ
  choice: kwake
  rationale: Katika muktadha wa nasaba, huonyesha kwamba hao walizaliwa wakiwa watoto wake; 'waliozaliwa kwake' ni Kiswahili cha kawaida.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: Huonyesha mahali walipozaliwa; 'huko' hufanya sentensi isikike ya kawaida baada ya 'kwake'.
- source_word: שַׁמּוּעַ
  choice: Shamua
  rationale: Jina limetoholewa kwa kuzingatia umbo la Kiebrania na tahajia inayoweza kusomeka kwa Kiswahili.
- source_word: שׁוֹבָב
  choice: Shobabu
  rationale: Jina limetoholewa kwa namna inayofaa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: נָתָן
  choice: Nathani
  rationale: Hili ndilo umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: שְׁלֹמֹה
  choice: Sulemani
  rationale: Hili ndilo umbo la jina lililozoeleka katika Kiswahili cha Biblia.
