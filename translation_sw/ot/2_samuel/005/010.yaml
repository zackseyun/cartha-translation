  text: וַ/יֵּ֥לֶךְ דָּוִ֖ד הָל֣וֹךְ וְ/גָד֑וֹל וַ/יהוָ֛ה אֱלֹהֵ֥י צְבָא֖וֹת עִמּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/010.yaml
  text: And David went on[a], growing greater, and Yahweh, the God of hosts, was with him.
translation:
  language: sw
  text: Daudi akazidi kuwa mkuu zaidi na zaidi[a], na Yahwe, Mungu wa majeshi, alikuwa pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Daudi akaendelea kuongezeka katika ukuu.” Usemi wa Kiebrania unasisitiza kwamba ukuu wake uliendelea kuongezeka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... הָלוֹךְ וְגָדוֹל
  choice: akazidi kuwa mkuu zaidi na zaidi
  rationale: Muundo wa Kiebrania una kitenzi chenye ukomo pamoja na kitenzi-jina halisi, ukisisitiza maendeleo yanayoendelea. Kiswahili hiki kinaonyesha wazi kwamba ukuu wa Daudi uliendelea kuongezeka.
- source_word: דָּוִד
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Mungu wa majeshi
  rationale: Neno צְבָאוֹת humaanisha majeshi au makundi yaliyopangwa. Tafsiri hii ni ya moja kwa moja na haibainishi bila msingi kama majeshi hayo ni ya duniani au ya mbinguni.
- source_word: עִמּוֹ
  choice: alikuwa pamoja naye
  rationale: Hii inawasilisha moja kwa moja uwepo wa Mungu uliokuwa ukifuatana na Daudi huku ikihifadhi kiwakilishi cha Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya צְבָאוֹת katika cheo cha Mungu
  choice: majeshi
  alternative: majeshi ya mbinguni
  rationale: “Majeshi” huhifadhi upana wa neno la Kiebrania bila kulifanya lihusu majeshi ya mbinguni pekee, jambo ambalo mstari wenyewe haulibainishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Marudio “zaidi na zaidi” yanatunza msisitizo wa ongezeko endelevu katika Kiebrania.
