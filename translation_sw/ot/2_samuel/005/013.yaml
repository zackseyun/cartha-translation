base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/013.yaml
  text: And David took more concubines and wives in Jerusalem after he came from Hebron[a], and more sons and daughters were born to David.
translation:
  language: sw
  text: Baada ya kuwasili kutoka Hebroni, Daudi akachukua masuria zaidi na wake zaidi kutoka Yerusalemu[a]. Kisha wana na binti wengine wakazaliwa kwa Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Yerusalemu.” Kiebrania kinasema kihalisi “kutoka Yerusalemu,” jambo linaloweza kuonyesha mahali alikowachukua baada ya kuhamia huko.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akachukua
  rationale: Kitenzi hiki kinaonyesha Daudi aliwachukua wanawake hao kuwa sehemu ya nyumba yake kama masuria na wake; “akachukua” kinahifadhi usemi wa moja kwa moja wa Kiebrania bila kuongeza hukumu.
- source_word: עוֹד
  choice: wengine
  rationale: 'Katika sehemu zote mbili neno hili linaonyesha nyongeza: masuria na wake zaidi, na baadaye wana na binti zaidi.'
- source_word: פִּלַגְשִׁים
  choice: masuria
  rationale: “Masuria” ni neno la Kiswahili linalotofautisha hadhi hii na ile ya wake, kama Kiebrania kinavyofanya.
- source_word: וְנָשִׁים
  choice: wake
  rationale: Katika muktadha huu wa nyumba ya kifalme, neno lina maana ya wanawake walio wake, si wanawake kwa ujumla.
- source_word: מִירוּשָׁלִַם
  choice: kutoka Yerusalemu
  rationale: Kihusishi מִן kwa kawaida humaanisha “kutoka.” Tafsiri hii inahifadhi muundo wa Kiebrania, huku tanbihi ikitaja uwezekano wa kuelewa Yerusalemu kama mahali tendo lilipotukia.
- source_word: אַחֲרֵי בֹּאוֹ מֵחֶבְרוֹן
  choice: baada ya kuwasili kutoka Hebroni
  rationale: Hii ni lugha ya kawaida ya Kiswahili inayoonyesha wazi kwamba tendo lilitokea baada ya Daudi kuondoka Hebroni na kuwasili mahali pake papya.
- source_word: וַיִּוָּלְדוּ
  choice: wakazaliwa
  rationale: Hali ya kutendwa ya kitenzi ילד inaelezwa moja kwa moja kwa “wakazaliwa.”
- source_word: לְדָוִד
  choice: kwa Daudi
  rationale: Kihusishi לְ kinaonyesha uhusiano wa watoto hao na Daudi katika fomula ya kuzaliwa; “kwa Daudi” kinahifadhi uhusiano huo bila kufafanua zaidi.
- source_word: בָּנִים וּבָנוֹת
  choice: wana na binti
  rationale: Kiebrania kinataja jinsia zote mbili waziwazi, hivyo “wana na binti” ni sahihi zaidi kuliko neno la jumla “watoto.”
theological_decisions:
- issue: Maelezo ya masuria na wake wengi wa Daudi
  choice: Kusimulia tendo hilo bila kuliongezea hukumu ya kimaadili
  alternative: Kuongeza maneno yanayoonyesha kulikubali au kulikataa
  rationale: Aya hii inaripoti tendo la Daudi na kuzaliwa kwa watoto bila kutoa hukumu ya wazi; tafsiri haipaswi kuingiza msimamo wa kimadhehebu au wa mfasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Masuria” limetumiwa kudumisha tofauti ya wazi na “wake.” Mpangilio wa sentensi umebadilishwa kidogo ili kishazi cha wakati kisomeke kwa kawaida, huku utata wa “kutoka Yerusalemu” ukihifadhiwa kwa tanbihi.
