reference: 2 Samuel 5:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד בַּ/יּ֣וֹם הַ/ה֗וּא כָּל מַכֵּ֤ה יְבֻסִי֙ וְ/יִגַּ֣ע בַּ/צִּנּ֔וֹר וְ/אֶת הַ/פִּסְחִים֙ וְ/אֶת הַ֣/עִוְרִ֔ים שנאו נֶ֣פֶשׁ דָּוִ֑ד עַל כֵּן֙ יֹֽאמְר֔וּ עִוֵּ֣ר וּ/פִסֵּ֔חַ לֹ֥א יָב֖וֹא אֶל הַ/בָּֽיִת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/008.yaml
  text: And David said on that day[a], “Whoever strikes the Jebusites and reaches the water shaft, and the lame and the blind, whom David’s soul hates.” Therefore they say[c][b], “The blind and the lame shall not come into the house.”
translation:
  language: sw
  text: Daudi akasema siku hiyo, “Yeyote anayewapiga Wayebusi na kuufikia mfereji wa maji[a], na viwete na vipofu, ambao nafsi ya Daudi inawachukia.”[b] Kwa hiyo watu husema, “Vipofu na viwete hawataingia ndani ya nyumba.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mfereji,” “mtaro,” au “handaki”; neno la Kiebrania huenda linarejelea mfumo au njia ya maji, lakini maana yake kamili haijulikani kwa hakika.
    reason: lexical_alternative
  - marker: b
    text: Sintaksia ya Kiebrania katika kifungu hiki ni ngumu. Wengine huelewa maneno “viwete na vipofu” kuwa sehemu ya dhihaka ya Wayebusi katika mstari uliotangulia, badala ya kuwa sehemu ya moja kwa moja ya mwito wa Daudi.
    reason: alternative_reading
  - marker: c
    text: Au “ikulu”; katika muktadha huu, “nyumba” huenda ikarejelea makao ya kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַכֵּה יְבֻסִי
  choice: Yeyote anayewapiga Wayebusi
  rationale: Muundo wa כָּל pamoja na kitenzi-jina unaonyesha mwito usiomlenga mtu maalumu. יְבֻסִי ni jina la jamii ingawa umbo lake ni la umoja, kwa hiyo ‘Wayebusi’ ni Kiswahili cha kawaida.
- source_word: וְיִגַּע
  choice: na kuufikia
  rationale: נגע hapa inaweza kumaanisha kugusa au kufikia. Katika mazingira ya kuuteka mji, ‘kuufikia’ ni ya kawaida na haiongezi wazo la kupiga ambalo halimo wazi katika kitenzi.
- source_word: בַּצִּנּוֹר
  choice: mfereji wa maji
  rationale: צִנּוֹר ni neno lenye maana isiyo hakika, huenda likirejelea sehemu ya mfumo wa maji wa mji. ‘Mfereji wa maji’ linaeleweka kwa urahisi huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: וְאֶת הַפִּסְחִים וְאֶת הַעִוְרִים
  choice: na viwete na vipofu
  rationale: Vivumishi hivi vimetumiwa kama nomino za wingi. Kiunganishi ‘na’ kimehifadhiwa ili kutolainisha sintaksia ngumu ya Kiebrania.
- source_word: שנאו נֶפֶשׁ דָּוִד
  choice: ambao nafsi ya Daudi inawachukia
  rationale: Tafsiri hii inadumisha nahau halisi na msisitizo wa ‘nafsi ya Daudi’ badala ya kuifanya tu ‘Daudi anawachukia.’ Neno ‘ambao’ limeongezwa ili kifungu kifahamike kwa Kiswahili.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: Kwa hiyo watu husema
  rationale: Hiki ni kielezi cha kuanzisha msemo. ‘Watu’ humwakilisha mtendaji asiyeainishwa wa Kiebrania bila kumtaja mtu maalumu.
- source_word: עִוֵּר וּפִסֵּחַ
  choice: Vipofu na viwete
  rationale: Ingawa maneno ya Kiebrania yana umbo la umoja, yametumiwa kwa maana ya jumla kuhusu makundi hayo; wingi ni wa kawaida katika Kiswahili.
- source_word: לֹא יָבֹא אֶל הַבָּיִת
  choice: hawataingia ndani ya nyumba
  rationale: ‘Nyumba’ hudumisha upana wa בַּיִת, ambalo katika muktadha linaweza pia kumaanisha makao ya kifalme, bila kulazimisha maana ya ‘ikulu’ katika matini.
theological_decisions:
- issue: Kauli kuhusu Daudi kuwachukia ‘viwete na vipofu’
  choice: Kudumisha maneno magumu ya matini bila kuyapunguza makali wala kuyapanua kuwa fundisho kuhusu watu wenye ulemavu.
  alternative: Kuyahusisha maneno hayo moja kwa moja na dhihaka ya Wayebusi katika mstari uliotangulia, au kuyafafanua kwa namna ambayo haimhusishi Daudi na chuki hiyo.
  rationale: Sintaksia ya Kiebrania ni ngumu na inaweza kueleweka kwa njia zaidi ya moja. Tafsiri inadumisha mvutano wa Matini ya Kimasoreti, huku tanbihi ikionyesha usomaji mwingine bila kuufanya kuwa wa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaoeleweka. Kifungu cha kwanza kimeachwa na sintaksia iliyobanwa kwa makusudi ili kutoficha ugumu na utata wa Kiebrania; tanbihi husaidia msomaji bila kutatua utata huo kimabavu.
