  yaml_path: translation/ot/2_samuel/005/001.yaml
  text: Then all the tribes of Israel came to David at Hebron and said[a], “Look[b], we are your bone and your flesh.”
translation:
  language: sw
  text: Ndipo makabila yote ya Israeli yakaja kwa Daudi huko Hebroni[a], yakasema, “Tazama, sisi ni mfupa wako na nyama yako.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina kiishio kwenye jina “Hebroni” kinachoonyesha mwelekeo; yaani, “kwenda Hebroni.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mfupa wako na nyama yako,” msemo wa undugu unaomaanisha uhusiano wa karibu wa damu au utambulisho wa familia moja.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Ndipo ... yakaja
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi. “Ndipo” huonyesha hatua inayofuata kwa Kiswahili cha kawaida, na “yakaja” ndiyo maana ya msingi ya kitenzi בוא huku ikipatana na nomino “makabila.”
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: makabila yote ya Israeli
  rationale: Huhifadhi maana ya ujumla wa makabila kama taifa, bila kuifanya kauli kuwa ya kila kabila peke yake.
- source_word: אֶל דָּוִד
  choice: kwa Daudi
  rationale: אֶל huonyesha mwendo kuelekea kwa mtu; “kwa Daudi” ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: חֶבְרֹנָה
  choice: huko Hebroni
  rationale: Kiishio cha mwelekeo kinaweza kuonyesha mwendo kwenda Hebroni. Kwa kuwa tayari kuna “kwa Daudi,” “huko Hebroni” humtaja Daudi kama lengo na Hebroni kama mahali bila kufanya sentensi kuwa nzito.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: na kusema
  rationale: Huu ni mtindo wa kawaida wa Kiebrania wa kuanzisha maneno yanayonukuliwa. “Na kusema” ni Kiswahili cha asili na hakirudii kitenzi bila sababu.
- source_word: הִנּוּ
  choice: Tazama
  rationale: Neno hili huvuta fikira kwa msisitizo. “Tazama” ni la sasa, lenye heshima, na huhifadhi nguvu hiyo.
- source_word: עַצְמְךָ וּבְשָׂרְךָ
  choice: mfupa wako na nyama yako
  rationale: Tafsiri hii hufuata mpangilio na taswira ya Kiebrania, huku tanbihi ikieleza kuwa ni msemo wa undugu na utambulisho wa kifamilia.
- source_word: אֲנָחְנוּ
  choice: sisi ni
  rationale: Kiebrania kina kishazi kisicho na kitenzi kinacholingana na “ni”; Kiswahili huhitaji “ni” ili kutoa sentensi kamili na ya kawaida.
theological_decisions:
- issue: Msemo wa undugu na nguvu yake ya kisiasa na kiteolojia
  choice: “sisi ni mfupa wako na nyama yako”
  alternative: “sisi ni watu wako wenyewe” au “sisi ni jamaa zako”
  rationale: Kauli ya moja kwa moja huhifadhi taswira ya kifamilia ambayo makabila yanatumia kuthibitisha mshikamano wao na Daudi na msingi wa kumkubali kuwa mfalme. Haipunguzi kauli hiyo iwe tu muungano wa kisiasa wala kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili katika simulizi, lakini taswira muhimu ya Kiebrania imehifadhiwa. Alama za tanbihi zimewekwa kwenye sehemu zinazohusika: [a] baada ya Hebroni na [b] baada ya msemo wa undugu.'
