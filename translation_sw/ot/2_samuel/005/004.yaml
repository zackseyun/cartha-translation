lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: alikuwa na umri wa miaka thelathini
  rationale: Hii ni nahau ya Kiebrania inayotaja umri; tafsiri hii ni ya kawaida na wazi katika Kiswahili bila kuiga maneno ya asili kwa namna isiyo ya kawaida.
- source_word: בְּמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo wa kihusishi ב pamoja na kitenzi-jina cha מלך na kiambishi cha nafsi ya tatu huonyesha wakati ambapo Daudi alianza kuwa mfalme na kutawala.
- source_word: מָלָךְ
  choice: alitawala
  rationale: Kitenzi מלך humaanisha kutumia mamlaka ya kifalme; “alitawala” ni usemi wa kawaida na sahihi katika muhtasari huu wa utawala.
- source_word: אַרְבָּעִים שָׁנָה
  choice: kwa miaka arobaini
  rationale: Hutaja muda wa utawala wa Daudi; kihusishi “kwa” kinaifanya sentensi iwe ya asili katika Kiswahili.
- source_word: דָּוִד
  choice: Daudi
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
theological_decisions:
- issue: Maana ya בְּמָלְכוֹ katika kauli ya kutawazwa
  choice: alipoanza kutawala
  alternative: alipokuwa mfalme
  rationale: Chaguo kuu linaonyesha mwanzo wa utawala katika kauli ya kawaida ya kutaja umri wa mfalme alipoingia madarakani, huku tanbihi ikihifadhi uwezekano wa kutafsiri kwa kuzingatia kuwa kwake mfalme.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Nahau ya Kiebrania “mwana wa miaka thelathini” imetafsiriwa kwa usemi wa kawaida wa Kiswahili; hakuna tanbihi iliyoongezwa kwa maana hiyo kwa sababu tafsiri ya moja kwa moja ingekuwa isiyo ya asili na maana yake haina utata.
