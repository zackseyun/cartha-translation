  text: Nao wakaacha sanamu zao huko[b], kisha Daudi na watu wake wakazibeba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 Mambo ya Nyakati 14:12 linaongeza kwamba Daudi aliamuru sanamu hizo zichomwe. Hapa Kiebrania cha 2 Samweli kinasema tu kwamba Daudi na watu wake walizibeba.
    reason: cross_reference
