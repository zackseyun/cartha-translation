lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: wakaacha
  rationale: Kitenzi עזב hapa kinaeleza Wafilisti kuziacha sanamu walipokimbia; “wakaacha” ni cha kawaida na hakiongezi wazo lisilosemwa wazi.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki cha mahali kinarejelea eneo lililotajwa katika simulizi; “huko” ni usemi wa asili katika Kiswahili.
- source_word: עֲצַבֵּיהֶם
  choice: sanamu zao
  rationale: Nomino hii humaanisha mifano ya ibada; “sanamu” inaeleza wazi maana ya kidini huku “mifano yao” ikibaki kama mbadala katika tanbihi.
- source_word: וַיִּשָּׂאֵם
  choice: wakazichukua
  rationale: נשא inaweza kumaanisha kuinua, kubeba, au kuchukua. Katika muktadha huu “wakazichukua” huonyesha tendo bila kudai kusudi lao au kuingiza taarifa ya kuchomwa kutoka 1 Mambo ya Nyakati.
- source_word: דָּוִד וַאֲנָשָׁיו
  choice: Daudi na watu wake
  rationale: Tafsiri ya kawaida ya Kiswahili ya “Daudi na wanaume/watu wake”; katika muktadha hawa ni watu walioandamana naye, bila kulazimisha neno la kufasiri zaidi kama “askari”.
theological_decisions:
- issue: Uhusiano na simulizi sambamba la 1 Mambo ya Nyakati 14:12, linalosema sanamu zilichomwa
  choice: Kutafsiri maandishi ya Kimasora ya 2 Samweli kuwa Daudi na watu wake walizichukua, bila kuyapatanisha kimyakimya na Mambo ya Nyakati
  alternative: Kutaja katika mstari wenyewe kwamba walizichukua ili kuzichoma au kwamba walizichoma
  rationale: Kiebrania cha 2 Samweli kinasema tu kwamba Daudi na watu wake walizichukua. Maelezo ya kuchomwa yanahifadhiwa katika tanbihi kama taarifa ya simulizi sambamba, hivyo tofauti ya jinsi masimulizi hayo yanavyotoa maelezo haifutwi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na hadhi inayofaa Maandiko. “Nao ... kisha ...” huendeleza mfuatano wa matendo kwa njia ya asili. Alama zote za tanbihi zimewekwa katika maandishi makuu.
