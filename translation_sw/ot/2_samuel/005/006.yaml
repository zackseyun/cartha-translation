source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ וַֽ/אֲנָשָׁי/ו֙ יְר֣וּשָׁלִַ֔ם אֶל הַ/יְבֻסִ֖י יוֹשֵׁ֣ב הָ/אָ֑רֶץ וַ/יֹּ֨אמֶר לְ/דָוִ֤ד לֵ/אמֹר֙ לֹא תָב֣וֹא הֵ֔נָּה כִּ֣י אִם הֱסִֽירְ/ךָ֗ הַ/עִוְרִ֤ים וְ/הַ/פִּסְחִים֙ לֵ/אמֹ֔ר לֹֽא יָב֥וֹא דָוִ֖ד הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/006.yaml
  text: And the king and his men went to Jerusalem[a], to the Jebusites, the inhabitants of the land. And they said to David, “You will not come in here, for even the blind and the lame will turn you away,” saying[b], “David will not come in here.”
translation:
  language: sw
  text: Mfalme na watu wake wakaenda Yerusalemu, kwa Wayebusi, wakazi wa nchi. Nao wakamwambia Daudi[a], “Hutaingia humu, kwa maana hata vipofu na viwete watakuzuia[b],” wakisema, “Daudi hataingia humu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina umoja, “akamwambia Daudi.” Huenda umoja huo unawakilisha Wayebusi kwa pamoja.
    reason: textual_variant
  - marker: b
    text: Kiebrania cha kifungu hiki ni kigumu. Kwa kufuata mpangilio wa maneno, kinaweza kueleweka, “isipokuwa vipofu na viwete wakufukuze.” Wengine hulielewa, “isipokuwa ukiwaondoa vipofu na viwete.” Inaonekana Wayebusi walikuwa wakidhihaki kwamba mji ulikuwa salama sana hivi kwamba hata vipofu na viwete wangeweza kumzuia Daudi asiingie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: wakaenda
  rationale: Kitenzi הלך katika simulizi kinaendeleza tukio kwa maana ya kawaida ya ‘kwenda’; ‘wakaenda’ hakiongezi waziwazi wazo la kuandamana kivita ambalo halimo katika kitenzi chenyewe.
- source_word: הַמֶּלֶךְ וַאֲנָשָׁיו
  choice: Mfalme na watu wake
  rationale: אֲנָשָׁיו ni ‘watu wake’ au ‘wanaume wake.’ Katika muktadha huenda walikuwa wapiganaji wake, lakini ‘watu wake’ ni Kiswahili cha kawaida kisichobana maana kupita kiasi.
- source_word: אֶל הַיְבֻסִי
  choice: kwa Wayebusi
  rationale: Ingawa Kiebrania kina umbo la umoja lenye maana ya kijumla, hapa linarejelea watu wa kabila la Wayebusi. Kihusishi אֶל kimsingi ni ‘kwa/kuelekea kwa’; uhasama unaeleweka kutokana na muktadha.
- source_word: יוֹשֵׁב הָאָרֶץ
  choice: waliokuwa wakikaa katika nchi hiyo
  rationale: Kirai cha Kiebrania kina kishiriki cha umoja chenye maana ya kijumla. Tafsiri hii ya wingi inapatana na Wayebusi na ni ya kawaida katika Kiswahili.
- source_word: וַיֹּאמֶר
  choice: Nao wakamwambia
  rationale: Maandishi ya Kiebrania yana umoja, ‘akamwambia,’ lakini mhusika wa kijumla ni Wayebusi. Wingi umewekwa katika matini kwa ufasaha, huku umbo la asili likielezwa katika tanbihi [a].
- source_word: לֹא תָבוֹא הֵנָּה
  choice: Hutaingia humu
  rationale: Kauli hii ni dhihaka yenye uhakika kwamba Daudi hataweza kuingia katika ngome. ‘Kuingia humu’ huonyesha vizuri muktadha wa mji wenye ulinzi.
- source_word: הַעִוְרִים וְהַפִּסְחִים
  choice: vipofu na viwete
  rationale: Haya ni majina ya moja kwa moja ya makundi hayo katika dhihaka ya Wayebusi. Maneno halisi yamehifadhiwa badala ya kubadilishwa kuwa sitiari kama ‘walio dhaifu.’
- source_word: הֱסִירְךָ
  choice: watakuzuia
  rationale: Muundo wa Kiebrania ni mgumu na kwa ukaribu zaidi unaweza kuhusisha ‘kuondoa’ au ‘kugeuza.’ Katika dhihaka, maana inayokusudiwa inaelekea kuwa kwamba hata vipofu na viwete wangeweza kumzuia Daudi asiingie. Ugumu huo umewekwa wazi katika tanbihi [b].
- source_word: לֵאמֹר ... לֹא יָבוֹא דָוִד הֵנָּה
  choice: wakisema, “Daudi hataingia humu”
  rationale: Tafsiri ya usemi wa moja kwa moja inadumisha marudio na msisitizo wa dhihaka katika Kiebrania.
theological_decisions:
- issue: Kutajwa kwa vipofu na viwete katika dhihaka
  choice: Kuhifadhi maneno ‘vipofu na viwete’ kama sehemu ya usemi wa dhihaka wa Wayebusi
  alternative: Kuyafafanua kama ‘hata walio dhaifu zaidi miongoni mwetu’
  rationale: Mstari unaripoti maneno ya maadui; hauwasilishi tathmini ya mwandishi kuhusu thamani ya watu wenye ulemavu. Kuhifadhi maneno halisi ni aminifu kwa Kiebrania na huepuka kugeuza picha hiyo kuwa sitiari isiyo wazi.
- issue: Mhusika wa kitenzi וַיֹּאמֶר
  choice: Kutumia wingi ‘wakamwambia’ katika matini na kueleza umoja wa Kiebrania katika tanbihi
  alternative: Kutumia umoja ‘akamwambia’ bila kumtaja msemaji
  rationale: Umoja unaweza kufanya kazi kwa maana ya kijumla kwa Wayebusi. Wingi ni wa kawaida na unaeleweka katika Kiswahili, huku tanbihi ikihifadhi ushahidi wa umbo la Kiebrania.
- issue: Maana ya kifungu kigumu כִּי אִם הֱסִירְךָ הַעִוְרִים וְהַפִּסְחִים
  choice: 'Kutoa maana ya dhihaka: ‘hata vipofu na viwete watakuzuia,’ pamoja na tanbihi kuhusu ugumu wa Kiebrania'
  alternative: 'Tafsiri ya karibu zaidi: ‘isipokuwa ukiwaondoa vipofu na viwete’'
  rationale: Muktadha unaonyesha majivuno ya Wayebusi kuhusu usalama wa mji, lakini sintaksia ya Kiebrania ni ngumu. Tafsiri kuu inawasilisha maana inayowezekana zaidi bila kuficha uwezekano wa tafsiri ya karibu katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa na wenye heshima. ‘Humu’ na ‘hataingia’ huwasilisha kwa kawaida dhihaka kuhusu kuingia katika mji wenye ngome. Istilahi ‘vipofu na viwete’ zimehifadhiwa kwa uwazi kama maneno yaliyoripotiwa ya Wayebusi, si kama msimamo wa msimulizi.
