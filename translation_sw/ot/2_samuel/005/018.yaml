lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: Nao Wafilisti
  rationale: Kiunganishi ו kinaendeleza simulizi, na “Nao” ni njia ya asili ya Kiswahili ya kudumisha mtiririko huo. פְלִשְׁתִּים ni jina la kawaida la watu wa Wafilisti.
- source_word: בָּאוּ
  choice: wakaja
  rationale: Kitenzi cha Qal timilifu kutoka בוא katika muktadha huu wa simulizi kina maana ya “wakaja.”
- source_word: וַ/יִּנָּטְשׁוּ
  choice: wakajipanga
  rationale: Katika muktadha wa kijeshi, נטשׁ hapa inaonyesha kujieneza au kuchukua nafasi katika eneo. “Wakajipanga” ni lugha ya kawaida na yenye heshima, lakini maana ya “wakatawanyika” imehifadhiwa katika tanbihi.
- source_word: בְּ/עֵמֶק
  choice: katika Bonde la
  rationale: Kihusishi ב ni cha mahali, na עֵמֶק humaanisha “bonde.” Herufi kubwa inaonyesha kwamba ni sehemu ya jina maalumu la mahali.
- source_word: רְפָאִים
  choice: Warefai
  rationale: Katika jina la mahali עֵמֶק רְפָאִים, neno hili limetoholewa kama jina maalumu badala ya kutafsiriwa; “Warefai” pia hudumisha umbo la jina la kundi la watu katika Kiswahili.
