base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/020.yaml
  text: So David came to Baal-perazim[a], and there David struck them down. He said[b], “Yahweh has broken through my enemies before me like a breakthrough of waters.” Therefore he called the name of that place Baal-perazim.
translation:
  language: sw
  text: Basi Daudi akafika Baal-perasimu[a], naye Daudi akawapiga huko. Akasema, “Yahwe amewavunja adui zangu mbele yangu, kama maji yanavyobomoa.”[b] Kwa hiyo akapaita mahali pale Baal-perasimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baal-perasimu ni jina linaloweza kusikika kama “bwana wa mipasuko” au “mahali pa mipasuko,” likitoa mwangwi wa kauli ya Daudi kwamba Yahwe aliwavunja adui zake.
    reason: lexical_alternative
  - marker: b
    text: Au, “kama kupasuka kwa maji” au “kama mafuriko yanavyobomoa.” Kiebrania kina mchezo wa maneno kati ya “amewavunja,” taswira ya maji, na jina Baal-perasimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: Baal-perasimu
  rationale: Ni jina la mahali, hivyo limetoholewa badala ya kutafsiriwa. Tanbihi inaeleza mchezo wa maneno unaolihusisha na mzizi פרץ.
- source_word: וַיַּכֵּם
  choice: akawapiga
  rationale: Katika muktadha wa vita, נכה humaanisha kuwapiga au kuwaangusha maadui; “akawapiga” ni ya kawaida na yenye nguvu bila kuongeza wazi kwamba wote waliuawa.
- source_word: פָּרַץ
  choice: amewapasua
  rationale: Kitenzi kina wazo la kuvunja au kupenya kwa nguvu. “Amewapasua” hudumisha picha ya maji yanayofungua njia na mwangwi wa Perasimu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa tahajia iliyozoeleka katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: אֹיְבַי
  choice: adui zangu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino pamoja na kiambishi cha nafsi ya kwanza umoja.
- source_word: לְפָנַי
  choice: mbele yangu
  rationale: Hufuata kirai cha Kiebrania kwa karibu na kinaeleweka kiasili katika muktadha wa ushindi wa kijeshi.
- source_word: כְּפֶרֶץ מָיִם
  choice: kama maji yanavyopasua njia
  rationale: Tafsiri hii ni ya asili zaidi kuliko nomino dhahania kama “mpasuko wa maji,” huku ikihifadhi taswira ya maji yanayopenya kwa nguvu na kurudia wazo la פרץ.
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: akapaita mahali pale
  rationale: Ni Kiswahili cha kawaida kinachowasilisha tendo la kupapa mahali jina bila kubeba kwa lazima muundo mzito wa nahau ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi kama jina na ni umbo linalosomeka kwa urahisi katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa masimulizi ya kawaida; jina la mahali limetoholewa, na mchezo wa maneno wa Kiebrania umehifadhiwa kadiri inavyowezekana na kufafanuliwa katika tanbihi.
