base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/005.yaml
  text: In Hebron he reigned over Judah seven years and six months, and in Jerusalem he reigned thirty-three years over all Israel and Judah.
translation:
  language: sw
  text: Huko Hebroni alitawala Yuda kwa miaka saba na miezi sita, na huko Yerusalemu alitawala Israeli yote na Yuda kwa miaka thelathini na mitatu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּחֶבְרוֹן
  choice: Huko Hebroni
  rationale: Kihusishi בְּ kinaonyesha mahali. “Huko Hebroni” ni Kiswahili cha kawaida kinachoeleza mahali ambapo Daudi alitawala katika kipindi hicho.
- source_word: מָלַךְ
  choice: alitawala
  rationale: Kitenzi hiki katika muktadha huu kinafupisha muda wa utawala, wala hakizungumzii tu tukio la kuanza kuwa mfalme. “Alitawala” huwasilisha maana hiyo kwa uwazi.
- source_word: עַל יְהוּדָה
  choice: Yuda
  rationale: עַל pamoja na מָלַךְ hutaja watu au eneo lililotawaliwa. Katika Kiswahili, “alitawala Yuda” ni usemi wa kawaida na wazi bila kuhitaji kutafsiri kihusishi kwa neno tofauti.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: kwa miaka saba na miezi sita
  rationale: Kirai hiki hutaja muda moja kwa moja; “kwa” huonyesha muda wa utawala kwa Kiswahili cha kawaida.
- source_word: וּבִירוּשָׁלַם
  choice: na huko Yerusalemu
  rationale: Kiunganishi וּ pamoja na kihusishi בִּ huanzisha mahali pa pili pa utawala. “Na huko Yerusalemu” hudumisha ulinganifu na Hebroni na kusomeka kwa kawaida.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנָה
  choice: kwa miaka thelathini na mitatu
  rationale: Idadi ya Kiebrania imetolewa kwa mpangilio wa kawaida wa nambari katika Kiswahili, huku “kwa” ikionyesha muda.
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: Israeli yote na Yuda
  rationale: Tafsiri inadumisha kutajwa kwa Israeli na Yuda kama yalivyo katika Kiebrania, ikionyesha wigo kamili wa utawala bila kufuta utofauti wao wa kisiasa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaofuata sehemu mbili za mstari wa Kiebrania umehifadhiwa, huku matumizi ya “huko” yakifanya tofauti ya mahali pa utawala iwe wazi.
