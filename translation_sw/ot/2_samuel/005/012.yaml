base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/012.yaml
  text: And David knew that Yahweh had established him as king over Israel[a], and that he had exalted his kingdom for the sake of his people Israel.
translation:
  language: sw
  text: Daudi akajua kwamba Yahweh alikuwa amemthibitisha kuwa mfalme juu ya Israeli, na kwamba Yahweh alikuwa ameuinua ufalme wake kwa ajili ya watu wake Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya watu wa Daudi, Israeli,” ikiwa “wake” katika “watu wake” linaeleweka kumrejelea Daudi badala ya Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: akajua
  rationale: Hutoa maana ya moja kwa moja ya kujua au kutambua, huku ikidumisha mtiririko wa kisimulizi wa kitenzi mfululizo.
- source_word: הֱכִינוֹ
  choice: alikuwa amemweka imara
  rationale: Hiphil ya כון hapa inaeleza kumthibitisha na kumfanya awe thabiti katika cheo cha kifalme; usemi huu ni wa asili na haupanui maana kupita kiasi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limehifadhiwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: לְמֶלֶךְ
  choice: kuwa mfalme
  rationale: Kihusishi ל kinaonyesha cheo au jukumu ambalo Daudi aliwekwa ndani yake.
- source_word: עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: Katika muktadha wa ufalme, עַל huonyesha mamlaka ya kutawala juu ya Israeli.
- source_word: נִשֵּׂא
  choice: alikuwa ameinua
  rationale: Kitenzi נשׂא kina wazo la kuinua au kutukuza; 'kuinua' huhifadhi taswira ya Kiebrania na ni Kiswahili cha kawaida.
- source_word: מַמְלַכְתּוֹ
  choice: ufalme wake
  rationale: ממלכה hapa hurejelea ufalme au mamlaka ya kifalme ya Daudi; 'ufalme wake' ndiyo tafsiri ya moja kwa moja.
- source_word: בַּעֲבוּר
  choice: kwa ajili ya
  rationale: 'Kirai hiki kinaonyesha kusudi au manufaa: kuinuliwa kwa ufalme kulifanyika kwa manufaa ya Israeli.'
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: watu wake Israeli
  rationale: Muundo huu unamtambulisha Israeli kuwa watu wake; kiwakilishi kinaelekea zaidi kumrejelea Yahweh, ingawa kinaweza pia kumrejelea Daudi.
theological_decisions:
- issue: Kirejelewa cha kiambishi katika עַמּוֹ ('watu wake')
  choice: 'Kiambishi kinaeleweka zaidi kumrejelea Yahweh: ''watu wake Israeli.'''
  alternative: 'Kiambishi kinaweza kumrejelea Daudi: ''watu wa Daudi, Israeli.'''
  rationale: Yahweh ndiye mtendaji katika kishazi kilichotangulia, naye anamthibitisha Daudi na kuinua ufalme wake. Zaidi ya hayo, Israeli huitwa mara nyingi watu wa Yahweh. Hata hivyo, sarufi inaweza kuruhusu kiambishi kimrejelee Daudi, kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa msomaji wa kawaida. 'Ndipo ... akajua' hudumisha mwendelezo wa kisimulizi; 'amemweka imara' huonyesha uthabiti na uthibitisho wa Daudi katika ufalme.
