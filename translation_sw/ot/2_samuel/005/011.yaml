  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ֠/יִּשְׁלַח חִירָ֨ם מֶֽלֶךְ צֹ֥ר מַלְאָכִים֮ אֶל דָּוִד֒ וַ/עֲצֵ֣י אֲרָזִ֔ים וְ/חָרָשֵׁ֣י עֵ֔ץ וְ/חָֽרָשֵׁ֖י אֶ֣בֶן קִ֑יר וַ/יִּבְנֽוּ בַ֖יִת לְ/דָוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/011.yaml
  text: And Hiram king of Tyre sent messengers to David[a], and cedar logs, and craftsmen of wood, and craftsmen of stone walling[b]; and they built a house for David.
translation:
  language: sw
  text: Hiramu, mfalme wa Tiro, akatuma kwa Daudi wajumbe, magogo ya mierezi, mafundi wa mbao, na mafundi wa kujenga kuta za mawe[a]; nao wakamjengea Daudi nyumba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waashi.” Kirai cha Kiebrania kinataja kihalisi “jiwe” na “ukuta.”
    reason: lexical_alternative
  - marker: b
    text: Au “ikulu.” Kiebrania kinasema kihalisi “nyumba,” neno ambalo katika mazingira ya kifalme linaweza kumaanisha ikulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma
  rationale: Hii ndiyo tafsiri ya kawaida ya kitenzi שלח katika masimulizi, na kiambishi “aka-” kinaendeleza mtiririko wa matukio.
- source_word: חִירָם
  choice: Hiramu
  rationale: Jina limetoholewa kwa namna inayotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: מֶלֶךְ צֹר
  choice: mfalme wa Tiro
  rationale: Muundo huu unaonyesha cheo cha Hiramu na eneo alilotawala; “Tiro” ni umbo la kawaida la jina hilo katika Kiswahili.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Neno la Kiebrania linaweza kumaanisha wajumbe wa kawaida au wajumbe wa kidiplomasia. “Wajumbe” linahifadhi maana pana bila kuongeza dhana isiyosemwa wazi.
- source_word: וַעֲצֵי אֲרָזִים
  choice: magogo ya mierezi
  rationale: Usemi wa Kiebrania una maana ya miti au mbao za mwerezi zinazotumiwa katika ujenzi. “Magogo ya mierezi” ni wazi na halisi katika muktadha huu.
- source_word: חָרָשֵׁי עֵץ
  choice: mafundi wa mbao
  rationale: חָרָשׁ ni fundi stadi; tafsiri hii inabaki pana kuliko “maseremala,” ambalo linaweza kupunguza aina ya kazi iliyokusudiwa.
- source_word: חָרָשֵׁי אֶבֶן קִיר
  choice: mafundi wa kujenga kuta za mawe
  rationale: Kirai kigumu cha Kiebrania kinataja “jiwe” na “ukuta.” Tafsiri hii inahifadhi vipengele vyote viwili kwa Kiswahili cha kawaida, huku “waashi” ikitolewa kama njia fupi katika tanbihi.
- source_word: וַיִּבְנוּ
  choice: nao wakamjengea
  rationale: Kitenzi cha wingi kinawarejelea mafundi waliotumwa. Muundo “wakamjengea” unaonyesha kwa kawaida kwamba jengo lilijengwa kwa ajili ya Daudi.
- source_word: בַיִת
  choice: nyumba
  rationale: Maana ya msingi ni “nyumba.” Katika mazingira ya kifalme inaweza kuwa ikulu, lakini hilo halijaainishwa kwa neno tofauti katika Kiebrania.
- source_word: לְדָוִד
  choice: kwa Daudi / Daudi katika “wakamjengea Daudi”
  rationale: Kihusishi kinaonyesha anayelengwa au kunufaika. Kiswahili hutumia “kwa Daudi” baada ya “akatuma” na kiambishi cha utendea katika “wakamjengea Daudi.”
