  text: גַּם אֶתְמ֣וֹל גַּם שִׁלְשׁ֗וֹם בִּ/הְי֨וֹת שָׁא֥וּל מֶ֨לֶךְ֙ עָלֵ֔י/נוּ אַתָּ֗ה הייתה מוציא ו/ה/מבי אֶת יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר יְהוָ֜ה לְ/ךָ֗ אַתָּ֨ה תִרְעֶ֤ה אֶת עַמִּ/י֙ אֶת יִשְׂרָאֵ֔ל וְ/אַתָּ֛ה תִּהְיֶ֥ה לְ/נָגִ֖יד עַל יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/002.yaml
  text: Also previously[a], when Saul was king over us, you were the one who led Israel out and brought them in. And Yahweh said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over Israel.’
translation:
  language: sw
  text: Hata hapo zamani[a], Sauli alipokuwa mfalme juu yetu, ni wewe uliwatoa Waisraeli na kuwaingiza[b]. Yahweh akakuambia, ‘Wewe utawachunga watu wangu Israeli, nawe utakuwa mtawala[c] juu ya Israeli.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “jana na juzi”; hii ni nahau inayomaanisha “zamani” au “kwa muda uliotangulia.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “uliyewatoa Israeli na kuwaingiza”; hii ni nahau ya kuwaongoza watu katika shughuli zao, hasa vitani.
    reason: lexical_alternative
  - marker: c
    text: Au “kiongozi” au “mkuu.” Neno la Kiebrania hapa ni tofauti na neno la kawaida linalomaanisha “mfalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֶתְמוֹל גַּם שִׁלְשׁוֹם
  choice: Hata hapo zamani
  rationale: Nahau hii, ambayo kihalisi hutaja ‘jana na juzi,’ humaanisha wakati uliopita au kwa muda uliotangulia. ‘Hata hapo zamani’ ni ya kawaida katika Kiswahili na inaonyesha kwamba Daudi alikuwa tayari akiongoza kabla ya tukio hili.
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ עָלֵינוּ
  choice: Sauli alipokuwa mfalme wetu
  rationale: Muundo wenye בִּי huanzisha kishazi cha wakati. ‘Mfalme wetu’ ni Kiswahili cha asili kwa maana ya ‘mfalme juu yetu’ bila kupoteza uhusiano wa utawala.
- source_word: אַתָּה
  choice: ni wewe
  rationale: Kiwakilishi huru kimetiliwa mkazo katika Kiebrania; ‘ni wewe’ kinadumisha mkazo huo.
- source_word: מוציא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  choice: uliyewaongoza Waisraeli walipotoka na walipoingia
  rationale: Maneno ya kutoka na kuingia ni nahau ya kuwaongoza watu, hasa katika shughuli zao na vitani. Tafsiri hii huhifadhi picha ya mwendo huku ikieleweka kwa urahisi.
- source_word: וַיֹּאמֶר יְהוָה
  choice: Yahwe akakuambia
  rationale: Jina la agano יְהוָה limetoholewa kwa namna ya kawaida ya Kiswahili kuwa ‘Yahwe.’ Kiambishi cha yambwa ‘-ku-’ kinaonyesha kwa usahihi kwamba alisema na Daudi.
- source_word: תִרְעֶה
  choice: utawachunga
  rationale: Kitenzi רעה kinatumia mfano wa kichungaji kueleza utawala wa kifalme. ‘Utawachunga’ huhifadhi mfano huo badala ya kuufanya tu kuwa ‘utatawala.’
- source_word: עַמִּי אֶת יִשְׂרָאֵל
  choice: watu wangu Israeli
  rationale: Hii inadumisha lugha ya agano na utambulisho wa Israeli kama watu wa Yahwe.
- source_word: נָגִיד
  choice: mtawala
  rationale: נָגִיד humaanisha mtu aliyewekwa kuwa kiongozi au mtawala na si neno la kawaida la ‘mfalme.’ ‘Mtawala’ ni wazi na linadumisha tofauti hiyo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Kifungu kinatumia moja kwa moja jina la agano la Mungu. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Mfano wa kichungaji katika תִרְעֶה
  choice: utawachunga watu wangu Israeli
  alternative: utawatawala watu wangu Israeli
  rationale: Kiebrania kinaeleza ufalme kwa mfano wa mchungaji. Kudumisha ‘kuwachunga’ kunahifadhi wajibu wa uongozi na utunzaji uliomo katika picha hiyo.
- issue: Maana ya נָגִיד katika uteuzi wa Daudi
  choice: mtawala
  alternative: kiongozi au mkuu
  rationale: Neno hili linaonyesha mamlaka ya uongozi lakini ni tofauti na מֶלֶךְ, ‘mfalme.’ ‘Mtawala’ hudumisha tofauti hiyo bila kuingiza cheo cha kifalme kisichotajwa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘ni wewe’ unadumisha mkazo wa Kiebrania; ‘Yahwe’ linatumiwa kama umbo la kawaida la Kiswahili la jina la Mungu. Alama zote za tanbihi [a], [b], na [c] zimewekwa mahali zinapohusika katika matini.
