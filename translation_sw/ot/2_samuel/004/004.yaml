  text: וְ/לִ/יהֽוֹנָתָן֙ בֶּן שָׁא֔וּל בֵּ֖ן נְכֵ֣ה רַגְלָ֑יִם בֶּן חָמֵ֣שׁ שָׁנִ֣ים הָיָ֡ה בְּ/בֹ֣א שְׁמֻעַת֩ שָׁא֨וּל וִ/יהֽוֹנָתָ֜ן מִֽ/יִּזְרְעֶ֗אל וַ/תִּשָּׂאֵ֤/הוּ אֹֽמַנְתּ/וֹ֙ וַ/תָּנֹ֔ס וַ/יְהִ֞י בְּ/חָפְזָ֥/הּ לָ/נ֛וּס וַ/יִּפֹּ֥ל וַ/יִּפָּסֵ֖חַ וּ/שְׁמ֥/וֹ מְפִיבֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/004.yaml
  text: Jonathan son of Saul had a son crippled in his feet. He was five years old when the news about Saul and Jonathan came from Jezreel[a], and his nurse picked him up and fled. And as she hurried to flee, he fell and became lame. His name was Mephibosheth.
translation:
  language: sw
  text: Yonathani mwana wa Sauli alikuwa na mwana aliyekuwa mlemavu wa miguu.[a] Mtoto huyo alikuwa na umri wa miaka mitano wakati habari kuhusu Sauli na Yonathani zilipofika kutoka Yezreeli. Mlezi wake akamchukua na kukimbia. Alipokuwa akiharakisha kukimbia, mtoto akaanguka, miguu yake ikalemaa. Jina lake lilikuwa Mefiboshethi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlemavu wa miguu yote miwili.” Kifungu cha Kiebrania kwa maana ya msingi humaanisha mtu aliyepatwa miguuni.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְכֵה רַגְלָיִם
  choice: mlemavu wa miguu
  rationale: Huwasilisha ulemavu wa kimwili kwa lugha ya sasa yenye heshima. Neno la Kiebrania linamaanisha aliyepatwa au kuathiriwa miguuni; umbo la ‘miguu’ linaweza kudokeza miguu yote miwili bila kulazimisha hilo katika matini kuu.
- source_word: בֶּן חָמֵשׁ שָׁנִים
  choice: alikuwa na umri wa miaka mitano
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha umri kwa usahihi.
- source_word: בְּבֹא שְׁמֻעַת שָׁאוּל וִיהוֹנָתָן
  choice: wakati habari kuhusu Sauli na Yonathani zilipofika
  rationale: Huhifadhi uhusiano wa wakati na kutoeleza zaidi yaliyomo katika habari kuliko chanzo kinavyosema.
- source_word: מִיִּזְרְעֶאל
  choice: kutoka Yezreeli
  rationale: Huwasilisha kwa moja kwa moja mahali habari zilikotoka.
- source_word: אֹמַנְתּוֹ
  choice: mlezi wake
  rationale: Neno hili humaanisha mwanamke aliyekuwa akimtunza na kumlea mtoto. ‘Mlezi’ ni la kawaida na pana vya kutosha katika Kiswahili cha sasa.
- source_word: וַתִּשָּׂאֵהוּ
  choice: akamnyanyua
  rationale: Hufuata maana ya kuinua au kumbeba mtoto katika hatua ya kuanza kukimbia.
- source_word: וַתָּנֹס
  choice: akakimbia
  rationale: Ni simulizi la kawaida la tendo la kukimbia ili kuondoka au kujiokoa.
- source_word: בְּחָפְזָהּ לָנוּס
  choice: alipokuwa akiharakisha kukimbia
  rationale: Huhifadhi hali ya haraka pamoja na kusudi la kukimbia.
- source_word: וַיִּפֹּל
  choice: mtoto akaanguka
  rationale: Kutaja ‘mtoto’ huondoa utata wa kiwakilishi katika Kiswahili na kufuata kitenzi cha Kiebrania ambacho mhusika wake ni mtoto.
- source_word: וַיִּפָּסֵחַ
  choice: miguu yake ikalemaa
  rationale: Huwasilisha matokeo ya kuanguka—kuwa na ulemavu wa kutembea—bila kutumia jina linaloweza kusikika la kudhalilisha.
- source_word: מְפִיבֹשֶׁת
  choice: Mefiboshethi
  rationale: Ni unukuzi unaofaa kwa tahajia na matamshi ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umewekwa wazi kwa kumtaja ‘mtoto’ pale ambapo viambishi vya Kiswahili havingebainisha mhusika kama Kiebrania kinavyofanya. Kiunganishi cha mwanzo hakijatafsiriwa kwa neno kama ‘basi’ kwa sababu hapa hakina neno mahsusi la wakati.
