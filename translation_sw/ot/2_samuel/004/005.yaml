base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/005.yaml
  text: The sons of Rimmon the Beerothite[a], Rekab and Baanah, went and came to the house of Ish-bosheth in the heat of the day[b], while he was lying down for his midday rest.
translation:
  language: sw
  text: Wana wa Rimoni, mtu wa Beerothi, Rekabu na Baana, wakaenda na kufika kwenye nyumba ya Ish-boshethi wakati wa joto la mchana; naye alikuwa amelala akipumzika adhuhuri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: Wana wa Rimoni Mbeerothi
  rationale: בְּנֵי hapa ina maana yake ya kawaida ya wana, kwa kuwa Rekabu na Baana wanatajwa moja kwa moja kama wana wa Rimoni. הַבְּאֵרֹתִי ni jina la mahali au asili, hivyo limetafsiriwa kwa namna ya kawaida ya Kiswahili kama “Mbeerothi.”
- source_word: רֵכָב וּבַעֲנָה
  choice: Rekabu na Baana
  rationale: Majina yametoholewa kwa tahajia na matamshi yanayoeleweka katika Kiswahili, huku yakibaki karibu na maumbo ya Kiebrania.
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: wakaenda na kufika
  rationale: Kauli hizi mbili zinahifadhi mfuatano wa simulizi—kwenda kisha kufika—bila kudokeza kwamba tayari waliingia ndani ya nyumba.
- source_word: כְּחֹם הַיּוֹם
  choice: wakati wa hari ya mchana
  rationale: Kirai hiki kinarejelea kipindi cha joto la mchana, huenda sehemu yenye joto kali zaidi ya siku. “Hari ya mchana” ni ya asili na yenye staha, bila kukifupisha moja kwa moja kuwa saa sita.
- source_word: בֵּית אִישׁ בֹּשֶׁת
  choice: nyumbani kwa Ish-boshethi
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza nyumba au makao ya mtu; jina la mtu limetoholewa badala ya kutafsiriwa.
- source_word: וְהוּא שֹׁכֵב אֵת מִשְׁכַּב הַצָּהֳרָיִם
  choice: naye alikuwa amelala akipumzika adhuhuri
  rationale: Kiebrania kinasema kwa uhalisia kwamba alikuwa amelala malalo ya adhuhuri. Tafsiri hii ni ya kawaida katika Kiswahili, inaonyesha hali yake wakati walipofika, na haiongezi kwa uhakika kwamba alikuwa usingizini.
