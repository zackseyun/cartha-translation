base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/002.yaml
  text: 'Saul’s son had two men who were commanders of raiding bands: the name of the one was Baanah[a], and the name of the second was Rechab, sons of Rimmon the Beerothite, from the sons of Benjamin; for Beeroth also was considered part of Benjamin.'
translation:
  language: sw
  text: Mwana wa Sauli alikuwa na wanaume wawili waliokuwa wakuu wa vikosi vya uvamizi. Mmoja aliitwa Baana, na wa pili aliitwa Rekabu. Walikuwa wana wa Rimoni, mtu wa Beerothi, waliotoka miongoni mwa wazao wa Benyamini; kwa maana Beerothi pia ilihesabiwa kuwa sehemu ya Benyamini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ilihesabiwa kuwa ya Benyamini.”
    reason: Njia nyingine ya kutafsiri kirai תֵּחָשֵׁב עַל בִּנְיָמִן, ambacho kinaonyesha kuhusishwa au kujumuishwa kwa Beerothi katika Benyamini.
lexical_decisions:
- source_word: שְׁנֵי אֲנָשִׁים
  choice: wanaume wawili
  rationale: Hurejelea watu wawili wa kiume; huu ni usemi wa kawaida na ulio wazi katika Kiswahili.
- source_word: שָׂרֵי גְדוּדִים
  choice: wakuu wa vikosi vya uvamizi
  rationale: שָׂרֵי humaanisha viongozi au wakuu, na גְדוּדִים hapa ni vikundi vya kijeshi vinavyofanya mashambulizi au uvamizi, si lazima vitengo rasmi vya jeshi.
- source_word: בֶן שָׁאוּל
  choice: Mwana wa Sauli
  rationale: Kirai hiki kinamrejelea mwana wa Sauli aliyetajwa katika muktadha uliotangulia; umoja wake umehifadhiwa.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: Mmoja aliitwa ... na wa pili aliitwa
  rationale: Huwasilisha kwa Kiswahili cha kawaida fomula ya Kiebrania ya kutaja jina la mmoja na la pili bila kupoteza tofauti hiyo.
- source_word: בְּנֵי רִמּוֹן
  choice: wana wa Rimoni
  rationale: Huhifadhi wazi uhusiano wao wa kifamilia na Rimoni.
- source_word: הַבְּאֶרֹתִי
  choice: Mbeerothi
  rationale: Ni kivumishi cha asili kinachomtambulisha Rimoni kuwa mtu wa Beerothi; umbo la Kiswahili la jina la mahali limetumiwa.
- source_word: מִבְּנֵי בִנְיָמִן
  choice: walitoka miongoni mwa wazao wa Benyamini
  rationale: Hutoa maana ya nasaba na ushirika wa kikabila kwa Kiswahili cha asili kuliko tafsiri sisisi ya ‘wana wa Benyamini.’
- source_word: כִּי גַּם
  choice: kwa maana ... pia
  rationale: Huanzisha maelezo yanayofafanua kwa nini watu wa Beerothi walihusishwa na Benyamini.
- source_word: בְּאֵרוֹת
  choice: Beerothi
  rationale: Jina la mahali limetoholewa kwa namna inayosomeka kwa wasomaji wa Kiswahili.
- source_word: תֵּחָשֵׁב עַל בִּנְיָמִן
  choice: ilihesabiwa kuwa sehemu ya Benyamini
  rationale: Kitenzi cha hali ya kutendwa kinaonyesha Beerothi kuonwa au kuhesabiwa kuwa ndani ya eneo au ushirika wa Benyamini.
