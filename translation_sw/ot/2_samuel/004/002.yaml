translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa sasa na unaoeleweka. Sentensi ndefu ya Kiebrania imegawanywa ili isomeke kwa urahisi, huku uhusiano wa mawazo ukihifadhiwa. Kiunganishi cha mwanzo ו hakijatafsiriwa kwa neno la wakati kama “Basi” au “Sasa,” kwa kuwa hakina maana ya wakati iliyo wazi hapa.
