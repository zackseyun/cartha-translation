  yaml_path: translation/ot/2_samuel/004/009.yaml
  text: But David answered Rekab and Baanah his brother[a], the sons of Rimmon the Beerothite, and said to them, “As Yahweh lives, who has redeemed my life out of every distress,
translation:
  language: sw
  text: Lakini Daudi akawajibu Rekabu na Baana, ndugu yake, wana wa Rimoni, mtu wa Beerothi, akawaambia, “Kama Yahwe[a] aishivyo, ambaye amenikomboa maisha yangu kutoka katika taabu zote,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiebrania: YHWH; jina hili pia limezoeleka kuandikwa “Yehova.”'
    reason: Inaonyesha umbo la jina la Mungu katika maandishi ya Kiebrania na tahajia nyingine iliyozoeleka bila kubadilisha jina katika matini kuu.
lexical_decisions:
- source_word: וַיַּעַן
  choice: akawajibu
  rationale: Kitenzi ענה katika mfululizo wa simulizi hutambulisha jibu; umbo lenye kiambishi cha wingi linaonyesha kwamba Daudi aliwajibu watu hao wawili.
- source_word: רֵכָב
  choice: Rekabu
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili huku likifuata umbo la Kiebrania.
- source_word: בַּעֲנָה
  choice: Baana
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa.
- source_word: אָחִיו
  choice: ndugu yake
  rationale: Nomino iko katika umoja na ina kiambishi cha nafsi ya tatu umoja; kwa kawaida humtaja Baana kuwa ndugu ya Rekabu, bila kufafanua zaidi aina ya undugu.
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: wana wa Rimoni, Mbeerothi
  rationale: Muundo huu unawatambulisha kuwa wana wa Rimoni na unamhusisha Rimoni na Beerothi. Mkato husaidia kuonyesha kwamba “Mbeerothi” inamfafanua Rimoni.
- source_word: חַי יְהוָה
  choice: Kama aishivyo Yahwe
  rationale: Huu ni mtindo rasmi wa kiapo. “Kama aishivyo” huhifadhi uzito na muundo wa kiapo kwa Kiswahili cha asili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: פָּדָה
  choice: aliyekomboa
  rationale: פדה hubeba wazo la kukomboa au kuokoa kutoka hatarini; “kukomboa” huhifadhi uzito wake wa kileksika.
- source_word: נַפְשִׁי
  choice: maisha yangu
  rationale: Katika muktadha huu נפש humaanisha uhai au nafsi ya Daudi iliyo hatarini, si sehemu isiyo ya mwili pekee.
- source_word: מִכָּל צָרָה
  choice: kutoka katika kila taabu
  rationale: צָרָה ni dhiki, taabu, au shida; “kila taabu” huhifadhi nguvu jumuishi ya כָּל.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu, YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku tanbihi ikieleza umbo la Kiebrania.
- issue: Maana ya נַפְשִׁי katika kauli ya ukombozi
  choice: maisha yangu
  alternative: nafsi yangu; mimi
  rationale: Muktadha unahusu kuokolewa kwa uhai wa Daudi kutoka taabuni. Tafsiri hii haifanyi neno hilo kuwa fundisho maalumu kuhusu mgawanyo wa mwili na roho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kiapo umehifadhiwa, na koma ya mwisho inaonyesha kwamba sentensi inaendelea katika mstari unaofuata.
