base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/003.yaml
  text: But the Beerothites fled to Gittaim and have lived there as sojourners to this day[a].
translation:
  language: sw
  text: Lakini watu wa Beerothi walikimbilia Gitaimu, nao wameishi huko kama wageni mpaka leo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nao wamekuwa wakiishi huko kama wageni wakazi mpaka leo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרְחוּ
  choice: walikimbilia
  rationale: Kitenzi ברח katika Qal kina maana ya kukimbia ili kujiokoa. Kiambishi -lia kinaonyesha kwa kawaida na kwa ufupi kwamba walikimbia kwenda Gitaimu.
- source_word: הַבְּאֵרֹתִים
  choice: watu wa Beerothi
  rationale: Hili ni jina la watu wanaotoka Beerothi; Kiswahili cha kawaida hueleza uhusiano huo kwa muundo ‘watu wa Beerothi’ badala ya kuunda jina geni la kikabila.
- source_word: גִּתָּיְמָה
  choice: Gitaimu
  rationale: Jina la mahali lenye he ya mwelekeo linaonyesha walikimbia kwenda Gitaimu; maana hiyo tayari imo katika ‘walikimbilia.’
- source_word: וַיִּהְיוּ שָׁם
  choice: nao wameishi huko
  rationale: Kauli inaeleza hali iliyoanza zamani na kuendelea hadi wakati wa msimulizi. Wakati timilifu wa Kiswahili pamoja na ‘mpaka leo’ unaonyesha mwendelezo huo kwa kawaida.
- source_word: גָּרִים
  choice: kama wageni
  rationale: גור hapa humaanisha kukaa mahali kama mtu asiye mwenyeji. ‘Kama wageni’ ni wazi na ya kawaida, huku tanbihi ikihifadhi kwa uwazi zaidi wazo la wageni wanaoishi humo.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili kwa usemi wa muda unaoonyesha hali iliyoendelea hadi siku ya msimulizi.
- source_word: וַ
  choice: Lakini
  rationale: Kiunganishi kinaingiza maelezo ya usuli yenye tofauti ndogo na habari iliyotangulia kuhusu Beerothi kuhesabiwa kuwa sehemu ya Benyamini.
