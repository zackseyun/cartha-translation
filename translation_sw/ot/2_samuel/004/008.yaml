reference: 2 Samuel 4:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ֠/יָּבִאוּ אֶת רֹ֨אשׁ אִֽישׁ בֹּ֥שֶׁת אֶל דָּוִד֮ חֶבְרוֹן֒ וַ/יֹּֽאמְרוּ֙ אֶל הַ/מֶּ֔לֶךְ הִנֵּֽה רֹ֣אשׁ אִֽישׁ בֹּ֗שֶׁת בֶּן שָׁאוּל֙ אֹֽיִבְ/ךָ֔ אֲשֶׁ֥ר בִּקֵּ֖שׁ אֶת נַפְשֶׁ֑/ךָ וַ/יִּתֵּ֣ן יְ֠הוָה לַֽ/אדֹנִ֨/י הַ/מֶּ֤לֶךְ נְקָמוֹת֙ הַ/יּ֣וֹם הַ/זֶּ֔ה מִ/שָּׁא֖וּל וּ/מִ/זַּרְעֽ/וֹ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/008.yaml
  text: They brought the head of Ish-bosheth to David at Hebron[a], and said to the king, “Here is the head of Ish-bosheth son of Saul, your enemy, who sought your life. Yahweh has given my lord the king vengeance today on Saul and on his offspring.”
translation:
  language: sw
  text: Wakakileta kichwa cha Ish-boshethi kwa Daudi huko Hebroni, wakamwambia mfalme, “Hiki hapa kichwa cha Ish-boshethi mwana wa Sauli, adui yako aliyetaka kukuua. Yahwe amempa bwana wangu mfalme kisasi[a] leo dhidi ya Sauli na uzao wake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “visasi” (wingi), umbo la kusisitiza linaloweza kumaanisha “kisasi” au “matendo ya kisasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Wakakileta
  rationale: Kitenzi cha mfululizo wa simulizi; kiambishi -ki- kinarejelea kichwa na kutoa Kiswahili cha kawaida.
- source_word: רֹאשׁ
  choice: kichwa
  rationale: Hapa ni kichwa halisi cha mwili, si matumizi ya kitamathali.
- source_word: אִישׁ בֹּשֶׁת
  choice: Ish-boshethi
  rationale: Jina limetoholewa kwa matamshi ya Kiswahili kutoka umbo la Kimasoreti lililo katika aya hii.
- source_word: חֶבְרוֹן
  choice: Hebroni
  rationale: Umbo la kawaida la jina hili la mahali katika Kiswahili cha Biblia.
- source_word: הִנֵּה
  choice: Hiki hapa
  rationale: Huonyesha kitu kinachowasilishwa mbele ya msikilizaji; ni la sasa, wazi, na la kawaida kuliko tamko la kizamani.
- source_word: אֹיִבְךָ
  choice: adui yako
  rationale: Tafsiri ya moja kwa moja ya nomino yenye kiambishi cha nafsi ya pili.
- source_word: בִּקֵּשׁ אֶת נַפְשֶׁךָ
  choice: aliyetaka kukuua
  rationale: Nahau ya Kiebrania ya ‘kutafuta uhai’ humaanisha kutaka kuondoa uhai; Kiswahili hiki kinaeleza maana kwa kawaida bila kutumia ‘roho’ kimakosa.
- source_word: וַיִּתֵּן יְהוָה
  choice: Yahwe amempa
  rationale: Kauli hiyo inatangaza tendo lililotimizwa lenye matokeo ya sasa; jina la Mungu limetoholewa kama Yahwe.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Inahifadhi heshima ya mahakamani na kiambishi cha nafsi ya kwanza katika ‘bwana wangu’.
- source_word: נְקָמוֹת
  choice: kisasi
  rationale: Ingawa umbo la Kiebrania ni wingi, hapa lina nguvu ya kusisitiza na Kiswahili cha kawaida hutumia nomino ya umoja ‘kisasi’.
- source_word: זַרְעוֹ
  choice: uzao wake
  rationale: Inahifadhi taswira na upana wa neno la Kiebrania kwa vizazi au watu waliotokana na Sauli.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina maalumu la Mungu; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Dai la wauaji kwamba Yahwe alimpa Daudi kisasi
  choice: Kulihifadhi kama lilivyosemwa katika usemi wa moja kwa moja
  alternative: Kuongeza maneno yanayodokeza kwamba dai hilo lilikuwa la uongo au la kujisingizia
  rationale: Aya inanukuu madai ya wasemaji bila maelezo ya msimulizi; tathmini yake hutokana na muktadha unaofuata, hivyo tafsiri haipaswi kuingiza hukumu hapa.
- issue: Mhusika anayeelezwa kuwa adui aliyekuwa akitaka kumuua Daudi
  choice: Sauli
  alternative: Ish-boshethi
  rationale: Ukaribu wa kisarufi wa ‘adui yako, aliyetaka uhai wako’ na Sauli, pamoja na muktadha wa kihistoria, unaelekeza maelezo hayo kwa Sauli; mpangilio wa Kiswahili unahifadhi uhusiano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Majina yametoholewa kwa maumbo yanayoeleweka katika matumizi ya Biblia ya Kiswahili; usemi wa wahusika umeachwa bila kuongeza tathmini ya kitheolojia.
