source:
  edition: WLC
  text: כִּ֣י הַ/מַּגִּיד֩ לִ֨/י לֵ/אמֹ֜ר הִנֵּה מֵ֣ת שָׁא֗וּל וְ/הֽוּא הָיָ֤ה כִ/מְבַשֵּׂר֙ בְּ/עֵינָ֔י/ו וָ/אֹחֲזָ֣/ה ב֔/וֹ וָ/אֶהְרְגֵ֖/הוּ בְּ/צִֽקְלָ֑ג אֲשֶׁ֥ר לְ/תִתִּ/י ל֖/וֹ בְּשֹׂרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/010.yaml
  text: When someone told me[a], saying, ‘Look, Saul is dead,’ and he thought he was bringing good news in his own eyes[b], I seized him and killed him in Ziklag—that was the reward I gave him for his news.
translation:
  language: sw
  text: Kwa maana yule aliyeniambia, ‘Tazama, Sauli amekufa,’ akidhani kwamba alikuwa analeta habari njema,[a] nilimshika na kumuua huko Siklagi. Huo ndio ujira niliompa kwa habari yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “naye alikuwa kama mleta habari njema machoni pake.” Yaani, kwa maoni yake mwenyewe alidhani analeta habari njema.'
    reason: lexical_alternative
  - marker: b
    text: 'Kishazi cha mwisho katika Kiebrania kimebanwa na kinaelekea kuwa cha kejeli: badala ya malipo aliyotarajia kwa kuleta habari za kifo cha Sauli, mleta habari alipata kuuawa.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaunganisha mfano huu na hoja ya Daudi katika muktadha. ‘Kwa maana’ huhifadhi wazi uhusiano huo wa kutoa sababu, huku tukio lenyewe likisimuliwa kwa wakati uliopita.
- source_word: הַמַּגִּיד לִי לֵאמֹר
  choice: yule aliyeniambia
  rationale: Nomino-jina inayotokana na kitenzi ina maana ya ‘yule aliyeniambia.’ Kiswahili hakihitaji kutafsiri לֵאמֹר kwa neno tofauti kabla ya nukuu ya moja kwa moja.
- source_word: הִנֵּה מֵת שָׁאוּל
  choice: ‘Tazama, Sauli amekufa,’
  rationale: ‘Tazama’ ni mwito wa kuzingatia unaolingana na הִנֵּה, na ‘amekufa’ hutoa kwa kawaida hali iliyotokana na kifo cha Sauli.
- source_word: וְהוּא הָיָה כִמְבַשֵּׂר בְּעֵינָיו
  choice: akidhani kwamba alikuwa analeta habari njema
  rationale: Maneno ‘machoni pake’ ni nahau ya Kiebrania inayomaanisha kwa maoni au makadirio yake mwenyewe. ‘Akidhani’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuondoa kejeli ya muktadha.
- source_word: וָאֹחֲזָה בוֹ
  choice: nilimshika
  rationale: אָחַז humaanisha kushika kwa nguvu au kumtia mtu mikononi. ‘Nilimshika’ ni ya moja kwa moja na haiongezi wazo maalumu la kukamatwa kisheria.
- source_word: וָאֶהְרְגֵהוּ
  choice: na kumuua
  rationale: Kitenzi kina maana ya moja kwa moja ya kuua; tafsiri hii haiingizi maelezo ya hukumu ambayo hayajasemwa wazi katika kitenzi.
- source_word: בְּצִקְלָג
  choice: huko Siklagi
  rationale: Jina la mahali limetolewa kwa umbo la Kiswahili linalotumika kwa kawaida; ‘huko’ linaonyesha mahali pa tukio kwa mtiririko wa kawaida.
- source_word: אֲשֶׁר לְתִתִּי לוֹ בְּשֹׂרָה
  choice: Huo ndio ujira niliompa kwa habari yake
  rationale: 'Kishazi cha Kiebrania kimebanwa na kina kejeli: mleta habari alitarajia malipo, lakini alichopata ni kuuawa. ‘Ujira’ huonyesha malipo yaliyotarajiwa huku sentensi ikihifadhi kejeli hiyo.'
