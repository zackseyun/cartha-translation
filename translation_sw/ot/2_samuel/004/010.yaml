translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Tazama,’ ‘ujira,’ na majina ‘Sauli’ na ‘Siklagi’ yanaendana na sajili ya simulizi la Biblia; miundo migumu ya nahau ya Kiebrania imefafanuliwa kwa kiasi bila kufuta kejeli ya kifungu.
