  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ הַ/בַּ֗יִת וְ/הֽוּא שֹׁכֵ֤ב עַל מִטָּת/וֹ֙ בַּ/חֲדַ֣ר מִשְׁכָּב֔/וֹ וַ/יַּכֻּ֨/הוּ֙ וַ/יְמִתֻ֔/הוּ וַ/יָּסִ֖ירוּ אֶת רֹאשׁ֑/וֹ וַ/יִּקְחוּ֙ אֶת רֹאשׁ֔/וֹ וַ/יֵּֽלְכ֛וּ דֶּ֥רֶךְ הָ/עֲרָבָ֖ה כָּל הַ/לָּֽיְלָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/007.yaml
  text: They came into the house while he was lying on his bed in his bedroom[a], and they struck him and put him to death. Then they removed his head, took his head[c][b], and went by way of the Arabah all night.
translation:
  language: sw
  text: Wakaingia nyumbani alipokuwa amelala kitandani mwake katika chumba chake cha kulala[a]. Wakampiga na kumuua. Kisha wakaondoa kichwa chake[c], wakakichukua, nao wakasafiri kwa njia ya Araba[b] usiku kucha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika chumba alicholalia.”
    reason: lexical_alternative
  - marker: b
    text: Araba ni eneo la bonde tambarare la ufa wa Yordani; Kiebrania kinatumia jina la kijiografia.
    reason: cultural_note
  - marker: c
    text: Au, “wakakata kichwa chake.” Kitenzi cha Kiebrania kihalisi zaidi humaanisha “wakaondoa kichwa chake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ הַבַּיִת
  choice: Wakaingia nyumbani
  rationale: Kitenzi בוא pamoja na הַבַּיִת kinaonyesha kuingia ndani ya nyumba; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: וְהוּא שֹׁכֵב עַל מִטָּתוֹ
  choice: alipokuwa amelala kitandani mwake
  rationale: Kishazi hiki kinaeleza hali yake wakati walipoingia; 'alipokuwa amelala' huonyesha vizuri maana hiyo ya wakati na mazingira.
- source_word: בַּחֲדַר מִשְׁכָּבוֹ
  choice: katika chumba chake cha kulala
  rationale: Kirai hiki kinamaanisha chumba alicholalia; tafsiri hii ni ya asili, yenye heshima, na haiongezi maana isiyokuwamo.
- source_word: וַיַּכֻּהוּ וַיְמִתֻהוּ
  choice: Wakampiga na kumuua
  rationale: 'Vitenzi viwili vimehifadhiwa: kwanza walimpiga, kisha wakasababisha afe. ''Kumuua'' ni Kiswahili cha kawaida kwa Hifili ya מות katika muktadha huu.'
- source_word: וַיָּסִירוּ אֶת־רֹאשׁוֹ
  choice: wakaondoa kichwa chake
  rationale: Hifili ya סור kimsingi ni 'kuondoa'; muktadha unadokeza kukikata, lakini tafsiri kuu inahifadhi upana wa kitenzi cha Kiebrania.
- source_word: וַיִּקְחוּ אֶת־רֹאשׁוֹ
  choice: wakakichukua
  rationale: לקח ni 'kuchukua.' Kiwakilishi '-ki-' kinarejelea kichwa kwa uwazi na kuepuka uradidi mzito usio wa kawaida katika Kiswahili.
- source_word: וַיֵּלְכוּ דֶּרֶךְ הָעֲרָבָה
  choice: wakasafiri kwa njia ya Araba
  rationale: דֶּרֶךְ ina maana ya kupitia njia au eneo hilo. 'Araba' limehifadhiwa kama jina la kijiografia badala ya kutafsiriwa kwa neno la jumla.
- source_word: כָּל־הַלָּיְלָה
  choice: usiku kucha
  rationale: Huu ndio usemi wa kawaida wa Kiswahili unaowasilisha kikamilifu maana ya 'usiku wote.'
