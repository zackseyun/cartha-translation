  text: וַ/יְצַו֩ דָּוִ֨ד אֶת הַ/נְּעָרִ֜ים וַ/יַּהַרְג֗וּ/ם וַֽ/יְקַצְּצ֤וּ אֶת יְדֵי/הֶם֙ וְ/אֶת רַגְלֵי/הֶ֔ם וַ/יִּתְל֥וּ עַל הַ/בְּרֵכָ֖ה בְּ/חֶבְר֑וֹן וְ/אֵ֨ת רֹ֤אשׁ אִֽישׁ בֹּ֨שֶׁת֙ לָקָ֔חוּ וַ/יִּקְבְּר֥וּ בְ/קֶֽבֶר אַבְנֵ֖ר בְּ/חֶבְרֽוֹן־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/012.yaml
  text: Then David commanded the young men[a], and they killed them and cut off their hands and their feet and hung them by the pool at Hebron. But they took the head of Ish-bosheth and buried it in the tomb of Abner at Hebron.
translation:
  language: sw
  text: Ndipo Daudi akawaamuru wale vijana, nao wakawaua watu hao, wakawakata mikono yao na miguu yao mbali, kisha wakawatundika penye bwawa[a] huko Hebroni. Nao wakachukua kichwa cha Ish-boshethi na kukizika katika kaburi la Abneri huko Hebroni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawatundika juu ya bwawa.” Kihusishi cha Kiebrania kinaweza pia kuonyesha mahali kwa maana pana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו דָּוִד אֶת הַנְּעָרִים
  choice: Ndipo Daudi akawaamuru wale vijana
  rationale: “Ndipo” huendeleza mfuatano wa simulizi kwa kawaida; צוה imetafsiriwa moja kwa moja kuwa “akaamuru.” נְעָרִים inaweza kumaanisha vijana au watumishi, lakini “wale vijana” inadumisha maana yake ya msingi bila kuficha kwamba walikuwa watekelezaji wa amri ya Daudi.
- source_word: וַיַּהַרְגוּם
  choice: nao wakawaua watu hao
  rationale: הרג ni neno la kawaida la kuua. “Watu hao” huweka wazi rejeo la kiwakilishi cha wingi bila kuongeza wazo la hukumu ya kisheria lisilotajwa wazi katika kitenzi.
- source_word: וַיְקַצְּצוּ אֶת יְדֵיהֶם וְאֶת רַגְלֵיהֶם
  choice: wakawakata mikono na miguu
  rationale: קצץ humaanisha kukata au kukata kabisa. Kiswahili cha kawaida hakihitaji kurudia kiwakilishi milikishi kwa kila kiungo; usemi huu bado unaonyesha wazi ukatili wa tendo lililosimuliwa.
- source_word: וַיִּתְלוּ עַל הַבְּרֵכָה
  choice: wakawatundika kando ya bwawa
  rationale: תלה imetafsiriwa kuwa “kutundika.” Kihusishi עַל hapa kinaweza kuonyesha mahali karibu na bwawa badala ya kumaanisha juu yake moja kwa moja; “kando ya bwawa” ni tafsiri ya kawaida na ya asili.
- source_word: בְּחֶבְרוֹן
  choice: huko Hebroni
  rationale: “Huko Hebroni” ni namna ya kawaida ya Kiswahili ya kutaja eneo hilo, na imetumiwa mara zote mbili kwa uthabiti.
- source_word: רֹאשׁ אִישׁ בֹּשֶׁת
  choice: kichwa cha Ish-boshethi
  rationale: Huu ni uhamishaji wa moja kwa moja wa muundo wa umilikaji wa Kiebrania, huku jina likiandikwa kwa namna inayosomeka kwa Kiswahili.
- source_word: לָקָחוּ
  choice: wakachukua
  rationale: לקח ni kitenzi cha kawaida cha kuchukua; hakuna haja ya kukifasiri kwa maana maalumu zaidi kama kuondoa au kuokoa.
- source_word: וַיִּקְבְּרוּ בְקֶבֶר אַבְנֵר
  choice: na kukizika katika kaburi la Abneri
  rationale: Kitu kinachodokezwa na kitenzi ni kichwa cha Ish-boshethi, hivyo kiambishi “-ki-” kinakirejelea wazi. קבר imetafsiriwa kwa neno la kawaida “kaburi.”
theological_decisions:
- issue: Mtazamo wa kimaadili au kiteolojia kuhusu tendo la Daudi
  choice: Kusimulia amri na matendo yaliyofuata bila kuongeza hukumu ya kimaadili ambayo mstari wenyewe hautoi.
  alternative: Kutumia lugha ya wazi ya kimahakama kama “akawanyonga kwa hukumu” au “akawaamuru wauawe kama adhabu.”
  rationale: Mstari unaeleza amri ya Daudi, kuuawa kwa watu hao, kukatwa kwa viungo vyao, na kutundikwa kwao hadharani, lakini hautoi hapa maelezo ya moja kwa moja kuhusu uadilifu wa tendo hilo. Tafsiri inadumisha ukali na mvutano wa simulizi bila kuingiza tathmini ya ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Majina yameandikwa kama Ish-boshethi, Abneri, na Hebroni ili yasomeke kwa urahisi katika Kiswahili. Kiunganishi “Nao” katika sentensi ya pili kinadumisha waw ya Kiebrania bila kulazimisha utofauti mkali wa “lakini” ambao haujawekwa wazi katika chanzo.
