  text: וְ֠/הֵנָּה בָּ֜אוּ עַד תּ֤וֹךְ הַ/בַּ֨יִת֙ לֹקְחֵ֣י חִטִּ֔ים וַ/יַּכֻּ֖/הוּ אֶל הַ/חֹ֑מֶשׁ וְ/רֵכָ֛ב וּ/בַעֲנָ֥ה אָחִ֖י/ו נִמְלָֽטוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/006.yaml
  text: And there they came into the midst of the house[a], taking wheat, and they struck him in the belly. Then Rekab and Baanah his brother escaped.
translation:
  language: sw
  text: Nao wakaingia mpaka ndani ya nyumba[a] wakichukua ngano, wakampiga tumboni. Kisha Rekabu na Baana ndugu yake wakatoroka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka katikati ya nyumba.” Kirai cha Kiebrania kinaweza kumaanisha sehemu ya ndani au katikati ya nyumba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנָּה
  choice: Nao
  rationale: Inaendeleza simulizi na kuelekeza kwenye hatua inayofuata bila kutumia mshangao wa kizamani kama “tazama.”
- source_word: בָּאוּ עַד תּוֹךְ הַבַּיִת
  choice: wakaingia mpaka ndani ya nyumba
  rationale: Kitenzi na kirai cha mahali vinaonyesha kuingia hadi sehemu ya ndani ya nyumba; Kiswahili hiki ni cha kawaida na kinahifadhi msisitizo wa kufika ndani.
- source_word: לֹקְחֵי חִטִּים
  choice: wakichukua ngano
  rationale: Kirai shiriki cha Kiebrania kimeachwa katika maana yake ya moja kwa moja bila kuongeza wazi wazo la kujifanya, ingawa muktadha unaweza kulidokeza.
- source_word: וַיַּכֻּהוּ
  choice: wakampiga
  rationale: נכה humaanisha kupiga; tafsiri haibadilishi kitendo hiki kuwa “kumuua,” ingawa kifo kinafuata katika muktadha.
- source_word: אֶל הַחֹמֶשׁ
  choice: tumboni
  rationale: חֹמֶשׁ hapa inaelekea kutaja eneo la tumbo; neno la kawaida “tumboni” linafaa kuliko tafsiri ya kimapokeo ya ubavu wa tano.
- source_word: וְרֵכָב וּבַעֲנָה אָחִיו
  choice: Kisha Rekabu na Baana ndugu yake
  rationale: Majina yamenukuliwa kwa mwandiko unaofaa Kiswahili, na “kisha” linaonyesha mfuatano wa matukio. Umoja wa “ndugu yake” unahifadhi muundo wa Kiebrania unaomtaja Baana kuwa ndugu ya Rekabu.
- source_word: נִמְלָטוּ
  choice: wakatoroka
  rationale: Nifali ya מלט inaonyesha kufanikiwa kuponyoka; “wakatoroka” ni ya asili katika simulizi la Kiswahili.
