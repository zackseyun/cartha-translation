base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/011.yaml
  text: How much more[a], when wicked men have killed a righteous man in his own house on his bed[b], should I not now require his blood from your hand and purge you from the land?
translation:
  language: sw
  text: Basi, watu waovu walipomwua mtu mwadilifu katika nyumba yake mwenyewe, akiwa kitandani mwake, je, sasa si zaidi sana nitadai damu yake mikononi mwenu[a] na kuwaondoa kutoka nchini[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, “kuwawajibisha kwa damu yake.” Kiebrania kinasema kihalisi, “kuidai damu yake mikononi mwenu.”
    reason: lexical_alternative
  - marker: b
    text: “Kuwaondoa kutoka nchini” hapa kunamaanisha kuwaondoa wauaji kwa hukumu, si kufanya utakaso wa kiibada tu.
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  choice: Je, si lazima nifanye hivyo zaidi sana, wakati
  rationale: Kirai hiki kinaendeleza hoja ya kutoka jambo dogo katika mstari uliotangulia kwenda jambo kubwa zaidi hapa. Muundo huu wa Kiswahili unaonyesha mantiki hiyo kwa njia ya kawaida na inayoeleweka.
- source_word: אֲנָשִׁים רְשָׁעִים
  choice: watu waovu
  rationale: Huhifadhi hukumu ya kimaadili iliyo wazi katika Kiebrania bila kuongeza maana ya kiufundi ya kuvunja sheria.
- source_word: הָרְגוּ
  choice: wamemuua
  rationale: Kitenzi cha Kiebrania ni neno la kawaida la kuua; tafsiri hii haiongezi kimakusudi neno lenye maana mahsusi zaidi la kuua kwa hila, ingawa muktadha unaonyesha kosa la mauaji.
- source_word: אִישׁ צַדִּיק
  choice: mtu mwadilifu
  rationale: Hufuata maana ya kawaida ya צַדִּיק na kuhifadhi tathmini kwamba mtu huyo hakustahili kuuawa kwa namna hiyo.
- source_word: בְּבֵיתוֹ עַל מִשְׁכָּבוֹ
  choice: nyumbani mwake, kitandani mwake
  rationale: Hutoa kwa kawaida mahali pa faragha na hali ya kutokuwa na ulinzi inayosisitizwa na maandishi.
- source_word: הֲלוֹא אֲבַקֵּשׁ אֶת דָּמוֹ מִיֶּדְכֶם
  choice: je, sitaitaka damu yake kutoka mikononi mwenu
  rationale: Huhifadhi taswira halisi ya Kiebrania ya kuitaka damu kutoka mkononi mwa wahusika, huku tanbihi ikifafanua maana yake ya kuwawajibisha kwa umwagaji damu.
- source_word: וּבִעַרְתִּי אֶתְכֶם מִן הָאָרֶץ
  choice: na kuwaondoa katika nchi
  rationale: Katika muktadha huu בער inaeleza kuwaondoa wahalifu kwa hukumu. 'Kuwaondoa' ni Kiswahili cha kawaida na huepuka kutoa wazo lisilokusudiwa la utakaso wa kiibada tu.
theological_decisions:
- issue: Iwapo nahau ya kisheria kuhusu damu itafsiriwe moja kwa moja kuwa kulipiza kisasi au ihifadhiwe kwa taswira yake ya Kiebrania
  choice: Kuhifadhi katika matini kuu maneno “kuitaka damu yake kutoka mikononi mwenu”
  alternative: kuwawajibisha kwa damu yake; kulipiza kisasi kwa ajili ya damu yake
  rationale: Nahau hiyo ni ya hukumu na uwajibikaji, si lazima iwe kisasi cha kibinafsi. Kuhifadhi neno 'damu' kunadumisha uzito na lugha ya kisheria ya Agano la Kale, huku tanbihi ikisaidia kueleza maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la balagha umehifadhiwa, na “nifanye hivyo zaidi sana” unaunganisha wazi hoja hii na hatua ya Daudi katika mstari uliotangulia.
