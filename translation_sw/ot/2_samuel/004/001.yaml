  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumiwa kwa “aliposikia ... ikalegea ... ikafadhaika,” na nahau ya chanzo imehifadhiwa huku maana yake ikifafanuliwa katika tanbihi.
