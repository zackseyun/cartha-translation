base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/001.yaml
  text: When Saul’s son heard that Abner had died in Hebron[a], his hands became weak, and all Israel was alarmed.
translation:
  language: sw
  text: Mwana wa Sauli aliposikia kwamba Abneri alikuwa amekufa huko Hebroni, mikono yake ikalegea[a], na Israeli yote ikafadhaika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, alipoteza nguvu au ujasiri.
    reason: Nahau ya Kiebrania “mikono yake ikalegea” inaweza isieleweke mara moja kwa msomaji wa kisasa.
lexical_decisions:
- source_word: בֶּן שָׁאוּל
  choice: Mwana wa Sauli
  rationale: Huhifadhi utambulisho usio wa moja kwa moja wa Kiebrania bila kuingiza jina la Ish-boshethi, ambalo halipo katika mstari huu.
- source_word: כִּי מֵת אַבְנֵר
  choice: kwamba Abneri alikuwa amekufa
  rationale: “Kwamba” huanzisha yaliyomo katika habari aliyosikia; wakati timilifu “alikuwa amekufa” huonyesha kuwa kifo kilitangulia kusikia.
- source_word: בְּחֶבְרוֹן
  choice: huko Hebroni
  rationale: Ni usemi wa kawaida wa Kiswahili wa kuonyesha mahali, huku “huko” ikifaa katika simulizi kuhusu tukio lililotokea mahali hapo.
- source_word: וַיִּרְפּוּ יָדָיו
  choice: mikono yake ikalegea
  rationale: Huhifadhi taswira halisi ya nahau ya Kiebrania ya mikono kulegea, inayodokeza kupoteza nguvu au ujasiri.
- source_word: כָל יִשְׂרָאֵל
  choice: Israeli yote
  rationale: Huhifadhi jina la taifa kama kundi zima badala ya kulibadili kuwa “Waisraeli wote.”
- source_word: נִבְהָלוּ
  choice: ikafadhaika
  rationale: Kitenzi kinaonyesha kushtuka, kuvurugika, au kuingiwa na hofu; “ikafadhaika” ni pana na ya asili bila kuzidisha kiwango cha hofu.
