source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֔ל טוֹבָ֗ה עֲצַת֙ חוּשַׁ֣י הָ/אַרְכִּ֔י מֵ/עֲצַ֖ת אֲחִיתֹ֑פֶל וַ/יהוָ֣ה צִוָּ֗ה לְ/הָפֵ֞ר אֶת עֲצַ֤ת אֲחִיתֹ֨פֶל֙ הַ/טּוֹבָ֔ה לְ/בַ/עֲב֗וּר הָבִ֧יא יְהוָ֛ה אֶל אַבְשָׁל֖וֹם אֶת הָ/רָעָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/014.yaml
  text: Then Absalom and all the men of Israel said[a], “The counsel of Hushai the Archite is better than the counsel of Ahithophel.” For Yahweh had ordained to frustrate the good counsel of Ahithophel[b], so that Yahweh might bring disaster on Absalom.
translation:
  language: sw
  text: Ndipo Absalomu na wanaume wote wa Israeli wakasema, “Shauri la Hushai, Mwariki, ni bora kuliko shauri la Ahithofeli.” Kwa maana Yahwe alikuwa ameamuru[a] kulibatilisha shauri jema la Ahithofeli, ili Yahwe amletee Absalomu maafa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa amekusudia kulibatilisha.” Kitenzi cha Kiebrania kwa kawaida humaanisha “kuamuru,” lakini hapa kinaeleza uamuzi wa Yahwe wenye matokeo kuhusu shauri la Ahithofeli.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza pia kumaanisha “uovu,” “madhara,” au “msiba”; hapa linarejelea maangamizi yatakayompata Absalomu katika hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... wakasema
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” huonyesha mfuatano huo kwa Kiswahili cha kawaida, huku kitenzi cha wingi kikilingana na wahusika wawili wa kisarufi.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: na wanaume wote wa Israeli
  rationale: אִישׁ ni umbo la umoja linalotumiwa kwa maana ya mkusanyiko hapa. “Wanaume” huhifadhi rejeo la kijinsia la Kiebrania katika muktadha huu wa viongozi na wapiganaji.
- source_word: טוֹבָה ... מֵעֲצַת
  choice: ni bora kuliko shauri la
  rationale: Kivumishi טוֹבָה kina maana ya ulinganisho kwa sababu ya מִן; “ni bora kuliko” ni Kiswahili cha kawaida na sahihi.
- source_word: עֲצַת
  choice: shauri la
  rationale: עֵצָה linaweza kumaanisha shauri, ushauri, au mpango. “Shauri” huhifadhi maana ya ushauri wa kimkakati katika mazingira ya kifalme.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Hushai Mwariki
  rationale: “Mwariki” ni uwasilishaji wa Kiswahili wa jina la ukoo au mahali אַרְכִּי.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kwa namna ya moja kwa moja kama “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: צִוָּה
  choice: alikuwa ameamuru
  rationale: Maana ya kawaida ya צוה ni “kuamuru.” Wakati timilifu uliopita unaonyesha kwamba uamuzi wa Yahwe ulitangulia kauli ya Absalomu na watu wa Israeli.
- source_word: לְהָפֵר
  choice: libatilishwe
  rationale: Hifili ya פרר hapa ina maana ya kufanya shauri lisifanikiwe au lisitende kazi. “Libatilishwe” linafaa kwa shauri na huonyesha kuondolewa kwa nguvu au ufanisi wake.
- source_word: הַטּוֹבָה
  choice: jema
  rationale: Maandiko yenyewe yanaliita shauri la Ahithofeli “jema”; neno hilo limehifadhiwa bila kulifanya kuwa jema kimaadili badala ya lenye ufanisi.
- source_word: לְבַעֲבוּר
  choice: ili
  rationale: Kirai hiki huonyesha kusudi au matokeo yaliyokusudiwa; “ili” ni kifupi na cha kawaida kwa Kiswahili.
- source_word: הָבִיא ... אֶל
  choice: amletee
  rationale: Muundo wa Kiswahili wenye kiambishi cha mtendewa huwasilisha kuletwa kwa jambo kwa Absalomu kwa njia ya kawaida.
- source_word: הָרָעָה
  choice: maafa
  rationale: רָעָה hapa linamaanisha uharibifu, madhara, au msiba unaomjia Absalomu katika hukumu, si uovu wa kimaadili.
theological_decisions:
- issue: Kitendo cha Mungu katika צִוָּה לְהָפֵר
  choice: Yahwe alikuwa ameamuru ... libatilishwe
  alternative: Yahwe alikuwa amekusudia kulibatilisha
  rationale: Tafsiri kuu huhifadhi maana ya kawaida ya צִוָּה, “kuamuru,” na inaacha wazi namna amri hiyo ilivyotekelezwa. Maana ya uamuzi wenye matokeo imeelezwa katika tanbihi bila kuingiza mfumo maalumu wa kiteolojia.
- issue: Tathmini ya shauri la Ahithofeli
  choice: shauri jema
  alternative: shauri lenye kufaa
  rationale: Tafsiri huhifadhi tathmini ya moja kwa moja ya Kiebrania kwamba shauri hilo lilikuwa “jema,” licha ya kutolewa dhidi ya Daudi, hivyo haiondoi mvutano kati ya ufanisi wa shauri na kusudi la Yahwe.
- issue: Maana ya הָרָעָה katika kitendo cha Yahwe
  choice: maafa
  alternative: uovu au msiba
  rationale: Katika muktadha huu neno linarejelea anguko au madhara yatakayompata Absalomu katika hukumu. “Maafa” huhifadhi uzito wa jambo bila kudokeza kwamba Yahwe anatenda uovu wa kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Shauri,” “libatilishwe,” na “maafa” hudumisha uzito wa kifungu bila kuwa vya kizamani kupita kiasi. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
