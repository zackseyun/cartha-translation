  text: וַ/יֹּ֥אמֶר אֲחִיתֹ֖פֶל אֶל אַבְשָׁלֹ֑ם אֶבְחֲרָ֣ה נָּ֗א שְׁנֵים עָשָׂ֥ר אֶ֨לֶף֙ אִ֔ישׁ וְ/אָק֛וּמָה וְ/אֶרְדְּפָ֥ה אַחֲרֵי דָוִ֖ד הַ/לָּֽיְלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/001.yaml
  text: Then Ahithophel said to Absalom[a], “Please let me choose twelve thousand men, and let me arise and pursue David tonight.”
translation:
  language: sw
  text: Kisha Ahithofeli akamwambia Absalomu[a], “Tafadhali, niruhusu nichague wanaume elfu kumi na mbili, kisha niondoke nikamfuatie Daudi usiku wa leo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “Tafadhali, nitachagua wanaume elfu kumi na mbili, nitaondoka na kumfuatia Daudi usiku huu.”'
    reason: Kiebrania kinaweza kuwasilishwa ama kama ombi la ruhusa ama kama pendekezo lililotamkwa kwa kauli ya nafsi ya kwanza.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida, huku kiambishi cha yambwa katika ‘akamwambia’ kikionyesha kwamba maneno yanaelekezwa kwa Absalomu.
- source_word: אֲחִיתֹפֶל
  choice: Ahithofeli
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אַבְשָׁלֹם
  choice: Absalomu
  rationale: Jina limetoholewa kwa kufuata matumizi yaliyozoeleka katika Kiswahili.
- source_word: אֶבְחֲרָה נָּא
  choice: Tafadhali, niruhusu nichague
  rationale: Kitenzi cha kusudi pamoja na נָא kinaonyesha ombi au pendekezo la heshima. Tafsiri hii ni ya asili kwa Kiswahili na inadumisha wazo la Ahithofeli kuomba ruhusa.
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: wanaume elfu kumi na mbili
  rationale: ‘Wanaume’ hudumisha maana ya msingi ya אִישׁ bila kuongeza neno maalumu zaidi kama ‘askari,’ ingawa muktadha ni wa kijeshi.
- source_word: וְאָקוּמָה
  choice: kisha niondoke
  rationale: Ingawa קום kimsingi ni ‘kuinuka,’ katika muktadha huu inaashiria kuanza safari au kuchukua hatua mara moja; ‘niondoke’ ni Kiswahili cha asili na sahihi kimuktadha.
- source_word: וְאֶרְדְּפָה אַחֲרֵי דָוִד
  choice: nikamfuatie Daudi
  rationale: רדף pamoja na אַחֲרֵי ina maana ya kumfuata mtu kwa lengo la kumkamata au kumshambulia. ‘Nikamfuatie’ huwasilisha mwendo wa hatua unaofuata kuondoka bila uradidi usio wa asili.
- source_word: הַלָּיְלָה
  choice: usiku wa leo
  rationale: Nomino yenye kibainishi inarejelea usiku huo wa sasa; ‘usiku wa leo’ ni usemi wazi na wa kawaida wa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina yametoholewa kwa maumbo yaliyozoeleka katika mapokeo ya Biblia za Kiswahili; sentensi imeundwa kwa mtiririko wa kawaida wa simulizi na bila kuongeza istilahi za kijeshi ambazo hazitajwi wazi katika Kiebrania.
