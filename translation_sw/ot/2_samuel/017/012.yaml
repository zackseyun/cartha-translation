  text: וּ/בָ֣אנוּ אֵלָ֗י/ו ב/אחת הַ/מְּקוֹמֹת֙ אֲשֶׁ֣ר נִמְצָ֣א שָׁ֔ם וְ/נַ֣חְנוּ עָלָ֔י/ו כַּ/אֲשֶׁ֛ר יִפֹּ֥ל הַ/טַּ֖ל עַל הָ/אֲדָמָ֑ה וְ/לֹֽא נ֥וֹתַר בּ֛/וֹ וּ/בְ/כָל הָ/אֲנָשִׁ֥ים אֲשֶׁר אִתּ֖/וֹ גַּם אֶחָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/012.yaml
  text: Then we will come upon him in one of the places where he is found[a], and we will settle on him just as the dew falls on the ground; and not one will be left of him and of all the men who are with him—not even one.
translation:
  language: sw
  text: Kisha tutamjia katika mojawapo ya mahali ambako atapatikana, nasi tutatua juu yake[a] kama umande uangukavyo juu ya ardhi. Wala hatasalia hata mmoja—si yeye wala yeyote miongoni mwa watu wote walio pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tutamshukia.” Kitenzi cha Kiebrania humaanisha kihalisi “kutua,” “kutulia,” au “kukaa,” na hapa kimetumiwa katika tashbihi ya kijeshi kuonyesha wavamizi wakimfunika adui kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאנוּ אֵלָיו
  choice: Kisha tutamjia
  rationale: Kitenzi בוא kimsingi humaanisha kuja au kufika. Katika mpango huu wa kijeshi, “tutamjia” huhifadhi maana ya kumwendea kwa nia ya kumshambulia bila kubadili kitenzi kuwa “tutamvamia.” “Kisha” huonyesha mfuatano wa mpango.
- source_word: בְאַחַת הַמְּקוֹמֹת אֲשֶׁר נִמְצָא שָׁם
  choice: katika mahali mojawapo atakapopatikana
  rationale: Tafsiri hii huhifadhi wazo la mahali popote ambapo Daudi atapatikana na pia maana ya hali ya kutendwa katika נִמְצָא.
- source_word: וְנַחְנוּ עָלָיו
  choice: nasi tutatua juu yake
  rationale: נוּחַ humaanisha kutua, kutulia au kukaa. “Tutua juu yake” huhifadhi picha ya kitu kinachotanda baada ya kutua na tofauti ya kimakusudi na kitenzi יִפֹּל, “uangukavyo,” katika tashbihi inayofuata.
- source_word: כַּאֲשֶׁר יִפֹּל הַטַּל עַל הָאֲדָמָה
  choice: kama umande uangukavyo juu ya ardhi
  rationale: Huhifadhi tashbihi ya Kiebrania na picha ya umande unaofunika ardhi kwa upana.
- source_word: וְלֹא נוֹתַר ... גַּם אֶחָד
  choice: Wala hatabaki hata mmoja
  rationale: נוֹתַר huonyesha kubaki au kunusurika, na גַּם אֶחָד hukazia kwamba hakuna hata mtu mmoja atakayebaki.
- source_word: בּוֹ וּבְכָל הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: si yeye wala mmoja wa watu wote walio pamoja naye
  rationale: Muundo huu wa kawaida wa Kiswahili unaeleza wazi kwamba kauli hiyo inamhusu Daudi mwenyewe na kundi lake lote bila kupoteza mkazo wa uangamizi kamili.
