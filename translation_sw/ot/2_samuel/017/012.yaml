revisions:
- from: Kisha tutamjia katika mahali mojawapo atakapopatikana, nasi tutatua juu yake[a] kama umande uangukavyo juu ya ardhi. Wala hatabaki hata mmoja—si yeye wala mmoja wa watu wote walio pamoja naye.
  to: Kisha tutamjia katika mojawapo ya mahali ambako atapatikana, nasi tutatua juu yake[a] kama umande uangukavyo juu ya ardhi. Wala hatasalia hata mmoja—si yeye wala yeyote miongoni mwa watu wote walio pamoja naye.
  rationale: Revisions improve the idiomatic rendering of “one of the places” and make the emphatic total-negation of David and all his companions unambiguous. They retain “tutatua juu yake” to reflect נוּחַ and preserve its deliberate contrast with the dew that “falls.”
  reviewer_model: gpt-5.6-terra
