  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa kawaida. “Tutua juu yake” ni picha yenye uzito wa kishairi inayohifadhi kitenzi cha Kiebrania na haitanganyi kwa kimakosa na “uangukavyo” katika sehemu inayofuata.
