review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the contrast between וְנַחְנוּ (“we will settle/come to rest”) and יִפֹּל (“falls”) in the dew simile. However, the final clause is more precise if it explicitly denies that David or any person with him will remain.
  naturalness: “Katika mahali mojawapo atakapopatikana” is understandable but less idiomatic and slightly ambiguous. “Katika mojawapo ya mahali ambako atapatikana” is clearer Standard East African Swahili. The revised final clause is also more natural and fully expresses the exhaustive scope.
  terminology: “Tutatua juu yake” suitably renders the settling/resting image without confusing it with the falling of dew. “Umande,” “ardhi,” and the military register are appropriate. The lexical footnote remains warranted, with wording adjusted to avoid unnecessarily supplying “army.”
  issues:
  - severity: medium
    issue: The final clause, “si yeye wala mmoja wa watu wote walio pamoja naye,” can be read as denying David and only one member of his group, rather than stating that no one at all will remain.
    rationale: The Hebrew ends with an emphatic “not even one,” extending the claim to David and every man with him. “Yeyote miongoni mwa watu wote” makes the totality explicit.
  - severity: low
    issue: “Katika mahali mojawapo atakapopatikana” lacks the explicit plural construction corresponding to “one of the places.”
    rationale: Using “mojawapo ya mahali ambako” more directly represents the Hebrew phrase and reads more smoothly.
  revised_text: Kisha tutamjia katika mojawapo ya mahali ambako atapatikana, nasi tutatua juu yake[a] kama umande uangukavyo juu ya ardhi. Wala hatasalia hata mmoja—si yeye wala yeyote miongoni mwa watu wote walio pamoja naye.
  revised_footnotes:
  - marker: a
    text: Au “tutamshukia.” Kitenzi cha Kiebrania humaanisha kihalisi “kutua,” “kutulia,” au “kukaa,” na hapa kimetumiwa katika tashbihi ya kijeshi kuonyesha wavamizi wakimfunika adui kabisa.
    reason: lexical_alternative
