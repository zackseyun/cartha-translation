base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/005.yaml
  text: Then Absalom said[a], “Please call Hushai the Archite also, and let us hear what he too has to say.”
translation:
  language: sw
  text: Ndipo Absalomu akasema, “Tafadhali, mwite pia Hushai, Mwariki, nasi tusikie pia alicho nacho cha kusema.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “tusikie kilicho katika kinywa chake, yeye pia.” Usemi huo unamaanisha alicho nacho cha kusema.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Waw-consecutive inaendeleza simulizi kwa mfuatano; “Ndipo ... akasema” ni Kiswahili cha kawaida kinachoonyesha hatua inayofuata.
- source_word: קְרָא נָא
  choice: Tafadhali, mwite
  rationale: Amri ya umoja pamoja na נָא inaonyesha ombi la adabu; “Tafadhali, mwite” huhifadhi umoja na hisia hiyo.
- source_word: גַּם
  choice: pia
  rationale: גַּם ya kwanza inamwongeza Hushai kwa mshauri ambaye tayari amesikilizwa; “pia” huwasilisha maana hiyo kwa kawaida.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Hushai, Mwarki
  rationale: Jina limetoholewa kuwa “Hushai,” na neno la ukoo au mahali anapotoka limetolewa kwa mtindo wa kawaida wa Kiswahili, “Mwarki.”
- source_word: וְנִשְׁמְעָה
  choice: nasi tusikie
  rationale: Kitenzi cha nafsi ya kwanza wingi chenye maana ya pendekezo au nia kinawasilishwa kwa “tusikie,” huku kiunganishi kikihifadhi mwendelezo wa sentensi.
- source_word: מַה בְּפִיו
  choice: ana nini cha kusema
  rationale: Usemi wa Kiebrania “kilicho kinywani mwake” humaanisha jambo ambalo mtu atasema au kupendekeza; Kiswahili hiki ni cha kawaida bila kuongeza ufafanuzi usiokuwapo.
- source_word: גַּם הוּא
  choice: yeye pia
  rationale: Mpangilio huu unasisitiza kwamba Hushai naye asikilizwe; “yeye pia” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia usemi wa kawaida “ana nini cha kusema,” huku tanbihi ikihifadhi taswira halisi ya Kiebrania. “Mwite” imechaguliwa badala ya “mwiteni” ili kuakisi amri ya umoja katika chanzo.
