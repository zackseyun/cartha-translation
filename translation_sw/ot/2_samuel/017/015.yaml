base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/015.yaml
  text: Then Hushai said to Zadok and to Abiathar the priests[a], “This and that is what Ahithophel advised Absalom and the elders of Israel, and this and that is what I have advised.”
translation:
  language: sw
  text: Kisha Hushai akawaambia makuhani Sadoki na Abiathari, “Ahithofeli aliwashauri Absalomu na wazee wa Israeli hivi na hivi[a], nami nikashauri hivi na hivi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nahau ya Kiebrania “hivi na hivi” inaonyesha kiini cha yaliyosemwa bila kuyarudia neno kwa neno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akawaambia
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, na “akawaambia” inawakilisha kwa kawaida kusema kwa watu waliotajwa.
- source_word: חוּשַׁי ... צָדוֹק ... אֶבְיָתָר ... אֲחִיתֹפֶל ... אַבְשָׁלֹם
  choice: Hushai ... Sadoki ... Abiathari ... Ahithofeli ... Absalomu
  rationale: Majina yametoholewa kwa maumbo yanayotambulika katika mapokeo ya Biblia ya Kiswahili na yanayopatana na fonolojia ya Kiswahili.
- source_word: אֶל צָדוֹק וְאֶל אֶבְיָתָר הַכֹּהֲנִים
  choice: makuhani Sadoki na Abiathari
  rationale: Muundo huu unaweka wazi kwamba wote wawili ni makuhani, huku ukisomeka kwa urahisi katika Kiswahili cha sasa.
- source_word: כָּזֹאת וְכָזֹאת
  choice: hivi na hivi
  rationale: Ni nahau ya Kiswahili inayowasilisha muhtasari wa yaliyosemwa bila kudai kwamba maneno yanarudiwa neno kwa neno; urudiaji wake umehifadhiwa.
- source_word: יָעַץ
  choice: alimshauri / nikashauri
  rationale: Kitenzi kinahusu kutoa shauri la kimkakati katika muktadha wa kisiasa; “shauri” ni cha kawaida, chenye uzito unaofaa, na huhifadhi mzizi uleule katika sehemu zote mbili.
- source_word: יָעַצְתִּי אָנִי
  choice: nami nikashauri
  rationale: “Nami” huonyesha msisitizo na utofautishaji unaotokana na kiwakilishi huru אָנִי, bila kufanya sentensi iwe nzito.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini cha kawaida na kinachoeleweka. Ulinganifu wa sentensi umehifadhi tofauti kati ya shauri la Ahithofeli na la Hushai.
