base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/016.yaml
  text: Now send quickly and tell David[a], saying, ‘Do not stay tonight at the fords of the wilderness, but be sure to cross over, lest the king and all the people who are with him be swallowed up.’
translation:
  language: sw
  text: 'Sasa basi, tumeni haraka, mkamwambie Daudi hivi: “Usikeshe usiku huu katika tambarare za jangwa[a], bali uvuke hakika, la sivyo mfalme na watu wote walio pamoja naye watamezwa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye vivuko vya jangwa.” Neno la Kiebrania kwa kawaida humaanisha tambarare au nyanda za chini; tafsiri “vivuko” hutegemea muktadha unaosisitiza kuvuka na hatari iliyokuwa karibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sasa basi
  rationale: Ni kiashiria cha mazungumzo kinachoanzisha hatua ya haraka inayofuata; “Sasa basi” ni ya kawaida na huhifadhi msisitizo wa wakati huo.
- source_word: שִׁלְחוּ מְהֵרָה
  choice: tumeni ujumbe haraka
  rationale: Kitenzi ni amri ya wingi na kinaonyesha kutuma ujumbe au wajumbe. Kuongeza “ujumbe” kunafanya Kiswahili kiwe wazi bila kubadili tendo linalokusudiwa.
- source_word: וְהַגִּידוּ לְדָוִד לֵאמֹר
  choice: mkamwambie Daudi hivi
  rationale: Hutoa kwa Kiswahili cha asili fomula ya Kiebrania ya kupeleka taarifa na kuanzisha maneno yanayonukuliwa.
- source_word: אַל תָּלֶן הַלַּיְלָה
  choice: Usilale usiku huu
  rationale: לון humaanisha kukaa au kulala mahali usiku. “Usilale usiku huu” ni amri ya umoja inayomwelekea Daudi na ni ya kawaida katika Kiswahili.
- source_word: בְּעַרְבוֹת הַמִּדְבָּר
  choice: katika tambarare za jangwani
  rationale: עֲרָבוֹת kwa maana yake ya kawaida ni tambarare au nyanda za chini. Tafsiri hii inatanguliza ushahidi wa neno la Kiebrania badala ya kuifanya maana ya “vivuko” kuwa hakika kwa kutegemea muktadha pekee.
- source_word: וְגַם עָבוֹר תַּעֲבוֹר
  choice: bali hakikisha umevuka
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichogeuzwa huongeza msisitizo. “Hakikisha umevuka” huwasilisha ulazima huo kwa Kiswahili cha kawaida; “bali” huonyesha hatua kali inayotakiwa badala ya kukaa hapo.
- source_word: פֶּן
  choice: la sivyo
  rationale: Huanzisha onyo kuhusu matokeo yanayoweza kutokea. “La sivyo” ni ya asili na ina nguvu inayofaa katika Kiswahili cha sasa.
- source_word: יְבֻלַּע
  choice: watamezwa
  rationale: Kitenzi cha kutendwa kutoka בלע kina picha halisi ya kumezwa, huku katika hatari ya kijeshi kikidokeza kuangamizwa au kufunikwa kabisa. Tafsiri inadumisha picha hiyo yenye nguvu.
- source_word: לַמֶּלֶךְ
  choice: mfalme
  rationale: Ingawa anayelengwa ni Daudi, Kiebrania hutumia cheo chake; kukihifadhi kunadumisha mtazamo wa kisiasa na simulizi.
- source_word: וּלְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: na watu wote walio pamoja naye
  rationale: עָם ni pana kuliko “wanajeshi,” kwa hiyo “watu wote” haibani kundi hilo bila msingi. Kishazi cha uhusiano kinatafsiriwa moja kwa moja na kwa kawaida.
