base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/020.yaml
  text: Absalom’s servants came to the woman at the house and said[a], “Where are Ahimaaz and Jonathan?” The woman said to them, “They crossed over the brook of water.” They searched, but did not find them, so they returned to Jerusalem.
translation:
  language: sw
  text: Watumishi wa Absalomu wakaja nyumbani kwa yule mwanamke, wakamuuliza, “Ahimaasi na Yonathani wako wapi?” Mwanamke akawajibu, “Wamevuka mkondo wa maji.”[a] Waliwatafuta lakini hawakuwapata, kwa hiyo wakarudi Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kijito” au “mfereji wa maji.” Kirai cha Kiebrania si cha kawaida, na aina hasa ya njia hii ya maji haijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אַבְשָׁלוֹם
  choice: Watumishi wa Absalomu
  rationale: עֶבֶד inaweza kumaanisha mtumishi, afisa, au mtumwa. Hapa inawataja watu waliokuwa wakifanya kazi kwa niaba ya Absalomu, hivyo “watumishi” inafaa bila kudokeza kwa lazima hali ya utumwa.
- source_word: הָאִשָּׁה הַבַּיְתָה
  choice: nyumbani kwa yule mwanamke
  rationale: Kiambishi cha mwelekeo katika הַבַּיְתָה kinaonyesha kuja kwenye nyumba. Kiswahili hiki ni cha kawaida na kinamtambulisha mwanamke aliyetajwa katika muktadha bila kudai wazi kwamba alikuwa mke.
- source_word: עָבְרוּ
  choice: Wamevuka
  rationale: עָבַר hapa inaeleza kupita au kuvuka upande wa pili wa mkondo wa maji; “wamevuka” ni wazi na ya kawaida katika muktadha huu.
- source_word: מִיכַל הַמָּיִם
  choice: kile kijito cha maji
  rationale: Kirai cha Kiebrania si cha kawaida na huenda kinataja kijito, mfereji, au mkondo mdogo wa maji. “Kijito cha maji” kinabaki karibu na umbo la chanzo bila kubainisha kupita kiasi aina ya njia ya maji; kutokuwa na uhakika kumeonyeshwa katika tanbihi.
- source_word: וַיְבַקְשׁוּ וְלֹא מָצָאוּ
  choice: Waliwatafuta lakini hawakuwapata
  rationale: בקשׁ hapa ni kuwatafuta watu. Viwakilishi vya wingi vinaeleweka kutokana na Ahimaasi na Yonathani, na “lakini” kinaonyesha kwa Kiswahili cha kawaida kwamba utafutaji haukufaulu.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: kwa hiyo wakarudi Yerusalemu
  rationale: שׁוב ni kurudi. “Kwa hiyo” linaonyesha kwa kawaida matokeo ya kutowapata katika mtiririko wa simulizi.
