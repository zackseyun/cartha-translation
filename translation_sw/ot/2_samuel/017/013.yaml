  text: וְ/אִם אֶל עִיר֙ יֵֽאָסֵ֔ף וְ/הִשִּׂ֧יאוּ כָֽל יִשְׂרָאֵ֛ל אֶל הָ/עִ֥יר הַ/הִ֖יא חֲבָלִ֑ים וְ/סָחַ֤בְנוּ אֹת/וֹ֙ עַד הַ/נַּ֔חַל עַ֛ד אֲשֶֽׁר לֹא נִמְצָ֥א שָׁ֖ם גַּם צְרֽוֹר־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/013.yaml
  text: And if he withdraws into a city[a], then all Israel will bring ropes to that city[b], and we will drag it to the wadi until not even a small stone is found there.
translation:
  language: sw
  text: Na kama atajiondoa na kuingia katika mji, basi Israeli wote wataleta kamba kwenye mji huo, nasi tutauburuta mpaka kwenye bonde la mto[a], hata kijiwe kimoja kisipatikane huko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kijito,” “mkondo wa maji,” au “korongo.” Neno la Kiebrania linaweza kumaanisha mkondo wa maji wa msimu au bonde lake.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi “hata kijiwe.” Hii ni taswira ya kutia chumvi inayoonyesha kwamba mji ungeangamizwa kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָסֵף
  choice: atajiondoa na kuingia
  rationale: Kauli hii ya Kiebrania inaweza kumaanisha kujikusanya, kujiondoa, au kukimbilia mahali pa ulinzi. Katika muktadha wa kijeshi, tafsiri hii ya Kiswahili inaeleza kurudi na kuingia mjini bila kufanya maana ya ‘kukimbilia usalama’ kuwa ya lazima.
- source_word: וְהִשִּׂיאוּ
  choice: wataleta
  rationale: Kitenzi hiki pamoja na ‘kamba’ kinaonyesha kuzichukua au kuzileta kwenye mji; ‘wataleta’ ni Kiswahili cha kawaida na kinachofaa hapa.
- source_word: חֲבָלִים
  choice: kamba
  rationale: Ni vifaa halisi vya kuvutia au kuburuta mji katika taswira hii ya kutia chumvi.
- source_word: וְסָחַבְנוּ אֹתוֹ
  choice: nasi tutauburuta
  rationale: סחב humaanisha kuburuta au kukokota. Kiambishi ‘u-’ kinarejelea mji na kuhifadhi taswira kali ya maangamizi.
- source_word: הַנַּחַל
  choice: bonde la mto
  rationale: נחל inaweza kuwa bonde au mkondo wa maji unaotiririka hasa kwa majira. ‘Bonde la mto’ linaeleweka kwa wasomaji wa Afrika Mashariki kuliko neno la kigeni ‘wadi’ huku likihifadhi sura ya kijiografia.
- source_word: גַּם צְרוֹר
  choice: hata kijiwe kimoja
  rationale: צְרוֹר hapa ni jiwe dogo. ‘Hata kijiwe kimoja’ huhifadhi nguvu ya usemi wa kutia chumvi unaoonyesha maangamizi kamili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inahifadhi taswira ya kijeshi yenye kutia chumvi, huku ikitumia ‘bonde la mto’ badala ya neno la mkopo lisilo la kawaida ‘wadi.’
