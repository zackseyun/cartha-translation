  text: The proposal seemed good in the eyes of Absalom and in the eyes of all the elders of Israel[a].
translation:
  language: sw
  text: Shauri hilo likaonekana kuwa jema machoni pa Absalomu na machoni pa wazee wote wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jambo hilo likawa sawa machoni pa Absalomu na machoni pa wazee wote wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּישַׁר
  choice: likaonekana kuwa jema
  rationale: Katika muundo huu pamoja na בְּעֵינֵי, kitenzi kinaonyesha kwamba jambo lilikubaliwa au lilipendeza, si lazima kwamba lilikuwa adilifu kimaadili. ‘Likaonekana kuwa jema’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: הַדָּבָר
  choice: Shauri hilo
  rationale: Ingawa neno hili linaweza kumaanisha ‘jambo’ au ‘neno,’ hapa linarejelea ushauri uliotolewa katika muktadha uliotangulia. ‘Shauri hilo’ linabainisha rejeo hilo bila kuongeza maelezo yasiyokuwamo.
- source_word: בְּעֵינֵי ... וּבְעֵינֵי
  choice: machoni pa ... na machoni pa
  rationale: Tafsiri hii inahifadhi taswira na urudiaji wa nahau ya Kiebrania huku ikieleweka katika Kiswahili sanifu.
- source_word: אַבְשָׁלֹם
  choice: Absalomu
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: wazee wote wa Israeli
  rationale: ‘Wazee’ hapa ni viongozi wanaotambulika katika jamii, si watu wenye umri mkubwa tu; ‘wote’ inawakilisha כָּל moja kwa moja.
