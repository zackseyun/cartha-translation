  text: Israeli na Absalomu wakapiga kambi katika nchi ya Gileadi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַן
  choice: wakapiga kambi
  rationale: 'Kitenzi חנה kina maana ya kuweka au kupiga kambi. Ingawa Kiebrania kina umbo la umoja kwa kiima cha pamoja, Kiswahili sanifu kinahitaji upatanisho wa wingi: “wakapiga kambi.”'
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa limedumishwa kama lilivyo katika chanzo; hapa linawakilisha kwa pamoja Waisraeli waliokuwa upande wa Absalomu bila kuongeza ufafanuzi huo ndani ya matini.
- source_word: וְאַבְשָׁלֹם
  choice: na Absalomu
  rationale: Kiunganishi kinamuunganisha Absalomu na Israeli kama kiima cha pamoja. Umbo “Absalomu” ni la kawaida katika mapokeo ya majina ya Biblia kwa Kiswahili.
- source_word: אֶרֶץ הַגִּלְעָד
  choice: katika nchi ya Gileadi
  rationale: אֶרֶץ pamoja na jina la mahali humaanisha nchi au eneo la mahali hapo. “Nchi ya Gileadi” ni wazi, ya asili, na inadumisha taarifa ya kijiografia ya chanzo.
