  text: Kisha Daudi akafika Mahanaimu, naye Absalomu akavuka Yordani, yeye na wanaume wote wa Israeli pamoja naye.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא
  choice: akafika
  rationale: Kitenzi hiki katika muktadha wa kwenda kwenye mahali palipotajwa kina maana ya kufika; “akafika” ni Kiswahili cha kawaida na cha wazi katika simulizi.
- source_word: מַחֲנָיְמָה
  choice: Mahanaimu
  rationale: Herufi ya mwelekeo katika Kiebrania inaonyesha kwenda Mahanaimu; maana hiyo imejumuishwa kwa kawaida katika kirai “akafika Mahanaimu.”
- source_word: עָבַר אֶת־הַיַּרְדֵּן
  choice: akavuka Yordani
  rationale: Muundo huu unamaanisha kuvuka Mto Yordani; “akavuka Yordani” ni usemi wa asili na wenye heshima katika Kiswahili.
- source_word: הוּא
  choice: yeye
  rationale: 'Kiwakilishi huru kimehifadhiwa ili kuonyesha wazi muundo wa Kiebrania: Absalomu mwenyewe pamoja na kundi lililofuatana naye.'
- source_word: כָל־אִישׁ יִשְׂרָאֵל
  choice: wanaume wote wa Israeli
  rationale: אִישׁ ni nomino ya kiume iliyotumiwa kwa maana ya mkusanyiko baada ya כָל. Tafsiri hii inadumisha rejeo la kiume, linaloelekea kumaanisha wanaume waliokuwa katika jeshi au kundi la kisiasa la Absalomu, bila kulipanua kuwa watu wote.
- source_word: עִמּוֹ
  choice: waliokuwa pamoja naye
  rationale: Inaonyesha kuandamana naye. Upanuzi mdogo wa kisarufi “waliokuwa” hufanya sentensi iwe ya kawaida na isiyo na utata katika Kiswahili.
- source_word: וְ
  choice: Kisha / naye
  rationale: Kiunganishi cha kwanza kinaendeleza simulizi na kimetafsiriwa “Kisha”; cha pili kinaunganisha tukio linalofuata na kimetafsiriwa “naye,” kwa mtiririko wa asili wa Kiswahili.
