  text: and I will bring back all the people to you[a], as when all return, the man whom you seek will be gone; all the people will be at peace.
translation:
  language: sw
  text: Nami nitawarudisha watu wote kwako[a]. Kurudi kwa wote ni sawa na yule mtu unayemtafuta; watu wote watakuwa na amani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania cha sehemu inayofuata ni kigumu; kwa neno kwa neno, “kama kurudi kwa wote, mtu unayemtafuta.” Huenda maana ni kwamba suala linamhusu mtu huyu mmoja, na watu wengine wote watarudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: nami nitawarudisha
  rationale: Hifili ya שוב ina maana ya kusababisha warudi; “nitawarudisha” ni ya kawaida na inadumisha maana hiyo.
- source_word: כָל הָעָם
  choice: watu wote
  rationale: עָם kimsingi ni “watu”; tafsiri hii haiongezi wazo la “jeshi” lisilotajwa wazi.
- source_word: אֵלֶיךָ
  choice: kwako
  rationale: Inaonyesha mwelekeo wa kurudi kwa watu kwa Absalomu.
- source_word: כְּשׁוּב הַכֹּל
  choice: watu wengine wote watarudi
  rationale: Kifungu cha Kiebrania ni kigumu na kina udondoshaji wa maneno; katika muktadha, kurudi kwa wengine wote kunatofautishwa na kuondolewa kwa mtu mmoja anayetafutwa.
- source_word: הָאִישׁ אֲשֶׁר אַתָּה מְבַקֵּשׁ
  choice: Mtu unayemtafuta
  rationale: Inahifadhi umoja wa הָאִישׁ na kauli ya uhusiano, ikimaanisha Daudi bila kulitaja jina lake.
- source_word: יִהְיֶה שָׁלוֹם
  choice: watakuwa na amani
  rationale: שָׁלוֹם hapa ni hali ya amani na ustawi baada ya mgogoro; “watakuwa na amani” ni Kiswahili cha kawaida.
