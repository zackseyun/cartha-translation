  text: Then Hushai said to Absalom[a], “The counsel that Ahithophel has given this time is not good.”
translation:
  language: sw
  text: Ndipo Hushai akamwambia Absalomu, “Shauri alilotoa Ahithofeli wakati huu si zuri.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida na pia unaonyesha kwamba maneno yanaelekezwa kwa Absalomu.
- source_word: חוּשַׁי
  choice: Hushai
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili cha Biblia.
- source_word: אַבְשָׁלוֹם
  choice: Absalomu
  rationale: Jina la mtu limetoholewa kwa umbo la Kiswahili linalosomeka kwa urahisi.
- source_word: לֹא טוֹבָה
  choice: si zuri
  rationale: Huhifadhi tathmini pana ya Kiebrania bila kuibana iwe tu kwamba shauri hilo si la busara au si thabiti.
- source_word: הָעֵצָה
  choice: Shauri
  rationale: Neno hili linafaa katika muktadha wa ushauri wa kisiasa na kijeshi, huku likihifadhi maana ya ushauri au mpango unaopendekezwa.
- source_word: אֲשֶׁר יָעַץ
  choice: alilotoa
  rationale: Katika Kiswahili ni kawaida kusema 'kutoa shauri'; uchaguzi huu huepuka uradidi usio wa kawaida wa 'kushauri shauri'.
- source_word: אֲחִיתֹפֶל
  choice: Ahithofeli
  rationale: Jina la mtu limetoholewa kwa umbo la Kiswahili linalosomeka kwa urahisi.
- source_word: בַּפַּעַם הַזֹּאת
  choice: wakati huu
  rationale: Hutoa kwa kawaida maana ya 'mara hii' au 'katika tukio hili' katika muktadha huu.
