base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/019.yaml
  text: Then the woman took a covering and spread it over the mouth of the well[a], and scattered crushed grain on it[b], and the matter was not known.
translation:
  language: sw
  text: Ndipo yule mwanamke akachukua kifuniko, akakitandaza juu ya mdomo wa kisima, kisha akatandaza nafaka iliyopondwa juu yake[a]; wala hakuna jambo lililojulikana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafaka iliyosagwa”; neno la Kiebrania linamaanisha bidhaa za nafaka zilizopondwa au kusagwa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wala hakuna jambo lililojulikana.”
    reason: literal_rendering
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: yule mwanamke
  rationale: אִשָּׁה inaweza kumaanisha ‘mwanamke’ au ‘mke’; katika muktadha huu anatajwa kama mwanamke wa nyumba hiyo, hivyo ‘yule mwanamke’ ni ya kawaida na haiongezi tafsiri isiyohitajika.
- source_word: הַמָּסָךְ
  choice: kifuniko
  rationale: מָסָךְ ni kitu cha kufunika, pazia, au kiwambo. ‘Kifuniko’ kinaeleza kazi yake hapa bila kubainisha kwamba kilikuwa kitambaa.
- source_word: עַל פְּנֵי הַבְּאֵר
  choice: juu ya mdomo wa kisima
  rationale: Kirai hiki kihalisi ni ‘juu ya uso wa kisima’; katika Kiswahili, ‘mdomo wa kisima’ hueleza kwa kawaida tundu lililofunikwa.
- source_word: וַתִּשְׁטַח
  choice: akatawanya
  rationale: Kitenzi שטח humaanisha kutandaza au kutawanya. ‘Akatawanya’ kinafaa kwa nafaka iliyowekwa juu ya kifuniko ili kuficha kisima.
- source_word: הָרִפוֹת
  choice: nafaka iliyopondwa
  rationale: רִפוֹת hurejelea nafaka iliyopondwa au kusagwa kwa sehemu. Tafsiri hii ni wazi kwa wasomaji wa sasa na inadumisha picha ya kilimo.
- source_word: וְלֹא נוֹדַע דָּבָר
  choice: wala jambo hilo halikujulikana
  rationale: Muundo wa Kiebrania ni wa kutendwa na kihalisi unasema kuwa hakuna jambo lililojulikana. Kiswahili hiki kinadumisha hali hiyo bila kuibadili waziwazi kuwa ‘hakuna mtu aliyegundua.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa kawaida na wenye heshima. Viunganishi ‘ndipo,’ ‘kisha,’ na ‘wala’ vinaendeleza mfuatano wa matendo bila kufanya kifungu cha mwisho kuwa kauli dhahiri ya kusudi.
