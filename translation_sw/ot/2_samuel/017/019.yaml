  - severity: low
    issue: ‘jambo hilo’ katika kauli ya mwisho
    rationale: דָּבָר ni ‘jambo/kitu’ bila kiashiria cha ‘hilo.’ ‘Hakuna jambo lililojulikana’ huakisi vyema kauli ya kutendwa na huacha maana ya muktadha bila kuiongeza.
  - severity: low
    issue: 'Maelezo ya chini a: ‘iliyosagwa kwa sehemu’'
    rationale: Usemi huu si wa kawaida katika Kiswahili Sanifu na unaweza kueleweka kama kiwango mahususi cha usagaji ambacho hakijaelezwa na maandishi.
