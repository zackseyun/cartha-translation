  to: Ndipo yule mwanamke akachukua kifuniko, akakitandaza juu ya mdomo wa kisima, kisha akatandaza nafaka iliyopondwa juu yake[a]; wala hakuna jambo lililojulikana.[b]
  rationale: Marekebisho yanabadilisha kitenzi cha kutawanya kuwa ‘kutandaza,’ ili kuwakilisha kwa karibu וַתִּשְׁטַח, na yanarekebisha kauli ya mwisho na maelezo ya chini ili yawe ya kawaida zaidi na yenye uaminifu wa karibu kwa Kiebrania. Alama za maelezo ya chini zinaambatana na maneno yanayofafanuliwa.
