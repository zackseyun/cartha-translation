base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/022.yaml
  text: Then David arose[a], and all the people who were with him, and they crossed the Jordan. By morning light, not one was missing who had not crossed the Jordan.
translation:
  language: sw
  text: Ndipo Daudi na watu wote waliokuwa pamoja naye wakaondoka, wakavuka Yordani. Kufikia mapambazuko[a], hakuna hata mmoja aliyebaki bila kuvuka Yordani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi mapambazuko.” Kwa tafsiri ya neno kwa neno, “hadi nuru ya asubuhi.” Kifungu cha Kiebrania huashiria wakati ambao kufikia huo uvukaji ulikuwa umekamilika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akaondoka
  rationale: Kitenzi קום katika mfululizo huu wa simulizi kinaonyesha Daudi kuanza kuchukua hatua. “Akaondoka” ni Kiswahili cha kawaida na cha asili zaidi hapa kuliko “akainuka,” ambacho kingeweza kueleweka kuwa alisimama tu.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: pamoja na watu wote waliokuwa naye
  rationale: Hii inawasilisha kundi lote lililoandamana na Daudi bila kulibana kimakosa kuwa wanaume watu wazima pekee.
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: nao wakavuka Yordani
  rationale: “Wakavuka Yordani” ni tafsiri ya moja kwa moja na ya kawaida ya עבר pamoja na jina la mto.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: Kufikia nuru ya asubuhi
  rationale: “Kufikia” huonyesha wakati ambapo uvukaji ulikuwa umekamilika, huku “nuru ya asubuhi” ikihifadhi taswira halisi ya אוֹר.
- source_word: עַד אַחַד לֹא נֶעְדָּר אֲשֶׁר לֹא עָבַר
  choice: hakukuwa na hata mmoja ambaye hakuwa amevuka
  rationale: Kauli hii yenye ukanushi maradufu inaonyesha kwamba kila mtu alivuka. Muundo huu ni wa asili katika Kiswahili na bado unadumisha umbo la kishazi cha Kiebrania badala ya kulifupisha tu kuwa “wote walivuka.”
