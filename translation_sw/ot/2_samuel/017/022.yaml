translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima, na unaoeleweka kwa urahisi. “Akaondoka” huepuka uzito usio wa lazima, huku “nuru ya asubuhi” ikihifadhi taswira ya chanzo.
