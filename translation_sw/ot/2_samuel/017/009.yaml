base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/009.yaml
  text: Look[a], right now he is hidden in one of the pits or in one of the other places. And when some of them fall at the first attack, whoever hears it will say[b], ‘There has been a slaughter among the people who follow Absalom.’
translation:
  language: sw
  text: Tazama, sasa hivi yuko mafichoni katika mojawapo ya mashimo[a] au katika mahali pengine. Itakapotokea kwamba atakapowashambulia mwanzoni, mtu yeyote atakayesikia habari hiyo atasema, ‘Kumekuwa na mauaji[b] miongoni mwa watu wanaomfuata Absalomu.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika mojawapo ya mabonde madogo”; neno la Kiebrania linaweza kumaanisha mashimo, sehemu zilizobonyea, au maficho kama hayo katika ardhi.
    reason: lexical_alternative
  - marker: b
    text: “Mauaji” pia inaweza kutafsiriwa “kushindwa” au “pigo” miongoni mwa wafuasi wa Absalomu. Hapa neno la Kiebrania linamaanisha kupigwa vikali vitani, si tauni ya ugonjwa. Kauli iliyotangulia inaweza pia kueleweka, “baadhi yao watakapoanguka mwanzoni.”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni neno la kuvuta usikivu kwa namna hai; ‘Tazama’ lina heshima na linaeleweka katika Kiswahili cha sasa.
- source_word: עַתָּה
  choice: sasa hivi
  rationale: Linasisitiza hali ya wakati huo yenye uharaka.
- source_word: נֶחְבָּא
  choice: amejificha
  rationale: Huwasilisha hali ya Daudi kuwa mafichoni kwa Kiswahili cha kawaida, bila kutaja aliyemficha.
- source_word: בְּאַחַת הַפְּחָתִים
  choice: katika mojawapo ya mashimo
  rationale: פְּחָתִים inaweza kumaanisha mashimo au mabonde madogo yanayofaa kujificha; ‘mashimo’ ni tafsiri ya moja kwa moja.
- source_word: בְּאַחַד הַמְּקוֹמֹת
  choice: mahali pengine
  rationale: Hutoa kwa kawaida tofauti ya mahali iliyoanzishwa na אוֹ.
- source_word: כִּנְפֹל בָּהֶם
  choice: baadhi yao watakapoanguka
  rationale: Katika muktadha wa vita, kauli hii inaelekea kueleza majeruhi au waliouawa miongoni mwa wafuasi wa Absalomu, huku tanbihi ikihifadhi uwezekano mwingine wa kisarufi.
- source_word: בַּתְּחִלָּה
  choice: katika shambulio la kwanza
  rationale: Maana ya msingi ni ‘mwanzoni,’ lakini muktadha wa kijeshi unaonyesha mapambano ya kwanza.
- source_word: הַשֹּׁמֵעַ
  choice: yeyote atakayesikia
  rationale: Huwakilisha kwa ufasaha kishiriki chenye maana ya jumla.
- source_word: מַגֵּפָה
  choice: mauaji
  rationale: Katika muktadha huu neno linamaanisha pigo kali la kijeshi au kuangamizwa, si tauni ya ugonjwa.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי אַבְשָׁלֹם
  choice: watu wanaomfuata Absalomu
  rationale: אַחֲרֵי hapa huonyesha ufuasi au utii wa kisiasa na kijeshi.
theological_decisions:
- issue: Mhusika wa כִּנְפֹל בָּהֶם katika kauli ya vita
  choice: baadhi yao watakapoanguka
  alternative: atakapowashambulia
  rationale: Muktadha unaelekea kuonyesha hasara za mwanzo miongoni mwa watu wa Absalomu, lakini muundo wa Kiebrania unaweza pia kueleweka kuwa Daudi anawavamia; utata huo umeelezwa katika tanbihi badala ya kutatuliwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inabaki na kasi ya ushauri wa kijeshi wa Hushai; ‘sasa hivi’ huonyesha uharaka, na ‘watu wanaomfuata Absalomu’ huepuka maana potovu ya kumfuata kimahali tu.
