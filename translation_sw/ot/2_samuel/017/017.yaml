base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/017.yaml
  text: Jonathan and Ahimaaz were standing at En-rogel[a], and a female servant would go and tell them, and they would go and tell King David[b], for they could not be seen entering the city.
translation:
  language: sw
  text: Yonathani na Ahimaasi walikuwa wamesimama katika En-Rogeli[a], na kijakazi[b] angeenda kuwajulisha; nao wangeenda kumwambia Mfalme Daudi, kwa maana wasingeweza kuonekana wakiingia mjini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “walikuwa wamesimama”; katika muktadha huu huenda maana yake ni kwamba walikuwa wamewekwa au walibaki huko.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linamtaja hasa mtumishi wa kike; pia linaweza kutafsiriwa “msichana mtumishi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמְדִים
  choice: walikuwa wakikaa
  rationale: Kitenzi hiki kwa msingi humaanisha ‘kusimama,’ lakini pamoja na mahali kinaweza kumaanisha kubaki au kuwekwa mahali fulani. ‘Walikuwa wakikaa’ kinaonyesha kwamba walibaki En-Rogeli bila kudokeza kwamba walikuwa wamesimama kwa miguu wakati wote.
- source_word: בְּעֵין רֹגֵל
  choice: En-Rogeli
  rationale: Hili ni jina la mahali; limetoholewa kwa tahajia inayosomeka kwa Kiswahili badala ya kutafsiriwa.
- source_word: הַשִּׁפְחָה
  choice: yule kijakazi
  rationale: Neno la Kiebrania humaanisha mtumishi wa kike na lina kibainishi cha uainisho. ‘Yule kijakazi’ huhifadhi jinsia yake na kumtambulisha kama mshiriki anayejulikana katika masimulizi.
- source_word: וְהָלְכָה וְהִגִּידָה לָהֶם
  choice: alikuwa akienda kuwaambia habari
  rationale: Muundo huu unaeleza utaratibu uliokuwa ukifuatwa katika kupeleka ujumbe, si lazima tendo moja tu lililotokea mara moja.
- source_word: וְהֵם יֵלְכוּ וְהִגִּידוּ
  choice: nao kisha wangeenda kumwambia
  rationale: 'Huu ni mwendelezo wa utaratibu wa kupeleka ujumbe: baada ya kuupokea, wao wangempelekea Daudi.'
- source_word: לַמֶּלֶךְ דָּוִד
  choice: Mfalme Daudi
  rationale: Huu ni mpangilio wa kawaida na wenye heshima wa cheo na jina katika Kiswahili.
- source_word: כִּי לֹא יוּכְלוּ לְהֵרָאוֹת לָבוֹא הָעִירָה
  choice: kwa maana hawangeweza kuonekana wakiingia mjini
  rationale: Tafsiri hii inaonyesha sababu ya mpango huo na kuhifadhi wazo la hatari ya wao kuonekana walipokuwa wakiingia mjini.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wazi na wenye heshima. Nyakati za vitenzi zinaonyesha utaratibu wa kawaida au uliopangwa wa kupeleka ujumbe. ‘Mjini’ limeachwa bila kuongeza jina la Yerusalemu, kwa kuwa jina hilo halipo katika mstari wa Kiebrania.
