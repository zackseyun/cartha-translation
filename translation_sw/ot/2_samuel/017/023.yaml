base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/023.yaml
  text: When Ahithophel saw that his counsel had not been followed[a], he saddled the donkey, arose, and went to his house in his city. He gave orders to his household, then hanged himself and died[c][b]; and he was buried in his father's tomb.
translation:
  language: sw
  text: Ahithofeli alipoona kwamba shauri lake halikutekelezwa[a], akamtandika punda, akaondoka, akaenda nyumbani kwake katika mji wake. Akatoa maagizo kwa watu wa nyumba yake[b], kisha akajinyonga[c] akafa; naye akazikwa katika kaburi la baba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwamba shauri lake halikufuatwa.” Kwa karibu zaidi, Kiebrania husema, “kwamba shauri lake halikufanywa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akapanga mambo ya nyumba yake.” Kiebrania kinasema kwa karibu zaidi kwamba alitoa maagizo kwa nyumba au kaya yake.
    reason: lexical_alternative
  - marker: c
    text: Au, “akajikaba.” Kitenzi hicho kinaweza kueleza kifo kwa kujinyonga au kujikaba; katika muktadha huu Ahithofeli alijiua.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָתוֹ
  choice: shauri lake
  rationale: ‘Shauri’ linahifadhi maana ya ushauri na mpango wa kimkakati katika muktadha wa kisiasa.
- source_word: לֹא נֶעֶשְׂתָה
  choice: halikutekelezwa
  rationale: Kiebrania ni ‘halikufanywa’; ‘halikutekelezwa’ linaeleza kwa Kiswahili cha kawaida kwamba shauri hilo halikuwekwa katika vitendo bila kulifanya tu kuwa ‘halikufuatwa’.
- source_word: וַיַּחֲבֹשׁ אֶת־הַחֲמוֹר
  choice: akamtandika punda matandiko
  rationale: חבש katika habari ya punda humaanisha kumwandaa kwa safari kwa kumwekea matandiko; kibainishi cha Kiebrania hakisemi wazi ‘punda wake’.
- source_word: וַיָּקָם
  choice: akaondoka
  rationale: Katika mfululizo wa kisimulizi, kitenzi hiki huonyesha kuinuka na kuanza kwenda; ‘akaondoka’ ni cha asili katika Kiswahili.
- source_word: אֶל־בֵּיתוֹ אֶל־עִירוֹ
  choice: nyumbani kwake katika mji wake
  rationale: Kauli hii inahifadhi nyumbani kuwa mahali alipoelekea na mji wake kuwa mahali nyumba hiyo ilipokuwa.
- source_word: וַיְצַו אֶל־בֵּיתוֹ
  choice: akatoa maagizo kwa watu wa nyumbani mwake
  rationale: Tafsiri hii inafuata kwa karibu wazo la kutoa maagizo kwa nyumba au kaya yake, huku maana ya kupanga mambo ya nyumba ikibaki kuwa uwezekano katika tanbihi.
- source_word: וַיֵּחָנַק
  choice: akajinyonga
  rationale: Muktadha unaonyesha kitendo cha kujiua; kitenzi kinaweza kurejelea kujinyonga au kujikaba, na ‘akajinyonga’ ni usemi wa kawaida wa Kiswahili hapa.
- source_word: בְּקֶבֶר אָבִיו
  choice: katika kaburi la baba yake
  rationale: Huhifadhi kwa uwazi rejeo la moja kwa moja kwa baba yake bila kulipanua kuwa eneo la maziko ya ukoo.
theological_decisions:
- issue: Namna ya kifo cha Ahithofeli
  choice: akajinyonga
  alternative: akajikaba
  rationale: Kitenzi cha Kiebrania kinaweza kuhusishwa na kunyongwa au kukabwa; muktadha unaonyesha kujiua, lakini tanbihi inadumisha upana wa kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. Muundo wa vitenzi vinavyofuatana kwa ‘aka-’ unahifadhi mwendo wa simulizi la Kiebrania. Jina ‘Ahithofeli’ linafuata umbo linalotumika sana katika Biblia za Kiswahili.
