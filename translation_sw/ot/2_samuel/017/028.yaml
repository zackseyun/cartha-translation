lexical_decisions:
- source_word: מִשְׁכָּב
  choice: matandiko
  rationale: Nomino hii hutaja mahali au kitu cha kulalia. Katika orodha hii ya mahitaji, “matandiko” ni neno la kawaida linaloweza kutumiwa kwa maana ya jumla bila kulazimisha wingi wa vitanda.
- source_word: סַפּוֹת
  choice: mabakuli
  rationale: Katika orodha ya vifaa vya nyumbani, neno hili linaelekea kutaja vyombo kama mabakuli au mabeseni; “mabakuli” ni la kawaida na linafaa katika muktadha.
- source_word: כְלִי יוֹצֵר
  choice: vyombo vya udongo
  rationale: Kirai hiki kihalisi ni vyombo vya mfinyanzi, yaani vyombo vilivyotengenezwa kwa udongo; tafsiri hii ni ya asili na wazi kwa msomaji wa Kiswahili.
- source_word: חִטִּים
  choice: ngano
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa nafaka inayotajwa.
- source_word: שְׂעֹרִים
  choice: shayiri
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa nafaka inayotajwa.
- source_word: קֶמַח
  choice: unga
  rationale: Neno hili hutaja nafaka iliyosagwa; “unga” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: קָלִי
  choice: nafaka iliyooka
  rationale: Neno hili hutaja nafaka iliyotayarishwa kwa kuokwa au kukaangwa bila mafuta. “Nafaka iliyooka” ni wazi na huhifadhi maana ya chakula hicho.
- source_word: פּוֹל
  choice: maharagwe
  rationale: Neno hili hutaja aina ya maharagwe, yaelekea maharagwe mapana; neno la jumla linafaa katika matini, huku umahususi ukihifadhiwa katika tanbihi.
- source_word: עֲדָשִׁים
  choice: dengu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa jamii hii ya kunde.
- source_word: קָלִי
  choice: nafaka iliyooka
  rationale: Neno lilelile linatokea tena mwishoni mwa mstari. Marudio yake yamehifadhiwa kwa kuwa yako katika Kiebrania, badala ya kuyaficha kwa visawe.
