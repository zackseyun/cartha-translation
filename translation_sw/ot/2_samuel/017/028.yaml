  text: beds[a], basins, and pottery vessels, and wheat, barley, flour[b], roasted grain, beans, lentils[d][c], and parched grain.
translation:
  language: sw
  text: matandiko, mabakuli, vyombo vya udongo, ngano, shayiri, unga, nafaka iliyokaangwa, maharagwe[a], dengu, na nafaka iliyokaangwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda hasa ni maharagwe mapana (fava).
