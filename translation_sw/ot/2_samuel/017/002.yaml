base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/002.yaml
  text: I will come upon him while he is weary and weak-handed[a], and I will throw him into panic, so that all the people who are with him will flee; then I will strike down the king alone.
translation:
  language: sw
  text: Nitamvamia akiwa amechoka na mikono yake imelegea[a]; nitamtia hofu, nao watu wote walio pamoja naye watakimbia. Kisha nitampiga mfalme peke yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “dhaifu wa mikono,” nahau inayoweza kumaanisha kupungukiwa na nguvu au ujasiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבוֹא עָלָיו
  choice: Nitamvamia
  rationale: Muundo בוא על katika muktadha huu wa kijeshi una maana ya kumjia mtu kwa uhasama. “Nitamvamia” ni Kiswahili cha kawaida kinachoonyesha shambulio bila kupanua maana isivyohitajika.
- source_word: יָגֵעַ
  choice: amechoka
  rationale: Kivumishi hiki huonyesha uchovu unaotokana na juhudi; “amechoka” ni cha kawaida na kinafaa muktadha wa kijeshi.
- source_word: וּרְפֵה יָדַיִם
  choice: amevunjika moyo[a]
  rationale: Nahau hii, kihalisi “dhaifu wa mikono,” huonyesha kupungua kwa nguvu au ujasiri. “Amevunjika moyo” huwasilisha maana yake kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi taswira halisi na wigo wa maana.
- source_word: וְהַחֲרַדְתִּי אֹתוֹ
  choice: Nitamwingiza katika hofu
  rationale: 'Hifili ya חרד ina nguvu ya kusababisha: kumfanya mtu atetemeke au aingiwe na hofu. Kauli hii inaleta nguvu hiyo ya kisababishi katika Kiswahili sanifu.'
- source_word: וְנָס כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: nao watu wote walio pamoja naye watakimbia
  rationale: Huhifadhi uratibu wa Kiebrania na kirai cha uhusiano “walio pamoja naye,” bila kulazimisha uhusiano wa kisarufi ulio wazi zaidi kuliko chanzo.
- source_word: וְהִכֵּיתִי
  choice: nitampiga
  rationale: נכה humaanisha kupiga na katika muktadha inaweza kuwa pigo la kuua. “Nitampiga” huhifadhi kitenzi cha chanzo bila kutamka moja kwa moja “nitamuua,” jambo ambalo Kiebrania halisemi wazi hapa.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Huhifadhi cheo cha chanzo badala ya kubadili na kuweka jina la Daudi.
- source_word: לְבַדּוֹ
  choice: peke yake
  rationale: Husisitiza kwamba mfalme ndiye anayelengwa akiwa ametengwa na wengine; ni usemi wa kawaida na wazi wa Kiswahili.
