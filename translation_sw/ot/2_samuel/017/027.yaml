base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/027.yaml
  text: When David came to Mahanaim, Shobi son of Nahash from Rabbah of the Ammonites, and Machir son of Ammiel from Lo-debar, and Barzillai the Gileadite from Rogelim,
translation:
  language: sw
  text: Daudi alipofika Mahanaimu, Shobi mwana wa Nahashi kutoka Raba ya Waamoni, Makiri mwana wa Amieli kutoka Lo-debari, na Barzilai Mgileadi kutoka Rogelimu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: alipofika
  rationale: Muundo huu unaanzisha tukio jipya na kueleza wakati; ‘alipofika’ ni Kiswahili cha kawaida kinachowasilisha maana ya ‘Daudi alipokuja/kuwasili’ bila kuongeza neno la wakati lisilokuwapo wazi katika Kiebrania.
- source_word: מַחֲנָיְמָה
  choice: Mahanaimu
  rationale: Herufi ya mwelekeo inaonyesha kwenda Mahanaimu; kitenzi ‘alipofika’ tayari kinaonyesha mwendo kuelekea mahali hapo.
- source_word: שֹׁבִי בֶן נָחָשׁ
  choice: Shobi mwana wa Nahashi
  rationale: Majina yametoholewa kwa namna inayosomeka katika Kiswahili, na uhusiano wa ukoo umehifadhiwa kwa ‘mwana wa’.
- source_word: מֵרַבַּת בְּנֵי עַמּוֹן
  choice: kutoka Raba ya Waamoni
  rationale: Raba ni jina la mji, na ‘wana wa Amoni’ hapa ni utambulisho wa kikabila na kisiasa unaowasilishwa kwa kawaida kama ‘Waamoni’.
- source_word: מָכִיר בֶן עַמִּיאֵל
  choice: Makiri mwana wa Amieli
  rationale: Majina yametoholewa na muundo wa jina la baba umehifadhiwa.
- source_word: מִלֹּא דְבָר
  choice: kutoka Lo-debari
  rationale: Jina la mahali limetoholewa; kihusishi מִן kimetafsiriwa ‘kutoka’.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: Barzilai Mgileadi
  rationale: Kivumishi cha asili ya eneo kimetafsiriwa kwa jina la mtu wa Gileadi, ‘Mgileadi’, kwa ufupi na ufasaha.
- source_word: מֵרֹגְלִים
  choice: kutoka Rogelimu
  rationale: Jina la mahali limetoholewa na maana ya asili iliyo katika kihusishi מִן imehifadhiwa kwa ‘kutoka’.
