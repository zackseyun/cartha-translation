base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/025.yaml
  text: And Absalom set Amasa over the army in place of Joab. Now Amasa was the son of a man whose name was Ithra the Israelite[a], who had gone in to Abigail the daughter of Nahash, sister of Zeruiah, Joab’s mother.
translation:
  language: sw
  text: Absalomu akamweka Amasa kuwa mkuu wa jeshi badala ya Yoabu. Amasa alikuwa mwana wa mtu mmoja aliyeitwa Ithra, Mwisraeli[a], ambaye aliingia kwa Abigaili binti Nahashi, dada ya Seruya, mama yake Yoabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Ithra, Mwisraeli.” Katika 1 Nyakati 2:17 ni “Yetheri, Mwishmaeli.”'
    reason: textual_variant
lexical_decisions:
- source_word: שָׂם ... עַל הַצָּבָא
  choice: akamweka ... kuwa mkuu wa jeshi
  rationale: Muundo huu wa Kiswahili unaeleza wazi uteuzi wa Amasa kuwa na mamlaka juu ya jeshi, bila kupoteza maana ya kitenzi cha kawaida ‘kuweka.’
- source_word: תַּחַת יוֹאָב
  choice: badala ya Yoabu
  rationale: Hapa תַּחַת inaonyesha kuchukua nafasi ya mtu mwingine, si kuwa chini yake mahali.
- source_word: בֶן אִישׁ וּשְׁמוֹ יִתְרָא
  choice: mwana wa mtu mmoja aliyeitwa Ithra
  rationale: ‘Mtu mmoja’ huhifadhi hali ya kutotajwa awali ya אִישׁ na kufanya kishazi cha jina kisomeke kwa kawaida katika Kiswahili.
- source_word: הַיִּשְׂרְאֵלִי
  choice: Mwisraeli
  rationale: Inafuata moja kwa moja maandishi ya Kiebrania ya WLC; tofauti iliyopo katika 1 Nyakati 2:17 imehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר בָּא אֶל
  choice: ambaye alimwingilia
  rationale: Ni usemi wa Kiswahili unaoonyesha muungano wa kingono na kudumisha namna ya staha ya nahau ya Kiebrania bila kuifanya iwe maelezo ya kitabibu.
- source_word: אֲבִיגַל בַּת נָחָשׁ
  choice: Abigaili binti Nahashi
  rationale: Huhifadhi uhusiano wa kifamilia na mpangilio wa msingi wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: אֲחוֹת צְרוּיָה אֵם יוֹאָב
  choice: dada ya Seruya, mama yake Yoabu
  rationale: Huhifadhi appositioni inayomtambulisha Seruya kuwa mama ya Yoabu.
