review_pass:
  verdict: revise
  source_fidelity: The draft preserves the narrative sequence and the hostile force of Ahithophel's counsel. However, “Ondokeni” means “leave/go away” rather than the explicit plural imperative “rise/get up” (קוּמוּ).
  naturalness: “Baada ya wao kuondoka” is understandable but awkward in Standard East African Swahili. “Baada ya wao kuondoka” also needs a clearer contrast with the two messengers who emerge from the well. “Vukeni maji haraka” is natural enough when the watercourse is left unspecified, as in the Hebrew.
  terminology: “Mfalme Daudi,” “kisima,” and “Ahithofeli” are appropriate. “Alivyotoa shauri dhidi yenu” naturally conveys counsel directed against David and his party without wrongly making them the recipients of the advice.
  issues:
  - severity: medium
    issue: “Ondokeni” for קוּמוּ
    rationale: The Hebrew calls David and those with him to rise/get up; “Ondokeni” shifts the command to leaving/departing. “Inukeni” retains the source sense and remains idiomatic in an urgent warning.
  - severity: low
    issue: Awkward pronoun construction in the opening
    rationale: “Baada ya wao kuondoka” is less natural than “Baada ya wale watu kuondoka.” The latter clarifies that the persons who left are distinct from the two messengers who subsequently come up from the well, in line with the immediate narrative context.
  revised_text: Baada ya wale watu kuondoka, wale wawili wakapanda kutoka kisimani, wakaenda kumjulisha Mfalme Daudi. Wakamwambia Daudi, “Inukeni, mvuke maji haraka, kwa maana hivi ndivyo Ahithofeli alivyotoa shauri dhidi yenu.”
  revised_footnotes: []
