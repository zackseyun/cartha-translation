revisions:
- from: Baada ya wao kuondoka, wale wawili wakapanda kutoka kisimani, wakaenda kumjulisha Mfalme Daudi. Wakamwambia Daudi, “Ondokeni, mvuke maji haraka, kwa sababu hivi ndivyo Ahithofeli alivyoshauri dhidi yenu.”
  to: Baada ya wale watu kuondoka, wale wawili wakapanda kutoka kisimani, wakaenda kumjulisha Mfalme Daudi. Wakamwambia Daudi, “Inukeni, mvuke maji haraka, kwa maana hivi ndivyo Ahithofeli alivyotoa shauri dhidi yenu.”
  rationale: The revision corrects the imperative so that it explicitly means “rise/get up,” improves the naturalness and referential clarity of the opening, and retains the plural address, the unspecified “water(s),” and the adversarial sense of Ahithophel’s counsel. No footnote is needed.
