base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/021.yaml
  text: After they had gone, they came up out of the well and went and told King David. They said to David, “Get up and cross over the water quickly, for this is what Ahithophel has advised against you.”
translation:
  language: sw
  text: Baada ya wale watu kuondoka, wale wawili wakapanda kutoka kisimani, wakaenda kumjulisha Mfalme Daudi. Wakamwambia Daudi, “Inukeni, mvuke maji haraka, kwa maana hivi ndivyo Ahithofeli alivyotoa shauri dhidi yenu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי לֶכְתָּם
  choice: Baada ya wao kuondoka
  rationale: Kirai hiki kinadumisha rejeo la wingi kwa wale waliokuwa wameondoka bila kuongeza utambulisho wao.
- source_word: וַיַּעֲלוּ מֵהַבְּאֵר
  choice: wale wawili wakapanda kutoka kisimani
  rationale: Kitenzi cha wingi kinawahusu wajumbe wawili wa muktadha; ‘wakapanda kutoka kisimani’ huwasilisha mwendo wa kutoka ndani ya kisima.
- source_word: קוּמוּ
  choice: Ondokeni
  rationale: Amri ya wingi ina maana ya kuinuka na kuanza kuchukua hatua; ‘Ondokeni’ ni ya asili katika onyo hili la haraka.
- source_word: וְעִבְרוּ מְהֵרָה אֶת־הַמַּיִם
  choice: mvuke maji haraka
  rationale: ‘Mvuke’ hudumisha wazo la kuvuka kwenda upande mwingine, huku ‘maji’ yakiacha aina mahususi ya sehemu ya kuvukia bila kuibainisha kuliko chanzo.
- source_word: יָעַץ עֲלֵיכֶם
  choice: alivyoshauri dhidi yenu
  rationale: ‘Dhidi yenu’ huhifadhi mwelekeo wa uhasama katika עֲלֵיכֶם badala ya kuufanya ushauri kuwa wa kawaida.
