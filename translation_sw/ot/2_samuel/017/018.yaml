source:
  edition: WLC
  text: וַ/יַּ֤רְא אֹתָ/ם֙ נַ֔עַר וַ/יַּגֵּ֖ד לְ/אַבְשָׁלֹ֑ם וַ/יֵּלְכוּ֩ שְׁנֵי/הֶ֨ם מְהֵרָ֜ה וַ/יָּבֹ֣אוּ אֶל בֵּֽית אִ֣ישׁ בְּ/בַחוּרִ֗ים וְ/ל֥/וֹ בְאֵ֛ר בַּ/חֲצֵר֖/וֹ וַ/יֵּ֥רְדוּ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/018.yaml
  text: But a young man saw them and told Absalom[a], so the two of them went quickly and came to the house of a man in Bahurim, who had a well in his courtyard, and they went down there.
translation:
  language: sw
  text: Lakini kijana mmoja akawaona na kumwambia Absalomu. Basi wale wawili wakaenda upesi, wakafika kwenye nyumba ya mtu mmoja huko Bahurimu. Mtu huyo alikuwa na kisima uani mwake, nao wakashuka huko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakashuka ndani yake,” yaani, ndani ya kisima.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: kijana mmoja
  rationale: Neno hili linaweza kumaanisha mvulana, kijana, au mtumishi kulingana na muktadha. Hapa “kijana mmoja” halibainishi umri au cheo kupita ushahidi wa maandishi.
- source_word: וַיַּגֵּד
  choice: na kumwambia
  rationale: Kitenzi נגד katika Hifili humaanisha kumwambia mtu au kumpa taarifa. “Kumwambia” ni lugha ya kawaida na inaonyesha wazi kwamba Absalomu ndiye aliyepewa taarifa.
- source_word: שְׁנֵיהֶם
  choice: wale wawili
  rationale: Tafsiri hii inahifadhi idadi ya watu wawili inayotajwa wazi katika Kiebrania na inarejelea wahusika waliotangulia.
- source_word: מְהֵרָה
  choice: upesi
  rationale: Neno hili limetumiwa kama kielezi kuonyesha haraka; “upesi” ni la asili na lenye heshima katika Kiswahili sanifu.
- source_word: בֵּית אִישׁ
  choice: nyumba ya mtu mmoja
  rationale: Hii inafuata muundo na maana ya kirai cha Kiebrania bila kudokeza utambulisho ambao haukutajwa.
- source_word: בְּבַחוּרִים
  choice: huko Bahurimu
  rationale: Bahurimu ni jina la mahali; “huko” linafaa kwa eneo lililotajwa katika simulizi.
- source_word: בְאֵר
  choice: kisima
  rationale: בְאֵר kwa kawaida humaanisha kisima, si birika. Mstari unaofuata, unaotaja kufunika mdomo wake, pia unaweza kuelezea kisima.
- source_word: בַּחֲצֵרוֹ
  choice: uani mwake
  rationale: חָצֵר ni ua au eneo lililozungushiwa karibu na nyumba. “Uani mwake” ni usemi wa kawaida wa Kiswahili.
- source_word: וַיֵּרְדוּ שָׁם
  choice: wakashuka huko
  rationale: Kiebrania kinasema kihalisi “wakashuka huko.” Tafsiri hii inadumisha kutotajwa moja kwa moja kwa kitu walichoingia, ingawa muktadha unaonyesha kisima.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa, na wenye heshima. Miundo ya vitenzi vinavyofuatana inadumisha mwendo wa haraka wa simulizi, huku “wakashuka huko” ikihifadhi kutotajwa moja kwa moja kulikomo katika Kiebrania.
