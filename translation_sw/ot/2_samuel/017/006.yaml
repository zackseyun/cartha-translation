base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/006.yaml
  text: When Hushai came to Absalom[a], Absalom said to him, “Ahithophel has spoken in this way. Should we do as he says? If not, you speak.”
translation:
  language: sw
  text: Hushai alipofika kwa Absalomu, Absalomu akamwambia, “Ahithofeli amesema hivi. Je, tufanye kama alivyosema?[a] Kama sivyo, wewe sema.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, tutekeleze neno lake?” Kiebrania kinasema kihalisi zaidi, “Je, tufanye neno lake?” yaani, kutekeleza shauri la Ahithofeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: alipofika
  rationale: Katika mfululizo huu wa simulizi, בוא inaeleza Hushai kufika mahali alipo Absalomu. Muundo wa ‘alipofika’ unaunganisha kwa kawaida kuwasili kwake na kauli inayofuata.
- source_word: חוּשַׁי
  choice: Hushai
  rationale: Jina limetoholewa kwa namna inayotambulika katika Kiswahili bila kubadili utambulisho wake.
- source_word: אַבְשָׁלוֹם
  choice: Absalomu
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: akamwambia
  rationale: Kiswahili hakihitaji kurudia ‘akasema, akisema’; ‘akamwambia’ huwakilisha kwa kawaida utangulizi wa maneno yaliyonukuliwa na pia kiwakilishi אֵלָיו.
- source_word: כַּדָּבָר הַזֶּה דִּבֶּר
  choice: amesema hivi
  rationale: ‘Hivi’ huonyesha namna au maudhui ya shauri lililotangulia, huku wakati timilifu ‘amesema’ ukionyesha kuwa kauli hiyo iliyokwisha kutolewa ndiyo inayojadiliwa sasa.
- source_word: אֲחִיתֹפֶל
  choice: Ahithofeli
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: הֲנַעֲשֶׂה
  choice: Je, tufanye
  rationale: Swali lenye nafsi ya kwanza wingi ni la mashauriano; ‘Je, tufanye’ linaonyesha vizuri uamuzi unaotafutwa.
- source_word: אֶת דְּבָרוֹ
  choice: kama alivyosema
  rationale: Kihalisi ni ‘neno lake,’ lakini katika muktadha humaanisha kutekeleza shauri la Ahithofeli. Usemi huu ni wa kawaida katika Kiswahili na hauongezi maudhui yasiyokuwamo.
- source_word: אִם אַיִן
  choice: Kama sivyo
  rationale: Huu ni usemi wa sharti unaoweka uwezekano tofauti kwa ufupi na kwa kawaida.
- source_word: אַתָּה דַבֵּר
  choice: wewe sema
  rationale: Kutaja ‘wewe’ wazi kunahifadhi mkazo wa kiwakilishi huru אַתָּה kabla ya amri.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya simulizi ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Majina yametolewa katika maumbo yanayotambulika kwa kawaida katika Biblia za Kiswahili. Mkazo wa ‘wewe’ umehifadhiwa bila kuongeza maelezo ndani ya aya.
