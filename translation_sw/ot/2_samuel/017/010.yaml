  text: וְ/ה֣וּא גַם בֶּן חַ֗יִל אֲשֶׁ֥ר לִבּ֛/וֹ כְּ/לֵ֥ב הָ/אַרְיֵ֖ה הִמֵּ֣ס יִמָּ֑ס כִּֽי יֹדֵ֤עַ כָּל יִשְׂרָאֵל֙ כִּי גִבּ֣וֹר אָבִ֔י/ךָ וּ/בְנֵי חַ֖יִל אֲשֶׁ֥ר אִתּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/010.yaml
  text: Even the valiant man whose heart is like a lion’s heart will utterly melt[a], for all Israel knows that your father is a mighty man[b], and that the men with him are valiant men.
translation:
  language: sw
  text: Hata mtu shujaa[a] ambaye moyo wake ni kama moyo wa simba atayeyuka kabisa[b], kwa maana Israeli yote inajua kwamba baba yako ni shujaa hodari na kwamba watu walio pamoja naye ni mashujaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu hodari.” Neno hilohilo la msingi limetafsiriwa “mashujaa” mwishoni mwa aya.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema, “atayeyuka, atayeyuka,” muundo wa kusisitiza unaomaanisha kwamba atapoteza kabisa ujasiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן חַיִל
  choice: mtu shujaa
  rationale: Nahau hii, kihalisi ‘mwana wa nguvu/ushujaa,’ humaanisha mtu mwenye ujasiri na uwezo wa kivita. ‘Mtu shujaa’ ni Kiswahili cha kawaida kinachodumisha umoja wa mtu anayezungumziwa.
- source_word: לִבּוֹ כְּלֵב הָאַרְיֵה
  choice: ambaye moyo wake ni kama moyo wa simba
  rationale: Tafsiri hii inadumisha tashbihi na taswira ya Kiebrania badala ya kuibadili kuwa kivumishi.
- source_word: הִמֵּס יִמָּס
  choice: atayeyuka kabisa
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichonyambuliwa unatilia mkazo tendo. ‘Atayeyuka kabisa’ huhifadhi sitiari ya ujasiri kufifia, huku tanbihi ikifafanua maana yake.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya kauli iliyotangulia.
- source_word: יֹדֵעַ כָּל יִשְׂרָאֵל
  choice: Israeli yote inajua
  rationale: Hii ni tafsiri ya moja kwa moja inayoonyesha maarifa yanayojulikana kwa ujumla.
- source_word: גִבּוֹר
  choice: shujaa hodari
  rationale: Neno hili linamtaja Daudi kama mtu mwenye nguvu na uwezo mkubwa wa kivita; ‘shujaa hodari’ linaweka wazi muktadha huo.
- source_word: וּבְנֵי חַיִל אֲשֶׁר אִתּוֹ
  choice: watu walio pamoja naye ni mashujaa
  rationale: Tafsiri hii ni ya asili katika Kiswahili na inadumisha uhusiano wa kileksika na ‘mtu shujaa’ mwanzoni mwa aya.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Taswira ya moyo wa simba na sitiari ya kuyeyuka zimehifadhiwa; maana ya sitiari imefafanuliwa katika tanbihi.
