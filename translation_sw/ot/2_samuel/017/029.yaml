translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. ‘Nyikani’ limetumiwa badala ya ‘jangwani’ ili kuepuka kupunguza מִדְבָּר kuwa jangwa la mchanga pekee. Viunganishi na marudio yasiyo ya lazima katika orodha yamerahisishwa bila kuondoa vipengele vya Kiebrania.
