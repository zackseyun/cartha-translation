base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/029.yaml
  text: and honey and curds and sheep and cheese from the herd they brought near for David and for the people who were with him to eat[a], for they said[c][b], “The people are hungry and weary and thirsty in the wilderness.”
translation:
  language: sw
  text: Walileta asali, maziwa yaliyoganda[a], kondoo[b], na jibini la maziwa ya ng’ombe[c] kwa Daudi na kwa watu waliokuwa pamoja naye, ili wale. Kwa maana walisema, “Watu wana njaa, wamechoka, na wana kiu nyikani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siagi.” Neno la Kiebrania חֶמְאָה linaweza kutaja bidhaa mbalimbali za maziwa, lakini hapa huenda linamaanisha maziwa yaliyoganda badala ya siagi ya kisasa.
    reason: lexical_alternative
  - marker: b
    text: Au, “mifugo midogo.” Neno la Kiebrania צֹאן linaweza kuwajumuisha kondoo na mbuzi.
    reason: lexical_alternative
  - marker: c
    text: Kirai cha Kiebrania שְׁפוֹת בָּקָר kinamaanisha bidhaa ya maziwa itokanayo na ng’ombe; tafsiri nyingine hulieleza kwa ujumla zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבַשׁ
  choice: asali
  rationale: Hili ndilo neno la kawaida na linalofaa zaidi kwa chakula hiki; ingawa katika baadhi ya miktadha linaweza kumaanisha sharubati tamu, hakuna sababu ya kuacha maana ya kawaida hapa.
- source_word: חֶמְאָה
  choice: maziwa yaliyoganda
  rationale: Katika mazingira ya kale neno hili linaelekea kumaanisha bidhaa ya maziwa iliyoganda kuliko siagi ya kisasa; tafsiri hii ni wazi kwa msomaji wa Kiswahili.
- source_word: צֹאן
  choice: kondoo
  rationale: Neno linaweza kutaja kwa ujumla mifugo midogo, yaani kondoo na mbuzi, lakini ‘kondoo’ ni tafsiri fupi na ya kawaida; uwezekano mpana umehifadhiwa katika tanbihi.
- source_word: שְׁפוֹת בָּקָר
  choice: jibini la maziwa ya ng’ombe
  rationale: Kirai hiki kinaashiria bidhaa ya maziwa itokanayo na ng’ombe. Tafsiri hii inaeleweka kwa Kiswahili bila kudai ufafanuzi wa kina wa njia yake ya kutengenezwa.
- source_word: הִגִּישׁוּ
  choice: walileta
  rationale: Kitenzi kina maana ya kuleta karibu au kuwasilisha. Katika simulizi hili, ‘walileta’ ni ya kawaida na huonyesha wazi kwamba vyakula vililetwa kwa Daudi na watu wake.
- source_word: לְדָוִד וְלָעָם אֲשֶׁר אִתּוֹ
  choice: kwa ajili ya Daudi na watu waliokuwa pamoja naye
  rationale: Tafsiri hii huhifadhi walengwa wote wawili na kuwasilisha kwa kawaida kirai cha uhusiano ‘waliokuwa pamoja naye.’
- source_word: לֶאֱכֹל
  choice: ili wale
  rationale: Infinitivu inaonyesha kusudi; ‘ili wale’ ni Kiswahili cha kawaida na huonyesha kwa uwazi kusudi la kuletwa kwa vyakula.
- source_word: כִּי אָמְרוּ
  choice: Kwa maana walisema
  rationale: כִּי hapa huanzisha sababu ya tendo lililotangulia; ‘kwa maana’ huhifadhi uhusiano huo wa maelezo.
- source_word: רָעֵב וְעָיֵף וְצָמֵא
  choice: wana njaa, wamechoka, na wana kiu
  rationale: Tafsiri hii huhifadhi sifa zote tatu na mpangilio wake bila kuongeza kiwango cha maana kilicho katika Kiebrania.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: מִדְבָּר inaweza kumaanisha eneo pori au lisilokaliwa sana, si lazima jangwa la mchanga; ‘nyikani’ huhifadhi upana huo.
