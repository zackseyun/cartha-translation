base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/008.yaml
  text: Hushai said[a], “You know your father and his men, that they are mighty men and bitter of soul, like a bear robbed of her cubs in the field. And your father is a man of war[b]; he will not spend the night with the troops.”
translation:
  language: sw
  text: Hushai akasema, “Unamjua baba yako na watu wake. Wao ni mashujaa, wenye hasira kali[a], kama dubu jike aliyepokonywa watoto wake uwandani. Na baba yako ni mtu wa vita; hatapitisha usiku pamoja na wanajeshi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni wakali”; kwa neno halisi, “wenye uchungu wa nafsi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hatakaa usiku pamoja na watu.” Hapa neno “watu” huenda linarejelea kikosi cha wapiganaji wa Daudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִבֹּרִים
  choice: mashujaa
  rationale: Katika muktadha huu wa kijeshi, neno hili linaonyesha watu wenye nguvu na ushujaa vitani. ‘Mashujaa’ ni Kiswahili cha kawaida na chenye hadhi bila kuongeza maelezo yasiyokuwapo.
- source_word: מָרֵי נֶפֶשׁ
  choice: wana uchungu moyoni
  rationale: Usemi huu unahifadhi picha ya Kiebrania ya uchungu wa ndani huku ukieleweka kwa Kiswahili cha sasa. Katika muktadha, uchungu huo unamaanisha pia ukali au hasira, jambo linalofafanuliwa katika tanbihi bila kufuta mvutano wa usemi wa asili.
- source_word: כְּדֹב שַׁכּוּל
  choice: kama dubu jike aliyepokonywa watoto wake
  rationale: Hii inawasilisha wazi mfano wa dubu jike aliyenyang’anywa watoto wake, picha ya hatari na ukali inayokusudiwa na Kiebrania.
- source_word: בַּשָּׂדֶה
  choice: uwandani
  rationale: ‘Uwandani’ ni tafsiri fupi na ya kawaida ya mahali pa wazi, na inafaa kwa tukio la dubu nje ya makazi.
- source_word: אִישׁ מִלְחָמָה
  choice: mtu wa vita
  rationale: Tafsiri hii inafuata muundo wa Kiebrania na kumweleza Daudi kuwa mtu mwenye uzoefu na ustadi wa vita.
- source_word: לֹא יָלִין אֶת־הָעָם
  choice: hatapitisha usiku pamoja na wanajeshi
  rationale: Kitenzi kina maana ya kukaa au kupitisha usiku. Katika mazingira haya, עָם ni kundi la wapiganaji walio pamoja na Daudi, hivyo ‘wanajeshi’ huzuia kueleweka kama watu kwa ujumla.
- source_word: יָדַעְתָּ
  choice: Unamjua
  rationale: Kiswahili hutumia ‘kumjua’ kwa mtu; umbo hili la moja kwa moja linawasilisha kauli ya Hushai kwa Absalomu kwa kawaida.
- source_word: אֲנָשָׁיו
  choice: watu wake
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida; muktadha tayari unaonyesha kwamba watu hao ni wafuasi wapiganaji wa Daudi.
