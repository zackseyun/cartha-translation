base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/011.yaml
  text: But I advise that all Israel be surely gathered to you[a], from Dan to Beersheba, as numerous as the sand that is by the sea, and that you yourself go into battle.
translation:
  language: sw
  text: Lakini mimi nashauri kwamba Israeli wote wakusanyike kwako kwa hakika, kutoka Dani mpaka Beer-sheba, wakiwa wengi kama mchanga wa bahari, nawe mwenyewe uende vitani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “na uso wako ukienda vitani,” usemi unaomaanisha kwamba wewe binafsi uongoze shambulio.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Lakini
  rationale: Katika muktadha huu chembe hii inaanzisha ushauri wa Hushai unaopingana na mpango wa Ahithofeli; “Lakini” huonyesha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: יָעַצְתִּי
  choice: mimi nashauri
  rationale: Kitenzi יעץ humaanisha kutoa shauri; wakati wa sasa unaonyesha nguvu ya tendo la kusema, huku “mimi” ikisisitiza pendekezo la msemaji.
- source_word: הֵאָסֹף יֵאָסֵף
  choice: wakusanyike ... kwa hakika
  rationale: Muundo wa kitenzi-jina kamili pamoja na kitenzi kilichonyambuliwa unasisitiza uhakika au ukamilifu wa kukusanywa.
- source_word: עָלֶיךָ
  choice: kwako
  rationale: Pamoja na אסף, kihusishi kinaonyesha kukusanyika kwa kiongozi au chini ya uongozi wake; “kwako” ni ya kawaida na haifafanui kupita kiasi.
- source_word: כָל יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Huu ni usemi wa kijumla unaorejelea taifa au jeshi lote; Kiswahili hutumia “Israeli wote” kwa maana hiyo ya watu.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: kutoka Dani mpaka Beer-sheba
  rationale: Ni usemi wa kijiografia unaoonyesha eneo lote la Israeli, hivyo majina na mipaka yake vimehifadhiwa.
- source_word: כַּחוֹל אֲשֶׁר עַל הַיָּם לָרֹב
  choice: wakiwa wengi kama mchanga ulio kando ya bahari
  rationale: Tafsiri hii huhifadhi taswira ya mchanga wa bahari na kueleza wazi kuwa ulinganisho unahusu wingi.
- source_word: וּפָנֶיךָ הֹלְכִים
  choice: nawe mwenyewe uende
  rationale: Kiebrania kihalisi kina “uso wako ukienda,” lakini huu ni usemi unaomaanisha Absalomu aende binafsi; “mwenyewe” huhifadhi msisitizo huo.
- source_word: בַּקְרָב
  choice: vitani
  rationale: קרב hapa hurejelea mapigano au vita; “uende vitani” ni usemi wa asili katika muktadha wa kijeshi.
