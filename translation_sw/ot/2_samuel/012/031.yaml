  text: וְ/אֶת הָ/עָ֨ם אֲשֶׁר בָּ֜/הּ הוֹצִ֗יא וַ/יָּ֣שֶׂם בַּ֠/מְּגֵרָה וּ/בַ/חֲרִצֵ֨י הַ/בַּרְזֶ֜ל וּֽ/בְ/מַגְזְרֹ֣ת הַ/בַּרְזֶ֗ל וְ/הֶעֱבִ֤יר אוֹתָ/ם֙ ב/מלכן וְ/כֵ֣ן יַעֲשֶׂ֔ה לְ/כֹ֖ל עָרֵ֣י בְנֵֽי עַמּ֑וֹן וַ/יָּ֧שָׁב דָּוִ֛ד וְ/כָל הָ/עָ֖ם יְרוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/031.yaml
  text: And he brought out the people who were in it and put them to work with saws[a], iron picks, and iron axes, and made them labor at the brick kiln. Thus he did to all the cities of the Ammonites[c][b]. Then David and all the people returned to Jerusalem.
translation:
  language: sw
  text: Akawatoa watu waliokuwa ndani ya mji, akawaweka wafanye kazi kwa misumeno,[a] sululu za chuma na mashoka ya chuma, na akawalazimisha kufanya kazi kwenye kazi za tanuru la kuchomea matofali.[b] Ndivyo alivyofanya kwa miji yote ya Waamoni.[c] Kisha Daudi na watu wote wakarudi Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawaweka kwenye msumeno, kwenye vifaa vyenye makali vya chuma, na kwenye vifaa vya kukatia vya chuma.” Majina ya zana hizo hayajulikani kwa uhakika.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hapa ni kigumu. Tafsiri ya jadi ni “akawapitisha katika tanuru la kuchomea matofali”; wengine wanaelewa maneno hayo kuwa yanamaanisha kuwaua badala ya kuwatumikisha kwa lazima.
    reason: alternative_reading
  - marker: c
    text: Linganisha 1 Mambo ya Nyakati 20:3, simulizi sambamba ambalo pia lina maneno magumu kutafsiri.
    reason: cross_reference
lexical_decisions:
- source_word: הוֹצִיא
  choice: akawatoa
  rationale: Hifili ya יצא humaanisha ‘kutoa’ au ‘kuongoza nje’; ‘akawatoa’ inadumisha maana ya kusababisha kutoka na ni ya kawaida katika Kiswahili.
- source_word: וַיָּשֶׂם
  choice: akawaweka wafanye kazi kwa
  rationale: Kimsingi ni ‘akaweka’; pamoja na orodha ya vifaa, hapa imeeleweka kuwa aliwapangia kazi ya kulazimishwa. Maana nyingine kali zaidi imehifadhiwa katika tanbihi.
- source_word: בַּמְּגֵרָה
  choice: kwa misumeno
  rationale: מְגֵרָה ni msumeno. Wingi wa Kiswahili unafaa kwa maana ya jumla ya zana katika orodha hii.
- source_word: בַחֲרִצֵי הַבַּרְזֶל
  choice: sululu za chuma
  rationale: Nomino hii ni tata na inaweza kutaja vifaa vyenye makali au vifaa vya kupuria. ‘Sululu za chuma’ ni zana inayowezekana katika muktadha wa kazi, bila kuamua kwamba zilitumiwa kuwaua mateka.
- source_word: בְמַגְזְרֹת הַבַּרְזֶל
  choice: mashoka ya chuma
  rationale: Neno hilo hutaja vifaa vya kukatia kwa upana. ‘Mashoka ya chuma’ ni tafsiri halisi inayosomeka vizuri, huku kutokuwa na uhakika kwa majina ya zana kukitajwa katika tanbihi.
- source_word: וְהֶעֱבִיר אֹתָם
  choice: akawalazimisha kufanya kazi
  rationale: Hifili ya עבר ni kihalisi ‘akawapitisha,’ lakini pamoja na kirai kinachofuata inaweza kumaanisha kuwatumikisha. Tafsiri hii inatoa maana inayoeleweka, huku usomaji wa jadi wa ‘kuwapitisha’ ukihifadhiwa katika tanbihi.
- source_word: במלכן
  choice: katika tanuru la matofali
  rationale: Maandishi ya konsonanti ni magumu. Kwa kuzingatia muktadha na 1 Mambo ya Nyakati 20:3, yanaweza kueleweka kuhusu kazi ya kutengeneza matofali. Usomaji wa jadi ‘kupitia tanuru la matofali’ umetajwa katika tanbihi.
- source_word: וְכֵן יַעֲשֶׂה
  choice: Ndivyo alivyofanya
  rationale: Hii inatoa muhtasari wa tendo la Daudi kwa miji ya Waamoni kwa Kiswahili cha masimulizi kilicho wazi.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: kwa miji yote ya Waamoni
  rationale: ‘Waamoni’ ndilo jina la kawaida la watu hawa katika Kiswahili, badala ya tafsiri ya neno kwa neno ‘wana wa Amoni.’
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  choice: wakarudi Yerusalemu
  rationale: שוב pamoja na mahali panapolengwa humaanisha kurudi; muundo huu ni mfupi na wa kawaida katika Kiswahili.
theological_decisions:
- issue: Ikiwa Daudi aliwaua mateka wa Kiamoni kwa zana na tanuru au aliwatumikisha kwa kazi ngumu
  choice: Aliwaweka katika kazi ya kulazimishwa kwa kutumia zana na katika tanuru la matofali
  alternative: Aliwaua kwa misumeno na vifaa vya chuma na kwa kuwapitisha katika tanuru la matofali
  rationale: Kiebrania kina utata, hasa katika וַיָּשֶׂם na וְהֶעֱבִיר ... במלכן. Muktadha wa kuwatiisha watu walioshindwa na simulizi sambamba la 1 Mambo ya Nyakati 20:3 vinaunga mkono usomaji wa kazi ya kulazimishwa, lakini uwezekano wa adhabu ya kifo haujaondolewa kimya kimya; umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. Sentensi kuu inatumia usomaji wa kazi ya kulazimishwa lakini tanbihi zinahifadhi utata halisi wa Kiebrania na uwezekano wa usomaji wa hukumu ya kifo.
