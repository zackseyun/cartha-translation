  text: And Joab fought against Rabbah of the Ammonites and captured the royal city[a].
translation:
  language: sw
  text: Yoabu akapigana dhidi ya Raba ya Waamoni, akauteka mji wa kifalme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mji mkuu.” Kiebrania kinasema kihalisi, “mji wa ufalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֶם
  choice: akapigana dhidi ya
  rationale: Kitenzi לחם katika Nifali kinaonyesha kushiriki katika vita; ‘akapigana dhidi ya’ ni Kiswahili cha kawaida kinachoonyesha wazi kuwa Raba ndiyo iliyoshambuliwa.
- source_word: רַבַּת בְּנֵי עַמּוֹן
  choice: Raba ya Waamoni
  rationale: Raba ni jina la mahali, na בְּנֵי עַמּוֹן ni jina la kawaida la kikabila na kisiasa; ‘Waamoni’ ni namna ya asili na iliyo wazi katika Kiswahili.
- source_word: וַיִּלְכֹּד
  choice: akauteka
  rationale: לכד katika muktadha wa kijeshi humaanisha kuteka au kushika; kiambishi ‘u’ kinarejelea mji unaofuata.
- source_word: עִיר הַמְּלוּכָה
  choice: mji wa kifalme
  rationale: Huhifadhi kwa ukaribu maana halisi ya ‘mji wa ufalme/kifalme’ bila kuamua kimya kimya kwamba lazima uwe ‘mji mkuu.’
