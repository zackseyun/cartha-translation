  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi kwa ‘aka-’ huhifadhi mfuatano wa matendo ya Kiebrania kwa njia ya kawaida katika Kiswahili. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
