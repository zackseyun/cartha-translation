  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְנַחֵ֣ם דָּוִ֗ד אֵ֚ת בַּת שֶׁ֣בַע אִשְׁתּ֔/וֹ וַ/יָּבֹ֥א אֵלֶ֖י/הָ וַ/יִּשְׁכַּ֣ב עִמָּ֑/הּ וַ/תֵּ֣לֶד בֵּ֗ן ו/יקרא אֶת שְׁמ/וֹ֙ שְׁלֹמֹ֔ה וַ/יהוָ֖ה אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/024.yaml
  text: Then David comforted Bathsheba his wife[a], and he went in to her and lay with her. She bore a son, and he named him Solomon[b]. And Yahweh loved him.
translation:
  language: sw
  text: Kisha Daudi akamfariji[a] Bathsheba, mke wake. Akaingia kwake na kulala naye,[b] naye akazaa mwana. Daudi akamwita mtoto huyo Sulemani. Naye Yahwe akampenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamliwaza.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “akaingia kwake na kulala naye” ni msemo wa Kiebrania unaorejelea kujamiiana.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְנַחֵם
  choice: akamfariji
  rationale: Kitenzi hiki katika hali ya piel kinamaanisha kumpa mtu faraja baada ya huzuni; katika muktadha huu ni baada ya kifo cha mtoto.
- source_word: בַּת שֶׁבַע
  choice: Bathsheba
  rationale: Jina la mtu limetoholewa kwa tahajia inayotambulika katika Kiswahili bila kulibadilisha maana.
- source_word: אִשְׁתּוֹ
  choice: mke wake
  rationale: Kirai hiki kimetajwa wazi katika Kiebrania na kinadumisha jinsi simulizi linavyomtambulisha Bathsheba katika hatua hii.
- source_word: וַיָּבֹא אֵלֶיהָ וַיִּשְׁכַּב עִמָּהּ
  choice: Akaingia kwake na kulala naye
  rationale: Tafsiri inadumisha misemo miwili ya Kiebrania kwa lugha yenye staha; kwa pamoja inarejelea kujamiiana.
- source_word: וַתֵּלֶד בֵּן
  choice: naye akazaa mwana
  rationale: Ni tafsiri fupi, ya kawaida, na iliyo karibu na muundo wa Kiebrania.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ שְׁלֹמֹה
  choice: Daudi akamwita mtoto huyo Sulemani
  rationale: Kiswahili cha kawaida hutumia ‘kumwita’ kwa tendo la kumpa jina. Kiima cha kiume cha umoja kinaeleweka katika muktadha kuwa Daudi, hivyo jina lake limetajwa ili kuzuia utata wa viwakilishi.
- source_word: שְׁלֹמֹה
  choice: Sulemani
  rationale: Hili ndilo umbo la jina hili linalotambulika kwa kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetolewa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: אֲהֵבוֹ
  choice: akampenda
  rationale: Kitenzi אהב humaanisha moja kwa moja kupenda, na kiambishi chake kinamrejelea mwana aliyezaliwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la Mungu mwenyewe, si cheo; ‘Yahwe’ hulihifadhi jina hilo katika Kiswahili.
- issue: Anayempa mtoto jina
  choice: Daudi
  alternative: 'kiima kisitajwe wazi: ‘akamwita’'
  rationale: Kitenzi cha Kiebrania kina kiima cha kiume cha umoja, na muktadha unamwelekeza msomaji kwa Daudi. Kumtaja wazi kunafanya Kiswahili kieleweke bila kubadili maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye staha na unaoeleweka kwa wasomaji wa kawaida. Viunganishi na viambishi vya mfululizo vimetumiwa kudumisha mwendo wa simulizi la Kiebrania.
