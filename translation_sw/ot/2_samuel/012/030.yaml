base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/030.yaml
  text: He took the crown of their king from his head[a]. Its weight was a talent of gold, and in it was a precious stone, and it was placed on David’s head[b]. He brought out the spoil of the city in very great quantity.
translation:
  language: sw
  text: Akalitwaa taji la mfalme wao kutoka kichwani mwake[a]. Uzito wake ulikuwa talanta moja ya dhahabu[b], na ndani yake lilikuwa na jiwe la thamani. Taji hilo likawekwa kichwani mwa Daudi. Akatoa kutoka katika mji huo nyara nyingi sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “taji la Milkomu” (pia huandikwa “Malkamu”), ikiwa מַלְכָּם linaeleweka kuwa jina la mungu wa Waamoni badala ya “mfalme wao.”
    reason: alternative_reading
  - marker: b
    text: Talanta ilikuwa kipimo kikubwa sana cha uzito, ambacho mara nyingi hukadiriwa kuwa karibu kilogramu 34, ingawa vipimo vya kale vilitofautiana.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: taji
  rationale: Katika muktadha huu neno hilo linamaanisha taji la kifalme; “taji” ni neno la kawaida, la heshima, na linaloeleweka wazi katika Kiswahili cha sasa.
- source_word: מַלְכָּם
  choice: mfalme wao
  rationale: Muundo huu unaweza kueleweka kama nomino “mfalme” yenye kiambishi cha nafsi ya tatu wingi, yaani “mfalme wao.” Sintaksia ya kuondoa taji kichwani mwake inaunga mkono maana hii, huku usomaji wa jina la mungu Milkomu ukihifadhiwa katika tanbihi.
- source_word: מֵעַל רֹאשׁוֹ
  choice: kutoka kichwani mwake
  rationale: Huwasilisha kwa Kiswahili cha asili wazo la kuliondoa taji lililokuwa juu ya kichwa chake bila kutumia muundo mzito au usio wa kawaida.
- source_word: כִּכַּר זָהָב
  choice: talanta moja ya dhahabu
  rationale: כִּכָּר ni kipimo kikubwa cha uzito cha kale. “Talanta” ni istilahi iliyozoeleka katika tafsiri za Biblia, na maelezo ya takriban uzito wake yametolewa katika tanbihi.
- source_word: וְאֶבֶן יְקָרָה
  choice: na ndani yake mlikuwa na jiwe la thamani
  rationale: Kiebrania ni kifupi, kihalisi “na jiwe la thamani.” Muundo huu unaonyesha kwa kawaida kuwa jiwe hilo lilihusiana na taji, bila kufafanua zaidi namna lilivyopachikwa.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִד
  choice: Taji hilo likawekwa kichwani mwa Daudi
  rationale: Kitenzi cha kike kinarejelea taji. Kutaja “taji hilo” huondoa utata wa kiwakilishi katika Kiswahili, na “likawekwa” huwasilisha kwa kawaida tukio la taji kuwa juu ya kichwa cha Daudi.
- source_word: וּשְׁלַל הָעִיר
  choice: nyara ... kutoka mjini
  rationale: שָׁלָל ni mali iliyotekwa vitani. “Nyara” ni neno la kawaida na linalofaa simulizi la kihistoria la vita.
- source_word: הוֹצִיא הַרְבֵּה מְאֹד
  choice: Akatoa nyara nyingi sana
  rationale: Hifili ya יצא ina maana ya kutoa au kuleta nje, na הַרְבֵּה מְאֹד inasisitiza wingi mkubwa. Kiswahili hiki ni cha asili na kinabaki karibu na maana ya chanzo.
theological_decisions:
- issue: Ikiwa מַלְכָּם humaanisha “mfalme wao” au ni jina la mungu wa Waamoni, Milkomu/Malkamu
  choice: mfalme wao
  alternative: Milkomu (au Malkamu)
  rationale: Uchanganuzi wa kimofolojia na kauli “kutoka kichwani mwake” zinaunga mkono rejeo kwa mfalme. Hata hivyo, usomaji wa jina la mungu unajulikana na unawezekana, kwa hiyo haujaondolewa bali umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo “Akalitwaa” unadumisha mwendelezo wa simulizi; “taji hilo” limetumiwa badala ya kiwakilishi kisicho wazi. Tanbihi ya kipimo imewekwa mara tu baada ya “talanta moja ya dhahabu” ili rejeo lake liwe wazi.
