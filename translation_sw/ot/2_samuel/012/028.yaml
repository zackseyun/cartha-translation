  text: Now gather the rest of the troops[a], camp against the city, and capture it, lest I capture the city and it be called by my name.
translation:
  language: sw
  text: Sasa kusanya wanajeshi waliobaki, piga kambi dhidi ya mji huo, na uuteke; la sivyo, mimi nitauteka mji huo, nao utaitwa kwa jina langu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania husema kihalisi, “jina langu litaitwa juu yake.” Nahau hii inaonyesha kwamba sifa za kuuteka mji huo zingehusishwa na Yoabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Ni kiashiria cha hotuba kinachoanzisha hatua inayofuata kwa msisitizo; “Basi sasa” ni cha kawaida na hudumisha uhusiano na yaliyotangulia.
- source_word: אֱסֹף
  choice: wakusanye
  rationale: Amri ya kukusanya watu kwa kusudi la kijeshi; “wakusanye” ni ya kawaida na inaeleweka kuliko istilahi ya kitaalamu zaidi.
- source_word: יֶתֶר הָעָם
  choice: wanajeshi waliobaki
  rationale: Ingawa עָם kwa kawaida ni “watu,” muktadha wa kuuzingira mji unaonyesha kikosi kilichobaki; “wanajeshi” huwasilisha maana hiyo ya kijeshi.
- source_word: וַחֲנֵה עַל הָעִיר
  choice: upige kambi dhidi ya mji huo
  rationale: Huhifadhi maana ya msingi ya חנה, kupiga kambi, pamoja na mwelekeo wa uhasama wa עַל katika muktadha huu, bila kuipanua moja kwa moja kuwa “uzingire.”
- source_word: וְלָכְדָהּ
  choice: na kuuteka
  rationale: לכד ni kuutwaa au kuuteka mji vitani; “kuuteka” ni neno la kawaida na sahihi katika simulizi la kijeshi.
- source_word: פֶּן
  choice: La sivyo
  rationale: Huwasilisha kwa Kiswahili cha sasa onyo la matokeo yasiyotakiwa linaloletwa na פן.
- source_word: אֶלְכֹּד אֲנִי
  choice: mimi nitauteka
  rationale: Kiwakilishi “mimi” kinahifadhi msisitizo wa אֲנִי, huku “nitauteka” kikidumisha kitenzi kilekile cha kijeshi.
- source_word: וְנִקְרָא שְׁמִי עָלֶיהָ
  choice: nao utaitwa kwa jina langu
  rationale: Ni uwasilishaji wa kawaida wa nahau ya Kiebrania kuhusu jina la msemaji kuitwa juu ya mji; huacha wazi wazo la sifa, mamlaka, au uhusishaji wa ushindi, huku tanbihi ikifafanua nahau hiyo.
