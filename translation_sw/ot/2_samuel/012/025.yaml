base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/025.yaml
  text: And he sent word through Nathan the prophet[a], and he called his name Jedidiah[b], because of Yahweh.
translation:
  language: sw
  text: Akatuma ujumbe kupitia kwa nabii Nathani[a], akamwita mtoto huyo Yedidia[b], kwa sababu ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “kwa mkono wa nabii Nathani.”
    reason: lexical_alternative
  - marker: b
    text: Huenda Yedidia humaanisha “mpendwa wa Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Akatuma ujumbe
  rationale: Kitenzi chenyewe ni ‘akatuma,’ lakini pamoja na kishazi cha wakala kinadokeza ujumbe au agizo lililowasilishwa kupitia Nathani. ‘Akatuma ujumbe’ ni Kiswahili cha kawaida kinachoweka wazi tendo hilo bila kulipanua kupita kiasi.
- source_word: בְּיַד נָתָן הַנָּבִיא
  choice: kupitia kwa nabii Nathani
  rationale: Kirai hicho kwa neno halisi ni ‘kwa mkono wa,’ lakini ni nahau ya Kiebrania inayoonyesha wakala au mpatanishi. ‘Kupitia kwa nabii Nathani’ hutoa maana hiyo kwa Kiswahili cha sasa.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: akamwita mtoto huyo
  rationale: Nahau ya Kiebrania ‘akaita jina lake’ humaanisha kumpa mtu jina. Kumtaja ‘mtoto huyo’ hufanya kiwakilishi kiwe wazi na sentensi iwe ya kawaida kwa Kiswahili.
- source_word: יְדִידְיָהּ
  choice: Yedidia
  rationale: Jina limetoholewa kwa kufuata matamshi ya Kiebrania na mazoea ya majina ya kibiblia katika Kiswahili. Maana yake inayowezekana imewekwa katika tanbihi.
- source_word: בַּעֲבוּר
  choice: kwa sababu ya
  rationale: Kirai hiki kinatoa sababu au msingi wa jina hilo. ‘Kwa sababu ya’ huhifadhi uhusiano huo bila kuamua zaidi jinsi Yahwe anavyohusiana na jina.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetolewa kama jina binafsi ‘Yahwe,’ badala ya kubadilishwa na cheo kama ‘BWANA.’
theological_decisions:
- issue: Mtendaji wa vitenzi ‘akatuma’ na ‘akamwita’
  choice: Mtendaji ameachwa bila kutajwa wazi, kama katika Kiebrania, huku mfululizo wa vitenzi ukidokeza mtendaji yuleyule.
  alternative: Kumtaja Yahwe wazi kuwa ndiye aliyetuma ujumbe na kumpa mtoto jina.
  rationale: Muktadha unampendelea Yahwe kuwa mtendaji, lakini Kiebrania hakilitaji jina lake kama kiima cha vitenzi hivi. Kiswahili kisicho na kiima kilichotajwa huhifadhi uhusiano huo na pia huepuka kuondoa kabisa uwezekano wa kisarufi unaohusisha Nathani katika tendo la kumwita jina.
- issue: Maana ya בַּעֲבוּר יְהוָה
  choice: kwa sababu ya Yahwe
  alternative: kwa ajili ya Yahwe
  rationale: ‘Kwa sababu ya Yahwe’ huhifadhi sababu au msingi unaotajwa na chanzo bila kuongeza dai maalumu kuhusu kusudi la jina au mtu aliyependwa.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘Akatuma … naye akamwita’ huhifadhi mtiririko wa simulizi na kutotajwa wazi kwa kiima katika chanzo. Alama zote za tanbihi zimewekwa mahali zinapohusu: [a] baada ya wakala Nathani na [b] baada ya jina Yedidia.'
