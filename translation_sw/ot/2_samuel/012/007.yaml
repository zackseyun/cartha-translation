  text: וַ/יֹּ֧אמֶר נָתָ֛ן אֶל דָּוִ֖ד אַתָּ֣ה הָ/אִ֑ישׁ כֹּה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אָנֹכִ֞י מְשַׁחְתִּ֤י/ךָֽ לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל וְ/אָנֹכִ֥י הִצַּלְתִּ֖י/ךָ מִ/יַּ֥ד שָׁאֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/007.yaml
  text: 'Then Nathan said to David[a], “You are the man! Thus says Yahweh, the God of Israel: I anointed you king over Israel, and I delivered you from the hand of Saul.”'
translation:
  language: sw
  text: 'Ndipo Nathani akamwambia Daudi, “Wewe ndiye mtu huyo![a] Yahweh, Mungu wa Israeli, asema hivi: Mimi nilikutia mafuta kuwa mfalme juu ya Israeli, nami nilikuokoa kutoka mkononi mwa Sauli.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wewe ndiye mtu!” Kiebrania kinasema kihalisi, “Wewe ndiye mtu.”
    reason: 'Tofauti ya kileksika: neno bainishi la Kiebrania linaweza kutafsiriwa kwa karibu zaidi kama “mtu,” ilhali “mtu huyo” hufanya wazi marejeleo ya muktadha kwa mtu wa mfano wa Nathani.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo wa simulizi unaendeleza tukio kwa mpangilio. ‘Ndipo’ na kitenzi cha -ka- huonyesha mwendelezo huo kwa Kiswahili cha kawaida.
- source_word: אַתָּה הָאִישׁ
  choice: Wewe ndiye mtu!
  rationale: Sentensi isiyo na kitenzi ina mkazo mkubwa na ndiyo kilele cha mfano wa Nathani. ‘Wewe ndiye mtu!’ huhifadhi usemi wa Kiebrania bila kuongeza neno ‘huyo,’ ingawa maana hiyo inawezekana katika muktadha.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Huu ni mfumo rasmi wa ujumbe wa kinabii. ‘Asema hivi’ ni wa heshima, wa sasa, na wa kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetafsiriwa kwa unukuzi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa umilikaji wa Kiebrania.
- source_word: אָנֹכִי ... וְאָנֹכִי
  choice: Mimi ... nami
  rationale: Kiwakilishi huru kinachorudiwa kinaonyesha mkazo. ‘Mimi ... nami’ huhifadhi mkazo huo kwa Kiswahili cha asili bila kuuzidisha.
- source_word: מְשַׁחְתִּיךָ לְמֶלֶךְ
  choice: nilikutia mafuta uwe mfalme
  rationale: Katika muktadha wa kifalme, kitenzi hiki humaanisha kumweka mtu rasmi katika cheo kwa kumpaka mafuta. Usemi huu unahifadhi tendo la kihistoria na maana yake ya uteuzi wa kifalme.
- source_word: עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: Kihusishi kinaonyesha mamlaka ya kutawala; ‘juu ya Israeli’ huhifadhi wazo hilo kwa uwazi.
- source_word: הִצַּלְתִּיךָ
  choice: nilikuokoa
  rationale: Kitenzi kinaonyesha kumwondoa mtu katika hatari au nguvu ya adui. ‘Nilikuokoa’ ni cha kawaida na wazi katika Kiswahili katika muktadha huu.
- source_word: מִיַּד שָׁאוּל
  choice: kutoka mkononi mwa Sauli
  rationale: Nahau ya ‘mkono’ humaanisha nguvu au udhibiti. Kuihifadhi hudumisha picha ya chanzo huku ikieleweka vizuri kwa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina binafsi la Mungu, si cheo. ‘Yahweh’ hulihifadhi kwa unukuzi bila kulibadilisha kuwa ‘BWANA’; ‘Yehova’ ni umbo jingine la jadi lakini halifuati kwa ukaribu uleule ushahidi wa matamshi unaokubaliwa kwa kawaida.
- issue: Mkazo wa kiwakilishi אָנֹכִי
  choice: Mimi ... nami
  alternative: Nilikuwa mimi mwenyewe ... nami mwenyewe
  rationale: Kiebrania kinakazia kwamba Yahweh ndiye aliyemtia Daudi mafuta na kumwokoa. Kiswahili kinaonyesha mkazo huo kwa ‘Mimi’ na urudiaji wa ‘nami’ bila kuongeza ‘mwenyewe,’ ambalo lingeweza kuzidisha mkazo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa simulizi lakini kinachoeleweka kwa wasomaji wa leo. Mfumo wa kinabii umetafsiriwa ‘asema hivi,’ na picha ya ‘mkono wa Sauli’ imehifadhiwa kwa sababu ni wazi na ina uzito wa chanzo.
