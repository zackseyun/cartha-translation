  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Tafsiri inadumisha mshangao wa watumishi na utofauti kati ya matendo ya Daudi kabla na baada ya kifo cha mtoto.
