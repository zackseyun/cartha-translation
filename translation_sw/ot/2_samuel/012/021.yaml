base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/021.yaml
  text: Then his servants said to him[a], “What is this thing that you have done? While the child was alive, you fasted and wept; but when the child died, you got up and ate bread.”
translation:
  language: sw
  text: Ndipo watumishi wake wakamwambia, “Ni jambo gani hili ulilofanya? Mtoto alipokuwa hai, ulifunga na ukalia; lakini mtoto alipokufa, uliinuka na kula mkate[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kiebrania, “kula mkate” ni nahau inayomaanisha kula chakula au mlo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ עֲבָדָיו אֵלָיו
  choice: Ndipo watumishi wake wakamwambia
  rationale: “Ndipo” linaendeleza mfuatano wa simulizi, na “watumishi” linafaa kwa mazingira ya ikulu bila kusisitiza hali ya utumwa ambayo neno עֲבָדִים linaweza pia kumaanisha.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָה
  choice: Ni jambo gani hili ulilofanya?
  rationale: Muundo huu unahifadhi mshangao na usemi halisi wa Kiebrania kuliko kuugeuza moja kwa moja kuwa swali la “Kwa nini?”
- source_word: בַּעֲבוּר הַיֶּלֶד חַי
  choice: Mtoto alipokuwa hai
  rationale: Katika muktadha huu, kirai kinaeleweka kwa nguvu ya wakati na kinaandaa ulinganisho na kifo cha mtoto; “mtoto” linafaa kwa mwana mchanga wa Daudi.
- source_word: צַמְתָּ וַתֵּבְךְּ
  choice: ulifunga na kulia
  rationale: Haya ni maneno ya kawaida, yenye heshima, na yanayowakilisha moja kwa moja matendo ya kufunga na kulia.
- source_word: וְכַאֲשֶׁר מֵת הַיֶּלֶד
  choice: lakini mtoto alipokufa
  rationale: “Lakini” linaonyesha wazi utofauti wa matendo unaokusudiwa na swali la watumishi, huku “alipokufa” likihifadhi hali ya kitendo ya kitenzi cha Kiebrania.
- source_word: קַמְתָּ וַתֹּאכַל לָחֶם
  choice: uliinuka na kula mkate
  rationale: “Uliinuka” linaakisi קום kwa mtindo wa simulizi wenye heshima. “Kula mkate” linahifadhi picha halisi na nahau ya Kiebrania, huku tanbihi ikifafanua maana yake pana.
