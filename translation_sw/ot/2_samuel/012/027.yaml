translation:
  language: sw
  text: Kisha Yoabu akatuma wajumbe kwa Daudi, akasema, “Nimepigana dhidi ya Raba; pia nimeuteka mji wa maji[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “mji wa maji”; huenda ikimaanisha sehemu ya Raba iliyodhibiti chanzo chake cha maji.
