lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Kisha ... akatuma
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “Kisha” ni ya asili katika Kiswahili na huhifadhi ufuatano wa matukio.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu neno linamaanisha watu waliotumwa kupeleka taarifa, si malaika.
- source_word: נִלְחַמְתִּי בְרַבָּה
  choice: Nimepigana dhidi ya Raba
  rationale: Muundo huu unaonyesha kupigana na mji katika mazingira ya kuuzingira au kuushambulia; wakati timilifu wa Kiswahili unafaa kwa taarifa ya tendo lililokamilika lenye umuhimu wa sasa.
- source_word: רַבָּה
  choice: Raba
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili; utambulisho mpana wa mji unajulikana kutokana na muktadha.
- source_word: גַּם
  choice: pia
  rationale: “Pia” huhifadhi maana ya kuongeza tendo la pili kwenye la kwanza.
- source_word: לָכַדְתִּי
  choice: nimeuteka
  rationale: “Kuteka” ni neno la kawaida na sahihi kwa kuuchukua mji kwa nguvu za kijeshi.
- source_word: עִיר הַמָּיִם
  choice: mji wa maji
  rationale: Tafsiri hii ya karibu huhifadhi usemi wa Kiebrania bila kuamua kimya kimya kwamba ulikuwa sehemu maalumu ya mji au eneo lililodhibiti chanzo cha maji.
