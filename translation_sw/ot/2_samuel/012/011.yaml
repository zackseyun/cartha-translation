base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/011.yaml
  text: 'Thus says Yahweh: Behold[a], I am raising up disaster against you from your own house, and I will take your wives before your eyes and give them to your neighbor[b], and he will lie with your wives in the sight of this sun.'
translation:
  language: sw
  text: 'BWANA asema hivi: “Tazama, nitaleta maafa dhidi yako kutoka katika nyumba yako mwenyewe. Nitawachukua wake zako mbele ya macho yako, na nitawapa mwenzako[a]; naye atalala na wake zako mbele ya jua hili[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jirani yako,” “rafiki yako,” au “mtu wako wa karibu.” Neno la Kiebrania linaweza kumaanisha jirani, mwenzake, rafiki, au mshirika.
    reason: lexical_alternative
  - marker: b
    text: Maana yake ni kwamba jambo hilo litafanyika waziwazi, hadharani.
    reason: idiom_explanation
lexical_decisions:
- source_word: יְהוָה
  choice: BWANA
  rationale: Katika Kiswahili sanifu cha Biblia, BWANA ni uwakilishi unaotambulika wa jina la agano YHWH; herufi kubwa hulitofautisha na cheo cha kawaida.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Huhifadhi fomula ya ujumbe wa kinabii kwa Kiswahili cha sasa na chenye hadhi.
- source_word: הִנְנִי
  choice: Tazama
  rationale: Huhifadhi kish particle cha kuvuta usikivu na kusisitiza tangazo linalofuata.
- source_word: מֵקִים ... רָעָה
  choice: nitaleta maafa
  rationale: Katika muktadha huu רָעָה ni janga au hukumu yenye madhara, si uovu wa kimaadili. Kiswahili cha kawaida hutumia ‘kuleta maafa’ kwa maana hii.
- source_word: עָלֶיךָ
  choice: juu yako
  rationale: Huwasilisha mwelekeo wa hukumu dhidi ya Daudi huku ukidumisha taswira ya Kiebrania.
- source_word: מִבֵּיתֶךָ
  choice: kutoka katika nyumba yako mwenyewe
  rationale: ‘Nyumba’ inahusisha jamaa na ukoo wa Daudi, na ‘mwenyewe’ husisitiza kuwa chanzo kitakuwa ndani ya familia yake.
- source_word: וְלָקַחְתִּי אֶת נָשֶׁיךָ
  choice: Nitawachukua wake zako
  rationale: Ni tafsiri ya moja kwa moja isiyoongeza ukali usio lazima kwa kitenzi ‘kuchukua’.
- source_word: לְעֵינֶיךָ
  choice: mbele ya macho yako
  rationale: Huhifadhi nahau halisi yenye maana ya kutendeka wazi na Daudi akiwa anajua.
- source_word: לְרֵעֶיךָ
  choice: kwa mwenzako
  rationale: רֵעַ inaweza kumaanisha jirani, mwenzake, rafiki au mtu wa karibu. ‘Mwenzako’ huhifadhi upana huo bila kudai urafiki wa ndani.
- source_word: וְשָׁכַב עִם
  choice: atalala na
  rationale: Huhifadhi sitiari ya Kiebrania ya tendo la ngono kwa lugha ya Kiswahili inayoeleweka na yenye uzito.
- source_word: לְעֵינֵי הַשֶּׁמֶשׁ הַזֹּאת
  choice: mbele ya jua hili
  rationale: Huhifadhi taswira halisi na isiyo ya kawaida ya tukio kufanyika wazi chini ya jua.
theological_decisions:
- issue: Maana ya רָעָה katika hukumu ya Mungu
  choice: maafa
  alternative: uovu
  rationale: Muktadha unaonyesha madhara ya hukumu yanayoletwa juu ya Daudi, si uovu wa kimaadili unaofanywa na Mungu.
- issue: Utambulisho wa רֵעַ
  choice: mwenzako
  alternative: jirani yako
  rationale: Neno la Kiebrania lina wigo mpana, na aya yenyewe haimtaji mtu huyo kwa jina. ‘Mwenzako’ huhifadhi kutobainishwa huko na uwezekano wa mtu wa karibu katika mazingira ya Daudi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kinabii na taswira ya ‘mbele ya jua hili’ zimehifadhiwa, huku nahau zikibaki wazi kwa msomaji wa kawaida.
