base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/020.yaml
  text: Then David got up from the ground[a], washed, anointed himself, and changed his clothes. He went into the house of Yahweh and bowed down. Then he went to his house, asked, and they set bread before him, and he ate.
translation:
  language: sw
  text: Ndipo Daudi akainuka kutoka chini, akaoga, akajipaka mafuta, akabadilisha nguo zake. Akaingia katika nyumba ya Yahweh, akasujudu[a]. Kisha akaenda nyumbani kwake, akaomba, nao wakamwekea mkate, akala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akaabudu”; kitenzi cha Kiebrania kinaweza kumaanisha kusujudu kimwili kwa heshima au kuabudu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם מֵהָאָרֶץ
  choice: akainuka kutoka chini
  rationale: Hueleza kitendo cha Daudi kuinuka mahali alipokuwa amelala chini wakati wa maombolezo; ‘chini’ ni ya kawaida na ya kueleweka katika Kiswahili.
- source_word: וַיִּרְחַץ
  choice: akaoga
  rationale: Katika mfuatano huu wa kuacha maombolezo, kitenzi kinaelekea kumaanisha kuosha mwili au kuoga; ‘akaoga’ ni usemi wa kawaida wa Kiswahili.
- source_word: וַיָּסֶךְ
  choice: akajipaka mafuta
  rationale: Kitenzi סוך hapa humaanisha kujipaka mafuta mwilini, desturi iliyohusiana na kujitunza baada ya maombolezo.
- source_word: וַיְחַלֵּף שִׂמְלֹתוֹ
  choice: kubadili nguo zake
  rationale: Nomino ya Kiebrania inaweza kutumiwa kwa maana ya mavazi kwa ujumla; wingi ‘nguo zake’ ni wa kawaida katika Kiswahili.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahweh
  rationale: Inadumisha usemi wa Kiebrania wa mahali patakatifu pamoja na jina binafsi la Mungu.
- source_word: וַיִּשְׁתָּחוּ
  choice: akasujudu
  rationale: Huhifadhi kitendo cha kuinama au kujilaza kwa heshima mbele za Mungu bila kupunguza maana yake kuwa wazo la ndani pekee.
- source_word: וַיִּשְׁאַל
  choice: akaomba
  rationale: Kiebrania hakitaji wazi kitu alichoomba; tafsiri hii inadumisha kutotajwa huko, huku sentensi inayofuata ikionyesha kuwa ombi lilihusu chakula.
- source_word: וַיָּשִׂימוּ לוֹ לֶחֶם
  choice: wakamwekea mkate
  rationale: Inahifadhi ‘mkate’ kwa לֶחֶם na mhusika wa wingi ambaye hakutajwa kwa jina.
- source_word: וַיֹּאכַל
  choice: akala
  rationale: Ni hitimisho rahisi na la moja kwa moja la mfululizo wa matendo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina la agano יהוה; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Maana ya וַיִּשְׁתָּחוּ katika nyumba ya Yahweh
  choice: akasujudu
  alternative: akaabudu
  rationale: ‘Akasujudu’ huhifadhi tendo halisi la kuinama kwa heshima, huku muktadha ukionyesha wazi kuwa tendo hilo lilikuwa la ibada.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfululizo wa vitenzi vya ‘aka-’ unadumisha mwendo wa simulizi la Kiebrania. ‘Akaomba’ limeachwa bila kitu kilichotajwa ili kuhifadhi ufupi na kutotajwa kwa yambwa katika chanzo.
