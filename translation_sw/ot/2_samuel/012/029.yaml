  text: Then David gathered all the people and went to Rabbah and fought against it and captured it[a].
translation:
  language: sw
  text: Kisha Daudi akawakusanya watu wote[a], akaenda Raba, akapigana dhidi ya Raba, akauteka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jeshi lote” au “askari wote”; Kiebrania kihalisi, “watu wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: akawakusanya
  rationale: Kitenzi אסף hapa kina maana ya kuwaleta watu pamoja. “Akawakusanya” ni Kiswahili cha kawaida na hakiongezi wazo mahsusi la ukaguzi rasmi wa kijeshi.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: Hii ndiyo maana ya moja kwa moja ya maneno ya Kiebrania. Katika muktadha huenda yanamaanisha jeshi au askari wote, lakini tafsiri kuu inahifadhi upana wa neno עָם.
- source_word: רַבָּתָה
  choice: akaenda Raba
  rationale: Jina la mahali רַבָּה lina kiambishi cha mwelekeo, hivyo “akaenda Raba” linaonyesha mwendo kuelekea mjini humo.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: akapigana dhidi yake
  rationale: Kitenzi לחם pamoja na ב kinaonyesha kupigana dhidi ya mji. Kiwakilishi “yake” kinarejelea Raba bila kulazimisha jinsia ya kisarufi ya Kiebrania katika Kiswahili.
- source_word: וַיִּלְכְּדָהּ
  choice: na kuiteka
  rationale: לכד katika simulizi la vita humaanisha kuuteka mji. “Kuiteka” ni sahihi, wazi, na ya kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. Muundo wa vitenzi mfululizo umehifadhi mwendo wa haraka wa simulizi la Kiebrania, huku tanbihi ikidumisha uwezekano wa maana ya kijeshi katika “watu wote.”
