  text: וַ/יֹּ֕אמֶר בְּ/עוֹד֙ הַ/יֶּ֣לֶד חַ֔י צַ֖מְתִּי וָֽ/אֶבְכֶּ֑ה כִּ֤י אָמַ֨רְתִּי֙ מִ֣י יוֹדֵ֔עַ יחנ/ני יְהוָ֖ה וְ/חַ֥י הַ/יָּֽלֶד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/022.yaml
  text: He said[a], “While the child was still alive, I fasted and wept, because I said, ‘Who knows? Yahweh may be gracious to me, and the child may live.’”
translation:
  language: sw
  text: Akasema, “Mtoto alipokuwa angali hai, nilifunga na nikalia, kwa maana nilisema, ‘Nani ajuaye? Huenda Yahweh akanionyesha neema, na mtoto akaishi.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעוֹד הַיֶּלֶד חַי
  choice: Mtoto alipokuwa angali hai
  rationale: Muundo huu unaonyesha hali iliyokuwa bado inaendelea wakati uliopita; ‘angali hai’ ni Kiswahili cha kawaida chenye hadhi na huhifadhi wazo la mtoto kuwa bado hai.
- source_word: צַמְתִּי
  choice: nilifunga
  rationale: Kitenzi צום humaanisha kujinyima chakula kwa kufunga; ‘nilifunga’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וָאֶבְכֶּה
  choice: na kulia
  rationale: Kitenzi בכה humaanisha kulia; hapa kinafaa kwa maombolezo ya Daudi bila kuongeza maelezo yasiyomo.
- source_word: כִּי אָמַרְתִּי
  choice: kwa maana nilisema
  rationale: כִּי hapa inatoa sababu ya kufunga na kulia. ‘Kwa maana’ huonyesha uhusiano huo wa kisababu kwa lugha yenye hadhi.
- source_word: מִי יוֹדֵעַ
  choice: Nani ajuaye?
  rationale: Nahau hii huonyesha kutokuwa na uhakika kuhusu jambo ambalo Mungu huenda akafanya; ‘Nani ajuaye?’ ni fupi, ya asili, na huhifadhi hali hiyo.
- source_word: יְחָנֵּנִי
  choice: Huenda ... akanionyesha neema
  rationale: Mzizi חנן una wazo la kuonyesha neema au fadhili. ‘Akanionyesha neema’ huhifadhi mlengwa binafsi na kutostahili kwa fadhili hiyo, huku ‘huenda’ ikionyesha kutokuwa na uhakika.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetolewa kwa unukuzi ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: וְחַי הַיָּלֶד
  choice: naye mtoto akaishi
  rationale: Katika muktadha wa ‘Nani ajuaye?’ kishazi hiki kinaonyesha matokeo yanayotumainiwa, si uhakika. Muundo wa Kiswahili wenye ‘huenda’ inayotawala sentensi yote huhifadhi uwezekano huo.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Kiwango cha uhakika katika tumaini la Daudi
  choice: Huenda Yahweh akanionyesha neema, naye mtoto akaishi
  alternative: Yahweh atanionea neema, naye mtoto ataishi
  rationale: ‘Nani ajuaye?’ huonyesha tumaini lililoambatana na kutokuwa na uhakika, wala si dai kwamba Mungu bila shaka atafanya hivyo. ‘Huenda’ huhifadhi mvutano huo katika vishazi vyote viwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Angali’ na ‘Nani ajuaye?’ zina sauti ya heshima inayofaa simulizi la kibiblia lakini bado zinaeleweka kwa wasomaji wa kawaida. Hakuna alama ya tanbihi iliyowekwa kwa kuwa rasimu hii haina tanbihi.
