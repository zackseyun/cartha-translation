language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לָ/רָ֣שׁ אֵֽין כֹּ֗ל כִּי֩ אִם כִּבְשָׂ֨ה אַחַ֤ת קְטַנָּה֙ אֲשֶׁ֣ר קָנָ֔ה וַ/יְחַיֶּ֕/הָ וַ/תִּגְדַּ֥ל עִמּ֛/וֹ וְ/עִם בָּנָ֖י/ו יַחְדָּ֑ו מִ/פִּתּ֨/וֹ תֹאכַ֜ל וּ/מִ/כֹּס֤/וֹ תִשְׁתֶּה֙ וּ/בְ/חֵיק֣/וֹ תִשְׁכָּ֔ב וַ/תְּהִי ל֖/וֹ כְּ/בַֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/003.yaml
  text: But the poor man had nothing except one little ewe lamb[a], which he had bought. He kept it alive, and it grew up with him and with his children together; it would eat from his morsel and drink from his cup and lie in his bosom[c][b], and it was like a daughter to him.
translation:
  language: sw
  text: Lakini yule maskini hakuwa na kitu chochote isipokuwa mwana-kondoo mmoja mdogo wa kike, ambaye maskini huyo alikuwa amemnunua. Akamhifadhi hai, naye akakua pamoja naye na wanawe. Alikuwa akila tonge la chakula chake, akinywa katika kikombe chake, na kulala kifuani mwake; akawa kwake kama binti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָשׁ
  choice: maskini
  rationale: Nomino hii humaanisha mtu maskini au asiye na mali; “maskini” ni ya kawaida na inadumisha tofauti yake na tajiri wa muktadha.
- source_word: אֵין כֹּל כִּי אִם
  choice: hakuwa na kitu chochote isipokuwa
  rationale: Muundo huu unaonyesha kutokuwa na chochote, ila kitu kimoja tu.
- source_word: כִּבְשָׂה אַחַת קְטַנָּה
  choice: mwana-kondoo mmoja mdogo wa kike
  rationale: Tafsiri hii inadumisha idadi, udogo, na jinsia ya kondoo iliyotajwa katika Kiebrania.
- source_word: אֲשֶׁר קָנָה
  choice: aliyekuwa amenunua
  rationale: קנה hapa ina maana ya kununua au kujipatia; “amenunua” inafaa katika simulizi na kuonyesha kwamba alikuwa mali yake.
- source_word: וַיְחַיֶּהָ
  choice: akamtunza hai
  rationale: Hifili ya חיה inaweza kumaanisha kudumisha uhai au kuhifadhi hai; usemi huu unadumisha maana hiyo bila kuifupisha kuwa kulea tu.
- source_word: וַתִּגְדַּל
  choice: akakua
  rationale: Kitenzi kinaeleza ukuaji wa mwana-kondoo ndani ya nyumba.
- source_word: עִמּוֹ וְעִם בָּנָיו יַחְדָּו
  choice: pamoja naye na wanawe
  rationale: “Wanawe” ni usemi wa kawaida wa Kiswahili kwa watoto wake na unaweza kudumisha kwa kiasi umbo la Kiebrania “wana wake”; “pamoja” huwasilisha wazo la יַחְדָּו.
- source_word: מִפִּתּוֹ
  choice: katika tonge lake
  rationale: פַּת ni kipande au tonge la mkate/chakula; “tonge lake” linadumisha picha ya kushiriki chakula chake mwenyewe.
- source_word: מִכֹּסוֹ
  choice: kutoka katika kikombe chake
  rationale: Tafsiri ya moja kwa moja inayodumisha picha ya kunywa kwenye kikombe cha mwenyewe.
- source_word: בְחֵיקוֹ
  choice: kifuani mwake
  rationale: חֵיק inaweza kuwa kifua, mapaja, au sehemu ya kukumbatia; “kifuani mwake” ni ya asili na inadumisha ukaribu wa upendo.
- source_word: תִשְׁכָּב
  choice: kulala
  rationale: Kitenzi humaanisha kulala chini; katika muktadha huu “kulala” ni ya kawaida bila kulazimisha zaidi kama alikuwa amelala usingizi.
- source_word: וַתְּהִי לוֹ כְּבַת
  choice: akawa kwake kama binti
  rationale: Tafsiri hii inadumisha wazi tashbihi ya kifamilia na nguvu yake ya kihisia.
theological_decisions:
- issue: Picha ya karibu ya kifamilia inayotumiwa kumhusu mwana-kondoo
  choice: Kudumisha lugha ya kushiriki chakula, kikombe, na kulala kifuani, pamoja na tashbihi ya binti
  alternative: Kulainisha picha hiyo na kusema tu kwamba mwana-kondoo alikuwa kipenzi cha familia
  rationale: Kiebrania kimakusudi kinajenga huruma kwa kumwonyesha mwana-kondoo kama mshiriki aliyependwa sana katika nyumba; kuifupisha kungepunguza nguvu ya mfano.
- issue: Maana ya בָּנָיו
  choice: wanawe
  alternative: wana wake wa kiume
  rationale: Umbo la Kiebrania linaweza kutafsiriwa rasmi “wana wake,” lakini “wanawe” katika Kiswahili ni la asili katika mazingira ya familia na halilazimishi kwamba watoto wote walikuwa wa kiume.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, kwa mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Nyakati za mazoea katika sehemu ya kula, kunywa, na kulala zinadumisha hali ya vitendo vilivyorudiwa katika Kiebrania. Lugha ya kifamilia imeachwa iwe na nguvu yake ya kihisia bila kuongezwa mafundisho ya kidhehebu.
