    rationale: Herufi laini iliyofichika inaweza kusababisha hitilafu za uchapishaji au utafutaji; iandikwe “mikononi.”
  revised_text: Lakini yule maskini hakuwa na kitu chochote isipokuwa mwana-kondoo mmoja mdogo wa kike, ambaye maskini huyo alikuwa amemnunua. Akamhifadhi hai, naye akakua pamoja naye na wanawe. Alikuwa akila tonge la chakula chake, akinywa katika kikombe chake, na kulala kifuani mwake; akawa kwake kama binti.
