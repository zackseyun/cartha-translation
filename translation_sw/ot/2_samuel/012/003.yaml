  source_fidelity: 'Tafsiri inafuata vizuri maana ya Kiebrania: umaskini wa mtu, mwana-kondoo mmoja mdogo wa kike, malezi yake, na taswira ya mwana-kondoo kama binti. Hata hivyo, “aliyekuwa amenunua” humfanya mwana-kondoo aonekane ndiye aliyenunua; kiambajengo hicho kinahitaji kufafanua kwamba maskini ndiye aliyemnununua. Pia, “tonge la chakula chake” ni wazi zaidi kwa מִפִּתּוֹ kuliko “katika tonge lake.”'
