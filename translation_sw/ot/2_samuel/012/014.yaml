  yaml_path: translation/ot/2_samuel/012/014.yaml
  text: Nevertheless[a], because by this matter you have utterly scorned the enemies of Yahweh, the son born to you will surely die.
translation:
  language: sw
  text: Hata hivyo, kwa sababu kwa jambo hili umewadharau kabisa maadui wa Yahweh[a], mwana aliyezaliwa kwako hakika atakufa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tafsiri nyingi hutafsiri kishazi hiki, “umewapa maadui wa Yahweh nafasi ya kudharau” au “ya kumkufuru Yahweh,” kwa kufuata usomaji wa kufasiri au uliorekebisha maandishi magumu ya Kiebrania.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶפֶס
  choice: Hata hivyo
  rationale: Hutoa pingamizi lenye nguvu baada ya tangazo la msamaha katika mstari uliotangulia; ni Kiswahili cha kawaida na chenye hadhi.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hutambulisha sababu ya matokeo yanayotangazwa.
- source_word: נִאֵץ נִאַצְתָּ
  choice: umewadharau kabisa
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi kamili unatilia nguvu dharau; “kabisa” huhifadhi mkazo huo.
- source_word: אֶת אֹיְבֵי יְהוָה
  choice: adui za Yahweh
  rationale: Hufuata moja kwa moja sintaksia ya maandishi ya Kimasoreti, ambapo kirai hiki ni shamirisho la tendo la Daudi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadili kuwa cheo.
- source_word: בַּדָּבָר הַזֶּה
  choice: kwa jambo hili
  rationale: דבר hapa hurejelea jambo au tukio zima linalozungumziwa; tafsiri hii ni pana na ya kawaida.
- source_word: גַּם
  choice: mwana
  rationale: Nguvu yake ya nyongeza au msisitizo inaeleweka katika muundo wa sentensi; kuitafsiri kwa “pia” kungefanya Kiswahili kisikike kizito.
- source_word: הַבֵּן הַיִּלּוֹד לְךָ
  choice: mwana aliyezaliwa kwako
  rationale: Huhifadhi maana mahususi ya בן, “mwana,” na hali ya kushirikishwa ya “aliyezaliwa kwako.”
- source_word: מוֹת יָמוּת
  choice: hakika atakufa
  rationale: Huhifadhi uhakika wenye msisitizo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi.
theological_decisions:
- issue: Kiima na shamirisho katika kishazi kinachowataja “adui za Yahweh”
  choice: 'Usomaji unaofuata MT: tendo la Daudi limewadharau kabisa “adui za Yahweh.”'
  alternative: 'Usomaji wa kufasiri au kurekebisha maandishi: Daudi amewapa “adui za Yahweh” nafasi ya kudharau au kukufuru.'
  rationale: Maandishi ya Kimasoreti yaliyotolewa yanasomeka moja kwa moja kwamba Daudi amewadharau adui za Yahweh. Ingawa maana hiyo ni ngumu katika muktadha, haipaswi kusahihishwa kimya kimya; usomaji ulioenea umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo unabaki karibu na Kiebrania huku ukitumia mpangilio wa kawaida wa Kiswahili; tanbihi huhifadhi usomaji mbadala unaojulikana.
