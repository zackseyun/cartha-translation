base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/015.yaml
  text: Then Nathan went to his house[a], and Yahweh struck the child whom Uriah’s wife had borne to David[c][b], and it became sick.
translation:
  language: sw
  text: Kisha Nathani akaenda nyumbani kwake. Yahwe akampiga mtoto ambaye mke wa Uria alikuwa amemzalia Daudi, naye akawa mgonjwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Kisha ... akaenda
  rationale: Waw ya usimulizi inaendeleza mfuatano wa matukio; “Kisha” ni ya kawaida katika masimulizi ya Kiswahili.
- source_word: בֵּיתוֹ
  choice: nyumbani kwake
  rationale: Ingawa maana halisi ni “nyumba yake,” “nyumbani kwake” hutoa kwa kawaida wazo la kwenda kwake bila kubadili maana.
- source_word: וַיִּגֹּף
  choice: akampiga
  rationale: Kitenzi נָגַף humaanisha kupiga kwa athari yenye madhara. “Akampiga” huhifadhi uwakala wa moja kwa moja wa Yahwe bila kubainisha ugonjwa maalumu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: הַיֶּלֶד
  choice: mtoto
  rationale: “Mtoto” linafaa kwa mtoto mdogo anayerejelewa katika muktadha.
- source_word: אֲשֶׁר יָלְדָה אֵשֶׁת אוּרִיָּה לְדָוִד
  choice: ambaye mke wa Uria alikuwa amemzalia Daudi
  rationale: Huhifadhi kishazi tegemezi cha Kiebrania na namna makusudi ya kumtaja mwanamke kuwa “mke wa Uria,” bila kuingiza jina Bathsheba.
- source_word: וַיֵּאָנַשׁ
  choice: naye akawa mgonjwa
  rationale: Kitenzi humrejelea mtoto wa kiume na kueleza kuingia katika hali ya ugonjwa; tafsiri haiongezi kiwango kama “sana” wala wazo la kutopona.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Huhifadhi jina binafsi lililo katika matini ya Kiebrania badala ya kulibadilisha kuwa cheo.
- issue: Uwakala katika kumpata mtoto kwa madhara
  choice: Yahwe akampiga mtoto
  alternative: Yahwe akamtesa mtoto
  rationale: Matini inamhusisha Yahwe moja kwa moja na tendo hilo. “Akampiga” huhifadhi nguvu na utata wa kitenzi bila kulainisha uwakala au kufafanua aina ya madhara kupita matini.
- issue: Namna mwanamke anavyotajwa
  choice: mke wa Uria
  alternative: Bathsheba
  rationale: Matini humwita “mke wa Uria”; kuhifadhi usemi huo hudumisha msisitizo wa kimaadili wa simulizi bila kuufumbua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa masimulizi ya kawaida; “nyumbani kwake” na “alikuwa amemzalia” ni wa asili kwa wasomaji wa kawaida. Alama ya tanbihi [a] ipo katika matini kuu na inaeleza tu uwezekano wa nguvu ya וַיֵּאָנַשׁ.
