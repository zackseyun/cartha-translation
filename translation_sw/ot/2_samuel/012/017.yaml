  text: The elders of his house stood beside him to raise him up from the ground[a], but he was unwilling[b], and he would not eat bread with them.
translation:
  language: sw
  text: Wazee wa nyumba yake[a] wakasimama juu yake[b] ili wamwinue kutoka ardhini, lakini hakukubali, wala hakula chakula pamoja nao[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wazee wa watu wa nyumbani mwake.” Kiebrania kinasema moja kwa moja “wazee wa nyumba yake.”
    reason: lexical_alternative
  - marker: b
    text: Au “karibu naye.” Kiebrania kinasema moja kwa moja “juu yake”; katika muktadha huu Daudi alikuwa amelala chini.
    reason: lexical_ambiguity
  - marker: c
    text: Kiebrania kinasema moja kwa moja “hakula mkate pamoja nao,” yaani hakula chakula.
    reason: idiom
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: wakasimama
  rationale: Kitenzi קום hapa kinaonyesha wazee wakichukua hatua wakiwa karibu na Daudi; “wakasimama” huhifadhi tendo halisi na kinaendana na kishazi kinachofuata.
- source_word: זִקְנֵי בֵיתוֹ
  choice: wazee wa nyumba yake
  rationale: Huhifadhi kwa ukaribu muundo wa Kiebrania, huku “nyumba” ikiweza kumaanisha watu wa nyumbani au jamaa ya kifalme.
- source_word: עָלָיו
  choice: karibu naye
  rationale: Ingawa עַל kwa kawaida humaanisha “juu ya,” katika tukio hili wazee wako karibu na Daudi wakijaribu kumwinua. Tafsiri hii ni ya kawaida katika Kiswahili bila kuficha maana halisi, ambayo imeelezwa katika tanbihi.
- source_word: לַהֲקִימוֹ
  choice: ili wamwinue
  rationale: Hiphil ya קום ina maana ya kumsababisha mtu ainuke; “wamwinue” ni fupi, ya kawaida, na huhifadhi maana hiyo ya kisababishi.
- source_word: מִן הָאָרֶץ
  choice: kutoka chini
  rationale: Katika muktadha wa Daudi kujilaza kwa huzuni na kufunga, אֶרֶץ humaanisha sehemu ya chini au ardhi aliyolalia.
- source_word: וְלֹא אָבָה
  choice: lakini hakukubali
  rationale: אָבָה hueleza kutaka au kukubali. “Hakukubali” huhifadhi wazo la kutokuwa tayari bila kutumia neno kali zaidi la kukataa kabisa.
- source_word: וְלֹא בָרָא אִתָּם לָחֶם
  choice: wala hakula chakula pamoja nao
  rationale: Usemi huo unamaanisha kula au kupata chakula. “Chakula” huwasilisha maana ya kimuktadha kwa Kiswahili cha kawaida, huku maana halisi ya “mkate” ikihifadhiwa katika tanbihi.
