base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/023.yaml
  text: But now he is dead. Why should I fast any longer? Can I bring him back again? I am going to him[a], but he will not return to me.
translation:
  language: sw
  text: Lakini sasa amekufa. Kwa nini niendelee kufunga? Je, ninaweza kumrudisha tena? Mimi nitakwenda kwake[a], lakini yeye hatarudi kwangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mimi ninaenda kwake.” Umbo la kitenzi cha Kiebrania linaweza kueleza jambo la baadaye lililo hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Lakini sasa
  rationale: Kiunganishi hiki kinaonyesha tofauti kati ya hali ya awali, mtoto alipokuwa hai, na hali ya sasa baada ya kifo chake.
- source_word: מֵת
  choice: amekufa
  rationale: Huwasilisha kwa Kiswahili cha kawaida hali iliyotokana na kifo cha mtoto; pia 'amekufa' ni ya asili zaidi hapa kuliko tafsiri kavu ya 'ni mfu'.
- source_word: לָמָּה זֶּה אֲנִי צָם
  choice: Kwa nini niendelee kufunga?
  rationale: Swali ni la balagha na linahusu kuendelea kwa tendo la kufunga baada ya mtoto kufa. 'Niendelee' pia huwasilisha maana ya עוֹד katika muktadha huu.
- source_word: הַאוּכַל לַהֲשִׁיבוֹ עוֹד
  choice: Je, ninaweza kumrudisha tena?
  rationale: Hiphil ya שוב ina maana ya kumsababisha arudi. Katika muktadha huu 'kumrudisha' hudokeza kurudishwa kwenye uhai bila kuongeza maelezo yasiyosemwa na maandiko.
- source_word: אֲנִי הֹלֵךְ אֵלָיו
  choice: Mimi ninaenda kwake
  rationale: Huhifadhi umbo la participle na pia uwezekano wake wa kueleza jambo la baadaye lililo hakika. Kiwakilishi 'Mimi' kinaendeleza mkazo wa אֲנִי.
- source_word: וְהוּא לֹא יָשׁוּב אֵלַי
  choice: lakini yeye hatarudi kwangu
  rationale: 'Wakati ujao unafaa katika muktadha, na ''lakini'' huonyesha tofauti ya wazi: Daudi atamwendea mtoto, lakini mtoto hatamrudia Daudi.'
theological_decisions:
- issue: Iwapo maneno ya Daudi yanafundisha kukutana kwa ufahamu na mtoto aliyekufa katika maisha baada ya kifo
  choice: Kutafsiri kwa uwazi kuwa Daudi anaenda kwa mtoto bila kufafanua asili ya kwenda huko.
  alternative: Kueleza kuwa Daudi atakufa na kwenda katika makao ya wafu, au kwamba hakika atakutana tena binafsi na mtoto katika maisha baada ya kifo.
  rationale: Kiebrania kinasema tu kwamba Daudi atamwendea mtoto, naye mtoto hatamrudia. Tafsiri haipaswi kuamua jambo ambalo mstari wenyewe haulifafanui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Maswali yamewekwa kwa mtiririko wa kawaida wa Kiswahili, huku marudio ya mzizi שוב yakihifadhiwa kwa 'kumrudisha' na 'hatarudi'.
