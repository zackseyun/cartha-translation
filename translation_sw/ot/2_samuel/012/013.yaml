base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/013.yaml
  text: Then David said to Nathan[a], “I have sinned against Yahweh.” And Nathan said to David, “Yahweh also has taken away your sin[b]; you shall not die.”
translation:
  language: sw
  text: Ndipo Daudi akamwambia Nathani, “Nimemkosea Yahwe.” Nathani akamwambia Daudi, “Yahwe pia ameiondoa dhambi yako[a]; hutakufa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe ameiondolea mbali dhambi yako.” Kwa maana halisi kitenzi cha Kiebrania ni “amesababisha ipite”; hapa kinamaanisha kuondoa dhambi au hatia.
    reason: lexical_alternative
  - marker: b
    text: Au, “hutakufa.” Kiebrania husema tu kwamba hutakufa; haisemi wazi kwamba hutauawa, ingawa muktadha wa sheria unaweza kudokeza kuponyoka adhabu ya kifo.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי לַיהוָה
  choice: Nimemtendea Yahwe dhambi
  rationale: Kauli hii ni ungamo la moja kwa moja. Muundo wa Kiswahili ‘kumtendea mtu dhambi’ unaonyesha wazi kuwa dhambi hiyo ilielekezwa dhidi ya Yahwe, huku wakati timilifu ‘nime-’ ukibeba tendo lililotendeka lenye uzito wa sasa.
- source_word: גַּם
  choice: naye
  rationale: Katika jibu la Nathani, ‘naye’ ni kiunganishi cha kawaida cha Kiswahili kinachohifadhi nguvu ya גַּם bila kuongeza ufafanuzi usiomo katika maandishi.
- source_word: הֶעֱבִיר
  choice: ameiondoa
  rationale: Hifili ya עבר ina maana ya msingi ya kusababisha kitu kipite; inapohusishwa na dhambi hapa inaonyesha kuondolewa kwake. ‘Ameiondoa’ ni ya asili na wazi, bila kueleza kwa namna gani upatanisho ulifanyika.
- source_word: חַטָּאתְךָ
  choice: dhambi yako
  rationale: Katika muktadha huu neno linarejelea kosa ambalo Daudi amelikiri. ‘Dhambi yako’ ni tafsiri ya moja kwa moja kuliko ‘hatia yako’ au ‘sadaka yako ya dhambi.’
- source_word: לֹא תָמוּת
  choice: hutakufa
  rationale: Kiebrania kinasema kwa ufupi kwamba Daudi hatakufa. ‘Hutakufa’ huhifadhi kauli hiyo ya uhakika bila kuingiza wazo la ‘kuuawa’ ambalo muktadha unaweza kudokeza lakini halijasemwa wazi.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Ndipo ... akamwambia ... akamwambia
  rationale: ‘Ndipo’ na vitenzi vya mfululizo vya ‘aka-’ vinaendeleza mtiririko wa simulizi kwa Kiswahili cha kawaida bila kurudia kiunganishi kwa namna ngumu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya הֶעֱבִיר חַטָּאתְךָ katika msamaha
  choice: Yahwe naye ameiondoa dhambi yako
  alternative: Yahwe amepitisha dhambi yako; Yahwe ameondoa hatia yako
  rationale: Tafsiri inasema wazi kwamba Yahwe ameiondoa dhambi ya Daudi na kwamba Daudi hatakufa, lakini haiongezi maelezo kuhusu utaratibu wa upatanisho. Hivyo inadumisha mvutano wa kiteolojia uliomo katika kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Nimemtendea Yahwe dhambi’ ni ya asili zaidi kuliko tafsiri ya neno kwa neno ‘nimefanya dhambi kwa Yahwe.’ Hakuna tanbihi iliyoongezwa kwa sababu tafsiri kuu inaweza kuhifadhi maana ya Kiebrania bila mbadala muhimu unaohitaji kuonyeshwa.
