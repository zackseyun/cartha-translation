  text: וַ/יְהִ֛י בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י וַ/יָּ֣מָת הַ/יָּ֑לֶד וַ/יִּֽרְאוּ֩ עַבְדֵ֨י דָוִ֜ד לְ/הַגִּ֥יד ל֣/וֹ כִּי מֵ֣ת הַ/יֶּ֗לֶד כִּ֤י אָֽמְרוּ֙ הִנֵּה֩ בִ/הְי֨וֹת הַ/יֶּ֜לֶד חַ֗י דִּבַּ֤רְנוּ אֵלָי/ו֙ וְ/לֹא שָׁמַ֣ע בְּ/קוֹלֵ֔/נוּ וְ/אֵ֨יךְ נֹאמַ֥ר אֵלָ֛י/ו מֵ֥ת הַ/יֶּ֖לֶד וְ/עָשָׂ֥ה רָעָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/018.yaml
  text: And on the seventh day the child died. And David’s servants were afraid to tell him that the child was dead[a], for they said, “Behold, while the child was still alive, we spoke to him, and he did not listen to our voice. How then can we say to him, ‘The child is dead’? He may do harm.”
translation:
  language: sw
  text: Siku ya saba mtoto akafa. Watumishi wa Daudi wakaogopa kumwambia kwamba mtoto amekufa, kwa maana walisema, “Tazama, mtoto alipokuwa angali hai, tulizungumza naye, lakini hakutusikiliza. Basi tunawezaje kumwambia, ‘Mtoto amekufa’? Huenda akafanya jambo baya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huenda akatenda uovu,” “Huenda akaitikia vibaya,” au labda, “Huenda akajidhuru.” Kirai cha Kiebrania ni kifupi na hakitaji wazi tendo walilohofia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: Siku ya saba
  rationale: Kirai hiki kinaendeleza mfululizo wa simulizi na kuweka wakati wa tukio. Kiswahili cha kawaida hakihitaji kutafsiri וַיְהִי kwa maneno ya ziada kama ‘ikawa kwamba’.
- source_word: וַיָּמָת הַיָּלֶד
  choice: mtoto akafa
  rationale: יֶלֶד hapa ni mtoto mchanga katika muktadha huu; muundo wa ‘aka-’ unaendeleza simulizi kwa kawaida katika Kiswahili.
- source_word: וַיִּרְאוּ עַבְדֵי דָוִד
  choice: Watumishi wa Daudi wakaogopa
  rationale: ירא hapa inaonyesha hofu au wasiwasi, si heshima ya kidini. ‘Wakaogopa’ ni ya kawaida na inaendeleza mfuatano wa matukio.
- source_word: לְהַגִּיד לוֹ כִּי מֵת הַיֶּלֶד
  choice: kumwambia kwamba mtoto amekufa
  rationale: הגיד ni kumwambia au kumpasha habari. ‘Amekufa’ huonyesha tukio lililotokea na hali iliyotokana nalo kwa Kiswahili cha kawaida.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwenye hoja inayofuata. ‘Tazama’ hudumisha uzito wa simulizi bila kuwa la kizamani kupita kiasi.
- source_word: בִּהְיוֹת הַיֶּלֶד חַי
  choice: mtoto alipokuwa angali hai
  rationale: Muundo huu unaonyesha wakati unaoambatana na hali. ‘Angali hai’ huleta wazi tofauti na habari ya kifo inayofuata.
- source_word: דִּבַּרְנוּ אֵלָיו
  choice: tulizungumza naye
  rationale: דבר אל maana yake ni kusema au kuzungumza na mtu. ‘Tulizungumza naye’ ni ya asili katika Kiswahili na haiongezi maudhui yasiyokuwapo.
- source_word: וְלֹא שָׁמַע בְּקוֹלֵנוּ
  choice: lakini hakutusikiliza
  rationale: Nahau ya Kiebrania ni ‘hakusikiliza sauti yetu,’ lakini katika Kiswahili ‘hakutusikiliza’ hutoa maana ileile kwa ufasaha na huonyesha kutokubali ushauri wao.
- source_word: וְאֵיךְ נֹאמַר אֵלָיו
  choice: Basi tunawezaje kumwambia
  rationale: אֵיךְ huanzisha swali la hofu linalotokana na yaliyotangulia. ‘Basi’ huonyesha uhusiano huo wa kimantiki.
- source_word: וְעָשָׂה רָעָה
  choice: Huenda akafanya jambo baya
  rationale: Kirai cha Kiebrania ni kifupi na hakitaji tendo, mlengwa, wala aina ya madhara. Tafsiri hii inadumisha hali hiyo ya kutotajwa wazi bila kuamua kwamba Daudi angejidhuru au angemdhuru mtu mwingine.
theological_decisions:
- issue: Maana ya וְעָשָׂה רָעָה
  choice: Tendo baya au lenye madhara lisilotajwa wazi
  alternative: Daudi huenda akajidhuru; huenda akamdhuru mwingine; au huenda akaitikia vibaya
  rationale: Kiebrania hakitaji mlengwa wala namna ya tendo linalohofiwa. Tafsiri haipaswi kuingiza uchunguzi wa kisaikolojia au hukumu mahususi ya kimaadili ambayo maandishi yenyewe hayatoi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Miundo ya ‘aka-’ imetumiwa kuendeleza mfululizo wa matukio; nahau isiyo ya asili ‘kusikiliza sauti yetu’ imewasilishwa kwa ‘hakutusikiliza.’
