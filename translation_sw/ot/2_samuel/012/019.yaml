base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/019.yaml
  text: When David saw that his servants were whispering[a], David understood that the child was dead. So David said to his servants, “Is the child dead?” And they said, “He is dead.”
translation:
  language: sw
  text: Daudi alipoona kwamba watumishi wake walikuwa wakinong’onezana, alitambua kwamba mtoto alikuwa amekufa. Basi Daudi akawaambia watumishi wake, “Je, mtoto amekufa?” Wakasema, “Amekufa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: alipoona
  rationale: Kitenzi ראה hapa kinaeleza kuona kunakomwongoza Daudi kutambua hali; “alipoona” ni cha moja kwa moja na cha kawaida katika simulizi.
- source_word: מִתְלַחֲשִׁים
  choice: walikuwa wakinong’onezana
  rationale: Kauli ya kujirejelea ya לחש inaonyesha kusema kwa sauti ya chini wao kwa wao; “wakinong’onezana” huhifadhi hali hiyo ya mawasiliano ya siri kati ya watumishi.
- source_word: וַיָּבֶן
  choice: alitambua
  rationale: בין hapa ni kufikia ufahamu kutokana na alama alizoziona; “alitambua” ni ya asili katika Kiswahili na hudumisha maana ya utambuzi.
- source_word: מֵת
  choice: alikuwa amekufa / amekufa
  rationale: Neno hili linaonyesha kuwa mtoto yuko katika hali ya kifo. Kiswahili hutumia “alikuwa amekufa” katika taarifa inayotegemea wakati uliopita, na “amekufa” katika swali na jibu la moja kwa moja.
- source_word: הַיָּלֶד
  choice: mtoto
  rationale: יֶלֶד inaweza kuwa mtoto au mvulana; katika muktadha wa mwana mchanga wa Daudi, “mtoto” ndilo neno sahihi zaidi.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: עֶבֶד inaweza kumaanisha mtumishi au mtumwa kulingana na muktadha. Hapa hawa ni wahudumu wa nyumba ya kifalme, hivyo “watumishi wake” ni sahihi bila kulazimisha hadhi ya utumwa.
- source_word: הֲמֵת הַיֶּלֶד
  choice: Je, mtoto amekufa?
  rationale: Muundo wa Kiebrania unauliza kama mtoto ni mfu. “Je, mtoto amekufa?” ni swali la kawaida la Kiswahili linalowasilisha hali hiyo bila kupotosha maana.
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: akawaambia ... wakasema
  rationale: אמר ni “kusema.” Katika sehemu ya kwanza, kiambishi cha mtendewa katika Kiswahili hufanya “akawaambia” kuwa cha asili kwa “alisema kwa watumishi wake”; “wakasema” huhifadhi kitenzi cha kawaida katika jibu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na wenye staha. Jibu fupi “Amekufa” limehifadhi ufupi wa Kiebrania מֵת bila kuongeza kiwakilishi kisichohitajika; kwa hiyo hakuna tanbihi inayohitajika.
