  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף דָּוִ֛ד בָּ/אִ֖ישׁ מְאֹ֑ד וַ/יֹּ֨אמֶר֙ אֶל נָתָ֔ן חַי יְהוָ֕ה כִּ֣י בֶן מָ֔וֶת הָ/אִ֖ישׁ הָ/עֹשֶׂ֥ה זֹֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/005.yaml
  text: Then David burned with anger against the man greatly[a], and he said to Nathan, “As Yahweh lives, the man who has done this is a son of death!”
translation:
  language: sw
  text: Ndipo hasira ya Daudi ikawaka sana dhidi ya mtu huyo, akamwambia Nathani, “Kama Yahweh aishivyo, mtu aliyefanya jambo hili anastahili kufa![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “ni mwana wa mauti,” yaani, mtu anayestahili kufa au anayepaswa kuuawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף דָּוִד ... מְאֹד
  choice: hasira ya Daudi ikawaka sana
  rationale: Inahifadhi taswira ya Kiebrania ya hasira ‘kuwaka’ na pia nguvu ya מְאֹד (‘sana’), huku ikiwa Kiswahili cha kawaida na chenye uzito.
- source_word: בָּאִישׁ
  choice: dhidi ya mtu huyo
  rationale: Kiambishi בְּ hapa kinaonyesha mlengwa wa hasira; ‘dhidi ya’ ni wazi, na ‘huyo’ humrejelea mtu tajiri wa mfano wa Nathani.
- source_word: חַי יְהוָה
  choice: Kama Yahweh aishivyo
  rationale: Hii ni kauli ya kiapo. Tafsiri hii inadumisha muundo na uzito wake, huku jina la Mungu יְהוָה likitolewa kama ‘Yahweh’.
- source_word: בֶן מָוֶת
  choice: anastahili kufa
  rationale: Nahau hiyo humaanisha mtu anayepaswa au anayestahili kifo. Tafsiri ya maana ni wazi kwa wasomaji wa Kiswahili; muundo halisi umehifadhiwa katika tanbihi.
- source_word: הָעֹשֶׂה זֹאת
  choice: aliyefanya jambo hili
  rationale: Kirai cha kishiriki kinamtambulisha mkosaji kwa tendo lake; kishazi hiki cha Kiswahili huwasilisha maana hiyo kwa uwazi.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la agano moja kwa moja. ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Iwapo בֶן מָוֶת itafsiriwe kwa muundo halisi au kwa maana ya nahau
  choice: anastahili kufa
  alternative: ni mwana wa mauti
  rationale: ‘Mwana wa mauti’ si nahau ya kawaida ya Kiswahili na inaweza kueleweka vibaya. Maana ya kuwajibika kwa adhabu ya kifo imetolewa katika matini, na muundo wa Kiebrania umeonyeshwa katika tanbihi bila kupunguza nguvu ya tamko la Daudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira ya hasira kuwaka imehifadhiwa; nahau isiyo ya kawaida katika Kiswahili imetafsiriwa kwa maana yake na kufafanuliwa katika tanbihi.
