  yaml_path: translation/ot/2_samuel/012/016.yaml
  text: And David sought God on behalf of the boy[b][a]. David fasted a fast, and he went in and spent the night and lay on the ground.
translation:
  language: sw
  text: Daudi akamwomba Mungu kwa ajili ya mtoto huyo.[a] Daudi akafunga,[b] akaingia, akapitisha usiku akiwa amelala chini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania hapa linaweza pia kutafsiriwa “mvulana”; katika muktadha huu linamtaja mwana mchanga wa Daudi aliyekuwa mgonjwa (aya ya 15 na 18).
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi “akafunga mfungo,” kikitumia maneno ya mzizi mmoja ili kusisitiza tendo la kufunga.
    reason: source_form
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: akamtafuta
  rationale: Kitenzi בקש kina maana ya kutafuta kwa bidii na katika muktadha huu kinadokeza kumwendea Mungu kwa ombi. “Akamtafuta” kinahifadhi usemi wa Kiebrania bila kuufanya wazi zaidi kuwa “akamsihi,” jambo ambalo lingekuwa tafsiri yenye ufafanuzi zaidi.
- source_word: אֶת־הָאֱלֹהִים
  choice: Mungu
  rationale: Huyu ndiye anayelengwa moja kwa moja na tendo la Daudi; “Mungu” ndiyo tafsiri ya kawaida na ya asili.
- source_word: בְּעַד
  choice: kwa ajili ya
  rationale: Katika muktadha huu בעד huonyesha kwamba Daudi anamtafuta Mungu kwa manufaa ya mtoto; “kwa ajili ya” ni usemi wa kawaida wa Kiswahili unaobeba maana hiyo bila kulazimisha tafsiri ya moja kwa moja ya maombezi.
- source_word: הַנַּעַר
  choice: mtoto huyo
  rationale: נער inaweza kumaanisha mtoto, mvulana, kijana, au mtumishi kulingana na muktadha. Hapa inamtaja mwana mchanga wa Daudi aliyekuwa mgonjwa; “mtoto huyo” ni ya asili na inaunganisha wazi na muktadha uliotangulia.
- source_word: וַיָּצָם ... צוֹם
  choice: Akafunga
  rationale: Kiebrania kinatumia kitenzi na nomino ya mzizi mmoja, kihalisi “akafunga mfungo,” ili kusisitiza tendo. Kurudia huko si kwa asili katika Kiswahili; “akafunga” linatoa maana kwa uwazi, huku tanbihi ikihifadhi taarifa ya msisitizo wa muundo wa asili.
- source_word: וּבָא
  choice: akaingia ndani
  rationale: בוא hapa inaonyesha kuingia mahali. “Akaingia ndani” inafaa mtiririko wa simulizi na haiainishi ni chumba gani, kwa kuwa Kiebrania hakikitaji.
- source_word: וְלָן
  choice: akapitisha usiku
  rationale: לון humaanisha kukaa au kulala mahali wakati wa usiku. “Akapitisha usiku” ni usemi wa Kiswahili unaohifadhi maana hiyo bila kudokeza kwamba Daudi alikesha akiwa macho.
- source_word: וְשָׁכַב אָרְצָה
  choice: akiwa amelala chini
  rationale: שכב ni kulala au kujilaza, na ארצה ni kuelekea ardhini/chini. “Akiwa amelala chini” ni ya asili na inaonyesha jinsi alivyoupitisha usiku bila kubadili “chini” kuwa “sakafuni,” jambo ambalo maandishi hayabainishi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye hadhi. “Akamtafuta Mungu” limehifadhiwa ili kutatua kimya kimya hisia ya kitenzi cha asili kuwa “akamwomba” au “akamsihi,” ingawa muktadha unaonyesha ombi la dhati. Muundo usio wa kawaida “akafunga mfungo” umehamishiwa tanbihini ili sentensi kuu ibaki ya asili kwa wasomaji wa sasa.
