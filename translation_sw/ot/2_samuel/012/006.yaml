translation:
  language: sw
  text: Naye atalipa mara nne thamani ya mwana-kondoo huyo wa kike, kwa sababu alifanya jambo hili na kwa sababu hakuwa na huruma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kiebrania kinaweza pia kumaanisha “hakumwachilia” au “hakumsamehe,” yaani hakujizuia kumdhuru kwa sababu ya huruma.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכִּבְשָׂה
  choice: mwana-kondoo huyo
  rationale: Neno la Kiebrania linamtaja mwana-kondoo wa kike. Katika Kiswahili cha kawaida, “mwana-kondoo” ni la asili zaidi kuliko maelezo mazito kama “mwana-kondoo wa kike”; jinsia yake tayari imewekwa wazi katika muktadha wa simulizi.
- source_word: יְשַׁלֵּם
  choice: atalipa fidia
  rationale: Piel ya שׁלם hapa ina maana ya kulipa au kurejesha kilichochukuliwa. “Atalipa fidia” linaonyesha wazi hukumu ya kurejesha hasara bila kulifanya tendo hilo kuwa ahadi ya hiari.
- source_word: אַרְבַּעְתָּיִם
  choice: mara nne
  rationale: Hii ni nahau ya idadi inayomaanisha malipo yenye kipimo cha nne; “mara nne” ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: עֵקֶב אֲשֶׁר
  choice: kwa sababu
  rationale: Kirai hiki kinatanguliza sababu ya hukumu, na “kwa sababu” ni kilinganishi cha moja kwa moja na cha kawaida.
- source_word: עָשָׂה אֶת־הַדָּבָר הַזֶּה
  choice: alifanya jambo hili
  rationale: Tafsiri hii inadumisha usemi mpana wa Kiebrania bila kuufafanua zaidi kuwa kosa au uhalifu.
- source_word: לֹא חָמָל
  choice: hakuwa na huruma
  rationale: חמל linaweza kueleza kumhurumia au kutomdhuru mtu au kitu kwa sababu ya huruma. Usemi huu ni wa asili katika Kiswahili na hauongezi kiwakilishi ambacho hakipo wazi katika Kiebrania.
