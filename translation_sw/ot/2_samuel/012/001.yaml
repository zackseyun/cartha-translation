  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אֶת נָתָ֖ן אֶל דָּוִ֑ד וַ/יָּבֹ֣א אֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ שְׁנֵ֣י אֲנָשִׁ֗ים הָיוּ֙ בְּ/עִ֣יר אֶחָ֔ת אֶחָ֥ד עָשִׁ֖יר וְ/אֶחָ֥ד רָֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/001.yaml
  text: Then Yahweh sent Nathan to David. He came to him and said to him[a], “There were two men in one city, one rich and one poor.”
translation:
  language: sw
  text: 'Kisha Yahweh akamtuma Nathani kwa Daudi. Nathani akamwendea, akamwambia, “Kulikuwa na wanaume wawili katika mji mmoja: mmoja alikuwa tajiri, na mwingine alikuwa maskini.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akamtuma
  rationale: Kitenzi שׁלח katika mtiririko wa simulizi kinamaanisha ‘kutuma’; kiambishi cha yambwa ‘-m-’ kinamrejelea Nathani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kuwa ‘Yahweh’ badala ya kubadilishwa na cheo.
- source_word: אֶת נָתָן
  choice: Nathani
  rationale: Jina נתן limetoholewa kwa umbo lililozoeleka katika Kiswahili cha Biblia; alama ya yambwa אֶת haitafsiriwi kivyake.
- source_word: אֶל דָּוִד
  choice: kwa Daudi
  rationale: אֶל hapa inaonyesha alikoelekezwa Nathani; ‘kwa Daudi’ ni usemi wa kawaida wa Kiswahili bila kuingiza maana ya ‘dhidi ya’.
- source_word: וַיָּבֹא אֵלָיו
  choice: Nathani akamwendea
  rationale: בוא אֶל inaweza kuwa ‘kuja kwa’ au ‘kwenda kwa’; ‘akamwendea’ ni ya asili katika mtazamo wa msimulizi na huweka wazi kwamba kiwakilishi kinamrejelea Nathani.
- source_word: וַיֹּאמֶר לוֹ
  choice: akamwambia
  rationale: Muundo huu unajumuisha tendo la kusema na yule aliyeambiwa kwa Kiswahili cha kawaida.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: watu wawili
  rationale: אֲנָשִׁים hapa ni wanaume wawili katika mfano; ‘watu wawili’ ni usemi wa kawaida wa Kiswahili, na jinsia si lazima irudiwe kwa nomino maalumu katika muktadha huu.
- source_word: הָיוּ
  choice: Kulikuwa na
  rationale: Hii ni היה ya kuwepo; ‘kulikuwa na’ huhifadhi maana ya moja kwa moja kuliko kuongeza wazo la ‘waliishi’.
- source_word: בְּעִיר אֶחָת
  choice: katika mji mmoja
  rationale: Huhifadhi kwa karibu maana halisi ya ‘katika mji mmoja’ bila kuifanya kuwa ‘mji fulani’ au ‘mji uleule’.
- source_word: אֶחָד עָשִׁיר
  choice: mmoja alikuwa tajiri
  rationale: Kiswahili kinahitaji kiarifu kilicho wazi hapa ili sentensi iwe ya kawaida, ingawa Kiebrania kina kishazi kisicho na kitenzi.
- source_word: וְאֶחָד רָאשׁ
  choice: na mwingine alikuwa maskini
  rationale: רָאשׁ ni mtu maskini au aliye fukara; ‘maskini’ huonyesha wazi tofauti yake na tajiri. ‘Mwingine’ ni ya kawaida katika jozi ya watu wawili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia moja kwa moja Tetragramatoni יהוה; kulitaja ‘Yahweh’ huhifadhi jina binafsi la Mungu badala ya kulibadilisha na cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi vya simulizi umetolewa kwa ‘akamtuma … akamwendea … akamwambia.’ Hakuna tanbihi iliyohitajika, kwa kuwa maana halisi ya הָיוּ imehifadhiwa katika ‘Kulikuwa na.’
