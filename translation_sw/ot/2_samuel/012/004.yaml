base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/004.yaml
  text: A traveler came to the rich man[a], and he spared taking from his own flock and from his own herd to prepare for the traveler who had come to him. So he took the ewe lamb of the poor man and prepared it for the man who had come to him.
translation:
  language: sw
  text: Msafiri[a] akamjia yule tajiri, naye hakutaka kuchukua katika kondoo wake wala ng’ombe wake ili kumwandalia mgeni aliyemjia. Kisha akamchukua mwana-kondoo jike wa yule maskini, akamfanya kuwa chakula kwa ajili ya yule mtu aliyemjia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “mgeni.” Kiebrania kinatumia maneno mawili yanayohusiana lakini tofauti: la kwanza humtaja mtu aliye safarini, na la pili mtu anayepokelewa kama mgeni.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵלֶךְ
  choice: msafiri
  rationale: Neno hili humaanisha mtu aliye safarini. “Msafiri” ni la kawaida katika Kiswahili cha sasa na linatofautishwa kwa kiasi na אָרֵחַ.
- source_word: וַיַּחְמֹל
  choice: hakutaka
  rationale: Ingawa kitenzi hiki mara nyingi humaanisha kuhurumia au kuacha bila kudhuru, hapa kitu kinachohurumiwa hakitajwi; katika muktadha tajiri anakataa kutumia mifugo yake mwenyewe. “Hakutaka” huwasilisha maana hiyo ya kimuktadha bila kudai kwamba aliwahurumia wanyama.
- source_word: מִצֹּאנוֹ וּמִבְּקָרוֹ
  choice: kutoka katika kundi lake la kondoo wala la ng’ombe
  rationale: Maneno ya Kiebrania ni majina ya makundi ya mifugo yenye viambishi vya umilikaji. Kiswahili hiki kinaonyesha kuwa mifugo ilikuwa yake mwenyewe na “wala” linafaa baada ya kauli hasi.
- source_word: לַעֲשׂוֹת
  choice: kuandaa chakula
  rationale: Katika muktadha wa kumkaribisha mgeni, עשה humaanisha kuandaa mlo. Kutaja “chakula” huifanya sentensi iwe ya kawaida na wazi katika Kiswahili bila kubainisha namna ya kupika.
- source_word: לָאֹרֵחַ
  choice: kwa ajili ya mgeni
  rationale: אָרֵחַ linaweza kumaanisha mgeni anayepokelewa au msafiri. “Mgeni” linaonyesha wajibu wa ukarimu huku tanbihi ikihifadhi uhusiano na wazo la msafiri.
- source_word: כִּבְשַׂת
  choice: mwana-kondoo jike
  rationale: Kiebrania kinabainisha kwamba alikuwa kondoo mchanga wa kike; tafsiri hii inalinda maelezo hayo.
- source_word: הָאִישׁ הָרָאשׁ
  choice: yule maskini
  rationale: רָאשׁ humaanisha mtu maskini au mhitaji. “Yule maskini” ni ya kawaida na inaendeleza utofauti wake na tajiri.
- source_word: וַיַּעֲשֶׂהָ
  choice: kumwandalia chakula
  rationale: Kitenzi kinarudia עשה katika muktadha wa mlo. Tafsiri hii inadumisha uhusiano na “kuandaa chakula” ya awali bila kubainisha kupita kiasi namna mwana-kondoo alivyoandaliwa.
- source_word: הַבָּא לוֹ / הַבָּא אֵלָיו
  choice: aliyemjia
  rationale: Virai vyote vinamtaja mtu aliyefika kwa tajiri. “Aliyemjia” ni kifupi, cha kawaida, na kinaonyesha mwelekeo wa kuja kwake.
