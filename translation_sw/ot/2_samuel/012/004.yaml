translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa Maandiko. Muundo wa “akamjia” na “akamchukua” unaendeleza mfululizo wa matukio; “badala yake” huweka wazi utofauti uliomo katika tendo bila kuongeza msimamo wa kiteolojia.
