  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֗ה לֹא תָס֥וּר חֶ֛רֶב מִ/בֵּיתְ/ךָ֖ עַד עוֹלָ֑ם עֵ֚קֶב כִּ֣י בְזִתָ֔/נִי וַ/תִּקַּ֗ח אֶת אֵ֨שֶׁת֙ אוּרִיָּ֣ה הַ/חִתִּ֔י לִ/הְי֥וֹת לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/010.yaml
  text: Now therefore[a], the sword shall never depart from your house[b], because you have despised me and have taken the wife of Uriah the Hittite to be your wife.
translation:
  language: sw
  text: Basi sasa, upanga hautaondoka kamwe katika nyumba yako[a], kwa sababu umenidharau[b] na umemchukua mke wa Uria Mhiti kuwa mke wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa nyumba yako,” “familia yako,” au “nasaba yako”; neno la Kiebrania “nyumba” linaweza kujumuisha familia na ukoo wa kifalme.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “umenidharau”; kosa dhidi ya Uria na mke wake linaelezwa kuwa dharau kwa Mungu mwenyewe.
    reason: cross_reference
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huonyesha kwamba hukumu inayofuata ni tokeo la shtaka lililotangulia, huku ikihifadhi pia maana ya wakati ya ‘sasa’.
- source_word: לֹא תָסוּר ... עַד עוֹלָם
  choice: hautaondoka kamwe
  rationale: Kitenzi סור pamoja na ukanushi na עַד עוֹלָם kinaonyesha kwamba upanga hautaondolewa kwa wakati ujao unaoendelea; Kiswahili hiki ni cha kawaida na huhifadhi uzito wa hukumu.
- source_word: חֶרֶב
  choice: upanga
  rationale: Huhifadhi taswira halisi ya Kiebrania ya upanga kama ishara ya jeuri na hukumu.
- source_word: מִבֵּיתְךָ
  choice: katika nyumba yako
  rationale: ‘Nyumba’ huhifadhi sitiari pana ya Kiebrania inayoweza kumaanisha familia, watu wa nyumbani, au ukoo wa kifalme bila kuibana kwa tafsiri moja.
- source_word: עֵקֶב כִּי
  choice: kwa sababu
  rationale: Huwasilisha kwa uwazi uhusiano wa kisababishi kati ya kosa la Daudi na hukumu iliyotangazwa.
- source_word: בְזִתָנִי
  choice: umenidharau
  rationale: Kitenzi בזה kina maana ya kudharau au kutendea kwa dharau; kiambishi cha nafsi ya kwanza kinahifadhiwa moja kwa moja katika ‘-ni-’.
- source_word: וַתִּקַּח
  choice: na umemchukua
  rationale: Huwasilisha tendo lililokamilika na kuliunganisha kwa Kiswahili cha kawaida na shtaka lililotangulia.
- source_word: אֵשֶׁת אוּרִיָּה הַחִתִּי
  choice: mke wa Uria Mhiti
  rationale: Huhifadhi msisitizo wa maandishi kwamba mwanamke huyo alikuwa mke wa Uria, na ‘Mhiti’ ni namna ya kawaida ya kutaja utaifa huo kwa Kiswahili.
- source_word: לִהְיוֹת לְךָ לְאִשָּׁה
  choice: kuwa mke wako
  rationale: Ni Kiswahili cha kawaida kinachowakilisha usemi wa Kiebrania wa kumchukua mwanamke awe mke.
theological_decisions:
- issue: Anayerejelewa na kiambishi cha nafsi ya kwanza katika ‘umenidharau’
  choice: Kuhifadhi ‘-ni-’ kama rejeo la moja kwa moja kwa Mungu anayesema
  alternative: Kupanua kuwa ‘umedharau neno/amri ya BWANA’
  rationale: Kiebrania kinasema wazi ‘umenidharau.’ Tafsiri inahifadhi uzito wa kitheolojia kwamba kosa dhidi ya Uria na mke wake lilikuwa pia dharau kwa Mungu mwenyewe, bila kuongeza maneno yasiyomo.
- issue: Upeo wa maana ya ‘nyumba yako’
  choice: Kutafsiri kwa ‘nyumba yako’
  alternative: ‘watu wa nyumba yako,’ ‘familia yako,’ au ‘nasaba yako’
  rationale: Neno la Kiebrania linaweza kujumuisha familia, watu wa nyumbani, na ukoo wa kifalme. ‘Nyumba yako’ huhifadhi upana na utata huo.
- issue: Muda wa hukumu katika ‘עַד עוֹלָם’
  choice: ‘kamwe’ ndani ya kauli ‘hautaondoka kamwe’
  alternative: ‘milele’ au ‘kwa wakati wote’
  rationale: Katika kauli hii ya hukumu, maneno hayo yanaeleza hali ya kudumu kwa wakati ujao. ‘Kamwe’ ni ya kawaida katika Kiswahili huku ikiepuka kufafanua zaidi ya maandishi upeo kamili wa muda.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku taswira ya ‘upanga’ na upana wa ‘nyumba’ vik燭ihifadhiwa. Alama za tanbihi zimewekwa baada ya maneno yanayofafanuliwa.
