translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘alikuwa na’ umetumiwa kwa umilikaji wa kawaida; ‘wengi sana’ unadumisha msisitizo bila kuwa wa kizamani.
