  text: The rich man had very many sheep and cattle[a].
translation:
  language: sw
  text: Tajiri alikuwa na kondoo na ng’ombe wengi sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtu mmoja tajiri alikuwa na kondoo na ng’ombe wengi sana.”
    reason: Muundo לְעָשִׁיר unaweza kutafsiriwa kwa namna isiyo ya urejeleaji kuwa ‘mtu mmoja tajiri,’ ingawa muktadha na umbo lenye kibainishi vinaunga mkono ‘tajiri’ aliyekwisha tajwa.
lexical_decisions:
- source_word: לְעָשִׁיר
  choice: Tajiri alikuwa na
  rationale: Kiambishi לְ pamoja na הָיָה huunda usemi wa umilikaji, yaani kitu ‘kilikuwa kwa’ mtu. Katika Kiswahili cha kawaida, maana hiyo huwasilishwa kwa ‘alikuwa na.’ Nomino ‘tajiri’ inarejelea tajiri aliyetajwa katika muktadha uliotangulia.
- source_word: הָיָה
  choice: alikuwa na
  rationale: Ingawa kitenzi hiki kimsingi humaanisha ‘alikuwa,’ hapa pamoja na לְ kinaonyesha kuwa tajiri huyo alikuwa akimiliki mifugo.
- source_word: צֹאן
  choice: kondoo
  rationale: Neno hili ni jina la jumla la mifugo midogo, hasa kondoo na mbuzi. ‘Kondoo’ ni tafsiri ya kawaida na ya asili katika jozi hii ya aina za mifugo.
- source_word: וּבָקָר
  choice: na ng’ombe
  rationale: בָקָר humaanisha mifugo ya kundi la ng’ombe; ‘ng’ombe’ ni neno la kawaida na linaloeleweka vizuri katika Kiswahili.
- source_word: הַרְבֵּה מְאֹד
  choice: wengi sana
  rationale: Maneno haya yanasisitiza wingi mkubwa; ‘wengi sana’ yanahifadhi msisitizo huo kwa Kiswahili cha kawaida na cha moja kwa moja.
