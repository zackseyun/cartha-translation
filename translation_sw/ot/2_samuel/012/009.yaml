source:
  edition: WLC
  text: מַדּ֜וּעַ בָּזִ֣יתָ אֶת דְּבַ֣ר יְהוָ֗ה לַ/עֲשׂ֣וֹת הָ/רַע֮ ב/עינ/ו אֵ֣ת אוּרִיָּ֤ה הַֽ/חִתִּי֙ הִכִּ֣יתָ בַ/חֶ֔רֶב וְ/אֶ֨ת אִשְׁתּ֔/וֹ לָקַ֥חְתָּ לְּ/ךָ֖ לְ/אִשָּׁ֑ה וְ/אֹת֣/וֹ הָרַ֔גְתָּ בְּ/חֶ֖רֶב בְּנֵ֥י עַמּֽוֹן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/009.yaml
  text: Why have you despised the word of Yahweh[a], to do what is evil in his sight? You struck down Uriah the Hittite with the sword, and took his wife for yourself as a wife[c][b], and killed him with the sword of the Ammonites.
translation:
  language: sw
  text: Kwa nini umelidharau[a] neno la Yahwe kwa kufanya yaliyo maovu machoni pake? Uria, Mhiti, ulimpiga kwa upanga, ukamchukua mke wake kwa ajili yako awe mke wako[b], na ukamwua kwa upanga wa Waamoni[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umelitendea kwa dharau.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kwa msisitizo, “ukamchukua mke wake kwa ajili yako awe mke.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “kwa upanga wa wana wa Amoni”; yaani, Daudi alisababisha Uria auawe kupitia Waamoni.'
    reason: cultural_note
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Kwa nini
  rationale: Ni swali la moja kwa moja linaloanzisha shtaka la Nathani; ‘Kwa nini’ lina nguvu ya kawaida na ya wazi katika Kiswahili.
- source_word: בָּזִיתָ
  choice: umelidharau
  rationale: Kitenzi בזה huonyesha dharau au kuliona jambo kuwa lisilofaa heshima, si kutotii tu. Kauli timilifu ya Kiswahili inaonyesha tendo lililofanywa ambalo bado lina uzito wa kimaadili.
- source_word: דְּבַר יְהוָה
  choice: neno la Yahwe
  rationale: ‘Neno’ linahifadhi upana wa דבר, ambalo hapa linaweza kujumuisha amri na mapenzi ya Mungu yaliyofunuliwa; יְהוָה limetafsiriwa kwa jina ‘Yahwe’.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינָיו
  choice: kwa kufanya yaliyo maovu machoni pake
  rationale: Muundo huu wa kawaida wa Kiswahili unahifadhi uhusiano kati ya kulidharau neno la Yahwe na kutenda maovu, pamoja na sitiari ya Kiebrania ‘machoni pake’.
- source_word: הִכִּיתָ בַחֶרֶב
  choice: ulimpiga kwa upanga
  rationale: ‘Ulimpiga’ linadumisha maana ya msingi ya נכה na tofauti yake na kitenzi cha baadaye הָרַגְתָּ, huku ‘kwa upanga’ likihifadhi chombo kilichotajwa.
- source_word: לָקַחְתָּ לְּךָ לְאִשָּׁה
  choice: ukamchukua mke wake awe mke wako
  rationale: Tafsiri hii inadumisha msisitizo wa Kiebrania kwamba Daudi alimchukua kwa ajili yake mwenyewe na kumfanya mke wake.
- source_word: הָרַגְתָּ
  choice: ukamuua
  rationale: הרג ni kitenzi cha kawaida cha kuua; muktadha wenyewe unaonyesha wazi kuwa Daudi alikuwa na hatia, bila kulazimisha neno mahsusi zaidi kama ‘kumwua kwa makusudi’.
- source_word: בְּחֶרֶב בְּנֵי עַמּוֹן
  choice: kwa upanga wa Waamoni
  rationale: ‘Waamoni’ ni jina la kawaida la Kiswahili kwa בני עמון. Kurudia ‘kwa upanga’ kunahifadhi usambamba wa shtaka na kuonyesha kwamba Daudi alisababisha kifo kupitia majeshi ya Waamoni.
- source_word: אוּרִיָּה הַחִתִּי
  choice: Uria Mhiti
  rationale: Haya ni maumbo ya kawaida ya Kiswahili ya jina la mtu na utambulisho wake wa kikabila.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni יְהוָה; ‘Yahwe’ linahifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa kisarufi wa לַעֲשׂוֹת הָרַע na kuidharau neno la Yahwe
  choice: kwa kufanya yaliyo maovu
  alternative: hata ukafanya yaliyo maovu / ili kufanya yaliyo maovu
  rationale: Kiambishi ל pamoja na kitenzi-jina kinaweza kueleweka kama kufafanua namna au matokeo ya dharau hiyo. ‘Kwa kufanya’ kinaonyesha uhusiano huo bila kudai kwamba kusudi la Daudi lilikuwa kufanya uovu.
- issue: Uwajibikaji wa Daudi katika kifo cha Uria
  choice: ukamuua kwa upanga wa Waamoni
  alternative: Waamoni wakamuua kwa upanga wao
  rationale: Kiebrania kinamwambia Daudi moja kwa moja ‘ulimwua,’ huku likitaja upanga wa Waamoni kama njia; tafsiri inadumisha uwajibikaji wa Daudi na wakala wa Waamoni bila kuvichanganya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa mashtaka na urudiaji wa ‘kwa upanga’ vimehifadhiwa. ‘Machoni pake’ limeachwa kama tamathali ya kibiblia iliyoeleweka kwa urahisi.
