base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/008.yaml
  text: And I gave you your master's house and your master's wives into your bosom[a], and I gave you the house of Israel and Judah; and if that had been too little[b], I would have added to you such and such things.
translation:
  language: sw
  text: Nami nikakupa nyumba ya bwana wako na wake wa bwana wako kifuani mwako[a]. Nikakupa nyumba ya Israeli na Yuda. Na kama hayo yangekuwa machache, ningekuongezea mambo kama haya na kama yale[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mapajani mwako.” Nahau ya Kiebrania inaonyesha kupokea au kumiliki kwa ukaribu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina usemi wa nahau unaomaanisha kuongeza mambo mengine ya aina hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: nikakupa
  rationale: Qal wayyiqtol ya נתן inaendeleza mfululizo wa masimulizi; ‘nikakupa’ ni ya kawaida na huhifadhi nafsi ya kwanza pamoja na mtiririko wa matendo.
- source_word: בֵּית אֲדֹנֶיךָ
  choice: nyumba ya bwana wako
  rationale: בַּיִת inaweza kumaanisha nyumba, jamaa, mali ya kifalme, au nasaba. ‘Nyumba ya bwana wako’ huhifadhi picha pana ya Kiebrania bila kuifupisha kuwa jengo pekee au kuifasiri moja kwa moja kuwa ufalme.
- source_word: נְשֵׁי אֲדֹנֶיךָ
  choice: wake za bwana wako
  rationale: Hili ni kirai cha moja kwa moja kinachomaanisha wake wa bwana aliyemtangulia Daudi; ‘bwana wako’ linaeleweka hapa kuwa mwenye mamlaka juu yake, si jina la Mungu.
- source_word: בְּחֵיקֶךָ
  choice: kifuani mwako
  rationale: חֵיק hutaja kifua au mapaja na hutumiwa kama nahau ya kupokea au kumiliki kwa ukaribu. ‘Kifuani mwako’ huhifadhi sitiari ya asili na utata wake.
- source_word: בֵּית יִשְׂרָאֵל וִיהוּדָה
  choice: nyumba ya Israeli na Yuda
  rationale: ‘Nyumba’ huhifadhi neno lilelile la Kiebrania na ulinganifu wake na ‘nyumba ya bwana wako’; hapa linaweza kuhusisha watu na eneo la kifalme bila kuamua maana moja tu.
- source_word: וְאִם מְעָט
  choice: kama hayo yangekuwa machache
  rationale: Kirai hiki huonyesha hali ya kudhaniwa ya kutotosha. Kiswahili hiki ni cha kawaida na huhifadhi uhusiano wa masharti.
- source_word: וְאֹסִפָה לְּךָ
  choice: ningekuongezea
  rationale: Hiphil ya יסף ina maana ya kuongeza. ‘Ningekuongezea’ huonyesha kwa asili matokeo ya sharti lililotangulia.
- source_word: כָּהֵנָּה וְכָהֵנָּה
  choice: mengine kama hayo na zaidi
  rationale: Usemi uliorudiwa ni nahau ya kuongeza vitu vingine vya aina hiyo, hata zaidi; tafsiri hii inaeleza maana yake bila kubainisha vitu ambavyo maandiko hayavitaji.
theological_decisions:
- issue: Ikiwa kauli kuhusu wake za Sauli itafsiriwe kuwa kibali cha Mungu kwa mahusiano ya kindoa ya Daudi nao
  choice: Kauli imeachwa kuwa Mungu alimpa Daudi wake za bwana wake ‘kifuani mwako,’ bila kuiongeza kuwa kibali cha kindoa au maelezo mahususi ya mahusiano hayo.
  alternative: ‘alikukabidhi wanawake wa bwana wako uwatunze’ au ‘alikupa nyumba ya wake wa mfalme’
  rationale: Kiebrania kinaeleza uhamisho unaohusiana na urithi na milki ya kifalme, lakini hakitoi hapa hukumu ya wazi kuhusu aina au uhalali wa mahusiano. Tafsiri huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘nikakupa’ huhifadhi mtiririko wa masimulizi; ‘kifuani mwako’ ni rasmi lakini unaeleweka, na tanbihi hutoa mbadala wa picha hiyo.
