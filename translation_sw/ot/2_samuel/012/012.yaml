  text: כִּ֥י אַתָּ֖ה עָשִׂ֣יתָ בַ/סָּ֑תֶר וַ/אֲנִ֗י אֶעֱשֶׂה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה נֶ֥גֶד כָּל יִשְׂרָאֵ֖ל וְ/נֶ֥גֶד הַ/שָּֽׁמֶשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/012.yaml
  text: For you did it in secret[a], but I will do this thing before all Israel and before the sun.
translation:
  language: sw
  text: Kwa maana wewe ulifanya hivyo kwa siri, lakini mimi nitafanya jambo hili mbele ya Israeli wote na mbele ya jua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadharani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu ya hukumu iliyotangazwa katika mstari uliotangulia na kuhifadhi uhusiano wa maelezo kwa Kiswahili cha kawaida.
- source_word: עָשִׂיתָ
  choice: ulifanya
  rationale: Kitenzi kinarejelea kosa la Daudi bila kulitaja tena; Kiswahili kinaweza kuhifadhi udokezi huo bila kuongeza kitu kisichomo katika maandishi.
- source_word: בַסָּתֶר
  choice: kwa siri
  rationale: Ni usemi wa kawaida unaowasilisha maana ya kutenda kwa kujificha na kuweka wazi utofauti na hatua ya hadharani inayofuata.
- source_word: וַאֲנִי
  choice: lakini mimi
  rationale: Ingawa waw inaweza kuwa kiunganishi cha kawaida, hapa muktadha unaonyesha utofauti mkubwa kati ya tendo la siri la Daudi na tendo la Mungu la hadharani.
- source_word: אֶעֱשֶׂה
  choice: nitafanya
  rationale: Huhifadhi nafsi ya kwanza na maana ya wakati ujao ya tangazo la hukumu bila kudhoofisha uwakala wa Mungu.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: Huhifadhi nomino na kiashiria cha Kiebrania huku ikiwa ya asili na yenye hadhi katika Kiswahili.
- source_word: נֶגֶד כָּל יִשְׂרָאֵל
  choice: mbele ya Israeli yote
  rationale: Inawasilisha tendo linalofanyika wazi mbele ya taifa zima, bila kubadili Israeli kuwa watu binafsi kwa maelezo yasiyo ya lazima.
- source_word: וְנֶגֶד הַשָּׁמֶשׁ
  choice: naam, hadharani
  rationale: Kihalisi ni ‘na mbele ya jua,’ lakini katika muktadha huu ni nahau ya kufanyika wazi mchana. ‘Naam, hadharani’ huwasilisha nguvu ya ufafanuzi ya kishazi hicho kwa Kiswahili cha sasa; picha halisi imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwakala katika hukumu iliyotangazwa
  choice: 'Kuhifadhi uwakala wa Mungu wa nafsi ya kwanza: “mimi nitafanya jambo hili”'
  alternative: “nitasababisha jambo hili lifanyike”
  rationale: Kiebrania kinatumia kitenzi cha moja kwa moja cha nafsi ya kwanza. Ingawa simulizi pana linaonyesha hukumu ikitekelezwa kupitia matukio ya kihistoria, mstari huu wenyewe unamtaja Mungu kama mtendaji, hivyo tafsiri haipaswi kulainisha kauli hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo unahifadhi utofauti kati ya siri na hadharani; “naam” hufanya kishazi cha mwisho kisomeke kama ufafanuzi wa namna jambo litakavyofanywa.
