base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/012.yaml
  text: from Aram[a], and from Moab, and from the Ammonites, and from the Philistines, and from Amalek, and from the spoil of Hadadezer son of Rehob[c][b], king of Zobah.
translation:
  language: sw
  text: kutoka Aramu[a], na kutoka Moabu, na kutoka kwa Waamoni[b], na kutoka kwa Wafilisti, na kutoka Amaleki, na kutoka nyara za Hadadezeri[c], mwana wa Rehobu, mfalme wa Soba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Aramu; kwa mapokeo limetafsiriwa “Siria.”'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, kwa maana ya neno kwa neno, “wana wa Amoni.”
    reason: lexical_alternative
  - marker: c
    text: Katika vifungu vingine jina hili huandikwa “Hadarezeri.”
    reason: textual_variant
lexical_decisions:
- source_word: מֵאֲרָם
  choice: kutoka Aramu
  rationale: Aramu ni jina la eneo na watu katika Kiebrania; limetoholewa badala ya kubadilishwa kuwa jina la baadaye, Siria.
- source_word: וּמִמּוֹאָב
  choice: Moabu
  rationale: Jina la taifa au eneo limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: וּמִבְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Ingawa maana ya neno kwa neno ni ‘wana wa Amoni,’ hapa kirai hicho kinawataja watu wa taifa hilo; ‘Waamoni’ ni Kiswahili cha kawaida na sahihi.
- source_word: וּמִפְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Jina la watu limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: וּמֵעֲמָלֵק
  choice: Amaleki
  rationale: Kiebrania kinatumia jina maalumu Amaleki, si umbo la wazi la jina la watu; kulitunza kunafuata matini huku likiruhusu rejeo la eneo au watu libaki kama lilivyo.
- source_word: וּמִשְּׁלַל
  choice: na katika nyara
  rationale: שָׁלָל ni mali iliyotekwa vitani; ‘nyara’ ni neno la kawaida na lenye hadhi katika muktadha huu.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezeri
  rationale: Utohozi unafuata umbo la konsonanti lililo katika mstari huu.
- source_word: בֶּן רְחֹב
  choice: mwana wa Rehobu
  rationale: Kirai cha ukoo kimetafsiriwa kwa uwazi na kwa kufuata muundo wa chanzo.
- source_word: מֶלֶךְ צוֹבָה
  choice: mfalme wa Soba
  rationale: Cheo cha kifalme kimetafsiriwa moja kwa moja, na jina la mahali limetoholewa.
