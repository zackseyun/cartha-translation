base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/003.yaml
  text: David struck down Hadadezer son of Rehob[a], king of Zobah[c][b], when he went to restore his power at the River.
translation:
  language: sw
  text: Daudi akamshinda Hadadezeri mwana wa Rehobu[a], mfalme wa Soba, wakati alipokwenda kurejesha mamlaka yake[b] kwenye Mto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Hadadezeri”; baadhi ya mapokeo ya maandishi na simulizi linalolingana katika 1 Mambo ya Nyakati yana “Hadarezeri.”'
    reason: textual_variant
  - marker: b
    text: Au “kurejesha udhibiti wake” au “kuimarisha tena utawala wake”; kihalisi, “kurejesha mkono wake.”
    reason: lexical_alternative
  - marker: c
    text: Huenda “Mto” hapa ni Mto Frati.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּךְ
  choice: akamshinda
  rationale: Kitenzi נכה katika muktadha wa vita humaanisha kumpiga adui na mara nyingi kumshinda. “Akamshinda” kinaonyesha matokeo ya kijeshi bila kudai kwamba alimuua.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezeri
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili, kwa kufuata umbo la WLC katika mstari huu.
- source_word: בֶּן רְחֹב
  choice: mwana wa Rehobu
  rationale: Muundo wa nasaba umetafsiriwa moja kwa moja; majina yametoholewa kwa matumizi ya kawaida ya Kiswahili.
- source_word: מֶלֶךְ צוֹבָה
  choice: mfalme wa Soba
  rationale: Muundo tegemezi umetafsiriwa moja kwa moja, huku jina la mahali likitoholewa.
- source_word: בְּלֶכְתּוֹ
  choice: wakati alipokwenda
  rationale: Kitenzi-jina chenye kiambishi ב kinaonyesha hali ya wakati. Tafsiri hii ni ya kawaida katika Kiswahili na haimtaji wazi mhusika wa kiwakilishi pale Kiebrania kinapoweza kuacha rejeleo lake litegemee muktadha.
- source_word: לְהָשִׁיב
  choice: kurejesha
  rationale: Hifili ya שוב ina maana ya kufanya kitu kirudi au kukirejesha; “kurejesha” huhifadhi upana wa maana.
- source_word: יָדוֹ
  choice: mamlaka yake
  rationale: Neno la Kiebrania “mkono” limetumiwa kiidioma kumaanisha uwezo, udhibiti, au utawala. “Mamlaka yake” ni ya asili katika Kiswahili bila kubana maana kuwa utawala wa eneo pekee.
- source_word: בִּנְהַר
  choice: karibu na Mto
  rationale: Neno נהר likitumika kwa namna hii huenda linarejelea mto mkuu, yaani Frati. “Mto” huhifadhi namna ya usemi wa chanzo, na “karibu na” inaeleza kwa asili mahali bila kudai kwamba tendo lilifanyika ndani ya maji.
