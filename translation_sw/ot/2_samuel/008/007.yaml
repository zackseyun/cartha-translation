  text: And David took the shields of gold that belonged to the servants of Hadadezer and brought them to Jerusalem[a].
translation:
  language: sw
  text: Daudi akazitwaa ngao za dhahabu zilizokuwa za watumishi wa Hadadezeri, akazileta Yerusalemu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ngao za dhahabu”; kifungu cha Kiebrania kinaweza pia kumaanisha kwa karibu “ngao zilizotengenezwa kwa dhahabu.” Maoni ya wachache hulichukua neno hilo kuwa “vifuko vya mishale.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akazitwaa
  rationale: Kitenzi לקח katika simulizi humaanisha kwa kawaida ‘kutwaa’ au ‘kuchukua.’ ‘Akazitwaa’ kinafaa katika muktadha wa nyara bila kuongeza wazi wazo la kunyakua kwa nguvu.
- source_word: שִׁלְטֵי הַזָּהָב
  choice: ngao za dhahabu
  rationale: Tafsiri ya jadi na inayofaa muktadha wa kijeshi ni ‘ngao.’ Muundo ‘za dhahabu’ unaakisi kwa karibu hali ya uambatani ya Kiebrania; pendekezo la wachache la ‘podo’ limewekwa katika tanbihi.
- source_word: אֲשֶׁר הָיוּ אֶל
  choice: zilizokuwa za
  rationale: Katika muktadha huu, msemo huo unaonyesha umiliki au uhusiano, si mahali tu; ‘zilizokuwa za’ ni Kiswahili cha kawaida na hakifanyi dai kuwa nzito kuliko lazima.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: watumishi wa Hadadezeri
  rationale: עבדים inaweza kumaanisha watumishi, maafisa, au watumwa. Hapa ‘watumishi’ huhifadhi upana wa maana na inafaa kwa watu wa mfalme bila kuwalazimisha wawe watumwa au maafisa.
- source_word: וַיְבִיאֵם
  choice: akazileta
  rationale: Hiphil ya בוא humaanisha ‘kuleta’; kiambishi ‘-zi-’ kinarejelea ngao kwa kawaida katika Kiswahili.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali katika Kiswahili cha Biblia.
