translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Alama zote za tanbihi zimewekwa mara baada ya jina husika; uwezekano wa maana mbili wa נְחֹשֶׁת umehifadhiwa kwa kuchagua neno pana la Kiswahili “shaba.”
