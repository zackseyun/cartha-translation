base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/008.yaml
  text: And from Betah and from Berothai[a], cities of Hadadezer[c][b], King David took very much bronze.
translation:
  language: sw
  text: Naye Mfalme Daudi akachukua shaba nyingi sana kutoka Beta na kutoka Beerothai[a][b], miji ya Hadadezeri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika simulizi sambamba la 1 Mambo ya Nyakati 18:8, maeneo haya yanaitwa Tibhathi na Kuni; maandishi ya Kiebrania ya mstari huu yanasoma Beta na Beerothai.
    reason: cross_reference
  - marker: b
    text: Au “Beerotha,” kufuatana na umbo linalohusiana la jina hilo la mahali linalotumiwa katika baadhi ya tafsiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בֶּטַח
  choice: kutoka Beta
  rationale: Viambishi vya kuunganisha na kuonyesha asili vinatafsiriwa kwa kawaida kuwa “kutoka”; jina la mahali linafuata umbo la Kiebrania la mstari huu.
- source_word: וּ/מִ/בֵּרֹתַי
  choice: na Beerothai
  rationale: Muundo wa pili unaendeleza “kutoka” katika Kiswahili, huku jina likinakiliwa kulingana na umbo la Kiebrania Berothai.
- source_word: עָרֵי הֲדַדְעָזֶר
  choice: miji ya Hadadezeri
  rationale: Mnyororo wa umilikaji unaonyesha miji iliyokuwa ya Hadadezeri au chini ya mamlaka yake; “miji ya” ni tafsiri ya moja kwa moja na ya asili.
- source_word: לָקַח
  choice: akachukua
  rationale: Kitenzi cha msingi ni “chukua.” Katika muktadha wa vita kinaweza kudokeza kutwaa, lakini “akachukua” hakiongezi ufafanuzi usiotajwa wazi.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Mfalme Daudi
  rationale: Huu ndio mpangilio wa kawaida na wenye heshima wa cheo na jina katika Kiswahili.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Neno la Kiebrania linaweza kumaanisha shaba ghafi au aloi ya shaba; “shaba” ni neno la kawaida la Kiswahili na linaacha upana huo wa kisemantiki bila kuulazimisha kuwa “shaba nyekundu” au “bronzi.”
- source_word: הַרְבֵּה מְאֹד
  choice: nyingi sana
  rationale: Maneno haya yanasisitiza wingi mkubwa; “nyingi sana” ni ya moja kwa moja, ya asili, na huhifadhi msisitizo huo.
