  source_fidelity: 'Matini inafuata Kiebrania kwa uaminifu: Sadoki na Ahimeleki wametajwa pamoja na nasaba zao, כֹּהֲנִים imetafsiriwa kwa maana yake ya msingi, na Seraya ametajwa kama סוֹפֵר. “Katibu” ni tafsiri sahihi ya kiutendaji kwa ofisa huyu wa maandishi/utawala.'
