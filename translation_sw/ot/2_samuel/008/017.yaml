base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/017.yaml
  text: Zadok son of Ahitub and Ahimelech son of Abiathar were priests[b][a], and Seraiah was secretary.
translation:
  language: sw
  text: Sadoki mwana wa Ahitubu na Ahimeleki mwana wa Abiathari walikuwa makuhani[a], naye Seraya alikuwa katibu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mawaziri wakuu” au “maofisa wa kifalme.” Baadhi hulielewa neno hili hapa kwa maana pana ya kiutawala kwa sababu aya hii inaorodhesha maofisa wa Daudi.
    reason: lexical_alternative
  - marker: b
    text: Au, “mwandishi.” Neno la Kiebrania humaanisha afisa aliyekuwa na wajibu wa uandishi au shughuli za kiutawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוֹק
  choice: Sadoki
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayoeleweka katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika orodha hii ya maofisa, neno hili kwa kawaida linaonyesha uhusiano wa moja kwa moja wa baba na mwana.
- source_word: אֲחִיטוּב
  choice: Ahitubu
  rationale: Jina la mtu limetoholewa katika umbo linalofaa Kiswahili.
- source_word: אֲחִימֶלֶךְ
  choice: Ahimeleki
  rationale: Jina la mtu limetoholewa katika umbo linalofaa Kiswahili.
- source_word: אֶבְיָתָר
  choice: Abiathari
  rationale: Jina la mtu limetoholewa katika umbo linalofaa Kiswahili.
- source_word: כֹּהֲנִים
  choice: makuhani
  rationale: Hii ndiyo maana ya kawaida na ya msingi ya neno la Kiebrania; uwezekano wa maana pana ya kiutawala umehifadhiwa katika tanbihi.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida na inayoeleweka katika Kiswahili.
- source_word: סוֹפֵר
  choice: katibu
  rationale: Katika orodha ya maofisa wa kifalme, neno hili humaanisha afisa aliyeshughulika na uandishi na utawala; “katibu” huwasilisha kazi hiyo kwa Kiswahili cha sasa.
theological_decisions:
- issue: Maana ya כֹּהֲנִים katika orodha ya maofisa wa mfalme
  choice: makuhani
  alternative: mawaziri wakuu au maofisa wa kifalme
  rationale: Maana ya msingi ya neno la Kiebrania ni “makuhani.” Ingawa muktadha wa utawala umewafanya baadhi kulielewa kwa maana pana ya maofisa wa ngazi ya juu, hakuna shinikizo la kutosha la kimuktadha kuondoa maana yake ya kawaida katika matini kuu; uwezekano huo umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama orodha ya maofisa katika Kiebrania. Alama [a] imewekwa baada ya “makuhani,” na [b] baada ya “katibu,” ili kila tanbihi ihusiane wazi na neno lake.
