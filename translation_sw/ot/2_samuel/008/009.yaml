  text: When Toi king of Hamath heard that David had struck down all the army of Hadadezer,[a]
translation:
  language: sw
  text: Toi, mfalme wa Hamathi, aliposikia kwamba Daudi alikuwa amelipiga jeshi lote la Hadadezeri,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kifungu sambamba katika 1 Mambo ya Nyakati 18:9 kinataja jina la mfalme kuwa “Tou.” Maandishi ya Kiebrania hapa yanasema “Toi.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: aliposikia
  rationale: Kitenzi שׁמע kinaonyesha kwamba Toi alipata habari; muundo wa “aliposikia” unaunganisha kwa kawaida kishazi hiki na mwendelezo wa sentensi katika mstari unaofuata.
- source_word: תֹּעִי
  choice: Toi
  rationale: Jina limetoholewa kulingana na umbo la Kiebrania katika mstari huu; tofauti ya “Tou” katika kifungu sambamba imehifadhiwa katika tanbihi.
- source_word: מֶלֶךְ חֲמָת
  choice: mfalme wa Hamathi
  rationale: Huu ni mfuatano wa nomino unaotaja cheo cha Toi na eneo alilotawala. “Hamathi” ni utohozi unaofaa katika Kiswahili.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי inaanzisha maudhui ya habari aliyosikia Toi, si sababu ya kitendo.
- source_word: הִכָּה
  choice: alikuwa amelishinda
  rationale: Katika muktadha wa kijeshi נכה inaweza kumaanisha kupiga na kulishinda jeshi. “Alikuwa amelishinda” ni ya asili katika Kiswahili na inaonyesha kwamba ushindi ulitangulia kusikia kwa Toi.
- source_word: אֵת כָּל חֵיל
  choice: jeshi lote
  rationale: חַיִל hapa ni jeshi au nguvu ya kijeshi; “jeshi lote” ni wazi na ya kawaida kwa wasomaji wa sasa.
- source_word: הֲדַדְעָזֶר
  choice: Hadadezeri
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
