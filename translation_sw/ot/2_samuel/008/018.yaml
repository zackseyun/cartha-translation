base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/018.yaml
  text: Benaiah son of Jehoiada was over the Kerethites and the Pelethites, and David’s sons were priests.[a]
translation:
  language: sw
  text: Benaya, mwana wa Yehoyada, alikuwa mkuu wa Wakerethi na Wapelethi; na wana wa Daudi walikuwa makuhani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mawaziri wakuu” au “maafisa wa kifalme.” Neno la Kiebrania ni neno la kawaida linalomaanisha “makuhani,” lakini baadhi hulielewa hapa kwa maana pana ya maafisa wa ikulu kwa sababu muktadha unahusu utawala wa kifalme.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנָיָהוּ בֶּן־יְהוֹיָדָע
  choice: Benaya mwana wa Yehoyada
  rationale: Majina yametoholewa kwa namna inayofaa Kiswahili na inayotambulika katika matumizi ya Biblia za Kiswahili.
- source_word: וְהַכְּרֵתִי
  choice: Wakerethi
  rationale: Ni jina la kundi la watu; limetoholewa moja kwa moja bila kuamua zaidi ikiwa walikuwa kabila au kikosi maalumu.
- source_word: וְהַפְּלֵתִי
  choice: Wapelethi
  rationale: Ni jina la kundi linalotajwa pamoja na Wakerethi; utohozi huhifadhi istilahi ya chanzo bila kuifasiri kupita kiasi.
- source_word: וּבְנָיָהוּ ... וְהַכְּרֵתִי וְהַפְּלֵתִי
  choice: Benaya ... alikuwa mkuu wa Wakerethi na Wapelethi
  rationale: Kiebrania kinaorodhesha Benaya pamoja na makundi haya bila kutaja wazi kitenzi au cheo. Muktadha wa orodha ya maafisa unaonyesha uhusiano wa uongozi, hivyo 'alikuwa mkuu wa' hukamilisha maana kwa Kiswahili cha kawaida bila kufafanua aina ya kikosi.
- source_word: כֹּהֲנִים
  choice: makuhani
  rationale: Hii ndiyo maana ya kawaida na ya moja kwa moja ya neno la Kiebrania. Maana pana inayowezekana katika mazingira ya utawala wa kifalme imewekwa katika tanbihi badala ya kuchukua nafasi ya maana ya msingi.
- source_word: הָיוּ
  choice: walikuwa
  rationale: Hii ni tafsiri ya kawaida ya kitenzi cha Kiebrania katika tungo hii; 'walitumikia kama' kingekuwa na ufafanuzi zaidi usioelezwa moja kwa moja.
theological_decisions:
- issue: Wana wa Daudi kuitwa כֹּהֲנִים
  choice: Kudumisha “makuhani” katika matini kuu
  alternative: “mawaziri wakuu” au “maafisa wa kifalme”
  rationale: Matini ya Kiebrania hutumia neno la kawaida kwa makuhani, ingawa muktadha wa utawala wa kifalme na utambulisho wa wana wa Daudi huleta mvutano wa kihistoria na kiteolojia. Tafsiri haiondoi mvutano huo; uwezekano wa maana pana ya cheo cha ikulu unaonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Semikoloni inatenganisha majukumu mawili katika orodha ya maafisa. Majina ya makundi yametoholewa kama Wakerethi na Wapelethi.
