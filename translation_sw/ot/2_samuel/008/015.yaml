  text: So David reigned over all Israel[a], and David was administering justice and righteousness to all his people.
translation:
  language: sw
  text: Daudi akatawala Israeli wote, naye alikuwa akitenda haki na uadilifu[a] kwa watu wake wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa akitenda haki na yaliyo sawa kwa watu wake wote.” Maneno ya Kiebrania “haki na uadilifu” hutumiwa pamoja kueleza utawala bora wa kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: akatawala
  rationale: Kitenzi מָלַךְ hapa kinaeleza utawala wa Daudi akiwa mfalme, si tukio la kuanza kuwa mfalme tu. “Akatawala” ni Kiswahili cha kawaida na chenye heshima katika muhtasari huu wa kifalme.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: Israeli yote
  rationale: עַל pamoja na מָלַךְ huonyesha eneo au watu waliotawaliwa. “Israeli yote” inadumisha wigo kamili wa utawala wa Daudi.
- source_word: וַיְהִי ... עֹשֶׂה
  choice: alikuwa akisimamia
  rationale: Muundo wa ויהי pamoja na kitenzi-shirikishi unaonyesha tendo la kawaida lililoendelea. “Alikuwa akisimamia” linaonyesha uendelevu huo na linafaa katika muktadha wa uongozi na utoaji wa haki.
- source_word: מִשְׁפָּט
  choice: haki
  rationale: Katika muktadha wa kifalme, מִשְׁפָּט inahusu kusimamia mambo kwa haki, wala si hukumu moja tu ya mahakama.
- source_word: וּצְדָקָה
  choice: uadilifu
  rationale: צְדָקָה humaanisha unyofu, mwenendo ulio sawa, au utaratibu wa haki. “Uadilifu” huitofautisha kwa kiasi na מִשְׁפָּט huku ikidumisha maana ya kimaadili.
- source_word: לְכָל עַמּוֹ
  choice: kwa watu wake wote
  rationale: ל hapa huonyesha watu ambao utawala huo uliwahusu na kunufaisha. “Kwa watu wake wote” ni ya asili katika Kiswahili na inadumisha kiambishi cha umilikaji cha Kiebrania.
theological_decisions:
- issue: Tafsiri ya jozi ya kifalme מִשְׁפָּט וּצְדָקָה
  choice: haki na uadilifu
  alternative: haki na yaliyo sawa
  rationale: Kutunza maneno mawili tofauti kunaonyesha kwa pamoja utoaji wa haki katika utawala na unyofu wa kimaadili. Hivyo sifa ya utawala bora wa kifalme haipunguzwi kuwa wazo moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo “alikuwa akisimamia” umehifadhi hali ya tendo endelevu, na jozi “haki na uadilifu” imeachwa ikiwa na vipengele viwili tofauti.
