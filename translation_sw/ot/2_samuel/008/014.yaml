  text: וַ/יָּ֨שֶׂם בֶּ/אֱד֜וֹם נְצִבִ֗ים בְּ/כָל אֱדוֹם֙ שָׂ֣ם נְצִבִ֔ים וַ/יְהִ֥י כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑ד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/014.yaml
  text: He placed garrisons in Edom[a]; throughout all Edom he placed garrisons, and all Edom became servants to David[b]. And Yahweh gave David victory wherever he went.
translation:
  language: sw
  text: Akaweka vikosi vya kijeshi katika Edomu; katika Edomu yote akaweka vikosi vya kijeshi, na watu wote wa Edomu wakawa watumishi wa Daudi.[a] Yahwe akampa Daudi ushindi popote alikokwenda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Edomu yote ikawa watumwa wa Daudi.” Kiebrania kinasema kihalisi, “Edomu yote ikawa watumishi/watumwa wa Daudi,” kikitumia jina la taifa kuwakilisha watu wake kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Au, “Yahwe alimwokoa au alimkomboa Daudi popote alikokwenda.” Katika muktadha huu wa kijeshi, “akampa Daudi ushindi” huonyesha maana ya kuokoa au kukomboa vitani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם / שָׂם
  choice: akaweka
  rationale: Kitenzi שׂים kina maana ya kuweka au kutia mahali; “akaweka” ni Kiswahili cha kawaida na hakiongezi maana isiyokuwamo katika kitenzi.
- source_word: נְצִבִים
  choice: vikosi vya askari
  rationale: Katika muktadha wa ushindi na udhibiti wa Edomu, neno hili linaelekea kumaanisha majeshi yaliyowekwa kudhibiti eneo. “Vikosi vya askari” linaeleweka kwa urahisi bila kulazimisha maana ya magavana au majengo ya kijeshi.
- source_word: בֶּאֱדוֹם / בְּכָל אֱדוֹם
  choice: huko Edomu / katika Edomu yote
  rationale: Viunganishi vinaonyesha mahali, na בְּכָל linaonyesha kuenea katika eneo lote.
- source_word: וַיְהִי כָל אֱדוֹם עֲבָדִים לְדָוִד
  choice: watu wote wa Edomu wakawa watumishi wa Daudi
  rationale: “Edomu yote” ni matumizi ya jina la taifa kwa watu wake kwa ujumla. “Watumishi” linaonyesha hali yao ya kutiishwa kisiasa, huku tanbihi ikihifadhi uwezekano wa maana kali zaidi ya “watumwa.”
- source_word: וַיּוֹשַׁע
  choice: akampa ... ushindi
  rationale: Hifili ya ישׁע inaweza kumaanisha kuokoa, kukomboa, au kumpa mtu ushindi. Katika muhtasari huu wa vita, “akampa Daudi ushindi” huwasilisha maana ya kimuktadha na kudumisha kwamba Yahwe ndiye aliyetenda.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: kila alikokwenda
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza mafanikio katika kila mahali Daudi alikokwenda, bila kuongeza wazo maalumu la kuandamana kijeshi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la pekee יהוה; “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya עֲבָדִים katika muktadha wa taifa lililoshindwa
  choice: watumishi
  alternative: watumwa
  rationale: Neno linaweza kumaanisha watumishi au watumwa. Katika muktadha wa utiisho wa kisiasa, “watumishi” ni mwafaka katika matini, huku maana kali zaidi ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya kuweka vikosi katika Edomu yamedumishwa kwa sababu yapo katika Kiebrania. Muundo “watu wote wa Edomu” unaweka wazi matumizi ya pamoja ya jina la taifa bila kupoteza maana yake.
