base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/002.yaml
  text: He struck Moab and measured them with a line[a], making them lie down on the ground. He measured off two lengths of line for death and a full length of line to keep alive. So Moab became David’s servants[b], bringing tribute.
translation:
  language: sw
  text: Akawapiga Wamoabu na kuwapima kwa kamba[a], baada ya kuwalaza chini. Akapima vipimo viwili vya kamba kwa ajili ya kuwaua, na kipimo kamili cha kamba kwa ajili ya kuwaacha hai. Basi Wamoabu wakawa watumishi wa Daudi[b], wakileta ushuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kamba ya kupimia.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinaeleza kwamba Daudi aliwapima Wamoabu wakiwa wamelala chini: vipimo viwili vilitengwa kwa ajili ya kuwaua, na kipimo kimoja kamili kwa ajili ya kuwaacha hai.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ אֶת־מוֹאָב
  choice: Akawapiga Wamoabu
  rationale: Kitenzi נכה kimsingi ni ‘kupiga’; ‘Wamoabu’ linaonyesha kwamba hapa jina la nchi linawakilisha watu wake bila kuongeza wazo la ushindi kamili lisilotajwa moja kwa moja.
- source_word: וַיְמַדְּדֵם בַּחֶבֶל
  choice: na kuwapima kwa kamba
  rationale: Piel ya מדד ni ‘kupima,’ na חבל ni kamba inayotumiwa kupimia. Tafsiri inadumisha taswira halisi na kali ya Kiebrania.
- source_word: הַשְׁכֵּב אוֹתָם אַרְצָה
  choice: akiwaamelaza chini
  rationale: Muundo wa kisababishi unaonyesha kwamba Daudi aliwafanya walale chini ili wapimwe; usemi huu ni wa asili katika Kiswahili na unahifadhi utaratibu wa tukio.
- source_word: וַיְמַדֵּד שְׁנֵי חֲבָלִים
  choice: Akapima urefu wa kamba mara mbili
  rationale: Usemi huu unaonyesha vipimo viwili vya urefu wa kamba bila kudai kwamba lazima kulikuwa na kamba mbili tofauti.
- source_word: לְהָמִית
  choice: kwa ajili ya kuwaua
  rationale: Hiphil ya מות hapa ina maana ya kusababisha kifo, yaani kuwaua; lamed inaonyesha kusudi au matokeo.
- source_word: וּמְלֹא הַחֶבֶל לְהַחֲיוֹת
  choice: na urefu mmoja kamili wa kamba kwa ajili ya kuwaacha hai
  rationale: מְלֹא הַחֶבֶל ni kipimo kimoja kizima cha kamba, na Hiphil ya חיה humaanisha kuwaacha au kuwahifadhi hai. Tafsiri haibadili vipimo hivyo kuwa sehemu za hesabu zilizoelezwa wazi zaidi kuliko chanzo.
- source_word: וַתְּהִי מוֹאָב לְדָוִד לַעֲבָדִים
  choice: Basi Wamoabu wakawa watumishi wa Daudi
  rationale: Katika muktadha huu wa kisiasa עֲבָדִים inaonyesha watu waliotiishwa chini ya mamlaka ya mfalme; ‘watumishi’ ni neno la moja kwa moja lisilolazimisha maana mahususi ya utumwa.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: wakileta ushuru
  rationale: Katika muktadha wa kifalme מִנְחָה ni ushuru unaoletwa na taifa lililotiishwa, si sadaka ya ibada.
theological_decisions:
- issue: Jinsi ya kueleza kitendo cha kuwapima Wamoabu na kuwagawa kwa kifo au uzima
  choice: Kudumisha taswira halisi ya kamba, vipimo viwili vya kuwaua, na kipimo kimoja cha kuwaacha hai.
  alternative: Kufafanua moja kwa moja kwamba theluthi mbili waliuawa na theluthi moja ikaachwa hai, au kuelewa kamba kwa njia ya mfano tu.
  rationale: Kiebrania kinaeleza utaratibu mkali wa kupima watu waliolazwa chini na kuwateua kwa kifo au uzima. Uwiano unaweza kueleweka kutokana na maneno hayo, lakini chanzo hakitumii moja kwa moja istilahi za ‘theluthi mbili’ na ‘theluthi moja’; kwa hiyo tafsiri haiongezi ufafanuzi huo katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Wamoabu’ limetumiwa kwa watu wa Moabu; ‘ushuru’ linafaa kwa wajibu wa taifa lililotiishwa. Lugha haipunguzi ukali wa tukio wala kuongeza hitimisho la kimadhehebu.
