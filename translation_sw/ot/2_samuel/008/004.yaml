translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi wenye “aka-” umehifadhiwa. “Magari ya vita” limetumiwa badala ya “magari” pekee ili kuzuia maana ya magari ya kisasa.
