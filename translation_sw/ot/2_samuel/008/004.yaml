  source_fidelity: Maana ya kijeshi, idadi za MT, na tendo la kulemaza farasi zimewasilishwa kwa uaminifu. Hata hivyo, «akamteka ... wapanda farasi» hutumia kiambishi cha yambwa cha umoja (-m-) kana kwamba Hadadezeri ndiye aliyetekwa, ilhali yambwa inayotajwa ni askari wengi waliotekwa kutoka kwake.
  naturalness: Marekebisho ya «akateka kutoka kwake» hufanya sentensi iwe ya Kiswahili Sanifu na yenye maana wazi. «Akawakata kano farasi» ni matumizi yanayoeleweka na sahihi katika muktadha wa farasi wengi.
  terminology: «Wapanda farasi», «askari wa miguu», na «magari ya vita» ni istilahi za asili na za kisasa zinazofaa. Ufafanuzi wa farasi katika kifungu cha magari ya vita unahalalishwa na kitenzi cha kukata kano.
