base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/004.yaml
  text: David captured from him 1,700 horsemen and 20,000 foot soldiers[a]. Then David hamstrung all the chariot horses[c][b], but left enough for 100 chariots.
translation:
  language: sw
  text: Daudi akateka kutoka kwake wapanda farasi 1,700 na askari wa miguu 20,000.[a] Kisha Daudi akawakata kano farasi wote wa magari ya vita,[b] lakini akaacha farasi wa kutosha kwa magari 100.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maandishi ya Kiebrania hapa yanasema “wapanda farasi 1,700.” Sehemu inayolingana katika 1 Mambo ya Nyakati 18:4 inasema “wapanda farasi 7,000.”
    reason: textual_variant
  - marker: b
    text: 'Kiebrania: “magari yote ya vita,” au “kikosi chote cha magari ya vita”; farasi wametajwa wazi kwa sababu hao ndio wanaoweza kukatwa kano.'
    reason: lexical_alternative
  - marker: c
    text: Au, “lakini akabakiza magari 100.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: akamteka
  rationale: Kitenzi לכד kina maana ya kuteka au kukamata vitani; umbo hili linaonyesha kuwa Daudi aliwateka watu wa jeshi la Hadadezeri.
- source_word: מִמֶּנּוּ
  choice: kutoka kwake
  rationale: Kiwakilishi tamati cha Kiebrania ni cha umoja na kinamrejelea mfalme aliyeshindwa.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת פָּרָשִׁים
  choice: wapanda farasi 1,700
  rationale: פָּרָשִׁים ni wapanda farasi wa kijeshi; idadi inafuata maandishi ya Kimasora ya 2 Samweli.
- source_word: וְעֶשְׂרִים אֶלֶף אִישׁ רַגְלִי
  choice: askari wa miguu 20,000
  rationale: Tafsiri hii ya kawaida inaonyesha wazi wanajeshi waliopigana kwa miguu, tofauti na wapanda farasi.
- source_word: וַיְעַקֵּר
  choice: akawakata kano
  rationale: Katika muktadha huu עקר hueleza kuwalemaza farasi kwa kukata kano za miguu; tafsiri inaweka tendo hilo wazi kwa Kiswahili cha sasa.
- source_word: אֶת כָּל הָרֶכֶב
  choice: farasi wote wa magari ya vita
  rationale: רֶכֶב kwa kawaida ni magari au kikosi cha magari, lakini kitu kinachoweza kukatwa kano hapa ni farasi; matumizi ya kimajazi yamewekwa wazi.
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: akaacha farasi wa kutosha kwa magari 100
  rationale: יתר katika hifili ni kuacha au kubakiza; muktadha unaonyesha farasi waliobakizwa kuendesha magari mia moja.
