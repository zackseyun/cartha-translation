  text: And David made a name for himself when he returned from striking down Aram in the Valley of Salt—eighteen thousand men[a].
translation:
  language: sw
  text: Daudi akajipatia umaarufu aliporudi kutoka kuipiga Aramu katika Bonde la Chumvi—watu elfu kumi na nane[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya mashahidi wa maandishi na kifungu sambamba katika 1 Mambo ya Nyakati 18:12 vinaelekeza kwenye ‘Edomu’ badala ya ‘Aramu.’
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעַשׂ ... שֵׁם
  choice: akajipatia umaarufu
  rationale: Nahau ya Kiebrania ina maana ya kujipatia jina au sifa. Kiswahili hiki cha kawaida kinawasilisha maana yake wazi bila kudokeza kwamba Daudi alijipa jina halisi.
- source_word: בְּשֻׁבוֹ
  choice: aliporudi
  rationale: Muundo wa kihusishi pamoja na kitenzi-jina unaonyesha wakati; tafsiri hii ni ya moja kwa moja na ya asili katika simulizi la Kiswahili.
- source_word: מֵהַכּוֹתוֹ
  choice: baada ya kuipiga
  rationale: Ingawa kihusishi kina maana ya kurudi kutoka kwenye tendo hilo, katika Kiswahili ‘baada ya’ huonyesha kwa kawaida tendo lililotangulia. ‘Kuipiga’ huhifadhi nguvu ya נכה bila kufafanua kupita kiasi namna ya ushindi.
- source_word: אֶת אֲרָם
  choice: Aramu
  rationale: Maandishi ya WLC yanataja Aramu. Jina hilo limehifadhiwa badala ya kutumia ‘Siria’ au kulipanua kuwa ‘Waaramu.’
- source_word: בְּגֵיא מֶלַח
  choice: katika Bonde la Chumvi
  rationale: Hili ni jina la mahali, na ‘katika’ linawakilisha kwa kawaida kihusishi ב katika muktadha huu.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: watu elfu kumi na nane
  rationale: Kiebrania kinatoa idadi bila nomino. ‘Watu’ imeongezwa ili sentensi iwe kamili na ya kawaida kwa Kiswahili, bila kuwalazimisha wote waitwe askari.
theological_decisions:
- issue: Utambulisho wa adui aliyepigwa
  choice: Aramu katika maandishi makuu, huku Edomu ikitajwa katika tanbihi
  alternative: Edomu katika maandishi makuu
  rationale: Maandishi ya Kimasora ya 2 Samweli 8:13 yanasema ‘Aramu,’ kwa hiyo usomaji huo umefuatwa. Hata hivyo, baadhi ya mashahidi wa maandishi na kifungu sambamba cha 1 Mambo ya Nyakati 18:12 vinaelekeza kwa ‘Edomu’; tofauti hiyo muhimu imehifadhiwa wazi katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. ‘Akajipatia umaarufu’ ni ya sasa na ya kawaida kuliko tafsiri halisi ‘akajifanyia jina,’ huku ‘kuipiga Aramu’ ikihifadhi lugha fupi ya kijeshi ya chanzo.
