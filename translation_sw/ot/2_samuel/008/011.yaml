base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/011.yaml
  text: King David also dedicated them to Yahweh[b][a], along with the silver and the gold that he had dedicated from all the nations that he had subdued.
translation:
  language: sw
  text: Mfalme Daudi pia akaviweka vitu hivyo[b] wakfu kwa Yahweh, pamoja na fedha na dhahabu ambazo alikuwa amekwisha kuweka wakfu kutoka katika mataifa yote aliyokuwa ameyatiisha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyoyashinda.” Kitenzi cha Kiebrania kinaweza kumaanisha kuyaweka mataifa chini ya mamlaka kwa kutumia nguvu.
    reason: lexical_alternative
  - marker: b
    text: “Vitu hivyo” vinarejelea vitu vilivyotajwa katika mstari uliotangulia.
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: pia
  rationale: Inaonyesha kuwa tendo hili linaongezwa kwa habari ya mstari uliotangulia.
- source_word: אֹתָם
  choice: vitu hivyo
  rationale: Kiwakilishi hicho kinarejelea vitu vilivyotajwa katika mstari uliotangulia; Kiswahili kinahitaji ngeli iwe wazi ili sentensi iwe ya kawaida.
- source_word: הִקְדִּישׁ
  choice: akaviweka ... wakfu
  rationale: Usemi ‘kuweka wakfu’ unaeleweka kwa urahisi na unahifadhi maana ya kutenga mali kwa ajili ya Mungu.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Mfalme Daudi
  rationale: Huu ndio mpangilio wa kawaida wa cheo na jina katika Kiswahili.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Inalihifadhi jina la agano יהוה kama jina binafsi, huku kihusishi ‘kwa’ kikionyesha kuwa vitu viliwekwa wakfu kwa ajili yake.
- source_word: עִם
  choice: pamoja na
  rationale: Inaunganisha vitu hivyo na fedha na dhahabu kwa Kiswahili cha kawaida.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: fedha na dhahabu
  rationale: Majina haya ya vitu hayahitaji viwakilishi vya uainisho katika Kiswahili; tafsiri hii ni ya asili na sahihi.
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: aliyokuwa ameiweka wakfu
  rationale: Muundo huu unaonyesha kuwa fedha na dhahabu hiyo ilikuwa tayari imewekwa wakfu kabla ya tendo linalosimuliwa sasa.
- source_word: מִכָּל הַגּוֹיִם
  choice: kutoka kwa mataifa yote
  rationale: ‘Kutoka kwa’ huonyesha chanzo, na ‘mataifa’ linafaa katika muktadha huu wa kisiasa na kijeshi.
- source_word: אֲשֶׁר כִּבֵּשׁ
  choice: aliyoyatiisha
  rationale: ‘Kutiisha’ huhifadhi maana ya kuyaweka mataifa chini ya mamlaka kwa nguvu bila kulazimisha dhana ya kuyamiliki kabisa.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Maana ya הקדיש kuhusu mali
  choice: kuweka wakfu
  alternative: kutakasa; kutenga kuwa takatifu
  rationale: Katika muktadha wa fedha, dhahabu, na vitu vya thamani vilivyotolewa kwa Mungu, ‘kuweka wakfu’ huonyesha kutengwa kwa matumizi yake bila kudokeza kwamba mali yenyewe ilitakaswa kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘kuweka wakfu’ umetumiwa kwa uthabiti, na viambishi vya ngeli vimewekwa ili marejeo ya vitu, fedha na dhahabu yawe wazi.
