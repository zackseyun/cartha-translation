  yaml_path: translation/ot/2_samuel/008/016.yaml
  text: And Joab son of Zeruiah was over the army[b][a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: sw
  text: Yoabu mwana wa Seruya alikuwa mkuu wa jeshi[a], naye Yehoshafati mwana wa Ahiludi alikuwa mwandishi wa kumbukumbu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa msimamizi wa jeshi.”
    reason: lexical_alternative
  - marker: b
    text: “Mwandishi wa kumbukumbu” alikuwa afisa wa kifalme aliyehifadhi kumbukumbu na kumjulisha mfalme mambo; pia inaweza kutafsiriwa “katibu wa mfalme.”
    reason: cultural_note
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: alikuwa mkuu wa jeshi
  rationale: Katika orodha ya maafisa, עַל huonyesha mamlaka au usimamizi. Kiswahili ‘mkuu wa jeshi’ kinaeleza kwa kawaida kuwa Yoabu alikuwa na mamlaka juu ya jeshi, bila kutumia muundo usio wa kawaida ‘juu ya jeshi.’
- source_word: מַזְכִּיר
  choice: mwandishi wa kumbukumbu
  rationale: Neno hili linataja cheo cha afisa wa kifalme aliyehusika na kumbukumbu na kuwasilisha mambo kwa mfalme. ‘Mwandishi wa kumbukumbu’ ni wazi kwa msomaji wa sasa na halidokezi tu uandishi wa vitabu vya historia.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika utambulisho wa ukoo, tafsiri ya moja kwa moja na ya kawaida ni ‘mwana wa.’
- source_word: וְ / וִ
  choice: na / naye
  rationale: Viunganishi vinaendeleza orodha rahisi ya maafisa; ‘naye’ hufanya sentensi ya Kiswahili isomeke kwa ufasaha huku ikihifadhi uhusiano wa sentensi za Kiebrania.
- source_word: יוֹאָב / צְרוּיָה / יְהוֹשָׁפָט / אֲחִילוּד
  choice: Yoabu / Seruya / Yehoshafati / Ahiludi
  rationale: Majina yamenukuliwa kwa maumbo yanayotambulika katika matumizi ya kawaida ya Biblia ya Kiswahili.
