base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/010.yaml
  text: Then Toi sent Joram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Toi; and in his hand were articles of silver, articles of gold[b], and articles of bronze.
translation:
  language: sw
  text: Ndipo Toi akamtuma mwanawe Yoramu kwa Mfalme Daudi ili amuulize hali yake na kumbariki[a], kwa sababu Daudi alikuwa amepigana na Hadadezeri na kumshinda; kwa maana Hadadezeri alikuwa katika vita na Toi. Yoramu alikuwa amebeba[b] vitu vya fedha, vitu vya dhahabu, na vitu vya shaba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika muktadha huu, “kumbariki” kunaweza pia kumaanisha “kumpongeza.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mkononi mwake vilikuwa,” yaani, alikuwa amevileta pamoja naye.
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Ndipo ... akamtuma
  rationale: Kauli hii inaendeleza simulizi kwa tukio linalofuata; “Ndipo” ni ya kawaida katika Kiswahili na inadumisha mfuatano huo.
- source_word: תֹּעִי
  choice: Toi
  rationale: Jina limetoholewa moja kwa moja kutoka umbo la Kiebrania katika kitabu cha Samweli.
- source_word: יוֹרָם בְּנוֹ
  choice: mwanawe Yoramu
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unaonyesha wazi kwamba Yoramu ni mwana wa Toi.
- source_word: לִשְׁאָל לוֹ לְשָׁלוֹם
  choice: ili amuulize hali yake
  rationale: Nahau ya Kiebrania inamaanisha kuulizia amani au hali njema ya mtu; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: וּלְבָרֲכוֹ
  choice: na kumbariki
  rationale: “Kumbariki” inadumisha maana ya msingi ya ברך, ingawa katika muktadha huu wa ujumbe wa kifalme inaweza pia kuhusisha kumpongeza.
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: kwa sababu Daudi alikuwa amepigana na Hadadezeri na kumshinda
  rationale: Kiambishi ב kinaonyesha upinzani katika vita, na נכה hapa hueleza ushindi wa kijeshi. Jina “Daudi” limerudiwa ili kuondoa utata wa viwakilishi katika Kiswahili.
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעִי הָיָה הֲדַדְעָזֶר
  choice: Kwa maana Hadadezeri alikuwa akipigana vita na Toi
  rationale: Hili linaeleza kwa Kiswahili cha kawaida usemi wa Kiebrania uliofinyangwa, “mtu wa vita vya Toi,” bila kuongeza dai kwamba alikuwa tu shujaa wa vita.
- source_word: וּבְיָדוֹ הָיוּ
  choice: Yoramu alikuwa amebeba
  rationale: Kihalisi ni “mkononi mwake vilikuwa.” Muktadha unaonyesha kwamba Yoramu alikuwa amevileta; jina limetajwa ili kuepuka utata wa kiwakilishi.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב וּכְלֵי נְחֹשֶׁת
  choice: vitu vya fedha, vitu vya dhahabu na vitu vya shaba
  rationale: כְּלִי ni neno pana linaloweza kumaanisha chombo, kifaa au kitu. “Vitu” hakifungi maana kwa aina moja isiyotajwa; “shaba” ni neno la kawaida la Kiswahili kwa נחשת katika muktadha huu.
theological_decisions:
- issue: Maana ya ברך katika ujumbe wa kidiplomasia
  choice: kumbariki
  alternative: kumpongeza
  rationale: Maana ya msingi ya neno la Kiebrania imedumishwa katika matini, huku maana inayowezekana ya kupongeza ikielezwa katika tanbihi bila kuamua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa heshima na wa kisasa. Sentensi ndefu ya Kiebrania imegawanywa ili isomeke kwa urahisi bila kupoteza uhusiano wa kisababishi.
