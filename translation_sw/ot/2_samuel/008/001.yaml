translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na hadhi inayofaa Maandiko. ‘Metheg-ama’ imehifadhiwa katika matini kuu ili kutolazimisha tafsiri isiyo na uhakika; tanbihi inaeleza maana halisi na ushahidi wa kifungu sambamba.
