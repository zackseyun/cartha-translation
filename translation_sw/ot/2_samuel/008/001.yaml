base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/001.yaml
  text: And after this[a], David struck the Philistines and subdued them, and David took Metheg-ammah from the hand of the Philistines.
translation:
  language: sw
  text: Baada ya hayo, Daudi akawapiga Wafilisti na kuwatiisha, kisha Daudi akaitwaa Metheg-ama[a] kutoka mikononi mwa Wafilisti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “hatamu ya mji mama,” usemi ambao maana yake si wazi. Huenda ni nahau inayomaanisha mamlaka juu ya mji mkuu. Linganisha 1 Mambo ya Nyakati 18:1, panaposema “Gathi na miji yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Inaonyesha mfuatano wa simulizi kwa Kiswahili cha kawaida bila kutafsiri וַיְהִי kwa namna ngumu ya neno kwa neno.
- source_word: וַיַּךְ
  choice: akawapiga
  rationale: Inahifadhi maana halisi ya נכה, ‘kupiga,’ huku kitenzi kinachofuata kikieleza matokeo ya kijeshi.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili.
- source_word: וַיַּכְנִיעֵם
  choice: na kuwatiisha
  rationale: Hiphil ya כנע ina maana ya kuwafanya wawe chini ya mamlaka; ‘kuwatiisha’ ni ya kawaida na inafaa katika muktadha wa kijeshi na kisiasa.
- source_word: וַיִּקַּח
  choice: akaitwaa
  rationale: לקח humaanisha ‘kutwaa/kuchukua.’ ‘Akaitwaa’ inaonyesha kuchukuliwa kutoka katika udhibiti wa adui bila kuamua mapema kama kitu kinachotajwa ni mji au mamlaka.
- source_word: מֶתֶג הָאַמָּה
  choice: Metheg-ama
  rationale: Usemi wa Kiebrania ni mgumu na unaweza kuwa taswira yenye maana ya kisiasa au jina linalofanana na jina la mahali. Uandishi wa sauti katika matini kuu unahifadhi utata huo; tafsiri halisi na uwezekano wa maana vinaelezwa katika tanbihi.
- source_word: מִיַּד
  choice: kutoka mikononi mwa
  rationale: Inahifadhi nahau ya Kiebrania ‘kutoka mkononi mwa,’ inayomaanisha kuondolewa katika milki au mamlaka ya Wafilisti, kwa Kiswahili kinachoeleweka.
