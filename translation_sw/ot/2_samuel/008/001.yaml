  - severity: medium
    issue: 'Tanbihi: ''vijiji vyake'' kwa ''daughter towns'''
    rationale: Miji binti ni makazi au miji tegemezi, si lazima vijiji. 'Miji yake' huepuka kupunguza ukubwa au hadhi ya makazi hayo.
  - severity: low
    issue: 'Tanbihi: ''mji mkuu'''
