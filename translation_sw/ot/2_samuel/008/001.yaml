  naturalness: Kiswahili ni cha kawaida na kinaeleweka. 'Kutoka mikononi mwa Wafilisti' ni nahau ya asili katika Kiswahili, ingawa Kiebrania kina umoja 'mkono.' Muundo wa sentensi moja wenye kiunganishi ni mtiririko wa karibu zaidi na simulizi ya chanzo.
  terminology: '''Metheg-ama'' huhifadhi utata wa מֶתֶג הָאַמָּה vizuri katika matini kuu. Tanbihi inahitaji kurekebishwa kidogo: ''mji mama'' ni tafsiri ya karibu ya אַמָּה, na ''miji yake'' hufaa zaidi kuliko ''vijiji vyake'' kwa ''daughter towns'' katika 1 Mambo ya Nyakati 18:1.'
