  text: וַ/יָּ֨שֶׂם דָּוִ֤ד נְצִבִים֙ בַּ/אֲרַ֣ם דַּמֶּ֔שֶׂק וַ/תְּהִ֤י אֲרָם֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נוֹשְׂאֵ֣י מִנְחָ֑ה וַ/יֹּ֤שַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and Aram became servants to David, bringing tribute[c][b]. And Yahweh gave David victory wherever he went.
translation:
  language: sw
  text: Daudi akaweka vikosi vya kijeshi katika Aramu ya Damasko[a]. Aramu ikawa watumishi wa Daudi, wakileta ushuru[b]. Naye Yahweh akampa Daudi ushindi kila alikokwenda[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika Siria ya Damasko.” Jina la Kiebrania ni “Aramu.”
    reason: lexical_alternative
  - marker: b
    text: Au “wakileta zawadi” au “wakibeba ushuru.” Neno la Kiebrania linaweza kumaanisha zawadi, sadaka, au ushuru; hapa huenda linamaanisha malipo ya nchi iliyotiishwa.
    reason: lexical_alternative
  - marker: c
    text: Au “Yahweh akamwokoa” au “akamkomboa Daudi kila alikokwenda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: akaweka
  rationale: Kitenzi שׂים hapa kina maana ya kuweka au kusimika; “akaweka” ni cha kawaida na kinafaa kwa vikosi vya kijeshi.
- source_word: נְצִבִים
  choice: vikosi vya ulinzi
  rationale: Katika muktadha wa ushindi na udhibiti wa eneo, neno hili linaelekea kumaanisha askari au vituo vya kijeshi vilivyowekwa kudhibiti nchi. Tafsiri hii ni wazi kwa msomaji wa Kiswahili, ingawa maana ya maafisa waliowekwa inawezekana.
- source_word: בַּאֲרַם דַּמֶּשֶׂק
  choice: katika Aramu ya Damasko
  rationale: Inahifadhi jina la Kiebrania “Aramu” na kueleza dola ya Waaramu yenye kitovu chake Damasko.
- source_word: וַתְּהִי אֲרָם לְדָוִד לַעֲבָדִים
  choice: Aramu ikawa chini ya Daudi kama watumishi
  rationale: Maneno haya yanaonyesha kutiishwa kisiasa. “Kama watumishi” huhifadhi uhusiano wa kileksia na עֲבָדִים, huku “chini ya Daudi” kikifanya maana ya kitaifa ieleweke kwa kawaida.
- source_word: נוֹשְׂאֵי מִנְחָה
  choice: wanaoleta ushuru
  rationale: מִנְחָה linaweza kuwa zawadi, sadaka, au ushuru. Katika uhusiano huu wa nchi iliyotiishwa, ushuru ndio maana inayofaa zaidi.
- source_word: וַיֹּשַׁע
  choice: akampa ... ushindi
  rationale: Hifili ya ישׁע inaeleza tendo la Yahweh la kumwokoa au kumkomboa Daudi vitani; “akampa ushindi” huwasilisha maana hiyo kwa uwazi katika muktadha wa kijeshi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limehifadhiwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: kila alikokwenda
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha mafanikio katika kila mahali Daudi alikokwenda bila kuubana kwa safari za kijeshi pekee.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja; “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya עֲבָדִים katika muktadha wa utiifu wa kisiasa
  choice: kama watumishi
  alternative: watu waliotawaliwa au watumwa
  rationale: Hapa neno linahusu taifa lililotiishwa na kulipa ushuru. “Watumishi” huhifadhi maana ya msingi bila kuingiza moja kwa moja dhana ya utumwa wa mtu binafsi.
- issue: Maana ya וַיֹּשַׁע katika vita
  choice: akampa Daudi ushindi
  alternative: akamwokoa au akamkomboa Daudi
  rationale: Tafsiri iliyochaguliwa inaonyesha wazi matokeo ya tendo la Yahweh katika kampeni za kijeshi, huku tanbihi ikihifadhi uwezekano wa tafsiri iliyo karibu zaidi na umbo la kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa simulizi umetumiwa kwa vitenzi vya mfululizo. “Vikosi vya ulinzi” ni wazi kuliko mkopo usiozoeleka, na tanbihi zinahifadhi tofauti muhimu za kileksia na kitheolojia.
