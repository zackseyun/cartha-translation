base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: sw
  text: Waaramu wa Damasko[a] wakaja kumsaidia Hadadezeri[b], mfalme wa Soba, naye Daudi akawapiga Waaramu elfu ishirini na mbili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Waaramu” ni watu wa Aramu; hapa linawarejelea Waaramu wa eneo au ufalme wa Damasko. Katika desturi nyingine jina hili limetafsiriwa “Washami” au “Syria.”
    reason: lexical_alternative
  - marker: b
    text: Katika baadhi ya vifungu na tafsiri, jina Hadadezeri huandikwa “Hadarezeri.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבֹא
  choice: wakaja
  rationale: Kitenzi בוא katika mfululizo wa simulizi kina maana ya kuja au kufika; “wakaja” ni usemi wa kawaida wa Kiswahili na hulingana na “Waaramu” kama jina la watu.
- source_word: אֲרַם דַּמֶּשֶׂק
  choice: Waaramu wa Damasko
  rationale: Kirai hiki kinataja dola au watu wa Kiaramu waliokuwa na kitovu chao Damasko. “Waaramu wa Damasko” ni cha asili zaidi katika Kiswahili kuliko “Aramu ya Damasko,” huku kikiepuka jina la baadaye la kisiasa “Syria.”
- source_word: לַעְזֹר
  choice: kumsaidia
  rationale: עזר humaanisha kusaidia; kiambishi cha yambwa “-m-” kinaonyesha wazi kuwa msaada ulielekezwa kwa Hadadezeri.
- source_word: לַהֲדַדְעֶזֶר
  choice: Hadadezeri
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili kutoka umbo la Kiebrania katika mstari huu; umbo jingine, Hadarezeri, limehifadhiwa katika tanbihi.
- source_word: מֶלֶךְ צוֹבָה
  choice: mfalme wa Soba
  rationale: Muundo wa Kiebrania ni cheo kinachomfafanua Hadadezeri; “mfalme wa Soba” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וַיַּךְ
  choice: akawaua
  rationale: Katika muktadha huu wa vita, נכה pamoja na idadi ya waliopigwa inaonyesha kuwaua. “Akawaua” huwasilisha matokeo kwa Kiswahili wazi bila kutumia usemi usio wa kawaida.
- source_word: בַּאֲרָם
  choice: wa Aramu
  rationale: Baada ya idadi ya watu waliouawa, kirai hiki kinaonyesha kundi walilotoka. “Wa Aramu” huhifadhi jina la asili la dola au watu badala ya kulibadili kuwa Syria.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: watu elfu ishirini na mbili
  rationale: אִישׁ hapa huhesabu watu katika jeshi. “Watu elfu ishirini na mbili” ni Kiswahili cha kawaida na hakiongezi neno “askari,” ambalo limeeleweka tu kutokana na muktadha.
