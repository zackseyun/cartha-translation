translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha simulizi na chenye heshima. “Waaramu wa Damasko” limetumiwa mwanzoni kwa ufasaha wa Kiswahili, huku “wa Aramu” likihifadhi jina la dola au jamii katika sehemu ya pili. Majina Damasko, Hadadezeri, na Soba yametoholewa kwa mazoea ya Kiswahili.
