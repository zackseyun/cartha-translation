base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/024.yaml
  text: But the king said[a], “Let him turn aside to his own house, and let him not see my face.” So Absalom turned aside to his own house and did not see the king’s face.
translation:
  language: sw
  text: Lakini mfalme akasema, “Na arudi nyumbani kwake, wala asiuone uso wangu.[a]” Basi Absalomu akarudi nyumbani kwake, wala hakuuona uso wa mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kuona uso wangu” na “kuona uso wa mfalme” ni nahau inayomaanisha kuwa mbele ya mtu au kupewa nafasi ya kuonana naye.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסֹּב / וַיִּסֹּב (סבב)
  choice: arudi / akarudi
  rationale: Katika muktadha huu, kitenzi kinaelekeza Absalomu aondoke na kuelekea nyumbani kwake. ‘Kurudi’ ni Kiswahili cha kawaida kinachoonyesha kuelekezwa mbali na uwepo wa mfalme, huku marudio ya kitenzi yakihifadhiwa katika amri na utekelezaji wake.
- source_word: בֵּיתוֹ
  choice: nyumbani kwake
  rationale: Ingawa maana ya msingi ni ‘nyumba yake,’ ‘nyumbani kwake’ ni usemi wa asili zaidi kwa Kiswahili unapozungumzia mahali anapoelekea mtu.
- source_word: וּפָנַי ... לֹא יִרְאֶה
  choice: wala asiione uso wangu
  rationale: Neno ‘uso’ limehifadhiwa ili kubeba nahau ya Kiebrania kuhusu kufika mbele ya mtu au kupewa nafasi ya kuonana naye. Umbo ‘asiione’ linawasilisha nguvu ya amri.
- source_word: וּפְנֵי הַמֶּלֶךְ לֹא רָאָה
  choice: wala hakuuona uso wa mfalme
  rationale: Marudio ya nahau ya ‘uso’ yamehifadhiwa kama katika Kiebrania, yakisisitiza kwamba Absalomu hakuruhusiwa kuonana na mfalme.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa מֶלֶךְ.
- source_word: אַבְשָׁלוֹם
  choice: Absalomu
  rationale: Umbo hili la jina limezoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: וַיֹּאמֶר
  choice: Lakini mfalme akasema
  rationale: 'Kiunganishi ‘Lakini’ kinaonyesha tofauti ya kimuktadha: ingawa Absalomu amerudishwa, mfalme bado anamnyima nafasi ya kuonana naye.'
theological_decisions:
- issue: Nahau halisi ‘kuona uso wangu / uso wa mfalme’ dhidi ya tafsiri ya ufafanuzi kuhusu kuingia mbele ya mfalme au kupewa nafasi ya kuonana naye
  choice: Kuhifadhi nahau hiyo katika matini kuu
  alternative: ‘asije mbele yangu’ / ‘hakuruhusiwa kuonana na mfalme’
  rationale: Kuhifadhi ‘uso’ kunadumisha taswira na marudio ya Kiebrania bila kufafanua kupita kiasi maana ya kijamii ya kauli hiyo. Tanbihi inaeleza maana ya nahau.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa kawaida na unaoeleweka, huku marudio ya Kiebrania na nahau ya ‘kuona uso’ vikihifadhiwa.
