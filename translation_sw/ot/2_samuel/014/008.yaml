  text: Then the king said to the woman[a], “Go to your house, and I will give orders concerning you.”
translation:
  language: sw
  text: Kisha mfalme akamwambia yule mwanamke, “Nenda nyumbani kwako, nami nitatoa maagizo yanayokuhusu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitatoa maagizo kwa ajili yako” au “kuhusu shauri lako.” Kihusishi cha Kiebrania kinaweza kueleweka kwa zaidi ya njia moja; maana ni kwamba mfalme atatoa maagizo yanayohusu hali yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, na kiambishi -mw- humtambulisha mwanamke kuwa ndiye aliyeambiwa.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya nomino hii yenye kibainishi; katika Kiswahili muktadha unatosha kuonyesha kuwa ni mfalme anayejulikana.
- source_word: הָאִשָּׁה
  choice: yule mwanamke
  rationale: Katika muktadha huyu ni mwanamke wa Tekoa, si “mke.” “Yule mwanamke” humrejelea kwa wazi na kwa lugha ya kawaida.
- source_word: לְכִי
  choice: Nenda
  rationale: Ni amri ya umoja wa kike ya הלך; “Nenda” ni amri ya asili na iliyo wazi katika Kiswahili.
- source_word: לְבֵיתֵךְ
  choice: nyumbani kwako
  rationale: Ingawa בַּיִת inaweza kuwa “nyumba,” usemi “nyumbani kwako” ni wa asili zaidi katika Kiswahili kwa maana ya kwenda kwenye makao ya mtu.
- source_word: וַאֲנִי
  choice: nami
  rationale: Kiwakilishi cha nafsi kimesisitizwa katika Kiebrania. “Nami” huhifadhi utofautishaji huo kwa ufupi na kwa ufasaha.
- source_word: אֲצַוֶּה
  choice: nitatoa maagizo
  rationale: Piel ya צוה humaanisha kuamuru au kutoa maagizo. Usemi huu unafaa kauli ya kifalme na kuhifadhi mamlaka yake.
- source_word: עָלָיִךְ
  choice: kuhusu jambo lako
  rationale: Pamoja na צוה, עַל inaweza kutaja mtu au jambo ambalo maagizo yanahusu. “Kuhusu jambo lako” huwasilisha kwamba mfalme atashughulikia kesi yake bila kudai wazi kuwa maagizo hayo yatakuwa kwa faida yake.
