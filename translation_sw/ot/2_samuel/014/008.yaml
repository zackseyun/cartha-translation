translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo ni wa masimulizi ya kawaida; kauli ya mfalme ina mamlaka bila kuwa nzito au ya kizamani. Utata wa עָלָיִךְ umehifadhiwa kwa “kuhusu jambo lako,” badala ya kuamua moja kwa moja kuwa ni “kwa ajili yako” au “kwa niaba yako.”
