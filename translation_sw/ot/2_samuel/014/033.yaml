base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/033.yaml
  text: Then Joab came to the king and told him[a], and he called for Absalom. So he came to the king and bowed himself with his face to the ground before the king[b], and the king kissed Absalom.
translation:
  language: sw
  text: Kisha Yoabu akaja kwa mfalme, akamweleza. Mfalme akamwita Absalomu[a]. Absalomu akaja kwa mfalme, akainama kifudifudi mbele ya mfalme, uso wake ukigusa ardhi. Kisha mfalme akambusu Absalomu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamwita Absalomu aje mbele yake.”
    reason: lexical_alternative
  - marker: b
    text: Huenda busu la mfalme linaonyesha upatanisho au kurejeshwa katika kibali chake, ingawa maandishi yanasema tu kwamba alimbusu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא יוֹאָב אֶל־הַמֶּלֶךְ
  choice: Yoabu akaenda kwa mfalme
  rationale: Kitenzi בוא kinaonyesha mwendo kuelekea kwa mfalme; “akaenda kwa” ni Kiswahili cha kawaida katika usimulizi huu.
- source_word: וַיַּגֶּד לוֹ
  choice: na kumweleza
  rationale: Hifili ya נגד humaanisha kumwambia au kumpa taarifa mtu; “kumweleza” ni fupi na ya asili katika muktadha.
- source_word: וַיִּקְרָא אֶל־אַבְשָׁלוֹם
  choice: Mfalme akamwita Absalomu
  rationale: Katika muktadha wa baraza la kifalme, קרא אל ina maana ya kumwita mtu aje mbele ya mfalme. Muktadha unaonyesha kwamba mfalme ndiye anayemwita Absalomu, ingawa Kiebrania hakitaji nomino ya mtendaji tena.
- source_word: וַיִּשְׁתַּחוּ לוֹ
  choice: akamsujudia kifudifudi
  rationale: Umbo la שחה linaeleza kuinama kabisa kwa heshima. “Kumsujudia kifudifudi” linaonyesha tendo hilo la heshima kwa mfalme bila kulifanya lazima kuwa ibada ya kidini.
- source_word: עַל־אַפָּיו אַרְצָה
  choice: uso wake ukiwa chini mpaka ardhini
  rationale: Hii inawakilisha picha halisi ya Kiebrania, “juu ya uso wake kuelekea ardhini,” kwa Kiswahili kinachoeleweka.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: mbele ya mfalme
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya לפני katika mazingira ya kifalme.
- source_word: וַיִּשַּׁק הַמֶּלֶךְ לְאַבְשָׁלוֹם
  choice: mfalme akambusu Absalomu
  rationale: Tafsiri ya moja kwa moja inadumisha tendo lililotajwa bila kuongeza katika maandishi maana yake inayowezekana ya upatanisho.
theological_decisions:
- issue: Maana ya busu la mfalme
  choice: Kutaja tu kwamba mfalme alimbusu Absalomu
  alternative: Kulieleza moja kwa moja kuwa ishara rasmi ya upatanisho au kurejeshwa katika kibali
  rationale: Huenda busu hilo linaashiria upatanisho au kibali kilichorejeshwa, lakini Kiebrania kinasema tu kwamba mfalme alimbusu Absalomu. Maandishi makuu yanadumisha upeo huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa kisimulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili. Maana ya busu haijaongezwa katika maandishi makuu.
