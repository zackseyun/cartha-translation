base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/020.yaml
  text: In order to change the course of the matter[a], your servant Joab did this thing. But my lord is wise, with the wisdom of the angel of God[b], to know all that is in the land.
translation:
  language: sw
  text: “Ili kubadili sura ya jambo[a], mtumishi wako Yoabu amefanya jambo hili. Lakini bwana wangu ana hekima kama hekima ya malaika wa Mungu, hata kujua yote yaliyo katika nchi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno kwa neno, “kugeuza uso wa jambo.” Pia yaweza kutafsiriwa “kuligeuza jambo” au “kubadili jinsi jambo linavyoonekana.”
    reason: lexical_alternative
  - marker: b
    text: Au “duniani.” Katika muktadha huu, huenda “nchi” inarejelea ufalme au eneo linalotawaliwa kuliko ulimwengu wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַעֲבוּר
  choice: Ili
  rationale: Kiunganishi hiki kinaonyesha kusudi, na “ili” ni njia ya kawaida na wazi ya kulieleza kwa Kiswahili.
- source_word: סַבֵּב אֶת־פְּנֵי הַדָּבָר
  choice: kubadili sura ya jambo hili
  rationale: Neno kwa neno, nahau hii inahusu kugeuza au kubadili “uso wa jambo.” “Kubadili sura ya jambo” inadumisha sitiari ya Kiebrania huku ikieleweka kuwa ni kulibadili jinsi linavyoonekana au linavyoshughulikiwa.
- source_word: עָשָׂה ... אֶת־הַדָּבָר הַזֶּה
  choice: amefanya jambo hili
  rationale: Hili ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi pamoja na yambwa lake.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika lugha ya heshima mbele ya mfalme, “mtumishi” huwasilisha unyenyekevu unaokusudiwa bila kusisitiza hali ya utumwa ambayo si hoja kuu hapa.
- source_word: וַאדֹנִי
  choice: Lakini bwana wangu
  rationale: Kiunganishi kinaonyesha badiliko lenye utofauti mdogo kutoka maelezo ya Yoabu kwenda kwenye sifa kwa mfalme; “lakini” linafaa katika mtiririko huu.
- source_word: חָכָם
  choice: ana hekima
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza sifa ya kuwa mwenye hekima katika sentensi hii.
- source_word: כְּחָכְמַת מַלְאַךְ הָאֱלֹהִים
  choice: kama hekima ya malaika wa Mungu
  rationale: “Kama” inadumisha ulinganisho ulio wazi. Kiswahili “malaika wa Mungu” hakilazimishi kuwa ni malaika fulani mmoja wala kudhoofisha lugha ya Kiebrania.
- source_word: לָדַעַת
  choice: hata kujua
  rationale: Kirai hiki kinaonyesha kiwango au matokeo ya hekima ya mfalme; “hata kujua” ni cha asili na kinaunganisha wazo hilo vizuri.
- source_word: כָּל אֲשֶׁר בָּאָרֶץ
  choice: yote yaliyo katika nchi
  rationale: Katika muktadha wa kifalme, “nchi” huenda inarejelea eneo au ufalme unaotawaliwa, huku tanbihi ikihifadhi uwezekano mpana wa “dunia.”
theological_decisions:
- issue: Maana ya “malaika wa Mungu”
  choice: Ulinganisho unaosifu hekima na utambuzi wa ajabu wa mfalme
  alternative: Ulinganisho uliotiwa chumvi unaodokeza maarifa yaliyo kama ya kimungu
  rationale: Muundo wa Kiebrania ni wa ulinganisho katika lugha ya heshima ya kifalme. Tafsiri inadumisha ulinganisho huo bila kudai kwamba Daudi alikuwa malaika, alikuwa na asili ya kimungu, au alijua kila kitu bila mipaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Sitiari ya Kiebrania imehifadhiwa kwa usemi “sura ya jambo,” huku tanbihi ikifafanua nahau. “Bwana wangu” na “mtumishi wako” zinadumisha mazingira ya heshima mbele ya mfalme.
