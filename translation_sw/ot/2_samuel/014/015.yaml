base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/015.yaml
  text: And now I have come to speak this matter to my lord the king[a], because the people have frightened me. And your servant said, ‘Please let me speak to the king[b]; perhaps the king will do the word of his servant.’
translation:
  language: sw
  text: Na sasa nimekuja kusema jambo hili kwa bwana wangu, mfalme, kwa sababu watu wamenitia hofu.[a] Mtumishi wako akasema, ‘Naomba niseme na mfalme; labda mfalme atatimiza ombi la mtumishi wake wa kike.’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wameniogopesha.” Kitenzi cha Kiebrania kina maana ya kusababisha hofu, si kwamba watu wanamwogopa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “neno la mtumishi wake wa kike”; hapa “neno” linaweza kumaanisha ombi lake. Kiambishi “wake” kinamrejelea mfalme kwa nafsi ya tatu, ingawa anasemeshwa moja kwa moja.
    reason: textual_or_grammatical_clarity
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inahifadhi kiunganishi ו pamoja na alama ya wakati עתה, huku ikitambulisha maelezo ya sasa kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר בָּאתִי לְדַבֵּר
  choice: nimekuja kusema
  rationale: Muundo wa wakati timilifu unaonyesha kuwa amekuja na sasa yupo mbele ya mfalme kwa kusudi la kusema.
- source_word: אֶל הַמֶּלֶךְ אֲדֹנִי
  choice: na bwana wangu mfalme
  rationale: Kitenzi cha Kiswahili ‘kusema’ kwa kawaida huambatana na ‘na’ kwa mtu anayesemeshwa; usemi huu unahifadhi pia heshima ya kifalme.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: דבר hapa ni shauri au suala analoliwasilisha, si neno moja tu.
- source_word: כִּי יֵרְאֻנִי הָעָם
  choice: kwa sababu watu wamenitia hofu
  rationale: Muundo wa piel wa ירא una maana ya kusababisha hofu; tafsiri hii haudokezi kwamba watu ndio wanaomwogopa mwanamke.
- source_word: וַתֹּאמֶר שִׁפְחָתְךָ
  choice: Mtumishi wako akasema
  rationale: Ni namna ya unyenyekevu ya kujitaja katika mazingira ya kifalme. ‘Mtumishi’ ni ya asili na yenye hadhi katika Kiswahili cha sasa.
- source_word: אֲדַבְּרָה נָּא אֶל הַמֶּלֶךְ
  choice: Tafadhali, acha nizungumze na mfalme
  rationale: ‘Acha nizungumze’ linaonyesha dhamira au ombi la cohortative, na ‘tafadhali’ linaakisi נָא.
- source_word: אוּלַי
  choice: labda
  rationale: Linahifadhi uwezekano usio na uhakika bila kuufanya kuwa hakika.
- source_word: יַעֲשֶׂה הַמֶּלֶךְ אֶת דְּבַר
  choice: mfalme atatimiza ombi
  rationale: Katika muktadha huu, ‘kutimiza ombi’ ni Kiswahili cha kawaida kwa kufanya lile alilosema mtumishi, bila kuongeza kwamba mfalme ataliridhia kwa hakika.
- source_word: אֲמָתוֹ
  choice: la mtumishi wake wa kike
  rationale: Inahifadhi jinsia ya nomino אָמָה na kiambishi cha nafsi ya tatu ‘wake,’ badala ya kukibadili kimyakimya kuwa ‘wako.’
