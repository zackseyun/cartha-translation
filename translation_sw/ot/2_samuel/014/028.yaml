  text: Basi Absalomu akaishi Yerusalemu kwa miaka miwili kamili, lakini hakuona uso wa mfalme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “na hakuona uso wa mfalme.” Nahau hii ya Kiebrania mara nyingi hudokeza kutopata hadhira binafsi mbele ya mfalme au kuonana naye.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: akaishi
  rationale: Kitenzi ישׁב hapa kinaeleza kukaa au kuishi mahali kwa muda; “akaishi” ni Kiswahili cha kawaida na cha asili katika muktadha huu.
- source_word: אַבְשָׁלוֹם
  choice: Absalomu
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בִּירוּשָׁלִַם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali hapo katika Kiswahili.
- source_word: שְׁנָתַיִם יָמִים
  choice: kwa miaka miwili kamili
  rationale: Muundo wa Kiebrania, kihalisi “miaka miwili, siku,” unaonyesha kipindi kizima cha miaka miwili; “miaka miwili kamili” huwasilisha nguvu hiyo ya nahau kwa uwazi.
- source_word: וּפְנֵי הַמֶּלֶךְ
  choice: uso wa mfalme
  rationale: Tafsiri hii huhifadhi taswira halisi ya Kiebrania, ambayo katika muktadha ina maana ya kupewa fursa ya kufika mbele ya mfalme.
- source_word: לֹא רָאָה
  choice: hakuuona
  rationale: Huwasilisha moja kwa moja kauli hasi ya Kiebrania na kukubaliana kisarufi na “uso wa mfalme.”
