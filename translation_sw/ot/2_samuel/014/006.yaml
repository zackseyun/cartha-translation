  yaml_path: translation/ot/2_samuel/014/006.yaml
  text: And your servant had two sons[a], and the two of them fought in the field, and there was no one to separate them[b]; then the one struck the other and killed him.
translation:
  language: sw
  text: Nami, mtumishi wako wa kike, nilikuwa na wana wawili[a]. Wote wawili walipigana shambani, wala hapakuwa na mtu wa kuwatenganisha[b]. Basi mmoja akampiga mwenzake na kumuua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kijakazi wako.” Neno la Kiebrania ni namna ya unyenyekevu ya mwanamke kujitaja anapozungumza na mfalme.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “hapakuwa na mwokozi kati yao,” yaani, mtu wa kuingilia kati na kuwatenganisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשִׁפְחָתְךָ
  choice: Nami, mtumishi wako wa kike
  rationale: שִׁפְחָה ni mtumishi au kijakazi; hapa ni namna ya unyenyekevu ya mwanamke kujitaja mbele ya mfalme. Kiswahili cha sasa kinahitaji pia kuonyesha jinsia yake.
- source_word: שְׁנֵי בָנִים
  choice: wana wawili
  rationale: בָנִים hapa inamaanisha watoto wa kiume hasa; “wana wawili” ni tafsiri ya kawaida na sahihi.
- source_word: וַיִּנָּצוּ
  choice: walipigana
  rationale: Kitenzi kinaonyesha ugomvi wenye mapambano; matokeo ya kifo yanaunga mkono “walipigana” kuliko “walibishana.”
- source_word: בַּשָּׂדֶה
  choice: shambani
  rationale: Hutoa maana ya mahali kwa Kiswahili cha kawaida na wazi.
- source_word: וְאֵין מַצִּיל בֵּינֵיהֶם
  choice: wala hapakuwa na mtu wa kuwaamua
  rationale: Ingawa מַצִּיל kihalisi ni mwokozi au mkombozi, katika muktadha wa mapigano ni mtu anayeingilia kati na kuwatenganisha.
- source_word: וַיַּכּוֹ הָאֶחָד אֶת הָאֶחָד
  choice: mmoja akampiga mwenzake
  rationale: נכה ni kupiga; usemi huu unabaki wa kawaida bila kubainisha silaha au idadi ya mapigo.
- source_word: וַיָּמֶת אֹתוֹ
  choice: na kumuua
  rationale: Muundo wa מות pamoja na kiambishi cha yambwa una maana ya kusababisha afe; “kumuua” huwasilisha matokeo hayo kwa uwazi.
