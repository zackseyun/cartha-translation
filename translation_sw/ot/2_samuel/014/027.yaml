lexical_decisions:
- source_word: וַיִּוָּלְדוּ לְאַבְשָׁלוֹם
  choice: Absalomu akazaliwa
  rationale: Muundo wa Kiswahili ‘akazaliwa’ hutumika kwa njia ya kawaida kuonyesha kwamba mtu alipata watoto, huku ukihifadhi uhusiano wa uzazi unaoonyeshwa na לְ.
- source_word: שְׁלוֹשָׁה בָנִים
  choice: wana watatu
  rationale: בָנִים hapa humaanisha wana wa kiume, kwa hiyo ‘wana’ ni sahihi kuliko neno la jumla ‘watoto’.
- source_word: וּבַת אַחַת
  choice: na binti mmoja
  rationale: Huhifadhi wazi jinsia na idadi ya mtoto aliyetajwa.
- source_word: וּשְׁמָהּ תָּמָר
  choice: ambaye jina lake lilikuwa Tamari
  rationale: Kiambishi cha kike kinamrejelea binti aliyetajwa; ‘jina lake lilikuwa’ ni Kiswahili cha kawaida na wazi.
- source_word: תָּמָר
  choice: Tamari
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: הִיא הָיְתָה אִשָּׁה
  choice: Alikuwa mwanamke
  rationale: Huhifadhi nomino אִשָּׁה badala ya kuifuta, na kiwakilishi cha Kiswahili kinamtambulisha wazi Tamari.
- source_word: יְפַת מַרְאֶה
  choice: mwenye sura nzuri
  rationale: Huwasilisha uzuri wa mwonekano wa nje kwa lugha ya asili na yenye staha katika Kiswahili.
