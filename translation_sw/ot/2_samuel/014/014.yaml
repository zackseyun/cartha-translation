  text: כִּי מ֣וֹת נָמ֔וּת וְ/כַ/מַּ֨יִם֙ הַ/נִּגָּרִ֣ים אַ֔רְצָ/ה אֲשֶׁ֖ר לֹ֣א יֵאָסֵ֑פוּ וְ/לֹֽא יִשָּׂ֤א אֱלֹהִים֙ נֶ֔פֶשׁ וְ/חָשַׁב֙ מַֽחֲשָׁב֔וֹת לְ/בִלְתִּ֛י יִדַּ֥ח מִמֶּ֖/נּוּ נִדָּֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/014.yaml
  text: For we must surely die and are like water poured out on the ground[a], which cannot be gathered up again. Yet God does not take away life[b], but devises plans so that the banished one will not remain banished from him.
translation:
  language: sw
  text: Kwa maana hakika tutakufa; sisi ni kama maji yaliyomwagika ardhini, ambayo hayawezi kukusanywa tena. Lakini Mungu haondoi uhai[a]; badala yake, hufanya mipango ili aliyefukuzwa asibaki amefukuzwa kutoka kwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu hampendelei mtu.” Kifungu hiki cha Kiebrania ni kigumu, na wengine hukielewa kwa njia tofauti.
    reason: alternative_reading
  - marker: b
    text: Au, “ili aliyefukuzwa asifukuzwe kutoka kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaunganisha kauli hii na hoja iliyotangulia kwa kuonyesha sababu ya ombi la mwanamke.
- source_word: מוֹת נָמוּת
  choice: hakika tutakufa
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi unasisitiza uhakika wa kifo; Kiswahili hiki ni cha kawaida na huhifadhi msisitizo huo.
- source_word: וְכַמַּיִם הַנִּגָּרִים אַרְצָה
  choice: sisi ni kama maji yaliyomwagika ardhini
  rationale: Taswira inaonyesha kwamba kifo hakiwezi kutenguliwa, kama maji yaliyomwagika ambayo hayawezi kurudishwa.
- source_word: אֲשֶׁר לֹא יֵאָסֵפוּ
  choice: ambayo hayawezi kukusanywa tena
  rationale: Hueleza wazi kutowezekana kwa kuyakusanya maji hayo baada ya kumwagika.
- source_word: וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  choice: Lakini Mungu haondoi uhai
  rationale: Katika muktadha wa kifo na kurejeshwa kwa aliyefukuzwa, נֶפֶשׁ inaeleweka kama uhai wa mtu. Neno 'Lakini' linaonyesha utofauti kati ya hali ya wanadamu na tendo la Mungu.
- source_word: וְחָשַׁב מַחֲשָׁבוֹת
  choice: badala yake, hufanya mipango
  rationale: Muundo wa maneno yenye mzizi mmoja unaonyesha kupanga kwa makusudi; tafsiri hii ni ya kawaida na yenye heshima katika Kiswahili.
- source_word: לְבִלְתִּי יִדַּח
  choice: ili ... asibaki amefukuzwa
  rationale: Huhifadhi wazo la hali ya kufukuzwa na kusudi la kuibadili, bila kulazimisha zaidi namna ya urejesho.
- source_word: מִמֶּנּוּ נִדָּח
  choice: aliyefukuzwa ... kutoka kwake
  rationale: Huhifadhi umoja wa nomino na uhusiano unaoonyeshwa na kiwakilishi cha Kiebrania, huku kutokuwa wazi kikamilifu kuhusu rejea yake kukibaki.
theological_decisions:
- issue: Maana ya וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  choice: Mungu haondoi uhai
  alternative: Mungu hampendelei mtu
  rationale: Kifungu hiki cha Kiebrania ni kigumu. Maana iliyochaguliwa inafaa mtiririko wa hoja kuhusu kifo na kurejeshwa kwa aliyefukuzwa. Hata hivyo, maana ya kutompendelea mtu inawezekana na imehifadhiwa katika tanbihi.
- issue: Nguvu ya לְבִלְתִּי יִדַּח ... נִדָּח
  choice: ili aliyefukuzwa asibaki amefukuzwa kutoka kwake
  alternative: ili aliyefukuzwa asifukuzwe kutoka kwake
  rationale: Tafsiri kuu inaonyesha hali inayoendelea ya uhamisho na kusudi la Mungu la kuikomesha; mbadala hufuata kwa ukaribu zaidi muundo wa kitenzi tendwa wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni wazi kwa msomaji wa kawaida, huku taswira ya maji, uhakika wa kifo, na utata wa vifungu vigumu vya Kiebrania vikihifadhiwa.
