base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/025.yaml
  text: In all Israel there was not a man as handsome as Absalom[a], so highly praised; from the sole of his foot to the crown of his head there was no blemish in him.
translation:
  language: sw
  text: Katika Israeli yote, hakukuwa na mwanamume aliyesifiwa sana kwa uzuri wake kama Absalomu[a]. Kuanzia unyayo wa mguu wake hadi utosi wake, hakuwa na dosari yoyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenye kusifiwa sana.” Maneno ya Kiebrania yanaonyesha kiwango cha juu sana cha sifa kwa uzuri wa Absalomu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְאַבְשָׁלוֹם
  choice: kama Absalomu
  rationale: Muundo huu unamtambulisha Absalomu kama kipimo cha ulinganisho; Kiswahili cha kawaida huonyesha hilo kwa ‘kama Absalomu’ bila kuongeza neno la wakati lisilokuwapo katika Kiebrania.
- source_word: לֹא הָיָה אִישׁ יָפֶה
  choice: hapakuwa na mwanamume mwenye sura nzuri
  rationale: 'Hii inaeleza ulinganisho wa kiwango cha juu: hakuna mwanamume katika Israeli aliyelingana na Absalomu kwa uzuri. ‘Mwenye sura nzuri’ ni usemi wa asili na wenye heshima kwa uzuri wa mwanamume.'
- source_word: בְּכָל יִשְׂרָאֵל
  choice: Katika Israeli yote
  rationale: Inahifadhi maana ya eneo linalohusisha taifa lote.
- source_word: לְהַלֵּל מְאֹד
  choice: naye alisifiwa sana
  rationale: Inawasilisha kwa Kiswahili cha kawaida kiwango kikubwa cha sifa alizopewa Absalomu, huku tanbihi ikihifadhi uwezekano wa kuelewa usemi huo kama kustahili sifa nyingi.
- source_word: מִכַּף רַגְלוֹ
  choice: Tangu unyayo wa mguu wake
  rationale: כַּף inapohusishwa na mguu humaanisha unyayo; ‘tangu’ huanzisha vizuri msemo unaotaja mwili mzima.
- source_word: וְעַד קָדְקֳדוֹ
  choice: hadi utosi wa kichwa chake
  rationale: קָדְקֹד ni sehemu ya juu kabisa ya kichwa; ‘utosi wa kichwa’ ni tafsiri sahihi na ya kawaida.
- source_word: לֹא הָיָה בוֹ מוּם
  choice: hakuwa na dosari yoyote
  rationale: מוּם hapa ni kasoro au dosari ya kimwili. ‘Dosari yoyote’ hudumisha maana ya kutokuwapo kabisa kwa kasoro katika maelezo ya mwonekano wake.
