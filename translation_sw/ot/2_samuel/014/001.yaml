  text: Joab son of Zeruiah knew that the king’s heart was toward Absalom[a].
translation:
  language: sw
  text: Yoabu mwana wa Seruya alijua kwamba moyo wa mfalme ulimwelekea Absalomu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mfalme alimtamani Absalomu”; usemi wa Kiebrania ni mfupi na unaweza pia kumaanisha kwa ujumla, “moyo wa mfalme ulikuwa umeelekezwa kwa Absalomu.” Wengine wameuelewa kwa maana hasi, “moyo wa mfalme ulikuwa dhidi ya Absalomu,” ingawa muktadha unaofuata unaunga mkono zaidi mwelekeo chanya.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: alijua
  rationale: Kitenzi hiki kinaendeleza simulizi na hapa maana yake ya moja kwa moja ni kwamba Yoabu alijua; hakuna haja ya kuongeza kiashiria cha wakati kama “basi” au “sasa.”
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: Yoabu mwana wa Seruya
  rationale: Majina yametoholewa kwa matumizi ya kawaida ya Biblia ya Kiswahili, na muundo wa Kiebrania wa uhusiano umetafsiriwa kwa Kiswahili cha asili.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linatanguliza yaliyokuwa yanajulikana na Yoabu.
- source_word: לֵב הַמֶּלֶךְ
  choice: moyo wa mfalme
  rationale: “Moyo” huhifadhi taswira ya Kiebrania ya hali ya ndani, nia, au hisia za mfalme bila kuibana iwe “akili” pekee.
- source_word: עַל
  choice: ulikuwa ukimwelekea
  rationale: Usemi huu wa mwelekeo unahifadhi ufupi na utata wa Kiebrania bila kuamua moja kwa moja kama mfalme alimtamani, alimjali, au alikuwa dhidi yake.
- source_word: אַבְשָׁלוֹם
  choice: Absalomu
  rationale: Jina limetoholewa kwa umbo linalotambulika katika mapokeo ya Kiswahili.
theological_decisions:
- issue: Utata wa mtazamo wa mfalme kwa Absalomu
  choice: moyo wa mfalme ulikuwa ukimwelekea Absalomu
  alternative: mfalme alimtamani Absalomu; moyo wa mfalme ulikuwa dhidi ya Absalomu
  rationale: Kiebrania ni kifupi na hakisemi wazi kama mwelekeo huo ulikuwa wa upendo, hamu, kujali, au uhasama. Tafsiri kuu inadumisha utata huo, ingawa muktadha unaofuata unaunga mkono zaidi mwelekeo chanya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ulikuwa ukimwelekea” ni usemi wa kueleweka unaohifadhi mwelekeo wa sitiari ya Kiebrania na utata wake; alama ya tanbihi [a] imewekwa katika maandishi.
