  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה וְ/לָ֧/מָּה חָשַׁ֛בְתָּה כָּ/זֹ֖את עַל עַ֣ם אֱלֹהִ֑ים וּ/מִ/דַּבֵּ֨ר הַ/מֶּ֜לֶךְ הַ/דָּבָ֤ר הַ/זֶּה֙ כְּ/אָשֵׁ֔ם לְ/בִלְתִּ֛י הָשִׁ֥יב הַ/מֶּ֖לֶךְ אֶֽת נִדְּחֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/013.yaml
  text: Then the woman said[a], “Why then have you planned such a thing against the people of God? For in speaking this word, the king is like one who is guilty[b], because the king has not brought back his banished one.”
translation:
  language: sw
  text: Kisha yule mwanamke akasema, “Kwa nini basi umepanga[a] jambo kama hili dhidi ya watu wa Mungu? Kwa kusema neno hili, mfalme ni kama mtu mwenye hatia[b], kwa kuwa mfalme hajamrudisha yule aliyefukuzwa kutoka kwake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umewaza” au “umekusudia.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, hukumu aliyotoa mfalme inamweka katika hali ya mtu mwenye hatia kwa sababu hajamrudisha yule aliyefukuzwa kutoka kwake.
    reason: alternative_reading
lexical_decisions:
- source_word: חָשַׁבְתָּה
  choice: umepanga
  rationale: Kitenzi חשב kinaweza kumaanisha kuwaza, kupanga au kukusudia. Katika lawama hii, “umepanga” linaonyesha hatua au msimamo wa makusudi, huku tanbihi ikihifadhi uwezekano wa maana ya “umewaza” au “umekusudia.”
- source_word: כָּזֹאת
  choice: jambo kama hili
  rationale: Kirai hiki cha kawaida katika Kiswahili kinaonyesha aina ya tendo linalodokezwa na mfano wa mwanamke na kuhifadhi nguvu ya swali lake la lawama.
- source_word: עַל עַם אֱלֹהִים
  choice: dhidi ya watu wa Mungu
  rationale: Katika muundo huu עַל lina maana ya uelekeo wenye madhara. “Dhidi ya” linaonyesha kuwa kutomrudisha aliyefukuzwa kunawaathiri watu wa Mungu.
- source_word: וּמִדַּבֵּר הַמֶּלֶךְ הַדָּבָר הַזֶּה
  choice: Kwa kusema neno hili
  rationale: 'Kiambishi מִ pamoja na kitenzi-jina kinaeleweka kwa maana ya sababu au njia: kwa kutamka hukumu hiyo, mfalme anajitia katika hali ya mwenye hatia.'
- source_word: כְּאָשֵׁם
  choice: ni kama mtu mwenye hatia
  rationale: Kiambishi כְּ kinaweka ulinganisho. Tafsiri hii haibadili usemi huo kuwa tangazo la moja kwa moja kwamba mfalme ana hatia.
- source_word: לְבִלְתִּי
  choice: kwa kuwa ... haja-
  rationale: Muundo huu unaonyesha msingi wa shtaka. “Kwa kuwa” unaunganisha sababu hiyo kwa Kiswahili cha kawaida na wazi.
- source_word: הָשִׁיב
  choice: hajamrudisha
  rationale: Katika Hifili, שוב humaanisha kumrudisha mtu au kitu. Hapa inamhusu mtu aliyeko uhamishoni, hivyo “kumrudisha” ni sahihi na halisi.
- source_word: נִדְּחוֹ
  choice: yule aliyefukuzwa kutoka kwake
  rationale: Nomino ya kitenzi נדח humaanisha mtu aliyefukuzwa au kusukumwa mbali. “Kutoka kwake” kinaonyesha uhusiano unaowakilishwa na kiambishi cha nafsi bila kumtaja Absalomu moja kwa moja.
theological_decisions:
- issue: Upeo wa usemi “watu wa Mungu” katika shtaka la mwanamke
  choice: Kuhifadhi usemi mpana “watu wa Mungu”
  alternative: Kutafsiri kuwa “Israeli” au kuufanya usemi huo umhusu Absalomu na nyumba ya kifalme pekee
  rationale: Kiebrania kinasema wazi “watu wa Mungu.” Ingawa katika muktadha jambo hilo linamhusu Absalomu na ukoo wa kifalme, tafsiri haipaswi kufupisha kwa kimya upeo wa usemi wa mwanamke.
- issue: Ikiwa mfalme anatangazwa moja kwa moja kuwa na hatia
  choice: 'Kuhifadhi ulinganisho: “ni kama mtu mwenye hatia”'
  alternative: “Mfalme ana hatia”
  rationale: Kiambishi כְּ kinaonyesha ulinganisho. Maneno ya mfalme mwenyewe yanamweka katika nafasi ya mtu mwenye hatia, lakini tafsiri haipaswi kuondoa mvutano wa kimatamshi uliomo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kisha yule mwanamke akasema” linafuata mtiririko wa simulizi; “jambo kama hili,” “dhidi ya,” na “kwa kuwa” ni miundo ya sasa na ya kawaida. Tafsiri inahifadhi marudio ya “mfalme” yaliyomo katika Kiebrania badala ya kuweka kiwakilishi katika sehemu ya pili.
