base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/017.yaml
  text: Then your servant said[a], ‘Please let the word of my lord the king bring rest, for my lord the king is like the angel of God, to hear the good and the evil[b]. And may Yahweh your God be with you.’
translation:
  language: sw
  text: Ndipo mjakazi wako akasema, “Tafadhali, neno la bwana wangu mfalme na liwe la kuleta utulivu, kwa maana bwana wangu mfalme ni kama malaika wa Mungu[a], mwenye kutambua mema na mabaya[b]. Na Yahweh, Mungu wako, awe pamoja nawe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mjumbe wa Mungu.” Neno la Kiebrania linaweza kumaanisha malaika au mjumbe.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kusikia mema na mabaya”; hapa usemi huo unaweza kumaanisha kupambanua au kuhukumu kati ya mema na mabaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחָתְךָ
  choice: mjakazi wako
  rationale: Nomino hii humtaja mtumishi wa kike. “Mjakazi wako” huhifadhi jinsia ya msemaji na namna yake ya kujinyenyekeza mbele ya mfalme.
- source_word: יִהְיֶה נָּא
  choice: tafadhali ... na lilete
  rationale: Muundo wa ombi pamoja na נָא unaonyesha dua ya heshima; “tafadhali” na kiambishi cha kusihi “na” vinawasilisha sauti hiyo kwa Kiswahili cha kawaida.
- source_word: דְּבַר אֲדֹנִי הַמֶּלֶךְ
  choice: neno la bwana wangu mfalme
  rationale: דָּבָר inaweza kuwa neno, jambo, au uamuzi. “Neno” huhifadhi picha ya Kiebrania huku muktadha ukionyesha kuwa ni tamko au uamuzi wa mfalme.
- source_word: לִמְנוּחָה
  choice: na lilete utulivu
  rationale: Neno hili huonyesha pumziko, faraja, au hali ya kutulia. “Kuleta utulivu” ni ya asili katika Kiswahili na inafaa kwa athari inayotarajiwa ya uamuzi wa mfalme.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: kama malaika wa Mungu
  rationale: מַלְאָךְ linaweza kumaanisha mjumbe au malaika. Katika ulinganisho huu wa kumtukuza mfalme kwa uwezo wa ajabu wa kupambanua, “malaika” linafaa zaidi, huku uwezekano wa “mjumbe” ukihifadhiwa katika tanbihi.
- source_word: לִשְׁמֹעַ הַטּוֹב וְהָרָע
  choice: mwenye kutambua mema na mabaya
  rationale: Kihalisi ni “kusikia mema na mabaya,” lakini שׁמע hapa lina maana ya kimahakama ya kusikiliza kwa uelewa na kupambanua. “Kutambua” huwasilisha maana hiyo kwa Kiswahili cha kawaida; usemi halisi umeonyeshwa katika tanbihi.
- source_word: וַיהוָה אֱלֹהֶיךָ
  choice: Yahweh Mungu wako
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja kuwa “Yahweh,” na uhusiano wa umilikaji katika “Mungu wako” umehifadhiwa.
- source_word: יְהִי עִמָּךְ
  choice: na awe pamoja nawe
  rationale: Huu ni usemi wa baraka wenye nguvu ya kusihi. “Na awe pamoja nawe” ni muundo wa asili na wenye heshima katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina יהוה moja kwa moja. “Yahweh” hulihifadhi kama jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya מַלְאָךְ katika ulinganisho na mfalme
  choice: malaika
  alternative: mjumbe
  rationale: Muktadha unamsifu mfalme kwa uwezo wa juu wa kutambua mema na mabaya, hivyo maana ya kiumbe wa mbinguni ina uwezekano mkubwa. Hata hivyo, maana pana ya “mjumbe” haijaondolewa na imeonyeshwa katika tanbihi.
- issue: Maana ya “kusikia mema na mabaya”
  choice: kutambua mema na mabaya
  alternative: kusikia mema na mabaya
  rationale: Usemi huo unaweza kuonyesha usikilizaji wa kimahakama na upambanuzi. Tafsiri kuu inatoa maana inayoeleweka, huku tanbihi ikihifadhi sura halisi na mvutano wa usemi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa mazungumzo ya kifalme lakini kinachoeleweka kwa msomaji wa kawaida. “Mjakazi” huhifadhi utambulisho wa msemaji wa kike na lugha yake ya kujinyenyekeza; “bwana wangu mfalme” huhifadhi mtindo wa heshima wa maandishi ya chanzo.
