  text: Then go to the king and speak to him in this way[a]. And Joab put the words in her mouth.
translation:
  language: sw
  text: Kisha nenda kwa mfalme, ukazungumze naye hivi. Kisha Yoabu akaweka maneno kinywani mwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai cha Kiebrania “kuweka maneno kinywani mwake” ni nahau inayomaanisha kwamba Yoabu alimpa maneno ya kusema.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאת
  choice: Kisha nenda
  rationale: Kitenzi hiki katika mfuatano wa maagizo kina nguvu ya amri kwa mwanamke; “Kisha nenda” kinaonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: אֶל־הַמֶּלֶךְ
  choice: kwa mfalme
  rationale: אֶל inaonyesha kuelekea kwa mtu; “kwa mfalme” ni usemi wa asili unaohifadhi maana hiyo.
- source_word: וְדִבַּרְתְּ אֵלָיו
  choice: ukazungumze naye
  rationale: דבר אֶל humaanisha kuzungumza na mtu; umbo la “uka-” linaunganisha kwa kawaida agizo hili na kwenda kwa mfalme.
- source_word: כַּדָּבָר הַזֶּה
  choice: hivi
  rationale: Kirai hiki kinaonyesha namna au maudhui ya maneno ambayo mwanamke alipaswa kusema; “hivi” ni kifupi, cha asili, na hakilazimishi tafsiri ya דָבָר kuwa neno moja tu.
- source_word: וַיָּשֶׂם
  choice: akaweka
  rationale: שׂים maana yake ya msingi ni kuweka; hapa imehifadhiwa ndani ya nahau ya Kiebrania.
- source_word: אֶת־הַדְּבָרִים
  choice: maneno hayo
  rationale: Wingi huu unarejelea hotuba maalumu ambayo Yoabu alimpa; “maneno hayo” yanaonyesha rejeo hilo kwa uwazi.
- source_word: בְּפִיהָ
  choice: kinywani mwake
  rationale: Tafsiri hii inahifadhi picha halisi ya nahau ya Kiebrania badala ya kuibadilisha moja kwa moja kuwa maelezo.
