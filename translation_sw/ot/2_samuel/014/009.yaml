base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/009.yaml
  text: Then the woman from Tekoa said to the king[a], “On me, my lord the king, be the guilt, and on my father’s house; but the king and his throne are innocent.”
translation:
  language: sw
  text: Ndipo mwanamke kutoka Tekoa akamwambia mfalme, “Hatia[a] na iwe juu yangu, bwana wangu mfalme, na juu ya nyumba ya baba yangu; lakini mfalme na kiti chake cha enzi hawana hatia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uovu,” “lawama,” au “matokeo ya kosa.” Neno la Kiebrania linaweza kumaanisha kosa, hatia yake, au wajibu na matokeo yanayotokana nalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקוֹעִית
  choice: mwanamke kutoka Tekoa
  rationale: Kivumishi cha mahali kinamtambulisha kwa asili yake; usemi huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: עָלַי
  choice: juu yangu
  rationale: Inahifadhi msisitizo wa kirai kilichotangulizwa na wazo la kujitwika wajibu.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Inahifadhi namna ya heshima ya kumtaja mfalme bila kufanya lugha iwe ya kizamani kupita kiasi.
- source_word: הֶעָוֺן
  choice: hatia
  rationale: Katika muktadha huu wa wajibu wa kisheria na kimaadili, “hatia” inaeleza vyema kosa linalohesabiwa, huku tanbihi ikihifadhi upana wa neno la Kiebrania.
- source_word: וְעַל בֵּית אָבִי
  choice: na juu ya nyumba ya baba yangu
  rationale: Inahifadhi sitiari ya Kiebrania ya “nyumba ya baba,” inayoweza kuhusisha jamaa au ukoo wenye wajibu wa pamoja.
- source_word: וְהַמֶּלֶךְ וְכִסְאוֹ
  choice: lakini mfalme na kiti chake cha enzi
  rationale: '“Lakini” inaonyesha utofautishaji uliodokezwa: wajibu uwe kwake na kwa nyumba yake, si kwa mfalme. “Kiti chake cha enzi” kinahifadhi sitiari ya mamlaka au utawala wa kifalme.'
- source_word: נָקִי
  choice: hawana hatia
  rationale: Ni usemi wa asili wa Kiswahili unaofaa muktadha wa kutokuwa na wajibu wa kosa; umoja wa kivumishi cha Kiebrania unawakilishwa kwa muundo wa Kiswahili unaopatana na kiima ambatani.
theological_decisions:
- issue: Kauli ya kumwondolea mfalme wajibu
  choice: mfalme na kiti chake cha enzi hawana hatia
  alternative: mfalme na kiti chake cha enzi hawana lawama
  rationale: Kauli hii inahusu kutokuwa na wajibu katika jambo hili, wala si madai kwamba mfalme hana dhambi au dosari yoyote kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya heshima na ya hadhi, lakini inayoeleweka kwa msomaji wa kawaida. Muundo “hatia na iwe juu yangu” umehifadhi kwa makusudi uzito na msisitizo wa kauli ya Kiebrania.
