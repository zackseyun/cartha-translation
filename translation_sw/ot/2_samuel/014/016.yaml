  yaml_path: translation/ot/2_samuel/014/016.yaml
  text: For the king will hear[b][a], to deliver his servant from the hand of the man who would destroy me and my son together from the inheritance of God.
translation:
  language: sw
  text: Kwa maana mfalme atasikiliza na kumwokoa mtumishi wake wa kike kutoka mkononi mwa mtu anayekusudia kutuangamiza mimi na mwanangu pamoja kutoka katika urithi wa Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Urithi wa Mungu” huenda ni urithi ambao Mungu aliwapa watu wake katika Israeli; usemi huo pia unaweza kumaanisha urithi ulio mali ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Katika muktadha huu neno linaanzisha sababu au msingi wa tumaini la mwanamke, hivyo “Kwa maana” linahifadhi nguvu yake ya ufafanuzi.
- source_word: יִשְׁמַע
  choice: atasikiliza
  rationale: Kitenzi שמע hapa kinadokeza si kusikia sauti tu bali kusikiliza ombi kwa makini; “atasikiliza” ni cha kawaida na kinaendana na hatua ya uokozi inayofuata.
- source_word: לְהַצִּיל
  choice: na kumwokoa
  rationale: Hifili ya נצל humaanisha kuokoa au kukomboa kutoka hatarini. Kiunganishi “na” kinaonyesha matokeo yanayotarajiwa ya mfalme kusikiliza.
- source_word: אֲמָתוֹ
  choice: mtumishi wake wa kike
  rationale: Nomino ya Kiebrania ni ya jinsia ya kike na hapa ni lugha ya mwanamke ya kujishusha mbele ya mfalme; tafsiri hii inaweka wazi maana hiyo.
- source_word: מִכַּף הָאִישׁ
  choice: kutoka mkononi mwa mtu
  rationale: Inahifadhi nahau ya Kiebrania ya “mkono” kwa mamlaka au udhibiti, ambayo pia inaeleweka katika Kiswahili.
- source_word: לְהַשְׁמִיד
  choice: anayetaka kuniangamiza
  rationale: Infinitivu inaonyesha kusudi la uhasama la mtu huyo. “Anayetaka” huwasilisha kusudi hilo kwa Kiswahili cha kawaida bila kupunguza uzito wa kuangamiza.
- source_word: יַחַד
  choice: mimi na mwanangu pamoja
  rationale: “Pamoja” linasisitiza kwamba mama na mwana ndio wanaolengwa wote wawili.
- source_word: מִנַּחֲלַת אֱלֹהִים
  choice: na kutuondoa katika urithi wa Mungu
  rationale: Muundo unaunganisha kuangamizwa kwao na kuondolewa katika urithi. “Urithi wa Mungu” hufuata Kiebrania kwa karibu na kuhifadhi uwezekano wa kumaanisha urithi alioutoa Mungu au urithi ulio mali yake.
theological_decisions:
- issue: Maana ya “urithi wa Mungu”
  choice: Kudumisha usemi “urithi wa Mungu” bila kuufafanua ndani ya mstari
  alternative: “urithi uliotolewa na Mungu” au “mali ya Mungu”
  rationale: Muktadha unahusu kuangamia kwa ukoo na kupoteza nafasi ndani ya Israeli, lakini muundo wa Kiebrania unaweza kueleweka kuwa urithi aliogawa Mungu au kilicho urithi/mali yake. Tafsiri kuu inahifadhi mvutano huo, na tanbihi inaueleza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ya unyenyekevu wa mtoa ombi mbele ya mfalme imehifadhiwa kwa “mtumishi wake wa kike.”
