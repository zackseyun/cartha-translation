  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. Majina ‘Yoabu,’ ‘Geshuri,’ ‘Absalomu,’ na ‘Yerusalemu’ yanafuata maumbo yaliyozoeleka katika matumizi ya Biblia za Kiswahili.
