  text: So Joab arose and went to Geshur[a], and brought Absalom to Jerusalem.
translation:
  language: sw
  text: Basi Yoabu akainuka, akaenda Geshuri, akamleta Absalomu Yerusalemu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamrudisha Absalomu Yerusalemu.” Muktadha unaonyesha kwamba alikuwa anarudi kutoka uhamishoni, ingawa wazo la “kurudi” halijaelezwa wazi katika kitenzi cha Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akaondoka
  rationale: Kitenzi קום katika mfululizo wa simulizi kinaonyesha kuinuka ili kuchukua hatua. ‘Akaondoka’ ni Kiswahili cha kawaida na chenye hadhi katika muktadha huu, bila kuongeza dhana ya safari ndani ya kitenzi chenyewe.
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: הלך katika simulizi kwa kawaida humaanisha ‘kwenda’; ‘akaenda’ ni tafsiri ya moja kwa moja na ya asili.
- source_word: גְּשׁוּרָה
  choice: Geshuri
  rationale: He ya mwelekeo inaonyesha kwenda kuelekea Geshuri. Kwa Kiswahili, jina la mahali baada ya ‘akaenda’ linatosha kuonyesha mwelekeo.
- source_word: וַיָּבֵא
  choice: akamleta
  rationale: Hifili ya בוא humaanisha kusababisha mtu aje, yaani ‘kuleta.’ Kiambishi -m- kinaonyesha kwamba Absalomu ndiye kitu cha moja kwa moja. Wazo la ‘kumrudisha’ linaeleweka katika muktadha lakini halijaelezwa wazi katika kitenzi cha Kiebrania.
- source_word: אֶת אַבְשָׁלוֹם
  choice: Absalomu
  rationale: אֵת ni alama ya yambwa dhahiri, nayo imewakilishwa kimuundo katika ‘akamleta’; jina limetolewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Kwa kuwa ‘kuleta’ huonyesha mwendo kuelekea mahali pa mwisho, Kiswahili kinaweza kutaja ‘Yerusalemu’ moja kwa moja bila kihusishi cha ziada.
- source_word: וַ
  choice: Basi / aka-
  rationale: Waw za mfululizo zinaendeleza matendo ya simulizi. ‘Basi’ mwanzoni na viambishi vya wakati ‘aka-’ vinatoa mtiririko wa kawaida wa simulizi la Kiswahili.
