  text: Mfalme akasema, “Yeyote anayesema nawe, mlete kwangu, naye hatakugusa tena[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatakudhuru tena”; hapa neno la Kiebrania linalomaanisha kugusa linaweza kudokeza kukudhuru au kukushambulia, si mguso wa kawaida tu.
