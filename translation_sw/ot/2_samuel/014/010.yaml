lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Jina lenye kibainishi limetafsiriwa kwa namna ya kawaida ya Kiswahili; katika muktadha huu mhusika tayari anatambulika.
- source_word: הַמְדַבֵּר אֵלַיִךְ
  choice: Yeyote anayesema nawe
  rationale: Kitenzi-shirikishi chenye kibainishi kimetumika kijina, yaani ‘anayesema nawe’; ‘yeyote’ huwasilisha agizo lisilomhusu mtu mmoja tu.
- source_word: וַהֲבֵאתוֹ אֵלַי
  choice: mlete kwangu
  rationale: Hifili ya בוא ina maana ya kumsababisha aje, hivyo ‘mlete’; kiambishi cha kiume umoja kimewakilishwa na ‘-le-’.
- source_word: לֹא יֹסִיף עוֹד
  choice: hatakugusa tena
  rationale: Muundo wa יסף pamoja na עוד unaonyesha tendo kutorudiwa au kutoendelea; ‘tena’ ni usemi wa asili na wazi katika Kiswahili.
- source_word: לָגַעַת בָּךְ
  choice: kukugusa
  rationale: Maana ya msingi ya נגע ni ‘gusa’. Muktadha unaweza kudokeza kumdhuru au kumshambulia, lakini tafsiri kuu inadumisha kitenzi halisi na tanbihi inaeleza upana wake.
