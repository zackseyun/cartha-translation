source:
  edition: WLC
  text: וְ/הִנֵּה֩ קָ֨מָה כָֽל הַ/מִּשְׁפָּחָ֜ה עַל שִׁפְחָתֶ֗/ךָ וַ/יֹּֽאמְרוּ֙ תְּנִ֣י אֶת מַכֵּ֣ה אָחִ֗י/ו וּ/נְמִתֵ֨/הוּ֙ בְּ/נֶ֤פֶשׁ אָחִי/ו֙ אֲשֶׁ֣ר הָרָ֔ג וְ/נַשְׁמִ֖ידָה גַּ֣ם אֶת הַ/יּוֹרֵ֑שׁ וְ/כִבּ֗וּ אֶת גַּֽחַלְתִּ/י֙ אֲשֶׁ֣ר נִשְׁאָ֔רָה לְ/בִלְתִּ֧י שום לְ/אִישִׁ֛/י שֵׁ֥ם וּ/שְׁאֵרִ֖ית עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/007.yaml
  text: And look[a], the whole family has risen up against your servant and said, ‘Give up the one who struck his brother, so that we may put him to death for the life of his brother whom he killed; and we will destroy the heir also.’ Thus they would quench my remaining ember[b], leaving my husband neither name nor remnant on the face of the earth.
translation:
  language: sw
  text: Tazama, ukoo wote umeinuka dhidi yangu, mimi mtumishi wako, ukisema, ‘Mkabidhi huyo aliyempiga ndugu yake, ili tumwue kwa ajili ya uhai wa ndugu yake aliyemuua; nasi tutamwangamiza mrithi pia.’ Kwa kufanya hivyo watalizima kaa langu lililobaki[a], ili mume wangu asibaki na jina wala masalia[b] juu ya uso wa dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kaa langu la mwisho.” Kiebrania kinatumia taswira ya kaa la moto lililobaki kumaanisha tumaini la mwisho la kuendeleza ukoo.
    reason: lexical_alternative
  - marker: b
    text: “Jina wala masalia” humaanisha kwamba kumbukumbu na kizazi cha mumewe havingeendelea duniani; si sifa yake tu iliyokuwa hatarini.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Neno hili la kuvuta fikira limehifadhiwa kwa Kiswahili cha kawaida chenye hadhi.
- source_word: כָל הַמִּשְׁפָּחָה
  choice: ukoo wote
  rationale: Katika muktadha huu מִשְׁפָּחָה ni kundi pana la jamaa lenye wajibu kuhusu damu na urithi; “ukoo” ni sahihi kuliko “familia” ya nyumbani tu.
- source_word: שִׁפְחָתֶךָ
  choice: mimi mtumishi wako
  rationale: Ni rejeo la unyenyekevu la mwanamke anayemwambia mfalme; “mtumishi” ni la asili na halihitaji kutaja jinsia kwa Kiswahili.
- source_word: קָמָה ... עַל
  choice: umeniinukia
  rationale: Muundo huu unaonyesha kujitokeza kwa uhasama dhidi yake, si kusimama tu.
- source_word: תְּנִי
  choice: Mtoe
  rationale: Katika dai hili la kimahakama, kitenzi kinamaanisha kumkabidhi mwana kwa wale wanaotaka kumuua.
- source_word: מַכֵּה אָחִיו
  choice: huyo aliyempiga ndugu yake
  rationale: “Aliyempiga” huhifadhi upana wa נכה na mwendelezo wa simulizi kabla ya sentensi kusema wazi kwamba alimuua.
- source_word: וּנְמִתֵהוּ בְּנֶפֶשׁ אָחִיו
  choice: ili tumwue kwa uhai wa ndugu yake
  rationale: Huhifadhi wazo la kisheria la uhai kulipwa kwa uhai bila kuongeza maelezo yasiyosemwa wazi katika Kiebrania.
- source_word: וְנַשְׁמִידָה גַּם אֶת הַיּוֹרֵשׁ
  choice: nasi tutamwangamiza mrithi pia
  rationale: “Mrithi” hutaja mwana aliyebaki kwa jukumu lake la kurithi, na “kumwangamiza” huhifadhi ukali wa nia ya ukoo.
- source_word: וְכִבּוּ אֶת גַּחַלְתִּי אֲשֶׁר נִשְׁאָרָה
  choice: watalizima kaa langu la moto lililobaki
  rationale: Taswira halisi ya kaa la mwisho lenye moto imehifadhiwa badala ya kufasiriwa moja kwa moja kuwa kizazi au tumaini.
- source_word: שֵׁם וּשְׁאֵרִית
  choice: jina wala mzao aliyesalia
  rationale: “Jina” huhifadhi kumbukumbu na utambulisho wa nyumba, huku “mzao aliyesalia” ikieleza kwa Kiswahili cha kawaida masalia ya ukoo katika muktadha huu.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: juu ya uso wa dunia
  rationale: Huhifadhi nahau na upeo wa usemi wa Kiebrania kwa Kiswahili chenye hadhi.
theological_decisions:
- issue: Je, kifo cha mwana kinawasilishwa kama hukumu rasmi au kisasi cha damu?
  choice: “ili tumwue kwa uhai wa ndugu yake”
  alternative: “ili tumhukumu kifo kwa kumuua ndugu yake”
  rationale: Chanzo kinaonyesha kanuni ya uhai kwa uhai lakini hakitumii hapa neno maalumu la hukumu rasmi; tafsiri haipaswi kuamua zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa urahisi. Kauli ya mwanamke kwa mfalme ina unyenyekevu, na taswira ya kaa la moto imehifadhiwa. Alama za tanbihi zimewekwa kwenye maneno yanayoelezwa, kwa kuwa alama katika safu ya Kiingereza zilionekana kutolingana na maudhui ya tanbihi.
