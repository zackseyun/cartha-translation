base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/005.yaml
  text: The king said to her[a], “What is the matter?” She said, “Indeed, I am a widow[b], and my husband has died.”
translation:
  language: sw
  text: Mfalme akamwambia, “Una shida gani?”[a] Akajibu, “Kwa kweli, mimi ni mjane,[b] na mume wangu amekufa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Una nini?”
    reason: lexical_alternative
  - marker: b
    text: Au, “Ole wangu! Mimi ni mjane.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לָּךְ
  choice: Una shida gani?
  rationale: Nahau hii, ambayo kihalisi ni ‘nini kwako?’, huuliza tatizo au dhiki inayompata mtu. ‘Una shida gani?’ ni Kiswahili cha kawaida na huonyesha kwamba swali linaelekezwa kwake binafsi.
- source_word: אֲבָל
  choice: Kwa kweli
  rationale: Hapa neno hili linaimarisha ukweli wa kauli yake, badala ya kuonyesha upinzani wa kawaida wa ‘lakini’. ‘Kwa kweli’ huhifadhi msisitizo huo.
- source_word: אִשָּׁה אַלְמָנָה
  choice: mimi ni mjane
  rationale: Ingawa Kiebrania kina muundo wa ‘mwanamke mjane’, Kiswahili hutumia kwa kawaida na kwa ukamilifu neno ‘mjane’.
- source_word: וַיָּמָת אִישִׁי
  choice: mume wangu amekufa
  rationale: Katika muktadha huu אִישִׁי humaanisha ‘mume wangu’. ‘Amekufa’ huhifadhi tendo la kifo na matokeo yake ya sasa bila kuligeuza kuwa kauli tuli tu.
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kibainishi; mwanzoni mwa sentensi Kiswahili hakihitaji neno jingine la kuonyesha umaalumu.
- source_word: וַתֹּאמֶר
  choice: Akajibu
  rationale: Ingawa kitenzi chenyewe ni ‘akasema’, katika mfuatano huu ni jibu kwa swali la mfalme. ‘Akajibu’ ni ya asili katika Kiswahili na hudumisha uhusiano wa mazungumzo.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa maandiko. Viunganishi vya ‘aka-’ vinadumisha mfuatano wa matendo ya simulizi. Kauli imewekwa katika lugha rahisi ya kisasa bila kuondoa msisitizo au uwezekano wa maana nyingine wa Kiebrania.
