base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/002.yaml
  text: So Joab sent to Tekoa and took from there a wise woman[a], and he said to her, “Please pretend to be mourning, and please put on mourning clothes, and do not anoint yourself with oil[d][c][b], but be like a woman who has been mourning for the dead many days.”
translation:
  language: sw
  text: Basi Yoabu akatuma watu huko Tekoa, akamchukua kutoka huko mwanamke mwenye hekima. Akamwambia, “Tafadhali, jifanye unaomboleza[a]; vaa mavazi ya maombolezo, wala usijipake mafuta[c]. Uwe kama mwanamke ambaye kwa siku nyingi amekuwa akimwombolezea mtu aliyekufa.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “omboleza” au “jiweke katika hali ya mwombolezaji.” Kitenzi cha Kiebrania humaanisha “kuomboleza,” lakini muktadha unaonyesha kwamba Yoabu anamwagiza aigize hali hiyo kama sehemu ya mpango wake.
    reason: lexical_alternative
  - marker: c
    text: Kutopaka mafuta kulikuwa ishara ya huzuni; kwa kawaida mafuta yalitumiwa katika kujitunza na kujiburudisha.
    reason: cultural_note
  - marker: d
    text: Kwa neno halisi zaidi, “kama mwanamke anayeomboleza juu ya mtu aliyekufa kwa siku nyingi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּקוֹעָה
  choice: Tekoa
  rationale: Jina la mahali limetoholewa kwa namna inayotambulika katika Kiswahili bila kulitafsiri.
- source_word: אִשָּׁה חֲכָמָה
  choice: mwanamke mwenye hekima
  rationale: Huhifadhi maana ya msingi ya חֲכָמָה, ambayo katika muktadha huu pia inadokeza uwezo wa kutekeleza kwa ustadi ombi la kushawishi.
- source_word: הִתְאַבְּלִי נָא
  choice: Tafadhali, jifanye kuwa unaomboleza
  rationale: Kitenzi chenyewe humaanisha kuomboleza, lakini muktadha unaonyesha kwamba Yoabu anamwagiza achukue sura na mwenendo wa mwombolezaji katika mpango uliotungwa.
- source_word: בִגְדֵי אֵבֶל
  choice: mavazi ya maombolezo
  rationale: Ni usemi wa kawaida na wenye heshima unaoonyesha mavazi yanayovaliwa wakati wa maombolezo.
- source_word: וְאַל תָּסוּכִי שֶׁמֶן
  choice: wala usijipake mafuta
  rationale: סוך pamoja na שֶׁמֶן hurejelea kupaka mafuta mwilini kwa kujitunza au kujiburudisha; Kiswahili hiki ni cha kawaida na hakidokezi lazima tendo la ibada.
- source_word: זֶה יָמִים רַבִּים מִתְאַבֶּלֶת עַל מֵת
  choice: ambaye amekuwa akiomboleza kwa siku nyingi kwa sababu ya mtu aliyekufa
  rationale: Muundo wa ‘amekuwa akiomboleza’ unaonyesha hali inayoendelea kwa muda, na ‘mtu aliyekufa’ huhifadhi umoja usio bainifu wa מֵת.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akatuma watu kwenda Tekoa’ huweka wazi kwa njia ya kawaida kwamba agizo lilitekelezwa kupitia wajumbe, huku ‘akamleta’ likihifadhi Yoabu kama mwanzilishi wa tendo. Lugha ya kuomboleza imewekwa wazi bila kuondoa tofauti kati ya maana ya moja kwa moja ya kitenzi na maigizo yanayoonyeshwa na muktadha.
