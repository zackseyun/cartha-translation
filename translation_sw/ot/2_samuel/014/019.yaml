  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ הֲ/יַ֥ד יוֹאָ֛ב אִתָּ֖/ךְ בְּ/כָל זֹ֑את וַ/תַּ֣עַן הָ/אִשָּׁ֣ה וַ/תֹּ֡אמֶר חֵֽי נַפְשְׁ/ךָ֩ אֲדֹנִ֨/י הַ/מֶּ֜לֶךְ אִם אִ֣שׁ לְ/הֵמִ֣ין וּ/לְ/הַשְׂמִ֗יל מִ/כֹּ֤ל אֲשֶׁר דִּבֶּר֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּֽי עַבְדְּ/ךָ֤ יוֹאָב֙ ה֣וּא צִוָּ֔/נִי וְ/ה֗וּא שָׂ֚ם בְּ/פִ֣י שִׁפְחָֽתְ/ךָ֔ אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/019.yaml
  text: Then the king said[a], “Is the hand of Joab with you in all this?” And the woman answered and said, “As your soul lives, my lord the king, no one can turn to the right or to the left from anything that my lord the king has spoken, for your servant Joab himself commanded me[b], and he himself put all these words into the mouth of your female servant.”
translation:
  language: sw
  text: Kisha mfalme akasema, “Je, Yoabu amehusika nawe katika haya yote?” Yule mwanamke akajibu, “Hakika kama uishivyo, bwana wangu mfalme,[a] hakuna mtu anayeweza kugeuka kulia wala kushoto katika jambo lolote ambalo bwana wangu mfalme amesema.[b] Kwa maana mtumishi wako Yoabu ndiye aliyeniamuru, naye ndiye aliyeweka maneno haya yote kinywani mwa mjakazi wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “Kama nafsi yako iishivyo.” Hii ni kauli ya kiapo ya Kiebrania yenye maana ya “Hakika kama uishivyo.”
    reason: lexical_alternative
  - marker: b
    text: Usemi “kugeuka kulia wala kushoto” ni nahau ya Kiebrania yenye maana ya kupotoka kutoka, kupinga, au kukwepa yale ambayo mfalme amesema.
    reason: cultural_note
lexical_decisions:
- source_word: הֲיַד יוֹאָב אִתָּךְ
  choice: Je, Yoabu amehusika nawe
  rationale: Neno la Kiebrania ‘mkono’ hapa linaonyesha kuhusika au kuwa wakala wa jambo. Kiswahili cha moja kwa moja ‘mkono wa Yoabu uko pamoja nawe’ kingekuwa kigumu na kingeweza kupotosha; ‘amehusika nawe’ huwasilisha maana katika Kiswahili cha kawaida.
- source_word: בְּכָל זֹאת
  choice: katika haya yote
  rationale: Kifungu hiki kinarejelea mpango na mambo yote yaliyozungumziwa, na tafsiri hii ni ya kawaida na pana vya kutosha.
- source_word: חֵי נַפְשְׁךָ
  choice: Hakika kama uishivyo
  rationale: Ni kauli ya kiapo inayothibitisha ukweli wa maneno yanayofuata. Tafsiri hii ni ya asili kwa Kiswahili huku tanbihi ikihifadhi taswira halisi ya ‘nafsi yako’.
- source_word: אִם אִישׁ לְהֵמִין וּלְהַשְׂמִיל
  choice: hakuna mtu anayeweza kugeuka kulia wala kushoto
  rationale: Muundo wa kiapo wenye אִם una maana hasi hapa. Taswira ya kuelekea kulia au kushoto imehifadhiwa, kwa kuwa inaeleweka katika muktadha na inaelezwa katika tanbihi.
- source_word: מִכֹּל אֲשֶׁר דִּבֶּר
  choice: kutoka katika lolote ambalo ... amesema
  rationale: Kihusishi kinaonyesha kupotoka kutoka katika maneno ya mfalme. ‘Lolote ... amesema’ ni Kiswahili cha kawaida kinachohifadhi upana wa kauli.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika mazingira ya kifalme neno hili linaonyesha mtu aliye chini ya mamlaka ya mfalme; ‘mtumishi’ linafaa kuliko neno linalosisitiza hali ya utumwa.
- source_word: צִוָּנִי
  choice: aliyeniamuru
  rationale: Kitenzi kinaonyesha amri yenye mamlaka, si ushauri wa kawaida.
- source_word: שָׂם בְּפִי
  choice: aliyeweka ... kinywani mwa
  rationale: Taswira ya Kiebrania ya kumpa mtu maneno ya kusema imehifadhiwa kwa usemi unaoeleweka katika Kiswahili.
- source_word: שִׁפְחָתְךָ
  choice: mjakazi wako
  rationale: Neno hili ni la jinsia ya kike na ni namna ya kujishusha mbele ya mfalme; ‘mjakazi’ huhifadhi jinsia na mazingira ya kijamii.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: maneno haya yote
  rationale: Muktadha unaonyesha kwamba Yoabu alimpa mwanamke maneno ya kusema, hivyo ‘maneno’ ni sahihi kuliko ‘mambo’.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kifalme lakini kinachoeleweka kwa msomaji wa kawaida. Majina ya heshima ‘bwana wangu mfalme,’ ‘mtumishi wako,’ na ‘mjakazi wako’ yamehifadhi mienendo ya lugha ya ikulu. Alama za tanbihi zimewekwa baada ya vifungu vinavyoelezwa, kwa kuwa nafasi zao katika safu ya mashauriano ya Kiingereza hazikulingana na maudhui ya tanbihi.
