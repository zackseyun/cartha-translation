base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/029.yaml
  text: So Absalom sent for Joab to send him to the king[a], but he was not willing to come to him. So he sent again a second time, but he was not willing to come.
translation:
  language: sw
  text: Basi Absalomu akamwita Yoabu ili Yoabu amtume kwa mfalme, lakini Yoabu hakutaka kuja kwake.[a] Absalomu akamwita tena, mara ya pili, lakini Yoabu hakutaka kuja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikataa kuja kwake” (kihalisi, “hakutaka kuja kwake”).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אַבְשָׁלוֹם אֶל יוֹאָב
  choice: Absalomu akatuma watu wamwite Yoabu
  rationale: Kiebrania kinasema kwa msingi kwamba Absalomu ‘alituma kwa Yoabu.’ Kiswahili cha kawaida huhitaji kueleza kwa njia ya nahau kwamba alituma watu wamwite, bila kudai kwamba wajumbe wenyewe wametajwa wazi katika matini.
- source_word: לִשְׁלֹחַ אֹתוֹ אֶל הַמֶּלֶךְ
  choice: ili amtume kwa mfalme
  rationale: 'Huhifadhi kishazi cha kusudi na kiwakilishi ‘-m-’ kinachomrejelea Absalomu: alitaka Yoabu amsaidie kufika kwa mfalme, huku jukumu hilo likibaki limeelezwa kwa kitenzi ‘tuma’ kama katika chanzo.'
- source_word: וְלֹא אָבָה
  choice: lakini Yoabu hakutaka
  rationale: אָבָה humaanisha kuwa tayari au kutaka. ‘Hakutaka’ huhifadhi maana hiyo bila kuimarisha kuwa ‘alikataa’; jina Yoabu limerudiwa ili kuondoa utata wa kiwakilishi katika Kiswahili.
- source_word: לָבוֹא אֵלָיו
  choice: kuja kwake
  rationale: Huhifadhi mwelekeo ulio wazi wa Kiebrania, yaani kuja kwa Absalomu, badala ya kusema tu ‘kuja.’
- source_word: עוֹד שֵׁנִית
  choice: tena, mara ya pili
  rationale: 'Huwakilisha vipengele vyote viwili vya Kiebrania: עוֹד ‘tena’ na שֵׁנִית ‘mara ya pili,’ na hivyo kuhifadhi msisitizo wa kurudiwa.'
- source_word: וַיִּשְׁלַח ... וְלֹא אָבָה ... וַיִּשְׁלַח ... וְלֹא אָבָה
  choice: akatuma ... lakini ... hakutaka ... akatuma ... lakini ... hakutaka
  rationale: Marudio ya muundo wa simulizi yamehifadhiwa ili kuonyesha mwendo na utofautishaji wa matukio katika chanzo.
