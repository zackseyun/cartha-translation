revisions:
- from: Basi Absalomu akatuma watu wamwite Yoabu ili amtume kwa mfalme, lakini Yoabu hakutaka kuja kwake.[a] Absalomu akatuma watu tena, mara ya pili, lakini Yoabu hakutaka kuja.
  to: Basi Absalomu akamwita Yoabu ili Yoabu amtume kwa mfalme, lakini Yoabu hakutaka kuja kwake.[a] Absalomu akamwita tena, mara ya pili, lakini Yoabu hakutaka kuja.
  rationale: The revision renders the contextual force of the first Hebrew verb as a summons without introducing explicitly stated messengers. It names Yoab as the agent of sending Absalom to the king, retains the directional phrase “kuja kwake,” and preserves the emphatic repetition “tena, mara ya pili.”
