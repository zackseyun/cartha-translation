review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Absalom as the one seeking access to the king and preserves Joab’s unwillingness and the repeated sending. However, “akatuma watu wamwite” explicitly introduces people/messengers, whereas the Hebrew simply says that Absalom sent to Joab. The purposive clause is also syntactically ambiguous in Swahili because “ili amtume” does not explicitly name Joab as the intended agent.
  naturalness: The wording is generally clear and in an appropriate modern formal register. A more direct idiomatic rendering, “akamwita Yoabu,” conveys the contextual force of sending for Joab without adding unnamed messengers. Explicitly naming Yoab in the purpose clause removes ambiguity.
  terminology: “Absalomu,” “Yoabu,” “mfalme,” and “hakutaka kuja kwake” are suitable Standard East African Swahili forms. The lexical-alternative footnote is appropriate and its anchor remains correctly placed.
  issues:
  - severity: medium
    issue: “akatuma watu wamwite Yoabu” adds explicitly mentioned messengers.
    rationale: The Hebrew says that Absalom sent to Joab, whose contextual sense is summoning him, but does not state that he sent people. “Akamwita Yoabu” communicates the idiomatic sense without this addition.
  - severity: medium
    issue: The agent of “ili amtume kwa mfalme” is grammatically under-specified.
    rationale: Although context can suggest that Yoab is to send Absalom, explicitly stating “ili Yoabu amtume” gives the Hebrew purpose relation clearly and avoids possible misreading.
  revised_text: Basi Absalomu akamwita Yoabu ili Yoabu amtume kwa mfalme, lakini Yoabu hakutaka kuja kwake.[a] Absalomu akamwita tena, mara ya pili, lakini Yoabu hakutaka kuja.
  revised_footnotes:
  - marker: a
    text: Au, “alikataa kuja kwake” (kihalisi, “hakutaka kuja kwake”).
    reason: lexical_alternative
  revision_rationale: The revision renders the contextual force of the first Hebrew verb as a summons without introducing explicitly stated messengers. It names Yoab as the agent of sending Absalom to the king, retains the directional phrase “kuja kwake,” and preserves the emphatic repetition “tena, mara ya pili.”
