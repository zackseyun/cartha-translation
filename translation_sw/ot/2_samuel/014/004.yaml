lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקֹעִית
  choice: mwanamke kutoka Tekoa
  rationale: Kivumishi cha Kiebrania kinamtambulisha kwa mahali alikotoka. Usemi huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: וַתֹּאמֶר ... אֶל הַמֶּלֶךְ
  choice: akamwambia mfalme
  rationale: Kitenzi אָמַר kwa kawaida humaanisha ‘kusema’; ‘akamwambia mfalme’ ni Kiswahili cha asili na kinahifadhi mhusika anayeelekezewa maneno.
- source_word: וַתִּפֹּל עַל אַפֶּיהָ אַרְצָה
  choice: akaanguka kifudifudi chini
  rationale: Usemi huu unaonyesha kuanguka uso ukiwa umeelekea ardhini; ‘kifudifudi chini’ huwasilisha mkao huo kwa uwazi na kwa lugha ya kawaida.
- source_word: וַתִּשְׁתָּחוּ
  choice: kusujudu
  rationale: Kitenzi kinaonyesha kuinama au kujilaza mbele ya mtu kwa heshima na unyenyekevu. ‘Kusujudu’ hapa kinafaa kwa tendo la heshima mbele ya mfalme bila kulifanya lazima kuwa ibada ya kidini.
- source_word: הוֹשִׁיעָה
  choice: Niokoe
  rationale: Amri hii ni ombi la kuokolewa au kukombolewa. Kiebrania hakitaji yambwa wazi, lakini Kiswahili kwa kawaida huhitaji ‘ni-’ katika ombi hili.
- source_word: הַמֶּלֶךְ
  choice: ee mfalme
  rationale: Katika mwito wa moja kwa moja, ‘ee mfalme’ huhifadhi sauti rasmi na ya kusihi ya Kiebrania.
