  text: Then Joab arose and went to Absalom’s house and said to him[a], “Why have your servants set my field on fire?”
translation:
  language: sw
  text: Ndipo Yoabu akainuka, akaenda nyumbani kwa Absalomu, akamwambia, “Kwa nini watumishi wako wamelitia moto shamba langu[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kihalisi: “sehemu ya ardhi iliyo yangu kwa moto.” Kiswahili cha kawaida husema, “wamelitia moto shamba langu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Ndipo Yoabu akaondoka
  rationale: Kitenzi hiki kinaendeleza mfululizo wa simulizi. “Akaondoka” ni Kiswahili cha kawaida na chenye heshima kinachoonyesha kwamba Yoabu alichukua hatua na kwenda.
- source_word: וַיָּבֹא אֶל אַבְשָׁלוֹם הַבָּיְתָה
  choice: akaenda nyumbani kwa Absalomu
  rationale: Kiambishi cha mwelekeo katika הַבָּיְתָה kinaonyesha kwenda kwenye nyumba. Katika muktadha huu ni makao ya Absalomu; “nyumbani kwa Absalomu” ni usemi wa kawaida wa Kiswahili.
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Hili ni neno la kuuliza sababu moja kwa moja, na “Kwa nini” ndilo linalolingana kwa kawaida.
- source_word: הִצִּיתוּ
  choice: wamelitia moto
  rationale: Hifili ya יצת humaanisha kuwasha au kutia kitu moto. “Wamelitia moto” huhifadhi maana ya kusababisha moto bila kudokeza tu matokeo ya kuungua.
- source_word: עֲבָדֶךָ
  choice: watumishi wako
  rationale: Ingawa umbo la nomino ni la umoja lenye kiambishi cha nafsi ya pili, kitenzi ni cha wingi na maana hapa ni ya kundi. “Watumishi wako” linafaa katika mazingira haya ya kijamii na ya kifalme.
- source_word: הַחֶלְקָה
  choice: shamba
  rationale: Neno hili humaanisha sehemu au kipande cha ardhi. Katika muktadha wa ardhi iliyochomwa, “shamba” ni neno la kawaida na linaloeleweka vizuri.
- source_word: אֲשֶׁר לִי
  choice: langu
  rationale: Kirai hiki husema kihalisi “ambalo ni langu.” Kiswahili huonyesha umiliki huu kwa kawaida kwa kusema “shamba langu.”
- source_word: בָּאֵשׁ
  choice: moto
  rationale: Kiambishi ב hapa kinaonyesha chombo au njia, yaani “kwa moto.” Katika Kiswahili, muundo wa kawaida ni “kulitia moto.”
