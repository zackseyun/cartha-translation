base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/011.yaml
  text: Then she said[a], “Please let the king remember Yahweh your God, so that the avenger of blood may not continue to destroy, and they may not destroy my son.” And he said, “As Yahweh lives[b], not one hair of your son shall fall to the ground.”
translation:
  language: sw
  text: Ndipo mwanamke akasema, “Tafadhali, mfalme na amkumbuke Yahweh Mungu wako, ili mlipiza kisasi cha damu[a] asiendelee kuangamiza, nao wasimwangamize mwanangu.” Naye akasema, “Kama Yahweh aishivyo, hata unywele mmoja wa mwanao hautaanguka chini[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, jamaa mwenye wajibu wa kulipiza damu ya mtu aliyeuawa; pia inaweza kutafsiriwa “mlipiza damu.”
    reason: lexical_alternative
  - marker: b
    text: Nahau hii ya Kiebrania inamaanisha kwamba mwanao atalindwa kabisa na hatadhuriwa.
    reason: idiom_explanation
lexical_decisions:
- source_word: יִזְכָּר נָא
  choice: Tafadhali, mfalme na amkumbuke
  rationale: Kauli ya kusihi pamoja na נָא ni ombi la heshima kwa mfalme; muundo huu unahifadhi unyenyekevu wa ombi kwa Kiswahili cha kawaida.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh Mungu wako
  rationale: Jina la agano יְהוָה limetolewa kama “Yahweh,” na kiwakilishi cha nafsi ya pili kimehifadhiwa katika “Mungu wako.”
- source_word: מֵהַרְבּוֹת גֹּאֵל הַדָּם לְשַׁחֵת
  choice: ili mlipiza kisasi cha damu asiendelee kuangamiza
  rationale: Muundo wa מן pamoja na kitenzi cha Hifili cha רבה unaonyesha kuzuia tendo lisiongezeke au kuendelea. “Asiendelee kuangamiza” ni ya asili kwa Kiswahili na huhifadhi wazo hilo bila kulainisha hatari.
- source_word: גֹּאֵל הַדָּם
  choice: mlipiza kisasi cha damu
  rationale: Hili ni jina la kisheria la jamaa mwenye jukumu la kulipiza damu iliyomwagika. Tafsiri hii inaeleweka kuliko tafsiri sisisi “mkombozi wa damu,” ambayo inaweza kupotosha.
- source_word: וְלֹא יַשְׁמִידוּ אֶת־בְּנִי
  choice: nao wasimwangamize mwanangu
  rationale: Wingi wa kitenzi cha Kiebrania umehifadhiwa kwa “wao” iliyomo katika “nao,” bila kuwataja kwa namna iliyo wazi zaidi kuliko chanzo.
- source_word: חַי יְהוָה
  choice: Kama Yahweh aishivyo
  rationale: Hii ni fomula ya kiapo; muundo huu ni wa heshima na unaeleweka katika Kiswahili cha Biblia.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת בְּנֵךְ אָרְצָה
  choice: hata unywele mmoja wa mwanao hautaanguka chini
  rationale: Baada ya kiapo, אִם hutoa ukanushaji mkali. Kiswahili hiki kinawasilisha uhakikisho kamili unaokusudiwa na nahau ya Kiebrania.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni; “Yahweh” huhifadhi jina la agano bila kulibadili kuwa cheo.
- issue: Nguvu ya kiapo אִם יִפֹּל
  choice: 'ukanushaji wa uhakika: “hautaanguka”'
  alternative: 'sharti la kisarufi: “ikiwa ... utaanguka”'
  rationale: Katika fomula ya kiapo “Kama Yahweh aishivyo,” אִם hutenda kama ukanushaji wenye mkazo. Tafsiri ya sharti pekee ingeficha maana ya ahadi ya mfalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Na amkumbuke” huhifadhi ombi la heshima kwa mfalme; “nao” huhifadhi mhusika wa wingi asiyeainishwa wazi katika chanzo.
