revisions:
- from: Ndipo Yoabu akajitupa kifudifudi chini, akasujudu, na kumbariki mfalme. Yoabu akasema, “Leo mtumishi wako anajua kwamba nimepata kibali machoni pako, bwana wangu mfalme, kwa kuwa mfalme ametimiza ombi la mtumishi wake[a].”
  to: Ndipo Yoabu akaanguka kifudifudi, akasujudu, na kumbariki mfalme. Yoabu akasema, “Leo mtumishi wako anajua kwamba nimepata kibali machoni pako, bwana wangu mfalme, kwa kuwa mfalme amefanya kama mtumishi wake alivyosema.”
  rationale: The revision removes an unnecessary redundancy in the opening posture and renders the final Hebrew idiom in natural Swahili without limiting ‘neno la mtumishi wake’ to a formal request. No footnote is needed because ‘amefanya kama mtumishi wake alivyosema’ communicates the idiom’s sense directly and preserves its breadth.
