base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/022.yaml
  text: Then Joab fell with his face to the ground[a], bowed down, and blessed the king. Joab said, “Today your servant knows that I have found favor in your eyes, my lord the king, because the king has done the word of his servant.”
translation:
  language: sw
  text: Ndipo Yoabu akaanguka kifudifudi, akasujudu, na kumbariki mfalme. Yoabu akasema, “Leo mtumishi wako anajua kwamba nimepata kibali machoni pako, bwana wangu mfalme, kwa kuwa mfalme amefanya kama mtumishi wake alivyosema.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל ... אֶל־פָּנָיו אַרְצָה
  choice: akajitupa kifudifudi chini
  rationale: Hueleza kwa Kiswahili cha kawaida tendo la kuanguka uso ukielekea ardhini, huku ikihifadhi taswira ya Kiebrania.
- source_word: וַיִּשְׁתַּחוּ
  choice: akasujudu
  rationale: Kitenzi kinaonyesha kuinama au kujilaza mbele ya mkuu. Katika muktadha huu ni heshima ya kifalme, si lazima ibada kwa mungu.
- source_word: וַיְבָרֶךְ אֶת־הַמֶּלֶךְ
  choice: kumbariki mfalme
  rationale: Huhifadhi maana ya kawaida ya ברך katika muundo huu; muktadha unaonyesha maneno ya heshima na shukrani kwa mfalme.
- source_word: יָדַע עַבְדְּךָ
  choice: mtumishi wako anajua
  rationale: Huhifadhi namna ya Yoabu kujitaja kwa unyenyekevu kama mtumishi wa mfalme na kueleza utambuzi wake wa sasa.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: nimepata kibali machoni pako
  rationale: Huhifadhi nahau na taswira ya Kiebrania kwa lugha inayoeleweka katika Kiswahili.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Ni namna ya heshima ya kumwambia mfalme, bila kuipa kauli maana ya ibada.
- source_word: עָשָׂה ... אֶת־דְּבַר עַבְדּוֹ
  choice: ametimiza ombi la mtumishi wake
  rationale: Nahau ya Kiebrania ni ‘amefanya neno la mtumishi wake’; katika muktadha inamaanisha kwamba mfalme amekubali na kutekeleza ombi la Yoabu. Maana ya moja kwa moja imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Heshima inayotolewa kwa mfalme wa kibinadamu
  choice: akasujudu; bwana wangu mfalme
  alternative: akamwabudu mfalme
  rationale: Matendo na maneno haya yanaonyesha heshima ya kifalme. Tafsiri haipaswi kuyafanya kuwa dai kwamba Yoabu alimwabudu mfalme kama Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kifalme lakini kinachoeleweka kwa wasomaji wa kawaida. Kurudiwa kwa “Yoabu” na kubadilika kutoka “mtumishi wako” kwenda “nimepata” kumehifadhiwa kwa kuwa kunafuata mtindo wa chanzo.
