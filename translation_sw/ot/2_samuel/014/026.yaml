base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/026.yaml
  text: 'Whenever he cut the hair of his head—at the end of every year he would cut it[a], because it was heavy on him—when he cut it, he weighed the hair of his head: two hundred shekels by the king’s stone.'
translation:
  language: sw
  text: 'Kila aliponyoa nywele za kichwa chake—mwishoni mwa kila mwaka alikuwa akizinyoa[a], kwa sababu zilimlemea—alipozinyoa, akazipima: zilikuwa shekeli mia mbili kwa kipimo cha mfalme[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina nahau ambayo, katika muktadha huu, ina maana kwamba alifanya hivyo kila mwaka.
    reason: translation_note
  - marker: b
    text: Kihalisi, "kwa jiwe la mfalme"; yaani, kwa uzani wa kiwango rasmi cha mfalme.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְגַלְּחוֹ אֶת־רֹאשׁוֹ
  choice: Kila aliponyoa nywele za kichwa chake
  rationale: Muundo wa wakati katika muktadha unaonyesha tendo lililorudiwa. Kiswahili hutaja ‘nywele’ wazi, kwa kuwa ndizo zinazonyolewa, ingawa Kiebrania husema kihalisi ‘kichwa chake.’
- source_word: וְהָיָה מִקֵּץ יָמִים לַיָּמִים
  choice: naye alikuwa akizinyoa mwishoni mwa kila mwaka
  rationale: Nahau hii inaonyesha muda wa kawaida unaojirudia; katika muktadha, kipindi hicho kinaeleweka kuwa cha mwaka mmoja.
- source_word: כִּי כָבֵד עָלָיו
  choice: kwa sababu zilikuwa nzito juu yake
  rationale: Huhifadhi taswira ya Kiebrania ya nywele kuwa nzito juu yake bila kuongeza kwamba zilikuwa nzito kupita kiasi.
- source_word: וְגִלְּחוֹ
  choice: alipokuwa amezinyoa
  rationale: Hurejesha hali ya wakati na kuweka wazi kwamba kupima kulifanyika baada ya kunyoa.
- source_word: וְשָׁקַל אֶת־שְׂעַר רֹאשׁוֹ
  choice: alizipima
  rationale: Kitenzi ‘kupima’ ni cha kawaida kwa kubainisha uzani katika Kiswahili; kiwakilishi kinarejelea wazi nywele zilizotajwa.
- source_word: מָאתַיִם שְׁקָלִים
  choice: shekeli mia mbili
  rationale: ‘Shekeli’ hapa ni kipimo cha uzani, si sarafu; neno la asili linahifadhiwa kwa usahihi wa kihistoria.
- source_word: בְּאֶבֶן הַמֶּלֶךְ
  choice: kwa kipimo cha uzani cha mfalme
  rationale: אֶבֶן humaanisha kihalisi ‘jiwe,’ lakini hapa ni jiwe la kupimia lililotumika kama kiwango rasmi cha mfalme. Tafsiri kuu hutoa maana hiyo kwa Kiswahili cha kawaida.
