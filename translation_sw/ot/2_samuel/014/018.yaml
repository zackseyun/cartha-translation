base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/018.yaml
  text: Then the king answered and said to the woman[a], “Please do not hide from me anything that I ask you.” And the woman said, “Please speak[b], my lord the king.”
translation:
  language: sw
  text: Ndipo mfalme akajibu, akamwambia yule mwanamke, “Tafadhali usinifiche jambo lolote[a] ninalokuuliza.” Yule mwanamke akasema, “Tafadhali sema,[b] bwana wangu mfalme.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “usinifiche jambo ninalokuuliza.”'
    reason: lexical_alternative
  - marker: b
    text: Au, kwa mtindo rasmi zaidi, “Bwana wangu mfalme na aseme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: akajibu na kumwambia
  rationale: Inahifadhi mfuatano wa vitenzi vya masimulizi, ‘akajibu’ na ‘akamwambia,’ huku ikiunda Kiswahili cha kawaida katika mazungumzo.
- source_word: הָאִשָּׁה
  choice: yule mwanamke
  rationale: Mhusika ni mwanamke wa Tekoa, si mke; ‘yule mwanamke’ humrejelea kwa uwazi katika muktadha.
- source_word: אַל נָא תְכַחֲדִי מִמֶּנִּי
  choice: Tafadhali usinifiche
  rationale: ‘Tafadhali’ huwasilisha chembe ya kusihi נָא, na ‘usinifiche’ hudumisha maana ya kutoficha au kutokataa kutoa habari.
- source_word: דָּבָר
  choice: jambo lolote
  rationale: Baada ya katazo, ‘jambo lolote’ ni Kiswahili cha asili kinachowasilisha nomino isiyoainishwa ‘jambo/neno.’
- source_word: אֲשֶׁר אָנֹכִי שֹׁאֵל אֹתָךְ
  choice: nitakalokuuliza
  rationale: Katika muktadha, mfalme anatanguliza swali analokusudia kuuliza; wakati ujao ni wa kawaida na wazi katika Kiswahili, bila kubadili lengo la kauli.
- source_word: יְדַבֶּר נָא
  choice: Tafadhali sema
  rationale: Kauli ya nafsi ya tatu yenye heshima imetolewa kwa nafsi ya pili katika Kiswahili cha mazungumzo; ‘Tafadhali’ huhifadhi sauti ya heshima na kusihi.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Huhifadhi namna rasmi ya kumwita mfalme kwa heshima pamoja na kiwakilishi cha umilikaji.
