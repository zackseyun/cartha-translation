translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya mazungumzo ya kifalme lakini kinachoeleweka kwa urahisi. Muundo wa Kiebrania wa nafsi ya tatu wenye heshima umewekwa katika tanbihi, huku matini kuu ikitumia ombi la moja kwa moja na la kawaida.
