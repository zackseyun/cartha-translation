  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa usimulizi ‘Ndipo... Basi...’ umehifadhi mfuatano wa matendo, huku kauli ya moja kwa moja ikiwa ya kawaida na inayoeleweka.
