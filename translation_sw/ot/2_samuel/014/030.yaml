base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/030.yaml
  text: Then he said to his servants[a], “Look, Joab’s field is next to mine, and he has barley there. Go and set it on fire.” So Absalom’s servants set the field on fire.
translation:
  language: sw
  text: Ndipo akawaambia watumishi wake, “Tazameni, shamba la Yoabu liko karibu na langu[a], naye ana shayiri humo. Nendeni mkalitie moto.” Basi watumishi wa Absalomu wakatia shamba hilo moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “shamba la Yoabu liko kando ya mkono wangu,” nahau inayomaanisha kuwa lilikuwa karibu na shamba la Absalomu.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְקַת
  choice: shamba
  rationale: Katika muktadha huu neno hilo linamaanisha eneo la ardhi linalolimwa na lenye shayiri; ‘shamba’ ni Kiswahili cha kawaida na sahihi.
- source_word: אֶל יָדִי
  choice: liko karibu na langu
  rationale: Nahau hii, ambayo kwa neno halisi huhusisha ‘mkono wangu,’ inaonyesha kuwa shamba la Yoabu lilikuwa jirani na shamba la Absalomu. Tafsiri hii huwasilisha maana kwa Kiswahili cha kawaida.
- source_word: שְׂעֹרִים
  choice: shayiri
  rationale: Neno hili linataja zao la shayiri lililokuwa shambani.
- source_word: וְהוּצִיתִהָ
  choice: mkalitie moto
  rationale: Muundo wa Hiphil wa יצת una maana ya kusababisha kitu kishike moto; ‘kulitia moto’ ni usemi wa kawaida unaohifadhi maana hiyo.
- source_word: וַיַּצִּתוּ
  choice: wakalitia ... moto
  rationale: Kurudia usemi uleule hudumisha ulinganifu wa kileksika kati ya amri na utekelezaji wake.
- source_word: עֲבָדָיו / עַבְדֵי אַבְשָׁלוֹם
  choice: watumishi wake / watumishi wa Absalomu
  rationale: עבד inaweza kumaanisha mtumwa au mtumishi, lakini hapa hadhi ya utumwa haijasisitizwa; ‘watumishi’ inafaa katika simulizi hili la kifalme bila kubainisha zaidi ya chanzo.
- source_word: רְאוּ
  choice: Tazameni
  rationale: Amri hii inavuta fikira za watumishi kwenye shamba lililo karibu; ‘Tazameni’ ni ya asili na yenye hadhi katika Kiswahili.
- source_word: לְכוּ
  choice: Nendeni
  rationale: Ni amri ya moja kwa moja ya kwenda kabla ya agizo la kulitia shamba moto.
