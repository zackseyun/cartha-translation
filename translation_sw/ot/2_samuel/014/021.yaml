base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/021.yaml
  text: Then the king said to Joab[a], “Behold now, I have done this thing. Go, bring back the young man Absalom.”
translation:
  language: sw
  text: Kisha mfalme akamwambia Yoabu, “Tazama, sasa nimefanya jambo hili.[a] Nenda ukamrudishe kijana Absalomu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimekubalia ombi hili.” Kiebrania kinasema moja kwa moja, “nimefanya jambo hili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida huku ukihifadhi wazo la tukio linalofuata.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Hili ni jina la cheo lenye uainisho katika Kiebrania; hakuna sababu ya kulibadili kuwa jina la mtu.
- source_word: הִנֵּה נָא
  choice: Tazama, sasa
  rationale: “Tazama” huvuta fikira za msikilizaji, na “sasa” huhifadhi nguvu ya נָא hapa bila kutumia lugha ya kizamani.
- source_word: עָשִׂיתִי אֶת־הַדָּבָר הַזֶּה
  choice: nimefanya jambo hili
  rationale: Tafsiri hii inafuata maana ya moja kwa moja ya Kiebrania na haibadili kimya kimya kauli hiyo kuwa “nimekubalia ombi hili,” ingawa hilo ndilo linalodokezwa na muktadha.
- source_word: וְלֵךְ
  choice: Nenda
  rationale: Amri ya kwenda inatolewa kwa Kiswahili cha asili; kiunganishi cha Kiebrania hakihitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: הָשֵׁב
  choice: ukamrudishe
  rationale: Hifili ya שוב ina maana ya kusababisha mtu arudi; “ukamrudishe” huhifadhi maana hiyo ya kisababishi na pia huunganisha amri hii kiasili na “nenda.”
- source_word: הַנַּעַר
  choice: kijana
  rationale: Neno hili linaweza kumaanisha mvulana, kijana, au mtumishi. Kwa Absalomu ambaye ni mwana mtu mzima, “kijana” huhifadhi mtazamo wa kimahusiano bila kumfanya mtoto mdogo.
- source_word: אַבְשָׁלוֹם
  choice: Absalomu
  rationale: Jina limeandikwa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “nenda ukamrudishe” ni wa kawaida na huhifadhi amri pamoja na nguvu ya kisababishi ya kitenzi cha Kiebrania.
