source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְשָׁל֣וֹם אֶל יוֹאָ֡ב הִנֵּ֣ה שָׁלַ֣חְתִּי אֵלֶ֣י/ךָ לֵ/אמֹ֡ר בֹּ֣א הֵ֠נָּה וְ/אֶשְׁלְחָה֩ אֹתְ/ךָ֨ אֶל הַ/מֶּ֜לֶךְ לֵ/אמֹ֗ר לָ֤/מָּה בָּ֨אתִי֙ מִ/גְּשׁ֔וּר ט֥וֹב לִ֖/י עֹ֣ד אֲנִי שָׁ֑ם וְ/עַתָּ֗ה אֶרְאֶה֙ פְּנֵ֣י הַ/מֶּ֔לֶךְ וְ/אִם יֶשׁ בִּ֥/י עָוֺ֖ן וֶ/הֱמִתָֽ/נִי־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/032.yaml
  text: Absalom said to Joab[a], “Look, I sent word to you, saying, ‘Come here, so that I may send you to the king, to say, “Why have I come from Geshur? It would be better for me still to be there.”’ Now then, let me see the king’s face; and if there is guilt in me[b], let him put me to death.”
translation:
  language: sw
  text: Absalomu akamwambia Yoabu, “Tazama, nilituma ujumbe kwako nikisema, ‘Njoo hapa ili nikutume kwa mfalme kusema, “Kwa nini nilikuja kutoka Geshuri? Ingekuwa afadhali kwangu kama ningekuwa bado huko.”[a]’ Sasa basi, acha niuone uso wa mfalme;[b] na ikiwa nina hatia, na aniue.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ingekuwa afadhali kwangu kama ningalibaki huko.” Kifungu cha Kiebrania kimeachwa kwa ufupi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa neno halisi, “niuone uso wa mfalme,” nahau yenye maana ya kufika mbele ya mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni kiashiria cha mazungumzo kinachovuta fikira kwenye hoja ya Absalomu; “Tazama” ni cha sasa na chenye hadhi.
- source_word: שָׁלַחְתִּי אֵלֶיךָ
  choice: nilituma ujumbe kwako
  rationale: Katika muktadha huu, kitenzi kinamaanisha kutuma ujumbe au mwito kwa Yoabu, si kutuma kitu kisichotajwa.
- source_word: בֹּא הֵנָּה
  choice: Njoo hapa
  rationale: Huwasilisha kwa kawaida amri ya moja kwa moja pamoja na kielezi cha mahali.
- source_word: וְאֶשְׁלְחָה אֹתְךָ אֶל הַמֶּלֶךְ
  choice: ili nikutume kwa mfalme
  rationale: Umbo la Kiebrania linaonyesha kusudi la mwito wa Absalomu kwa Yoabu.
- source_word: לָמָּה בָּאתִי מִגְּשׁוּר
  choice: Kwa nini nilikuja kutoka Geshuri?
  rationale: Kitenzi ni nafsi ya kwanza, “nilikuja,” wala si kauli ya kutendwa, “nilirudishwa.”
- source_word: טוֹב לִי עוֹד אֲנִי שָׁם
  choice: Ingekuwa afadhali kwangu kama ningekuwa bado huko
  rationale: Kifungu cha Kiebrania kimeachwa kwa ufupi; tafsiri hii inaonyesha ulinganisho unaodokezwa huku ikihifadhi neno “bado” na hali ya kutotimia.
- source_word: וְעַתָּה
  choice: Sasa basi
  rationale: Huonyesha mpito wa usemi kutoka malalamiko hadi dai, bila kulifanya kuwa hitimisho la kisababishi kwa nguvu mno.
- source_word: אֶרְאֶה פְּנֵי הַמֶּלֶךְ
  choice: acha niuone uso wa mfalme
  rationale: Inahifadhi taswira halisi ya “kuuona uso” huku “acha niuone” ikiwasilisha dai au ombi la Absalomu kwa Kiswahili cha kawaida.
- source_word: עָוֺן
  choice: hatia
  rationale: Neno linaweza kumaanisha uovu au hali ya kuwajibika kwa kosa; “hatia” inafaa katika changamoto hii yenye mwelekeo wa hukumu.
- source_word: וֶהֱמִתָנִי
  choice: na aniue
  rationale: Huwasilisha kwa ufupi na kwa uzito maana ya kusababisha afe, bila kuongeza wazo maalumu la utaratibu rasmi wa hukumu ya kifo.
theological_decisions:
- issue: Maana ya עָוֺן katika dai la Absalomu
  choice: ikiwa nina hatia
  alternative: ikiwa kuna uovu ndani yangu
  rationale: “Hatia” huhifadhi upande wa kisheria wa kauli hiyo bila kuamua kama Absalomu anakiri dhambi au anakanusha kabisa kosa lake.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mazungumzo ya moja kwa moja yamehifadhiwa, pamoja na ukali wa dai la Absalomu. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili: Absalomu, Yoabu, na Geshuri.'
