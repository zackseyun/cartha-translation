  text: Then the woman said[a], “Please let your servant speak a word to my lord the king.” And he said, “Speak.”
translation:
  language: sw
  text: Kisha yule mwanamke akasema, “Tafadhali, mjakazi wako na aseme neno kwa bwana wangu, mfalme.” Naye akasema, “Sema.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Kisha ... akasema
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “Kisha” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: הָאִשָּׁה
  choice: yule mwanamke
  rationale: Mhusika ni mwanamke anayezungumza na mfalme; “yule” humrejelea kwa kawaida katika muktadha huu.
- source_word: תְּדַבֶּר נָא
  choice: Tafadhali, niruhusu ... niseme
  rationale: Muundo wa jussive/imperfect pamoja na נָא ni ombi la heshima; tafsiri hii huhifadhi unyenyekevu wake kwa mfalme.
- source_word: שִׁפְחָתְךָ
  choice: mimi mtumishi wako
  rationale: Ni neno la kike linalomaanisha kijakazi au mtumishi wa kike, lakini “mtumishi wako” ni kauli ya heshima iliyo ya kawaida na ya asili katika Kiswahili; maana ya kike imeelezwa katika tanbihi.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: kwa bwana wangu mfalme
  rationale: אדון hapa ni cheo cha heshima kwa mwanadamu, si jina la Mungu; “bwana wangu mfalme” huhifadhi namna rasmi ya kumwambia mfalme.
- source_word: דָּבָר
  choice: neno
  rationale: Neno hili linaweza kumaanisha “neno” au “jambo”; “niseme neno” hudumisha usemi mfupi wa Kiebrania na unaeleweka katika Kiswahili rasmi.
- source_word: וַיֹּאמֶר
  choice: Naye akasema
  rationale: Huu ni mwendelezo rahisi wa simulizi unaoanzisha jibu la mfalme.
- source_word: דַּבֵּרִי
  choice: Sema
  rationale: Ni amri ya moja kwa moja katika umbo la kike; “Sema” ni fupi na mwaminifu bila kuongeza maana.
