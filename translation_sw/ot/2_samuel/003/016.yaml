  yaml_path: translation/ot/2_samuel/003/016.yaml
  text: Her husband went with her[a], walking and weeping behind her as far as Bahurim. Then Abner said to him, “Go[b], return.” So he returned.
translation:
  language: sw
  text: Mume wake akaenda pamoja naye, akitembea na kulia nyuma yake[a] mpaka Bahurimu. Ndipo Abneri akamwambia, “Nenda, rudi.”[b] Basi akarudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akamfuata.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Nenda, rudi,” amri mbili zinazotia mkazo; pia inaweza kutafsiriwa “Rudi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישָׁהּ
  choice: mume wake
  rationale: Katika muktadha huu אִישׁ yenye kiambishi cha nafsi ya tatu umoja wa kike humaanisha mume wa huyo mwanamke, si ‘mwanamume wake’ kwa maana pana.
- source_word: הָלוֹךְ וּבָכֹה
  choice: akitembea na kulia
  rationale: Muundo huu unaonyesha tendo linaloendelea; Kiswahili hiki ni cha kawaida na kinadumisha picha ya kwenda huku akilia.
- source_word: אַחֲרֶיהָ
  choice: nyuma yake
  rationale: Hueleza kufuata kwa nafasi akiwa nyuma yake; ‘akimfuata’ pia inawezekana, lakini ‘nyuma yake’ inadumisha zaidi taswira ya Kiebrania.
- source_word: עַד בַּחֻרִים
  choice: mpaka Bahurimu
  rationale: עַד pamoja na jina la mahali huonyesha mwisho wa safari; ‘mpaka’ ni usemi wa kawaida wa Kiswahili.
- source_word: בַּחֻרִים
  choice: Bahurimu
  rationale: Ni jina la mahali, limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: לֵךְ שׁוּב
  choice: Nenda, rudi
  rationale: Amri zote mbili za Kiebrania zimehifadhiwa, zikidumisha mkazo na pia uwezekano wa kuelewa usemi huo kama amri moja ya kurudi.
- source_word: וַיָּשֹׁב
  choice: Basi akarudi
  rationale: Husogeza simulizi mbele na kuonyesha kwamba alitii amri ya Abneri; ‘basi’ huleta matokeo hayo kwa Kiswahili fasaha.
