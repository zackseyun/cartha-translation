translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametoholewa kama ‘Abneri’ na ‘Bahurimu.’ Muundo wa simulizi umetumia vitenzi vya mfululizo vya ‘aka-’ kwa mtiririko wa kawaida.
