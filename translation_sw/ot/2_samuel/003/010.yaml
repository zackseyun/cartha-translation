base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/010.yaml
  text: to transfer the kingdom from the house of Saul and to establish the throne of David over Israel and over Judah[a], from Dan to Beer-sheba.
translation:
  language: sw
  text: kuuhamisha ufalme kutoka kwa nyumba ya Sauli na kuimarisha kiti cha enzi cha Daudi juu ya Israeli na juu ya Yuda, kutoka Dani hadi Beer-sheba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Usemi “kutoka Dani hadi Beer-sheba” ni nahau ya kijiografia inayomaanisha nchi yote, kutoka kaskazini hadi kusini.
    reason: cultural_note
lexical_decisions:
- source_word: לְהַעֲבִיר
  choice: kuuhamisha
  rationale: Hifili ya עבר hapa ina maana ya kuufanya ufalme upite kutoka kwa mtawala mmoja kwenda kwa mwingine; “kuuhamisha” huonyesha wazi uhamisho huo wa kisiasa.
- source_word: הַמַּמְלָכָה
  choice: ufalme
  rationale: Neno hili linahusu ufalme au mamlaka ya kifalme; “ufalme” ni la kawaida na linabaki na upana wa maana ya Kiebrania.
- source_word: מִבֵּית שָׁאוּל
  choice: kutoka kwa nyumba ya Sauli
  rationale: “Nyumba” inadumisha taswira ya Kiebrania ya jamaa au nasaba inayotawala bila kuibadili moja kwa moja kuwa istilahi ya kinadharia.
- source_word: וּלְהָקִים
  choice: na kukiweka imara
  rationale: Hifili ya קום ina maana ya kusimamisha au kuthibitisha; pamoja na “kiti cha enzi,” “kukiweka imara” ni Kiswahili cha asili kinachoonyesha uthabiti wa utawala.
- source_word: אֶת כִּסֵּא דָוִד
  choice: kiti cha enzi cha Daudi
  rationale: Huhifadhi taswira halisi ya kiti cha enzi kama ishara ya mamlaka ya kifalme badala ya kuifafanua tu kuwa utawala.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: juu ya Israeli na juu ya Yuda
  rationale: Kurudia “juu ya” kunawakilisha kurudiwa kwa עַל na kusisitiza maeneo mawili ya kisiasa, Israeli na Yuda.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: kutoka Dani hadi Beer-sheba
  rationale: Hii ni nahau ya kijiografia inayotaja mipaka ya kaskazini na kusini; tafsiri hii ni fupi, ya kawaida, na mwaminifu.
theological_decisions:
- issue: Lugha ya nasaba katika “nyumba ya Sauli” na taswira ya kifalme katika “kiti cha enzi cha Daudi”
  choice: Kudumisha maneno halisi “nyumba” na “kiti cha enzi.”
  alternative: kutoka kwa nasaba ya Sauli na kuuthibitisha utawala wa Daudi
  rationale: Kiebrania kinaeleza uhamisho wa mamlaka kwa taswira madhubuti ya kifalme na ya nasaba. Kuihifadhi huepuka kufifisha maana au kuingiza madai ya kitheolojia yasiyotamkwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishazi tegemezi umehifadhiwa kwa kuwa mstari huu unaendeleza kiapo kilichoanza katika muktadha uliotangulia. Majina yametolewa kama “Dani” na “Beer-sheba,” huku alama ya tanbihi ikiwekwa baada ya usemi unaoelezwa.
