base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/024.yaml
  text: Then Joab came to the king and said[a], “What have you done? Look, Abner came to you. Why is this—you sent him away, and he has gone on his way?”
translation:
  language: sw
  text: Ndipo Yoabu akamwendea mfalme, akasema, “Umefanya nini? Tazama, Abneri alikuja kwako. Kwa nini basi ulimwacha aende, naye akaenda zake kabisa[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “akaenda, kwenda”—muundo wa kusisitiza unaomaanisha kwamba ameondoka hakika au ameondoka kabisa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Ndipo ... akamwendea
  rationale: Muundo wa wayyiqtol unaendeleza simulizi; “Ndipo” na “akamwendea” huonyesha mfuatano wa tukio kwa Kiswahili cha kawaida.
- source_word: אֶל הַמֶּלֶךְ
  choice: mfalme
  rationale: Kirai cha mwelekeo kimeunganishwa kwa kawaida katika kitenzi “akamwendea,” yaani alikuja kwa mfalme.
- source_word: מֶה עָשִׂיתָה
  choice: Umefanya nini?
  rationale: Kauli hii ni swali la kukemea kuhusu tendo lililokamilika lenye matokeo ya sasa; wakati timilifu wa Kiswahili unafaa.
- source_word: הִנֵּה
  choice: Tazama
  rationale: “Tazama” huhifadhi nguvu ya kuvuta fikira ya הִנֵּה kwa lugha yenye heshima na inayoeleweka.
- source_word: בָא אַבְנֵר אֵלֶיךָ
  choice: Abneri alikuja kwako
  rationale: Hutoa taarifa ya msingi kwa njia ya moja kwa moja na kuhifadhi mwelekeo wa אֵלֶיךָ.
- source_word: לָמָּה זֶּה
  choice: Kwa nini basi
  rationale: “Basi” linaonyesha nguvu ya kusisitiza na kukemea iliyo katika זֶּה bila kuunda Kiswahili kisicho cha kawaida.
- source_word: שִׁלַּחְתּוֹ
  choice: ulimwacha aende
  rationale: Katika muktadha huu piel ya שלח ina maana ya kumruhusu au kumwachilia aondoke; uchaguzi huu ni wa kawaida kwa Kiswahili huku ukimwonyesha Daudi kuwa mhusika wa kitendo.
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: naye akaenda zake kabisa
  rationale: “Akaenda zake kabisa” huwasilisha kuondoka pamoja na msisitizo wa muundo wa kitenzi na jina-kitenzi halisi, bila tafsiri ngumu ya neno kwa neno.
