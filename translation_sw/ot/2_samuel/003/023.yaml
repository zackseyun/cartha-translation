base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/023.yaml
  text: When Joab and all the army that was with him arrived, they told Joab, saying, “Abner son of Ner came to the king, and he sent him away, and he went in peace.”
translation:
  language: sw
  text: Yoabu na jeshi lote lililokuwa pamoja naye walipofika, watu wakamwambia Yoabu, “Abneri mwana wa Neri alikuja kwa mfalme, naye akamruhusu aondoke, akaenda kwa amani.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאוּ
  choice: walipofika
  rationale: Katika mfuatano huu wa masimulizi, kitenzi hiki kinaeleza kufika kwa Yoabu na jeshi lake; muundo wa wakati unatoa Kiswahili cha asili huku ukihifadhi maana ya tukio.
- source_word: הַצָּבָא
  choice: jeshi
  rationale: Neno hili humaanisha jeshi au kikosi cha kijeshi; “jeshi” ni neno la kawaida na lenye hadhi katika Kiswahili sanifu.
- source_word: וַיְשַׁלְּחֵהוּ
  choice: akamruhusu aondoke
  rationale: Katika muktadha huu, kitenzi kinaonyesha kuwa mfalme alimwacha Abneri aondoke badala ya kumzuia; tafsiri hii ni ya asili katika Kiswahili bila kudokeza kuwa alifukuzwa.
- source_word: בְשָׁלוֹם
  choice: kwa amani
  rationale: Huhifadhi usemi wa Kiebrania unaoonyesha kuondoka salama na bila uhasama.
theological_decisions: []
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Yoabu, Abneri, na Neri. “Watu wakamwambia” hutumia kiwakilishi cha jumla kwa wale waliotoa taarifa kwa sababu Kiebrania hakuwataji kwa jina.'
