base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/025.yaml
  text: You know Abner son of Ner[a], that he came to deceive you, and to learn your going out and your coming in[b], and to learn all that you are doing.
translation:
  language: sw
  text: Unamjua Abneri mwana wa Neri—alikuja kukudanganya[a], na kujua kutoka na kuingia kwako[b], na yote unayofanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kukushawishi” au “kukupotosha.” Kitenzi cha Kiebrania kinaweza kumaanisha kushawishi, kupotosha, au kudanganya; katika muktadha huu wa uhasama, “kukudanganya” linafaa zaidi.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “kutoka na kuingia kwako” ni usemi unaohusu mienendo au shughuli zako zote.
    reason: cultural_note
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: Unamjua
  rationale: 'Kauli timilifu ya Kiebrania hapa inaeleza hali ya sasa: Yoabu anasisitiza kwamba Daudi anamjua Abneri na hivyo anapaswa kutambua nia yake.'
- source_word: אַבְנֵר בֶּן נֵר
  choice: Abneri mwana wa Neri
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia, huku uhusiano wa kifamilia ukihifadhiwa wazi.
- source_word: כִּי
  choice: —
  rationale: Kistari kirefu kinaunganisha kile ambacho Daudi anadaiwa kujua kuhusu Abneri na maelezo ya kusudi la kuja kwake, bila kutumia muundo usio wa kawaida wa Kiswahili kama ‘unamjua ... kwamba’.
- source_word: לְפַתֹּתְךָ
  choice: ili akudanganye
  rationale: Kitenzi פתה kinaweza kumaanisha kushawishi, kuvutia, au kudanganya. Katika muktadha huu wa tuhuma za kisiasa na kijeshi, ‘kudanganya’ linaonyesha vizuri hila yenye nia mbaya.
- source_word: בָּא
  choice: alikuja
  rationale: Wakati uliopita unafaa simulizi na unaonyesha ziara ya Abneri ambayo tayari ilikuwa imetokea.
- source_word: לָדַעַת
  choice: ajue
  rationale: Hapa kitenzi kinaonyesha kusudi la kupata habari. ‘Ajue’ ni kifupi, cha kawaida, na kinadumisha marudio ya kitenzi ידע katika chanzo.
- source_word: מוֹצָאֲךָ וְאֶת מְבוֹאֶךָ
  choice: kutoka na kuingia kwako
  rationale: Usemi halisi wa Kiebrania umehifadhiwa kwa kuwa unaeleweka katika Kiswahili; unajumlisha mienendo au shughuli zote za Daudi.
- source_word: כָּל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: yote unayofanya
  rationale: Muundo huu unaonyesha kwa kawaida shughuli zote zinazoendelea kufanywa na Daudi.
