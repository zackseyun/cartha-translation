base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/013.yaml
  text: 'He said[a], “Good. I will make a covenant with you. Only one thing I ask of you: You shall not see my face unless you first bring Michal, Saul’s daughter, when you come to see my face.”'
translation:
  language: sw
  text: 'Akasema, “Vema. Nitafanya agano nawe. Lakini kuna jambo moja tu ninalokuomba: Hutaona uso wangu[a] isipokuwa kwanza umlete Mikali, binti ya Sauli, utakapokuja kuuona uso wangu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hutafika mbele yangu isipokuwa umemleta kwanza Mikali, binti ya Sauli, utakapokuja kufika mbele yangu.” Kiebrania kinasema kihalisi, “kuona uso wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Vema
  rationale: Ni jibu fupi la kukubali pendekezo; linaendeleza ufupi wa Kiebrania kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: אֶכְרֹת ... בְּרִית
  choice: Nitafanya agano
  rationale: Nahau ya Kiebrania ni ‘kukata agano,’ lakini ‘kufanya agano’ ni ya asili katika Kiswahili na inadumisha maana rasmi ya agano.
- source_word: אַךְ דָּבָר אֶחָד אָנֹכִי שֹׁאֵל מֵאִתְּךָ
  choice: Lakini nakuomba jambo moja tu
  rationale: ‘Lakini’ inaonyesha sharti linalowekwa, huku ‘jambo moja tu’ ikihifadhi msisitizo wa ombi moja pekee bila kulifanya kuwa amri kali kupita chanzo.
- source_word: לֹא תִרְאֶה אֶת פָּנַי
  choice: Hutaona uso wangu
  rationale: Inahifadhi nahau halisi na marudio ya Kiebrania, yenye maana ya kuonana na Daudi au kufika mbele yake.
- source_word: כִּי אִם לִפְנֵי הֱבִיאֲךָ
  choice: isipokuwa kwanza umlete
  rationale: 'Inaonyesha sharti la pekee pamoja na mpangilio wa wakati: Mikali lazima aletwe kwanza.'
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Mikali, binti ya Sauli
  rationale: Inatumia umbo la jina lililozoeleka katika Kiswahili na kuhifadhi utambulisho wa wazi wa kuwa binti ya Sauli.
- source_word: בְּבֹאֲךָ לִרְאוֹת אֶת פָּנָי
  choice: utakapokuja kuuona uso wangu
  rationale: Inahifadhi kishazi cha wakati na marudio ya maneno ‘kuuona uso wangu’ yaliyomo katika chanzo.
