  text: the fourth[a], Adonijah son of Haggith; and the fifth, Shephatiah son of Abital.
translation:
  language: sw
  text: wa nne[a], Adoniya mwana wa Hagithi; na wa tano, Shefatia mwana wa Abitali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaanza, “na wa nne,” kikiendeleza orodha kutoka mstari uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרְבִיעִי
  choice: wa nne
  rationale: Ni kivumishi cha mpangilio chenye kiunganishi cha kuendeleza orodha kutoka mstari uliotangulia. Kiswahili cha kawaida kinaweza kuanza kwa ‘wa nne’; tanbihi inaonyesha kuwa Kiebrania kinaanza kwa ‘na wa nne.’
- source_word: אֲדֹנִיָּה
  choice: Adoniya
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: בֶן
  choice: mwana wa
  rationale: Hueleza uhusiano wa moja kwa moja wa uzazi; ‘mwana wa’ ni usemi mfupi na wa kawaida katika orodha za nasaba.
- source_word: חַגִּית
  choice: Hagithi
  rationale: Jina la mtu limetoholewa kwa mfumo wa sauti na tahajia unaofaa Kiswahili.
- source_word: וְהַחֲמִישִׁי
  choice: na wa tano
  rationale: Kiunganishi וְ kimehifadhiwa hapa kwa sababu kinaunganisha kipengele hiki na cha nne ndani ya mstari huu.
- source_word: שְׁפַטְיָה
  choice: Shefatia
  rationale: Jina la mtu limetoholewa kwa namna inayokaribia umbo la Kiebrania huku likibaki rahisi kusomeka kwa Waswahili.
- source_word: אֲבִיטָל
  choice: Abitali
  rationale: Jina la mtu limetoholewa kwa tahajia inayolingana na matumizi ya Kiswahili.
