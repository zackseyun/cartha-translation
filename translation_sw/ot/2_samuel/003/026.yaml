base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/026.yaml
  text: Then Joab went out from David and sent messengers after Abner[a], and they brought him back from the well of Sirah. But David did not know it.
translation:
  language: sw
  text: Ndipo Yoabu akaondoka alipokuwa pamoja na Daudi, akatuma wajumbe wamfuate Abneri, nao wakamrudisha kutoka kwenye kisima cha Sira.[a] Lakini Daudi hakujua jambo hilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “kutoka Bor-Sira,” ikiwa maneno ya Kiebrania yanachukuliwa kuwa jina la mahali badala ya “kisima cha Sira.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akaondoka
  rationale: Katika mfululizo wa kisimulizi, kitenzi hiki kinaonyesha kuondoka au kutoka; “akaondoka” ni Kiswahili cha kawaida na kinaeleza mwendo kutoka kwa Daudi.
- source_word: מֵעִם דָּוִד
  choice: kwa Daudi
  rationale: Kirai hiki kihalisi kinaonyesha kuondoka mahali alipokuwa pamoja na Daudi; baada ya “akaondoka,” usemi “kwa Daudi” ni wa asili na wazi.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu neno linamaanisha watu waliotumwa, si malaika.
- source_word: אַחֲרֵי אַבְנֵר
  choice: wamfuate Abneri
  rationale: Neno la Kiebrania linaweza kuonyesha kufuata au kwenda nyuma ya mtu; “wamfuate” ni la kawaida bila kuzidisha maana kuwa lazima walikuwa wakimkimbiza kwa nguvu.
- source_word: וַיָּשִׁבוּ אֹתוֹ
  choice: wakamrudisha
  rationale: Muundo wa kisababishi wa שוב unaonyesha kwamba walimsababisha arudi; “wakamrudisha” huhifadhi maana hiyo kwa ufupi.
- source_word: מִבּוֹר הַסִּרָה
  choice: kutoka kwenye kisima cha Sira
  rationale: בּוֹר linaweza kumaanisha shimo, birika, au kisima. “Kisima cha Sira” ni tafsiri inayowezekana ya kirai, huku uwezekano wa jina la mahali ukihifadhiwa katika tanbihi.
- source_word: וְדָוִד לֹא יָדָע
  choice: Lakini Daudi hakujua jambo hilo
  rationale: “Lakini” huonyesha utofautishaji wa kimuktadha, na “jambo hilo” huweka wazi kwamba Daudi hakujua tendo la Yoabu bila kuongeza mada mpya.
