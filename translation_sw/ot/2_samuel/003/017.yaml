translation:
  language: sw
  text: Abneri alikuwa amezungumza na wazee wa Israeli, akisema, “Kwa muda sasa mmekuwa mkimtaka Daudi awe mfalme juu yenu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּדְבַר אַבְנֵר הָיָה עִם
  choice: Abneri alikuwa amezungumza na
  rationale: Muundo huu unaonyesha kwamba mazungumzo ya Abneri na wazee yalikuwa yamefanyika kabla ya hatua inayofuata katika simulizi; Kiswahili sanifu hutumia ‘alikuwa amezungumza’ kwa uhusiano huo wa wakati.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: wazee wa Israeli
  rationale: ‘Wazee’ ni neno la kawaida na lenye hadhi kwa viongozi wakuu wa jamii au makabila.
- source_word: גַּם תְּמוֹל גַּם שִׁלְשֹׁם
  choice: Tangu zamani
  rationale: Nahau hii ya Kiebrania, kihalisi ‘jana na juzi,’ humaanisha kipindi kilichopita au muda fulani uliopita, si lazima siku mbili halisi.
- source_word: הֱיִיתֶם מְבַקְשִׁים
  choice: mmekuwa mkimtaka
  rationale: Huwasilisha hamu au juhudi iliyoendelea; ‘kumtaka’ ni ya kawaida na wazi katika muktadha wa kutamani Daudi awe mfalme.
- source_word: לְמֶלֶךְ עֲלֵיכֶם
  choice: awe mfalme juu yenu
  rationale: Huhifadhi taswira ya Kiebrania ya mfalme kutawala ‘juu’ ya watu bila kuifanya sentensi kuwa ngumu.
