  text: וַ/יֹּ֣אמֶר אַבְנֵ֣ר אֶל דָּוִ֡ד אָק֣וּמָה וְֽ/אֵלֵ֡כָה וְ/אֶקְבְּצָה֩ אֶל אֲדֹנִ֨/י הַ/מֶּ֜לֶךְ אֶת כָּל יִשְׂרָאֵ֗ל וְ/יִכְרְת֤וּ אִתְּ/ךָ֙ בְּרִ֔ית וּ/מָ֣לַכְתָּ֔ בְּ/כֹ֥ל אֲשֶׁר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וַ/יְּשַׁלַּ֥ח דָּוִ֛ד אֶת אַבְנֵ֖ר וַ/יֵּ֥לֶךְ בְּ/שָׁלֽוֹם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/021.yaml
  text: Abner said to David[a], “I will arise and go, and I will gather all Israel to my lord the king, so that they may make a covenant with you, and you shall reign over all that your soul desires.” Then David sent Abner away[c][b], and he went in peace.
translation:
  language: sw
  text: Abneri akamwambia Daudi, “Nitaondoka, niende nikawakusanye Israeli wote kwa bwana wangu, mfalme, ili wafanye agano[a] nawe, nawe utawale yote ambayo moyo wako unatamani.[b]” Kisha Daudi akamwacha Abneri aende zake, naye akaenda kwa amani.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, Kiebrania husema, “wakate agano nawe.”
    reason: lexical_alternative
  - marker: b
    text: Au, “yote ambayo nafsi yako inatamani.”
    reason: lexical_alternative
  - marker: c
    text: “Akaenda kwa amani” ni nahau ya Kiebrania inayomaanisha kwamba aliondoka salama na kwa makubaliano ya amani.
    reason: cultural_note
lexical_decisions:
- source_word: אָקוּמָה וְאֵלֵכָה
  choice: Nitaondoka, niende
  rationale: Vitenzi vya hali ya kohotativi vinaonyesha azimio la Abneri la kuondoka na kwenda. “Nitaondoka, niende” ni Kiswahili cha kawaida kinachohifadhi mfuatano na msukumo wa maneno hayo bila tafsiri ngumu ya moja kwa moja ya “nitainuka.”
- source_word: וְאֶקְבְּצָה ... אֶת כָּל יִשְׂרָאֵל
  choice: nikawakusanye Israeli wote
  rationale: Kitenzi קבץ hapa kinamaanisha kuwaleta pamoja watu wa makabila ya Israeli kwa kusudi la kisiasa la kumtambua Daudi kuwa mfalme.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: kwa bwana wangu mfalme
  rationale: Kirai hiki kinahifadhi heshima ya usemi wa kifalme na mwelekeo wa kuwaleta Israeli kwa Daudi.
- source_word: וְיִכְרְתוּ אִתְּךָ בְּרִית
  choice: ili wafanye agano nawe
  rationale: “Kufanya agano” ni Kiswahili cha kawaida kwa nahau ya Kiebrania כרת ברית, ambayo kwa neno moja moja ni “kukata agano.” Kiunganishi “ili” kinaonyesha kusudi au matokeo yanayokusudiwa katika muktadha.
- source_word: וּמָלַכְתָּ
  choice: nawe utawale
  rationale: Kitenzi hiki kinamaanisha kutenda kazi ya kifalme; “utawale” ni wazi na cha kawaida katika Kiswahili.
- source_word: בְּכֹל אֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: yote ambayo moyo wako unatamani
  rationale: נפשׁ hapa ni nafsi ya ndani kama kitovu cha tamaa. Kiswahili hutumia “moyo” kwa kawaida katika usemi huu, huku tanbihi ikihifadhi muundo wa Kiebrania “nafsi yako.”
- source_word: וַיְשַׁלַּח דָּוִד אֶת אַבְנֵר
  choice: Daudi akamruhusu Abneri aende
  rationale: Katika muktadha שלח ni kumwacha au kumruhusu mtu aondoke baada ya mazungumzo, si kumtuma kwa kazi nyingine. Tafsiri hii inaeleza maana hiyo bila kudokeza kufukuzwa.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: naye akaenda kwa amani
  rationale: Tafsiri hii inahifadhi nahau ya Kiebrania huku ikieleweka kuwa Abneri aliondoka salama na katika hali ya amani.
theological_decisions:
- issue: Lugha ya kufanya agano
  choice: wafanye agano nawe
  alternative: wakate agano nawe; waingie katika agano nawe
  rationale: Hili ni agano la kisiasa. “Kufanya agano” linaeleweka kwa urahisi na haliongezi maana ya kidhehebu; picha halisi ya Kiebrania imewekwa katika tanbihi.
- issue: Maana ya נפשׁ katika usemi wa kutamani
  choice: moyo wako unatamani
  alternative: nafsi yako inatamani; unayotamani
  rationale: “Moyo wako unatamani” ni usemi wa asili wa Kiswahili unaowasilisha nafsi ya ndani kama kitovu cha tamaa. Tanbihi inaonyesha wazi kwamba neno la Kiebrania ni “nafsi,” hivyo tofauti ya kimaana haijafichwa.
- issue: Upeo wa utawala unaotamaniwa
  choice: utawale yote ambayo moyo wako unatamani
  alternative: utawale kila mahali unapotamani; uwe mfalme juu ya yote unayotamani
  rationale: Kiebrania hakitaji wazi ikiwa “yote” ni maeneo, watu, au ufalme kwa ujumla. Tafsiri imehifadhi upana huo badala ya kuubana kuwa eneo pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka ya kibiblia, “Abneri” na “Daudi.” Muundo wa mazungumzo na mfuatano wa masimulizi umehifadhiwa bila kufanya lugha iwe ngumu.
