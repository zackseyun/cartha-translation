lexical_decisions:
- source_word: יָכֹל
  choice: hakuweza
  rationale: Kitenzi kinaonyesha uwezo; pamoja na ukanushi, “hakuweza” ni Kiswahili cha kawaida na sahihi.
- source_word: עוֹד
  choice: tena
  rationale: Katika kishazi kilichokanushwa, neno hili lina maana ya “si tena”; muundo “hakuweza tena” unasikika kwa kawaida.
- source_word: לְהָשִׁיב
  choice: kumjibu
  rationale: Hifili ya שוב hapa ina maana ya kujibu; kiambishi cha yambwa kinamtaja Abneri waziwazi.
- source_word: אֶת־אַבְנֵר
  choice: Abneri
  rationale: Jina limetolewa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: דָּבָר
  choice: neno lolote
  rationale: Katika muktadha wa ukanushi, “neno lolote” huwasilisha kwa lugha ya kawaida nahau ya Kiebrania ya kumjibu mtu neno, huku tanbihi ikihifadhi umbo lake halisi.
- source_word: מִיִּרְאָתוֹ
  choice: kwa sababu alimwogopa
  rationale: Kihusishi מִן pamoja na nomino ya hofu kinaonyesha sababu ya kutoweza kwake kujibu.
- source_word: אֹתוֹ
  choice: -mw- katika “alimwogopa”
  rationale: Kiambishi hiki kinamrejelea Abneri na kwa kawaida huunganishwa ndani ya kitenzi cha Kiswahili.
