  text: Naye hakuweza tena kumjibu Abneri neno lolote[a], kwa sababu alimwogopa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumjibu Abneri hata neno moja.” Nahau ya Kiebrania ni, kwa tafsiri halisi, “kumjibu Abneri neno.”
