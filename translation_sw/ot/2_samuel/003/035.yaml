base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/035.yaml
  text: Then all the people came to urge David to eat bread while it was still day[a], but David swore, saying, “May God do so to me, and more also[b], if before the sun goes down I taste bread or anything at all.”
translation:
  language: sw
  text: Kisha watu wote wakaja kumsihi Daudi ale mkate wakati bado ni mchana[a]. Lakini Daudi akaapa akisema, “Mungu na anitendee hivi, tena na zaidi[b], ikiwa nitaonja mkate au kitu chochote kabla ya jua kutua.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina neno “mkate”; hapa linaweza kumaanisha chakula kwa ujumla, lakini tafsiri imehifadhi neno halisi.
    reason: lexical_alternative
  - marker: b
    text: 'Huu ni muundo wa kawaida wa kiapo chenye laana ya kujitakia: “Mungu na anitendee hivi, tena na zaidi.” Adhabu yenyewe haitajwi wazi katika Kiebrania.'
    reason: cultural_note
lexical_decisions:
- source_word: לְהַבְרוֹת
  choice: kumsihi Daudi ale
  rationale: Hifili ya ברה katika muktadha huu inaonyesha kuwapa au kuwahimiza waombolezaji wale chakula. ‘Kumsihi ... ale’ ni Kiswahili cha kawaida kinachoonyesha jaribio la watu la kumfanya Daudi avunje mfungo wake.
- source_word: לֶחֶם
  choice: mkate
  rationale: Ingawa לֶחֶם inaweza kumaanisha chakula kwa ujumla, ‘mkate’ huhifadhi picha halisi ya Kiebrania; upana wa maana unaelezwa katika tanbihi.
- source_word: בְּעוֹד הַיּוֹם
  choice: wakati bado ni mchana
  rationale: Kirai hiki kinaonyesha kwamba mchana haukuwa umeisha, na kinaandaa rejeo linalofuata la kutua kwa jua.
- source_word: וַיִּשָּׁבַע
  choice: akaapa
  rationale: Hili ni neno la kawaida na la heshima kwa tendo la kutoa kiapo kizito.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יֹסִיף
  choice: Mungu na anitende hivi, tena na zaidi
  rationale: Uamuzi huu huhifadhi muundo wa laana ya kujitakia katika kiapo bila kubainisha adhabu ambayo Kiebrania yenyewe haijaitaja.
- source_word: כִּי אִם
  choice: ikiwa
  rationale: Katika muundo huu wa kiapo, kirai kinaanzisha sharti ambalo lingesababisha laana ya kujitakia.
- source_word: לִפְנֵי בּוֹא הַשֶּׁמֶשׁ
  choice: kabla ya jua kutua
  rationale: Hii ndiyo maana ya kawaida ya nahau ya Kiebrania, na ni wazi katika Kiswahili.
- source_word: אֶטְעַם
  choice: nitaonja
  rationale: ‘Kuonja’ huhifadhi maana halisi na msisitizo kwamba Daudi hatakula hata kiasi kidogo.
- source_word: אוֹ כָל מְאוּמָה
  choice: au kitu chochote
  rationale: Kirai hiki kinapanua kiapo zaidi ya mkate na kuonyesha kwamba hatachukua chakula cha aina yoyote.
