  yaml_path: translation/ot/2_samuel/003/036.yaml
  text: And all the people recognized it[a], and it was good in their eyes; for everything the king did was good in the eyes of all the people.
translation:
  language: sw
  text: Watu wote wakalitambua jambo hilo, nalo likawa jema machoni pao[a]; kama vile yote aliyofanya mfalme yalivyokuwa mema machoni pa watu wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nalo likawapendeza.” Nahau ya Kiebrania inasema kihalisi, “likawa jema machoni pao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכִּירוּ
  choice: wakalitambua jambo hilo
  rationale: Kitenzi נכר katika Hiphil kinaweza kumaanisha kutambua, kufahamu, au kuona wazi. Kirai “jambo hilo” kinaweka wazi yambwa linalodokezwa na muktadha bila kufafanua kupita kiasi kile watu walichotambua.
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: nalo likawa jema machoni pao
  rationale: Tafsiri hii inadumisha nahau na taswira ya Kiebrania, huku maana ya kukubaliwa au kupendeza ikitolewa katika tanbihi.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה הַמֶּלֶךְ
  choice: kama vile yote aliyofanya mfalme
  rationale: “Kama vile” inadumisha nguvu ya ulinganisho ya כְּ badala ya kuibadili moja kwa moja kuwa kiunganishi cha sababu.
- source_word: טוֹב
  choice: mema
  rationale: Neno hili pana lina maana ya kuwa jema, la kupendeza, au linalokubalika. “Mema” linadumisha urudiaji wa mzizi wa wazo lililo katika וַיִּיטַב.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha hadhi lakini kinachoeleweka kwa urahisi. Nahau ya “jema machoni pao” imehifadhiwa kwa uaminifu kwa taswira ya Kiebrania, na maana yake ya kawaida imefafanuliwa katika tanbihi.
