base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/006.yaml
  text: While the war continued between the house of Saul and the house of David[a], Abner was strengthening himself in the house of Saul.
translation:
  language: sw
  text: Vita ilipoendelea kati ya nyumba ya Sauli na nyumba ya Daudi, Abneri alikuwa akijiimarisha[a] katika nyumba ya Sauli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa akizidi kuwa na nguvu katika nyumba ya Sauli.” Kitenzi cha Kiebrania kinaweza kumaanisha kuzidi kuwa na nguvu au kujiimarisha; hapa huenda kinadokeza kwamba Abneri alikuwa akiimarisha nafasi yake mwenyewe katika nyumba ya Sauli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּהְיוֹת הַמִּלְחָמָה
  choice: Vita ilipoendelea
  rationale: Muundo huu unaanzisha hali ya wakati inayoendelea. Kiswahili hiki ni cha kawaida na kinaonyesha kwamba vita vilikuwa vinaendelea bila kuongeza neno la wazi la maana ya ‘sasa’ ambalo halimo katika chanzo.
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: kati ya nyumba ya Sauli na nyumba ya Daudi
  rationale: ‘Nyumba’ inadumisha upana wa sitiari ya Kiebrania, inayoweza kumaanisha jamaa, ukoo wa kifalme, au upande wa kisiasa; ‘nasaba’ ingekuwa finyu zaidi.
- source_word: וְאַבְנֵר
  choice: Abneri
  rationale: Jina limetolewa kwa umbo lililozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: הָיָה מִתְחַזֵּק
  choice: alikuwa akijiimarisha
  rationale: Kitenzi cha Kiebrania katika hithpael kinaweza kueleza kujifanya imara au kuendelea kupata nguvu. ‘Akijiimarisha’ kinahifadhi mwelekeo wa kujinufaisha au kuimarisha nafasi yake bila kuufanya ufafanuzi huo kuwa wa lazima.
- source_word: בְּבֵית שָׁאוּל
  choice: katika nyumba ya Sauli
  rationale: ‘Katika’ kinaonyesha eneo la kijamii na kisiasa ambamo Abneri aliimarisha nafasi yake, huku ‘nyumba’ ikidumisha utata halisi wa kifamilia na wa kisiasa.
theological_decisions:
- issue: Maana ya מִתְחַזֵּק
  choice: alikuwa akijiimarisha
  alternative: alikuwa akizidi kuwa na nguvu
  rationale: Maandishi yanaweza kumaanisha kwamba Abneri alijenga mamlaka yake mwenyewe au kwamba alizidi tu kuwa na nguvu. Tafsiri kuu inadumisha uzito wa kirejeshi wa umbo la Kiebrania, na tanbihi inaonyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Nyumba ya Sauli/Daudi’ imehifadhiwa kwa sababu ina maana pana kuliko ‘familia’ au ‘nasaba.’ Alama ya tanbihi imewekwa baada ya kishazi kinachohusika moja kwa moja.
