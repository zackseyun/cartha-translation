base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/001.yaml
  text: The war between the house of Saul and the house of David was prolonged[a], and David kept growing stronger[b], while the house of Saul kept growing weaker.
translation:
  language: sw
  text: Vita kati ya nyumba ya Sauli na nyumba ya Daudi[b] vilidumu kwa muda mrefu[a]. Daudi akaendelea kuwa na nguvu zaidi, huku nyumba ya Sauli ikiendelea kudhoofika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “vilikuwa virefu”; hapa neno la Kiebrania linaonyesha kwamba vita vilidumu kwa muda mrefu.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba” inaweza kumaanisha watu wa nyumbani, ukoo au nasaba inayotawala; hapa neno hilo huenda lina nguvu za kifamilia na kisiasa kwa pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה אֲרֻכָּה
  choice: Vita ... ilidumu kwa muda mrefu
  rationale: Kivumishi אֲרֻכָּה ni ‘ndefu’ kwa maana halisi, lakini hapa kinaeleza muda wa vita. Kiswahili cha kawaida hueleza jambo hilo kwa ‘ilidumu kwa muda mrefu.’
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: kati ya nyumba ya Sauli na nyumba ya Daudi
  rationale: ‘Nyumba’ inadumisha upana wa בֵּית, ambayo inaweza kumaanisha jamaa, ukoo, watu wa upande fulani, au nasaba ya kifalme; ‘nasaba’ pekee ingefinya maana.
- source_word: וְדָוִד הֹלֵךְ וְחָזֵק
  choice: Daudi akaendelea kuwa na nguvu zaidi
  rationale: Muundo wa הֹלֵךְ pamoja na sifa inayofuata unaonyesha maendeleo yanayoendelea. ‘Akaendelea kuwa na nguvu zaidi’ ni wa asili na huhifadhi ulinganisho.
- source_word: וּבֵית שָׁאוּל הֹלְכִים וְדַלִּים
  choice: huku nyumba ya Sauli ikiendelea kudhoofika
  rationale: Muundo huu unaonyesha hali ya kuendelea kupungua kwa nguvu. ‘Kudhoofika’ huwasilisha kudidimia kwa uwezo wa kisiasa na kijeshi, si umaskini wa mali.
theological_decisions:
- issue: Maana ya ‘nyumba’ katika pande za Sauli na Daudi
  choice: Kudumisha ‘nyumba’ katika maandishi na kufafanua wigo wake katika tanbihi
  alternative: Kutafsiri ‘nasaba ya kifalme’ au ‘ukoo’
  rationale: Kiebrania kinaweza kuwa na nguvu za kifamilia na kisiasa kwa pamoja; kuchagua maana moja tu kungesuluhisha kimyakimya utata halisi wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi mbili zinaboresha usomaji bila kupoteza uendelevu na utofautishaji wa Kiebrania. Kiunganishi cha mwanzo hakijatafsiriwa kwa neno la muda lisilokuwapo wazi katika chanzo.
