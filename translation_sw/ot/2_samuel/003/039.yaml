base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/039.yaml
  text: And I am still weak today[a], though anointed king; and these men, the sons of Zeruiah, are too harsh for me[b]. May Yahweh repay the evildoer according to his evil.
translation:
  language: sw
  text: Nami leo bado ni dhaifu[a], ingawa nimetiwa mafuta kuwa mfalme; na watu hawa, wana wa Seruya, ni wakali kupita kiasi kwangu. Yahwe na amlipe mtenda maovu kulingana na uovu wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nami leo bado ni mwororo.” Kivumishi cha Kiebrania kinaweza kumaanisha “mwororo/laini” au, katika muktadha huu, “dhaifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Yahwe atamlipa mtenda maovu kulingana na uovu wake.” Kitenzi cha Kiebrania kinaweza pia kueleweka kama taarifa ya wakati ujao.
    reason: alternative_reading
lexical_decisions:
- source_word: רַךְ
  choice: dhaifu
  rationale: Katika muktadha huu Daudi anaeleza udhaifu wake wa kisiasa na kutoweza kuwazuia wana wa Seruya. ‘Dhaifu’ huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku maana ya msingi ‘laini/mwororo’ ikihifadhiwa katika tanbihi.
- source_word: וּמָשׁוּחַ מֶלֶךְ
  choice: ingawa nimetiwa mafuta kuwa mfalme
  rationale: 'Muunganiko wa sentensi unaonyesha hali zinazokinzana: Daudi ni dhaifu licha ya kuwa ametiwa mafuta kuwa mfalme. ‘Ingawa’ huonyesha uhusiano huo kwa kawaida bila kubadili madai ya kifungu.'
- source_word: בְּנֵי צְרוּיָה
  choice: wana wa Seruya
  rationale: Huhifadhi mtindo rasmi wa ukoo unaowatambulisha Yoabu na ndugu zake.
- source_word: קָשִׁים מִמֶּנִּי
  choice: ni wakali mno nisiweze kuwazuia
  rationale: קָשִׁים huonyesha ukali au ugumu, na מִמֶּנִּי hapa hudokeza kwamba Daudi hana uwezo wa kukabiliana nao. Tafsiri hii ya Kiswahili inaonyesha ukatili wao pamoja na kutoweza kwa Daudi kuwazuia.
- source_word: יְשַׁלֵּם
  choice: na amlipe
  rationale: Kauli hii inasomeka kwa kawaida kama ombi la hukumu ya Mungu katika muktadha huu. Uwezekano wa kuisoma kama wakati ujao umeonyeshwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: לְעֹשֵׂה הָרָעָה
  choice: mtenda maovu
  rationale: Ni tafsiri fupi na ya kawaida ya kirai cha kisifa kinachomaanisha mtu atendaye uovu.
- source_word: כְּרָעָתוֹ
  choice: kulingana na uovu wake
  rationale: Huhifadhi wazo la malipo yanayolingana na uovu wa mtendaji bila kubainisha zaidi ikiwa ni tabia au tendo maalumu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יהוה; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya kauli ya mwisho ya Daudi
  choice: 'ombi la hukumu: ‘Yahwe na amlipe’'
  alternative: 'taarifa ya wakati ujao: ‘Yahwe atamlipa’'
  rationale: Katika muktadha Daudi anamwachia Mungu kisasi, hivyo kauli ya ombi inafaa; hata hivyo, umbo la Kiebrania linaweza pia kueleweka kama taarifa ya wakati ujao, na uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku misamiati ya kifalme na ya hukumu ikibaki rasmi kiasi. Alama zote za tanbihi zimewekwa mahali zinapohusika katika matini.
