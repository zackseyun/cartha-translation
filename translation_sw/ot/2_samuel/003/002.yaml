  yaml_path: translation/ot/2_samuel/003/002.yaml
  text: Sons were born to David in Hebron[a], and his firstborn was Amnon, by Ahinoam the Jezreelitess.
translation:
  language: sw
  text: Daudi akazaliwa wana huko Hebroni. Mzaliwa wake wa kwanza alikuwa Amnoni, wa Ahinoamu, Myezreeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwanamke wa Yezreeli” au “mwanamke kutoka Yezreeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/ילדו
  choice: alizaliwa wana
  rationale: Muundo huu unadumisha maana ya tendo la kuzaliwa na kumweka Daudi kama anayehusishwa na wana hao, bila kuwafanya akina mama kuwa kiima kisichotajwa katika Kiebrania.
- source_word: לְ/דָוִד
  choice: Daudi alizaliwa
  rationale: Kiambishi לְ kinaonyesha uhusiano na Daudi kama baba; Kiswahili kinaweza kuwasilisha hilo kwa muundo wa kwamba Daudi alizaliwa wana.
- source_word: בָּנִים
  choice: wana
  rationale: Neno la Kiebrania linamaanisha watoto wa kiume hasa, kwa hiyo “wana” ni sahihi kuliko “watoto” kwa ujumla.
- source_word: בְּ/חֶבְרוֹן
  choice: huko Hebroni
  rationale: בְּ ni ya mahali; “huko Hebroni” ni usemi wa kawaida wa Kiswahili unaotaja mahali pa kuzaliwa.
- source_word: וַ/יְהִי
  choice: alikuwa
  rationale: Hapa kitenzi kinamtambulisha mzaliwa wa kwanza; “alikuwa” kinatoa maana hiyo kwa uwazi bila kuongezea uzito wa kiunganishi cha simulizi.
- source_word: בְכוֹר/וֹ
  choice: mzaliwa wake wa kwanza
  rationale: Huhifadhi wazo mahsusi la nafasi ya kwanza katika mpangilio wa kuzaliwa, badala ya kusema tu “mkubwa wake.”
- source_word: אַמְנוֹן
  choice: Amnoni
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: לַ/אֲחִינֹעַם
  choice: aliyezaliwa na Ahinoamu
  rationale: Katika orodha hii ya vizazi, לַ inaonyesha uzazi wa mama. Usemi huu ni wa asili katika Kiswahili na unamtambulisha Ahinoamu kama mama yake Amnoni.
- source_word: הַ/יִּזְרְעֵאלִת
  choice: mwanamke wa Yezreeli
  rationale: Jina hili la kike la mahali linamtambulisha Ahinoamu kwa asili yake; “mwanamke wa Yezreeli” ni wazi na la kawaida kuliko kuunda jina la kike lisilozoeleka.
