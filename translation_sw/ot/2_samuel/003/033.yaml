  text: And the king lamented over Abner and said[a], “Should Abner die as a fool dies?”
translation:
  language: sw
  text: Mfalme akamwombolezea Abneri, akasema,[a] “Je, ilimpasa Abneri afe kama mpumbavu afavyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Je, Abneri afe kama mpumbavu afavyo?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: akamwombolezea
  rationale: Kitenzi קונן humaanisha kuimba au kutamka ombolezo rasmi. ‘Akamwombolezea’ ni Kiswahili cha kawaida chenye hadhi na kinafaa kwa kuwa maneno ya ombolezo yanafuata.
- source_word: אֶל
  choice: Abneri (kama yambwa ya ‘akamwombolezea’)
  rationale: Pamoja na kitenzi cha kuomboleza, אֶל humtaja anayelengwa na ombolezo. Muundo wa Kiswahili ‘kumwombolezea Abneri’ unawasilisha maana hiyo kwa ufasaha.
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Nomino yenye kibainishi humrejelea mfalme, yaani Daudi katika muktadha; hakuna haja ya kubadili na kuweka jina lake.
- source_word: וַיֹּאמַר
  choice: akasema
  rationale: Hiki ni kitenzi cha kawaida cha kusema kinachoanzisha maneno yaliyonukuliwa, ingawa maneno hayo ni ya kishairi.
- source_word: הַכְּמוֹת
  choice: Je, ilimpasa ... afe kama ... afavyo?
  rationale: Kirai hiki kihalisi hulinganisha kifo cha Abneri na kifo cha mpumbavu. Swali la balagha lenye ‘ilimpasa’ linaonyesha vizuri mshangao na upinzani wa ombolezo bila kulifanya kuwa taarifa tambarare.
- source_word: נָבָל
  choice: mpumbavu
  rationale: נבל humaanisha mtu mpumbavu na mara nyingi mwenye upotovu au tabia ya aibu. ‘Mpumbavu’ ni neno la moja kwa moja linalohifadhi mwangwi wa kibiblia bila kuongeza ufafanuzi wa kiitikadi.
- source_word: יָמוּת
  choice: afe
  rationale: Hali ya kitenzi hiki ndani ya swali la balagha inaelezwa kwa kawaida kwa ‘afe’; pamoja na ‘ilimpasa’ inawasilisha malalamiko ya ombolezo.
- source_word: אַבְנֵר
  choice: Abneri
  rationale: Jina limeandikwa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi na hadhi ya ombolezo. ‘Akamwombolezea’ hufafanua tendo la kutamka ombolezo kuliko neno la jumla ‘akamwomboleza.’ Alama ya tanbihi [a] imewekwa baada ya kitenzi cha utangulizi ili kutoa muundo rasmi zaidi wa swali.
