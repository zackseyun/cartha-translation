base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/031.yaml
  text: Then David said to Joab and to all the people who were with him[a], “Tear your clothes, gird yourselves with sackcloth, and mourn before Abner.” And King David was walking behind the bier.
translation:
  language: sw
  text: Kisha Daudi akamwambia Yoabu na watu wote waliokuwa pamoja naye, “Rarueni nguo zenu, jifungeni magunia, na mwomboleze mbele ya Abneri.” Naye Mfalme Daudi alikuwa akitembea nyuma ya machela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kitanda cha mazishi” au “kitanda cha kubebea maiti.” Neno la Kiebrania mara nyingi humaanisha “kitanda,” lakini hapa linamaanisha kitanda, machela, au jukwaa ambalo mwili wa Abneri ulibebwa juu yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְעוּ בִגְדֵיכֶם
  choice: Rarueni nguo zenu
  rationale: Amri ya wingi inaeleza desturi ya kurarua mavazi kama ishara ya maombolezo; ‘rarueni’ ni ya kawaida na yenye nguvu inayofaa muktadha.
- source_word: וְחִגְרוּ שַׂקִּים
  choice: jifungeni nguo za magunia
  rationale: Kitenzi חגר kina maana ya kujifunga au kujizungushia; tafsiri hii inahifadhi tendo hilo kuliko kusema tu ‘vaeni,’ huku ‘nguo za magunia’ ikieleweka kwa msomaji wa kisasa.
- source_word: וְסִפְדוּ
  choice: na mwomboleze
  rationale: ספד huonyesha maombolezo rasmi kwa ajili ya marehemu; ‘mwomboleze’ ni neno la kawaida na sahihi katika Kiswahili.
- source_word: לִפְנֵי אַבְנֵר
  choice: mbele ya Abneri
  rationale: Tafsiri ya karibu inayohifadhi uwezekano wa kumaanisha mbele ya mwili wa Abneri katika msafara wa mazishi.
- source_word: הֹלֵךְ אַחֲרֵי
  choice: alikuwa akitembea nyuma ya
  rationale: Umbo la participle linaonyesha tendo linaloendelea, na אַחֲרֵי hapa lina maana ya mahali katika msafara.
- source_word: הַמִּטָּה
  choice: jeneza
  rationale: Ingawa neno hili mara nyingi humaanisha kitanda, hapa ni chombo au jukwaa lililobeba mwili katika msafara wa mazishi; ‘jeneza’ ni neno la Kiswahili linaloeleweka zaidi, huku tanbihi ikihifadhi maana pana ya neno la Kiebrania.
- source_word: וְהַמֶּלֶךְ דָּוִד
  choice: Naye Mfalme Daudi
  rationale: Muundo huu unamtambulisha Daudi katika nafasi yake ya kifalme na unasikika kwa kawaida katika Kiswahili.
