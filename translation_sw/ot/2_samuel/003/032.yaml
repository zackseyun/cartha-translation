  text: They buried Abner in Hebron[a], and the king lifted up his voice and wept at Abner’s grave, and all the people wept.
translation:
  language: sw
  text: Wakamzika Abneri Hebroni. Mfalme akapaza sauti yake, akalia kwenye kaburi la Abneri[a], na watu wote wakalia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuelekea kaburi la Abneri.” Kihusishi cha Kiebrania kinaweza kutafsiriwa kwa maana hiyo ya moja kwa moja zaidi, lakini muktadha unapendelea maana ya kawaida, “kwenye kaburi la Abneri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: Wakamzika
  rationale: Kitenzi cha Kiebrania ni Qal wayyiqtol, nafsi ya tatu wingi, kutoka קבר, yaani ‘kuzika.’ Kiunganishi wa- kinadumisha mfuatano wa simulizi kwa Kiswahili cha kawaida.
- source_word: בְּחֶבְרוֹן
  choice: huko Hebroni
  rationale: Kihusishi ב hapa kinaonyesha mahali. ‘Huko Hebroni’ ni usemi wa kawaida wa Kiswahili na unaweka wazi kuwa maziko yalifanyika katika mji huo.
- source_word: וַיִּשָּׂא ... אֶת קוֹלוֹ
  choice: akapaza sauti yake
  rationale: Huu ni msemo wa Kiebrania unaoonyesha kutoa sauti kwa nguvu, hasa katika maombolezo. ‘Kupaza sauti’ huhifadhi uzito na tabia ya kifasihi ya msemo huo.
- source_word: וַיֵּבְךְּ
  choice: na kulia
  rationale: בכה humaanisha kulia au kutoa machozi. ‘Kulia’ ni neno la kawaida na lenye heshima katika muktadha wa mazishi.
- source_word: אֶל קֶבֶר אַבְנֵר
  choice: kwenye kaburi la Abneri[a]
  rationale: Ingawa אֶל mara nyingi humaanisha ‘kwenda’ au ‘kuelekea,’ katika muktadha huu inaeleweka kwa kawaida kama mahali ambapo mfalme aliomboleza. Tanbihi inadumisha maana halisi inayowezekana.
- source_word: וַיִּבְכּוּ כָּל הָעָם
  choice: watu wote wakalia
  rationale: Kurudiwa kwa בכה kumehifadhiwa kwa ‘wakalia,’ na כָּל הָעָם limetafsiriwa kwa kawaida kuwa ‘watu wote.’
