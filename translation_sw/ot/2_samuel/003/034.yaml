base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/034.yaml
  text: Your hands were not bound[a], and your feet were not put into bronze fetters; as one falls before sons of injustice, so you have fallen. And all the people wept over him even more.
translation:
  language: sw
  text: 'Mikono yako haikufungwa,

    wala miguu yako haikutiwa pingu za shaba;

    kama mtu aangukavyo mbele ya wana wa uovu[a],

    divyo ulivyoanguka.


    Nao watu wote wakazidi kumlilia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa lugha ya kawaida zaidi, “watu waovu” au “watenda maovu.” Kiebrania kinasema kihalisi, “wana wa uovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֶךָ לֹא אֲסֻרוֹת
  choice: Mikono yako haikufungwa
  rationale: Kitenzi אָסַר katika hali ya kutendwa humaanisha kufungwa. “Haikufungwa” ni Kiswahili cha kawaida na huhifadhi tofauti inayodokezwa kati ya Abneri na mfungwa.
- source_word: וְרַגְלֶיךָ לֹא לִנְחֻשְׁתַּיִם הֻגָּשׁוּ
  choice: wala miguu yako haikutiwa pingu za shaba
  rationale: נְחֻשְׁתַּיִם ni vizuizi vya miguu vya shaba au shaba nyekundu. “Pingu za shaba” huhifadhi aina ya kifungo na nyenzo yake; הֻגָּשׁוּ imetafsiriwa kwa maana yake ya kimuktadha ya kutiwa katika pingu.
- source_word: כִּנְפוֹל
  choice: kama mtu aangukavyo
  rationale: Muundo huu ni wa ulinganisho. Kutaja “mtu” kunafanya sentensi iwe ya asili katika Kiswahili huku ulinganisho wa jumla ukidumishwa.
- source_word: לִפְנֵי בְנֵי עַוְלָה
  choice: mbele ya wana wa uovu
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania, “wana wa uovu,” bila kuficha nahau yake. Maana ya kawaida zaidi imeelezwa katika tanbihi.
- source_word: נָפָלְתָּ
  choice: ndivyo ulivyoanguka
  rationale: Kauli timilifu inaeleza tukio lililokamilika katika maombolezo. Muundo “ndivyo ulivyoanguka” unakamilisha ulinganisho kwa Kiswahili cha kawaida.
- source_word: וַיֹּסִפוּ כָל הָעָם לִבְכּוֹת עָלָיו
  choice: Ndipo watu wote wakazidi kumlilia
  rationale: יָסַף pamoja na kitenzi-jina huonyesha kuendelea au kuongeza tendo. “Wakazidi kumlilia” huwasilisha kwa ufupi kuongezeka au kuendelea kwa kilio baada ya maombolezo ya Daudi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi unaofaa maombolezo lakini unaoeleweka kwa wasomaji wa sasa. Mistari imepangwa ili kudumisha ulinganifu wa shairi la Kiebrania. Alama ya tanbihi imewekwa baada ya “wana wa uovu,” ambako maelezo yake yanahusika.
