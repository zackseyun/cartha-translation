base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/030.yaml
  text: So Joab and Abishai his brother killed Abner because he had killed Asahel their brother at Gibeon in the battle[a].
translation:
  language: sw
  text: Kwa hiyo Yoabu na Abishai, ndugu yake Yoabu, wakamuua Abneri kwa sababu alikuwa amemuua Asaheli, ndugu yao, huko Gibeoni katika vita vile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Naye Yoabu na Abishai, ndugu yake Yoabu, wakamuua Abneri.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa kwa urahisi kuwa “naye”; “kwa hiyo” huonyesha uhusiano wa maelezo na muktadha unaozunguka.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ לְאַבְנֵר
  choice: wakamuua Abneri
  rationale: Kitenzi הרג kinamaanisha kuua; kiambishi cha yambwa -m- na jina Abneri huleta Kiswahili cha kawaida bila kuongeza hukumu ya kisheria kama ‘walimwua kwa mauaji ya kukusudia’.
- source_word: עַל אֲשֶׁר
  choice: kwa sababu
  rationale: Kirai hiki kinaeleza sababu ya kitendo; ‘kwa sababu’ ni sawia na ya kawaida katika Kiswahili.
- source_word: הֵמִית
  choice: alikuwa amemuua
  rationale: Hiphil ya מות ina maana ya kusababisha kifo. Muundo ‘alikuwa amemuua’ unaonyesha kwamba kifo cha Asaheli kilitangulia kuuawa kwa Abneri.
- source_word: אֲחִיו / אֲחִיהֶם
  choice: ndugu yake / ndugu yao
  rationale: Kwanza Abishai anatambulishwa kuwa ndugu ya Yoabu; kisha Asaheli anatambulishwa kuwa ndugu yao wote wawili. Tofauti hiyo imehifadhiwa.
- source_word: בְּגִבְעוֹן
  choice: huko Gibeoni
  rationale: ‘Huko’ huonyesha kwa kawaida mahali ambapo tukio hilo la awali lilitokea; Gibeoni ni umbo la jina linalotumika katika Kiswahili cha Biblia.
- source_word: בַּמִּלְחָמָה
  choice: katika vita vile
  rationale: Kibainishi cha Kiebrania kinaelekeza kwenye vita maalumu inayojulikana katika simulizi; ‘vita vile’ huhifadhi urejeo huo.
- source_word: וְ / וַ
  choice: Kwa hiyo
  rationale: Kiunganishi hapa kinaunganisha mstari huu na maelezo yaliyotangulia kwa namna ya hitimisho au ufafanuzi. ‘Kwa hiyo’ huleta uhusiano huo wazi; ‘Naye’ au ‘Na’ pia inawezekana.
