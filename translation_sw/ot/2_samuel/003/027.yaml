  text: וַ/יָּ֤שָׁב אַבְנֵר֙ חֶבְר֔וֹן וַ/יַּטֵּ֤/הוּ יוֹאָב֙ אֶל תּ֣וֹךְ הַ/שַּׁ֔עַר לְ/דַבֵּ֥ר אִתּ֖/וֹ בַּ/שֶּׁ֑לִי וַ/יַּכֵּ֤/הוּ שָׁם֙ הַ/חֹ֔מֶשׁ וַ/יָּ֕מָת בְּ/דַ֖ם עֲשָׂה אֵ֥ל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/027.yaml
  text: When Abner returned to Hebron[a], Joab drew him aside into the middle of the gate to speak with him privately, and there he struck him in the belly, so that he died, for the blood of Asahel his brother.
translation:
  language: sw
  text: Abneri aliporudi Hebroni, Yoabu akampeleka kando hadi ndani ya lango ili azungumze naye kwa faragha, na huko akampiga tumboni[a], naye akafa, kwa sababu ya damu ya Asaheli ndugu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tafsiri ya jadi ni “kwenye ubavu wa tano”; neno hilo hapa linaelekea kutaja eneo la tumbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: aliporudi
  rationale: Kitenzi שוב kina maana ya kurudi; hapa Abneri anarudi Hebroni baada ya kuondoka huko.
- source_word: וַיַּטֵּהוּ
  choice: akamvuta kando
  rationale: Hifili ya נטה huonyesha kumgeuza au kumwelekeza mtu pembeni; ‘akamvuta kando’ ni ya asili katika Kiswahili na inadokeza mwelekeo bila kuongeza maelezo ya nia.
- source_word: אֶל־תּוֹךְ הַשַּׁעַר
  choice: mpaka katikati ya lango
  rationale: תוך ni sehemu ya ndani au katikati, na שער hapa ni eneo la lango la mji; tafsiri hii huhifadhi taswira ya Kiebrania.
- source_word: לְדַבֵּר אִתּוֹ בַּשֶּׁלִי
  choice: ili azungumze naye kwa faragha
  rationale: בַּשֶּׁלִי ni usemi mgumu unaoweza kudokeza utulivu, usiri, au hali ya kutosumbuliwa. ‘Kwa faragha’ inafaa katika muktadha bila kueleza zaidi ya simulizi.
- source_word: וַיַּכֵּהוּ שָׁם הַחֹמֶשׁ
  choice: huko akampiga tumboni[a]
  rationale: חֹמֶשׁ katika masimulizi haya ya mauaji inaelekea kutaja eneo la tumbo; ‘tumboni’ hutoa maana inayoeleweka, huku tafsiri ya jadi ikihifadhiwa katika tanbihi.
- source_word: וַיָּמָת
  choice: naye akafa
  rationale: Huhifadhi mwendelezo wa moja kwa moja wa simulizi la Kiebrania bila kulazimisha kiunganishi cha kusudi.
- source_word: בְּדַם עֲשָׂהאֵל אָחִיו
  choice: kwa sababu ya damu ya Asaheli ndugu yake
  rationale: בְּ hapa inaonyesha sababu au kichocheo. Kauli hii huhifadhi lugha ya damu na uhusiano wa kindugu bila kuongeza kwamba kisasi hicho kilikuwa halali.
theological_decisions:
- issue: Je, kifo cha Abneri kielezwe wazi kuwa kisasi kilichohalalishwa?
  choice: kwa sababu ya damu ya Asaheli ndugu yake
  alternative: ili kulipiza kisasi kwa ajili ya Asaheli ndugu yake
  rationale: Kiebrania kinataja damu ya Asaheli kama sababu au kichocheo lakini hakisemi hapa kwamba tendo la Yoabu lilikuwa la haki; tafsiri haipaswi kuongeza hukumu hiyo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Majina yametolewa kwa maumbo yaliyozoeleka ya kibiblia: Abneri, Yoabu, na Asaheli. Sentensi inafuata mfululizo wa matendo wa Kiebrania na haiongezi tathmini ya kimaadili ya mauaji.'
