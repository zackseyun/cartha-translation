base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/012.yaml
  text: Then Abner sent messengers to David on his behalf[a], saying, “To whom does the land belong?” saying, “Make your covenant with me, and behold[b], my hand is with you to bring all Israel over to you.”
translation:
  language: sw
  text: Ndipo Abneri akatuma wajumbe kwa Daudi kwa niaba yake[a], akisema, “Nchi ni ya nani?” na pia akisema, “Fanya agano lako nami. Tazama, mkono wangu uko pamoja nawe[b], ili niwalete Israeli wote upande wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaweza kutafsiriwa kihalisi, “badala yake” au “katika nafasi yake”; hapa maana yake yaelekea kuwa kwamba wajumbe walimwakilisha Abneri.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mkono wangu uko pamoja nawe,” nahau inayoonyesha kwamba msaada na uwezo wa Abneri ungekuwa upande wa Daudi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תחתו
  choice: kwa niaba yake
  rationale: Katika muktadha huu neno hilo linaonyesha kwamba wajumbe walitumwa wakimwakilisha Abneri. Hii ni Kiswahili cha kawaida kuliko tafsiri halisi ‘mahali pake.’
- source_word: לְמִי אָרֶץ
  choice: Nchi ni ya nani?
  rationale: Huhifadhi swali fupi la Kiebrania na utata wake kuhusu umiliki au haki ya kutawala bila kulipanua kuwa dai la moja kwa moja.
- source_word: כָּרְתָה בְרִיתְךָ אִתִּי
  choice: Fanya agano lako nami
  rationale: ‘Kufanya agano’ ni Kiswahili cha asili kwa nahau ya Kiebrania ‘kukata agano,’ na ‘lako’ huhifadhi kiambishi cha nafsi ya pili katika בְרִיתְךָ.
- source_word: וְהִנֵּה יָדִי עִמָּךְ
  choice: Tazama, mkono wangu uko upande wako
  rationale: Huhifadhi taswira ya ‘mkono’ huku ikieleza kwa Kiswahili kinachoeleweka kwamba nguvu na msaada wa Abneri vitakuwa upande wa Daudi.
- source_word: לְהָסֵב אֵלֶיךָ
  choice: ili niwalete ... upande wako
  rationale: Kauli hii inaonyesha kuhamisha utii wa kisiasa kuelekea kwa Daudi; ‘kuwaleta upande wako’ ni ya kawaida na huhifadhi mwelekeo huo.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Hurejelea taifa au makabila yote ya Israeli kama jumuiya.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika mazingira haya ya kisiasa, neno linamaanisha wanadamu waliotumwa, si malaika.
theological_decisions:
- issue: Maana ya swali לְמִי אָרֶץ kuhusu nchi na utawala
  choice: Nchi ni ya nani?
  alternative: Nani anayepaswa kuitawala nchi? / Nchi ni yangu kuitoa.
  rationale: Kiebrania ni kifupi na kinaweza kugusia umiliki, mamlaka, au haki ya kutawala. Swali la moja kwa moja huhifadhi mvutano huo bila kuamua dai kamili la Abneri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya vitenzi vya kusema yamelainishwa kuwa ‘akisema ... Kisha akasema’ ili kuhifadhi muundo wa Kiebrania bila kufanya sentensi iwe nzito. Taswira ya ‘mkono’ imehifadhiwa kwa sababu ina uzito wa kisiasa katika ahadi ya Abneri.
