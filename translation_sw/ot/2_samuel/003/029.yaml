  text: יָחֻ֨לוּ֙ עַל רֹ֣אשׁ יוֹאָ֔ב וְ/אֶ֖ל כָּל בֵּ֣ית אָבִ֑י/ו וְֽ/אַל יִכָּרֵ֣ת מִ/בֵּ֣ית יוֹאָ֡ב זָ֠ב וּ/מְצֹרָ֞ע וּ/מַחֲזִ֥יק בַּ/פֶּ֛לֶךְ וְ/נֹפֵ֥ל בַּ/חֶ֖רֶב וַ/חֲסַר לָֽחֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/029.yaml
  text: May it fall on the head of Joab and on all his father’s house[a], and may there never be cut off from the house of Joab one who has a discharge, or is leprous, or holds a staff, or falls by the sword[b], or lacks bread.
translation:
  language: sw
  text: Na iangukie kichwa cha Yoabu na juu ya nyumba yote ya baba yake; wala katika nyumba ya Yoabu asikosekane kamwe mtu mwenye tatizo la kutokwa na majimaji mwilini, au mwenye ukoma[a], au anayeshika kipini cha kusokotea uzi[b], au aangukaye kwa upanga, au anayekosa chakula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana pana zaidi, “mwenye ugonjwa wa ngozi unaotia unajisi.” Neno la Kiebrania linalotafsiriwa kwa desturi kuwa “ukoma” linaweza kutaja magonjwa mbalimbali makali ya ngozi.
    reason: lexical_alternative
  - marker: b
    text: Au “anayeshika fimbo”; wengine huelewa kifungu hiki kuwa “anayeegemea fimbo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֻלוּ עַל רֹאשׁ
  choice: Na iangukie kichwa cha
  rationale: Inahifadhi nahau ya Kiebrania ya hatia au adhabu kumwangukia mtu, huku kiwakilishi ‘i-’ kikirejelea kwa muktadha hatia ya damu ya Abneri iliyotajwa katika mstari uliotangulia.
- source_word: כָּל בֵּית אָבִיו
  choice: nyumba yote ya baba yake
  rationale: ‘Nyumba’ inadumisha maana ya kifamilia na kizazi ya בַּיִת bila kuibana kuwa familia ya karibu tu.
- source_word: אַל יִכָּרֵת מִבֵּית יוֹאָב
  choice: nyumba ya Yoabu isikose kamwe
  rationale: Hii ni Kiswahili cha asili kinachoonyesha kwamba watu wenye mateso yaliyotajwa wasikome katika ukoo wa Yoabu; ‘kamwe’ huweka nguvu ya laana ya Kiebrania.
- source_word: זָב
  choice: mtu mwenye tatizo la kutokwa na majimaji mwilini
  rationale: Inaeleza hali ya kutokwa na majimaji ya mwili bila kuibainisha kimakosa kuwa usaha au ugonjwa mmoja maalumu.
- source_word: מְצֹרָע
  choice: mwenye ukoma
  rationale: ‘Ukoma’ ni istilahi ya jadi, fupi na inayotambulika; tanbihi inaonyesha kwamba neno la Kiebrania linaweza kutaja magonjwa mbalimbali makali ya ngozi, si ugonjwa wa Hansen pekee.
- source_word: מַחֲזִיק בַּפֶּלֶךְ
  choice: anayeshika kijiti cha kusokotea nyuzi
  rationale: פֶּלֶךְ kwa kawaida ni kifaa cha kusokotea nyuzi. Tafsiri inahifadhi taswira halisi bila kuamua ikiwa inamaanisha udhaifu wa mwili au kazi iliyodharauliwa; maana mbadala ya fimbo imewekwa tanbihini.
- source_word: נֹפֵל בַּחֶרֶב
  choice: anayeanguka kwa upanga
  rationale: Inadumisha nahau na uzito wa mtindo wa Kiebrania badala ya kuifafanua tu kuwa ‘anayeuawa.’
- source_word: חֲסַר לָחֶם
  choice: anayekosa chakula
  rationale: Ingawa Kiebrania kinasema kihalisi ‘anayekosa mkate,’ hapa mkate unasimamia riziki kwa ujumla; ‘chakula’ ni wazi na cha kawaida katika Kiswahili.
theological_decisions:
- issue: Aina ya kauli ya Daudi
  choice: Ombi la laana au hukumu dhidi ya Yoabu na nyumba yake
  alternative: Utabiri wa moja kwa moja wa yatakayotokea
  rationale: Miundo ya matakwa katika Kiebrania (‘na iangukie,’ ‘isikose kamwe’) inaonyesha tamko la kutakia hukumu, si taarifa ya kawaida ya wakati ujao.
- issue: Kirejelewa kisichotajwa wazi cha יָחֻלוּ
  choice: Kiwakilishi kinarejelea kwa muktadha hatia ya damu ya Abneri
  alternative: Kutaja moja kwa moja ‘damu’ au ‘laana’ ndani ya mstari
  rationale: Mstari uliotangulia ndio unaotoa kirejelewa. Kutumia ‘i-’ kunadumisha utegemezi huo wa kimuktadha bila kuongeza nomino ambayo haipo wazi katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa laana na orodha yake umehifadhiwa; maneno ya kitabibu yamewekwa wazi bila kuwa ya kiufundi kupita kiasi. Alama za tanbihi zimewekwa mara baada ya maneno yanayohusika.
