base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/020.yaml
  text: Abner came to David at Hebron[a], and twenty men were with him. And David made a feast for Abner and for the men who were with him.
translation:
  language: sw
  text: Abneri akaja kwa Daudi huko Hebroni, akiwa pamoja na wanaume ishirini. Daudi akawaandalia Abneri na wanaume waliokuwa pamoja naye karamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaja
  rationale: Kitenzi בוא kinaweza kumaanisha ‘kuja,’ ‘kwenda,’ au ‘kufika’ kutegemea mtazamo. Kwa kuwa simulizi linamlenga Daudi kama alikokuwa akielekea Abneri, ‘akaja’ ni ya kawaida na inafaa.
- source_word: אֶל דָּוִד חֶבְרוֹן
  choice: kwa Daudi huko Hebroni
  rationale: Ingawa hakuna kihusishi kinachotangulia חֶבְרוֹן, muktadha unaonyesha kuwa Hebroni ni mahali Daudi alipokuwa. ‘Kwa Daudi huko Hebroni’ ni Kiswahili cha asili na kinahifadhi uhusiano huo.
- source_word: וְאִתּוֹ עֶשְׂרִים אֲנָשִׁים
  choice: akiwa pamoja na wanaume ishirini
  rationale: Kirai cha Kiebrania hakina kitenzi kilichoandikwa. ‘Akiwa pamoja na’ huleta maana hiyo kwa Kiswahili cha kawaida, na ‘wanaume’ huhifadhi maana ya אֲנָשִׁים katika muktadha huu.
- source_word: וַיַּעַשׂ ... מִשְׁתֶּה
  choice: akamwandalia ... karamu
  rationale: Usemi wa Kiebrania ni ‘akafanya karamu.’ Kiswahili ‘akamwandalia ... karamu’ huwasilisha kwa kawaida tendo la kuandaa karamu kwa ajili ya wageni bila kuongeza maana isiyokuwamo.
- source_word: מִשְׁתֶּה
  choice: karamu
  rationale: מִשְׁתֶּה ni karamu au sherehe yenye chakula na mara nyingi vinywaji. ‘Karamu’ ni pana, ya kawaida, na haiweke wazi kupita kiasi jambo la kunywa ambalo limedokezwa tu.
- source_word: לְאַבְנֵר וְלַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: Abneri na wanaume waliokuwa pamoja naye
  rationale: Tafsiri hii inawataja wazi Abneri na wenzake kama walengwa wa karamu, huku ikidumisha maelezo ya chanzo badala ya kuyafupisha kuwa ‘watu wake.’
