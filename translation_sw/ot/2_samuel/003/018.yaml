base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/018.yaml
  text: Now then[a], do it, for Yahweh has spoken concerning David, saying, ‘By the hand of my servant David I will save my people Israel from the hand of the Philistines and from the hand of all their enemies.’
translation:
  language: sw
  text: 'Basi, fanyeni hivyo, kwa maana Yahwe amesema juu ya Daudi, akisema: “Kwa mkono wa Daudi, mtumishi wangu, nitawaokoa watu wangu Israeli kutoka mkononi mwa Wafilisti na kutoka mkononi mwa adui zao wote.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa mkono wa Daudi, mtumishi wangu, atawaokoa watu wangu Israeli kutoka mkononi mwa Wafilisti na kutoka mkononi mwa adui zao wote.” Muundo wa Kiebrania unaweza kueleweka kuwa Daudi ndiye kiima cha kitenzi, badala ya Yahwe kuwa msemaji anayeeleweka kuwa anatenda kupitia Daudi.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Ni kiashiria cha mpito kinachounganisha yaliyotangulia na wito wa kuchukua hatua mara moja.
- source_word: עֲשׂוּ
  choice: fanyeni hivyo
  rationale: Imperativi ya wingi inaelekeza wasikilizaji kutekeleza jambo lililokuwa limejadiliwa.
- source_word: כִּי
  choice: kwa maana
  rationale: Inatoa msingi wa amri iliyotangulia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la Mungu lililoandikwa kwa herufi nne za Kiebrania badala ya kulibadili kuwa cheo.
- source_word: אָמַר אֶל דָּוִד לֵאמֹר
  choice: amesema juu ya Daudi
  rationale: Katika muktadha Abneri anarejelea neno la Yahwe kuhusu Daudi; אֶל inaweza kuwa na maana ya kuelekezwa kwa/kumhusu, na hapa 'juu ya' linaendana na yaliyomo katika nukuu.
- source_word: בְּיַד
  choice: kwa mkono wa
  rationale: Linahifadhi sitiari ya Kiebrania ya chombo au wakala, huku likieleweka katika Kiswahili.
- source_word: עַבְדִּי
  choice: mtumishi wangu
  rationale: Katika mazingira ya utume wa kifalme, 'mtumishi' huonyesha huduma na mamlaka aliyopewa na Mungu.
- source_word: הוֹשִׁיעַ
  choice: nitawaokoa
  rationale: Linasomwa katika usemi wa moja kwa moja wa Yahwe kama kauli ya nafsi ya kwanza, Yahwe akiwa mwokozi anayetenda kupitia Daudi.
- source_word: עַמִּי יִשְׂרָאֵל
  choice: watu wangu Israeli
  rationale: Linahifadhi umiliki wa agano na jina la taifa katika mpangilio wa kawaida wa Kiswahili.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: kutoka mkononi mwa Wafilisti
  rationale: Nahau ya 'mkono' inawakilisha nguvu au utawala wa adui.
- source_word: וּמִיַּד כָּל אֹיְבֵיהֶם
  choice: na kutoka mikononi mwa adui zao wote
  rationale: Linadumisha picha ya kuokolewa kutoka katika nguvu ya maadui na wigo kamili wa כָּל.
theological_decisions:
- issue: Kiima cha הוֹשִׁיעַ katika usemi ulionukuliwa
  choice: 'Yahwe ndiye msemaji na kiima kinachoeleweka: “nitawaokoa ... kwa mkono wa Daudi.”'
  alternative: 'Daudi ndiye kiima: “Daudi mtumishi wangu atawaokoa watu wangu Israeli.”'
  rationale: Umbo la Kiebrania linaweza kueleweka kwa namna zote mbili. Matini kuu inamwonyesha Yahwe kama mwokozi anayetenda kupitia Daudi, huku tanbihi ikihifadhi usomaji halisi unaowezekana wa Daudi kuwa kiima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Nahau ya 'mkono' imehifadhiwa kwa sababu inaeleweka na inadumisha taswira ya chanzo.
