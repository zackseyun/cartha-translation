source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח דָּוִד֙ מַלְאָכִ֔ים אֶל אִֽישׁ בֹּ֥שֶׁת בֶּן שָׁא֖וּל לֵ/אמֹ֑ר תְּנָ֤/ה אֶת אִשְׁתִּ/י֙ אֶת מִיכַ֔ל אֲשֶׁר֙ אֵרַ֣שְׂתִּי לִ֔/י בְּ/מֵאָ֖ה עָרְל֥וֹת פְּלִשְׁתִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/014.yaml
  text: Then David sent messengers to Ish-bosheth son of Saul[a], saying, “Give me my wife Michal[b], whom I betrothed to myself for a hundred Philistine foreskins.”
translation:
  language: sw
  text: Kisha Daudi akatuma wajumbe kwa Ish-boshethi mwana wa Sauli, akisema, “Nipe Mikali, mke wangu, niliyemposa awe wangu[a] kwa magovi mia ya Wafilisti.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kimazoea zaidi, “niliyempata kuwa mke wangu.” Kiebrania kinasema kwa maana ya karibu zaidi, “niliyemposa awe wangu.”
    reason: lexical_alternative
  - marker: b
    text: Tazama 1 Samweli 18:25–27 kuhusu Daudi kumpata Mikali baada ya kuleta magovi ya Wafilisti kuwa mahari aliyodai Sauli.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Kisha Daudi akatuma
  rationale: Muundo wa simulizi unaendeleza mfuatano wa matukio; “Kisha” ni wa asili katika Kiswahili bila kudokeza sababu isiyotajwa.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu neno linawahusu wajumbe wa kibinadamu, si malaika.
- source_word: אֶל אִישׁ בֹּשֶׁת בֶּן שָׁאוּל
  choice: kwa Ish-boshethi mwana wa Sauli
  rationale: Jina limetoholewa kwa namna inayosomeka katika Kiswahili, huku uhusiano wa kifamilia ukifuatwa kwa karibu.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hutambulisha usemi wa moja kwa moja kwa njia fupi na ya kawaida.
- source_word: תְּנָה
  choice: Nipe
  rationale: Ni amri ya moja kwa moja ya kitenzi נתן; haiongezi wazo la kumrudisha ambalo halijasemwa wazi katika kitenzi chenyewe.
- source_word: אֶת אִשְׁתִּי אֶת מִיכַל
  choice: Mikali, mke wangu
  rationale: Muundo wa ufafanuzi unamtambulisha Mikali kuwa mke anayedaiwa na Daudi; mpangilio huu ni wa asili katika Kiswahili.
- source_word: אֲשֶׁר אֵרַשְׂתִּי לִי
  choice: niliyemposa awe wangu
  rationale: “Posa” huhifadhi maana mahususi ya uchumba wa kisheria, na “awe wangu” huwakilisha לִי kwa Kiswahili cha kawaida bila kuifanya kuwa ndoa kwa ujumla.
- source_word: בְּמֵאָה
  choice: kwa ... mia
  rationale: “Kwa” huonyesha gharama au mahari ambayo kwa msingi wake Daudi alimpata Mikali.
- source_word: עָרְלוֹת פְּלִשְׁתִּים
  choice: magovi mia ya Wafilisti
  rationale: Tafsiri ya moja kwa moja inahifadhi maelezo halisi na makali ya mahari iliyodaiwa katika 1 Samweli 18.
theological_decisions:
- issue: Istilahi ya hali ya ndoa ya Mikali
  choice: Kutafsiri אִשְׁתִּי kuwa “mke wangu” na אֵרַשְׂתִּי kuwa “niliyemposa awe wangu.”
  alternative: Kulainisha mvutano kwa kusema tu “niliyemwoa” au “niliyempata kuwa mke wangu.”
  rationale: Kiebrania kinamwita Mikali “mke wangu” huku dai la Daudi likitegemezwa kwa lugha ya posa na mahari. Tafsiri inahifadhi mvutano huo badala ya kuusawazisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Magovi” limedumishwa kwa sababu maelezo ya chanzo ni ya wazi na ni muhimu kwa msingi wa dai la Daudi.
