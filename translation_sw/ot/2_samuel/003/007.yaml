  yaml_path: translation/ot/2_samuel/003/007.yaml
  text: Saul had a concubine whose name was Rizpah daughter of Aiah. And Ish-bosheth said to Abner[a], “Why did you go in to my father’s concubine?”
translation:
  language: sw
  text: Sauli alikuwa na suria aliyeitwa Rispa binti Aya. Naye Ish-boshethi akamwambia Abneri[a], “Kwa nini uliingia kwa suria wa baba yangu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa uwazi zaidi, “Kwa nini ulifanya ngono na suria wa baba yangu?” Kiebrania kinasema “uliingia kwa,” tamathali ya kawaida inayomaanisha kujamiiana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשָׁאוּל
  choice: Sauli alikuwa na
  rationale: Muundo wa ל wenye maana ya umilikaji unaelezwa kwa Kiswahili cha kawaida kwa ‘alikuwa na’; kiunganishi ו hapa kinaanzisha taarifa ya usuli bila kulazimisha neno la muda kama ‘basi’.
- source_word: פִּלֶגֶשׁ / פִּילֶגֶשׁ
  choice: suria
  rationale: ‘Suria’ ni istilahi ya kawaida ya kibiblia inayohifadhi hadhi maalumu ya kijamii ya mwanamke huyu, tofauti na mke kamili au kimada kwa maana pana.
- source_word: וּשְׁמָהּ רִצְפָּה בַת אַיָּה
  choice: aliyeitwa Rispa binti Aya
  rationale: Hutoa utambulisho kwa Kiswahili cha asili na kuhifadhi jina pamoja na nasaba.
- source_word: וַיֹּאמֶר אֶל אַבְנֵר
  choice: Naye Ish-boshethi akamwambia Abneri
  rationale: Kitenzi cha Kiebrania kina kiima kilichodokezwa; muktadha wa mstari uliotangulia humtambulisha Ish-boshethi. Kumtaja huepusha utata katika Kiswahili.
- source_word: מַדּוּעַ בָּאתָה אֶל
  choice: Kwa nini uliingia kwa
  rationale: Huhifadhi sitiari ya Kiebrania ‘kuingia kwa,’ ambayo katika muktadha huu ni tamathali ya kujamiiana, badala ya kuifafanua moja kwa moja katika maandishi makuu.
- source_word: פִּילֶגֶשׁ אָבִי
  choice: suria wa baba yangu
  rationale: Huhifadhi uhusiano wa umilikaji wa Kiebrania kwa muundo wa kawaida wa Kiswahili.
