base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/019.yaml
  text: Abner also spoke in the hearing of Benjamin[b][a], and Abner also went to speak in the hearing of David at Hebron all that seemed good in the eyes of Israel and in the eyes of the whole house of Benjamin.
translation:
  language: sw
  text: Abneri pia akazungumza na watu wa Benyamini.[a] Naye Abneri pia akaenda Hebroni kumwambia Daudi yote yaliyoonekana kuwa mema machoni pa Israeli na machoni pa nyumba yote ya Benyamini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “masikioni mwa Benyamini”; hapa Benyamini ni jina la pamoja linalomaanisha watu wa kabila hilo.
    reason: lexical_alternative
  - marker: b
    text: Au, “yote yaliyowapendeza Israeli na nyumba yote ya Benyamini.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאָזְנֵי
  choice: akazungumza na / kuzungumza na
  rationale: Nahau ya Kiebrania ina maana halisi ya ‘masikioni mwa,’ lakini hapa hueleza kumwambia au kuzungumza na mtu. Kiswahili cha sasa hutumia ‘kuzungumza na’ kwa ufasaha bila kuongeza wazo la mazungumzo ya faraghani.
- source_word: בִנְיָמִין
  choice: watu wa Benyamini
  rationale: Jina Benyamini limetumiwa kwa maana ya pamoja kuhusu kabila lake. ‘Watu wa Benyamini’ huweka maana hiyo wazi na ya kawaida kwa msomaji wa Kiswahili.
- source_word: בְּחֶבְרוֹן
  choice: Hebroni
  rationale: Kiambishi cha mahali -ni kinaonyesha kwamba Hebroni ndiko Abneri alikoenda kuzungumza na Daudi.
- source_word: אֵת כָּל אֲשֶׁר טוֹב בְּעֵינֵי
  choice: kuhusu yote yaliyoonekana kuwa mema machoni pa
  rationale: ‘Machoni pa’ huhifadhi taswira na urudiaji wa Kiebrania, huku ‘yaliyoonekana kuwa mema’ ikitoa maana ya jambo lililokubalika au kupendeza kwa wahusika.
- source_word: כָּל בֵּית בִּנְיָמִן
  choice: nyumba yote ya Benyamini
  rationale: ‘Nyumba’ huhifadhi lugha ya ukoo na jumuiya ya kisiasa katika chanzo badala ya kuibana iwe ‘kabila’ pekee.
- source_word: גַּם ... גַּם
  choice: pia ... pia
  rationale: Kurudia ‘pia’ kunadumisha msisitizo wa nyongeza katika vitendo viwili vya Abneri, ingawa nafasi yake imerekebishwa kidogo ili Kiswahili kisomeke kwa kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa Biblia lakini kinachoeleweka kwa wasomaji wa sasa. ‘Abneri’ na ‘Benyamini’ zimetumiwa kwa maumbo yaliyozoeleka katika mapokeo ya Biblia ya Kiswahili; urudiaji wa ‘machoni pa’ umehifadhiwa kwa sababu ni sehemu dhahiri ya muundo wa Kiebrania.
