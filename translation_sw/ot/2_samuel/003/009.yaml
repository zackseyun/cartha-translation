  source_fidelity: Rasimu inahifadhi mfumo wa kiapo cha kujilaani na jina Abner katika nafsi ya tatu. Hata hivyo, «hakika» katikati ya muundo wa «kama vile ... ndivyo ...» haionyeshi vyema uhusiano wa sentensi wa Kiebrania, na «nitakavyomfanyia» inaweza kusikika kama kumfanyia Daudi tendo lisiloelezwa badala ya kumtendea kwa niaba/faida yake. Tafsiri iliyorekebishwa huonyesha wazi kwamba azimio la Abner ni kumtendea Daudi kulingana na kiapo cha Yahwe.
  naturalness: «Mungu na afanye hivi kwa Abner, na zaidi ya hayo» ni Kiswahili sanifu na cha kawaida kwa fomula ya kiapo. «Kama vile ... ndivyo nitakavyomtendea Daudi» ni muundo wa asili, unaoeleweka, na unaohifadhi msisitizo wa ulinganisho.
  terminology: «Mungu», «Yahwe», «Abner», na «Daudi» zinafaa. «Yahwe» ni utohozi unaokubalika wa jina la Tetragramatoni katika Kiswahili cha Afrika Mashariki.
