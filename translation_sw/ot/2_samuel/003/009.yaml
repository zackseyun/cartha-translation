base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/009.yaml
  text: May God do so to Abner[a], and more also, if, just as Yahweh has sworn to David, so I do for him—
translation:
  language: sw
  text: Mungu na afanye hivi kwa Abner, na zaidi ya hayo, kama vile Yahwe alivyomwapia Daudi, ndivyo nitakavyomtendea Daudi—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים לְאַבְנֵר וְכֹה יֹסִיף לוֹ
  choice: Mungu na amtendee Abner hivi, na aongeze juu ya hayo
  rationale: Hii ni kauli ya kawaida ya kiapo cha Kiebrania inayomwomba Mungu amwadhibu msemaji. Kutaja jina la Abner katika nafsi ya tatu kunahifadhi namna ya kujilaani mwenyewe iliyomo katika chanzo; ‘na aongeze juu ya hayo’ huhifadhi wazo la adhabu kali zaidi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika kiapo hiki neno hilo linamrejelea Mungu mmoja, si miungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hili ni jina binafsi la Mungu katika maandishi ya Kiebrania; limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: כַּאֲשֶׁר נִשְׁבַּע יְהוָה לְדָוִד
  choice: kama vile Yahwe alivyomwapia Daudi
  rationale: Muundo huu unaonyesha ulinganisho wa moja kwa moja kati ya kiapo cha Yahwe kwa Daudi na hatua ambayo Abner anaazimia kuchukua.
- source_word: כִּי כֵן אֶעֱשֶׂה לוֹ
  choice: hakika ... ndivyo nitakavyomfanyia
  rationale: כִּי imetafsiriwa kama neno la kusisitiza kiapo, na kitenzi cha Kiebrania kinaeleweka kuwa na nguvu ya wakati ujao kwa sababu Abner anaeleza azimio lake. Kiwakilishi לוֹ kinamrejelea Daudi.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia Tetragramatoni kama jina binafsi la Mungu. ‘Yahwe’ huhifadhi jina hilo bila kuliweka badala yake cheo.
- issue: Nguvu ya kiapo cha Abner
  choice: Kauli ya kujilaani inayosisitiza azimio lake
  alternative: 'Sentensi yenye sharti la wazi: ‘ikiwa ...’'
  rationale: Katika muktadha, Abner anaahidi kutimiza kile Yahwe alichomwapia Daudi. Kutafsiri כִּי kwa maana ya kusisitiza huepuka kudokeza kwamba Abner anaomba adhabu iwapo atatimiza ahadi hiyo, huku tanbihi ikihifadhi uwezekano wa kisarufi wa maana ya sharti.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kiapo umehifadhiwa bila kuongeza sharti hasi ambalo halipo wazi katika Kiebrania.
