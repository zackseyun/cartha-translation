base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/038.yaml
  text: Then the king said to his servants[a], “Do you not know that a prince and a great man has fallen today in Israel?”
translation:
  language: sw
  text: Kisha mfalme akawaambia watumishi wake, “Je, hamjui kwamba leo kiongozi[a] na mtu mashuhuri ameanguka katika Israeli?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkuu.” Neno la Kiebrania שַׂר linaweza kumaanisha kiongozi, mkuu, kamanda, mtawala, au afisa mkuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akawaambia
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, na “akawaambia” huwasilisha usemi unaoelekezwa kwa watu.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye uainisho; muktadha unamtambulisha Daudi bila kuhitaji kuongeza jina lake.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: עֶבֶד humaanisha mtumishi, hasa katika mazingira ya ikulu; “watumishi” hudumisha maana ya msingi bila kudai kwa lazima kwamba walikuwa maofisa.
- source_word: הֲלוֹא תֵדְעוּ
  choice: Je, hamjui
  rationale: Muundo huu ni swali la balagha linalotarajia jibu la kukubali; “Je, hamjui” ni wa karibu na wa kawaida katika Kiswahili.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי inaanzisha yaliyomo katika jambo wanalopaswa kujua, si sababu.
- source_word: שַׂר
  choice: kiongozi
  rationale: שַׂר inaweza kumaanisha mkuu, kamanda, mtawala, au afisa mwenye cheo. Kwa Abneri, “kiongozi” ni pana na ya asili, bila kuingiza wazo la mwana wa mfalme ambalo “mwana-mfalme” lingeweza kudokeza.
- source_word: וְגָדוֹל
  choice: na mtu mkuu
  rationale: Kivumishi גָדוֹל kimetumiwa kama nomino kumaanisha mtu mwenye hadhi na umuhimu mkubwa; “mtu mkuu” hudumisha uzito wa kauli.
- source_word: נָפַל
  choice: ameanguka
  rationale: “Kuanguka” ni sitiari ya kifo inayodumisha lugha ya Kiebrania na uzito wa maombolezo, huku wakati timilifu ukionyesha tukio la leo lenye athari ya sasa.
- source_word: הַיּוֹם הַזֶּה
  choice: leo
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kusema “siku hii,” bila kupoteza maana.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Huwasilisha eneo au jamii ya kitaifa ambamo kifo hiki mashuhuri kimetokea.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kifalme lakini kinachoeleweka kwa msomaji wa kawaida. “Kiongozi” limechaguliwa badala ya “mwana-mfalme” ili kuepuka maana isiyokusudiwa ya ukoo wa kifalme; tanbihi inahifadhi upana wa neno la Kiebrania.
