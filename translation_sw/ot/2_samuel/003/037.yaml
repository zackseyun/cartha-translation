base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/037.yaml
  text: So all the people and all Israel knew on that day that it was not from the king to put Abner son of Ner to death[a].
translation:
  language: sw
  text: Siku hiyo watu wote na Israeli wote wakajua kwamba kumuua Abneri mwana wa Neri hakukutokana na mfalme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo la kumuua Abneri halikutoka kwa mfalme,” au “mfalme hakuwa ametoa amri ya Abneri kuuawa.” Kiebrania kinaeleza chanzo au asili ya jambo hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדְעוּ
  choice: wakajua
  rationale: Qal wayyiqtol ya ידע inaonyesha kufikia kujua au kutambua jambo; “wakajua” ni ya kawaida na inafaa katika mtiririko wa simulizi.
- source_word: כָל הָעָם
  choice: watu wote
  rationale: עם hapa ni watu kwa ujumla; “watu wote” ni tafsiri wazi na ya kawaida.
- source_word: וְכָל יִשְׂרָאֵל
  choice: na Israeli wote
  rationale: Inadumisha usemi wa Kiebrania unaolitaja taifa kwa maana ya pamoja, bila kuufanya sawa kabisa na “watu wote” waliotangulia.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Ni usemi wa kawaida wa wakati na unaendeleza msisitizo wa simulizi.
- source_word: כִּי
  choice: kwamba
  rationale: Hutambulisha yaliyomo katika jambo walilolijua.
- source_word: לֹא הָיְתָה מֵהַמֶּלֶךְ
  choice: hakukutokana na mfalme
  rationale: Muundo wenye מן unaonyesha chanzo au asili ya jambo. “Hakukutokana na mfalme” huhifadhi maana hiyo kwa Kiswahili cha asili bila kuongeza madai mapana ya kisheria.
- source_word: לְהָמִית
  choice: kumuua
  rationale: Hiphil ya מות ina maana ya kusababisha afe. Katika Kiswahili, “kumuua” ni wazi na ya kawaida; “kumnyonga” au “kumwua kwa hukumu” kungeingiza wazo la utaratibu rasmi ambalo halijasemwa.
- source_word: אֶת אַבְנֵר בֶּן נֵר
  choice: Abneri mwana wa Neri
  rationale: Majina yameandikwa kwa namna inayotumika kwa kawaida katika Biblia za Kiswahili, huku “mwana wa Neri” ikihifadhi utambulisho wa ukoo.
theological_decisions:
- issue: Kiwango cha maana kuhusu kuhusika kwa Daudi katika kifo cha Abneri
  choice: Tafsiri inasema kwamba kumuua Abneri hakukutokana na mfalme.
  alternative: Mfalme hakuwa na hatia katika kifo cha Abneri; au mfalme hakuwa ameamuru auawe.
  rationale: Kiebrania kinasisitiza chanzo au asili ya jambo, si moja kwa moja hukumu pana ya kutokuwa na hatia wala kutokutoa amri. Tafsiri inadumisha dai hilo lenye mipaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo umefanywa kuwa wa asili kwa kuweka “kumuua Abneri” kuwa kiima cha kishazi, huku maana ya Kiebrania kuhusu chanzo ikihifadhiwa.
