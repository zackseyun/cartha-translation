base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/028.yaml
  text: Afterward[a], when David heard of it, he said[b], “I and my kingdom are forever innocent before Yahweh of the blood of Abner son of Ner.”
translation:
  language: sw
  text: Baadaye[a], Daudi aliposikia jambo hilo, alisema, “Mimi na ufalme wangu hatuna hatia mbele za Yahweh milele kwa damu ya Abneri mwana wa Neri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Baada ya hayo” au “Kisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחֲרֵי כֵן
  choice: Baadaye
  rationale: Kirai hiki cha wakati kina maana ya ‘baada ya hayo/baadaye’; ‘Baadaye’ ni cha kawaida na kinafuata vizuri mfululizo wa simulizi.
- source_word: וַיִּשְׁמַע
  choice: Daudi aliposikia jambo hilo
  rationale: Kitenzi kina maana ya ‘alisikia’; ‘jambo hilo’ linaelekeza kwa tukio lililotangulia bila kuongeza habari mpya.
- source_word: נָקִי
  choice: hatuna hatia
  rationale: Neno hili huonyesha kutokuwa na hatia au kutowajibika kwa kosa. Kiswahili kinahitaji upatanisho wa wingi kwa ‘mimi na ufalme wangu’.
- source_word: אָנֹכִי וּמַמְלַכְתִּי
  choice: Mimi na ufalme wangu
  rationale: Huhusisha Daudi mwenyewe pamoja na ufalme wake katika kukataa kuwajibika; ‘ufalme wangu’ huhifadhi maana ya kisiasa ya מַמְלָכָה.
- source_word: מֵעִם יְהוָה
  choice: mbele za Yahweh
  rationale: Nahau hii inaonyesha kusimama mbele ya Yahweh akiwa shahidi na mwamuzi; ‘mbele za’ ni usemi wa Kiswahili unaofaa katika muktadha wa kisheria na kimaadili.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Hutoa wazo la kudumu bila mwisho na kuhifadhi uzito wa tamko la Daudi.
- source_word: מִדְּמֵי
  choice: kwa damu ya
  rationale: Kwa neno ni ‘kutokana na damu za’; ni nahau inayohusu uwajibikaji kwa umwagaji damu. ‘Kwa damu ya’ ni ya asili katika Kiswahili, huku ‘hatuna hatia’ ikibainisha maana ya kisheria.
- source_word: אַבְנֵר בֶּן נֵר
  choice: Abneri mwana wa Neri
  rationale: Majina yamewasilishwa kwa maumbo yaliyozoeleka katika Kiswahili, na muundo wa ukoo ‘mwana wa’ umehifadhiwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana Tetragramatoni moja kwa moja; ‘Yahweh’ huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku lugha ya kutokuwa na hatia na uwajibikaji kwa umwagaji damu ikihifadhiwa.
