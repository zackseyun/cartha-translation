  text: his second, Kileab, by Abigail the wife of Nabal the Carmelite; and the third, Absalom the son of Maacah daughter of Talmai king of Geshur.
translation:
  language: sw
  text: Mwana wake wa pili alikuwa Kileabu, aliyezaliwa na Abigaili, mke wa Nabali, Mkarmeli; na wa tatu alikuwa Absalomu, mwana wa Maaka, binti ya Talmai, mfalme wa Geshuri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִשְׁנֵהוּ
  choice: wa pili alikuwa
  rationale: Inaendeleza orodha ya wana wa Daudi kwa Kiswahili cha kawaida, huku ikihifadhi mpangilio wa asili.
- source_word: כִלְאָב
  choice: Kileabu
  rationale: Unukuzi wa jina la Kiebrania unaolingana na matamshi na mazoea ya Kiswahili.
- source_word: לַאֲבִיגַל
  choice: mwana wa Abigaili
  rationale: Kiambishi ל־ hapa kinaonyesha mama ambaye alimzalia Daudi mtoto; usemi huu unaweka uhusiano wazi kwa kawaida ya Kiswahili.
- source_word: אֵשֶׁת נָבָל
  choice: aliyekuwa mke wa Nabali
  rationale: Kitenzi cha wakati uliopita kinaepusha dhana kwamba bado alikuwa mke wa Nabali wakati huu, bila kubadili utambulisho wake wa kihistoria.
- source_word: הַכַּרְמְלִי
  choice: Mkarmeeli
  rationale: Ni neno la kumtambulisha Nabali kuwa mtu wa Karmeli, si lazima kuwa wa kundi la kidini la baadaye.
- source_word: וְהַשְּׁלִשִׁי
  choice: na wa tatu alikuwa
  rationale: Inahifadhi muundo sambamba wa orodha kwa Kiswahili sanifu.
- source_word: בַּת תַּלְמַי
  choice: binti ya Talmai
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya uhusiano wa kifamilia.
- source_word: מֶלֶךְ גְּשׁוּר
  choice: mfalme wa Geshuri
  rationale: Inahifadhi cheo na jina la eneo kwa uwazi.
