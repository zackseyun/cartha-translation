  yaml_path: translation/ot/2_samuel/003/005.yaml
  text: and the sixth[a], Ithream, by Eglah, David’s wife. These were born to David in Hebron.
translation:
  language: sw
  text: na wa sita, Yithrehamu, wa Egla, mke wa Daudi[a]. Hawa wote walizaliwa kwa Daudi katika Hebroni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai cha Kiebrania ni “mke wa Daudi.” Katika muktadha huu, kinamtambulisha Egla kuwa mmoja wa wake za Daudi, si lazima mke wake wa pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשִּׁשִּׁי
  choice: na wa sita
  rationale: Kiunganishi na namba ya mpangilio vinaendeleza orodha ya wana wa Daudi; neno “mwana” linaeleweka kutokana na muktadha.
- source_word: יִתְרְעָם
  choice: Yithreamu
  rationale: Jina limenukuliwa kwa namna inayokaribia matamshi ya Kiebrania huku likiwa rahisi kutamkwa kwa Kiswahili.
- source_word: לְעֶגְלָה
  choice: mwana wa Egla
  rationale: Katika orodha hii, לְ humtambulisha mama. “Mwana wa Egla” ni Kiswahili cha kawaida na kinaonyesha uhusiano huo wazi bila kubadili maana.
- source_word: אֵשֶׁת דָּוִד
  choice: mke wa Daudi
  rationale: Hii inafuata moja kwa moja muundo wa Kiebrania. Tanbihi inaeleza kwamba katika muktadha huu haimaanishi lazima kuwa Egla alikuwa mke pekee wa Daudi.
- source_word: אֵלֶּה
  choice: Hao
  rationale: Kiwakilishi hiki kinarejelea wana wote waliotajwa katika orodha iliyotangulia; si lazima kuongeza tena neno “wana.”
- source_word: יֻלְּדוּ
  choice: waliozaliwa
  rationale: Kauli tendwa ya ילד hapa inaeleza kuzaliwa kwao bila kusisitiza mhusika mwingine.
- source_word: לְדָוִד
  choice: kwa Daudi
  rationale: Katika taarifa za ukoo, ילד pamoja na לְ huonyesha mzazi ambaye watoto walizaliwa kwake; “waliozaliwa kwa Daudi” ni usemi wa asili katika Kiswahili.
- source_word: בְּחֶבְרוֹן
  choice: huko Hebroni
  rationale: Kihusishi kinaonyesha mahali walipozaliwa; “huko” hufanya sentensi iwe ya asili, na “Hebroni” ni umbo la jina linalotumika kwa urahisi katika Kiswahili.
theological_decisions:
- issue: Ikiwa אֵשֶׁת דָּוִד humtaja Egla kuwa mke pekee wa Daudi
  choice: mke wa Daudi
  alternative: mmoja wa wake za Daudi
  rationale: Tafsiri kuu inadumisha muundo wa Kiebrania bila kuongeza wazi wazo la “mmoja wa.” Kwa kuwa muktadha unaonyesha Daudi alikuwa na wake kadhaa, tanbihi inazuia kauli hiyo kueleweka kimakosa kuwa ya upekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa urahisi. Muundo mfupi wa orodha umehifadhiwa, na majina yameandikwa kwa namna inayosomeka kwa Kiswahili.
