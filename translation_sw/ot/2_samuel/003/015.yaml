  text: So Ish-bosheth sent and took her from her husband[b][a], from Paltiel the son of Laish.
translation:
  language: sw
  text: Basi Ish-boshethi akatuma, akamchukua kutoka kwa mume wake,[a] kutoka kwa Paltieli mwana wa Laishi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka kwa mtu huyo, kutoka kwa Paltieli mwana wa Laishi.” Tafsiri imeweka wazi kwamba “mtu” huyo alikuwa mume wake.'
    reason: lexical_alternative
  - marker: b
    text: Katika vifungu vinavyohusiana, jina hili linaweza kuandikwa “Palti”; hapa maandishi ya Kiebrania yana umbo “Paltieli.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma watu
  rationale: Kitenzi kinamaanisha ‘akatuma’ bila kutaja wazi waliotumwa. Kiswahili kinahitaji yambwa katika mfuatano huu; ‘watu’ linaonyesha mawakala wanaodokezwa na muktadha bila kudai kuwa alituma ujumbe.
- source_word: אִישׁ בֹּשֶׁת
  choice: Ish-boshethi
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili huku likibaki karibu na umbo la Kiebrania.
- source_word: וַיִּקָּחֶהָ
  choice: nao wakamchukua
  rationale: לקח pamoja na kiambishi cha nafsi ya tatu umoja wa kike humaanisha ‘wakamchukua.’ Wingi unarejelea watu waliotumwa, ambao ndio watendaji wanaodokezwa katika Kiebrania.
- source_word: מֵעִם אִישׁ
  choice: kutoka kwa mume wake
  rationale: Ingawa אִישׁ kwa msingi ni ‘mwanamume,’ hapa inamtaja mwenzi wa ndoa wa Mikali. ‘Mume wake’ huwasilisha maana ya kimuktadha kwa Kiswahili cha kawaida; maana halisi imeelezwa katika tanbihi.
- source_word: מֵעִם
  choice: kutoka kwa
  rationale: Kirai hiki huonyesha kutengwa na mtu ambaye alikuwa pamoja naye au chini ya uangalizi wake. Kurudiwa kwake kunadumishwa ili kuhifadhi msisitizo wa Kiebrania.
- source_word: פַּלְטִיאֵל
  choice: Paltieli
  rationale: Jina limetoholewa moja kwa moja kutoka katika umbo la Kiebrania la aya hii.
- source_word: בֶּן לוש
  choice: mwana wa Laishi
  rationale: בֶּן ni ‘mwana wa’; jina לוש limetoholewa kuwa ‘Laishi’ kwa mtindo wa Kiswahili.
