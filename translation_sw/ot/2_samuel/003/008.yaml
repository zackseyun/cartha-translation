base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/008.yaml
  text: Then Abner became very angry because of Ish-bosheth’s words[a], and he said, “Am I a dog’s head that belongs to Judah? To this day I have shown covenant loyalty to the house of Saul your father, to his brothers, and to his friends, and have not delivered you into David’s hand; yet today you charge me with guilt concerning this woman.”
translation:
  language: sw
  text: Ndipo Abneri akakasirika sana kwa sababu ya maneno ya Ish-boshethi, akasema, “Je, mimi ni kichwa cha mbwa wa Yuda?[a] Mpaka leo nimeonyesha uaminifu kwa nyumba ya Sauli baba yako, kwa ndugu zake na kwa rafiki zake, wala sikukutia mkononi mwa Daudi; lakini leo unanihesabia hatia kwa habari ya mwanamke huyu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kichwa cha mbwa kilicho cha Yuda.” Hii ni nahau ngumu ya matusi. Huenda ikimaanisha mtu wa kudharauliwa aliye upande wa Yuda, lakini tafsiri imehifadhi sitiari hiyo kwa ukaribu zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְאַבְנֵר מְאֹד
  choice: Abneri akakasirika sana
  rationale: Nahau ya Kiebrania inaeleza hasira iliyowaka; ‘akakasirika sana’ ni Kiswahili cha kawaida kinachohifadhi uzito wa מְאֹד.
- source_word: עַל דִּבְרֵי אִישׁ בֹּשֶׁת
  choice: kwa sababu ya maneno ya Ish-boshethi
  rationale: עַל hapa inaonyesha sababu ya hasira, huku דִּבְרֵי ikihifadhiwa kwa maana ya ‘maneno.’
- source_word: הֲרֹאשׁ כֶּלֶב אָנֹכִי אֲשֶׁר לִיהוּדָה
  choice: Je, mimi ni kichwa cha mbwa wa upande wa Yuda?
  rationale: Tafsiri inahifadhi sitiari ngumu ya ‘kichwa cha mbwa’ na pia uhusiano usio wazi kabisa na Yuda, badala ya kuibadili kuwa tusi lililofasiriwa moja kwa moja.
- source_word: הַיּוֹם אֶעֱשֶׂה חֶסֶד
  choice: Mpaka leo nimeitendea kwa uaminifu
  rationale: Katika utetezi wa Abneri, הַיּוֹם ya kwanza inaangalia mwenendo wake hadi wakati huo na kutofautishwa na ‘lakini leo’ baadaye. חֶסֶד hapa ni uaminifu wenye matendo katika uhusiano wa kisiasa na kifamilia.
- source_word: עִם בֵּית שָׁאוּל אָבִיךָ
  choice: nyumba ya Sauli baba yako
  rationale: ‘Nyumba’ huhifadhi maana ya ukoo au nasaba ya kifalme, si jengo tu.
- source_word: אֶל אֶחָיו וְאֶל מֵרֵעֵהוּ
  choice: ndugu zake na rafiki zake
  rationale: Maneno haya yanawakilisha ndugu au jamaa wa karibu na marafiki au washirika wa Sauli kwa lugha ya kawaida.
- source_word: וְלֹא הִמְצִיתִךָ בְּיַד דָּוִד
  choice: wala sikukutia mkononi mwa Daudi
  rationale: Nahau ya ‘mkono’ imehifadhiwa kwa sababu inaeleweka katika Kiswahili kuwa kumweka mtu chini ya mamlaka ya mwingine.
- source_word: וַתִּפְקֹד עָלַי עֲוֺן הָאִשָּׁה
  choice: lakini leo unanihesabia hatia kwa habari ya mwanamke huyu
  rationale: פקד על pamoja na עָוֺן huonyesha kumwajibisha au kumshtaki mtu kwa hatia; ‘kwa habari ya’ huhifadhi upeo usioelezwa zaidi wa tuhuma kuhusu mwanamke huyo.
