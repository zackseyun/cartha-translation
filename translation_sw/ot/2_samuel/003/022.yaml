base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/022.yaml
  text: And behold[a], David’s servants and Joab came in from a raid and brought much plunder with them. But Abner was not with David in Hebron, because he had sent him away[b], and he had gone in peace.
translation:
  language: sw
  text: Tazama, watumishi wa Daudi na Yoabu walifika wakitoka kwenye uvamizi[a], wakaleta nyara nyingi pamoja nao. Lakini Abneri hakuwa pamoja na Daudi huko Hebroni, kwa maana Daudi alikuwa amempeleka aende zake, naye alikuwa ameondoka kwa amani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwa kikosi cha wavamizi.” Neno la Kiebrania linaweza kumaanisha kikosi au kundi; hapa “uvamizi” limetumiwa kwa sababu kishazi kinachofuata kinataja nyara.
    reason: lexical_alternative
  - marker: b
    text: Kauli “kuondoka kwa amani” ina maana kwamba aliondoka salama na bila uhasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Huhifadhi nguvu ya kishazi kinachoelekeza fikira kwenye tukio jipya la kushtukiza, kwa lugha yenye heshima na inayoeleweka.
- source_word: עַבְדֵי דָוִד
  choice: watumishi wa Daudi
  rationale: Katika muktadha huu neno hilo linawahusu watu waliokuwa katika utumishi wa Daudi, si lazima watumwa; ‘watumishi’ hudumisha maana hiyo bila kuipanua kuwa ‘watu’ tu.
- source_word: מֵהַגְּדוּד
  choice: kutoka kwenye uvamizi
  rationale: גְּדוּד linaweza kumaanisha kikosi au kundi la wavamizi; kutajwa kwa nyara katika kishazi kinachofuata kunaunga mkono maana ya shughuli ya uvamizi.
- source_word: וְשָׁלָל רָב
  choice: nyara nyingi
  rationale: ‘Nyara’ ni istilahi ya kawaida kwa mali iliyochukuliwa katika mapigano, na ‘nyingi’ huakisi רָב.
- source_word: כִּי שִׁלְּחוֹ
  choice: kwa maana Daudi alikuwa amemruhusu aondoke
  rationale: Muktadha unamtambulisha Daudi kuwa mtendaji. Wakati timilifu huonyesha kwamba kuondoka kulitokea kabla ya Yoabu kurudi; kauli hii huepuka kudokeza kufukuzwa kwa nguvu.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: naye alikuwa ameondoka kwa amani
  rationale: Huhifadhi nahau ya Kiebrania na wazo la kuondoka salama bila uhasama.
