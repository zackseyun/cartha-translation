  text: And now[a], Lord GOD, you are God, and your words are true[b], and you have spoken this good thing to your servant.
translation:
  language: sw
  text: Na sasa, Ee Bwana Yahweh, wewe ndiwe Mungu, na maneno yako ni kweli[a]; nawe umemwambia mtumishi wako jambo hili jema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maneno yako yatakuwa kweli,” au “maneno yako ni ya kuaminika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Ee Bwana Yahwe
  rationale: Muunganiko huu una cheo אֲדֹנָי (‘Bwana’) na jina la Mungu יהוה (‘Yahwe’). ‘Ee Bwana Yahwe’ ni mwito wa heshima ulio wazi na wa asili katika Kiswahili.
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: wewe ndiwe Mungu
  rationale: ‘Wewe ndiwe’ linaonyesha msisitizo wa viwakilishi vya Kiebrania bila kufanya sentensi kuwa ngumu.
- source_word: דְבָרֶיךָ
  choice: maneno yako
  rationale: Nomino ya Kiebrania ni ya wingi; tafsiri hii inahifadhi wingi huo bila kuifasiri moja kwa moja kuwa ‘ahadi zako.’
- source_word: יִהְיוּ אֱמֶת
  choice: ni kweli
  rationale: Ingawa kitenzi kinaweza kutafsiriwa ‘yatakuwa,’ katika muktadha huu kauli inathibitisha ukweli na utegemewaji wa maneno ya Mungu. ‘Ni kweli’ ni Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: וַתְּדַבֵּר אֶל עַבְּדְךָ
  choice: umemwambia mtumishi wako
  rationale: Kitenzi kinamaanisha kusema au kunena kwa mtu. ‘Umemwambia’ huwasilisha kwa kawaida kwamba Mungu tayari amesema jambo hilo kwa Daudi.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: jambo hili jema
  rationale: Kiebrania kinasema kwa upana ‘jema hili,’ huku nomino ikieleweka. ‘Jambo hili jema’ huhifadhi upana huo kuliko ‘ahadi hii’ au ‘baraka hii.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu katika אֲדֹנָי יְהוִה
  choice: Ee Bwana Yahwe
  alternative: Ee Bwana MUNGU
  rationale: Kutumia ‘Yahwe’ kunahifadhi jina la agano lililopo wazi katika maandishi ya Kiebrania, huku ‘Bwana’ likitafsiri אֲדֹנָי. Hii pia huepuka marudio yasiyo ya kawaida ya ‘Bwana Bwana.’
- issue: Wakati na maana ya יִהְיוּ אֱמֶת
  choice: maneno yako ni kweli
  alternative: maneno yako yatakuwa kweli / maneno yako ni ya kuaminika
  rationale: Muundo unaweza kuonyesha wakati ujao, lakini katika sala hii pia unaweza kuwa uthibitisho wa kudumu kuhusu ukweli wa maneno ya Mungu. Tafsiri kuu hutumia Kiswahili cha kawaida, na tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ee’ limetumiwa kuonyesha mwito wa moja kwa moja katika sala; ‘wewe ndiwe’ huhifadhi msisitizo wa Kiebrania. Sentensi imeachwa na urudiaji wa ‘na’ kwa kiasi ili kudumisha mtiririko wa sala ya asili.
