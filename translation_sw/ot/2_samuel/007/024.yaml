base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/024.yaml
  text: And you established your people Israel for yourself to be your people forever[a], and you, Yahweh[b], became their God.
translation:
  language: sw
  text: Nawe ukawathibitisha watu wako Israeli kuwa watu wako milele, nawe, Yahwe[b], ukawa[a] Mungu wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ulikuwa Mungu wao.” Kiebrania kinaweza kueleza hali iliyokuwapo, ingawa “ukawa Mungu wao” kinaonyesha vizuri zaidi kuanzishwa kwa uhusiano wa agano katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina jina la Mungu YHWH, linalotolewa hapa kama “Yahwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּכוֹנֵן
  choice: ukawathibitisha
  rationale: Kitenzi כון katika muundo huu kina maana ya kufanya imara au kuweka kwa uthabiti. “Ukawathibitisha” kinaonyesha kwamba Mungu aliweka kwa uthabiti hadhi ya Israeli kama watu wake katika agano.
- source_word: לְךָ ... לְךָ לְעָם
  choice: kuwa watu wako mwenyewe
  rationale: Kurudiwa kwa לְךָ kunasisitiza kwamba Israeli ni mali ya Yahwe na wametengwa wawe watu wake. “Wako mwenyewe” huleta msisitizo huo kwa Kiswahili cha kawaida bila kurudia maneno kwa namna isiyo ya asili.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: watu wako Israeli
  rationale: Huhifadhi uhusiano wa umiliki na jina la taifa, huku mpangilio ukiwa wa kawaida katika Kiswahili.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Ni tafsiri ya kawaida na yenye kueleweka ya muda usio na mwisho au wa kudumu katika muktadha huu wa agano.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: ukawa Mungu wao
  rationale: Muundo היה pamoja na ל unaweza kueleza kuingia katika uhusiano au kuwapo katika hali fulani. “Ukawa Mungu wao” huhifadhi maana ya kuanzishwa kwa uhusiano wa agano katika muktadha huu, huku uwezekano wa maana ya hali ukitajwa katika tanbihi.
theological_decisions:
- issue: Kuhifadhi pande mbili za kauli ya agano
  choice: “kuwa watu wako mwenyewe milele ... ukawa Mungu wao”
  alternative: “wawe watu wako milele ... ulikuwa Mungu wao”
  rationale: 'Tafsiri inahifadhi uhusiano wa pande mbili ulio katika mstari: Israeli ni watu wa Yahwe, naye Yahwe ni Mungu wao. “Ukawa” inafaa muktadha wa kuanzishwa kwa agano, lakini tanbihi inahifadhi uwezekano halali wa tafsiri ya hali.'
- issue: Jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: “Yahwe” huhifadhi jina binafsi la Mungu lililo katika maandishi ya Kiebrania bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “watu wako mwenyewe” unasisitiza umiliki wa kiagano kwa njia ya asili, na alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
