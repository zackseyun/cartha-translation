  edition: WLC
  text: וּ/לְ/מִן הַ/יּ֗וֹם אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וַ/הֲנִיחֹ֥תִי לְ/ךָ֖ מִ/כָּל אֹיְבֶ֑י/ךָ וְ/הִגִּ֤יד לְ/ךָ֙ יְהוָ֔ה כִּי בַ֖יִת יַעֲשֶׂה לְּ/ךָ֥ יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/011.yaml
  text: and from the day that I appointed judges over my people Israel[a]. And I have given you rest from all your enemies. Yahweh also declares to you that Yahweh will make a house for you.
translation:
  language: sw
  text: na tangu siku nilipowaweka waamuzi juu ya watu wangu Israeli. Nami nimekupa pumziko kutoka kwa adui zako wote. Na Yahwe anakutangazia kwamba Yahwe atakufanyia nyumba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakujengea nyumba.” Hapa “nyumba” yaelekea kumaanisha ukoo wa kifalme, huku pia ikirejelea tamaa ya Daudi ya kumjengea Yahwe nyumba, yaani hekalu.
    reason: Mbadala wa kileksia na ufafanuzi wa maana mbili za בַּיִת.
lexical_decisions:
- source_word: וּלְמִן הַיּוֹם
  choice: na tangu siku
  rationale: Inaendeleza sentensi iliyotangulia na kuonyesha mwanzo wa kipindi kinachoelezwa.
- source_word: צִוִּיתִי שֹׁפְטִים
  choice: nilipowaweka waamuzi
  rationale: Katika muktadha huu kitenzi kina maana ya kuwaweka au kuwateua waamuzi katika mamlaka, si kuwaamuru tu.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: juu ya watu wangu Israeli
  rationale: Neno 'juu ya' linahifadhi wazo la mamlaka ya waamuzi juu ya Israeli.
- source_word: וַהֲנִיחֹתִי לְךָ מִכָּל אֹיְבֶיךָ
  choice: Nami nimekupa pumziko kutoka kwa adui zako wote
  rationale: Hifili ya נוח inaonyesha kwamba Mungu ndiye anayempa Daudi pumziko au nafuu; wakati timilifu unaonyesha tendo lenye matokeo ya sasa.
- source_word: וְהִגִּיד לְךָ יְהוָה
  choice: Pia Yahwe anakutangazia
  rationale: נגד katika Hifili ni kutangaza au kujulisha. 'Pia' linaonyesha uhusiano wa וְ na hatua mpya ya tangazo katika hotuba.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: כִּי בַיִת יַעֲשֶׂה לְּךָ יְהוָה
  choice: kwamba Yahwe atakufanyia nyumba
  rationale: '''Atakufanyia nyumba'' linafuata kitenzi עשה na kuhifadhi kwa kiasi kikubwa maana mbili za nyumba: jengo na ukoo wa kifalme; tanbihi inafafanua maana ya kiukoo bila kuiondoa picha ya nyumba.'
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה; 'Yahwe' linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya בַּיִת katika ahadi kwa Daudi
  choice: nyumba, huku maana ya ukoo wa kifalme ikihifadhiwa
  alternative: ukoo wa kifalme; nasaba; hekalu
  rationale: Kiebrania kinatumia kwa makusudi maana zinazokaribiana za nyumba kama jengo na kama nasaba. Kutafsiri 'nasaba' pekee kungeondoa istiara na mwangwi wa nia ya Daudi ya kumjengea Yahwe nyumba.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Mwanzo wenye 'na tangu' umeachwa kama mwendelezo wa mstari uliotangulia. Alama ya tanbihi imewekwa baada ya 'nyumba,' neno linalohusika moja kwa moja.
