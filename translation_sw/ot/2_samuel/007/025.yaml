base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/025.yaml
  text: And now[a], Yahweh God, confirm forever the word that you have spoken concerning your servant and concerning his house[b], and do as you have spoken.
translation:
  language: sw
  text: Na sasa, Ee Yahweh, Mungu, lithibitishe milele neno[a] ulilosema kuhusu mtumishi wako na kuhusu nyumba yake[b], nawe ufanye kama ulivyosema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ahadi uliyoisema.”
    reason: lexical_alternative
  - marker: b
    text: Hapa “nyumba yake” inamaanisha hasa ukoo au nasaba yake ya kifalme, si jengo au watu wa nyumbani kwake tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa na cheo kama “BWANA”.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Katika mwito unaofuata jina Yahwe, neno hili ni cheo cha kawaida cha Uungu; “Ee Yahwe Mungu” ni mwito wa asili na wenye heshima katika Kiswahili.
- source_word: הַדָּבָר
  choice: neno
  rationale: דָּבָר humaanisha “neno,” “jambo,” na katika muktadha huu inaweza kudokeza ahadi. “Neno” huhifadhi usemi halisi wa Kiebrania bila kufanya maana ya “ahadi” kuwa wazi kuliko chanzo.
- source_word: דִּבַּרְתָּ
  choice: ulilosema
  rationale: Kitenzi kinarejelea maneno ambayo Mungu alikuwa amesema tayari na ambayo bado yana umuhimu. Muundo huu pia huendeleza urudiaji wa mzizi דבר katika “neno ulilosema.”
- source_word: עַל
  choice: kuhusu
  rationale: Hapa kihusishi kinaonyesha jambo linalozungumziwa katika neno la Mungu.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika sala ya kifalme, huu ni usemi wa unyenyekevu na huduma mbele za Mungu; “mtumishi” unafaa zaidi kuliko “mtumwa” katika muktadha huu.
- source_word: בֵּיתוֹ
  choice: nyumba yake
  rationale: “Nyumba” huhifadhi taswira kuu ya agano katika sura hii, huku ikijumuisha ukoo wa kifalme wa Daudi, si jengo au watu wa nyumbani tu.
- source_word: הָקֵם
  choice: lithibitishe
  rationale: Hifili ya קום inaomba Mungu alifanye neno lake lisimame imara. “Lithibitishe” linaendana vizuri na neno kama yambwa na kueleza kulifanya liwe hakika.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Huu ni usemi wa kudumu bila mwisho; “milele” ni wa kawaida, wazi, na wenye hadhi katika Kiswahili.
- source_word: וַעֲשֵׂה
  choice: nawe ufanye
  rationale: Tafsiri hii huhifadhi amri fupi na pana ya עשה bila kuongeza wazo la “kutimiza” ambalo halijaelezwa moja kwa moja.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: kama ulivyosema
  rationale: Kifungu hiki huhifadhi mwangwi wa kitenzi דבר na ombi kwamba Mungu atende sawasawa na maneno yake mwenyewe.
theological_decisions:
- issue: Iwapo הַדָּבָר litafsiriwe “neno” au “ahadi” katika muktadha wa agano
  choice: neno
  alternative: ahadi
  rationale: Muktadha una nguvu ya ahadi ya agano, lakini Kiebrania kinasema moja kwa moja “neno ulilosema.” “Neno” huhifadhi wording ya chanzo na kuacha maana ya ahadi ijitokeze katika muktadha; mbadala umewekwa katika tanbihi.
- issue: Iwapo בֵּיתוֹ ifafanuliwe moja kwa moja kuwa “nasaba yake ya kifalme”
  choice: nyumba yake
  alternative: nasaba yake ya kifalme
  rationale: Maana ya nasaba ni muhimu katika 2 Samweli 7, lakini “nyumba” ni taswira kuu na ya makusudi katika agano hili. Tanbihi inaeleza maana hiyo bila kuondoa taswira ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sala ulio wa sasa, wazi, na wenye heshima. “Ee” huonyesha mwito wa moja kwa moja; “nawe” huunganisha ombi la pili kwa mtiririko wa kawaida. Urudiaji wa “neno/ulisema/ulivyosema” umehifadhiwa kadiri Kiswahili kinavyoruhusu ili kuakisi msisitizo wa Kiebrania.
