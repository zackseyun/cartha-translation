base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/019.yaml
  text: And even this was too small in your eyes[a], Lord GOD; you have also spoken of your servant’s house for a long time to come, and this is the law of man[c][b], Lord GOD.
translation:
  language: sw
  text: Na hata hili lilikuwa jambo dogo machoni pako, Ee Bwana MUNGU; nawe umenena pia kuhusu nyumba ya mtumishi wako[b] kwa wakati ujao ulio mbali.[a] Na hili ndilo fundisho la mwanadamu,[c] Ee Bwana MUNGU.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa wakati wa baadaye ulio mbali.” Kirai hiki kinarejelea mambo yatakayotokea muda mrefu baadaye.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania ni “nyumba”; hapa linaweza kumaanisha jamaa, ukoo, au nasaba ya kifalme.
    reason: lexical_alternative
  - marker: c
    text: Kifungu cha mwisho katika Kiebrania ni kigumu. Kinaweza pia kueleweka kuwa “hili ndilo fundisho kwa wanadamu” au “hii ndiyo sheria/desturi ya mwanadamu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן ... בְּעֵינֶיךָ
  choice: lilikuwa jambo dogo machoni pako
  rationale: Huhifadhi sitiari ya Kiebrania ya kitu kuwa kidogo katika tathmini ya mtu, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: אֲדֹנָי יְהוִה
  choice: Ee Bwana MUNGU
  rationale: “Bwana” hutafsiri אֲדֹנָי, na “MUNGU” hutumika katika jina hili ambatani ili kuepuka kurudia “Bwana Bwana” na kudumisha tofauti ya jina la Mungu.
- source_word: וַתְּדַבֵּר גַּם אֶל
  choice: nawe umenena pia kuhusu
  rationale: Katika muktadha huu usemi unahusu ahadi iliyotolewa juu ya nyumba ya Daudi; “kuhusu” huwasilisha maana hiyo kwa uwazi bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: בֵּית עַבְדְּךָ
  choice: nyumba ya mtumishi wako
  rationale: “Nyumba” huhifadhi neno halisi na pia uwezo wake wa kumaanisha jamaa, ukoo, au nasaba ya kifalme.
- source_word: לְמֵרָחוֹק
  choice: kwa wakati mrefu ujao
  rationale: Kirai cha Kiebrania kinamaanisha kilicho mbali, na hapa umbali ni wa wakati—wakati wa baadaye ulio mbali.
- source_word: תּוֹרַת הָאָדָם
  choice: fundisho la mwanadamu
  rationale: “Fundisho” huhifadhi upana wa תּוֹרָה kuliko kulifanya bila shaka kuwa sheria, huku “la mwanadamu” likidumisha muundo wa Kiebrania na utata wake.
theological_decisions:
- issue: Maana ya kirai kigumu וְזֹאת תּוֹרַת הָאָדָם
  choice: Na hili ndilo fundisho la mwanadamu
  alternative: Na hili ndilo agizo kwa wanadamu; au, Na hii ndiyo sheria/desturi ya mwanadamu
  rationale: Kiebrania kina utata wa kweli kuhusu maana ya תּוֹרָה na uhusiano wa kisarufi wa הָאָדָם. Tafsiri kuu inafuata vipashio vya maandishi kwa karibu, na tanbihi inaonyesha maana nyingine zinazowezekana bila kuamua kwa nguvu hoja ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Umenena” hudumisha hadhi ya hotuba ya sala bila kuwa ya kizamani kupita kiasi; “Ee” huonyesha wazi kwamba Daudi anamwambia Mungu moja kwa moja.
