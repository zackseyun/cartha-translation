  - severity: low
    issue: Uhusiano wa “uzao wako” na kiarifu cha umoja
    rationale: Ingawa “uzao” linaweza kuhifadhi maana ya pamoja, “atakayetoka” na “wake” humlenga mrithi mmoja. “Mzao wako” husawazisha sintaksia ya Kiswahili na ya Kiebrania; tanbihi huhifadhi upeo mpana unaowezekana.
