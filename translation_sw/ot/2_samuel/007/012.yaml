base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/012.yaml
  text: When your days are fulfilled and you lie down with your fathers[a], I will raise up your offspring after you, who will come from your own body[b], and I will establish his kingdom.
translation:
  language: sw
  text: Siku zako zitakapotimia, nawe utakapolala pamoja na baba zako,[a] nitamwinua mzao wako[b] baada yako, atakayetokana na mwili wako mwenyewe,[c] nami nitauimarisha ufalme wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kulala pamoja na baba zako” ni nahau ya Kiebrania inayomaanisha kufa na kuungana na waliokufa wa ukoo wako.
    reason: cultural_note
  - marker: b
    text: Au “uzao wako.” Neno la Kiebrania linaweza kumaanisha mzao mmoja au wazao kwa jumla.
    reason: lexical_alternative
  - marker: c
    text: Kwa Kiebrania, “atakayetoka katika sehemu zako za ndani,” nahau inayomaanisha mzao wa mwili wako mwenyewe.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִמְלְאוּ יָמֶיךָ
  choice: Siku zako zitakapotimia
  rationale: 'Muundo wa wakati ujao unaanzisha hali ya wakati: siku za Daudi zitakapofikia ukomo. Tafsiri hii inadumisha taswira ya Kiebrania ya siku ‘kutimia’ na uzito wake wa heshima.'
- source_word: וְשָׁכַבְתָּ אֶת־אֲבֹתֶיךָ
  choice: nawe utakapolala pamoja na babu zako
  rationale: Hii inadumisha sitiari ya kawaida ya Kiebrania kuhusu kufa na kuungana na waliotangulia, bila kuibadili moja kwa moja kuwa ‘utakapokufa.’
- source_word: וַהֲקִימֹתִי
  choice: nitainua
  rationale: Katika muktadha wa mrithi, kitenzi hiki kina maana ya kumsimamisha au kumwinua mrithi atakayefuata.
- source_word: זַרְעֲךָ
  choice: uzao wako
  rationale: ‘Uzao’ ni Kiswahili cha kawaida kinachoweza kurejelea mzao mmoja anayewakilisha ukoo au wazao kwa jumla, hivyo kinahifadhi upana wa neno la Kiebrania.
- source_word: אַחֲרֶיךָ
  choice: baada yako
  rationale: Kirai hiki kinaonyesha mfuatano wa wakati na urithi baada ya Daudi.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: atakayetoka katika mwili wako mwenyewe
  rationale: Nahau hiyo inasisitiza kwamba mrithi huyo atakuwa wa nasaba ya Daudi mwenyewe. ‘Mwili wako mwenyewe’ ni wazi na ya sasa kuliko tafsiri ya neno kwa neno ya ‘sehemu zako za ndani.’
- source_word: וַהֲכִינֹתִי
  choice: nami nitauimarisha
  rationale: Kitenzi cha Kiebrania kina wazo la kufanya kitu kiwe thabiti au kilichowekwa imara. ‘Nitauimarisha’ kinaonyesha hilo kwa Kiswahili cha kawaida.
- source_word: מַמְלַכְתּוֹ
  choice: ufalme wake
  rationale: Neno hili linaweza kumaanisha ufalme au utawala wa kifalme; ‘ufalme wake’ ni wazi na linafaa katika ahadi ya nasaba ya kifalme.
theological_decisions:
- issue: Upeo wa זַרְעֲךָ katika ahadi kwa Daudi
  choice: uzao wako
  alternative: mzao wako
  rationale: Kiebrania kinaweza kueleweka kwa maana ya pamoja au kwa mzao mmoja mwakilishi. ‘Uzao wako’ huhifadhi uwezekano huo, huku vitenzi na kiwakilishi vya umoja vinavyoendelea katika mstari vikidumisha mtazamo kwa mrithi mmoja bila kufunga mapema upeo mpana wa ahadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa wakati umetumiwa kwa urahisi wa Kiswahili; sitiari ya ‘kulala pamoja na babu’ na utata wa ‘uzao’ vimehifadhiwa. ‘Nitauimarisha ufalme wake’ ni ya asili zaidi kuliko ‘nitauweka imara ufalme wake’ bila kupoteza maana ya kufanya ufalme uthabiti.
