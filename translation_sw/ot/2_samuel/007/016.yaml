base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/016.yaml
  text: And your house and your kingdom shall be made sure forever before me[b][a]; your throne shall be established forever.
translation:
  language: sw
  text: Na nyumba yako[a] na ufalme wako vitawekwa imara milele mbele yako[b]; kiti chako cha enzi kitakuwa thabiti milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nyumba” hapa huenda inamaanisha nyumba ya kifalme, yaani nasaba.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mbele yako”; baadhi ya mashahidi wa maandishi husoma “mbele yangu.”'
    reason: textual_variant
lexical_decisions:
- source_word: וְנֶאְמַן
  choice: vitawekwa imara
  rationale: Nifali ya אמן inaonyesha kufanywa kuwa thabiti, salama, na ya kudumu. Kauli hii inadumisha wazo la kutendewa huku ikiwa Kiswahili cha kawaida.
- source_word: בֵּיתְךָ
  choice: nyumba yako
  rationale: Neno בַּיִת limehifadhiwa kwa maana yake ya msingi, lakini katika ahadi hii ya kifalme linaweza kumaanisha nyumba ya kifalme, yaani nasaba; ufafanuzi umetolewa katika tanbihi.
- source_word: וּמַמְלַכְתְּךָ
  choice: na ufalme wako
  rationale: Hili ndilo neno la moja kwa moja na la kawaida kwa mamlaka au eneo la kifalme katika muktadha huu.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Neno hili linaeleza kudumu bila mwisho unaotajwa. Kurudiwa kwake katika mstari kumehifadhiwa kwa ajili ya mkazo.
- source_word: לְפָנֶיךָ
  choice: mbele yako
  rationale: Maandishi ya Kiebrania yaliyotolewa yana kiambishi cha nafsi ya pili ya kiume umoja, yaani “mbele yako.” Tofauti ya “mbele yangu” imewekwa katika tanbihi.
- source_word: כִּסְאֲךָ
  choice: kiti chako cha enzi
  rationale: Hii ni tafsiri ya kawaida ya kiti cha mfalme, ambacho pia kinawakilisha mamlaka yake ya kifalme.
- source_word: יִהְיֶה נָכוֹן
  choice: kitakuwa thabiti
  rationale: Muundo huu unaonyesha hali ya kuwa imara au iliyothibitishwa. “Kitakuwa thabiti” ni Kiswahili cha asili na pia kinatofautisha kauli hii na וְנֶאְמַן mwanzoni mwa mstari.
theological_decisions:
- issue: Lugha ya ahadi ya nasaba na uwezekano wa maana ya Kimasihi
  choice: Kuhifadhi maneno “nyumba,” “ufalme,” na “kiti cha enzi” bila kutaja wazi utimilifu wa Kimasihi
  alternative: Kutafsiri “nyumba” kuwa “nasaba” au kuongeza lugha inayoonyesha moja kwa moja utimilifu wa Kimasihi
  rationale: Katika muktadha wa karibu, mstari huu unamhakikishia Daudi kudumu kwa ukoo wake wa kifalme. Tafsiri inahifadhi kina na uwezekano mpana wa kitheolojia bila kuingiza hitimisho la kimadhehebu katika maneno yenyewe.
- issue: Tofauti ya maandishi katika לְפָנֶיךָ
  choice: Kusoma “mbele yako” katika matini kuu
  alternative: “mbele yangu”
  rationale: Maandishi ya Kiebrania yaliyotolewa yanasoma “mbele yako.” Kwa kuwa baadhi ya mashahidi wa maandishi wana “mbele yangu,” tofauti hiyo muhimu imehifadhiwa katika tanbihi badala ya kutatuliwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia “vitawekwa imara” na “kitakuwa thabiti” ili kuhifadhi tofauti ya maneno mawili ya Kiebrania, huku marudio ya “milele” yakidumishwa.
