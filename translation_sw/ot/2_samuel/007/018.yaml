  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּבֹא֙ הַ/מֶּ֣לֶךְ דָּוִ֔ד וַ/יֵּ֖שֶׁב לִ/פְנֵ֣י יְהוָ֑ה וַ/יֹּ֗אמֶר מִ֣י אָנֹכִ֞י אֲדֹנָ֤/י יְהוִה֙ וּ/מִ֣י בֵיתִ֔/י כִּ֥י הֲבִיאֹתַ֖/נִי עַד הֲלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/018.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, Lord GOD, and what is my house, that you have brought me this far?”
translation:
  language: sw
  text: Kisha Mfalme Daudi akaingia, akaketi mbele ya Yahwe, akasema, “Mimi ni nani, Ee Bwana Yahwe, na nyumba yangu[a] ni nini, hata umenileta mpaka hapa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “familia yangu” au “ukoo wangu.” Hapa “nyumba” inaweza kumaanisha watu wa nyumbani wa Daudi na pia nasaba yake ya kifalme, ikiendeleza matumizi ya neno “nyumba” katika sura hii.
    reason: Kubainisha upana wa maana ya בֵּיתִי bila kupoteza neno kuu ‘nyumba’ katika matini.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaingia
  rationale: Kitenzi בוא hapa kinaonyesha Daudi akiingia mahali pa kukaa mbele za Yahwe; ‘akaingia’ huhifadhi mwendo huo bila kubainisha mahali ambapo maandishi hayajapataja.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Mfalme Daudi
  rationale: Hili ndilo tumizi la kawaida la Kiswahili kwa cheo kinachofuatwa na jina.
- source_word: וַיֵּשֶׁב
  choice: akaketi
  rationale: Katika muktadha huu ישב ina maana ya kitendo cha kuketi, si kukaa mahali kwa muda mrefu.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Kauli hii ya kawaida ya Kiswahili huonyesha kuwa Daudi alikuwa katika uwepo wa Yahwe bila kuongeza maelezo ya mahali.
- source_word: מִי אָנֹכִי
  choice: Mimi ni nani
  rationale: Huhifadhi swali la balagha linaloonyesha unyenyekevu wa Daudi.
- source_word: אֲדֹנָי יְהוִה
  choice: Ee Bwana Yahwe
  rationale: ‘Bwana Yahwe’ huakisi majina yote mawili, na ‘Ee’ ni mwito wa moja kwa moja unaofaa katika sala ya Kiswahili.
- source_word: וּמִי בֵיתִי
  choice: na nyumba yangu ni nini
  rationale: Huhifadhi muundo wa swali na neno muhimu ‘nyumba,’ ambalo linaunganisha kifungu hiki na mchezo wa maana unaoenea katika sura nzima.
- source_word: כִּי
  choice: hata
  rationale: Katika swali hili, ‘hata’ huunganisha kwa kawaida hali ya Daudi na mshangao wake kwamba Mungu amemleta mpaka hatua hii.
- source_word: הֲבִיאֹתַנִי
  choice: umenileta
  rationale: Hii ni tafsiri ya moja kwa moja ya kausativi ya בוא, ‘kusababisha aje/kuleta.’
- source_word: עַד הֲלֹם
  choice: mpaka hapa
  rationale: Huhifadhi wazo la kufikishwa kwenye hatua ya sasa, bila kulazimisha ikiwa ni mahali, hali, au wakati.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina la agano יהוה; ‘Yahwe’ hulihifadhi kama jina maalumu na pia hutofautisha אֲדֹנָי יהוה kama ‘Bwana Yahwe.’
- issue: Maana ya ‘nyumba yangu’
  choice: Kudumisha ‘nyumba yangu’ katika matini kuu
  alternative: familia yangu / ukoo wangu / nasaba yangu
  rationale: ‘Nyumba’ ni neno kuu la kifasihi na kiteolojia katika 2 Samweli 7, likihusisha watu wa nyumbani, ukoo, na nasaba ya kifalme. Kulibakiza huhifadhi mwangwi huo bila kuamua maana moja pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumia vitenzi vinavyofuatana (‘akaingia, akaketi, akasema’). ‘Nyumba yangu ni nini’ imeachwa kwa makusudi ili kuhifadhi taswira na mvutano wa maana wa Kiebrania, huku tanbihi ikiifafanua.
