  text: But that night the word of Yahweh came to Nathan[a], saying,
translation:
  language: sw
  text: Lakini usiku huo neno la Yahweh likamjia Nathani, kusema,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Lakini ... likamjia
  rationale: Muundo huu unaendeleza simulizi; katika muktadha, “Lakini” huonyesha kwa kawaida tofauti kati ya kibali cha Nathani katika mstari uliotangulia na ufunuo wa Yahweh uliokuja baadaye usiku huo.
- source_word: בַּלַּיְלָה הַהוּא
  choice: usiku huo
  rationale: Hii ndiyo tafsiri ya kawaida na ya asili ya Kiswahili kwa kirai cha wakati kinachotaja usiku ule maalumu.
- source_word: וַיְהִי דְּבַר יְהוָה
  choice: neno la Yahweh likamjia
  rationale: Hili ni tamko la kawaida la kinabii. Kitenzi “likamjia” huwasilisha kwa Kiswahili maana ya ufunuo ulioelekezwa kwa nabii, huku “neno” likidumisha uzito wa lugha ya chanzo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: אֶל נָתָן
  choice: likamjia Nathani
  rationale: אֶל humtaja mpokeaji wa ufunuo; “likamjia Nathani” ni Kiswahili cha kawaida na huonyesha wazi mwelekeo wa neno hilo.
- source_word: לֵאמֹר
  choice: likisema
  rationale: Kitenzi hiki kinatanguliza yaliyomo katika usemi wa Mungu unaofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יְהוָה. “Yahweh” huhifadhi jina hilo kwa kulitohowa badala ya kuliwakilisha kwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri imetumia mtiririko wa kawaida wa simulizi na kudumisha tamko la kinabii “neno la Yahweh.” Hakuna tanbihi iliyohitajika, kwa kuwa muundo rasmi zaidi ungekuwa mzito bila kuongeza maana muhimu.
