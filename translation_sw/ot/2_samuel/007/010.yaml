reference: 2 Samuel 7:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י לְ/יִשְׂרָאֵ֤ל וּ/נְטַעְתִּי/ו֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹֽא יֹסִ֤יפוּ בְנֵֽי עַוְלָה֙ לְ/עַנּוֹת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/010.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], so that they may dwell in their own place and be disturbed no more. And the sons of wickedness shall no longer afflict them, as formerly.
translation:
  language: sw
  text: Nami nitawapangia watu wangu Israeli mahali, nami nitawapanda huko, ili wakae mahali pao, wala wasisumbuliwe tena. Wana wa uovu[a] hawataendelea tena kuwatesa kama hapo awali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “watenda maovu” au “watu waovu.” Kiebrania kihalisi: “wana wa uovu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: nitawapangia ... mahali
  rationale: Kitenzi שׂים kina maana ya kuweka, lakini pamoja na מָקוֹם katika ahadi hii kinaeleza kuwateulia au kuwapangia mahali. “Kuwapangia mahali” ni Kiswahili cha kawaida kinachohifadhi hatua ya Mungu.
- source_word: לְעַמִּי לְיִשְׂרָאֵל
  choice: watu wangu Israeli
  rationale: 'Virai hivi vinahusiana kwa uambatano: Israeli ndio watu wa Mungu. Uundaji huu unahifadhi umiliki wa agano na jina la taifa.'
- source_word: וּנְטַעְתִּיו
  choice: nitawapanda huko
  rationale: “Nitawapanda” linahifadhi sitiari ya kilimo inayomaanisha kuwakalisha kwa uthabiti. “Huko” huonyesha kwamba kupandwa kunahusiana na mahali palipotajwa, bila kuondoa sitiari.
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: ili wakae mahali pao wenyewe
  rationale: Israeli ni nomino ya mkusanyiko inayofuatiwa na maumbo ya umoja katika Kiebrania. Kiswahili hutumia wingi kwa kawaida kwa watu. תַּחְתָּיו hapa ni nahau ya kukaa mahali pao kwa usalama, si kuwa chini ya kitu fulani.
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: wasisumbuliwe tena
  rationale: רגז inaweza kumaanisha kutetemeka, kufadhaika, au kusumbuliwa. Katika muktadha wa usalama dhidi ya watesi, “kusumbuliwa” huwasilisha kuvurugwa na nguvu za nje bila kuifunga maana kwa hisia pekee.
- source_word: בְנֵי עַוְלָה
  choice: wana wa uovu
  rationale: Tafsiri hii inahifadhi nahau ya Kiebrania na umbo lake la kiume. Tanbihi inatoa tafsiri za kawaida zaidi za Kiswahili.
- source_word: לְעַנּוֹתוֹ
  choice: kuwatesa
  rationale: ענה katika Piel inaweza kumaanisha kutesa, kuonea, au kunyenyekeza. “Kuwatesa” ni pana na inafaa kwa matendo ya maadui dhidi ya Israeli.
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: kama hapo awali
  rationale: Kirai hiki kinalinganisha hali hiyo na nyakati zilizotangulia za mateso; “kama hapo awali” ni cha kawaida na sahihi.
theological_decisions:
- issue: Israeli kama nomino ya mkusanyiko yenye viambishi na vitenzi vya umoja
  choice: 'Kutumia wingi wa Kiswahili: “nitawapanda,” “wakae,” na “kuwatesa”'
  alternative: Kudumisha nafsi ya umoja kana kwamba Israeli ni mtu mmoja
  rationale: Kiebrania mara nyingi hulitazama taifa kama umoja wa mkusanyiko. Wingi ni wa kawaida na wazi zaidi katika Kiswahili, bila kubadili maana ya kiteolojia.
- issue: Nahau בְנֵי עַוְלָה
  choice: Kuhifadhi “wana wa uovu” katika matini kuu
  alternative: “watenda maovu” au “watu waovu”
  rationale: Chaguo kuu linahifadhi picha na umbo la Kiebrania; tanbihi hutoa maana kwa Kiswahili cha kinahau bila kuficha muundo wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya “kupanda” na nahau “wana wa uovu” zimehifadhiwa; sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili.
