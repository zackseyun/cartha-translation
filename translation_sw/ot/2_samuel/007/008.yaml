base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/008.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people, over Israel.'
translation:
  language: sw
  text: 'Basi sasa, utamwambia mtumishi wangu Daudi hivi: ‘Yahweh wa majeshi asema hivi: Mimi nilikuchukua kutoka malishoni[a], kutoka kufuata kundi la kondoo, ili uwe mtawala[b] juu ya watu wangu, juu ya Israeli.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka zizini.” Neno la Kiebrania linaweza kumaanisha eneo la malisho au mahali ambapo mifugo hukaa.
    reason: lexical_alternative
  - marker: b
    text: Au “kiongozi” au “mkuu.” Neno la Kiebrania humaanisha mtu aliyewekwa kuongoza au kutawala, bila kumwita kwa lazima “mfalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Inaonyesha wakati na pia hatua mpya katika ujumbe; ‘Basi sasa’ ni Kiswahili cha kawaida chenye nguvu ya mpito wa Kiebrania.
- source_word: כֹּה תֹאמַר
  choice: utamwambia hivi
  rationale: Ni namna ya kawaida ya Kiswahili ya kuwasilisha agizo la mjumbe, huku ikihifadhi nguvu ya kauli ya wakati ujao.
- source_word: לְעַבְדִּי לְדָוִד
  choice: mtumishi wangu Daudi
  rationale: ‘Mtumishi’ hapa ni cheo cha heshima kinachoeleza uhusiano wa Daudi na Mungu, si msisitizo wa hali ya utumwa; muundo huu pia ni wa kawaida katika Kiswahili.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Kauli hii ya mjumbe imetafsiriwa kwa njia ya sasa ya kinabii iliyo ya asili katika Kiswahili.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh wa majeshi
  rationale: Jina la agano limehifadhiwa kama ‘Yahweh’; ‘wa majeshi’ huwasilisha צְבָאוֹת bila kuamua kimya-kimya kama ni majeshi ya mbinguni au ya duniani.
- source_word: לְקַחְתִּיךָ
  choice: nilikuchukua
  rationale: Ni tafsiri ya moja kwa moja ya tendo la Mungu la kumtoa Daudi katika hali yake ya awali na kumteua.
- source_word: מִן הַנָּוֶה
  choice: kutoka malishoni
  rationale: ‘Malishoni’ ni usemi wa kawaida unaofaa mahali pa kulishia au kukaa mifugo; uwezekano wa zizi umewekwa katika tanbihi.
- source_word: מֵאַחַר הַצֹּאן
  choice: kutoka nyuma ya kundi la kondoo
  rationale: Inahifadhi taswira halisi ya Daudi akifuata kundi, bila kuibadili tu kuwa maelezo ya jumla ya kuchunga.
- source_word: לִהְיוֹת נָגִיד
  choice: ili uwe mtawala
  rationale: Infinitivu inaonyesha kusudi au matokeo; ‘mtawala’ huonyesha mamlaka ya kuongoza bila kuingiza cheo mahususi cha ‘mfalme’ ambacho hakitumiki hapa.
- source_word: עַל עַמִּי עַל יִשְׂרָאֵל
  choice: juu ya watu wangu, juu ya Israeli
  rationale: Kurudiwa kwa עַל kumehifadhiwa ili kudumisha msisitizo na mwendo wa kauli ya Kiebrania.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko linatumia moja kwa moja jina la Mungu la herufi nne; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya עבד kuhusu Daudi
  choice: mtumishi
  alternative: mtumwa
  rationale: Katika muktadha huu neno hilo ni utambulisho wa heshima wa Daudi mbele za Mungu na halilengi hasa hali ya utumwa.
- issue: Cheo נָגִיד
  choice: mtawala
  alternative: kiongozi au mkuu
  rationale: Neno linaonyesha mtu aliyeteuliwa kuongoza na kutawala, lakini halilingani lazima na cheo maalumu cha ‘mfalme’; tafsiri haipaswi kuongeza umahususi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘juu ya’ yamehifadhiwa kwa uaminifu wa kimuundo, na taswira ya kichungaji imeachwa wazi badala ya kufafanuliwa kupita kiasi.
