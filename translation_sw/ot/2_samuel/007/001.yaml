base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/001.yaml
  text: When the king was living in his house[a], and Yahweh had given him rest on every side from all his enemies,
translation:
  language: sw
  text: Mfalme alipokuwa akiishi katika nyumba yake[a], na Yahweh alikuwa amempa pumziko pande zote dhidi ya maadui zake wote,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikulu yake.” Kiebrania, “nyumba yake”; neno “nyumba” limehifadhiwa hapa pia kwa sababu linatanguliza mchezo wa maneno baadaye katika sura hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: alipokuwa
  rationale: Mfumo huu wa simulizi unaanzisha hali ya wakati katika tukio jipya. Kiswahili cha ‘alipokuwa’ kinaifanya sentensi isomeke kwa kawaida bila kuongeza neno lisilokuwamo katika chanzo.
- source_word: יָשַׁב
  choice: akiishi
  rationale: Katika muktadha huu kitenzi hakimaanishi tu kuketi, bali kukaa mahali kama makazi yaliyoimarika.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Cheo maalumu kilichotumiwa katika Kiebrania kimehifadhiwa badala ya kuweka jina la Daudi.
- source_word: בְּבֵיתוֹ
  choice: katika nyumba yake
  rationale: ‘Nyumba’ ndiyo maana ya msingi ya בַּיִת na pia inadumisha mchezo wa maana wa neno ‘nyumba’ unaoendelea katika sura hii; ‘ikulu’ ni uwezekano wa kimuktadha.
- source_word: וַיהוָה
  choice: na Yahwe
  rationale: Kiunganishi cha sentensi kimehifadhiwa, na jina la Mungu יהוה limetafsiriwa kwa namna ya jina ‘Yahwe’.
- source_word: הֵנִיחַ לוֹ
  choice: alikuwa amempa pumziko
  rationale: Hifili ya נוח hapa ina maana ya kumsababishia mtu apate pumziko au nafuu kutokana na vita; muundo huu unahifadhi maana hiyo ya kisababishi pamoja na hali iliyotangulia.
- source_word: מִסָּבִיב
  choice: pande zote
  rationale: Usemi huu unaeleza usalama uliomzunguka mfalme.
- source_word: מִכָּל אֹיְבָיו
  choice: kutokana na maadui zake wote
  rationale: Kirai hiki kinataja kile ambacho mfalme alipewa pumziko nacho, bila kupunguza wazo la jumla la ‘wote’.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni יהוה. ‘Yahwe’ huhifadhi jina la agano kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya makao ya kifalme katika בַּיִת
  choice: nyumba
  alternative: ikulu
  rationale: Ingawa makao ya mfalme yanaweza kuitwa ikulu, ‘nyumba’ iko karibu zaidi na neno la Kiebrania na huhifadhi uhusiano wa kifasihi na matumizi mbalimbali ya ‘nyumba’ baadaye katika sura.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishazi unaoishia kwa koma umehifadhiwa kwa sababu mstari huu unaendelea kisintaksia katika mstari unaofuata. ‘Pumziko pande zote kutokana na’ hudumisha kwa kiasi kikubwa mpangilio na maana ya Kiebrania bila kufasiri pumziko kuwa kutokuwepo kabisa kwa kila adui.
