base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/009.yaml
  text: And I was with you wherever you went[a], and I cut off all your enemies from before you. And I will make for you a great name[b], like the name of the great ones who are on the earth.
translation:
  language: sw
  text: Nami nilikuwa pamoja nawe kila mahali ulipokwenda, na niliwaangamiza maadui wako wote mbele yako. Nami nitakufanyia jina kubwa[a], kama jina la wakuu walioko duniani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umaarufu mkubwa.” Katika Kiebrania, “jina” mara nyingi humaanisha sifa au umaarufu.
    reason: lexical_alternative
  - marker: b
    text: Au, “walioko nchini.” Neno la Kiebrania linaweza kumaanisha “dunia” au “nchi.”
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: nilikuwa pamoja nawe
  rationale: Kauli hii inaendeleza simulizi la matendo ya Mungu yaliyopita na kuhifadhi maana ya kuwapo pamoja na Daudi na kumsaidia.
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: kila mahali ulipokwenda
  rationale: Hii ni Kiswahili cha kawaida kinachoonyesha upeo wote wa safari na shughuli za Daudi.
- source_word: וָאַכְרִתָה אֶת כָּל אֹיְבֶיךָ
  choice: kuwaangamiza maadui wako wote
  rationale: Katika muktadha huu כרת ina maana ya kuwaondoa kabisa au kuwaangamiza maadui; tafsiri hii inaleta nguvu ya kitenzi kwa Kiswahili cha kawaida.
- source_word: מִפָּנֶיךָ
  choice: mbele yako
  rationale: Inahifadhi taswira ya Kiebrania ya maadui kuondolewa kutoka mbele ya Daudi.
- source_word: וְעָשִׂיתִי לְךָ
  choice: nitakufanyia
  rationale: Wakati ujao unafaa katika mtiririko wa ahadi, na kiambishi '-ia' kinahifadhi maana ya tendo kufanywa kwa manufaa ya Daudi.
- source_word: שֵׁם גָּדוֹל
  choice: jina kubwa
  rationale: Inahifadhi nahau ya kibiblia ya 'jina,' ambayo hapa pia humaanisha sifa au umaarufu.
- source_word: כְּשֵׁם הַגְּדֹלִים
  choice: kama jina la wakuu
  rationale: Kurudia 'jina' kunahifadhi ulinganifu wa Kiebrania, na 'wakuu' hakubainishi jinsia isiyobainishwa wazi na muktadha.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: walioko duniani
  rationale: Katika ulinganisho huu mpana, 'duniani' inaelekea kufaa kuliko kurejelea nchi fulani, ingawa neno אָרֶץ linaweza pia kumaanisha nchi.
theological_decisions:
- issue: Nguvu ya wakati wa וְעָשִׂיתִי katika muktadha wa ahadi ya Mungu
  choice: nitakufanyia jina kubwa
  alternative: nimekufanyia jina kubwa
  rationale: Ingawa umbo hilo ni qatal, mtiririko wa hotuba unatoka katika matendo ya zamani kwenda kwenye ahadi; wakati ujao unaonyesha vizuri zaidi nguvu ya ahadi bila kufuta mvutano wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Nahau ya kibiblia “jina kubwa” imehifadhiwa, huku maana yake ikifafanuliwa katika tanbihi.
