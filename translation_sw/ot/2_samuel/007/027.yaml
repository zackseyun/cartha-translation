  text: כִּֽי אַתָּה֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל גָּלִ֜יתָה אֶת אֹ֤זֶן עַבְדְּ/ךָ֙ לֵ/אמֹ֔ר בַּ֖יִת אֶבְנֶה לָּ֑/ךְ עַל כֵּ֗ן מָצָ֤א עַבְדְּ/ךָ֙ אֶת לִבּ֔/וֹ לְ/הִתְפַּלֵּ֣ל אֵלֶ֔י/ךָ אֶת הַ/תְּפִלָּ֖ה הַ/זֹּֽאת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/027.yaml
  text: For you[a], O Yahweh of hosts, God of Israel, have revealed this to your servant, saying[c][b], ‘I will build you a house.’ Therefore your servant has found it in his heart to pray this prayer to you.
translation:
  language: sw
  text: Kwa maana wewe, Ee Yahwe wa majeshi, Mungu wa Israeli, umemfunulia mtumishi wako[a], ukisema, “Nitakujengea nyumba[b].” Kwa hiyo, mtumishi wako amepata moyo[c] wa kukuomba sala hii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “umefunua sikio la mtumishi wako,” nahau ya Kiebrania yenye maana ya kumfunulia au kumjulisha jambo.
    reason: lexical_alternative
  - marker: b
    text: Neno “nyumba” katika muktadha huu linaweza pia kuwa na mwangwi wa nasaba ya kifalme, si jengo tu.
    reason: lexical_alternative
  - marker: c
    text: Kwa neno kwa neno, “ameupata moyo wake,” yaani amepata ujasiri au uthabiti wa kuomba.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahwe wa majeshi
  rationale: Linatunza jina la agano יהוה na maana ya msingi ya צְבָאוֹת kama majeshi au vikosi vilivyo chini ya mamlaka ya Mungu, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Tafsiri ya moja kwa moja ya muundo wa Kiebrania, ikidumisha utambulisho wa Mungu katika uhusiano wake na Israeli.
- source_word: גָּלִיתָה אֶת אֹזֶן עַבְדְּךָ
  choice: umemfunulia mtumishi wako
  rationale: Nahau hiyo ina maana halisi ya ‘umefunua sikio la mtumishi wako,’ lakini humaanisha kumjulisha au kumfunulia jambo. Tafsiri kuu inatoa maana yake kwa Kiswahili cha asili.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika sala ya kifalme, neno hili linaonyesha unyenyekevu na utii wa Daudi mbele za Mungu; ‘mtumishi’ linafaa zaidi hapa kuliko ‘mtumwa.’
- source_word: לֵאמֹר
  choice: kwa kusema
  rationale: Linaonyesha wazi utangulizi wa maneno yaliyonukuliwa, kama ilivyo katika Kiebrania.
- source_word: בַּיִת אֶבְנֶה לָּךְ
  choice: Nitakujengea nyumba
  rationale: Muundo huu ni wa asili katika Kiswahili na unadumisha neno ‘nyumba,’ ambalo katika muktadha linaweza kugusia jengo na pia ukoo wa kifalme.
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Linaonyesha kuwa ufunuo wa Mungu ndio sababu ya Daudi kuthubutu kutoa sala hii.
- source_word: מָצָא ... אֶת לִבּוֹ
  choice: amepata moyo
  rationale: Usemi huu unakaribia nahau ya Kiebrania ‘ameupata moyo wake’ na katika Kiswahili unaeleweka kama kupata ujasiri au uthabiti wa kufanya jambo.
- source_word: לְהִתְפַּלֵּל אֵלֶיךָ אֶת הַתְּפִלָּה הַזֹּאת
  choice: wa kukuomba sala hii
  rationale: Unawasilisha tendo la kuelekeza sala hii kwa Mungu kwa lugha nyepesi na ya kawaida ya Kiswahili.
theological_decisions:
- issue: Nahau ya kufunuliwa sikio
  choice: umemfunulia mtumishi wako
  alternative: umefunua sikio la mtumishi wako
  rationale: Tafsiri ya neno kwa neno ingekuwa yenye ukungu kwa wasomaji wengi. Maana ya ufunuo imewekwa katika matini, huku picha halisi ikihifadhiwa katika tanbihi.
- issue: Maana ya ‘nyumba’
  choice: nyumba
  alternative: hekalu; nasaba ya kifalme
  rationale: Neno la Kiebrania linabeba mwangwi wa jengo na wa nasaba katika muktadha wa agano la Daudi. ‘Nyumba’ linatunza mvutano huo badala ya kuufafanua kwa upande mmoja tu.
- issue: Nahau ya ‘kuupata moyo’
  choice: amepata moyo
  alternative: amepata ujasiri; ameupata moyo wake
  rationale: ‘Amepata moyo’ ni nahau ya Kiswahili inayoeleweka na pia inabaki karibu na picha ya Kiebrania bila kuifanya sentensi kuwa ngumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “Ee Yahwe wa majeshi” unatunza mwito wa heshima na cheo cha Kiebrania; nahau zisizo wazi zimewasilishwa kwa Kiswahili cha asili huku umbo lake halisi likielezwa katika tanbihi.
