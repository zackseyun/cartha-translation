  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הוֹאֵל֙ וּ/בָרֵךְ֙ אֶת בֵּ֣ית עַבְדְּ/ךָ֔ לִ/הְי֥וֹת לְ/עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽי אַתָּ֞ה אֲדֹנָ֤/י יְהוִה֙ דִּבַּ֔רְתָּ וּ/מִ/בִּרְכָ֣תְ/ךָ֔ יְבֹרַ֥ךְ בֵּֽית עַבְדְּ/ךָ֖ לְ/עוֹלָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/029.yaml
  text: And now[a], please be willing and bless the house of your servant, that it may continue before you forever. For you, Lord Yahweh, have spoken[c][b], and by your blessing the house of your servant will be blessed forever.
translation:
  language: sw
  text: Na sasa, uwe radhi kuibariki nyumba ya mtumishi wako[a], ili idumu mbele zako milele. Kwa maana wewe, Bwana Yahwe[b], umesema, na kwa baraka yako nyumba ya mtumishi wako itabarikiwa milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nyumba” hapa inaweza pia kumaanisha jamaa, nasaba, au ukoo wa kifalme wa Daudi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina “Adonai YHWH,” yaani cheo “Bwana” pamoja na jina “Yahwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹאֵל וּבָרֵךְ
  choice: uwe radhi kuibariki
  rationale: Kauli “uwe radhi” inaonyesha ombi la Daudi kwamba Mungu akubali kwa neema kutenda; muundo wenye kitenzi-jina “kuibariki” ni wa kawaida katika Kiswahili na unabeba pia amri ya וּבָרֵךְ.
- source_word: בֵּית עַבְדְּךָ
  choice: nyumba ya mtumishi wako
  rationale: “Nyumba” huhifadhi upana wa neno la Kiebrania, ambalo hapa linaweza kumaanisha jamaa ya Daudi, ukoo wake wa kifalme, au nasaba yake, bila kulifafanua kupita kiasi.
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: ili idumu mbele zako milele
  rationale: “Idumu” huwasilisha kuwapo kunakoendelea kwa milele, huku “mbele zako” ikihifadhi taswira ya chanzo bila kuongeza wazo la ‘kuthibitishwa’ lisilotajwa moja kwa moja.
- source_word: אֲדֹנָי יְהוִה
  choice: Bwana Yahwe
  rationale: “Bwana” hutafsiri cheo אֲדֹנָי, na “Yahwe” huhifadhi jina la agano יהוה katika muungano huu wa cheo na jina.
- source_word: דִּבַּרְתָּ
  choice: umesema
  rationale: Wakati timilifu wa Kiswahili unaonyesha neno ambalo Mungu tayari amesema na ambalo bado ndilo msingi wa uhakika wa ombi hili.
- source_word: וּמִבִּרְכָתְךָ יְבֹרַךְ
  choice: na kwa baraka yako ... itabarikiwa
  rationale: “Kwa” linaonyesha kwamba baraka ya Mungu ndiyo chanzo au njia ya kubarikiwa kwa nyumba hiyo; hali ya kutendwa na mwelekeo wa wakati ujao vimehifadhiwa.
- source_word: לְעוֹלָם
  choice: milele
  rationale: “Milele” ni usemi wa kawaida na wenye uzito unaofaa kwa kudumu kwa ahadi ya agano.
theological_decisions:
- issue: Maana ya “nyumba” katika ahadi kwa Daudi
  choice: nyumba ya mtumishi wako
  alternative: ukoo wa kifalme wa mtumishi wako
  rationale: Muktadha unahusu nasaba ya Daudi, lakini neno “nyumba” huhifadhi kwa makusudi maana pana na mwangwi wa kifasihi wa sura hii badala ya kuufanya usemi huo kuwa wa nasaba pekee.
- issue: Uwasilishaji wa אֲדֹנָי יְהוִה
  choice: Bwana Yahwe
  alternative: Bwana MUNGU
  rationale: Uwasilishaji huu unatofautisha cheo “Bwana” na jina la agano “Yahwe,” na hivyo unaakisi moja kwa moja muundo wa Kiebrania bila kuunganisha vipengele hivyo viwili.
- issue: Ikiwa “mbele zako” inamaanisha pia kibali cha Mungu
  choice: mbele zako
  alternative: katika kibali chako
  rationale: Kiebrania kinaweza kuleta wazo la kuwapo mbele za Mungu na huenda pia kibali chake, lakini tafsiri haijaingiza “kibali” waziwazi ili kutohitimisha maana ambayo chanzo kinaiacha ndani ya taswira.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayosomeka kwa urahisi. “Uwe radhi” hudumisha sauti ya ombi, “idumu” huepuka usemi mzito wa neno kwa neno, na urudiaji wa “nyumba ya mtumishi wako” unahifadhi msisitizo wa chanzo.
