  text: אֲנִי֙ אֶהְיֶה לּ֣/וֹ לְ/אָ֔ב וְ/ה֖וּא יִהְיֶה לִּ֣/י לְ/בֵ֑ן אֲשֶׁר֙ בְּ/הַ֣עֲוֺת֔/וֹ וְ/הֹֽכַחְתִּי/ו֙ בְּ/שֵׁ֣בֶט אֲנָשִׁ֔ים וּ/בְ/נִגְעֵ֖י בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/014.yaml
  text: I will be a father to him[a], and he will be a son to me. When he commits iniquity, I will discipline him with the rod of men and with the blows of the sons of man.
translation:
  language: sw
  text: Mimi nitakuwa baba kwake, naye atakuwa mwana kwangu. Atakapofanya uovu, nitamtia adabu kwa fimbo ya wanadamu na kwa mapigo ya wana wa binadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa namna ya kawaida zaidi: “kwa mapigo ya kibinadamu.” Kiebrania kina “kwa mapigo ya wana wa binadamu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: nitakuwa baba kwake
  rationale: Muundo wa uhusiano wenye kihusishi ל umehifadhiwa kwa Kiswahili cha kawaida, badala ya kulainishwa kuwa tu “nitakuwa baba yake.”
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: naye atakuwa mwana kwangu
  rationale: Huhifadhi usambamba wa kauli ya agano na sehemu ya kwanza kwa lugha ya asili na yenye heshima.
- source_word: אֲשֶׁר בְּהַעֲוֺתוֹ
  choice: Atakapofanya uovu
  rationale: אֲשֶׁר hapa huanzisha hali ya wakati; “atakapofanya” huepuka kuifanya kauli kuwa sharti kali, huku “uovu” ikihifadhi uzito wa kimaadili wa mzizi עוה.
- source_word: וְהֹכַחְתִּיו
  choice: nitamtia adabu
  rationale: Katika muktadha wa fimbo na mapigo, kauli hii inaonyesha marekebisho kwa njia ya kuadhibu, si karipio la maneno pekee.
- source_word: בְּשֵׁבֶט אֲנָשִׁים
  choice: kwa fimbo ya wanadamu
  rationale: Huhifadhi sitiari ya fimbo na kutokuamua kimyakimya kama maana ni adhabu ya kibinadamu kwa ujumla au adhabu kupitia mawakala wa kibinadamu.
- source_word: וּבְנִגְעֵי בְּנֵי אָדָם
  choice: na kwa mapigo ya wanadamu
  rationale: “Mapigo” huwasilisha נגע kwa uwazi; “wanadamu” ni Kiswahili cha kawaida kinachoonyesha kwamba בני אדם inamaanisha jamii ya binadamu kwa ujumla.
theological_decisions:
- issue: Upeo wa ahadi ya uhusiano wa baba na mwana katika ukoo wa kifalme wa Daudi na matumizi yake ya baadaye kuhusu Masihi
  choice: Aya imetafsiriwa katika maana yake ya karibu kuhusu mwana au mfalme wa ukoo wa Daudi bila kuongeza tafsiri ya Kimasihi moja kwa moja katika matini.
  alternative: Kuitafsiri kauli hii moja kwa moja kuwa inamhusu Masihi katika matini kuu.
  rationale: Muktadha wa karibu ni agano na Daudi kuhusu mzao wake. Maneno yameachwa yaweze kubeba matumizi mapana ya baadaye bila kuingiza ufafanuzi usiotajwa wazi katika Kiebrania.
- issue: Uhakika au usharti wa kosa la mwana
  choice: Atakapofanya uovu
  alternative: Akifanya uovu
  rationale: אֲשֶׁר katika muundo huu hutoa hali ya wakati inayohusiana na tendo linalofuata. “Atakapofanya” huhifadhi msisitizo huo bila kuugeuza kuwa sharti lisilo na uhakika, ingawa aya yenyewe haidai kwamba kila mtawala wa ukoo huo lazima atende uovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mwana kwangu” na “baba kwake” zimechaguliwa ili kuhifadhi muundo wa uhusiano wa Kiebrania; “nitamtia adabu” ni ya kawaida zaidi kuliko “nitamrudi” na inaonyesha marekebisho yenye adhabu.
