base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/002.yaml
  text: And the king said to Nathan the prophet[a], “See now, I dwell in a house of cedar, but the ark of God dwells within curtains.”
translation:
  language: sw
  text: Naye mfalme akamwambia Nathani nabii, “Tazama sasa, mimi ninakaa katika nyumba ya mierezi, lakini sanduku la Mungu linakaa ndani ya mapazia[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani ya pazia”; neno la Kiebrania linamaanisha pazia au kitambaa cha hema, na katika muktadha huu linaweza kurejelea vitambaa vya maskani kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Naye ... akamwambia
  rationale: Muundo huu unaendeleza simulizi kwa njia ya kawaida ya Kiswahili huku ukihifadhi kiunganishi cha Kiebrania.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Kiebrania kinatumia cheo chenye uhusika maalumu; hakuna haja ya kuongeza jina ‘Daudi’.
- source_word: נָתָן הַנָּבִיא
  choice: nabii Nathani
  rationale: Hili ni tambulisho la Nathani kwa cheo chake, kwa mpangilio wa kawaida wa Kiswahili.
- source_word: רְאֵה נָא
  choice: Hebu tazama
  rationale: ‘Hebu’ huwasilisha kwa kawaida nguvu ya chembe נָא katika mwito huu wa kuvuta fikira, bila kuufanya ombi la kusihi sana.
- source_word: אָנֹכִי יוֹשֵׁב
  choice: mimi ninakaa
  rationale: Kiwakilishi huru ‘mimi’ kinahifadhi msisitizo wa אָנֹכִי, na ‘ninakaa’ kinafaa kwa makao huku kikidumisha ulinganifu na sanduku.
- source_word: בְּבֵית אֲרָזִים
  choice: katika nyumba ya mbao za mierezi
  rationale: Hufafanua kwa kawaida kuwa mierezi ndiyo nyenzo ya nyumba bila kubadili maana kuwa nyumba iliyo kati ya miti ya mierezi.
- source_word: וַאֲרוֹן הָאֱלֹהִים
  choice: lakini sanduku la Mungu
  rationale: Ingawa וְ kwa umbo ni kiunganishi cha jumla, hapa kinaonyesha tofauti kati ya makao ya mfalme na mahali lilipo sanduku; ‘lakini’ huonyesha nguvu hiyo ya discourse.
- source_word: בְּתוֹךְ הַיְרִיעָה
  choice: ndani ya pazia la hema
  rationale: יְרִיעָה ni pazia au kitambaa cha hema, hasa katika muktadha wa maskani; tafsiri hii huhifadhi picha halisi badala ya kuifanya tu ‘hema’.
theological_decisions:
- issue: Mahali pa kukaa kwa sanduku la Mungu
  choice: sanduku la Mungu linakaa ndani ya pazia la hema
  alternative: sanduku la Mungu liko ndani ya hema
  rationale: Tafsiri inadumisha sitiari ya ‘kukaa’ inayotumiwa pia kwa mfalme na neno mahususi יְרִיעָה, bila kuingiza mapema teolojia ya hekalu au kulifanya neno hilo kuwa ‘hema’ kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Kurudiwa kwa ‘ninakaa/linakaa’ kumedumishwa ili kuhifadhi ulinganifu wa makusudi katika Kiebrania.
