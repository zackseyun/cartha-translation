base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/022.yaml
  text: Therefore you are great[a], Lord GOD, for there is none like you, and there is no God besides you[b], according to all that we have heard with our ears.
translation:
  language: sw
  text: Kwa hiyo wewe ni mkuu, Ee Bwana Yahweh[a], kwa maana hakuna aliye kama wewe, wala hakuna Mungu ila wewe[b], kulingana na yote tuliyoyasikia kwa masikio yetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Bwana YHWH.” YHWH ni jina binafsi la Mungu, linalowakilishwa hapa kwa “Yahweh.”'
    reason: cultural_note
  - marker: b
    text: Au, “wala hakuna mungu isipokuwa wewe” / “wala hakuna Mungu mbali na wewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Hutambulisha hitimisho linalotokana na matendo ya Mungu na sala iliyotangulia; ni usemi wa kawaida unaohifadhi nguvu ya kimantiki.
- source_word: גָּדַלְתָּ
  choice: wewe ni mkuu
  rationale: Kauli timilifu ya mzizi גדל inaweza kuonyesha hali iliyothibitika au kutambuliwa; tafsiri hii inafaa katika muktadha wa sifa bila kuongeza ufafanuzi.
- source_word: אֲדֹנָי יְהוִה
  choice: Bwana YAHWEH
  rationale: Inahifadhi tofauti kati ya cheo אֲדֹנָי, ‘Bwana,’ na jina la agano יהוה, badala ya kuyafanya yote mawili kuwa ‘Bwana.’
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha msingi wa tamko lililotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: אֵין כָּמוֹךָ
  choice: hakuna aliye kama wewe
  rationale: Huhifadhi kauli ya Kiebrania kuhusu kutolinganishwa kwa Mungu kwa njia ya asili katika Kiswahili.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: wala hakuna Mungu mwingine ila wewe
  rationale: זוּלָתֶךָ huonyesha kutengwa kabisa—‘ila wewe’ au ‘isipokuwa wewe’; neno ‘mwingine’ hufanya uhusiano wa sentensi uwe wa kawaida bila kudhoofisha dai la upekee.
- source_word: בְּכֹל אֲשֶׁר שָׁמַעְנוּ בְּאָזְנֵינוּ
  choice: kulingana na yote tuliyoyasikia kwa masikio yetu
  rationale: Inahifadhi kiunganishi cha kipimo au ushahidi pamoja na msisitizo halisi wa nahau ‘kwa masikio yetu.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה katika cheo אֲדֹנָי יְהוִה
  choice: Bwana YAHWEH
  alternative: Bwana MUNGU; Bwana Mwenyezi
  rationale: Uamuzi huu unatofautisha cheo ‘Bwana’ na jina binafsi la Mungu lililo katika maandishi ya Kiebrania. Tanbihi husaidia msomaji asiyezoea umbo YAHWEH.
- issue: Upekee wa Mungu katika אֵין אֱלֹהִים זוּלָתֶךָ
  choice: wala hakuna Mungu mwingine ila wewe
  alternative: wala hakuna mungu isipokuwa wewe; wala hakuna Mungu mbali nawe
  rationale: Inahifadhi dai la moja kwa moja la maandishi kuhusu upekee wa Mungu bila kulipanua kuwa mfumo wa kifalsafa au wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na msisitizo wa ‘kwa masikio yetu’ umehifadhiwa, huku sentensi ikibaki wazi kwa msomaji wa kawaida.
