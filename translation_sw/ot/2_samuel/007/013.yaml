base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/013.yaml
  text: He will build a house for my name[a], and I will establish the throne of his kingdom forever.
translation:
  language: sw
  text: Yeye atajenga nyumba kwa ajili ya jina langu[a], nami nitakiimarisha kiti cha enzi cha ufalme wake milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu kwa ajili ya jina langu.” Kiebrania kinasema “nyumba kwa ajili ya jina langu,” na hivyo kuhifadhi mchezo wa maneno katika sura hii kati ya hekalu na nasaba ya kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Yeye ndiye
  rationale: Kiwakilishi huru cha nafsi ya tatu, umoja wa kiume, kinamtaja mhusika waziwazi; “yeye ndiye” huonyesha msisitizo wa kawaida wa Kiswahili bila kubadili maana.
- source_word: יִבְנֶה
  choice: atakayejenga
  rationale: Qal imperfect ya nafsi ya tatu ya kiume umoja inaeleza tendo la wakati ujao katika muktadha wa ahadi.
- source_word: בַּיִת
  choice: nyumba
  rationale: Neno hilo humaanisha moja kwa moja “nyumba.” Hapa linarejelea hekalu, lakini “nyumba” huhifadhi mchezo wa maneno wa sura hii kati ya nyumba ya ibada na nyumba ya kifalme (nasaba).
- source_word: לִשְׁמִי
  choice: kwa ajili ya jina langu
  rationale: Huhifadhi nahau ya Kiebrania na kusudi lake bila kuifafanua kupita kiasi.
- source_word: וְכֹנַנְתִּי
  choice: nami nitakifanya imara
  rationale: Kitenzi kina maana ya kuweka thabiti au kuimarisha; katika mfululizo huu wa ahadi kina nguvu ya wakati ujao.
- source_word: אֶת כִּסֵּא
  choice: kiti
  rationale: כִּסֵּא ni kiti cha enzi au kiti cha utawala. Pamoja na “cha ufalme,” “kiti” ni cha asili na hakirudii wazo la kifalme bila lazima.
- source_word: מַמְלַכְתּוֹ
  choice: cha ufalme wake
  rationale: Neno hilo hueleza ufalme au mamlaka ya kifalme; umilikaji wa nafsi ya tatu umehifadhiwa.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Nahau hii ya kawaida inaonyesha kudumu bila mwisho katika muktadha wa ahadi ya agano.
theological_decisions:
- issue: Iwapo בַּיִת itafsiriwe “nyumba” au ifafanuliwe kuwa “hekalu”
  choice: nyumba
  alternative: hekalu
  rationale: 'Jambo linalorejelewa moja kwa moja ni hekalu atakalojenga mwana wa Daudi, lakini “nyumba” huhifadhi maana mbili muhimu katika sura hii: jengo la ibada na nasaba ya kifalme.'
- issue: Nguvu ya עַד עוֹלָם katika ahadi kwa Daudi
  choice: milele
  alternative: kwa muda mrefu sana
  rationale: Katika muktadha huu wa agano, usemi huo una nguvu ya kudumu; haupaswi kudhoofishwa kuwa kipindi kirefu tu.
- issue: Jinsi ya kutafsiri כִּסֵּא מַמְלַכְתּוֹ kwa Kiswahili cha kawaida
  choice: kiti cha ufalme wake
  alternative: kiti cha enzi cha ufalme wake
  rationale: “Kiti cha ufalme” huwasilisha kiti kama ishara ya utawala huku kikiepuka uradidi usio wa lazima wa “enzi” na “ufalme.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kueleweka kwa wasomaji wa kawaida, huku nahau ya “jina langu” na mchezo wa maana wa “nyumba” vikihifadhiwa.
