base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/021.yaml
  text: Because of your word and according to your heart[a], you have done all this greatness[c][b], to make your servant know it.
translation:
  language: sw
  text: Kwa sababu ya neno lako, na kulingana na moyo wako[a], umefanya ukuu huu wote[b], ili umjulishe mtumishi wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kulingana na nia au mapenzi yako mwenyewe.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kiko katika umoja: “ukuu huu wote”; yaani, tendo hili lote kuu. Tafsiri nyingine husema “mambo haya yote makuu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲבוּר דְּבָרְךָ
  choice: Kwa ajili ya neno lako
  rationale: בַּעֲבוּר huonyesha sababu au msingi, na דָּבָר inaweza kumaanisha neno, jambo, au ahadi. Tafsiri hii inadumisha upana wa Kiebrania na inaweza kueleweka katika muktadha wa ahadi ya Mungu.
- source_word: וּכְלִבְּךָ
  choice: na kwa kadiri ya moyo wako
  rationale: לֵב hapa huonyesha nia au mapenzi ya ndani. Kutaja moyo kunahifadhi sitiari ya Kiebrania bila kuibadili moja kwa moja kuwa 'mapenzi'.
- source_word: עָשִׂיתָ
  choice: umefanya
  rationale: Kauli timilifu ya Kiebrania inaonyesha tendo lililokamilika lenye umuhimu katika sala hii.
- source_word: אֵת כָּל הַגְּדוּלָּה הַזֹּאת
  choice: ukuu huu wote
  rationale: Nomino ya Kiebrania iko katika umoja na inaleta wazo la tendo kuu la Mungu kama onyesho moja lililoungana la ukuu wake.
- source_word: לְהוֹדִיעַ
  choice: ili umjulishe
  rationale: Hifili ya ידע ina maana ya kusababisha mtu ajue. 'Umjulishe' ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kisababishi.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Katika sala ya kifalme, 'mtumishi wako' ni tafsiri inayofaa ya kujitaja kwa Daudi kwa unyenyekevu mbele za Mungu.
theological_decisions:
- issue: Maana ya 'neno lako' katika muktadha wa agano
  choice: neno lako
  alternative: ahadi yako; yale uliyosema
  rationale: Muktadha unaelekeza kwenye tangazo au ahadi ya Mungu kwa Daudi, lakini Kiebrania kinasema 'neno lako.' Tafsiri pana inaepuka kufunga maana katika ufafanuzi mmoja.
- issue: Lugha ya kumwelezea Mungu kwa sitiari ya moyo
  choice: kwa kadiri ya moyo wako
  alternative: kulingana na mapenzi yako; kulingana na nia yako
  rationale: Kiebrania kinatumia 'moyo' kueleza nia ya ndani ya Mungu. Sitiari imehifadhiwa ili kutatua mvutano huo kwa lugha ya mstari wenyewe badala ya kuugeuza kuwa dhana ya kinadharia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo 'kwa kadiri ya moyo wako' umechaguliwa kuhifadhi sitiari ya Kiebrania; 'ukuu huu wote' huhifadhi nomino ya umoja ingawa ni usemi wenye uzito kidogo katika Kiswahili.
