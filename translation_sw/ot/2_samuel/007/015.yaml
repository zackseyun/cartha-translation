base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/015.yaml
  text: But my steadfast love will not depart from him[a], as I removed it from Saul[b], whom I removed from before you.
translation:
  language: sw
  text: Lakini upendo wangu wa kudumu hautaondoka kwake[a], kama nilivyouondoa kutoka kwa Sauli, ambaye nilimwondoa kutoka mbele yako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo wangu mwaminifu” au “uaminifu wangu wa agano.” Neno la Kiebrania lina maana ya upendo thabiti na mwaminifu katika uhusiano wa agano.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa neno kwa neno ni “ambaye nilimwondoa kutoka mbele yako.” Huenda hii inahusu kuondolewa kwa Sauli katika nafasi yake kuhusiana na Daudi, wala si kuondoka mahali fulani tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדִּי
  choice: upendo wangu wa kudumu
  rationale: חֶסֶד hapa inaonyesha upendo thabiti na uaminifu katika uhusiano wa agano. ‘Upendo wangu wa kudumu’ ni Kiswahili cha kawaida kinachohifadhi uzito huo bila kuufanya kuwa hisia tu.
- source_word: יָסוּר
  choice: hautaondoka
  rationale: Kitenzi סור kinaweza kumaanisha kuondoka, kugeuka kando, au kuondolewa. Kwa kuwa ‘upendo’ ndio kiima, ‘hautaondoka’ ni ya asili na inadumisha maana ya kutotenganishwa naye.
- source_word: מִמֶּנּוּ
  choice: kwake
  rationale: מן pamoja na kiambishi cha nafsi huonyesha kutengana na huyo mwana au mrithi wa kifalme. ‘Kwake’ ni usemi mfupi na wa kawaida katika Kiswahili.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: Neno hili linaanzisha ulinganisho na yaliyompata Sauli; ‘kama’ linahifadhi nguvu hiyo ya kulinganisha.
- source_word: הֲסִרֹתִי
  choice: nilivyouondoa / nilimwondoa
  rationale: 'Hifili ya סור ni ya kusababisha: kuondoa. Viambishi vya Kiswahili vinaonyesha kuwa mara ya kwanza kinachoondolewa ni ‘upendo,’ na mara ya pili ni Sauli.'
- source_word: מֵעִם שָׁאוּל
  choice: kwa Sauli
  rationale: Kirai hiki huonyesha kuondolewa kwa kitu kilichokuwa pamoja na Sauli. ‘Kuondoa kwa Sauli’ kinaeleweka kiasili kuwa kukiondoa kisibaki kwake.
- source_word: אֲשֶׁר הֲסִרֹתִי מִלְּפָנֶיךָ
  choice: ambaye nilimwondoa mbele yako
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania ya ‘kutoka mbele yako’ bila kuifafanua kimakusudi kuwa kuondolewa katika ufalme, ingawa muktadha unaelekea huko.
theological_decisions:
- issue: Maana ya חֶסֶד katika muktadha wa agano la Daudi
  choice: upendo wangu wa kudumu
  alternative: fadhili zangu; upendo wangu mwaminifu; uaminifu wangu wa agano
  rationale: Chaguo hili huhifadhi upendo thabiti na uaminifu wa Mungu kwa uhusiano wake wa agano bila kuingiza kanuni finyu ya kimadhehebu.
- issue: Maana ya ‘mbele yako’
  choice: Kuhifadhi usemi ‘mbele yako’
  alternative: kutoka katika uwepo wako; kutoka kuwa mfalme kabla yako
  rationale: Kiebrania kinaacha usemi huu ukiwa na upana fulani. Kuuhifadhi huepuka kuamua kimya kimya kwamba unamaanisha tu mahali alipo Sauli au cheo chake cha kifalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo unahifadhi ulinganisho na marudio ya mzizi סור kadiri Kiswahili kinavyoruhusu.
