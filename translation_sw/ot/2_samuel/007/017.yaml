  text: כְּ/כֹל֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וּ/כְ/כֹ֖ל הַ/חִזָּי֣וֹן הַ/זֶּ֑ה כֵּ֛ן דִּבֶּ֥ר נָתָ֖ן אֶל דָּוִֽד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/017.yaml
  text: According to all these words and according to all this vision[a], so Nathan spoke to David.
translation:
  language: sw
  text: Sawasawa na maneno haya yote, na sawasawa na maono haya yote[a], ndivyo Nathani alivyosema kwa Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ufunuo.” Neno la Kiebrania linamaanisha ufunuo wa kinabii, ambao mara nyingi hupokelewa kwa njia ya maono.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל
  choice: Kwa kadiri ya ... yote
  rationale: Kiambishi כְּ kinaonyesha ulinganifu au kufuatana na jambo, na כֹּל humaanisha ‘yote.’ Usemi huu unahifadhi maana ya ‘sawasawa na yote’ kwa Kiswahili cha kawaida.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: maneno haya
  rationale: דְּבָרִים hapa ni maudhui ya ujumbe wa Mungu ambao Nathani anauwasilisha; ‘maneno’ huhifadhi wazi hali yake ya kutamkwa.
- source_word: וּכְכֹל
  choice: na kwa kadiri ya ... yote
  rationale: Marudio ya muundo wa Kiebrania yamehifadhiwa ili kuendeleza msisitizo na ulinganifu wa kishairi wa sentensi.
- source_word: הַחִזָּיוֹן הַזֶּה
  choice: maono haya
  rationale: חִזָּיוֹן ni maono yenye ufunuo wa kinabii. ‘Maono’ ni tafsiri ya moja kwa moja na ya kawaida, bila kuongeza ufafanuzi ndani ya matini.
- source_word: כֵּן
  choice: ndivyo
  rationale: 'כֵּן inarejelea na kuhitimisha vifungu vilivyotangulia: Nathani alisema sawasawa na maneno na maono aliyopokea.'
- source_word: דִּבֶּר
  choice: alivyosema
  rationale: דבר ni kitenzi cha kawaida cha kusema au kunena. ‘Alivyosema’ huunda kwa ufasaha muundo wa Kiswahili ‘ndivyo ... alivyosema.’
- source_word: נָתָן
  choice: Nathani
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: אֶל דָּוִד
  choice: na Daudi
  rationale: Ingawa אֶל kwa msingi huonyesha mwelekeo ‘kwa,’ Kiswahili cha kawaida husema mtu ‘alisema na’ mtu mwingine. Hapa ‘na Daudi’ huonyesha kwamba Daudi ndiye aliyeelekezewa ujumbe, si kwamba kulikuwa lazima na mazungumzo ya pande mbili.
theological_decisions:
- issue: Asili ya ufunuo wa kinabii katika חִזָּיוֹן
  choice: maono
  alternative: ufunuo
  rationale: ‘Maono’ huhifadhi aina ya ufunuo inayotajwa moja kwa moja na neno la Kiebrania, bila kuipunguza kuwa ujumbe wa jumla wala kuipanua kwa maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya Kiebrania yamehifadhiwa; muundo ‘ndivyo ... alivyosema’ unatoa Kiswahili asilia huku ukidumisha uhusiano wa kulinganisha katika sentensi.
