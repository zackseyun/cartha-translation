  verdict: revise
  source_fidelity: The verse’s repeated comparative construction and its comprehensive scope are retained. The addressee should be marked directly as ‘kwa Daudi,’ corresponding to Hebrew אֶל (‘to’), rather than ‘na Daudi,’ which can suggest a reciprocal conversation.
  naturalness: ‘Sawasawa na’ is more idiomatic and suitably formal in Standard East African Swahili than the repeated ‘kwa kadiri ya’ in this context. The concluding ‘ndivyo Nathani alivyosema kwa Daudi’ is clear, natural narrative Swahili.
  terminology: ‘Maono’ is the established Swahili biblical rendering for prophetic vision. The footnote appropriately preserves ‘ufunuo’ as a lexical alternative without replacing the source term in the text.
  issues:
  - severity: medium
    issue: ‘na Daudi’ for אֶל דָּוִד
    rationale: The Hebrew explicitly directs Nathan’s speech to David. In Swahili, ‘alisema na Daudi’ more readily denotes speaking with David; ‘alisema kwa Daudi’ preserves the directionality.
  - severity: low
    issue: ‘Kwa kadiri ya’ is stiff in this repeated comparative formula
    rationale: Though intelligible, ‘sawasawa na’ more naturally conveys correspondence with the words and vision while retaining the Hebrew parallelism.
