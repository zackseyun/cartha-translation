  verdict: revise
  source_fidelity: The prayer/jussive force, divine name, title, sovereignty over Israel, and dynastic ‘house’ are substantially retained. However, ‘litukuzwe’ primarily means ‘be glorified,’ whereas יִגְדַּל asks that the name be/appear great. ‘Ithibitishwe’ can mean ‘be confirmed’; ‘iwe imara’ more directly represents the firmness/establishment of נָכוֹן.
  naturalness: The revised wording uses idiomatic Standard East African Swahili while retaining the elevated prayer register. ‘Watu wakisema’ naturally expresses the Hebrew quotative infinitive in context without materially adding to its sense.
  terminology: ‘Yahweh wa majeshi,’ ‘Mungu juu ya Israeli,’ and literal ‘nyumba’ are appropriate. The note correctly clarifies the dynastic sense of ‘nyumba.’
  issues:
  - severity: medium
    issue: ‘Litukuzwe’ is not the closest rendering of וְיִגְדַּל.
    rationale: It introduces the more specific idea of glorification. ‘Liwe kuu’ preserves the Hebrew expression that God’s name be great/magnified.
  - severity: medium
    issue: ‘Ithibitishwe’ weakens the establishment/firmness sense of יִהְיֶה נָכוֹן.
    rationale: ‘Iwe imara’ directly conveys that David’s house is to stand firm or be securely established.
  - severity: low
    issue: The initial construction is somewhat awkward.
    rationale: ‘Jina lako na liwe kuu’ is a smoother Swahili volitive construction than ‘Jina lako na litukuzwe.’
