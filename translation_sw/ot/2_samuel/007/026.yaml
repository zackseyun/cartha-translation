base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/026.yaml
  text: And may your name be magnified forever[a], saying[b], ‘Yahweh of hosts is God over Israel,’ and may the house of your servant David be established before you.
translation:
  language: sw
  text: Jina lako na liwe kuu milele[a], watu wakisema, “Yahweh wa majeshi ni Mungu juu ya Israeli.” Na nyumba[b] ya mtumishi wako Daudi iwe imara mbele zako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jina lako na litukuzwe milele.”
    reason: lexical_alternative
  - marker: b
    text: “Nyumba” hapa inamaanisha familia au ukoo wa kifalme wa Daudi, si jengo tu.
    reason: cultural_note
lexical_decisions:
- source_word: וְיִגְדַּל
  choice: na litukuzwe
  rationale: Umbo hili lina nguvu ya ombi au tamanio katika sala. “Litukuzwe” linaonyesha kwamba jina la Mungu linatambuliwa na kuonyeshwa kuwa kuu, bila kudokeza ukuaji wa kimwili.
- source_word: שִׁמְךָ
  choice: jina lako
  rationale: Huhifadhi nahau ya Kiebrania, ambamo “jina” linaweza kujumuisha sifa, utambulisho uliofunuliwa, na umaarufu wa Mungu.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili unaowasilisha kudumu bila mwisho.
- source_word: לֵאמֹר
  choice: watu wakisema
  rationale: Hufanya kiunganishi cha kunukuu kuwa cha asili katika Kiswahili na kuweka wazi kwamba maneno yanayofuata ndiyo yatakayosemwa.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh wa majeshi
  rationale: “Yahweh” huhifadhi jina binafsi la Mungu; “wa majeshi” huwasilisha cheo צְבָאוֹת bila kukifungia kwa majeshi ya kibinadamu pekee.
- source_word: אֱלֹהִים עַל יִשְׂרָאֵל
  choice: ni Mungu juu ya Israeli
  rationale: “Juu ya” hapa huonyesha mamlaka na enzi ya Mungu kwa Israeli.
- source_word: וּבֵית עַבְדְּךָ דָוִד
  choice: nayo nyumba ya mtumishi wako Daudi
  rationale: “Nyumba” huhifadhi neno halisi na mchezo wa maana unaoendelea katika 2 Samweli 7, huku tanbihi ikifafanua maana yake ya ukoo wa kifalme.
- source_word: יִהְיֶה נָכוֹן
  choice: na ithibitishwe
  rationale: Katika muktadha wa sala, usemi huu unawasilisha tamanio la nyumba ya Daudi kuwekwa imara na kudumu.
- source_word: לְפָנֶיךָ
  choice: mbele zako
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi wazo la kuwapo na kusimama kwa kudumu mbele za Mungu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya “nyumba” katika ahadi kwa Daudi
  choice: Kuhifadhi “nyumba” katika andiko kuu na kufafanua maana ya kifalme katika tanbihi
  alternative: ukoo wa kifalme
  rationale: בַּיִת humaanisha “nyumba,” lakini hapa pia humaanisha familia au nasaba ya Daudi. Kuhifadhi “nyumba” kunatunza mchezo wa maneno wa sura hii na tanbihi huzuia kueleweka kama jengo tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa wasomaji wa kawaida. Muundo wa ombi umehifadhiwa kwa “na litukuzwe” na “na ithibitishwe,” na jina Yahweh limetumiwa moja kwa moja.
