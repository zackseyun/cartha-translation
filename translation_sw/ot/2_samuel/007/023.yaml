language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/מִ֤י כְ/עַמְּ/ךָ֙ כְּ/יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁ֣ר הָלְכֽוּ אֱ֠לֹהִים לִ/פְדּֽוֹת ל֨/וֹ לְ/עָ֜ם וְ/לָ/שׂ֧וּם ל֣/וֹ שֵׁ֗ם וְ/לַ/עֲשׂ֨וֹת לָ/כֶ֜ם הַ/גְּדוּלָּ֤ה וְ/נֹֽרָאוֹת֙ לְ/אַרְצֶ֔/ךָ מִ/פְּנֵ֣י עַמְּ/ךָ֗ אֲשֶׁ֨ר פָּדִ֤יתָ לְּ/ךָ֙ מִ/מִּצְרַ֔יִם גּוֹיִ֖ם וֵ/אלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/023.yaml
  text: And who is like your people[a], like Israel, the one nation on the earth whom God went to redeem for himself as a people, to make a name for himself, and to do for you great and fearsome things for your land before your people, whom you redeemed for yourself from Egypt[b], from nations and their gods?
translation:
  language: sw
  text: Na ni nani aliye kama watu wako, kama Israeli—taifa moja pekee duniani—ambalo Mungu alikwenda kulikomboa kwa ajili yake mwenyewe, ili liwe watu wake, kujifanyia jina, na kuwafanyia mambo makuu na ya kutisha[a] kwa ajili ya nchi yako mbele ya watu wako, ambao uliwakomboa kwa ajili yako mwenyewe kutoka Misri[b], kutoka kwa mataifa na miungu yao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo makuu na ya kuogofya.” Neno la Kiebrania linaweza kumaanisha matendo yanayoleta kicho, hofu, au woga.
    reason: lexical_alternative
  - marker: b
    text: Kifungu cha mwisho ni kigumu katika Kiebrania. Pia kinaweza kutafsiriwa, “kutoka Misri, mataifa na mungu wake,” au “kutoka Misri, mataifa na miungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ כְיִשְׂרָאֵל
  choice: Na ni nani aliye kama watu wako, kama Israeli
  rationale: Huhifadhi swali la balagha kuhusu kutolinganishwa kwa Israeli na taifa jingine, pamoja na msisitizo wa marudio ya כְּ.
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: taifa moja pekee duniani
  rationale: Neno 'pekee' linaonyesha nguvu ya upekee katika אֶחָד, huku 'duniani' likitoa Kiswahili cha kawaida cha בָּאָרֶץ katika muktadha huu.
- source_word: אֲשֶׁר הָלְכוּ אֱלֹהִים
  choice: ambalo Mungu alikwenda
  rationale: Ingawa אֱלֹהִים ina umbo la wingi, katika muktadha huu inamtaja Mungu wa Israeli. 'Alikwenda' huhifadhi taswira halisi ya tendo la Mungu.
- source_word: לִפְדּוֹת לוֹ לְעָם
  choice: kulikomboa kwa ajili yake mwenyewe ili liwe watu wake
  rationale: '''Kulikomboa'' huakisi פדה, na kifungu cha kusudi kinaeleza kwa Kiswahili cha kawaida matokeo ya agano yaliyomo katika לְעָם.'
- source_word: וְלָשׂוּם לוֹ שֵׁם
  choice: kujifanyia jina
  rationale: Huhifadhi nahau ya Kiebrania ya kupata sifa au kujulikana kwa matendo makuu bila kuibadili kuwa maelezo ya kifafanuzi.
- source_word: וְלַעֲשׂוֹת לָכֶם
  choice: na kuwafanyia
  rationale: Kiambishi '-wa-' kinahifadhi nafsi ya pili wingi ya לָכֶם, ikielekezwa kwa Israeli kwa ujumla, badala ya kuiondoa au kuirekebisha.
- source_word: הַגְּדוּלָּה וְנֹרָאוֹת
  choice: mambo makuu na ya kutisha
  rationale: Kifungu hiki huonyesha matendo yenye ukuu na yanayoleta hofu au kicho; 'ya kutisha' huhifadhi ukali huo.
- source_word: לְאַרְצְךָ מִפְּנֵי עַמְּךָ
  choice: kwa ajili ya nchi yako mbele ya watu wako
  rationale: Huhifadhi viwakilishi vya umoja vinavyomwelekea Mungu na maana ya mahali ya מִפְּנֵי, bila kusawazisha mabadiliko ya viwakilishi katika Kiebrania.
- source_word: אֲשֶׁר פָּדִיתָ לְּךָ מִמִּצְרַיִם
  choice: ambao uliwakomboa kwa ajili yako mwenyewe kutoka Misri
  rationale: Marudio ya פדה yametafsiriwa sawasawa kwa 'komboa,' na לְּךָ imehifadhiwa kwa 'kwa ajili yako mwenyewe.'
- source_word: גּוֹיִם וֵאלֹהָיו
  choice: kutoka kwa mataifa na miungu yao
  rationale: Hili ndilo somo linaloeleweka vizuri zaidi katika muktadha wa mataifa na miungu yao kuondolewa mbele ya Israeli, huku ugumu wa kisarufi wa mwisho wa Kiebrania ukielezwa katika tanbihi.
theological_decisions:
- issue: Idadi na rejeleo la אֱלֹהִים
  choice: Mungu, katika umoja, akimaanisha Mungu wa Israeli
  alternative: miungu, katika wingi
  rationale: Muktadha mzima unazungumzia tendo la pekee la Mungu wa Israeli la kuwakomboa watu wake; kutafsiri kwa wingi kungepotosha maana ya kifungu.
- issue: Kifungu kigumu cha mwisho גּוֹיִם וֵאלֹהָיו
  choice: kutoka kwa mataifa na miungu yao
  alternative: kutoka Misri, mataifa na mungu wake; au kutoka Misri, mataifa na miungu
  rationale: Kiebrania cha mwisho kimebanwa na kinaweza kugawanywa kwa njia zaidi ya moja. Tafsiri kuu inafuata muktadha mpana, lakini tanbihi huhifadhi uwezekano mwingine bila kuficha ugumu.
- issue: Mabadiliko ya viwakilishi katika לָכֶם ... לְאַרְצְךָ ... עַמְּךָ
  choice: kuhifadhi wingi katika 'kuwafanyia' na umoja katika 'nchi yako' na 'watu wako'
  alternative: kusawazisha viwakilishi vyote viwe vya umoja au wingi
  rationale: Andiko la Kimasoreti linabadilisha kutoka nafsi ya pili wingi kwenda umoja. Tafsiri haiufuti mvutano huo wa kisarufi na kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ndefu ya maombi imehifadhiwa, lakini vistari virefu vinatenga kirai cha maelezo ili kusaidia usomaji. Viwakilishi vya umoja na wingi vimeachwa tofauti kwa makusudi ili kuakisi Andiko la Kimasoreti.
