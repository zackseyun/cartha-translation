base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/006.yaml
  text: For I have not dwelt in a house from the day I brought up the sons of Israel out of Egypt to this day[b][a], but I have been moving about in a tent and in a tabernacle.
translation:
  language: sw
  text: Kwa maana, tangu siku nilipowatoa wana wa Israeli[a] kutoka Misri mpaka leo hii, sijakaa katika nyumba; bali nimekuwa nikitembea huku na huku katika hema na katika maskani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watoto wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: “Maskani” inaweza pia kutafsiriwa “mahali pa kukaa” au “tabernakulo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: sijakaa
  rationale: Kitenzi ישב kinaweza kumaanisha kukaa au kuishi. Katika muktadha wa makao, “sijakaa katika nyumba” ni Kiswahili cha kawaida na kinadumisha picha ya kutokuwa na makao ya kudumu.
- source_word: בְּבַיִת
  choice: katika nyumba
  rationale: Nomino haina uainisho hapa; “nyumba” huhifadhi maana ya msingi bila kuitafsiri moja kwa moja kuwa “hekalu.”
- source_word: לְמִיּוֹם הַעֲלֹתִי
  choice: tangu siku nilipowatoa
  rationale: Kirai kinaonyesha mwanzo wa kipindi. Hiphil ya עלה katika usemi wa Kutoka Misri ni ‘kuwatoa/kuwapandisha’; “nilipowatoa” ni ya asili katika Kiswahili na inaweka wazi kitendo cha Mungu bila kuongeza tafsiri ya kijiografia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu muundo wa Kiebrania ‘wana wa Israeli’; tanbihi inatoa mbadala wa kawaida zaidi, ‘Waisraeli.’
- source_word: מִמִּצְרַיִם
  choice: kutoka Misri
  rationale: Hutoa kwa usahihi mahali walikotolewa na huendana kiasili na kitenzi cha Kiswahili “kuwatoa.”
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: mpaka leo hii
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi kikomo cha wakati kinachoendelea hadi wakati wa kauli.
- source_word: וָאֶהְיֶה מִתְהַלֵּךְ
  choice: bali nimekuwa nikitembea huku na huku
  rationale: “Bali” huonyesha tofauti na kukaa katika nyumba, na muundo “nimekuwa nikitembea huku na huku” huwasilisha mwendo unaoendelea wa participle ya Kiebrania.
- source_word: בְּאֹהֶל
  choice: katika hema
  rationale: “Hema” ndiyo maana ya msingi ya אֹהֶל na hudumisha picha ya makao yanayohamishika.
- source_word: וּבְמִשְׁכָּן
  choice: na katika maskani
  rationale: “Maskani” huhifadhi maana ya משכן kama mahali pa kukaa na pia ni istilahi inayofaa kwa patakatifu panapohamishika, bila kufuta jozi ya ‘hema’ na ‘maskani.’
theological_decisions:
- issue: Uwasilishaji wa בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Chaguo kuu linafuata kwa karibu umbo la Kiebrania, huku tanbihi ikitambua kwamba katika muktadha huu kirai kinarejelea taifa lote la Israeli.
- issue: Istilahi ya ibada kwa מִשְׁכָּן
  choice: maskani
  alternative: hema la kukutania; mahali pa kukaa
  rationale: “Maskani” hudumisha maana ya mahali pa kukaa na muktadha wa patakatifu panapohamishika. Haibadili neno hilo kuwa hekalu la kudumu.
- issue: Uhusiano wa בְּאֹהֶל וּבְמִשְׁכָּן
  choice: katika hema na katika maskani
  alternative: katika hema lililokuwa maskani
  rationale: Nakala ya Kiebrania ina viunganishi viwili vinavyoweza kusomwa kama jozi ya majina au maelezo yanayokaribiana. Tafsiri kuu huhifadhi jozi hiyo badala ya kuamua kwamba neno la pili lazima lifafanue la kwanza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa karibu na Kiebrania lakini unasomeka kwa kawaida; “nyumba” haijabadilishwa kuwa “hekalu,” na utata wa uhusiano kati ya “hema” na “maskani” umehifadhiwa kwa tanbihi.
