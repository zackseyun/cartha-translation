source:
  edition: WLC
  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל בְּנֵ֣י יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר צִוִּ֗יתִי לִ/רְע֛וֹת אֶת עַמִּ֥/י אֶת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לָ֛/מָּה לֹֽא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/007.yaml
  text: In all the places where I have walked among all the sons of Israel[a], did I ever speak a word to one of the tribes of Israel, whom I commanded to shepherd my people Israel, saying, ‘Why have you not built me a house of cedar?’
translation:
  language: sw
  text: Katika sehemu zote nilikotembea miongoni mwa wana wote wa Israeli, je, niliwahi kusema neno lolote kwa kabila mojawapo la Israeli[a], ambalo nililiamuru lichunge watu wangu, Israeli, nikisema, ‘Kwa nini hamkunijengea nyumba ya mierezi?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “kabila mojawapo la Israeli”; kifungu sambamba katika 1 Mambo ya Nyakati 17:6 kinasema “waamuzi wa Israeli,” huenda kikirejelea viongozi waliopewa jukumu la kuwachunga watu.
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: nilipotembea
  rationale: Inahifadhi sitiari halisi ya Mungu kutembea kati ya watu wake na kuonyesha uwepo wake unaohama, badala ya makao ya kudumu.
- source_word: בְּכֹל אֲשֶׁר ... בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: Katika kila mahali ... miongoni mwa wana wote wa Israeli
  rationale: “Kila mahali” linaendana na picha ya kutembea, huku “miongoni mwa” likionyesha uwepo wa Mungu kati ya watu wake.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Ni tafsiri ya karibu ya jina la kitaifa la Kiebrania, huku ikibaki wazi na yenye hadhi katika Kiswahili cha kibiblia.
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: je, niliwahi kusema neno lolote
  rationale: Muundo huu unaonyesha swali la balagha lenye maana ya kukana na kuhifadhi mkazo wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: אַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: kabila mojawapo la Israeli
  rationale: Maandishi ya Kimasora katika 2 Samweli yanasema “makabila”; maana hiyo imehifadhiwa katika matini kuu badala ya kubadilishwa kwa kufuata kifungu sambamba.
- source_word: אֲשֶׁר צִוִּיתִי לִרְעוֹת
  choice: nililoliamuru kulichunga
  rationale: Kitenzi “kuchunga” kinahifadhi sitiari ya kichungaji ya kuwatunza na kuwaongoza watu, bila kuibadili kuwa “kutawala.”
- source_word: עַמִּי אֶת יִשְׂרָאֵל
  choice: taifa langu Israeli
  rationale: “Taifa langu Israeli” linaonyesha uhusiano wa agano na utambulisho wa watu hao kwa Kiswahili cha asili; “watu wangu Israeli” lingeweza pia kutumika lakini si laini sawa hapa.
- source_word: לֵאמֹר
  choice: nikisema
  rationale: Inaunganisha kwa kawaida kitenzi cha kusema na swali lililonukuliwa.
- source_word: לָמָּה לֹא בְנִיתֶם לִי בֵּית אֲרָזִים
  choice: Kwa nini hamkunijengea nyumba ya mierezi?
  rationale: Wingi wa “hamkunijengea” unaakisi kitenzi cha wingi cha Kiebrania, na “nyumba ya mierezi” inaonyesha nyumba iliyojengwa kwa mbao za mierezi.
theological_decisions:
- issue: Jina la kitaifa lenye umbo la kiume
  choice: wana wa Israeli
  alternative: Waisraeli / watu wa Israeli
  rationale: Kiebrania kina maana halisi ya “wana wa Israeli” na hapa ni jina la kawaida la taifa la agano; umbo hilo limehifadhiwa bila kulipanua wala kulifanya liwe na maana ya kimadhehebu.
- issue: Mvutano wa kimaandishi kati ya “makabila” na viongozi
  choice: kabila mojawapo la Israeli
  alternative: mwamuzi/mmoja wa viongozi wa Israeli
  rationale: Maandishi ya Kimasora ya 2 Samweli 7:7 yanasema “makabila,” lakini 1 Mambo ya Nyakati 17:6 inasema “waamuzi.” Matini kuu inafuata chanzo cha 2 Samweli, na tofauti hiyo inawekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ya kichungaji imehifadhiwa, na swali la balagha limetolewa kwa mtiririko wa kawaida. Alama ya tanbihi imewekwa baada ya “Israeli” mahali ambapo mvutano wa kifungu unaanza kujitokeza, ingawa tanbihi yenyewe inaeleza tofauti kuhusu “kabila” katika sehemu inayofuata.
