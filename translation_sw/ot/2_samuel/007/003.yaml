  text: וַ/יֹּ֤אמֶר נָתָן֙ אֶל הַ/מֶּ֔לֶךְ כֹּ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ לֵ֣ךְ עֲשֵׂ֑ה כִּ֥י יְהוָ֖ה עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/003.yaml
  text: And Nathan said to the king[a], “Go, do all that is in your heart, for Yahweh is with you.”
translation:
  language: sw
  text: Nathani akamwambia mfalme, “Nenda, ufanye yote yaliyo moyoni mwako,[a] kwa maana Yahwe yu pamoja nawe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “yote yaliyo katika moyo wako.” Katika Kiebrania, “moyo” unaweza kumaanisha nia, fikira au azimio la mtu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa usimulizi wa Kiebrania unaendeleza tukio. “Akamwambia” ni namna ya kawaida ya Kiswahili ya kuonyesha mfuatano huo na pia kueleza kwamba maneno yanaelekezwa kwa mfalme.
- source_word: נָתָן
  choice: Nathani
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili cha Biblia.
- source_word: אֶל הַמֶּלֶךְ
  choice: mfalme
  rationale: Kiebrania kinatumia nomino yenye kibainishi, si jina la Daudi; kwa hiyo tafsiri haitaji jina ambalo halipo katika mstari huu.
- source_word: לֵךְ עֲשֵׂה
  choice: Nenda, ufanye
  rationale: Amri hizi mbili zinatoa ruhusa na himizo la kutekeleza kusudi hilo. Muundo huu ni wazi katika Kiswahili bila kuongeza maelezo yasiyomo.
- source_word: כֹּל אֲשֶׁר בִּלְבָבְךָ
  choice: yote yaliyo moyoni mwako
  rationale: “Moyo” hapa unaweza kuhusisha nia, fikira na azimio, si hisia peke yake. Kauli hii huhifadhi sitiari ya Kiebrania na inaeleweka katika Kiswahili.
- source_word: כִּי
  choice: kwa maana
  rationale: Neno hili linatanguliza sababu ya ushauri wa Nathani.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: עִמָּךְ
  choice: yu pamoja nawe
  rationale: Tafsiri hii huhifadhi maana ya uwepo na uandamani bila kufafanua zaidi iwapo inamaanisha kuunga mkono kila kusudi lililotajwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la agano la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya “Yahwe yu pamoja nawe” katika ushauri wa Nathani
  choice: yu pamoja nawe
  alternative: Yahwe anakuunga mkono
  rationale: Tafsiri ya moja kwa moja huhifadhi uwezekano wa maana ya uwepo, uandamani au msaada, bila kudai kwamba Mungu tayari ameidhinisha mpango maalumu wa mfalme.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa usimulizi “akamwambia” na kauli “kwa maana” vinafaa katika simulizi ya Maandiko bila kuwa vya kizamani kupita kiasi.
