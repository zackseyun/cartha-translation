  text: And what more can David say to you? You know your servant[a], Lord GOD.
translation:
  language: sw
  text: Na Daudi anaweza kusema nini zaidi kwako? Wewe unamjua mtumishi wako, Bwana Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Bwana YHWH” (אֲדֹנָי יְהוִה); YHWH limetafsiriwa “Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמַה יוֹסִיף דָּוִד עוֹד לְדַבֵּר אֵלֶיךָ
  choice: Na Daudi anaweza kusema nini zaidi kwako?
  rationale: Muundo wa Kiebrania, kihalisi ‘Daudi ataongeza nini tena kusema kwako?’, ni swali la balagha. ‘Anaweza kusema nini zaidi’ ni Kiswahili cha kawaida kinachohifadhi maana na mwendelezo unaoonyeshwa na וּ.
- source_word: וְאַתָּה יָדַעְתָּ
  choice: Wewe unamjua
  rationale: Kiwakilishi ‘Wewe’ kinahifadhi msisitizo wa אַתָּה; kitenzi timilifu cha Kiebrania hapa kinaeleza hali ya sasa ya kumjua.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika sala ya Daudi, neno hili ni namna ya unyenyekevu ya kujitaja mbele za Mungu; ‘mtumishi’ linafaa zaidi katika muktadha huu kuliko ‘mtumwa’.
- source_word: אֲדֹנָי יְהוִה
  choice: Bwana YAHWEH
  rationale: ‘Bwana’ linatafsiri אֲדֹנָי, huku YAHWEH likihifadhi jina la agano יהוה na kuzuia mkanganyiko wa ‘Bwana Bwana’.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu katika אֲדֹנָי יְהוִה
  choice: Bwana YAHWEH
  alternative: Bwana MUNGU; Bwana Mwenyezi-Mungu
  rationale: Chanzo kina cheo אֲדֹנָי pamoja na jina la Mungu יהוה. Kutumia ‘Bwana YAHWEH’ kunatofautisha cheo na jina, bila kulibadilisha jina hilo kuwa cheo kingine.
- issue: Maana ya Mungu ‘kumjua’ mtumishi wake
  choice: Wewe unamjua mtumishi wako
  alternative: Wewe unamfahamu kabisa mtumishi wako
  rationale: Tafsiri haiongezi ‘kabisa’, kwa kuwa kiwango au namna ya kujua haijaelezwa wazi katika mstari; hivyo inahifadhi upana wa יָדַעְתָּ.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya sala lakini kinachoeleweka kwa wasomaji wa kawaida. Swali la balagha limetolewa kwa mpangilio wa asili wa Kiswahili; kiwakilishi ‘Wewe’ kimedumishwa kwa msisitizo.
