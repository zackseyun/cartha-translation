base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/005.yaml
  text: 'Go and say to my servant David[a], ‘Thus says Yahweh: Would you build a house for me to dwell in?’'
translation:
  language: sw
  text: 'Nenda ukamwambie mtumishi wangu Daudi, ‘Yahwe asema hivi: Je, wewe utanijengea nyumba ili nikae humo?’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, ni wewe utakayenijengea nyumba ili nikae humo?” Swali la Kiebrania linakitilia mkazo kiwakilishi “wewe” na lina nguvu ya swali la balagha.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ וְאָמַרְתָּ
  choice: Nenda ukamwambie
  rationale: Muundo huu wa Kiswahili unaunganisha amri ya kwenda na amri inayofuata ya kumwambia Daudi, huku ukihifadhi mfuatano wa Kiebrania kwa lugha ya kawaida.
- source_word: עַבְדִּי
  choice: mtumishi wangu
  rationale: Katika muktadha wa kifalme na wa agano, neno hili ni cheo cha heshima na uhusiano wa huduma; “mtumishi” linafaa kuliko neno linalosisitiza utumwa.
- source_word: דָּוִד
  choice: Daudi
  rationale: Hili ni umbo la kawaida la jina hili katika Kiswahili.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahwe asema hivi
  rationale: Linahifadhi kauli rasmi ya mjumbe wa kinabii na kulitaja jina la Mungu lililo katika matini ya Kiebrania.
- source_word: הַאַתָּה תִּבְנֶה לִּי
  choice: Je, wewe utanijengea
  rationale: “Je” huonyesha swali, na kiwakilishi huru “wewe” huhifadhi mkazo wa הַאַתָּה bila kuamua kimyakimya nguvu ya swali la balagha.
- source_word: בַיִת
  choice: nyumba
  rationale: Ingawa inamaanisha jengo la ibada katika muktadha huu, “nyumba” huhifadhi neno la Kiebrania na mchezo wake muhimu wa maana na “nyumba” ya Daudi katika sura hii.
- source_word: לְשִׁבְתִּי
  choice: ili nikae humo
  rationale: Huu ni usemi wa kusudi unaowasilisha maana pana ya kukaa au kufanya makao, bila kuibadili mapema kuwa istilahi maalumu ya hekalu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ina jina la agano יהוה, kwa hiyo limetoholewa kama jina binafsi badala ya kubadilishwa na cheo.
- issue: Ikiwa בית itafsiriwe “nyumba” au “hekalu”
  choice: nyumba
  alternative: hekalu
  rationale: “Nyumba” huhifadhi upana wa neno la asili na mchezo wa maana wa kifungu, ambamo nyumba ya Mungu inalinganishwa na nyumba ya Daudi.
- issue: Nguvu ya swali הַאַתָּה תִּבְנֶה
  choice: Je, wewe utanijengea…?
  alternative: Je, ni wewe utakayenijengea…?
  rationale: Matini ina swali lenye kiwakilishi kilichosisitizwa. Tafsiri kuu huhifadhi mkazo na pia huacha wazi kiwango kamili cha nguvu yake ya balagha; mbadala ulio katika tanbihi unafanya maana ya “ni wewe” kuwa dhahiri zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. “Yahwe asema hivi” inadumisha uzito wa kauli ya kinabii, na “nyumba” inalinda uhusiano wa kifasihi wa sura nzima.
