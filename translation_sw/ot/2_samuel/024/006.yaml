  source_fidelity: 'Tafsiri inafuata kwa uaminifu ratiba ya mwendo katika Kiebrania: Gileadi, nchi ya Tahtim-Hodshi, Dani-Yaani, kisha mzunguko kuelekea Sidoni. Majina yenye utata yamehifadhiwa kwa unukuzi, na tanbihi zinaonyesha kutokuwa na uhakika bila kuingiza tafsiri ya kukisia katika matini kuu.'
  naturalness: Usemi “Gileadi na katika nchi ya ...” unaunganisha kirai nomino na kirai cha kihusishi kwa namna isiyo sawa kidogo katika Kiswahili. Kuongeza “wakaingia katika” hufanya mfululizo wa safari uwe wa kawaida na wazi, bila kubadili maana ya msingi.
  terminology: Maumbo Gileadi na Sidoni yanaendana na matumizi ya kawaida ya Kiswahili cha Biblia. Tahtim-Hodshi na Dani-Yaani yahifadhiwe kama majina yasiyo na utambulisho wa hakika. “Wahiti” na “Kadeshi” katika tanbihi vinaeleweka na vinaakisi pendekezo la tafsiri mbadala bila kulikubali kama hakika.
