base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/006.yaml
  text: They came to Gilead and to the land of Tahtim-hodshi[a], and they came to Dan-jaan[b], and around to Sidon.
translation:
  language: sw
  text: Wakafika Gileadi, wakaingia katika nchi ya Tahtim-Hodshi[a]. Wakafika Dani-Yaani[b], wakazunguka hadi Sidoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania Tahtim-Hodshi hakieleweki wazi. Wengine hurekebisha au kufasiri maneno hayo kuwa “nchi ya Wahiti huko Kadeshi,” au kwa namna inayofanana, lakini jina lenyewe la mahali halina uhakika.
    reason: alternative_reading
  - marker: b
    text: Huenda Dani-Yaani ni jina la mahali, lakini mahali penyewe palikuwa wapi hapajulikani kwa uhakika.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: wakafika
  rationale: Kitenzi בוא katika mfululizo wa masimulizi kinaonyesha hatua inayofuata ya safari; “wakafika” ni Kiswahili cha kawaida na hudumisha kurudiwa kwake katika Kiebrania.
- source_word: הַגִּלְעָדָה
  choice: Gileadi
  rationale: Herufi ya mwelekeo inaonyesha kwenda kuelekea eneo la Gileadi; kwa Kiswahili mwelekeo unaeleweka kutokana na kitenzi “wakafika.”
- source_word: אֶרֶץ
  choice: nchi ya
  rationale: Hapa אֶרֶץ ni eneo la kijiografia, hivyo “nchi ya” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: תַּחְתִּים חָדְשִׁי
  choice: Tahtim-Hodshi
  rationale: Usemi huu hauko wazi kimaandishi na kijiografia. Kuandika jina kwa herufi za Kiswahili huepuka kuingiza marekebisho ya kukisia katika matini kuu.
- source_word: דָּנָה יַּעַן
  choice: Dani-Yaani
  rationale: Usemi huu umechukuliwa kuwa jina la mahali lenye kiishio cha mwelekeo; umbo la Kiswahili linaakisi konsonanti za Kiebrania huku mwelekeo ukibebwa na “wakafika.”
- source_word: וְסָבִיב
  choice: wakazunguka
  rationale: סָבִיב inaonyesha mwendo wa kuzunguka au kupitia maeneo yanayozunguka. Kitenzi hiki ni cha asili katika Kiswahili na kinaendeleza taarifa ya safari.
- source_word: אֶל צִידוֹן
  choice: hadi Sidoni
  rationale: Kihusishi אֶל kinaonyesha mwelekeo au mwisho wa mwendo; “hadi Sidoni” kinafaa baada ya “wakazunguka” bila kudai kwa lazima kwamba waliingia mjini.
