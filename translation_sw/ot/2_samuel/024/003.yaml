base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/003.yaml
  text: But Joab said to the king[a], “May Yahweh your God add to the people a hundred times as many as they are, and may the eyes of my lord the king see it. But why does my lord the king delight in this thing?”
translation:
  language: sw
  text: Lakini Yoabu akamwambia mfalme, “Yahweh, Mungu wako, awaongeze watu mara mia ya idadi yao ya sasa, na macho ya bwana wangu mfalme na yaone hayo. Lakini kwa nini bwana wangu mfalme anapendezwa na jambo hili?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi, lakini katika muktadha jibu la Yoabu linapinga agizo la mfalme; hivyo ‘Lakini’ huonyesha uhusiano huo wa kimawazo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu YHWH limetafsiriwa kwa unukuzi ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: וְיוֹסֵף
  choice: na awaongeze
  rationale: 'Umbo hili lina maana ya ombi au heri: Yoabu anatamani Yahweh awaongeze watu.'
- source_word: אֶל הָעָם
  choice: watu
  rationale: עָם humaanisha watu; katika muktadha wa sensa linaweza kujumuisha watu wanaohesabiwa kwa ajili ya jeshi, lakini tafsiri pana imehifadhiwa.
- source_word: כָּהֵם וְכָהֵם מֵאָה פְעָמִים
  choice: mara mia zaidi ya walivyo sasa
  rationale: Kirai cha Kiebrania ni nahau ya kuzidisha idadi iliyopo. ‘Walivyo sasa’ huweka wazi kipimo cha idadi bila kuifasiri kuwa jeshi pekee.
- source_word: וְעֵינֵי אֲדֹנִי הַמֶּלֶךְ רֹאוֹת
  choice: na macho ya bwana wangu mfalme na yaone hayo
  rationale: Tafsiri inadumisha picha ya macho kuona na maana ya tamanio kwamba mfalme ashuhudie ongezeko hilo; ‘hayo’ ni kiwakilishi kilichowekwa wazi kwa ufasaha wa Kiswahili.
- source_word: חָפֵץ בַּדָּבָר הַזֶּה
  choice: anapendezwa na jambo hili
  rationale: חָפֵץ huonyesha kupendezwa, kutamani, au kuona jambo kuwa jema; ‘anapendezwa’ huhifadhi swali la Yoabu bila kuongeza hukumu isiyotajwa.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko linatumia jina binafsi la Mungu, YHWH. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kuona kwa macho ya mfalme
  choice: na macho ya bwana wangu mfalme na yaone hayo
  alternative: mfalme aishi mpaka ashuhudie ongezeko hilo
  rationale: Tafsiri iliyochaguliwa huhifadhi sitiari ya Kiebrania na tamanio la Yoabu bila kufafanua moja kwa moja kwamba kuona huko kunamaanisha kuendelea kuishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifalme lakini kinachoeleweka kwa msomaji wa kawaida. Mfumo ‘bwana wangu mfalme’ umehifadhiwa kama namna ya heshima ya ikulu; subjunktivu ‘na awaongeze ... na yaone’ huwasilisha ombi au tamanio.
