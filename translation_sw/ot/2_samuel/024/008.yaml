  text: They traveled throughout all the land, and at the end of nine months and twenty days they came to Jerusalem.
translation:
  language: sw
  text: Wakasafiri katika nchi yote, na baada ya miezi tisa na siku ishirini wakafika Yerusalemu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁטוּ
  choice: Wakasafiri
  rationale: Kitenzi שׁוּט hapa kinaonyesha kuzunguka eneo katika safari ya kuhesabu watu. “Wakasafiri” ni Kiswahili cha kawaida kinachoeleza mwendo huo bila kudokeza kutangatanga bila kusudi.
- source_word: בְּכָל הָאָרֶץ
  choice: katika nchi yote
  rationale: Muundo huu unaonyesha kuwa walipitia eneo lote lililohusika. “Nchi” inafaa zaidi kuliko “dunia” katika muktadha huu wa eneo la ufalme.
- source_word: וַיָּבֹאוּ
  choice: wakafika
  rationale: בוא inaweza kumaanisha kuja au kufika. Kwa kuwa Yerusalemu ni mwisho wa safari, “wakafika” ni ya asili na wazi katika Kiswahili.
- source_word: מִקְצֵה
  choice: baada ya
  rationale: Katika usemi huu wa muda, מִקְצֵה inaonyesha kukamilika kwa kipindi. “Baada ya” ni usemi wa kawaida wa Kiswahili unaowasilisha maana hiyo kwa uwazi.
- source_word: תִשְׁעָה חֳדָשִׁים וְעֶשְׂרִים יוֹם
  choice: miezi tisa na siku ishirini
  rationale: Huu ni usemi wa moja kwa moja wa muda, umetolewa kwa mpangilio wa asili katika Kiswahili.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali hapa katika Kiswahili cha Biblia.
