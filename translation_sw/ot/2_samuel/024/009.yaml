base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/009.yaml
  text: 'Joab gave the number of the census of the people to the king: Israel was eight hundred thousand valiant men who drew the sword[a], and the men of Judah were five hundred thousand men.'
translation:
  language: sw
  text: 'Yoabu akampa mfalme idadi ya watu waliohesabiwa: Israeli ilikuwa na mashujaa laki nane waliokuwa wakichomoa upanga[a], nao watu wa Yuda walikuwa laki tano.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kifungu sambamba katika 1 Mambo ya Nyakati 21:5 kinatoa idadi tofauti: 1,100,000 kwa Israeli na 470,000 kwa Yuda. Tafsiri hapa inafuata maandishi ya Kiebrania ya 2 Samweli bila kusawazisha idadi hizo.'
    reason: cross_reference
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: idadi ya watu waliohesabiwa
  rationale: Muundo huu unawakilisha kwa Kiswahili cha kawaida jumla iliyopatikana katika sensa au kuhesabiwa kwa watu, bila kutumia usemi mzito usio wa kawaida.
- source_word: וַתְּהִי יִשְׂרָאֵל
  choice: Israeli ilikuwa na
  rationale: Katika muktadha huu kitenzi kinatanguliza jumla ya watu waliopatikana Israeli; ‘ilikuwa na’ ni ya asili zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno.
- source_word: שְׁמֹנֶה מֵאוֹת אֶלֶף
  choice: laki nane
  rationale: Hii ndiyo namna ya kawaida na sahihi ya kusema 800,000 katika Kiswahili.
- source_word: אִישׁ חַיִל
  choice: mashujaa
  rationale: Neno חַיִל lina wazo la nguvu, uwezo, na ushujaa; katika sensa hii ya kijeshi linawaeleza wanaume wenye uwezo wa kupigana.
- source_word: שֹׁלֵף חֶרֶב
  choice: wenye uwezo wa kutumia upanga
  rationale: Kirai halisi ni ‘wanaochomoa upanga,’ lakini hapa ni nahau ya watu walio tayari au wanaofaa kwenda vitani. Tafsiri hii huhifadhi picha ya upanga na kuonyesha maana yake ya kijeshi bila kudai kuwa walikuwa wakichomoa upanga wakati huo.
- source_word: וְאִישׁ יְהוּדָה
  choice: nao watu wa Yuda
  rationale: אִישׁ imetumiwa kwa maana ya kundi. ‘Watu wa Yuda’ ni usemi wa asili unaohifadhi maana hiyo ya kijumla bila kuongeza kwamba wote walikuwa mashujaa, jambo ambalo halisemwi wazi katika sehemu hii.
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף אִישׁ
  choice: laki tano
  rationale: ‘Watu wa Yuda’ tayari hutaja watu wanaohesabiwa, hivyo ‘laki tano’ hutoa jumla ya 500,000 kwa Kiswahili fasaha bila urudiaji mzito.
theological_decisions:
- issue: Tofauti ya idadi ikilinganishwa na 1 Mambo ya Nyakati 21:5
  choice: 'Kufuata maandishi ya Kiebrania ya 2 Samweli: Israeli laki nane na Yuda laki tano.'
  alternative: Kusawazisha idadi na 1 Mambo ya Nyakati 21:5, au kueleza tofauti kwa nadharia ya vikosi vilivyojumuishwa au kuachwa.
  rationale: Tafsiri haipaswi kutatua tofauti hii kwa kubadili maandishi wala kuingiza nadharia isiyotajwa. Idadi ya WLC katika 2 Samweli imetafsiriwa kama ilivyo, na tofauti imeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Laki’ limetumiwa kwa kuwa ndilo neno la kawaida la Kiswahili kwa mamia ya maelfu. Muundo umewekwa wazi na wa asili huku picha ya kijeshi ya upanga ikihifadhiwa.
