base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/001.yaml
  text: Again the anger of Yahweh burned against Israel[a], and he incited David against them, saying, “Go[b], count Israel and Judah.”
translation:
  language: sw
  text: Hasira ya Yahwe ikawaka tena dhidi ya Israeli[a], naye akamchochea Daudi dhidi yao, akisema, “Nenda, ukawahesabu Israeli na Yuda[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 Mambo ya Nyakati 21:1 inasema kwamba Shetani alisimama dhidi ya Israeli na akamchochea Daudi. Maandishi makuu hapa yanafuata mhusika aliye wazi katika Kiebrania cha 2 Samweli na yanahifadhi mvutano kati ya simulizi hizo badala ya kuzioanisha.
    reason: cross_reference
  - marker: b
    text: Au, “fanya sensa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: tena
  rationale: Katika muundo huu kitenzi kinaonyesha kwamba tendo lilitokea upya. ‘Tena’ ni Kiswahili cha kawaida kinacholeta maana hiyo kwa ufupi.
- source_word: אַף יְהוָה לַחֲרוֹת
  choice: Hasira ya Yahwe ikawaka
  rationale: אַף ni ‘hasira’ katika nahau hii, na חרה huhifadhi picha ya hasira kuwaka. ‘Ikawaka’ ni ya asili na yenye heshima katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo la Kiswahili ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: בְּיִשְׂרָאֵל
  choice: dhidi ya Israeli
  rationale: Kihusishi hapa kinaonyesha kwamba hasira ilielekezwa kwa Israeli; ‘dhidi ya’ huwasilisha uadui huo wazi.
- source_word: וַיָּסֶת
  choice: naye akamchochea
  rationale: Kitenzi סות katika kausativi humaanisha kuchochea, kushawishi, au kusukuma mtu atende. ‘Akamchochea’ huhifadhi nguvu ya kisababishi, na ‘naye’ humrejesha Yahwe kama mhusika wa karibu zaidi.
- source_word: בָּהֶם
  choice: dhidi yao
  rationale: Kirai hiki ni kigumu, lakini katika muktadha kinaeleza Daudi kuchochewa achukue hatua dhidi ya watu hao. Tafsiri hii ni ya asili bila kuficha ugumu wa uhusiano huo.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huu ni utangulizi wa kawaida wa maneno yanayonukuliwa moja kwa moja.
- source_word: לֵךְ
  choice: Nenda
  rationale: Ni amri rahisi ya kitenzi ‘kwenda’.
- source_word: מְנֵה
  choice: ukawahesabu
  rationale: Kitenzi מנה humaanisha kuhesabu au kuweka idadi. Umbo ‘ukawahesabu’ linaunganika kwa kawaida na amri ‘Nenda’ huku maana ya msingi ikihifadhiwa.
- source_word: יִשְׂרָאֵל וְאֶת יְהוּדָה
  choice: Israeli na Yuda
  rationale: Majina hayo mawili yamehifadhiwa bila kuongeza maelezo, kama yalivyo katika Kiebrania.
theological_decisions:
- issue: Utendaji wa Mungu katika kuchochewa kwa Daudi ukilinganishwa na 1 Mambo ya Nyakati 21:1
  choice: naye akamchochea Daudi
  alternative: mtu fulani akamchochea Daudi; au Shetani akamchochea Daudi
  rationale: Mhusika wa asili wa וַיָּסֶת ni Yahwe, aliyetajwa mara moja kabla yake. Tafsiri kuu inafuata sarufi ya wazi ya 2 Samweli na haileti ‘Shetani’ kutoka simulizi sambamba ili kuondoa mvutano wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi huhifadhi picha ya hasira kuwaka, jina Yahwe, na mvutano wa kiwakilishi cha mhusika bila kuingiza ufafanuzi wa kimadhehebu.
