  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֥ה דֶּ֨בֶר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/הַ/בֹּ֖קֶר וְ/עַד עֵ֣ת מוֹעֵ֑ד וַ/יָּ֣מָת מִן הָ/עָ֗ם מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע שִׁבְעִ֥ים אֶ֖לֶף אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/015.yaml
  text: So Yahweh sent a plague on Israel from the morning until the appointed time[a], and seventy thousand men of the people died, from Dan to Beersheba.
translation:
  language: sw
  text: Basi Yahweh akaleta tauni juu ya Israeli tangu asubuhi mpaka wakati uliowekwa[a], na wanaume elfu sabini wakafa, kutoka Dani mpaka Beer-sheba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka wakati maalumu.” Maneno ya Kiebrania yanaweza kumaanisha wakati ulioteuliwa au uliowekwa; maana “mpaka wakati wa kusanyiko” ina uwezekano mdogo zaidi hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akaleta
  rationale: Ingawa kitenzi hiki kihalisi ni ‘alitoa,’ katika muktadha huu ‘akaleta tauni’ ni usemi wa kawaida wa Kiswahili unaohifadhi wazi tendo la Mungu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limeandikwa kama jina binafsi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: דֶּבֶר
  choice: tauni
  rationale: ‘Tauni’ ni neno la kawaida na lenye uzito kwa ugonjwa hatari unaoenea na kuua watu wengi.
- source_word: בְּיִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: Usemi huu unaonyesha msiba uliowapata watu wa Israeli na unafaa katika muktadha wa hukumu.
- source_word: מֵהַבֹּקֶר
  choice: tangu asubuhi
  rationale: Hutoa kwa Kiswahili cha kawaida mwanzo wa kipindi kinachotajwa.
- source_word: וְעַד עֵת מוֹעֵד
  choice: mpaka wakati uliowekwa
  rationale: מוֹעֵד hapa yaelekea kumaanisha wakati maalumu au uliopangwa; tafsiri hii inadumisha kiwango fulani cha kutobainika kwa wakati huo.
- source_word: וַיָּמָת מִן הָעָם
  choice: watu ... wakafa
  rationale: Muundo wa Kiswahili unaeleza kiasili kwamba waliokufa walitoka miongoni mwa watu, bila kuiga kwa ugumu umoja wa kitenzi cha Kiebrania.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: kutoka Dani mpaka Beer-sheba
  rationale: Huhifadhi msemo wa kijiografia unaoonyesha eneo lote la Israeli kutoka kaskazini hadi kusini.
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: watu elfu sabini
  rationale: אִישׁ baada ya idadi hutumiwa kwa maana ya kila mmoja katika kundi; katika Kiswahili, ‘watu elfu sabini’ ni ya asili na haidai kwamba waliokufa walikuwa wanaume watu wazima pekee.
theological_decisions:
- issue: Tendo la Mungu katika hukumu
  choice: Yahweh akaleta tauni juu ya Israeli
  alternative: Yahweh akaruhusu tauni iwafikie Israeli
  rationale: Kiebrania kinamhusisha Yahweh moja kwa moja na tendo hilo; tafsiri haiongezi wazo la kuruhusu ili kulainisha kauli.
- issue: Maana ya עֵת מוֹעֵד
  choice: mpaka wakati uliowekwa
  alternative: mpaka wakati maalumu; mpaka wakati wa kusanyiko
  rationale: Katika muktadha huu, mwisho wa kipindi uliowekwa ndio unaowezekana zaidi, lakini tanbihi inahifadhi tafsiri nyingine ya karibu bila kuondoa utata wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa simulizi la Biblia lakini unaeleweka kwa msomaji wa kawaida; ‘Basi’ linaunganisha aya na yaliyotangulia, na alama ya tanbihi [a] imewekwa baada ya kirai husika.
