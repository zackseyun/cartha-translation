base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/025.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings[a]. So Yahweh responded to the land[c][b], and the plague was restrained from Israel.
translation:
  language: sw
  text: Hapo Daudi akajenga madhabahu kwa ajili ya Yahwe[b], akatoa sadaka za kuteketezwa na sadaka za amani[a]. Yahwe akakubali kusihiwa kwa ajili ya nchi[c], na tauni ikazuiwa isiendelee kuikumba Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka za ushirika.”
    reason: lexical_alternative
  - marker: b
    text: “Yahwe” ni jina la Mungu linalowakilishwa na herufi za Kiebrania YHWH.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “Yahwe akakubali kusihiwa kwa ajili ya nchi”; yaweza pia kutafsiriwa, “Yahwe akaitikia dua kwa ajili ya nchi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן שָׁם דָּוִד
  choice: Hapo Daudi akamjengea
  rationale: “Hapo” hurejelea mahali palipotajwa awali, na “akamjengea” huonyesha kwa kawaida kwamba madhabahu iliwekwa wakfu kwa Yahwe.
- source_word: מִזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida na lililo sahihi kwa mahali pa kutolea dhabihu.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama jina maalumu badala ya kubadilishwa kuwa cheo.
- source_word: וַיַּעַל עֹלוֹת
  choice: akatoa sadaka za kuteketezwa
  rationale: Usemi huu wa kawaida wa Kiswahili unaeleza kitendo cha kutoa dhabihu zinazoteketezwa, bila kufuata kihalisi taswira ya Kiebrania ya ‘kupandisha’.
- source_word: וּשְׁלָמִים
  choice: sadaka za amani
  rationale: Huhifadhi jina la jadi la aina hii ya dhabihu; ‘sadaka za ushirika’ ni tafsiri nyingine inayowezekana.
- source_word: וַיֵּעָתֵר יְהוָה לָאָרֶץ
  choice: Yahwe akaisikia dua kwa ajili ya nchi
  rationale: Niphal ya עתר hudokeza kuitikia kusihiwa au dua. Tafsiri hii ni ya asili kwa Kiswahili na huhifadhi kwamba itikio la Mungu lilihusu nchi, ingawa nomino ‘dua’ haijaandikwa kando katika Kiebrania.
- source_word: וַתֵּעָצַר הַמַּגֵּפָה מֵעַל יִשְׂרָאֵל
  choice: tauni ikakomeshwa katika Israeli
  rationale: Huhifadhi hali ya kutendwa ya kitenzi na kueleza kwa Kiswahili cha kawaida kwamba tauni iliyokuwa ikiikumba Israeli ilisimamishwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina maalumu la Mungu, YHWH. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya וַיֵּעָתֵר יְהוָה לָאָרֶץ
  choice: Yahwe akaisikia dua kwa ajili ya nchi
  alternative: Yahwe akakubali kusihiwa kwa ajili ya nchi; Yahwe akaitikia kwa fadhili kuhusu nchi
  rationale: Kitenzi chenyewe kina maana ya kuitikia kusihiwa, lakini hakimtaji tena mwombaji wala maudhui ya dua. Tafsiri iliyochaguliwa huhifadhi maana hiyo bila kuongeza maelezo ya kitheolojia yasiyosemwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. Maneno ya ibada yaliyozoeleka yametumiwa, huku maelezo ya uwezekano mwingine yakiwekwa katika tanbihi.
