translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa ratiba umewekwa wazi kwa 'katika' na 'mpaka'; jina Negebu limedumishwa huku utata halisi wa נֶגֶב ukielezwa katika tanbihi.
