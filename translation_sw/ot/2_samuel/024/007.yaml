base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/007.yaml
  text: They came to the fortified city of Tyre and to all the cities of the Hivites and the Canaanites[a], and they went out to the Negev of Judah, to Beersheba.
translation:
  language: sw
  text: Walifika katika jiji lenye ngome la Tiro na katika miji yote ya Wahivi na Wakanaani; kisha wakatoka kuelekea Negebu[a] ya Yuda, hadi Beer-sheba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kusini mwa Yuda.” Neno la Kiebrania negeb linaweza kumaanisha eneo maalumu linaloitwa Negebu au, kwa ujumla zaidi, eneo la kusini.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְצַר צֹר
  choice: jiji lenye ngome la Tiro
  rationale: מִבְצַר ni mahali palipoimarishwa kwa ngome; pamoja na צֹר, kifungu hiki kinamtambulisha Tiro kuwa jiji lenye ngome. Tafsiri hii ni ya kawaida na inadumisha maana ya kijeshi na kijiografia.
- source_word: וְכָל עָרֵי הַחִוִּי וְהַכְּנַעֲנִי
  choice: na katika miji yote ya Wahivi na Wakanaani
  rationale: Kitenzi cha mwendo ויבאו kinaendelea kutawala orodha ya mahali walikofika. Majina ya watu yametolewa kwa maumbo ya kawaida ya Kiswahili, Wahivi na Wakanaani.
- source_word: וַיֵּצְאוּ
  choice: kisha wakaelekea
  rationale: יצא kimsingi ni kutoka au kwenda nje; katika ratiba hii linaanzisha hatua inayofuata ya safari. 'Wakaelekea' ni Kiswahili cha asili kinachoonyesha mwendo kuelekea eneo linalofuata bila kudai kwamba walitoka katika jengo fulani.
- source_word: אֶל נֶגֶב יְהוּדָה
  choice: Negebu ya Yuda
  rationale: נֶגֶב inaweza kuwa jina la eneo la Negebu au kumaanisha kusini. Katika ratiba ya kijiografia hapa, jina la eneo limetumiwa katika maandishi, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: בְּאֵר שָׁבַע
  choice: Beer-sheba
  rationale: Hili ni umbo la kawaida la jina la mahali katika Kiswahili cha Biblia na linaonyesha sehemu mbili za jina la Kiebrania.
