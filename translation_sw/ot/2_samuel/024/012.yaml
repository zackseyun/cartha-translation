base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/012.yaml
  text: 'Go and speak to David[a], ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: sw
  text: 'Nenda ukamwambie Daudi, ‘Yahweh asema hivi: Ninaweka mambo matatu[a] mbele yako. Jichagulie mojawapo, nami nitafanya hilo kwako.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema tu “matatu”; nomino inaeleweka kutokana na muktadha. Pia inaweza kutafsiriwa “machaguo matatu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ וְדִבַּרְתָּ
  choice: Nenda ukamwambie
  rationale: Muundo wa Kiebrania unatoa agizo lenye hatua mbili. ‘Nenda ukamwambie’ ni Kiswahili cha kawaida kinachohifadhi nguvu na mfuatano wa agizo.
- source_word: כֹּה אָמַר יְהוָה
  choice: Yahweh asema hivi
  rationale: Huu ni mtindo rasmi wa mjumbe wa kinabii. Mpangilio huu ni wa asili katika Kiswahili na unadumisha hadhi ya tamko.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: שָׁלֹשׁ
  choice: mambo matatu
  rationale: Kiebrania kina namba ‘matatu’ bila nomino iliyotajwa. Kiswahili huhitaji nomino inayoeleweka hapa; ‘mambo’ ni nyongeza ndogo isiyofafanua kupita kiasi.
- source_word: אָנֹכִי נוֹטֵל עָלֶיךָ
  choice: Ninaweka ... mbele yako
  rationale: Katika muktadha wa kuchagua, usemi huu unaeleweka kuwa kuweka uwezekano tatu mbele ya Daudi. Tafsiri hii ni ya asili, huku muktadha unaofuata ukionyesha kuwa ni hukumu zitakazompata.
- source_word: בְּחַר לְךָ אַחַת מֵהֶם
  choice: Jichagulie mojawapo
  rationale: ‘Jichagulie’ huonyesha לְךָ, yaani Daudi mwenyewe anapaswa kufanya uchaguzi, na ‘mojawapo’ huwasilisha kwa ufupi maana ya ‘moja kati yao.’
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: nami nitakufanyia hilo
  rationale: Hii inafuata kwa karibu kitenzi ‘kufanya’ pamoja na kiwakilishi kinachomhusu Daudi. ‘Hilo’ hurejelea jambo atakalochagua bila kuongeza maelezo yasiyomo katika mstari.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina binafsi la Mungu, si cheo. ‘Yahweh’ huhifadhi jina hilo kwa kulitohOA badala ya kulibadilisha kuwa ‘BWANA.’
- issue: Hali ya mambo matatu yanayowekwa mbele ya Daudi
  choice: mambo matatu
  alternative: adhabu tatu; machaguo matatu
  rationale: Mstari huu wenyewe unasema tu ‘matatu.’ ‘Mambo’ huhifadhi kiasi fulani cha kutotajwa wazi, ilhali ‘adhabu’ au ‘machaguo’ ingefafanua zaidi kwa kutegemea muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nenda ukamwambie’ na ‘Jichagulie mojawapo’ ni miundo inayoeleweka kwa urahisi bila kupunguza uzito wa tamko la kinabii.
