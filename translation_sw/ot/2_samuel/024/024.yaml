base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/024.yaml
  text: But the king said to Araunah[a], “No, but I will surely buy it from you for a price[c][b]. I will not offer to Yahweh my God burnt offerings that cost me nothing.” So David bought the threshing floor and the cattle for fifty shekels of silver.
translation:
  language: sw
  text: Lakini mfalme akamwambia Arauna, “Hapana! Hakika nitainunua kutoka kwako kwa bei. Sitamtolea Yahweh Mungu wangu sadaka za kuteketezwa ambazo hazitanigharimu chochote.[a]” Basi Daudi akanunua kiwanja cha kupuria nafaka na ng’ombe[b] kwa shekeli hamsini za fedha.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana nyingine, “sadaka za kuteketezwa bure” au “sadaka za kuteketezwa bila malipo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “maksai.” Neno la Kiebrania linaweza kumaanisha ng’ombe kwa ujumla au, hasa zaidi, ng’ombe wa kazi au wa sadaka.
    reason: lexical_alternative
  - marker: c
    text: Katika 1 Mambo ya Nyakati 21:25, Daudi analipa shekeli mia sita za dhahabu kwa mahali hapo; mstari huu unataja shekeli hamsini za fedha kwa kiwanja cha kupuria nafaka na ng’ombe.
    reason: cross_reference
lexical_decisions:
- source_word: אֲרַוְנָה
  choice: Arauna
  rationale: Jina limeandikwa kwa kufuata umbo lake katika Kiebrania cha mstari huu; “Ornani” ni umbo linalopatikana katika simulizi sambamba la Mambo ya Nyakati.
- source_word: קָנוֹ אֶקְנֶה
  choice: Hakika nitainunua
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichonyambuliwa unasisitiza tendo la kununua. “Hakika” linahifadhi msisitizo huo kwa Kiswahili cha kawaida; kiwakilishi cha kitu kimeongezwa kutokana na muktadha.
- source_word: בִּמְחִיר
  choice: kwa bei
  rationale: Neno linamaanisha bei au malipo ya ununuzi. Tafsiri hii ni fupi, ya kawaida, na inadumisha wazo la kulipa.
- source_word: לַיהוָה אֱלֹהַי
  choice: Yahweh Mungu wangu
  rationale: Jina la agano יהוה limetoholewa kuwa “Yahweh,” na kiambishi cha nafsi ya kwanza katika אֱלֹהַי kimehifadhiwa kwa “Mungu wangu.”
- source_word: עֹלוֹת
  choice: sadaka za kuteketezwa
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa sadaka zilizoteketezwa madhabahuni.
- source_word: חִנָּם
  choice: nilizopata bure
  rationale: Kimsingi neno humaanisha “bure” au “bila malipo.” Katika muktadha, Daudi anakataa kutoa vitu ambavyo yeye hakuvigharimia; “nilizopata bure” huepuka maana potovu ya kwamba utoaji wenyewe ungekuwa wa bure au usiofaa.
- source_word: הַגֹּרֶן
  choice: kiwanja cha kupuria nafaka
  rationale: Tafsiri hii inaeleza wazi eneo la kilimo lililotumiwa kupuria nafaka na inaeleweka kwa wasomaji wa Kiswahili cha sasa.
- source_word: הַבָּקָר
  choice: ng’ombe
  rationale: Nomino hii ya jumla inaweza kumaanisha ng’ombe kwa pamoja, ingawa katika muktadha inaweza kumaanisha hasa maksai waliotumiwa kwa kazi na sadaka.
- source_word: בְּכֶסֶף שְׁקָלִים חֲמִשִּׁים
  choice: kwa shekeli hamsini za fedha
  rationale: Tafsiri hii inahifadhi kiasi, kipimo cha uzito, na aina ya madini yaliyotumiwa kulipa.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya sadaka zinazotolewa חִנָּם
  choice: sadaka za kuteketezwa nilizopata bure
  alternative: sadaka za kuteketezwa bure
  rationale: Neno חִנָּם lina maana ya kitu kisicholipiwa. Ufafanuzi mdogo “nilizopata” unaonyesha kuwa Daudi anakataa kutoa sadaka isiyomgharimu, bila kuongeza dai la kimadhehebu kuhusu kanuni ya sadaka zote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Kiwanja cha kupuria nafaka” ni wazi zaidi kuliko istilahi fupi isiyofahamika kwa urahisi. Msisitizo wa Kiebrania umehifadhiwa kwa “Hakika,” na mpangilio wa simulizi umeachwa kuwa wa moja kwa moja.
