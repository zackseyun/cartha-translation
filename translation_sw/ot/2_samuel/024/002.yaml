  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל יוֹאָ֣ב שַׂר הַ/חַ֣יִל אֲשֶׁר אִתּ֗/וֹ שֽׁוּט נָ֞א בְּ/כָל שִׁבְטֵ֤י יִשְׂרָאֵל֙ מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע וּ/פִקְד֖וּ אֶת הָ/עָ֑ם וְ/יָ֣דַעְתִּ֔י אֵ֖ת מִסְפַּ֥ר הָ/עָֽם־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/002.yaml
  text: So the king said to Joab[a], the commander of the army who was with him, “Go about now through all the tribes of Israel, from Dan to Beer-sheba, and count the people, so that I may know the number of the people.”
translation:
  language: sw
  text: Basi mfalme akamwambia Yoabu, mkuu wa jeshi aliyekuwa pamoja naye, “Zunguka sasa katika makabila yote ya Israeli, kuanzia Dani mpaka Beer-sheba, kisha mkawahesabu[a][b] watu, ili nijue idadi ya watu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkawaandikishe.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwahesabu au kuwaandikisha watu, wakati mwingine katika mazingira ya kijeshi.
    reason: lexical_alternative
  - marker: b
    text: “Mkawahesabu” ni agizo la wingi katika Kiebrania, huenda likimwelekea Yoabu pamoja na maafisa wake; agizo lililotangulia, “Zunguka,” ni la umoja.
    reason: source_grammar
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Basi ... akamwambia
  rationale: Kiunganishi cha masimulizi kinaendeleza tukio; “Basi” na umbo la masimulizi “akamwambia” ni Kiswahili cha kawaida kinachohifadhi mfuatano.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Huhifadhi cheo kilichotumiwa katika Kiebrania badala ya kuweka jina la Daudi kutoka katika muktadha.
- source_word: שַׂר הַחַיִל
  choice: mkuu wa jeshi
  rationale: Ni usemi wa kisasa na wazi kwa kiongozi mkuu wa nguvu za kijeshi.
- source_word: אֲשֶׁר אִתּוֹ
  choice: aliyekuwa pamoja naye
  rationale: Huhifadhi kishazi cha uhusiano kinachomtambulisha Yoabu kuwa pamoja na mfalme.
- source_word: שׁוּט נָא
  choice: Pita sasa
  rationale: “Pita” huonyesha kusafiri katika eneo lote, na “sasa” huakisi נָא kama chembe inayolegeza agizo bila kulifanya ombi la kawaida.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: katika makabila yote ya Israeli
  rationale: Kirai hiki kinaonyesha mwendo katika maeneo ya makabila yote.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: kuanzia Dani mpaka Beer-sheba
  rationale: Huhifadhi usemi unaotaja miisho ya kaskazini na kusini ili kuonyesha nchi yote.
- source_word: וּפִקְדוּ
  choice: kisha mkawahesabu
  rationale: Katika muktadha huu kitenzi kinamaanisha kufanya sensa au kuwaandikisha watu. “Kuwahesabu” ndilo neno wazi zaidi, huku umbo la wingi “mka-” likihifadhi wingi wa kitenzi cha Kiebrania.
- source_word: אֶת הָעָם
  choice: watu
  rationale: עָם ni “watu”; tafsiri haibani maana kuwa askari pekee licha ya mazingira ya kijeshi.
- source_word: וְיָדַעְתִּי
  choice: ili nijue
  rationale: Huonyesha kusudi la agizo kwa Kiswahili cha kawaida.
- source_word: מִסְפַּר הָעָם
  choice: idadi ya watu
  rationale: Huhifadhi kwa uwazi kirai cha Kiebrania na urudiaji wa neno “watu” bila kufasiri zaidi.
theological_decisions:
- issue: Upeo wa הָעָם katika mazingira ya kijeshi na kiutawala
  choice: watu
  alternative: askari / wanaume wa vita
  rationale: Ingawa Yoabu ni mkuu wa jeshi na sensa inaweza kuwa na kusudi la kijeshi, Kiebrania kinatumia עָם, neno pana la “watu,” wala si neno maalumu kwa wapiganaji.
- issue: Kubadilika kutoka agizo la umoja kwenda la wingi
  choice: “Pita” (umoja), kisha “mkawahesabu” (wingi)
  alternative: 'Kulainisha yote yawe umoja: “pita ... ukawahesabu”'
  rationale: Kiebrania chenyewe hubadilika kutoka שׁוּט, agizo la umoja kwa Yoabu, kwenda וּפִקְדוּ, agizo la wingi linaloweza kumjumuisha Yoabu pamoja na maafisa wake. Tafsiri inalihifadhi badiliko hilo badala ya kuliondoa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Majina yametolewa kama “Yoabu,” “Dani,” na “Beer-sheba.” Muundo unahifadhi tofauti ya idadi ya kisarufi kati ya maagizo mawili na pia upana wa neno “watu.”
