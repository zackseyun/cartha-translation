base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/021.yaml
  text: And Araunah said[a], “Why has my lord the king come to his servant?” And David said, “To buy the threshing floor from you, to build an altar to Yahweh, so that the plague may be stopped from being upon the people.”
translation:
  language: sw
  text: Arauna akasema, “Kwa nini bwana wangu, mfalme, amekuja kwa mtumishi wake[a]?” Daudi akasema, “Ili ninunue kwako kiwanja cha kupuria nafaka, nimjengee Yahweh madhabahu, kusudi tauni izuiliwe isiwe juu ya watu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi wako.” Kiebrania kinasema kihalisi “mtumishi wake,” namna rasmi ya Arauna kujitaja kwa unyenyekevu mbele ya mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Kwa nini
  rationale: Ni swali la moja kwa moja kuhusu sababu ya mfalme kuja; hili ndilo tamko la kawaida na la wazi katika Kiswahili cha sasa.
- source_word: בָּא
  choice: amekuja
  rationale: Kauli timilifu inaeleza ujio ambao umetokea karibuni na unaohusiana moja kwa moja na mazungumzo ya sasa.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Inahifadhi heshima ya lugha ya kifalme pamoja na kiwakilishi cha umilikaji na cheo cha mfalme.
- source_word: עַבְדּוֹ
  choice: mtumishi wake
  rationale: Inafuata nafsi ya tatu ya Kiebrania na kuhifadhi namna rasmi ya mtu kujitaja kwa unyenyekevu mbele ya mfalme.
- source_word: לִקְנוֹת מֵעִמְּךָ
  choice: ninunue kwako
  rationale: Inaonyesha wazi ununuzi kutoka kwa Arauna kwa lugha ya kawaida ya Kiswahili.
- source_word: הַגֹּרֶן
  choice: kiwanja cha kupuria nafaka
  rationale: Hueleza mahali maalumu pa kilimo ambapo nafaka ilipuriwa, kwa maneno yanayoeleweka kwa wasomaji wa sasa.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: nimjengee ... madhabahu
  rationale: Inawasilisha kusudi la kujenga madhabahu iliyowekwa kwa ajili ya Yahweh kwa Kiswahili cha asili.
- source_word: וְתֵעָצַר הַמַּגֵּפָה
  choice: kusudi tauni izuiliwe
  rationale: Huhifadhi hali ya kutendwa na maana ya kusudi au matokeo yanayotarajiwa bila kudai kwamba lazima yatokee.
- source_word: מֵעַל הָעָם
  choice: isiwe tena juu ya watu
  rationale: Inahifadhi taswira ya Kiebrania ya tauni kuwa juu ya watu, huku ‘tena’ ikieleza kwa kawaida kuondolewa kwake.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko linatumia jina la agano moja kwa moja; ‘Yahweh’ hulitambulisha kama jina maalumu badala ya kulibadilisha kuwa cheo.
- issue: Kiwango cha uhakika katika kusimamishwa kwa tauni
  choice: kusudi tauni izuiliwe
  alternative: na tauni itazuiliwa
  rationale: Muundo wa Kiebrania katika muktadha huu unaweza kuonyesha kusudi au matokeo yanayotarajiwa; uteuzi huu haubadili matarajio hayo kuwa ahadi ya uhakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Lugha ya heshima ya kifalme imehifadhiwa bila kuwa ya kizamani kupita kiasi; taswira ya tauni kuwa ‘juu ya watu’ imebakizwa kwa sababu ina maana ya mzigo unaoondolewa.
