translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Majina yametolewa kama Aroeri, Gadi, na Yazeri. Utata wa kijiografia na wa kihusishi umehifadhiwa katika matini na tanbihi.
