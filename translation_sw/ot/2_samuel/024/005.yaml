base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/005.yaml
  text: They crossed the Jordan and camped at Aroer[a], on the right side of the city that is in the middle of the valley of Gad[c][b], and toward Jazer.
translation:
  language: sw
  text: Wakavuka Yordani na kupiga kambi huko Aroeri, upande wa kulia[c] wa mji ulio katikati ya bonde[b] la Gadi, kuelekea Yazeri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kwenda Yazeri.” Kihusishi cha Kiebrania kinaweza kuonyesha kuelekea mahali fulani au kwenda mahali hapo.
    reason: lexical_alternative
  - marker: b
    text: Au, “korongo” au “mkondo wa maji wa msimu.” Neno la Kiebrania linaweza kumaanisha bonde, korongo, au njia ya maji ambayo huenda ikawa kavu katika baadhi ya majira.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “upande wa kulia wa mji.” Baadhi ya wafafanuzi huelewa usemi huu wa kijiografia kuwa “kusini mwa mji,” lakini hapa maana ya moja kwa moja ya Kiebrania imehifadhiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: Wakavuka Yordani
  rationale: Kitenzi עבר katika simulizi la safari, kikiwa na Yordani kama yambwa, humaanisha kuvuka mto. Kiswahili kwa kawaida hutumia jina ‘Yordani’ bila kulazimika kuongeza ‘Mto’.
- source_word: וַיַּחֲנוּ בַעֲרוֹעֵר
  choice: wakapiga kambi huko Aroeri
  rationale: חנה humaanisha kusimama na kuweka kambi. ‘Huko’ huonyesha mahali pa kusimama katika safari, na ‘Aroeri’ ni umbo la jina linalosomeka kwa kawaida katika Kiswahili.
- source_word: יְמִין הָעִיר
  choice: upande wa kulia wa mji
  rationale: Tafsiri hii huhifadhi maana ya moja kwa moja ya ימין, ‘kulia/upande wa kulia,’ bila kuibadili kimafafanuzi kuwa ‘kusini.’
- source_word: אֲשֶׁר בְּתוֹךְ הַנַּחַל
  choice: ulio katikati ya bonde
  rationale: Kiwakilishi cha uhusiano kinarejelea mji. נחל inaweza kumaanisha bonde, korongo, au mkondo wa maji wa msimu; ‘bonde’ ni neno la kawaida na lenye kueleweka, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: הַגָּד
  choice: la Gadi
  rationale: Kirai kimetafsiriwa kama uhusiano wa umilikaji au utambulisho wa kijiografia, ‘bonde la Gadi,’ kwa kufuata muundo unaowezekana zaidi katika muktadha.
- source_word: וְאֶל יַעְזֵר
  choice: kuelekea Yazeri
  rationale: אל inaweza kumaanisha ‘kwenda/kufika’ au ‘kuelekea.’ ‘Kuelekea’ huhifadhi mwelekeo bila kudai kwamba walifika Yazeri katika mstari huu.
