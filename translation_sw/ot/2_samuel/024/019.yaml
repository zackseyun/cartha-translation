  text: So David went up according to the word of Gad, just as Yahweh had commanded.
translation:
  language: sw
  text: Basi Daudi akapanda kulingana na neno la Gadi, kama vile Yahwe alivyoamuru.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה kina maana ya kwenda juu au kupanda. “Akapanda” huhifadhi mwelekeo huo kwa Kiswahili cha kawaida na kinachofaa simulizi.
- source_word: דָּוִד
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: כִּדְבַר
  choice: kulingana na neno la
  rationale: Muundo כ + דבר una maana ya “kulingana na neno la.” Kutaja “neno” wazi huakisi Kiebrania na kuonyesha kwamba Daudi alitenda kwa kufuata ujumbe wa kinabii wa Gadi.
- source_word: גָּד
  choice: Gadi
  rationale: Hili ndilo umbo la kawaida la jina la nabii huyu katika Kiswahili.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: “Kama vile” huonyesha kwa kawaida ulinganifu kati ya neno la Gadi na amri ya Yahwe.
- source_word: צִוָּה
  choice: alivyoamuru
  rationale: Kitenzi kina maana ya “kuamuru.” Muundo huu wa Kiswahili unaonyesha kwamba hatua ya Daudi ililingana na amri iliyokuwa imetolewa, bila kuongeza mtendewa ambaye Kiebrania hakumtaji wazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi kwa umbo linalotumika kwa kawaida katika Kiswahili.
- issue: Mlengwa wa amri ya Yahwe
  choice: Hakutajwa wazi
  alternative: Yahwe alimwamuru Gadi au Daudi
  rationale: Kiebrania hakina yambwa wazi baada ya “aliamuru.” Tafsiri haisemi Yahwe alimwamuru nani, hivyo inadumisha utata wa kisarufi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kwa msomaji wa kawaida huku ikihifadhi “akapanda,” “neno la Gadi,” na kutotajwa kwa mlengwa wa amri.
