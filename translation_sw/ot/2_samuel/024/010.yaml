base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/010.yaml
  text: After that[a], David’s heart struck him after he had counted the people. And David said to Yahweh, “I have sinned greatly in what I have done. And now, Yahweh, please take away the guilt of your servant[c][b], for I have acted very foolishly.”
translation:
  language: sw
  text: Baada ya kuwahesabu watu[a], moyo wa Daudi ukamsuta[b]. Daudi akamwambia Yahweh, “Nimetenda dhambi sana katika yale niliyofanya. Sasa, ee Yahweh, tafadhali uondoe hatia[c] ya mtumishi wako, kwa maana nimetenda kipumbavu sana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwatia watu hesabu” au “kufanya sensa ya watu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “moyo wa Daudi ukampiga,” nahau inayomaanisha kwamba dhamiri yake ilimsuta.
    reason: cultural_note
  - marker: c
    text: Au “uovu.” Neno la Kiebrania linaweza kumaanisha uovu, hatia, na nyakati nyingine adhabu inayotokana na dhambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: moyo wa Daudi ukamsuta
  rationale: Inahifadhi taswira ya nahau ya Kiebrania, ‘moyo wa Daudi ukampiga,’ huku ‘ukamsuta’ ikieleza kwa Kiswahili cha kawaida dhamiri iliyomhukumu.
- source_word: אַחֲרֵי כֵן סָפַר אֶת־הָעָם
  choice: Baada ya kuwahesabu watu
  rationale: Muundo huu unaonyesha wazi kwamba moyo wake ulimsuta baada ya tendo la kuwahesabu watu, kulingana na mpangilio wa Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania linatoholewa badala ya kubadilishwa kuwa cheo.
- source_word: חָטָאתִי מְאֹד
  choice: Nimetenda dhambi kubwa
  rationale: Inawasilisha ungamo la dhambi pamoja na msisitizo wa מְאֹד kwa lugha ya kawaida na yenye uzito.
- source_word: הַעֲבֶר נָא
  choice: tafadhali uondoe
  rationale: Hifili ya עבר hapa ni ombi la kuondolewa kwa hatia; tafsiri hii ni wazi na ya asili kwa Kiswahili.
- source_word: עֲוֹן עַבְדְּךָ
  choice: hatia ya mtumishi wako
  rationale: Katika ombi linalofuata ungamo, ‘hatia’ linafaa kwa kile Daudi anachoomba kiondolewe, bila kufuta maana nyingine zinazowezekana za neno hilo.
- source_word: כִּי נִסְכַּלְתִּי מְאֹד
  choice: kwa maana nimetenda kwa upumbavu mwingi
  rationale: Inahifadhi maana ya kutenda kipumbavu na nguvu ya kielezi מְאֹד.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina binafsi la Mungu; ‘Yahweh’ linahifadhi jina hilo badala ya kuweka cheo.
- issue: Maana ya עָוֹן katika ombi la Daudi
  choice: hatia
  alternative: uovu; adhabu
  rationale: Neno linaweza kumaanisha uovu, hatia, au matokeo ya adhabu. Muktadha wa ungamo na ombi la kuondolewa unaunga mkono ‘hatia,’ huku tanbihi ikihifadhi upana wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka. Nahau ya Kiebrania imehifadhiwa kwa taswira ya ‘moyo’ lakini imewasilishwa kwa kitenzi cha kawaida ‘kusuta.’
