  text: וַ/יֹּ֤אמֶר אֲרַ֨וְנָה֙ אֶל דָּוִ֔ד יִקַּ֥ח וְ/יַ֛עַל אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ הַ/טּ֣וֹב ב/עינ/ו רְאֵה֙ הַ/בָּקָ֣ר לָ/עֹלָ֔ה וְ/הַ/מֹּרִגִּ֛ים וּ/כְלֵ֥י הַ/בָּקָ֖ר לָ/עֵצִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/022.yaml
  text: Then Araunah said to David[a], “Let my lord the king take and offer up what is good in his eyes. Look, the oxen are for the burnt offering[b], and the threshing sledges and the implements of the oxen are for the wood.”
translation:
  language: sw
  text: Ndipo Arauna akamwambia Daudi, “Bwana wangu, mfalme, achukue kile anachoona kuwa chema[a] na akitoe kuwa sadaka. Tazama, ng’ombe hawa ni kwa ajili ya sadaka ya kuteketezwa, nayo mabao ya kupuria nafaka na vifaa vya ng’ombe[b] vitumike kama kuni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chochote anachoona kuwa chema.” Nahau ya Kiebrania ni kihalisi, “kilicho chema machoni pake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “zana za ng’ombe.” Neno la Kiebrania lina maana pana na huenda linarejelea kwa ujumla vifaa vya mbao vya ng’ombe vilivyoweza kutumiwa kama kuni.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח
  choice: na achukue
  rationale: Kauli hii ya ruhusa au mwaliko wa heshima inaelezwa kwa hali ya kutakia, ikihifadhi namna Arauna anavyompa mfalme hiari.
- source_word: וְיַעַל
  choice: na akitoe kuwa sadaka
  rationale: Katika muktadha wa ibada, kitenzi עלה humaanisha kutoa sadaka; tafsiri hii pia inaunganisha tendo hilo na sadaka ya kuteketezwa inayotajwa baadaye.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Bwana wangu mfalme
  rationale: Hii ni namna ya heshima ya kumwambia mfalme, na Kiswahili hiki ni cha kawaida na chenye hadhi.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: kile anachoona kuwa chema
  rationale: Inahifadhi kwa kiasi nahau ya Kiebrania na mgeuko wa kumrejelea mfalme kwa nafsi ya tatu, bila kuifanya sentensi kuwa ngumu.
- source_word: רְאֵה
  choice: Tazama
  rationale: Neno hili linavuta fikira za Daudi kwa vitu ambavyo Arauna anamtolea; lina hadhi bila kuwa la kizamani kupita kiasi.
- source_word: הַבָּקָר
  choice: ng’ombe hawa
  rationale: Muktadha wa vifaa vya kupuria unaonyesha ng’ombe waliotumika kuvuta vifaa hivyo; kiashiria “hawa” kinaonyesha vitu vilivyokuwa mbele yao.
- source_word: לָעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: Hili ndilo jina lililozoeleka kwa sadaka inayoteketezwa yote, na linaonyesha matumizi yaliyokusudiwa ya ng’ombe hao.
- source_word: הַמֹּרִגִּים
  choice: mabao ya kupuria nafaka
  rationale: מורג ni kifaa cha kupuria, huenda ubao mzito au sleji yenye meno; “mabao ya kupuria nafaka” ni maelezo mahususi na yanayoeleweka katika Kiswahili.
- source_word: כְלֵי הַבָּקָר
  choice: vifaa vya ng’ombe
  rationale: כְּלִי ni neno pana linaloweza kumaanisha vifaa au vyombo. Tafsiri pana huepuka kukisia kwamba vilikuwa nira pekee.
- source_word: לָעֵצִים
  choice: ni kwa kuni
  rationale: Muktadha unaonyesha kuwa vifaa vya mbao vingetumiwa kama kuni za sadaka; usemi huu ni mfupi na wa kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Kauli ya heshima kwa mfalme na mgeuko wa nafsi ya tatu zimehifadhiwa. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
