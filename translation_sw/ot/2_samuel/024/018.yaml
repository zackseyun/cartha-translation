base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/018.yaml
  text: That day Gad came to David and said to him[c][b][a], “Go up and set up an altar to Yahweh on the threshing floor of Araunah the Jebusite.”
translation:
  language: sw
  text: Siku hiyo Gadi akaja kwa Daudi na kumwambia, “Panda, ukamjengee Yahwe madhabahu katika uwanja wa kupuria wa Arauna, Myebusi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika 1 Mambo ya Nyakati 21:18 jina hili ni Ornani.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaja
  rationale: Kitenzi cha simulizi kutoka בוא kina maana ya ‘kuja’; ‘akaja kwa Daudi’ ni Kiswahili cha kawaida na hudumisha mwelekeo wa tendo.
- source_word: בַּיּוֹם הַהוּא
  choice: Siku hiyo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha wakati ‘siku ile/hiyo.’
- source_word: עֲלֵה
  choice: Panda
  rationale: Amri ya עלה ina nguvu ya kwenda juu; ‘panda’ huhifadhi mwelekeo huo kwa ufupi.
- source_word: הָקֵם ... מִזְבֵּחַ
  choice: ukamjengee ... madhabahu
  rationale: הקים kihalisi ni kusimamisha au kuweka; katika Kiswahili, ‘kujenga madhabahu’ ni usemi wa kawaida zaidi, huku umbo ‘-jengee’ likiwasilisha kusudi la לַיהוָה.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: ל inaweza kuonyesha kwamba madhabahu inawekwa kwa ajili ya au kwa heshima ya Yahwe; muundo ‘ukamjengee Yahwe’ ni wa asili na huhifadhi uhusiano huo.
- source_word: בְּגֹרֶן
  choice: katika uwanja wa kupuria
  rationale: גֹּרֶן ni eneo tambarare la kupuria nafaka; ‘uwanja wa kupuria’ ni wazi kwa msomaji wa sasa, na בְּ hutafsiriwa kwa ‘katika’ kwa maana ya mahali.
- source_word: ארניה
  choice: Arauna
  rationale: Hili linaakisi umbo la jina katika Samueli, tofauti na Ornani katika 1 Mambo ya Nyakati 21:18.
- source_word: הַיְבֻסִי
  choice: Myebusi
  rationale: Jina la mtu wa kabila la Wayebusi hutolewa kwa umbo la kawaida la Kiswahili ‘Myebusi.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יהוה moja kwa moja. ‘Yahwe’ hulitofautisha na cheo ‘Bwana’ na kuepuka kuingiza mbadala wa kimapokeo usio katika maandishi.
- issue: Nguvu ya ל katika לַיהוָה
  choice: ukamjengee Yahwe madhabahu
  alternative: ujenge madhabahu kwa ajili ya Yahwe
  rationale: Kirai kinaweza kuonyesha kuelekezwa au kuwekwa wakfu kwa Yahwe. ‘Ukamjengee Yahwe’ ni cha kawaida na hakibani maana kuwa faida pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Uwanja wa kupuria’ umechaguliwa kwa uwazi; ‘Panda’ huhifadhi mwelekeo wa kijiografia wa kitenzi cha Kiebrania. Alama ya tanbihi [a] imewekwa baada ya sentensi inayotaja Arauna.
