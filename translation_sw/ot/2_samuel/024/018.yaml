  verdict: revise
  source_fidelity: 'Rasimu inafuata kwa karibu mfuatano wa Kiebrania: wakati (“siku hiyo”), kuja kwa Gadi, amri ya kupanda, kusimamisha madhabahu kwa Yahwe, mahali pa kupuria, na utambulisho wa Arauna. Hata hivyo, vitenzi viwili vya amri vinapaswa kutolewa kwa uwazi zaidi kama amri sambamba badala ya muundo wa utegemezi unaoweza kusikika kama matokeo tu.'
  naturalness: “Panda, ukajenge” ni Kiswahili sanifu, cha asili, na huhifadhi mfuatano wa amri. “Uwanja wa kupuria” ni fasaha na unaeleweka. “Arauna, Myebusi” hutenganisha vizuri jina na utambulisho wake.
  terminology: “Yahwe,” “madhabahu,” “Arauna,” na “Myebusi” zinafaa. Muundo “umjengee Yahwe madhabahu” huonyesha kwa kawaida wakfu/uelekeo wa לַיהוָה bila kuubana kuwa faida pekee. Tanbihi ya Ornani ni sahihi na nanga yake ibaki kwenye Arauna.
