  yaml_path: translation/ot/2_samuel/024/004.yaml
  text: But the king’s word prevailed against Joab and against the commanders of the army, so Joab and the commanders of the army went out from before the king to count the people of Israel.
translation:
  language: sw
  text: Lakini neno la mfalme likashinda dhidi ya Yoabu na dhidi ya wakuu wa jeshi; hivyo Yoabu na wakuu wa jeshi wakatoka mbele ya mfalme ili kuwahesabu watu wa Israeli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱזַק דְּבַר הַמֶּלֶךְ
  choice: neno la mfalme likawa na nguvu
  rationale: Inadumisha picha ya Kiebrania kwamba agizo au uamuzi wa mfalme ulikuwa na nguvu na ukashinda upinzani, bila kuufafanua kupita kiasi.
- source_word: אֶל יוֹאָב וְעַל שָׂרֵי הֶחָיִל
  choice: dhidi ya Yoabu na dhidi ya makamanda wa jeshi
  rationale: ‘Dhidi ya’ huhifadhi mwelekeo wa maneno ya mfalme kwa Yoabu na viongozi wa kijeshi katika muktadha wa upinzani wao.
- source_word: וַיֵּצֵא ... לִפְנֵי הַמֶּלֶךְ
  choice: wakaondoka mbele ya mfalme
  rationale: Tafsiri ya karibu inayobaki ya kawaida kwa Kiswahili na kuonyesha walitoka katika uwepo wa mfalme.
- source_word: לִפְקֹד אֶת הָעָם אֶת יִשְׂרָאֵל
  choice: ili kuwahesabu watu wa Israeli
  rationale: Katika muktadha huu פקד humaanisha kufanya sensa au kuhesabu; ‘kuwahesabu’ ni wazi na ya kawaida.
