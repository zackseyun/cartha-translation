  text: וַ/יָּבֹא גָ֥ד אֶל דָּוִ֖ד וַ/יַּגֶּד ל֑/וֹ וַ/יֹּ֣אמֶר ל֡/וֹ הֲ/תָב֣וֹא לְ/ךָ֣ שֶֽׁבַע שָׁנִ֣ים רָעָ֣ב בְּ/אַרְצֶ֡/ךָ אִם שְׁלֹשָׁ֣ה חֳ֠דָשִׁים נֻסְ/ךָ֨ לִ/פְנֵֽי צָרֶ֜י/ךָ וְ/ה֣וּא רֹדְפֶ֗/ךָ וְ/אִם הֱ֠יוֹת שְׁלֹ֨שֶׁת יָמִ֥ים דֶּ֨בֶר֙ בְּ/אַרְצֶ֔/ךָ עַתָּה֙ דַּ֣ע וּ/רְאֵ֔ה מָה אָשִׁ֥יב שֹׁלְחִ֖/י דָּבָֽר־־־׀׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/013.yaml
  text: So Gad came to David and told him[a], and said to him[c][b], “Shall seven years of famine come to you in your land? Or will you flee three months before your adversaries while they pursue you? Or shall there be three days of pestilence in your land? Now know and see what answer I should return to the one who sent me.”
translation:
  language: sw
  text: Basi Gadi akaja kwa Daudi, akamweleza, akamwambia, “Je, miaka saba ya njaa itakujia katika nchi yako?[a] Au ukimbie mbele ya adui zako kwa miezi mitatu huku wakikufuatilia?[b] Au kuwe na siku tatu za tauni katika nchi yako?[c] Sasa tambua na uone ni jibu gani nitakalomrudishia yule aliyenituma.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika kifungu sambamba, 1 Mambo ya Nyakati 21:12 inasema “miaka mitatu ya njaa” badala ya “miaka saba.”
    reason: textual_variant
  - marker: b
    text: Au “wapinzani wako.”
    reason: lexical_alternative
  - marker: c
    text: Au “pigo la ugonjwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaja
  rationale: Kitenzi בוא kinaeleza Gadi akimkaribia Daudi; “akaja” ni simulizi la kawaida na la asili katika Kiswahili.
- source_word: וַיַּגֶּד לֹו
  choice: akamweleza
  rationale: Hifili ya נגד humaanisha kueleza au kutoa taarifa. “Akamweleza” hutofautisha hatua hii na usemi wa moja kwa moja unaofuata bila kuongeza maudhui.
- source_word: שֶׁבַע שָׁנִים רָעָב
  choice: miaka saba ya njaa
  rationale: רָעָב hapa ni njaa kubwa inayoikumba nchi, si hisia binafsi ya kuwa na njaa. Idadi saba ya WLC imehifadhiwa katika matini.
- source_word: נֻסְךָ לִפְנֵי צָרֶיךָ
  choice: ukimbie mbele ya adui zako
  rationale: Kifungu cha Kiebrania kimebanwa; tafsiri hii huonyesha kwamba Daudi na watu wake wangekimbia huku adui wakiwa nyuma yao, bila kukiongezea ufafanuzi usio wa lazima.
- source_word: וְהוּא רֹדְפֶךָ
  choice: huku wakikufuatilia
  rationale: Ingawa kiwakilishi cha Kiebrania ni cha umoja, kinarejelea kwa maana ya kijumla adui waliotajwa kwa wingi; Kiswahili hutumia wingi kwa upatanisho wa kawaida.
- source_word: דֶּבֶר
  choice: tauni
  rationale: דֶּבֶר ni ugonjwa wa kuambukiza unaoenea kwa maangamizi. “Tauni” ni neno fupi, lenye uzito, na linaloeleweka katika Kiswahili cha Biblia; “pigo la ugonjwa” ni uwezekano mwingine.
- source_word: עַתָּה דַּע וּרְאֵה
  choice: Sasa fikiria kwa makini, uone
  rationale: Amri mbili “jua na uone” ni mwito wa kutafakari na kuamua. Kiswahili hiki cha kawaida kinawasilisha kazi ya jozi hiyo bila kuwa tafsiri ngumu ya neno kwa neno.
- source_word: מָה אָשִׁיב שֹׁלְחִי דָּבָר
  choice: ni jibu gani nitakalomrudishia yule aliyenituma
  rationale: השיב דבר ni nahau ya kurudisha jibu. “Yule aliyenituma” humwakilisha kiasili שֹׁלְחִי bila kumtaja moja kwa moja.
theological_decisions:
- issue: Tofauti ya idadi kati ya 2 Samweli 24:13 na 1 Mambo ya Nyakati 21:12
  choice: Matini kuu inasema “miaka saba ya njaa,” kufuatana na WLC katika 2 Samweli.
  alternative: 1 Mambo ya Nyakati 21:12 inasema “miaka mitatu ya njaa.”
  rationale: Toleo la Kimasoreti lililotolewa ndilo msingi wa mstari huu, hivyo halipaswi kusawazishwa kimya kimya na simulizi sambamba. Tanbihi huhifadhi uwazi na mvutano wa kimatini.
- issue: Utambulisho wa “yule aliyenituma”
  choice: Kumwacha bila jina kama ilivyo katika mstari wa Kiebrania.
  alternative: Kumtaja wazi kuwa BWANA.
  rationale: Muktadha unamwezesha msomaji kuelewa mtumaji, lakini mstari wenyewe unasema tu “aliyenituma.” Tafsiri haiongezi jina ambalo halipo hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa sasa na hadhi inayofaa Maandiko. “Basi” huunganisha mstari na simulizi linalotangulia. Alama zote za tanbihi zimewekwa mara moja katika matini karibu na maneno yanayohusika.
