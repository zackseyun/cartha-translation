base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/020.yaml
  text: Araunah looked out and saw the king and his servants passing by him[a]. So Araunah went out and bowed down to the king with his face to the ground.
translation:
  language: sw
  text: Arauna akatazama nje, akamwona mfalme pamoja na watumishi wake wakielekea upande wake.[a] Basi Arauna akatoka, akainama kifudifudi mbele ya mfalme, uso wake ukiwa umeelekea ardhini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakipita karibu naye” au “wakimkaribia”; maneno ya Kiebrania yanaeleza mwendo wa mfalme na watumishi wake kuhusiana na Arauna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: akatazama nje
  rationale: Kitenzi kinaashiria kutazama kutoka mahali fulani au kupitia uwazi; “akatazama nje” ni cha asili na huhifadhi maana hiyo kuliko “akatazama” pekee.
- source_word: וַיַּרְא
  choice: akamwona
  rationale: Huhifadhi mfuatano wa simulizi wa kutazama kisha kumwona mtu.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Ni tafsiri ya moja kwa moja inayofaa mazingira ya kifalme na inaweza kuwajumuisha wahudumu au maafisa wa mfalme bila kuifafanua kupita kiasi.
- source_word: עֹבְרִים עָלָיו
  choice: wakielekea upande wake
  rationale: Muundo huu unaeleza mwendo wa mfalme na watumishi wake kuhusiana na Arauna. Katika muktadha wanafika kwake, lakini Kiebrania kinaweza pia kueleweka kuwa wanapita karibu naye; tanbihi huhifadhi uwezekano huo.
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Ni tafsiri ya kawaida na ya asili ya יצא katika mfuatano huu wa simulizi.
- source_word: וַיִּשְׁתַּחוּ
  choice: akainama kifudifudi
  rationale: Inaonyesha tendo la kujishusha sana mbele ya mfalme bila kutumia neno linaloweza kueleweka moja kwa moja kama ibada ya Mungu.
- source_word: אַפָּיו אָרְצָה
  choice: uso wake ukiwa chini
  rationale: Huwasilisha kwa Kiswahili cha kawaida nahau inayoeleza kuinama mpaka uso ukaelekezwa ardhini.
- source_word: אֲרַוְנָה
  choice: Arauna
  rationale: Jina limetoholewa kulingana na umbo la Kiebrania katika kitabu cha Samweli; “Ornani” ni umbo linalopatikana katika simulizi sambamba la Mambo ya Nyakati.
theological_decisions:
- issue: Maana ya tendo la Arauna mbele ya mfalme
  choice: Tendo la heshima kwa mfalme wa kibinadamu, limetafsiriwa “akainama kifudifudi mbele ya mfalme”
  alternative: “akamsujudia mfalme” au “akamwabudu mfalme”
  rationale: Kitenzi cha Kiebrania kinaweza kutumiwa kwa ibada au kwa kuinama kwa heshima. Hapa anayepokea tendo hilo ni Mfalme Daudi; tafsiri iliyochaguliwa huonyesha tendo la mwili bila kudai kwamba Arauna alimwabudu kama Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa vitenzi vya mfululizo wa simulizi umehifadhiwa kwa viambishi vya “aka-”. Neno “watumishi” linafaa katika mazingira ya kifalme bila kuwafanya wote waonekane kuwa watumwa wa hadhi ya chini.
