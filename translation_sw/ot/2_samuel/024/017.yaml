base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/017.yaml
  text: Then David said to the LORD, when he saw the angel striking the people, “Look, I have sinned, and I have done wrong; but these sheep—what have they done? Please let your hand be against me and against my father's house.”
translation:
  language: sw
  text: Ndipo Daudi akamwambia BWANA, alipomwona malaika akiwapiga watu, “Tazama, mimi nimetenda dhambi, nami nimetenda maovu; lakini kondoo hawa wamefanya nini? Tafadhali, mkono wako uwe dhidi yangu na dhidi ya nyumba ya baba yangu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: BWANA
  rationale: Jina la agano la Mungu limetolewa kwa desturi pana ya Biblia ya Kiswahili kwa herufi kubwa, bila kuingiza matamshi yenye utata katika maandishi makuu.
- source_word: הַמַּלְאָךְ הַמַּכֶּה
  choice: malaika akiwapiga
  rationale: Huhifadhi maana ya malaika anayetekeleza pigo juu ya watu; umbo la kuendelea linaendana na בראותו, ‘alipomwona’.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Huhifadhi kishazi cha kusisitiza kinachoelekeza fikira kwenye ungamo la Daudi.
- source_word: הֶעֱוֵיתִי
  choice: niliyefanya kosa
  rationale: Hutofautisha kauli hii na חטאתי huku ikitoa maana ya kufanya yaliyo mabaya bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: הַצֹּאן
  choice: kondoo
  rationale: Huhifadhi sitiari ya kichungaji ambayo Daudi anaitumia kuhusu watu.
- source_word: יָדְךָ
  choice: mkono wako
  rationale: Huhifadhi sitiari ya Kiebrania ya uwezo au hukumu ya Mungu badala ya kuifafanua kupita kiasi.
- source_word: בֵית אָבִי
  choice: nyumba ya baba yangu
  rationale: Huhifadhi usemi mpana wa ukoo au jamaa ya baba, pamoja na uwezekano wake wa maana pana kuliko jengo la makazi.
theological_decisions:
- issue: Uwajibikaji wa Daudi na mateso ya watu
  choice: Kauli ya Daudi kwamba yeye ametenda dhambi na swali lake kuhusu ‘kondoo’ zimehifadhiwa bila kusawazisha mvutano huo.
  alternative: Kufafanua kwa nini watu walipatwa na pigo au kusema wazi kwamba hawakuwa na hatia.
  rationale: Mstari wenyewe unaweka pamoja ungamo la Daudi na ombi lake kwa niaba ya watu; tafsiri haipaswi kutatua kimya kimya suala la haki ya Mungu.
- issue: ‘Mkono’ wa BWANA dhidi ya Daudi na nyumba ya baba yake
  choice: Sitiari ‘mkono wako’ imehifadhiwa.
  alternative: ‘Adhabu yako’ au ‘pigo lako’.
  rationale: Neno la asili linaweza kuhusisha nguvu, hukumu, au pigo; kudumisha sitiari huhifadhi upana huo wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya ‘mimi ndiye’ yanahifadhi msisitizo wa אָנֹכִי unaorudiwa. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zilizohitajika.
