base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/014.yaml
  text: Then David said to Gad[a], “I am in great distress. Let us fall, please, into the hand of Yahweh, for his mercies are many[b]; but let me not fall into the hand of man.”
translation:
  language: sw
  text: Ndipo Daudi akamwambia Gadi, “Niko katika dhiki kubwa sana. Tafadhali, na tuanguke mikononi mwa Yahwe, kwa maana rehema zake ni nyingi[a]; lakini mimi nisianguke mikononi mwa mwanadamu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana huruma yake ni tele.” Kiebrania kwa neno kwa neno ni, “kwa maana rehema zake ni nyingi.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “mkononi mwa mwanadamu”; yaani, chini ya uwezo au mamlaka ya kibinadamu.
    reason: idiom_explanation
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: Niko katika dhiki kubwa sana
  rationale: Kirai hiki kinaonyesha Daudi mwenyewe yumo katika hali ya dhiki kali. Tafsiri hii ni ya kawaida na yenye uzito katika Kiswahili, huku ikihifadhi nguvu ya מְאֹד.
- source_word: נִפְּלָה נָּא
  choice: Tafadhali, na tuanguke
  rationale: Kitenzi cha nafsi ya kwanza wingi kinamhusisha Daudi pamoja na watu katika hukumu; נָא huonyesha ombi la kusihi, linalowakilishwa na “tafadhali.”
- source_word: בְיַד יְהוָה
  choice: mkononi mwa Yahwe
  rationale: “Mkononi mwa” huhifadhi sitiari ya Kiebrania ya kuwekwa chini ya uwezo au mamlaka ya mtu, na pia huhifadhi umoja wa יַד.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja kwa namna inayosomeka kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: כִּי רַבִּים רחמיו
  choice: kwa maana rehema zake ni nyingi
  rationale: Tafsiri hii huhifadhi wingi wa רחמיו na muundo wa msingi, “rehema zake ni nyingi,” bila kupoteza maana ya huruma tele.
- source_word: וּבְיַד אָדָם
  choice: lakini ... mkononi mwa mwanadamu
  rationale: “Mwanadamu” hapa ni jina la jumla kwa binadamu na hudumisha tofauti ya kimakusudi kati ya mkono wa Yahwe na mkono wa binadamu.
- source_word: אַל אֶפֹּלָה
  choice: nisianguke
  rationale: Umbo hili huwasilisha kwa ufupi na kwa kawaida ombi au azimio hasi la Daudi, sambamba na hali ya hiari katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina maalumu la Mungu, si cheo. “Yahwe” hulihifadhi kama jina la agano bila kuingiza tafsiri ya kimadhehebu.
- issue: Maana ya אָדָם katika tofauti na Yahwe
  choice: mwanadamu
  alternative: wanadamu; binadamu
  rationale: Umoja wa jumla “mwanadamu” huhifadhi umbo la chanzo na tofauti ya balagha kati ya Yahwe na mwanadamu, huku ukimaanisha mamlaka ya kibinadamu kwa ujumla.
- issue: Uhusiano wa Daudi na watu katika נִפְּלָה
  choice: na tuanguke
  alternative: nianguke
  rationale: Kiebrania ni nafsi ya kwanza wingi, kwa hiyo Daudi anajihusisha na watu walio chini ya hukumu; tafsiri haibadilishi wingi huo kuwa umoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo “na tuanguke” una ladha rasmi kidogo lakini huhifadhi hali ya kusihi na wingi wa kitenzi cha Kiebrania. Alama za tanbihi zimewekwa kwenye vifungu vinavyohusika.
