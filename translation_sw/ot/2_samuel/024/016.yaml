language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ יָד֨/וֹ הַ/מַּלְאָ֥ךְ יְרֽוּשָׁלִַם֮ לְ/שַׁחֲתָ/הּ֒ וַ/יִּנָּ֤חֶם יְהוָה֙ אֶל הָ֣/רָעָ֔ה וַ֠/יֹּאמֶר לַ/מַּלְאָ֞ךְ הַ/מַּשְׁחִ֤ית בָּ/עָם֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ הָיָ֔ה עִם גֹּ֖רֶן ה/אורנה הַ/יְבֻסִֽי׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/016.yaml
  text: When the angel stretched out his hand toward Jerusalem to destroy it[a], Yahweh relented concerning the calamity and said to the angel who was destroying the people, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was by the threshing floor of Araunah the Jebusite.
translation:
  language: sw
  text: Malaika alipounyoosha mkono wake kuelekea Yerusalemu ili kuuangamiza, Yahweh akaghairi maafa hayo[a], akamwambia malaika aliyekuwa akiwangamiza watu, “Imetosha! Sasa uondoe mkono wako.” Malaika wa Yahweh alikuwa karibu na uwanja wa kupuria nafaka wa Arauna, Myebusi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania husema kihalisi, “Yahweh akaghairi kuhusu maafa hayo.” Neno linalotafsiriwa “maafa” hapa linamaanisha msiba au janga, si uovu wa kimaadili.
    reason: lexical_alternative
  - marker: b
    text: Arauna anaitwa Ornani katika simulizi sambamba la 1 Mambo ya Nyakati 21:15.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: alipounyoosha mkono wake
  rationale: Nahau ya Kiebrania inaonyesha kunyoosha mkono ili kutenda; tafsiri hii inadumisha taswira halisi na ni ya kawaida katika Kiswahili.
- source_word: הַמַּלְאָךְ
  choice: malaika
  rationale: Katika muktadha huu ni mjumbe wa mbinguni anayeleta hukumu, hivyo “malaika” linafaa kuliko “mjumbe” la jumla.
- source_word: לְשַׁחֲתָהּ
  choice: ili kuuangamiza
  rationale: Kiwakilishi kinarejelea Yerusalemu, na kitenzi kinaeleza uharibifu mkali katika muktadha wa hukumu.
- source_word: וַיִּנָּחֶם יְהוָה אֶל הָרָעָה
  choice: Yahweh akaghairi kuendeleza maafa hayo
  rationale: “Akaghairi” linaonyesha kuacha hatua ya hukumu, huku “maafa” likibainisha kuwa רָעָה hapa si uovu wa kimaadili. “Kuendeleza” linaendana na tukio ambalo tayari lilikuwa likitokea.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: הַמַּשְׁחִית בָּעָם
  choice: aliyekuwa akiwaangamiza watu
  rationale: Kauli ya wakati unaoendelea inadumisha maana ya tendo lililokuwa likifanyika.
- source_word: רַב
  choice: Imetosha!
  rationale: Neno hili linatumika kama tamko fupi la kusimamisha tendo.
- source_word: עַתָּה הֶרֶף יָדֶךָ
  choice: Sasa rudisha mkono wako
  rationale: Tafsiri hii ni ya kawaida na inadumisha taswira ya mkono huku ikieleza amri ya kusitisha tendo.
- source_word: וּמַלְאַךְ יְהוָה
  choice: Malaika wa Yahweh
  rationale: Inahifadhi jina la mhusika kama lilivyo katika maandishi bila kuamua utambulisho wake wa kitheolojia.
- source_word: הָיָה עִם
  choice: alikuwa karibu na
  rationale: Katika muktadha wa mahali, עִם linaonyesha ukaribu na uwanja wa kupuria.
- source_word: גֹּרֶן
  choice: uwanja wa kupuria nafaka
  rationale: Ni usemi wa kawaida na unaoeleweka kwa mahali pa kutenganishia nafaka na makapi.
- source_word: הָאֹרְנָה הַיְבֻסִי
  choice: Arauna, Myebusi
  rationale: Inahifadhi namna ya jina katika kitabu cha Samueli na kutafsiri utambulisho wa kikabila kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Lugha inayomhusisha Mungu na kughairi katika וַיִּנָּחֶם יְהוָה
  choice: Yahweh akaghairi kuendeleza maafa hayo
  alternative: Yahweh akabadili nia kuhusu maafa hayo
  rationale: Tafsiri inahifadhi dai la maandishi kwamba Yahweh alisitisha kuendelea kwa hukumu bila kudokeza kosa la kimaadili; tanbihi inaonyesha kwa uwazi zaidi muundo halisi wa Kiebrania.
- issue: Utambulisho wa מַלְאַךְ יְהוָה
  choice: Malaika wa Yahweh
  alternative: udhihirisho wa Mungu au malaika aliyeumbwa
  rationale: Aya inamtaja mhusika lakini haiamui kati ya maelezo hayo ya kitheolojia, kwa hiyo tafsiri haifungi maana kwa mojawapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. “Uwanja wa kupuria nafaka” umechaguliwa badala ya neno la kiufundi lisiloeleweka kwa wasomaji wengi; jina Yahweh na mvutano wa lugha ya kughairi kwa Mungu vimehifadhiwa.
