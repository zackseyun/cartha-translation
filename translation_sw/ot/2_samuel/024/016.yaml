  to: Malaika alipounyoosha mkono wake kuelekea Yerusalemu ili kuuangamiza, Yahweh akaghairi maafa hayo[a], akamwambia malaika aliyekuwa akiwangamiza watu, “Imetosha! Sasa uondoe mkono wako.” Malaika wa Yahweh alikuwa karibu na uwanja wa kupuria nafaka wa Arauna, Myebusi[b].
  rationale: Marekebisho yanaondoa nyongeza ya maana katika “kuendeleza,” yanaweka tanbihi kwenye kauli inayofafanuliwa, na kuboresha mtiririko wa Kiswahili. Taswira ya mkono, tendo linaloendelea la malaika, jina la Yahweh, na utambulisho wa malaika wa Yahweh vimehifadhiwa bila maamuzi ya ziada ya kiteolojia.
