base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/011.yaml
  text: When David arose in the morning[a], the word of Yahweh had come to Gad the prophet, David’s seer, saying,
translation:
  language: sw
  text: Daudi alipoamka asubuhi, neno la Yahweh lilikuwa limemjia[a] Gadi, nabii na mwonaji wa Daudi, likisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa karibu zaidi: “neno la Yahweh lilikuwa kwa Gadi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם דָּוִד בַּבֹּקֶר
  choice: Daudi alipoamka asubuhi
  rationale: Muundo huu wa simulizi unaonyesha wakati Daudi alipoamka na unasikika kwa kawaida katika Kiswahili, huku ukihifadhi mfuatano wa matukio.
- source_word: וּדְבַר יְהוָה
  choice: neno la Yahweh
  rationale: ‘Neno’ linahifadhi uzito wa kauli ya kinabii, na jina la agano יְהוָה limetafsiriwa ‘Yahweh.’
- source_word: הָיָה אֶל
  choice: lilikuwa limemjia
  rationale: Katika kauli za kinabii, nahau hii humaanisha kwamba neno la Mungu lilimfikia mtu. Wakati timilifu ‘lilikuwa limemjia’ unaonyesha usomaji unaowezekana kwamba ujumbe ulimfikia Gadi kabla ya Daudi kuamka, bila kuficha tafsiri ya karibu zaidi iliyoonyeshwa katika tanbihi.
- source_word: גָּד הַנָּבִיא
  choice: Gadi nabii
  rationale: Jina גָּד limewasilishwa kwa umbo la Kiswahili ‘Gadi,’ na נָבִיא kwa neno la kawaida ‘nabii.’
- source_word: חֹזֵה דָוִד
  choice: mwonaji wa Daudi
  rationale: ‘Mwonaji’ hutofautisha חֹזֶה na ‘nabii,’ huku ‘wa Daudi’ ukihifadhi uhusiano wa kirai cha umilikaji.
- source_word: לֵאמֹר
  choice: likisema,
  rationale: Hutanguliza maneno ya moja kwa moja yanayofuata katika mstari unaofuata; upatanisho wa ngeli unarejelea ‘neno.’
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יְהוָה; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa wakati katika הָיָה אֶל
  choice: lilikuwa limemjia
  alternative: likamjia; lilikuwa kwa
  rationale: Muktadha unaruhusu kuelewa kwamba neno lilikuwa tayari limemjia Gadi Daudi alipoamka. Kwa kuwa Kiebrania chenyewe hakisemi wazi wakati uliotangulia, tafsiri ya karibu zaidi imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. Maneno ‘nabii’ na ‘mwonaji’ yameachwa tofauti ili kuhifadhi istilahi mbili za Kiebrania.
