base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/023.yaml
  text: Araunah the king gave all this to the king[a]. And Araunah said to the king[b], “May Yahweh your God accept you.”
translation:
  language: sw
  text: Arauna, mfalme, alimpa mfalme vitu hivi vyote.[a] Kisha Arauna akamwambia mfalme, “Yahweh Mungu wako akukubali.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Arauna mfalme.” Baadhi ya tafsiri hulainisha usemi huu ili kuepuka kudokeza kwamba Arauna alikuwa na hadhi ya kifalme, lakini cheo hicho kimo katika matini ya Kiebrania.'
    reason: alternative_reading
  - marker: b
    text: Au “akupendelee” au “apendezwe nawe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: vitu hivi vyote
  rationale: Kirai hiki kinarejelea kwa ujumla vitu vilivyotolewa katika muktadha uliotangulia. ‘Vitu hivi vyote’ ni Kiswahili cha kawaida kinachodumisha ukamilifu wa maana.
- source_word: נָתַן
  choice: alimpa
  rationale: Kauli ya wakati uliotimia katika simulizi imetafsiriwa kwa wakati uliopita; kiambishi cha mtendewa kinaonyesha kuwa mfalme ndiye aliyepokea.
- source_word: אֲרַוְנָה
  choice: Arauna
  rationale: Hili ni umbo la kawaida la Kiswahili la jina linalotumiwa katika kitabu cha Samweli; jina Ornan la kifungu sambamba katika Mambo ya Nyakati halijaingizwa hapa.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Cheo kinachofuata jina la Arauna kimehifadhiwa katika matini kuu, ingawa matumizi yake hapa si ya kawaida.
- source_word: לַמֶּלֶךְ
  choice: mfalme
  rationale: Kihusishi ל kinamtaja mfalme, yaani Daudi, kuwa mpokeaji; Kiswahili kinaonyesha uhusiano huo ndani ya kitenzi ‘alimpa’.
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo huu unaendeleza mtiririko wa simulizi kwa Kiswahili cha asili na pia unaonyesha anayesemeshwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Muundo wenye kiambishi cha nafsi ya pili umewasilishwa moja kwa moja kwa kumrejelea Daudi.
- source_word: יִרְצֶךָ
  choice: akukubali
  rationale: Kitenzi רצה hapa kinaonyesha kukubaliwa kwa fadhili. ‘Akukubali’ huhifadhi Daudi mwenyewe kuwa mtendewa bila kuongeza maelezo yasiyosemwa wazi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ina jina la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi na halibadilishi kuwa cheo.
- issue: Kuhifadhi cheo ‘mfalme’ baada ya jina la Arauna
  choice: Arauna mfalme
  alternative: Arauna
  rationale: Kiebrania kilichopokelewa kina maneno ‘Arauna mfalme.’ Ingawa usemi huo si wa kawaida na huenda ukadokeza hadhi ya kifalme, tafsiri haipaswi kuondoa ugumu huo kimya kimya.
- issue: Maana ya רצה katika baraka ya Arauna
  choice: akukubali
  alternative: akupendelee; apendezwe nawe
  rationale: ‘Akukubali’ hudumisha wazo la kukubaliwa kwa fadhili katika mazingira ya dhabihu bila kuamua kwa namna finyu ikiwa maana kuu ni kukubaliwa kwa dhabihu, kupata kibali, au Mungu kupendezwa naye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa kwa matini ya Biblia. Mpangilio usio wa kawaida ‘Arauna mfalme’ umehifadhiwa kwa uaminifu kwa matini, huku tanbihi ikieleza ugumu wake.
