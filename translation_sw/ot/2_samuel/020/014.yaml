  text: וַֽ/יַּעֲבֹ֞ר בְּ/כָל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל אָבֵ֛לָ/ה וּ/בֵ֥ית מַעֲכָ֖ה וְ/כָל הַ/בֵּרִ֑ים ו/יקלהו וַ/יָּבֹ֖אוּ אַף אַחֲרָֽי/ו־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/014.yaml
  text: He passed through all the tribes of Israel to Abel and Beth-maacah[b][a], and all the Berites assembled and also followed after him.
translation:
  language: sw
  text: Akapita katika maeneo ya makabila yote ya Israeli hadi Abeli na Beth-maaka. Waberiti wote[a] wakakusanyika, nao pia wakamfuata[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Waberiti wote.” Baadhi ya tafsiri husema “Wabikri wote,” zikihusianisha kirai hiki na Sheba mwana wa Bikri katika muktadha; lakini Maandishi ya Kimasoreti hapa yanaunga mkono moja kwa moja zaidi “Waberiti.”'
    reason: alternative_reading
  - marker: b
    text: Au, “nao pia wakaja baada yake.” Hii ndiyo namna ya karibu zaidi na nahau ya Kiebrania, lakini “wakamfuata” huwasilisha vizuri zaidi maana yake katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: Akapita
  rationale: Kitenzi עבר katika simulizi kinaonyesha kusafiri kupitia maeneo mbalimbali; “akapita” ni ya kawaida na yenye mtiririko mzuri katika Kiswahili.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: katika maeneo ya makabila yote ya Israeli
  rationale: Kirai kinaonyesha kupita katika maeneo ya makabila, si kupita ndani ya watu wenyewe; kuongeza “maeneo ya” huweka wazi maana ya kijiografia bila kubadili wigo wa Kiebrania.
- source_word: אָבֵלָה
  choice: hadi Abeli
  rationale: Herufi ya mwisho ya mwelekeo inaonyesha kwenda kuelekea Abeli; “hadi” huwasilisha kikomo cha safari kwa Kiswahili cha kawaida.
- source_word: וּבֵית מַעֲכָה
  choice: na Beth-maaka
  rationale: Hapa ni jina la mahali, hivyo limetoholewa badala ya kutafsiriwa kihalisi kuwa “nyumba ya Maaka.”
- source_word: וְכָל הַבֵּרִים
  choice: Waberiti wote
  rationale: Maandishi ya Kimasoreti yanaunga mkono zaidi jina la kundi “Beriti”; umbo la Kiswahili “Waberiti” huonyesha watu huku likihifadhi kutokuwa na uhakika kwa utambulisho wao.
- source_word: וַיִּקָּהֲלוּ
  choice: wakakusanyika
  rationale: Kitenzi קהל hapa kinaeleza watu kukusanyika; “wakakusanyika” ni tafsiri ya moja kwa moja na ya asili katika simulizi.
- source_word: וַיָּבֹאוּ אַף אַחֲרָיו
  choice: nao pia wakamfuata
  rationale: Kihalisi ni kuja baada yake, lakini katika muktadha kirai kinaonyesha kujiunga naye na kumfuata; “pia” linawakilisha אַף.
