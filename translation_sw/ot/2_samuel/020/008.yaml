base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/008.yaml
  text: When they were by the great stone that is in Gibeon[a], Amasa came before them. Now Joab was dressed in his military garment, and over it was a belt with a sword fastened to his waist in its sheath; and as he went out[c][b], it fell.
translation:
  language: sw
  text: Walipokuwa karibu na jiwe kubwa lililoko Gibeoni, Amasa akaja mbele yao.[a] Wakati huo Yoabu alikuwa amevaa vazi lake la kijeshi,[b] na juu yake alikuwa amejifunga mkanda wenye upanga ulioshikiliwa kiunoni mwake ndani ya ala yake. Alipokuwa akitoka, upanga ukaanguka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Amasa akaja kuwalaki.” Kiebrania kinasema kihalisi, “akaja mbele yao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “vazi lake” au “vazi alilokuwa amevaa.” Neno la Kiebrania linaweza kumaanisha vazi maalumu, na katika muktadha huu huenda ni vazi la kijeshi.
    reason: lexical_alternative
  - marker: c
    text: Kinachoanguka kwa uwezekano mkubwa ni upanga, kama inavyoashiriwa na umbo la kike la kitenzi cha Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם עִם הָאֶבֶן הַגְּדוֹלָה
  choice: Walipokuwa karibu na jiwe kubwa
  rationale: Katika maelezo ya mahali, עִם inaweza kumaanisha kuwa karibu na kitu; tafsiri hii ni ya kawaida katika Kiswahili na inaweka wazi uhusiano wa mahali.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: lililoko Gibeoni
  rationale: Kishazi hiki kinatambulisha mahali jiwe hilo lilipokuwa; muundo huu ni wa asili katika simulizi la Kiswahili.
- source_word: וַעֲמָשָׂא בָּא לִפְנֵיהֶם
  choice: Amasa akaja mbele yao
  rationale: Inahifadhi maana ya msingi ya לִפְנֵי, ‘mbele ya,’ bila kuamua ikiwa alikuja kuwalaki.
- source_word: חָגוּר מִדּוֹ לְבֻשׁוֹ
  choice: alikuwa amevaa vazi lake la kijeshi
  rationale: מַד inaweza kutaja vazi maalumu, hasa vazi la kijeshi katika muktadha huu wa silaha; ‘amevaa’ ni Kiswahili cha sasa na cha kawaida.
- source_word: וְעָלָיו חֲגוֹר
  choice: na juu yake alikuwa amejifunga mkanda
  rationale: Inaonyesha kuwa mkanda ulikuwa juu ya vazi na kwamba Yoabu alikuwa amejifunga nao.
- source_word: חֶרֶב מְצֻמֶּדֶת עַל מָתְנָיו
  choice: wenye upanga ulioshikiliwa kiunoni mwake
  rationale: מְצֻמֶּדֶת huonyesha kitu kilichofungwa au kushikiliwa karibu, na מָתְנַיִם hapa ni sehemu ya kiuno/nyonga.
- source_word: בְּתַעְרָהּ
  choice: ndani ya ala yake
  rationale: תַּעַר hapa ni ala ya upanga; kiambishi cha kike kinarejelea upanga.
- source_word: וְהוּא יָצָא
  choice: Alipokuwa akitoka
  rationale: Muundo huu unaunganisha mwendo wa Yoabu na tukio linalofuata, huku ukihifadhi maana ya kawaida ya יָצָא.
- source_word: וַתִּפֹּל
  choice: ukaanguka
  rationale: Kitenzi cha Kiebrania ni cha kike na kwa uwezekano mkubwa kinarejelea חֶרֶב, ‘upanga’; ngeli ya ‘upanga’ katika Kiswahili pia inaonyesha rejeo hilo bila kulirudia jina.
