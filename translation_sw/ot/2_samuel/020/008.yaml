translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Tafsiri imehifadhi usemi ‘mbele yao’ na imeweka tanbihi pale ambapo Kiebrania kinaweza kueleweka kwa njia nyingine.
