  naturalness: The narrative is natural Standard East African Swahili. Explicitly repeating “upanga” at the end is idiomatic and improves clarity without making the sentence cumbersome.
  terminology: “Gibeoni,” “Amasa,” “Yoabu,” “vazi la kijeshi,” “mkanda,” and “ala” are appropriate. The footnotes accurately preserve the lexical alternative for Amasa's approach, the nuance of the garment term, and the grammatical basis for identifying the falling object.
