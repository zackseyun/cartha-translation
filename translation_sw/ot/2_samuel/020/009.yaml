base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/009.yaml
  text: Joab said to Amasa[a], “Is it well with you, my brother?” And Joab took hold of Amasa’s beard with his right hand to kiss him.
translation:
  language: sw
  text: Yoabu akamwambia Amasa[a], “Je, hujambo, ndugu yangu?” Kisha Yoabu akashika ndevu za Amasa kwa mkono wake wa kulia ili ambusu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kushika ndevu na kubusu kulihusishwa na salamu ya kirafiki; katika muktadha huu, Yoabu alitumia ishara hiyo kwa hila.
    reason: cultural_note
lexical_decisions:
- source_word: הֲשָׁלוֹם
  choice: Je, hujambo
  rationale: Ni salamu ya kawaida ya Kiswahili inayouliza hali au ustawi wa mtu, na hivyo kuwasilisha kwa ufasaha nahau ya Kiebrania inayouliza kuhusu amani au hali njema.
- source_word: אָחִי
  choice: ndugu yangu
  rationale: Inahifadhi kiambishi wazi cha nafsi ya kwanza na lugha ya ukaribu ambayo Yoabu anaitumia kwa hila.
- source_word: וַתֹּחֶז
  choice: akashika
  rationale: Kitenzi hiki kinaonyesha kushika bila kutanguliza wazo la shambulio la wazi, ambalo linatokea katika mstari unaofuata.
- source_word: יַד יְמִין יוֹאָב
  choice: kwa mkono wake wa kulia
  rationale: Inahifadhi maelezo kwamba Yoabu alitumia mkono wa kulia, kwa mpangilio wa kawaida wa Kiswahili.
- source_word: בִּזְקַן עֲמָשָׂא
  choice: ndevu za Amasa
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kuonyesha umilikaji na inahifadhi jambo muhimu la kitamaduni katika tendo hilo.
- source_word: לִנְשָׁק לוֹ
  choice: ili ambusu
  rationale: Kiunganishi “ili” kinaonyesha kusudi la kitenzi-jina chenye ל, na “ambusu” humtaja Amasa kwa uwazi na ufasaha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na wa heshima. “Je, hujambo” limetumiwa badala ya tafsiri ngumu ya neno kwa neno kama “Je, una amani?”; muktadha wa salamu na maana ya kuuliza hali njema vimehifadhiwa.
