  text: Yoabu akajibu, akasema, “Hasha, hasha kwangu, kwamba niumeze au niuangamize!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן יוֹאָב וַיֹּאמַר
  choice: Yoabu akajibu, akasema
  rationale: Huhifadhi mfuatano wa kawaida wa simulizi ya Kiebrania huku ikisomeka kwa Kiswahili sanifu na cha asili.
- source_word: חָלִילָה חָלִילָה לִי
  choice: Hasha kwangu! Hasha!
  rationale: Usemi uliorudiwa unakanusha jambo hilo kwa nguvu; “hasha” ni tamko la Kiswahili lenye heshima na uzito linalofaa hapa.
- source_word: אִם
  choice: Siwezi kamwe
  rationale: Baada ya חָלִילָה, אִם hutambulisha uwezekano unaokataliwa, si sharti la kawaida. Kiswahili hiki kinaonyesha kukataa kwa nguvu bila kuunda sentensi isiyo ya kawaida.
- source_word: אֲבַלַּע
  choice: kuumeza
  rationale: Huhifadhi taswira hai ya kitenzi בלע, “kumeza,” katika muktadha wa kuutwaa au kuuangamiza mji.
- source_word: וְאִם אַשְׁחִית
  choice: au kuangamiza
  rationale: “Au” huunganisha matendo mawili yanayokataliwa, na “kuangamiza” hutoa maana ya moja kwa moja ya Hiphil ya שׁחת katika muktadha wa kijeshi.
