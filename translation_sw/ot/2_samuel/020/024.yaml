translation:
  language: sw
  text: Adoramu alikuwa msimamizi wa kazi ya lazima[a], naye Yehoshafati mwana wa Ahiludi alikuwa mtunza kumbukumbu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ushuru wa kazi” au “korvee”; neno la Kiebrania hapa linamaanisha huduma ya kazi ya lazima kwa serikali, wala si kodi ya kawaida ya fedha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹרָם
  choice: Adoramu
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili, sambamba na majina ya kibiblia yaliyozoeleka.
- source_word: עַל
  choice: alikuwa msimamizi wa
  rationale: Katika muktadha huu wa utawala, neno hili linaonyesha kuwa Adoramu alikuwa na mamlaka na wajibu wa kusimamia shughuli hiyo; Kiswahili hiki ni cha kawaida kuliko tafsiri ya neno kwa neno ‘alikuwa juu ya’.
- source_word: הַמַּס
  choice: kazi ya lazima
  rationale: Katika muktadha wa utawala wa kifalme, מַס inamaanisha huduma ya kazi iliyodaiwa na serikali, si kodi ya fedha tu. ‘Kazi ya lazima’ inaeleweka kwa urahisi na inadokeza hali ya kulazimishwa bila kutumia istilahi ngumu.
- source_word: יְהוֹשָׁפָט
  choice: Yehoshafati
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: בֶּן אֲחִילוּד
  choice: mwana wa Ahiludi
  rationale: Huu ni muundo wa kawaida wa Kiebrania unaotaja ukoo wa mtu; umetafsiriwa moja kwa moja na kwa Kiswahili cha asili.
- source_word: הַמַּזְכִּיר
  choice: mtunza kumbukumbu
  rationale: Cheo hiki kilimhusu afisa wa kifalme aliyeshughulikia kumbukumbu na taarifa rasmi. ‘Mtunza kumbukumbu’ ni wazi kwa msomaji wa sasa na hakimdokezi tu mwanahistoria au katibu wa kawaida.
