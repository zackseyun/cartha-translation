base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/017.yaml
  text: He came near to her[a], and the woman said, “Are you Joab?” He said, “I am.” Then she said to him, “Listen to the words of your servant.” He said, “I am listening.”
translation:
  language: sw
  text: Akamkaribia, naye yule mwanamke akasema, “Je, wewe ndiwe Yoabu?” Akasema, “Ni mimi.” Ndipo mwanamke akamwambia, “Sikiliza maneno ya mjakazi wako.[a]” Akasema, “Ninasikiliza.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi wako wa kike.” Neno la Kiebrania ni namna ya mwanamke kujitaja kwa unyenyekevu na katika nafasi ya utumishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב אֵלֶיהָ
  choice: Akamkaribia
  rationale: Kitenzi קרב pamoja na אֵלֶיהָ kinaonyesha kwamba Yoabu alisogea karibu na mwanamke. ‘Akamkaribia’ ni usemi wa kawaida wa Kiswahili unaohifadhi mwelekeo wa tendo.
- source_word: הָאִשָּׁה
  choice: yule mwanamke
  rationale: Katika muktadha huu אִשָּׁה humaanisha mwanamke, si lazima mke. ‘Yule’ humrejelea kwa kawaida mwanamke aliyetajwa katika simulizi.
- source_word: הַאַתָּה יוֹאָב
  choice: Je, wewe ndiwe Yoabu?
  rationale: Muundo huu ni swali la kuthibitisha utambulisho. ‘Wewe ndiwe’ huhifadhi msisitizo wa kiwakilishi cha Kiebrania kwa Kiswahili cha kawaida.
- source_word: אָנִי
  choice: Ni mimi
  rationale: Kiwakilishi kilichosimama peke yake ni jibu fupi la kujitambulisha. ‘Ni mimi’ ni la kawaida na haliongezi maelezo yasiyokuwapo.
- source_word: שְׁמַע
  choice: Sikiliza
  rationale: Amri ya שמע hapa inaomba usikivu makini, hivyo ‘Sikiliza’ inafaa kuliko ‘Sikia’ katika Kiswahili cha sasa.
- source_word: דִּבְרֵי אֲמָתֶךָ
  choice: maneno ya mjakazi wako
  rationale: ‘Maneno’ huhifadhi wingi wa דִּבְרֵי. אָמָה ni jina la kike la mtumishi au kijakazi na hapa linatumika kama namna ya unyenyekevu; ‘mjakazi wako’ huhifadhi jinsia na hadhi hiyo kwa lugha yenye staha.
- source_word: שֹׁמֵעַ אָנֹכִי
  choice: Ninasikiliza
  rationale: Kitenzi kishirikishi pamoja na kiwakilishi kinaonyesha tendo linaloendelea na utayari wa kusikiliza. ‘Ninasikiliza’ ni kifupi na cha kawaida.
