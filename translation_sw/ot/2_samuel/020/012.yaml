source:
  edition: WLC
  text: וַ/עֲמָשָׂ֛א מִתְגֹּלֵ֥ל בַּ/דָּ֖ם בְּ/ת֣וֹךְ הַֽ/מְסִּלָּ֑ה וַ/יַּ֨רְא הָ/אִ֜ישׁ כִּֽי עָמַ֣ד כָּל הָ/עָ֗ם וַ/יַּסֵּב֩ אֶת עֲמָשָׂ֨א מִן הַֽ/מְסִלָּ֤ה הַ/שָּׂדֶה֙ וַ/יַּשְׁלֵ֤ךְ עָלָי/ו֙ בֶּ֔גֶד כַּ/אֲשֶׁ֣ר רָאָ֔ה כָּל הַ/בָּ֥א עָלָ֖י/ו וְ/עָמָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/012.yaml
  text: Amasa was wallowing in blood in the middle of the highway. When the man saw that all the people were stopping[a], he moved Amasa from the highway into the field and threw a garment over him, because he saw that everyone who came upon him stopped.
translation:
  language: sw
  text: Amasa alikuwa akigaagaa katika damu katikati ya barabara kuu. Yule mtu alipoona kwamba watu wote walikuwa wakisimama, alimwondoa Amasa barabarani na kumpeleka shambani, kisha akamfunika kwa vazi, kwa sababu aliona kwamba kila mtu aliyemfikia alisimama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִתְגֹּלֵל
  choice: alikuwa akigaagaa
  rationale: Kitenzi cha Kiebrania kinaeleza kujiviringisha au kujigeuza-geuza; ‘akigaagaa’ huwasilisha mwendo wa Amasa aliyejeruhiwa bila kuongeza moja kwa moja wazo la maumivu ambalo halijasemwa wazi.
- source_word: בַּדָּם
  choice: katika damu
  rationale: Huhifadhi taswira ya moja kwa moja ya maandishi bila kuongeza ‘damu yake,’ jambo ambalo halijaelezwa wazi katika Kiebrania.
- source_word: בְּתוֹךְ הַמְסִלָּה
  choice: katikati ya barabara kuu
  rationale: מְסִלָּה ni njia kuu au barabara iliyojengwa; ‘barabara kuu’ ni Kiswahili cha kawaida kinachoonyesha njia ya umma yenye shughuli.
- source_word: הָאִישׁ
  choice: yule mtu
  rationale: Kibainishi cha Kiebrania kinaonyesha mtu maalumu anayejulikana katika muktadha; ‘yule mtu’ huweka urejeo huo wazi kwa Kiswahili.
- source_word: כִּי עָמַד כָּל הָעָם
  choice: kwamba watu wote walikuwa wakisimama
  rationale: עמד hapa inaonyesha watu waliokuwa wakifika na kusimama kwa sababu ya Amasa barabarani; hali endelevu inafaa mtiririko wa simulizi.
- source_word: וַיַּסֵּב
  choice: alimwondoa
  rationale: Hiphil ya סבב ina maana ya kumhamisha pembeni. ‘Alimwondoa’ ni ya kawaida na haiongezi kwamba alimkokota.
- source_word: מִן הַמְסִלָּה הַשָּׂדֶה
  choice: barabarani na kumpeleka shambani
  rationale: Muundo unaonyesha kuondolewa kutoka barabarani kwenda katika shamba lililokuwa kando; Kiswahili kinahitaji kueleza uhamisho huo kwa kawaida.
- source_word: בֶּגֶד
  choice: vazi
  rationale: בֶּגֶד ni neno la jumla kwa nguo au vazi; ‘vazi’ huepuka kubainisha aina fulani kama joho.
- source_word: כָּל הַבָּא עָלָיו
  choice: kila mtu aliyemfikia
  rationale: Kirai kinaeleza watu waliofika mahali Amasa alipokuwa; ‘aliyemfikia’ ni cha kawaida na hakidokezi kwamba walikuja kwa kusudi la kumwona.
- source_word: וְעָמָד
  choice: alisimama
  rationale: 'Neno linarudia sababu ya kuondolewa kwa Amasa barabarani: kila aliyefika hapo alikoma kwenda na kusimama.'
