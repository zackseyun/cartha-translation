base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/019.yaml
  text: I am one of the peaceable and faithful in Israel. You are seeking to destroy a city[a], and a mother in Israel. Why would you swallow up the inheritance of Yahweh?
translation:
  language: sw
  text: Mimi ni mmoja wa wenye amani na waaminifu katika Israeli. Unatafuta kuuangamiza mji na mama katika Israeli[a]. Kwa nini umeze urithi wa Yahwe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mji ulio mama katika Israeli,” labda ikimaanisha mji mashuhuri au unaowatunza watu katika Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֻמֵי אֱמוּנֵי
  choice: mmoja wa watu wapendao amani na waaminifu
  rationale: Miundo hii ya wingi inamtambulisha msemaji kuwa sehemu ya kundi linalojulikana kwa kupenda amani na kwa uaminifu. Kiswahili hiki ni cha kawaida na kinahifadhi maana ya pamoja.
- source_word: מְבַקֵּשׁ לְהָמִית
  choice: unataka kuuangamiza
  rationale: Ingawa הֵמִית kwa kawaida ni ‘kuua,’ hapa kitu kinacholengwa ni mji; ‘kuuangamiza’ huonyesha kwa kawaida nia ya kuufanya mji uangamie bila kupunguza uzito wa kitendo.
- source_word: עִיר וְאֵם בְּיִשְׂרָאֵל
  choice: mji, na mama katika Israeli
  rationale: 'Tafsiri hii inahifadhi taswira na utata wa sintaksia ya Kiebrania: huenda mji na ‘mama’ vinaelezwa kama vitu viwili, au ‘mama katika Israeli’ ni maelezo ya mji huo.'
- source_word: תְבַלַּע
  choice: uumeze
  rationale: Kitenzi kinamaanisha kihalisi ‘kumeza’ na hapa ni taswira ya kuangamiza kabisa. Taswira hiyo yenye nguvu imehifadhiwa.
- source_word: נַחֲלַת יְהוָה
  choice: urithi wa Yahwe
  rationale: ‘Urithi’ huhifadhi dhana ya נַחֲלָה kwamba Israeli ni mali ya agano ya Yahwe, huku jina la Mungu likitafsiriwa moja kwa moja kama Yahwe.
theological_decisions:
- issue: Taswira ya ‘mama katika Israeli’
  choice: Kudumisha ‘mji, na mama katika Israeli’ katika matini kuu
  alternative: ‘mji ulio mama katika Israeli’ au ‘mji mkuu/mashuhuri katika Israeli’
  rationale: Kiebrania kinaweza kuwa cha kiambatano, kikimaanisha kwamba mji huo wenyewe ni ‘mama,’ lakini hakilazimishi ufafanuzi huo kwa uwazi. Matini kuu inadumisha mvutano huo, na tanbihi inaeleza uwezekano.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wapendao amani’ ni ya kawaida kuliko muundo mgumu wa kihalisi, huku ‘uumeze’ ikihifadhi taswira hai ya Kiebrania.
