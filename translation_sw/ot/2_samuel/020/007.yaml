lexical_decisions:
- source_word: וַיֵּצְאוּ ... אַחֲרָיו
  choice: wakaondoka wakimfuata
  rationale: Muundo huu unaonyesha kwamba waliondoka wakifuata mtu aliyetajwa katika muktadha, bila kutaja wazi mtu huyo na hivyo bila kuondoa utata uliopo katika Kiebrania.
- source_word: אַנְשֵׁי יוֹאָב
  choice: Watu wa Yoabu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaomaanisha watu waliokuwa chini ya Yoabu.
- source_word: הַכְּרֵתִי
  choice: Wakerethi
  rationale: Jina la kundi limeandikwa kwa kunukuu sauti za Kiebrania, badala ya kulipa tafsiri ya kubahatisha.
- source_word: הַפְּלֵתִי
  choice: Wapelethi
  rationale: Jina hili la kundi, ambalo kwa kawaida huambatana na Wakerethi, limehifadhiwa kwa kunukuu sauti zake.
- source_word: כָל הַגִּבֹּרִים
  choice: mashujaa wote
  rationale: Katika muktadha huu neno linaonyesha watu mashujaa wa vita; “mashujaa” ni la asili na linaloeleweka katika Kiswahili cha sasa.
- source_word: מִירוּשָׁלִַם
  choice: Yerusalemu
  rationale: Kiambishi cha kitenzi “wakatoka” kinaonyesha kwa kawaida mahali walikotoka, yaani Yerusalemu.
- source_word: לִרְדֹּף אַחֲרֵי
  choice: ili kumwandama
  rationale: “Kumwandama” linaonyesha kumfuatilia mtu kwa nia ya kumkamata na hivyo linawasilisha nguvu ya kitenzi רדף kuliko “kumfuata” peke yake.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Sheba mwana wa Bikri
  rationale: Muundo wa nasaba wa Kiebrania umehifadhiwa kwa Kiswahili cha kawaida.
