  text: Joab’s men[a], the Kerethites, the Pelethites, and all the mighty men went out after him. They went out from Jerusalem to pursue Sheba son of Bichri.
translation:
  language: sw
  text: Watu wa Yoabu, Wakereti[a], Wapelethi na mashujaa wote wakatoka wakimfuata. Wakatoka Yerusalemu ili kumwandama Sheba mwana wa Bikri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili la kundi pia huandikwa “Wakerethi.”
