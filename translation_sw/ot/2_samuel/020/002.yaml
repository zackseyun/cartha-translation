base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/002.yaml
  text: So every man of Israel went up from following David to follow Sheba son of Bichri[a], but the men of Judah held fast to their king[b], from the Jordan to Jerusalem.
translation:
  language: sw
  text: Basi kila mtu wa Israeli[a] akapanda, akiacha kumfuata Daudi na kumfuata Sheba mwana wa Bikri[b]; lakini watu wa Yuda wakashikamana na mfalme wao, tangu Yordani mpaka Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wote wa Israeli.” Kiebrania ni kihalisi “kila mtu wa Israeli,” usemi wa umoja wenye maana ya kijumla.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “akapanda.” Kitenzi hiki kwa kawaida humaanisha “kupanda” au “kwenda juu”; katika muktadha huu pia kinaambatana na kuacha kumfuata Daudi na kumfuata Sheba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: akaacha kumfuata ... akaenda
  rationale: Kitenzi עָלָה kwa msingi humaanisha ‘kupanda’ au ‘kwenda juu,’ lakini hapa muundo ‘kutoka nyuma ya Daudi, kwenda nyuma ya Sheba’ unaonyesha kuondoka na kuhamisha utii. Kiswahili ‘akaacha kumfuata ... akaenda kumfuata’ huwasilisha maana hiyo kwa kawaida bila kudai mwelekeo wa kijiografia usio wazi.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: kila mtu wa Israeli
  rationale: Hili linafuata umbo la Kiebrania la umoja lenye maana ya kijumla na kuhifadhi nguvu ya ‘kila’ kuliko kuligeuza tu kuwa ‘Waisraeli wote.’
- source_word: מֵאַחֲרֵי דָוִד ... אַחֲרֵי שֶׁבַע
  choice: akaacha kumfuata Daudi, akaenda kumfuata Sheba
  rationale: Kurudiwa kwa אַחֲרֵי kunaonyesha kuacha kumfuata Daudi na kuanza kumfuata Sheba, yaani kuhamisha utii. Tafsiri hii ni ya kawaida katika Kiswahili na huhifadhi ulinganifu wa vifungu hivyo viwili.
- source_word: וְאִישׁ יְהוּדָה
  choice: lakini watu wa Yuda
  rationale: Neno la umoja אִישׁ limetumiwa kwa maana ya kijumla. Wingi ‘watu wa Yuda’ ni wa kawaida katika Kiswahili, na ‘lakini’ huonyesha tofauti iliyo wazi kati ya Israeli na Yuda.
- source_word: דָּבְקוּ בְמַלְכָּם
  choice: wakashikamana na mfalme wao
  rationale: ‘Kushikamana na’ huhifadhi picha halisi ya דבק ya kung’ang’ania au kushikamana, pamoja na maana ya kudumu katika utii kwa mfalme.
- source_word: מִן הַיַּרְדֵּן וְעַד יְרוּשָׁלִָם
  choice: tangu Yordani mpaka Yerusalemu
  rationale: Huhifadhi mipaka miwili ya mwendo uliotajwa katika Kiebrania bila kuongeza mkazo usiokuwamo wazi katika matini.
theological_decisions:
- issue: Uhamisho wa utii kutoka kwa Daudi kwenda kwa Sheba
  choice: akaacha kumfuata Daudi, akaenda kumfuata Sheba
  alternative: akapanda kutoka nyuma ya Daudi, nyuma ya Sheba
  rationale: Tafsiri iliyochaguliwa inaweka wazi uhusiano wa ‘kumfuata’ unaorudiwa katika Kiebrania bila kuongeza maelezo ya kidhehebu au kuhukumu uhalali wa madai ya kila upande.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida. Muundo wa masimulizi wenye viambishi vya ‘ka-’ unafaa kwa mfululizo wa matendo. ‘Wakashikamana’ huhifadhi sitiari ya Kiebrania badala ya kuibadili moja kwa moja kuwa ‘wakabaki waaminifu.’
