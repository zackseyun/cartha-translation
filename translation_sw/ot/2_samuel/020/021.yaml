base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/021.yaml
  text: That is not the matter[a]. Rather, a man from the hill country of Ephraim, Sheba son of Bichri by name, has raised his hand against the king, against David. Hand him over alone, and I will withdraw from the city.” And the woman said to Joab, “Look[b], his head will be thrown to you over the wall.”
translation:
  language: sw
  text: “Sivyo ilivyo. Badala yake, kuna mtu kutoka eneo la milima la Efraimu[b], jina lake Sheba mwana wa Bikri. Ameinua mkono wake[a] dhidi ya mfalme, dhidi ya Daudi. Mtoeni huyo mtu peke yake, nami nitaondoka mbali na mji.” Mwanamke akamwambia Yoabu, “Tazama, kichwa chake kitatupwa kwako kutoka ukutani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kueleza maana ya nahau, “amemwasi mfalme, yaani Daudi.” Kiebrania kinasema kihalisi, “ameinua mkono wake.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kutoka mlima wa Efraimu”; kwa mapokeo pia hutafsiriwa “kutoka Mlima Efraimu.” Hapa inaeleweka kuwa eneo la milima la Efraimu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן הַדָּבָר
  choice: Mambo sivyo yalivyo
  rationale: Ni kanusho la dhana iliyotangulia, lililotafsiriwa kwa Kiswahili cha kawaida bila kufuata mpangilio wa Kiebrania kimitambo.
- source_word: כִּי
  choice: Badala yake
  rationale: Hapa neno linaanzisha maelezo yanayosahihisha dhana iliyokanushwa.
- source_word: מֵהַר אֶפְרַיִם
  choice: kutoka eneo la milima la Efraimu
  rationale: Kirai hiki kwa kawaida kinamaanisha eneo la vilima au milima la Efraimu, si lazima mlima mmoja.
- source_word: שֶׁבַע בֶּן בִּכְרִי שְׁמוֹ
  choice: jina lake Sheba mwana wa Bikri
  rationale: Huhifadhi kauli ya Kiebrania ya kumtaja mtu huku ikisomeka kwa urahisi katika Kiswahili.
- source_word: נָשָׂא יָדוֹ
  choice: ameinua mkono wake
  rationale: Taswira halisi ya nahau ya Kiebrania imehifadhiwa; katika muktadha inaashiria uasi au upinzani wa kimabavu.
- source_word: בַּמֶּלֶךְ בְּדָוִד
  choice: dhidi ya mfalme, dhidi ya Daudi
  rationale: Kurudiwa kwa kihusishi kumehifadhiwa ili kuonyesha msisitizo na ulinganifu wa Kiebrania.
- source_word: תְּנוּ אֹתוֹ לְבַדּוֹ
  choice: Mkabidhini yeye peke yake
  rationale: Amri ya wingi inadai mtu huyo mmoja tu akabidhiwe, si wakazi wengine wa mji.
- source_word: וְאֵלְכָה מֵעַל הָעִיר
  choice: nami nitauondokea mji
  rationale: Katika muktadha wa kuzingira, kauli inamaanisha Joabu ataondoka karibu na mji na kuacha kuushambulia.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linatanguliza hakikisho lenye msisitizo kwa lugha yenye hadhi lakini inayoeleweka.
- source_word: רֹאשׁוֹ מֻשְׁלָךְ אֵלֶיךָ בְּעַד הַחוֹמָה
  choice: kichwa chake kitatupwa kwako juu ya ukuta
  rationale: Kauli tendwa pamoja na הִנֵּה inaeleweka kama jambo litakalotokea mara moja; 'juu ya ukuta' inafaa mwelekeo wa tendo katika muktadha.
