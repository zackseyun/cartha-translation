base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/006.yaml
  text: Then David said to Abishai[a], “Now Sheba son of Bichri will do us more harm than Absalom. You, take your lord’s servants and pursue after him, lest he find fortified cities for himself and escape from our sight.”
translation:
  language: sw
  text: Ndipo Daudi akamwambia Abishai, “Sasa Sheba mwana wa Bikri atatuletea madhara zaidi kuliko Absalomu. Wewe, chukua watumishi wa bwana wako, umfuatilie, asije akajipatia miji yenye ngome na kutoweka machoni petu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina usemi wenye maana ya moja kwa moja, “na kuyaokoa macho yetu,” yaani kujinasua kutoka mbele ya macho yetu; maana yake ni “kutoweka machoni petu” au “kututoroka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרַע לָנוּ
  choice: atatuletea madhara zaidi
  rationale: Katika muktadha huu kitenzi רעע kinaeleza kusababisha madhara au taabu, si uovu wa kimaadili kwa ujumla. Usemi huu pia unahifadhi ulinganisho unaofuata.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Sheba mwana wa Bikri
  rationale: Majina yamenukuliwa kwa namna inayofaa Kiswahili sanifu na desturi za majina ya Biblia.
- source_word: מִן אַבְשָׁלוֹם
  choice: kuliko Absalomu
  rationale: Kihusishi מִן kina kazi ya ulinganisho hapa; “kuliko” ni tafsiri ya kawaida na wazi.
- source_word: אַתָּה קַח
  choice: Wewe, wachukue
  rationale: Kiwakilishi huru אַתָּה kinasisitiza kwamba Abishai ndiye anayepewa agizo; “Wewe” kinahifadhi msisitizo huo.
- source_word: עַבְדֵי אֲדֹנֶיךָ
  choice: watumishi wa bwana wako
  rationale: Hurejelea watu walio chini ya mamlaka ya bwana wa Abishai, yaani Daudi. “Watumishi” huhifadhi lugha ya mamlaka bila kulazimisha maana ya utumwa.
- source_word: וּרְדֹף אַחֲרָיו
  choice: umfuatilie
  rationale: רדף katika muktadha wa kijeshi ni kumwandama au kumfuatilia mtu kwa nia ya kumkamata; “umfuatilie” ni ya asili na inaeleweka.
- source_word: פֶּן
  choice: asije
  rationale: פֶּן huanzisha jambo linalohofiwa na linalopaswa kuzuiwa. Muundo wa “asije” unatoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: מָצָא לוֹ עָרִים בְּצֻרוֹת
  choice: akajipatia miji yenye ngome
  rationale: מָצָא ni kupata, na לוֹ inaonyesha manufaa yake mwenyewe. “Akajipatia” huwasilisha maana hiyo bila kuongeza wazi wazo la kujificha ambalo halijasemwa moja kwa moja.
- source_word: וְהִצִּיל עֵינֵינוּ
  choice: na kutoweka machoni petu
  rationale: Huu ni usemi wa Kiebrania ambao maana yake katika muktadha ni kuponyoka wasimwone au wasimkamate. Kiswahili “kutoweka machoni petu” kinahifadhi taswira ya macho huku kikitoa maana ya asili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa simulizi, na unaoeleweka kwa wasomaji wa kawaida. Msisitizo wa “Wewe” umehifadhiwa, na usemi wa macho umeendelezwa katika maandishi pamoja na kufafanuliwa katika tanbihi.
