  text: And Ira the Jairite also was priest to David[a].
translation:
  language: sw
  text: Naye Ira, Myairi, alikuwa kuhani wa Daudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waziri mkuu” au “mshauri wa kifalme.” Neno la Kiebrania linamaanisha kihalisi “kuhani,” lakini katika baadhi ya miktadha ya kifalme huenda likamaanisha afisa mkuu wa ikulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Naye
  rationale: Katika Kiswahili, “naye” huunganisha taarifa hii na orodha iliyotangulia huku ikihifadhi maana ya nyongeza ya “pia,” bila kuwa nzito kama “na pia.”
- source_word: עִירָא
  choice: Ira
  rationale: Jina la mtu limetoholewa kwa kufuata umbo lake la kawaida katika Kiswahili.
- source_word: הַיָּאִרִי
  choice: Mjairi
  rationale: Umbo la Kiebrania ni kivumishi cha nasaba au ukoo kinachomhusianisha Ira na Yairi; “Mjairi” ni tafsiri fupi na ya kawaida kwa mtindo wa majina ya watu au koo katika Kiswahili.
- source_word: הָיָה
  choice: alikuwa
  rationale: Kitenzi hiki ni kauli rahisi ya wakati uliopita katika orodha ya maofisa, si lazima kiwe na maana ya “akawa.”
- source_word: כֹהֵן
  choice: kuhani
  rationale: Maana ya msingi ya neno la Kiebrania ni “kuhani.” Maana inayowezekana ya ofisa mkuu wa kifalme imehifadhiwa katika tanbihi badala ya kuondoa utata katika matini kuu.
- source_word: לְדָוִד
  choice: wa Daudi
  rationale: Katika Kiswahili, “kuhani wa Daudi” huonyesha uhusiano au huduma kwa Daudi kwa njia ya kawaida, huku aina kamili ya wadhifa huo ikibaki wazi.
theological_decisions:
- issue: Maana ya כֹּהֵן katika mazingira ya ikulu
  choice: Kuhifadhi “kuhani” katika matini kuu
  alternative: waziri mkuu; mshauri wa kifalme
  rationale: Ingawa katika baadhi ya mazingira ya kifalme neno hili linaweza kumaanisha ofisa mkuu wa ikulu, maana yake ya kawaida ni “kuhani.” Tafsiri kuu haitatui kimya kimya mvutano huo; uwezekano wa maana ya kiutawala umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa urahisi. “Naye” hutoa mwendelezo wa asili katika orodha; “Mjairi” ni umbo fupi la nasaba/ukoo. Alama ya tanbihi [a] imewekwa katika matini kuu.
