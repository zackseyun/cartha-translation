translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa heshima na wa kisasa. Maelezo ya jeraha yamehifadhiwa kwa uwazi unaolingana na Kiebrania bila kutumia lugha ya mtaani. Alama ya tanbihi imewekwa baada ya ‘tumboni,’ neno ambalo tanbihi inalifafanua.
