  text: וַ/עֲמָשָׂ֨א לֹֽא נִשְׁמַ֜ר בַּ/חֶ֣רֶב אֲשֶׁ֣ר בְּ/יַד יוֹאָ֗ב וַ/יַּכֵּ/הוּ֩ בָ֨/הּ אֶל הַ/חֹ֜מֶשׁ וַ/יִּשְׁפֹּ֨ךְ מֵעָ֥י/ו אַ֛רְצָ/ה וְ/לֹא שָׁ֥נָה ל֖/וֹ וַ/יָּמֹ֑ת וְ/יוֹאָב֙ וַ/אֲבִישַׁ֣י אָחִ֔י/ו רָדַ֕ף אַחֲרֵ֖י שֶׁ֥בַע בֶּן בִּכְרִֽי־׀־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/010.yaml
  text: But Amasa was not on guard against the sword that was in Joab’s hand[a], and he struck him with it in the belly, and his entrails spilled out to the ground; he did not strike him again, and he died. Then Joab and Abishai his brother pursued Sheba son of Bichri.
translation:
  language: sw
  text: Lakini Amasa hakujihadhari na upanga uliokuwa mkononi mwa Yoabu. Yoabu akampiga nao tumboni[a], na matumbo yake yakamwagika ardhini. Hakumpiga tena, naye akafa. Kisha Yoabu na Abishai ndugu yake wakamfuatia Sheba mwana wa Bikri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye ubavu wa tano.” Tafsiri za zamani zimetafsiri usemi huu wa Kiebrania hivyo, lakini katika muktadha huu huenda neno hilo linamaanisha tumbo kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמַר
  choice: hakujihadhari
  rationale: Nifali ya שׁמר hapa inaonyesha kwamba Amasa hakuwa macho wala hakuchukua tahadhari dhidi ya silaha ya Yoabu. ‘Hakujihadhari’ ni Kiswahili cha kawaida kinachobeba maana hiyo bila kudokeza kwamba mtu mwingine alipaswa kumlinda.
- source_word: חֶרֶב
  choice: upanga
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa silaha inayotajwa na חֶרֶב katika muktadha huu.
- source_word: בְּיַד יוֹאָב
  choice: mkono­ni mwa Yoabu
  rationale: Kirai hiki ni cha mahali na kinaeleza wazi kwamba Yoabu alikuwa ameushika upanga.
- source_word: וַיַּכֵּהוּ בָהּ
  choice: akampiga nao
  rationale: Kitenzi נכה kina maana pana ya kupiga. ‘Akampiga nao’ huhifadhi upana huo huku kiwakilishi ‘nao’ kikirejelea upanga bila kulazimisha tafsiri mahsusi zaidi kama ‘alimchoma.’
- source_word: אֶל הַחֹמֶשׁ
  choice: tumboni
  rationale: Katika simulizi hizi za mapigano, חֹמֶשׁ inaelekea kutaja eneo la tumbo. ‘Tumboni’ ni la kawaida na linaloeleweka kwa urahisi; tafsiri ya jadi ‘kwenye ubavu wa tano’ imewekwa katika tanbihi kama uwezekano wa kihistoria.
- source_word: וַיִּשְׁפֹּךְ מֵעָיו אַרְצָה
  choice: matumbo yake yakamwagika ardhini
  rationale: Kauli hii inadumisha picha kali ya viungo vya ndani kumwagika na inaakisi mwelekeo wa אַרְצָה, ‘ardhini.’ ‘Matumbo’ ni wazi na ya kawaida bila kuwa ya mtaani.
- source_word: וְלֹא שָׁנָה לוֹ
  choice: Hakumpiga tena
  rationale: Kiebrania kinasema kwa kifupi kwamba hakurudia tendo hilo kwake. Kiswahili kinataja tendo lililodokezwa—kupiga—ili maana iwe wazi na ya asili.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Huhifadhi mfuatano rahisi wa simulizi na kuonyesha matokeo ya pigo hilo.
- source_word: רָדַף אַחֲרֵי
  choice: wakamfuatia
  rationale: Ni usemi wa kawaida wa kufuatilia mtu katika harakati za kijeshi na unafaa sajili ya simulizi.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Sheba mwana wa Bikri
  rationale: Majina yamenukuliwa kwa maumbo yanayoeleweka katika Kiswahili, huku uhusiano wa kifamilia wa בֶּן ukitafsiriwa ‘mwana wa.’
