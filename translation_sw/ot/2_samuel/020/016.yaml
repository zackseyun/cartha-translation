  yaml_path: translation/ot/2_samuel/020/016.yaml
  text: Then a wise woman called out from the city, “Listen! Listen! Please tell Joab, ‘Come near to here, so that I may speak with you.’”
translation:
  language: sw
  text: Ndipo mwanamke mmoja mwenye hekima akaita kutoka mjini, “Sikilizeni! Sikilizeni! Tafadhali mwambieni Yoabu, ‘Karibia hapa ili nizungumze nawe.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה חֲכָמָה
  choice: mwanamke mmoja mwenye hekima
  rationale: Huwasilisha maana ya moja kwa moja ya ‘mwanamke mwenye hekima’; ‘mmoja’ ni ya asili katika masimulizi ya Kiswahili na haibadili utambulisho wake.
- source_word: מִן־הָעִיר
  choice: kutoka mjini
  rationale: Kirai hiki kinaonyesha kwamba sauti yake ilitoka ndani ya mji.
- source_word: שִׁמְעוּ שִׁמְעוּ
  choice: Sikilizeni! Sikilizeni!
  rationale: Umbo la wingi la amri na urudiaji wake vimehifadhiwa, pamoja na msisitizo wa mwito.
- source_word: אִמְרוּ־נָא אֶל־יוֹאָב
  choice: Tafadhali mwambieni Yoabu
  rationale: ‘Tafadhali’ huonyesha chembe ya ombi נָא, na ‘mwambieni’ ni usemi wa kawaida wa Kiswahili kwa kuwaambia watu wafikishe ujumbe kwa Yoabu.
- source_word: קְרַב עַד־הֵנָּה
  choice: Karibia hapa
  rationale: Hutoa mwaliko wa Yoabu kusogea hadi mahali alipo mwanamke bila Kiswahili kisicho cha asili cha kutafsiri kila kipashio kimoja-kimoja.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: ili nizungumze nawe
  rationale: Huhifadhi kusudi la kusogea kwake na usemi wa moja kwa moja kwa Yoabu.
