  text: וְ/שָׁ֨ם נִקְרָ֜א אִ֣ישׁ בְּלִיַּ֗עַל וּ/שְׁמ֛/וֹ שֶׁ֥בַע בֶּן בִּכְרִ֖י אִ֣ישׁ יְמִינִ֑י וַ/יִּתְקַ֣ע בַּ/שֹּׁפָ֗ר וַ֠/יֹּאמֶר אֵֽין לָ֨/נוּ חֵ֜לֶק בְּ/דָוִ֗ד וְ/לֹ֤א נַֽחֲלָה לָ֨/נוּ֙ בְּ/בֶן יִשַׁ֔י אִ֥ישׁ לְ/אֹהָלָ֖י/ו יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/001.yaml
  text: There happened to be there a worthless man[a], whose name was Sheba son of Bichri, a Benjaminite. He blew the trumpet and said, “We have no share in David, and no inheritance in the son of Jesse. Every man to his tents[d][c][b], O Israel!”
translation:
  language: sw
  text: Huko alikuwako mtu asiyefaa kitu[a], jina lake lilikuwa Sheba mwana wa Bikri, mtu wa kabila la Benyamini. Akapiga baragumu[b] na kusema, “Sisi hatuna sehemu katika Daudi[c], wala hatuna urithi katika mwana wa Yese. Kila mtu aende kwenye hema zake[d], enyi Israeli!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu mwovu,” “mtu asiye na adili,” au kwa tafsiri ya neno kwa neno, “mtu wa Beliali.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: shofari, yaani pembe iliyopigwa ili kutoa ishara kwa watu; kwa kawaida ilieleweka kuwa pembe ya kondoo dume.'
    reason: cultural_note
  - marker: c
    text: Au, “Sisi hatuna fungu katika Daudi.”
    reason: lexical_alternative
  - marker: d
    text: Kiebrania kinasema, “Kila mtu kwenye hema zake.” Hii ni nahau inayomaanisha kwamba kila mmoja aondoke na kurudi nyumbani au kambini kwake.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְרָא
  choice: alikuwako
  rationale: Katika muundo huu wa simulizi pamoja na שָׁם, kitenzi kina maana ya kuwepo au kupatikana mahali, si ya kuitwa jina. ‘Huko alikuwako’ ni Kiswahili cha kawaida na hakiongezi kiashirio cha wakati kisichomo katika Kiebrania.
- source_word: אִישׁ בְּלִיַּעַל
  choice: mtu mwovu
  rationale: בְּלִיַּעַל hapa inaeleza tabia ya mtu asiye na adili au mwovu, wala si lazima iwe jina maalumu. ‘Mtu mwovu’ ni wazi na yenye heshima katika Kiswahili cha sasa.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Sheba mwana wa Bikri
  rationale: Majina yametoholewa kwa namna inayotambulika katika mapokeo ya Biblia ya Kiswahili; בֶּן imewasilishwa kwa ‘mwana wa.’
- source_word: אִישׁ יְמִינִי
  choice: mtu wa kabila la Benyamini
  rationale: Kirai hiki kinataja uhusiano wa kikabila. Ufafanuzi huu ni wa kawaida na unaeleweka kuliko kuunda jina la kikabila lisilozoeleka.
- source_word: וַיִּתְקַע בַּשֹּׁפָר
  choice: akapiga baragumu
  rationale: ‘Baragumu’ ni neno la kawaida la kibiblia kwa chombo cha kutoa ishara; tanbihi inahifadhi kwamba שׁוֹפָר ni pembe.
- source_word: אֵין לָנוּ חֵלֶק בְּדָוִד
  choice: Sisi hatuna sehemu katika Daudi
  rationale: חֵלֶק ni sehemu au fungu. ‘Sehemu katika Daudi’ huhifadhi sitiari ya kisiasa badala ya kuifafanua kuwa utawala wake.
- source_word: וְלֹא נַחֲלָה לָנוּ בְּבֶן יִשַׁי
  choice: wala hatuna urithi katika mwana wa Yese
  rationale: ‘Urithi’ huhifadhi maana ya msingi ya נַחֲלָה na mwangwi wake wa fungu au milki, huku madai ya kisiasa yakibaki ya kisitiari.
- source_word: בְּבֶן יִשַׁי
  choice: katika mwana wa Yese
  rationale: Kumtaja Daudi kwa nasaba badala ya cheo chake huhifadhi sauti ya dharau iliyomo katika kauli.
- source_word: אִישׁ לְאֹהָלָיו
  choice: Kila mtu aende kwenye hema zake
  rationale: Kirai ni nahau gaw distributivu yenye maana kwamba kila mmoja arudi nyumbani au kambini kwake. Tafsiri inahifadhi picha ya mahema na nguvu ya mwito.
- source_word: יִשְׂרָאֵל
  choice: enyi Israeli
  rationale: Ni mwito wa moja kwa moja kwa Israeli. ‘Enyi Israeli’ huonyesha wazi nguvu ya vokativu kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Iwapo בְּלִיַּעַל litafsiriwe kama jina maalumu ‘Beliali’ au kama maelezo ya tabia
  choice: 'maelezo ya tabia: ‘mtu mwovu’'
  alternative: ‘mtu wa Beliali’ au ‘mtu asiyefaa kitu’
  rationale: Katika muktadha huu neno linamtambulisha Sheba kuwa mtu mbaya au asiye na adili; halilazimishi dhana ya baadaye ya Beliali kama kiumbe cha kiroho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kauli ya uasi umewekwa mfupi na wenye nguvu; taswira za ‘sehemu,’ ‘urithi,’ na ‘hema’ zimehifadhiwa bila kuzifafanua kupita kiasi.
