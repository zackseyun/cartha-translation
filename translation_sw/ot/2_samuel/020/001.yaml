    issue: '''aliyeitwa Sheba'' is less direct than the source''s naming clause.'
    rationale: וּשְׁמוֹ שֶׁבַע literally introduces his name ('and his name was Sheba'). 'Jina lake lilikuwa Sheba' follows this wording naturally in Standard East African Swahili.
