    issue: The rendering 'mtu mwovu' is narrower than אִישׁ בְּלִיַּעַל.
    rationale: The Hebrew term denotes a worthless, base, or lawless person. Although wickedness may be included in context, 'mwovu' foregrounds one possible moral sense and does not retain the primary characterization as closely as 'mtu asiyefaa kitu.'
