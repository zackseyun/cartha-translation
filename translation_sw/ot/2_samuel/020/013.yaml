base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/013.yaml
  text: As soon as he had been removed from the highway[a], every man passed on after Joab to pursue Sheba son of Bichri.
translation:
  language: sw
  text: Mara tu alipoondolewa kutoka katika barabara kuu[a], wanaume wote wakapita wakimfuata Yoabu ili kumfuatilia Sheba mwana wa Bikri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “barabara.” Neno la Kiebrania מְסִלָּה linaweza kumaanisha barabara kuu au njia kuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Mara tu
  rationale: Kishazi hiki kinaonyesha wakati; “Mara tu” kinawasilisha vizuri mfuatano wa haraka unaodokezwa na simulizi.
- source_word: הֹגָה
  choice: alipoondolewa
  rationale: Umbo la Hofali linaonyesha kwamba alisababishwa kuondolewa. Kiima kinamrejelea Amasa, yaani mwili wake, kutokana na muktadha wa mstari uliotangulia.
- source_word: מִן הַמְסִלָּה
  choice: kutoka katika barabara kuu
  rationale: מְסִלָּה inaweza kumaanisha njia iliyoinuliwa au barabara kuu; hapa ni barabara ambayo mwili ulikuwa unazuia wapiganaji.
- source_word: עָבַר
  choice: wakapita
  rationale: Kitenzi kinaonyesha kwamba askari waliendelea na mwendo baada ya kizuizi kuondolewa; muktadha wa kumfuata Yoabu unazuia maana ya kupita tu kando.
- source_word: כָּל אִישׁ
  choice: wanaume wote
  rationale: Usemi wa Kiebrania ni wa umoja wenye maana ya ujumla, “kila mwanamume,” na unarejelea kikosi cha wapiganaji.
- source_word: אַחֲרֵי יוֹאָב
  choice: wakimfuata Yoabu
  rationale: Kirai kinaonyesha mwendo nyuma ya Yoabu kama kiongozi wao; “wakimfuata” ni Kiswahili cha kawaida na wazi.
- source_word: לִרְדֹּף
  choice: ili wamfuatie
  rationale: Kitenzi-jina kinaonyesha kusudi la mwendo wao, yaani kwenda katika harakati za kumkamata adui anayekimbia.
- source_word: אַחֲרֵי שֶׁבַע בֶּן בִּכְרִי
  choice: Sheba mwana wa Bikri
  rationale: Huhifadhi muundo wa jina la Kiebrania na kutaja nasaba moja kwa moja.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. “Mara tu” na mfululizo wa vitenzi huhifadhi kasi ya simulizi, huku tanbihi ikihifadhi upana wa maana ya מְסִלָּה.
