revisions:
- from: Mara tu alipoondolewa kutoka katika barabara kuu[a], wanaume wote wakapita wakimfuata Yoabu ili wamfuatie Sheba mwana wa Bikri.
  to: Mara tu alipoondolewa kutoka katika barabara kuu[a], wanaume wote wakapita wakimfuata Yoabu ili kumfuatilia Sheba mwana wa Bikri.
  rationale: 'The revision changes only the purpose expression for pursuit: “ili kumfuatilia Sheba” is more natural and more clearly expresses the force of לִרְדֹּף than the potentially ambiguous “ili wamfuatie Sheba,” while avoiding unnecessary repetition with their following of Joab. The footnote anchor and content remain valid.'
