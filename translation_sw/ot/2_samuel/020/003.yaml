  text: וַ/יָּבֹ֨א דָוִ֣ד אֶל בֵּית/וֹ֮ יְרֽוּשָׁלִַם֒ וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֵ֣ת עֶֽשֶׂר נָשִׁ֣ים פִּלַגְשִׁ֡ים אֲשֶׁ֣ר הִנִּיחַ֩ לִ/שְׁמֹ֨ר הַ/בַּ֜יִת וַֽ/יִּתְּנֵ֤/ם בֵּית מִשְׁמֶ֨רֶת֙ וַֽ/יְכַלְכְּלֵ֔/ם וַ/אֲלֵי/הֶ֖ם לֹא בָ֑א וַ/תִּהְיֶ֧ינָה צְרֻר֛וֹת עַד י֥וֹם מֻתָ֖/ן אַלְמְנ֥וּת חַיּֽוּת־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/003.yaml
  text: When David came to his house at Jerusalem[a], the king took the ten women, the concubines whom he had left to keep the house, and put them in guarded custody and provided for them, but he did not go in to them. So they were kept confined until the day of their death[c][b], living as widows.
translation:
  language: sw
  text: Daudi alipofika nyumbani kwake Yerusalemu, mfalme akawachukua wale wanawake kumi, yaani masuria wake aliokuwa amewaacha waitunze nyumba. Akawaweka katika nyumba ya kifungo[a] na kuwapatia mahitaji yao, lakini hakuingia kwao[b]. Basi wakabaki wamefungiwa humo mpaka siku ya kifo chao, wakiishi kama wajane[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali pa kizuizi.” Kiebrania ni halisi “nyumba ya ulinzi/kizuizi.”
    reason: lexical_alternative
  - marker: b
    text: “Hakuingia kwao” ni nahau ya Kiebrania inayomaanisha kwamba hakufanya nao tendo la ndoa.
    reason: cultural_note
  - marker: c
    text: Kiebrania ni halisi “ujane wa uhai”—yaani, waliishi kama wajane ingawa Daudi alikuwa bado hai.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: nyumbani kwake
  rationale: בַּיִת inaweza kumaanisha nyumba, jumba la kifalme, au kaya. Hapa ni makao ya Daudi huko Yerusalemu; “nyumbani kwake” ni ya asili katika Kiswahili bila kuongeza tafsiri ya “ikulu” isiyolazimishwa na neno lenyewe.
- source_word: פִּלַגְשִׁים
  choice: masuria wake
  rationale: Neno hili linawataja wanawake waliokuwa na hadhi ya kindoa iliyotambuliwa lakini ya chini kuliko wake wakuu katika nyumba ya kifalme. “Masuria” ni istilahi fupi ya Kiswahili inayohifadhi tofauti hiyo ya kijamii na kisheria.
- source_word: הִנִּיחַ לִשְׁמֹר הַבַּיִת
  choice: aliokuwa amewaacha waitunze nyumba
  rationale: שׁמר hapa inaweza kuwa kulinda, kutunza, au kusimamia. “Waitunze nyumba” ni Kiswahili cha kawaida kinachobeba wazo la kuangalia na kuhifadhi makao bila kufinya maana iwe ulinzi wa kijeshi tu.
- source_word: בֵּית מִשְׁמֶרֶת
  choice: nyumba yenye ulinzi
  rationale: Kirai hiki ni halisi “nyumba ya ulinzi/kizuizi.” Tafsiri hii inahifadhi picha ya mahali halisi palipolindwa; sentensi inayofuata inaweka wazi kwamba wanawake hao walifungiwa humo.
- source_word: וַיְכַלְכְּלֵם
  choice: kuwapatia mahitaji yao
  rationale: Kitenzi humaanisha kutegemeza au kutoa mahitaji ya maisha. Kauli hii ni wazi na ya sasa katika Kiswahili, na inaonyesha kwamba Daudi aliendelea kuwahudumia kimwili.
- source_word: וַאֲלֵיהֶם לֹא בָא
  choice: hakuingia kwao
  rationale: Hii ni nahau ya Kiebrania inayodokeza mahusiano ya kingono. Tafsiri imehifadhi sitiari hiyo, huku tanbihi ikiifafanua ili msomaji wa leo asiikose maana.
- source_word: צְרֻרוֹת
  choice: wakaendelea kufungiwa humo
  rationale: Umbo la hali/tokeo la kitenzi linaonyesha hali endelevu ya kufungwa au kutengwa. “Wakaendelea kufungiwa humo” huhifadhi hali hiyo ya kudumu na huiunganisha na nyumba yenye ulinzi.
- source_word: עַד יוֹם מֻתָן
  choice: mpaka siku ya kufa kwao
  rationale: Hii inawasilisha moja kwa moja muundo wa Kiebrania “mpaka siku ya kifo chao” kwa Kiswahili cha kawaida.
- source_word: אַלְמְנוּת חַיּוּת
  choice: wakiishi kama wajane
  rationale: 'Kirai kisicho cha kawaida ni halisi “ujane wa uhai/kuwa hai.” Tafsiri hii inahifadhi mkanganyiko wenye kusudi: waliishi katika hali ya wajane ingawa Daudi alikuwa hai.'
theological_decisions:
- issue: Tathmini ya kimaadili na hali ya kijamii ya jinsi Daudi alivyowatendea masuria
  choice: Kusimulia kwa uwazi bila kutetea wala kulaani kwa maneno ambayo hayamo katika mstari
  alternative: Kueleza kifungo kama ulinzi wa hiari tu, au kuongeza hukumu ya kimaadili isiyotajwa wazi
  rationale: Mstari unasimulia kuwekwa kwao chini ya ulinzi, kupewa mahitaji, kunyimwa tena mahusiano ya kindoa, na kuishi kama wajane. Tafsiri inadumisha ukali na mvutano wa maelezo hayo bila kuyapunguza au kuyaongezea hukumu ya kimadhehebu.
- issue: Maana ya nahau וַאֲלֵיהֶם לֹא בָא
  choice: Kuhifadhi nahau “hakuingia kwao” na kuifafanua katika tanbihi
  alternative: Kutafsiri moja kwa moja “hakufanya nao tendo la ndoa”
  rationale: Kuhifadhi nahau kunatunza mtindo wa Kiebrania na uzito wake, huku tanbihi ikihakikisha kwamba maana ya kingono inaeleweka bila kuachwa katika utata usiokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Masuria” huhifadhi istilahi ya kihistoria; “wakaendelea kufungiwa” huonyesha hali yao ya kudumu bila kutumia lugha ya kisheria iliyo ngumu. Alama za tanbihi zimewekwa mara moja kila moja mahali zinapohusika.
