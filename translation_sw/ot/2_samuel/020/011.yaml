base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/011.yaml
  text: And one of Joab’s young men stood over him and said[a], “Whoever favors Joab, and whoever is for David[b], follow Joab!”
translation:
  language: sw
  text: Mmoja wa vijana[a] wa Yoabu akasimama kando yake, akasema, “Yeyote anayemuunga mkono Yoabu, na yeyote aliye upande wa Daudi, amfuate Yoabu!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vijana” pia inaweza kutafsiriwa “watumishi” au “wahudumu”; hapa ni watu waliokuwa chini ya mamlaka ya Yoabu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa maana halisi, “nyuma ya Yoabu.” Katika muktadha huu ni mwito wa kujikusanya nyuma yake, yaani, “amfuate Yoabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Mmoja
  rationale: Katika muktadha huu אִישׁ humtambulisha mtu mmoja asiyeainishwa kutoka miongoni mwa watu wa Yoabu; “mmoja” ni ya asili katika Kiswahili.
- source_word: עָמַד עָלָיו
  choice: akasimama kando yake
  rationale: עמד pamoja na על inaweza kumaanisha kusimama juu ya mtu au karibu naye. “Kando yake” linaonyesha kwamba mtu huyo alichukua nafasi karibu na Amasa aliyeanguka bila kudokeza kwamba alimkanyaga.
- source_word: מִנַּעֲרֵי יוֹאָב
  choice: wa vijana wa Yoabu
  rationale: נַעַר inaweza kumaanisha kijana, mtumishi, au mhudumu. “Vijana” linabaki karibu na umbo la Kiebrania, huku tanbihi ikionyesha maana nyingine zinazowezekana katika mazingira ya kijeshi.
- source_word: מִי אֲשֶׁר חָפֵץ בְּיוֹאָב
  choice: Yeyote anayemuunga mkono Yoabu
  rationale: חָפֵץ inaweza kueleza kupendezwa, kutaka, au kumpendelea mtu. Katika mwito huu wa kijeshi, “anِayemuunga mkono” huwasilisha uaminifu na kumuunga Yoabu bila maana isiyo ya kawaida ya ‘kufurahia’ mtu.
- source_word: וּמִי אֲשֶׁר לְדָוִד
  choice: na yeyote aliye upande wa Daudi
  rationale: Herufi לְ hapa inaonyesha kuwa wa upande wa Daudi au kuwa mwaminifu kwake. Usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: אַחֲרֵי יוֹאָב
  choice: amfuate Yoabu
  rationale: אַחֲרֵי maana yake ya msingi ni “nyuma ya,” lakini katika mwito wa kuchukua hatua humaanisha kumfuata kiongozi. Kiswahili kinahitaji kitenzi wazi ili mwito huo ueleweke kwa kawaida.
