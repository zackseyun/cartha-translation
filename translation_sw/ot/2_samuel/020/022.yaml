base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/022.yaml
  text: Then the woman went to all the people in her wisdom[a], and they cut off the head of Sheba son of Bichri and threw it to Joab. Then he blew the trumpet, and they dispersed from the city, each man to his tent; and Joab returned to Jerusalem to the king.
translation:
  language: sw
  text: Ndipo yule mwanamke akaenda kwa watu wote kwa hekima yake, nao wakakata kichwa cha Sheba mwana wa Bikri, wakakitupia Yoabu. Kisha Yoabu akapiga tarumbeta, nao wakatawanyika kutoka mjini, kila mtu hemani kwake[a]. Naye Yoabu akarudi Yerusalemu kwa mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kila mtu hemani kwake,” msemo wa kawaida unaomaanisha kutawanyika na kila mmoja kurudi mahali pake.'
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּבוֹא הָאִשָּׁה
  choice: yule mwanamke akaenda
  rationale: Kitenzi בוא kinaweza kumaanisha kuja au kwenda kulingana na mtazamo; hapa ‘akaenda’ kinaeleza kwa kawaida mwendo wake kuelekea kwa watu. ‘Yule mwanamke’ humrejelea mwanamke mwenye hekima aliyetajwa awali bila kuongeza kivumishi katika kirai hiki.
- source_word: אֶל כָּל הָעָם
  choice: kwa watu wote
  rationale: עָם ni neno pana; ‘watu wote’ halilazimishi maana ya wanajeshi wala wakazi wa mji pekee.
- source_word: בְּחָכְמָתָהּ
  choice: kwa hekima yake
  rationale: Muundo huu unahifadhi wazo la namna au njia aliyotumia, bila kuamua kupita kiasi ikiwa msisitizo ni ‘kwa hekima’ au ‘akitumia hekima yake.’
- source_word: וַיִּכְרְתוּ אֶת רֹאשׁ
  choice: wakakata kichwa
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kitendo cha kukiondoa kichwa.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Sheba mwana wa Bikri
  rationale: Inahifadhi jina na patronimu ya Kiebrania kwa mtindo wa kawaida wa Kiswahili.
- source_word: וַיַּשְׁלִכוּ אֶל יוֹאָב
  choice: wakakitupia Yoabu
  rationale: Kiambishi cha kitu ‘-ki-’ humrejelea kichwa, na ‘wakakitupia’ huonyesha mwelekeo wa kutupa kuelekea kwa Yoabu.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: Yoabu akapiga tarumbeta
  rationale: Mhusika wa umoja anayeeleweka katika muktadha ni Yoabu; kumtaja huondoa utata usio wa lazima katika Kiswahili. ‘Kupiga tarumbeta’ ni usemi wa kawaida unaolingana na kitendo cha kupuliza shofari.
- source_word: וַיָּפֻצוּ מֵעַל הָעִיר
  choice: wakatawanyika kutoka mjini
  rationale: Kitenzi kinaeleza kusambaratika au kutawanyika, na kirai kinaonyesha kuondoka kwao mahali walipokuwa dhidi ya mji. Tafsiri haiongezi waziwazi neno ‘mazingira ya kuuzingira,’ ingawa ndilo linaloeleweka katika muktadha.
- source_word: אִישׁ לְאֹהָלָיו
  choice: kila mtu akielekea hemani kwake
  rationale: Inahifadhi picha halisi ya kila mtu kurudi kwenye hema lake, huku tanbihi ikieleza matumizi yake ya kiutamaduni.
- source_word: וְיוֹאָב שָׁב יְרוּשָׁלִַם אֶל הַמֶּלֶךְ
  choice: Naye Yoabu akarudi Yerusalemu kwa mfalme
  rationale: Ni tafsiri ya moja kwa moja, ya asili, na inayohifadhi mwisho wa simulizi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya simulizi. Viunganishi vya mfululizo ‘aka-/waka-’ vinadumisha mwendo wa simulizi la Kiebrania. Alama ya tanbihi imewekwa baada ya msemo unaoelezwa, si baada ya ‘hekima yake.’
