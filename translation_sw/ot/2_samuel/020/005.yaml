translation:
  language: sw
  text: Basi Amasa akaenda kuwaita watu wa Yuda[a] wakusanyike, lakini akachelewa kupita muda aliomwekea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwakusanya watu wa Yuda.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwaita watu wakusanyike kwa haraka; katika muktadha huu huenda kinahusisha uhamasishaji wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Ni simulizi la tendo linalofuata; “akaenda” ni Kiswahili cha kawaida na cha asili katika mfuatano wa matukio.
- source_word: לְהַזְעִיק
  choice: kuwakusanya
  rationale: Hifili ya זעק hapa ina maana ya kuwaita watu wakutane kwa haraka. “Kuwakusanya” huwasilisha wito huo rasmi bila kulazimisha maana ya kijeshi, ingawa muktadha unahusu uhamasishaji wa jeshi.
- source_word: אֶת יְהוּדָה
  choice: watu wa Yuda
  rationale: “Yuda” limetumiwa kwa maana ya watu wake kwa ujumla. Kiswahili cha kawaida huhitaji “watu wa Yuda” ili maana hiyo ya pamoja iwe wazi.
- source_word: וייחר
  choice: akachelewa
  rationale: Katika muktadha huu, אחר humaanisha kutofika au kutokamilisha jambo ndani ya muda uliowekwa.
- source_word: מִן הַמּוֹעֵד
  choice: kupita muda
  rationale: מוֹעֵד ni muda maalumu uliowekwa; pamoja na מן, kifungu kinaonyesha kuvuka kikomo hicho.
- source_word: אֲשֶׁר יְעָדוֹ
  choice: aliokuwa amemwekea
  rationale: יעד humaanisha kuweka au kuainisha muda. Muundo huu unaonyesha kwamba muda uliwekwa kabla, huku kiima kisichotajwa wazi kikieleweka kutokana na muktadha uliotangulia.
