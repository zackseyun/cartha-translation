  source_fidelity: 'Tafsiri inahifadhi kwa usahihi mlolongo wa simulizi na vipengele muhimu vya Kiebrania: walimzingira Sheba (kiambishi cha kiume umoja), mahali panatajwa, tuta la kuzingiria linaelekezwa dhidi ya mji, tuta linahusishwa kwa usahihi na kitenzi cha kike, na kusudi la kubomoa ukuta linaelezwa. Kutotaja yambwa ya ‘wakibomoa’ kunadumisha kutobainika kwa yambwa katika מַשְׁחִיתִם bila kubadili maana.'
