source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ וַ/יָּצֻ֣רוּ עָלָ֗י/ו בְּ/אָבֵ֨לָ/ה֙ בֵּ֣ית הַֽמַּעֲכָ֔ה וַ/יִּשְׁפְּכ֤וּ סֹֽלְלָה֙ אֶל הָ/עִ֔יר וַֽ/תַּעֲמֹ֖ד בַּ/חֵ֑ל וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אֶת יוֹאָ֔ב מַשְׁחִיתִ֖ם לְ/הַפִּ֥יל הַ/חוֹמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/015.yaml
  text: They came and besieged him in Abel-beth-maacah[a], and they cast up a siege ramp against the city, and it stood against the rampart[c][b]; and all the people who were with Joab were destroying it to bring down the wall.
translation:
  language: sw
  text: Wakaja wakamzingira huko Abel-Beth-Maaka[a]. Wakajenga tuta la kuuzingira mji, nalo likasimama dhidi ya boma la nje[b]; nao watu wote waliokuwa pamoja na Yoabu walikuwa wakibomoa ili kuuangusha ukuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakauzingira mji huo”; Kiebrania kinasema “wakamzingira yeye,” huenda kikimlenga Sheba aliyekuwa ndani ya mji.
    reason: alternative_reading
  - marker: b
    text: Neno la Kiebrania linaweza kumaanisha ngome, boma, au kingo ya ulinzi ya nje.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Wakaja
  rationale: Kitenzi cha masimulizi kinaonyesha kuwasili kwa jeshi na kinaendeleza mtiririko wa simulizi kwa Kiswahili cha kawaida.
- source_word: וַיָּצֻרוּ עָלָיו
  choice: wakamzingira
  rationale: Kiambishi cha Kiebrania ni cha nafsi ya kiume umoja na kwa uwezekano mkubwa kinamlenga Sheba aliyekuwa ndani ya mji; tafsiri hii haiisawazishi kuwa 'wakauzingira mji'.
- source_word: בְּאָבֵלָה בֵּית הַמַּעֲכָה
  choice: huko Abel-Beth-Maaka
  rationale: Jina la mahali limetoholewa kwa namna inayoeleweka katika Kiswahili huku muundo wake ukihifadhiwa.
- source_word: וַיִּשְׁפְּכוּ סֹלְלָה
  choice: Wakajenga tuta la kuuzingira mji
  rationale: Kauli ya Kiebrania ya 'kumwaga/kurundika tuta' ni nahau ya kijeshi; 'kujenga tuta la kuuzingira mji' huwasilisha kazi na kusudi lake kwa lugha ya asili.
- source_word: וַתַּעֲמֹד בַּחֵל
  choice: nalo likasimama dhidi ya boma la nje
  rationale: Kitenzi cha kike kinarejelea tuta; חֵל huelekea kumaanisha ngome au kazi ya ulinzi ya nje. 'Boma la nje' ni wazi bila kulifanya sawa moja kwa moja na ukuta mkuu.
- source_word: וְכָל הָעָם אֲשֶׁר אֶת יוֹאָב
  choice: nao watu wote waliokuwa pamoja na Yoabu
  rationale: Kirai cha Kiebrania ni cha ushirika; hapa kinamaanisha vikosi vilivyokuwa pamoja na Yoabu, lakini 'watu wote' huhifadhi neno la chanzo.
- source_word: מַשְׁחִיתִם לְהַפִּיל הַחוֹמָה
  choice: walikuwa wakibomoa ili kuuangusha ukuta
  rationale: Umbo la kushiriki linaonyesha tendo linaloendelea. Kitenzi hakina yambwa lililotajwa wazi, kwa hiyo 'wakibomoa' huhifadhi kiasi cha kutokubainika huku kusudi la kuuangusha ukuta likiwekwa wazi.
