  text: Then the king said to Amasa[a], “Call the men of Judah together for me within three days, and you, remain here.”
translation:
  language: sw
  text: Ndipo mfalme akamwambia Amasa, “Waitishe kwa ajili yangu watu wa Yuda[a] ndani ya siku tatu, nawe ubaki hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinatumia usemi wa kijumla wenye umbo la kiume. Huenda usemi huu unarejelea wanaume wa Yuda walioweza kuitwa vitani, lakini maneno yenyewe hayasemi wazi “mashujaa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” huonyesha mfuatano wa matukio kwa Kiswahili cha kawaida, huku kiambishi cha yambwa katika “akamwambia” kikionyesha kwamba maneno yanaelekezwa kwa Amasa.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye uainisho inamrejelea Daudi katika muktadha; Kiswahili hakihitaji kibainishi tofauti kinacholingana na “the.”
- source_word: הַזְעֶק
  choice: kusanya
  rationale: Kauli ya kuamuru ya Hiphil ya זעק hapa ina maana ya kuitisha mkusanyiko au kuhamasisha watu. “Kusanya” ni ya asili na inaonyesha kusababisha watu wakutane bila kuongeza wazi kwamba ni mashujaa.
- source_word: לִי
  choice: -nie- katika “Nikusanyie”
  rationale: Kiambishi cha utendea kinaonyesha kwamba mkusanyiko ufanywe kwa ajili ya mfalme, na hivyo kuwasilisha maana ya dative kwa Kiswahili fasaha.
- source_word: אֶת אִישׁ יְהוּדָה
  choice: watu wa Yuda
  rationale: אִישׁ ni umbo la umoja linalotumika kwa maana ya mkusanyiko. “Watu wa Yuda” ni ya asili katika Kiswahili na haiingizi neno “mashujaa,” ambalo muktadha unaweza kudokeza lakini Kiebrania hakilitaji wazi.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: katika muda wa siku tatu
  rationale: Katika amri hii, kirai kinaweka ukomo wa muda wa kukamilisha kuitisha watu, si muda ambao tendo linaendelea.
- source_word: וְאַתָּה
  choice: nawe
  rationale: Kiwakilishi cha wazi kinasisitiza Amasa; “nawe” huhifadhi uratibu na msisitizo bila kuongeza upinzani mkali.
- source_word: פֹּה
  choice: hapa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kielezi cha mahali.
- source_word: עֲמֹד
  choice: uwe
  rationale: Ingawa maana ya msingi ni “simama,” hapa amri inamtaka Amasa awe au abakie mbele ya mfalme baada ya muda uliowekwa. “Uwe hapa” ni Kiswahili cha asili na huepuka kudokeza mkao wa kimwili tu.
