  text: Then she said[a], “They used to say in former times[b], ‘Let them surely ask at Abel,’ and so they ended the matter.”
translation:
  language: sw
  text: Kisha akasema[a], “Zamani watu walikuwa wakisema, ‘Waulize tu huko Abeli[b],’ na hivyo walimaliza jambo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kina miundo miwili ya mkazo, inayoweza kutafsiriwa pia: “Kwa hakika zamani walikuwa wakisema, ‘Waulize kwa hakika huko Abeli,’ na hivyo wakalifikisha jambo mwisho.”'
    reason: lexical_alternative
  - marker: b
    text: “Abeli” ni namna fupi ya jina Abeli-Bethi-Maaka, mji uliokuwa umezingirwa katika habari hii.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר לֵאמֹר
  choice: Kisha akasema
  rationale: Muundo huu unaendeleza simulizi na kuanzisha maneno ya mwanamke. ‘Kisha’ huonyesha mwendelezo huo kwa Kiswahili cha kawaida, huku לֵאמֹר ikiwakilishwa kwa alama za kunukuu.
- source_word: דַּבֵּר יְדַבְּרוּ
  choice: watu walikuwa wakisema
  rationale: Kitenzi-jina kamili pamoja na kitenzi kisichokamilika hukazia tendo la kusema. Katika kumbukumbu hii ya msemo wa zamani, ‘walikuwa wakisema’ huonyesha desturi ya wakati uliopita kwa lugha ya kawaida.
- source_word: בָרִאשֹׁנָה
  choice: Zamani
  rationale: Neno hili hapa linaelekea kurejelea nyakati za awali au desturi ya kale, si hatua ya kwanza tu katika mfuatano.
- source_word: שָׁאֹל יְשָׁאֲלוּ
  choice: Hakika watu na waulize
  rationale: Kitenzi-jina kamili pamoja na kitenzi kisichokamilika hukazia wazo la kuuliza au kutafuta shauri. ‘Hakika’ huhifadhi mkazo, na ‘na waulize’ huhifadhi ladha ya mwongozo au msemo.
- source_word: בְּאָבֵל
  choice: huko Abeli
  rationale: Hili ni jina lililofupishwa la mji wa Abeli-beth-maaka. ‘Huko Abeli’ ni njia ya kawaida ya Kiswahili ya kuelekeza mahali ambako watu wangetafuta shauri.
- source_word: וְכֵן הֵתַמּוּ
  choice: na hivyo walimaliza jambo
  rationale: וְכֵן huonyesha matokeo au namna, na hiphili ya תמם ina maana ya kufikisha jambo mwisho. Tafsiri hii inaakisi maneno ya Kiebrania bila kuamua kupita kiasi ikiwa walikomesha, walitatua, au walikamilisha jambo.
