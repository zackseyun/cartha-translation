  text: and Sheva was secretary[a], and Zadok and Abiathar were priests.
translation:
  language: sw
  text: Naye Sheva alikuwa katibu[a], nao Sadoki na Abiathari walikuwa makuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwandishi.” Neno la Kiebrania linaweza kumaanisha mwandishi wa kifalme au katibu; “katibu” limetumiwa hapa kufafanua cheo chake cha kiutawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: שיא
  choice: Sheva
  rationale: Jina limetoholewa moja kwa moja kulingana na umbo la konsonanti la maandishi ya Kiebrania katika mstari huu; tofauti zinazopatikana katika orodha sambamba hazijaingizwa katika matini.
- source_word: סֹפֵר
  choice: katibu
  rationale: Neno hili linaweza kumaanisha mwandishi au afisa wa ukatibu katika utawala wa kifalme. “Katibu” linaonyesha kwa Kiswahili cha sasa kwamba hapa ni cheo cha kiutawala, bila kulichanganya na cheo cha mtunza kumbukumbu.
- source_word: צָדוֹק
  choice: Sadoki
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: אֶבְיָתָר
  choice: Abiathari
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: כֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa wingi wa makuhani, na hapa linataja cheo cha Sadoki na Abiathari.
- source_word: וְ
  choice: naye / nao / na
  rationale: Viunganishi vilivyorudiwa katika orodha vimehifadhiwa kwa miundo ya kawaida ya Kiswahili ili sentensi isomeke kwa ufasaha huku uhusiano wa vipengele ukiendelea kuwa wazi.
