  text: Joab was over all the army of Israel[a], and Benaiah son of Jehoiada was over the Cherethites and the Pelethites.
translation:
  language: sw
  text: Yoabu alikuwa mkuu wa jeshi lote la Israeli, naye Benaya mwana wa Yehoyada alikuwa mkuu wa Wakerethi[a] na Wapelethi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakereti.” Utohozi wa jina hili la kikundi hutofautiana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: Yoabu
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili; kiunganishi cha Kiebrania kinaanzisha kipengele kipya katika orodha ya viongozi na hakihitaji neno la wakati kama ‘sasa’.
- source_word: אֶל כָּל הַ/צָּבָא יִשְׂרָאֵל
  choice: alikuwa mkuu wa jeshi lote la Israeli
  rationale: Katika muundo huu usio na kitenzi, אֶל huonyesha mamlaka ya uongozi. ‘Mkuu wa’ ni Kiswahili cha kawaida kinachoeleza kuwa Yoabu aliongoza jeshi lote; צָבָא hapa ni jeshi.
- source_word: וּ/בְנָיָה בֶּן יְהוֹיָדָע
  choice: naye Benaya mwana wa Yehoyada
  rationale: Majina yametoholewa kwa matumizi ya kawaida ya Kiswahili, na ‘mwana wa’ huhifadhi uhusiano uliotajwa katika Kiebrania.
- source_word: עַל ה/כרי וְ/עַל הַ/פְּלֵתִי
  choice: alikuwa mkuu wa Wakerethi[a] na Wapelethi
  rationale: עַל katika orodha hii ya vyeo huonyesha mamlaka. Majina ya vikundi yametoholewa badala ya kufasiriwa; alama ya tanbihi inaonyesha kutokuwa na uhakika kuhusu umbo la jina la kwanza.
