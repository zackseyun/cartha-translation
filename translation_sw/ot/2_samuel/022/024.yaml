  text: I was blameless before him[b][a], and I kept myself from my iniquity.
translation:
  language: sw
  text: Nilikuwa bila lawama mbele zake[a], nami nilijilinda na uovu wangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilikuwa mkamilifu kwake.” Neno la Kiebrania linaweza kusisitiza ukamilifu wa tabia au uadilifu, si tu kutokuwa na shtaka.
    reason: lexical_alternative
  - marker: b
    text: Au, “dhambi yangu” au “hatia yangu.” Neno la Kiebrania linaweza kumaanisha uovu, dhambi, au hatia kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: Nilikuwa
  rationale: Hali ya Qal wayyiqtol ya היה katika ushairi huu inaeleweka kwa kawaida kama wakati uliopita. Kiunganishi ו kinaakisiwa kwa mtiririko wa sentensi bila kulazimisha neno la mwanzo.
- source_word: תָמִים
  choice: bila lawama
  rationale: תָמִים hapa huonyesha ukamilifu wa tabia au uadilifu katika uhusiano na Mungu. “Bila lawama” ni Kiswahili cha kawaida kinachohifadhi uzito wa dai hilo bila kulazimisha maana ya kutokuwa na dhambi kabisa.
- source_word: לוֹ
  choice: mbele zake
  rationale: 'Ingawa maana ya moja kwa moja ni “kwake,” matumizi haya ni ya uhusiano na tathmini: hali ya msemaji machoni pa Mungu. “Mbele zake” huwasilisha maana hiyo kwa Kiswahili cha kawaida.'
- source_word: וָאֶשְׁתַּמְּרָה
  choice: nami nilijilinda
  rationale: Umbo la kujirejelea la שׁמר linaonyesha kujihadhari au kujilinda. “Nilijilinda” huhifadhi nguvu hiyo ya kujirejelea; “nami” huunganisha kishairi kishazi hiki na kilichotangulia.
- source_word: מֵעֲוֺנִי
  choice: na uovu wangu
  rationale: עָוֹן inaweza kumaanisha uovu, dhambi, hatia, au matokeo yake. “Uovu wangu” huhifadhi uzito wa kimaadili na kiambishi cha nafsi ya kwanza, huku “na” baada ya “kujilinda” kikitoa maana ya kujiepusha na jambo.
theological_decisions:
- issue: Je, kauli ya Daudi inadai ukamilifu usio na dhambi?
  choice: Dai la uadilifu au kutokuwa na lawama mbele za Mungu katika muktadha huu, si lazima ukamilifu wa kimaadili usio na dhambi kabisa.
  alternative: Dai la ukamilifu kamili wa kimaadili.
  rationale: “Bila lawama” huhifadhi dai lenye nguvu la תָמִים, huku tanbihi ikionyesha wigo wa maana wa ukamilifu na uadilifu. Tafsiri haififishi kauli hiyo wala kuifanya ithibitishe kutokuwa na dhambi kabisa zaidi ya kile Kiebrania kinacholazimisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa vishazi na “nami” huhifadhi usambamba wa mstari wa Kiebrania. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
