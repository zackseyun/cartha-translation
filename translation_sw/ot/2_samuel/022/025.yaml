  yaml_path: translation/ot/2_samuel/022/025.yaml
  text: And Yahweh repaid me according to my righteousness[b][a], according to my cleanness before his eyes.
translation:
  language: sw
  text: Naye Yahweh akanilipa kulingana na haki yangu, kulingana na usafi wangu mbele ya macho yake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, “machoni pake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: akanilipa
  rationale: Kitenzi hapa kinaonyesha tendo la kumrudishia mtu kwa kadiri ya matendo yake. “Akanilipa” ni Kiswahili cha kawaida kinachobeba maana ya malipo au mjibizo bila kuifanya iwe tu zawadi chanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: לִי
  choice: -ni-
  rationale: Kiambishi cha yambwa katika “akanilipa” kinawasilisha kwa kawaida maana ya ‘mimi’ kama mpokeaji wa malipo.
- source_word: כְּצִדְקָתִי
  choice: kulingana na haki yangu
  rationale: “Haki” hapa inahifadhi wazo la uadilifu au unyofu wa kimaadili, huku “kulingana na” ikiwakilisha nguvu ya kihusishi כְּ.
- source_word: כְּבֹרִי
  choice: kulingana na usafi wangu
  rationale: “Usafi” huhifadhi taswira ya kuwa safi au halisi bila kuongeza neno ‘mikono,’ ambalo halipo katika mstari huu.
- source_word: לְנֶגֶד עֵינָיו
  choice: mbele ya macho yake
  rationale: Tafsiri hii inahifadhi taswira halisi ya Kiebrania na pia inaeleweka kwa maana ya ‘machoni pake.’
theological_decisions:
- issue: Dai la Daudi kuhusu haki na usafi wake
  choice: Dai la nafsi ya kwanza limeachwa wazi bila kupunguzwa au kuwekewa ufafanuzi wa kimafundisho.
  alternative: Kulifafanua kuwa uaminifu wa agano wa kulinganisha au kulibadili ili kuepuka mvutano na dhambi za Daudi zinazojulikana.
  rationale: Kiebrania kinadai moja kwa moja kwamba Yahweh alimlipa Daudi kulingana na haki na usafi wake. Tafsiri inapaswa kuhifadhi mvutano huo wa kitheolojia badala ya kuutatua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. Muundo unaorudiwa “kulingana na” umehifadhi usambamba wa kishairi; “mbele ya macho yake” huhifadhi taswira ya Kiebrania.
