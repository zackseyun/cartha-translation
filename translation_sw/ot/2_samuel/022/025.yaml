review_pass:
  verdict: revise
  source_fidelity: 'The rendering accurately represents the Hebrew: Yahweh is the subject, akanilipa conveys requital to the first-person speaker, the repeated kulingana na preserves the comparative parallelism, and mbele ya macho yake retains the concrete ''before his eyes'' expression. No ''hands'' are added to the second clause.'
  naturalness: The verse is clear and suitably formal in Standard East African Swahili. The repeated kulingana na naturally maintains the poetic parallelism. Naye is acceptable as a connective rendering of the Hebrew waw.
  terminology: Yahweh appropriately renders the divine name. Haki yangu is an acceptable rendering of righteousness in this context, and usafi wangu appropriately renders cleanness/purity. However, utakatifu means holiness rather than cleanness/purity and is not a valid lexical alternative for כְּבֹרִי here.
  issues:
  - severity: medium
    issue: Footnote a gives “utakatifu wangu” as an alternative for “usafi wangu.”
    rationale: Utakatifu ordinarily denotes holiness/sanctity, whereas the Hebrew term here denotes cleanness or purity. The note therefore introduces a different theological and lexical sense. Since no necessary distinct Swahili alternative is available without becoming less natural, the misleading footnote and its anchor should be removed.
  revised_text: Naye Yahweh akanilipa kulingana na haki yangu, kulingana na usafi wangu mbele ya macho yake[a].
