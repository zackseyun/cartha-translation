- issue: Nguvu ya usemi מְפַלְטִי לִי
  choice: mwokozi wangu
  alternative: mwokozi wangu kwa ajili yangu
  rationale: Muundo wa Kiebrania una msisitizo wa kibinafsi, lakini katika Kiswahili ‘mwokozi wangu’ huutoa kwa ufasaha; tafsiri halisi zaidi ingekuwa nzito na ya kurudia.
