  yaml_path: translation/ot/2_samuel/022/023.yaml
  text: For all his judgments were before me[a], and I did not turn away from his statutes.
translation:
  language: sw
  text: 'Kwa maana hukumu zake zote zilikuwa mbele yangu,[a]


    nami sikukengeuka kutoka katika maagizo yake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kwa sababu hukumu zake zote zilikuwa mbele yangu, nami sikuziacha.”'
    reason: Njia nyingine ya kuelewa כִּי na rejeo lisilo wazi la kiwakilishi מִמֶּנָּה.
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu ya kauli iliyotangulia na inadumisha mtiririko wa kishairi.
- source_word: כָל מִשְׁפָּטָיו
  choice: hukumu zake zote
  rationale: ‘Zote’ inadumisha maana pana ya כָל, huku ‘hukumu’ ikiwakilisha maamuzi au masharti ya kisheria ya מִשְׁפָּט.
- source_word: לְנֶגְדִּי
  choice: zilikuwa mbele yangu
  rationale: Inahifadhi taswira ya Kiebrania ya kuwa daima katika mtazamo au ufahamu wa msemaji.
- source_word: וְחֻקֹּתָיו
  choice: maagizo yake
  rationale: ‘Maagizo’ ni neno la kawaida na lenye heshima kwa masharti yaliyowekwa; pia linatofautishwa na ‘hukumu’ katika mstari sambamba.
- source_word: לֹא אָסוּר
  choice: sikukengeuka
  rationale: Kitenzi kinaonyesha kutopotoka au kutogeuka kutoka njia inayotakiwa, na ‘kukengeuka’ ni Kiswahili cha asili katika muktadha wa uaminifu kwa maagizo.
- source_word: מִמֶּנָּה
  choice: kutoka katika maagizo yake
  rationale: Kiwakilishi cha Kiebrania ni cha kike umoja na rejeo lake haliko wazi kabisa; maandishi makuu yanaeleza rejeo linalowezekana kwa maagizo, huku tanbihi ikihifadhi uwezekano wa kurejelea hukumu.
theological_decisions:
- issue: Kutofautisha istilahi mbili za sheria ya agano
  choice: מִשְׁפָּטָיו imetafsiriwa ‘hukumu zake,’ na חֻקֹּתָיו ‘maagizo yake.’
  alternative: Kutafsiri zote kwa neno la jumla kama ‘sheria’ au ‘amri.’
  rationale: Kiebrania kinatumia istilahi mbili tofauti katika usambamba wa kishairi; kuzitofautisha kunaheshimu matini bila kuzifanya kuwa jamii moja ya kiteolojia.
- issue: Rejeo la kiwakilishi מִמֶּנָּה
  choice: Katika maandishi makuu, kiwakilishi kimeelezwa kuwa kinarejelea ‘maagizo yake.’
  alternative: Kukichukua kuwa kinarejelea ‘hukumu zake’ kwa maana ya ‘sikuziacha.’
  rationale: Muundo wa Kiebrania una utata wa kisarufi na kishairi. Chaguo kuu hufuata nomino iliyo karibu zaidi kwa maana, lakini tanbihi inahifadhi rejeo jingine linalowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Mgawanyo wa mistari unadumisha usambamba wa kishairi wa Kiebrania.
