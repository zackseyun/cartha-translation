  text: Alinitoa na kunileta mahali pana[a]; aliniokoa, kwa sababu alipendezwa nami[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pa wazi” au “mahali penye nafasi.” Picha ya Kiebrania hutofautisha uhuru na nafuu na kubanwa au dhiki.
    reason: lexical_alternative
  - marker: b
    text: Au, “alinifurahia” au “aliridhika nami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: Alinitoa
  rationale: Kitenzi cha Kiebrania kiko katika hali ya kusababisha na humaanisha ‘kusababisha atoke’ au ‘kumtoa.’ ‘Alinitoa’ ni Kiswahili cha kawaida na kinadumisha picha ya ukombozi.
- source_word: לַמֶּרְחָב
  choice: mpaka mahali penye nafasi
  rationale: מֶרְחָב ni eneo pana, wazi, au lenye nafasi, likitofautishwa kwa picha na kubanwa au taabu. Usemi huu ni wa asili katika Kiswahili na unabaki na picha hiyo.
- source_word: יְחַלְּצֵנִי
  choice: aliniokoa
  rationale: חלץ katika Piel inaweza kumaanisha kumtoa hatarini, kumkomboa, au kumwokoa. ‘Aliniokoa’ ni wazi na inafaa sambamba na kishazi kilichotangulia.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa neno hilo linatanguliza sababu ya kuokolewa; ‘kwa sababu’ huonyesha uhusiano huo wazi katika Kiswahili cha sasa.
- source_word: חָפֵץ בִּי
  choice: alipendezwa nami
  rationale: חפץ pamoja na ב huonyesha kupendezwa au kufurahia mtu. ‘Alipendezwa nami’ ni usemi wa kawaida unaohifadhi maana ya kibali cha binafsi bila kuongeza dai la kimafundisho.
theological_decisions:
- issue: Sababu ya Mungu kumwokoa Daudi
  choice: kwa sababu alipendezwa nami
  alternative: kwa sababu alifurahia kuwa nami / kwa sababu alinifurahia
  rationale: Aya inahusianisha wokovu wa Daudi na kupendezwa kwa Mungu naye. Tafsiri inadumisha lugha hiyo ya uhusiano bila kuamua kwamba aya inafundisha msingi mpana wa kustahili wokovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mahali penye nafasi’ ni wazi kwa wasomaji wa kawaida huku kikihifadhi picha ya eneo pana; mpangilio wa sentensi unafuata usambamba wa kishairi wa Kiebrania.
