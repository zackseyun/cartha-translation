  text: וַ/יְדַבֵּ֤ר דָּוִד֙ לַֽ/יהוָ֔ה אֶת דִּבְרֵ֖י הַ/שִּׁירָ֣ה הַ/זֹּ֑את בְּ/יוֹם֩ הִצִּ֨יל יְהוָ֥ה אֹת֛/וֹ מִ/כַּ֥ף כָּל אֹיְבָ֖י/ו וּ/מִ/כַּ֥ף שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/001.yaml
  text: And David spoke to Yahweh the words of this song on the day when Yahweh delivered him from the hand of all his enemies and from the hand of Saul[a].
translation:
  language: sw
  text: Daudi akamwambia Yahweh maneno ya wimbo huu siku ambayo Yahweh alimwokoa kutoka mkononi mwa adui zake wote na kutoka mkononi mwa Sauli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akamwambia
  rationale: Kitenzi דבר kwa kawaida humaanisha kusema au kunena. Ingawa kinachofuata ni wimbo, tafsiri hii haiibadili kuwa ‘akaimba’.
- source_word: לַיהוָה / יְהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetolewa moja kwa moja kama ‘Yahweh’, badala ya kubadilishwa kuwa cheo.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: maneno ya wimbo huu
  rationale: Huhifadhi vipengele vyote viwili vya Kiebrania, yaani ‘maneno’ na ‘wimbo’, bila kufupisha kuwa ‘wimbo huu’ pekee.
- source_word: בְּיוֹם
  choice: siku
  rationale: Katika muktadha huu kifungu kinaonyesha wakati au tukio lililokuwa sababu ya kutolewa kwa wimbo; muundo ‘siku ... alipomwokoa’ ni wa kawaida katika Kiswahili.
- source_word: הִצִּיל
  choice: alipomwokoa
  rationale: Kitenzi נצל hapa kinaonyesha kumtoa Daudi katika hatari na mamlaka ya maadui zake.
- source_word: מִכַּף
  choice: kutoka mikononi mwa / kutoka mkononi mwa
  rationale: Neno כף kwa halisi ni kiganja au mkono, na hapa ni sitiari ya nguvu au udhibiti. Kiswahili ‘mikononi mwa’ huihifadhi sitiari hiyo; umoja umetumiwa kwa Sauli.
- source_word: כָּל אֹיְבָיו
  choice: adui zake wote
  rationale: Hii ni tafsiri ya kawaida na kamili ya kifungu cha jumla.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina יהוה moja kwa moja. ‘Yahweh’ huhifadhi jina hilo la agano bila kulibadilisha kuwa cheo.
- issue: Uhusiano wa Sauli na ‘adui zake wote’
  choice: Sauli ametajwa kando baada ya adui zake wote
  alternative: Kumwingiza Sauli waziwazi katika kundi la maadui
  rationale: Muundo wa Kiebrania unasema ‘kutoka mkononi mwa adui zake wote na kutoka mkononi mwa Sauli.’ Tafsiri imehifadhi mtengano huo bila kuamua kimya kimya kama Sauli anahesabiwa miongoni mwa maadui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘akamwambia Yahweh maneno ya wimbo huu’ umehifadhi usemi wa chanzo, badala ya kulainishwa kuwa ‘akamwimbia Yahweh wimbo huu.’
