  yaml_path: translation/ot/2_samuel/022/036.yaml
  text: You gave me the shield of your salvation[a], and your gentleness made me great.
translation:
  language: sw
  text: Ulinipa ngao ya wokovu wako, na upole wako[a] ukanifanya kuwa mkuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “unyenyekevu wako” au “kujishusha kwako kwa neema.” Usemi wa Kiebrania ni mgumu; huenda ukamaanisha Mungu kujishusha kwa neema ili kumwinua msemaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Ulinipa
  rationale: Qal wayyiqtol ya נתן inaeleza tendo la wakati uliopita katika simulizi; “ulinipa” ni Kiswahili cha kawaida kinachohifadhi pia mhusika anayemwelekea Mungu.
- source_word: לִי
  choice: -ni- katika “ulinipa”
  rationale: Kiwakilishi cha yule anayepokea kinaonyeshwa kwa kawaida katika kitenzi cha Kiswahili badala ya kusema kwa namna nzito “ulitoa kwangu.”
- source_word: מָגֵן
  choice: ngao
  rationale: Inahifadhi taswira halisi ya kijeshi ya chombo cha kujikinga, badala ya kuibadili kuwa dhana ya jumla ya ulinzi.
- source_word: יִשְׁעֶךָ
  choice: wokovu wako
  rationale: Inahifadhi muundo unaomhusisha Mungu moja kwa moja na wokovu, pamoja na uzito wake wa kitheolojia; “ukombozi wako” pia ungewezekana.
- source_word: וַעֲנֹתְךָ
  choice: unyenyekevu wako
  rationale: Neno hili la Kiebrania ni gumu na linaweza kueleweka kuwa unyenyekevu, upole, kujishusha kwa neema, au msaada wa Mungu. “Unyenyekevu wako” huhifadhi uzito na mvutano wa usemi wa kushangaza kuhusu Mungu bila kuufafanua kupita kiasi.
- source_word: תַּרְבֵּנִי
  choice: ukanifanya mkuu
  rationale: Hiphil ya רבה ina maana ya kufanya kuwa mkuu au kuongeza. Katika muktadha huu, “ukanifanya mkuu” huonyesha matokeo ya Mungu kumwinua msemaji kwa njia ya kawaida na yenye heshima.
theological_decisions:
- issue: Maana ya וַעֲנֹתְךָ inaposemwa kumhusu Mungu
  choice: unyenyekevu wako
  alternative: upole wako; kujishusha kwako kwa neema; msaada wako
  rationale: Usemi wa Kiebrania una utata halisi. Tafsiri iliyochaguliwa inadumisha mvutano wa kitheolojia wa Mungu kujishusha ili kumwinua mtumishi wake, bila kudokeza upungufu ndani ya Mungu. Maana nyingine zinazowezekana zimehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya kishairi; taswira ya “ngao” na usemi wenye mvutano wa “unyenyekevu wako” vimehifadhiwa. Alama ya tanbihi imewekwa moja kwa moja baada ya kifungu kinachohitaji ufafanuzi.
