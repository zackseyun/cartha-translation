id: 2SA.22.31
reference: 2 Samuel 22:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הָ/אֵ֖ל תָּמִ֣ים דַּרְכּ֑/וֹ אִמְרַ֤ת יְהוָה֙ צְרוּפָ֔ה מָגֵ֣ן ה֔וּא לְ/כֹ֖ל הַ/חֹסִ֥ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/031.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is proven; he is a shield to all who take refuge in him.
translation:
  language: sw
  text: Kwa habari ya Mungu, njia yake haina dosari; neno la Yahweh limethibitishwa[a]; yeye ni ngao kwa wote wanaomkimbilia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “limesafishwa” au “limejaribiwa”; Kiebrania kinatoa taswira ya chuma kinachosafishwa kwa moto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Kwa habari ya Mungu
  rationale: Muundo huu unaonyesha Mungu ndiye mada ya kwanza ya kishazi, huku ukitoa Kiswahili cha kawaida na chenye hadhi.
- source_word: תָּמִים
  choice: haina dosari
  rationale: Katika muktadha huu neno linaonyesha kutokuwa na kasoro au lawama; usemi huu huepuka maana zinazoweza kupotosha za ukamilifu wa kifalsafa.
- source_word: דַּרְכּוֹ
  choice: njia yake
  rationale: Neno linahusu njia au namna ya Mungu ya kutenda; 'njia yake' huhifadhi sitiari ya Kiebrania.
- source_word: אִמְרַת יְהוָה
  choice: neno la Yahweh
  rationale: אִמְרָה ni usemi au neno; tafsiri pana 'neno' huhifadhi wigo wake na usambamba wa kishairi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: צְרוּפָה
  choice: limethibitishwa
  rationale: Neno hili hutokana na taswira ya chuma kusafishwa au kujaribiwa kwa moto na hapa linaonyesha kwamba neno la Yahweh limeonekana kuwa la kuaminika.
- source_word: מָגֵן
  choice: ngao
  rationale: Huhifadhi taswira halisi ya chombo cha ulinzi kinachotumiwa kisitiari kumhusu Mungu.
- source_word: הוּא
  choice: yeye ni
  rationale: Kiwakilishi cha Kiebrania kimesisitizwa wazi; 'yeye ni' huhifadhi msisitizo huo katika kishazi nomino.
- source_word: לְכֹל
  choice: kwa wote
  rationale: Hueleza manufaa na ulinzi unaowafikia watu wote wanaotajwa.
- source_word: הַחֹסִים בּוֹ
  choice: wanaomkimbilia
  rationale: Kitenzi חסה humaanisha kukimbilia mahali pa usalama; uchaguzi huu huhifadhi taswira ya kutafuta hifadhi kwa Mungu kuliko neno la jumla 'kumtumaini'.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano moja kwa moja; 'Yahweh' hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Nguvu ya kisitiari ya צְרוּפָה kuhusu neno la Yahweh
  choice: limethibitishwa
  alternative: limesafishwa au limejaribiwa
  rationale: Uchaguzi huu unaeleza matokeo ya kujaribiwa na kuonekana kuwa halisi, huku tanbihi ikihifadhi taswira ya kusafisha chuma kwa moto.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi usambamba wa kishairi, jina Yahweh, na taswira za ngao na kukimbilia hifadhi.
