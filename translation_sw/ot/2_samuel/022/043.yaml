  text: Niliwasaga kama mavumbi ya ardhi; kama matope ya mitaani niliwaponda na kuwakanyaga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “niliwatandaza”; kitenzi cha mwisho cha Kiebrania kinaweza kumaanisha kugonga hadi kuwa bapa au kutandaza.
