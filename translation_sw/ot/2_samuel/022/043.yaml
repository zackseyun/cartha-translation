lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: Niliwasaga
  rationale: Kitenzi שׁחק kinaonyesha kusaga au kuponda mpaka kuwa chembechembe; “niliwasaga” ni cha kawaida na kinaendana na mfano wa mavumbi.
- source_word: כַּעֲפַר אָרֶץ
  choice: kama mavumbi ya ardhi
  rationale: עפר ni mavumbi au udongo mkavu uliovunjika-vunjika; muundo huu unahifadhi uhusiano wa maneno ya Kiebrania kwa Kiswahili cha kibiblia kinachoeleweka.
- source_word: כְּטִיט חוּצוֹת
  choice: kama matope ya barabarani
  rationale: טיט ni matope, na חוצות hapa ni barabara au maeneo ya wazi ya mjini; “matope ya barabarani” ni picha wazi na ya asili kwa Kiswahili.
- source_word: אֲדִקֵּם
  choice: niliwaponda
  rationale: Hifili ya דקק humaanisha kuponda au kuvunja kuwa vipande vidogo; “niliwaponda” hudumisha nguvu ya tendo bila kurudia kitenzi “kusaga”.
- source_word: אֶרְקָעֵם
  choice: kuwakanyaga chini
  rationale: רקע inaweza kumaanisha kukanyaga, kugonga hadi kuwa bapa, au kutandaza; katika picha ya matope ya barabarani, “kuwakanyaga chini” inafaa huku uwezekano mwingine ukihifadhiwa katika tanbihi.
