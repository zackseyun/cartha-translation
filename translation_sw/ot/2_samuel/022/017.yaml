  text: He sent from on high[a]; he took me[b]; he drew me out of many waters.
translation:
  language: sw
  text: Alituma kutoka juu[a], akanichukua; akanitoa katika maji mengi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alinyoosha kutoka juu.” Kitenzi cha Kiebrania kwa msingi humaanisha “kutuma” na kinaweza pia kumaanisha “kunyoosha”; hakitaji wazi kitu kilichotumwa au kunyoshwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “maji makubwa” au “maji yenye nguvu.” Kwa karibu zaidi, “maji mengi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: alinyosha mkono
  rationale: Kitenzi kwa msingi wake kinaweza kumaanisha ‘kutuma’ au ‘kunyosha.’ Katika taswira hii ya kuokoa kutoka juu, ‘alinyosha mkono’ ni Kiswahili cha asili kinachoonyesha tendo lililokusudiwa, huku tanbihi ikibainisha kuwa neno ‘mkono’ halitajwi wazi katika Kiebrania.
- source_word: מִמָּרוֹם
  choice: kutoka juu
  rationale: Huhifadhi wazo la mahali palipoinuka bila kulifafanua zaidi kuwa ‘mbinguni,’ jambo ambalo Kiebrania halisemi moja kwa moja hapa.
- source_word: יִקָּחֵנִי
  choice: akanishika
  rationale: Ingawa לקח kwa kawaida ni ‘chukua,’ katika mfululizo huu wa uokoaji ‘akanishika’ ni ya kawaida na inaonyesha vizuri kumkamata mtu anayevutwa kutoka majini.
- source_word: יַמְשֵׁנִי
  choice: akanivuta
  rationale: Hifili ya משה hapa ina maana ya kumtoa mtu kwa kumvuta, hasa kutoka majini; ‘akanivuta’ ni wazi na ya kawaida katika Kiswahili.
- source_word: מִמַּיִם רַבִּים
  choice: kutoka katika maji mengi
  rationale: Ni tafsiri ya karibu ya maneno ya Kiebrania na huhifadhi taswira ya kishairi ya wingi wa maji bila kuamua kimya kimya kwamba kivumishi kinamaanisha ‘makuu’ au ‘yenye nguvu.’
theological_decisions:
- issue: Taswira ya Mungu kuokoa kutoka juu
  choice: kutoka juu
  alternative: kutoka mbinguni
  rationale: Tafsiri inadumisha lugha ya kishairi na ya mahali iliyomo katika Kiebrania bila kuifanya ‘juu’ kuwa rejeo la wazi zaidi la ‘mbinguni.’
- issue: Mtendaji kunyoosha mkono
  choice: alinyosha mkono
  alternative: alituma kutoka juu
  rationale: Kiebrania hakitaji wazi kitu kilichotumwa, na kinaweza kueleweka kama kunyoosha kitu ili kuokoa. Kiswahili kinahitaji usemi kamili zaidi; ‘mkono’ huifanya taswira ieleweke bila kubadili mhusika au lengo la tendo, na nyongeza hiyo imewekwa wazi katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi lakini kinachoeleweka kwa urahisi. Vitenzi vinavyofuatana kwa ‘aka-’ vinaonyesha mfululizo wa haraka wa tendo la uokoaji.
