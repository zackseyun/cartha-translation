  text: For who is God besides Yahweh? And who is a rock besides our God?[a]
translation:
  language: sw
  text: Kwa maana, ni nani aliye Mungu isipokuwa Yahweh? Na ni nani aliye mwamba isipokuwa Mungu wetu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni nani aliye Mwamba isipokuwa Mungu wetu?” Neno la Kiebrania linalomaanisha “mwamba” hutumiwa mara nyingi kama sitiari, na nyakati nyingine karibu kama cheo cha Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaunganisha swali hili la balagha na sifa iliyotangulia kwa kutoa msingi au sababu.
- source_word: מִי אֵל
  choice: ni nani aliye Mungu
  rationale: Inahifadhi swali la balagha na dai kwamba hakuna Mungu mwingine.
- source_word: מִבַּלְעֲדֵי
  choice: isipokuwa
  rationale: Inaeleza kutokuwapo kwa mwingine nje ya yule anayetajwa, kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Inahifadhi jina binafsi la Mungu lililoandikwa katika Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: וּמִי צוּר
  choice: Na ni nani aliye mwamba
  rationale: Inadumisha ulinganifu wa kishairi na sitiari halisi ya mwamba kama nguvu, uthabiti, na ulinzi.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Inahifadhi kiambishi cha nafsi ya kwanza wingi na maana yake ya kijumuiya.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Iwapo צוּר itumike kama cheo au kama sitiari ya kawaida
  choice: mwamba
  alternative: Mwamba
  rationale: Muundo wa sentensi unafaa kueleweka kama kiarifu cha kisitiari, lakini uwezekano wa kuliona kama cheo unaonyeshwa katika tanbihi bila kuamua zaidi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maswali mawili ya balagha na ulinganifu wa kishairi umehifadhiwa; “mwamba” linaachwa kama sitiari badala ya kufafanuliwa ndani ya mstari.
