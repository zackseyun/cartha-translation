  yaml_path: translation/ot/2_samuel/022/033.yaml
  text: God is my strong refuge[a], and he makes my way blameless.
translation:
  language: sw
  text: Mungu ndiye kimbilio langu lenye nguvu, naye huifanya njia yangu iwe kamilifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata kwa karibu zaidi umbo la konsonanti, “naye huifanya njia yake iwe kamilifu.” Mstari sambamba katika Zaburi 18:32 unaunga mkono “njia yangu.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֵל
  choice: Mungu
  rationale: Kibainishi pamoja na אֵל hapa kinamtaja Mungu kwa namna ya kawaida; Kiswahili cha sasa hutumia “Mungu” bila kulazimisha “Mungu huyo.”
- source_word: מָעוּזִּי חָיִל
  choice: kimbilio langu lenye nguvu
  rationale: מָעוֹז hueleza mahali au chanzo cha ulinzi na usalama, huku חָיִל ikiongeza wazo la nguvu; tafsiri hii inahifadhi vipengele vyote bila kuifanya taswira iwe ya kijeshi kupita kiasi.
- source_word: וַיַּתֵּר
  choice: huifanya ... iwe
  rationale: Kitenzi hiki ni kigumu katika muundo huu, lakini katika ulinganifu wake na Zaburi 18:32 kinaelekea kumaanisha kufanya au kutengeneza njia iwe katika hali fulani.
- source_word: תָּמִים
  choice: kamilifu
  rationale: Neno hili linaweza kumaanisha ukamilifu, uadilifu, au kutokuwa na dosari. “Kamilifu” linafaa kwa njia na halilazimishi maana ya kutokuwa na dhambi.
- source_word: דרכו
  choice: njia yangu
  rationale: Ingawa umbo la konsonanti na usomaji uliowekewa irabu katika WLC unaweza kueleweka “njia yake,” mstari sambamba katika Zaburi 18:32 unaunga mkono “njia yangu.” Tofauti hiyo imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Kiwakilishi katika neno la mwisho דרכו
  choice: Mungu huifanya njia ya msemaji iwe kamilifu.
  alternative: Mungu huifanya njia yake mwenyewe iwe kamilifu.
  rationale: Maandishi ya 2 Samweli yanaweza kusomeka “njia yake,” lakini mstari sambamba wa Zaburi 18:32 unaunga mkono “njia yangu.” Kwa kuwa huu ni utata halisi wa kimaandishi na kifasiri, usomaji mbadala umehifadhiwa katika tanbihi badala ya kufichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kimbilio langu lenye nguvu” ni wazi kwa wasomaji wa kawaida na huhifadhi maana za ulinzi na nguvu. Muundo wa kishairi umewekwa kwa sentensi fupi yenye mtiririko wa asili.
