base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/022.yaml
  text: For I have kept the ways of Yahweh[a], and have not wickedly departed from my God.
translation:
  language: sw
  text: Kwa maana nimezishika njia za Yahwe, wala sikutenda uovu kwa kumwacha Mungu wangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala sikumtendea Mungu wangu uovu.” Muundo רָשַׁעְתִּי מֵאֱלֹהָי unaweza kueleweka kuwa kutenda uovu kwa kuondoka kutoka kwa Mungu au kutenda uovu dhidi yake.
    reason: Huhifadhi uwezekano wa tafsiri wa muundo wa Kiebrania na kusahihisha uhusiano wa kihusishi katika Kiswahili.
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kihusishi hiki kinatoa sababu ya kauli iliyotangulia katika wimbo; “kwa maana” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: שָׁמַרְתִּי
  choice: nimezishika
  rationale: Kitenzi שׁמר humaanisha kushika, kutunza, au kuzingatia. Wakati timilifu wa Kiswahili unaonyesha mwenendo uliotekelezwa wenye umuhimu kwa kauli ya sasa.
- source_word: דַּרְכֵי
  choice: njia za
  rationale: Wingi wa דֶּרֶךְ hapa unaeleza mwenendo au maagizo yanayoongoza maisha; “njia” huhifadhi taswira na maana yake ya kimaadili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa na cheo; “Yahwe” ni umbo la kawaida la Kiswahili.
- source_word: וְלֹא
  choice: wala siku-
  rationale: “Wala” huunganisha kishazi cha pili kilichokanushwa kwa mtiririko wa kawaida wa Kiswahili.
- source_word: רָשַׁעְתִּי
  choice: sikutenda uovu
  rationale: Kitenzi רשע humaanisha kutenda kwa uovu au kuwa na hatia; tafsiri hii huhifadhi uzito wake wa kimaadili.
- source_word: מֵאֱלֹהָי
  choice: kwa kumwacha Mungu wangu
  rationale: Kihusishi מִן kwa msingi humaanisha “kutoka/kutengana na.” Katika muundo huu, Kiswahili cha asili kinaeleza uovu unaodhihirika kwa kumwacha Mungu, huku uwezekano wa maana ya “kumtendea vibaya” ukitajwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. Kulitaja kama “Yahwe” hulihifadhi bila kulibadilisha kuwa cheo.
- issue: Maana ya רָשַׁעְתִּי מֵאֱלֹהָי
  choice: sikutenda uovu kwa kumwacha Mungu wangu
  alternative: sikumtendea Mungu wangu uovu
  rationale: Muundo wa Kiebrania unaunganisha kutenda uovu na wazo la kutoka kwa Mungu. Tafsiri kuu huhifadhi pande zote mbili—uovu na kuachana—bila kuficha uwezekano wa kuelewa uhusiano huo kuwa kutenda uovu dhidi ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na hadhi inayofaa wimbo. “Nimezishika njia” huhifadhi sitiari ya Kiebrania, na “wala” huleta ulinganifu wa kishairi kati ya vishazi.
