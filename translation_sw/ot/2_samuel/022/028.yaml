base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/028.yaml
  text: You save an afflicted people[b][a], but your eyes are on the haughty to bring them low.
translation:
  language: sw
  text: Wewe huwaokoa watu walioteswa[a], lakini macho yako huwaelekea wenye kiburi[b], nawe unawashusha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maskini” au “wanaokandamizwa.” Neno la Kiebrania linaweza kumaanisha walio maskini, walioteswa, au walio katika hali ya unyonge.
    reason: lexical_alternative
  - marker: b
    text: Au “waliojiinua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: watu
  rationale: Nomino ya umoja yenye maana ya mkusanyiko wa watu; “watu” ni ya kawaida na inafaa katika ushairi huu.
- source_word: עָנִי
  choice: walioteswa
  rationale: Neno linaweza kumaanisha maskini, wanaoteseka, au wanaokandamizwa. “Walioteswa” linaonyesha hali ya shida na unyonge bila kuifunga maana katika umaskini wa mali pekee.
- source_word: תּוֹשִׁיעַ
  choice: huwaokoa
  rationale: Hifili ya ישׁע ina maana pana ya kuokoa au kukomboa. Kauli ya mazoea “huwaokoa” inafaa katika wimbo unaosimulia tabia ya Mungu.
- source_word: עֵינֶיךָ
  choice: macho yako
  rationale: Inahifadhi taswira halisi ya Kiebrania na inaeleweka kwa kawaida katika Kiswahili.
- source_word: רָמִים
  choice: wenye kiburi
  rationale: Katika muktadha huu neno la walio juu lina maana hasi ya watu wenye majivuno; “wenye kiburi” linaweka wazi tofauti ya kimaadili huku tanbihi ikihifadhi uwezekano wa “waliojiinua.”
- source_word: תַּשְׁפִּיל
  choice: ili uwashushe
  rationale: Hifili ya שׁפל humaanisha kuwafanya wawe chini au kuwanyenyekeza. Muundo huu ni wa asili katika Kiswahili na unahifadhi taswira ya juu na chini.
- source_word: וְ
  choice: lakini
  rationale: Ingawa kiunganishi kimsingi ni “na,” usambamba unaonyesha utofautishaji kati ya kuwaokoa walioteswa na kuwashusha wenye kiburi.
- source_word: וְאֶת
  choice: (hakijatafsiriwa kando)
  rationale: אֵת ni kiashiria cha shamirisho tendwa na hakina neno huru linalohitajika katika Kiswahili.
theological_decisions:
- issue: Tofauti ya kimaadili dhidi ya tofauti ya kijamii pekee
  choice: Mungu huwaokoa walioteswa na kuwashusha wenye kiburi.
  alternative: Mungu huwaokoa maskini na kuwashusha walio katika vyeo vya juu.
  rationale: עָנִי linaweza kuhusisha umaskini au kukandamizwa, na רָמִים linaweza kwa umbo lake kumaanisha walio juu. Hata hivyo, usambamba unaunga mkono tofauti kati ya walio katika hali ya chini na wenye kujikweza, bila kuondoa kabisa upande wa kijamii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni rahisi kusomeka kwa sauti huku ukihifadhi taswira ya “macho” na usambamba wa kushusha walio juu.
