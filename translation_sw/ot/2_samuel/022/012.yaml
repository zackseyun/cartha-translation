  yaml_path: translation/ot/2_samuel/022/012.yaml
  text: He made darkness a shelter around him[a], a massing of waters, thick clouds of the skies.
translation:
  language: sw
  text: Alifanya giza lililomzunguka kuwa makao yake[a]—mlundikano wa maji, mawingu mazito ya angani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Aliweka giza kumzunguka kuwa makao yake; mkusanyiko wa maji, mawingu mazito ya mbinguni.” Kiebrania hapa ni cha kishairi sana. Neno lililotafsiriwa “makao” liko katika wingi, na kirai adimu “mlundikano wa maji” kinaweza pia kueleweka kuwa “mkusanyiko wa maji” au, kwa tafsiri yenye ufafanuzi zaidi, “mawingu meusi ya mvua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁת
  choice: Aliweka
  rationale: Kitenzi שׁית hapa kina maana ya kuweka au kupanga. “Aliweka” ni cha kawaida katika Kiswahili na kinadumisha tendo la kimakusudi bila kuongeza maana ya kusababisha isiyolazimishwa na maandishi.
- source_word: חֹשֶׁךְ
  choice: giza
  rationale: Hii ndiyo maana ya kawaida ya nomino hiyo na inadumisha taswira ya Mungu kujifunika katika dhoruba.
- source_word: סְבִיבֹתָיו
  choice: kumzunguka
  rationale: Ufasiri huu unaeleza kwa Kiswahili cha asili kwamba giza lilikuwa pande zote kumzunguka.
- source_word: סֻכּוֹת
  choice: mahali pa kujisitiri
  rationale: Neno la Kiebrania ni wingi na kihalisi humaanisha vibanda au sehemu za kujisitiri. Kiswahili “mahali pa kujisitiri” hutoa kazi ya taswira hiyo kwa kawaida; wingi wa Kiebrania na uwezekano wa “vibanda” umehifadhiwa katika tanbihi.
- source_word: חַשְׁרַת מַיִם
  choice: mlundikano wa maji
  rationale: Kirai hiki adimu kinaonekana kuonyesha maji yaliyokusanyika kwa wingi au kuwa tungamo. “Mlundikano wa maji” huhifadhi taswira halisi ya dhoruba bila kukifasiri moja kwa moja kuwa mawingu ya mvua.
- source_word: עָבֵי שְׁחָקִים
  choice: mawingu mazito ya angani
  rationale: עָבֵי ni mawingu mazito, na שְׁחָקִים ni anga au sehemu za juu za mbingu. Ufasiri huu ni wa kishairi lakini unaeleweka katika Kiswahili cha sasa.
