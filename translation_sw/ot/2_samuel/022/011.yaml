base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/011.yaml
  text: He rode on a cherub and flew[a]; he appeared on the wings of the wind.
translation:
  language: sw
  text: Akapanda juu ya kerubi, akaruka; akaonekana juu ya mabawa ya upepo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: Akapanda
  rationale: Kitenzi רכב hapa kina maana ya kupanda na kusafiri juu ya kiumbe; “akapanda” ni Kiswahili cha kawaida kinachohifadhi taswira hiyo.
- source_word: עַל
  choice: juu ya
  rationale: Kirai hiki huonyesha mahali au kitu kinachotegemeza; “juu ya” kinafaa katika taswira ya kupanda kerubi.
- source_word: כְּרוּב
  choice: kerubi
  rationale: “Kerubi” ni istilahi ya Biblia iliyozoeleka kwa kiumbe huyu wa mbinguni na huhifadhi rejeleo mahususi la Kiebrania.
- source_word: וַיָּעֹף
  choice: akaruka
  rationale: Kitenzi עוף maana yake ni kuruka; “akaruka” ni tafsiri ya moja kwa moja, ya asili, bila kuongeza wazo la kupaa kwa namna fulani.
- source_word: וַיֵּרָא
  choice: akaonekana
  rationale: Umbo la Nifali la ראה linaweza kumaanisha “alionekana” au “akajidhihirisha”; “akaonekana” linaakisi umbo hilo kwa karibu huku likihifadhi uwezekano wa maana ya kutokea mbele ya macho.
- source_word: כַּנְפֵי
  choice: mabawa ya
  rationale: Huu ni wingi wa hali ya kutegemea wa כָּנָף, “mabawa”; neno la kawaida la Kiswahili linahifadhi taswira ya kishairi.
- source_word: רוּחַ
  choice: upepo
  rationale: Katika muktadha huu wa teofania ya kishairi, רוּחַ humaanisha upepo kwa kawaida, si roho; hakuna haja ya kuongeza “upepo wa dhoruba.”
theological_decisions:
- issue: Kuhifadhi taswira ya kishairi ya BWANA kama shujaa wa kiungu bila kuifafanua kupita kiasi
  choice: Kudumisha picha halisi ya kupanda kerubi, kuruka, na kuonekana juu ya mabawa ya upepo.
  alternative: Kufafanua kerubi au mabawa ya upepo kama ishara tu, au kutafsiri kwa lugha ya kidhahania.
  rationale: Mstari unatumia lugha ya teofania iliyo hai. Tafsiri inapaswa kuhifadhi taswira na mvutano wake wa kitheolojia badala ya kuibadili kuwa maelezo ya kimafundisho.
- issue: Maana ya וַיֵּרָא
  choice: akaonekana
  alternative: akajidhihirisha
  rationale: Maana zote zinawezekana, lakini “akaonekana” inafuata kwa karibu Nifali ya ראה na haibainishi zaidi ya maandishi iwapo mkazo ni kuonekana na watazamaji au kujidhihirisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Muundo wa vitenzi mfululizo—“akapanda… akaruka… akaonekana”—unahifadhi mwendo na uwiano wa ushairi wa Kiebrania. Hakuna tanbihi iliyoongezwa kwa sababu “akaonekana” yenyewe huwasilisha kwa asili maana ya msingi ya וַיֵּרָא.
