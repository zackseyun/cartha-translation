translation:
  language: sw
  text: Aliinamisha mbingu, akashuka; giza nene[a] lilikuwa chini ya miguu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wingu jeusi.” Neno la Kiebrania עֲרָפֶל linaweza kumaanisha giza zito linalohusishwa na kujidhihirisha kwa BWANA.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: aliziinamisha
  rationale: Kitenzi נטה hapa kina mbingu kama yambwa na kinaonyesha Mungu akizifanya zipinde kuelekea chini. “Aliziinamisha” ni Kiswahili cha kawaida kinachohifadhi taswira hii ya kishairi.
- source_word: שָׁמַיִם
  choice: mbingu
  rationale: Wingi huu wa Kiebrania kwa kawaida humaanisha mbingu au anga. “Mbingu” inadumisha uzito wa lugha na taswira ya ulimwengu mzima katika tukio hili la kujidhihirisha kwa Mungu.
- source_word: וַיֵּרַד
  choice: akashuka
  rationale: Kitenzi ירד humaanisha kushuka. “Akashuka” ni cha moja kwa moja na kinaendeleza mfuatano wa matendo katika ushairi.
- source_word: וַעֲרָפֶל
  choice: giza nene
  rationale: עֲרָפֶל huonyesha giza zito au lenye msongamano, mara nyingi likihusishwa na kujidhihirisha kwa BWANA. “Giza nene” huhifadhi uzito na fumbo la taswira bila kuamua kwamba lazima ni wingu.
- source_word: תַּחַת
  choice: chini ya
  rationale: Hiki ni kihusishi cha mahali. “Chini ya” ni tafsiri ya kawaida na ya wazi katika Kiswahili.
- source_word: רַגְלָיו
  choice: miguu yake
  rationale: Neno la Kiebrania linamaanisha kihalisi “miguu yake.” Taswira halisi ya mwili imehifadhiwa badala ya kufasiriwa kuwa hatua au nyayo.
theological_decisions:
- issue: Taswira ya Mungu yenye sifa za kibinadamu katika kujidhihirisha kwake
  choice: 'Kuhifadhi taswira ya mwili na mahali: “akashuka” na “chini ya miguu yake.”'
  alternative: Kuilegeza kuwa lugha isiyo na taswira ya mwili, kama “alijidhihirisha kutoka mbinguni.”
  rationale: Kiebrania kinaeleza kujidhihirisha kwa Mungu kwa lugha ya kishairi yenye taswira za kibinadamu. Tafsiri haipaswi kuiondoa au kuifafanua kupita kiasi, bali idumishe mvutano kati ya ukuu wa Mungu na namna ya kuonekana kwake katika ushairi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa urahisi. Muundo mfupi wa vishazi sambamba unahifadhi mwendo na hadhi ya mstari wa Kiebrania.
