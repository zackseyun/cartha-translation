  text: Mungu anayenipa malipizo, na kuyashusha mataifa chini yangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל
  choice: Mungu
  rationale: Nomino yenye kibainishi humtaja Mungu; Kiswahili hakihitaji kibainishi tofauti hapa.
- source_word: הַנֹּתֵן נְקָמֹת לִי
  choice: anayenipa kulipiza kisasi
  rationale: 'Huhifadhi maana ya moja kwa moja ya ‘anayenipa malipizo/visasi’ huku ikitoa Kiswahili cha kawaida: Mungu humpa msemaji uwezo au nafasi ya kulipiza kisasi. Muundo wa לִי umehifadhiwa kama ‘-nipa,’ si ‘kwa ajili yangu.’'
- source_word: וּמוֹרִיד עַמִּים תַּחְתֵּנִי
  choice: na kuwaangusha watu chini yangu
  rationale: ‘Kuwaangusha’ huwasilisha הוריד katika muktadha wa kuwatiisha; ‘watu’ hapa ni makundi ya watu au mataifa, na ‘chini yangu’ huhifadhi picha ya utawala/utiisho.
theological_decisions:
- issue: Mhusika na mpokeaji wa kisasi
  choice: Mungu ‘ananipa kulipiza kisasi’
  alternative: Mungu ‘ananilipizia kisasi’
  rationale: Kiebrania kinasema kihalisi kwamba Mungu humpa msemaji נקמות, kwa hiyo tafsiri haibadilishi kimya kimya kuwa Mungu ndiye anayetekeleza kisasi kwa niaba yake.
- issue: Maana ya עַמִּים
  choice: watu
  alternative: mataifa
  rationale: ‘Watu’ huhifadhi wingi wa makundi ya kibinadamu bila kulazimisha maana ya kisiasa ya mataifa, ingawa ‘mataifa’ pia inawezekana kulingana na muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mstari umehifadhi usambamba wa kishairi na mvutano wa kauli kuhusu kisasi bila kuongeza ufafanuzi wa kimadhehebu.
