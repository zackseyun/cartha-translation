translation:
  language: sw
  text: Ndipo dunia ikayumba na kutetemeka; misingi ya mbingu ikatetemeka na kutikisika, kwa sababu alikuwa amekasirika.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַשׁ
  choice: ikayumba
  rationale: Kitenzi hiki huonyesha dunia ikitikisika au kuyumba; uchaguzi huu unatofautisha tendo hilo na יִרְגָּזוּ na kuhifadhi taswira ya msukosuko.
- source_word: וַתִּגְעַשׁ
  choice: na kutetemeka
  rationale: Huwasilisha mtikisiko mkubwa wa dunia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: מוֹסְדוֹת הַשָּׁמַיִם
  choice: misingi ya mbingu
  rationale: Tafsiri ya karibu inayohifadhi taswira ya kishairi na mtazamo wa ulimwengu wa maandishi bila kuufafanua upya.
- source_word: יִרְגָּזוּ
  choice: ikatetemeka
  rationale: Hutoa maana ya kutikisika kwa hofu au msukosuko, huku upatanisho wa kisarufi ukifuata nomino kuu ya Kiswahili 'misingi' kama kundi lisilo hai.
- source_word: וַיִּתְגָּעֲשׁוּ
  choice: na kutikiswa
  rationale: Huhifadhi hatua ya pili inayosisitiza msukosuko wa misingi, bila kuiondoa kama urudiaji usiohitajika.
- source_word: כִּי חָרָה לוֹ
  choice: kwa sababu alikuwa amekasirika
  rationale: Nahau ya Kiebrania, kihalisi kuhusu hasira kuwaka, imetolewa kwa Kiswahili asilia huku uhusiano wa sababu ukihifadhiwa.
theological_decisions:
- issue: Mhusika wa kiwakilishi katika כִּי חָרָה לוֹ
  choice: alikuwa amekasirika
  alternative: hasira yake ilikuwa imewaka
  rationale: Kiwakilishi kinaelekea kwa Bwana katika muktadha wa karibu. Tafsiri haitaji jina hapa, kwa kuwa chanzo pia kinatumia kiwakilishi, wala haipunguzi lugha ya hasira ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo sambamba na urudiaji wa mashairi ya Kiebrania umehifadhiwa.
