  text: I call on Yahweh[a], who is worthy of praise, and I am saved from my enemies.
translation:
  language: sw
  text: Ninamwita Yahweh, anayestahili kusifiwa[a], na ninaokolewa kutoka kwa adui zangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayesifiwa” au “anayepaswa kusifiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהֻלָּל
  choice: anayestahili kusifiwa
  rationale: Kitenzi-jina cha kutendwa kinamtaja Yahweh kuwa mwenye kupaswa kusifiwa. Kauli hii ni ya asili katika Kiswahili na inaonyesha maana ya sifa hiyo bila kuifanya kuwa amri.
- source_word: אֶקְרָא
  choice: ninamwita
  rationale: קרא pamoja na jina la Mungu humaanisha kumwitia au kumwomba Mungu. “Ninamwita” inadumisha taswira ya kumwita Yahweh huku ikisomeka kwa urahisi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limeandikwa kama jina binafsi “Yahweh,” badala ya kubadilishwa na cheo.
- source_word: וּמֵאֹיְבַי
  choice: nami ... kutoka kwa adui zangu
  rationale: Kiunganishi וּ kimewakilishwa kwa “nami,” na מִן kwa “kutoka kwa,” bila kuongeza wazo lisilokuwamo katika Kiebrania kama “mikononi mwa.”
- source_word: אִוָּשֵׁעַ
  choice: ninaokolewa
  rationale: Kauli ya kutendwa ya ישׁע inaeleza kuokolewa au kukombolewa. Wakati uliopo unafaa kwa usemi wa kishairi unaoeleza jambo la kawaida, ingawa umbo la Kiebrania linaweza pia kueleweka kwa mwelekeo wa wakati ujao.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina binafsi la Mungu moja kwa moja; “Yahweh” linahifadhi jina hilo badala ya kuliweka kama cheo.
- issue: Wakati wa vitenzi אֶקְרָא na אִוָּשֵׁעַ
  choice: ninamwita ... ninaokolewa
  alternative: nitamwita ... nitaokolewa
  rationale: Katika muktadha huu wa wimbo, vitenzi vya Kiebrania vinaweza kueleza tendo la kawaida au la wakati ujao. Wakati uliopo unaonyesha ushuhuda wa kawaida bila kufuta uwezekano wa maana ya wakati ujao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Sentensi imetumia “nami” ili kuhifadhi uhusiano wa vipashio viwili, na imeepuka misemo mizito au ya kidhehebu.
