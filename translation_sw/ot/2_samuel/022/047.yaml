  yaml_path: translation/ot/2_samuel/022/047.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be God, the rock of my salvation.
translation:
  language: sw
  text: 'Yahwe yu hai!


    Na abarikiwe mwamba wangu;


    na atukuzwe Mungu, mwamba wa wokovu wangu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu wa mwamba wa wokovu wangu.” Muundo wa Kiebrania אֱלֹהֵי צוּר יִשְׁעִי unaweza pia kueleweka kama “Mungu, mwamba wangu wa wokovu” au “Mungu, mwamba wangu unaookoa.”
    reason: Muundo wa maneno unaweza kusomwa kama mnyororo wa umilikaji au kwa maana ya apposition ya kishairi; יֶשַׁע pia inaweza kudokeza wokovu/kuokoa.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Yahwe yu hai
  rationale: Kirai kisicho na kitenzi katika Kiebrania ni tangazo la sifa kwamba Yahwe anaishi. “Yu hai” ni Kiswahili cha heshima, cha kawaida katika lugha ya kibiblia, na huhifadhi nguvu ya mshangao.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa moja kwa moja kama “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: וּבָרוּךְ
  choice: na abarikiwe
  rationale: 'Katika muktadha wa sifa, umbo hili lina nguvu ya tamko la kumhimidi: “na abarikiwe,” si taarifa tambarare tu kwamba amebarikiwa.'
- source_word: צוּרִי
  choice: mwamba wangu
  rationale: Neno צוּר lina maana halisi ya mwamba na hapa ni sitiari ya Mungu kuwa imara na mwenye kulinda. Sitiari hiyo imehifadhiwa badala ya kufasiriwa kuwa “kimbilio langu.”
- source_word: וְיָרֻם
  choice: na atukuzwe
  rationale: Umbo hili linaonyesha ombi au mwito wa Mungu kuinuliwa. “Atukuzwe” ni tamko la asili la Kiswahili katika sifa na huhifadhi wazo la kuinuliwa kwa heshima.
- source_word: אֱלֹהֵי צוּר יִשְׁעִי
  choice: Mungu, mwamba wa wokovu wangu
  rationale: Usambamba wa kishairi unaunga mkono kuelewa “mwamba wa wokovu wangu” kuwa maelezo ya Mungu. Alama ya mkato inaonyesha uhusiano huo bila kuondoa kabisa uwezekano wa kusoma mfululizo wa maneno ya umilikaji kwa namna nyingine.
- source_word: יֶשַׁע
  choice: wokovu
  rationale: “Wokovu” huhifadhi maana pana ya kuokoa iliyo katika יֶשַׁע; “ukombozi” au “kuokolewa” zingesisitiza zaidi tukio maalumu la kuponywa.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi jina hilo bila kulibadilisha kuwa cheo.
- issue: Sitiari ya צוּר inayomhusu Mungu
  choice: mwamba
  alternative: jabali; kimbilio
  rationale: “Mwamba” huhifadhi picha kuu ya Kiebrania ya uthabiti na ulinzi wa Mungu, bila kuifafanua kupita kiasi.
- issue: Uhusiano wa maneno katika אֱלֹהֵי צוּר יִשְׁעִי
  choice: Mungu, mwamba wa wokovu wangu
  alternative: Mungu wa mwamba wa wokovu wangu
  rationale: Usambamba na “mwamba wangu” unaunga mkono apposition, lakini muundo wa Kiebrania unaweza kusomwa rasmi kama mfululizo wa umilikaji. Utata huo umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wa heshima. Mistari mitatu imehifadhi usambamba wa wimbo. “Yu hai” na miundo “na abarikiwe/na atukuzwe” ni ya hadhi ya juu lakini bado inaeleweka kwa wasomaji wa kawaida.
