base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/019.yaml
  text: They confronted me in the day of my calamity[b][a], but Yahweh was my support.
translation:
  language: sw
  text: Walinikabili siku ya msiba wangu,[a] lakini Yahwe[b] alikuwa tegemeo langu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Walinijia” au “Walikutana nami siku ya msiba wangu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: YHWH, jina la Mungu; kwa kawaida pia hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְקַדְּמֻנִי
  choice: Walinikabili
  rationale: Kitenzi קדמ katika Piel, kikiwa na kiambishi cha nafsi ya kwanza umoja kama yambwa, hapa kina maana ya kunijia au kukutana nami kwa uhasama. “Walinikabili” kinaonyesha muktadha huo wa upinzani huku kikibaki cha kawaida katika Kiswahili.
- source_word: בְּיוֹם
  choice: siku ya
  rationale: Hiki ni kirai cha wakati. “Siku ya” ni Kiswahili cha kawaida na cha asili kuliko kuiga moja kwa moja nahau ya Kiebrania kwa “katika siku ya.”
- source_word: אֵידִי
  choice: msiba wangu
  rationale: אֵידִי huonyesha maafa, janga, au hali ya kuangamia. “Msiba wangu” linaonyesha tukio baya lililompata msemaji bila kulifupisha kuwa hisia ya dhiki pekee.
- source_word: וַיְהִי
  choice: lakini ... alikuwa
  rationale: Ingawa וַ ni kiunganishi ambacho kimsingi kinaweza kutafsiriwa “na,” muktadha unaonyesha utofautishaji kati ya mashambulizi ya adui na msaada wa Yahwe. “Lakini” huwasilisha uhusiano huo kwa Kiswahili cha asili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kama “Yahwe,” umbo linalotumika kwa kawaida katika Kiswahili kuwakilisha jina hilo la Kiebrania, badala ya kulibadili kuwa cheo.
- source_word: מִשְׁעָן
  choice: tegemeo
  rationale: מִשְׁעָן ni kitu au mtu anayetegemewa, kihalisi kama nguzo au fimbo na hapa kwa maana ya sitiari. “Tegemeo” ni neno la sasa na la kawaida linalohifadhi picha ya kumtegemea Mungu.
- source_word: לִי
  choice: langu
  rationale: Kirai cha Kiebrania kwa maana halisi ni “tegemeo kwangu.” Kiswahili cha asili hueleza uhusiano huo kwa “tegemeo langu.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi יהוה. “Yahwe” huhifadhi jina hilo badala ya kulibadili kuwa cheo “BWANA”; tanbihi inaeleza utamaduni mwingine wa tafsiri bila kuuingiza kimya kimya katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa kuwa wa asili katika Kiswahili, huku uhasama wa kitenzi cha kwanza, uzito wa “msiba,” utofautishaji wa “lakini,” na sitiari ya “tegemeo” vikihifadhiwa. Alama zote za tanbihi zimo katika matini kuu.
