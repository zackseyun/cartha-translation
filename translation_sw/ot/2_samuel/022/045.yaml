lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: Wana wa wageni
  rationale: Huhifadhi kwa kiasi kikubwa nahau ya Kiebrania ‘wana wa wageni,’ ikimaanisha watu wa mataifa ya kigeni, bila kuifanya iwe tu ‘wageni’.
- source_word: יִתְכַּחֲשׁוּ לִי
  choice: wanajifanya watiifu kwangu
  rationale: Hitpaeli ya כחש katika muktadha huu inaweza kuonyesha kujisalimisha kwa shingo upande au kutokuwa kwa unyofu. Tafsiri hii huhifadhi wazo la utii wa kujifanya badala ya kuonyesha utii wa hiari.
- source_word: לִשְׁמֹעַ אֹזֶן
  choice: mara tu wanaposikia habari zangu
  rationale: Nahau halisi ‘kwa kusikia kwa sikio’ huonyesha kwamba wanaitikia mara tu wanaposikia. ‘Habari zangu’ huweka wazi kitu kinachosikiwa bila kudai kwamba amri ilitolewa moja kwa moja.
- source_word: יִשָּׁמְעוּ לִי
  choice: wananitii
  rationale: שמע pamoja na ל mara nyingi humaanisha kusikiliza kwa kuitikia, yaani kutii; katika wimbo huu wa ushindi maana hiyo inafaa kuliko kusikia tu.
