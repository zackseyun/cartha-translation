  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanajisalimisha kwangu kwa shingo upande.” Kitenzi cha Kiebrania kinaweza kudokeza utii wa kujifanya au usio wa hiari.
