base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/016.yaml
  text: Then the channels of the sea were seen[a]; the foundations of the world were laid bare at the rebuke of Yahweh[b], at the blast of the breath of his nostrils.
translation:
  language: sw
  text: 'Ndipo mifereji ya bahari ikaonekana;

    misingi ya ulimwengu ikafunuliwa

    kwa karipio la Yahweh,

    kwa mvumo wa pumzi kutoka katika pua zake.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: ikaonekana
  rationale: Nifali ina nguvu ya kutendwa; umoja wa kisarufi unapatana na nomino ya Kiswahili “mifereji” katika ngeli ya 4, huku ukihifadhi picha ya kuwa wazi machoni.
- source_word: אֲפִקֵי יָם
  choice: mifereji ya bahari
  rationale: “Mifereji” huwasilisha njia au mikondo ya maji iliyofichuliwa bila kuibana maana kuwa chemchemi au sakafu yote ya bahari.
- source_word: יִגָּלוּ
  choice: ikafunuliwa
  rationale: Huhifadhi hali ya kutendwa ya Nifali ya גלה na usambamba wa kishairi na “ikaonekana.”
- source_word: מֹסְדוֹת תֵּבֵל
  choice: misigi ya ulimwengu
  rationale: “Misigi” ni neno la kawaida na lenye hadhi kwa foundations; “ulimwengu” huhifadhi upeo wa kishairi wa תֵּבֵל bila kulazimisha maana finyu ya nchi.
- source_word: בְּגַעֲרַת
  choice: kwa kukemewa na
  rationale: Huonyesha sababu au chombo cha tukio na kuhifadhi maana ya גערה kama tendo la kukemea kwa mamlaka.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja katika Kiebrania; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- source_word: מִנִּשְׁמַת רוּחַ אַפּוֹ
  choice: kwa mvumo wa pumzi ya puani mwake
  rationale: “Mvumo wa pumzi” huonyesha kutoa pumzi kwa nguvu, na “puani mwake” huhifadhi taswira halisi ya אַף badala ya kuigeuza kimya kuwa hasira.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano יְהוָה, si cheo; umbo “Yahweh” hulihifadhi kwa uwazi bila kuingiza desturi ya kulibadili kuwa cheo.
- issue: Maana ya אַפּוֹ katika taswira ya Mungu
  choice: puani mwake
  alternative: hasira yake
  rationale: אַף inaweza kumaanisha pua au hasira, lakini katika kirai cha pumzi inayovuma taswira ya pua ni ya moja kwa moja na inalinda lugha ya kishairi ya kibinadamu kuhusu Mungu bila kuondoa uwezekano wa dokezo la hasira.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Mistari imepangwa kuonyesha usambamba wa shairi la Kiebrania. Hakuna tanbihi iliyoongezwa kwa kuwa matini hii haina tofauti ya lazima ya kimaandishi; utata wa תבל na אף umehifadhiwa kadiri inavyowezekana katika uchaguzi wa maneno.
