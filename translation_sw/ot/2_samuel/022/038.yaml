  text: Niliwafuatia adui zangu, nikawaangamiza; wala sikurudi nyuma mpaka walipokwisha kabisa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka nilipowamaliza kabisa” / “mpaka walipofikia mwisho.” Kitenzi cha Kiebrania kinaweza kumaanisha kufikisha kitu mwisho au kukiteketeza kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרְדְּפָה
  choice: Niliwafuatilia
  rationale: Kitenzi רדף katika muktadha huu wa vita kina maana ya kuwafuata adui kwa kusudi la kuwafikia; ‘niliwafuatilia’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: אֹיְבַי
  choice: adui zangu
  rationale: Nomino אויב yenye kiambishi cha nafsi ya kwanza umoja humaanisha moja kwa moja ‘adui zangu’.
- source_word: וָאַשְׁמִידֵם
  choice: na kuwaangamiza
  rationale: Hiphil ya שׁמד huonyesha kuharibu au kuangamiza; ‘kuwaangamiza’ huhifadhi nguvu ya kauli na inafaa kwa muktadha wa kijeshi.
- source_word: וְלֹא אָשׁוּב
  choice: wala sikurudi nyuma
  rationale: שׁוב hapa inaeleweka kuwa kugeuka au kurudi nyuma wakati wa kuwafuatilia, si kurudi nyumbani tu.
- source_word: עַד כַּלּוֹתָם
  choice: mpaka walipokwisha kabisa
  rationale: כלה inaweza kumaanisha kukamilika, kwisha, au kuangamizwa kabisa. Kauli hii ya Kiswahili huhifadhi wazo la kufikia mwisho bila kulazimisha kwa uwazi ikiwa mtendaji ndiye aliyewamaliza.
