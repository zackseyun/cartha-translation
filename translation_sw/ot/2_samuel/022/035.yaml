  yaml_path: translation/ot/2_samuel/022/035.yaml
  text: He trains my hands for battle[b][a], and my arms can bend a bow of bronze.
translation:
  language: sw
  text: 'Huvizoeza viganja vyangu kwa vita[a],

    na mikono yangu huupinda upinde wa shaba[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya mapambano.”
    reason: lexical_alternative
  - marker: b
    text: Au, “upinde wa shaba hupindwa na mikono yangu.” Kiebrania kina muundo mgumu unaoweza kueleza upinde ukipindwa kwa nguvu ambazo Mungu humpa msemaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלַמֵּד
  choice: huyafundisha
  rationale: Kitenzi hiki kina maana ya kufundisha au kuzoeza. Katika muktadha wa vita, “huyafundisha” ni Kiswahili cha kawaida kinachoonyesha maandalizi ya vitendo, huku kikidumisha taswira ya mikono.
- source_word: יָדַי
  choice: mikono yangu
  rationale: Wingi wenye kiambishi cha nafsi ya kwanza umehifadhiwa ili kudumisha taswira halisi ya mwili.
- source_word: לַמִּלְחָמָה
  choice: kwa ajili ya mapambano
  rationale: מִלְחָמָה inaweza kumaanisha vita au mapambano. “Mapambano” inafaa katika sentensi hii na haifungi maana kwenye kampeni ndefu pekee.
- source_word: וְנִחַת
  choice: huupinda
  rationale: Umbo hili la Kiebrania linaweza kueleweka kwa njia tofauti kisarufi, lakini katika muktadha linaeleza upinde ukipindwa kwa nguvu za msemaji alizopewa na Mungu. Tafsiri ya moja kwa moja “huupinda” huhifadhi tendo bila kuongeza wazi dhana ya uwezo.
- source_word: קֶשֶׁת
  choice: upinde
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa silaha hii.
- source_word: נְחוּשָׁה
  choice: wa shaba
  rationale: Neno linaweza kurejelea shaba au aloi ya shaba. “Shaba” ni neno linaloeleweka kwa urahisi na linahifadhi picha ya upinde wa chuma imara.
- source_word: זְרֹעֹתַי
  choice: mikono yangu
  rationale: זְרֹעוֹת hurejelea mikono, hasa sehemu yenye nguvu ya mkono. Kiswahili cha kawaida hutumia “mikono”; muktadha wa kupinda upinde unaonyesha nguvu inayokusudiwa.
theological_decisions:
- issue: Utendaji wa Mungu katika uwezo wa vita
  choice: Mstari unamhusisha Mungu na mafunzo na nguvu za Daudi katika mapambano halisi.
  alternative: Kuufanya mstari kuwa kauli ya jumla kuhusu mapambano ya kiroho ya waamini.
  rationale: Muktadha ni wimbo wa shukrani wa kifalme kuhusu ukombozi na uwezeshaji katika vita. Tafsiri haiongezi maana ya mfano wa kiroho isiyotajwa katika mstari.
- issue: Utata wa וְנִחַת
  choice: Kutafsiri tendo kuwa “mikono yangu huupinda upinde wa shaba,” huku tanbihi ikitaja uwezekano wa kulieleza kama uwezo.
  alternative: “Mikono yangu inaweza kuupinda upinde wa shaba.”
  rationale: Kiebrania ni kigumu na kinaruhusu uchanganuzi tofauti. Matini kuu huepuka kuongeza kitenzi cha uwezo, na tanbihi huhifadhi usomaji mwingine wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi wa “mikono yangu” umehifadhiwa katika mistari yote miwili, ingawa Kiswahili hakitofautishi kwa urahisi kati ya “hands” na “arms” bila maelezo mazito. Alama zote za tanbihi zimewekwa katika matini kuu.
