revisions:
- from: Huyafundisha mikono yangu kwa ajili ya mapambano[a], na mikono yangu huupinda upinde wa shaba[b].
  to: 'Huvizoeza viganja vyangu kwa vita[a],

    na mikono yangu huupinda upinde wa shaba[b].'
  rationale: The revision uses “vita” for the explicit military sense of מלחמה and differentiates the first body-part image (“viganja vyangu,” hands) from the second (“mikono yangu,” arms) as far as natural standard Swahili allows. It retains the active main-text rendering of the difficult second clause but provides a passive alternative that more closely reflects the Hebrew construction, without asserting a doctrinal or grammatical certainty not present in the source.
