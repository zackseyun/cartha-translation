lexical_decisions:
- source_word: וַתַּזְרֵנִי
  choice: ulinivika
  rationale: Kitenzi kina picha ya kujifunga au kujiandaa kwa kazi; “ulinivika” ni Kiswahili cha kawaida kinachodumisha wazo la Mungu kumwandaa na kumwezesha msemaji.
- source_word: חַיִל
  choice: nguvu
  rationale: Katika muktadha huu neno linamaanisha uwezo au nguvu anazopewa msemaji kwa ajili ya kupigana.
- source_word: לַמִּלְחָמָה
  choice: kwa ajili ya vita
  rationale: Hii inaonyesha wazi kusudi la nguvu hizo na kutafsiri maana ya vita au mapigano kwa lugha ya kawaida.
- source_word: תַּכְרִיעַ
  choice: uliwapigisha magoti
  rationale: Hii inadumisha picha ya kitenzi cha Kiebrania cha kusababisha wapinzani wainame au wapige magoti, badala ya kuitafsiri kwa jumla tu kuwa kuwashinda.
- source_word: קָמַי
  choice: wale walioniinukia
  rationale: Tafsiri hii inadumisha taswira halisi ya watu wanaoinuka dhidi ya msemaji, yaani wapinzani wake.
- source_word: תַּחְתֵּנִי
  choice: chini yangu
  rationale: Maneno haya yanahifadhi picha ya wapinzani kutiishwa chini ya mamlaka ya msemaji.
