  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ulininadia nguvu kwa vita.” Kitenzi cha Kiebrania hasa huleta picha ya kufungwa au kutiwa mkanda wa nguvu.
