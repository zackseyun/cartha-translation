base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/003.yaml
  text: my God[a], my rock, in whom I take refuge, my shield and the horn of my salvation, my stronghold and my refuge[c][b], my savior—you save me from violence.
translation:
  language: sw
  text: Mungu wangu,[a] mwamba wangu, ambaye ninamkimbilia, ngao yangu na pembe ya wokovu wangu,[b] ngome yangu na kimbilio langu, mwokozi wangu[c]—unaniokoa kutoka katika jeuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu wa mwamba wangu.” Muundo wa Kiebrania unaweza kutafsiriwa hivyo kihalisi, lakini “Mungu wangu, mwamba wangu” unafaa zaidi katika msururu huu wa majina ya kishairi.
    reason: lexical_alternative
  - marker: b
    text: Katika Kiebrania, “pembe” ni picha ya nguvu na uwezo wa kushinda.
    reason: cultural_note
  - marker: c
    text: Au, “mkombozi wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי צוּרִי
  choice: Mungu wangu, mwamba wangu
  rationale: Muundo wa Kiebrania unaweza kueleweka kihalisi kuwa “Mungu wa mwamba wangu,” lakini katika msururu huu wa majina ya kishairi, uhusiano wa apposition unaelezwa kwa Kiswahili cha kawaida na cha asili zaidi kwa “Mungu wangu, mwamba wangu.”
- source_word: אֶחֱסֶה בוֹ
  choice: ambaye ninamkimbilia
  rationale: Kitenzi חסה humaanisha kukimbilia mahali au kwa mtu ili kupata hifadhi. Usemi huu ni wa asili katika Kiswahili na unadumisha uhusiano na majina yanayomtangulia.
- source_word: מָגִנִּי
  choice: ngao yangu
  rationale: Huhifadhi sitiari halisi ya kinga bila kuibadili kuwa maelezo ya jumla kama “mlinzi wangu.”
- source_word: קֶרֶן יִשְׁעִי
  choice: pembe ya wokovu wangu
  rationale: “Pembe” huhifadhi picha halisi ya Kiebrania ya nguvu na ushindi; “wokovu wangu” huakisi kwa karibu muundo wa nomino tegemezi.
- source_word: מִשְׂגַּבִּי
  choice: ngome yangu
  rationale: Neno hili humaanisha mahali palipoinuka na salama; “ngome” huwasilisha kwa lugha ya sasa wazo la ulinzi na usalama.
- source_word: וּמְנוּסִי
  choice: na kimbilio langu
  rationale: Nomino hii inahusiana na kukimbia ili kupata usalama. “Kimbilio” ni tafsiri fupi, ya kawaida, na sahihi.
- source_word: מֹשִׁעִי
  choice: mwokozi wangu
  rationale: Umbo hili la kishiriki kutoka ישׁע humaanisha mtu anayeokoa au kukomboa; “mwokozi wangu” ni tafsiri ya moja kwa moja na inafaa katika msururu wa majina.
- source_word: מֵחָמָס
  choice: kutoka katika ukatili
  rationale: חָמָס humaanisha jeuri, ukatili, au uovu wa kikatili. Tafsiri hii huhifadhi nomino dhahania bila kuongeza watendaji ambao hawakutajwa wazi.
- source_word: תֹּשִׁעֵנִי
  choice: unaniokoa
  rationale: Ni kitenzi cha nafsi ya pili umoja chenye yambwa ya nafsi ya kwanza umoja. Wakati wa sasa unawasilisha tendo la Mungu la kuokoa bila kubana kwa kupita kiasi hali ya kitenzi cha Kiebrania.
theological_decisions:
- issue: Msururu wa majina ya Mungu yaliyo sitiari
  choice: 'Kudumisha picha halisi: mwamba, ngao, pembe, ngome, na kimbilio'
  alternative: Kuzibadili kuwa maelezo kama “mlinzi” au “chanzo cha nguvu”
  rationale: Sitiari hizi za agano, ulinzi, na ushindi ndizo zinazoupa mstari uzito wake wa kishairi na kiteolojia; kuzifafanua badala ya kuzitafsiri kungepunguza maana yake.
- issue: Tafsiri ya מֹשִׁעִי
  choice: mwokozi wangu
  alternative: mkombozi wangu
  rationale: “Mwokozi” hutafsiri kwa uaminifu mtu anayeokoa, huku “mkombozi” pia ikiwezekana katika muktadha huu. Chaguo hili haliongezi dai lolote zaidi ya tamko la mstari kwamba Mungu humwokoa msemaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. Sitiari zote kuu zimehifadhiwa. “Ambaye ninamkimbilia” ni usemi unaoeleweka kwa wasomaji wa kawaida na unaonyesha wazi kwamba Mungu ndiye anayetoa hifadhi.
