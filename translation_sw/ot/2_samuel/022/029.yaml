lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kihusishi hiki kinaunganisha mstari na yaliyotangulia kwa kutoa msingi au ufafanuzi, bila kulazimisha maana ya kisababishi pekee.
- source_word: אַתָּה
  choice: wewe
  rationale: Ni kiwakilishi cha nafsi ya pili umoja kinachomwelekea Mungu moja kwa moja; msisitizo wake unaonekana katika muundo ‘wewe ... ndiwe.’
- source_word: נֵירִי
  choice: taa yangu
  rationale: נֵירִי humaanisha kwa msingi ‘taa yangu.’ Tafsiri hii inadumisha taswira halisi ya taa badala ya kuibadili kuwa dhana ya jumla ya nuru.
- source_word: יְהוָה / וַיהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetajwa mara mbili katika Kiebrania. ‘Yahwe’ huhifadhi jina hilo na marudio ya kishairi badala ya kuweka kiwakilishi au cheo.
- source_word: יַגִּיהַּ
  choice: huangaza
  rationale: Hifili ya נגה ina maana ya kusababisha kung'aa au kutoa nuru. ‘Huangaza’ ni ya kawaida, ya kishairi, na inadumisha maana hiyo ya kisababishi katika muktadha.
- source_word: חָשְׁכִּי
  choice: giza langu
  rationale: Nomino hii ina kiambishi cha nafsi ya kwanza umoja. ‘Giza langu’ huhifadhi usemi binafsi na sitiari bila kuamua kimbele kama giza hilo ni dhiki, hatari, au huzuni.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja na kulirudia. ‘Yahwe’ huhifadhi jina hilo la agano bila kulibadili kuwa cheo; marudio yake pia huhifadhi usambamba wa kishairi.
- issue: Taswira ya Mungu kuwa נֵירִי
  choice: taa yangu
  alternative: nuru yangu
  rationale: ‘Taa yangu’ huhifadhi sitiari halisi ya Kiebrania. ‘Nuru yangu’ inawezekana kwa maana, lakini huifanya taswira hiyo kuwa ya kidhahania zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini unaoeleweka kwa urahisi. Muundo ‘wewe, Yahwe, ndiwe’ unadumisha uzito wa kiwakilishi cha Kiebrania, huku marudio ya ‘Yahwe’ yakihifadhi usambamba wa mstari.
