  text: For you are my lamp[a], O Yahweh[b], and Yahweh lights up my darkness.
translation:
  language: sw
  text: Kwa maana wewe, Yahwe, ndiwe taa yangu[a]; Yahwe huangaza giza langu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “taa yangu”; pia yaweza kueleweka, “nuru yangu.” Kiebrania kinatumia taswira halisi ya taa.'
    reason: lexical_alternative
