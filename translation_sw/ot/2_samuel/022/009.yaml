source:
  edition: WLC
  text: עָלָ֤ה עָשָׁן֙ בְּ/אַפּ֔/וֹ וְ/אֵ֥שׁ מִ/פִּ֖י/ו תֹּאכֵ֑ל גֶּחָלִ֖ים בָּעֲר֥וּ מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/009.yaml
  text: Smoke went up from his nostrils[a], and consuming fire from his mouth; coals blazed from him.
translation:
  language: sw
  text: Moshi ulipanda kutoka puani mwake[a], na moto ulao kutoka kinywani mwake; makaa yaliwaka kutoka kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka kwenye pua yake”; neno la Kiebrania linalomaanisha “pua” au “tundu la pua” linaweza pia kutumiwa kinahau kumaanisha “hasira.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: ulipanda
  rationale: Kitenzi kinaonyesha mwendo wa kwenda juu; “ulipanda” ni Kiswahili cha kawaida kinachohifadhi picha halisi ya moshi.
- source_word: עָשָׁן
  choice: moshi
  rationale: Hili ndilo neno la kawaida na la moja kwa moja katika muktadha huu.
- source_word: בְּאַפּוֹ
  choice: kutoka puani mwake
  rationale: אַף inaweza kumaanisha pua au hasira, lakini ulinganifu wa kishairi na “kutoka kinywani mwake” unapendelea picha halisi ya moshi kutoka puani. Kihusishi kimetafsiriwa kwa maana ya chanzo kulingana na mwendo unaoelezwa.
- source_word: וְאֵשׁ
  choice: na moto
  rationale: Kiunganishi na nomino zimehifadhiwa kwa njia ya moja kwa moja.
- source_word: מִפִּיו
  choice: kutoka kinywani mwake
  rationale: Tafsiri ya moja kwa moja inayohifadhi ulinganifu na “kutoka puani mwake.”
- source_word: תֹּאכֵל
  choice: ulao
  rationale: Kitenzi kinaonyesha moto unaokula au kuteketeza. “Moto ulao” huhifadhi tamathali hai ya Kiebrania kwa Kiswahili cha kishairi na kinachoeleweka.
- source_word: גֶּחָלִים
  choice: makaa
  rationale: “Makaa” ni tafsiri ya kawaida; wazo la kuwaka tayari linaelezwa na kitenzi kinachofuata.
- source_word: בָּעֲרוּ
  choice: yaliwaka
  rationale: Neno hili huonyesha kuwaka au kuwashwa; “yaliwaka” ni la kawaida na linadumisha picha yenye nguvu.
- source_word: מִמֶּנּוּ
  choice: kutoka kwake
  rationale: Kihusishi מן hapa kinaonyesha chanzo; tafsiri hii inadumisha picha ya makaa yanayotoka kwake bila kuibadili kuwa sababu au wakala.
theological_decisions:
- issue: Lugha ya kumwelezea Mungu kwa viungo vya mwili katika udhihirisho wake
  choice: Kuhifadhi picha halisi ya “puani,” “kinywani,” na moto au moshi unaotoka kwake.
  alternative: Kutafsiri “pua” kwa maana ya nahau kama “hasira yake” na hivyo kulainisha picha.
  rationale: Mstari ni wa kishairi na unaeleza udhihirisho wa Mungu kwa picha za kibinadamu ili kuonyesha ghadhabu na nguvu zake. Kuhifadhi picha hii kunadumisha ulinganifu wa Kiebrania na mvutano wa kitheolojia bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo na picha za mstari wa Kiebrania zimehifadhiwa kadiri inavyowezekana bila kufanya sentensi kuwa ngumu.
