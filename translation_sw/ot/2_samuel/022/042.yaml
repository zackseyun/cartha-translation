  yaml_path: translation/ot/2_samuel/022/042.yaml
  text: They cried for help[a], but there was no one to save; they cried to Yahweh, but he did not answer them.
translation:
  language: sw
  text: Walitafuta msaada[a], lakini hakukuwa na mtu wa kuwaokoa; wakamlilia Yahwe, lakini hakuwajibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Walitazama.” Kitenzi hiki kinaweza kumaanisha kutazama au kutafuta msaada; katika muktadha huu, na katika sambamba ya Zaburi 18:42, kinaweza pia kueleweka kuwa kuomba msaada.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: יִשְׁעוּ
  choice: Walilia wapate msaada
  rationale: Katika muktadha wa kushindwa kupata mwokozi, kitenzi hiki kinaonyesha kutafuta msaada kwa dhiki. Tafsiri hii pia inaendana na kishazi kinachofuata kuhusu kumlilia Yahwe, huku uwezekano wa maana ya ‘kutazamia msaada’ ukihifadhiwa katika tanbihi.
- source_word: וְאֵין מֹשִׁיעַ
  choice: lakini hapakuwa na mtu wa kuwaokoa
  rationale: מֹשִׁיעַ ni kitenzi-shirikishi kinachomaanisha mtu anayeokoa au kukomboa. Kauli hii ya kawaida huepuka kukifanya kuwa cheo maalumu; ‘lakini’ huonyesha wazi matokeo yaliyo kinyume na ombi lao.
- source_word: אֶל יְהוָה
  choice: walimlilia Yahwe
  rationale: Kihusishi אֶל kinaonyesha yule aliyeelekezewa ombi. Kitenzi kutoka kishazi cha kwanza kimerudiwa kwa Kiswahili ili usambamba wa sentensi uwe wazi na wa kawaida.
- source_word: וְלֹא עָנָם
  choice: lakini hakuwajibu
  rationale: ענה hapa humaanisha kujibu. Kiambishi cha nafsi ya tatu wingi kimetafsiriwa ‘-wa-’, na mtenda anayeeleweka kutokana na kishazi kilichotangulia ni Yahwe.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja. ‘Yahwe’ ni umbo la Kiswahili linalotambulika na huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Yahwe kutowajibu maadui
  choice: lakini hakuwajibu
  alternative: lakini hawakupata jibu
  rationale: Kitenzi cha Kiebrania kinamtaja Yahwe kwa njia ya kisarufi kuwa ndiye asiyewajibu. Tafsiri haifichi kauli hiyo wala kuongeza sababu ya kutowajibu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Mtu wa kuwaokoa’ ni ya kawaida kuliko kutumia ‘mwokozi’ kama cheo, na marudio ya ‘walimlilia’ yanaweka wazi usambamba wa kishairi.
