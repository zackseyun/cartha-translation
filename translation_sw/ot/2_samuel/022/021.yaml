base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/021.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: sw
  text: Yahwe amenitendea[a] kwa kadiri ya uadilifu wangu; amenilipa kwa kadiri ya usafi wa mikono yangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amenituza.” Kitenzi cha Kiebrania kinaweza kumaanisha kumtendea mtu au kumpa malipo kulingana na mwenendo wake.
    reason: lexical_alternative
  - marker: b
    text: “Usafi wa mikono yangu” ni nahau ya Kiebrania inayomaanisha kutokuwa na hatia au kuwa safi katika matendo.
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: amenitendea
  rationale: Kitenzi גמל kinaweza kumaanisha kumtendea mtu au kumpa malipo yanayolingana na mwenendo wake. “Amenitendea” kinahifadhi upana huo wa maana, huku ubeti sambamba ukionyesha kuwa hapa matokeo ni mema.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: כְּצִדְקָתִי
  choice: sawasawa na haki yangu
  rationale: צדקה hapa inaeleza unyofu au mwenendo ulio sawa wa msemaji. “Sawasawa na” linaonyesha kipimo au ulinganifu unaoletwa na kiambishi כְּ.
- source_word: כְּבֹר
  choice: sawasawa na usafi
  rationale: בֹּר humaanisha usafi au kutokuwa na uchafu. “Usafi” linadumisha taswira halisi ya mikono safi bila kuibadili moja kwa moja kuwa lugha ya kisheria.
- source_word: יָדַי
  choice: wa mikono yangu
  rationale: Usemi “usafi wa mikono yangu” unahifadhi sitiari ya Kiebrania inayohusu kutokuwa na hatia au kuwa safi katika matendo.
- source_word: יָשִׁיב לִי
  choice: amenilipa
  rationale: Hifili ya שוב hapa ina maana ya kurudishia au kulipa mtu kulingana na alichofanya. “Amenilipa” ni ya kawaida katika Kiswahili na inaendeleza usambamba wa kishairi.
theological_decisions:
- issue: Ikiwa kauli hii ielezwe kana kwamba inadai ukamilifu usio na dhambi au kustahili wokovu mbele za Mungu
  choice: Kauli ya Daudi kuhusu haki yake na usafi wa matendo yake imetafsiriwa moja kwa moja bila kupunguzwa.
  alternative: Kuibadili ili kuepuka lugha ya haki binafsi, au kuifanya idai ukamilifu kamili usio na dhambi na wokovu kwa matendo.
  rationale: Kiebrania kinatumia wazi nafsi ya kwanza kuhusu haki na mikono safi. Tafsiri inadumisha mvutano huo bila kuongeza dai pana kuhusu kutokuwa na dhambi kabisa au kustahili wokovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. “Sawasawa na” limetumiwa katika mistari yote miwili ili kudumisha usambamba wa Kiebrania; sitiari ya mikono safi imehifadhiwa na kufafanuliwa katika tanbihi.
