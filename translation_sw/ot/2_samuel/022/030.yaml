  text: Kwa maana, kwa msaada wako[a] naweza kulikimbilia kikosi[b]; kwa msaada wa Mungu wangu naweza kuruka juu ya ukuta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja nawe” au “kupitia kwako”; kihusishi cha Kiebrania kinaweza kuonyesha kuandamana au njia. Hapa kimetafsiriwa kuwa msaada unaomwezesha msemaji.
    reason: lexical_alternative
  - marker: b
