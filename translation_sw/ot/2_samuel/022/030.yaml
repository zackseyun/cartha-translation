lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza msingi wa ushuhuda uliotangulia; “kwa maana” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: בְכָה
  choice: kwa msaada wako
  rationale: Herufi ב inaweza kuonyesha njia, chombo, au kuandamana. Katika muktadha huu, “kwa msaada wako” huonyesha kwa uwazi kwamba Mungu ndiye anayemwezesha msemaji bila kuondoa uwezekano wa maana nyingine.
- source_word: אָרוּץ
  choice: naweza kulishambulia
  rationale: Kitenzi cha wakati usiotimilika katika ushairi huu kinaweza kueleza uwezo unaotolewa na Mungu. Pamoja na גְּדוּד, maana ya kukimbilia au kulishambulia kundi la kijeshi inatolewa kwa Kiswahili cha asili.
- source_word: גְּדוּד
  choice: kundi la askari
  rationale: Neno hili kwa kawaida humaanisha kikosi, kundi la askari, au kundi la wavamizi. “Kundi la askari” linaeleweka kwa urahisi na huhifadhi taswira ya kivita.
- source_word: בֵּאלֹהַי
  choice: kwa msaada wa Mungu wangu
  rationale: Muundo unaorudiwa unasisitiza kwamba uwezo unatoka kwa Mungu, huku “Mungu wangu” ikihifadhi sauti ya uhusiano wa kibinafsi.
- source_word: אֲדַלֶּג
  choice: naweza kuruka
  rationale: Piel ya דלג humaanisha kuruka au kup跃uka; katika muktadha huu hali ya kutotimilika inaeleweka vizuri kama uwezo unaowezeshwa.
- source_word: שׁוּר
  choice: ukuta
  rationale: Neno hili hutaja ukuta, hasa wa ulinzi. “Ukuta” ni tafsiri ya moja kwa moja na ya kawaida; “boma la ulinzi” linaweza kufafanua zaidi taswira hiyo.
theological_decisions:
- issue: Uwezeshaji wa Mungu katika taswira ya vita
  choice: Vitenzi vimetafsiriwa kuwa “naweza kulishambulia” na “naweza kuruka,” vikionyesha uwezo unaotokana na msaada wa Mungu.
  alternative: 'Kauli rahisi za tendo: “nalishambulia” na “naruka,” bila kutaja uwezo waziwazi.'
  rationale: Katika ushairi huu, vitenzi vya Kiebrania vya hali isiyotimilika vinaweza kueleza uwezo au uzoefu unaorudiwa. Tafsiri hii hudumisha msisitizo kwamba ushindi unatokana na Mungu bila kuongeza dai pana la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye heshima. Marudio ya “kwa msaada...” yanadumisha usambamba wa mistari ya Kiebrania. “Kulishambulia” linaweka wazi mwelekeo wa אָרוּץ kwa גְּדוּד, ambao usingekuwa wa kawaida ukitafsiriwa neno kwa neno kama “kulikimbia kundi.”
