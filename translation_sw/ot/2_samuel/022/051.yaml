base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/051.yaml
  text: He gives great salvation to his king and shows covenant faithfulness to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: sw
  text: Humpa mfalme wake wokovu mkuu[a], naye humwonyesha mtiwa-mafuta wake fadhili za agano[b]—Daudi na uzao wake milele.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukombozi mkuu,” “matendo makuu ya wokovu,” au “ushindi mwingi” kwa mfalme wake.
    reason: lexical_alternative
  - marker: b
    text: Au, “upendo thabiti” au “upendo wa kudumu.” Neno la Kiebrania mara nyingi humaanisha upendo wenye ushikamanifu na uaminifu wa agano.
    reason: lexical_alternative
  - marker: c
    text: “Mtiwa-mafuta wake” pia kinaweza kutafsiriwa “Masihi wake.” Hapa kwanza kinamhusu Daudi, yaani mfalme wa ukoo wa Daudi, huku kikidokeza pia ahadi pana ya Kimasihi.
    reason: alternative_reading
lexical_decisions:
- source_word: מגדיל
  choice: Humpa ... mkuu
  rationale: Hii ni kauli ya kisababishi yenye maana halisi ya ‘kufanya kuwa mkuu.’ Katika muunganiko huu na ‘wokovu,’ Kiswahili cha kawaida na fasaha hutumia ‘humpa ... wokovu mkuu,’ bila kupoteza wazo la ukubwa wa matendo ya Mungu ya kuokoa.
- source_word: יְשׁוּעוֹת
  choice: wokovu
  rationale: Nomino ya Kiebrania iko katika wingi na inaweza kumaanisha matendo ya kuokoa, ukombozi mbalimbali, au ushindi. ‘Wokovu’ hutumika kwa maana ya jumla katika Kiswahili; wingi wa matendo umewekwa katika tanbihi.
- source_word: מַלְכּוֹ
  choice: mfalme wake
  rationale: Huhifadhi moja kwa moja kiambishi cha nafsi ya tatu umoja na uhusiano kati ya BWANA na mfalme wa ukoo wa Daudi.
- source_word: וְעֹשֶׂה חֶסֶד
  choice: naye humwonyesha mwaminifu wa agano
  rationale: חסד katika muktadha huu wa kifalme hudokeza upendo thabiti na uaminifu wa Mungu kwa ahadi za agano. Kauli hii inaeleweka kwa msomaji wa sasa na huhifadhi uzito wa kiagano.
- source_word: לִמְשִׁיחוֹ
  choice: mtiwa-mafuta wake
  rationale: Huhifadhi maana ya msingi ya ‘aliyetiwa mafuta’ na rejeo lake la kwanza kwa Daudi/mfalme wa ukoo wake, bila kulazimisha mapema cheo maalumu ‘Masihi.’
- source_word: לְדָוִד
  choice: Daudi
  rationale: Jina la mtu limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: וּלְזַרְעוֹ
  choice: na uzao wake
  rationale: ‘Uzao’ huhifadhi umoja wa kijumla wa זרע pamoja na mwangwi wake wa kiagano kuliko ‘wazao,’ ingawa neno hilo linaweza kuhusisha vizazi vingi.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Ni tafsiri ya kawaida, wazi, na yenye hadhi ya wazo la kudumu bila mwisho katika ahadi ya agano.
theological_decisions:
- issue: Tafsiri ya חסד katika muktadha wa agano la Daudi
  choice: mwaminifu wa agano
  alternative: upendo thabiti / upendo wa kudumu
  rationale: Mstari unasisitiza ushikamanifu wa Mungu kwa mfalme na uzao wake kulingana na ahadi ya agano. ‘Mwaminifu wa agano’ huonyesha upande wa uaminifu bila kuondoa uwezekano wa kutafsiri neno hilo kuwa upendo thabiti.
- issue: Tafsiri ya מְשִׁיחוֹ
  choice: mtiwa-mafuta wake
  alternative: Masihi wake
  rationale: Katika muktadha wa kwanza neno hilo linamhusu Daudi, mfalme aliyetiwa mafuta. Tafsiri kuu huhifadhi maana hiyo ya kihistoria na mwangwi mpana wa Kimasihi bila kuifanya ‘Masihi’ kuwa rejeo pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni wa kawaida kwa usomaji wa hadhara. Alama ya mkato mrefu kabla ya ‘Daudi’ inaonyesha kwamba Daudi na uzao wake wanafafanua walengwa wa uaminifu huo, huku sintaksia ya Kiebrania ikihifadhiwa kwa kiasi cha kutosha.
