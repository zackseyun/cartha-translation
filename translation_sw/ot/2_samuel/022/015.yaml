  yaml_path: translation/ot/2_samuel/022/015.yaml
  text: He sent arrows and scattered them; lightning[a], and threw them into confusion.
translation:
  language: sw
  text: Akatuma mishale, akawatawanya; na umeme, akawavuruga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Akatuma
  rationale: Kitenzi שלח kimsingi humaanisha ‘kutuma.’ Chaguo hili linahifadhi taswira ya kishairi bila kufafanua kupita kiasi kwamba mishale ‘ilipigwa’.
- source_word: חִצִּים
  choice: mishale
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa חִצִּים, nalo linahifadhi taswira halisi ya vita.
- source_word: וַיְפִיצֵם
  choice: akawatawanya
  rationale: Kitenzi hiki kina maana ya kusababisha watu watawanyike. Kiambishi cha nafsi ya tatu wingi kinaelekezwa kwa maadui wanaoeleweka kutokana na muktadha.
- source_word: בָּרָק
  choice: radi
  rationale: בָּרָק humaanisha radi au mwanga wa radi. ‘Radi’ ni neno la kawaida la Kiswahili linalofaa taswira ya silaha ya Mungu katika ushairi huu.
- source_word: וַיְהֻמֵּם
  choice: akawavuruga
  rationale: Kutokana na המם, kitenzi hiki huonyesha kuwatia watu katika vurugu au mkanganyiko. ‘Akawavuruga’ kinahifadhi nguvu ya kisababishi na pia ufupi wa mstari wa kishairi.
theological_decisions:
- issue: Wanaorejelewa na viambishi vya ‘akawatawanya’ na ‘akawavuruga’
  choice: Viambishi vinawarejelea maadui au wapinzani wanaoeleweka katika muktadha mpana wa wimbo.
  alternative: Warejelewa wanaweza kuachwa waeleweke tu kutokana na muktadha bila kutajwa wazi kuwa ni maadui.
  rationale: Kiebrania kina viambishi vya nafsi ya tatu wingi, na muktadha wa Mungu kupigana dhidi ya wapinzani wa Daudi unafanya maadui kuwa warejelewa wa kawaida zaidi. Tafsiri ya Kiswahili inahifadhi viambishi hivyo bila kuongeza nomino ‘maadui’ katika mstari.
- issue: Muundo uliodondosha kitenzi kabla ya ‘radi’
  choice: 'Kudumisha usemi mfupi wa kishairi: ‘radi, akawavuruga.’'
  alternative: Kuongeza ‘akatuma’ au ‘akatupa’ kabla ya ‘radi’ ili sentensi iwe wazi zaidi.
  rationale: Kiebrania hakirudii kitenzi ‘akatuma’ kabla ya בָּרָק. Muundo mfupi unahifadhi msongamano na mvutano wa kishairi badala ya kufafanua uhusiano huo kimyakimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo sambamba na mfupi umehifadhiwa; ‘radi’ limetumiwa badala ya neno la kiteknolojia zaidi ‘umeme.’
