  source_fidelity: Neno „radi” kwa kawaida humaanisha ngurumo katika Kiswahili sanifu, ilhali בָּרָק ni mmweko/umeme wa radi, yaani lightning. „Umeme” huwakilisha taswira ya Kiebrania kwa usahihi zaidi. Viambishi vya wingi katika „akawatawanya” na „akawavuruga” vinahifadhi warejelewa wa Kiebrania wanaoeleweka kutokana na muktadha.
