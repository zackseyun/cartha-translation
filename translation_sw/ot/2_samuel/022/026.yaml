translation:
  language: sw
  text: Kwa mwaminifu unajionyesha mwaminifu; kwa shujaa asiye na lawama unajionyesha usiye na lawama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָסִיד
  choice: mwaminifu
  rationale: Katika muktadha huu neno linaeleza mtu mwenye uaminifu thabiti katika uhusiano; ‘mwaminifu’ ni la kawaida na huhifadhi mwangwi wa tendo linalofuata.
- source_word: תִּתְחַסָּד
  choice: unajionyesha mwaminifu
  rationale: Umbo la kitenzi linaonyesha jinsi Mungu anavyojitokeza au kujitendea kwa mtu huyo; usemi huu pia unahifadhi urudiaji wa mzizi wa Kiebrania.
- source_word: גִּבּוֹר
  choice: shujaa
  rationale: Neno humaanisha mtu mwenye nguvu au hodari, mara nyingi mpiganaji; ‘shujaa’ linafaa hapa bila kuongeza jinsia katika tafsiri.
- source_word: תָּמִים
  choice: asiye na lawama
  rationale: Huonyesha ukamilifu wa mwenendo au uadilifu, si kutokuwa na dhambi kabisa; ‘asiye na lawama’ ni usemi wa kawaida wa kibiblia.
- source_word: תִּתַּמָּם
  choice: unajionyesha bila lawama
  rationale: Huhifadhi ulinganifu na mchezo wa mzizi תמים kati ya sifa ya mtu na jinsi Mungu anavyojionyesha kwake.
theological_decisions:
- issue: Maana ya ulinganifu kati ya tabia ya mtu na jinsi Mungu anavyojionyesha
  choice: Kuhifadhi kauli ‘unajionyesha’ bila kueleza zaidi aina ya mwitikio wa Mungu
  alternative: ‘unamtendea kwa uaminifu’ / ‘unakuwa mkamilifu kwake’
  rationale: Kiebrania kina lugha ya kujirudia yenye uwezekano wa kueleza kujidhihirisha au kujitenda kwa namna inayolingana. Tafsiri haipaswi kuamua kimya kimya kama mstari unazungumzia tu malipo, agano, au sifa ya Mungu kwa nafsi yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Ulinganifu wa kishairi na urudiaji wa maneno ‘mwaminifu’ na ‘bila lawama’ umehifadhiwa.
