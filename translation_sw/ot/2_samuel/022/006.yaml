  yaml_path: translation/ot/2_samuel/022/006.yaml
  text: The cords of Sheol surrounded me[b][a]; the snares of death confronted me.
translation:
  language: sw
  text: Kamba za Sheoli zilinizunguka[a]; mitego ya mauti ilinikabili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kaburi” au “ulimwengu wa wafu” badala ya “Sheoli.”
    reason: alternative_reading
  - marker: b
    text: Au “ilinikuta” au “ilijitokeza mbele yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי
  choice: Kamba za
  rationale: Neno hili linaweza kumaanisha kamba au vifungo; “kamba” inadumisha taswira ya kishairi ya kunaswa na inaendana na “mitego” katika mstari unaofuata.
- source_word: שְׁאוֹל
  choice: Sheoli
  rationale: Jina la Kiebrania la makao au ulimwengu wa wafu limedumishwa kwa umbo la Kiswahili ili kutoifupisha maana yake kuwa kaburi pekee.
- source_word: סַבֻּנִי
  choice: zilinizunguka
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya wazo la kuzunguka au kuzingira.
- source_word: קִדְּמֻנִי
  choice: ilinikabili
  rationale: Katika muktadha huu wa hatari yenye uadui, kitenzi kinaeleza kukutana na msemaji au kujitokeza mbele yake; “ilinikabili” huhifadhi mkabala huo bila kudai kwamba mitego ilimpata.
- source_word: מֹקְשֵׁי
  choice: mitego ya
  rationale: Neno humaanisha mitego au tanzi; “mitego” ni la kawaida, wazi, na linafaa katika usambamba wa kishairi.
- source_word: מָוֶת
  choice: mauti
  rationale: “Mauti” ni neno la Kiswahili lenye hadhi ya kishairi linalotafsiri nomino “kifo” bila kuipanua kimafundisho.
theological_decisions:
- issue: Tafsiri ya שְׁאוֹל
  choice: Sheoli
  alternative: kaburi; ulimwengu wa wafu
  rationale: Kudumisha jina hilo kunahifadhi upana na mvutano wa dhana ya Kiebrania, ambayo inaweza kuelekeza kwenye kaburi, hali ya kifo, au makao ya wafu, bila kuamua maana moja kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Sheoli” ni umbo linalosomeka kwa urahisi katika Kiswahili; “mauti” hudumisha uzito na usambamba wa shairi. Mpangilio wa alama za tanbihi umewekwa karibu na maneno yanayohusika.
