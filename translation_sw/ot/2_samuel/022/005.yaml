base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/005.yaml
  text: For the waves of death surrounded me[b][a]; the torrents of worthlessness terrified me.
translation:
  language: sw
  text: Kwa maana mawimbi ya mauti[a] yalinizunguka; mafuriko ya uovu[b] yalinitisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza pia kutafsiriwa “mawimbi yanayovunjika kwa nguvu” au “mawimbi makubwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mafuriko ya Beliali,” ikiwa בְלִיַּעַל litaeleweka kuwa jina maalumu badala ya “uovu.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kishazi hiki kinatoa sababu au ufafanuzi wa kauli iliyotangulia; “Kwa maana” linaonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: אֲפָפֻנִי
  choice: yalinizunguka
  rationale: Kitenzi kinaonyesha kuzingirwa au kufunikwa pande zote, na “yalinizunguka” ni wazi na cha asili.
- source_word: מִשְׁבְּרֵי
  choice: mawimbi
  rationale: Neno hilo humaanisha mawimbi yanayovunjika kwa nguvu. “Mawimbi” linadumisha taswira ya maji kwa lugha ya kawaida, huku maana mahsusi zaidi ikihifadhiwa katika tanbihi.
- source_word: מָוֶת
  choice: mauti
  rationale: “Mauti” linafaa katika ushairi huu mtukufu na linawakilisha moja kwa moja tishio la kifo.
- source_word: נַחֲלֵי
  choice: mafuriko
  rationale: Ingawa neno linaweza kumaanisha vijito au mito ya msimu, hapa usambamba wa kishairi unaonyesha maji yanayotiririka kwa nguvu na kutisha; “mafuriko” yanawasilisha nguvu hiyo kwa ufasaha.
- source_word: בְלִיַּעַל
  choice: uovu
  rationale: Katika muktadha huu wa kishairi, neno linaeleweka kwa kawaida kama nomino ya hali inayomaanisha ubaya, upotovu, au kutokuwa na thamani, si lazima jina la kiumbe. “Uovu” ni la asili na linaonyesha nguvu ovu zinazotishia.
- source_word: יְבַעֲתֻנִי
  choice: yalinitisha
  rationale: Kitenzi kinaonyesha kutiwa hofu kuu au kufadhaishwa ghafla; “yalinitisha” ni usemi wa moja kwa moja na wa kawaida.
theological_decisions:
- issue: Iwapo בְלִיַּעַל litafsiriwe kama jina maalumu “Beliali” au kama nomino ya kawaida
  choice: Katika matini kuu limetafsiriwa kama nomino ya kawaida “uovu.”
  alternative: mafuriko ya Beliali
  rationale: Katika ushairi huu neno linalingana na maji yenye nguvu yanayoleta maangamizi. Kulifanya jina maalumu kungedokeza dhana ya baadaye ya kiumbe wa kipepo ambayo si lazima katika muktadha huu; hata hivyo, uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. “Mauti” limetumiwa kwa uzito wa kishairi, huku miundo mingine ikibaki ya kawaida na ya sasa.
