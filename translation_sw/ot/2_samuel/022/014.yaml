  text: Yahwe alinguruma kutoka mbinguni, naye Aliye Juu Zaidi akatoa sauti yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “akatoa sauti yake.” Huu ni msemo wa kishairi unaolingana na “alinguruma”; pia unaweza kutafsiriwa, “akaitoa sauti yake.”
