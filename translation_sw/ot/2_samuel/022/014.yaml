lexical_decisions:
- source_word: יַרְעֵם
  choice: alinguruma
  rationale: Kitenzi hiki katika muktadha wa dhoruba kinaonyesha kutoa ngurumo. “Alinguruma” ni Kiswahili cha kawaida kinachohifadhi picha ya kishairi bila kuifanya kuwa maelezo marefu kama “alisababisha radi ingurume.”
- source_word: מִן שָׁמַיִם
  choice: kutoka mbinguni
  rationale: Katika muktadha wa Mungu kujidhihirisha, “mbinguni” huhifadhi maana ya mahali pa juu na ya kimungu; ni ya kawaida zaidi kuliko “kutoka katika mbingu.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo kama “BWANA.” Umbo “Yahwe” linafuata tahajia ya Kiswahili.
- source_word: וְעֶלְיוֹן
  choice: naye Aliye Juu Zaidi
  rationale: Hiki ni cheo cha Mungu kinachosawazishwa kishairi na “Yahwe.” “Aliye Juu Zaidi” kinaeleweka kwa urahisi na kuhifadhi nguvu ya daraja la juu kabisa.
- source_word: יִתֵּן קוֹלוֹ
  choice: akatoa sauti yake
  rationale: Tafsiri hii inafuata kwa karibu msemo halisi wa Kiebrania, “alitoa sauti yake,” huku ikiwa ya asili katika Kiswahili na kudumisha usambamba wake na “alinguruma.”
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini inatumia moja kwa moja jina la agano la Mungu. Kulihifadhi kama jina binafsi huepuka kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya יְהוָה na עֶלְיוֹן
  choice: Yahwe na Aliye Juu Zaidi wamewasilishwa kama marejeo sambamba ya kishairi kwa Mungu yuleyule.
  alternative: Kuchukulia “Aliye Juu Zaidi” kama jina tofauti lisilosisitiza usambamba huo.
  rationale: Mistari miwili ya ushairi inalinganisha kutenda kwa Yahwe na kwa Aliye Juu Zaidi. Tafsiri inadumisha usambamba huo bila kuongeza maelezo ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Naye” huunganisha mistari sambamba kwa ulaini, na “akatoa sauti yake” huhifadhi taswira ya kishairi bila kuwa ngumu kueleweka.
