lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: Aliniokoa
  rationale: Kitenzi נצל katika hifili kina maana ya kuokoa au kukomboa kutoka hatarini; wakati uliopita unafaa katika simulizi ya ushuhuda wa wimbo.
- source_word: אֹיְבִי עָז
  choice: adui yangu mwenye nguvu
  rationale: עָז humfafanua adui kuwa mwenye nguvu; tafsiri hii ni ya kawaida na huhifadhi maana bila kuzidisha kuwa 'mwenye uwezo wote'.
- source_word: מִשֹּׂנְאַי
  choice: kutoka kwa wale walionichukia
  rationale: Umbo la wingi la kitenzi-partisipio linarejelea watu wanaomchukia msemaji; kishazi hiki ni cha asili katika Kiswahili.
- source_word: אָמְצוּ מִמֶּנִּי
  choice: walikuwa na nguvu kuliko mimi
  rationale: Kishazi kinaonyesha kuwa waliomchukia walimzidi msemaji kwa nguvu; 'kuliko mimi' huwasilisha ulinganisho wa מִמֶּנִּי kwa uwazi.
