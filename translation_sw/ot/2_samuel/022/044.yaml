base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/044.yaml
  text: You delivered me from the strivings of my people[a]; you kept me as the head of nations[c][b]; a people I had not known served me.
translation:
  language: sw
  text: Umeniokoa kutokana na migogoro ya watu wangu[a]; umenihifadhi kuwa kichwa cha mataifa[b]; watu ambao sikuwajua walinitumikia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutokana na mabishano ya watu wangu.” Kiebrania kinaweza kumaanisha migogoro ya ndani miongoni mwa watu wa Daudi au migogoro iliyowahusu.
    reason: lexical_alternative
  - marker: b
    text: Au, “umenihifadhi kuwa mkuu wa mataifa.”
    reason: lexical_alternative
  - marker: c
    text: Au, “watu ambao sikuwajua watan itumikia.” Kitenzi cha Kiebrania kinaweza kuwa na maana ya wakati ujao katika ushairi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּפַלְּטֵנִי
  choice: Umeniokoa
  rationale: Kitenzi פלט katika Hiphil kinaeleza kusababisha mtu aponyoke au aokolewe. “Umeniokoa” ni Kiswahili cha kawaida na chenye hadhi kinachofaa wimbo wa ukombozi.
- source_word: מֵרִיבֵי עַמִּי
  choice: na migogoro ya watu wangu
  rationale: רִיב inaweza kumaanisha ugomvi, mabishano, au migogoro. “Migogoro” huhifadhi upana huo, huku “ya watu wangu” ikiacha wazi kama ni migogoro ya ndani ya watu wa Daudi au migogoro inayowahusu.
- source_word: תִּשְׁמְרֵנִי
  choice: umenihifadhi
  rationale: שׁמר humaanisha kulinda, kutunza, au kuhifadhi. “Umenihifadhi” linaonyesha kwamba Mungu aliendelea kumlinda mfalme katika nafasi yake bila kubadili kitenzi kuwa “uliniweka.”
- source_word: לְרֹאשׁ גּוֹיִם
  choice: kuwa kichwa cha mataifa
  rationale: רֹאשׁ ni “kichwa” kwa maana ya mfano ya mkuu au kiongozi. Tafsiri hii inahifadhi sitiari ya Kiebrania, na לְ inaonyesha nafasi au matokeo.
- source_word: גּוֹיִם
  choice: mataifa
  rationale: Katika muktadha huu wa kifalme, גּוֹיִם ni mataifa au makundi ya watu yaliyo nje ya Israeli. “Mataifa” ni wazi na hayaingizi matumizi ya baadaye ya kidini ya neno “Mataifa.”
- source_word: עַם לֹא יָדַעְתִּי
  choice: watu ambao sikuwajua
  rationale: עַם ni nomino ya umoja yenye maana ya mkusanyiko. Kiswahili cha asili hutumia “watu” pamoja na upatanisho wa wingi; “sikuwajua” linaonyesha kutokuwa na uhusiano au ufahamu wao hapo awali.
- source_word: יַעַבְדֻנִי
  choice: walinitumikia
  rationale: עבד hapa ina maana ya kutumikia au kuwa chini ya mamlaka ya mfalme. Wakati uliopita unafaa mtazamo wa wimbo unaosimulia matendo ya Mungu, bila kuficha uwezekano wa maana ya wakati ujao katika imperfecti ya kishairi.
theological_decisions:
- issue: Lugha ya kifalme kuhusu kutawala mataifa ya kigeni
  choice: Kudumisha maana ya kihistoria ya Daudi kama mfalme bila kuongeza wazi tafsiri ya Kimasihi katika mstari mkuu.
  alternative: Kuutafsiri mstari moja kwa moja kuwa unabii wa Kimasihi.
  rationale: Muktadha wa karibu ni wimbo wa Daudi kuhusu kuokolewa na ufalme wake. Umuhimu mpana wa kikanoni unaweza kujadiliwa kwingine, lakini tafsiri ya mstari inapaswa kwanza kuwakilisha maana ya Kiebrania katika muktadha wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kishairi na hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari “kichwa cha mataifa” imehifadhiwa kwa uaminifu kwa chanzo; mbadala wa kawaida zaidi, “mkuu wa mataifa,” umetolewa katika tanbihi. Katika tanbihi [c], maana iliyokusudiwa ni huduma au utiifu wa kisiasa.
