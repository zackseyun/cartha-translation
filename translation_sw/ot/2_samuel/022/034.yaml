  text: Huifanya miguu yangu iwe kama ya kulungu jike[a], na huniweka imara juu ya miinuko yangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho mahususi wa mnyama wa Kiebrania hauna uhakika; inaweza kumaanisha kulungu jike au mnyama wa aina inayofanana.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa tafsiri ya karibu zaidi: “hunisimamisha juu ya miinuko yangu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁוֶּה
  choice: Huifanya ... iwe kama
  rationale: Kauli ya kusababisha katika Piel inaonyesha kwamba Mungu anaifanya miguu ya msemaji ifanane na ya kulungu; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: רגלי/ו
  choice: miguu yangu
  rationale: Muktadha wa nafsi ya kwanza katika kishazi kinachofuata (יַעֲמִדֵנִי, ‘huniweka/hunisimamisha’) na בָּמוֹתַי (‘miinuko yangu’) unaunga mkono ‘miguu yangu,’ ambayo pia inadumisha mshikamano wa sauti ya msemaji.
- source_word: כָּאַיָּלוֹת
  choice: kama ya kulungu jike
  rationale: Nomino ya Kiebrania ni ya kike na iko katika wingi, ikirejelea kulungu wa kike wanaojulikana kwa wepesi na uwezo wa kukanyaga kwa uthabiti. Kiswahili hutumia umbo lilelile la nomino katika umoja na wingi, huku ‘jike’ ikihifadhi jinsia ya picha hiyo.
- source_word: בָּמוֹתַי
  choice: miinuko yangu
  rationale: Neno hilo linamaanisha sehemu au mahali pa juu. ‘Miinuko yangu’ huhifadhi wingi, umilikaji, na taswira ya kishairi bila kuleta maana ya kiibada ya ‘mahali pa juu.’
- source_word: יַעֲמִדֵנִי
  choice: huniweka imara
  rationale: Hiphil ya עמד ni ‘husababisha kusimama’ au ‘huweka.’ Katika taswira ya kusimama kwenye miinuko, ‘huniweka imara’ hutoa kwa Kiswahili maana ya uthabiti inayodokezwa na muktadha bila kupoteza tendo la Mungu la kumweka msemaji.
