  text: With the pure you show yourself pure[a], but with the crooked you show yourself twisted.
translation:
  language: sw
  text: Kwa mtu safi unajionyesha kuwa safi, lakini kwa mtu mpotovu unajionyesha kuwa wa kupindapinda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unamkabili kwa ujanja,” au “unajionyesha kuwa mgumu.” Kitenzi cha Kiebrania ni nadra na maana yake si hakika; huenda kinaeleza jinsi Mungu anavyomjibu mtu mpotovu kwa namna inayolingana na upotovu wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: safi
  rationale: Neno hili linaonyesha usafi au kutokuwa na doa. “Safi” ni la kawaida katika Kiswahili na linawezesha kurudia mzizi wa wazo hilo katika kitenzi kinachofuata.
- source_word: תִּתָּבָר
  choice: unajionyesha kuwa safi
  rationale: Umbo la kitenzi lina maana ya kujionyesha au kujidhihirisha kwa namna fulani. Tafsiri hii inadumisha maana hiyo pamoja na urudiaji wa kishairi wa “safi.”
- source_word: עִקֵּשׁ
  choice: mpotovu
  rationale: Kivumishi hiki humweleza mtu aliyepinda kimaadili au mwenye hila. “Mpotovu” huunda tofauti ya wazi na “safi” bila kupunguza uzito wa neno la Kiebrania.
- source_word: תִּתַּפָּל
  choice: unajionyesha kuwa mkaidi
  rationale: Kitenzi hiki ni nadra na kigumu, nacho kinaonekana kueleza jinsi Mungu anavyomkabili mtu mpotovu kwa namna inayolingana naye. “Mkaidi” hudokeza ukinzani usiokubali kushindwa, huku tanbihi ikihifadhi taswira ya moja kwa moja ya kupindapinda.
- source_word: עִם
  choice: kwa
  rationale: Katika muktadha huu kihusishi kinaonyesha namna Mungu anavyojihusisha na kila aina ya mtu. “Kwa” ni ya kawaida na ya asili katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri mwitikio wa Mungu kwa mtu mpotovu bila kufuta lugha yenye mvutano ya Kiebrania
  choice: unajionyesha kuwa mkaidi
  alternative: unajionyesha kuwa wa kupindapinda; unamkabili kwa ujanja
  rationale: “Mkaidi” huhifadhi wazo la Mungu kujibu kwa ukinzani unaolingana na mtu mpotovu, bila kudai moja kwa moja kwamba Mungu ni mpotovu kimaadili. Tanbihi inaonyesha taswira kali zaidi ya Kiebrania ili mvutano wa maandishi usifichwe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya kishairi, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Urudiaji wa “safi” umehifadhiwa kwa sababu ni sehemu ya muundo wa mstari wa Kiebrania.
