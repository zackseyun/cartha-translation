base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/039.yaml
  text: I consumed them and shattered them[a], and they did not rise[b]; they fell under my feet.
translation:
  language: sw
  text: 'Niliwateketeza[a] na nikawaponda[b];

    wala hawakuinuka;

    wakaanguka chini ya miguu yangu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Niliwaangamiza.” Maana ya msingi ya kitenzi cha Kiebrania ni “kula”; hapa kimetumiwa katika taswira ya vita kwa maana ya kuteketeza au kuangamiza.
    reason: lexical_alternative
  - marker: b
    text: Au, “nikawavunja-vunja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲכַלֵּם
  choice: Niliwateketeza
  rationale: Kitenzi אכל kwa maana ya msingi ni ‘kula’ au ‘kuteketeza,’ lakini katika taswira ya vita kinaweza kumaanisha kuwaangamiza kabisa. ‘Niliwateketeza’ kinaonyesha maangamizi kamili bila kuleta wazo lisilokusudiwa la kula watu kihalisi.
- source_word: וָאֶמְחָצֵם
  choice: na kuwaponda
  rationale: מחץ humaanisha kupiga kwa nguvu, kuponda, au kuvunja-vunja. ‘Kuwaponda’ kinahifadhi ukali na uamuzi wa ushindi unaoelezwa katika shairi.
- source_word: וְלֹא יְקוּמוּן
  choice: nao hawakuinuka
  rationale: Tafsiri hii inafuata kauli ya Kiebrania moja kwa moja bila kuongeza wazo la uwezo katika ‘hawakuweza kuinuka.’
- source_word: וַיִּפְּלוּ
  choice: walianguka
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya נפל, na inadumisha mwendo mfupi wa kishairi.
- source_word: תַּחַת רַגְלָי
  choice: chini ya miguu yangu
  rationale: Hii ni taswira ya kushindwa na kutiishwa kabisa, na ni usemi wa asili na unaoeleweka katika Kiswahili.
theological_decisions:
- issue: Taswira kali ya vita katika wimbo wa ushindi wa Daudi
  choice: Kudumisha usemi wa nafsi ya kwanza unaoonyesha maangamizi na kutiishwa kabisa
  alternative: Kulainisha kwa kusema tu, ‘Niliwashinda kabisa’
  rationale: Kiebrania kinatumia vitenzi vikali vya kishairi vinavyoonyesha maangamizi na kupondwa. Tafsiri haipunguzi ukali wa matini wala kuongeza hukumu ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi, wa kishairi na wenye heshima. Mpangilio wa mistari unadumisha mwendo na usambamba wa wimbo wa Kiebrania.
