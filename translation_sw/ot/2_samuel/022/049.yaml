  text: who brings me out from my enemies[a]; you exalt me above those who rise against me[b]; you deliver me from the violent man.
translation:
  language: sw
  text: unayenitoa kutoka kwa adui zangu;[a] unaniinua juu ya wale wanaoniinukia; unaniokoa kutoka kwa mtu mwenye jeuri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na unayenitoa kutoka kwa adui zangu”; kiunganishi cha Kiebrania kinaweza kutajwa wazi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoka kwa mtu wa jeuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצִיאִי
  choice: unayenitoa
  rationale: Kitenzi cha kisababishi kutoka יצא kinadumisha picha halisi ya ‘kutoa.’ Muundo wa ‘unayenitoa’ unaendeleza maelezo ya Mungu yaliyo katika muktadha uliotangulia.
- source_word: מֵאֹיְבָי
  choice: kutoka kwa adui zangu
  rationale: Huwakilisha moja kwa moja kihusishi מִן pamoja na nomino yenye kiambishi cha nafsi ya kwanza umoja, kwa Kiswahili cha kawaida.
- source_word: וּמִקָּמַי
  choice: wale wanaoniinukia
  rationale: Huhifadhi picha ya kitenzi קום, ambacho hapa kina maana ya kuinuka kwa uadui dhidi ya msemaji.
- source_word: תְּרוֹמְמֵנִי
  choice: unaniinua juu ya
  rationale: Huhifadhi sitiari ya kuinuliwa juu ya wapinzani pamoja na maana ya ushindi, bila kuifanya kuwa maelezo yasiyo ya kishairi.
- source_word: מֵאִישׁ חֲמָסִים
  choice: kutoka kwa mtu mwenye jeuri
  rationale: ‘Mtu’ huhifadhi umoja wa אִישׁ, na ‘mwenye jeuri’ huwasilisha sifa ya חֲמָסִים kwa lugha ya asili na inayoeleweka.
- source_word: תַּצִּילֵנִי
  choice: unaniokoa
  rationale: נצל hapa humaanisha kuokoa au kukomboa kutoka hatarini; ‘unaniokoa’ ni ya sasa, ya heshima, na ya kawaida katika Kiswahili.
theological_decisions: []
