  yaml_path: translation/ot/2_samuel/022/050.yaml
  text: Therefore I will praise you among the nations[a], O Yahweh, and I will sing praise to your name.
translation:
  language: sw
  text: Kwa hiyo nitakusifu miongoni mwa mataifa, Ee, Yahwe[a], nami nitaimba sifa kwa jina lako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH; tafsiri nyingine huandika “BWANA.”'
    reason: Hufafanua jina la Mungu lililo katika maandishi ya Kiebrania na kutaja tafsiri mbadala iliyozoeleka.
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Kirai hiki kinaonyesha hitimisho au matokeo yanayotokana na ukombozi ulioelezwa kabla yake; “Kwa hiyo” ni cha kawaida na huhifadhi uhusiano huo wa kimantiki.
- source_word: אוֹדְךָ
  choice: nitakusifu
  rationale: Kitenzi ידה katika muundo huu kinaweza kumaanisha kushukuru au kusifu. Katika muktadha huu wa wimbo, na kwa kulingana na אֲזַמֵּר katika mstari unaofuata, “nitakusifu” kinafaa huku maana ya shukrani ikibaki ndani ya wigo wa neno.
- source_word: יְהוָה
  choice: ee Yahwe
  rationale: Hili ni jina binafsi la Mungu katika Kiebrania. “Yahwe” hulihifadhi kama jina na “ee” huonyesha kwamba anasemeshwa moja kwa moja.
- source_word: בַּגּוֹיִם
  choice: miongoni mwa mataifa
  rationale: גּוֹיִם hapa humaanisha mataifa kwa upana, hasa yasiyo Israeli; “mataifa” ni sahihi na halileti mapema maana maalumu ya baadaye ya “Wamataifa.”
- source_word: וּלְשִׁמְךָ
  choice: kwa jina lako
  rationale: Muundo wa Kiebrania unaunganisha kuimba sifa na jina la Mungu. Kiswahili “kuimba sifa kwa jina lako” huhifadhi wazo la jina kama utambulisho na sifa inayojulikana.
- source_word: אֲזַמֵּר
  choice: nitaimba sifa
  rationale: Piel ya זמר humaanisha kuimba au kufanya muziki wa sifa. “Nitaimba sifa” ni ya asili katika Kiswahili na huhifadhi ulinganifu wa kishairi na “nitakusifu.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni kama jina binafsi. Kulitaja “Yahwe” huhifadhi jina hilo badala ya kulibadili kuwa cheo, huku tanbihi ikitaja desturi nyingine ya tafsiri.
- issue: 'Maana ya אוֹדְךָ: kusifu au kushukuru'
  choice: nitakusifu
  alternative: nitakushukuru
  rationale: Neno linaweza kubeba maana zote mbili. “Nitakusifu” linaendana zaidi na ulinganifu wa kishairi wa “nitaimba sifa,” bila kukataa kabisa kidokezo cha shukrani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi lakini wa moja kwa moja. Herufi ndogo katika “ee” hufuata matumizi ya kawaida ndani ya sentensi; “Yahwe” ni umbo linalosomeka kwa urahisi katika Kiswahili.
