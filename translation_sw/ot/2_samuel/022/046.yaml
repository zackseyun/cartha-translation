  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu vipashio vya Kiebrania: בְּנֵי־נֵכָר kama “Wageni,” יִבֹּלוּ kwa maana ya kishairi ya kupoteza moyo, na מִמִּסְגְּרוֹתָם kama kutoka katika ngome zao. Utoaji wa וְיַחְגְּרוּ kama “wakitetemeka” ni uamuzi wa kimuktadha unaokubalika kwa kitenzi hiki kigumu, na tanbihi huhifadhi uwezekano mkuu wa kimsamiati.'
