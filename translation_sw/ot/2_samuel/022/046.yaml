  text: בְּנֵ֥י נֵכָ֖ר יִבֹּ֑לוּ וְ/יַחְגְּר֖וּ מִ/מִּסְגְּרוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/046.yaml
  text: Foreigners lose heart and come trembling out of their strongholds[a][b][c].
translation:
  language: sw
  text: 'Wageni wanakata tamaa,

    na wanatoka katika ngome zao wakitetemeka.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wageni wananyauka.” Kitenzi cha Kiebrania kinaweza kumaanisha kihalisi zaidi kunyauka au kufifia.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania hapa ni kigumu; tafsiri nyingine ni “wanatoka kwa kujikunyata,” “wanatoka wakichechemea,” au kwa maana halisi zaidi, “wanajifunga mishipi.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kutoka katika ngome zao imara”; tafsiri isiyoelekea sana ni “kutoka katika magereza yao” au “kutoka katika maeneo yao yaliyofungwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: Wageni
  rationale: Kirai hiki kwa neno halisi ni ‘wana wa ugeni,’ lakini ni nahau inayomaanisha watu wa mataifa ya kigeni. ‘Wageni’ ni Kiswahili cha kawaida na kinafaa katika muktadha huu.
- source_word: יִבֹּלוּ
  choice: wanakata tamaa
  rationale: Kitenzi נבל kwa kawaida humaanisha kunyauka au kufifia. Katika muktadha huu wa kishairi na wa kijeshi, kinaonyesha kuporomoka kwa moyo au ujasiri; hivyo ‘wanakata tamaa’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וְיַחְגְּרוּ
  choice: wanatoka ... wakitetemeka
  rationale: Kitenzi hiki ni kigumu katika mstari huu. Ingawa mzizi חגר kwa kawaida humaanisha kujifunga mshipi, hapa huenda kinaeleza maadui wanaotoka kwa hofu. ‘Wakitetemeka’ linafaa kimuktadha huku tafsiri nyingine zikihifadhiwa katika tanbihi.
- source_word: מִמִּסְגְּרוֹתָם
  choice: katika ngome zao
  rationale: Nomino hii inaweza kutaja mahali palipofungwa au pa kuzuia watu. Katika wimbo wa ushindi wa kijeshi, ‘ngome zao’ linaeleweka kwa kawaida kuwa mahali pa kujilinda walimotoka maadui.
