  text: From the brightness before him[a], coals of fire blazed forth.
translation:
  language: sw
  text: Kutoka katika mwangaza mbele yake,[a] makaa ya moto yaliwaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kutoka katika uangavu mbele yake, makaa ya moto yaliwaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: Kutoka katika mwangaza
  rationale: Nomino נֹגַהּ humaanisha mwangaza, uangavu, au nuru ing'aayo; kiambishi מִן kinaonyesha chanzo. “Kutoka katika mwangaza” ni Kiswahili cha kawaida kinachohifadhi picha ya kutokea ndani ya mwangaza.
- source_word: נֶגְדּוֹ
  choice: uliokuwa mbele yake
  rationale: נֶגֶד pamoja na kiambishi cha nafsi ya tatu umoja wa kiume hueleza kilicho mbele yake. Kifungu hiki kinaihusisha kwa uwazi na “mwangaza” bila kupanua maana kuwa “uwepo wake.”
- source_word: בָּעֲרוּ
  choice: yaliwaka kwa nguvu
  rationale: Kitenzi בער katika qal humaanisha kuwaka au kuwaka kwa nguvu. Chaguo hili linaonyesha moto mkali wa taswira ya kishairi bila kuongeza kisababishi kisichotajwa.
- source_word: גַּחֲלֵי אֵשׁ
  choice: makaa ya moto
  rationale: Hili ni tamko la moja kwa moja la muundo wa Kiebrania, nalo ni la kawaida na lenye nguvu ya kishairi katika Kiswahili.
theological_decisions:
- issue: Taswira ya kujidhihirisha kwa Mungu na mtendaji asiyetajwa moja kwa moja
  choice: Mstari unaonyesha makaa yakawaka kutoka katika mwangaza uliokuwa mbele yake, bila kuongeza kwamba Mungu mwenyewe aliyawasha.
  alternative: “Mwangaza wake uliwasha makaa ya moto.”
  rationale: Kiebrania ni kifupi na cha kishairi; hakitaji kisababishi waziwazi. Tafsiri inahifadhi mfuatano na mvutano huo bila kuingiza tendo la kimungu lisilotamkwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kishairi. “Mwangaza” na “makaa ya moto” ni maneno yanayoeleweka kwa urahisi; “yaliwaka kwa nguvu” huhifadhi uchangamfu wa taswira bila lugha ya kale.
