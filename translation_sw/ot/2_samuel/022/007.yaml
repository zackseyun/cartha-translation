base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/007.yaml
  text: In my distress I call on Yahweh[a]; I call to my God. He hears my voice from his temple[b], and my cry for help reaches his ears.
translation:
  language: sw
  text: Katika dhiki yangu, namwita Yahweh; namwita Mungu wangu. Anasikia[a] sauti yangu kutoka katika hekalu lake[b], na kilio changu cha kuomba msaada kinafika masikioni mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliisikia sauti yangu kutoka katika hekalu lake,” kwa kufuata wakati uliopita wa kitenzi cha Kiebrania.
    reason: lexical_alternative
  - marker: b
    text: “Hekalu” pia linaweza kutafsiriwa “jumba la kifalme” au “patakatifu,” likimaanisha makao ya Mungu mbinguni.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: Katika dhiki yangu
  rationale: Kirai hiki humaanisha kuwa katika hali ya dhiki au taabu. “Katika dhiki yangu” ni Kiswahili cha kawaida na huhifadhi uzito wa hali bila kuongeza maana isiyokuwapo.
- source_word: אֶקְרָא
  choice: namwita
  rationale: Kitenzi קרא kimetumiwa mara mbili kwa maana ya kumwita au kumlilia Mungu. Kurudia “namwita” huhifadhi urudiaji wa Kiebrania na ni lugha ya kawaida katika muktadha wa sala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi יהוה limetoholewa kama “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהַי
  choice: Mungu wangu
  rationale: Nomino ya umoja yenye kiambishi cha nafsi ya kwanza ina maana ya moja kwa moja ya “Mungu wangu.”
- source_word: וַיִּשְׁמַע
  choice: anaisikia
  rationale: Ingawa umbo la kitenzi linaweza kutafsiriwa rasmi kwa wakati uliopita, wakati wa sasa unawasilisha kwa uhai jibu la Mungu katika wimbo. Uwezekano wa wakati uliopita umewekwa katika tanbihi.
- source_word: מֵהֵיכָלוֹ
  choice: kutoka katika hekalu lake
  rationale: הֵיכָל laweza kumaanisha hekalu, jumba la kifalme, au patakatifu. “Hekalu lake” ni la kawaida katika muktadha wa makao ya Mungu, huku tanbihi ikihifadhi maana nyingine.
- source_word: קוֹלִי
  choice: sauti yangu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya nomino yenye kiambishi cha nafsi ya kwanza.
- source_word: שַׁוְעָתִי
  choice: kilio changu cha kuomba msaada
  rationale: שַׁוְעָה ni kilio kinachotolewa ili kupata msaada katika dhiki. Tafsiri hii inaweka wazi kusudi lililomo katika neno hilo.
- source_word: בְּאָזְנָיו
  choice: kinafika masikioni mwake
  rationale: Maana halisi ni “masikioni mwake,” yaani kilio kinasikiwa. “Kinafika masikioni mwake” huhifadhi taswira na kueleweka kwa urahisi katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini inatumia jina binafsi la Mungu. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Makao ya Mungu katika הֵיכָל
  choice: hekalu
  alternative: jumba la kifalme au patakatifu
  rationale: Neno lina maana za kifalme na za ibada, na hapa linaweza kuashiria makao ya Mungu mbinguni. “Hekalu” huhifadhi mwangwi wa ibada bila kuondoa uwezekano wa maana ya jumba.
- issue: Wakati wa kitenzi וַיִּשְׁמַע
  choice: 'wakati wa sasa wa kishairi: “anaisikia”'
  alternative: 'wakati uliopita: “aliisikia”'
  rationale: Wakati wa sasa unaonyesha tendo kwa uhai katika wimbo, lakini umbo la Kiebrania ni kitenzi cha masimulizi kinachoweza kutafsiriwa kwa wakati uliopita; tanbihi inalinda uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo una urudiaji wa kishairi wa “namwita,” jina “Yahweh” limetumiwa wazi, na taswira ya kilio kufika masikioni mwa Mungu imehifadhiwa.
