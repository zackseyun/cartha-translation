lexical_decisions:
- source_word: אֹיְבַי
  choice: adui zangu
  rationale: Nomino אֹיֵב humaanisha kwa kawaida ‘adui,’ na kiambishi cha nafsi ya kwanza umoja kinahitaji ‘zangu.’ Hili ni chaguo la kawaida na wazi katika Kiswahili.
- source_word: תַּתָּה לִּי עֹרֶף
  choice: ulinipa shingo
  rationale: Kirai hiki kwa uhalisi ni ‘ulinipa shingo/sehemu ya nyuma ya shingo.’ Picha hiyo inaonyesha kwamba Mungu aliwafanya adui wamgeuzie mshindi shingo walipokimbia. Tafsiri ya msingi inadumisha picha halisi, huku tanbihi ikifafanua maana ya nahau.
- source_word: מְשַׂנְאַי
  choice: wale walionichukia
  rationale: Umbo la kushiriki lenye kiambishi cha nafsi ya kwanza umoja linawataja watu waliomtambulisha kwa chuki yao kwake. Wakati uliopita unafaa muktadha wa ushairi wa simulizi.
- source_word: וָאַצְמִיתֵם
  choice: nikawaangamiza
  rationale: Kitenzi צמת katika Hiphil kina maana ya kuharibu, kuangamiza, au kukomesha kabisa. ‘Nikawaangamiza’ ni chenye nguvu, cha heshima, na kinafaa muktadha wa kijeshi.
