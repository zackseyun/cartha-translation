  terminology: “Vifundo vya miguu” ni sahihi kwa קרסליים (eneo la vifundo/ankle), badala ya kupanua maana iwe “miguu.” “Kuteleza” ni tafsiri ya kawaida na halali ya מעד; tanbihi hudumisha uwezekano wa “kuyumba” au “kulegea.”
