  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: “Unapanua” huhifadhi Hifili ya רחב; “hatua zangu chini yangu” hudumisha taswira na mpangilio wa kishairi wa צעדַי תחתני; na “vifundo vya miguu yangu havikuteleza” hutafsiri kwa usahihi קרסלי na מעדו. Wakati wa kauli ya pili unaonyesha vema hali endelevu iliyopatikana ya kutoteleza.'
