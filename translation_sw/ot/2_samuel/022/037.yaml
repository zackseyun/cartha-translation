base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/037.yaml
  text: You widen my steps beneath me[b][a], and my ankles have not given way.
translation:
  language: sw
  text: Unapanua hatua zangu chini yangu,[a] na vifundo vya miguu yangu havikuteleza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “Unapanua hatua zangu chini yangu.” Nahau ya Kiebrania inaeleza kumpa mtu nafasi pana na salama ya kukanyaga.
    reason: lexical_alternative
  - marker: b
    text: Au, “havikuyumba” au “havikulegea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב
  choice: Unapanua
  rationale: Hifili ya רחב ina maana ya kusababisha upana au nafasi; “unapanua” huhifadhi hali ya kisababishi na usemi wa moja kwa moja kwa Mungu.
- source_word: צַעֲדַי
  choice: hatua zangu
  rationale: Nomino צעד humaanisha “hatua” au “mwendo.” Tafsiri hii huhifadhi taswira halisi ya kishairi bila kuibadili kuwa “ardhi.”
- source_word: תַּחְתֵּנִי
  choice: chini yangu
  rationale: Huwakilisha maana ya mahali ya “chini yangu,” ingawa nahau nzima ya Kiebrania inaeleza kupewa nafasi pana na salama ya kukanyaga.
- source_word: וְלֹא
  choice: na ... havi-
  rationale: Huhifadhi uunganishi wa kawaida na ukanushaji katika usambamba wa kishairi, bila kuongeza maana ya kusudi au matokeo.
- source_word: מָעֲדוּ
  choice: havikuteleza
  rationale: Kitenzi מעד kinaweza kumaanisha kuteleza, kuyumba, au kulegea. “Havikuteleza” ni cha kawaida kwa Kiswahili na kinafaa kwa vifundo vya miguu katika taswira ya uthabiti.
- source_word: קַרְסֻלַּי
  choice: vifundo vya miguu yangu
  rationale: Neno hili hurejelea hasa eneo la kifundo cha mguu; usemi huu ni sahihi na wa kawaida kuliko kulitafsiri kwa ujumla kuwa “miguu yangu.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi wenye heshima lakini unaoeleweka. Taswira ya Kiebrania ya “hatua” na “vifundo vya miguu” imehifadhiwa; tanbihi inafafanua nahau bila kuifuta katika matini.
