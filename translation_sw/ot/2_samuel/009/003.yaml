base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/003.yaml
  text: Then the king said[a], “Is there still anyone left of the house of Saul, that I may show him the kindness of God?” Ziba said to the king, “There is still a son of Jonathan[b], crippled in his feet.”
translation:
  language: sw
  text: Ndipo mfalme akasema, “Je, bado yupo mtu yeyote wa nyumba ya Sauli, ili nimtendee fadhili za Mungu[a]?” Siba akamwambia mfalme, “Bado yupo mwana wa Yonathani ambaye ana ulemavu wa miguu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uaminifu wa agano wa Mungu,” au “fadhili za kimungu.”
    reason: lexical_alternative
  - marker: b
    text: Au “ambaye ni kilema wa miguu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֶפֶס עוֹד אִישׁ
  choice: Je, bado yupo mtu yeyote
  rationale: Kauli hii inauliza ikiwa mtu fulani bado amebaki; Kiswahili hiki ni cha kawaida na hakigeuzi swali kuwa dai kwamba hakuna aliyebaki.
- source_word: לְבֵית שָׁאוּל
  choice: wa nyumba ya Sauli
  rationale: Neno ‘nyumba’ hapa linamaanisha ukoo au nasaba ya Sauli, na muundo huu unadumisha picha hiyo ya Kiebrania.
- source_word: וְאֶעֱשֶׂה עִמּוֹ
  choice: ili nimtendee
  rationale: Pamoja na חֶסֶד, kitenzi ‘kutendea’ ni cha asili katika Kiswahili na kinawakilisha kusudi lililo katika umbo la Kiebrania.
- source_word: חֶסֶד אֱלֹהִים
  choice: fadhili za Mungu
  rationale: ‘Fadhili’ zinaonyesha wema wenye neema na uaminifu, huku ‘za Mungu’ ikihifadhi uhusiano mpana wa maneno ambao unaweza kumaanisha fadhili zitokazo kwa Mungu, zinazomstahili Mungu, au zinazoakisi tabia yake.
- source_word: עוֹד בֵּן לִיהוֹנָתָן
  choice: Bado yupo mwana wa Yonathani
  rationale: Hii inaonyesha wazi kwamba mwana mmoja wa Yonathani bado yuko hai na inahifadhi msisitizo wa עוֹד.
- source_word: נְכֵה רַגְלָיִם
  choice: ana ulemavu wa miguu
  rationale: Usemi huu unaeleza kwa heshima na uwazi hali ya kudumu iliyodhoofisha uwezo wake wa kutembea, bila kutumia lugha ya kudhalilisha.
theological_decisions:
- issue: Maana ya חֶסֶד אֱלֹהִים
  choice: fadhili za Mungu
  alternative: uaminifu wa agano wa Mungu; fadhili zinazomstahili Mungu
  rationale: 'Muundo wa Kiebrania unaweza kueleweka kwa namna kadhaa: fadhili zinazotoka kwa Mungu, fadhili zinazoakisi tabia yake, au uaminifu wa agano. Tafsiri kuu inadumisha upana huo, na tanbihi inaonyesha maana mbadala bila kuifanya kuwa ya pekee.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nyumba ya Sauli’ imehifadhiwa kwa maana ya ukoo/nasaba. Lugha inayomhusu mtu mwenye ulemavu imechaguliwa kwa uwazi na heshima.
