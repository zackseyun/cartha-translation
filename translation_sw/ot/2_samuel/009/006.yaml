base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/006.yaml
  text: Mephibosheth son of Jonathan, son of Saul, came to David and fell on his face and bowed down. David said, “Mephibosheth,” and he said, “Here is your servant.”
translation:
  language: sw
  text: Basi Mefiboshethi mwana wa Yonathani, mwana wa Sauli, akaja kwa Daudi, akaanguka kifudifudi, akamsujudia. Daudi akasema, “Mefiboshethi!” Naye akasema, “Mimi hapa, mtumishi wako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: akaanguka kifudifudi
  rationale: Nahau hii ya Kiebrania inaonyesha mtu akianguka uso chini; ‘kifudifudi’ ni Kiswahili cha kawaida na chenye heshima kinachowasilisha mkao huo.
- source_word: וַיִּשְׁתָּחוּ
  choice: na kumsujudia
  rationale: Kitenzi hiki humaanisha kuinama au kusujudu mbele ya mtu; hapa mtendaji yuko mbele ya mfalme Daudi, kwa hiyo ‘kumsujudia’ linaonyesha tendo la heshima bila kulifanya ibada kwa lazima.
- source_word: הִנֵּה עַבְדֶּךָ
  choice: Mimi hapa, mtumishi wako
  rationale: Kauli hii ni jibu la unyenyekevu kwa kuitwa. ‘Mimi hapa’ ni mwitikio wa asili katika Kiswahili, huku ‘mtumishi wako’ ikihifadhi namna ya kujitaja iliyo katika chanzo.
theological_decisions:
- issue: Maana ya kusujudu mbele ya Daudi
  choice: kumsujudia
  alternative: kumwabudu
  rationale: Muktadha unaonyesha heshima na unyenyekevu mbele ya mfalme, si lazima ibada ya kidini; hivyo tafsiri haipaswi kuingiza dai la kitheolojia lisilolazimishwa na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili. Muundo wa nasaba ‘mwana wa Yonathani, mwana wa Sauli’ umehifadhiwa.
