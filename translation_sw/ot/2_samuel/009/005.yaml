  text: So King David sent and took him from the house of Machir son of Ammiel[a], from Lo-debar.
translation:
  language: sw
  text: Basi Mfalme Daudi akatuma, akamchukua kutoka nyumbani kwa Makiri mwana wa Amieli, kutoka huko Lo-debari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “akatuma, akamchukua.” Pia inaweza kutafsiriwa, “akatuma watu wakamleta kutoka nyumbani kwa Makiri mwana wa Amieli, kutoka Lo-debari.” Kiebrania hutumia mfululizo wa vitenzi “kutuma” na “kuchukua”; katika muktadha huu unaweza kumaanisha kwamba Daudi alituma wajumbe wamlete, ingawa wajumbe hawatajwi wazi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma watu
  rationale: Kitenzi שׁלח humaanisha ‘kutuma.’ Neno ‘watu’ limewekwa wazi kwa Kiswahili cha kawaida ili kuonyesha kwamba mfalme alituma wajumbe, bila kubadili tendo lenyewe.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Mfalme Daudi
  rationale: Muundo huu wa cheo na jina ni wa kawaida na wenye heshima katika Kiswahili.
- source_word: וַיִּקָּחֵהוּ
  choice: wamchukue
  rationale: לקח kwa msingi humaanisha ‘kuchukua.’ Katika muktadha huu wajumbe walitumwa kumchukua mtu huyo; tafsiri hii inabaki karibu na maana ya Kiebrania bila kulazimisha maana ya ‘kumleta,’ ingawa hiyo pia inawezekana kimuktadha.
- source_word: מִבֵּית
  choice: kutoka nyumbani kwa
  rationale: בַּיִת inaweza kumaanisha nyumba au kaya. ‘Nyumbani kwa’ ni usemi wa asili wa Kiswahili na hapa hauamui bila sababu ikiwa kinachokusudiwa ni jengo au kaya.
- source_word: מָכִיר בֶּן עַמִּיאֵל
  choice: Makiri mwana wa Amieli
  rationale: Majina yameandikwa kwa namna inayolingana na matamshi na desturi ya Kiswahili, huku uhusiano wa ‘mwana wa’ ukihifadhiwa.
- source_word: מִלּוֹ דְבָר
  choice: huko Lo-debari
  rationale: Lo-debari ni jina la mahali. ‘Huko’ linaonyesha mahali alikokuwa, huku ‘kutoka’ iliyotangulia ikitawala kishazi kizima kwa Kiswahili cha kawaida.
