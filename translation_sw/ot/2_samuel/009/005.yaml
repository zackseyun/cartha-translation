  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wa kawaida na wenye heshima. ‘Basi’ linaendeleza mfuatano wa habari, na ‘nyumbani kwa’ huepuka usemi mgumu wa moja kwa moja ‘kutoka nyumba ya.’
