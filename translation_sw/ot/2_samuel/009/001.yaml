  text: וַ/יֹּ֣אמֶר דָּוִ֔ד הֲ/כִ֣י יֶשׁ ע֔וֹד אֲשֶׁ֥ר נוֹתַ֖ר לְ/בֵ֣ית שָׁא֑וּל וְ/אֶעֱשֶׂ֤ה עִמּ/וֹ֙ חֶ֔סֶד בַּ/עֲב֖וּר יְהוֹנָתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/001.yaml
  text: David said[a], “Is there still anyone left of the house of Saul, that I may show kindness to him for Jonathan’s sake?”
translation:
  language: sw
  text: Daudi akasema, “Je, bado kuna mtu yeyote wa nyumba ya Sauli aliyesalia, ili nimtendee fadhili[a] kwa ajili ya Yonathani?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo mwaminifu,” “upendo thabiti,” au “uaminifu wa agano.” Neno la Kiebrania mara nyingi humaanisha fadhili zinazotokana na uaminifu na kujitoa kwa dhati, si hisia tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: אמר ni kitenzi cha kawaida cha masimulizi chenye maana ya ‘kusema.’ Ingawa maneno yanayofuata ni swali, ‘akasema’ hufuata kwa karibu muundo wa Kiebrania na ni Kiswahili cha kawaida.
- source_word: הֲכִי יֶשׁ עוֹד
  choice: Je, bado yupo
  rationale: Muundo huu unaanzisha swali la kuthibitisha kama mtu huyo anaendelea kuwapo; ‘Je, bado yupo’ ni wa kawaida na huhifadhi maana hiyo.
- source_word: אֲשֶׁר נוֹתַר
  choice: aliyesalia
  rationale: נותר humaanisha mtu anayebaki au aliyenusurika; ‘aliyesalia’ ni ya asili na haiongezi maelezo yasiyokuwapo.
- source_word: לְבֵית שָׁאוּל
  choice: katika nyumba ya Sauli
  rationale: בית hapa ni jamaa au ukoo wa kifalme wa Sauli, si jengo tu. ‘Nyumba ya Sauli’ huhifadhi usemi huo wa kifamilia na kidinastia.
- source_word: וְאֶעֱשֶׂה עִמּוֹ חֶסֶד
  choice: ili nimtendee fadhili
  rationale: עשה pamoja na חסד ni usemi wenye maana ya kumtendea mtu wema au fadhili. ‘Ili nimtendee’ pia huwasilisha vizuri kusudi la swali la Daudi.
- source_word: חֶסֶד
  choice: fadhili
  rationale: ‘Fadhili’ ni neno la kawaida, lenye heshima, linaloonyesha wema unaotendwa. Maana pana ya uaminifu na upendo thabiti imehifadhiwa katika tanbihi.
- source_word: בַּעֲבוּר יְהוֹנָתָן
  choice: kwa ajili ya Yonathani
  rationale: בעבור huonyesha sababu au msingi wa tendo; ‘kwa ajili ya Yonathani’ ni Kiswahili cha kawaida na huonyesha kuwa Daudi anatenda kwa sababu ya uhusiano wake na Yonathani.
theological_decisions:
- issue: Wigo wa maana ya חֶסֶד katika tendo la Daudi kwa nyumba ya Sauli
  choice: Kutumia ‘fadhili’ katika matini kuu
  alternative: upendo mwaminifu; upendo thabiti; uaminifu wa agano
  rationale: Muktadha unahusu tendo jema la Daudi lililotokana na uhusiano na ahadi yake kwa Yonathani. ‘Fadhili’ ni ya asili katika Kiswahili, huku tanbihi ikihifadhi maana ya uaminifu wa kudumu bila kulazimisha tafsiri moja ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Nyumba ya Sauli’ imedumishwa kama usemi wa ukoo au nasaba, na ‘Yonathani’ limetumiwa kama umbo la kawaida la jina hilo katika Kiswahili cha Biblia.
