base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/011.yaml
  text: Ziba said to the king[a], “According to all that my lord the king commands his servant[b], so your servant will do.” And Mephibosheth ate at my table like one of the king’s sons.
translation:
  language: sw
  text: Siba akamwambia mfalme, “Mtumishi wako atafanya yote ambayo bwana wangu mfalme anamwamuru.” Naye Mefiboshethi alikuwa akila mezani pangu[a] kama mmoja wa wana wa mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mezani pangu.” Badiliko la mnenaji si wazi. Baadhi ya mapokeo ya kale na tafsiri nyingi husoma “mezani pa mfalme.”'
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Katika simulizi, wayyiqtol ya אמר huendeleza matukio; pamoja na אֶל הַמֶּלֶךְ, Kiswahili cha kawaida ni ‘akamwambia mfalme.’
- source_word: כְּכֹל אֲשֶׁר יְצַוֶּה
  choice: yote ambayo ... anamwamuru
  rationale: Huhifadhi maana ya ujumla ya כְּכֹל אֲשֶׁר na nguvu ya amri ya Piel יְצַוֶּה kwa Kiswahili cha kawaida.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Ni namna ya heshima ya kumtaja mfalme; ‘bwana wangu’ ni ya hadhi na inaeleweka bila kuongeza wazo la utumwa.
- source_word: עַבְדּוֹ / עַבְדֶּךָ
  choice: mtumishi wake / mtumishi wako
  rationale: עבד hapa ni namna ya unyenyekevu katika utumishi wa kifalme. Muundo wa Kiswahili umeunganisha kauli bila kurudia ‘mtumishi wake,’ huku ‘mtumishi wako’ ikihifadhi kujitaja kwa Siba.
- source_word: כֵּן יַעֲשֶׂה
  choice: atafanya
  rationale: Imperfect ya עשה katika jibu hili ni ahadi ya kutii; wakati ujao wa Kiswahili unaonyesha ahadi hiyo kwa ufasaha.
- source_word: אֹכֵל
  choice: alikuwa akila
  rationale: Partisipo ya Qal inaonyesha hali au desturi inayoendelea, hivyo ‘alikuwa akila’ inafaa kuliko tukio moja tu la kula.
- source_word: עַל שֻׁלְחָנִי
  choice: mezani pangu
  rationale: Huhifadhi kiambishi cha nafsi ya kwanza umoja katika שֻׁלְחָנִי na kutumia usemi wa kawaida wa Kiswahili kwa kula kwenye meza ya mtu.
- source_word: כְּאַחַד מִבְּנֵי הַמֶּלֶךְ
  choice: kama mmoja wa wana wa mfalme
  rationale: Huhifadhi ulinganisho na hadhi ya kifamilia ya kifalme bila kufafanua zaidi ya maandishi.
theological_decisions:
- issue: Mnenaji wa ‘mezani pangu’ katika kishazi cha mwisho
  choice: Kuhifadhi nafsi ya kwanza ‘mezani pangu’ kama ilivyo katika Maandishi ya Kimasoreti.
  alternative: ‘Mezani pa mfalme,’ kama inavyosomeka katika baadhi ya mapokeo ya kale na tafsiri nyingi ili kulainisha badiliko la nafsi.
  rationale: WLC ina שֻׁלְחָנִי, yaani ‘meza yangu.’ Tafsiri haiibadili kimya kimya kuwa nafsi ya tatu; tanbihi inaeleza ugumu wa badiliko la mnenaji na usomaji mbadala.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Majina yametolewa kwa maumbo yaliyozoeleka ya Kiswahili: Siba na Mefiboshethi. Sentensi ya kwanza imepangwa upya kwa ufasaha wa Kiswahili huku ikihifadhi ahadi ya Siba ya kutii amri zote za mfalme.'
