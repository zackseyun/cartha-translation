  text: וְ/עָבַ֣דְתָּ לּ֣/וֹ אֶֽת הָ/אֲדָמָ֡ה אַתָּה֩ וּ/בָנֶ֨י/ךָ וַ/עֲבָדֶ֜י/ךָ וְ/הֵבֵ֗אתָ וְ/הָיָ֨ה לְ/בֶן אֲדֹנֶ֤י/ךָ לֶּ֨חֶם֙ וַ/אֲכָל֔/וֹ וּ/מְפִיבֹ֨שֶׁת֙ בֶּן אֲדֹנֶ֔י/ךָ יֹאכַ֥ל תָּמִ֛יד לֶ֖חֶם עַל שֻׁלְחָנִ֑/י וּ/לְ/צִיבָ֗א חֲמִשָּׁ֥ה עָשָׂ֛ר בָּנִ֖ים וְ/עֶשְׂרִ֥ים עֲבָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/010.yaml
  text: You and your sons and your servants shall work the land for him[a], and you shall bring in the produce, and it shall be bread for your master's son, and he shall eat it. But Mephibosheth, your master's son, shall always eat bread at my table. Now Ziba had fifteen sons and twenty servants.
translation:
  language: sw
  text: Wewe, wanao na watumwa wako mtamlimia ardhi, na mtamletea mavuno; nayo yatakuwa chakula[a] kwa mwana wa bwana wako, naye atakila. Lakini Mefiboshethi, mwana wa bwana wako, atakula chakula mezani pangu daima.” Siba alikuwa na wana kumi na watano na watumwa ishirini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mkate”; neno hilo linaweza pia kumaanisha chakula au mahitaji ya chakula kwa ujumla katika muktadha huu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַדְתָּ לּוֹ אֶת הָאֲדָמָה
  choice: mtamlimia ardhi
  rationale: Kitenzi עבד pamoja na אֲדָמָה kinamaanisha kuilima ardhi kwa manufaa ya Mefiboshethi. “Kumlimia ardhi” ni Kiswahili cha kawaida kinachohifadhi wazo la kazi ya kilimo na mnufaika wake.
- source_word: אַתָּה וּבָנֶיךָ וַעֲבָדֶיךָ
  choice: wewe, wanao na watumwa wako
  rationale: עֲבָדִים hapa ni watu walio chini ya mamlaka ya Siba katika mfumo wa utumwa wa kaya, si waajiriwa wa kawaida; kwa hiyo “watumwa” linaonyesha hadhi hiyo wazi.
- source_word: וְהֵבֵאתָ
  choice: nawe utamletea mazao yake
  rationale: Kitenzi chenyewe ni “kuleta,” huku kitu kinacholetwa kikieleweka kutokana na kazi ya shambani. “Mazao yake” linaweka wazi mavuno ya ardhi yaliyokusudiwa kwa Mefiboshethi bila kupanua maana kupita kiasi.
- source_word: וְהָיָה לְבֶן אֲדֹנֶיךָ לֶּחֶם וַאֲכָלוֹ
  choice: ili mwana wa bwana wako awe na chakula[a] cha kula
  rationale: לֶחֶם inaweza kumaanisha mkate au chakula kwa ujumla. Katika muktadha wa mazao ya ardhi, “chakula” ni cha asili zaidi; “cha kula” kinawakilisha וַאֲכָלוֹ bila Kiswahili kizito.
- source_word: יֹאכַל תָּמִיד לֶחֶם עַל שֻׁלְחָנִי
  choice: atakula chakula mezani pangu daima
  rationale: Usemi huu unaonyesha riziki ya kudumu na ushirika katika meza ya mfalme. “Mezani pangu” ni nahau ya kawaida ya Kiswahili, na “daima” linatafsiri תָּמִיד.
- source_word: וּלְצִיבָא חֲמִשָּׁה עָשָׂר בָּנִים וְעֶשְׂרִים עֲבָדִים
  choice: Siba alikuwa na wana kumi na watano na watumwa ishirini
  rationale: Kifungu cha Kiebrania hakina kitenzi wazi, hivyo “alikuwa na” linaongezwa kwa sarufi ya kawaida ya Kiswahili. “Watumwa” linaendeleza maana ya hadhi ya עֲבָדִים.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Wingi “mtamlimia” umetumiwa kwa sababu kiima kilichotajwa ni Siba, wanawe na watumwa wake; “nawe utamletea” kinarudi kwenye umoja wa kitenzi cha Kiebrania na wajibu wa Siba mwenyewe. Majina yametolewa kwa maumbo yaliyozoeleka ya Kiswahili: Mefiboshethi na Siba.'
