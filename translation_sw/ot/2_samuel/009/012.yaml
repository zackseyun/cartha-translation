base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/012.yaml
  text: Mephibosheth had a young son[a], and his name was Mica[b]. And all who lived in the house of Ziba were servants to Mephibosheth.
translation:
  language: sw
  text: Mefiboshethi alikuwa na mwana mdogo, naye aliitwa Mika. Wote waliokaa katika nyumba ya Siba[a] walikuwa watumishi[b] wa Mefiboshethi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wote wa nyumba ya Siba.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “watumishi” linaweza pia kumaanisha “watumwa,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/מְפִיבֹשֶׁת
  choice: Mefiboshethi alikuwa na
  rationale: Muundo wa Kiebrania wenye ל unaonyesha umilikaji au kuwapo kwa kitu kwa mtu; Kiswahili cha kawaida huueleza kwa kusema ‘alikuwa na.’ Kiunganishi cha mwanzo hakihitaji kutafsiriwa kimitambo.
- source_word: בֵּן קָטָן
  choice: mwana mdogo
  rationale: בֵּן ni ‘mwana’ na קָטָן hapa inaonyesha udogo wa umri. ‘Mwana mdogo’ ni usemi wa kawaida na wenye heshima katika Kiswahili.
- source_word: וּ/שְׁמ֣/וֹ מִיכָא
  choice: naye aliitwa Mika
  rationale: Hutambulisha jina la mwana huyo kwa Kiswahili cha asili. ‘Mika’ huakisi מִיכָא bila kulichanganya na jina tofauti la ‘Mikaya.’
- source_word: וְ/כֹל מוֹשַׁב בֵּית צִיבָא
  choice: Wote waliokaa katika nyumba ya Siba
  rationale: מוֹשַׁב inahusiana na makao au ukaaji na hapa inawaonyesha watu waliokaa katika nyumba hiyo. Tafsiri hii inafuata picha ya Kiebrania, huku ‘watu wote wa nyumba ya Siba’ ikibaki kuwa uwezekano wa maana.
- source_word: עֲבָדִים
  choice: watumishi
  rationale: עֲבָדִים inaweza kumaanisha watumishi au watumwa kulingana na muktadha. Hapa mkazo ni wajibu wao wa kumtumikia Mefiboshethi, kwa hiyo ‘watumishi’ inafaa, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: לִ/מְפִיבֹשֶׁת
  choice: wa Mefiboshethi
  rationale: Baada ya ‘watumishi,’ Kiswahili hutumia kwa kawaida kiunganishi ‘wa’ kuonyesha yule wanayemtumikia, bila kulazimisha wazo la umiliki kamili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kama Mefiboshethi, Mika, na Siba. Alama za tanbihi zimehamishwa ziwekwe baada ya maneno yanayohusika moja kwa moja, kwa kuwa nafasi zake katika tabaka la Kiingereza hazikulingana na maelezo ya tanbihi.
