  text: And he bowed down and said[a], “What is your servant[b], that you have turned toward a dead dog like me?”
translation:
  language: sw
  text: Akainama kwa heshima, akasema, “Mtumishi wako ni kitu gani hata umwangalie mbwa aliyekufa[a] kama mimi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kumwita mtu “mbwa aliyekufa” ni usemi wa kujishusha sana na kujiona kuwa hafai kabisa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: Akainama kwa heshima
  rationale: Kitenzi kinaonyesha kuinama kwa unyenyekevu au heshima mbele ya mwenye mamlaka. Tafsiri hii inadumisha tendo la mwili bila kulifanya kuwa ibada.
- source_word: מֶה עַבְדֶּךָ
  choice: Mtumishi wako ni kitu gani
  rationale: Hili linahifadhi swali halisi la Kiebrania, ‘Mtumishi wako ni nini?’ na kusisitiza kujishusha kwa msemaji kuliko kulainisha kuwa ‘Mimi ni nani?’
- source_word: כִּי
  choice: hata
  rationale: 'Katika swali hili כִּי inaunganisha hali ya kujishusha na tendo la mfalme: ‘ni kitu gani hata...?’ Hii ni ya kawaida katika Kiswahili na inahifadhi nguvu ya swali la balagha.'
- source_word: פָנִיתָ אֶל
  choice: umwangalie
  rationale: Kifungu hiki maana yake halisi ni ‘umgeukie,’ lakini hapa kinamaanisha kumpa mtu usikivu au kumjali. ‘Umwangalie’ ni Kiswahili cha asili kinachobeba wazo la kumtambua kwa neema.
- source_word: הַכֶּלֶב הַמֵּת
  choice: mbwa aliyekufa
  rationale: Taswira ya Kiebrania ya kujidhalilisha sana imehifadhiwa moja kwa moja bila kuipunguza.
- source_word: אֲשֶׁר כָּמוֹנִי
  choice: kama mimi
  rationale: Kifungu hiki kinamhusisha msemaji moja kwa moja na mfano wa ‘mbwa aliyekufa’ na ni wazi na cha kawaida katika Kiswahili.
