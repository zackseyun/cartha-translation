translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha simulizi, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Mefiboshethi” na “Yerusalemu” zinafuata maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili. Hakuna tanbihi iliyohitajika, kwa kuwa maana ya Kiebrania inaweza kuwasilishwa wazi katika matini kuu.
