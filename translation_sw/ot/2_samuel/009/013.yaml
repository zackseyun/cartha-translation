  yaml_path: translation/ot/2_samuel/009/013.yaml
  text: And Mephibosheth lived in Jerusalem[a], because he always ate at the king’s table[b]. Now he was lame in both his feet.
translation:
  language: sw
  text: Mefiboshethi aliishi Yerusalemu, kwa sababu alikula sikuzote mezani pa mfalme. Naye alikuwa kilema wa miguu yote miwili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹשֵׁב
  choice: akaishi
  rationale: Katika muktadha wa jina la mji, kitenzi hiki kinaeleza kukaa mahali kama makao, si tendo la kuketi tu. “Akaishi” ni Kiswahili cha kawaida na pia huendeleza simulizi.
- source_word: כִּי
  choice: kwa sababu
  rationale: 'Kiunganishi hiki kinaonyesha sababu ya Mefiboshethi kuishi Yerusalemu: alikuwa akipata nafasi ya kula mezani pa mfalme.'
- source_word: שֻׁלְחַן הַמֶּלֶךְ
  choice: mezani pa mfalme
  rationale: Hii ni namna ya asili ya Kiswahili ya kueleza kula kwenye meza ya mfalme, huku ikihifadhi wazo la matunzo na ushirika wa kifalme.
- source_word: תָּמִיד
  choice: sikuzote
  rationale: Neno hili linaonyesha tendo lililoendelea au lililofanyika kwa kawaida; “sikuzote” linafaa kwa tendo la mazoea katika muktadha huu.
- source_word: אֹכֵל
  choice: alikula
  rationale: Umbo la Kiebrania linaonyesha tendo la kawaida. Pamoja na “sikuzote,” wakati uliopita wa Kiswahili unawasilisha mazoea hayo kwa ufasaha.
- source_word: פִסֵּחַ
  choice: kilema
  rationale: Neno hili humaanisha mtu asiyeweza kutembea kawaida kwa sababu ya ulemavu wa miguu. “Kilema” ni tafsiri ya moja kwa moja na inayotambulika katika Kiswahili sanifu, bila kuongeza chanzo au kiwango cha hali hiyo.
- source_word: שְׁתֵּי רַגְלָיו
  choice: miguu yote miwili
  rationale: Kiebrania kinasema kihalisi “miguu yake miwili.” “Miguu yote miwili” ni usemi wa kawaida wa Kiswahili unaohifadhi msisitizo kwamba hali hiyo iliathiri miguu yote.
- source_word: וְהוּא
  choice: Naye alikuwa
  rationale: Kiunganishi hiki kinaanzisha maelezo ya mwisho kuhusu hali yake. “Naye alikuwa” huhifadhi uhusiano na sentensi iliyotangulia kwa Kiswahili cha simulizi.
