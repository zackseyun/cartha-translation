base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/002.yaml
  text: The house of Saul had a servant whose name was Ziba[a], and they called him to David. And the king said to him, “Are you Ziba?” And he said, “Your servant.”
translation:
  language: sw
  text: Nyumba ya Sauli ilikuwa na mtumishi aliyeitwa Siba. Wakamwita aende kwa Daudi. Mfalme akamwambia, “Je, wewe ndiye Siba?” Naye akasema, “Mtumishi wako.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa uwazi zaidi, “Mimi ni mtumishi wako.” Jibu la Kiebrania ni la mkato: “Mtumishi wako.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/בֵית שָׁאוּל
  choice: Nyumba ya Sauli ilikuwa na
  rationale: Muundo wa Kiebrania unaonyesha umilikaji au uhusiano wa mtu na nyumba ya Sauli. Kiswahili cha kawaida huueleza kwa ‘Nyumba ya Sauli ilikuwa na,’ huku ‘nyumba’ ikihifadhi wazo la jamaa na mali ya kifalme.
- source_word: עֶבֶד
  choice: mtumishi
  rationale: Neno linaweza kumaanisha mtumwa au mtumishi. Katika muktadha huu linamtaja mtu aliyekuwa chini ya nyumba ya Sauli; ‘mtumishi’ linaonyesha hali hiyo bila kusisitiza utumwa kuliko inavyotakiwa na muktadha.
- source_word: וּ/שְׁמ/וֹ צִיבָא
  choice: aliyeitwa Siba
  rationale: Hii ni njia ya asili ya Kiswahili ya kumtambulisha mtu kwa jina lake, na inalingana na maana ya ‘jina lake lilikuwa Siba.’
- source_word: וַ/יִּקְרְאוּ ל/וֹ אֶל דָּוִד
  choice: Wakamwita aende kwa Daudi
  rationale: Kitenzi pamoja na viambishi vyake kina maana ya kumwita mtu aje au aende mbele ya Daudi. Tafsiri hii ni ya kawaida kwa Kiswahili na inahifadhi mtendaji wa wingi usiotajwa wazi.
- source_word: הַ/מֶּלֶךְ
  choice: Mfalme
  rationale: Ni cheo chenye uainisho kinachomrejelea Daudi; ‘Mfalme’ ni tafsiri ya moja kwa moja na ya kawaida katika simulizi.
- source_word: הַ/אַתָּה צִיבָא
  choice: Je, wewe ndiye Siba?
  rationale: Kiulizi na kiwakilishi vinasisitiza utambulisho wa mtu. ‘Wewe ndiye’ huwasilisha mkazo huo kwa Kiswahili cha kawaida.
- source_word: עַבְדֶּךָ
  choice: Mtumishi wako
  rationale: Jibu la Kiebrania limefupishwa, neno kwa neno ‘mtumishi wako.’ Kulihifadhi hivyo kunadumisha ufupi na unyenyekevu wa lugha ya mbele ya mfalme; maana kamili inaelezwa katika tanbihi.
