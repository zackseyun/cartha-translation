  text: וַ/יִּקְרָ֣א הַ/מֶּ֗לֶךְ אֶל צִיבָ֛א נַ֥עַר שָׁא֖וּל וַ/יֹּ֣אמֶר אֵלָ֑י/ו כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה לְ/שָׁאוּל֙ וּ/לְ/כָל בֵּית֔/וֹ נָתַ֖תִּי לְ/בֶן אֲדֹנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/009.yaml
  text: Then the king called Ziba[a], Saul’s servant, and said to him[c][b], “All that belonged to Saul and to all his house I have given to your master’s son.”
translation:
  language: sw
  text: Kisha mfalme akamwita Siba, mtumishi wa Sauli,[a] akamwambia, “Mali yote iliyokuwa ya Sauli na ya nyumba yake yote[b] nimempa mwana wa bwana wako.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kijana wa Sauli” au “mhudumu wa Sauli”; hapa inaelekea kumaanisha mtumishi wa nyumba au mfuasi wake.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “nyumba yake yote”; hapa “nyumba” inaweza kumaanisha watu wa nyumbani, ukoo, au mali ya nyumba ya Sauli.
    reason: lexical_alternative
  - marker: c
    text: “Mwana wa bwana wako” anamrejelea Mefiboshethi, mzao wa Sauli na mkuu wa Siba katika mpangilio wa nyumba hiyo.
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: mtumishi
  rationale: Ingawa neno hili linaweza kumaanisha “kijana,” katika muktadha wa nyumba ya kifalme linaonyesha nafasi ya Siba kama mtumishi au mhudumu wa Sauli.
- source_word: כֹּל אֲשֶׁר הָיָה לְשָׁאוּל
  choice: Mali yote iliyokuwa ya Sauli
  rationale: Muundo wa Kiebrania unaonyesha umiliki; “mali yote iliyokuwa ya Sauli” ni Kiswahili cha kawaida kinachoeleza maana hiyo wazi.
- source_word: וּלְכָל בֵּיתוֹ
  choice: na ya nyumba yake yote
  rationale: “Nyumba” huhifadhi upana wa בַּיִת, ambalo hapa linaweza kutaja jamaa, watu wa nyumbani, na mali ya ukoo wa Sauli.
- source_word: נָתַתִּי
  choice: nimempa
  rationale: Kauli hii inaeleza tendo lililokamilika ambalo matokeo yake yanaendelea kuwapo; wakati timilifu wa Kiswahili unafaa.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: mwana wa bwana wako
  rationale: “Bwana” hapa ni mkuu wa kijamii, si jina la Mungu. “Mwana” huhifadhi matumizi mapana ya kifamilia ya neno la Kiebrania bila kulibadili kuwa “mjukuu” katika maandishi yenyewe.
- source_word: וַיִּקְרָא ... וַיֹּאמֶר
  choice: Kisha ... akamwita ... akamwambia
  rationale: Mfuatano wa vitenzi unaendeleza simulizi; “kisha” na viambishi vya mfululizo vinaifanya sentensi isomeke kwa kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo “akamwita ... akamwambia” unafaa simulizi, huku “nyumba” na “mwana” zikihifadhi upana wa maneno ya Kiebrania.
