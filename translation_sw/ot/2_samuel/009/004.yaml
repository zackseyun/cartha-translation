  text: The king said to him, “Where is he?” Ziba said to the king, “Look, he is in the house of Machir son of Ammiel, in Lo-debar.”
translation:
  language: sw
  text: Mfalme akamwuliza, “Yuko wapi?” Siba akamjibu mfalme, “Yuko katika nyumba ya Makiri mwana wa Amieli, huko Lo-debari.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Yuko
  rationale: Katika jibu hili, neno hilo linavuta fikira kwa habari inayofuata; Kiswahili cha kawaida hakihitaji kulitamka kwa neno kama “tazama,” ambalo hapa lingesikika lisilo la asili.
- source_word: בֵּית מָכִיר
  choice: katika nyumba ya Makiri
  rationale: Inahifadhi maana ya mahali anapoishi au anapopatikana bila kuongeza kwamba nyumba hiyo ni mali yake kwa namna maalumu.
- source_word: בְּלוֹ דְבָר
  choice: huko Lo-debari
  rationale: “Huko” linaonyesha mahali kwa kawaida katika Kiswahili; jina la mahali limetoholewa kwa tahajia inayosomeka kwa Waswahili.
