base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/007.yaml
  text: David said to him[a], “Do not be afraid, for I will surely show you kindness for the sake of Jonathan your father, and I will restore to you all the land of Saul your father[c][b], and you shall always eat bread at my table.”
translation:
  language: sw
  text: Daudi akamwambia, “Usiogope, kwa maana hakika nitakutendea fadhili[a] kwa ajili ya Yonathani baba yako. Nitakurudishia ardhi yote ya Sauli baba yako[b], nawe utakula chakula mezani pangu daima[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania ḥesed linaweza pia kutafsiriwa “upendo thabiti,” “upendo mwaminifu,” au “uaminifu wa agano.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Sauli baba yako.” Neno “baba” linaweza pia kumaanisha babu au mhenga; hapa Sauli alikuwa babu yake Mefiboshethi.'
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “utakula mkate mezani pangu.” Huu ni usemi unaomaanisha kupewa chakula daima na kushiriki ushirika wa mezani.'
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Usiogope
  rationale: Ni katazo la moja kwa moja na la kawaida katika Kiswahili cha sasa, likihifadhi maneno ya Daudi ya kumtuliza Mefiboshethi.
- source_word: כִּי עָשֹׂה אֶעֱשֶׂה
  choice: kwa maana hakika nitakutendea
  rationale: Muundo wa kitenzi pamoja na jina-kitenzi la Kiebrania unasisitiza uhakika wa tendo; “hakika” huwasilisha msisitizo huo kwa Kiswahili cha asili.
- source_word: חֶסֶד
  choice: fadhili
  rationale: Katika muktadha huu neno linaonyesha wema wa uaminifu unaotekelezwa kwa matendo kwa sababu ya uhusiano wa Daudi na Yonathani. “Fadhili” ni wazi na yenye hadhi, huku maana pana zaidi ikielezwa katika tanbihi.
- source_word: בַּעֲבוּר יְהוֹנָתָן אָבִיךָ
  choice: kwa ajili ya Yonathani baba yako
  rationale: “Kwa ajili ya” huhifadhi sababu na msukumo wa uhusiano uliomo katika kirai cha Kiebrania.
- source_word: וַהֲשִׁבֹתִי לְךָ
  choice: Nitakurudishia
  rationale: Hifili ya שוב hapa ina maana ya kurudisha mali kwa mwenye haki; “nitakurudishia” ni ya kawaida na sahihi katika Kiswahili.
- source_word: כָּל שְׂדֵה שָׁאוּל
  choice: ardhi yote ya Sauli
  rationale: Ingawa שָׂדֶה ni umoja, hapa inaweza kutumiwa kwa maana ya jumla ya milki ya ardhi. “Ardhi yote” huepuka kuifanya iwe shamba moja tu.
- source_word: שָׁאוּל אָבִיךָ
  choice: Sauli baba yako
  rationale: Tafsiri inahifadhi usemi wa Kiebrania na uwanja mpana wa אָב, ambao unaweza kumaanisha babu au mhenga; tanbihi hufafanua uhusiano wa kifamilia.
- source_word: תֹּאכַל לֶחֶם עַל שֻׁלְחָנִי תָּמִיד
  choice: utakula chakula mezani pangu daima
  rationale: Usemi wa Kiebrania ni “kula mkate mezani pangu,” lakini hapa unamaanisha kushiriki milo na kupokea riziki ya kudumu. “Kula chakula mezani pangu daima” ni Kiswahili cha kawaida kinachohifadhi picha ya ushirika wa mezani.
theological_decisions:
- issue: Maana ya kiagano ya חֶסֶד
  choice: fadhili
  alternative: upendo thabiti; upendo mwaminifu; uaminifu wa agano
  rationale: Muktadha unaonyesha wema wa Daudi wenye uaminifu kwa sababu ya uhusiano wake na Yonathani. “Fadhili” huwasilisha tendo hilo kwa urahisi bila kuficha maana pana ya uaminifu, ambayo imehifadhiwa katika tanbihi.
- issue: Utambulisho wa Sauli kama אָב wa Mefiboshethi
  choice: Sauli baba yako
  alternative: Sauli babu yako
  rationale: Maandishi ya Kiebrania yanasema “baba yako,” na אָב linaweza kumaanisha babu au mhenga. Kuhifadhi “baba” katika matini na kufafanua katika tanbihi kunadumisha namna chanzo kilivyojieleza bila kuleta mkanganyiko wa ukoo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye hadhi. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Daudi, Yonathani, na Sauli. Mpangilio wa sentensi umegawanywa kwa urahisi wa kusoma bila kupoteza uhusiano wa kimantiki wa chanzo.'
