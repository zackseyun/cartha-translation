  text: צַר לִ֣/י עָלֶ֗י/ךָ אָחִ/י֙ יְה֣וֹנָתָ֔ן נָעַ֥מְתָּ לִּ֖/י מְאֹ֑ד נִפְלְאַ֤תָה אַהֲבָֽתְ/ךָ֙ לִ֔/י מֵ/אַהֲבַ֖ת נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/026.yaml
  text: I am distressed over you[a], my brother Jonathan; you were very pleasant to me. Your love to me was wonderful, surpassing the love of women.
translation:
  language: sw
  text: Nina uchungu kwa ajili yako, ndugu yangu Yonathani; ulinipendeza sana. Upendo wako kwangu ulikuwa wa ajabu, ukizidi upendo wa wanawake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuliko upendo kwa wanawake,” au “kuliko upendo ambao wanawake hutoa.” Ulinganisho wa Kiebrania ni wa kishairi, nao hauelezi wazi jambo hasa linalolinganishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי עָלֶיךָ
  choice: Nina uchungu kwa ajili yako
  rationale: Kirai hiki kinaonyesha dhiki au maumivu ya ndani katika maombolezo. “Nina uchungu” ni Kiswahili cha kawaida chenye uzito unaofaa, nacho “kwa ajili yako” kinaonyesha kuwa Yonathani ndiye anayeliliwa bila kudokeza kwamba ndiye aliyesababisha uchungu huo.
- source_word: אָחִי יְהוֹנָתָן
  choice: ndugu yangu Yonathani
  rationale: “Ndugu yangu” huhifadhi neno la Kiebrania bila kulibadili kuwa “rafiki,” na mpangilio huu ni wa kawaida katika Kiswahili.
- source_word: נָעַמְתָּ לִּי מְאֹד
  choice: ulinipendeza sana
  rationale: Kitenzi kina maana ya kuwa mwenye kupendeza au kuleta furaha. Tafsiri hii ni ya asili katika Kiswahili na “sana” inawakilisha מְאֹד.
- source_word: נִפְלְאָתָה אַהֲבָתְךָ לִי
  choice: Upendo wako kwangu ulikuwa wa ajabu
  rationale: “Wa ajabu” huonyesha hali isiyo ya kawaida, yenye kustahili kustaajabiwa, huku “kwangu” ikihifadhi mwelekeo wa upendo unaotajwa katika Kiebrania.
- source_word: מֵאַהֲבַת נָשִׁים
  choice: ukizidi upendo wa wanawake
  rationale: “Ukizidi” huwasilisha ulinganisho wa מִן. Kirai “upendo wa wanawake” kinahifadhi muundo mpana wa Kiebrania bila kuamua kama ni upendo kwa wanawake au upendo unaotolewa na wanawake.
theological_decisions:
- issue: Maana ya kulinganisha upendo wa Yonathani na “upendo wa wanawake”
  choice: Kuhifadhi usemi wa jumla “upendo wa wanawake” bila kuufafanua kuwa wa kimapenzi, kingono, au wa kirafiki tu.
  alternative: Kuutafsiri wazi kuwa “upendo kwa wanawake” au “upendo ambao wanawake hutoa.”
  rationale: Kiebrania kina ulinganisho wa kishairi lakini hakielezi kwa uhakika upande au aina halisi ya upendo unaolinganishwa. Tafsiri haipaswi kutatua mvutano huo wa kiufafanuzi kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maombolezo. Sentensi ni rahisi kueleweka kwa wasomaji wa kawaida, huku ikihifadhi lugha ya kindugu, uzito wa hisia, na utata halisi wa ulinganisho wa Kiebrania.
