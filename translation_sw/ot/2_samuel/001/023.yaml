base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/023.yaml
  text: Saul and Jonathan[a], beloved and pleasant in their lives, were not parted in their death; they were swifter than eagles[c][b], they were stronger than lions.
translation:
  language: sw
  text: 'Sauli na Yonathani,


    wapendwa na wa kupendeza[a] katika maisha yao,


    katika mauti yao hawakutengana.


    Walikuwa wepesi kuliko tai[b],


    walikuwa hodari[c] kuliko simba.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wapendezi.”
    reason: lexical_alternative
  - marker: b
    text: Au “ndege wakubwa wa kuwinda”; neno la Kiebrania linaweza kutaja tai au, kwa upana zaidi, ndege mkubwa wa kuwinda, kutia ndani aina fulani za tumbusi.
    reason: lexical_alternative
  - marker: c
    text: Au “wenye nguvu zaidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: Sauli na Yonathani
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: הַנֶּאֱהָבִים
  choice: walipendwa
  rationale: Umbo hili lina maana ya kupendwa; kitenzi cha hali ya kutendwa kinawasilisha maana hiyo wazi na kwa kawaida katika Kiswahili.
- source_word: וְהַנְּעִימִם
  choice: walipendeza
  rationale: Neno hili linaonyesha kupendeza au kuwa wa kupendeza. Chaguo hili linahifadhi usambamba wa kishairi bila kulifanya kuwa hukumu kuhusu uzuri wa mwili au wema wa maadili.
- source_word: בְּחַיֵּיהֶם
  choice: maishani mwao
  rationale: Ni usemi wa asili wa Kiswahili unaodumisha maana ya kipindi au mazingira ya maisha yao.
- source_word: וּבְמוֹתָם לֹא נִפְרָדוּ
  choice: hata katika kifo chao hawakutengana
  rationale: “Katika kifo chao” inadumisha usemi wa pamoja wa Kiebrania, na “hawakutengana” inahifadhi maana ya kutenganishwa au kuachana. “Hata” huonyesha kwa kawaida nguvu ya mlinganisho kati ya maisha na kifo bila kubadili dai la mstari.
- source_word: מִנְּשָׁרִים קַלּוּ
  choice: walikuwa wepesi kuliko tai
  rationale: Katika mlinganisho huu, קלל inaelekea kuonyesha kasi; “wepesi kuliko tai” ni usemi wa kishairi na wa asili. נשר inaweza pia kutaja kwa upana ndege mkubwa wa kuwinda, jambo lililowekwa katika tanbihi.
- source_word: מֵאֲרָיוֹת גָּבֵרוּ
  choice: walikuwa hodari kuliko simba
  rationale: גבר huonyesha nguvu au uwezo uliozidi. “Hodari kuliko simba” ni wazi na ya kishairi, huku “wenye nguvu zaidi” likibaki chaguo linalowezekana.
theological_decisions:
- issue: Sauti ya maombolezo ya Daudi juu ya Sauli na Yonathani
  choice: Sifa ya kishairi na yenye heshima imedumishwa bila kupunguza kauli chanya kuhusu Sauli.
  alternative: Kupunguza sifa kwa sababu ya makosa ya Sauli yaliyosimuliwa awali, au kuizidisha kana kwamba inatangaza ukamilifu wake wa kimaadili.
  rationale: Mstari huu ni sehemu ya maombolezo ya mazishi na unawasifu Sauli na Yonathani pamoja. Tafsiri inapaswa kuhifadhi mvutano huo wa simulizi bila kuuingiza hukumu ya kimadhehebu au kuutatua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa maombolezo ya kishairi ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Mpangilio wa mistari umehifadhi usambamba wa shairi la Kiebrania.
