  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו דָּוִ֑ד אֵ֚יךְ לֹ֣א יָרֵ֔אתָ לִ/שְׁלֹ֨חַ֙ יָֽדְ/ךָ֔ לְ/שַׁחֵ֖ת אֶת מְשִׁ֥יחַ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/014.yaml
  text: Then David said to him[b][a], “How were you not afraid to put out your hand to destroy Yahweh’s anointed?”
translation:
  language: sw
  text: Ndipo Daudi akamwambia, “Imekuwaje[a] kwamba hukuogopa kuunyosha mkono wako ili kumwangamiza mtiwa-mafuta wa Yahwe[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa nini hukuogopa…?” Neno la Kiebrania אֵיךְ kwa msingi linamaanisha “jinsi gani?” na hapa linaonyesha mshangao wenye karipio.
    reason: lexical_alternative
  - marker: b
    text: “Mtiwa-mafuta wa Yahwe” hapa ni mfalme aliyewekwa wakfu na Yahwe, yaani Sauli.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Mfuatano wa simulizi unaoonyeshwa na waw-consecutive umewasilishwa kwa “Ndipo,” huku kitenzi “akamwambia” kikibeba mtendaji na mtendewa kwa Kiswahili cha kawaida.
- source_word: אֵיךְ
  choice: Imekuwaje
  rationale: Huhifadhi maana ya msingi ya swali “jinsi gani?” na sauti ya mshangao wenye karipio, bila kulifanya moja kwa moja kuwa swali la sababu.
- source_word: לֹא יָרֵאתָ
  choice: hukuogopa
  rationale: Ni usemi wa kawaida wa Kiswahili unaodumisha wazo la kutokuwa na hofu au kicho mbele ya kitendo hiki.
- source_word: לִשְׁלֹחַ יָדְךָ
  choice: kuunyosha mkono wako
  rationale: Huhifadhi nahau ya Kiebrania ya kuchukua hatua dhidi ya mtu, hasa hatua ya kumdhuru, na bado inaeleweka katika Kiswahili.
- source_word: לְשַׁחֵת
  choice: ili kumwangamiza
  rationale: Kitenzi שׁחת kina maana pana ya kuharibu au kuangamiza; hapa kinamlenga mtu na katika muktadha huu kinamaanisha tendo lenye kusababisha kifo.
- source_word: מְשִׁיחַ
  choice: mtiwa-mafuta
  rationale: Humtambulisha Sauli kama mfalme aliyewekwa wakfu kwa kutiwa mafuta, bila kuingiza moja kwa moja maana ya baadaye ya jina la cheo “Masihi.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika tetragramatoni limetoholewa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa na cheo “BWANA.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina na ni umbo linalofaa katika Kiswahili.
- issue: Maana ya מְשִׁיחַ inapomhusu Sauli
  choice: mtiwa-mafuta wa Yahwe
  alternative: Masihi wa Yahwe; aliyetiwa mafuta na Yahwe
  rationale: Katika simulizi hili neno linamhusu Sauli katika nafasi yake ya kifalme iliyowekwa wakfu. “Mtiwa-mafuta” hudumisha maana hiyo bila kulazimisha matumizi ya baadaye ya kimasiya.
- issue: Nguvu ya karipio katika אֵיךְ
  choice: Imekuwaje kwamba hukuogopa
  alternative: Kwa nini hukuogopa
  rationale: “Imekuwaje” huhifadhi umbo la Kiebrania na mshangao wa Daudi. “Kwa nini” ni tafsiri halali ya kimuktadha lakini inaelekeza swali zaidi kwenye sababu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “kuunyosha mkono” umehifadhi nahau ya chanzo bila kuwa mgumu kueleweka; “mtiwa-mafuta” ni wa kimuktadha na huepuka kuingiza tafsiri ya kidhehebu.
