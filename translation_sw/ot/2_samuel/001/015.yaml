translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umehifadhiwa, na tofauti kati ya shambulio, kipigo, na kifo haijafupishwa kuwa amri ya moja kwa moja ya “kumwua.”
