  text: Then David called one of the young men and said[a], “Come near; strike him down.” So he struck him, and he died.
translation:
  language: sw
  text: Ndipo Daudi akamwita mmoja wa vijana, akamwambia, “Karibia, umshambulie[a].” Basi akampiga, naye akafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umpige” au “umrukie.” Kitenzi cha Kiebrania (פְּגַע בּוֹ) kinaweza kumaanisha kumshambulia kwa nguvu kwa ujumla; hapa muktadha unaonyesha wazi kuwa matokeo yake ni kifo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: Katika simulizi hili קרא humaanisha kumwita au kumwagiza mtu aje; “akamwita” ni ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: לְאַחַד מֵהַנְּעָרִים
  choice: mmoja wa wale vijana
  rationale: נְעָרִים inaweza kumaanisha vijana, watumishi, au wasaidizi. “Vijana” huhifadhi maana ya msingi ya umri/hadhi bila kuifanya kuwa cheo maalumu.
- source_word: גַּשׁ
  choice: Njoo karibu
  rationale: Amri ya נגשׁ humaanisha kukaribia; “Njoo karibu” ni ya asili katika mfuatano huu wa amri.
- source_word: פְּגַע בּוֹ
  choice: umshambulie
  rationale: פגע pamoja na ב inaweza kumaanisha kumshambulia, kumpiga, au kumrukia kwa nguvu. “Umshambulie” huhifadhi upana wa kitenzi, huku muktadha na matokeo yakionyesha kuwa shambulio hilo lilikuwa la kumuua.
- source_word: וַיַּכֵּהוּ
  choice: akampiga
  rationale: נכה ni kitenzi cha kawaida cha kupiga. Tafsiri hii huhifadhi tofauti kati ya kitendo na matokeo yanayotajwa katika kishazi kinachofuata.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: מות humaanisha kufa; “naye akafa” huendeleza mfuatano wa simulizi kwa Kiswahili cha asili.
