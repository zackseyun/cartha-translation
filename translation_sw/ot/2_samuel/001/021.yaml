base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/021.yaml
  text: Mountains of Gilboa[a], let there be no dew or rain upon you, nor fields of offerings; for there the shield of the mighty was defiled, the shield of Saul[b], not anointed with oil.
translation:
  language: sw
  text: Enyi milima ya Gilboa, umande wala mvua visiwe juu yenu, wala yasiwepo mashamba ya matoleo[a]; kwa maana huko ngao ya mashujaa ilinajisiwa—ngao ya Sauli, bila kupakwa mafuta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mashamba yenye mazao mengi,” “mashamba ya malimbuko,” au “mashamba ya sadaka za kuinuliwa.” Kirai cha Kiebrania ni kigumu, na neno תְּרוּמוֹת mara nyingi humaanisha matoleo yaliyotengwa kwa ajili ya Mungu.
    reason: lexical_alternative
  - marker: b
    text: Huenda kirai cha mwisho kinamaanisha kwamba ngao ya Sauli haikupakwa mafuta, desturi ya kuitayarisha ngao kwa vita, badala ya kumrejelea Sauli mwenyewe kuwa “mtiwa mafuta.”
    reason: cultural_note
lexical_decisions:
- source_word: הָרֵי בַגִּלְבֹּעַ
  choice: Enyi milima ya Gilboa
  rationale: Kirai hiki kinaiambia moja kwa moja milima ya eneo la Gilboa katika wimbo wa maombolezo. “Enyi” huonyesha mwito huo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: אַל טַל וְאַל מָטָר עֲלֵיכֶם
  choice: umande wala mvua visiwe juu yenu
  rationale: אַל hapa inaeleza ombi au laana ya kishairi. Muundo wa “visiwe juu yenu” huhifadhi usemi wa moja kwa moja kwa milima.
- source_word: וּשְׂדֵי תְרוּמֹת
  choice: wala yasiwepo mashamba ya matoleo
  rationale: Kirai cha Kiebrania ni kigumu. תְרוּמוֹת mara nyingi ni matoleo yaliyotengwa, hasa kwa ajili ya Mungu. Tafsiri kuu huhifadhi maana hiyo bila kuifafanua kupita kiasi, huku tanbihi ikitaja uwezekano mwingine.
- source_word: כִּי שָׁם
  choice: kwa maana huko
  rationale: Huanzisha sababu ya laana kwa Kiswahili cha kawaida huku ikihifadhi msisitizo wa mahali.
- source_word: נִגְעַל
  choice: ilinajisiwa
  rationale: Neno hili linaweza kuonyesha kutiwa unajisi au kufedheheshwa. “Ilinajisiwa” huhifadhi picha ya ngao iliyopata aibu vitani bila kuongeza maelezo yasiyotajwa.
- source_word: מָגֵן גִּבּוֹרִים
  choice: ngao ya mashujaa
  rationale: גִּבּוֹרִים hapa ni wapiganaji hodari au mashujaa. “Mashujaa” ni fupi, ya kishairi, na inaeleweka kwa wasomaji wa sasa.
- source_word: מָגֵן שָׁאוּל
  choice: ngao ya Sauli
  rationale: 'Marudio ya kishairi yamehifadhiwa: kwanza ngao ya mashujaa kwa jumla, kisha ngao ya Sauli hasa.'
- source_word: בְּלִי מָשִׁיחַ בַּשָּׁמֶן
  choice: bila kupakwa mafuta
  rationale: Katika muktadha huu kirai kinaelekea kueleza ngao ambayo haikupakwa mafuta. “Kupakwa mafuta” huhifadhi picha halisi na haiongezi tashbihi isiyosemwa wazi katika Kiebrania.
theological_decisions:
- issue: Je, מָשִׁיחַ hapa ni jina la kitheolojia “Masiya/Mtiwa-mafuta,” au inaeleza kupakwa kwa ngao?
  choice: Kirai kimetafsiriwa kwa maana ya kitendo, “bila kupakwa mafuta,” kikirejelea ngao ya Sauli.
  alternative: “ngao ya Sauli, ya mtiwa-mafuta” au “ngao ya Sauli, si ya mtu aliyetiwa mafuta”
  rationale: Uhusiano wa karibu wa מָשִׁיחַ na בַּשָּׁמֶן (“kwa mafuta”) pamoja na muktadha wa ngao unaunga mkono maana ya kawaida ya kuipaka ngao mafuta. Hivyo tafsiri haileti hapa cheo cha Kimasihi au dai la kitheolojia lisilohitajika na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kishairi na chenye hadhi lakini kinachoeleweka kwa urahisi. Mwito “Enyi milima” na marudio ya “ngao” huhifadhi muundo wa maombolezo. Alama ya mkato mrefu inaonyesha ufafanuzi wa kishairi bila kuvunja sentensi.
