  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִ/דַּ֣ם חֲלָלִ֗ים מֵ/חֵ֨לֶב֙ גִּבּוֹרִ֔ים קֶ֚שֶׁת יְה֣וֹנָתָ֔ן לֹ֥א נָשׂ֖וֹג אָח֑וֹר וְ/חֶ֣רֶב שָׁא֔וּל לֹ֥א תָשׁ֖וּב רֵיקָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/022.yaml
  text: From the blood of the slain[a], from the fat of the mighty, Jonathan’s bow did not turn back[b], and Saul’s sword did not return empty.
translation:
  language: sw
  text: 'Kutoka katika damu ya waliouawa, kutoka katika mafuta ya mashujaa[a],

    upinde wa Yonathani haukurudi nyuma[b],

    wala upanga wa Sauli haukurudi bure.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania lililotafsiriwa “mafuta” linaweza pia kudokeza sehemu nono, bora au teule, na hivyo kukazia ushindi vitani.
    reason: lexical_alternative
  - marker: b
    text: Au “haukujiondoa nyuma.” Kitenzi cha Kiebrania kinaweza kumaanisha kujiondoa au kurudi nyuma.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם חֲלָלִים
  choice: Kutoka katika damu ya waliouawa
  rationale: Kirai hiki kinadumisha taswira ya Kiebrania ya silaha kutorudi nyuma baada ya kukutana na damu; חֲלָלִים hapa kwa kawaida ni waliouawa vitani.
- source_word: מֵחֵלֶב גִּבּוֹרִים
  choice: kutoka katika mafuta ya mashujaa
  rationale: חֵלֶב imetafsiriwa kwa maana yake halisi, ‘mafuta,’ ili kuhifadhi taswira kali ya kishairi; גִּבּוֹרִים ni wapiganaji hodari, na ‘mashujaa’ inadumisha hadhi ya utenzi huu.
- source_word: קֶשֶׁת יְהוֹנָתָן
  choice: upinde wa Yonathani
  rationale: Muundo wa umilikaji umetafsiriwa kwa Kiswahili cha kawaida na cha kishairi.
- source_word: לֹא נָשׂוֹג אָחוֹר
  choice: haukurudi nyuma
  rationale: נסוג pamoja na אָחוֹר hueleza kurudi au kujiondoa nyuma; tafsiri hii inahifadhi uhuishaji wa upinde bila kueleza zaidi ya maandishi.
- source_word: וְחֶרֶב שָׁאוּל
  choice: wala upanga wa Sauli
  rationale: ‘Wala’ huendeleza ukanushi katika mstari sambamba kwa Kiswahili cha asili.
- source_word: לֹא תָשׁוּב רֵיקָם
  choice: haukurudi bure
  rationale: Kirai hiki humaanisha kwamba upanga haukurudi bila kutimiza kusudi lake. ‘Bure’ ni ya asili zaidi kuliko ‘tupu’ kwa Kiswahili huku ikihifadhi ufupi wa kishairi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki chenye mtindo wa kishairi na wenye hadhi unaofaa maombolezo. Mistari sambamba ya Kiebrania imehifadhiwa, pamoja na uhuishaji wa upinde na upanga. ‘Yonathani’ limetumiwa kama umbo la kawaida la jina la kibiblia katika Kiswahili.
