  text: וַ/יֹּ֣אמֶר אֵלַ֗/י עֲמָד נָ֤א עָלַ/י֙ וּ/מֹ֣תְתֵ֔/נִי כִּ֥י אֲחָזַ֖/נִי הַ/שָּׁבָ֑ץ כִּֽי כָל ע֥וֹד נַפְשִׁ֖/י בִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/009.yaml
  text: And he said to me[a], ‘Please stand over me and put me to death, for anguish has seized me[b], though my life is still in me.’
translation:
  language: sw
  text: Naye akaniambia, “Tafadhali simama juu yangu, uniue, kwa maana uchungu umenishika[a], ingawa bado nina uhai.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana mikakama/degedege imenishika.” Neno la Kiebrania lililotafsiriwa “uchungu” ni adimu, na maana yake kamili haijulikani.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kwa karibu zaidi: “kwa maana uhai/nafsi yangu yote bado imo ndani yangu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָד נָא עָלַי
  choice: Tafadhali simama juu yangu
  rationale: Kitenzi עָמַד ni ‘kusimama,’ na עַל katika muktadha huu huonyesha kusimama juu ya mtu aliyeanguka au kujeruhiwa. ‘Tafadhali’ huwasilisha ombi la נָא.
- source_word: וּמֹתְתֵנִי
  choice: uniue
  rationale: Umbo la kisababishi la מות hapa ni ombi la moja kwa moja la kusababisha kifo. ‘Uniue’ ni Kiswahili cha kawaida, wazi, na kinachofaa muktadha wa vita.
- source_word: אֲחָזַנִי
  choice: umenishika
  rationale: אָחַז humaanisha kushika au kukamata. ‘Umenishika’ huhifadhi picha ya hali iliyomkamata na kumlemea.
- source_word: הַשָּׁבָץ
  choice: uchungu
  rationale: Neno hili la Kiebrania ni adimu na maana yake kamili haijulikani. ‘Uchungu’ ni pana vya kutosha kutoamua kimabavu ikiwa hali hiyo ilikuwa maumivu, mikakama, au degedege; uwezekano wa hali ya kimwili umeelezwa katika tanbihi.
- source_word: כִּי כָל עוֹד נַפְשִׁי בִּי
  choice: ingawa bado nina uhai
  rationale: נֶפֶשׁ hapa huelekea kumaanisha uhai unaohuisha mwili, si ‘roho’ kwa maana maalumu ya kiteolojia. ‘Ingawa’ huwasilisha uhusiano wa kukinzana unaoeleweka katika muktadha, huku tanbihi ikihifadhi muundo wa karibu zaidi na Kiebrania.
- source_word: וַיֹּאמֶר אֵלַי
  choice: Naye akaniambia
  rationale: Huu ni mwendelezo wa kawaida wa simulizi unaoanzisha maneno yaliyonukuliwa. ‘Naye akaniambia’ ni wa asili na wenye hadhi katika Kiswahili.
