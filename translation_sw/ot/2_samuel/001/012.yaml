  text: וַֽ/יִּסְפְּדוּ֙ וַ/יִּבְכּ֔וּ וַ/יָּצֻ֖מוּ עַד הָ/עָ֑רֶב עַל שָׁא֞וּל וְ/עַל יְהוֹנָתָ֣ן בְּנ֗/וֹ וְ/עַל עַ֤ם יְהוָה֙ וְ/עַל בֵּ֣ית יִשְׂרָאֵ֔ל כִּ֥י נָפְל֖וּ בֶּ/חָֽרֶב־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/012.yaml
  text: They mourned[a], wept, and fasted until evening for Saul, for Jonathan his son, for the people of Yahweh, and for the house of Israel[b], because they had fallen by the sword.
translation:
  language: sw
  text: Wakaomboleza, wakalia na kufunga mpaka jioni kwa ajili ya Sauli, Yonathani mwanawe, watu wa Yahwe, na nyumba ya Israeli, kwa sababu walikuwa wameanguka kwa upanga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְפְּדוּ
  choice: wakaomboleza
  rationale: Kitenzi ספד humaanisha kuomboleza au kufanya maombolezo kwa ajili ya waliokufa. “Wakaomboleza” ni Kiswahili cha kawaida chenye hadhi na hakibainishi kupita kiasi namna ya maombolezo hayo.
- source_word: וַיִּבְכּוּ
  choice: wakalia
  rationale: בכה humaanisha kulia. Chaguo hili linatofautisha kitendo cha kulia na maana pana ya kuomboleza iliyotangulia.
- source_word: וַיָּצֻמוּ
  choice: na kufunga
  rationale: צום ni kujizuia kula kama tendo la huzuni au ibada. “Kufunga” ndiyo istilahi ya kawaida ya Kiswahili katika muktadha huu.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Kirai hiki kinaonyesha muda ambao maombolezo yaliendelea; “mpaka jioni” ni usemi wa asili katika Kiswahili.
- source_word: עַל
  choice: kwa ajili ya
  rationale: עַל inayorudiwa hapa inataja wale ambao kifo chao kilisababisha maombolezo. “Kwa ajili ya” huwasilisha uhusiano huo kwa uwazi.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: Yonathani mwanawe
  rationale: Muundo wa Kiebrania unamtambulisha Yonathani kuwa mwana wa Sauli. Tafsiri hii inadumisha mpangilio huo bila kuongeza maneno.
- source_word: עַם יְהוָה
  choice: watu wa Yahwe
  rationale: Kirai cha Kiebrania ni muundo wa umilikaji unaomaanisha watu walio wa Yahwe. Tafsiri hii inadumisha jina la Mungu na maana ya pamoja ya עַם.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: בֵּית יִשְׂרָאֵל
  choice: nyumba ya Israeli
  rationale: Hili ni jina la pamoja la taifa au jamii ya Israeli. “Nyumba ya Israeli” huhifadhi nahau ya kibiblia na maana yake ya kijamii.
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי hapa inatoa sababu ya kuomboleza; “kwa sababu” inaeleza uhusiano huo moja kwa moja.
- source_word: נָפְלוּ
  choice: walikuwa wameanguka
  rationale: נפל ni “kuanguka,” na katika muktadha wa vita ni nahau ya kufa vitani. Tafsiri hii huhifadhi taswira ya Kiebrania badala ya kuifafanua kuwa “waliuawa.”
- source_word: בֶּחָרֶב
  choice: kwa upanga
  rationale: Kirai hiki hutaja upanga kama njia ya kifo na pia ni usemi wa kawaida wa kifo vitani. “Kwa upanga” huhifadhi taswira halisi ya matini.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania inatumia jina binafsi יהוה. “Yahwe” hulihifadhi kama jina la Mungu katika umbo linalofaa Kiswahili badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa orodha umerahisishwa kwa kutumia “kwa ajili ya” mara moja bila kupoteza walengwa wanne wa maombolezo. Hakuna tanbihi zilizowekwa, kwa kuwa tanbihi za safu ya ushauri ya Kiingereza hazilingani na alama zake na matini ya Kiebrania hapa haihitaji ufafanuzi wa lazima.
