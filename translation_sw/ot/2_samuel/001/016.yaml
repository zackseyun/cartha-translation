  yaml_path: translation/ot/2_samuel/001/016.yaml
  text: Then David said to him[a], “Your blood is on your own head, for your own mouth has testified against you, saying[b], ‘I myself killed Yahweh’s anointed.’”
translation:
  language: sw
  text: Ndipo Daudi akamwambia, “Damu yako iko juu ya kichwa chako[a], kwa kuwa kinywa chako kimeshuhudia dhidi yako[b], kikisema, ‘Mimi mwenyewe nilimuua mtiwa mafuta wa Yahweh.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Damu yako na iwe juu ya kichwa chako.” Nahau hii ina maana kwamba yeye mwenyewe anawajibika kwa kifo chake.
    reason: lexical_alternative
  - marker: b
    text: Au, “kinywa chako kimetoa ushahidi dhidi yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו דָּוִד
  choice: Ndipo Daudi akamwambia
  rationale: “Ndipo” huendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida, na “akamwambia” hujumuisha wazi maana ya kusema kwake yeye.
- source_word: דָּמֶיךָ עַל רֹאשֶׁךָ
  choice: Damu yako iko juu ya kichwa chako mwenyewe
  rationale: Usemi huu huhifadhi taswira ya Kiebrania ya damu kuwa juu ya kichwa cha mtu na, katika muktadha wa hukumu, humweka yeye mwenyewe kuwa na wajibu wa kifo chake.
- source_word: כִּי
  choice: kwa kuwa
  rationale: Huanzisha sababu ambayo Daudi anatoa kwa hukumu yake.
- source_word: פִּיךָ עָנָה בְךָ
  choice: kinywa chako mwenyewe kimeshuhudia dhidi yako
  rationale: “Kinywa” kimehifadhiwa kama metonimia inayosisitiza kwamba maneno yake mwenyewe ndiyo yaliyomtia hatiani; “kimeshuhudia dhidi yako” hutoa maana ya kisheria ya עָנָה בְךָ.
- source_word: לֵאמֹר
  choice: kwa kusema
  rationale: Huanzisha yaliyomo katika ushahidi wa maneno yake.
- source_word: אָנֹכִי
  choice: Mimi mwenyewe
  rationale: Kiwakilishi huru cha Kiebrania kina mkazo, ambao umehifadhiwa kwa “Mimi mwenyewe.”
- source_word: מֹתַתִּי
  choice: nilimuua
  rationale: Kitenzi hiki kina maana ya kusababisha kifo; “nilimuua” ni tafsiri ya moja kwa moja na ya kawaida katika ungamo hili.
- source_word: מְשִׁיחַ יְהוָה
  choice: mtiwa-mafuta wa Yahweh
  rationale: Hili ni jina la cheo la kifalme linalomhusu Sauli. “Mtiwa-mafuta” hutafsiri maana ya neno badala ya kuingiza mapema matumizi ya baadaye ya “Masihi.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika herufi nne limetolewa kama jina binafsi “Yahweh,” si kubadilishwa na cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina la agano moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Jinsi ya kutafsiri מְשִׁיחַ katika muktadha wa kifalme
  choice: mtiwa-mafuta
  alternative: Masihi
  rationale: Hapa neno linamtaja Sauli kama mfalme aliyewekwa wakfu kwa kutiwa mafuta. Kutafsiri maana yake huepuka kuingiza bila lazima mahusiano ya baadaye ya kikristo katika simulizi hili.
- issue: Hali ya kisarufi ya דָּמֶיךָ עַל רֹאשֶׁךָ
  choice: 'kauli ya hukumu: “Damu yako iko juu ya kichwa chako mwenyewe”'
  alternative: 'ombi au tamko la matokeo: “Damu yako na iwe juu ya kichwa chako”'
  rationale: Kiebrania hakina kitenzi kilichoandikwa, hivyo muundo unaweza kusikika kama kauli au tamko la hukumu. Matini kuu imetumia kauli ya uwajibikaji, huku tanbihi ikihifadhi uwezekano rasmi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida lakini sauti yenye hadhi ya hukumu. Taswira ya Kiebrania kuhusu damu juu ya kichwa na metonimia ya “kinywa” zimehifadhiwa, huku tanbihi zikifafanua maana bila kuiondoa katika matini.
