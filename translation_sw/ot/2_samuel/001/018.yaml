  text: 'Naye akasema kwamba wana wa Yuda wafundishwe “Upinde.”[a] Tazama, imeandikwa katika Kitabu cha Yashari:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania inaweza kumaanisha “upinde” kama kichwa cha maombolezo haya, au kwamba wana wa Yuda wafundishwe kutumia upinde.
    reason: Huhifadhi utata wa kisintaksia na wa kimuktadha wa קָשֶׁת bila kuchagua tafsiri moja kwa uhakika.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: naye akaagiza
  rationale: Katika muktadha, kitenzi hiki kinaanzisha agizo la Daudi; ‘akaagiza’ huwasilisha kusudi hilo kwa Kiswahili cha kawaida bila kulifanya kuwa nukuu ya moja kwa moja.
- source_word: לְלַמֵּד
  choice: wafundishwe
  rationale: Infinitivu hii inaonyesha kwamba wana wa Yuda walipaswa kufundishwa; umbo la kutendwa ni la asili katika Kiswahili hapa.
- source_word: בְּנֵי יְהוּדָה
  choice: wana wa Yuda
  rationale: Tafsiri rasmi inayohifadhi usemi wa ukoo/kabila katika Kiebrania.
- source_word: קָשֶׁת
  choice: “Upinde”
  rationale: Neno kwa kawaida humaanisha upinde. Katika muktadha huu linaeleweka vyema kama kichwa cha wimbo wa maombolezo, lakini sintaksia ya Kiebrania inaweza pia kumaanisha kuwafundisha matumizi ya upinde; alama za kunukuu zinafuata uwezekano wa kichwa bila kuficha mbadala huo.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Huhifadhi kishazi cha kuvuta fikira kilicho wazi katika maandishi ya Kiebrania.
- source_word: סֵפֶר הַיָּשָׁר
  choice: Kitabu cha Yashari
  rationale: Jina la kitabu linanakiliwa kwa sauti badala ya kutafsiriwa kwa namna ambayo ingeweza kudokeza kwa uhakika maana ya jina hilo.
theological_decisions:
- issue: Je, קָשֶׁת ni kichwa cha wimbo au silaha ambayo watu wa Yuda walipaswa kujifunza kutumia?
  choice: “Upinde” kama kichwa
  alternative: ‘matumizi ya upinde’ au ‘upinde’ bila alama za kunukuu
  rationale: Muktadha wa wimbo unaofuata na safu ya usimulizi vinaunga mkono kusoma neno hili kama kichwa, lakini Kiebrania ni kifupi na kinaweza kueleweka vingine; kwa hiyo jambo hilo halipanuliwi ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa urahisi. ‘Wana wa Yuda’ na ‘Tazama’ huhifadhi ladha ya simulizi la kibiblia; ‘Yashari’ ni unukuzi wa jina la Kiebrania.
