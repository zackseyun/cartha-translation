  text: Then David took hold of his clothes and tore them[a], and so did all the men who were with him.
translation:
  language: sw
  text: Ndipo Daudi akashika mavazi yake na kuyararua[a]; na wanaume wote waliokuwa pamoja naye wakafanya vivyo hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, neno linalotafsiriwa “mavazi yake” kwa maana halisi ni “vazi lake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲזֵק
  choice: akashika
  rationale: Kitenzi חזק hapa kinaonyesha kitendo cha kushika vazi kabla ya kulirarua. “Akashika” ni Kiswahili cha kawaida na kinahifadhi kitendo hicho bila kuongeza tafsiri ya sababu yake.
- source_word: בְּבִגְדוֹ
  choice: mavazi yake
  rationale: Ingawa neno la Kiebrania lina umbo la umoja, Kiswahili hutumia “mavazi” kwa kawaida katika muktadha wa kurarua nguo kama ishara ya huzuni. Chaguo hili pia linaendana kwa urahisi na kiambishi cha wingi katika kitenzi kinachofuata.
- source_word: וַיִּקְרָעֵם
  choice: na kuyararua
  rationale: “Kuyararua” linaonyesha wazi kitendo cha kurarua mavazi na kuhifadhi nguvu ya kitenzi קרע katika lugha ya heshima na ya kawaida.
- source_word: וְגַם
  choice: wakafanya vivyo hivyo
  rationale: Kiebrania kinaunganisha na kueneza kitendo cha Daudi kwa wanaume waliokuwa pamoja naye. “Wakafanya vivyo hivyo” huwasilisha kwa Kiswahili cha asili kitenzi kilichoachwa kueleweka katika kishazi cha pili.
- source_word: כָּל הָאֲנָשִׁים
  choice: wanaume wote
  rationale: הָאֲנָשִׁים hapa humaanisha wanaume, si kundi lisilobainishwa kijinsia; hivyo tafsiri inahifadhi maana mahsusi ya chanzo.
- source_word: אֲשֶׁר אִתּוֹ
  choice: waliokuwa pamoja naye
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kishazi kinachowatambulisha waandamani wa Daudi.
