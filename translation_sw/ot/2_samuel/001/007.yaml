  text: He turned around and saw me[a], and he called to me, and I said, “Here I am.”
translation:
  language: sw
  text: Akageuka, akaniona[a], akaniita, nami nikasema, “Mimi hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa neno kwa neno, “Akageuka nyuma yake.” Usemi huo unamaanisha kwamba aligeuka na kutazama upande wa nyuma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אַחֲרָיו
  choice: Akageuka
  rationale: Kirai hiki kwa kawaida humaanisha kugeuka na kutazama upande wa nyuma; ‘akageuka’ ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: וַיִּרְאֵנִי
  choice: akaniona
  rationale: Kitenzi ראה pamoja na kiambishi cha nafsi ya kwanza umoja humaanisha moja kwa moja ‘akaniona.’
- source_word: וַיִּקְרָא אֵלַי
  choice: akaniita
  rationale: קרא pamoja na אֶל humaanisha kumwita mtu; ‘akaniita’ ni ya asili na haiingizi wazo lenye nguvu zaidi la kuamuru afike.
- source_word: וָאֹמַר
  choice: nami nikasema
  rationale: אמר humaanisha ‘kusema’; ‘nami nikasema’ huhifadhi mfuatano wa simulizi na ni ya kawaida kwa Kiswahili.
- source_word: הִנֵּנִי
  choice: Mimi hapa
  rationale: Hili ni jibu la kujitambulisha na kuonyesha utayari; ‘Mimi hapa’ huhifadhi maana hiyo kwa Kiswahili cha kawaida.
