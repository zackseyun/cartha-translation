lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: Akaniambia
  rationale: Kitenzi chenye mfuatano wa simulizi pamoja na לִי kinaonyesha kwamba Sauli alimwambia msimuliaji; “akaniambia” ni Kiswahili cha kawaida na huhifadhi mfuatano huo.
- source_word: מִי אַתָּה
  choice: Wewe ni nani?
  rationale: Hili ni swali la utambulisho kwa nafsi ya pili umoja; mpangilio huu ni wa asili katika Kiswahili na kiwakilishi “wewe” huhifadhi msisitizo wa אַתָּה.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Nami nikamjibu
  rationale: Ingawa maandishi ya Kiebrania yana umbo la nafsi ya tatu, muktadha unaonyesha msimuliaji ndiye anayemjibu Sauli. “Nikamjibu” huwasilisha maana ya usemi katika muktadha na pia mwelekeo wa אֵלָיו.
- source_word: עֲמָלֵקִי
  choice: Mwamaleki
  rationale: Nomino hii ya kabila humtambulisha msemaji kuwa mtu wa Waamaleki; “Mwamaleki” ni umbo la kawaida la Kiswahili kwa mtu mmoja.
- source_word: אָנֹכִי
  choice: Mimi ni
  rationale: Kiwakilishi huru kinaweka wazi na kusisitiza utambulisho wa msemaji; Kiswahili hutumia “mimi ni” katika kauli kama hii.
