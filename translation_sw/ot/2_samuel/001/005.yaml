  yaml_path: translation/ot/2_samuel/001/005.yaml
  text: Then David said to the young man who told him, “How do you know that Saul and Jonathan his son are dead?”
translation:
  language: sw
  text: Kisha Daudi akamwambia yule kijana aliyemletea habari, “Umejuaje kwamba Sauli na Yonathani, mwanawe, wamekufa?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, huku “akamwambia” ikiwakilisha kitendo cha kusema kilichoelekezwa kwa kijana.
- source_word: הַנַּעַר
  choice: yule kijana
  rationale: נַעַר hapa humaanisha kijana wa kiume, si lazima mtoto wala mtumishi; “yule” humtambulisha kama kijana ambaye tayari ametajwa katika muktadha.
- source_word: הַמַּגִּיד לוֹ
  choice: aliyemletea habari
  rationale: Kirai kishirikishi kinamtambulisha kijana kuwa ndiye aliyempa Daudi taarifa. “Kumletea habari” ni usemi wa asili wa Kiswahili unaohifadhi maana ya kutoa taarifa.
- source_word: אֵיךְ יָדַעְתָּ
  choice: Umejuaje
  rationale: Kauli hii inauliza msingi au njia ambayo kijana alipata maarifa hayo. Hali timilifu ya Kiswahili ni ya kawaida na sahihi katika swali hili.
- source_word: כִּי
  choice: kwamba
  rationale: כִּי inaanzisha yaliyomo katika jambo linalojulikana; “kwamba” hufanya kazi hiyo kwa uwazi katika Kiswahili.
- source_word: מֵת
  choice: wamekufa
  rationale: Ingawa Kiebrania kina kitenzi cha umoja pamoja na kiima ambatano, Kiswahili kinahitaji upatanisho wa wingi kwa Sauli na Yonathani. “Wamekufa” huonyesha tukio lililotimia na hali yake inayohusika sasa.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Kiambishi cha umilikaji kinamrejelea Sauli na kumtambulisha Yonathani kuwa mwana wake; “mwanawe” ni tafsiri fupi na ya asili.
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: Sauli na Yonathani
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili.
