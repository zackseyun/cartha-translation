base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/010.yaml
  text: So I stood over him and put him to death[a], because I knew that he would not live after he had fallen. Then I took the crown that was on his head and the armlet that was on his arm[b], and I brought them here to my lord.
translation:
  language: sw
  text: Basi nikasimama juu yake, nikamuua, kwa maana nilijua kwamba hangeendelea kuishi baada ya kuanguka kwake. Kisha nikaitwaa taji iliyokuwa kichwani mwake na pambo la mkononi lililokuwa kwenye mkono wake[a], nami nimevileta hapa kwa bwana wangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bangili.” Neno la Kiebrania linamaanisha pambo linalovaliwa kwenye mkono.
    reason: lexical_alternative
  - marker: b
    text: Hii ndiyo taarifa ya Mwamaleki kwa Daudi. Linganisha 1 Samweli 31:4–5 kwa simulizi la awali kuhusu kifo cha Sauli.
    reason: cross_reference
lexical_decisions:
- source_word: וָאֶעֱמֹד עָלָיו
  choice: nikasimama juu yake
  rationale: Katika muktadha huu, עמד pamoja na על inaonyesha kwamba Mwamaleki alisimama karibu na juu ya Sauli aliyekuwa ameanguka; usemi huu ni wa kawaida na haumaanishi kwamba alimkanyaga.
- source_word: וַאֲמֹתְתֵהוּ
  choice: nikamuua
  rationale: Hifili ya מות inaeleza wazi kwamba msemaji anadai alisababisha kifo cha Sauli. 'Nikamuua' ni ya moja kwa moja, ya asili, na yenye uzito unaofaa.
- source_word: כִּי יָדַעְתִּי כִּי לֹא יִחְיֶה
  choice: kwa maana nilijua kwamba hangeendelea kuishi
  rationale: Huhifadhi hoja ya msemaji na maana ya kutobaki hai, huku ikitoa Kiswahili cha asili.
- source_word: אַחֲרֵי נִפְלוֹ
  choice: baada ya kuanguka
  rationale: Muundo wa kitenzi-jina unaeleza wakati; tafsiri hii haiongezi kisababishi kisichotajwa.
- source_word: הַנֵּזֶר
  choice: taji
  rationale: Hapa נזר ni alama ya kifalme iliyovaliwa kichwani; 'taji' ndiyo neno wazi na linaloeleweka kwa urahisi.
- source_word: וְאֶצְעָדָה
  choice: bangili ya mkononi
  rationale: Neno linataja pambo linalovaliwa kwenye mkono. Ufafanuzi 'ya mkononi' huzuia kueleweka kuwa bangili ya mguuni.
- source_word: זְרֹעוֹ
  choice: mkono wake
  rationale: זרוע kwa kawaida ni mkono; muktadha haulazimishi maana nyembamba ya sehemu maalumu ya mkono.
- source_word: וָאֲבִיאֵם ... הֵנָּה
  choice: nami nimevileta hapa
  rationale: 'Ingawa wayyiqtol huendeleza simulizi la wakati uliopita, katika hotuba ya moja kwa moja ''hapa'' inaelekeza kwenye matokeo ya sasa: vitu hivyo vimefikishwa mbele ya Daudi.'
- source_word: אֶל אֲדֹנִי
  choice: kwa bwana wangu
  rationale: אדני hapa ni namna ya heshima kwa Daudi, si jina la Mungu. 'Bwana wangu' huhifadhi adabu ya msemaji kwa mkuu wake.
theological_decisions:
- issue: Dai la simulizi kuhusu kifo cha Sauli
  choice: Kutafsiri moja kwa moja taarifa ya Mwamaleki kwamba yeye ndiye aliyemuua Sauli.
  alternative: Kulainisha dai hilo au kulionyesha ndani ya mstari kuwa ni uongo ili kulipatanisha na 1 Samweli 31:4–5.
  rationale: Mstari huu ni hotuba ya moja kwa moja na unapaswa kuwasilisha anachodai msemaji. Tofauti inayoweza kuonekana na simulizi la 1 Samweli 31 haipaswi kutatuliwa kimya kimya ndani ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Viunganishi vya mfululizo 'nikasimama, nikamuua, nikaitwaa' vinafuata mwendo wa simulizi la Kiebrania. Alama zote za tanbihi zimewekwa katika matini kuu.
