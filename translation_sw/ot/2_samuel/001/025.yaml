  rationale: Huanzisha mshangao wa maombolezo, si swali la kutaka habari; muundo huu ni wa asili katika Kiswahili na unahifadhi nguvu ya kishairi.
- source_word: נָפְלוּ
  choice: walivyoanguka
  rationale: Wakati timilifu wa Kiebrania unaonyesha tukio lililokamilika na lenye athari ya sasa katika maombolezo.
- source_word: גִבֹּרִים
  choice: mashujaa
  rationale: Neno hili linaonyesha watu hodari na mashujaa wa vita bila kuwalazimisha kuwa na cheo maalumu cha kijeshi.
- source_word: בְּתוֹךְ הַמִּלְחָמָה
  choice: katikati ya vita
  rationale: Huhifadhi wazo la kuwa ndani kabisa ya mapambano, si tu kwamba tukio lilitokea wakati wa vita.
- source_word: יְהוֹנָתָן
  choice: Yonathani
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Kiswahili ya kibiblia.
- source_word: עַל
  choice: kwenye
  rationale: Ni kihusishi cha mahali kinachosikika kwa kawaida pamoja na ‘miinuko’ katika Kiswahili cha sasa.
- source_word: בָּמוֹתֶיךָ
  choice: miinuko yako
  rationale: Huhifadhi taswira ya maeneo yaliyoinuka na kuepuka kuingiza moja kwa moja maana ya mahali pa ibada, ambayo si lazima katika muktadha huu.
- source_word: חָלָל
  choice: ameuawa
  rationale: Katika muktadha huu humaanisha mtu aliyeuawa, si aliyejeruhiwa tu; muundo wa kitenzi unakamilisha kishazi kilichoacha kitenzi wazi katika Kiebrania.
theological_decisions:
- issue: Kirejelewa cha kiambishi cha nafsi ya pili katika ‘miinuko yako’
  choice: Kudumisha usemi wa kishairi unaoelekezwa kwa nchi au milima ya Israeli bila kutaja kirejelewa waziwazi
  alternative: Kukichukulia kiambishi hicho kuwa kinamrejelea Yonathani mwenyewe
  rationale: Muktadha wa wimbo wa maombolezo unaifanya nchi ionekane kana kwamba inasemeshwa. Tafsiri inahifadhi kiambishi cha Kiebrania na hivyo haiondoi kabisa uwezekano wa kisarufi wa usomaji mwingine.
translation_notes:
