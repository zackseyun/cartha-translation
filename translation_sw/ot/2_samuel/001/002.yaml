base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/002.yaml
  text: On the third day[a], behold, a man came from the camp, from Saul, with his clothes torn and dirt on his head. And when he came to David[c][b], he fell to the ground and bowed down.
translation:
  language: sw
  text: Siku ya tatu, tazama, mtu mmoja akaja kutoka kambini, kutoka upande wa Sauli[a]. Nguo zake zilikuwa zimeraruliwa, naye alikuwa na udongo kichwani mwake[b]. Alipomjia Daudi, akaanguka chini, akainama mbele yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka akiwa pamoja na Sauli.” Kiebrania kinaonyesha uhusiano na Sauli au kutoka upande wake, si lazima kwamba Sauli ndiye aliyemtuma.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “udongo juu ya kichwa chake.” Kuweka udongo kichwani kulikuwa ishara ya huzuni au maombolezo.
    reason: cultural_note
  - marker: c
    text: Au “akajisujudu.” Kitenzi kinaweza kueleza kuinama au kujitupa chini kwa heshima, utiifu, au kutoa heshima kuu, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: Siku ya tatu
  rationale: Kirai hiki kinaonyesha wakati katika mfululizo wa simulizi. Kiswahili hakihitaji fomula ya ziada kama ‘ikawa’ ili kuwasilisha mpito huo kwa ufasaha.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: ‘Tazama’ huhifadhi nguvu ya kuwasilisha tukio kwa uwazi na kwa ghafla mbele ya msomaji bila kuongeza maana ya ‘mara’ au ‘ghafla’ ambayo haijaandikwa moja kwa moja.
- source_word: אִישׁ
  choice: mtu mmoja
  rationale: Hurejelea mwanamume mmoja maalumu katika simulizi; ‘mtu mmoja’ ni usemi wa kawaida wa Kiswahili wa kumtambulisha mhusika mpya, bila kuhitaji kumwita ‘mwanamume’ hapa.
- source_word: מִן־הַמַּחֲנֶה
  choice: kutoka kambini
  rationale: מַחֲנֶה ni kambi, na muktadha unaonyesha kuwa ni kambi ya kijeshi. Umbo la mahali ‘kambini’ ni la kawaida na fasaha.
- source_word: מֵעִם שָׁאוּל
  choice: kutoka upande wa Sauli
  rationale: Kirai hiki kinaonyesha uhusiano au kuwa pamoja na Sauli, si lazima kwamba Sauli ndiye aliyemtuma. ‘Upande wa Sauli’ huhifadhi maana hiyo bila kuamua zaidi ya maandishi.
- source_word: וּבְגָדָיו קְרֻעִים
  choice: Nguo zake zilikuwa zimeraruliwa
  rationale: Huwasilisha hali ya nguo zake kama ishara ya maombolezo. ‘Nguo’ ni neno la kawaida na lenye hadhi katika Kiswahili cha sasa.
- source_word: וַאֲדָמָה עַל־רֹאשׁוֹ
  choice: alikuwa na udongo kichwani mwake
  rationale: אֲדָמָה kimsingi ni ardhi au udongo. ‘Udongo kichwani’ huhifadhi taswira halisi, huku tanbihi ikieleza desturi yake.
- source_word: בְּבֹאוֹ אֶל־דָּוִד
  choice: Alipomjia Daudi
  rationale: 'Muundo wa kitenzi-jina wenye בְּ unaonyesha wakati: alipokuja kwa Daudi. ‘Alipomjia’ ni tafsiri ya asili na fupi katika Kiswahili.'
- source_word: וַיִּפֹּל אַרְצָה
  choice: akaanguka chini
  rationale: Huhifadhi mwendo wa kuelekea ardhini bila kuongeza kwamba alianguka kifudifudi, jambo ambalo halijasemwa wazi.
- source_word: וַיִּשְׁתָּחוּ
  choice: na kumsujudia
  rationale: Kitenzi kinaweza kumaanisha kusujudu au kuinama kwa heshima, utiifu, au ibada kulingana na muktadha. Hapa ‘kumsujudia’ linaonyesha tendo la heshima kwa Daudi bila kulitaja kuwa ibada.
theological_decisions:
- issue: Ikiwa kusujudu huku kulikuwa ibada au heshima kwa mamlaka
  choice: kumsujudia
  alternative: kuinama mbele yake kwa heshima
  rationale: Maandishi yanaeleza tendo la kujishusha mbele ya Daudi lakini hayalifafanui kuwa ibada. Tafsiri na tanbihi zinaacha upeo wa kitenzi wazi bila kuingiza hitimisho la kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye hadhi. ‘Tazama’ limetumiwa kwa sauti ya kibiblia inayofahamika, huku miundo mingine ikibaki ya kawaida. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
