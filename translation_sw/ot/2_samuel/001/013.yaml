base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/013.yaml
  text: David said to the young man who told him[a], “Where are you from?” And he said, “I am the son of an Amalekite sojourner.”
translation:
  language: sw
  text: Daudi akamwambia yule kijana aliyemletea habari[a], “Wewe unatoka wapi?” Akajibu, “Mimi ni mwana wa mgeni mkazi, Mwamaleki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyempa habari.”
    reason: Kirai הַמַּגִּיד לוֹ kinaweza kutafsiriwa kwa kawaida kuwa alimletea, alimpa, au alimwambia habari; maana ya msingi ni kwamba kijana ndiye aliyemfikishia Daudi taarifa.
lexical_decisions:
- source_word: הַנַּעַר
  choice: kijana
  rationale: Neno נַעַר hapa humaanisha mwanamume kijana; halilazimishi maana ya mtumishi.
- source_word: הַמַּגִּיד לוֹ
  choice: aliyemletea habari
  rationale: Kirai hiki kinamtambulisha kijana kuwa ndiye aliyemfikishia Daudi taarifa; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: אֵי מִזֶּה
  choice: Wewe unatoka wapi?
  rationale: Nahau hii ya Kiebrania huuliza asili au mahali mtu alikotoka. Kiwakilishi “wewe” kinaakisi msisitizo wa אָתָּה kwa njia ya asili.
- source_word: בֶּן אִישׁ
  choice: mwana wa
  rationale: Muundo huu unamtambulisha msemaji kwa nasaba kupitia baba yake bila kudumisha kwa lazima neno la jumla “mtu,” ambalo lingekuwa zito katika Kiswahili.
- source_word: גֵּר
  choice: mgeni mkazi
  rationale: גֵּר ni mtu asiye mzawa anayeishi katika nchi au jamii fulani. “Mgeni mkazi” huwasilisha hadhi hiyo vizuri kuliko “msafiri,” na huepuka maana pana mno ya “mhamiaji.”
- source_word: עֲמָלֵקִי
  choice: Mwamaleki
  rationale: Hili ni jina la kawaida la Kiswahili kwa mtu wa jamii ya Amaleki.
- source_word: אָנֹכִי
  choice: Mimi ni
  rationale: Kiwakilishi huru kina msisitizo wa kujitambulisha; “Mimi ni” ni muundo wa asili wa Kiswahili unaohifadhi msisitizo huo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi ya Biblia lakini kinachoeleweka kwa msomaji wa sasa. “Mgeni mkazi” limetumiwa kuhifadhi dhana ya mtu asiye mzawa anayeishi nchini bila kutumia lugha ya kizamani.
