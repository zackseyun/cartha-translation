lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: akaomboleza
  rationale: Kitenzi קונן humaanisha kutamka au kuanzisha maombolezo rasmi, hasa kwa ajili ya waliokufa. “Akaomboleza” ni cha kawaida na hakiongezi wazi wazo la kuimba ambalo halijasemwa moja kwa moja.
- source_word: הַקִּינָה הַזֹּאת
  choice: kwa maombolezo haya
  rationale: Nomino קִינָה ni maombolezo rasmi, mara nyingi yenye umbo la kishairi. Muundo huu pia huhifadhi kwa kiwango kinachosomeka mwangwi wa kitenzi na nomino za mzizi mmoja katika Kiebrania.
- source_word: עַל
  choice: juu ya
  rationale: Katika muktadha wa maombolezo, עַל hutambulisha wale wanaoombolezewa. “Juu ya” ni usemi unaoeleweka katika mtindo rasmi wa Kiswahili, ingawa “kwa ajili ya” pia ingewezekana.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: יְהוֹנָתָן
  choice: Yonathani
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Kiambishi cha Kiebrania kinamtaja Yonathani kuwa mwana wa Sauli; “mwanawe” ni kifupi na cha asili bila kuongeza mkazo usiokuwamo.
- source_word: וַ
  choice: Kisha
  rationale: Waw pamoja na wayyiqtol huendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha sasa.
