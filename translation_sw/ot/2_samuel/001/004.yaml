base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/004.yaml
  text: David said to him[a], “What happened? Please tell me.” He said, “The people fled from the battle, and many of the people also fell and died[c][b]; and Saul and Jonathan his son are also dead.”
translation:
  language: sw
  text: Daudi akamwambia, “Ni nini kilichotokea?[a] Tafadhali niambie.” Akasema, “Watu walikimbia kutoka vitani, na wengi miongoni mwa watu pia walianguka na kufa;[b] Sauli na Yonathani, mwanawe, pia wamekufa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “Jambo hilo lilikuwaje?”
    reason: lexical_alternative
  - marker: b
    text: “Walianguka” ni usemi wa kawaida wa Kiebrania kuhusu watu waliopigwa chini vitani; maneno yanayofuata “na kufa” yanaeleza matokeo wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה הָיָה הַדָּבָר
  choice: Ni nini kilichotokea?
  rationale: Kwa neno halisi ni ‘Jambo hilo lilikuwaje?’ lakini katika muktadha Daudi anauliza habari ya yaliyotokea. Kauli hii ni ya kawaida na wazi katika Kiswahili cha sasa.
- source_word: הַגֶּד נָא לִי
  choice: Tafadhali niambie
  rationale: Kitenzi ni amri ya kusema au kutoa habari, huku נָא ikiongeza ombi la heshima au msisitizo. ‘Tafadhali niambie’ huwasilisha vipengele vyote viwili kwa lugha ya kawaida.
- source_word: אֲשֶׁר נָס הָעָם מִן הַמִּלְחָמָה
  choice: Watu walikimbia kutoka vitani
  rationale: נָס humaanisha kukimbia, na הָעָם hapa ni kundi la watu waliokuwa vitani. ‘Kutoka vitani’ ni usemi wa asili wa Kiswahili unaoonyesha walikimbia mapigano.
- source_word: וְגַם הַרְבֵּה נָפַל מִן הָעָם
  choice: na watu wengi pia walianguka
  rationale: Katika habari za vita, נפל inaweza kumaanisha kuanguka baada ya kupigwa au kuuawa. Tafsiri inahifadhi taswira ya Kiebrania, na maneno yanayofuata ‘na kufa’ yanaweka matokeo wazi.
- source_word: וַיָּמֻתוּ
  choice: na kufa
  rationale: Kiebrania kinataja kifo wazi baada ya ‘walianguka.’ Kutafsiri vitenzi vyote viwili kunazuia kufuta urudiaji wenye mkazo wa taarifa ya awali.
- source_word: וְגַם שָׁאוּל וִיהוֹנָתָן בְּנוֹ מֵתוּ
  choice: pia Sauli na Yonathani mwanawe wamekufa
  rationale: Kauli hii inaleta habari ya kilele. Wakati timilifu ‘wamekufa’ ni wa kawaida katika Kiswahili kwa kutangaza hali iliyotokana na tukio la karibuni, na ‘mwanawe’ huhifadhi taarifa iliyo wazi katika Kiebrania.
