language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: בְּנוֹת֙ יִשְׂרָאֵ֔ל אֶל שָׁא֖וּל בְּכֶ֑ינָה הַ/מַּלְבִּֽשְׁ/כֶ֤ם שָׁנִי֙ עִם עֲדָנִ֔ים הַֽ/מַּעֲלֶה֙ עֲדִ֣י זָהָ֔ב עַ֖ל לְבוּשְׁ/כֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/024.yaml
  text: Daughters of Israel[a], weep over Saul, who clothed you in scarlet with luxuries[b], who put ornaments of gold on your clothing.
translation:
  language: sw
  text: 'Enyi binti za Israeli, mlieni Sauli,

    aliyewavika nguo nyekundu pamoja na mapambo ya fahari[a],

    aliyeweka mapambo ya dhahabu[b] juu ya mavazi yenu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pamoja na vitu vya anasa,” “pamoja na uzuri,” au “pamoja na mapambo.”
    reason: lexical_alternative
  - marker: b
    text: Au “vito vya dhahabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: Enyi binti za Israeli
  rationale: Inahifadhi mwito wa moja kwa moja na taswira ya kishairi ya Kiebrania, badala ya kuifanya kuwa ‘wanawake wa Israeli.’
- source_word: אֶל שָׁאוּל בְּכֶינָה
  choice: mlieni Sauli
  rationale: Kitenzi cha wingi wa kike kinatoa mwito wa kuomboleza; ‘mlieni’ ni Kiswahili cha kawaida kinachofaa wimbo huu wa maombolezo.
- source_word: הַמַּלְבִּשְׁכֶם שָׁנִי
  choice: aliyewavika nguo nyekundu
  rationale: Kirai cha participio kinamrejelea Sauli. ‘Nguo nyekundu’ kinaeleza kwa njia ya kawaida kitambaa au vazi lenye rangi ya scarlet.
- source_word: עִם עֲדָנִים
  choice: pamoja na mapambo ya fahari
  rationale: Neno עֲדָנִים linaweza kudokeza anasa, vitu vya kupendeza, au mapambo maridadi; tafsiri hii inaendana na mavazi na inahifadhi hali ya kifahari.
- source_word: הַמַּעֲלֶה עֲדִי זָהָב
  choice: aliyeweka mapambo ya dhahabu
  rationale: Katika muktadha huu עלה lina maana ya kuweka kitu juu ya kingine, na עֲדִי זָהָב ni mapambo au vito vya dhahabu.
- source_word: עַל לְבוּשְׁכֶן
  choice: juu ya mavazi yenu
  rationale: Inafuata wazi uhusiano wa kihusishi na kudumisha wingi wa kike wa wanaoambiwa.
