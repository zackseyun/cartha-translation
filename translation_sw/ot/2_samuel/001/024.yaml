  register: Kiswahili sanifu cha Afrika Mashariki chenye hadhi ya kishairi lakini kinachoeleweka kwa urahisi. Mpangilio wa mistari unadumisha muundo wa wimbo wa maombolezo na vifungu viwili vinavyomweleza Sauli.
