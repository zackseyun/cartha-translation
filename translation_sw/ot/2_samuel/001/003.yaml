  text: Daudi akamwambia, “Umetoka wapi?” Akamwambia, “Nimeponyoka kutoka katika kambi ya Israeli.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵי מִזֶּה
  choice: wapi
  rationale: Katika kishazi “Umetoka wapi?”, neno hili linauliza mahali alikotoka kwa Kiswahili cha kawaida na cha asili.
- source_word: תָּבוֹא
  choice: umetoka
  rationale: Ingawa kitenzi cha Kiebrania kwa msingi ni ‘kuja’, pamoja na swali la mahali pa asili maana ya asili katika Kiswahili ni “Umetoka wapi?”, ikirejelea mwendo uliokamilika hivi karibuni.
- source_word: מִמַּחֲנֵה יִשְׂרָאֵל
  choice: kutoka katika kambi ya Israeli
  rationale: “Kambi” huhifadhi mazingira ya kijeshi, na “ya Israeli” hufuata uhusiano wa nomino katika Kiebrania bila kuufafanua zaidi.
- source_word: נִמְלָטְתִּי
  choice: nimeokoka
  rationale: Hapa mzizi מלט katika Niphal unaonyesha kufanikiwa kuponyoka katika hatari. “Nimeokoka” huwasilisha kunusurika au kutoka salama bila kuongeza namna alivyotoka.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: akamwambia ... akamjibu
  rationale: Kiebrania hurudia “akasema,” lakini katika Kiswahili “akamjibu” huonyesha kwa kawaida kwamba kauli ya pili ni jibu, bila kubadili yaliyomo.
- source_word: דָּוִד
  choice: Daudi
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika matumizi ya Biblia ya Kiswahili.
