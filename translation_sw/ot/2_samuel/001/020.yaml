  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַל תַּגִּ֣ידוּ בְ/גַ֔ת אַֽל תְּבַשְּׂר֖וּ בְּ/חוּצֹ֣ת אַשְׁקְל֑וֹן פֶּן תִּשְׂמַ֨חְנָה֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים פֶּֽן תַּעֲלֹ֖זְנָה בְּנ֥וֹת הָ/עֲרֵלִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/020.yaml
  text: Do not tell it in Gath[a]; do not proclaim the news in the streets of Ashkelon, lest the daughters of the Philistines rejoice[b], lest the daughters of the uncircumcised exult.
translation:
  language: sw
  text: Msiseme habari hiyo huko Gathi; msiitangaze katika mitaa ya Ashkeloni, wasije wakafurahi binti za Wafilisti, wasije wakashangilia binti za wasiotahiriwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּגִּידוּ
  choice: msitangaze habari hiyo
  rationale: Kitenzi נגד humaanisha kusema, kutoa taarifa, au kutangaza. Kwa kuwa kitu kinachotangazwa hakitajwi wazi katika Kiebrania lakini kinaeleweka kutokana na muktadha, “habari hiyo” hudokeza habari za kuanguka kwa Sauli na Yonathani bila kuzieleza zaidi.
- source_word: בְגַת
  choice: huko Gathi
  rationale: Kiambishi בְ ni cha mahali, na Gathi ni namna iliyozoeleka ya jina la mji huu katika Kiswahili cha Biblia.
- source_word: תְּבַשְּׂרוּ
  choice: msihubiri habari hiyo
  rationale: Katika piel, בשר ni kuleta au kutangaza habari. “Hubiri habari” hapa lina maana ya kuitangaza hadharani, wala si lazima mahubiri ya kidini; linatunza ulinganifu wa kishairi bila kurudia tu kitenzi cha mstari wa kwanza.
- source_word: בְּחוּצֹת אַשְׁקְלוֹן
  choice: katika mitaa ya Ashkeloni
  rationale: חוּצוֹת inaweza kumaanisha mitaa au maeneo ya wazi ya mjini. “Mitaa” ni ya kawaida na inafaa mazingira ya tangazo la hadharani.
- source_word: פֶּן
  choice: ili ... wasi-
  rationale: פֶּן huanzisha kusudi au matokeo yanayoepukwa. Muundo wa Kiswahili “ili ... wasi-” ni wa kawaida na unadumisha onyo la kishairi.
- source_word: תִּשְׂמַחְנָה
  choice: wasifurahi
  rationale: שמח hueleza kufurahi au kuwa na furaha. “Furahi” ni wazi, ya asili, na yenye hadhi katika maombolezo haya.
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: binti za Wafilisti
  rationale: Tafsiri ya karibu inadumisha taswira ya kishairi ya wanawake wa Wafilisti kama wanaosherehekea; “binti za” haibadilishwi kuwa maelezo tambuzi zaidi.
- source_word: תַּעֲלֹזְנָה
  choice: wasishangilie
  rationale: עלז huonyesha furaha kubwa au ya ushindi. “Shangilia” hudumisha ongezeko la nguvu ukilinganisha na “furahi.”
- source_word: בְּנוֹת הָעֲרֵלִים
  choice: binti za wasiotahiriwa
  rationale: עֲרֵלִים ni “wasiotahiriwa.” Tafsiri ya moja kwa moja inadumisha dhihaka yenye muktadha wa utambulisho wa agano bila kuibadili kuwa “wapagani” au “wachafu.”
theological_decisions:
- issue: Tafsiri ya jina la dhihaka la kiagano עֲרֵלִים
  choice: wasiotahiriwa
  alternative: wapagani / wachafu
  rationale: Neno la Kiebrania linahusiana moja kwa moja na kutahiriwa na utambulisho wa agano. Kulitafsiri kihalisi kunahifadhi mvutano wa kitheolojia na nguvu ya balagha ya maandishi badala ya kuweka ndani yake tafsiri ya jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi na wenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Ulinganifu wa mistari na ongezeko kutoka “furahi” hadi “shangilia” vimedumishwa.
