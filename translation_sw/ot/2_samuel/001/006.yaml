  to: Yule kijana aliyemletea habari akasema, “Nilijikuta kwa bahati[a] kwenye Mlima Gilboa. Na tazama, Sauli alikuwa ameegemea mkuki wake; na tazama, magari ya vita na wapanda farasi[b] walikuwa wakimfikia[c].”
