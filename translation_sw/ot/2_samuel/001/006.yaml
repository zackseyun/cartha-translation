  text: וַ/יֹּ֜אמֶר הַ/נַּ֣עַר הַ/מַּגִּ֣יד ל֗/וֹ נִקְרֹ֤א נִקְרֵ֨יתִי֙ בְּ/הַ֣ר הַ/גִּלְבֹּ֔עַ וְ/הִנֵּ֥ה שָׁא֖וּל נִשְׁעָ֣ן עַל חֲנִית֑/וֹ וְ/הִנֵּ֥ה הָ/רֶ֛כֶב וּ/בַעֲלֵ֥י הַ/פָּרָשִׁ֖ים הִדְבִּקֻֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/006.yaml
  text: And the young man who told him said[a], “I happened to be on Mount Gilboa, and behold, Saul was leaning on his spear, and behold[c][b], the chariots and the horsemen were closing in on him.”
translation:
  language: sw
  text: Yule kijana aliyemletea habari akasema, “Nilijikuta kwa bahati[a] kwenye Mlima Gilboa. Na tazama, Sauli alikuwa ameegemea mkuki wake; na tazama, magari ya vita na wapanda farasi[b] walikuwa wakimfikia[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ilitokea tu nikawa kwenye Mlima Gilboa.” Nahau ya Kiebrania inasisitiza kwamba kuwapo kwake huko kulitokea bila kupanga.
    reason: lexical_alternative
  - marker: b
    text: Au, “kikosi cha magari ya vita na wapanda farasi,” au “magari ya vita na jeshi la wapanda farasi.”
    reason: lexical_alternative
  - marker: c
    text: Au, “walikuwa wamemfikia” au “walikuwa wakimwandama kwa karibu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: yule kijana
  rationale: Neno נַעַר hapa humtambulisha kijana aliyekuwa mjumbe; ‘kijana’ ni la kawaida na haliongezi wazo la kuwa mtumishi.
- source_word: הַמַּגִּיד לוֹ
  choice: aliyemletea habari
  rationale: Kirai hiki kinamtambulisha kijana kuwa ndiye aliyempa Daudi taarifa; ‘aliyemletea habari’ ni Kiswahili cha asili katika muktadha huu.
- source_word: נִקְרֹא נִקְרֵיתִי
  choice: nilijikuta kwa bahati
  rationale: Muundo wa kitenzi pamoja na infinitivu kamili unasisitiza kutokea kwa bahati; tafsiri hii inawasilisha kutokupangwa kwa kuwapo kwake huko.
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: kwenye Mlima Gilboa
  rationale: Hii ni namna ya kawaida ya kutaja mahali juu au katika eneo la mlima wenye jina maalumu.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Neno hili huvuta fikira kwa nguvu kwenye mandhari inayosimuliwa; limerudiwa kama katika Kiebrania.
- source_word: נִשְׁעָן עַל
  choice: alikuwa ameegemea
  rationale: Kitenzi kinaonyesha Sauli akijitegemeza kimwili kwenye mkuki wake.
- source_word: חֲנִיתוֹ
  choice: mkuki wake
  rationale: ‘Mkuki’ ni neno la kawaida na linaloeleweka kwa silaha inayotajwa.
- source_word: הָרֶכֶב
  choice: magari ya vita
  rationale: רֶכֶב linaweza kumaanisha magari kwa maana ya kikosi cha magari ya vita; tafsiri hii ni wazi kwa msomaji wa sasa.
- source_word: בַעֲלֵי הַפָּרָשִׁים
  choice: wapanda farasi
  rationale: Kirai halisi kinawarejelea watu waliopanda farasi; ‘wapanda farasi’ ni wazi bila kuongeza dhana ya kitaasisi ya kikosi maalumu.
- source_word: הִדְבִּקֻהוּ
  choice: walikuwa wakimkaribia kwa kasi
  rationale: Hiphili ya דבק hapa inaweza kueleza kumfikia, kumwandama kwa karibu, au kumkaribia sana. Muundo huu unaonyesha shinikizo la ufuatiliaji bila kuamua kwamba tayari walikuwa wamemkamata.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi wenye heshima lakini unaoeleweka kwa urahisi. ‘Na tazama’ limehifadhiwa ili kuendeleza msisitizo na uhai wa simulizi ya Kiebrania; alama zote za tanbihi zimewekwa katika matini.
