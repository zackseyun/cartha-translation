base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/001.yaml
  text: After the death of Saul[a], when David had returned from striking down the Amalekites, David stayed in Ziklag two days.
translation:
  language: sw
  text: Baada ya kifo cha Sauli, Daudi alikuwa amerudi kutoka kuwapiga Waamaleki[a], naye akakaa Siklagi siku mbili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Amaleki,” jina la umoja linalowarejelea Waamaleki kwa pamoja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Baada ya
  rationale: Fomula ya masimulizi inaingiza hali inayofuata; katika Kiswahili kiunganishi chake kinaunganishwa kwa kawaida na kishazi cha wakati bila kuongeza neno lisilokuwapo la maana ya ‘sasa’.
- source_word: אַחֲרֵי מוֹת שָׁאוּל
  choice: Baada ya kifo cha Sauli
  rationale: Inahifadhi muundo rasmi wa wakati wa Kiebrania huku ikisomeka kwa Kiswahili cha kawaida.
- source_word: שָׁב
  choice: alikuwa amerudi
  rationale: Wakati timilifu unaonyesha kuwa kurudi kwa Daudi kulitokea kabla ya kukaa kwake Siklagi.
- source_word: מֵהַכּוֹת
  choice: kutoka kuwapiga
  rationale: Kitenzi hiki kinahifadhi maana ya tendo la kijeshi na nguvu ya נכה bila kudai kwamba watu wote waliangamizwa.
- source_word: אֶת הָעֲמָלֵק
  choice: Waamaleki[a]
  rationale: Ingawa Kiebrania kinatumia jina la umoja ‘Amaleki’ kwa maana ya pamoja, Kiswahili hutaja watu hao kwa wingi kama ‘Waamaleki’.
- source_word: וַיֵּשֶׁב
  choice: naye akakaa
  rationale: ‘Akakaa’ linafaa kwa muda mfupi wa siku mbili, na ‘naye’ linaendeleza mfuatano wa masimulizi.
- source_word: בְּצִקְלָג
  choice: Siklagi
  rationale: Ni umbo la kawaida la Kiswahili la jina la mahali; mahali panabainika moja kwa moja baada ya kitenzi ‘kukaa’.
- source_word: יָמִים שְׁנָיִם
  choice: siku mbili
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kuonyesha muda huo.
