lexical_decisions:
- source_word: הַצְּבִי
  choice: fahari yako
  rationale: צְבִי inaweza kumaanisha uzuri, fahari au utukufu, na pia paa kwa maana halisi. Katika wimbo huu wa maombolezo juu ya Sauli na Yonathani, maana ya kitamathali ya fahari ya taifa inafaa zaidi; kiambishi cha nafsi ya pili kinaonyesha Israeli anasemeshwa moja kwa moja.
- source_word: יִשְׂרָאֵל
  choice: Ee Israeli
  rationale: Jina limeandikwa kwa umbo la kawaida la Kiswahili, na “Ee” linaonyesha wazi mwito wa maombolezo.
- source_word: עַל
  choice: juu ya
  rationale: Kihusishi hiki kinaonyesha mahali ambapo aliyeuawa amelala.
- source_word: בָּמוֹתֶיךָ
  choice: miinuko yako
  rationale: Neno hili linaweza kumaanisha mahali palipoinuka au vilima. “Miinuko yako” huhifadhi picha ya kijiografia na kishairi bila kudokeza moja kwa moja mahali pa ibada.
- source_word: חָלָל
  choice: amelala ameuawa
  rationale: Neno linaashiria mtu aliyeuawa. Kauli hii ni ya kawaida katika Kiswahili na inaonyesha hali ya maiti iliyo juu ya miinuko.
- source_word: אֵיךְ
  choice: Jinsi
  rationale: Hutanguliza mshangao wa maombolezo; “Jinsi ... walivyoanguka!” ni usemi wa asili na wenye uzito wa kishairi katika Kiswahili.
- source_word: נָפְלוּ
  choice: walivyoanguka
  rationale: Huhifadhi tendo lililokamilika na athari yake katika maombolezo, huku ikifanya kazi pamoja na “Jinsi” kama mshangao.
- source_word: גִבּוֹרִים
  choice: mashujaa
  rationale: גִבּוֹרִים inaweza kumaanisha watu wenye nguvu, mashujaa au wapiganaji. “Mashujaa” huhifadhi upana na hadhi ya kishairi ya kibwagizo.
