  text: How the mighty have fallen[b][a], and the weapons of war have perished!
translation:
  language: sw
  text: Jinsi mashujaa walivyoanguka, na silaha za vita[a][b] zilivyoangamia!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vifaa vya vita” au “kinga za kivita.” Kirai cha Kiebrania kinaweza kumaanisha vifaa vya kijeshi kwa upana, si silaha za kushambulia tu.
    reason: lexical_alternative
  - marker: b
    text: “Silaha za vita” huenda ni sitiari inayowarejelea Sauli na Yonathani wenyewe kama nguvu ya kijeshi ya Israeli; hata hivyo, inaweza pia kueleweka kwa maana halisi.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  choice: Jinsi
  rationale: Hapa neno hili linaanzisha mshangao wa maombolezo, si swali la kuomba habari. “Jinsi” hudumisha nguvu ya kishairi ya kibwagizo.
- source_word: נָפְלוּ
  choice: walivyoanguka
  rationale: Muundo huu wa Kiswahili unaendana kiasili na mshangao unaoanzishwa na “Jinsi” na unaonyesha matokeo ya tukio lililotokea.
- source_word: גִבּוֹרִים
  choice: mashujaa
  rationale: Katika maombolezo haya neno linamaanisha watu hodari vitani. “Mashujaa” ni la kawaida, lenye heshima, na linafaa kwa ushairi bila kufafanua kupita kiasi.
- source_word: וַיֹּאבְדוּ
  choice: zilivyoangamia
  rationale: Kitenzi kinaweza kumaanisha kuangamia au kupotea. “Zilivyoangamia” hudumisha uzito wa maombolezo na kinaweza kueleweka kwa vitu halisi au kwa maana ya mfano.
- source_word: כְּלֵי מִלְחָמָה
  choice: silaha za vita
  rationale: Kirai hiki kihalisi ni vyombo au vifaa vya vita. “Silaha za vita” ni usemi wa kawaida na wa kishairi unaoruhusu maana halisi na ya mfano.
theological_decisions:
- issue: Ikiwa “silaha za vita” ni vifaa halisi au sitiari ya Sauli na Yonathani
  choice: Maana zote mbili zimeachwa wazi katika matini, huku uwezekano wa sitiari ukielezwa katika tanbihi.
  alternative: Kutafsiri moja kwa moja kuwa Sauli na Yonathani, au kuwa vifaa vya kijeshi tu.
  rationale: Kirai cha Kiebrania kinaweza kutaja vifaa vya kijeshi kwa upana, lakini katika muktadha wa maombolezo kinaweza pia kuwawakilisha Sauli na Yonathani kama nguvu ya kijeshi ya Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na mtiririko wa kishairi wa maombolezo. Muundo wa “Jinsi … walivyo-/zilivyo-” unadumisha mshangao wa kibwagizo na ulinganifu wa mistari.
