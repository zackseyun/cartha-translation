base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/002.yaml
  text: Then the king said to Ziba[a], “What are these for?” And Ziba said, “The donkeys are for the king’s household to ride on, and the bread and summer fruit are for the young men to eat[c][b], and the wine is for the weary in the wilderness to drink.”
translation:
  language: sw
  text: Kisha mfalme akamwuliza Siba, “Vitu hivi ni vya nini?”[a] Siba akajibu, “Punda ni kwa ajili ya watu wa nyumba ya mfalme wapande, mkate na matunda ya kiangazi[b] ni kwa ajili ya vijana[c] wale, na divai ni kwa ajili ya mtu aliyechoka nyikani, anywe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Unamaanisha nini kwa vitu hivi?” Nahau ya Kiebrania kwa maana halisi inauliza, “Vitu hivi ni nini kwako?”
    reason: lexical_alternative
  - marker: b
    text: Au, “mazao ya kiangazi.” Neno la Kiebrania linaweza kutaja kwa upana matunda au mazao yanayokusanywa wakati wa kiangazi.
    reason: lexical_alternative
  - marker: c
    text: Au, “watumishi” au “wasaidizi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֵלֶּה לָּךְ
  choice: Vitu hivi ni vya nini?
  rationale: Nahau hiyo inauliza kusudi la vitu ambavyo Siba ameleta. Tafsiri hii ni ya kawaida katika Kiswahili na bado inadumisha muundo wa swali la Kiebrania.
- source_word: הַחֲמוֹרִים
  choice: Punda
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa wanyama wanaotajwa.
- source_word: לְבֵית הַמֶּלֶךְ
  choice: wa watu wa nyumba ya mfalme
  rationale: Neno בַּיִת hapa linaelekea kumaanisha jamaa na msafara wa kifalme, si jengo pekee. Usemi huu unaeleweka kwa urahisi bila kuficha taswira ya 'nyumba'.
- source_word: לִרְכֹּב
  choice: wapande
  rationale: Kiswahili hutumia kitenzi 'kupanda' kwa kusafiri juu ya mnyama; kauli hii pia inaonyesha kusudi la punda.
- source_word: הַלֶּחֶם
  choice: mikate
  rationale: Maana ya moja kwa moja ni mkate; wingi wa Kiswahili unasikika kwa kawaida kwa kiasi cha mikate iliyoletwa.
- source_word: הַקַּיִץ
  choice: matunda ya kiangazi
  rationale: Neno hilo linaweza kutaja matunda au mazao yanayokusanywa wakati wa kiangazi. 'Matunda ya kiangazi' halibainishi aina ambayo Kiebrania hakuitaji.
- source_word: הַנְּעָרִים
  choice: vijana
  rationale: Hii inadumisha maana ya msingi ya vijana huku tanbihi ikihifadhi uwezekano wa watumishi au wasaidizi katika muktadha huu.
- source_word: הַיָּעֵף
  choice: mtu aliyechoka
  rationale: Kivumishi cha umoja chenye matumizi ya kijumla kimetafsiriwa kwa umoja ili kuakisi Kiebrania na kubaki wazi kwamba kinamhusu mtu yeyote aliyechoka.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: '''Nyika'' hufaa kwa eneo lisilokaliwa au la porini na hailazimishi wazo la jangwa la mchanga pekee.'
