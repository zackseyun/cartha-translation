base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/004.yaml
  text: Then the king said to Ziba, “Look, all that belongs to Mephibosheth is yours.” And Ziba said, “I bow down; may I find favor in your eyes, my lord the king.”
translation:
  language: sw
  text: Ndipo mfalme akamwambia Siba, “Tazama, vyote vilivyo vya Mefiboshethi ni vyako.” Naye Siba akasema, “Nimesujudu; na nipate kibali machoni pako, bwana wangu mfalme.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Kihisishi hiki kinavuta fikira kwenye tangazo la mfalme; “Tazama” ni cha heshima na kinafaa katika simulizi la kibiblia.
- source_word: כֹּל אֲשֶׁר לִמְפִי בֹשֶׁת
  choice: kila kitu alicho nacho Mefiboshethi
  rationale: Muundo wa Kiebrania unamaanisha mali yote iliyo ya Mefiboshethi; tafsiri hii ni ya asili katika Kiswahili bila kuongeza maelezo.
- source_word: הִשְׁתַּחֲוֵיתִי
  choice: Nainama mbele yako
  rationale: Kitenzi kinaonyesha kujishusha au kusujudu mbele ya mwenye mamlaka. Kauli hii hudumisha ishara ya heshima bila kuifanya lazima iwe ibada ya kidini.
- source_word: אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: na nipate kibali machoni pako
  rationale: Inahifadhi nahau ya chanzo na ombi la Siba la kukubaliwa na mfalme.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Inahifadhi namna rasmi ya kumtaja mfalme, bila kuchanganya אֲדֹנִי na jina la Mungu.
theological_decisions:
- issue: Maana ya הִשְׁתַּחֲוֵיתִי katika muktadha wa kifalme
  choice: Nainama mbele yako
  alternative: Ninakusujudia
  rationale: Muktadha unaonyesha tendo la heshima kwa mfalme. “Nainama mbele yako” huhifadhi tendo hilo bila kudokeza moja kwa moja ibada ya kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Majina yametolewa kama Siba na Mefiboshethi.
