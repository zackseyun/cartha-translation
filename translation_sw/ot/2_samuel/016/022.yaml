base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/022.yaml
  text: So they pitched the tent for Absalom on the roof[a], and Absalom went in to his father's concubines in the sight of all Israel.
translation:
  language: sw
  text: Basi wakamwekea Absalomu hema juu ya paa, naye Absalomu akaingia kwa masuria wa baba yake mbele ya Israeli wote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “machoni pa Israeli wote” au “hadharani mbele ya Israeli wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּטּוּ
  choice: wakamsimamishia
  rationale: Kitenzi נטה hapa kina maana ya kutandaza au kusimamisha hema. “Wakamsimamishia” ni Kiswahili cha kawaida kinachoonyesha kuwa waliliandaa hema kwa ajili ya Absalomu.
- source_word: הָאֹהֶל
  choice: hema
  rationale: Nomino ina kibainishi katika Kiebrania, lakini Kiswahili hakihitaji neno tofauti la kuonyesha umahususi hapa; muktadha unaonyesha kuwa ni hema lililoandaliwa kwa tendo hilo.
- source_word: עַל הַגָּג
  choice: juu ya paa
  rationale: Hii inahifadhi mahali pa tukio na wazo la kuonekana hadharani.
- source_word: וַיָּבֹא ... אֶל
  choice: akaingia kwa
  rationale: Hii inahifadhi nahau ya Kiebrania inayodokeza mahusiano ya kingono bila kuifanya kuwa ya moja kwa moja zaidi kuliko matini ya chanzo.
- source_word: פִּלַגְשֵׁי אָבִיו
  choice: masuria wa baba yake
  rationale: “Masuria” ni neno la kawaida la kibiblia kwa wanawake waliokuwa katika uhusiano unaotajwa na פִּילֶגֶשׁ, na muundo huu unaonyesha wazi uhusiano wao na baba yake Absalomu.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: mbele ya Israeli wote
  rationale: Usemi huu wa kawaida wa Kiswahili unawasilisha maana ya tendo kufanywa hadharani na kushuhudiwa na taifa lote, huku dokezo likihifadhi picha halisi ya “machoni pa.”
theological_decisions:
- issue: Tafsiri ya nahau ya kingono katika simulizi la uasi wa kifalme
  choice: akaingia kwa
  alternative: akafanya nao ngono; akalala na
  rationale: Tafsiri iliyochaguliwa inadumisha sitara na uzito wa nahau ya Kiebrania bila kuficha maana yake wala kuongeza uwazi ambao hauko katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. Kiunganishi “naye” na umbo “akaingia kwa” vinatunza mtiririko na sitara ya matini ya Kiebrania. Alama ya tanbihi imewekwa baada ya kirai kinachoifafanua.
