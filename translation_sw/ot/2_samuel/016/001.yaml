base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/001.yaml
  text: When David had passed a little beyond the summit[a], behold, Ziba the servant of Mephibosheth was there to meet him, with a pair of saddled donkeys, and on them were two hundred loaves of bread, a hundred clusters of raisins, a hundred summer fruits[c][b], and a skin of wine.
translation:
  language: sw
  text: Daudi alipokuwa amepita kidogo ng’ambo ya kilele[a], tazama, Siba, mtumishi[b] wa Mefiboshethi, alikuwa akija kumlaki, akiwa na punda wawili waliotiwa matandiko. Juu yao kulikuwa na mikate mia mbili, mafungu mia moja ya zabibu zilizokaushwa, matunda mia moja ya kiangazi[c], na kiriba cha divai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa amepita kilele kwa umbali kidogo.” Kiebrania kinasema kwa maana ya moja kwa moja, “kidogo kutoka kwenye kichwa”; “kichwa” hapa humaanisha kilele cha kilima au mlima.
    reason: lexical_alternative
  - marker: b
    text: Neno linalotafsiriwa “mtumishi” linaweza pia kutafsiriwa “kijana” au “mhudumu”; hapa muktadha unapendelea nafasi ya Siba kama mtumishi wa Mefiboshethi.
    reason: lexical_alternative
  - marker: c
    text: Huenda “matunda ya kiangazi” yakamaanisha hasa tini, lakini neno la Kiebrania lina maana pana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מֵהָרֹאשׁ
  choice: alikuwa amepita mbele kidogo kutoka kileleni
  rationale: רֹאשׁ maana yake ya msingi ni ‘kichwa,’ lakini hapa inamaanisha kilele cha mlima. Kauli hii ya Kiswahili inaonyesha kwamba Daudi alikuwa amepita kilele kwa umbali mdogo.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili linaonyesha kuonekana kwa ghafula na kuupa usimulizi uhai; ‘tazama’ linahifadhi msisitizo huo.
- source_word: נַעַר מְפִי בֹשֶׁת
  choice: mtumishi wa Mefiboshethi
  rationale: נַעַר linaweza kumaanisha kijana, mtumishi, au mhudumu. Katika muktadha huu linamtambulisha Siba kwa nafasi yake kwa Mefiboshethi.
- source_word: צֶמֶד חֲמֹרִים
  choice: punda wawili
  rationale: צֶמֶד ni jozi. ‘Punda wawili’ ni usemi wa kawaida na ulio wazi katika Kiswahili bila kudokeza bila lazima kwamba walifungwa nira.
- source_word: חֲבֻשִׁים
  choice: waliotandikwa matandiko
  rationale: Katika muktadha wa punda walioandaliwa kwa safari na kubeba mizigo, neno hili lina maana ya kutandikwa matandiko, si kufungwa tu.
- source_word: מָאתַיִם לֶחֶם
  choice: mikate mia mbili
  rationale: Kiswahili hutumia ‘mikate’ kama vitu vinavyohesabika, hivyo kinawasilisha idadi ya Kiebrania kwa kawaida.
- source_word: צִמּוּקִים
  choice: mafungu mia moja ya zabibu kavu
  rationale: Neno linaashiria zabibu zilizokaushwa zilizounganishwa au kukusanywa pamoja. ‘Mafungu’ huhifadhi wazo hilo bila kubainisha kwamba yalikuwa keki.
- source_word: קַיִץ
  choice: matunda mia moja ya kiangazi
  rationale: Neno hili linaweza kutaja matunda ya kiangazi kwa ujumla, ingawa mara nyingi huenda likarejelea tini. Tafsiri pana haibani maana kuliko Kiebrania.
- source_word: נֵבֶל יָיִן
  choice: kiriba cha divai
  rationale: נֵבֶל hapa ni chombo cha ngozi cha kuhifadhia kioevu; ‘kiriba cha divai’ ni usemi wa kawaida na sahihi.
