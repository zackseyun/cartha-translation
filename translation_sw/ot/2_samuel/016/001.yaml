translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wenye heshima, na unaoeleweka kwa wasomaji wa kawaida. ‘Tazama’ limehifadhiwa ili kuonyesha uhai wa simulizi; istilahi za vyakula na vyombo zimetolewa kwa maneno ya kawaida bila kubainisha zaidi ya ushahidi wa Kiebrania.
