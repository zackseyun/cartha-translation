source:
  edition: WLC
  text: הֵשִׁיב֩ עָלֶ֨י/ךָ יְהוָ֜ה כֹּ֣ל דְּמֵ֣י בֵית שָׁא֗וּל אֲשֶׁ֤ר מָלַ֨כְתָּ֙ תחת/ו וַ/יִּתֵּ֤ן יְהוָה֙ אֶת הַ/מְּלוּכָ֔ה בְּ/יַ֖ד אַבְשָׁל֣וֹם בְּנֶ֑/ךָ וְ/הִנְּ/ךָ֙ בְּ/רָ֣עָתֶ֔/ךָ כִּ֛י אִ֥ישׁ דָּמִ֖ים אָֽתָּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/008.yaml
  text: Yahweh has brought back upon you all the blood of the house of Saul[a], in whose place you reigned, and Yahweh has given the kingdom into the hand of Absalom your son. And look, you are in your calamity[c][b], because you are a man of bloodshed.
translation:
  language: sw
  text: Yahwe amekurudishia damu yote ya nyumba ya Sauli[a], ambaye ulitawala mahali pake; na Yahwe ameuweka ufalme mikononi mwa Absalomu mwanao. Tazama, uko katika maafa yako[b], kwa sababu wewe ni mtu wa umwagaji wa damu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umwagaji damu wote wa nyumba ya Sauli,” au “hatia yote ya damu ya nyumba ya Sauli.” Kiebrania kinasema kihalisi “damu zote za nyumba ya Sauli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “uko katika uovu wako.” Neno la Kiebrania linaweza kumaanisha uovu wa kimaadili au maafa; hapa yaelekea linarejelea maafa yaliyompata Daudi.
    reason: lexical_alternative
  - marker: c
    text: “Mtu wa umwagaji wa damu” inaweza pia kutafsiriwa “mtu wa damu,” yaani mtu mwenye hatia ya damu au anayejulikana kwa vurugu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב עָלֶיךָ
  choice: amekurudishia
  rationale: Hifili ya שוב ina maana ya kusababisha kitu kirudi. ‘Amekurudishia’ inadumisha picha ya damu au hatia ya damu kumrudia Daudi, bila kuifafanua moja kwa moja kuwa malipo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili, ‘Yahwe,’ badala ya kubadilishwa na cheo.
- source_word: כָּל דְּמֵי בֵית שָׁאוּל
  choice: damu yote ya nyumba ya Sauli
  rationale: Ingawa דמים ni wingi na inaweza kumaanisha umwagaji damu au hatia ya damu, tafsiri hii inadumisha picha halisi na utata wa shtaka la Shimei.
- source_word: אֲשֶׁר מָלַכְתָּ תַּחְתָּיו
  choice: ambaye ulitawala mahali pake
  rationale: תחתיו hapa inaonyesha kwamba Daudi alitawala katika nafasi ya Sauli. Kiswahili hiki kinaendeleza kiwakilishi kinachomrejelea Sauli bila kufanya usemi kuwa mzito.
- source_word: וַיִּתֵּן ... אֶת־הַמְּלוּכָה בְּיַד
  choice: ameutia ufalme mkononi mwa
  rationale: Hifadhi ya nahau ya Kiebrania ‘kutia mkononi mwa’ inaonyesha kukabidhi mamlaka au udhibiti na inaeleweka katika Kiswahili cha Biblia.
- source_word: וְהִנְּךָ
  choice: Tazama
  rationale: Neno hili linavuta usikivu kwa hali ya Daudi; ‘Tazama’ ni la heshima, wazi, na si la kizamani kupita kiasi.
- source_word: בְּרָעָתֶךָ
  choice: umo katika maafa yako
  rationale: רעה inaweza kumaanisha uovu wa kimaadili au janga linalompata mtu. Muktadha wa uasi wa Absalomu unaelekea kwenye maafa, lakini uwezekano mwingine umewekwa katika tanbihi.
- source_word: אִישׁ דָּמִים
  choice: mtu wa umwagaji damu
  rationale: Nahau hii humtaja mtu mwenye sifa ya vurugu au hatia ya damu. Tafsiri hii ni ya asili na ina nguvu bila kuibadili kuwa ‘mwenye kiu ya damu,’ ambayo ni finyu zaidi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi badala ya kulibadilisha na cheo.
- issue: Maana ya בְּרָעָתֶךָ
  choice: umo katika maafa yako
  alternative: umo katika uovu wako
  rationale: Katika muktadha huu Shimei anaelekeza kwenye janga lililompata Daudi kama adhabu, lakini neno lenyewe linaweza pia kurejelea uovu. Tafsiri haitangazi shtaka la Shimei kuwa hukumu ya msimulizi.
- issue: Nguvu ya shtaka ‘damu ya nyumba ya Sauli’
  choice: damu yote ya nyumba ya Sauli
  alternative: hatia yote ya damu ya nyumba ya Sauli
  rationale: Kauli hii ni shtaka la Shimei. Kuweka picha ya ‘damu’ huepuka kuamua mapema ikiwa anamaanisha mauaji, umwagaji damu kwa jumla, au hatia ya damu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa msomaji wa sasa. Mpangilio wa sentensi na nahau kuu za Kiebrania zimehifadhiwa pale zinapobaki wazi katika Kiswahili; tanbihi zimebeba maana mbadala za kweli.
