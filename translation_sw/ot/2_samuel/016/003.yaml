base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/003.yaml
  text: Then the king said[a], “And where is your master's son?” Ziba said to the king, “Look, he is staying in Jerusalem, for he said, ‘Today the house of Israel will restore to me the kingdom of my father.’”
translation:
  language: sw
  text: Ndipo mfalme akasema, “Na yuko wapi mwana wa bwana wako?” Siba akamwambia mfalme, “Tazama, anakaa[a] Yerusalemu, kwa maana alisema, ‘Leo nyumba ya Israeli itanirudishia ufalme wa baba yangu.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amebaki Yerusalemu.” Neno la Kiebrania linaweza kumaanisha kuendelea kukaa au kubaki mahali, si kuketi tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “Ndipo” na kitenzi cha -ka- huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: וְאַיֵּה
  choice: Na yuko wapi
  rationale: Inahifadhi kiunganishi cha Kiebrania na swali la mahali kwa mtindo wa kawaida wa Kiswahili.
- source_word: בֶּן אֲדֹנֶיךָ
  choice: mwana wa bwana wako
  rationale: Neno אֲדֹנֶיךָ hapa humtaja mkuu au bwana wa Siba, si jina la Mungu; “bwana wako” huhifadhi uhusiano wa kijamii uliomo katika chanzo.
- source_word: צִיבָא
  choice: Siba
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Linahifadhi nguvu ya neno la kuuelekeza usikivu bila kutumia lugha isiyo ya kawaida.
- source_word: יוֹשֵׁב
  choice: anakaa
  rationale: Kivumishi-tendo cha ישׁב kinaweza kumaanisha kukaa mahali, kuishi, au kubaki; “anakaa” ni cha asili na huhifadhi upana huo, huku tanbihi ikitaja uwezekano wa “amebaki.”
- source_word: בִּירוּשָׁלִַם
  choice: Yerusalemu
  rationale: Jina la mahali linalotumiwa kwa kawaida katika Kiswahili.
- source_word: כִּי
  choice: kwa maana
  rationale: Kinaanzisha sababu ambayo Siba anaitoa kuhusu kukaa kwa mwana wa bwana wake Yerusalemu.
- source_word: יָשִׁיבוּ לִי
  choice: itanirudishia
  rationale: Hifili ya שוב ina maana ya kusababisha kitu kirudi au kukirejesha; “itanirudishia” huonyesha wazi kwamba ufalme unarudishwa kwake.
- source_word: בֵּית יִשְׂרָאֵל
  choice: nyumba ya Israeli
  rationale: Inahifadhi msemo wa pamoja wa Kiebrania badala ya kuufupisha kuwa “Israeli.”
- source_word: מַמְלְכוּת אָבִי
  choice: ufalme wa baba yangu
  rationale: Inafuata kwa karibu muundo wa chanzo huku ikiwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maneno ya Siba kuhusu nia ya mwana wa bwana wake
  choice: Kauli ya Siba imetafsiriwa moja kwa moja kama taarifa iliyoripotiwa, bila kuthibitisha kuwa ni kweli.
  alternative: Kuongeza maneno ya kuweka shaka, kama “alidai kwamba.”
  rationale: Kiebrania kinaripoti tu yale Siba aliyomwambia Daudi. Kuongeza shaka waziwazi kungeingiza hukumu ya muktadha mpana ndani ya mstari huu na kuondoa mvutano wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ni wa asili, huku istilahi “nyumba ya Israeli” na “ufalme wa baba yangu” zikihifadhi ukaribu na Kiebrania.
