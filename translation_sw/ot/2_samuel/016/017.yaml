base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/017.yaml
  text: Absalom said to Hushai[a], “Is this your loyalty to your friend? Why did you not go with your friend?”
translation:
  language: sw
  text: Absalomu akamwambia Hushai, “Je, huu ndio uaminifu[a] wako kwa rafiki yako? Kwa nini hukuenda pamoja na rafiki yako?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wema” au “upendo thabiti” (Kiebrania חֶסֶד).
    reason: Neno la Kiebrania linaweza kumaanisha uaminifu, wema, au upendo thabiti; muktadha huu unapendelea “uaminifu,” lakini maana nyingine halali zimehifadhiwa katika tanbihi.
lexical_decisions:
- source_word: חַסְדְּךָ
  choice: uaminifu wako
  rationale: Katika muktadha huu חֶסֶד inaonyesha ushikamanifu wa Hushai kwa Daudi. “Uaminifu” linafikisha vizuri maana ya uhusiano na utiifu wa kisiasa bila kuingiza waziwazi lugha ya agano.
- source_word: רֵעֶךָ
  choice: rafiki yako
  rationale: רֵעַ humaanisha rafiki, mwandamani, au mshirika. Hapa inamtaja Daudi, na “rafiki” ni neno la kawaida na la asili katika Kiswahili.
- source_word: לָמָּה לֹא הָלַכְתָּ אֶת רֵעֶךָ
  choice: Kwa nini hukuenda pamoja na rafiki yako?
  rationale: Kitenzi הלך pamoja na אֶת hapa kina maana ya kwenda pamoja na mtu. Tafsiri hii inahifadhi urahisi wa usemi wa Kiebrania.
- source_word: זֶה חַסְדְּךָ אֶת רֵעֶךָ
  choice: Je, huu ndio uaminifu wako kwa rafiki yako?
  rationale: Hiki ni kishazi kisicho na kitenzi kinachotumika kama swali la kejeli. “Je, huu ndio...?” linaonyesha mshangao na lawama ya Absalomu kwa Kiswahili cha kawaida.
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: וַיֹּאמֶר ni kitenzi cha kawaida cha masimulizi, “akasema.” Kwa kuwa mlengwa ametajwa kwa אֶל, “akamwambia” ni Kiswahili cha asili na kinahifadhi tendo la kusema.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa asili na hadhi inayofaa simulizi la Biblia. Kurudiwa kwa “rafiki yako” kumehifadhiwa kama katika Kiebrania, na swali la kejeli halijapunguzwa nguvu.
