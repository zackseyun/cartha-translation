lexical_decisions:
- source_word: וְ/אַבְשָׁל֗וֹם
  choice: Absalomu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili; kiunganishi וְ kinaunganishwa kwa kawaida na kirai kinachofuata bila kuongeza neno la wakati lisilokuwapo katika Kiebrania.
- source_word: וְ/כָל הָ/עָם֙
  choice: na watu wote
  rationale: עָם hapa humaanisha kwa upana watu waliokuwa upande wa Absalomu; “jeshi” lingefinya maana kuliko chanzo.
- source_word: אִ֣ישׁ יִשְׂרָאֵ֔ל
  choice: yaani, watu wa Israeli
  rationale: Kirai hiki kinaeleza “watu wote” kwa maana ya jumuiya ya Israeli. “Wanaume wa Israeli” kingehifadhi umbo la kiume kwa ukaribu zaidi, lakini katika Kiswahili kinaweza kueleweka kuwa kinatenga wanawake kwa msisitizo usio wa lazima; tanbihi inahifadhi tafsiri ya karibu zaidi na umbo la Kiebrania.
- source_word: בָּ֖אוּ יְרוּשָׁלִָ֑ם
  choice: wakafika Yerusalemu
  rationale: בוא pamoja na mahali panapolengwa inaweza kumaanisha kuja au kufika. “Wakafika” ni simulizi la kawaida na la wazi katika Kiswahili, bila kulazimisha kwamba waliingia ndani ya mji.
- source_word: וַ/אֲחִיתֹ֖פֶל אִתּֽ/וֹ
  choice: naye Ahithofeli alikuwa pamoja naye
  rationale: Kishazi cha Kiebrania hakina kitenzi kilichoandikwa, hivyo “alikuwa” kinaongezwa kwa sarufi ya kawaida ya Kiswahili. Kiwakilishi kinaelekea kwa Absalomu katika muktadha.
