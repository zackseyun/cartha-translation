base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/011.yaml
  text: Then David said to Abishai and to all his servants[a], “Look, my son, who came out from my own body, is seeking my life; how much more now this Benjaminite! Leave him alone, and let him curse, for Yahweh has told him to.”
translation:
  language: sw
  text: Kisha Daudi akamwambia Abishai na watumishi wake wote, “Tazama, mwanangu, aliyetoka mwilini mwangu, anatafuta kuniua; sembuse sasa huyu Mbenyamini! Mwacheni, na alaani, kwa maana Yahweh amemwambia.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “kwa maana Yahweh amesema naye.” Kiebrania hakitaji wazi alichomwambia, lakini muktadha unaonyesha kuwa kinahusu kulaani.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwenye hoja ya Daudi na kuhifadhi msisitizo wa Kiebrania kwa Kiswahili cha heshima na kinachoeleweka.
- source_word: בְנִי אֲשֶׁר יָצָא מִמֵּעַי
  choice: mwanangu mwenyewe, aliyetoka katika mwili wangu
  rationale: Huhifadhi picha halisi ya ukoo wa kimwili bila kutumia ‘tumbo langu,’ ambalo lingesikika lisilo la kawaida likisemwa na baba.
- source_word: מְבַקֵּשׁ אֶת נַפְשִׁי
  choice: anatafuta kuniua
  rationale: Hii ndiyo maana ya nahau ya Kiebrania ya kutafuta uhai wa mtu; Kiswahili hiki ni wazi na cha kawaida.
- source_word: וְאַף כִּי עַתָּה
  choice: sembuse sasa
  rationale: 'Huwasilisha nguvu ya hoja ya kulinganisha: ikiwa mwanawe mwenyewe anataka kumuua, basi tendo la Mbenyamini huyu halishangazi zaidi.'
- source_word: בֶּן הַיְמִינִי
  choice: huyu Mbenyamini
  rationale: Humtambulisha kwa kabila lake kwa namna fupi na ya kawaida katika Kiswahili cha Biblia.
- source_word: הַנִּחוּ לוֹ
  choice: Mwacheni
  rationale: Amri iko katika wingi na inaagiza watu wa Daudi wasiingilie.
- source_word: וִיקַלֵּל
  choice: na alaani
  rationale: 'Huhifadhi mwendelezo wenye maana ya ruhusa baada ya amri: wamwache ili aendelee kulaani.'
- source_word: כִּי אָמַר לוֹ יְהוָה
  choice: kwa maana Yahweh amemwambia hivyo
  rationale: Huhifadhi dai la Daudi kwamba Yahweh amesema naye, huku ‘hivyo’ ikielekeza kwa kulaani bila kuweka maneno ya nukuu yasiyopo wazi katika Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Je, maneno ya Daudi yanaonyesha amri ya moja kwa moja ya Mungu au ruhusa/majaliwa yake tu?
  choice: kwa maana Yahweh amemwambia hivyo
  alternative: kwa maana Yahweh amemruhusu
  rationale: Kiebrania kinahusisha kitendo hicho moja kwa moja na kile Yahweh alichomwambia Shimei. Tafsiri haipunguzi kauli hiyo kuwa ruhusa tu, hivyo inadumisha mvutano wa kiteolojia uliomo katika maneno ya Daudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Sembuse sasa’ huhifadhi nguvu ya hoja, na ‘anatafuta kuniua’ hufafanua nahau ya Kiebrania kwa ufasaha.
