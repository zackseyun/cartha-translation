  text: אוּלַ֛י יִרְאֶ֥ה יְהוָ֖ה ב/עונ/י וְ/הֵשִׁ֨יב יְהוָ֥ה לִ/י֙ טוֹבָ֔ה תַּ֥חַת קִלְלָת֖/וֹ הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/012.yaml
  text: Perhaps Yahweh will look on my affliction[a], and Yahweh will repay me with good in place of his cursing this day.
translation:
  language: sw
  text: Labda Yahwe ataiona taabu yangu[a], naye Yahwe atanilipa mema badala ya laana yake ya leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata namna ilivyoandikwa, “uovu wangu.”
    reason: textual_variant
lexical_decisions:
- source_word: אוּלַי
  choice: Labda
  rationale: Huwasilisha tumaini lenye kutokuwa na uhakika bila kuonyesha kwamba Daudi ana uhakika wa jibu.
- source_word: יִרְאֶה
  choice: ataiona
  rationale: Huhifadhi picha halisi ya ‘kuona’ huku katika muktadha ikimaanisha kutambua na kuijali hali ya Daudi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa na cheo.
- source_word: ב/עונ/י
  choice: taabu yangu
  rationale: Usomaji wa kimapokeo na muktadha wa kudhalilishwa kwa Daudi unaelekea kwenye mateso au taabu yake; tofauti ya namna iliyoandikwa imehifadhiwa katika tanbihi.
- source_word: וְהֵשִׁיב
  choice: atanilipa
  rationale: Katika muundo huu, kitenzi kina maana ya kurudisha kwa njia ya malipo, nayo ‘mema’ ndiyo yanayolipwa kwa Daudi.
- source_word: לִי טוֹבָה
  choice: mema
  rationale: ‘Atanilipa mema’ ni Kiswahili cha kawaida kinachoonyesha manufaa yanayoelekezwa kwa Daudi.
- source_word: תַּחַת
  choice: badala ya
  rationale: 'Hueleza ubadilishanaji: mema yatolewe mahali pa laana.'
- source_word: קִלְלָתוֹ
  choice: laana yake
  rationale: Huhifadhi nomino pamoja na kiambishi cha nafsi ya tatu kinachomrejelea Shimei.
- source_word: הַיּוֹם הַזֶּה
  choice: ya leo
  rationale: Ni usemi wa asili wa Kiswahili unaoweka laana hiyo katika siku hiyo ya simulizi.
theological_decisions:
- issue: Maana ya ב/עונ/י kwa kuzingatia tofauti ya ketiv/qere na muktadha
  choice: taabu yangu
  alternative: uovu wangu
  rationale: Muktadha unakazia fedheha na mateso anayopata Daudi, lakini namna iliyoandikwa inaweza kueleweka kuwa ‘uovu wangu.’ Tofauti hiyo haijaondolewa; usomaji mwingine umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kueleweka, huku jina Yahwe, kutokuwa na uhakika kwa ‘Labda,’ na mvutano wa tofauti ya maandishi vikihifadhiwa.
