  text: The king and all the people who were with him arrived weary[b][a], and they refreshed themselves there.
translation:
  language: sw
  text: Mfalme na watu wote waliokuwa pamoja naye wakafika wakiwa wamechoka, naye akajipumzisha huko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “akajipumzisha huko,” kitenzi kikiwa katika umoja; baadhi hulielewa kwa maana ya pamoja, “wakajipumzisha huko.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: wakafika
  rationale: Kitenzi בוא kinaweza kumaanisha kuja au kufika; hapa simulizi linasisitiza kufika mwisho wa safari, na umbo la wingi linafuata kiima cha pamoja katika Kiswahili cha kawaida.
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Huhifadhi cheo kilichotumiwa katika Kiebrania badala ya kubadili na kuweka jina la Daudi.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: na watu wote waliokuwa pamoja naye
  rationale: Huwakilisha wazi kishazi cha uhusiano אֲשֶׁר אִתּוֹ kwa Kiswahili sanifu na cha kawaida.
- source_word: עֲיֵפִים
  choice: wakiwa wamechoka
  rationale: Hueleza hali ya uchovu wa mwili inayodokezwa na kivumishi cha wingi עֲיֵפִים kwa lugha ya sasa na inayoeleweka.
- source_word: וַיִּנָּפֵשׁ
  choice: naye akajipumzisha
  rationale: Kitenzi kiko katika umoja na kina wazo la kupata pumziko au nguvu mpya; 'akajipumzisha' huhifadhi umoja na maana pana ya kurejea hali nzuri baada ya uchovu.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki hurejelea mahali walipofika na ambapo mfalme alipumzika.
