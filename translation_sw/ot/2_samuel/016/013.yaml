base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/013.yaml
  text: So David and his men went on the road[a], while Shimei went along on the hillside opposite him, going along and cursing[c][b], and throwing stones opposite him and flinging dust.
translation:
  language: sw
  text: Basi Daudi na watu wake wakaendelea njiani, huku Shimei akiendelea kutembea ubavuni mwa mlima mkabala naye[a], akilaani na akirusha mawe akiwa mkabala naye[b], na kutupa vumbi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sambamba naye upande wa pili.”
    reason: Kirai לְעֻמָּתוֹ kinaweza kueleza kuwa mtu yuko mkabala na mwingine au anasonga sambamba naye.
  - marker: b
    text: Au, “akimrushia mawe.”
    reason: Kitenzi סקל kinaweza kumaanisha kurushia au kupiga kwa mawe; muktadha hauweki wazi ikiwa mawe yalimpata Daudi.
lexical_decisions:
- source_word: בַּדָּרֶךְ
  choice: njiani
  rationale: Neno דֶּרֶךְ humaanisha njia au barabara; hapa linaonyesha njia ambayo Daudi na watu wake walikuwa wakifuata.
- source_word: בְּצֵלַע הָהָר
  choice: ubavuni mwa mlima
  rationale: צֵלַע ni upande au ubavu; likiwa pamoja na הָהָר linaonyesha upande wa mlima. Tafsiri hii inadumisha taswira ya mahali.
- source_word: לְעֻמָּתוֹ
  choice: mkabala naye / kuelekea kwake
  rationale: Kirai hiki kinaonyesha kuwa Shimei alikuwa upande unaokabiliana na Daudi. Katika matumizi ya pili, muktadha wa kurusha mawe unaruhusu maana ya kuyaelekeza upande alikokuwa Daudi bila kudai kwa lazima kwamba yalimpiga.
- source_word: הֹלֵךְ ... הָלוֹךְ
  choice: akitembea ... Aliendelea kwenda
  rationale: Kurudiwa kwa mzizi הלך kunaonyesha mwendo unaoendelea. Kiswahili hiki kinadumisha hali hiyo bila kuwa kigumu.
- source_word: וַיְקַלֵּל
  choice: akilaani
  rationale: Katika shina la Piel, קלל humaanisha kulaani; umbo la kuendelea linaendana na mfululizo wa matendo unaoelezwa hapa.
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: akirusha mawe
  rationale: Ingawa סקל linaweza kumaanisha kupiga mtu kwa mawe hadi kufa, hapa muktadha ni wa mashambulizi na usumbufu akiwa mbali; ‘akirusha mawe’ huepuka kuingiza wazo la hukumu rasmi.
- source_word: וְעִפַּר בֶּעָפָר
  choice: na kurusha mavumbi
  rationale: Kirai hiki kinaeleza kutupa au kurusha vumbi/udongo mwepesi kama tendo la uhasama. ‘Kurusha mavumbi’ ni Kiswahili cha kawaida na chenye picha wazi.
- source_word: וַאֲנָשָׁיו
  choice: watu wake
  rationale: Katika muktadha huu אֲנָשִׁים ni wale wanaume waliokuwa wafuasi au waandamani wa Daudi; ‘watu wake’ ni usemi wa kawaida wa Kiswahili katika simulizi.
- source_word: וַיֵּלֶךְ
  choice: wakaendelea
  rationale: הלך ni kwenda au kutembea; katika muktadha huu Daudi anaendelea na safari yake licha ya matendo ya Shimei.
