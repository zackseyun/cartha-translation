base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/005.yaml
  text: When King David came to Bahurim[a], behold, a man came out from there, from the clan of the house of Saul, whose name was Shimei son of Gera; he came out continually, cursing as he came.
translation:
  language: sw
  text: Mfalme Daudi alipofika Bahurimu, tazama, mtu mmoja alitoka huko, aliyetoka katika ukoo wa nyumba ya Sauli. Jina lake lilikuwa Shimei mwana wa Gera; alitoka akiendelea kulaani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alitoka huku akilaani bila kukoma.” Kiebrania husisitiza kitenzi “kutoka” kwa kukiweka pamoja na umbo la infinitivu huru; huenda ikionyesha tendo la kurudiwa au lililoendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַמֶּלֶךְ דָּוִד עַד בַּחוּרִים
  choice: Mfalme Daudi alipofika Bahurimu
  rationale: Waw pamoja na kitenzi timilifu huendeleza simulizi, huku עַד ikionyesha kufika mahali; muundo wa ‘alipofika’ huanzisha tukio linalofuata kwa Kiswahili cha asili.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Linahifadhi nguvu ya kuonyesha jambo la ghafla na la kuzingatiwa katika simulizi.
- source_word: מִשָּׁם אִישׁ יוֹצֵא
  choice: mtu mmoja alitoka huko
  rationale: Kivumishi-tendo יוֹצֵא kinaonyesha tendo lililokuwa likitokea katika tukio; wakati uliopita ni wa kawaida na wazi katika simulizi ya Kiswahili.
- source_word: מִמִּשְׁפַּחַת בֵּית שָׁאוּל
  choice: wa ukoo wa nyumba ya Sauli
  rationale: מִשְׁפָּחָה ni kundi la kindugu au ukoo, na ‘nyumba ya Sauli’ inadumisha maana ya familia pana au nasaba ya kifalme.
- source_word: וּשְׁמוֹ שִׁמְעִי בֶן גֵּרָא
  choice: Jina lake lilikuwa Shimei mwana wa Gera
  rationale: Muundo huu wa kawaida wa Kiswahili unahifadhi fomula yote ya kumtambulisha mtu.
- source_word: יֹצֵא יָצוֹא
  choice: Aliendelea kutoka
  rationale: Kivumishi-tendo pamoja na kitenzi-jina halisi husisitiza au kuendeleza tendo; ‘aliendelea kutoka’ huhifadhi hali ya kurudiwa au kudumu bila kuilazimisha kuwa marudio pekee.
- source_word: וּמְקַלֵּל
  choice: huku akilaani
  rationale: Kivumishi-tendo kinaonyesha kulaani kulikotokea sambamba na kutoka kwake.
