base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/021.yaml
  text: Ahithophel said to Absalom[a], “Go in to your father’s concubines, whom he left to keep the house, and all Israel will hear that you have become odious to your father[c][b], and the hands of all who are with you will be strengthened.”
translation:
  language: sw
  text: Ahithofeli akamwambia Absalomu, “Ingia kwa masuria wa baba yako[a], ambao aliwaacha waitunze nyumba; kisha Israeli yote itasikia kwamba umekuwa mwenye kuchukiza kwa baba yako[b], na wote walio pamoja nawe watatiwa moyo[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ingia kwa” ni lugha ya staha ya Kiebrania inayomaanisha kufanya ngono.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina picha ya kuwa na uvundo au kuwa mwenye kuchukiza.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “mikono ya wote walio pamoja nawe itatiwa nguvu,” yaani, watapata moyo au ujasiri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא אֶל
  choice: Ingia kwa
  rationale: Ni nahau ya Kiebrania inayotumiwa kwa staha kumaanisha kufanya ngono. Tafsiri hii inadumisha lugha ya staha ya chanzo, huku tanbihi ikifafanua maana yake.
- source_word: פִּלַגְשֵׁי
  choice: masuria
  rationale: ‘Masuria’ ni istilahi ya Kiswahili kwa wanawake waliokuwa na hadhi ya kindoa ya kiwango cha chini kuliko wake katika nyumba ya kifalme ya kale.
- source_word: הִנִּיחַ לִשְׁמוֹר הַבָּיִת
  choice: aliwaacha waitunze nyumba
  rationale: Inawakilisha kwa kawaida kusudi la kuwaacha wanawake hao ili waiangalie na kuitunza nyumba; ‘nyumba’ pia inadumisha neno pana la Kiebrania bila kulifanya moja kwa moja kuwa ‘ikulu.’
- source_word: וְשָׁמַע כָּל יִשְׂרָאֵל
  choice: Ndipo Israeli yote itakaposikia
  rationale: Muundo huu unaonyesha matokeo yaliyokusudiwa ya shauri hilo. ‘Israeli yote’ inawataja watu kwa ujumla.
- source_word: נִבְאַשְׁתָּ אֶת אָבִיךָ
  choice: umekuwa chukizo kwa baba yako
  rationale: Kitenzi kina picha ya kuwa na uvundo au kuwa mwenye kuchukiza. ‘Umekuwa chukizo’ huhifadhi ukali wa maana ya kijamii na kisiasa bila kulazimisha picha halisi ya harufu.
- source_word: וְחָזְקוּ יְדֵי
  choice: watatiwa moyo
  rationale: Nahau halisi ya ‘mikono itatiwa nguvu’ humaanisha kuimarishwa moyo au ujasiri. Tafsiri hii ni ya asili katika Kiswahili, na picha ya chanzo imehifadhiwa katika tanbihi.
- source_word: כָּל אֲשֶׁר אִתָּךְ
  choice: wote walio pamoja nawe
  rationale: Inadumisha usemi mpana wa uhusiano katika Kiebrania bila kuufanya mahsusi kuwa ‘wafuasi’ au ‘waasi.’
theological_decisions:
- issue: Lugha ya staha kuhusu tendo la kingono katika shauri la kisiasa
  choice: Ingia kwa masuria wa baba yako
  alternative: Lala na masuria wa baba yako
  rationale: Chanzo kinatumia lugha ya staha, hivyo tafsiri inadumisha uzito wa tendo na ishara yake ya kuvunja kabisa uhusiano na Daudi bila kuwa ya wazi kupita kiasi au kulificha tendo hilo.
- issue: Nguvu ya usemi נִבְאַשְׁתָּ kuhusu uhusiano na baba yake
  choice: umekuwa chukizo kwa baba yako
  alternative: umejifanya mwenye kuchukiza kwa baba yako
  rationale: Muundo uliochaguliwa huhifadhi wazo la kuwa mwenye kuchukiza machoni pa baba yake bila kuongeza kwa uhakika maana ya kujisababisha ambayo si lazima iwe katika kitenzi cha Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. ‘Masuria’ inadumisha mazingira ya kaya ya kifalme ya kale, ‘ingia kwa’ inadumisha lugha ya staha ya chanzo, na nahau ya mikono imetafsiriwa kwa maana yake ya kawaida huku picha halisi ikiwekwa katika tanbihi.
