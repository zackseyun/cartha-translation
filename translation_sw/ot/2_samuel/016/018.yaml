  text: וַ/יֹּ֣אמֶר חוּשַׁי֮ אֶל אַבְשָׁלֹם֒ לֹ֕א כִּי֩ אֲשֶׁ֨ר בָּחַ֧ר יְהוָ֛ה וְ/הָ/עָ֥ם הַ/זֶּ֖ה וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֑ל לא אֶהְיֶ֖ה וְ/אִתּ֥/וֹ אֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/018.yaml
  text: Hushai said to Absalom[a], “No, for the one whom Yahweh and this people and all the men of Israel have chosen—I will be his[c][b], and with him I will remain.”
translation:
  language: sw
  text: Hushai akamwambia Absalomu, “La, bali yule ambaye Yahwe, watu hawa, na wanaume wote wa Israeli wamemchagua, nitakuwa wake[a], nami nitakaa pamoja naye.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Qere ya Kimasora inasoma, “nitakuwa wake.” Ketiv (maandishi ya konsonanti) inasoma, “sitakuwa.”
    reason: textual_variant
lexical_decisions:
- source_word: לֹא כִּי
  choice: Sivyo!
  rationale: Kirai hiki kinaanza kwa kukataa kauli iliyotangulia kwa nguvu, kisha kinatoa msimamo sahihi. ‘Sivyo!’ ni Kiswahili cha kawaida na chenye hadhi katika majibu ya aina hii.
- source_word: אֲשֶׁר בָּחַר
  choice: Yule ambaye ... wamemchagua
  rationale: Kitenzi cha Kiebrania ni timilifu na kishazi rejeshi kinamlenga mtu maalumu aliye katika mazungumzo. Muundo huu ni wa asili katika Kiswahili na haugeuzi uchaguzi huo kuwa wa wakati ujao.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne YHWH limetoholewa kama jina binafsi, badala ya kubadilishwa kuwa cheo.
- source_word: וְהָעָם הַזֶּה
  choice: watu hawa
  rationale: Ingawa עָם ni nomino ya pamoja ya umoja katika Kiebrania, Kiswahili kwa kawaida husema ‘watu hawa’ kwa maana hiyo hiyo ya kundi lililo karibu au linalotajwa.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: na wanaume wote wa Israeli
  rationale: Hii inaleta kwa Kiswahili cha asili maana ya jumla ya kila אִישׁ wa Israeli, huku ikihifadhi rejeo la kiume lililo wazi katika chanzo.
- source_word: לוֹ אֶהְיֶה (qere; ketiv לֹא אֶהְיֶה)
  choice: nitakuwa wake[a]
  rationale: Usomaji wa kimapokeo wa Kimasora ni ‘nitakuwa kwake/wake,’ yaani nitakuwa mwaminifu kwake. ‘Nitakuwa wake’ hudumisha ufupi wa chanzo na maana ya kujitoa upande wake; tofauti ya maandishi imeonyeshwa katika tanbihi.
- source_word: וְאִתּוֹ אֵשֵׁב
  choice: nami nitakaa pamoja naye
  rationale: יָשַׁב inaweza kumaanisha kuketi, kukaa mahali, au kuendelea kuwa pamoja na mtu. ‘Nitakaa pamoja naye’ huhifadhi upana huo wa maana kuliko kuufanya wazi kuwa ‘nitabaki’ pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu, si cheo; kulitohowa huhifadhi tofauti hiyo bila kuingiza msimamo wa dhehebu.
- issue: Tofauti ya maandishi לֹא / לוֹ
  choice: Kufuata usomaji wa kimapokeo ‘nitakuwa wake’ na kutaja maandishi ya konsonanti katika tanbihi
  alternative: ‘sitakuwa’
  rationale: Usomaji wa pembeni wa Kimasora (qere) לוֹ unafaa kwa muktadha na unaendelea moja kwa moja na ‘nitakaa pamoja naye,’ lakini maandishi ya konsonanti (ketiv) לֹא yana maana ‘si/sitakuwa.’ Tofauti hii halisi haipaswi kufichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Sivyo!’ ni jibu la moja kwa moja; ‘nitakaa pamoja naye’ hudumisha maana pana ya kukaa, kubaki, au kuendelea kuandamana naye.
