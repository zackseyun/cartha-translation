base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/007.yaml
  text: And Shimei said as he cursed him[a], “Get out, get out[b], man of bloodshed and worthless man!”
translation:
  language: sw
  text: 'Naye Shimei alisema hivi alipokuwa akimlaani: “Ondoka! Ondoka! Mtu wa umwagaji damu[a] na mtu asiyefaa kitu[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu wa damu” au “mtu mwenye hatia ya damu.” Nahau ya Kiebrania hutumia kihalisi “damu” katika wingi na inaweza kumaanisha umwagaji damu au hatia ya damu.
    reason: lexical_alternative
  - marker: b
    text: Au “mtu mwovu.” Neno la Kiebrania beliyaal hapa ni tusi linalomaanisha mtu asiyefaa kitu au mtu wa tabia mbaya; si lazima liwe jina maalumu “Beliali.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כֹה אָמַר
  choice: Naye ... alisema hivi
  rationale: Muundo huu unaendeleza simulizi na kutambulisha maneno halisi yanayofuata bila kutafsiri kiufundi mno.
- source_word: שִׁמְעִי
  choice: Shimei
  rationale: Jina la mtu limeandikwa kwa namna inayotumiwa kwa kawaida katika Kiswahili.
- source_word: בְּ/קַלְל/וֹ
  choice: alipokuwa akimlaani
  rationale: Kihusishi pamoja na kitenzi-jina na kiambishi cha nafsi huonyesha tendo lililokuwa likiendelea wakati huo; kiambishi cha umoja wa kiume kinamrejelea Daudi katika muktadha.
- source_word: צֵא צֵא
  choice: Ondoka! Ondoka!
  rationale: Kurudiwa kwa amri kunasisitiza kufukuzwa na kukataliwa; “ondoka” ni amri ya asili na yenye nguvu katika Kiswahili.
- source_word: אִישׁ הַדָּמִים
  choice: mtu wa umwagaji damu
  rationale: Wingi wa Kiebrania “damu” ni nahau inayohusu umwagaji damu au hatia ya damu. Tafsiri hii haiongezi wazo la kupenda kuua, ambalo si lazima liwe katika neno lenyewe.
- source_word: וְ/אִישׁ הַבְּלִיָּעַל
  choice: na wewe mtu usiyefaa kitu
  rationale: Kirai hiki ni tusi linalomaanisha mtu asiye na thamani ya kimaadili au mtu mwovu. Kurudia “wewe mtu” kunahifadhi nguvu na ulinganifu wa matusi mawili katika Kiebrania.
theological_decisions:
- issue: Maana ya בְּלִיַּעַל
  choice: 'Tusi la kawaida: “mtu usiyefaa kitu”'
  alternative: “mtu mwovu” au “mtu wa Beliali”
  rationale: Katika muktadha huu neno hilo linafanya kazi kama maelezo ya ubaya na kutofaa kwa mtu, si lazima kama jina la kiumbe wa kiroho. “Beliali” lingeweza kuingiza dhana za baadaye ambazo mstari wenyewe haulazimishi.
- issue: Maana ya אִישׁ הַדָּמִים
  choice: “mtu wa umwagaji damu”
  alternative: “mtu wa damu” au “mtu mwenye hatia ya damu”
  rationale: Kiswahili hiki kinahifadhi shtaka la kuhusika na mauaji au umwagaji damu bila kuamua kimya-kimya ikiwa Shimei anasisitiza kitendo cha kuua au hatia inayotokana nacho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Alama za mshangao zinaonyesha nguvu ya amri iliyorudiwa na matusi ya moja kwa moja bila kuongeza maneno yasiyokuwamo katika chanzo.
