base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/016.yaml
  text: And when Hushai the Archite[a], David’s friend, came to Absalom, Hushai said to Absalom, “Long live the king! Long live the king!”
translation:
  language: sw
  text: Ikawa Hushai Mwariki, rafiki wa Daudi, alipofika kwa Absalomu, Hushai akamwambia Absalomu, “Mfalme aishi! Mfalme aishi!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mfalme na aishi!” Kiebrania kina tamko la shangwe ya kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ikawa ... alipo-
  rationale: Muundo huu wa Kiswahili unaendeleza simulizi na kuonyesha wakati wa tukio bila kuwa mzito kupita kiasi.
- source_word: בָּא
  choice: alipofika
  rationale: Kitenzi kinaonyesha kuwasili kwa Hushai mbele ya Absalomu; “alipofika” ni cha kawaida na wazi katika muktadha huu.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Hushai Mwarki
  rationale: Jina limetoholewa, na neno la utambulisho wa ukoo au mahali הָאַרְכִּי limetolewa kwa namna ya kawaida ya Kiswahili, “Mwarki.”
- source_word: רֵעֶה דָוִד
  choice: rafiki ya Daudi
  rationale: Kirai cha Kiebrania kinaeleza uhusiano wa Hushai na Daudi; “rafiki ya Daudi” ni wazi na ya asili kwa Kiswahili sanifu.
- source_word: אֶל אַבְשָׁלוֹם
  choice: kwa Absalomu / akamwambia Absalomu
  rationale: Katika kuwasili, אֶל imewakilishwa kwa “kwa”; katika kusema, mwelekeo wa usemi umeonyeshwa kiasili kwa kiambishi cha yambwa “-mw-” pamoja na jina Absalomu.
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Hii ni tafsiri ya kawaida na ya asili ya utangulizi wa maneno ya moja kwa moja, huku ikionyesha anayeelekezewa usemi.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Mfalme na aishi!
  rationale: Muundo wa “na aishi” unawakilisha nguvu ya jussive na tamko la kifalme, huku ukidumisha maana ya Kiebrania kwa Kiswahili cha heshima.
- source_word: יְחִי הַמֶּלֶךְ (repeated)
  choice: Mfalme na aishi!
  rationale: Marudio yamehifadhiwa kama yalivyo katika Kiebrania ili kuonyesha msisitizo wa shangwe ya kifalme na kubakiza utata wa uaminifu wa Hushai.
theological_decisions:
- issue: Utata wa shangwe ya Hushai kwa Absalomu
  choice: Kuhifadhi tamko la kifalme bila kuongeza maelezo ya kejeli au udanganyifu
  alternative: Kutafsiri kwa maneno yanayoonyesha wazi kejeli au nia ya kumdanganya Absalomu
  rationale: Aya yenyewe inatoa salamu ya kawaida ya kifalme. Muktadha mpana unaonyesha mkakati wa Hushai, lakini tafsiri haipaswi kuondoa mvutano huo kwa kuingiza nia yake katika maneno ya aya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio na utata wa tamko la kifalme vimehifadhiwa.
