  yaml_path: translation/ot/2_samuel/016/006.yaml
  text: And he threw stones at David and at all the servants of King David[a], while all the people and all the mighty men were at his right hand and at his left.
translation:
  language: sw
  text: Naye akarusha mawe kwa Daudi na kwa watumishi wote wa Mfalme Daudi[a], huku watu wote na mashujaa wote wakiwa upande wa kulia na wa kushoto wa Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawapiga kwa mawe Daudi na watumishi wote wa Mfalme Daudi.” Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa namna hii ya moja kwa moja zaidi, lakini katika muktadha huu kinaeleza shambulio la kuwarushia mawe, si lazima hukumu rasmi ya kuua kwa kupigwa mawe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: akawatupia mawe
  rationale: Kitenzi סקל katika piel pamoja na בָּאֲבָנִים kinaeleza kuwarushia watu mawe. Kiswahili hiki kinaonyesha tendo la kuwashambulia kwa mawe bila kudokeza lazima kwamba walitekeleza hukumu rasmi ya kuua kwa mawe.
- source_word: עַבְדֵי
  choice: watumishi
  rationale: Katika mazingira ya kifalme neno hili linaweza kuwahusu watu walio katika utumishi wa mfalme kwa upana; “watumishi” halilazimishi maana ya watumwa wala maofisa pekee.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Mfalme Daudi
  rationale: Hii ni namna ya kawaida na yenye heshima ya Kiswahili ya kuhifadhi cheo na jina.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: עם hapa ni kundi zima lililoandamana na Daudi, si lazima wanajeshi peke yao.
- source_word: הַגִּבֹּרִים
  choice: mashujaa wote
  rationale: גִּבֹּרִים humaanisha watu hodari wa vita, na “mashujaa” ni neno la asili na linaloeleweka katika Kiswahili cha sasa huku likihifadhi maana ya kijeshi.
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: upande wake wa kulia na wa kushoto
  rationale: Kirai kinaonyesha watu na mashujaa wakiwa pande zote mbili za Daudi. Kiwakilishi kimeachwa kama kilivyo katika chanzo, ingawa muktadha unaelekeza kwa Daudi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo “akawatupia mawe” ni wa kawaida na unaweka wazi kwamba Daudi pamoja na watumishi ndio walilengwa. “Huku” linaonyesha hali iliyokuwapo wakati tendo hilo likiendelea.
