base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/023.yaml
  text: The counsel of Ahithophel that he gave in those days was as if one inquired of God[a]; so was all the counsel of Ahithophel both to David and to Absalom.
translation:
  language: sw
  text: Shauri ambalo Ahithofeli alitoa siku hizo lilikuwa kama mtu anavyomwuliza Mungu[a]. Ndivyo lilivyokuwa shauri lote la Ahithofeli, kwa Daudi na pia kwa Absalomu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama mtu anavyouliza neno kutoka kwa Mungu.” Ulinganisho wa Kiebrania unasisitiza jinsi shauri la Ahithofeli lilivyothaminiwa sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: shauri
  rationale: “Shauri” ni neno la kawaida lakini lenye hadhi linaloweza kumaanisha ushauri wa mshauri wa kifalme; pia linawezesha urudiaji wa nomino katika mstari huu.
- source_word: אֲשֶׁר יָעַץ
  choice: alilotoa
  rationale: Katika Kiswahili, “shauri alilotoa” ni usemi wa asili zaidi kuliko kurudia kitenzi chenye mzizi wa “shauri,” huku maana ya kutoa ushauri ikibaki wazi.
- source_word: בַּיָּמִים הָהֵם
  choice: siku hizo
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya usemi wa wakati.
- source_word: כַּאֲשֶׁר יִשְׁאַל
  choice: kana kwamba mtu alikuwa amemwuliza
  rationale: Muundo huu unahifadhi ulinganisho wa Kiebrania na mhusika wake wa jumla bila kusema kwamba shauri la Ahithofeli lilikuwa ufunuo wa Mungu.
- source_word: בִּדְבַר הָאֱלֹהִים
  choice: Mungu
  rationale: Katika muktadha huu, kirai cha Kiebrania ni nahau ya kutafuta mwongozo kwa Mungu. Tafsiri kuu ya Kiswahili inatoa maana hiyo kwa uwazi, huku tanbihi ikihifadhi uwezekano wa kuonyesha neno דָּבָר kwa wazi zaidi.
- source_word: כֵּן
  choice: Ndivyo lilivyokuwa
  rationale: Huhifadhi msisitizo na ulinganisho wa kishazi cha pili kwa Kiswahili cha asili.
- source_word: גַּם לְדָוִד גַּם לְאַבְשָׁלֹם
  choice: kwa Daudi na kwa Absalomu pia
  rationale: Muundo huu unaonyesha kwamba mashauri yake yalikuwa na uzito huo kwa wote wawili na unahifadhi kihusishi kinachohusisha shauri na kila mmoja wao.
theological_decisions:
- issue: Nguvu ya kulinganisha shauri la Ahithofeli na kumwuliza Mungu
  choice: Mstari unasema shauri lake lilikuwa kana kwamba mtu alikuwa amemwuliza Mungu, bila kulifanya kuwa ufunuo wenyewe.
  alternative: Kusema tu kwamba shauri lake liliheshimiwa sana, au kusema kwamba lilifanya kazi kama unabii wa Mungu.
  rationale: Kiebrania kinatumia ulinganisho, si utambulisho. Tafsiri inahifadhi uzito wa ajabu uliopewa shauri lake bila kudai kwamba lilivuviwa na Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Shauri” limetumiwa kwa uthabiti ili kudumisha urudiaji wa Kiebrania. Hakuna kiunganishi cha mwanzo kama “Basi,” kwa kuwa chanzo hakina neno la wazi lenye maana hiyo.
