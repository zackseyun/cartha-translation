  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מַה לִּ֥/י וְ/לָ/כֶ֖ם בְּנֵ֣י צְרֻיָ֑ה כי יְקַלֵּ֗ל ו/כי יְהוָה֙ אָ֤מַר ל/וֹ֙ קַלֵּ֣ל אֶת דָּוִ֔ד וּ/מִ֣י יֹאמַ֔ר מַדּ֖וּעַ עָשִׂ֥יתָה כֵּֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/010.yaml
  text: But the king said[a], “What have I to do with you, sons of Zeruiah? If he is cursing because Yahweh has said to him, ‘Curse David,’ then who can say, ‘Why have you done so?’”
translation:
  language: sw
  text: Lakini mfalme akasema, “Nina nini nanyi, enyi wana wa Seruya? Ikiwa[a] analaani kwa sababu Yahweh amemwambia, ‘Laani Daudi,’ basi ni nani anayeweza kusema, ‘Kwa nini umefanya hivyo?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana analaani kwa sababu Yahweh amemwambia, ‘Laani Daudi.’” Chembe za Kiebrania zinaweza kueleweka kama maelezo badala ya sharti.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: Nina nini nanyi
  rationale: Hii ni nahau ya kujitenga na kukataa shauri lao; tafsiri hii huhifadhi muundo wa nahau huku ikieleweka katika Kiswahili sanifu.
- source_word: בְּנֵי צְרֻיָה
  choice: wana wa Seruya
  rationale: Ni kirai cha nasaba kinachowatambulisha Abishai na Yoabu kwa jina la mama yao; 'Seruya' ni umbo la kawaida la jina hilo katika Kiswahili.
- source_word: יְקַלֵּל / קַלֵּל
  choice: analaani / Mlaani
  rationale: Kitenzi kilekile kimetafsiriwa kwa mzizi mmoja ili kuhifadhi uhusiano wa kileksika kati ya tendo linaloendelea na amri iliyonukuliwa.
- source_word: כִּי ... וְכִי
  choice: Ikiwa ... kwa sababu
  rationale: Chembe hizi zinaweza kueleweka kwa masharti au kwa maelezo. Matini kuu hufuata mantiki ya masharti, huku tanbihi ikihifadhi uwezekano wa usomaji wa kimaelezo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: אָמַר לוֹ
  choice: amemwambia
  rationale: Kauli timilifu inaonyesha jambo lililotangulia ambalo linaeleza kitendo cha sasa; wakati timilifu wa Kiswahili huwasilisha uhusiano huo kwa kawaida.
- source_word: וּמִי יֹאמַר
  choice: basi ni nani anayeweza kusema
  rationale: Swali ni la balagha na linahusu uwezo au mamlaka ya kupinga, si wakati ujao tu.
- source_word: מַדּוּעַ עָשִׂיתָה כֵּן
  choice: Kwa nini umefanya hivyo?
  rationale: Ni tafsiri ya kawaida na yenye heshima ya changamoto ya balagha katika usemi wa moja kwa moja.
theological_decisions:
- issue: Kuhusika kwa Yahweh katika laana ya Shimei
  choice: Kauli ya Daudi imewasilishwa kama uwezekano kwamba Yahweh alimwagiza Shimei kumlaani Daudi.
  alternative: Kuitafsiri kama ruhusa tu ya Yahweh, au kama amri ya moja kwa moja isiyo na sura ya masharti.
  rationale: Kiebrania kinasema kwamba Yahweh alimwambia, ‘Mlaani Daudi,’ lakini chembe zake zinaruhusu uhusiano wa masharti au wa maelezo. Tafsiri haiupunguzi wala kuutatua mvutano huu wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau 'Nina nini nanyi' imehifadhiwa kwa ufupi; kiingizi 'enyi' kinaweka wazi kwamba mfalme anawahutubia wana wa Seruya. Alama ya tanbihi imewekwa baada ya mstari mzima kwa kuwa tanbihi inahusu muundo wa kisharti wa sentensi.
