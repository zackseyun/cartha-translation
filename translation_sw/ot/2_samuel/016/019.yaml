base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/019.yaml
  text: And secondly[a], whom should I serve? Should it not be before his son? As I served before your father, so I will be before you.
translation:
  language: sw
  text: Na pili, nimtumikie nani? Je, si mbele ya mwanawe?[a] Kama nilivyohudumu mbele ya baba yako, ndivyo nitakavyokuwa mbele yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, maneno “mbele ya mwanawe ... mbele ya baba yako ... mbele yako” ni msemo wa heshima wa ikulu, unaomaanisha kuhudumu mbele ya mfalme au chini ya mamlaka yake.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַשֵּׁנִית
  choice: Na pili
  rationale: Ni kiashiria cha hoja ya pili katika mazungumzo; “Na pili” ni cha kawaida na huonyesha mpangilio wa hoja bila tafsiri ya neno kwa neno isiyo ya asili.
- source_word: לְמִי אֲנִי אֶעֱבֹד
  choice: nimtumikie nani?
  rationale: Kitenzi עבד hapa kinahusu utumishi na uaminifu katika mazingira ya kifalme. Hali ya utegemezi katika “nimtumikie” inaleta vizuri nguvu ya swali la balagha.
- source_word: הֲלוֹא לִפְנֵי בְנוֹ
  choice: Je, si mbele ya mwanawe?
  rationale: הֲלוֹא hutarajia jibu la kukubali, nalo linaakisiwa na “Je, si.” “Mbele ya mwanawe” huhifadhi לִפְנֵי na tamathali ya kimahakama ya kuhudumu mbele ya mtawala.
- source_word: כַּאֲשֶׁר עָבַדְתִּי לִפְנֵי אָבִיךָ
  choice: Kama nilivyohudumu mbele ya baba yako
  rationale: “Kuhudumu” ni ya asili katika Kiswahili kwa utumishi wa mtu wa ikulu, huku “mbele ya” ikihifadhi taswira na ulinganifu wa Kiebrania.
- source_word: כֵּן אֶהְיֶה לְפָנֶיךָ
  choice: ndivyo nitakavyokuwa mbele yako
  rationale: Huhifadhi mabadiliko ya Kiebrania kutoka עבד, “kutumikia,” kwenda היה, “kuwa,” badala ya kuongeza tena kitenzi cha kutumikia ambacho hakipo katika kishazi cha mwisho.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa “mbele ya” umerudiwa kwa makusudi ili kuhifadhi lugha ya ikulu na ulinganifu wa chanzo; tanbihi inaeleza maana yake ya kitamaduni.
