  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa Kiebrania: kiashiria cha hoja ya pili, swali la balagha, urudiaji wa “mbele ya,” na mabadiliko ya kitenzi kutoka עבד (“kutumikia/kuhudumu”) hadi היה (“kuwa”) katika kishazi cha mwisho. “Mbele ya mwanawe” huhifadhi kipengele ambacho kinaweza kuachwa kwa urahisi katika tafsiri huru.'
