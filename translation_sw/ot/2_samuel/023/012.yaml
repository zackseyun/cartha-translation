base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/012.yaml
  text: But he took his stand in the middle of the field and defended it[a], and struck down the Philistines; and Yahweh brought about a great victory.
translation:
  language: sw
  text: Lakini yeye akasimama imara katikati ya shamba, akalilinda, akawapiga Wafilisti; naye Yahwe akaleta ushindi mkubwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukombozi mkubwa” au “wokovu mkubwa.” Neno la Kiebrania linaweza kuwa na mojawapo ya maana hizi; hapa linarejelea tendo la Yahwe la kuwaokoa katika vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצֵּב
  choice: akasimama imara
  rationale: Kauli ya Kiebrania inaonyesha mtu anayechukua msimamo wake kwa makusudi na kudumu katika nafasi hiyo; “akasimama imara” ni ya kawaida na inafaa mazingira ya vita.
- source_word: בְּתוֹךְ הַחֶלְקָה
  choice: katikati ya shamba
  rationale: חֶלְקָה ni sehemu au kipande cha ardhi; “shamba” linaeleweka kwa urahisi katika simulizi hili, na בְּתוֹךְ limetafsiriwa “katikati ya.”
- source_word: וַיַּצִּילֶהָ
  choice: akalilinda
  rationale: Kiwakilishi cha kike kinarejelea shamba. Ingawa נצל kwa kawaida ni kuokoa au kukomboa, hapa maana yake ni kulinusuru shamba lisichukuliwe na adui; “akalilinda” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וַיַּךְ אֶת־פְּלִשְׁתִּים
  choice: akawapiga Wafilisti
  rationale: Katika muktadha wa vita, נכה inaweza kumaanisha kupiga, kuwaangusha, au kuwashinda. “Akawapiga” inadumisha nguvu ya kitenzi bila kudai wazi kwamba aliwaua wote.
- source_word: וַיַּעַשׂ יְהוָה
  choice: Yahwe akaleta
  rationale: עשה pamoja na nomino dhahania תְּשׁוּעָה huonyesha kusababisha au kutimiza matokeo; “akaleta” ni tafsiri ya asili inayohifadhi kwamba Yahwe ndiye aliyetenda.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina la agano lililo katika maandishi ya Kiebrania.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: ushindi mkubwa
  rationale: תְּשׁוּעָה linaweza kumaanisha wokovu, ukombozi, au ushindi. Katika mazingira haya ya mapigano, “ushindi mkubwa” ndio maana ya karibu zaidi, huku tanbihi ikihifadhi upana wa neno la Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya תְּשׁוּעָה katika mazingira ya vita
  choice: ushindi
  alternative: ukombozi au wokovu
  rationale: Muktadha wa kijeshi unaelekeza kwa “ushindi,” lakini tanbihi inahifadhi uwezekano halisi wa maana pana ya tendo la Mungu la kuokoa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa vitenzi mfululizo unadumisha mwendo wa simulizi la Kiebrania. Alama ya tanbihi imewekwa baada ya “ushindi mkubwa,” ambako neno lenye maana mbadala linatokea.
