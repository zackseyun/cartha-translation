lexical_decisions:
- source_word: עֲשָׂה אֵל
  choice: Asaheli
  rationale: Jina hili la mtu, ambalo katika maandishi ya Kiebrania limegawanywa kwa tahajia, limetolewa kwa umbo linalotambulika katika Kiswahili cha Biblia.
- source_word: אֲחִי יוֹאָב
  choice: ndugu ya Yoabu
  rationale: Muundo huu unaonyesha wazi kuwa Asaheli alikuwa ndugu wa Yoabu; tafsiri hii ni ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: בַּשְּׁלֹשִׁים
  choice: miongoni mwa wale Thelathini
  rationale: Kihusishi ב pamoja na kundi la hesabu lenye kibainishi kinaonyesha kuwa alikuwa mshiriki wa kundi maalumu la mashujaa wa Daudi.
- source_word: אֶלְחָנָן
  choice: Elhanani
  rationale: Jina la mtu limetolewa kwa umbo la Kiswahili linalotambulika.
- source_word: בֶּן דֹּדֹו
  choice: mwana wa Dodo
  rationale: Maandishi ya Kimasora hapa yanasoma Dodo kama jina la mtu; tofauti iliyo katika simulizi sambamba imehifadhiwa katika tanbihi badala ya kuoanisha maandishi kimyakimya.
- source_word: בֵּית לָחֶם
  choice: wa Bethlehemu
  rationale: Katika orodha hii ya majina na nasaba, kirai hiki kinaonyesha mahali alikotoka Elhanani kwa lugha fupi na ya kawaida.
