  to: Alisimama akawapiga Wafilisti mpaka mkono wake ukachoka na ukaganda kwenye upanga. Siku hiyo Yahwe akaleta ushindi mkubwa[a]. Watu wakarudi nyuma yake ili tu kuwavua waliouawa[b].
