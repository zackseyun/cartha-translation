base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/010.yaml
  text: He rose and struck down the Philistines until his hand grew weary and his hand clung to the sword[a]. And Yahweh brought about a great victory on that day[b], and the people returned after him only to strip the slain.
translation:
  language: sw
  text: Alisimama akawapiga Wafilisti mpaka mkono wake ukachoka na ukaganda kwenye upanga. Siku hiyo Yahwe akaleta ushindi mkubwa[a]. Watu wakarudi nyuma yake ili tu kuwavua waliouawa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukombozi mkubwa” au “wokovu mkubwa.” Neno la Kiebrania linaweza kumaanisha kuokolewa kwa maana pana; katika muktadha huu wa vita limetafsiriwa “ushindi.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, kuwavua walioanguka vitani silaha, mavazi ya vita, na nyara nyingine baada ya mapigano.
    reason: cultural_note
lexical_decisions:
- source_word: קָם
  choice: alisimama
  rationale: Kitenzi hiki kinaonyesha kwamba alichukua hatua kwa uthabiti vitani; “alisimama” ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים
  choice: akawapiga Wafilisti
  rationale: Katika muktadha wa vita, נכה humaanisha kupiga kwa nguvu na mara nyingi kuua. Kiswahili “kuwapiga” kinahifadhi usemi wa chanzo bila kuongeza wazi kwamba wote waliuawa.
- source_word: עַד כִּי יָגְעָה יָדוֹ
  choice: mpaka mkono wake ukachoka
  rationale: יגע huonyesha uchovu au kuishiwa nguvu; usemi huu ni wa asili na unaeleweka kwa urahisi.
- source_word: וַתִּדְבַּק יָדוֹ אֶל הַחֶרֶב
  choice: na kushikamana na upanga
  rationale: דבק ni kushikamana au kuganda. Tafsiri hii inadumisha picha hai na haifafanui kimatibabu kama mkono ulikakamaa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi יהוה limetoholewa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: ushindi mkubwa
  rationale: תשועה linaweza kumaanisha wokovu, ukombozi, au ushindi. Katika simulizi hili la vita, “ushindi mkubwa” linaeleza matokeo halisi huku tendo hilo likihusishwa moja kwa moja na Yahwe.
- source_word: וְהָעָם יָשֻׁבוּ אַחֲרָיו
  choice: Watu wakarudi nyuma yake
  rationale: Tafsiri hii inahifadhi mwendo wa kurudi na wazo la kumfuata, bila kuongeza kwamba walikuwa wanajeshi ingawa muktadha unaonyesha hivyo.
- source_word: אַךְ לְפַשֵּׁט
  choice: kwa ajili tu ya kuwavua waliouawa
  rationale: פשט katika muktadha wa baada ya vita ni kuvua walioanguka silaha, mavazi ya vita, na vitu vya thamani; “tu” linadumisha nguvu ya אַךְ.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kina jina binafsi la Mungu, si cheo. “Yahwe” linahifadhi tofauti hiyo.
- issue: Maana ya תְּשׁוּעָה katika simulizi la vita
  choice: ushindi mkubwa
  alternative: ukombozi mkubwa au wokovu mkubwa
  rationale: Neno lina maana pana ya kuokoa, lakini hapa matokeo yanayoonekana ni ushindi vitani. Tanbihi inadumisha upana wa maana ya Kiebrania na mvutano wake wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa, na wenye hadhi. Viunganishi vya mfululizo “aka-” vinatunza mwendo wa masimulizi ya Kiebrania. Alama za tanbihi zimewekwa karibu na maneno yanayofafanuliwa, zikisahihisha kutolingana kwa nafasi za alama katika safu ya mashauriano ya Kiingereza.
