lexical_decisions:
- source_word: בְּנָיָהוּ
  choice: Benaya
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: פִּרְעָתֹנִי
  choice: wa Pirathoni
  rationale: Kivumishi hiki cha Kiebrania kinaonyesha kwamba Benaya alitoka Pirathoni; muundo wa Kiswahili “wa Pirathoni” ni wa asili na wazi.
- source_word: הִדַּי
  choice: Hidai
  rationale: Jina limetoholewa kutoka katika maandishi ya Kimasora ya Samueli bila kulibadilisha kuwa umbo la simulizi sambamba.
- source_word: מִ/נַּחֲלֵי
  choice: kutoka kwenye mikorongo ya
  rationale: נחל hapa inaweza kumaanisha korongo, bonde lenye kijito cha msimu, au njia ya maji; “mikorongo” huhifadhi hali ya kijiografia bila kudokeza lazima mito ya kudumu.
- source_word: גָעַשׁ
  choice: Gaashi
  rationale: Jina la mahali limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili.
