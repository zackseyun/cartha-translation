review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys David’s strong longing, preserves the Hebrew wish-like question, identifies Bethlehem’s well, and retains the location at/by the gate. A small adjustment better represents the Hiphil of שקה (‘cause to drink/give drink’) without adding meaning.
  naturalness: ‘Atakayeninywesha maji’ is more idiomatic and concise Standard East African Swahili than ‘atakayenipa maji ninywe.’ ‘Kando ya lango’ naturally expresses the well’s association with the gate.
  terminology: ‘Daudi,’ ‘Bethlehemu,’ ‘kisima,’ ‘lango,’ and ‘maji’ are appropriate established biblical and general Swahili terms. ‘Akatamani sana’ suitably conveys the intensive sense of the Hebrew verb.
  issues:
  - severity: low
    issue: The phrase ‘atakayenipa maji ninywe’ is somewhat cumbersome.
    rationale: While understandable, it separates the causative idea into ‘give me water’ plus ‘that I may drink.’ The Hebrew Hiphil is directly and naturally rendered by ‘atakayeninywesha.’
  - severity: low
    issue: ‘Karibu na lango’ can imply merely general proximity.
    rationale: The Hebrew phrase locates/associates the well with the gate. ‘Kando ya lango’ more closely conveys ‘by the gate’ while not asserting that it was within the gateway.
  revised_text: Daudi akatamani sana, akasema,[a] “Ni nani atakayeninywesha maji kutoka katika kisima cha Bethlehemu kilicho kando ya lango?”
