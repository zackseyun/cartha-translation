- from: Ndipo Daudi akatamani sana, akasema,[a] “Ni nani atakayenipa maji ninywe kutoka katika kisima cha Bethlehemu kilicho karibu na lango?”
  to: Daudi akatamani sana, akasema,[a] “Ni nani atakayeninywesha maji kutoka katika kisima cha Bethlehemu kilicho kando ya lango?”
  rationale: The revision retains the Hebrew question and its expression of longing, while using the direct Swahili causative ‘atakayeninywesha’ for יַשְׁקֵנִי. It also renders the well’s relationship to the gate more precisely as ‘kando ya lango.’ The opening conjunction is represented naturally by the narrative sequence without the additional ‘Ndipo.’
