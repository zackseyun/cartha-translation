    reason: lexical_alternative
  revision_rationale: The revision retains the Hebrew question and its expression of longing, while using the direct Swahili causative ‘atakayeninywesha’ for יַשְׁקֵנִי. It also renders the well’s relationship to the gate more precisely as ‘kando ya lango.’ The opening conjunction is represented naturally by the narrative sequence without the additional ‘Ndipo.’
