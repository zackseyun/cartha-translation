base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/015.yaml
  text: And David longed and said[a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: sw
  text: Daudi akatamani sana, akasema,[a] “Ni nani atakayeninywesha maji kutoka katika kisima cha Bethlehemu kilicho kando ya lango?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri yenye kueleza maana kwa uwazi zaidi, “Laiti mtu angeninywesha maji kutoka katika kisima cha Bethlehemu kilicho kando ya lango!” Kiebrania kinatumia swali “Ni nani atakaye...?” kuonyesha tamanio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוֶּה
  choice: akatamani sana
  rationale: Kitenzi hiki katika hitpael kinaonyesha hamu kubwa. ‘Akatamani sana’ ni Kiswahili cha kawaida kinachobeba nguvu ya hisia hiyo.
- source_word: וַיֹּאמַר
  choice: akasema
  rationale: Hiki ni kitenzi cha kawaida cha kusema; maandishi ya Kiebrania hayaongezi wazi kuwa alisema moyoni au alipaza sauti.
- source_word: מִי
  choice: Ni nani atakaye-
  rationale: Muundo wa swali umehifadhiwa kwa sababu Kiebrania hutumia swali hili kueleza tamanio, bila kuligeuza moja kwa moja kuwa kauli ya ‘Laiti.’
- source_word: יַשְׁקֵנִי
  choice: atanipa maji ninywe
  rationale: Hifil ya שקה humaanisha kumpa mtu kinywaji au kumnywesha. Muundo huu ni wa asili katika Kiswahili na unaendana na nomino ‘maji’ inayofuata.
- source_word: מַיִם
  choice: maji
  rationale: Hii ndiyo maana ya moja kwa moja na ya kawaida.
- source_word: מִבֹּאר
  choice: kutoka katika kisima
  rationale: בְּאֵר kwa kawaida ni kisima, si birika; kihusishi מִן kinaonyesha chanzo.
- source_word: בֵּית לֶחֶם
  choice: Bethlehemu
  rationale: Hili ni umbo la kawaida la jina hili la mahali katika Biblia ya Kiswahili.
- source_word: אֲשֶׁר בַּשָּׁעַר
  choice: kilicho karibu na lango
  rationale: Kirai hiki kinakitambulisha kisima kwa uhusiano wake na lango la mji. ‘Karibu na lango’ ni wazi na hakidokezi bila lazima kwamba kisima kilikuwa ndani ya lango.
