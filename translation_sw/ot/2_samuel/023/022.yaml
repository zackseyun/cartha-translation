  text: These things Benaiah son of Jehoiada did[b][a], and he had a name among the three mighty men.
translation:
  language: sw
  text: Haya ndiyo aliyoyafanya Benaya mwana wa Yehoyada,[a] naye alikuwa mashuhuri miongoni mwa wale mashujaa watatu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Haya Benaya mwana wa Yehoyada aliyafanya.”
    reason: Mpangilio huu mbadala unafuata kwa karibu zaidi muundo wa sentensi ya Kiebrania bila kubadili maana.
  - marker: b
    text: Kihalisi, “naye alikuwa na jina miongoni mwa wale mashujaa watatu.” Baadhi ya wafasiri hulinganisha orodha pana ya mashujaa wa Daudi na usomaji wenye “thelathini,” lakini maandishi ya Kiebrania hapa yanasema “watatu.”
    reason: Tanbihi inadumisha nahau halisi ya Kiebrania na kutaja suala la usomaji bila kubadili maandishi ya msingi.
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: Hayo ndiyo aliyofanya
  rationale: Kiashiria kinarejelea matendo yaliyosimuliwa katika mistari iliyotangulia. Muundo huu ni wa kawaida katika Kiswahili na unadumisha mkazo wa Kiebrania.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaya mwana wa Yehoyada
  rationale: Majina yamenukuliwa kwa namna inayosomeka katika Kiswahili, na uhusiano wa ukoo umetafsiriwa moja kwa moja.
- source_word: וְלוֹ שֵׁם
  choice: naye alikuwa mashuhuri
  rationale: Nahau ya Kiebrania, kihalisi ‘naye alikuwa na jina,’ humaanisha kuwa na sifa au kujulikana sana. Kiswahili ‘alikuwa mashuhuri’ huwasilisha maana hiyo kwa kawaida; tafsiri halisi imehifadhiwa katika tanbihi.
- source_word: בִּשְׁלֹשָׁה הַגִּבֹּרִים
  choice: miongoni mwa wale mashujaa watatu
  rationale: Maandishi ya WLC yanasema wazi ‘watatu.’ ‘Mashujaa’ linafaa kwa wapiganaji hodari wa Daudi katika muktadha huu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Mashujaa’ linadumisha hadhi ya kikundi cha wapiganaji hodari bila kutumia istilahi nzito isiyo ya lazima.
