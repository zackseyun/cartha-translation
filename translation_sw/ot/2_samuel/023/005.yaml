source:
  edition: WLC
  text: כִּֽי לֹא כֵ֥ן בֵּיתִ֖/י עִם אֵ֑ל כִּי֩ בְרִ֨ית עוֹלָ֜ם שָׂ֣ם לִ֗/י עֲרוּכָ֤ה בַ/כֹּל֙ וּ/שְׁמֻרָ֔ה כִּֽי כָל יִשְׁעִ֥/י וְ/כָל חֵ֖פֶץ כִּֽי לֹ֥א יַצְמִֽיחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/005.yaml
  text: For my house is not so with God[a]; yet he has made with me an everlasting covenant, ordered in every way and kept secure[b]. For this is all my salvation and all my desire—will he not indeed make it grow?
translation:
  language: sw
  text: Kwa maana nyumba yangu haiko hivyo katika uhusiano na Mungu[a]; kwa kuwa amefanya nami agano la milele, lililopangwa kwa kila jambo na lililohifadhiwa. Kwa maana hilo ndilo wokovu wangu wote na tamanio langu lote—je, hatalifanya lichipuke kweli?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, nyumba yangu haiko hivyo katika uhusiano na Mungu?” Wengi huelewa mwanzo huu kuwa swali chanya la balagha badala ya kauli hasi.
    reason: alternative_reading
  - marker: b
    text: Au, “kwa maana hakika atalifanya lichipuke/listawi.” Kifungu cha mwisho ni kigumu katika Kiebrania, na kinaweza kueleweka kama swali la balagha, uthibitisho wenye nguvu, au kauli hasi ya moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Katika mwanzo wa mstari, neno hili linaunganisha kauli na maneno yaliyotangulia kwa kutoa maelezo; marudio yake yana kazi tofauti kulingana na muktadha.
- source_word: לֹא כֵן
  choice: haiko hivyo
  rationale: Tafsiri hii inahifadhi hali hasi ya maandishi ya Kiebrania na haifafanui kupita kiasi kile kinachorejelewa na ‘hivyo.’
- source_word: בֵּיתִי
  choice: nyumba yangu
  rationale: ‘Nyumba’ huhifadhi maana halisi huku ikiweza pia kumaanisha familia, ukoo, au nasaba ya kifalme katika muktadha wa agano.
- source_word: עִם אֵל
  choice: kwa Mungu
  rationale: Katika Kiswahili cha kawaida, ‘kwa Mungu’ huwasilisha uhusiano unaoelezwa na עִם bila kuongeza ufafanuzi wa kimadhehebu; maana ya msingi ni ‘pamoja na/katika uhusiano na Mungu.’
- source_word: בְרִית עוֹלָם
  choice: agano la milele
  rationale: Huu ni usemi wa kawaida na wenye heshima unaohifadhi wazo la agano linalodumu.
- source_word: שָׂם לִי
  choice: amefanya nami
  rationale: Ingawa kitenzi kimsingi ni ‘kuweka,’ katika muktadha wa agano Kiswahili cha asili husema ‘kufanya agano na mtu.’
- source_word: עֲרוּכָה בַכֹּל
  choice: lililopangwa kikamilifu
  rationale: Usemi huu unaonyesha kwamba agano limepangwa au kuwekwa sawa kwa kila jambo; ‘kikamilifu’ huwasilisha upeo wa בַכֹּל kwa Kiswahili kinachoeleweka.
- source_word: וּשְׁמֻרָה
  choice: na kulindwa salama
  rationale: Huhifadhi hali ya kutendwa na wazo la agano lililohifadhiwa au kulindwa kwa uthabiti.
- source_word: כָל יִשְׁעִי
  choice: wokovu wangu wote
  rationale: ‘Wokovu’ hubeba maana pana ya kuokolewa au kukombolewa bila kuibana kwa tukio moja tu.
- source_word: וְכָל חֵפֶץ
  choice: na tamanio langu lote
  rationale: חֵפֶץ inaweza kuwa tamanio, shauku, au jambo la kupendeza; ‘tamanio’ linafaa katika ulinganifu na ‘wokovu.’
- source_word: כִּי לֹא יַצְמִיחַ
  choice: je, hatalifanya lichipuke kweli?
  rationale: Kitenzi cha kusababisha kimewasilishwa kwa ‘kulifanya lichipuke.’ Swali la balagha huhifadhi לֹא huku likiruhusu maana chanya inayofaa muktadha; kiwakilishi ‘hilo’ kinabaki na kiasi cha utata kuhusu kama kinarejelea agano, wokovu, au tamanio.
theological_decisions:
- issue: Maana ya kifungu cha mwanzo כִּי לֹא כֵן בֵּיתִי עִם אֵל
  choice: 'Kauli hasi: ‘Kwa maana nyumba yangu haiko hivyo kwa Mungu.’'
  alternative: 'Swali chanya la balagha: ‘Je, nyumba yangu haiko hivyo kwa Mungu?’'
  rationale: Maandishi yaliyowekewa irabu yana לֹא, ‘si/haiko,’ hivyo kauli hasi imehifadhiwa katika matini kuu. Hata hivyo, swali la balagha ni uelewa wa zamani na muhimu unaopatana kwa urahisi zaidi na uthibitisho wa agano unaofuata, kwa hiyo umewekwa katika tanbihi.
- issue: Nguvu na maana ya kifungu cha mwisho כִּי לֹא יַצְמִיחַ
  choice: 'Swali chanya la balagha: ‘je, hatalifanya lichipuke kweli?’'
  alternative: Kauli hasi, ‘kwa maana hatalifanya lichipuke,’ au uthibitisho wenye nguvu, ‘hakika atalifanya lichipuke.’
  rationale: Kifungu hiki ni kifupi na kigumu kisarufi. Swali la balagha huhifadhi neno hasi la Kiebrania na wakati huohuo huonyesha matarajio chanya yanayotokana na agano la milele, bila kuficha kwamba kauli hasi ya moja kwa moja pia inawezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Nyumba’ imehifadhiwa ili ibebe kwa pamoja maana ya kaya, ukoo, na nasaba; lugha ya agano imewekwa wazi bila kuondoa utata wa vifungu vya mwanzo na mwisho.
