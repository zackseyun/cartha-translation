  source_fidelity: Tafsiri inaakisi kwa usahihi mfuatano wa utambulisho wa Shama, kukusanyika kwa Wafilisti, shamba lenye dengu, na watu kukimbia mbele ya Wafilisti. Hata hivyo, kwa kuwa tafsiri kuu huchukua לַחַיָּה kwa maana ya “kwa vita,” sentensi inayofuata inapaswa kuunganishwa wazi na hali hiyo kupitia “hapo,” badala ya kuitengeneza kama sentensi huru inayoweza kudokeza kwamba neno gumu lenyewe ni mahali.
  naturalness: “Baada yake alikuwa Shama” inaeleweka lakini ni nzito kidogo katika Kiswahili cha sasa. “Baada yake alikuja Shama” ni ya asili na inafaa kwa mfuatano wa orodha, bila kubadilisha maana kwa kiasi cha maana. “Watu wakawakimbia Wafilisti” ni sahihi, lakini “watu wakakimbia mbele ya Wafilisti” hufuata nahau ya Kiebrania na husikika kwa kawaida katika rejesta ya kibiblia.
  terminology: 'Majina Shama, Agee, na Mharari yamehifadhiwa ipasavyo. “Dengu” na “kipande cha shamba” ni chaguo sahihi. Tanbihi inahitaji kurekebishwa kidogo: “kuwa kikosi” si usemi wa kawaida kwa mbadala wa neno hili; “katika kikosi” ni wazi zaidi. Jina “Lehi” libainishwe kuwa usomaji unaowezekana wa jina la mahali.'
