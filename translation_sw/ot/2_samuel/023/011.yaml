base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/011.yaml
  text: After him was Shammah son of Agee the Hararite. The Philistines gathered together at Lehi[a], where there was a plot of ground full of lentils, and the people fled from before the Philistines.
translation:
  language: sw
  text: Baada yake alikuja Shama mwana wa Agee, Mharari. Wafilisti walikusanyika kwa vita[a], na hapo palikuwa na kipande cha shamba kilichojaa dengu; watu wakakimbia mbele ya Wafilisti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania לַחַיָּה ni neno gumu. Huenda likamaanisha “kwa vita”; wengine hulielewa “katika kikosi,” au kama jina la mahali, “Lehi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Baada yake
  rationale: Inahifadhi kiunganishi kifupi kinachoonyesha mfuatano katika orodha bila kuongeza kitenzi kisichokuwapo katika Kiebrania.
- source_word: שַׁמָּא בֶן־אָגֵא הָרָרִי
  choice: Shama mwana wa Agee, Mharari
  rationale: Majina yametoholewa kwa namna inayoeleweka katika Kiswahili, na הָרָרִי imehifadhiwa kama jina la ukoo au asili badala ya kufasiriwa kwa kubahatisha kuwa mtu wa milimani.
- source_word: וַיֵּאָסְפוּ
  choice: walikusanyika
  rationale: Kitenzi kinaeleza Wafilisti kujikusanya; Kiswahili hiki ni cha kawaida na kinadumisha maana ya muktadha wa kijeshi.
- source_word: לַחַיָּה
  choice: kwa vita
  rationale: Neno hili ni gumu, lakini muktadha wa kijeshi na simulizi sambamba la 1 Mambo ya Nyakati 11:13 vinaunga mkono maana ya kukusanyika kwa mapigano. Utata wa neno umeonyeshwa katika tanbihi.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: kipande cha shamba
  rationale: Huwasilisha kwa kawaida wazo la sehemu au eneo dogo la shamba huku ikihifadhi taswira halisi ya Kiebrania.
- source_word: מְלֵאָה עֲדָשִׁים
  choice: kilichojaa dengu
  rationale: Ni tafsiri ya moja kwa moja ya maelezo ya Kiebrania, bila kuongeza wazo lisilotajwa wazi kwamba dengu zilikuwa zimepandwa.
- source_word: וְהָעָם נָס מִפְּנֵי פְלִשְׁתִּים
  choice: nao watu wakawakimbia Wafilisti
  rationale: Inahifadhi neno la jumla 'watu' bila kulifanya mahususi kuwa jeshi, na inatoa kwa Kiswahili cha kawaida maana ya kukimbia kutoka mbele ya Wafilisti.
