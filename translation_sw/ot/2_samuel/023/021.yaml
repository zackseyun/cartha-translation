  text: וְ/הוּא הִכָּה֩ אֶת אִ֨ישׁ מִצְרִ֜י אשר מַרְאֶ֗ה וּ/בְ/יַ֤ד הַ/מִּצְרִי֙ חֲנִ֔ית וַ/יֵּ֥רֶד אֵלָ֖י/ו בַּ/שָּׁ֑בֶט וַ/יִּגְזֹ֤ל אֶֽת הַ/חֲנִית֙ מִ/יַּ֣ד הַ/מִּצְרִ֔י וַ/יַּהַרְגֵ֖/הוּ בַּ/חֲנִיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/021.yaml
  text: He also struck down an Egyptian[a], a man of impressive appearance. The Egyptian had a spear in his hand, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[b], and killed him with his own spear.
translation:
  language: sw
  text: Pia alimwangusha Mmisri[a], mtu mwenye sura ya kuvutia. Mmisri huyo alikuwa na mkuki mkononi, naye akamshukia akiwa na fimbo[b], akaupokonya mkuki kutoka mkononi mwa Mmisri, kisha akamuua kwa mkuki wa Mmisri mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu mwenye sura nzuri” au “mtu mwenye sura ya pekee.” Kirai cha Kiebrania kinahusu mwonekano wa Mmisri kwa upana; kwa kuathiriwa na kifungu sambamba katika 1 Mambo ya Nyakati 11:23, wengine hukielewa kuwa kinadokeza kimo kisicho cha kawaida.
    reason: lexical_alternative
  - marker: b
    text: Au “rungu” au “gongo.” Neno la Kiebrania שֵׁבֶט linaweza kumaanisha fimbo, gongo, fimbo ya kifalme, au rungu kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: alimwangusha
  rationale: Katika muktadha wa mapigano, נכה inaweza kumaanisha kumpiga au kumwangusha mtu. Neno hili linatoa muhtasari wa ushindi bila kutangulia maelezo ya baadaye kwamba alimwua.
- source_word: אִישׁ מִצְרִי
  choice: Mmisri
  rationale: Hii ndiyo njia ya kawaida na ya asili ya Kiswahili ya kutaja mtu wa taifa hilo; hakuna haja ya kuongeza neno “mtu” hapa.
- source_word: אשר מַרְאֶה
  choice: mtu mwenye sura ya kuvutia
  rationale: Kirai cha Kiebrania kinahusu mwonekano wa nje kwa upana. Tafsiri hii haikifungii kwenye uzuri au kimo pekee.
- source_word: וּבְיַד הַמִּצְרִי חֲנִית
  choice: Mmisri huyo alikuwa na mkuki mkononi
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida umilikaji unaoonyeshwa na kirai halisi cha Kiebrania.
- source_word: וַיֵּרֶד אֵלָיו
  choice: akamshukia
  rationale: ירד kimsingi ni kushuka, na katika muktadha huu inaonyesha kumkaribia au kumvamia mpinzani. “Akamshukia” huhifadhi picha ya mwendo na nguvu ya tendo.
- source_word: בַּשָּׁבֶט
  choice: akiwa na fimbo
  rationale: שֵׁבֶט inaweza kuwa fimbo, rungu, au aina nyingine ya kijiti cha mkononi. “Fimbo” ndiyo tafsiri pana isiyoongeza uhakika usiokuwamo katika maandishi.
- source_word: וַיִּגְזֹל
  choice: akaupokonya
  rationale: גזל hubeba wazo la kuchukua kwa nguvu. “Kupokonya” linafaa kwa tendo la ghafla katika mapigano.
- source_word: וַיַּהַרְגֵהוּ
  choice: akamuua
  rationale: Hii ni tafsiri ya moja kwa moja, wazi, na ya sasa ya הרג.
- source_word: בַּחֲנִיתוֹ
  choice: kwa mkuki wake mwenyewe
  rationale: Kiambishi cha umilikaji kinaelekea kumrejelea Mmisri ambaye mkuki wake umepokonywa. “Wake mwenyewe” huweka wazi mgeuko huo wa tukio.
- source_word: וְהוּא
  choice: Pia
  rationale: Neno hili linaendeleza orodha ya matendo ya kishujaa na linaonyesha nyongeza kwa njia ya asili katika Kiswahili.
