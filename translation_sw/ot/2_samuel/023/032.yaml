  text: Elyahba the Shaalbonite[a], the sons of Jashen, Jonathan.
translation:
  language: sw
  text: Eliyahba, Mshaalboni[a], wana wa Yasheni, Yonathani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maandishi ya Kiebrania hapa ni mafupi na magumu; kwa tafsiri ya neno kwa neno yanasema, “Eliyahba, Mshaalboni, wana wa Yasheni, Yonathani.” Baadhi ya watafsiri huona hitilafu katika maandishi na hupanga orodha hii kwa namna tofauti, kwa mfano wakimchukulia Yonathani kuwa mmoja wa “wana wa Yasheni.” Tafsiri hii inadumisha maneno ya Kiebrania yaliyopokelewa bila kuyarekebisha.
    reason: textual_variant
lexical_decisions:
- source_word: אֶלְיַחְבָּא
  choice: Eliyahba
  rationale: Jina la mtu limetoholewa kwa kufuata matamshi ya Kiebrania badala ya kutafsiriwa.
- source_word: הַשַּׁעַלְבֹנִי
  choice: Mshaalboni
  rationale: Ni jina la kimahali lenye kibainishi, likimaanisha mtu kutoka Shaalboni/Shaalbimu; umbo la Kiswahili la 'M-' linaonyesha mtu wa mahali hapo.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Ni wingi wa neno 'mwana' katika muundo wa umilikaji. Tafsiri inadumisha wingi huo ingawa kufuatwa kwake na jina la umoja 'Yonathani' kunafanya maandishi kuwa magumu.
- source_word: יָשֵׁן
  choice: Yasheni
  rationale: Limechukuliwa kuwa jina la mtu katika kirai 'wana wa Yasheni' na halijarekebishwa kwa kubahatisha.
- source_word: יְהוֹנָתָן
  choice: Yonathani
  rationale: Jina la mtu limetoholewa kwa umbo linaloeleweka na linalotumika kwa kawaida katika Kiswahili cha Biblia.
