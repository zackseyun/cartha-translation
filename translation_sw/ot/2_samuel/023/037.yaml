lexical_decisions:
- source_word: צֶלֶק
  choice: Seleki
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili na inayolingana na desturi ya majina ya Biblia.
- source_word: הָעַמֹּנִי
  choice: Mwamoni
  rationale: Kivumishi hiki cha asili au taifa kimetafsiriwa kwa jina la kawaida la Kiswahili la mtu kutoka Amoni.
- source_word: נַחְרַי
  choice: Naharai
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika na kueleweka katika Kiswahili; umbo fupi zaidi limehifadhiwa katika tanbihi.
- source_word: הַבְּאֵרֹתִי
  choice: mtu wa Beerothi
  rationale: Neno hili humtambulisha mtu kwa mahali alikotoka. Kirai hiki ni cha kawaida zaidi katika Kiswahili kuliko kuunda jina zito la kikabila.
- source_word: נשאי כְּלֵי
  choice: aliyekuwa mchukua silaha
  rationale: Katika muktadha wa kijeshi, maneno haya yanamtaja mtu mwenye jukumu la kumbebea kamanda silaha au vifaa vya vita. Kiswahili hiki kinaeleza wazi jukumu hilo bila kulifanya kuwa kubeba vitu vya kawaida.
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: Yoabu mwana wa Seruya
  rationale: Utambulisho wa ukoo umehifadhiwa moja kwa moja kwa mtindo wa orodha ya Kiebrania.
