  text: Abiezeri wa Anathothi[a]; Mebunai wa Husha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenyeji wa Anathothi” na “mwenyeji wa Husha.” Kiebrania kinatumia maneno yanayoonyesha uhusiano wa mtu na mahali au ukoo huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבִיעֶזֶר
  choice: Abiezeri
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, bila kutafsiri maana yake.
- source_word: הָעַנְּתֹתִי
  choice: wa Anathothi
  rationale: Ni neno la Kiebrania linalomtambulisha mtu kwa uhusiano wake na Anathothi. Muundo wa “wa Anathothi” ni wa asili na unaeleweka katika Kiswahili, huku ukiacha wazi ikiwa maana ni mwenyeji, mzaliwa, au mtu wa ukoo/eneo hilo.
- source_word: מְבֻנַּי
  choice: Mebunai
  rationale: Jina la mtu limetoholewa moja kwa moja; halihitaji kutafsiriwa.
- source_word: הַחֻשָׁתִי
  choice: wa Husha
  rationale: Ni jina la uhusiano wa mahali au ukoo. “Wa Husha” linafuata muundo sambamba na “wa Anathothi” na kuhifadhi uwezekano wa uhusiano wa asili, makazi, au ukoo.
