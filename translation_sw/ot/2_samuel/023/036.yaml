  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wa Soba.” Kihusishi cha Kiebrania kinaweza kuonyesha asili au uhusiano; “kutoka Soba” limechaguliwa kwa maana ya moja kwa moja ya mahali alikotoka.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְאָל
  choice: Igali
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, huku likihifadhi umbo la jina la Kiebrania.
- source_word: בֶּן
  choice: mwana wa
  rationale: Hii ndiyo njia ya kawaida na ya asili ya kuonyesha uhusiano wa kifamilia katika orodha ya majina.
- source_word: נָתָן
  choice: Nathani
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: מִצֹּבָה
  choice: kutoka Soba
  rationale: Kihusishi מִן kwa kawaida huonyesha asili au mahali alikotoka mtu; hapa maana ya kijiografia inafaa katika orodha ya mashujaa, ingawa uhusiano mpana zaidi unabaki uwezekano.
- source_word: בָּנִי
  choice: Bani
  rationale: Jina la mtu limetoholewa moja kwa moja na kwa tahajia inayofaa Kiswahili.
- source_word: הַגָּדִי
  choice: Mgadi
  rationale: Nomino hii ya utambulisho humaanisha mtu wa kabila au eneo la Gadi; 'Mgadi' ni kifupi, cha asili, na kinafaa katika orodha.
