  text: מִן הַ/שְּׁלֹשָׁה֙ הֲ/כִ֣י נִכְבָּ֔ד וַ/יְהִ֥י לָ/הֶ֖ם לְ/שָׂ֑ר וְ/עַד הַ/שְּׁלֹשָׁ֖ה לֹא בָֽא־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/019.yaml
  text: Was he not more honored than the three? So he became their commander[b][a], but he did not attain to the three.
translation:
  language: sw
  text: Je, hakuheshimiwa zaidi kuliko wale watatu?[a] Basi akawa kamanda wao, lakini hakufikia cheo cha wale watatu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Je, hakuheshimiwa miongoni mwa wale watatu?” Kiebrania kinaweza kueleweka bila ulinganisho huo, lakini maana ya “kuliko wale watatu” inafaa zaidi muundo wa sentensi na kifungu kinachofanana katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Yaani, hakufikia cheo au hadhi ya “wale watatu,” waliokuwa kundi la juu zaidi kati ya mashujaa wa Daudi.
    reason: cultural_note
lexical_decisions:
- source_word: מִן הַשְּׁלֹשָׁה
  choice: kuliko wale watatu
  rationale: Kihusishi מִן baada ya נִכְבָּד kinaeleweka vyema kwa maana ya ulinganisho, yaani, “kuliko wale watatu,” ingawa maana ya “miongoni mwa wale watatu” pia inawezekana.
- source_word: הֲכִי
  choice: Je, ... haku-
  rationale: Muundo huu unaanzisha swali la balagha linalotarajia jibu la kukubali; “Je, hakuheshimiwa...?” ni Kiswahili cha kawaida na cha wazi.
- source_word: נִכְבָּד
  choice: hakuheshimiwa zaidi
  rationale: Kitenzi hiki kutokana na כבד kinaonyesha mtu kuheshimiwa au kuthaminiwa sana; neno “zaidi” linaonyesha ulinganisho uliomo katika sentensi.
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: Basi akawa kamanda wao
  rationale: שַׂר humaanisha mkuu au kiongozi; katika muktadha wa mashujaa wa kijeshi, “kamanda” ni neno la kisasa, wazi na linalofaa.
- source_word: וְעַד הַשְּׁלֹשָׁה לֹא בָא
  choice: lakini hakufikia cheo cha wale watatu
  rationale: Muundo huu unaeleza kutofikia kiwango au hadhi ya kundi hilo, si kutofika mahali kimwili. Kutaja “cheo” huweka maana hiyo wazi kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Swali la balagha limehifadhiwa; “kamanda” linaonyesha muktadha wa kijeshi, na “hakufikia cheo” linafafanua nahau ya Kiebrania bila kuifanya kuwa mwendo wa kimwili.
