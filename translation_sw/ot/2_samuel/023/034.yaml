  text: Eliphelet son of Ahasbai son of the Maacathite[a], Eliam son of Ahithophel the Gilonite.
translation:
  language: sw
  text: Elifeleti mwana wa Ahasbai mwana wa Mmaakathi[a]; Eliamu mwana wa Ahithofeli, Mgiloni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au huenda: “Elifeleti mwana wa Ahasbai, Mmaakathi; Eliamu mwana wa Ahithofeli, Mgiloni.” Hii inategemea jinsi uhusiano wa maneno katika orodha hii unavyoeleweka na pia ulinganisho na 1 Mambo ya Nyakati 11:35–36.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִיפֶלֶט
  choice: Elifeleti
  rationale: Jina limetoholewa kwa tahajia na matamshi ya kawaida ya Kiswahili badala ya kutafsiriwa.
- source_word: בֶּן
  choice: mwana wa
  rationale: Katika orodha hii ya majina, neno hili kwa kawaida linaonyesha uhusiano wa baba na mwana; “mwana wa” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אֲחַסְבַּי
  choice: Ahasbai
  rationale: Jina limetoholewa moja kwa moja kutoka Kiebrania kwa tahajia inayosomeka kwa Kiswahili.
- source_word: הַמַּעֲכָתִי
  choice: Mmaakathi
  rationale: Ni jina la utambulisho wa kikabila au kieneo; umbo la Kiswahili lenye kiambishi M- linahifadhi maana ya mtu wa Maaka.
- source_word: אֱלִיעָם
  choice: Eliamu
  rationale: Jina limetoholewa kwa umbo linalofaa mfumo wa sauti wa Kiswahili.
- source_word: אֲחִיתֹפֶל
  choice: Ahithofeli
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili huku likibaki karibu na umbo la Kiebrania.
- source_word: הַגִּלֹנִי
  choice: Mgiloni
  rationale: Ni jina la utambulisho wa kieneo linalomaanisha mtu wa Gilo; umbo “Mgiloni” ni fupi na la kawaida katika mtindo wa majina ya Kiswahili.
