  yaml_path: translation/ot/2_samuel/023/006.yaml
  text: But worthless men are all like thorns cast aside[a], for they cannot be taken with the hand.
translation:
  language: sw
  text: Lakini watu wasiofaa wote ni kama miiba iliyotupwa kando[a], kwa maana haishikwi kwa mkono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania beliyya‘al hapa huenda linamaanisha watu “wasiofaa” au “waovu,” wala si jina maalumu la baadaye “Beliali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְלִיַּעַל
  choice: watu waovu
  rationale: Hapa nomino hiyo inawarejelea watu wasiofaa au waovu, si jina maalumu la Beliali. Neno “watu” linaweka wazi rejeo la kibinadamu linaloonekana katika viambishi vya wingi.
- source_word: כְּקוֹץ
  choice: kama miiba
  rationale: Ingawa neno la Kiebrania liko katika umoja, limetumiwa kwa maana ya mkusanyiko. “Miiba” ni usemi wa kawaida wa Kiswahili na unalingana na warejelewa wa wingi.
- source_word: מֻנָד
  choice: iliyotupwa kando
  rationale: Kauli hii ya kutendwa huonyesha kitu kilichoondolewa au kusukumwa mbali. “Iliyotupwa kando” inadumisha taswira ya miiba isiyoshikwa moja kwa moja.
- source_word: כֻּלָּהֶם
  choice: wote
  rationale: Inahifadhi maana ya kuwajumuisha watu hao bila kuongeza uzito usio wa lazima.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza sababu inayofafanua kwa nini watu hao wanafananishwa na miiba.
- source_word: לֹא בְיָד יִקָּחוּ
  choice: haiwezi kushikwa kwa mkono
  rationale: Hueleza kutowezekana kivitendo kuishika miiba hiyo kwa mkono. Umoja wa “haiwezi” unapatana na “miiba” kama nomino ya ngeli ya 9/10.
