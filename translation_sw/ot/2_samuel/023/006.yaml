  source_fidelity: '"Watu waovu" captures one contextual sense of בְלִיַּעַל, but it narrows the term to moral evil. "Watu wasiofaa" better preserves its primary sense of worthlessness while leaving the contextual connotation available. The thorn simile and the practical impossibility of handling it directly are retained.'
