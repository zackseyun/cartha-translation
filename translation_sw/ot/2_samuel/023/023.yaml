  yaml_path: translation/ot/2_samuel/023/023.yaml
  text: He was honored among the thirty[a], but he did not attain to the three[c][b]; and David appointed him over his bodyguard.
translation:
  language: sw
  text: Aliheshimiwa miongoni mwa wale thelathini[a], lakini hakufikia cheo cha wale watatu[b]. Daudi akamweka kuwa mkuu wa walinzi wa Daudi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Aliheshimiwa kuliko wale thelathini.” Muundo wa Kiebrania unaweza kueleweka kuwa wa kulinganisha badala ya kumhesabu kuwa mmoja wao.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “hakuwafikia wale watatu,” yaani, hakufikia cheo cha wale mashujaa watatu walio bora zaidi.
    reason: lexical_alternative
  - marker: c
    text: Kwa Kiebrania, “kwa mishmaath yake.” Neno hilo linaweza kumaanisha “amri yake” au watu walio chini ya mamlaka yake. “Walinzi wa Daudi” linaonyesha maana ya kijeshi inayowezekana katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלֹשִׁים
  choice: miongoni mwa wale thelathini
  rationale: Kihusishi מִן hapa kinaweza kueleza kuwamo katika kundi au ulinganisho. Katika orodha hii ya mashujaa, maana ya kuwamo miongoni mwa wale thelathini inafaa, huku uwezekano wa ulinganisho ukihifadhiwa katika tanbihi.
- source_word: נִכְבָּד
  choice: aliheshimiwa
  rationale: Niphal ya כבד inaonyesha kwamba alipewa heshima au alihesabiwa kuwa mwenye hadhi. 'Aliheshimiwa' ni Kiswahili cha kawaida na huhifadhi hali ya kutendwa.
- source_word: וְאֶל הַשְּׁלֹשָׁה לֹא בָא
  choice: lakini hakufikia cheo cha wale watatu
  rationale: בוא pamoja na אֶל katika muktadha wa vyeo ina maana ya kufikia kiwango au hadhi. Kutaja 'cheo' huwasilisha maana hiyo kwa Kiswahili cha asili bila kudokeza kwamba hakuwaendea kimwili.
- source_word: וַיְשִׂמֵהוּ
  choice: Daudi akamweka kuwa mkuu
  rationale: שׂים kimsingi ni kuweka, lakini katika muktadha wa mamlaka humaanisha kumpa mtu wadhifa. Muundo huu ni wazi na wa kawaida kwa Kiswahili.
- source_word: אֶל מִשְׁמַעְתּוֹ
  choice: kuwa mkuu wa walinzi wake
  rationale: מִשְׁמַעַת linaweza kumaanisha amri, mamlaka, au kundi lililo chini ya mamlaka. Katika muktadha wa kijeshi wa ikulu, 'walinzi wake' ni maana inayowezekana zaidi, lakini maana nyingine zinatajwa katika tanbihi.
