  text: וַ/אֲבִישַׁ֞י אֲחִ֣י יוֹאָ֣ב בֶּן צְרוּיָ֗ה ה֚וּא רֹ֣אשׁ ה/שלשי וְ/הוּא֙ עוֹרֵ֣ר אֶת חֲנִית֔/וֹ עַל שְׁלֹ֥שׁ מֵא֖וֹת חָלָ֑ל וְ/ל/וֹ שֵׁ֖ם בַּ/שְּׁלֹשָֽׁה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/018.yaml
  text: Abishai[a], the brother of Joab son of Zeruiah, was chief of the Three. He wielded his spear against three hundred and killed them[b], and he had a name among the Three.
translation:
  language: sw
  text: Abishai[a], ndugu wa Yoabu, mwana wa Seruya, alikuwa mkuu wa wale Watatu. Aliuinua mkuki wake juu ya watu mia tatu waliouawa[b], naye alikuwa na sifa miongoni mwa wale Watatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mkuu wa wale Watatu.” Kwa kuzingatia kifungu sambamba katika 1 Mambo ya Nyakati 11:20 na kutokuwa na uhakika kwa matini katika sehemu hii, baadhi ya watafsiri huelewa kundi hili kuwa “wale Thelathini.”'
    reason: textual_variant
  - marker: b
    text: Au, “aliuinua/aliupunga mkuki wake dhidi ya watu mia tatu na kuwaua.” Kiebrania ni kifupi; kihalisi, “aliamsha/aliinua mkuki wake juu ya watu mia tatu waliouawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ הַשְּׁלֹשִׁי
  choice: mkuu wa wale Watatu
  rationale: רֹאשׁ ni “kichwa/mkuu.” Ingawa neno linalofuata lina ugumu wa kimatini na kifungu sambamba kinaweza kuelekeza kwa “wale Thelathini,” maandishi ya Kimasoreti hapa pamoja na בַּשְּׁלֹשָׁה mwishoni mwa aya yanaunga mkono “wale Watatu” katika matini kuu.
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: aliuinua mkuki wake
  rationale: Kitenzi עורר kimsingi humaanisha kuamsha, kuchochea, au kuinua. Katika muktadha huu wa kivita, “aliuinua mkuki wake” huhifadhi taswira na ufupi wa Kiebrania bila kuongeza kitendo kisichotajwa wazi.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: dhidi ya watu mia tatu waliouawa
  rationale: חָלָל humaanisha mtu aliyechomwa au kuuawa. Kifungu cha Kiebrania ni kifupi na hakina kitenzi kingine cha wazi cha “aliwaua”; tafsiri hii inadumisha hali hiyo badala ya kuifanya maana iliyodokezwa kuwa tamko la moja kwa moja.
- source_word: וְלוֹ שֵׁם
  choice: naye alikuwa na sifa
  rationale: Nahau hiyo, kihalisi “na kwake kulikuwa na jina,” humaanisha kuwa na sifa au umaarufu. Kiswahili “alikuwa na sifa” ni cha kawaida na huwasilisha maana ya nahau hiyo.
- source_word: בַּשְּׁלֹשָׁה
  choice: miongoni mwa wale Watatu
  rationale: Kihusishi ב pamoja na namba hapa kinaonyesha uhusiano na kundi; “miongoni mwa” ni tafsiri ya kawaida, huku “wale Watatu” ikihifadhi utambulisho wa kundi maalumu.
- source_word: אֲבִישַׁי ... יוֹאָב ... צְרוּיָה
  choice: Abishai ... Yoabu ... Seruya
  rationale: Majina yametolewa kwa maumbo yanayotambulika katika matumizi ya kawaida ya Biblia ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Wale Watatu” imeandikwa kwa herufi kubwa kuonyesha jina la kundi maalumu la mashujaa. Muundo wenye utata wa Kiebrania kuhusu watu mia tatu umehifadhiwa katika matini, na usomaji ulio wazi zaidi umewekwa katika tanbihi.
