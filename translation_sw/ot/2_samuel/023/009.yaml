base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/009.yaml
  text: And after him was Eleazar son of Dodo[a], son of Ahohi, among the three mighty men with David, when they taunted the Philistines who had gathered there for battle[c][b], and the men of Israel had gone up.
translation:
  language: sw
  text: Baada yake alifuata Eleazari mwana wa Dodo[a], mwana wa Ahohi, mmoja wa wale mashujaa watatu waliokuwa pamoja na Daudi, walipowadhihaki Wafilisti[b] waliokuwa wamekusanyika huko kwa ajili ya vita; na watu wa Israeli wakapanda[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwana wa Dodai, mwana wa Mwahohi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “walipowatukana Wafilisti.”
    reason: lexical_alternative
  - marker: c
    text: Kwa neno halisi, “na watu wa Israeli wakapanda”; katika muktadha huu huenda maana yake ni kwamba waliondoka au walirudi nyuma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/אחר/ו
  choice: Baada yake alikuwa
  rationale: Kifungu hiki kinamtambulisha shujaa anayefuata katika orodha; kitenzi ‘alikuwa’ kinakamilisha sentensi kwa Kiswahili cha kawaida.
- source_word: אֶלְעָזָר
  choice: Eleazari
  rationale: Umbo la kawaida la Kiswahili la jina hili la Kiebrania.
- source_word: בֶּן דדי בֶּן אֲחֹחִי
  choice: mwana wa Dodo, mwana wa Ahohi
  rationale: Yanahifadhi majina kama yanavyoweza kueleweka katika matini ya konsonanti, huku usomaji mwingine unaowezekana ukitajwa katika tanbihi.
- source_word: בִּ/שְׁלֹשָׁה גברים
  choice: mmoja wa wale mashujaa watatu
  rationale: Katika muktadha wa kijeshi גברים humaanisha mashujaa, na בְּ inaonyesha kuwa Eleazari alikuwa mshiriki wa kundi la watatu.
- source_word: עִם דָּוִד
  choice: waliokuwa pamoja na Daudi
  rationale: Inaonyesha ushirika wa mashujaa hao na Daudi kwa lugha ya asili ya Kiswahili.
- source_word: בְּ/חָרְפָם
  choice: walipowadhihaki
  rationale: חרף huonyesha kutukana au kudhihaki kwa lengo la kumkaidi adui; ‘kuwadhihaki’ huhifadhi kiini hicho cha maana bila kukifanya kuwa changamoto ya kijeshi tu.
- source_word: בַּ/פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Jina la kawaida la Kiswahili la kundi hili la watu.
- source_word: נֶאֶסְפוּ שָׁם לַ/מִּלְחָמָה
  choice: waliokuwa wamekusanyika huko kwa ajili ya vita
  rationale: Nifali ya אסף inaeleza Wafilisti kujikusanya, na kishazi rejeshi kinaonyesha wazi kuwa wao ndio waliokusanyika.
- source_word: וַֽ/יַּעֲלוּ אִישׁ יִשְׂרָאֵל
  choice: nao watu wa Israeli walikuwa wamepanda
  rationale: ‘Walikuwa wamepanda’ huhifadhi maana ya msingi ya עלה (‘kwenda juu/kupanda’) na pia hali ya wakati unaotangulia; uwezekano wa maana ya kuondoka au kurudi nyuma unaelezwa katika tanbihi badala ya kuamuliwa kimya kimya.
