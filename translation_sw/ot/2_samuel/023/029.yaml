base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/029.yaml
  text: Heleb son of Baanah the Netophathite[a], Ittai son of Ribai from Gibeah of the sons of Benjamin;
translation:
  language: sw
  text: Helebu mwana wa Baana, Mnetofathi; Itai mwana wa Ribai, kutoka Gibea ya wana wa Benyamini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka Gibea ya Wabenyamini.” Kiebrania kinasema kihalisi, “kutoka Gibea ya wana wa Benyamini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: Helebu
  rationale: Jina la mtu limetoholewa kwa tahajia ya Kiswahili; vokali ya mwisho hurahisisha matamshi ya konsonanti ya mwisho.
- source_word: בֶּן
  choice: mwana wa
  rationale: Hili ndilo neno la kawaida la Kiswahili linaloonyesha uhusiano wa mwana na baba katika orodha ya majina.
- source_word: בַּעֲנָה
  choice: Baana
  rationale: Jina limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: הַנְּטֹפָתִי
  choice: Mnetofathi
  rationale: Ni neno la kumtambulisha mtu kwa asili au uhusiano wake na Netofa; umbo la Kiswahili ni fupi na linafaa katika orodha hii.
- source_word: אִתַּי
  choice: Itai
  rationale: Jina limetoholewa kwa tahajia ya asili inayosomeka kwa urahisi katika Kiswahili.
- source_word: רִיבַי
  choice: Ribai
  rationale: Jina limetoholewa bila kulitafsiri.
- source_word: מִגִּבְעַת
  choice: kutoka Gibea
  rationale: Kiambishi מִן kinaonyesha mahali alikotoka mtu; ‘kutoka’ kinawasilisha maana hiyo wazi.
- source_word: בְּנֵי בִנְיָמִן
  choice: ya wana wa Benyamini
  rationale: Inahifadhi kwa karibu usemi halisi wa Kiebrania, ‘wana wa Benyamini,’ huku ikiunganisha Gibea na kabila hilo.
