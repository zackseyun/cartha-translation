  text: וַ/יִּבְקְעוּ֩ שְׁלֹ֨שֶׁת הַ/גִּבֹּרִ֜ים בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בֹּ֤אר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑ד וְ/לֹ֤א אָבָה֙ לִ/שְׁתּוֹתָ֔/ם וַ/יַּסֵּ֥ךְ אֹתָ֖/ם לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/016.yaml
  text: Then the three mighty men broke through the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But he was not willing to drink it; instead[b], he poured it out to Yahweh.
translation:
  language: sw
  text: Ndipo wale mashujaa watatu wakapenya kwa nguvu katika kambi ya Wafilisti, wakachota maji kutoka katika kisima cha Bethlehemu kilichokuwa penye lango, wakayachukua na kumletea Daudi. Lakini Daudi hakukubali kuyanywa; badala yake, akayamimina kwa BWANA.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, aliyamimina kama tendo la kumtolea BWANA, lenye maana inayofanana na sadaka ya kinywaji.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: wakapenya kwa nguvu
  rationale: Kitenzi kinaonyesha kuvunja au kupenya eneo la adui. Neno “kwa nguvu” linahifadhi hali ya kijeshi na kuzuia maana ya kupita tu au kujipenyeza kwa siri.
- source_word: שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: wale mashujaa watatu
  rationale: “Mashujaa” ni Kiswahili cha kawaida na chenye hadhi kwa wapiganaji hodari wa kikosi maalumu cha Daudi.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: katika kambi ya Wafilisti
  rationale: Hii inawakilisha moja kwa moja kambi ya kijeshi iliyokuwa chini ya Wafilisti.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: wakateka maji
  rationale: “Kuteka maji” ni usemi wa kawaida wa Kiswahili kwa kuchota maji kisimani.
- source_word: מִבֹּאר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: kutoka katika kisima cha Bethlehemu kilichokuwa karibu na lango
  rationale: Tafsiri hii inatambulisha kisima kinachohusishwa na Bethlehemu na kuhifadhi mahali pake karibu na lango la mji.
- source_word: וַיִּשְׂאוּ וַיָּבִאוּ אֶל דָּוִד
  choice: wakayachukua na kumletea Daudi
  rationale: Viambishi vya ngeli ya “maji” vinahifadhi kitu kinachobebwa, huku mlolongo wa vitendo vya Kiebrania ukibaki wazi.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: Daudi hakukubali kuyanywa
  rationale: “Hakukubali” huhifadhi wazo la kutokuwa tayari au kutoridhia, badala ya kueleza tu kwamba hakuyanywa. Jina “Daudi” limerudiwa kwa uwazi wa Kiswahili.
- source_word: וַיַּסֵּךְ אֹתָם
  choice: akayamimina
  rationale: Tafsiri inahifadhi kitendo halisi cha kumimina bila kulazimisha katika matini kuu jina maalumu la ibada. Ngeli ya wingi ya “maji” pia inalingana kiasili na kiambishi cha wingi katika Kiebrania.
- source_word: לַיהוָה
  choice: mbele za BWANA
  rationale: Katika muktadha wa tendo la ibada, “mbele za BWANA” ni Kiswahili cha asili kinachoonyesha kuwa maji yalimiminiwa kwa kumtolea BWANA. Jina la agano limewakilishwa kwa desturi ya “BWANA”.
theological_decisions:
- issue: Maana ya tendo la Daudi la kuyamimina maji
  choice: Kitendo halisi cha kuyamimina mbele za BWANA, chenye maana ya kumtolea
  alternative: Kuyatupa tu kama ishara ya kukataa kuyanywa, bila maana yoyote ya kiibada
  rationale: Kitenzi נָסַךְ mara nyingi huhusishwa na kumimina sadaka, na kirai “kwa BWANA” kinaipa hatua hiyo mwelekeo wa ibada. Matini kuu inaacha kitendo kikiwa halisi bila kukitaja moja kwa moja kuwa aina maalumu ya sadaka; tanbihi inaeleza dokezo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi wenye “waka-” umetumiwa kudumisha mwendo wa matendo. “Maji” yametibiwa kwa ngeli yake ya wingi, hivyo hakuna haja ya tanbihi kuhusu viambishi vya wingi vya Kiebrania.
