  text: But the man who touches them must arm himself with iron and the shaft of a spear[c][b][a], and they must be completely burned with fire in their place.
translation:
  language: sw
  text: Lakini mtu anayewagusa[c] lazima ajihami kwa chuma na shina la mkuki[a]; nao watateketezwa kabisa kwa moto mahali walipo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lazima ajipatie chuma na mti wa mkuki.” Kihalisi, “lazima ajazwe chuma na mti wa mkuki.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hakika watateketezwa kwa moto papo hapo.” Kiebrania hutumia kitenzi-jina pamoja na kitenzi ili kutilia mkazo tendo hilo. Neno la mwisho pia linaweza kueleweka kuwa “mahali hapo.”
    reason: lexical_alternative
  - marker: c
    text: Kiwakilishi “wa-” kinawarejelea watu wasiofaa, waliofananishwa na miiba katika mstari uliotangulia.
    reason: cross_reference
lexical_decisions:
- source_word: וְאִישׁ
  choice: Lakini mtu
  rationale: אִישׁ ni nomino ya umoja inayotumiwa hapa kwa maana ya jumla. Kiunganishi וְ kimetafsiriwa “Lakini” ili kuonyesha tofauti na picha ya miiba katika mstari uliotangulia.
- source_word: יִגַּע בָּהֶם
  choice: anayewagusa
  rationale: נגע kwa kawaida humaanisha “kugusa” au “kufikia.” “Anayewagusa” inadumisha picha halisi ya miiba hatari pamoja na kiwakilishi cha wingi.
- source_word: יִמָּלֵא
  choice: lazima ajihami
  rationale: Nifali ya מלא kihalisi ni “kujazwa,” lakini pamoja na vyombo vilivyotajwa hapa ina maana ya mtu kujipatia vifaa vya kujilinda au kushughulikia miiba. “Ajihami” ni Kiswahili cha kawaida na cha kueleweka bila kufafanua chombo cha chuma zaidi ya Kiebrania.
- source_word: בַרְזֶל
  choice: kwa chuma
  rationale: Neno linamaanisha “chuma”; chanzo hakitaji aina mahususi ya kifaa cha chuma, kwa hiyo ujumla wake umehifadhiwa.
- source_word: וְעֵץ חֲנִית
  choice: na mpini wa mkuki
  rationale: Kihalisi ni “na mti wa mkuki,” yaani sehemu ya mkuki iliyotengenezwa kwa mti. “Mpini wa mkuki” ni usemi wa asili unaowasilisha sehemu hiyo bila kuichanganya na ncha ya chuma.
- source_word: וּבָאֵשׁ
  choice: kwa moto
  rationale: ב limetumiwa hapa kueleza njia au chombo cha kuangamiza; “kwa moto” ni usemi wa kawaida wa Kiswahili.
- source_word: שָׂרוֹף יִשָּׂרְפוּ
  choice: watateketezwa kabisa
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi kilichokamilika kwa maana huongeza mkazo. “Kabisa” huonyesha nguvu hiyo, na kauli tendwa ya Kiswahili huakisi mtendaji asiyeainishwa katika wingi wa Kiebrania.
- source_word: בַּשָּׁבֶת
  choice: mahali walipo
  rationale: Umbo hili adimu linaeleweka kwa kawaida kwa maana ya mahali—“mahali hapo” au “walipo.” Tafsiri hii huhifadhi maana ya eneo bila kulazimisha maana ya “makao.”
