translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Picha ya miiba, chuma, na mkuki imehifadhiwa; sintaksia imefanywa ya asili kwa Kiswahili. Utata wa בַּשָּׁבֶת na tafsiri halisi ya יִמָּלֵא umeonyeshwa katika tanbihi.
