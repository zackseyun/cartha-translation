base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/001.yaml
  text: 'These are the last words of David: An oracle of David son of Jesse[a], an oracle of the man raised on high, the anointed of the God of Jacob[c][b], and the sweet singer of Israel.'
translation:
  language: sw
  text: 'Haya ndiyo maneno ya mwisho ya Daudi:


    Tamko la Daudi mwana wa Yese,[a]

    tamko la mtu aliyeinuliwa juu,

    aliyetiwa mafuta na Mungu wa Yakobo,[b]

    na mwimbaji wa kupendeza wa nyimbo za Israeli.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Neno la Daudi” au “Tamko la Daudi.” Neno la Kiebrania hutambulisha usemi rasmi na mzito, mara nyingi wenye tabia ya kinabii.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mpakwa-mafuta wa Mungu wa Yakobo”; au “Masihi wa Mungu wa Yakobo.” Hapa maneno hayo yanamhusu Daudi moja kwa moja, ingawa yana mwangwi wa kifalme na wa kimasihi.'
    reason: alternative_reading
  - marker: c
    text: Kifungu cha Kiebrania pia kinaweza kueleweka kuwa “mwenye nyimbo tamu za Israeli” au “mpendeza wa nyimbo za Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה דִּבְרֵי דָוִד הָאַחֲרֹנִים
  choice: Haya ndiyo maneno ya mwisho ya Daudi
  rationale: Hutafsiri moja kwa moja utangulizi wa sehemu hii. Kiunganishi וְ hakihitaji neno la wakati kama “sasa”; mtiririko wa Kiswahili unatosha.
- source_word: נְאֻם
  choice: Neno
  rationale: Katika muktadha huu ni alama rasmi ya tamko zito, mara nyingi la kinabii. “Neno la...” ni la asili na lenye hadhi katika Kiswahili, huku tanbihi ikihifadhi “tamko” kama njia nyingine.
- source_word: בֶּן יִשַׁי
  choice: mwana wa Yese
  rationale: Ni muundo wa kawaida wa kutaja nasaba na umetafsiriwa moja kwa moja.
- source_word: הַגֶּבֶר
  choice: mtu
  rationale: Neno hili linaweza kudokeza nguvu au hadhi, lakini hapa “mtu” linaacha maelezo yanayofuata yaonyeshe heshima yake bila kuongeza maana isiyo wazi.
- source_word: הֻקַם עָל
  choice: aliyeinuliwa juu
  rationale: Huhifadhi hali ya kutendwa na taswira ya kuinuliwa, badala ya kuibadili kuwa sifa ya jumla tu kama “aliyetukuzwa.”
- source_word: מְשִׁיחַ
  choice: aliyetiwa mafuta
  rationale: Humtaja Daudi kihistoria kama mfalme aliyewekwa rasmi kwa kutiwa mafuta, huku ikihifadhi mwangwi wa kifalme na wa kimasihi bila kuifanya moja kwa moja kuwa jina la cheo “Masihi.”
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Mungu wa Yakobo
  rationale: Muundo wa umilikaji umetafsiriwa moja kwa moja.
- source_word: נְעִים זְמִרוֹת יִשְׂרָאֵל
  choice: mwimbaji mpendwa wa nyimbo za Israeli
  rationale: Kifungu hiki kina ugumu wa kisarufi na kinaweza kueleweka kwa zaidi ya njia moja. Tafsiri hii inatoa maana ya kawaida ya Daudi kama mwimbaji anayependwa, huku tanbihi ikihifadhi uwezekano mwingine unaohusisha uzuri wa nyimbo zenyewe.
theological_decisions:
- issue: Iwapo מְשִׁיחַ litafsiriwe hapa kama cheo “Masihi”
  choice: aliyetiwa mafuta
  alternative: Masihi wa Mungu wa Yakobo
  rationale: Mhusika wa moja kwa moja ni Daudi, aliyewekwa kuwa mfalme kwa kutiwa mafuta. Tafsiri ya kitenzi inaweka wazi maana ya kihistoria bila kufuta mwangwi wa kimasihi, ambao umeonyeshwa katika tanbihi.
- issue: Uhusiano wa kisarufi katika נְעִים זְמִרוֹת יִשְׂרָאֵל
  choice: mwimbaji mpendwa wa nyimbo za Israeli
  alternative: mwenye nyimbo tamu za Israeli
  rationale: Kiebrania kinaweza kuhusisha sifa נְעִים na mwimbaji au na nyimbo kwa namna isiyo rahisi kuakisiwa kikamilifu katika Kiswahili. Matini kuu inachagua usomaji unaoeleweka vizuri, na tanbihi inahifadhi mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Mistari imepangwa kishairi ili kuonyesha muundo wa tamko. “Yese,” “Yakobo,” na “Israeli” ni maumbo ya kawaida ya majina katika Biblia za Kiswahili.
