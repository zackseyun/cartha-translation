  yaml_path: translation/ot/2_samuel/023/002.yaml
  text: The Spirit of Yahweh spoke by me[a], and his word was on my tongue.
translation:
  language: sw
  text: Roho wa Yahweh alinena kupitia kwangu[a], na neno lake lilikuwa juu ya ulimi wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alinena ndani yangu.” Kihusishi cha Kiebrania kinaweza kumaanisha “ndani ya” au kuonyesha mtu anayetumiwa kama chombo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֥וּחַ יְהוָ֖ה
  choice: Roho wa Yahweh
  rationale: Katika muktadha huu wa usemi wa kinabii, רוּחַ ina maana ya Roho kama mtendaji wa ufunuo, si upepo au pumzi. Jina la agano יְהוָה limetafsiriwa Yahweh.
- source_word: דִּבֶּר
  choice: alinena
  rationale: Kitenzi דבר kinamaanisha kusema au kunena. “Alinena” kina hadhi ya kishairi inayofaa tamko hili bila kuwa cha kizamani kisichoeleweka.
- source_word: בִּי
  choice: kupitia kwangu
  rationale: Kihusishi בְּ hapa kinaonyesha chombo au mpitishaji wa usemi wa Mungu. “Kupitia kwangu” ni Kiswahili cha kawaida na hudhihirisha maana hiyo.
- source_word: וּמִלָּתוֹ
  choice: na neno lake
  rationale: מִלָּה ni neno au tamko; “neno” huhifadhi picha na uzito wa usemi wa Mungu kuliko tafsiri pana zaidi ya “ujumbe.”
- source_word: עַל לְשׁוֹנִי
  choice: lilikuwa ulimini mwangu
  rationale: Tafsiri hii huhifadhi picha ya Kiebrania ya neno kuwa juu ya ulimi, huku ikitumia usemi wa asili wa Kiswahili.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יְהוָה; “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Iwapo רוּחַ itafsiriwe kwa maana isiyo ya nafsi au kama Roho
  choice: Roho
  alternative: pumzi au upepo
  rationale: Katika muktadha wa tamko la Daudi lililovuviwa, רוּחַ ndiye wakala wa usemi wa Mungu. “Roho” hutoa maana ya wazi ya muktadha bila kuongeza dai zaidi ya maandishi.
- issue: Maana ya בִּי katika usemi wa Mungu
  choice: kupitia kwangu
  alternative: ndani yangu
  rationale: Usambamba na “neno lake lilikuwa ulimini mwangu” unaunga mkono maana ya Daudi kuwa mpitishaji wa usemi; hata hivyo, uwezekano wa tafsiri ya karibu zaidi na muundo “ndani yangu” umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Alinena” na “ulimini mwangu” huhifadhi mtindo wa kishairi wa kauli hiyo, huku “kupitia kwangu” ikieleza kwa kawaida maana ya chombo inayowezekana katika Kiebrania.
