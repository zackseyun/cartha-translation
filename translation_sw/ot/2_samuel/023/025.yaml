  rationale: Jina la mtu limetoholewa moja kwa moja kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: הַחֲרֹדִי
  choice: Mharodi
  rationale: Maelezo yale yale ya asili au uhusiano yametafsiriwa kwa namna ileile kwa ajili ya ulinganifu na mdundo wa orodha.
