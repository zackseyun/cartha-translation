  text: וַ/יֵּרְד֨וּ שלשים מֵ/הַ/שְּׁלֹשִׁ֣ים רֹ֗אשׁ וַ/יָּבֹ֤אוּ אֶל קָצִיר֙ אֶל דָּוִ֔ד אֶל מְעָרַ֖ת עֲדֻלָּ֑ם וְ/חַיַּ֣ת פְּלִשְׁתִּ֔ים חֹנָ֖ה בְּ/עֵ֥מֶק רְפָאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/013.yaml
  text: Then thirty of the thirty chief men went down and came at harvest time to David[a], to the cave of Adullam[c][b], while a band of the Philistines was camped in the Valley of Rephaim.
translation:
  language: sw
  text: Ndipo watu thelathini kutoka miongoni mwa wale thelathini wakuu[a] wakashuka, wakamjia Daudi wakati wa mavuno[b] kwenye pango la Adulamu, huku kikosi cha Wafilisti[c] kikiwa kimepiga kambi katika Bonde la Refaimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “thelathini kutoka kwa wale thelathini, mkuu.” Usemi huu ni mgumu; huenda ukamaanisha “thelathini miongoni mwa wakuu,” au ukarejelea hasa washiriki wa “Wale Thelathini,” kundi la mashujaa wa Daudi.
    reason: alternative_reading
  - marker: b
    text: Au, “wakati wa kuvuna.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania חַיַּת פְּלִשְׁתִּים, kihalisi “kiumbe hai/mnyama wa Wafilisti”; hapa limetumiwa kinahau kumaanisha kikosi au kundi la kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: wakashuka
  rationale: Kitenzi ירד kina maana ya kushuka; “wakashuka” huhifadhi mwelekeo na ni cha kawaida katika simulizi la Kiswahili.
- source_word: שְׁלֹשִׁים
  choice: watu thelathini
  rationale: Nambari imetafsiriwa moja kwa moja, huku “watu” ikiongezwa ili sentensi iwe ya asili kwa Kiswahili.
- source_word: מֵהַשְּׁלֹשִׁים רֹאשׁ
  choice: miongoni mwa wakuu hao thelathini
  rationale: Kiebrania ni kifupi na kigumu kisarufi. Tafsiri hii inaonyesha kwamba walihusishwa na kundi maarufu la mashujaa bila kuficha utata wa usemi, ambao umeelezwa katika tanbihi.
- source_word: וַיָּבֹאוּ
  choice: na kumjia
  rationale: Kitenzi cha kuja pamoja na אֶל דָּוִד kinaonyesha mwendo kuelekea kwa Daudi; “kumjia” ni usemi wa kawaida na mwafaka.
- source_word: אֶל קָצִיר
  choice: wakati wa mavuno
  rationale: Ingawa kihalisi ni “kwenda/kuelekea mavuno,” hapa inaeleweka kwa kawaida kama usemi wa wakati.
- source_word: אֶל דָּוִד
  choice: Daudi
  rationale: Lengo la mwendo limeunganishwa kiasili katika kitenzi “kumjia,” bila kuongeza wazo la kukutana ambalo halijasemwa wazi.
- source_word: אֶל מְעָרַת עֲדֻלָּם
  choice: kwenye pango la Adulamu
  rationale: Huhifadhi uhusiano wa muundo wa Kiebrania na kutumia jina la mahali lililotoholewa kwa Kiswahili.
- source_word: חַיַּת פְּלִשְׁתִּים
  choice: kikosi cha Wafilisti
  rationale: Ingawa חַיָּה kwa kawaida humaanisha kiumbe hai au mnyama, katika muktadha huu ni nahau ya kundi la kijeshi; “kikosi” huwasilisha maana hiyo wazi.
- source_word: חֹנָה
  choice: kikiwa kimepiga kambi
  rationale: Hali ya kushiriki ya חנה inaeleza tendo la nyuma lililoendelea; muundo huu ni wa asili katika Kiswahili.
- source_word: בְּעֵמֶק רְפָאִים
  choice: katika Bonde la Refaimu
  rationale: Jina la mahali limehifadhiwa kwa kutoholewa, na “Bonde” limetumiwa kama sehemu ya jina mahsusi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umewekwa wa asili, huku utata halisi wa מֵהַשְּׁלֹשִׁים רֹאשׁ ukihifadhiwa kwa tanbihi. Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayohusika.
