  text: אֵ֛לֶּה שְׁמ֥וֹת הַ/גִּבֹּרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑ד יֹשֵׁ֨ב בַּשֶּׁ֜בֶת תַּחְכְּמֹנִ֣י רֹ֣אשׁ הַ/שָּׁלִשִׁ֗י ה֚וּא עֲדִינ֣/וֹ ה/עצנ/ו עַל שְׁמֹנֶ֥ה מֵא֛וֹת חָלָ֖ל בְּ/פַ֥עַם אחד׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/008.yaml
  text: 'These are the names of the mighty men who belonged to David: Josheb-basshebeth[a], a Tahkemonite, chief of the Three. He was Adino the Eznite[c][b], who wielded his spear against eight hundred slain at one time.'
translation:
  language: sw
  text: 'Haya ndiyo majina ya mashujaa waliokuwa wa Daudi: Yosheb-Bashebeti[a], Mtahkemoni, mkuu wa wale Watatu[b]. Yeye alikuwa Adino, Mwezni[c], ambaye alitumia mkuki wake dhidi ya watu mia nane, akawaua katika tukio moja.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maandishi ya Kiebrania ya mstari huu ni magumu. “Yosheb-Bashebeti” linafuata Maandishi ya Kimasora; kifungu sambamba katika 1 Mambo ya Nyakati 11:11 kinasema “Yashobeamu, Mhakamoni.”
    reason: textual_variant
  - marker: b
    text: Au, “mkuu wa wale thelathini,” kulingana na baadhi ya ushahidi wa kale na wafasiri; Maandishi ya Kimasora yanasema “mkuu wa wale Watatu.”
    reason: alternative_reading
  - marker: c
    text: Kiebrania, “Adino, Mwezni,” ni kifungu kigumu sana. Wengi hukielewa badala yake kuwa na maana kama “alitumia mkuki wake” au “aliupunga mkuki wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּבֹּרִים
  choice: mashujaa
  rationale: Neno hili hapa linamaanisha wapiganaji hodari; “mashujaa” ni la kawaida, lenye heshima, na linafaa katika orodha ya wapiganaji wa Daudi.
- source_word: אֲשֶׁר לְדָוִד
  choice: waliokuwa wa Daudi
  rationale: Kiambishi לְ kinaonyesha uhusiano wao na Daudi. Usemi huu unaonyesha kuwa walikuwa katika kundi lake bila kudokeza kwamba walikuwa mali yake.
- source_word: יֹשֵׁב בַּשֶּׁבֶת
  choice: Yosheb-Bashebeti
  rationale: Ingawa maandishi ya Kiebrania ni magumu, hapa maneno haya yanafanya kazi kama jina. Umbo la Maandiko ya Kimasora limehifadhiwa kwa kutoholewa badala ya kusawazishwa kimya na 1 Mambo ya Nyakati 11:11.
- source_word: תַּחְכְּמֹנִי
  choice: Mtahkemoni
  rationale: Ni jina la ukoo au asili; limetoholewa kwa kufuata umbo la Kiebrania katika Samueli.
- source_word: רֹאשׁ הַשָּׁלִשִׁי
  choice: mkuu wa wale Watatu
  rationale: Hili linafuata usomaji wa Maandishi ya Kimasora na linaonyesha nafasi yake katika kikundi maalumu cha mashujaa. Usomaji mbadala wa “thelathini” umewekwa katika tanbihi.
- source_word: עֲדִינוֹ הָעֶצְנוֹ
  choice: Adino, Mwezni
  rationale: Kifungu hiki ni kigumu sana. Kukihifadhi kama jina na utambulisho kunawakilisha vokali za Maandishi ya Kimasora bila kuingiza marekebisho ya kukisia katika matini kuu.
- source_word: עַל שְׁמֹנֶה מֵאוֹת חָלָל
  choice: aliyewakabili watu mia nane waliouawa
  rationale: עַל inaonyesha hatua ya kivita dhidi yao, na חָלָל humaanisha waliouawa au waliojeruhiwa; katika muktadha huu matokeo ni kuuawa.
- source_word: בְּפַעַם אֶחָד
  choice: kwa wakati mmoja
  rationale: Usemi huu unaonyesha tukio au mara moja tu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mashujaa” limetumiwa badala ya usemi mzito zaidi kama “watu wenye nguvu.” Majina magumu ya Maandishi ya Kimasora yamehifadhiwa katika matini kuu, huku tofauti na tafsiri zinazowezekana zikielezwa wazi katika tanbihi.
