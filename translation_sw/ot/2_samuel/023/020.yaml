  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בְנָיָ֨הוּ בֶן יְהוֹיָדָ֧ע בֶּן אִֽישׁ חי רַב פְּעָלִ֖ים מִֽ/קַּבְצְאֵ֑ל ה֣וּא הִכָּ֗ה אֵ֣ת שְׁנֵ֤י אֲרִאֵל֙ מוֹאָ֔ב וְ֠/הוּא יָרַ֞ד וְ/הִכָּ֧ה אֶֽת ה/אריה בְּ/ת֥וֹךְ הַ/בֹּ֖אר בְּ/י֥וֹם הַ/שָּֽׁלֶג־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/020.yaml
  text: And Benaiah son of Jehoiada[a], son of a valiant man, great in deeds, from Kabzeel—he struck down the two sons of Ariel of Moab, and he went down and struck down the lion in the midst of the pit on a snowy day.
translation:
  language: sw
  text: Benaia mwana wa Yehoyada, mwana wa mtu shujaa, mwenye matendo makuu, kutoka Kabseeli—aliwapiga Arieli wawili wa Moabu.[a] Naye alishuka, akampiga simba katikati ya shimo siku ya theluji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maana ya neno la Kiebrania אֲרִאֵל (ari’el) hapa haijulikani kwa hakika. Huenda likamaanisha “mashujaa,” “watu walio kama simba,” au likawa cheo au jina; wengine hutafsiri “wana wawili wa Arieli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חי
  choice: mtu shujaa
  rationale: Katika muktadha huu, kirai hicho kinamsifu mtu mwenye nguvu na ushujaa, si kusema tu kwamba alikuwa hai.
- source_word: רַב פְּעָלִים
  choice: aliyefanya matendo makuu
  rationale: Huwasilisha wingi na uzito wa matendo yenye kusifiwa kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: מִקַּבְצְאֵל
  choice: kutoka Kabseeli
  rationale: Kihusishi מִן kinaonyesha mahali alikotoka.
- source_word: שְׁנֵי אֲרִאֵל מוֹאָב
  choice: Arieli wawili wa Moabu
  rationale: Maana ya אֲרִאֵל hapa haijulikani kwa hakika. Kuitoharisha kama Arieli katika matini kuu kunahifadhi utata bila kuamua kimabavu kwamba ni jina, cheo, mashujaa, au watu walio mfano wa simba.
- source_word: הִכָּה
  choice: aliwaua / akamuua
  rationale: Katika masimulizi haya ya mapambano, kitenzi kinamaanisha kuwapiga na kuwaangamiza; 'kuua' ni Kiswahili cha kawaida na wazi, ingawa ni dhahiri zaidi kuliko maana ya msingi ya 'kupiga'.
- source_word: יָרַד
  choice: alishuka
  rationale: Ni tafsiri ya kawaida ya mwendo kuelekea chini, hapa kuelekea ndani ya shimo.
- source_word: הָאֲרִי
  choice: simba
  rationale: Nomino hiyo humaanisha simba bila utata katika muktadha huu.
- source_word: בְּתוֹךְ הַבּוֹר
  choice: ndani ya shimo
  rationale: בּוֹר inaweza kuwa shimo au kisima; 'shimo' ni pana zaidi, na 'ndani ya' ni usemi wa asili wa Kiswahili hapa.
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: siku yenye theluji
  rationale: Hutoa kwa ufasaha mazingira ya siku iliyokuwa na theluji bila kuongeza maelezo yasiyomo.
theological_decisions:
- issue: Utambulisho wa אֲרִאֵל
  choice: Kuhifadhi neno kama “Arieli” katika matini kuu na kueleza utata wake katika tanbihi.
  alternative: “mashujaa wawili,” “watu wawili walio kama simba,” au “wana wawili wa Arieli.”
  rationale: Maandishi ya Kiebrania hayatoi msingi wa kutosha wa kuchagua kwa hakika mojawapo ya tafsiri hizi; kuhifadhi umbo la neno huepuka kuficha mvutano wa kimatini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametoharishwa kwa maumbo yanayosomeka kwa Kiswahili. Muundo wa mwanzo umeachwa ukiwa karibu na mfuatano wa Kiebrania, ambao unaweza kuhusisha sifa za ushujaa na matendo makuu na Benaia, Yehoyada, au ukoo wao.
