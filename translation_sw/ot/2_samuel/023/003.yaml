base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/003.yaml
  text: 'The God of Israel has spoken[a]; the Rock of Israel has said to me: One who rules over mankind justly, ruling in the fear of God[b],'
translation:
  language: sw
  text: 'Mungu wa Israeli amesema; Mwamba wa Israeli ameniambia: Atawalaye wanadamu[a] kwa haki, akitawala kwa kumcha Mungu[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia neno “adamu,” ambalo hapa linaweza kumaanisha wanadamu kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Mstari huu unaweza pia kueleweka kuwa na maana ya Kimasihi, yaani maelezo ya mtawala bora yanayotimizwa hatimaye katika Masihi.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר
  choice: amesema
  rationale: Kauli timilifu inaanzisha tamko la Mungu; wakati timilifu wa Kiswahili unaonyesha tendo lililotokea ambalo kauli yake bado ina uzito.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni muundo wa utegemezi unaomtaja Mungu wa Israeli; Kiswahili hahitaji kibainishi maalumu kama Kiingereza.
- source_word: לִי דִבֶּר
  choice: ameniambia
  rationale: Huunganisha kwa Kiswahili cha kawaida kitenzi cha kusema na yambwa ‘kwangu’; maana ya kawaida ni kwamba maneno hayo yalielekezwa kwa Daudi.
- source_word: צוּר יִשְׂרָאֵל
  choice: Mwamba wa Israeli
  rationale: Imehifadhi taswira na cheo cha Mungu cha ‘Mwamba,’ kinachoashiria uthabiti na ulinzi bila kukifafanua katika matini.
- source_word: מוֹשֵׁל
  choice: Atawalaye / akitawala
  rationale: Vivumishi-tendo viwili vya Kiebrania vimetafsiriwa kwa miundo ya vitenzi inayoonyesha kanuni kuhusu mtawala na kudumisha urudiaji wa kishairi.
- source_word: בָּאָדָם
  choice: wanadamu
  rationale: אָדָם hapa lina maana ya pamoja, yaani jamii ya binadamu walio chini ya utawala; ‘wanadamu’ ni Kiswahili cha kawaida na jumuishi.
- source_word: צַדִּיק
  choice: kwa haki
  rationale: Ingawa kimaumbo ni kivumishi, katika mstari huu mfupi kinafafanua namna ya kutawala; ‘kwa haki’ ni usemi wa asili unaodumisha wazo la uadilifu.
- source_word: מוֹשֵׁל יִרְאַת אֱלֹהִים
  choice: akitawala kwa kumcha Mungu
  rationale: Muundo huu unaonyesha kwamba utawala wa haki hufanywa katika hali ya uchaji na uwajibikaji mbele za Mungu, bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania ni la wingi kisarufi, hapa linamtaja Mungu mmoja wa Israeli, hivyo umoja unafaa katika Kiswahili.
theological_decisions:
- issue: Maana ya kifalme kwa ujumla au maana ya Kimasihi
  choice: Matini kuu imewasilishwa kama kanuni kuhusu mtawala bora mwenye haki.
  alternative: Mstari unaweza kueleweka pia kuwa na maana ya Kimasihi na kutimizwa hatimaye katika Masihi.
  rationale: Kiebrania hakimtaji Masihi moja kwa moja. Muktadha unaweza kuruhusu maana ya kifalme kwa ujumla na pia mwangwi wa Kimasihi; tanbihi inadumisha mvutano huo bila kuulazimisha katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Urudiaji wa kishairi wa ‘kutawala’ umehifadhiwa, na koma ya mwisho inaonyesha kwamba wazo linaendelea katika mstari unaofuata.
