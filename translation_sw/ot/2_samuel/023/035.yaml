lexical_decisions:
- source_word: חצרו
  choice: Hezro
  rationale: Jina la mtu katika orodha ya mashujaa wa Daudi; limetoholewa kwa kufuata matamshi ya Kiebrania. Umbo ‘Hazro’ pia linawezekana.
- source_word: הַכַּרְמְלִי
  choice: Mkarmeli
  rationale: Ni jina la kumtambulisha mtu aliyetoka Karmeli. Umbo hili ni fupi na linaendana na mtindo wa orodha.
- source_word: פַּעֲרַי
  choice: Paarai
  rationale: Jina la mtu limetoholewa, huku vokali zinazofuatana katika Kiebrania zikihifadhiwa kwa ‘aa’.
- source_word: הָאַרְבִּי
  choice: Mwarabu
  rationale: Ni jina la kumtambulisha mtu kwa mahali alikotoka, yaani Arabu; hapa halimaanishi kwa lazima utambulisho wa kikabila unaoitwa Mwarabu katika matumizi ya sasa.
