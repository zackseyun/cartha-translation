- source_word: צַלְמוֹן
  choice: Zalmoni
  rationale: Jina limenukuliwa kwa kufuata kwa karibu konsonanti za Kiebrania; umbo la mwisho -i linaendana na namna majina mengi ya kibiblia yanavyotamkwa kwa Kiswahili.
- source_word: הָאֲחֹחִי
  choice: Mwahohi
  rationale: Ni jina la ukoo lenye kibainishi katika Kiebrania. “Mwahohi” ni umbo fupi na la kawaida katika orodha, bila kulifafanua kwa ziada kuwa ‘mzao wa Ahoha.’
- source_word: מַהְרַי
  choice: Maharai
  rationale: Jina la mtu limenukuliwa kwa namna inayohifadhi kwa uwazi muundo wa Kiebrania.
- source_word: הַנְּטֹפָתִי
  choice: Mnetofathi
  rationale: Ni jina linaloonyesha asili au uhusiano na Netofa. Umbo la “Mnetofathi” huhifadhi mtindo mfupi wa orodha ya Kiebrania.
