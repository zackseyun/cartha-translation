  text: וַ/יֹּ֡אמֶר חָלִילָ/ה֩ לִּ֨/י יְהוָ֜ה מֵ/עֲשֹׂ֣תִ/י זֹ֗את הֲ/דַ֤ם הָֽ/אֲנָשִׁים֙ הַ/הֹלְכִ֣ים בְּ/נַפְשׁוֹתָ֔/ם וְ/לֹ֥א אָבָ֖ה לִ/שְׁתּוֹתָ֑/ם אֵ֣לֶּה עָשׂ֔וּ שְׁלֹ֖שֶׁת הַ/גִּבֹּרִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/017.yaml
  text: And he said[a], “Far be it from me, O Yahweh, that I should do this! Is it not the blood of the men who went at the risk of their lives?” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: sw
  text: Naye akasema, “Hasha kwangu, ee Yahweh, nifanye jambo hili! Je, hii si damu ya watu waliokwenda huku wakihatarisha maisha yao[a]?”[b] Basi hakutaka kuyanywa. Mambo haya ndiyo waliyofanya mashujaa hao watatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “pamoja na maisha yao”; maana yake ni kwamba walienda huku wakiwa katika hatari ya kufa.
    reason: lexical_alternative
  - marker: b
    text: Daudi anayachukulia maji hayo kana kwamba ni damu ya watu hao, kwa sababu waliyapata kwa kuhatarisha maisha yao.
    reason: metaphor_clarification
lexical_decisions:
- source_word: חָלִילָה לִּי יְהוָה
  choice: Hasha kwangu, ee Yahweh
  rationale: חָלִילָה לִי ni usemi mkali wa kukataa kwa kuchukizwa; “hasha kwangu” huhifadhi nguvu yake bila kuugeuza kuwa ombi la Mungu kuzuia jambo. “Ee Yahweh” huonyesha kwamba jina la Mungu linaelekezewa kama mwito.
- source_word: מֵעֲשֹׂתִי זֹאת
  choice: kufanya jambo hili
  rationale: Muundo wa מִן pamoja na kitenzi-jina baada ya חָלִילָה unaonyesha kukataa kabisa kutenda jambo linalotajwa.
- source_word: הֲדַם הָאֲנָשִׁים
  choice: Je, hii si damu ya watu
  rationale: Kiambishi הֲ kinaanzisha swali la balagha. “Hii” hurejelea maji yaliyokuwa mbele ya Daudi, ambayo anayachukulia kana kwamba ni damu ya watu hao.
- source_word: הַהֹלְכִים בְּנַפְשׁוֹתָם
  choice: waliokwenda kwa kuhatarisha maisha yao
  rationale: Kihalisi ni “waliokwenda pamoja na maisha yao”; katika muktadha huu msemo huo unaonyesha kwamba walijiweka katika hatari ya kufa.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: Basi hakutaka kuyanywa
  rationale: אָבָה huhusu kutaka au kukubali. Kiwakilishi katika לִשְׁתּוֹתָם kinarejelea maji, kwa hiyo Kiswahili hutumia upatanisho wa ngeli katika “kuyanywa.”
- source_word: אֵלֶּה עָשׂוּ שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: Mambo haya ndiyo waliyofanya wale mashujaa watatu
  rationale: “Mambo haya” huhifadhi muhtasari wenye demonstrativi אֵלֶּה, na “mashujaa” huwasilisha גִּבֹּרִים kwa lugha ya kawaida katika muktadha wa wapiganaji hodari.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu, יְהוָה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maji kuitwa damu ya watu hao
  choice: 'Swali la balagha: “Je, hii si damu ya watu...?”'
  alternative: 'Kauli ya moja kwa moja: “Hii ni damu ya watu...”'
  rationale: הֲ inaunga mkono swali, huku picha ya damu ikihifadhi msisitizo wa Daudi kwamba kunywa maji hayo kungekuwa kama kufaidika na maisha yaliyowekwa hatarini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Hasha kwangu” huhifadhi uzito wa usemi wa Kiebrania; “ee” inaonyesha mwito wa moja kwa moja bila kuongeza mafundisho ya dhehebu.
