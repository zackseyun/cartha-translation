  text: he is like the light of morning when the sun rises[a], a morning without clouds; from brightness, from rain[b], grass from the earth.
translation:
  language: sw
  text: Yeye ni kama nuru ya asubuhi jua linapochomoza[a], asubuhi isiyo na mawingu; kwa mwangaza baada ya mvua[b], nyasi mbichi huchipuka kutoka ardhini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata maneno ya Kiebrania kwa karibu zaidi, “nayo kama nuru ya asubuhi.” Mshororo wa Kiebrania umefupishwa na unaendeleza maelezo ya mtawala katika mstari uliotangulia.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kwa ufupi, “kutoka katika mwangaza, kutoka katika mvua, nyasi kutoka ardhini”—taswira ya kishairi ya uoto mpya unaochipuka baada ya mvua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְאוֹר
  choice: Yeye ni kama nuru
  rationale: Kiunganishi וּ pamoja na כְּ cha ulinganisho kinaendeleza taswira ya mtawala wa haki katika mstari uliotangulia. Kiswahili kinaweka wazi kiima na kitenzi vilivyoachwa katika ushairi wa Kiebrania.
- source_word: בֹּקֶר
  choice: asubuhi
  rationale: Neno la kawaida na la asili kwa wakati wa asubuhi; limetumiwa katika sehemu zote mbili ili kuhifadhi urudiaji wa kishairi.
- source_word: יִזְרַח שָׁמֶשׁ
  choice: jua linapochomoza
  rationale: Kitenzi זרח huonyesha jua likitokea au liking'aa; 'linapochomoza' ni usemi wa kawaida wa Kiswahili unaofaa kwa muktadha.
- source_word: בֹּקֶר לֹא עָבוֹת
  choice: asubuhi isiyo na mawingu
  rationale: Huhifadhi taswira ya Kiebrania kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: מִנֹּגַהּ
  choice: kwa mwangaza
  rationale: נֹגַהּ ni mwangaza au mng'ao. 'Kwa' huwasilisha uhusiano wa kisababishi au mazingira bila kudai kwamba muundo wa kishairi uliofinyangwa una maana moja tu.
- source_word: מִמָּטָר
  choice: baada ya mvua
  rationale: Ingawa מִן kimsingi ni 'kutoka/kwa sababu ya,' hapa taswira inaelekea kuwa ya uoto unaotokea katika mwangaza baada ya mvua. Tanbihi huhifadhi umbo halisi lenye utata.
- source_word: דֶּשֶׁא
  choice: majani mabichi
  rationale: Neno hili humaanisha uoto mchanga wa kijani au majani mapya; 'majani mabichi' ni la kawaida na lenye taswira wazi.
- source_word: מֵאָרֶץ
  choice: kutoka ardhini
  rationale: Hueleza udongo ambao uoto huchipuka kutoka humo na huhifadhi kihusishi cha chanzo.
theological_decisions:
- issue: Kiima kisichotajwa wazi katika ulinganisho
  choice: Kuweka wazi 'Yeye ni,' kukirejelea kiima cha mstari uliotangulia
  alternative: Kuacha kipande cha kishairi, 'Naye kama nuru ya asubuhi...'
  rationale: Kiebrania ni kifupi na hakina kitenzi hapa, lakini muktadha wa karibu unamtaja mtawala wa haki. Kuweka kiima wazi hufanya Kiswahili kisomeke bila kuongeza fundisho jipya.
- issue: Uhusiano wa vipashio katika kishororo cha mwisho
  choice: Kuwasilisha picha ya majani mabichi yanayochipuka katika mwangaza baada ya mvua
  alternative: 'Tafsiri ya karibu kabisa na umbo: ''kutoka katika mwangaza, kutoka katika mvua, majani kutoka ardhini'''
  rationale: Vihusishi vya Kiebrania vimebanwa kishairi na uhusiano wake si bayana kabisa. Matini kuu inawasilisha picha ya asili kwa Kiswahili kinachoeleweka, huku tanbihi ikihifadhi muundo na utata wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaendelea kuwa wa kishairi, lakini kiima na tendo la kuchipuka vimewekwa wazi ili sentensi ieleweke kwa msomaji wa kawaida. Tanbihi zinahifadhi ufupi na utata halisi wa Kiebrania.
