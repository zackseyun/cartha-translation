  text: Wakati huo Daudi alikuwa katika ngome, na wakati huo kikosi cha Wafilisti kilikuwa Bethlehemu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: wakati huo
  rationale: Kielezi hiki huweka matukio katika wakati unaozungumziwa. Kimerudiwa mara mbili katika Kiebrania; kimetafsiriwa mara moja katika sentensi kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi taarifa ya marudio hayo.
- source_word: מְצוּדָה
  choice: ngome
  rationale: Neno hili linaonyesha mahali salama pa kujilinda; “ngome” huhifadhi maana ya kijeshi na ya mahali bila kubainisha aina ya jengo isiyotajwa.
- source_word: מַצַּב
  choice: kikosi
  rationale: Katika muktadha huu wa kijeshi, neno linaweza kutaja kikosi kilichowekwa mahali fulani au kituo chake. “Kikosi” ni cha kawaida na kinafaa kwa uwepo wa kijeshi wa Wafilisti huko Bethlehemu.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la watu hawa katika Kiswahili.
- source_word: בֵּית לָחֶם
  choice: Bethlehemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali hapa katika Kiswahili.
- source_word: וְ
  choice: na
  rationale: Kiunganishi hiki kinaunganisha vishazi viwili kwa uratibu wa moja kwa moja, kama ilivyo katika Kiebrania.
