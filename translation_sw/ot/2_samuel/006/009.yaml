  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּרָ֥א דָוִ֛ד אֶת יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּ֕אמֶר אֵ֛יךְ יָב֥וֹא אֵלַ֖/י אֲר֥וֹן יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/009.yaml
  text: And David feared Yahweh that day[a], and he said, “How can the ark of Yahweh come to me?”
translation:
  language: sw
  text: Daudi akamwogopa Yahwe siku hiyo, akasema, “Sanduku la Yahwe litanijiaje?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sanduku la Yahwe litakujaje kwangu?” Maneno haya yanaweza kuonyesha kutokuwa na uhakika kuhusu namna ya kulileta Sanduku, au hofu na hisia ya kutostahili baada ya kifo cha Uza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: akamwogopa
  rationale: Katika muktadha wa kifo cha Uza, kitenzi ירא kinaonyesha hofu halisi ya Daudi mbele za Yahwe; “akamwogopa” pia huhifadhi muundo wa kitenzi chenye mtendwa wa moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa na cheo kama “BWANA,” ili kuhifadhi jina la kibinafsi lililo katika Kiebrania.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili unaohifadhi rejeo mahsusi la wakati.
- source_word: אֵיךְ יָבֹא
  choice: litanijiaje
  rationale: Muundo huu wa Kiswahili unaunganisha “jinsi gani” na kitenzi cha kuja, na unaweza kubeba utata wa swali kuhusu uwezekano au namna ya tukio bila kulazimisha tafsiri moja.
- source_word: אֵלַי
  choice: -nijia-
  rationale: Kiambishi cha kumwelekea msemaji katika “litanijiaje” kinawasilisha maana ya “kwangu/mimi” kwa njia ya asili bila kuongeza wazo la nyumba au mahali pa Daudi.
- source_word: אֲרוֹן יְהוָה
  choice: Sanduku la Yahwe
  rationale: Hutafsiri kwa uwazi muundo wa umilikaji na kutumia neno la kawaida la kibiblia “Sanduku” kwa chombo hiki kitakatifu.
theological_decisions:
- issue: Namna ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Kiebrania kinatumia moja kwa moja jina la Mungu יהוה; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya swali la Daudi baada ya kifo cha Uza
  choice: “Sanduku la Yahwe litanijiaje?”
  alternative: “Sanduku la Yahwe linawezaje kuja kwangu?”
  rationale: Kiebrania kinaweza kuonyesha kutokuwa na uhakika kuhusu namna ya kulileta Sanduku au hofu na hisia ya kutostahili. Muundo uliochaguliwa hauamui kimya kimya kati ya maana hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na hadhi inayofaa maandiko. “Akamwogopa” ni ya moja kwa moja na yenye nguvu katika muktadha; “litanijiaje” ni fupi, ya asili, na huhifadhi utata wa Kiebrania.
