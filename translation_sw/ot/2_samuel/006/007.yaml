  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/עֻזָּ֔ה וַ/יַּכֵּ֥/הוּ שָׁ֛ם הָ/אֱלֹהִ֖ים עַל הַ/שַּׁ֑ל וַ/יָּ֣מָת שָׁ֔ם עִ֖ם אֲר֥וֹן הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/007.yaml
  text: And the anger of Yahweh burned against Uzzah[a], and God struck him there for the error, and he died there beside the ark of God.
translation:
  language: sw
  text: Hasira ya Yahwe ikawaka dhidi ya Uza, naye Mungu akampiga pale kwa sababu ya kosa hilo[a]. Akafa pale kando ya sanduku la Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ya tendo hilo la kukosa heshima,” “kwa sababu ya tendo lake la haraka bila kufikiri,” au labda, “kwa sababu aliunyosha mkono wake.” Kirai cha Kiebrania ni kigumu na kimeeleweka kwa njia mbalimbali.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: Hasira ... ikawaka
  rationale: Nahau ya Kiebrania ina picha ya hasira inayowaka. Tafsiri hii inaihifadhi kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetafsiriwa kwa kulitamka kama jina binafsi, badala ya kulibadilisha kuwa cheo.
- source_word: בְּעֻזָּה
  choice: dhidi ya Uza
  rationale: Kihusishi hiki pamoja na nahau ya kuwaka kwa hasira humtaja mtu ambaye hasira inamwelekea.
- source_word: וַיַּכֵּהוּ
  choice: akampiga
  rationale: Kitenzi נכה humaanisha kupiga. Tafsiri haiongezi matokeo ya kifo mapema, kwa kuwa kishazi kinachofuata kinayasema wazi.
- source_word: שָׁם
  choice: pale
  rationale: Neno hili limerudiwa katika chanzo; kurudia ‘pale’ kunadumisha msisitizo wa mahali ambapo hukumu na kifo vilitokea.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Chanzo kinabadilika kutoka jina Yahwe hadi cheo ‘Mungu’; tofauti hiyo imehifadhiwa.
- source_word: עַל הַשַּׁל
  choice: kwa sababu ya kosa hilo
  rationale: Neno שַׁל ni adimu na maana yake si hakika. ‘Kosa hilo’ linaonyesha kuwa pigo lilihusiana na tendo lisilofaa bila kufafanua kupita kiasi aina kamili ya kosa.
- source_word: וַיָּמָת
  choice: Akafa
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya mwendelezo wa simulizi.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: kando ya sanduku la Mungu
  rationale: Ingawa עִם kwa kawaida ni ‘pamoja na,’ hapa linaonyesha mahali; ‘kando ya’ ni Kiswahili cha asili na hakidokezi kuwa Uza aliandamana na sanduku.
theological_decisions:
- issue: Sababu ya kifo cha Uza katika kirai kigumu עַל הַשַּׁל
  choice: kwa sababu ya kosa hilo
  alternative: kwa sababu ya tendo la kukosa heshima; kwa sababu ya tendo lake la haraka bila kufikiri; kwa sababu aliunyosha mkono wake
  rationale: Kirai cha Kiebrania ni adimu na kina utata wa kweli. Matini kuu inaonyesha kosa bila kuamua kwa uhakika kama neno hilo linamaanisha kutoheshimu, kufanya jambo kwa haraka, au kuunyosha mkono; uwezekano huo unawekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa simulizi la kawaida; urudiaji wa ‘pale’ umehifadhiwa kwa sababu unatokana na msisitizo wa matini ya Kiebrania.
