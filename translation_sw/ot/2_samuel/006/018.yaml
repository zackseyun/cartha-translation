base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/018.yaml
  text: When David had finished offering the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh of hosts.
translation:
  language: sw
  text: Daudi alipomaliza kutoa sadaka ya kuteketezwa na sadaka za amani, aliwabariki watu kwa jina la Yahwe wa majeshi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Yahwe wa majeshi”; pia, “Yahwe wa majeshi ya vita.”'
    reason: Cheo צְבָאוֹת kina maana ya “majeshi” na kinaweza pia kutafsiriwa “majeshi ya vita”; hakitaji majeshi ya mbinguni hasa.
lexical_decisions:
- source_word: וַיְכַל
  choice: alipomaliza
  rationale: Kitenzi kinaonyesha kukamilika kwa tendo lililotangulia kabla ya Daudi kuwabariki watu; muundo huu ni wa kawaida na wa asili katika simulizi la Kiswahili.
- source_word: מֵהַעֲלוֹת
  choice: kutoa
  rationale: Katika muktadha wa dhabihu, kitenzi hiki kinamaanisha kutoa au kupandisha dhabihu madhabahuni; “kutoa” ni wazi na cha kawaida kwa Kiswahili.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ni neno la kawaida la dhabihu inayoteketezwa; umoja wa Kiebrania umehifadhiwa.
- source_word: וְהַשְּׁלָמִים
  choice: na sadaka za amani
  rationale: Neno linataja aina ya dhabihu zinazohusishwa na amani, ustawi, na ushirika. “Sadaka za amani” huhifadhi maana ya msingi na hutofautisha wingi wake na sadaka iliyotajwa kabla yake.
- source_word: וַיְבָרֶךְ אֶת־הָעָם
  choice: aliwabariki watu
  rationale: Hii inawakilisha moja kwa moja tendo la kutamka baraka juu ya watu waliokusanyika bila kuongeza maelezo yasiyomo katika chanzo.
- source_word: בְּשֵׁם
  choice: kwa jina la
  rationale: Kirai hiki huonyesha jina au mamlaka inayotegemewa katika kutoa baraka; “kwa jina la” ni Kiswahili cha kawaida katika muktadha huu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa uhamishaji wa sauti badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: צְבָאוֹת
  choice: wa majeshi
  rationale: Neno hili kihalisi linahusu majeshi au makundi yaliyopangwa. “Wa majeshi” ni fupi, pana, na linafaa katika cheo cha Mungu bila kuamua kimya-kimya kama yanakusudiwa majeshi ya duniani au ya mbinguni.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina la agano lenye herufi nne moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Upeo wa maana ya צְבָאוֹת katika cheo cha Mungu
  choice: wa majeshi
  alternative: wa majeshi ya mbinguni
  rationale: Kiebrania hakitaji “ya mbinguni” katika mstari huu. Tafsiri pana “wa majeshi” huhifadhi uwezekano wa kurejelea majeshi ya mbinguni, majeshi ya Israeli, au mamlaka yote yaliyo chini ya Mungu bila kufunga maana kwa chaguo moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi unafuata mfuatano wa simulizi la Kiebrania huku ukibaki wa asili katika Kiswahili. Alama ya tanbihi imewekwa baada ya cheo cha Mungu, ambacho ndicho tanbihi inachofafanua.
