  text: וַ/יֹּ֣אמֶר דָּוִד֮ אֶל מִיכַל֒ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֨ר בָּֽחַר בִּ֤/י מֵֽ/אָבִי/ךְ֙ וּ/מִ/כָּל בֵּית֔/וֹ לְ/צַוֺּ֨ת אֹתִ֥/י נָגִ֛יד עַל עַ֥ם יְהוָ֖ה עַל יִשְׂרָאֵ֑ל וְ/שִׂחַקְתִּ֖י לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/021.yaml
  text: David said to Michal[a], “It was before Yahweh, who chose me above your father and above all his house, to appoint me ruler over the people of Yahweh, over Israel—and I celebrated before Yahweh.”
translation:
  language: sw
  text: Daudi akamwambia Mikali, “Nilifanya hivyo mbele ya Yahwe, aliyenichagua badala ya baba yako na nyumba yake yote, ili aniweke kuwa mtawala juu ya watu wa Yahwe, juu ya Israeli; nami nilisherehekea[a] mbele ya Yahwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilicheza.” Kitenzi cha Kiebrania hapa ni kipana kuliko neno linalomaanisha kucheza dansi pekee; kinaweza kumaanisha tendo la furaha, mchezo, au sherehe.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huwasilisha maana ya kutenda katika uwepo wa Yahwe na kuhifadhi msisitizo unaorudiwa katika mstari.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uhamishaji wa jina la Mungu kwa Kiswahili badala ya kulibadilisha kuwa cheo.
- source_word: אֲשֶׁר בָּחַר בִּי
  choice: aliyenichagua
  rationale: Kitenzi בחר humaanisha kuchagua; tafsiri hii ni ya kawaida na haiongezi dhana nyingine ya kitheolojia.
- source_word: מֵאָבִיךְ וּמִכָּל בֵּיתוֹ
  choice: badala ya baba yako na nyumba yake yote
  rationale: Baada ya kitenzi ‘chagua,’ מן huonyesha kwamba Daudi alichaguliwa badala ya Sauli na nyumba yake. ‘Nyumba’ huhifadhi maana ya kifamilia na ya nasaba ya kifalme.
- source_word: לְצַוֹּת אֹתִי
  choice: ili aniweke
  rationale: Katika muundo huu neno hilo lina maana ya kumweka au kumteua mtu katika wadhifa.
- source_word: נָגִיד
  choice: mtawala
  rationale: Neno hili humaanisha mtu aliyewekwa katika mamlaka ya kuongoza; ‘mtawala’ huonyesha mamlaka hiyo wazi.
- source_word: עַל עַם יְהוָה עַל יִשְׂרָאֵל
  choice: juu ya watu wa Yahwe, juu ya Israeli
  rationale: Urudiaji wa עַל umehifadhiwa ili kudumisha msisitizo na maelezo yanayotambulisha watu hao kuwa Israeli.
- source_word: וְשִׂחַקְתִּי
  choice: nami nilisherehekea
  rationale: שׂחק linaweza kueleza tendo la furaha, mchezo, au sherehe, na si lazima dansi pekee. ‘Nilisherehekea’ linafaa katika muktadha wa furaha mbele ya sanduku bila kuifanya maana kuwa finyu kupita kiasi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Jina binafsi limehifadhiwa kwa uhamishaji badala ya kubadilishwa kuwa cheo.
- issue: Ikiwa tendo la Daudi lifasiriwe mahsusi kuwa kucheza dansi
  choice: nilisherehekea
  alternative: nilicheza
  rationale: שׂחק ni pana kuliko vitenzi vinavyotaja kucheza dansi kwa wazi katika muktadha wa karibu. Tafsiri kuu inahifadhi upana huo, huku uwezekano wa ‘nilicheza’ ukitajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Nyumba yake yote’ imehifadhiwa kwa maana ya familia na nasaba; muundo wa sentensi umefanywa wa kawaida bila kuondoa urudiaji wa ‘juu ya’ katika chanzo.
