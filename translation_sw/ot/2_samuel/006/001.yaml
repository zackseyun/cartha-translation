lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  choice: tena
  rationale: Muundo wa יסף pamoja na עוד unaonyesha kurudiwa kwa tendo; “tena” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: אֶת כָּל
  choice: wote
  rationale: אֶת ni kiashiria cha yambwa mahsusi kisichohitaji kutafsiriwa kando, huku כָּל ikionyesha ujumla, unaowasilishwa kwa “wote.”
- source_word: בָּחוּר
  choice: watu wateule
  rationale: Neno hili linaweza kumaanisha vijana au watu waliochaguliwa walio bora. Katika muktadha wa kukusanya kundi kubwa, maana ya watu walioteuliwa inafaa, huku tanbihi ikihifadhi uwezekano wa maana nyingine.
- source_word: בְּיִשְׂרָאֵל
  choice: wa Israeli
  rationale: Ingawa kihusishi ב kinaweza kumaanisha “katika,” hapa muundo unaeleweka kwa kawaida kama watu waliotoka au walio miongoni mwa Israeli; “wa Israeli” ni fasaha na huhifadhi uhusiano huo.
- source_word: שְׁלֹשִׁים אָלֶף
  choice: elfu thelathini
  rationale: Hii ndiyo namna ya kawaida ya kutaja idadi hiyo katika Kiswahili Sanifu.
