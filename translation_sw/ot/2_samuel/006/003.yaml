  text: וַ/יַּרְכִּ֜בוּ אֶת אֲר֤וֹן הָֽ/אֱלֹהִים֙ אֶל עֲגָלָ֣ה חֲדָשָׁ֔ה וַ/יִּשָּׂאֻ֔/הוּ מִ/בֵּ֥ית אֲבִינָדָ֖ב אֲשֶׁ֣ר בַּ/גִּבְעָ֑ה וְ/עֻזָּ֣א וְ/אַחְי֗וֹ בְּנֵי֙ אֲבִ֣ינָדָ֔ב נֹהֲגִ֖ים אֶת הָ/עֲגָלָ֥ה חֲדָשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/003.yaml
  text: They set the ark of God on a new cart and brought it from the house of Abinadab[a], which was on the hill; and Uzzah and Ahio, the sons of Abinadab, were driving the new cart.
translation:
  language: sw
  text: Wakaiweka sanduku la Mungu juu ya mkokoteni mpya, wakalichukua kutoka katika nyumba ya Abinadabu[a], iliyokuwa juu ya kilima. Uza na Ahio, wana wa Abinadabu, walikuwa wakiendesha ule mkokoteni mpya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliyokuwa huko Gibea,” ikiwa neno hilo linachukuliwa kuwa jina la mahali badala ya maelezo ya kilima.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: wakaiweka ... juu ya
  rationale: Kauli ya kusababisha ya רכב inaonyesha kukifanya kitu kipande au kukiweka juu ya chombo; kwa sanduku na mkokoteni, Kiswahili cha kawaida ni “kuliweka juu ya.”
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: sanduku la Mungu
  rationale: “Sanduku” ndilo neno la kawaida la Kiswahili kwa אֲרוֹן katika muktadha wa sanduku takatifu; kirai “la Mungu” kinahifadhi uhusiano wa Kiebrania.
- source_word: אֶל עֲגָלָה חֲדָשָׁה
  choice: juu ya mkokoteni mpya
  rationale: אֶל hapa inaeleza kuwekwa juu ya chombo, na עֲגָלָה ni mkokoteni wa kubebea mizigo.
- source_word: וַיִּשָּׂאֻהוּ
  choice: wakalitoa
  rationale: נשא inaweza kumaanisha kuinua, kubeba, au kuondoa/kutoa. Kwa kuwa sanduku tayari limewekwa kwenye mkokoteni, “wakalitoa” huonyesha kuliondoa nyumbani bila kudokeza kuwa walilibeba kwa mikono.
- source_word: מִבֵּית אֲבִינָדָב
  choice: katika nyumba ya Abinadabu
  rationale: מִן huonyesha mahali lilipotolewa sanduku; “katika nyumba ya Abinadabu” ni muundo wa asili na wazi katika Kiswahili.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: iliyokuwa juu ya kilima
  rationale: Kwa kuwepo kwa kibainishi katika בַּגִּבְעָה, maana ya kawaida ni maelezo ya mahali, “juu ya kilima”; uwezekano wa jina la mahali umehifadhiwa katika tanbihi.
- source_word: וְעֻזָּא וְאַחְיוֹ
  choice: Uza na Ahio
  rationale: Majina ya watu yametoholewa kwa tahajia inayoeleweka kwa wasomaji wa Kiswahili.
- source_word: בְּנֵי אֲבִינָדָב
  choice: wana wa Abinadabu
  rationale: בְּנֵי hapa kwa kawaida humaanisha wana halisi, si wazao kwa maana pana.
- source_word: נֹהֲגִים
  choice: walikuwa wakiendesha
  rationale: Partisipio la נהג huonyesha tendo linaloendelea la kuongoza au kuendesha; kwa kuwa yambwa ni mkokoteni, “wakiendesha” linafaa zaidi.
- source_word: הָעֲגָלָה חֲדָשָׁה
  choice: ule mkokoteni mpya
  rationale: Kurudiwa kwa kirai kumehifadhiwa kwa msisitizo wa simulizi; “ule” hurejelea mkokoteni uliotajwa tayari.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa heshima, na wa sasa. Alama ya tanbihi [a] imewekwa baada ya “Abinadabu” ili kuhifadhi uwezekano wa kusoma גִּבְעָה kama jina la mahali.
