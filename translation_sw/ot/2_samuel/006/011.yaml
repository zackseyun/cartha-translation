base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/011.yaml
  text: And the ark of Yahweh remained in the house of Obed-edom the Gittite for three months[b][a], and Yahweh blessed Obed-edom and all his household.
translation:
  language: sw
  text: Sanduku la Yahweh lilibaki katika nyumba ya Obed-Edomu, Mgiti,[a] kwa miezi mitatu. Yahweh akambariki Obed-Edomu na nyumba yake yote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mtu aliyehusishwa na mji wa Gathi.
    reason: cultural_note
  - marker: b
    text: Au “watu wote wa nyumbani mwake.” Neno la Kiebrania linaweza kumaanisha kaya au watu wa nyumbani kwa upana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: likakaa
  rationale: Kitenzi יָשַׁב kinaweza kumaanisha kukaa, kuishi, au kubaki. Kwa kuwa sanduku ndilo kiima na muda umetajwa, “likakaa” ni usemi wa kawaida wa Kiswahili unaoonyesha kuendelea kuwapo mahali hapo.
- source_word: אֲרוֹן יְהוָה
  choice: Sanduku la Yahweh
  rationale: Muundo wa umilikaji umetafsiriwa moja kwa moja. “Sanduku” ni istilahi iliyozoeleka kwa אֲרוֹן katika muktadha wa sanduku takatifu, na jina la Mungu limeandikwa Yahweh.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: katika nyumba ya Obed-Edomu
  rationale: Hapa בֵּית inaelekeza hasa mahali halisi ambapo sanduku lilikuwapo, kwa hiyo “nyumba” inafaa kuliko “jamaa” au “watu wa nyumbani.”
- source_word: עֹבֵד אֱדֹם
  choice: Obed-Edomu
  rationale: Jina la mtu limetoholewa kwa namna inayoeleweka na iliyozoeleka katika Kiswahili.
- source_word: הַגִּתִּי
  choice: Mgiti
  rationale: Kivumishi cha asili au uhusiano na Gathi kimehifadhiwa kama jina la watu, badala ya kukifafanua moja kwa moja ndani ya mstari.
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: kwa miezi mitatu
  rationale: Kihusishi “kwa” huwasilisha muda kwa Kiswahili cha kawaida bila kuongeza maana mpya.
- source_word: וַיְבָרֶךְ
  choice: akambariki
  rationale: “Kubariki” ndilo neno la kawaida na sahihi kwa בָּרַךְ, na linahifadhi maana ya kitheolojia ya chanzo.
- source_word: וְאֶת כָּל בֵּיתוֹ
  choice: pamoja na watu wote wa nyumbani mwake
  rationale: Katika sehemu hii בֵּיתוֹ inaweza kumaanisha familia na wote wa mazingira yake ya nyumbani. Tafsiri hii ni ya asili kwa Kiswahili, huku tanbihi ikihifadhi uwezekano mpana wa “nyumba yake yote.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina maalumu la Mungu, YHWH. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. “Likakaa” na “watu wote wa nyumbani mwake” vinaepuka tafsiri ngumu ya neno kwa neno, huku tanbihi zikihifadhi maana mbadala za chanzo.
