base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/019.yaml
  text: He distributed to all the people[a], to the whole multitude of Israel, from man to woman, to each person one loaf of bread, one portion of meat, and one raisin cake. Then all the people went away[b], each to his house.
translation:
  language: sw
  text: Akawagawia watu wote, yaani umati wote wa Israeli, kuanzia wanaume hadi wanawake,[a] kila mtu mkate mmoja, sehemu moja ya nyama[b] na keki moja ya zabibu kavu. Kisha watu wote wakaondoka, kila mmoja akaenda nyumbani kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “kutoka mwanamume hadi mwanamke,” nahau inayomaanisha watu wote waliokusanyika, wa kiume na wa kike.
    reason: cultural_note
  - marker: b
    text: Au “kipimo kimoja” au “sehemu moja.” Neno la Kiebrania אֶשְׁפָּר ni adimu. Wengi hulielewa hapa kuwa sehemu ya nyama, hasa kwa kuzingatia simulizi sambamba katika 1 Mambo ya Nyakati 16:3.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: Akawagawia
  rationale: Kauli ya Kiebrania hapa inaeleza kugawa vitu kwa watu wengi. “Akawagawia” ni ya kawaida katika Kiswahili na huonyesha wazi kwamba kila mtu alipokea sehemu.
- source_word: לְכָל הָעָם / לְכָל הֲמוֹן יִשְׂרָאֵל
  choice: watu wote, yaani umati wote wa Israeli
  rationale: Kauli zote mbili zimehifadhiwa ili kuendeleza msisitizo wa Kiebrania; “yaani” huonyesha kwa Kiswahili cha kawaida kwamba kauli ya pili inafafanua ya kwanza.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: wanaume kwa wanawake
  rationale: Hii inawasilisha wigo wa nahau ya Kiebrania—watu wote waliokusanyika, wa kiume na wa kike—bila kudokeza kwamba wanaume peke yao walihusika.
- source_word: לְאִישׁ
  choice: kila mtu
  rationale: Ingawa nomino ya Kiebrania ina umbo la kiume la umoja, muktadha umetaja wanaume na wanawake. “Kila mtu” huwasilisha maana ya mgawo kwa kila mmoja.
- source_word: חַלַּת לֶחֶם אַחַת
  choice: mkate mmoja
  rationale: חַלָּה hapa ni mkate au donge la mkate. “Mkate mmoja” ni wazi na ya asili kwa msomaji wa Kiswahili.
- source_word: אֶשְׁפָּר אֶחָד
  choice: sehemu moja ya nyama
  rationale: אֶשְׁפָּר ni neno adimu lenye maana inayobishaniwa. Muktadha na simulizi sambamba la 1 Mambo ya Nyakati 16:3 vinaunga mkono kuelewa kuwa ni sehemu ya chakula, yaelekea nyama; tanbihi huhifadhi kutokuwa na uhakika.
- source_word: אֲשִׁישָׁה אֶחָת
  choice: keki moja ya zabibu kavu
  rationale: Neno hili kwa kawaida hueleweka kuwa keki iliyoshindiliwa, mara nyingi ya zabibu kavu. Tafsiri hii ni dhahiri na inaeleweka katika Kiswahili cha sasa.
- source_word: וַיֵּלֶךְ כָּל הָעָם אִישׁ לְבֵיתוֹ
  choice: Kisha watu wote wakaondoka, kila mmoja akaenda nyumbani kwake
  rationale: Kauli hii inaeleza watu kutawanyika baada ya kugawiwa chakula. Muundo wa Kiswahili ni wa asili huku ukihifadhi wazo la kila mmoja kwenda nyumbani kwake.
