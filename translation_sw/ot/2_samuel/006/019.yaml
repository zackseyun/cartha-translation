translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Marudio yenye msisitizo katika Kiebrania yamehifadhiwa kwa muundo wa ufafanuzi. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika na kupangwa kwa mfuatano wa [a], [b].
