  text: וַ/יָּ֣קָם וַ/יֵּ֣לֶךְ דָּוִ֗ד וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ מִֽ/בַּעֲלֵ֖י יְהוּדָ֑ה לְ/הַעֲל֣וֹת מִ/שָּׁ֗ם אֵ֚ת אֲר֣וֹן הָ/אֱלֹהִ֔ים אֲשֶׁר נִקְרָ֣א שֵׁ֗ם שֵׁ֣ם יְהוָ֧ה צְבָא֛וֹת יֹשֵׁ֥ב הַ/כְּרֻבִ֖ים עָלָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/002.yaml
  text: David arose and went[a], with all the people who were with him, from Baale-judah to bring up from there the ark of God, which is called by the Name, the name of Yahweh of Armies[d][c][b], who is enthroned above the cherubim.
translation:
  language: sw
  text: Daudi akainuka, akaenda pamoja na watu wote waliokuwa pamoja naye kutoka Baale-Yuda[a], ili kulipandisha Sanduku la Mungu kutoka huko, ambalo juu yake limetajwa Jina, yaani jina la Yahwe wa Majeshi[b][c], aketiye juu ya makerubi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka Baala ya Yuda.” Umbo la Kiebrania hapa si la kawaida na huenda linarejelea mahali palipohusishwa na Kiriath-Yearimu.
    reason: alternative_reading
  - marker: b
    text: Au “ambalo juu yake limeitwa jina, jina la Yahwe wa Majeshi.” Kauli ya Kiebrania kuhusu Jina imebanwa.
    reason: lexical_alternative
  - marker: c
    text: 'Tafsiri ya kimapokeo: “BWANA wa majeshi.”'
    reason: lexical_alternative
  - marker: d
    text: Au “anayekaa kati ya makerubi.” Kitenzi hiki kinaweza pia kudokeza kuketi kitini cha ufalme juu ya makerubi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: akainuka, akaenda
  rationale: Vitenzi vyote viwili vimehifadhiwa ili kufuata mfululizo wa simulizi ya Kiebrania bila kuuvuruga kwa Kiswahili.
- source_word: וְכָל־הָעָם אֲשֶׁר אִתּוֹ
  choice: pamoja na watu wote waliokuwa pamoja naye
  rationale: Kauli hii inaonyesha wazi kwamba watu wote waliokuwa na Daudi waliandamana naye.
- source_word: מִבַּעֲלֵי יְהוּדָה
  choice: kutoka Baale-Yuda
  rationale: Katika muktadha huu umbo hilo linaeleweka vyema kama jina la mahali, ingawa umbo lake si la kawaida; hali hiyo imeelezwa katika tanbihi.
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: ili kulipandisha kutoka huko
  rationale: Hiphil ya עלה ina maana ya kusababisha kitu kipande au kukipandisha; usemi huu pia unafaa kwa safari ya Sanduku kwenda Yerusalemu.
- source_word: אֵת אֲרוֹן הָאֱלֹהִים
  choice: Sanduku la Mungu
  rationale: Hili ndilo jina la kawaida na linaloeleweka la Sanduku katika simulizi hii.
- source_word: אֲשֶׁר נִקְרָא שֵׁם שֵׁם
  choice: ambalo juu yake linatajwa Jina—jina
  rationale: Tafsiri hii huhifadhi uzito na msongamano wa kauli ya Kiebrania kuhusu Jina, huku ikifanya uhusiano wake na Sanduku ueleweke kwa Kiswahili.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahwe wa Majeshi
  rationale: Jina la agano יְהוָה limetolewa kama Yahwe, na צְבָאוֹת limetafsiriwa kwa neno la sasa na linaloeleweka, “Majeshi.”
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: anayeketi juu ya makerubi
  rationale: Kitenzi יֹשֵׁב kinaweza kudokeza kuketi kifalme au kukaa; “anayeketi” huhifadhi maana ya msingi bila kuondoa kabisa mvutano huo, na “juu ya makerubi” huafiki taswira ya Sanduku.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya צְבָאוֹת katika cheo cha Mungu
  choice: wa Majeshi
  alternative: wa majeshi ya mbinguni au wa majeshi yote
  rationale: “Majeshi” huhifadhi upana wa cheo bila kuamua kimyakimya kama yanakusudiwa majeshi ya mbinguni pekee au majeshi kwa maana pana.
- issue: Kauli iliyobanwa kuhusu Jina na Sanduku
  choice: juu yake linatajwa Jina—jina la Yahwe
  alternative: linaloitwa kwa Jina au linalobeba jina la Yahwe
  rationale: Muundo wa Kiebrania ni mzito na unaweza kueleweka kwa njia zaidi ya moja. Tafsiri iliyochaguliwa huhifadhi uhusiano wa kiagano kati ya Jina na Sanduku bila kudai kwamba Sanduku lenyewe ni Mungu.
- issue: יֹשֵׁב kuhusiana na makerubi
  choice: anayeketi juu ya makerubi
  alternative: aliyetawazwa juu ya makerubi au anayekaa kati ya makerubi
  rationale: “Anayeketi” huhifadhi maana ya msingi na uwezekano wa taswira ya kifalme; tanbihi inahifadhi tafsiri ya kimapokeo ya kukaa kati ya makerubi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye heshima na unaosomeka kwa sauti. “Sanduku” na “Jina” yameandikwa kwa herufi kubwa katika muktadha huu ili kutofautisha vyombo na istilahi hizo maalumu bila kuongeza maelezo ya kimadhehebu.
