  yaml_path: translation/ot/2_samuel/006/008.yaml
  text: And David was angry because Yahweh had broken out against Uzzah[a], and he called that place Perez-uzzah to this day.
translation:
  language: sw
  text: Daudi akakasirika kwa sababu Yahwe alikuwa amezuka kwa nguvu dhidi ya Uza[a]. Akaita mahali hapo Peres-Uza hadi leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Peres-Uza linahusiana na “uvunjo” au “uzukaji kwa nguvu dhidi ya Uza.” Katika Kiebrania, kauli “Yahwe alikuwa amezuka kwa nguvu” na jina hilo hutumia kitenzi na nomino zenye mzizi mmoja.
    reason: Kueleza mchezo wa maneno wa Kiebrania kati ya kitenzi פָּרַץ na nomino פֶּרֶץ, bila kuongeza dhana ya ghafula au kubadili taswira kuwa kupiga.
lexical_decisions:
- source_word: וַיִּחַר לְדָוִד
  choice: Daudi akakasirika
  rationale: Nahau ya Kiebrania חרה ל inaonyesha kuwaka kwa hasira. Tafsiri hii ni ya kawaida na yenye nguvu katika Kiswahili, bila kubainisha kimyakimya hasira hiyo ilielekezwa kwa nani.
- source_word: פָּרַץ יְהוָה פֶּרֶץ בְּעֻזָּה
  choice: Yahwe alikuwa amempiga Uza kwa ghafula
  rationale: Kitenzi פרץ pamoja na nomino ya mzizi huohuo kinaonyesha tendo la hukumu lililotokea kwa nguvu na ghafula. Kiswahili hiki ni cha asili na kinaweka wazi kwamba Yahwe ndiye aliyetenda, huku tanbihi ikihifadhi mchezo wa maneno wa Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika herufi nne za Kiebrania limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: Akapaita mahali hapo
  rationale: Hii ni njia ya kawaida na fasaha ya Kiswahili ya kueleza kumpa mahali jina.
- source_word: פֶּרֶץ עֻזָּה
  choice: Peres-Uza
  rationale: Jina la mahali limetoholewa; tanbihi inaeleza maana yake na uhusiano wake na tendo lililotajwa awali.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: na panaitwa hivyo hadi leo
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida fomula ya Kiebrania inayosema kwamba jina hilo liliendelea kutumiwa hadi wakati wa mwandishi.
theological_decisions:
- issue: Kuhifadhi kwamba tukio lilikuwa tendo la moja kwa moja la hukumu ya Mungu
  choice: Yahwe alikuwa amempiga Uza kwa ghafula
  alternative: Uza alikuwa amepatwa na msiba wa ghafula
  rationale: Kiebrania kinamtaja Yahwe wazi kuwa mtendaji. Tafsiri haifanyi kifo hicho kionekane kuwa ajali au matokeo yasiyo ya moja kwa moja.
- issue: Kutoamua kimyakimya hasira ya Daudi ilielekezwa kwa nani
  choice: Daudi akakasirika kwa sababu...
  alternative: Daudi akamkasirikia Yahwe kwa sababu...
  rationale: Kishazi cha Kiebrania kinaeleza hasira ya Daudi na sababu yake, lakini hakitaji wazi mlengwa wa hasira hiyo. Kiswahili kinahifadhi uwazi huo wenye mipaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni wazi kwa msomaji wa kawaida; “Peres-Uza” imetoholewa kama jina la mahali, na “Yahwe” limetumiwa kwa jina la Mungu. Alama ya tanbihi [a] ipo katika matini kuu.
