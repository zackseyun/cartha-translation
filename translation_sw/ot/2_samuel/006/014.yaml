base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/014.yaml
  text: And David was dancing with all his might before Yahweh[b][a], and David was wearing a linen ephod.
translation:
  language: sw
  text: Daudi alikuwa akicheza[a] kwa nguvu zake zote mbele ya Yahweh, naye alikuwa amevaa efodi ya kitani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akizungukazunguka” au “akirukaruka”; neno la Kiebrania linaonyesha mwendo wa shangwe wenye nguvu.
    reason: lexical_alternative
  - marker: b
    text: Efodi ilikuwa vazi mahsusi la kikuhani au la ibada; hapa Daudi anaelezwa kuwa amevaa efodi iliyotengenezwa kwa kitani.
    reason: cultural_note
lexical_decisions:
- source_word: מְכַרְכֵּר
  choice: alikuwa akicheza
  rationale: Kitenzi hiki kinaonyesha mwendo wa mwili wenye nguvu katika sherehe. “Alikuwa akicheza” ni Kiswahili cha kawaida na kinachoeleweka, huku tanbihi ikihifadhi uwezekano wa kuzunguka au kurukaruka kwa furaha.
- source_word: בְּכָל עֹז
  choice: kwa nguvu zake zote
  rationale: Kirai hiki kinaeleza kutumia nguvu kikamilifu; tafsiri hii ni ya asili katika Kiswahili na inadumisha uzito wa Kiebrania.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: “Mbele za” huwasilisha maana ya kuwa mbele au katika uwepo wa Yahweh kwa lugha fupi na ya kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: חָגוּר
  choice: alikuwa amevaa
  rationale: Umbo hili linaonyesha kwamba Daudi alikuwa amejifunga au amevalia vazi hilo. “Alikuwa amevaa” ni la kawaida zaidi katika Kiswahili cha sasa.
- source_word: אֵפוֹד
  choice: efodi
  rationale: Efodi ni vazi maalumu la ibada la Israeli lisilo na kisawe kamili cha Kiswahili; kwa hiyo neno limetoholewa na kufafanuliwa katika tanbihi.
- source_word: בָּד
  choice: kitani
  rationale: Neno hili hapa linataja kitambaa cha kitani bila kulazimisha wazo la ubora fulani kama “kitani safi” au “kitani bora.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa jina “Daudi” katika Kiebrania umepunguzwa kwa kutumia “naye” ili sentensi iwe ya asili bila kupoteza maana.
