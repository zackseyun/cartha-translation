  text: וַ/יֻּגַּ֗ד לַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ בֵּרַ֣ךְ יְהוָ֗ה אֶת בֵּ֨ית עֹבֵ֤ד אֱדֹם֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ בַּ/עֲב֖וּר אֲר֣וֹן הָ/אֱלֹהִ֑ים וַ/יֵּ֣לֶךְ דָּוִ֗ד וַ/יַּעַל֩ אֶת אֲר֨וֹן הָ/אֱלֹהִ֜ים מִ/בֵּ֨ית עֹבֵ֥ד אֱדֹ֛ם עִ֥יר דָּוִ֖ד בְּ/שִׂמְחָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/012.yaml
  text: And it was reported to King David[a], saying, “Yahweh has blessed the house of Obed-edom and all that belongs to him because of the ark of God.” So David went and brought up the ark of God from the house of Obed-edom to the city of David with rejoicing.
translation:
  language: sw
  text: Mfalme Daudi akaambiwa kwamba, “Yahwe[a] ameibariki nyumba ya Obed-Edomu na kila kitu alicho nacho kwa sababu ya Sanduku la Mungu.” Basi Daudi akaenda, akalipandisha Sanduku la Mungu kutoka nyumba ya Obed-Edomu hadi Mji wa Daudi kwa shangwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH,” jina binafsi la Mungu; tafsiri nyingi hulitafsiri “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: akaambiwa
  rationale: Kauli ya kutendwa inadumishwa bila kumtaja aliyempa Daudi habari; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: לַמֶּלֶךְ דָּוִד
  choice: Mfalme Daudi
  rationale: Huwasilisha cheo na jina kwa mpangilio wa kawaida wa Kiswahili.
- source_word: בֵּרַךְ יְהוָה
  choice: Yahwe ameibariki
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililotimia lenye matokeo yanayoendelea kuonekana katika taarifa hiyo.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: nyumba ya Obed-Edomu
  rationale: “Nyumba” inadumisha picha halisi ya Kiebrania na katika muktadha inaweza kujumuisha watu wa nyumbani na mali yake.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: na kila kitu alicho nacho
  rationale: Ni usemi wa asili wa Kiswahili unaojumuisha mali yote inayomhusu Obed-Edomu.
- source_word: בַּעֲבוּר
  choice: kwa sababu ya
  rationale: Hueleza wazi uhusiano wa kisababishi kati ya kuwapo kwa Sanduku na baraka.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: Sanduku la Mungu
  rationale: Ni tafsiri ya moja kwa moja na inayotambulika ya kitu hicho kitakatifu; herufi kubwa hutofautisha Sanduku hili maalumu.
- source_word: וַיֵּלֶךְ דָּוִד
  choice: Basi Daudi akaenda
  rationale: “Basi” huonyesha kuwa hatua ya Daudi ilifuata taarifa aliyopokea, huku “aka-” ikiendeleza simulizi.
- source_word: וַיַּעַל אֶת אֲרוֹן הָאֱלֹהִים
  choice: akalipandisha Sanduku la Mungu
  rationale: Kitenzi “kupandisha” kinahifadhi wazo la kulipeleka juu kuelekea Yerusalemu na pia maana ya kulisafirisha.
- source_word: עִיר דָּוִד
  choice: Mji wa Daudi
  rationale: Ni jina mahususi la eneo hilo na ni usemi wa kawaida katika Kiswahili cha Biblia.
- source_word: בְּשִׂמְחָה
  choice: kwa shangwe
  rationale: “Shangwe” huwasilisha furaha iliyoonyeshwa wazi katika tukio la kulileta Sanduku.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania inatumia jina binafsi la Mungu, YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku tanbihi ikitaja desturi nyingine ya tafsiri.
- issue: Maana ya baraka kwa “nyumba” ya Obed-Edomu
  choice: nyumba ya Obed-Edomu na kila kitu alicho nacho
  alternative: jamaa ya Obed-Edomu na mali yake yote
  rationale: Tafsiri inahifadhi upana wa בֵּית bila kuamua kimya kimya kwamba inamaanisha familia pekee au jengo pekee; kirai kinachofuata kinaonyesha kwamba baraka ilihusu yote aliyokuwa nayo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumiwa kwa vitenzi vya “aka-”; “kwa shangwe” ni wa asili na wenye nguvu bila kuwa wa kale. Alama ya tanbihi imewekwa baada ya “Yahwe,” neno linalohusika moja kwa moja.
