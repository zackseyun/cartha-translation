  text: And Michal the daughter of Saul had no child until the day of her death[a].
translation:
  language: sw
  text: Naye Mikali binti Sauli hakuwa na mtoto[a] mpaka siku ya kufa kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mzao”; nomino ya Kiebrania inaweza kumaanisha mtoto kwa ujumla, si lazima mwana wa kiume.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מִיכַל
  choice: Naye Mikali
  rationale: Kiunganishi pamoja na kihusishi cha Kiebrania kinamtambulisha Mikali kama mhusika wa kauli hii na kuunganisha sentensi na simulizi lililotangulia. “Naye Mikali” ni Kiswahili cha kawaida kinachohifadhi uhusiano huo wa kisimulizi.
- source_word: בַּת שָׁאוּל
  choice: binti Sauli
  rationale: Muundo huu unamtambulisha Mikali kwa nasaba yake. “Binti Sauli” ni usemi wa kawaida, wenye hadhi, na unaolingana kwa karibu na muundo wa Kiebrania.
- source_word: לֹא הָיָה לָהּ
  choice: hakuwa na
  rationale: Kiebrania hutumia muundo wa kimilikishi unaomaanisha kihalisi kwamba kitu ‘hakikuwako kwake.’ Kiswahili huwasilisha maana hiyo kwa kawaida kwa kusema “hakuwa na.”
- source_word: יָלֶד
  choice: mtoto
  rationale: Nomino hii ya umoja inaweza kumaanisha mtoto kwa ujumla bila kubainisha jinsia. “Mtoto” ni ya asili katika muktadha huu na haiongezi maana ya mwana wa kiume.
- source_word: עַד יוֹם מוֹתָהּ
  choice: mpaka siku ya kufa kwake
  rationale: Huu ni usemi wa wakati unaosema kwamba hali hiyo iliendelea katika maisha yake yote. Tafsiri hii ni wazi, ya karibu na Kiebrania, na haiingizi hitimisho lisilosemwa na mstari.
theological_decisions:
- issue: Maana ya kutokuwa na mtoto ‘mpaka siku ya kufa kwake’
  choice: Kuhifadhi usemi wa wakati moja kwa moja kama “mpaka siku ya kufa kwake.”
  alternative: Kusema wazi “hakupata mtoto maisha yake yote.”
  rationale: Kiebrania kinasisitiza kwamba Mikali alibaki bila mtoto maisha yake yote. Muundo wa chanzo umehifadhiwa bila kudokeza jambo lolote baada ya kifo chake wala kuufanya usemi huu kuwa hoja ya kiteolojia isiyotajwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Naye” linaendeleza simulizi kwa kawaida; “binti Sauli” na “mpaka siku ya kufa kwake” vinadumisha ukaribu na muundo wa chanzo bila kufanya sentensi kuwa ngumu.
