  yaml_path: translation/ot/2_samuel/006/013.yaml
  text: And when those carrying the ark of Yahweh had gone six steps[b][a], he sacrificed an ox and a fattened calf.
translation:
  language: sw
  text: Ikawa, wale waliobeba sanduku la Yahweh walipopiga hatua sita[a], akatoa dhabihu ya ng’ombe dume na mnyama aliyenoneshwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kutembea hatua sita.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mnyama aliyenoneshwa”; neno hilo limeeleweka kimapokeo hapa kuwa ndama aliyenoneshwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: sanduku la Yahweh
  rationale: “Sanduku” ni neno la kawaida la Kiswahili kwa sanduku takatifu la agano, na jina la Mungu יְהוָה limetoholewa kuwa “Yahweh” ili kuhifadhi jina la agano lililo katika matini.
- source_word: כִּי
  choice: walipo-
  rationale: Katika muundo wa kisimulizi ויהי כי, neno hili linaanzisha hali ya wakati; kiambishi “walipo-” ni cha kawaida na cha asili katika Kiswahili.
- source_word: צָעֲדוּ
  choice: walipopiga hatua
  rationale: Kitenzi kinaonyesha kusonga mbele kwa kupiga hatua. Usemi “kupiga hatua” ni wa asili na unaendana moja kwa moja na kipimo kinachofuata.
- source_word: נֹשְׂאֵי
  choice: wale waliobeba
  rationale: Kauli hii inawatambulisha watu waliokuwa wakilisafirisha sanduku; “wale waliobeba” ni wazi na ya kawaida kwa wasomaji wa sasa.
- source_word: שִׁשָּׁה צְעָדִים
  choice: hatua sita
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya kipimo hicho; inaweza pia kueleweka kama mwendo wa hatua sita.
- source_word: וַיִּזְבַּח
  choice: Daudi akatoa dhabihu
  rationale: Kitenzi cha umoja kinaelekea kumrejelea Daudi katika muktadha. Jina lake limetajwa ili kuondoa utata usio wa lazima katika Kiswahili, huku “akatoa dhabihu” likihifadhi maana ya tendo la ibada.
- source_word: שׁוֹר
  choice: ng’ombe dume
  rationale: Neno hili linaweza kutaja mnyama wa jamii ya ng’ombe, hasa dume; “ng’ombe dume” ni wazi kuliko “fahali” bila kudai kwa lazima umri au hali nyingine.
- source_word: מְרִיא
  choice: ndama aliyenoneshwa
  rationale: Katika muktadha huu neno limeeleweka kimapokeo kuwa mnyama mchanga aliyenoneshwa, lakini Kiebrania chenyewe ni kipana zaidi; uwezekano huo umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini inatumia moja kwa moja jina la agano יְהוָה. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Mtendaji wa dhabihu katika kitenzi cha umoja וַיִּזְבַּח
  choice: Daudi
  alternative: mtendaji asiyeainishwa wazi (“akatoa dhabihu”)
  rationale: Kisarufi mtendaji hajatajwa ndani ya mstari huu, lakini muktadha wa karibu unamfanya Daudi kuwa rejeo la kawaida zaidi. Kumtaja humsaidia msomaji wa Kiswahili, huku tanbihi ikihifadhi hali ya matini ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wa kawaida na hadhi inayofaa kwa matini ya Biblia. “Ikawa” inadumisha mpito wa kisimulizi wa ויהי bila kufanya sentensi kuwa nzito. Tanbihi zinahifadhi upana wa מְרִיא na namna nyingine ya kueleza kipimo cha hatua.
