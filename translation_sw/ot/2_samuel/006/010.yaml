  yaml_path: translation/ot/2_samuel/006/010.yaml
  text: So David was not willing to bring the ark of Yahweh to himself into the City of David[b][a], but David turned it aside to the house of Obed-edom the Gittite.
translation:
  language: sw
  text: Kwa hiyo Daudi hakutaka kulileta Sanduku la Yahwe kwake, kwenye Mji wa Daudi,[a] bali akalielekeza kwenye nyumba ya Obed-Edomu, Mgiti.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka Mji wa Daudi.” Kihusishi cha Kiebrania kinaweza kuonyesha mwendo kuelekea, au kupanda hadi, mahali.
    reason: lexical_alternative
  - marker: b
    text: Au, “mtu wa Gathi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: hakuwa tayari
  rationale: Kitenzi hiki huonyesha utayari au kukubali. Kauli hii inadumisha wazo la kutokuwa tayari bila kutumia neno lenye nguvu zaidi la kukataa kabisa.
- source_word: לְהָסִיר אֵלָיו
  choice: kulileta ... kwake
  rationale: Ingawa הֵסִיר kwa kawaida huhusu kuondoa au kuhamisha, katika muktadha huu maana ni kulihamisha Sanduku lielekee kwa Daudi; Kiswahili cha kawaida husema ‘kulileta kwake.’
- source_word: אֲרוֹן יְהוָה
  choice: Sanduku la Yahwe
  rationale: Hii ni tafsiri ya kawaida ya muundo wa umilikaji, huku jina la agano יְהוָה likihifadhiwa kwa umbo ‘Yahwe.’
- source_word: עַל עִיר דָוִד
  choice: katika Mji wa Daudi
  rationale: עַל hapa huonyesha mwendo kuelekea mahali, na katika simulizi hili ‘katika’ linaeleza kwa kawaida kuingizwa kwa Sanduku mjini; uwezekano wa ‘hadi juu kwenye’ umewekwa katika tanbihi.
- source_word: וַיַּטֵּהוּ
  choice: akalielekeza kando
  rationale: Kauli hii inadumisha maana halisi ya kuligeuza au kulielekeza upande mwingine, tofauti na mahali ambapo Daudi alikuwa amekusudia kulipeleka.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: nyumbani kwa Obed-Edomu
  rationale: בֵּית inaweza kumaanisha nyumba au jamaa ya nyumbani; hapa Sanduku linawekwa katika makao yake, hivyo ‘nyumbani kwa’ ni ya asili na wazi.
- source_word: הַגִּתִּי
  choice: Mgiti
  rationale: Hili ni jina la mtu wa Gathi. Umbo la kijina ‘Mgiti’ linahifadhi namna fupi ya Kiebrania, huku maana ya kijiografia ikielezwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia jina la Mungu יְהוָה moja kwa moja. ‘Yahwe’ hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. ‘Sanduku’ limeandikwa kwa herufi kubwa kama jina fupi la Sanduku la Agano. Majina ‘Obed-Edomu’ na ‘Mgiti’ yamewekewa maumbo yanayotamkika kwa kawaida katika Kiswahili.
