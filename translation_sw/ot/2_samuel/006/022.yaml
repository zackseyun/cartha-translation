base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/022.yaml
  text: And I will make myself even more contemptible than this[a], and I will be lowly in my own eyes; but with the servant girls of whom you have spoken, with them I will be honored.
translation:
  language: sw
  text: Nitajishusha hata zaidi ya hivi, nami nitakuwa duni machoni pangu mwenyewe; lakini pamoja na wale wanawake watumwa uliowataja, nitaheshimiwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְקַלֹּתִי
  choice: Nitajifanya wa kudharauliwa
  rationale: Kauli hii huhifadhi wazo la Daudi kukubali kujishusha na kuonekana asiye na heshima, bila kuligeuza kuwa sifa ya unyenyekevu wa kiadili pekee.
- source_word: עוֹד מִזֹּאת
  choice: hata zaidi ya hivi
  rationale: Huhifadhi nguvu ya kuendelea na kulinganisha tendo hilo na lile ambalo Mikali alikuwa amelilaumu.
- source_word: וְהָיִיתִי שָׁפָל בְּעֵינָי
  choice: nami nitakuwa wa hali ya chini machoni pangu mwenyewe
  rationale: Huhifadhi taswira ya Kiebrania ya kuwa chini kwa kadiri ya kujitathmini, pamoja na maana yake ya hadhi, bila kuifanya moja kwa moja kuwa fadhila ya unyenyekevu.
- source_word: הָאֲמָהוֹת
  choice: wanawake watumwa
  rationale: Neno אָמָה humaanisha mtumishi wa kike au mwanamke mtumwa mwenye hadhi ya chini katika kaya; hapa tofauti ya hadhi ni muhimu kwa hoja ya mstari huu.
- source_word: אֲשֶׁר אָמַרְתְּ
  choice: uliowataja
  rationale: Ni usemi wa kawaida na wazi unaorejelea wanawake ambao Mikali aliwataja katika mstari uliotangulia.
- source_word: עִמָּם
  choice: miongoni mwao
  rationale: Katika Kiswahili, ‘miongoni mwa’ huonyesha kwa kawaida mazingira ya kijamii ambamo Daudi atasifiwa, huku ikiepuka kuamua kwamba wanawake hao ndio watakaompa heshima moja kwa moja.
- source_word: אִכָּבֵדָה
  choice: nitaheshimiwa
  rationale: Huhifadhi hali ya kupokea heshima na tofauti ya wazi kati ya kudharauliwa na kuheshimiwa.
theological_decisions:
- issue: Istilahi ya hadhi ya kijamii kwa הָאֲמָהוֹת
  choice: wanawake watumwa katika matini kuu
  alternative: vijakazi au watumishi wa kike
  rationale: ‘Wanawake watumwa’ huonyesha wazi zaidi hadhi yao ya chini katika kaya, ambayo ni sehemu muhimu ya tofauti kati ya kujishusha kwa Daudi na kuheshimiwa kwake. Tanbihi inadumisha tafsiri laini zaidi zinazowezekana.
- issue: Chanzo au mazingira ya heshima katika עִמָּם
  choice: miongoni mwao
  alternative: kwao au pamoja nao
  rationale: Kihusishi cha Kiebrania kinaweza kuonyesha ushirika au mazingira ya kijamii. ‘Miongoni mwao’ huhifadhi maana hiyo bila kudai kwa lazima kwamba wao ndio watendaji wa kumpa heshima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa heshima na fedheha umehifadhiwa; lugha imeepuka kugeuza ‘kuwa wa hali ya chini’ kuwa dai la moja kwa moja kuhusu wema wa kiadili.
