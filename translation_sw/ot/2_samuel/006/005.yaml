base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/005.yaml
  text: And David and all the house of Israel were celebrating before Yahweh with all kinds of cypress wood instruments[a], and with lyres, harps, tambourines, rattles[c][b], and cymbals.
translation:
  language: sw
  text: Daudi na nyumba yote ya Israeli walikuwa wakisherehekea mbele za Yahwe[b] kwa vyombo vya muziki vya kila aina vilivyotengenezwa kwa mbao za miberoshi[a], kwa vinubi, vinanda, matari, njuga[c], na matoazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kwa miti yote ya beroshi.” Huenda usemi huu unamaanisha vyombo mbalimbali vya muziki vilivyotengenezwa kwa mbao hizo. Utambulisho kamili wa aina ya mti haujulikani kwa hakika.
    reason: lexical_alternative
  - marker: b
    text: Au, “walikuwa wakicheza” au “wakifurahi.” Kitenzi cha Kiebrania kinaweza kueleza sherehe ya furaha au mchezo.
    reason: lexical_alternative
  - marker: c
    text: Utambulisho kamili wa chombo hiki hauna hakika; huenda kilikuwa sistramu au chombo kingine kilichotikiswa ili kutoa sauti.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: walikuwa wakishangilia
  rationale: Kitenzi hiki katika muktadha wa msafara wenye vyombo vya muziki kinaonyesha furaha ya sherehe; ‘wakishangilia’ ni ya asili na hakipunguzi tendo hilo kuwa mchezo tu.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huhifadhi nahau ya Kiebrania ya kutenda katika uwepo wa Mungu na kulitaja jina la agano moja kwa moja.
- source_word: בְּכֹל עֲצֵי בְרוֹשִׁים
  choice: kwa kila aina ya vyombo vya muziki vya mbao za misonobari
  rationale: Kiebrania ni cha mkato, kihalisi ‘kwa miti yote ya beroshi’; muktadha unaelekea kwenye vyombo vya muziki vilivyotengenezwa kwa mbao, lakini kutokuwa na uhakika kunabainishwa katika tanbihi.
- source_word: בְרוֹשִׁים
  choice: misonobari
  rationale: Ni jina linaloeleweka la miti ya mbao laini inayoweza kukaribia beroshi, ingawa spishi kamili ya mti wa kale haijulikani kwa hakika.
- source_word: כִנֹּרוֹת
  choice: vinubi
  rationale: Hiki ni chombo cha nyuzi cha aina ya kinubi; neno hili ni la kawaida na linaloeleweka katika Kiswahili cha Biblia.
- source_word: נְבָלִים
  choice: vinanda
  rationale: Hutofautisha chombo hiki cha nyuzi na כִנּוֹר bila kudai kwa uhakika umbo lake halisi, ambalo halijulikani kikamilifu.
- source_word: תֻפִּים
  choice: matari
  rationale: Neno linaashiria ngoma za mkono au za fremu zilizotumiwa katika sherehe; ‘matari’ ni sawia ya kawaida na inayoeleweka.
- source_word: מְנַעַנְעִים
  choice: njuga
  rationale: Neno adimu linaelekea kumaanisha vyombo vinavyotikiswa ili kutoa sauti; ‘njuga’ huwasilisha kazi hiyo kwa lugha ya kawaida, huku kutokuwa na uhakika kukitajwa katika tanbihi.
- source_word: צֶלְצֶלִים
  choice: matoazi
  rationale: Ni sawia sanifu ya vyombo vya metali vinavyogonganishwa, yaani cymbals.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: nyumba yote ya Israeli
  rationale: Huhifadhi usemi wa pamoja wa Kiebrania badala ya kuufupisha kuwa ‘Israeli wote’.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la agano YHWH; ‘Yahwe’ hulitaja moja kwa moja badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ‘nyumba yote ya Israeli’ umehifadhiwa kwa uaminifu wa kimtindo; vifungu vigumu kuhusu mbao na vyombo vimefafanuliwa kwa kiasi katika matini na kutokuwa na uhakika kumehifadhiwa katika tanbihi.
