base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/006.yaml
  text: When they came to Nacon’s threshing floor[a], Uzza reached out to the ark of God and took hold of it[b], because the oxen stumbled.
translation:
  language: sw
  text: Walipofika kwenye uwanja wa kupuria nafaka wa Nakoni[a], Uza akanyosha mkono kuelekea sanduku la Mungu na kulishika, kwa sababu ng’ombe waliteleza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda pia, “uwanja imara wa kupuria nafaka” au “uwanja wa kupuria nafaka uliowekwa imara.”
    reason: lexical_alternative
  - marker: b
    text: Au “ng’ombe walijikwaa”; huenda pia maana ni kwamba ng’ombe walikaribia kulipindua sanduku.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן
  choice: uwanja wa kupuria nafaka
  rationale: Hili ni eneo la kilimo ambako nafaka ilipuriwa; kirai hiki ni wazi na cha kawaida katika Kiswahili cha sasa.
- source_word: נָכוֹן
  choice: wa Nakoni
  rationale: Katika muktadha huu neno linaeleweka kwa urahisi zaidi kama jina la mtu au mahali linalohusishwa na uwanja; uwezekano wa maana ya kivumishi umehifadhiwa katika tanbihi.
- source_word: וַיִּשְׁלַח
  choice: akanyosha mkono kuelekea
  rationale: Kitenzi kinaonyesha kunyoosha kiungo kuelekea kitu; kutaja mkono unaodokezwa kunafanya tendo lieleweke kwa Kiswahili cha kawaida bila kuongeza hoja mpya.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: sanduku la Mungu
  rationale: Kirai kizima kimehifadhiwa ili kuonyesha wazi utambulisho mtakatifu wa sanduku.
- source_word: וַיֹּאחֶז בּוֹ
  choice: kulishika
  rationale: Kitenzi אחז humaanisha kushika au kukamata; ‘kulishika’ ni cha kawaida na hakidokezi nguvu au vurugu isiyotajwa.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya tendo la Uza.
- source_word: שָׁמְטוּ
  choice: waliteleza
  rationale: Kitenzi kinaweza kumaanisha kuteleza, kuachia, au kufanya kitu kipoteze uthabiti. ‘Waliteleza’ huhifadhi ng’ombe kama kiima na huepuka kueleza kupita kiasi kilichotokea kwa sanduku.
- source_word: הַבָּקָר
  choice: ng’ombe
  rationale: Katika muktadha wa kulivuta gari, neno linarejelea ng’ombe waliotumika kama wanyama wa kuvuta; Kiswahili kwa kawaida hutumia ‘ng’ombe’ bila umbo tofauti la neno kwa ‘oxen’.
theological_decisions:
- issue: Sababu ya tendo la Uza
  choice: Uza alilishika sanduku kwa sababu ng’ombe waliteleza.
  alternative: Ng’ombe walifanya sanduku lianze kuanguka au kulipindua.
  rationale: Kiebrania kinataja ng’ombe kama kiima cha kitenzi chenye maana pana ya kuteleza au kuachia. Tafsiri haitaji kwamba sanduku lilianguka au lilipinduliwa, hivyo inadumisha mvutano na utata wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umetumia ‘akanyosha … na kulishika’ kwa mtiririko wa asili. Jina Uza na Nakoni yameandikwa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
