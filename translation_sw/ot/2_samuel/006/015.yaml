base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/015.yaml
  text: So David and all the house of Israel were bringing up the ark of Yahweh with shouting and with the sound of the horn[a][b].
translation:
  language: sw
  text: Basi Daudi na nyumba yote ya Israeli walikuwa wakilipandisha sanduku la Yahweh kwa vifijo[a] na kwa sauti ya pembe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sauti za shangwe”; neno la Kiebrania linaweza kumaanisha mwito mkubwa wa furaha au shangwe ya hadhara.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa sauti ya tarumbeta”; shofari ya Kiebrania ni ala ya pembe, mara nyingi pembe ya kondoo dume.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלִים
  choice: walikuwa wakilipandisha
  rationale: Kauli ya kusababisha katika umbo la kitenzi-jina inaonyesha tendo lililokuwa likiendelea katika simulizi. Muundo huu pia unahifadhi wazo la kulipeleka sanduku juu kuelekea mahali lililokusudiwa.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: watu wote wa nyumba ya Israeli
  rationale: Huhifadhi taswira ya Israeli kama jamaa au jamii moja, huku neno ‘watu’ likizuia ‘nyumba’ kueleweka tu kama jengo katika Kiswahili cha sasa.
- source_word: אֲרוֹן יְהוָה
  choice: sanduku la Yahweh
  rationale: ‘Sanduku’ ndilo neno la kawaida la kibiblia kwa אֲרוֹן, na muundo huu hauongezi neno ‘Agano,’ ambalo halipo katika mstari huu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: תְרוּעָה
  choice: sauti za shangwe
  rationale: Neno linaweza kumaanisha mwito mkubwa, vifijo, au shangwe ya hadhara. ‘Sauti za shangwe’ linaonyesha hapa kelele za furaha bila kuzichanganya na mlio wa pembe unaotajwa baadaye.
- source_word: קוֹל שׁוֹפָר
  choice: sauti ya pembe
  rationale: שׁוֹפָר ni ala iliyotengenezwa kwa pembe, mara nyingi pembe ya kondoo dume. ‘Pembe’ ni sahihi zaidi kihistoria kuliko ‘tarumbeta,’ ambalo linaweza kueleweka kama ala ya chuma ya kisasa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina maalumu la Mungu. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Walikuwa wakilipandisha’ huhifadhi mwendelezo wa tendo; ‘watu wote wa nyumba ya Israeli’ hudumisha maana ya kijamii na kifamilia ya usemi wa Kiebrania.
