base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/004.yaml
  text: They carried it from the house of Abinadab[a], which was on the hill, with the ark of God, and Ahio was walking before the ark.
translation:
  language: sw
  text: Wakalichukua kutoka katika nyumba ya Abinadabu iliyokuwa juu ya kilima[a], pamoja na Sanduku la Mungu, naye Ahio alikuwa akitembea mbele ya Sanduku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliyokuwa katika Gibea.” Neno la Kiebrania גִּבְעָה linaweza kumaanisha “kilima” au kuwa jina la mahali, “Gibea.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: Wakalichukua
  rationale: Kitenzi נשׂא hapa kinaeleza kukiondoa au kukisafirisha kitu. “Wakalichukua” ni Kiswahili cha kawaida kinachofaa katika muktadha wa kulihamisha Sanduku; kiambishi “-li-” pia hakilazimishi kufafanua zaidi rejeo ambalo usemi wa Kiebrania unaliacha kuwa mgumu katika muktadha.
- source_word: מִבֵּית אֲבִינָדָב
  choice: kutoka katika nyumba ya Abinadabu
  rationale: מן inaonyesha mahali walikotoka, na בית אֲבִינָדָב ni “nyumba ya Abinadabu.” “Kutoka katika” ni wazi na asilia katika Kiswahili Sanifu.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: iliyokuwa juu ya kilima
  rationale: גִּבְעָה inaweza kuwa nomino ya kawaida “kilima” au jina la mahali “Gibea.” Matumizi ya nomino ya kawaida yamewekwa katika matini kuu, huku uwezekano wa jina la mahali ukihifadhiwa katika tanbihi.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: pamoja na Sanduku la Mungu
  rationale: עִם inaonyesha uandamani. “Sanduku la Mungu” ni tafsiri iliyo wazi na yenye heshima ya אֲרוֹן הָאֱלֹהִים.
- source_word: וְאַחְי֕וֹ
  choice: naye Ahio
  rationale: Jina la mtu limenakiliwa kama “Ahio,” na “naye” linaunganisha tendo lake na taarifa iliyotangulia kwa Kiswahili cha kawaida.
- source_word: הֹלֵךְ
  choice: alikuwa akitembea
  rationale: Kauli ya kushiriki ya Kiebrania inaonyesha tendo lililokuwa likiendelea wakati Sanduku likisafirishwa; “alikuwa akitembea” huhifadhi hali hiyo ya kuendelea.
- source_word: לִפְנֵי הָאָרוֹן
  choice: mbele ya Sanduku
  rationale: לִפְנֵי hapa ni usemi wa mahali unaomaanisha kuwa mbele ya kitu katika mwendo wa msafara.
