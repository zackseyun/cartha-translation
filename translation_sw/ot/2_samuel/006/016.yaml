source:
  edition: WLC
  text: וְ/הָיָה֙ אֲר֣וֹן יְהוָ֔ה בָּ֖א עִ֣יר דָּוִ֑ד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִד֙ מְפַזֵּ֤ז וּ/מְכַרְכֵּר֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/016.yaml
  text: As the ark of Yahweh was coming into the city of David[a], Michal daughter of Saul looked out through the window and saw King David leaping and whirling before Yahweh, and she despised him in her heart.
translation:
  language: sw
  text: Sanduku la Yahwe lilipokuwa likiingia katika Jiji la Daudi, Mikali binti Sauli alichungulia dirishani, akamwona Mfalme Daudi akirukaruka na kujizungusha[a] mbele za Yahwe, naye akamdharau moyoni mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “akirukaruka na kujizungusha”; vitenzi hivi vinaonyesha mwendo wa shangwe wenye nguvu mbele za Yahwe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה ... בָּא
  choice: lilipokuwa likiingia
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea na kuweka wakati wa tukio kuu kwa Kiswahili cha kawaida, bila tafsiri ngumu ya neno kwa neno ya ‘ikawa.’
- source_word: אֲרוֹן יְהוָה
  choice: Sanduku la Yahwe
  rationale: Muundo wa umilikaji umehifadhiwa, na jina la Mungu יְהוָה limetoholewa kuwa ‘Yahwe’ badala ya kubadilishwa na cheo.
- source_word: עִיר דָּוִד
  choice: Jiji la Daudi
  rationale: Ni jina la mahali linalotambulika; ‘jiji’ linafaa kwa muktadha wa makao ya kifalme ya Daudi.
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: alichungulia dirishani
  rationale: Kitenzi kinaonyesha kutazama kutoka ndani au mahali palipoinuka kupitia dirisha; ‘alichungulia dirishani’ ni cha asili na hakilazimishi wazo la kutazama chini.
- source_word: מְפַזֵּז
  choice: akirukaruka
  rationale: Kitenzi hiki adimu kinaonyesha mwendo wa shangwe wenye miruko; ‘akirukaruka’ huhifadhi nguvu na urudiaji wa mwendo.
- source_word: וּמְכַרְכֵּר
  choice: na kujizungusha
  rationale: Neno linaashiria mwendo wa kuzunguka au kujigeuza; tafsiri hii hulitofautisha na kitenzi kilichotangulia badala ya kuyafanya yote kuwa ‘kucheza.’
- source_word: וַתִּבֶז לוֹ בְּלִבָּהּ
  choice: naye akamdharau moyoni mwake
  rationale: Tafsiri hii huhifadhi mlengwa wa dharau pamoja na hali yake ya ndani, kama ilivyo katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Kifungu kinatumia jina binafsi la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha na cheo, bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Sentensi imeundwa kwa mtiririko wa simulizi unaoeleweka kwa urahisi, huku taswira mbili tofauti za mwendo wa Daudi na dharau ya ndani ya Mikali zikihifadhiwa.
