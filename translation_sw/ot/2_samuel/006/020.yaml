  text: וַ/יָּ֥שָׁב דָּוִ֖ד לְ/בָרֵ֣ךְ אֶת בֵּית֑/וֹ וַ/תֵּצֵ֞א מִיכַ֤ל בַּת שָׁאוּל֙ לִ/קְרַ֣את דָּוִ֔ד וַ/תֹּ֗אמֶר מַה נִּכְבַּ֨ד הַ/יּ֜וֹם מֶ֣לֶךְ יִשְׂרָאֵ֗ל אֲשֶׁ֨ר נִגְלָ֤ה הַ/יּוֹם֙ לְ/עֵינֵ֨י אַמְה֣וֹת עֲבָדָ֔י/ו כְּ/הִגָּל֥וֹת נִגְל֖וֹת אַחַ֥ד הָ/רֵקִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/020.yaml
  text: Then David returned to bless his household[a]. But Michal daughter of Saul came out to meet David and said, “How honored the king of Israel was today, uncovering himself today in the sight of the servant girls of his servants[c][b], as one of the vulgar fellows shamelessly uncovers himself!”
translation:
  language: sw
  text: Kisha Daudi akarudi kuwabariki watu wa nyumbani mwake[a]. Lakini Mikali binti Sauli akatoka kumlaki Daudi, akasema, “Jinsi mfalme wa Israeli alivyokuwa mwenye heshima leo! Amejifunua leo mbele ya watumwa wa kike wa watumishi wake, kama vile mmoja wa watu ovyo anavyojifunua bila haya[c]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyumba yake.” Neno la Kiebrania linaweza kumaanisha jengo au jamaa na watumishi wa nyumbani.
    reason: lexical_alternative
  - marker: c
    text: Au “kama vile mmoja wa watu wasiofaa anavyojifunua kabisa.” Muundo wa Kiebrania unasisitiza tendo la kujifunua na hapa unaonyesha dharau ya Mikali.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבָרֵךְ
  choice: kuibariki
  rationale: Kitenzi ‘kubariki’ kinadumisha maana ya Daudi kunuia kuitamkia nyumba yake baraka, bila kuipunguza kuwa salamu tu.
- source_word: בֵּיתוֹ
  choice: nyumba yake
  rationale: ‘Nyumba’ ni Kiswahili cha kawaida kinachoweza kumaanisha makao au watu wa nyumbani, hivyo kinahifadhi upana wa neno la Kiebrania.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Mikali binti Sauli
  rationale: Muundo huu unahifadhi msisitizo wa simulizi juu ya utambulisho wa Mikali kama binti ya Sauli.
- source_word: מַה נִּכְבַּד הַיּוֹם
  choice: Jinsi ... alivyokuwa mwenye heshima leo!
  rationale: Maneno yanadumisha maana ya msingi ya heshima huku muktadha na alama ya mshangao vikifanya kejeli ya Mikali isikike bila kuiingiza moja kwa moja katika tafsiri.
- source_word: נִגְלָה
  choice: amejifunua
  rationale: Kauli ya kujirejelea inaonyesha kwamba Daudi alijifanya aonekane bila kufafanua kwa kupita kiasi kiwango cha uchi kilichohusika.
- source_word: לְעֵינֵי
  choice: mbele ya
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kueleza tendo lililofanyika machoni pa watu wengine.
- source_word: אַמְהוֹת עֲבָדָיו
  choice: vijakazi vya watumishi wake
  rationale: ‘Vijakazi’ huonyesha wanawake wa hadhi ya chini waliokuwa wakihudumu nyumbani; uhusiano wa kimilikishi ‘vya watumishi wake’ umehifadhiwa.
- source_word: כְּהִגָּלוֹת נִגְלוֹת
  choice: anavyojifunua bila haya
  rationale: Muundo wa Kiebrania unasisitiza kujifunua kwa namna ya kudharauliwa; ‘bila haya’ huwasilisha nguvu hiyo katika Kiswahili cha kawaida.
- source_word: אַחַד הָרֵקִים
  choice: mmoja wa watu ovyo
  rationale: ‘Watu ovyo’ huwasilisha dharau ya neno linalomaanisha watu wasiofaa au wasio na thamani, bila kutumia lugha ya mtaani kupita kiasi.
theological_decisions:
- issue: Hadhi ya kijamii katika אַמְהוֹת
  choice: vijakazi
  alternative: watumwa wa kike
  rationale: Neno la Kiebrania linaweza kumaanisha kijakazi au mtumwa wa kike. ‘Vijakazi’ ni la asili zaidi katika sentensi hii na bado linaonyesha utegemezi na hadhi ya chini; tanbihi inahifadhi uwezekano wa tafsiri iliyo wazi zaidi kuhusu utumwa.
- issue: Kiwango cha kujifunua kwa Daudi
  choice: amejifunua
  alternative: amejiweka uchi
  rationale: Kiebrania chenyewe hakilazimishi hitimisho kwamba Daudi alikuwa uchi kabisa. Tafsiri inahifadhi shutuma ya Mikali bila kutatua jambo hilo zaidi ya ushahidi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kauli ya Mikali imetungwa ili kejeli yake isikike kwa kawaida, huku maneno ya msingi kuhusu ‘heshima’ yakihifadhiwa. Jina ‘Mikali’ linafuata umbo linalotumika sana katika Biblia za Kiswahili.
