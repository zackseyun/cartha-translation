  text: וַ/יָּבִ֜אוּ אֶת אֲר֣וֹן יְהוָ֗ה וַ/יַּצִּ֤גוּ אֹת/וֹ֙ בִּ/מְקוֹמ֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָטָה ל֖/וֹ דָּוִ֑ד וַ/יַּ֨עַל דָּוִ֥ד עֹל֛וֹת לִ/פְנֵ֥י יְהוָ֖ה וּ/שְׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/017.yaml
  text: They brought in the ark of Yahweh and set it in its place[a], inside the tent that David had pitched for it. And David offered burnt offerings and peace offerings before Yahweh.
translation:
  language: sw
  text: Wakaliingiza sanduku la Yahwe na kuliweka mahali pake, ndani ya hema ambalo Daudi alikuwa amelipiga kwa ajili yake. Kisha Daudi akatoa mbele za Yahwe sadaka za kuteketezwa na sadaka za amani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka za ushirika,” au “sadaka za hali njema,” kwa neno la Kiebrania שְׁלָמִים.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Wakaliingiza
  rationale: Hifili ya בוא inaonyesha kulifanya sanduku liingie mahali palipotayarishwa; ‘wakaliingiza’ ni ya asili na inaonyesha mwendo wa kuingia.
- source_word: אֲרוֹן יְהוָה
  choice: sanduku la Yahwe
  rationale: אֲרוֹן ni sanduku takatifu la agano, na יְהוָה limetafsiriwa kwa jina la Mungu ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: וַיַּצִּגוּ אֹתוֹ בִּמְקוֹמוֹ
  choice: na kuliweka mahali pake
  rationale: יצג hapa ni kuweka kitu katika nafasi yake maalumu; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: ndani ya hema
  rationale: בְּתוֹךְ inaonyesha mahali pa ndani; tafsiri hii ni fupi na ya asili.
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִד
  choice: ambalo Daudi alikuwa amesimamisha kwa ajili yake
  rationale: נטה katika muktadha wa hema humaanisha kulipiga au kulisimamisha. ‘Alikuwa amesimamisha’ huonyesha kwamba tendo hilo lilitangulia kuingizwa kwa sanduku, na ‘kwa ajili yake’ hurejelea sanduku.
- source_word: וַיַּעַל דָּוִד
  choice: Kisha Daudi akatoa
  rationale: עלה katika muktadha wa dhabihu humaanisha kutoa sadaka; ‘akatoa’ ni Kiswahili cha kawaida na wazi.
- source_word: עֹלוֹת
  choice: sadaka za kuteketezwa
  rationale: עֹלָה ni sadaka iliyoteketezwa; wingi wa neno la Kiebrania umehifadhiwa.
- source_word: וּשְׁלָמִים
  choice: na sadaka za amani
  rationale: שְׁלָמִים ni jina la aina ya sadaka linaloweza kuhusishwa na amani, ushirika, au hali njema. ‘Sadaka za amani’ ni usemi unaotambulika, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: לִפְנֵי humaanisha ‘mbele ya’ au ‘katika uwepo wa’; ‘mbele za Yahwe’ ni usemi wa asili katika muktadha wa ibada.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יְהוָה. ‘Yahwe’ hulihifadhi kama jina la pekee badala ya kulibadilisha kuwa cheo.
- issue: Maana ya שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za hali njema
  rationale: Neno hili lina wigo wa maana unaohusisha amani, ushirika, na hali njema. Tafsiri kuu inatumia usemi unaotambulika, na tanbihi inaacha wazi maana nyingine halali bila kuamua kwa upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa simulizi umewekwa wa asili kwa kutumia ‘Wakaliingiza’ na ‘Kisha Daudi akatoa.’ Alama ya tanbihi imewekwa baada ya ‘sadaka za amani,’ ambako ufafanuzi wake unahusika moja kwa moja.
