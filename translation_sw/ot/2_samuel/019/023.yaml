base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/023.yaml
  text: And David said[a], “What have I to do with you, sons of Zeruiah, that you should be an adversary to me today? Shall any man be put to death in Israel today? For do I not know that today I am king over Israel?”
translation:
  language: sw
  text: Daudi akasema, “Nina nini nanyi, enyi wana wa Seruya, hata leo muwe wapinzani wangu[a]? Je, leo mtu yeyote atauawa katika Israeli? Je, sijui kwamba leo mimi ni mfalme juu ya Israeli?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania hapa ni satan, yaani “mpinzani” au “anayepinga”; hapa si jina maalumu Shetani.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: Nina nini nanyi
  rationale: Ni usemi wa Kiebrania wa kujitenga na msimamo au pendekezo la wengine na kuwakemea. Tafsiri hii fupi inahifadhi nguvu ya swali katika Kiswahili cha heshima.
- source_word: בְּנֵי צְרוּיָה
  choice: enyi wana wa Seruya
  rationale: Hifadhi ya anwani halisi ya kifamilia inayowarejelea Yoabu na Abishai; ‘enyi’ huonyesha wazi kuwa Daudi anazungumza nao moja kwa moja.
- source_word: כִּי תִהְיוּ לִי הַיּוֹם לְשָׂטָן
  choice: hata leo muwe wapinzani wangu
  rationale: שָׂטָן ni nomino ya kawaida yenye maana ya mpinzani au anayepinga katika muktadha huu. Wingi ‘wapinzani’ unapatana kwa kawaida na wana wa Seruya wanaosemeshwa.
- source_word: יוּמַת אִישׁ
  choice: mtu yeyote atauawa
  rationale: Kauli ya kutendwa inahifadhi wazo la mtu kuuawa kwa uamuzi wa mamlaka; ‘mtu yeyote’ huwasilisha matumizi ya jumla ya אִישׁ kwa Kiswahili cha kawaida.
- source_word: הֲלוֹא יָדַעְתִּי
  choice: je, sijui
  rationale: Huhifadhi muundo wa swali la balagha unaotarajia jibu la kukubali.
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: mfalme juu ya Israeli
  rationale: Huhifadhi maana ya moja kwa moja ya kihusishi עַל na kusisitiza mamlaka ya sasa ya Daudi juu ya Israeli.
theological_decisions:
- issue: Maana ya שָׂטָן
  choice: nomino ya kawaida ‘mpinzani’
  alternative: jina maalumu ‘Shetani’
  rationale: Katika simulizi hili neno linaeleza jinsi wana wa Seruya wanavyompinga au kumzuia Daudi. Kulitafsiri kuwa jina maalumu ‘Shetani’ kungeingiza dai la kidemonolojia lisilodaiwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maswali ya balagha na marudio ya ‘leo’ yamehifadhiwa kwa sababu ni sehemu ya msisitizo wa Kiebrania.
