  edition: WLC
  text: וְ/לַֽ/עֲמָשָׂא֙ תֹּֽמְר֔וּ הֲ/ל֛וֹא עַצְמִ֥/י וּ/בְשָׂרִ֖/י אָ֑תָּה כֹּ֣ה יַֽעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף אִם לֹ֠א שַׂר צָבָ֞א תִּהְיֶ֧ה לְ/פָנַ֛/י כָּל הַ/יָּמִ֖ים תַּ֥חַת יוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/014.yaml
  text: And say to Amasa[a], ‘Are you not my bone and my flesh? May God do so to me, and more also, if you are not commander of the army before me all the days in place of Joab.’
translation:
  language: sw
  text: Na mwambieni Amasa, “Je, wewe si mfupa wangu na nyama yangu? Mungu na anitendee hivyo, tena na kuzidisha, ikiwa hutakuwa mkuu wa jeshi mbele yangu daima[a] badala ya Yoabu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “siku zote”; ni usemi unaomaanisha cheo au huduma inayoendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַעֲמָשָׂא תֹּמְרוּ
  choice: Na mwambieni Amasa
  rationale: Kitenzi ni cha nafsi ya pili wingi na kina nguvu ya agizo kwa wale wanaotumwa kusema; “mwambieni” ni Kiswahili cha kawaida na sahihi.
- source_word: הֲלוֹא
  choice: Je, wewe si
  rationale: Huhifadhi umbo la swali la balagha linalotarajia jibu la kukubali.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: mfupa wangu na nyama yangu
  rationale: Huhifadhi kwa karibu taswira halisi ya Kiebrania ya undugu wa damu badala ya kuifupisha kuwa “jamaa yangu.”
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: Mungu na anitendee hivyo, tena na kuzidisha
  rationale: Huu ni mtindo wa kiapo unaoacha adhabu yenyewe bila kutajwa wazi, kama ilivyo katika chanzo.
- source_word: אִם לֹא
  choice: ikiwa hutakuwa
  rationale: Katika kiapo maneno haya yanaanzisha jambo linaloapwa; muundo wa masharti unahifadhi mvutano wa sentensi ya Kiebrania.
- source_word: שַׂר צָבָא
  choice: mkuu wa jeshi
  rationale: Hueleza wazi cheo cha juu cha uongozi wa kijeshi kwa Kiswahili cha sasa.
- source_word: תִּהְיֶה לְפָנַי
  choice: hutakuwa mkuu wa jeshi mbele yangu
  rationale: “Mbele yangu” huhifadhi usemi wa Kiebrania unaoweza kudokeza kuhudumu mbele ya mfalme au chini ya mamlaka yake bila kuufafanua kupita kiasi.
- source_word: כָּל הַיָּמִים
  choice: daima
  rationale: Katika muktadha huu usemi halisi “siku zote” unaonyesha uteuzi au huduma inayoendelea; “daima” ni ya asili katika Kiswahili, huku maana halisi ikiwekwa katika tanbihi.
- source_word: תַּחַת יוֹאָב
  choice: badala ya Yoabu
  rationale: Hapa תַּחַת inaonyesha kuchukua nafasi ya mtu mwingine, si kuwa chini yake.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika kiapo
  choice: Mungu
  alternative: miungu
  rationale: Ingawa umbo la neno ni la wingi kimofolojia, matumizi yake hapa yanamrejelea Mungu wa Israeli kwa maana ya umoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Taswira ya undugu na mtindo wa kiapo wa Kiebrania vimehifadhiwa; “daima” limetumiwa kwa ufasaha na maana halisi imeelezwa katika tanbihi.
