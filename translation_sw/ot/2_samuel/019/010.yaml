base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/010.yaml
  text: And all the people were disputing throughout all the tribes of Israel[a], saying, “The king delivered us from the hand of our enemies, and he rescued us from the hand of the Philistines[c][b], but now he has fled from the land because of Absalom.”
translation:
  language: sw
  text: Katika makabila yote ya Israeli, watu wote walikuwa wakibishana[a], wakisema, “Mfalme alituokoa kutoka mikononi mwa adui zetu, naye alitunusuru kutoka mikononi mwa Wafilisti[b]. Lakini sasa ameikimbia nchi kwa sababu ya Absalomu[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakijadiliana kwa mabishano” au “walikuwa katika mabishano.” Kiebrania kinaonyesha mvutano ulioenea katika makabila, si mazungumzo ya kawaida tu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kutoka mkononi mwa adui zetu” na “kutoka mkononi mwa Wafilisti.” Huu ni usemi wa Kiebrania unaomaanisha kuokolewa kutoka katika nguvu au mamlaka ya mwingine.
    reason: lexical_alternative
  - marker: c
    text: Au “mbali na Absalomu” au “kwa sababu ya Absalomu.” Usemi wa Kiebrania unaweza kumaanisha kwamba mfalme alikimbia kutoka kwa Absalomu au kwa sababu yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָדוֹן
  choice: walikuwa wakibishana
  rationale: Kauli ya Niphal hapa inaonyesha mabishano au mjadala wenye mvutano ulioenea miongoni mwa watu, si mazungumzo ya kawaida tu.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: katika makabila yote ya Israeli
  rationale: Hueleza upeo wa mabishano katika taifa lote, yaani ndani ya makabila yote ya Israeli.
- source_word: הִצִּילָנוּ
  choice: alituokoa
  rationale: Kitenzi kina maana ya kuwaondoa au kuwaokoa watu katika hatari; usemi huu unafaa katika muktadha wa kisiasa na kijeshi.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: kutoka mikononi mwa adui zetu
  rationale: Taswira ya Kiebrania ya ‘mkono’ kama mamlaka au nguvu imehifadhiwa kwa usemi wa Kiswahili unaoeleweka vizuri.
- source_word: מִלְּטָנוּ
  choice: alitukomboa
  rationale: Neno hili linaonyesha kuwaondoa salama katika mamlaka ya adui; ‘alitukomboa’ pia linatofautisha kitenzi hiki na ‘alituokoa’ kilichotangulia huku maana zinazokaribiana zikibaki.
- source_word: מִכַּף פְּלִשְׁתִּים
  choice: kutoka mikononi mwa Wafilisti
  rationale: Usemi uleule wa ‘mkono’ umehifadhiwa ili kuonyesha ulinganifu wa sentensi ya Kiebrania.
- source_word: וְעַתָּה
  choice: Lakini sasa
  rationale: Katika muktadha huu kiunganishi kinaanzisha tofauti kati ya matendo ya mfalme ya zamani na hali yake ya sasa.
- source_word: בָּרַח מִן הָאָרֶץ
  choice: ameikimbia nchi
  rationale: Kauli hii huonyesha tendo la kukimbia ambalo matokeo yake bado yana umuhimu katika hali ya sasa; ‘nchi’ hapa ni eneo la taifa, si dunia kwa ujumla.
- source_word: מֵעַל אַבְשָׁלוֹם
  choice: kwa sababu ya Absalomu
  rationale: Baada ya kitenzi cha kukimbia, kirai hiki ni usemi wa kiidioma unaoonyesha kukimbia kwa sababu ya shinikizo au tishio la Absalomu.
