  yaml_path: translation/ot/2_samuel/019/039.yaml
  text: Then the king said[a], “Let Kimham cross over with me, and I will do for him what seems good in your eyes; and whatever you choose to lay on me, I will do for you.”
translation:
  language: sw
  text: Kisha mfalme akasema, “Kimhamu avuke pamoja nami, nami nitamtendea lililo jema machoni pako; na lolote utakaloniekea[a], nitakutendea.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lolote utakachoniomba, nitakutendea.” Usemi wa Kiebrania ni wa mkato; kwa neno kwa neno ni “lolote utakalochagua juu yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Kisha mfalme akasema
  rationale: Waw-consecutive inaendeleza simulizi; ‘Kisha’ huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: אִתִּי יַעֲבֹר כִּמְהָם
  choice: Kimhamu na avuke pamoja nami
  rationale: Imperfecti ina nguvu ya jussive katika kauli ya moja kwa moja. ‘Na avuke’ huwasilisha uamuzi au mwaliko wa mfalme, huku ‘avuke’ ikihifadhi lugha ya kuvuka Yordani katika muktadha.
- source_word: כִּמְהָם
  choice: Kimhamu
  rationale: Jina limetoholewa kwa mfumo unaofaa matamshi na tahajia ya Kiswahili.
- source_word: וַאֲנִי אֶעֱשֶׂה לוֹ
  choice: nami nitamtendea
  rationale: Kitenzi עשה ni kipana; ‘nitamtendea’ huhifadhi maana ya mfalme kumfanyia Kimhamu jambo bila kubainisha kupita kiasi aina ya wema.
- source_word: אֶת הַטּוֹב בְּעֵינֶיךָ
  choice: yale yaliyo mema machoni pako
  rationale: Kauli hii huhifadhi taswira ya Kiebrania ya jambo kuwa jema machoni mwa anayesemeshwa, na bado inaeleweka kwa Kiswahili cha heshima.
- source_word: וְכֹל אֲשֶׁר תִּבְחַר עָלַי
  choice: na lolote utakalo kuniwekea
  rationale: Usemi wa Kiebrania ni wa mkato na una kihusishi ‘juu yangu.’ ‘Utakalo kuniwekea’ huhifadhi wazo la wajibu unaowekwa kwa mfalme bila kuficha utata huo.
- source_word: אֶעֱשֶׂה לָּךְ
  choice: nitakutendea
  rationale: Huwasilisha ahadi binafsi ya mfalme kwa Barzilai kwa Kiswahili cha kawaida, bila kuongeza kitu kisichotajwa katika Kiebrania.
