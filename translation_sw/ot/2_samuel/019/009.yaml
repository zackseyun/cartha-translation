base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/009.yaml
  text: Then the king arose and sat in the gate[a]. And they told all the people, saying, “Look, the king is sitting in the gate.” Then all the people came before the king. But Israel had fled[b], each man to his tent.
translation:
  language: sw
  text: Ndipo mfalme akainuka, akaketi langoni.[a] Watu wote wakaambiwa, “Tazama, mfalme ameketi langoni.” Basi watu wote wakaja mbele ya mfalme. Lakini Israeli walikuwa wamekimbia,[b] kila mtu hemani kwake.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lango la mji lilikuwa pia mahali pa shughuli za hadharani, maamuzi, na mikutano; hivyo mfalme aliketi mahali ambapo watu wangeweza kumjia.
    reason: cultural_note
  - marker: b
    text: Au, “Na Israeli wakakimbia.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa kwa urahisi kuwa “na”; “lakini” katika maandishi makuu kinaonyesha utofauti wa kimuktadha, na “walikuwa wamekimbia” huwasilisha tendo hilo kama hali iliyotangulia.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “kila mtu hemani kwake,” usemi unaomaanisha kutawanyika na kurudi nyumbani au katika eneo la kabila lake.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: Ndipo mfalme akainuka
  rationale: Kitenzi cha Kiebrania kinaendeleza mfululizo wa simulizi. “Ndipo ... akainuka” ni Kiswahili cha kawaida chenye hadhi na kinahifadhi mwendo huo wa simulizi.
- source_word: וַיֵּשֶׁב בַּשָּׁעַר
  choice: akaketi langoni
  rationale: ישׁב hapa ni kuketi au kuchukua nafasi ya hadharani, na בַּשַּׁעַר inaonyesha eneo la lango. “Langoni” ni ya asili katika Kiswahili bila kuamua kwamba alikuwa ndani au kando kabisa ya jengo la lango.
- source_word: הִגִּידוּ לֵאמֹר
  choice: Watu wote wakaambiwa
  rationale: Kitenzi cha wingi kina mtendaji asiyetajwa. Kauli tendwa ya Kiswahili inahifadhi kutotajwa huko na huepuka kuingiza kundi lisilotambulishwa la “wao”; fomula ya Kiebrania “wakisema” haijahifadhiwa kwa kuwa nukuu ya moja kwa moja tayari inaonyesha usemi.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta usikivu kwa hali inayoonekana sasa. “Tazama” ni la sasa, lenye hadhi, na linafaa katika taarifa ya hadharani.
- source_word: יוֹשֵׁב
  choice: ameketi
  rationale: Hali ya kushiriki ya Kiebrania inaonyesha hali ya mfalme iliyokuwa ikiendelea na kuonekana. “Ameketi” huonyesha kwamba tayari amechukua nafasi yake na bado yupo hapo.
- source_word: וַיָּבֹא כָל הָעָם לִפְנֵי הַמֶּלֶךְ
  choice: Basi watu wote wakaja mbele ya mfalme
  rationale: “Wakaja mbele ya mfalme” huhifadhi picha ya kufika katika uwepo wake wa hadharani bila kuongeza wazo maalumu la sherehe au baraza.
- source_word: וְיִשְׂרָאֵל נָס
  choice: Lakini Israeli walikuwa wamekimbia
  rationale: Wakati timilifu uliopita unaonyesha hali ya nyuma iliyotangulia mkusanyiko huu. “Lakini” huonyesha utofauti wa kimuktadha, huku tanbihi ikihifadhi uwezekano wa kutafsiri kiunganishi kwa urahisi kama “na.” Jina “Israeli” limetumiwa kwa maana ya watu kwa pamoja, hivyo upatanisho wa wingi umetumiwa.
- source_word: אִישׁ לְאֹהָלָיו
  choice: kila mtu akaenda hemani kwake
  rationale: Usemi una maana ya kutawanyika, kila mmoja akirudi mahali pake. “Hema” huhifadhi taswira ya Kiebrania, huku “akaenda” ikiweka wazi mwendo unaodokezwa na kishazi cha mwelekeo.
theological_decisions:
- issue: Usemi wa kugawa wenye nomino ya kiume אִישׁ
  choice: kila mtu
  alternative: kila mwanamume
  rationale: Katika muktadha huu אִישׁ hutumika kama usemi wa kugawa, yaani kila mmoja miongoni mwa waliotawanyika, si dai la kitheolojia kwamba wanaume pekee ndio waliorejea. “Kila mtu” ni Kiswahili cha asili na hakiongezi msisitizo wa kijinsia ambao muktadha hauhitaji.
- issue: Utambulisho wa “Israeli” katika kishazi cha mwisho
  choice: Israeli walikuwa wamekimbia
  alternative: Waisraeli walikuwa wamekimbia
  rationale: Kiebrania kinatumia jina la pamoja יִשְׂרָאֵל. Kulihifadhi kama “Israeli” hudumisha uwezekano wa kulielewa kama taifa au watu kwa pamoja, badala ya kulibadili moja kwa moja kuwa jina la watu binafsi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa urahisi. “Langoni,” “ameketi,” na “kila mtu akaenda hemani kwake” ni miundo ya kawaida isiyo ya kizamani. Jina “Israeli” limeachwa kama jina la pamoja la watu, na tanbihi zinafafanua mazingira ya lango, kiunganishi chenye uwezekano zaidi ya mmoja, na nahau ya kurudi hemani.
