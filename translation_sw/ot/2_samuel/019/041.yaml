    issue: '"kuelekea Gilgali" is less definite than the Hebrew directional expression.'
    rationale: It may suggest movement only in Gilgal's direction, whereas the verse places the king's crossing at/to Gilgal. Replacing it with "hadi Gilgali" preserves the destination without adding interpretation.
  revised_text: Kisha mfalme akavuka hadi Gilgali, naye Kimhamu akavuka pamoja naye. Watu wote wa Yuda walimsindikiza mfalme kuvuka[a], na pia nusu ya watu wa Israeli.
