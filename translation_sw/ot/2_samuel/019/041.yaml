  text: וַ/יַּעֲבֹ֤ר הַ/מֶּ֨לֶךְ֙ הַ/גִּלְגָּ֔לָ/ה וְ/כִמְהָ֖ן עָבַ֣ר עִמּ֑/וֹ וְ/כָל עַ֤ם יְהוּדָה֙ ו/יעברו אֶת הַ/מֶּ֔לֶךְ וְ/גַ֕ם חֲצִ֖י עַ֥ם יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/041.yaml
  text: Then the king crossed over to Gilgal[a], and Kimham crossed over with him. And all the people of Judah escorted the king across, and also half the people of Israel.
translation:
  language: sw
  text: Kisha mfalme akavuka hadi Gilgali, naye Kimhamu akavuka pamoja naye. Watu wote wa Yuda walimsindikiza mfalme kuvuka[a], na pia nusu ya watu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walimvusha mfalme.” Kitenzi cha Kiebrania hapa kinaweza kuwa na maana ya kisababishi, yaani kuwafanya au kumsaidia mfalme kuvuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: akavuka
  rationale: Katika muktadha huu kitenzi עבר kinaonyesha kuvuka Mto Yordani; “akavuka” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: הַגִּלְגָּלָה
  choice: kuelekea Gilgali
  rationale: Herufi ya mwelekeo iliyoambatanishwa na jina la mahali inaonyesha mwendo upande wa Gilgali; “kuelekea” huhifadhi mwelekeo bila kudai kwa lazima kwamba tayari aliwasili.
- source_word: וְכִמְהָן
  choice: naye Kimhamu
  rationale: Jina la mtu limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: עָבַר עִמּוֹ
  choice: akavuka pamoja naye
  rationale: Inarudia kitenzi cha kuvuka na kudumisha uhusiano wa kisimulizi kati ya mfalme na Kimhamu.
- source_word: וְכָל עַם יְהוּדָה
  choice: Watu wote wa Yuda
  rationale: עַם hapa ni watu wa Yuda kama kundi la kisiasa na kijamii; tafsiri hii ni wazi bila kuongeza ufafanuzi.
- source_word: וַיַּעַבְרוּ אֶת־הַמֶּלֶךְ
  choice: walimsindikiza mfalme kuvuka
  rationale: Muundo wenye yambwa ya moja kwa moja unaweza kuwa na maana ya kusababisha au kumsaidia mtu kuvuka; “walimsindikiza ... kuvuka” ni ya asili na inafaa muktadha wa msafara.
- source_word: וְגַם
  choice: na pia
  rationale: Huhifadhi msisitizo wa kuongeza kundi jingine.
- source_word: חֲצִי עַם יִשְׂרָאֵל
  choice: nusu ya watu wa Israeli
  rationale: Huhifadhi kiwango kilichotajwa na tofauti ya kisiasa kati ya Yuda na Israeli bila kuifasiri zaidi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kuelekea Gilgali” limetumiwa kuhifadhi kiambishi cha mwelekeo katika Kiebrania; “walimsindikiza mfalme kuvuka” huwasilisha maana ya kimuktadha huku tanbihi ikihifadhi uwezekano wa maana ya kisababishi.
