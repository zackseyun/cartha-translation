base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/017.yaml
  text: Shimei son of Gera[a], the Benjaminite from Bahurim, hurried and went down with the men of Judah to meet King David.
translation:
  language: sw
  text: Shimei mwana wa Gera, Mbenyamini kutoka Bahurimu, akafanya haraka, akashuka pamoja na watu wa Yuda[a] kwenda kumlaki Mfalme Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mtu wa Yuda”; hapa usemi huo unaeleweka kwa maana ya mkusanyiko, “watu wa Yuda.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: akafanya haraka
  rationale: Kitenzi kinaonyesha hima na uharaka; usemi huu ni wa kawaida katika Kiswahili na unadumisha maana ya simulizi.
- source_word: שִׁמְעִי בֶן גֵּרָא
  choice: Shimei mwana wa Gera
  rationale: Majina yamenukuliwa kwa sauti, huku uhusiano wa kifamilia wa Kiebrania ukihifadhiwa kwa neno ‘mwana wa’.
- source_word: בֶּן הַיְמִינִי
  choice: Mbenyamini
  rationale: Katika muktadha huu usemi huo unaonyesha kabila la Shimei, si jina la baba mwingine.
- source_word: אֲשֶׁר מִבַּחוּרִים
  choice: kutoka Bahurimu
  rationale: Kirai hiki kinataja mahali alikotoka Shimei; muundo huu ni mfupi na wa asili katika Kiswahili.
- source_word: וַיֵּרֶד
  choice: akashuka
  rationale: Tafsiri hii inadumisha mwendo wa kushuka unaotajwa wazi katika maandishi ya Kiebrania.
- source_word: עִם אִישׁ יְהוּדָה
  choice: pamoja na watu wa Yuda
  rationale: Ingawa אִישׁ ni umoja kwa umbo, hapa inaeleweka kwa maana ya mkusanyiko. ‘Watu wa Yuda’ ni Kiswahili cha asili kisichodai kwamba kundi hilo lilikuwa la wanaume pekee.
- source_word: לִקְרַאת
  choice: kwenda kumlaki
  rationale: Kitenzi ‘-laki’ huonyesha kwenda kukutana na mtu anayekuja, hivyo kinafaa kwa mwendo na kusudi linaloelezwa hapa.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Mfalme Daudi
  rationale: Mpangilio huu wa cheo kabla ya jina ni wa kawaida na wenye hadhi katika Kiswahili.
