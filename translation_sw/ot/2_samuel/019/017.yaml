  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wa kawaida na wenye hadhi. Muundo wa vitenzi mfululizo unahifadhi kasi ya simulizi la Kiebrania.
