base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/020.yaml
  text: And he said to the king[a], “Do not let my lord count me guilty, and do not remember how your servant did wrong on the day my lord the king went out from Jerusalem[b], so that the king should take it to heart.”
translation:
  language: sw
  text: Akamwambia mfalme, “Bwana wangu asinhesabie mtumishi wako kosa[a], wala usikumbuke jinsi mtumishi wako alivyotenda vibaya siku ile bwana wangu mfalme alipotoka Yerusalemu, ili mfalme asitie jambo hilo moyoni[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Bwana wangu asinihesabie hatia.” Kihalisi, Kiebrania husema “asinhesabie kosa/hatia kwangu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “ili mfalme asitie moyoni mwake.” Hii ni nahau ya kulichukulia jambo kwa uzito au kulishikilia dhidi ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲשָׁב לִי עָוֺן
  choice: asinipatie hatia
  rationale: Kauli hii huhifadhi wazo la Kiebrania la kumhesabia mtu kosa au hatia, huku ikiwa ya kawaida na inayoeleweka katika Kiswahili cha sasa.
- source_word: תִּזְכֹּר
  choice: usikumbuke
  rationale: Tafsiri ya moja kwa moja huhifadhi ombi la kutolikumbuka kosa kwa namna ambayo ingeleta hatua dhidi ya msemaji.
- source_word: הֶעֱוָה
  choice: alivyotenda vibaya
  rationale: Huwasilisha wazi kukiri tendo baya bila kutumia msamiati wa kale au kufafanua zaidi aina ya kosa.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika hotuba ya heshima mbele ya mfalme, neno hili ni rejeo la unyenyekevu kwa nafsi, hivyo ‘mtumishi wako’ linafaa kuliko ‘mtumwa wako’ katika muktadha huu.
- source_word: יָצָא ... מִירוּשָׁלָם
  choice: alipotoka Yerusalemu
  rationale: Hufuata kitenzi cha Kiebrania kwa karibu na kukumbusha kuondoka kwa Daudi mjini bila kuongeza maelezo yasiyokuwapo katika mstari.
- source_word: לָשׂוּם ... אֶל לִבּוֹ
  choice: asilitie moyoni
  rationale: Nahau hii ya Kiswahili huhifadhi taswira ya moyo na maana ya kulichukulia jambo kwa uzito au kuendelea kulishikilia dhidi ya mtu.
- source_word: אֲדֹנִי
  choice: Bwana wangu
  rationale: Ni cheo cha heshima kwa mfalme, si jina la Mungu; herufi kubwa mwanzoni inatokana na nafasi yake mwanzoni mwa sentensi ya kunukuliwa.
