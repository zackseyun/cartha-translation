lexical_decisions:
- source_word: וַיִּתְגַּנֵּב ... לָבוֹא
  choice: wakaingia ... kwa kujificha
  rationale: Kitenzi cha Kiebrania kinaonyesha kutenda kwa siri au bila kuonekana; usemi huu ni wa asili katika Kiswahili na unaepuka maana ya kuiba.
- source_word: הַנִּכְלָמִים
  choice: walioona aibu
  rationale: Huwasilisha hali ya kuaibika au kufedheheka kwa lugha ya kawaida na yenye heshima.
- source_word: בְּנוּסָם בַּמִּלְחָמָה
  choice: wanapokimbia vitani
  rationale: Huhifadhi maana ya kukimbia kutoka mapambanoni bila kuongeza maelezo yasiyomo katika chanzo.
- source_word: יִתְגַּנֵּב הָעָם
  choice: watu ... hujiondoa kwa kujificha
  rationale: Katika nusu ya pili, muktadha unaelekea kuondoka kwa siri; ‘hujiondoa’ hudumisha mwelekeo huo na kulifanya linganisho lieleweke.
