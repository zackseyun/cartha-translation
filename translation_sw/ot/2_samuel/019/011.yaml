  text: וְ/אַבְשָׁלוֹם֙ אֲשֶׁ֣ר מָשַׁ֣חְנוּ עָלֵ֔י/נוּ מֵ֖ת בַּ/מִּלְחָמָ֑ה וְ/עַתָּ֗ה לָ/מָ֥ה אַתֶּ֛ם מַחֲרִשִׁ֖ים לְ/הָשִׁ֥יב אֶת הַ/מֶּֽלֶךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/011.yaml
  text: And Absalom[a], whom we anointed over us, died in battle. So now why are you silent about bringing the king back?
translation:
  language: sw
  text: Naye Absalomu, tuliyemtia mafuta atutawale, amekufa vitani. Basi sasa, kwa nini mnakaa kimya[a] kuhusu kumrudisha mfalme?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa nini hamsemi lolote kuhusu kumrudisha mfalme?”
    reason: Njia nyingine ya kutafsiri מַחֲרִשִׁים, ambayo kimsingi humaanisha kuwa au kukaa kimya.
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם
  choice: Naye Absalomu
  rationale: Kiunganishi וְ kinaendeleza maneno yaliyotangulia; “naye” ni muunganisho wa kawaida wa Kiswahili bila kulazimisha maana ya upinzani.
- source_word: מָשַׁחְנוּ עָלֵינוּ
  choice: tuliyemtia mafuta atutawale
  rationale: “Kumtia mafuta” huhifadhi tendo halisi la kisiasa na la kifalme la מָשַׁח, huku “atutawale” ikitoa maana ya עָלֵינוּ kwa Kiswahili cha kawaida.
- source_word: מֵת בַּ/מִּלְחָמָה
  choice: amekufa vitani
  rationale: Kauli hii inaeleza tukio lililokamilika lenye athari kwa hali ya sasa; “amekufa vitani” ni ya asili na yenye maana hiyo katika Kiswahili.
- source_word: וְ/עַתָּה
  choice: Basi sasa
  rationale: Maneno haya yanaunganisha kauli iliyotangulia na hitimisho lake la kimatendo.
- source_word: מַחֲרִשִׁים
  choice: mnakaa kimya
  rationale: Kitenzi kina maana ya kuwa au kuendelea kimya. Tafsiri hii haibadilishi ukimya huo kuwa kusitasita tu.
- source_word: לְ/הָשִׁיב אֶת הַ/מֶּלֶךְ
  choice: kuhusu kumrudisha mfalme
  rationale: Hiphil ya שׁוּב humaanisha kusababisha arudi, yaani kumrudisha; “kuhusu” huunganisha jambo hilo kwa kawaida na usemi “mnakaa kimya.”
theological_decisions:
- issue: Matumizi ya מָשַׁח kuhusu Absalomu
  choice: tuliyemtia mafuta
  alternative: tuliyemweka kuwa mfalme
  rationale: Ingawa Absalomu alikuwa mpinzani wa Daudi katika simulizi, Kiebrania kinatumia kitenzi cha kawaida cha kutia mafuta. Kukihifadhi huepuka kuingiza hukumu ya kimadhehebu au ya mfasiri na hudumisha uzito wa tendo la kumweka mtawala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku lugha ya kutia mafuta na ukimya ikihifadhi picha na mvutano wa Kiebrania.
