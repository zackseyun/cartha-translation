translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa shtaka umehifadhi mabadiliko ya Kiebrania kutoka kumsemesha mfalme moja kwa moja (‘wamekuiba’) hadi kumtaja kama ‘mfalme.’
