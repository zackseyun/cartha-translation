  text: וְ/הִנֵּ֛ה כָּל אִ֥ישׁ יִשְׂרָאֵ֖ל בָּאִ֣ים אֶל הַ/מֶּ֑לֶךְ וַ/יֹּאמְר֣וּ אֶל הַ/מֶּ֡לֶךְ מַדּוּעַ֩ גְּנָב֨וּ/ךָ אַחֵ֜י/נוּ אִ֣ישׁ יְהוּדָ֗ה וַ/יַּעֲבִ֨רוּ אֶת הַ/מֶּ֤לֶךְ וְ/אֶת בֵּית/וֹ֙ אֶת הַ/יַּרְדֵּ֔ן וְ/כָל אַנְשֵׁ֥י דָוִ֖ד עִמּֽ/וֹ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/042.yaml
  text: And behold[a], all the men of Israel came to the king and said to the king, “Why have our brothers, the men of Judah, stolen you away and brought the king and his household across the Jordan[b], and all David’s men with him?”
translation:
  language: sw
  text: Tazama, watu wote wa Israeli[a] walimjia mfalme, wakamwambia, “Kwa nini ndugu zetu, watu wa Yuda, wamekuiba[b], wakamvusha mfalme pamoja na watu wa nyumbani kwake ng’ambo ya Yordani, na watu wote wa Daudi waliokuwa pamoja naye?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kwa mtindo wa lugha ya kiume inayowakilisha kundi, kihalisi, “kila mtu mwanamume wa Israeli”; pia “watu wa Yuda” ni kirai cha kiume chenye maana ya kundi.
    reason: cultural_note
  - marker: b
    text: Au “wamekuchukua kwa siri.” Kiebrania kimetumia kitenzi cha kawaida cha “kuiba” kama sitiari ya kitendo cha Yuda kumchukua mfalme bila kuwashirikisha Waisraeli wengine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Inadumisha kazi ya neno hilo ya kuvuta fikira na kuleta uhai katika simulizi, kwa lugha yenye heshima na inayoeleweka.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: watu wote wa Israeli
  rationale: Kirai hicho ni cha umoja kwa umbo lakini kina maana ya kundi. ‘Watu wote wa Israeli’ ni Kiswahili cha kawaida, huku tanbihi ikihifadhi habari kwamba Kiebrania kimetumia lugha ya kiume inayowakilisha kundi.
- source_word: בָּאִים
  choice: wakamjia
  rationale: Ingawa Kiebrania kimetumia umbo la participle, muktadha wa simulizi unaruhusu wakati uliopita wa mfululizo; ‘wakamjia’ pia hudokeza kumwendea mfalme.
- source_word: גְּנָבוּךָ
  choice: wamekuiba
  rationale: Inahifadhi sitiari kali ya kitenzi cha kawaida ‘kuiba’ badala ya kuilegeza kuwa kuchukua tu; hapa shtaka ni kwamba Yuda walimchukua mfalme bila kuwashirikisha wengine.
- source_word: אַחֵינוּ אִישׁ יְהוּדָה
  choice: ndugu zetu, watu wa Yuda
  rationale: ‘Ndugu zetu’ inadumisha lugha ya kindugu katika mgogoro wa ndani ya Israeli, na ‘watu wa Yuda’ huwasilisha maana ya kundi kwa Kiswahili cha asili.
- source_word: וַיַּעֲבִרוּ
  choice: wakamvusha ... ng’ambo
  rationale: Inawasilisha kwa uwazi umbo la kisababishi la kitenzi, yaani kumfanya avuke au kumpeleka upande wa pili.
- source_word: בֵּיתוֹ
  choice: watu wa nyumbani mwake
  rationale: Katika muktadha huu ‘nyumba’ humaanisha kaya au jamaa ya mfalme, si jengo; tafsiri hii inaepuka maana potovu ya jengo.
- source_word: הַיַּרְדֵּן
  choice: Yordani
  rationale: Hili ndilo jina la kawaida la mto huo katika Kiswahili; neno ‘Mto’ si lazima kwa kuwa muktadha wa kuvuka unatosha.
- source_word: וְכָל אַנְשֵׁי דָוִד עִמּוֹ
  choice: na watu wote wa Daudi waliokuwa pamoja naye
  rationale: Inahifadhi kiunganishi ‘na,’ kundi lote la watu wa Daudi, na wazo la kwamba walikuwa pamoja na mfalme.
