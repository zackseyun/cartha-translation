  text: בֶּן שְׁמֹנִ֣ים שָׁנָה֩ אָנֹכִ֨י הַ/יּ֜וֹם הַ/אֵדַ֣ע בֵּין ט֣וֹב לְ/רָ֗ע אִם יִטְעַ֤ם עַבְדְּ/ךָ֙ אֶת אֲשֶׁ֤ר אֹכַל֙ וְ/אֶת אֲשֶׁ֣ר אֶשְׁתֶּ֔ה אִם אֶשְׁמַ֣ע ע֔וֹד בְּ/ק֖וֹל שָׁרִ֣ים וְ/שָׁר֑וֹת וְ/לָ/מָּה֩ יִֽהְיֶ֨ה עַבְדְּ/ךָ֥ עוֹד֙ לְ/מַשָּׂ֔א אֶל אֲדֹנִ֖/י הַ/מֶּֽלֶךְ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/036.yaml
  text: I am eighty years old today[a]. Can I still distinguish between good and evil? Can your servant taste what I eat and what I drink? Can I still hear the voice of male singers and female singers? Why then should your servant still be a burden to my lord the king?
translation:
  language: sw
  text: Mimi leo nina umri wa miaka themanini. Je, bado naweza kutofautisha mema na mabaya[a]? Je, mtumishi wako anaweza kuonja ninachokula na ninachokunywa? Je, bado naweza kusikia sauti za waimbaji wa kiume na wa kike? Kwa nini basi mtumishi wako aendelee kuwa mzigo kwa bwana wangu mfalme?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupambanua kati ya mema na mabaya.” Msemo wa Kiebrania unaweza kumaanisha utambuzi wa kimaadili au wa kiutendaji; hapa muktadha wa uzee na kudhoofika kwa hisi unaelekeza kwenye maana pana ya uwezo wa kufanya uamuzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁמֹנִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: Mimi leo nina umri wa miaka themanini
  rationale: Kirai cha Kiebrania kwa umri kimetafsiriwa kwa Kiswahili cha kawaida; “mimi” inadumisha msisitizo wa אָנֹכִי, na “leo” inawakilisha הַיּוֹם.
- source_word: הַאֵדַע בֵּין טוֹב לְרָע
  choice: Je, bado naweza kutofautisha mema na mabaya?
  rationale: ידע בין huonyesha uwezo wa kupambanua. “Mema na mabaya” huhifadhi upana wa msemo, ambao unaweza kurejelea uamuzi wa kimaadili au utambuzi wa kiutendaji unaodhoofishwa na uzee.
- source_word: אִם יִטְעַם עַבְדְּךָ
  choice: Je, mtumishi wako anaweza kuonja
  rationale: אִם ina nguvu ya swali la balagha katika mfululizo huu; יטעם ni “kuonja,” na עבדך ni namna ya heshima ya kujitaja mbele ya mfalme.
- source_word: אֶת אֲשֶׁר אֹכַל וְאֶת אֲשֶׁר אֶשְׁתֶּה
  choice: ninachokula na ninachokunywa
  rationale: Ujenzi wa virejeshi umetolewa kwa Kiswahili cha asili bila kuongeza maana isiyokuwapo.
- source_word: אֶשְׁמַע עוֹד בְּקוֹל שָׁרִים וְשָׁרוֹת
  choice: bado naweza kusikia sauti za waimbaji wa kiume na wa kike
  rationale: “Bado” inawakilisha עוֹד; maumbo tofauti ya kiume na ya kike katika שרים ושרות yamehifadhiwa wazi.
- source_word: לְמַשָּׂא
  choice: kuwa mzigo
  rationale: Neno linatumika hapa kwa maana ya sitiari ya kuwa usumbufu au jukumu zito kwa mfalme, si mzigo halisi wa kubebwa.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Hii ni namna ya kawaida ya heshima kwa mfalme wa kibinadamu; “bwana” imeandikwa kwa herufi ndogo.
theological_decisions:
- issue: Upana wa maana katika טוֹב לְרָע
  choice: mema na mabaya
  alternative: jema na baya; mema na maovu
  rationale: Tafsiri hii haifungi msemo katika maadili pekee wala kuondoa uwezekano huo; muktadha wa uzee na kudhoofika kwa hisi unaunga mkono maana pana ya uwezo wa kupambanua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Maswali ya balagha yamedumishwa, pamoja na lugha ya heshima ya mtumishi akizungumza na mfalme.
