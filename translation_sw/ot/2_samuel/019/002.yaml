base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/002.yaml
  text: And it was reported to Joab, “Look, the king is weeping and mourning over Absalom.”
translation:
  language: sw
  text: Yoabu akaambiwa, “Tazama, mfalme analia na kumwombolezea Absalomu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: akaambiwa
  rationale: Kauli tendwa ya Hofali inaonyesha kwamba habari hiyo ilijulishwa kwa Yoabu bila kumtaja mtoa habari. “Akaambiwa” ni ya asili katika Kiswahili na inadumisha kauli tendwa.
- source_word: לְיוֹאָב
  choice: Yoabu
  rationale: Kiambishi cha mtendewa kimejumuishwa katika kitenzi “akaambiwa”; jina limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwenye habari inayofuata na kuhifadhi msisitizo na uharaka wa taarifa.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Kichwa hiki chenye uainisho kinamtaja Daudi katika muktadha; kimetafsiriwa kama cheo badala ya kubadilishwa kuwa jina lake.
- source_word: בֹּכֶה
  choice: analia
  rationale: Hali ya kushiriki inaonyesha tendo linaloendelea; wakati wa sasa wa Kiswahili unatoa maana hiyo kwa kawaida.
- source_word: וַיִּתְאַבֵּל
  choice: na kumwombolezea
  rationale: Kitenzi cha Hitpaeli cha אבל kinaeleza kuomboleza kwa sababu ya aliyekufa. Muundo huu unaunganisha hali hiyo na kulia huku ukionyesha Absalomu kuwa anayeliliwa.
- source_word: עַל אַבְשָׁלֹם
  choice: Absalomu
  rationale: עַל pamoja na kitenzi cha kuomboleza humtaja mtu ambaye ni sababu au mlengwa wa maombolezo; kiambishi “-mw-” katika “kumwombolezea” kinabeba uhusiano huo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Tazama” limedumishwa ili kuhifadhi nguvu ya הִנֵּה, huku sentensi nyingine ikitumia mpangilio wa kawaida wa Kiswahili.
