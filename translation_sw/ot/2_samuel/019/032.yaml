  yaml_path: translation/ot/2_samuel/019/032.yaml
  text: And Barzillai the Gileadite had come down from Rogelim[a], and he crossed the Jordan with the king to send him off at the Jordan.
translation:
  language: sw
  text: Barzilai, Mgileadi, alikuwa ameshuka kutoka Rogelimu,[a] naye akavuka Yordani pamoja na mfalme ili kumsindikiza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alishuka kutoka Rogelimu, akavuka Yordani pamoja na mfalme ili kumuaga.” Kiebrania kinaruhusu namna tofauti kidogo za kueleza jinsi Barzilai alivyoandamana na mfalme kwenye Yordani.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַרְזִלַּי
  choice: Barzilai
  rationale: Jina la mtu limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: הַגִּלְעָדִי
  choice: Mgileadi
  rationale: Kivumishi cha asili ya eneo kimetafsiriwa kwa umbo la kawaida la Kiswahili linalomtambulisha mtu wa Gileadi.
- source_word: יָרַד
  choice: alikuwa ameshuka
  rationale: Wakati timilifu unaonyesha kwamba kushuka kutoka Rogelimu kulitangulia tendo linalofuata la kuvuka.
- source_word: מֵרֹגְלִים
  choice: kutoka Rogelimu
  rationale: Kihusishi מֵ kimetafsiriwa moja kwa moja, na jina la mahali limetoholewa.
- source_word: וַיַּעֲבֹר אֶת הַמֶּלֶךְ
  choice: naye akavuka Yordani pamoja na mfalme
  rationale: Ingawa אֶת kwa kawaida ni alama ya yambwa, hapa muktadha wa mwendo unaonyesha Barzilai aliandamana na mfalme katika kuvuka; Kiswahili cha asili kinahitaji 'pamoja na mfalme'.
- source_word: הַיַּרְדֵּן
  choice: Yordani
  rationale: Hili ndilo umbo la kawaida la Kiswahili kwa jina la mto; neno 'Mto' si lazima kwa sababu muktadha unaweka wazi maana yake.
- source_word: לְשַׁלְּחוֹ
  choice: ili amsindikize
  rationale: Kitenzi hiki katika muktadha kinaonyesha kusudi la kuandamana na mfalme na kumwona akiendelea na safari yake; 'amsindikize' ni Kiswahili cha kawaida.
- source_word: אֶת ב/ירדן
  choice: alipokuwa akivuka mto huo
  rationale: Maandishi yaliyopokelewa mwishoni mwa mstari yana ugumu wa kisintaksia; tafsiri hii inaeleza kwa tahadhari kwamba usindikizaji ulihusiana na kuvuka Yordani bila kudai kwa nguvu mahali hasa pa kuagana.
