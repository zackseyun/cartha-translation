  text: For your servant would only cross the Jordan a little way with the king[a]; why should the king repay me with this reward?
translation:
  language: sw
  text: Kwa maana mimi, mtumishi wako, ningevuka Yordani pamoja na mfalme kwa umbali mfupi tu; kwa nini basi mfalme anilipe kwa malipo haya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinatumia kitenzi na nomino zenye mzizi mmoja, גמל, na hivyo kusisitiza wazo la kulipa au kutoa malipo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּ/מְעַט
  choice: Kwa maana ... kwa umbali mfupi tu
  rationale: כִּי linaanzisha sababu ya kukataa kwa Barzilai, na מְעַט linaonyesha kwamba angeandamana na mfalme kwa muda au umbali mfupi tu.
- source_word: יַעֲבֹר
  choice: nitavuka
  rationale: Kauli ya nafsi ya tatu katika Kiebrania inaambatana na kujitaja kwa unyenyekevu kama ‘mtumishi wako’; Kiswahili cha kawaida hubadili kwa nafsi ya kwanza ili sentensi iwe ya asili bila kupoteza maana ya tendo linalokusudiwa.
- source_word: עַבְדְּךָ
  choice: mimi mtumishi wako
  rationale: Hii ni lugha ya kawaida ya kujinyenyekeza mbele ya mfalme, si lazima dai la utumwa wa kisheria.
- source_word: אֶת הַ/יַּרְדֵּן
  choice: nitavuka Yordani
  rationale: Pamoja na kitenzi עבר, neno hili linaonyesha kuvuka Mto Yordani; umbo fupi ‘Yordani’ ni la kawaida katika tafsiri za Biblia za Kiswahili.
- source_word: אֶת הַ/מֶּלֶךְ
  choice: pamoja na mfalme
  rationale: Hapa אֶת ni kihusishi chenye maana ya kuandamana ‘pamoja na,’ wala si kiashiria cha yambwa.
- source_word: וְ/לָמָּה
  choice: kwa nini basi
  rationale: Linaanzisha swali la balagha la kukataa kwa adabu ukarimu mkubwa wa mfalme.
- source_word: יִגְמְלֵ/נִי ... הַ/גְּמוּלָה הַ/זֹּאת
  choice: anilipe kwa malipo haya
  rationale: Kitenzi na nomino za Kiebrania zinatokana na mzizi mmoja גמל. Urudiaji wa ‘lipe/malipo’ unahifadhi msisitizo huo kwa Kiswahili kinachoeleweka.
