base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/027.yaml
  text: And he has slandered your servant to my lord the king[a], for your servant said, ‘I will saddle the donkey for myself so that I may ride on it and go with the king,’ because your servant is lame.
translation:
  language: sw
  text: Akasema, “Bwana wangu, mfalme, mtumishi wangu amenidanganya[a]. Kwa maana mimi, mtumishi wako, nilisema, ‘Nitamtandika punda kwa ajili yangu, ili nimpande na niende pamoja na mfalme,’ kwa sababu mimi, mtumishi wako, ni kiwete.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “amenihadaa” au “amenisaliti.” Kitenzi cha Kiebrania kinaweza kumaanisha kumdanganya mtu au kumtendea kwa hila; muktadha unaonyesha kwamba mtumishi huyo alimwakilisha vibaya mbele ya mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Akasema
  rationale: Kitenzi hiki cha usimulizi kimetafsiriwa wazi kwa kuwa kipo katika matini ya Kiebrania, ingawa hakionekani katika safu ya Kiingereza iliyotolewa.
- source_word: רִמָּנִי
  choice: amenidanganya
  rationale: Kitenzi רמה katika muktadha huu kinaeleza kutendewa kwa udanganyifu. ‘Amenidanganya’ ni Kiswahili cha kawaida na huacha wazi ikiwa udanganyifu huo ulihusisha taarifa ya uongo, usaliti, au yote mawili.
- source_word: עַבְדִּי
  choice: mtumishi wangu
  rationale: Katika mazingira ya nyumba ya kifalme, ‘mtumishi’ humfaa mhudumu binafsi bila kusisitiza hadhi ya utumwa ambayo si kiini cha sentensi.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Bwana wangu mfalme
  rationale: Hifadhi ya namna rasmi na yenye heshima ya kumwelekea mfalme; mpangilio huu ni wa asili katika Kiswahili cha hadhi.
- source_word: אֶחְבְּשָׁה לִּי הַחֲמוֹר
  choice: Nitamtandika punda kwa ajili yangu
  rationale: Nafsi ya kwanza na dhamira ya msemaji zimehifadhiwa. ‘Kumtandika punda’ ni usemi wa kawaida wa kumwekea matandiko ili awe tayari kupandwa.
- source_word: וְאֶרְכַּב עָלֶיהָ
  choice: ili nimpande
  rationale: ‘Ili’ huonyesha kwa kawaida uhusiano wa kusudi uliomo katika mfuatano wa vitenzi, na ngeli ya punda imetumiwa kwa upatanisho wa Kiswahili.
- source_word: וְאֵלֵךְ אֶת־הַמֶּלֶךְ
  choice: na kwenda pamoja na mfalme
  rationale: הלך pamoja na אֶת hapa huonyesha kuandamana; ‘pamoja na’ huepuka maana ya kwenda kumfikia mfalme.
- source_word: פִסֵּחַ
  choice: kiwete
  rationale: Neno hili linaeleza ulemavu wa kutembea kwa usahihi na kwa ufupi. Limetumika kama kiarifu baada ya ‘ni’.
- source_word: עַבְדְּךָ
  choice: mimi mtumishi wako
  rationale: Ni namna ya kujitaja kwa unyenyekevu mbele ya mfalme. Kuongeza ‘mimi’ hufanya marejeo yajieleze kwa uwazi na kwa Kiswahili cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa mazungumzo ya kifalme lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya ‘mtumishi wako’ yamehifadhiwa kwa sababu ni sehemu ya unyenyekevu wa kauli ya asili.
