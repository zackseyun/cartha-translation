  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na hadhi ya maandiko. Tanbihi ya Kiingereza kuhusu tofauti ya “go/come” haikuhitajika, kwa kuwa “kwenda” limetafsiriwa moja kwa moja katika matini.
