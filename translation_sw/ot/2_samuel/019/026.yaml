base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/026.yaml
  text: And when he came to Jerusalem to meet the king[a], the king said to him, “Why did you not go with me, Mephibosheth?”
translation:
  language: sw
  text: Ikawa alipofika Yerusalemu kumlaki mfalme, mfalme akamwambia, “Kwa nini hukuenda pamoja nami, Mefiboshethi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Ikawa alipofika
  rationale: Muundo huu unaendeleza simulizi na kuanzisha tukio jipya kwa Kiswahili cha asili bila kupoteza uhusiano wa wakati.
- source_word: בָא יְרוּשָׁלַם
  choice: alipofika Yerusalemu
  rationale: בוא hapa inaeleza kufika kwake Yerusalemu; “alipofika” ni ya kawaida na wazi katika muktadha huu.
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: kumlaki mfalme
  rationale: לקראת huonyesha kwenda kukutana na mtu anayekuja; “kumlaki” huwasilisha maana hiyo kwa ufupi na kwa lugha yenye hadhi.
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: mfalme akamwambia
  rationale: Inadumisha mhusika aliyetajwa wazi katika Kiebrania na mtiririko wa kawaida wa simulizi la Kiswahili.
- source_word: לָמָּה לֹא הָלַכְתָּ עִמִּי
  choice: Kwa nini hukuenda pamoja nami
  rationale: “Kwenda” huhifadhi maana ya msingi ya הלך na mtazamo wa mfalme kuhusu safari yake ya awali; “pamoja nami” hufafanua עִמִּי kwa Kiswahili cha kawaida.
- source_word: מְפִיבֹשֶׁת
  choice: Mefiboshethi
  rationale: Unukuzi wa jina la Kiebrania unaolingana na mazoea ya kawaida ya majina ya Biblia katika Kiswahili.
