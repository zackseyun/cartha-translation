base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/029.yaml
  text: For all my father's house were nothing but men deserving death before my lord the king[a], yet you set your servant among those who eat at your table. So what further right do I have[b], that I should cry out any more to the king?
translation:
  language: sw
  text: Kwa maana nyumba yote ya baba yangu haikuwa chochote mbele ya bwana wangu mfalme isipokuwa watu waliostahili kuuawa[a]. Lakini ulimweka mtumishi wako miongoni mwa wale wanaokula mezani pako. Basi, nina haki gani tena ya kumlilia mfalme[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “watu wa kifo,” yaani, watu waliokuwa chini ya hukumu ya kifo au waliostahili kuuawa.
    reason: lexical_alternative
  - marker: b
    text: “Haki” hapa inatafsiri neno la Kiebrania tsedaqah kwa maana ya dai la haki au ustahiki halali, si hasa uadilifu wa mtu binafsi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי לֹא הָיָה ... כִּי אִם
  choice: haikuwa chochote ... isipokuwa
  rationale: Muundo huu unasisitiza kwamba familia yote haikuhesabiwa kuwa kitu kingine ila watu waliokuwa chini ya hukumu ya kifo; Kiswahili hiki kinafikisha ukomo huo kwa kawaida.
- source_word: כָּל בֵּית אָבִי
  choice: nyumba yote ya baba yangu
  rationale: Hifadhi picha ya Kiebrania ya ‘nyumba’ ikimaanisha ukoo au familia pana, na usemi huu unaeleweka katika Kiswahili cha kibiblia cha sasa.
- source_word: אַנְשֵׁי מָוֶת
  choice: watu waliostahili kuuawa
  rationale: Nahau haimaanishi watu ambao tayari wamekufa, bali watu waliohesabiwa kuwa chini ya hukumu au adhabu ya kifo.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: mbele ya bwana wangu mfalme
  rationale: Kihusishi kinaonyesha hadhi yao kwa uamuzi wa mfalme; ‘mbele ya’ kinaeleza uhusiano huo bila kudai kwamba walikuwapo mahali fulani kimwili.
- source_word: וַתָּשֶׁת
  choice: Lakini ulimweka
  rationale: Kitenzi ni ‘kuweka’; ‘lakini’ kinaonyesha wazi tofauti kati ya kustahili kifo na kupewa nafasi ya heshima mezani mwa mfalme.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Hapa ni namna ya unyenyekevu ya kujitaja mbele ya mfalme, si lazima iwe taarifa ya hali ya utumwa.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: miongoni mwa wale wanaokula mezani pako
  rationale: Tafsiri hii ni ya kawaida na huhifadhi picha ya kushirikishwa miongoni mwa watu waliopata fadhila ya kula pamoja na mfalme.
- source_word: וּמַה יֶּשׁ לִי עוֹד צְדָקָה
  choice: Basi, nina haki gani zaidi
  rationale: צְדָקָה hapa ni dai la haki au msingi halali wa kuomba, si hasa uadilifu wa tabia binafsi.
- source_word: וְלִזְעֹק עוֹד אֶל הַמֶּלֶךְ
  choice: hata niendelee kumlilia mfalme
  rationale: זעק ni kulia au kupaza sauti kwa ombi au malalamiko. ‘Kumlilia’ huwasilisha ombi lenye uzito, huku ‘niendelee’ ikibeba maana ya עוֹד.
