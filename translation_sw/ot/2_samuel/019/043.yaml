base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/043.yaml
  text: Then every man of Judah answered the man of Israel[a], “Because the king is a close relative to me[b]. So why has this matter made you angry? Have we eaten at all at the king’s expense? Or has he given us any gift?”
translation:
  language: sw
  text: Ndipo watu wote wa Yuda wakawajibu watu wa Israeli[a], “Kwa sababu mfalme yuko karibu nasi[b]. Kwa nini basi mnakasirika kwa jambo hili? Je, tumekula chochote kwa gharama ya mfalme? Au tumepokea zawadi yoyote[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa halisi kina “mtu wa Yuda” na “mtu wa Israeli,” lakini maneno hayo yanawakilisha makundi yote mawili.
    reason: literal_form
  - marker: b
    text: Kiebrania kwa halisi, “mfalme yuko karibu nami”; hapa huenda maana yake ni ukaribu wa ukoo au wa kabila.
    reason: lexical_alternative
  - marker: c
    text: Kifungu cha mwisho cha Kiebrania ni kigumu; kinaweza kutafsiriwa, “Au je, kitu chochote kimebebwa kuletwa kwetu?”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: Ndipo ... wakawajibu
  rationale: Muundo wa wayyiqtol unaendeleza simulizi na kuonyesha jibu; ‘Ndipo’ ni mtiririko wa kawaida wa simulizi ya Kiswahili.
- source_word: כָּל אִישׁ יְהוּדָה ... אִישׁ יִשְׂרָאֵל
  choice: watu wote wa Yuda ... watu wa Israeli
  rationale: Ingawa Kiebrania kina nomino ya umoja yenye maana ya mkusanyiko, Kiswahili cha kawaida hutumia wingi wazi kwa makundi haya mawili.
- source_word: כִּי קָרוֹב הַמֶּלֶךְ אֵלַי
  choice: Kwa sababu mfalme ni wa jamaa yetu ya karibu
  rationale: קָרוֹב hapa inaelekea kuonyesha ukaribu wa ukoo au kabila; ‘wa jamaa yetu ya karibu’ huwasilisha hoja hiyo bila kuifanya iwe tu ukaribu wa mahali.
- source_word: וְלָמָּה זֶּה חָרָה לְךָ עַל הַדָּבָר הַזֶּה
  choice: Kwa nini basi mmekasirika kwa jambo hili?
  rationale: חָרָה ni nahau ya kuwaka kwa hasira; tafsiri ya moja kwa moja ya maana ni ya asili zaidi katika Kiswahili.
- source_word: הֶאָכוֹל אָכַלְנוּ מִן הַמֶּלֶךְ
  choice: Je, tumekula chochote kwa gharama ya mfalme?
  rationale: Kitenzi-jina pamoja na kitenzi kilichotimilika kinasisitiza swali la kukana. ‘Chochote’ hubeba msisitizo huo, na ‘kwa gharama ya mfalme’ huonyesha manufaa ya mali yanayodokezwa katika muktadha.
- source_word: אִם נִשֵּׂאת נִשָּׂא לָנוּ
  choice: Au tumepokea zawadi yoyote?
  rationale: Kifungu hiki cha Kiebrania ni kigumu. Tafsiri hii hudumisha ulinganifu na swali la kwanza kuhusu kupata manufaa, huku tanbihi ikihifadhi usomaji wa karibu zaidi na maneno ya Kiebrania.
