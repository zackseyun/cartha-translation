base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/013.yaml
  text: You are my brothers[a]; you are my own bone and flesh[c][b]. So why should you be the last to bring back the king?
translation:
  language: sw
  text: Ninyi ni ndugu zangu[a]; ninyi ni mfupa wangu na nyama yangu[b]. Basi, kwa nini muwe wa mwisho kumrudisha mfalme?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana ya kimuktadha, “jamaa zangu”; kihalisi, “ndugu zangu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mfupa wangu na nyama yangu,” nahau inayomaanisha uhusiano wa karibu wa damu.'
    reason: cultural_note
  - marker: c
    text: Daudi anajitaja kwa nafsi ya tatu kuwa “mfalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: ndugu zangu
  rationale: Huhifadhi maana ya moja kwa moja ya Kiebrania na, katika muktadha huu, huonyesha pia uhusiano wa karibu wa ukoo kati ya Daudi na watu wa Yuda.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: mfupa wangu na nyama yangu
  rationale: Huhifadhi taswira halisi ya nahau ya Kiebrania inayomaanisha uhusiano wa karibu wa damu.
- source_word: וְלָמָה
  choice: Basi, kwa nini
  rationale: Kiunganishi kinaonyesha kwamba swali hili linatokana na kauli iliyotangulia kuhusu undugu.
- source_word: תִּהְיוּ אַחֲרֹנִים
  choice: muwe wa mwisho
  rationale: Huwasilisha swali la ushawishi lenye nguvu ya kuhimiza, si utabiri wa kawaida tu.
- source_word: לְהָשִׁיב
  choice: kumrudisha
  rationale: Kauli ya kusababisha ya kitenzi שוב hapa ina maana ya kumsababisha mfalme arudi, yaani kumrudisha.
- source_word: אֶת־הַמֶּלֶךְ
  choice: mfalme
  rationale: Huhifadhi nafsi ya tatu iliyotumiwa na Daudi badala ya kuibadili kuwa 'mimi.'
