translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. “Basi” linaunganisha matokeo haya na tukio lililotangulia. Alama zote za tanbihi zimewekwa katika matini kuu.
