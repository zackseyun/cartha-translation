base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/003.yaml
  text: So the victory on that day was turned into mourning for all the people[a], because on that day the people heard it said[b], “The king is grieved over his son.”
translation:
  language: sw
  text: Basi ushindi wa siku hiyo ukageuka kuwa maombolezo kwa watu wote[a], kwa sababu siku hiyo watu walisikia ikisemwa[b], “Mfalme ana huzuni kwa ajili ya mwanawe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wokovu wa siku hiyo ukawa maombolezo.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “watu walisikia, wakisema”; huu ni usemi wa kuripoti taarifa au jambo lililosemwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשֻׁעָה
  choice: ushindi
  rationale: Katika muktadha huu wa kijeshi baada ya vita, neno hili linaonyesha matokeo ya kufanikiwa au kuokolewa vitani. “Ushindi” ni la kawaida na wazi katika Kiswahili, bila kulipa neno maana ya kidini isiyolazimishwa na muktadha.
- source_word: וַתְּהִי ... לְאֵבֶל
  choice: ukageuka kuwa maombolezo
  rationale: Muundo wa Kiebrania unasema kwa karibu kwamba ushindi ‘ukawa maombolezo.’ “Ukageuka kuwa” huonyesha kwa Kiswahili cha kawaida badiliko kubwa kutoka shangwe ya ushindi kwenda maombolezo.
- source_word: אֵבֶל
  choice: maombolezo
  rationale: Neno hili humaanisha hali au tendo la kuomboleza, hasa kwa namna ya kijamii au ya hadharani; hivyo “maombolezo” linafaa kwa watu wote kuliko huzuni ya ndani pekee.
- source_word: הָעָם
  choice: watu
  rationale: Ingawa katika muktadha hawa hasa ni watu waliopigana upande wa Daudi, chanzo kinatumia neno la jumla “watu.” Tafsiri hii inalinda upana huo bila kulibadili kuwa “jeshi” au “askari.”
- source_word: כִּי שָׁמַע ... לֵאמֹר
  choice: kwa sababu ... watu walisikia ikisemwa
  rationale: Muundo huu wa Kiebrania huanzisha taarifa iliyosikiwa. “Walisikia ikisemwa” ni Kiswahili cha kawaida kinachowasilisha maana hiyo bila kutumia tafsiri sisisi isiyo ya kawaida, “walisikia, wakisema.”
- source_word: נֶעֱצַב
  choice: amehuzunika
  rationale: Kitenzi hiki kinaeleza kutiwa uchungu au huzuni. “Amehuzunika” ni cha kawaida, chenye uzito unaofaa, na kinaonyesha hali ya mfalme kutokana na mwanawe.
- source_word: עַל בְּנוֹ
  choice: kwa ajili ya mwanawe
  rationale: Kihusishi עַל hapa kinaonyesha sababu au jambo linalomhuzunisha mfalme. “Kwa ajili ya mwanawe” ni usemi wa asili katika Kiswahili na hauamui wazi ikiwa mwana ndiye sababu, mhusika, au kitu kinachohusu huzuni hiyo.
