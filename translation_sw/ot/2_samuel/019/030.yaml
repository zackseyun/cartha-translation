base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/030.yaml
  text: 'Then the king said to him[b][a], “Why do you keep speaking of your affairs? I have decided: you and Ziba shall divide the land.”'
translation:
  language: sw
  text: 'Ndipo mfalme akamwambia, “Kwa nini uendelee kusema mambo yako? Nimeamua hivi: wewe na Siba mtagawana ardhi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר ... הַמֶּלֶךְ
  choice: Ndipo mfalme akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” huonyesha mfuatano kwa Kiswahili cha kawaida, na לֹו imetafsiriwa wazi kuwa “akamwambia.”
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Hili ndilo swali la moja kwa moja na la kawaida kwa Kiswahili.
- source_word: תְּדַבֵּר עוֹד
  choice: uendelee kusema
  rationale: עוֹד pamoja na kitenzi cha hali isiyotimilika huonyesha kuendelea au kusema zaidi; tafsiri hii inadumisha maana bila kuzidisha ukali wa mfalme.
- source_word: דְּבָרֶיךָ
  choice: mambo yako
  rationale: דבר inaweza kumaanisha maneno, jambo, au shauri. Katika muktadha wa mgogoro huu, “mambo yako” ni pana na ya asili, huku ikiepuka kuifanya kuwa istilahi rasmi ya kisheria.
- source_word: אָמַרְתִּי
  choice: Nimeamua hivi
  rationale: Kimsingi ni “nimesema/nilisema,” lakini hapa kauli ya mfalme ni uamuzi wenye mamlaka. “Nimeamua hivi” huwasilisha nguvu hiyo ya kiutendaji kwa Kiswahili cha kawaida.
- source_word: אַתָּה וְצִיבָא
  choice: wewe na Siba
  rationale: Kiwakilishi kimehifadhiwa kwa msisitizo, na “Siba” ni uwasilishaji unaofaa wa jina צִיבָא katika Kiswahili.
- source_word: תַּחְלְקוּ
  choice: mtagawana
  rationale: Hali isiyotimilika hapa hutoa hukumu au agizo la mfalme. “Mtagawana” huonyesha kwamba hao wawili watagawana kitu hicho.
- source_word: הַשָּׂדֶה
  choice: ardhi
  rationale: Ingawa neno hilo linaweza kumaanisha “shamba,” katika mgogoro huu wa mali linahusu ardhi au milki kwa upana; “ardhi” inafaa kwa muktadha.
