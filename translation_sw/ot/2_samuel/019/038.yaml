base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/038.yaml
  text: Please let your servant return[a], that I may die in my own city, by the grave of my father and my mother. But here is your servant Kimham; let him cross over with my lord the king[b], and do for him what is good in your eyes.
translation:
  language: sw
  text: Tafadhali niruhusu, mimi mtumishi wako, nirudi, ili nife katika mji wangu, karibu na kaburi la baba yangu na mama yangu.[a] Lakini huyu hapa mtumishi wako Kimhamu; na avuke pamoja na bwana wangu mfalme, nawe umtendee lile unaloona kuwa jema.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa tafsiri ya moja kwa moja ni “pamoja na kaburi la baba yangu na mama yangu”; huenda maana yake ni “karibu na kaburi,” yaani azikwe mahali pa maziko ya familia.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa tafsiri ya moja kwa moja ni “lile lililo jema machoni pako”; yaani, “lile unaloona kuwa jema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשָׁב נָא
  choice: Tafadhali, mruhusu ... arudi
  rationale: Kitenzi שׁוּב katika qal kinamaanisha kurudi, na נָא huipa kauli hii uzito wa ombi la heshima; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Hapa ni namna ya Barzilai kujitaja kwa unyenyekevu mbele ya mfalme, si msisitizo juu ya hali ya utumwa.
- source_word: וְאָמֻת
  choice: ili nife
  rationale: Kiunganishi pamoja na kitenzi kisichotimilika kinaeleweka kama kusudi linalofuata ombi la kurudi.
- source_word: בְּעִירִי
  choice: katika mji wangu
  rationale: Huwasilisha umilikaji wa nafsi ya kwanza kwa njia ya moja kwa moja na ya asili.
- source_word: עִם קֶבֶר אָבִי וְאִמִּי
  choice: karibu na kaburi la baba yangu na mama yangu
  rationale: Ingawa עִם kwa kawaida ni ‘pamoja na,’ katika muktadha huu wa kifo na maziko maana ya kiasili ni kuwa karibu na kaburi la familia.
- source_word: וְהִנֵּה
  choice: Lakini huyu hapa
  rationale: Huwasilisha nguvu ya kuonyesha mtu aliyepo huku ikionyesha tofauti kati ya ombi la Barzilai na pendekezo lake kuhusu Kimhamu.
- source_word: כִמְהָם
  choice: Kimhamu
  rationale: Jina la mtu limetoholewa kwa matamshi yanayofaa Kiswahili.
- source_word: יַעֲבֹר עִם
  choice: na avuke pamoja na
  rationale: Hali ya kitenzi hapa ina nguvu ya ombi au ruhusa; ‘avuke’ pia inadumisha picha ya kuvuka mto katika simulizi.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Ni kauli ya heshima kwa mfalme na inadumisha sajili ya kifalme bila kudokeza fundisho maalumu.
- source_word: וַעֲשֵׂה לוֹ
  choice: nawe umtendee
  rationale: עשה pamoja na ל ina maana ya kumfanyia mtu jambo; ‘umtendee’ ni ya asili na inaunganika vizuri na kinachofuata.
- source_word: אֵת אֲשֶׁר טוֹב בְּעֵינֶיךָ
  choice: lile unaloona kuwa jema
  rationale: Hii huwasilisha maana ya nahau ya Kiebrania kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi picha halisi ya ‘macho.’
