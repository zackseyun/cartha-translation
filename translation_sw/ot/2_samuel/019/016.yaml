  yaml_path: translation/ot/2_samuel/019/016.yaml
  text: Then the king returned and came as far as the Jordan[a], and Judah came to Gilgal to go to meet the king, to bring the king across the Jordan.
translation:
  language: sw
  text: Kisha mfalme akarudi, akafika hadi Yordani; watu wa Yuda[a] wakaja Gilgali ili kwenda kumlaki mfalme na kumvusha Yordani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia jina “Yuda” kwa maana ya pamoja, yaani watu au kabila la Yuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: Kitenzi cha Kiebrania שוב katika mfuatano wa simulizi kinaonyesha kuwa mfalme alirudi baada ya kukimbia; “akarudi” ni usemi wa kawaida na wa moja kwa moja.
- source_word: וַיָּבֹא עַד הַיַּרְדֵּן
  choice: akafika hadi Yordani
  rationale: Muundo בוא pamoja na עַד unaonyesha kufika kwenye mpaka au mahali fulani bila kusema kwamba tayari alivuka; “hadi Yordani” huhifadhi maana hiyo.
- source_word: וִיהוּדָה
  choice: Yuda[a]
  rationale: Maandishi yanataja “Yuda” kwa ufupi kama jina la pamoja linalowakilisha watu au kabila la Yuda. Tanbihi inafafanua matumizi hayo bila kulipanua kimya kimya katika matini kuu.
- source_word: בָּא
  choice: walikuwa wamefika
  rationale: Qatal inayofuata mfuatano wa wayyiqtol inaweza kutoa taarifa ya nyuma kuhusu kufika kwa Yuda kabla ya kwenda kumlaki mfalme; umbo hili la Kiswahili linaonyesha uhusiano huo wa wakati kwa njia ya kawaida.
- source_word: הַגִּלְגָּלָה
  choice: Gilgali
  rationale: He ya mwelekeo iliyoambatanishwa na jina la mahali inaonyesha mwendo wa kwenda Gilgali; katika Kiswahili, kitenzi “kufika” tayari hueleza kufika mahali, hivyo kihusishi cha ziada hakihitajiki.
- source_word: לָלֶכֶת לִקְרַאת
  choice: ili kwenda kumlaki
  rationale: 'Vitenzi-jina hivi vinaonyesha kusudi na vinahifadhi hatua zote mbili: kwenda na kumlaki. “Kumlaki” ni neno la heshima linaloeleweka katika simulizi rasmi.'
- source_word: לְהַעֲבִיר אֶת הַמֶּלֶךְ אֶת הַיַּרְדֵּן
  choice: na kumvusha Yordani
  rationale: Hiphil ya עבר ina maana ya kusababisha mtu avuke. “Kumvusha” huhifadhi maana ya kisababishi bila kudai njia maalumu, kama mashua au kivuko.
