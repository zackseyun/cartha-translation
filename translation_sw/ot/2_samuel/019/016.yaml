translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye hadhi. Jina “Yuda” limeachwa kama jina la pamoja ili kufuata ufupi wa Kiebrania, huku upatanisho wa wingi “walikuwa” ukionyesha kuwa maana yake ni watu wa Yuda.
