  text: וְ/עַתָּה֙ ק֣וּם צֵ֔א וְ/דַבֵּ֖ר עַל לֵ֣ב עֲבָדֶ֑י/ךָ כִּי֩ בַ/יהוָ֨ה נִשְׁבַּ֜עְתִּי כִּי אֵינְ/ךָ֣ יוֹצֵ֗א אִם יָלִ֨ין אִ֤ישׁ אִתְּ/ךָ֙ הַ/לַּ֔יְלָה וְ/רָעָ֧ה לְ/ךָ֣ זֹ֗את מִ/כָּל הָ/רָעָה֙ אֲשֶׁר בָּ֣אָה עָלֶ֔י/ךָ מִ/נְּעֻרֶ֖י/ךָ עַד עָֽתָּה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/008.yaml
  text: Now get up[a], go out, and speak to the heart of your servants, for I swear by Yahweh that if you do not go out, not a man will stay with you tonight, and this will be worse for you than all the trouble that has come upon you from your youth until now.
translation:
  language: sw
  text: Sasa inuka, utoke nje, ukazungumze na watumishi wako kwa kuwatia moyo[a], kwa maana ninaapa kwa Yahweh kwamba usipotoka, hakuna hata mtu mmoja atakayebaki pamoja nawe usiku huu. Jambo hili litakuwa baya zaidi kwako kuliko taabu zote zilizokupata tangu ujana wako mpaka sasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “sema kwa moyo wa watumishi wako,” nahau yenye maana ya kusema nao kwa fadhili, kuwapa moyo, au kuwasihi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Ni kiashiria cha mpito wa haraka katika hotuba; “Basi sasa” linaunganisha onyo hili na yaliyotangulia huku likidumisha uzito wa wakati huu.
- source_word: קוּם צֵא
  choice: inuka, utoke
  rationale: 'Amri zote mbili zimehifadhiwa: kwanza Daudi ainuke, kisha aende nje aliko jeshi.'
- source_word: וְדַבֵּר עַל־לֵב
  choice: ukazungumze na mioyo ya
  rationale: Usemi wa Kiebrania umehifadhiwa kwa uwazi wa kimaandishi; hapa unamaanisha kusema kwa namna ya kuwafariji, kuwatia moyo, au kuwavuta kwa maneno.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Katika mazingira ya kifalme neno hili linawahusu watu walio chini ya mfalme au wanaomtumikia, bila kulazimisha maana ya utumwa wa mali.
- source_word: כִּי בַיהוָה נִשְׁבַּעְתִּי
  choice: kwa maana ninaapa kwa Yahwe
  rationale: Kauli hii ina nguvu ya kiapo cha moja kwa moja, na jina la agano יהוה limetafsiriwa “Yahwe.”
- source_word: אֵינְךָ יוֹצֵא אִם
  choice: usipotoka
  rationale: Muundo wa sharti wa Kiswahili unaeleza kwa kawaida na moja kwa moja hali inayosababisha onyo linalofuata.
- source_word: יָלִין אִישׁ אִתְּךָ הַלַּיְלָה
  choice: hakuna mtu hata mmoja atakayebaki pamoja nawe usiku huu
  rationale: לין hapa ni kubaki au kukaa usiku; “mtu hata mmoja” inadumisha msisitizo wa kuachwa kabisa.
- source_word: וְרָעָה לְךָ זֹאת מִכָּל־הָרָעָה
  choice: Jambo hili litakuwa baya zaidi kwako kuliko taabu zote
  rationale: Muundo linganishi umeelezwa wazi. “Taabu” linaonyesha misiba na shida zilizompata Daudi, si uovu wa kimaadili.
- source_word: מִנְּעֻרֶיךָ עַד עָתָּה
  choice: tangu ujana wako mpaka sasa
  rationale: Usemi huu unahifadhi kipindi chote kinachotajwa, kuanzia ujana wa Daudi hadi wakati wa tukio hili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina la agano יהוה moja kwa moja; “Yahwe” hulitambulisha kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Nguvu ya kiapo cha Yoabu
  choice: ninaapa kwa Yahwe
  alternative: nimeapa kwa Yahwe
  rationale: Kauli ya sasa ya Kiswahili inawasilisha kiapo kinachotamkwa kwa nguvu wakati huo bila kuongeza maelezo ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kihistoria lakini kinachoeleweka kwa msomaji wa kawaida. Amri ni za moja kwa moja na kali kama katika chanzo; nahau ya Kiebrania imehifadhiwa katika matini na kufafanuliwa katika tanbihi.
