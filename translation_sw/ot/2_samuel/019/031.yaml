base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/031.yaml
  text: Mephibosheth said to the king[a], “Let him even take it all, since my lord the king has come safely to his own house.”
translation:
  language: sw
  text: Mefiboshethi akamwambia mfalme, “Hata achukue yote, kwa kuwa bwana wangu mfalme amefika salama[a] nyumbani kwake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya moja kwa moja zaidi, “kwa amani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa simulizi wa Kiebrania unaendeleza mfuatano wa matukio; “akamwambia” ni wa kawaida na pia huhifadhi yule anayeambiwa kupitia kiambishi -mw-.
- source_word: מְפִיבֹשֶׁת
  choice: Mefiboshethi
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili inayokaribia matamshi ya jina la Kiebrania.
- source_word: אֶל הַמֶּלֶךְ
  choice: mfalme
  rationale: Chanzo kinatumia cheo chenye kibainishi, si jina la Daudi; kiambishi cha yambwa katika “akamwambia” kinawasilisha maana ya “kwa mfalme.”
- source_word: גַּם אֶת הַכֹּל יִקָּח
  choice: Hata achukue yote
  rationale: “Hata” huonyesha msisitizo wa גַּם, “yote” huhifadhi ujumla wa הַכֹּל, na hali ya utegemezi katika “achukue” huwasilisha ukubali wa hiari wenye nguvu ya jussive.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: kwa kuwa
  rationale: Katika muktadha huu kirai kina nguvu ya sababu inayotokana na tukio lililotimia; “kwa kuwa” ni Kiswahili cha asili bila kuondoa uhusiano huo.
- source_word: בָּא
  choice: amefika
  rationale: Kauli timilifu huonyesha kuwasili kulikokamilika na kunakohusiana moja kwa moja na maneno ya sasa.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Huhifadhi namna ya heshima ya kumtaja mfalme bila kuongeza jina lake.
- source_word: בְּשָׁלוֹם
  choice: salama
  rationale: Katika muktadha wa kurudi kwa mfalme, maana kuu ni kufika bila madhara; tafsiri ya karibu zaidi “kwa amani” imehifadhiwa katika tanbihi.
- source_word: אֶל בֵּיתוֹ
  choice: nyumbani kwake
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kurudi kwenye nyumba au makao yake mwenyewe.
