  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na wenye heshima. Sentensi zimegawanywa ili orodha ndefu isomeke kwa urahisi, bila kuondoa viunganishi au mahusiano ya wahusika. Alama ya tanbihi imewekwa baada ya kirai kinachohusika.
