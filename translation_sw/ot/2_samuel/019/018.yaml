  text: וְ/אֶ֨לֶף אִ֣ישׁ עִמּ/וֹ֮ מִ/בִּנְיָמִן֒ וְ/צִיבָ֗א נַ֚עַר בֵּ֣ית שָׁא֔וּל וַ/חֲמֵ֨שֶׁת עָשָׂ֥ר בָּנָ֛י/ו וְ/עֶשְׂרִ֥ים עֲבָדָ֖י/ו אִתּ֑/וֹ וְ/צָלְח֥וּ הַ/יַּרְדֵּ֖ן לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/018.yaml
  text: and a thousand men from Benjamin with him[a], and Ziba, the servant of Saul’s house, with his fifteen sons and his twenty servants; they crossed the Jordan before the king.
translation:
  language: sw
  text: Na wanaume elfu moja kutoka Benyamini walikuwa pamoja naye. Pia alikuwapo Siba, mtumishi wa nyumba ya Sauli, akiwa pamoja na wanawe kumi na watano na watumishi wake ishirini. Wakavuka Yordani mbele ya mfalme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakiwa mbele ya mfalme kwa kumtangulia.” Maneno ya Kiebrania yanaweza kumaanisha kuwa katika uwepo wa mfalme au kuwa mbele yake kwa nafasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף אִישׁ
  choice: wanaume elfu moja
  rationale: Ni usemi wa kawaida wa kuhesabu wanaume; unadumisha maana ya wingi wa kiume na idadi kamili.
- source_word: מִבִּנְיָמִן
  choice: kutoka Benyamini
  rationale: Unaonyesha asili au uhusiano wao na kabila la Benyamini kwa lugha fupi na ya kawaida.
- source_word: צִיבָא
  choice: Siba
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: נַעַר בֵּית שָׁאוּל
  choice: mtumishi wa nyumba ya Sauli
  rationale: Ingawa נַעַר pia inaweza kumaanisha kijana au mhudumu, muktadha unaonyesha nafasi ya Siba ya utumishi katika nyumba ya Sauli; “nyumba” inadumisha maana ya kaya na ukoo wa kifalme.
- source_word: וַחֲמֵשֶׁת עָשָׂר בָּנָיו
  choice: akiwa pamoja na wanawe kumi na watano
  rationale: Muundo huu unaonyesha kwa kawaida kwamba wana hao walikuwa sehemu ya msafara wa Siba.
- source_word: וְעֶשְׂרִים עֲבָדָיו
  choice: na watumishi wake ishirini
  rationale: עֶבֶד inaweza kuwa mtumishi au mtumwa; hapa orodha ya watu wa nyumbani inaelezwa bila kusisitiza hadhi yao ya kisheria, kwa hiyo “watumishi” inafaa zaidi.
- source_word: וְצָלְחוּ
  choice: Wakavuka
  rationale: Katika muktadha wa Yordani, kitenzi kinaonyesha tendo la kuvuka; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: הַיַּרְדֵּן
  choice: Yordani
  rationale: Jina hili linatambulika katika Kiswahili; neno “Mto” si lazima kwa kuwa muktadha unaonyesha kinachorejelewa.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: mbele ya mfalme
  rationale: Usemi huu wa Kiswahili unadumisha uwezekano wa kuwa katika uwepo wa mfalme au kuwa mbele yake kwa nafasi.
