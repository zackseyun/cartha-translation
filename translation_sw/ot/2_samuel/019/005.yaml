  text: And the king covered his face[a], and the king cried out with a loud voice, “My son Absalom! Absalom, my son, my son!”
translation:
  language: sw
  text: Mfalme akafunika uso wake[a], kisha akalia kwa sauti kubwa, “Mwanangu Absalomu! Absalomu, mwanangu, mwanangu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akajifunika uso” au “akaufunika uso wake.” Kitenzi cha Kiebrania kinaonyesha kufunika uso kwa huzuni.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאַט
  choice: akafunika
  rationale: Kitenzi hiki katika muktadha huu kinaonyesha kuufunika uso kwa huzuni. ‘Akafunika’ ni Kiswahili cha kawaida na hakibainishi kupita kiasi namna alivyofanya hivyo.
- source_word: פָּנָיו
  choice: uso wake
  rationale: Kiima cha tendo na alama ya yambwa vinaonyesha maana halisi ya uso, si maana pana ya kuwapo kwake.
- source_word: וַיִּזְעַק
  choice: akalia
  rationale: Kitenzi kinaeleza kilio kikubwa. ‘Akalia’ kinafaa kwa muktadha wa maombolezo bila kuingiza maana ya hasira; ukubwa wa kilio unaelezwa na kirai kinachofuata.
- source_word: קוֹל גָּדוֹל
  choice: kwa sauti kubwa
  rationale: Hiki ni kirai cha Kiebrania kinachomaanisha sauti au kilio kikubwa; tafsiri hii ni ya kawaida, wazi, na huhifadhi mkazo wake.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Nomino hii ni ya umoja wa kiume yenye kiambishi cha nafsi ya kwanza na inamtaja Absalomu kuwa mwana wa Daudi. ‘Mwanangu’ ni sahihi na yenye nguvu ya kihisia.
- source_word: אַבְשָׁלוֹם
  choice: Absalomu
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: repetition of אַבְשָׁלוֹם / בְּנִי
  choice: “Mwanangu Absalomu! Absalomu, mwanangu, mwanangu!”
  rationale: Marudio yote yamehifadhiwa kwa sababu yanaonyesha kina cha huzuni ya mfalme; uakifishaji unafanya maombolezo yasomeke kwa kawaida katika Kiswahili.
