  text: וַ/יָּבֹ֥א יוֹאָ֛ב אֶל הַ/מֶּ֖לֶךְ הַ/בָּ֑יִת וַ/יֹּאמֶר֩ הֹבַ֨שְׁתָּ הַ/יּ֜וֹם אֶת פְּנֵ֣י כָל עֲבָדֶ֗י/ךָ הַֽ/מְמַלְּטִ֤ים אֶֽת נַפְשְׁ/ךָ֙ הַ/יּ֔וֹם וְ/אֵ֨ת נֶ֤פֶשׁ בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ וְ/נֶ֣פֶשׁ נָשֶׁ֔י/ךָ וְ/נֶ֖פֶשׁ פִּלַגְשֶֽׁי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/006.yaml
  text: Then Joab came into the house to the king and said[a], “Today you have put to shame all your servants who today saved your life, and the lives of your sons and your daughters[c][b], and the lives of your wives and your concubines.”
translation:
  language: sw
  text: Ndipo Yoabu akaingia nyumbani[b] kwa mfalme, akamwambia, “Leo umewaaibisha[a] watumishi wako wote, ambao leo wameokoa maisha yako[c], na maisha ya wana wako wa kiume na binti zako, na maisha ya wake zako na masuria wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “umezitia aibu nyuso za watumishi wako wote.”
    reason: lexical_alternative
  - marker: b
    text: “Nyumba” hapa huenda inamaanisha makao ya kifalme, yaani ikulu.
    reason: cultural_note
  - marker: c
    text: 'Kiebrania: nefesh, hapa likimaanisha uhai wa kimwili, si “roho.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּיִת
  choice: nyumbani
  rationale: Neno la Kiebrania linamaanisha kihalisi ‘nyumba’; katika muktadha huu ni makao ya mfalme, huenda ikulu. ‘Nyumbani kwa mfalme’ ni Kiswahili cha kawaida kisicholazimisha maana finyu kuliko chanzo.
- source_word: הֹבַשְׁתָּ ... אֶת־פְּנֵי
  choice: umewaaibisha
  rationale: Hifili ya בוש ina maana ya kusababisha aibu. Ingawa Kiebrania kinatumia usemi halisi ‘umezitia aibu nyuso za,’ Kiswahili cha sasa huwasilisha maana hiyo kwa kawaida zaidi kwa ‘umewaaibisha.’
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Katika mazingira ya kijeshi na kifalme, neno hili linaweza kuwahusu watumishi au raia wa mfalme. ‘Watumishi wako’ huhifadhi uhusiano wao na mfalme bila kuwafanya maafisa pekee.
- source_word: הַמְמַלְּטִים
  choice: ambao ... wameokoa
  rationale: Kitenzi מלט hapa kinamaanisha kuokoa au kunusuru kutoka katika hatari. ‘Wameokoa’ kinafaa kwa muktadha wa kuhifadhi uhai.
- source_word: נַפְשְׁךָ
  choice: maisha yako
  rationale: נפש hapa humaanisha uhai wa kimwili, si ‘roho’ kama sehemu isiyo ya mwili.
- source_word: נֶפֶשׁ בָּנֶיךָ ... וּבְנֹתֶיךָ ... נָשֶׁיךָ ... פִּלַגְשֶׁיךָ
  choice: maisha ya wanao na binti zako, na maisha ya wake zako na masuria wako
  rationale: Kurudiwa kwa נפש kunahusu kuokolewa kwao wasife. Kurudia ‘maisha’ kwa makundi hayo mawili huhifadhi kiasi cha msisitizo wa Kiebrania kwa Kiswahili kinachoeleweka.
- source_word: פִּלַגְשֶׁיךָ
  choice: masuria wako
  rationale: ‘Masuria’ ni istilahi sahihi ya wanawake waliokuwa katika mahusiano yaliyotambuliwa lakini yenye hadhi ya chini kuliko wake, bila kuongeza hukumu ya kimaadili.
- source_word: וַיָּבֹא ... וַיֹּאמֶר
  choice: Ndipo Yoabu akaingia ... akamwambia
  rationale: Mfuatano wa wayyiqtol unasogeza simulizi mbele. ‘Ndipo ... aka-’ ni mtiririko wa kawaida wa masimulizi ya Kiswahili.
theological_decisions:
- issue: Kutafsiri majina ya mahusiano ya kifamilia bila kuingiza hukumu ya kimaadili
  choice: wake zako na masuria wako
  alternative: wake zako na wake wako wa hadhi ya pili
  rationale: Matini inataja makundi yaliyokuwamo katika nyumba ya Daudi kwa lugha ya kijamii ya wakati huo. Tafsiri inadumisha tofauti hiyo ya kihistoria bila kuipamba wala kuilaani.
- issue: Maana ya נפש katika muktadha huu
  choice: maisha
  alternative: roho
  rationale: Muktadha ni kuokolewa kutoka katika kifo, kwa hiyo ‘maisha’ huwasilisha maana ya uhai wa watu bila kuingiza mgawanyo wa kiteolojia wa mwili na roho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa sasa na hadhi inayofaa matini ya Biblia. Usemi wa Kiebrania kuhusu ‘nyuso’ umewekwa katika tanbihi ili sentensi kuu ibaki ya kawaida; ‘masuria’ limetumiwa kwa usahihi wa kihistoria.
