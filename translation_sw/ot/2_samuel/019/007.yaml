source:
  edition: WLC
  text: לְ/אַֽהֲבָה֙ אֶת שֹׂ֣נְאֶ֔י/ךָ וְ/לִ/שְׂנֹ֖א אֶת אֹהֲבֶ֑י/ךָ כִּ֣י הִגַּ֣דְתָּ הַ/יּ֗וֹם כִּ֣י אֵ֤ין לְ/ךָ֙ שָׂרִ֣ים וַ/עֲבָדִ֔ים כִּ֣י יָדַ֣עְתִּי הַ/יּ֗וֹם כִּ֠י לא אַבְשָׁל֥וֹם חַי֙ וְ/כֻלָּ֤/נוּ הַ/יּוֹם֙ מֵתִ֔ים כִּי אָ֖ז יָשָׁ֥ר בְּ/עֵינֶֽי/ךָ־־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/007.yaml
  text: to love those who hate you and to hate those who love you[a]. For you have made it clear today that commanders and servants mean nothing to you; for I know today that if Absalom were alive and all of us were dead today[b], then it would be right in your eyes.
translation:
  language: sw
  text: kwa kuwapenda wanaokuchukia na kuwachukia wanaokupenda. Kwa maana leo umeonyesha wazi kwamba makamanda na watumishi hawana maana yoyote kwako.[a] Maana leo ninajua kwamba kama Absalomu angekuwa hai na sisi sote tungekuwa tumekufa leo,[b] jambo hilo lingekuwa sawa machoni pako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “leo umetangaza kwamba huna makamanda wala watumishi.” Nahau hiyo ina maana kwamba kwa maoni yako watu hao hawana thamani.
    reason: lexical_alternative
  - marker: b
    text: Au, “laiti Absalomu angekuwa hai na sisi sote tungekuwa tumekufa leo.” Maneno ya Yoabu ni shtaka kali kuhusu hali iliyo kinyume na uhalisi, wala si taarifa halisi ya maneno ambayo Daudi alisema.
    reason: alternative_reading
lexical_decisions:
- source_word: לְאַהֲבָה
  choice: kwa kuwapenda
  rationale: Infinitivu yenye ל inaendeleza shtaka la Yoabu kutoka muktadha uliotangulia; “kwa kuwapenda” ni ya kawaida katika Kiswahili na inadumisha hali ya kitendo.
- source_word: שֹׂנְאֶיךָ
  choice: wanaokuchukia
  rationale: Partisipio limetumika kama nomino; tafsiri hii inadumisha nguvu ya kitenzi badala ya kuifasiri tu kuwa “adui zako.”
- source_word: וְלִשְׂנֹא אֶת אֹהֲבֶיךָ
  choice: na kuwachukia wanaokupenda
  rationale: Muundo sambamba na kishazi cha kwanza unahifadhi ukinzani wa balagha kati ya kupenda na kuchukia.
- source_word: הִגַּדְתָּ
  choice: umeonyesha wazi
  rationale: Katika muktadha huu mwenendo wa Daudi, si kauli yake tu, ndio umeweka jambo hilo wazi.
- source_word: שָׂרִים
  choice: makamanda
  rationale: Muktadha ni wa kijeshi na kisiasa, hivyo “makamanda” inafaa zaidi kuliko “wakuu” au “maafisa” kwa ujumla.
- source_word: עֲבָדִים
  choice: watumishi
  rationale: Neno linawahusu walio katika utumishi wa mfalme kwa upana; “watumishi” huepuka kulifanya lihusu utumwa wa mali pekee.
- source_word: אֵין לְךָ שָׂרִים וַעֲבָדִים
  choice: makamanda na watumishi hawana maana yoyote kwako
  rationale: Kauli ya Kiebrania inaeleza kutowajali kwa vitendo, si kwamba watu hao hawapo; tafsiri hii inawasilisha nguvu ya shutuma kwa Kiswahili cha kawaida.
- source_word: יָדַעְתִּי
  choice: ninajua
  rationale: 'Kauli timilifu ina nguvu ya hali ya sasa: Yoabu anataja hitimisho alilolifikia kutokana na matukio ya siku hiyo.'
- source_word: לֹא אַבְשָׁלוֹם חַי וְכֻלָּנוּ הַיּוֹם מֵתִים
  choice: kama Absalomu angekuwa hai na sisi sote tungekuwa tumekufa leo
  rationale: Muktadha unahitaji shtaka kali la hali iliyo kinyume na uhalisi; muundo wa masharti unaonyesha kwamba Yoabu anadai Daudi angependelea matokeo hayo.
- source_word: יָשָׁר בְּעֵינֶיךָ
  choice: jambo hilo lingekuwa sawa machoni pako
  rationale: Tafsiri hii inadumisha nahau na uzito wa kimaadili wa kile kilicho “sawa machoni” pa mtu.
