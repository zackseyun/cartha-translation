translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Ulinganifu wa “kuwapenda…kuwachukia” umehifadhiwa, na nahau ya mwisho “sawa machoni pako” imeachwa kwa sababu ni wazi na inadumisha uzito wa Kiebrania.
