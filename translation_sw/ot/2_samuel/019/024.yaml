base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/024.yaml
  text: And the king said to Shimei[a], “You shall not die.” And the king swore to him.
translation:
  language: sw
  text: Mfalme akamwambia Shimei[a], “Hutakufa.” Kisha mfalme akamwapia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufafanua zaidi, “Hutauawa.” Kiebrania husema kihalisi, “Hutakufa,” ambayo hapa huenda ni ahadi ya kifalme ya kutotekeleza hukumu ya kifo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Kauli ya wayyiqtol ya אמר inaendeleza mfululizo wa simulizi; “akamwambia” ni ya kawaida katika Kiswahili na inajumuisha mhusika anayesema pamoja na anayesemeshwa.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye uainisho inamtaja mfalme anayejulikana katika muktadha; Kiswahili hakihitaji kibainishi tofauti cha udefiniti.
- source_word: שִׁמְעִי
  choice: Shimei
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: לֹא תָמוּת
  choice: Hutakufa
  rationale: Huhifadhi maana halisi ya kitenzi מות kilichokanushwa na pia nguvu ya uhakikisho au amri ya kifalme, bila kufafanua kimya kimya kuwa ni hukumu ya kuuawa.
- source_word: וַיִּשָּׁבַע
  choice: akamwapia
  rationale: Nifali ya שבע humaanisha kuapa; “akamwapia” ni usemi wa asili unaoonyesha kuwa mfalme alimthibitishia Shimei ahadi hiyo kwa kiapo.
- source_word: לוֹ
  choice: -mw- katika “akamwapia”
  rationale: Kiambishi cha yambwa kinamrejelea Shimei na kuhifadhi uhusiano wa ‘kwake’ kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Iwapo ahadi inamaanisha kutokufa kwa ujumla au kutouawa kwa amri ya mfalme
  choice: Hutakufa
  alternative: Hutauawa
  rationale: Kiebrania husema kihalisi “hutakufa.” Katika muktadha huenda ni msamaha dhidi ya kuuawa, lakini matini haielezi jambo hilo moja kwa moja; tafsiri kuu inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo wa simulizi “akamwambia” na “akamwapia” ni wa kawaida na unaeleweka; “Kisha” hutenganisha kwa uwazi tendo la kusema na tendo la kuapa.
