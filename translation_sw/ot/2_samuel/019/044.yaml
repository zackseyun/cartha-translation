  text: וַ/יַּ֣עַן אִֽישׁ יִשְׂרָאֵל֩ אֶת אִ֨ישׁ יְהוּדָ֜ה וַ/יֹּ֗אמֶר עֶֽשֶׂר יָד֨וֹת לִ֣/י בַ/מֶּלֶךְ֮ וְ/גַם בְּ/דָוִד֮ אֲנִ֣י מִמְּ/ךָ֒ וּ/מַדּ֨וּעַ֙ הֱקִלֹּתַ֔/נִי וְ/לֹא הָיָ֨ה דְבָרִ֥/י רִאשׁ֛וֹן לִ֖/י לְ/הָשִׁ֣יב אֶת מַלְכִּ֑/י וַ/יִּ֨קֶשׁ֙ דְּבַר אִ֣ישׁ יְהוּדָ֔ה מִ/דְּבַ֖ר אִ֥ישׁ יִשְׂרָאֵֽל־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/044.yaml
  text: Then the man of Israel answered the man of Judah and said[a], “I have ten shares in the king, and in David also I have more than you[d][c][b]. Why then did you treat me lightly? Was not my word first in bringing back my king?” But the word of the men of Judah was harsher than the word of the men of Israel.
translation:
  language: sw
  text: Ndipo mtu wa Israeli akamjibu mtu wa Yuda, akasema, “Mimi nina mafungu kumi katika suala la mfalme[a], tena katika Daudi nina dai kubwa kuliko lako[b]. Kwa nini basi umenidharau? Je, neno langu halikuwa la kwanza kuhusu kumrudisha mfalme wangu?[c]” Lakini maneno ya watu wa Yuda yalikuwa makali kuliko maneno ya watu wa Israeli.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa maana ya moja kwa moja, “nina mikono kumi katika mfalme.” Hii ni nahau inayomaanisha mafungu au sehemu kumi, huenda ikirejelea dai la makabila kumi ya kaskazini likilinganishwa na lile la Yuda.
    reason: cultural_note
  - marker: b
    text: Au, “tena nina sehemu kubwa zaidi kuliko wewe katika Daudi.” Kiebrania ni cha mkato, lakini kinaonyesha dai au sehemu kubwa zaidi.
    reason: lexical_alternative
  - marker: c
    text: Au, “Je, si pendekezo langu lilikuwa la kwanza kumrudisha mfalme wangu?”
    reason: alternative_reading
  - marker: d
    text: Au, “maneno ya watu wa Yuda yalikuwa yenye nguvu zaidi kuliko maneno ya watu wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל / אִישׁ יְהוּדָה
  choice: mtu wa Israeli / mtu wa Yuda
  rationale: Umoja wa Kiebrania umehifadhiwa katika majibizano, ambako kila ‘mtu’ anaonekana kuwakilisha upande wake; katika muhtasari wa mwisho maana ya kijumuiya imeelezwa kwa ‘watu.’
- source_word: עֶשֶׂר יָדוֹת לִי בַמֶּלֶךְ
  choice: Mimi nina mafungu kumi katika mfalme
  rationale: יָדוֹת maana yake ya moja kwa moja ni ‘mikono,’ lakini hapa ni nahau ya mafungu au sehemu za madai. ‘Mafungu kumi’ hueleza dai la makabila ya kaskazini kwa lugha ya kawaida ya Kiswahili.
- source_word: וְגַם בְּדָוִד אֲנִי מִמְּךָ
  choice: tena dai langu kwa Daudi ni kubwa kuliko lako
  rationale: Kifungu hiki ni cha mkato katika Kiebrania na kinaonyesha ulinganisho. Tafsiri inaweka wazi kwamba kinacholinganishwa ni dai au sehemu yao kwa Daudi, si ubora wa mtu kwa ujumla.
- source_word: הֱקִלֹּתַנִי
  choice: umenidharau
  rationale: Kitenzi hiki humaanisha kumwona au kumtendea mtu kuwa asiye na uzito au umuhimu. ‘Umenidharau’ ni usemi wa asili unaowasilisha kudunishwa huku bila kuongeza wazo la chuki.
- source_word: וְלֹא הָיָה דְבָרִי רִאשׁוֹן לִי לְהָשִׁיב אֶת מַלְכִּי
  choice: Je, si pendekezo langu lilikuwa la kwanza kumrudisha mfalme wangu?
  rationale: דָבָר inaweza kuwa neno, jambo, au pendekezo. Katika muktadha, msemaji anadai kwamba alikuwa wa kwanza kupendekeza kurudishwa kwa mfalme; kiambishi cha nafsi katika ‘mfalme wangu’ kimehifadhiwa.
- source_word: וַיִּקֶשׁ דְּבַר אִישׁ יְהוּדָה מִדְּבַר אִישׁ יִשְׂרָאֵל
  choice: maneno ya watu wa Yuda yalikuwa makali kuliko maneno ya watu wa Israeli
  rationale: קשׁה hapa huonyesha ukali wa kauli. Umoja wa kijumuiya wa אִישׁ umetafsiriwa kwa wingi kwa sababu sentensi hii inatoa muhtasari wa majibizano ya makundi hayo.
