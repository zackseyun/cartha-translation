translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. Nahau isiyoeleweka ya ‘mikono kumi’ imewasilishwa kama ‘mafungu kumi’ na maana yake ya moja kwa moja kuwekwa katika tanbihi. Mkato na utata wa kifungu kuhusu dai kwa Daudi na kuhusu ‘neno/pendekezo’ umehifadhiwa kwa njia ya tanbihi badala ya kufichwa.
