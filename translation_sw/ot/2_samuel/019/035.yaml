translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa sasa. Usemi wa Kiebrania ‘siku za miaka ya maisha yangu’ umehifadhiwa katika matini, huku tanbihi ikifafanua maana yake ya kawaida bila kuondoa nguvu ya swali la balagha.
