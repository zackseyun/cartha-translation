base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/035.yaml
  text: Barzillai said to the king[a], “How many are the days of the years of my life, that I should go up with the king to Jerusalem?”
translation:
  language: sw
  text: Barzilai akamwambia mfalme, “Siku za miaka ya maisha yangu ni ngapi[a], hata nipande pamoja na mfalme kwenda Yerusalemu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa maana ya kawaida: “Nimebakiza siku ngapi za kuishi...?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Katika masimulizi, wayyiqtol ya אמר inaendeleza mfululizo wa matukio; ‘akamwambia’ ni Kiswahili cha kawaida na pia kinaonyesha anayeelekezewa maneno.
- source_word: בַּרְזִלַּי
  choice: Barzilai
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: אֶל הַמֶּלֶךְ
  choice: mfalme
  rationale: Kiebrania kinatumia nomino yenye kibainishi, si jina ‘Daudi’; tafsiri haiongezi jina lisilokuwamo.
- source_word: כַּמָּה יְמֵי שְׁנֵי חַיַּי
  choice: Siku za miaka ya maisha yangu ni ngapi
  rationale: Muundo huu unahifadhi usemi wa Kiebrania ulio na tabaka za ‘siku,’ ‘miaka,’ na ‘maisha yangu,’ pamoja na nguvu ya swali la balagha.
- source_word: כִּי אֶעֱלֶה
  choice: hata nipande
  rationale: '‘Hata’ pamoja na hali ya utegemezi ‘nipande’ huwasilisha maana ya kimatokeo na ya balagha: muda wake uliobaki hautoshi kuwa sababu ya kwenda Yerusalemu.'
- source_word: אֶת הַמֶּלֶךְ
  choice: pamoja na mfalme
  rationale: Katika muktadha huu אֶת inaonyesha kuandamana; ‘pamoja na’ huepuka kumfanya mfalme kuwa yambwa ya moja kwa moja.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali hapa katika Kiswahili cha Biblia.
