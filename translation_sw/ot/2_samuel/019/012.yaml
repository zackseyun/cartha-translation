base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/012.yaml
  text: And King David sent to Zadok and to Abiathar the priests[a], saying, “Speak to the elders of Judah, saying, ‘Why should you be the last to bring the king back to his house, when the word of all Israel has come to the king, to his house?’”
translation:
  language: sw
  text: 'Naye Mfalme Daudi akatuma ujumbe kwa Sadoki na Abiathari, makuhani, akisema, “Waambieni wazee wa Yuda hivi: ‘Kwa nini muwe wa mwisho kumrudisha mfalme nyumbani kwake, ilhali neno la Israeli yote limefika kwa mfalme nyumbani kwake?[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kuwa pendekezo, ombi, au habari ya Israeli yote ilikuwa imemfikia mfalme nyumbani kwake.” Kirai cha Kiebrania “neno la Israeli yote” kina maana pana na kinaweza kurejelea ujumbe, pendekezo, ombi, habari, au jambo la makabila kuhusu kumrudisha Daudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח אֶל
  choice: akatuma ujumbe kwa
  rationale: Kiebrania kinasema kihalisi ‘alituma kwa’; Kiswahili cha kawaida huhitaji kutaja ujumbe ili kuonyesha kwamba aliwasiliana nao, si kwamba aliwatuma wao.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Mfalme Daudi
  rationale: Huhifadhi cheo na jina kwa mpangilio wa kawaida wa Kiswahili.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hutambulisha kwa uwazi wadhifa wa Sadoki na Abiathari; nafasi yake kabla ya majina ni ya asili katika Kiswahili.
- source_word: דַּבְּרוּ אֶל ... לֵאמֹר
  choice: Semeni na ... mkawaambie
  rationale: Huwakilisha amri ya kusema kwa wazee na fomula inayofuata ya kunukuu, kwa Kiswahili kinachoeleweka.
- source_word: זִקְנֵי יְהוּדָה
  choice: wazee wa Yuda
  rationale: Ni tafsiri ya moja kwa moja ya viongozi wa Yuda.
- source_word: לָמָּה תִהְיוּ אַחֲרֹנִים
  choice: Kwa nini muwe wa mwisho
  rationale: Huhifadhi swali la changamoto na nguvu yake ya kuhimiza bila kulifanya kuwa taarifa tambuzi.
- source_word: לְהָשִׁיב אֶת הַמֶּלֶךְ
  choice: kumrudisha mfalme
  rationale: Umbo la kusababisha la שוב linaonyesha kumleta Daudi arudi, si yeye kurudi peke yake.
- source_word: אֶל בֵּיתוֹ
  choice: nyumbani kwake
  rationale: בַּיִת hapa inaweza kumaanisha makao ya mfalme; ‘nyumbani kwake’ ni ya asili na haibani maana kuwa ikulu pekee.
- source_word: וּדְבַר כָּל יִשְׂרָאֵל
  choice: ujumbe wa Israeli yote
  rationale: דבר ni pana, lakini katika muktadha huu ‘ujumbe’ huhifadhi wazo la mawasiliano yaliyomfikia mfalme bila kuamua ikiwa yalikuwa pendekezo, ombi, au taarifa.
- source_word: בָּא אֶל הַמֶּלֶךְ
  choice: umemfikia mfalme
  rationale: Hutoa maana ya jambo lililokwisha kumfikia Daudi na ni ya kawaida zaidi katika Kiswahili kuliko kusema ujumbe ‘umekuja kwa’ mfalme.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Urudiaji wa ‘nyumbani kwake’ umehifadhiwa kwa sababu unatokea mara mbili katika Kiebrania. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
