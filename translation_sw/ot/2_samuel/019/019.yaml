base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/019.yaml
  text: The ferryboat crossed over to bring the king’s household across and to do what was good in his sight[c][b][a], and Shimei son of Gera fell before the king as he was crossing the Jordan.
translation:
  language: sw
  text: Mashua ya kuvushia[a] ikavuka ili kuwavusha watu wa nyumba ya mfalme[b] na kufanya yaliyompendeza mfalme.[c] Naye Shimei mwana wa Gera akajitupa chini mbele ya mfalme alipokuwa akivuka Mto Yordani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kivuko”; neno la Kiebrania linamaanisha chombo cha kuvukia mto.
    reason: lexical_alternative
  - marker: b
    text: “Watu wa nyumba ya mfalme” ni watu wa jamaa au msafara wake wa kifalme, si jengo la ikulu.
    reason: cultural_note
  - marker: c
    text: Kihalisi, “na kufanya yaliyo mema machoni pake,” yaani kufanya yaliyompendeza.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲבָרָה
  choice: mashua ya kuvushia
  rationale: Nomino hii inataja chombo cha kuvushia watu mtoni. Kauli hii ni wazi na ya kawaida kuliko kutumia “kivuko,” ambalo pia linaweza kumaanisha mahali pa kuvukia.
- source_word: וְעָבְרָה
  choice: ikavuka
  rationale: Kitenzi cha kike katika Kiebrania kinakubaliana na הָעֲבָרָה na katika simulizi kinaendeleza mfuatano wa matukio; “ikavuka” ni ya asili katika Kiswahili.
- source_word: לַעֲבִיר אֶת בֵּית הַמֶּלֶךְ
  choice: ili kuwavusha watu wa nyumba ya mfalme
  rationale: Hiphil ina maana ya kusababisha wavuke. Hapa “nyumba ya mfalme” ni watu wa jumba au msafara wa kifalme, si jengo lenyewe.
- source_word: וְלַעֲשׂוֹת הַטּוֹב בְּעֵינָיו
  choice: na kufanya yaliyompendeza mfalme
  rationale: Hii ni nahau ya Kiebrania, kihalisi “kufanya yaliyo mema machoni pake.” Tafsiri hii inawasilisha maana yake kwa Kiswahili cha kawaida huku tanbihi ikihifadhi taswira ya asili.
- source_word: נָפַל לִפְנֵי הַמֶּלֶךְ
  choice: akajitupa chini mbele ya mfalme
  rationale: Katika muktadha, kuanguka huku ni tendo la kujinyenyekeza na kuomba rehema, si kuanguka kwa bahati mbaya. “Akajitupa chini” huonyesha tendo hilo wazi bila kuongeza wazo la ibada.
- source_word: בְּעָבְרוֹ בַּיַּרְדֵּן
  choice: alipokuwa akivuka Mto Yordani
  rationale: Muundo wa Kiebrania unaonyesha wakati wa kuvuka. Mfalme ndiye rejeo linalofaa zaidi katika muktadha, na “Mto Yordani” ni mtajo wa kawaida na wazi kwa wasomaji wa Kiswahili.
