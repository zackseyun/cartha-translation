  text: And he swayed the heart of every man of Judah as one man, and they sent word to the king, “Return, you and all your servants.”
translation:
  language: sw
  text: Akazivuta nyoyo za watu wote wa Yuda, wakawa kama mtu mmoja, nao wakatuma ujumbe kwa mfalme, “Rudi, wewe pamoja na watumishi wako wote.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּט אֶת־לְבַב
  choice: Akawavuta mioyo
  rationale: Kitenzi נטה hapa kina maana ya kuuelekeza au kuuvuta moyo upande fulani; “akawavuta mioyo” ni Kiswahili cha kawaida kinachohifadhi wazo la kuwashawishi bila kulifanya kuwa la kulazimisha.
- source_word: כָּל אִישׁ יְהוּדָה
  choice: watu wote wa Yuda
  rationale: Ingawa muundo wa Kiebrania ni wa umoja kwa maana ya jumla, Kiswahili hutumia wingi kwa kawaida kurejelea jamii yote ya wanaume au watu wa Yuda.
- source_word: כְּאִישׁ אֶחָד
  choice: wakawa kama mtu mmoja
  rationale: Nahau hii inaonyesha umoja wa nia; taswira ya chanzo imehifadhiwa badala ya kufasiri tu kuwa “kwa kauli moja.”
- source_word: שׁוּב
  choice: Rudi
  rationale: Amri ya umoja inaelekezwa kwa mfalme, huku watumishi wake wakitajwa kama wanaoandamana naye.
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: “Watumishi” linafaa kwa watu walio chini ya mamlaka ya mfalme na halilazimishi maana finyu ya watumwa.
theological_decisions:
- issue: Mtendaji wa kitenzi “akawavuta” hatajwi wazi katika aya hii
  choice: Kiwakilishi cha nafsi ya tatu “Aka-” kimehifadhiwa bila kutaja jina
  alternative: “Daudi akawavuta...”
  rationale: Kiebrania chenyewe kina kiwakilishi tu; kutaja Daudi kungeondoa utegemezi wa aya hii kwa muktadha na kupunguza kiasi cha utata wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa maandiko. Usemi “kama mtu mmoja” umehifadhi taswira ya Kiebrania huku “wakawa” ikifafanua kwa kawaida matokeo ya kuvutwa kwa mioyo.
