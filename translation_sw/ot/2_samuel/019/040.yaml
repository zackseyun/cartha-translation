base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/040.yaml
  text: All the people crossed the Jordan[a], and the king crossed over. Then the king kissed Barzillai and blessed him, and he returned to his own place.
translation:
  language: sw
  text: Watu wote wakavuka Yordani, na mfalme pia akavuka. Kisha mfalme akambusu Barzilai na kumbariki, naye akarudi mahali pake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Anayerejelewa na “akarudi” yaelekea zaidi ni Barzilai, ingawa Kiebrania hakutaji jina lake tena waziwazi.
    reason: ambiguity
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: wakavuka
  rationale: Kitenzi עבר katika muktadha huu kinaeleza kuvuka Mto Yordani; “kuvuka” ni Kiswahili cha kawaida na sahihi.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: עם hapa inawahusu watu waliokusanyika na kuandamana na mfalme, wala si lazima wanajeshi pekee.
- source_word: אֶת הַיַּרְדֵּן
  choice: Yordani
  rationale: Jina hili linarejelea Mto Yordani; katika sentensi yenye kitenzi “kuvuka,” kuongeza neno “Mto” si lazima.
- source_word: וְהַמֶּלֶךְ עָבָר
  choice: na mfalme pia akavuka
  rationale: “Pia” huonyesha kwamba mfalme naye alifanya tendo lilelile lililotajwa kuhusu watu, huku marudio ya עבר yakihifadhiwa.
- source_word: וַיִּשַּׁק
  choice: akambusu
  rationale: נשק hapa ni tendo la kumbusu mtu kama ishara ya upendo na kuagana.
- source_word: לְבַרְזִלַּי
  choice: Barzilai
  rationale: Jina la mtu limetoholewa kwa umbo linaloeleweka na kutumika katika Kiswahili.
- source_word: וַיְבָרֲכֵהוּ
  choice: na kumbariki
  rationale: ברך humaanisha “kubariki.” Tafsiri hii haiifanyi kuwa salamu ya kuaga tu, bali inadumisha tendo la baraka lililotajwa wazi.
- source_word: וַיָּשָׁב לִמְקֹמוֹ
  choice: naye akarudi mahali pake
  rationale: Huhifadhi maana ya kurudi kwenye mahali pake bila kufasiri מקום kwa namna finyu kuwa “nyumbani,” na kiwakilishi kisichotaja jina huhifadhi uwezekano wa kisarufi wa rejeleo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na wenye heshima. Muundo “naye akarudi” umeachwa bila kutaja mhusika ili kuhifadhi kiwango cha utata kilichopo katika Kiebrania.
