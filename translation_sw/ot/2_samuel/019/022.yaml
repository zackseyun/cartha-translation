base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/022.yaml
  text: But Abishai son of Zeruiah answered and said[a], “Should Shimei not be put to death for this, because he cursed Yahweh’s anointed?”
translation:
  language: sw
  text: Lakini Abishai mwana wa Seruya akajibu, akasema, “Je, kwa ajili ya jambo hili[a] Shimei asiuawe, kwa sababu alimlaani mtiwa-mafuta wa Yahwe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ya jambo hili” au “kama malipo ya jambo hili.” Nahau ya Kiebrania inauliza ikiwa tendo hili linapaswa kusababisha Shimei auawe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: akajibu, akasema
  rationale: Muundo huu unahifadhi vitenzi vyote viwili vya simulizi la Kiebrania huku ukisomeka kwa kawaida katika Kiswahili.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: Abishai mwana wa Seruya
  rationale: Majina yametoholewa kwa matumizi ya kawaida ya Kiswahili, na utambulisho wa kifamilia umehifadhiwa.
- source_word: הֲתַחַת זֹאת
  choice: Je, kwa ajili ya jambo hili
  rationale: Kirai hiki kinadokeza sababu au tendo linalostahili malipo; swali lenye “Je” linahifadhi nguvu ya swali la Kiebrania bila kufafanua zaidi ya maandishi.
- source_word: לֹא יוּמַת
  choice: asiuawe
  rationale: Hofali ya מות ina maana ya kusababisha mtu afe, hasa hukumu ya kuuawa; umbo la kutendwa “asiuawe” linahifadhi swali hasi la balagha.
- source_word: שִׁמְעִי
  choice: Shimei
  rationale: Hili ni toleo la kawaida la jina la mtu katika Kiswahili.
- source_word: כִּי קִלֵּל
  choice: kwa sababu alimlaani
  rationale: כִּי hapa inatoa sababu ya pendekezo la Abishai, na קלל inaeleza laana nzito ya maneno.
- source_word: מְשִׁיחַ יְהוָה
  choice: mtiwa-mafuta wa Yahwe
  rationale: Tafsiri hii inaonyesha wazi mtu aliyetiwa mafuta na Yahwe, inahifadhi maana ya cheo cha kifalme, na haitumii neno linaloweza kueleweka moja kwa moja kuwa jina maalumu la kimasiya.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina la agano יְהוָה; “Yahwe” hulitoa kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya מְשִׁיחַ katika muktadha huu
  choice: mtiwa-mafuta
  alternative: masihi
  rationale: Katika muktadha huu neno linamtaja mfalme aliyewekwa rasmi kwa kutiwa mafuta. “Mtiwa-mafuta” huhifadhi maana hiyo bila kuingiza moja kwa moja matumizi ya baadaye ya “Masihi” kama jina maalumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kibiblia lakini kinachoeleweka kwa msomaji wa kawaida. Swali hasi la balagha limehifadhiwa, pamoja na urudiaji wa “akajibu, akasema” uliopo katika chanzo.
