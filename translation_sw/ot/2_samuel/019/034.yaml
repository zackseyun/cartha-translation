  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ אֶל בַּרְזִלָּ֑י אַתָּה֙ עֲבֹ֣ר אִתִּ֔/י וְ/כִלְכַּלְתִּ֥י אֹתְ/ךָ֛ עִמָּדִ֖/י בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/034.yaml
  text: And the king said to Barzillai[a], “You cross over with me, and I will provide for you with me in Jerusalem.”
translation:
  language: sw
  text: Mfalme akamwambia Barzilai, “Wewe vuka pamoja nami, nami nitakutunza[a] ukiwa pamoja nami huko Yerusalemu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitakupatia mahitaji yako” au “nitakutegemeza.” Kitenzi cha Kiebrania kina maana ya kukidhi mahitaji ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa masimulizi wa wayyiqtol umeonyeshwa kwa kiambishi cha mfululizo “aka-”; kitenzi chenye yambwa kinatoa Kiswahili cha kawaida kwa “alisema kwa.”
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Nomino yenye kibainishi humrejelea mfalme anayejulikana katika muktadha, yaani Daudi.
- source_word: בַּרְזִלָּי
  choice: Barzilai
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: אַתָּה עֲבֹר
  choice: Wewe vuka
  rationale: Kiwakilishi huru “wewe” kinahifadhi msisitizo wa אַתָּה, na amri “vuka” inaonyesha kuvuka mto katika muktadha huu.
- source_word: אִתִּי
  choice: pamoja nami
  rationale: Inaonyesha kuandamana na mfalme.
- source_word: וְכִלְכַּלְתִּי אֹתְךָ
  choice: nami nitakutunza
  rationale: כלכל hapa humaanisha kukidhi mahitaji ya mtu au kumtegemeza; “nitakutunza” ni ya asili na inafaa kwa ahadi ya mfalme ya kumhudumia Barzilai.
- source_word: עִמָּדִי
  choice: ukiwa pamoja nami
  rationale: Kirai hiki kinaonyesha kuwapo katika ushirika au makao ya mfalme; “ukiwa” hufanya uhusiano huo uwe wa kawaida katika Kiswahili bila kuugeuza kuwa fundisho mahsusi.
- source_word: בִּירוּשָׁלִָם
  choice: huko Yerusalemu
  rationale: בְּ inaonyesha mahali; “huko” ni ya kawaida kwa mahali panapotajwa kama lengo la safari.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “Wewe vuka” umehifadhi msisitizo wa kiwakilishi cha Kiebrania, ingawa ni wenye alama zaidi kuliko “Vuka.” Alama ya tanbihi [a] imewekwa mara baada ya neno linalohusika.
