base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/021.yaml
  text: For your servant knows that I have sinned[a]. And look, I have come today as the first of all the house of Joseph[b] to come down to meet my lord the king.
translation:
  language: sw
  text: Kwa maana mtumishi wako anajua kwamba nimetenda dhambi. Na tazama, leo nimekuja nikiwa wa kwanza miongoni mwa nyumba yote ya Yosefu[a][b] kushuka ili kumlaki bwana wangu mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nyumba ya Yosefu” hapa ni jina la pamoja la makabila yaliyotokana na Yosefu, hasa makundi ya kaskazini yaliyohusishwa na Efraimu na Manase.
    reason: cultural_note
  - marker: b
    text: Au “kutoka katika nyumba yote ya Yosefu.” Muundo wa Kiebrania unaweza kumaanisha kwamba yeye ndiye aliyekuwa wa kwanza kutoka katika kundi lote la Yosefu kushuka na kumlaki mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu ya ombi la Shimei na kuunganisha kauli hii na yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: יָדַע
  choice: anajua
  rationale: Kauli timilifu ya Kiebrania hapa inaonyesha hali ya sasa ya kutambua au kukiri kosa.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika mazungumzo na mfalme, hili ni jina la kujishusha kwa heshima; “mtumwa wako” lingeweka mkazo usiokusudiwa hapa juu ya hali ya utumwa.
- source_word: חָטָאתִי
  choice: nimetenda dhambi
  rationale: Linahifadhi uzito wa kimaadili wa חטא na kuonyesha tendo la zamani ambalo sasa linakiriwa.
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Linavuta fikira kwenye uthibitisho unaofuata bila kuondoa nguvu ya usemi wa Kiebrania.
- source_word: בָאתִי הַיּוֹם
  choice: leo nimekuja
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unaonyesha kwamba msemaji amefika na yupo mbele ya mfalme.
- source_word: רִאשׁוֹן לְכָל בֵּית יוֹסֵף
  choice: wa kwanza miongoni mwa nyumba yote ya Yosefu
  rationale: Linawasilisha maana ya Shimei kuwa wa kwanza katika kundi zima, huku uwezekano wa kuelewa kihusishi kama “kutoka katika” ukihifadhiwa katika tanbihi.
- source_word: בֵּית יוֹסֵף
  choice: nyumba ya Yosefu
  rationale: Linahifadhi jina la pamoja la kikabila katika maandiko badala ya kulibadili kuwa “Efraimu” au maelezo mengine.
- source_word: לָרֶדֶת
  choice: kushuka
  rationale: Linahifadhi mwelekeo wa kijiografia unaoonyeshwa wazi na kitenzi cha Kiebrania.
- source_word: לִקְרַאת
  choice: ili kumlaki
  rationale: “Kumlaki” huonyesha kwenda kuelekea mtu ili kumpokea au kukutana naye, kama muktadha huu unavyodai.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Linahifadhi namna ya heshima ya kumsemesha mfalme na uhusiano wa maneno ya chanzo.
