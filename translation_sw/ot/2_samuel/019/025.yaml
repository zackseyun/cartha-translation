base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/025.yaml
  text: And Mephibosheth son of Saul came down to meet the king[a]. He had not cared for his feet, nor trimmed his mustache, nor washed his clothes[c][b], from the day the king left until the day he came in peace.
translation:
  language: sw
  text: Mefiboshethi mwana wa Sauli akashuka kwenda kumlaki mfalme. Hakuwa ameitunza miguu yake[a], wala kupunguza masharubu yake[b], wala kufua nguo zake, tangu siku mfalme alipoondoka mpaka siku mfalme alipokuja kwa amani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni, “hakuwa ameifanya miguu yake,” yaani hakufanya utunzaji wa kawaida wa miguu; tendo hasa halitajwi.
    reason: lexical_alternative
  - marker: b
    text: Au, “wala kutunza masharubu yake.” Neno la Kiebrania hutaja nywele za eneo la mdomo wa juu, si lazima ndevu zote.
    reason: lexical_alternative
  - marker: c
    text: Au, “alipofika salama.” Usemi wa Kiebrania unaweza kumaanisha kuja kwa amani au kufika salama.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַד
  choice: akashuka
  rationale: Kitenzi hiki kimsingi humaanisha kushuka; umbo la simulizi linaendelezwa kwa “akashuka” bila kuongeza mahali ambako hakutajwi.
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: kwenda kumlaki mfalme
  rationale: “Kumlaki” huonyesha kwenda kukutana na mtu anayekuja na linafaa kwa muktadha huu wa heshima.
- source_word: וְלֹא עָשָׂה רַגְלָיו
  choice: Hakuwa ameitunza miguu yake
  rationale: Kiebrania halisi ni “hakuwa ameifanya miguu yake,” lakini tendo mahususi la kuitunza haliko wazi; tafsiri pana huepuka kubuni kitendo fulani.
- source_word: וְלֹא עָשָׂה שְׂפָמוֹ
  choice: wala kupunguza masharubu yake
  rationale: שָׂפָם hutaja eneo la nywele za mdomo wa juu. “Kupunguza masharubu” ni usemi wa kawaida wa kujitunza, huku tanbihi ikihifadhi uwezekano mpana zaidi.
- source_word: וְאֶת בְּגָדָיו לֹא כִבֵּס
  choice: wala kufua nguo zake
  rationale: כִבֵּס ni kufua au kuosha nguo; “kufua nguo” ni Kiswahili cha kawaida na sahihi.
- source_word: לְמִן הַיּוֹם לֶכֶת הַמֶּלֶךְ
  choice: tangu siku mfalme alipoondoka
  rationale: Kirai kinaonyesha kipindi kinachoanza siku ya kuondoka kwa mfalme; “alipoondoka” ni cha kawaida na hakiongezi sajili ya juu isiyokuwamo katika Kiebrania.
- source_word: עַד הַיּוֹם אֲשֶׁר בָּא בְשָׁלוֹם
  choice: mpaka siku aliporudi kwa amani
  rationale: בָּא בְשָׁלוֹם inaweza kueleza kuja au kurudi kwa amani, yaani salama. “Aliporudi kwa amani” inafaa muktadha bila kuongeza wazo la “nyumbani,” ambalo halipo katika matini.
