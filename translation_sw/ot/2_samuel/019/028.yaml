translation:
  language: sw
  text: Alimsingizia mtumishi wako mbele ya bwana wangu mfalme, lakini bwana wangu mfalme ni kama malaika wa Mungu; basi, fanya lililo jema machoni pako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְרַגֵּל
  choice: Alimsingizia
  rationale: Kitenzi hiki katika muktadha kina maana ya kumchongea au kutoa habari mbaya za uongo dhidi ya mtu; “alimsingizia” ni Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: בְּעַבְדְּךָ
  choice: mtumishi wako
  rationale: Nahau ya unyenyekevu ya msemaji akijirejelea; imedumishwa bila kuibadili kuwa nafsi ya kwanza.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: kama malaika wa Mungu
  rationale: Tafsiri ya moja kwa moja inayohifadhi taswira ya Kiebrania na kutotatua ikiwa inasisitiza utambuzi, mamlaka, au hekima ya mfalme.
- source_word: וַעֲשֵׂה הַטּוֹב בְּעֵינֶיךָ
  choice: kwa hiyo, fanya yaliyo mema machoni pako
  rationale: “Machoni pako” huhifadhi nahau ya chanzo kuhusu uamuzi wa mfalme; “kwa hiyo” huonyesha uhusiano wa matokeo unaobebwa na waw mfululizo.
theological_decisions:
- issue: Maana ya kumlinganisha mfalme na malaika wa Mungu
  choice: ni kama malaika wa Mungu
  alternative: ana hekima kama malaika wa Mungu
  rationale: Chanzo hakitaji wazi sifa mahususi kama hekima au utambuzi; tafsiri inahifadhi upana na mvutano wa kauli hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina ya heshima yameandikwa kwa herufi ndogo kwa kuwa hapa “bwana” ni namna ya kumwita mfalme, si jina la Mungu.
