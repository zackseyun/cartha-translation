base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/001.yaml
  text: Then the king was deeply shaken[a], and he went up to the chamber over the gate and wept. As he went, he said, “My son Absalom! My son, my son Absalom! If only I had died instead of you, Absalom, my son[b], my son!”
translation:
  language: sw
  text: Ndipo mfalme akafadhaika sana, akapanda kwenda kwenye chumba kilichokuwa juu ya lango[a], akalia. Alipokuwa akienda, alisema, “Mwanangu Absalomu! Mwanangu, mwanangu Absalomu! Laiti ningekufa badala yako[b], Absalomu, mwanangu, mwanangu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “chumba cha juu cha lango.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hutumia nahau “Ni nani atakayejalia/atoa?” kuonyesha tamanio; yaani, “Laiti” au “Laiti ingekuwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְגַּז
  choice: akafadhaika sana
  rationale: Kitenzi רגז kinaweza kumaanisha kutetemeka, kusumbuka, au kuvurugika sana kihisia. Katika muktadha huu wa maombolezo, “akafadhaika sana” huonyesha mshtuko mkubwa wa ndani bila kuufanya kuwa mtetemeko wa mwili pekee.
- source_word: עֲלִיַּת הַשַּׁעַר
  choice: chumba kilichokuwa juu ya lango
  rationale: עֲלִיָּה ni chumba cha juu; muungano huu unaonyesha chumba kilichokuwa juu ya jengo la lango. Tafsiri hii ni wazi na ya kawaida kwa Kiswahili cha sasa.
- source_word: וַיֵּבְךְּ
  choice: akalia
  rationale: בכה humaanisha kulia kwa huzuni; “akalia” ni tafsiri ya moja kwa moja, ya kawaida, na yenye uzito unaofaa katika Kiswahili.
- source_word: וְכֹה אָמַר בְּלֶכְתּוֹ
  choice: Alipokuwa akienda, alisema
  rationale: Huhifadhi hali ya tendo lililokuwa likiendelea huku mfalme akisema maneno ya maombolezo, kwa mpangilio wa asili wa Kiswahili.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Kurudiwa kwa neno hili ni kiini cha uchungu wa maombolezo, kwa hiyo kila tukio limehifadhiwa bila kufupishwa.
- source_word: מִי יִתֵּן
  choice: Laiti
  rationale: Nahau ya Kiebrania, kihalisi “ni nani atakayetoa?”, hutumiwa kueleza tamanio lisilowezekana au lenye uchungu. “Laiti” ni Kiswahili fasaha na cha kawaida kinachohifadhi nguvu hiyo.
- source_word: מוּתִי אֲנִי תַחְתֶּיךָ
  choice: ningalikufa badala yako
  rationale: Muundo huu unaeleza tamanio la kinyume na hali halisi kwamba msemaji angekufa mahali pa mwingine. “Ningalikufa badala yako” huhifadhi maana ya kibadala na maombolezo ya wakati uliopita.
- source_word: אַבְשָׁלוֹם
  choice: Absalomu
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika mapokeo ya Biblia ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya “mwanangu” yamehifadhiwa kikamilifu kwa sababu yanaonyesha kwa nguvu huzuni ya Daudi. “Ningalikufa” limetumiwa kama umbo sanifu la tamanio la kinyume na hali halisi.
