base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/033.yaml
  text: Barzillai was very old[a], eighty years old, and he had provided for the king during his stay in Mahanaim, for he was a very wealthy man.
translation:
  language: sw
  text: Barzilai alikuwa mzee sana, mwenye umri wa miaka themanini. Alikuwa amempatia mfalme mahitaji yake wakati mfalme alipokaa Mahanaimu, kwa maana Barzilai alikuwa mtu mkuu sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “alikuwa mtu mkubwa sana.” Usemi huo unaweza kumaanisha kwamba alikuwa tajiri sana, mashuhuri sana, au mwenye ushawishi mkubwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: alikuwa mzee sana
  rationale: Kivumishi זָקֵן kimetumika kiarifu, nacho מְאֹד kinakazia kiwango. “Mzee sana” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: בֶּן שְׁמֹנִים שָׁנָה
  choice: mwenye umri wa miaka themanini
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kuwa na umri wa miaka themanini; tafsiri hii ni ya asili katika Kiswahili.
- source_word: כִלְכַּל אֶת הַמֶּלֶךְ
  choice: alikuwa amempatia mfalme mahitaji yake
  rationale: Kitenzi כלכל hapa kinamaanisha kumtegemeza mtu kwa kumpa vitu alivyohitaji. Kauli hii inaonyesha msaada wa kimwili bila kuubana kuwa chakula pekee.
- source_word: בְּשִׁיבָתוֹ
  choice: wakati mfalme alipokaa
  rationale: ישב hapa inahusu kukaa au kuishi mahali. Kiwakilishi tamati kinaeleweka kwa kawaida kumrejelea mfalme; kurudia “mfalme” kunaondoa utata usio wa lazima katika Kiswahili.
- source_word: בְמַחֲנַיִם
  choice: Mahanaimu
  rationale: Jina la mahali limetoholewa kwa muundo unaofaa Kiswahili na unaotambulika katika mapokeo ya majina ya Biblia.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinaanzisha sababu inayoeleza jinsi Barzilai alivyoweza kumhudumia mfalme.
- source_word: אִישׁ גָּדוֹל הוּא מְאֹד
  choice: Barzilai alikuwa tajiri sana
  rationale: Katika muktadha huu, uwezo wake wa kumpatia mfalme mahitaji unaelekeza hasa kwenye utajiri. Hata hivyo, usemi wa Kiebrania ni mpana zaidi, hivyo uwezekano wa hadhi au ushawishi umehifadhiwa katika tanbihi.
