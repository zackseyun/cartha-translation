  text: וְ/הָיָ֗ה אִֽם תַּעֲלֶה֙ חֲמַ֣ת הַ/מֶּ֔לֶךְ וְ/אָמַ֣ר לְ/ךָ֔ מַדּ֛וּעַ נִגַּשְׁתֶּ֥ם אֶל הָ/עִ֖יר לְ/הִלָּחֵ֑ם הֲ/ל֣וֹא יְדַעְתֶּ֔ם אֵ֥ת אֲשֶׁר יֹר֖וּ מֵ/עַ֥ל הַ/חוֹמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/020.yaml
  text: And if the king’s anger rises and he says to you[a], ‘Why did you go so near the city to fight? Did you not know what they would shoot from the wall?’
translation:
  language: sw
  text: Na ikiwa hasira ya mfalme inapanda, naye akakuambia, “Kwa nini mlisogea karibu sana na mji ili kupigana? Je, hamkujua kile wanachoweza kurusha kutoka juu ya ukuta?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kile wangepiga kwa mishale kutoka juu ya ukuta.” Kitenzi cha Kiebrania kinaweza kumaanisha kwa upana zaidi kurusha vitu au makombora; maana ya kupiga mishale pia yawezekana katika muktadha wa kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Na ikitokea kwamba
  rationale: Kishazi hiki kinatanguliza hali ya masharti katika maagizo ya Yoabu huku kikihifadhi muunganiko wa simulizi.
- source_word: תַּעֲלֶה חֲמַת הַמֶּלֶךְ
  choice: hasira ya mfalme inawaka
  rationale: חֵמָה hueleza hasira kali, na עלה huonyesha kuongezeka kwake; usemi huu ni wa kawaida na wenye nguvu katika Kiswahili.
- source_word: וְאָמַר לְךָ
  choice: na akakuuliza
  rationale: Ingawa kitenzi cha Kiebrania ni ‘akasema kwako,’ maneno yanayofuata ni swali; ‘akakuuliza’ ni Kiswahili cha asili kinachohifadhi kazi ya usemi huo katika hali ya masharti.
- source_word: מַדּוּעַ
  choice: Kwa nini
  rationale: Ni kisawe cha moja kwa moja na cha kawaida cha kiulizi hiki.
- source_word: נִגַּשְׁתֶּם אֶל הָעִיר
  choice: mlisogea karibu sana na mji
  rationale: נגשׁ humaanisha kukaribia. ‘Karibu sana’ hudokeza lawama kuhusu kufika mahali pa hatari bila kuongeza wazo lisilokuwapo katika muktadha.
- source_word: לְהִלָּחֵם
  choice: ili kupigana
  rationale: Kitenzi-jina hiki kinaonyesha kusudi; tafsiri hii ni fupi na ya kawaida katika mazingira ya vita.
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: Hamkujua kwamba
  rationale: Muundo wa swali hasi unatarajia jibu la kukubali na unaendeleza sauti ya lawama.
- source_word: אֵת אֲשֶׁר יֹרוּ
  choice: wangepiga mishale
  rationale: ירה katika Hifili mara nyingi humaanisha kupiga au kurusha; katika muktadha wa kijeshi, ‘kupiga mishale’ ni maana inayofaa, ingawa neno lenyewe linaweza kuhusisha vitu vingine vinavyorushwa.
- source_word: מֵעַל הַחוֹמָה
  choice: kutoka juu ya ukuta
  rationale: מֵעַל ina maana ya kutoka juu ya kitu; hapa inaonyesha mahali ambapo watetezi wa mji walikuwa wakirusha silaha zao.
