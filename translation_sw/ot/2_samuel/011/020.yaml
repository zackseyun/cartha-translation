translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa Maandiko. Wingi wa ‘mlisogea’ na ‘hamkujua’ umehifadhiwa. Alama [a] imewekwa baada ya kishazi kinachohusika moja kwa moja na tanbihi.
