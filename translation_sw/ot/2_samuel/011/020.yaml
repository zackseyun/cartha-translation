review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the conditional setting, the king's anger, the plural address, the rebuke about approaching the city, and the rhetorical question. However, 'wangepiga mishale' specifies arrows, whereas אֲשֶׁר יֹרוּ is object-unspecified and can encompass projectiles more generally. The source wording should remain general in the main text.
  naturalness: The draft is generally clear and idiomatic. 'Na ikitokea kwamba' is somewhat cumbersome for this narrative conditional; 'Na ikiwa' is more natural and suitably formal. Adding 'Je' makes the negative rhetorical question flow naturally in Swahili.
  terminology: '''Hasira ya mfalme inapanda'' retains the image of the king''s anger rising without importing a stronger metaphor. ''Kile wanachoweza kurusha'' keeps the military-projectile sense broad and natural; the footnote records the narrower arrow-shooting rendering as an alternative.'
  issues:
  - severity: medium
    issue: The main text adds 'mishale' (arrows).
    rationale: The Hebrew verb יֹרוּ does not name arrows. In this context it can refer to shooting or hurling projectiles generally, so specifying arrows narrows the source unnecessarily.
  - severity: low
    issue: The conditional introduction is needlessly wordy.
    rationale: '''Na ikiwa'' communicates וְהָיָה אִם naturally in standard East African Swahili while retaining the narrative connection and conditional force.'
