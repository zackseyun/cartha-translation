base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/013.yaml
  text: David invited him[a], and he ate and drank before him, and he made him drunk. In the evening he went out to lie on his bed with the servants of his lord[d][c][b], but he did not go down to his house.
translation:
  language: sw
  text: Daudi akamwita[a], naye akala na akanywa mbele yake[b]. Daudi akamlevya. Jioni Uria akatoka kwenda kujilaza kwenye kitanda chake pamoja na watumishi wa bwana wake[c], lakini hakushuka kwenda nyumbani kwake[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Daudi akamwita aje.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, akiwa katika uwepo wa Daudi.
    reason: lexical_alternative
  - marker: c
    text: Au, “pamoja na watumishi wa bwana wake.” Bwana wake hapa ni Daudi.
    reason: referent_clarification
  - marker: d
    text: Kiebrania, “hakushuka kwenda kwenye nyumba yake.” Kitenzi “kushuka” kimehifadhiwa kwa sababu kimetumiwa wazi katika maandishi ya chanzo na kinajirudia katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: Daudi akamwita
  rationale: Kitenzi קרא pamoja na ל kwa mtu kinaweza kumaanisha kumwita au kumwagiza aje. “Akamwita” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kuongeza wazi wazo la mwaliko wa hiari.
- source_word: לְפָנָיו
  choice: mbele yake
  rationale: Huhifadhi usemi wa Kiebrania unaomaanisha kwamba Uria alikula na kunywa akiwa mbele ya Daudi, yaani katika uwepo wake.
- source_word: וַיְשַׁכְּרֵהוּ
  choice: Daudi akamlevya
  rationale: Hifili ya שׁכר ina maana ya kusababisha mtu alewe. Kumtaja Daudi tena huondoa utata wa viwakilishi katika Kiswahili na kuhifadhi uwajibikaji wake katika tendo hilo.
- source_word: בָעֶרֶב
  choice: Jioni
  rationale: Ni usemi mfupi na wa kawaida wa Kiswahili unaoonyesha wakati wa hatua inayofuata katika simulizi.
- source_word: לִשְׁכַּב
  choice: ili alale
  rationale: שׁכב hapa ni kujilaza au kulala. “Ili alale” ni ya kawaida katika muktadha huu, bila kudai zaidi ya kwenda mahali pa kulala.
- source_word: בְּמִשְׁכָּבוֹ
  choice: mahali pake pa kulala
  rationale: מִשְׁכָּב inaweza kuwa kitanda au mahali pa kulala. “Mahali pake pa kulala” huhifadhi upana huo na huepuka kudokeza lazima kulikuwa na kitanda maalumu.
- source_word: עִם עַבְדֵי אֲדֹנָיו
  choice: pamoja na watumishi wa bwana wake
  rationale: Huhifadhi muundo wa nafsi ya tatu wa Kiebrania na uhusiano wa Uria na bwana wake; katika muktadha bwana huyo ni Daudi.
- source_word: וְאֶל בֵּיתוֹ לֹא יָרָד
  choice: lakini hakushuka kwenda nyumbani kwake
  rationale: “Hakushuka” huhifadhi kitenzi cha mwelekeo ירד, ambacho kinajirudia katika muktadha. “Kwenda nyumbani kwake” huwasilisha kwa Kiswahili cha kawaida lengo linalotolewa na אֶל־בֵּיתוֹ, huku “lakini” ikionyesha utofauti wa kimuktadha.
