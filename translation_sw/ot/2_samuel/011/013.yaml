  source_fidelity: 'Maana ya msingi imehifadhiwa vizuri: Daudi anamwita Uria, anakula na kunywa mbele yake, Daudi anamlevya, na Uria hakwenda nyumbani. Hata hivyo, «ili alale» inaweza kueleweka kama kusudi la kulala, ilhali לִשְׁכַּב hueleza tendo la kujilaza; «kwenda kujilaza» hufuata kwa karibu zaidi. Pia מִשְׁכָּבוֹ ni ''kitanda chake'' katika muktadha huu, si tu ''mahali pake pa kulala.'''
