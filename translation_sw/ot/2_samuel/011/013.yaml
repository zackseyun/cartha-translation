translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye hadhi. Majina yametumiwa pale ambapo mlolongo wa viwakilishi ungeweza kuleta utata. Muundo na picha ya chanzo zimehifadhiwa inapowezekana bila kufanya sentensi isikike ya kigeni.
