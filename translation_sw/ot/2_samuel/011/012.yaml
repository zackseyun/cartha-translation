  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa simulizi umehifadhiwa kwa “Ndipo” na “Basi,” huku amri na marejeo ya wakati yakitolewa kwa lugha inayoeleweka kwa urahisi.
