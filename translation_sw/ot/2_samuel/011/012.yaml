base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/012.yaml
  text: Then David said to Uriah[a], “Stay here today also, and tomorrow I will send you away.” So Uriah stayed in Jerusalem that day and the next day.
translation:
  language: sw
  text: Ndipo Daudi akamwambia Uria, “Baki hapa leo pia, na kesho nitakutuma.” Basi Uria akakaa Yerusalemu siku hiyo na kesho yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siku hiyo na siku iliyofuata.”
    reason: Njia nyingine iliyo wazi ya kutafsiri וּמִמָּחֳרָת, yaani siku iliyofuata baada ya siku hiyo.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Kiunganishi pamoja na kitenzi cha mfululizo kinaendeleza simulizi; “Ndipo” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: שֵׁב בָּזֶה
  choice: Baki hapa
  rationale: Katika muktadha huu, ישׁב ina maana ya kubaki kwa muda mahali alipo, si kuketi tu; בָּזֶה inaeleweka kiasili kama “hapa.”
- source_word: גַּם הַיּוֹם
  choice: leo pia
  rationale: “Pia” huhifadhi msisitizo wa גַּם kwamba Uria abaki kwa siku hii vilevile.
- source_word: וּמָחָר אֲשַׁלְּחֶךָּ
  choice: na kesho nitakuacha uondoke
  rationale: שׁלח hapa ni kumruhusu au kumwagiza Uria aondoke. Kauli hii ni ya asili katika Kiswahili na haidokezi kwamba Daudi mwenyewe atamsindikiza.
- source_word: וַיֵּשֶׁב
  choice: Basi ... akakaa
  rationale: “Basi” huonyesha mwendelezo wa matokeo katika simulizi, na “akakaa” hapa humaanisha kwamba Uria aliendelea kubaki Yerusalemu.
- source_word: בִירוּשָׁלִַם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali katika Kiswahili cha Biblia.
- source_word: בַּיּוֹם הַהוּא וּמִמָּחֳרָת
  choice: siku hiyo na kesho yake
  rationale: Kauli hii huonyesha siku hiyo pamoja na siku iliyofuata; “kesho yake” ni fupi, wazi, na ya asili katika Kiswahili.
