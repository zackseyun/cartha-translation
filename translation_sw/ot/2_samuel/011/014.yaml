  text: In the morning[a], David wrote a letter to Joab and sent it by the hand of Uriah.
translation:
  language: sw
  text: Asubuhi, Daudi akamwandikia Yoabu barua, akaituma kwa mkono wa Uria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “kupitia Uria” au “pamoja na Uria.” Kiebrania kinasema kihalisi “kwa mkono wa Uria,” nahau inayoweza kumaanisha kutumwa kupitia au kuwasilishwa na Uria.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Asubuhi
  rationale: Kauli hii inaendeleza mfululizo wa simulizi na kuweka wakati wa tukio. Katika Kiswahili, “Asubuhi” ni ya asili na inatosha bila kutafsiri וַיְהִי kwa maneno mazito kama “ikawa.”
- source_word: וַיִּכְתֹּב
  choice: akamwandikia
  rationale: Kitenzi “akamwandikia” kinaonyesha kwa kawaida kwamba Daudi aliandika ujumbe uliolengwa kwa Yoabu, huku kiambishi “aka-” kikiendeleza mfuatano wa simulizi.
- source_word: סֵפֶר
  choice: barua
  rationale: Ingawa neno hili linaweza kumaanisha hati kwa upana, katika muktadha wa ujumbe ulioandikwa na kutumwa kwa mtu fulani maana ya kawaida ni “barua.”
- source_word: אֶל יוֹאָב
  choice: Yoabu
  rationale: Yule anayepokea barua ameonyeshwa kwa kiambishi cha mtendewa katika “akamwandikia Yoabu,” namna ya asili ya Kiswahili ya kuwasilisha אֶל katika muktadha huu.
- source_word: וַיִּשְׁלַח
  choice: akaituma
  rationale: Hili ni neno la kawaida na la wazi kwa kitendo cha kuituma barua; kiambishi “-i-” kinarejelea barua.
- source_word: בְּיַד
  choice: kwa mkono wa
  rationale: Tafsiri hii inadumisha nahau halisi ya Kiebrania na pia kejeli nzito ya Uria kubeba mwenyewe ujumbe huo. Tanbihi inaeleza maana ya kiwakala au uwasilishaji.
- source_word: אוּרִיָּה
  choice: Uria
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. Muundo wa “aka-” umetumiwa kuonyesha mfuatano wa matendo. Nahau “kwa mkono wa Uria” imehifadhiwa katika matini kwa sababu inaeleweka na inadumisha mkazo wa simulizi; maana zake mbadala zimewekwa katika tanbihi.
