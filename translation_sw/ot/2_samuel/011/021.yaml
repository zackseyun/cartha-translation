  text: מִֽי הִכָּ֞ה אֶת אֲבִימֶ֣לֶךְ בֶּן יְרֻבֶּ֗שֶׁת הֲ/לֽוֹא אִשָּׁ֡ה הִשְׁלִ֣יכָה עָלָי/ו֩ פֶּ֨לַח רֶ֜כֶב מֵ/עַ֤ל הַֽ/חוֹמָה֙ וַ/יָּ֣מָת בְּ/תֵבֵ֔ץ לָ֥/מָּה נִגַּשְׁתֶּ֖ם אֶל הַֽ/חוֹמָ֑ה וְ/אָ֣מַרְתָּ֔ גַּ֗ם עַבְדְּ/ךָ֛ אוּרִיָּ֥ה הַ/חִתִּ֖י מֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/021.yaml
  text: Who struck down Abimelech son of Jerubbesheth? Was it not a woman who threw an upper millstone on him from the wall[a], so that he died at Thebez? Why did you go near the wall?’ Then you shall say[c][b], ‘Your servant Uriah the Hittite is dead also.’
translation:
  language: sw
  text: “Ni nani aliyempiga Abimeleki mwana wa Yerubeshethi[a]? Je, si mwanamke aliyemtupia kipande cha jiwe la juu la kusagia[b] kutoka juu ya ukuta, na Abimeleki akafa huko Tebesi[c]? Kwa nini mliukaribia ukuta?” Ndipo utakaposema, “Pia mtumishi wako Uria Mhiti amekufa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina “Yerubeshethi”; linganisha Waamuzi 9:1, ambapo jina “Yerubaali” linatumiwa.
    reason: alternative_reading
  - marker: b
    text: Au, “jiwe la juu la kusagia.” Kirai cha Kiebrania kinaweza kueleweka kuwa kipande cha jiwe hilo.
    reason: lexical_alternative
  - marker: c
    text: Tazama Waamuzi 9:53 kwa simulizi linalorejelewa hapa.
    reason: cross_reference
lexical_decisions:
- source_word: הִכָּה
  choice: aliyempiga
  rationale: Neno hili kimsingi humaanisha ‘kupiga.’ Tafsiri haiongezi ‘kuua,’ kwa kuwa kifo cha Abimeleki kinaelezwa wazi baadaye katika sentensi.
- source_word: אֲבִימֶלֶךְ בֶּן יְרֻבֶּשֶׁת
  choice: Abimeleki mwana wa Yerubeshethi
  rationale: Inafuata jina lililo katika maandishi ya Kiebrania ya WLC hapa bila kulisawazisha na ‘Yerubaali’ la Waamuzi 9.
- source_word: הֲלוֹא
  choice: Je, si
  rationale: Huhifadhi swali la balagha linalotarajia jibu la kukubali.
- source_word: פֶּלַח רֶכֶב
  choice: kipande cha jiwe la juu la kusagia
  rationale: פֶּלַח ni kipande au sehemu, na רֶכֶב hapa ni jiwe la juu la kusagia. Ufasiri huu unahifadhi vipengele vyote vya kirai cha Kiebrania.
- source_word: מֵעַל הַחוֹמָה
  choice: kutoka juu ya ukuta
  rationale: Hueleza wazi mahali pa juu palipoonyeshwa na kihusishi cha Kiebrania.
- source_word: וַיָּמָת בְּתֵבֵץ
  choice: naye akafa huko Tebesi
  rationale: Hufuata mfululizo wa simulizi bila kufanya uhusiano wa kisababishi kuwa wazi zaidi kuliko ulivyo katika Kiebrania.
- source_word: לָמָּה נִגַּשְׁתֶּם אֶל הַחוֹמָה
  choice: Kwa nini mliukaribia ukuta?
  rationale: Kitenzi kina maana ya kukaribia; umbo la wingi katika Kiebrania limehifadhiwa kwa ‘mli-’.
- source_word: וְאָמַרְתָּ
  choice: Ndipo utakaposema
  rationale: Huhifadhi agizo kwa mjumbe mmoja na kuonyesha mfuatano wa jibu linalopaswa kutolewa.
- source_word: גַּם עַבְדְּךָ אוּרִיָּה הַחִתִּי מֵת
  choice: Pia mtumishi wako Uria Mhiti amekufa
  rationale: ‘Pia’ huhifadhi maana ya nyongeza ya גַּם, na ‘mtumishi wako’ inafaa kwa lugha ya heshima ya kifalme.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Majina yameandikwa kwa maumbo ya kawaida ya Kiswahili, huku tofauti halisi ya Yerubeshethi/Yerubaali na uwezekano wa kimaana wa jiwe la kusagia vikihifadhiwa katika tanbihi.
