base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/003.yaml
  text: So David sent and inquired about the woman, and someone said, “Is this not Bathsheba, the daughter of Eliam, the wife of Uriah the Hittite?”
translation:
  language: sw
  text: Basi Daudi akatuma kuulizia habari za mwanamke huyo. Mtu mmoja akasema, “Je, huyu si Bathsheba binti Eliamu, mke wa Uria Mhiti?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד
  choice: Daudi akatuma watu
  rationale: Kitenzi cha Kiebrania kinaweza kutumika bila kutaja waliotumwa; kuongeza “watu” kwa Kiswahili huonyesha maana iliyodokezwa bila kumfanya Daudi mwenyewe kuwa ndiye aliyeenda.
- source_word: וַיִּדְרֹשׁ לָאִשָּׁה
  choice: waulize habari za yule mwanamke
  rationale: Huwasilisha uchunguzi kuhusu utambulisho au hali ya mwanamke kwa Kiswahili cha kawaida.
- source_word: וַיֹּאמֶר
  choice: Mtu mmoja akasema
  rationale: Umbo la Kiebrania halitaji wazi msemaji. Tafsiri hii inahifadhi kwamba jibu lilitolewa na mtu asiyeainishwa, badala ya kudhani kuwa Daudi ndiye aliyesema.
- source_word: הֲלוֹא
  choice: Je, ... si
  rationale: Huwakilisha swali la Kiebrania linalotarajia uthibitisho.
- source_word: בַּת שֶׁבַע
  choice: Bath-sheba
  rationale: Tahajia yenye kistari hutenganisha vipashio vya jina la Kiebrania na kudumisha utambulisho wake unaotambulika.
- source_word: הַחִתִּי
  choice: Mhiti
  rationale: Jina la kawaida la Kiswahili kwa mtu wa taifa la Wahiti.
theological_decisions:
- issue: Utambulisho wa msemaji wa taarifa kuhusu Bath-sheba
  choice: Mtu mmoja akasema
  alternative: akasema / Daudi akasema
  rationale: Kiebrania hutumia kitenzi katika nafsi ya tatu umoja bila kiima kilichotajwa wazi. Muktadha unaelekea kwa mtoa taarifa asiyeainishwa; kumtaja Daudi kungeondoa utata kwa msingi usio wa lazima.
- issue: Msisitizo wa hali ya ndoa ya mwanamke
  choice: mke wa Uria Mhiti
  alternative: ambaye ameolewa na Uria Mhiti
  rationale: Muundo wa nomino wa Kiebrania ni wa moja kwa moja na unamtambulisha wazi kama mke wa Uria, jambo muhimu katika simulizi, bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili kwa mtiririko wa kawaida, huku swali na mfuatano wa utambulisho wa mwanamke vikihifadhiwa.
