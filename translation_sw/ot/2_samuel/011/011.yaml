  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אוּרִיָּ֜ה אֶל דָּוִ֗ד הָ֠/אָרוֹן וְ/יִשְׂרָאֵ֨ל וִֽ/יהוּדָ֜ה יֹשְׁבִ֣ים בַּ/סֻּכּ֗וֹת וַ/אדֹנִ֨/י יוֹאָ֜ב וְ/עַבְדֵ֤י אֲדֹנִ֨/י עַל פְּנֵ֤י הַ/שָּׂדֶה֙ חֹנִ֔ים וַ/אֲנִ֞י אָב֧וֹא אֶל בֵּיתִ֛/י לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּ֖וֹת וְ/לִ/שְׁכַּ֣ב עִם אִשְׁתִּ֑/י חַיֶּ֨/ךָ֙ וְ/חֵ֣י נַפְשֶׁ֔/ךָ אִֽם אֶעֱשֶׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/011.yaml
  text: Uriah said to David[a], “The ark, and Israel and Judah, are staying in shelters, and my lord Joab and the servants of my lord are camped in the open field. Shall I then go to my house to eat and to drink and to lie with my wife? As surely as you live, and as your soul lives[c][b], I will not do this thing.”
translation:
  language: sw
  text: Uria akamwambia Daudi, “Sanduku, Israeli na Yuda wanakaa vibandani[a], na bwana wangu Yoabu pamoja na watumishi wa bwana wangu wamepiga kambi uwandani. Je, mimi niende nyumbani kwangu kula, kunywa na kulala na mke wangu?[b] Kama uishivyo, na kama nafsi yako iishivyo,[c] sitafanya jambo hili.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika makao ya muda.” Neno la Kiebrania linamaanisha vibanda au makao ya muda yaliyotumiwa uwandani.
    reason: lexical_alternative
  - marker: b
    text: Maneno haya ni swali la balagha linaloonyesha kwamba Uria anakataa kwenda nyumbani.
    reason: alternative_reading
  - marker: c
    text: 'Kwa Kiebrania hii ni kauli ya kiapo: “Kama uishivyo, na kama nafsi yako iishivyo, ikiwa nitafanya jambo hili”—ambapo “ikiwa” baada ya kiapo hutoa maana ya kukataa kwa nguvu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: Sanduku
  rationale: Kiebrania kinasema tu ‘sanduku’ likiwa na kibainishi. Herufi kubwa inaonyesha rejeleo lake maalumu bila kuongeza ‘la Agano’ au ‘la Mungu,’ maneno yasiyokuwamo katika mstari huu.
- source_word: יֹשְׁבִים בַּסֻּכּוֹת
  choice: wanakaa vibandani
  rationale: סֻכּוֹת ni makao ya muda au vibanda. ‘Wanakaa vibandani’ ni Kiswahili cha kawaida na huhifadhi hali ya makao ya muda vitani.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Hapa ni cheo cha heshima kwa mwanadamu, si jina la Mungu. ‘Bwana wangu’ huhifadhi heshima na kurudiwa kwake katika Kiebrania.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: uwandani
  rationale: Nahau hiyo inaonyesha eneo la wazi ambako jeshi limepiga kambi; ‘uwandani’ ni fupi na ya asili katika muktadha wa kijeshi.
- source_word: חֹנִים
  choice: wamepiga kambi
  rationale: Kauli hii inaeleza jeshi lililoko kambini wakati huo. ‘Wamepiga kambi’ ni usemi wa kawaida wa Kiswahili.
- source_word: וַאֲנִי אָבוֹא אֶל בֵּיתִי
  choice: Je, mimi niende nyumbani kwangu
  rationale: Ingawa umbo lake ni la kitenzi cha nafsi ya kwanza, muktadha unaonyesha swali la balagha lenye kukataa kwa msisitizo.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׁכַּב עִם אִשְׁתִּי
  choice: kula, kunywa na kulala na mke wangu
  rationale: ‘Kulala na’ huhifadhi lugha ya staha ya Kiebrania kuhusu uhusiano wa ndoa, huku orodha ya vitendo ikibaki wazi na ya kawaida.
- source_word: חַיֶּךָ וְחֵי נַפְשֶׁךָ
  choice: Kama uishivyo, na kama nafsi yako iishivyo
  rationale: Tafsiri hii huhifadhi kauli ya kiapo na urudiaji wake wa dhati, pamoja na neno ‘nafsi’ kwa נֶפֶשׁ.
- source_word: אִם אֶעֱשֶׂה אֶת הַדָּבָר הַזֶּה
  choice: sitafanya jambo hili
  rationale: Baada ya kauli ya kiapo, אִם ni sehemu ya kiapo chenye maana ya kukataa kwa nguvu. Kutaja ukanushaji wazi hutoa maana yake sahihi katika Kiswahili.
theological_decisions:
- issue: Utambulisho wa Sanduku
  choice: Sanduku
  alternative: Sanduku la Agano / Sanduku la Mungu
  rationale: Mstari wenyewe hautoi jina lililopanuliwa; tafsiri haiongezi maelezo ya kitheolojia yasiyosemwa hapa.
- issue: Kauli ya kiapo yenye אִם
  choice: sitafanya jambo hili
  alternative: ikiwa nitafanya jambo hili
  rationale: Kukamilisha ukanushaji uliodokezwa na fomula ya kiapo huzuia tafsiri potovu, bila kupunguza uzito wa kiapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Urudiaji wa ‘bwana wangu’ na uzito wa kiapo umehifadhiwa; lugha ya uhusiano wa ndoa imebaki ya staha.
