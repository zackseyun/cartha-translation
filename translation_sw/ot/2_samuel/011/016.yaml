translation:
  language: sw
  text: Basi Yoabu alipokuwa akiutazama mji, akamweka Uria mahali ambapo alijua kuwa kulikuwa na wapiganaji hodari[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mashujaa” au “wapiganaji wenye nguvu.” Kirai cha Kiebrania אַנְשֵׁי חַיִל hapa kinamaanisha wapiganaji wenye uwezo au wa kutisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁמֹר
  choice: alipokuwa akiuangalia ... kwa makini
  rationale: Kitenzi שׁמר pamoja na בִּ kinaanzisha kishazi cha wakati. Katika muktadha wa kuzingira mji, kinamaanisha kuutazama au kuufuatilia kwa makini, si kuulinda.
- source_word: אֶל הָעִיר
  choice: mji
  rationale: Hapa אֶל inaonyesha kitu kilicholengwa na uangalizi. Kiswahili cha kawaida hakihitaji kihusishi kingine baada ya ‘kuangalia.’
- source_word: וַיִּתֵּן אֶת־אוּרִיָּה
  choice: akamweka Uria
  rationale: Ingawa נתן kwa msingi ni ‘kutoa’ au ‘kuweka,’ hapa inaeleza kumweka askari katika eneo fulani kimakusudi. ‘Akamweka’ ni ya kawaida na haiongezi maana isiyothibitishwa.
- source_word: הַמָּקוֹם
  choice: mahali
  rationale: מקום humaanisha ‘mahali’; muktadha unaonyesha kwamba hapa ni sehemu ya mapigano.
- source_word: יָדַע
  choice: alijua
  rationale: Hii ndiyo maana ya kawaida na ya moja kwa moja ya ידע katika simulizi.
- source_word: אַנְשֵׁי חַיִל
  choice: wapiganaji hodari
  rationale: Katika muktadha huu, kirai hiki kinamaanisha watu wenye uwezo na nguvu katika vita. ‘Wapiganaji hodari’ huonyesha wazi kwamba ni askari wa kutisha bila kuwafanya waonekane kuwa kikosi maalumu cha Daudi.
- source_word: שָׁם
  choice: kulikuwa
  rationale: Muundo ‘mahali ambapo ... kulikuwa’ unawasilisha maana ya mahali ya שָׁם kwa Kiswahili cha kawaida.
- source_word: וַיְהִי
  choice: Basi ... alipokuwa
  rationale: Muundo huu unaendeleza simulizi na kuhifadhi uhusiano wa wakati bila kutumia tafsiri ngumu ya neno kwa neno.
