  text: וַ/יְהִי֩ לִ/תְשׁוּבַ֨ת הַ/שָּׁנָ֜ה לְ/עֵ֣ת צֵ֣את הַ/מַּלְאֿכִ֗ים וַ/יִּשְׁלַ֣ח דָּוִ֡ד אֶת יוֹאָב֩ וְ/אֶת עֲבָדָ֨י/ו עִמּ֜/וֹ וְ/אֶת כָּל יִשְׂרָאֵ֗ל וַ/יַּשְׁחִ֨תוּ֙ אֶת בְּנֵ֣י עַמּ֔וֹן וַ/יָּצֻ֖רוּ עַל רַבָּ֑ה וְ/דָוִ֖ד יוֹשֵׁ֥ב בִּ/ירוּשָׁלִָֽם׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/001.yaml
  text: At the turn of the year[a], at the time when kings go out to battle, David sent Joab, his servants with him, and all Israel. They devastated the Ammonites and besieged Rabbah[b], but David remained in Jerusalem.
translation:
  language: sw
  text: Mwaka ulipogeuka[a], wakati wafalme walipotoka kwenda vitani[b], Daudi akawatuma Yoabu, watumishi wake pamoja naye, na Israeli wote. Wakawaharibu Waamoni na kuuzingira Raba, lakini Daudi akabaki Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wakati wa kurudi/kugeuka kwa mwaka”; huenda inarejelea majira ya kuchipua, msimu ambao kampeni za kijeshi zilianza.'
    reason: cultural_note
  - marker: b
    text: Au “wakati wajumbe walipotoka.” Muktadha unaunga mkono kwa nguvu zaidi usomaji “wafalme walipotoka kwenda vitani.”
    reason: alternative_reading
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: Mwaka ulipogeuka
  rationale: Huhifadhi taswira ya Kiebrania ya mwaka ‘kurudi’ au ‘kugeuka’ bila kuamua kimya kimya kwamba neno hilo linamaanisha majira ya kuchipua.
- source_word: לְעֵת צֵאת הַמַּלְאכִים
  choice: wakati wafalme walipotoka kwenda vitani
  rationale: Muktadha wa kijeshi unaunga mkono usomaji ‘wafalme’; ‘kwenda vitani’ huweka wazi maana inayodokezwa na kutoka kwao katika msimu wa kampeni.
- source_word: וַיִּשְׁלַח
  choice: alimtuma
  rationale: Ni tafsiri ya kawaida na ya asili ya kitenzi שלח katika simulizi; umoja wa mtendwa unamrejelea Yoabu, huku walioandamana naye wakitajwa baada yake.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Huhifadhi upana wa neno la Kiebrania, linaloweza kumaanisha watumishi au watu walio chini ya mamlaka ya mfalme, bila kulibana kuwa maofisa wa jeshi pekee.
- source_word: כָּל יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Hufuata usemi wa Kiebrania moja kwa moja; katika muktadha huu unawakilisha jeshi au nguvu ya taifa kwa ujumla.
- source_word: וַיַּשְׁחִתוּ
  choice: Wakawaharibu
  rationale: Kitenzi kinaonyesha uharibifu mkubwa wa kijeshi. ‘Wakawaharibu’ huepuka kudai wazi kwamba kila Mwamoni aliuawa, kwa kuwa simulizi linaendelea na kuzingirwa kwa Raba.
- source_word: בְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Hili ndilo jina la kawaida na la asili la watu hao kwa Kiswahili, badala ya tafsiri ya neno kwa neno ‘wana wa Amoni.’
- source_word: וַיָּצֻרוּ עַל רַבָּה
  choice: kuuzingira Raba
  rationale: Kitenzi צור pamoja na על humaanisha kulizingira jiji katika vita; muundo huu ni mfupi na wa asili kwa Kiswahili.
- source_word: יוֹשֵׁב
  choice: akabaki
  rationale: Ingawa kimsingi neno hilo linaweza kumaanisha kukaa au kuishi, hapa linaonyesha tofauti kwamba Daudi hakutoka pamoja na jeshi bali alibaki Yerusalemu.
- source_word: בִּירוּשָׁלִָם
  choice: Yerusalemu
  rationale: Ni umbo la kawaida la jina la mahali hapa katika Kiswahili.
theological_decisions:
- issue: Usomaji wa לְעֵת צֵאת הַמַּלְאכִים katika maelezo ya msimu wa vita
  choice: wakati wafalme walipotoka kwenda vitani
  alternative: wakati wajumbe walipotoka
  rationale: Muktadha wa kampeni ya kijeshi na desturi ya vita vya msimu unaunga mkono ‘wafalme.’ Pia usomaji huo unaacha ionekane tofauti ya kisimulizi kati ya kile ambacho wafalme walifanya kwa kawaida na uamuzi wa Daudi kubaki Yerusalemu. Usomaji mwingine umehifadhiwa katika tanbihi badala ya kufichwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa na wenye heshima. Viunganishi vya mfululizo ‘wakawa-’ vinaendeleza mwendo wa simulizi la Kiebrania, na ‘lakini’ linaonyesha wazi tofauti muhimu kwamba Daudi alibaki Yerusalemu.
