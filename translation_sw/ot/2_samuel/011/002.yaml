base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/002.yaml
  text: Then at evening time David arose from his bed and walked on the roof of the king’s house[a], and from the roof he saw a woman bathing[b]; and the woman was very beautiful in appearance.
translation:
  language: sw
  text: Ikawa, wakati wa jioni, Daudi akainuka kutoka kitandani mwake, akatembea-tembea juu ya paa la nyumba ya mfalme[a]. Akiwa juu ya paa, akamwona mwanamke akioga; mwanamke huyo alikuwa wa sura nzuri sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “nyumba ya mfalme”; “ikulu” ni tafsiri nyingine inayowezekana kulingana na muktadha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְעֵת הָעֶרֶב
  choice: Ikawa wakati wa jioni
  rationale: Huhifadhi utangulizi wa kisimulizi na wakati uliotajwa katika Kiebrania, huku ikibaki wazi na yenye hadhi katika Kiswahili.
- source_word: וַיָּקָם ... מֵעַל מִשְׁכָּבוֹ
  choice: akainuka kutoka kitandani mwake
  rationale: Kitenzi קום kinatafsiriwa moja kwa moja kuwa ‘kuinuka,’ na מִשְׁכָּב hapa inaeleweka kwa kawaida kama kitanda au mahali pa kulala.
- source_word: וַיִּתְהַלֵּךְ
  choice: akatembea-tembea
  rationale: Urudiaji wa kitenzi katika Kiswahili unaonyesha mwendo wa kuendelea au wa huku na huku unaoweza kudokezwa na umbo la Kiebrania, bila kuongeza wazo la kustarehe lisilotajwa wazi.
- source_word: עַל גַּג בֵּית הַמֶּלֶךְ
  choice: juu ya paa la nyumba ya mfalme
  rationale: Ni tafsiri iliyo karibu na maneno ya Kiebrania. ‘Ikulu’ inawezekana kimuktadha, lakini ‘nyumba ya mfalme’ huhifadhi usemi wa chanzo.
- source_word: וַיַּרְא אִשָּׁה רֹחֶצֶת
  choice: akamwona mwanamke akioga
  rationale: ‘Akioga’ huonyesha tendo lililokuwa likiendelea kama kishirikishi cha Kiebrania רֹחֶצֶת.
- source_word: מֵעַל הַגָּג
  choice: Akiwa juu ya paa
  rationale: Kishazi hiki kinaonyesha mahali Daudi alipokuwa alipoona mwanamke. Muundo huu ni wa asili katika Kiswahili na huweka wazi mtazamo wa kijiografia.
- source_word: טוֹבַת מַרְאֶה מְאֹד
  choice: mzuri sana wa sura
  rationale: Huhifadhi msisitizo wa chanzo juu ya mwonekano wa mwanamke, badala ya kusema tu kwamba alikuwa mzuri sana.
