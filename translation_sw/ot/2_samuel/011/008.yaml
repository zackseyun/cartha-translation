  yaml_path: translation/ot/2_samuel/011/008.yaml
  text: Then David said to Uriah[a], “Go down to your house and wash your feet.” So Uriah went out from the king’s house[b], and a present from the king went out after him.
translation:
  language: sw
  text: Ndipo Daudi akamwambia Uria, “Shuka uende nyumbani kwako, ukaoshe miguu yako.[a]” Basi Uria akatoka katika nyumba ya mfalme, na zawadi kutoka kwa mfalme ikafuata nyuma yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ukaoshe miguu yako” ni usemi wa moja kwa moja ambao pia unaweza kudokeza kujiburudisha au kutulia nyumbani baada ya safari.
    reason: cultural_note
  - marker: b
    text: Au “sehemu kutoka kwa mfalme.” Neno la Kiebrania linaweza kumaanisha kitu kinachobebwa au kutumwa, kutia ndani sehemu au zawadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵד
  choice: Shuka uende
  rationale: Kitenzi ירד kina maana ya kushuka. Muundo huu unahifadhi mwelekeo wa Kiebrania huku ukisikika kwa kawaida katika Kiswahili.
- source_word: לְבֵיתְךָ
  choice: nyumbani kwako
  rationale: Ingawa בית ni ‘nyumba,’ katika amri ya kwenda kwenye makao ya mtu mwenyewe, ‘nyumbani kwako’ ni Kiswahili cha kawaida na wazi.
- source_word: וּרְחַץ רַגְלֶיךָ
  choice: ukaoshe miguu yako
  rationale: Tafsiri halisi ya usemi huo inahifadhi picha ya kuosha miguu na haifuti dokezo lake la kujiburudisha au kutulia nyumbani.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: katika nyumba ya mfalme
  rationale: Hii inafuata kwa karibu maana ya ‘kutoka nyumba ya mfalme’; ‘ikulu’ ingewezekana katika muktadha lakini ni fasiri yenye umahususi zaidi.
- source_word: מַשְׂאַת הַמֶּלֶךְ
  choice: zawadi kutoka kwa mfalme
  rationale: מַשְׂאֵת inaweza kumaanisha kitu kilichobebwa au kutumwa, hasa sehemu au zawadi. ‘Zawadi’ ni wazi na inafaa katika muktadha, huku tanbihi ikihifadhi maana mbadala.
- source_word: אַחֲרָיו
  choice: kumfuata
  rationale: Neno hilo linaonyesha kitu kilichoenda baada ya Uria. ‘Kumfuata’ ni Kiswahili cha kawaida katika simulizi hili.
