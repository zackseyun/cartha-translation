base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/023.yaml
  text: The messenger said to David[a], “The men were stronger than we were, and they came out against us into the open field[b]; but we pressed them back as far as the entrance of the gate.”
translation:
  language: sw
  text: Mjumbe akamwambia Daudi, “Watu hao walituzidi nguvu[a], wakatoka kutukabili uwandani; lakini tuliwasukuma nyuma[b] mpaka kwenye mwingilio wa lango.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walitushinda.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “tukawa juu yao”; hii ni nahau ya kivita inayoweza kumaanisha kwamba watu wa Daudi waliwashambulia kwa nguvu au waliwasukuma nyuma.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: mjumbe
  rationale: Katika muktadha huu ni mjumbe wa kijeshi aliye mwanadamu, si malaika; ‘mjumbe’ ni neno la kawaida na sahihi.
- source_word: כִּי
  choice: imewasilishwa kwa kuanzisha moja kwa moja taarifa iliyonukuliwa
  rationale: Hapa neno hili linaanzisha yaliyomo katika taarifa; Kiswahili cha kawaida hakihitaji kiunganishi cha moja kwa moja kama ‘kwa kuwa’ baada ya ‘akamwambia.’
- source_word: גָבְרוּ עָלֵינוּ
  choice: walituzidi nguvu
  rationale: Kauli hii huhifadhi maana ya kuwazidi wengine nguvu au kuwashinda katika mapambano, bila kuifanya kuwa nzito katika Kiswahili.
- source_word: הָאֲנָשִׁים
  choice: watu hao
  rationale: Kiebrania kinasema ‘watu hao’ au ‘wanaume hao’; katika muktadha wanajeshi adui wanaeleweka bila kulazimisha neno ‘askari.’
- source_word: וַיֵּצְאוּ אֵלֵינוּ הַשָּׂדֶה
  choice: wakatoka kutukabili uwandani
  rationale: Hii inaonyesha kuwa watetezi walitoka mjini na kuwaendea kwa uhasama katika eneo la wazi; ‘kutukabili’ huonyesha uelekeo wa uhasama kwa Kiswahili cha kawaida.
- source_word: וַנִּהְיֶה עֲלֵיהֶם
  choice: tuliwasukuma nyuma
  rationale: Kihalisi ni ‘tukawa juu yao,’ lakini katika taarifa hii ya vita ni nahau inayoonyesha kuanza kuwazidi au kuwasukuma adui nyuma; tafsiri hii pia inaendana na mpaka unaotajwa baadaye.
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: mpaka kwenye mwingilio wa lango
  rationale: Huhifadhi mpaka wa kijiografia wa kuwafuatilia, yaani hadi sehemu ya kuingilia katika lango la mji.
