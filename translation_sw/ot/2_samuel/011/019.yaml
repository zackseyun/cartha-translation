  yaml_path: translation/ot/2_samuel/011/019.yaml
  text: And he commanded the messenger[a], saying, “When you have finished telling the king all the news of the battle,”
translation:
  language: sw
  text: Naye akamwamuru mjumbe, akisema, “Utakapomaliza kumweleza mfalme habari zote za vita,[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo yote kuhusu vita,” yaani, taarifa kamili kuhusu vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: akamwamuru
  rationale: Kitenzi צוה kinaonyesha amri au maagizo yenye mamlaka; “akamwamuru” kinahifadhi nguvu hiyo katika mtiririko wa simulizi.
- source_word: הַמַּלְאָךְ
  choice: mjumbe
  rationale: Katika muktadha huu wa taarifa ya kijeshi, מַלְאָךְ ni mtu aliyetumwa kupeleka ujumbe, si malaika.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hiki ni kianzishi cha usemi wa moja kwa moja katika simulizi la Kiebrania; “akisema” ni tafsiri ya kawaida na ya asili.
- source_word: כְּכַלּוֹתְךָ
  choice: Utakapomaliza
  rationale: Muundo huu unaanzisha kishazi cha wakati; “utakapomaliza” huhifadhi maana ya kukamilisha tendo kabla ya linalofuata bila kusisitiza haraka isiyotajwa.
- source_word: כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: habari zote za vita
  rationale: דברים hapa ni mambo au taarifa zinazohusu vita. “Habari zote za vita” ni Kiswahili cha asili kinachoonyesha taarifa kamili, bila kutumia tafsiri isiyoeleweka ya neno kwa neno.
- source_word: לְדַבֵּר אֶל הַמֶּלֶךְ
  choice: kumweleza mfalme
  rationale: Katika muktadha huu, kusema na mfalme ni kumpa taarifa ya vita; “kumweleza mfalme” linaonyesha kazi hiyo ya mawasiliano kwa Kiswahili cha kawaida.
