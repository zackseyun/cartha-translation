translation:
  language: sw
  text: Basi Daudi akatuma ujumbe kwa Yoabu, akisema, “Mtume Uria Mhiti kwangu.” Naye Yoabu akamtuma Uria kwa Daudi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד אֶל יוֹאָב
  choice: Daudi akatuma ujumbe kwa Yoabu
  rationale: Kitenzi שׁלח maana yake ya msingi ni ‘kutuma.’ Kwa kuwa kitu kilichotumwa hakijatajwa na amri inafuata mara moja, ‘akatuma ujumbe’ huonyesha kwa Kiswahili cha kawaida kwamba Daudi aliwasilisha agizo kwa Yoabu.
- source_word: שְׁלַח אֵלַי
  choice: Mtume kwangu
  rationale: Kauli ya kuamuru שְׁלַח imetafsiriwa moja kwa moja kuwa ‘Mtume,’ na אֵלַי kuwa ‘kwangu.’ Tafsiri haiongezi wazo la ‘kumrudisha,’ ambalo halijaelezwa wazi katika Kiebrania.
- source_word: אֶת אוּרִיָּה הַחִתִּי
  choice: Uria Mhiti
  rationale: Jina אוּרִיָּה limetoholewa kuwa ‘Uria,’ na nomino ya utaifa הַחִתִּי imetafsiriwa kwa umbo la kawaida la Kiswahili ‘Mhiti.’ Kiashiria cha yambwa אֶת hakina tafsiri ya moja kwa moja.
- source_word: וַיִּשְׁלַח יוֹאָב אֶת אוּרִיָּה אֶל דָּוִד
  choice: Naye Yoabu akamtuma Uria kwa Daudi
  rationale: Kurudiwa kwa שׁלח kumehifadhiwa kwa ‘akamtuma.’ ‘Naye’ huendeleza mtiririko wa simulizi na kubainisha kwamba Yoabu ndiye aliyetekeleza agizo.
