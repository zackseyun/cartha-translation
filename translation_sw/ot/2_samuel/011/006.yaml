translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. ‘Basi’ huonyesha mwendelezo wa simulizi; ‘akisema’ hufanya uhusiano kati ya kutuma ujumbe na maneno ya agizo uwe wa asili bila kubadili maana.
