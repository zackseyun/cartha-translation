base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/022.yaml
  text: So the messenger went and came and told David all that Joab had sent him to say[a].
translation:
  language: sw
  text: Basi, mjumbe akaenda, akafika na kumweleza Daudi yote ambayo Yoabu alikuwa amemtuma aseme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “yote ambayo Yoabu alimtuma.” Maana ni kwamba mjumbe alimweleza Daudi yote ambayo Yoabu alikuwa amemtuma kuwasilisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: mjumbe
  rationale: Katika muktadha huu wa mawasiliano ya kijeshi, neno hili linamaanisha mtu aliyetumwa kupeleka ujumbe, si malaika.
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Hukuza mfululizo wa simulizi kwa njia ya kawaida na kuhifadhi kitendo cha kuondoka.
- source_word: וַיָּבֹא
  choice: akafika
  rationale: Ingawa kimsingi linaweza kutafsiriwa 'akaja,' 'akafika' ni la asili zaidi hapa kwa mjumbe anayekamilisha safari yake kwa Daudi.
- source_word: וַיַּגֵּד לְדָוִד
  choice: kumweleza Daudi
  rationale: Kitenzi katika kausativi kina maana ya kueleza, kutoa taarifa, au kujulisha; 'kumweleza' kinafaa kwa taarifa yenye maudhui yanayofuata.
- source_word: אֵת כָּל אֲשֶׁר
  choice: yote ambayo
  rationale: Huwasilisha ukamilifu wa maudhui ya ujumbe bila kuongeza maana.
- source_word: שְׁלָחוֹ יוֹאָב
  choice: Yoabu alikuwa amemtuma aseme
  rationale: Kiebrania kihalisi ni 'Yoabu alimtuma'; nyongeza ya 'aseme' inaweka wazi kusudi la kimawasiliano linaloeleweka kutokana na muktadha, huku tanbihi ikihifadhi muundo halisi.
- source_word: לְדָוִד
  choice: Daudi
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
theological_decisions: []
