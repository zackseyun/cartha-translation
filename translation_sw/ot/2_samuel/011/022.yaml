  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye hadhi. Mfululizo wa vitenzi umeunganishwa kwa ka-; 'akafika' limetumiwa badala ya 'akaja' kwa uasilia wa muktadha. Alama ya tanbihi [a] imewekwa katika matini.
