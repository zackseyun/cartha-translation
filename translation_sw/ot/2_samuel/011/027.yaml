  source_fidelity: The draft accurately conveys the sequence, Bathsheba's changed status, the birth of a son, and Yahweh's unsoftened moral judgment. However, “akatuma watu” explicitly adds “people,” whereas the Hebrew says only that David “sent”; the agents are implied but unstated.
  naturalness: The Swahili is generally clear and appropriately formal. “Maombolezo yalipokwisha,” “akamzalia mwana,” and “machoni pa Yahwe” are natural in a biblical narrative register. Removing the added object after “akatuma” also yields a more source-sensitive formulation.
  terminology: “Yahwe” consistently renders the divine name, and “ovu” appropriately retains the moral force of the Hebrew evaluation. The footnote correctly distinguishes the smoother alternative “halikumpendeza” from the more literal and stronger wording.
  issues:
  - severity: low
    issue: “akatuma watu” adds an explicit object absent from the Hebrew.
    rationale: וַיִּשְׁלַח states that David sent, without naming messengers. Since the text does not specify them, the translation should leave the agency implicit.
