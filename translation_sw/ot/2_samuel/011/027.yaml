base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/027.yaml
  text: When the mourning was over[a], David sent and brought her into his house, and she became his wife and bore him a son. But the thing that David had done was evil in the eyes of Yahweh.
translation:
  language: sw
  text: Maombolezo yalipokwisha, Daudi akatuma, akamleta huyo mwanamke nyumbani kwake. Akawa mke wake, naye akamzalia mwana. Lakini jambo alilofanya Daudi lilikuwa ovu machoni pa Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo alilofanya Daudi halikumpendeza Yahwe.” Kiebrania kinasema kihalisi zaidi, “lilikuwa ovu machoni pa Yahwe,” kikionyesha hukumu ya Mungu ya kimaadili kuhusu tendo la Daudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵבֶל
  choice: maombolezo
  rationale: Neno hili linarejelea kipindi na desturi za kuomboleza baada ya kifo cha Uria, si hisia ya huzuni pekee.
- source_word: וַיַּעֲבֹר
  choice: yalipokwisha
  rationale: Ingawa maana ya msingi ni ‘kupita,’ kwa maombolezo usemi wa kawaida wa Kiswahili ni ‘yalipokwisha.’
- source_word: וַיִּשְׁלַח דָּוִד וַיַּאַסְפָהּ אֶל־בֵּיתוֹ
  choice: Daudi akatuma watu wakamleta huyo mwanamke nyumbani kwake
  rationale: Hueleza kwa Kiswahili cha kawaida kwamba Daudi alituma watu kwa ajili yake na akamwingiza katika nyumba yake; ‘huyo mwanamke’ hudumisha rejeo la kiwakilishi cha Kiebrania bila kutaja jina lisilotajwa katika mstari.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: Akawa mke wake
  rationale: 'Muundo huu unaonyesha mabadiliko ya hali na matokeo yake: akawa mke wa Daudi.'
- source_word: וַתֵּלֶד לוֹ בֵּן
  choice: akamzalia mwana
  rationale: Ni usemi mfupi na wa kawaida unaohifadhi kirai cha Kiebrania chenye mtendewa ‘alimzalia yeye mwana.’
- source_word: וַיֵּרַע
  choice: lilikuwa ovu
  rationale: ‘Ovu’ huhifadhi uzito wa hukumu ya kimaadili badala ya kuifanya kuwa kutopendezwa tu.
- source_word: הַדָּבָר אֲשֶׁר עָשָׂה דָוִד
  choice: jambo alilofanya Daudi
  rationale: Huhifadhi namna ya Kiebrania ya kulitaja tendo lote kama ‘jambo’ bila kulifafanua zaidi ya chanzo.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Huhifadhi sitiari ya Kiebrania ya tathmini ya Mungu kwa usemi unaoeleweka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uzito wa hukumu ya msimulizi kuhusu tendo la Daudi
  choice: lilikuwa ovu machoni pa Yahwe
  alternative: halikumpendeza Yahwe
  rationale: Kitenzi cha Kiebrania kina nguvu ya wazi ya kimaadili katika muktadha huu. Tafsiri iliyochaguliwa haipunguzi hukumu ya Mungu kuwa kutopendezwa kwa kawaida tu.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Unukuzi huo huhifadhi jina binafsi lililo katika maandishi ya Kiebrania bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa simulizi ni mwepesi kueleweka, huku sitiari ya Kiebrania ‘machoni pa Yahwe’ na nguvu ya hukumu ya kimaadili vikihifadhiwa.
