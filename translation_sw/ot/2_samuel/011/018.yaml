translation:
  language: sw
  text: Kisha Yoabu akatuma ujumbe kumweleza Daudi habari zote za vita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo yote kuhusu vita.” Kiebrania kihalisi ni “maneno yote ya vita,” usemi unaorejelea maelezo au taarifa za mapigano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma ujumbe
  rationale: Kitenzi שׁלח kimsingi ni ‘kutuma.’ Katika muktadha huu, kinachofuata ni tendo la kutoa taarifa kwa Daudi; hivyo ‘akatuma ujumbe’ ni Kiswahili cha kawaida kinachoonyesha kwamba Yoabu alipeleka taarifa.
- source_word: יוֹאָב
  choice: Yoabu
  rationale: Hili ndilo umbo la kawaida la jina hili katika tafsiri za Biblia za Kiswahili.
- source_word: וַיַּגֵּד
  choice: kumweleza
  rationale: Katika kausativi, נגד humaanisha kusema, kueleza, au kutoa taarifa. ‘Kumweleza’ linafaa kwa ujenzi wenye Daudi kama mpokeaji wa taarifa.
- source_word: לְדָוִד
  choice: Daudi
  rationale: Jina limetolewa kwa umbo lake la kawaida la Kiswahili; kiambishi לְ kinawakilishwa kiasili na muundo wa kitenzi ‘kumweleza Daudi.’
- source_word: אֵת כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: habari zote za vita
  rationale: דִּבְרֵי kihalisi ni ‘maneno/mambo ya,’ lakini hapa ni nahau inayorejelea taarifa au maelezo ya mapigano. ‘Habari zote za vita’ ni ya asili na inaeleweka bila kuficha upana wa usemi wa Kiebrania.
- source_word: הַמִּלְחָמָה
  choice: vita
  rationale: מִלְחָמָה linaweza kumaanisha vita kwa upana au pigano maalumu. Kiswahili ‘vita’ ni cha kawaida katika muktadha huu na kinaweza kurejelea mapigano yaliyokuwa yakiripotiwa.
