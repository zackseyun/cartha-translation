translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wa sasa na wenye heshima. Muundo ‘Ndipo … akatuma ujumbe na kumweleza’ huhifadhi mfuatano wa vitenzi vya Kiebrania huku ukiwasilisha kwa kawaida wazo la kupeleka taarifa.
