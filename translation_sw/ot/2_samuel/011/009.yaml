  text: But Uriah slept at the entrance of the king’s house with all the servants of his lord[d][c][b][a], and did not go down to his house.
translation:
  language: sw
  text: Lakini Uria alilala penye mlango wa nyumba ya mfalme, pamoja na watumishi wote wa bwana wake; wala hakushuka kwenda nyumbani kwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenda katika nyumba yake.” Kiebrania, “hakushuka kwenda kwenye nyumba yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akalala
  rationale: Kitenzi שׁכב kinaweza kumaanisha kulala chini au kulala usingizi; katika muktadha huu kinaonyesha kwamba Uria alikaa hapo usiku, na “akalala” ni Kiswahili cha kawaida kisichoongeza ufafanuzi mwingi.
- source_word: פֶּתַח
  choice: kwenye mwingilio
  rationale: פֶּתַח ni uwazi, mlango, au sehemu ya kuingilia. “Kwenye mwingilio” huhifadhi maana ya mahali bila kudokeza kwamba alikuwa juu ya jani la mlango.
- source_word: בֵּית הַמֶּלֶךְ
  choice: nyumba ya mfalme
  rationale: Huu ndio uhamishaji wa moja kwa moja wa muundo wa Kiebrania; katika muktadha unamaanisha makao ya kifalme, yaani ikulu.
- source_word: אֵת כָּל עַבְדֵי אֲדֹנָיו
  choice: pamoja na watumishi wote wa bwana wake
  rationale: אֵת hapa huonyesha kuwa Uria alikuwa pamoja na watumishi hao. “Watumishi” linafaa katika mazingira ya ikulu, na “bwana wake” huhifadhi uhusiano wa mamlaka kati ya Daudi na Uria.
- source_word: וְלֹא יָרַד אֶל בֵּיתוֹ
  choice: wala hakushuka kwenda nyumbani kwake
  rationale: “Hakushuka” huhifadhi kitenzi ירד, huku “kwenda nyumbani kwake” ikiwa kauli ya kawaida ya Kiswahili kwa kuelekea katika nyumba yake mwenyewe.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la kifalme. “Bwana” limeandikwa kwa herufi ndogo kwa kuwa hapa linamtaja Daudi, si Mungu. Uhalisi wa kitenzi “kushuka” umehifadhiwa, lakini “nyumbani kwake” limetumiwa kwa ufasaha wa kawaida; maana halisi zaidi imewekwa katika tanbihi.
