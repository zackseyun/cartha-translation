  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Kurudiwa kwa ‘mume wake’ kumehifadhiwa kwa sababu kunapatikana katika maandishi ya Kiebrania na kunasisitiza uhusiano huo.
