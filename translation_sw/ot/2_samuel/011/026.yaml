  yaml_path: translation/ot/2_samuel/011/026.yaml
  text: When Uriah’s wife heard that Uriah her husband was dead[a], she mourned for her husband.
translation:
  language: sw
  text: Mke wa Uria aliposikia kwamba Uria, mume wake, alikuwa amekufa[a], alimwombolezea mume wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa amefariki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: aliposikia
  rationale: Kitenzi שׁמע katika qal kwa kawaida humaanisha ‘kusikia’; muundo wa ‘aliposikia’ ni wa kawaida katika simulizi la Kiswahili na unaunganisha vizuri matukio yaliyofuatana.
- source_word: אֵשֶׁת אוּרִיָּה
  choice: Mke wa Uria
  rationale: Muundo huu wa Kiswahili ni wa kawaida na unahifadhi wazi uhusiano uliotajwa katika kishazi cha Kiebrania.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי inaanzisha maudhui ya jambo alilosikia, hivyo ‘kwamba’ ndiyo tafsiri ya moja kwa moja na ya kawaida.
- source_word: מֵת
  choice: alikuwa amekufa
  rationale: Neno hili linaeleza hali ya Uria kuwa mfu; ‘alikuwa amekufa’ linafaa katika mfuatano wa wakati baada ya ‘aliposikia’ na pia linaweza kueleweka kama tukio lililokuwa limetokea.
- source_word: אוּרִיָּה אִישָׁהּ
  choice: Uria, mume wake
  rationale: Kirai cha ufafanuzi kinamtambulisha Uria wazi kuwa mume wake; koma zinaifanya sentensi iwe ya kawaida na dhahiri katika Kiswahili.
- source_word: וַתִּסְפֹּד
  choice: alimwombolezea
  rationale: ספד humaanisha kuomboleza au kutoa maombolezo kwa ajili ya aliyekufa; ‘alimwombolezea’ ni neno la Kiswahili lenye heshima na linalofaa muktadha.
- source_word: עַל
  choice: -zea
  rationale: Maana ya עַל pamoja na kitenzi cha kuomboleza imewasilishwa kwa kiambishi cha kutendea katika ‘alimwombolezea,’ yaani kuomboleza kwa ajili ya mtu.
- source_word: בַּעְלָהּ
  choice: mume wake
  rationale: Katika muktadha wa ndoa, בַּעַל humaanisha ‘mume’; hakuna haja ya kuingiza maana nyingine kama ‘bwana’ au ‘mwenye mali.’
theological_decisions: []
