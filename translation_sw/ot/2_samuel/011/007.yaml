base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/007.yaml
  text: When Uriah came to him[a], David asked about Joab's welfare, the welfare of the troops, and the welfare of the war.
translation:
  language: sw
  text: Uria alipomjia, Daudi akauliza hali ya Yoabu, hali ya askari, na hali ya vita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא ... אֵלָיו
  choice: alipomjia
  rationale: Muundo huu unaonyesha Uria alikuja kwa Daudi. “Alipomjia” ni wa asili katika simulizi la Kiswahili na unadumisha uhusiano wa mwendo kuelekea kwake.
- source_word: וַיִּשְׁאַל
  choice: akauliza
  rationale: Kitenzi hiki kinatambulisha maswali ya Daudi kuhusu hali ya waliokuwa vitani; “akauliza” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: לִשְׁלוֹם
  choice: hali ya
  rationale: Katika muundo huu שָׁלוֹם humaanisha hali au ustawi. “Hali ya” huweza kutumika kwa Yoabu, askari, na vita, hivyo inadumisha urudiaji wa makusudi katika Kiebrania bila kuwa nzito kupita kiasi.
- source_word: יוֹאָב
  choice: Yoabu
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Biblia katika Kiswahili.
- source_word: הָעָם
  choice: askari
  rationale: Ingawa neno hili kwa kawaida humaanisha “watu,” katika muktadha huu linarejelea kikosi kilicho vitani chini ya Yoabu. “Askari” huwasilisha rejeo hilo wazi.
- source_word: הַמִּלְחָמָה
  choice: vita
  rationale: Neno מִלְחָמָה linaweza kumaanisha vita au mapigano. “Vita” linafaa kwa kampeni nzima inayozungumziwa na pia linadumisha usemi wa Kiebrania “hali ya vita.”
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji wa “hali ya” umehifadhiwa ili kuonyesha ulinganifu wa vifungu vitatu katika chanzo, huku “askari” ikifafanua maana ya kijeshi ya הָעָם.
