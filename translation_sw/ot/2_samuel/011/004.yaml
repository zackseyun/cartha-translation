source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ דָּוִ֨ד מַלְאָכִ֜ים וַ/יִּקָּחֶ֗/הָ וַ/תָּב֤וֹא אֵלָי/ו֙ וַ/יִּשְׁכַּ֣ב עִמָּ֔/הּ וְ/הִ֥יא מִתְקַדֶּ֖שֶׁת מִ/טֻּמְאָתָ֑/הּ וַ/תָּ֖שָׁב אֶל בֵּיתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/004.yaml
  text: So David sent messengers and took her[a], and she came to him, and he lay with her. Now she was purifying herself from her uncleanness. Then she returned to her house.
translation:
  language: sw
  text: Basi Daudi akatuma wajumbe, wakamchukua[a]. Naye akaja kwake, naye Daudi akalala naye. Naye alikuwa akijitakasa[b] na unajisi wake. Kisha akarudi nyumbani kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu, “Daudi ... akamchukua.” Kiebrania humtaja Daudi kama mtenda; katika muktadha huu neno hilo laweza kumaanisha kwamba aliagiza wajumbe wamlete kwake.
    reason: source_fidelity
  - marker: b
    text: Au, “alikuwa amejitakasa na unajisi wake.” Kishazi cha Kiebrania chaweza kueleweka kama taarifa ya usuli kuhusu utakaso wa kiibada baada ya hedhi.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma
  rationale: Kitenzi cha simulizi kimetafsiriwa kwa wakati uliopita wa mfululizo, kwa namna ya kawaida katika masimulizi ya Kiswahili.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Neno hili humaanisha wajumbe; uchaguzi huu hauongezi dhana isiyotajwa kuhusu cheo au kazi yao rasmi.
- source_word: וַיִּקָּחֶהָ
  choice: wakamchukua
  rationale: Umbo la Kiebrania lina kiima cha umoja, lakini kwa Kiswahili cha kawaida kitendo kinaeleweka kutekelezwa na wajumbe aliowatuma Daudi. Tafsiri hii huhifadhi maana ya 'kumchukua' bila kuifanya kuwa 'kumleta' tu, na tanbihi inaonyesha usemi wa karibu zaidi na muundo wa Kiebrania.
- source_word: וַתָּבֹוא אֵלָיו
  choice: akaja kwake
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya kitenzi cha mwendo pamoja na kihusishi, bila kuongeza maana ya sitiari.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: akalala naye
  rationale: Huu ni usemi wa kawaida wa kibiblia wa kumaanisha uhusiano wa kingono; Kiswahili hiki ni cha heshima na kinaeleweka bila maelezo ya wazi yasiyokuwamo katika chanzo.
- source_word: וְהִיא מִתְקַדֶּשֶׁת מִטֻּמְאָתָהּ
  choice: Wakati huo alikuwa akijitakasa kutokana na unajisi wake
  rationale: Kauli ya hali ya kuendelea imehifadhiwa kama taarifa ya usuli. 'Kujitakasa' hapa ina maana ya utakaso wa kiibada, na 'unajisi' huhifadhi kategoria ya kiibada ya טֻמְאָה bila kuigeuza kuwa hukumu ya kimaadili.
- source_word: וַתָּשָׁב אֶל־בֵּיתָהּ
  choice: Kisha akarudi nyumbani kwake
  rationale: '''Kisha'' huendeleza mfuatano wa simulizi kwa kawaida; ''nyumbani kwake'' ni Kiswahili cha asili kwa kurejea makao yake.'
theological_decisions:
- issue: Kazi na wakati wa kishazi kuhusu utakaso wa kiibada
  choice: 'Kukitafsiri kama taarifa ya usuli inayoendelea: “Wakati huo alikuwa akijitakasa kutokana na unajisi wake.”'
  alternative: “Alikuwa amejitakasa kutokana na unajisi wake.”
  rationale: Kishazi cha Kiebrania chenye participle kinaweza kueleweka kama hali ya usuli, huku baadhi ya wasomaji wakikichukua kuwa tendo lililokamilika kabla ya tukio. Maandishi makuu yanahifadhi hali ya kuendelea, na tanbihi inalinda uwezekano mwingine. 'Unajisi' unaeleweka kiibada, huenda ukihusiana na hedhi, bila kutoa hukumu juu ya hatia au kutokuwa na hatia kwa Bath-sheba.
- issue: Uwajibikaji na nguvu katika usemi “akamchukua”
  choice: Kutohitimisha katika tafsiri ikiwa Bath-sheba alikubali au alilazimishwa.
  alternative: Kutumia maneno yanayosema wazi “akamteka” au “akamshawishi.”
  rationale: Kitenzi לקח ni kizito katika muktadha huu lakini hakielezi moja kwa moja namna ya ridhaa. Tafsiri inadumisha ufupi na mvutano wa simulizi bila kuingiza uamuzi ambao mstari huu hautamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Usemi “akalala naye” unahifadhi staha na nahau ya kibiblia. Alama ya tanbihi [a] imewekwa katika maandishi makuu.
