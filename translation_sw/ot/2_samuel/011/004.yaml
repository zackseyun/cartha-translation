    rationale: Kishazi cha participle cha Kiebrania kinafanya kazi ya taarifa ya usuli. Kauli “Naye alikuwa ...” huhifadhi kazi hiyo bila kupendekeza zaidi kwamba utakaso ulifanyika hasa wakati wa tukio lililotangulia.
  - severity: low
