  naturalness: Kiswahili ni cha asili kwa ujumla. “Daudi akalala naye” hutoa uwazi wa masimulizi bila kupoteza nahau ya kibiblia yenye staha. “Naye alikuwa akijitakasa na unajisi wake” ni laini na huhifadhi hali ya participle ya Kiebrania vizuri zaidi kuliko “Wakati huo alikuwa ...”.
  terminology: “Wajumbe,” “akalala naye,” na “unajisi” zinafaa kwa Kiswahili Sanifu na kwa rejesta ya kibiblia. “Kujitakasa” inaeleweka hapa kwa maana ya utakaso wa kiibada, si hukumu ya kimaadili.
