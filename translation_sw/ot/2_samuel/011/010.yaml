base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/010.yaml
  text: They told David[a], saying, “Uriah did not go down to his house.” So David said to Uriah[b], “Have you not come from a journey? Why did you not go down to your house?”
translation:
  language: sw
  text: Wakamwambia Daudi, “Uria hakushuka kwenda nyumbani kwake[a].” Basi Daudi akamwambia Uria, “Je, hukuja kutoka safarini? Kwa nini hukushuka kwenda nyumbani kwako?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, usemi huu husema kwa maana halisi “kushuka kwenda nyumbani.” Hapa unamaanisha kwenda nyumbani; huenda “kushuka” huakisi mahali palipoinuka, kama eneo la ikulu au la utawala, ikilinganishwa na makao ya Uria.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: Wakamwambia Daudi
  rationale: Kitenzi cha Kiebrania kina maana ya kumwambia au kumpasha mtu habari. Katika Kiswahili, ‘wakamwambia Daudi’ huwasilisha taarifa iliyoletwa kwake kwa mtiririko wa kawaida bila kulazimisha tafsiri ya neno kwa neno ya לֵאמֹר.
- source_word: לֹא יָרַד אוּרִיָּה אֶל בֵּיתוֹ
  choice: Uria hakushuka kwenda nyumbani kwake
  rationale: ‘Hakushuka’ huhifadhi maana halisi ya ירד na urudiaji muhimu wa simulizi; ‘kwenda nyumbani kwake’ ni Kiswahili cha kawaida kinachoeleza mwishilio wa אֶל בֵּיתוֹ.
- source_word: וַיֹּאמֶר דָּוִד אֶל אוּרִיָּה
  choice: Basi Daudi akamwuliza Uria
  rationale: Kwa kuwa maneno yanayofuata ni swali, ‘akamwuliza’ ni ya kawaida na sahihi kimuktadha kwa וַיֹּאמֶר, huku ‘Basi’ ikionyesha mwendelezo na matokeo katika simulizi.
- source_word: הֲלוֹא
  choice: Je, huku-
  rationale: Muundo wa swali lenye ukanushi unatarajia jibu la kukubali. ‘Je, huku-’ huhifadhi nguvu ya swali hilo bila kuongeza msisitizo wa kiufafanuzi.
- source_word: מִדֶּרֶךְ אַתָּה בָא
  choice: hukutoka safarini
  rationale: דֶּרֶךְ kimsingi ni njia au barabara, lakini katika usemi huu humaanisha safari. Kiswahili ‘kutoka safarini’ ni cha asili na hakiongezi wazo la ‘kurudi,’ ambalo halijasemwa wazi.
- source_word: מַדּוּעַ לֹא יָרַדְתָּ אֶל בֵּיתֶךָ
  choice: Kwa nini hukushuka kwenda nyumbani kwako?
  rationale: Tafsiri hii huhifadhi swali la sababu, kitenzi ‘kushuka,’ na urudiaji wa maneno ya awali, ambao unaendeleza mvutano wa simulizi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri imetumia ‘nyumbani’ badala ya ‘nyumba’ ili sentensi iwe ya kawaida kwa wasomaji wa leo, lakini imehifadhi ‘kushuka’ na urudiaji wake kwa sababu ni muhimu katika simulizi. Alama ya tanbihi imewekwa baada ya swali la pili ili ihusu matumizi yote mawili ya usemi huo katika aya.
