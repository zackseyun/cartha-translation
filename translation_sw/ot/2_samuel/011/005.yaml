translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kawaida lakini chenye hadhi ya masimulizi ya Biblia. Mfuatano wa vitenzi umehifadhiwa kwa mtindo wa masimulizi wa ‘aka-’; hakuna maelezo ya kimadhehebu au hitimisho la kitheolojia lililoongezwa.
