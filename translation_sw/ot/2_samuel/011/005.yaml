  text: The woman conceived[a], and she sent word and told David[b], “I am pregnant.”
translation:
  language: sw
  text: Yule mwanamke akapata mimba, akatuma ujumbe kwa Daudi akisema, “Nina mimba.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: akapata mimba
  rationale: Kitenzi הרה kinaonyesha kuanza kwa hali ya ujauzito. ‘Akapata mimba’ ni Kiswahili cha kawaida, cha sasa, na kinahifadhi maana ya tukio bila kutumia lugha ya kitabibu.
- source_word: הָאִשָּׁה
  choice: yule mwanamke
  rationale: אִשָּׁה hapa humrejelea Bathsheba kama mwanamke aliyetajwa katika muktadha. ‘Yule mwanamke’ huonyesha urejeleo huo bila kuongeza wazi maana ya ‘mke,’ ingawa neno la Kiebrania linaweza kuwa na maana hiyo kulingana na muktadha.
- source_word: וַתִּשְׁלַח וַתַּגֵּד לְדָוִד
  choice: akatuma ujumbe kwa Daudi akisema
  rationale: Kwa maneno halisi, Kiebrania kina mfuatano ‘akatuma, akamwambia Daudi.’ Katika muktadha huu, maana ni kwamba alituma taarifa kwa Daudi. ‘Akatuma ujumbe ... akisema’ ni ya asili katika Kiswahili na inahifadhi tendo la kutuma pamoja na maudhui ya taarifa.
- source_word: לְדָוִד
  choice: kwa Daudi
  rationale: ‘Daudi’ ni umbo la kawaida la jina דָוִד katika Biblia za Kiswahili; kihusishi ‘kwa’ kinaonyesha mpokeaji wa ujumbe.
- source_word: הָרָה אָנֹכִי
  choice: Nina mimba
  rationale: Kirai hiki kinaeleza hali ya sasa ya msemaji. ‘Nina mimba’ ni usemi wa moja kwa moja na wa kawaida wa Kiswahili, bila kuhamisha mkazo kwenda kwenye tukio la kutungwa kwa mimba.
