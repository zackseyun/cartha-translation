  text: ו/יראו ה/מוראים אֶל עֲבָדֶ֨/ךָ֙ מֵ/עַ֣ל הַ/חוֹמָ֔ה וַ/יָּמ֖וּתוּ מֵ/עַבְדֵ֣י הַ/מֶּ֑לֶךְ וְ/גַ֗ם עַבְדְּ/ךָ֛ אוּרִיָּ֥ה הַ/חִתִּ֖י מֵֽת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/024.yaml
  text: The archers shot at your servants from atop the wall[a], and some of the king’s servants died[b]; your servant Uriah the Hittite also died.
translation:
  language: sw
  text: Wapiga mishale waliwarushia watumishi wako mishale kutoka juu ya ukuta, na baadhi ya watumishi wa mfalme wakafa[a]; pia mtumishi wako Uria Mhiti amekufa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinaweza kutafsiriwa kwa uhalisi zaidi: “watumishi wa mfalme wakafa”; kihusishi kilichotumiwa kinaweza kumaanisha kwamba waliokufa walikuwa baadhi ya watumishi hao.'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “alikufa.” Umbo la Kiebrania linaweza kueleza hali, “amekufa,” au kuripoti tukio, “alikufa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרוּ הַמּוֹרִים
  choice: Wapiga mishale waliwarushia ... mishale
  rationale: Kirai hiki kinatokana na mzizi ירה, ‘kupiga au kurusha kwa silaha,’ pamoja na nomino ya watendaji ‘wapiga mishale.’ Kiswahili hiki ni cha kawaida katika muktadha wa vita na hakidai kwamba kila mshale uliwapata walengwa.
- source_word: אֶל עֲבָדֶיךָ
  choice: watumishi wako
  rationale: אֶל huonyesha walikoelekezwa mishale, na עֲבָדֶיךָ huhifadhi lugha ya heshima ya mjumbe kwa mfalme; hapa watumishi ni watu walio chini ya mamlaka ya mfalme, hasa wanajeshi wake.
- source_word: מֵעַל הַחוֹמָה
  choice: kutoka juu ya ukuta
  rationale: מֵעַל huonyesha kwamba mishale ilirushwa kutoka mahali pa juu, yaani juu ya ukuta wa mji.
- source_word: וַיָּמֻתוּ מֵעַבְדֵי הַמֶּלֶךְ
  choice: na baadhi ya watumishi wa mfalme wakafa
  rationale: Herufi ya uhusiano מִן kabla ya ‘watumishi wa mfalme’ inaeleweka kwa maana ya sehemu ya kundi, hivyo ‘baadhi ya’ ni tafsiri sahihi na ya kawaida.
- source_word: וְגַם
  choice: pia
  rationale: Neno hili linaongeza kifo cha Uria kama taarifa nyingine yenye uzito katika ripoti.
- source_word: עַבְדְּךָ אוּרִיָּה הַחִתִּי
  choice: mtumishi wako Uria Mhiti
  rationale: ‘Mtumishi wako’ huhifadhi lugha ya heshima ya ikulu, na ‘Mhiti’ ni jina la kawaida la Kiswahili kwa mtu wa taifa la Wahiti.
- source_word: מֵת
  choice: amekufa
  rationale: Umbo hili linaweza kueleza hali ya kuwa amekufa au tukio la kufa. ‘Amekufa’ ni la kawaida katika ripoti ya Kiswahili na huhifadhi vyema maana hiyo ya hali iliyotokana na tukio.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa simulizi wenye heshima na unaoeleweka kwa msomaji wa kawaida. Lugha ya kijeshi na ya ikulu imehifadhiwa bila kuwa nzito; urudiaji wa ‘mishale’ umechaguliwa kwa uwazi wa maana.
