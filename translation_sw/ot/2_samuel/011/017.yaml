base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/017.yaml
  text: The men of the city came out and fought against Joab[a], and some of the people among David’s servants fell[b]; Uriah the Hittite also died.
translation:
  language: sw
  text: Wanaume wa mji wakatoka, wakapigana dhidi ya Yoabu, na baadhi ya watumishi wa Daudi wakaanguka[a]; Uria Mhiti naye akafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka miongoni mwa watu, kutoka miongoni mwa watumishi wa Daudi,” usemi wa sehemu ya kundi unaomaanisha kwamba baadhi ya watumishi wa Daudi walianguka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: wakatoka
  rationale: Kitenzi יצא humaanisha kutoka; Kiswahili “wakatoka” ni cha kawaida na hakilazimishi mtazamo wa “kuja” au “kwenda” ambao Kiebrania hapa hakibainishi.
- source_word: אַנְשֵׁי הָעִיר
  choice: watu wa mji
  rationale: Kirai hiki kwa neno moja moja ni “wanaume wa mji”; katika muktadha kinawarejelea wapiganaji wa kiume. “Watu wa mji” ni lugha ya kawaida ya masimulizi bila kubadili kundi linalorejelewa.
- source_word: וַיִּלָּחֲמוּ אֶת יוֹאָב
  choice: wakapigana dhidi ya Yoabu
  rationale: “Dhidi ya” huonyesha wazi kuwa walikuwa maadui wa Yoabu, badala ya “na Yoabu,” ambako kwa Kiswahili kunaweza kueleweka kuwa walipigana pamoja naye.
- source_word: וַיִּפֹּל
  choice: wakaanguka
  rationale: “Kuanguka” huhifadhi nahau ya kijeshi ya Kiebrania kwa watu kuuawa vitani, bila kuibadili moja kwa moja kuwa “wakafa.”
- source_word: מִן הָעָם מֵעַבְדֵי דָוִד
  choice: baadhi ya watumishi wa Daudi
  rationale: 'Vihusishi vya מן vina maana ya sehemu ya kundi: baadhi ya watu waliokuwa watumishi wa Daudi. Tafsiri hii ni ya asili katika Kiswahili, huku tanbihi ikihifadhi muundo wa karibu zaidi wa Kiebrania.'
- source_word: וַיָּמָת גַּם אוּרִיָּה הַחִתִּי
  choice: Uria Mhiti naye akafa
  rationale: '“Naye” huwasilisha maana ya nyongeza ya גַּם: Uria alikuwa pia miongoni mwa waliokufa.'
- source_word: הַחִתִּי
  choice: Mhiti
  rationale: Hili ndilo jina la kawaida la Kiswahili la mtu wa taifa la Wahiti.
