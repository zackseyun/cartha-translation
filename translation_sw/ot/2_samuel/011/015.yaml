  text: וַ/יִּכְתֹּ֥ב בַּ/סֵּ֖פֶר לֵ/אמֹ֑ר הָב֣וּ אֶת אֽוּרִיָּ֗ה אֶל מוּל֙ פְּנֵ֤י הַ/מִּלְחָמָה֙ הַֽ/חֲזָקָ֔ה וְ/שַׁבְתֶּ֥ם מֵ/אַחֲרָ֖י/ו וְ/נִכָּ֥ה וָ/מֵֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/015.yaml
  text: He wrote in the letter[a], saying, "Set Uriah at the front of the hardest fighting, then withdraw from behind him so that he may be struck down and die."
translation:
  language: sw
  text: Akaandika katika barua akisema, “Mwekeni Uria katika mstari wa mbele wa mapigano makali zaidi,[a] kisha mjiondoe kutoka nyuma yake, ili apigwe na kufa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali ambapo mapigano ni makali zaidi.”
    reason: Kauli ya Kiebrania inaweza kutafsiriwa kwa kuzingatia zaidi mahali ambapo pambano ni kali kuliko nafasi ya mstari wa mbele.
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Akaandika
  rationale: Umbo la wayyiqtol linaendeleza simulizi kwa tendo lililofuata; kiambishi ‘A-’ pamoja na ‘-ka-’ huwasilisha kwa kawaida mfuatano huo katika Kiswahili.
- source_word: בַּסֵּפֶר
  choice: katika barua
  rationale: Katika muktadha huu סֵפֶר ni ujumbe ulioandikwa ambao Daudi alimtuma Uria aupeleke, hivyo ‘barua’ ni ya asili na sahihi kuliko ‘kitabu’ au ‘hati’.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hiki ni kitenzi cha kunukuu kinachoanzisha yaliyomo katika barua.
- source_word: הָבוּ אֶת אוּרִיָּה
  choice: Mwekeni Uria
  rationale: Amri ya wingi inaelekeza wale wanaotekeleza mpango wamweke Uria mahali maalumu vitani.
- source_word: אֶל מוּל פְּנֵי הַמִּלְחָמָה הַחֲזָקָה
  choice: katika mstari wa mbele wa mapigano makali zaidi
  rationale: Kauli hii ni ya kimsemo na inaonyesha kuwekwa mbele, mahali pa hatari kubwa katika pambano kali; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha picha ya kijeshi.
- source_word: וְשַׁבְתֶּם מֵאַחֲרָיו
  choice: kisha mjiondoe kutoka nyuma yake
  rationale: שׁוּב hapa ina maana ya kurudi nyuma au kujiondoa, huku מֵאַחֲרָיו ikitaja wazi nafasi ya waliokuwa nyuma ya Uria na kuonyesha kuachwa kwake kimakusudi.
- source_word: וְנִכָּה וָמֵת
  choice: ili apigwe na kufa
  rationale: ‘Apigwe’ huhifadhi hali ya kutendwa ya נכה, na ‘na kufa’ huhifadhi kitenzi tofauti cha mwisho bila kuunganisha mawazo yote kuwa ‘auawe’.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. ‘Mstari wa mbele’ ni istilahi ya kijeshi iliyozoeleka; muundo wa amri ya wingi umehifadhiwa.
