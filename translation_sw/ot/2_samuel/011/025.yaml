base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/025.yaml
  text: Then David said to the messenger[a], “Thus you shall say to Joab, ‘Do not let this matter be evil in your eyes, for the sword devours one as well as another[c][b]. Strengthen your attack against the city and overthrow it.’ And encourage him.”
translation:
  language: sw
  text: 'Ndipo Daudi akamwambia mjumbe, “Mwambie Yoabu hivi: ‘Usione jambo hili kuwa baya[a], kwa maana upanga humla huyu na yule[b]. Imarisha mashambulizi yako dhidi ya mji, na uubomoe.’ Nawe umtie moyo[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jambo hili lisikuchukize.” Kiebrania kinasema kihalisi, “Jambo hili lisiwe baya machoni pako.”
    reason: lexical_alternative
  - marker: b
    text: Nahau ya Kiebrania ni “kwa maana hivi na hivi upanga hula,” ikimaanisha kwamba upanga humwangamiza mtu huyu na mtu yule.
    reason: lexical_alternative
  - marker: c
    text: Au, “Nawe umtie nguvu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: mjumbe
  rationale: Katika muktadha huu neno hilo linamaanisha mtu aliyeleta habari, si kiumbe wa mbinguni. ‘Mjumbe’ ni neno la kawaida na sahihi katika Kiswahili.
- source_word: כֹּה תֹאמַר
  choice: Mwambie ... hivi
  rationale: Hii ni kauli ya kawaida ya kuanzisha ujumbe unaopaswa kufikishwa; tafsiri hii ni ya asili katika Kiswahili na inadumisha maana ya agizo.
- source_word: אַל יֵרַע בְּעֵינֶיךָ
  choice: Usione ... kuwa baya
  rationale: Uundaji huu unahifadhi wazo la Kiebrania la kuliona jambo kuwa baya bila kutumia nahau nzito isiyo ya kawaida katika Kiswahili. Maana mbadala ya ‘lisikuchukize’ imetajwa katika tanbihi.
- source_word: הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: Neno linarejelea tukio lililoripotiwa, hasa kifo cha Uria, bila kulifafanua kupita kiasi.
- source_word: כִּי כָזֹה וְכָזֶה
  choice: kwa maana ... huyu na yule
  rationale: Nahau hii inaonyesha kwamba matokeo ya upanga hayachagui mtu mmoja tu; ‘huyu na yule’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: תֹּאכַל הֶחָרֶב
  choice: upanga humla
  rationale: Kitenzi cha Kiebrania ni ‘kula’; tafsiri hii inadumisha taswira kali ya upanga unaomeza uhai badala ya kuibadilisha kuwa ‘huua’ tu.
- source_word: הַחֲזֵק מִלְחַמְתְּךָ
  choice: Imarisha mashambulizi yako
  rationale: Katika muktadha wa kuuzingira mji, maneno haya yanamaanisha kuongeza nguvu ya mapambano dhidi ya mji. ‘Mashambulizi’ yanaeleweka kwa urahisi kuliko tafsiri sisisi ya ‘vita vyako’.
- source_word: וְהָרְסָהּ
  choice: na uubomoe
  rationale: Kitenzi kinamaanisha kubomoa au kuangusha. Kwa mji unaozingirwa, ‘uubomoe’ hudumisha maana halisi ya uharibifu.
- source_word: וְחַזְּקֵהוּ
  choice: Nawe umtie moyo
  rationale: Kiambishi cha umoja wa kiume kinaelekea kumrejelea Yoabu. Katika uhusiano wa watu, ‘umtie moyo’ huwasilisha kwa kawaida agizo la kumtia nguvu.
