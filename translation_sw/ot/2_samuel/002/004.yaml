base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/004.yaml
  text: Then the men of Judah came[a], and there they anointed David king over the house of Judah. And they told David, saying, "The men of Jabesh-gilead were the ones who buried Saul."
translation:
  language: sw
  text: Ndipo wanaume wa Yuda wakaja, nao wakamtia Daudi mafuta huko awe mfalme juu ya nyumba ya Yuda. Kisha wakamwambia Daudi, “Wanaume wa Yabesh-gileadi waliomzika Sauli.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: wakaja
  rationale: Kitenzi בוא kinaeleza kuja au kufika; “wakaja” ni simulizi la kawaida na la moja kwa moja katika muktadha huu.
- source_word: אַנְשֵׁי יְהוּדָה
  choice: wanaume wa Yuda
  rationale: אַנְשֵׁי hapa ni wingi unaowataja wanaume, yaelekea wawakilishi au viongozi wa Yuda; “wanaume” huhifadhi maana hiyo bila kuigeuza kuwa jamii yote kwa ujumla.
- source_word: וַיִּמְשְׁחוּ
  choice: wakamtia Daudi mafuta
  rationale: משׁח katika muktadha wa kifalme ni kumtia mtu mafuta ili kumweka rasmi kuwa mfalme; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha Biblia.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki hurejelea mahali palipotajwa katika muktadha uliotangulia; “huko” ni cha asili katika simulizi la Kiswahili.
- source_word: לְמֶלֶךְ
  choice: awe mfalme
  rationale: Kirai hiki kinaonyesha lengo na cheo ambacho Daudi aliwekewa kwa kutiwa mafuta; “awe mfalme” ni Kiswahili cha kawaida.
- source_word: עַל בֵּית יְהוּדָה
  choice: juu ya nyumba ya Yuda
  rationale: “Nyumba” huhifadhi taswira ya בֵּית kama ukoo au jumuiya ya kikabila, badala ya kuirahisisha kuwa eneo la Yuda pekee.
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: Kisha wakamwambia Daudi
  rationale: נגד katika Hifili ni kutoa taarifa au kumwambia mtu. Kiswahili hakihitaji kurudia “wakisema” kabla ya nukuu ili kuwasilisha kwa kawaida muundo wa Kiebrania.
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: Wanaume wa Yabesh-gileadi
  rationale: “Wanaume” huhifadhi rejeo la kiume la אַנְשֵׁי, na “Yabesh-gileadi” ni umbo la jina la mahali linalofaa katika Kiswahili cha Biblia.
- source_word: אֲשֶׁר קָבְרוּ אֶת שָׁאוּל
  choice: ndio waliomzika Sauli
  rationale: “Ndio” huleta wazi nguvu ya utambulisho katika taarifa, huku tanbihi ikihifadhi uwezekano wa kuitafsiri kama kishazi sahili cha uhusiano.
theological_decisions:
- issue: Lugha ya kijinsia katika אַנְשֵׁי
  choice: wanaume katika sehemu zote mbili
  alternative: watu
  rationale: Nomino ya Kiebrania inawataja wanaume, na muktadha unaelekea kwa wawakilishi au viongozi wa kiume. Tafsiri haipanui kimya kimya rejeo hilo kuwa watu wote.
- issue: Taswira ya “nyumba” katika בֵּית יְהוּדָה
  choice: nyumba ya Yuda
  alternative: Yuda au kabila la Yuda
  rationale: Kudumisha “nyumba” huhifadhi maana ya jumuiya ya ukoo au kabila bila kuifanya iwe neno la kisiasa au la kieneo pekee.
- issue: Nguvu ya utambulisho katika אֲשֶׁר קָבְרוּ
  choice: ndio waliomzika Sauli
  alternative: waliomzika Sauli / walimzika Sauli
  rationale: Kishazi kinaweza kueleweka kuwa kinawatambulisha waliofanya tendo hilo, lakini Kiebrania pia kinaweza kutafsiriwa kwa kishazi sahili cha uhusiano. Tofauti hiyo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa sasa. Muundo umefanywa wa asili kwa Kiswahili bila kupoteza istilahi za kifalme, kijinsia, na kikabila za chanzo.
