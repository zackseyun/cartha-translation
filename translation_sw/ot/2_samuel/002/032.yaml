base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/032.yaml
  text: They carried Asahel and buried him in his father's tomb[a], which was at Bethlehem. Then Joab and his men traveled all night[b], and daybreak came upon them at Hebron.
translation:
  language: sw
  text: Wakamchukua Asaheli, wakamzika katika kaburi la baba yake[a], lililokuwa Bethlehemu. Kisha Yoabu na watu wake wakasafiri usiku kucha, na mapambazuko yakawapata Hebroni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika mahali pa kuzikia pa baba yake.” Neno la Kiebrania קֶבֶר linaweza kumaanisha kaburi au mahali pa kuzikia pa familia.
    reason: lexical_alternative
  - marker: b
    text: Kwa halisi, “ikawa nuru kwao huko Hebroni.” Hii ni nahau inayomaanisha kwamba kulipambazuka walipokuwa Hebroni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: Wakamchukua
  rationale: Katika muktadha wa mazishi, kitenzi נשא kinaeleza kuuchukua na kuubeba mwili wa Asaheli; “wakamchukua” ni Kiswahili cha kawaida kinachojumuisha tendo hilo bila kuwa kizito.
- source_word: עֲשָׂהאֵל
  choice: Asaheli
  rationale: Jina limetoholewa kwa namna inayotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: וַיִּקְבְּרֻהוּ
  choice: wakamzika
  rationale: קבר ni kitenzi cha kawaida cha kumzika mtu; “wakamzika” ni tafsiri ya moja kwa moja na ya asili.
- source_word: בְּקֶבֶר אָבִיו
  choice: katika kaburi la baba yake
  rationale: קֶבֶר inaweza kumaanisha kaburi au mahali pa kuzikia pa familia. “Kaburi” ni neno la kawaida la Kiswahili na linaweza kubeba maana zote mbili kulingana na muktadha.
- source_word: אֲשֶׁר בֵּית לָחֶם
  choice: lililokuwa Bethlehemu
  rationale: Kirai husika kinaeleza mahali kaburi lilipokuwa; Kiswahili huhitaji kitenzi kilicho wazi ili sentensi isomeke kwa kawaida.
- source_word: וַיֵּלְכוּ כָל הַלַּיְלָה
  choice: wakasafiri usiku kucha
  rationale: הלך ni neno pana la kwenda au kutembea. “Wakasafiri usiku kucha” linaonyesha mwendo wa muda wote wa usiku bila kudai kwamba lilikuwa gwaride rasmi la kijeshi.
- source_word: יוֹאָב וַאֲנָשָׁיו
  choice: Yoabu na watu wake
  rationale: Huhifadhi maana halisi ya “watu wake” huku muktadha ukionyesha kuwa walikuwa kikosi chake.
- source_word: וַיֵּאֹר לָהֶם
  choice: kulipopambazuka walikuwa wamefika
  rationale: Nahau ya Kiebrania kwa halisi ni “ikawa nuru kwao.” Muundo huu wa Kiswahili unaeleza mapambazuko na unaunganisha Hebroni kama mahali walipokuwa wakati huo, bila kudai kwa lazima kwamba walifika kabla ya alfajiri.
- source_word: בְּחֶבְרוֹן
  choice: Hebroni
  rationale: Jina la mahali limetoholewa kwa matumizi ya kawaida ya Kiswahili; katika muundo “walikuwa wamefika Hebroni,” kihusishi hakihitajiki.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa sasa na wenye heshima. Majina yametolewa kama Asaheli, Yoabu, Bethlehemu, na Hebroni. Viashiria [a] na [b] vimewekwa katika matini kuu na vinaeleza utata halisi wa קֶבֶר na nahau וַיֵּאֹר לָהֶם.
