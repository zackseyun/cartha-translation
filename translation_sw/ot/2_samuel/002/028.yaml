  text: וַ/יִּתְקַ֤ע יוֹאָב֙ בַּ/שּׁוֹפָ֔ר וַ/יַּֽעַמְדוּ֙ כָּל הָ/עָ֔ם וְ/לֹֽא יִרְדְּפ֥וּ ע֖וֹד אַחֲרֵ֣י יִשְׂרָאֵ֑ל וְ/לֹֽא יָסְפ֥וּ ע֖וֹד לְ/הִלָּחֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/028.yaml
  text: Then Joab blew the trumpet[a], and all the people stood still, and they no longer pursued Israel or continued to fight.
translation:
  language: sw
  text: Ndipo Yoabu akapiga tarumbeta[a], na watu wote wakasimama tuli. Hawakuwafuatilia Israeli tena, wala hawakuendelea kupigana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pembe”; neno la Kiebrania שׁוֹפָר linamaanisha pembe iliyotumiwa kama ala ya kutoa ishara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: akapiga
  rationale: Pamoja na שׁוֹפָר, kitenzi תקע humaanisha kupiga au kupuliza ala ili kutoa ishara. Katika Kiswahili cha kawaida, ‘kupiga tarumbeta’ ni usemi wa asili na unaoeleweka.
- source_word: בַּשּׁוֹפָר
  choice: tarumbeta
  rationale: שׁוֹפָר ni pembe iliyotumiwa kama ala ya kutoa ishara. ‘Tarumbeta’ ni tafsiri iliyo wazi na ya kawaida; tanbihi inahifadhi maana halisi ya ‘pembe’ bila kudai kwamba lazima ilikuwa pembe ya kondoo-dume.
- source_word: וַיַּעַמְדוּ כָּל הָעָם
  choice: watu wote wakasimama tuli
  rationale: עמד kimsingi ni ‘kusimama,’ lakini hapa katika mazingira ya kijeshi inaonyesha kusitisha mwendo na tendo. ‘Wakasimama tuli’ huhifadhi taswira hiyo na kuonyesha kwamba walikoma.
- source_word: הָעָם
  choice: watu
  rationale: Kiebrania kinasema ‘watu.’ Ingawa katika muktadha hawa ni wapiganaji wa Yoabu, neno pana limehifadhiwa bila kulifanya kuwa ‘wanajeshi.’
- source_word: יִרְדְּפוּ עוֹד אַחֲרֵי יִשְׂרָאֵל
  choice: hawakuwafuatilia Israeli tena
  rationale: רדף אחרי ni kufuatilia au kuwinda kwa kuwafuata, na עוֹד pamoja na ukanushi ni ‘tena’ au ‘zaidi.’ Kiambishi cha watendewa ‘-wa-’ kinaonyesha kwa kawaida kwamba ‘Israeli’ hapa ni watu, yaani kikosi cha Israeli.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa limehifadhiwa kama lilivyo katika Kiebrania, ingawa hapa linawarejelea watu au kikosi cha Israeli chini ya Abneri.
- source_word: וְלֹא יָסְפוּ עוֹד לְהִלָּחֵם
  choice: wala hawakuendelea kupigana
  rationale: יסף pamoja na kitenzi-jina humaanisha kuongeza au kuendelea kufanya jambo. Ukanushi na עוֹד unaonyesha kwamba hawakuendelea au hawakurudia kupigana; ‘hawakuendelea kupigana’ ni ya asili na yenye uaminifu.
theological_decisions: []
