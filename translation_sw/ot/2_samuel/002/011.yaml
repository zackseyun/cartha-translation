  text: The length of time that David was king in Hebron over the house of Judah was seven years and six months[a].
translation:
  language: sw
  text: Muda ambao Daudi alikuwa mfalme wa nyumba ya Yuda huko Hebroni ulikuwa miaka saba na miezi sita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “idadi ya siku.” Nahau ya Kiebrania inamaanisha muda wa utawala wa Daudi huko Hebroni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ulikuwa
  rationale: Kitenzi hiki kinaanzisha kauli ya muhtasari; katika Kiswahili, ‘ulikuwa’ kinaunganika kwa kawaida na ‘muda’ bila kutumia tafsiri ngumu ya neno kwa neno kama ‘ikawa.’
- source_word: מִסְפַּר הַיָּמִים
  choice: Muda
  rationale: Ingawa kihalisi ni ‘idadi ya siku,’ hapa nahau hiyo inamaanisha urefu wa kipindi cha utawala.
- source_word: אֲשֶׁר הָיָה דָוִד מֶלֶךְ
  choice: ambao Daudi alikuwa mfalme
  rationale: Muundo huu unaonyesha kipindi ambacho Daudi alitawala, huku ukibaki wazi na wa kawaida katika Kiswahili.
- source_word: בְּחֶבְרוֹן
  choice: huko Hebroni
  rationale: Kiambishi בְּ kinaonyesha mahali; ‘huko Hebroni’ ni usemi wa kawaida wa Kiswahili kwa utawala uliokuwa katika mji huo.
- source_word: עַל בֵּית יְהוּדָה
  choice: juu ya nyumba ya Yuda
  rationale: ‘Juu ya’ huonyesha mamlaka ya kifalme, na ‘nyumba ya Yuda’ huhifadhi usemi wa Kiebrania wenye maana ya jumuiya au kabila la Yuda.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: miaka saba na miezi sita
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muda uliotajwa.
