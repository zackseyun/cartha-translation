  text: Ndipo Abneri akamwambia Yoabu, “Hebu vijana wasimame na washindane mbele yetu.” Naye Yoabu akasema, “Wasimame.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּעָרִים
  choice: hao vijana
  rationale: Neno hili humaanisha vijana, na hapa linawarejelea wapiganaji vijana wanaotambuliwa katika muktadha.
- source_word: וִישַׂחֲקוּ
  choice: washindane
  rationale: Ingawa kitenzi kinaweza kumaanisha kucheza au kufanya mchezo, hapa kinataja pambano la ushindani mbele ya viongozi; ‘washindane’ huhifadhi uzito wa muktadha bila kulieleza mapema kuwa mauaji.
- source_word: יָקוּמוּ נָא
  choice: Tafadhali, ... na wasimame
  rationale: ‘Tafadhali’ huwakilisha chembe ya ombi נָא, huku ‘na wasimame’ ikidumisha namna ya agizo lenye ombi.
- source_word: לְפָנֵינוּ
  choice: mbele yetu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishazi hiki.
