  text: Joab said[a], “As God lives, if you had not spoken, then from the morning the people would have gone up[b], each from following his brother.”
translation:
  language: sw
  text: Yoabu akasema, “Kama aishivyo Mungu, kama hungezungumza, basi tangu asubuhi[a] watu wangeondoka[b], kila mmoja akiacha kumfuata ndugu yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tokea asubuhi.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana ya msingi, “wangepanda.” Katika muktadha huu wa kijeshi, huenda ikamaanisha kuondoka au kusitisha kuwafuatia wengine.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי הָאֱלֹהִים
  choice: Kama aishivyo Mungu
  rationale: Hii ni kauli ya kiapo. Tafsiri hii inadumisha nahau ya Kiebrania na ni ya asili katika Kiswahili cha Biblia.
- source_word: לוּלֵא דִּבַּרְתָּ
  choice: kama usingesema
  rationale: לוּלֵא pamoja na kitenzi kilichotangulia huonyesha sharti lisilotimia; kitenzi ‘kusema’ kinaachwa bila kutaja jambo lililosemwa, kama ilivyo katika Kiebrania.
- source_word: כִּי אָז
  choice: basi
  rationale: Chembe hizi zinaanzisha matokeo ya sharti; ‘basi’ huwasilisha uhusiano huo kwa Kiswahili cha kawaida bila kuzitafsiri kupita kiasi.
- source_word: מֵהַבֹּקֶר
  choice: tangu asubuhi
  rationale: Kihusishi מִן pamoja na ‘asubuhi’ kinaonyesha mwanzo wa wakati. ‘Tangu asubuhi’ ni cha asili na kinadumisha maana hiyo.
- source_word: נַעֲלָה
  choice: wangeondoka
  rationale: Maana ya msingi inahusiana na kwenda juu, lakini katika muktadha huu wa kijeshi inaelekea kumaanisha kuondoka au kusitisha kuwafuatia wengine. ‘Wangeondoka’ ni wazi huku tanbihi ikihifadhi picha halisi ya Kiebrania.
- source_word: אִישׁ מֵאַחֲרֵי אָחִיו
  choice: kila mmoja akome kumfuata ndugu yake
  rationale: Kwa karibu ni ‘kila mtu kutoka nyuma ya ndugu yake.’ Katika muktadha, inaeleza kila mmoja kuacha kumfuata au kumfukuza Mwisraeli mwenzake.
