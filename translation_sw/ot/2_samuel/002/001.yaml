base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/001.yaml
  text: After this[a], David inquired of Yahweh, saying, “Shall I go up into one of the cities of Judah?” And Yahweh said to him, “Go up.” Then David said, “Where shall I go up?” And he said, “To Hebron.”
translation:
  language: sw
  text: Baada ya hayo, Daudi akamwuliza Yahwe, akisema, “Je, nipande kwenda katika mojawapo ya miji ya Yuda?” Yahwe akamwambia, “Panda.” Kisha Daudi akauliza, “Nipande kwenda wapi?” Yahwe akasema, “Hebroni.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Huwasilisha kwa Kiswahili cha kawaida mpito wa wakati unaomaanisha ‘baada ya jambo hilo/hayo,’ bila kubeba uzito usio wa lazima wa fomula ya masimulizi ya Kiebrania.
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: akamwuliza Yahwe
  rationale: Kitenzi hiki pamoja na jina la Mungu humaanisha kumwendea Mungu ili kupata jibu au mwongozo. ‘Akamwuliza’ ni wazi na cha kawaida, huku muktadha ukionyesha kuwa Daudi alitafuta mwongozo wa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano YHWH limetoholewa moja kwa moja kama ‘Yahwe,’ badala ya kubadilishwa na cheo ‘BWANA.’
- source_word: הַאֶעֱלֶה / עֲלֵה
  choice: nipande / Panda
  rationale: ‘Kupanda’ huhifadhi maana ya mwendo kuelekea maeneo ya juu na pia marudio ya kitenzi kilekile katika swali la Daudi na jibu la Yahwe.
- source_word: בְּאַחַת עָרֵי יְהוּדָה
  choice: katika mojawapo ya miji ya Yuda
  rationale: Huhifadhi kwa uwazi wazo la kuchagua mji mmoja miongoni mwa miji ya Yuda.
- source_word: אָנָה אֶעֱלֶה
  choice: Nipande kwenda wapi?
  rationale: Ni swali la kawaida la Kiswahili kuhusu mahali pa kuelekea, huku likihifadhi kitenzi ‘kupanda.’
- source_word: חֶבְרֹנָה
  choice: Hebroni
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaeleweka kutokana na swali ‘kwenda wapi?’; umbo la kawaida la jina hili kwa Kiswahili ni ‘Hebroni.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina YHWH. ‘Yahwe’ huhifadhi jina hilo la pekee bila kulibadilisha na cheo, huku tanbihi ikitaja desturi nyingine ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya masimulizi ni ya sasa, wazi na yenye heshima. Marudio ya ‘kupanda’ yamehifadhiwa kwa sababu ni muhimu katika mazungumzo na yanaakisi neno lilelile la Kiebrania.
