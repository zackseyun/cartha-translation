base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/023.yaml
  text: But he refused to turn aside[a], so Abner struck him in the belly with the butt end of the spear, and the spear came out behind him; and he fell there and died on the spot. And everyone who came to the place where Asahel had fallen and died stood still.
translation:
  language: sw
  text: Lakini Asaheli alikataa kugeuka kando. Basi Abneri akampiga tumboni[a] kwa sehemu ya nyuma ya mkuki, nao mkuki ukatokea mgongoni mwake. Asaheli akaanguka pale na kufa papo hapo. Kila mtu aliyefika mahali Asaheli alipoanguka na kufa alisimama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania חֹמֶשׁ limetafsiriwa kimapokeo kuwa “ubavu wa tano” katika baadhi ya tafsiri za zamani; katika muktadha huu huenda linamaanisha kwa ujumla sehemu ya tumbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן לָסוּר
  choice: alikataa kugeuka kando
  rationale: Huhifadhi maana ya kukataa na mwendo halisi wa kugeuka pembeni, huku muktadha ukionyesha kuwa Asaheli hakutaka kuacha kumfuatia Abneri.
- source_word: וַיַּכֵּהוּ
  choice: akampiga
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida na yenye hadhi ya kitenzi נכה katika simulizi hili.
- source_word: בְּאַחֲרֵי הַחֲנִית
  choice: kwa ncha ya nyuma ya mkuki
  rationale: Kirai kinataja sehemu ya nyuma ya mkuki, si ncha yake kali. Usemi huu ni wazi kwa msomaji wa Kiswahili bila kuingiza istilahi isiyo ya kawaida.
- source_word: אֶל הַחֹמֶשׁ
  choice: tumboni
  rationale: חֹמֶשׁ ni neno tata la sehemu ya mwili katika masimulizi ya vita. 'Tumboni' linaeleza eneo la jumla linalowezekana bila kufuata kimyakimya mapokeo mahususi ya 'ubavu wa tano'.
- source_word: וַתֵּצֵא הַחֲנִית מֵאַחֲרָיו
  choice: mkuki ukatokea mgongoni mwake
  rationale: Hueleza kwa Kiswahili cha kawaida kwamba mkuki ulipenya mwilini na kutoka upande wa nyuma.
- source_word: וַיָּמָת תַּחְתָּו
  choice: akafa papo hapo
  rationale: תחתיו hapa ni usemi unaoonyesha kwamba alikufa mara moja pale alipoanguka; 'papo hapo' huwasilisha maana hiyo kwa Kiswahili asilia.
- source_word: וַיַּעֲמֹדוּ
  choice: alisimama
  rationale: Kitenzi kinaonyesha kwamba kila aliyefika alikoma kwenda na kusimama mahali hapo. Umoja unapatana na kiima cha Kiswahili 'kila mtu'.
