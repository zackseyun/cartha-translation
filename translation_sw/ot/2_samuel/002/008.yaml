  text: וְ/אַבְנֵ֣ר בֶּן נֵ֔ר שַׂר צָבָ֖א אֲשֶׁ֣ר לְ/שָׁא֑וּל לָקַ֗ח אֶת אִ֥ישׁ בֹּ֨שֶׁת֙ בֶּן שָׁא֔וּל וַ/יַּעֲבִרֵ֖/הוּ מַחֲנָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/008.yaml
  text: But Abner son of Ner[a], the commander of Saul’s army, took Ish-bosheth son of Saul and brought him over to Mahanaim.
translation:
  language: sw
  text: Lakini Abneri mwana wa Neri, mkuu wa jeshi la Sauli, akamchukua Ish-boshethi[a] mwana wa Sauli, akamvusha hadi Mahanaimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ish-boshethi anaitwa Eshbaali katika 1 Mambo ya Nyakati 8:33 na 9:39.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַבְנֵר
  choice: Lakini Abneri
  rationale: Kiunganishi וְ kinaweza kumaanisha “na,” lakini hapa “lakini” kinaonyesha vizuri utofauti wa kisimulizi na mstari uliotangulia, ambamo watu wa Yuda walimtia Daudi mafuta kuwa mfalme.
- source_word: בֶּן נֵר
  choice: mwana wa Neri
  rationale: Muundo wa kawaida wa Kiebrania unaoonyesha uhusiano wa mwana na baba; majina yametoholewa kwa namna ya kawaida katika Kiswahili.
- source_word: שַׂר צָבָא אֲשֶׁר לְ/שָׁאוּל
  choice: mkuu wa jeshi la Sauli
  rationale: שַׂר צָבָא humaanisha mkuu au kamanda wa jeshi. Kauli hii ni ya asili katika Kiswahili na inadumisha uhusiano wa jeshi hilo na Sauli.
- source_word: לָקַח
  choice: akamchukua
  rationale: Kitenzi hiki kwa kawaida humaanisha “kuchukua.” Muktadha wa karibu haulazimishi maana kali zaidi kama “kumkamata kwa nguvu.”
- source_word: אֶת אִישׁ בֹּשֶׁת
  choice: Ish-boshethi
  rationale: Maandishi ya Kiebrania hapa yana jina Ish-boshethi; limetoholewa badala ya kutafsiriwa. Jina lingine la mtu huyu limehifadhiwa katika tanbihi.
- source_word: וַ/יַּעֲבִרֵ/הוּ
  choice: akamvusha
  rationale: Hii ni Hifili ya עבר, yenye maana ya kumsababisha mtu avuke au kumvusha. Tafsiri hii inadumisha maana ya kisababishi bila kudai njia mahsusi aliyopita.
- source_word: מַחֲנָיִם
  choice: Mahanaimu
  rationale: Ni jina la mahali, kwa hiyo limetoholewa kwa muundo unaosomeka kwa kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumia vitenzi vinavyofuatana “akamchukua … akamvusha,” huku istilahi ya kijeshi “mkuu wa jeshi” ikibaki wazi kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya jina Ish-boshethi, ambalo tanbihi inalifafanua.
