translation:
  language: sw
  text: Daudi akawapandisha wanaume waliokuwa pamoja naye, kila mwanaume na watu wa nyumbani mwake; nao wakakaa katika miji ya Hebroni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda “miji ya Hebroni” ikamaanisha makazi yaliyokuwa katika eneo la Hebroni, wala si kitovu cha mji wa Hebroni pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנָשָׁיו
  choice: watu wake
  rationale: Nomino yenye kiambishi cha umilikaji humaanisha watu wa Daudi, yaani kundi lake. Katika Kiswahili, “watu wake” ni ya kawaida na inaepuka urudiaji mzito pamoja na kishazi kinachofuata.
- source_word: אֲשֶׁר עִמּוֹ
  choice: waliokuwa pamoja naye
  rationale: Kishazi hiki kinawatambulisha kuwa watu walioandamana na Daudi.
- source_word: הֶעֱלָה
  choice: akawapandisha
  rationale: Hifili ya עלה ina wazo la kuwapeleka juu; “akawapandisha” linahifadhi mwelekeo wa kwenda Hebroni katika nchi ya vilima.
- source_word: אִישׁ וּבֵיתוֹ
  choice: kila mmoja pamoja na watu wa nyumba yake
  rationale: “Kila mmoja” linaonyesha mgawanyo wa אִישׁ, na “watu wa nyumba yake” linaeleza kaya badala ya jengo tu.
- source_word: וַיֵּשְׁבוּ
  choice: nao wakakaa
  rationale: Katika muktadha wa kuhama, ישב lina maana ya kuanza kuishi au kufanya makao. “Wakakaa” ni la kawaida na linaweza kubeba maana hiyo bila kuongeza maelezo yasiyosemwa wazi.
- source_word: בְּעָרֵי חֶבְרוֹן
  choice: katika miji ya Hebroni
  rationale: “Miji” ni tafsiri ya kawaida ya עָרִים na inaweza kurejelea mji pamoja na makazi yanayohusiana na eneo lake. Tanbihi inaweka wazi uwezekano huo wa kijiografia.
- source_word: חֶבְרוֹן
  choice: Hebroni
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili.
