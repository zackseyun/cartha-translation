base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/018.yaml
  text: 'The three sons of Zeruiah were there: Joab[a], Abishai, and Asahel. And Asahel was swift on his feet like one of the gazelles that are in the field.'
translation:
  language: sw
  text: 'Wana watatu wa Seruya walikuwapo: Yoabu, Abishai na Asaheli. Asaheli alikuwa mwepesi wa miguu kama mmoja wa swala[a] walio shambani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama mmoja wa kulungu walio shambani.” Neno la Kiebrania צְבִי linaweza kumaanisha kwa upana zaidi mnyama wa porini wa jamii ya kulungu, ingawa hapa “swala” ndilo chaguo mahususi zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ שָׁם
  choice: walikuwapo
  rationale: Kitenzi hiki kinaonyesha kuwapo kwao mahali hapo katika simulizi; “walikuwapo” ni Kiswahili cha kawaida na hakiongezi kiashiria cha wakati kisichotajwa wazi.
- source_word: שְׁלֹשָׁה בְּנֵי צְרוּיָה
  choice: wana watatu wa Seruya
  rationale: Hutambulisha kundi maalumu la wana watatu wa Seruya kwa mpangilio wa asili wa Kiswahili.
- source_word: יוֹאָב וַאֲבִישַׁי וַעֲשָׂהאֵל
  choice: Yoabu, Abishai na Asaheli
  rationale: Majina yameandikwa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: קַל בְּרַגְלָיו
  choice: mwepesi wa miguu
  rationale: Katika muktadha huu קַל hueleza kasi ya kukimbia, si uzito; msemo wa Kiswahili “mwepesi wa miguu” huhifadhi picha ya mwili na maana ya wepesi.
- source_word: כְּאַחַד הַצְּבָיִם
  choice: kama mmoja wa swala
  rationale: צְבִי kwa kawaida humaanisha swala, mnyama anayejulikana kwa kasi. Muundo “mmoja wa” unahifadhi kwa karibu ulinganisho wa Kiebrania.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: wa porini
  rationale: Katika muktadha wa wanyama wa mwitu, “porini” huwasilisha kwa kawaida eneo la wazi lisilokaliwa linalokusudiwa na הַשָּׂדֶה, bila kuashiria shamba lililolimwa.
