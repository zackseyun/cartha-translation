translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa taarifa ya kifalme umehifadhiwa, huku nahau ya umri ikitafsiriwa kwa Kiswahili cha kawaida. Alama za tanbihi zimewekwa kwenye maneno yanayohusika, hata ingawa mpangilio wa herufi unafuata data ya ushauri ya Kiingereza.
