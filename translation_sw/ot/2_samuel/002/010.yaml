base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/010.yaml
  text: Ish-bosheth son of Saul was forty years old when he began to reign over Israel[a], and he reigned two years[c][b]. But the house of Judah followed David.
translation:
  language: sw
  text: Ish-boshethi[c] mwana wa Sauli alikuwa na umri wa miaka arobaini alipoanza kutawala Israeli, naye alitawala kwa miaka miwili. Lakini nyumba ya Yuda[a] ilimfuata Daudi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “nyumba ya Yuda,” usemi wa kijumuiya unaoweza kumaanisha kabila au ufalme wa Yuda.'
    reason: lexical_alternative
  - marker: b
    text: Au “ilikuwa mwaminifu kwa Daudi” au “ilikuwa upande wa Daudi.” Kiebrania, kwa maana halisi, “walikuwa nyuma ya Daudi,” ni nahau ya kuonyesha utii au kumuunga mkono.
    reason: lexical_alternative
  - marker: c
    text: Hapa Andiko la Kimasora lina jina Ish-boshethi; linganisha na umbo jingine, Eshbaali, katika mapokeo yanayohusiana.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: alikuwa na umri wa miaka arobaini
  rationale: Hii ni nahau ya kawaida ya Kiebrania ya kutaja umri; Kiswahili cha kawaida huieleza kwa maneno haya.
- source_word: אִישׁ בֹּשֶׁת
  choice: Ish-boshethi
  rationale: Jina lililo katika Andiko la Kimasora limehifadhiwa kwa umbo linalosomeka kwa kawaida katika Kiswahili; umbo jingine la mapokeo limetajwa katika tanbihi.
- source_word: בְּמָלְכוֹ
  choice: alipoanza kutawala
  rationale: Muundo huu unaonyesha wakati wa kuanza kwa ufalme wake katika kaida ya taarifa za kifalme; tafsiri hii ni ya asili katika Kiswahili.
- source_word: עַל יִשְׂרָאֵל
  choice: kutawala Israeli
  rationale: Katika muktadha wa kifalme, עַל huonyesha mamlaka juu ya taifa; Kiswahili hakihitaji kihusishi baada ya kitenzi 'kutawala'.
- source_word: וּשְׁתַּיִם שָׁנִים מָלָךְ
  choice: naye alitawala kwa miaka miwili
  rationale: Hii inawasilisha moja kwa moja muda wa utawala wake kwa Kiswahili sanifu.
- source_word: אַךְ
  choice: Lakini
  rationale: Neno hili linaweka tofauti kati ya utawala wa Ish-boshethi juu ya Israeli na uaminifu wa Yuda kwa Daudi.
- source_word: בֵּית יְהוּדָה
  choice: nyumba ya Yuda
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya kundi la ukoo au jumuiya ya Yuda bila kuibadili kimya kimya kuwa 'kabila' au 'ufalme'.
- source_word: הָיוּ אַחֲרֵי דָוִד
  choice: ilimfuata Daudi
  rationale: Nahau ya Kiebrania, kwa maana halisi 'walikuwa nyuma ya Daudi,' inaonyesha kumuunga mkono au kuwa upande wake; 'ilimfuata' huhifadhi sitiari hiyo na maana ya utiifu wa kisiasa.
