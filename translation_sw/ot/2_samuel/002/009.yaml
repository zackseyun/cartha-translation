base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/009.yaml
  text: and made him king over Gilead[a], over the Ashurites, over Jezreel, over Ephraim, over Benjamin, and over all Israel.
translation:
  language: sw
  text: akamfanya kuwa mfalme juu ya Gileadi, juu ya Waashuri[a], juu ya Yezreeli, juu ya Efraimu, juu ya Benyamini, na juu ya Israeli yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Waashuri.” Baadhi ya watu hulielewa neno hili kuwa “Asheri,” yaani kabila au eneo la Asheri.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּמְלִכֵהוּ
  choice: akamfanya kuwa mfalme
  rationale: Hifili ya מלך pamoja na kiambishi cha nafsi ya tatu ya kiume ina maana ya kumweka au kumfanya mtu awe mfalme. Kauli hii ya Kiswahili ni ya kawaida na inadumisha maana ya kisababishi.
- source_word: אֶל / עַל
  choice: juu ya
  rationale: Katika muktadha wa kumtawaza mtu atawale maeneo na makabila, vihusishi hivi vinaonyesha mamlaka ya kifalme. “Juu ya” linaeleza utawala huo kwa uwazi na pia linadumisha urudiaji wa orodha ya Kiebrania.
- source_word: הַגִּלְעָד
  choice: Gileadi
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la eneo hili.
- source_word: הָאֲשׁוּרִי
  choice: Waashuri
  rationale: Maandishi ya Kimasora yana umbo la jina la mtu wa taifa katika umoja linaloweza kutumiwa kwa maana ya pamoja. “Waashuri” linafikisha maana hiyo ya pamoja bila kuamua kimya-kimya kwamba neno hilo ni “Asheri”; uwezekano huo umewekwa katika tanbihi.
- source_word: יִזְרְעֶאל
  choice: Yezreeli
  rationale: Hili ni umbo la kawaida la Kiswahili la jina hili la mahali.
- source_word: אֶפְרַיִם
  choice: Efraimu
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la kabila hili.
- source_word: בִּנְיָמִן
  choice: Benyamini
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la kabila hili.
- source_word: יִשְׂרָאֵל כֻּלֹּה
  choice: Israeli yote
  rationale: כֻּלֹּה hukazia upeo kamili wa Israeli, si sehemu yake tu. “Israeli yote” ni usemi wa asili na ulio wazi katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Urudiaji wa “juu ya” umehifadhiwa ili kuakisi muundo wa orodha ya Kiebrania na kusisitiza maeneo yote ya utawala. Alama ya tanbihi imewekwa baada ya “Waashuri,” neno linalohusika moja kwa moja na tanbihi.
