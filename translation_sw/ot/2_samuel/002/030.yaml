base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/030.yaml
  text: And Joab returned from pursuing Abner[a], and he gathered all the people. When they were counted, nineteen men of David’s servants were missing, besides Asahel.
translation:
  language: sw
  text: Yoabu akarudi kutoka kumfuatilia Abneri, akawakusanya watu wote. Walipohesabiwa, watumishi wa Daudi kumi na tisa walikosekana, pamoja na Asaheli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “watu kumi na tisa, na Asaheli.” Maneno hayo yanaonyesha kwamba Asaheli anaongezwa kwa wale kumi na tisa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: akarudi
  rationale: Kitenzi שוב katika qal hapa kina maana ya kurudi; “akarudi” ni simulizi la kawaida na la moja kwa moja katika Kiswahili.
- source_word: מֵאַחֲרֵי אַבְנֵר
  choice: kutoka kumfuatilia Abneri
  rationale: Kihalisi ni “kutoka nyuma ya Abneri,” lakini katika muktadha wa vita maana yake ni kurudi kutoka katika harakati za kumfuatia adui. “Kumfuatilia” huhifadhi maana ya pursuit bila kuongeza maelezo yasiyokuwapo.
- source_word: וַיִּקְבֹּץ אֶת כָּל הָעָם
  choice: akawakusanya watu wote
  rationale: עָם ni “watu,” ingawa hapa inarejelea kikosi cha Yoabu. “Watu wote” hudumisha uwazi wa kileksia huku muktadha wa vita ukibainisha kuwa ni watu wake wa kupigana.
- source_word: וַיִּפָּקְדוּ
  choice: Walipohesabiwa ... walikosekana
  rationale: Nifali ya פקד katika ujenzi huu inaonyesha kwamba baada ya kuhesabiwa iligunduliwa kuwa baadhi hawakuwapo. Muundo huu wa Kiswahili unaeleza kwa kawaida matokeo ya kuhesabiwa.
- source_word: מֵעַבְדֵי דָוִד
  choice: watumishi wa Daudi
  rationale: עֲבָדִים ni “watumishi”; katika mazingira haya ni watu waliokuwa katika utumishi wa Daudi, wakiwemo wapiganaji wake. Tafsiri hii huhifadhi neno la chanzo.
- source_word: תִּשְׁעָה עָשָׂר אִישׁ
  choice: kumi na tisa
  rationale: Hii ni idadi ya moja kwa moja. Nomino “watumishi” tayari inaonyesha kwamba wanaohesabiwa ni watu, hivyo kurudia “watu” si lazima katika Kiswahili.
- source_word: וַעֲשָׂה אֵל
  choice: mbali na Asaheli
  rationale: Maandishi yaliyotolewa yanaonyesha jina Asaheli likiwa limetenganishwa kwa namna ya kiothografia. Kihalisi ni “na Asaheli,” naye anaongezwa kwa wale kumi na tisa; “mbali na Asaheli” ni Kiswahili cha kawaida kinachoonyesha jumla hiyo ya nyongeza.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa na wenye heshima. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Yoabu, Abneri, Daudi, na Asaheli.'
