base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/016.yaml
  text: Each man seized his companion by the head[a], and his sword was in his companion’s side, so they fell together. Therefore that place, which is in Gibeon, was called Helkath-hazzurim.
translation:
  language: sw
  text: Kila mtu alimshika mwenzake kwa kichwa, na upanga wake ulikuwa ubavuni mwa mwenzake; wakaanguka pamoja. Kwa hiyo mahali pale palipo Gibeoni pakaitwa Helkath-hasurimu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Helkath-hasurimu ni utohozi wa jina la mahali katika Kiebrania. Maana yake kamili haijulikani kwa uhakika; tafsiri zilizopendekezwa ni pamoja na “Uwanja wa Pande,” “Uwanja wa Panga Kali,” na tafsiri nyingine zinazofanana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲזִקוּ
  choice: akamshika
  rationale: Katika pambano, kitenzi חזק kinaonyesha kumkamata mwingine kwa nguvu; “akamshika” ni cha kawaida na kinaendana na muktadha wa mapigano.
- source_word: אִישׁ
  choice: Kila mmoja
  rationale: 'Nomino hii imetumiwa kwa maana ya mgawanyo: kila mpiganaji alitenda vivyo hivyo dhidi ya aliyekuwa mbele yake.'
- source_word: בְּרֹאשׁ רֵעֵהוּ
  choice: mwenzake kichwani
  rationale: רֹאשׁ ni “kichwa,” na רֵעַ hapa ni mpiganaji mwenzake katika jozi, si lazima rafiki. Muundo huu ni wa asili katika Kiswahili.
- source_word: וְחַרְבּוֹ בְּצַד רֵעֵהוּ
  choice: na upanga wake ukawa ubavuni mwa mwenzake
  rationale: Kiebrania hakina kitenzi katika kishazi hiki. “Ukawa ubavuni” huhifadhi ufupi na taswira yake bila kuongeza wazi tendo kama “akauchoma.” צַד imetafsiriwa “ubavu.”
- source_word: וַיִּפְּלוּ יַחְדָּו
  choice: wakaanguka pamoja
  rationale: Hii inaendeleza mfululizo wa matendo, na יַחְדָּו inaonyesha kwamba walianguka kwa pamoja.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: Kwa hiyo mahali pale ... pakaitwa
  rationale: Mtendaji wa tendo la kuita hajatajwa kwa uwazi katika Kiebrania; kauli ya kutendwa ni ya asili katika Kiswahili. “Kwa hiyo” huonyesha kwamba jina lilitokana na tukio hilo.
- source_word: חֶלְקַת הַצֻּרִים
  choice: Helkath-hasurimu
  rationale: Hili ni jina la mahali. Maana yake ya asili haijulikani kwa uhakika, hivyo limetoholewa badala ya kuchagua tafsiri moja yenye utata.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: palipo Gibeoni
  rationale: Kishazi hiki kinabainisha mahali eneo hilo lilipokuwa; “palipo Gibeoni” ni kifupi na cha asili.
