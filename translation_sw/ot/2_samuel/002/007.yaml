base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/007.yaml
  text: Let your hands be strong[a], and be valiant men, for your lord Saul is dead, and the house of Judah also has anointed me king over them.
translation:
  language: sw
  text: Sasa mikono yenu na iwe imara[a], nanyi muwe wanaume hodari, kwa kuwa bwana wenu Sauli amekufa. Na Nyumba ya Yuda imenitia mafuta kuwa mfalme juu yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “muwe na nguvu.” Usemi wa Kiebrania husema kihalisi kwamba mikono iwe imara; ni himizo la ujasiri na uthabiti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Kirai hiki kina kiunganishi וְ pamoja na עַתָּה, ‘sasa.’ ‘Basi sasa’ kinaonyesha kwa kawaida hitimisho au hatua inayofuata katika hotuba ya Daudi bila kuondoa maana ya wakati.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: mikono yenu na ipate nguvu
  rationale: Hii inadumisha picha halisi ya mikono kupata nguvu, huku katika muktadha ikiwa himizo la kuwa jasiri na thabiti.
- source_word: וִהְיוּ לִבְנֵי חַיִל
  choice: nanyi muwe wanaume hodari
  rationale: בְּנֵי חַיִל humaanisha wanaume wenye ujasiri na uwezo, mara nyingi katika mazingira ya kijeshi au uongozi. ‘Wanaume hodari’ ni ya kawaida, inaeleweka, na inadumisha umbo la kiume la Kiebrania.
- source_word: כִּי מֵת אֲדֹנֵיכֶם שָׁאוּל
  choice: kwa kuwa bwana wenu Sauli amekufa
  rationale: כִּי inaeleza sababu ya himizo. ‘Bwana wenu’ hapa ni cheo cha heshima na utawala wa kibinadamu kinachomhusu Sauli.
- source_word: וְגַם אֹתִי מָשְׁחוּ בֵית יְהוּדָה
  choice: Nyumba ya Yuda pia imenitia mafuta
  rationale: ‘Nyumba ya Yuda’ inadumisha jina la pamoja la kabila hilo; ‘pia’ linaonyesha jambo la ziada, na ‘kunipaka mafuta’ linaonyesha tendo rasmi la kumweka mtu katika cheo.
- source_word: לְמֶלֶךְ עֲלֵיהֶם
  choice: niwe mfalme wao
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza kwamba Daudi aliwekwa kuwa mfalme juu yao, bila kubadili uhusiano wa utawala uliomo katika Kiebrania.
theological_decisions:
- issue: Usemi wa kiume katika לִבְנֵי חַיִל
  choice: wanaume hodari
  alternative: watu hodari; muwe jasiri
  rationale: Kiebrania kina usemi wa kiume, na katika muktadha Daudi anawahutubia wanaume wanaoweza kuchukua hatua ya kijeshi au kisiasa. Tafsiri haubadilishwi kuwa usemi usioonyesha jinsia.
- issue: Maana ya אֲדֹנֵיכֶם
  choice: bwana wenu
  alternative: mtawala wenu; mkuu wenu
  rationale: Hapa neno hilo linamhusu Sauli kama mtawala wa kibinadamu, si jina la Mungu. ‘Bwana wenu’ inadumisha heshima na mamlaka ya kisiasa bila kuingiza dai la kiungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Picha ya ‘mikono’ na tendo la ‘kutia mafuta’ zimehifadhiwa kwa sababu zina uzito wa kifasihi na kitamaduni katika chanzo.
