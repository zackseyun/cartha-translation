  text: וְ/עַתָּ֕ה יַֽעַשׂ יְהוָ֥ה עִמָּ/כֶ֖ם חֶ֣סֶד וֶ/אֱמֶ֑ת וְ/גַ֣ם אָנֹכִ֗י אֶעֱשֶׂ֤ה אִתְּ/כֶם֙ הַ/טּוֹבָ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר עֲשִׂיתֶ֖ם הַ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/006.yaml
  text: And now may Yahweh show you steadfast love and faithfulness[a]. And I also will do this good to you[c][b], because you have done this thing.
translation:
  language: sw
  text: Na sasa, Yahwe na awaonyeshe upendo wa kudumu na uaminifu[a]. Mimi pia nitawatendea wema huu[c], kwa sababu mmefanya jambo hili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe atawaonyesha upendo wa kudumu na uaminifu.” Kitenzi cha Kiebrania kinaweza kueleweka kama ombi la baraka au kama taarifa ya wakati ujao.
    reason: alternative_reading
  - marker: b
    text: '“Jambo hili” linarejelea tendo lililotajwa katika mstari uliotangulia: kumzika Sauli.'
    reason: cross_reference
  - marker: c
    text: Au, “fadhili hii.” Kiebrania kinasema kihalisi “wema huu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huendeleza maneno ya Daudi kutoka mstari uliotangulia na kuanzisha baraka yake kwa Kiswahili cha kawaida.
- source_word: יַעַשׂ
  choice: na awatendee
  rationale: Muundo wa kutakia unaonyesha ombi au baraka; uwezekano wa kauli ya wakati ujao umehifadhiwa katika tanbihi.
- source_word: חֶסֶד
  choice: upendo thabiti
  rationale: Huhifadhi maana ya upendo wenye kudumu na uaminifu wa kimahusiano bila kuuwekea ufafanuzi wa kimadhehebu.
- source_word: וֶאֱמֶת
  choice: uaminifu
  rationale: Katika muungano huu wa maneno, maana kuu ni kutegemeka na kuwa mwaminifu, si “kweli” kwa maana ya dhana tu.
- source_word: וְגַם אָנֹכִי
  choice: Mimi pia
  rationale: Huhifadhi msisitizo wa kiwakilishi cha nafsi na wazo la tendo la Daudi linalolingana na tendo la Yahwe.
- source_word: אֶעֱשֶׂה אִתְּכֶם
  choice: nitawatendea
  rationale: Kitenzi hiki kinaeleza tendo linaloelekezwa kwao; “nitawatendea” ni cha asili na huhifadhi mwelekeo huo.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: wema huu
  rationale: Ni tafsiri ya karibu ya “jema/wema huu” na hailichanganyi neno hili na חֶסֶד lililotumiwa mapema.
- source_word: אֲשֶׁר עֲשִׂיתֶם הַדָּבָר הַזֶּה
  choice: kwa sababu mmefanya jambo hili
  rationale: Kishazi kinaeleza sababu ya Daudi kuwatendea wema na hurejelea tendo lililotajwa katika mstari uliotangulia.
theological_decisions:
- issue: 'Nguvu ya kitenzi יַעַשׂ: baraka au taarifa ya wakati ujao'
  choice: “na awatendee,” yaani ombi au baraka
  alternative: “atawatendea,” yaani taarifa ya wakati ujao
  rationale: Katika muktadha Daudi anawabariki watu wa Yabeshi-gileadi kwa uaminifu wao kwa Sauli. Hata hivyo, umbo la Kiebrania linaweza pia kueleweka kama taarifa ya wakati ujao, kwa hiyo uwezekano huo umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Basi sasa” huleta mwendelezo wa hotuba, “na awatendee” huwasilisha baraka kwa kawaida, na “wema huu” huhifadhi tofauti ya msamiati kati ya הַטּוֹבָה na חֶסֶד.
