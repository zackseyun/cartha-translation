base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/015.yaml
  text: 'So they arose and crossed over by number: twelve for Benjamin and for Ish-bosheth the son of Saul[d][c][b][a], and twelve from the servants of David.'
translation:
  language: sw
  text: 'Basi wakasimama, wakavuka[a] kwa idadi: watu kumi na wawili wa upande wa Benyamini[b] na Ish-boshethi[c], mwana wa Sauli, na watu kumi na wawili kutoka kwa watumishi wa Daudi.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakapita” au “wakaenda upande mwingine.” Kitenzi cha Kiebrania kinaweza kumaanisha kuvuka, kupita, au kwenda mahali palipokusudiwa.
    reason: lexical_alternative
  - marker: b
    text: Au “kutoka kwa Benyamini.” Kihusishi cha Kiebrania kinaweza kuonyesha asili au upande wanaounga mkono; hapa yaelekea watu hao waliwakilisha Benyamini na Ish-boshethi.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania ni “Ish-boshethi”; mahali pengine katika mapokeo ya Agano la Kale linapatikana jina linalohusiana, “Eshbaali.”
    reason: alternative_reading
  - marker: d
    text: Au “miongoni mwa watumishi wa Daudi”; kwa tafsiri yenye kufafanua zaidi, “kutoka kwa watu wa Daudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: wakasimama
  rationale: Kitenzi קום kinaendeleza masimulizi kwa tendo la kuinuka au kusimama; “wakasimama” ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: וַיַּעַבְרוּ
  choice: wakavuka
  rationale: עבר huonyesha kuvuka au kwenda upande mwingine; “wakavuka” linafaa katika muktadha huu wa kwenda mahali pa pambano.
- source_word: בְמִסְפָּר
  choice: wakiwa wamehesabiwa
  rationale: Kirai hiki kinaonyesha kwamba washiriki walitolewa kwa idadi iliyohesabiwa na kulinganishwa. Kauli hii ni ya asili katika Kiswahili kuliko tafsiri ya neno kwa neno “kwa hesabu.”
- source_word: שְׁנֵים עָשָׂר
  choice: watu kumi na wawili
  rationale: Idadi ni kumi na mbili; kuongeza “watu” kunafanya sentensi iwe wazi na ya kawaida katika Kiswahili bila kuongeza maana mpya.
- source_word: לְבִנְיָמִן
  choice: upande wa Benyamini
  rationale: ל hapa inaonyesha upande au ushirika katika pambano, si lazima asili pekee. “Upande wa” huwasilisha maana hiyo kwa uwazi.
- source_word: וּלְאִישׁ בֹּשֶׁת
  choice: na Ish-boshethi
  rationale: Jina la Kimasoreti limehifadhiwa kwa unukuzi wa Kiswahili; neno “upande wa” linatawala pia jina hili na kuonyesha utii wao kwa Ish-boshethi.
- source_word: בֶּן שָׁאוּל
  choice: mwana wa Sauli
  rationale: Hili ni tambulisho la moja kwa moja la uhusiano wa kifamilia.
- source_word: וּשְׁנֵים עָשָׂר
  choice: na watu kumi na wawili
  rationale: Huhifadhi usawa wa idadi kati ya pande hizo mbili na kuunganisha sehemu ya pili ya sentensi kwa kawaida.
- source_word: מֵעַבְדֵי דָוִד
  choice: miongoni mwa watumishi wa Daudi
  rationale: מן huonyesha kwamba watu hao walitoka katika kundi la watumishi wa Daudi. עבדים kihalisi ni “watumishi,” ingawa katika muktadha huu ni watu waliokuwa katika utumishi wa kifalme na kijeshi.
