translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa masimulizi ulio wazi, wa sasa na wenye hadhi. “Wakiwa wamehesabiwa” huepuka usemi usio wa kawaida “kwa hesabu,” huku “upande wa” kikihifadhi maana ya ushirika inayowezekana katika ל. Majina yameandikwa kwa maumbo yanayosomeka kwa Kiswahili.
