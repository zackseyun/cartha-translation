  text: וַ/יַּ֤עַל שָׁם֙ דָּוִ֔ד וְ/גַ֖ם שְׁתֵּ֣י נָשָׁ֑י/ו אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵלִ֔ית וַ/אֲבִיגַ֕יִל אֵ֖שֶׁת נָבָ֥ל הַֽ/כַּרְמְלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/002.yaml
  text: 'So David went up there[a], and also his two wives: Ahinoam the Jezreelite and Abigail, the wife of Nabal the Carmelite.'
translation:
  language: sw
  text: 'Basi Daudi akapanda kwenda huko, pamoja na wake zake wawili: Ahinoamu, mwanamke wa Yezreeli, na Abigaili, mke wa Nabali, mtu wa Karmeli.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל שָׁם
  choice: akapanda kwenda huko
  rationale: Kitenzi עלה kina wazo la kwenda juu au kupanda kuelekea mahali fulani; ‘akapanda kwenda huko’ huhifadhi mwelekeo huo kwa Kiswahili cha kawaida, huku שָׁם ikitafsiriwa ‘huko’ kwa mahali palipotajwa katika muktadha.
- source_word: וְגַם שְׁתֵּי נָשָׁיו
  choice: pamoja na wake zake wawili
  rationale: Kirai hiki kinawaongeza wake wawili wa Daudi katika tendo la kwenda. ‘Pamoja na’ ni usemi wa asili wa Kiswahili unaohifadhi nguvu ya nyongeza ya וְגַם.
- source_word: אֲחִינֹעַם
  choice: Ahinoamu
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: הַיִּזְרְעֵלִית
  choice: mwanamke wa Yezreeli
  rationale: Kivumishi cha unasaba kinaonyesha kwamba Ahinoamu alitoka Yezreeli. Usemi huu ni wazi na wa kawaida zaidi kuliko jina la unasaba lisilozoeleka.
- source_word: וַאֲבִיגַיִל
  choice: na Abigaili
  rationale: Kiunganishi kinamtaja mke wa pili katika orodha; jina limetoholewa kwa tahajia ya Kiswahili.
- source_word: אֵשֶׁת נָבָל
  choice: mke wa Nabali
  rationale: Tafsiri hii huhifadhi moja kwa moja utambulisho wa Abigaili kwa ndoa yake ya awali na Nabali, kama ulivyo katika Kiebrania, bila kuficha uhusiano wa kifasihi na simulizi lililotangulia.
- source_word: הַכַּרְמְלִי
  choice: mtu wa Karmeli
  rationale: Kivumishi hiki kinamtambulisha Nabali kwa asili au uhusiano wake na Karmeli. ‘Mtu wa Karmeli’ ni wazi na cha kawaida katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi umefanywa wa asili kwa Kiswahili huku mwelekeo wa kitenzi cha Kiebrania na maelezo ya utambulisho wa wake hao yakihifadhiwa.
