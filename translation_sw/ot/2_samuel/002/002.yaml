  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu muundo na maudhui ya Kiebrania: Daudi alipanda/kwenda juu huko, na wake zake wawili wanatajwa kwa majina na vitambulisho vyao vya mahali na ndoa. “Pamoja na wake zake wawili” hutoa kwa kawaida maana ya nyongeza ya וְגַם katika muktadha wa Kiswahili.'
