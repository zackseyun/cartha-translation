base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/012.yaml
  text: Then Abner son of Ner[a], and the servants of Ish-bosheth son of Saul, went out from Mahanaim to Gibeon.
translation:
  language: sw
  text: Kisha Abneri mwana wa Neri na watumishi wa Ish-boshethi[a] mwana wa Sauli wakatoka Mahanaimu kwenda Gibeoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Ish-boshethi”; mtu huyuhuyu anaitwa “Eshbaali” katika 1 Mambo ya Nyakati 8:33; 9:39.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Kisha ... wakatoka
  rationale: Waw-consecutive inaendeleza simulizi, hivyo “Kisha” ni ya asili katika Kiswahili. Ingawa kitenzi cha Kiebrania kiko katika umoja, kiima kinachofuata kinawahusisha Abneri na watumishi, kwa hiyo wingi “wakatoka” unafaa katika Kiswahili.
- source_word: אַבְנֵר בֶּן נֵר
  choice: Abneri mwana wa Neri
  rationale: Majina yametoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili, na uhusiano wa ukoo umetafsiriwa moja kwa moja kwa “mwana wa”.
- source_word: וְעַבְדֵי
  choice: pamoja na watumishi wa
  rationale: עֶבֶד inaweza kumaanisha mtumishi, afisa au mfuasi kulingana na muktadha. “Watumishi” inadumisha maana ya msingi bila kubainisha cheo kisichotajwa; “pamoja na” huonyesha wazi kuwa wao ni sehemu ya kiima kinachotenda.
- source_word: אִישׁ בֹּשֶׁת
  choice: Ish-boshethi
  rationale: Hili ndilo jina lililo katika maandishi ya Kimasora ya aya hii; umbo mbadala lililohifadhiwa katika Mambo ya Nyakati limeelezwa katika tanbihi.
- source_word: בֶּן שָׁאוּל
  choice: mwana wa Sauli
  rationale: Uhusiano wa ukoo umetafsiriwa moja kwa moja.
- source_word: מִמַּחֲנַיִם
  choice: Mahanaimu
  rationale: Kihusishi מִן kinaonyesha mahali walipotoka. Katika Kiswahili, kitenzi “wakatoka” pamoja na jina la mahali “Mahanaimu” huwasilisha maana hiyo kwa kawaida bila kuhitaji “kutoka” nyingine.
- source_word: גִּבְעֹנָה
  choice: kwenda Gibeoni
  rationale: Herufi ya mwelekeo mwishoni mwa jina la mahali inaonyesha mwendo kuelekea huko; “kwenda Gibeoni” ni usemi wa asili na ulio wazi katika Kiswahili.
