base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/017.yaml
  text: The battle was very fierce that day[b][a], and Abner and the men of Israel were defeated before the servants of David.
translation:
  language: sw
  text: Vita vilikuwa vikali sana siku hiyo, na Abneri pamoja na watu wa Israeli wakashindwa mbele ya watumishi wa Daudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, vikosi vya Daudi au watu waliokuwa katika utumishi wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּלְחָמָה
  choice: Vita
  rationale: Katika simulizi hili neno linamaanisha pambano maalumu la kijeshi; “vita” ni neno la kawaida na la asili katika Kiswahili, ingawa umbo lake ni la wingi.
- source_word: קָשָׁה עַד מְאֹד
  choice: vilikuwa vikali sana
  rationale: Kishazi hiki huonyesha ukali mkubwa wa mapigano; “vikali sana” ni cha asili na huhifadhi nguvu ya עַד מְאֹד.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya usemi wa wakati.
- source_word: וַיִּנָּגֶף
  choice: wakashindwa
  rationale: Katika muktadha wa kijeshi kitenzi cha Niphal kinaonyesha kushindwa na adui, si kujeruhiwa tu.
- source_word: אַבְנֵר
  choice: Abneri
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וְאַנְשֵׁי יִשְׂרָאֵל
  choice: pamoja na watu wa Israeli
  rationale: “Watu wa Israeli” huhifadhi rejeo kwa kundi la Israeli lililokuwa pamoja na Abneri bila kuongeza wazi neno “wanajeshi,” ambalo halipo katika maandishi.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Huhifadhi nahau ya Kiebrania ya kushindwa mbele ya jeshi pinzani.
- source_word: עַבְדֵי דָוִד
  choice: watumishi wa Daudi
  rationale: Ni tafsiri iliyo karibu na neno la Kiebrania עֶבֶד; katika muktadha huu linarejelea watu waliokuwa katika utumishi wa kijeshi wa Daudi.
