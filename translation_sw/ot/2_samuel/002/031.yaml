  text: But David’s servants struck down three hundred and sixty men from Benjamin and from Abner’s men[a].
translation:
  language: sw
  text: Lakini watumishi wa Daudi waliwapiga watu mia tatu na sitini kutoka kwa kabila la Benyamini na miongoni mwa watu wa Abneri; watu hao wakafa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na watumishi wa Daudi waliwapiga ...” Kiunganishi cha Kiebrania kinaweza kutafsiriwa tu kuwa “na”; katika maandishi makuu limetafsiriwa “lakini” ili kuonyesha utofauti na taarifa ya waliokufa katika mstari uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַבְדֵי דָוִד
  choice: Lakini watumishi wa Daudi
  rationale: Kiunganishi וְ kinaweza kumaanisha “na,” lakini hapa “lakini” kinaonyesha kwa kawaida utofauti kati ya hasara za upande wa Daudi katika mstari uliotangulia na hasara za upande wa Abneri. “Watumishi” hapa ni watu waliokuwa katika utumishi wa Daudi, hasa askari wake.
- source_word: הִכּוּ
  choice: waliwapiga
  rationale: Kitenzi נכה humaanisha kupiga na katika vita mara nyingi huleta maana ya kumwangusha au kumuua mtu. “Waliwapiga” kinahifadhi kitenzi chenyewe, huku מֵתוּ ikieleza wazi matokeo ya kifo.
- source_word: מִ/בִּנְיָמִן
  choice: kutoka kwa kabila la Benyamini
  rationale: מִן huonyesha kundi ambalo waliokufa walitoka. Kutaja “kabila” kunafanya rejeo la Benyamini lieleweke kwa msomaji wa Kiswahili bila kubadili maana.
- source_word: וּ/בְ/אַנְשֵׁי אַבְנֵר
  choice: na miongoni mwa watu wa Abneri
  rationale: בְ hapa huonyesha waliokuwa miongoni mwa watu wa Abneri. Tafsiri hii inadumisha tofauti ya vihusishi katika Kiebrania na haifanyi makundi hayo mawili yaonekane lazima kuwa tofauti kabisa.
- source_word: שְׁלֹשׁ מֵאוֹת וְ/שִׁשִּׁים אִישׁ
  choice: watu mia tatu na sitini
  rationale: Hii ni idadi ya wanaume wapiganaji; “watu” ni ya kawaida katika muundo wa kuhesabu kwa Kiswahili, na muktadha wa vita unaonyesha walikuwa wanaume.
- source_word: מֵתוּ
  choice: nao wakafa
  rationale: Kiebrania kinataja kifo kwa kitenzi tofauti baada ya הִכּוּ. “Nao wakafa” kinahifadhi taarifa hiyo badala ya kuimeza ndani ya “waliwapiga” au “waliwaua.”
