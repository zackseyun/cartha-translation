base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/013.yaml
  text: And Joab the son of Zeruiah and the servants of David went out and met them together by the pool of Gibeon. And these sat on one side of the pool[a], and those on the other side of the pool.
translation:
  language: sw
  text: Kisha Yoabu mwana wa Seruya na watumishi wa Daudi wakatoka, wakakutana nao pamoja kando ya bwawa la Gibeoni[a]. Hawa wakaketi upande mmoja wa bwawa, na wale upande mwingine wa bwawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hifadhi ya maji ya Gibeoni”; neno la Kiebrania linaweza kumaanisha bwawa lililojengwa au hifadhi ya maji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: Kisha Yoabu
  rationale: Kiunganishi cha masimulizi וְ kimetafsiriwa kwa “Kisha” ili kuendeleza kwa kawaida mfuatano wa matukio katika Kiswahili bila kuongeza uhusiano wa kisababu.
- source_word: בֶּן צְרוּיָה
  choice: mwana wa Seruya
  rationale: Hili linahifadhi kwa uwazi utambulisho wa kifamilia uliomo katika Kiebrania.
- source_word: וְ/עַבְדֵי דָוִד
  choice: na watumishi wa Daudi
  rationale: “Watumishi” huhifadhi maana ya msingi ya עֲבָדִים; muktadha unaonyesha kuwa hawa ni watu wake wa kijeshi, lakini tafsiri haiongezi neno “wanajeshi” lisilokuwamo wazi katika kifungu.
- source_word: יָצְאוּ
  choice: wakatoka
  rationale: Kitenzi cha kawaida יצא kimetafsiriwa moja kwa moja; umbo la “waka-” linaendeleza mtiririko wa masimulizi ya Kiswahili.
- source_word: וַיִּפְגְּשׁוּם
  choice: wakakutana nao
  rationale: Kitenzi פגשׁ pamoja na kiambishi cha wingi kina maana ya kukutana nao au kuwafikia; “wakakutana nao” ni cha kawaida na kinahifadhi rejeo kwa kundi lililotajwa katika mstari uliotangulia.
- source_word: עַל בְּרֵכַת גִּבְעוֹן
  choice: kando ya bwawa la Gibeoni
  rationale: בְּרֵכָה linaweza kuwa bwawa lililojengwa au hifadhi ya maji. “Kando ya” linafaa kwa mandhari inayoweka makundi hayo pande mbili za bwawa.
- source_word: יַחְדָּו
  choice: pamoja
  rationale: Neno hili limehifadhiwa ili kuonyesha kwamba makundi hayo yalikutana mahali pamoja.
- source_word: וַיֵּשְׁבוּ
  choice: wakaketi
  rationale: ישׁב hapa linaeleza makundi yakikaa au kuchukua nafasi zao; “wakaketi” ni la moja kwa moja na la kawaida.
- source_word: אֵלֶּה ... וְאֵלֶּה
  choice: Hawa ... na wale
  rationale: Hii inahifadhi utofautishaji wa viwakilishi vya kuonyesha bila kuongeza majina yasiyokuwamo katika Kiebrania.
- source_word: עַל הַבְּרֵכָה מִזֶּה ... עַל הַבְּרֵכָה מִזֶּה
  choice: upande mmoja wa bwawa ... upande mwingine wa bwawa
  rationale: Usemi wa Kiebrania unaonyesha pande zinazokabiliana za bwawa lilelile; tafsiri hii huwasilisha mahali pa makundi hayo kwa Kiswahili wazi na cha kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa masimulizi na hadhi inayofaa maandiko. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia; sintaksia ngumu ya mahali katika Kiebrania imewasilishwa kwa usemi wa kawaida “upande mmoja ... upande mwingine” bila kuondoa utofautishaji wa makundi.
