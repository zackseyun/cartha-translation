  text: וַ/יִּֽתְקַבְּצ֤וּ בְנֵֽי בִנְיָמִן֙ אַחֲרֵ֣י אַבְנֵ֔ר וַ/יִּהְי֖וּ לַ/אֲגֻדָּ֣ה אֶחָ֑ת וַ/יַּ֣עַמְד֔וּ עַ֥ל רֹאשׁ גִּבְעָ֖ה אֶחָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/025.yaml
  text: Then the sons of Benjamin gathered together behind Abner[a], became one band[b], and took their stand on the top of one hill.
translation:
  language: sw
  text: Ndipo watu wa Benyamini wakakusanyika nyuma ya Abneri[a], wakawa kikosi kimoja[b], nao wakasimama juu ya kilele cha kilima kimoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakimfuata Abneri.” Msemo wa Kiebrania unaweza kumaanisha kuwa nyuma yake kwa mahali au kumfuata kama kiongozi.
    reason: lexical_alternative
  - marker: b
    text: Au “kundi moja.” Neno la Kiebrania linamaanisha kundi lililokusanyika na kuungana pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: wakakusanyika
  rationale: Hali ya hitpaeli ya קבץ inaonyesha kujikusanya kwa pamoja. “Wakakusanyika” ni Kiswahili cha kawaida kinachofaa katika simulizi hili la kujipanga upya.
- source_word: בְנֵי בִנְיָמִן
  choice: watu wa Benyamini
  rationale: Ingawa kwa neno halisi ni “wana wa Benyamini,” hapa msemo huo unamaanisha watu wa kabila la Benyamini. “Watu wa Benyamini” ni wa asili na wazi katika Kiswahili cha sasa.
- source_word: אַחֲרֵי אַבְנֵר
  choice: nyuma ya Abneri
  rationale: אַחֲרֵי inaweza kuonyesha mahali nyuma ya mtu au kumfuata kama kiongozi. “Nyuma ya Abneri” huhifadhi taswira ya Kiebrania na utata huo wa kweli.
- source_word: לַאֲגֻדָּה אֶחָת
  choice: kikosi kimoja
  rationale: אֲגֻדָּה ni kundi lililoungana; katika muktadha wa mapigano, “kikosi” huwasilisha vizuri kundi la wapiganaji lililojipanga pamoja.
- source_word: וַיַּעַמְדוּ
  choice: wakasimama
  rationale: עמד kimsingi ni kusimama. Katika muktadha huu pia inadokeza kushika nafasi, lakini “wakasimama” ni ya moja kwa moja na ya kawaida, huku mazingira yakitoa maana ya kijeshi.
- source_word: עַל רֹאשׁ גִּבְעָה אֶחָת
  choice: juu ya kilele cha kilima kimoja
  rationale: רֹאשׁ katika matumizi ya kijiografia humaanisha sehemu ya juu au kilele. Tafsiri hii pia huhifadhi אֶחָת, “kimoja.”
theological_decisions: []
