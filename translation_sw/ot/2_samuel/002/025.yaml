  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Watu wa Benyamini” huepuka usemi mgumu wa “wana wa Benyamini,” na “kikosi” kinafaa kwa muktadha wa kijeshi bila kuongeza taarifa isiyokuwamo katika chanzo.
