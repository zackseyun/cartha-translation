base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/021.yaml
  text: Then Abner said to him[a], “Turn aside to your right or to your left, and seize one of the young men for yourself, and take his gear for yourself.” But Asahel was not willing to turn aside from following him.
translation:
  language: sw
  text: Ndipo Abneri akamwambia, “Geukia kulia kwako au kushoto kwako, umkamate mmoja wa vijana, kisha ujichukulie vifaa vyake vya vita[a].” Lakini Asaheli hakutaka kugeuka na kuacha kumfuata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “silaha zake.” Neno la Kiebrania huenda linamaanisha vifaa vilivyovuliwa mpiganaji aliyeanguka; kitu hasa kinachokusudiwa hakijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטֵה
  choice: Geuka uende
  rationale: Katika muktadha wa kumfuata mtu, kitenzi hiki kinaagiza kuacha njia ya sasa na kuelekea upande mwingine; ‘geuka uende’ ni Kiswahili cha kawaida kinachobeba wazo hilo.
- source_word: עַל יְמִינְךָ אוֹ עַל שְׂמֹאלֶךָ
  choice: upande wako wa kulia au wa kushoto
  rationale: Huhifadhi viambishi vya nafsi ya pili katika Kiebrania na maelekezo mawili yanayotofautishwa.
- source_word: וֶאֱחֹז לְךָ
  choice: umkamate
  rationale: אחז humaanisha kushika au kukamata kwa nguvu; ‘umkamate’ inafaa katika mazingira ya mapigano, huku maana ya kujipatia ikibebwa pia na kishazi kinachofuata.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: mmoja wa wale vijana
  rationale: ‘Vijana’ huhifadhi maana ya msingi ya נְעָרִים bila kuamua kimyakimya kwamba walikuwa watumishi au askari wa cheo fulani.
- source_word: וְקַח לְךָ אֶת חֲלִצָתוֹ
  choice: kisha ujichukulie vifaa vyake vya vita
  rationale: Neno חֲלִצָה hapa linaelekea kumaanisha vifaa vinavyovuliwa au kunyang’anywa mpiganaji. Tafsiri hii inafaa katika muktadha wa vita lakini haibainishi kupita kiasi kwamba kinachokusudiwa ni silaha pekee.
- source_word: וְלֹא אָבָה
  choice: hakutaka
  rationale: אבה huonyesha kutaka au kuwa tayari; ukanushaji wake unatolewa kwa Kiswahili cha asili kama ‘hakutaka.’
- source_word: לָסוּר מֵאַחֲרָיו
  choice: kuacha kumfuata
  rationale: Hutoa kwa njia ya kawaida maana ya kugeuka au kuondoka nyuma ya mtu katika muktadha wa kumfukuza.
