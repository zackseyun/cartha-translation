  text: וְ/אַבְנֵ֣ר וַֽ/אֲנָשָׁ֗י/ו הָֽלְכוּ֙ בָּֽ/עֲרָבָ֔ה כֹּ֖ל הַ/לַּ֣יְלָה הַ/ה֑וּא וַ/יַּעַבְר֣וּ אֶת הַ/יַּרְדֵּ֗ן וַ/יֵּֽלְכוּ֙ כָּל הַ/בִּתְר֔וֹן וַ/יָּבֹ֖אוּ מַחֲנָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/029.yaml
  text: And Abner and his men traveled through the Arabah all that night[a], crossed the Jordan, went through all the Bithron, and came to Mahanaim.
translation:
  language: sw
  text: Abneri na watu wake wakasafiri katika Araba usiku ule wote, wakavuka Yordani, wakapita katika Bithroni kote[a], wakafika Mahanaimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda, “katika eneo lote la bonde au korongo.” Neno la Kiebrania “Bithroni” huenda ni jina la mahali au maelezo ya eneo la kijiografia.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֲרָבָה
  choice: kupitia Araba
  rationale: Neno עֲרָבָה hapa lina uwezekano mkubwa wa kutaja eneo la kijiografia la ufa wa Yordani/Araba, si uwanda wa kawaida tu. Kutumia jina “Araba” kunahifadhi maana hiyo ya mahali.
- source_word: כָּל הַלַּיְלָה הַהוּא
  choice: usiku ule wote
  rationale: Hii ni tafsiri ya kawaida na ya karibu ya muundo wa Kiebrania unaoonyesha kuwa safari iliendelea muda wote wa usiku huo.
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: wakavuka Yordani
  rationale: Kitenzi עבר pamoja na Yordani kama yambwa kinaonyesha kuvuka mto; “wakavuka” ni wazi na asilia katika Kiswahili.
- source_word: כָּל הַבִּתְרוֹן
  choice: Bithroni yote
  rationale: הַבִּתְרוֹן huenda ni jina la mahali au eneo, lakini pia linaweza kueleza eneo lililokatwa, kama bonde au korongo. Jina limehifadhiwa katika matini ili kutoamua maana isiyo hakika; uwezekano mwingine umeonyeshwa katika tanbihi.
- source_word: מַחֲנָיִם
  choice: Mahanaimu
  rationale: Hili ni jina la mahali, hivyo limetoholewa badala ya kutafsiriwa.
- source_word: הָלְכוּ / וַיֵּלְכוּ / וַיָּבֹאוּ
  choice: wakasafiri ... wakapitia ... wakafika
  rationale: 'Mfuatano wa vitenzi vya mwendo umehifadhiwa kwa Kiswahili cha asili: safari ya muda mrefu, kupita katika eneo, na kufika mwisho wa safari.'
- source_word: וַאֲנָשָׁיו
  choice: watu wake
  rationale: Maana ya moja kwa moja ni “watu wake.” Katika muktadha huu ni kundi la Abneri, lakini “wanajeshi wake” ingeongeza ufafanuzi usio lazima.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki chenye mtindo wa masimulizi ulio wazi na wenye hadhi. Majina ya kale yametoholewa kwa maumbo yanayotambulika katika Kiswahili. Alama ya tanbihi imewekwa baada ya “Bithroni yote,” ambako utata wa kileksika unatokea.
