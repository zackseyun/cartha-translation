base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/022.yaml
  text: Abner said again to Asahel[a], “Turn aside from following me. Why should I strike you to the ground? Then how could I lift up my face to Joab your brother?”
translation:
  language: sw
  text: Abneri akamwambia Asaheli tena, “Geuka, acha kunifuata. Kwa nini nikupige na kukuangusha chini? Basi ningewezaje kumtazama Yoabu, ndugu yako, usoni?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד אַבְנֵר לֵאמֹר
  choice: Abneri akamwambia Asaheli tena
  rationale: Muundo huu wa Kiebrania unaonyesha kwamba Abneri alisema mara nyingine. ‘Akamwambia ... tena’ ni Kiswahili cha kawaida kinachohifadhi wazo la kurudia kusema.
- source_word: סוּר לְךָ מֵאַחֲרָי
  choice: Acha kunifuata
  rationale: Ingawa maneno hayo yana picha halisi ya kuondoka nyuma ya mtu, katika muktadha huu yanamaanisha kuacha kumfuata. Tafsiri hii ni wazi na ya kawaida kwa Kiswahili.
- source_word: לָמָּה אַכֶּכָּה אַרְצָה
  choice: Kwa nini nikuangushe chini kwa kukupiga?
  rationale: Kitenzi kina maana ya kupiga, na אַרְצָה huonyesha kuanguka chini. Tafsiri hii inahifadhi picha ya kumpiga na kumwangusha bila kutafsiri moja kwa moja kuwa ‘kumuua,’ ingawa kifo kinadokezwa na muktadha.
- source_word: וְאֵיךְ אֶשָּׂא פָנַי
  choice: Kisha ningewezaje ... kumtazama ... usoni?
  rationale: Nahau ya Kiebrania, kihalisi ‘kuinua uso wangu,’ inaeleza uwezo wa kukabiliana na mtu bila aibu. ‘Kumtazama ... usoni’ ni nahau ya Kiswahili inayowasilisha maana hiyo kwa njia ya kawaida huku ikidumisha picha ya uso.
- source_word: אֶל יוֹאָב אָחִיךָ
  choice: Yoabu ndugu yako
  rationale: אֶל humtaja mtu ambaye Abneri angepaswa kukabiliana naye; mpangilio huu ni wa asili ndani ya usemi ‘kumtazama ... usoni.’
- source_word: עֲשָׂהאֵל / אַבְנֵר / יוֹאָב
  choice: Asaheli / Abneri / Yoabu
  rationale: Majina yameandikwa kwa maumbo yaliyozoeleka katika tafsiri za Biblia za Kiswahili na yanayolingana na mfumo wa sauti wa Kiswahili.
