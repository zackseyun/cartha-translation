- from: Abneri akamwambia Asaheli tena, “Acha kunifuata. Kwa nini nikuangushe chini kwa kukupiga? Kisha ningewezaje kumtazama Yoabu ndugu yako usoni?”
  to: Abneri akamwambia Asaheli tena, “Geuka, acha kunifuata. Kwa nini nikupige na kukuangusha chini? Basi ningewezaje kumtazama Yoabu, ndugu yako, usoni?”
  rationale: The revision restores the explicit command to turn aside while retaining the contextual sense of ceasing pursuit. It also renders the strike-to-the-ground expression in idiomatic Kiswahili without making death explicit, and preserves the Hebrew face idiom through the natural expression ‘kumtazama ... usoni.’
