base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/005.yaml
  text: Then David sent messengers to the men of Jabesh-gilead and said to them[a], “Blessed are you by Yahweh, because you have shown this kindness to your lord, to Saul[b], and have buried him.”
translation:
  language: sw
  text: Kisha Daudi akatuma wajumbe kwa wanaume wa Yabeshi-Gileadi na kuwaambia, “Mbarikiwe na Yahwe[a], kwa sababu mmemfanyia bwana wenu, Sauli, fadhili[b] hii na mmemzika.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mmebarikiwa na Yahwe.”
    reason: Kauli ya Kiebrania ni fomula ya baraka; inaweza kutafsiriwa pia kama kauli ya hali ya kubarikiwa.
  - marker: b
    text: 'Kiebrania: hesed; mara nyingi humaanisha fadhili, uaminifu, au upendo mwaminifu.'
    reason: Neno lina wigo mpana kuliko “fadhili” pekee na hapa linahusu wema wenye uaminifu ulioonyeshwa kwa Sauli.
lexical_decisions:
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika simulizi hili neno linamaanisha watu waliotumwa na Daudi, si malaika.
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: wanaume wa Yabeshi-Gileadi
  rationale: Neno la Kiebrania ni la jinsia ya kiume na katika muktadha linawarejelea wanaume wa mji huo.
- source_word: בְּרֻכִים אַתֶּם לַיהוָה
  choice: Mmebarikiwa na Yahwe
  rationale: Hii inaakisi moja kwa moja hali inayoelezwa na kauli tendwa ya Kiebrania, huku tanbihi ikihifadhi uwezekano wa kuielewa kama tamko la baraka.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limetoholewa badala ya kubadilishwa na cheo.
- source_word: חֶסֶד
  choice: fadhili
  rationale: Hapa neno linaonyesha tendo halisi la wema wenye uaminifu kwa Sauli; “fadhili” ni la kawaida na lenye hadhi katika Kiswahili.
- source_word: אֲדֹנֵיכֶם
  choice: bwana wenu
  rationale: Linamtaja Sauli kama mtawala wao na linahifadhi maana ya heshima na mamlaka.
- source_word: עִם שָׁאוּל
  choice: kwa Sauli
  rationale: Ingawa kihusishi kinaweza kuwa “pamoja na,” katika muundo huu maana ya kawaida ni fadhili iliyotendwa kwa Sauli; katika sentensi ya Kiswahili Sauli amewekwa kama kibainishi cha “bwana wenu.”
- source_word: וַתִּקְבְּרוּ אֹתוֹ
  choice: na mkamzika
  rationale: Muundo huu unahifadhi tendo lililokamilika la kumzika Sauli na uhusiano wake wa mfululizo na tendo la fadhili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la Mungu moja kwa moja; “Yahwe” huhifadhi jina hilo badala ya kuliwakilisha kwa cheo.
- issue: Nguvu ya kauli בְּרֻכִים אַתֶּם לַיהוָה
  choice: Mmebarikiwa na Yahwe
  alternative: Yahwe awabariki
  rationale: Kauli tendwa ya Kiebrania inaeleza hali ya kubarikiwa, lakini fomula hiyo inaweza pia kusikika kama tamko la baraka; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa urahisi. Muundo “bwana wenu, Sauli” unamhifadhi Sauli kama kibainishi cha bwana anayerejelewa.
