  text: Joab and Abishai pursued Abner[a], and the sun went down; and they came as far as the hill of Ammah[b], which is opposite Giah on the way to the wilderness of Gibeon.
translation:
  language: sw
  text: Yoabu na Abishai wakamfuata Abneri; jua likazama, nao wakafika mpaka kilima cha Ama, kilicho mkabala na Gia[a], kwenye njia ya kuelekea nyika ya Gibeoni[b].
