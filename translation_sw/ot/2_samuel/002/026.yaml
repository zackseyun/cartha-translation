  - severity: low
    issue: “Utaendelea kuteketeza milele” ni nzito kidogo na hupunguza sitiari ya ‘kula.’
    rationale: “Milele” tayari hueleza mwendelezo usio na mwisho, na “kumeza” huhifadhi kwa karibu zaidi uhuishaji wa upanga katika chanzo.
  - severity: low
    issue: “Mwisho wake utakuwa mchungu” huacha mrejeo wa “wake” ukiwa haueleweki kabisa.
    rationale: Kiebrania hueleza matokeo yatakayokuwa machungu baadaye. Usemi usio na kiwakilishi hutoa maana hiyo wazi bila kuongeza mtendaji.
