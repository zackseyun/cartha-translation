base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/026.yaml
  text: Then Abner called to Joab and said[a], “Must the sword devour forever? Do you not know that it will be bitter in the end? How long will it be before you tell the people to turn back from following their brothers?”
translation:
  language: sw
  text: Ndipo Abneri akamwita Yoabu na kusema, “Je, upanga utameza milele? Je, hujui kwamba mwishowe kutakuwa na uchungu? Utakawia mpaka lini kuwaambia watu waache kuwafuatilia ndugu zao[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wageuke waache kuwafuata ndugu zao.”
    reason: Hii hufuata kwa karibu zaidi wazo la Kiebrania la kurudi au kugeuka kutoka nyuma ya ndugu zao, huku tafsiri kuu ikieleza maana yake katika muktadha wa vita.
lexical_decisions:
- source_word: הֲלָנֶצַח
  choice: milele
  rationale: Neno hili linaanzisha swali la balagha kuhusu kuendelea bila mwisho; “milele” ni tafsiri fupi na ya kawaida katika Kiswahili.
- source_word: תֹּאכַל חֶרֶב
  choice: upanga utaendelea kuteketeza
  rationale: Kiebrania kinaufanya upanga kuwa mtendaji na kihalisi husema kwamba utakula. “Kuteketeza” huhifadhi taswira ya uharibifu unaoendelea bila kutumia usemi usio wa kawaida sana wa “upanga kula” katika Kiswahili.
- source_word: מָרָה
  choice: mchungu
  rationale: “Mchungu” huhifadhi sitiari ya Kiebrania kuhusu matokeo yenye uchungu ya mapigano hayo.
- source_word: בָּאַחֲרוֹנָה
  choice: mwisho wake
  rationale: Usemi huu unaelekeza kwenye matokeo ya mwisho; “mwisho wake” ni wa asili katika muktadha huu huku kiwakilishi kikirejelea hali hiyo ya mapigano.
- source_word: וְעַד מָתַי
  choice: Utakawia mpaka lini
  rationale: Swali linamkabili Yoabu kuhusu kuchelewa kwake kuchukua hatua; usemi huu ni wa kawaida na huhifadhi nguvu ya swali.
- source_word: לֹא תֹאמַר לָעָם
  choice: kuwaambia watu
  rationale: אמר hapa ina maana ya kuwaambia watu wafanye jambo. “Kuwaambia” ni ya asili na haiongezi wazo la amri rasmi lisilolazimishwa na neno lenyewe.
- source_word: לָשׁוּב מֵאַחֲרֵי
  choice: waache kuwafuatilia
  rationale: Katika muktadha wa vita, kurudi kutoka nyuma ya mtu ni kuacha kumfuatilia au kumkimbiza. Tafsiri hii inaeleza wazi kusitisha harakati za kuwafuata.
- source_word: אֲחֵיהֶם
  choice: ndugu zao
  rationale: Huhifadhi lugha ya kindugu ya Kiebrania na uzito wa kihisia wa Waisraeli kupigana na watu wa jamii yao wenyewe.
