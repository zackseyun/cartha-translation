  text: Abner turned behind him and said[a], “Are you Asahel?” And he said, “I am.”
translation:
  language: sw
  text: Abneri akageuka nyuma yake, akasema, “Je, ni wewe Asaheli?” Naye akasema, “Ni mimi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן
  choice: akageuka
  rationale: Kitenzi פנה kwa kawaida humaanisha kugeuka; hapa kinaonyesha tendo la Abneri katikati ya harakati za kumfuatilia.
- source_word: אַחֲרָיו
  choice: nyuma
  rationale: Kirai hiki kinaelekeza upande wa nyuma yake. ‘Akageuka nyuma’ ni Kiswahili cha kawaida kinachohifadhi maana ya mahali bila kuongeza wazo finyu la kutazama tu.
- source_word: הֲאַתָּה זֶה
  choice: Je, ni wewe
  rationale: Muundo wa Kiebrania ni swali la kumtambua mtu. ‘Je, ni wewe Asaheli?’ ni wa kawaida katika Kiswahili na huhifadhi kusudi hilo bila kutafsiri kiashiria זֶה kwa namna isiyo ya kawaida.
- source_word: עֲשָׂהאֵל
  choice: Asaheli
  rationale: Jina limetoholewa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: אָנֹכִי
  choice: Ni mimi
  rationale: Kiwakilishi huru kinatumika kama jibu kamili la kujitambulisha; ‘Ni mimi’ ni jibu la kawaida na sahihi katika Kiswahili.
