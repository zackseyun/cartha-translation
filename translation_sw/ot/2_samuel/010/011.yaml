  text: He said[a], “If Aram is too strong for me, then you shall help me; but if the Ammonites are too strong for you[b], then I will go to help you.”
translation:
  language: sw
  text: Akasema, “Ikiwa Aramu itanizidi nguvu[a], utanisaidia[b]; lakini ikiwa Waamoni watakuzidi nguvu[a], nitakwenda kukuokoa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Aramu akinipita nguvu ... Waamoni wakiwapita nguvu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “utakuwa kwangu kwa ajili ya ukombozi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּחֱזַק / יֶחֱזְקוּ
  choice: itanizidi nguvu / watakuzidi nguvu
  rationale: Katika muktadha wa vita, חזק pamoja na מן humaanisha kuwa na nguvu kuliko mwingine au kumshinda. ‘Kuzidi nguvu’ ni usemi wa kawaida wa Kiswahili unaohifadhi wazo la ulinganisho bila kuamua kwamba ushindi tayari umepatikana.
- source_word: אֲרָם
  choice: Aramu
  rationale: Jina la taifa limeandikwa kwa namna ya kawaida ya Kiswahili badala ya kubadilishwa kuwa jina la baadaye la kijiografia, ‘Siria.’
- source_word: בְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Huu ndio usemi wa kawaida wa Kiswahili kwa kundi la kikabila linaloitwa kihalisi ‘wana wa Amoni.’
- source_word: וְהָיִתָה לִּי לִישׁוּעָה
  choice: utanisaidia
  rationale: Ingawa muundo wa Kiebrania ni karibu ‘utakuwa kwangu kwa ajili ya ukombozi,’ katika mpango huu wa kivita unamaanisha kumpa mwenzake msaada wa kumwokoa. ‘Utanisaidia’ ni wa asili na unaeleweka bila kuleta maana ya kiistilahi ya wokovu wa kiroho.
- source_word: וְהָלַכְתִּי לְהוֹשִׁיעַ לָךְ
  choice: nitakwenda kukuokoa
  rationale: הלך pamoja na kitenzi-jina huonyesha kwenda kwa kusudi fulani, na הושיע humaanisha kuokoa au kukomboa kutoka hatarini. ‘Nitakwenda kukuokoa’ huhifadhi kwa uwazi zaidi mwendo na kusudi vilivyomo katika Kiebrania.
