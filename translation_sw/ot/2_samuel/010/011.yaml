translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. ‘Aramu’ limetunzwa kama jina la taifa; ‘Waamoni’ ni jina la kawaida la watu hao. Sentensi inaonyesha mpango wa kusaidiana vitani na haiongezi ufafanuzi wa kidhehebu.
