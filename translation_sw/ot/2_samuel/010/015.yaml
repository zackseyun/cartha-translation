  text: Waaramu walipoona kwamba walikuwa wameshindwa mbele ya Israeli, walikusanyika pamoja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: walipoona
  rationale: Muundo wa ki- unaoendeleza simulizi umeonyeshwa kwa kishazi cha wakati, ambacho huunganisha kwa kawaida kuona kwao na hatua iliyofuata.
- source_word: אֲרָם
  choice: Waaramu
  rationale: Ingawa jina la Kiebrania liko katika umoja, hapa linatumika kwa maana ya pamoja kuwataja Waaramu; Kiswahili cha kawaida hutumia jina la watu katika wingi.
- source_word: כִּי
  choice: kwamba
  rationale: Neno hili linaanzisha yaliyotambuliwa na Waaramu, si sababu ya tendo.
- source_word: נִגַּף
  choice: walikuwa wameshindwa
  rationale: Nifali hapa inaonyesha kushindwa vitani; usemi huu ni wazi na hauongezi namna mahususi ya kushindwa.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Huhifadhi taswira ya chanzo katika muktadha wa mapambano, kwa maana ya kushindwa mbele ya nguvu za Israeli.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina maalumu limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: וַיֵּאָסְפוּ
  choice: walikusanyika
  rationale: Nifali ya אָסף humaanisha kujikusanya au kukusanyika; uchaguzi huu ni wa kawaida na hauingizi wazo la kijeshi la kujipanga upya lisilotajwa wazi.
- source_word: יָחַד
  choice: pamoja
  rationale: Kielezi hiki kinamaanisha kuwa walikusanyika kwa pamoja.
