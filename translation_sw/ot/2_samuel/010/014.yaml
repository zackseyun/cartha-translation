base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/014.yaml
  text: And when the sons of Ammon saw that Aram had fled[a], they fled before Abishai and entered the city[c][b]. Then Joab returned from against the sons of Ammon and came to Jerusalem.
translation:
  language: sw
  text: Wana wa Amoni[a] walipoona kwamba Aramu[b] walikuwa wamekimbia, wakamkimbia Abishai na kuingia mjini. Ndipo Yoabu akajiondoa kutoka kupigana na wana wa Amoni[c], akaenda Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Waamoni.
    reason: lexical_alternative
  - marker: b
    text: Au, “Waaramu”; Kiebrania hutumia jina la taifa “Aramu” kwa maana ya watu wake.
    reason: lexical_alternative
  - marker: c
    text: Kwa maana, Yoabu alijiondoa katika mapigano dhidi ya wana wa Amoni.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: Wana wa Amoni
  rationale: Huhifadhi usemi halisi wa Kiebrania wa undugu, huku ukibaki wazi na wenye kueleweka katika Kiswahili. Maana yake ya kimuktadha ni Waamoni.
- source_word: רָאוּ כִּי
  choice: walipoona kwamba
  rationale: Huonyesha kwamba walitambua hali iliyokuwa imetokea, bila kuondoa kitenzi cha kuona kilicho katika Kiebrania.
- source_word: נָס אֲרָם
  choice: Aramu walikuwa wamekimbia
  rationale: Wakati timilifu huonyesha kwamba kukimbia kwa Aramu kulitangulia mwitikio wa Waamoni. Jina Aramu limehifadhiwa kama jina la taifa lenye maana ya pamoja.
- source_word: וַיָּנֻסוּ מִפְּנֵי אֲבִישַׁי
  choice: wakamkimbia Abishai
  rationale: Ni Kiswahili cha kawaida kinachoeleza kukimbia kutoka mbele au uweponi mwa Abishai katika mazingira ya vita.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: na kuingia mjini
  rationale: Hutoa kwa Kiswahili asilia mwendo wa kuingia ndani ya mji wenye ulinzi; Kiebrania hutaja ‘mji ule’ bila kulitaja jina lake.
- source_word: וַיָּשָׁב יוֹאָב מֵעַל בְּנֵי עַמּוֹן
  choice: Ndipo Yoabu akaacha kupigana na wana wa Amoni
  rationale: Katika muktadha wa kijeshi, usemi wa Kiebrania una maana ya Yoabu kujiondoa katika mapigano dhidi yao; tafsiri hii huwasilisha maana hiyo kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: akarudi Yerusalemu
  rationale: Kufika Yerusalemu kunafuata kitendo cha Yoabu kugeuka na kuondoka vitani; ‘akarudi’ huunganisha mwendo huo kwa kawaida katika Kiswahili, ingawa kitenzi cha Kiebrania chenyewe ni ‘akaja/akaingia.’
