  text: And the rest of the people he put under the command of Abishai his brother[c][b][a], and he drew them up to meet the sons of Ammon.
translation:
  language: sw
  text: Watu waliobaki aliwaweka chini ya uongozi wa Abishai, ndugu yake,[a] kisha akawapanga katika safu ya vita ili kuwakabili Waamoni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “akawatia mkononi mwa Abishai,” nahau yenye maana ya kuwakabidhi chini ya mamlaka yake.'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wana wa Amoni,” yaani, Waamoni.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: watu waliobaki
  rationale: Huhifadhi maana ya msingi ya ‘watu waliosalia’; muktadha wa kijeshi unaonyesha kuwa ni sehemu iliyobaki ya jeshi.
- source_word: נָתַן בְּיַד
  choice: akawaweka chini ya uongozi wa
  rationale: Ni nahau yenye maana ya kuwakabidhi watu chini ya mamlaka au amri ya mtu; tafsiri hii inaeleza kwa kawaida jukumu la Abishai katika muktadha wa kijeshi.
- source_word: אַבְשַׁי
  choice: Abishai
  rationale: Jina la mtu limetoholewa kwa umbo linalotumiwa kwa kawaida katika Kiswahili cha Biblia.
- source_word: אָחִיו
  choice: ndugu yake
  rationale: Uhusiano wa kifamilia umetajwa wazi katika Kiebrania na umehifadhiwa bila kuongeza ufafanuzi.
- source_word: וַיַּעֲרֹךְ
  choice: akawapanga katika safu ya vita
  rationale: Katika muktadha wa kijeshi, kitenzi hiki humaanisha kupanga askari katika mpangilio wa kupigana.
- source_word: לִקְרַאת
  choice: ili wakabiliane na
  rationale: Ingawa maana ya msingi ni kuelekea kukutana na, katika muktadha huu mkutano ni wa kivita; ‘kukabiliana na’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: בְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Ni namna ya asili na iliyo wazi ya Kiswahili kwa watu wa Amoni; maana halisi ya Kiebrania imeonyeshwa katika tanbihi.
