base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, just as his father showed kindness to me.” So David sent by the hand of his servants to comfort him concerning his father, and David’s servants came into the land of the Ammonites.
translation:
  language: sw
  text: Daudi akasema, “Nitamtendea Hanuni mwana wa Nahashi wema, kama vile baba yake alivyonitendea wema.” Basi Daudi akawatuma watumishi wake wamfariji kuhusu baba yake.[a] Watumishi wa Daudi wakafika katika nchi ya Waamoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kumpa pole kwa kifo cha baba yake. Kauli ya Kiebrania inaelekea kumaanisha kutoa rambirambi kwa sababu ya kifo cha baba yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: wema
  rationale: Katika muktadha huu wa uhusiano wa kidiplomasia, neno hili linaonyesha tendo la fadhili na uaminifu kati ya wahusika; “wema” ni la kawaida na linafaa katika sehemu zote mbili za mstari.
- source_word: חָנוּן בֶּן נָחָשׁ
  choice: Hanuni mwana wa Nahashi
  rationale: Majina yameandikwa kwa namna inayopatana na matamshi ya Kiswahili, huku uhusiano wa kifamilia ukihifadhiwa wazi.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Inaonyesha wazi ulinganisho na ulipaji wa wema aliokuwa ameonyeshwa Daudi.
- source_word: עָשָׂה ... חֶסֶד
  choice: alitendea ... wema
  rationale: Hii ni kauli ya asili katika Kiswahili inayohifadhi muundo na maana ya kufanya au kuonyesha wema.
- source_word: לְנַחֲמוֹ
  choice: wamfariji
  rationale: Kitenzi kinamaanisha kumpa faraja mtu aliyepatwa na msiba, na “kumfariji” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אֶל אָבִיו
  choice: kuhusu baba yake
  rationale: Inahifadhi uhusiano mpana wa kirai cha Kiebrania bila kuingiza kifo moja kwa moja katika matini kuu, ingawa muktadha unaonyesha kwamba kilikuwa chanzo cha faraja hiyo.
- source_word: בְּיַד עֲבָדָיו
  choice: akawatuma watumishi wake
  rationale: Nahau ya Kiebrania ya kutenda “kwa mkono wa” inaonyesha uwakala; Kiswahili cha kawaida huwasilisha jambo hilo kwa kusema kwamba Daudi aliwatuma watumishi wake.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: nchi ya Waamoni
  rationale: “Waamoni” ni jina la kawaida la watu hao kwa Kiswahili na linawasilisha vizuri ethnonimu ya Kiebrania “wana wa Amoni.”
