base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/009.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose from all the choice men of Israel and arrayed them to meet Aram.
translation:
  language: sw
  text: Yoabu alipoona kwamba safu ya vita ilikuwa imewekwa dhidi yake mbele na nyuma, akachagua kutoka miongoni mwa askari wote bora wa Israeli[a], akawapanga ili kukabiliana na Aramu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “akachagua kutoka miongoni mwa wanaume wote bora wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: “Aramu” hapa inamaanisha majeshi ya Waaramu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: alipoona
  rationale: Huhifadhi maana ya msingi ya kuona huku muktadha ukionyesha kwamba Yoabu alitambua hali ya kivita.
- source_word: פְּנֵי הַמִּלְחָמָה
  choice: safu ya vita
  rationale: Nahau ya Kiebrania, kihalisi ‘uso wa vita,’ hapa inaonyesha upande au safu ya mapambano iliyomkabili Yoabu.
- source_word: הָיְתָה אֵלָיו
  choice: ilikuwa imewekwa dhidi yake
  rationale: Hueleza mpangilio wa kijeshi uliomkabili Yoabu bila kuifanya sentensi kuwa maelezo mapana kuliko chanzo.
- source_word: מִפָּנִים וּמֵאָחוֹר
  choice: mbele na nyuma
  rationale: Ni usemi wa kawaida na wazi unaohifadhi tofauti ya mahali katika Kiebrania.
- source_word: וַיִּבְחַר מִכֹּל בְּחוּרֵי בְיִשְׂרָאֵל
  choice: akachagua kutoka miongoni mwa askari wote bora wa Israeli
  rationale: בְּחוּרֵי humaanisha wanaume waliochaguliwa au askari bora; מִכֹּל inahifadhiwa kwa ‘kutoka miongoni mwa ... wote.’ Neno ‘askari’ linafafanuliwa na muktadha wa vita.
- source_word: וַיַּעֲרֹךְ
  choice: akawapanga
  rationale: Katika muktadha wa kijeshi, kitenzi hiki humaanisha kupanga vikosi kwa ajili ya mapambano.
- source_word: לִקְרַאת אֲרָם
  choice: ili kukabiliana na Aramu
  rationale: לִקְרַאת hapa ina maana ya kwenda kukutana au kukabiliana na adui vitani; ‘kukabiliana na’ ni Kiswahili cha kawaida katika muktadha huu.
- source_word: אֲרָם
  choice: Aramu
  rationale: Jina la kale linahifadhiwa badala ya kubadilishwa kuwa jina la eneo la baadaye; hapa linawakilisha majeshi ya Waaramu.
