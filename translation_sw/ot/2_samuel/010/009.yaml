translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. ‘Safu ya vita’ na ‘akawapanga’ huhifadhi taswira ya kijeshi; ‘askari wote bora’ ni ya asili zaidi kwa msomaji wa sasa huku tanbihi ikihifadhi muundo rasmi zaidi.
