base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/008.yaml
  text: Then the sons of Ammon came out and drew up for battle at the entrance of the gate[b][a], while Aram of Zobah and Rehob and the men of Tob and Maacah were by themselves in the field.
translation:
  language: sw
  text: Kisha Waamoni[a] wakatoka, wakajipanga kwa ajili ya vita kwenye mwingilio wa lango, huku Waaramu wa Soba na Rehobu, pamoja na watu wa Tobu[b] na Maaka, wakiwa peke yao uwandani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, ‘wana wa Amoni.’
    reason: lexical_alternative
  - marker: b
    text: Au ‘Ish-tobu.’ Maneno ya Kiebrania אִישׁ טוֹב yanaweza kutafsiriwa ‘watu wa Tobu’ au kueleweka kuwa jina la mahali, ‘Ish-tobu.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: wakatoka
  rationale: Kitenzi יצא katika simulizi kina maana ya kutoka; hapa kinaeleza Waamoni wakitoka kuelekea mahali pa mapambano.
- source_word: בְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Ingawa Kiebrania kinasema kihalisi ‘wana wa Amoni,’ ‘Waamoni’ ndiyo ethnonimu ya kawaida na ya asili katika Kiswahili.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: wakajipanga kwa ajili ya vita
  rationale: Muunganiko wa ערך na מלחמה unaonyesha kupanga vikosi katika mpangilio wa mapambano.
- source_word: פֶּתַח הַשָּׁעַר
  choice: kwenye mwingilio wa lango
  rationale: פתח ni nafasi ya kuingilia au mwingilio; usemi huu unahifadhi mahali waliposimama karibu na lango.
- source_word: וַאֲרַם צוֹבָא
  choice: huku Waaramu wa Soba
  rationale: אֲרַם inaweza kutaja Aramu au Waaramu; hapa vikosi vya watu vinaorodheshwa, hivyo ‘Waaramu wa Soba’ ni wazi na ya asili.
- source_word: וּרְחוֹב
  choice: na Rehobu
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka katika Kiswahili.
- source_word: וְאִישׁ טוֹב
  choice: pamoja na watu wa Tobu
  rationale: Maneno yanaweza kueleweka kuwa watu kutoka Tobu, huku uwezekano wa kuyasoma kama jina la mahali ‘Ish-tobu’ ukihifadhiwa katika tanbihi.
- source_word: וּמַעֲכָה
  choice: na Maaka
  rationale: Jina la mahali limetoholewa kwa Kiswahili.
- source_word: לְבַדָּם
  choice: wakiwa peke yao
  rationale: Usemi huu unaonyesha kuwa vikosi washirika vilikuwa vimetengwa na Waamoni.
- source_word: בַּשָּׂדֶה
  choice: uwandani
  rationale: שָׂדֶה hapa ni eneo la wazi nje ya lango; ‘uwandani’ linaonyesha mazingira ya mapambano bila kuongeza maelezo yasiyo katika matini.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Waamoni’ limetumiwa katika matini kuu kwa ufasaha, huku muundo halisi wa Kiebrania ukiwekwa katika tanbihi. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
