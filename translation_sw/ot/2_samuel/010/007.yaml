translation:
  language: sw
  text: Daudi aliposikia, akamtuma Yoabu pamoja na jeshi lote la mashujaa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jeshi lote, yaani mashujaa.” Kiebrania kinaweza kueleweka kwamba neno “mashujaa” linafafanua “jeshi,” au kwamba jeshi linabainishwa kuwa la mashujaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Daudi aliposikia
  rationale: Kitenzi שׁמע katika Qal humaanisha “kusikia.” Kiambishi “-po-” kinaonyesha kwa kawaida na kwa ufasaha mfuatano wa matukio unaowasilishwa na vitenzi vya wayyiqtol, bila kuongeza kitu mahususi alichosikia ambacho hakikutajwa katika mstari huu.
- source_word: וַיִּשְׁלַח
  choice: akamtuma
  rationale: Kitenzi שׁלח katika Qal kwa kawaida humaanisha “kutuma.” Umbo “akamtuma” linaonyesha kwamba Yoabu ndiye aliyetumwa na linaendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: אֶת יוֹאָב
  choice: Yoabu
  rationale: Kihisishi cha kuonyesha yambwa אֶת hakitafsiriwi; jina יוֹאָב limetoholewa kuwa “Yoabu” kwa matumizi ya kawaida ya Kiswahili.
- source_word: וְאֵת כָּל הַצָּבָא
  choice: pamoja na jeshi lote
  rationale: צָבָא hapa ni kikosi cha kijeshi, hivyo “jeshi” ni neno la wazi na la sasa. כָּל imetafsiriwa “lote,” na “pamoja na” linaonyesha kwamba Yoabu na jeshi ndio waliotumwa.
- source_word: הַגִּבֹּרִים
  choice: la mashujaa
  rationale: גִּבֹּרִים inaweza kumaanisha mashujaa au wapiganaji hodari. “Mashujaa” huhifadhi uzito wa neno bila kuamua kwamba lazima walikuwa kikosi maalumu cha askari wateule.
