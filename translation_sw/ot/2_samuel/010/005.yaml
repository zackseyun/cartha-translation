base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/005.yaml
  text: When they told David[a], he sent to meet them, for the men were greatly humiliated. And the king said, “Stay at Jericho until your beards have grown[b], and then return.”
translation:
  language: sw
  text: Walipomjulisha Daudi, akatuma kuwalaki[a], kwa sababu watu hao walikuwa wameaibishwa sana.[b] Mfalme akasema, “Kaeni Yeriko mpaka ndevu zenu zitakapoota, kisha mrudi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “akatuma kuwalaki.” Maandishi hayasemi wazi ni nani aliyetumwa.'
    reason: lexical_alternative
  - marker: b
    text: Au “walikuwa wamefedheheka sana” au “walikuwa na aibu kubwa.” Neno la Kiebrania linasisitiza kuaibishwa au kufedheheshwa, hasa mbele ya watu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: Walipomjulisha Daudi
  rationale: Kitenzi cha Kiebrania kina kiima kisichotajwa. Muundo huu wa Kiswahili huhifadhi maana ya ‘walimjulisha Daudi’ bila kubuni utambulisho wa watoa habari.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: akatuma watu waende kuwalaki
  rationale: Kiebrania kinasema kihalisi ‘akatuma kuwalaki.’ Kiswahili cha kawaida huhitaji kueleza waliotumwa; ‘watu’ ni nyongeza ya lazima kimawasiliano, bila kuwataja kwa usahihi zaidi kuwa wajumbe.
- source_word: נִכְלָמִים מְאֹד
  choice: walikuwa wameaibishwa sana
  rationale: Muundo wa kutendwa unahifadhi wazo la kuaibishwa au kufedheheshwa hadharani, na ‘sana’ huwakilisha nguvu ya מְאֹד.
- source_word: שְׁבוּ בִירֵחוֹ
  choice: Kaeni Yeriko
  rationale: Katika muktadha huu ישׁב humaanisha kukaa au kubaki mahali kwa muda; ‘Kaeni Yeriko’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: עַד יְצַמַּח זְקַנְכֶם
  choice: mpaka ndevu zenu zitakapoota
  rationale: צמח ni kuota au kukua. ‘Zitakapoota’ hudumisha taswira ya ndevu kuanza na kuendelea kukua bila kuongeza wazi neno ‘tena,’ ambalo halipo katika mstari huu.
- source_word: וְשַׁבְתֶּם
  choice: kisha mrudi
  rationale: שׁוב humaanisha kurudi; ‘kisha’ huonyesha kwa kawaida mpangilio wa wakati unaodokezwa baada ya ‘mpaka.’
