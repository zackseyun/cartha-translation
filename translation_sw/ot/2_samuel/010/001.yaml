lexical_decisions:
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: mfalme wa Waamoni
  rationale: Kauli ya Kiebrania, kihalisi ‘mfalme wa wana wa Amoni,’ kwa kawaida humaanisha mfalme wa watu wa Amoni; ‘Waamoni’ ni Kiswahili cha kawaida na cha asili.
- source_word: וַיִּמְלֹךְ
  choice: akawa mfalme
  rationale: Kitenzi hiki humaanisha kutawala au kuwa mfalme. Katika muktadha wa kurithi kiti baada ya kifo cha baba yake, ‘akawa mfalme’ huwasilisha kwa uwazi kuingia kwake katika ufalme bila kuongeza habari.
- source_word: תַּחְתָּיו
  choice: mahali pake
  rationale: Nahau hii ina maana ya kuchukua nafasi ya mtu mwingine; ‘mahali pake’ huhifadhi maana hiyo kwa Kiswahili cha kawaida.
