base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/019.yaml
  text: When all the kings who were servants of Hadadezer saw that they had been defeated before Israel, they made peace with Israel and served them. So Aram was afraid to save the sons of Ammon anymore.
translation:
  language: sw
  text: Wafalme wote waliokuwa watumishi wa Hadadezeri walipoona kwamba walikuwa wameshindwa mbele ya Israeli, walifanya amani na Israeli na kuwatumikia. Basi Waaramu wakaogopa kuwaokoa tena Waamoni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִגְּפוּ לִפְנֵי יִשְׂרָאֵל
  choice: walikuwa wameshindwa mbele ya Israeli
  rationale: Nifali ya נגף hapa inaonyesha kushindwa vitani; “mbele ya Israeli” huhifadhi mtindo na mtazamo wa maandishi ya Kiebrania.
- source_word: וַיַּשְׁלִמוּ אֶת־יִשְׂרָאֵל
  choice: walifanya amani na Israeli
  rationale: Kitenzi שלם pamoja na את katika muktadha huu humaanisha kufanya mapatano ya amani, si kukamilisha jambo.
- source_word: וַיַּעַבְדוּם
  choice: kuwatumikia
  rationale: Kiambishi cha wingi kinarejelea Israeli kama watu; Kiswahili cha kawaida hutumia “wa-” kwa taifa likitazamwa kama jamii ya watu.
- source_word: אֲרָם
  choice: Waaramu
  rationale: Ingawa umbo la Kiebrania ni jina la nchi au jamii, kitenzi cha wingi na muktadha vinaelekeza kwa watu wa Aramu.
- source_word: לְהוֹשִׁיעַ
  choice: kuwasaidia
  rationale: Hifili ya ישׁע kimsingi ni kuokoa au kukomboa, lakini katika muktadha wa msaada wa kijeshi kwa Waamoni, “kuwasaidia” ni Kiswahili cha asili na hudumisha maana ya kuwajia kuwaokoa.
- source_word: בְּנֵי עַמּוֹן
  choice: Waamoni
  rationale: Neno kwa neno ni “wana wa Amoni,” lakini ni jina la kawaida la watu wa Amoni; “Waamoni” ni wazi na la asili katika Kiswahili.
