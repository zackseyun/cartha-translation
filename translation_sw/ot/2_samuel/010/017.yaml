  text: וַ/יֻּגַּ֣ד לְ/דָוִ֗ד וַ/יֶּאֱסֹ֤ף אֶת כָּל יִשְׂרָאֵל֙ וַ/יַּעֲבֹ֣ר אֶת הַ/יַּרְדֵּ֔ן וַ/יָּבֹ֖א חֵלָ֑אמָ/ה וַ/יַּעַרְכ֤וּ אֲרָם֙ לִ/קְרַ֣את דָּוִ֔ד וַ/יִּלָּחֲמ֖וּ עִמּֽ/וֹס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, and came to Helam. Then Aram drew up in battle formation to meet David and fought with him.
translation:
  language: sw
  text: Daudi alipopewa habari hiyo, aliwakusanya Israeli wote, akavuka Yordani, akafika Helamu. Kisha Waaramu wakajipanga kwa vita ili kukutana na Daudi, wakapigana naye.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִד
  choice: Daudi alipopewa habari hiyo
  rationale: Huhifadhi hali ya kutajwa bila kumtaja mtoa habari, huku kiunganishi cha wakati kikitoa mtiririko wa kawaida wa simulizi katika Kiswahili.
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: aliwakusanya Israeli wote
  rationale: Neno אָסַף lina maana ya kukusanya; tafsiri hii inadumisha usemi mpana wa Kiebrania bila kuongeza neno 'jeshi'.
- source_word: וַיַּעֲבֹר אֶת הַיַּרְדֵּן
  choice: akavuka Yordani
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kuvuka mto unaoitwa Yordani.
- source_word: וַיָּבֹא חֵלָמָה
  choice: akafika Helamu
  rationale: He ya mwelekeo katika חֵלָמָה huonyesha mwendo kuelekea mahali; 'akafika Helamu' hueleza kuwasili kwa Kiswahili cha kawaida.
- source_word: וַיַּעַרְכוּ אֲרָם
  choice: Waaramu wakajipanga kwa vita
  rationale: Katika muktadha wa kijeshi, עָרַךְ humaanisha kupanga au kuweka vikosi tayari kwa mapigano. Kiswahili hutumia kwa kawaida jina la watu, 'Waaramu,' badala ya nchi kama kiima cha wingi.
- source_word: לִקְרַאת דָּוִד
  choice: ili kukutana na Daudi
  rationale: Huhifadhi maana ya msingi ya kuelekea kukutana naye; muktadha wa vita unaonyesha wazi kuwa mkutano huo ni wa uhasama.
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: wakapigana naye
  rationale: Kiswahili 'kupigana na' kwa kawaida humaanisha kupigana dhidi ya mtu, hivyo huhifadhi kwa ufasaha muundo wa Kiebrania wenye עִם bila utata mkubwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi vya mfululizo unaendeleza kasi ya simulizi la Kiebrania. Hakuna tanbihi iliyohitajika kwa sababu 'wakapigana naye' ni usemi wa kawaida usioashiria ushirika.
