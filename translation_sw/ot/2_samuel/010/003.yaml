  text: וַ/יֹּאמְרוּ֩ שָׂרֵ֨י בְנֵֽי עַמּ֜וֹן אֶל חָנ֣וּן אֲדֹֽנֵי/הֶ֗ם הַֽ/מְכַבֵּ֨ד דָּוִ֤ד אֶת אָבִ֨י/ךָ֙ בְּ/עֵינֶ֔י/ךָ כִּֽי שָׁלַ֥ח לְ/ךָ֖ מְנַֽחֲמִ֑ים הֲ֠/לוֹא בַּ/עֲב֞וּר חֲק֤וֹר אֶת הָ/עִיר֙ וּ/לְ/רַגְּלָ֣/הּ וּ/לְ/הָפְכָ֔/הּ שָׁלַ֥ח דָּוִ֛ד אֶת עֲבָדָ֖י/ו אֵלֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/003.yaml
  text: And the princes of the Ammonites said to Hanun their lord[a], “Is David honoring your father in your sight because he has sent comforters to you? Has not David sent his servants to you in order to search the city, to spy it out[c][b], and to overthrow it?”
translation:
  language: sw
  text: Wakuu wa Waamoni wakamwambia Hanuni, bwana wao, “Je, machoni pako Daudi anamheshimu baba yako kwa sababu amekutumia wafariji?[a] Je, Daudi hakuwatuma watumishi wake kwako kwa kusudi la kuuchunguza mji, kuupeleleza, na kuupindua?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wafariji” ni wajumbe waliotumwa kumpa Hanuni pole baada ya kifo cha baba yake.
    reason: cultural_note
  - marker: b
    text: Au, “kuuchunguza mji, kuupeleleza, na kuuangusha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי בְנֵי עַמּוֹן
  choice: Wakuu wa Waamoni
  rationale: ‘Wakuu’ huonyesha viongozi au maafisa wenye mamlaka katika mazingira ya kifalme bila kudai kwamba wote walikuwa wana wa mfalme.
- source_word: אֲדֹנֵיהֶם
  choice: bwana wao
  rationale: Hili ni jina la mamlaka ya kibinadamu linaloonyesha uhusiano wa Hanuni na wakuu wake, wala si jina la Mungu.
- source_word: הַמְכַבֵּד
  choice: anamheshimu
  rationale: Kitenzi hapa kinamaanisha kumwonyesha mtu heshima, si kumtukuza kwa maana ya kidini.
- source_word: בְּעֵינֶיךָ
  choice: machoni pako
  rationale: Neno hili linahifadhi sitiari ya Kiebrania na maana ya ‘kwa maoni yako’ huku likieleweka kwa Kiswahili.
- source_word: מְנַחֲמִים
  choice: wafariji
  rationale: Linataja watu waliotumwa kumpa Hanuni faraja baada ya kifo cha baba yake; umbo la nomino ya watu linahifadhi muundo wa chanzo.
- source_word: הֲלוֹא
  choice: Je, ... hakuwatuma
  rationale: Swali hasi la balagha linatarajia Hanuni akubaliane na tuhuma ya wakuu wake, bila msimulizi kuthibitisha tuhuma hiyo.
- source_word: חֲקוֹר אֶת הָעִיר
  choice: kuuchunguza mji
  rationale: ‘Kuuchunguza’ huwasilisha tendo la kupeleleza hali ya mji kwa makini na kulifautisha na kitenzi kinachofuata.
- source_word: וּלְרַגְּלָהּ
  choice: kuupeleleza
  rationale: Katika muktadha huu mzizi unamaanisha kupeleleza au kufanya ujasusi kuhusu mji.
- source_word: וּלְהָפְכָהּ
  choice: kuupindua
  rationale: ‘Kuupindua’ huhifadhi picha ya kuugeuza au kuuangusha mji na kusudi la uadui, bila kuifanya lazima imaanishe kuuangamiza kabisa.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Neno linawahusu watu wa Daudi waliotumwa kwa kazi ya kifalme; ‘watumishi’ ni tafsiri ya kawaida na inayofaa hapa.
theological_decisions:
- issue: Tuhuma ya kisiasa dhidi ya uthibitisho wa msimulizi
  choice: Kauli ya wakuu imetafsiriwa kama maswali ya balagha yanayoonyesha shaka yao.
  alternative: Kutafsiri sentensi ya pili kama taarifa ya hakika kwamba Daudi alituma wapelelezi.
  rationale: Maneno haya ni tuhuma ya washauri wa Hanuni, si uthibitisho wa msimulizi kwamba kusudi la Daudi lilikuwa la ujasusi au uvamizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaosomeka kwa urahisi. ‘Machoni pako’ huhifadhi nahau ya chanzo; ‘Wakuu’ na ‘bwana wao’ hudumisha mazingira ya kisiasa na kifalme. Alama zote za tanbihi zimewekwa katika matini kuu.
