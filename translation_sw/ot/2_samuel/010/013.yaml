  yaml_path: translation/ot/2_samuel/010/013.yaml
  text: Then Joab and the people who were with him advanced to battle against Aram[a], and they fled before him.
translation:
  language: sw
  text: Ndipo Yoabu na watu waliokuwa pamoja naye wakasonga mbele kupigana na Aramu[a], nao wakamkimbia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Aramu”; yaani, majeshi ya Waaramu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: wakasonga mbele
  rationale: Kitenzi נגשׁ kimsingi humaanisha kukaribia, lakini pamoja na לַמִּלְחָמָה katika muktadha wa kijeshi kinaonyesha kusonga mbele ili kuingia vitani. Tafsiri hii ni ya kawaida na huhifadhi maana ya kijeshi.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: na watu waliokuwa pamoja naye
  rationale: עָם ni ‘watu’; hapa ni kikosi cha Yoabu. Tafsiri hii inafuata kwa karibu maneno ya Kiebrania bila kuongeza neno maalumu zaidi kama ‘wanajeshi’.
- source_word: לַמִּלְחָמָה
  choice: kupigana
  rationale: Muundo huu unaonyesha kusudi au kuelekea kwenye mapigano. ‘Kupigana’ ni Kiswahili cha kawaida na huwasilisha kuingia vitani.
- source_word: בַּאֲרָם
  choice: na Aramu
  rationale: Baada ya kitenzi ‘kupigana,’ Kiswahili hutumia ‘na’ kumtaja mpinzani. ‘Aramu’ huhifadhi jina la pekee la Kiebrania, ingawa katika muktadha linamaanisha majeshi ya Waaramu.
- source_word: וַיָּנֻסוּ
  choice: nao wakamkimbia
  rationale: נוּס humaanisha kukimbia au kutoroka. ‘Wakamkimbia’ huonyesha wazi kwamba walikimbia kwa sababu ya Yoabu, bila kudokeza kurudi nyuma kwa utaratibu.
- source_word: מִפָּנָיו
  choice: wakamkimbia
  rationale: Nahau ya Kiebrania ‘kukimbia kutoka mbele yake’ imewasilishwa kwa Kiswahili cha kawaida kama ‘kumkimbia.’ Kiambishi cha umoja kinamrejelea Yoabu.
- source_word: יוֹאָב
  choice: Yoabu
  rationale: Jina la mtu limetoholewa kwa umbo linalotambulika na lililozoeleka katika Kiswahili cha Biblia.
