  to: Hadadezeri akatuma, akawaleta Waaramu waliokuwa ng’ambo ya Mto[a]. Nao wakafika Helamu, Shobaki[b], mkuu wa jeshi la Hadadezeri, akiwa mbele yao.[c]
  rationale: Marekebisho yanaondoa nyongeza ya ‘watu’ na wakala wao, yanahifadhi mpangilio wa matendo ya Hadadezeri katika chanzo, na yanarudisha usemi wa kijeshi usioamuliwa ‘akiwa mbele yao’ katika matini kuu. Tanbihi zinaendelea kutambua Frati, umbo mbadala la jina, na maana inayowezekana ya usemi huo.
