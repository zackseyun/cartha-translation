base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/016.yaml
  text: Hadadezer sent and brought out the Arameans who were beyond the River[a], and they came to Helam[c][b], with Shobak the commander of Hadadezer’s army before them.
translation:
  language: sw
  text: Hadadezeri akatuma, akawaleta Waaramu waliokuwa ng’ambo ya Mto[a]. Nao wakafika Helamu, Shobaki[b], mkuu wa jeshi la Hadadezeri, akiwa mbele yao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, ng’ambo ya Mto Frati.
    reason: cultural_note
  - marker: b
    text: Katika tafsiri nyingine jina hili huandikwa Shobaku.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema kihalisi, “akiwa mbele yao”; katika muktadha wa kijeshi, jambo hili linaweza kumaanisha alikuwa akiwaongoza au alikuwa mstari wa mbele.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma watu
  rationale: Kitenzi kina maana ya msingi ya ‘kutuma.’ Kuongeza ‘watu’ kwa kiasi kidogo hufanya uhusiano wake na kitenzi cha pili uwe wa kawaida katika Kiswahili bila kubainisha wajumbe ambao hawajatajwa katika Kiebrania.
- source_word: וַיֹּצֵא אֶת אֲרָם
  choice: wakawaleta Waaramu
  rationale: Hifili ya יצא ni ya kisababishi, ‘kuwatoa/kuwaleta.’ Katika muktadha huu, ‘kuwaleta’ huonyesha kuwa Hadadezeri aliwasababisha majeshi ya Waaramu yaje kutoka eneo lao.
- source_word: אֲרָם
  choice: Waaramu
  rationale: Hapa jina hilo linarejelea watu au vikosi vya Kiaramu, si nchi peke yake; ‘Waaramu’ linaakisi Kiebrania bila kutumia jina la kisasa ‘Wasyria.’
- source_word: מֵעֵבֶר הַנָּהָר
  choice: ng’ambo ya ule Mto
  rationale: Huhifadhi usemi wa Kiebrania ‘ng’ambo ya Mto’ na herufi kubwa kuonyesha rejeleo maalumu; tanbihi inautambulisha kuwa Frati.
- source_word: וַיָּבֹאוּ חֵילָם
  choice: Wakafika Helamu
  rationale: ‘Wakafika’ ni simulizi la kawaida la Kiswahili kwa ‘wakaja,’ na Helamu ni uhawilishaji wa jina la mahali חֵילָם.
- source_word: וְשׁוֹבַךְ
  choice: Shobaki
  rationale: Uhawilishaji ‘Shobaki’ unaakisi konsonanti ya mwisho ya Kiebrania huku ukifuata muundo wa kawaida wa matamshi ya Kiswahili.
- source_word: שַׂר צְבָא
  choice: mkuu wa jeshi
  rationale: Ni usemi wa sasa na unaoeleweka kwa cheo cha kiongozi wa kijeshi.
- source_word: לִפְנֵיהֶם
  choice: wakiongozwa na
  rationale: Kihalisi ni ‘mbele yao’; katika muktadha wa kijeshi humaanisha kuwa Shobaki alikuwa mbele yao akiwaongoza. Tanbihi huhifadhi maana ya kihalisi na utata wake wa kiasi.
