base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/004.yaml
  text: So Hanun took David’s servants[a], shaved off half of their beards, cut off their garments in the middle up to their buttocks, and sent them away.
translation:
  language: sw
  text: Basi Hanuni akawachukua watumishi wa Daudi, akanyoa nusu ya ndevu zao, akakata mavazi yao katikati mpaka kwenye matako yao[a], kisha akawaacha waende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka sehemu zao za siri.” Neno la Kiebrania lililotumiwa hapa ni adimu, na haijulikani kwa hakika linataja sehemu gani ya mwili. Maana ya jumla ni kwamba Hanuni aliyakata mavazi yao yawe mafupi sana na hivyo akawafunua kwa aibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akawachukua
  rationale: Kitenzi לקח kwa msingi wake ni ‘chukua’; katika muktadha huu kinaonyesha Hanuni aliwatia mikononi mwake ili awafanyie fedheha, bila kulazimisha maana kali zaidi ya ‘akawakamata’.
- source_word: עַבְדֵי דָוִד
  choice: watumishi wa Daudi
  rationale: עבד inaweza kumaanisha mtumwa, mtumishi, au afisa wa kifalme. Hapa ni wajumbe walio katika utumishi wa Daudi, hivyo ‘watumishi’ linafaa bila kudokeza lazima kuwa walikuwa watumwa.
- source_word: וַיְגַלַּח אֶת חֲצִי זְקָנָם
  choice: akanyoa nusu ya ndevu zao
  rationale: Tafsiri hii inaonyesha kwamba nusu ya ndevu za kila mmoja ilinyolewa, kitendo cha makusudi cha kuwafedhehesha.
- source_word: וַיִּכְרֹת אֶת מַדְוֵיהֶם בַּחֵצִי
  choice: akakata mavazi yao katikati
  rationale: כרת humaanisha kukata au kukata sehemu iondoke; מַדְוֵי ni mavazi, na בַּחֵצִי huonyesha mahali pa katikati. Kiswahili hiki ni wazi bila kubainisha isivyohitajika aina ya vazi.
- source_word: עַד שְׁתוֹתֵיהֶם
  choice: mpaka kwenye matako yao
  rationale: שְׁתוֹת ni neno adimu lenye rejeo la kianatomia linalobishaniwa; ‘matako’ linaonyesha kwa uwazi maana inayowezekana zaidi katika muktadha wa kuwafunua na kuwafedhehesha, huku tanbihi ikihifadhi kutokuwa na uhakika.
- source_word: וַיְשַׁלְּחֵם
  choice: kisha akawaacha waende
  rationale: שלח hapa ni kuwaondoa au kuwaacha waende baada ya kuwadhalilisha. Usemi huu ni wa kawaida katika Kiswahili na unahifadhi mtiririko wa simulizi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. ‘Matako’ ni neno la moja kwa moja lakini si la matusi; tanbihi inahifadhi utata halisi wa neno adimu la Kiebrania. Kiashiria [a] kimewekwa baada ya kifungu kinachohusika.
