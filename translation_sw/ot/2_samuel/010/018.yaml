base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/018.yaml
  text: Aram fled from before Israel[a], and David killed seven hundred charioteers and forty thousand horsemen from Aram. He also struck down Shobach, the commander of their army[b], and he died there.
translation:
  language: sw
  text: Waaramu wakakimbia mbele ya Israeli, naye Daudi akaua askari mia saba wa magari ya vita[a] na wapanda farasi elfu arobaini wa Waaramu. Pia akampiga Shobaki, mkuu wa jeshi lake[b], naye akafa huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “magari ya vita mia saba” au “kikosi cha magari ya vita mia saba.” Kinachorejelewa hasa huenda ni askari wa magari hayo. 1 Mambo ya Nyakati 19:18 ina “magari ya vita elfu saba.”'
    reason: textual_variant
  - marker: b
    text: Au, “mkuu wa jeshi lao.” Kiambishi cha Kiebrania ni cha umoja; kinaweza kurejelea jeshi la mfalme aliyetajwa katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס אֲרָם מִפְּנֵי יִשְׂרָאֵל
  choice: Waaramu wakakimbia mbele ya Israeli
  rationale: אֲרָם hapa inatumika kwa maana ya watu wa Aramu; 'Waaramu' ni Kiswahili cha kawaida na wazi. Nahau מִפְּנֵי inaeleza kukimbia mbele ya adui.
- source_word: וַיַּהֲרֹג דָּוִד
  choice: Daudi akaua
  rationale: הרג humaanisha kuua; 'akaua' ni tafsiri ya moja kwa moja na hutofautishwa na נכה baadaye katika mstari.
- source_word: שְׁבַע מֵאוֹת רֶכֶב
  choice: askari mia saba wa magari ya vita
  rationale: רֶכֶב inaweza kumaanisha gari la vita au kikosi cha magari ya vita. Katika orodha ya waliouawa, usemi huu unatoa kwa kawaida maana ya askari wa kikosi hicho bila kubadili idadi ya maandishi ya Kiebrania.
- source_word: וְאַרְבָּעִים אֶלֶף פָּרָשִׁים
  choice: wapanda farasi elfu arobaini
  rationale: פָּרָשִׁים ni wapanda farasi au askari wa jeshi la farasi; 'wapanda farasi' ni wazi na ya kawaida.
- source_word: וְאֵת שׁוֹבַךְ
  choice: Shobaki
  rationale: Jina limetoholewa kwa mfumo wa sauti unaosomeka kwa kawaida katika Kiswahili huku likifuata umbo la Kimasora.
- source_word: שַׂר צְבָאוֹ
  choice: mkuu wa jeshi lake
  rationale: שַׂר katika muktadha wa kijeshi ni mkuu au kamanda, na kiambishi cha Kiebrania katika צְבָאוֹ ni cha umoja, 'lake.' Tafsiri hii inalinda maumbo ya maandishi badala ya kuyabadilisha kuwa wingi.
- source_word: הִכָּה
  choice: akampiga
  rationale: נכה ina wigo wa maana wa kupiga, kushinda, au kuangusha. Kwa kuwa kishazi kinachofuata kinasema alikufa, 'akampiga' huhifadhi tofauti na הפרג bila kuongeza neno 'akaua.'
- source_word: וַיָּמָת שָׁם
  choice: naye akafia huko
  rationale: Hutoa maana ya moja kwa moja kwamba Shobaki alikufa huko kutokana na pigo, bila kuongeza maelezo yasiyokuwapo.
