translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inatumia masimulizi ya mfululizo kwa 'waka-/aka-' na istilahi za kijeshi zinazoeleweka kwa msomaji wa kawaida. Alama zote za tanbihi zimewekwa katika matini kuu.
