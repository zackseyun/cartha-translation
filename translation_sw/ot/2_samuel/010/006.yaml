source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י נִבְאֲשׁ֖וּ בְּ/דָוִ֑ד וַ/יִּשְׁלְח֣וּ בְנֵֽי עַמּ֡וֹן וַ/יִּשְׂכְּרוּ֩ אֶת אֲרַ֨ם בֵּית רְח֜וֹב וְ/אֶת אֲרַ֣ם צוֹבָ֗א עֶשְׂרִ֥ים אֶ֨לֶף֙ רַגְלִ֔י וְ/אֶת מֶ֤לֶךְ מַֽעֲכָה֙ אֶ֣לֶף אִ֔ישׁ וְ/אִ֣ישׁ ט֔וֹב שְׁנֵים עָשָׂ֥ר אֶ֖לֶף אִֽישׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/006.yaml
  text: When the sons of Ammon saw that they had become odious to David[a], the sons of Ammon sent and hired the Arameans of Beth-rehob and the Arameans of Zobah, twenty thousand foot soldiers, and the king of Maacah with one thousand men, and the men of Tob[c][b], twelve thousand men.
translation:
  language: sw
  text: Wana wa Amoni walipoona kwamba walikuwa wamekuwa wenye kuchukiza kwa Daudi[a], walituma na kuajiri Waaramu[b] wa Beth-rehobu na Waaramu wa Soba, askari wa miguu elfu ishirini, pamoja na mfalme wa Maaka na watu elfu moja, na watu wa Tobu[c], watu elfu kumi na mbili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi na maneno halisi: “walikuwa wamekuwa uvundo kwa Daudi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Aramu”; kimapokeo limetafsiriwa “Shamu” au “Washami.”'
    reason: lexical_alternative
  - marker: c
    text: Huenda pia ikawa “Ish-tobu,” likichukuliwa kuwa jina la mahali au ukoo; hapa limetafsiriwa “watu wa Tobu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: walipoona
  rationale: Kitenzi ראה kimsingi ni ‘kuona’; muundo ‘walipoona kwamba’ pia huwasilisha maana ya kutambua hali bila kuondoa taswira ya Kiebrania.
- source_word: בְּנֵי עַמּוֹן
  choice: Wana wa Amoni
  rationale: Huhifadhi kwa uwazi usemi rasmi wa Kiebrania ‘wana wa Amoni’ huku ukibaki unaeleweka katika Kiswahili cha kibiblia.
- source_word: נִבְאֲשׁוּ בְּדָוִד
  choice: walikuwa wamekuwa chukizo kwa Daudi
  rationale: Kitenzi kinatokana na taswira ya kunuka vibaya lakini hapa kina maana ya kuwa mwenye kuchukiza au kukera; ‘chukizo’ huwasilisha nguvu ya nahau hiyo, huku maana halisi ikiwekwa katika tanbihi.
- source_word: וַיִּשְׁלְחוּ
  choice: walituma watu
  rationale: Kiebrania hakitaji wazi waliotumwa. Kiswahili huhitaji kijalizo ili sentensi iwe ya kawaida; ‘watu’ ni nyongeza ya kiwango cha chini na haibainishi bila msingi kwamba walikuwa wajumbe rasmi.
- source_word: וַיִּשְׂכְּרוּ
  choice: wakaajiri
  rationale: Hueleza kwa ufupi kuwalipa vikosi vya kigeni ili vitoe msaada wa kijeshi; muktadha unaonyesha kwamba walikuwa askari wa kukodiwa.
- source_word: אֲרַם בֵּית רְחוֹב
  choice: Waaramu wa Beth-rehobu
  rationale: ‘Waaramu’ huakisi ethnonimu ya Kiebrania kwa usahihi zaidi kuliko jina la kimapokeo ‘Washami’; jina la mahali limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
- source_word: אֲרַם צוֹבָא
  choice: Waaramu wa Soba
  rationale: ‘Waaramu’ huhifadhi utambulisho wa Aramu, na Soba ni utohozi wa kawaida unaosomeka kiasili katika Kiswahili.
- source_word: עֶשְׂרִים אֶלֶף רַגְלִי
  choice: askari wa miguu elfu ishirini
  rationale: Hutafsiri רַגְלִי kuwa vikosi vinavyopigana kwa miguu na kudumisha rejesta ya kijeshi.
- source_word: מֶלֶךְ מַעֲכָה
  choice: mfalme wa Maaka
  rationale: Muundo wa utegemezi unaonyesha mtawala wa eneo la Maaka, si mfalme mwenye jina binafsi Maaka.
- source_word: אֶלֶף אִישׁ
  choice: watu elfu moja
  rationale: Ni tafsiri ya moja kwa moja ya idadi; ‘watu’ inafaa kwa kundi la kijeshi bila kuongeza neno lisilokuwapo kama ‘askari’.
- source_word: אִישׁ טוֹב
  choice: watu wa Tobu
  rationale: Muktadha na ulinganifu wa 1 Mambo ya Nyakati 19:6 unaunga mkono kuichukua Tobu kama jina la mahali au ukoo; uwezekano wa ‘Ish-tobu’ umehifadhiwa katika tanbihi.
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: watu elfu kumi na mbili
  rationale: Huhifadhi hesabu ya Kiebrania na mtindo wake wa kijeshi bila kuongeza ufafanuzi usio lazima.
