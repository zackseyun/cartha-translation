  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kihistoria lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa ‘Wana wa Amoni’ umehifadhi rasmi; ‘wakaajiri’ na ‘askari wa miguu’ ni maneno ya sasa na yaliyo wazi. Alama zote za tanbihi [a], [b], na [c] zimo katika matini kuu.
