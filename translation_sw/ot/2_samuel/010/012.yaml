  text: חֲזַ֤ק וְ/נִתְחַזַּק֙ בְּעַד עַמֵּ֔/נוּ וּ/בְעַ֖ד עָרֵ֣י אֱלֹהֵ֑י/נוּ וַֽ/יהוָ֔ה יַעֲשֶׂ֥ה הַ/טּ֖וֹב בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/012.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: sw
  text: Uwe hodari, nasi tujitie nguvu[a] kwa ajili ya watu wetu na kwa ajili ya miji ya Mungu wetu; Yahwe naye afanye yaliyo mema machoni pake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nasi tuwe hodari” au “nasi tujiimarishe.” Kitenzi cha Kiebrania kina muundo wa kujirejelea na kinaweza kumaanisha kujionyesha kuwa wenye nguvu au kujiimarisha.
    reason: lexical_alternative
  - marker: b
    text: Au “Yahwe naye atafanya yaliyo mema machoni pake.” Umbo la Kiebrania linaweza kusomwa kama wakati ujao wa kawaida, ingawa hapa limetafsiriwa kama ombi linalokabidhi matokeo kwa mapenzi ya Yahwe.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: Uwe hodari
  rationale: Kitenzi cha amri katika umoja kinatoa himizo la moja kwa moja la kuwa imara na jasiri. “Uwe hodari” ni Kiswahili cha kawaida kinachofaa muktadha wa vita.
- source_word: וְנִתְחַזַּק
  choice: nasi tujitie nguvu
  rationale: Muundo wa Hitpael wa kuhimiza tendo la pamoja una maana ya kujionyesha wenye nguvu au kujiimarisha. “Tujitie nguvu” huhifadhi hali hiyo ya kujielekezea tendo na ni ya asili katika Kiswahili.
- source_word: בְּעַד
  choice: kwa ajili ya
  rationale: Katika muktadha huu wa kijeshi, neno hili linaonyesha kutenda ili kuwatetea au kuwanufaisha watu na miji.
- source_word: עַמֵּנוּ
  choice: watu wetu
  rationale: עַם humaanisha jamii au taifa kwa upana, si jeshi pekee; hivyo “watu wetu” huhifadhi maana yake ya kawaida.
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: miji ya Mungu wetu
  rationale: Tafsiri hii inafuata muundo wa uhusiano wa Kiebrania na kuhifadhi wazo kwamba miji hiyo inahusishwa na Mungu wa Israeli.
- source_word: יַעֲשֶׂה הַטּוֹב בְּעֵינָיו
  choice: afanye yaliyo mema machoni pake
  rationale: Kauli hii huhifadhi nahau ya Kiebrania “mema machoni pake” na, kwa kutumia hali ya kutakia, huonyesha kukabidhi matokeo kwa mapenzi ya Mungu bila kuficha uwezekano wa kuisoma kama wakati ujao.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya kisarufi ya יַעֲשֶׂה baada ya mahimizo
  choice: Yahwe naye afanye yaliyo mema machoni pake
  alternative: Yahwe naye atafanya yaliyo mema machoni pake
  rationale: Hali ya kutakia inalingana na sauti ya kujikabidhi kwa mapenzi ya Mungu katika muktadha huu, lakini umbo la Kiebrania linaweza pia kueleweka kama taarifa rahisi ya wakati ujao; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Uwe hodari” na “tujitie nguvu” ni maneno yanayoeleweka kwa urahisi na yanadumisha mahimizo ya kijeshi pamoja na ulinganifu wa vifungu. Nahau “machoni pake” imehifadhiwa kwa sababu ni wazi katika Kiswahili na inafuata kwa karibu taswira ya chanzo.
