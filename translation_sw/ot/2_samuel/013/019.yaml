base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/019.yaml
  text: Then Tamar put ashes on her head[a], tore the robe of many colors that was on her, put her hand on her head, and went away, going and crying out.
translation:
  language: sw
  text: Ndipo Tamari akaweka majivu kichwani[a], akalirarua joho lenye mapambo alilokuwa amevaa, akaweka mkono wake kichwani, akaenda huku akipiga kelele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “joho la rangi nyingi,” “joho la mikono mirefu.” Maana ya usemi wa Kiebrania si hakika, lakini hapa unarejelea vazi maalumu lililovaliwa na mabinti wanawali wa mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵפֶר
  choice: majivu
  rationale: Nomino hii inataja majivu yaliyotumiwa kama ishara ya maombolezo; wingi wa Kiswahili ni wa kawaida katika muktadha huu.
- source_word: וַתִּקַּח ... עַל רֹאשָׁהּ
  choice: akaweka majivu kichwani
  rationale: Ingawa muundo wa Kiebrania ni halisi zaidi, maana yake ni kitendo cha kuweka majivu juu ya kichwa kama ishara ya maombolezo; Kiswahili hiki ni cha asili na kinahifadhi kitendo hicho.
- source_word: כְתֹנֶת הַפַּסִּים
  choice: joho lenye mapambo
  rationale: Maana kamili ya usemi huu wa Kiebrania haijulikani kwa hakika. 'Joho lenye mapambo' linaonyesha kuwa lilikuwa vazi maalumu bila kudai kwa uhakika kuwa lilikuwa la rangi nyingi au la mikono mirefu.
- source_word: אֲשֶׁר עָלֶיהָ
  choice: alilokuwa amevaa
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kutambulisha vazi lililokuwa juu yake.
- source_word: קָרָעָה
  choice: akalirarua
  rationale: Kitenzi hiki kinaonyesha kurarua vazi, kitendo cha maombolezo na huzuni.
- source_word: וַתָּשֶׂם יָדָהּ עַל רֹאשָׁהּ
  choice: akaweka mkono wake kichwani
  rationale: Tafsiri ya karibu inayohifadhi ishara ya mwili ya huzuni na fedheha bila kuifafanua kupita maandishi.
- source_word: וַתֵּלֶךְ הָלוֹךְ וְזָעָקָה
  choice: akaenda huku akipiga kelele
  rationale: Muundo huu unaonyesha kuwa aliendelea kwenda wakati huohuo akilia kwa sauti; 'huku akipiga kelele' ni Kiswahili cha asili kinachohifadhi mwendelezo huo.
- source_word: זָעָקָה
  choice: akipiga kelele
  rationale: Kitenzi kinaashiria kilio kikubwa. Usemi huu unahifadhi nguvu ya sauti bila kuamua kama ilikuwa mayowe, maombolezo, au kilio cha kutaka msaada.
