base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/007.yaml
  text: Then David sent word to Tamar at home[a], saying, “Please go to the house of your brother Amnon and prepare the food for him.”
translation:
  language: sw
  text: Ndipo Daudi akatuma ujumbe kwa Tamari nyumbani[a], akisema, “Tafadhali nenda nyumbani kwa Amnoni ndugu yako, ukamwandalia chakula.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukamwandalia chakula cha kumrudishia nguvu” au “ukamwandalia mlo.” Neno la Kiebrania linamaanisha chakula kilichoandaliwa kwa mgonjwa au mtu anayepata nafuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma ujumbe
  rationale: Kitenzi kina maana ya ‘kutuma’; kwa kuwa ujumbe unaofuata unaelekezwa kwa Tamari, ‘akatuma ujumbe’ ni Kiswahili cha kawaida na wazi.
- source_word: הַבַּיְתָה
  choice: nyumbani
  rationale: Kiambishi cha mwelekeo kwenye ‘nyumba’ kinaweza kuonyesha kuelekea nyumbani, lakini katika muktadha huu ujumbe unatumwa kwa Tamari mahali alipo. ‘Nyumbani’ huhifadhi maana ya kimazingira kwa njia ya kawaida.
- source_word: לְכִי נָא
  choice: Tafadhali nenda
  rationale: Hii ni amri ya umoja wa kike iliyolainishwa na נָא; ‘Tafadhali nenda’ huonyesha amri yenye adabu.
- source_word: בֵּית אַמְנוֹן אָחִיךְ
  choice: nyumbani kwa Amnoni ndugu yako
  rationale: Hili ni fumbo la umilikaji lenye maana ya ‘nyumba ya Amnoni ndugu yako.’ Kiswahili hiki ni cha kawaida na kinahifadhi uhusiano wa kindugu.
- source_word: וַעֲשִׂי לוֹ
  choice: ukamwandalia
  rationale: Katika muktadha wa chakula, עשה ina maana ya kutengeneza au kuandaa kitu kwa ajili yake; ‘ukamwandalia’ huunganisha tendo na mnufaika kwa ufasaha.
- source_word: הַבִּרְיָה
  choice: chakula
  rationale: Nomino hii inarejelea chakula kinachoandaliwa kwa mgonjwa au anayepona. ‘Chakula’ ni tafsiri isiyozidisha ufafanuzi; maana maalumu imeelezwa katika tanbihi.
