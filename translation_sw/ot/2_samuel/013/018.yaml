  to: Alikuwa amevaa joho lililopambwa sana[a], kwa maana ndivyo mabinti mabikira wa mfalme walivyokuwa wakivaa majoho. Kisha mtumishi wa Amnoni akamtoa nje na akamfungia mlango nyuma yake.
