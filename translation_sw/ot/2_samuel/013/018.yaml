base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/018.yaml
  text: She was wearing a richly ornamented robe[a], for this is how the virgin daughters of the king used to dress. Then his attendant put her outside and bolted the door behind her.
translation:
  language: sw
  text: Alikuwa amevaa joho lililopambwa sana[a], kwa maana ndivyo mabinti mabikira wa mfalme walivyokuwa wakivaa majoho. Kisha mtumishi wa Amnoni akamtoa nje na akamfungia mlango nyuma yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “joho la rangi nyingi” au “joho refu lenye mikono”; maana hususa ya neno linaloeleza vazi hili haijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹנֶת פַּסִּים
  choice: joho lililopambwa sana
  rationale: Kirai hiki kinataja vazi la pekee, lakini maana hususa ya פַּסִּים haijulikani kwa uhakika. Tafsiri hii ni ya kawaida na yenye heshima katika Kiswahili, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: כִּי כֵן תִּלְבַּשְׁןָ
  choice: kwa maana hivyo ndivyo ... walivyokuwa wakivaa
  rationale: Muundo huu unaeleza desturi ya wakati huo; hali ya mazoea imeonyeshwa kwa 'walivyokuwa wakivaa'.
- source_word: בְנוֹת הַמֶּלֶךְ הַבְּתוּלֹת
  choice: mabinti wa mfalme waliokuwa mabikira
  rationale: Inahifadhi wazi hadhi yao ya kifalme na pia ubikira wao bila kubadili maana kuwa tu kutokuolewa.
- source_word: מְעִילִים
  choice: walivyokuwa wakivaa
  rationale: Ingawa neno hili linaweza kumaanisha majoho au mavazi ya nje, kurudia 'majoho' katika sentensi kungekuwa kuzito. Vazi linalorejelewa linaeleweka kutokana na kishazi kilichotangulia.
- source_word: מְשָׁרְתוֹ
  choice: mtumishi wake
  rationale: Katika muktadha huu ni mtu aliyekuwa akimhudumia Amnoni; 'mtumishi' ni neno la kawaida na wazi katika Kiswahili.
- source_word: וַיֹּצֵא אוֹתָהּ הַחוּץ
  choice: akamtoa nje
  rationale: Hutoa kwa kawaida maana ya kisababishi cha kumpeleka nje bila kuongeza kiwango cha nguvu ambacho kitenzi cha Kiebrania hakitaji wazi.
- source_word: וְנָעַל הַדֶּלֶת אַחֲרֶיהָ
  choice: kuufungia mlango nyuma yake
  rationale: Kitenzi נעל kinaonyesha kufunga kwa kufuli au komeo, si kuufunga mlango tu; 'kuufungia' hudokeza kuwa mlango uliwekwa salama dhidi yake.
