translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kiunganishi cha mwanzo kimetafsiriwa kwa mtiririko wa kawaida bila kuongeza neno la wakati lisilokuwapo katika chanzo. Jina la Amnoni halijaongezwa katika aya kwa kuwa Kiebrania kinasema tu 'mtumishi wake'.
