base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/012.yaml
  text: She said to him[a], “No, my brother, do not violate me, for such a thing is not done in Israel[b]. Do not do this disgraceful thing.”
translation:
  language: sw
  text: Akamwambia, “Hapana, ndugu yangu! Usinivunjie heshima,[a] kwa maana jambo kama hili halifanywi katika Israeli. Usifanye tendo hili la fedheha.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “usinidhalilishe” au “usinibake.” Kitenzi cha Kiebrania katika muktadha huu kinaweza kumaanisha kumwingilia mwanamke kingono kwa kumdhalilisha na kumvunjia heshima.
    reason: lexical_alternative
  - marker: b
    text: Au “tendo hili la aibu kubwa” au “tendo hili ovu kabisa.” Neno la Kiebrania linamaanisha tendo la fedheha linalochukiza kimaadili, si upumbavu wa kawaida tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר לוֹ
  choice: Akamwambia
  rationale: Kauli ya kawaida ya kusimulia inayoendeleza mfuatano wa matukio; Kiswahili huunganisha kiwakilishi cha mtendwa katika kitenzi.
- source_word: אַל אָחִי
  choice: La, ndugu yangu!
  rationale: אַל ya kwanza ina nguvu ya kilio cha haraka cha kukataa, si ombi la adabu; אָחִי imehifadhiwa kwa sababu uhusiano wao wa kifamilia ni muhimu katika uzito wa tendo hilo.
- source_word: אַל תְּעַנֵּנִי
  choice: Usinitendee ukatili huu wa kingono
  rationale: Kitenzi ענה katika Piel hapa kinaashiria kumdhalilisha au kumtendea mtu kwa nguvu katika muktadha wa kingono. Tafsiri hii inaweka wazi muktadha bila kuondoa kabisa maana ya ukatili na udhalilishaji iliyomo katika neno.
- source_word: כִּי לֹא יֵעָשֶׂה כֵן בְּיִשְׂרָאֵל
  choice: kwa maana jambo kama hili halifanywi katika Israeli
  rationale: Niphal isiyo na mtendaji maalumu inaeleza mwiko wa kijamii na kimaadili; muundo huu wa Kiswahili unahifadhi dai kuhusu desturi na maadili ya jamii ya Israeli.
- source_word: אַל תַּעֲשֵׂה
  choice: Usifanye
  rationale: Ni katazo la moja kwa moja, linalofuata kwa karibu kitenzi cha Kiebrania עשה.
- source_word: הַנְּבָלָה הַזֹּאת
  choice: tendo hili la aibu
  rationale: נְבָלָה ni tendo ovu, la fedheha na linalokiuka utaratibu wa kimaadili wa jamii; ‘tendo hili la aibu’ ni la asili na lenye uzito katika Kiswahili cha sasa, bila kulidhoofisha kuwa upumbavu tu.
theological_decisions:
- issue: Maana ya kijamii na kimaadili ya ‘halifanywi katika Israeli’
  choice: Imehifadhiwa kama kauli ya mwiko wa jamii ya Israeli
  alternative: Kulieleza moja kwa moja kuwa ni kosa dhidi ya sheria ya Mungu
  rationale: Kiebrania chenyewe kinatoa hoja ya desturi na utambulisho wa jamii; hakitaji sheria fulani moja kwa moja katika mstari huu, hivyo tafsiri haiongezi ufafanuzi wa kimadhehebu au wa kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi wa Tamari umepewa nguvu ya dharura bila kuongeza adabu isiyokuwamo katika chanzo. ‘Ukatili huu wa kingono’ huwasilisha muktadha wazi kwa wasomaji wa kawaida, huku tanbihi ikihifadhi upana wa kitenzi cha Kiebrania.
