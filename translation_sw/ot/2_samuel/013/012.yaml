review_pass:
  verdict: revise
  source_fidelity: The narrative introduction, urgent refusal, kinship address, communal moral appeal, and final prohibition are faithfully represented. However, “Usinitendee ukatili huu wa kingono” adds the demonstrative “huu” and recasts the direct Hebrew plea “do not violate/humiliate me” as an abstract act of sexual violence. A more direct expression can retain the sexual-violation and dishonour connotations without overstating a single lexical nuance.
  naturalness: “La” is understandable but “Hapana” is more natural in contemporary Standard East African Swahili in this urgent spoken protest. “Usinivunjie heshima” is a natural direct appeal and fits the context. “Tendo hili la fedheha” more clearly conveys the moral scandal and shame of נבלה than the somewhat broader “tendo hili la aibu.”
  terminology: The proposed wording avoids importing a denominational interpretation. The footnote retains “kubaka” as a legitimate, contextually specific alternative while preserving the Hebrew verb’s humiliation/dishonour dimension in the main text and note.
  issues:
  - severity: medium
    issue: The expression “Usinitendee ukatili huu wa kingono” is less direct than the Hebrew and adds “huu.”
    rationale: 'תְעַנֵּנִי directly addresses what Amnon would do to Tamar: “do not violate/humiliate me.” The draft’s abstract nominal phrase is understandable but shifts the wording and includes a demonstrative not present in this clause.'
  - severity: low
    issue: “La” is less idiomatic than “Hapana” in this emotional modern-Swahili dialogue.
    rationale: “Hapana, ndugu yangu!” naturally communicates the emphatic initial negative without adding politeness.
  - severity: low
    issue: “Tendo hili la aibu” can understate נבלה’s sense of an outrageous, shameful moral offence.
    rationale: “Tendo hili la fedheha” better conveys both public disgrace and moral offensiveness while remaining idiomatic.
