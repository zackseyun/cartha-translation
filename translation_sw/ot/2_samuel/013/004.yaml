base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/004.yaml
  text: He said to him[a], “Why are you so gaunt, son of the king, morning after morning? Will you not tell me?” And Amnon said to him, “I love Tamar[b], the sister of my brother Absalom.”
translation:
  language: sw
  text: Akamwambia, “Kwa nini wewe, mwana wa mfalme, umekonda hivi asubuhi baada ya asubuhi[a]? Hutaniambia?” Amnoni akamwambia, “Ninampenda Tamari[b], dada ya Absalomu, ndugu yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila asubuhi.”
    reason: lexical_alternative
  - marker: b
    text: Au “Nina mahaba na Tamari.” Kiebrania kinasema kwa maana ya moja kwa moja zaidi, “Ninampenda Tamari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Kwa nini
  rationale: Ni swali la moja kwa moja kuhusu sababu; ‘Kwa nini’ ni la kawaida na wazi katika Kiswahili.
- source_word: כָּכָה דַּל
  choice: unaonekana umekonda hivi
  rationale: דַּל hapa inaeleza hali inayoonekana ya mwili kudhoofika au kukonda, si umaskini. ‘Unaonekana umekonda hivi’ huwasilisha jambo ambalo Yonadabu aliliona bila kuongeza utambuzi wa kitabibu au wa kisaikolojia.
- source_word: בֶּן הַמֶּלֶךְ
  choice: mwana wa mfalme
  rationale: Inafuata muundo wa Kiebrania na kuhifadhi uzito wa namna Yonadabu anavyomwita Amnoni.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: kila asubuhi
  rationale: Kurudiwa kwa ‘asubuhi’ huonyesha hali inayojirudia. ‘Kila asubuhi’ ni Kiswahili cha kawaida; muundo wa karibu zaidi umehifadhiwa katika tanbihi.
- source_word: הֲלוֹא תַּגִּיד לִי
  choice: Hutaniambia?
  rationale: הֲלוֹא huanzisha swali linalotarajia jibu la kukubali. ‘Hutaniambia?’ huhifadhi msukumo huo kwa njia ya kawaida katika Kiswahili.
- source_word: אֲחוֹת אַבְשָׁלֹם אָחִי
  choice: dada ya Absalomu ndugu yangu
  rationale: Huhifadhi mpangilio wa uhusiano ulio katika Kiebrania huku ikibaki wazi na ya kawaida katika Kiswahili.
- source_word: אֲנִי אֹהֵב
  choice: Ninampenda
  rationale: אָהֵב ni kitenzi cha kawaida cha ‘kupenda.’ Tafsiri hii haiongezi hukumu kuhusu aina au maadili ya tamaa ya Amnoni ambayo haijaelezwa moja kwa moja katika kishazi hiki.
theological_decisions:
- issue: Namna ya kutafsiri kauli ya Amnoni kuhusu Tamari
  choice: Ninampenda Tamari
  alternative: Nimempenda Tamari / Nina mahaba na Tamari / Ninamtamani Tamari
  rationale: Kiebrania kinatumia kitenzi cha kawaida אָהֵב, ‘kupenda.’ Ingawa simulizi pana linafunua tamaa yake potovu, mstari huu wenyewe unasema kwamba anampenda. Tafsiri kuu inadumisha mvutano huo bila kuingiza mapema tathmini ya kimaadili au kisaikolojia.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Amnoni, Tamari, na Absalomu. Sentensi imehifadhi swali la msukumo na mpangilio wa uhusiano wa kifamilia bila kuwa nzito kupita kiasi.'
