review_pass:
  verdict: revise
  source_fidelity: The draft conveys the cause-question, physical wasting/thinness, royal address, recurring mornings, urging question, and Amnon's stated love accurately. However, "unaonekana" (“you appear”) introduces an evidential nuance absent from the Hebrew predication, and the unpunctuated final kinship phrase can be read less clearly than the Hebrew apposition.
  naturalness: The Swahili is generally modern and clear. Rendering the temporal repetition as "asubuhi baada ya asubuhi" is both idiomatic and closer to the Hebrew repetition. A comma before "ndugu yangu" makes the apposition immediately clear.
  terminology: The established biblical forms Amnoni, Tamari, and Absalomu are appropriate. "Ninampenda" rightly retains the ordinary sense of אָהֵב without importing a stronger interpretive sense.
  issues:
  - severity: low
    issue: '"unaonekana umekonda" adds “appear/seem.”'
    rationale: The Hebrew directly predicates דל (“thin/gaunt/wasted”) of Amnon; it does not mark this as mere appearance. "Umekonda" preserves the direct assertion.
  - severity: low
    issue: The recurrence and kinship apposition can be clearer.
    rationale: '"Asubuhi baada ya asubuhi" reflects the repeated Hebrew phrase, while a comma in "Absalomu, ndugu yangu" identifies Absalom, rather than Tamar, as Amnon''s brother.'
  revised_text: Akamwambia, “Kwa nini wewe, mwana wa mfalme, umekonda hivi asubuhi baada ya asubuhi[a]? Hutaniambia?” Amnoni akamwambia, “Ninampenda Tamari[b], dada ya Absalomu, ndugu yangu.”
