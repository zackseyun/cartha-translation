- from: Akamwambia, “Kwa nini unaonekana umekonda hivi kila asubuhi[a], mwana wa mfalme? Hutaniambia?” Amnoni akamwambia, “Ninampenda Tamari[b], dada ya Absalomu ndugu yangu.”
  to: Akamwambia, “Kwa nini wewe, mwana wa mfalme, umekonda hivi asubuhi baada ya asubuhi[a]? Hutaniambia?” Amnoni akamwambia, “Ninampenda Tamari[b], dada ya Absalomu, ndugu yangu.”
  rationale: The revision removes the added evidential force of “unaonekana,” uses an idiomatic repeated-morning expression closer to the Hebrew, and punctuates the final apposition for unambiguous natural Swahili. The meaning and the existing lexical alternatives are otherwise retained.
