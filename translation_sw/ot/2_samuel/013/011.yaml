translation:
  language: sw
  text: Alipomletea chakula ili ale[a], akamshika kwa nguvu na kumwambia, “Njoo, ulale nami, dada yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alipomkaribia ili ale”; kitenzi cha Kiebrania kinaweza kumaanisha kwamba Tamari alimkaribia au kwamba alimletea chakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ אֵלָיו לֶאֱכֹל
  choice: Alipomletea chakula karibu ili ale
  rationale: Kitenzi נגשׁ kinaweza kumaanisha kuja karibu au kuleta karibu. Katika muktadha Tamari anamhudumia chakula alichotayarisha; kutaja “chakula” kwa uwazi kunafanya Kiswahili kiwe cha kawaida huku tanbihi ikihifadhi uwezekano mwingine wa Kiebrania.
- source_word: וַיַּחֲזֶק בָּהּ
  choice: akamshika kwa nguvu
  rationale: חזק pamoja na ב inaonyesha kumkamata au kumshika kwa uthabiti. “Kumshika kwa nguvu” huonyesha wazi hali ya kulazimisha bila kuongeza tendo lisilotajwa.
- source_word: בּוֹאִי
  choice: Njoo
  rationale: Ni amri ya moja kwa moja kwa mwanamke mmoja; “Njoo” huhifadhi ufupi na ukali wake.
- source_word: שִׁכְבִי עִמִּי
  choice: ulale nami
  rationale: שׁכב pamoja na עִם ni msemo wa kujamiiana. Katika Kiswahili, “kulala nami” hudokeza maana hiyo kwa uwazi wa kutosha na kwa lugha yenye hadhi, bila maelezo ya ziada.
- source_word: אֲחוֹתִי
  choice: dada yangu
  rationale: Neno halisi la undugu linahifadhiwa kwa sababu uhusiano wao ni muhimu kwa uzito wa kimaadili na wa kisimulizi wa tukio.
theological_decisions:
- issue: Kutafsiri amri ya kingono bila kuificha kwa lugha laini
  choice: ulale nami
  alternative: ufanye mapenzi nami
  rationale: Kiebrania kinatumia msemo wa kingono badala ya tamko la moja kwa moja. “Ulale nami” huhifadhi msemo huo na uzito wake bila kuufanya ukatili wa tukio uonekane mdogo.
- issue: Kuhifadhi namna ya kumwita kwa undugu
  choice: dada yangu
  alternative: kuondoa namna hiyo ya kumwita
  rationale: Maneno haya yanaongeza wazi ubaya wa dai hilo kwa kuonyesha uhusiano wa kifamilia; kwa hiyo hayapaswi kuachwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni wa kawaida na wazi; lugha haifichi matumizi ya nguvu wala kuingiza maelezo yasiyomo katika chanzo.
