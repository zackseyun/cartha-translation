review_pass:
  verdict: revise
  source_fidelity: The draft conveys Tamar’s rhetorical contrast, her public disgrace, the moral force of נְבָלִים, and her appeal to the king. However, “hatanikataa kwako” does not naturally or clearly express the Hebrew idiom ‘he will not withhold me from you’; it can be misconstrued as rejecting Tamar in relation to Amnon. The wording should explicitly communicate that the king would not refuse to give her to him.
  naturalness: The Swahili is generally modern and suitable in register. “Nitaipeleka” is required rather than “nitaupeleka,” since aibu takes the class-9 object concord i-. “Hatakataa kukunipa” is idiomatic and clear in this marriage-giving context.
  terminology: “Aibu yangu” is appropriate for חֶרְפָּתִי, with alternatives retained in the note. “Watu wapumbavu” is usable provided the footnote preserves the moral sense of נְבָלִים. The names Tamari and Amnoni are consistently rendered in the footnote.
  issues:
  - severity: medium
    issue: Object concord in “nitaupeleka”
    rationale: Aibu is a class-9 noun; the appropriate object concord is i-, yielding “nitaipeleka.”
  - severity: high
    issue: “Hatanikataa kwako” is unclear and semantically imprecise
    rationale: The Hebrew says that the king will not withhold Tamar from Amnon, idiomatically meaning that he will not refuse to give her to him. “Hatakataa kukunipa” expresses this naturally without deciding whether Tamar’s appeal was realistic or strategic.
  revised_text: Nami[a], nitaipeleka wapi aibu yangu? Nawe utakuwa kama mmoja wa watu wapumbavu[b] katika Israeli. Basi sasa, tafadhali zungumza na mfalme[c], kwa maana hatakataa kukunipa.
