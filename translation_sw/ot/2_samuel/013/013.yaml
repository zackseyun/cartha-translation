  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/אֲנִ֗י אָ֤נָה אוֹלִיךְ֙ אֶת חֶרְפָּתִ֔/י וְ/אַתָּ֗ה תִּהְיֶ֛ה כְּ/אַחַ֥ד הַ/נְּבָלִ֖ים בְּ/יִשְׂרָאֵ֑ל וְ/עַתָּה֙ דַּבֶּר נָ֣א אֶל הַ/מֶּ֔לֶךְ כִּ֛י לֹ֥א יִמְנָעֵ֖/נִי מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/013.yaml
  text: As for me[a], where could I carry my disgrace? And you—you would be like one of the fools in Israel. So now, please speak to the king[c][b], for he will not withhold me from you.
translation:
  language: sw
  text: Nami[a], nitaipeleka wapi aibu yangu? Nawe utakuwa kama mmoja wa watu wapumbavu[b] katika Israeli. Basi sasa, tafadhali zungumza na mfalme[c], kwa maana hatakataa kukunipa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fedheha yangu” au “shutuma yangu.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza kumaanisha “watu wapumbavu,” lakini mara nyingi humaanisha watu waovu, wasio na haya, au wenye kudharauliwa, si watu wasio na akili tu.
    reason: lexical_alternative
  - marker: c
    text: Yaani, “hatakataa kukupa mimi.” Kauli ya Tamari huenda ilikuwa ombi la kweli au jaribio la kukawia ili Amnoni asimshambulie; aya yenyewe haisemi wazi.
    reason: alternative_reading
lexical_decisions:
- source_word: אָנָה
  choice: wapi
  rationale: Ni kielezi cha kuuliza kuhusu mahali au mwelekeo; pamoja na kitenzi cha mwendo kinaunda swali la balagha kuhusu mahali ambapo Tamari angeweza kuipeleka aibu yake.
- source_word: אוֹלִיךְ
  choice: nitaupeleka
  rationale: Hifili ya הלך ina wazo la kusababisha kitu kiende, yaani kukipeleka. Tafsiri hii inadumisha sitiari ya mwendo katika Kiebrania na inasikika kwa kawaida katika Kiswahili.
- source_word: חֶרְפָּתִי
  choice: aibu yangu
  rationale: Katika muktadha huu ni fedheha au shutuma ya hadharani ambayo ingemwangukia Tamari. “Aibu yangu” ni ya kawaida na wazi, huku tanbihi ikionyesha vivuli vingine vya maana.
- source_word: כְּאַחַד הַנְּבָלִים
  choice: kama mmoja wa watu wapumbavu
  rationale: Neno נבל linaweza kumaanisha mpumbavu, lakini hapa upumbavu huo ni wa kimaadili—mtu asiye na haya na mwenye kudharauliwa. Tafsiri ya msingi inafuata taswira ya Kiebrania, na tanbihi inafafanua uzito wake wa kimaadili.
- source_word: דַּבֶּר נָא
  choice: tafadhali zungumza
  rationale: Amri pamoja na נא ni ombi la kusihi. “Tafadhali zungumza” huwasilisha ombi hilo kwa Kiswahili cha sasa chenye heshima.
- source_word: יִמְנָעֵנִי מִמֶּךָּ
  choice: hatanikataa kwako
  rationale: מנע humaanisha kuzuia au kutompa mtu kitu. Katika muktadha huu msemo una maana kwamba mfalme hatakataa kumpa Tamari kwa Amnoni, bila kulazimisha tafsiri juu ya uwezekano wa jambo hilo.
theological_decisions:
- issue: Maana na dhamira ya ombi la Tamari kwa mfalme
  choice: Maneno yake yametafsiriwa moja kwa moja kuwa mfalme hatamkataa kwake, bila kuamua kama pendekezo hilo lilikuwa uwezekano halisi au mbinu ya kuchelewesha shambulio.
  alternative: Huenda Tamari aliamini kweli kwamba Daudi angekubali ndoa hiyo; au huenda alisema hivyo kwa mkakati ili kumzuia Amnoni kwa muda.
  rationale: Aya yenyewe haitoi uamuzi kuhusu uhalali, uwezekano wa kisiasa, au dhamira ya ombi hilo. Kwa hiyo utata wa simulizi umehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha na urudiaji wa mkazo katika “Nami ... Nawe” umehifadhiwa. Alama zote za tanbihi zimewekwa mara moja katika maandishi kwa mpangilio wa kawaida.
