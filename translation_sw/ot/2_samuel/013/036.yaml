base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/036.yaml
  text: And as soon as he finished speaking[a], behold, the king’s sons came, and they raised their voices and wept. The king also, and all his servants, wept with very great weeping.
translation:
  language: sw
  text: Mara tu alipomaliza kusema, tazama, wana wa mfalme wakaja, wakapaza sauti zao, wakalia. Mfalme pia na watumishi wake wote wakalia kilio kikubwa sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wakalia kilio kikubwa sana”; muundo wa kitenzi na nomino ya mzizi uleule unasisitiza maombolezo makali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: Mara tu alipomaliza kusema
  rationale: Muundo wa kisimulizi wa Kiebrania umetafsiriwa kwa Kiswahili cha kawaida; “mara tu” linaonyesha mfuatano wa karibu wa matukio.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Linahifadhi kishiria cha kisimulizi kinachovuta fikira kwa kuwasili kwa wana wa mfalme bila kukifanya kiwe kielezi cha wakati pekee.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: wana wa mfalme
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya uhusiano wa kifamilia katika kishazi unganifu.
- source_word: בָּאוּ
  choice: wakaja
  rationale: Kitenzi hiki cha kawaida cha mwendo kinaendeleza mtiririko wa kisimulizi.
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: wakapaza sauti zao
  rationale: Kinahifadhi taswira ya nahau ya Kiebrania inayomaanisha kuanza maombolezo kwa sauti kubwa.
- source_word: וַיִּבְכּוּ
  choice: na kulia
  rationale: Katika muktadha huu, “kulia” linaonyesha machozi na maombolezo, baada ya kupaza sauti zao.
- source_word: וְגַם
  choice: pia
  rationale: Linaonyesha kwamba mfalme na watumishi wake walijiunga na wana wa mfalme katika maombolezo.
- source_word: וְכָל עֲבָדָיו
  choice: pamoja na watumishi wake wote
  rationale: “Watumishi” linaacha wazi upana wa עֲבָדָיו, ambao katika mazingira ya kifalme unaweza kuwahusu wahudumu au maofisa wa mfalme.
- source_word: בָּכוּ בְּכִי גָּדוֹל מְאֹד
  choice: wakalia kwa uchungu mwingi sana
  rationale: Kiswahili hiki cha asili kinawasilisha msisitizo mkubwa wa muundo wa Kiebrania wa kurudia mzizi wa kitenzi na nomino.
