base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/020.yaml
  text: Then Absalom her brother said to her[a], “Has Amnon your brother been with you? But now, my sister, keep silent; he is your brother. Do not take this matter to heart.” So Tamar remained, devastated[b], in the house of Absalom her brother.
translation:
  language: sw
  text: Ndipo Absalomu, ndugu yake, akamwambia[a], “Je, Amnoni, ndugu yako, alikuwa pamoja nawe? Lakini sasa, dada yangu, nyamaza; yeye ni ndugu yako. Usitie moyoni jambo hili.” Basi Tamari akakaa, akiwa ukiwa[b], katika nyumba ya Absalomu, ndugu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Je, Amnoni ndugu yako alikuwa pamoja nawe?” Huu ni usemi wa staha unaorejelea shambulio la kingono.'
    reason: lexical_alternative
  - marker: b
    text: Au “akiwa ameharibiwa.” Neno la Kiebrania linaweza kueleza hali ya ukiwa, uharibifu, au mshtuko mkubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲמִינוֹן
  choice: Amnoni
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: הָיָה עִמָּךְ
  choice: alikuwa pamoja nawe
  rationale: Inahifadhi usemi wa staha wa Kiebrania bila kufanya wazi tendo la kingono ambalo muktadha tayari unalibainisha.
- source_word: הַחֲרִישִׁי
  choice: nyamaza
  rationale: Amri fupi na ya moja kwa moja inayowasilisha maana ya kuwa kimya.
- source_word: אָחִיךְ הוּא
  choice: yeye ni ndugu yako
  rationale: Inahifadhi kauli kali ya Absalomu na mvutano wake wa kifamilia bila kuipunguza.
- source_word: אַל תָּשִׁיתִי אֶת לִבֵּךְ לַדָּבָר הַזֶּה
  choice: Usitie moyoni jambo hili
  rationale: Ni nahau ya kawaida ya Kiswahili inayokaribia taswira ya Kiebrania ya kuweka jambo moyoni.
- source_word: וַתֵּשֶׁב
  choice: akakaa
  rationale: Inadumisha maana pana ya kukaa au kuishi katika nyumba ya Absalomu, bila kulazimisha tu maana ya kubaki.
- source_word: שֹׁמֵמָה
  choice: akiwa ameharibiwa kabisa
  rationale: Inaonyesha hali ya ukiwa, uharibifu na mshtuko mkubwa; tanbihi inadumisha uwezekano wa tafsiri ya 'mkiwa'.
- source_word: בֵּית אַבְשָׁלוֹם
  choice: katika nyumba ya Absalomu
  rationale: Inahifadhi mazingira halisi ya nyumbani na muundo wa uhusiano wa kifamilia.
theological_decisions:
- issue: Usemi usio wa moja kwa moja kuhusu shambulio la kingono
  choice: “alikuwa pamoja nawe”
  alternative: “alikunajisi” au “alilala nawe”
  rationale: Kiebrania kinatumia usemi wa staha. Tafsiri kuu inauhifadhi, huku tanbihi ikieleza maana yake katika muktadha bila kuficha ukatili wa tukio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Usemi wa Kiebrania na mvutano wa kifungu vimehifadhiwa bila kuhalalisha amri ya Absalomu ya kunyamaza.
