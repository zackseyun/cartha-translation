base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/023.yaml
  text: It happened after two full years that Absalom had sheep shearers at Baal-hazor[a], which is near Ephraim, and Absalom invited all the king’s sons.
translation:
  language: sw
  text: Ikawa, baada ya miaka miwili kamili, Absalomu alikuwa na watu waliokuwa wakinyoa kondoo huko Baal-Hasori, karibu na Efraimu; naye Absalomu akawaalika wana wote wa mfalme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִשְׁנָתַיִם יָמִים
  choice: baada ya miaka miwili kamili
  rationale: Nahau hiyo ya Kiebrania, kwa maana halisi ‘miaka miwili ya siku,’ inaeleza kipindi kamili cha miaka miwili. Tafsiri hii ni ya asili katika Kiswahili na inaonyesha kwamba kipindi chote kilikuwa kimepita.
- source_word: גֹזְזִים
  choice: wakata-manyoya wa kondoo
  rationale: Katika muktadha huu, umbo hili linamaanisha watu waliokuwa wakikata manyoya ya kondoo. Kutaja kondoo wazi kunafanya maana iliyodokezwa na Kiebrania ieleweke kwa msomaji wa sasa.
- source_word: בְּבַעַל חָצוֹר
  choice: huko Baal-Hasori
  rationale: Ni jina la mahali, hivyo limetoholewa badala ya kutafsiriwa. ‘Huko’ linaonyesha mahali pa tukio kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר עִם אֶפְרָיִם
  choice: karibu na Efraimu
  rationale: Ingawa עִם kwa kawaida humaanisha ‘pamoja na,’ hapa inaonyesha ukaribu wa kijiografia. ‘Karibu na’ ndiyo maana inayofaa katika muktadha huu.
- source_word: וַיִּקְרָא
  choice: akawaalika
  rationale: Kitenzi hicho kwa msingi humaanisha ‘kuita,’ lakini hapa katika mazingira ya sherehe ya kukata manyoya kina nguvu ya kimatumizi ya kuwaalika wana wa mfalme.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: wana wote wa mfalme
  rationale: Hii inahifadhi uhusiano wa kifamilia na cheo cha kifalme kwa mpangilio wa asili na wenye hadhi katika Kiswahili.
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huu ni mwanzo wa kawaida wa simulizi unaoonyesha mwendelezo au mpito. ‘Ikawa’ huhifadhi mtiririko wa usimulizi bila kuongeza neno la wakati lisilokuwapo katika chanzo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inafuata ulinganifu mwafaka, ikidumisha mtiririko wa simulizi na kuweka wazi maana iliyodokezwa ya shughuli ya kukata manyoya ya kondoo. Hakuna tanbihi iliyohitajika kwa kuwa maana ya nahau ya kipindi kamili imewasilishwa moja kwa moja katika matini.
