translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya simulizi ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Viambishi vya mfululizo wa matendo vimetumiwa kudumisha mwendo wa simulizi, huku istilahi adimu za chakula zikielezwa kwa tanbihi badala ya kufasiriwa kupita kiasi katika matini kuu.
