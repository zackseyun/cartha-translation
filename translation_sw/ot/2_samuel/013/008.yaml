base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/008.yaml
  text: So Tamar went to the house of her brother Amnon[a], while he was lying down. She took the dough, kneaded it, shaped it into cakes in his sight[b], and cooked the cakes.
translation:
  language: sw
  text: Basi Tamari akaenda nyumbani kwa Amnoni, ndugu yake, ambaye alikuwa amelala. Akachukua donge la unga, akalikanda na kulifanyiza mikate[a] mbele ya macho yake, kisha akapika mikate hiyo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulifanyiza mikate yenye umbo la moyo.” Kitenzi na nomino za Kiebrania ni nadra na huenda zikadokeza umbo linalohusiana na neno “moyo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akaichemsha.” Kitenzi cha Kiebrania kinaweza kumaanisha kuchemsha hasa, ingawa hapa huenda kimetumiwa kwa maana pana ya kupika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: Basi ... akaenda
  rationale: Muundo huu unaendeleza simulizi kwa Kiswahili cha kawaida na pia unaonyesha kuwa tendo hilo lilifuata maagizo yaliyotangulia.
- source_word: בֵּית אַמְנוֹן
  choice: nyumbani kwa Amnoni
  rationale: Hii ni namna ya asili ya Kiswahili ya kutaja kwenda katika nyumba au makao ya mtu.
- source_word: אָחִיהָ
  choice: ndugu yake
  rationale: Nomino ya Kiebrania hapa humaanisha ndugu wa kiume; muktadha na jina Amnoni huweka hilo wazi bila kulazimisha usemi mzito wa Kiswahili.
- source_word: וְהוּא שֹׁכֵב
  choice: ambaye alikuwa amelala
  rationale: Inaeleza hali ya Amnoni wakati Tamari alipofika, bila kuongeza dhana ya kuwa kitandani ambayo haijasemwa wazi.
- source_word: הַבָּצֵק
  choice: donge la unga
  rationale: Ni usemi wa kawaida wa Kiswahili kwa unga uliokwisha changanywa kwa ajili ya kukandwa.
- source_word: וְתָלֹשׁ
  choice: akalikanda
  rationale: Kitenzi לוש hutaja hasa kukanda donge la unga.
- source_word: וַתְּלַבֵּב
  choice: kulifanyiza mikate
  rationale: Kitenzi hiki ni nadra na kinahusiana na jina la chakula katika kishazi kinachofuata. Tafsiri hii inaonyesha kitendo cha kufanyiza bila kuamua kwa uhakika kwamba mikate ilikuwa na umbo la moyo.
- source_word: לְעֵינָיו
  choice: mbele ya macho yake
  rationale: Inahifadhi picha halisi ya Kiebrania na kueleza kwamba Amnoni aliweza kuona maandalizi hayo.
- source_word: וַתְּבַשֵּׁל
  choice: akaipika
  rationale: Kitenzi kinaweza kutaja kuchemsha hasa, lakini pia hutumiwa kwa maana pana ya kupika; neno la jumla linahifadhi kutokuwa na uhakika kuhusu njia iliyotumiwa.
- source_word: הַלְּבִבוֹת
  choice: mikate hiyo
  rationale: Hili ni jina la chakula kilichofanyizwa kutokana na donge la unga. ‘Mikate’ ni wazi na halidai kwa uhakika umbo linalodokezwa tu na asili ya neno.
