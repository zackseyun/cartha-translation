base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/016.yaml
  text: But she said to him[a], “No, because this great wrong of sending me away is greater than the other that you did to me.” But he would not listen to her.
translation:
  language: sw
  text: Lakini akamwambia[a], “Hapana! Kwa maana uovu huu mkubwa wa kuniondoa ni mkubwa kuliko ule mwingine ulionitendea.” Lakini hakukubali kumsikiliza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa muundo wa karibu zaidi na Kiebrania: “Usifanye hivyo, kwa maana uovu huu mkubwa—kuniondoa—ni mkubwa kuliko ule mwingine ulionitendea.” Kiebrania hapa kimefupishwa na muundo wake ni mgumu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Hapana!
  rationale: Ingawa mara nyingi neno hili huanzisha katazo, hapa sentensi ya Kiebrania imefupishwa na neno hilo linaonyesha pingamizi la haraka la Tamari. ‘Hapana!’ ni Kiswahili cha kawaida kinachobakiza nguvu ya upinzani wake.
- source_word: אוֹדֹת
  choice: Kwa maana
  rationale: Hapa linaunganisha pingamizi la Tamari na sababu inayofuata. ‘Kwa maana’ hutoa uhusiano huo kwa Kiswahili cha asili bila kuufanya mstari kuwa mgumu.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: uovu huu mkubwa
  rationale: רָעָה linaweza kumaanisha uovu, ubaya, madhara, au tendo baya. ‘Uovu’ huhifadhi uzito wa kimaadili wa tendo hilo, na ‘mkubwa’ hutafsiri kivumishi kilicho wazi katika Kiebrania.
- source_word: מֵאַחֶרֶת אֲשֶׁר עָשִׂיתָ עִמִּי
  choice: kuliko ule mwingine ulionitendea
  rationale: Kivumishi cha kike ‘mwingine’ kinarejelea uovu mwingine uliodokezwa. Kiswahili kinahitaji kiwakilishi ‘ule’ kinachorejelea ‘uovu’ bila kuongeza maelezo yasiyokuwamo katika Kiebrania.
- source_word: לְשַׁלְּחֵנִי
  choice: wa kunifukuza
  rationale: Kitenzi שׁלח katika muktadha huu ni kumwondoa au kumfukuza mtu. ‘Kunifukuza’ huonyesha kwamba Tamari anaondolewa kwa nguvu, si kuagwa tu.
- source_word: וְלֹא אָבָה לִשְׁמֹעַ לָהּ
  choice: Lakini hakukubali kumsikiliza
  rationale: אָבָה linaonyesha kutaka au kukubali kwa hiari; muundo hasi unaonyesha kukataa. ‘Hakukubali kumsikiliza’ huhifadhi kipengele hicho cha kukataa kwa makusudi.
- source_word: לּוֹ
  choice: akamwambia
  rationale: Kiambishi cha yambwa katika ‘akamwambia’ kinatafsiri kwa kawaida maana ya ‘akamwambia yeye’ bila kurudia kiwakilishi kisichohitajika.
