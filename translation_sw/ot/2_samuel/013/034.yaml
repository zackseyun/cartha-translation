base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/034.yaml
  text: But Absalom fled[a]. And the young man who was watching lifted up his eyes and saw, and behold, many people were coming by the road behind him[c][b], from the side of the mountain.
translation:
  language: sw
  text: Lakini Absalomu akakimbia. Yule kijana aliyekuwa akitazama akainua macho yake[a], akaona, na tazama, umati mkubwa wa watu ulikuwa ukija kwa njia iliyokuwa nyuma yake, kutoka upande wa mlima[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “akainua macho yake,” nahau yenye maana ya kutazama juu.'
    reason: lexical_alternative
  - marker: b
    text: Au, “wakija kutoka katika njia iliyokuwa nyuma yake, kando ya mlima.” Uhusiano kamili wa mahali katika Kiebrania umeelezwa kwa maneno yaliyobanwa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: akakimbia
  rationale: Kitenzi ברח huonyesha kukimbia ili kuondoka au kujiokoa; “akakimbia” ni cha kawaida na kinaendeleza simulizi kwa uwazi.
- source_word: אַבְשָׁלוֹם
  choice: Absalomu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: הַנַּעַר הַצֹּפֶה
  choice: yule kijana aliyekuwa akilinda
  rationale: Tafsiri hii inahifadhi maana zote mbili za נַעַר, “kijana,” na צֹפֶה, mtu anayelinda au kutazama, bila kudai cheo rasmi cha mlinzi.
- source_word: וַיִּשָּׂא ... אֶת עֵינוֹ
  choice: akatazama juu
  rationale: Hii ni nahau ya Kiebrania yenye maana ya kuinua macho na kutazama; Kiswahili cha asili hutumia “kutazama juu.”
- source_word: וַיַּרְא וְהִנֵּה
  choice: akaona
  rationale: Katika muktadha huu “akaona” huwasilisha ugunduzi wa ghafla kwa Kiswahili cha simulizi; nguvu ya הִנֵּה inaeleweka katika mtiririko bila kutumia “tazama,” ambayo ingesikika kama amri kwa msomaji.
- source_word: עַם רַב
  choice: umati mkubwa wa watu
  rationale: עַם רַב ni kundi kubwa la watu; “umati mkubwa wa watu” ni wazi na wa kawaida katika Kiswahili.
- source_word: הֹלְכִים
  choice: ukija
  rationale: Ingawa הלך kimsingi ni kwenda au kutembea, kwa mtazamo wa kijana kundi lilikuwa likikaribia, hivyo “ukija” huonyesha mwelekeo huo kwa kawaida.
- source_word: מִדֶּרֶךְ אַחֲרָיו
  choice: kwa njia iliyokuwa nyuma yake
  rationale: Muundo wa Kiebrania umebanwa na kiwakilishi chake kinaweza kueleweka kwa zaidi ya njia moja; tafsiri hii inabaki karibu na maana ya mahali bila kukifafanua kupita kiasi.
- source_word: מִצַּד הָהָר
  choice: kutoka upande wa mlima
  rationale: צַד ni upande na הָר ni mlima; msemo huu ni wa moja kwa moja na wa asili katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa urahisi. Nahau isiyo ya kawaida ya kuinua macho imetafsiriwa kwa maana yake na kuonyeshwa katika tanbihi; utata wa maelezo ya njia na upande wa mlima umehifadhiwa kwa tanbihi.
