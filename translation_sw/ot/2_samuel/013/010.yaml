base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/010.yaml
  text: Then Amnon said to Tamar[a], “Bring the food into the inner room, so that I may eat from your hand.” So Tamar took the cakes she had made and brought them into the inner room to Amnon her brother.
translation:
  language: sw
  text: Ndipo Amnoni akamwambia Tamari, “Leta chakula katika chumba cha ndani, ili nile kutoka mkononi mwako.” Basi Tamari akachukua mikate aliyokuwa ametengeneza, akazileta kwa Amnoni, ndugu yake, ndani ya chumba cha ndani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבִיאִי
  choice: Leta
  rationale: Ni amri ya kike umoja inayomwelekeza Tamari kupeleka chakula mahali alipo Amnoni; “leta” ni ya kawaida na sahihi katika muktadha huu.
- source_word: הַבִּרְיָה
  choice: chakula
  rationale: Nomino hii inaashiria chakula kilichoandaliwa kwa ajili ya kuliwa, bila kutaja aina yake kwa usahihi zaidi kuliko Kiebrania.
- source_word: הַחֶדֶר / הֶחָדְרָה
  choice: katika chumba cha ndani / ndani ya chumba hicho
  rationale: חֶדֶר ni chumba cha ndani au cha faragha. Tafsiri hii inaonyesha mazingira yaliyotengwa; katika sehemu ya pili, “chumba hicho” hudumisha rejeo lilelile kwa Kiswahili cha asili.
- source_word: וְאֶבְרֶה
  choice: ili nile
  rationale: Muundo wa kusudi baada ya amri unawakilishwa kwa kawaida na kwa ufupi kwa “ili nile.”
- source_word: מִיָּדֵךְ
  choice: kutoka mkononi mwako
  rationale: Tafsiri ya karibu ya nahau ya Kiebrania inadumisha ombi la Amnoni lenye ukaribu wa kimakusudi.
- source_word: הַלְּבִבוֹת
  choice: mikate
  rationale: Neno hilo linarejelea vyakula maalumu vya unga ambavyo Tamari alikuwa ametengeneza; “mikate” ni neno linaloeleweka bila kubainisha aina isiyothibitishwa.
- source_word: אָחִיהָ
  choice: ndugu yake
  rationale: Uhusiano wa kindugu umetajwa wazi katika Kiebrania na ni muhimu kwa uzito wa simulizi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha simulizi na chenye hadhi. Majina yametolewa kama Amnoni na Tamari. Muundo wa “kutoka mkononi mwako” umehifadhiwa licha ya kuwa wa karibu na Kiebrania kwa sababu una umuhimu wa kimuktadha.
