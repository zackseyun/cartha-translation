  text: But Absalom fled and went to Geshur[b][a], and he was there three years.
translation:
  language: sw
  text: Lakini[a] Absalomu akakimbia, akaenda Geshuri, akakaa huko miaka mitatu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na Absalomu akakimbia, akaenda Geshuri.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa “na” au “lakini” kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa neno kwa neno, “akawa huko miaka mitatu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם
  choice: Lakini Absalomu
  rationale: Kiunganishi וְ kinaweza kumaanisha “na” au, kulingana na muktadha wa simulizi, “lakini.” Hapa “lakini” kinaonyesha kwa kawaida tofauti ndogo na kurejelea tena tendo la Absalomu.
- source_word: בָּרַח
  choice: akakimbia
  rationale: Kitenzi ברח humaanisha kukimbia au kutoroka. “Akakimbia” ni lugha ya kawaida na huhifadhi wazo la kuondoka kwa haraka ili kujiepusha na hatari.
- source_word: וַ/יֵּלֶךְ
  choice: akaenda
  rationale: הלך katika mfululizo huu wa simulizi humaanisha moja kwa moja “kwenda”; “akaenda” linaendeleza mtiririko wa matendo kwa Kiswahili cha asili.
- source_word: גְּשׁוּר
  choice: Geshuri
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: וַ/יְהִי שָׁם
  choice: akakaa huko
  rationale: Kiebrania kwa neno kwa neno ni “akawa huko,” lakini pamoja na kipindi cha muda usemi huo humaanisha kwamba alikaa huko; “akakaa huko” ni Kiswahili cha kawaida bila kuongeza wazo lisilokuwamo katika muktadha.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: miaka mitatu
  rationale: Hii ndiyo tafsiri ya kawaida ya kirai cha idadi kinachoonyesha muda.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mfululizo wa vitenzi vya “aka-” umetumiwa kuakisi mwendo wa simulizi la Kiebrania.
