  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/לְ/אַמְנ֣וֹן רֵ֗עַ וּ/שְׁמ/וֹ֙ יֽוֹנָדָ֔ב בֶּן שִׁמְעָ֖ה אֲחִ֣י דָוִ֑ד וְ/י֣וֹנָדָ֔ב אִ֥ישׁ חָכָ֖ם מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/003.yaml
  text: Amnon had a friend[a], whose name was Jonadab son of Shimeah, David’s brother; and Jonadab was a very shrewd man.
translation:
  language: sw
  text: Amnoni alikuwa na rafiki aliyeitwa Yonadabu, mwana wa Shimea, ndugu yake Daudi. Yonadabu alikuwa mtu mwerevu sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu mwenye hekima sana” au “mtu mwenye akili nyingi.” Neno la Kiebrania linaweza kumaanisha hekima kwa upana; “mwerevu” limetumiwa hapa kwa sababu simulizi linalofuata linaonyesha kuwa ufahamu wa Yonadabu ulitumika kwa njia yenye shaka ya kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵעַ
  choice: rafiki
  rationale: Nomino hii humaanisha rafiki, mwenzi, au mtu wa karibu. “Rafiki” ni tafsiri ya kawaida na ya asili katika muktadha huu.
- source_word: וּלְאַמְנוֹן
  choice: Amnoni alikuwa na
  rationale: Muundo wa Kiebrania wenye kihusishi kwa jina la Amnoni unaonyesha umilikaji au hali; Kiswahili huiwasilisha kwa kawaida kwa “alikuwa na.” Kiunganishi hakijatafsiriwa kwa neno la wakati lisilokuwapo katika chanzo.
- source_word: וּשְׁמוֹ
  choice: aliyeitwa
  rationale: Huu ni mtindo wa kawaida wa kutaja jina. “Aliyeitwa” ni Kiswahili cha asili kinachounganisha maelezo ya rafiki bila kubadili maana.
- source_word: בֶּן שִׁמְעָה
  choice: mwana wa Shimea
  rationale: Huu ni usemi wa moja kwa moja wa ukoo; majina yamenukuliwa kwa umbo linalofaa Kiswahili.
- source_word: אֲחִי דָוִד
  choice: ndugu yake Daudi
  rationale: Mfuatano huu unamtambulisha Shimea kuwa ndugu wa Daudi. Kuwekwa mara tu baada ya “Shimea” kunalinda uhusiano huo wa kisarufi.
- source_word: אִישׁ חָכָם מְאֹד
  choice: mtu mwerevu sana
  rationale: חָכָם inaweza kumaanisha mwenye hekima au mwenye akili na ustadi. “Mwerevu” huhifadhi wazo la uwezo mkubwa wa kufikiri bila kulazimisha sifa chanya ya kimaadili, kwa kuwa simulizi linalofuata linaonyesha ushauri wake wenye shaka ya kimaadili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima, na inayoeleweka kwa urahisi. Sentensi mbili zimetumiwa ili kuepuka msururu mzito wa vishazi na kudumisha uwazi. Alama ya tanbihi imewekwa baada ya “mwerevu sana,” kwa kuwa tanbihi inahusu חָכָם wala si רֵעַ.
