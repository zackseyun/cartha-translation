translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Majina yametolewa katika maumbo yaliyozoeleka ya Kiswahili: Absalomu na Amnoni. Kauli fupi “Kama sivyo” imehifadhi hali ya Kiebrania ya kuacha maneno yadokezwe.'
