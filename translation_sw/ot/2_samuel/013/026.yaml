base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/026.yaml
  text: Then Absalom said[a], “If not, please let my brother Amnon go with us.” But the king said to him, “Why should he go with you?”
translation:
  language: sw
  text: Ndipo Absalomu akasema[a], “Kama sivyo, tafadhali ndugu yangu Amnoni aende pamoja nasi.” Lakini mfalme akamwambia, “Kwa nini aende pamoja nawe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi, “Kama wewe hutakwenda, tafadhali ndugu yangu Amnoni aende pamoja nasi.” Kiebrania kinaacha baadhi ya maneno yaeleweke kutokana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema / Lakini ... akamwambia
  rationale: Kiunganishi cha masimulizi kinaendeleza tukio. “Ndipo” kinafaa katika kauli ya kwanza, na “Lakini” kinaonyesha mgeuko kwenda kwenye jibu la mfalme; kiambishi cha mtendewa katika “akamwambia” kinawakilisha לֹו.
- source_word: וָלֹא
  choice: Kama sivyo
  rationale: Hii ni kauli fupi yenye sehemu iliyoachwa kueleweka kutokana na muktadha. Tafsiri hii inadumisha ufupi na utata wa Kiebrania bila kuingiza wazi maneno yaliyodokezwa.
- source_word: נָא
  choice: tafadhali
  rationale: Ni chembe ya ombi la heshima; “tafadhali” ni Kiswahili cha sasa na cha kawaida kinachohifadhi sauti ya kusihi.
- source_word: יֵלֶךְ
  choice: aende / Kwa nini aende
  rationale: Katika ombi la Absalomu, hali ya kusihi inaelezwa kwa “aende.” Katika swali la mfalme, “Kwa nini aende” ni njia ya kawaida ya kuonyesha swali la kupinga au kutaka sababu.
- source_word: אִתָּנוּ
  choice: pamoja nasi
  rationale: Inaonyesha kwenda katika ushirika na kundi la msemaji.
- source_word: אַמְנוֹן אָחִי
  choice: Amnoni ndugu yangu
  rationale: Mpangilio huu unafuata kwa karibu mpangilio wa Kiebrania na bado ni wa kawaida na unaoeleweka katika Kiswahili.
- source_word: לָמָה
  choice: Kwa nini
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya neno la kuuliza sababu.
- source_word: עִמָּךְ
  choice: pamoja nawe
  rationale: Inaonyesha kuwa anayezungumziwa ni Absalomu peke yake; “nawe” ni umoja kama ilivyo katika Kiebrania.
