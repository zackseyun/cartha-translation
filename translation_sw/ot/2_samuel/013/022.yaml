base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/022.yaml
  text: And Absalom did not speak with Amnon[a], either bad or good[b], because Absalom hated Amnon because he had violated Tamar his sister.
translation:
  language: sw
  text: Absalomu hakusema na Amnoni neno baya wala jema[a], kwa sababu Absalomu alimchukia Amnoni kwa kuwa Amnoni alikuwa amemnajisi Tamari, dada yake Absalomu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “hakusema na Amnoni, baya wala jema”; huu ni usemi unaomaanisha kwamba hakumwambia chochote.
    reason: lexical_alternative
  - marker: b
    text: Yaani, dada ya Absalomu. Kitenzi cha Kiebrania kinaweza kumaanisha “alikuwa amemdhalilisha” au “amemtesa”; katika muktadha huu kinarejelea kumtendea unajisi wa kingono.
    reason: ambiguity_and_lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... עִם
  choice: hakusema na
  rationale: Muundo huu humaanisha kusema au kuzungumza na mtu; Kiswahili hiki kinahifadhi kihusishi na uhusiano kati ya wahusika.
- source_word: לְמֵרָע וְעַד טוֹב
  choice: neno lolote, baya wala jema
  rationale: Huu ni usemi wa pande mbili unaomaanisha kwamba hakusema chochote; tafsiri inahifadhi jozi ya ‘baya’ na ‘jema’ huku ikifanya maana ieleweke kwa Kiswahili cha kawaida.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya Absalomu kutosema na Amnoni.
- source_word: שָׂנֵא
  choice: alimchukia
  rationale: Kitenzi kinaonyesha chuki yenye nguvu na ya wazi.
- source_word: עַל דְּבַר אֲשֶׁר
  choice: kwa kuwa
  rationale: Katika muktadha huu kirai kinatanguliza sababu ya chuki; ‘kwa kuwa’ ni cha asili na wazi kwa Kiswahili.
- source_word: עִנָּה
  choice: alikuwa amemnajisi
  rationale: Katika muktadha wa shambulio la kingono dhidi ya Tamari, kitenzi kinamaanisha kumtendea unyama wa kingono na kumvunjia heshima; ‘amnajisi’ huwasilisha uzito huo bila kuongeza istilahi mahususi zaidi ya kitenzi cha Kiebrania.
- source_word: אֲחֹתוֹ
  choice: dada yake
  rationale: Kiwakilishi kinamrejelea Absalomu na kuhifadhi uhusiano wa kifamilia unaoeleza chuki yake.
theological_decisions:
- issue: Kiwakilishi katika ‘dada yake’
  choice: Kinarejelea Absalomu
  alternative: Kinaweza kudhaniwa kumrejelea Amnoni katika Kiswahili bila ufafanuzi
  rationale: Kisarufi na kimuktadha, Tamari ametambulishwa kama dada ya Absalomu; tafsiri inadumisha muundo wa chanzo, na tanbihi inaondoa uwezekano wa utata wa Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Amemnajisi’ limetumiwa kueleza ukiukaji wa kingono kwa uwazi wa kiasi na bila lugha ya kupunguza uzito wa tukio.
