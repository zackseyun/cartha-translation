base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/032.yaml
  text: Then Jonadab son of Shimeah[a], David’s brother, answered and said, “Let not my lord say, ‘They have killed all the young men, the king’s sons,’ for Amnon alone is dead[b]. For this had been determined by Absalom from the day he violated Tamar his sister.”
translation:
  language: sw
  text: Ndipo Yonadabu mwana wa Shimea, ndugu yake Daudi, akajibu na kusema, “Bwana wangu asiseme, ‘Wamewaua vijana wote, wana wa mfalme,’ kwa maana ni Amnoni peke yake aliyekufa. Kwa maana jambo hili lilikuwa limeamuliwa na Absalomu[a] tangu siku Amnoni alipomdhalilisha[b] Tamari, dada yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lilikuwa limewekwa kwa neno au amri ya Absalomu,” yaani, lilikuwa limeamuliwa kulingana na kusudi lake thabiti.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kinaweza kumaanisha “alipomdhalilisha” au “alipomtesa”; katika muktadha huu kinamaanisha kwamba alimbaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: akajibu na kusema
  rationale: Inahifadhi mtindo rasmi wa simulizi la Kiebrania huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: אֲחִי דָוִד
  choice: ndugu yake Daudi
  rationale: Muundo huu unamtambulisha Shimea kuwa ndugu wa Daudi, si Yonadabu.
- source_word: אַל יֹאמַר אֲדֹנִי
  choice: Bwana wangu asiseme
  rationale: Huwasilisha katazo lenye heshima la lugha ya kifalme bila kutumia Kiswahili cha kizamani kisichoeleweka kwa urahisi.
- source_word: הַנְּעָרִים בְּנֵי הַמֶּלֶךְ
  choice: vijana wote, wana wa mfalme
  rationale: Neno נְעָרִים hapa linawarejelea wana wa mfalme waliokuwa kwenye karamu; apposition imehifadhiwa.
- source_word: הֵמִיתוּ
  choice: wamewaua
  rationale: Hiphil ya מות ina maana ya kuua; wingi wa kitenzi umehifadhiwa.
- source_word: אַמְנוֹן לְבַדּוֹ מֵת
  choice: ni Amnoni peke yake aliyekufa
  rationale: Muundo huu unaweka mkazo wa לְבַדּוֹ kwa Kiswahili cha kawaida na wazi.
- source_word: עַל פִּי אַבְשָׁלוֹם הָיְתָה שׂוּמָה
  choice: jambo hili lilikuwa limeamuliwa na Absalomu
  rationale: Huwasilisha wazo la mpango au azimio lililowekwa na Absalomu bila kulazimisha עַל־פִּי kumaanisha amri rasmi pekee.
- source_word: מִיּוֹם עַנֹּתוֹ
  choice: tangu siku alipomdhalilisha
  rationale: Pi'el ya ענה inaweza kueleza kudhalilisha au kutenda ukatili, na katika muktadha huu ni unyanyasaji wa kingono. Neno kuu linahifadhi upana wa kitenzi, huku tanbihi ikieleza maana ya wazi ya muktadha.
- source_word: אֲחֹתוֹ
  choice: dada yake
  rationale: Tafsiri ya moja kwa moja ya kiwakilishi cha umilikaji; Kiswahili kinahifadhi uhusiano uliotajwa katika chanzo.
theological_decisions:
- issue: Kiwango cha uwazi kuhusu tendo la Amnoni dhidi ya Tamari
  choice: alipomdhalilisha, pamoja na tanbihi inayosema kuwa katika muktadha huu maana ni kumbaka
  alternative: alipombaka
  rationale: Hii inahifadhi upana wa kileksika wa ענה huku isifiche kwamba simulizi linazungumzia ubakaji; hakuna msimamo wa kimadhehebu unaoingizwa.
- issue: Maana ya עַל־פִּי אַבְשָׁלוֹם
  choice: limeamuliwa na Absalomu
  alternative: limeamuliwa kwa amri ya Absalomu
  rationale: Nahau inaweza kuonyesha neno, amri, kusudi, au azimio la Absalomu. Tafsiri kuu haifungi maana katika ‘amri’ pekee, na tanbihi inahifadhi uwezekano huo.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Yonadabu, Shimea, Daudi, Amnoni, Absalomu, na Tamari. Alama zote za tanbihi zimewekwa karibu na vifungu vinavyozieleza, badala ya kufuata uwekaji usiolingana wa safu ya mashauriano ya Kiingereza.'
