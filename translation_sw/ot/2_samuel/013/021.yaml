translation:
  language: sw
  text: Mfalme Daudi aliposikia mambo hayo yote, alikasirika sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ
  choice: Mfalme ... alipo-
  rationale: Kiunganishi וְ kinaendeleza simulizi. Muundo wa Kiswahili wenye alipo- unaonyesha kwa kawaida uhusiano wa wakati na mfuatano wa matukio bila kupoteza maana.
- source_word: דָּוִד
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hilo katika Biblia za Kiswahili.
- source_word: שָׁמַע
  choice: alisikia
  rationale: Kitenzi hiki humaanisha ‘kusikia’; hapa kinahusu Daudi kupata habari za yaliyotokea.
- source_word: אֵת
  choice: '[hakijatafsiriwa kando]'
  rationale: Ni alama ya yambwa bainifu katika Kiebrania na hakina neno huru linalolingana nacho katika Kiswahili.
- source_word: כָּל
  choice: yote
  rationale: Huonyesha ujumla wa mambo yanayotajwa.
- source_word: הַ/דְּבָרִים
  choice: mambo
  rationale: דְּבָרִים linaweza kumaanisha maneno, mambo, au matukio. Katika muktadha huu ‘mambo’ linajumuisha taarifa ya yaliyowapata Tamari na Amnoni.
- source_word: הָ/אֵלֶּה
  choice: hayo
  rationale: Kionyeshi hiki kinarejelea mambo yaliyosimuliwa tayari; ‘hayo’ ni cha kawaida na cha asili katika Kiswahili.
- source_word: וַ/יִּחַר ל֖/וֹ
  choice: alikasirika
  rationale: Hii ni nahau ya Kiebrania yenye wazo la kuwaka kwa hasira. ‘Alikasirika’ hutoa maana yake kwa Kiswahili cha kawaida bila kuongeza nomino ‘hasira,’ ambayo haijaandikwa wazi katika kifungu hicho.
- source_word: מְאֹד
  choice: sana
  rationale: Ni kielezi cha kusisitiza kiwango kikubwa; ‘sana’ ndilo neno la kawaida la Kiswahili hapa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi, na chenye hadhi. Tafsiri inadumisha mfuatano wa simulizi na kutumia nahau ya kawaida ya Kiswahili. Hakuna tanbihi iliyowekwa kwa kuwa maana halisi ya nahau ya Kiebrania inaweza kutolewa kikamilifu kwa ‘alikasirika sana’ bila upotevu muhimu wa maana.
