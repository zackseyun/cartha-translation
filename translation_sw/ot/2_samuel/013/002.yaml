translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Jina תָּמָר limetolewa kama “Tamari,” na אַמְנוֹן kama “Amnoni,” kulingana na maumbo yanayotamkika kwa urahisi katika Kiswahili. Utata wa לְהִתְחַלּוֹת umehifadhiwa katika tanbihi, huku maandishi makuu yakichagua matokeo ya kuwa mgonjwa ili kuepuka maana ya kujisingizia ugonjwa.
