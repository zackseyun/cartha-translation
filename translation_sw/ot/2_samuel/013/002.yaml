base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/002.yaml
  text: Amnon was so distressed that he made himself sick because of Tamar his sister[a], for she was a virgin[b], and it seemed impossible in Amnon’s eyes to do anything to her.
translation:
  language: sw
  text: Amnoni alitaabika sana hata akawa mgonjwa kwa sababu ya Tamari dada yake[a], kwa maana alikuwa bikira. Amnoni aliona kuwa haiwezekani kumfanyia jambo lolote[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alitaabika sana kiasi cha kujisababishia ugonjwa kwa sababu ya Tamari dada yake.” Usemi wa Kiebrania unaweza kueleweka kuwa Amnoni akawa mgonjwa au kwamba alijisababishia ugonjwa.
    reason: lexical_alternative
  - marker: b
    text: Usemi huu wa Kiebrania unamaanisha kwamba, kwa mtazamo wa Amnoni, hakuona njia inayowezekana ya kufanya jambo lolote kwake.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֶר
  choice: alitaabika sana
  rationale: Kitenzi hiki katika muktadha huu kinaonyesha dhiki kali ya ndani. “Alitaabika sana” ni Kiswahili cha kawaida kinachoonyesha uzito wa hali hiyo bila kuongeza sababu au hukumu isiyosemwa wazi katika Kiebrania.
- source_word: לְהִתְחַלּוֹת
  choice: hata akawa mgonjwa
  rationale: Muundo wa Kiebrania unaweza kumaanisha kuwa mgonjwa au kujisababishia ugonjwa. Tafsiri hii inaonyesha matokeo ya dhiki yake na huepuka “akajifanya mgonjwa,” ambayo kwa Kiswahili mara nyingi humaanisha kujisingizia ugonjwa.
- source_word: בַּעֲבוּר
  choice: kwa sababu ya
  rationale: Hapa kihusishi kinaonyesha kisababishi, si faida; “kwa sababu ya” ni usemi wa kawaida na sahihi.
- source_word: אֲחֹתוֹ
  choice: dada yake
  rationale: Neno la undugu limedumishwa kwa kuwa uhusiano huu ni muhimu katika simulizi.
- source_word: בְתוּלָה
  choice: alikuwa bikira
  rationale: “Bikira” hutoa maana ya moja kwa moja ya neno la Kiebrania na inaeleweka katika Kiswahili cha sasa.
- source_word: וַיִּפָּלֵא בְּעֵינֵי אַמְנוֹן
  choice: Amnoni aliona kuwa haiwezekani
  rationale: Nahau hiyo inaonyesha kwamba kwa mtazamo wa Amnoni jambo hilo lilikuwa gumu kupita kiasi au lisilowezekana. Muundo huu ni wa asili katika Kiswahili na unadumisha kwamba huo ulikuwa mtazamo wake.
- source_word: לַעֲשׂוֹת לָהּ מְאוּמָה
  choice: kumfanyia jambo lolote
  rationale: Tafsiri hii inadumisha upana na hali yenye utata ya Kiebrania bila kutaja mapema tendo la baadaye katika simulizi.
