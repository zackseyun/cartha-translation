  text: Then Absalom came to the king and said, “Look, your servant has shearers. Please let the king and his servants go with your servant.”
translation:
  language: sw
  text: Kisha Absalomu akamwendea mfalme, akasema, “Tazama, mtumishi wako ana wakata manyoya ya kondoo. Tafadhali, mfalme aende pamoja na watumishi wake na mtumishi wako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹזְזִים
  choice: watu wanaokata manyoya ya kondoo
  rationale: Neno hili humaanisha wakataji wa manyoya; kutaja kondoo kwa uwazi kunaleta maana ya kawaida katika muktadha wa sherehe ya kukata manyoya bila kudai kuwa Absalomu mwenyewe ndiye anayekata.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Yahifadhi namna ya heshima ambayo Absalomu anatumia akizungumza na mfalme.
- source_word: הִנֵּה נָא
  choice: Tazama
  rationale: Yatoa mwito wa mfalme kuzingatia hali inayotajwa; chembe נָא hapa inalainisha kauli, huku ombi linalofuata likionyeshwa wazi kwa “Tafadhali”.
- source_word: יֵלֶךְ נָא
  choice: Tafadhali, ... waende
  rationale: Jussive pamoja na נָא ni ombi la heshima, si amri; “waende” inamhusu mfalme pamoja na watumishi wake.
