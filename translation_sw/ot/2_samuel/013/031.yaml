  yaml_path: translation/ot/2_samuel/013/031.yaml
  text: Then the king arose[a], tore his garments, and lay on the ground, and all his servants were standing with their garments torn.
translation:
  language: sw
  text: Ndipo mfalme akasimama[a], akararua mavazi yake, akajilaza ardhini. Watumishi wake wote walikuwa wamesimama, mavazi yao yakiwa yameraruliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kurarua mavazi kulikuwa desturi ya kuonyesha huzuni, mshtuko, au maombolezo katika Biblia ya Kiebrania.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: akasimama
  rationale: Kitenzi cha Kiebrania קום katika mfululizo wa simulizi kinaonyesha mfalme akiinuka kwa ghafula kuitikia habari alizosikia; “akasimama” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye uainisho inamrejelea mtawala anayejulikana katika muktadha, yaani Daudi; jina la cheo limehifadhiwa kwa kuwa maandishi hayatumii jina lake hapa.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: akararua mavazi yake
  rationale: קרע pamoja na בגדיו ni usemi wa kawaida wa kurarua mavazi kama ishara ya huzuni, mshtuko, au maombolezo. “Mavazi” linaendana na sajili yenye hadhi bila kuwa la kizamani.
- source_word: וַיִּשְׁכַּב אַרְצָה
  choice: akajilaza chini
  rationale: שכב na אַרְצָה huonyesha kujilaza kuelekea ardhini; “akajilaza chini” linaonyesha tendo na mkao kwa Kiswahili cha kawaida.
- source_word: וְכָל־עֲבָדָיו
  choice: Watumishi wake wote
  rationale: עבדים hapa inaweza kumaanisha watumishi au wahudumu wa ikulu. “Watumishi” ni pana na halilazimishi cheo maalumu kisichotajwa.
- source_word: נִצָּבִים
  choice: walikuwa wamesimama
  rationale: Kauli ya participle ya נצב inaeleza hali inayoendelea katika tukio; muundo huu wa Kiswahili huhifadhi hali hiyo.
- source_word: קְרֻעֵי בְגָדִים
  choice: mavazi yao yakiwa yameraruliwa
  rationale: Participle tendwa inaeleza hali ya mavazi baada ya kuraruliwa. Muundo huu unahifadhi maana ya matokeo na unasomeka kwa urahisi.
