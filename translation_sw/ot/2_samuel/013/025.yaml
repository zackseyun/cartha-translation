base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/025.yaml
  text: But the king said to Absalom, “No, my son, please let us not all go, lest we be a burden on you.” And he pressed him, but he was not willing to go; so he blessed him.
translation:
  language: sw
  text: Lakini mfalme akamwambia Absalomu, “La, mwanangu. Tafadhali tusiende sote, tusije tukawa mzigo kwako.” Absalomu akamsisitiza, lakini mfalme hakukubali kwenda; akambariki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל בְּנִי אַל נָא נֵלֵךְ כֻּלָּנוּ
  choice: La, mwanangu. Tafadhali tusiende sote
  rationale: 'Marudio ya אַל yanahifadhiwa kwa namna ya kawaida ya Kiswahili: kwanza kama jibu la kukataa, kisha kama ombi la kutokwenda wote.'
- source_word: וְלֹא נִכְבַּד עָלֶיךָ
  choice: tusije tukawa mzigo kwako
  rationale: Kitenzi כבד hapa humaanisha kuwa mzito au kuwa mzigo kwa mtu; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: וַיִּפְרָץ בּוֹ
  choice: Absalomu akamsisitiza
  rationale: Katika muktadha huu פרץ ב־ huonyesha kumsukuma au kumsihi mtu kwa nguvu; “akamsisitiza” huwasilisha uendelevu na nguvu ya ombi bila kuongeza maelezo yasiyokuwamo.
- source_word: וְלֹא אָבָה לָלֶכֶת
  choice: lakini mfalme hakukubali kwenda
  rationale: אָבָה ni kukubali au kuwa tayari. Kutaja “mfalme” huondoa utata wa kiwakilishi katika Kiswahili huku kukifuata kiima cha simulizi.
- source_word: וַיְבָרֲכֵהוּ
  choice: akambariki
  rationale: Maana ya kawaida ya ברך katika muktadha wa kuagana au kumpa heri imehifadhiwa bila kufafanua zaidi.
