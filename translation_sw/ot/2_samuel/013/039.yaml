  text: And King David longed to go out to Absalom, for he was comforted concerning Amnon, since he was dead.
translation:
  language: sw
  text: Mfalme Daudi akatamani kwenda kwa Absalomu,[a] kwa maana alikuwa amefarijika kuhusu Amnoni, kwa kuwa alikuwa amekufa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hapa kina utata; pia yaweza kutafsiriwa, “Mfalme Daudi akaacha kwenda kwa Absalomu.”
    reason: Umbo la kitenzi וַתְּכַל ni la kike ingawa kiima chake hakijaelezwa wazi, na hivyo huruhusu ufafanuzi wa “kutamani” au “kukoma.”
lexical_decisions:
- source_word: וַתְּכַל
  choice: akatamani
  rationale: Kitenzi hiki cha Kiebrania kina umbo la kike ingawa nomino inayotarajiwa, kama vile ‘nafsi,’ haijaandikwa. Kwa kuelewa nomino hiyo kuwa imedokezwa, kishazi kinaonyesha shauku kubwa ya Daudi. Hata hivyo, muundo huo una utata wa kweli, unaotajwa katika tanbihi.
- source_word: לָצֵאת אֶל אַבְשָׁלוֹם
  choice: kwenda kwa Absalomu
  rationale: Kauli hii kimsingi inaeleza kwenda au kutoka kuelekea kwa Absalomu. Kiswahili ‘kwenda kwa’ ni cha kawaida na hakiongezi kusudi ambalo halijaelezwa wazi.
- source_word: נִחַם עַל־אַמְנוֹן
  choice: alikuwa amefarijika kuhusu Amnoni
  rationale: Nifali ya נחם hapa ina maana ya kupata faraja baada ya huzuni; ‘kuhusu’ huhifadhi uhusiano mpana wa עַל bila kuufanya kuwa majuto.
theological_decisions:
- issue: Je, Daudi alitamani kwenda kwa Absalomu au aliacha kwenda dhidi yake?
  choice: Mfalme Daudi akatamani kwenda kwa Absalomu
  alternative: Mfalme Daudi akaacha kwenda dhidi ya Absalomu
  rationale: Maandishi ya Kimasoreti yanaweza kueleweka kana kwamba ‘nafsi’ ya Daudi, ambayo haijaandikwa, ndiyo iliyotamani; tafsiri nyingine huchukua כלה kwa maana ya kukoma na אֶל kwa mwelekeo wa uhasama. Tafsiri kuu inafuata usomaji wa shauku, huku tanbihi ikihifadhi utata wa kisarufi na kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. Majina yametolewa kama Daudi, Absalomu, na Amnoni; utata wa maandishi umehifadhiwa kwa tanbihi badala ya kutatuliwa kimyakimya.
