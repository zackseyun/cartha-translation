base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/029.yaml
  text: So Absalom’s young men did to Amnon as Absalom had commanded[a]. Then all the king’s sons arose[b], and each mounted his mule and fled.
translation:
  language: sw
  text: Basi vijana wa Absalomu[a] wakamtendea Amnoni kama Absalomu alivyoamuru.[b] Ndipo wana wote wa mfalme wakainuka; kila mmoja akapanda nyumbu wake, nao wakakimbia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi wa Absalomu” au “wahudumu wa Absalomu.” Neno la Kiebrania linaweza kumaanisha vijana waliokuwa katika utumishi.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa neno halisi, “wakamtendea Amnoni kama Absalomu alivyoamuru.” Mstari uliotangulia unataja agizo hilo waziwazi: wampige Amnoni, kisha wamuue, wakati moyo wake umechangamka kwa divai.'
    reason: cross_reference
lexical_decisions:
- source_word: נַעֲרֵי אַבְשָׁלוֹם
  choice: vijana wa Absalomu
  rationale: Neno נַעַר linaweza kumaanisha kijana, mtumishi, au mhudumu. “Vijana wa Absalomu” huhifadhi upana huo wa maana bila kuamua isivyolazimu hadhi yao katika nyumba yake.
- source_word: וַיַּעֲשׂוּ לְאַמְנוֹן
  choice: wakamtendea Amnoni
  rationale: Kirai hiki kinaeleza tendo lililofanywa kwa Amnoni bila kulitaja tena waziwazi; muktadha wa mstari uliotangulia unaonyesha kuwa walimuua. Tafsiri hii inadumisha ufupi wa Kiebrania.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: kama Absalomu alivyoamuru
  rationale: Hueleza kwamba walitekeleza agizo la awali la Absalomu sawasawa nalo.
- source_word: וַיָּקֻמוּ
  choice: wakainuka
  rationale: Ni tafsiri ya moja kwa moja inayofaa mtindo wa simulizi na kuonyesha mwitikio wao wa ghafla.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: wana wote wa mfalme
  rationale: Huhifadhi muundo na maana ya Kiebrania, ikirejelea wana wa kiume wa mfalme waliokuwapo.
- source_word: וַיִּרְכְּבוּ אִישׁ עַל פִּרְדּוֹ
  choice: kila mmoja akampanda nyumbu wake
  rationale: אִישׁ limetumiwa kwa maana ya mgawanyo, “kila mmoja,” na פֶּרֶד ni nyumbu.
- source_word: וַיָּנֻסוּ
  choice: wakakimbia
  rationale: Kitenzi נוּס kinaonyesha kukimbia kwa haraka ili kujiepusha na hatari.
