base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/017.yaml
  text: Then he called his young man who served him and said[a], “Please send this one away from me, outside[b], and bolt the door behind her.”
translation:
  language: sw
  text: Kisha akamwita kijana wake aliyekuwa akimhudumia, akamwambia, “Tafadhali, mwondoe huyu[a] kutoka mbele yangu, umtoe nje, kisha ufunge mlango kwa komeo[b] nyuma yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina neno “huyu” la kike, likimtaja Tamari kwa namna ya kumweka mbali na kumdharau.
    reason: lexical_alternative
  - marker: b
    text: Au “ufunge mlango nyuma yake.” Kitenzi cha Kiebrania kinaweza kumaanisha kufunga kwa komeo, kupiga bolti, au kufunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרוֹ מְשָׁרְתוֹ
  choice: kijana wake aliyekuwa akimhudumia
  rationale: Neno נַעַר linaweza kumaanisha kijana au mtumishi, na מְשָׁרְתוֹ linaeleza kwamba alikuwa akimhudumia Amnoni. Tafsiri hii inahifadhi maana zote mbili bila kulifanya fungu hilo kuwa cheo tu.
- source_word: שִׁלְחוּ נָא
  choice: Tafadhali, mwondoe … umtoe
  rationale: Kitenzi kinaamuru mtu aondolewe au atolewe nje, huku נָא ikiongeza ombi lenye msisitizo. “Tafadhali” huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: זֹאת
  choice: huyu
  rationale: Hiki ni kiwakilishi cha kuonyesha cha kike kinachomrejelea Tamari kwa sauti ya kumweka mbali na kumdharau. “Huyu” hakiongezi nomino isiyokuwamo katika Kiebrania na muktadha unaweka wazi anayerejelewa.
- source_word: מֵעָלַי הַחוּצָה
  choice: mbele yangu, umtoe nje
  rationale: מֵעָלַי ni usemi wa kumwondoa mtu kutoka mbele au uweponi mwa msemaji, na הַחוּצָה humaanisha kuelekea nje. Muundo huu wa Kiswahili unahifadhi vipengele vyote viwili kwa lugha inayoeleweka.
- source_word: וּנְעֹל הַדֶּלֶת
  choice: kisha ufunge mlango kwa komeo
  rationale: נעל inaweza kumaanisha kufunga kwa komeo, kupiga bolti, au kufungia. “Kufunga kwa komeo” inafaa mlango wa mazingira ya kale na inaonyesha kwamba mlango uliimarishwa, si kwamba ulifungwa tu.
- source_word: אַחֲרֶיהָ
  choice: nyuma yake
  rationale: Ingawa kihalisi inaweza kuwa “baada yake,” katika muktadha wa kufunga mlango baada ya mtu kutoka, “nyuma yake” ni usemi wa kawaida unaohifadhi picha ya Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Kauli ya Amnoni imeachwa ikiwa ya moja kwa moja na ya dharau; hakuna juhudi ya kuipunguza. “Aliyekuwa akimhudumia” ni ya asili zaidi kuliko tafsiri ngumu ya neno kwa neno, huku “kwa komeo” ikihifadhi mazingira ya mlango wa kale.
