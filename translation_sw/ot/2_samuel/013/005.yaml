translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mazungumzo yamewekwa kwa lugha rahisi na ya kawaida; ‘Tamari’ limetumiwa kama umbo la jina linalozoeleka katika tafsiri za Kiswahili. Tofauti kati ya kulishwa/provided nourishment na kuandaliwa kwa mlo imehifadhiwa, na sentensi ya kuona haijaongezewa kiwakilishi cha kitu kisichotajwa wazi katika Kiebrania.
