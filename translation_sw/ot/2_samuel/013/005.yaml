base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/005.yaml
  text: Jehonadab said to him[a], “Lie down on your bed and pretend to be sick. When your father comes to see you, say to him, ‘Please let Tamar my sister come and give me food, and let her prepare the meal in my sight[c][b], so that I may watch and eat from her hand.’”
translation:
  language: sw
  text: Yonadabu akamwambia, “Lala kitandani mwako na ujifanye mgonjwa[a]. Baba yako atakapokuja kukuona, mwambie, ‘Tafadhali, mwache Tamari, dada yangu, aje anipatie chakula[b]. Na aandae mlo[c] mbele yangu ili niweze kuona na kula kutoka mkononi mwake.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ujionyeshe kana kwamba wewe ni mgonjwa.” Kitenzi cha Kiebrania hapa kinamaanisha kujifanya au kuonekana mgonjwa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “mkate,” neno ambalo mara nyingi hutumiwa kwa maana pana ya chakula.
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania huenda linamaanisha chakula kilichoandaliwa hasa kwa ajili ya mgonjwa au mtu anayepata nafuu.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁכַב עַל מִשְׁכָּבְךָ
  choice: Lala kitandani mwako
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kulala au kujilaza juu ya kitanda, bila kuongeza wazo lisilokuwapo katika Kiebrania.
- source_word: וְהִתְחָל
  choice: ujifanye mgonjwa
  rationale: Katika muktadha huu hitpaeli ya חלה ina maana ya kujionyesha kana kwamba ni mgonjwa, si kujisababishia ugonjwa wa kweli.
- source_word: וּבָא אָבִיךָ לִרְאוֹתֶךָ
  choice: Baba yako atakapokuja kukuona
  rationale: Muundo wa wakati kwa ‘atakapokuja’ unaonyesha kwa kawaida mfuatano wa maagizo unaokusudiwa katika Kiebrania.
- source_word: תָּבֹא נָא
  choice: Tafadhali, mwache ... aje
  rationale: ‘Tafadhali’ huwasilisha ombi la heshima linaloonyeshwa na נָא, na ‘mwache ... aje’ linafaa kwa ombi linaloelekezwa kwa baba kuhusu Tamari.
- source_word: תָמָר אֲחוֹתִי
  choice: Tamari dada yangu
  rationale: Huhifadhi utambulisho wa kiambatisho katika usemi wa Amnoni kwa mtindo wa kawaida wa Kiswahili.
- source_word: וְתַבְרֵנִי לֶחֶם
  choice: aje anilishe chakula
  rationale: ברה hapa huhusu kumpa mgonjwa lishe au chakula. ‘Anilishe chakula’ huitofautisha na עשה, tendo la kuandaa linalofuata, huku לֶחֶם ikieleweka kwa maana pana ya chakula.
- source_word: וְעָשְׂתָה לְעֵינַי אֶת הַבִּרְיָה
  choice: Aandae mlo mbele yangu
  rationale: ‘Aandae’ huakisi עשה katika muktadha wa mapishi; ‘mlo’ huwakilisha הַבִּרְיָה, yaani chakula kilichoandaliwa, huenda hasa kwa mgonjwa, na ‘mbele yangu’ huhifadhi wazo la kuonekana kwa macho yake.
- source_word: לְמַעַן אֲשֶׁר אֶרְאֶה
  choice: ili niweze kuona
  rationale: Huhifadhi kitenzi halisi cha kuona bila kuingiza kitu cha moja kwa moja ambacho hakitajwi wazi katika Kiebrania.
- source_word: וְאָכַלְתִּי מִיָּדָהּ
  choice: kisha nile kutoka mkononi mwake
  rationale: Huhifadhi maelezo muhimu kwamba Tamari ndiye angempa chakula yeye binafsi, badala ya kusema tu kwamba Amnoni angekula.
