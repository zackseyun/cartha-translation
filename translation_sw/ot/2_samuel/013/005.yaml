  verdict: revise
  source_fidelity: 'Maana kuu ya Kiebrania imehifadhiwa: Yonadabu anamwagiza Amnoni ajifanye mgonjwa, amwombe baba yake Tamari aje, ampatie chakula, na aandae mlo mbele yake ili aone na ale kutoka mkononi mwake. Hata hivyo, "anilishe chakula" si usemi wa kawaida hapa na huifanya sehemu hii isisikike kwa urahisi.'
  naturalness: 'Marekebisho yanatumia Kiswahili sanifu cha sasa: "anipatie chakula" ni wazi na ya kawaida kwa kutoa chakula, huku "aandae mlo" ikihifadhi tofauti na tendo la kuandaa linalofuata. Kuunganisha "kuona na kula" chini ya "ili" kunafuata vizuri kusudi linaloonyeshwa na Kiebrania.'
  terminology: '"Yonadabu" na "Tamari" zinaendana na maumbo ya majina yaliyozoeleka katika Kiswahili cha Biblia. "Mlo" unafaa kwa הַבִּרְיָה, kwa maelezo ya tahadhari katika tanbihi kwamba huenda ulikuwa chakula cha mgonjwa au mtu anayepata nafuu. Tanbihi za mkate/chakula na kujifanya mgonjwa zinahifadhiwa.'
  issues:
  - severity: medium
    issue: Usemi "aje anilishe chakula"
    rationale: Kwa Kiswahili, "kulisha" kwa kawaida huchukua mtu kama anayelishwa; kuongeza "chakula" hapa ni mzito na si wa kawaida. "Aje anipatie chakula" hutoa kwa kawaida wazo la kumpa Amnoni chakula, bila kuchanganya na "aandae" inayofuata.
  - severity: low
    issue: '"ili niweze kuona, kisha nile" huweka mfuatano usiohitajika'
    rationale: Kiebrania huunganisha kuona na kula kama madhumuni yanayoratibiana. "ili niweze kuona na kula" ni karibu zaidi na muundo huo.
