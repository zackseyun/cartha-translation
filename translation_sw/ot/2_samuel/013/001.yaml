base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/001.yaml
  text: After this[a], Absalom son of David had a beautiful sister whose name was Tamar, and Amnon son of David loved her.
translation:
  language: sw
  text: Baada ya hayo, Absalomu mwana wa Daudi alikuwa na dada mrembo aliyeitwa Tamaru, naye Amnoni mwana wa Daudi akampenda[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alimtamani” au “alivutiwa naye sana.” Kitenzi cha Kiebrania ni neno la kawaida la “kupenda,” lakini simulizi linalofuata linaonyesha kwamba hisia za Amnoni zilikuwa potovu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Muundo huu unaanzisha tukio linalofuata katika simulizi. Kiswahili cha sasa hakihitaji tafsiri ya moja kwa moja ya וַיְהִי; “Baada ya hayo” huonyesha kwa kawaida na kwa usahihi mfuatano wa wakati.
- source_word: וּלְאַבְשָׁלוֹם בֶּן דָּוִד
  choice: Absalomu mwana wa Daudi alikuwa na
  rationale: Muundo wa Kiebrania unaoonyesha umilikaji kwa kihusishi לְ umetafsiriwa kwa muundo wa kawaida wa Kiswahili “alikuwa na.” Utambulisho “mwana wa Daudi” umehifadhiwa.
- source_word: אָחוֹת יָפָה
  choice: dada mzuri
  rationale: אָחוֹת ni “dada,” na יָפָה hapa humaanisha mwenye sura au umbo la kuvutia. “Mzuri” ni usemi wa kawaida wa Kiswahili kwa uzuri wa mtu katika muktadha huu.
- source_word: וּשְׁמָהּ תָּמָר
  choice: aliyeitwa Tamari
  rationale: Hii ni tafsiri ya asili ya kishazi cha kutaja jina katika Kiswahili, huku maana ya “jina lake lilikuwa Tamari” ikihifadhiwa.
- source_word: וַיֶּאֱהָבֶהָ
  choice: akampenda
  rationale: Kitenzi אהב ni neno la kawaida la Kiebrania la “kupenda.” Ingawa simulizi linalofuata linaonyesha kwamba hisia za Amnoni zilikuwa potovu, tafsiri kuu inadumisha neno la chanzo na mvutano wa simulizi.
- source_word: אַמְנוֹן בֶּן דָּוִד
  choice: Amnoni mwana wa Daudi
  rationale: Kurudiwa kwa “mwana wa Daudi” kumehifadhiwa ili kuonyesha wazi mahusiano ya kifalme na ya kifamilia yanayosisitizwa katika mstari.
theological_decisions:
- issue: Tafsiri ya אהב katika simulizi lenye uzito wa kimaadili
  choice: akampenda
  alternative: akamtamani / akashikwa na mahaba kwake
  rationale: Mstari wenyewe unatumia kitenzi cha kawaida cha “kupenda” bila kukifafanua. Kutumia “akampenda” huhifadhi mvutano wa kifasihi na kiteolojia, bila kuingiza mapema hukumu inayodhihirishwa na matukio yanayofuata.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Absalomu, Daudi, Tamari, na Amnoni. Alama ya tanbihi [a] imewekwa mara tu baada ya kitenzi kinachohusika.'
