  yaml_path: translation/ot/2_samuel/013/035.yaml
  text: Then Jonadab said to the king[a], “Look, the king’s sons have come; as your servant said, so it has happened.”
translation:
  language: sw
  text: Ndipo Yonadabu akamwambia mfalme, “Tazama, wana wa mfalme wamefika; kama mtumishi wako alivyosema, ndivyo ilivyotokea.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo wa simulizi wenye waw-consecutive unasogeza tukio mbele; “Ndipo” pamoja na kitenzi cha mfululizo huonyesha ufuatano kwa Kiswahili cha kawaida.
- source_word: יֽוֹנָדָב
  choice: Yonadabu
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: אֶל הַמֶּלֶךְ
  choice: akamwambia mfalme
  rationale: Kihusishi אֶל pamoja na kitenzi cha kusema kimetafsiriwa kwa muundo wa kawaida wa Kiswahili, “kumwambia” mtu.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwenye jambo linaloonekana mara hiyo; “Tazama” linadumisha msisitizo na hadhi bila kuwa gumu kueleweka.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: wana wa mfalme
  rationale: Muundo huu unahifadhi wingi na uhusiano wa kifalme; “wana” linafaa kwa wana wa kiume katika muktadha huu.
- source_word: בָּאוּ
  choice: wamefika
  rationale: Kauli timilifu inaeleza kuwasili kwao kulikothibitishwa sasa; “wamefika” ni ya asili zaidi katika Kiswahili kwa watu wanaoonekana baada ya kuwasili.
- source_word: כִּדְבַר עַבְדְּךָ
  choice: kama mtumishi wako alivyosema
  rationale: Tafsiri hii inawasilisha maana ya “kulingana na neno la mtumishi wako” kwa Kiswahili cha kawaida na kuhifadhi kujitaja kwa heshima katika mazingira ya kifalme.
- source_word: כֵּן הָיָה
  choice: ndivyo ilivyotokea
  rationale: Kauli hii inathibitisha kwamba jambo limetokea sawasawa na taarifa ya awali; muundo sambamba “kama ... ndivyo” unaakisi ulinganifu wa Kiebrania.
