  text: But Absalom pressed him[a], so he sent Amnon and all the king’s sons with him.
translation:
  language: sw
  text: Lakini Absalomu akamsisitiza[a], naye akamtuma Amnoni na wana wote wa mfalme pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamhimiza” / “akamshawishi kwa kusisitiza.” Nahau ya Kiebrania ina nguvu kuliko ombi la kawaida na inaonyesha shinikizo la kuendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרָץ בּוֹ
  choice: akamsisitiza
  rationale: Katika muktadha huu, kitenzi פרץ pamoja na בְּ ni nahau inayoonyesha kumsukuma mtu kwa ombi la kusisitiza, si ‘kuvunja’ kihalisi. ‘Akamsisitiza’ ni Kiswahili cha kawaida kinachohifadhi nguvu ya shinikizo la kuendelea.
- source_word: אַבְשָׁלוֹם
  choice: Absalomu
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: וַיִּשְׁלַח
  choice: akamtuma
  rationale: Katika muktadha, Daudi anakubali ombi na kumtuma Amnoni aende pamoja na Absalomu; ‘akamtuma’ huwasilisha maana ya שלח kwa kawaida.
- source_word: אִתּוֹ
  choice: pamoja naye
  rationale: Muundo wa Kiebrania unasema kihalisi ‘pamoja naye’; kiwakilishi kinaachwa ili kuhifadhi umbo na urejeo wake kwa Absalomu.
- source_word: אֶת אַמְנוֹן
  choice: Amnoni
  rationale: Kiashiria cha yambwa אֶת hakitafsiriwi; jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: וְאֵת כָּל בְּנֵי הַמֶּלֶךְ
  choice: na wana wote wa mfalme
  rationale: Huu ni muundo wa umilikaji unaowarejelea wana wa Daudi; ‘wana wote wa mfalme’ ni wa asili na wenye hadhi katika Kiswahili.
