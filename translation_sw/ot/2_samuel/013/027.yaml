translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata mtiririko wa simulizi na inahifadhi kiwakilishi ‘naye’ pamoja na nguvu ya nahau ya Kiebrania.
