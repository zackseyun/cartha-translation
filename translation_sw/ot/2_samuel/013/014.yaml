  text: But he would not listen to her[a], and he was stronger than she was[c][b], and he violated her and lay with her.
translation:
  language: sw
  text: Lakini hakutaka kumsikiliza[a]. Alikuwa na nguvu kuliko yeye[b], akamdhalilisha kingono[c], akalala naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, neno kwa neno, “kuisikiliza sauti yake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “alimshinda kwa nguvu.”
    reason: lexical_alternative
  - marker: c
    text: Kitenzi cha Kiebrania kinaweza kumaanisha “kumtweza” au “kumdhalilisha”; katika muktadha huu kinarejelea ukiukaji wa kingono.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: hakutaka
  rationale: Kitenzi hiki kinaonyesha kutokuwa tayari au kukataa kwa hiari. “Hakutaka” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: לִשְׁמֹעַ בְּקוֹלָהּ
  choice: kumsikiliza
  rationale: Nahau ya Kiebrania ni “kuisikiliza sauti yake,” lakini katika muktadha huu maana yake ni kuyasikiliza na kuyajali maombi yake.
- source_word: וַיֶּחֱזַק מִמֶּנָּה
  choice: alikuwa na nguvu kuliko yeye
  rationale: Tafsiri hii inahifadhi ulinganisho wa moja kwa moja katika Kiebrania na haitangulizi kitendo cha kumshinda kwa nguvu ambacho kinaweza kufasiriwa kutokana na muktadha.
- source_word: וַיְעַנֶּהָ
  choice: akamdhalilisha
  rationale: Kitenzi kinaweza kumaanisha kumtesa, kumtweza, au kumdhalilisha; katika muktadha huu kinahusu udhalilishaji wa kingono. Chaguo hili linahifadhi upana wa neno huku sentensi inayofuata ikiweka wazi hali ya kingono.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: na kulala naye
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kufanya ngono. “Kulala naye” ni nahau ya kawaida ya Kiswahili na, kwa sababu ya muktadha wa nguvu na kukataa, haisemi kwamba tendo hilo lilikuwa la hiari.
