base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/015.yaml
  text: Then Amnon hated her with very great hatred[a], because the hatred with which he hated her was greater than the love with which he had loved her. And Amnon said to her, “Get up, go.”
translation:
  language: sw
  text: Ndipo Amnoni akamchukia kwa chuki kubwa sana, kwa maana chuki aliyomchukia nayo ilikuwa kubwa kuliko upendo aliokuwa nao kwake. Amnoni akamwambia, “Inuka, nenda!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kina amri mbili fupi: “Inuka, nenda!” Ufupi wake unaonyesha jinsi Amnoni alivyomfukuza kwa ukali; tafsiri nyingine huwasilisha maana hiyo kwa “ondoka” au “toka hapa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂנָאֶהָ
  choice: Ndipo Amnoni akamchukia
  rationale: Waw-consecutive inaendeleza simulizi; “ndipo” pamoja na “akamchukia” huonyesha hatua inayofuata. Kiambishi cha nafsi ya tatu umoja wa kike kinamtaja Tamari kuwa ndiye anayechukiwa.
- source_word: שִׂנְאָה גְּדוֹלָה מְאֹד
  choice: kwa chuki kubwa sana
  rationale: Kirai hiki huonyesha namna na kiwango cha chuki. Tafsiri hii inadumisha urudiaji wenye mkazo wa mzizi שׂנא pamoja na גְּדוֹלָה מְאֹד.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha maelezo ya kauli iliyotangulia na kudumisha uhusiano wa kisababishi katika Kiswahili cha kawaida.
- source_word: גְדוֹלָה הַשִּׂנְאָה ... מֵאַהֲבָה
  choice: chuki ... ilikuwa kubwa kuliko upendo
  rationale: מִן ni alama ya ulinganisho hapa; “kuliko” huwasilisha wazi kwamba chuki ilizidi upendo.
- source_word: אֲשֶׁר שְׂנֵאָהּ
  choice: aliyomchukia nayo
  rationale: Inahifadhi uhusiano wa kishazi rejeshi na nomino “chuki,” pamoja na maana ya ‘chuki ambayo kwa hiyo alimchukia.’
- source_word: אֲשֶׁר אֲהֵבָהּ
  choice: aliokuwa amempenda nao
  rationale: Muundo wa “alikuwa amempenda” unaonyesha kwamba kupenda kulitangulia hali mpya ya chuki, huku “nao” ikihusisha kishazi na “upendo.”
- source_word: קוּמִי
  choice: Inuka
  rationale: Ni amri ya nafsi ya pili umoja wa kike. “Inuka” ni ya moja kwa moja na inadumisha ukali wa amri.
- source_word: לֵכִי
  choice: nenda
  rationale: Ni amri ya nafsi ya pili umoja wa kike ya הלך, ‘kwenda.’ “Nenda” huhifadhi ufupi wa ghafla bila kuongeza maana ya kufukuzwa ambayo haijasemwa moja kwa moja.
