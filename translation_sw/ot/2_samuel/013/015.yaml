translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Urudiaji wa “chuki/alimchukia” na “upendo/amempenda” umehifadhiwa ili kudumisha mkazo na ulinganifu wa Kiebrania. Amri ya mwisho imeachwa fupi na kali kama ilivyo katika chanzo.
