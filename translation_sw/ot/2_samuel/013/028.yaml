  text: וַ/יְצַו֩ אַבְשָׁל֨וֹם אֶת נְעָרָ֜י/ו לֵ/אמֹ֗ר רְא֣וּ נָ֠א כְּ/ט֨וֹב לֵב אַמְנ֤וֹן בַּ/יַּ֨יִן֙ וְ/אָמַרְתִּ֣י אֲלֵי/כֶ֔ם הַכּ֧וּ אֶת אַמְנ֛וֹן וַ/הֲמִתֶּ֥ם אֹת֖/וֹ אַל תִּירָ֑אוּ הֲ/ל֗וֹא כִּ֤י אָֽנֹכִי֙ צִוִּ֣יתִי אֶתְ/כֶ֔ם חִזְק֖וּ וִ/הְי֥וּ לִ/בְנֵי חָֽיִל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/028.yaml
  text: 'Then Absalom commanded his young men[a], saying, “Please watch: when Amnon’s heart is merry with wine, and I say to you, ‘Strike Amnon,’ then kill him. Do not fear. Have I not myself commanded you? Be strong, and be men of valor.”'
translation:
  language: sw
  text: 'Kisha Absalomu akawaamuru vijana wake, akisema, “Angalieni: moyo wa Amnoni utakapofurahi kwa sababu ya divai[a], nami nitakapowaambia, ‘Mpigeni Amnoni,’ basi muueni. Msiogope. Je, si mimi mwenyewe niliyewaamuru? Iweni hodari, muwe wanaume mashujaa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Amnoni atakapochangamka kwa sababu ya divai.” Kiebrania husema kihalisi kwamba moyo wake unakuwa mzuri kwa sababu ya divai.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָרָיו
  choice: vijana wake
  rationale: Neno נַעַר linaweza kumaanisha kijana, mtumishi, mhudumu, au mfuasi mwenye silaha. Hapa linawahusu watu wa Absalomu waliokuwa chini ya amri yake na ambao wangetekeleza mauaji; “vijana wake” linahifadhi maana ya msingi bila kuwafanya waonekane watumishi wa nyumbani tu.
- source_word: רְאוּ נָא
  choice: Angalieni
  rationale: Amri ya ראה pamoja na נָא inawataka wasikilize na kuutazama kwa makini wakati wa kutoa ishara. “Angalieni” ni amri ya kawaida na yenye uzito katika Kiswahili; kipengele cha נָא hakihitaji kila mara kutafsiriwa kama ombi la adabu.
- source_word: כְּטוֹב לֵב אַמְנוֹן בַּיַּיִן
  choice: moyo wa Amnoni utakapofurahi kwa divai
  rationale: Tafsiri hii inahifadhi taswira ya Kiebrania ya moyo kuwa mzuri au wenye furaha kwa sababu ya divai, bila kudai wazi kwamba Amnoni alikuwa amelewa kabisa.
- source_word: הַכּוּ אֶת אַמְנוֹן
  choice: Mpigeni Amnoni
  rationale: Kitenzi נכה ni kipana, kikimaanisha kupiga au kushambulia. “Mpigeni” kinahifadhi amri fupi, huku kitenzi kinachofuata kikibainisha kwamba shambulio hilo linapaswa kumuua.
- source_word: וַהֲמִתֶּם אֹתוֹ
  choice: basi muueni
  rationale: Hiphili ya מות humaanisha kusababisha afe, yaani kuua. “Basi” linaonyesha utekelezaji unaofuata ishara ya Absalomu.
- source_word: אַל תִּירָאוּ
  choice: Msiogope
  rationale: Ni katazo la moja kwa moja kwa wingi na ni la kawaida katika Kiswahili sanifu.
- source_word: הֲלוֹא כִּי אָנֹכִי צִוִּיתִי אֶתְכֶם
  choice: Je, si mimi mwenyewe niliyewaamuru?
  rationale: Swali la balagha linakazia mamlaka na wajibu wa Absalomu. “Mimi mwenyewe” linaonyesha mkazo wa אָנֹכִי.
- source_word: חִזְקוּ
  choice: Iweni hodari
  rationale: Amri hii inataka nguvu na ujasiri. “Iweni hodari” ni ya asili na inaingia vizuri katika muktadha wa kijeshi.
- source_word: וִהְיוּ לִבְנֵי חָיִל
  choice: mkawe mashujaa
  rationale: בני חיל ni nahau inayowataja wanaume jasiri, hodari, au wenye uwezo, mara nyingi katika mazingira ya kivita. “Mashujaa” linawasilisha nguvu hiyo kwa Kiswahili cha kawaida na kwa muktadha huu linawahusu wanaume walioamriwa na Absalomu.
theological_decisions:
- issue: Usemi wenye jinsia katika לִבְנֵי חָיִל
  choice: mkawe mashujaa
  alternative: mkawe jasiri
  rationale: Walengwa ni vijana wa kiume wa Absalomu, na nahau ya Kiebrania ni ya kiume. “Mashujaa” hudumisha picha ya kundi la wanaume hodari katika muktadha huu bila kuongeza fundisho la kidhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa moyo kufurahi kwa divai umehifadhiwa ili kuonyesha nahau ya Kiebrania na kuepuka kuamua bila msingi kwamba Amnoni alikuwa amelewa kabisa.
