review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects Absalom's command, the conditional timing of Amnon's wine-induced cheerfulness, the distinct commands to strike and kill, the rhetorical assurance, and the call to courage. The final Hebrew imperative, however, is best represented as a second independent imperative and retains an explicitly masculine idiom.
  naturalness: The Swahili is generally clear and suitably formal. “Mkawe” following “Iweni hodari” can sound syntactically dependent; a separate imperative, “muwe,” better matches the Hebrew sequence. Adding “kwa sababu ya” makes the wine expression more idiomatic while retaining the heart imagery.
  terminology: “Vijana wake,” “Mpigeni,” “muueni,” and “Msiogope” are appropriate. “Muwe wanaume mashujaa” explicitly conveys the masculine social reference of בְּנֵי־חַיִל while remaining natural in Standard East African Swahili.
  issues:
  - severity: low
    issue: The final exhortation uses “mkawe mashujaa.”
    rationale: The Hebrew has a further imperative, וִהְיוּ, and the idiom בְּנֵי־חַיִל is explicitly masculine. “Muwe wanaume mashujaa” represents both features more closely.
  - severity: low
    issue: “Kwa divai” is slightly elliptical in the main text and footnote.
    rationale: “Kwa sababu ya divai” is more idiomatic Swahili and still avoids asserting that Amnon was fully drunk.
