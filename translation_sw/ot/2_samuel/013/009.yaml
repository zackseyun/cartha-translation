base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/009.yaml
  text: Then she took the pan and poured them out before him[a], but he refused to eat. And Amnon said[b], “Send everyone out from me.” So everyone went out from him.
translation:
  language: sw
  text: Kisha akachukua chombo cha kupakulia, akamimina chakula mbele yake[a], lakini akakataa kula. Naye Amnoni akasema, “Waondoeni watu wote mbele yangu.” Basi watu wote wakaondoka mbele yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akakipakua mbele yake” au “akaweka chakula mbele yake”; kitenzi cha Kiebrania kwa msingi ni “kumimina,” nacho kimetumiwa hapa katika muktadha wa kupakua chakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂרֵת
  choice: chombo cha kupakulia
  rationale: Neno hili linamaanisha chombo kilichotumiwa kuandalia au kupakulia chakula. Tafsiri hii ni ya kawaida na haibani maana kuwa sufuria au sahani pekee.
- source_word: וַתִּצֹק לְפָנָיו
  choice: akamimina chakula mbele yake
  rationale: Kitenzi יצק kwa msingi ni ‘kumimina.’ Kutaja ‘chakula’ kunafanya yambwa iliyodokezwa na muktadha iwe wazi huku kitendo halisi cha Kiebrania kikihifadhiwa.
- source_word: וַיְמָאֵן לֶאֱכֹל
  choice: akakataa kula
  rationale: מָאֵן huonyesha kukataa kwa makusudi, si kukosa hamu tu.
- source_word: הוֹצִיאוּ
  choice: Waondoeni
  rationale: Hii ni amri ya kusababisha watu watoke; ‘waondoeni’ ni ya asili katika Kiswahili na huhifadhi nguvu ya kausativi.
- source_word: כָל אִישׁ
  choice: watu wote
  rationale: Ingawa kihalisi ni ‘kila mwanamume,’ katika kauli hii inawahusu kwa pamoja wote waliokuwapo.
- source_word: מֵעָלַי / מֵעָלָיו
  choice: mbele yangu / mbele yake
  rationale: Misemo hii humaanisha kuondoka katika uwepo wa mtu. ‘Mbele yangu/yake’ huhifadhi urudiaji na uhusiano wa mahali kwa Kiswahili cha asili.
