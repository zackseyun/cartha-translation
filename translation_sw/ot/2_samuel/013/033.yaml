base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/033.yaml
  text: Now let not my lord the king take this matter to heart[a], saying, ‘All the king’s sons are dead,’ for Amnon alone is dead.
translation:
  language: sw
  text: Sasa, bwana wangu mfalme asiweke jambo hili moyoni mwake, akisema, ‘Wana wote wa mfalme wamekufa,’ bali Amnoni peke yake ndiye aliyekufa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “asiweke jambo hili juu ya moyo wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Ni kiashiria cha mazungumzo kinachoanzisha kauli ya kusahihisha; ‘Basi sasa’ huhifadhi uhusiano na yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: אַל יָשֵׂם ... אֶל לִבּוֹ
  choice: asiweke moyoni
  rationale: Huhifadhi taswira ya nahau ya Kiebrania ya ‘kuweka ... moyoni’ na inaeleweka kwa Kiswahili.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Huhifadhi namna ya heshima ya kifalme bila kuongeza cheo kisichokuwamo katika chanzo.
- source_word: דָּבָר
  choice: jambo hili
  rationale: Katika muktadha inarejelea taarifa iliyomfikia mfalme; ‘jambo’ lina upana wa maana unaolingana na דָּבָר.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hutambulisha yaliyomo katika jambo ambalo mfalme hapaswi kuliweka moyoni, bila kubadili usemi kuwa wazo tu.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: Wana wote wa mfalme
  rationale: ‘Wana’ ni neno la sasa, lenye hadhi, na hapa humaanisha watoto wa kiume wa mfalme kama ilivyo katika muktadha.
- source_word: מֵתוּ
  choice: wamekufa
  rationale: Huwasilisha hali inayotokana na tendo lililokamilika na hufaa katika taarifa iliyonukuliwa.
- source_word: כִּי אִם
  choice: kwa maana ni ... peke yake
  rationale: 'Muundo huu ni wa kusahihisha na kutenga: si wana wote, bali Amnoni tu; tafsiri hii huonyesha sababu ya kukataa taarifa ya awali.'
- source_word: לְבַדּוֹ
  choice: peke yake
  rationale: Husisitiza upekee wa Amnoni kuwa ndiye tu aliyekufa.
- source_word: מֵת
  choice: aliyekufa
  rationale: Kiswahili hutumia kwa kawaida kishazi hiki baada ya ‘ni ... peke yake,’ huku tofauti na madai ya awali ikibaki wazi.
