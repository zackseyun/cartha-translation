  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa heshima ‘bwana wangu mfalme’ na nahau ya moyo vimehifadhiwa; sentensi imeundwa kwa mtiririko wa kawaida bila kuondoa msisitizo kwamba Amnoni pekee ndiye aliyekufa.
