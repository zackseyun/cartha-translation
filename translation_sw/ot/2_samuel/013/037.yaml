base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/037.yaml
  text: But Absalom fled and went to Talmai son of Ammihur[a], king of Geshur. And he mourned for his son all the days.
translation:
  language: sw
  text: Lakini Absalomu akakimbia, akaenda kwa Talmai mwana wa Amihuri, mfalme wa Geshuri. Daudi[a] akaombolea mwanawe siku zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hakimtaji wazi mtendaji wa tendo la kuomboleza; kutokana na muktadha anaeleweka kuwa Daudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם
  choice: Lakini Absalomu
  rationale: Kiunganishi וְ kinaweza kuwa “na,” lakini hapa “lakini” kinaonyesha vizuri tofauti ya kisimulizi baada ya taarifa ya kifo cha Amnoni na kutoroka kwa Absalomu. Jina limetoholewa kwa matumizi ya kawaida ya Kiswahili.
- source_word: בָּרַח
  choice: akakimbia
  rationale: Kitenzi kina maana ya kukimbia au kutoroka. “Akakimbia” ni cha kawaida na chenye nguvu ya kisimulizi katika Kiswahili.
- source_word: וַ/יֵּלֶךְ אֶל
  choice: akaenda kwa
  rationale: Hii ni tafsiri ya kawaida na ya asili ya mwendo kuelekea kwa mtu.
- source_word: תַּלְמַי
  choice: Talmai
  rationale: Jina la mtu limetoholewa kwa mwandiko wa Kiswahili bila kubadili utambulisho wake.
- source_word: בֶּן עמיחור
  choice: mwana wa Amihuri
  rationale: Muundo wa nasaba umetafsiriwa moja kwa moja; jina עמיחור limetoholewa kulingana na matini ya Kiebrania iliyotolewa.
- source_word: מֶלֶךְ גְּשׁוּר
  choice: mfalme wa Geshuri
  rationale: Muundo huu unamtambulisha Talmai kuwa mfalme wa Geshuri; ni usemi wa kawaida wa Kiswahili.
- source_word: וַ/יִּתְאַבֵּל
  choice: Naye akamwombolezea
  rationale: Kitenzi cha Kiebrania kinamaanisha kuomboleza kwa sababu ya msiba. “Naye” hudumisha hali ya kwamba mtendaji hakutajwa wazi katika Kiebrania, huku tanbihi ikieleza anayeeleweka kutokana na muktadha.
- source_word: עַל בְּנ/וֹ
  choice: mwanawe
  rationale: Katika muktadha wa maombolezo, muundo huu kwa kawaida una maana ya kumwombolezea mwana wake; mwana anayelengwa ni Amnoni.
- source_word: כָּל הַ/יָּמִים
  choice: siku zote
  rationale: Hii inafuata nahau ya Kiebrania kwa ukaribu na bado ni Kiswahili cha kawaida, bila kuibadili kimya kimya kuwa “daima” au “kila siku.”
theological_decisions:
- issue: Mtendaji wa וַיִּתְאַבֵּל (“akaomboleza”) hakutajwa wazi.
  choice: Naye[a] akamwombolezea
  alternative: Daudi akamwombolezea
  rationale: Kumtaja Daudi moja kwa moja kungefafanua jambo ambalo Kiebrania limeacha kwa muktadha. Kiwakilishi pamoja na tanbihi kinahifadhi hali hiyo huku kikimsaidia msomaji kuelewa kuwa muktadha unamwelekeza Daudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi wa sasa na wenye heshima. Majina yametoholewa kama Absalomu, Amihuri, na Geshuri. Usemi “Naye” umechaguliwa ili kutodai kwa matini kuu zaidi ya Kiebrania kinavyosema wazi.
