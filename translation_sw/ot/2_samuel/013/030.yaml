  text: וַֽ/יְהִי֙ הֵ֣מָּה בַ/דֶּ֔רֶךְ וְ/הַ/שְּׁמֻעָ֣ה בָ֔אָה אֶל דָּוִ֖ד לֵ/אמֹ֑ר הִכָּ֤ה אַבְשָׁלוֹם֙ אֶת כָּל בְּנֵ֣י הַ/מֶּ֔לֶךְ וְ/לֹֽא נוֹתַ֥ר מֵ/הֶ֖ם אֶחָֽד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/030.yaml
  text: While they were on the way[a], the report came to David, saying, “Absalom has struck down all the king’s sons, and not one of them is left.”
translation:
  language: sw
  text: Walipokuwa njiani, taarifa[a] ikamfikia Daudi ikisema, “Absalomu amewaua wana wote wa mfalme; hakuna hata mmoja wao aliyebaki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “habari”; neno la Kiebrania linaweza pia kumaanisha taarifa ambayo haijathibitishwa au uvumi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵמָּה בַדֶּרֶךְ
  choice: Walipokuwa njiani
  rationale: Muundo huu wa Kiswahili unaweka mazingira ya wakati kwa kawaida na kwa ufupi, huku ukihifadhi maana ya kwamba jambo lilitokea walipokuwa safarini.
- source_word: הַשְּׁמֻעָה
  choice: taarifa
  rationale: Neno la Kiebrania linaweza kumaanisha taarifa, habari, au uvumi. “Taarifa” huhifadhi hali ya ujumbe ambao bado haujathibitishwa bila kuuita moja kwa moja uvumi.
- source_word: בָאָה אֶל דָּוִד
  choice: ikamfikia Daudi
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba taarifa hiyo ilimjia Daudi, huku kikihifadhi Daudi kama mpokeaji.
- source_word: לֵאמֹר
  choice: ikisema
  rationale: Hutambulisha usemi wa moja kwa moja kwa namna ya asili katika Kiswahili.
- source_word: הִכָּה
  choice: amewaua
  rationale: Katika muktadha huu kitenzi נכה kinaonyesha kupiga kwa kuua. “Amewaua” huwasilisha wazi dai la taarifa hiyo kwamba wana wote walikuwa wameuawa.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: wana wote wa mfalme
  rationale: Tafsiri ya moja kwa moja na ya kawaida inayohifadhi rejeleo mahususi kwa wana wa kiume wa mfalme.
- source_word: וְלֹא נוֹתַר מֵהֶם אֶחָד
  choice: hakuna hata mmoja wao aliyebaki
  rationale: Huhifadhi msisitizo wa Kiebrania kwamba si mmoja aliyesalia, kwa Kiswahili cha kawaida na chenye nguvu.
