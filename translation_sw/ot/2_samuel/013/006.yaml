base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/006.yaml
  text: So Amnon lay down and pretended to be sick. When the king came to see him[a], Amnon said to the king, “Please let Tamar my sister come and make two cakes before my eyes, so that I may eat from her hand.”
translation:
  language: sw
  text: Basi Amnoni akajilaza na kujifanya mgonjwa. Mfalme alipokuja kumwona, Amnoni akamwambia, “Tafadhali, mwache Tamari, dada yangu, aje atengeneze mikate miwili[a] mbele ya macho yangu, ili nipate kula kutoka mkononi mwake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “keki mbili” au “vitafunwa viwili”; haijulikani kwa hakika neno la Kiebrania linamaanisha chakula cha aina gani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akajilaza
  rationale: Kitenzi hiki kinaonyesha Amnoni alijilaza kama sehemu ya mpango wake; ‘akajilaza’ ni cha kawaida na hakiongezi waziwazi kwamba alikuwa kitandani.
- source_word: וַיִּתְחָל
  choice: na kujifanya mgonjwa
  rationale: Umbo la Kiebrania katika muktadha huu linaonyesha kujionyesha kuwa mgonjwa, si kuugua kweli.
- source_word: לִרְאֹתוֹ
  choice: kumwona
  rationale: Hii inafuata maana ya moja kwa moja ya kitenzi ראה, ingawa katika muktadha pia ni kumtembelea.
- source_word: תָּבוֹא נָא
  choice: Tafadhali, mwache ... aje
  rationale: Neno נָא pamoja na umbo la kitenzi huonyesha ombi la heshima kwa mfalme.
- source_word: תָּמָר אֲחֹתִי
  choice: Tamari dada yangu
  rationale: Mpangilio huu unafuata Kiebrania na bado ni wa kawaida katika Kiswahili.
- source_word: וּתְלַבֵּב
  choice: atengeneze
  rationale: Kitenzi hiki adimu kinahusiana na chakula kinachoitwa לְבִבוֹת; ‘atengeneze’ huepuka kubainisha mbinu ya upishi ambayo haijulikani kwa hakika.
- source_word: לְעֵינַי
  choice: mbele ya macho yangu
  rationale: Tafsiri hii huhifadhi taswira halisi ya Amnoni kutaka chakula kitayarishwe akiwa anaona.
- source_word: שְׁתֵּי לְבִבוֹת
  choice: mikate miwili
  rationale: Neno לְבִבוֹת hutaja aina fulani ya chakula kilichotengenezwa, lakini umbo na aina yake kamili havijulikani; ‘mikate’ ni tafsiri salama na inayoeleweka.
- source_word: וְאֶבְרֶה
  choice: ili nile
  rationale: Katika muktadha huu kitenzi ברה kinamaanisha kula au kupokea chakula, na kishazi kinaonyesha kusudi.
- source_word: מִיָּדָהּ
  choice: kutoka mkononi mwake
  rationale: Huhifadhi usemi wa Kiebrania unaosisitiza kwamba Tamari mwenyewe angempa chakula.
