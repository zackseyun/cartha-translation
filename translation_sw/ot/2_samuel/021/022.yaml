  yaml_path: translation/ot/2_samuel/021/022.yaml
  text: These four were born to the Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: sw
  text: Hawa wanne walizaliwa na Rafa huko Gathi[a], nao walianguka kwa mkono wa Daudi na kwa mkono wa watumishi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na Rafa,” “na yule jitu,” au “na Warefai.” Huenda Kiebrania kinarejelea uhusiano wa ukoo na Rafa, au ukoo wa majitu uliohusishwa na Gathi.
    reason: alternative_reading
lexical_decisions:
- source_word: אַרְבַּעַת אֵלֶּה
  choice: Hawa wanne
  rationale: Muundo wa kuonyesha pamoja na idadi umetafsiriwa kwa Kiswahili cha kawaida bila kuongeza neno ‘watu,’ ambalo haliko wazi katika Kiebrania.
- source_word: יֻלְּדוּ
  choice: walizaliwa
  rationale: Kauli tendwa ya ילד hapa inaonyesha kuzaliwa au ukoo; ‘walizaliwa’ ni ya asili na inaeleweka katika Kiswahili cha sasa.
- source_word: לְהָרָפָה
  choice: kwa Rafa
  rationale: Inahifadhi jina au cheo Rafa bila kulifasiri moja kwa moja kuwa ‘jitu’ au ‘Warefai,’ hivyo inalinda utata wa Kiebrania.
- source_word: בְּגַת
  choice: huko Gathi
  rationale: Ni usemi wa mahali; ‘huko Gathi’ unaunganika kwa kawaida na taarifa ya kuzaliwa.
- source_word: וַיִּפְּלוּ
  choice: nao walianguka
  rationale: Inahifadhi taswira halisi ya נפל; katika muktadha wa vita inaashiria kuuawa bila kuondoa taswira ya matini.
- source_word: בְיַד
  choice: kwa mkono wa
  rationale: Inahifadhi nahau ya Kiebrania ya wakala au chombo, nayo inaeleweka katika Kiswahili cha kibiblia chenye hadhi.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika mazingira ya kifalme na kijeshi, neno hili linaweza kumaanisha watu waliokuwa chini ya mamlaka ya mfalme; ‘watumishi wake’ ndilo linalolingana moja kwa moja zaidi.
theological_decisions:
- issue: Utambulisho wa הָרָפָה
  choice: Rafa kama jina au cheo cha babu/mwanzilishi wa ukoo
  alternative: ‘jitu’ kama nomino ya kawaida, au ‘Warefai’ kama jina la kundi la watu
  rationale: Mstari huu unafanya muhtasari wa mapambano yaliyotangulia na kuwaunganisha hawa wanne na ukoo wa majitu wa Gathi. Kwa kuwa Kiebrania kinaweza kueleweka kwa njia zaidi ya moja, matini kuu inahifadhi ‘Rafa,’ na tanbihi inaonyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘kwa mkono wa’ umehifadhiwa kwa sababu ni nahau inayoeleweka na huakisi matini ya Kiebrania; utata kuhusu Rafa umewekwa wazi katika tanbihi.
