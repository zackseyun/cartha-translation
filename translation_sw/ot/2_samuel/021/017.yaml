  text: וַ/יַּֽעֲזָר ל/וֹ֙ אֲבִישַׁ֣י בֶּן צְרוּיָ֔ה וַ/יַּ֥ךְ אֶת הַ/פְּלִשְׁתִּ֖י וַ/יְמִיתֵ֑/הוּ אָ֣ז נִשְׁבְּעוּ֩ אַנְשֵׁי דָוִ֨ד ל֜/וֹ לֵ/אמֹ֗ר לֹא תֵצֵ֨א ע֤וֹד אִתָּ֨/נוּ֙ לַ/מִּלְחָמָ֔ה וְ/לֹ֥א תְכַבֶּ֖ה אֶת נֵ֥ר יִשְׂרָאֵֽל־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/017.yaml
  text: But Abishai son of Zeruiah came to his aid[a], struck the Philistine, and killed him. Then David’s men swore to him, saying, “You must not go out with us to battle any longer, lest you extinguish the lamp of Israel.”
translation:
  language: sw
  text: Lakini Abishai mwana wa Seruya akamsaidia Daudi, akampiga yule Mfilisti na kumuua. Ndipo watu wa Daudi wakamwapia, wakisema, “Hutatoka tena pamoja nasi kwenda vitani, usije ukaizima taa ya Israeli.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nuru ya Israeli.” Kiebrania kinasema “taa,” sitiari inayoonyesha nafasi muhimu ya Daudi katika uhai na uthabiti wa taifa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזָר לוֹ
  choice: akamsaidia Daudi
  rationale: Kitenzi עזר humaanisha kusaidia. Kutaja Daudi wazi kunafanya kiwakilishi kieleweke kwa Kiswahili bila kubadili maana.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: Abishai mwana wa Seruya
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili, na בן imetafsiriwa kwa uhusiano wa ukoo, ‘mwana wa.’
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי
  choice: akampiga yule Mfilisti
  rationale: נכה hapa ni kumpiga. Tafsiri hii huepuka kurudia maana ya kifo, kwa kuwa kitenzi kinachofuata kinasema wazi kwamba alimuua.
- source_word: וַיְמִיתֵהוּ
  choice: na kumuua
  rationale: Hifili ya מות ina maana ya kusababisha kifo; ‘kumuua’ ni usemi wa kawaida na wa moja kwa moja.
- source_word: אָז נִשְׁבְּעוּ אַנְשֵׁי דָוִד לוֹ
  choice: Ndipo watu wa Daudi wakamwapia
  rationale: נשבע inaonyesha kula kiapo. ‘Wakamwapia’ huhifadhi uzito wa kiapo na mhusika ambaye kiapo kilielekezwa kwake.
- source_word: לֹא תֵצֵא עוֹד אִתָּנוּ לַמִּלְחָמָה
  choice: Hutatoka tena pamoja nasi kwenda vitani
  rationale: Kauli hii, ndani ya kiapo, ni katazo thabiti kuhusu kwenda tena vitani pamoja nao.
- source_word: וְלֹא תְכַבֶּה
  choice: usije ukaizima
  rationale: Ingawa Kiebrania kinaunganisha kifungu kwa וְלֹא, maana yake hapa ni matokeo yanayokusudiwa kuepukwa. ‘Usije’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: נֵר יִשְׂרָאֵל
  choice: taa ya Israeli
  rationale: נֵר ni taa halisi inayotumiwa hapa kama sitiari. ‘Taa’ huhifadhi picha ya Kiebrania bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Daudi kuitwa kwa sitiari taa inayoidumisha Israeli
  choice: taa ya Israeli
  alternative: nuru ya Israeli
  rationale: Kiebrania kinatumia kitu halisi, ‘taa,’ kama sitiari. Kukihifadhi kunadumisha picha ya kifasihi na umuhimu wa kifalme wa Daudi bila kuibadili kuwa maelezo ya kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa simulizi umetolewa kwa vitenzi vinavyofuatana kwa urahisi, huku sitiari ya Kiebrania ‘taa ya Israeli’ ikihifadhiwa.
