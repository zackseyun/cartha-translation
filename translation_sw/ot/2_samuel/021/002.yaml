source:
  edition: WLC
  text: וַ/יִּקְרָ֥א הַ/מֶּ֛לֶךְ לַ/גִּבְעֹנִ֖ים וַ/יֹּ֣אמֶר אֲלֵי/הֶ֑ם וְ/הַ/גִּבְעֹנִ֞ים לֹ֣א מִ/בְּנֵ֧י יִשְׂרָאֵ֣ל הֵ֗מָּה כִּ֚י אִם מִ/יֶּ֣תֶר הָ/אֱמֹרִ֔י וּ/בְנֵ֤י יִשְׂרָאֵל֙ נִשְׁבְּע֣וּ לָ/הֶ֔ם וַ/יְבַקֵּ֤שׁ שָׁאוּל֙ לְ/הַכֹּתָ֔/ם בְּ/קַנֹּאת֥/וֹ לִ/בְנֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/002.yaml
  text: So the king called the Gibeonites and spoke to them[a]. Now the Gibeonites were not from the sons of Israel, but from the remnant of the Amorites; and the sons of Israel had sworn to them[c][b]. But Saul had sought to strike them down in his zeal for the sons of Israel and Judah.
translation:
  language: sw
  text: Basi mfalme akawaita Wagibeoni, akazungumza nao. Wagibeoni hawakuwa miongoni mwa wana wa Israeli[a], bali walitokana na mabaki ya Waamori[b]. Wana wa Israeli walikuwa wamewaapia, lakini Sauli alitafuta kuwaua katika ari yake kwa ajili ya wana wa Israeli na Yuda[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakuwa Waisraeli.” Kiebrania kinasema, “hawakuwa miongoni mwa wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “walitokana na wale Waamori waliokuwa wamesalia.”
    reason: lexical_alternative
  - marker: c
    text: Au, “katika wivu wake kwa ajili ya wana wa Israeli na Yuda.” Neno la Kiebrania linaweza kumaanisha “ari” au “wivu,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא הַמֶּלֶךְ לַגִּבְעֹנִים
  choice: mfalme akawaita Wagibeoni
  rationale: Kitenzi קרא katika muktadha huu ni kuwaita watu waje mbele yake; “akawaita” ni Kiswahili cha kawaida na kinahifadhi maana hiyo bila kuongeza jina la mfalme lisilotajwa katika Kiebrania.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: akawaambia
  rationale: Hii ndiyo tafsiri ya kawaida ya “akasema kwao”; inaunganisha kwa urahisi na maneno ya mfalme yanayoendelea baada ya maelezo ya pembeni.
- source_word: לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: hawakuwa miongoni mwa wana wa Israeli
  rationale: Inahifadhi nahau ya kifamilia “wana wa Israeli” na pia uhusiano wake na kurudiwa kwa usemi huo baadaye katika aya.
- source_word: מִיֶּתֶר הָאֱמֹרִי
  choice: walitokana na mabaki ya Waamori
  rationale: יֶתֶר humaanisha kilichobaki; “mabaki” huonyesha kundi lililosalia, huku “walitokana na” ikieleza asili yao kwa Kiswahili cha kawaida.
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: walikuwa wamewaapia
  rationale: Muundo huu unaonyesha kwamba kiapo kilitangulia hatua ya Sauli; “kuwaapia” ni usemi mfupi na wa asili wa kufanya kiapo kwa faida au kwa upande wao.
- source_word: וַיְבַקֵּשׁ שָׁאוּל לְהַכֹּתָם
  choice: Sauli alijaribu kuwaua
  rationale: בקש pamoja na kitenzi-jina huonyesha kutaka au kujaribu kufanya jambo, na נכה katika muktadha huu wa shambulio dhidi ya kundi humaanisha kuwapiga hadi kuwaua.
- source_word: בְּקַנֹּאתוֹ
  choice: katika ari yake
  rationale: קנא inaweza kuonyesha ari kali au wivu. “Ari” inafaa kwa juhudi ya kitaifa inayotajwa hapa, bila kuifanya nia hiyo ionekane kuwa nzuri kimaadili.
theological_decisions:
- issue: Tafsiri ya בני ישראל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Kurudia usemi wa chanzo kunahifadhi picha ya ukoo na ulinganifu wa ndani wa aya; tafsiri laini zaidi imewekwa katika tanbihi.
- issue: Maana ya קנא katika nia ya Sauli
  choice: ari
  alternative: wivu
  rationale: Muktadha unaeleza juhudi kali kwa ajili ya Israeli na Yuda, kwa hiyo “ari” inafaa; hata hivyo, neno la Kiebrania linaweza pia kuwa na maana ya “wivu,” na utata huo umehifadhiwa katika tanbihi.
- issue: Nguvu ya לְהַכֹּתָם
  choice: kuwaua
  alternative: kuwapiga na kuwaangusha
  rationale: Katika muktadha wa jaribio la Sauli dhidi ya Wagibeoni na matokeo yanayozungumziwa, kitenzi נכה kina nguvu ya kuua, si kupiga tu; “kuwaua” huwasilisha maana hiyo wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Wagibeoni,” “Waamori,” na “wana wa Israeli” hudumisha istilahi za kibiblia zilizozoeleka. Sentensi ya maelezo ya asili ya Wagibeoni imewekwa wazi bila mabano, kama ilivyo katika mtiririko wa Kiebrania.
