translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa leo. Ulinganifu wa kisarufi wa “mifupa” umehifadhiwa katika “akaipandisha” na “wakaikusanya,” huku wingi wa watendaji katika kishazi cha mwisho ukibaki wazi.
