  text: וַ/יַּ֤עַל מִ/שָּׁם֙ אֶת עַצְמ֣וֹת שָׁא֔וּל וְ/אֶת עַצְמ֖וֹת יְהוֹנָתָ֣ן בְּנ֑/וֹ וַ/יַּ֣אַסְפ֔וּ אֶת עַצְמ֖וֹת הַ/מּוּקָעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/013.yaml
  text: He brought up from there the bones of Saul and the bones of Jonathan his son[a], and they gathered the bones of those who had been impaled.
translation:
  language: sw
  text: Akaipandisha kutoka huko mifupa ya Sauli na mifupa ya Yonathani mwanawe, nao wakaikusanya mifupa ya wale waliotundikwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliotundikwa kwenye vigingi” au “ambao miili yao iliwekwa wazi.” Neno la Kiebrania linawahusu watu waliouawa ambao miili yao ilionyeshwa hadharani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: akaipandisha
  rationale: Kitenzi עלה katika kausativi kina maana ya kuleta au kupandisha juu. “Akaipandisha” kinahifadhi wazo la kuiondoa mifupa kutoka mahali pale bila kulifanya kuwa neno la jumla tu.
- source_word: מִשָּׁם
  choice: kutoka huko
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya kielezi kinachoonyesha mahali.
- source_word: עַצְמוֹת
  choice: mifupa
  rationale: Neno la Kiebrania linamaanisha hasa “mifupa”; tafsiri hii ni sahihi zaidi kuliko neno pana kama “mabaki.”
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: Yonathani mwanawe
  rationale: Muundo huu unafuata mpangilio wa Kiebrania na unaonyesha wazi kwamba Yonathani alikuwa mwana wa Sauli.
- source_word: וַיַּאַסְפוּ
  choice: nao wakaikusanya
  rationale: Kitenzi cha Kiebrania ni cha nafsi ya tatu wingi. “Nao wakaikusanya” kinahifadhi mabadiliko kutoka mtendaji mmoja hadi watendaji wengi na kinafaa kwa kukusanya mifupa kwa ajili ya maziko.
- source_word: הַמּוּקָעִים
  choice: wale waliotundikwa
  rationale: Neno יקע linaweza kumaanisha watu waliouawa na kutundikwa au kuwekwa wazi hadharani. “Waliotundikwa” ni ya kawaida na haibani maana kwa njia moja tu ya kuuawa; uwezekano wa kutundikwa kwenye vigingi au kuwekwa wazi umetajwa katika tanbihi.
