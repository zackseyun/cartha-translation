base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/003.yaml
  text: David said to the Gibeonites[a], “What shall I do for you, and with what shall I make atonement[b], that you may bless the inheritance of Yahweh?”
translation:
  language: sw
  text: Daudi akawaambia Wagibeoni, “Niwafanyie nini, na nifanye upatanisho kwa njia gani, ili mbariki[a] urithi wa Yahwe[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na mbariki urithi wa Yahwe.” Kiebrania kinaweza pia kusomwa kwa uratibu wa moja kwa moja, ingawa katika muktadha huenda kinaonyesha kusudi au matokeo.
    reason: lexical_alternative
  - marker: b
    text: “Urithi wa Yahwe” hapa ni Israeli, watu walio mali ya Yahwe.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akawaambia
  rationale: Ni usemi wa kawaida wa masimulizi unaoanzisha maneno ya Daudi; katika Kiswahili, ‘akawaambia’ huonyesha kwa kawaida kwamba alisema kwa watu waliotajwa.
- source_word: הַגִּבְעֹנִים
  choice: Wagibeoni
  rationale: Ni jina la watu wa Gibeoni; umbo la Kiswahili lenye kiambishi Wa- linaonyesha kundi la watu.
- source_word: מָה אֶעֱשֶׂה לָכֶם
  choice: Niwafanyie nini
  rationale: Huhifadhi swali la Daudi kuhusu jambo analopaswa kuwatendea kwa faida yao, kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: וּבַמָּה
  choice: na ... kwa njia gani
  rationale: Huhifadhi maana ya chombo au njia (‘kwa nini/kwa njia gani’) bila kuifanya kuwa swali la jumla tu kuhusu jinsi.
- source_word: אֲכַפֵּר
  choice: nifanye upatanisho
  rationale: Kitenzi כפר katika muktadha huu kinahusu kuondoa hatia nzito na kurekebisha uvunjaji wa agano; ‘kufanya upatanisho’ huhifadhi uzito wa kidini na wa kijamii kuliko ‘kufidia’ pekee.
- source_word: וּבָרְכוּ
  choice: ili mbariki
  rationale: Kiunganishi pamoja na umbo la amri/nia kinaeleweka kwa uwezekano mkubwa kama kusudi au matokeo yanayotazamiwa. ‘Ili’ huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano wa uratibu wa moja kwa moja.
- source_word: נַחֲלַת יְהוָה
  choice: urithi wa Yahwe
  rationale: ‘Urithi’ hufuata maana ya נחלה na hapa hurejelea watu walio mali ya Yahwe, yaani Israeli.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Maana ya כפר katika muktadha wa hatia ya damu na uvunjaji wa agano
  choice: nifanye upatanisho
  alternative: nifanye fidia; niwarekebishie kosa
  rationale: ‘Kufanya upatanisho’ huhifadhi maana ya kuondoa hatia na kurejesha uhusiano uliovunjwa, bila kuipunguza kuwa malipo au ombi la msamaha tu.
- issue: Uhusiano wa kisarufi wa וּבָרְכוּ אֶת נַחֲלַת יְהוָה
  choice: 'kusudi/matokeo: ‘ili mbariki urithi wa Yahwe’'
  alternative: 'uratibu wa moja kwa moja: ‘na mbariki urithi wa Yahwe’'
  rationale: Muktadha unaonyesha Daudi akiuliza ni tendo gani litakalowafanya Wagibeoni waibariki Israeli badala ya kuendelea kuwa na dai dhidi yake. Hata hivyo, umbo la Kiebrania linaweza kusomwa kwa uratibu wa moja kwa moja, hivyo uwezekano huo umewekwa katika tanbihi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio ‘nifanye upatanisho kwa njia gani’ ni wa asili katika Kiswahili na bado huhifadhi maana ya njia iliyomo katika Kiebrania. Alama za tanbihi zimewekwa kwenye vipashio vinavyofafanuliwa: [a] baada ya kishazi cha baraka na [b] baada ya sentensi yenye ‘urithi wa Yahwe’.'
