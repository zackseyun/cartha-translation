base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/004.yaml
  text: The Gibeonites said to him[a], “We have no claim for silver or gold against Saul or against his house, and it is not for us to put any man in Israel to death.” Then he said[b], “What do you say that I should do for you?”
translation:
  language: sw
  text: Wagibeoni wakamwambia[a], “Hatuna madai ya fedha wala dhahabu dhidi ya Sauli na nyumba yake, wala hatuna mamlaka ya kumuua mtu yeyote katika Israeli.” Naye akasema, “Mnasema niwafanyie nini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Suala kati yetu na Sauli na nyumba yake si la fedha wala dhahabu.” Kauli ya Kiebrania ni ya kiidiomu na huenda inahusu fidia ya fedha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין לִי כֶּסֶף וְזָהָב עִם שָׁאוּל וְעִם בֵּיתוֹ
  choice: Hatuna madai ya fedha wala dhahabu dhidi ya Sauli na nyumba yake
  rationale: Kauli ya Kiebrania ni ya kimafumbo na katika muktadha inaashiria kwamba Wagibeoni hawadai fidia ya fedha kutoka kwa Sauli au jamaa yake. Wingi wa Kiswahili unalingana kwa kawaida na kundi linalozungumza.
- source_word: עִם
  choice: dhidi ya
  rationale: Ingawa kwa kawaida humaanisha ‘pamoja na,’ hapa inaonyesha upande ambao madai yangeelekezwa kwake.
- source_word: וְאֵין לָנוּ אִישׁ לְהָמִית בְּיִשְׂרָאֵל
  choice: wala si juu yetu kumuua mtu yeyote katika Israeli
  rationale: Kauli hii inaeleweka kuwa Wagibeoni hawana mamlaka au haki ya kumuua Mwisraeli, si kwamba hawana mtu wa kumuua. ‘Si juu yetu’ huhifadhi kwa kiasi maana iliyodokezwa bila kuifafanua kupita kiasi.
- source_word: אִישׁ
  choice: mtu yeyote
  rationale: Katika muktadha huu nomino ya umoja ina maana ya jumla; Kiswahili cha kawaida hutumia ‘mtu yeyote.’
- source_word: מָה אַתֶּם אֹמְרִים אֶעֱשֶׂה לָכֶם
  choice: Mnasema niwafanyie nini?
  rationale: Hii ni tafsiri ya asili na fupi ya swali lililobanwa katika Kiebrania, ikionyesha kwamba Daudi anawaomba wataje wanachotaka awafanyie.
theological_decisions:
- issue: Mamlaka ya Wagibeoni ya kutekeleza hukumu ya kifo
  choice: wala si juu yetu kumuua mtu yeyote katika Israeli
  alternative: wala hatuna haki ya kumuua mtu yeyote katika Israeli
  rationale: Chaguo kuu hudokeza ukosefu wa mamlaka bila kuufanya kuwa kauli ya kisheria iliyo wazi zaidi kuliko Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nyumba yake’ imehifadhiwa kwa sababu inaweza kumaanisha familia au ukoo wa Sauli. Alama [a] imewekwa baada ya kitenzi cha kusema ili kuonyesha mbadala wa kauli inayofuata.
