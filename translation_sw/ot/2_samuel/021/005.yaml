base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/005.yaml
  text: They said to the king[a], “The man who consumed us, and who planned against us[b], so that we should be destroyed from having a place within all the territory of Israel—”
translation:
  language: sw
  text: Wakamwambia mfalme, “Yule mtu aliyetumaliza na aliyepanga dhidi yetu[a], ili tuangamizwe, tusipate kuwa na mahali popote katika eneo lote la Israeli[b]—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyefanya hila dhidi yetu.” Kitenzi cha Kiebrania kinaweza kumaanisha kupanga au kutunga shauri.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “tusiweze kusimama au kujiweka katika eneo lote la Israeli,” yaani, tusiendelee kuwa na mahali popote nchini Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּלָּנוּ
  choice: aliyetumaliza
  rationale: Kitenzi כלה kina wazo la kufikisha mwisho au kumaliza kabisa. ‘Aliyetumaliza’ huhifadhi nguvu ya shtaka kwa Kiswahili cha kawaida bila kudai kwamba wote walikuwa tayari wameuawa.
- source_word: דִּמָּה לָנוּ
  choice: aliyepanga dhidi yetu
  rationale: Katika muktadha huu דמה inaelekea kumaanisha kupanga au kutunga shauri, huku לָנוּ ikiwa na maana ya uadui; hivyo ‘dhidi yetu’ huonyesha nia ya madhara.
- source_word: נִשְׁמַדְנוּ
  choice: ili tuangamizwe
  rationale: Nifali ya שׁמד huonyesha kuharibiwa au kuangamizwa. Muundo huu huhifadhi kauli tendwa na uhusiano wa kusudi au matokeo ulio katika sentensi.
- source_word: מֵהִתְיַצֵּב
  choice: tusipate kuwa na mahali popote
  rationale: Ingawa התייצב kihalisi ni kusimama au kujiweka mahali, hapa inaeleza kuzuiwa kuendelea kuwa na uwepo katika Israeli. Kiswahili hiki huwasilisha maana hiyo ya kimuktadha.
- source_word: בְּכָל גְּבֻל יִשְׂרָאֵל
  choice: katika eneo lote la Israeli
  rationale: גְּבוּל hapa ni eneo au milki, si mstari wa mpaka pekee. ‘Eneo lote’ huhifadhi upeo mpana wa usemi.
- source_word: הָאִישׁ
  choice: Yule mtu
  rationale: Nomino yenye kiarifu inamrejelea Sauli aliyetajwa katika muktadha. ‘Yule mtu’ ni rejeo la kawaida na la wazi katika mazungumzo ya Kiswahili.
