  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mstari umeachwa ukiishia kwa alama ya mkato kwa sababu kauli inaendelea katika mstari unaofuata. Alama zote za tanbihi zimewekwa katika matini kuu.
