base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/015.yaml
  text: And there was war again between the Philistines and Israel[a], and David went down with his servants with him, and they fought against the Philistines, and David grew weary.
translation:
  language: sw
  text: Kulikuwa tena na vita kati ya Wafilisti na Israeli. Daudi akashuka pamoja na watumishi wake[a], wakapigana na Wafilisti; naye Daudi akachoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wake.” Kiebrania kinasema “watumishi wake,” usemi wa kawaida kwa watu waliokuwa katika utumishi wa mfalme, wakiwemo wapiganaji wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: Kulikuwa tena na vita
  rationale: Kauli hii ya kawaida ya Kiswahili huhifadhi maana ya kutokea tena kwa hali ya vita bila kutumia mtindo wa kizamani.
- source_word: לַפְּלִשְׁתִּים אֶת יִשְׂרָאֵל
  choice: kati ya Wafilisti na Israeli
  rationale: Muundo wa Kiebrania unaonyesha pande mbili zinazopingana; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: וַיֵּרֶד
  choice: akashuka
  rationale: Huhifadhi maana ya msingi ya ירד na huenda ikaonyesha kushuka kuelekea eneo la mapigano.
- source_word: וַעֲבָדָיו עִמּוֹ
  choice: pamoja na watumishi wake
  rationale: ‘Watumishi’ huhifadhi maana ya עֲבָדִים, huku ‘pamoja na’ ikiwakilisha wazi kwamba walikuwa naye bila urudiaji usio wa kawaida katika Kiswahili.
- source_word: וַיִּלָּחֲמוּ אֶת פְּלִשְׁתִּים
  choice: wakapigana na Wafilisti
  rationale: Ni usemi wa moja kwa moja na wa kawaida wa Kiswahili kwa kushiriki katika mapigano dhidi ya upande mwingine.
- source_word: וַיָּעַף
  choice: akachoka
  rationale: Kitenzi kinaonyesha Daudi kufikia hali ya uchovu wakati wa mapigano; ‘akachoka’ ni wazi, asilia, na hakizidishi kiwango cha uchovu kuliko chanzo.
