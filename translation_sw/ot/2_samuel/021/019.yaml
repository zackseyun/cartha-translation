base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/019.yaml
  text: And there was again war at Gob with the Philistines[a], and Elhanan son of Jaare-oregim the Bethlehemite struck down Goliath the Gittite[b], and the shaft of his spear was like a weaver’s beam.
translation:
  language: sw
  text: Kulikuwa tena na vita huko Gobu dhidi ya Wafilisti,[a] naye Elhanani mwana wa Yaare-Oregimu,[b] Mmbethlehemu, akampiga Goliathi, Mgathi; na mpini wa mkuki wake ulikuwa kama mti wa wafumaji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '1 Mambo ya Nyakati 20:5 ina usomaji tofauti: inasema kwamba Elhanani alimuua Lahmi, ndugu ya Goliathi. Wengi huona kwamba maandishi ya Samweli hapa yana usomaji mgumu au ulioharibika, na hivyo huyapatanisha na kifungu hicho.'
    reason: textual_variant
  - marker: b
    text: Jina la baba katika Kiebrania, “Yaare-Oregimu,” ni gumu. Baadhi hudhani kwamba neno oregimu (“wafumaji”) lilinakiliwa hapa kimakosa kutoka mwisho wa mstari.
    reason: textual_variant
lexical_decisions:
- source_word: בְּ/ג֖וֹב
  choice: huko Gobu
  rationale: Kiambishi בְ pamoja na jina la mahali hapa kinaonyesha eneo la mapigano. Umbo “Gobu” linafuata uasilishaji wa kawaida wa majina ya Kiebrania katika Kiswahili.
- source_word: וַ/יַּ֡ךְ
  choice: akampiga
  rationale: Kitenzi נכה kinaweza kumaanisha kupiga au kuua. “Akampiga” kinahifadhi upana wa maana ya kitenzi bila kutaja wazi zaidi ya maandishi ya Kiebrania, ingawa muktadha ni wa mapigano.
- source_word: יַעְרֵ֨י אֹרְגִ֜ים
  choice: Yaare-Oregimu
  rationale: Maandishi ya Kimasora yana umbo hili gumu la jina. Tafsiri inalihifadhi badala ya kulisahihisha kimya kimya kwa kufuata 1 Mambo ya Nyakati 20:5.
- source_word: בֵּ֣ית הַלַּחְמִ֗י
  choice: Mbethlehemu
  rationale: Hili ni neno la kumtaja mtu anayetoka Bethlehemu; “Mbethlehemu” ni umbo fupi na la kawaida katika Kiswahili cha Biblia.
- source_word: אֵ֚ת גָּלְיָ֣ת הַ/גִּתִּ֔י
  choice: Goliathi, Mgathi
  rationale: Maandishi yaliyopokelewa yanamtaja Goliathi moja kwa moja kuwa ndiye aliyepigwa na kumtambua kuwa mtu wa Gathi. Tofauti ya 1 Mambo ya Nyakati 20:5 imeelezwa katika tanbihi.
- source_word: וְ/עֵ֣ץ חֲנִית֔/וֹ
  choice: mpini wa mkuki wake
  rationale: עֵץ maana yake ya msingi ni “mti” au “kitu cha mbao,” lakini katika muundo huu inarejelea sehemu ya mbao ya mkuki; “mpini” ni usemi wa asili na unaoeleweka.
- source_word: כִּ/מְנ֖וֹר אֹרְגִֽים
  choice: kama mti wa mfumaji
  rationale: Neno מְנוֹר linarejelea boriti au mti wa kifaa cha kufumia. Usemi huu unahifadhi tashbihi ya Kiebrania kuhusu unene wa mkuki.
theological_decisions:
- issue: Mvutano unaoonekana kati ya mstari huu, simulizi la Daudi kumuua Goliathi katika 1 Samweli 17, na 1 Mambo ya Nyakati 20:5
  choice: Kuhifadhi katika maandishi makuu usomaji wa Kimasora kwamba Elhanani alimpiga Goliathi, Mgathi.
  alternative: Kutafsiri kwa upatanisho kwamba Elhanani alimuua Lahmi, ndugu ya Goliathi, Mgathi.
  rationale: Chanzo cha Kiebrania kilichotolewa kinamtaja Goliathi wazi kuwa ndiye aliyepigwa. Tofauti muhimu ya kifungu sambamba haijaingizwa kimya kimya katika maandishi makuu, bali imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Majina yametoholewa kwa maumbo yanayotambulika katika mapokeo ya Kiswahili. Usomaji mgumu wa Kimasora umehifadhiwa, huku tofauti ya kifungu sambamba ikifafanuliwa katika tanbihi.
