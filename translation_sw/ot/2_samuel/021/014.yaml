base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/014.yaml
  text: They buried the bones of Saul and of Jonathan his son in the land of Benjamin[a], in Zela, in the tomb of Kish his father. They did all that the king had commanded, and after that God responded to the plea for the land.
translation:
  language: sw
  text: Wakazika mifupa ya Sauli na ya Yonathani mwanawe katika nchi ya Benyamini, huko Sela, katika kaburi la Kishi, baba yake Sauli. Wakafanya yote ambayo mfalme alikuwa ameamuru. Baada ya hayo, Mungu akaitikia dua kwa ajili ya nchi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu akakubali kusihiwa kwa ajili ya nchi,” au, “Mungu akajibu maombi kwa ajili ya nchi.” Kitenzi cha Kiebrania kinaonyesha kuitikia ombi kwa fadhili.
    reason: Njia mbadala za kutafsiri kitenzi וַיֵּעָתֵר huku zikihifadhi wazo la kusihi na mwitikio wenye kibali.
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: Wakazika
  rationale: Kitenzi קבר kina maana ya kuzika; umbo la usimulizi linaendeleza mfuatano wa matukio kwa wakati uliopita.
- source_word: עַצְמוֹת
  choice: mifupa
  rationale: Hili ndilo neno halisi la Kiebrania; halijapanuliwa kuwa ‘mabaki.’
- source_word: שָׁאוּל וִיהוֹנָתָן בְּנוֹ
  choice: ya Sauli na ya Yonathani mwanawe
  rationale: Urudiaji wa ‘ya’ unaonyesha wazi kuwa mifupa ilikuwa ya watu wote wawili, huku ‘mwanawe’ ikihifadhi uhusiano wa Yonathani na Sauli.
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: katika nchi ya Benyamini
  rationale: Inahifadhi neno אֶרֶץ na maana yake ya eneo la kabila.
- source_word: בְּצֵלָע
  choice: huko Sela
  rationale: Jina la mahali limetoholewa kwa tahajia ya kawaida ya Kiswahili; ‘huko’ linaunganisha mahali hapa kwa kawaida na nchi ya Benyamini.
- source_word: בְּקֶבֶר קִישׁ אָבִיו
  choice: katika kaburi la Kishi, baba yake Sauli
  rationale: קֶבֶר ni kaburi. Kutaja Sauli kunazuia Kiswahili kisieleweke kimakosa kana kwamba Kishi alikuwa baba ya Yonathani; Kishi anajulikana katika muktadha kuwa baba ya Sauli.
- source_word: וַיַּעֲשׂוּ כֹּל אֲשֶׁר צִוָּה הַמֶּלֶךְ
  choice: Wakafanya yote ambayo mfalme alikuwa ameamuru
  rationale: Inahifadhi maana ya kutekeleza mambo yote yaliyoamriwa kabla ya hatua hizi.
- source_word: וַיֵּעָתֵר אֱלֹהִים
  choice: Mungu akaitikia dua
  rationale: Nifali ya עתר huonyesha kukubali au kuitikia ombi kwa fadhili. ‘Akaitikia dua’ ni ya asili katika Kiswahili na inaonyesha maana ya ombi iliyomo katika kitenzi bila kuongeza kwamba Mungu ‘aliiponya’ nchi.
- source_word: לָאָרֶץ
  choice: kwa ajili ya nchi
  rationale: Kiambishi ל kinaonyesha jambo ambalo dua na mwitikio vililihusu au kulinufaisha.
- source_word: אַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba mwitikio ulifuata matendo yaliyotangulia.
theological_decisions:
- issue: Maana ya וַיֵּעָתֵר אֱלֹהִים לָאָרֶץ
  choice: Mungu akaitikia dua kwa ajili ya nchi
  alternative: Mungu akakubali kusihiwa kwa ajili ya nchi; Mungu akajibu maombi kwa ajili ya nchi
  rationale: Kitenzi עתר katika nifali kinaashiria mwitikio wenye kibali kwa kusihiwa, ingawa aya haitaji mwenye kuomba wala maneno ya ombi. Tafsiri haiongezi dai lenye nguvu zaidi kwamba Mungu ‘aliiponya nchi.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi ndefu ya Kiebrania imegawanywa ili usimulizi usomeke kwa kawaida. Majina yametoholewa kuwa Sauli, Yonathani, Benyamini, Sela, na Kishi.
