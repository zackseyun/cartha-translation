  text: וַ/יְהִ֣י רָעָב֩ בִּ/ימֵ֨י דָוִ֜ד שָׁלֹ֣שׁ שָׁנִ֗ים שָׁנָה֙ אַחֲרֵ֣י שָׁנָ֔ה וַ/יְבַקֵּ֥שׁ דָּוִ֖ד אֶת פְּנֵ֣י יְהוָ֑ה וַ/יֹּ֣אמֶר יְהוָ֗ה אֶל שָׁאוּל֙ וְ/אֶל בֵּ֣ית הַ/דָּמִ֔ים עַל אֲשֶׁר הֵמִ֖ית אֶת הַ/גִּבְעֹנִֽים־ס־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/001.yaml
  text: There was a famine in the days of David for three years[a], year after year. And David sought the face of Yahweh, and Yahweh said, “It is because of Saul and his bloodguilty house[b], because he put the Gibeonites to death.”
translation:
  language: sw
  text: Katika siku za Daudi kulikuwa na njaa kwa miaka mitatu, mwaka baada ya mwaka. Daudi akatafuta uso wa Yahweh[a], naye Yahweh akasema, “Ni kwa sababu ya Sauli na nyumba yake yenye hatia ya umwagaji damu[b], kwa kuwa aliwaua Wagibeoni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamtafuta Yahweh” au “akamwuliza Yahweh”; kwa neno halisi, “akatafuta uso wa Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “nyumba ya damu”; hii ni nahau ya Kiebrania inayomaanisha nyumba au ukoo wenye hatia ya umwagaji damu.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: njaa
  rationale: Katika simulizi hili neno linaonyesha upungufu mkubwa wa chakula ulioikumba nchi, si hisia ya kawaida ya kuwa na njaa.
- source_word: שָׁלֹשׁ שָׁנִים שָׁנָה אַחֲרֵי שָׁנָה
  choice: kwa miaka mitatu, mwaka baada ya mwaka
  rationale: Muundo huu unahifadhi idadi ya miaka na msisitizo wa Kiebrania kwamba njaa iliendelea bila kukoma mwaka mmoja baada ya mwingine.
- source_word: וַיְבַקֵּשׁ ... אֶת־פְּנֵי יְהוָה
  choice: akautafuta uso wa Yahweh
  rationale: Tafsiri hii inahifadhi nahau ya Kiebrania ‘kutafuta uso wa’ na maana yake ya kumwendea Mungu ili kupata jibu, bila kuifupisha moja kwa moja kuwa ‘akamwuliza.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: בֵּית הַדָּמִים
  choice: nyumba yake yenye hatia ya umwagaji damu
  rationale: ‘Nyumba’ inadumisha taswira ya ukoo au jamaa ya Sauli, huku ‘yenye hatia ya umwagaji damu’ ikieleza nahau ya Kiebrania ‘nyumba ya damu’ kwa Kiswahili kinachoeleweka.
- source_word: עַל אֲשֶׁר הֵמִית אֶת־הַגִּבְעֹנִים
  choice: kwa kuwa aliwaua Wagibeoni
  rationale: Kitenzi cha umoja kinamrejelea Sauli kama mhusika mkuu; ‘aliwaua’ ni wazi na cha kawaida katika simulizi la Kiswahili.
- source_word: הַגִּבְעֹנִים
  choice: Wagibeoni
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la kundi hilo la watu.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Unukuzi ‘Yahweh’ huhifadhi jina binafsi lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- issue: Sababu ya njaa katika jibu la Yahweh
  choice: Ni kwa sababu ya Sauli na nyumba yake yenye hatia ya umwagaji damu
  alternative: Ni juu ya Sauli na juu ya nyumba ya damu
  rationale: Muktadha unaonyesha kuwa jibu linaeleza sababu ya njaa. Kiswahili kinahitaji uhusiano huo wa kisababishi usemwe wazi, huku dhana ya hatia ya umwagaji damu ikihifadhiwa.
- issue: Mhusika wa kitendo cha kuwaua Wagibeoni
  choice: Sauli ndiye anayerejelewa na ‘aliwaua’
  alternative: Nyumba ya Sauli kwa ujumla ndiyo inayorejelewa
  rationale: Kitenzi cha Kiebrania ni cha umoja na kinarejea kwa urahisi zaidi kwa Sauli, ingawa kutajwa kwa nyumba yake kunahusisha jamaa yake katika hatia hiyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Nahau muhimu ya ‘kutafuta uso’ imehifadhiwa katika matini na kufafanuliwa katika tanbihi; ‘nyumba’ pia imehifadhiwa ili kutopoteza wazo la ukoo au nasaba.
