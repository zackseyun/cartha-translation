base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/018.yaml
  text: After this[a], there was again war with the Philistines at Gob, and then Sibbecai the Hushathite struck down Saph[b], who was among the descendants of Rapha.
translation:
  language: sw
  text: Baada ya hayo, kukawa tena vita huko Gobu dhidi ya Wafilisti. Ndipo Sibekai Mhushathi akamwangusha Safu[a], aliyekuwa miongoni mwa wazao wa Rafa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maandishi ya Kiebrania hapa yana jina “Saf” (lililonukuliwa “Safu” kwa Kiswahili); katika simulizi linalolingana kwenye 1 Mambo ya Nyakati 20:4 jina ni “Sipai.”
    reason: textual_variant
  - marker: b
    text: Au, “aliyekuwa miongoni mwa wazao wa lile jitu.” Kiebrania kinaweza kurejelea mtu au ukoo ulioitwa Rafa, au ukoo wa majitu/Warefai.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Ni kiunganishi cha kawaida cha wakati kinachodumisha mfuatano wa simulizi kwa Kiswahili cha sasa.
- source_word: וַתְּהִי עוֹד הַמִּלְחָמָה
  choice: vita vilitokea tena
  rationale: Huwasilisha kwa lugha ya kawaida dhana ya kutokea tena kwa vita iliyomo katika עוֹד.
- source_word: בְּגֹב
  choice: huko Gobu
  rationale: בְּ hapa hutaja mahali pa mapigano; “huko” ni ya asili katika simulizi ya Kiswahili, na Gobu ni unukuzi wa jina la mahali.
- source_word: עִם פְּלִשְׁתִּים
  choice: kati ya Israeli na Wafilisti
  rationale: Neno עִם linaonyesha upande uliopigana na Wafilisti. Kutaja Israeli wazi kunafanya sentensi iwe ya kawaida kwa Kiswahili na mhusika huyo anaeleweka kutokana na muktadha wa simulizi.
- source_word: אָז
  choice: Ndipo
  rationale: Huonyesha tukio lililofuata katika mfuatano wa simulizi kwa ufupi na kwa lugha ya asili.
- source_word: הִכָּה
  choice: akamwangusha
  rationale: Katika muktadha wa vita kitenzi נכה humaanisha kumpiga na kumshinda, mara nyingi kwa kumwua. “Akamwangusha” hudumisha nguvu ya kimapambano bila kulazimisha maana pana zaidi ya mzizi.
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: Sibekai Mhushathi
  rationale: Majina yamenukuliwa kwa tahajia inayoweza kusomeka kwa Kiswahili; nisba הַחֻשָׁתִי imehifadhiwa badala ya kufasiriwa kwa kubahatisha.
- source_word: סַף
  choice: Safu
  rationale: Hufuata usomaji wa maandishi ya Kiebrania ya WLC katika mstari huu; umbo tofauti katika 1 Mambo ya Nyakati 20:4 limetajwa katika tanbihi.
- source_word: אֲשֶׁר בִּילִדֵי הָרָפָה
  choice: aliyekuwa miongoni mwa wazao wa Rafa
  rationale: “Wazao” huonyesha ukoo bila kulazimisha kuwa מדובר ni wana wa moja kwa moja, na “Rafa” huhifadhi uwezekano wa jina la babu au ukoo.
theological_decisions:
- issue: Iwapo הָרָפָה litafsiriwe kama jina “Rafa” au kama maelezo “jitu”
  choice: Rafa, kama jina la babu au ukoo
  alternative: jitu; Mrefai
  rationale: Katika muundo unaotaja wazao, rejeo la ukoo linafaa zaidi. Kutumia “Rafa” katika matini kuu huhifadhi umbo la Kiebrania na kuepuka kuamua kimya kimya kwamba neno hilo linamaanisha “jitu”; uwezekano huo umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Tahajia za majina zimebadilishwa ili zilingane na mfumo wa sauti wa Kiswahili. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
