base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/020.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six and six, twenty-four in number[c][b]; he also was born to the Rapha.
translation:
  language: sw
  text: Kulikuwa tena na vita huko Gathi, ambako kulikuwa na mtu mwenye kimo kikubwa sana[a], aliyekuwa na vidole sita katika kila mkono na vidole sita katika kila mguu—jumla yake vidole ishirini na vinne[b]. Yeye pia alikuwa mzao wa Rafa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu mkubwa sana”; kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “mtu wa kipimo.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania husema, “vidole vya mikono yake na vidole vya miguu yake, sita na sita.” Hesabu ya vidole ishirini na vinne inaonyesha vidole sita katika kila mkono na kila mguu.
    reason: lexical_clarification
  - marker: c
    text: Au, “alitokana na Rafa.” Huenda “Rafa” hapa ikihusiana na Warefai, kundi lililojulikana kwa watu wenye miili mikubwa.
    reason: alternative_reading
lexical_decisions:
- source_word: מִלְחָמָה
  choice: vita
  rationale: Neno hili linaweza kumaanisha vita au mapigano; “vita” linafaa katika muktadha wa mfululizo wa mapambano.
- source_word: בְּגַת
  choice: huko Gathi
  rationale: Kiambishi בְּ kinaonyesha mahali; “huko Gathi” ni Kiswahili cha kawaida kwa eneo la vita.
- source_word: אִישׁ מדין
  choice: mtu mwenye kimo kikubwa sana
  rationale: Kirai hiki kinahusiana na kipimo au ukubwa wa mwili. Tafsiri hii inaeleza ukubwa usio wa kawaida bila kutumia tafsiri sisisi isiyo ya kawaida katika Kiswahili.
- source_word: אֶצְבְּעֹת יָדָיו ... אֶצְבְּעֹת רַגְלָיו
  choice: vidole ... katika kila mkono ... katika kila mguu
  rationale: Kiswahili hutumia “vidole” kwa mikono na miguu. Kutaja kila mkono na kila mguu kunaweka wazi hesabu ya jumla ya vidole ishirini na vinne.
- source_word: שֵׁשׁ וָשֵׁשׁ
  choice: sita ... na ... sita
  rationale: Kurudiwa kwa namba sita kunadumishwa kwa mikono na miguu, huku muundo wa Kiswahili ukifafanua kwamba kila kiungo kilikuwa na vidole sita.
- source_word: עֶשְׂרִים וְאַרְבַּע מִסְפָּר
  choice: jumla yake vidole ishirini na vinne
  rationale: Hii inawasilisha wazi muhtasari wa hesabu unaotolewa na Kiebrania.
- source_word: יֻלַּד לְהָרָפָה
  choice: alikuwa mzao wa Rafa
  rationale: Muundo wa kitenzi ילד pamoja na לְ unaonyesha kuzaliwa au nasaba. “Mzao wa Rafa” ni Kiswahili cha asili kinachohifadhi maana ya ukoo.
theological_decisions:
- issue: Utambulisho wa הָרָפָה
  choice: Rafa kama jina la babu au ukoo
  alternative: jitu; Warefai
  rationale: Andiko linaelekea kueleza nasaba, si ukubwa pekee. Kulihifadhi “Rafa” kama jina huepuka kuingiza tafsiri ya “jitu” katika andiko kuu, huku tanbihi ikionyesha uwezekano wa uhusiano na Warefai.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo umegawanywa katika sentensi fupi kwa uwazi, bila kupoteza mtiririko wa simulizi au jumla ya hesabu.
