source:
  edition: WLC
  text: ו/ישבו בְּנֹ֜ב אֲשֶׁ֣ר בִּ/ילִידֵ֣י הָ/רָפָ֗ה וּ/מִשְׁקַ֤ל קֵינ/וֹ֙ שְׁלֹ֤שׁ מֵאוֹת֙ מִשְׁקַ֣ל נְחֹ֔שֶׁת וְ/ה֖וּא חָג֣וּר חֲדָשָׁ֑ה וַ/יֹּ֖אמֶר לְ/הַכּ֥וֹת אֶת דָּוִֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/016.yaml
  text: And Ishbi-benob[a], who was among the descendants of Rapha, whose spear weighed three hundred shekels of bronze, and who was girded with a new sword[c][b], said that he would strike down David.
translation:
  language: sw
  text: Naye Ishbi-benobu[a], aliyekuwa mmoja wa wazao wa Rafa[b], ambaye uzito wa mkuki wake ulikuwa shekeli mia tatu za shaba, na ambaye alikuwa amejifunga upanga mpya kiunoni[c], akasema kwamba angempiga Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Umbo la jina hili la Kiebrania halina uhakika. “Ishbi-benobu” hufuata uelewa wa jadi; huenda pia likasomwa “Yesbi-benobu,” au konsonanti zake zikagawanywa kwa njia tofauti.
    reason: textual_variant
  - marker: b
    text: Au, “mmoja wa waliozaliwa kwa Rafa.” Inaelekea msemo huu unarejelea ukoo wa majitu uliohusishwa na Warefaimu.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema tu “kipya”; nomino haikutajwa. Kwa kawaida hueleweka kuwa “upanga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וישבו / בְּנֹב
  choice: Ishbi-benobu
  rationale: Maandishi ya konsonanti ni magumu, lakini uelewa wa jadi unaichukulia kama jina la mtu. Umbo la Kiswahili linafuata jina Ishbi-benob kwa kuongeza irabu ya mwisho ili litamkike kwa urahisi.
- source_word: אֲשֶׁר בִּילִידֵי הָרָפָה
  choice: aliyekuwa mmoja wa wazao wa Rafa
  rationale: Neno יְלִידֵי hapa linaonyesha ukoo au asili. 'Wazao wa Rafa' ni Kiswahili cha kawaida kinachodumisha Rafa kama jina badala ya kulifafanua moja kwa moja kuwa jitu.
- source_word: וּמִשְׁקַל קֵינוֹ
  choice: ambaye mkuki wake ... ulikuwa na uzito
  rationale: קֵין katika muktadha huu wa vita kwa kawaida hueleweka kuwa mkuki au mpini wa mkuki. Muundo wa kishazi tegemezi unasomeka kwa ufasaha katika Kiswahili.
- source_word: שְׁלֹשׁ מֵאוֹת מִשְׁקַל נְחֹשֶׁת
  choice: wa shaba ... shekeli mia tatu
  rationale: Shekeli imehifadhiwa kama kipimo cha kale kwa uwazi wa kihistoria. נְחֹשֶׁת katika muktadha wa silaha imetafsiriwa 'shaba,' neno la kawaida la Kiswahili kwa bronze/brass.
- source_word: וְהוּא חָגוּר חֲדָשָׁה
  choice: alikuwa amejifunga upanga mpya
  rationale: חֲדָשָׁה ni kivumishi cha kike kisicho na nomino iliyotajwa. 'Upanga' umetolewa kwa mujibu wa uelewa wa jadi na muktadha, huku tanbihi ikihifadhi udhahiri wa ellipsisi na kutokuwa na uhakika.
- source_word: וַיֹּאמֶר לְהַכּוֹת אֶת דָּוִד
  choice: akasema kwamba angempiga Daudi
  rationale: Kiebrania kinasema kihalisi 'akasema kumpiga Daudi' na katika muktadha kinaonyesha azimio au nia. 'Angempiga' huhifadhi kitenzi bila kuongeza kwa lazima wazo mahususi la kumuua.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Majina yamebadilishwa kiasi kufuata matamshi ya Kiswahili; vipimo vya kale vimehifadhiwa. Uambiguiti wa maandishi, ukoo wa Rafa, na nomino iliyoachwa baada ya 'mpya' umeonyeshwa katika tanbihi.
