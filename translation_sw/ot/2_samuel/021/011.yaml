  text: And it was reported to David what Rizpah daughter of Aiah, Saul’s concubine, had done.
translation:
  language: sw
  text: Daudi akaambiwa yale ambayo Rispa binti Aya, suria wa Sauli, alikuwa amefanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: akaambiwa
  rationale: Kauli tendwa ya נגד inaonyesha kwamba habari ilifikishwa kwa Daudi. “Akaambiwa” ni ya kawaida na ya asili katika simulizi la Kiswahili, huku ikihifadhi kauli tendwa.
- source_word: לְדָוִד
  choice: Daudi
  rationale: לְ humtambulisha mpokeaji wa taarifa; katika muundo wa Kiswahili “Daudi akaambiwa,” mpokeaji huwekwa kama kiima cha kisarufi cha kitenzi cha kutendwa.
- source_word: אֵת אֲשֶׁר
  choice: yale ambayo
  rationale: Muunganiko huu unaanzisha yaliyomo katika taarifa. “Yale ambayo” ni wazi na huhifadhi muundo wa kishazi husishi.
- source_word: עָשְׂתָה
  choice: alikuwa amefanya
  rationale: Kitenzi kamilifu kinaeleza tendo lililotangulia kuambiwa kwa Daudi; wakati timilifu wa Kiswahili unaonyesha mpangilio huo wa matukio.
- source_word: רִצְפָּה
  choice: Rispa
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: בַת אַיָּה
  choice: binti Aya
  rationale: Utambulisho wa ukoo umetafsiriwa moja kwa moja kwa muundo wa kawaida wa Kiswahili.
- source_word: פִּלֶגֶשׁ שָׁאוּל
  choice: suria wa Sauli
  rationale: Muundo wa uhusiano na hadhi umehifadhiwa bila kuuficha; “suria” ni neno la Kiswahili linaloeleza mwanamke mwenye hadhi ya mke wa daraja la chini katika mazingira ya kale.
