  text: וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֶת שְׁ֠נֵי בְּנֵ֨י רִצְפָּ֤ה בַת אַיָּה֙ אֲשֶׁ֣ר יָלְדָ֣ה לְ/שָׁא֔וּל אֶת אַרְמֹנִ֖י וְ/אֶת מְפִבֹ֑שֶׁת וְ/אֶת חֲמֵ֗שֶׁת בְּנֵי֙ מִיכַ֣ל בַּת שָׁא֔וּל אֲשֶׁ֥ר יָלְדָ֛ה לְ/עַדְרִיאֵ֥ל בֶּן בַּרְזִלַּ֖י הַ/מְּחֹלָתִֽי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/008.yaml
  text: So the king took the two sons of Rizpah daughter of Aiah[a], whom she had borne to Saul—Armoni and Mephibosheth—and the five sons of Michal daughter of Saul, whom she had borne to Adriel son of Barzillai the Meholathite.
translation:
  language: sw
  text: Basi mfalme akawachukua wana wawili wa Rispa binti Aya, aliowazalia Sauli—Armoni na Mefiboshethi—pamoja na wana watano wa Mikali binti Sauli[a], aliowazalia Adrieli mwana wa Barzilai, Mmeholathi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati na wafasiri wa kale husoma “Merabu” badala ya “Mikali”; linganisha 1 Samweli 18:19, ambako inasemekana Adrieli alimwoa Merabu, binti Sauli.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח הַמֶּלֶךְ
  choice: Basi mfalme akawachukua
  rationale: Waw ya usimulizi inaendeleza tukio; “Basi” na kitenzi cha mfululizo “akawachukua” vinatoa mtiririko wa kawaida wa Kiswahili huku cheo “mfalme” kikihifadhiwa badala ya kuweka jina Daudi.
- source_word: שְׁנֵי בְּנֵי רִצְפָּה בַת אַיָּה
  choice: wana wawili wa Rispa binti Aya
  rationale: Muundo wa idadi katika hali ya kuambatanisha unamaanisha wana wawili; majina yamenukuliwa kwa namna inayofaa Kiswahili cha Biblia.
- source_word: אֲשֶׁר יָלְדָה לְשָׁאוּל
  choice: aliokuwa amemzalia Sauli
  rationale: Kitenzi ילד pamoja na ל kinaonyesha Sauli kuwa baba; wakati uliotangulia unaonyesha uzazi ulitangulia tendo la mfalme kuwachukua.
- source_word: אַרְמֹנִי וְאֶת מְפִבֹשֶׁת
  choice: Armoni na Mefiboshethi
  rationale: Majina maalumu yamenukuliwa kwa tahajia inayosomeka kwa Waswahili; ukoo katika mstari unatofautisha Mefiboshethi huyu na mwana wa Yonathani.
- source_word: חֲמֵשֶׁת בְּנֵי מִיכַל בַּת שָׁאוּל
  choice: wana watano wa Mikali binti Sauli
  rationale: Maandishi ya Kiebrania ya WLC yanasoma Mikali; usomaji huo umehifadhiwa katika matini kuu bila kuupatanisha kimya na 1 Samweli 18:19.
- source_word: אֲשֶׁר יָלְדָה לְעַדְרִיאֵל
  choice: aliokuwa amemzalia Adrieli
  rationale: Muundo uleule wa ילד pamoja na ל umetafsiriwa kwa uthabiti, ukimtaja Adrieli kuwa baba.
- source_word: בֶּן בַּרְזִלַּי הַמְּחֹלָתִי
  choice: mwana wa Barzilai, Mmeholathi
  rationale: Uhusiano wa kifamilia umeelezwa moja kwa moja, na kivumishi cha mahali au jamii kimetolewa kwa umbo la kawaida la Kiswahili “Mmeholathi.”
theological_decisions:
- issue: Mvutano wa kihistoria na kimatini kuhusu Mikali kuwa mama wa wana wa Adrieli
  choice: Kuhifadhi “Mikali” katika matini kuu na kuweka “Merabu” katika tanbihi
  alternative: Merabu binti Sauli
  rationale: WLC inasoma Mikali hapa, lakini 1 Samweli 18:19 inasema Adrieli alimwoa Merabu. Tafsiri haipaswi kuondoa mvutano huo kwa kubadili matini kimya; tanbihi inaweka ushahidi mwingine wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Muundo mrefu wa Kiebrania umegawanywa kwa vistari na alama za mkato bila kuficha uhusiano wa vikundi viwili. “Pamoja na” limeongezwa kwa uwazi wa orodha ya vitu vilivyochukuliwa, bila kubadili maana.
