base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/009.yaml
  text: He gave them into the hand of the Gibeonites[a], and they hanged them on the mountain before Yahweh, and the seven of them fell together. They were put to death in the first days of harvest, at the beginning of the barley harvest.
translation:
  language: sw
  text: Akawakabidhi mikononi mwa Wagibeoni, nao wakawatundika[a] juu ya mlima mbele za Yahwe. Wote saba wakaanguka pamoja. Waliuawa katika siku za kwanza za mavuno, mwanzoni mwa mavuno ya shayiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawatoboa kwa vigingi” au “wakawaweka hadharani.” Kitenzi cha Kiebrania kinaweza kumaanisha kwa upana zaidi kutundika au kuanika miili hadharani; hakibainishi kwa uhakika njia yenyewe ya kuuawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵם בְּיַד
  choice: Akawakabidhi mikononi mwa
  rationale: Muundo wa Kiebrania una maana ya kuwakabidhi chini ya mamlaka ya wengine, si kuwapa tu kama vitu. Kiswahili hiki ni cha kawaida na pia kinadumisha taswira ya ‘mikononi mwa’.
- source_word: הַגִּבְעֹנִים
  choice: Wagibeoni
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la kundi hili la watu.
- source_word: וַיֹּקִיעֻם
  choice: wakawatundika
  rationale: Kitenzi kinaeleza kuuawa au kuanikwa hadharani kwa kuwatundika au kuwachoma kwa vigingi. ‘Wakawatundika’ ni tafsiri wazi ya simulizi, huku tanbihi ikihifadhi kutokuwa na uhakika kuhusu njia yenyewe.
- source_word: בָּהָר
  choice: juu ya mlima
  rationale: Hutoa maana ya mahali pa tukio kwa Kiswahili cha kawaida na huakisi nomino ya umoja ya Kiebrania.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huhifadhi lugha ya uwepo na uzito wa kiagano au wa hukumu bila kuufafanua zaidi ya maandiko.
- source_word: וַיִּפְּלוּ שבעתים יָחַד
  choice: Wote saba wakaanguka pamoja
  rationale: Huhifadhi taswira ya Kiebrania ya kuanguka katika kifo na kusisitiza kwamba wale saba walipatwa na jambo hilo pamoja.
- source_word: הֻמְתוּ
  choice: Waliuawa
  rationale: Ni Kiswahili cha kawaida kinachowasilisha kwa usahihi kauli tendwa ya kusababishwa kufa.
- source_word: בִּימֵי קָצִיר בָּרִאשֹׁנִים
  choice: katika siku za kwanza za mavuno
  rationale: Hufuata alama ya wakati katika Kiebrania kwa lugha ya kawaida na yenye heshima.
- source_word: תְּחִלַּת קְצִיר שְׂעֹרִים
  choice: mwanzoni mwa mavuno ya shayiri
  rationale: Hufafanua kwa usahihi kwamba wakati huo ulikuwa mwanzo wa msimu wa kuvuna shayiri.
theological_decisions:
- issue: Maana ya njia ya kuuawa katika kitenzi יקע
  choice: wakawatundika
  alternative: wakawachoma kwa vigingi; wakawaweka hadharani
  rationale: Kitenzi kinaweza kuashiria kutundika, kuchoma kwa vigingi, au kuanika mwili hadharani. Matini kuu inatumia kauli inayoeleweka kwa urahisi, na tanbihi inahifadhi uwezekano mwingine bila kudai kwa uhakika njia kamili ya kuuawa.
- issue: Maana ya לִפְנֵי יְהוָה katika tukio la hukumu
  choice: mbele za Yahwe
  alternative: katika uwepo wa Yahwe
  rationale: Tafsiri hii huhifadhi uzito wa usemi wa Kiebrania bila kuamua ikiwa unamaanisha mahali patakatifu, idhini ya Mungu, au uwajibikaji wa kiagano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akawakabidhi mikononi mwa’ ni msemo wa asili unaohifadhi maana ya kuhamisha watu chini ya mamlaka ya Wagibeoni. Jina la Mungu limetafsiriwa ‘Yahwe’ kulingana na tabaka la marejeo la mradi.
