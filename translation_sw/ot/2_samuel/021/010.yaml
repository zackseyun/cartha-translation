  text: וַ/תִּקַּ֣ח רִצְפָּה֩ בַת אַיָּ֨ה אֶת הַ/שַּׂ֜ק וַ/תַּטֵּ֨/הוּ לָ֤/הּ אֶל הַ/צּוּר֙ מִ/תְּחִלַּ֣ת קָצִ֔יר עַ֛ד נִתַּךְ מַ֥יִם עֲלֵי/הֶ֖ם מִן הַ/שָּׁמָ֑יִם וְ/לֹֽא נָתְנָה֩ ע֨וֹף הַ/שָּׁמַ֜יִם לָ/נ֤וּחַ עֲלֵי/הֶם֙ יוֹמָ֔ם וְ/אֶת חַיַּ֥ת הַ/שָּׂדֶ֖ה לָֽיְלָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/010.yaml
  text: Then Rizpah the daughter of Aiah took sackcloth and spread it out for herself on the rock[a], from the beginning of harvest until water was poured on them from the heavens. And she did not allow the birds of the sky to rest on them by day, nor the wild animals of the field by night.
translation:
  language: sw
  text: Ndipo Rispa, binti Aya, akachukua kitambaa cha gunia, akakitandaza kwa ajili yake juu ya mwamba, tangu mwanzo wa mavuno mpaka maji yalipomwagwa juu yao kutoka mbinguni.[a] Naye hakuwaruhusu ndege wa angani kutua juu yao mchana, wala wanyama wa porini usiku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka mvua iliponyesha juu yao kutoka mbinguni.” Kiebrania kinasema kwa maana halisi zaidi, “mpaka maji yalipomwagwa juu yao kutoka mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׂק
  choice: nguo ya gunia
  rationale: Neno שַׂק humaanisha kitambaa kik粗? cha gunia kilichovaliwa au kutumiwa wakati wa maombolezo; “nguo ya gunia” ni usemi wa kawaida na unaoeleweka katika Kiswahili cha Biblia.
- source_word: וַתַּטֵּהוּ לָהּ אֶל הַצּוּר
  choice: na kujitandikia hiyo juu ya mwamba
  rationale: Kitenzi נטה hapa kina wazo la kutandaza kitambaa, na לָהּ linaonyesha kwamba alifanya hivyo kwa ajili yake mwenyewe. “Juu ya mwamba” linaeleza mahali bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: מִתְּחִלַּת קָצִיר
  choice: tangu mwanzo wa mavuno
  rationale: Tafsiri hii haiongezi aina ya zao, kwa kuwa mstari huu unasema mavuno tu.
- source_word: עַד נִתַּךְ מַיִם עֲלֵיהֶם מִן הַשָּׁמָיִם
  choice: mpaka maji yalipomwagwa juu yao kutoka mbinguni
  rationale: Muundo wa kutendwa na picha ya maji kumwagwa huhifadhi maana ya נתך kwa ukaribu; huenda maji hayo ni mvua, lakini tafsiri kuu haifuti taswira ya Kiebrania.
- source_word: עוֹף הַשָּׁמַיִם
  choice: ndege wa angani
  rationale: Huu ni usemi wa kawaida wa Kiebrania unaomaanisha ndege, na “ndege wa angani” ni Kiswahili cha asili kinachohifadhi taswira hiyo.
- source_word: לָנוּחַ עֲלֵיהֶם
  choice: kutua juu yao
  rationale: Katika muktadha wa ndege, נוח humaanisha kutua au kukaa; “kutua” ni sahihi na ya kawaida kuliko tafsiri halisi ya kupumzika.
- source_word: חַיַּת הַשָּׂדֶה
  choice: wanyama wa porini
  rationale: Usemi huu unawahusu wanyama wa mwituni; “wanyama wa porini” ni wa sasa, wazi, na wa kawaida katika Kiswahili cha Afrika Mashariki.
- source_word: יוֹמָם ... לָיְלָה
  choice: mchana ... usiku
  rationale: Maneno haya yanahifadhi ulinganifu wa nyakati mbili kwa Kiswahili fasaha na kifupi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa urahisi. Taswira ya maombolezo na ya maji kumwagwa kutoka mbinguni imehifadhiwa, huku “kutua” na “wanyama wa porini” zikitoa Kiswahili cha kawaida katika muktadha.
