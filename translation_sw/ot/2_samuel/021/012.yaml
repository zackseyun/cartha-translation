base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/012.yaml
  text: Then David went and took the bones of Saul and the bones of Jonathan his son from the citizens of Jabesh-gilead[a], who had stolen them from the public square of Beth-shan[c][b], where the Philistines had hung them on the day the Philistines struck down Saul on Gilboa.
translation:
  language: sw
  text: Ndipo Daudi akaenda akachukua mifupa[a] ya Sauli na mifupa ya Yonathani, mwana wa Sauli, kutoka kwa watu wa Yabesh-gileadi waliokuwa wameiiba mifupa hiyo kutoka uwanja wa mji wa Beth-shani, ambako Wafilisti walikuwa wameitundika siku Wafilisti walipomwangusha Sauli huko Gilboa.[c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mabaki,” ingawa Kiebrania husema kihalisi zaidi “mifupa.”
    reason: lexical_alternative
  - marker: b
    text: “Kuitundika” pia yaweza kueleweka kuwa “kuiweka wazi ili ionekane”; tafsiri yenye maana kali zaidi ni “kuichomeka juu ya nguzo,” lakini kitenzi cha Kiebrania humaanisha moja kwa moja “kutundika.”
    reason: lexical_alternative
  - marker: c
    text: Gilboa ni eneo la milima ambako Sauli alianguka; linganisha 1 Samweli 31:8–13.
    reason: cross_reference
lexical_decisions:
- source_word: עַצְמוֹת
  choice: mifupa
  rationale: Nomino hii humaanisha hasa mifupa. Katika muktadha wa kuchukua mabaki kwa ajili ya maziko, “mifupa” inadumisha uhalisi na uwazi wa Kiebrania kuliko neno pana zaidi “mabaki.”
- source_word: בַּעֲלֵי
  choice: watu wa
  rationale: Katika muundo huu pamoja na jina la mahali, neno hilo linamaanisha wenyeji au watu wanaohusishwa na Yabesh-gileadi, si wamiliki kwa maana halisi.
- source_word: יָבֵישׁ גִּלְעָד
  choice: Yabesh-gileadi
  rationale: Hili ni umbo la jina la mahali linalofaa matamshi na desturi ya majina ya Biblia katika Kiswahili.
- source_word: גָּנְבוּ
  choice: walikuwa wameiiba
  rationale: Kitenzi kinamaanisha “kuiba.” Wakati uliotumiwa unaonyesha kuwa tendo hili lilitangulia tendo la Daudi la kuichukua mifupa.
- source_word: מֵרְחֹב
  choice: kutoka uwanja wa mji
  rationale: Neno hilo humaanisha eneo wazi la umma au uwanja wa mjini. “Uwanja wa mji” ni lugha ya asili na inaonyesha mahali pa wazi pa hadhara.
- source_word: בֵּית שַׁן
  choice: Beth-shani
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: תלוּם שָׁם
  choice: walikuwa wameitundika
  rationale: Kitenzi תלה humaanisha moja kwa moja kutundika. Tafsiri hii haiongezi wazo mahususi la kuchomeka juu ya mti au nguzo, ingawa muktadha unaonyesha maonyesho ya hadhara ya miili.
- source_word: הַכּוֹת ... אֶת שָׁאוּל
  choice: walipomwangusha Sauli
  rationale: Kitenzi נכה hapa kinaonyesha pigo lililomshinda na kusababisha kifo cha Sauli. “Kumwangusha” kinadumisha nguvu ya kitenzi bila kukifafanua kupita kiasi kuwa “kumuua.”
- source_word: בַּגִּלְבֹּעַ
  choice: huko Gilboa
  rationale: Kiebrania kinataja Gilboa bila kuongeza neno “Mlima.” “Huko” ni ya kawaida katika Kiswahili na haitangulizi maelezo yasiyokuwamo moja kwa moja katika kifungu.
- source_word: וַיֵּלֶךְ ... וַיִּקַּח
  choice: Ndipo Daudi akaenda akachukua
  rationale: Mfuatano huu unaendeleza simulizi. “Ndipo” na vitenzi vya hali ya ka vinaonyesha mwendelezo huo kwa Kiswahili cha asili.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: Yonathani mwanawe
  rationale: Muundo huu unadumisha uhusiano wa maelezo katika Kiebrania na kumtambulisha Yonathani waziwazi kuwa mwana wa Sauli.
