  text: Aliitukana Israeli, naye Yonathani, mwana wa Shimei[a], ndugu wa Daudi, akampiga akamwangusha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za kale na kifungu sambamba katika 1 Mambo ya Nyakati 20:7 vina “Shimea” au “Shimeah” badala ya “Shimei.”
