lexical_decisions:
- source_word: וַיְחָרֵף
  choice: aliitukana
  rationale: Katika muktadha wa mapambano, kitenzi hiki kinaonyesha maneno ya dharau na changamoto dhidi ya Israeli. ‘Aliitukana’ ni Kiswahili cha kawaida chenye uzito unaofaa.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina linarejelea taifa kwa ujumla; umbo hili linahifadhi maana ya pamoja ya maandishi ya Kiebrania.
- source_word: וַיַּכֵּהוּ
  choice: akampiga akamwangusha
  rationale: Kitenzi נכה kimsingi ni kupiga na katika muktadha huu kinaelekea kumaanisha pigo la kuangamiza. Tafsiri hii inadumisha picha ya pigo la mapambano bila kubadili moja kwa moja kitenzi kuwa ‘akamuua.’
- source_word: יְהוֹנָתָן
  choice: Yonathani
  rationale: Hili ni umbo la kawaida la Kiswahili la jina hili la Kiebrania.
- source_word: בֶּן שמעי
  choice: mwana wa Shimei
  rationale: Tafsiri inafuata usomaji wa maandishi yaliyotolewa, שמעי, huku tofauti ya maandishi ikiwekwa katika tanbihi.
- source_word: אֲחִי דָוִד
  choice: ndugu yake Daudi
  rationale: Kiebrania kinasema kihalisi ‘ndugu wa Daudi.’ Kauli ‘ndugu yake Daudi’ ni ya kawaida na wazi katika Kiswahili cha sasa.
