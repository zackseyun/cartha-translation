  text: וַ/יַּחְמֹ֣ל הַ/מֶּ֔לֶךְ עַל מְפִי בֹ֖שֶׁת בֶּן יְהוֹנָתָ֣ן בֶּן שָׁא֑וּל עַל שְׁבֻעַ֤ת יְהוָה֙ אֲשֶׁ֣ר בֵּֽינֹתָ֔/ם בֵּ֣ין דָּוִ֔ד וּ/בֵ֖ין יְהוֹנָתָ֥ן בֶּן שָׁאֽוּל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/007.yaml
  text: But the king spared Mephibosheth son of Jonathan[a], son of Saul, because of the oath of Yahweh that was between them, between David and Jonathan son of Saul.
translation:
  language: sw
  text: Lakini mfalme alimwacha hai Mefiboshethi mwana wa Yonathani, mwana wa Sauli, kwa sababu ya kiapo cha Yahwe[a] kilichokuwa kati yao—kati ya Daudi na Yonathani mwana wa Sauli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda kikimaanisha kiapo kilichoapwa kwa jina la Yahwe; yaani, kiapo kati ya Daudi na Yonathani ambacho Yahwe aliitwa kuwa shahidi.
    reason: Hufafanua maana inayowezekana ya שְׁבֻעַת יְהוָה bila kuondoa utata wake katika andiko kuu.
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: alimwacha hai
  rationale: Katika muktadha huu kitenzi חמל humaanisha kujizuia kumuua au kumtoa auawe. “Alimwacha hai” linaeleza kwa kawaida na wazi matokeo halisi ya tendo hilo, huku likidokeza huruma.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Ni cheo chenye uelekeo maalumu kwa Daudi katika simulizi; tafsiri inadumisha cheo kilichotumiwa na Kiebrania badala ya kuweka jina lake.
- source_word: מְפִיבֹשֶׁת
  choice: Mefiboshethi
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili cha Biblia.
- source_word: בֶּן יְהוֹנָתָן בֶּן שָׁאוּל
  choice: mwana wa Yonathani, mwana wa Sauli
  rationale: Muundo huu unahifadhi urudiaji wa nasaba wa Kiebrania badala ya kuufafanua kuwa “mjukuu wa Sauli.”
- source_word: עַל
  choice: kwa sababu ya
  rationale: Hapa עַל hutaja sababu ya hatua ya mfalme; “kwa sababu ya” ni usemi wa kawaida na sahihi katika Kiswahili.
- source_word: שְׁבֻעַת יְהוָה
  choice: kiapo cha Yahwe
  rationale: 'Tafsiri hii inahifadhi muundo na utata wa Kiebrania: inaweza kueleweka hasa kuwa kiapo kilichoapwa kwa jina la Yahwe au mbele zake, bila kukifanya moja kwa moja kuwa kiapo alichokitoa Yahwe mwenyewe.'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo “BWANA.”
- source_word: אֲשֶׁר בֵּינֹתָם
  choice: kilichokuwa kati yao
  rationale: Kishazi hiki kinadumisha lugha ya uhusiano wa kiapo kati ya wahusika wawili.
- source_word: בֵּין דָּוִד וּבֵין יְהוֹנָתָן
  choice: kati ya Daudi na Yonathani
  rationale: Kiswahili cha kawaida hakihitaji kurudia “kati ya,” lakini uhusiano wa pande mbili unabaki wazi.
theological_decisions:
- issue: Maana ya “kiapo cha Yahwe”
  choice: Kudumisha usemi “kiapo cha Yahwe” katika andiko kuu, huku tanbihi ikieleza maana inayowezekana ya kiapo kilichoapwa kwa jina la Yahwe kati ya Daudi na Yonathani.
  alternative: Kiapo kilichotolewa na Yahwe mwenyewe.
  rationale: Katika masimulizi ya agano, muundo huu kwa kawaida huelekea kumaanisha kiapo ambacho Yahwe aliombwa kuwa shahidi wake. Hata hivyo, tafsiri kuu haiondoi kabisa utata wa kisarufi na kitheolojia.
- issue: Mhusika anayeitwa “mfalme”
  choice: Kudumisha “mfalme.”
  alternative: Daudi.
  rationale: Muktadha humtambulisha mfalme kuwa Daudi, lakini Kiebrania cha mstari huu kimetumia cheo, si jina.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Alimwacha hai” limechaguliwa kuliko “alimhurumia” ili kuonyesha kwa uwazi kwamba mfalme hakumtoa Mefiboshethi auawe. “Yaani” hufanya rejeo la “wao” liwe wazi bila kubadili taarifa ya chanzo.
