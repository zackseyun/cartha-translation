  text: וְ/הָיָה֙ בִּ/קְרָב אִ֔ישׁ לְ/הִשְׁתַּחֲוֺ֖ת ל֑/וֹ וְ/שָׁלַ֧ח אֶת יָד֛/וֹ וְ/הֶחֱזִ֥יק ל֖/וֹ וְ/נָ֥שַׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/005.yaml
  text: And whenever a man came near to bow down to him[a], he would reach out his hand, take hold of him, and kiss him.
translation:
  language: sw
  text: Kila mtu alipomkaribia ili amwinamie[a], Absalomu alinyoosha mkono wake, akamshika na kumbusu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili ampe heshima.” Kitenzi cha Kiebrania kinaweza kumaanisha kuinama kama ishara ya heshima, si lazima kuabudu kwa maana finyu ya kidini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בִּקְרָב
  choice: Kila ... alipomkaribia ... Absalomu ali-
  rationale: Muundo huu katika simulizi unaonyesha tendo lililorudiwa; Kiswahili cha kawaida hulieleza kwa ‘kila ... alipo-’ pamoja na kitenzi kikuu cha wakati uliopita.
- source_word: אִישׁ
  choice: mtu
  rationale: Ingawa nomino ya Kiebrania ni ya kiume katika umoja, hapa inatumika kwa maana ya kila mtu aliyekuja; ‘mtu’ ni ya kawaida na haiongezi dai lisilohitajika kuhusu jinsia.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: ili amwinamie
  rationale: Kitenzi kinaonyesha kujishusha au kuinama mbele ya mtu kama ishara ya heshima; ‘amwinamie’ huhifadhi tendo hilo bila kulifanya lazima kuwa ibada ya kidini.
- source_word: וְשָׁלַח אֶת יָדוֹ
  choice: alinyoosha mkono wake
  rationale: Hii ni namna ya asili ya Kiswahili ya kueleza kunyoosha mkono kuelekea kwa mtu.
- source_word: וְהֶחֱזִיק לוֹ
  choice: akamshika
  rationale: Hifili ya חזק hapa ina maana ya kumkamata au kumshika mtu; ‘akamshika’ inafaa kwa tendo la kijamii bila ukali wa ‘akamkamata kwa nguvu.’
- source_word: וְנָשַׁק לוֹ
  choice: na kumbusu
  rationale: Tafsiri ya moja kwa moja huhifadhi ishara ya ukaribu na upendeleo bila kuifafanua zaidi katika matini.
theological_decisions:
- issue: Je, השתחוה hapa ina maana ya ibada ya kidini au heshima kwa mtu mwenye mamlaka?
  choice: amwinamie
  alternative: amsujudie / amwabudu
  rationale: Muktadha ni wa heshima ya kijamii na kisiasa kwa Absalomu. ‘Amwinamie’ huhifadhi ishara ya kimwili na uwezekano wa kutoa heshima bila kudai kuwa ni ibada kwa maana finyu ya kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Jina ‘Absalomu’ limetajwa wazi badala ya kiwakilishi ‘yeye’ ili kuzuia utata katika mstari huu unaosimama peke yake; haliongezi mhusika mpya katika muktadha.
