base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/030.yaml
  text: And David was going up the ascent of the Mount of Olives[a], going up and weeping, with his head covered, and he was walking barefoot. And all the people who were with him each covered his head, and they went up[c][b], weeping as they went.
translation:
  language: sw
  text: Daudi alikuwa akipanda njia ya kupandia Mlima wa Mizeituni, akipanda huku akilia.[a] Kichwa chake kilikuwa kimefunikwa, naye alikuwa akitembea bila viatu. Watu wote waliokuwa pamoja naye, kila mmoja alifunika kichwa chake,[b] nao waliendelea kupanda huku wakilia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinarudia wazo la kupanda kwa msisitizo: “akipanda huku akilia.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri nyingine: “kila mtu alifunika kichwa chake.” Kiebrania kinatumia umoja wenye maana ya kila mmoja katika kundi.'
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “walipanda, wakipanda na kulia,” kikiwa na marudio yanayotilia mkazo na kuifanya picha iwe hai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֵה הַזֵּיתִים
  choice: njia ya kupandia Mlima wa Mizeituni
  rationale: מַעֲלֵה ni njia au mwinuko unaopandiwa. Tafsiri hii ni ya kawaida katika Kiswahili na inatambua jina la mahali linalojulikana, ‘Mlima wa Mizeituni,’ bila kulifanya liwe ‘mizeituni’ tu.
- source_word: עֹלֶה ... עֹלֶה וּבוֹכֶה
  choice: alikuwa akipanda ... akipanda huku akilia
  rationale: Miundo ya kuendelea ‘alikuwa akipanda’ na ‘akipanda’ inadumisha mwendo unaoendelea na marudio yenye msisitizo katika Kiebrania.
- source_word: בֹּכֶה
  choice: akilia
  rationale: ‘Kulia’ hutoa maana ya moja kwa moja ya kutokwa na machozi bila kuongeza wazo la maombolezo ya kimila.
- source_word: וְרֹאשׁ לוֹ חָפוּי
  choice: Kichwa chake kilikuwa kimefunikwa
  rationale: Hii inadumisha hali iliyoelezwa na חָפוּי bila kubainisha kwa namna isiyokuwamo jinsi kichwa kilivyofunikwa.
- source_word: יָחֵף
  choice: bila viatu
  rationale: Ni usemi wa kawaida na unaoeleweka kwa urahisi katika Kiswahili cha sasa kwa mtu anayetembea miguu wazi.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: Watu wote waliokuwa pamoja naye
  rationale: הָעָם hapa ni neno pana kwa kundi lililoandamana na Daudi; ‘watu’ huepuka kulifanya bila msingi kuwa jeshi pekee.
- source_word: חָפוּ אִישׁ רֹאשׁוֹ
  choice: walifunika vichwa vyao, kila mmoja kichwa chake
  rationale: Kifungu hiki kinadumisha umoja wa mgawanyo wa אִישׁ רֹאשׁוֹ na wakati huohuo kinasikika kwa uwazi katika Kiswahili.
- source_word: וְעָלוּ עָלֹה וּבָכֹה
  choice: walipanda, wakizidi kupanda huku wakilia
  rationale: Kitenzi pamoja na infinitivi kamili hutoa mwendo wenye msisitizo na unaoendelea. ‘Wakizidi kupanda’ huhifadhi nguvu hiyo bila kuwa na marudio yasiyoeleweka katika Kiswahili.
