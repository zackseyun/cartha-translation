base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/036.yaml
  text: 'Look[a], their two sons are there with them: Ahimaaz for Zadok, and Jonathan for Abiathar[b]. You shall send to me by their hand every matter that you hear.'
translation:
  language: sw
  text: 'Tazama, wana wao wawili wako huko pamoja nao: Ahimaasi mwana wa Sadoki, na Yonathani mwana wa Abiathari. Nanyi mtanitumia kupitia kwao[a] kila jambo mtakalolisikia.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kwa mkono wao”; hii ni nahau inayomaanisha kuwatumia kama wajumbe.
    reason: lexical_alternative
  - marker: b
    text: Au “kila kitu mtakachosikia,” au “kila habari mtakayoisikia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwa msisitizo; “Tazama” ni la kawaida katika usimulizi wa Biblia na linahifadhi nguvu ya kuelekeza usikivu.
- source_word: שָׁם עִמָּם
  choice: wako huko pamoja nao
  rationale: Linahifadhi mahali panapoonyeshwa na pia ukweli kwamba wana hao wako pamoja na makuhani.
- source_word: שְׁנֵי בְנֵיהֶם
  choice: wana wao wawili
  rationale: Hii ndiyo maana ya moja kwa moja ya muundo wa Kiebrania, ikirejelea wana wa Sadoki na Abiathari.
- source_word: אֲחִימַעַץ לְצָדוֹק וִיהוֹנָתָן לְאֶבְיָתָר
  choice: Ahimaasi mwana wa Sadoki, na Yonathani mwana wa Abiathari
  rationale: Ingawa kihusishi לְ kwa kawaida ni “kwa/wa,” muktadha uliotangulia tayari umewatambulisha hawa kuwa wana wao; Kiswahili cha wazi kinahitaji uhusiano huo kusemwa moja kwa moja.
- source_word: וּשְׁלַחְתֶּם
  choice: Nanyi mtanitumia
  rationale: Muundo huu una nguvu ya agizo katika muktadha. Wakati ujao wa Kiswahili unaonyesha maagizo hayo kwa njia ya kawaida na yenye heshima.
- source_word: בְּיָדָם
  choice: kupitia kwao
  rationale: Maana halisi ni “kwa mkono wao,” lakini hapa ni nahau ya uwakala au upitishaji wa ujumbe. “Kupitia kwao” ni ya asili katika Kiswahili.
- source_word: כָּל דָּבָר
  choice: kila jambo
  rationale: דָּבָר linaweza kumaanisha neno, jambo, au habari. “Kila jambo” linahifadhi upana wa maana bila kulifanya kuwa habari pekee.
- source_word: אֲשֶׁר תִּשְׁמָעוּ
  choice: mtakalolisikia
  rationale: Tafsiri hii inahifadhi maana ya moja kwa moja ya kitenzi שׁמע, “kusikia,” na inalingana kisarufi na “jambo.”
