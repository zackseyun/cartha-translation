base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/034.yaml
  text: But if you return to the city and say to Absalom, ‘I will be your servant, O king; as I was your father’s servant in the past, so now I will be your servant,’ then you will frustrate Ahithophel’s counsel for me.
translation:
  language: sw
  text: Lakini ukirudi mjini na kumwambia Absalomu, ‘Ee mfalme, nitakuwa mtumishi wako. Kama nilivyokuwa mtumishi wa baba yako zamani, ndivyo sasa nitakavyokuwa mtumishi wako,’ basi utalibatilisha shauri la Ahithofeli kwa ajili yangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעִיר
  choice: mjini
  rationale: Kirai hiki kinarejelea kurudi ndani ya jiji lililotajwa katika muktadha, yaani Yerusalemu; ‘mjini’ ni usemi wa kawaida na wa asili katika Kiswahili.
- source_word: עֶבֶד / עַבְדְּךָ
  choice: mtumishi / mtumishi wako
  rationale: Katika mazingira ya utumishi wa kifalme, ‘mtumishi’ huwasilisha vizuri nafasi ya Hushai bila kulazimisha maana ya utumwa wa mali inayoweza kudokezwa na ‘mtumwa’.
- source_word: וְהֵפַרְתָּ
  choice: utalibatilisha
  rationale: Kitenzi hiki humaanisha kuvunja, kuzuia, au kufanya mpango ushindwe; ‘kubatilisha’ linafaa kwa shauri la kisiasa la Ahithofeli.
- source_word: עֲצַת
  choice: shauri
  rationale: Neno hili hapa ni ushauri au mpango uliopendekezwa; ‘shauri’ huhifadhi maana hiyo kwa lugha yenye hadhi na inayoeleweka.
- source_word: לִי
  choice: kwa ajili yangu
  rationale: Huhifadhi wazi manufaa yanayomrudia Daudi bila kuongeza wazo lisilokuwamo katika chanzo.
theological_decisions:
- issue: Kauli הַמֶּלֶךְ katika maneno ya Hushai
  choice: Ee mfalme
  alternative: mfalme
  rationale: Imeeleweka kama usemi wa kumwita Absalomu moja kwa moja, kama inavyodokezwa na mfuatano wa maneno; tafsiri haiongezi dai la kitheolojia kuhusu uhalali wa ufalme wake.
- issue: Ulinganifu wa utumishi wa zamani na wa sasa
  choice: Kama nilivyokuwa mtumishi wa baba yako zamani, ndivyo sasa nitakavyokuwa mtumishi wako
  alternative: Nilikuwa mtumishi wa baba yako tangu zamani, lakini sasa nitakuwa mtumishi wako
  rationale: Muundo wa kulinganisha unaonyesha kwa asili kusudi la kauli hiyo na kufuata ushahidi wa matini bila kuamua zaidi nia ya ndani ya Hushai.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida kwa wasomaji wa leo. Sentensi ya moja kwa moja imehifadhiwa ndani ya alama za kunukuu, na majina yametolewa kama Absalomu na Ahithofeli kwa maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili.
