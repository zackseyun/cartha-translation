    text: Au “kesi ya kisheria”; neno la Kiebrania רִיב linaweza kumaanisha mgogoro, malalamiko, au kesi katika mazingira ya kimahakama.
    reason: lexical_alternative
  revision_rationale: The revision clarifies that the king is being approached for a legal decision, not necessarily to pass sentence on the individual, regularizes the verse’s habitual actions, and places the lexical note directly after the word it qualifies. It otherwise preserves the draft’s faithful wording and respectful register.
