  text: וְ/הִשְׁכִּים֙ אַבְשָׁל֔וֹם וְ/עָמַ֕ד עַל יַ֖ד דֶּ֣רֶךְ הַ/שָּׁ֑עַר וַ/יְהִ֡י כָּל הָ/אִ֣ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִיב֩ לָ/ב֨וֹא אֶל הַ/מֶּ֜לֶךְ לַ/מִּשְׁפָּ֗ט וַ/יִּקְרָ֨א אַבְשָׁל֤וֹם אֵלָי/ו֙ וַ/יֹּ֗אמֶר אֵֽי מִ/זֶּ֥ה עִיר֙ אַ֔תָּה וַ/יֹּ֕אמֶר מֵ/אַחַ֥ד שִׁבְטֵֽי יִשְׂרָאֵ֖ל עַבְדֶּֽ/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/002.yaml
  text: Absalom would rise early and stand beside the road to the gate. Whenever any man had a dispute and came to the king for judgment[a], Absalom would call to him and say, “From what city are you?” And he would say, “Your servant is from one of the tribes of Israel.”
translation:
  language: sw
  text: Absalomu alikuwa akiamka alfajiri na kusimama kando ya njia inayoelekea langoni. Mtu yeyote aliyekuwa na mgogoro[a], alipokuwa akienda kwa mfalme ili kupata uamuzi wa kisheria, Absalomu angemwita na kumwambia, “Wewe unatoka mji gani?” Naye angesema, “Mtumishi wako anatoka katika mojawapo ya makabila ya Israeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kesi ya kisheria”; neno la Kiebrania רִיב linaweza kumaanisha mgogoro, malalamiko, au kesi katika mazingira ya kimahakama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁכִּים
  choice: alikuwa akiamka alfajiri
  rationale: Kauli hii inaonyesha kuamka mapema; muundo wa ‘alikuwa akiamka’ unaonyesha tendo la mazoea linaloendana na muktadha wa kurudiwa.
- source_word: וְעָמַד
  choice: na kusimama
  rationale: Maana ya msingi ni kusimama; imeunganishwa na muundo wa mazoea wa kishazi kilichotangulia.
- source_word: עַל יַד
  choice: kando ya
  rationale: Nahau hii ya Kiebrania humaanisha kuwa pembeni au karibu na kitu; ‘kando ya’ ni ya kawaida na huhifadhi maana ya mahali.
- source_word: דֶּרֶךְ הַשָּׁעַר
  choice: njia inayoelekea langoni
  rationale: Kirai hiki kinaeleza njia ya kufikia lango; tafsiri hii ni wazi katika Kiswahili cha sasa bila kudai kwamba alikuwa ndani ya lango.
- source_word: רִיב
  choice: mgogoro
  rationale: Neno linaweza kumaanisha mgogoro, malalamiko, au kesi ya kisheria. ‘Mgogoro’ huhifadhi upana wake katika muktadha wa mahakama; mbadala umeelezwa katika tanbihi.
- source_word: לָבוֹא אֶל הַמֶּלֶךְ לַמִּשְׁפָּט
  choice: kwenda kwa mfalme ili ahukumiwe
  rationale: Muktadha ni wa kupata uamuzi wa kimahakama kutoka kwa mfalme. Kauli hii ni ya kawaida na inaonyesha kusudi la safari hiyo.
- source_word: וַיִּקְרָא ... אֵלָיו
  choice: Absalomu alimwita
  rationale: Kitenzi kina maana ya kumwita mtu au kumwita kwa sauti; ‘alimwita’ hakiongezi wazo la wito rasmi.
- source_word: אֵי מִזֶּה עִיר אַתָּה
  choice: Wewe unatoka mji gani?
  rationale: Hii ni njia ya asili ya kuuliza asili ya mtu kwa kurejelea mji wake.
- source_word: מֵאַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: anatoka katika mojawapo ya makabila ya Israeli
  rationale: Jibu la Kiebrania linataja asili ya kikabila kwa muundo uliobanwa; ‘anatoka katika’ hulifanya wazi kwa Kiswahili.
- source_word: עַבְדֶּךָ
  choice: Mtumishi wako
  rationale: Hapa ni namna ya heshima ya mtu kujitaja mbele ya mwana wa mfalme; ‘mtumishi wako’ huhifadhi adabu bila kusisitiza hali ya utumwa.
