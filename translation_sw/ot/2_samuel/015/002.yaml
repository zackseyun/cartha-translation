revisions:
- from: Absalomu alikuwa akiamka alfajiri na kusimama kando ya njia inayoelekea langoni. Kila mtu aliyekuwa na mgogoro na kwenda kwa mfalme ili ahukumiwe[a], Absalomu alimwita na kumuuliza, “Wewe unatoka mji gani?” Naye alijibu, “Mtumishi wako anatoka katika mojawapo ya makabila ya Israeli.”
  to: Absalomu alikuwa akiamka alfajiri na kusimama kando ya njia inayoelekea langoni. Mtu yeyote aliyekuwa na mgogoro[a], alipokuwa akienda kwa mfalme ili kupata uamuzi wa kisheria, Absalomu angemwita na kumwambia, “Wewe unatoka mji gani?” Naye angesema, “Mtumishi wako anatoka katika mojawapo ya makabila ya Israeli.”
  rationale: The revision clarifies that the king is being approached for a legal decision, not necessarily to pass sentence on the individual, regularizes the verse’s habitual actions, and places the lexical note directly after the word it qualifies. It otherwise preserves the draft’s faithful wording and respectful register.
