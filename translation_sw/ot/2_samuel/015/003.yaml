  text: Then Absalom said to him[a], “Look, your claims are good and right[b], but there is no one from the king to hear you.”
translation:
  language: sw
  text: Ndipo Absalomu akamwambia, “Tazama, madai yako[a] ni mazuri na ya haki, lakini hakuna mtu kutoka kwa mfalme wa kusikiliza shauri lako.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shauri lako.” Neno la Kiebrania דָּבָר linaweza kumaanisha “neno,” “jambo,” au, katika muktadha wa kisheria, “shauri” au “madai.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “hakuna msikilizaji kwa ajili yako kutoka kwa mfalme.” Hii yaweza kumaanisha kwamba hakuna mwakilishi wa mfalme wa kusikiliza shauri hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אַבְשָׁלוֹם
  choice: Ndipo Absalomu akamwambia
  rationale: Muundo wa simulizi unaendeleza mfuatano wa matukio; “ndipo” na “akamwambia” ni Kiswahili cha kawaida kinachoonyesha hatua inayofuata na kiwakilishi cha mtu anayesemeshwa.
- source_word: רְאֵה
  choice: Tazama
  rationale: Ni amri inayotumiwa kuvuta fikira za msikilizaji. “Tazama” ni ya heshima na ya kawaida katika masimulizi ya kibiblia bila kuwa ya kizamani kupita kiasi.
- source_word: דְבָרֶךָ
  choice: madai yako
  rationale: Ingawa דָּבָר inaweza kumaanisha neno, jambo, au shauri, muktadha wa watu wanaokuja kutafuta hukumu unaipa maana ya madai yanayotolewa katika kesi.
- source_word: טוֹבִים וּנְכֹחִים
  choice: ni mazuri na ya haki
  rationale: “Mazuri” huhifadhi maana pana ya טוֹבִים, huku “ya haki” ikiwasilisha unyoofu au usahihi wa נְכֹחִים katika muktadha wa kisheria bila kudai zaidi ya maandishi.
- source_word: וְשֹׁמֵעַ אֵין לְךָ מֵאֵת הַמֶּלֶךְ
  choice: lakini hakuna mtu aliyeteuliwa na mfalme kusikiliza kesi yako
  rationale: Kirai kinamaanisha kwamba hakuna msikilizaji au mwakilishi kutoka kwa mfalme wa kushughulikia shauri hilo. Tafsiri hii inaeleza kwa Kiswahili cha kawaida dhamira ya kisheria ya “kusikia” huku tanbihi ikihifadhi umbo halisi zaidi.
