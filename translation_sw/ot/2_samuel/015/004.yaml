  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם מִי יְשִׂמֵ֥/נִי שֹׁפֵ֖ט בָּ/אָ֑רֶץ וְ/עָלַ֗/י יָב֥וֹא כָּל אִ֛ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִ֥יב וּ/מִשְׁפָּ֖ט וְ/הִצְדַּקְתִּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/004.yaml
  text: Then Absalom would say[a], “If only I were appointed judge in the land! Then every man who has a dispute or a case could come to me[c][b], and I would give him justice.”
translation:
  language: sw
  text: Kisha Absalomu alikuwa akisema, “Laiti ningeteuliwa kuwa mwamuzi katika nchi![a] Kila mtu mwenye mgogoro au kesi angenijia, nami ningemtendea haki.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “Ni nani atakayeniweka kuwa mwamuzi katika nchi?” Maneno ya Kiebrania ni swali lenye nguvu ya tamanio, si ombi la kutaka habari tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “ningemthibitishia kuwa ana haki” au “ningemtangaza kuwa yuko sahihi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אַבְשָׁלוֹם
  choice: Kisha Absalomu alikuwa akisema
  rationale: Katika muktadha, usemi huu ni jambo ambalo Absalomu alikuwa akirudia; muundo wa Kiswahili wa mazoea ya wakati uliopita unaonyesha hali hiyo kwa kawaida.
- source_word: מִי יְשִׂמֵנִי
  choice: Laiti ningeteuliwa
  rationale: Ingawa maneno halisi yanaweza kutafsiriwa ‘Ni nani atakayeniweka?’, hapa swali hilo lina nguvu ya tamanio. ‘Laiti ningeteuliwa’ huwasilisha tamanio hilo bila kuongeza mtendaji asiyeainishwa.
- source_word: שֹׁפֵט
  choice: mwamuzi
  rationale: Neno hili humaanisha mtu anayesikiliza na kuamua mashauri ya kisheria. ‘Mwamuzi’ linafaa katika muktadha huu wa migogoro na kesi.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: Huhifadhi maana pana ya eneo au nchi bila kuibana kuwa mahali maalumu zaidi.
- source_word: וְעָלַי יָבוֹא
  choice: angenijia
  rationale: 'Hueleza kwa Kiswahili cha kawaida matokeo ya hali ya kudhaniwa: watu wangemjia Absalomu ili awaamulie.'
- source_word: כָּל אִישׁ
  choice: kila mtu
  rationale: Ingawa Kiebrania kina nomino ya kiume katika umoja, hapa limetumiwa kwa maana ya jumla kwa mtu yeyote mwenye shauri la kisheria. ‘Kila mtu’ ni ya asili na sahihi katika Kiswahili.
- source_word: רִיב וּמִשְׁפָּט
  choice: mgogoro au kesi
  rationale: Jozi hii inaonyesha mabishano au dai pamoja na shauri linalohitaji kuamuliwa. ‘Mgogoro au kesi’ ni wazi kwa msomaji wa kawaida na huhifadhi vipengele vyote viwili.
- source_word: וְהִצְדַּקְתִּיו
  choice: nami ningemtendea haki
  rationale: Hifili ya צדק katika mazingira ya mahakama inaweza kumaanisha kumtangaza mtu kuwa ana haki, kumthibitishia haki, au kumpatia haki. Tafsiri hii ni ya kawaida katika Kiswahili huku tanbihi ikihifadhi upeo wa maana.
