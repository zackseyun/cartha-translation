base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/010.yaml
  text: Then Absalom sent spies throughout all the tribes of Israel, saying, “As soon as you hear the sound of the trumpet, then say, ‘Absalom has become king in Hebron.’”
translation:
  language: sw
  text: Kisha Absalomu akatuma wapelelezi kwa makabila yote ya Israeli, akisema, “Mara mtakaposikia sauti ya tarumbeta, semeni, ‘Absalomu amekuwa mfalme huko Hebroni.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרַגְּלִים
  choice: wapelelezi
  rationale: Neno hili humaanisha wapelelezi; hapa linaeleza wajumbe wa siri waliotumwa kueneza tangazo lililopangwa.
- source_word: כְּשָׁמְעֲכֶם
  choice: Mara mtakaposikia
  rationale: Muundo wa Kiebrania unaonyesha wakati wa kusikia na, katika muktadha wa agizo, una maana ya ‘mara tu mtakaposikia.’
- source_word: קוֹל הַשֹּׁפָר
  choice: sauti ya tarumbeta
  rationale: Shofar ni pembe iliyopulizwa kama tarumbeta; ‘tarumbeta’ ni neno la kawaida na linaloeleweka kwa ishara hii ya tangazo.
- source_word: מָלַךְ
  choice: amekuwa mfalme
  rationale: Kitenzi kinaweza kumaanisha ‘ametawala’ au ‘amekuwa mfalme’; hapa tangazo la kuingia katika ufalme ndilo linalokusudiwa.
- source_word: בְּחֶבְרוֹן
  choice: huko Hebroni
  rationale: Kiambishi בְּ kinaonyesha mahali; ‘huko Hebroni’ ni Kiswahili cha kawaida katika tangazo hili.
theological_decisions:
- issue: Maana ya מָלַךְ katika tangazo la Absalomu
  choice: amekuwa mfalme
  alternative: anatawala
  rationale: Muktadha ni tangazo la kujitangaza kwa Absalomu kuwa mfalme, si maelezo ya jumla kuhusu utawala unaoendelea. Tafsiri hii haithibitishi uhalali wa dai lake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa amri na nukuu umehifadhiwa kwa uwazi bila kuongeza ufafanuzi wa kimadhehebu.
