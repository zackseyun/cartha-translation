base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/027.yaml
  text: Then the king said to Zadok the priest[a], “Are you a seer? Return to the city in peace, and your two sons with you, Ahimaaz your son and Jonathan son of Abiathar.”
translation:
  language: sw
  text: Kisha mfalme akamwambia Sadoki kuhani[a], “Je, wewe ni mwonaji? Rudi mjini kwa amani; wana wenu wawili—Ahimaasi, mwana wako, na Yonathani, mwana wa Abiathari—wawe pamoja nanyi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au yawezekana, “Unaona, sivyo?” Neno la Kiebrania hapa linaweza kumaanisha kwamba Sadoki ni “mwonaji,” au kuwa swali kuhusu kuona au kutambua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/יֹּאמֶר הַ/מֶּלֶךְ
  choice: Kisha mfalme akamwambia
  rationale: ‘Kisha’ huendeleza simulizi kwa Kiswahili cha kawaida, huku ‘akamwambia’ ikionyesha wazi anayeelekezewa maneno.
- source_word: הֲ/רוֹאֶה אַתָּה
  choice: Je, wewe ni mwonaji?
  rationale: Muundo unaweza kumtaja Sadoki kuwa mwonaji au kuuliza kuhusu kuona/kutambua. Tafsiri hii huhifadhi maana ya ‘mwonaji’ katika matini kuu, huku maana nyingine ikiwekwa katika tanbihi.
- source_word: שֻׁבָ/ה הָ/עִיר
  choice: Rudi mjini
  rationale: Kitenzi ni amri ya kurudi, na ‘mjini’ ni namna ya asili ya Kiswahili ya kuonyesha kuelekea katika mji uliotajwa.
- source_word: בְּ/שָׁל֑וֹם
  choice: kwa amani
  rationale: Huhifadhi wazo la shalom, ambalo hapa linaweza kujumuisha kurudi salama na kwa amani.
- source_word: שְׁנֵי בְנֵי/כֶם אִתְּ/כֶם
  choice: pamoja na wana wenu wawili
  rationale: Viwakilishi vya Kiebrania ni vya wingi kwa sababu wana hao ni wa Sadoki na Abiathari kwa mtawalia. ‘Wenu’ huhifadhi wingi huo, ingawa mfalme anamzungumzia Sadoki moja kwa moja.
- source_word: וַ/אֲחִימַעַץ בִּנְ/ךָ וִ/יהוֹנָתָן בֶּן אֶבְיָתָר
  choice: Ahimaasi mwana wako, na Yonathani mwana wa Abiathari
  rationale: Majina yametoholewa kwa matumizi ya kawaida ya kibiblia ya Kiswahili, na uhusiano wa kila mwana na baba yake umeelezwa wazi kama katika Kiebrania.
theological_decisions:
- issue: Je, הֲרֹאֶה inamtambulisha Sadoki kama mwonaji au inauliza kuhusu kuona/kutambua?
  choice: Je, wewe ni mwonaji?
  alternative: Unaona, sivyo? / Je, unaona?
  rationale: Kiebrania kinakubali uchanganuzi wa ‘mwonaji’ na pia wa kuona au kutambua. Matini kuu inafuata uwezekano wa kwanza bila kuficha wa pili, ambao umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Kwa amani’ huhifadhi usemi wa chanzo; ‘wana wenu wawili’ huhifadhi wingi wa Kiebrania na kisha majina yanafafanua kwamba mmoja ni mwana wa Sadoki na mwingine wa Abiathari.
