  text: Mfalme akamwambia, “Nenda kwa amani.” Basi akaondoka, akaenda Hebroni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Kitenzi cha simulizi אמר pamoja na kiwakilishi cha yule anayeambiwa kinaelezwa kwa kawaida katika Kiswahili kuwa “akamwambia.”
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Nomino yenye uainishaji humrejelea mfalme anayejulikana katika muktadha; jina Daudi haliongezwi kwa kuwa halipo katika mstari.
- source_word: לֵךְ
  choice: Nenda
  rationale: Amri ya הלך ina maana ya moja kwa moja ya kwenda, na “Nenda” ni usemi wa kawaida na wenye hadhi.
- source_word: בְּשָׁלוֹם
  choice: kwa amani
  rationale: Nahau hii ya kuagana au kubarikiwa inalingana kwa asili na “kwa amani” katika Kiswahili.
- source_word: וַיָּקָם
  choice: akaondoka
  rationale: קום hapa huanzisha hatua ya kuondoka baada ya mazungumzo. “Akaondoka” ni ya asili katika simulizi la Kiswahili na haiongezi maana isiyokuwapo.
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Kitenzi cha kawaida cha mwendo kinaendeleza mfuatano wa simulizi kwa umbo la “aka-”.
- source_word: חֶבְרוֹנָה
  choice: Hebroni
  rationale: He ya mwelekeo inaonyesha kwenda kuelekea Hebroni; katika Kiswahili, umbo la mahali “Hebroni” baada ya “akaenda” huwasilisha mwelekeo huo kwa kawaida.
