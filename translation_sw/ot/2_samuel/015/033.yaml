  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר ... דָּוִד
  choice: Daudi akamwambia
  rationale: Muundo wa masimulizi wenye waw-consecutive unaendeleza tukio; ‘akamwambia’ ni Kiswahili cha kawaida na pia hujumuisha kiwakilishi cha לוֹ.
- source_word: לוֹ
  choice: -mw- (akamwambia)
  rationale: Kiwakilishi cha nafsi ya tatu kimehifadhiwa bila kutaja jina la Hushai, ambalo halipo katika mstari huu.
- source_word: אִם
  choice: Uki-
  rationale: Kiambishi cha masharti ‘uki-’ kinawasilisha sharti moja kwa moja na kwa lugha ya kawaida.
- source_word: עָבַרְתָּ אִתִּי
  choice: ukiendelea kwenda pamoja nami
  rationale: עבר inaweza kumaanisha kuvuka au kupita; katika muktadha huu inaeleza kuendelea na safari pamoja na Daudi. Tafsiri hii ni ya asili katika Kiswahili bila kulazimisha wazo la kuvuka mahali fulani lisilotajwa wazi.
- source_word: וְהָיִתָ עָלַי לְמַשָּׂא
  choice: utakuwa mzigo kwangu
  rationale: Hii inawasilisha kwa uwazi na kwa nahau ya Kiswahili athari ya kuwa mzigo unaomlemea Daudi.
