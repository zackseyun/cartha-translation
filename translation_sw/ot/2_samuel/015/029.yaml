lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: wakalirudisha
  rationale: Kitenzi שוב katika kausativi kinaonyesha kwamba Sadoki na Abiathari walilipeleka sanduku lirudi Yerusalemu. “Wakalirudisha” ni usemi wa kawaida na huhifadhi maana ya kitenzi chenye yambwa.
- source_word: צָדוֹק
  choice: Sadoki
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: וְאֶבְיָתָר
  choice: na Abiathari
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili, huku kiunganishi kikihifadhiwa.
- source_word: אֶת אֲרוֹן הָאֱלֹהִים
  choice: sanduku la Mungu
  rationale: Kiebrania kinasema moja kwa moja “sanduku la Mungu”; tafsiri haiongezi neno “agano,” ambalo halipo katika mstari huu.
- source_word: יְרוּשָׁלָם
  choice: Yerusalemu
  rationale: Mahali panakoelekezwa panaeleweka kutokana na kitenzi “wakalirudisha,” kwa hiyo kihusishi cha ziada si lazima katika Kiswahili.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: nao wakakaa huko
  rationale: ישב hapa humaanisha kukaa au kubaki mahali. “Wakakaa huko” ni Kiswahili cha kawaida kinachoendana na simulizi.
