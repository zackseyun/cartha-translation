  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֧עַן אִתַּ֛י אֶת הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר חַי יְהוָ֗ה וְ/חֵי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּ֠י אִם בִּ/מְק֞וֹם אֲשֶׁ֥ר יִֽהְיֶה שָּׁ֣ם אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ אִם לְ/מָ֨וֶת֙ אִם לְ/חַיִּ֔ים כִּי שָׁ֖ם יִהְיֶ֥ה עַבְדֶּֽ/ךָ־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/021.yaml
  text: Then Ittai answered the king and said[a], “As Yahweh lives, and as my lord the king lives, surely in whatever place my lord the king may be, whether for death or for life[b], there your servant will be.”
translation:
  language: sw
  text: Ndipo Itai akamjibu mfalme, akasema, “Kama Yahwe aishivyo, na kama bwana wangu mfalme aishivyo[a], hakika popote atakapokuwa bwana wangu mfalme, iwe ni kufa au kuishi[b], mtumishi wako atakuwa huko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hii ni fomula ya kiapo cha Kiebrania: “Kama Yahwe aishivyo, na kama bwana wangu mfalme aishivyo.”'
    reason: cultural_note
  - marker: b
    text: 'Kiebrania: “ikiwa kwa mauti, ikiwa kwa uzima.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: akamjibu
  rationale: Kitenzi hiki cha kawaida katika simulizi huonyesha jibu kwa maneno yaliyotangulia; ‘akamjibu’ ni cha asili na huhifadhi muundo wa mazungumzo.
- source_word: אִתַּי
  choice: Itai
  rationale: Jina la mtu limetoholewa kwa tahajia rahisi ya Kiswahili.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Cheo cha kifalme chenye uhusika maalumu katika muktadha; Kiswahili hakihitaji kibainishi tofauti kama ‘the’.
- source_word: חַי יְהוָה
  choice: Kama Yahwe aishivyo
  rationale: Hii ni fomula ya kiapo cha Kiebrania. Tafsiri hii huhifadhi uzito wa kiapo na jina la Mungu lililo katika matini.
- source_word: וְחֵי אֲדֹנִי הַמֶּלֶךְ
  choice: na kama bwana wangu mfalme aishivyo
  rationale: Huhifadhi ulinganifu wa fomula ya kiapo na namna Itai anavyomheshimu mfalme.
- source_word: כִּי אִם
  choice: hakika
  rationale: Katika muktadha wa kiapo maneno haya yanatia mkazo wa uthibitisho, wala hayaanzishi sharti la kawaida.
- source_word: בִּמְקוֹם אֲשֶׁר יִהְיֶה שָּׁם
  choice: popote atakapokuwa
  rationale: Ni Kiswahili cha asili kinachoonyesha mahali pasipoainishwa huku kikidumisha maana ya kirai cha Kiebrania.
- source_word: אִם לְמָוֶת אִם לְחַיִּים
  choice: iwe ni kufa au kuishi
  rationale: Huhifadhi jozi ya Kiebrania na kueleza uaminifu kamili bila kujali matokeo.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Hapa neno hilo ni namna ya unyenyekevu ya kujitaja mbele ya mfalme, si msisitizo wa hali ya utumwa.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini inatumia moja kwa moja jina la agano YHWH. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Nguvu ya kiapo katika חַי יְהוָה
  choice: Kama Yahwe aishivyo
  alternative: Kwa uhai wa Yahwe; Yahwe yu hai
  rationale: Muundo uliochaguliwa unatambulika kama kiapo kizito na pia huhifadhi dai la kwamba Yahwe yu hai, bila kulipanua kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha uzito wa kiapo na uaminifu wa Itai, lakini hutumia ‘popote atakapokuwa’ na ‘iwe ni kufa au kuishi’ ili isomeke kwa urahisi kwa wasomaji wa kawaida.
