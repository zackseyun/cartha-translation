base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/014.yaml
  text: Then David said to all his servants who were with him in Jerusalem[a], “Arise, and let us flee, for there will be no escape for us from Absalom. Hurry to depart[c][b], lest he quickly overtake us and bring disaster upon us and strike the city with the edge of the sword.”
translation:
  language: sw
  text: Ndipo Daudi akawaambia watumishi wake wote waliokuwa pamoja naye Yerusalemu, “Inukeni, tukimbie, kwa maana hakuna njia ya kuponyoka mbele ya Absalomu. Harakisheni kuondoka, asije akaharakisha kutufikia, akatuletea maafa na kuupiga mji kwa makali ya upanga.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kwa kinywa cha upanga,” nahau inayomaanisha kuua kwa upanga.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika mazingira ya jumba la kifalme, neno hili linaweza kuwataja maofisa, wahudumu, au wafuasi wa mfalme; “watumishi” ni pana na halidai kwamba wote walikuwa watumwa.
- source_word: קוּמוּ וְנִבְרָחָה
  choice: Inukeni, tukimbie
  rationale: “Inukeni” inawasilisha amri ya wingi, na “tukimbie” inahifadhi nguvu ya kohortativi inayomjumuisha Daudi pamoja na watu wake.
- source_word: פְלֵיטָה
  choice: njia ya kumponyoka
  rationale: Katika muktadha huu neno linahusu uwezekano wa kuokoka kwa kumkimbia Absalomu, si lazima wokovu wa kimungu.
- source_word: מַהֲרוּ לָלֶכֶת
  choice: Harakisheni kuondoka
  rationale: Hii ni Kiswahili cha kawaida kinachoonyesha amri ya kuondoka mara moja; maana halisi ya muundo ni kufanya haraka kwenda.
- source_word: יְמַהֵר וְהִשִּׂגָנוּ
  choice: asije akafanya haraka, akatufikia
  rationale: Uamuzi huu unadumisha kurudiwa kwa wazo la haraka na maana ya kufikiwa na anayefuatilia.
- source_word: וְהִדִּיחַ עָלֵינוּ אֶת־הָרָעָה
  choice: akatuletea maafa
  rationale: רָעָה hapa ni msiba au janga linalowapata watu, si uovu wa kimaadili.
- source_word: לְפִי חָרֶב
  choice: kwa makali ya upanga
  rationale: Hii inawasilisha nahau ya Kiebrania kwa Kiswahili kinachoeleweka huku taswira ya upanga ikihifadhiwa.
theological_decisions: []
translation_notes:
  register: Lugha ni ya sasa, yenye heshima na yenye kueleweka kwa wasomaji wa Afrika Mashariki. Kauli fupi za amri zimehifadhiwa ili kuonyesha dharura ya Daudi. Jina “Absalomu” limetumiwa kwa umbo la kawaida la kibiblia katika Kiswahili.
