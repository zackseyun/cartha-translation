  to: Ndipo Daudi akawaambia watumishi wake wote waliokuwa pamoja naye Yerusalemu, “Inukeni, tukimbie, kwa maana hakuna njia ya kuponyoka mbele ya Absalomu. Harakisheni kuondoka, asije akaharakisha kutufikia, akatuletea maafa na kuupiga mji kwa makali ya upanga.[a]”
