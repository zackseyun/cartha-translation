    text: Kwa Kiebrania, “kwa kinywa cha upanga,” nahau inayomaanisha kuua kwa upanga.
    reason: lexical_alternative
  revision_rationale: The revision removes an unnecessary and less idiomatic use of “njia,” clarifying that David foresees no possibility of escape. It also recasts the pursuit clause into natural Swahili while retaining the Hebrew’s deliberate repetition of haste. No theological or interpretive change has been made.
