review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys David’s address, the collective urgent imperative, the lack of escape from Absalom, the warning of pursuit, calamity, and the sword idiom. However, “hatutakuwa na njia ya kumponyoka Absalomu” is less idiomatic and introduces “njia” where the Hebrew simply states that no escape will be available. The phrasing for Absalom’s haste is also unnecessarily literal and awkward in Swahili.
  naturalness: “Asije akafanya haraka, akatufikia” is not the most natural modern Standard East African Swahili expression. “Asije akaharakisha kutufikia” preserves the repeated haste motif while reading smoothly. “Hakuna njia ya kuponyoka mbele ya Absalomu” is clearer and more idiomatic in this warning context.
  terminology: “Watumishi,” “Daudi,” “Absalomu,” “maafa,” and “kwa makali ya upanga” are appropriate. The footnote correctly explains the Hebrew sword idiom and is anchored to the translated idiom.
  issues:
  - severity: medium
    issue: The expression “hatutakuwa na njia ya kumponyoka Absalomu” is semantically understandable but stylistically cumbersome.
    rationale: פְלֵיטָה means escape/deliverance, not specifically a “way” or route. A direct statement that there is no escape is both closer to the Hebrew and natural Swahili.
  - severity: medium
    issue: “Asije akafanya haraka, akatufikia” is awkward in contemporary Swahili.
    rationale: The Hebrew repeats the concept of haste, but idiomatic Swahili can preserve this with “asije akaharakisha kutufikia,” without the unnatural construction “kufanya haraka.”
  revised_text: Ndipo Daudi akawaambia watumishi wake wote waliokuwa pamoja naye Yerusalemu, “Inukeni, tukimbie, kwa maana hakuna njia ya kuponyoka mbele ya Absalomu. Harakisheni kuondoka, asije akaharakisha kutufikia, akatuletea maafa na kuupiga mji kwa makali ya upanga.[a]”
  revised_footnotes:
