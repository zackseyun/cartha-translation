base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/006.yaml
  text: Absalom did this to all Israel who came to the king for judgment[a], and Absalom stole the hearts of the men of Israel.
translation:
  language: sw
  text: Absalomu aliwatendea hivi Waisraeli wote waliomwendea mfalme kwa ajili ya hukumu; naye Absalomu akaiba mioyo ya wanaume wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawavuta wanaume wa Israeli wawe upande wake.” Kiebrania kinasema kihalisi “akaiba moyo wa wanaume wa Israeli”; neno “moyo” ni umoja wa mkusanyiko. Taswira hiyo huonyesha kupata uaminifu kwa siri au kwa hila. Usemi “wanaume wa Israeli” unaweza pia kuwakilisha watu wa Israeli kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּדָּבָר הַזֶּה
  choice: aliwatendea hivyo
  rationale: Kirai hiki kinarejelea mwenendo wa Absalomu ulioelezwa katika mstari uliotangulia. ‘Aliwatendea hivyo’ ni Kiswahili cha asili kinachohifadhi tendo lililoelekezwa kwa watu bila kulifafanua kupita kiasi.
- source_word: לְכָל יִשְׂרָאֵל
  choice: Waisraeli wote
  rationale: Hapa ‘Israeli’ linatumika kwa maana ya watu wa Israeli; ‘Waisraeli wote’ ni wazi na la kawaida katika Kiswahili.
- source_word: אֲשֶׁר יָבֹאוּ
  choice: waliokuja
  rationale: Kitenzi kisichotimilika katika simulizi kinaonyesha tendo la kawaida lililorudiwa; ‘waliokuja’ huwasilisha hali hiyo kwa kawaida katika muktadha wa wakati uliopita.
- source_word: לַמִּשְׁפָּט
  choice: ili wahukumiwe
  rationale: מִשְׁפָּט hapa ni shauri au uamuzi wa kimahakama. Usemi huu unaeleza kwa Kiswahili cha kawaida kusudi la kwenda kwa mfalme, bila kuupanua kuwa dhana ya jumla ya haki.
- source_word: אֶל הַמֶּלֶךְ
  choice: kwa mfalme
  rationale: Kirai kinaonyesha kuwa walimwendea mfalme akiwa mamlaka ya kutoa hukumu; ‘kwa mfalme’ ni usemi wa kawaida wa Kiswahili.
- source_word: וַיְגַנֵּב אֶת לֵב
  choice: akaiba mioyo
  rationale: Tafsiri hii inadumisha sitiari yenye nguvu ya Kiebrania ya kuupata uaminifu kwa ujanja au hila, badala ya kuifanya kuwa ‘akawavuta’ pekee.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: wanaume wa Israeli
  rationale: Neno אַנְשֵׁי ni la kiume na maana yake ya moja kwa moja ni ‘wanaume wa.’ Tafsiri inalinda umbo hilo la kijinsia, huku tanbihi ikitaja uwezekano wa matumizi wakilishi.
theological_decisions:
- issue: Usemi wa kijinsia katika אַנְשֵׁי יִשְׂרָאֵל
  choice: wanaume wa Israeli
  alternative: watu wa Israeli / Waisraeli
  rationale: Kiebrania kinatumia nomino ya kiume ‘wanaume wa.’ Ingawa inaweza kuwawakilisha watu kwa upana, matini kuu inadumisha umbo la chanzo bila kulibadili kimya kimya kuwa mkusanyiko usioonyesha jinsia.
- issue: Sitiari ya וַיְגַנֵּב אֶת לֵב
  choice: akaiba mioyo
  alternative: akawavuta watu wa Israeli wawe upande wake
  rationale: Sitiari ya ‘kuiba moyo’ inaashiria kupata uaminifu kwa siri, ujanja, au udanganyifu. Kuihifadhi huzuia tafsiri kufuta tathmini hasi iliyomo katika simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefanywa kuwa wa kawaida kwa wasomaji wa leo, huku sitiari ya Kiebrania ‘akaiba mioyo’ na usemi wake wa kijinsia vikihifadhiwa.
