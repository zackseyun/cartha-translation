base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/008.yaml
  text: For your servant made a vow while I was dwelling in Geshur in Aram[a], saying, ‘If Yahweh indeed brings me back to Jerusalem[c][b], then I will serve Yahweh.’
translation:
  language: sw
  text: Kwa maana mimi, mtumishi wako, niliweka nadhiri nilipokuwa nikiishi Geshuri katika Aramu, nikisema, ‘Ikiwa Yahwe kwa hakika atanirudisha Yerusalemu,[a] basi nitamtumikia Yahwe.’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania hurudia kitenzi cha “kurudisha” ili kusisitiza: “atanirudisha kwa hakika.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “basi nitamwabudu Yahwe.” Kitenzi cha Kiebrania kinaweza kumaanisha huduma inayotolewa kwa Mungu katika ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר נָדַר
  choice: niliweka nadhiri
  rationale: Kirai cha Kiebrania kinatumia nomino na kitenzi vya mzizi mmoja, kihalisi ‘niliapa nadhiri.’ Kiswahili cha kawaida husema ‘kuweka nadhiri,’ ambacho huhifadhi maana bila kuwa kigumu.
- source_word: עַבְדְּךָ
  choice: mimi, mtumishi wako
  rationale: Hii ni namna ya heshima ya kujitaja mbele ya mfalme. Kuongeza ‘mimi’ huunganisha kwa kawaida nafsi ya tatu ya kirai hiki na vitenzi vya nafsi ya kwanza vinavyofuata.
- source_word: בְּשִׁבְתִּי
  choice: nilipokuwa nikiishi
  rationale: Muundo huu unaonyesha kipindi ambacho nadhiri iliwekwa; tafsiri hii ni ya kawaida na huhifadhi hali endelevu ya kukaa huko.
- source_word: בִגְשׁוּר בַּאֲרָם
  choice: Geshuri katika Aramu
  rationale: Hutaja Geshuri kuwa mahali palipo katika eneo la Aramu bila kufafanua zaidi uhusiano huo.
- source_word: אִם ... יְשִׁיבֵנִי
  choice: Ikiwa ... atanirudisha ... kwa hakika
  rationale: Kurudiwa kwa mzizi שוב kunatilia mkazo tendo la kurudishwa. ‘Kwa hakika’ huonyesha msisitizo huo kwa Kiswahili cha asili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali hapa katika Kiswahili.
- source_word: וְעָבַדְתִּי אֶת יְהוָה
  choice: basi nitamtumikia Yahwe
  rationale: Kitenzi עבד kinapotumiwa kumhusu Mungu kinaweza kumaanisha kumtumikia kwa ibada. ‘Kumtumikia’ huhifadhi maana pana, huku ‘basi’ ikionyesha matokeo ya sharti.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; ‘Yahwe’ huhifadhi tofauti hiyo.
- issue: Maana ya עבד katika kumwelekea Mungu
  choice: nitamtumikia Yahwe
  alternative: nitamwabudu Yahwe
  rationale: ‘Kutumikia’ huhifadhi upana wa maana ya Kiebrania, ambayo inaweza kuhusisha ibada bila kuiwekea mipaka ya tendo la kuabudu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘mimi, mtumishi wako’ huhifadhi adabu ya usemi wa kifalme na kufanya mabadiliko ya nafsi yawe ya kawaida katika Kiswahili.
