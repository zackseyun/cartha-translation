  text: רְאוּ֙ אָנֹכִ֣י מִתְמַהְמֵ֔הַּ ב/עברות הַ/מִּדְבָּ֑ר עַ֣ד בּ֥וֹא דָבָ֛ר מֵ/עִמָּ/כֶ֖ם לְ/הַגִּ֥יד לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/028.yaml
  text: See[b][a], I will wait at the fords of the wilderness until word comes from you to inform me.
translation:
  language: sw
  text: Angalieni, mimi nitasubiri[b] kwenye vivuko vya nyikani[a] mpaka ujumbe utakapofika kutoka kwenu ili kuniarifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye sehemu za kuvukia za nyikani.”
    reason: lexical_alternative
  - marker: b
    text: Au “ninakawia” au “nitakawia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: Angalieni
  rationale: Ni amri ya wingi inayotumiwa kuvuta fikira za wasikilizaji; “Angalieni” inadumisha mkazo na uelekevu wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: אָנֹכִי
  choice: mimi
  rationale: Kiwakilishi huru kinaweka mkazo kwa msemaji; kutaja “mimi” wazi kunadumisha mkazo huo kwa njia ya asili.
- source_word: מִתְמַהְמֵהַּ
  choice: nitasubiri
  rationale: Kitenzi hiki katika muundo wa Hitpael kina maana ya kukawia, kubaki, au kungoja. Katika muktadha, Daudi anakusudia kubaki mahali hapo akisubiri habari, hivyo “nitasubiri” huwasilisha vizuri maana ya kitendo.
- source_word: בְּעַבְרוֹת
  choice: kwenye vivuko
  rationale: Nomino ya wingi inaelekeza kwenye mahali pa kuvukia, hasa vivuko vya maji. “Kwenye vivuko” ni sahihi na ya kawaida katika muktadha wa safari ya kukimbia.
- source_word: הַמִּדְבָּר
  choice: vya nyikani
  rationale: מִדְבָּר humaanisha eneo la nyika au nchi isiyokaliwa sana, si lazima jangwa la mchanga; “nyika” inafaa katika muktadha huu.
- source_word: עַד בּוֹא דָבָר
  choice: mpaka ujumbe utakapofika
  rationale: דָבָר hapa ni taarifa au ujumbe. Kiswahili huhitaji usemi wa wazi zaidi kuliko tafsiri ya moja kwa moja ya “neno,” na “ujumbe utakapofika” ni wa asili.
- source_word: מֵעִמָּכֶם
  choice: kutoka kwenu
  rationale: Kirai hiki kinaonyesha kwamba ujumbe unatoka kwa watu wanaosemeshwa; “kutoka kwenu” huwasilisha maana hiyo moja kwa moja.
- source_word: לְהַגִּיד לִי
  choice: ili kuniarifu
  rationale: Infinitivi ya Hiphil ya נגד ina maana ya kufanya jambo lijulikane au kutoa taarifa. “Kuniarifu” inafaa katika muktadha wa kutumwa kwa ujumbe.
