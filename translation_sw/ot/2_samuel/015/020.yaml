  text: תְּמ֣וֹל בּוֹאֶ֗/ךָ וְ/הַ/יּ֞וֹם אנוע/ך עִמָּ֨/נוּ֙ לָ/לֶ֔כֶת וַ/אֲנִ֣י הוֹלֵ֔ךְ עַ֥ל אֲשֶׁר אֲנִ֖י הוֹלֵ֑ךְ שׁ֣וּב וְ/הָשֵׁ֧ב אֶת אַחֶ֛י/ךָ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/020.yaml
  text: You came only yesterday[a], and today should I make you wander with us, while I go wherever I can go? Return, and take your brothers back with you[c][b]. May steadfast love and faithfulness be with you.
translation:
  language: sw
  text: Jana tu umefika, na leo nikufanye utangatange pamoja nasi, ilhali mimi ninaenda niendako?[a] Rudi, ukawarudishe ndugu zako[b] pamoja nawe. Upendo wa kudumu na uaminifu viwe pamoja nawe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “mimi ninaenda kule ninakoenda.” Usemi wa Kiebrania unajirudia kwa namna ya kiidiomu na hauelezi mahali hasa Daudi anakokwenda.
    reason: lexical_alternative
  - marker: b
    text: “Ndugu zako” huenda ni wenzake au jamaa zake Ittai waliokuja pamoja naye.
    reason: cultural_note
  - marker: c
    text: 'Kiebrania hakina kitenzi katika kishazi hiki; kinaweza kueleweka kuwa baraka: “Upendo wa kudumu na uaminifu viwe pamoja nawe.”'
    reason: textual_clarity
lexical_decisions:
- source_word: תְּמוֹל בּוֹאֶךָ
  choice: Ulifika jana tu
  rationale: Muundo huu kwa kawaida unaeleza kwamba Ittai aliwasili jana; neno “tu” linaonyesha jinsi alivyokuwa mgeni wa hivi karibuni bila kubadili maana ya msingi.
- source_word: אֲנוּעֲךָ
  choice: nikufanye utange-tange
  rationale: Kitenzi נוע katika muundo wa kusababisha kina maana ya kumfanya mtu azunguke au ahame bila utulivu; “utange-tange” linahifadhi hali ya kukosa makao ya kudumu katika kukimbia kwa Daudi.
- source_word: עִמָּנוּ לָלֶכֶת
  choice: pamoja nasi
  rationale: Wazo la kwenda tayari limo katika “utange-tange”; usemi huu ni wa kawaida katika Kiswahili na haupotezi maana.
- source_word: וַאֲנִי הוֹלֵךְ עַל אֲשֶׁר אֲנִי הוֹלֵךְ
  choice: ilhali mimi ninaenda niendako
  rationale: Tafsiri hii inakaribia sana usemi wa Kiebrania ulio wa kimakusudi usio bainifu, hivyo haiamui kimya-kimya ikiwa Daudi anaenda anapoweza au anapolazimika kwenda.
- source_word: שׁוּב וְהָשֵׁב
  choice: Rudi, ukawarudishe
  rationale: Amri ya kwanza inamtaka Ittai arudi; ya pili ni ya kusababisha na inamtaka awarudishe walio pamoja naye.
- source_word: אַחֶיךָ
  choice: ndugu zako
  rationale: Hii ndiyo maana ya moja kwa moja ya neno la Kiebrania; huenda katika muktadha inawahusu jamaa au wenzake Ittai, jambo linalofafanuliwa katika tanbihi bila kubadili maandishi.
- source_word: חֶסֶד וֶאֱמֶת
  choice: fadhili thabiti na uaminifu
  rationale: Jozi hii ya maneno hueleza wema wenye ushikamanifu na hali ya kuwa mwaminifu au wa kutegemewa. “Fadhili thabiti” lina uzito zaidi kuliko “fadhili” peke yake bila kuingiza istilahi ya kimadhehebu.
theological_decisions:
- issue: Nguvu ya kishazi cha mwisho kisicho na kitenzi wazi
  choice: Fadhili thabiti na uaminifu viwe pamoja nawe
  alternative: Fadhili thabiti na uaminifu pamoja nawe
  rationale: Kiebrania hakina kitenzi kilichoandikwa. Kukamilisha kwa “viwe” kunakisoma kama baraka, jambo linalofaa katika muktadha, huku tanbihi ikihifadhi kwamba kitenzi hakiko wazi katika chanzo.
- issue: Kutobainika kwa mahali Daudi anakokwenda
  choice: ninaenda niendako
  alternative: ninaenda popote niwezapo kwenda
  rationale: Usemi wa chanzo ni wa kurudia na hauweki wazi uwezo, wajibu, au mahali maalumu; tafsiri iliyochaguliwa inahifadhi mvutano huo badala ya kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa urahisi. Muundo wa Kiebrania unaorudia “ninaenda niendako” umehifadhiwa ili kuonyesha kutokuwa na uhakika kwa Daudi. “Utange-tange” linaonyesha kuhama bila utulivu, na “fadhili thabiti” linabeba wazo la חסד bila kutumia istilahi ya dhehebu.
