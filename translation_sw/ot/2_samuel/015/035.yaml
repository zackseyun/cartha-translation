translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mpangilio wa majina na cheo umewekwa kwa koma ili sentensi isomeke kwa urahisi huku ikihifadhi kwamba Sadoki na Abiathari wote ni makuhani.
