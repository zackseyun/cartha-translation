base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/035.yaml
  text: Are not Zadok and Abiathar the priests there with you? And whatever matter you hear from the king’s house, you shall report to Zadok and Abiathar the priests.
translation:
  language: sw
  text: Je, Sadoki na Abiathari, makuhani, hawako huko pamoja nawe? Basi, kila jambo utakalolisikia kutoka katika nyumba ya mfalme, utawaambia Sadoki na Abiathari, makuhani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא
  choice: Je, ... hawako
  rationale: Huhifadhi swali la Kiebrania linalotarajia jibu la kukubali, kwa muundo wa kawaida wa Kiswahili.
- source_word: כָל הַדָּבָר
  choice: kila jambo
  rationale: Neno דָּבָר hapa lina maana ya jambo au taarifa; “kila jambo” huhifadhi upeo na uhalisia wa usemi wa chanzo.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: kutoka katika nyumba ya mfalme
  rationale: Huhifadhi picha ya chanzo; “nyumba ya mfalme” inaweza kumaanisha makao au jamaa na utawala wake bila kulazimisha maana moja.
- source_word: תַּגִּיד
  choice: uwaambie
  rationale: Huwasilisha agizo la kutoa taarifa kwa lugha ya kawaida na yenye heshima.
