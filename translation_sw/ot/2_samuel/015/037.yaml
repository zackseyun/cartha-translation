  text: So Hushai[a], David’s friend, came into the city, as Absalom was entering Jerusalem.
translation:
  language: sw
  text: Basi Hushai, rafiki wa Daudi, akafika mjini, wakati Absalomu alipokuwa akiingia Yerusalemu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye Absalomu akaingia Yerusalemu.” Kiunganishi cha Kiebrania kinaweza kueleweka kuwa “na,” na kitenzi kinaweza kutafsiriwa kwa wakati uliopita wa kawaida.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akafika
  rationale: Kitenzi בוא kinaweza kumaanisha kuja, kuingia, au kufika. Pamoja na ‘mjini,’ ‘akafika mjini’ ni Kiswahili cha kawaida kinachoonyesha mwendo wa Hushai kuelekea mji bila kudokeza kuwa tayari alikuwa ndani yake.
- source_word: חוּשַׁי
  choice: Hushai
  rationale: Jina la mtu limetoholewa kwa namna inayotumiwa kwa kawaida katika tafsiri za Kiswahili.
- source_word: רֵעֶה דָוִד
  choice: rafiki ya Daudi
  rationale: Neno רֵעֶה humaanisha rafiki au mwandamani. ‘Rafiki ya Daudi’ ni tafsiri ya moja kwa moja isiyoongeza wazo mahususi la cheo cha mshauri.
- source_word: הָעִיר
  choice: mjini
  rationale: Kiebrania kinasema ‘mji’; katika muktadha ni Yerusalemu. Umbo ‘mjini’ ni la asili baada ya ‘akafika’ na halibadilishi nomino hiyo kuwa jina maalumu.
- source_word: וְאַבְשָׁלֹם
  choice: wakati Absalomu
  rationale: Ingawa וְ inaweza kutafsiriwa ‘na,’ hapa inaunganisha matukio yanayoonekana kuwasilishwa kwa wakati mmoja. ‘Wakati’ huleta uhusiano huo wa muda kwa Kiswahili cha kawaida.
- source_word: יָבֹא
  choice: alipokuwa akiingia
  rationale: Umbo la yiqtol baada ya wayyiqtol iliyotangulia linaweza kuonyesha tendo la wakati mmoja au la usuli. ‘Alipokuwa akiingia’ huhifadhi utofauti huo wa kisarufi na mwendo unaoendelea.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali hapo katika Kiswahili cha Biblia.
