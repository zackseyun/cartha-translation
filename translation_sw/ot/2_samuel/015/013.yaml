  text: Then a messenger came to David[a], saying, “The hearts of the men of Israel are with Absalom.”
translation:
  language: sw
  text: Ndipo mleta habari akaja kwa Daudi na kusema, “Mioyo ya wanaume wa Israeli imeelekea kwa Absalomu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “moyo wa wanaume wa Israeli ulikuwa baada ya Absalomu”; hii ni nahau inayoonyesha kwamba uaminifu wao umehamia kwake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaja
  rationale: Kauli ya wayyiqtol ya בוא inaendeleza simulizi kwa tendo la wakati uliopita; “akaja” ni Kiswahili cha kawaida na cha asili katika masimulizi.
- source_word: הַמַּגִּיד
  choice: mleta habari
  rationale: Nomino hii ya kishiriki kutoka נגד katika Hiphil humaanisha mtu anayeleta taarifa. “Mleta habari” linafaa kwa taarifa hii ya kisiasa na halidokezi lazima mjumbe rasmi.
- source_word: לֵאמֹר
  choice: na kusema
  rationale: Hutambulisha maneno ya moja kwa moja; “na kusema” ni muundo wa asili wa Kiswahili huku ukihifadhi mtiririko wa taarifa ya Kiebrania.
- source_word: הָיָה לֶב
  choice: Mioyo ... imeelekea
  rationale: Kiebrania kihalisi kina “moyo ... umekuwa/ulikuwa baada ya.” “Mioyo” huonyesha maana ya kugawanyika kwa kundi la אִישׁ, na “imeelekea” huhifadhi sitiari ya mwelekeo wa ndani bila kuficha maana yake ya uaminifu wa kisiasa.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: wanaume wa Israeli
  rationale: אִישׁ ni umoja wa kimofolojia lakini hapa hutumiwa kwa maana ya mkusanyiko. “Wanaume wa Israeli” huhifadhi umbo la kiume na muktadha unaowezekana wa kisiasa au kijeshi.
- source_word: אַחֲרֵי
  choice: imeelekea kwa
  rationale: Neno lenyewe ni “baada ya/nyuma ya,” lakini katika nahau hii huonyesha kumfuata mtu au kuwa mwaminifu kwake. “Imeelekea kwa” huhifadhi picha hiyo na kueleweka kwa Kiswahili.
- source_word: אַבְשָׁלוֹם
  choice: Absalomu
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika matumizi ya Biblia ya Kiswahili.
