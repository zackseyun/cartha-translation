  text: וַ/יְהִ֕י מִ/קֵּ֖ץ אַרְבָּעִ֣ים שָׁנָ֑ה וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ אֶל הַ/מֶּ֔לֶךְ אֵ֣לֲכָה נָּ֗א וַ/אֲשַׁלֵּ֛ם אֶת נִדְרִ֛/י אֲשֶׁר נָדַ֥רְתִּי לַֽ/יהוָ֖ה בְּ/חֶבְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/007.yaml
  text: And at the end of forty years, Absalom said to the king, “Please let me go and pay the vow that I vowed to the LORD in Hebron.”
translation:
  language: sw
  text: Baada ya miaka arobaini[a], Absalomu akamwambia mfalme, “Tafadhali, niruhusu niende nikaitimize nadhiri yangu niliyomwekea BWANA huko Hebroni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya nakala za kale za tafsiri ya Kigiriki na Kisiria zinasema “miaka minne” badala ya “miaka arobaini.”
    reason: Idadi “arobaini” katika maandishi ya Kiebrania ina tatizo la kihistoria, na baadhi ya mashahidi wa kale wana usomaji “minne”; tofauti hiyo inafaa kuwekwa wazi kwa msomaji.
lexical_decisions:
- source_word: מִקֵּץ אַרְבָּעִים שָׁנָה
  choice: Baada ya miaka arobaini
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya muda uliotimia, huku ikihifadhi idadi iliyo katika maandishi ya Kiebrania ya WLC.
- source_word: אֵלֲכָה נָּא
  choice: Tafadhali, niruhusu niende
  rationale: Chembe נָא inaonyesha ombi la heshima; Kiswahili hiki ni cha asili katika mazungumzo na mfalme.
- source_word: וַאֲשַׁלֵּם אֶת נִדְרִי
  choice: nikaitimize nadhiri yangu
  rationale: Kitenzi שלם katika muktadha wa nadhiri humaanisha kutekeleza au kutimiza wajibu wa nadhiri, si lazima kulipa fedha.
- source_word: לַיהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea ya tafsiri za Biblia za Kiswahili kwa jina la Mungu YHWH.
- source_word: בְּחֶבְרוֹן
  choice: Hebroni
  rationale: Umbo lenye kiambishi -ni ni la kawaida katika Kiswahili kwa kutaja mahali pa kwenda.
theological_decisions:
- issue: Mahali panapohusishwa na kishazi בְּחֶבְרוֹן
  choice: “niende Hebroni nikaitimize nadhiri”
  alternative: “nadhiri yangu niliyomwekea BWANA huko Hebroni”
  rationale: Mpangilio uliochaguliwa unaeleweka kwa kawaida kuwa Hebroni ndiko nadhiri itakakotimizwa, bila kulazimisha dai kwamba Absalomu aliitoa nadhiri akiwa Hebroni; mstari unaofuata unaonyesha aliweka nadhiri akiwa Geshuri.
- issue: Idadi ya miaka
  choice: miaka arobaini
  alternative: miaka minne
  rationale: WLC inasoma “arobaini,” kwa hiyo maandishi makuu yanaihifadhi; tofauti muhimu ya kale inaelezwa katika tanbihi badala ya kusahihisha maandishi kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nadhiri” ni neno la kawaida la kibiblia na la kidini; “nikaitimize” linaeleza tendo kwa urahisi bila kuingiza wazo la malipo ya fedha.
