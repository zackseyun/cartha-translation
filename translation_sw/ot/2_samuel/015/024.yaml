base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/024.yaml
  text: And look[a], Zadok also came, and all the Levites with him, carrying the ark of the covenant of God. And they set down the ark of God[c][b], and Abiathar went up until all the people had finished crossing over from the city.
translation:
  language: sw
  text: Tazama, Sadoki pia alikuwapo, na Walawi wote pamoja naye, wakiwa wamebeba sanduku la agano la Mungu. Wakaliweka chini sanduku la Mungu[b], naye Abiathari akapanda[c], mpaka watu wote walipomaliza kuvuka kutoka katika mji[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kutoka Yerusalemu.
    reason: cross_reference
  - marker: b
    text: Au, “Wakaliweka sanduku la Mungu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuliweka chini au kukiweka mahali hapo.
    reason: lexical_alternative
  - marker: c
    text: Au, “Abiathari akaja juu.” Kiebrania kinasema kihalisi “akapanda,” lakini maana kamili ya mwendo huo katika simulizi haiko wazi.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Ni kiashiria cha mazungumzo kinachoelekeza fikira kwenye tukio jipya kwa namna ya wazi, ya sasa, na yenye hadhi.
- source_word: גַם צָדוֹק
  choice: Sadoki pia alikuwa hapo
  rationale: Kiebrania hakina kitenzi wazi katika kishazi hiki. Maneno haya yanaonyesha kuwapo kwa Sadoki katika tukio; ‘alikuwa hapo’ ni Kiswahili cha kawaida bila kulazimisha wazo la kwamba ndipo alipowasili.
- source_word: כָל הַלְוִיִּם אִתּוֹ
  choice: Walawi wote waliokuwa pamoja naye
  rationale: Inahifadhi maana ya kundi lote la Walawi walioandamana na Sadoki.
- source_word: נֹשְׂאִים
  choice: wakiwa wamebeba
  rationale: Hali ya kitenzi inaeleza tendo walilokuwa wakifanya Walawi katika tukio hilo.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: sanduku la agano la Mungu
  rationale: Inahifadhi mlolongo kamili wa majina na neno la msingi ‘agano’ kwa lugha inayoeleweka.
- source_word: וַיַּצִּקוּ
  choice: Wakaliweka chini
  rationale: Katika muktadha, kitenzi kinaelekea kumaanisha kuliweka sanduku mahali au kulishusha chini. Chaguo hili linafaa kwa mwendo wa simulizi, huku uwezekano wa ‘kuliweka’ ukitajwa katika tanbihi.
- source_word: וַיַּעַל אֶבְיָתָר
  choice: naye Abiathari akapanda
  rationale: Kitenzi עלה kimsingi huonyesha kwenda juu au kupanda. Tafsiri inahifadhi mwendo huo bila kuufasiri kuwa tendo la kikuhani.
- source_word: עַד תֹּם כָּל הָעָם לַעֲבוֹר
  choice: mpaka watu wote walipomaliza kuvuka
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kikomo cha wakati na kukamilika kwa tendo la watu wote.
- source_word: מִן הָעִיר
  choice: kutoka mjini
  rationale: Inahifadhi rejeo la jumla la Kiebrania, ‘mji,’ bila kulibadili katika matini kuu kuwa Yerusalemu.
theological_decisions:
- issue: Mji unaorejelewa na מִן הָעִיר
  choice: kutoka mjini
  alternative: kutoka Yerusalemu
  rationale: Matini ya Kiebrania inasema ‘kutoka mjini.’ Muktadha unaonyesha kuwa ni Yerusalemu, lakini utambulisho huo umewekwa katika tanbihi badala ya kuchukua nafasi ya maneno ya chanzo.
- issue: Maana kamili ya וַיַּעַל אֶבְיָתָר
  choice: Abiathari akapanda
  alternative: Abiathari akaja juu; Abiathari akatoa dhabihu
  rationale: Kitenzi cha Kiebrania kimsingi humaanisha kupanda au kwenda juu. Maelezo ya tukio hayako wazi kabisa, kwa hiyo tafsiri haiongezi tendo la kutoa dhabihu lisilotajwa moja kwa moja.
- issue: Tendo linaloelezwa na וַיַּצִּקוּ
  choice: Wakaliweka chini
  alternative: Wakaliweka
  rationale: Muktadha unaunga mkono kushushwa au kuwekwa kwa sanduku, lakini kitenzi kinaweza kueleweka kwa upana zaidi. Tanbihi inadumisha uwezekano huo.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili: Sadoki na Abiathari. ‘Sanduku la agano’ ni wazi kwa msomaji wa kawaida na linadumisha msamiati muhimu wa Kiebrania. Alama za tanbihi zimewekwa karibu na vifungu vinavyohusika.'
