base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/016.yaml
  text: So the king went out[a], and all his household after him on foot; and the king left ten women, concubines, to keep the house.
translation:
  language: sw
  text: Basi mfalme akatoka[a], na watu wote wa nyumbani mwake wakamfuata kwa miguu; naye mfalme akawaacha wanawake kumi, masuria, ili waitunze nyumba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kihalisi zaidi, “na watu wote wa nyumbani mwake miguuni pake.” Nahau ya Kiebrania inaonyesha kwamba walimfuata wakitembea kwa miguu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Kitenzi יצא katika mfuatano wa kisimulizi kinaonyesha kuondoka kwa mwendo halisi; “akatoka” ni usemi wa kawaida na huhifadhi mfuatano huo.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Hili ndilo tafsiri ya kawaida ya מלך yenye kibainishi. Ingawa muktadha unamtambulisha kuwa Daudi, chanzo kinatumia cheo chake.
- source_word: וְכָל בֵּיתוֹ
  choice: na watu wote wa nyumbani mwake
  rationale: בַּיִת hapa humaanisha watu wa nyumba ya mfalme, si jengo. Usemi huu ni wa kawaida na unaeleweka kwa wasomaji wa Kiswahili cha sasa.
- source_word: בְּרַגְלָיו
  choice: wakamfuata kwa miguu
  rationale: Kihalisi ni “miguuni pake,” lakini nahau hiyo inaonyesha kwamba watu wa nyumba yake walimfuata wakitembea kwa miguu. Tafsiri hii huhifadhi pande zote mbili za maana.
- source_word: וַיַּעֲזֹב
  choice: akawaacha
  rationale: עזב hapa ni kuwaacha nyuma kwa kusudi fulani; “akawaacha” huepuka maana kali zaidi ya kuwatelekeza.
- source_word: עֶשֶׂר נָשִׁים פִּלַגְשִׁים
  choice: wanawake kumi, masuria
  rationale: Chanzo kina “wanawake” na kisha “masuria” kama ufafanuzi unaofuata. Zote zimehifadhiwa badala ya kufupisha kuwa “masuria kumi.”
- source_word: לִשְׁמֹר
  choice: ili waitunze
  rationale: שׁמר inaweza kumaanisha kulinda, kutunza, au kuangalia. Katika muktadha wa makao yaliyoachwa, “waitunze” ni pana na ya kawaida bila kuondoa kabisa wazo la ulinzi.
- source_word: הַבָּיִת
  choice: nyumba
  rationale: Hapa בַּיִת inaelekea kumaanisha makao ya mfalme. “Nyumba” huhifadhi neno la chanzo; “ikulu” ingekuwa ufafanuzi wa kimuktadha zaidi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi wa Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. “Masuria” limetumiwa kwa maana ya wake wa daraja la pili katika mfumo wa kifalme wa wakati huo; “watu wote wa nyumbani mwake” hutofautisha watu wa nyumba na jengo linalotajwa mwishoni.
