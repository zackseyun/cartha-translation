base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/012.yaml
  text: And Absalom sent for Ahithophel the Gilonite[a], David’s counselor, from his city, from Giloh, while he was offering the sacrifices. And the conspiracy grew strong[c][b], and the people kept increasing with Absalom.
translation:
  language: sw
  text: Absalomu akatuma kumwita Ahithofeli, Mgiloni[a], mshauri wa Daudi, kutoka mji wake wa Gilo, alipokuwa akitoa dhabihu. Njama hiyo ikazidi kuwa na nguvu[b], na watu waliokuwa pamoja na Absalomu wakazidi kuongezeka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu wa Gilo.”
    reason: lexical_alternative
  - marker: b
    text: Au “njama hiyo ikawa na nguvu.”
    reason: lexical_alternative
  - marker: c
    text: Tafsiri ya neno kwa neno ni “watu walikuwa wakienda na kuwa wengi pamoja na Absalomu,” yaani, waliendelea kuongezeka kwa idadi na kumuunga mkono.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma watu wamwite
  rationale: Katika muktadha huu kitenzi kinaashiria kwamba Absalomu alituma ujumbe wa kumwita Ahithofeli ajiunge naye, si kwamba alimtuma Ahithofeli kwenda mahali pengine.
- source_word: הַגִּלֹנִי
  choice: Mgilo
  rationale: Ni jina la utambulisho linalotokana na mahali paitwapo Gilo; “Mgilo” ni muundo wa kawaida wa Kiswahili kwa mtu wa mahali fulani.
- source_word: יוֹעֵץ דָּוִד
  choice: mshauri wa Daudi
  rationale: Huhifadhi wazi uhusiano wa cheo cha Ahithofeli na Daudi na maana yake ya kisiasa.
- source_word: מֵעִירוֹ מִגִּלֹה
  choice: kutoka katika mji wake, Gilo
  rationale: Huhifadhi nomino ya jumla na jina la mahali kama zilivyo katika Kiebrania bila marudio yasiyo ya kawaida katika Kiswahili.
- source_word: בְּזָבְחוֹ אֶת־הַזְּבָחִים
  choice: alipokuwa akitoa dhabihu
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati huohuo; “kutoa dhabihu” ni Kiswahili cha kawaida chenye maana ya ibada.
- source_word: הַקֶּשֶׁר
  choice: njama
  rationale: Katika muktadha wa uasi uliopangwa dhidi ya mfalme, “njama” hueleza mpango wa siri wa kisiasa bila kuongeza hukumu isiyomo katika neno lenyewe.
- source_word: אַמִּץ
  choice: ikazidi kuwa na nguvu
  rationale: Huwasilisha hali iliyoendelea kuimarika badala ya hali tuli tu.
- source_word: הוֹלֵךְ וָרָב
  choice: wakazidi kuongezeka
  rationale: Huwasilisha hali endelevu ya idadi au uungwaji mkono kuongezeka.
- source_word: הָעָם ... אֶת אַבְשָׁלוֹם
  choice: watu waliokuwa upande wa Absalomu
  rationale: Kiebrania kinaeleza watu waliokuwa pamoja na Absalomu kwa maana ya kumuunga mkono; Kiswahili hiki kinaweka uhusiano huo wazi kwa namna ya kawaida.
