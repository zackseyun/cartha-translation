  text: Then David said to Ittai, “Go on and cross over.” So Ittai the Gittite crossed over, along with all his men and all the little ones who were with him.
translation:
  language: sw
  text: Ndipo Daudi akamwambia Itai, “Nenda ukavuke.” Basi Itai Mgiti akavuka pamoja na watu wake wote na watoto wote waliokuwa pamoja naye.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ וַעֲבֹר
  choice: Endelea, uvuke
  rationale: Mfuatano wa amri ‘nenda/endelea na uvuke’ hapa unampa Itai ruhusa au agizo la kuendelea kuvuka; ‘Endelea, uvuke’ ni Kiswahili cha kawaida kinachohifadhi msisitizo wa vitenzi viwili.
- source_word: אֲנָשָׁיו
  choice: watu wake wote
  rationale: Katika muktadha huu neno linawahusu watu wa Itai, yaelekea wapiganaji au wafuasi wake; ‘watu wake’ huhifadhi upana wa neno bila kulibana kuwa ‘askari’ pekee.
- source_word: הַטַּף
  choice: watoto wote
  rationale: Neno humaanisha watoto au wadogo wanaowategemea watu wazima; ‘watoto’ ni tafsiri ya asili na inayoeleweka, bila kuongeza dhana isiyotajwa wazi.
- source_word: הַגִּתִּי
  choice: Mgiti
  rationale: Hili ni jina la mtu aliyetoka Gathi; ‘Mgiti’ ni umbo fupi la Kiswahili la jina hilo la utaifa/mahali.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wa heshima. ‘Ndipo’ na ‘Basi’ zinaakisi mfululizo wa wayyiqtol wa Kiebrania bila kufanya sentensi kuwa nzito.
