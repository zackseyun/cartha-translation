translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tazama’ limedumishwa kwa mvuto wa ghafla wa usimulizi; ‘kumlaki’ ni rasmi kiasi lakini linaeleweka kwa urahisi. Muundo unaepuka kutaja aina maalumu ya vazi ambayo huenda ikapotosha.
