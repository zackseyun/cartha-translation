base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/032.yaml
  text: When David came to the summit[a], where he worshiped God, behold[b], Hushai the Archite came to meet him with his tunic torn and dirt on his head.
translation:
  language: sw
  text: Daudi alipofika kileleni, mahali alipokuwa akimwabudu Mungu[a], tazama[b], Hushai Mwariki akaja kumlaki, vazi lake likiwa limeraruliwa na udongo ukiwa kichwani mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali alipomwabudu Mungu.” Kitenzi cha Kiebrania kinaweza kuonyesha tendo la kawaida (“alipokuwa akimwabudu”) au tendo moja la wakati uliopita.
    reason: lexical_alternative
  - marker: b
    text: Neno “Tazama” hutafsiri neno la Kiebrania la usimulizi linalovuta uangalifu kwa kutokea kwa Hushai ghafla.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: kileleni
  rationale: Ingawa neno hilo kwa kawaida humaanisha ‘kichwa,’ katika muktadha huu wa mahali linamaanisha sehemu ya juu kabisa, yaani kilele.
- source_word: אֲשֶׁר יִשְׁתַּחֲוֶה שָׁם לֵאלֹהִים
  choice: mahali alipokuwa akimwabudu Mungu
  rationale: Kitenzi kwa asili humaanisha kuinama au kusujudu, lakini kinapotumiwa kumwelekea Mungu huonyesha ibada. Muundo wa wakati unaweza kueleweka kuwa tendo la kawaida, ingawa tendo moja la wakati uliopita pia linawezekana; utata huo umeonyeshwa katika tanbihi.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili la usimulizi huvuta uangalifu kwa kutokea kwa Hushai ghafla na kwa namna ya wazi.
- source_word: לִקְרָאתוֹ
  choice: akaja kumlaki
  rationale: Kirai hiki huonyesha mwendo wa kwenda kukutana na mtu; ‘kumlaki’ ni Kiswahili cha kawaida chenye hadhi kinachofaa muktadha.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Hushai Mwarki
  rationale: Jina limetoholewa, na jina la ukoo au eneo הָאַרְכִּי limetolewa kwa muundo wa Kiswahili ‘Mwarki.’
- source_word: קָרוּעַ כֻּתָּנְתּוֹ
  choice: vazi lake likiwa limeraruliwa
  rationale: כֻּתֹּנֶת ni vazi la kuvaliwa mwilini, lakini hakuna neno moja la kisasa la Kiswahili linalolingana kabisa bila kuleta picha maalumu isiyokusudiwa. ‘Vazi’ ni wazi na la asili, huku ‘limeraruliwa’ likihifadhi hali iliyotokana na tendo hilo.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: na udongo ukiwa kichwani mwake
  rationale: אֲדָמָה humaanisha ardhi au udongo, si lazima vumbi laini. ‘Udongo’ huhifadhi maana hiyo na ishara ya maombolezo.
