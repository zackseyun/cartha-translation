  yaml_path: translation/ot/2_samuel/015/015.yaml
  text: The king’s servants said to the king[a], “Whatever my lord the king chooses, here are your servants.”
translation:
  language: sw
  text: Watumishi wa mfalme wakamwambia mfalme, “Lolote ambalo bwana wangu mfalme atachagua, sisi watumishi wako tupo hapa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa muundo wa karibu zaidi na Kiebrania: “Kulingana na yote ambayo bwana wangu mfalme atachagua, tazama, watumishi wako.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: wakamwambia
  rationale: Ni kitenzi cha kawaida cha masimulizi kinachoanzisha maneno ya moja kwa moja; ‘wakamwambia’ kinaonyesha kwa njia ya asili kwamba walizungumza na mfalme.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: watumishi wa mfalme
  rationale: Katika mazingira ya ikulu, neno עבד linamaanisha watumishi au wafuasi walio chini ya mamlaka ya mfalme; ‘watumishi’ halikazii bila sababu hali ya utumwa.
- source_word: כְּכֹל אֲשֶׁר יִבְחַר
  choice: Lolote ambalo ... atachagua
  rationale: Usemi wa Kiebrania una maana halisi ya ‘kulingana na yote ambayo ... atachagua’; tafsiri hii ya Kiswahili ni ya asili na inadumisha maana ya kuwa tayari kufuata uchaguzi wowote wa mfalme.
- source_word: יִבְחַר
  choice: atachagua
  rationale: Kitenzi בחר kwa kawaida humaanisha kuchagua; ‘atachagua’ kinahifadhi maana hiyo bila kuibadili kuwa ‘ataamua.’
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Hili ni jina la heshima la mazingira ya kifalme; ‘bwana wangu mfalme’ linadumisha heshima na utii wa usemi wa asili.
- source_word: הִנֵּה עֲבָדֶיךָ
  choice: sisi watumishi wako tupo hapa
  rationale: הִנֵּה huwasilisha uwepo na utayari wao; ‘tupo hapa’ ni Kiswahili cha sasa kinachohifadhi wazo hilo bila kutumia amri isiyo ya kawaida kama ‘tazama.’
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Uchaguzi huu unahifadhi urudiaji wa mzizi עבד uliotumiwa mwanzoni mwa mstari na kuonyesha jinsi wanavyojitambulisha kwa unyenyekevu mbele ya mfalme.
