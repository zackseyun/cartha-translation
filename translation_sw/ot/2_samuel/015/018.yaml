base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/018.yaml
  text: And all his servants were passing by at his side[a], and all the Cherethites, and all the Pelethites, and all the Gittites—six hundred men who had come on foot with him from Gath—were passing on before the king.
translation:
  language: sw
  text: Watumishi wake wote walikuwa wakipita kando yake; Wakerethi wote, Wapelethi wote, na Wagathi wote—wanaume mia sita waliokuwa wamekuja kwa miguu pamoja naye kutoka Gathi[a]—walikuwa wakipita mbele ya mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokuwa wamemfuata kutoka Gathi.” Kihalisi, Kiebrania husema, “kwa mguu wake kutoka Gathi,” nahau inayoweza kumaanisha kuandamana na mtu katika msafara wake au kwenda pamoja naye kwa miguu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Neno עֶבֶד linaweza kumaanisha watumishi, wafuasi wa kifalme, au maofisa. “Watumishi wake” huhifadhi maana yake ya msingi bila kubainisha cheo kisichotajwa wazi.
- source_word: עֹבְרִים עַל יָדוֹ
  choice: walikuwa wakipita kando yake
  rationale: Kirai עַל יָד hapa kina maana ya kuwa kando au ubavuni mwa mtu; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha picha ya mahali.
- source_word: הַכְּרֵתִי
  choice: Wakerethi
  rationale: Ni jina la kundi lililokuwa katika utumishi wa Daudi; limetoholewa badala ya kupewa tafsiri ya kimafafanuzi.
- source_word: הַפְּלֵתִי
  choice: Wapelethi
  rationale: Ni jina maalumu la kundi, hivyo limetoholewa kwa mtindo unaolingana na majina ya makundi katika Kiswahili.
- source_word: הַגִּתִּים
  choice: Wagathi
  rationale: Neno hili hutaja watu wa Gathi. “Wagathi” huhifadhi jina la kikundi kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: wanaume mia sita
  rationale: אִישׁ ni neno la kuhesabia wanaume hapa. “Wanaume” huepuka kuongeza moja kwa moja maana ya “wanajeshi,” ingawa muktadha ni wa kijeshi.
- source_word: אֲשֶׁר בָּאוּ בְרַגְלוֹ מִגַּת
  choice: waliokuwa wamekuja kwa miguu pamoja naye kutoka Gathi
  rationale: Kirai cha Kiebrania kinataja kihalisi “mguu wake” na kinaweza kueleza kuandamana na mtu katika msafara wake au kwenda kwa miguu. Tafsiri kuu huhifadhi taswira halisi na pia wazo la kuandamana.
- source_word: עֹבְרִים עַל פְּנֵי הַמֶּלֶךְ
  choice: walikuwa wakipita mbele ya mfalme
  rationale: עַל פְּנֵי humaanisha “mbele ya” au “mkabala na.” Tafsiri hii inafaa kwa msafara unaopita mbele ya mfalme na hudumisha tendo endelevu la participio.
