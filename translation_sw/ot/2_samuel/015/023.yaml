  text: וְ/כָל הָ/אָ֗רֶץ בּוֹכִים֙ ק֣וֹל גָּד֔וֹל וְ/כָל הָ/עָ֖ם עֹֽבְרִ֑ים וְ/הַ/מֶּ֗לֶךְ עֹבֵר֙ בְּ/נַ֣חַל קִדְר֔וֹן וְ/כָל הָ/עָם֙ עֹבְרִ֔ים עַל פְּנֵי דֶ֖רֶךְ אֶת הַ/מִּדְבָּֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/023.yaml
  text: And all the land was weeping with a loud voice[a], and all the people were crossing over. The king also crossed over the Kidron Valley[b], and all the people were crossing over on the road toward the wilderness.
translation:
  language: sw
  text: Nchi yote ilikuwa ikilia kwa sauti kubwa, na watu wote walikuwa wakivuka. Mfalme naye akavuka Bonde la Kidroni[a], na watu wote walikuwa wakivuka kwenye njia inayoelekea nyikani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bonde la Kidroni: kwa mapokeo, “kijito cha Kidroni.” Neno la Kiebrania נחל linaweza kumaanisha bonde au korongo lenye kijito cha msimu.'
    reason: cultural_note
  - marker: b
    text: Au kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “watu wote walikuwa wakivuka kwa njia ya nyikani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָאָרֶץ
  choice: nchi yote
  rationale: Inahifadhi taswira ya Kiebrania inayotumia eneo kwa maana ya wakazi wake kwa ujumla, bila kuifanya kuwa ‘dunia yote.’
- source_word: בּוֹכִים קוֹל גָּדוֹל
  choice: ilikuwa ikilia kwa sauti kubwa
  rationale: Muundo wa umoja unaendana na nomino ya pamoja ‘nchi yote,’ huku ‘kwa sauti kubwa’ ikihifadhi nahau ya Kiebrania ya maombolezo yanayosikika.
- source_word: כָל הָעָם
  choice: watu wote
  rationale: עָם hapa ni kundi lote lililoandamana na Daudi, si wanajeshi pekee.
- source_word: עֹבְרִים / עֹבֵר
  choice: walikuwa wakivuka / akavuka
  rationale: Vitenzi hivi vinaonyesha kuvuka mpaka wa kijiografia au bonde; hali endelevu kwa watu na tendo maalumu kwa mfalme huleta simulizi la kawaida la Kiswahili.
- source_word: בְּנַחַל קִדְרוֹן
  choice: Bonde la Kidroni
  rationale: נחל inaweza kumaanisha bonde lenye kijito cha msimu, korongo, au kijito; ‘Bonde la Kidroni’ ni wazi kwa msomaji wa sasa na linafaa kwa mahali hapa.
- source_word: עַל פְּנֵי דֶרֶךְ אֶת הַמִּדְבָּר
  choice: kwenye njia inayoelekea nyikani
  rationale: Kirai cha Kiebrania kimebanwa na kinaweza kueleza mwendo kwenye njia au kuelekea nyikani; tafsiri hii ni ya kawaida na haiongezi maelezo yasiyokuwapo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayosomeka kwa urahisi. ‘Nyikani’ limetumiwa badala ya maelezo marefu, na jina Kidron limeumbwa kuwa ‘Kidroni’ kwa matumizi ya kawaida ya Kiswahili.
