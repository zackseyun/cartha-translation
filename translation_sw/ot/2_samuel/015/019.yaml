base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/019.yaml
  text: Then the king said to Ittai the Gittite[a], “Why are you also going with us? Return and stay with the king[c][b], for you are a foreigner and also an exile from your own place.”
translation:
  language: sw
  text: Ndipo mfalme akamwambia Itai Mgiti, “Kwa nini wewe pia uende pamoja nasi?[a] Rudi ukae pamoja na mfalme,[b] kwa maana wewe ni mgeni, tena wewe ni mhamishwa kutoka mahali pako.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa nini wewe pia utaenda pamoja nasi?”
    reason: Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa maana ya wakati ujao.
  - marker: b
    text: Maneno “pamoja na mfalme” huenda yakamaanisha kubaki chini ya mamlaka ya kifalme iliyotawala Yerusalemu; Kiebrania hakitaji wazi mfalme anayelengwa.
    reason: Rejeleo la cheo “mfalme” lina utata katika muktadha huu.
  - marker: c
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa Kiebrania: “tena wewe ni mhamishwa kuelekea mahali pako.” Maneno ya Kiebrania ni mafupi na yanaweza kusisitiza hali ya Itai ya kuhamishwa pamoja na uhusiano wake na mahali pake.'
    reason: Kirai cha Kiebrania לִמְקוֹמֶךָ kina kihusishi chenye maana ya “kwa/kuelekea,” ingawa muktadha unaweza kueleweka kuwa yuko uhamishoni kutoka mahali pake.
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Ndipo mfalme akamwambia
  rationale: Muundo wa masimulizi unaendeleza mfululizo wa matukio. ‘Ndipo ... akamwambia’ ni wa kawaida katika Kiswahili cha masimulizi na unahifadhi cheo ‘mfalme’ badala ya kutaja Daudi moja kwa moja.
- source_word: אִתַּי הַגִּתִּי
  choice: Itai Mgiti
  rationale: Jina limetoholewa kuwa ‘Itai’; nisba הַגִּתִּי imetafsiriwa kwa umbo la Kiswahili ‘Mgiti,’ yaani mtu wa Gathi.
- source_word: לָמָּה תֵלֵךְ גַּם אַתָּה אִתָּנוּ
  choice: Kwa nini wewe pia uende pamoja nasi?
  rationale: ‘Uende’ huwasilisha swali lenye maana ya ‘kwa nini ufuatane nasi?’ bila kulazimisha ikiwa kitenzi cha Kiebrania kinarejelea wakati wa sasa au ujao. ‘Pia’ linahifadhi גַּם.
- source_word: שׁוּב וְשֵׁב
  choice: Rudi ukae
  rationale: Vitenzi viwili vya amri vimehifadhiwa. Katika muktadha huu ישׁב humaanisha kubaki au kukaa mahali, si tendo la kuketi tu.
- source_word: עִם הַמֶּלֶךְ
  choice: pamoja na mfalme
  rationale: Tafsiri inahifadhi cheo kisichotaja jina, kama Kiebrania, bila kuamua kimyakimya ni mfalme gani anayelengwa.
- source_word: נָכְרִי
  choice: mgeni
  rationale: Katika muktadha ‘mgeni’ humaanisha mtu asiye mwenyeji wa nchi hiyo; ni neno la kawaida na lenye hadhi katika Kiswahili.
- source_word: וְגַם גֹּלֶה אַתָּה לִמְקוֹמֶךָ
  choice: tena uko uhamishoni mbali na kwenu
  rationale: ‘Uko uhamishoni’ huonyesha hali ya kuondolewa au kutengwa na makao ya asili. ‘Mbali na kwenu’ hutoa Kiswahili cha asili kwa maana inayowezekana katika muktadha, huku tanbihi ikihifadhi ufupi na ugumu wa kirai cha Kiebrania.
theological_decisions:
- issue: Mhusika anayerejelewa na ‘mfalme’ katika ‘ukae pamoja na mfalme’
  choice: Kuacha ‘mfalme’ bila kumtaja kwa jina
  alternative: ‘Mfalme Absalomu,’ ‘mfalme aliyeko Yerusalemu,’ au ‘mimi mfalme’
  rationale: Kiebrania kinatumia cheo tu, na rejeleo lake halijawekwa wazi. Kulihifadhi huepuka kuingiza uamuzi wa kifasiri katika matini.
- issue: Mwelekeo wa לִמְקוֹמֶךָ katika kirai cha uhamisho
  choice: ‘mbali na kwenu’ katika matini, pamoja na tanbihi kuhusu tafsiri ya karibu zaidi na muundo
  alternative: ‘ukiwa mhamishwa kuelekea kwenu/mahali pako’
  rationale: Muktadha unaelekea kueleza hali ya Itai ya kuwa mbali na kwao, lakini Kiebrania kwa muundo wake kina ‘kwa/kuelekea mahali pako.’ Tanbihi inahifadhi mvutano huo badala ya kuuficha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo ni wa masimulizi ya Biblia lakini unaeleweka kwa msomaji wa kawaida. ‘Itai Mgiti’ hufuata utaratibu wa Kiswahili wa kutaja mtu wa Gathi, na utata wa matini umehifadhiwa kwa tanbihi badala ya kutatuliwa kimyakimya.
