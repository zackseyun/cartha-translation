translation:
  language: sw
  text: Mfalme akatoka, na watu wote wakamfuata kwa miguu; wakasimama kwenye nyumba ya mbali[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au huenda ni jina la mahali: “Beth-merhak.” Kirai cha Kiebrania kinaweza kusomwa “nyumba ya mbali” au “nyumba ya umbali,” lakini wengi hukielewa kwa maana ya “nyumba ya mwisho.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Kitenzi יצא katika simulizi kinaeleza kutoka au kuondoka; “akatoka” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Nomino yenye hali ya uamilifu inamtaja Daudi katika muktadha; “Mfalme” ni tafsiri ya kawaida.
- source_word: וְכָל הָעָם
  choice: na watu wote
  rationale: עָם hapa ni kundi lote lililoandamana na mfalme. “Watu” huhifadhi maana pana bila kudai kuwa wote walikuwa wanajeshi.
- source_word: בְּרַגְלָיו
  choice: pamoja naye kwa miguu
  rationale: Kirai hiki ni “miguuni pake/kwa miguu yake” kihalisi, lakini hapa kinaonyesha kuandamana naye, yaelekea wakitembea kwa miguu. Tafsiri hii huhifadhi mawazo yote mawili kwa Kiswahili cha kawaida.
- source_word: וַיַּעַמְדוּ
  choice: wakasimama
  rationale: עמד humaanisha kusimama, na katika muktadha wa safari inaweza kumaanisha kusimama kwa muda au kutua. “Wakasimama” ni ya moja kwa moja bila kuongeza tafsiri isiyolazimu.
- source_word: בֵּית הַמֶּרְחָק
  choice: nyumba ya mbali
  rationale: Kirai hiki kinaweza kueleweka kama “nyumba ya umbali/iliyo mbali,” kama nyumba ya mwisho pembezoni mwa mji, au labda kama jina la mahali. Tafsiri kuu inafuata maana yake ya karibu zaidi huku tanbihi ikihifadhi uwezekano mwingine.
