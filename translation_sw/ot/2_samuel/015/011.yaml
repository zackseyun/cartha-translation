  text: Two hundred men from Jerusalem went with Absalom[a], invited, and they went innocently, not knowing anything.
translation:
  language: sw
  text: Wanaume mia mbili kutoka Yerusalemu walienda pamoja na Absalomu. Walikuwa wamealikwa, nao wakaenda bila kushuku[a], wala hawakujua lolote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa unyofu wao” au “bila hatia”; usemi wa Kiebrania unaonyesha kwamba walienda bila kutambua wala kushuku mpango wa Absalomu.
