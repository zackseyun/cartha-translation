lexical_decisions:
- source_word: הָלְכוּ אֶת־אַבְשָׁלוֹם
  choice: walienda pamoja na Absalomu
  rationale: Kitenzi הלך pamoja na אֶת kinaonyesha kuandamana; usemi huu ni wa kawaida katika Kiswahili na haudokezi kwamba walishiriki kwa kujua njama yake.
- source_word: מָאתַיִם אִישׁ
  choice: wanaume mia mbili
  rationale: אִישׁ katika muundo huu wa kuhesabu inarejelea wanaume, hivyo tafsiri inahifadhi jinsia iliyo wazi katika Kiebrania.
- source_word: מִירוּשָׁלַםִ
  choice: kutoka Yerusalemu
  rationale: Kiambishi מִן kinaonyesha mahali walikotoka.
- source_word: קְרֻאִים
  choice: walikuwa wamealikwa
  rationale: Hii ni participio tendwa ya קרא yenye maana ya kuitwa au kualikwa; katika muktadha huu ni mwaliko, bila kuongeza neno lisilokuwapo kama ‘wageni.’
- source_word: וְהֹלְכִים
  choice: nao wakaenda
  rationale: Participio inaendeleza maelezo ya safari; kitenzi cha masimulizi kinasikika kwa kawaida katika Kiswahili huku kikihifadhi kurudiwa kwa wazo la kwenda.
- source_word: לְתֻמָּם
  choice: bila kushuku
  rationale: Katika muktadha huu תֹּם/תֻּם inaonyesha kutokuwa na hila au kutotambua mpango uliokuwapo; kishazi kinachofuata kinafafanua kwamba hawakujua lolote.
- source_word: וְלֹא יָדְעוּ כָּל־דָּבָר
  choice: wala hawakujua lolote
  rationale: Tafsiri hii huhifadhi kishazi huru cha Kiebrania na kusisitiza kwamba watu hao hawakuwa na habari kuhusu jambo lililopangwa.
