  edition: WLC
  text: וְ/אִם֙ כֹּ֣ה יֹאמַ֔ר לֹ֥א חָפַ֖צְתִּי בָּ֑/ךְ הִנְ/נִ֕י יַֽעֲשֶׂה לִּ֕/י כַּ/אֲשֶׁ֥ר ט֖וֹב בְּ/עֵינָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/026.yaml
  text: But if he says[a], ‘I take no pleasure in you,’ here I am[b]; let him do to me as seems good in his eyes.
translation:
  language: sw
  text: Lakini akisema, “Sipendezwi nawe[a],” mimi hapa; na anitendee kama aonavyo kuwa ni vyema.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sikufurahii.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “kama ilivyo njema machoni pake,” nahau yenye maana ya “kama aonavyo kuwa ni vyema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini akisema
  rationale: Muunganiko huu unaanzisha uwezekano unaokinzana na ule wa mstari uliotangulia. Kiswahili cha masharti hutumia kwa kawaida ‘akisema’ bila kulazimika kutafsiri ‘ikiwa’ kando.
- source_word: כֹּה יֹאמַר
  choice: akisema
  rationale: כֹּה hutanguliza maneno ya moja kwa moja baada ya kitenzi ‘kusema’; maana yake imewasilishwa kwa kawaida katika muundo wa nukuu.
- source_word: לֹא חָפַצְתִּי בָּךְ
  choice: Sipendezwi nawe
  rationale: חפץ hapa huonyesha kutopata furaha au kupendezwa na mtu. ‘Sipendezwi nawe’ ni ya asili na huhifadhi maana ya tathmini ya kimahusiano bila kuigeuza kuwa tamaa ya kimwili.
- source_word: הִנְנִי
  choice: mimi hapa
  rationale: Kauli hii ya kujitokeza inaonyesha utayari na kujisalimisha. ‘Mimi hapa’ ni wazi, ya sasa, na yenye uzito unaofaa.
- source_word: יַעֲשֶׂה לִּי
  choice: na anitendee
  rationale: Umbo hili linaonyesha kukubali kwa hiari kitendo cha Mungu. ‘Na anitendee’ huhifadhi nguvu ya ruhusa na kujisalimisha.
- source_word: כַּאֲשֶׁר טוֹב בְּעֵינָיו
  choice: kama aonavyo kuwa ni vyema
  rationale: Hii ni nahau inayomaanisha kile kinachoonekana kuwa chema au kinachofaa kwa mtu. Tafsiri hii ni ya kawaida katika Kiswahili huku tanbihi ikihifadhi taswira halisi ya ‘machoni pake.’
theological_decisions:
- issue: Mrejelewa wa nafsi ya tatu katika יַעֲשֶׂה na בְּעֵינָיו
  choice: Mrejelewa ameachwa kuwa nafsi ya tatu katika ‘anitendee’ na ‘aonavyo,’ akieleweka kuwa BWANA kutokana na muktadha.
  alternative: Kutaja ‘BWANA’ moja kwa moja badala ya viambishi vya nafsi ya tatu.
  rationale: Kiebrania hakirudii jina la Mungu katika mstari huu. Kuacha mrejelewa adokezwe na muktadha huhifadhi muundo wa chanzo bila kuingiza ufafanuzi usioandikwa.
- issue: Nguvu ya הִנְנִי na יַעֲשֶׂה לִּי
  choice: 'Imetafsiriwa kama kauli ya utayari na kujisalimisha: ‘mimi hapa; na anitendee.’'
  alternative: Kuifanya kuwa kauli ya kukata tamaa au madai kwamba kila kitakachotokea ni chema kimaadili.
  rationale: Maneno yanaonyesha Daudi akikubali uamuzi wa Mungu, lakini hayafuti mvutano wa hali yake wala hayadai kwamba kila tendo kwa lenyewe ni jema kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni rahisi kueleweka kwa msomaji wa kawaida; ‘mimi hapa’ huhifadhi uzito wa kauli ya kujitokeza, na ‘na anitendee’ huonyesha kujisalimisha bila lugha ya kizamani.
