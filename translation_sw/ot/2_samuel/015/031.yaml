  text: וְ/דָוִד֙ הִגִּ֣יד לֵ/אמֹ֔ר אֲחִיתֹ֥פֶל בַּ/קֹּשְׁרִ֖ים עִם אַבְשָׁל֑וֹם וַ/יֹּ֣אמֶר דָּוִ֔ד סַכֶּל נָ֛א אֶת עֲצַ֥ת אֲחִיתֹ֖פֶל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/031.yaml
  text: And it was told David[a], saying, “Ahithophel is among the conspirators with Absalom.” And David said, “O Yahweh, please turn Ahithophel’s counsel into foolishness.”
translation:
  language: sw
  text: Naye Daudi akaambiwa, “Ahithofeli ni miongoni mwa waliokula njama pamoja na Absalomu.” Daudi akasema, “Ee Yahweh, tafadhali ugeuze shauri la Ahithofeli kuwa upumbavu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִגִּיד
  choice: akaambiwa
  rationale: Hifili ya נגד humaanisha kutoa taarifa au kumwambia mtu. Kauli tendwa ya Kiswahili ni ya kawaida na haisingizi mhusika ambaye Kiebrania hakumtaji.
- source_word: לֵאמֹר
  choice: (imewakilishwa na nukuu ya moja kwa moja)
  rationale: Katika Kiswahili cha sasa, kuanza nukuu moja kwa moja baada ya ‘akaambiwa’ ni asilia zaidi kuliko kuongeza ‘ikisema,’ huku kazi ya kiashirio cha kunukuu ikihifadhiwa.
- source_word: בַּקֹּשְׁרִים
  choice: miongoni mwa waliokula njama
  rationale: Umbo la wingi linataja kundi la watu wanaoshiriki njama; ‘waliokula njama’ ni usemi wa kawaida wa Kiswahili unaohifadhi dhana ya wahaini wanaopanga kwa siri.
- source_word: עִם
  choice: pamoja na
  rationale: Hueleza ushirika wa Ahithofeli na Absalomu bila kuongeza maana ya kiitikadi.
- source_word: סַכֶּל
  choice: ugeuze ... kuwa upumbavu
  rationale: Amri ya Pieli inaomba shauri lifanywe la kipumbavu au lisilofaa. Tafsiri hii inahifadhi picha ya Kiebrania badala ya kuifupisha kuwa ‘livuruge’ pekee.
- source_word: נָא
  choice: tafadhali
  rationale: Huhifadhi sauti ya ombi la dhati kwa lugha ya sasa isiyo ya kizamani.
- source_word: עֲצַת
  choice: shauri
  rationale: ‘Shauri’ linafaa kwa ushauri wa kimkakati katika mazingira ya kisiasa na ni lenye hadhi kuliko usemi wa kawaida zaidi ‘ushauri.’
- source_word: יְהוָה
  choice: Ee Yahweh
  rationale: Jina la Mungu limeandikwa kwa uhamishaji ‘Yahweh’; ‘Ee’ huonyesha kwamba Daudi anamwita Mungu moja kwa moja katika sala.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה katika wito wa moja kwa moja
  choice: Ee Yahweh
  alternative: Ee BWANA
  rationale: Chanzo kinatumia jina maalumu la Mungu, si cheo; uhamishaji ‘Yahweh’ hulihifadhi, na ‘Ee’ huonyesha wito wa moja kwa moja.
- issue: Maana ya ombi סַכֶּל אֶת־עֲצַת
  choice: ugeuze shauri ... kuwa upumbavu
  alternative: livuruge shauri
  rationale: Chaguo kuu linahifadhi kwa uwazi taswira ya kulifanya shauri kuwa la kipumbavu, huku maana ya kulizuia lisifanikiwe ikibaki kuwa athari inayowezekana bila kuifanya tafsiri kuwa finyu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili: Daudi, Ahithofeli, na Absalomu. Muundo wa taarifa umerahisishwa kwa njia ya kawaida ya Kiswahili bila kuongeza mtendaji asiyeatajwa katika Kiebrania.'
