  terminology: Majina Daudi, Ahithofeli, na Absalomu ni maumbo ya Kiswahili yaliyozoeleka. “Shauri” linawakilisha עֲצָה vizuri katika muktadha wa ushauri wa kisiasa, na “Yahweh” linahifadhi jina la Kiebrania יְהוָה. “Ugeuze ... kuwa upumbavu” huwasilisha ombi la kufanya shauri lionekane au liwe la kipumbavu bila kulifupisha kuwa kushindwa tu.
