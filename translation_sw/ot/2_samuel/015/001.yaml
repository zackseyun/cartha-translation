base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/001.yaml
  text: After this[a], Absalom made for himself a chariot and horses[b], and fifty men running before him.
translation:
  language: sw
  text: Baada ya hayo, Absalomu akajipatia[a] gari la farasi na farasi, pamoja na wakimbiaji hamsini mbele yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akajifanyia” au “akajiandalia.” Kitenzi cha Kiebrania kinaweza kumaanisha kufanya au kujipatia.
    reason: lexical_alternative
  - marker: b
    text: Wakimbiaji hao hamsini waliokuwa mbele yake walikuwa sehemu ya msafara wa aina iliyohusishwa na wafalme, na hivyo kuashiria kujikweza kwa Absalomu hadharani.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מֵאַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Hii ni tafsiri ya kawaida na ya asili ya fomula ya kisimulizi yenye maana ya kwamba jambo hili lilitokea baadaye, huku ikihifadhi uhusiano wa wakati na matukio yaliyotangulia.
- source_word: וַיַּעַשׂ לוֹ
  choice: akajipatia
  rationale: Kitenzi עשה pamoja na לוֹ kinaweza kumaanisha kujifanyia au kujipatia. Katika orodha ya gari, farasi na wakimbiaji, ‘akajipatia’ ni Kiswahili cha asili kinachoonyesha kwamba Absalomu alijiandalia vitu hivyo bila kudai kuwa alivitengeneza kwa mikono yake.
- source_word: אַבְשָׁלוֹם
  choice: Absalomu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: מֶרְכָּבָה
  choice: gari
  rationale: Katika muktadha huu neno linamaanisha gari la kale lililovutwa na farasi. ‘Gari’ hudumisha ufupi wa Kiebrania bila kuongeza moja kwa moja kwamba lilikuwa gari la kifalme au la vita.
- source_word: וְסֻסִים
  choice: na farasi
  rationale: Tafsiri hii inafuata uratibu rahisi wa orodha ya Kiebrania.
- source_word: וַחֲמִשִּׁים אִישׁ
  choice: pamoja na watu hamsini
  rationale: אִישׁ baada ya namba ni namna ya kawaida ya kuhesabu watu. ‘Pamoja na’ huunganisha sehemu ya mwisho ya orodha kwa Kiswahili cha asili.
- source_word: רָצִים לְפָנָיו
  choice: waliokimbia mbele yake
  rationale: Kauli hii huhifadhi kitendo hai cha kishiriki cha Kiebrania na inaonyesha mahali walipokuwa katika msafara bila kuwapa cheo kisichotajwa wazi.
theological_decisions:
- issue: Ishara ya kisiasa ya msafara wa Absalomu
  choice: Kueleza gari, farasi na watu hamsini bila kumwita Absalomu mfalme au kusema wazi kwamba alikuwa akijitukuza.
  alternative: Absalomu akajiandalia msafara wa kifalme.
  rationale: Mpangilio huu unaashiria hadhi ya kifalme na tamaa ya kisiasa, lakini maandishi ya Kiebrania yanaeleza vitendo tu. Tafsiri inaacha maana hiyo ijitokeze bila kuifanya kuwa kauli ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida huku ikihifadhi mtiririko wa kisimulizi na kutofafanua kupita kiasi ishara ya kifalme.
