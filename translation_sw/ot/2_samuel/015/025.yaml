  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/צָד֔וֹק הָשֵׁ֛ב אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים הָ/עִ֑יר אִם אֶמְצָ֥א חֵן֙ בְּ/עֵינֵ֣י יְהוָ֔ה וֶ/הֱשִׁבַ֕/נִי וְ/הִרְאַ֥/נִי אֹת֖/וֹ וְ/אֶת נָוֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/025.yaml
  text: Then the king said to Zadok[a], “Return the ark of God to the city. If I find favor in the eyes of Yahweh, he will bring me back and let me see it and its dwelling place.”
translation:
  language: sw
  text: Kisha mfalme akamwambia Sadoki, “Rudisha sanduku la Mungu mjini. Nikipata kibali machoni pa Yahwe, atanirudisha na kunionyesha sanduku hilo na makao yake.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kunionyesha yeye na makao yake.” Kiebrania kinaweza kueleweka kuwa viwakilishi vinamrejelea Mungu, ingawa rejeleo la karibu zaidi ni “sanduku la Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָשֵׁב
  choice: Rudisha
  rationale: Ni amri ya kitenzi שוב katika kausativi, iliyoelekezwa kwa Sadoki; “rudisha” huonyesha wazi kwamba sanduku lipelekwe tena mjini.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: sanduku la Mungu
  rationale: Kiebrania kinasema wazi “sanduku la Mungu,” wala si “sanduku la Yahwe”; tafsiri haioanishi kifungu hiki na usemi mwingine unaofahamika zaidi.
- source_word: הָעִיר
  choice: mjini
  rationale: Nomino yenye uelekeo unaoeleweka kutokana na amri ya kurudisha; “mjini” ni Kiswahili cha kawaida na chenye maana ya kuelekea ndani ya mji.
- source_word: אִם אֶמְצָא חֵן בְּעֵינֵי יְהוָה
  choice: Nikipata kibali machoni pa Yahwe
  rationale: Huhifadhi nahau ya Kiebrania ya “kupata kibali machoni pa” bila kuifasiri zaidi kuwa tu “nikimpendeza.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: וֶהֱשִׁבַנִי
  choice: atanirudisha
  rationale: Kausativi ya שוב yenye kiambishi cha nafsi ya kwanza inaonyesha kwamba Yahwe ndiye atakayemrudisha Daudi, kwa muktadha, Yerusalemu.
- source_word: וְהִרְאַנִי
  choice: na kunionyesha
  rationale: Kausativi ya ראה ina maana ya “kunifanya nione” au “kunionyesha”; “kunionyesha” ni ya kawaida na bado huhifadhi tendo la Yahwe kama kisababishi.
- source_word: אֹתוֹ
  choice: hilo
  rationale: Kiwakilishi kinaweza kurejelea sanduku lililotajwa mara moja kabla; “hilo” ni marejeo ya kawaida kwa “sanduku” katika Kiswahili.
- source_word: נָוֵהוּ
  choice: makao yake
  rationale: נוה humaanisha makao au mahali pa kukaa. “Makao yake” hayaongezi dhana ya hekalu ambalo halikuwa limejengwa, na kiwakilishi chake hudumisha uwezekano wa kurejelea sanduku au, kwa upana wa kiteolojia, Mungu.
theological_decisions:
- issue: Marejeo ya אֹתוֹ וְאֶת־נָוֵהוּ (“hilo pamoja na makao yake”)
  choice: Katika matini kuu, “hilo” linarejelea sanduku, na “makao yake” ni mahali linapokaa.
  alternative: Maneno hayo yanaweza kueleweka yakimrejelea Mungu na makao yake.
  rationale: Sanduku la Mungu ndilo rejeleo la karibu zaidi la kiwakilishi, lakini sanduku pia linawakilisha uwepo wa Mungu. Matini kuu inafuata rejeleo la karibu, huku tanbihi ikihifadhi usomaji unaomlenga Mungu bila kuondoa mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “machoni pa Yahwe” umehifadhiwa kwa uwazi kwa Kiebrania, na “makao” yametumiwa bila kutaja hekalu kwa namna inayopita ushahidi wa kipindi hiki.
