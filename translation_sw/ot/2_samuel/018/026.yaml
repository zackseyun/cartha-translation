  yaml_path: translation/ot/2_samuel/018/026.yaml
  text: Then the watchman saw another man running[a], and the watchman called to the gatekeeper and said, “Look, a man is running by himself.” And the king said, “He also brings news.”
translation:
  language: sw
  text: Kisha mlinzi akamwona mtu mwingine akikimbia. Mlinzi akamwita mlinzi wa lango, akasema, “Tazama, kuna mtu anakimbia peke yake.” Mfalme akasema, “Huyo pia analeta habari[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huyo pia ni mleta habari”; neno la Kiebrania linaweza kumaanisha mtu anayeleta taarifa, na mara nyingi hutumiwa kuhusu habari njema.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: mlinzi
  rationale: Neno hili humaanisha mtu anayeangalia kwa makini akiwa katika nafasi ya ulinzi. “Mlinzi” ni la kawaida, lenye heshima, na linafaa katika mazingira ya lango la mji.
- source_word: אִישׁ אַחֵר
  choice: mtu mwingine
  rationale: Kirai hiki kinamtambulisha mkimbiaji wa pili, tofauti na yule wa kwanza. “Mtu mwingine” ni tafsiri ya moja kwa moja na ya asili katika Kiswahili.
- source_word: רָץ
  choice: akikimbia / anakimbia
  rationale: Hali ya kushiriki inaonyesha tendo linaloendelea wakati mtu huyo anaonekana; miundo hii ya Kiswahili inahifadhi hali hiyo.
- source_word: הַשֹּׁעֵר
  choice: mlinzi wa lango
  rationale: Katika mazingira ya lango la mji, hiki ni cheo kinachoeleweka wazi zaidi kuliko “mlinzi wa mlango” au istilahi za kizamani.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Chembe hii inavuta fikira za msikilizaji kwa jambo linaloonekana. “Tazama” ina nguvu hiyo na inafaa katika lugha ya simulizi yenye heshima.
- source_word: לְבַדּוֹ
  choice: peke yake
  rationale: Kirai hiki kinaonyesha kwamba mkimbiaji anakuja akiwa mmoja, si pamoja na kundi.
- source_word: גַּם זֶה
  choice: Huyo pia
  rationale: “Huyo” huhifadhi nguvu ya kiashiria cha Kiebrania, huku “pia” ikionyesha kwamba mfalme anamlinganisha na mkimbiaji wa kwanza.
- source_word: מְבַשֵּׂר
  choice: analeta habari
  rationale: Kitenzi hiki kinaweza kumaanisha kuleta au kutangaza habari, mara nyingi habari njema. “Analeta habari” hakilazimishi habari hizo kuwa njema na kinafaa kwa hitimisho la mfalme kutokana na mkimbiaji kuja peke yake.
