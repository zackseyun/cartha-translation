  text: Then David mustered the people who were with him and appointed over them commanders of thousands and commanders of hundreds[a][b].
translation:
  language: sw
  text: Kisha Daudi akafanya ukaguzi[a] wa watu waliokuwa pamoja naye[b], akawaweka juu yao makamanda wa maelfu na makamanda wa mamia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawahesabu” au “akawakusanya”; kitenzi cha Kiebrania kinaweza kumaanisha kufanya ukaguzi wa kijeshi wa kikosi, si kuhesabu tu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “watu”; hapa neno hilo linarejelea kikosi kilichokuwa pamoja na Daudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: akawakusanya
  rationale: Katika muktadha wa kijeshi, kitenzi פקד kina maana ya kuwakusanya na kuwapanga watu kwa ajili ya huduma, si kuwahesabu tu. ‘Akawakusanya’ ni Kiswahili cha kawaida kinacholeta dhana ya mkusanyiko wa kijeshi bila kuongeza maelezo yasiyo katika maandishi.
- source_word: הָעָם
  choice: watu
  rationale: עם humaanisha kihalisi ‘watu.’ Hapa muktadha unaonyesha kuwa ni kikosi cha Daudi, lakini ‘watu’ huhifadhi namna pana ya Kiebrania.
- source_word: אֲשֶׁר אִתּוֹ
  choice: waliokuwa pamoja naye
  rationale: Tafsiri hii huhifadhi uhusiano ulioelezwa moja kwa moja bila kuufanya kuwa kauli mahususi ya mfumo rasmi wa uongozi.
- source_word: וַיָּשֶׂם עֲלֵיהֶם
  choice: akawaweka juu yao
  rationale: שׂים pamoja na עַל ni kuwaweka au kuwateua watu juu ya wengine. ‘Akawaweka juu yao’ huhifadhi taswira na muundo wa chanzo huku ikieleweka kwa Kiswahili.
- source_word: שָׂרֵי
  choice: makamanda
  rationale: Katika muktadha huu wa kijeshi, שׂר ni kiongozi mwenye mamlaka; ‘makamanda’ ni neno la sasa na lililo wazi.
- source_word: אֲלָפִים
  choice: maelfu
  rationale: Ingawa אֶלֶף wakati mwingine inaweza kumaanisha kitengo cha kijamii au kijeshi badala ya idadi kamili, katika jozi hii ya kawaida ya kijeshi tafsiri ya namba huhifadhi vizuri muundo wa Kiebrania.
- source_word: מֵאוֹת
  choice: mamia
  rationale: Ni sehemu ya jozi ya kiutawala ya kijeshi pamoja na ‘maelfu’; neno la namba huhifadhi muundo na maana ya chanzo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inafuata kwa karibu mlolongo wa Kiebrania, huku ‘makamanda’ ikiweka wazi mazingira ya kijeshi. Alama zote za tanbihi zimewekwa katika matini kuu.
