  text: Then ten young men, Joab’s armor-bearers, surrounded Absalom and struck him and killed him.
translation:
  language: sw
  text: Kisha vijana kumi waliobeba silaha za Yoabu wakamzunguka Absalomu, wakampiga na kumuua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: wakamzunguka
  rationale: Kitenzi סבב katika muktadha huu wa mapigano kinaonyesha kumwendea mtu pande zote na kumzingira; “wakamzunguka” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: עֲשָׂרָה נְעָרִים
  choice: vijana kumi
  rationale: נְעָרִים hapa ni vijana wanaohudumu kama wapiganaji walio chini ya Yoabu, si watoto; “vijana” inadumisha maana hiyo bila kuongeza cheo kisichotajwa.
- source_word: נֹשְׂאֵי כְּלֵי יוֹאָב
  choice: waliobeba silaha za Yoabu
  rationale: Kirai hiki kihalisi kinawataja wabebaji wa vyombo au silaha za Yoabu. Tafsiri hii ni wazi katika Kiswahili na haibani maana kwenye cheo maalumu cha mbeba-ngao mmoja.
- source_word: וַיַּכּוּ
  choice: wakampiga
  rationale: נכה ni kitenzi kipana chenye maana ya kupiga au kushambulia kwa mapigo; “wakampiga” kinahifadhi tendo la kimwili bila lugha ya kizamani.
- source_word: וַיְמִיתֻהוּ
  choice: na kumuua
  rationale: Muundo wa Hifili wa מות unamaanisha kusababisha afe, yaani kuua; “kumuua” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אַבְשָׁלוֹם
  choice: Absalomu
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika matumizi ya Biblia ya Kiswahili.
