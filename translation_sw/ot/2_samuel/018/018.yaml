base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/018.yaml
  text: Absalom had taken and set up for himself in his lifetime the pillar that is in the Valley of the King[a], for he said, “I have no son to keep my name in remembrance.” So he called the pillar by his own name, and it is called Absalom’s Monument to this day.
translation:
  language: sw
  text: Absalomu alikuwa amechukua na kujisimamishia nguzo katika siku za uhai wake. Nguzo hiyo iko katika Bonde la Mfalme, kwa maana alisema, “Sina mwana wa kufanya jina langu likumbukwe.” Basi akaiita nguzo hiyo kwa jina lake mwenyewe, nayo huitwa Mkono wa Absalomu[a] mpaka leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “Mkono wa Absalomu.” Hapa “mkono” ni usemi wa kinahau unaomaanisha alama au mnara wa ukumbusho.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַח וַיַּצֶּב לוֹ
  choice: alikuwa amechukua na kujisimamishia
  rationale: Kauli ya wakati uliopita inawasilisha tendo lililotangulia simulizi kuu, huku ‘kujisimamishia’ ikihifadhi maana ya kusimamisha nguzo kwa ajili yake mwenyewe.
- source_word: בְחַיּו
  choice: katika siku za uhai wake
  rationale: Ni usemi wa kawaida na wenye heshima unaomaanisha kwamba alifanya hivyo akiwa bado hai.
- source_word: מַצֶּבֶת
  choice: nguzo
  rationale: Neno hilo linamaanisha jiwe lililosimamishwa au nguzo; ‘nguzo’ inahifadhi taswira halisi badala ya kuifanya moja kwa moja kuwa ‘mnara wa ukumbusho.’
- source_word: בְּעֵמֶק הַמֶּלֶךְ
  choice: katika Bonde la Mfalme
  rationale: Tafsiri ya karibu na muundo wa Kiebrania, huku herufi kubwa zikionyesha jina la mahali.
- source_word: בַּעֲבוּר הַזְכִּיר שְׁמִי
  choice: wa kufanya jina langu likumbukwe
  rationale: Inadhihirisha kusudi la kuendeleza kumbukumbu ya jina lake bila kuongeza wazo lisilotajwa wazi.
- source_word: וַיִּקְרָא לַמַּצֶּבֶת עַל שְׁמוֹ
  choice: akaiita nguzo hiyo kwa jina lake mwenyewe
  rationale: Inawasilisha nahau ya kukipa kitu jina la mtu mwenyewe kwa Kiswahili cha kawaida.
- source_word: וַיִּקָּרֵא לָהּ
  choice: nayo huitwa
  rationale: Hali ya kutendwa pamoja na ‘mpaka leo’ inaonyesha jina lililoendelea kutumiwa.
- source_word: יַד אַבְשָׁלוֹם
  choice: Mkono wa Absalomu
  rationale: Maandishi makuu yanahifadhi taswira halisi na isiyo ya kawaida ya Kiebrania; tanbihi inaeleza matumizi yake ya kinahau kama alama au mnara wa ukumbusho.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kuendelea kwa jina hilo hadi wakati wa mwandishi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya simulizi la Biblia. Sentensi ya kwanza imegawanywa ili kuepuka muundo mzito bila kupoteza uhusiano wa nguzo na Bonde la Mfalme. Alama ya tanbihi imewekwa baada ya ‘Mkono wa Absalomu,’ mahali inapohusika moja kwa moja.
