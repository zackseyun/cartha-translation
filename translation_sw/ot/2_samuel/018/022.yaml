base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/022.yaml
  text: Then Ahimaaz son of Zadok said again to Joab[a], “Whatever happens, please let me also run after the Cushite.” But Joab said, “Why would you run, my son[b], since you have no message that will bring reward?”
translation:
  language: sw
  text: Kisha Ahimaasi mwana wa Sadoki akamwambia Yoabu tena, “Hata iweje,[a] tafadhali niruhusu nami nikimbie nyuma ya Mkushi.” Lakini Yoabu akasema, “Kwa nini ukimbie, mwanangu, ilhali huna habari itakayokuletea faida?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lolote litakalotokea.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania cha kishazi hiki ni kigumu; huenda maana yake ni “huna habari zitakazopokewa vizuri” au “hutapata thawabu kwa habari hizo.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  choice: akamwambia ... tena
  rationale: Nahau hii inaonyesha kwamba Ahimaasi alirudia ombi lake. Muundo huu ni wa kawaida katika Kiswahili na unahifadhi mwendelezo wa mazungumzo.
- source_word: וִיהִי מָה
  choice: Hata iweje
  rationale: Hii ni nahau inayoonyesha kuwa msemaji yuko tayari kuendelea bila kujali yatakayotokea. “Hata iweje” ni ya sasa, wazi, na ya asili katika Kiswahili.
- source_word: אָרֻצָה נָּא
  choice: tafadhali niruhusu ... nikimbie
  rationale: Kitenzi cha kusudio pamoja na נָא kinaonyesha ombi la dhati lakini lenye adabu; “niruhusu ... nikimbie” huwasilisha maana hiyo kwa kawaida.
- source_word: גַם אֲנִי
  choice: nami
  rationale: “Nami” huonyesha kwa ufupi na kwa kawaida kwamba Ahimaasi alitaka kuwa mkimbiaji wa ziada.
- source_word: הַכּוּשִׁי
  choice: Mkushi
  rationale: “Mkushi” ni tafsiri ya moja kwa moja ya jina la asili au kabila la Kushi, bila kulihusisha moja kwa moja na mipaka ya nchi ya kisasa.
- source_word: לָמָּה זֶּה אַתָּה רָץ
  choice: Kwa nini ukimbie
  rationale: Muundo huu unaonyesha pingamizi la Yoabu kwa njia ya kawaida katika Kiswahili, huku wazo la “kwa nini jambo hili” likibaki ndani ya swali.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Hili ni neno la kumwita mtu kwa ukaribu au kwa mamlaka ya kiutu, si lazima liwe dai la uhusiano wa damu.
- source_word: אֵין בְּשׂוֹרָה מֹצֵאת
  choice: huna habari itakayokuletea faida
  rationale: Kiebrania cha kishazi hiki ni kifupi na kigumu. Tafsiri hii inahifadhi uwezekano kwamba habari hizo hazingemletea mjumbe matokeo mazuri au thawabu.
