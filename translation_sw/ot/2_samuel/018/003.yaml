base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/003.yaml
  text: But the people said[a], “You must not go out, for if we flee, they will not pay attention to us; and if half of us die, they will not pay attention to us. For you are worth ten thousand of us[c][b]; so now it is better that you be ready to help us from the city.”
translation:
  language: sw
  text: Lakini watu wakasema, “Wewe usitoke, kwa maana tukikimbia, hawatatujali[a]; na nusu yetu ikifa, hawatatujali. Kwa maana wewe una thamani ya watu wetu elfu kumi[b]. Kwa hiyo sasa ni afadhali utusaidie ukiwa mjini[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “hawataweka moyo wao kwetu,” yaani hawatatuelekezea fikira zao au kutuona kuwa shabaha yao kuu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa maana sasa [wewe ni] kama elfu kumi wetu.” Muundo wa Kiebrania ni mgumu, lakini katika muktadha unamaanisha kwamba Daudi ana thamani sawa na watu elfu kumi wa jeshi.
    reason: lexical_alternative
  - marker: c
    text: Huenda maana yake ni kwamba Daudi abaki mjini ili aweze kutoa msaada au vikosi vya ziada vikihitajika.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תֵצֵא
  choice: Wewe usitoke pamoja nasi
  rationale: Kikanushi pamoja na kitenzi kisichokamilifu kinatoa katazo au onyo lenye nguvu. Kiwakilishi “wewe” kinasisitiza kwamba Daudi ndiye asiyetakiwa kwenda vitani; “pamoja nasi” kinaeleweka kutokana na muktadha wa kutoka kwenda vitani.
- source_word: כִּי אִם נֹס נָנוּס
  choice: kwa maana tukikimbia
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi chenyewe unasisitiza tendo la kukimbia, lakini Kiswahili cha kawaida huwasilisha sharti hilo kwa urahisi kama “tukikimbia.”
- source_word: לֹא יָשִׂימוּ אֵלֵינוּ לֵב
  choice: hawatatujali
  rationale: Nahau hiyo, kihalisi ‘hawataweka moyo kwa/kwetu,’ hapa inamaanisha kwamba adui hatawaona wanajeshi hao kuwa shabaha yake kuu.
- source_word: וְאִם יָמֻתוּ חֶצְיֵנוּ
  choice: na hata nusu yetu ikifa
  rationale: Kitenzi cha Kiebrania ni ‘kufa,’ si moja kwa moja ‘kuuawa.’ “Hata” linaonyesha uzito wa hali ya kudhaniwa bila kuibadili maana.
- source_word: כִּי עַתָּה כָמֹנוּ עֲשָׂרָה אֲלָפִים
  choice: Kwa maana wewe una thamani ya watu elfu kumi miongoni mwetu
  rationale: Hii inawasilisha hoja ya watu kwamba maisha na uongozi wa Daudi yana uzito sawa na wa wanajeshi elfu kumi. Tofauti ya maandishi na ugumu wa Kiebrania cha Kimasora vinaelezwa katika tanbihi.
- source_word: וְעַתָּה טוֹב
  choice: Kwa hiyo, sasa ni afadhali
  rationale: טוֹב hapa huonyesha hatua inayopendelewa, hivyo “ni afadhali” ni Kiswahili cha kawaida kuliko tafsiri ya moja kwa moja ‘ni vizuri.’
- source_word: מֵעִיר לְעָזִיר
  choice: utusaidie kutoka mjini
  rationale: מן huonyesha mahali msaada utakapotoka, na לעזיר inahusiana na mzizi עזר, ‘kusaidia.’ Tafsiri haibainishi bila msingi aina hususa ya msaada huo.
theological_decisions:
- issue: Thamani ya Daudi ikilinganishwa na watu elfu kumi
  choice: wewe una thamani ya watu elfu kumi miongoni mwetu
  alternative: sasa kuna watu elfu kumi kama sisi
  rationale: Maana inayolingana na muktadha na ushahidi wa matoleo ya kale ni kwamba Daudi ana thamani kubwa kwa jeshi. Tanbihi inadumisha uwazi kuhusu ugumu wa maandishi ya Kimasora badala ya kuuficha.
- issue: Namna Daudi angeweza kusaidia akiwa mjini
  choice: utusaidie kutoka mjini
  alternative: ubaki mjini tayari kutuletea msaada wa ziada
  rationale: Kifungu cha Kiebrania hakitaji wazi kubaki, kuwa tayari, wala kuleta vikosi vya ziada. Tafsiri kuu inabaki pana, huku tanbihi ikieleza maana inayowezekana katika muktadha wa kijeshi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya heshima, ya kawaida na inayoeleweka. Muundo wa moja kwa moja wa hotuba umehifadhiwa, huku nahau ya Kiebrania ikitafsiriwa kwa maana yake na ugumu halisi wa maandishi ukielezwa katika tanbihi.
