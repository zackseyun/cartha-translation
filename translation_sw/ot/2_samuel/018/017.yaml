base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/017.yaml
  text: And they took Absalom and threw him into the great pit in the forest[a], and they set up over him a very large heap of stones. And all Israel fled[b], each man to his tent.
translation:
  language: sw
  text: Wakamchukua Absalomu, wakamtupa katika shimo kubwa msituni, kisha wakaweka juu yake lundo kubwa sana la mawe[a]. Israeli wote wakakimbia, kila mtu hemani kwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “rundo la mawe.”
    reason: lexical_alternative
  - marker: b
    text: “Kila mtu hemani kwake” ni usemi wa kutawanyika, kila mmoja akienda kwenye makao yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Wakamchukua
  rationale: Kitenzi לקח katika mfululizo huu wa masimulizi humaanisha ‘kuchukua’; tafsiri hii haiongezi wazo la kumkamata kwa nguvu ambalo halijaelezwa moja kwa moja.
- source_word: וַיַּשְׁלִיכוּ
  choice: wakamtupa
  rationale: שלך huonyesha kutupa au kuondoa kwa nguvu, na ‘kutupa’ ni Kiswahili cha kawaida kinachodumisha fedheha ya jinsi mwili ulivyotendewa.
- source_word: בַיַּעַר
  choice: msituni
  rationale: יער ni msitu; umbo la mahali ‘msituni’ linaeleza kwa kawaida mazingira ya tukio.
- source_word: אֶל הַפַּחַת הַגָּדוֹל
  choice: katika shimo kubwa
  rationale: פחת humaanisha shimo au bonde lenye kina. ‘Shimo kubwa’ ni wazi na huhifadhi msisitizo wa kivumishi הַגָּדוֹל.
- source_word: וַיַּצִּבוּ עָלָיו
  choice: wakajenga juu yake
  rationale: Katika muktadha wa גל אבנים, נצב katika kausativi ina wazo la kusimamisha au kuweka imara. ‘Wakajenga’ ni usemi wa kawaida kwa kutengeneza lundo la mawe juu ya mwili bila kudokeza jengo rasmi.
- source_word: גַּל אֲבָנִים גָּדוֹל מְאֹד
  choice: lundo kubwa sana la mawe
  rationale: גל ni lundo au rundo, na גָּדוֹל מְאֹד hulisisitiza kuwa kubwa sana. Mpangilio huu ni wa asili katika Kiswahili.
- source_word: וְכָל יִשְׂרָאֵל נָסוּ
  choice: Nao Israeli wote wakakimbia
  rationale: נוס ni kukimbia ili kujiokoa. ‘Israeli wote’ huhifadhi jina la taifa lililotumiwa kama nomino ya pamoja.
- source_word: אִישׁ לְאֹהָלוֹ
  choice: kila mtu akielekea hemani kwake
  rationale: Usemi huu wa kugawa-gawa unaonyesha kwamba kila mmoja alitawanyika kwenda kwenye makao yake. ‘Hemani kwake’ huhifadhi picha halisi ya Kiebrania, huku ‘akielekea’ ikiunganisha kishazi kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya kiidioma ya אִישׁ לְאֹהָלוֹ
  choice: kila mtu akielekea hemani kwake
  alternative: kila mmoja akaenda nyumbani kwake
  rationale: Matini kuu inadumisha picha ya ‘hema’ iliyo katika Kiebrania, lakini tanbihi inaeleza kwamba usemi huo unaweza kumaanisha kutawanyika na kwenda kwenye makao ya kila mmoja.
- issue: Umoja wa kiume katika אִישׁ
  choice: kila mtu
  alternative: kila mmoja
  rationale: ‘Kila mtu’ ni usemi wa kawaida wa Kiswahili unaolingana na umbo la kugawa-gawa la Kiebrania bila kulazimisha dai la kitheolojia kuhusu jinsia ya kundi lote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; masimulizi yana mtiririko wa vitenzi vya ‘waka-’. Lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Absalomu’ na ‘Israeli’ zinafuata maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili.
