  naturalness: The revised text is fluent Standard East African Swahili. “Shimo kubwa msituni” is a natural compact equivalent of “the great pit in the forest,” and “wakaweka juu yake lundo ... la mawe” is idiomatic narrative Swahili.
  terminology: “Absalomu,” “Israeli,” “shimo,” “lundo la mawe,” and “hema” are appropriate established biblical vocabulary. The distributive idiom is retained literally in the text and explained in the footnote.
