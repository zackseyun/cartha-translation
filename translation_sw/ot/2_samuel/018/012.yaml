  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ אֶל יוֹאָ֔ב ו/לא אָנֹכִ֜י שֹׁקֵ֤ל עַל כַּפַּ/י֙ אֶ֣לֶף כֶּ֔סֶף לֹֽא אֶשְׁלַ֥ח יָדִ֖/י אֶל בֶּן הַ/מֶּ֑לֶךְ כִּ֣י בְ/אָזְנֵ֜י/נוּ צִוָּ֣ה הַ/מֶּ֗לֶךְ אֹ֠תְ/ךָ וְ/אֶת אֲבִישַׁ֤י וְ/אֶת אִתַּי֙ לֵ/אמֹ֔ר שִׁמְרוּ מִ֕י בַּ/נַּ֖עַר בְּ/אַבְשָׁלֽוֹם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/012.yaml
  text: But the man said to Joab[a], “Even if I were weighing out a thousand pieces of silver on my palms, I would not put out my hand against the king’s son; for in our hearing the king commanded you and Abishai and Ittai, saying[b], ‘Guard for me the young man Absalom.’”
translation:
  language: sw
  text: Lakini yule mtu akamwambia Yoabu, “Hata kama ningepimiwa vipande elfu vya fedha viganjani mwangu[a], singemwinulia mkono mwana wa mfalme, kwa maana tulimsikia mfalme akiwaamuru wewe, Abishai na Itai akisema, ‘Kwa ajili yangu, mlindeni kijana Absalomu.’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “nikipima fedha elfu viganjani mwangu.” Maneno haya yanarejelea kupokea malipo makubwa yaliyopimwa kwa uzito.'
    reason: lexical_alternative
  - marker: b
    text: Mwisho wa mstari huu katika maandishi ya Kiebrania ni mgumu; kihalisi unasema, “Mlindeni מי kijana, Absalomu.” Wengi huelewa maana yake kutokana na 2 Samweli 18:5 kuwa, “Kwa ajili yangu, mlindeni kijana Absalomu.”
    reason: textual_variant
lexical_decisions:
- source_word: שֹׁקֵל עַל כַּפַּי אֶלֶף כֶּסֶף
  choice: ningepimiwa vipande elfu vya fedha viganjani mwangu
  rationale: Kauli hii inadokeza fedha inayopimwa kwa uzito na kuwekwa mikononi kama malipo. Hali ya kutendewa inaonyesha kwamba mtu huyo angepokea malipo, huku ‘viganjani mwangu’ ikihifadhi taswira ya Kiebrania. ‘Vipande vya fedha’ huepuka kutaja shekeli, kwa kuwa jina la kipimo halimo wazi katika maandishi.
- source_word: לֹא אֶשְׁלַח יָדִי אֶל
  choice: singemwinulia mkono
  rationale: Hii ni nahau ya kumshambulia au kumdhuru mtu. Tafsiri hii ni ya kawaida katika Kiswahili, inadumisha taswira ya mkono, na inaonyesha wazi tendo la uhasama.
- source_word: בֶּן הַמֶּלֶךְ
  choice: mwana wa mfalme
  rationale: Muundo huu wa kawaida unahifadhi uhusiano wa kifalme ambao ni msingi wa hoja ya msemaji.
- source_word: בְאָזְנֵינוּ
  choice: tulimsikia
  rationale: Nahau ya Kiebrania, kihalisi ‘masikioni mwetu,’ ina maana kwamba waliohudhuria waliisikia amri moja kwa moja. Kiswahili hiki ni cha asili na kinahifadhi maana hiyo.
- source_word: צִוָּה
  choice: akiwaamuru
  rationale: Kitenzi hiki kinaonyesha agizo lenye mamlaka; ‘amuru’ kinafaa kwa mamlaka ya mfalme katika muktadha huu.
- source_word: שִׁמְרוּ
  choice: mlindeni
  rationale: Amri hii inataka Absalomu ahifadhiwe salama. ‘Mlindeni’ inadumisha nguvu ya hali ya kuamuru na inafaa katika mazingira ya kijeshi.
- source_word: מִי בַּנַּעַר בְּאַבְשָׁלוֹם
  choice: Kwa ajili yangu, mlindeni kijana Absalomu
  rationale: Maandishi ya Kimasoreti yana neno gumu מִי. Kwa kuzingatia agizo sambamba katika 2 Samweli 18:5, maana inayowezekana zaidi ni ombi la kumlinda Absalomu kwa ajili ya mfalme. Ugumu wa maandishi umehifadhiwa katika tanbihi badala ya kufichwa.
- source_word: הָאִישׁ
  choice: yule mtu
  rationale: Kibainishi cha Kiebrania kinamrejelea mtu maalumu ambaye tayari ametajwa katika simulizi; ‘yule mtu’ linaonyesha rejeo hilo kwa kawaida katika Kiswahili.
- source_word: וְלֹא אָנֹכִי
  choice: Hata kama ... singe-
  rationale: Muundo huu unasisitiza kukataa kwa msemaji. Kiswahili kinaonyesha msisitizo huo kwa kishazi cha kukubali hali ya kudhaniwa ‘Hata kama’ pamoja na ‘singe-’.
theological_decisions:
- issue: Maana ya kifungu kigumu מִי בַּנַּעַר בְּאַבְשָׁלוֹם
  choice: Kwa ajili yangu, mlindeni kijana Absalomu
  alternative: Mlindeni kijana Absalomu / ni nani aliye pamoja na kijana Absalomu?
  rationale: Muktadha wa karibu, hasa 2 Samweli 18:5, unaunga mkono maana ya kwamba mfalme alitaka Absalomu alindwe kwa ajili yake. Kwa kuwa maandishi ya Kimasoreti ni magumu, tanbihi inataja hali hiyo bila kudai uhakika usiokuwapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Majina yametolewa kama Yoabu, Abishai, Itai na Absalomu. Taswira ya fedha kupimwa viganjani na ya kuinua mkono dhidi ya mtu imehifadhiwa bila kufanya sentensi kuwa ngumu.
