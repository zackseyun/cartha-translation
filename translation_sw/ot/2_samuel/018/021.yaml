base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/021.yaml
  text: Then Joab said to the Cushite[a], “Go, tell the king what you have seen.” And the Cushite bowed down to Joab and ran.
translation:
  language: sw
  text: Kisha Yoabu akamwambia Mkushi[a], “Nenda ukamwambie mfalme yale uliyoyaona.” Naye Mkushi akamsujudia Yoabu, kisha akakimbia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kushi,” ikiwa hili ni jina la mtu; kwa mapokeo, “Mwethiopia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוּשִׁי
  choice: Mkushi
  rationale: Nomino ya Kiswahili inayomtaja mtu kutoka Kushi; inaakisi kwa uwazi zaidi jina la asili au kabila kuliko tafsiri ya jadi ‘Mwethiopia,’ huku uwezekano wa kuwa jina la mtu ukielezwa katika tanbihi.
- source_word: לֵךְ הַגֵּד
  choice: Nenda ukamwambie
  rationale: 'Muundo huu wa kawaida wa Kiswahili unahifadhi amri mbili zinazohusiana: kwenda na kumpa mfalme taarifa.'
- source_word: אֲשֶׁר רָאִיתָה
  choice: yale uliyoyaona
  rationale: Hutoa maana ya jambo ambalo mjumbe mwenyewe alilishuhudia bila kuongeza maelezo yasiyokuwamo katika Kiebrania.
- source_word: וַיִּשְׁתַּחוּ
  choice: akamsujudia
  rationale: Katika muktadha wa heshima kwa Yoabu, ‘kusujudia’ huonyesha kuinama chini mbele ya mtu bila kudokeza ibada ya kidini.
- source_word: וַיָּרֹץ
  choice: akakimbia
  rationale: Ni maana ya moja kwa moja ya kitenzi רוץ na inadumisha mwendo wa haraka wa simulizi.
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: ‘Kisha’ huonyesha kuendelea kwa mfululizo wa simulizi, na ‘akamwambia’ ni muundo wa asili wa Kiswahili kwa usemi unaoelekezwa kwa mtu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye heshima. ‘Mkushi’ limetumiwa kama jina la mtu wa Kushi, na tanbihi inadumisha uwezekano wa kulielewa kama jina binafsi pamoja na tafsiri ya mapokeo.
