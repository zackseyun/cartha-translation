  yaml_path: translation/ot/2_samuel/018/025.yaml
  text: Then the watchman called out and told the king. And the king said[a], “If he is by himself, there is news in his mouth.” And he kept coming nearer and nearer.
translation:
  language: sw
  text: Kisha mlinzi akapaza sauti na kumjulisha mfalme. Mfalme akasema, “Ikiwa yuko peke yake, ana habari kinywani mwake[a].” Naye akaendelea kukaribia zaidi na zaidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ana habari njema kinywani mwake.” Nomino ya Kiebrania inaweza kumaanisha habari kwa ujumla, ingawa katika muktadha huu yaelekea inadokeza habari njema.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: mlinzi
  rationale: Neno hili humaanisha mtu aliyewekwa mahali ili kutazama na kutoa taarifa; “mlinzi” ni la kawaida na linafaa katika muktadha wa lango la mji.
- source_word: וַיִּקְרָא
  choice: akapaza sauti
  rationale: Katika muktadha huu kitenzi kinaonyesha kuita kwa sauti ili tangazo lisikike, si kumwita mtu tu.
- source_word: וַיַּגֵּד לַמֶּלֶךְ
  choice: kumjulisha mfalme
  rationale: Hifili ya נגד ina maana ya kumwambia au kumpa mtu taarifa; “kumjulisha” ni ya asili katika Kiswahili na huhifadhi dhana ya kutoa taarifa.
- source_word: אִם לְבַדּוֹ
  choice: Ikiwa yuko peke yake
  rationale: Hutaja hali ya mkimbiaji kuwa yeye tu; hakuna haja ya kuongeza kitenzi cha kuja ambacho hakipo wazi katika kishazi hiki.
- source_word: בְּשׂוֹרָה
  choice: habari njema
  rationale: Nomino inaweza kumaanisha habari kwa ujumla, lakini mara nyingi huhusu taarifa njema; katika muktadha huu mfalme anahitimisha kuwa mkimbiaji mmoja ana ujumbe mzuri.
- source_word: בְּפִיו
  choice: ana
  rationale: Nahau ya Kiebrania ni “kinywani mwake,” yaani ana ujumbe wa kutoa. Kiswahili cha asili huwasilisha maana hiyo kwa “ana habari,” huku tanbihi ikihifadhi tofauti ya kimuundo inapofaa.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְקָרֵב
  choice: akaendelea kukaribia zaidi na zaidi
  rationale: Muundo huu huonyesha tendo linaloendelea na umbali unaopungua hatua kwa hatua.
