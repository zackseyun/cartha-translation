translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. “Akapaza sauti” huonyesha tangazo la mlinzi, na “akaendelea kukaribia zaidi na zaidi” huwasilisha mwendo unaoendelea bila kuwa wa kifasihi kupita kiasi.
