base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/005.yaml
  text: And the king commanded Joab and Abishai and Ittai[a], saying, “Deal gently for my sake with the young man Absalom.” And all the people heard when the king commanded all the commanders concerning Absalom.
translation:
  language: sw
  text: Mfalme akawaamuru Yoabu, Abishai na Itai, akisema, “Kwa ajili yangu, mtendeeni kwa upole yule kijana Absalomu.” Watu wote wakasikia mfalme alipowaamuru makamanda wote kuhusu Absalomu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Mfalme akawaamuru
  rationale: Kitenzi צוה kina nguvu ya kutoa amri; muundo wenye kiambishi cha yambwa ni wa kawaida katika simulizi la Kiswahili.
- source_word: אֶת יוֹאָב וְאֶת אֲבִישַׁי וְאֶת אִתַּי
  choice: Yoabu, Abishai na Itai
  rationale: Majina yamenukuliwa kwa maumbo yanayotambulika katika Kiswahili; kurudiwa kwa alama ya yambwa ya Kiebrania hakuhitaji kuonyeshwa.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huu ni muundo wa kunukuu unaoanzisha usemi wa moja kwa moja; ‘akisema’ huhifadhi mtindo wa simulizi bila kuwa mgumu.
- source_word: לְאַט
  choice: mtendeeni kwa upole
  rationale: Neno hili linaonyesha upole au kujizuia katika namna ya kumshughulikia mtu, jambo linalofaa muktadha wa kijeshi.
- source_word: לִי
  choice: Kwa ajili yangu
  rationale: Huonyesha ombi la Daudi lenye uzito wa kibinafsi, si tu faida yake kwa maana finyu.
- source_word: לַנַּעַר
  choice: yule kijana
  rationale: נַעַר inaweza kumaanisha mvulana, kijana, au mwanamume kijana. ‘Kijana’ hudumisha sauti ya baba kwa Absalomu mtu mzima bila kumfanya aonekane mtoto.
- source_word: לְאַבְשָׁלוֹם
  choice: Absalomu
  rationale: Lamed ya pili inaeleweka kwa kawaida kama utambulisho wa ‘yule kijana,’ yaani Absalomu; Kiswahili hakihitaji kurudia kihusishi.
- source_word: וְכָל הָעָם שָׁמְעוּ
  choice: Watu wote wakasikia
  rationale: הָעָם ni ‘watu’; ingawa muktadha ni wa kijeshi, tafsiri hii hudumisha msisitizo wa kwamba amri ilisikika hadharani.
- source_word: בְּצַוֹּת הַמֶּלֶךְ
  choice: mfalme alipokuwa akiwaamuru
  rationale: Infinitivo yenye ב inaonyesha tendo lililokuwa likitokea wakati huo; muundo huu wa Kiswahili unaonyesha usawakati huo wazi.
- source_word: כָּל הַשָּׂרִים
  choice: makamanda wote
  rationale: Katika muktadha wa kijeshi שָׂרִים ni viongozi wa majeshi; ‘makamanda’ ni sahihi kuliko ‘maofisa’ au ‘wakuu’ kwa ujumla.
- source_word: עַל דְּבַר אַבְשָׁלוֹם
  choice: kuhusu Absalomu
  rationale: Kirai hiki humaanisha ‘kuhusu’ au ‘kwa habari ya’; ‘kuhusu’ ni cha asili na wazi katika Kiswahili cha sasa.
