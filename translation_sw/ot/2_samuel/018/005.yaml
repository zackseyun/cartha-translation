  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa urahisi. Usemi mfupi wa Kiebrania umehifadhiwa kwa mpangilio wa asili wa Kiswahili bila kuondoa ombi la kibinafsi la mfalme.
