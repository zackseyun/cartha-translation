base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/027.yaml
  text: Then the watchman said[a], “I see the running of the first one is like the running of Ahimaaz the son of Zadok.” And the king said, “He is a good man[b], and he comes with good news.”
translation:
  language: sw
  text: Ndipo mlinzi akasema, “Naona jinsi yule wa kwanza anavyokimbia ni kama jinsi Ahimaasi mwana wa Sadoki anavyokimbia[a].” Mfalme akasema, “Huyo ni mtu mwema, naye anakuja na habari njema[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwendo wa yule wa kwanza ni kama mwendo wa Ahimaasi mwana wa Sadoki.”
    reason: lexical_alternative
  - marker: b
    text: Au, “naye atakuja na habari njema”; kitenzi cha Kiebrania kinaweza kueleweka kuwa cha wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: mlinzi
  rationale: Neno hili la kishirikishi humaanisha mtu anayekaa macho kuangalia kinachoendelea. “Mlinzi” ni la kawaida na linafaa katika mazingira haya ya simulizi.
- source_word: מְרוּצַת הָרִאשׁוֹן
  choice: mwendo wa yule wa kwanza
  rationale: Tafsiri hii inadumisha nomino ya Kiebrania inayorejelea namna ya kukimbia, badala ya kumtaja tu mkimbiaji, huku ikibaki ya asili katika Kiswahili.
- source_word: כִּמְרֻצַת
  choice: ni kama mwendo wa
  rationale: Kiambishi כִּ kinaonyesha ulinganisho. Kauli hii pia inadumisha urudiaji wa neno linalohusu mwendo kama ulivyo katika Kiebrania.
- source_word: אֲחִימַעַץ בֶּן צָדוֹק
  choice: Ahimaasi mwana wa Sadoki
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili, na “mwana wa” linaonyesha wazi uhusiano unaotajwa na בֶּן.
- source_word: אִישׁ טוֹב זֶה
  choice: Huyo ni mtu mwema
  rationale: Muundo huu wa kawaida wa Kiswahili unahifadhi tathmini chanya ya mfalme kuhusu tabia ya Ahimaasi.
- source_word: וְאֶל בְּשׂוֹרָה טוֹבָה יָבוֹא
  choice: naye anakuja na habari njema
  rationale: “Anakuja na habari njema” huwasilisha kwa Kiswahili cha kawaida maana ya mjumbe anayekaribia akiwa na ujumbe mwema. Hali ya wakati ya kitenzi cha Kiebrania inaweza pia kueleweka kuwa ya wakati ujao, jambo lililowekwa katika tanbihi.
