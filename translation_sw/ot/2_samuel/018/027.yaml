translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa heshima na wa kisasa. Muundo wa nomino “mwendo wa” unahifadhi urudiaji wa Kiebrania, huku tanbihi ikitoa usemi wa kimazungumzo zaidi.
