base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/020.yaml
  text: Joab said to him[a], “You are not a bearer of news today. You may carry news on another day, but today you must not carry news, because the king’s son is dead.”
translation:
  language: sw
  text: Yoabu akamwambia, “Leo wewe si mleta habari[a]. Unaweza kuleta habari siku nyingine, lakini leo usilete habari, kwa sababu mwana wa mfalme amekufa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Leo wewe si mleta habari njema.” Neno la Kiebrania linaweza kumaanisha habari au ujumbe, mara nyingi habari njema; lakini hapa muktadha unahusu kifo cha mwana wa mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בְּשֹׂרָה
  choice: wa kupeleka habari
  rationale: Kirai hiki ni ‘mtu wa habari’ kwa maana halisi. Katika Kiswahili cha kawaida, ‘wa kupeleka habari’ hueleza jukumu la mjumbe kwa ufasaha bila kulazimisha maana ya habari njema; utata wa neno בשׂרה unaelezwa katika tanbihi.
- source_word: וּבִשַּׂרְתָּ
  choice: Unaweza kupeleka habari
  rationale: Katika muktadha huu kauli ya wakati ujao inaonyesha ruhusa au nafasi ya kufanya hivyo siku nyingine, si lazima unabii wa kwamba atafanya hivyo.
- source_word: תְבַשֵּׂר
  choice: usipeleke habari
  rationale: Muundo wenye לֹא katika hotuba ya moja kwa moja una nguvu ya katazo kwa hali ya siku hiyo; ‘usipeleke’ ni amri hasi ya kawaida na iliyo wazi.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya Yoabu kumzuia; ‘kwa sababu’ ni wazi katika Kiswahili cha sasa.
- source_word: בֶּן הַמֶּלֶךְ
  choice: mwana wa mfalme
  rationale: Huhifadhi uhusiano wa kirai cha Kiebrania kwa Kiswahili cha kawaida na chenye heshima.
- source_word: מֵת
  choice: amekufa
  rationale: Hueleza hali iliyotokana na tukio la kifo na inafaa kwa maelezo ya sababu katika muktadha huu.
- source_word: הַיּוֹם הַזֶּה
  choice: leo
  rationale: Ni tafsiri ya kawaida ya Kiswahili inayohifadhi ukaribu wa wakati bila mtindo wa kizamani.
