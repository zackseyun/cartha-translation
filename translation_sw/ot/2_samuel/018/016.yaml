base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/016.yaml
  text: Then Joab blew the trumpet[a], and the people turned back from pursuing Israel[c][b], because Joab restrained the people.
translation:
  language: sw
  text: Ndipo Yoabu akapiga baragumu[a], nao watu wakarudi, wakaacha kuwafuatilia Israeli[b], kwa sababu Yoabu aliwazuia[c] watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pembe.” Neno la Kiebrania shofar linamaanisha pembe ya kutoa ishara, ambayo mara nyingi ilikuwa pembe ya kondoo dume; hapa “baragumu” linafaa katika muktadha wa kijeshi.
    reason: lexical_alternative
  - marker: b
    text: Yaani, vikosi vya Israeli vilivyokuwa upande wa Absalomu.
    reason: cultural_note
  - marker: c
    text: Au, “aliwashikilia nyuma” au “aliwahifadhi.” Kitenzi cha Kiebrania kinaweza kumaanisha kuzuia, kushikilia, kunyima, au kuacha; hapa inaelekea kumaanisha kwamba Yoabu aliwazuia watu wake wasiendelee kuwafuatilia Waisraeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: akapiga
  rationale: Pamoja na שׁוֹפָר, kitenzi תקע humaanisha kupiga au kuvuvia chombo cha kutoa ishara. Katika Kiswahili, ‘kupiga baragumu’ ni usemi wa kawaida na wa wazi.
- source_word: בַּשֹּׁפָר
  choice: baragumu
  rationale: שׁוֹפָר ni pembe iliyotumiwa kutoa ishara. ‘Baragumu’ linaeleza kwa kawaida kazi yake ya kijeshi, huku tanbihi ikihifadhi maana halisi ya pembe.
- source_word: וַיָּשָׁב הָעָם
  choice: watu wakarudi
  rationale: שׁוּב hapa ni kurudi au kugeuka na kuacha mwendo wa kuwafuatilia wengine. ‘Watu’ hudumisha ulinganifu na הָעָם, ingawa katika muktadha hawa ni wapiganaji wa Yoabu.
- source_word: מִרְדֹף
  choice: wakaacha kuifuatilia
  rationale: מִן pamoja na kitenzi-jina huonyesha kukoma kwa tendo. Kiswahili cha kawaida kinaeleza maana hiyo kwa ‘kuacha kuifuatilia.’
- source_word: אַחֲרֵי יִשְׂרָאֵל
  choice: Israeli
  rationale: Maandishi yanataja Israeli kwa jina la pamoja. Tafsiri kuu inalihifadhi jina hilo, na tanbihi inafafanua kuwa hapa ni vikosi vilivyokuwa upande wa Absalomu.
- source_word: כִּי
  choice: kwa sababu
  rationale: כִּי inatoa sababu ya kusitishwa kwa ufuatiliaji; ‘kwa sababu’ ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: חָשַׂךְ
  choice: aliwazuia
  rationale: חשׂך inaweza kumaanisha kuzuia, kushikilia nyuma, au kuacha bila kudhuru. Katika muktadha huu, Yoabu anawazuia watu wake wasiendelee kufuatilia, bila kulazimisha wazo kwamba nia yake ilikuwa huruma.
- source_word: אֶת הָעָם
  choice: watu
  rationale: Kurudia ‘watu’ kunafuata kurudiwa kwa הָעָם katika Kiebrania na hakufichi kwamba neno hilo, katika muktadha huu, linarejelea kikosi cha Yoabu.
