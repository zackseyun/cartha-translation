translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mazungumzo yamewekwa kwa mtindo wa kawaida; ‘Kumbe’ linaonyesha mwitikio wa Yoabu, na maneno yasiyo ya lazima ya kale yameepukwa.
