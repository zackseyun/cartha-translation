base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/011.yaml
  text: Then Joab said to the man who had told him[a], “Look, you saw him[b]; why then did you not strike him there to the ground? And I would have been obliged to give you ten pieces of silver and one belt.”
translation:
  language: sw
  text: Ndipo Yoabu akamwambia yule mtu aliyemletea habari, “Tazama, ulimwona! Kwa nini basi hukumpiga na kumwangusha chini hapo? Nami ningekuwa na wajibu[a] wa kukupa vipande kumi vya fedha[b] na mkanda mmoja.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kwa maana ya karibu, “ingekuwa juu yangu kukupa,” yaani, lingekuwa jukumu langu kukupa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi “kumi za fedha”; kipimo maalumu hakijatajwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּגִּיד לֹו
  choice: aliyemletea habari
  rationale: Kirai hiki kinamtaja mtu aliyempa Yoabu taarifa. ‘Aliyemletea habari’ ni Kiswahili cha kawaida kinachoonyesha taarifa iliyotolewa kabla ya kauli hii.
- source_word: וְהִנֵּה
  choice: Kumbe
  rationale: Katika muktadha huu neno linaanzisha mwitikio mkali wa Yoabu kwa jambo aliloambiwa. ‘Kumbe’ linaonyesha mshangao au msisitizo kwa lugha ya sasa bila kutumia mtindo wa kale.
- source_word: רָאִיתָ
  choice: ulimwona
  rationale: Kiwakilishi cha mtendwa hakijaandikwa wazi katika kitenzi cha Kiebrania, lakini muktadha unamtambulisha kuwa Absalomu; Kiswahili huhitaji mtendwa hapa ili sentensi iwe wazi na ya kawaida.
- source_word: הִכִּיתוֹ שָׁם אָרְצָה
  choice: hukumpiga hapo akaanguka chini
  rationale: Tafsiri hii inadumisha wazo la kumpiga na mwelekeo wa kuelekea chini, bila kulibadilisha moja kwa moja kuwa ‘kumuua,’ ingawa muktadha unaashiria pigo la kuua.
- source_word: וְעָלַי לָתֶת לְךָ
  choice: Nami ningekuwa na wajibu wa kukupa
  rationale: Muundo wa עָלַי pamoja na kitenzi-jina unaonyesha jambo lililokuwa juu ya Yoabu au wajibu wake. Kiswahili hiki ni cha kawaida na kinahifadhi nguvu hiyo ya uwajibikaji.
- source_word: עֲשָׂרָה כֶסֶף
  choice: vipande kumi vya fedha
  rationale: Kiebrania kinasema kihalisi ‘kumi za fedha’ bila kutaja kipimo. ‘Vipande’ hukamilisha usemi kwa Kiswahili bila kudai kwamba zilikuwa shekeli au sarafu.
- source_word: חֲגֹרָה אֶחָת
  choice: mkanda mmoja
  rationale: חֲגֹרָה ni kitu cha kujifunga kiunoni; ‘mkanda’ ni neno wazi na la sasa, na ‘mmoja’ linadumisha tarakimu iliyo katika Kiebrania.
