  text: וַ/יִּקָּרֵא֙ אַבְשָׁל֔וֹם לִ/פְנֵ֖י עַבְדֵ֣י דָוִ֑ד וְ/אַבְשָׁל֞וֹם רֹכֵ֣ב עַל הַ/פֶּ֗רֶד וַ/יָּבֹ֣א הַ/פֶּ֡רֶד תַּ֣חַת שׂוֹבֶךְ֩ הָ/אֵלָ֨ה הַ/גְּדוֹלָ֜ה וַ/יֶּחֱזַ֧ק רֹאשׁ֣/וֹ בָ/אֵלָ֗ה וַ/יֻּתַּן֙ בֵּ֤ין הַ/שָּׁמַ֨יִם֙ וּ/בֵ֣ין הָ/אָ֔רֶץ וְ/הַ/פֶּ֥רֶד אֲשֶׁר תַּחְתָּ֖י/ו עָבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/009.yaml
  text: Absalom happened to come before David’s servants while Absalom was riding on the mule. The mule went under the thick branches of a large terebinth[a], and his head got caught in the terebinth, so that he was left hanging between heaven and earth while the mule that was under him passed on.
translation:
  language: sw
  text: Absalomu akakutana bila kutarajia na watumishi wa Daudi, akiwa amepanda nyumbu. Nyumbu huyo akapita chini ya matawi yaliyosongamana ya mvinje mkubwa[a], na kichwa cha Absalomu kikakwama katika mti huo. Akaachwa akining’inia kati ya mbingu na nchi, huku nyumbu aliyekuwa chini yake akiendelea mbele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwaloni mkubwa.” Neno la Kiebrania אֵלָה linaweza kutumiwa kwa ujumla kumaanisha mti mkubwa, lakini “mvinje” ndilo jina mahususi zaidi hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּרֵא ... לִפְנֵי עַבְדֵי דָוִד
  choice: akakutana bila kutarajia na watumishi wa Daudi
  rationale: Niphal ya קרא katika muktadha huu inaonyesha kukutana kwa nasibu, si kwamba Absalomu alipanga kukutana nao. “Bila kutarajia” huonyesha hali hiyo kwa Kiswahili cha kawaida.
- source_word: עַבְדֵי דָוִד
  choice: watumishi wa Daudi
  rationale: עֲבָדִים hapa ni watu walio chini ya mamlaka ya Daudi, hasa watu wake wa kijeshi. “Watumishi” huhifadhi upana wa neno bila kulazimisha maana ya watumwa.
- source_word: רֹכֵב עַל הַפֶּרֶד
  choice: akiwa amepanda nyumbu
  rationale: Hutoa kwa njia ya kawaida hali ya Absalomu wakati wa tukio, bila kuongeza jinsia wala umri wa mnyama.
- source_word: תַּחַת שׂוֹבֶךְ הָאֵלָה הַגְּדוֹלָה
  choice: chini ya matawi yaliyosongamana ya mvinje mkubwa
  rationale: שׂוֹבֶךְ huonyesha matawi au kichaka kilichofungamana kwa wingi; אֵלָה hutambulishwa kwa usahihi zaidi kama mvinje (terebinth), ingawa jina la mwaloni limetumika pia katika mapokeo ya tafsiri.
- source_word: וַיֶּחֱזַק רֹאשׁוֹ בָאֵלָה
  choice: kichwa cha Absalomu kikakwama katika mti huo
  rationale: Kiebrania kinataja kichwa, si nywele. “Kikakwama” huonyesha kushikwa kwa nguvu na matawi bila kuongeza maelezo yasiyomo katika andiko.
- source_word: וַיֻּתַּן בֵּין הַשָּׁמַיִם וּבֵין הָאָרֶץ
  choice: akaachwa akining’inia kati ya mbingu na nchi
  rationale: Ingawa וַיֻּתַּן kihalisi ni “akawekwa/akatolewa,” hapa inaeleza hali iliyotokea baada ya kukwama. Usemi “kati ya mbingu na nchi” huhifadhi taswira na mtindo wa Kiebrania.
- source_word: עָבָר
  choice: akiendelea mbele
  rationale: Kitenzi kinaonyesha kwamba nyumbu aliendelea na safari baada ya Absalomu kukwama.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wazi na wenye heshima. Tafsiri imehifadhi kwamba kichwa chake ndicho kilichokwama, bila kuingiza mapokeo kwamba nywele zake ndizo zilizonasa.
