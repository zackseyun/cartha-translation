  text: Basi askari[a] wakatoka kwenda uwandani kukutana na Israeli, na vita vilitokea katika msitu wa Efraimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “watu”; hapa neno hilo linarejelea askari wa Daudi, ndiyo maana limetafsiriwa “askari.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: askari
  rationale: Kwa kawaida nomino hii humaanisha “watu,” lakini katika muktadha huu inarejelea kikosi cha Daudi kilichotoka kwenda vitani. “Askari” inaeleza maana hiyo kwa Kiswahili cha kawaida bila kupanua kupita kiasi.
- source_word: הַשָּׂדֶה
  choice: uwandani
  rationale: Neno hili humaanisha eneo la wazi au shamba. Pamoja na kitenzi “wakatoka,” “kwenda uwandani” linaeleza kwa kawaida mwendo kuelekea eneo la mapigano.
- source_word: לִקְרַאת
  choice: kukabiliana na
  rationale: Neno hili lina maana ya kwenda kukutana na mtu; katika muktadha wa vita, kukutana huko ni kwa uhasama. “Kukabiliana na” linafikisha maana hiyo ya kimuktadha.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina la taifa limehifadhiwa kama lilivyo katika Kiebrania. Katika muktadha linarejelea majeshi yaliyokuwa upande wa Absalomu, lakini mstari wenyewe unasema “Israeli.”
- source_word: הַמִּלְחָמָה
  choice: vita
  rationale: Ingawa neno linaweza kumaanisha vita kwa upana, hapa linarejelea pambano mahususi linalosimuliwa.
- source_word: וַתְּהִי
  choice: ikapiganwa
  rationale: Kitenzi cha Kiebrania ni “ikawa/ikatokea,” lakini katika Kiswahili msemo wa kawaida ni “vita ikapiganwa.” Hii inahifadhi tukio bila tafsiri ngumu ya neno kwa neno.
- source_word: בְּיַעַר אֶפְרָיִם
  choice: katika msitu wa Efraimu
  rationale: Tafsiri hii inahifadhi maana ya יַעַר kuwa “msitu” na muundo wa jina la mahali bila kujaribu kutatua maswali ya kijiografia ambayo mstari hauyaelezi.
