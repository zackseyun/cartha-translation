base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/008.yaml
  text: The battle spread there over the face of all the land[a], and the forest devoured more of the people that day than the sword devoured.
translation:
  language: sw
  text: Vita vikaenea huko katika eneo lote[a], na siku hiyo msitu uliwala watu wengi zaidi kuliko upanga ulivyowala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Vita vilitawanyika huko katika eneo lote.” Neno la Kiebrania linaweza kusisitiza kutawanyika kwa mapigano katika sehemu mbalimbali za eneo hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נפצית
  choice: vikaenea
  rationale: Kauli ya kutendwa ya mzizi פוץ inaonyesha kutawanyika au kuenea; katika muktadha huu, “vikaenea” ni Kiswahili cha kawaida kinachoonyesha vita kufikia sehemu mbalimbali.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: katika eneo lote
  rationale: Kirai hiki kinaonyesha upana wa kijiografia wa mapigano. “Eneo lote” ni cha asili katika Kiswahili na huepuka kueleweka kana kwamba מדובר kuhusu dunia nzima.
- source_word: היער
  choice: msitu
  rationale: יַעַר humaanisha eneo lenye miti au msitu; “msitu” ni neno la kawaida na lenye taswira wazi katika simulizi hili.
- source_word: וירב ... לֶאֱכֹל
  choice: ukateketeza ... wengi zaidi
  rationale: Muundo wenye רבה, kitenzi-jina לֶאֱכֹל, na ulinganisho מֵאֲשֶׁר unaonyesha kwamba msitu ulisababisha vifo vingi kuliko upanga. “Wengi zaidi” huhifadhi nguvu ya ulinganisho.
- source_word: לֶאֱכֹל ... אכלה
  choice: ukateketeza ... ulivyoteketeza
  rationale: Kitenzi “kula” kimetumiwa kisitiari kwa kuangamiza au kusababisha vifo. “Teketeza” huhifadhi uhuishaji wa msitu na upanga pamoja na urudiaji wa kitenzi bila kutoa Kiswahili kisicho cha kawaida.
- source_word: בעם
  choice: watu
  rationale: Katika muundo huu neno linaelekeza kwa watu waliopoteza maisha; “watu” hutoa maana hiyo kwa uwazi na kwa lugha ya kawaida.
- source_word: ביום ההוא
  choice: siku hiyo
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha wakati katika simulizi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Tafsiri inahifadhi uhuishaji wa “msitu” na “upanga,” huku “eneo lote” ikibainisha kwamba הָאָרֶץ hapa ni eneo la mapigano, si dunia nzima.
