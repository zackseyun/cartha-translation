translation:
  language: sw
  text: Au kama ningefanya hila dhidi ya uhai wake—na hakuna jambo lolote linaloweza kufichwa kwa mfalme—wewe mwenyewe ungesimama mbali nami.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשִׂיתִי בְנַפְשׁוֹ שֶׁקֶר
  choice: ningetenda kwa hila dhidi ya uhai wake
  rationale: Kirai hiki kwa karibu ni ‘ningetenda uongo dhidi ya uhai wake’; ‘kutenda kwa hila dhidi ya uhai wake’ hudumisha wazo la kutokuwa mwaminifu kwa kumdhuru au kumuua Absalomu bila kulazimisha maana kuwa kitendo kimoja tu.
- source_word: וְכָל־דָּבָר לֹא־יִכָּחֵד מִן־הַמֶּלֶךְ
  choice: na hakuna jambo lolote linaloweza kufichwa kwa mfalme
  rationale: Hutoa kwa njia ya asili maana kwamba hakuna jambo ambalo lingebaki limefichwa kutoka kwa mfalme; kauli ya jumla imehifadhiwa.
- source_word: תִּתְיַצֵּב מִנֶּגֶד
  choice: ungesimama kando
  rationale: Kitenzi pamoja na kihusishi kinaonyesha kusimama mbali au kutomsaidia mtu; ‘kusimama kando’ ni Kiswahili cha kawaida na huhifadhi lawama kwamba Yoabu angemwacha askari huyo akabiliane peke yake na matokeo.
theological_decisions:
- issue: Ikiwa ‘dhidi ya uhai wake’ inamaanisha moja kwa moja kumuua Absalomu
  choice: Imeachwa kama ‘kutenda kwa hila dhidi ya uhai wake’.
  alternative: ‘kumuua kwa hila’ au ‘kuhatarisha uhai wake’
  rationale: Kiebrania kinahusisha uhai wa Absalomu lakini hakitaji moja kwa moja kitenzi ‘kuua’; tafsiri haipaswi kuondoa upana huo wa maana.
- issue: Uhusiano wa kisharti wa sentensi
  choice: ‘Au kama ningetenda ... wewe mwenyewe ungesimama kando.’
  alternative: Kutafsiri kifungu cha kwanza kama swali la balagha au kuongeza ‘basi’.
  rationale: Muktadha unaonyesha hali ya kudhaniwa na matokeo yake; muundo wa Kiswahili unaweka wazi uhusiano huo bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mstari umeundwa kwa lugha inayoeleweka kwa wasomaji wa kawaida huku ukihifadhi ukali wa hoja ya askari na kutodhamiria zaidi ya Kiebrania.
