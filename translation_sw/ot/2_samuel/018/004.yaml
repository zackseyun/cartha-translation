base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/004.yaml
  text: The king said to them[a], “What seems good in your eyes, I will do.” So the king stood beside the gate[c][b], and all the people went out by hundreds and by thousands.
translation:
  language: sw
  text: Mfalme akawaambia, “Nitatenda lolote mnaloona kuwa jema.[a]” Basi mfalme akasimama kando ya lango,[b] na watu wote wakatoka, wakiwa wamepangwa kwa mamia na maelfu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “lililo jema machoni penu.” Maana yake ni jambo wanaloliona kuwa bora.
    reason: lexical_alternative
  - marker: b
    text: Au “karibu na lango.” Kwa maneno halisi, Kiebrania husema, “kwenye mkono wa lango,” yaani mahali kando yake.
    reason: lexical_alternative
  - marker: c
    text: Yaani, wakiwa wamepangwa katika makundi ya kijeshi.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר יִיטַב בְּעֵינֵיכֶם
  choice: lolote mnaloona kuwa jema
  rationale: Nahau ya Kiebrania yenye maana ya jambo wanaloliona au kulihukumu kuwa jema. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha wazo la tathmini yao.
- source_word: אֶעֱשֶׂה
  choice: Nitatenda
  rationale: Inawakilisha kwa uwazi kitenzi עשה katika wakati ujao, bila kuongeza maelezo yasiyokuwamo katika chanzo.
- source_word: אֶל יַד הַשַּׁעַר
  choice: kando ya lango
  rationale: Kirai hicho, ambacho kwa neno moja moja ni ‘kwenye mkono wa lango,’ ni nahau ya mahali karibu au pembeni mwa lango.
- source_word: וְכָל הָעָם
  choice: watu wote
  rationale: Huhifadhi neno la jumla הָעָם badala ya kulibadili kuwa ‘jeshi’ au ‘askari,’ ingawa muktadha ni wa kijeshi.
- source_word: יָצְאוּ
  choice: wakatoka
  rationale: Ni tafsiri ya moja kwa moja ya יצא; maana ya kijeshi inatolewa na muktadha na mpangilio unaofuata.
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: kwa vikosi vya mamia na maelfu
  rationale: Kirai kinaonyesha watu waliopangwa katika makundi ya kijeshi ya mamia na maelfu. ‘Vikosi’ huifanya maana hiyo ieleweke kwa msomaji wa sasa, huku idadi za chanzo zikihifadhiwa.
