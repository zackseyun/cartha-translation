translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio wa sentensi unafuata mtiririko wa Kiebrania, huku nahau na muundo wa kijeshi vikielezwa kwa Kiswahili cha kawaida.
