base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/032.yaml
  text: Then the king said to the Cushite[a], “Is it well with the young man Absalom?” And the Cushite said, “May the enemies of my lord the king, and all who rise up against you for evil[b], be like that young man.”
translation:
  language: sw
  text: Mfalme akamwambia Mkushi[a], “Je, kijana Absalomu yuko salama[b]?” Mkushi akasema, “Na maadui wa bwana wangu mfalme, pamoja na wote wanaokuinukia kwa nia mbaya, wawe kama huyo kijana.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mkushi ni mtu kutoka Kushi.
    reason: geographic_note
  - marker: b
    text: Au, “Je, hali ya kijana Absalomu ni njema?” Kiebrania kinauliza kuhusu ‘amani/hali njema’ yake (shalom), maana pana kuliko kuendelea kuwa hai tu.
    reason: lexical_alternative
  - marker: c
    text: Mkushi anajibu kwa njia isiyo ya moja kwa moja. Maneno yake yanadokeza kwamba Absalomu amepatwa na hatima inayowafaa maadui wa mfalme, badala ya kutaja kifo chake waziwazi.
    reason: cultural_note
lexical_decisions:
- source_word: הַכּוּשִׁי
  choice: Mkushi
  rationale: Ni jina la mtu kutoka Kushi. ‘Mkushi’ linahifadhi utambulisho wa kijiografia wa Kiebrania bila kutumia jina la kisasa lenye maana finyu zaidi.
- source_word: הֲשָׁלוֹם
  choice: yuko salama
  rationale: Katika muktadha huu שָׁלוֹם linauliza kuhusu usalama na hali njema ya Absalomu. ‘Yuko salama’ ni Kiswahili cha kawaida katika swali kama hili, huku tanbihi ikihifadhi upana wa maana ya neno la Kiebrania.
- source_word: לַנַּעַר
  choice: kijana
  rationale: נַעַר linaweza kumaanisha mvulana au kijana. Kwa kuwa Absalomu ni mwana mtu mzima, ‘kijana’ linafaa kuliko neno linaloweza kumfanya aonekane mtoto mdogo.
- source_word: לְאַבְשָׁלוֹם
  choice: Absalomu
  rationale: Hii ndiyo namna ya kawaida ya kuandika jina hili katika Kiswahili.
- source_word: יִהְיוּ
  choice: na wawe
  rationale: Umbo hili linaonyesha ombi au tamko la kutakia jambo litokee. ‘Na wawe’ linawasilisha nguvu hiyo kwa Kiswahili cha asili.
- source_word: כַנַּעַר
  choice: kama huyo kijana
  rationale: Neno כַּ linaonyesha ulinganisho, na ‘huyo’ linaelekeza kwa Absalomu aliyetajwa bila kusema wazi kwamba amekufa.
- source_word: אֹיְבֵי אֲדֹנִי הַמֶּלֶךְ
  choice: Maadui wa bwana wangu mfalme
  rationale: Muundo huu unahifadhi namna rasmi ya kumheshimu mfalme na uhusiano wa umilikaji uliopo katika Kiebrania.
- source_word: קָמוּ עָלֶיךָ
  choice: wanaokuinukia
  rationale: Msemo קום על unaeleza upinzani au uasi wa kiadui. ‘Kuinukia’ ni msemo wa Kiswahili unaobeba wazo hilo.
- source_word: לְרָעָה
  choice: kwa nia mbaya
  rationale: Kirai hiki kinaonyesha kusudi la uovu au madhara. ‘Kwa nia mbaya’ kinahifadhi wazo la dhamira yenye uovu bila kulifanya kuwa tendo moja maalumu.
- source_word: וַיֹּאמֶר
  choice: akamwambia / akasema
  rationale: Vitenzi hivi vinaendeleza mtiririko wa simulizi kwa Kiswahili cha kawaida na kutofautisha kusema kwa mfalme na jibu la Mkushi bila kubadili maana.
theological_decisions:
- issue: Jibu la Mkushi kuhusu hatima ya Absalomu
  choice: 'Kuhifadhi jibu lisilo la moja kwa moja: ‘na wawe kama huyo kijana’'
  alternative: Kusema wazi kwamba Absalomu amekufa
  rationale: Kiebrania hakitaji kifo moja kwa moja. Kuhifadhi usemi wa fumbo kunatunza mvutano wa simulizi na hakiongezi ufafanuzi ambao haupo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Bwana wangu mfalme’ linahifadhi lugha rasmi ya ikulu, na jibu la Mkushi limeachwa kuwa la fumbo kama katika Kiebrania.
