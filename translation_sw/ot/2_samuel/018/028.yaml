source:
  edition: WLC
  text: וַ/יִּקְרָ֣א אֲחִימַ֗עַץ וַ/יֹּ֤אמֶר אֶל הַ/מֶּ֨לֶךְ֙ שָׁל֔וֹם וַ/יִּשְׁתַּ֧חוּ לַ/מֶּ֛לֶךְ לְ/אַפָּ֖י/ו אָ֑רְצָ/ה וַ/יֹּ֗אמֶר בָּרוּךְ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֤ר סִגַּר֙ אֶת הָ֣/אֲנָשִׁ֔ים אֲשֶׁר נָשְׂא֥וּ אֶת יָדָ֖/ם בַּֽ/אדֹנִ֥/י הַ/מֶּֽלֶךְ־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/028.yaml
  text: Ahimaaz called out and said to the king[a], “Peace!” Then he bowed down before the king with his face to the ground and said, “Blessed be Yahweh your God[b], who has delivered up the men who lifted their hand against my lord the king.”
translation:
  language: sw
  text: Ahimaasi akapaza sauti na kumwambia mfalme, “Salama!”[a] Kisha akainama kifudifudi mbele ya mfalme, akasema, “Abarikiwe Yahwe, Mungu wako, ambaye amewatia mikononi mwako wale watu waliomwinulia mkono dhidi ya bwana wangu, mfalme.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mambo yote ni salama!” Neno la Kiebrania linaweza kuwa taarifa kwamba mambo yamekwenda vyema, wala si salamu tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “amewakabidhi kwako” au “amewatoa mikononi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akapaza sauti
  rationale: Katika muktadha wa mjumbe anayemletea mfalme taarifa, kitenzi hiki kinaonyesha kuita kwa sauti inayosikika, si kumwita mtu tu.
- source_word: שָׁלוֹם
  choice: Salama!
  rationale: Neno hili linaweza kuwa salamu au tangazo fupi kwamba mambo yamekwenda vyema. “Salama!” huhifadhi ufupi na upana wa maana ya Kiebrania.
- source_word: וַיִּשְׁתַּחוּ לַמֶּלֶךְ לְאַפָּיו אָרְצָה
  choice: akamsujudia mfalme, uso wake ukiwa chini
  rationale: Tafsiri hii inaonyesha kwa uwazi tendo la kuinama kifudifudi mbele ya mfalme bila kuligeuza tu kuwa wazo la heshima.
- source_word: בָּרוּךְ יְהוָה אֱלֹהֶיךָ
  choice: Abarikiwe Yahwe, Mungu wako
  rationale: Huu ni usemi wa sifa na baraka; “Abarikiwe” ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: סִגַּר
  choice: amewakabidhi
  rationale: Katika muktadha huu kitenzi kinamaanisha kuwaweka wapinzani chini ya mamlaka ya mwingine, yaani kuwakabidhi au kuwatia mikononi.
- source_word: הָאֲנָשִׁים
  choice: wale watu
  rationale: Kifungu kinawarejelea wapinzani maalumu waliotajwa kwa muktadha; “wale watu” ni cha kawaida na hakiongezi maelezo yasiyokuwapo.
- source_word: נָשְׂאוּ אֶת יָדָם
  choice: waliomwinulia mkono
  rationale: Usemi huu huhifadhi picha halisi ya Kiebrania huku ukieleweka katika Kiswahili kuwa tendo la uasi au uhasama.
- source_word: בַּאדֹנִי הַמֶּלֶךְ
  choice: bwana wangu, mfalme
  rationale: Huu ni usemi wa heshima kwa Daudi; “bwana wangu” huhifadhi heshima ya lugha ya ikulu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: “Yahwe” huhifadhi jina binafsi la Mungu katika maandishi bila kulibadilisha kuwa cheo au kuingiza msimamo wa kimadhehebu.
- issue: Maana ya שָׁלוֹם katika taarifa ya mjumbe
  choice: Salama!
  alternative: Mambo yote ni salama!; Amani!
  rationale: Neno linaweza kuwa salamu na pia taarifa ya matokeo mema. Tafsiri fupi pamoja na tanbihi huhifadhi uwezekano huo badala ya kuamua maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. “Akamsujudia” hapa linaeleza tendo la kuinama kifudifudi mbele ya mfalme katika mazingira ya ikulu.
