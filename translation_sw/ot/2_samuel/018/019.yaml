  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/אֲחִימַ֤עַץ בֶּן צָדוֹק֙ אָמַ֔ר אָר֣וּצָה נָּ֔א וַ/אֲבַשְּׂרָ֖ה אֶת הַ/מֶּ֑לֶךְ כִּי שְׁפָט֥/וֹ יְהוָ֖ה מִ/יַּ֥ד אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/019.yaml
  text: Then Ahimaaz the son of Zadok said[a], “Please let me run and bring news to the king[b], for Yahweh has delivered him from the hand of his enemies.”
translation:
  language: sw
  text: Ndipo Ahimaasi mwana wa Sadoki akasema, “Tafadhali niruhusu nikimbie nikampelekee mfalme habari njema[a], kwa maana Yahwe amemfanyia haki[b] kwa kumtoa mkononi mwa adui zake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nikampelekee mfalme habari”; kitenzi cha Kiebrania kinaweza kumaanisha kuleta habari, na mara nyingi hudokeza habari nzuri.
    reason: lexical_alternative
  - marker: b
    text: Au, “ametoa hukumu kwa niaba yake” au “amemthibitisha kuwa mwenye haki”; usemi wa Kiebrania unasisitiza kwamba Yahwe alimtetea kwa hukumu na kumkomboa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲחִימַעַץ בֶּן צָדוֹק אָמַר
  choice: Ndipo Ahimaasi mwana wa Sadoki akasema
  rationale: Kiunganishi וַ kinaendeleza simulizi; “Ndipo” kinaonyesha mfuatano kwa Kiswahili cha kawaida. Majina yamenukuliwa kwa maumbo yanayotumika kwa kawaida katika Kiswahili.
- source_word: אָרוּצָה נָּא
  choice: Tafadhali niruhusu nikimbie
  rationale: Kitenzi cha cohortative kinaonyesha nia au ombi, huku נָא kikiongeza maana ya kusihi kwa adabu.
- source_word: וַ/אֲבַשְּׂרָה אֶת הַ/מֶּלֶךְ
  choice: nikampelekee mfalme habari njema
  rationale: Piel ya בשׂר humaanisha kuleta au kutangaza habari, mara nyingi habari nzuri. Katika muktadha wa ushindi, “habari njema” ni ya asili na haileti maana ya kiufundi ya baadaye.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa neno hili linaanzisha sababu au maudhui yanayoeleza habari ambayo Ahimaasi anataka kuipeleka.
- source_word: שְׁפָטוֹ יְהוָה
  choice: Yahwe amemfanyia haki
  rationale: שׁפט hapa ina wazo la Mungu kutoa hukumu kwa niaba ya mfalme na kumtetea, si kuokoa tu. “Amemfanyia haki” huhifadhi mwelekeo huo wa kimahakama.
- source_word: מִיַּד אֹיְבָיו
  choice: kwa kumtoa mkononi mwa adui zake
  rationale: “Mkono” huhifadhi taswira ya Kiebrania ya mamlaka au udhibiti; “kwa kumtoa” hufanya uhusiano wa ukombozi ueleweke kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina la Mungu lenye herufi nne moja kwa moja; “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Maana ya kimahakama na ya ukombozi katika שְׁפָטוֹ ... מִיַּד
  choice: amemfanyia haki kwa kumtoa mkononi mwa adui zake
  alternative: amemwokoa kutoka mkononi mwa adui zake
  rationale: Chaguo kuu linahifadhi mvutano wa asili kati ya kutenda haki kwa niaba ya mfalme na matokeo yake ya kumkomboa kutoka mamlaka ya adui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na hadhi inayofaa maandiko. “Tafadhali niruhusu” huonyesha ombi la adabu; “mkononi mwa” huhifadhi taswira ya chanzo huku ikibaki wazi kwa msomaji wa leo.
