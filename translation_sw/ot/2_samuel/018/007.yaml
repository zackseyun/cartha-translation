  yaml_path: translation/ot/2_samuel/018/007.yaml
  text: 'There the people of Israel were defeated before the servants of David[b][a], and the slaughter there was great on that day: twenty thousand men.'
translation:
  language: sw
  text: 'Huko watu wa Israeli walishindwa mbele ya watumishi wa Daudi, na pigo[a] kubwa likatokea huko siku hiyo: watu elfu ishirini[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maangamizi,” “kushindwa,” au “tauni.” Neno la Kiebrania linaweza kumaanisha tauni katika miktadha mingine, lakini hapa linarejelea pigo lenye vifo vitani.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “elfu ishirini.” Neno “watu” limeongezwa kwa ajili ya uwazi katika muktadha wa vita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְפוּ
  choice: walishindwa
  rationale: Nifali ya נָגַף hapa inaeleza kushindwa au kupigwa vitani. “Walishindwa” huwasilisha maana ya kijeshi kwa uwazi bila kudokeza kwamba kila mtu aliuawa.
- source_word: עַם יִשְׂרָאֵל
  choice: watu wa Israeli
  rationale: Hii ndiyo maana ya karibu ya maneno ya Kiebrania. Katika muktadha huu inawahusu wapiganaji wa Israeli, lakini tafsiri hii haiibadili moja kwa moja kuwa “jeshi.”
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Katika taarifa za vita, neno hili linaweza kuonyesha kushindwa mbele ya adui. “Mbele ya” huhifadhi muundo wa Kiebrania na inaeleweka katika Kiswahili cha masimulizi ya Biblia.
- source_word: עַבְדֵי דָוִד
  choice: watumishi wa Daudi
  rationale: עֶבֶד linaweza kumaanisha mtumishi, afisa, au mfuasi aliye chini ya mtawala. Hapa linawahusu watu au askari wa Daudi; “watumishi wa Daudi” hudumisha uhusiano wao naye bila kufafanua zaidi ya maandishi.
- source_word: הַמַּגֵּפָה
  choice: mauaji
  rationale: Ingawa מַגֵּפָה linaweza kumaanisha tauni katika miktadha mingine, hapa linaeleza pigo lenye vifo vitani. “Mauaji” huwasilisha kwa kawaida ukubwa wa vifo katika mapigano.
- source_word: גְדוֹלָה
  choice: yalikuwa makubwa
  rationale: Kivumishi hicho humaanisha “makubwa.” Muundo huu hudumisha msisitizo wa maandishi na unasikika kwa kawaida pamoja na “mauaji.”
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Huu ni usemi wa kawaida wa wakati, unaoweza kutafsiriwa kwa Kiswahili fasaha kama “siku hiyo.”
- source_word: עֶשְׂרִים אָלֶף
  choice: watu elfu ishirini
  rationale: Kiebrania kinataja idadi pekee. “Watu” limeongezwa ili kuonyesha kwa uwazi kwamba idadi hiyo inawahusu waliopoteza maisha katika vita, si hesabu isiyo na rejea.
