base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/024.yaml
  text: David was sitting between the two gates[a], and the watchman went up to the roof of the gate by the wall. He lifted up his eyes and looked, and behold, a man was running alone.
translation:
  language: sw
  text: Daudi alikuwa ameketi katikati ya malango mawili[a], naye mlinzi akapanda hadi kwenye paa la lango lililokuwa kando ya ukuta. Akainua macho yake, akatazama, na tazama, mwanamume mmoja alikuwa akikimbia peke yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katikati ya majengo mawili ya malango.” Kiebrania kinasema moja kwa moja “katikati ya malango mawili,” huenda kikimaanisha nafasi iliyokuwa ndani ya ingilio la mji lenye ulinzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: alikuwa ameketi
  rationale: Kivumishi-tendo hiki kinaonyesha hali ya Daudi iliyokuwa ikiendelea wakati huo; ‘alikuwa ameketi’ ni simulizi la kawaida na lenye heshima katika Kiswahili.
- source_word: בֵּין שְׁנֵי הַשְּׁעָרִים
  choice: katikati ya malango mawili
  rationale: Huu ndio maana ya moja kwa moja ya Kiebrania. Huenda ni nafasi kati ya lango la nje na la ndani katika ingilio lenye ngome, lakini matini haitaji kwa uwazi maelezo hayo.
- source_word: הַצֹּפֶה
  choice: mlinzi
  rationale: Neno linamtaja mtu mwenye jukumu la kutazama na kuonya; ‘mlinzi’ ni neno la kawaida katika mazingira ya lango na ukuta wa mji.
- source_word: אֶל גַּג הַשַּׁעַר אֶל הַחוֹמָה
  choice: kwenye paa la lango upande wa ukuta
  rationale: Tafsiri hii inaonyesha sehemu ya juu ya jengo la lango na uhusiano wake na ukuta bila kuongeza maelezo mahususi ya usanifu ambayo hayajasemwa wazi.
- source_word: וַיִּשָּׂא אֶת עֵינָיו
  choice: Akainua macho yake
  rationale: Nahau ya Kiebrania imehifadhiwa kwa namna inayoeleweka katika Kiswahili na inayobakiza ladha ya simulizi la chanzo.
- source_word: וַיַּרְא וְהִנֵּה
  choice: akatazama, na tazama
  rationale: Mpangilio huu unahifadhi tendo la kuangalia na msisitizo wa ghafla wa הִנֵּה unaomwelekeza msomaji kwa kile kilichoonekana.
- source_word: אִישׁ
  choice: mtu mmoja
  rationale: Katika muktadha huu אִישׁ humaanisha mwanamume mmoja anayeonekana kwa mbali; Kiswahili ‘mtu mmoja’ ni cha asili katika tukio hili na husisitiza kuwa ni mtu mmoja bila kulazimisha utambulisho ambao bado haujajulikana.
- source_word: רָץ
  choice: alikuwa akikimbia
  rationale: Umbo la kushiriki linaonyesha mtu akiwa katika tendo linaloendelea la kukimbia wakati mlinzi alipomwona.
- source_word: לְבַדּוֹ
  choice: peke yake
  rationale: Hii inaonyesha wazi kwamba mkimbiaji hakuwa pamoja na wengine na ni usemi wa kawaida wa Kiswahili.
