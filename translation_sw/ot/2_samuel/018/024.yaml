  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Muundo wa vitenzi vya mfululizo umetumiwa kuendeleza mwendo wa hadithi, huku ‘na tazama’ ikihifadhi msisitizo wa ghafla wa matini ya Kiebrania.
