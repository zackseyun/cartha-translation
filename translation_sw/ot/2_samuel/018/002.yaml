  text: וַ/יְשַׁלַּ֨ח דָּוִ֜ד אֶת הָ/עָ֗ם הַ/שְּׁלִשִׁ֤ית בְּ/יַד יוֹאָב֙ וְ֠/הַ/שְּׁלִשִׁית בְּ/יַ֨ד אֲבִישַׁ֤י בֶּן צְרוּיָה֙ אֲחִ֣י יוֹאָ֔ב וְ/הַ֨/שְּׁלִשִׁ֔ת בְּ/יַ֖ד אִתַּ֣י הַ/גִּתִּ֑י וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל הָ/עָ֔ם יָצֹ֥א אֵצֵ֛א גַּם אֲנִ֖י עִמָּ/כֶֽם־־־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/002.yaml
  text: 'David sent out the troops: one third under Joab[a], one third under Abishai son of Zeruiah, Joab’s brother, and one third under Ittai the Gittite. And the king said to the troops, “I myself will surely go out with you.”'
translation:
  language: sw
  text: 'Daudi akawatuma wanajeshi: theluthi moja chini ya uongozi wa Yoabu[a], theluthi moja chini ya uongozi wa Abishai mwana wa Seruya, ndugu yake Yoabu, na theluthi moja chini ya uongozi wa Itai, Mgiti. Mfalme akawaambia wanajeshi, “Hakika mimi pia nitatoka pamoja nanyi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “mkononi mwa,” nahau yenye maana ya “chini ya mamlaka au uongozi wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: akawatuma
  rationale: Katika muktadha huu wa vita, kitenzi kinaeleza Daudi kuwapeleka wanajeshi vitani; ‘akawatuma’ ni Kiswahili cha kawaida na huhifadhi maana hiyo bila kuongeza maelezo yasiyokuwapo.
- source_word: הָעָם
  choice: wanajeshi
  rationale: Ingawa neno hilo kwa kawaida ni ‘watu,’ hapa linarejelea kikosi cha Daudi kinachoenda vitani; ‘wanajeshi’ huonyesha rejeo la kimuktadha kwa uwazi.
- source_word: הַשְּׁלִשִׁית / הַשְּׁלִשִׁת
  choice: theluthi moja
  rationale: Maumbo yanayorudiwa yanataja kila moja ya sehemu tatu za jeshi; ‘theluthi moja’ ni wazi na ya kawaida.
- source_word: בְּיַד
  choice: chini ya uongozi wa
  rationale: Nahau ya Kiebrania, kihalisi ‘mkononi mwa,’ hapa inaonyesha mamlaka au uongozi wa kijeshi. Tafsiri hii inafikisha maana yake kwa Kiswahili cha kawaida.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: Abishai mwana wa Seruya, ndugu yake Yoabu
  rationale: Muundo huu unahifadhi utambulisho wa kifamilia kwa Kiswahili cha asili na unaonyesha wazi kwamba Abishai ndiye ndugu ya Yoabu.
- source_word: אִתַּי הַגִּתִּי
  choice: Itai, Mgati
  rationale: ‘Mgati’ humtambulisha Itai kuwa mtu wa Gathi, huku jina lake likinakiliwa kwa namna inayofaa Kiswahili.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Mfalme akawaambia
  rationale: Katika usimulizi wa Kiswahili, ‘akawaambia’ huunganisha tukio hili kwa kawaida na inaafikiana na walengwa wengi wanaotajwa, yaani wanajeshi.
- source_word: יָצֹא אֵצֵא
  choice: bila shaka nitatoka
  rationale: Umoja wa infinitivi kamili na kitenzi chenye ukomo unatia mkazo kauli; ‘bila shaka’ huwasilisha uthabiti huo.
- source_word: גַּם אֲנִי
  choice: Mimi mwenyewe
  rationale: Kirai hiki kinakazia ushiriki binafsi wa mfalme. ‘Mimi mwenyewe’ ni cha asili na hudumisha mkazo bila kulazimisha maana ya ‘pia’ pekee.
- source_word: עִמָּכֶם
  choice: pamoja nanyi
  rationale: Hiki ni kirai cha kawaida kinachoonyesha kuandamana nao katika kwenda vitani.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Wanajeshi’ inatumika kwa maana ya kimuktadha ya הָעָם, na muundo wa sehemu tatu umehifadhiwa. Alama ya tanbihi [a] imewekwa baada ya mfano wa kwanza wa nahau inayojirudia.
