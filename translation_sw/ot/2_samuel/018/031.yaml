base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/031.yaml
  text: And behold[a], the Cushite came, and the Cushite said, “Let my lord the king receive the good news[b], for Yahweh has vindicated you today from the hand of all who rose up against you.”
translation:
  language: sw
  text: Tazama, Mkushi[a] akaja, naye Mkushi akasema, “Bwana wangu mfalme, na upokee habari njema, kwa maana Yahweh amekutendea haki leo kwa kukuokoa kutoka mikononi mwa wote waliokuinukia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Mwethiopia.” Kiebrania: “Mkushi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Inahifadhi nguvu ya kiashiria cha simulizi kinachovuta fikira kwenye kuwasili kwa mjumbe, kwa Kiswahili cha kawaida na chenye uhai.
- source_word: הַכּוּשִׁי
  choice: Mkushi
  rationale: Ni jina la mtu wa Kushi, si jina binafsi. Linabaki karibu na jina la Kiebrania bila kulinganisha Kushi moja kwa moja na nchi ya kisasa ya Ethiopia.
- source_word: בָּא
  choice: akaja
  rationale: Ni uwasilishaji wa kawaida wa tendo linalofuata katika simulizi.
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Ni tafsiri ya kawaida na ya asili ya kitenzi אמר katika mfululizo wa simulizi.
- source_word: יִתְבַּשֵּׂר
  choice: na apokee habari njema
  rationale: Umbo hili lina nguvu ya agizo au takwa la heshima. Kauli hii inaonyesha kwamba mjumbe anamletea mfalme tangazo jema.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Bwana wangu mfalme
  rationale: Inahifadhi namna rasmi ya heshima kwa mfalme; hapa “Bwana” ni cheo cha heshima, si dai la uungu.
- source_word: כִּי
  choice: kwa maana
  rationale: Inatanguliza sababu na maudhui ya habari njema kwa njia ya asili katika Kiswahili.
- source_word: שְׁפָטְךָ
  choice: amekutendea haki
  rationale: Kitenzi שׁפט hapa kina maana ya Mungu kutoa hukumu kwa niaba ya Daudi. “Amekutendea haki” huwasilisha uthibitisho wa haki na uamuzi wa kimahakama bila kuficha asili yake ya kisheria.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi יהוה limetolewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: הַיּוֹם
  choice: leo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya msisitizo wa wakati.
- source_word: מִיַּד
  choice: dhidi ya
  rationale: Katika sentensi hii, maana ya kuondolewa chini ya nguvu ya maadui imewasilishwa kwa muundo wa Kiswahili unaoendana vizuri na “amekutendea haki,” bila kuongeza kitenzi tofauti cha wokovu.
- source_word: כָּל הַקָּמִים עָלֶיךָ
  choice: wote waliokuinukia
  rationale: Inahifadhi picha ya watu kuinuka kwa uhasama dhidi ya mfalme bila kuifafanua kupita kiasi kuwa aina maalumu ya uasi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina binafsi la Mungu, יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo kama “BWANA.”
- issue: Maana ya שְׁפָטְךָ
  choice: amekutendea haki
  alternative: amekuhukumia kwa niaba yako
  rationale: Kauli hiyo inaweza kueleweka kama kutoa hukumu kwa upande wa Daudi au kuthibitisha haki yake. Tafsiri kuu inabaki ya kisheria lakini ya asili, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa urahisi. Muundo wa heshima “Bwana wangu mfalme” umehifadhiwa, na lugha ya kisheria ya שׁפט haijafanywa kuwa ya kimadhehebu.
