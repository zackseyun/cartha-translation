  text: וִ/יהִי מָ֣ה אָר֔וּץ וַ/יֹּ֥אמֶר ל֖/וֹ ר֑וּץ וַ/יָּ֤רָץ אֲחִימַ֨עַץ֙ דֶּ֣רֶךְ הַ/כִּכָּ֔ר וַֽ/יַּעֲבֹ֖ר אֶת הַ/כּוּשִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/023.yaml
  text: But he said[a], “Whatever happens, let me run.” So he said to him[c][b], “Run.” Then Ahimaaz ran by the way of the plain and passed the Cushite.
translation:
  language: sw
  text: Lakini akasema, “Hata iweje, acha nikimbie.” Basi akamwambia, “Kimbia.” Ndipo Ahimaasi akakimbia kwa njia ya uwandani[a], akampita Mkushi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda ni uwanda wa Yordani; Kiebrania kinasema tu “uwanda.”
    reason: cultural_note
  - marker: b
    text: Au, “akamshinda Mkushi kwa mbio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי מָה אָרוּץ
  choice: Hata iweje, acha nikimbie
  rationale: Nahau hii inaonyesha kusisitiza kwa Ahimaasi kwamba aruhusiwe kukimbia licha ya matokeo. Kiswahili hiki ni cha kawaida, hudumisha hali ya ombi, na hakigeuzi kauli kuwa swali la moja kwa moja.
- source_word: רוּץ
  choice: Kimbia
  rationale: Ni amri ya moja kwa moja ya kitenzi רוץ, hivyo “Kimbia” ni tafsiri wazi na ya asili.
- source_word: דֶּרֶךְ הַכִּכָּר
  choice: kwa njia ya uwandani
  rationale: דֶּרֶךְ ni njia au mkondo, na הַכִּכָּר hapa inaelekea kumaanisha eneo tambarare, huenda uwanda wa Yordani. Tafsiri kuu haiongezi jina la kijiografia ambalo halikutajwa wazi katika Kiebrania.
- source_word: וַיַּעֲבֹר אֶת־הַכּוּשִׁי
  choice: akampita Mkushi
  rationale: Katika muktadha wa mbio, עבר pamoja na yambwa inaweza kumaanisha kumpita au kumfikia na kwenda mbele yake. “Akampita” ni ya asili na huhifadhi kiasi cha upana wa maana kuliko “akamshinda kwa mbio.”
- source_word: הַכּוּשִׁי
  choice: Mkushi
  rationale: Neno hili humtaja mtu wa Kushi. “Mkushi” huhifadhi utambulisho wa kikabila na kijiografia wa Kiebrania bila kuubadili kuwa “Mwethiopia,” ambao ni ufafanuzi wa kimapokeo.
- source_word: אֲחִימַעַץ
  choice: Ahimaasi
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili, huku likibaki karibu na umbo la jina la Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. “Hata iweje” huwasilisha nahau ya kusisitiza, na “acha nikimbie” huhifadhi ombi la ruhusa. Alama zote za tanbihi zimewekwa baada ya vipashio vinavyohusika.
