base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/010.yaml
  text: One man saw it and told Joab[a], and said, “Look, I saw Absalom hanging in the terebinth tree.”
translation:
  language: sw
  text: Mtu mmoja akaona, akamwambia Yoabu, akasema, “Tazama, nilimwona Absalomu akining’inia katika mti wa mvinje[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika mwaloni.” Neno la Kiebrania אֵלָה linaweza kumaanisha mvinje, na wakati mwingine hutafsiriwa kwa maana ya jumla zaidi kuwa “mwaloni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד
  choice: Mtu mmoja
  rationale: Huhifadhi maana ya moja kwa moja ya mtu mmoja katika simulizi, kwa Kiswahili cha kawaida na cha asili.
- source_word: וַיַּרְא
  choice: akaona
  rationale: Kitenzi hiki humaanisha kuona. Kiswahili hakihitaji kuongeza kiwakilishi cha kitu kisichotajwa, kwa kuwa jambo aliloona linaelezwa katika maneno yanayofuata.
- source_word: וַיַּגֵּד לְיוֹאָב
  choice: akamwambia Yoabu
  rationale: Katika muktadha huu נגד ni kutoa taarifa. 'Akamwambia Yoabu' ni usemi wa kawaida wa Kiswahili unaofikisha maana hiyo bila uzito usio wa lazima.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta usikivu wa msikilizaji. 'Tazama' linadumisha nguvu yake kwa lugha yenye heshima na inayoeleweka.
- source_word: רָאִיתִי
  choice: nilimwona
  rationale: Kauli inaripoti tendo lililokamilika la kumwona Absalomu; kiambishi cha yambwa kinahitajika kwa Kiswahili cha asili.
- source_word: תָּלוּי
  choice: akining’inia
  rationale: Huhifadhi hali endelevu inayotajwa na umbo la Kiebrania, bila kuamua katika mstari huu jinsi Absalomu alivyoshikiliwa na mti.
- source_word: בָּאֵלָה
  choice: katika mti wa mvinje
  rationale: אֵלָה humaanisha hasa aina ya mti unaoitwa terebinth. 'Katika' hufuata picha ya Kiebrania ya mtu aliyening’inia ndani au miongoni mwa matawi, badala ya kuibadili kuwa 'juu ya'.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye heshima na unaosomeka kwa urahisi. Mfuatano wa vitenzi vya ki- huendelezwa kwa viambishi vya simulizi aka-, huku ‘Tazama’ ikihifadhi msisitizo wa הִנֵּה.
