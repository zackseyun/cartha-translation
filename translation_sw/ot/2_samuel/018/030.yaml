  text: Mfalme akasema[a], “Sogea kando, usimame hapa.” Basi akasogea kando, akasimama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Geuka, usimame hapa.” Kitenzi cha Kiebrania kinaweza kumaanisha kugeuka kwa ujumla, lakini katika muktadha huu huenda kinamaanisha kusogea kando ili kutoa nafasi kwa mjumbe anayefuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Ni kitenzi cha kawaida cha usimulizi kinachoanzisha maneno ya moja kwa moja; “akasema” ni tafsiri ya asili katika Kiswahili.
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Nomino yenye uainisho humrejelea mfalme anayejulikana tayari katika muktadha; Kiswahili hakihitaji kibainishi tofauti.
- source_word: סֹב
  choice: Pisha kando
  rationale: Amri ya סבב inaweza kumaanisha kugeuka kwa ujumla, lakini hapa inaelekea kumwagiza mjumbe aondoke njia na kukaa pembeni ili kutoa nafasi.
- source_word: הִתְיַצֵּב
  choice: usimame
  rationale: Hitpaeli ya יצב humaanisha mtu kujiweka au kusimama mahali fulani; “usimame” ni ya kawaida na inaeleweka wazi.
- source_word: כֹּה
  choice: hapa
  rationale: Katika agizo hili, kielezi hiki kinaonyesha mahali maalumu pa kusimama.
- source_word: וַיִּסֹּב
  choice: akapisha kando
  rationale: Inatimiza amri ya סֹב na kudumisha uhusiano wa kileksia kati ya agizo na tendo.
- source_word: וַיַּעֲמֹד
  choice: akasimama
  rationale: עמד ni kitenzi cha kawaida cha kusimama; “akasimama” kinafaa katika mfululizo wa usimulizi.
