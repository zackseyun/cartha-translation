base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/014.yaml
  text: Joab said[a], “Not so[b]; I will not wait before you.” Then he took three spears in his hand and drove them into the heart of Absalom while he was still alive in the heart of the terebinth.
translation:
  language: sw
  text: Yoabu akasema, “Sivyo; sitakawia mbele yako.” Kisha akachukua mikuki mitatu[a] mkononi mwake, akazidunga moyoni mwa Absalomu, alipokuwa bado hai ndani ya mti wa terebinthi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fimbo tatu.” Neno la Kiebrania linaweza kumaanisha fimbo, gongo, au fimbo ya kifalme; hapa inaelekea kuwa silaha za kudungia.
    reason: lexical_alternative
  - marker: b
    text: Au “mwaloni.” Neno la Kiebrania אֵלָה mara nyingi humaanisha mti wa terebinthi, lakini wengine hulitafsiri kwa maana ya jumla kuwa mwaloni.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹחִילָה
  choice: sitakawia
  rationale: Hifili ya יחל hapa ina maana ya kungoja au kukawia. “Sitakawia” ni Kiswahili cha kawaida kinachoonyesha kuwa Yoabu anakataa kuchelewa zaidi.
- source_word: לְפָנֶיךָ
  choice: mbele yako
  rationale: Tafsiri hii inahifadhi nahau ya Kiebrania ya kuwa mbele ya uso au katika uwepo wa mtu.
- source_word: שְׁבָטִים
  choice: mikuki
  rationale: Neno hili linaweza kumaanisha fimbo, lakini muktadha wa kijeshi na tendo la kuichoma moyoni vinaonyesha silaha za kudungia. Uwezekano wa “fimbo” umehifadhiwa katika tanbihi.
- source_word: וַיִּתְקָעֵם
  choice: akaidunga
  rationale: Kitenzi תקע hapa kinaonyesha kuchoma au kusukuma kitu ndani kwa nguvu. “Akaidunga” kinaeleza tendo hilo kwa Kiswahili cha kawaida.
- source_word: בְּלֵב אַבְשָׁלוֹם
  choice: moyoni mwa Absalomu
  rationale: Kiebrania kinataja moyo moja kwa moja; tafsiri haijabadilisha kuwa kifua.
- source_word: עוֹדֶנּוּ חַי
  choice: alipokuwa bado hai
  rationale: Maneno haya yanasisitiza kwamba Absalomu alikuwa hajafa Yoabu alipomdunga.
- source_word: בְּלֵב הָאֵלָה
  choice: ndani ya mti wa terebinthi
  rationale: Nahau ya Kiebrania ni “katika moyo wa terebinthi,” yaani ndani au katikati ya mti. Kiswahili “ndani ya” ni cha asili zaidi, huku aina ya mti ikitajwa kwa usahihi.
