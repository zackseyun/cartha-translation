translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye heshima. Majina “Yoabu” na “Absalomu” yanafuata maumbo yanayotumika kwa kawaida katika Biblia za Kiswahili. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
