base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/029.yaml
  text: And the king said[a], “Is it well with the young man Absalom?” Ahimaaz said, “I saw a great commotion when Joab sent the king’s servant and your servant, but I did not know what it was.”
translation:
  language: sw
  text: Mfalme akauliza, “Je, yuko salama yule kijana Absalomu?” Ahimaasi akajibu, “Niliona ghasia kubwa[a] Yoabu alipotuma mtumishi wa mfalme pamoja nami, mtumishi wako, lakini sikujua ilikuwa nini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umati mkubwa” au “kelele kubwa”; neno la Kiebrania linaweza kumaanisha umati, kelele, au ghasia.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: yuko salama
  rationale: Katika swali hili neno linauliza hali njema ya Absalomu, hasa usalama wake. Kiswahili ‘yuko salama’ ni cha kawaida na kinafaa katika muktadha bila kudai kwamba swali linahusu kutokuwapo kwa vita pekee.
- source_word: לַנַּעַר לְאַבְשָׁלוֹם
  choice: yule kijana Absalomu
  rationale: ‘Kijana’ huhifadhi maana ya נַעַר, na ‘yule’ huwasilisha namna ya kumrejelea Absalomu kwa njia isiyo ya moja kwa moja.
- source_word: רָאִיתִי
  choice: Niliona
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi cha nafsi ya kwanza.
- source_word: הֶהָמוֹן הַגָּדוֹל
  choice: ghasia kubwa
  rationale: הָמוֹן inaweza kumaanisha umati, kelele, au vurugu. ‘Ghasia kubwa’ inaonyesha hali ya msukosuko bila kuamua kwamba Ahimaasi aliona umati pekee.
- source_word: לִשְׁלֹחַ
  choice: alipotuma
  rationale: Muundo wa kitenzi-jina chenye ל unaeleweka hapa kwa kawaida kama wakati wa tukio; ‘alipotuma’ ni Kiswahili asilia.
- source_word: עֶבֶד הַמֶּלֶךְ
  choice: mtumishi wa mfalme
  rationale: Katika muktadha huu עֶבֶד humaanisha mtu aliye chini ya mamlaka ya kifalme; ‘mtumishi’ haiongezi dhana mahususi ya utumwa ambayo si kiini cha sentensi.
- source_word: וְאֶת עַבְדֶּךָ
  choice: pamoja nami, mtumishi wako
  rationale: Huhifadhi usemi wa kujishusha ‘mtumishi wako’ huku ‘nami’ ikiweka wazi kwa Kiswahili kwamba Ahimaasi anajirejelea.
- source_word: וְלֹא יָדַעְתִּי מָה
  choice: lakini sikujua ilikuwa nini
  rationale: Kiebrania kinaishia kwa usemi wenye maana iliyodokezwa, ‘sikujua nini’; ‘ilikuwa nini’ hukamilisha sentensi kwa Kiswahili bila kuongeza habari mpya.
