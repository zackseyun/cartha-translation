  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wa kawaida na wenye heshima. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili. Alama ya tanbihi imewekwa baada ya sentensi inayohusiana na neno lenye uwezekano wa maana kadhaa.
