  yaml_path: translation/ot/1_samuel/014/010.yaml
  text: But if they say this[a], ‘Come up to us,’ then we will go up, for Yahweh has given them into our hand[b], and this will be the sign for us.
translation:
  language: sw
  text: Lakini wakisema hivi[a], ‘Pandeni mje kwetu,’ basi tutapanda, kwa maana Yahweh amewatia mikononi mwetu[b]; na hiyo ndiyo itakuwa ishara kwetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Pandeni mtujie.” Kiebrania kinaweza kusisitiza kupanda kuelekea mahali walipo Wafilisti, huku wazo la uhasama likidokezwa na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “katika mkono wetu,” ni nahau yenye maana ya kuwa chini ya uwezo au mamlaka yetu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini waki-
  rationale: Kiunganishi kinaendeleza masharti ya mstari uliotangulia huku kikionyesha tofauti na uwezekano wa kwanza; ‘Lakini’ ni ya kawaida na wazi katika Kiswahili.
- source_word: כֹּה יֹאמְרוּ
  choice: wakisema hivi
  rationale: Muundo huu unatambulisha maneno ya moja kwa moja kwa njia ya asili, huku ‘hivi’ ikihifadhi nguvu ya kielekezi כֹּה.
- source_word: עֲלוּ עָלֵינוּ
  choice: Pandeni mje kwetu
  rationale: עֲלוּ huonyesha kupanda kuelekea mahali palipo juu, na עָלֵינוּ hapa inaelekea kumaanisha kuja walipo wazungumzaji. ‘Mje kwetu’ huonyesha mwelekeo bila kulazimisha maana ya ‘kutushambulia,’ ingawa uhasama unaeleweka katika muktadha.
- source_word: וְעָלִינוּ
  choice: basi tutapanda
  rationale: Waw pamoja na kitenzi cha hali timilifu ina nguvu ya matokeo baada ya sharti; ‘basi’ huonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha sababu ya Yonathani kuchukua hatua.
- source_word: נְתָנָם
  choice: amewatia
  rationale: Hali timilifu inaonyesha uhakika wa tendo la Mungu kwa mtazamo wa Yonathani. ‘Amewatia’ huungana kwa asili na nahau ya ‘mikononi mwetu’ huku ikihifadhi wazo la נתן, kutoa au kutia chini ya mamlaka.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa tetragramatoni linatolewa kama jina binafsi ‘Yahweh,’ si kubadilishwa na cheo.
- source_word: בְּיָדֵנוּ
  choice: mikononi mwetu
  rationale: Ni nahau ya Kiebrania yenye maana ya kuwa chini ya uwezo au mamlaka. Kiswahili kwa kawaida hutumia wingi ‘mikononi mwetu’; picha ya mkono imehifadhiwa na maana imefafanuliwa katika tanbihi.
- source_word: וְזֶה לָּנוּ הָאוֹת
  choice: na hiyo ndiyo itakuwa ishara yetu
  rationale: Tukio linalotarajiwa linatambulishwa kuwa uthibitisho wao; ‘itakuwa’ huonyesha vizuri hali yake ya baadaye, na ‘ishara yetu’ ni Kiswahili cha asili kwa לָנוּ הָאוֹת.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יְהוָה. ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Uhakika wa tendo la Mungu katika נְתָנָם
  choice: amewatia mikononi mwetu
  alternative: atawatia mikononi mwetu
  rationale: Hali timilifu ya Kiebrania inaeleza tendo kama lililokamilika kwa uhakika kutoka kwa mtazamo wa Yonathani, ingawa matokeo yake bado yako mbele; Kiswahili cha wakati timilifu huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Pandeni mje kwetu’ ni usemi wa asili unaohifadhi mwelekeo wa kupanda na kutatua kwa upole ugumu wa עָלֵינוּ bila kufuta uwezekano wa maana ya kijeshi, ambao umewekwa katika tanbihi. Alama zote za tanbihi zimewekwa ndani ya matini.
