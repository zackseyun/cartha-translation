base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/030.yaml
  text: How much more if the people had eaten today from the spoil of their enemies that they found! For then the slaughter among the Philistines would have been much greater[a].
translation:
  language: sw
  text: Laiti watu wangalikula leo nyara za adui zao walizozipata! Je, basi sasa pigo dhidi ya Wafilisti lisingekuwa kubwa zaidi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Naam, kama watu wangalikula leo nyara za adui zao walizozipata, basi pigo dhidi ya Wafilisti lingekuwa kubwa zaidi.”
    reason: Mwanzo אַף כִּי לוּא unaweza kusomwa kama tamko la kutamani (“Laiti”) au kama utangulizi wa masharti (“Naam, kama”); swali hasi la mwisho ni la balagha.
lexical_decisions:
- source_word: אַף כִּי לוּא
  choice: Ingekuwa bora zaidi kama
  rationale: Muungano huu unasisitiza hali ya jambo ambalo halikutokea na matokeo makubwa zaidi ambayo yangewezekana; usemi huu ni wa asili katika Kiswahili na unafaa hoja ya Yonathani.
- source_word: אָכֹל אָכַל
  choice: wangekula
  rationale: Muundo wa kitenzi unasisitiza tendo la kula. Kiswahili cha kawaida kinaweza kuonyesha msisitizo huo kupitia muktadha wa hali nzima bila kuongeza wazo lisilo wazi la kula kwa uhuru au kushiba.
- source_word: מִשְּׁלַל אֹיְבָיו
  choice: baadhi ya nyara ... kutoka kwa adui zao
  rationale: שָׁלָל ni nyara za vita. Kiambishi cha umoja katika Kiebrania kinahusiana na nomino ya mkusanyiko 'watu'; Kiswahili hutumia wingi wa kimantiki 'adui zao'. Neno 'baadhi ya' linaonyesha מִן ya sehemu.
- source_word: אֲשֶׁר מָצָא
  choice: walizopata
  rationale: Kitenzi cha Kiebrania ni umoja kwa sababu 'watu' ni nomino ya mkusanyiko, lakini katika Kiswahili upatanisho wa wingi unafaa kwa watu hao.
- source_word: מַכָּה
  choice: mauaji
  rationale: Katika muktadha wa vita, מַכָּה inaweza kumaanisha pigo, kushindwa, au kuuawa kwa watu wengi; 'mauaji' inaonyesha hasara ya Wafilisti bila kulazimisha maana ya jumla ya kushindwa.
- source_word: לֹא רָבְתָה
  choice: yangekuwa makubwa zaidi
  rationale: Swali la balagha la Kiebrania linaeleza matokeo yasiyotimia; Kiswahili cha masharti kinafikisha maana hiyo kwa kawaida.
- source_word: בַּפְּלִשְׁתִּים
  choice: miongoni mwa Wafilisti
  rationale: Kihusishi ב kinaweza kuonyesha eneo au walengwa wa pigo; 'miongoni mwa' kinafaa pamoja na 'mauaji'.
