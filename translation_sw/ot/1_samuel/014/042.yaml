  text: Then Saul said[a], “Cast lots between me and Jonathan my son.” And Jonathan was taken.
translation:
  language: sw
  text: Ndipo Sauli akasema[a], “Pigeni kura kati yangu na Yonathani mwanangu.” Kura ikamwangukia Yonathani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya neno kwa neno zaidi, “Fanyeni ianguke kati yangu na Yonathani mwanangu,” yaani, amueni jambo hilo kwa kura.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפִּילוּ
  choice: Pigeni kura
  rationale: Kitenzi hiki katika Hiphil kwa maana ya msingi ni ‘fanyeni ianguke,’ lakini katika muktadha huu kinamaanisha kuamua jambo kwa kupiga kura. Kiswahili cha kawaida hutumia usemi ‘kupiga kura.’
- source_word: בֵּינִי וּבֵין
  choice: kati yangu na
  rationale: Muundo huu unalinganisha au kutenganisha wahusika wawili ili mmoja achaguliwe; ‘kati yangu na’ ni usemi wa kawaida wa Kiswahili.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Neno בן lenye kiambishi cha nafsi ya kwanza umoja humtaja mwana wa kiume wa msemaji; ‘mwanangu’ huhifadhi uhusiano huo kwa lugha ya kawaida.
- source_word: וַיִּלָּכֵד
  choice: Kura ikamwangukia
  rationale: Niphal ya לכד kwa msingi ni ‘alikamatwa/akatwaliwa,’ lakini katika muktadha wa kura inamaanisha kwamba Yonathani ndiye aliyeonyeshwa au kuchaguliwa na kura. Usemi huu wa Kiswahili unaweka wazi maana ya kimuktadha bila kudokeza kukamatwa kimwili.
- source_word: יוֹנָתָן
  choice: Yonathani
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: וַיֹּאמֶר
  choice: Ndipo Sauli akasema
  rationale: Waw-consecutive inaendeleza mfuatano wa simulizi; ‘Ndipo ... akasema’ ni Kiswahili cha asili kinachoonyesha hatua inayofuata.
