  text: וַ/יֹּ֤אמֶר שָׁאוּל֙ אֶל י֣וֹנָתָ֔ן הַגִּ֥ידָ/ה לִּ֖/י מֶ֣ה עָשִׂ֑יתָה וַ/יַּגֶּד ל֣/וֹ יוֹנָתָ֗ן וַ/יֹּאמֶר֩ טָעֹ֨ם טָעַ֜מְתִּי בִּ/קְצֵ֨ה הַ/מַּטֶּ֧ה אֲשֶׁר בְּ/יָדִ֛/י מְעַ֥ט דְּבַ֖שׁ הִנְ/נִ֥י אָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/043.yaml
  text: Then Saul said to Jonathan[a], “Tell me what you have done.” And Jonathan told him and said, “I indeed tasted a little honey on the tip of the staff that was in my hand, and here I am, about to die.”
translation:
  language: sw
  text: Ndipo Sauli akamwambia Yonathani, “Niambie umefanya nini.” Yonathani akamweleza, akisema, “Hakika nilionja asali kidogo kwa ncha ya fimbo iliyokuwa mkononi mwangu, na tazama, nitakufa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakika nilionja asali kidogo … na je, nitakufa?” Kiebrania kinasisitiza kitenzi “kuonja,” na maneno ya mwisho yanaweza kueleweka ama kama tamko la kujisalimisha ama kama swali la kupinga.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידָה לִּי
  choice: Niambie
  rationale: Amri hii ya kitenzi נגד pamoja na kiwakilishi cha nafsi inaelezwa kwa Kiswahili cha kawaida na cha moja kwa moja kuwa “Niambie.”
- source_word: מֶה עָשִׂיתָה
  choice: umefanya nini
  rationale: Kauli timilifu ya Kiswahili inaonyesha tendo lililokamilika ambalo matokeo yake yanahusika katika swali la Sauli.
- source_word: וַיַּגֶּד לוֹ
  choice: akamweleza
  rationale: “Akamweleza” ni simulizi la kawaida na pia hudumisha maana ya kutoa taarifa kwa Sauli.
- source_word: טָעֹם טָעַמְתִּי
  choice: Hakika nilionja
  rationale: Muundo wa jina-kitenzi lisilo na kikomo pamoja na kitenzi kilichonyambuliwa unasisitiza ukweli wa kuonja; “hakika” huhifadhi msisitizo huo bila kudai moja kwa moja kwamba tendo hilo lilikuwa dogo tu.
- source_word: בִּקְצֵה הַמַּטֶּה
  choice: kwa ncha ya fimbo
  rationale: קצה ni mwisho au ncha ya kitu, na “kwa ncha ya fimbo” ni usemi wa asili katika muktadha huu.
- source_word: מְעַט דְּבַשׁ
  choice: asali kidogo
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kiasi kidogo cha asali.
- source_word: הִנְנִי
  choice: na tazama, sasa
  rationale: “Tazama” huhifadhi nguvu ya kuonyesha hali ya sasa, huku “sasa” ikiunganisha kwa kawaida matokeo yanayomkabili Yonathani.
- source_word: אָמֽוּת
  choice: nitakufa
  rationale: Kauli ya wakati ujao huhifadhi kwa urahisi maana ya kifo kinachotarajiwa kutokana na kiapo cha Sauli, bila kuamua kabisa kama ni tamko la kujisalimisha au swali la kupinga.
theological_decisions:
- issue: Iwapo maneno ya mwisho ya Yonathani ni tamko la kujisalimisha au swali la kupinga
  choice: “na tazama, sasa nitakufa” katika matini kuu
  alternative: “na sasa ni lazima nife?”
  rationale: Kiebrania hakina alama za kale za kuuliza na kinaweza kusikika kama tamko au swali la balagha. Matini kuu inafuata sintaksia ya tamko, huku tanbihi ikihifadhi uwezekano mwingine bila kuondoa mvutano wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. “Yonathani” na “Sauli” zimetumiwa kama maumbo ya kawaida ya majina ya Biblia. Msisitizo na utata halisi wa Kiebrania umehifadhiwa kwa matini kuu pamoja na tanbihi.
