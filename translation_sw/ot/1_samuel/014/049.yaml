base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/049.yaml
  text: 'Saul’s sons were Jonathan[a], Ishvi, and Malchi-shua; and the names of his two daughters were these: the name of the firstborn was Merab[b], and the name of the younger was Michal.'
translation:
  language: sw
  text: 'Wana wa Sauli walikuwa Yonathani, Yishwi, na Malki-shua; na majina[a] ya binti zake wawili yalikuwa haya: jina la mzaliwa wa kwanza[b] lilikuwa Merabu, na jina la mdogo lilikuwa Mikali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “jina la binti zake wawili.” Kiswahili kimetumia “majina” kwa sababu majina mawili yanafuata.
    reason: lexical_alternative
  - marker: b
    text: Au “mkubwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְּנֵי שָׁאוּל
  choice: Wana wa Sauli walikuwa
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida taarifa ya nasaba bila kuongeza kiashiria cha wakati ambacho hakipo wazi katika Kiebrania.
- source_word: יוֹנָתָן וְיִשְׁוִי וּמַלְכִּי שׁוּעַ
  choice: Yonathani, Yishvi na Malki-shua
  rationale: Majina yametoholewa kwa namna inayoonyesha kwa karibu maumbo ya Kiebrania; kistari katika Malki-shua kinaonyesha vipashio viwili vya jina hilo.
- source_word: וְשֵׁם שְׁתֵּי בְנֹתָיו
  choice: Majina ya binti zake wawili yalikuwa haya
  rationale: Ingawa Kiebrania kina neno la umoja 'jina,' majina mawili yanafuata; wingi ni wa kawaida na wazi katika Kiswahili, huku tanbihi ikihifadhi umbo halisi la chanzo.
- source_word: הַבְּכִירָה
  choice: mzaliwa wa kwanza
  rationale: Kauli hii inadumisha dhana ya mpangilio wa kuzaliwa iliyo katika neno la Kiebrania, badala ya kusema tu 'mkubwa.'
- source_word: הַקְּטַנָּה
  choice: mdogo
  rationale: Katika muktadha wa binti wawili, neno hili linaonyesha umri wa kulinganisha, si ukubwa wa mwili.
- source_word: מֵרַב ... מִיכַל
  choice: Merabu ... Mikali
  rationale: Haya ni maumbo ya majina yanayoweza kutamkwa kwa kawaida katika Kiswahili huku yakibaki karibu na majina ya Kiebrania.
