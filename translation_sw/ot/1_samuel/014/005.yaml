base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/005.yaml
  text: One crag stood on the north[a], opposite Michmash, and the other on the south[b], opposite Geba.
translation:
  language: sw
  text: Mwamba mmoja wenye ncha kali ulisimama upande wa kaskazini[a], mkabala na Mikmashi, na mwingine upande wa kusini, mkabala na Geba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania husema kihalisi “jino,” sitiari ya mwamba uliochongoka.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya tafsiri husoma “Gibea” hapa, lakini jina la mahali katika Kiebrania ni Geba.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֵּׁן
  choice: mwamba wenye ncha kali
  rationale: Neno hili humaanisha kihalisi ‘jino,’ lakini hapa limetumiwa kisitiari kueleza mwamba uliochongoka. Tafsiri hii inaleta maana ya kijiografia huku ikihifadhi picha ya ncha kali.
- source_word: הָאֶחָד ... וְהָאֶחָד
  choice: mmoja ... na mwingine
  rationale: Muundo huu unatofautisha miamba miwili; ‘mmoja ... na mwingine’ ni Kiswahili cha kawaida na wazi.
- source_word: מָצוּק
  choice: ulisimama
  rationale: Katika muktadha huu neno linaeleza mwamba ulioinuka au uliokuwa mahali hapo. ‘Ulisimama’ ni usemi wa asili wa kijiografia bila kulazimisha maana finyu isiyo na uhakika.
- source_word: מִצָּפוֹן
  choice: upande wa kaskazini
  rationale: Kihusishi pamoja na ‘kaskazini’ kinaonyesha mahali mwamba ulipokuwa kuhusiana na njia ya kupita.
- source_word: מוּל
  choice: mkabala na
  rationale: Huonyesha kitu kilichoelekeana na kingine; ‘mkabala na’ ni fasaha na sahihi katika maelezo ya mahali.
- source_word: מִכְמָשׂ
  choice: Mikmashi
  rationale: Uhawilishaji unaofaa kwa Kiswahili wa jina la mahali la Kiebrania.
- source_word: מִנֶּגֶב
  choice: upande wa kusini
  rationale: Hapa נגב inaonyesha upande wa kusini, sambamba na upande wa kaskazini katika sehemu ya kwanza.
- source_word: גָּבַע
  choice: Geba
  rationale: Maandishi ya Kiebrania na mazingira ya kijiografia yanaunga mkono jina Geba, si Gibea.
