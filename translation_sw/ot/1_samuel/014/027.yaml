base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/027.yaml
  text: But Jonathan had not heard when his father put the people under oath[a], so he stretched out the tip of the staff that was in his hand and dipped it into the honeycomb, and he brought his hand to his mouth[b], and his eyes brightened.
translation:
  language: sw
  text: Lakini Yonathani hakuwa amesikia wakati baba yake alipowaweka watu chini ya kiapo. Basi akanyoosha ncha ya fimbo iliyokuwa mkononi mwake na kuichovya katika sega la asali[a]. Kisha akaupeleka mkono wake kinywani. Macho yake yakang'aa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “katika msitu au kichaka cha asali.” Usemi huu wa Kiebrania huenda unarejelea sega au mkusanyiko mzito wa asali.
    reason: lexical_alternative
  - marker: b
    text: “Macho yake yakang'aa” ni nahau ya Kiebrania inayoonyesha kwamba mtu alipata nguvu au uchangamfu baada ya kula.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַע
  choice: hakuwa amesikia
  rationale: Katika muktadha huu kitenzi kinaonyesha kwamba Yonathani hakuwa na habari kuhusu kiapo cha Sauli, si kwamba alikataa kutii. Muundo huu pia unaonyesha kwamba kutosikia kulitangulia tendo lake la kula asali.
- source_word: בְּהַשְׁבִּיעַ
  choice: wakati baba yake alipowaweka watu chini ya kiapo
  rationale: Hifili ya שבע humaanisha kusababisha watu waape au kuwaweka chini ya kiapo. Tafsiri hii ni ya kawaida na inadumisha uzito wa kiapo hicho.
- source_word: וַיִּשְׁלַח
  choice: akanyoosha
  rationale: Pamoja na ncha ya fimbo kama kitu kinachoelekezwa mbele, maana ya kimuktadha ni kunyoosha fimbo, si kuituma.
- source_word: קְצֵה הַמַּטֶּה
  choice: ncha ya fimbo
  rationale: Huu ni usemi wa kawaida wa Kiswahili kwa sehemu ya mwisho ya fimbo iliyochovywa katika asali.
- source_word: וַיִּטְבֹּל אוֹתָהּ
  choice: kuichovya
  rationale: Kitenzi 'chovya' kinaeleza kwa kawaida kutumbukiza kitu kwa muda katika chakula au kiowevu. Kiambishi cha kitu kinarejelea ncha ya fimbo kwa maana.
- source_word: בְּיַעְרַת הַדְּבָשׁ
  choice: katika sega la asali
  rationale: Ingawa usemi wa Kiebrania una taswira isiyo ya kawaida ya msitu au kichaka cha asali, hapa yaelekea unamaanisha sega au mkusanyiko mzito wa asali. 'Sega la asali' linafaa kwa tendo la kuchovya ncha ya fimbo.
- source_word: וַיָּשֶׁב יָדוֹ אֶל פִּיו
  choice: akaupeleka mkono wake kinywani
  rationale: Usemi huu unaeleza tendo la kupeleka asali mdomoni ili kuila. Tafsiri hii ni wazi bila kuongeza maelezo yasiyotajwa moja kwa moja.
- source_word: וַתָּרְאֶנָה עֵינָיו
  choice: macho yake yakang'aa
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya macho kuwa na nuru, huku muktadha ukidokeza kurejea kwa nguvu au uchangamfu baada ya kula.
