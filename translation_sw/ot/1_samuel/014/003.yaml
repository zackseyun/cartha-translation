  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/אֲחִיָּ֣ה בֶן אֲחִט֡וּב אֲחִ֡י אִיכָב֣וֹד בֶּן פִּינְחָ֨ס בֶּן עֵלִ֜י כֹּהֵ֧ן יְהוָ֛ה בְּ/שִׁל֖וֹ נֹשֵׂ֣א אֵפ֑וֹד וְ/הָ/עָם֙ לֹ֣א יָדַ֔ע כִּ֥י הָלַ֖ךְ יוֹנָתָֽן־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/003.yaml
  text: Ahijah son of Ahitub[a], brother of Ichabod, son of Phinehas, son of Eli, priest of Yahweh at Shiloh, was carrying an ephod. And the people did not know that Jonathan had gone.
translation:
  language: sw
  text: Ahiya mwana wa Ahitubu, ndugu wa Ikabodi, mwana wa Finehasi, mwana wa Eli, kuhani wa Yahweh huko Shilo, alikuwa akibeba efodi[a]. Watu hawakujua kwamba Yonathani alikuwa ameondoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa amevaa efodi.” Kiebrania kinasema kihalisi, “akibeba efodi.”
    reason: Muktadha wa kikuhani unaweza kumaanisha kwamba efodi ilikuwa imevaliwa, ingawa kitenzi cha Kiebrania kimsingi humaanisha kubeba.
lexical_decisions:
- source_word: וַ/אֲחִיָּה
  choice: Ahiya
  rationale: Jina limetoholewa kwa Kiswahili; kiunganishi וַ hakijaongezewa neno la wakati lisilokuwamo katika Kiebrania.
- source_word: בֶן אֲחִטוּב
  choice: mwana wa Ahitubu
  rationale: Muundo wa nasaba umetafsiriwa moja kwa moja na kwa kawaida katika Kiswahili.
- source_word: אֲחִי אִיכָבוֹד
  choice: ndugu ya Ikabodi
  rationale: אֲחִי humaanisha hasa ‘ndugu wa kiume’; Kiswahili cha kawaida hutumia ‘ndugu ya’ katika uhusiano huu bila kulazimisha maelezo yasiyo katika matini.
- source_word: בֶּן פִּינְחָס בֶּן עֵלִי
  choice: mwana wa Finehasi, mwana wa Eli
  rationale: Mlolongo wa nasaba umehifadhiwa wazi kama ulivyo katika Kiebrania.
- source_word: כֹּהֵן יְהוָה
  choice: kuhani wa Yahweh
  rationale: ‘Kuhani’ ni neno la kawaida la ibada, na jina la Mungu יְהוָה limetoholewa kama Yahweh badala ya kubadilishwa kuwa cheo.
- source_word: בְּ/שִׁלֹה
  choice: huko Shilo
  rationale: ב hapa huonyesha mahali; ‘huko Shilo’ ni Kiswahili cha asili katika taarifa hii ya mahali.
- source_word: נֹשֵׂא אֵפוֹד
  choice: alikuwa amebeba efodi[a]
  rationale: נשא kimsingi ni kubeba; tafsiri hii huhifadhi maana ya msingi bila kuamua kimya kimya kwamba efodi ilikuwa imevaliwa. Tanbihi inatoa uwezekano huo wa kimuktadha.
- source_word: וְ/הָעָם לֹא יָדַע
  choice: Watu hawakujua
  rationale: Nomino ya pamoja הָעָם imetafsiriwa ‘watu’; wingi wa kisarufi ni wa kawaida katika Kiswahili.
- source_word: כִּי הָלַךְ יוֹנָתָן
  choice: kwamba Yonathani alikuwa ameondoka
  rationale: כִּי huanzisha jambo walilokuwa hawajui, na umbo la wakati linaonyesha kwamba kuondoka kulitangulia kutokujua kwao.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina maalumu la Mungu, si cheo; ‘Yahweh’ hulihifadhi kwa kulitohoa bila kuingiza tofauti ya kimadhehebu.
- issue: Namna ya kubeba efodi
  choice: alikuwa amebeba efodi
  alternative: alikuwa amevaa efodi
  rationale: נֹשֵׂא ina maana pana ya kubeba au kuchukua; kwa kuwa muktadha wa kikuhani unaweza kudokeza kuvaa lakini matini haisemi hivyo moja kwa moja, maana ya msingi imewekwa katika matini na uwezekano mwingine katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Majina yametoholewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili. Muundo wa nasaba na utata halisi kuhusu kubeba au kuvaa efodi umehifadhiwa.
