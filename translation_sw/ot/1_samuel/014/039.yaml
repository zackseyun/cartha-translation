base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/039.yaml
  text: For as Yahweh lives[a], who saves Israel, even if it is in Jonathan my son, he shall surely die.” But not one of all the people answered him.
translation:
  language: sw
  text: “Kwa maana, kama Yahwe aishivyo, yeye anayewaokoa Israeli, hata ikiwa jambo hilo[a] limo kwa Yonathani mwanangu, hakika atakufa.” Lakini hakuna hata mmoja kati ya watu wote aliyemjibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ikiwa kiko kwa Yonathani mwanangu”; kitu kinachorejelewa hakitajwi wazi. Muktadha unaashiria jambo la hatia au kosa linalochunguzwa.'
    reason: Utata wa kirejeo katika Kiebrania
lexical_decisions:
- source_word: חַי יְהוָה
  choice: kama Yahwe aishivyo
  rationale: Ni kanuni ya kiapo cha Kiebrania. Muundo huu wa Kiswahili unahifadhi maana na uzito wa kiapo kwa lugha ya kawaida yenye staha.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetolewa kwa unukuzi wa Kiswahili unaolingana na matamshi yanayokadiriwa ya jina hilo.
- source_word: הַמּוֹשִׁיעַ אֶת יִשְׂרָאֵל
  choice: yeye anayewaokoa Israeli
  rationale: Kitenzi-shirikishi chenye kibainishi kinamtambulisha Yahwe kwa tendo lake la kawaida na endelevu la kuwaokoa Israeli.
- source_word: כִּי אִם
  choice: hata ikiwa
  rationale: 'Katika muktadha huu wa kiapo, maneno haya yanaanzisha hali iliyokithiri ya kudhaniwa: hata jambo likiwa kwa mwana wa Sauli mwenyewe.'
- source_word: יֶשְׁנוֹ בְּיוֹנָתָן בְּנִי
  choice: jambo hilo limo kwa Yonathani mwanangu
  rationale: Kiebrania kinaacha kitu kinachorejelewa bila kukitaja. ‘Jambo hilo’ hudokeza kosa linalochunguzwa bila kulifafanua kupita kiasi, na ‘limo kwa’ huhifadhi ukaribu na muundo wa chanzo.
- source_word: מוֹת יָמוּת
  choice: hakika atakufa
  rationale: Muundo wa infinitivi halisi pamoja na kitenzi kisichotimilika unasisitiza uhakika wa kifo; ‘hakika’ hubeba mkazo huo kwa Kiswahili cha kawaida.
- source_word: וְאֵין עֹנֵהוּ
  choice: Lakini hakuna ... aliyemjibu
  rationale: ‘Alimjibu’ ni sawia ya moja kwa moja, huku ‘Lakini’ ikionyesha tofauti kati ya tangazo la Sauli na ukimya wa watu.
- source_word: מִכָּל הָעָם
  choice: hata mmoja kati ya watu wote
  rationale: 'Hutoa maana ya sehemu ya kundi: hakuna mtu mmoja miongoni mwa watu wote aliyejibu.'
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: ‘Yahwe’ linafuata unukuzi wa kawaida wa jina la Kiebrania na halibadilishi jina hilo kuwa cheo.
- issue: Kitu kisichotajwa katika יֶשְׁנוֹ בְּיוֹנָתָן בְּנִי
  choice: jambo hilo limo kwa Yonathani mwanangu
  alternative: kosa hilo likipatikana kwa Yonathani mwanangu
  rationale: Chanzo hakitaji wazi ‘kosa’ au ‘hatia.’ Tafsiri inahifadhi kutotajwa huko huku ikifanya sentensi ieleweke kwa Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kiapo umehifadhiwa bila kuwa wa kizamani kupita kiasi; utata halisi wa kitu kilicho ‘kwa Yonathani’ umeachwa wazi.
