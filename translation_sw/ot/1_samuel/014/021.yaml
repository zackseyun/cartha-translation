base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/021.yaml
  text: The Hebrews who had previously been with the Philistines[a], who had gone up with them into the camp all around—even they also came to be with Israel[c][b], who were with Saul and Jonathan.
translation:
  language: sw
  text: Nao Waebrania waliokuwa upande wa Wafilisti hapo zamani[a], ambao walikuwa wamepanda pamoja nao hadi kambini, pande zote[b]—hao pia wakawa pamoja na watu wa Israeli[c] waliokuwa pamoja na Sauli na Yonathani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kama jana na juzi”; hii ni nahau inayomaanisha “hapo zamani” au “zamani.”
    reason: lexical_alternative
  - marker: b
    text: Usemi wa Kiebrania unaotaja kambi na “pande zote” una utata. Huenda unaeleza kambi ya Wafilisti iliyokuwa katika eneo la kandokando, au Waebrania waliokuwa wameandamana nao kambini katika maeneo ya kuizunguka.
    reason: alternative_reading
  - marker: c
    text: Au, “wakajiunga na watu wa Israeli.” Kiebrania kinasema kwa karibu “wakawa pamoja na Israeli,” na muktadha unaashiria badiliko la upande.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָעִבְרִים
  choice: Nao Waebrania
  rationale: “Waebrania” huhifadhi jina la kijamii lililotumiwa katika chanzo badala ya kulibadili kuwa “Waisraeli”; “Nao” huendeleza simulizi kwa njia ya kawaida.
- source_word: הָיוּ לַפְּלִשְׁתִּים
  choice: waliokuwa upande wa Wafilisti
  rationale: Muundo huu unaonyesha ushirika au uaminifu kwa Wafilisti, bila kudai kwamba Waebrania hao walikuwa mali yao.
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: hapo zamani
  rationale: Nahau hiyo, kwa maana halisi “kama jana, siku tatu zilizopita,” humaanisha wakati uliopita au hapo zamani.
- source_word: אֲשֶׁר עָלוּ עִמָּם
  choice: ambao walikuwa wamepanda pamoja nao
  rationale: “Kupanda” huhifadhi kitenzi cha mwelekeo עלה; wakati timilifu unaonyesha kuwa walikuwa wameandamana na Wafilisti kabla ya hatua inayofuata.
- source_word: בַּמַּחֲנֶה סָבִיב
  choice: hadi kambini katika eneo lililowazunguka
  rationale: Usemi wa Kiebrania una ugumu wa kisintaksia. Tafsiri hii huhifadhi wazo la kambi na eneo la kuzunguka bila kulazimisha uhusiano mmoja pekee kati ya maneno hayo.
- source_word: וְגַם הֵמָּה
  choice: hao pia
  rationale: Huhifadhi msisitizo kwamba hata kundi hili nalo lilikuwa miongoni mwa waliokuwa pamoja na Israeli.
- source_word: לִהְיוֹת עִם יִשְׂרָאֵל
  choice: wakawa pamoja na watu wa Israeli
  rationale: Hufuata kwa karibu “kuwa pamoja na Israeli” na huacha muktadha uonyeshe badiliko la upande, badala ya kuongeza kitenzi chenye tafsiri nzito kama “wakaasi”.
- source_word: אֲשֶׁר עִם שָׁאוּל וְיוֹנָתָן
  choice: waliokuwa pamoja na Sauli na Yonathani
  rationale: Kishazi hiki kinaeleza kundi la watu wa Israeli lililokuwa pamoja na Sauli na Yonathani.
theological_decisions:
- issue: Ikiwa Waebrania hao walibadili uaminifu wao kwa makusudi
  choice: wakawa pamoja na watu wa Israeli
  alternative: wakajiunga na watu wa Israeli
  rationale: Chanzo kinasema kwa karibu “kuwa pamoja na Israeli.” Ingawa muktadha unaashiria kuhamia upande wa Israeli, tafsiri kuu haiongezi wazi nia au namna ya badiliko hilo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. “Waebrania” limedumishwa ili kutofautisha jina hilo na “watu wa Israeli.”
