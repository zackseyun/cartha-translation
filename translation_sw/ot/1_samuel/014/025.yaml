  yaml_path: translation/ot/1_samuel/014/025.yaml
  text: And all the people of the land entered the forest[b][a], and there was honey on the surface of the ground.
translation:
  language: sw
  text: Watu wote wa nchi[a] wakaingia msituni, na kulikuwa na asali juu ya ardhi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “nchi yote.” Hapa inaelekea kuwa usemi unaowakilisha watu wa nchi.
    reason: lexical_alternative
  - marker: b
    text: Au “juu ya uso wa shamba.” Usemi wa Kiebrania unaweza kumaanisha asali iliyokuwa juu ya sehemu ya ardhi iliyoonekana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: Watu wote wa nchi
  rationale: Kiebrania kinasema kihalisi “nchi yote,” lakini kitenzi cha wingi na muktadha vinaonyesha matumizi ya kijumla yanayowakilisha watu waliokuwa katika nchi hiyo. Tafsiri hii inaweka maana hiyo wazi kwa Kiswahili cha kawaida huku tanbihi ikihifadhi usemi halisi.
- source_word: בָּאוּ
  choice: wakaingia
  rationale: Kitenzi בוא kinaweza kumaanisha kuja au kuingia. Pamoja na kirai kinachofuata kuhusu msitu, “wakaingia” ni cha asili na kinaeleza mwendo wa kuingia ndani ya eneo hilo.
- source_word: בַיַּעַר
  choice: msituni
  rationale: יַעַר ni eneo lenye miti mingi, yaani msitu. Umbo “msituni” linaonyesha kwa kawaida kwamba waliingia ndani ya msitu.
- source_word: וַיְהִי
  choice: na kulikuwa na
  rationale: Hapa היה inatambulisha kuwapo kwa asali katika mandhari. “Kulikuwa na” ni usemi wa kawaida wa Kiswahili unaohifadhi kazi hiyo ya kitenzi.
- source_word: דְבַשׁ
  choice: asali
  rationale: Neno hilo humaanisha “asali.” Ingawa mazingira yanaweza kudokeza asali ya mwituni, maandishi hayasemi hivyo wazi, kwa hiyo sifa hiyo haijaongezwa.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: juu ya ardhi
  rationale: Kirai עַל־פני kina maana ya kuwa juu ya uso wa kitu. Katika mazingira ya msitu, שָׂדֶה yaelekea kutaja ardhi au eneo la wazi kwa ujumla kuliko shamba lililolimwa. “Juu ya ardhi” ni wazi na ya kawaida, huku tanbihi ikihifadhi tafsiri ya karibu zaidi ya maneno.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi unaoeleweka kwa wasomaji wa kawaida. Lugha ni ya heshima na ya sasa; maana ya kijumla ya “nchi yote” imewekwa wazi katika matini, na ukaribu wa usemi wa Kiebrania umehifadhiwa katika tanbihi.
