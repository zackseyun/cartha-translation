translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Tulieni hapo’ na ‘tutabaki pale tulipo’ ni misemo ya kawaida; ‘hatu­tapanda kwenda kwao’ huhifadhi mwelekeo wa kupanda uliopo katika chanzo.
