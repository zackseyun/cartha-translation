base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/009.yaml
  text: If they say to us like this[b][a], ‘Stay there until we come to you,’ then we will stand where we are and will not go up to them.
translation:
  language: sw
  text: Kama wakituambia hivi, ‘Tulieni hapo[a] mpaka tuwafikie,’ basi tutabaki pale tulipo[b], wala hatutapanda kwenda kwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nyamazeni hapo” au “Ngojeeni hapo.” Amri ya Kiebrania inaweza kumaanisha kutulia, kunyamaza, au kubaki mahali bila kusonga.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “tutasimama chini yetu,” nahau yenye maana ya kubaki mahali tulipo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kama
  rationale: Kiunganishi cha kawaida cha sharti, kinachoanzisha ishara anayopendekeza Yonathani.
- source_word: כֹּה יֹאמְרוּ אֵלֵינוּ
  choice: wakituambia hivi
  rationale: Muundo huu ni wa asili katika Kiswahili na unadumisha nguvu ya כֹּה ya kutanguliza maneno yatakayosemwa.
- source_word: דֹּמּוּ
  choice: Tulieni hapo
  rationale: Kitenzi דמם kinaweza kumaanisha kutulia, kunyamaza, au kubaki bila kusonga. Katika muktadha huu wa kijeshi, amri inawahusu wabaki mahali walipo; ‘hapo’ huweka maana hiyo wazi bila kufuta uwezekano wa ‘nyamazeni’ au ‘ngojeeni,’ unaotajwa katika tanbihi.
- source_word: עַד הַגִּיעֵנוּ אֲלֵיכֶם
  choice: mpaka tuwafikie
  rationale: ‘Kuwafikia’ huonyesha kwa kawaida harakati za Wafilisti kuelekea kwa Yonathani na mchukua silaha wake.
- source_word: וְעָמַדְנוּ תַחְתֵּינוּ
  choice: basi tutabaki pale tulipo
  rationale: Waw inayofuata sharti inaonyesha matokeo. Usemi wa Kiebrania ‘kusimama chini yetu wenyewe’ ni nahau ya kubaki mahali au katika nafasi yao.
- source_word: וְלֹא נַעֲלֶה אֲלֵיהֶם
  choice: wala hatutapanda kwenda kwao
  rationale: ‘Kupanda’ huhifadhi maelezo ya kijiografia ya עלה kuelekea mahali pa juu walipokuwa Wafilisti, bila kuongeza dhana ya kushambulia ambayo haijasemwa moja kwa moja.
