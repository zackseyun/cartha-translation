  terminology: “Kuhani,” “Wafilisti,” na “ghasia” vinafaa kwa rejista ya simulizi la kibiblia. Tanbihi inafafanua kwa usahihi kwamba amri ya “kusanya mkono wako” inamaanisha kuacha tendo la kikuhani lililokuwa likifanyika.
