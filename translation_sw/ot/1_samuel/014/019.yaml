  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: kitendo cha Sauli kinaendelea wakati ghasia za kambi ya Wafilisti zinaongezeka, kisha anampa kuhani amri ya kusitisha/kuondoa mkono wake. “Ikawa” inafaa kwa וַיְהִי, na “zilizidi kuongezeka” huwasilisha vizuri msisitizo wa maendeleo katika הָלוֹךְ וָרָב.'
