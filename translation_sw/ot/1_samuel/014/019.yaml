base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/019.yaml
  text: And it happened[a], while Saul was speaking to the priest, that the tumult in the camp of the Philistines kept increasing more and more. So Saul said to the priest, “Withdraw your hand.”
translation:
  language: sw
  text: Ikawa, Sauli alipokuwa bado akizungumza na kuhani, ghasia katika kambi ya Wafilisti zilizidi kuongezeka. Basi Sauli akamwambia kuhani, “Rudisha mkono wako.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “Kusanya mkono wako.” Sauli anamwambia kuhani aache tendo alilokuwa akifanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni fomula ya kawaida ya masimulizi inayoendeleza tukio linalofuata; ‘Ikawa’ huhifadhi ladha ya Kiebrania kwa Kiswahili sanifu na cha heshima.
- source_word: עַד דִּבֶּר
  choice: alipokuwa bado akizungumza
  rationale: Muundo unaonyesha kitendo kilichokuwa kikiendelea hadi kikakatizwa; ‘bado’ huifanya maana hiyo iwe wazi bila kulazimisha tafsiri ya kwamba Sauli hakumaliza kusema.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Tafsiri ya moja kwa moja ya כהן; muktadha tayari unamtambulisha kuhani huyo.
- source_word: הֶהָמוֹן
  choice: ghasia
  rationale: Neno hili hapa linahusu vurugu na makelele yaliyochanganyika kambini, si sauti pekee.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: katika kambi ya Wafilisti
  rationale: Huhifadhi uhusiano wa nomino wa Kiebrania kwa Kiswahili cha kawaida na wazi.
- source_word: וַיֵּלֶךְ הָלוֹךְ וָרָב
  choice: zilizidi kuongezeka
  rationale: Muundo huu wa Kiebrania unaonyesha hali iliyokuwa ikiendelea na kuongezeka kwa nguvu; kauli hii ni ya asili katika Kiswahili na huepuka urudiaji usio wa lazima.
- source_word: אֱסֹף יָדֶךָ
  choice: Rudisha mkono wako
  rationale: Huhifadhi taswira halisi ya amri, ‘kusanya/rudisha mkono wako,’ huku ikidokeza kwamba kuhani aache tendo alilokuwa akifanya.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi umehifadhiwa, huku misemo ya Kiebrania ikitolewa kwa lugha inayoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya amri inayofafanuliwa.
