  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa urahisi. Taswira ya “kuyeyuka” na kishazi “na tazama” zimehifadhiwa ili kudumisha uhai na ufupi wa Kiebrania.
