base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/016.yaml
  text: And Saul’s watchmen in Gibeah of Benjamin looked[a], and behold, the multitude was melting away, and it went here and there.
translation:
  language: sw
  text: Walinzi wa Sauli waliokuwa huko Gibea ya Benyamini wakatazama, na tazama, umati ulikuwa ukisambaratika, na ukaendelea kupigana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “umati ulikuwa ukisambaratika, ukisogea huku na huku.” Maneno ya mwisho ya Kiebrania ni mafupi na yana utata: yanaweza kumaanisha kuendelea kupiga au kupigana, au, kwa usomaji mwingine, kusogea huku na huku. Yanaonyesha vurugu miongoni mwa Wafilisti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפִים
  choice: walinzi
  rationale: Neno hili linamaanisha watu waliowekwa mahali ili kutazama na kutoa taarifa. “Walinzi” ni Kiswahili cha kawaida kinachofaa mazingira ya kijeshi.
- source_word: לְשָׁאוּל
  choice: wa Sauli
  rationale: 'Kiambishi ל hapa kinaonyesha uhusiano: walinzi waliokuwa chini ya Sauli au waliomhudumia.'
- source_word: בְּגִבְעַת בִּנְיָמִן
  choice: waliokuwa Gibea ya Benyamini
  rationale: Hutambulisha mahali walipokuwa walinzi; muundo huu ni wa asili katika Kiswahili na unaondoa uwezekano wa kuelewa kwamba Sauli ndiye aliyekuwa Gibea katika kishazi hiki pekee.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Huhifadhi kishindo cha kisimulizi kinachomwelekeza msomaji kwenye jambo lililoonekana ghafla.
- source_word: הֶהָמוֹן
  choice: umati
  rationale: Neno la Kiebrania linaweza kumaanisha umati, kundi kubwa lenye makelele, au jeshi. “Umati” huhifadhi maana yake pana bila kutaja wazi zaidi ya chanzo.
- source_word: נָמוֹג
  choice: ulikuwa unayeyuka
  rationale: Huhifadhi picha ya Kiebrania ya kundi kupoteza mshikamano au ujasiri kana kwamba linayeyuka.
- source_word: וַיֵּלֶךְ וַהֲלֹם
  choice: ukienda huku na huku
  rationale: Hutoa kwa Kiswahili cha kawaida mwendo usio na mwelekeo unaoonekana katika usemi huu mfupi wa Kiebrania.
