base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/038.yaml
  text: Then Saul said[a], “Come here, all you chiefs of the people, and know and see by what this sin has happened today.”
translation:
  language: sw
  text: Kisha Sauli akasema, “Njooni hapa, ninyi viongozi wote wa watu[a], jueni na mwone jinsi dhambi hii ilivyotokea leo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “pembe zote za watu,” msemo unaomaanisha viongozi au wawakilishi wa watu.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּשׁוּ הֲלֹם
  choice: Njooni hapa
  rationale: Kitenzi cha kuamuru kwa wingi pamoja na neno linaloelekeza mahali kinawaita watu wamsogelee Sauli. ‘Njooni hapa’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: כֹּל פִּנּוֹת הָעָם
  choice: ninyi viongozi wote wa watu
  rationale: Kihalisi ni ‘pembe zote za watu,’ lakini huu ni msemo unaowarejelea viongozi au wawakilishi wa watu. Tafsiri ya maana inazuia picha ya ‘pembe’ isieleweke kimakosa.
- source_word: וּדְעוּ וּרְאוּ
  choice: mpate kujua na kuona
  rationale: Vitenzi vyote viwili vimehifadhiwa ili kuonyesha msisitizo wa Kiebrania wa kuchunguza jambo na kulitambua.
- source_word: בַּמָּה
  choice: jinsi
  rationale: Katika muktadha huu, muundo huu unauliza namna au njia ambayo dhambi ilitokea. ‘Jinsi’ ni ya asili katika Kiswahili na haibadili swali kuwa la sababu.
- source_word: הָיְתָה
  choice: ilivyotokea
  rationale: Ingawa kimsingi lina maana ya ‘ilikuwa/ikatokea,’ hapa linaeleza jinsi kosa lilivyotokea katika uchunguzi wa Sauli.
- source_word: הַחַטָּאת הַזֹּאת
  choice: dhambi hii
  rationale: ‘Dhambi’ huhifadhi uzito wa kimaadili na kidini wa חטאת katika simulizi bila kuongeza maelezo yasiyomo.
- source_word: הַיּוֹם
  choice: leo
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya kielezi hiki cha wakati.
theological_decisions:
- issue: Maana ya kimsemo ya ‘pembe zote za watu’
  choice: ninyi viongozi wote wa watu
  alternative: pembe zote za watu; wakuu wote wa watu; wawakilishi wote wa watu
  rationale: Msemo wa Kiebrania haukusudii pembe halisi, bali watu wenye nafasi ya uongozi au uwakilishi miongoni mwa watu. ‘Viongozi’ ni pana kiasi cha kuhifadhi maana hiyo bila kubainisha cheo kisichotajwa.
- issue: Uzito wa kimaadili wa חטאת
  choice: dhambi
  alternative: kosa; uovu; hatia
  rationale: Muktadha unahusu uvunjaji wa wajibu mbele za Mungu. ‘Dhambi’ huhifadhi uzito huo huku ikirejelea tendo lililotendeka, si hali ya hatia pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo ‘mpate kujua na kuona’ umehifadhi vitenzi viwili vya chanzo, na ‘jinsi’ linaonyesha namna bila kuligeuza kuwa swali la sababu.
