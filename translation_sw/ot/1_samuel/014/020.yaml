base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/020.yaml
  text: Then Saul and all the people who were with him were summoned, and they came to the battle[a]. And behold, every man's sword was against his companion[b], with very great confusion.
translation:
  language: sw
  text: Ndipo Sauli na watu wote waliokuwa pamoja naye wakakusanywa, wakaenda hadi kwenye mapambano. Tazama, upanga wa kila mtu ulikuwa dhidi ya mwenzake, kukiwa na machafuko makubwa mno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hofu kubwa sana” au “ghasia kubwa sana.” Neno la Kiebrania linaweza pia kumaanisha taharuki au vurugu kubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֵק
  choice: wakaitwa wakusanyike
  rationale: Kauli ya Niphal inaeleweka hapa kama kuitwa au kukusanywa kwa ajili ya kwenda vitani. Tafsiri hii inadumisha hali ya kutendwa bila kuficha kwamba kitenzi kinaweza pia kuhusishwa na kupiga kelele.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: watu wote waliokuwa pamoja naye
  rationale: Neno עָם linamaanisha watu, ingawa katika muktadha huu ni kikosi cha Sauli. Tafsiri hii inadumisha upana wa neno la Kiebrania bila kulibainisha kupita kiasi kuwa askari.
- source_word: וַיָּבֹאוּ עַד הַמִּלְחָמָה
  choice: wakaenda hadi kwenye mapambano
  rationale: Muundo בוא + עד unaonyesha kufika au kusogea hadi eneo la mapambano, bila kulazimisha maana kwamba tayari walijiingiza moja kwa moja katika kupigana.
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwa ghafla kwenye jambo lililoonekana na Sauli na watu wake, na “Tazama” linadumisha uhai wa simulizi.
- source_word: חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: upanga wa kila mtu ulikuwa dhidi ya mwenzake
  rationale: Hii inadumisha taswira halisi ya Kiebrania, “upanga wa mtu dhidi ya mwenzake,” na kuonyesha mapigano ya wao kwa wao bila kuongeza kwamba walikuwa marafiki.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: machafuko makubwa mno
  rationale: מְהוּמָה linaweza kumaanisha machafuko, hofu kuu, au ghasia. “Machafuko makubwa mno” ni ya kawaida katika Kiswahili na yanabaki na upana wa maana katika muktadha wa vurugu za wao kwa wao.
