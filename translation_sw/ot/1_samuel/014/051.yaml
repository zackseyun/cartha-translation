lexical_decisions:
- source_word: וְ/קִישׁ
  choice: Kishi
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Biblia ya Kiswahili.
- source_word: אֲבִי
  choice: alikuwa baba yake
  rationale: Ni umbo la uhusiano wa nasaba katika kishazi kisicho na kitenzi; Kiswahili cha kawaida huongeza ‘alikuwa’ ili kuunda sentensi kamili na wazi.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: וְ/נֵר
  choice: naye Neri
  rationale: ‘Naye’ huendeleza kwa asili muundo sambamba wa taarifa, na jina limetoholewa kwa tahajia iliyozoeleka.
- source_word: אֲבִי
  choice: alikuwa baba yake
  rationale: Kurudia kirai kamili kunadumisha uwazi na usambamba wa Kiebrania.
- source_word: אַבְנֵר
  choice: Abneri
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: בֶּן
  choice: mwana wa
  rationale: Kielezi cha nasaba kimetafsiriwa moja kwa moja; katika mfuatano wa kisarufi, kirai hiki humtambulisha Abneri kuwa mwana wa Abieli.
- source_word: אֲבִיאֵל
  choice: Abieli
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
theological_decisions:
- issue: Rejeo la kirai ‘mwana wa Abieli’
  choice: Kimeunganishwa kisarufi na Abneri, kama mpangilio wa maneno wa maandishi ya Kiebrania unavyoruhusu moja kwa moja.
  alternative: Kukielewa kwa kuzingatia nasaba pana kuwa Neri ndiye mwana wa Abieli, na hivyo Kishi na Neri ni wana wa Abieli.
  rationale: Aya hii peke yake inaweka בֶּן אֲבִיאֵל mara tu baada ya Abneri, hivyo tafsiri kuu haibadilishi mpangilio huo kimya-kimya. Hata hivyo, 1 Samweli 14:50 na 1 Mambo ya Nyakati 8:33; 9:39 zinaweza kuunga mkono uchanganuzi mwingine wa nasaba, kwa hiyo utata huo umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametoholewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili; muundo wa kishazi umefanywa wa kawaida bila kuficha utata wa nasaba.
