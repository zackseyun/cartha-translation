  text: Kish was the father of Saul[a], and Ner was the father of Abner, the son of Abiel.
translation:
  language: sw
  text: Kishi alikuwa baba yake Sauli,[a] na Neri alikuwa baba yake Abneri, mwana wa Abieli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa maana halisi zaidi: “Kishi, baba yake Sauli; na Neri, baba yake Abneri, mwana wa Abieli.” Kiebrania hakina kitenzi; Kiswahili kinaongeza “alikuwa” ili taarifa ya nasaba iwe sentensi kamili. Katika mfuatano wa Kiebrania, “mwana wa Abieli” inaweza kuhusishwa na Abneri au na Neri; 1 Samweli 14:50 na 1 Mambo ya Nyakati 8:33; 9:39 humtambulisha Neri kuwa mwana wa Abieli.'
