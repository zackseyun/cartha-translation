base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/002.yaml
  text: Saul was staying at the outskirts of Gibeah[a], under the pomegranate tree that is at Migron[b], and the people who were with him were about six hundred men.
translation:
  language: sw
  text: Sauli alikuwa amekaa pembezoni mwa Gibea[a], chini ya mti wa komamanga[b] uliokuwa huko Migroni, nao watu waliokuwa pamoja naye walikuwa wanaume wapatao mia sita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa ameketi ukingoni mwa Gibea.” Kitenzi cha Kiebrania kinaweza kumaanisha kuketi au kukaa/kubaki mahali.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania husema “komamanga”; katika muktadha huu linamaanisha mti wa komamanga.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: alikuwa amekaa
  rationale: Kitenzi יָשַׁב kinaweza kumaanisha kuketi au kukaa/kubaki mahali. “Alikuwa amekaa” ni Kiswahili cha kawaida kinachoweza kubeba maana zote mbili katika muktadha huu wa kijeshi.
- source_word: בִּקְצֵה
  choice: pembezoni mwa
  rationale: Neno קָצֶה humaanisha mwisho, ukingo, au sehemu ya nje. “Pembezoni mwa” linaonyesha eneo la nje la mji bila kulifanya kuwa mpaka maalumu.
- source_word: הַגִּבְעָה
  choice: Gibea
  rationale: Muktadha unaonyesha kwamba hili ni jina la mahali, Gibea, wala si nomino ya kawaida “kilima.”
- source_word: תַּחַת הָרִמּוֹן
  choice: chini ya mkomamanga
  rationale: רִמּוֹן kwa msingi humaanisha komamanga, lakini katika usemi huu wa mahali inarejelea mti wa komamanga. Kiswahili “mkomamanga” hutaja mti huo wazi na kwa kawaida.
- source_word: אֲשֶׁר בְּמִגְרוֹן
  choice: uliokuwa Migroni
  rationale: Kishazi hiki kinaeleweka kwa kawaida kuwa kinauelezea mkomamanga na kutaja mahali ulipokuwa. Kiambishi cha mahali katika “Migroni” ni cha kawaida katika Kiswahili.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: nao watu waliokuwa pamoja naye
  rationale: עָם ni “watu”; ingawa hapa ni katika mazingira ya kijeshi, “watu” halibani maana kuwa askari pekee kuliko maandishi ya Kiebrania.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: wanaume wapatao mia sita
  rationale: Kiambishi כְּ kinaonyesha makadirio, yanayowasilishwa na “wapatao”; אִישׁ baada ya hesabu imetafsiriwa kwa kawaida kuwa “wanaume.”
