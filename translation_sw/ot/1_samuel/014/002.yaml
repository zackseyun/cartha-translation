translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Alikuwa amekaa” limehifadhi uwezekano wa kuketi au kukaa mahali, huku “pembezoni mwa” likitoa maana ya eneo la nje la Gibea kwa mtindo wa kawaida.
