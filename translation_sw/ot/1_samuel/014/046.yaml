  text: Then Saul went up from pursuing the Philistines[a], and the Philistines went to their own place.
translation:
  language: sw
  text: Kisha Sauli akaacha kuwafuatilia Wafilisti[a], nao Wafilisti wakaenda mahali pao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kisha Sauli akajiondoa katika kuwafuata Wafilisti.” Kiebrania kinasema kihalisi, “alipanda kutoka nyuma ya Wafilisti,” nahau ambayo katika muktadha huu humaanisha kuacha kuwafuatilia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: akaacha
  rationale: Ingawa kitenzi עָלָה kwa kawaida humaanisha ‘kupanda’ au ‘kwenda juu,’ pamoja na מֵאַחֲרֵי katika muktadha huu wa kijeshi kinaonyesha kwamba Sauli alikomesha harakati ya kuwafuatilia Wafilisti. ‘Akaacha’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: מֵאַחֲרֵי
  choice: kuwafuatilia
  rationale: Kirai hiki kihalisi ni ‘kutoka nyuma ya.’ Katika muktadha wa mapigano kinahusu kuwa nyuma ya adui kwa lengo la kumfuatilia; ‘kuwafuatilia’ ni usemi wa asili na wazi kwa Kiswahili.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili cha Biblia.
- source_word: הָלְכוּ
  choice: wakaenda
  rationale: Kitenzi הָלַךְ kwa msingi humaanisha ‘kwenda’ au ‘kutembea.’ ‘Wakaenda’ ni tafsiri ya moja kwa moja bila kuongeza dhana ya kurudi ambayo kitenzi chenyewe hailazimishi.
- source_word: לִמְקוֹמָם
  choice: mahali pao
  rationale: מָקוֹם ni ‘mahali,’ na kiambishi cha nafsi ya tatu wingi kinaonyesha ‘pao.’ Tafsiri hii haiongezi maana mahususi zaidi ya ‘nyumbani.’
