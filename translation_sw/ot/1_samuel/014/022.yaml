  yaml_path: translation/ot/1_samuel/014/022.yaml
  text: And every man of Israel who had hidden themselves in the hill country of Ephraim heard that the Philistines had fled[a], and they too joined the pursuit in the battle.
translation:
  language: sw
  text: Nao wanaume wote wa Israeli waliokuwa wamejificha katika nchi ya milima ya Efraimu walisikia kwamba Wafilisti walikuwa wamekimbia; wao pia wakawafuatilia kwa karibu[a] vitani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “wakashikamana nao kwa kuwafuata vitani”; hii ni nahau inayomaanisha kwamba waliwafuatilia Wafilisti waliokuwa wakikimbia kwa karibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אִישׁ יִשְׂרָאֵל
  choice: Nao wanaume wote wa Israeli
  rationale: Muundo wa Kiebrania ni wa mgawanyo, kihalisi ‘kila mwanamume wa Israeli,’ lakini ukiwa na vihusishi vya wingi katika sentensi. ‘Wanaume wote wa Israeli’ ni Kiswahili cha kawaida kinachohifadhi maana ya kundi la wanaume.
- source_word: הַמִּתְחַבְּאִים
  choice: waliokuwa wamejificha
  rationale: Kirai hiki kinaonyesha kwamba walikuwa katika hali ya kujificha kabla ya kusikia habari; wakati timilifu wa Kiswahili unaonyesha mpangilio huo wa masimulizi.
- source_word: בְּהַר אֶפְרַיִם
  choice: katika eneo la milima la Efraimu
  rationale: הַר hapa inaelekea kumaanisha ukanda wa nyanda za juu wa Efraimu, si kilele kimoja. ‘Eneo la milima’ linaeleza jiografia hiyo kwa Kiswahili cha kawaida.
- source_word: שָׁמְעוּ כִּי נָסוּ פְּלִשְׁתִּים
  choice: walisikia kwamba Wafilisti walikuwa wamekimbia
  rationale: Kauli inaripoti habari waliyoipata kwamba Wafilisti tayari walikuwa wamegeuka na kukimbia; ‘walikuwa wamekimbia’ huonyesha kitendo kilichotangulia kusikia kwao.
- source_word: וַיַּדְבְּקוּ ... אַחֲרֵיהֶם
  choice: wakawafuatilia kwa karibu
  rationale: דבק pamoja na אַחֲרֵי katika muktadha wa kijeshi ni nahau ya kuwafuata adui kwa karibu au kwa juhudi. Tafsiri hii inatoa maana ya nahau bila kutumia Kiswahili kigumu cha neno kwa neno.
- source_word: גַם הֵמָּה
  choice: wao pia
  rationale: Maneno haya yanasisitiza kwamba wale waliokuwa wamejificha nao walijiunga na hatua ya kuwafuatilia Wafilisti.
- source_word: בַּמִּלְחָמָה
  choice: vitani
  rationale: Neno hili hapa linarejelea mapigano yaliyokuwa yakiendelea. ‘Vitani’ ni kifupi, cha asili, na kinafaa muktadha wa kijeshi.
