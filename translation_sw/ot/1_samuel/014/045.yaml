  text: וַ/יֹּ֨אמֶר הָ/עָ֜ם אֶל שָׁא֗וּל הֲֽ/יוֹנָתָ֤ן יָמוּת֙ אֲשֶׁ֣ר עָ֠שָׂה הַ/יְשׁוּעָ֨ה הַ/גְּדוֹלָ֣ה הַ/זֹּאת֮ בְּ/יִשְׂרָאֵל֒ חָלִ֗ילָ/ה חַי יְהוָה֙ אִם יִפֹּ֞ל מִ/שַּׂעֲרַ֤ת רֹאשׁ/וֹ֙ אַ֔רְצָ/ה כִּֽי עִם אֱלֹהִ֥ים עָשָׂ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּפְדּ֥וּ הָ/עָ֛ם אֶת יוֹנָתָ֖ן וְ/לֹא מֵֽת־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/045.yaml
  text: But the people said to Saul[a], “Should Jonathan die, who has brought about this great deliverance in Israel? Far from it! As Yahweh lives, not one hair of his head shall fall to the ground, for he has worked with God this day.” So the people redeemed Jonathan[d][c][b], and he did not die.
translation:
  language: sw
  text: Lakini watu wakamwambia Sauli, “Je, Yonathani, ambaye ameleta wokovu huu mkubwa katika Israeli,[a] afe? Hasha![b] Kama Yahwe aishivyo, hata unywele mmoja wa kichwa chake hautaanguka ardhini, kwa maana leo hii ametenda pamoja na Mungu.”[c] Basi watu wakamkomboa Yonathani,[d] naye hakufa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukombozi huu mkubwa” au “ushindi huu mkubwa.” Neno la Kiebrania יְשׁוּעָה linaweza kumaanisha wokovu, ukombozi, au ushindi kutegemea muktadha.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni tamko kali la kukataa, ambalo pia linaweza kutafsiriwa “La hasha!” au “Haiwezekani!”
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “kwa maana leo ametenda pamoja na Mungu.” Usemi huo unaonyesha kwamba tendo la Yonathani lilifanyika kwa kuandamana na msaada au fadhili za Mungu, bila kufafanua zaidi namna ya uhusiano huo.
    reason: preserve_ambiguity
  - marker: d
    text: Au “wakamtoa Yonathani katika hukumu” au “wakamwokoa Yonathani.” Kitenzi cha Kiebrania kina wazo la kumweka huru mtu kutoka katika dai au hukumu iliyokuwa juu yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיוֹנָתָן יָמוּת
  choice: Je, Yonathani ... afe?
  rationale: Kiambishi cha kuuliza pamoja na kitenzi hiki kinaonyesha swali la balagha lenye kupinga kwa ghadhabu hukumu ya kifo; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: הַיְשׁוּעָה הַגְּדוֹלָה הַזֹּאת
  choice: wokovu huu mkubwa
  rationale: Katika mazingira haya ya vita, יְשׁוּעָה ni kuokolewa au kupata ushindi. “Wokovu” huhifadhi wazo la kuokolewa bila kulifanya kuwa ushindi wa kijeshi pekee.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: “Katika” huhifadhi maana ya msingi ya kihusishi ב na kuonyesha eneo au jamii ambamo wokovu huo ulitokea.
- source_word: חָלִילָה
  choice: Hasha!
  rationale: Hili ni tamko kali la kukataa. “Hasha!” ni fupi, lenye heshima, na la kawaida katika Kiswahili bila kuongeza jina la Mungu lisilokuwapo katika neno hili.
- source_word: חַי יְהוָה
  choice: Kama Yahwe aishivyo
  rationale: Huu ni muundo wa kiapo unaothibitisha jambo kwa uhai wa Yahwe; tafsiri hii huhifadhi jina la agano na uzito wa kiapo.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת רֹאשׁוֹ אַרְצָה
  choice: hata unywele mmoja wa kichwa chake hautaanguka ardhini
  rationale: Baada ya muundo wa kiapo, אִם hutoa mkazo wa kukanusha. Nahau hii inaahidi ulinzi kamili, na muundo wa Kiswahili unaeleza hilo kwa kawaida.
- source_word: כִּי עִם אֱלֹהִים עָשָׂה
  choice: kwa maana leo hii ametenda pamoja na Mungu
  rationale: “Pamoja na Mungu” huhifadhi maana ya moja kwa moja ya עִם na mvutano wa usemi wa Kiebrania bila kuufafanua kupita kiasi kuwa msaada, uwakilishi, au ushirika wa aina fulani.
- source_word: וַיִּפְדּוּ הָעָם אֶת יוֹנָתָן
  choice: Basi watu wakamkomboa Yonathani
  rationale: פדה huonyesha kumtoa mtu chini ya dai, hukumu, au hatari. “Wakamkomboa” huhifadhi maana hiyo ya kisheria na ya kuokoa kuliko neno la jumla tu la kumwokoa.
- source_word: וְלֹא מֵת
  choice: naye hakufa
  rationale: Hii hutoa matokeo kwa njia ya moja kwa moja na kufuata uratibu wa sentensi ya Kiebrania bila kuongeza kwamba aliuawa au hakuuawa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya עִם אֱלֹהִים kuhusu tendo la Yonathani
  choice: ametenda pamoja na Mungu
  alternative: ametenda kwa msaada wa Mungu; ametenda kwa ajili ya Mungu
  rationale: Kihusishi עִם kwa kawaida humaanisha “pamoja na.” Tafsiri hiyo huhifadhi utata wa jinsi tendo la Yonathani linavyohusiana na kazi au fadhili za Mungu bila kulazimisha ufafanuzi wa kitheolojia usiotajwa.
- issue: Maana ya יְשׁוּעָה katika mazingira ya vita
  choice: wokovu
  alternative: ukombozi; ushindi
  rationale: “Wokovu” hujumuisha kuokolewa kwa Israeli na matokeo ya ushindi, hivyo haiweke mkazo katika mafanikio ya kijeshi pekee wala kuondoa mwelekeo wa kiungu wa tukio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha umefanywa kuwa wa kawaida katika Kiswahili, huku “Hasha!” na kiapo “Kama Yahwe aishivyo” vikihifadhi nguvu na uzito wa hotuba ya watu.
