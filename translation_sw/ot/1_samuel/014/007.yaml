  yaml_path: translation/ot/1_samuel/014/007.yaml
  text: His armor-bearer said to him, “Do all that is in your heart. Go on; here I am with you, according to your heart.”
translation:
  language: sw
  text: Mbeba silaha zake akamwambia, “Fanya yote yaliyo moyoni mwako. Endelea; mimi niko pamoja nawe, kulingana na moyo wako.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “moyo wangu unaafikiana na wako.” Usemi wa Kiebrania ni mfupi, kihalisi: “tazama, niko pamoja nawe kulingana na moyo wako.”'
    reason: Kufafanua usemi wa Kiebrania usio wa kawaida bila kuondoa uwezekano wake wa kumaanisha kukubaliana na nia ya Yonathani au kumuunga mkono kwa moyo wote.
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: Mbeba silaha zake
  rationale: Kirai hiki kinamtaja mtumishi aliyebeba silaha za Yonathani; tafsiri hii ni ya kawaida, wazi, na inaendeleza umilikaji unaoonyeshwa na kiambishi cha Kiebrania.
- source_word: נְטֵה לָךְ
  choice: Endelea
  rationale: Kitenzi נָטָה kwa msingi wake ni ‘geuka/elekea,’ lakini katika muktadha huu kinampa Yonathani ruhusa ya kuendelea na azimio lake. ‘Endelea’ ni Kiswahili cha asili kisichoongeza mwelekeo ambao maandishi hayautaji wazi.
- source_word: כִּלְבָבֶךָ
  choice: kulingana na moyo wako
  rationale: Tafsiri hii inadumisha taswira na urudiaji wa ‘moyo’ katika Kiebrania, huku ikiacha wazi iwapo maneno hayo yanamaanisha kukubaliana na nia yake au kumuunga mkono kwa moyo wote.
theological_decisions:
- issue: Kiwango cha uungaji mkono kinachoonyeshwa na כִּלְבָבֶךָ
  choice: kulingana na moyo wako
  alternative: ninaunga mkono yote unayotaka kufanya
  rationale: Maandishi ya Kiebrania yana usemi mfupi na wenye uwezekano wa kufasiriwa kwa namna zaidi ya moja. Tafsiri iliyochaguliwa haiufanyi usemi huo kuwa tamko pana zaidi la uungaji mkono kuliko lilivyo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mazungumzo ni rahisi kueleweka, huku urudiaji wa ‘moyo wako’ ukihifadhi taswira ya maandishi ya Kiebrania.
