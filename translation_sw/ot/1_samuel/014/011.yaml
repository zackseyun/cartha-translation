  text: וַ/יִּגָּל֣וּ שְׁנֵי/הֶ֔ם אֶל מַצַּ֖ב פְּלִשְׁתִּ֑ים וַ/יֹּאמְר֣וּ פְלִשְׁתִּ֔ים הִנֵּ֤ה עִבְרִים֙ יֹֽצְאִ֔ים מִן הַ/חֹרִ֖ים אֲשֶׁ֥ר הִתְחַבְּאוּ שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/011.yaml
  text: When the two of them revealed themselves to the Philistine garrison[a], the Philistines said, “Look[b], the Hebrews are coming out of the holes where they had hidden themselves.”
translation:
  language: sw
  text: Wote wawili walipojitokeza mbele ya kikosi cha Wafilisti[a], Wafilisti wakasema, “Tazama, Waebrania wanatoka katika mashimo walimojificha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kituo cha ulinzi cha Wafilisti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגָּלוּ
  choice: walipojitokeza
  rationale: Nifali hapa ina maana ya kujifanya waonekane au kujionyesha. “Walipojitokeza” linaonyesha tendo lao la makusudi kwa Kiswahili cha kawaida.
- source_word: שְׁנֵיהֶם
  choice: wote wawili
  rationale: Linadumisha msisitizo kwamba Yonathani na mchukua silaha wake walifanya hivyo pamoja.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: kikosi cha Wafilisti
  rationale: Katika muktadha huu wa kijeshi, neno linaweza kumaanisha kikosi kilichowekwa mahali au kituo chake. “Kikosi” ni cha asili na hakilazimishi maana ya jengo pekee.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Linahifadhi nguvu ya usemi wa kuvuta fikira kwa lugha yenye heshima na inayoeleweka.
- source_word: עִבְרִים
  choice: Waebrania
  rationale: Linahifadhi jina la kikabila lililotumiwa na Wafilisti badala ya kulibadili kuwa “Waisraeli.”
- source_word: יֹצְאִים
  choice: wanatoka
  rationale: Hali ya kuendelea ya kitenzi inawasilishwa kwa wakati wa sasa kama walivyoona Wafilisti.
- source_word: מִן הַחֹרִים
  choice: katika mashimo
  rationale: “Mashimo” linahifadhi taswira halisi, na labda ya dharau, bila kufafanua kupita kiasi kuwa mapango.
- source_word: אֲשֶׁר הִתְחַבְּאוּ שָׁם
  choice: walimojificha
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba mashimo hayo ndiyo mahali walipojificha na unadumisha maana ya kujificha wenyewe.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. “Walipojitokeza” ni ya asili kuliko tafsiri ya neno kwa neno ya “walijifunua,” huku “Waebrania” likihifadhi mtazamo wa nje wa Wafilisti.
