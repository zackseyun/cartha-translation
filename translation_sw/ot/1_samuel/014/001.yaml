translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Sentensi imeepuka istilahi nzito zisizo za lazima na haijaongeza neno “kipito” katika matini kuu kwa sababu halitajwi wazi katika Kiebrania.
