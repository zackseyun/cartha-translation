base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/001.yaml
  text: One day Jonathan son of Saul said to the young man who carried his armor[a], “Come[b], let us cross over to the Philistine garrison that is on the other side.” But he did not tell his father.
translation:
  language: sw
  text: Siku moja Yonathani mwana wa Sauli akamwambia kijana aliyekuwa akimbebea silaha zake, “Njoo, tuvuke kwenda kwenye kituo cha kijeshi cha Wafilisti[a] kilicho upande ule[b].” Lakini hakumwambia baba yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kikosi cha Wafilisti kilichowekwa hapo.” Neno la Kiebrania linaweza kumaanisha kituo cha kijeshi au kikosi kilichowekwa mahali fulani.
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu, Kiebrania husema, “kilicho ng’ambo ya hiki/hapa.” Kiashiria hicho huenda kinarejelea eneo au kipito kinachoelezwa katika mistari inayofuata.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Siku moja
  rationale: Ni mwanzo wa kawaida wa simulizi unaotaja wakati bila kuongeza kiashiria kisichokuwamo wazi katika Kiebrania.
- source_word: הַנַּעַר נֹשֵׂא כֵלָיו
  choice: kijana aliyembebea silaha zake
  rationale: נַעַר hapa ni kijana mwenye uwezo wa kushiriki katika shughuli za kijeshi, na כֵּלִים inaweza kumaanisha silaha au vifaa; tafsiri hii inaeleza jukumu lake kwa Kiswahili cha kawaida.
- source_word: לְכָה וְנַעְבְּרָה
  choice: Njoo, tuvuke twende
  rationale: Kauli ya kwanza ni mwito wa kuandamana, na ya pili ni himizo la kuvuka pamoja; “tuvuke twende” linaonyesha pia mwelekeo wa kwenda kwenye kituo hicho.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: kituo cha kijeshi cha Wafilisti
  rationale: מַצָּב katika muktadha huu inaweza kuwa kituo cha kijeshi au kikosi kilichowekwa mahali; chaguo hili ni wazi na la kawaida kwa msomaji wa Kiswahili.
- source_word: אֲשֶׁר מֵעֵבֶר הַלָּז
  choice: kilicho upande ule
  rationale: Maneno hayo yanaonyesha mahali upande mwingine bila kutaja wazi “njia ya mlimani” au “kipito”; tafsiri inaacha rejeleo hilo likiwa na kiasi chake cha utata.
- source_word: וּלְאָבִיו לֹא הִגִּיד
  choice: Lakini hakumwambia baba yake
  rationale: “Lakini” linaonyesha tofauti ya kisimulizi, na “hakumwambia” ni namna ya asili ya kutafsiri kitendo cha kutaarifu au kueleza.
