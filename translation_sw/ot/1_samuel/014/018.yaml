base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/018.yaml
  text: Then Saul said to Ahijah[b][a], “Bring the ark of God here,” for the ark of God was that day with the sons of Israel.
translation:
  language: sw
  text: Ndipo Sauli akamwambia Ahiya, “Lilete hapa sanduku la Mungu[a],” kwa maana siku hiyo sanduku la Mungu lilikuwa pamoja na Waisraeli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya mapokeo ya maandishi na watafsiri husoma, “Lete efodi,” badala ya, “Lilete hapa sanduku la Mungu.” Maandishi ya Kiebrania hapa yanasema, “sanduku la Mungu.”
    reason: textual_variant
  - marker: b
    text: Mwisho wa Kiebrania wa mstari huu una sintaksia isiyo kamili; kwa karibu unasema, “kwa maana siku hiyo sanduku la Mungu lilikuwa, na wana wa Israeli ...”
    reason: translation_difficulty
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida na pia unaonyesha kuwa Sauli alimwelekezea Ahiya maneno hayo.
- source_word: לַאֲחִיָּה
  choice: Ahiya
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: הַגִּישָׁה
  choice: Lilete hapa
  rationale: Kauli ya kuamuru katika mzizi נגשׁ katika hali ya kusababisha ina maana ya kuleta karibu; ‘lilete hapa’ ni usemi wa kawaida unaofaa amri hii.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: sanduku la Mungu
  rationale: Hufuata maneno halisi ya Kiebrania bila kuongeza ‘la agano,’ ambayo hayapo katika mstari huu.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha maelezo ya msimulizi yanayoeleza sababu au mazingira ya amri ya Sauli.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Ni tafsiri ya kawaida na ya asili ya kirai hiki cha wakati.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: pamoja na Waisraeli
  rationale: Katika sentensi hii, maana inayokusudiwa inaeleweka kuwa sanduku lilikuwa pamoja na watu wa Israeli; ‘Waisraeli’ ni Kiswahili cha sasa na cha kawaida kuliko tafsiri ya moja kwa moja ‘wana wa Israeli.’
theological_decisions:
- issue: ‘Sanduku la Mungu’ dhidi ya usomaji mbadala ‘efodi’
  choice: sanduku la Mungu
  alternative: efodi
  rationale: Maandishi ya Kiebrania yaliyotolewa yanasema mara mbili ‘sanduku la Mungu.’ Usomaji mbadala umehifadhiwa katika tanbihi badala ya kuingizwa katika matini kuu.
- issue: Uhusiano wa kisarufi katika kifungu cha mwisho
  choice: lilikuwa pamoja na Waisraeli
  alternative: lilikuwa huko siku hiyo, nao Waisraeli...
  rationale: Kifungu cha Kiebrania ni kigumu, lakini muktadha na mapokeo ya tafsiri yanaunga mkono kuelewa kuwa sanduku lilikuwa pamoja na Waisraeli. Tanbihi inadumisha ugumu huo bila kuuficha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na hadhi inayofaa Maandiko. ‘Waisraeli’ limetumiwa kwa lugha ya kawaida ya sasa, huku ‘sanduku la Mungu’ likihifadhi istilahi ya chanzo bila upanuzi wa kimapokeo.
