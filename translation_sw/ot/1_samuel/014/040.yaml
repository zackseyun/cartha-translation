  yaml_path: translation/ot/1_samuel/014/040.yaml
  text: Then he said to all Israel[a], “You be on one side, and I and Jonathan my son will be on the other side.” And the people said to Saul, “Do what seems good in your eyes.”
translation:
  language: sw
  text: Kisha akawaambia Israeli wote, “Ninyi muwe upande mmoja[a], nami pamoja na Yonathani, mwanangu, tuwe upande mwingine.” Watu wakamwambia Sauli, “Fanya lililo jema machoni pako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “muwe upande mmoja … tuwe upande mwingine.” Kiebrania kinatumia kitenzi “kuwa” pamoja na “upande mmoja,” usemi unaotofautisha nafasi ya kundi moja na ya kundi jingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵבֶר אֶחָד
  choice: upande mmoja / upande mwingine
  rationale: Neno עֵבֶר humaanisha upande au eneo la ng’ambo. Katika muktadha huu wa kupiga kura, usemi huo unatofautisha makundi mawili bila kueleza zaidi namna yalivyowekwa.
- source_word: תִּהְיוּ / נִהְיֶה
  choice: mtakuwa / tutakuwa
  rationale: Vitenzi hivi vinatokana na היה, ‘kuwa.’ Tafsiri hii inadumisha ulinganifu wa Kiebrania na haiongezi kwa lazima wazo la kusimama au kujipanga, ingawa hilo linaweza kudokezwa na muktadha.
- source_word: כָּל יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Ni usemi wa kawaida wa jumla unaowarejelea watu wote wa Israeli waliokusanyika.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Inahifadhi wazi uhusiano wa Yonathani na Sauli kama ulivyo katika Kiebrania.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: lile linaloonekana kuwa jema machoni pako
  rationale: Inahifadhi taswira ya nahau ya Kiebrania huku maana ya jambo linalomfaa au kuonekana sawa kwa Sauli ikieleweka katika Kiswahili.
- source_word: עֲשֵׂה
  choice: Fanya
  rationale: Ni amri rahisi inayolingana moja kwa moja na Kiebrania na kuungana kwa kawaida na kishazi kinachofuata.
- source_word: וַיֹּאמֶר / וַיֹּאמְרוּ
  choice: Kisha akawaambia / Watu wakamwambia
  rationale: Inawasilisha kwa mtiririko wa kawaida wa Kiswahili mfuatano wa masimulizi na kubainisha waliosema.
