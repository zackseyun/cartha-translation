translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi imegawanywa mara mbili ili kuepuka uzito, na kiwakilishi cha ngeli ya mwamba kimetumiwa katika “mmoja uliitwa.”
