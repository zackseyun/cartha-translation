  - severity: low
    issue: Tanbihi haitaji uradidi wa usemi wa Kiebrania
    rationale: Chanzo kina ‘jino la mwamba’ mara mbili, kwa kila upande. Tanbihi iliyorekebishwa hufafanua hilo bila kubadili maana.
