base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/004.yaml
  text: Between the passes by which Jonathan sought to cross over to the Philistine garrison[a], there was a crag of rock on one side and a crag of rock on the other side; and the name of the one was Bozez, and the name of the other Seneh.
translation:
  language: sw
  text: Kati ya njia za kupita ambako Yonathani alitaka kuvuka kuelekea kituo cha Wafilisti, kulikuwa na mwamba wenye ncha kali upande mmoja na mwamba wenye ncha kali upande mwingine. Mmoja uliitwa Bozezi, na mwingine uliitwa Sene.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּעְבְּרוֹת
  choice: njia za kupita
  rationale: Neno hili linamaanisha mahali pa kuvukia au kupitia. Katika mazingira haya ya miamba, “njia za kupita” ni ya kawaida na haidokezi bila msingi kwamba kulikuwa na mto.
- source_word: בִּקֵּשׁ ... לַעֲבֹר
  choice: alitaka kutumia kuvuka
  rationale: Muundo huu unaonyesha nia au kusudi la Yonathani la kuvuka; “alitaka kutumia kuvuka” pia unaunganisha wazi nia hiyo na njia zilizotajwa.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: kituo cha Wafilisti
  rationale: Katika muktadha wa kijeshi, neno hili linaweza kumaanisha kituo au kikosi kilichowekwa mahali fulani. “Kituo” ni wazi na hakizidishi maana kwa kudokeza ngome kubwa.
- source_word: שֵׁן הַסֶּלַע
  choice: mwamba wenye ncha kali
  rationale: Kirai hiki ni “jino la mwamba” kwa tafsiri ya moja kwa moja, yaani sehemu ya mwamba inayochomoza kwa ukali. Tafsiri hii inawasilisha umbo hilo kwa Kiswahili cha kawaida.
- source_word: מֵהָעֵבֶר מִזֶּה ... מֵהָעֵבֶר מִזֶּה
  choice: upande mmoja ... upande mwingine
  rationale: Marudio hayo yanaonyesha miamba iliyokuwa katika pande mbili zinazokabiliana za njia ya kupita.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הָאֶחָד
  choice: Mmoja uliitwa ... na mwingine uliitwa
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza majina ya miamba hiyo miwili huku ikihifadhi ulinganifu wa Kiebrania.
- source_word: בּוֹצֵץ
  choice: Bosesi
  rationale: Jina hili limenukuliwa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likikaribia matamshi ya Kiebrania.
- source_word: סֶנֶּה
  choice: Sene
  rationale: Jina la mahali limenukuliwa kwa tahajia ya Kiswahili iliyo karibu na umbo la Kiebrania.
- source_word: וּבֵין
  choice: Kati ya
  rationale: Kiunganishi cha Kiebrania kinaendeleza simulizi, lakini Kiswahili hakihitaji kuanza kwa “na” hapa; “Kati ya” huanzisha maelezo ya mahali kwa ufasaha.
