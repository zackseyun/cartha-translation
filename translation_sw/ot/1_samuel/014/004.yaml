  to: Kati ya njia za kupita ambako Yonathani alitaka kuvuka kuelekea kituo cha Wafilisti, kulikuwa na mwamba wenye ncha kali upande mmoja na mwamba wenye ncha kali upande mwingine. Mmoja uliitwa Bozezi, na mwingine uliitwa Sene.
