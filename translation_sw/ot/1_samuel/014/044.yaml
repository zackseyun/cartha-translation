translation:
  language: sw
  text: Sauli akasema[a], “Mungu na afanye hivyo, na azidishe; kwa maana hakika utakufa, Yonathani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hii ni kauli ya kiapo katika Kiebrania: kwa neno kwa neno, “Mungu na afanye hivyo, na azidishe.” Kiebrania hakitaji wazi tendo linalokusudiwa wala mtendewa wa tendo hilo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Waw-consecutive hapa inaendeleza simulizi na tendo linalofuata; ‘Ndipo’ ni ya kawaida katika Kiswahili cha simulizi bila kuongeza maelezo yasiyokuwapo.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Jina la mtu limetoholewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים וְכֹה יוֹסִף
  choice: Mungu na anitendee hivyo, tena na azidishe
  rationale: Ni kauli maalumu ya kiapo au laana. Tafsiri hii inadumisha nguvu ya kiapo na haibainishi tendo lenyewe ambalo limeachwa bila kutajwa katika Kiebrania.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la Kiebrania lina muundo wa wingi, hapa linamtaja Mungu mmoja anayeombwa atekeleze hukumu ya kiapo.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaunganisha kiapo na tamko la Sauli kuhusu hukumu ya Yonathani, likiwa msingi au maudhui ya kiapo hicho.
- source_word: מוֹת תָּמוּת
  choice: hakika utakufa
  rationale: Muundo wa jina-jinsi lisilo na kikomo pamoja na kitenzi kilichokamilishwa unasisitiza uhakika wa kifo; ‘hakika utakufa’ huwasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: יוֹנָתָן
  choice: Yonathani
  rationale: Jina limetoholewa kwa umbo linalotambulika na lililozoeleka katika mapokeo ya Biblia ya Kiswahili.
theological_decisions:
- issue: Kutafsiri kauli ya kiapo bila kufafanua tendo la laana ambalo halikutajwa
  choice: Mungu na anitendee hivyo, tena na azidishe
  alternative: Mungu na anifanyie hivi na zaidi ya hayo
  rationale: Kiebrania kinaacha tendo linalotishiwa bila kutajwa. Kiswahili kinahitaji mtendewa ili sentensi iwe ya kawaida; ‘anitendee’ huonyesha mtendewa anayeeleweka katika kiapo, lakini ‘hivyo’ bado hakielezi adhabu yenyewe. Tanbihi inaweka wazi hali ya maandishi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Kauli ya kiapo imehifadhiwa kwa mtindo wa kiibada bila kuongeza aina ya adhabu iliyokusudiwa.
