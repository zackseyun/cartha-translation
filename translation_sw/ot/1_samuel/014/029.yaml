  text: Then Jonathan said[a], “My father has troubled the land. See, please, how my eyes have brightened because I tasted a little of this honey.”
translation:
  language: sw
  text: Ndipo Yonathani akasema, “Baba yangu ameitia nchi taabuni. Tazameni, tafadhali, jinsi macho yangu yalivyong'aa[a] kwa sababu nilionja kiasi kidogo cha asali hii.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hii ni nahau ya Kiebrania: “macho yangu yalivyong''aa,” ikimaanisha kwamba nguvu au uchangamfu wake ulirudi baada ya kuonja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָכַר
  choice: ameitia ... taabuni
  rationale: Kitenzi hiki humaanisha kusumbua, kuvuruga, au kuleta taabu. Kauli hii ya Kiswahili inahifadhi maana ya kusababisha taabu bila kuongeza wazo la maangamizi.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: “Nchi” ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu; inaweza kujumuisha eneo pamoja na watu walioathiriwa na kiapo cha Sauli.
- source_word: רְאוּ נָא
  choice: Tazameni, tafadhali
  rationale: Kitenzi ni amri kwa wingi, na נָא hulainisha ombi. “Tazameni, tafadhali” huhifadhi vipengele vyote viwili kwa Kiswahili cha sasa.
- source_word: אֹרוּ עֵינַי
  choice: macho yangu yalivyong'aa
  rationale: Tafsiri hii inahifadhi taswira halisi ya macho huku nahau ikielezwa katika tanbihi kuwa ishara ya kurejea kwa nguvu au uchangamfu.
- source_word: טָעַמְתִּי
  choice: nilionja
  rationale: Kitenzi kinamaanisha kuonja, na hapa kinasisitiza kwamba Yonathani alikula kiasi kidogo tu.
- source_word: מְעַט
  choice: kidogo
  rationale: Neno hili huonyesha kiasi kidogo; mpangilio “asali hii kidogo” ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: דְּבַשׁ הַזֶּה
  choice: asali hii
  rationale: Nomino ni “asali,” si lazima sega la asali, na kiashiria “hii” kinahifadhiwa.
