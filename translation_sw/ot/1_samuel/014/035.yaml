translation:
  language: sw
  text: Sauli akamjengea Yahwe madhabahu; hiyo ilikuwa madhabahu ya kwanza aliyomjengea Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na Kiebrania, “alianza kuijenga—madhabahu kwa Yahwe.” Muundo huo wa Kiebrania hueleweka kwa kawaida kumaanisha kwamba hiyo ilikuwa madhabahu ya kwanza Sauli aliyomjengea Yahwe.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן
  choice: akamjengea
  rationale: Kitenzi בנה humaanisha kujenga. Muundo wa Kiswahili wenye kiambishi cha mtendewa unaonyesha kwa kawaida kwamba madhabahu hayo yaliwekwa wakfu kwa Yahwe.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: מִזְבֵּחַ
  choice: madhabahu
  rationale: Neno la kawaida na lililozoeleka katika Kiswahili kwa mahali pa kutolea dhabihu au sadaka.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Neno hilo linaonyesha madhabahu yaliyowekwa wakfu kwa יהוה; jina la agano linawakilishwa moja kwa moja kwa umbo la Kiswahili ‘Yahwe.’
- source_word: אֹתוֹ הֵחֵל לִבְנוֹת
  choice: hii ndiyo iliyokuwa madhabahu ya kwanza aliyomjengea
  rationale: Ingawa הֵחֵל kwa kawaida ni ‘alianza,’ muundo huu wenye אֹתוֹ unaeleweka vizuri zaidi kama taarifa kwamba haya ndiyo madhabahu ya kwanza Sauli aliyomjengea Yahwe. Tanbihi inadumisha tafsiri ya karibu zaidi na muundo wa Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja. ‘Yahwe’ huhifadhi jina la agano bila kulibadili kuwa cheo.
- issue: Maana ya אֹתוֹ הֵחֵל לִבְנוֹת
  choice: hii ndiyo iliyokuwa madhabahu ya kwanza aliyomjengea Yahwe
  alternative: alianza kuyajenga kuwa madhabahu kwa Yahwe
  rationale: Tafsiri iliyochaguliwa inatoa maana ya nahau inayokubalika sana, huku tafsiri ya karibu zaidi na muundo wa maneno ikihifadhiwa katika tanbihi ili kutoficha utata halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Madhabahu’ limetumiwa kwa upatanisho wa ngeli ya 6 kama ilivyo kawaida katika matumizi ya Kiswahili; sentensi kuu ni ya asili na inayoeleweka kwa urahisi, huku tanbihi ikihifadhi muundo mbadala wa Kiebrania.
