  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בֵּֽ/אלֹהִ֔ים הַֽ/אֵרֵד֙ אַחֲרֵ֣י פְלִשְׁתִּ֔ים הֲ/תִתְּנֵ֖/ם בְּ/יַ֣ד יִשְׂרָאֵ֑ל וְ/לֹ֥א עָנָ֖/הוּ בַּ/יּ֥וֹם הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/037.yaml
  text: Then Saul inquired of God[a], “Should I go down after the Philistines? Will you give them into the hand of Israel?” But he did not answer him that day.
translation:
  language: sw
  text: Kisha Sauli akamwuliza Mungu, “Je, nishuke niwafuate Wafilisti? Je, utawatia mikononi mwa Israeli?[a]” Lakini hakumjibu siku hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utawakabidhi chini ya mamlaka ya Israeli?”
    reason: Hii inaeleza maana ya nahau ya Kiebrania ‘kuwatia katika mkono wa Israeli’ katika mazingira ya vita.
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: akamwuliza Mungu
  rationale: Katika muundo huu, kitenzi שׁאל pamoja na בֵּאלֹהִים humaanisha kumwendea Mungu ili kupata jibu au mwongozo. Kiswahili ‘akamwuliza Mungu’ ni cha kawaida na kinaeleweka katika muktadha huu wa kutafuta uongozi wa Mungu.
- source_word: הַאֵרֵד
  choice: Je, nishuke
  rationale: Umbo la swali pamoja na kitenzi cha nafsi ya kwanza linaonyesha Sauli akiomba mwongozo kuhusu hatua anayopaswa kuchukua. ‘Nishuke’ pia huhifadhi wazo halisi la kushuka lililo katika ירד.
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: niwafuate Wafilisti
  rationale: אַחֲרֵי ni ‘baada ya/nyuma ya’; katika mazingira ya kijeshi inadokeza kuwafuatia maadui. ‘Niwafuate’ huhifadhi usemi wa Kiebrania bila kufafanua kupita kiasi namna ya ufuatiliaji.
- source_word: הֲתִתְּנֵם
  choice: utawatia
  rationale: Katika habari za vita, נתן inaweza kumaanisha kumkabidhi adui katika uwezo wa mwingine. ‘Utawatia’ huungana kwa kawaida na kirai kinachofuata, ‘mikononi mwa Israeli.’
- source_word: בְּיַד יִשְׂרָאֵל
  choice: mikononi mwa Israeli
  rationale: Ingawa Kiebrania kina ‘mkono’ katika umoja, ‘mikononi mwa’ ni nahau ya kawaida ya Kiswahili inayomaanisha kuwa chini ya uwezo au udhibiti wa mtu, huku ikihifadhi taswira ya mkono.
- source_word: וְלֹא עָנָהוּ
  choice: Lakini hakumjibu
  rationale: Kiima hakitajwi wazi katika Kiebrania, lakini muktadha unaelekeza kwa Mungu. Kiswahili pia kinaweza kuacha jina la kiima bila kutajwa, na ‘lakini’ huonyesha tofauti kati ya kuuliza kwa Sauli na kutopata jibu.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Huu ni usemi wa kawaida na wa moja kwa moja wa Kiswahili unaowakilisha kirai cha wakati cha Kiebrania.
theological_decisions:
- issue: Kiima kisichotajwa cha kutomjibu Sauli
  choice: Kiima kimeachwa bila kutajwa kwa jina katika ‘hakumjibu,’ kama ilivyo katika Kiebrania; muktadha unaonyesha kuwa ni Mungu.
  alternative: ‘Lakini Mungu hakumjibu siku hiyo.’
  rationale: Kutotaja tena jina ‘Mungu’ huhifadhi ufupi wa matini ya Kiebrania na mvutano wake wa kisarufi, bila kuficha kwamba muktadha unamtambulisha Mungu kuwa ndiye asiyemjibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Nahau ya kibiblia ‘mikononi mwa’ imehifadhiwa kwa sababu ni ya kawaida katika Kiswahili, huku tanbihi ikifafanua maana yake ya mamlaka.
