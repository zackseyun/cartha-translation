base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/033.yaml
  text: Then they told Saul[a], saying, “Look, the people are sinning against Yahweh by eating over the blood.” And he said, “You have acted treacherously. Roll a large stone to me today.”
translation:
  language: sw
  text: Kisha wakamwambia Sauli, “Tazama, watu wanamkosea Yahwe kwa kula nyama pamoja na damu.[a]” Naye akasema, “Mmetenda kwa hiana. Biringisheni jiwe kubwa mniletee leo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “kwa kula juu ya damu.” Maana yake ni kula nyama ambayo damu yake haijaondolewa ipasavyo.
    reason: Ufafanuzi wa nahau ya Kiebrania na uhifadhi wa maana yake halisi.
lexical_decisions:
- source_word: וַיַּגִּידוּ לְשָׁאוּל לֵאמֹר
  choice: Kisha wakamwambia Sauli
  rationale: Kitenzi cha masimulizi kinaendeleza mfuatano wa matukio. Muundo wa Kiswahili wenye kiambishi cha mtendewa unawasilisha kwa kawaida maana ya kumweleza Sauli; לֵאמֹר haikuhitaji kutafsiriwa kwa neno tofauti kabla ya usemi wa moja kwa moja.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira za msikilizaji kwenye taarifa inayofuata na linafaa katika lugha ya masimulizi yenye hadhi.
- source_word: הָעָם חֹטִאים לַיהוָה
  choice: watu wanamtendea Yahwe dhambi
  rationale: חטא pamoja na ל hapa huonyesha kosa linalofanywa dhidi ya Yahwe. Muundo huu ni wa kawaida na unaonyesha wazi uhusiano wa kosa hilo.
- source_word: לֶאֱכֹל עַל־הַדָּם
  choice: kwa kula nyama pamoja na damu
  rationale: Nahau hiyo inahusu kula nyama ambayo damu yake haijaondolewa ipasavyo. Neno “nyama” linaeleweka kutokana na muktadha na hufanya maana iwe wazi kwa msomaji wa Kiswahili, huku “pamoja na damu” likihifadhi taswira ya Kiebrania.
- source_word: בְּגַדְתֶּם
  choice: Mmetenda kwa hiana
  rationale: בגד huonyesha kutenda kwa kukosa uaminifu au kwa hiana; tafsiri hii inadumisha uzito wa hukumu ya Sauli na pia wingi wa kiima.
- source_word: גֹּלּוּ אֵלַי הַיּוֹם אֶבֶן גְּדוֹלָה
  choice: Biringisheni jiwe kubwa lije kwangu leo
  rationale: Amri גֹּלּוּ ina maana halisi ya kubiringisha. Kiambishi cha wingi katika “Biringisheni” kinaendana na Kiebrania, na “lije kwangu” huonyesha mwelekeo wa אֵלַי kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia moja kwa moja jina la agano יְהוָה. “Yahwe” linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kula עַל־הַדָּם
  choice: kula nyama pamoja na damu
  alternative: kula juu ya damu
  rationale: Maana katika muktadha ni kula nyama bila kuondoa damu ipasavyo. Tafsiri ya neno kwa neno “juu ya damu” inaweza kupotosha kwa Kiswahili, kwa hiyo maana ya nahau imewasilishwa huku tanbihi ikitaja umbo lake halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa urahisi. “Tazama” na “kwa hiana” huhifadhi uzito wa simulizi bila kuwa vya kizamani kupita kiasi.
