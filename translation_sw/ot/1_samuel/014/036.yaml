  text: וַ/יֹּ֣אמֶר שָׁא֡וּל נֵרְדָ֣ה אַחֲרֵי֩ פְלִשְׁתִּ֨ים לַ֜יְלָה וְֽ/נָבֹ֥זָה בָ/הֶ֣ם עַד א֣וֹר הַ/בֹּ֗קֶר וְ/לֹֽא נַשְׁאֵ֤ר בָּ/הֶם֙ אִ֔ישׁ וַ/יֹּ֣אמְר֔וּ כָּל הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עֲשֵׂ֑ה וַ/יֹּ֨אמֶר֙ הַ/כֹּהֵ֔ן נִקְרְבָ֥ה הֲלֹ֖ם אֶל הָ/אֱלֹהִֽים׀׀־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/036.yaml
  text: Then Saul said[a], “Let us go down after the Philistines by night and plunder them until the light of the morning, and let us not leave a man among them.” And they said, “Do whatever seems good in your eyes.” But the priest said, “Let us draw near here to God.”
translation:
  language: sw
  text: Kisha Sauli akasema, “Na tushuke usiku kuwafuata Wafilisti na kuwapora mpaka mwanga wa asubuhi, wala tusimwache hata mtu mmoja miongoni mwao.” Nao wakasema, “Fanya lolote unaloona kuwa jema.” Lakini kuhani akasema, “Na tumkaribie Mungu hapa[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na tumwendee Mungu hapa.” Maneno ya kuhani huenda yanadokeza kutafuta mwongozo wa Mungu kabla ya kuendelea.
    reason: Mbadala wa kileksia na ufafanuzi wa maana inayoweza kudokezwa bila kuiingiza katika maandishi makuu.
lexical_decisions:
- source_word: נֵרְדָה
  choice: Na tushuke
  rationale: Huhifadhi hali ya kuhimiza ya nafsi ya kwanza wingi na maana ya mwelekeo ya kitenzi ירד, huku ikiwa ya kawaida katika Kiswahili.
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: kuwafuata Wafilisti
  rationale: Katika muktadha wa kijeshi, אַחֲרֵי inaonyesha kuwafuata au kuwafuatilia; ‘kuwafuata’ ni wazi na ya asili bila kuongeza ‘kuwashambulia.’
- source_word: לַיְלָה
  choice: usiku
  rationale: Ni matumizi ya kielezi yanayoonyesha wakati wa hatua iliyopendekezwa, bila kuongeza maana mahususi ya ‘usiku huu.’
- source_word: וְנָבֹזָה בָהֶם
  choice: na kuwapora
  rationale: Kitenzi בזז humaanisha kupora au kuteka nyara; ‘kuwapora’ hutoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: mpaka mwanga wa asubuhi
  rationale: Huhifadhi taswira ya Kiebrania ya mwanga wa asubuhi badala ya kuibadili moja kwa moja kuwa ‘mapambazuko.’
- source_word: וְלֹא נַשְׁאֵר בָּהֶם אִישׁ
  choice: wala tusimwache hata mtu mmoja miongoni mwao
  rationale: Huhifadhi mwendelezo wa pendekezo la Sauli, umoja wa אִישׁ, na wazo la kutomwacha yeyote bila kuongeza neno ‘hai,’ ambalo halipo wazi katika Kiebrania.
- source_word: כָּל הַטּוֹב בְּעֵינֶיךָ עֲשֵׂה
  choice: Fanya lolote unaloona kuwa jema
  rationale: Ni Kiswahili cha sasa na cha kawaida kinachowasilisha nahau ya Kiebrania kuhusu uamuzi au ridhaa ya mtu bila tafsiri ngumu ya ‘jema machoni pako.’
- source_word: נִקְרְבָה הֲלֹם אֶל הָאֱלֹהִים
  choice: Na tumkaribie Mungu hapa
  rationale: Huhifadhi kitenzi cha kukaribia, hali ya kuhimiza ya wingi, na kielezi ‘hapa,’ bila kubainisha ibada au njia maalumu ya kutafuta mwongozo.
theological_decisions:
- issue: Kauli ya kuhani huenda inamaanisha kutafuta mwongozo wa Mungu kabla ya vita
  choice: Na tumkaribie Mungu hapa
  alternative: Na tumwulize Mungu hapa
  rationale: Kiebrania kinasema ‘tumkaribie ... Mungu,’ si kwa uwazi ‘tumwulize.’ Tafsiri kuu huhifadhi usemi huo na kuacha maana inayodokezwa bila kuibainisha kupita maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Viunganishi ‘Kisha,’ ‘Nao,’ na ‘Lakini’ vinaendeleza mtiririko wa simulizi na tofauti ya hatua ya kuhani.
