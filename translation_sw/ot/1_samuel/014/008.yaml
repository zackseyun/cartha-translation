base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/008.yaml
  text: Jonathan said[a], “Look, we are crossing over to the men, and we will show ourselves to them.”
translation:
  language: sw
  text: Yonathani akasema, “Tazama, sisi tunavuka kwenda kwa wale watu, nasi tutajionyesha kwao.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Ni utangulizi wa kawaida wa usemi wa moja kwa moja katika simulizi; ‘akasema’ ni Kiswahili cha asili na sahihi.
- source_word: יְהוֹנָתָן
  choice: Yonathani
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira za msikilizaji kwenye mpango unaofuata; ‘Tazama’ linadumisha uzito wa simulizi bila kuwa gumu kueleweka.
- source_word: אֲנַחְנוּ
  choice: sisi
  rationale: Kiwakilishi huru kimetajwa wazi katika Kiebrania kwa msisitizo, kwa hiyo kimehifadhiwa.
- source_word: עֹבְרִים
  choice: tunavuka
  rationale: Umbo la kitenzi linaonyesha tendo linalokusudiwa au lililo karibu kuanza; ‘tunavuka’ ni la kawaida na linahifadhi wazo la kuvuka kuelekea upande mwingine.
- source_word: אֶל הָאֲנָשִׁים
  choice: kwenda kwa wale watu
  rationale: Kirai kinawaelekezea watu maalumu wanaoonekana au waliotajwa katika muktadha; ‘wale watu’ kinaonyesha umaalumu huo kwa Kiswahili cha kawaida.
- source_word: וְנִגְלִינוּ
  choice: nasi tutajionyesha
  rationale: Nifali ya גלה hapa ina maana ya kujifanya waonekane au kujidhihirisha kwa wengine. ‘Tutajionyesha’ ni ya asili na inaonyesha kuwa tendo hilo ni la kukusudia.
- source_word: אֲלֵיהֶם
  choice: kwao
  rationale: Inaonyesha wale watakaowaona Yonathani na mwenzake; ‘kwao’ ni kifupi na cha kawaida katika Kiswahili.
