source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹנָתָ֜ן אֶל הַ/נַּ֣עַר נֹשֵׂ֣א כֵלָ֗י/ו לְכָ/ה֙ וְ/נַעְבְּרָ֗ה אֶל מַצַּב֙ הָ/עֲרֵלִ֣ים הָ/אֵ֔לֶּה אוּלַ֛י יַעֲשֶׂ֥ה יְהוָ֖ה לָ֑/נוּ כִּ֣י אֵ֤ין לַֽ/יהוָה֙ מַעְצ֔וֹר לְ/הוֹשִׁ֥יעַ בְּ/רַ֖ב א֥וֹ בִ/מְעָֽט־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/006.yaml
  text: Then Jonathan said to the young man who carried his armor[a], “Come, let us cross over to the garrison of these uncircumcised men. Perhaps Yahweh will act for us[c][b], for nothing can hinder Yahweh from saving by many or by few.”
translation:
  language: sw
  text: Ndipo Yonathani akamwambia kijana aliyembebea silaha zake, “Njoo, tuvuke kwenda kwenye kituo cha kijeshi[a] cha watu hawa wasiotahiriwa.[b] Huenda Yahwe akatenda kwa ajili yetu, kwa maana hakuna kinachoweza kumzuia Yahwe[c] kuokoa kwa wengi au kwa wachache.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kituo cha mbele.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “hawa wasiotahiriwa”; ni usemi wa shutuma wenye maana inayohusiana na agano.
    reason: cultural_note
  - marker: c
    text: Au “kwa maana kwa Yahwe hakuna kizuizi cha kuokoa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: kijana aliyembebea silaha zake
  rationale: Kirai cha Kiebrania humtaja kijana ‘aliyebeba vifaa/silaha zake.’ Tafsiri hii ni ya kawaida katika Kiswahili na inaonyesha huduma yake kwa Yonathani bila kuifanya kuwa cheo kisichoelezwa moja kwa moja.
- source_word: לְכָה וְנַעְבְּרָה
  choice: Njoo, tuvuke twende
  rationale: Amri ikifuatwa na kauli ya kuhimiza tendo la pamoja huonyesha mwaliko na azimio. ‘Tuvuke twende’ huweka wazi mwendo wa kuvuka kuelekea upande mwingine.
- source_word: מַצַּב
  choice: kituo cha kijeshi
  rationale: Katika muktadha huu neno hilo linamaanisha nafasi au kituo cha jeshi la Wafilisti. ‘Kituo cha kijeshi’ ni wazi kwa msomaji wa sasa, huku ‘kituo cha mbele’ likibaki chaguo linalowezekana.
- source_word: הָעֲרֵלִים
  choice: watu hawa wasiotahiriwa
  rationale: Kivumishi kimetumiwa kama nomino na kina nguvu ya shutuma inayohusiana na agano. Tafsiri ya moja kwa moja huhifadhi maana hiyo badala ya kubadili neno kuwa jina la kabila, ‘Wafilisti.’
- source_word: אוּלַי
  choice: Huenda
  rationale: Neno hili huhifadhi tumaini la Yonathani bila kuonyesha kwamba alijua kwa hakika Yahwe angefanya nini.
- source_word: יַעֲשֶׂה יְהוָה לָנוּ
  choice: Yahwe akatenda kwa ajili yetu
  rationale: Kitenzi cha Kiebrania kina maana pana ya ‘kufanya’; katika muktadha kinadokeza kuingilia kati kwa Yahwe bila kutaja kwa uhakika namna ya tendo hilo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetafsiriwa kwa unukuzi ‘Yahwe,’ si kwa kulibadili kuwa cheo.
- source_word: מַעְצוֹר
  choice: hakuna kinachoweza kumzuia
  rationale: Nomino hiyo huonyesha kizuizi au zuio. Muundo huu ni Kiswahili cha kawaida na huhifadhi wazo kwamba hakuna kizuizi kwa uwezo wa Yahwe wa kuokoa.
- source_word: לְהוֹשִׁיעַ
  choice: kuokoa
  rationale: Kitenzi hiki kinaweza kumaanisha kuokoa au kukomboa katika hatari ya kijeshi. ‘Kuokoa’ huhifadhi upana wa maana yake.
- source_word: בְּרַב אוֹ בִמְעָט
  choice: kwa wengi au kwa wachache
  rationale: Kirai kinatofautisha idadi kubwa na ndogo ya wale ambao kupitia kwao ushindi unaweza kutolewa, bila kuongeza maelezo yasiyopo katika Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la Mungu. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadili kuwa cheo.
- issue: Kutokuwa na uhakika katika אוּלַי
  choice: Huenda Yahwe akatenda kwa ajili yetu
  alternative: Yahwe atatenda kwa ajili yetu
  rationale: Yonathani anaonyesha tumaini lenye ujasiri, lakini si dai la kuwa na uhakika kuhusu tendo la Mungu; ‘huenda’ huhifadhi mvutano huo.
- issue: Nguvu ya neno הָעֲרֵלִים
  choice: watu hawa wasiotahiriwa
  alternative: Wafilisti hawa
  rationale: Neno la asili lina uzito wa kiagano na wa shutuma. Kulibadili tu kuwa jina la kabila kungefuta maana hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kisasa, wenye heshima na unaosomeka kwa urahisi. Muundo ‘aliyembebea silaha zake’ ni wa kawaida kuliko cheo cha jadi, na ‘kituo cha kijeshi’ huepuka neno la kiufundi lisiloeleweka kwa urahisi.
