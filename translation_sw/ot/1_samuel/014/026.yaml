base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/026.yaml
  text: When the people came into the forest[a], behold, there was a flow of honey, but no one put his hand to his mouth[c][b], because the people feared the oath.
translation:
  language: sw
  text: Watu walipoingia msituni, tazama, asali ilikuwa ikitiririka[a]. Lakini hakuna mtu aliyepeleka mkono wake kinywani[b], kwa sababu watu waliogopa kiapo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulikuwa na mtiririko wa asali” au “mkondo wa asali.” Kiebrania kinasema kwa maana halisi, “mtiririko wa asali.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “hakuna mtu aliyepeleka mkono wake kinywani,” yaani, hakuna aliyekula asali hiyo.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema “kiapo.” Katika muktadha, hiki ni kiapo cha Sauli kilichoweka laana juu ya yeyote ambaye angekula kabla ya jioni (tazama 1 Samweli 14:24).
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא הָעָם אֶל הַיַּעַר
  choice: Watu walipofika msituni
  rationale: Kitenzi בוא kinaonyesha kufika au kuingia mahali. “Walipofika msituni” ni Kiswahili cha kawaida na huhifadhi mfuatano wa simulizi bila kulifanya neno עם kuwa mahsusi zaidi kama “wanajeshi.”
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno הנה huvuta fikira za msomaji kwa jambo lililoonekana ghafla. “Tazama” huhifadhi msisitizo na uhai wa simulizi.
- source_word: הֵלֶךְ דְּבָשׁ
  choice: asali ilikuwa ikitiririka
  rationale: Muundo huu unaeleza mwendo au mtiririko wa asali. Tafsiri ya kitenzi ni ya asili zaidi katika Kiswahili kuliko nomino isiyo ya kawaida kama “mtiririko wa asali,” huku tanbihi ikihifadhi sura ya Kiebrania na tafsiri nyingine zinazowezekana.
- source_word: וְאֵין מַשִּׂיג יָדוֹ אֶל פִּיו
  choice: Lakini hakuna mtu aliyepeleka mkono wake kinywani
  rationale: Tafsiri hii huhifadhi picha halisi ya mkono kupelekwa kinywani, badala ya kufasiri moja kwa moja kuwa “hakuna aliyekula.” Kiunganishi “lakini” kinaonyesha tofauti kati ya kuwepo kwa asali na watu kutokuila.
- source_word: כִּי יָרֵא הָעָם אֶת הַשְּׁבֻעָה
  choice: kwa sababu watu waliogopa kiapo
  rationale: כי inatoa sababu, ירא inaeleza kuogopa, na שְׁבֻעָה ni “kiapo.” Tafsiri haibadili “kiapo” kuwa “laana,” ingawa kiapo hicho kilikuwa na adhabu ya laana katika muktadha.
theological_decisions:
- issue: Ikiwa הַשְּׁבֻעָה itafsiriwe “kiapo” au “laana”
  choice: kiapo
  alternative: laana
  rationale: Neno la Kiebrania katika mstari huu ni “kiapo.” Ingawa kiapo cha Sauli kilihusisha laana kwa atakayekula kabla ya jioni, tafsiri kuu inahifadhi istilahi ya chanzo na tanbihi inaeleza muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye hadhi. “Tazama” limetumiwa kuhifadhi msisitizo wa הנה; picha ya mkono kupelekwa kinywani imehifadhiwa katika maandishi makuu na maana yake imefafanuliwa katika tanbihi.
