base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/017.yaml
  text: Then Saul said to the people who were with him[a], “Please take a count and see who has gone from among us.” So they took a count, and behold, Jonathan and his armor-bearer were not there.
translation:
  language: sw
  text: Kisha Sauli akawaambia watu waliokuwa pamoja naye, “Tafadhali fanyeni hesabu[a], na mwone ni nani aliyeondoka miongoni mwetu.” Basi wakafanya hesabu, na kumbe Yonathani na mchukua silaha wake hawakuwapo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakagueni”; kitenzi cha Kiebrania kinaweza kumaanisha kukagua au kuhesabu watu waliopo.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּקְדוּ / וַיִּפְקְדוּ
  choice: wahakikini walio hapa / wakawahakiki
  rationale: Katika muktadha huu, kitenzi kinamaanisha kukagua au kuhesabu watu waliopo ili kujua aliyekosekana. ‘Kuwahakiki walio hapa’ ni Kiswahili cha kawaida kinachobeba wazo hilo bila kudokeza uteuzi au adhabu.
- source_word: נָא
  choice: Tafadhali
  rationale: Neno hili hulainisha amri na kuipa nguvu ya ombi; ‘tafadhali’ linaonyesha hilo kwa Kiswahili cha sasa.
- source_word: וּרְאוּ
  choice: muone
  rationale: Huhifadhi mlolongo wa maagizo na hapa humaanisha kubaini kutokana na uhakiki.
- source_word: מִי הָלַךְ מֵעִמָּנוּ
  choice: ni nani aliyeondoka miongoni mwetu
  rationale: Kauli hii inaonyesha kuondoka katika kundi; ‘miongoni mwetu’ huhifadhi maana ya jumuiya iliyomo katika Kiebrania.
- source_word: וְהִנֵּה
  choice: na kumbe
  rationale: ‘Kumbe’ huonyesha ugunduzi wa jambo la kutazamika kwa njia ya asili katika simulizi la Kiswahili.
- source_word: אֵין יוֹנָתָן וְנֹשֵׂא כֵלָיו
  choice: Yonathani na mchukua-silaha wake hawakuwapo
  rationale: Hii ni njia ya kawaida na wazi ya kueleza kutokuwapo kwa watu hao wawili.
- source_word: נֹשֵׂא כֵלָיו
  choice: mchukua-silaha wake
  rationale: Kirai hiki kinamtaja mhudumu wa kijeshi aliyembebea Yonathani silaha zake; tafsiri hii ni wazi na yenye hadhi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inafuata kwa karibu mtiririko wa Kiebrania huku ikitumia usemi wa kawaida; ‘na kumbe’ huhifadhi nguvu ya ugunduzi ya וְהִנֵּה. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
