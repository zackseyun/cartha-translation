base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/012.yaml
  text: And the men of the garrison answered Jonathan and his armor-bearer and said[a], “Come up to us, and we will tell you something.” Then Jonathan said to his armor-bearer, “Come up after me[d][c][b], for Yahweh has given them into the hand of Israel.”
translation:
  language: sw
  text: Watu wa kituo cha jeshi[a] wakawajibu Yonathani na mchukua silaha zake, wakisema, “Pandeni huku tulipo, nasi tutawaambia jambo fulani.” Kisha Yonathani akamwambia mchukua silaha zake, “Panda nyuma yangu, kwa maana Yahweh amewatia mkononi mwa Israeli.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa kituo cha walinzi.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “amewatia mkononi mwa Israeli”; nahau hii humaanisha amewaweka chini ya mamlaka ya Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הַמַּצָּבָה
  choice: Watu wa kituo cha jeshi
  rationale: Katika muktadha huu wa kijeshi, מַצָּבָה ni mahali palipowekwa kikosi, yaani kituo cha jeshi au cha walinzi, wala si nguzo ya ukumbusho.
- source_word: נֹשֵׂא כֵלָיו
  choice: mchukua silaha zake
  rationale: Kirai hiki humaanisha kihalisi mtu anayebeba vifaa au silaha za mkuu wake. Tafsiri hii ni ya wazi na ya kawaida katika Kiswahili.
- source_word: עֲלוּ אֵלֵינוּ
  choice: Pandeni huku tulipo
  rationale: Kitenzi עלה kinaonyesha kupanda kuelekea mahali pa juu walipokuwa Wafilisti; “huku tulipo” huhifadhi mtazamo wa wasemaji kwa Kiswahili cha asili.
- source_word: וְנוֹדִיעָה אֶתְכֶם דָּבָר
  choice: nasi tutawaambia jambo fulani
  rationale: Hifili ya ידע hapa ni kumjulisha mtu. “Jambo fulani” huhifadhi kutotajwa wazi kwa דָּבָר huku sentensi ikibaki ya kawaida kwa Kiswahili.
- source_word: עֲלֵה אַחֲרַי
  choice: Panda nyuma yangu
  rationale: Amri iko katika umoja na inaonyesha kupanda huku mchukua silaha akimfuata Yonathani.
- source_word: כִּי נְתָנָם יְהוָה
  choice: kwa maana Yahweh amewatia
  rationale: Kauli timilifu inaonyesha uhakika wa Yonathani kwamba ushindi tayari umetolewa; “amewatia” inaingia kwa kawaida katika nahau inayofuata ya kutiwa mkononi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania linawakilishwa kama jina binafsi, si kubadilishwa na cheo.
- source_word: בְּיַד יִשְׂרָאֵל
  choice: mkononi mwa Israeli
  rationale: Hii huhifadhi mfano wa Kiebrania wa “mkono” unaomaanisha mamlaka au uwezo wa kumshinda adui, na bado inaeleweka katika Kiswahili.
theological_decisions:
- issue: Uwakilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. “Yahweh” hulihifadhi badala ya kuliweka kwa cheo.
- issue: Kauli kwamba adui ametolewa kabla ya mapigano
  choice: amewatia mkononi mwa Israeli
  alternative: atawatia mkononi mwa Israeli
  rationale: Kiebrania kinatumia kauli timilifu נְתָנָם. Tafsiri ya wakati uliotimia huhifadhi uhakika wa imani ya Yonathani bila kuibadili kuwa ahadi ya wakati ujao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ya Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Amri za kupanda na tofauti ya wingi na umoja zimehifadhiwa.
