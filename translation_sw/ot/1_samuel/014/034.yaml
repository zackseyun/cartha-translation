  text: וַ/יֹּ֣אמֶר שָׁא֣וּל פֻּ֣צוּ בָ/עָ֡ם וַ/אֲמַרְתֶּ֣ם לָ/הֶ֡ם הַגִּ֣ישׁוּ אֵלַ/י֩ אִ֨ישׁ שׁוֹר֜/וֹ וְ/אִ֣ישׁ שְׂיֵ֗/הוּ וּ/שְׁחַטְתֶּ֤ם בָּ/זֶה֙ וַ/אֲכַלְתֶּ֔ם וְ/לֹֽא תֶחֶטְא֥וּ לַֽ/יהוָ֖ה לֶ/אֱכֹ֣ל אֶל הַ/דָּ֑ם וַ/יַּגִּ֨שׁוּ כָל הָ/עָ֜ם אִ֣ישׁ שׁוֹר֧/וֹ בְ/יָד֛/וֹ הַ/לַּ֖יְלָה וַ/יִּשְׁחֲטוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/034.yaml
  text: And Saul said[a], “Spread out among the people and tell them, ‘Each man must bring me his ox and each man his sheep, and you must slaughter them here and eat, so that you may not sin against Yahweh by eating with the blood.’” So all the people brought, each man his ox in his hand that night[b], and they slaughtered them there.
translation:
  language: sw
  text: Sauli akasema, “Tawanyikeni kati ya watu na kuwaambia, ‘Kila mmoja aniletee ng’ombe wake, na kila mmoja kondoo wake. Wachinjieni hapa, kisha mle, msije mkamtendea Yahweh dhambi kwa kula pamoja na damu[a].’” Basi usiku huo watu wote wakaleta ng’ombe zao, kila mmoja akiwa naye mkononi[b], nao wakawachinjia pale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa maana halisi, “kwa kula pamoja na/juu ya damu”; yaani, kula nyama kabla damu haijatolewa vizuri.
    reason: lexical_alternative
  - marker: b
    text: Au, “kila mmoja akimwongoza ng’ombe wake kwa mkono.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֻּצוּ בָעָם
  choice: Tawanyikeni kati ya watu
  rationale: Kitenzi פוץ kina wazo la kutawanyika au kuenea. Amri hii inawaelekeza wajumbe waende sehemu mbalimbali kati ya watu.
- source_word: הַגִּישׁוּ אֵלַי
  choice: aniletee
  rationale: Hiphil ya נגשׁ hapa humaanisha kuleta karibu au kuwasilisha; “aniletee” ni Kiswahili cha kawaida katika muktadha huu.
- source_word: אִישׁ שׁוֹרוֹ וְאִישׁ שְׂיֵהוּ
  choice: Kila mmoja aniletee ng’ombe wake, na kila mmoja kondoo wake
  rationale: Kurudiwa kwa אִישׁ kunaonyesha mgawanyo kwa kila mtu. שֶׂה inaweza kuwa kondoo au mbuzi, lakini “kondoo” ni tafsiri fupi na ya kawaida hapa.
- source_word: וּשְׁחַטְתֶּם בָּזֶה
  choice: Wachinjieni hapa
  rationale: שׁחט ni kuchinja mnyama, si kuua kwa ujumla. בָּזֶה imetafsiriwa kwa maana ya mahali, “hapa.”
- source_word: וְלֹא תֶחֶטְאוּ לַיהוָה
  choice: msije mkamtendea Yahweh dhambi
  rationale: Muundo huu unaonyesha kusudi la kuzuia dhambi. לַיהוָה inaeleza kwamba kosa hilo linamwelekea Yahweh.
- source_word: לֶאֱכֹל אֶל־הַדָּם
  choice: kwa kula pamoja na damu
  rationale: Tafsiri hii inabaki karibu na nahau yenye utata “kula pamoja na/juu ya damu,” huku tanbihi ikieleza maana inayowezekana katika muktadha.
- source_word: אִישׁ שׁוֹרוֹ בְיָדוֹ הַלַּיְלָה
  choice: usiku huo ... kila mmoja akiwa naye mkononi
  rationale: “Usiku huo” ni Kiswahili cha kawaida kwa הַלַּיְלָה. “Akiwa naye mkononi” huhifadhi taswira ya Kiebrania, ambayo huenda ikamaanisha kumwongoza mnyama kwa mkono.
- source_word: וַיִּשְׁחֲטוּ שָׁם
  choice: nao wakawachinjia pale
  rationale: Kitu cha kuchinjwa kinaeleweka kutokana na wanyama waliotajwa; kiwakilishi cha yambwa kimeongezwa kwa uwazi wa Kiswahili.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יְהוָה; “Yahweh” hulitambulisha kama jina maalumu bila kulibadili kuwa cheo.
- issue: Maana ya kula אֶל־הַדָּם
  choice: kwa kula pamoja na damu
  alternative: kwa kula nyama kabla damu haijatolewa vizuri
  rationale: Maandishi yana nahau yenye maana halisi “pamoja na/juu ya damu.” Tafsiri kuu inahifadhi mvutano huo, na tanbihi inaeleza maana inayodokezwa na muktadha bila kuiingiza moja kwa moja katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. “Tawanyikeni kati ya watu” huhifadhi picha ya wajumbe kuenea kambini; “wachinjieni” hutofautisha uchinjaji wa chakula na kuua kwa ujumla.
