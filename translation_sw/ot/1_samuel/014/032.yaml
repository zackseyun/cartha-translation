base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/032.yaml
  text: Then the people rushed upon the spoil and took sheep and cattle and calves[a], and they slaughtered them on the ground[b], and the people ate with the blood.
translation:
  language: sw
  text: Ndipo watu wakazirukia nyara[a], wakachukua kondoo, ng’ombe na ndama. Wakawachinja ardhini, nao watu wakala nyama pamoja na damu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakaziangukia nyara kwa pupa.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, walikula nyama damu ikiwa bado ndani yake, bila damu kuondolewa ipasavyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶל שָׁלָל
  choice: wakazirukia nyara
  rationale: Kirai hiki katika muktadha kinaonyesha watu kuziendea nyara kwa pupa baada ya vita. “Kuzirukia” ni Kiswahili cha kawaida kinachoonyesha haraka na kukosa kiasi bila kuongeza maelezo yasiyo katika maandishi.
- source_word: שָׁלָל
  choice: nyara
  rationale: “Nyara” ni neno la kawaida la kijeshi kwa mali au vitu vilivyotekwa vitani, na hapa linajumuisha wanyama waliotwaliwa.
- source_word: צֹאן
  choice: kondoo
  rationale: Katika orodha hii ya wanyama, “kondoo” ni tafsiri ya wazi na ya kawaida; ingawa neno la Kiebrania linaweza pia kuashiria kundi la mifugo midogo.
- source_word: בָּקָר
  choice: ng’ombe
  rationale: Neno hili linahusu jamii ya ng’ombe kwa upana. “Ng’ombe” linafaa kwa Kiswahili cha kawaida bila kubainisha jinsia.
- source_word: בְּנֵי בָקָר
  choice: ndama
  rationale: Maana ya moja kwa moja ni watoto wa ng’ombe; “ndama” ni usemi wa asili na mfupi wa Kiswahili.
- source_word: וַיִּשְׁחֲטוּ אָרְצָה
  choice: wakawachinja chini
  rationale: Kielezi אָרְצָה kinaonyesha kuchinja chini au juu ya ardhi. Kiwakilishi “-wa-” kinarejelea wanyama waliotajwa katika sentensi iliyotangulia.
- source_word: עַל־הַדָּם
  choice: pamoja na damu
  rationale: Kiebrania ni kifupi na kinaweza kutafsiriwa kihalisi kwa namna kadhaa. “Pamoja na damu” huhifadhi dai la msingi kwamba nyama ililiwa damu ikiwa bado haijaondolewa, bila kulipanua katika matini kuu.
theological_decisions:
- issue: Kiwango cha kufafanua kosa linalodokezwa na עַל־הַדָּם
  choice: pamoja na damu
  alternative: damu ikiwa bado ndani yake
  rationale: Matini kuu inadumisha ufupi na mvutano wa Kiebrania. Maelezo ya chini yanafafanua kuwa nyama haikuwa imeondolewa damu ipasavyo, jambo linalohusiana na katazo la kula damu, bila kuingiza ufafanuzi huo wote ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa kwa Maandiko. Vitenzi vinavyofuatana kwa “waka-” vinaakisi mfululizo wa haraka wa matendo katika simulizi la Kiebrania. “Nyara” limetumiwa katika maana yake ya kijeshi, na “nyama” limeongezwa kabla ya “pamoja na damu” ili sentensi iwe wazi na ya asili kwa msomaji wa Kiswahili.
