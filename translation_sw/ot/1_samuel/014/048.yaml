translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. Nahau za Kiebrania zimehifadhiwa pale zinapoeleweka, na zimefafanuliwa katika tanbihi pale ambapo tafsiri ya neno kwa neno ingekuwa ngumu au isiyo ya kawaida.
