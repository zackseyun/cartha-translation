base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/048.yaml
  text: He fought valiantly and struck Amalek[c][b][a], and he delivered Israel from the hand of those who plundered it.
translation:
  language: sw
  text: Akapigana kwa ushujaa[a], akawapiga Waamaleki[b], na akaiokoa Israeli kutoka mikononi mwa waliokuwa wakiipora.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, Kiebrania kinasema ‘alifanya nguvu/ushujaa,’ yaani alitenda kwa uhodari au akafanikiwa vitani.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema ‘Amaleki,’ jina la umoja linalowarejelea Waamaleki kama taifa.
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, Kiebrania kinasema ‘kutoka mkononi mwa mporaji wake.’ ‘Israeli’ linachukuliwa kama jina la taifa, na ‘mporaji’ linaeleweka kwa maana ya kijumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ חַיִל
  choice: Akapigana kwa ushujaa
  rationale: Kirai hiki cha Kiebrania, kwa maana halisi ‘alifanya nguvu/ushujaa,’ ni nahau ya kutenda kwa uhodari au kufanikiwa vitani. Katika muktadha huu, ‘akapigana kwa ushujaa’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וַיַּךְ
  choice: akawapiga
  rationale: Kitenzi נכה kinaweza kumaanisha kupiga, kushambulia, au kushinda. ‘Akawapiga’ kinahifadhi taswira ya Kiebrania na kinafaa katika simulizi la vita.
- source_word: עֲמָלֵק
  choice: Waamaleki
  rationale: Kiebrania kinatumia jina la umoja ‘Amaleki’ kwa maana ya taifa au watu wake. Kiswahili cha kawaida hutumia ‘Waamaleki’ ili kuonyesha wazi kwamba waliopigwa ni watu wa taifa hilo.
- source_word: וַיַּצֵּל
  choice: akaiokoa
  rationale: Katika kausativi, נצל humaanisha kunyakua kutoka hatarini, kuokoa, au kukomboa. ‘Akaiokoa’ ni wazi na haiongezi maana ya kiitikadi isiyokuwamo katika muktadha.
- source_word: מִיַּד
  choice: kutoka mikononi mwa
  rationale: Nahau ya Kiebrania ‘kutoka mkononi mwa’ humaanisha kutoka katika mamlaka au udhibiti wa mtu. Wingi ‘mikononi’ ni wa kawaida katika Kiswahili, huku taswira ya chanzo ikihifadhiwa.
- source_word: שֹׁסֵהוּ
  choice: waliokuwa wakiipora
  rationale: Neno hili humaanisha anayepora au kuteka nyara mali. Ingawa Kiebrania kina umbo la umoja lenye kiambishi kinachorejelea Israeli, maana yake hapa ni ya kijumla; Kiswahili cha wingi huwasilisha jambo hilo kwa kawaida.
