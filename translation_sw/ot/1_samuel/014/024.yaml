base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/024.yaml
  text: The men of Israel were hard-pressed that day[a], and Saul put the people under an oath, saying, “Cursed is the man who eats food before evening, before I have avenged myself on my enemies.” So none of the people tasted food.
translation:
  language: sw
  text: Siku hiyo Waisraeli walikuwa katika dhiki, na Sauli akawaapisha watu, akisema, “Alaaniwe mtu atakayekula chakula[a] kabla ya jioni, kabla sijajilipizia kisasi kwa adui zangu.” Kwa hiyo, hakuna hata mmoja wa watu aliyeonja chakula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mkate” hapa na mwishoni mwa mstari; yaelekea neno hilo linamaanisha chakula kwa ujumla, si mkate pekee.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגַּשׂ
  choice: walikuwa katika dhiki
  rationale: Katika muktadha huu, umbo la Niphal linaeleza kusongwa au kuwa chini ya shinikizo, si kukaribia mahali.
- source_word: וַיֹּאֶל שָׁאוּל אֶת הָעָם
  choice: Sauli akawaweka watu chini ya kiapo
  rationale: Kauli inayofuata ya laana inaonyesha kuwa Sauli aliwafunga watu kwa kiapo chenye masharti; usemi huu unahifadhi nguvu hiyo bila kutumia lugha ya kizamani.
- source_word: הָעָם
  choice: watu
  rationale: Neno la kawaida la Kiebrania ni ‘watu’; hapa linawahusu wapiganaji wa Sauli, lakini tafsiri pana inadumisha usemi wa chanzo.
- source_word: אָרוּר הָאִישׁ
  choice: Alaaniwe mtu
  rationale: Huu ni usemi wa kawaida na wenye hadhi wa kutamka laana, huku ‘mtu’ ikihifadhi umoja wenye maana ya jumla.
- source_word: יֹאכַל לֶחֶם / טָעַם ... לָחֶם
  choice: atakayekula chakula / aliyeonja chakula
  rationale: Ingawa לֶחֶם kimsingi ni ‘mkate’, hapa ni nahau inayomaanisha chakula kwa ujumla; ‘kuonja’ inadumishwa katika tukio la pili kwa ajili ya uhai wa usemi wa chanzo.
- source_word: עַד הָעֶרֶב
  choice: kabla ya jioni
  rationale: Katika katazo hili, usemi unaweka jioni kuwa mpaka wa muda ambao kabla yake kula kumekatazwa.
- source_word: וְנִקַּמְתִּי מֵאֹיְבַי
  choice: kabla sijajilipizia kisasi juu ya adui zangu
  rationale: Tafsiri inadumisha nafsi ya kwanza na msisitizo wa Sauli wa kujilipizia kisasi, huku ikionyesha uhusiano wa muda na katazo la kula.
- source_word: וְלֹא טָעַם כָּל הָעָם
  choice: hakuna hata mmoja wa watu aliyeonja
  rationale: Hii ni Kiswahili cha kawaida kinachowasilisha kwa usahihi ukanushaji wa kundi lote.
