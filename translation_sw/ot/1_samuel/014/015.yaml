base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/015.yaml
  text: And there was trembling in the camp[a], in the field, and among all the people; the garrison and the raiding party also trembled. And the earth quaked, so that it became a trembling from God.
translation:
  language: sw
  text: Kukawa na hofu kambini, mashambani, na miongoni mwa watu wote; kikosi cha ngome na kikosi cha wavamizi, wao pia wakatetemeka. Nchi ikatikisika, ikawa hofu iliyotoka kwa Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hofu kubwa sana” au “hofu ya kimungu.” Kirai cha Kiebrania kinaweza kuonyesha chanzo, yaani “kutoka kwa Mungu,” au kusisitiza ukubwa wa hofu.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲרָדָה / חָרְדוּ
  choice: tetemeko / wakatetemeka
  rationale: Maneno haya yanaonyesha kutetemeka kunakotokana na hofu. Kurudia mzizi ‘tetem-’ kunahifadhi mwangwi wa maneno ya Kiebrania na pia kunaunganisha hofu ya watu na kutikisika kwa nchi.
- source_word: בַמַּחֲנֶה
  choice: kambini
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya mahali lilipokuwa jeshi.
- source_word: בַשָּׂדֶה
  choice: uwanjani
  rationale: Katika muktadha huu wa kijeshi, neno hili linaonyesha eneo la wazi nje ya makao; ‘uwanjani’ ni la asili katika Kiswahili huku likibaki karibu na maana ya msingi.
- source_word: וּבְכָל הָעָם
  choice: na miongoni mwa watu wote
  rationale: עָם linaweza kumaanisha watu au wanajeshi. ‘Watu wote’ linahifadhi upana wa neno la Kiebrania bila kulifanya liwe la kijeshi kuliko ilivyo lazima.
- source_word: הַמַּצָּב
  choice: walinzi wa kituoni
  rationale: Neno hili humaanisha kikosi kilichowekwa katika kituo au ngome. Chaguo hili ni wazi kwa msomaji wa kawaida na linafaa katika muktadha wa kijeshi.
- source_word: הַמַּשְׁחִית
  choice: kikosi cha wavamizi
  rationale: Ingawa umbo hilo kwa uhalisi linaweza kumaanisha ‘mwangamizaji,’ hapa linaelekea kutaja kikosi kilichotumwa kuvamia na kuharibu.
- source_word: וַתִּרְגַּז הָאָרֶץ
  choice: Nayo nchi ikatikisika
  rationale: רגז hapa inaonyesha kutikisika kwa ardhi. ‘Nchi ikatikisika’ ni ya kawaida na inadumisha kupanda kwa tukio kutoka hofu ya watu hadi mtikisiko wa ardhi.
- source_word: לְחֶרְדַּת אֱלֹהִים
  choice: tetemeko lililotoka kwa Mungu
  rationale: Muundo huu unaweza kuonyesha chanzo cha tetemeko au ukubwa wake usio wa kawaida. Tafsiri kuu inaweka wazi uwezekano wa chanzo cha kimungu, huku maana ya kiwango ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya לְחֶרְדַּת אֱלֹהִים
  choice: tetemeko lililotoka kwa Mungu
  alternative: tetemeko kubwa sana; hofu ya kimungu
  rationale: Kirai cha Kiebrania kinaweza kueleweka kuwa Mungu ndiye chanzo au kuwa ni namna ya kusisitiza ukubwa wa tukio. Tafsiri kuu inahifadhi maana ya chanzo bila kudai zaidi ya maneno yenyewe, na tanbihi inahifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kurudiwa kwa ‘tetemeko/wakatetemeka’ kumetumiwa kwa makusudi ili kuhifadhi urudiaji wa mzizi wa Kiebrania; istilahi za kijeshi zimeelezwa kwa maneno yanayoeleweka kwa urahisi.
