base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/047.yaml
  text: 'Saul had secured the kingship over Israel[a], and he fought against all his enemies on every side: against Moab, against the Ammonites, against Edom, against the kings of Zobah, and against the Philistines. Wherever he turned, he inflicted punishment.'
translation:
  language: sw
  text: 'Sauli alishika utawala juu ya Israeli, akapigana na maadui wake wote pande zote: dhidi ya Moabu, Waamoni, Edomu, wafalme wa Soba, na Wafilisti. Popote alikoelekea, aliwaadhibu[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana ya karibu zaidi, “aliwahukumu kuwa na hatia.” Kitenzi cha Kiebrania kinaweza kumaanisha kutangaza mtu kuwa na hatia; hapa huenda kinamaanisha kuwaadhibu maadui kwa kuwashinda vitani.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד הַמְּלוּכָה
  choice: aliimarisha utawala wake wa kifalme
  rationale: Kitenzi לָכַד kwa msingi humaanisha kukamata au kutwaa, lakini hapa pamoja na הַמְּלוּכָה kinaelekea kueleza Sauli kupata mshiko thabiti wa mamlaka ya kifalme. ‘Aliimarisha’ huepuka kudokeza unyang’anyi wa utawala, huku ‘utawala wake wa kifalme’ ikionyesha kwamba maana ni mamlaka ya mfalme, si eneo la nchi.
- source_word: עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: Usemi huu unaonyesha eneo la mamlaka ya Sauli; ‘juu ya Israeli’ ni wa karibu na Kiebrania na unaeleweka katika sajili ya kibiblia ya Kiswahili.
- source_word: וַיִּלָּחֶם סָבִיב בְּכָל אֹיְבָיו
  choice: akapigana na maadui wake wote pande zote
  rationale: ‘Akapigana’ hudumisha mfuatano wa masimulizi, na ‘pande zote’ huwakilisha סָבִיב kwa lugha ya kawaida. Kiswahili hutumia kwa asili ‘kupigana na’ kwa mpinzani.
- source_word: בְּמוֹאָב וּבִבְנֵי עַמּוֹן וּבֶאֱדוֹם וּבְמַלְכֵי צוֹבָה וּבַפְּלִשְׁתִּים
  choice: dhidi ya Moabu, Waamoni, Edomu, wafalme wa Soba, na Wafilisti
  rationale: ‘Dhidi ya’ huonyesha wazi uhusiano wa uadui katika orodha. ‘Waamoni’ ni Kiswahili cha asili kwa ‘wana wa Amoni,’ na wingi ‘wafalme wa Soba’ unahifadhi מַלְכֵי ya Kiebrania.
- source_word: וּבְכֹל אֲשֶׁר יִפְנֶה
  choice: Kila alikoelekea
  rationale: Huu ni usemi wa Kiswahili ulio wazi na wa kawaida unaohifadhi maana ya mahali au upande wowote Sauli alikoelekea.
- source_word: יַרְשִׁיעַ
  choice: aliwaadhibu
  rationale: Hiphil ya רשע ni ngumu hapa; inaweza kumaanisha kutangaza kuwa na hatia au kutendea kama mwenye hatia. Katika muktadha wa vita, ‘aliwaadhibu’ huwasilisha hukumu yenye matokeo dhidi ya maadui bila kuibadili moja kwa moja kuwa ‘aliwashinda.’ Tanbihi inahifadhi maana ya karibu zaidi ya kitenzi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa simulizi umetumiwa kwa ‘akapigana,’ majina yameandikwa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia, na utata wa יַרְשִׁיעַ umehifadhiwa kwa tanbihi.
