base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/028.yaml
  text: Then one of the people answered and said[a], “Your father strictly put the people under oath, saying[b], ‘Cursed is the man who eats food today.’ So the people were faint.”
translation:
  language: sw
  text: Ndipo mtu mmoja miongoni mwa watu akajibu, akasema, “Baba yako aliwafungisha watu kwa kiapo kikali, akisema, ‘Amelaaniwa mtu atakayekula chakula[a] leo.’ Nao watu wakadhoofika.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mkate”; hapa neno hilo linamaanisha chakula kwa ujumla.'
    reason: lexical_alternative
  - marker: b
    text: Au “watu wakachoka” au “watu walikuwa wamechoka sana.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: akajibu
  rationale: Ni kitenzi cha kawaida cha masimulizi kinachoonyesha itikio katika mazungumzo na kuhifadhi nahau ya Kiebrania.
- source_word: אִישׁ מֵהָעָם
  choice: mtu mmoja miongoni mwa watu
  rationale: Huonyesha wazi kwamba msemaji alikuwa mtu mmoja asiyeainishwa kutoka katika kundi hilo.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: aliwaapisha watu kwa kiapo kikali
  rationale: Muundo wa kitenzi pamoja na jina-kitenzi lisilo na ukomo unasisitiza tendo la kuwaweka watu chini ya kiapo; tafsiri hii inahifadhi uzito huo kwa Kiswahili cha kawaida.
- source_word: אָבִיךָ
  choice: Baba yako
  rationale: Ni usemi wa moja kwa moja kwa Yonathani na unahifadhi umilikaji wa nafsi ya pili umoja.
- source_word: אָרוּר
  choice: Amelaaniwa
  rationale: Huhifadhi nguvu rasmi na nzito ya tamko la laana bila kutumia lugha ya kizamani.
- source_word: הָאִישׁ אֲשֶׁר יֹאכַל
  choice: mtu atakayekula
  rationale: Katika kanuni hii ya jumla, 'mtu' ni ya asili katika Kiswahili na haibadili maana ya rejeleo la Kiebrania la mtu yeyote katika kundi.
- source_word: לֶחֶם
  choice: chakula
  rationale: Ingawa maana ya msingi ni 'mkate', hapa neno linamaanisha chakula kwa ujumla, kama muktadha wa asali aliyokula Yonathani unavyoonyesha.
- source_word: הַיּוֹם
  choice: leo
  rationale: Ni kisawe cha moja kwa moja na cha kawaida katika usemi wa moja kwa moja.
- source_word: וַיָּעַף
  choice: walikuwa wamechoka sana
  rationale: Kitenzi kinaonyesha uchovu mkubwa au kudhoofika; 'wamechoka sana' ni wazi na cha asili katika Kiswahili huku tanbihi ikihifadhi uwezekano wa 'walidhoofika'.
- source_word: הָעָם
  choice: watu
  rationale: Huhifadhi neno la Kiebrania, ingawa katika muktadha hawa ni wapiganaji wa jeshi.
