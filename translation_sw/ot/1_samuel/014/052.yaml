  naturalness: Matini ni sanifu kwa jumla, lakini “Kila Sauli alipomwona” inahitaji “mara.” Pia “alimkusanya kwake” inaeleweka lakini si ya asili sana kwa kumwingiza mtu katika kundi la Sauli; “alimkusanya ajiunge naye” huhifadhi taswira ya kukusanya na husomeka kwa ufasaha.
  terminology: “Wafilisti,” “Sauli,” “vita,” “shujaa,” na “hodari” zinafaa. Tanbihi ya b inapaswa kuonyesha kwa usahihi zaidi muundo wa Kiebrania, “kila mtu shujaa na kila mwana wa uhodari.”
