base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/052.yaml
  text: And the war against the Philistines was severe all the days of Saul[a]. Whenever Saul saw any mighty man or any valiant man[c][b], he gathered him to himself.
translation:
  language: sw
  text: Vita dhidi ya Wafilisti vilikuwa vikali siku zote za Sauli.[a] Kila mara Sauli alipomwona mtu yeyote shujaa au hodari,[b] alimkusanya ajiunge naye.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vilikuwa vikali sana” au “vigumu.” Kivumishi cha Kiebrania maana yake ya msingi ni “chenye nguvu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “kila mtu shujaa na kila mwana wa uhodari.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, Sauli aliwakusanya watu kama hao waingie katika utumishi wake.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה
  choice: Vita ... vilikuwa
  rationale: Nomino hii inaeleza hali ya vita iliyoendelea, si pambano moja tu; Kiswahili hutumia kwa kawaida wingi wa kisarufi katika ‘vita vilikuwa.’
- source_word: חֲזָקָה
  choice: vikali
  rationale: Kivumishi kwa maana ya msingi ni ‘enye nguvu’; katika muktadha wa vita vya muda mrefu, ‘vikali’ huwasilisha uzito na ukali wake kwa Kiswahili cha kawaida.
- source_word: עַל פְּלִשְׁתִּים
  choice: dhidi ya Wafilisti
  rationale: Kihusishi kinaonyesha upande uliopigwa vita; ‘dhidi ya’ ni usemi wa kawaida na wazi.
- source_word: כֹּל יְמֵי שָׁאוּל
  choice: siku zote za Sauli
  rationale: Hifadhi usemi wa Kiebrania unaoonyesha muda wote wa siku za Sauli bila kuamua kimya kimya ikiwa ni maisha yake au utawala wake pekee.
- source_word: וְרָאָה
  choice: Kila Sauli alipomwona
  rationale: 'Muundo huu unaonyesha tendo lililorudiwa: kila mara Sauli alipomwona mtu wa aina hiyo.'
- source_word: כָּל אִישׁ גִּבּוֹר
  choice: mwanamume yeyote shujaa
  rationale: ‘Shujaa’ huhifadhi maana ya uwezo na ushujaa wa kivita ya גִּבּוֹר, huku ‘yeyote’ ikionyesha kila mtu aliyekutana naye wa aina hiyo.
- source_word: וְכָל בֶּן חַיִל
  choice: au hodari
  rationale: Neno kwa neno ni ‘mwana wa uhodari’; hapa ni nahau ya mtu mwenye uwezo, nguvu, au ushujaa. ‘Hodari’ ni ya asili katika Kiswahili na inafaa muktadha wa kijeshi.
- source_word: וַיַּאַסְפֵהוּ אֵלָיו
  choice: alimkusanya kwake
  rationale: Tafsiri hii inabaki karibu na picha ya ‘kumkusanya kwake’ huku muktadha ukidokeza kumwingiza katika jeshi au utumishi wake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa ‘Kila ... alipomwona’ unaonyesha tendo la kawaida lililorudiwa. Alama zote za tanbihi zimewekwa katika matini kuu kwa mpangilio wa kawaida.
