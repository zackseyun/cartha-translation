base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/050.yaml
  text: The name of Saul’s wife was Ahinoam daughter of Ahimaaz[a], and the name of the commander of his army was Abner son of Ner, Saul’s uncle.
translation:
  language: sw
  text: Jina la mke wa Sauli lilikuwa Ahinoamu binti Ahimaasi, na jina la mkuu wa jeshi lake lilikuwa Abneri mwana wa Neri, ami ya Sauli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa wa kiume wa karibu wa Sauli”; neno la Kiebrania linaweza kumaanisha jamaa wa kiume wa karibu kwa upana zaidi, ingawa “ami” inafaa zaidi katika muktadha huu wa nasaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם
  choice: Jina ... lilikuwa
  rationale: Muundo huu wa Kiebrania unatoa taarifa ya utambulisho. Kiswahili cha kawaida hutumia “Jina ... lilikuwa,” bila kulazimika kutafsiri kiunganishi וְ mwanzoni kwa “Na.”
- source_word: אֵשֶׁת
  choice: mke wa
  rationale: Katika muundo unaomhusisha Sauli, neno hili linaonyesha wazi uhusiano wa ndoa; “mke wa” ni tafsiri ya kawaida na sahihi.
- source_word: בַּת
  choice: binti
  rationale: Ni usemi wa kawaida wa nasaba unaotaja baba wa mwanamke; “binti Ahimaasi” ni Kiswahili asilia na wazi.
- source_word: שַׂר צְבָאוֹ
  choice: mkuu wa jeshi lake
  rationale: Katika muktadha wa kijeshi, שַׂר ni kiongozi mwenye mamlaka na צְבָאוֹ ni jeshi la Sauli. Usemi huu ni wa sasa, unaeleweka, na wenye hadhi.
- source_word: בֶּן
  choice: mwana wa
  rationale: Ni muundo wa kawaida wa nasaba unaotaja baba.
- source_word: דּוֹד
  choice: ami yake
  rationale: Katika taarifa hii ya nasaba, maana inayowezekana zaidi ni ndugu wa baba. Muktadha wa nasaba unaonyesha Neri kuwa ndugu wa Kishi, baba yake Sauli; kwa hiyo “ami” ni sahihi zaidi kuliko “mjomba,” huku tanbihi ikihifadhi uwezekano mpana wa neno la Kiebrania.
theological_decisions:
- issue: Maana na rejeleo la דּוֹד katika nasaba ya Sauli
  choice: Neri alikuwa ami yake Sauli
  alternative: Neri alikuwa jamaa wa karibu wa kiume wa Sauli
  rationale: Hili si suala kuu la mafundisho, bali ni utata wa kileksia na kisarufi. Katika muktadha wa nasaba, דּוֹד inaelekea kumaanisha “ami,” na mpangilio wa Kiebrania unaunganisha maelezo hayo na Neri. Hata hivyo, neno hilo linaweza kutumiwa kwa upana zaidi kuhusu jamaa wa karibu wa kiume, hivyo uwezekano huo umetajwa katika tanbihi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kwa maumbo yanayotumika kwa kawaida katika Biblia za Kiswahili: Sauli, Ahinoamu, Ahimaasi, Abneri, na Neri. Sentensi imehifadhi urudiaji wa kifomula wa “jina ... lilikuwa” uliomo katika Kiebrania.'
