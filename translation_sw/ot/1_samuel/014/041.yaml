base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/041.yaml
  text: Then Saul said to Yahweh[a], the God of Israel, “Give a perfect lot.” And Jonathan and Saul were taken, but the people escaped.
translation:
  language: sw
  text: Ndipo Sauli akamwambia Yahwe, Mungu wa Israeli, “Toa kura isiyo na dosari.”[a] Yonathani na Sauli wakachaguliwa, lakini watu wakaepuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Toa kilicho kamili/kisicho na lawama.” Yaelekea hili ni ombi la uamuzi usio na dosari kwa njia ya kura. Linganisha usomaji mrefu wa kale uliohifadhiwa katika Septuajinti: “Kwa nini hukumjibu mtumishi wako leo? Ikiwa hatia hii iko kwangu au kwa Yonathani mwanangu, Ee Yahwe, Mungu wa Israeli, toa Urimu; lakini ikiwa iko kwa watu wako Israeli, toa Thumimu.”'
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna inayotamkika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: הָבָה
  choice: Toa
  rationale: Ni ombi la moja kwa moja kwa Mungu; “toa” ni la kawaida katika muktadha wa kuomba matokeo ya kura.
- source_word: תָמִים
  choice: kura kamilifu
  rationale: Neno lenyewe humaanisha kilicho kamili, kizima, au kisicho na lawama. “Kura” haikutajwa wazi katika Kiebrania, lakini imeongezwa ili kuonyesha muktadha wa utambuzi kwa kura bila kuficha usemi mgumu wa chanzo.
- source_word: וַיִּלָּכֵד
  choice: wakachaguliwa
  rationale: Katika muktadha wa kura, kitenzi hiki kinaonyesha wale waliotambuliwa au kuchaguliwa na kura; tafsiri hii ni wazi kuliko “wakakamatwa” bila kulazimisha maana ya hatia.
- source_word: יָצָאוּ
  choice: wakaachiliwa
  rationale: Ingawa maana ya msingi ni “wakatoka,” hapa watu wanawekwa kinyume na wale waliochaguliwa kwa kura; “wakaachiliwa” huwasilisha kwamba kura haikuwaangukia.
theological_decisions:
- issue: Muundo wa maandishi ya sala ya Sauli katika mstari huu
  choice: 'Maandishi makuu yanafuata Kiebrania cha Masoreti: “Toa kura kamilifu.”'
  alternative: 'Usomaji mrefu wa kale: “Kwa nini hukumjibu mtumishi wako leo? Ikiwa hatia hii iko kwangu au kwa Yonathani mwanangu, ee Yahwe, Mungu wa Israeli, toa Urimu; lakini ikiwa iko kwa watu wako Israeli, toa Thumimu.”'
  rationale: Chanzo kilichotolewa ni Maandishi ya Masoreti, ambayo ni mafupi na magumu hapa. Usomaji huo umehifadhiwa katika maandishi makuu, huku usomaji mrefu wa kale ulioshuhudiwa na Septuajinti ukielezwa katika tanbihi kwa uwazi wa kihistoria bila kuingizwa kimya kimya katika maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Usemi mfupi na mgumu wa Kiebrania umehifadhiwa katika maandishi makuu, huku muktadha wa kura ukifafanuliwa kwa kiasi kidogo na tofauti ya kale ikiwekwa katika tanbihi.
