  text: That day they struck down the Philistines from Mikmash to Aijalon[a], and the people were very weary.
translation:
  language: sw
  text: Siku hiyo waliwapiga Wafilisti kutoka Mikmashi hadi Aiyaloni, na watu wakachoka sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: waliwaua
  rationale: Kitenzi נכה katika simulizi la vita kinaonyesha kuwapiga maadui kwa mauti; “waliwaua” ni Kiswahili cha kawaida kinachohifadhi uzito wa tendo bila kuongeza wazo la ushindi kamili.
- source_word: בַּיּוֹם הַהוּא
  choice: Siku hiyo
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili kwa kishazi hiki cha wakati.
- source_word: בַּפְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la watu hawa katika Kiswahili, nao ndio walengwa wa shambulio.
- source_word: מִמִּכְמָשׂ אַיָּלֹנָה
  choice: kutoka Mikmashi hadi Aiyaloni
  rationale: Muundo wa Kiebrania unaonyesha eneo la mapigano kuanzia Mikmashi kuelekea Aiyaloni; “kutoka ... hadi ...” huwasilisha mwendo huo kwa kawaida.
- source_word: וַיָּעַף
  choice: walikuwa wamechoka
  rationale: Kitenzi kina maana ya kulegea au kuchoka sana. Muundo huu unaeleza hali ya watu baada ya mapigano kwa Kiswahili cha kawaida.
- source_word: הָעָם
  choice: watu
  rationale: Nomino ya Kiebrania ni ya mkusanyiko; “watu” ni sawa ya asili katika Kiswahili.
- source_word: מְאֹד
  choice: sana
  rationale: Kielezi hiki cha kusisitiza kinatafsiriwa kwa kawaida kuwa “sana.”
