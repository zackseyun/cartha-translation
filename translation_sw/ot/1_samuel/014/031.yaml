translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Majina ya mahali yamenukuliwa moja kwa moja kutoka Kiebrania kama Mikmashi na Aiyaloni. Tanbihi ya Kiingereza kuhusu tahajia ya Michmash haikuhamishwa kwa sababu ni tofauti inayohusu unukuzi wa Kiingereza, si Kiswahili.
