  text: וַ/יּ֧וֹשַׁע יְהוָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא אֶת יִשְׂרָאֵ֑ל וְ/הַ֨/מִּלְחָמָ֔ה עָבְרָ֖ה אֶת בֵּ֥ית אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/023.yaml
  text: So Yahweh saved Israel that day[a], and the battle passed beyond Beth-aven.
translation:
  language: sw
  text: Siku hiyo Yahweh aliwaokoa Israeli, na mapigano yakapita Beth-Aveni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mapigano yaliendelea kupita Beth-Aveni,” au, “mapigano yakasonga mbele kupita Beth-Aveni.”
    reason: Matumizi ya עבר pamoja na jina la mahali yanaweza kumaanisha kwamba mapigano yalipita mahali hapo au yaliendelea mbele zaidi yake.
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: aliwaokoa
  rationale: Kitenzi cha Kiebrania katika Hiphil kinaonyesha kwamba Yahweh ndiye aliyesababisha wokovu au ukombozi. ‘Aliwaokoa’ ni lugha ya kawaida, fupi, na huhifadhi uzito wa kitheolojia bila kuifinya maana iwe ushindi wa kijeshi tu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kuwa ‘Yahweh’ badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Hii ni namna ya kawaida na ya asili ya Kiswahili ya kueleza wakati unaorejelewa katika simulizi.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina hili hapa linawarejelea kwa pamoja watu au jeshi la Israeli. Umbo la wingi la kitenzi cha Kiswahili ‘aliwaokoa’ huifanya maana hiyo iwe wazi.
- source_word: וְהַמִּלְחָמָה
  choice: na mapigano
  rationale: מִלְחָמָה linaweza kumaanisha vita au pigano. Katika tukio hili mahususi, ‘mapigano’ yanaeleza kwa kawaida shughuli ya kupigana iliyokuwa ikiendelea.
- source_word: עָבְרָה
  choice: yakasonga mpaka kupita
  rationale: עבר huonyesha kupita, kuvuka, au kwenda ng’ambo. Tafsiri hii huhifadhi mwendo wa mapigano kuelekea na kupita mahali hapo bila kudai kwa uhakika maana finyu ya kijeshi.
- source_word: אֶת בֵּית אָוֶן
  choice: Beth-Aveni
  rationale: Hili ni jina la mahali. Muundo wa עבר pamoja na אֶת unaweza kuonyesha mahali palipopitiwa; ‘mpaka kupita Beth-Aveni’ huwasilisha maana hiyo huku tanbihi ikihifadhi uwezekano mwingine.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini ina Tetragramatoni kama jina binafsi. ‘Yahweh’ huhifadhi jina hilo moja kwa moja na kuepuka kulibadilisha kuwa cheo.
- issue: Maana ya wokovu katika muktadha wa mapigano
  choice: aliwaokoa Israeli
  alternative: aliwapa Israeli ushindi
  rationale: ‘Aliwaokoa’ huhifadhi maana pana ya ישׁע na kumtaja Yahweh kuwa mtendaji, bila kuamua kwamba maana yake ni ushindi wa kijeshi pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kwa hiyo’ huunganisha mstari huu na matukio yaliyotangulia; ‘mapigano yakasonga’ ni usemi wa kawaida unaofanya mapigano yaeleweke kama yaliyoenea au kuendelea kijiografia. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
