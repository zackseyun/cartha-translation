    text: Au, “akawaua.” Umbo la kishirikishi cha Kiebrania linaweza kusisitiza tendo lililoendelea au lililorudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה humaanisha kwenda juu au kupanda; katika muktadha wa kupanda sehemu yenye mwinuko kwa mikono na miguu, “akapanda” linaeleza tendo hilo kwa Kiswahili cha kawaida bila kuongeza maelezo yasiyomo.
- source_word: עַל יָדָיו וְעַל רַגְלָיו
  choice: kwa mikono na miguu
  rationale: Usemi huu unahifadhi picha halisi ya namna Yonathani alivyopanda, huku ukiepuka msemo wa kufasiri zaidi kama “kwa miguu na mikono minne.”
- source_word: נֹשֵׂא כֵלָיו
  choice: mchukua silaha zake
  rationale: Hili linaonyesha kwa uwazi jukumu la mtumishi aliyebeba vifaa vya kivita vya Yonathani na linafuata maana ya maneno ya Kiebrania kwa lugha ya kawaida.
- source_word: אַחֲרָיו
  choice: nyuma yake
  rationale: Katika simulizi hili neno linaonyesha hasa mahali na mfuatano wa mchukua silaha kuja nyuma ya Yonathani.
- source_word: וַיִּפְּלוּ לִפְנֵי יוֹנָתָן
  choice: Wao wakaanguka mbele ya Yonathani
  rationale: Tafsiri hii inadumisha maana ya kijeshi ya kuanguka mbele ya mtu bila kubainisha kupita kiasi kama walipigwa, waliangushwa, au walishindwa kwa namna gani.
- source_word: מְמוֹתֵת
  choice: alikuwa akiwaua
  rationale: Umbo la kishirikishi cha Kiebrania linaweza kuonyesha tendo linaloendelea; “alikuwa akiwaua” linahifadhi hali hiyo bila kutumia msemo wa mazungumzo kama “aliwamalizia.”
