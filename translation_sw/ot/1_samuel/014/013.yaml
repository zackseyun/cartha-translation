  text: Then Jonathan climbed up on his hands and feet[a], with his armor-bearer behind him. They fell before Jonathan, and his armor-bearer killed them after him.
translation:
  language: sw
  text: Ndipo Yonathani akapanda kwa mikono na miguu, huku mchukua-silaha wake akimfuata nyuma yake. Wakaanguka mbele ya Yonathani, naye mchukua-silaha wake akawa akiwaua[a] akimfuata Yonathani nyuma yake.
  philosophy: optimal-equivalence
  footnotes:
