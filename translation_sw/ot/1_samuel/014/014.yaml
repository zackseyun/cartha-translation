  naturalness: “Katika shambulio lao la kwanza” ni Kiswahili cha simulizi kilicho wazi zaidi kuliko “Katika shambulio hilo la kwanza.” “Mchukua silaha wake” humweka mhusika katika uhusiano wa moja kwa moja na Yonathani. Tafsiri ya kipimo imerahisishwa kwa namna inayosomeka, huku ikihifadhi utata wake.
  terminology: “Shambulio” linafaa kwa הַמַּכָּה katika muktadha wa kijeshi, na “waliwaua” hutoa matokeo ya mauti yanayodokezwa na muktadha. “Mchukua silaha” ni istilahi inayokubalika kwa נֹשֵׂא כֵלָיו. “Nira” huhifadhi maana ya msingi ya צֶמֶד bila kudai kwa uhakika kipimo cha kisasa au eneo hususa lililolimwa.
