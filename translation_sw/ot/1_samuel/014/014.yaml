base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/014.yaml
  text: That first slaughter[a], which Jonathan and his armor-bearer made, was about twenty men within about half a furrow in an acre of a field.
translation:
  language: sw
  text: Katika shambulio lao la kwanza, Yonathani na mchukua silaha wake waliwaua watu wapatao ishirini, katika eneo la karibu nusu ya mtaro wa shamba la nira moja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa karibu kabisa, “karibu nusu ya mtaro wa nira moja ya shamba.” Maana na muundo wa kipimo hiki cha kale cha ardhi si hakika; huenda kinarejelea eneo ambalo jozi ya ng’ombe ingeweza kulima.
    reason: Maana na muundo wa kipimo hiki cha kale cha shamba si hakika.
lexical_decisions:
- source_word: הַמַּכָּה הָרִאשֹׁנָה
  choice: shambulio hilo la kwanza
  rationale: Nomino מַכָּה inaweza kumaanisha pigo au mauaji yaliyotokana na shambulio. Katika muktadha huu wa kijeshi, “shambulio” ni Kiswahili cha kawaida na sentensi inayofuata inaonyesha wazi kuwa lilisababisha vifo.
- source_word: אֲשֶׁר הִכָּה
  choice: waliwaua
  rationale: Kitenzi נכה humaanisha kupiga au kuangusha; hapa lengo lake ni watu wapatao ishirini na muktadha unaonyesha waliuawa. “Waliwaua” hutoa maana ya tukio kwa Kiswahili cha asili bila kutumia muundo mgumu wa ‘shambulio ambalo walipiga.’
- source_word: וְנֹשֵׂא כֵלָיו
  choice: na mchukua silaha zake
  rationale: Hili ni jina la mtumishi wa kijeshi aliyebeba vifaa au silaha za mpiganaji. “Mchukua silaha zake” ni wazi na halidokezi kimakosa kwamba alibeba ngao tu.
- source_word: כְּעֶשְׂרִים אִישׁ
  choice: watu wapatao ishirini
  rationale: Kiambishi כ־ kinaonyesha makadirio; “wapatao ishirini” ni usemi wa kawaida unaohifadhi kutokuwa idadi kamili.
- source_word: כְּבַחֲצִי מַעֲנָה
  choice: karibu nusu ya mtaro
  rationale: מַעֲנָה ni mtaro au mstari uliolimwa. “Karibu” huhifadhi hali ya makadirio iliyo katika כ־.
- source_word: צֶמֶד שָׂדֶה
  choice: sehemu ya shamba iliyolimwa na jozi ya ng’ombe
  rationale: צֶמֶד kimsingi ni jozi au nira, na hapa inaonekana kutumiwa kwa kipimo cha ardhi kulingana na eneo ambalo jozi ya ng’ombe ingeweza kulima. Tafsiri hii huhifadhi taswira ya kilimo bila kuingiza kipimo cha kisasa kisicho sahihi kwa uhakika.
