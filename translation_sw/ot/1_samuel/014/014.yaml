  - severity: medium
    issue: Ufafanuzi wa kipimo cha ardhi umewekwa katika matini badala ya kubaki katika tanbihi.
    rationale: “Sehemu ya shamba iliyolimwa na jozi ya ng’ombe” ni uelezaji wa uwezekano wa צֶמֶד שָׂדֶה, ilhali maana na sintaksia ya kipimo hicho cha kale vinabaki na utata. Matini ihifadhi usemi wa “nira,” na tanbihi itoe ufafanuzi wa tahadhari.
  - severity: low
