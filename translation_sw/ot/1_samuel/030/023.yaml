  text: וַ/יֹּ֣אמֶר דָּוִ֔ד לֹֽא תַעֲשׂ֥וּ כֵ֖ן אֶחָ֑/י אֵ֠ת אֲשֶׁר נָתַ֨ן יְהוָ֥ה לָ֨/נוּ֙ וַ/יִּשְׁמֹ֣ר אֹתָ֔/נוּ וַ/יִּתֵּ֗ן אֶֽת הַ/גְּד֛וּד הַ/בָּ֥א עָלֵ֖י/נוּ בְּ/יָדֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/023.yaml
  text: But David said[a], “You must not do so, my brothers, with what Yahweh has given us[c][b]. He has preserved us and has given into our hand the raiding band that came against us.”
translation:
  language: sw
  text: Lakini Daudi akasema, “Msifanye hivyo, ndugu zangu, kuhusiana na kile ambacho Yahweh ametupa.[a] Ametulinda[b] na ametia mikononi mwetu[c] kikosi cha wavamizi kilichokuja dhidi yetu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kile ambacho Yahweh ametupa.” Muundo wa Kiebrania umebanwa na unaanzisha jambo ambalo Daudi analizungumzia.
    reason: lexical_alternative
  - marker: b
    text: Au, “ametuhifadhi salama.”
    reason: lexical_alternative
  - marker: c
    text: Kwa Kiebrania, “katika mkono wetu,” nahau yenye maana ya kuwaweka chini ya uwezo wetu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ כֵן
  choice: Msifanye hivyo
  rationale: Ni katazo la moja kwa moja kwa watu wengi; Kiswahili hiki ni cha kawaida na kinahifadhi uzito wa onyo la Daudi.
- source_word: אֶחָי
  choice: ndugu zangu
  rationale: Neno la Kiebrania kwa maana halisi ni ‘ndugu zangu’ na hapa ni namna ya kindugu ambayo Daudi anatumia kuwaambia wanaume wake.
- source_word: אֵת אֲשֶׁר נָתַן יְהוָה לָנוּ
  choice: kuhusiana na kile ambacho Yahweh ametupa
  rationale: Muundo wa Kiebrania umebanwa na unaanzisha jambo linalozungumziwa, yaani namna ya kushughulikia kile walichopewa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu lililo katika maandishi ya Kiebrania linatunzwa kwa uandishi wa ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: וַיִּשְׁמֹר אֹתָנוּ
  choice: ametulinda
  rationale: Kitenzi שׁמר hapa kinaonyesha kuwalinda na kuwahifadhi salama katika hatari; ‘ametulinda’ ni wazi na cha asili katika Kiswahili.
- source_word: הַגְּדוּד
  choice: kikosi cha wavamizi
  rationale: Katika muktadha huu neno linamaanisha kundi la kijeshi lililofanya uvamizi, si jeshi kwa maana pana.
- source_word: הַבָּא עָלֵינוּ
  choice: kilichokuja kutushambulia
  rationale: Kirai kinaeleza ujio wa kikosi hicho dhidi yao; tafsiri hii inaonyesha wazi mwelekeo wa uhasama bila kuongeza maelezo yasiyokuwapo.
- source_word: בְּיָדֵנוּ
  choice: mikononi mwetu
  rationale: Ni nahau ya kuwaweka adui chini ya mamlaka au uwezo wao; umbo la wingi ni la asili zaidi katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; ‘Yahweh’ linahifadhi jina la agano kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wenye utata wa אֵת אֲשֶׁר umeelezwa kwa tanbihi badala ya kutatuliwa kimya kimya, huku nahau ya ‘mkono’ ikitolewa kwa Kiswahili cha kawaida.
