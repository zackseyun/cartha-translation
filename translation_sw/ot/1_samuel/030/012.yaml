base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/012.yaml
  text: They gave him a piece of fig cake and two clusters of raisins[a], and he ate, and his spirit returned to him[c][b], for he had not eaten bread or drunk water for three days and three nights.
translation:
  language: sw
  text: Wakampa kipande cha donge la tini zilizokandamizwa[a] na mafungu mawili ya zabibu kavu[b]. Akala, na roho yake ikamrudia[c], kwa maana hakuwa amekula mkate wala kunywa maji kwa siku tatu na usiku tatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, donge la tini lililotengenezwa kwa kuzibana pamoja.
    reason: cultural_note
  - marker: b
    text: Au labda, madonge mawili ya zabibu kavu.
    reason: lexical_alternative
  - marker: c
    text: Au, akapata nguvu tena; au, akahuika. Kiebrania ni, “roho yake ikamrudia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶלַח דְּבֵלָה
  choice: kipande cha donge la tini zilizoshindiliwa
  rationale: פֶלַח ni kipande, na דְּבֵלָה ni donge lililotengenezwa kwa tini zilizoshindiliwa. Tafsiri hii inaeleza chakula cha kale bila kutumia neno linaloweza kudokeza keki ya kisasa iliyookwa.
- source_word: שְׁנֵי צִמֻּקִים
  choice: mafungu mawili ya zabibu kavu
  rationale: צִמֻּקִים humaanisha zabibu kavu, na muundo wa kuhesabu unaonyesha vipimo viwili. Neno “mafungu” ni la kawaida na halibainishi kupita kiasi jinsi zabibu hizo zilivyokusanywa au kushindiliwa.
- source_word: וַתָּשָׁב רוּחוֹ אֵלָיו
  choice: roho yake ikamrudia
  rationale: Hii inafuata taswira halisi ya Kiebrania na kuhifadhi uwezekano wa kuelewa msemo huo kuwa alihuika au alipata nguvu tena.
- source_word: לֶחֶם
  choice: mkate
  rationale: Maana ya msingi ni mkate. Jozi ya “mkate” na “maji” inasikika kwa kawaida na kuhifadhi vitu halisi vilivyotajwa.
- source_word: שָׁתָה מַיִם
  choice: kunywa maji
  rationale: Kiebrania kinataja maji moja kwa moja, kwa hiyo tafsiri haijapanua maana kuwa kinywaji chochote.
- source_word: שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת
  choice: siku tatu na usiku tatu
  rationale: Huu ni usemi wa moja kwa moja wa muda na umetafsiriwa bila marekebisho ya kifasiri.
theological_decisions:
- issue: Maana ya kurudi kwa roho
  choice: roho yake ikamrudia
  alternative: akapata nguvu tena; akahuika
  rationale: Tafsiri halisi inahifadhi taswira na mvutano wa msemo wa Kiebrania bila kuamua kimya-kimya kwamba רוּחַ hapa ni nguvu za mwili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Donge” limetumiwa badala ya “keki” ili kuepuka taswira ya keki ya kisasa iliyookwa, huku tanbihi zikifafanua chakula hicho cha kale.
