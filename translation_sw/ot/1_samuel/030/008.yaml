  text: וַ/יִּשְׁאַ֨ל דָּוִ֤ד בַּֽ/יהוָה֙ לֵ/אמֹ֔ר אֶרְדֹּ֛ף אַחֲרֵ֥י הַ/גְּדוּד הַ/זֶּ֖ה הַֽ/אַשִּׂגֶ֑/נּוּ וַ/יֹּ֤אמֶר ל/וֹ֙ רְדֹ֔ף כִּֽי הַשֵּׂ֥ג תַּשִּׂ֖יג וְ/הַצֵּ֥ל תַּצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/008.yaml
  text: And David inquired of the LORD, saying, “Should I pursue this raiding party? Will I overtake them?” And he said to him, “Pursue, for you will surely overtake them, and you will surely rescue.”
translation:
  language: sw
  text: Daudi akamwuliza BWANA, akisema, “Je, nilifuatie kundi hili la wavamizi? Je, nitalifikia?” Naye akamjibu, “Lifuatie, kwa maana hakika utalifikia, na hakika utawaokoa waliotekwa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: akamwuliza BWANA
  rationale: Kitenzi kinaonyesha kutafuta mwongozo wa Mungu; usemi wa kawaida wa Kiswahili ‘kumwuliza BWANA’ unahifadhi maana bila kuongeza njia iliyotumiwa kuuliza.
- source_word: הַגְּדוּד
  choice: kundi hili la wavamizi
  rationale: Katika muktadha huu neno linamaanisha kikosi kilichofanya uvamizi, si jeshi kwa ujumla.
- source_word: הַאַשִּׂגֶנּוּ / הַשֵּׂג תַּשִּׂיג
  choice: nitalifikia / hakika utalifikia
  rationale: Mzizi נשׂג hapa ni kufikia au kuwapata wanaofuatiliwa. Muundo wa kitenzi kisoukomo pamoja na kitenzi kilichopinda unasisitiza uhakika, hivyo ‘hakika’.
- source_word: וְהַצֵּל תַּצִּיל
  choice: na hakika utawaokoa waliotekwa
  rationale: Muundo unasisitiza uhakika wa kuokoa. Kirai ‘waliotekwa’ kinabainisha wahusika wanaoeleweka wazi kutokana na muktadha wa aya zilizotangulia, ingawa hawatajwi moja kwa moja katika kishazi hiki.
theological_decisions:
- issue: Utambulisho wa msemaji katika וַיֹּאמֶר לוֹ
  choice: Naye akamjibu
  alternative: BWANA akamwambia
  rationale: Kiebrania kinasema kihalisi ‘naye akamwambia’ bila kurudia jina la BWANA. Tafsiri hii huhifadhi rejeo la kawaida la kiwakilishi bila kuongeza nomino.
- issue: Kitu cha kuokolewa katika וְהַצֵּל תַּצִּיל
  choice: utawaokoa waliotekwa
  alternative: utaokoa kabisa
  rationale: Kitenzi hakina yambwa lililotajwa, lakini muktadha unaonyesha familia na wengine waliotekwa. Ufafanuzi huu wa kiasili huepuka Kiswahili kisicho kamili huku usiongeze mada ya kiitikadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘BWANA’ limetumiwa kuwakilisha tetragramu יהוה kwa desturi iliyoenea ya tafsiri za Biblia. Marudio ya ‘hakika’ yanatunza msisitizo wa miundo ya Kiebrania.
