translation:
  language: sw
  text: 'Ikawa hivyo tangu siku hiyo na kuendelea: Daudi akaiweka kuwa sheria na kanuni[a] kwa Israeli mpaka leo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliifanya kuwa sheria na hukumu kwa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Tangu siku hiyo na kuendelea
  rationale: Katika muktadha huu, וַיְהִי inaunganika na kirai cha wakati na kutambulisha hali iliyoanza wakati huo na kuendelea; Kiswahili hiki ni cha asili bila kulazimisha tafsiri ya neno kwa neno.
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: tangu siku hiyo na kuendelea
  rationale: Kirai hiki kinaonyesha mwendelezo kuanzia wakati maalumu kuelekea mbele.
- source_word: וַיְשִׂמֶהָ
  choice: Daudi akaiweka
  rationale: Kitenzi שׂים hapa ni ‘kuweka’ au ‘kuanzisha’; kiambishi cha kitu kinarejelea utaratibu uliotangulia. Jina Daudi, ambaye ndiye kiima katika muktadha, linawekwa wazi kwa Kiswahili cha kawaida.
- source_word: לְחֹק
  choice: kuwa sheria
  rationale: חֹק ni agizo au utaratibu uliowekwa wenye nguvu ya kudumu; ‘sheria’ ni neno linaloeleweka na lenye uzito unaofaa.
- source_word: וּלְמִשְׁפָּט
  choice: na kanuni
  rationale: מִשְׁפָּט inaweza kumaanisha hukumu, uamuzi wa kisheria, au kanuni. Sambamba na חֹק hapa, ‘kanuni’ huonyesha utaratibu unaowajibisha bila kurudia tu ‘sheria’.
- source_word: לְיִשְׂרָאֵל
  choice: kwa ajili ya Israeli
  rationale: Kihusishi ל kinaonyesha taifa ambalo sheria na kanuni hiyo ilihusu.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Hii ni nahau ya Kiebrania inayosema kwamba utaratibu uliendelea hadi wakati wa msimulizi.
