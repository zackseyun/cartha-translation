base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/026.yaml
  text: When David came to Ziklag[a], he sent some of the plunder to the elders of Judah, his friends, saying, “Look, here is a gift for you from the plunder of the enemies of Yahweh.”
translation:
  language: sw
  text: Daudi alipofika Siklagi, alituma sehemu ya nyara kwa wazee wa Yuda, rafiki zake, akisema, “Tazameni, hii ni zawadi[a] kwa ajili yenu kutoka katika nyara za maadui wa Yahwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “baraka.” Neno la Kiebrania linaweza kumaanisha “baraka,” lakini hapa linarejelea zawadi ya mali kutoka katika nyara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Daudi alipofika
  rationale: Muundo huu unaonyesha mfuatano wa wakati na kuunganisha kufika kwa Daudi na tendo lililofuata kwa Kiswahili cha kawaida.
- source_word: צִקְלַג
  choice: Siklagi
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: וַיְשַׁלַּח מֵהַשָּׁלָל
  choice: alituma sehemu ya nyara
  rationale: Kihusishi מִן kinaonyesha kuwa alituma kiasi kutoka katika nyara zote; ‘sehemu ya nyara’ huwasilisha maana hiyo wazi.
- source_word: לְזִקְנֵי יְהוּדָה
  choice: kwa wazee wa Yuda
  rationale: ‘Wazee’ hapa ni viongozi waliotambuliwa katika Yuda.
- source_word: לְרֵעֵהוּ
  choice: rafiki zake
  rationale: רֵעַ inaweza kumaanisha rafiki, mwenzi au jirani; katika muktadha huu inaonyesha uhusiano mwema wa Daudi na viongozi hao.
- source_word: הִנֵּה לָכֶם
  choice: Tazameni, hii ni ... kwa ajili yenu
  rationale: ‘Tazameni’ inadumisha nguvu ya neno la kuleta jambo mbele ya wasikilizaji bila kutumia lugha ya kizamani.
- source_word: בְּרָכָה
  choice: zawadi
  rationale: Ingawa maana ya msingi ni ‘baraka,’ hapa neno hilo linarejelea kitu halisi kilichotolewa kutoka katika nyara. Maana halisi ya kileksia imehifadhiwa katika tanbihi.
- source_word: שְׁלַל
  choice: nyara
  rationale: ‘Nyara’ ni neno la kawaida la Kiswahili kwa mali iliyotekwa vitani na limetumiwa kwa uthabiti katika sehemu zote mbili za mstari.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa umbo linalofaa tahajia ya Kiswahili badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi jina hilo kwa tahajia ya kawaida ya Kiswahili badala ya kulibadilisha kuwa cheo.
- issue: Ikiwa בְּרָכָה itafsiriwe ‘baraka’ au ‘zawadi’
  choice: zawadi
  alternative: baraka
  rationale: Muktadha unaonyesha kuwa Daudi alituma mali halisi kutoka katika nyara. ‘Zawadi’ huwasilisha rejeleo hilo kwa uwazi, huku ‘baraka’ ikihifadhiwa katika tanbihi ili kutoficha upana wa neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tazameni’ inadumisha msisitizo wa הִנֵּה bila ukale usio wa lazima; ‘nyara’ ni sahihi kwa muktadha wa vita.
