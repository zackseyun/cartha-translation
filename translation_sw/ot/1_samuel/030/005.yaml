  yaml_path: translation/ot/1_samuel/030/005.yaml
  text: 'And David’s two wives had been taken captive: Ahinoam the Jezreelitess and Abigail[b][a], the wife of Nabal the Carmelite.'
translation:
  language: sw
  text: 'Na wake wawili wa Daudi walikuwa wamechukuliwa mateka: Ahinoamu, mwanamke wa Yezreeli[a], na Abigaili, mke wa Nabali, mtu wa Karmeli[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenyeji wa Yezreeli.”
    reason: lexical_alternative
  - marker: b
    text: Hapa “mtu wa Karmeli” humaanisha mwenyeji wa Karmeli, si mshiriki wa shirika la kidini lililoanzishwa baadaye.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁתֵּי
  choice: Na ... wawili
  rationale: Kiunganishi waw kinaendeleza simulizi lililotangulia, huku שְׁתֵּי ikionyesha idadi ya wake wawili.
- source_word: נְשֵׁי דָוִד
  choice: wake ... wa Daudi
  rationale: Muundo huu wa umilikaji ni wa kawaida na wazi katika Kiswahili.
- source_word: נִשְׁבּוּ
  choice: walikuwa wametekwa
  rationale: Kitenzi cha Kiebrania katika nifali kinaonyesha kwamba walichukuliwa mateka; wakati uliotumika unaonyesha tendo lililokuwa limetokea kabla ya hatua hii ya simulizi.
- source_word: אֲחִינֹעַם
  choice: Ahinoamu
  rationale: Jina limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: הַ/יִּזְרְעֵלִית
  choice: mwanamke wa Yezreeli
  rationale: Nomino hii ya kike humtambulisha Ahinoamu kwa asili yake; usemi huu ni wa asili na unaeleweka kuliko kuunda jina adimu la wenyeji.
- source_word: וַ/אֲבִיגַיִל
  choice: na Abigaili
  rationale: Kiunganishi kimetafsiriwa moja kwa moja, na jina limetoholewa kwa tahajia ya Kiswahili.
- source_word: אֵשֶׁת נָבָל
  choice: mke wa Nabali
  rationale: Inahifadhi utambulisho wa Abigaili kwa uhusiano wake na Nabali kwa muundo wa kawaida wa Kiswahili.
- source_word: הַֽ/כַּרְמְלִי
  choice: mtu wa Karmeli
  rationale: Neno hili humtambulisha Nabali kuwa mwenyeji wa Karmeli; tafsiri ya wazi ya kijiografia huepuka maana ya baadaye ya jina la kundi la kidini.
