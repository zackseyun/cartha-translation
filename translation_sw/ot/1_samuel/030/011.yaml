  text: They found an Egyptian man in the field and brought him to David[a]. They gave him bread, and he ate[c][b], and they gave him water to drink.
translation:
  language: sw
  text: Wakamkuta mtu Mmisri shambani, wakampeleka kwa Daudi. Wakampa mkate, naye akala; wakampa maji anywe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: Wakamkuta
  rationale: Ka- ya usimulizi inaendeleza mfululizo wa matukio kwa Kiswahili cha kawaida, na ‘kumkuta’ huonyesha kuwa walimpata akiwa mahali hapo.
- source_word: אִישׁ מִצְרִי
  choice: mtu Mmisri
  rationale: Inahifadhi nomino אִישׁ pamoja na utambulisho wa asili מִצְרִי kwa lugha ya asili na inayoeleweka.
- source_word: בַּשָּׂדֶה
  choice: shambani
  rationale: שָׂדֶה kwa kawaida ni eneo la shamba au uwanda; ‘shambani’ ni tafsiri fupi na ya kawaida bila kuongeza wazo la ‘wazi’ lisilotajwa wazi.
- source_word: וַיִּקְחוּ אֹתוֹ אֶל דָּוִד
  choice: wakampeleka kwa Daudi
  rationale: לקח pamoja na mtu na mahali anakoelekezwa inaweza kumaanisha kumchukua au kumpeleka; ‘wakampeleka kwa Daudi’ ni ya kawaida katika muktadha huu.
- source_word: וַיִּתְּנוּ לוֹ לֶחֶם
  choice: Wakampa mkate
  rationale: Inatafsiri לֶחֶם moja kwa moja kuwa ‘mkate’ bila kuipanua kuwa chakula kwa ujumla.
- source_word: וַיֹּאכַל
  choice: naye akala
  rationale: Kama ilivyo katika Kiebrania, kitu alichokula hakirudiwi kwa kiwakilishi; muktadha unaonyesha ni mkate.
- source_word: וַיַּשְׁקֻהוּ מָיִם
  choice: wakampa pia maji anywe
  rationale: Inawasilisha kwa Kiswahili cha kawaida maana ya kausativi ya שׁקה, yaani kumpa mtu maji ili anywe, bila kudokeza kulazimishwa.
