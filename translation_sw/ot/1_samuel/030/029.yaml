base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/029.yaml
  text: and to those in Rakal[a], and to those in the towns of the Jerahmeelites, and to those in the towns of the Kenites.
translation:
  language: sw
  text: na kwa wale waliokuwa Rakali, na kwa wale waliokuwa katika miji ya Wayerahmeeli, na kwa wale waliokuwa katika miji ya Wakeni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: na kwa wale waliokuwa
  rationale: Muundo huu unaorudiwa unaonyesha walengwa wa zawadi katika orodha. Kiswahili ‘kwa wale waliokuwa’ huhifadhi maana ya mgao na uhusiano wao na maeneo yaliyotajwa.
- source_word: בְּרָכָל
  choice: Rakali
  rationale: Ni jina la mahali; limetoholewa moja kwa moja kutoka Kiebrania kwa tahajia na matamshi ya kawaida ya Kiswahili.
- source_word: בְּעָרֵי
  choice: katika miji ya
  rationale: עִיר inaweza kumaanisha mji wa ukubwa mbalimbali. ‘Miji’ ni neno la kawaida na la heshima linalofaa kwa makazi ya eneo hili bila kulazimisha ukubwa maalumu.
- source_word: הַיְּרַחְמְאֵלִי
  choice: Wayerahmeeli
  rationale: Ingawa umbo la Kiebrania ni la jina la jamii katika umoja, hapa lina maana ya pamoja baada ya ‘miji ya’; hivyo jina la watu katika wingi linafaa katika Kiswahili.
- source_word: הַקֵּינִי
  choice: Wakeni
  rationale: Kama ilivyo kwa Wayerahmeeli, jina hili la jamii katika umoja wa Kiebrania linatumika kwa maana ya pamoja; Kiswahili hulitoa kwa wingi kama jina la watu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Marudio ya ‘na kwa wale waliokuwa’ yamehifadhiwa ili kuakisi muundo wa orodha ya Kiebrania.
