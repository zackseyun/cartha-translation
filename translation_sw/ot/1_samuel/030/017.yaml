base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/017.yaml
  text: David struck them down from the twilight until the evening of the next day[a], and not a man of them escaped, except four hundred young men who rode on the camels and fled.
translation:
  language: sw
  text: Daudi akawapiga kuanzia wakati wa mpito kati ya giza na mwanga[a] mpaka jioni ya siku iliyofuata. Hakuna hata mmoja wao aliyetoroka, isipokuwa vijana mia nne waliopanda ngamia na kukimbia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kumaanisha mwanga hafifu wa jioni au wa asubuhi; yaani, “machweo” au “mapambazuko.” Wengine hulielewa hapa kuwa mapambazuko.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: akawaua
  rationale: Katika muktadha huu wa mapigano, נכה inaonyesha kuwapiga adui kwa mauti; “akawaua” ni ya kawaida na yenye nguvu, ingawa inaweza pia kueleweka kwa upana kuwa aliwashinda kwa kuwapiga.
- source_word: מֵהַנֶּשֶׁף
  choice: kuanzia wakati wa machweo[a]
  rationale: נשף ni wakati wa mpito wenye mwanga hafifu na inaweza kumaanisha machweo au mapambazuko. “Machweo” linaendana vizuri na kipindi kinachoendelea hadi jioni ya siku iliyofuata, huku tanbihi ikihifadhi uwezekano wa “mapambazuko.”
- source_word: וְעַד הָעֶרֶב לְמָחֳרָתָם
  choice: mpaka jioni ya siku iliyofuata
  rationale: Hii inaeleza muda ulioendelea hadi jioni ya siku iliyofuata kwa Kiswahili cha kawaida na wazi.
- source_word: וְלֹא נִמְלַט מֵהֶם אִישׁ
  choice: Hakuna hata mmoja wao aliyeokoka
  rationale: Umoja wa Kiebrania umetumiwa kwa maana ya kila mtu mmoja mmoja; “hakuna hata mmoja” huhifadhi msisitizo wa kutosalia mtu yeyote.
- source_word: כִּי אִם
  choice: isipokuwa
  rationale: Hiki ndicho kiunganishi cha kawaida cha Kiswahili kinachoanzisha tofauti na kauli iliyotangulia.
- source_word: אַרְבַּע מֵאוֹת אִישׁ נַעַר
  choice: vijana mia nne
  rationale: נַעַר hapa inawahusu vijana wenye uwezo wa kupigana na kupanda ngamia; “vijana” haidokezi watoto wala watumishi.
- source_word: רָכְבוּ עַל הַגְּמַלִּים
  choice: waliopanda ngamia
  rationale: Hii ni kauli asilia ya Kiswahili kwa kupanda na kusafiri juu ya ngamia.
- source_word: וַיָּנֻסוּ
  choice: na kukimbia
  rationale: נס humaanisha kukimbia ili kujiokoa; uchaguzi huu unatofautisha kitenzi hiki na נמלט, kilichotafsiriwa “aliyeokoka.”
