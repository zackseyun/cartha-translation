  text: When David and his men came to the city, behold, it had been burned with fire, and their wives, sons, and daughters had been taken captive.
translation:
  language: sw
  text: Daudi na watu wake walipofika mjini, tazama, mji ulikuwa umeteketezwa kwa moto, na wake zao, wana wao, na binti zao walikuwa wamechukuliwa mateka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: wakakuta kwamba
  rationale: Katika simulizi hili, neno hilo linaonyesha jambo waliloliona walipofika; tafsiri hii ni ya asili katika Kiswahili kuliko ‘tazama’ bila kupoteza mshangao wa ugunduzi.
- source_word: שְׂרוּפָה בָּאֵשׁ
  choice: ulikuwa umeteketezwa kwa moto
  rationale: Huhifadhi hali iliyotokana na tendo lililokamilika kabla ya kuwasili kwao, pamoja na kutajwa wazi kwa moto.
- source_word: נִשְׁבּוּ
  choice: walikuwa wamechukuliwa mateka
  rationale: Kitenzi cha Kiebrania ni hali tendwa ya kuchukuliwa vitani; wakati timilifu unaonyesha kuwa jambo hilo lilikuwa limetokea kabla Daudi na watu wake hawajafika.
- source_word: בְּנֵיהֶם וּבְנֹתֵיהֶם
  choice: wana wao na binti zao
  rationale: Hutofautisha watoto wa kiume na wa kike kama chanzo; ‘wana’ ni neno la kawaida na lenye hadhi katika Kiswahili sanifu.
