translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi la Biblia. Muundo wa ‘wakakuta kwamba’ unawasilisha וְהִנֵּה kwa uwazi bila kutumia amri isiyo ya kawaida ‘tazama’.
