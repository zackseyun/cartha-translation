base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/014.yaml
  text: We raided the Negev of the Kerethites[a], and the territory that belongs to Judah, and the Negev of Caleb; and we burned Ziklag with fire.
translation:
  language: sw
  text: Tulifanya uvamizi wa kupora katika Negebu ya Wakerethi[a], na katika eneo ambalo ni la Yuda, na katika Negebu ya Kalebu; nasi tukauteketeza Siklagi kwa moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, Wakereti.
    reason: Tofauti ya tahajia katika kuhamisha jina la watu kutoka Kiebrania.
lexical_decisions:
- source_word: פָּשַׁטְנוּ
  choice: Tulivamia
  rationale: Katika muktadha huu wa kijeshi, kitenzi kinaeleza uvamizi wa ghafla wenye lengo la kuteka nyara. ‘Tulivamia’ ni kifupi, cha kawaida, na kinafaa katika taarifa ya Mwamaleki.
- source_word: נֶגֶב
  choice: Negebu
  rationale: Hapa neno hilo linaelekea kutaja eneo kavu la kusini linaloitwa Negebu, si mwelekeo wa kusini tu. Kutumia jina la mahali kunadumisha maana ya kijiografia na marudio yake katika mstari.
- source_word: הַכְּרֵתִי
  choice: Wakerethi
  rationale: Hili ni jina la kundi la watu. ‘Wakerethi’ ni umbo linalotambulika katika Kiswahili cha Biblia na linawakilisha jina la Kiebrania kwa uwazi.
- source_word: וְעַל אֲשֶׁר לִיהוּדָה
  choice: eneo ambalo ni la Yuda
  rationale: Kihusishi kinaendeleza orodha ya maeneo yaliyovamiwa, na kishazi cha Kiebrania kinaonyesha umiliki au uhusiano na Yuda. Tafsiri hii ni ya asili katika Kiswahili bila kupoteza dhana ya eneo lililo la Yuda.
- source_word: נֶגֶב כָּלֵב
  choice: Negebu ya Kalebu
  rationale: Hii inaelekea kuwa wilaya ya kusini iliyohusishwa na ukoo au eneo la Kalebu. Muundo huu unahifadhi jina la kijiografia na uhusiano wake na Kalebu.
- source_word: שָׂרַפְנוּ בָאֵשׁ
  choice: tukauteketeza Siklagi kwa moto
  rationale: Kiebrania kinatumia wazi kitenzi cha kuchoma pamoja na ‘kwa moto.’ ‘Kutekeza kwa moto’ hudumisha msisitizo huo huku kikisikika kwa kawaida katika Kiswahili.
- source_word: צִקְלַג
  choice: Siklagi
  rationale: Hili ni umbo la Kiswahili la jina la mahali Ziklag.
theological_decisions: []
