translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha masimulizi na chenye hadhi lakini kinachoeleweka kwa urahisi. Alama ya tanbihi imewekwa baada ya “Negebu,” ambako utata wa neno la Kiebrania unatokea.
