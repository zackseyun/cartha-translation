base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/001.yaml
  text: When David and his men came to Ziklag on the third day[a], the Amalekites had made a raid against the Negev and against Ziklag, and they had struck Ziklag and burned it with fire.
translation:
  language: sw
  text: Daudi na watu wake walipofika Siklagi siku ya tatu, Waamaleki walikuwa wamevamia Negebu[a] na Siklagi, waliishambulia Siklagi na kuiteketeza kwa moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu ya kusini.” Neno la Kiebrania negev linaweza kumaanisha upande wa kusini kwa ujumla au eneo maalumu linaloitwa Negebu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּבֹא
  choice: walipofika
  rationale: Muundo huu unaweka mazingira ya wakati wa kuwasili kwa Daudi. “Walipofika” ni Kiswahili cha kawaida na cha asili kuliko tafsiri ya neno kwa neno kama “ikawa walipokuja.” Neno “walikuta” limeongezwa ili kuonyesha kwa kawaida kwamba uvamizi ulikuwa umetokea kabla ya kuwasili kwao.
- source_word: וַאֲנָשָׁיו
  choice: na watu wake
  rationale: Katika muktadha hawa ni wanaume wa kikosi cha Daudi. “Watu wake” ni usemi wa kawaida wa Kiswahili unaoeleweka kwa muktadha bila kutumia “wanaume wake,” ambao hapa si wa asili.
- source_word: צִקְלַג
  choice: Siklagi
  rationale: Jina la mahali limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: siku ya tatu
  rationale: Hii ni tafsiri ya moja kwa moja ya usemi wa wakati katika Kiebrania.
- source_word: וַעֲמָלֵקִי
  choice: Waamaleki
  rationale: Ingawa umbo la Kiebrania linaweza kuonekana kuwa la umoja wa jamii, vitenzi vya wingi vinaonyesha kwamba kundi zima ndilo linalokusudiwa.
- source_word: פָשְׁטוּ
  choice: wamevamia
  rationale: Katika muktadha wa kijeshi kitenzi hiki humaanisha kufanya uvamizi wa ghafla au uporaji. Wakati timilifu unaonyesha kwamba tendo lilitangulia kuwasili kwa Daudi.
- source_word: אֶל נֶגֶב
  choice: Negebu
  rationale: נֶגֶב linaweza kumaanisha kusini kwa ujumla au eneo maalumu la Negebu. Jina la eneo limetumiwa katika maandishi, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: וַיַּכּוּ אֶת צִקְלַג
  choice: Walikuwa wameushambulia Siklagi
  rationale: נכה ni pana, likiwa na maana ya kupiga au kushambulia. Kwa mji, “kuushambulia” ni Kiswahili cha asili; wakati uliopita timilifu unaonyesha shambulio lililokuwa limetokea kabla ya Daudi kufika.
- source_word: וַיִּשְׂרְפוּ אֹתָהּ בָּאֵשׁ
  choice: na kuuteketeza kwa moto
  rationale: “Kuuteketeza kwa moto” huhifadhi kutajwa wazi kwa moto na kuwasilisha uharibifu mkubwa wa mji kwa Kiswahili cha sasa.
