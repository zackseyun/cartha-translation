  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya masimulizi iliyo wazi, ya heshima, na inayoeleweka kwa wasomaji wa kawaida. Mazungumzo yamewasilishwa kwa mtiririko wa asili bila kuongeza maelezo yasiyokuwapo katika chanzo.
