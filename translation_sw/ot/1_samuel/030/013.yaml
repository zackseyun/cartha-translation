base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/013.yaml
  text: David said to him, “Whose are you, and where are you from?” He said, “I am an Egyptian young man, a servant of an Amalekite man, and my master abandoned me because I became sick three days ago.”
translation:
  language: sw
  text: Daudi akamwambia, “Wewe ni wa nani, na umetoka wapi?” Akasema, “Mimi ni kijana Mmisri, mtumwa wa Mwamaleki mmoja. Bwana wangu aliniacha kwa sababu nilianza kuugua siku tatu zilizopita.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִי אַתָּה
  choice: Wewe ni wa nani
  rationale: Kauli hii inauliza mtu huyo ni mali ya nani au yuko chini ya mamlaka ya nani. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha maana hiyo bila kuibana kuwa swali la utambulisho pekee.
- source_word: נַעַר מִצְרִי
  choice: kijana Mmisri
  rationale: Neno נַעַר hapa linaonyesha kijana wa kiume, naye anajitambulisha kuwa Mmisri.
- source_word: עֶבֶד
  choice: mtumwa
  rationale: Katika muktadha huu mhusika alikuwa mali ya bwana wake na aliachwa naye; “mtumwa” huwasilisha uhusiano huo kwa uwazi kuliko “mtumishi.”
- source_word: לְאִישׁ עֲמָלֵקִי
  choice: wa Mwamaleki mmoja
  rationale: Muundo huu unamaanisha mtu mmoja wa jamii ya Waamaleki; Kiswahili cha kawaida hakihitaji kurudia neno “mtu.”
- source_word: כִּי חָלִיתִי הַיּוֹם שְׁלֹשָׁה
  choice: kwa sababu nilianza kuugua siku tatu zilizopita
  rationale: Nahau ya Kiebrania inaonyesha kwamba ugonjwa ulianza siku tatu kabla ya mazungumzo. “Nilianza kuugua” inadumisha wazo la kuingia katika hali ya ugonjwa.
