base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/024.yaml
  text: And who will listen to you in this matter? For as is the share of the one who goes down into the battle[a], so is the share of the one who stays by the supplies[b]; together they shall divide.
translation:
  language: sw
  text: Naye ni nani atakayewasikiliza[a] katika jambo hili? Kwa maana fungu la yule anayeshuka kwenda vitani litakuwa kama fungu la yule anayebaki na vifaa[b]; watagawana kwa usawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakayewatii” au “atakayezingatia.” Kitenzi cha Kiebrania kinaweza kumaanisha kusikiliza, kutii, au kuzingatia kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au, “mizigo,” “zana,” au “vyombo.” Neno la Kiebrania linaweza kutaja kwa upana vyombo, zana, mizigo, au vifaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי
  choice: Naye ni nani
  rationale: Kiunganishi pamoja na kiulizi kinaendeleza jibu la Daudi kwa swali la balagha; “Naye ni nani” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: יִשְׁמַע לָכֶם
  choice: atakayewasikiliza
  rationale: Kitenzi שׁמע pamoja na ל kinaweza kumaanisha kusikiliza, kutii, au kuzingatia. “Atakayewasikiliza” ni cha asili na kinabaki na upana wa maana wa Kiebrania.
- source_word: לַדָּבָר הַזֶּה
  choice: katika jambo hili
  rationale: דבר hapa ni suala au pendekezo linalobishaniwa, si neno lililotamkwa tu.
- source_word: כִּי
  choice: Kwa maana
  rationale: Kinaanzisha sababu ya kukataa pendekezo lililotangulia.
- source_word: כְּחֵלֶק
  choice: fungu ... litakuwa kama fungu
  rationale: חלק ni sehemu inayomwangukia mtu katika mgawanyo wa nyara; “fungu” ni neno la kawaida na sahihi katika muktadha huu.
- source_word: הַיֹּרֵד בַּמִּלְחָמָה
  choice: yule anayeshuka kwenda vitani
  rationale: Tafsiri hii huhifadhi taswira ya kitenzi “kushuka” na kuonyesha kwamba mtu huyo anaingia vitani.
- source_word: הַיֹּשֵׁב עַל הַכֵּלִים
  choice: yule anayebaki na vifaa
  rationale: יֹשֵׁב hapa hudokeza kubaki nyuma, huku כֵּלִים ikiwa na maana pana ya vifaa, mizigo, au vyombo. “Anayebaki na vifaa” inaeleza wajibu huo kwa lugha ya kawaida bila kuubana mno.
- source_word: יַחְדָּו יַחֲלֹקוּ
  choice: watagawana pamoja
  rationale: Huhifadhi wazo la kushiriki pamoja katika mgawanyo; usawa wa mafungu umeonyeshwa tayari na muundo wa kulinganisha.
