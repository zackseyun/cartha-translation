translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi wenye mfululizo wa “aka-,” wenye hadhi lakini unaoeleweka kwa msomaji wa kawaida. Jina Besor limetoholewa kuwa “Besori” ili litamkike kwa kawaida katika Kiswahili.
