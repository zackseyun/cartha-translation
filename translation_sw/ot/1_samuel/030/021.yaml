base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/021.yaml
  text: David came to the two hundred men who had become too exhausted to follow after David[a], and whom they had left at the Brook Besor. They came out to meet David and to meet the people who were with him[b], and David approached the people and asked them how they were.
translation:
  language: sw
  text: Daudi akawafikia wale wanaume mia mbili waliokuwa wamechoka sana hata wasiweze kuendelea kumfuata Daudi, na ambao Daudi alikuwa amewaacha kwenye Kijito cha Besori.[a] Wakatoka kuwalaki Daudi na watu waliokuwa pamoja naye. Daudi akawakaribia watu hao na kuwauliza hali yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliowafanya wabaki.”
    reason: Kitenzi cha Kiebrania kinaweza kueleza kuwafanya wakae au wabaki mahali, si kuachwa tu.
  - marker: b
    text: Kwa maana halisi, “kuwauliza kuhusu amani yao,” yaani, kuhusu hali njema ya maisha yao.
    reason: Tanbihi inaonyesha nahau ya Kiebrania na wigo wa neno שָׁלוֹם bila kutumia Kiswahili kisicho cha kawaida katika maandishi makuu.
lexical_decisions:
- source_word: פִּגְּרוּ מִלֶּכֶת אַחֲרֵי דָוִד
  choice: waliokuwa wamechoka mno wasiweze kuendelea kumfuata
  rationale: Kitenzi adimu פּגר katika muktadha huu kinaonyesha kulegea au kuchoka kiasi cha kushindwa kuendelea. Tafsiri hii inaeleza maana hiyo kwa Kiswahili cha kawaida bila kudai kwamba waliachwa kwa sababu nyingine.
- source_word: וַיֹּשִׁיבֻם
  choice: alikuwa amewaacha
  rationale: Umbo la Hiphil la ישׁב lina maana ya kuwafanya wabaki au kukaa mahali. Kitenzi cha Kiebrania ni cha nafsi ya tatu umoja, hivyo Daudi ndiye anayeeleweka kuwa aliwaacha hapo; Kiswahili hiki ni cha asili katika simulizi.
- source_word: בְּנַחַל הַבְּשׂוֹר
  choice: kwenye Kijito cha Besori
  rationale: נחל inaweza kuwa kijito, bonde la mto, au mkondo wa maji wa msimu. “Kijito cha Besori” ni jina la mahali linalosomeka kwa urahisi huku tanbihi isihitajike kwa tofauti ya kijiografia isiyoathiri tukio.
- source_word: לִקְרַאת
  choice: kwenda kumlaki
  rationale: Neno hili linaonyesha kutoka ili kukutana na kumpokea mtu anayekuja. “Kumlaki” ni sahihi na lenye hadhi katika Kiswahili cha Afrika Mashariki.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: watu waliokuwa pamoja naye
  rationale: עָם hapa ni kundi lililoandamana na Daudi. “Watu” huhifadhi upana wa neno la Kiebrania bila kulifinya kuwa “askari” pekee.
- source_word: וַיִּגַּשׁ דָּוִד אֶת הָעָם
  choice: Daudi akawakaribia watu hao
  rationale: נגשׁ humaanisha kusogea karibu au kukaribia. Tafsiri hii inatenganisha tendo la kuwakaribia na swali la hali yao linalofuata.
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: kuwauliza hali yao
  rationale: Hii ni nahau ya Kiebrania ya kuuliza kuhusu amani, ustawi, au hali ya mtu. “Kuwauliza hali yao” ni Kiswahili cha asili na huhifadhi maana ya kujali hali njema.
