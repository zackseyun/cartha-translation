  text: וַ/תֵּ֨צֶר לְ/דָוִ֜ד מְאֹ֗ד כִּֽי אָמְר֤וּ הָ/עָם֙ לְ/סָקְל֔/וֹ כִּֽי מָ֨רָה֙ נֶ֣פֶשׁ כָּל הָ/עָ֔ם אִ֖ישׁ עַל בנ/ו וְ/עַל בְּנֹתָ֑י/ו וַ/יִּתְחַזֵּ֣ק דָּוִ֔ד בַּ/יהוָ֖ה אֱלֹהָֽי/ו־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/006.yaml
  text: And David was greatly distressed[a], because the people spoke of stoning him, for the soul of all the people was bitter, each man because of his sons and his daughters. But David strengthened himself in Yahweh his God.
translation:
  language: sw
  text: Daudi akapata dhiki sana, kwa sababu watu walisema kwamba wampige kwa mawe. Maana nafsi ya watu wote ilikuwa na uchungu[a], kila mwanamume kwa sababu ya wanawe na binti zake. Lakini Daudi akajitia moyo katika Yahweh, Mungu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho ya watu wote ilikuwa na uchungu.” Neno la Kiebrania linaweza kumaanisha “nafsi” au “roho,” na hapa linaeleza hali ya ndani ya watu wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֶר לְדָוִד מְאֹד
  choice: Daudi akapata dhiki sana
  rationale: Muundo wa Kiebrania unaonyesha kwamba hali ilikuwa ngumu na ya kumtaabisha Daudi; “akapata dhiki sana” ni Kiswahili cha kawaida kinachohifadhi uzito wa מְאֹד.
- source_word: הָעָם
  choice: watu
  rationale: Ingawa katika muktadha hawa ni watu wa kikosi cha Daudi, neno la Kiebrania ni la jumla; “watu” haliongezi ufafanuzi usiotajwa wazi.
- source_word: לְסָקְלוֹ
  choice: kwamba wampige kwa mawe
  rationale: Infinitivu hii inaeleza tendo walilokuwa wakilipendekeza au kulijadili. Usemi huu ni wa asili katika Kiswahili na hauonyeshi kwamba tayari walikuwa wameanza tendo hilo.
- source_word: מָרָה נֶפֶשׁ כָּל הָעָם
  choice: nafsi ya watu wote ilikuwa na uchungu
  rationale: Huhifadhi taswira halisi ya Kiebrania ya “nafsi” katika umoja ikiwa na maana ya kijumla, pamoja na kina cha uchungu wao.
- source_word: אִישׁ
  choice: kila mwanamume
  rationale: Neno linatumika kwa maana ya kugawa kundi mtu mmoja mmoja na katika muktadha linawahusu wanaume wa kikosi cha Daudi.
- source_word: עַל בָּנָיו וְעַל בְּנֹתָיו
  choice: kwa sababu ya wanawe na binti zake
  rationale: עַל hapa inaonyesha sababu ya uchungu wao; “kwa sababu ya” huwasilisha uhusiano huo wazi huku ikihifadhi kutajwa kwa wana na binti.
- source_word: וַיִּתְחַזֵּק
  choice: akajitia nguvu
  rationale: Umbo la hitpaeli lina maana ya kujielekezea au kujihusisha katika tendo; “akajitia nguvu” huhifadhi mwitikio hai wa Daudi bila kueleza zaidi jinsi alivyofanya hivyo.
- source_word: בַּיהוָה
  choice: katika Yahweh
  rationale: Huhifadhi jina la agano יְהוָה na wazo la kwamba Yahweh ndiye aliyekuwa msingi au mahali pa Daudi kupata nguvu.
- source_word: אֱלֹהָיו
  choice: Mungu wake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kiambishi kimilikishi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko linatumia moja kwa moja jina la herufi nne la Mungu. “Yahweh” hulitambulisha kama jina lake la agano badala ya kulibadilisha kuwa cheo.
- issue: Namna Daudi alivyopata nguvu
  choice: akajitia nguvu katika Yahweh Mungu wake
  alternative: akapata nguvu kutoka kwa Yahweh Mungu wake
  rationale: Tafsiri iliyochaguliwa huhifadhi nguvu ya kujielekezea ya וַיִּתְחַזֵּק pamoja na utata wa kihusishi בְּ, bila kuamua kimya-kimya ikiwa maana yake ni chanzo, njia, au msingi wa nguvu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio na taswira muhimu za Kiebrania zimehifadhiwa pale ambapo hazifanyi sentensi isiwe ya kawaida; jina Yahweh limetumiwa moja kwa moja.
