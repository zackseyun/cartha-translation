base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/019.yaml
  text: Nothing of theirs was missing[a], from small to great, sons and daughters, spoil, or anything that had been taken from them[b]; David brought back everything.
translation:
  language: sw
  text: Hakuna chochote kilichowakosekana, kuanzia mdogo hadi mkubwa, wana na binti, nyara, na yote waliyojichukulia[a]. Daudi alirudisha kila kitu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, «yote waliyochukua kwa ajili yao wenyewe.» Kiebrania hakitaji wazi hapa walikovichukua kutoka kwa nani; muktadha unaonyesha kwamba Waamaleki walikuwa wamechukua watu na mali za watu wa Daudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶעְדַּר
  choice: kilichokosekana
  rationale: Nifali ya עדר hapa ina maana ya kukosekana au kutokuwapo baada ya uvamizi; ‘kilichokosekana’ ni Kiswahili cha kawaida na kinafaa kwa watu na mali zilizopatikana tena.
- source_word: לָהֶם
  choice: chao
  rationale: Kiwakilishi hiki pamoja na נֶעְדַּר kinaonyesha kwamba hakuna mtu au kitu chao kilichopungua; ‘chao’ huwasilisha umilikaji huo kwa Kiswahili cha asili.
- source_word: מִן הַקָּטֹן וְעַד הַגָּדוֹל
  choice: tangu mdogo hadi mkubwa
  rationale: Usemi huu wa ujumla unadumisha jozi ya Kiebrania bila kuamua kimya kimya ikiwa inahusu hasa umri, cheo, au umuhimu.
- source_word: בָּנִים וּבָנוֹת
  choice: wana na binti
  rationale: Kiebrania kinataja wazi watoto wa kiume na wa kike; ‘wana na binti’ huhifadhi utofautishaji huo kwa lugha ya heshima.
- source_word: מִשָּׁלָל
  choice: nyara
  rationale: ‘Nyara’ ni neno la kawaida la masimulizi kwa mali iliyotekwa katika uvamizi.
- source_word: כָּל אֲשֶׁר לָקְחוּ לָהֶם
  choice: kitu chochote walichokuwa wamejichukulia
  rationale: Tafsiri hii huhifadhi muundo wa Kiebrania ‘vyote walivyojichukulia’ na kutomgeuza kimya kimya mlengwa wa kiwakilishi kuwa wahanga; muktadha unaonyesha kwamba watendaji ni Waamaleki.
- source_word: הַכֹּל הֵשִׁיב
  choice: alirudisha kila kitu
  rationale: Hifili ya שוב inaonyesha kusababisha kurudi; ‘alirudisha kila kitu’ huhifadhi tendo halisi la Daudi kuvirudisha vilivyotekwa.
- source_word: דָּוִד
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
