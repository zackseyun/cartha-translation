lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: na kwa wale waliokuwa
  rationale: Kirai hiki hurudiwa kabla ya kila jina la mahali na katika muktadha huu hutaja wapokeaji waliokuwa katika miji hiyo. Kiswahili cha kawaida huhitaji kitenzi cha uhusiano ili sentensi isomeke kwa uwazi.
- source_word: בַּעֲרֹעֵר
  choice: Aroeri
  rationale: Ni jina la mahali; limetoholewa kwa tahajia inayosomeka kwa Kiswahili. Wazo la mahali linaelezwa tayari na “waliokuwa,” hivyo si lazima kuongeza “katika.”
- source_word: בְּשִׂפְמוֹת
  choice: Sifmothi
  rationale: Ni jina la mahali, limetoholewa badala ya kutafsiriwa. Konsonanti na irabu za mwisho zimewasilishwa kwa namna inayotamkika kwa urahisi katika Kiswahili.
- source_word: בְּאֶשְׁתְּמֹעַ
  choice: Eshtemoa
  rationale: Ni jina la mahali, limetoholewa kwa kulikaribia umbo la Kiebrania huku likibaki rahisi kusomeka kwa Kiswahili.
