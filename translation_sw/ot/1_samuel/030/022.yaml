  text: וַ/יַּ֜עַן כָּל אִֽישׁ רָ֣ע וּ/בְלִיַּ֗עַל מֵֽ/הָ/אֲנָשִׁים֮ אֲשֶׁ֣ר הָלְכ֣וּ עִם דָּוִד֒ וַ/יֹּאמְר֗וּ יַ֚עַן אֲשֶׁ֣ר לֹֽא הָלְכ֣וּ עִמִּ֔/י לֹֽא נִתֵּ֣ן לָ/הֶ֔ם מֵ/הַ/שָּׁלָ֖ל אֲשֶׁ֣ר הִצַּ֑לְנוּ כִּֽי אִם אִ֤ישׁ אֶת אִשְׁתּ/וֹ֙ וְ/אֶת בָּנָ֔י/ו וְ/יִנְהֲג֖וּ וְ/יֵלֵֽכוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/022.yaml
  text: Then every wicked and worthless man from among the men who had gone with David answered and said[a], “Because they did not go with me, we will not give them any of the spoil that we recovered[c][b], except that each man may take his wife and his children and lead them away and go.”
translation:
  language: sw
  text: Ndipo kila mtu mwovu na asiyefaa kitu[a] miongoni mwa watu waliokwenda pamoja na Daudi akajibu, nao wakasema, “Kwa sababu hawakwenda pamoja nami[b], hatutawapa chochote katika nyara[c] tulizookoa, isipokuwa kila mmoja achukue mke wake na watoto wake, awaongoze, kisha aende zake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “asiye na sheria.” Neno la Kiebrania hapa ni sifa, si jina maalumu “Beliali.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “nami.” Ingawa wasemaji ni kundi, maandishi yanatumia umoja hapa.'
    reason: source_form
  - marker: c
    text: Au “mali ya vita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: akajibu, nao wakasema
  rationale: Kiebrania hubadili kutoka kitenzi cha umoja kwenda cha wingi. Tafsiri inahifadhi badiliko hilo kwa Kiswahili kinachoeleweka.
- source_word: כָּל אִישׁ רָע וּבְלִיַּעַל
  choice: kila mtu mwovu na asiyefaa kitu
  rationale: רָע inaonyesha uovu wa kimaadili, nayo בְלִיַּעַל hapa ni sifa ya mtu asiye na thamani au asiyefaa, wala si jina maalumu.
- source_word: מֵהָאֲנָשִׁים אֲשֶׁר הָלְכוּ עִם דָּוִד
  choice: miongoni mwa watu waliokwenda pamoja na Daudi
  rationale: מִן ina maana ya sehemu ya kundi; ‘miongoni mwa’ ni Kiswahili cha kawaida na sahihi.
- source_word: לֹא הָלְכוּ עִמִּי
  choice: hawakwenda pamoja nami
  rationale: Kiambishi cha nafsi ya kwanza katika Kiebrania ni cha umoja, ingawa wasemaji ni kundi; umoja umehifadhiwa.
- source_word: לֹא נִתֵּן לָהֶם מֵהַשָּׁלָל
  choice: hatutawapa chochote katika nyara
  rationale: Kauli ya nafsi ya kwanza wingi inaonyesha azimio la kundi; מִן ni ya sehemu, hivyo ‘chochote katika nyara.’
- source_word: אֲשֶׁר הִצַּלְנוּ
  choice: tulizookoa
  rationale: Hifili ya נצל ni kuokoa au kunusuru. Kwa mali iliyotwaliwa na kurudishwa, ‘tulizookoa’ huhifadhi picha ya chanzo bila kupoteza maana ya kurejesha.
- source_word: כִּי אִם
  choice: isipokuwa
  rationale: Kirai hiki kinaingiza jambo pekee walilokubali kuwapa.
- source_word: אִישׁ אֶת אִשְׁתּוֹ וְאֶת בָּנָיו
  choice: kila mmoja amchukue mke wake na watoto wake
  rationale: אִישׁ ina matumizi ya kugawa kwa kila mtu. בָּנָיו inaweza kutaja wana, lakini katika muktadha wa familia inaweza kujumuisha watoto.
- source_word: וְיִנְהֲגוּ וְיֵלֵכוּ
  choice: awaongoze waondoke, kisha waende zao
  rationale: Tafsiri inawakilisha vitenzi vyote viwili—kuongoza/kuondoa na kwenda—kwa lugha ya kawaida, huku ikihifadhi wingi wa kitenzi cha mwisho.
theological_decisions:
- issue: Maana ya בְלִיַּעַל
  choice: asiyefaa kitu
  alternative: asiye na sheria; Beliali
  rationale: Katika muktadha huu neno ni sifa ya kudharaulika kwa mtu, si jina la kiumbe cha kiroho. Hivyo tafsiri haileti maana ya baadaye ambayo kifungu hiki hakidai.
- issue: Umoja ‘nami’ ndani ya kauli ya kundi
  choice: nami
  alternative: nasi
  rationale: Maandishi ya Kiebrania yana nafsi ya kwanza umoja. Kuihifadhi huacha wazi mvutano wa kisarufi badala ya kuusawazisha kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mabadiliko ya umoja na wingi katika chanzo yamehifadhiwa kadiri Kiswahili kinavyoruhusu.
