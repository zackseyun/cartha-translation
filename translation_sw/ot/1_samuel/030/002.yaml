base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/002.yaml
  text: They took captive the women who were in it[a], from small to great. They did not kill anyone, but led them away and went on their way.
translation:
  language: sw
  text: Wakawateka wanawake waliokuwa humo, kuanzia wadogo hadi wakubwa.[a] Hawakumuua mtu yeyote, bali waliwapeleka wakaenda zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuanzia vijana hadi wazee.” Nahau ya Kiebrania “kuanzia wadogo hadi wakubwa” inaweza kumaanisha watu wote bila kumwacha yeyote.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: Wakawateka
  rationale: Kitenzi שׁבה humaanisha kuwachukua watu mateka vitani. “Wakawateka” ni kifupi, cha kawaida, na kinadumisha maana hiyo.
- source_word: הַנָּשִׁים
  choice: wanawake
  rationale: Maana ya msingi ni “wanawake,” si hasa “wake”; hivyo haifinyangi kundi linalotajwa kuliko Kiebrania.
- source_word: אֲשֶׁר בָּהּ
  choice: waliokuwa humo
  rationale: Kiwakilishi cha kike cha umoja kinarejelea Siklagi, mji uliotajwa katika mstari uliotangulia. “Humo” ni rejeo la kawaida bila kurudia neno “mji.”
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: kuanzia wadogo hadi wakubwa
  rationale: Hii inadumisha nahau ya Kiebrania na wazo la kuwajumuisha wote, huku ikiacha wazi kama tofauti inayolengwa ni umri, hadhi, au ukubwa.
- source_word: לֹא הֵמִיתוּ אִישׁ
  choice: Hawakumuua mtu yeyote
  rationale: אִישׁ hapa ni mtu mmoja yeyote, si lazima mwanamume mzima. Kauli hii ni ya asili na sahihi katika Kiswahili.
- source_word: וַיִּנְהֲגוּ
  choice: waliwapeleka
  rationale: נהג inaweza kumaanisha kuwaongoza au kuwapeleka wengine mbele. “Waliwapeleka” huonyesha kwamba mateka waliondolewa kwa lazima bila kuongeza namna ambayo haijaelezwa.
- source_word: וַיֵּלְכוּ לְדַרְכָּם
  choice: wakaenda zao
  rationale: Hii ni nahau ya Kiswahili inayolingana kwa kawaida na maana ya kuondoka na kuendelea na njia yao.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na heshima. Nahau “wadogo hadi wakubwa” imehifadhiwa ili kutofunga maana kwa umri pekee; maelezo ya uwezekano wa umri yametolewa katika tanbihi.
