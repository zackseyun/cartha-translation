  footnotes:
  - marker: a
    text: Au, “walikuwa wamesafiri huku na huku” au “walikuwa wakihamahama.” Kitenzi cha Kiebrania kinaonyesha mwendo wa kurudiwa-rudiwa kutoka sehemu moja hadi nyingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/אֲשֶׁר
  choice: na kwa wale waliokuwa
  rationale: Muundo huu unaendeleza orodha ya waliopokea zawadi katika mstari uliotangulia; wingi uliodokezwa umewekwa wazi kwa Kiswahili cha kawaida.
- source_word: בְּ/חֶבְרוֹן
  choice: Hebroni
  rationale: Kiambishi -ni kinaonyesha mahali kwa njia ya kawaida katika Kiswahili.
- source_word: וּֽ/לְ/כָל הַ/מְּקֹמוֹת
  choice: na kwa sehemu zote
  rationale: Inahifadhi maana ya jumla ya כָל pamoja na nomino ya wingi, huku ikiendeleza orodha ya walikopelekewa zawadi.
- source_word: אֲשֶׁר ... שָׁם
  choice: ambako
  rationale: Kiswahili huunganisha kiwakilishi cha uhusiano wa mahali na wazo la ‘huko’ kwa neno moja la asili, hivyo hakuna haja ya kurudia ‘huko.’
- source_word: הִתְהַלֶּךְ
  choice: walikuwa wamezungukazunguka
  rationale: Umbo la Kiebrania hapa linaonyesha kutembea au kuhama mara kwa mara kutoka sehemu moja hadi nyingine, si safari moja tu.
- source_word: דָּוִד הוּא וַ/אֲנָשָׁיו
  choice: Daudi na watu wake
  rationale: Hii ni namna ya asili ya Kiswahili ya kumtaja Daudi pamoja na kundi lake; kiwakilishi הוּא hakihitaji kutafsiriwa kwa neno ‘mwenyewe’ katika muktadha huu.
