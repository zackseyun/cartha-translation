translation:
  language: sw
  text: Daudi akapata tena vyote ambavyo Waamaleki walikuwa wamechukua[a], naye Daudi akawaokoa wake zake wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaokoa” katika vifungu vyote viwili; Kiebrania kinatumia kitenzi kilekile katika vifungu vyote viwili, lakini Kiswahili cha kawaida hutumia “akapata tena” kwa vilivyochukuliwa na “akawaokoa” kwa wake zake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל / הִצִּיל (נצל)
  choice: akarejesha / akawaokoa
  rationale: Mzizi huohuo wa Kiebrania umetumiwa mara mbili. Katika kishazi cha kwanza, kinachohusu vitu na watu waliokuwa wamechukuliwa, “akarejesha” ni Kiswahili cha kawaida kinachoonyesha kuvipata tena; katika kishazi cha pili, kinachowahusu wake zake, “akawaokoa” ndilo neno la asili zaidi.
- source_word: כָּל אֲשֶׁר לָקְחוּ עֲמָלֵק
  choice: vyote ambavyo Waamaleki walikuwa wamechukua
  rationale: “Vyote ambavyo” huwasilisha maana ya כָּל אֲשֶׁר, nayo “walikuwa wamechukua” huonyesha kwamba tendo hilo lilitangulia kurejeshwa. Jina la umoja עֲמָלֵק linatumika kwa maana ya pamoja; “Waamaleki” linaifanya maana hiyo iwe wazi na ya kawaida katika Kiswahili.
- source_word: שְׁתֵּי נָשָׁיו
  choice: wake zake wawili
  rationale: Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi wazi idadi ya wake wawili.
- source_word: דָּוִד ... דָּוִד
  choice: Daudi ... Daudi
  rationale: Kurudiwa kwa jina la Daudi kunahifadhi msisitizo na muundo wa maandishi ya Kiebrania badala ya kubadili jina la pili kuwa kiwakilishi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Tafsiri inadumisha kurudiwa kwa jina la Daudi na inaonyesha kwa tanbihi kwamba kitenzi kimoja cha Kiebrania kimetafsiriwa kwa maneno mawili kulingana na muktadha.
