base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/009.yaml
  text: So David went[a], he and the six hundred men who were with him, and they came to the Brook Besor[b], where those who were left behind stayed.
translation:
  language: sw
  text: Basi Daudi akaenda, yeye pamoja na wale wanaume mia sita waliokuwa pamoja naye, nao wakafika mpaka kwenye Kijito cha Besori[b], ambako wale waliosalia wakabaki hapo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale waliosalia wakasimama”; kihalisi, “waliosalia walisimama.”
    reason: lexical_alternative
  - marker: b
    text: “Kijito cha Besori” kinaweza pia kuitwa “Wadi Besori,” yaani mkondo wa maji wa msimu au korongo lake.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Basi Daudi akaenda
  rationale: Kiunganishi na kitenzi vinaendeleza simulizi; “Basi” na “akaenda” ni mtiririko wa kawaida wa masimulizi ya Kiswahili.
- source_word: הוּא וְשֵׁשׁ מֵאוֹת אִישׁ אֲשֶׁר אִתּוֹ
  choice: yeye pamoja na wale wanaume mia sita waliokuwa pamoja naye
  rationale: “Yeye pamoja na” inadumisha msisitizo wa kiwakilishi huru הוּא, na “wanaume” inafaa kwa kundi hili la wapiganaji.
- source_word: וַיָּבֹאוּ
  choice: nao wakafika
  rationale: Kitenzi cha wingi kinamhusisha Daudi pamoja na watu wake; “wakafika” huwasilisha maana ya kuwasili kwa kawaida.
- source_word: עַד נַחַל הַבְּשׂוֹר
  choice: mpaka kwenye Kijito cha Besori
  rationale: עַד inaonyesha kikomo cha safari, na נַחַל inaweza kumaanisha kijito au bonde lenye mkondo wa msimu. “Kijito” ni neno linaloeleweka kwa urahisi, huku tanbihi ikihifadhi uwezekano wa korongo lenye mkondo wa msimu.
- source_word: וְהַנּוֹתָרִים
  choice: Wale waliosalia
  rationale: Umbo hili la kishirikishi linawataja watu waliobaki katika hatua hiyo ya safari bila kuongeza sababu, ambayo inaelezwa katika mstari unaofuata.
- source_word: עָמָדוּ
  choice: wakakaa pale
  rationale: Ingawa maana ya msingi ni “walisimama,” katika muktadha wa safari kitenzi kinaweza kumaanisha kusimama safari na kubaki mahali. “Wakakaa pale” ni Kiswahili cha kawaida; tanbihi inadumisha maana halisi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi la Biblia. Jina Besor limetoholewa kuwa “Besori” ili litamkike kwa kawaida katika Kiswahili. Alama za tanbihi zimewekwa karibu na vipashio vinavyofafanuliwa; tanbihi [a] imewekwa kwenye kishazi cha mwisho badala ya baada ya “akaenda,” kwa kuwa maudhui yake yanahusu עָמָדוּ.
