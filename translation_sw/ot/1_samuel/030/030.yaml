  text: na kwa wale wa Horma, na kwa wale wa Borashani[a], na kwa wale wa Athaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Borashani ni jina la mahali. Kihalisi, vipengele vya jina hilo vinaweza kudokeza “kisima” au “shimo la moshi,” lakini hapa limetoholewa badala ya kutafsiriwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: na kwa wale wa
  rationale: Muundo huu unaunganisha kiunganishi, kihusishi cha mpokeaji, na kiwakilishi cha uhusiano. Katika orodha hii ya waliopokea zawadi, Kiswahili cha kawaida na chenye maana sahihi ni “na kwa wale wa,” bila kulazimisha kitenzi kisichotajwa wazi.
- source_word: בְּחָרְמָה
  choice: Horma
  rationale: Hili ni jina la mahali. Kiambishi בְּ kinaeleza mahali, lakini katika muundo wa Kiswahili “wale wa Horma,” uhusiano huo wa mahali umeonyeshwa kwa “wa.”
- source_word: בְּבוֹר עָשָׁן
  choice: Bor-ashani
  rationale: Hili linachukuliwa kuwa jina moja la mahali lenye sehemu mbili, hivyo limetoholewa badala ya kutafsiriwa kama “shimo la moshi.” Kistari kinaonyesha kwamba sehemu hizo mbili zinaunda jina moja.
- source_word: בַּעֲתָךְ
  choice: Athaki
  rationale: Hili ni jina la mahali lililotoholewa kwa mfumo unaosomeka kwa kawaida katika Kiswahili; maana ya mahali imehifadhiwa katika usemi “wale wa Athaki.”
theological_decisions: []
translation_notes:
