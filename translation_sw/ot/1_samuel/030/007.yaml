base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/007.yaml
  text: Then David said to Abiathar the priest[a], the son of Ahimelech[b], “Please bring me the ephod.” So Abiathar brought the ephod to David.
translation:
  language: sw
  text: Ndipo Daudi akamwambia Abiathari kuhani, mwana wa Ahimeleki, “Tafadhali niletee efodi[a].” Basi Abiathari akamletea Daudi efodi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efodi ilikuwa vazi au kifaa kitakatifu cha kikuhani kilichotumiwa katika ibada ya Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “Ndipo” na kitenzi cha “-mwambia” huonyesha hatua inayofuata na mlengwa wa usemi kwa Kiswahili cha kawaida.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Ni cheo kinachomtambulisha Abiathari; Kiswahili hakihitaji kibainishi tofauti ili kuonyesha uainisho huu.
- source_word: בֶּן אֲחִימֶלֶךְ
  choice: mwana wa Ahimeleki
  rationale: Kirai cha Kiebrania kinaonyesha nasaba, na “mwana wa” ni ulinganifu wa moja kwa moja na wa asili.
- source_word: הַגִּישָׁה נָּא לִי
  choice: Tafadhali niletee
  rationale: Amri ya Hiphil ya נגשׁ ina maana ya kusogeza au kuwasilisha, huku נָא ikilainisha ombi. “Tafadhali niletee” ni ya kawaida na huhifadhi maana hiyo bila uzito usio wa lazima.
- source_word: הָאֵפֹד
  choice: efodi
  rationale: Ni jina la kifaa au vazi maalumu la kikuhani lisilo na kisawe sahihi cha Kiswahili; umbo lililohamishwa kwa sauti huhifadhi upekee wake wa kihistoria na kidini.
- source_word: וַיַּגֵּשׁ
  choice: Basi ... akamletea
  rationale: Mzizi uleule wa ombi la awali unaonyesha Abiathari alikisogeza kwa Daudi; “akamletea” ni ya asili katika muktadha, na “Basi” huonyesha mwitikio unaofuata.
- source_word: אֶל דָּוִד
  choice: Daudi
  rationale: Kiambishi cha mtendewa katika “akamletea Daudi” huwasilisha mwendo kuelekea kwa Daudi kwa Kiswahili cha asili.
theological_decisions:
- issue: Maana ya אֵפוֹד kama kitu cha kikuhani kinachohusishwa na kutafuta mwongozo wa Mungu
  choice: Kutumia neno “efodi” katika matini kuu na kulifafanua kwa tanbihi bila kubainisha kwa uhakika kama ni vazi au kifaa
  alternative: vazi la kikuhani; kifaa kitakatifu cha kikuhani
  rationale: Neno la Kiebrania linataja kitu maalumu cha ibada ya Israeli, lakini mstari huu pekee haulazimishi utambulisho kamili wa umbo au kazi yake. Kulihamisha kwa sauti kunahifadhi utata huo na huepuka kuingiza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na wenye heshima. Majina yameandikwa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia. Alama ya tanbihi [a] imewekwa mara tu baada ya “efodi,” neno linalohitaji ufafanuzi.
