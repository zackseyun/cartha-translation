base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/015.yaml
  text: David said to him[a], “Will you lead me down to this raiding party?” He said, “Swear to me by God that you will not kill me or hand me over into the hand of my master, and I will lead you down to this raiding party.”
translation:
  language: sw
  text: Daudi akamwambia, “Je, utanishusha hadi kwa kikosi hiki cha wavamizi[a]?” Yule mtu akamjibu, “Niapie kwa Mungu kwamba hutaniua wala kunikabidhi mikononi mwa bwana wangu, nami nitakushusha hadi kwa kikosi hiki cha wavamizi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kundi” au “jeshi”; neno la Kiebrania linamaanisha kundi lililokuwa likifanya uvamizi na uporaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתוֹרִדֵנִי
  choice: utanishusha hadi
  rationale: Kauli ya Hifili ya ירד ina maana ya kumsababisha mtu ashuke au kumwongoza kwenda chini. ‘Utanishusha hadi’ inadumisha nguvu ya kisababishi na mwelekeo wa safari kwa Kiswahili cha kawaida.
- source_word: הַגְּדוּד
  choice: kikosi cha wavamizi
  rationale: גדוד hapa ni kundi la kijeshi lililokuwa likifanya uvamizi na uporaji. ‘Kikosi cha wavamizi’ kinaeleza tabia na shughuli ya kundi hilo kwa uwazi.
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים
  choice: Niapie kwa Mungu
  rationale: Kauli hii ni agizo la kutoa kiapo rasmi huku Mungu akiitwa kuwa shahidi. ‘Niapie kwa Mungu’ ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: אִם תְּמִיתֵנִי
  choice: kwamba hutaniua
  rationale: 'Katika muundo wa kiapo, אִם ina maana hasi iliyodokezwa. Kiswahili huhitaji kukataa kuwe wazi: ombi ni kwamba Daudi aape kutomuua.'
- source_word: תַּסְגִּרֵנִי בְּיַד אֲדֹנִי
  choice: kunikabidhi mikononi mwa bwana wangu
  rationale: ‘Kunikabidhi’ inaonyesha kumpa mtu kwa mamlaka ya mwingine, na ‘mikononi mwa’ inadumisha sitiari ya Kiebrania ya kuwa chini ya uwezo au udhibiti.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Neno hili hapa linamtaja mmiliki au mkuu wa mtumishi huyo Mmisri, si Mungu. ‘Bwana wangu’ linafaa katika uhusiano huo wa kijamii na muktadha unazuia mkanganyiko.
- source_word: וְאוֹרִדְךָ
  choice: nami nitakushusha hadi
  rationale: Kauli ya Hifili ya ירד inarudiwa. Tafsiri ileile inadumisha ulinganifu wa maneno na mwelekeo uliomo katika Kiebrania.
