translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye staha. Marudio ya ‘kwa wale waliokuwa’ yamehifadhiwa ili kuonyesha muundo wa orodha ya Kiebrania. Alama [a] imewekwa baada ya jina linalohusika.
