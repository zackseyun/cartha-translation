lexical_decisions:
- source_word: לַאֲשֶׁר
  choice: kwa wale waliokuwa
  rationale: Muundo לַאֲשֶׁר katika orodha hii unaonyesha wapokeaji kwa namna ya kugawa; ‘kwa wale waliokuwa’ ni Kiswahili cha kawaida kinachoonyesha walengwa na mahali walipokuwa.
- source_word: בְּבֵית אֵל
  choice: Betheli
  rationale: Hili ni jina la mahali katika muktadha huu, si kirai cha kawaida ‘nyumba ya Mungu’; umbo la Kiswahili ‘Betheli’ linafuata matumizi yaliyozoeleka.
- source_word: בְּרָמוֹת נֶגֶב
  choice: Ramothi-negebu
  rationale: Kirai hiki kinaeleweka vizuri kama jina la mahali. Kutafsiri kwa kulinakili kunahifadhi uwezekano kwamba נֶגֶב ni sehemu ya jina au kibainishi chake bila kuamua zaidi ya maandishi.
- source_word: בְּיַתִּר
  choice: Yatiri
  rationale: Ni jina la mahali; ‘Yatiri’ linawakilisha kwa karibu konsonanti za Kiebrania יַתִּר na lina umbo linalotamkika kwa urahisi katika Kiswahili.
- source_word: וְ
  choice: na
  rationale: Kiunganishi rahisi kinachounganisha kipengele cha mwisho katika orodha ya wapokeaji.
