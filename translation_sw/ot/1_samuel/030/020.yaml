  text: David took all the flocks and the herds[a]. They drove them ahead of the other livestock, and said[b], “This is David’s spoil.”
translation:
  language: sw
  text: Daudi akachukua makundi yote ya kondoo na mbuzi, na ng’ombe wote. Wakawaendesha mbele ya mifugo ile[a], nao wakasema, “Hizi ndizo nyara za Daudi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Inaelekea mifugo iliyochukuliwa sasa iliendeshwa mbele ya mifugo mingine iliyokuwa imepatikana tena, huku watu wakiitangaza kuwa nyara za Daudi. Kiebrania chenyewe kinasema kihalisi “mbele ya mifugo ile.”
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akachukua
  rationale: Kitenzi לקח hapa ni tendo la kawaida la simulizi lenye maana ya ‘kuchukua’; hakihitaji kuongeza wazo la kunyakua kwa nguvu.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: makundi yote ya kondoo, mbuzi na ng’ombe
  rationale: צאן ni mifugo midogo, hasa kondoo na mbuzi, ilhali בקר ni ng’ombe. Kutaja aina hizi ni Kiswahili cha kawaida na kunadumisha tofauti ya makundi hayo.
- source_word: נָהֲגוּ
  choice: wakawaendesha
  rationale: נהג katika muktadha huu humaanisha kuwasukuma au kuwaongoza wanyama waende mbele; ‘kuwaendesha’ linafaa kwa mifugo.
- source_word: לִפְנֵי הַמִּקְנֶה הַהוּא
  choice: mbele ya mifugo ile
  rationale: Tafsiri hii inahifadhi maana ya mahali ya לִפְנֵי na kiashiria הַהוּא bila kuamua kimya kimya mifugo hiyo ilikuwa ipi.
- source_word: זֶה שְׁלַל דָּוִד
  choice: Hizi ndizo nyara za Daudi
  rationale: שׁלל ni mali iliyotwaliwa vitani au katika uvamizi. Kiswahili hutumia ‘nyara’ kwa kawaida katika wingi, kwa hiyo ‘hizi ndizo’ hurejelea wanyama waliotwaliwa huku ikitoa utambulisho uleule wa kauli ya Kiebrania.
