translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. ‘Nyara’ ni neno la kawaida kwa mali iliyotwaliwa katika vita au uvamizi; muundo wa sentensi haubainishi zaidi ya Kiebrania ni nani hasa aliyewaendesha wanyama.
