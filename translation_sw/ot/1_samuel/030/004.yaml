  text: Then David and the people who were with him raised their voices and wept until they had no strength left to weep[a].
translation:
  language: sw
  text: Ndipo Daudi na watu waliokuwa pamoja naye wakapaza sauti zao, wakalia mpaka wakakosa nguvu za kuendelea kulia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno zaidi, “wakainua sauti yao, wakalia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת קוֹלָם
  choice: wakapaza sauti zao
  rationale: Nahau ya Kiebrania נָשָׂא + קוֹל ina maana ya kupaza sauti. Kiswahili hutumia kwa kawaida wingi “sauti zao” kwa tendo hili la pamoja.
- source_word: וַיִּבְכּוּ
  choice: wakalia
  rationale: Kitenzi בכה humaanisha kulia kwa huzuni; “wakalia” ni cha kawaida, cha heshima, na kinafaa kwa simulizi hili.
- source_word: עַד אֲשֶׁר אֵין בָּהֶם כֹּחַ לִבְכּוֹת
  choice: mpaka wakakosa nguvu za kuendelea kulia
  rationale: Kauli hii inaonyesha kuwa walilia hadi wakaishiwa kabisa na nguvu. “Kuendelea kulia” huwasilisha kwa Kiswahili asilia maana inayodokezwa na muktadha.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: watu waliokuwa pamoja naye
  rationale: עָם ni “watu”; ingawa katika muktadha hawa ni wapiganaji wa Daudi, tafsiri hii haiongezi maana ya “askari” au “wanaume” ambayo haijasemwa moja kwa moja.
