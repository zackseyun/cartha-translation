lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: akawafuatilia
  rationale: Kitenzi רדף humaanisha kufuatilia au kukimbiza. “Akawafuatilia” kinadumisha maana ya harakati za kuwafuata maadui katika simulizi.
- source_word: הוּא וְאַרְבַּע מֵאוֹת אִישׁ
  choice: akiwa pamoja na wanaume mia nne
  rationale: Kirai hiki kinamtaja Daudi mwenyewe pamoja na kikosi cha wanaume mia nne; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: וַיַּעַמְדוּ
  choice: wakabaki nyuma
  rationale: Ingawa עמד kimsingi inaweza kumaanisha “kusimama,” hapa inaonyesha kwamba kundi hilo halikuendelea na safari ya kuwafuatilia, hivyo “wakabaki nyuma” linaeleza kazi yake katika muktadha.
- source_word: אֲשֶׁר פִּגְּרוּ מֵעֲבֹר
  choice: kwa sababu walikuwa wamechoka mno kuweza kuvuka
  rationale: Katika muktadha huu פגר inaonyesha kulegea, kuchoka, au kushindwa kuendelea; muundo wenye מן unaonyesha kwamba uchovu uliwazuia kuvuka.
- source_word: נַחַל הַבְּשׂוֹר
  choice: Kijito cha Besori
  rationale: נחל inaweza kutaja kijito, bonde la mto, au mkondo wa maji wa msimu. “Kijito cha Besori” ni tafsiri fupi na inayoeleweka, huku tanbihi ikihifadhi upana wa maana.
