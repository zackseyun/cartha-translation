translation:
  language: sw
  text: Basi Daudi akawafuatilia, yeye pamoja na wanaume mia nne; wanaume mia mbili wakabaki nyuma, wakiwa wamechoka mno[a] wasioweza kuvuka Kijito cha Besori[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walilegea” au “walibaki nyuma kwa sababu ya uchovu.” Kitenzi cha Kiebrania kinaweza kuwa na maana hizi katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “Kijito cha Besori.” Neno נחל linaweza kumaanisha kijito, bonde la mto, au mkondo wa maji wa msimu.'
