base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/016.yaml
  text: When he had led him down[a], behold, they were spread out over the face of all the land[b], eating and drinking and celebrating over all the great spoil that they had taken from the land of the Philistines and from the land of Judah.
translation:
  language: sw
  text: Akamwongoza Daudi kwenda chini; na tazama, walikuwa wametapakaa[a] katika eneo lote, wakila, wakinywa, na kusherehekea kwa sababu ya nyara nyingi[b] walizokuwa wameteka kutoka nchi ya Wafilisti na kutoka nchi ya Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wametawanyika katika eneo lote.” Neno la Kiebrania linaweza kusisitiza ama kutawanyika kwao ama kuenea kwao katika eneo pana.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakisherehekea juu ya nyara nyingi.” Kihusishi cha Kiebrania kinaweza kuonyesha sababu au msingi wa sherehe yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרִדֵהוּ
  choice: Alipokuwa amemwongoza Daudi kwenda chini
  rationale: Hifili ya ירד ina maana ya kumfanya mtu ashuke, kumteremsha, au kumwongoza kwenda chini. Kutaja Daudi kunafanya kiwakilishi cha Kiebrania kieleweke kwa msomaji wa Kiswahili bila kubadili mhusika wa simulizi.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili huvuta fikira kwa ghafla kwenye mandhari inayoonekana; “tazama” huhifadhi uhai huo wa kisimulizi kwa lugha yenye hadhi.
- source_word: נְטֻשִׁים עַל־פְּנֵי כָל־הָאָרֶץ
  choice: walikuwa wametapakaa katika eneo lote
  rationale: Kauli tendwa ya נטשׁ huonyesha kutawanyika au kuenea mahali pengi. “Wametapakaa” ni ya kawaida na hai katika Kiswahili, huku “eneo lote” likionyesha kwamba הָאָרֶץ hapa ni eneo la mahali walipokuwa, si dunia nzima.
- source_word: אֹכְלִים וְשֹׁתִים וְחֹגְגִים
  choice: wakila, wakinywa na kusherehekea
  rationale: Vitenzi hivi vya hali endelevu vinaonyesha matendo matatu yaliyokuwa yakiendelea. Tafsiri inahifadhi mpangilio wake bila kuyafupisha kuwa tendo moja.
- source_word: בְּכֹל הַשָּׁלָל הַגָּדוֹל
  choice: kwa sababu ya nyara nyingi sana
  rationale: בְּ inaweza kuonyesha sababu au jambo lililokuwa msingi wa sherehe. “Nyara” linafaa kwa mali iliyotekwa vitani, na “nyingi sana” hutoa kwa Kiswahili maana ya wingi mkubwa unaoonyeshwa na הַגָּדוֹל.
- source_word: אֲשֶׁר לָקְחוּ
  choice: walizokuwa wameteka
  rationale: Muundo huu unaonyesha kwamba kuteka nyara kulitangulia kula, kunywa na kusherehekea.
- source_word: מֵאֶרֶץ פְּלִשְׁתִּים וּמֵאֶרֶץ יְהוּדָה
  choice: kutoka nchi ya Wafilisti na nchi ya Yuda
  rationale: Kurudia “nchi ya” huhifadhi ulinganifu wa vifungu viwili na maana ya maeneo yaliyotajwa katika Kiebrania.
