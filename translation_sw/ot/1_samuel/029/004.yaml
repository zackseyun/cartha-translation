  text: וַ/יִּקְצְפ֨וּ עָלָ֜י/ו שָׂרֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֣אמְרוּ ל/וֹ֩ שָׂרֵ֨י פְלִשְׁתִּ֜ים הָשֵׁ֣ב אֶת הָ/אִ֗ישׁ וְ/יָשֹׁב֙ אֶל מְקוֹמ/וֹ֙ אֲשֶׁ֣ר הִפְקַדְתּ֣/וֹ שָׁ֔ם וְ/לֹֽא יֵרֵ֤ד עִמָּ֨/נוּ֙ בַּ/מִּלְחָמָ֔ה וְ/לֹא יִֽהְיֶה לָּ֥/נוּ לְ/שָׂטָ֖ן בַּ/מִּלְחָמָ֑ה וּ/בַ/מֶּ֗ה יִתְרַצֶּ֥ה זֶה֙ אֶל אֲדֹנָ֔י/ו הֲ/ל֕וֹא בְּ/רָאשֵׁ֖י הָ/אֲנָשִׁ֥ים הָ/הֵֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/004.yaml
  text: But the Philistine commanders were angry with him[a], and the Philistine commanders said to him, “Send the man back, so that he may return to his place where you assigned him, and let him not go down with us into battle, lest he become an adversary to us in the battle[b]. For with what could this man reconcile himself to his lord? Would it not be with the heads of those men?”
translation:
  language: sw
  text: Lakini makamanda wa Wafilisti wakamkasirikia, nao makamanda wa Wafilisti wakamwambia, “Mrudishe mtu huyu, ili arudi mahali pake ulipomweka. Asishuke pamoja nasi vitani, asije akawa mpinzani wetu vitani.[a] Kwa maana mtu huyu angejipatiaje tena kibali cha bwana wake?[b] Je, si kwa vichwa vya watu hawa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania שָׂטָן hapa linamaanisha “mpinzani” au “adui,” wala si jina maalumu “Shetani.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kujifanya akubalike tena mbele ya bwana wake.” Usemi wa Kiebrania unahusu kupata tena kibali cha mwenye mamlaka juu yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצְפוּ עָלָיו
  choice: wakamkasirikia
  rationale: Kitenzi hiki kinaonyesha kuwa walikuwa na hasira dhidi yake; ‘wakamkasirikia’ ni Kiswahili cha kawaida, cha heshima, na kisichozidisha nguvu ya muktadha.
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: makamanda wa Wafilisti
  rationale: Katika mazingira haya ya kijeshi, שָׂרִים ni viongozi wa kijeshi; ‘makamanda’ linafaa kuliko ‘wakuu’ au ‘wafalme’.
- source_word: הָשֵׁב אֶת הָאִישׁ
  choice: Mrudishe mtu huyu
  rationale: Hifili ya שוב ina maana ya kusababisha mtu arudi; ‘mrudishe’ huhifadhi amri hiyo kwa Kiswahili cha asili.
- source_word: וְיָשֹׁב אֶל מְקוֹמוֹ
  choice: ili arudi mahali pake
  rationale: ‘Ili arudi’ huonyesha matokeo yaliyokusudiwa baada ya amri, huku ‘mahali pake’ kikifuata maana ya Kiebrania.
- source_word: אֲשֶׁר הִפְקַדְתּוֹ שָׁם
  choice: ulipomweka
  rationale: הפקיד inaweza kumaanisha kumweka, kumteua, au kumpangia kituo. ‘Ulipomweka’ ni pana, wazi, na linafaa kwa muktadha.
- source_word: וְלֹא יֵרֵד עִמָּנוּ בַּמִּלְחָמָה
  choice: Asishuke pamoja nasi kwenda vitani
  rationale: ‘Asishuke’ huhifadhi kitenzi ירד, na ‘kwenda vitani’ ni usemi wa kawaida unaoeleza kujiunga na mapigano.
- source_word: וְלֹא יִהְיֶה לָּנוּ לְשָׂטָן
  choice: asije akawa mpinzani wetu
  rationale: שָׂטָן hapa ni nomino ya kawaida yenye maana ya mpinzani au adui, si jina maalumu ‘Shetani.’ ‘Mpinzani wetu’ huhifadhi maana bila kuingiza wazo lisilomo katika kifungu.
- source_word: יִתְרַצֶּה זֶה אֶל אֲדֹנָיו
  choice: mtu huyu angeweza kujipatanisha vipi na bwana wake
  rationale: Hitpaeli ya רצה hapa inahusu kujifanya akubalike tena au kurejesha uhusiano mzuri na mwenye mamlaka. ‘Kujipatanisha’ huhifadhi kwa kiasi fulani hali ya kujirejelea ya kitenzi.
- source_word: אֲדֹנָיו
  choice: bwana wake
  rationale: Neno hilo linamtaja mwenye mamlaka juu ya Daudi, yaani Sauli. ‘Bwana wake’ linaonyesha uhusiano huo wa kisiasa bila kuifanya kuwa rejeo la jina la Mungu.
- source_word: הֲלוֹא בְּרָאשֵׁי הָאֲנָשִׁים הָהֵם
  choice: Je, si kwa vichwa vya watu hawa?
  rationale: Kauli ya Kiebrania imefupishwa kimakusudi na inadokeza kwamba Daudi angeweza kurejesha kibali cha Sauli kwa kuwaua Wafilisti. Tafsiri inadumisha ufupi na nguvu ya picha ya chanzo.
theological_decisions:
- issue: Maana ya שָׂטָן
  choice: nomino ya kawaida ‘mpinzani’
  alternative: jina maalumu ‘Shetani’
  rationale: Katika simulizi hili la kihistoria, neno hilo humaanisha mpinzani katika vita. Kulitafsiri kama jina ‘Shetani’ kungeingiza dai la kiteolojia ambalo kifungu hakitoi.
- issue: Maana ya יִתְרַצֶּה katika uhusiano wa Daudi na Sauli
  choice: kujipatanisha na bwana wake
  alternative: kupata tena kibali cha bwana wake
  rationale: Chanzo kinaweza kueleweka kama kujifanya akubalike tena au kurejesha kibali. ‘Kujipatanisha’ huhifadhi hali ya kujirejelea na mvutano wa uhusiano bila kufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wa heshima. Marudio ya ‘makamanda wa Wafilisti’ yamehifadhiwa kwa sababu yapo katika chanzo. ‘Asishuke’ huhifadhi taswira ya kijiografia/kijeshi ya Kiebrania, na ‘bwana’ limeandikwa kwa herufi ndogo kwa kuwa linamtaja Sauli, si Mungu.
