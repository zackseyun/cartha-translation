  text: The Philistines gathered all their camps at Aphek[b][a], while Israel was encamped by the spring that is in Jezreel.
translation:
  language: sw
  text: Wafilisti wakakusanya kambi zao zote huko Afeki,[a] nao Israeli walikuwa wamepiga kambi kando ya chemchemi iliyoko Yezreeli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vikosi vyao vyote” au “majeshi yao yote”; Kiebrania husema kwa uhalisi zaidi “kambi zao zote.”
    reason: lexical_alternative
  - marker: b
    text: Au “kando ya chanzo cha maji”; neno la Kiebrania linaweza kumaanisha chemchemi au chanzo cha maji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּצוּ
  choice: wakakusanya
  rationale: Kitenzi קבץ kina maana ya kukusanya au kuleta pamoja. Muundo wa simulizi wa Kiswahili wenye “waka-” unaendeleza mfululizo wa matukio bila kuongeza neno la wakati lisilokuwapo katika chanzo.
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili cha Biblia.
- source_word: כָּל מַחֲנֵיהֶם
  choice: kambi zao zote
  rationale: מַחֲנֶה kimsingi ni “kambi”; tafsiri hii inadumisha taswira halisi ya Kiebrania bila kuibadili kimafafanuzi kuwa majeshi au vikosi.
- source_word: אֲפֵקָה
  choice: huko Afeki
  rationale: Kiambishi cha mwelekeo -ָה kinaonyesha kuelekea Afeki; katika muktadha wa kukusanyika, “huko Afeki” ni ya asili na haidai kwa lazima kutofautisha kufika na kuwapo.
- source_word: וְיִשְׂרָאֵל חֹנִים
  choice: huku Israeli wakiwa wamepiga kambi
  rationale: וְ hapa inaunganisha hali mbili zinazotokea kwa wakati mmoja. “Huku” huonyesha ulinganifu huo, na wingi “wakiwa” unalitazama taifa la Israeli kama watu wake, kulingana na kitenzi cha wingi חֹנִים.
- source_word: בַּעַיִן
  choice: karibu na chemchemi
  rationale: עַיִן hapa ni chanzo cha maji, yaani chemchemi. “Karibu na” huwasilisha nafasi ya kambi kando ya chanzo hicho.
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: iliyoko Yezreeli
  rationale: Kirai hiki kinaieleza chemchemi kwa kuitaja mahali ilipo. “Iliyoko Yezreeli” ni Kiswahili cha kawaida na cha moja kwa moja.
