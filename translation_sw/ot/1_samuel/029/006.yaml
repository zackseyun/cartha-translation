base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/006.yaml
  text: Then Achish called David and said to him[a], “As Yahweh lives, you are upright, and your going out and your coming in with me in the camp is good in my sight; for I have not found any evil in you from the day of your coming to me to this day. But in the eyes of the lords of the Philistines[c][b], you are not good.”
translation:
  language: sw
  text: Ndipo Akishi akamwita Daudi na kumwambia, “Kama Yahwe aishivyo, wewe ni mwadilifu. Kutoka kwako na kuingia kwako pamoja nami kambini ni jambo jema machoni pangu[a], kwa maana sijapata uovu wowote kwako tangu siku ulipokuja kwangu mpaka leo. Lakini machoni pa watawala wa Wafilisti[b], wewe hukubaliki[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenendo wako pamoja nami kambini unanipendeza.” Kiebrania kinasema kihalisi, “kutoka kwako na kuingia kwako pamoja nami kambini ni jambo jema machoni pangu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatumia cheo maalumu סְרָנִים kwa watawala wa Wafilisti.
    reason: cultural_note
  - marker: c
    text: Kiebrania kinasema kihalisi, “wewe si mwema”; katika muktadha huu maana yake ni “wewe hukubaliki” au “hawapendezwi nawe.”
    reason: alternative_reading
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Kama Yahwe aishivyo
  rationale: Ni kauli ya kawaida ya kiapo. Tafsiri hii inatoa nguvu ya kiapo kwa Kiswahili cha asili huku ikihifadhi jina la Mungu.
- source_word: יָשָׁר
  choice: mwadilifu
  rationale: Neno hili linaonyesha unyoofu wa kimaadili au uaminifu; “mwadilifu” linafaa katika sifa anayopewa Daudi.
- source_word: צֵאתְךָ וּבֹאֲךָ
  choice: kutoka kwako na kuingia kwako
  rationale: Jozi hii inaweza kumaanisha mwenendo au shughuli zote za mtu, lakini taswira yake halisi inaeleweka katika mazingira ya kambi ya kijeshi na imehifadhiwa.
- source_word: טוֹב בְּעֵינַי
  choice: ni jambo jema machoni pangu
  rationale: Huhifadhi taswira ya Kiebrania ya kutathmini jambo kwa macho, na bado inaeleweka katika Kiswahili cha heshima.
- source_word: אִתִּי בַּמַּחֲנֶה
  choice: pamoja nami kambini
  rationale: מַחֲנֶה hapa ni kambi yenye muktadha wa kijeshi; “kambini” ni fupi, wazi, na ya kawaida.
- source_word: לֹא מָצָאתִי בְךָ רָעָה
  choice: sijaona uovu wowote ndani yako
  rationale: Ingawa kitenzi cha Kiebrania ni “kupata,” Kiswahili hutumia kwa kawaida “kuona” katika tathmini hii; “uovu wowote ndani yako” huhifadhi uzito wa רָעָה.
- source_word: סְרָנִים
  choice: watawala wa Wafilisti
  rationale: Neno hili ni cheo maalumu cha viongozi wa miji ya Wafilisti. “Watawala” linaeleza kazi yao bila kuwafanya tu makamanda wa kijeshi.
- source_word: לֹא טוֹב אָתָּה
  choice: wewe hukubaliki
  rationale: Kiebrania ni kifupi, kihalisi “wewe si mwema.” Katika muundo “machoni pa,” maana ni kwamba Daudi hakubaliki kwa watawala; tafsiri hii ni ya asili na haihusishi uamuzi usiokusudiwa kwamba tabia yake ni ovu.
theological_decisions:
- issue: Jina יהוה katika kiapo kinachotamkwa na mfalme Mfilisti
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandiko ya Kiebrania yanatumia moja kwa moja jina la agano יהוה. “Yahwe” hulihifadhi kama jina binafsi hata linapotamkwa na Akishi, bila kubadili mvutano wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa “kutoka na kuingia” pamoja na “machoni pangu” umehifadhiwa ili kuonyesha taswira ya Kiebrania; tanbihi zinafafanua maana ya kiidioma. Jina Akishi limetumiwa kwa umbo linalofaa mfumo wa sauti wa Kiswahili.
