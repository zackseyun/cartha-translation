base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/003.yaml
  text: Then the Philistine commanders said[a], “What are these Hebrews?” And Achish said to the Philistine commanders, “Is this not David, the servant of Saul king of Israel, who has been with me these days or these years? And I have found nothing against him from the day of his defecting until this very day.”
translation:
  language: sw
  text: Ndipo makamanda wa Wafilisti wakasema, “Vipi kuhusu hawa Waebrania?” Akishi akawaambia makamanda wa Wafilisti, “Je, huyu si Daudi, mtumishi wa Sauli mfalme wa Israeli, ambaye amekuwa pamoja nami siku hizi au miaka hii? Nami sijaona jambo lolote la kumlaumu tangu siku alipohamia upande wangu[a] mpaka leo hii.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri halisi zaidi, “tangu siku ya kuanguka kwake”; yaani, tangu siku alipojiunga nami au kuhamia upande wangu.
    reason: Neno נפל kwa kawaida humaanisha ‘kuanguka,’ lakini katika muktadha wa kisiasa au kijeshi linaweza kumaanisha kuhamia au kujiunga na upande wa mwingine. Usemi wa Kiebrania umeachwa wenye utata wake katika tanbihi.
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: makamanda wa Wafilisti
  rationale: Katika mazingira ya kijeshi, שָׂרִים ni viongozi wa ngazi ya juu; ‘makamanda’ linafaa zaidi kuliko ‘wakuu’ au ‘wafalme wadogo’.
- source_word: מָה הָעִבְרִים הָאֵלֶּה
  choice: Vipi kuhusu hawa Waebrania?
  rationale: Kiebrania kina swali fupi lisilokamilishwa kihisabati. Tafsiri hii inadumisha ufupi na shaka ya makamanda bila kuongeza waziwazi ‘wanafanya nini hapa?’
- source_word: הָעִבְרִים
  choice: Waebrania
  rationale: Neno la asili ni jina la kikabila ‘Waebrania,’ si ‘Waisraeli,’ na linaonyesha mtazamo wa Wafilisti.
- source_word: הֲלוֹא
  choice: Je, huyu si
  rationale: Linadumisha swali la balagha linalotarajia kukubaliwa.
- source_word: עֶבֶד
  choice: mtumishi
  rationale: Katika uhusiano wa Daudi na jumba la kifalme la Sauli, ‘mtumishi’ linafaa kuliko ‘mtumwa’.
- source_word: זֶה יָמִים אוֹ זֶה שָׁנִים
  choice: siku hizi au miaka hii
  rationale: Tafsiri ya karibu inadumisha usemi usio wa kawaida na mkazo wake badala ya kuubadili kuwa muda maalumu usiotajwa.
- source_word: מְאוּמָה
  choice: kosa lolote kwake
  rationale: Katika muktadha, Akishi anasema hakupata jambo lolote la kumlaumu Daudi; ‘kosa lolote kwake’ ni Kiswahili cha kawaida kinachobeba maana hiyo.
- source_word: מִיּוֹם נָפְלוֹ
  choice: tangu siku alipohamia upande wangu
  rationale: Katika muktadha wa kisiasa na kijeshi, נפל inaweza kumaanisha kuhamia au kujisalimisha upande wa mwingine. ‘Upande wangu’ hutokana na Akishi kuwa msemaji, huku tanbihi ikihifadhi picha halisi na uwezekano wa ‘kuasi.’
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo hii
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi mkazo wa ‘siku hii.’
- source_word: אָכִישׁ / דָוִד / שָׁאוּל
  choice: Akishi / Daudi / Sauli
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
