translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida lakini wenye heshima. Kurudiwa kwa 'mapema' na 'asubuhi' kumeachwa kwa sababu kunaakisi vipashio viwili tofauti katika Kiebrania.
