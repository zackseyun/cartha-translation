base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/011.yaml
  text: So David rose early[a], he and his men, to leave in the morning and return to the land of the Philistines[b]. And the Philistines went up to Jezreel.
translation:
  language: sw
  text: Basi Daudi na watu wake waliamka mapema ili waondoke asubuhi[a] na kurudi katika nchi ya Wafilisti. Nao Wafilisti wakapanda kwenda Yezreeli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “ili waende asubuhi, warudi katika nchi ya Wafilisti.”'
    reason: lexical_alternative
  - marker: b
    text: “Wakapanda kwenda” huakisi nahau ya Kiebrania ya kuelekea mahali, ambayo mara nyingi huwa na dokezo la kijiografia au la kijeshi; pia inaweza kutafsiriwa “wakaelekea Yezreeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: akaamka mapema
  rationale: Kauli hii huhifadhi maana ya kuamka au kuanza shughuli mapema, na ni Kiswahili cha kawaida na kinachoeleweka.
- source_word: הוּא וַאֲנָשָׁיו
  choice: yeye pamoja na watu wake
  rationale: Muundo huu unaendeleza msisitizo wa kiwakilishi cha Kiebrania; katika muktadha, 'watu wake' ni kundi la wanaume waliokuwa chini ya Daudi, si lazima watumishi wa nyumbani.
- source_word: לָלֶכֶת בַּבֹּקֶר לָשׁוּב
  choice: ili waondoke asubuhi na kurudi
  rationale: '''Waondoke'' huonyesha kwa kawaida kwamba walikuwa wakitoka kambini, huku ''kurudi'' ikihifadhi kusudi la safari. Neno ''asubuhi'' limehifadhiwa licha ya ''mapema'' iliyotangulia kwa sababu chanzo kina vipashio vyote viwili.'
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: katika nchi ya Wafilisti
  rationale: Huhifadhi nomino halisi 'nchi' na jina la watu, bila kuifanya iwe mji maalumu.
- source_word: עָלוּ
  choice: wakapanda kwenda
  rationale: Huhifadhi nahau ya Kiebrania ya kwenda juu, ambayo inaweza kuwa na maana ya kijiografia au ya mwendo wa kijeshi, bila kuongeza waziwazi wazo la kupiga gwaride.
- source_word: יִזְרְעֶאל
  choice: Yezreeli
  rationale: Hili ni umbo la Kiswahili linalotambulika la jina la mahali Jezreel.
