  text: So now[a], return and go in peace, and do not do evil in the eyes of the Philistine lords.
translation:
  language: sw
  text: Basi, sasa rudi uende kwa amani, wala usifanye jambo baya machoni pa wakuu wa Wafilisti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala usifanye jambo lisilokubalika machoni pa wakuu wa Wafilisti.” Usemi wa Kiebrania unaweza kumaanisha jambo wanaloliona kuwa baya au lisilokubalika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: “Basi” linaonyesha hitimisho au agizo linalotokana na yaliyotangulia, na “sasa” linahifadhi maana ya wakati na hatua ya sasa.
- source_word: שׁוּב וְלֵךְ
  choice: rudi uende
  rationale: Vitenzi viwili vya agizo vimehifadhiwa, vikionyesha kwa mkazo kwamba Daudi arudi na aondoke.
- source_word: בְּשָׁלוֹם
  choice: kwa amani
  rationale: Hii ni tafsiri ya kawaida na ya asili ya nahau ya Kiebrania, inayoweza pia kudokeza kuondoka salama.
- source_word: וְלֹא תַעֲשֶׂה רָע
  choice: wala usifanye jambo baya
  rationale: Inahifadhi uzito wa neno רָע bila kulibana liwe ‘madhara’ tu; “jambo” linafanya usemi uwe wa asili katika Kiswahili.
- source_word: בְּעֵינֵי
  choice: machoni pa
  rationale: Inahifadhi picha ya nahau ya Kiebrania inayohusu jinsi jambo linavyoonekana au kuhukumiwa na mtu.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: wakuu wa Wafilisti
  rationale: סַרְנֵי ni watawala wakuu wa miji-dola ya Wafilisti; “wakuu” ni cheo cha kisiasa kinachoeleweka kwa urahisi bila kuwa jina la dhehebu.
