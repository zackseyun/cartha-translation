  text: And the lords of the Philistines were passing by by hundreds and by thousands[a], and David and his men were passing by at the rear with Achish.
translation:
  language: sw
  text: Nao wakuu wa Wafilisti walikuwa wakipita kwa mamia na kwa maelfu[a], naye Daudi na watu wake walikuwa wakipita mwishoni pamoja na Akishi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda usemi huu ukirejelea makundi au mpangilio wa kijeshi wa mamia na maelfu.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  choice: watawala
  rationale: Neno hili linawataja viongozi wa juu wa kisiasa na kijeshi wa majimbo ya miji ya Wafilisti; “watawala” ni la kawaida na lenye hadhi katika Kiswahili.
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili.
- source_word: עֹבְרִים
  choice: walikuwa wakipita
  rationale: Hali ya kitenzi kishirikishi inaonyesha tendo lililokuwa likiendelea katika msafara.
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: wakiwa katika vikosi vya mamia na maelfu
  rationale: Katika muktadha huu wa kijeshi, maneno yanaelekea kueleza mpangilio wa askari katika makundi ya mamia na maelfu; “vikosi” huifanya maana hiyo ieleweke bila kuondoa uwezekano wa kusoma idadi halisi.
- source_word: אֲנָשָׁיו
  choice: watu wake
  rationale: Hawa ni wafuasi wa Daudi, hasa kikosi chake cha wanaume; “watu wake” ni usemi wa kawaida na hauongezi kwa lazima cheo rasmi cha kijeshi.
- source_word: בָּאַחֲרֹנָה
  choice: nyuma kabisa
  rationale: Usemi huu unaonyesha nafasi ya mwisho au ya nyuma zaidi katika msafara.
- source_word: עִם אָכִישׁ
  choice: pamoja na Akishi
  rationale: Huhifadhi maana ya kuandamana bila kuongeza uhusiano mwingine.
