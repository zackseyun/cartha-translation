  text: וַ/יַּ֣עַן אָכִישׁ֮ וַ/יֹּ֣אמֶר אֶל דָּוִד֒ יָדַ֕עְתִּי כִּ֣י ט֥וֹב אַתָּ֛ה בְּ/עֵינַ֖/י כְּ/מַלְאַ֣ךְ אֱלֹהִ֑ים אַ֣ךְ שָׂרֵ֤י פְלִשְׁתִּים֙ אָֽמְר֔וּ לֹֽא יַעֲלֶ֥ה עִמָּ֖/נוּ בַּ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/009.yaml
  text: Achish answered and said to David[a], “I know that you are good in my eyes, like an angel of God. Yet the commanders of the Philistines have said, ‘He must not go up with us into battle.’”
translation:
  language: sw
  text: Akishi akamjibu Daudi, akasema, “Ninajua kwamba wewe ni mwema machoni pangu, kama malaika wa Mungu[a]. Hata hivyo, majemadari wa Wafilisti wamesema, ‘Hapaswi kwenda pamoja nasi vitani.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mjumbe wa Mungu.” Neno la Kiebrania מַלְאָךְ linaweza kumaanisha “mjumbe” au “malaika,” ingawa katika kirai hiki maana ya “malaika wa Mungu” inaelekea kuwa ya kawaida zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: akamjibu ... akasema
  rationale: Inahifadhi mfuatano wa kawaida wa masimulizi ya Kiebrania, huku viambishi vya wakati vya Kiswahili vikiunganisha matendo kwa ufasaha.
- source_word: יָדַעְתִּי
  choice: Ninajua
  rationale: Kauli timilifu hapa inaonyesha tathmini thabiti ya Akishi yenye uzito katika mazungumzo ya sasa; wakati wa sasa wa Kiswahili unafikisha maana hiyo kwa kawaida.
- source_word: טוֹב אַתָּה בְּעֵינַי
  choice: wewe ni mwema machoni pangu
  rationale: Inahifadhi sitiari ya Kiebrania ya tathmini ‘machoni pangu’ bila kuibana maana yake kuwa uaminifu au kupendeza pekee.
- source_word: כְּמַלְאַךְ אֱלֹהִים
  choice: kama malaika wa Mungu
  rationale: Katika kirai hiki, maana ya kiumbe wa mbinguni ndiyo inayowezekana zaidi, lakini uwezekano wa ‘mjumbe’ umehifadhiwa katika tanbihi.
- source_word: אַךְ
  choice: Hata hivyo
  rationale: 'Inaonyesha tofauti ya kukubali: Akishi anamthamini Daudi, lakini majemadari wa Wafilisti wameamua vingine.'
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: majemadari wa Wafilisti
  rationale: Katika mazingira haya ya kijeshi, viongozi hawa wanaelezwa kwa kawaida na kwa usahihi kama majemadari kuliko wakuu au wana wa kifalme.
- source_word: לֹא יַעֲלֶה עִמָּנוּ בַּמִּלְחָמָה
  choice: Hapaswi kwenda pamoja nasi vitani
  rationale: Kauli hasi katika usemi ulioripotiwa ina nguvu ya katazo au uamuzi. ‘Kwenda ... vitani’ ni Kiswahili cha kawaida kwa kujiunga na kampeni ya kijeshi; kutafsiri עָלָה moja kwa moja kuwa ‘kupanda’ hapa kungepotosha.
theological_decisions:
- issue: Maana ya מַלְאַךְ אֱלֹהִים katika ulinganisho wa Akishi
  choice: kama malaika wa Mungu
  alternative: kama mjumbe wa Mungu
  rationale: Ulinganisho huu unaonyesha heshima kubwa au imani ya Akishi kwa Daudi, wala haudai kwamba Daudi kwa asili ni malaika. Maana mbadala halisi ya neno מַלְאָךְ imewekwa katika tanbihi ili kuhifadhi utata wa kileksika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘akamjibu ... akasema’ unahifadhi mtindo wa simulizi la Kiebrania; ‘machoni pangu’ huhifadhi nahau ya chanzo, na ‘vitani’ huepuka tafsiri isiyo ya kawaida ya kitenzi cha kampeni ‘kupanda’.
