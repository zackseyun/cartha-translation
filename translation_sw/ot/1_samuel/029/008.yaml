  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אָכִ֗ישׁ כִּ֣י מֶ֤ה עָשִׂ֨יתִי֙ וּ/מַה מָּצָ֣אתָ בְ/עַבְדְּ/ךָ֔ מִ/יּוֹם֙ אֲשֶׁ֣ר הָיִ֣יתִי לְ/פָנֶ֔י/ךָ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י לֹ֤א אָבוֹא֙ וְ/נִלְחַ֔מְתִּי בְּ/אֹיְבֵ֖י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/008.yaml
  text: David said to Achish[a], “But what have I done? And what have you found against your servant from the day I entered your service until this day[b], that I should not go and fight against the enemies of my lord the king?”
translation:
  language: sw
  text: Daudi akamwambia Akishi, “Lakini nimefanya nini? Na umeona kosa gani katika mtumishi wako tangu siku nilipoingia katika utumishi wako hadi leo,[a] hata nisiende kupigana na maadui wa bwana wangu mfalme?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tangu siku nilipokuwa mbele yako hadi leo.” Kiebrania kinasema kwa uhalisi zaidi, “tangu siku nilipokuwa mbele yako.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “bwana wangu mfalme” yameachwa kama yalivyosemwa. Huenda Daudi anamrejelea Akishi moja kwa moja, au maneno yake yanaweza kuwa na utata wa makusudi katika muktadha wa simulizi.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי מֶה עָשִׂיתִי
  choice: Lakini nimefanya nini?
  rationale: Neno כִּי linaanzisha pingamizi la Daudi kwa kauli iliyotangulia; “lakini” linaonyesha msukumo huo kwa Kiswahili cha kawaida.
- source_word: וּמַה מָּצָאתָ בְעַבְדְּךָ
  choice: Na umeona kosa gani katika mtumishi wako
  rationale: Muundo מצא pamoja na ב unaashiria kugundua kosa au sababu ya kumlaumu mtu. “Umeona kosa gani katika” ni wa asili katika Kiswahili na unaweka wazi maana inayodokezwa bila kuipanua kupita kiasi.
- source_word: בְעַבְדְּךָ
  choice: mtumishi wako
  rationale: עבד hapa ni namna ya unyenyekevu ya kujitaja mbele ya mfalme, si lazima kumaanisha mtumwa kwa hali yake ya kisheria.
- source_word: מִיּוֹם אֲשֶׁר הָיִיתִי לְפָנֶיךָ עַד הַיּוֹם הַזֶּה
  choice: tangu siku nilipoingia katika utumishi wako hadi leo
  rationale: Kiebrania halisi ni “tangu siku nilipokuwa mbele yako.” Katika muktadha huu kinamaanisha kipindi ambacho Daudi alikuwa chini ya Akishi; tafsiri iliyochaguliwa ni wazi na ya kawaida, huku maana halisi ikiwekwa katika tanbihi.
- source_word: כִּי לֹא אָבוֹא וְנִלְחַמְתִּי
  choice: hata nisiende kupigana
  rationale: Kishazi hiki kinaeleza lalamiko la Daudi kuhusu kuzuiwa kwenda vitani. “Hata nisiende kupigana” kinatoa uhusiano huo wa matokeo au kusudi kwa ufupi na kwa lugha ya kawaida.
- source_word: בְּאֹיְבֵי
  choice: na maadui wa
  rationale: Pamoja na kitenzi נלחם, kihusishi ב kinaonyesha upande unaopigwa vita; Kiswahili hutumia kwa kawaida “kupigana na.”
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: אֲדֹנִי hapa ni cheo cha heshima kwa mwanadamu, si jina la Mungu. “Bwana wangu mfalme” kinahifadhi heshima na pia kutomtaja wazi anayelengwa.
theological_decisions:
- issue: Anayelengwa na nguvu ya usemi “maadui wa bwana wangu mfalme”
  choice: Maneno yameachwa kama yalivyosemwa bila kubainisha kama “bwana wangu mfalme” ni Akishi kwa unyoofu au yana utata wa makusudi.
  alternative: Kumfafanua Akishi moja kwa moja kuwa ndiye bwana na mfalme anayelengwa, au kueleza kuwa Daudi anamdokeza mfalme mwingine.
  rationale: Kiebrania hakielezi nia ya Daudi. Kutobainisha anayelengwa kunahifadhi utata na mvutano wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa kawaida. “Akamwambia” kinaendeleza mtiririko wa masimulizi; “mtumishi wako” na “bwana wangu mfalme” vinahifadhi sajili ya heshima ya kifalme.
