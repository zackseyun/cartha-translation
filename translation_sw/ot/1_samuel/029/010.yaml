translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Marudio ya “asubuhi na mapema” yamehifadhiwa kwa kuwa yapo katika Kiebrania. Wingi katika sentensi ya pili unaonyesha kuwa agizo linawahusu Daudi na watu walio pamoja naye.
