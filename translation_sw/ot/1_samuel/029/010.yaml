base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/010.yaml
  text: Now rise early in the morning[a], you and your master's servants who came with you. When you rise early in the morning and it is light for you, go.
translation:
  language: sw
  text: Sasa, amka asubuhi na mapema, wewe na watumishi wa bwana wako waliokuja pamoja nawe. Mkiamka asubuhi na mapema, na kukipambazuka[a], ondokeni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati mwanga unapowajia, ondokeni,” au “ondokeni alfajiri.” Kishazi cha Kiebrania kwa neno kwa neno ni “na ni mwanga kwenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Ni kiashiria cha mazungumzo kinachoanzisha agizo la papo hapo; “Basi sasa” huhifadhi mpito wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: amka asubuhi na mapema
  rationale: Kitenzi cha Hiphil שׁכם kina maana ya kuamka au kuanza safari mapema; usemi huu ni wa kawaida na huhifadhi msisitizo wa wakati.
- source_word: וְעַבְדֵי אֲדֹנֶיךָ
  choice: wewe pamoja na watumishi wa bwana wako
  rationale: Ingawa muundo wa Kiebrania unaanza na “na watumishi,” hao wanaunganishwa na Daudi kama walengwa wa agizo. “Bwana wako” hapa humaanisha mkuu wa kibinadamu, si jina la Mungu.
- source_word: אֲשֶׁר בָּאוּ אִתָּךְ
  choice: waliokuja pamoja nawe
  rationale: Hutambulisha watumishi waliokuwa wameandamana na Daudi; wakati uliopita unafaa katika simulizi.
- source_word: וְהִשְׁכַּמְתֶּם בַּבֹּקֶר
  choice: Mtakapoamka asubuhi na mapema
  rationale: Umbo la wingi linaendeleza agizo kama kishazi cha wakati na kuhifadhi kurudiwa kwa wazo la kuamka mapema.
- source_word: וְאוֹר לָכֶם
  choice: na kukiwa na mwanga wa kutosha kwenu
  rationale: Kiswahili hiki huhifadhi kwa kiasi kikubwa usemi halisi “na ni mwanga kwenu,” huku kikieleza kwa kawaida kuwa waondoke mara mwanga unapowaruhusu kusafiri.
- source_word: וָלֵכוּ
  choice: ondokeni
  rationale: Amri ya wingi ya הלך hapa inawaagiza waondoke mahali walipo; “ondokeni” ni ya moja kwa moja na ya kawaida katika muktadha.
