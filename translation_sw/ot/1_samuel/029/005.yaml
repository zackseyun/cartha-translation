  text: Is this not David[a], of whom they sang to one another in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: sw
  text: 'Je, huyu si Daudi ambaye waliimbiana kumhusu katika ngoma[a], wakisema,


    “Sauli amewaangusha maelfu yake,

    na Daudi makumi yake ya maelfu[b]”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi: “walimjibu katika ngoma.” Huu ni usemi unaomaanisha kuimba kwa kuitikiana.'
