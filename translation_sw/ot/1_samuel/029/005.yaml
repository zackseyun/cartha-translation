lexical_decisions:
- source_word: הֲלוֹא זֶה דָוִד
  choice: Je, huyu siye Daudi
  rationale: Muundo huu unadumisha swali la balagha linalotarajia jibu la kukubali, huku ukimtambulisha Daudi kwa msisitizo kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר יַעֲנוּ לוֹ
  choice: ambaye waliimba habari zake kwa kuitikiana
  rationale: Katika muktadha huu, kitenzi ענה kinaeleza uimbaji wa kuitikiana. ‘Habari zake’ linaonyesha kuwa Daudi ndiye aliyeimbwa, bila kudokeza kwamba waimbaji walikuwa wakimjibu yeye binafsi.
- source_word: בַּמְּחֹלוֹת
  choice: katika ngoma
  rationale: Neno מְחֹלוֹת linarejelea ngoma au miduara ya kucheza katika sherehe. ‘Katika ngoma’ ni usemi wa asili unaohifadhi mazingira ya sherehe.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Ni utangulizi wa kawaida wa maneno yaliyonukuliwa; umbo la wingi linapatana na waimbaji.
- source_word: הִכָּה
  choice: amewaangusha
  rationale: Katika muktadha wa vita, נכה humaanisha kuwapiga na kuwashinda, mara nyingi kwa kuwaua. ‘Amewaangusha’ linahifadhi taswira ya kijeshi bila kulazimisha maana finyu kuliko neno la Kiebrania.
- source_word: בַּאֲלָפָיו
  choice: maelfu yake
  rationale: Huu ni usemi wa kishairi unaotaja idadi ya wale ambao ushindi wao ulihesabiwa kwa Sauli na kudumisha ulinganifu wa wimbo.
- source_word: בְּרִבְבֹתָיו
  choice: makumi yake ya maelfu
  rationale: רבבה kimsingi ni elfu kumi, na wingi wake hapa unatofautisha kwa makusudi mafanikio ya Daudi na ‘maelfu’ ya Sauli.
