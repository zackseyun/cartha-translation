base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/017.yaml
  text: Then he would return to Ramah[a], for his house was there, and there he judged Israel. He built there an altar to Yahweh.
translation:
  language: sw
  text: Kisha alikuwa akirudi Rama[a], kwa maana nyumba yake ilikuwa huko; na huko aliwahukumu Israeli. Akajenga huko madhabahu kwa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa neno kwa neno zaidi, “Na kurudi kwake kulikuwa Rama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְשֻׁבָתוֹ
  choice: Kisha alikuwa akirudi
  rationale: Nomino hiyo humaanisha kihalisi ‘kurudi kwake’; katika muktadha wa mzunguko wa kawaida wa Samueli, umbo la kitenzi cha mazoea ni la asili na linaendeleza simulizi.
- source_word: הָרָמָתָה
  choice: Rama
  rationale: Herufi ya uelekeo kwenye jina la mahali inaonyesha mwendo kuelekea Rama; Kiswahili hutumia kitenzi ‘kurudi’ moja kwa moja pamoja na jina la mahali.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya Samueli kurudi Rama.
- source_word: בֵּיתוֹ
  choice: nyumba yake
  rationale: Huhifadhi maana halisi ya mahali anapoishi, bila kupanua kuwa jamaa au ukoo.
- source_word: וְשָׁם
  choice: na huko
  rationale: Huhifadhi marudio ya שָׁם yanayoonyesha Rama kuwa kituo cha shughuli za Samueli.
- source_word: שָׁפַט אֶת־יִשְׂרָאֵל
  choice: aliwaamua Israeli
  rationale: ‘Aliwaamua’ huonyesha kazi ya kutoa hukumu na kutenda kama mwamuzi; ‘Israeli’ hapa inarejelea watu kwa pamoja.
- source_word: וַיִּבֶן שָׁם
  choice: Huko akamjengea
  rationale: Muundo huu unaendeleza simulizi kwa kawaida na kuhifadhi msisitizo wa mahali kwa kurudia ‘huko’; hauongezi wazo la ‘pia’ lisilo wazi katika chanzo.
- source_word: מִזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida na lenye heshima kwa mahali pa kutoa dhabihu.
- source_word: לַיהוָה
  choice: akamjengea Yahweh
  rationale: Kiambishi ל־ kinaonyesha madhabahu iliyojengwa kwa ajili ya au kwa heshima ya Yahweh; ‘-mjengea’ huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; ‘Yahweh’ huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya שׁפט katika jukumu la Samueli
  choice: aliwaamua Israeli
  alternative: aliwahukumu Israeli; aliwaongoza Israeli
  rationale: Uamuzi huu huhifadhi wazo la Samueli kuwa mwamuzi bila kulifanya jukumu lake kuwa uongozi wa kisiasa pekee; hata hivyo, kitenzi kinaweza kujumuisha utawala mpana kuliko kesi za mahakamani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya ‘huko’ yamehifadhiwa kwa kuwa yanaipa Rama uzito kama makao na kituo cha huduma ya Samueli.
