base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/012.yaml
  text: Then Samuel took one stone and set it between Mizpah and Shen, and he called its name Ebenezer, for he said, “Up to this point the LORD has helped us.”
translation:
  language: sw
  text: Ndipo Samweli akachukua jiwe moja, akaliweka kati ya Mispa na Sheni. Akaliita Ebenezeri,[a] kwa maana alisema, “Mpaka hapa BWANA ametusaidia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ebenezeri maana yake ni “Jiwe la msaada.”
    reason: Hufafanua maana ya jina la Kiebrania אֶבֶן הָעָזֶר, ambalo linaunganishwa moja kwa moja na kauli kwamba BWANA amewasaidia.
lexical_decisions:
- source_word: אֶבֶן אַחַת
  choice: jiwe moja
  rationale: Huhifadhi wazi neno la Kiebrania אַחַת, ‘moja,’ badala ya kusema tu ‘jiwe.’
- source_word: אֶבֶן הָעָזֶר
  choice: Ebenezeri
  rationale: Jina hili limetoholewa kwa namna inayotambulika katika Kiswahili; maana yake ya Kiebrania imefafanuliwa katika tanbihi.
- source_word: עַד הֵנָּה
  choice: Mpaka hapa
  rationale: Huhifadhi taswira ya mpaka uliofikiwa, ambayo katika muktadha inaweza kuonyesha mahali au hatua iliyofikiwa hadi wakati huo.
- source_word: עֲזָרָנוּ
  choice: ametusaidia
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kitenzi cha Kiebrania katika hali timilifu.
- source_word: הַמִּצְפָּה / הַשֵּׁן
  choice: Mispa / Sheni
  rationale: Majina ya mahali yametoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
theological_decisions:
- issue: Uwakilishi wa jina la agano יהוה (YHWH)
  choice: BWANA
  alternative: Yahwe
  rationale: BWANA kwa herufi kubwa hufuata desturi iliyoenea katika Biblia za Kiswahili ya kutofautisha jina la Mungu YHWH na neno la kawaida ‘Bwana,’ bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Upeo wa kauli עַד הֵנָּה
  choice: Mpaka hapa
  alternative: Hadi sasa
  rationale: ‘Mpaka hapa’ huhifadhi utata wa asili kati ya mahali walipofikia na hatua ya kihistoria/wakati walipofikia, badala ya kuamua kimya kimya kuwa inahusu wakati pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. Muundo wa vitenzi mfululizo umetumiwa kwa usomaji wa asili, huku ‘jiwe moja’ na ‘Mpaka hapa’ zikihifadhi msisitizo na utata wa maandishi ya Kiebrania.
