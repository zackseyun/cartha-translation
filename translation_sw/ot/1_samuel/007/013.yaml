  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּכָּֽנְעוּ֙ הַ/פְּלִשְׁתִּ֔ים וְ/לֹא יָסְפ֣וּ ע֔וֹד לָ/ב֖וֹא בִּ/גְב֣וּל יִשְׂרָאֵ֑ל וַ/תְּהִ֤י יַד יְהוָה֙ בַּ/פְּלִשְׁתִּ֔ים כֹּ֖ל יְמֵ֥י שְׁמוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/013.yaml
  text: So the Philistines were subdued and did not again come into the territory of Israel[a]. And the hand of Yahweh was against the Philistines all the days of Samuel.
translation:
  language: sw
  text: Basi Wafilisti walitiishwa, nao hawakuingia tena katika eneo la Israeli. Nao mkono wa Yahweh ulikuwa dhidi ya Wafilisti siku zote za Samweli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: walitiishwa
  rationale: Nifali ya כנע inaonyesha kwamba Wafilisti walishushwa nguvu na kuwekwa chini baada ya kushindwa; “walitiishwa” huhifadhi maana ya kutendewa na inafaa muktadha wa kijeshi.
- source_word: הַפְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la taifa hili katika Kiswahili cha Biblia.
- source_word: וְלֹא יָסְפוּ עוֹד לָבוֹא
  choice: hawakuingia tena
  rationale: Muundo יסף + עוד unamaanisha kutorudia tendo; pamoja na eneo linalofuata, “hawakuingia tena” ni Kiswahili cha kawaida na sahihi.
- source_word: בִּגְבוּל יִשְׂרָאֵל
  choice: katika eneo la Israeli
  rationale: גְּבוּל hapa yaweza kumaanisha mpaka au eneo; muktadha unahusu kuingia katika ardhi ya Israeli, si kufika tu kwenye mstari wa mpaka.
- source_word: וַתְּהִי יַד יְהוָה
  choice: mkono wa Yahweh ulikuwa
  rationale: Taswira ya Kiebrania ya “mkono” imehifadhiwa ili kuonyesha nguvu na utendaji wa Mungu bila kuibadili kuwa maelezo ya kifafanuzi.
- source_word: בַּפְּלִשְׁתִּים
  choice: dhidi ya Wafilisti
  rationale: 'Katika muktadha huu kiambishi בְּ kina nguvu ya upinzani: mkono wa Yahweh ulikuwa ukitenda kwa kuwazuia na kuwapinga Wafilisti.'
- source_word: כֹּל יְמֵי שְׁמוּאֵל
  choice: siku zote za Samweli
  rationale: Huhifadhi usemi wa Kiebrania na pia ni usemi wa asili unaoeleweka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina la agano יְהוָה; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya usemi “mkono wa Yahweh ulikuwa kwa/juu ya Wafilisti”
  choice: dhidi ya Wafilisti
  alternative: juu ya Wafilisti
  rationale: Muktadha wa kutiishwa kwa Wafilisti unaonyesha wazi utendaji wa Mungu wa kuwapinga. “Dhidi ya” huwasilisha nguvu hiyo huku taswira ya “mkono” ikihifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo unafuata Kiebrania kwa ukaribu bila kuwa mgumu; hakuna tanbihi inayohitajika kwa kuwa maana ya usemi imewasilishwa wazi katika matini.
