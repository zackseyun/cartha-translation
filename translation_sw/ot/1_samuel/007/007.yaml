  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo ‘wakapanda kwenda kuishambulia’ unadumisha taswira ya kupanda katika Kiebrania huku ukieleza kwa kawaida kusudi la kijeshi.
