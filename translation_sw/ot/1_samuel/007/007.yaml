reference: 1 Samuel 7:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּֽי הִתְקַבְּצ֤וּ בְנֵֽי יִשְׂרָאֵל֙ הַ/מִּצְפָּ֔תָ/ה וַ/יַּעֲל֥וּ סַרְנֵֽי פְלִשְׁתִּ֖ים אֶל יִשְׂרָאֵ֑ל וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּֽרְא֖וּ מִ/פְּנֵ֥י פְלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/007.yaml
  text: When the Philistines heard that the sons of Israel had gathered at Mizpah[a], the rulers of the Philistines went up against Israel. When the sons of Israel heard it[b], they were afraid because of the Philistines.
translation:
  language: sw
  text: Wafilisti waliposikia kwamba wana wa Israeli walikuwa wamekusanyika huko Mispa[a], watawala wa Wafilisti[b] wakapanda kwenda kuishambulia Israeli. Wana wa Israeli waliposikia hayo, wakawaogopa Wafilisti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenda Mispa.” Umbo la Kiebrania lina kiishio kinachoonyesha kuelekea mahali, ingawa muktadha unaonyesha kwamba watu walikuwa wamekusanyika huko.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakuu wa Wafilisti.” Neno la Kiebrania linamaanisha watawala waliotambulika wa Wafilisti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: waliposikia / waliposikia hayo
  rationale: ‘Kusikia’ ni tafsiri ya kawaida ya שׁמע katika simulizi. Kurudia kitenzi hicho kunadumisha urudiaji wa Kiebrania; ‘hayo’ huonyesha kwa kawaida habari za kusonga kwa Wafilisti ambazo zimeachwa bila kiwakilishi wazi katika chanzo.
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la taifa hili katika Kiswahili cha Biblia.
- source_word: הִתְקַבְּצוּ
  choice: walikuwa wamekusanyika
  rationale: Muundo wa hitpaeli unaonyesha kukusanyika pamoja, na wakati timilifu ‘walikuwa wamekusanyika’ unaonyesha kwamba mkusanyiko ulitangulia habari walizozisikia Wafilisti.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi kwa uwazi usemi wa Kiebrania ‘wana wa Israeli’ badala ya kuufupisha kuwa ‘Waisraeli.’
- source_word: הַמִּצְפָּתָה
  choice: huko Mispa
  rationale: Ingawa umbo la Kiebrania lina kiishio cha kuelekea mahali, muktadha unawaonyesha watu wakiwa wamekusanyika mahali hapo; ‘huko Mispa’ ni ya kawaida na inaakisi maana ya kimuktadha.
- source_word: וַיַּעֲלוּ
  choice: wakapanda kwenda
  rationale: Inahifadhi wazo la msingi la עלה, ‘kupanda,’ huku ‘kwenda’ ikifanya harakati hiyo isikike kwa kawaida katika Kiswahili.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: watawala wa Wafilisti
  rationale: סְרָנִים ni watawala au viongozi wakuu waliotambulika wa Wafilisti; ‘watawala’ ni wazi katika Kiswahili cha sasa.
- source_word: אֶל יִשְׂרָאֵל
  choice: kuishambulia Israeli
  rationale: Katika muktadha huu wa kijeshi, אֶל inaeleza mwendo wa uhasama kuelekea Israeli. ‘Kuishambulia’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuacha kishazi kisicho cha asili kama ‘dhidi ya Israeli.’
- source_word: וַיִּירְאוּ מִפְּנֵי פְלִשְׁתִּים
  choice: wakawaogopa Wafilisti
  rationale: Kiswahili hutumia moja kwa moja ‘kumwogopa mtu’ kueleza hofu inayosababishwa na uwepo au tishio lake; hii inawasilisha kwa ufupi nahau ya Kiebrania.
