reference: 1 Samuel 7:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל אֶל כָּל בֵּ֣ית יִשְׂרָאֵל֮ לֵ/אמֹר֒ אִם בְּ/כָל לְבַבְ/כֶ֗ם אַתֶּ֤ם שָׁבִים֙ אֶל יְהוָ֔ה הָסִ֜ירוּ אֶת אֱלֹהֵ֧י הַ/נֵּכָ֛ר מִ/תּוֹכְ/כֶ֖ם וְ/הָ/עַשְׁתָּר֑וֹת וְ/הָכִ֨ינוּ לְבַבְ/כֶ֤ם אֶל יְהוָה֙ וְ/עִבְדֻ֣/הוּ לְ/בַדּ֔/וֹ וְ/יַצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/003.yaml
  text: Then Samuel said to all the house of Israel[a], “If you are returning to Yahweh with all your heart, remove the foreign gods and the Ashtaroths from among you, and direct your heart to Yahweh and serve him alone[d][c][b], and he will deliver you from the hand of the Philistines.”
translation:
  language: sw
  text: Ndipo Samweli akawaambia nyumba yote ya Israeli, “Ikiwa mnamrudia Yahwe kwa mioyo yenu yote[a], ondoeni miungu ya kigeni na Maashtorethi kutoka miongoni mwenu[b]. Ielekezeni mioyo yenu kwa Yahwe[c] na mtumikieni yeye peke yake, naye atawaokoa kutoka mkononi mwa Wafilisti[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnamgeukia tena Yahwe kwa mioyo yenu yote.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania “Ashtarothi” ni la wingi na huenda linarejelea maumbo, sanamu, au namna za ibada zilizohusishwa na mungu wa kike Ashtorethi (Astarte).
    reason: cultural_note
  - marker: c
    text: Au, “itayarisheni mioyo yenu kwa ajili ya Yahwe.”
    reason: lexical_alternative
  - marker: d
    text: Kwa Kiebrania, “kutoka mkononi mwa Wafilisti”; hii ni nahau inayomaanisha kuokolewa kutoka katika mamlaka au nguvu zao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo Samweli akaiambia
  rationale: Waw ya kisimulizi inaendeleza mfuatano wa matukio; “Ndipo” huleta mtiririko wa kawaida wa simulizi katika Kiswahili.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: nyumba yote ya Israeli
  rationale: Inadumisha sitiari ya Kiebrania ya jamii ya agano kama “nyumba,” badala ya kuifupisha kuwa Israeli tu.
- source_word: אִם בְּכָל לְבַבְכֶם אַתֶּם שָׁבִים אֶל יְהוָה
  choice: Ikiwa mnamrudia Yahwe kwa mioyo yenu yote
  rationale: “Mnamrudia” linaakisi hali endelevu ya kitenzi-shirikishi שָׁבִים na wazo la kurudi katika uaminifu; wingi “mioyo yenu” unafuata umbo la chanzo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limeandikwa moja kwa moja kwa namna inayofaa tahajia ya Kiswahili.
- source_word: הָסִירוּ
  choice: ondoeni
  rationale: Ni amri ya wazi na ya kawaida inayomaanisha kuondoa vitu au desturi za ibada ya sanamu.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: miungu ya kigeni
  rationale: Hurejelea miungu ya mataifa mengine, si miungu iliyo ya ajabu tu.
- source_word: מִתּוֹכְכֶם
  choice: kutoka miongoni mwenu
  rationale: Inaonyesha kwamba miungu hiyo na Maashtorethi yalipaswa kuondolewa katika jamii yenyewe.
- source_word: וְהָעַשְׁתָּרֹת
  choice: na Maashtorethi
  rationale: Tahajia hii ya wingi inadumisha jina la ibada badala ya kulipanua kimafasiri kuwa sanamu au maumbo fulani.
- source_word: וְהָכִינוּ לְבַבְכֶם אֶל יְהוָה
  choice: Ielekezeni mioyo yenu kwa Yahwe
  rationale: כּוּן pamoja na “moyo” inaweza kumaanisha kuuweka imara, kuutayarisha, au kuuelekeza; “ielekezeni” huwasilisha uamuzi wa ndani bila kufuta uwezekano mwingine.
- source_word: וְעִבְדֻהוּ לְבַדּוֹ
  choice: na mtumikieni yeye peke yake
  rationale: “Mtumikieni” linahifadhi maana pana ya עבד, inayojumuisha ibada, utii, na uaminifu wa pekee.
- source_word: וְיַצֵּל אֶתְכֶם
  choice: naye atawaokoa
  rationale: Hiphil ya נצל humaanisha kuokoa au kukomboa kutoka hatarini; wakati ujao unaonyesha matokeo yanayotarajiwa ya mwitikio wao.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: kutoka mkononi mwa Wafilisti
  rationale: Inadumisha nahau halisi na inayoeleweka ya kuwa chini ya mamlaka au nguvu za Wafilisti.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; “Yahwe” huhifadhi jina la agano bila kulibadilisha kuwa cheo.
- issue: Maana ya שָׁבִים katika mwito wa Samweli
  choice: mnamrudia Yahwe
  alternative: mnamgeukia tena Yahwe
  rationale: “Mnamrudia” huhifadhi mwito wa kurudi katika uaminifu wa agano bila kuingiza mfumo wa baadaye wa kimafundisho.
- issue: Upeo wa עבד
  choice: mtumikieni yeye peke yake
  alternative: mwabuduni yeye peke yake
  rationale: “Kutumikia” ni pana kuliko tendo la ibada pekee na hujumuisha utii na uaminifu wa kiagano.
- issue: Uhusiano wa ahadi וְיַצֵּל na amri zinazotangulia
  choice: naye atawaokoa
  alternative: ili awaokoe
  rationale: Muundo unaweza kusikika kama matokeo yaliyoahidiwa au kusudi; wakati ujao unafuata kwa kawaida mfululizo wa amri huku ukiacha uzito wa ahadi katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Nyumba yote ya Israeli” inadumisha sitiari ya kijamii ya chanzo; “Maashtorethi” linafuata matumizi yanayotambulika katika lugha ya Biblia ya Kiswahili, huku tanbihi ikieleza wingi na mazingira ya kiibada.
