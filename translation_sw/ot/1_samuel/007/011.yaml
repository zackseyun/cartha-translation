base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/011.yaml
  text: Then the men of Israel went out from Mizpah[a], pursued the Philistines[b], and struck them down as far as below Beth-car.
translation:
  language: sw
  text: Ndipo wanaume wa Israeli wakatoka Mispa, wakawafuatilia Wafilisti, wakawapiga[a] mpaka chini ya Beth-kari[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakawashinda.” Kitenzi cha Kiebrania kinaweza kumaanisha kupiga vitani kwa maana ya kushinda, si kupiga kwa mapigo tu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “chini ya Beth-kari,” huenda kikimaanisha mahali palipokuwa chini ya Beth-kari kwa mwinuko.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: wakatoka
  rationale: Kitenzi יצא katika simulizi humaanisha kutoka; “wakatoka” ni cha kawaida na kinaendeleza mfululizo wa matendo.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: wanaume wa Israeli
  rationale: Kirai hiki kihalisi ni “wanaume wa Israeli,” na muktadha unawahusu wanaume waliotoka kwenda kupigana.
- source_word: מִן הַמִּצְפָּה
  choice: kutoka Mispa
  rationale: Mispa ni jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa kwa maana yake ya kileksia.
- source_word: וַיִּרְדְּפוּ
  choice: wakawafuatilia
  rationale: רדף humaanisha kufuatilia au kuwafukuza maadui; “wakawafuatilia” linafaa katika muktadha wa kijeshi bila kuongeza maelezo yasiyokuwapo.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hili la watu.
- source_word: וַיַּכּוּם
  choice: wakawapiga
  rationale: נכה katika vita inaweza kumaanisha kupiga na, kwa upana, kuwashinda. “Wakawapiga” huhifadhi taswira ya kitenzi bila kudai kwamba kila mmoja aliuawa.
- source_word: עַד
  choice: mpaka
  rationale: Hapa עַד huonyesha mwisho wa kieneo wa kuwafuatilia.
- source_word: מִתַּחַת
  choice: eneo lililo chini ya
  rationale: Kirai hiki kinaonyesha mahali palipo chini kwa mwinuko; kuongeza “eneo lililo” hufanya uhusiano huo uwe wazi na wa kawaida kwa Kiswahili.
- source_word: לְבֵית כָּר
  choice: Beth-kari
  rationale: Hili ni jina la mahali, hivyo limetoholewa badala ya kutafsiriwa.
