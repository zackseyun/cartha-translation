  text: וַ/יָּבֹ֜אוּ אַנְשֵׁ֣י קִרְיַ֣ת יְעָרִ֗ים וַֽ/יַּעֲלוּ֙ אֶת אֲר֣וֹן יְהוָ֔ה וַ/יָּבִ֣אוּ אֹת֔/וֹ אֶל בֵּ֥ית אֲבִינָדָ֖ב בַּ/גִּבְעָ֑ה וְ/אֶת אֶלְעָזָ֤ר בְּנ/וֹ֙ קִדְּשׁ֔וּ לִ/שְׁמֹ֖ר אֶת אֲר֥וֹן יְהוָֽה׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/001.yaml
  text: Then the men of Kiriath-jearim came and brought up the ark of Yahweh[a], and they brought it into the house of Abinadab on the hill[b]. And they consecrated Eleazar his son to keep the ark of Yahweh.
translation:
  language: sw
  text: Ndipo wanaume wa Kiriath-yearimu wakaja, wakalipandisha sanduku la Yahwe[a], na kulipeleka katika nyumba ya Abinadabu juu ya kilima.[b] Nao wakamweka wakfu Eleazari mwanawe ili alilinde sanduku la Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina jina la Mungu YHWH, linalotafsiriwa hapa kuwa “Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: Au labda, “huko Gibea,” ikiwa בַּגִּבְעָה linaeleweka kuwa jina la mahali badala ya nomino ya kawaida “kilima.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: wakaja
  rationale: Kitenzi בוא katika mfululizo wa masimulizi kina maana ya kuja; umbo la Kiswahili linaendeleza simulizi kwa kawaida.
- source_word: אַנְשֵׁי קִרְיַת יְעָרִים
  choice: wanaume wa Kiriath-yearimu
  rationale: אַנְשֵׁי humaanisha hasa wanaume wa mahali hapo; jina la mahali limetoholewa kwa namna inayoeleweka katika Kiswahili.
- source_word: וַיַּעֲלוּ
  choice: wakalipandisha
  rationale: עלה hapa ni kulipeleka juu sanduku; ‘kulipandisha’ huhifadhi wazo la mwelekeo wa juu.
- source_word: אֲרוֹן יְהוָה
  choice: sanduku la Yahwe
  rationale: אֲרוֹן ni sanduku, na katika muktadha huu ni sanduku takatifu la agano; jina la Mungu יְהוָה limetolewa kama ‘Yahwe’ kwa umbo la kawaida la Kiswahili.
- source_word: וַיָּבִאוּ אֹתוֹ
  choice: na kulipeleka
  rationale: ביא katika muundo huu ni kuleta au kupeleka kitu hadi mahali palipotajwa; ‘kulipeleka’ ni Kiswahili cha asili baada ya ‘wakaja’ na huepuka urudiaji mzito.
- source_word: אֶל בֵּית אֲבִינָדָב
  choice: katika nyumba ya Abinadabu
  rationale: אֶל pamoja na kitenzi cha kuleta huonyesha mahali sanduku lilipopelekwa; ‘katika’ huwasilisha kuingizwa ndani ya nyumba.
- source_word: בַּגִּבְעָה
  choice: juu ya kilima
  rationale: Nomino yenye kibainishi inaelekea kumaanisha kilima fulani, si lazima jina la mahali; uwezekano wa jina ‘Gibea’ umehifadhiwa katika tanbihi.
- source_word: קִדְּשׁוּ
  choice: wakamweka wakfu
  rationale: קדשׁ hapa ni kumtenga mtu kwa wajibu mtakatifu; ‘kumweka wakfu’ huhifadhi maana ya kidini kwa lugha ya sasa.
- source_word: לִשְׁמֹר
  choice: ili alilinde
  rationale: שׁמר hapa ni kutunza kwa uangalizi na kulinda; ‘alilinde’ huonyesha wazi jukumu la usalama wa sanduku.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia jina ‘Yahwe’ huwasilisha jina la Kiebrania badala ya kulibadilisha kuwa cheo; tanbihi inaeleza neno la chanzo.
- issue: Ikiwa בַּגִּבְעָה ni nomino ya kawaida au jina la mahali
  choice: juu ya kilima
  alternative: huko Gibea
  rationale: Kibainishi katika Kiebrania kinaunga mkono usomaji wa nomino ya kawaida ‘kilima,’ lakini uwezekano wa jina la mahali haujaondolewa na umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mfululizo wa ‘waka-’ unadumisha mwendo wa simulizi la Kiebrania; msamiati wa ‘kuweka wakfu’ huhifadhi uzito wa kazi takatifu bila kuingiza msimamo wa dhehebu.
