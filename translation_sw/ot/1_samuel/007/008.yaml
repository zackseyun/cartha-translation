base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/008.yaml
  text: Then the sons of Israel said to Samuel[a], “Do not be silent for us from crying out to Yahweh our God, that he may save us from the hand of the Philistines.”
translation:
  language: sw
  text: Ndipo Waisraeli wakamwambia Samueli[a], “Usinyamaze kumlilia Yahwe Mungu wetu kwa ajili yetu, ili atuokoe kutoka mkononi mwa Wafilisti.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usiache kumlilia Yahwe Mungu wetu kwa ajili yetu.” Kiebrania kwa karibu zaidi husema, “Usinyamaze kwa ajili yetu katika kumlilia.”
    reason: Muundo wa Kiebrania unaunganisha kitenzi cha “kunyamaza” na kihusishi pamoja na kitenzi-jina cha “kulia kwa msaada.” Tafsiri mbadala hueleza maana yake kwa Kiswahili laini, ilhali kauli ya karibu zaidi huhifadhi taswira ya kutonyamaza.
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa maana yake ya moja kwa moja ni ‘wana wa Israeli,’ ‘Waisraeli’ ni Kiswahili cha kawaida na wazi kinachowataja watu wa Israeli bila kubadili rejeleo.
- source_word: אַל תַּחֲרֵשׁ ... מִזְּעֹק
  choice: Usinyamaze; endelea kumlilia
  rationale: ‘Usinyamaze’ huhifadhi taswira ya kitenzi חרשׁ, yaani kukaa kimya, huku ‘endelea kumlilia’ ikionyesha maana ya muktadha kwamba Samueli asiache kuomba msaada kwa sauti.
- source_word: מִמֶּנּוּ
  choice: kwa ajili yetu
  rationale: Hapa kihusishi kinaonyesha kwamba Samueli awaombee wao, si mwendo wa kutoka mahali fulani.
- source_word: זעק
  choice: kumlilia
  rationale: Kitenzi hiki huonyesha kilio kikali cha kuomba msaada; ‘kumlilia’ ni cha asili katika muktadha wa kumwomba Mungu kwa dharura.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵינוּ
  choice: Mungu wetu
  rationale: Huhifadhi umilikaji na wito wa agano uliomo katika kauli ya Israeli.
- source_word: וְיֹשִׁעֵנוּ
  choice: ili atuokoe
  rationale: Muundo huu unaeleza kusudi au matokeo yanayotarajiwa ya kilio cha Samueli kwa Mungu.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: kutoka mkononi mwa Wafilisti
  rationale: Huhifadhi sitiari ya Kiebrania ya ‘mkono,’ inayomaanisha nguvu au mamlaka ya Wafilisti.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; ‘Yahwe’ hulihifadhi badala ya kuliwakilisha kwa cheo.
- issue: Ikiwa ombi linamtaka Samueli asinyamaze au asiache kuomba
  choice: Usinyamaze; endelea kumlilia
  alternative: Usiache kumlilia
  rationale: Tafsiri kuu huhifadhi taswira halisi ya kutonyamaza pamoja na maana ya kimuktadha ya kuendelea kuomba. Tafsiri mbadala yenye ‘usiache’ ni laini zaidi lakini haionyeshi moja kwa moja taswira ya חרשׁ.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Waisraeli’ limetumiwa badala ya ‘wana wa Israeli’ kwa ufasaha wa kawaida; ‘mkononi mwa’ limehifadhiwa kwa sababu sitiari hiyo inaeleweka vizuri katika Kiswahili.
