  text: And he would go year by year and make the circuit of Bethel[a], Gilgal, and Mizpah[b], and he judged Israel in all these places.
translation:
  language: sw
  text: Kila mwaka alikuwa akizunguka Betheli, Gilgali na Mispa, akawahukumu Waisraeli katika maeneo hayo yote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָלַךְ
  choice: alikuwa akienda
  rationale: Muundo huu pamoja na usemi wa kurudiwa kila mwaka unaonyesha desturi ya Samweli ya wakati uliopita, si safari moja tu.
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: kila mwaka
  rationale: Ni usemi wa kurudiwa mara kwa mara kila mwaka; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: וְסָבַב
  choice: kwa zamu
  rationale: Kitenzi kinaonyesha kuzunguka kwa kufuata mfululizo wa mahali mbalimbali katika safari ya kawaida; 'kwa zamu' huwasilisha mpangilio huo kwa Kiswahili cha asili.
- source_word: בֵּית אֵל
  choice: Betheli
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la mahali hapo.
- source_word: הַגִּלְגָּל
  choice: Gilgali
  rationale: Hili ndilo umbo linalotambulika kwa kawaida katika matumizi ya Biblia ya Kiswahili.
- source_word: הַמִּצְפָּה
  choice: Mispa
  rationale: Hili ni umbo la kawaida la Kiswahili la jina hili la mahali.
- source_word: וְשָׁפַט
  choice: aliwaamua
  rationale: Kitenzi שפט hapa kinahusu kutekeleza hukumu na uongozi wa kimahakama. 'Aliwaamua' huhifadhi maana hiyo bila kuibana kuwa utawala wa kisiasa pekee.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina hapa linawarejelea watu au taifa la Israeli kama waliopokea maamuzi ya Samweli.
- source_word: אֵת כָּל הַמְּקוֹמוֹת הָאֵלֶּה
  choice: huko kote
  rationale: Ingawa kishazi kimetiwa alama ya אֵת, kinafanya kazi kielezi kikionyesha mahali ambako Samweli alitekeleza kazi ya kuamua.
