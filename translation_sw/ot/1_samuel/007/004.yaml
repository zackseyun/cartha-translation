base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/004.yaml
  text: So the sons of Israel removed the Baals and the Ashtaroths[a], and they served Yahweh alone.
translation:
  language: sw
  text: Basi Waisraeli wakaondoa Mabaali na Maashtorethi, wakamtumikia[a] Yahweh peke yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamwabudu Yahweh peke yake.” Kitenzi cha Kiebrania kinaweza kumaanisha “kutumikia” au “kuabudu” Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: wakaondoa
  rationale: Hifili ya סוּר hapa ina maana ya kuondoa au kutupilia mbali; “wakaondoa” ni ya kawaida na inadumisha tendo halisi la kuachana na miungu hiyo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa muundo wa Kiebrania ni “wana wa Israeli,” hapa ni jina la kawaida la watu wote wa Israeli; “Waisraeli” ni Kiswahili asilia, wazi, na hakibadili maana ya pamoja.
- source_word: הַבְּעָלִים
  choice: Mabaali
  rationale: Wingi wa Kiebrania unahifadhiwa ili kurejelea maumbo ya mahali mbalimbali ya Baali au sanamu zake bila kuamua zaidi ya maandishi.
- source_word: הָעַשְׁתָּרֹת
  choice: Maashtorethi
  rationale: Jina maalumu na wingi wake vinahifadhiwa badala ya kulipanua kuwa “miungu ya kike,” jambo ambalo lingeongeza ufafanuzi usiotajwa moja kwa moja.
- source_word: וַיַּעַבְדוּ
  choice: wakamtumikia
  rationale: עבד inapomhusu Mungu inaweza kumaanisha kumtumikia na pia kumwabudu. “Wakamtumikia” hudumisha maana pana ya utiifu na uaminifu, huku maana ya ibada ikiwekwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni linatoholewa kama “Yahweh” badala ya kubadilishwa na cheo.
- source_word: לְבַדּוֹ
  choice: peke yake
  rationale: 'Kirai hiki kinaonyesha upekee wa uaminifu wao: walimtumikia Yahweh, wala si miungu mingine.'
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano יְהוָה; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Iwapo עבד itafsiriwe “kutumikia” au “kuabudu”
  choice: wakamtumikia Yahweh peke yake
  alternative: wakamwabudu Yahweh peke yake
  rationale: “Kutumikia” ni kisawe cha moja kwa moja zaidi na huhifadhi wazo pana la utii na uaminifu wa agano. “Kuabudu” pia inawezekana katika muktadha huu wa kuondoa miungu mingine, kwa hiyo imehifadhiwa katika tanbihi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. “Waisraeli” limetumiwa badala ya tafsiri sisisi “wana wa Israeli” kwa ufasaha wa kawaida. Majina ya miungu ya kigeni yamehifadhiwa katika wingi wa Kiswahili: “Mabaali” na “Maashtorethi.”'
