  text: וַ/יִּקַּ֣ח שְׁמוּאֵ֗ל טְלֵ֤ה חָלָב֙ אֶחָ֔ד ו/יעלה עוֹלָ֛ה כָּלִ֖יל לַֽ/יהוָ֑ה וַ/יִּזְעַ֨ק שְׁמוּאֵ֤ל אֶל יְהוָה֙ בְּעַ֣ד יִשְׂרָאֵ֔ל וַֽ/יַּעֲנֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/009.yaml
  text: So Samuel took one nursing lamb and offered it as a whole burnt offering to Yahweh. And Samuel cried out to Yahweh on behalf of Israel[a], and Yahweh answered him.
translation:
  language: sw
  text: Basi Samweli akamchukua mwana-kondoo mmoja aliyekuwa bado ananyonya[a], akamtoa mzima kwa Yahweh kuwa sadaka ya kuteketezwa. Samweli akamlilia Yahweh kwa ajili ya Israeli, naye Yahweh akamjibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwana-kondoo mmoja wa maziwa.” Kirai cha Kiebrania kinamaanisha mwana-kondoo ambaye bado hunyonya maziwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: טְלֵה חָלָב אֶחָד
  choice: mwana-kondoo mmoja aliyekuwa bado ananyonya
  rationale: Kirai hiki kinamaanisha mwana-kondoo mchanga ambaye bado anajilisha maziwa. Tafsiri hii ni ya kawaida katika Kiswahili na inaonyesha wazi umri na hali yake.
- source_word: וַיַּעֲלֵה
  choice: akamtoa
  rationale: Hifili ya עלה hapa ni kitenzi cha kawaida cha kutoa dhabihu; “akamtoa” linaeleza tendo hilo kwa lugha ya kawaida bila kulazimisha taswira ya kupanda.
- source_word: עוֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ndilo neno linaloeleweka na lililozoeleka kwa dhabihu ya aina hii, ambayo iliteketezwa madhabahuni.
- source_word: כָּלִיל
  choice: mzima
  rationale: Neno hili linaonyesha kwamba mnyama mzima alitolewa na kuteketezwa, si sehemu yake tu.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Jina la agano יְהוָה limetoholewa kuwa “Yahweh,” na kihusishi kinaonyesha kwamba sadaka ilitolewa kwake.
- source_word: וַיִּזְעַק
  choice: akamlilia
  rationale: זעק hueleza kilio cha dharura cha kuomba msaada; “akamlilia” linahifadhi uzito huo kuliko “akaomba” pekee.
- source_word: בְּעַד יִשְׂרָאֵל
  choice: kwa ajili ya Israeli
  rationale: Kirai hiki kinaonyesha kuwa Samweli alitoa ombi lake kwa niaba na kwa manufaa ya Israeli.
- source_word: וַיַּעֲנֵהוּ יְהוָה
  choice: naye Yahweh akamjibu
  rationale: Kiambishi cha yambwa kinaonyesha wazi kwamba Yahweh alimjibu Samweli; muundo huu ni wa asili katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja. “Yahweh” linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya maombezi katika בְּעַד יִשְׂרָאֵל
  choice: kwa ajili ya Israeli
  alternative: kwa niaba ya Israeli
  rationale: “Kwa ajili ya Israeli” linaonyesha kwamba kilio chake kilihusu taifa lote bila kuongeza maelezo ya kimafundisho yasiyosemwa moja kwa moja na mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Kiunganishi “naye” kinatofautisha kwa ulaini tendo la Yahweh na kilio cha Samweli; alama ya tanbihi imewekwa mara baada ya kirai kinachofafanuliwa.
