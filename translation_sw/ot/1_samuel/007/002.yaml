base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/002.yaml
  text: From the day the ark remained at Kiriath-jearim[a], the days became many, and they were twenty years[b]; and all the house of Israel lamented after Yahweh.
translation:
  language: sw
  text: Tangu siku sanduku lilipokaa katika Kiriath-Yearimu, siku nyingi zilipita—miaka ishirini[a]—na nyumba yote ya Israeli ikamlilia Yahwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “siku zikawa nyingi, nazo zikawa miaka ishirini.”
    reason: lexical_alternative
  - marker: b
    text: Au “ikamtamani Yahwe,” au “ikaomboleza ikimwelekea Yahwe.” Kiebrania kinasema kwa maana halisi “ikaomboleza baada ya Yahwe,” nahau inayoweza kuonyesha huzuni pamoja na kumwelekea.
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁבֶת
  choice: lilipowekwa
  rationale: Kitenzi ישׁב hapa, sanduku likiwa kiima, kinaonyesha kukaa au kubaki mahali fulani. Kwa kitu, “lilipowekwa” ni Kiswahili cha kawaida kinachoeleza kwamba sanduku lilibaki huko bila kulifanya kana kwamba ni kiumbe hai.
- source_word: הָאָרוֹן
  choice: sanduku
  rationale: Neno la Kiebrania ni “sanduku” bila nyongeza kama “la Mungu”; muktadha tayari unaonyesha sanduku linalokusudiwa.
- source_word: בְּקִרְיַת יְעָרִים
  choice: Kiriath-yearimu
  rationale: Jina la mahali limetoholewa kwa namna inayosomeka katika Kiswahili, huku kihusishi cha mahali kikijumuishwa katika muundo “lilipowekwa Kiriath-yearimu.”
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: siku nyingi zilipita
  rationale: Hii ni nahau ya kuonyesha kupita kwa muda. Tafsiri hii ni ya asili katika Kiswahili kuliko tafsiri sisisi “siku zikawa nyingi,” huku ikihifadhi maana.
- source_word: וַיִּהְיוּ עֶשְׂרִים שָׁנָה
  choice: miaka ishirini
  rationale: Kirai kinabainisha muda uliofikiwa; muundo mfupi baada ya kistari ni wazi na wa kawaida katika Kiswahili.
- source_word: וַיִּנָּהוּ
  choice: ikamlilia
  rationale: נהה huonyesha kuomboleza au kulia. “Ikamlilia” huhifadhi wazo la huzuni iliyoelekezwa kwa Yahwe bila kulifafanua moja kwa moja kuwa toba kamili au hamu tu.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: nyumba yote ya Israeli
  rationale: Huhifadhi tamko la kitaifa na la kiagano “nyumba ya Israeli” badala ya kulirahisisha kuwa “Israeli wote.”
- source_word: אַחֲרֵי יְהוָה
  choice: ikamlilia Yahwe
  rationale: Muundo wa Kiebrania ni kwa maana halisi “waliomboleza nyuma ya Yahwe,” lakini nahau hiyo inaweza kuonyesha kumlilia, kumwelekea, au kumtamani. Kiswahili hiki hudumisha huzuni inayoelekezwa kwake; tanbihi huhifadhi uwezekano mwingine.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo “BWANA.”
theological_decisions:
- issue: Maana ya וַיִּנָּהוּ ... אַחֲרֵי יְהוָה kuhusu mwitikio wa Israeli
  choice: nyumba yote ya Israeli ikamlilia Yahwe
  alternative: nyumba yote ya Israeli ikamtamani Yahwe; au ikaomboleza ikimwelekea Yahwe
  rationale: Kifungu kinaweza kuunganisha maombolezo, hamu, na kumgeukia Yahwe. Tafsiri kuu haiongezi wazi wazo la toba kamili ambalo mstari huu haujalitamka, na tanbihi inaonyesha utata wa nahau.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umefanywa wa asili bila kufuta utata wa nahau ya mwisho; jina Yahwe limehifadhiwa.
