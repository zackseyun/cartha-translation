  text: Then Samuel said[a], “Gather all Israel to Mizpah, and I will pray to Yahweh on your behalf.”
translation:
  language: sw
  text: Kisha Samweli akasema, “Wakusanyeni Waisraeli wote waende Mispa, nami nitamwomba Yahwe kwa ajili yenu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akasema
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “Kisha” ni ya kawaida katika Kiswahili na inaonyesha hatua inayofuata.
- source_word: שְׁמוּאֵל
  choice: Samweli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: קִבְצוּ
  choice: Kusanyeni
  rationale: Ni amri ya wingi inayowaita watu wakutane mahali pamoja; “kusanyeni” ni ya moja kwa moja na ya asili.
- source_word: כָּל יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Inahifadhi maana ya taifa zima kama kundi bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: הַמִּצְפָּתָה
  choice: huko Mispa
  rationale: Kiambishi cha kuelekea mahali katika Kiebrania kinaonyesha mwendo kwenda Mispa; “huko” kinafaa baada ya kitenzi cha kuwakusanya watu waende mahali hapo.
- source_word: וְאֶתְפַּלֵּל
  choice: nami nita...ombea
  rationale: Wakati ujao wa nafsi ya kwanza unaonyesha hatua ambayo Samweli atafanya baada ya watu kukusanyika; “nami” linaunganisha hatua hizo kwa kawaida.
- source_word: בַּעַדְכֶם
  choice: nitawaombea
  rationale: Muundo wa Kiswahili “kuwaombea” unaonyesha wazi kwamba Samweli atasali kwa niaba yao na kuhifadhi maana ya maombezi ya בְּעַד.
- source_word: אֶל יְהוָה
  choice: kwa Yahwe
  rationale: “Kwa” pamoja na “kuomba” humtaja anayeelekezewa sala kwa Kiswahili cha kawaida; jina la agano יְהוָה limetolewa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi la Mungu, YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku tanbihi ikieleza umbo la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya simulizi; “nitawaombea kwa Yahwe” ni ya asili na inaweka wazi maombezi pamoja na anayeelekezewa sala.
