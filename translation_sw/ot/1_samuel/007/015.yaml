  text: Naye Samueli aliwahukumu Waisraeli siku zote za maisha yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliiongoza Israeli kama mwamuzi” au “aliitawala Israeli.” Kitenzi cha Kiebrania kinahusisha kutoa hukumu na pia kutawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: akawa mwamuzi wa
  rationale: Kitenzi שׁפט katika muktadha huu kinamaanisha kutenda kazi ya mwamuzi, ikijumuisha kutoa hukumu na kuongoza. Muundo huu ni wa kawaida katika Kiswahili na unahifadhi dhana ya kipindi cha waamuzi bila kuibana iwe kazi ya mahakamani pekee.
- source_word: שְׁמוּאֵל
  choice: Samueli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: אֶת יִשְׂרָאֵל
  choice: wa Israeli
  rationale: Kiashiria cha yambwa אֶת hakitafsiriwi moja kwa moja; muundo wa Kiswahili ‘mwamuzi wa Israeli’ unaonyesha uhusiano wa kitenzi na Israeli kwa ufasaha.
- source_word: כֹּל יְמֵי
  choice: siku zote za
  rationale: Tafsiri hii inahifadhi nahau na msisitizo wa Kiebrania kuhusu kipindi kizima.
- source_word: חַיָּיו
  choice: maisha yake
  rationale: Wingi wa Kiebrania ni nahau inayomaanisha maisha yake yote; ‘maisha yake’ ni Kiswahili cha kawaida na cha heshima.
theological_decisions:
- issue: Maana pana ya jukumu la Samueli katika שׁפט
  choice: akawa mwamuzi wa Israeli
  alternative: aliitawala Israeli; aliiongoza Israeli akiwa mwamuzi
  rationale: ‘Mwamuzi’ huhifadhi jukumu la kihistoria na la kisheria, huku tanbihi ikionyesha kuwa neno la Kiebrania linaweza pia kuhusisha kutawala au kuongoza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Kiunganishi ‘Naye’ kinaendeleza simulizi, na ‘akawa mwamuzi’ kinaonyesha shughuli iliyoendelea katika maisha yake.
