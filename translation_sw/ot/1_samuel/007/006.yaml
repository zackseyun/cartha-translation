base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/006.yaml
  text: So they gathered at Mizpah[a], drew water, and poured it out before Yahweh. They fasted on that day and said there[c][b], “We have sinned against Yahweh.” And Samuel judged the sons of Israel at Mizpah.
translation:
  language: sw
  text: Basi wakakusanyika Mispa[a], wakachota maji, wakayamimina mbele ya Yahwe[b]. Siku hiyo wakafunga, wakasema huko, “Tumemtenda Yahwe dhambi.” Samueli akawahukumu wana wa Israeli[c] huko Mispa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakakusanyika kwenda Mispa”; umbo la kwanza la jina Mispa katika Kiebrania lina kiishio kinachoonyesha mwelekeo.
    reason: lexical_alternative
  - marker: b
    text: Kumimina maji mbele ya Yahwe ni tendo la ibada linaloweza kuhusishwa na toba au maombolezo, lakini mstari hauelezi maana yake waziwazi.
    reason: cultural_note
  - marker: c
    text: 'Kiebrania: “wana wa Israeli”; yaani, Waisraeli, au watu wa Israeli.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ הַמִּצְפָּתָה
  choice: wakakusanyika Mispa
  rationale: Kitenzi cha Kiebrania kinaonyesha watu walikusanyika, na kiishio cha mwelekeo katika jina la mahali kinaonyesha kwenda Mispa. Kiswahili hiki ni cha kawaida; tofauti ya mwelekeo imehifadhiwa katika tanbihi.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: wakachota maji
  rationale: Kuchota maji ndilo neno la kawaida na sahihi kwa tendo la שׁאב.
- source_word: וַיִּשְׁפְּכוּ לִפְנֵי יְהוָה
  choice: kuyamimina mbele za Yahwe
  rationale: Tafsiri hii inadumisha tendo halisi la kumimina maji na usemi wa kuwepo mbele za Yahwe bila kueleza ishara yake.
- source_word: וַיָּצוּמוּ בַּיּוֹם הַהוּא
  choice: Siku hiyo wakafunga
  rationale: Kufunga ni neno la kawaida la Kiswahili kwa kujinyima chakula, na mpangilio huu unasomeka kwa urahisi.
- source_word: חָטָאנוּ לַיהוָה
  choice: Tumemtendea Yahwe dhambi
  rationale: Muundo huu unaonyesha wazi kwamba dhambi hiyo ilielekezwa dhidi ya Yahwe na kuhifadhi uzito wa ungamo.
- source_word: וַיִּשְׁפֹּט
  choice: akawahukumu
  rationale: Neno שׁפט linaweza kuhusisha kuhukumu, kutawala, au kuamua mashauri. 'Akawahukumu' huhifadhi neno la msingi bila kulipanua kwa maelezo yasiyomo katika mstari.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hii inafuata kwa karibu usemi halisi wa Kiebrania, huku tanbihi ikifafanua kuwa unawahusu Waisraeli kama jamii.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Maana ya tendo la kumimina maji
  choice: Tendo limetafsiriwa kihalisi bila kulifafanua katika maandishi makuu.
  alternative: Kulieleza kama ishara ya toba, maombolezo, au kujimimina mbele za Mungu.
  rationale: Mstari hautoi maana ya wazi ya tendo hilo; kwa hiyo tafsiri haipaswi kuchagua ufafanuzi mmoja wa kitheolojia.
- issue: Jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Kutumia Yahwe kunahifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- issue: Wigo wa jukumu la Samueli katika וַיִּשְׁפֹּט
  choice: akawahukumu
  alternative: akawatawala au akawaamulia mashauri
  rationale: Neno la Kiebrania lina wigo mpana. Tafsiri ya msingi 'akawahukumu' inahifadhi mvutano huo bila kulifanya jukumu hilo kuwa la kisiasa au la kimahakama pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. Viunganishi vya simulizi vimewekwa kwa kiasi ili kuhifadhi mwendo wa masimulizi ya Kiebrania bila kufanya sentensi kuwa nzito.
