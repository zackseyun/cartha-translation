  text: וַ/יְהִ֤י שְׁמוּאֵל֙ מַעֲלֶ֣ה הָ/עוֹלָ֔ה וּ/פְלִשְׁתִּ֣ים נִגְּשׁ֔וּ לַ/מִּלְחָמָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יַּרְעֵ֣ם יְהוָ֣ה בְּ/קוֹל גָּ֠דוֹל בַּ/יּ֨וֹם הַ/ה֤וּא עַל פְּלִשְׁתִּים֙ וַ/יְהֻמֵּ֔/ם וַ/יִּנָּגְפ֖וּ לִ/פְנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/010.yaml
  text: And as Samuel was offering up the burnt offering[a], the Philistines drew near for battle against Israel. But Yahweh thundered with a great sound on that day against the Philistines and threw them into confusion, and they were defeated before Israel.
translation:
  language: sw
  text: Ikawa, Samweli alipokuwa akitoa sadaka ya kuteketezwa, Wafilisti wakakaribia kupigana na Israeli. Lakini siku hiyo Yahwe akapiga radi kwa sauti kuu[a] dhidi ya Wafilisti, akawavuruga, nao wakashindwa mbele ya Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa radi kuu” au “kwa mshindo mkubwa.” Kiebrania kinasema kihalisi “kwa sauti kuu.”
    reason: Neno קוֹל linaweza kumaanisha sauti au mshindo; katika muktadha wa kitenzi cha kupiga radi, radi inakusudiwa lakini usemi wa Kiebrania una upana huo.
lexical_decisions:
- source_word: מַעֲלֶה
  choice: alipokuwa akitoa
  rationale: Hali ya kuendelea ya kitenzi kishirikishi inaonyesha kwamba Samweli alikuwa katikati ya tendo la kuitoa sadaka.
- source_word: הָעוֹלָה
  choice: sadaka ya kuteketezwa
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa sadaka iliyoteketezwa juu ya madhabahu.
- source_word: נִגְּשׁוּ לַמִּלְחָמָה בְּיִשְׂרָאֵל
  choice: wakakaribia kupigana na Israeli
  rationale: Huwasilisha kwa Kiswahili cha kawaida kusogea kwa Wafilisti kwa kusudi la kuingia vitani dhidi ya Israeli.
- source_word: וַיַּרְעֵם
  choice: akawangurumia
  rationale: Kitenzi kinahusu radi; 'akawangurumia' kinadumisha Yahwe kama mtendaji na Wafilisti kama wale ambao tendo hilo lilielekezwa kwao.
- source_word: בְּקוֹל גָּדוֹל
  choice: kwa sauti kuu
  rationale: Huhifadhi upana wa maana ya קוֹל, 'sauti,' bila kuifafanua kimya kimya kuwa radi au mshindo pekee.
- source_word: וַיְהֻמֵּם
  choice: na kuwavuruga
  rationale: Hutoa maana ya kusababisha kuchanganyikiwa na kuvunjika kwa mpangilio wao vitani bila kutangulia kusema matokeo ya kushindwa.
- source_word: וַיִּנָּגְפוּ לִפְנֵי יִשְׂרָאֵל
  choice: nao wakashindwa mbele ya Israeli
  rationale: Huwasilisha kushindwa kwao vitani huku ikihifadhi nahau ya Kiebrania 'mbele ya Israeli'.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi יְהוָה; 'Yahwe' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Chanzo cha ushindi wa Israeli
  choice: Yahwe ndiye aliyewangurumia na kuwavuruga Wafilisti
  alternative: Israeli iliwashinda kwa nguvu zake yenyewe
  rationale: Mpangilio wa sentensi za Kiebrania unasisitiza kwanza tendo la Yahwe, kisha kushindwa kwa Wafilisti mbele ya Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Masimulizi yanatumia mfuatano wa 'waka-' kwa mtiririko wa matukio, huku 'alipokuwa akitoa' ikihifadhi tendo lililokuwa likiendelea. 'Akawangurumia' ni ya kawaida na yenye nguvu bila kuingiza wazo la hotuba ya Mungu.
