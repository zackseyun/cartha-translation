  text: וַ/תָּשֹׁ֣בְנָה הֶ/עָרִ֡ים אֲשֶׁ֣ר לָֽקְחוּ פְלִשְׁתִּים֩ מֵ/אֵ֨ת יִשְׂרָאֵ֤ל לְ/יִשְׂרָאֵל֙ מֵ/עֶקְר֣וֹן וְ/עַד גַּ֔ת וְ/אֶ֨ת גְּבוּלָ֔/ן הִצִּ֥יל יִשְׂרָאֵ֖ל מִ/יַּ֣ד פְּלִשְׁתִּ֑ים וַ/יְהִ֣י שָׁל֔וֹם בֵּ֥ין יִשְׂרָאֵ֖ל וּ/בֵ֥ין הָ/אֱמֹרִֽי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/014.yaml
  text: And the cities that the Philistines had taken from Israel were restored to Israel[a], from Ekron to Gath; and Israel delivered its territory from the hand of the Philistines. And there was peace between Israel and the Amorites.
translation:
  language: sw
  text: Miji ambayo Wafilisti walikuwa wameiteka kutoka kwa Israeli ilirudishwa kwa Israeli, kuanzia Ekroni hadi Gathi; nayo Israeli ikayakomboa maeneo ya miji hiyo kutoka mikononi mwa Wafilisti. Kukawa na amani kati ya Israeli na Waamori.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wakanaani,” ikiwa hapa “Waamori” limetumiwa kama jina pana la watu wa nchi hiyo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּשֹׁבְנָה
  choice: ikarudishwa
  rationale: Kitenzi שוב kina miji kama kiima; kauli ya kutendwa inaeleza kwa kawaida kwamba miji hiyo ilirudi chini ya mamlaka ya Israeli bila kuipa miji utendaji wa kibinadamu.
- source_word: הֶעָרִים
  choice: Miji
  rationale: Hili ndilo neno la kawaida kwa ערים na linafaa katika muktadha wa maeneo yenye mamlaka ya kisiasa na kijeshi.
- source_word: לָקְחוּ
  choice: walikuwa wameiteka
  rationale: Hali ya wakati uliotangulia inaonyesha kuwa Wafilisti waliiteka miji kabla ya kurudishwa kwake; ‘teka’ pia hudokeza unyakuzi wa kijeshi.
- source_word: מֵאֵת יִשְׂרָאֵל ... לְיִשְׂרָאֵל
  choice: kutoka kwa Israeli ... kwa Israeli
  rationale: Inahifadhi kurudiwa kwa jina Israeli na mwelekeo wa kutoka kisha kurudi kwa mwenyewe uliomo katika Kiebrania.
- source_word: מֵעֶקְרוֹן וְעַד גַּת
  choice: kuanzia Ekroni hadi Gathi
  rationale: Inawasilisha wazi mpaka wa kijiografia unaotajwa katika maandishi.
- source_word: וְאֶת גְּבוּלָן
  choice: maeneo ya miji hiyo
  rationale: גבול inaweza kuwa mpaka au eneo. Kiambishi cha Kiebrania ni cha wingi wa kike na kinarejelea miji; usemi huu unaweka rejeo hilo wazi na unaonyesha eneo lililo chini ya miji hiyo, si mstari wa mpaka tu.
- source_word: הִצִּיל
  choice: ikayakomboa
  rationale: Hifili ya נצל ina maana ya kuokoa au kukomboa kutoka chini ya nguvu ya adui. ‘Kukomboa’ linafaa kwa kurejesha maeneo kutoka mamlaka ya Wafilisti bila kuongeza maelezo yasiyokuwamo.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: kutoka mikononi mwa Wafilisti
  rationale: Inahifadhi picha halisi ya nahau ya Kiebrania ‘kutoka mkononi mwa’ huku ikisikika kwa kawaida katika Kiswahili.
- source_word: וַיְהִי שָׁלוֹם
  choice: Kukawa na amani
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya kishazi cha kuwepo, ikieleza hali ya kutokuwa na uhasama.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Maandishi ya Kiebrania yanataja hasa Waamori; tafsiri kuu inalihifadhi jina hilo la watu badala ya kulipanua kimya kimya kuwa Wakanaani.
theological_decisions:
- issue: Maana ya jina הָאֱמֹרִי mwishoni mwa aya
  choice: Waamori
  alternative: Wakanaani
  rationale: Kiebrania kinawataja Waamori moja kwa moja. Baadhi hulielewa jina hili kwa maana pana zaidi ya wakazi wa Kanaani, lakini uwezekano huo umewekwa katika tanbihi ili kutobadili maana mahsusi ya maandishi makuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unafuata kwa karibu mtiririko wa Kiebrania lakini hutumia nyakati na upatanisho wa kisarufi unaosomeka kwa kawaida. Alama ya tanbihi imewekwa baada ya ‘Waamori,’ ambako tofauti ya tafsiri inahusika.
