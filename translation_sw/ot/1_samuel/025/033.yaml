base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/033.yaml
  text: And blessed be your judgment[a], and blessed be you[c][b], who have kept me this day from coming into bloodshed and from saving myself by my own hand.
translation:
  language: sw
  text: Na ibarikiwe busara yako[a], nawe ubarikiwe, kwa kuwa leo umenizuia nisije nikahusika katika umwagaji wa damu[b] wala kujipatia wokovu kwa mkono wangu mwenyewe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utambuzi wako” au “uamuzi wako mzuri.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “katika damu”; usemi huo unaweza pia kuwa na maana ya “katika hatia ya damu.”
    reason: lexical_alternative
  - marker: c
    text: Au “kujilipizia kisasi kwa mkono wangu mwenyewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ טַעְמֵךְ
  choice: Na ibarikiwe busara yako
  rationale: טַעַם hapa humaanisha uwezo wa kufanya uamuzi wa busara au utambuzi mzuri. “Busara yako” ni Kiswahili cha kawaida na chenye hadhi kinacholingana na kitendo cha Abigaili cha kumzuia Daudi.
- source_word: וּבְרוּכָה אָתְּ
  choice: nawe ubarikiwe
  rationale: Huhifadhi kauli ya baraka iliyoelekezwa moja kwa moja kwa Abigaili na usambamba wake na baraka ya kwanza.
- source_word: אֲשֶׁר כְּלִתִנִי
  choice: kwa kuwa ... umenizuia
  rationale: Ingawa אֲשֶׁר inaweza kutambulisha kishazi cha uhusiano, hapa Kiswahili cha “kwa kuwa” huonyesha kwa kawaida msingi wa baraka; כּלה katika muktadha huu ni kuzuia au kukomesha tendo lililokusudiwa.
- source_word: הַיּוֹם הַזֶּה
  choice: leo
  rationale: “Leo” huwasilisha kwa uwazi na kwa Kiswahili cha sasa msisitizo wa wakati wa הביטוי ya Kiebrania.
- source_word: מִבּוֹא בְדָמִים
  choice: nisiingie katika umwagaji wa damu
  rationale: Huhifadhi taswira ya kitenzi “kuingia/kuja katika” badala ya kuibadili moja kwa moja kuwa “kumwaga,” huku “umwagaji wa damu” ikitoa maana ya kawaida ya דָּמִים katika muktadha huu.
- source_word: וְהֹשֵׁעַ יָדִי לִי
  choice: na kujiokoa kwa mkono wangu mwenyewe
  rationale: Hukaa karibu na maana ya msingi ya ישׁע, “kuokoa/kukomboa,” na huhifadhi mvutano wa usemi huo; katika muktadha, kujiokoa huku kungetekelezwa kama kisasi cha Daudi mwenyewe.
theological_decisions:
- issue: דָּמִים inaweza kumaanisha umwagaji wa damu au hatia ya damu
  choice: umwagaji wa damu
  alternative: hatia ya damu
  rationale: Muktadha wa karibu unahusu mauaji ambayo Daudi alikusudia kuyafanya dhidi ya nyumba ya Nabali. Hata hivyo, wingi wa Kiebrania unaweza pia kudokeza hatia inayotokana na damu iliyomwagwa, hivyo maana hiyo imehifadhiwa katika tanbihi.
- issue: וְהֹשֵׁעַ יָדִי לִי inaweza kueleweka kama kujiokoa au kujilipizia kisasi kwa mkono mwenyewe
  choice: kujiokoa kwa mkono wangu mwenyewe
  alternative: kujilipizia kisasi kwa mkono wangu mwenyewe
  rationale: Tafsiri kuu huhifadhi maana ya kimsingi ya ישׁע na usemi wa Kiebrania bila kuufafanua kupita kiasi; maana ya kisasi, ambayo inaungwa mkono wazi na muktadha, imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa baraka umerudiwa ili kuhifadhi usambamba wa Kiebrania; “nisiingie katika umwagaji wa damu” huhifadhi taswira ya chanzo huku ikibaki inaeleweka kwa msomaji wa kawaida.
