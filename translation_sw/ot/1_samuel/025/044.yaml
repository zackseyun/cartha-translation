  yaml_path: translation/ot/1_samuel/025/044.yaml
  text: Saul had given Michal his daughter[a], David’s wife, to Palti son of Laish, who was from Gallim.
translation:
  language: sw
  text: Sauli alikuwa amempa Palti, mwana wa Laishi, aliyetoka Galimu, Mikali, binti yake na mke wa Daudi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/שָׁאוּל
  choice: Sauli
  rationale: Kiunganishi ו־ kinaendeleza simulizi, lakini hakihitaji kutafsiriwa kwa neno la pekee mwanzoni mwa sentensi katika Kiswahili hiki.
- source_word: נָתַן
  choice: alikuwa amempa
  rationale: Kauli hii inaonyesha tendo lililokuwa limekamilika kabla ya hatua ya simulizi inayozungumziwa; umbo la wakati uliopita timilifu linaonyesha uhusiano huo kwa kawaida.
- source_word: מִיכַל בִּתּוֹ
  choice: Mikali, binti yake
  rationale: Huhifadhi jina na kauli ya ufafanuzi inayomtambulisha Mikali kuwa binti ya Sauli.
- source_word: אֵשֶׁת דָּוִד
  choice: mke wa Daudi
  rationale: Hutafsiri moja kwa moja uhusiano wa ndoa uliotajwa katika muundo wa Kiebrania bila kuamua kimya kimya kama ndoa hiyo ilikuwa imevunjika.
- source_word: לְפַלְטִי
  choice: Palti
  rationale: Jina limeandikwa kwa kufuata umbo la Kiebrania פַלְטִי; nafasi yake baada ya kitenzi hufanya mpokeaji awe wazi katika Kiswahili.
- source_word: בֶן לַיִשׁ
  choice: mwana wa Laishi
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya nasaba ya baba.
- source_word: אֲשֶׁר מִגַּלִּים
  choice: kutoka Galimu
  rationale: Kirai hiki kinaonyesha mahali Palti alikotoka kwa Kiswahili cha kawaida na wazi.
theological_decisions:
- issue: Mikali kuitwa mke wa Daudi baada ya Sauli kumpa Palti
  choice: binti yake na mke wa Daudi
  alternative: binti yake, aliyekuwa mke wa Daudi
  rationale: Kiebrania humwita Mikali moja kwa moja “mke wa Daudi.” Tafsiri haiongezi “aliyekuwa,” ambalo lingeweza kudokeza kuwa ndoa hiyo ilikuwa imekwisha na hivyo kuondoa mvutano uliopo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa maneno umebadilishwa kidogo ili iwe wazi kwamba Palti ndiye aliyepokea Mikali, huku kauli kwamba Mikali ni mke wa Daudi ikihifadhiwa bila kufafanuliwa kupita matini.
