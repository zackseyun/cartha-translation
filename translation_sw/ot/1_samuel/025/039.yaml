base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/039.yaml
  text: When David heard that Nabal was dead[a], he said, “Blessed be Yahweh, who has pleaded the case of my reproach from the hand of Nabal, and has kept his servant back from evil. Yahweh has returned Nabal’s evil on his own head.” Then David sent and spoke to Abigail[e][d][c][b], to take her as his wife.
translation:
  language: sw
  text: Daudi aliposikia kwamba Nabali amekufa, akasema, “Na abarikiwe Yahwe, aliyetetea shauri langu kuhusu fedheha niliyotendewa na Nabali,[a] na kumzuia mtumishi wake asitende uovu.[b] Yahwe ameirudisha juu ya kichwa cha Nabali mwenyewe uovu wa Nabali.”[c] Kisha Daudi akatuma ujumbe kwa Abigaili ili amchukue awe mke wake.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyetetea kesi ya tusi nililotukanwa na Nabali,” au “aliyenilipizia kisasi kwa fedheha niliyotendewa na Nabali.” Kiebrania kinatumia lugha ya shauri la kisheria.
    reason: lexical_alternative
  - marker: b
    text: Au, “aliyemzuia mtumishi wake kufanya madhara.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania, “ameurudisha uovu wa Nabali juu ya kichwa chake,” yaani, matokeo ya uovu wake yamemrudia yeye mwenyewe.
    reason: cultural_note
  - marker: d
    text: Kiebrania kinaweza kutafsiriwa, “Daudi akatuma watu, nao wakazungumza na Abigaili, ili amchukue awe mke wake”; yaani, ili amwoe.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  choice: Na abarikiwe Yahwe
  rationale: Huhifadhi mfumo wa baraka na sifa wa Kiebrania, huku jina la Mungu likitafsiriwa kwa unukuzi wa kawaida wa Kiswahili, “Yahwe.”
- source_word: רָב אֶת רִיב חֶרְפָּתִי
  choice: aliyetetea shauri langu kuhusu fedheha niliyotendewa
  rationale: “Kutetea shauri” hudumisha taswira ya kisheria ya mzizi ריב; “fedheha niliyotendewa” hueleza kwa Kiswahili cha kawaida kwamba חֶרְפָּה hapa ni aibu au tusi lililomwangukia Daudi.
- source_word: מִיַּד נָבָל
  choice: na Nabali
  rationale: Neno kwa neno ni “kutoka mkononi mwa Nabali,” lakini hapa mkono unaonyesha mhusika au chanzo. “Niliyotendewa na Nabali” ni wazi na ya asili zaidi katika Kiswahili.
- source_word: וְאֶת עַבְדּוֹ חָשַׂךְ מֵרָעָה
  choice: na kumzuia mtumishi wake asitende uovu
  rationale: חָשַׂךְ ina maana ya kuzuia au kushikilia nyuma. Muundo huu huhifadhi Daudi kujitaja kwa unyenyekevu kuwa mtumishi wa Mungu na nguvu ya kimaadili ya רָעָה.
- source_word: וְאֵת רָעַת נָבָל הֵשִׁיב יְהוָה בְּרֹאשׁוֹ
  choice: Yahwe ameirudisha juu ya kichwa cha Nabali mwenyewe ile uovu aliyotenda
  rationale: Huhifadhi sitiari ya Kiebrania ya malipo kumrudia mkosaji “juu ya kichwa chake,” huku “aliyotenda” ikifanya rejeo la uovu wa Nabali lieleweke kwa Kiswahili.
- source_word: וַיִּשְׁלַח דָּוִד וַיְדַבֵּר בַּאֲבִיגַיִל
  choice: Kisha Daudi akatuma ujumbe kwa Abigaili
  rationale: Mfuatano wa “akatuma, akasema kwa Abigaili” unaelekea kueleza ujumbe uliotumwa kupitia wajumbe. “Akatuma ujumbe kwa” ni wa asili bila kuongeza wazi kwamba huo ulikuwa ombi la ndoa.
- source_word: לְקַחְתָּהּ לוֹ לְאִשָּׁה
  choice: ili amchukue awe mke wake
  rationale: Huhifadhi nahau ya kawaida ya Kiebrania ya ndoa kwa namna inayoeleweka na yenye hadhi katika Kiswahili.
theological_decisions:
- issue: Hukumu na majaliwa ya Mungu katika kifo cha Nabali
  choice: Maneno yanaonyesha tafsiri ya Daudi kwamba Yahwe alimtetea na kuurudisha uovu wa Nabali juu yake.
  alternative: Kusema moja kwa moja kwamba Yahwe alimuua Nabali kama adhabu.
  rationale: Aya inamhusisha Yahwe wazi na utetezi na malipo, lakini haipaswi kupanuliwa kuwa dai la jumla kuhusu kila kifo au mateso.
- issue: Maana ya kimaadili ya Daudi kuzuiwa kutoka רָעָה
  choice: “kumzuia mtumishi wake asitende uovu”
  alternative: “kumzuia mtumishi wake asilete madhara”
  rationale: Katika muktadha Daudi alikuwa amekusudia umwagaji damu wa kulipiza kisasi. “Uovu” hudumisha tathmini ya kimaadili ya neno la Kiebrania bila kuifanya iwe madhara tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi na unaosomeka kwa urahisi. Jina Nabali limetumiwa kulingana na desturi ya Kiswahili cha Biblia, na Abigaili kwa umbo linalotambulika sana. Taswira muhimu za kisheria na za malipo zimehifadhiwa, huku nahau zisizo za kawaida zikifafanuliwa katika tanbihi.
