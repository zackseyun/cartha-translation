revisions:
- from: Basi sasa, bwana wangu, kama Yahweh aishivyo na kama wewe mwenyewe uishivyo, kwa kuwa Yahweh amekuzuia usiwe na hatia ya damu na kujiokoa kwa mkono wako mwenyewe,[a] basi sasa adui zako na wale wanaomtakia bwana wangu mabaya na wawe kama Nabali.[b]
  to: Basi sasa, bwana wangu, kama Yahweh aishivyo na kama wewe mwenyewe uishivyo, kwa kuwa Yahweh amekuzuia usipate hatia ya damu wala usijiokoe kwa mkono wako mwenyewe,[a] basi sasa adui zako na wale wanaomtakia bwana wangu mabaya wawe kama Nabali.[b]
  rationale: The revision retains the source’s two discourse markers and the deliberately close rendering of ישׁע as ‘kujiokoa.’ It improves Swahili coordination and makes clear that Yahweh restrained David from both incurring bloodguilt and acting to save/deliver himself by his own hand. The footnote keeps the contextually explicit ‘avenge yourself’ interpretation as an alternative rather than imposing it on the main text.
