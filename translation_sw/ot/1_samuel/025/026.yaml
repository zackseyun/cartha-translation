  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֲדֹנִ֗/י חַי יְהוָ֤ה וְ/חֵֽי נַפְשְׁ/ךָ֙ אֲשֶׁ֨ר מְנָעֲ/ךָ֤ יְהוָה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הוֹשֵׁ֥עַ יָדְ/ךָ֖ לָ֑/ךְ וְ/עַתָּ֗ה יִֽהְי֤וּ כְ/נָבָל֙ אֹיְבֶ֔י/ךָ וְ/הַֽ/מְבַקְשִׁ֥ים אֶל אֲדֹנִ֖/י רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/026.yaml
  text: '[A], my lord, as Yahweh lives and as you yourself live, since Yahweh has kept you from bloodguilt and from saving yourself by your own hand[b], now let your enemies and those who seek evil against my lord be like Nabal.'
translation:
  language: sw
  text: Basi sasa, bwana wangu, kama Yahweh aishivyo na kama wewe mwenyewe uishivyo, kwa kuwa Yahweh amekuzuia usipate hatia ya damu wala usijiokoe kwa mkono wako mwenyewe,[a] basi sasa adui zako na wale wanaomtakia bwana wangu mabaya wawe kama Nabali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana iliyo wazi zaidi katika muktadha, “wala usijilipizie kisasi kwa mkono wako mwenyewe.”
    reason: lexical_alternative
  - marker: b
    text: “Nabali” hapa ni jina la mtu, lakini jina hilo pia linasikika kama neno la Kiebrania linalomaanisha “mpumbavu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa / basi sasa
  rationale: Kirai hiki kinatokea mara mbili katika Kiebrania. “Basi sasa” kinawasilisha kwa Kiswahili cha kawaida mpito wa hoja pamoja na maana ya wakati.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Ni namna ya heshima ambayo Abigaili anatumia kumwambia Daudi; hapa si jina la Mungu.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: kama Yahweh aishivyo na kama wewe mwenyewe uishivyo
  rationale: Hiki ni kiapo kinachotaja uhai wa Yahweh na wa anayesemeshwa. “Wewe mwenyewe” huwasilisha maana ya nafsi ya mtu kwa Kiswahili cha kawaida bila kufanya “nafsi” ionekane kama kitu tofauti na mtu.
- source_word: מְנָעֲךָ יְהוָה
  choice: Yahweh amekuzuia
  rationale: Kitenzi kina maana ya kumzuia mtu asifanye jambo; kauli hii ni ya moja kwa moja na ya kawaida.
- source_word: מִבּוֹא בְדָמִים
  choice: usiwe na hatia ya damu
  rationale: Usemi halisi ni kama “kuingia katika damu,” lakini katika muktadha unahusu kupata hatia kwa kumwaga damu, si umwagaji damu kama tukio tu.
- source_word: וְהוֹשֵׁעַ יָדְךָ לָךְ
  choice: na kujiokoa kwa mkono wako mwenyewe
  rationale: Tafsiri hii inadumisha maana ya msingi ya kitenzi ישׁע, ‘okoa/komboa,’ pamoja na taswira ya mkono wa Daudi mwenyewe. Maana ya kulipiza kisasi katika muktadha imeelezwa katika tanbihi badala ya kuwekwa kimya kimya katika matini.
- source_word: יִהְיוּ כְנָבָל
  choice: na wawe kama Nabali
  rationale: נָבָל hapa kimsingi ni jina la mume wa Abigaili. Umbo “Nabali” ni la kawaida katika majina ya kibiblia ya Kiswahili; mwangwi wa maana ‘mpumbavu’ umehifadhiwa katika tanbihi.
- source_word: אֹיְבֶיךָ וְהַמְבַקְשִׁים אֶל אֲדֹנִי רָעָה
  choice: adui zako na wale wanaomtakia bwana wangu mabaya
  rationale: “Kumtakia ... mabaya” ni usemi wa asili wa Kiswahili unaowasilisha nia ya kumdhuru mtu bila kupunguza uzito wa רָעָה.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- issue: Maana ya hatua ambayo Daudi alizuiwa kuchukua
  choice: kupata hatia ya damu na kujiokoa kwa mkono wake mwenyewe
  alternative: kulipiza kisasi kwa mkono wake mwenyewe
  rationale: Matini kuu inadumisha maana ya kileksia ya ישׁע, huku tanbihi ikionyesha maana inayowezekana sana katika muktadha wa kisasi cha Daudi. Hivyo mvutano wa usemi wa Kiebrania hauondolewi.
- issue: Nguvu ya יִהְיוּ katika ombi la Abigaili
  choice: na wawe kama Nabali
  alternative: watakuwa kama Nabali
  rationale: Umbo hili linafaa kueleweka kama ombi au tamko lenye nguvu ya kutakia matokeo, si taarifa tambarare tu kuhusu wakati ujao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Marudio ya “basi sasa” yamehifadhiwa kwa sababu וְעַתָּה imo mara mbili katika matini ya Kiebrania. Kiapo kimetolewa kwa muundo wa Kiswahili unaosomeka kwa kawaida, na tofauti kati ya jina la Mungu “Yahweh” na cheo cha heshima “bwana wangu” imehifadhiwa.
