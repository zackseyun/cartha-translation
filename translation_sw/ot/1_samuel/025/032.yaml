  text: וַ/יֹּ֥אמֶר דָּוִ֖ד לַ/אֲבִיגַ֑ל בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֧ר שְׁלָחֵ֛/ךְ הַ/יּ֥וֹם הַ/זֶּ֖ה לִ/קְרָאתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/032.yaml
  text: David said to Abigail[a], “Blessed be Yahweh, the God of Israel, who sent you this day to meet me.”
translation:
  language: sw
  text: Daudi akamwambia Abigaili, “Abarikiwe Yahwe, Mungu wa Israeli, aliyekutuma leo hii[a] kukutana nami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “siku hii”; pia yaweza kutafsiriwa, “leo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Kiambishi simulizi ‘aka-’ kinaonyesha tukio linalofuata katika mtiririko wa simulizi, na muundo ‘akamwambia’ unaonyesha kwa kawaida kwamba maneno yanaelekezwa kwa Abigaili.
- source_word: לַאֲבִיגַל
  choice: Abigaili
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili, huku kiambishi cha yambwa katika ‘akamwambia’ kikibeba maana ya kihusishi ל.
- source_word: בָּרוּךְ
  choice: Na abarikiwe
  rationale: Huu ni usemi wa kumhimidi Mungu. ‘Na abarikiwe’ huhifadhi nguvu ya baraka na hadhi ya usemi bila kutumia lugha ya kizamani.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kama jina binafsi ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Muundo huu unatambulisha Yahwe kuwa Mungu wa Israeli kwa Kiswahili cha kawaida na kilicho wazi.
- source_word: אֲשֶׁר
  choice: aliye-
  rationale: Kiambishi cha uhusiano ‘aliye-’ kinamrejelea Yahwe kama mtendaji wa kitendo cha kumtuma Abigaili.
- source_word: שְׁלָחֵךְ
  choice: aliyekutuma
  rationale: Kitenzi kinakieleza kitendo kilichokamilika cha Mungu kumtuma Abigaili; ‘aliyekutuma’ ni cha kawaida na sahihi katika muktadha huu.
- source_word: הַיּוֹם הַזֶּה
  choice: leo hii
  rationale: ‘Leo hii’ huhifadhi msisitizo wa kifungu halisi ‘siku hii’ huku ikiwa ya asili katika Kiswahili cha sasa.
- source_word: לִקְרָאתִי
  choice: kukutana nami
  rationale: Kifungu kinaonyesha kusudi la kutumwa kwa Abigaili ili akutane na Daudi; ‘kukutana nami’ ni wazi na cha kawaida.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu יהוה. ‘Yahwe’ hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo, wala kulazimisha namna nyingine ya jadi ya kulitamka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa baraka ‘Na abarikiwe Yahwe’ umehifadhi uzito wa usemi wa kidini, huku sentensi nzima ikibaki rahisi kueleweka. Alama ya tanbihi imewekwa baada ya ‘leo hii,’ ambako inahusika moja kwa moja.
