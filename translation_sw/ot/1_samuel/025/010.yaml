  text: וַ/יַּ֨עַן נָבָ֜ל אֶת עַבְדֵ֤י דָוִד֙ וַ/יֹּ֔אמֶר מִ֥י דָוִ֖ד וּ/מִ֣י בֶן יִשָׁ֑י הַ/יּוֹם֙ רַבּ֣וּ עֲבָדִ֔ים הַ/מִּתְפָּ֣רְצִ֔ים אִ֖ישׁ מִ/פְּנֵ֥י אֲדֹנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/010.yaml
  text: Nabal answered David’s servants and said[a], “Who is David? And who is the son of Jesse? These days many servants are breaking away, each man from before his master.”
translation:
  language: sw
  text: Nabali akawajibu watumishi wa Daudi, akasema, “Daudi ni nani? Na mwana wa Yese ni nani? Siku hizi watumishi wengi[a] wanajitenga, kila mmoja akimwacha bwana wake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Siku hizi wamekuwa wengi watumishi wanaojitenga, kila mmoja akimwacha bwana wake.”
    reason: Muundo huu unaonyesha wazi zaidi kwamba רַבּוּ ni kitenzi, ‘wamekuwa wengi’ au ‘wameongezeka,’ badala ya kulieleza tu kwa kivumishi ‘wengi.’
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: akawajibu ... akasema
  rationale: Mfumo huu wa masimulizi unaonyesha kwamba Nabali alitoa jibu kwa watumishi wa Daudi; kutaja pia ‘akasema’ kunahifadhi muundo wa utangulizi wa usemi wa Kiebrania bila kufanya Kiswahili kuwa kizito.
- source_word: עַבְדֵי דָוִד
  choice: watumishi wa Daudi
  rationale: עבד inaweza kumaanisha mtumishi au mtumwa. Hapa inawahusu wajumbe au watu waliokuwa chini ya Daudi, kwa hiyo ‘watumishi’ ni sahihi na ya kawaida katika muktadha huu.
- source_word: מִי דָוִד וּמִי בֶן־יִשָׁי
  choice: Daudi ni nani? Na mwana wa Yese ni nani?
  rationale: Kurudia swali kunahifadhi dharau ya Nabali badala ya kulifanya swali la kutafuta habari. ‘Mwana wa Yese’ linadumisha namna ya Kiebrania ya kumtaja Daudi.
- source_word: הַיּוֹם
  choice: Siku hizi
  rationale: Ingawa neno hilo kwa msingi ni ‘leo,’ hapa linaanzisha kauli ya jumla kuhusu hali ya wakati huo; ‘siku hizi’ ni Kiswahili cha kawaida chenye maana hiyo.
- source_word: רַבּוּ עֲבָדִים
  choice: watumishi wengi
  rationale: רבו lina maana ya kuwa wengi au kuongezeka. Muundo ‘watumishi wengi’ unaeleza kwa Kiswahili cha kawaida wingi unaosisitizwa na kitenzi hicho; tafsiri iliyo karibu zaidi na muundo wa chanzo imewekwa katika tanbihi.
- source_word: הַמִּתְפָּרְצִים
  choice: wanajitenga
  rationale: Kitenzi hiki kina wazo la kuvunja mipaka au kujitoa kwa nguvu. Katika muktadha wa watumishi kuwaacha mabwana wao, ‘wanajitenga’ linaonyesha kujiondoa bila kuongeza waziwazi dhana ya uasi ambayo haijasemwa moja kwa moja.
- source_word: אִישׁ מִפְּנֵי אֲדֹנָיו
  choice: kila mmoja akimwacha bwana wake
  rationale: אישׁ limetumiwa kwa maana ya kugawa, ‘kila mmoja.’ Ingawa מִפְּנֵי ni kihalisi ‘kutoka mbele ya,’ hapa ni nahau ya kuondoka kwa mtu; ‘akimwacha bwana wake’ ni Kiswahili asilia kinachohifadhi maana hiyo.
- source_word: אֲדֹנָיו
  choice: bwana wake
  rationale: Katika muktadha huu אדון ni mkuu wa kibinadamu mwenye mamlaka juu ya mtumishi. ‘Bwana’ ni neno la kawaida la Kiswahili hapa, na kiambishi ‘wake’ kinahifadhi umoja wa mgawanyo wa Kiebrania.
