translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maswali mafupi yanahifadhi sauti ya dharau ya Nabali. Nahau ngumu ya Kiebrania ‘kutoka mbele ya bwana wake’ imetolewa kwa Kiswahili asilia ‘akimwacha bwana wake,’ huku mgawanyo wa ‘kila mmoja’ ukihifadhiwa.
