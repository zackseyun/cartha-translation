base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/020.yaml
  text: And as she was riding on the donkey and going down under cover of the mountain[a], behold, David and his men were coming down to meet her, and she met them.
translation:
  language: sw
  text: Ikawa alipokuwa amepanda punda, akishuka mahali palipofichwa na mlima[a], tazama, Daudi na watu wake walikuwa wakishuka kumwelekea, naye akakutana nao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upande uliofichika wa mlima.” Kifungu cha Kiebrania kinamaanisha eneo la mlima lililofichika au lililokingwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הִיא
  choice: Ikawa alipokuwa
  rationale: Muundo huu unaendeleza simulizi na kuweka tendo linalofuata ndani ya wakati wa tendo linaloendelea, bila kufuata Kiebrania kwa ugumu.
- source_word: רֹכֶבֶת עַל הַחֲמוֹר
  choice: amepanda punda
  rationale: Katika Kiswahili cha kawaida, kuwa ‘amepanda punda’ hueleza hali ya kusafiri akiwa juu ya punda kwa ufasaha.
- source_word: וְיֹרֶדֶת
  choice: akishuka
  rationale: Huhifadhi hali ya tendo linaloendelea na mwelekeo wa kushuka katika mandhari.
- source_word: בְּסֵתֶר הָהָר
  choice: mahali palipositirika na mlima
  rationale: סֵתֶר huhusu kufichwa, kusitirika, au kuwa chini ya kinga. Tafsiri hii inaeleza eneo lililofichwa au kukingwa na mlima huku ikihifadhi uwezekano wa namna halisi ya mandhari.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili linavuta fikira kwa ghafula kwenye tukio jipya na linafaa katika mtindo wa simulizi wenye hadhi.
- source_word: יֹרְדִים לִקְרָאתָהּ
  choice: walikuwa wakishuka kumwelekea
  rationale: לִקְרָאתָהּ huonyesha mwendo kuelekea upande wake na kukutana naye; ‘kumwelekea’ huepuka kudokeza kwa nguvu zaidi kwamba kusudi lao mahsusi lilikuwa kumlaki.
- source_word: וַתִּפְגֹּשׁ אֹתָם
  choice: naye akakutana nao
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya פגש katika simulizi.
