  yaml_path: translation/ot/1_samuel/025/041.yaml
  text: She rose and bowed with her face to the ground and said[a], “Behold[b], your servant is a maidservant to wash the feet of the servants of my lord.”
translation:
  language: sw
  text: Akainuka, akasujudu kifudifudi, akasema, “Tazama, mjakazi wako ni kijakazi[a] wa kuwaosha miguu watumishi wa bwana wangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia hapa maneno mawili yanayokaribiana, אמה na שפחה, kwa mwanamke mtumishi. Yote mawili yanaweza kutafsiriwa “mjakazi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: Akainuka
  rationale: Kitenzi קום katika mfuatano wa simulizi kinaonyesha kwamba Abigaili aliinuka; ‘akainuka’ ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: וַתִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: akasujudu hadi uso wake ukagusa ardhi
  rationale: Nahau hii inaeleza tendo la kujishusha kwa heshima kubwa, uso ukielekea ardhini. Tafsiri hii inaweka wazi mkao wa mwili bila kuufanya kuwa ibada kwa lazima.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwenye kauli ya Abigaili ya kujinyenyekeza. ‘Tazama’ lina hadhi inayofaa simulizi la Biblia na bado linaeleweka katika Kiswahili cha sasa.
- source_word: אֲמָתְךָ
  choice: mjakazi wako
  rationale: אָמָה ni neno la kike kwa mtumishi au mtumwa. ‘Mjakazi wako’ huhifadhi jinsia, hali ya unyenyekevu, na namna ya heshima ya kujitaja.
- source_word: לְשִׁפְחָה
  choice: awe mtumwa[a]
  rationale: שִׁפְחָה ni neno jingine la kike linalohusu hali ya utumishi au utumwa. ‘Mtumwa’ hulitofautisha na ‘mjakazi’ na kuonyesha jinsi Abigaili anavyojishusha ili kufanya kazi ya chini kabisa; tanbihi huhifadhi uwezekano wa ‘mjakazi.’
- source_word: לִרְחֹץ רַגְלֵי
  choice: wa kuwaosha miguu
  rationale: 'Muundo wa ל pamoja na kitenzi-jina unaonyesha kusudi: kuosha miguu.'
- source_word: עַבְדֵי אֲדֹנִי
  choice: watumishi wa bwana wangu
  rationale: Katika muktadha huu עֲבָדִים ni watu wanaomhudumia Daudi, kwa hiyo ‘watumishi’ ni ya asili; ‘bwana wangu’ huhifadhi heshima ya אֲדֹנִי.
theological_decisions:
- issue: Kutofautisha אָמָה na שִׁפְחָה, maneno mawili yanayohusu mwanamke aliye katika utumishi
  choice: Kutafsiri ‘mjakazi wako’ na ‘mtumwa’
  alternative: Kutafsiri yote mawili kwa ‘mjakazi’ au ‘mtumishi’
  rationale: Kutumia maneno mawili tofauti kunahifadhi tofauti ya msamiati wa Kiebrania na nguvu ya Abigaili kujishusha. Tanbihi inazuia tafsiri isimamishe kwa ukali kiwango cha kisheria cha utumwa ambacho mstari huu haukifafanui.
- issue: Maana ya tendo la וַתִּשְׁתַּחוּ katika muktadha huu
  choice: akasujudu hadi uso wake ukagusa ardhi
  alternative: aliabudu
  rationale: Hapa tendo linaeleza heshima na utiifu mbele ya Daudi; kulitafsiri ‘aliabudu’ kungeingiza maana ya kidini ambayo muktadha haulazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa sasa. ‘Tazama’ na ‘bwana wangu’ huhifadhi hadhi ya mazungumzo, huku ‘akasujudu hadi uso wake ukagusa ardhi’ ikieleza mkao bila kulazimisha maana ya ibada.
