base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/036.yaml
  text: When Abigail came to Nabal[a], behold, he was holding a feast in his house like the feast of a king, and Nabal’s heart was merry within him, and he was very drunk. So she told him nothing at all, small or great[b], until the light of morning.
translation:
  language: sw
  text: Abigaili alipofika kwa Nabali, akakuta alikuwa na karamu nyumbani mwake, kama karamu ya mfalme. Moyo wa Nabali ulikuwa na furaha, naye alikuwa amelewa sana. Lakini Abigaili hakumwambia jambo lolote, dogo wala kubwa[a], mpaka kulipopambazuka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “dogo na kubwa,” msemo unaomaanisha “jambo lolote kabisa.”'
    reason: lexical_alternative
  - marker: b
    text: Au “mpaka nuru ya asubuhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא אֲבִיגַיִל אֶל נָבָל
  choice: Abigaili alipofika kwa Nabali
  rationale: Muundo wa wakati unaunganisha kuwasili kwa Abigaili na jambo alilolikuta, huku ukiendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida.
- source_word: וְהִנֵּה
  choice: akakuta
  rationale: Katika muktadha huu, neno hili linatambulisha hali iliyomkabili Abigaili. “Akakuta” ni ya asili katika simulizi la Kiswahili na huhifadhi nguvu ya kuonyesha tukio, bila kutumia “tazama” isiyo ya kawaida hapa.
- source_word: מִשְׁתֶּה בְּבֵיתוֹ
  choice: ameandaa karamu nyumbani mwake
  rationale: מִשְׁתֶּה ni karamu yenye kula na kunywa; kitenzi “ameandaa” kinaeleza kwa kawaida kwamba karamu ilikuwa ikifanyika kwake. “Nyumbani mwake” hutoa mahali kwa Kiswahili fasaha.
- source_word: כְּמִשְׁתֵּה הַמֶּלֶךְ
  choice: kama karamu ya mfalme
  rationale: Huhifadhi tashbihi ya Kiebrania na wazo la karamu ya kifahari ya kifalme.
- source_word: וְלֵב נָבָל טוֹב עָלָיו
  choice: Moyo wa Nabali ulikuwa na furaha
  rationale: Huhifadhi taswira ya moyo na maana ya hali ya kufurahi, bila kuitafsiri kupita kiasi kuwa tabia au uadilifu.
- source_word: וְהוּא שִׁכֹּר עַד מְאֹד
  choice: naye alikuwa amelewa sana
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya hali ya ulevi pamoja na kiwango chake kikubwa.
- source_word: וְלֹא הִגִּידָה לוֹ דָּבָר קָטֹן וְגָדוֹל
  choice: Kwa hiyo Abigaili hakumwambia jambo lolote, dogo wala kubwa[a]
  rationale: “Jambo lolote” hutoa maana ya kukanusha kabisa, huku “dogo wala kubwa” ikihifadhi merizimu ya Kiebrania.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: mpaka kulipopambazuka[b]
  rationale: Ni Kiswahili cha kawaida kwa kufika kwa nuru ya asubuhi; tanbihi huhifadhi taswira halisi ya Kiebrania.
