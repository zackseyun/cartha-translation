base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/040.yaml
  text: So David’s servants came to Abigail at Carmel and spoke to her[a], saying, “David has sent us to you to take you for himself as a wife.”
translation:
  language: sw
  text: Basi watumishi wa Daudi wakamjia Abigaili huko Karmeli, wakamwambia, “Daudi ametutuma kwako ili akuchukue kuwa mke wake.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: wakamjia
  rationale: בוא inaweza kumaanisha kuja au kwenda kulingana na mtazamo. Hapa ‘wakamjia’ inaeleza kwa kawaida kuwasili kwao mahali alipokuwa Abigaili.
- source_word: עַבְדֵי דָוִד
  choice: watumishi wa Daudi
  rationale: עֶבֶד inaweza kumaanisha mtumishi, mtumwa, au afisa. Katika muktadha huu watu hawa ni wajumbe wa Daudi, bila kusisitiza hali ya utumwa.
- source_word: הַכַּרְמֶלָה
  choice: huko Karmeli
  rationale: Kiishio cha mwelekeo kinaonyesha mwendo kuelekea Karmeli; baada ya kitenzi cha kuwasili, Kiswahili cha kawaida hutaja mahali kwa ‘huko Karmeli.’
- source_word: וַיְדַבְּרוּ אֵלֶיהָ לֵאמֹר
  choice: wakasema naye
  rationale: Huu ni mtindo wa kawaida wa Kiebrania wa kutanguliza maneno ya moja kwa moja. ‘Wakasema naye’ ni wa asili na wenye heshima katika Kiswahili, bila kurudia ‘wakisema.’
- source_word: שְׁלָחָנוּ
  choice: ametutuma
  rationale: 'Kauli iliyokamilika ina athari ya sasa: wajumbe wamefika kwa sababu Daudi amewatuma.'
- source_word: לְקַחְתֵּךְ ... לוֹ לְאִשָּׁה
  choice: ili akuchukue uwe mke wake
  rationale: Usemi huu ni fomula ya ndoa. Tafsiri inadumisha kitenzi ‘kuchukua’ huku ‘uwe mke wake’ ikiweka wazi maana ya kindoa kwa Kiswahili cha kawaida.
