translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha masimulizi, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Jina limetolewa kama ‘Abigaili,’ umbo linalolingana na matumizi ya kawaida ya kibiblia kwa Kiswahili.
