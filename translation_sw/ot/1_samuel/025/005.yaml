base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/005.yaml
  text: So David sent ten young men[a], and David said to the young men, “Go up to Carmel, and go to Nabal, and greet him in my name with peace.”
translation:
  language: sw
  text: Daudi akawatuma vijana kumi, naye Daudi akawaambia vijana hao, “Pandeni kwenda Karmeli, mfikieni Nabali, na mwulizeni hali yake kwa jina langu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akawatuma
  rationale: Kitenzi ‘kutuma’ ndicho kisawe cha kawaida cha שלח katika simulizi, na kiambishi ‘-wa-’ kinarejelea vijana kumi.
- source_word: עֲשָׂרָה נְעָרִים
  choice: vijana kumi
  rationale: נְעָרִים hapa inaweza kumaanisha vijana au watumishi; ‘vijana’ huhifadhi maana yake ya msingi bila kuongeza hadhi ya kijamii isiyotajwa wazi.
- source_word: עֲלוּ כַרְמֶלָה
  choice: Pandeni kwenda Karmeli
  rationale: ‘Pandeni’ huhifadhi dhana ya עלה ya kwenda juu, huku ‘kwenda Karmeli’ ikionyesha wazi mwelekeo unaowakilishwa na he ya uelekeo.
- source_word: וּבָאתֶם אֶל נָבָל
  choice: mfikieni Nabali
  rationale: בוא ni kufika au kuja; katika maagizo haya, ‘mfikieni’ ni Kiswahili cha kawaida na huonyesha kufika kwa Nabali bila mkanganyiko wa mtazamo wa ‘kuja’.
- source_word: וּשְׁאֶלְתֶּם לוֹ
  choice: mumwulize
  rationale: שאל pamoja na ל ina maana ya kuuliza au kuhoji mtu; muundo huu unaingia katika salamu inayohusu hali njema.
- source_word: בִשְׁמִי
  choice: kwa jina langu
  rationale: Hii hudumisha kwa karibu usemi wa Kiebrania na maana ya kuwakilisha Daudi.
- source_word: לְשָׁלוֹם
  choice: hali yake
  rationale: Katika muktadha wa salamu, שָׁלוֹם huhusu ustawi au hali njema ya mtu. ‘Kumwuliza hali yake’ ni nahau ya kawaida ya Kiswahili inayowasilisha maana hiyo.
