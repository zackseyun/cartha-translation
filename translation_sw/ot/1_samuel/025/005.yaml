  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa salamu umetafsiriwa kwa nahau ya kawaida ‘kumwuliza hali yake’; hakuna tanbihi inayohitajika kwa kuwa maana ya msingi imehifadhiwa wazi.
