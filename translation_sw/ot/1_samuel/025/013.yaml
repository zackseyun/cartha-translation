  text: וַ/יֹּאמֶר֩ דָּוִ֨ד לַ/אֲנָשָׁ֜י/ו חִגְר֣וּ אִ֣ישׁ אֶת חַרְבּ֗/וֹ וַֽ/יַּחְגְּרוּ֙ אִ֣ישׁ אֶת חַרְבּ֔/וֹ וַ/יַּחְגֹּ֥ר גַּם דָּוִ֖ד אֶת חַרְבּ֑/וֹ וַֽ/יַּעֲל֣וּ אַחֲרֵ֣י דָוִ֗ד כְּ/אַרְבַּ֤ע מֵאוֹת֙ אִ֔ישׁ וּ/מָאתַ֖יִם יָשְׁב֥וּ עַל הַ/כֵּלִֽים׀־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/013.yaml
  text: Then David said to his men[a], “Each man strap on his sword.” So each man strapped on his sword, and David also strapped on his sword. About four hundred men went up after David, while two hundred stayed with the supplies.
translation:
  language: sw
  text: Ndipo Daudi akawaambia watu wake, “Kila mtu afunge upanga wake.” Basi kila mtu akafunga upanga wake, na Daudi pia akafunga upanga wake. Watu wapatao mia nne wakapanda wakimfuata Daudi, huku mia mbili wakibaki na mizigo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakibaki karibu na vifaa.”
    reason: Neno la Kiebrania linaweza kumaanisha mizigo, vyombo, au vifaa, na kihusishi kinaweza kueleweka kuwa walibaki pamoja navyo au karibu navyo.
lexical_decisions:
- source_word: חִגְרוּ / וַיַּחְגְּרוּ / וַיַּחְגֹּר
  choice: ajifungie / akajifungia ... kiunoni
  rationale: Kitenzi חגר katika muktadha wa kijeshi humaanisha kufunga au kujifunga silaha kiunoni. Kiswahili hiki kinaonyesha tendo halisi kwa lugha ya kawaida na yenye hadhi.
- source_word: אִישׁ ... אֶת־חַרְבּוֹ
  choice: kila mmoja ... upanga wake
  rationale: 'Muundo huu ni wa mgawanyo: kila mtu alitakiwa kufunga upanga wake mwenyewe. ‘Kila mmoja’ ni ya asili katika Kiswahili bila kupoteza maana hiyo.'
- source_word: חַרְבּוֹ
  choice: upanga wake
  rationale: חֶרֶב ni upanga hasa, si silaha kwa ujumla; kwa hiyo neno mahususi limedumishwa katika marudio yote.
- source_word: גַּם
  choice: pia
  rationale: Neno hili linasisitiza kwamba Daudi mwenyewe alishiriki katika kujitayarisha kwa vita.
- source_word: וַיַּעֲלוּ אַחֲרֵי דָוִד
  choice: wakapanda wakimfuata Daudi
  rationale: Tafsiri hii inadumisha maana ya kuelekea juu katika עלה na pia maana ya kufuata iliyo katika אַחֲרֵי.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: watu wapatao mia nne
  rationale: Kiambishi כ־ hapa huonyesha makadirio; ‘wapatao’ ni njia ya kawaida ya Kiswahili ya kuwasilisha idadi isiyo kamili.
- source_word: יָשְׁבוּ
  choice: wakibaki
  rationale: Ingawa maana ya msingi inaweza kuwa ‘walikaa,’ katika simulizi hii maana ni kubaki nyuma badala ya kwenda pamoja na Daudi.
- source_word: עַל־הַכֵּלִים
  choice: na mizigo
  rationale: כֵּלִים ni neno pana linaloweza kumaanisha vyombo, vifaa, au mizigo. Katika safari hii ya kundi la kijeshi, ‘mizigo’ inaeleza kwa kawaida vitu vilivyoachwa chini ya uangalizi wao; uwezekano wa ‘vifaa’ umehifadhiwa katika tanbihi.
- source_word: לַאֲנָשָׁיו
  choice: watu wake
  rationale: Katika muktadha huu ni kundi la wanaume waliokuwa pamoja na Daudi. ‘Watu wake’ ni pana kama Kiebrania na haisisitizi bila ulazima cheo rasmi cha kijeshi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi ya maandiko. Marudio ya kujifungia upanga yamedumishwa kwa sababu ni sehemu dhahiri ya muundo wa Kiebrania. Alama ya tanbihi [a] imewekwa baada ya ‘mizigo,’ ambako tofauti ya kimsamiati inahusika.
