  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi umehifadhi mfuatano wa vitendo vya Abigail na urudiaji wa wazo la kufuata, bila kuongeza maelezo ya kimadhehebu.
