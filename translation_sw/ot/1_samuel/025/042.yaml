base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/042.yaml
  text: Abigail quickly got up and rode on the donkey, with five of her young women going after her; she went after David's messengers and became his wife.
translation:
  language: sw
  text: Abigail akaharakisha, akainuka na kupanda punda; wasichana wake watano walikuwa wakimfuata. Akawafuata wajumbe wa Daudi, akawa mke wa Daudi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּמַהֵר וַתָּקָם
  choice: akafanya haraka, akasimama
  rationale: Inawakilisha vitendo vyote viwili—kuharakisha na kusimama—kwa Kiswahili cha kawaida bila kufanya kitenzi cha kwanza kuwa kielezi tu.
- source_word: נַעֲרֹתֶיהָ
  choice: wasichana wake
  rationale: Neno נערות linaweza kumaanisha wanawake vijana au wahudumu wa kike; “wasichana wake” huhifadhi upana huo bila kuongeza kwa uhakika kwamba walikuwa vijakazi.
- source_word: הַהֹלְכוֹת לְרַגְלָהּ
  choice: wakitembea nyuma yake
  rationale: Kirai hiki humaanisha kuandamana kwa miguu katika nafasi ya wafuasi; tafsiri hii ni ya asili na inaeleweka kwa urahisi.
- source_word: וַתֵּלֶךְ אַחֲרֵי מַלְאֲכֵי דָוִד
  choice: Akawafuata wajumbe wa Daudi
  rationale: “Wajumbe” linafaa kwa מַלְאָכִים katika muktadha wa wajumbe wa kibinadamu, na “akawafuata” huhifadhi mwendo wa kufuata.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: akawa mke wake
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kauli ya Kiebrania ya kuwa mke wa mtu.
