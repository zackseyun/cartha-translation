base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/022.yaml
  text: May God do so to David’s enemies[a], and more also[b], if by morning I leave so much as one male of all who belong to him.
translation:
  language: sw
  text: Mungu awatendee maadui wa Daudi[a] hivi, na hata zaidi, kama kufikia asubuhi nitamwacha hata mwanamume mmoja[b] miongoni mwa wote walio wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya wafasiri huelewa “maadui wa Daudi” kuwa usemi wa kuficha laana dhidi ya “Daudi” au “mimi,” kwa sababu kwa kawaida kiapo cha namna hii humletea laana msemaji mwenyewe.
    reason: textual_variant
  - marker: b
    text: 'Kwa Kiebrania: “anayekojoa ukutani,” nahau kali na ya dharau inayomaanisha “mwanamume.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה ... וְכֹה יֹסִיף
  choice: na awatendee ... hivi, na hata zaidi
  rationale: Hii ni fomula ya kawaida ya Kiebrania ya kiapo chenye laana. Tafsiri hii inadumisha nguvu ya kiapo kwa Kiswahili cha kawaida bila kurudia maneno kwa namna isiyo ya asili.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la nomino ni la wingi kisarufi, kitenzi ni cha umoja na maana hapa ni Mungu mmoja katika fomula ya kiapo.
- source_word: לְאֹיְבֵי דָוִד
  choice: maadui wa Daudi
  rationale: Maandishi ya Kimasoreti yanasema ‘maadui wa Daudi.’ Usomaji huo mgumu umehifadhiwa badala ya kusahihishwa kimya kimya kuwa ‘Daudi’ au ‘mimi.’
- source_word: אִם
  choice: ikiwa
  rationale: Katika kiapo, אִם huanzisha sharti linalohusishwa na laana iliyotangulia. ‘Ikiwa’ inadumisha muundo na mvutano huo.
- source_word: אַשְׁאִיר
  choice: nitamwacha
  rationale: Hifili ya שׁאר ina maana ya kuacha au kubakiza. ‘Nitamwacha’ ni ya moja kwa moja na haiongezi wazi wazo la ‘kuokoa uhai,’ ingawa hilo linaeleweka katika muktadha.
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: kati ya wote walio wake
  rationale: Kirai kinaonyesha wale walio mali au chini ya mamlaka yake; muktadha na nahau inayofuata zinaelekeza kwa watu.
- source_word: עַד הַבֹּקֶר
  choice: kufikia asubuhi
  rationale: Hii inaonyesha kikomo cha wakati kwa Kiswahili cha sasa na cha asili.
- source_word: מַשְׁתִּין בְּקִיר
  choice: hata mwanamume mmoja
  rationale: Nahau hii ya Kiebrania, ambayo kwa maneno halisi humaanisha ‘anayekojoa ukutani,’ inawarejelea wanaume kwa dharau. Maana yake imetolewa wazi katika matini, na usemi halisi umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maneno ya Kimasoreti ‘maadui wa Daudi’ katika fomula ya kiapo
  choice: Kudumisha ‘maadui wa Daudi’ katika matini kuu
  alternative: Kusoma ‘Daudi’ au ‘mimi,’ kwa kuelewa ‘maadui wa Daudi’ kuwa badiliko la kunakili lenye lengo la kuepuka laana dhidi ya Daudi mwenyewe
  rationale: Ushahidi wa chanzo uliotolewa unasoma ‘maadui wa Daudi.’ Kwa kuwa usomaji huo ni mgumu lakini halisi, umehifadhiwa katika matini, huku uwezekano mwingine ukielezwa katika tanbihi badala ya kuamuliwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima lakini wa sasa na unaoeleweka kwa urahisi. Muundo wa kiapo na ugumu wa ‘maadui wa Daudi’ vimehifadhiwa, huku ukali wa nahau ya mwisho ukielezwa wazi katika tanbihi.
