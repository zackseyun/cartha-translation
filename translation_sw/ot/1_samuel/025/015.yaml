  text: וְ/הָ֣/אֲנָשִׁ֔ים טֹבִ֥ים לָ֖/נוּ מְאֹ֑ד וְ/לֹ֤א הָכְלַ֨מְנוּ֙ וְ/לֹֽא פָקַ֣דְנוּ מְא֔וּמָה כָּל יְמֵי֙ הִתְהַלַּ֣כְנוּ אִתָּ֔/ם בִּֽ/הְיוֹתֵ֖/נוּ בַּ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/015.yaml
  text: Yet the men were very good to us[a], and we were not mistreated[b], nor did we miss anything all the days we went about with them while we were in the field.
translation:
  language: sw
  text: Lakini watu hao walitutendea mema sana, wala hatukuaibishwa[a], wala hatukupungukiwa na chochote[b] siku zote tulizotembea pamoja nao tulipokuwa mashambani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatukufedheheshwa” au “hatukutukanwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wala hakuna chochote chetu kilichopotea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Lakini watu hao
  rationale: וְ inaunganisha kauli hii na muktadha na hapa inaonyesha utofautishaji na mtazamo mkali wa Nabali; אֲנָשִׁים ni 'watu' au 'wanaume,' na 'watu hao' ni Kiswahili cha kawaida katika rejeo hili.
- source_word: טֹבִים לָנוּ מְאֹד
  choice: walitutendea mema sana
  rationale: Kirai טוֹבִים לָנוּ kinaeleza mwenendo wenye manufaa kwao. 'Walitutendea mema sana' ni cha asili na kinaweka wazi kwamba wema huo ulionekana katika matendo.
- source_word: הָכְלַמְנוּ
  choice: hatukuaibishwa
  rationale: Hofali ya כלם ni ya kutendwa na kwa msingi humaanisha kuaibishwa, kufedheheshwa, au kutendewa kwa namna ya kuleta aibu. Tafsiri hii inadumisha maana ya moja kwa moja bila kuipanua kimyakimya kuwa kila aina ya dhuluma.
- source_word: פָקַדְנוּ מְאוּמָה
  choice: hatukupungukiwa na chochote
  rationale: Katika muktadha huu, פקד pamoja na ukanushi na מְאוּמָה huonyesha kwamba hakuna kitu kilichokosekana au kupotea. Kiswahili hiki ni cha kawaida huku tanbihi ikihifadhi uwezekano wa maana ya kitu kupotea.
- source_word: כָּל יְמֵי
  choice: siku zote
  rationale: Hiki ni kirai cha muda kinachoonyesha kipindi chote kinachotajwa.
- source_word: הִתְהַלַּכְנוּ אִתָּם
  choice: tulizotembea pamoja nao
  rationale: Hitpaeli ya הלך inadokeza mwendo au ushirika ulioendelea. 'Kutembea pamoja nao' huhifadhi taswira hiyo kuliko kusema tu 'tulikuwa pamoja nao.'
- source_word: בִּהְיוֹתֵנוּ בַּשָּׂדֶה
  choice: tulipokuwa mashambani
  rationale: שָׂדֶה hapa ni eneo la wazi la malisho, si lazima shamba moja la kilimo. 'Mashambani' ni usemi wa kawaida wa Kiswahili unaofaa mazingira hayo.
