base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/023.yaml
  text: When Abigail saw David[a], she hurried and got down from the donkey, and fell before David on her face and bowed to the ground.
translation:
  language: sw
  text: Abigaili alipomwona Daudi, akaharakisha kushuka kutoka juu ya punda, akaanguka kifudifudi mbele ya Daudi, akainama mpaka nchi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akasujudu mpaka nchi.” Kitenzi cha Kiebrania kinaweza kumaanisha kuinama sana au kujilaza kifudifudi; hapa kinaeleza tendo la Abigaili la heshima mbele ya Daudi, si lazima ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: alipomwona
  rationale: Kitenzi ראה hapa kina maana ya kawaida ya kuona; muundo wa “alipomwona” unaunganisha kwa asili tendo hili na matendo yanayofuata.
- source_word: וַתְּמַהֵר
  choice: alifanya haraka
  rationale: מהר huonyesha kutenda kwa haraka. Usemi huu ni wa kawaida katika Kiswahili na unahifadhi kasi ya simulizi.
- source_word: וַתֵּרֶד מֵעַל הַחֲמוֹר
  choice: akashuka kutoka juu ya punda
  rationale: ירד ni kushuka, na מֵעַל inaonyesha kutoka juu ya mnyama aliyekuwa amempanda. Tafsiri hii inafuata picha halisi ya Kiebrania bila kutumia neno la kiufundi lisilo la lazima.
- source_word: וַתִּפֹּל לְאַפֵּי דָוִד עַל־פָּנֶיהָ
  choice: akaanguka kifudifudi mbele ya Daudi
  rationale: “Mbele ya Daudi” huhifadhi maana ya לְאַפֵּי bila kuongeza “miguuni,” ambayo haipo katika Kiebrania; “kifudifudi” huwasilisha עַל־פָּנֶיהָ kwa Kiswahili cha asili.
- source_word: וַתִּשְׁתַּחוּ אָרֶץ
  choice: akainama mpaka chini
  rationale: שׁחה inaweza kueleza kuinama sana au kujilaza kifudifudi kwa heshima. Hapa “akainama mpaka chini” inaonyesha ishara hiyo bila kudokeza moja kwa moja ibada kwa Mungu.
theological_decisions:
- issue: Maana ya שׁחה katika tendo linaloelekezwa kwa mwanadamu
  choice: akainama mpaka chini
  alternative: akajilaza kifudifudi mpaka chini; akamsujudia
  rationale: Katika mkutano huu na Daudi, tendo hilo ni la unyenyekevu na heshima mbele ya mwanadamu, si lazima ibada ya kidini. “Akainama mpaka chini” huhifadhi mkao wa heshima bila kuingiza maana ya ibada isiyolazimishwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtiririko wa vitenzi unadumisha kasi ya simulizi, huku “kifudifudi” na “mpaka chini” zikihifadhi maelezo ya mkao wa mwili katika Kiebrania.
