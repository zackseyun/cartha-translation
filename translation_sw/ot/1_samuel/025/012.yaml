base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/012.yaml
  text: So David’s young men turned back on their way[a], and they returned and came and told him all these words.
translation:
  language: sw
  text: Basi vijana wa Daudi wakageuka wakashika njia ya kurudi. Wakarudi wakaja, wakamweleza maneno hayo yote[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo hayo yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַפְכוּ
  choice: wakageuka
  rationale: Kitenzi הפך hapa kinaonyesha kubadili mwelekeo, si kupindua kitu. “Wakageuka” ni Kiswahili cha kawaida na kinafaa katika muktadha wa safari.
- source_word: נַעֲרֵי דָוִד
  choice: vijana wa Daudi
  rationale: נַעַר inaweza kumaanisha kijana, mhudumu, au mtumishi. “Vijana wa Daudi” huhifadhi maana ya msingi bila kuamua kwamba walikuwa watumishi kwa hadhi.
- source_word: לְדַרְכָּם
  choice: na kushika njia ya kurudi
  rationale: Kirai hiki kinaonyesha kwamba walibadili mwelekeo na kuanza safari ya kurudi. Tafsiri hii ni ya asili katika Kiswahili na inaweka wazi muktadha wa mwendo.
- source_word: וַיָּשֻׁבוּ
  choice: Wakarudi
  rationale: Neno hili linataja kurudi moja kwa moja. Limedumishwa ili kuhifadhi mfuatano wa masimulizi ya Kiebrania, hata baada ya kutajwa kwa kugeuka.
- source_word: וַיָּבֹאוּ
  choice: wakafika
  rationale: Ingawa maana ya msingi ni “wakaja,” katika muktadha wa kukamilisha safari “wakafika” ni Kiswahili cha kawaida na huonyesha hatua inayofuata katika mfuatano.
- source_word: וַיַּגִּדוּ לוֹ
  choice: na kumweleza
  rationale: נגד hapa ni kutoa taarifa au kueleza. “Kumweleza” ni usemi wa kawaida unaofaa kwa kuwasilisha jibu la Nabali kwa Daudi.
- source_word: כְּכֹל הַדְּבָרִים הָאֵלֶּה
  choice: maneno hayo yote
  rationale: דְּבָרִים inaweza kumaanisha maneno au mambo. “Maneno” yamechaguliwa kwa sababu vijana wanaripoti jibu lililosemwa na Nabali, huku uwezekano wa “mambo” ukihifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa vitenzi vya mwendo umehifadhiwa kwa kadiri inayosomeka kiasili; tanbihi imewekwa kwenye “maneno hayo yote,” ambako utata wa דְּבָרִים unatokea.
