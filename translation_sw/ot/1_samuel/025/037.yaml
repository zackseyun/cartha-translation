  text: וַ/יְהִ֣י בַ/בֹּ֗קֶר בְּ/צֵ֤את הַ/יַּ֨יִן֙ מִ/נָּבָ֔ל וַ/תַּגֶּד ל֣/וֹ אִשְׁתּ֔/וֹ אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יָּ֤מָת לִבּ/וֹ֙ בְּ/קִרְבּ֔/וֹ וְ/ה֖וּא הָיָ֥ה לְ/אָֽבֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/037.yaml
  text: And in the morning[a], when the wine had gone out of Nabal, his wife told him these things, and his heart died within him[b], and he became like a stone.
translation:
  language: sw
  text: Asubuhi, divai ilipomtoka Nabali[a], mke wake alimweleza mambo hayo. Ndipo moyo wake ukafa ndani yake[b], naye akawa kama jiwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tafsiri ya neno kwa neno ni “divai ilipomtoka Nabali,” yaani, alipokuwa ametokwa na ulevi au athari za divai zilipokuwa zimekwisha.
    reason: lexical_alternative
  - marker: b
    text: Au “moyo wake ukazimia ndani yake.” Kiebrania kinatumia taswira yenye nguvu, wala hakitoi maelezo mahsusi ya kitabibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַבֹּקֶר
  choice: Asubuhi
  rationale: Ni usemi wa kawaida na wa moja kwa moja wa wakati katika Kiswahili.
- source_word: בְּצֵאת הַיַּיִן מִנָּבָל
  choice: divai ilipomtoka Nabali
  rationale: Huhifadhi taswira halisi ya Kiebrania kwamba divai ‘ilitoka’ kwake, huku tanbihi ikifafanua kuwa ulevi au athari za divai zilikuwa zimekwisha.
- source_word: וַתַּגֶּד לוֹ אִשְׁתּוֹ
  choice: mke wake alimweleza
  rationale: Kitenzi נגד katika Hifili kina maana ya kumwambia, kumjulisha, au kumweleza mtu; ‘alimweleza’ ni cha kawaida na kinafaa kwa kusimulia mambo yaliyotokea.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: mambo hayo
  rationale: דברים inaweza kumaanisha maneno au mambo; hapa inahusu matukio ambayo Abigaili alimweleza Nabali.
- source_word: וַיָּמָת לִבּוֹ בְּקִרְבּוֹ
  choice: moyo wake ukafa ndani yake
  rationale: Huhifadhi taswira yenye nguvu ya Kiebrania bila kuigeuza kuwa utambuzi mahsusi wa kitabibu.
- source_word: וְהוּא הָיָה לְאָבֶן
  choice: naye akawa kama jiwe
  rationale: Hutoa kwa Kiswahili cha kawaida tashbihi ya Kiebrania bila kufafanua hali yake kupita ilivyoandikwa.
theological_decisions:
- issue: Iwapo hali ya Nabali ifafanuliwe kitabibu au taswira ya simulizi ihifadhiwe
  choice: 'Kuhifadhi taswira ya Kiebrania: ‘moyo wake ukafa ndani yake, naye akawa kama jiwe’'
  alternative: Alipatwa na mshtuko wa moyo; alipata kiharusi na kupooza; moyo wake ulizimia
  rationale: Andiko halitoi utambuzi wa kitabibu. Linatumia lugha ya picha kueleza hali ya Nabali, kwa hiyo tafsiri haipaswi kudai ugonjwa mahsusi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa simulizi la Biblia lakini unabaki wazi kwa msomaji wa kawaida. Jina ‘Nabali’ limetumiwa kwa kufuata umbo lililozoeleka katika mapokeo ya Biblia za Kiswahili.
