base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/035.yaml
  text: So David took from her hand what she had brought him[a], and he said to her, “Go up in peace to your house. See, I have listened to your voice and accepted you.”
translation:
  language: sw
  text: Basi Daudi akapokea kutoka mkononi mwake kile alichomletea, akamwambia, “Rudi nyumbani kwako kwa amani. Tazama, nimeisikiliza sauti yako, nami nimekukubali[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nimekuonyesha kibali” au “nimekubali ombi lako”; Kiebrania kihalisi, “nimeuinua uso wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akapokea
  rationale: Ingawa kitenzi hiki kimsingi humaanisha ‘alichukua,’ katika muktadha huu Daudi anapokea kile Abigaili alichomletea; ‘akapokea’ ni Kiswahili cha kawaida kinachoeleza tendo hilo bila kubadili maana.
- source_word: מִיָּדָהּ
  choice: kutoka mkononi mwake
  rationale: Huhifadhi taswira halisi ya Kiebrania kwamba Daudi alipokea vitu hivyo moja kwa moja kutoka kwa Abigaili.
- source_word: אֵת אֲשֶׁר הֵבִיאָה לוֹ
  choice: kile alichokuwa amemletea
  rationale: Hutoa kwa ufasaha kishazi cha Kiebrania na kuonyesha kwamba Abigaili alikuwa amemletea Daudi zawadi au mahitaji hayo.
- source_word: עֲלִי לְשָׁלוֹם לְבֵיתֵךְ
  choice: Rudi nyumbani kwako kwa amani
  rationale: עֲלִי kihalisi ni ‘panda,’ lakini hapa ni agizo la kuondoka na kwenda nyumbani. ‘Rudi’ ni Kiswahili cha asili kinachowasilisha mwendo unaokusudiwa, huku ‘kwa amani’ ikihifadhi baraka ya usalama na hali ya amani.
- source_word: רְאִי
  choice: Tazama
  rationale: Ni neno la kumtaka msikilizaji atilie maanani jambo linalofuata; ‘Tazama’ ni la heshima na linaeleweka katika Kiswahili cha sasa.
- source_word: שָׁמַעְתִּי בְקוֹלֵךְ
  choice: nimeisikiliza sauti yako
  rationale: Huhifadhi tamathali ya Kiebrania ya ‘kuisikiliza sauti,’ ambayo katika muktadha inamaanisha kwamba Daudi ametii au amezingatia ombi la Abigaili.
- source_word: וָאֶשָּׂא פָּנָיִךְ
  choice: nimekukubali
  rationale: Nahau hii, kihalisi ‘nimeuinua uso wako,’ huonyesha kumpokea mtu kwa kibali au kukubali ombi lake. ‘Nimekukubali’ ni ya asili na huhifadhi mwelekeo wake kwa mtu bila kuifunga maana kwenye ombi peke yake.
theological_decisions:
- issue: Maana ya nahau וָאֶשָּׂא פָּנָיִךְ
  choice: nimekukubali
  alternative: nimekuonyesha kibali; nimekubali ombi lako; nimeuinua uso wako
  rationale: Nahau inaweza kueleza kukubaliwa kwa mtu, kuonyeshwa kibali, au kukubaliwa kwa ombi lake. Tafsiri kuu inaacha upana huo kwa kiwango kinachoeleweka, na tanbihi inaonyesha taswira halisi pamoja na maana mbadala bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi unabaki karibu na Kiebrania, lakini ‘Rudi nyumbani’ na ‘akapokea’ zimetumiwa kwa uasilia wa Kiswahili.
