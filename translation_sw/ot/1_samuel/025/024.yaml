  yaml_path: translation/ot/1_samuel/025/024.yaml
  text: She fell at his feet and said[a], “On me, my lord, be the guilt. Please let your servant speak in your hearing[b], and hear the words of your servant.”
translation:
  language: sw
  text: Akaanguka miguuni pake, akasema[a], “Bwana wangu, hatia na iwe juu yangu. Tafadhali, niruhusu mimi, mjakazi wako, niseme masikioni mwako, nawe uyasikilize maneno ya mjakazi wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “akasema, ‘Bwana wangu, hatia ni yangu.’” Kiebrania kina usemi mfupi wa kujitwika hatia: kihalisi, “Juu yangu, bwana wangu, hatia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל עַל רַגְלָיו
  choice: Akaanguka miguuni pake
  rationale: Hii ni tafsiri ya kawaida na ya asili ya ishara ya kuomba kwa unyenyekevu au kujitiisha, bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: בִּי אֲנִי אֲדֹנִי הֶעָוֹן
  choice: Bwana wangu, lawama na iwe juu yangu
  rationale: Inahifadhi muundo mfupi wa Kiebrania wa kujitwika kosa na nguvu ya kihusishi ‘juu yangu’; ‘lawama’ inafaa kwa mazingira ya simulizi na haiongezi maana nzito ya kidini isiyolazimishwa hapa.
- source_word: אֲדֹנִי
  choice: Bwana wangu
  rationale: Ni namna ya heshima kwa Daudi katika uhusiano wa kijamii, wala haimaanishi jina la Mungu hapa.
- source_word: וּתְדַבֶּר נָא
  choice: Tafadhali, ... na aseme
  rationale: ‘Tafadhali’ pamoja na muundo wa ombi ‘na aseme’ huwasilisha ombi la heshima linaloonyeshwa na נָא.
- source_word: אֲמָתְךָ / אֲמָתֶךָ
  choice: mjakazi wako
  rationale: אמה ni neno la jinsia ya kike kwa mtumishi; ‘mjakazi wako’ ni la heshima, linaeleweka katika Kiswahili sanifu, na linadumisha kujishusha kwa Abigaili pamoja na urudiaji wa Kiebrania.
- source_word: בְּאָזְנֶיךָ
  choice: nawe
  rationale: Katika ombi la Kiswahili ‘na aseme nawe,’ maana ya nahau ya Kiebrania ‘masikioni mwako’ huwasilishwa kwa kawaida bila tafsiri ngumu ya neno kwa neno.
- source_word: וּשְׁמַע אֵת דִּבְרֵי
  choice: uyasikilize maneno ya
  rationale: ‘Sikiliza’ hapa huonyesha zaidi ombi la kuzingatia maneno, huku ‘maneno ya’ kikihifadhi muundo wa chanzo.
