base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/002.yaml
  text: There was a man in Maon whose business was in Carmel[a]. The man was very wealthy, and he had three thousand sheep and a thousand goats[b]. He was shearing his sheep in Carmel.
translation:
  language: sw
  text: Kulikuwa na mtu huko Maoni ambaye shughuli zake zilikuwa huko Karmeli[a]. Mtu huyo alikuwa tajiri sana[b], naye alikuwa na kondoo elfu tatu na mbuzi elfu moja. Wakati huo alikuwa akiwanyoa kondoo wake huko Karmeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye kazi yake ilikuwa huko Karmeli,” au “ambaye mali zake zilikuwa huko Karmeli.” Neno la Kiebrania linaweza kumaanisha kazi, shughuli, mambo, au mali ya mtu.
    reason: lexical_alternative
  - marker: b
    text: Au, “Mtu huyo alikuwa mkubwa sana,” yaani, alikuwa mwenye mali nyingi au mwenye hadhi kubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: mtu
  rationale: Utangulizi wa kawaida wa kisimulizi; “mtu” huhifadhi hali ya kutotajwa wazi ni nani bila kuongeza maana.
- source_word: בְּמָעוֹן
  choice: huko Maoni
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili; kihusishi kinaonyesha mahali alikokaa mtu huyo.
- source_word: מַעֲשֵׂהוּ
  choice: shughuli zake
  rationale: Neno linaweza kumaanisha kazi, shughuli, mambo, mali, au shughuli za uzalishaji. “Shughuli zake” ni pana na ya asili, na haiamui kimya kimya kuwa ni biashara pekee au mali pekee.
- source_word: בַכַּרְמֶל
  choice: Karmeli
  rationale: Hapa ni jina la mahali, si nomino ya kawaida yenye maana ya shamba la miti au eneo lenye rutuba.
- source_word: הָאִישׁ גָּדוֹל מְאֹד
  choice: Mtu huyo alikuwa tajiri sana
  rationale: Katika muktadha wa idadi kubwa ya mifugo, usemi wa Kiebrania “mkubwa sana” unaonyesha hasa utajiri na hadhi ya kiuchumi; tanbihi huhifadhi maana pana inayowezekana.
- source_word: וְלוֹ צֹאן שְׁלֹשֶׁת אֲלָפִים וְאֶלֶף עִזִּים
  choice: naye alikuwa na kondoo elfu tatu na mbuzi elfu moja
  rationale: Muundo wa umilikaji umetafsiriwa kwa Kiswahili cha kawaida, huku hesabu na aina za mifugo zikihifadhiwa.
- source_word: וַיְהִי בִּגְזֹז אֶת צֹאנוֹ
  choice: Wakati huo alikuwa akiwanyoa kondoo wake
  rationale: Muundo unaweka hali au tukio lililokuwa likiendelea. “Alikuwa akiwanyoa” huwasilisha hali hiyo kwa Kiswahili cha asili; “wakati huo” huunganisha mazingira bila kudai neno maalumu la wakati lisilokuwamo.
