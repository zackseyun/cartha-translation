  yaml_path: translation/ot/1_samuel/025/019.yaml
  text: She said to her young men[a], “Go on ahead of me. Look, I am coming behind you.” But she did not tell her husband Nabal.
translation:
  language: sw
  text: Akawaambia vijana wake, “Nendeni mbele yangu. Tazama, ninakuja nyuma yenu.” Lakini hakumwambia Nabali, mume wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Akawaambia
  rationale: Wayyiqtol inaendeleza mfululizo wa masimulizi; “aka-” ni njia ya kawaida ya Kiswahili ya kuonyesha tendo linalofuata. Kitenzi “-ambia” kinahitaji mtendewa na kinafaa kwa kauli hii.
- source_word: לִנְעָרֶיהָ
  choice: vijana wake
  rationale: נַעַר inaweza kumaanisha kijana, mtumishi, au mhudumu. “Vijana wake” huhifadhi maana ya msingi bila kuficha kwamba katika muktadha hawa ni watu wa nyumba yake waliobeba mahitaji.
- source_word: עִבְרוּ לְפָנַי
  choice: Tangulieni mbele yangu
  rationale: Katika muktadha wa mwendo, עבר pamoja na לְפָנַי inaagiza waende kwanza mbele yake. “Tangulieni mbele yangu” ni ya kawaida na inaweka wazi uhusiano wa mahali.
- source_word: הִנְנִי
  choice: Tazama
  rationale: Chembe hii ya kuashiria huvuta fikira kwenye kitendo cha msemaji. “Tazama” ni ya heshima na inayotambulika katika Kiswahili cha Biblia bila kubadili kuwa taarifa ya mahali pekee.
- source_word: אַחֲרֵיכֶם בָּאָה
  choice: ninakuja nyuma yenu
  rationale: Muundo unaonyesha Abigaili akiwa anakuja akiwafuata. “Nyuma yenu” huhifadhi maana ya kieneo ya אַחֲרֵי, huku wakati uliopo ukiakisi usemi wa moja kwa moja wa kitendo kilicho karibu.
- source_word: וּלְאִישָׁהּ נָבָל
  choice: Lakini hakumwambia Nabali, mume wake
  rationale: אִישָׁהּ humaanisha mume wake hapa. “Lakini” huonyesha tofauti kati ya kuwaambia vijana na kutomwambia Nabali; mpangilio wa Kiswahili humtaja Nabali kisha kufafanua uhusiano wake.
- source_word: לֹא הִגִּידָה
  choice: hakumwambia
  rationale: Hiphil ya נגד hapa ni kutoa taarifa au kumweleza mtu. “Hakumwambia” ni ya kawaida katika simulizi la kifamilia na hujumuisha mtendewa aliyeelezwa katika kishazi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri inafuata muundo wa simulizi kwa “aka-”, inatumia kauli ya moja kwa moja iliyo ya kawaida, na haiongezi ufafanuzi wa kimadhehebu. Hakuna tanbihi iliyohitajika; tanbihi ya Kiingereza iliyotolewa inaonekana kutolingana na alama yake na pia hurudia tofauti iliyo ndogo ambayo Kiswahili kinaweza kuiwakilisha moja kwa moja.
