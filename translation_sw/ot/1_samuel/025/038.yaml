  text: וַ/יְהִ֖י כַּ/עֲשֶׂ֣רֶת הַ/יָּמִ֑ים וַ/יִּגֹּ֧ף יְהוָ֛ה אֶת נָבָ֖ל וַ/יָּמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/038.yaml
  text: And about ten days later[a], Yahweh struck Nabal, and he died.
translation:
  language: sw
  text: Baada ya siku kama kumi[a], Yahweh akampiga Nabali, naye akafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya takriban siku kumi.” Usemi wa Kiebrania unaonyesha kipindi kinachokadiriwa kuwa siku kumi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Baada ya ...
  rationale: Katika mfululizo huu wa simulizi, kitenzi hiki kinatanguliza tukio linalofuata. Kiswahili cha asili kinaweza kuonyesha mpito huo kwa kishazi cha wakati bila tafsiri ngumu ya neno kwa neno kama ‘ikawa.’
- source_word: כַּעֲשֶׂרֶת הַיָּמִים
  choice: siku kama kumi
  rationale: Kiambishi כְּ־ kinaonyesha ukadiriaji. ‘Siku kama kumi’ ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya kipindi kinachokadiriwa kuwa siku kumi.
- source_word: וַיִּגֹּף
  choice: akampiga
  rationale: Kitenzi נָגַף huonyesha kupiga au kuleta pigo, hasa katika tendo la Mungu. ‘Akampiga’ huhifadhi nguvu na uwazi wa Kiebrania bila kubainisha ugonjwa au njia nyingine ambayo maandishi hayataji.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: אֶת נָבָל
  choice: Nabali
  rationale: אֶת ni alama ya yambwa tendwa na haitafsiriwi moja kwa moja. ‘Nabali’ ni umbo la jina linalosikika kwa urahisi katika Kiswahili na linafuata matumizi yaliyozoeleka ya majina ya Biblia.
- source_word: וַיָּמֹת
  choice: naye akafa
  rationale: Kitenzi hiki kinasimulia tukio linalofuata kwa urahisi. ‘Naye akafa’ huhifadhi mfuatano wa matendo bila kuunganisha vitenzi kuwa kauli yenye ufafanuzi zaidi kama ‘akampiga hadi akafa.’
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi la Mungu. ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Kiwango cha uhusiano wa kisababishi kati ya pigo la Mungu na kifo cha Nabali
  choice: Yahweh akampiga Nabali, naye akafa
  alternative: Yahweh akampiga Nabali akafa
  rationale: 'Kiebrania kina vitenzi viwili vinavyofuatana: Yahweh alimpiga Nabali, kisha Nabali akafa. Tafsiri hii inathibitisha wazi tendo la hukumu ya Mungu lakini haibadili mfuatano huo kuwa usemi uliofafanuliwa zaidi kama ‘akampiga hadi akafa’ au ‘akamuua.’'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya kisimulizi; ‘naye’ hutenganisha kwa kawaida pigo na kifo huku ikihifadhi mfuatano wa Kiebrania.
