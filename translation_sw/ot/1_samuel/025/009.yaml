  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeundwa kwa mtiririko wa kawaida wa simulizi, huku “wakatulia” ikihifadhi utata halisi wa kitenzi cha mwisho.
