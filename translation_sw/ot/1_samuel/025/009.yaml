base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/009.yaml
  text: When David’s young men came[a], they spoke to Nabal all these words in David’s name, and then they rested.
translation:
  language: sw
  text: Vijana wa Daudi walipofika, walimwambia Nabali maneno haya yote kwa jina la Daudi, kisha wakatulia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakapumzika,” “wakanyamaza,” au “wakasubiri.” Kitenzi cha Kiebrania kinaweza kumaanisha kupumzika au kutulia; hapa huenda maana yake ni kwamba walimaliza kusema na kusubiri jibu la Nabali.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי
  choice: Vijana
  rationale: Neno נַעַר linaweza kumaanisha kijana, mtumishi, au msaidizi. Hapa linawataja wajumbe wa Daudi; “vijana” linahifadhi maana ya msingi bila kudokeza kuwa walikuwa watoto.
- source_word: וַיָּבֹאוּ
  choice: walipofika
  rationale: Ingawa muundo wa Kiebrania ni wa mfululizo, “walipofika” ni Kiswahili cha kawaida kinachounganisha kuwasili kwao na kusema kwao bila kubadili mpangilio wa matukio.
- source_word: וַיְדַבְּרוּ אֶל
  choice: walimwambia
  rationale: Kitenzi דבר pamoja na אֶל humaanisha kusema na mtu au kumwambia. “Walimwambia” ni fasaha na huonyesha kwamba ujumbe ulielekezwa kwa Nabali.
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: maneno haya yote
  rationale: Tafsiri hii inadumisha upekee wa דְּבָרִים kama “maneno” na wazo kwamba walifikisha ujumbe wote waliopewa.
- source_word: בְּשֵׁם דָּוִד
  choice: kwa jina la Daudi
  rationale: Kirai hiki kinaonyesha uwakilishi au mamlaka ya Daudi. “Kwa jina la Daudi” kinahifadhi picha ya Kiebrania na kinaeleweka katika Kiswahili sanifu.
- source_word: וַיָּנוּחוּ
  choice: wakatulia
  rationale: נוח kwa kawaida humaanisha kupumzika au kutulia. Katika muktadha huu huenda walikoma kusema na kusubiri jibu; “wakatulia” huhifadhi kwa kiasi fulani maana zote mbili bila kuamua kupita kiasi.
theological_decisions: []
