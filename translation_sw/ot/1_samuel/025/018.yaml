  edition: WLC
  text: וַ/תְּמַהֵ֣ר אבוגיל וַ/תִּקַּח֩ מָאתַ֨יִם לֶ֜חֶם וּ/שְׁנַ֣יִם נִבְלֵי יַ֗יִן וְ/חָמֵ֨שׁ צֹ֤אן עשוות וְ/חָמֵ֤שׁ סְאִים֙ קָלִ֔י וּ/מֵאָ֥ה צִמֻּקִ֖ים וּ/מָאתַ֣יִם דְּבֵלִ֑ים וַ/תָּ֖שֶׂם עַל הַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/018.yaml
  text: Then Abigail hurried and took two hundred loaves of bread[a], two skins of wine, five sheep already prepared, five seahs of roasted grain, a hundred clusters of raisins, and two hundred cakes of figs, and put them on the donkeys.
translation:
  language: sw
  text: Ndipo Abigaili akafanya haraka, akachukua mikate mia mbili, viriba viwili vya divai, kondoo watano waliokuwa tayari wameandaliwa, sea tano[a] za nafaka iliyokaangwa, vishada mia vya zabibu kavu, na mikate mia mbili ya tini, kisha akaviweka juu ya punda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vipimo vitano vya nafaka iliyokaangwa”; sea ilikuwa kipimo cha kale cha vitu vikavu.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: Ndipo Abigaili akafanya haraka
  rationale: Kitenzi hiki kina maana ya kuharakisha. Usemi huu ni wa kawaida katika Kiswahili na unadumisha hali ya uharaka katika simulizi; “Ndipo” linaonyesha mfuatano wa matukio.
- source_word: וַתִּקַּח
  choice: akachukua
  rationale: לקח kwa kawaida humaanisha kuchukua; “akachukua” ni tafsiri ya moja kwa moja inayofaa kabla ya orodha ya vitu.
- source_word: מָאתַיִם לֶחֶם
  choice: mikate mia mbili
  rationale: Ingawa לֶחֶם ni “mkate,” katika muktadha wa kuhesabu inafaa kutumia wingi “mikate.”
- source_word: שְׁנַיִם נִבְלֵי יַיִן
  choice: viriba viwili vya divai
  rationale: נֵבֶל hapa ni chombo cha kale cha kuhifadhia kimiminika, kwa kawaida kiriba; tafsiri hii inaepuka picha ya chupa ya kisasa.
- source_word: חָמֵשׁ צֹאן עֲשׂוּיוֹת
  choice: kondoo watano waliokuwa tayari wameandaliwa
  rationale: Kirai hiki kinaonyesha kuwa kondoo walikuwa wamewekwa tayari kwa chakula, bila kulazimisha hatua mahususi ya mapishi ambayo Kiebrania hakitaji wazi.
- source_word: חָמֵשׁ סְאִים קָלִי
  choice: sea tano za nafaka iliyokaangwa
  rationale: סאה ni kipimo maalumu cha kale cha vitu vikavu, hivyo jina lake limedumishwa; קָלִי ni nafaka iliyokaangwa au kukaushwa kwa moto.
- source_word: מֵאָה צִמֻּקִים
  choice: vishada mia vya zabibu kavu
  rationale: צִמֻּקִים ni zabibu kavu, hapa zikiwa vitu vinavyohesabika, yaelekea vikiwa vimeshinikizwa au kuunganishwa katika vishada.
- source_word: מָאתַיִם דְּבֵלִים
  choice: mikate mia mbili ya tini
  rationale: דְּבֵלָה ni mkate au donge la tini zilizoshinikizwa; “mikate ya tini” inaeleweka na kuhifadhi umbo la chakula hicho.
- source_word: וַתָּשֶׂם עַל הַחֲמֹרִים
  choice: kisha akaviweka juu ya punda
  rationale: Kitenzi ni kuweka; tafsiri hii inabaki karibu na Kiebrania huku ikionyesha kuwa vyakula hivyo viliwekwa juu ya punda kwa usafiri.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa heshima, na wa kisasa. Namba zimeandikwa kwa maneno ili sentensi isomeke kwa urahisi. Alama ya tanbihi imewekwa baada ya “sea tano,” ambako maelezo ya kipimo yanahusika.
