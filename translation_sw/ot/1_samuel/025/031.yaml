base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/031.yaml
  text: 'And this will not be a cause of grief to you or a stumbling block of heart to my lord: either that you have shed blood without cause or that my lord has avenged himself[a]. And when Yahweh has dealt well with my lord[d][c][b], then remember your servant.'
translation:
  language: sw
  text: 'Jambo hili halitakuwa kwako sababu ya majuto[a] wala kikwazo moyoni kwa bwana wangu: kwa kumwaga damu bila sababu, au kwa bwana wangu kujilipizia kisasi[b]. Na Yahwe atakapomtendea mema bwana wangu, ndipo umkumbuke mjakazi wako.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sababu ya kukwazika” au “jambo la kuleta majuto.” Neno la Kiebrania ni adimu na huenda likamaanisha jambo linalosababisha majuto makali baadaye.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “bwana wangu kujiokoa mwenyewe.” Katika muktadha huu inamaanisha Daudi kujitafutia haki kwa nguvu, yaani kujilipizia kisasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפוּקָה
  choice: sababu ya kujuta
  rationale: Nomino hii adimu inaweza kuashiria kujikwaa, mshtuko, au jambo linalosababisha majuto makali baadaye. Katika muktadha huu Abigaili anamwonya Daudi kuhusu majuto ya baadaye kwa kumwaga damu bila haki.
- source_word: מִכְשׁוֹל לֵב
  choice: kikwazo moyoni
  rationale: Huhifadhi taswira halisi ya ‘kikwazo cha moyo’ kwa Kiswahili cha kawaida, huku ikidokeza dhamiri inayosumbuliwa.
- source_word: לַאדֹנִי / אֲדֹנִי
  choice: bwana wangu
  rationale: Ni namna ya heshima ambayo Abigaili anatumia kumwambia Daudi; hapa haimaanishi uungu.
- source_word: לִשְׁפָּךְ דָּם חִנָּם
  choice: umemwaga damu bila sababu
  rationale: חִנָּם hapa ni kutokuwa na sababu ya haki, si kufanya jambo bila malipo.
- source_word: לְהוֹשִׁיעַ ... לוֹ
  choice: bwana wangu amejilipizia kisasi
  rationale: Ingawa kitenzi kwa kawaida humaanisha kuokoa au kujiokoa, muktadha unahusu Daudi kujipatia haki kwa nguvu badala ya kungojea hukumu ya Mungu.
- source_word: וְהֵיטִב יְהוָה
  choice: Yahwe atakapomtendea mema
  rationale: Mfuatano huu unaelekea wakati ujao katika hotuba ya Abigaili; muundo wa ‘atakapo-’ unaonyesha wakati huo kwa Kiswahili cha asili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetolewa kama jina binafsi badala ya kubadilishwa na cheo ‘BWANA’.
- source_word: אֲמָתֶךָ
  choice: mjakazi wako
  rationale: Neno la Kiebrania ni la jinsia ya kike na ni namna ya Abigaili kujishusha kwa heshima; ‘mjakazi wako’ huhifadhi maana hizo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia tetragramatoni kama jina binafsi la Mungu; ‘Yahwe’ hulihifadhi badala ya kuweka cheo mahali pake.
- issue: Maana ya לְהוֹשִׁיעַ ... לוֹ katika muktadha wa kulipiza kisasi
  choice: amejilipizia kisasi
  alternative: amejiokoa mwenyewe
  rationale: Tafsiri iliyochaguliwa inaonyesha hali ya simulizi, lakini tanbihi huhifadhi maana ya kawaida ya kitenzi na mvutano uliomo katika usemi wa Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ‘kikwazo moyoni’ umehifadhi taswira ya Kiebrania bila kufanya sentensi kuwa ngumu; ‘mjakazi’ huhifadhi jinsia ya msemaji na unyenyekevu wa hotuba yake.
