base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/043.yaml
  text: David also took Ahinoam of Jezreel[b][a], and both of them became his wives.
translation:
  language: sw
  text: Daudi pia alimchukua Ahinoamu kutoka Yezreeli, nao wote wawili wakawa wake zake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָקַח
  choice: alimchukua
  rationale: Kitenzi hiki kimsingi humaanisha ‘alichukua.’ Katika muktadha huu kinahusu kumchukua mwanamke kuwa mke, na kishazi kinachofuata kinaweka wazi maana ya ndoa.
- source_word: אֲחִינֹעַם
  choice: Ahinoamu
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: מִיִּזְרְעֶאל
  choice: kutoka Yezreeli
  rationale: 'Kihusishi מִן kilichounganishwa na jina la mahali kinaonyesha asili ya kijiografia: Ahinoamu alitoka Yezreeli.'
- source_word: וַתִּהְיֶיןָ גַּם שְׁתֵּיהֶן
  choice: nao wote wawili wakawa
  rationale: Kitenzi cha wingi wa kike pamoja na ‘wote wawili’ kinawahusu Ahinoamu na Abigaili. Kiswahili hutumia ‘wote wawili’ kwa watu wawili hata kama wote ni wanawake; ‘wakawa’ huhifadhi mwendo wa simulizi na maana ya היה.
- source_word: לְנָשִׁים
  choice: wake zake
  rationale: Muundo לּוֹ לְנָשִׁים una maana ya kuwa wake kwake. ‘Wake zake’ ni Kiswahili cha kawaida na huhifadhi wazi wingi wa ndoa.
- source_word: גַּם
  choice: pia
  rationale: 'Neno hili linaonyesha nyongeza: zaidi ya Abigaili, Daudi alimchukua pia Ahinoamu.'
theological_decisions:
- issue: Maelezo ya ndoa ya wake wengi
  choice: Aya imetafsiriwa kama maelezo ya kwamba wanawake hao wawili walikuwa wake za Daudi.
  alternative: Kutumia maneno ya kuficha au kupunguza wazi rejeo la wake wengi.
  rationale: Kiebrania kinasema wazi kuwa wanawake wote wawili wakawa wake zake. Tafsiri haipaswi kuficha jambo hilo wala kuongeza hukumu ya kimaadili ambayo aya yenyewe haitoi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; hakuna tanbihi inayohitajika kwa sababu ‘kutoka Yezreeli’ na ‘wake zake’ zinawasilisha maana ya Kiebrania kwa uwazi.
