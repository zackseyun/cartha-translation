source:
  edition: WLC
  text: שָׂ֥א נָ֖א לְ/פֶ֣שַׁע אֲמָתֶ֑/ךָ כִּ֣י עָשֹֽׂה יַעֲשֶׂה֩ יְהוָ֨ה לַֽ/אדֹנִ֜/י בַּ֣יִת נֶאֱמָ֗ן כִּי מִלְחֲמ֤וֹת יְהוָה֙ אֲדֹנִ֣/י נִלְחָ֔ם וְ/רָעָ֛ה לֹא תִמָּצֵ֥א בְ/ךָ֖ מִ/יָּמֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/028.yaml
  text: Please forgive the transgression of your servant[a], for Yahweh will surely make my lord a lasting house, because my lord fights Yahweh’s battles, and evil will not be found in you all your days.
translation:
  language: sw
  text: Tafadhali, samehe kosa la kijakazi wako, kwa maana hakika Yahweh atamjengea bwana wangu nyumba ya kudumu[a], kwa sababu bwana wangu anapigana vita vya Yahweh, wala uovu hautapatikana ndani yako siku zako zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyumba imara” au “nasaba ya kudumu.” Neno la Kiebrania “nyumba” hapa linamaanisha ukoo thabiti unaoendelea, si jengo au kaya tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא לְפֶשַׁע
  choice: Tafadhali, samehe kosa
  rationale: Nahau ya Kiebrania ya ‘kuinua/kubeba kosa’ ina maana ya kusamehe. ‘Tafadhali’ huhifadhi nguvu ya ombi la נָא, na ‘kosa’ huhifadhi uzito wa kimaadili bila kulifanya kwa lazima kuwa uasi wa kisiasa.
- source_word: אֲמָתֶךָ
  choice: kijakazi wako
  rationale: אמה humtaja mtumishi wa kike. ‘Kijakazi’ huhifadhi jinsia na namna Abigaili anavyojishusha kwa heshima mbele ya Daudi.
- source_word: עָשֹׂה יַעֲשֶׂה
  choice: hakika ... atamjengea
  rationale: Muundo wa kitenzi kisicho na kikomo pamoja na kitenzi chenye ukomo unasisitiza uhakika wa tendo; ‘hakika’ huonyesha msisitizo huo.
- source_word: לַאדֹנִי
  choice: bwana wangu
  rationale: Ni namna ya heshima ambayo Abigaili anatumia kumwelekea Daudi; ‘bwana wangu’ ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: בַּיִת נֶאֱמָן
  choice: nyumba ya kudumu
  rationale: ‘Nyumba’ hapa ina maana pana ya ukoo au nasaba itakayodumu. Tafsiri hii huhifadhi sitiari ya Kiebrania na wakati huohuo hueleza uimara wake.
- source_word: מִלְחֲמוֹת יְהוָה
  choice: vita vya Yahweh
  rationale: Muundo huu huonyesha vita vinavyopiganwa kwa ajili ya Yahweh au chini ya kusudi lake.
- source_word: נִלְחָם
  choice: anapigana
  rationale: Umbo la kitenzi linaonyesha tendo la kawaida au linaloendelea; wakati wa sasa wa Kiswahili unafaa katika muktadha huu.
- source_word: וְרָעָה לֹא תִמָּצֵא בְךָ
  choice: wala uovu hautapatikana ndani yako
  rationale: רָעָה linaweza kumaanisha uovu, madhara, au taabu. ‘Uovu’ huhifadhi uzito wa kimaadili, na ‘ndani yako’ hufuata kwa karibu בְךָ bila kuondoa uwezekano wa maana pana.
- source_word: מִיָּמֶיךָ
  choice: siku zako zote
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza kipindi chote cha maisha ya mtu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
theological_decisions:
- issue: Maana ya kifalme au kiukoo ya ‘nyumba’ katika baraka ya Abigaili
  choice: nyumba ya kudumu
  alternative: nasaba ya kudumu; nyumba imara
  rationale: Inaelekea ‘nyumba’ inatazamia ukoo au nasaba thabiti ya Daudi. Kudumisha sitiari ya ‘nyumba’ huhifadhi uhusiano wake na matumizi mengine ya kibiblia bila kuifunga kabisa kwa istilahi ya ‘nasaba’.
- issue: Maana ya רָעָה kuhusu Daudi
  choice: uovu
  alternative: mabaya; madhara; taabu
  rationale: Muktadha unahusu mwenendo wa Daudi na kujiepusha na hatia, hivyo ‘uovu’ huhifadhi kipengele cha kimaadili. Hata hivyo, maana pana ya neno la Kiebrania haijafafanuliwa zaidi ya inavyolazimu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kijakazi’ limetumiwa kuhifadhi jinsia ya אמה na sauti ya heshima ya hotuba ya Abigaili; alama ya tanbihi imewekwa baada ya ‘nyumba ya kudumu,’ ambako maelezo yake yanahusika moja kwa moja.
