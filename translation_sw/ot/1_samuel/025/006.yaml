base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/006.yaml
  text: 'And say this: ‘To the living one: Peace to you[a], peace to your house[b], and peace to all that is yours.’'
translation:
  language: sw
  text: 'Nanyi mtamwambia hivi: “Uishi muda mrefu! Amani iwe kwako[a], amani iwe kwa nyumba yako[b], na amani iwe kwa vyote ulivyo navyo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, mwanzo wa salamu hizi ni kwa uhalisi “kwa uhai” au labda “kwa aliye hai.” Huenda ni salamu au baraka yenye maana ya “Uishi muda mrefu”; wengine hutafsiri kwa ujumla kuwa “Salamu.”
    reason: alternative_reading
  - marker: b
    text: Neno “amani” limetafsiri kutoka Kiebrania shalom, ambalo pia linaweza kumaanisha hali njema, ukamilifu au ustawi. “Nyumba” hapa inaweza kujumuisha watu wote wa nyumbani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Nanyi mtamwambia
  rationale: Waw pamoja na kitenzi cha hali timilifu huendeleza agizo la Daudi kwa wajumbe wengi; ‘mtamwambia’ huhifadhi mhusika wa umoja anayelengwa na wingi wa wanaoagizwa.
- source_word: כֹּה
  choice: hivi
  rationale: Neno hili hutanguliza ujumbe unaonukuliwa; ‘hivi’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: לֶחָי
  choice: Uishi muda mrefu
  rationale: Kirai hiki kigumu, kwa uhalisi ‘kwa uhai’ au ‘kwa aliye hai,’ huenda ni salamu au baraka ya kumtakia mtu maisha marefu. Tafsiri hii huwasilisha maana inayowezekana kwa Kiswahili cha kawaida bila kuficha utata wake, unaoelezwa katika tanbihi.
- source_word: וְאַתָּה שָׁלוֹם
  choice: Amani iwe kwako
  rationale: Kishazi kisicho na kitenzi kina nguvu ya dua au baraka. ‘Amani iwe kwako’ ni kauli ya asili ya Kiswahili na huhifadhi urudiaji wa shalom.
- source_word: וּבֵיתְךָ שָׁלוֹם
  choice: amani iwe kwa nyumba yako
  rationale: ‘Nyumba’ inaweza kumaanisha jengo pamoja na watu wa nyumbani; kuibakiza kunahifadhi taswira na upana wa Kiebrania.
- source_word: וְכֹל אֲשֶׁר לְךָ שָׁלוֹם
  choice: na amani iwe kwa vyote ulivyo navyo
  rationale: Kauli hii hueneza baraka kwa kila kitu kilicho chini ya milki au uangalizi wake; ‘vyote ulivyo navyo’ ni pana na ya asili.
- source_word: שָׁלוֹם
  choice: amani
  rationale: ‘Amani’ ndiyo tafsiri fupi iliyozoeleka, huku maana pana ya hali njema, ukamilifu na ustawi ikifafanuliwa katika tanbihi.
