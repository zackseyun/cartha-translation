  text: David heard in the wilderness that Nabal was shearing his sheep[a].
translation:
  language: sw
  text: Daudi alipokuwa nyikani, alisikia kwamba Nabali alikuwa akiwanyoa kondoo wake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kundi lake.” Neno la Kiebrania צֹאן linaweza kurejelea kwa pamoja kundi la kondoo na mbuzi, ingawa “kondoo” linafaa zaidi katika muktadha wa kunyoa manyoya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: alisikia
  rationale: Kitenzi hiki katika mfululizo wa masimulizi kinaeleza tukio rahisi la wakati uliopita. ‘Alisikia’ ni tafsiri ya moja kwa moja na ya kawaida kuliko ‘alipata habari,’ ambayo ingeongeza maana kwa kiasi.
- source_word: בַּמִּדְבָּר
  choice: akiwa nyikani
  rationale: מִדְבָּר humaanisha eneo la porini au lisilokaliwa sana, si lazima jangwa la mchanga. Muundo ‘akiwa nyikani’ unaonyesha kwa lugha ya kawaida mahali Daudi alipokuwa aliposikia habari hiyo.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי inaanzisha maudhui ya habari aliyosikia Daudi, hivyo ‘kwamba’ inafaa kisintaksia.
- source_word: גֹזֵז
  choice: alikuwa akiwanyoa
  rationale: Kivumishi-tendo hiki kinaonyesha shughuli iliyokuwa ikiendelea wakati huo. ‘Alikuwa akiwanyoa’ huhifadhi hali hiyo na ni usemi wa kawaida kuhusu kuondoa manyoya ya kondoo.
- source_word: נָבָל
  choice: Nabali
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayoeleweka katika Kiswahili.
- source_word: אֶת צֹאנוֹ
  choice: kondoo wake
  rationale: צֹאן linaweza kumaanisha kwa pamoja wanyama wadogo wa kufugwa, hasa kondoo na mbuzi. Katika muktadha wa kunyoa manyoya, ‘kondoo wake’ ndiyo tafsiri ya kawaida na mahususi zaidi.
