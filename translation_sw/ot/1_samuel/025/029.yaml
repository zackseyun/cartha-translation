source:
  edition: WLC
  text: וַ/יָּ֤קָם אָדָם֙ לִ/רְדָפְ/ךָ֔ וּ/לְ/בַקֵּ֖שׁ אֶת נַפְשֶׁ֑/ךָ וְֽ/הָיְתָה֩ נֶ֨פֶשׁ אֲדֹנִ֜/י צְרוּרָ֣ה בִּ/צְר֣וֹר הַ/חַיִּ֗ים אֵ֚ת יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/אֵ֨ת נֶ֤פֶשׁ אֹיְבֶ֨י/ךָ֙ יְקַלְּעֶ֔/נָּה בְּ/ת֖וֹךְ כַּ֥ף הַ/קָּֽלַע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/029.yaml
  text: Though a man has risen to pursue you and to seek your life[a], yet the life of my lord shall be bound in the bundle of the living with Yahweh your God[b], and the lives of your enemies he shall sling out from the hollow of the sling.
translation:
  language: sw
  text: Ijapokuwa mtu ameinuka kukufuatilia na kutafuta uhai wako, maisha ya bwana wangu yatafungwa katika kifurushi cha walio hai[a] pamoja na Yahwe Mungu wako; lakini maisha ya adui zako atayarusha kwa kombeo kutoka katika mfuko wa kombeo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yatafungwa katika kifurushi cha uhai.” Picha ya Kiebrania ni ya kitu kilichofungwa kwa usalama ili kihifadhiwe.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa maana halisi kina picha ya Mungu akiyarusha maisha ya adui zako kwa kombeo, kutoka katika sehemu ya kombeo inayoshikilia jiwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם אָדָם
  choice: Hata ikiwa mtu ameinuka
  rationale: Muundo huu unaweka hali ya kukubali uwepo wa tishio bila kuifanya kuwa simulizi rahisi inayofuatana. 'Mtu' huhifadhi umoja wa kiume wa אָדָם.
- source_word: לִרְדָפְךָ
  choice: kukufuatilia
  rationale: Katika muktadha huu רדף ni kumfuata mtu kwa nia ya kumdhuru; 'kukufuatilia' ni Kiswahili cha kawaida chenye maana hiyo ya uhasama.
- source_word: וּלְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: na kutafuta kukuua
  rationale: Kiebrania halisi ni 'kutafuta maisha yako'; hapa נֶפֶשׁ ni uhai unaolengwa. Kiswahili 'kutafuta kukuua' huwasilisha wazi nia ya kuondoa uhai bila kudai kuwa neno hilo humaanisha 'kuua' peke yake.
- source_word: נֶפֶשׁ אֲדֹנִי
  choice: maisha ya bwana wangu
  rationale: נֶפֶשׁ hapa ni uhai/nafsi ya mtu, na wingi wa Kiswahili 'maisha' ndio usemi wa kawaida. 'Bwana wangu' huhifadhi heshima ya Abigaili kwa Daudi.
- source_word: צְרוּרָה בִּצְרוֹר הַחַיִּים
  choice: yatafungwa salama katika kifurushi cha walio hai
  rationale: Huhifadhi picha halisi ya kitu kilichofungwa katika kifurushi ili kilindwe. 'Walio hai' huakisi הַחַיִּים bila kuifanya picha hiyo kuwa fundisho bayana la maisha baada ya kifo.
- source_word: אֵת יְהוָה אֱלֹהֶיךָ
  choice: pamoja na Yahwe Mungu wako
  rationale: אֵת hapa inaonyesha ushirika au kuwa pamoja; tafsiri hii huweka ulinzi wa maisha ya Daudi katika uwepo wa Mungu na huhifadhi jina la Mungu יהוה kama Yahwe.
- source_word: וְאֵת נֶפֶשׁ אֹיְבֶיךָ
  choice: lakini maisha ya adui zako
  rationale: Kiunganishi kimetafsiriwa 'lakini' ili kuonyesha ulinganisho mkali. נֶפֶשׁ ya umoja ina matumizi ya kiujumla kwa adui wengi; 'maisha' ni ya kawaida katika Kiswahili.
- source_word: יְקַלְּעֶנָּה
  choice: atayatupa kwa kombeo
  rationale: Kitenzi קלע kinahusu kurusha kwa kombeo. Tafsiri hii huhifadhi picha ya kombeo na Mungu kama mtendaji anayeeleweka kutoka kishazi kilichotangulia.
- source_word: בְּתוֹךְ כַּף הַקָּלַע
  choice: kutoka katika mfuko wake
  rationale: כַּף הַקָּלַע ni sehemu ya kombeo inayoshikilia jiwe, yaani mfuko wake. Kiswahili hiki ni wazi kuliko tafsiri halisi 'kiganja cha kombeo' huku kikihifadhi picha ya chombo hicho.
theological_decisions:
- issue: Tofauti ya picha kati ya kuhifadhiwa kwa Daudi na kuondolewa kwa adui zake
  choice: Kuhifadhi picha ya maisha kufungwa salama katika kifurushi na ya adui kurushwa kwa kombeo.
  alternative: Kufafanua 'kifurushi cha walio hai' kuwa kauli ya moja kwa moja kuhusu uzima wa milele, au kulainisha picha zote kuwa ulinzi na kushindwa kwa jumla.
  rationale: Kiebrania kinatumia picha halisi kuhusu ulinzi wa Mungu na kuondolewa kwa adui. Hakitoi hapa maelezo kamili ya hali ya baada ya kifo.
- issue: Maana ya נֶפֶשׁ katika tishio dhidi ya Daudi
  choice: Kutafsiri dhamira kama 'kutafuta kukuua' na baadaye kutumia 'maisha'.
  alternative: Kutumia 'nafsi' kila mahali au kusema 'kutafuta maisha yako'.
  rationale: Katika muktadha huu neno linamaanisha uhai wa mtu unaolengwa. Tafsiri hii ni ya kawaida kwa Kiswahili na haiingizii mgawanyo wa kimetafizikia wa nafsi na mwili.
- issue: Utambulisho wa mtendaji katika יְקַלְּעֶנָּה
  choice: Kumwacha Mungu kuwa mtendaji anayeendelea kueleweka kwa kiwakilishi katika kitenzi 'atayatupa'.
  alternative: Kutaja tena 'Yahwe atayatupa' kwa uwazi.
  rationale: Kiebrania hakitaji jina tena katika kishazi hiki; mtendaji anaeleweka kutoka 'Yahwe Mungu wako'. Tafsiri huhifadhi mshikamano huo bila kuongeza nomino.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Kombeo' na 'kifurushi' huhifadhi picha za Kiebrania; 'mfuko wake' hufafanua sehemu ya kombeo bila kutumia usemi usio wa kawaida 'kiganja cha kombeo'. Alama zote za tanbihi [a] na [b] zimo katika matini kuu.
