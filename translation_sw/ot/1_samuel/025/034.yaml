source:
  edition: WLC
  text: וְ/אוּלָ֗ם חַי יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר מְנָעַ֔/נִי מֵ/הָרַ֖ע אֹתָ֑/ךְ כִּ֣י לוּלֵ֣י מִהַ֗רְתְּ ו/תבאתי לִ/קְרָאתִ֔/י כִּ֣י אִם נוֹתַ֧ר לְ/נָבָ֛ל עַד א֥וֹר הַ/בֹּ֖קֶר מַשְׁתִּ֥ין בְּ/קִֽיר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/034.yaml
  text: But as Yahweh[a], the God of Israel, lives, who has kept me from harming you, if you had not hurried and come to meet me, surely by the light of morning not one male would have been left to Nabal.
translation:
  language: sw
  text: Lakini, kama aishivyo Yahwe, Mungu wa Israeli, ambaye amenizuia nisikudhuru, kwa hakika, kama usingeharakisha na kuja kunilaki, kufikia mapambazuko wa Nabali asingesalia hata mwanamume mmoja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “anayekojoa ukutani,” nahau kali inayomaanisha “mwanamume.”'
    reason: Nahau halisi ya Kiebrania ni kali na isiyo ya kawaida kwa Kiswahili; tanbihi huihifadhi huku matini kuu ikitoa maana yake.
lexical_decisions:
- source_word: וְאוּלָם
  choice: Lakini
  rationale: Ni kiunganishi cha kupambanua kinachoanzisha kauli nzito ya Daudi kuhusu jambo ambalo lingetokea.
- source_word: חַי יְהוָה
  choice: kama aishivyo Yahwe
  rationale: Hii ni fomula ya kawaida ya kiapo cha Kiebrania; muundo huu unahifadhi uzito wa kiapo kwa Kiswahili cha asili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kwa namna ya jina, badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishazi hiki.
- source_word: אֲשֶׁר מְנָעַנִי
  choice: ambaye amenizuia
  rationale: Kitenzi kina maana ya kumzuia au kumkinga mtu asifanye jambo; timilifu ya Kiswahili inafaa kwa tendo lililotimizwa.
- source_word: מֵהָרַע אֹתָךְ
  choice: nisikudhuru
  rationale: Kwa muktadha, ‘kutenda uovu dhidi yako’ kunahusu kumletea Abigaili na nyumba yake madhara ya kisasi; ‘nisikudhuru’ ni sahihi na ya kawaida.
- source_word: כִּי לוּלֵי
  choice: kwa hakika, kama ... usinge-
  rationale: Inaanzisha hali ya kinyume na ukweli huku ikisisitiza matokeo ambayo yangetokea.
- source_word: מִהַרְתְּ וַתָּבֹאתִי לִקְרָאתִי
  choice: usingefanya haraka kuja kunilaki
  rationale: Inahifadhi nafsi ya pili ya kike inayomrejelea Abigaili na kutoa kwa lugha ya kawaida wazo la kuharakisha kwenda kumkabili au kumpokea mtu.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: kufikia mapambazuko
  rationale: Kishazi kinaeleza mpaka wa wakati, yaani kufikia mwanga wa asubuhi.
- source_word: מַשְׁתִּין בְּקִיר
  choice: mwanamume mmoja
  rationale: Nahau hii ya ukali, kihalisi ‘anayekojoa ukutani,’ humaanisha mtu wa kiume; maana imewekwa katika matini na umbo halisi limehifadhiwa katika tanbihi.
- source_word: נוֹתַר לְנָבָל
  choice: asingebaki kwa Nabali
  rationale: Inahifadhi wazo la mtu kubaki akiwa wa nyumba au upande wa Nabali bila kuongeza moja kwa moja neno ‘hai,’ ingawa uhai unaeleweka katika muktadha.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania inatumia moja kwa moja Tetragramatoni; ‘Yahwe’ huhifadhi jina la agano bila kulibadilisha kuwa cheo.
- issue: Uhusiano wa Mungu na kuzuiwa kwa Daudi
  choice: ambaye amenizuia nisikudhuru
  alternative: ambaye amenizuia nisikutendee uovu
  rationale: Tafsiri inahifadhi dai la Daudi kwamba Yahwe ndiye aliyemzuia, lakini haitoi hukumu ya ziada kuhusu nia au mwenendo wote wa Daudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kiapo umehifadhiwa, huku sentensi ndefu ikipangwa kwa koma ili isomeke kwa urahisi. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachotafsiri nahau ya Kiebrania.
