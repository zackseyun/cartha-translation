  text: They were a wall around us both by night and by day[b][a], all the days we were with them tending the flock.
translation:
  language: sw
  text: Walikuwa ukuta wa kutuzunguka usiku na mchana,[a] kwa siku zote tulipokuwa pamoja nao tukilichunga kundi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “walikuwa ukuta juu yetu”; maana yake ni kwamba walituzunguka na kutulinda.'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania “kundi” ni neno la pamoja linaloweza kumaanisha kondoo na mbuzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: kama ukuta
  rationale: Nomino halisi ni ‘ukuta’; muktadha unaonyesha kuwa imetumiwa kwa sitiari ya ulinzi. ‘Kama ukuta’ huifanya picha hiyo iwe ya asili na wazi katika Kiswahili bila kuibadili kuwa dhana ya jumla tu.
- source_word: הָיוּ
  choice: walikuwa
  rationale: Qal timilifu ya היה hapa ni kitenzi kishirikishi cha wakati uliopita kinachoeleza hali yao iliyoendelea.
- source_word: עָלֵינוּ
  choice: wa kutuzunguka
  rationale: Ingawa על kwa kawaida humaanisha ‘juu ya,’ ikiandamana na ‘ukuta’ hapa inaeleza ulinzi uliowazunguka. Usemi huu ni wa asili katika Kiswahili na unabaki karibu na picha ya Kiebrania.
- source_word: גַּם לַיְלָה גַּם יוֹמָם
  choice: usiku na mchana
  rationale: Muundo wa גַּם...גַּם unasisitiza ulinzi wa daima katika vipindi vyote viwili; usemi ‘usiku na mchana’ ni wa kawaida na wenye mkazo huo katika Kiswahili.
- source_word: כָּל יְמֵי
  choice: siku zote
  rationale: Tafsiri hii inahifadhi usemi wa wakati wa Kiebrania kwa namna fupi na ya kawaida.
- source_word: הֱיוֹתֵנוּ עִמָּם
  choice: tulipokuwa pamoja nao
  rationale: Kitenzi-jina chenye kiambishi cha nafsi kinaonyesha kipindi ambacho ‘sisi’ tulikuwa pamoja ‘nao’; kishazi hiki cha Kiswahili kinatoa maana hiyo wazi.
- source_word: רֹעִים
  choice: tukilichunga
  rationale: Mzizi רעה humaanisha kuchunga au kulisha mifugo. ‘Tukilichunga’ ni usemi wa kawaida wa shughuli hiyo na unaendana na nomino ya pamoja inayofuata.
- source_word: הַצֹּאן
  choice: kundi
  rationale: צאן ni nomino ya pamoja inayoweza kuhusisha kondoo na mbuzi. ‘Kundi’ huhifadhi upana huo bila kuifanya iwe kondoo peke yao.
