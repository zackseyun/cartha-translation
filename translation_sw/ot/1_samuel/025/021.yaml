base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/021.yaml
  text: David had said, “Surely I have guarded all that belongs to this man in the wilderness for nothing, so that not a thing of all that belonged to him was missing; and he has repaid me evil for good.”
translation:
  language: sw
  text: Daudi alikuwa amesema, “Hakika nimevilinda bure vitu vyote vya mtu huyu kule nyikani, wala hakuna chochote cha mali yake kilichokosekana. Lakini amenilipa ubaya badala ya wema.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ לַשֶּׁקֶר
  choice: Hakika ... bure
  rationale: אַךְ hapa inasisitiza hitimisho la Daudi, na לַשֶּׁקֶר huonyesha kwamba, kwa maoni yake, jitihada zake hazikuwa na faida au malipo.
- source_word: שָׁמַרְתִּי
  choice: nimevilinda
  rationale: Kitenzi שׁמר katika muktadha huu kina maana ya kulinda au kutunza mali dhidi ya madhara.
- source_word: לָזֶה
  choice: vya mtu huyu
  rationale: Usemi huo wa Kiebrania humrejelea Nabali kwa namna ya mbali na yenye dharau kidogo; 'mtu huyu' huhifadhi athari hiyo kwa Kiswahili cha kawaida.
- source_word: וְלֹא נִפְקַד ... מְאוּמָה
  choice: hata hakuna chochote ... kilichokosekana
  rationale: נפקד hapa ni kukosekana au kutopatikana, na מְאוּמָה husisitiza kwamba hakikupotea kitu hata kimoja.
- source_word: וַיָּשֶׁב לִי רָעָה תַּחַת טוֹבָה
  choice: Lakini amenilipa ubaya badala ya wema
  rationale: Muundo huu unaeleza kulipiza au kurudisha ubaya mahali pa wema; 'amenilipa' ni usemi wa asili wa Kiswahili unaohifadhi ulinganifu huo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Wakati timilifu 'alikuwa amesema' unahifadhi hali ya kitendo kilichotangulia katika simulizi. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi.
