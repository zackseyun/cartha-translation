translation:
  language: sw
  text: Na sasa, zawadi hii ambayo mjakazi wako amemletea bwana wangu, na ipewe vijana wanaomfuata bwana wangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבְּרָכָה
  choice: zawadi
  rationale: Neno hili kimsingi humaanisha ‘baraka,’ lakini katika muktadha huu linamaanisha kitu kilicholetwa kama zawadi; ‘zawadi’ ni Kiswahili cha kawaida na huwasilisha maana ya kimuktadha.
- source_word: שִׁפְחָתְךָ
  choice: mtumishi wako
  rationale: Ingawa neno la Kiebrania ni la kike na linaweza kutafsiriwa ‘mjakazi wako,’ hapa ni namna ya Abigaili kujishusha kwa heshima mbele ya Daudi. ‘Mtumishi wako’ ni ya asili katika Kiswahili na mzungumzaji wa kike anaeleweka kutokana na muktadha.
- source_word: הַנְּעָרִים
  choice: vijana
  rationale: Hurejelea vijana au watumishi vijana walio pamoja na Daudi; ‘vijana’ huhifadhi upana huo bila kuongeza ufafanuzi usiotajwa.
- source_word: הַמִּתְהַלְּכִים בְּרַגְלֵי
  choice: wanaomfuata
  rationale: Nahau ya Kiebrania, kihalisi ‘wanaotembea miguuni/nyuma ya,’ ina maana ya wale wanaoandamana na kumfuata mtu; tafsiri hii ni wazi na ya kawaida.
