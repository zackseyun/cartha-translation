base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/025.yaml
  text: 'Please[a], my lord, do not set your heart on this worthless man, on Nabal, for as his name is, so is he: Nabal is his name, and folly is with him. But I, your servant, did not see the young men of my lord whom you sent.'
translation:
  language: sw
  text: 'Tafadhali, bwana wangu, usimtilie maanani mtu huyu asiyefaa, Nabali; kwa maana kama lilivyo jina lake, ndivyo alivyo: jina lake ni Nabali[a], na upumbavu uko pamoja naye. Lakini mimi, mjakazi wako, sikuwaona wale vijana wa bwana wangu uliowatuma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina “Nabali” linasikika kama neno la Kiebrania linalomaanisha “mpumbavu” au “upumbavu”; Abigaili anatumia mchezo huu wa maneno kwa makusudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂים אֶת־לִבּוֹ אֶל
  choice: usimweke moyoni
  rationale: Nahau hii inadumisha taswira ya Kiebrania ya kuuelekeza moyo kwa mtu, huku ikimaanisha kutompa uzito au kumshughulikia kwa uzito.
- source_word: אִישׁ הַבְּלִיַּעַל
  choice: mtu huyu asiyefaa
  rationale: Katika muktadha huu, neno hilo ni sifa ya kudharauliwa kwa tabia na thamani ya mtu, wala si jina maalumu; tafsiri hii ni ya kawaida na haiongezi wazo maalumu la kidhehebu.
- source_word: נָבָל
  choice: Nabali
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida ya Kiswahili; maana inayohusishwa nalo imeelezwa katika tanbihi ili kuhifadhi mchezo wa maneno.
- source_word: כִּי כִשְׁמוֹ כֶּן הוּא
  choice: kwa maana alivyo jina lake, ndivyo alivyo yeye
  rationale: Muundo huu unahifadhi ulinganisho wa kimethali kati ya jina la Nabali na tabia yake.
- source_word: וּנְבָלָה עִמּוֹ
  choice: na upumbavu uko pamoja naye
  rationale: Neno נְבָלָה linaweza kumaanisha upumbavu au mwenendo wa aibu. Hapa 'upumbavu' huhifadhi uhusiano wa moja kwa moja na mchezo wa maneno juu ya jina Nabali.
- source_word: אֲמָתְךָ
  choice: mjakazi wako
  rationale: Neno hili humtaja mtumishi wa kike. 'Mjakazi wako' ni fupi, yenye heshima, na hudumisha jinsia pamoja na kauli ya Abigaili ya kujinyenyekeza.
- source_word: נַעֲרֵי
  choice: wale vijana
  rationale: Maana ya msingi ni vijana, ambao katika simulizi pia ni wajumbe au watumishi wa Daudi; tafsiri hii inabaki karibu na neno la chanzo.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Hii ni kauli ya heshima ambayo Abigaili anatumia kumwelekea Daudi, si jina la Mungu katika muktadha huu.
