review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the verse’s address, warning concerning Nabal, name/folly wordplay, Abigail’s self-designation as a female servant, and her failure to see David’s young men. However, “usimweke moyoni” is liable in modern Swahili to suggest holding someone dear rather than declining to give him serious regard, and the proverbial comparison is grammatically unnatural as written.
  naturalness: A small revision makes the warning and name-character comparison idiomatic Standard East African Swahili while retaining the Hebrew’s sense and rhetorical force.
  terminology: “Bwana wangu,” “mjakazi wako,” “Nabali,” and “vijana” are suitable. “Asiyefaa” reasonably conveys the pejorative characterization without treating Belial as a proper name. The footnote appropriately explains the Hebrew wordplay.
  issues:
  - severity: medium
    issue: “usimweke moyoni” is misleading in this context.
    rationale: In current Swahili, kumweka mtu moyoni commonly conveys affection, attachment, or cherishing someone. The Hebrew idiom here asks David not to give Nabal serious attention or concern.
  - severity: medium
    issue: “alivyo jina lake, ndivyo alivyo yeye” is not a natural grammatical rendering of the comparison.
    rationale: The Hebrew means “as his name is, so is he.” “Kama lilivyo jina lake, ndivyo alivyo” gives this proverbial comparison clearly and naturally.
  revised_text: 'Tafadhali, bwana wangu, usimtilie maanani mtu huyu asiyefaa, Nabali; kwa maana kama lilivyo jina lake, ndivyo alivyo: jina lake ni Nabali[a], na upumbavu uko pamoja naye. Lakini mimi, mjakazi wako, sikuwaona wale vijana wa bwana wangu uliowatuma.'
