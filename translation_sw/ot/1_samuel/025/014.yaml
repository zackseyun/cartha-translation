  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumiwa kwa vitenzi vya mfululizo; “Tazama” huhifadhi msisitizo wa הִנֵּה, na tanbihi zinahifadhi uwezekano wa maana za ברך na עָט.
