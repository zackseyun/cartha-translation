  text: וְ/לַ/אֲבִיגַ֨יִל֙ אֵ֣שֶׁת נָבָ֔ל הִגִּ֧יד נַֽעַר אֶחָ֛ד מֵ/הַ/נְּעָרִ֖ים לֵ/אמֹ֑ר הִנֵּ֣ה שָׁלַח֩ דָּוִ֨ד מַלְאָכִ֧ים מֵֽ/הַ/מִּדְבָּ֛ר לְ/בָרֵ֥ךְ אֶת אֲדֹנֵ֖י/נוּ וַ/יָּ֥עַט בָּ/הֶֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/014.yaml
  text: But one of the young men told Abigail[a], Nabal’s wife, saying, “Look, David sent messengers from the wilderness to greet our master[b], and he shouted at them.”
translation:
  language: sw
  text: Lakini mmoja wa vijana akamjulisha Abigaili, mke wa Nabali, akisema, “Tazama, Daudi alituma wajumbe kutoka nyikani kumsalimu[a] bwana wetu, lakini yeye akawafokea[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumbariki bwana wetu.” Kitenzi cha Kiebrania mara nyingi humaanisha “kubariki,” lakini hapa huenda kinamaanisha kutoa salamu ya heshima au baraka.
    reason: lexical_alternative
  - marker: b
    text: Au, “akawajia kwa ukali.” Kitenzi cha Kiebrania ni chenye nguvu na kinaweza kudokeza kuwavamia au kuwalipukia kwa hasira.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲבִיגַיִל
  choice: Lakini ... Abigaili
  rationale: Kiunganishi kinaendeleza simulizi huku kikionyesha badiliko kutoka kukataa kwa Nabali hadi taarifa inayomfikia Abigaili.
- source_word: הִגִּיד
  choice: akamjulisha
  rationale: Hifili ya נגד humaanisha kutoa taarifa au kumweleza mtu; “akamjulisha” ni ya kawaida na inafaa kwa taarifa hii ya mtumishi.
- source_word: נַעַר אֶחָד מֵהַנְּעָרִים
  choice: mmoja wa wale vijana
  rationale: Huhifadhi maana pana ya נערים bila kuifanya moja kwa moja kuwa “watumishi,” ingawa muktadha unaonyesha walikuwa katika nyumba ya Nabali.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta fikira za msikilizaji kwenye taarifa inayofuata na lina hadhi inayofaa katika simulizi la Biblia.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu ni watu waliotumwa na Daudi, si malaika.
- source_word: מֵהַמִּדְבָּר
  choice: kutoka nyikani
  rationale: מִדְבָּר ni eneo la nyika ambako Daudi na watu wake walikuwa wakikaa.
- source_word: לְבָרֵךְ
  choice: waje kumsalimu
  rationale: Ingawa ברך kwa kawaida humaanisha “bariki,” hapa inaelekea kuonyesha salamu ya heshima; maana ya moja kwa moja imehifadhiwa katika tanbihi.
- source_word: אֶת אֲדֹנֵינוּ
  choice: bwana wetu
  rationale: Hii ni namna vijana wa nyumba hiyo wanavyomtaja mkuu wao, Nabali, wala si cheo cha Mungu.
- source_word: וַיָּעַט בָּהֶם
  choice: lakini yeye akawafokea
  rationale: Kitenzi hiki ni chenye nguvu na kinaweza kuonyesha kuwajia au kuwavamia kwa ukali; katika muktadha wa jibu la maneno, “akawafokea” huwasilisha mlipuko mkali bila kudai shambulio la kimwili.
