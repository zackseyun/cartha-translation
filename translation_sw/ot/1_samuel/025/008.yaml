base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/008.yaml
  text: Ask your young men[a], and they will tell you. So let the young men find favor in your eyes, for we have come on a festive day[b]. Please give whatever your hand finds to your servants and to your son David.
translation:
  language: sw
  text: Waulize vijana wako, nao watakuambia. Basi vijana wapate kibali machoni pako, kwa maana tumekuja siku ya sherehe[b]. Tafadhali, wape watumishi wako na mwanao Daudi chochote ambacho mkono wako utakipata[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chochote unachoweza kutoa”; kwa maana halisi, “chochote ambacho mkono wako utakipata.”
    reason: lexical_alternative
  - marker: b
    text: “Siku ya sherehe” inaonyesha mazingira ya furaha wakati wa kunyolewa kwa kondoo; kwa maana halisi, “siku njema.”
    reason: cultural_note
lexical_decisions:
- source_word: שְׁאַל
  choice: Waulize
  rationale: Kauli ya amri ya moja kwa moja inayoelekeza Nabali awaambie watu wake mwenyewe; “waulize” ni ya kawaida na wazi katika Kiswahili.
- source_word: נְעָרֶיךָ / הַנְּעָרִים
  choice: vijana wako / vijana hawa
  rationale: “Vijana” huhifadhi maana ya msingi na uhusiano wa kileksia kati ya kutokea kwa neno hili mara mbili, bila kuamua zaidi ikiwa walikuwa watumishi au wasaidizi.
- source_word: וְיַגִּידוּ לָךְ
  choice: nao watakuambia
  rationale: Hutoa maana ya taarifa watakayompa Nabali kwa Kiswahili cha kawaida.
- source_word: וְיִמְצְאוּ הַנְּעָרִים חֵן בְּעֵינֶיךָ
  choice: Basi vijana hawa na wapate kibali machoni pako
  rationale: “Na wapate” huwasilisha ombi lenye nguvu ya jussive, huku “kibali machoni pako” kikihifadhi taswira ya nahau ya Kiebrania.
- source_word: כִּי עַל יוֹם טוֹב בָּאנוּ
  choice: kwa maana tumekuja siku ya sherehe
  rationale: Katika mazingira ya kukata manyoya ya kondoo, “siku njema” ni siku ya furaha na karamu; “siku ya sherehe” huwasilisha maana hiyo ya kimuktadha, huku tanbihi ikitaja tafsiri halisi.
- source_word: תְּנָה נָּא
  choice: Tafadhali, wape
  rationale: Chembe נָא hulainisha amri kuwa ombi la adabu; “tafadhali” huonyesha hilo kwa kawaida.
- source_word: אֵת אֲשֶׁר תִּמְצָא יָדְךָ
  choice: chochote ambacho mkono wako utakipata
  rationale: Huhifadhi taswira halisi ya Kiebrania; maana ya nahau kwamba atoe alicho nacho au anachoweza kutoa imefafanuliwa katika tanbihi.
- source_word: לַעֲבָדֶיךָ
  choice: watumishi wako
  rationale: Daudi anatumia lugha ya unyenyekevu mbele ya Nabali; “watumishi” inafaa zaidi kuliko neno linalodokeza moja kwa moja hali ya utumwa.
- source_word: וּלְבִנְךָ לְדָוִד
  choice: na mwanao Daudi
  rationale: Huhifadhi namna ya Daudi kujitaja kwa unyenyekevu kama “mwana” wa Nabali, si dai la undugu halisi.
