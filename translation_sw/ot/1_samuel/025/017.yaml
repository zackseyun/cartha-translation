source:
  edition: WLC
  text: וְ/עַתָּ֗ה דְּעִ֤י וּ/רְאִי֙ מַֽה תַּעֲשִׂ֔י כִּֽי כָלְתָ֧ה הָ/רָעָ֛ה אֶל אֲדֹנֵ֖י/נוּ וְ/עַ֣ל כָּל בֵּית֑/וֹ וְ/הוּא֙ בֶּן בְּלִיַּ֔עַל מִ/דַּבֵּ֖ר אֵלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/017.yaml
  text: Now know this and consider what you should do[a], for disaster has been determined against our master and against all his household, and he is such a worthless man that one cannot speak to him.
translation:
  language: sw
  text: Sasa fahamu jambo hili, na ufikirie utakachofanya, kwa maana maafa yamekwisha kuamuliwa dhidi ya bwana wetu na dhidi ya watu wote wa nyumbani mwake. Yeye ni mtu mwovu sana, hata hakuna awezaye kusema naye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mwana wa ubatili”; kimapokeo, “mwana wa Beliali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Inaonyesha mpito wa haraka na hitimisho la ushauri wa mtumishi kwa Abigaili.
- source_word: דְּעִי וּרְאִי
  choice: fahamu jambo hili na ufikirie
  rationale: Vitenzi hivi vya amri vinaelekezwa kwa Abigaili. Ingawa וּרְאִי kwa msingi ni ‘uone,’ hapa kinamhimiza kutafakari na kuamua hatua ya kuchukua.
- source_word: מַה תַּעֲשִׂי
  choice: utakachofanya
  rationale: Kauli hii inaacha uamuzi wa hatua kwa Abigaili bila kuongeza wazi wazo la lazima lisilosemwa moja kwa moja katika Kiebrania.
- source_word: כִּי כָלְתָה הָרָעָה
  choice: kwa maana imekwisha amuliwa kwamba maafa yatampata
  rationale: Muundo huu unaonyesha kwamba madhara yanayokuja yamekuwa jambo lililoamuliwa au hakika. Kiswahili hiki kinafikisha maana ya nahau bila tafsiri ngumu ya neno kwa neno.
- source_word: אֶל אֲדֹנֵינוּ וְעַל כָּל בֵּיתוֹ
  choice: bwana wetu na nyumba yake yote
  rationale: ‘Nyumba yake yote’ hapa inahusu watu wote wa nyumbani na walio chini ya mamlaka yake; muundo unaendana na matumizi ya kawaida ya kibiblia katika Kiswahili.
- source_word: וְהוּא בֶּן בְּלִיַּעַל
  choice: Yeye ni mtu asiyefaa kabisa
  rationale: Nahau ya Kiebrania inamtaja mtu duni kimaadili na mkaidi, bila kulazimisha kuelewa Beliali kuwa jina maalumu katika muktadha huu.
- source_word: מִדַּבֵּר אֵלָיו
  choice: hata mtu hawezi kusema naye
  rationale: 'Inafikisha matokeo ya tabia yake: hawezi kushauriwa au kuonywa kwa mazungumzo.'
theological_decisions:
- issue: Maana ya בְּלִיַּעַל
  choice: mtu asiyefaa kabisa
  alternative: mwana wa Beliali
  rationale: Katika muktadha huu neno hilo ni nahau ya mtu duni au mpotovu, si lazima jina maalumu la kiumbe wa kiroho. Tanbihi inahifadhi umbo halisi na tafsiri ya kimapokeo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Kauli ya haraka ya mtumishi imehifadhiwa, na ‘bwana wetu’ inatumika kwa mkuu wa nyumba, si kama jina la Mungu.
