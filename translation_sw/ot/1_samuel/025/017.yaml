  to: Sasa fahamu jambo hili, na ufikirie utakachofanya, kwa maana maafa yamekwisha kuamuliwa dhidi ya bwana wetu na dhidi ya watu wote wa nyumbani mwake. Yeye ni mtu mwovu sana, hata hakuna awezaye kusema naye.[a]
