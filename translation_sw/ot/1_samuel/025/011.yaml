base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/011.yaml
  text: Should I take my bread and my water and my meat that I have slaughtered for my shearers[b][a], and give it to men whom I do not know where they are from?
translation:
  language: sw
  text: Je, nichukue mkate wangu, maji yangu, na nyama yangu niliyochinja kwa ajili ya wakata manyoya yangu wa kondoo[b], kisha niwape watu ambao sijui wametoka wapi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata maumbo ya Kiebrania kwa ukaribu zaidi, “Nami nitachukua ... nami nitawapa”; maumbo hayo yametumiwa katika swali la balagha.
    reason: lexical_alternative
  - marker: b
    text: “Wakata manyoya yangu wa kondoo” ni watu waliokuwa wakifanya kazi ya kukata manyoya ya kondoo.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Je, nichukue
  rationale: 'Ingawa umbo la Kiebrania ni qatal nafsi ya kwanza umoja lenye kiunganishi, katika swali hili la balagha lina maana ya kutafakari kwa ghadhabu: “Je, nichukue...?”'
- source_word: לַחְמִי
  choice: mkate wangu
  rationale: Neno halisi ni “mkate”; hapa linadumisha orodha halisi ya mahitaji na msisitizo wa umilikaji wa Nabali.
- source_word: מֵימַי
  choice: maji yangu
  rationale: Tafsiri halisi inafaa katika orodha hii ya vitu na inahifadhi msisitizo wa Nabali kwamba vitu hivyo ni vyake.
- source_word: טִבְחָתִי ... טָבַחְתִּי
  choice: nyama yangu niliyowachinjia
  rationale: Muunganiko wa nomino na kitenzi vya mzizi wa kuchinja unaonyesha nyama iliyoandaliwa kwa kuchinja. Kiswahili cha asili kinaweza kuwasilisha tendo na kusudi kwa “nyama yangu niliyowachinjia” bila kurudia mzizi kwa namna isiyo ya kawaida.
- source_word: לְגֹזְזָי
  choice: wakataji wangu wa manyoya ya kondoo
  rationale: Kirai kinamaanisha watu wa kazi waliokuwa wakikata manyoya ya kondoo. Ufafanuzi wa “wa manyoya ya kondoo” unaondoa utata kwa msomaji wa kawaida.
- source_word: וְנָתַתִּי
  choice: kisha niwape
  rationale: Hili linaendeleza swali la balagha kwa Kiswahili cha kawaida. Kiambishi “-wa-” kinarejelea watu wanaopewa vitu vilivyotajwa.
- source_word: לָאֲנָשִׁים
  choice: watu
  rationale: Ingawa אֲנָשִׁים ni wingi wa kiume, “watu” ni tafsiri ya kawaida na ya heshima katika Kiswahili; muktadha unaonyesha ni wanaume wa Daudi.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי
  choice: ambao sijui
  rationale: Huhifadhi dai la Nabali kwamba hawajui watu hao, kwa muundo wa kawaida wa Kiswahili.
- source_word: אֵי מִזֶּה הֵמָּה
  choice: wametoka wapi
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuuliza asili au walikotoka, na inahifadhi maana ya nahau ya Kiebrania.
