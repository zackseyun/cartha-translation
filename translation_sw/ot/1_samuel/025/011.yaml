  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya kawaida na yenye heshima. Swali la balagha limehifadhi ghadhabu na ubinafsi wa Nabali kwa kurudia “wangu/yangu.” Alama zote za tanbihi zimewekwa katika matini.
