base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/030.yaml
  text: And when Yahweh has done for my lord according to all the good that he spoke concerning you[a], and has appointed you ruler over Israel[b],
translation:
  language: sw
  text: Na itakuwa kwamba Yahweh atakapomtendea bwana wangu mema yote aliyoyasema kukuhusu[a], na atakapokuweka kuwa mtawala juu ya Israeli[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mema aliyokuahidi.” Kiebrania kinasema kihalisi “mema” ambayo Yahweh alisema kumhusu Daudi.
    reason: lexical_alternative
  - marker: b
    text: Au, “atakapokuamuru” au “atakapokupa jukumu la kuwa kiongozi juu ya Israeli.” Kitenzi kinaweza kumaanisha “kuamuru,” lakini hapa yaelekea kinamaanisha kumweka au kumpa rasmi mamlaka ya kutawala.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Na itakuwa kwamba ... atakap(o)-
  rationale: Muundo huu unaanzisha jambo la wakati ujao; tafsiri hii hudumisha maana hiyo na inaunganisha kwa kawaida na sentensi inayoendelea katika mstari unaofuata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: לַאדֹנִי
  choice: bwana wangu
  rationale: Ni namna ya heshima ambayo Abigaili anatumia kumsemesha Daudi; hapa si jina la Mungu.
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר אֶת הַטּוֹבָה עָלֶיךָ
  choice: mema yote aliyosema juu yako
  rationale: Inafuata kwa karibu usemi wa Kiebrania bila kubadili kitenzi 'alisema' kiwe 'aliahidi,' ingawa muktadha unahusu mema yaliyoahidiwa.
- source_word: וְצִוְּךָ
  choice: na atakapokuweka
  rationale: Ingawa kitenzi mara nyingi humaanisha kuamuru, pamoja na לְנָגִיד hapa kinaweza kueleza kuwekwa au kupewa rasmi mamlaka.
- source_word: לְנָגִיד
  choice: kuwa mtawala
  rationale: Neno hili humaanisha kiongozi aliyewekwa katika mamlaka; 'mtawala' linafaa katika muktadha wa utawala juu ya Israeli.
- source_word: עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: Kihusishi kinaonyesha mamlaka ya kutawala watu wa Israeli.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; 'Yahweh' hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya וְצִוְּךָ katika kuwekwa kuwa נָגִיד
  choice: atakapokuweka kuwa mtawala
  alternative: atakapokuamuru/atakapokupa jukumu la kuwa kiongozi
  rationale: Tafsiri kuu inaonyesha uteuzi wa Daudi katika mamlaka, huku tanbihi ikihifadhi maana pana ya kitenzi cha Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Aya imeachwa ikiishia kwa koma kwa sababu sentensi inaendelea katika mstari unaofuata. 'Bwana wangu' ni namna ya heshima kwa Daudi, huku 'Yahweh' likiwa jina la Mungu.
