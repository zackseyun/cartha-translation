  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּ֣מָת שְׁמוּאֵ֔ל וַ/יִּקָּבְצ֤וּ כָל יִשְׂרָאֵל֙ וַ/יִּסְפְּדוּ ל֔/וֹ וַ/יִּקְבְּרֻ֥/הוּ בְּ/בֵית֖/וֹ בָּ/רָמָ֑ה וַ/יָּ֣קָם דָּוִ֔ד וַ/יֵּ֖רֶד אֶל מִדְבַּ֥ר פָּארָֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/001.yaml
  text: Samuel died[a], and all Israel gathered and mourned for him, and they buried him at his house in Ramah. Then David arose and went down to the wilderness of Paran.
translation:
  language: sw
  text: Samweli akafa, na Israeli wote wakakusanyika na kumwombolezea[a]. Wakamzika nyumbani kwake huko Rama. Kisha Daudi akaondoka, akashuka kwenda katika nyika ya Parani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumlilia kwa maombolezo.” Kitenzi cha Kiebrania kinarejelea desturi za kumwombolezea mtu aliyekufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת שְׁמוּאֵל
  choice: Samweli akafa
  rationale: Muundo huu unatafsiri moja kwa moja kifo cha Samweli na kuendeleza simulizi kwa mtiririko wa kawaida wa Kiswahili bila kuongeza neno la wakati lisilokuwapo wazi katika Kiebrania.
- source_word: וַיִּקָּבְצוּ כָל יִשְׂרָאֵל
  choice: Israeli wote wakakusanyika
  rationale: Neno “Israeli” linahifadhi usemi wa pamoja unaolirejelea taifa zima, na “wakakusanyika” ni tafsiri ya kawaida ya kitenzi hiki katika muktadha.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: kumwombolezea[a]
  rationale: Kitenzi kinamaanisha kufanya maombolezo kwa ajili ya mtu aliyekufa; “kumwombolezea” ni cha asili, chenye heshima, na kinadokeza maombolezo rasmi kuliko huzuni ya moyoni pekee.
- source_word: וַיִּקְבְּרֻהוּ בְּבֵיתוֹ בָּרָמָה
  choice: Wakamzika nyumbani kwake huko Rama
  rationale: “Nyumbani kwake” huhifadhi usemi wa Kiebrania bila kulazimisha hitimisho kwamba alizikwa ndani ya jengo lenyewe; “huko Rama” huonyesha mahali kwa Kiswahili cha kawaida.
- source_word: וַיָּקָם דָּוִד
  choice: Kisha Daudi akaondoka
  rationale: Katika simulizi, kitenzi hiki huanzisha hatua inayofuata ya kwenda mahali; “akaondoka” ni cha asili kuliko tafsiri halisi “akasimama” katika muktadha huu.
- source_word: וַיֵּרֶד אֶל מִדְבַּר פָּארָן
  choice: akashuka kwenda katika nyika ya Parani
  rationale: “Akashuka” huhifadhi maana ya mwelekeo wa ירד, huku “nyika” ikifaa kwa eneo lisilokaliwa sana kuliko “jangwa,” ambalo linaweza kudokeza eneo la mchanga tu.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na wa heshima. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili: Samweli, Israeli, Rama, Daudi, na Parani. Alama ya tanbihi imewekwa baada ya “kumwombolezea,” ambako ndiko tofauti ya kileksika inakohusika.'
