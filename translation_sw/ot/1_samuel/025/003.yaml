base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/003.yaml
  text: The man's name was Nabal[a], and his wife's name was Abigail. The woman was intelligent and beautiful in appearance, but the man was harsh and evil in his dealings; he was a Calebite.
translation:
  language: sw
  text: Jina la mtu huyo lilikuwa Nabali, na jina la mke wake lilikuwa Abigaili. Mwanamke huyo alikuwa mwenye akili na mwenye sura nzuri, lakini mwanamume huyo alikuwa mkali na mwovu katika matendo yake; alikuwa wa ukoo wa Kalebu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania huenda kinamaanisha “Mkalebu,” yaani mtu wa ukoo wa Kalebu. Umbo lililoandikwa si la kawaida, na wengine huona kuwa linaweza kusomwa kwa njia nyingine.
    reason: textual_variant
lexical_decisions:
- source_word: נָבָל
  choice: Nabali
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida na inayotamkika kwa urahisi katika Kiswahili.
- source_word: אֲבִגָיִל
  choice: Abigaili
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: טוֹבַת שֶׂכֶל
  choice: mwenye akili
  rationale: Kirai hiki humaanisha kuwa na ufahamu au busara nzuri; ‘mwenye akili’ ni Kiswahili cha kawaida kinachohifadhi sifa hiyo.
- source_word: וִיפַת תֹּאַר
  choice: mzuri wa sura
  rationale: Huhusu uzuri wa mwonekano au umbo; ‘mzuri wa sura’ ni usemi wa asili na wenye heshima katika Kiswahili.
- source_word: קָשֶׁה
  choice: mkali
  rationale: Katika muktadha huu neno linaeleza tabia ngumu na kali katika mahusiano, si ugumu wa kimwili.
- source_word: רַע מַעֲלָלִים
  choice: mwovu katika matendo yake
  rationale: מַעֲלָלִים hurejelea matendo, mwenendo, au vitendo; tafsiri hii inaweka wazi ubaya wa mwenendo wake bila kuongeza maelezo yasiyomo.
- source_word: כלבו
  choice: Mkalebu
  rationale: Usomaji wa kimapokeo unaelewa neno hili kuwa jina la ukoo, yaani mtu wa ukoo wa Kalebu; umbo lisilo la kawaida linaelezwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya וְהוּא כלבו
  choice: alikuwa Mkalebu
  alternative: alikuwa wa ukoo wa Kalebu; umbo lililoandikwa linaweza kusomwa kwa njia nyingine
  rationale: Hili hasa ni suala la maandishi na msamiati. Usomaji wa kimapokeo kama jina la ukoo unafaa muktadha, lakini hali isiyo ya kawaida ya umbo la Kiebrania haipaswi kufichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unafuata kwa karibu utofautishaji wa mwanamke na mwanamume katika Kiebrania huku ukisomeka kwa kawaida.
