base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/007.yaml
  text: And now I have heard that you have shearers. Now your shepherds[a], who were with us, we did not mistreat, and nothing of theirs was missing all the days they were in Carmel.
translation:
  language: sw
  text: Na sasa nimesikia kwamba una watu wanaowakata kondoo wako manyoya. Sasa, wachungaji wako waliokuwa pamoja nasi, hatukuwatendea vibaya[a], wala hakuna chochote chao kilichokosekana siku zote walipokuwa Karmeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya moja kwa moja zaidi, “hatukuwafedhehesha.” Neno la Kiebrania linaweza kumaanisha kusababisha aibu au fedheha; katika muktadha huu linarejelea kutowadhuru au kutowatendea vibaya wachungaji wa Nabali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sasa
  rationale: Ni kiashiria cha mpito kinacholeta ombi la sasa; Kiswahili hakihitaji kuongeza kiunganishi ili sentensi iwe ya kawaida.
- source_word: שָׁמַעְתִּי
  choice: nimesikia
  rationale: Kauli timilifu ya Kiswahili inaonyesha habari iliyopatikana karibuni na yenye umuhimu kwa wakati wa kusema.
- source_word: גֹזְזִים לָךְ
  choice: una watu wanaokata manyoya ya kondoo wako
  rationale: Kirai cha Kiebrania kinarejelea watu wanaomfanyia Nabali kazi ya kukata manyoya katika majira hayo; tafsiri hii ni wazi kwa msomaji wa kawaida bila kuongeza wazo lisilokuwapo la umiliki wa wakata-manyoya.
- source_word: עַתָּה
  choice: Basi sasa
  rationale: Inahifadhi kutajwa kwa pili kwa 'sasa' na kuonyesha hatua inayofuata katika hoja ya Daudi.
- source_word: הָרֹעִים אֲשֶׁר לְךָ
  choice: wachungaji wako
  rationale: Umilikaji wa Kiswahili unawakilisha kwa kawaida 'wachungaji walio wako'.
- source_word: הָיוּ עִמָּנוּ
  choice: waliokuwa pamoja nasi
  rationale: Inafuata maana ya uhusiano ya עִם bila kudai kwamba waliishi au walikaa mahali pamoja.
- source_word: לֹא הֶכְלַמְנוּם
  choice: hatukuwatendea vibaya[a]
  rationale: Katika muktadha wa ulinzi wa wachungaji, usemi huu unaeleza kwamba hawakudhulumiwa; tanbihi inahifadhi maana halisi zaidi ya kuwasababishia aibu au fedheha.
- source_word: וְלֹא נִפְקַד לָהֶם מְאוּמָה
  choice: wala hakuna chochote chao kilichokosekana
  rationale: Kitenzi cha Niphal kinaonyesha kitu kutokuwapo au kukosekana. 'Chochote chao' huweka wazi kwamba mali ya wachungaji ndiyo inayozungumziwa.
- source_word: כָּל יְמֵי הֱיוֹתָם
  choice: siku zote walizokuwa
  rationale: Inahifadhi taswira ya muda ya Kiebrania huku ikiwa Kiswahili cha kawaida.
- source_word: בַּכַּרְמֶל
  choice: Karmeli
  rationale: Hili ni jina la mahali huko Yuda, si nomino ya kawaida yenye maana ya shamba au bustani.
