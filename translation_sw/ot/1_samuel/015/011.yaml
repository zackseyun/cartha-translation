base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/011.yaml
  text: I regret that I made Saul king[a], because he has turned back from following me and has not carried out my words. And Samuel burned with anger[d][c][b], and he cried out to Yahweh all night.
translation:
  language: sw
  text: “Ninajuta kwamba nilimweka Sauli kuwa mfalme[a], kwa sababu ameacha kunifuata[b] na hakuyatekeleza maneno yangu[c].” Samweli akawaka kwa hasira[d], akamlilia Yahwe usiku kucha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ninasikitika kwamba nilimweka Sauli kuwa mfalme,” au “Nimebadili nia kuhusu kumweka Sauli kuwa mfalme.” Kiebrania kinaonyesha majuto na huzuni ya Yahwe kwa kumweka Sauli kuwa mfalme.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “amerudi nyuma kutoka kunifuata”; hii ni nahau ya kugeuka na kuacha kumfuata Yahwe.
    reason: lexical_alternative
  - marker: c
    text: Au, “hakuyatimiza maneno yangu” au “hakuyatii maneno yangu.”
    reason: lexical_alternative
  - marker: d
    text: Nahau ya Kiebrania ni “Samweli akawaka kwa hasira.” Kutokana na muktadha, wengine huielewa pia kuwa Samweli alihuzunika au alichukizwa sana.
    reason: alternative_reading
lexical_decisions:
- source_word: נִחַמְתִּי
  choice: Ninajuta
  rationale: Kitenzi cha Kiebrania katika kauli hii kinaonyesha majuto na huzuni ya Mungu kuhusu ufalme wa Sauli. “Ninajuta” kinadumisha uzito na mvutano wa kauli hiyo bila kudokeza moja kwa moja kwamba Mungu alitenda dhambi.
- source_word: הִמְלַכְתִּי אֶת־שָׁאוּל לְמֶלֶךְ
  choice: nilimweka Sauli kuwa mfalme
  rationale: Kauli hii ina maana ya kumsimika au kumfanya mtu awe mfalme. “Nilimweka Sauli kuwa mfalme” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: שָׁב מֵאַחֲרַי
  choice: ameacha kunifuata
  rationale: Nahau hii ina maana ya kugeuka na kuacha kumfuata mtu. Tafsiri hii inaeleza kwa kawaida kuvunjika kwa uaminifu wa Sauli, huku maana halisi ikihifadhiwa katika tanbihi.
- source_word: וְאֶת־דְּבָרַי לֹא הֵקִים
  choice: na hakuyatekeleza maneno yangu
  rationale: הֵקִים inapohusishwa na “maneno” humaanisha kuyatimiza au kuyafanya yatendeke. “Kuyatekeleza” kinahifadhi wazo la kuyafanya maagizo ya Mungu kwa vitendo.
- source_word: וַיִּחַר לִשְׁמוּאֵל
  choice: Samweli akawaka hasira
  rationale: Tafsiri hii inadumisha taswira ya nahau ya Kiebrania ya hasira kuwaka, badala ya kuipunguza kuwa huzuni pekee.
- source_word: וַיִּזְעַק אֶל־יְהוָה
  choice: akamlilia Yahwe
  rationale: זעק huonyesha kilio kikali cha dhiki au ombi la haraka. “Akamlilia” kinaonyesha kwamba Samweli alimwelekea Yahwe kwa kilio hicho.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa na cheo kama “BWANA.”
- source_word: כָּל־הַלַּיְלָה
  choice: usiku kucha
  rationale: Hii ni nahau ya kawaida ya Kiswahili inayowasilisha muda wote wa usiku.
theological_decisions:
- issue: Maana ya נִחַמְתִּי inaposemwa na Mungu
  choice: Ninajuta
  alternative: Ninasikitika; nimebadili nia
  rationale: Tafsiri inahifadhi kauli halisi ya majuto na huzuni ya Mungu pamoja na mvutano wake wa kitheolojia, bila kuifafanua kana kwamba Mungu alifanya kosa la kimaadili.
- issue: Hisia za Samweli katika וַיִּחַר לִשְׁמוּאֵל
  choice: Samweli akawaka hasira
  alternative: Samweli akahuzunika sana; Samweli akachukizwa
  rationale: Nahau ya Kiebrania kwa kawaida huonyesha hasira inayowaka. Muktadha unaweza pia kuhusisha huzuni au kukerwa sana, lakini maana hiyo mbadala imewekwa katika tanbihi badala ya kuchukua nafasi ya nguvu ya kisemantiki ya maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida. “Yahwe” limetumiwa kama umbo la Kiswahili la jina la Mungu, na “usiku kucha” kama nahau asilia ya muda wote wa usiku.
