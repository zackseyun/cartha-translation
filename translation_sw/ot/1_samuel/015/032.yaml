translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa lakini yenye staha. Muundo wa masimulizi ni mwepesi kueleweka, huku usemi ‘uchungu wa kifo’ ukihifadhi taswira na mvutano wa Kiebrania. Alama ya tanbihi imewekwa moja kwa moja baada ya tafsiri ya neno lenye utata.
