base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/032.yaml
  text: Then Samuel said[a], “Bring Agag king of Amalek to me.” And Agag came to him trembling, and Agag said, “Surely the bitterness of death has turned aside.”
translation:
  language: sw
  text: Ndipo Samweli akasema, “Mleteni kwangu Agagi, mfalme wa Waamaleki.” Agagi akamjia kwa madaha[a], Agagi akasema, “Hakika uchungu wa kifo umeondoka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania hapa halina maana iliyo hakika. Linaweza kueleweka kuwa Agagi alikuja kwa madaha au kwa kujiamini; kwa ufafanuzi mwingine hutafsiriwa, “akiwa amefungwa minyororo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּישׁוּ
  choice: Mleteni kwangu
  rationale: Kitenzi cha Hifili katika hali ya amri ya wingi kinawaagiza wahudumu wamsogeze Agagi mbele ya Samweli. ‘Mleteni kwangu’ ni Kiswahili cha kawaida kinachohifadhi nguvu ya amri.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: Agagi, mfalme wa Waamaleki
  rationale: ‘Agagi’ ni umbo la jina linalotumika kwa kawaida katika Kiswahili cha Biblia. Ingawa Kiebrania kinasema kihalisi ‘mfalme wa Amaleki,’ ‘mfalme wa Waamaleki’ hutambulisha kwa uwazi watu aliowatawala.
- source_word: וַיֵּלֶךְ אֵלָיו
  choice: akamjia
  rationale: Kitenzi kina maana ya kwenda au kuja kwa mtu. Kwa kuwa Samweli alikuwa amesema ‘kwangu,’ ‘akamjia’ ni mtazamo wa kawaida wa Kiswahili bila kubadili maana.
- source_word: מַעֲדַנֹּת
  choice: akitetemeka
  rationale: Neno hili la Kiebrania ni gumu na maana yake inabishaniwa. ‘Akitetemeka’ hufuata ufafanuzi wa kale unaoelewa Agagi kuwa alikuja kwa hofu; tanbihi inahifadhi maana nyingine zinazowezekana.
- source_word: אָכֵן
  choice: Hakika
  rationale: Neno hili linasisitiza kauli ya Agagi; ‘Hakika’ linafaa kwa kauli ya uhakika au hitimisho thabiti.
- source_word: סָר
  choice: umeondoka
  rationale: Kitenzi סור humaanisha kuondoka au kugeuka kando. ‘Umeondoka’ kinahifadhi sitiari ya tishio la kifo lililopita.
- source_word: מַר הַמָּוֶת
  choice: uchungu wa kifo
  rationale: Tafsiri hii ya karibu inahifadhi usemi wa Kiebrania na uzito wake bila kuufafanua kupita kiasi.
