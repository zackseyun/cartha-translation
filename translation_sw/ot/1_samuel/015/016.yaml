  text: Then Samuel said to Saul[a], “Stop, and I will tell you what Yahweh said to me last night.” And he said to him, “Speak.”
translation:
  language: sw
  text: Ndipo Samweli akamwambia Sauli, “Nyamaza, nami nitakuambia yale ambayo Yahweh aliniambia usiku uliopita.” Sauli akamwambia[a], “Sema.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Umbo lililoandikwa katika Kiebrania ni “nao wakamwambia”; lakini muktadha unaonyesha kwamba msemaji ni Sauli, kwa hiyo maana ni ya umoja: “Sauli akamwambia.”'
    reason: textual_variant
lexical_decisions:
- source_word: הֶרֶף
  choice: Nyamaza
  rationale: Amri hii kali inamtaka Sauli aache kusema. “Nyamaza” ni ya kawaida, fupi, na inafaa sauti ya kukemea katika muktadha huu.
- source_word: וְאַגִּידָה לְּךָ
  choice: nami nitakuambia
  rationale: Hifili ya נגד ina maana ya kutangaza au kumwambia mtu jambo; wakati ujao wa Kiswahili unaonyesha kwa kawaida kusudi la Samweli baada ya amri hiyo.
- source_word: אֵת אֲשֶׁר דִּבֶּר
  choice: yale ambayo ... aliniambia
  rationale: Muundo huu unarejelea yaliyomo katika maneno ya Mungu. “Yale ambayo ... aliniambia” ni Kiswahili cha kawaida na kinahifadhi uhusiano wa moja kwa moja na mpokeaji.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa kutamkwa kama Yahweh badala ya kubadilishwa kuwa cheo.
- source_word: הַלָּיְלָה
  choice: usiku uliopita
  rationale: Kwa kuwa kitenzi kinarejelea jambo lililokwisha kusemwa, neno hili linaonyesha usiku uliotangulia wakati wa mazungumzo.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: Naye akamwambia
  rationale: Ingawa umbo lililoandikwa katika Kiebrania ni la wingi, muktadha unamtambulisha Sauli mmoja kuwa anayemjibu Samweli; tafsiri ya umoja inaleta maana inayokusudiwa huku tanbihi ikihifadhi ushahidi wa umbo lililoandikwa.
- source_word: דַּבֵּר
  choice: Sema
  rationale: Amri hii fupi inamruhusu Samweli aendelee kusema; “Sema” huhifadhi ufupi na uwazi wa Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: “Yahweh” linahifadhi jina binafsi la Mungu katika maandishi bila kulibadilisha kuwa cheo, wala kuongeza dai la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nyamaza” huhifadhi ukali wa amri; sentensi nyingine zimetungwa kwa mtiririko wa kawaida bila kuficha tofauti ya kimaandishi.
