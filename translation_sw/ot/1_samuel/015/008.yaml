base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/008.yaml
  text: He captured Agag king of Amalek alive[a], and devoted all the people to destruction with the edge of the sword.
translation:
  language: sw
  text: Akamkamata Agagi, mfalme wa Amaleki, akiwa hai, naye akawaangamiza kabisa watu wote kwa makali ya upanga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawaweka watu wote wakfu kwa maangamizi.” Kitenzi cha Kiebrania humaanisha kuweka kitu chini ya marufuku maalumu ili kiangamizwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: akamkamata
  rationale: Kitenzi hiki humaanisha kumtia mtu mikononi au kumkamata; “akamkamata” ni cha kawaida na kinafaa katika muktadha wa vita.
- source_word: אֲגַג
  choice: Agagi
  rationale: Jina la mtu limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: מֶלֶךְ עֲמָלֵק
  choice: mfalme wa Amaleki
  rationale: Huhifadhi uhusiano wa moja kwa moja wa muundo wa Kiebrania na ni usemi wa kawaida wa Kiswahili.
- source_word: חָי
  choice: akiwa hai
  rationale: Hueleza kwamba Agagi alikamatwa hai badala ya kuuawa.
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: עָם kwa kawaida humaanisha “watu”; tafsiri hii haiibani maana iwe wanajeshi pekee wala kuipanua kwa maelezo yasiyokuwapo.
- source_word: הֶחֱרִים
  choice: akawaangamiza kabisa
  rationale: Katika muktadha huu kitenzi kinamaanisha kuweka chini ya ḥerem na hivyo kuangamiza. Usemi huu ni wa asili na unaeleweka kwa urahisi katika Kiswahili; tanbihi inahifadhi dhana maalumu ya kuwekwa wakfu kwa maangamizi.
- source_word: לְפִי חָרֶב
  choice: kwa makali ya upanga
  rationale: Ni ulinganifu wa kawaida wa nahau ya Kiebrania, ambayo kwa maana halisi ni “kwa kinywa cha upanga,” na huhifadhi taswira yake.
theological_decisions:
- issue: Tafsiri ya lugha ya vita ya חרם
  choice: akawaangamiza kabisa watu wote
  alternative: akawaweka watu wote chini ya marufuku ya maangamizi
  rationale: Tafsiri iliyochaguliwa inaeleza matokeo ya kitenzi kwa Kiswahili cha kawaida bila kufanya istilahi nzito kuwa fundisho la dhehebu fulani. Tanbihi inaonyesha kwamba neno la Kiebrania lina uzito maalumu wa kuweka kitu wakfu au chini ya marufuku kwa kusudi la kuangamizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Lakini” linaonyesha tofauti iliyomo kati ya kumwacha Agagi hai na kuwaangamiza wengine, bila kuongeza hitimisho la kitheolojia.
