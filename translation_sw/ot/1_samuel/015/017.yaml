base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/017.yaml
  text: And Samuel said[a], “Though you were small in your own eyes, were you not the head of the tribes of Israel? And Yahweh anointed you king over Israel.”
translation:
  language: sw
  text: Samweli akasema[a], “Ingawa ulikuwa mdogo machoni pako mwenyewe, je, hukuwa mkuu wa makabila ya Israeli? Na Yahwe akakutia mafuta kuwa mfalme juu ya Israeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hata kama ulikuwa mdogo machoni pako mwenyewe.” Kiebrania kinaweza kueleweka kwa tofauti ndogo ya maana, lakini wazo ni kwamba Sauli alijiona kuwa wa hali ya chini.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: je, hukuwa
  rationale: Huanzisha swali la balagha linalotarajia jibu la kukubali; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: אִם קָטֹן אַתָּה בְּעֵינֶיךָ
  choice: Ingawa ulikuwa mdogo machoni pako mwenyewe
  rationale: Inahifadhi taswira ya Kiebrania kuhusu kujiona kuwa wa hali ya chini, huku ‘ingawa’ ikitoa maana ya kukubali hali fulani iliyo kinyume na cheo alichopewa Sauli.
- source_word: קָטֹן
  choice: mdogo
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi sitiari ya udogo bila kuifasiri kupita kiasi kuwa unyenyekevu au kutokuwa na umuhimu pekee.
- source_word: בְּעֵינֶיךָ
  choice: machoni pako mwenyewe
  rationale: Inahifadhi nahau ya Kiebrania na kuweka wazi kwamba ni jinsi Sauli alivyojiona mwenyewe.
- source_word: רֹאשׁ שִׁבְטֵי יִשְׂרָאֵל
  choice: mkuu wa makabila ya Israeli
  rationale: ‘Mkuu’ huwasilisha kwa Kiswahili cha kawaida maana ya kichwa, kiongozi, au mwenye cheo cha juu, bila kutumia usemi usio wa kawaida ‘kichwa cha makabila.’
- source_word: וַיִּמְשָׁחֲךָ
  choice: akakutia mafuta
  rationale: Inahifadhi tendo halisi la kumtia mtu mafuta kwa ajili ya ufalme, badala ya kulifanya kuwa uteuzi wa kawaida tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni umbo la Kiswahili la jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: uwe mfalme juu ya Israeli
  rationale: Huonyesha kusudi na matokeo ya kutiwa mafuta, huku ‘juu ya Israeli’ ikifuatilia kwa karibu uhusiano unaoonyeshwa na Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Aya inatumia jina binafsi la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kuweka cheo mahali pake.
- issue: Maana ya kutiwa mafuta kwa Sauli
  choice: akakutia mafuta uwe mfalme
  alternative: akakuteua kuwa mfalme
  rationale: Tafsiri iliyochaguliwa inahifadhi tendo la kifalme na umuhimu wake wa kitheolojia bila kulipunguza kuwa uteuzi wa kiutawala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Nahau ‘mdogo machoni pako mwenyewe’ imehifadhiwa kwa kuwa inaeleweka katika muktadha; ‘mkuu wa makabila’ limetumiwa badala ya tafsiri ngumu ya neno kwa neno ‘kichwa cha makabila.’
