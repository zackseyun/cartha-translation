lexical_decisions:
- source_word: וַיַּךְ
  choice: akawashambulia
  rationale: Kitenzi נכה kinaweza kumaanisha kupiga, kushambulia, au kushinda. Katika muktadha wa vita, “akawashambulia” ni Kiswahili cha kawaida na hakidai kwa namna isiyo ya lazima kwamba ushindi wote umeelezwa katika kishazi hiki.
- source_word: עֲמָלֵק
  choice: Waamaleki
  rationale: Jina la umoja “Amaleki” limetumiwa kwa maana ya pamoja, likiwakilisha watu waliotokana naye. “Waamaleki” huwasilisha maana hiyo kwa Kiswahili cha kawaida; tanbihi huhifadhi umbo halisi la Kiebrania.
- source_word: מֵחֲוִילָה
  choice: kutoka Havila
  rationale: Kihusishi מִן kinaonyesha mahali ambapo eneo linalotajwa linaanzia.
- source_word: בּוֹאֲךָ
  choice: mpaka njia iendayo
  rationale: Hii ni nahau ya kijiografia yenye maana ya “unapoelekea” au “njiani kuelekea.” Muundo huu ni wa asili katika Kiswahili na unaonyesha kikomo cha eneo pamoja na mwelekeo wa kwenda Shuri.
- source_word: שׁוּר
  choice: Shuri
  rationale: Jina la mahali limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרָיִם
  choice: iliyo mkabala na Misri
  rationale: Kirai עַל־פְּנֵי kinaweza kueleza mahali palipo mbele ya, panapokabili, au mkabala na sehemu nyingine. “Mkabala na Misri” huhifadhi uhusiano wa kijiografia bila kubainisha upande wa dira usiotajwa wazi.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
