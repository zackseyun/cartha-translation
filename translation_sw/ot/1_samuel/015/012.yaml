  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfululizo wa vitenzi vya wakati uliopita umetumiwa kwa mtiririko wa simulizi, huku “amefika” na “amejisimamishia” zikihifadhi hali ya matokeo inayosisitizwa katika taarifa kwa Samweli.
