base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/012.yaml
  text: Samuel rose early in the morning to meet Saul[a], and it was reported to Samuel, saying, “Saul came to Carmel, and look, he has set up a monument for himself; then he turned and passed on and went down to Gilgal.”
translation:
  language: sw
  text: 'Samweli akaamka asubuhi na mapema kwenda kukutana na Sauli. Kisha Samweli akaambiwa hivi: “Sauli amefika Karmeli, na tazama, amejisimamishia mnara wa ukumbusho[a]. Kisha akageuka, akaendelea na safari, akashuka kwenda Gilgali.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “mkono kwa ajili yake mwenyewe.” Hapa “mkono” ni nahau inayomaanisha alama au mnara wa ukumbusho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: akaamka asubuhi na mapema
  rationale: Kirai hiki cha kawaida katika Kiswahili kinaonyesha wazi kwamba Samweli aliamka mapema wakati wa asubuhi, bila kurudia maneno kwa njia isiyo ya asili.
- source_word: לִקְרַאת שָׁאוּל
  choice: kwenda kukutana na Sauli
  rationale: Muundo huu unaonyesha kusudi la kuamka kwake na pia wazo la kuelekea mahali ili akutane na Sauli.
- source_word: וַיֻּגַּד לִשְׁמוּאֵל לֵאמֹר
  choice: Kisha Samweli akaambiwa hivi
  rationale: Kauli tendwa inahifadhi ukweli kwamba mtoa habari hajatajwa; “hivi” huanzisha taarifa iliyonukuliwa kwa Kiswahili cha kawaida.
- source_word: בָּא שָׁאוּל הַכַּרְמֶלָה
  choice: Sauli amefika Karmeli
  rationale: “Amefika” huwasilisha kwa ufasaha mwendo kuelekea Karmeli na hali ya kuwa amewasili katika taarifa inayotolewa.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: “Tazama” inadumisha nguvu ya chembe ya Kiebrania inayovuta fikira, huku ikibaki katika sajili yenye heshima ya Biblia.
- source_word: מַצִּיב לוֹ יָד
  choice: amejisimamishia mnara wa ukumbusho[a]
  rationale: Katika muktadha huu יָד, ingawa maana yake ya kawaida ni “mkono,” ni nahau ya alama au mnara wa ukumbusho. Kiambishi “-ji-” pamoja na “-ia” kinaonyesha kwamba Sauli aliusimamisha kwa ajili yake mwenyewe.
- source_word: וַיִּסֹּב וַיַּעֲבֹר
  choice: Kisha akageuka, akaendelea na safari
  rationale: Tafsiri hii huhifadhi mfuatano wa kugeuka na kuendelea mbele bila kutoa dhana isiyo ya lazima kwamba alipita karibu na kitu fulani.
- source_word: וַיֵּרֶד הַגִּלְגָּל
  choice: akashuka kwenda Gilgali
  rationale: “Akashuka” huhifadhi wazo la mteremko wa kijiografia, na “kwenda Gilgali” huonyesha wazi mahali alipoelekea.
