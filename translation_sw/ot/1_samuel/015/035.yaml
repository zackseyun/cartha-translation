base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/035.yaml
  text: And Samuel did not see Saul again until the day of his death[a], for Samuel mourned over Saul. And Yahweh regretted that he had made Saul king over Israel.
translation:
  language: sw
  text: Samueli hakumwona Sauli tena mpaka siku ya kufa kwake, kwa maana Samueli alimwombolea Sauli. Naye Yahwe alijuta[a] kwa kuwa alikuwa amemweka Sauli kuwa mfalme juu ya Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alihuzunika” au “akabadili nia.” Kitenzi cha Kiebrania kinaweza kuwa na maana mbalimbali kulingana na muktadha; hapa kinaeleza huzuni au majuto ya Yahwe kwa kuwa alikuwa amemweka Sauli kuwa mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַף ... לִרְאוֹת
  choice: hakumwona ... tena
  rationale: Muundo huu wa Kiebrania wenye kukanusha unamaanisha kutofanya jambo tena. Kiswahili hiki ni cha kawaida na huhifadhi maana ya nahau hiyo.
- source_word: לִרְאוֹת אֶת שָׁאוּל
  choice: kumwona Sauli
  rationale: Kitenzi ראה kwa msingi ni ‘kuona.’ Ingawa muktadha unadokeza kutokutana naye tena ana kwa ana, ‘kumwona Sauli’ huhifadhi maana ya moja kwa moja.
- source_word: עַד יוֹם מוֹתוֹ
  choice: mpaka siku ya kufa kwake
  rationale: Tafsiri hii huhifadhi muundo na uzito wa usemi wa Kiebrania, pamoja na kutotaja wazi kiwakilishi ‘-ke’ kinamhusu nani.
- source_word: הִתְאַבֵּל
  choice: alimwombolezea
  rationale: Kitenzi hiki humaanisha kuomboleza. ‘Alimwombolezea’ kinaonyesha huzuni ya Samueli kuhusu Sauli kwa Kiswahili cha kawaida.
- source_word: אֶל שָׁאוּל
  choice: Sauli
  rationale: Pamoja na kitenzi cha kuomboleza, kiambishi cha yambwa na jina ‘Sauli’ huwasilisha kwa kawaida yule ambaye Samueli alimwombolezea.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: נִחָם
  choice: alijuta
  rationale: Katika muktadha huu, neno hilo linaeleza majuto au huzuni ya Yahwe kwa kumweka Sauli kuwa mfalme. ‘Alijuta’ huhifadhi lugha ya kihisia na mvutano wa kifundisho wa matini.
- source_word: הִמְלִיךְ
  choice: alikuwa amemweka ... kuwa mfalme
  rationale: Hifili ya מלך humaanisha kumsababisha mtu awe mfalme au kumweka kuwa mfalme; chaguo hili ni wazi na la kawaida.
- source_word: עַל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: Usemi huu unaonyesha utawala wa kifalme wa Sauli juu ya Israeli na unaakisi kihusishi cha Kiebrania.
theological_decisions:
- issue: Lugha inayomhusisha Mungu na majuto katika נִחָם
  choice: alijuta
  alternative: alihuzunika; akabadili nia
  rationale: Matini inamhusisha Yahwe moja kwa moja na נִחָם. ‘Alijuta’ huhifadhi lugha ya binafsi na ya kihisia badala ya kuipunguza kuwa mabadiliko ya kiutawala tu, bila kutatua kimya kimya mvutano wake na mafundisho mengine kuhusu kutobadilika kwa Mungu.
- issue: Mhusika anayerejelewa na kiambishi katika מוֹתוֹ
  choice: kufa kwake
  alternative: kufa kwa Samueli; kufa kwa Sauli
  rationale: Kiebrania hakitaji jina katika kirai hiki. Tafsiri haiongezi ufafanuzi usiokuwapo katika matini na hivyo huhifadhi uwezekano wa kisarufi na mjadala wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Alimwombolezea’ hudumisha uzito wa simulizi, na ‘kufa kwake’ huhifadhi kutotajwa wazi kwa mhusika katika Kiebrania.
