translation:
  language: sw
  text: Samueli alipogeuka ili aende, Sauli akashika ukingo wa joho la Samueli[a], na ukararuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pembe ya joho” au “upindo wa joho.” Neno la Kiebrania linaweza kumaanisha sehemu ya mwisho ya vazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב
  choice: alipogeuka
  rationale: Kitenzi סבב hapa kinaonyesha Samueli akigeuka akiwa tayari kuondoka; “alipogeuka” ni ya kawaida na huungana vizuri na kusudi linalofuata.
- source_word: לָלֶכֶת
  choice: ili aende
  rationale: Kitenzi-jina הלך kinaeleza kusudi la kugeuka kwa Samueli. “Ili aende” kinatoa maana hiyo moja kwa moja bila kuongeza kwamba tayari alikuwa ameondoka.
- source_word: וַיַּחֲזֵק
  choice: akashika
  rationale: Hifili ya חזק hapa ina maana ya kushika kwa nguvu. “Akashika” ni ya asili katika simulizi; muktadha wa joho kuraruka unaonyesha nguvu ya tendo hilo.
- source_word: בִּכְנַף
  choice: ukingo wa
  rationale: כָּנָף kwa vazi humaanisha sehemu yake ya mwisho, kama ukingo, pembe, au upindo. “Ukingo” ni pana na haibani maana kuwa upindo wa chini pekee.
- source_word: מְעִילוֹ
  choice: joho lake
  rationale: מְעִיל ni vazi la nje au joho. “Joho” ni neno la Kiswahili linaloeleweka na linalofaa mazingira ya simulizi.
- source_word: וַיִּקָּרַע
  choice: nao ukararuka
  rationale: Nifali hapa ina maana ya kutendeka kwa kuraruka. Kiambishi “-o” kinarejelea ukingo ulioshikwa, na “ukararuka” ni usemi wa kawaida usioeleza zaidi ya Kiebrania kilichosema.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Jina “Sauli” limewekwa wazi kama mtendaji wa tendo la kushika ili kuzuia mkanganyiko wa viambishi vya Kiswahili; muktadha wa aya zilizotangulia humtambulisha hivyo. Kauli “joho lake” inadumisha kiwakilishi cha Kiebrania badala ya kubainisha kwa jina mwenye joho.
