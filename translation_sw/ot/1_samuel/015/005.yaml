  text: Sauli akafika kwenye mji wa Amaleki[c], akavizia[a] katika korongo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaweka shambulio la kuvizia katika korongo.” Kitenzi cha Kiebrania hapa kina utata; pia kimeeleweka kuwa “akashindana” au “akapambana,” lakini muktadha unaunga mkono maana ya kuvizia.
    reason: lexical_alternative
  - marker: b
    text: “Korongo” hapa ni mkondo wa maji au korongo ambalo linaweza kuwa kavu isipokuwa wakati wa majira ya mvua.
