translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa Maandiko. “Akavizia” ni fupi na ya kawaida; tanbihi huhifadhi utata halisi wa kitenzi cha Kiebrania. “Bonde la mto” limetumiwa badala ya neno la mkopo “wadi” ili maana ya kijiografia ieleweke kwa urahisi.
