  text: וַ/יִּשְׁלָחֲ/ךָ֥ יְהוָ֖ה בְּ/דָ֑רֶךְ וַ/יֹּ֗אמֶר לֵ֣ךְ וְ/הַחֲרַמְתָּ֞ה אֶת הַֽ/חַטָּאִים֙ אֶת עֲמָלֵ֔ק וְ/נִלְחַמְתָּ֣ ב֔/וֹ עַ֥ד כַּלּוֹתָ֖/ם אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/018.yaml
  text: And Yahweh sent you on a mission and said[a], ‘Go and devote the sinners, the Amalekites, to destruction[b], and fight against them until they are consumed.’
translation:
  language: sw
  text: Yahwe akakutuma kwa utume, akasema, “Nenda ukawaweke wakfu hao wenye dhambi, yaani Waamaleki[b], kwa maangamizi[a], nawe upigane nao mpaka uwamalize kabisa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwaangamize kabisa.” Kitenzi cha Kiebrania humaanisha kuweka kitu au watu chini ya marufuku maalumu ya kuangamizwa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “wenye dhambi, Amaleki”; jina “Amaleki” linawatambulisha wale walioitwa “wenye dhambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֲךָ
  choice: akakutuma
  rationale: Kitenzi שלח kina maana ya moja kwa moja ya ‘kutuma’; umbo hili pia linaendeleza simulizi.
- source_word: בְּדָרֶךְ
  choice: kutekeleza kazi fulani
  rationale: Ingawa דֶּרֶךְ kwa kawaida ni ‘njia,’ hapa baada ya ‘kutuma’ inaonyesha shughuli au jukumu alilotumwa kulitekeleza, si safari tu.
- source_word: וְהַחֲרַמְתָּה
  choice: ukawaweke ... chini ya amri ya kuangamizwa
  rationale: Hifili ya חרם hapa ni neno maalumu la kuweka watu chini ya marufuku ya kuangamizwa. Tafsiri hii inadumisha maana hiyo badala ya kuitafsiri kama kuua tu.
- source_word: הַחַטָּאִים
  choice: wale wenye dhambi
  rationale: Inahifadhi wazi hukumu ya kimaadili iliyo katika nomino-kivumishi ya Kiebrania.
- source_word: אֶת עֲמָלֵק
  choice: yaani Waamaleki
  rationale: Kiebrania kinatumia jina la pamoja ‘Amaleki’ kumtambulisha yule anayeitwa ‘wenye dhambi’; Kiswahili cha kawaida hutaja watu hao kama Waamaleki.
- source_word: וְנִלְחַמְתָּ בוֹ
  choice: nawe upigane nao
  rationale: Kiwakilishi cha Kiebrania ni umoja kwa sababu kinarejelea kundi linaloitwa Amaleki, lakini Kiswahili hutumia wingi kwa watu wa kundi hilo.
- source_word: עַד כַּלּוֹתָם אֹתָם
  choice: mpaka watakapoangamizwa kabisa
  rationale: כלה inaonyesha kufikia mwisho kamili. Muundo wa kutendwa unasomeka kwa kawaida na unahifadhi wazo la kuangamizwa kwao kikamilifu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni, jina la agano; ‘Yahwe’ hulitaja jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kiibada na kihukumu ya חרם
  choice: chini ya amri ya kuangamizwa
  alternative: uwaangamize kabisa; uwaweke wakfu kwa kuangamizwa
  rationale: Usemi huu unaonyesha kwamba kuangamizwa kuliamriwa kama marufuku maalumu, bila kuongeza fundisho la kidhehebu au kuficha ukali wa agizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kutekeleza kazi fulani’ huwasilisha maana ya kimuktadha ya בְּדָרֶךְ; ‘yaani’ hufanya uhusiano wa kiambatisho ueleweke bila kuondoa maelezo yake katika tanbihi.
