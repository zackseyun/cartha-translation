base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/028.yaml
  text: And Samuel said to him[a], “Yahweh has torn the kingdom of Israel away from you today and has given it to your neighbor[b], who is better than you.”
translation:
  language: sw
  text: Ndipo Samweli akamwambia, “Yahwe ameurarua ufalme wa Israeli kutoka kwako leo, na amempa mwenzako[a], aliye bora kuliko wewe[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jirani yako” au “mwenzi wako.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema “bora kuliko wewe,” kikimwelezea mtu anayepewa ufalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו שְׁמוּאֵל
  choice: Ndipo Samweli akamwambia
  rationale: Muundo wa masimulizi unaendeleza tukio kutoka mstari uliotangulia. “Ndipo” ni wa kawaida katika masimulizi ya Kiswahili na “akamwambia” huwasilisha kwa ufupi maana ya ‘Samweli alisema kwake.’
- source_word: קָרַע
  choice: ameurarua ... kutoka kwako
  rationale: Kitenzi kina maana halisi ya kurarua na kinarejelea kwa makusudi vazi la Samweli lililoraruliwa katika mstari wa 27. Usemi huu unadumisha picha hiyo pamoja na wazo la ufalme kuondolewa kwa Sauli.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
- source_word: מַמְלְכוּת יִשְׂרָאֵל
  choice: ufalme wa Israeli
  rationale: Neno linaweza kumaanisha ufalme au mamlaka ya kifalme. “Ufalme wa Israeli” ni usemi wa kawaida unaohifadhi maana pana katika muktadha huu.
- source_word: מֵעָלֶיךָ
  choice: kutoka kwako
  rationale: Kirai hiki kinaonyesha kuondolewa kwa ufalme kutoka katika milki au mamlaka ya Sauli.
- source_word: הַיּוֹם
  choice: leo
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida, inayohifadhi ukaribu wa wakati wa hukumu.
- source_word: וּנְתָנָהּ
  choice: na kumpa
  rationale: Kiswahili hutaja mpokeaji kwa kiambishi cha yambwa katika “kumpa”; kitu kinachotolewa, yaani ufalme, kinaeleweka wazi kutoka kishazi kilichotangulia. Wakati timilifu unaonyesha uamuzi wa Mungu kuwa tayari umefanywa.
- source_word: לְרֵעֲךָ
  choice: jirani yako
  rationale: רֵעַ linaweza kumaanisha jirani, mwenzake, au rafiki. Hapa “jirani yako” linamtaja mtu mwingine mwenye uhusiano wa kijamii na Sauli bila kudokeza lazima urafiki wa karibu.
- source_word: הַטּוֹב מִמֶּךָּ
  choice: aliye bora kuliko wewe
  rationale: Kivumishi pamoja na muundo wa ulinganisho humwelezea mtu atakayepewa ufalme kuwa bora kuliko Sauli. “Aliye” huweka wazi uhusiano wa kisarufi bila kuongeza wazo la kustahili ambalo halijasemwa moja kwa moja.
theological_decisions:
- issue: Je, hukumu na utoaji wa ufalme vitafsiriwe kama matendo yaliyokamilika au ya wakati ujao?
  choice: 'Matendo yaliyokamilika/kimaamuzi: “ameurarua ... na kumpa”'
  alternative: 'Mtazamo wa wakati ujao: “ataurarua ... na kumpa”'
  rationale: Miundo ya Kiebrania katika tangazo hili la kinabii inawasilisha kupokonywa na kutolewa kwa ufalme kama uamuzi wa Mungu uliokwisha thibitishwa, ingawa utekelezaji wake kamili wa kihistoria utatokea baadaye. Tafsiri ya wakati timilifu inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya kisasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Taswira ya kurarua imehifadhiwa kwa sababu inaunganisha hukumu hii na tendo la mfano katika mstari uliotangulia.
