  text: Then Samuel went to Ramah[a], and Saul went up to his house in Gibeah of Saul.
translation:
  language: sw
  text: Kisha Samweli akaenda Rama, naye Sauli akapanda hadi nyumbani kwake, huko Gibea ya Sauli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maneno mengine, “Gibea ya Sauli.” Kiebrania huhifadhi jina la mahali katika muundo “Gibea ya Sauli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Kitenzi הלך katika mtiririko huu wa simulizi kina maana ya kawaida ya kwenda, na ‘akaenda’ kinaendeleza simulizi kwa Kiswahili cha asili.
- source_word: הָרָמָתָה
  choice: Rama
  rationale: Herufi ya mwelekeo mwishoni mwa jina inaonyesha kwenda kuelekea Rama; maana hiyo tayari inaonyeshwa na ‘akaenda Rama’ katika Kiswahili.
- source_word: עָלָה
  choice: akapanda kwenda
  rationale: עלה hubeba maana ya kwenda juu au kupanda. ‘Akapanda kwenda’ inadumisha dokezo hilo la kijiografia bila kuwa ngumu kueleweka.
- source_word: בֵּיתוֹ
  choice: nyumbani kwake
  rationale: Ingawa ביתו inaweza kutafsiriwa ‘nyumba yake,’ katika muktadha wa mtu kurudi mahali anapoishi, ‘nyumbani kwake’ ni Kiswahili cha kawaida na sahihi.
- source_word: גִּבְעַת שָׁאוּל
  choice: Gibea ya Sauli
  rationale: Muundo wa Kiebrania umehifadhiwa kwa jina la mahali pamoja na uhusiano wake na Sauli, bila kuamua kimya-kimya ikiwa ni umilikaji halisi au jina lililozoeleka la mahali.
