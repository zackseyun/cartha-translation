translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi, cha heshima na kinachoeleweka kwa urahisi. Kiunganishi ‘naye’ kinaonyesha kubadilika kutoka kwa Samweli kwenda kwa Sauli, na ‘huko’ kinaunganisha nyumba ya Sauli na mahali paitwapo Gibea ya Sauli.
