language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּבֹ֥א שְׁמוּאֵ֖ל אֶל שָׁא֑וּל וַ/יֹּ֧אמֶר ל֣/וֹ שָׁא֗וּל בָּר֤וּךְ אַתָּה֙ לַֽ/יהוָ֔ה הֲקִימֹ֖תִי אֶת דְּבַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/013.yaml
  text: Then Samuel came to Saul[a], and Saul said to him, “Blessed are you to Yahweh[b]; I have carried out the word of Yahweh.”
translation:
  language: sw
  text: Ndipo Samueli akaja kwa Sauli, naye Sauli akamwambia, “Umebarikiwa na Yahwe[a]! Nimetekeleza[b] neno la Yahwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ubarikiwe na Yahwe.” Tamko hili la baraka la Kiebrania linaweza kueleweka kama kutangaza baraka au kama salamu yenye maana ya kumtakia mtu baraka.
    reason: lexical_alternative
  - marker: b
    text: Au, “Nimetimiza” au “Nimefanya litimie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... אֶל
  choice: akaja kwa
  rationale: Muundo huu unaeleza kwa njia ya kawaida ya Kiswahili kwamba Samueli alifika mahali Sauli alipokuwa, bila kuongeza jambo lisilokuwamo katika Kiebrania.
- source_word: וַיֹּאמֶר לוֹ
  choice: akamwambia
  rationale: Kitenzi hiki cha Kiswahili kinajumuisha kwa kawaida maana ya ‘akamwambia yeye’ na hivyo kinahifadhi yambwa iliyo wazi katika Kiebrania.
- source_word: בָּרוּךְ אַתָּה לַיהוָה
  choice: Umebarikiwa na Yahwe
  rationale: ‘Umebarikiwa’ huhifadhi hali ya tamko la Kiebrania badala ya kuligeuza moja kwa moja kuwa ombi; ‘na Yahwe’ ni njia ya kawaida ya Kiswahili ya kumtaja Yahwe kuwa chanzo au mtendaji wa baraka.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania linatafsiriwa kwa namna ya kulitamka kama jina binafsi, si kubadilishwa na cheo ‘BWANA’.
- source_word: הֲקִימֹתִי
  choice: Nimetekeleza
  rationale: Katika muungano huu na ‘neno la Yahwe,’ kausativi ya קום ina maana ya kufanya agizo lisimame, yaani kulitekeleza. Kauli hii pia inaacha dai la Sauli lisikubalike au kukataliwa na mfasiri kabla simulizi halijafanya hivyo.
- source_word: דְּבַר יְהוָה
  choice: neno la Yahwe
  rationale: ‘Neno’ huhifadhi upana wa דָּבָר, ingawa katika muktadha huu neno hilo linahusu agizo la Mungu.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania inatumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kuliwakilisha kwa cheo.
- issue: Nguvu ya tamko בָּרוּךְ אַתָּה
  choice: Umebarikiwa
  alternative: Ubarikiwe
  rationale: Kiebrania kina umbo la tamko la hali, ingawa linaweza kufanya kazi kama salamu ya baraka. Tafsiri iliyochaguliwa huhifadhi mvutano huo bila kulifanya waziwazi kuwa ombi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa Maandiko. ‘Naye’ huonyesha wazi kwamba Sauli ndiye msemaji bila kufanya sentensi kuwa nzito. Alama zote za tanbihi zimewekwa mara baada ya maneno yanayohusika.
