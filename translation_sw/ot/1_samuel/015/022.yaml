base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/022.yaml
  text: And Samuel said, “Does the LORD delight in burnt offerings and sacrifices as much as in obeying the voice of the LORD? Look, to obey is better than sacrifice, and to listen than the fat of rams.”
translation:
  language: sw
  text: Samweli akasema, “Je, BWANA hupendezwa na sadaka za kuteketezwa na dhabihu kama anavyopendezwa na kuitii sauti ya BWANA? Tazama, kutii ni bora kuliko dhabihu, na kusikiliza ni bora kuliko mafuta ya kondoo dume.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֵפֶץ
  choice: hupendezwa
  rationale: Kitenzi hiki huonyesha kupendezwa au kufurahia; muundo wa swali umehifadhi ulinganisho wa mstari.
- source_word: שְׁמֹעַ בְּקוֹל
  choice: kuitii sauti
  rationale: Katika muktadha huu, ‘kusikia sauti’ humaanisha kusikiliza kwa utii, si kusikia sauti tu.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno la kuvuta fikira limehifadhiwa kwa usemi wa kawaida wa kibiblia unaoeleweka.
- source_word: לְהַקְשִׁיב
  choice: kusikiliza
  rationale: Huhifadhi ulinganifu wa kishairi na ‘kutii’ huku likisisitiza kuzingatia kwa makini.
- source_word: חֵלֶב אֵילִים
  choice: mafuta ya kondoo dume
  rationale: Tafsiri ya moja kwa moja ya sehemu bora ya dhabihu iliyotajwa katika maandishi ya Kiebrania.
theological_decisions:
- issue: Ulinganisho kati ya utii na dhabihu
  choice: ‘kutii ni bora kuliko dhabihu’
  alternative: ‘utii huondoa umuhimu wa dhabihu’
  rationale: Maandishi yanatanguliza utii juu ya dhabihu katika muktadha huu; hayasemi kwamba dhabihu zote zimefutwa au hazina thamani kabisa.
- issue: Jina la agano יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ ni desturi iliyoenea katika Biblia za Kiswahili na inaendeleza uwakilishi wa heshima wa Tetragramatoni bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘BWANA’ na ulinganifu wa ‘kutii/kusikiliza’ yamehifadhiwa ili kuonyesha muundo wa Kiebrania.
