base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/014.yaml
  text: But Samuel said[a], “Then what is this sound of sheep in my ears, and the sound of cattle that I hear?”
translation:
  language: sw
  text: Lakini Samweli akasema, “Basi, ni sauti[a] gani hii ya kondoo inayofika masikioni mwangu, na sauti ya ng’ombe ninayoisikia?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mlio” badala ya “sauti” katika sehemu zote mbili. Neno la Kiebrania qol hapa linarejelea mlio wa wanyama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini Samweli akasema
  rationale: Kiunganishi kinaendeleza simulizi, lakini katika muktadha huu jibu la Samweli linapinga dai la Sauli kwamba ametii; kwa hiyo “Lakini” linaonyesha vizuri nguvu hiyo ya upinzani.
- source_word: וּמֶה
  choice: Basi, ni ... gani
  rationale: Muundo huu wa Kiswahili unauliza kwa changamoto maelezo ya kile kinachosikika, huku “Basi” likihifadhi nguvu ya kiunganishi cha Kiebrania.
- source_word: קוֹל
  choice: sauti
  rationale: Neno hilo linaweza kumaanisha sauti au mlio. Hapa linarejelea kelele inayosikika kutoka kwa wanyama; “sauti” ni ya kawaida, yenye heshima, na inaweza kutumika kwa matukio yote mawili.
- source_word: הַצֹּאן
  choice: kondoo
  rationale: Nomino hii ya mkusanyiko inaweza kujumuisha kondoo na mbuzi, lakini katika muktadha huu “kondoo” ni tafsiri ya kawaida na inaendana vizuri na kutajwa kwa ng’ombe.
- source_word: הַזֶּה
  choice: hii
  rationale: Kionyeshi kinaelekeza kwenye sauti inayosikika wakati huo; “hii” kinahifadhi uelekezaji huo wa karibu.
- source_word: בְּאָזְנָי
  choice: iliyo masikioni mwangu
  rationale: Tafsiri hii inahifadhi taswira hai ya Kiebrania ya sauti kuwa masikioni mwa Samweli, na bado inaeleweka katika Kiswahili.
- source_word: וְקוֹל הַבָּקָר
  choice: na sauti ya ng’ombe
  rationale: בקר ni jina la mkusanyiko kwa ng’ombe au kundi la ng’ombe. “Ng’ombe” ni pana na ya kawaida; haipunguzi maana kuwa maksai pekee.
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: ninayoisikia
  rationale: Kishazi hiki kinabainisha ushahidi unaosikika. Umbo la wakati wa sasa linaonyesha kwamba Samweli anaisikia sauti wakati huo; msisitizo wa kiwakilishi cha Kiebrania unabaki katika nguvu ya swali zima bila kuongezwa neno lisilo la lazima.
