base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/001.yaml
  text: Then Samuel said to Saul[a], “Yahweh sent me to anoint you as king over his people, over Israel. So now, listen to the words of Yahweh.”
translation:
  language: sw
  text: Kisha Samueli akamwambia Sauli, “Yahwe alinituma nikutie mafuta uwe mfalme juu ya watu wake, juu ya Israeli. Basi sasa, sikiliza[a] maneno ya Yahwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “sikiliza sauti ya maneno ya Yahwe.” Usemi wa Kiebrania unamaanisha si kusikia tu, bali pia kuzingatia na kutii.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo wa simulizi unaendeleza tukio; ‘Kisha’ na kitenzi cha kumwambia vinaonyesha kwa Kiswahili cha kawaida kwamba Samueli alimwelekea Sauli kwa maneno haya.
- source_word: שְׁמוּאֵל ... שָׁאוּל
  choice: Samueli ... Sauli
  rationale: Haya ndiyo maumbo ya kawaida ya majina haya katika matumizi ya Biblia ya Kiswahili.
- source_word: אֹתִי שָׁלַח יְהוָה
  choice: Yahwe alinituma
  rationale: Kiswahili huwasilisha kiwakilishi cha yambwa ndani ya kitenzi. Wakati uliopita unaonyesha agizo lililokamilika la Samueli.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa na cheo kama ‘BWANA’.
- source_word: לִמְשָׁחֳךָ
  choice: nikutie mafuta
  rationale: Usemi huu huhifadhi tendo halisi la משׁח na maana yake ya kumweka mtu rasmi katika cheo cha kifalme.
- source_word: לְמֶלֶךְ
  choice: uwe mfalme
  rationale: Huwasilisha kwa kawaida matokeo na kusudi la kutiwa mafuta, yaani kuingia katika cheo cha mfalme.
- source_word: עַל עַמּוֹ עַל יִשְׂרָאֵל
  choice: juu ya watu wake, juu ya Israeli
  rationale: Kurudia ‘juu ya’ kunahifadhi mkazo na urudiaji wa Kiebrania, huku ‘Israeli’ ikibainisha watu hao.
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huonyesha mpito wenye msingi wa kimantiki kutoka katika kukumbushwa kwa uteuzi wa Sauli hadi agizo la sasa.
- source_word: שְׁמַע לְקוֹל דִּבְרֵי יְהוָה
  choice: sikiliza maneno ya Yahwe
  rationale: ‘Sikiliza’ ni Kiswahili cha kawaida na katika muktadha wa agizo hujumuisha wito wa kusikia kwa makini na kutii; tanbihi huhifadhi umbo halisi zaidi la Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu la herufi nne moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Nguvu ya agizo שְׁמַע
  choice: sikiliza
  alternative: tii; isikie sauti ya
  rationale: ‘Sikiliza’ huhifadhi maana ya msingi ya kusikia huku muktadha ukidokeza kuitikia kwa utii; kulitafsiri ‘tii’ pekee kungefafanua kimya kimya mvutano wa usemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji wa ‘juu ya’ umehifadhiwa kwa ajili ya mkazo wa maandishi, huku usemi mgumu wa Kiebrania kuhusu ‘sauti ya maneno’ ukielezwa katika tanbihi.
