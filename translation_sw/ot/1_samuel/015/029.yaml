base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/029.yaml
  text: Moreover[a], the Glory of Israel will not lie, nor will he relent, for he is not a man[b], that he should relent.
translation:
  language: sw
  text: Zaidi ya hayo, Utukufu wa Israeli[a] hatasema uongo wala hatabadilisha uamuzi wake, kwa maana si mwanadamu wa kubadilisha uamuzi wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Milele wa Israeli,” “Nguvu ya Israeli,” au “Ushindi wa Israeli.” Jina hili la Kiebrania lina maana pana.
    reason: lexical_alternative
  - marker: b
    text: Au, “hatabadilisha nia yake” / “hatajuta.” Neno la Kiebrania linaweza kumaanisha pia kulegeza msimamo au kubadili nia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Zaidi ya hayo
  rationale: Huendeleza kwa msisitizo hukumu iliyotangulia na kuleta dai la nyongeza kwa Kiswahili cha kawaida.
- source_word: נֵצַח יִשְׂרָאֵל
  choice: Utukufu wa Israeli
  rationale: Neno נֵצַח lina maana pana zinazoweza kuhusisha utukufu wa kudumu, nguvu, ushindi, au umilele. 'Utukufu wa Israeli' linadumisha hadhi ya jina hili bila kufunga maana yake kwa dhana moja.
- source_word: יְשַׁקֵּר
  choice: hatasema uongo
  rationale: Piel ya שקר hapa ina maana ya kusema uongo au kutenda kwa udanganyifu; tafsiri hii ni ya moja kwa moja na ya kawaida.
- source_word: וְלֹא יִנָּחֵם
  choice: wala hatabadili uamuzi wake
  rationale: Nifal ya נחם inaweza kumaanisha kulegeza msimamo, kujuta, au kubadili nia. Katika muktadha wa kukataliwa kwa Sauli, kauli hii inaeleza kwamba Mungu hatageuza uamuzi uliotangazwa, huku tanbihi ikihifadhi maana nyingine.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu ya dai lililotangulia kwa mtindo wa Kiswahili wenye hadhi na ulio wazi.
- source_word: לֹא אָדָם הוּא
  choice: yeye si mwanadamu
  rationale: Hutofautisha Mungu na binadamu kwa ujumla bila kudokeza jinsia ya kiume pekee.
- source_word: לְהִנָּחֵם
  choice: hata abadili uamuzi wake
  rationale: Infinitivu hukamilisha tofauti kati ya Mungu na mwanadamu; kurudia kauli ileile kunahifadhi ulinganifu wa נחם katika vifungu vyote viwili.
theological_decisions:
- issue: Kutafsiri lugha kuhusu kutobadilika kwa Mungu bila kuzidisha madai ya kifalsafa
  choice: hatabadilisha uamuzi wake katika muktadha huu wa hukumu
  alternative: hatalegeza msimamo / hatajuta / hatabadili nia yake
  rationale: Aya inasisitiza uaminifu wa Mungu na kwamba hataondoa uamuzi kuhusu kukataliwa kwa Sauli. Tafsiri haipanui dai hili kimya kimya kuwa mfumo wa kifalsafa unaozidi muktadha.
- issue: Maana ya jina la Mungu נֵצַח יִשְׂרָאֵל
  choice: Utukufu wa Israeli
  alternative: Aliye wa Milele wa Israeli / Nguvu ya Israeli / Ushindi wa Israeli
  rationale: Kwa sababu maana ya נֵצַח hapa ina utata halisi, matini kuu inatumia jina lenye hadhi na tanbihi inahifadhi tafsiri nyingine zinazowezekana.
- issue: Mvutano na sehemu nyingine zinazosema Mungu alijuta
  choice: Kuhifadhi dai mahususi la aya bila kulisawazisha na 1 Samweli 15:11
  alternative: Kulieleza kama kanuni ya jumla isiyo na tofauti yoyote
  rationale: Kauli hiyo inaelekezwa kwa kutogeuzwa kwa hukumu juu ya Sauli. Tafsiri inaacha mvutano wa kiteolojia uliopo katika sura badala ya kuutatua kwa kuongeza maneno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Mwanadamu' ni ya asili katika tofauti kati ya Mungu na binadamu kwa ujumla. Alama zote za tanbihi zimewekwa katika matini kuu.
