base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/019.yaml
  text: Why then did you not obey the voice of Yahweh[a], but rush upon the spoil and do what was evil in the eyes of Yahweh?
translation:
  language: sw
  text: Kwa nini basi hukuitii sauti ya Yahwe, bali ukazirukia nyara[a] na kufanya yaliyo maovu machoni pa Yahwe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukazivamia nyara” au “ukashuka kwa pupa juu ya nyara”; kitenzi cha Kiebrania kinaonyesha mwendo wa haraka na wenye tamaa kuelekea mali iliyotekwa vitani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: Kwa nini basi
  rationale: Kishazi hiki kinaanzisha karipio la Samweli kwa swali; “basi” huwasilisha nguvu ya kiunganishi וְ kwa Kiswahili cha kawaida.
- source_word: שָׁמַעְתָּ בְּקוֹל
  choice: hukuitii sauti
  rationale: Katika muktadha wa amri, שׁמע בְּקוֹל humaanisha kutii, si kusikia tu; “kutii sauti” huhifadhi maana na taswira ya Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: וַתַּעַט אֶל
  choice: ukayavamia
  rationale: Kitenzi kinaonyesha mwendo wa haraka na wenye pupa kuelekea nyara; “kuyavamia” ni cha asili na hudumisha nguvu hiyo.
- source_word: הַשָּׁלָל
  choice: mateka
  rationale: Katika muktadha wa vita, “mateka” ni neno linaloeleweka kwa mali iliyotwaliwa, ingawa “nyara” pia linawezekana.
- source_word: וַתַּעַשׂ הָרַע
  choice: na kufanya yaliyo maovu
  rationale: Huwasilisha kitendo cha kutenda lililo baya kwa Kiswahili cha kawaida na kuhifadhi uzito wa tathmini ya kimaadili.
- source_word: בְּעֵינֵי יְהוָה
  choice: machoni pa Yahwe
  rationale: Huhifadhi sitiari ya Kiebrania ya tathmini bila kupoteza uelewekaji katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina binafsi יהוה; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali na sitiari “machoni pa” zimehifadhiwa, huku kitenzi chenye nguvu kikielezwa kwa tanbihi.
