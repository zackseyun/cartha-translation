base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/024.yaml
  text: Then Saul said to Samuel[a], “I have sinned, for I transgressed the command of Yahweh and your words[b], for I feared the people and listened to their voice.”
translation:
  language: sw
  text: Ndipo Sauli akamwambia Samweli, “Nimetenda dhambi, kwa maana nimekiuka amri ya Yahweh[a] na maneno yako, kwa sababu niliwaogopa watu, nami nikaisikiliza sauti yao[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiebrania, neno kwa neno: “kinywa cha Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Au, “nami nikawatii”; kwa Kiebrania, neno kwa neno: “nami nikaisikiliza sauti yao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: Nimetenda dhambi
  rationale: Kauli timilifu ya Kiebrania ni ungamo la sasa kuhusu kosa lililokamilika; wakati timilifu wa Kiswahili unaonyesha kwa kawaida kwamba Sauli anakiri hatia yake.
- source_word: עָבַרְתִּי
  choice: nimekiuka
  rationale: Kitenzi hicho kimsingi humaanisha kuvuka mpaka; katika muktadha wa kutotimiza agizo la Mungu, “kukiuka” kinadumisha uzito wa kimaadili na wa sheria.
- source_word: פִּי יְהוָה
  choice: amri ya Yahweh
  rationale: Maana ya neno kwa neno ni “kinywa cha Yahweh,” lakini hapa ni nahau inayorejelea jambo ambalo Yahweh alikuwa ameamuru. “Amri” inaeleza maana hiyo kwa Kiswahili cha kawaida bila kupanua hoja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina la pekee badala ya kubadilishwa kuwa cheo.
- source_word: דְּבָרֶיךָ
  choice: maneno yako
  rationale: Nomino hiyo iko katika wingi na ina kiambishi cha nafsi ya pili umoja; tafsiri hii inadumisha umbo hilo na kurejelea yale Samweli aliyosema.
- source_word: יָרֵאתִי
  choice: niliwaogopa
  rationale: Kitenzi kinaonyesha hofu; umbo hili ni la kawaida katika Kiswahili na linaweka wazi kuwa watu ndio walioogopwa.
- source_word: הָעָם
  choice: watu
  rationale: Neno hilo kwa kawaida humaanisha watu. Ingawa katika muktadha linaweza kuwahusisha hasa wanajeshi wa Sauli, hakuna ulazima wa kulifinya kuwa “jeshi” au “askari.”
- source_word: וָאֶשְׁמַע בְּקוֹלָם
  choice: na kuisikiliza sauti yao
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya “kusikiliza sauti yao” na mwangwi wake wa utii, badala ya kubadili maana moja kwa moja kuwa “kuwatii.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la pekee la Mungu moja kwa moja. “Yahweh” linadumisha jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Nahau פִּי יְהוָה
  choice: amri ya Yahweh
  alternative: kinywa cha Yahweh; neno la Yahweh
  rationale: Tafsiri ya moja kwa moja “kinywa cha Yahweh” isingekuwa wazi katika Kiswahili cha kawaida. Muktadha ni wa kuvunja agizo maalumu, kwa hiyo “amri” inawasilisha maana ya nahau bila kuondoa tanbihi ya maana halisi.
- issue: Maana ya kusikiliza sauti ya watu
  choice: kuisikiliza sauti yao
  alternative: kuwatii
  rationale: Kiebrania kinaweza kudokeza utii, lakini tafsiri kuu inadumisha lugha ya “sauti” ili kuhifadhi mvutano kati ya kile Yahweh alichoagiza na shinikizo la watu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mtiririko wa ungamo la Sauli na urudiaji wa sababu mbili, huku nahau zisizo za kawaida zikifafanuliwa kwa tanbihi.
