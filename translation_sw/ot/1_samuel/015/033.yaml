  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל כַּ/אֲשֶׁ֨ר שִׁכְּלָ֤ה נָשִׁים֙ חַרְבֶּ֔/ךָ כֵּן תִּשְׁכַּ֥ל מִ/נָּשִׁ֖ים אִמֶּ֑/ךָ וַ/יְשַׁסֵּ֨ף שְׁמוּאֵ֧ל אֶת אֲגָ֛ג לִ/פְנֵ֥י יְהוָ֖ה בַּ/גִּלְגָּֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/033.yaml
  text: Samuel said[a], “As your sword has made women childless[b], so your mother will be childless among women.” And Samuel hacked Agag to pieces before Yahweh at Gilgal.
translation:
  language: sw
  text: Samweli akasema, “Kama vile upanga wako ulivyowafanya wanawake wafiwe na watoto,[a] ndivyo mama yako atakavyofiwa na watoto miongoni mwa wanawake.” Kisha Samweli akamkata Agagi vipande-vipande[b] mbele za Yahwe huko Gilgali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kama vile upanga wako ulivyowaacha wanawake bila watoto, ndivyo mama yako atakavyoachwa bila watoto miongoni mwa wanawake.” Kiebrania hutumia kitenzi kilekile katika vifungu vyote viwili, kikisisitiza adhabu inayolingana na tendo.
    reason: lexical_alternative
  - marker: b
    text: Au, “akamkatakata Agagi.” Kitenzi cha Kiebrania kinaonyesha kukata vipande, si kumuua tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכְּלָה / תִּשְׁכַּל (שׁכל)
  choice: wafiwe na watoto / atakavyofiwa na mwana
  rationale: Mzizi huu unaonyesha kufiwa na watoto. Kurudia ‘kufiwa’ katika vifungu vyote viwili kunahifadhi ulinganifu wa Kiebrania na wazo la adhabu inayolingana na tendo. ‘Mwana’ katika kifungu cha pili ni ya kawaida kwa Kiswahili kwa kuwa Agagi ndiye anayekabiliwa na kifo.
- source_word: חַרְבֶּךָ
  choice: upanga wako
  rationale: Tafsiri ya moja kwa moja na ya kawaida; upanga unawakilisha matendo ya Agagi ya kuua kwa nguvu.
- source_word: מִנָּשִׁים
  choice: miongoni mwa wanawake
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya מן katika usemi huu wa kulinganisha.
- source_word: וַיְשַׁסֵּף
  choice: akamkata ... vipandevipande
  rationale: Kitenzi cha Kiebrania ni chenye nguvu na kinaonyesha kukata mwili vipande. Kauli hii inadumisha ukali wa tendo bila kuongeza maelezo yasiyomo katika matini.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha tendo lililofanywa mbele au katika uwepo wa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limehifadhiwa badala ya kubadilishwa kuwa cheo.
- source_word: בַּגִּלְגָּל
  choice: huko Gilgali
  rationale: ‘Huko’ ni ya kawaida kwa tukio linalofanyika katika mahali palipotajwa, na ‘Gilgali’ ni umbo la jina linalotambulika katika Kiswahili.
theological_decisions:
- issue: Kuwasilisha adhabu inayolingana na tendo katika kauli ya Samweli
  choice: Kurudia ‘kufiwa’ katika pande zote mbili za ulinganisho
  alternative: ‘kuwa bila watoto’ au ‘kuachwa bila watoto’
  rationale: Kurudia neno lilelile kunahifadhi muundo wa Kiebrania na mkazo wake wa malipo yanayolingana, bila kueleza zaidi sababu ya kitheolojia.
- issue: Kuwasilisha kuuawa kwa Agagi bila kupunguza wala kutia chumvi ukatili
  choice: Samweli akamkata Agagi vipandevipande
  alternative: Samweli akamkatakata Agagi; Samweli akamuua Agagi
  rationale: Matini inamtaja Samweli wazi kuwa mtendaji na hutumia kitenzi chenye nguvu cha kukata vipande. ‘Akamuua’ ni dhaifu mno, ilhali ‘akamkatakata’ inaweza kusikika ya kusisimua zaidi kuliko inavyohitajika.
- issue: Kutafsiri jina la Mungu
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania inatumia יהוה, hivyo tafsiri inahifadhi jina hilo la agano kwa umbo la Kiswahili ‘Yahwe’.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Majina yametolewa kwa maumbo ya kawaida ya Kiswahili: Samweli, Agagi, Yahwe, na Gilgali. Muundo wa kisemantiki wa Kiebrania umehifadhiwa huku sentensi zikibaki za kawaida katika Kiswahili.'
