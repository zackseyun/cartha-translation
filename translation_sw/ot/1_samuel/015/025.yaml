  yaml_path: translation/ot/1_samuel/015/025.yaml
  text: Now please forgive my sin[a], and return with me[b], so that I may bow down to Yahweh.
translation:
  language: sw
  text: Na sasa, tafadhali nisamehe dhambi yangu[a], na urudi pamoja nami, ili nimsujudie Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “inua dhambi yangu,” nahau yenye maana ya “nisamehe dhambi yangu.”
    reason: lexical_alternative
  - marker: b
    text: Au “nimwabudu Yahweh”; kitenzi cha Kiebrania humaanisha kihalisi kuinama chini au kusujudu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huanzisha ombi la haraka la Sauli kutokana na karipio la Samueli; “basi sasa” ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: שָׂא נָא
  choice: tafadhali nisamehe
  rationale: Ingawa נָשָׂא humaanisha kihalisi kuinua, kubeba, au kuondoa, ikiambatana na חַטָּאת hapa ni nahau ya kusamehe dhambi; נָא huonyesha ombi la heshima.
- source_word: אֶת חַטָּאתִי
  choice: dhambi yangu
  rationale: Muktadha wa kukiri kosa unaonyesha maana ya “dhambi,” si “sadaka ya dhambi.”
- source_word: וְשׁוּב עִמִּי
  choice: urudi pamoja nami
  rationale: שׁוּב ni kurudi au kugeuka kurudi; hapa Sauli anamwomba Samueli aandamane naye anaporudi.
- source_word: וְאֶשְׁתַּחֲוֶה
  choice: ili nipate kumsujudia
  rationale: Kitenzi kinaonyesha kuinama chini au kujilaza kifudifudi kwa heshima na ibada. Muundo wa “ili nipate” unaonyesha kusudi baada ya ombi la Sauli.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetoholewa kuwa “Yahweh”; kiambishi ל־ kinaonyesha yule anayesujudiwa.
theological_decisions:
- issue: Maana ya kusamehe katika nahau שָׂא ... חַטָּאת
  choice: nisamehe dhambi yangu
  alternative: niinulie/uniondolee dhambi yangu
  rationale: Tafsiri ya nahau kwa “nisamehe” hutoa maana yake wazi bila kudai kwamba Samueli ndiye mwenye mamlaka ya mwisho ya kiungu ya kuondoa dhambi; mstari unanukuu ombi la Sauli kama lilivyotolewa.
- issue: Tendo la וְאֶשְׁתַּחֲוֶה
  choice: kumsujudia
  alternative: kumwabudu
  rationale: “Kumsujudia” huhifadhi tendo halisi la kuinama au kujilaza mbele za Yahweh, huku maana ya ibada ikiendelea kuwapo katika muktadha.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Jina binafsi la agano limehifadhiwa kwa namna ya “Yahweh,” badala ya kubadilishwa kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Basi sasa” na “ili nipate” huendeleza mtiririko wa ombi bila kuwa cha kizamani; “kumsujudia” huhifadhi picha halisi ya tendo la Kiebrania.
