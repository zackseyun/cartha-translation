  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חָטָ֔אתִי עַתָּ֗ה כַּבְּדֵ֥/נִי נָ֛א נֶ֥גֶד זִקְנֵֽי עַמִּ֖/י וְ/נֶ֣גֶד יִשְׂרָאֵ֑ל וְ/שׁ֣וּב עִמִּ֔/י וְ/הִֽשְׁתַּחֲוֵ֖יתִי לַֽ/יהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/030.yaml
  text: And he said[a], “I have sinned. Now please honor me before the elders of my people and before Israel, and return with me, so that I may bow down to Yahweh your God.”
translation:
  language: sw
  text: Naye akasema, “Nimetenda dhambi. Sasa tafadhali niheshimu mbele ya wazee wa watu wangu na mbele ya Israeli, na urudi pamoja nami, ili nipate kumsujudia Yahweh, Mungu wako.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nami nitamsujudia Yahweh, Mungu wako.” Muundo wa Kiebrania unaweza kueleweka kuwa mwendelezo sahili (“nami nitamsujudia”) au kueleza kusudi la ombi lililotangulia (“ili nipate kumsujudia”).
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: Nimetenda dhambi
  rationale: Kauli timilifu ya nafsi ya kwanza umoja ni ungamo la moja kwa moja; wakati timilifu wa Kiswahili unaonyesha tendo lililotendwa ambalo bado lina umuhimu katika hali ya sasa.
- source_word: עַתָּה
  choice: Sasa
  rationale: Inadokeza ombi la haraka la Sauli baada ya ungamo lake.
- source_word: כַּבְּדֵנִי נָא
  choice: tafadhali niheshimu
  rationale: Kitenzi kinaomba Sauli apewe heshima hadharani; נָא imewakilishwa kwa ‘tafadhali’.
- source_word: נֶגֶד זִקְנֵי עַמִּי וְנֶגֶד יִשְׂרָאֵל
  choice: mbele ya wazee wa watu wangu na mbele ya Israeli
  rationale: ‘Mbele ya’ huhifadhi maana ya kuonekana hadharani, na ‘watu wangu’ pamoja na ‘Israeli’ zimeachwa kama zilivyo katika chanzo.
- source_word: וְשׁוּב עִמִּי
  choice: kisha urudi pamoja nami
  rationale: שׁוב hapa ni kurudi au kuandamana tena; ‘pamoja nami’ huhifadhi ombi la Sauli kwamba Samweli aende naye.
- source_word: וְהִשְׁתַּחֲוֵיתִי
  choice: ili nipate kumsujudia
  rationale: Kitenzi kinaeleza kuinama au kujilaza kwa ibada. ‘Kumsujudia’ ni Kiswahili cha kawaida kinachohifadhi tendo la mwili na kusudi la ibada.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetafsiriwa kwa unukuzi ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Kiambishi cha nafsi ya pili umoja kimehifadhiwa, hivyo mvutano wa Sauli kumwita Yahweh ‘Mungu wako’ unabaki.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya cheo.
- issue: Maneno ya Sauli אֱלֹהֶיךָ
  choice: Mungu wako
  alternative: Mungu wetu; Mungu
  rationale: Kiebrania kina kiambishi dhahiri cha nafsi ya pili umoja. Kukihifadhi hakufuti mvutano wa simulizi na kitheolojia.
- issue: Uhusiano wa וְהִשְׁתַּחֲוֵיתִי na ombi lililotangulia
  choice: ili nipate kumsujudia
  alternative: nami nitamsujudia
  rationale: Muundo unaweza kueleweka kama kusudi la ombi au kama mwendelezo sahili. Tafsiri kuu imetumia kusudi kwa Kiswahili cha kawaida, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Kumsujudia’ huhifadhi ishara halisi ya kuinama kwa ibada; ‘Yahweh’ na ‘Mungu wako’ huhifadhi jina la Mungu na mvutano wa matini.
