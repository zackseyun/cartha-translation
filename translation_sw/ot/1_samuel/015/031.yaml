  yaml_path: translation/ot/1_samuel/015/031.yaml
  text: So Samuel went back after Saul[a], and Saul bowed down to Yahweh.
translation:
  language: sw
  text: Basi Samueli akarudi akimfuata Sauli, naye Sauli akamsujudia BWANA.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamwabudu BWANA.” Kitenzi cha Kiebrania kinaweza kumaanisha kusujudu au kuabudu, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: Kitenzi שוב katika mfuatano huu wa simulizi kinaonyesha kwamba Samueli aligeuka na kwenda tena pamoja na mwelekeo wa Sauli, baada ya kukataa kurudi naye katika mstari wa 26.
- source_word: אַחֲרֵי
  choice: akimfuata
  rationale: Maana ya msingi ni ‘baada ya/nyuma ya.’ Katika Kiswahili, ‘akimfuata Sauli’ huonyesha kwa kawaida kwamba Samueli alienda nyuma yake bila kubadili waziwazi kuwa ‘pamoja naye.’
- source_word: וַיִּשְׁתַּחוּ
  choice: akamsujudia
  rationale: Kitenzi hiki huonyesha kuinama au kujilaza kwa heshima na, Mungu akiwa mlengwa, kinaweza pia kumaanisha kuabudu. ‘Akamsujudia’ kinadumisha tendo la mwili pamoja na maana yake ya ibada bila kulazimisha mojawapo pekee.
- source_word: לַיהוָה
  choice: BWANA
  rationale: Herufi ל inaonyesha mlengwa wa kusujudu. Jina la agano יהוה limetafsiriwa kwa desturi ya Kiswahili kuwa ‘BWANA,’ kwa herufi kubwa ili kulitofautisha na cheo cha kawaida.
- source_word: שְׁמוּאֵל
  choice: Samueli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
theological_decisions:
- issue: Iwapo וַיִּשְׁתַּחוּ itafsiriwe moja kwa moja kama ibada au kama tendo la kuinama/kusujudu
  choice: akamsujudia BWANA
  alternative: akamwabudu BWANA; akainama chini mbele za BWANA
  rationale: Kiebrania kinaweza kueleza tendo la mwili la kusujudu au ibada kulingana na muktadha. Kwa kuwa BWANA ndiye mlengwa, tendo lina maana ya ibada, lakini ‘akamsujudia’ linahifadhi pia picha halisi ya tendo la mwili na hivyo haliondoi utata wa kimsamiati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, kwa mtindo wa simulizi ulio wa sasa lakini wenye hadhi. ‘Basi’ huunganisha tukio hili na lililotangulia; ‘naye’ huonyesha mabadiliko ya mtendaji kwa uwazi. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika, yaani ‘akamsujudia BWANA.’
