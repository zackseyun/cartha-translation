  text: עַתָּה֩ לֵ֨ךְ וְ/הִכִּֽיתָ֜ה אֶת עֲמָלֵ֗ק וְ/הַֽחֲרַמְתֶּם֙ אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/לֹ֥א תַחְמֹ֖ל עָלָ֑י/ו וְ/הֵמַתָּ֞ה מֵ/אִ֣ישׁ עַד אִשָּׁ֗ה מֵֽ/עֹלֵל֙ וְ/עַד יוֹנֵ֔ק מִ/שּׁ֣וֹר וְ/עַד שֶׂ֔ה מִ/גָּמָ֖ל וְ/עַד חֲמֽוֹר־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/003.yaml
  text: Now go and strike Amalek[a], and devote to destruction all that belongs to him. Do not spare him, but put to death from man to woman, from child to nursing infant, from ox to sheep[b], from camel to donkey.
translation:
  language: sw
  text: Sasa nenda ukawapige Waamaleki[b], na uwaweke wakfu kwa maangamizi[a], kila kilicho chao. Usiwahurumie, bali uwaue kuanzia mwanamume hadi mwanamke, kuanzia mtoto mdogo hadi mtoto anyonyaye, kuanzia ng’ombe hadi kondoo[c], kuanzia ngamia hadi punda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uwaangamize kabisa” au “uwaweke chini ya marufuku.” Kitenzi cha Kiebrania humaanisha kutenga bila kubatilishwa kwa ajili ya maangamizi chini ya hukumu ya Mungu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina “Amaleki” na, katika mstari huu wote, viwakilishi vya umoja “yeye.” Umoja huo unarejelea watu wa Amaleki kama kundi moja.
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania linaweza kumaanisha kondoo au mbuzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה לֵךְ
  choice: Sasa nenda
  rationale: Huhifadhi kiashiria cha wakati na amri ya moja kwa moja kwa Kiswahili cha kawaida.
- source_word: וְהִכִּיתָה אֶת עֲמָלֵק
  choice: ukawashambulie Waamaleki
  rationale: Katika muktadha wa vita, נכה ina maana ya kushambulia au kupiga; 'ukawashambulie' ni ya asili zaidi kwa Kiswahili. Jina la umoja עֲמָלֵק linawakilisha taifa zima, hivyo wingi umewekwa wazi.
- source_word: וְהַחֲרַמְתֶּם
  choice: uweke chini ya maangamizi
  rationale: 'Huhifadhi maana maalumu ya חרם: kutenga kabisa kwa ajili ya kuangamizwa chini ya hukumu, bila kuifanya kuwa uharibifu wa kawaida tu.'
- source_word: כָּל אֲשֶׁר לוֹ
  choice: kila kitu walicho nacho
  rationale: Ni usemi wa kawaida unaoonyesha kwa ujumla vitu vyote vya taifa hilo; kiwakilishi cha wingi kinaendana na 'Waamaleki'.
- source_word: וְלֹא תַחְמֹל עָלָיו
  choice: Usiwahurumie
  rationale: חמל huunganisha dhana ya huruma na kuacha hai; katika muktadha huu 'usiwahurumie' ni wazi na nzito.
- source_word: וְהֵמַתָּה
  choice: bali uwaue
  rationale: Hiphil ya מות humaanisha kusababisha kufa. 'Uwaue' ni Kiswahili cha moja kwa moja na cha sasa.
- source_word: מֵאִישׁ עַד אִשָּׁה
  choice: wanaume na wanawake
  rationale: Jozi hii inaonyesha ujumla wa makundi ya kijinsia. Wingi ni wa asili kwa Kiswahili na unaafikiana na taifa linalotajwa.
- source_word: מֵעֹלֵל וְעַד יוֹנֵק
  choice: watoto wadogo na watoto wanaonyonya
  rationale: עולל ni mtoto mdogo, na יונק ni mtoto anayenyonya; tafsiri inahifadhi tofauti hiyo.
- source_word: מִשּׁוֹר וְעַד שֶׂה
  choice: ng’ombe na kondoo
  rationale: שור ni mnyama wa jamii ya ng’ombe; שה ni mnyama mdogo wa kufugwa anayeweza kuwa kondoo au mbuzi, hivyo jambo hilo linaelezwa katika tanbihi.
- source_word: מִגָּמָל וְעַד חֲמוֹר
  choice: ngamia na punda
  rationale: Majina ya makundi haya yametafsiriwa kwa wingi wa asili wa Kiswahili ndani ya orodha ya ujumla.
theological_decisions:
- issue: Lugha ya חרם katika vita
  choice: uweke chini ya maangamizi
  alternative: uwaangamize kabisa; uwaweke chini ya marufuku
  rationale: Chaguo hili linadumisha uzito wa kitendo cha kutenga pasipo kurejesheka kwa ajili ya maangamizi chini ya hukumu, badala ya kukifanya kiwe tu uharibifu wa kijeshi.
- issue: Umoja wa kishirika wa 'Amaleki'
  choice: Waamaleki ... walicho nacho ... usiwahurumie
  alternative: Amaleki ... alicho nacho ... usimhurumie
  rationale: Kiebrania hutumia jina na viwakilishi vya umoja kwa taifa kama shirika moja. Kiswahili cha kawaida huwasilisha watu hao kwa wingi; maana ya kishirika imeelezwa katika tanbihi bila kubadili warejelewa.
- issue: Jozi za ukamilifu katika orodha
  choice: wanaume na wanawake, watoto wadogo na watoto wanaonyonya
  alternative: kuanzia mwanamume hadi mwanamke, kuanzia mtoto mdogo hadi anayenyonya
  rationale: Muundo wa Kiebrania 'kutoka ... hadi ...' unaonyesha ujumla. Jozi zilizounganishwa kwa 'na' zinatoa maana hiyo kwa Kiswahili cha asili bila kupunguza makundi yaliyotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na uwazi. Wingi 'Waamaleki' umetumiwa kwa uelewekevu wa kawaida, huku tanbihi na maamuzi yakitambua umoja wa kishirika wa Kiebrania. Alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
