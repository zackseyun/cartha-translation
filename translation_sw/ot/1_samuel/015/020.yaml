base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/020.yaml
  text: Saul said to Samuel[a], “But I did obey the voice of Yahweh, and I went on the way that Yahweh sent me, and I brought Agag king of Amalek[b], and I devoted Amalek to destruction.”
translation:
  language: sw
  text: Sauli akamwambia Samweli, “Lakini mimi nimeitii sauti ya Yahwe[a]. Nimefuata njia ambayo Yahwe alinituma niifuate, nimemleta Agagi, mfalme wa Amaleki, na Amaleki nimeiweka wakfu kwa maangamizi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana nyingine, “nimemsikiliza Yahwe.” Kiebrania ni “nimeisikiliza/nimeitii sauti ya Yahwe.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Amaleki nimeiangamiza kabisa,” au “nimeiweka Amaleki chini ya marufuku.” Kitenzi cha Kiebrania kina maana ya kuweka kitu wakfu ili kiangamizwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: nimeitii sauti ya
  rationale: Muundo huu huhifadhi nahau ya Kiebrania ya ‘kusikiliza/kuisikia sauti’ kwa maana ya kutii. Kiwakilishi ‘mimi’ pamoja na kauli timilifu ‘nimeitii’ kinaonyesha msisitizo wa Sauli anapojitetea.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: וָאֵלֵךְ בַּדֶּרֶךְ
  choice: Nimeenda katika njia
  rationale: Tafsiri hii inadumisha sitiari ya njia au mwendo alioagizwa Sauli bila kuibadili kuwa neno la kifafanuzi zaidi kama ‘utume’.
- source_word: אֲשֶׁר שְׁלָחַנִי יְהוָה
  choice: ambayo Yahwe alinituma
  rationale: Kishazi hiki kinaendeleza ‘njia’ na kuonyesha kwamba Sauli alitumwa kuifuata; muundo huo unasomeka kwa kawaida katika Kiswahili.
- source_word: וָאָבִיא
  choice: nimemleta
  rationale: Hifili ya בוא ina maana ya kusababisha aje, yaani kumleta. Hakuna haja ya kuongeza ‘kurudi’ kwa kuwa hilo halimo wazi katika kitenzi.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: Agagi, mfalme wa Amaleki
  rationale: Hii ni tafsiri ya moja kwa moja ya utambulisho wa Agagi na inatumia maumbo ya majina yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: הֶחֱרַמְתִּי
  choice: nimeiweka wakfu kwa maangamizi
  rationale: Kitenzi חרם katika muktadha huu kinamaanisha kutenga kitu chini ya marufuku ya Mungu ili kiangamizwe. ‘Kuweka wakfu kwa maangamizi’ huhifadhi nguvu ya kidini na ya hukumu badala ya kupunguza maana kuwa kuangamiza tu.
- source_word: וְאֶת עֲמָלֵק
  choice: na Amaleki
  rationale: Jina la umoja ‘Amaleki’ limehifadhiwa kama jina la taifa au watu kwa ujumla, badala ya kulibadili moja kwa moja kuwa ‘Waamaleki’.
theological_decisions:
- issue: Maana ya חרם katika muktadha wa vita vilivyoamriwa na Mungu
  choice: Amaleki nimeiweka wakfu kwa maangamizi
  alternative: Amaleki nimeiangamiza kabisa; nimeiweka Amaleki chini ya marufuku
  rationale: Chaguo kuu linahifadhi wazo kwamba kitu kilitengwa kwa hukumu na maangamizi, bila kuingiza ufafanuzi wa kimadhehebu. Tanbihi inadumisha tafsiri nyingine halali.
- issue: Msisitizo wa Sauli anapojitetea
  choice: Lakini mimi nimeitii sauti ya Yahwe
  alternative: Naam, nimeitii sauti ya Yahwe; Nilimsikiliza Yahwe
  rationale: ‘Lakini mimi’ linaonyesha upinzani wa Sauli dhidi ya shtaka la Samweli, huku nahau ya ‘kuitii sauti’ ikihifadhi muundo wa Kiebrania na maana yake ya utii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kauli timilifu katika maneno ya Sauli inaonyesha madai yake kwamba alikamilisha alichoagizwa. ‘Agagi’ na ‘Amaleki’ ni maumbo ya majina yanayosikika kwa kawaida katika mapokeo ya Kiswahili. Alama za tanbihi zimepangwa kulingana na maneno yanayofafanuliwa, kwa kuwa katika safu ya mashauriano ya Kiingereza maelezo ya alama a na b yalionekana kubadilishana nafasi.
