base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/023.yaml
  text: For rebellion is like the sin of divination[a], and stubbornness is like wickedness and household idols. Because you have rejected the word of Yahweh[c][b], he has also rejected you from being king.
translation:
  language: sw
  text: Kwa maana uasi ni kama dhambi ya uaguzi[a], na ukaidi ni kama uovu na sanamu za nyumbani[b]. Kwa sababu umelikataa neno la Yahwe, amekukataa kuwa mfalme[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhambi ya uchawi.” Neno la Kiebrania קֶסֶם linahusu kwa upana uaguzi, yaani kutafuta maarifa yaliyofichika kwa njia zilizokatazwa.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania תְּרָפִים (terafim): sanamu au vitu vya ibada vilivyotumiwa nyumbani.'
    reason: lexical_alternative
  - marker: c
    text: Au, “amekukataa kama mfalme.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Huanzisha sababu inayofafanua karipio lililotangulia, huku יַעַן baadaye ikitambulisha sababu mahususi ya hukumu.
- source_word: חַטַּאת קֶסֶם
  choice: dhambi ya uaguzi
  rationale: Muundo huu unaonyesha dhambi inayohusiana na uaguzi; ‘uaguzi’ ni neno la kawaida linaloeleza kutafuta maarifa yaliyofichika kwa njia zilizokatazwa.
- source_word: מֶרִי
  choice: uasi
  rationale: Hueleza kukataa mamlaka kwa makusudi, hapa Sauli akikataa kutii amri ya Yahwe.
- source_word: וְאָוֶן
  choice: uovu
  rationale: Katika ulinganifu huu pamoja na sanamu, neno lina nguvu ya kimaadili ya uovu au ubaya.
- source_word: וּתְרָפִים
  choice: sanamu za nyumbani
  rationale: Terafi zilikuwa sanamu au vitu vya ibada vilivyotumiwa katika mazingira ya nyumbani; tafsiri hii huwasilisha maana kwa msomaji wa sasa.
- source_word: הַפְצַר
  choice: ukaidi
  rationale: Hueleza kushikilia msimamo kwa ukaidi na kukataa kulegeza nia; ‘ukaidi’ ni wa asili na wenye uzito katika Kiswahili.
- source_word: יַעַן
  choice: Kwa sababu
  rationale: Hutambulisha wazi sababu ya hukumu iliyotolewa dhidi ya Sauli.
- source_word: מָאַסְתָּ אֶת דְּבַר יְהוָה
  choice: umelikataa neno la Yahwe
  rationale: ‘Kukataa’ huhifadhi maana na marudio ya mzizi מָאַס katika nusu ya pili ya aya.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwakilishi wa kawaida wa jina la Mungu katika mradi huu.
- source_word: וַיִּמְאָסְךָ מִמֶּלֶךְ
  choice: yeye pia amekukataa usiwe mfalme
  rationale: Huhifadhi marudio ya ‘kukataa’ na kuonyesha kuondolewa kwa Sauli katika hadhi ya kifalme bila kufanya Kiswahili kuwa kigumu.
theological_decisions:
- issue: Muundo wa ulinganisho katika sehemu ya kwanza
  choice: uasi unalinganishwa na dhambi ya uaguzi, na ukaidi unalinganishwa na uovu na sanamu za nyumbani
  alternative: uasi ni dhambi ya uaguzi, na ukaidi ni uovu na terafi
  rationale: Ingawa Kiebrania hakina neno la pili linalosema wazi ‘ni kama,’ usambamba wa kishairi unaunga mkono kuendeleza ulinganisho katika vipashio vyote viwili. Hii huhifadhi nguvu ya usemi bila kuufanya kuwa mlinganyo wa kimafundisho uliofafanuliwa kupita kiasi.
- issue: Maana ya מִמֶּלֶךְ katika hukumu ya Sauli
  choice: amekataa Sauli asiwe mfalme, yaani aondolewe katika ufalme
  alternative: amemkataa Sauli akiwa mfalme
  rationale: Kihusishi מן kinaweza kuonyesha kuondolewa katika hali ya kuwa mfalme, lakini usemi mfupi unaweza pia kueleweka ‘kama mfalme.’ Tini ya maelezo huhifadhi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kwa maana’ na ‘Kwa sababu’ zinatofautisha viunganishi viwili vya Kiebrania; ‘ukaidi’ ni rahisi kueleweka kuliko istilahi nzito kama ‘ushupavu.’ Alama zote za maelezo zimewekwa mara moja katika matini kuu.
