  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת פָּקַ֕דְתִּי אֵ֛ת אֲשֶׁר עָשָׂ֥ה עֲמָלֵ֖ק לְ/יִשְׂרָאֵ֑ל אֲשֶׁר שָׂ֥ם ל/וֹ֙ בַּ/דֶּ֔רֶךְ בַּ/עֲלֹת֖/וֹ מִ/מִּצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/002.yaml
  text: 'Thus says Yahweh of hosts: ‘I have taken note of what Amalek did to Israel[c][b][a], how he opposed him on the way when he came up from Egypt.’'
translation:
  language: sw
  text: 'Yahwe wa majeshi asema hivi: “Nimezingatia[a] yale ambayo Amaleki alimfanyia Israeli[c], jinsi alivyompinga njiani[b] wakati Israeli alipopanda kutoka Misri.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nimekumbuka yale ambayo Amaleki alimfanyia Israeli,” au, “Nimeiadhibu Amaleki kwa yale aliyomfanyia Israeli.” Kitenzi cha Kiebrania kinaweza kumaanisha kuzingatia, kukumbuka kwa nia ya kuchukua hatua, au kutembelea kwa hukumu.
    reason: lexical_alternative
  - marker: b
    text: Au, “jinsi alivyomwekea kizuizi njiani”; huenda pia, “jinsi alivyomvizia njiani.” Usemi wa Kiebrania unaeleza tendo la uhasama la Amaleki dhidi ya Israeli katika safari ya kutoka Misri.
    reason: lexical_alternative
  - marker: c
    text: Katika Kiebrania, “Israeli” inatajwa kama umoja unaowakilisha taifa lote; kwa hiyo viwakilishi vinavyoirejelea viko katika umoja.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Hii ni kauli ya kawaida ya mjumbe au nabii. ‘Asema hivi’ ni ya asili katika Kiswahili na inadumisha uzito wa tamko hilo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna inayotamkika kwa kawaida katika Kiswahili, badala ya kubadilishwa na cheo kama ‘BWANA’.
- source_word: צְבָאוֹת
  choice: wa majeshi
  rationale: Tafsiri hii fupi inadumisha upana wa cheo hicho bila kukihusisha na majeshi ya wanadamu pekee.
- source_word: פָּקַדְתִּי
  choice: Nimezingatia
  rationale: Kitenzi hiki kinaweza kumaanisha kukumbuka, kuangalia kwa makusudi, au kuja kwa hukumu. ‘Nimezingatia’ kinaonyesha kuwa Yahwe amelielekezea kosa hilo fikira kwa nia ya kuchukua hatua, bila kutanguliza wazi adhabu ya mstari unaofuata.
- source_word: אֵת אֲשֶׁר עָשָׂה עֲמָלֵק לְיִשְׂרָאֵל
  choice: yale ambayo Amaleki alimfanyia Israeli
  rationale: Kauli hii ya kawaida inaonyesha tendo baya lililofanywa dhidi ya Israeli bila kulifafanua zaidi ya Kiebrania.
- source_word: אֲשֶׁר שָׂם לוֹ בַּדֶּרֶךְ
  choice: jinsi alivyompinga njiani
  rationale: Usemi wa Kiebrania unaonyesha hatua ya uhasama dhidi ya Israeli. ‘Alivyompinga’ ni wazi na ya asili, bila kuamua kwamba tendo hilo lilikuwa hasa kuvizia.
- source_word: בַּעֲלֹתוֹ מִמִּצְרַיִם
  choice: wakati Israeli alipopanda kutoka Misri
  rationale: ‘Kupanda kutoka Misri’ inadumisha nahau ya Kiebrania. Kurudia ‘Israeli’ kunaondoa mkanganyiko wa kawaida wa viwakilishi vya Kiswahili kuhusu aliyepanda, huku maana ya chanzo ikiwa wazi.
theological_decisions:
- issue: Tafsiri ya jina na cheo יְהוָה צְבָאוֹת
  choice: Yahwe wa majeshi
  alternative: BWANA wa majeshi
  rationale: Jina binafsi la Mungu linadumishwa kama ‘Yahwe,’ na ‘wa majeshi’ halipunguzi cheo hicho kuwa majeshi ya wanadamu tu.
- issue: Maana ya kukumbuka na kuhukumu katika פָּקַדְתִּי
  choice: Nimezingatia
  alternative: Nimekumbuka; Nitaiadhibu kwa sababu ya
  rationale: Muktadha unaelekea kwenye hukumu inayokuja, lakini kitenzi chenyewe kinaweza kueleza kukumbuka au kulishughulikia jambo. Tafsiri iliyochaguliwa inadumisha mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa urahisi. Muundo ‘asema hivi’ unaendeleza mtindo wa tamko la kinabii, na marudio ya ‘Israeli’ yanazuia mkanganyiko wa kiwakilishi bila kubadili maana.
