  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל מֵ/עֲמָלֵקִ֣י הֱבִיא֗וּ/ם אֲשֶׁ֨ר חָמַ֤ל הָ/עָם֙ עַל מֵיטַ֤ב הַ/צֹּאן֙ וְ/הַ/בָּקָ֔ר לְמַ֥עַן זְבֹ֖חַ לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/אֶת הַ/יּוֹתֵ֖ר הֶחֱרַֽמְנוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/015.yaml
  text: And Saul said[a], “They brought them from the Amalekites, because the people spared the best of the sheep and the cattle, in order to sacrifice them to Yahweh your God; but the rest we devoted to destruction.”
translation:
  language: sw
  text: Sauli akasema, “Wamewaleta kutoka kwa Waamaleki, kwa sababu watu waliwaacha hai kondoo na ng’ombe walio bora zaidi ili wawatoe dhabihu kwa Yahwe, Mungu wako; lakini wale wengine tuliwatenga kwa ajili ya kuangamizwa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tuliwaangamiza kabisa.” Kiebrania kinatumia umbo la חָרַם, istilahi inayomaanisha kutenga kitu chini ya marufuku ili kiangamizwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֱבִיאוּם
  choice: Wamewaleta
  rationale: Hifili ya בוא pamoja na kiambishi cha yambwa cha wingi humaanisha ‘waliwaleta/wamewaleta.’ Wakati timilifu wa Kiswahili unasikika wa kawaida katika jibu la Sauli kuhusu wanyama waliopo mbele yao.
- source_word: מֵעֲמָלֵקִי
  choice: kutoka kwa Waamaleki
  rationale: Umbo la Kiebrania ni jina la watu, hivyo ‘Waamaleki’ ni sahihi kuliko kulitaja eneo la Amaleki.
- source_word: חָמַל ... עַל
  choice: waliwaacha hai
  rationale: Katika muktadha wa vita na marufuku ya kuangamiza, kitenzi kinaonyesha kutowaangamiza wanyama. ‘Waliwaacha hai’ huwasilisha tendo hilo wazi kuliko maneno yanayosisitiza hisia za huruma.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: kondoo na ng’ombe walio bora zaidi
  rationale: מֵיטַב hueleza sehemu iliyochaguliwa kuwa bora, huku הַצֹּאן na הַבָּקָר zikitaja makundi ya mifugo yanayokusudiwa kutolewa dhabihu.
- source_word: לְמַעַן זְבֹחַ
  choice: ili wawatoe dhabihu
  rationale: לְמַעַן huonyesha kusudi. Kiambishi ‘-wa-’ kinaweka wazi kuwa wanyama walioachwa hai ndio wangetolewa dhabihu, jambo lililo wazi kwa muktadha wa Kiebrania.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Jina la agano יהוה limetoholewa kuwa ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Kiambishi cha nafsi ya pili umoja kimehifadhiwa; Sauli anamwambia Samweli ‘Mungu wako,’ jambo lenye uzito wa kimuktadha.
- source_word: הַיּוֹתֵר
  choice: wale wengine
  rationale: Usemi huu unarejelea wanyama waliosalia baada ya wale bora kuachwa hai. ‘Wale wengine’ ni wa kawaida katika Kiswahili na hudumisha rejeo kwa wanyama.
- source_word: הֶחֱרַמְנוּ
  choice: tuliwatenga kwa ajili ya kuangamizwa
  rationale: Hifili ya חרם katika muktadha huu ni istilahi ya kuweka kitu chini ya marufuku ya hukumu ili kiangamizwe. Tafsiri hii inahifadhi maana hiyo pana kuliko ‘tuliwaangamiza’ pekee.
theological_decisions:
- issue: Maana ya חרם katika muktadha wa vita na hukumu
  choice: tuliwatenga kwa ajili ya kuangamizwa
  alternative: tuliwaangamiza kabisa
  rationale: Kitenzi hakisemi tu tendo la kawaida la kuharibu; kina wazo la kutenga chini ya marufuku ya hukumu kwa kusudi la kuangamiza. Tanbihi inatoa tafsiri fupi inayowezekana bila kufuta uzito wa istilahi hiyo katika matini kuu.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia moja kwa moja jina la agano יהוה. ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Kauli ya Sauli ‘Mungu wako’
  choice: Mungu wako
  alternative: Mungu wetu
  rationale: Kiebrania kina kiambishi cha nafsi ya pili umoja. Tafsiri haiubadili umbali wa kimatamshi unaoweza kudokezwa na maneno ya Sauli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi ‘waliwaacha hai’ ni wa moja kwa moja katika muktadha wa mifugo; ‘tuliwatenga kwa ajili ya kuangamizwa’ huhifadhi istilahi ya kiufundi bila kutumia lugha ya kizamani. Alama ya tanbihi imewekwa baada ya kishazi kinachohusu חָרַם, si baada ya ‘akasema,’ kwa kuwa hapo ndipo ufafanuzi wake unapohusika.
