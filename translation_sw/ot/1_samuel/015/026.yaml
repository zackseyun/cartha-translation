  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לֹ֥א אָשׁ֖וּב עִמָּ֑/ךְ כִּ֤י מָאַ֨סְתָּה֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֣ יְהוָ֔ה מִ/הְי֥וֹת מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/026.yaml
  text: And Samuel said to Saul, “I will not return with you, because you have rejected the word of Yahweh, and Yahweh has rejected you from being king over Israel.”
translation:
  language: sw
  text: Samweli akamwambia Sauli, “Sitarudi pamoja nawe, kwa sababu umelikataa neno la Yahweh, naye Yahweh amekukataa usiwe mfalme juu ya Israeli.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa kiambishi -ka- unaendeleza simulizi kwa kawaida katika Kiswahili, na kitenzi elekezi ‘akamwambia’ kinaonyesha wazi anayesemewa.
- source_word: לֹא אָשׁוּב עִמָּךְ
  choice: Sitarudi pamoja nawe
  rationale: ‘Kurudi’ ni maana ya moja kwa moja ya שׁוב, na ‘pamoja nawe’ huwasilisha uandamani unaoonyeshwa na עִמָּךְ kwa lugha ya heshima na ya kawaida.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa kiunganishi hiki kinatoa sababu ya Samweli kukataa kurudi pamoja na Sauli.
- source_word: מָאַסְתָּה
  choice: umelikataa
  rationale: ‘Kukataa’ huwasilisha maana ya מאס bila kuongeza hisia ya dharau isiyo lazima; kiambishi -li- hurejelea ‘neno’.
- source_word: דְּבַר יְהוָה
  choice: neno la Yahweh
  rationale: ‘Neno’ huhifadhi upana wa דָּבָר na usemi wa kibiblia, ingawa katika muktadha huu linahusisha agizo lililowasilishwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano יהוה limetafsiriwa kwa unukuzi ‘Yahweh’ badala ya kubadilishwa na cheo.
- source_word: וַיִּמְאָסְךָ
  choice: naye Yahweh amekukataa
  rationale: 'Kitenzi ‘kukataa’ kimerudiwa ili kuhifadhi urudiaji wa mzizi מאס na ulinganifu wa makusudi: Sauli alilikataa neno la Yahweh, naye Yahweh akamkataa Sauli.'
- source_word: מִהְיוֹת
  choice: usiwe
  rationale: Katika Kiswahili, ‘amekukataa usiwe’ huonyesha kwa kawaida kuondolewa katika hali au wadhifa, bila ugumu wa tafsiri ya neno kwa neno ‘kutoka kuwa’.
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: mfalme juu ya Israeli
  rationale: ‘Juu ya Israeli’ huhifadhi wazo la utawala lililo katika עַל huku likibaki wazi katika mtindo wa kibiblia wa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina יהוה moja kwa moja; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Urudiaji wa מאס kuhusu Sauli na Yahweh
  choice: Kutumia ‘kukataa’ katika vifungu vyote viwili
  alternative: Kutumia vitenzi tofauti, kama ‘kudharau’ katika kifungu cha kwanza na ‘kukataa’ katika cha pili
  rationale: 'Urudiaji wa mzizi uleule unaonyesha ulinganifu wenye uzito wa kiteolojia na kimahakama: Sauli alilikataa neno la Yahweh, na Yahweh akamkataa katika ufalme.'
- issue: Maana ya מִהְיוֹת מֶלֶךְ
  choice: amekukataa usiwe mfalme
  alternative: amekukataa kutoka kuwa mfalme; amekuondoa katika kuwa mfalme
  rationale: Chaguo hili linaonyesha kwamba kukataliwa kunahusu wadhifa wa kifalme bila kuamua zaidi ya maandishi kuhusu muda kamili wa kuondolewa kwake kwa vitendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Urudiaji wa ‘kukataa’ umehifadhiwa kwa makusudi; hakuna tanbihi inayohitajika.
