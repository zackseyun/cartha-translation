  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֣וּל אֶֽל הַ/קֵּינִ֡י לְכוּ֩ סֻּ֨רוּ רְד֜וּ מִ/תּ֣וֹךְ עֲמָלֵקִ֗י פֶּן אֹֽסִפְ/ךָ֙ עִמּ֔/וֹ וְ/אַתָּ֞ה עָשִׂ֤יתָה חֶ֨סֶד֙ עִם כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/עֲלוֹתָ֖/ם מִ/מִּצְרָ֑יִם וַ/יָּ֥סַר קֵינִ֖י מִ/תּ֥וֹךְ עֲמָלֵֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/006.yaml
  text: Then Saul said to the Kenite[a], “Go, turn aside, go down from among the Amalekites, lest I sweep you away with them[c][b]. For you showed kindness to all the sons of Israel when they came up from Egypt.” So the Kenite turned aside from among the Amalekites.
translation:
  language: sw
  text: Kisha Sauli akawaambia Wakeni[a], “Nendeni, ondokeni, shukeni kutoka miongoni mwa Waamaleki, nisije nikawafagilia mbali pamoja nao.[b] Kwa maana mlionyesha wana wote wa Israeli wema[c] walipopanda kutoka Misri.” Basi Wakeni wakaondoka kutoka miongoni mwa Waamaleki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina “Mkeni” katika umoja wa kijumla, yaani, watu wa Keni; amri zinazofuata ni za wingi.
    reason: grammatical_clarification
  - marker: b
    text: Au “nisije nikawaangamiza pamoja nao.” Kitenzi cha Kiebrania kinaweza kumaanisha kuondoa au kufagilia mbali pamoja na wengine katika hukumu.
    reason: lexical_alternative
  - marker: c
    text: Au “fadhili” au “uaminifu.” Neno la Kiebrania hesed linaweza kueleza wema wenye uaminifu na mshikamano.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֵּינִי / קֵינִי
  choice: Wakeni
  rationale: Kiebrania kinatumia jina la kabila katika umoja wa kijumla, lakini vitenzi vya amri ni vya wingi. Kiswahili cha kawaida hutumia wingi “Wakeni” kwa kundi linaloambiwa liondoke.
- source_word: לְכוּ סֻּרוּ רְדוּ
  choice: Nendeni, ondokeni, shukeni
  rationale: 'Mfululizo wa amri tatu umehifadhiwa: kwenda, kujiondoa, na kushuka. “Ondokeni” ni ya kawaida na wazi katika muktadha wa kujitenga na Waamaleki.'
- source_word: מִתּוֹךְ עֲמָלֵקִי / מִתּוֹךְ עֲמָלֵק
  choice: kutoka miongoni mwa Waamaleki
  rationale: Huwasilisha kwa kawaida wazo la kutoka katikati ya watu wa Amaleki na kudumisha urudiaji wa kifungu hicho mwishoni.
- source_word: פֶּן אֹסִפְךָ עִמּוֹ
  choice: nisije nikawafagilia mbali pamoja nao
  rationale: Katika muktadha wa hukumu, אסף inaweza kumaanisha kuondoa au kufutilia mbali pamoja na wengine. “Kuwafagilia mbali” huhifadhi taswira hiyo bila kuifanya iwe tu ‘kukusanya.’
- source_word: חֶסֶד
  choice: wema
  rationale: Hapa neno linaeleza tendo la fadhili na uaminifu wa Wakeni kwa Israeli. “Wema” ni la asili na pana, huku tanbihi ikihifadhi uwezekano wa “fadhili” au “uaminifu.”
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: wana wote wa Israeli
  rationale: Huhifadhi kwa kiasi kikubwa muundo wa Kiebrania wa jina la taifa, badala ya kuufupisha kuwa “Waisraeli wote.”
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: walipopanda kutoka Misri
  rationale: Kitenzi “kupanda” kinahifadhi lugha halisi ya mwelekeo inayotumiwa kuhusu kutoka Misri.
- source_word: וַיָּסַר
  choice: wakaondoka
  rationale: Mzizi uleule wa סור ulio katika amri unaonekana katika utekelezaji wake; “wakaondoka” ni Kiswahili cha kawaida kinachoonyesha kuwa walitii.
theological_decisions:
- issue: Maana ya חֶסֶד katika tendo la Wakeni kwa Israeli
  choice: wema
  alternative: fadhili; uaminifu; upendo mwaminifu
  rationale: Muktadha hauhitaji kudai kwamba Wakeni walikuwa washirika rasmi wa agano. “Wema” huhifadhi uzito wa tendo lao bila kuingiza hitimisho hilo, na tanbihi inaonyesha upana wa neno la Kiebrania.
- issue: Umoja wa kijumla wa jina קֵינִי
  choice: Wakeni
  alternative: Mkeni
  rationale: Amri za Kiebrania ni za wingi na muktadha unahusu kundi la watu. Wingi ni wazi na wa kawaida katika Kiswahili, huku tanbihi ikitaja umbo la umoja wa kijumla katika Kiebrania.
- issue: Nguvu ya hukumu katika אסף
  choice: kuwafagilia mbali
  alternative: kuwaangamiza; kuwaondoa
  rationale: Tafsiri hii huonyesha hatari ya kuondolewa pamoja na Waamaleki bila kulazimisha kitenzi kiwe na maana moja tu; tanbihi huhifadhi mbadala wa moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa urahisi. Wingi “Wakeni” na viwakilishi vya wingi vinafuata hadhira halisi inayoonyeshwa na amri za Kiebrania. Mfululizo wa amri umehifadhiwa ili kuonyesha msisitizo na mwendo wa maandishi ya chanzo.
