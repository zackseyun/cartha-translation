    rationale: '"Mliwatendea wana wote wa Israeli wema" is grammatically intelligible, but "mlionyesha wema kwa wana wote wa Israeli" is more natural modern Standard East African Swahili and communicates the Hebrew עשה חסד עם more smoothly.'
