base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/009.yaml
  text: But Saul and the people spared Agag and the best of the sheep and cattle[a], and the fattened calves, and the lambs, and all that was good, and they were not willing to devote them to destruction[b]. But every despised and worthless thing they devoted to destruction.
translation:
  language: sw
  text: Lakini Sauli na watu waliwahurumia na kuwaacha hai Agagi, kondoo bora na ng’ombe bora, wanyama walionona[a], kondoo dume, na kila kitu kilichokuwa kizuri. Hawakutaka kuwaweka wakfu kwa kuangamizwa[b]. Lakini kila kitu kilichodharauliwa na kisicho na thamani walikiweka wakfu kwa kuangamizwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maana ya neno hili la Kiebrania haijulikani kwa hakika. Huenda likamaanisha “wanyama wa pili,” “waliozaliwa wa pili,” au “wanyama walionona.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, hii ni kauli maalumu inayomaanisha kuweka mtu au kitu chini ya marufuku ili kiangamizwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: wakamhurumia ... wakawaacha hai
  rationale: Kitenzi kinaweza kumaanisha kuhurumia au kusaza. Uundaji huu unahifadhi wazo la huruma isiyofaa na pia matokeo yake ya kutotekeleza maangamizi yaliyoamriwa.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: kondoo na ng’ombe bora
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya sehemu iliyo bora zaidi ya mifugo hiyo.
- source_word: הַמִּשְׁנִים
  choice: wanyama walionona[a]
  rationale: Neno la Kiebrania ni gumu na maana yake haina uhakika. Tafsiri hii inafaa katika orodha ya mifugo, huku tanbihi ikihifadhi uwezekano mwingine unaohusiana na maana ya ‘pili.’
- source_word: הַכָּרִים
  choice: kondoo dume
  rationale: Kwa kawaida neno hili hutaja kondoo dume au wana-kondoo dume; ‘kondoo dume’ ni wazi na la kawaida.
- source_word: לֹא אָבוּ
  choice: Hawakutaka
  rationale: Inaonyesha kutokuwa tayari kwa makusudi, wala si kushindwa kwa kutokuwa na uwezo.
- source_word: הַחֲרִימָם / הֶחֱרִימוּ
  choice: kuwaweka/kuweka wakfu kwa kuangamizwa
  rationale: 'Inahifadhi maana maalumu ya חרם: kutenga watu au vitu chini ya marufuku ili viangamizwe, badala ya kusema tu ‘kuua’ au ‘kuharibu.’'
- source_word: כָל־הַמְּלָאכָה נְמִבְזָה וְנָמֵס
  choice: kila kitu kilichodharauliwa na kisicho na thamani
  rationale: Katika muktadha huu מְלָאכָה hurejelea mali au kitu kilichotekwa; tafsiri pana ‘kila kitu’ huepuka kubainisha zaidi ya maandishi.
theological_decisions:
- issue: Maana ya חרם katika muktadha wa vita
  choice: kuweka wakfu kwa kuangamizwa
  alternative: kuangamiza kabisa
  rationale: Chaguo hili linahifadhi wazo la kiufundi la kitu kutengwa chini ya marufuku kwa kusudi la kuangamizwa, bila kupunguza ukali wa tendo kuwa uharibifu wa kawaida.
- issue: Huruma ya Sauli na watu
  choice: wakamhurumia ... wakawaacha hai
  alternative: wakamsaza
  rationale: Maandishi yanaunganisha mtazamo wa huruma na tendo la kutomwangamiza; tafsiri haiondoi mvutano huo wala kuufanya huruma hiyo ionekane kuwa nzuri kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ng’ombe’ limetumiwa kama jina la jumla la mifugo ya bovini; ‘kondoo dume’ ni wazi kuliko istilahi adimu. Alama zote za tanbihi zimo katika matini kuu.
