lexical_decisions:
- source_word: וַיְהִי
  choice: Kisha ... likamjia
  rationale: Muundo wa simulizi unaanzisha hatua mpya inayofuatana; Kiswahili cha sasa huonyesha mfuatano huo kwa “Kisha,” huku “likamjia” ikiunganisha kwa kawaida kutokea kwa neno na mpokeaji wake.
- source_word: דְּבַר
  choice: neno
  rationale: Katika kauli ya kinabii דְּבַר יְהוָה, “neno” ni tafsiri ya moja kwa moja na ya kawaida, na inadumisha lugha ya ufunuo wa Mungu kuliko “ujumbe.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye konsonanti YHWH limetoholewa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: אֶל
  choice: -mjia
  rationale: Kihusishi kinaonyesha anayepokea neno; katika Kiswahili maana hiyo huwasilishwa kwa kawaida ndani ya kitenzi “likamjia.”
- source_word: שְׁמוּאֵל
  choice: Samweli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia na hutambulika kwa urahisi na wasomaji.
- source_word: לֵאמֹר
  choice: likisema
  rationale: Kitenzi-jina hiki kinatanguliza yaliyomo katika usemi wa Mungu. “Likisema” huhifadhi kwa uwazi utangulizi huo na kupatana na nomino “neno.”
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi YHWH. “Yahwe” hulihifadhi kama jina badala ya kuliwakilisha kwa cheo, huku tanbihi ikieleza desturi nyingine ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “neno ... likamjia ... likisema” huhifadhi taswira na fomula ya Kiebrania bila kutumia msemo wa kizamani kama “ikawa kwamba.”
