  text: 'Kisha neno la Yahweh[a] likamjia Samweli, likisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi hutafsiriwa “BWANA.”'
