  yaml_path: translation/ot/1_samuel/015/004.yaml
  text: 'So Saul summoned the people and mustered them at Telaim: two hundred thousand foot soldiers[a], and ten thousand men of Judah.'
translation:
  language: sw
  text: 'Basi Sauli akawakusanya watu, akawahesabu huko Telaimu[a]: askari wa miguu laki mbili, na wanaume wa Yuda elfu kumi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja na wana-kondoo,” ikiwa בַּטְּלָאִים linaeleweka kwa maana yake halisi badala ya jina la mahali Telaimu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: akawaita watu wakusanyike
  rationale: Hifili ya שׁמע hapa ni usemi wa kuita watu pamoja. Tafsiri hii ni ya asili katika Kiswahili na inafaa muktadha wa kijeshi.
- source_word: הָעָם
  choice: watu
  rationale: Neno hilo kwa msingi ni ‘watu.’ Ingawa hapa linawahusu walioitwa kwa vita, kutolitafsiri moja kwa moja kuwa ‘jeshi’ kunahifadhi upana wa Kiebrania.
- source_word: וַיִּפְקְדֵם
  choice: akawahesabu
  rationale: Katika muktadha wa kijeshi פקד inaweza kumaanisha kuwakusanya na kuwahakiki askari kwa kuwahesabu. ‘Akawahesabu’ ni wazi na ya kawaida kwa wasomaji wa Kiswahili.
- source_word: בַּטְּלָאִים
  choice: huko Telaimu
  rationale: Katika muktadha huu umbo hili linaeleweka vizuri zaidi kama jina la mahali Telaimu, ingawa maana halisi inayowezekana ni ‘kwa wana-kondoo’; uwezekano huo umehifadhiwa katika tanbihi.
- source_word: מָאתַיִם אֶלֶף
  choice: laki mbili
  rationale: Hii ndiyo namna fupi, sahihi, na ya kawaida ya kusema 200,000 katika Kiswahili.
- source_word: רַגְלִי
  choice: askari wa miguu
  rationale: Neno hilo linataja wapiganaji wanaokwenda kwa miguu, tofauti na askari wapanda farasi au magari; ‘askari wa miguu’ ni wazi na huhifadhi taswira ya chanzo.
- source_word: וַעֲשֶׂרֶת אֲלָפִים
  choice: pamoja na watu elfu kumi
  rationale: Idadi imetafsiriwa moja kwa moja, na kiunganishi ‘pamoja na’ kinaonyesha kundi la ziada kwa Kiswahili cha asili.
- source_word: אֶת אִישׁ יְהוּדָה
  choice: watu elfu kumi wa Yuda
  rationale: אִישׁ hapa ina maana ya jumla ya watu wanaohusishwa na Yuda. ‘Watu wa Yuda’ ni ya asili na haiingizi maelezo yasiyokuwapo katika chanzo.
