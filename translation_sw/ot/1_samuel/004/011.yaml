  text: And the ark of God was captured, and the two sons of Eli died, Hophni and Phinehas.
translation:
  language: sw
  text: Sanduku la Mungu likatekwa, na wana wawili wa Eli wakafa, Hofni na Finehasi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרוֹן אֱלֹהִים
  choice: Sanduku la Mungu
  rationale: Muundo wa nomino katika Kiebrania unaonyesha sanduku linalomhusu Mungu. Kauli hii ni ya kawaida katika Kiswahili cha Biblia na inadumisha uzito wa asili bila kuongeza neno lisilokuwamo hapa.
- source_word: נִלְקָח
  choice: likatekwa
  rationale: Umbo la Niphal ni la kutendwa; katika muktadha wa vita, kitenzi kinaeleza kutekwa na adui, si kuchukuliwa tu.
- source_word: וּשְׁנֵי בְנֵי עֵלִי
  choice: na wana wawili wa Eli
  rationale: Tafsiri hii inadumisha idadi ya wana na uhusiano wao na Eli kwa Kiswahili cha kawaida na kilicho wazi.
- source_word: מֵתוּ
  choice: wakafa
  rationale: Kitenzi cha Kiebrania kinaripoti kifo moja kwa moja. 'Wakafa' ni tafsiri sahili, asilia, na isiyoongeza taswira.
- source_word: חָפְנִי וּפִינְחָס
  choice: Hofni na Finehasi
  rationale: Majina yametoholewa kwa maumbo yaliyozoeleka katika matumizi ya Biblia za Kiswahili, huku yakidumisha nafasi yake ya kufafanua hao wana wawili.
