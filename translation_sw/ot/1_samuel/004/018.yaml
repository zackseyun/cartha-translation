base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/018.yaml
  text: And it happened[a], when he mentioned the ark of God, that Eli fell backward from the seat by the side of the gate, and his neck was broken and he died, for the man was old and heavy[b]. And he had judged Israel forty years.
translation:
  language: sw
  text: Ikawa, alipotaja sanduku la Mungu, Eli alianguka kinyumenyume kutoka kwenye kiti chake kando ya lango[a]. Shingo yake ikavunjika, naye akafa, kwa maana mtu huyo alikuwa mzee na mzito[b]. Naye alikuwa mwamuzi wa Israeli kwa miaka arobaini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “karibu na lango” au “upande wa lango.” Nahau ya Kiebrania, neno kwa neno, ni “kando ya mkono wa lango.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno, “mzito.” Neno hili huenda likadokeza kwamba uzito wa Eli, pamoja na uzee wake, ulichangia kifo chake kutokana na anguko hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהַזְכִּירוֹ
  choice: alipotaja
  rationale: Hifili ya זכר hapa ina maana ya ‘kutaja’; muundo huu pia unaonyesha wazi wakati tendo lilipotokea.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: sanduku la Mungu
  rationale: Huu ni uundaji wa kawaida wa Kiswahili unaofuata hali ya muundo wa Kiebrania na istilahi iliyozoeleka katika simulizi.
- source_word: וַיִּפֹּל ... אֲחֹרַנִּית
  choice: alianguka kinyumenyume
  rationale: ‘Kinyumenyume’ linahifadhi maana ya kielezi אֲחֹרַנִּית bila kuongeza namna nyingine ya kuanguka.
- source_word: הַכִּסֵּא
  choice: kiti chake
  rationale: ‘Kiti’ linafaa zaidi kuliko ‘kiti cha enzi’ katika mazingira haya; kiwakilishi cha umilikaji kinaifanya sentensi iwe ya kawaida kwa Kiswahili bila kubadili rejeleo.
- source_word: בְּעַד יַד הַשַּׁעַר
  choice: kando ya lango
  rationale: Hili linaeleza kwa Kiswahili cha kawaida mahali palipo ‘mkono/upande wa lango,’ huku tanbihi ikihifadhi uwezekano wa tafsiri nyingine za nahau hiyo.
- source_word: וַתִּשָּׁבֵר מַפְרַקְתּוֹ
  choice: Shingo yake ikavunjika
  rationale: מַפְרֶקֶת humaanisha shingo au kisogo; ‘shingo’ ni sahihi, wazi, na ya kawaida kwa msomaji wa kisasa.
- source_word: כִּי זָקֵן הָאִישׁ וְכָבֵד
  choice: kwa maana mtu huyo alikuwa mzee na mzito
  rationale: ‘Mzito’ huhifadhi maana ya moja kwa moja ya כָבֵד na haibadili kimya kimya kuwa ‘mnene kupita kiasi.’
- source_word: שָׁפַט אֶת יִשְׂרָאֵל
  choice: alikuwa amewaamua Israeli
  rationale: Kauli hii inatoa muhtasari wa kipindi cha Eli kilichokamilika akiwa mwamuzi wa Israeli; wakati timilifu wa zamani unafaa katika taarifa hii ya mwisho wa maisha yake.
- source_word: אַרְבָּעִים שָׁנָה
  choice: miaka arobaini
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya idadi pamoja na kipindi cha wakati.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika אֲרוֹן הָאֱלֹהִים
  choice: Mungu
  alternative: miungu
  rationale: Katika muktadha huu sanduku ni la Mungu wa Israeli; hivyo rejeleo ni la umoja, si la miungu mingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Ikawa’ huhifadhi kiunganishi cha kisimulizi cha Kiebrania bila kufanya sentensi kuwa nzito kupita kiasi.
