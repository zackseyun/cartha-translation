  text: וַ/יָּבֹ֣א הָ/עָם֮ אֶל הַֽ/מַּחֲנֶה֒ וַ/יֹּֽאמְרוּ֙ זִקְנֵ֣י יִשְׂרָאֵ֔ל לָ֣/מָּה נְגָפָ֧/נוּ יְהוָ֛ה הַ/יּ֖וֹם לִ/פְנֵ֣י פְלִשְׁתִּ֑ים נִקְחָ֧ה אֵלֵ֣י/נוּ מִ/שִּׁלֹ֗ה אֶת אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה וְ/יָבֹ֣א בְ/קִרְבֵּ֔/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/כַּ֥ף אֹיְבֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/003.yaml
  text: When the people came into the camp[a], the elders of Israel said, “Why has Yahweh struck us down today before the Philistines? Let us bring here from Shiloh the ark of the covenant of Yahweh, so that it may come into our midst and save us from the hand of our enemies.”
translation:
  language: sw
  text: Watu walipofika kambini, wazee wa Israeli wakasema, “Kwa nini Yahwe ametupiga leo mbele ya Wafilisti? Tulete hapa kutoka Shilo sanduku la agano la Yahwe, ili lije katikati yetu na kutuokoa[a] kutoka mkononi mwa adui zetu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili aje katikati yetu na kutuokoa,” ikiwa vitenzi vya umoja vinaeleweka kumrejelea moja kwa moja Yahwe, ambaye uwepo wake ulihusishwa na sanduku.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: watu
  rationale: Neno hili kwa kawaida humaanisha ‘watu’; hapa muktadha wa kambi unaonyesha kwamba ni jeshi la Israeli bila kulazimisha maana hiyo ndani ya tafsiri.
- source_word: הַמַּחֲנֶה
  choice: kambini
  rationale: Ni usemi wa kawaida na wa asili kwa kambi ya kijeshi.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: wazee wa Israeli
  rationale: Huwataja viongozi waliotambuliwa wa Israeli kwa lugha ya kawaida ya kibiblia.
- source_word: נְגָפָנוּ
  choice: ametupiga
  rationale: Kitenzi kinaonyesha kupigwa vitani na kinadumisha kwamba Yahwe ndiye mtendaji; ‘ametushinda’ kingesisitiza matokeo pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina binafsi la Mungu lililoandikwa katika Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: mbele ya Wafilisti
  rationale: Hufuata usemi wa Kiebrania na katika muktadha huu humaanisha kupigwa katika mapambano dhidi yao.
- source_word: נִקְחָה אֵלֵינוּ
  choice: tulilete hapa
  rationale: Huwasilisha pendekezo la kuleta sanduku kutoka Shilo hadi walipokuwa kwa Kiswahili cha asili.
- source_word: מִשִּׁלֹה
  choice: kutoka Shilo
  rationale: Ni uhamishaji wa moja kwa moja wa jina la mahali na kihusishi cha asili.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahwe
  rationale: Huhifadhi mfululizo wa umilikaji wa Kiebrania na umuhimu wa agano.
- source_word: וְיָבֹא בְקִרְבֵּנוּ
  choice: ili lije katikati yetu
  rationale: Kiambishi cha ngeli katika ‘lije’ kinarejelea kisarufi ‘sanduku’ na ‘katikati yetu’ huhifadhi wazo la uwepo ndani ya jumuiya.
- source_word: וְיֹשִׁעֵנוּ
  choice: na kutuokoa
  rationale: Hutoa maana ya kuokoa au kukomboa bila kuifupisha kuwa ushindi wa kijeshi tu.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: kutoka mkononi mwa adui zetu
  rationale: Huhifadhi nahau ya Kiebrania ya ‘mkono’ kama nguvu au mamlaka kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: Bwana au Yehova
  rationale: Maandishi yana jina la agano moja kwa moja; ‘Yahwe’ hulihifadhi kama jina binafsi badala ya cheo.
- issue: Mtendaji wa vitenzi וְיָבֹא ... וְיֹשִׁעֵנוּ
  choice: 'sanduku: “ili lije ... na kutuokoa”'
  alternative: 'Yahwe: “ili aje ... na kutuokoa”'
  rationale: Sanduku ndilo rejeleo la karibu la kisarufi, lakini vitenzi vya umoja vinaweza kueleweka kuwa vinamrejelea Yahwe ambaye uwepo wake ulihusishwa na sanduku. Tafsiri kuu hufuata rejeleo la karibu, na tanbihi huhifadhi utata wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetungwa kwa mtiririko wa kawaida huku ikihifadhi taswira za Kiebrania kama ‘mbele ya’ na ‘mkononi mwa.’
