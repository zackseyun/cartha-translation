base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/008.yaml
  text: Woe to us! Who can deliver us from the hand of these mighty gods? These are the gods who struck Egypt with every plague in the wilderness[a][b].
translation:
  language: sw
  text: Ole wetu! Ni nani atakayetuokoa kutoka mkononi mwa miungu hii yenye nguvu? Hii ndiyo miungu iliyopiga Misri kwa kila pigo nyikani.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu huyu mwenye nguvu.” Wafilisti hutumia maumbo ya wingi, yakionyesha jinsi wao wenyewe walivyomwelewa Mungu wa Israeli.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “nyikani.” Kirai hiki ni kigumu katika muktadha, kwa kuwa mapigo yaliipata Misri kabla ya safari ya Israeli nyikani; tafsiri inafuata Andiko la Kimasoreti kama lilivyoandikwa.'
    reason: textual_variant
lexical_decisions:
- source_word: א֣וֹי לָ֔נוּ
  choice: Ole wetu!
  rationale: Nahau hii ya Kiebrania ni kilio cha hofu na maafa; “Ole wetu!” huhifadhi uzito wake kwa Kiswahili cha heshima.
- source_word: מִ֣י יַצִּילֵ֔נוּ
  choice: Ni nani atakayetuokoa
  rationale: Kitenzi נצל katika Hifili humaanisha kuokoa au kukomboa kutoka hatarini; swali hili linaonyesha kukata tamaa.
- source_word: מִיַּד
  choice: kutoka mkononi mwa
  rationale: Huhifadhi sitiari ya Kiebrania ya mkono kama mamlaka au nguvu inayomshikilia mtu.
- source_word: הָאֱלֹהִים הָאַדִּירִים הָאֵלֶּה
  choice: miungu hawa wenye nguvu
  rationale: Kivumishi na kiashiria vina umbo la wingi, vikionyesha jinsi Wafilisti walivyomwelewa Mungu wa Israeli kwa mtazamo wao wa miungu mingi.
- source_word: אֵלֶּה הֵם הָאֱלֹהִים
  choice: Hawa ndio miungu
  rationale: Ni tungo ya utambulisho; tafsiri hii ni ya asili katika Kiswahili na inadumisha wingi wa usemi wa Wafilisti.
- source_word: הַמַּכִּים אֶת מִצְרַיִם
  choice: walioipiga Misri
  rationale: Kishiriki kinaeleza tendo la wakati uliopita linalojulikana; Misri imetafsiriwa kama nchi au jamii kwa ujumla.
- source_word: בְּכָל מַכָּה
  choice: kwa kila pigo
  rationale: Tafsiri ya karibu ya ‘kwa/kwa kutumia kila pigo’; “pigo” linaweza kumaanisha janga au kipigo na huhifadhi upana wa neno la chanzo.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: Hii ndiyo maana ya kawaida ya מִדְבָּר; imedumishwa licha ya ugumu wake wa kihistoria katika muktadha.
theological_decisions:
- issue: Kutafsiri אֱלֹהִים katika usemi wa Wafilisti
  choice: miungu
  alternative: Mungu
  rationale: Maumbo ya wingi ya kivumishi na kishiriki yanaunga mkono wingi. Tafsiri inadumisha mtazamo wa Wafilisti bila kuugeuza usemi wao kuwa ungamo la imani ya Israeli.
- issue: Kirai kigumu בַּמִּדְבָּר
  choice: nyikani
  alternative: kukiacha au kukifasiri upya ili kupatanisha historia
  rationale: Andiko la Kimasoreti lina kirai hiki. Kimehifadhiwa badala ya kuondoa mvutano kwamba mapigo ya Misri yalitangulia safari ya nyikani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ole wetu” hudumisha kilio kizito; “kutoka mkononi mwa” huhifadhi sitiari ya chanzo; na maumbo ya wingi yamehifadhiwa kwa makusudi katika usemi wa Wafilisti.
