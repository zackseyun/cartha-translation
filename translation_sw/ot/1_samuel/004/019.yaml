base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/019.yaml
  text: His daughter-in-law[a], the wife of Phinehas, was pregnant, about to give birth. When she heard the report that the ark of God had been taken, and that her father-in-law and her husband were dead, she bowed down and gave birth[c][b], because her labor pains came upon her.
translation:
  language: sw
  text: Binti-mkwe wake, mke wa Finehasi, alikuwa mjamzito na karibu kujifungua. Aliposikia habari kwamba sanduku la Mungu lilikuwa limetekwa[a], na kwamba baba-mkwe wake na mume wake walikuwa wamekufa[b], aliinama na kujifungua, kwa sababu uchungu wake wa kuzaa ulimjia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “habari kuhusu kutekwa kwa sanduku la Mungu.” Muundo wa Kiebrania unaweza kueleweka kuwa yaliyomo katika habari au jambo ambalo habari hiyo ilihusu.
    reason: lexical_alternative
  - marker: b
    text: Au, “baba-mkwe wake na mume wake walikuwa wafu.” Kiebrania kinaweza kuwasilishwa kama hali iliyokuwapo au kama tukio la kufa lililokuwa limetangulia.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “uchungu wake wa kuzaa ulimgeukia”; huu ni usemi unaomaanisha kwamba uchungu wa kuzaa ulimjia, na unaweza kudokeza kwamba ulimshika kwa nguvu au kwa ghafla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַלָּתוֹ
  choice: Mke wa mwanawe
  rationale: כַּלָּה hapa ni mke wa mwana, yaani binti-mkwe. ‘Mke wa mwanawe’ ni wazi na ya kawaida zaidi katika Kiswahili sanifu kuliko istilahi inayoweza kuwa na utata.
- source_word: אֵשֶׁת פִּינְחָס
  choice: yaani mke wa Finehasi
  rationale: Kirai hiki kinamtambulisha kwa usahihi zaidi mwanamke aliyetajwa; ‘yaani’ huonyesha uhusiano wa maelezo ya ziada kwa Kiswahili cha kawaida.
- source_word: הָרָה לָלַת
  choice: alikuwa mjamzito na karibu kujifungua
  rationale: Huhifadhi hali ya ujauzito pamoja na ukaribu wa wakati wa kujifungua.
- source_word: וַתִּשְׁמַע אֶת־הַשְּׁמֻעָה
  choice: Aliposikia habari
  rationale: שְׁמוּעָה ni habari au taarifa; muundo wa ‘aliposikia’ unaonyesha vizuri mfuatano wa matukio.
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: kwamba sanduku la Mungu lilikuwa limetekwa
  rationale: Huwasilisha kirai kama yaliyomo katika habari na kuhifadhi hali tendwa ya הִלָּקַח.
- source_word: וּמֵת חָמִיהָ וְאִישָׁהּ
  choice: na kwamba baba mkwe wake na mume wake walikuwa wamekufa
  rationale: Huwasilisha kifo kama hali iliyokuwapo kufuatia tukio lililotangulia; ‘baba mkwe’ humtambulisha wazi Eli kwa uhusiano wake naye.
- source_word: וַתִּכְרַע וַתֵּלֶד
  choice: aliinama na kujifungua
  rationale: כרע humaanisha kuinama, kupiga magoti, au kuchutama. ‘Aliinama’ huhifadhi maana ya msingi bila kuamua kwa ziada kama alianguka au alichutama kwa namna fulani ya kujifungua.
- source_word: כִּי נֶהֶפְכוּ עָלֶיהָ צִרֶיהָ
  choice: kwa sababu uchungu wake wa kuzaa ulimjia ghafla
  rationale: צִרֶיהָ ni uchungu wa kuzaa; usemi wa Kiebrania unaonyesha uchungu huo ukimjia au kumshika kwa ghafula.
