reference: 1 Samuel 4:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח הָ/עָם֙ שִׁלֹ֔ה וַ/יִּשְׂא֣וּ מִ/שָּׁ֗ם אֵ֣ת אֲר֧וֹן בְּרִית יְהוָ֛ה צְבָא֖וֹת יֹשֵׁ֣ב הַ/כְּרֻבִ֑ים וְ/שָׁ֞ם שְׁנֵ֣י בְנֵֽי עֵלִ֗י עִם אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים חָפְנִ֖י וּ/פִֽינְחָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/004.yaml
  text: So the people sent to Shiloh[a], and they carried from there the ark of the covenant of Yahweh of hosts, who is enthroned above the cherubim. And the two sons of Eli, Hophni and Phinehas[b], were there with the ark of the covenant of God.
translation:
  language: sw
  text: Basi watu wakatuma kwenda Shilo, wakachukua kutoka huko sanduku la agano la Yahwe wa majeshi[a], anayeketi juu ya makerubi katika kiti cha enzi[b]. Wana wawili wa Eli, Hofni na Finehasi, walikuwa huko pamoja na sanduku la agano la Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe wa majeshi ya mbinguni.”
    reason: lexical_alternative
  - marker: b
    text: Au, “anayeketi katika kiti cha enzi katikati ya makerubi.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח הָעָם שִׁלֹה
  choice: Basi watu wakatuma watu kwenda Shilo
  rationale: Kitenzi hakitaji wazi waliotumwa, lakini muktadha unaonyesha kuwa watu walitumwa ili walilete sanduku. Kurudia neno “watu” ni wazi na kwa kiasi kikubwa huhifadhi muundo na maana ya Kiebrania bila kuwataja mahususi kuwa wajumbe.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: nao wakalibeba kutoka huko
  rationale: Neno נשׂא hapa linaonyesha kuinua na kubeba sanduku; “wakalibeba” huhifadhi maana hiyo ya kimwili kuliko “wakalileta” pekee.
- source_word: אֲרוֹן בְּרִית
  choice: sanduku la agano
  rationale: Hili ni neno la kawaida, wazi, na linaloeleweka katika Kiswahili kwa sanduku takatifu linalohusishwa na agano.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahwe wa majeshi
  rationale: “Yahwe” huhifadhi jina la Mungu, na “majeshi” hutoa maana ya צְבָאוֹת kwa Kiswahili cha sasa bila kulifanya kuwa jina lingine.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: anayeketi katika kiti cha enzi juu ya makerubi
  rationale: Katika usemi huu wa ibada, יֹשֵׁב ina wazo la kutawala akiwa katika kiti cha enzi. “Juu ya makerubi” hufaa taswira ya sanduku bila kulazimisha maana ya “katikati ya” ambayo haijaelezwa moja kwa moja.
- source_word: וְשָׁם שְׁנֵי בְנֵי עֵלִי
  choice: Wana wawili wa Eli ... walikuwa huko
  rationale: Muundo huu ni wa kawaida katika Kiswahili na huhifadhi taarifa ya mahali inayotolewa na וְשָׁם.
- source_word: עִם אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: pamoja na sanduku la agano la Mungu
  rationale: “Pamoja na” hutoa maana ya kawaida ya עִם bila kudai uhusiano mahususi zaidi wa mahali.
- source_word: חָפְנִי וּפִינְחָס
  choice: Hofni na Finehasi
  rationale: Majina yametoholewa kwa maumbo yanayotambulika na yanayotumika kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה katika cheo יְהוָה צְבָאוֹת
  choice: Yahwe wa majeshi
  alternative: BWANA wa majeshi
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu, יהוה. “Yahwe” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya usemi יֹשֵׁב הַכְּרֻבִים
  choice: anayeketi katika kiti cha enzi juu ya makerubi
  alternative: anayeketi katika kiti cha enzi katikati ya makerubi
  rationale: “Katika kiti cha enzi” huhifadhi wazo la ufalme wa Mungu lililomo katika usemi huu, huku “juu ya” ikiacha wazi uhusiano halisi wa mahali kuliko tafsiri ya “katikati ya.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa sasa, wenye heshima, na unaosomeka kwa urahisi. Jina “Yahwe” limehifadhiwa, na istilahi “sanduku la agano” na “makerubi” zimetumiwa kwa uwazi na uthabiti wa kibiblia.
