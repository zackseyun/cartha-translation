base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/020.yaml
  text: And about the time of her death[a], the women standing by her said, “Do not fear, for you have borne a son.” But she did not answer, nor did she take it to heart.
translation:
  language: sw
  text: Alipokuwa karibu kufa, wanawake waliokuwa kando yake wakamwambia, “Usiogope, kwa maana umezaa mwana.” Lakini hakujibu wala hakulitia moyoni[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wala hakulizingatia,” yaani, hakuyapa maanani maneno yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעֵת מוּתָהּ
  choice: Karibu na wakati wa kufa kwake
  rationale: Kirai hiki kinaweka mazingira ya wakati unaokaribia kifo chake; tafsiri hii inadumisha maana ya muda bila kuamua kwamba maneno hayo yalisemwa baada ya kifo.
- source_word: וַתְּדַבֵּרְנָה
  choice: wakamwambia
  rationale: Kitenzi cha wingi wa kike kinaonyesha wanawake hao wakisema maneno yaliyonukuliwa moja kwa moja; “wakamwambia” ni ya kawaida na wazi katika simulizi la Kiswahili.
- source_word: הַנִּצָּבוֹת עָלֶיהָ
  choice: wanawake waliokuwa wamesimama kando yake
  rationale: Umoja wa kike unaeleweka kutokana na muktadha kama wanawake waliokuwapo karibu naye. “Wamesimama kando yake” huhifadhi picha halisi ya Kiebrania bila kuongeza wazi wajibu wa ukunga ambao haukutajwa.
- source_word: אַל תִּירְאִי
  choice: Usiogope
  rationale: Hii ni katazo la moja kwa moja kwa mwanamke mmoja na ni usemi wa kawaida, wenye heshima katika Kiswahili.
- source_word: כִּי בֵן יָלָדְתְּ
  choice: kwa maana umezaa mwana
  rationale: “Kwa maana” inaonyesha sababu ya faraja, na “umezaa mwana” huwasilisha moja kwa moja tendo la kujifungua mtoto wa kiume.
- source_word: וְלֹא עָנְתָה
  choice: hakujibu
  rationale: Kitenzi ענה hapa kina maana ya kujibu au kuitikia; “hakujibu” ni tafsiri ya moja kwa moja.
- source_word: וְלֹא שָׁתָה לִבָּהּ
  choice: wala hakulitia moyoni
  rationale: Nahau hii huhusisha kuweka jambo moyoni, yaani kulizingatia au kulipa maanani. Tafsiri huhifadhi lugha ya “moyo” pamoja na uwezekano wake wa maana ya kinahau.
