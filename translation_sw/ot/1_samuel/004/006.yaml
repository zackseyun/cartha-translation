base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/006.yaml
  text: When the Philistines heard the sound of the shouting[a], they said[b], “What is this great sound of shouting in the camp of the Hebrews?” And they knew that the ark of Yahweh had come into the camp.
translation:
  language: sw
  text: Wafilisti waliposikia sauti ya makelele[a], wakasema, “Sauti hii kubwa ya makelele katika kambi ya Waebrania ni nini?” Wakajua kwamba sanduku la Yahwe[b] lilikuwa limefika kambini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kilio” au, katika mazingira ya kijeshi, “kilio cha vita.”
    reason: lexical_alternative
  - marker: b
    text: 'Kwa desturi nyingine ya kutafsiri jina יְהוָה: “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: sauti
  rationale: Neno hili linarejelea jambo lililosikika kutokana na kelele za Waisraeli; “sauti” ni tafsiri ya kawaida na linafaa katika sehemu zote mbili.
- source_word: תְּרוּעָה
  choice: kelele
  rationale: Neno hili linaweza kumaanisha kelele kubwa, mwaliko wa tahadhari, au kilio cha vita. “Kelele” linahifadhi upana huo bila kulifafanua kupita kiasi.
- source_word: מֶה
  choice: ni ya nini?
  rationale: Katika muktadha huu swali linataka kujua chanzo au maana ya sauti hiyo. Kauli hii ni ya kawaida katika Kiswahili huku ikidumisha udhahiri wa swali.
- source_word: הַגְּדוֹלָה
  choice: kubwa
  rationale: Hii ndiyo maana ya msingi ya kivumishi; hapa inaeleza ukubwa au nguvu ya sauti bila kuibadili moja kwa moja kuwa “kubwa sana” au “ya juu.”
- source_word: מַחֲנֶה
  choice: kambi
  rationale: Neno linamaanisha kambi ya kijeshi katika simulizi hili na “kambi” ni tafsiri fupi ya kawaida.
- source_word: הָעִבְרִים
  choice: Waebrania
  rationale: Jina la kikabila walilotumia Wafilisti limehifadhiwa badala ya kubadilishwa kuwa “Waisraeli,” ili kudumisha mtazamo wa wasemaji.
- source_word: וַיֵּדְעוּ
  choice: Wakajua
  rationale: Tafsiri hii inafuata kwa karibu kitenzi cha Kiebrania na katika mfuatano wa simulizi inaweza kueleza kwamba walipata habari hiyo.
- source_word: אֲרוֹן יְהוָה
  choice: sanduku la Yahwe
  rationale: “Sanduku” ni istilahi inayoeleweka kwa ארון katika muktadha wa sanduku takatifu, na jina la Mungu יְהוָה limetolewa kama “Yahwe.”
- source_word: בָּא אֶל הַמַּחֲנֶה
  choice: lilikuwa limefika kambini
  rationale: Muundo huu unaonyesha tendo lililokuwa limekamilika kabla ya Wafilisti kulijua na unaeleza kwa kawaida kufika kwake katika kambi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יְהוָה. “Yahwe” huhifadhi jina hilo katika matini kuu, huku “BWANA” likitajwa kama desturi nyingine ya tafsiri.
- issue: Maana ya sanduku katika mstari huu
  choice: sanduku la Yahwe
  alternative: sanduku la agano la Yahwe
  rationale: Chanzo kinasema tu אֲרוֹן יְהוָה, bila neno “agano”; kwa hiyo tafsiri haiongezi ufafanuzi huo ingawa sanduku hili linajulikana katika muktadha mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye heshima. Kurudiwa kwa “sauti” na “kelele” kumehifadhiwa kwa sababu kunarudia msisitizo wa maandishi ya Kiebrania, ingawa usemi huo ni mzito kidogo kwa makusudi.
