  yaml_path: translation/ot/1_samuel/004/012.yaml
  text: Then a man of Benjamin ran from the battle line and came to Shiloh that same day[b][a], with his clothes torn and dirt on his head.
translation:
  language: sw
  text: Ndipo mtu mmoja wa kabila la Benyamini akakimbia kutoka kwenye safu ya mapigano[a], akafika Shilo siku hiyo hiyo, nguo zake zimeraruliwa na udongo kichwani mwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka vitani” au “kutoka katika safu za jeshi”; neno la Kiebrania hapa humaanisha hasa safu au mpangilio wa vita, yaani mstari wa mapambano.
    reason: lexical_alternative
  - marker: b
    text: Nguo zilizoraruliwa na udongo kichwani zilikuwa ishara za kawaida za maombolezo, dhiki, au msiba.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּרָץ
  choice: akakimbia
  rationale: Kitenzi רוץ kinaonyesha kwenda kwa kasi; “akakimbia” ni tafsiri ya moja kwa moja bila kuongeza wazo la kukimbia kwa hofu.
- source_word: אִישׁ בִּנְיָמִן
  choice: mtu mmoja wa kabila la Benyamini
  rationale: Muundo huu unatambulisha mtu kwa kabila lake; kutaja “kabila” hufanya maana iwe wazi na ya kawaida katika Kiswahili.
- source_word: מֵהַמַּעֲרָכָה
  choice: kutoka kwenye safu ya mapigano
  rationale: מַעֲרָכָה hapa huhusu jeshi lililopangwa kwa vita au mstari wa mapambano, si tukio la vita kwa ujumla tu.
- source_word: וַיָּבֹא שִׁלֹה
  choice: akafika Shilo
  rationale: Katika muktadha wa safari iliyokamilika, “akafika Shilo” ni Kiswahili cha kawaida na huonyesha kuwasili kwenye mahali palipokusudiwa.
- source_word: בַּיּוֹם הַהוּא
  choice: siku iyo hiyo
  rationale: Ni usemi wa asili unaoonyesha kwamba aliwasili siku ileile ya tukio bila kuongeza taarifa mpya.
- source_word: וּמַדָּיו קְרֻעִים
  choice: nguo zake zikiwa zimeraruliwa
  rationale: מַדִּים ni mavazi, na participle ya קרע huonyesha hali ya nguo zilizoraruliwa, ishara inayohusishwa na maombolezo au msiba.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: na udongo ukiwa kichwani mwake
  rationale: אֲדָמָה ni udongo au ardhi; “udongo” huhifadhi maana mahsusi kuliko kuibadili kuwa “vumbi.”
