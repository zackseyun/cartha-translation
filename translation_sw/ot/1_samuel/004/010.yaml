  yaml_path: translation/ot/1_samuel/004/010.yaml
  text: So the Philistines fought[a], and Israel was defeated, and each man fled to his tent. The slaughter was very great[b], and thirty thousand foot soldiers from Israel fell.
translation:
  language: sw
  text: Basi Wafilisti wakapigana, Waisraeli wakashindwa, na kila mtu akakimbilia hema lake.[a] Pigo lilikuwa kubwa sana,[b] na askari wa miguu elfu thelathini miongoni mwa Waisraeli wakaanguka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila mtu alikimbilia nyumbani kwake.” Kiebrania kinasema kihalisi, “kwenye hema lake,” usemi ambao unaweza kumaanisha mahali pa makazi ya mtu.
    reason: lexical_alternative
  - marker: b
    text: Au, “Mauaji yalikuwa makubwa sana,” au, “kushindwa kulikuwa kukubwa sana.” Kiebrania husema kihalisi, “pigo lilikuwa kubwa sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ
  choice: wakapigana
  rationale: Kitenzi hiki katika mfululizo wa simulizi kinaeleza wazi kupigana vitani; “wakapigana” ni cha kawaida na huhifadhi mwendelezo wa matukio.
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili cha Biblia.
- source_word: וַיִּנָּגֶף יִשְׂרָאֵל
  choice: Israeli wakashindwa
  rationale: Katika muktadha wa vita, נָגַף humaanisha kushindwa au kupigwa na adui. “Wakashindwa” haidai kwamba wote waliangamizwa, na wingi unafuata maana ya Israeli kama watu.
- source_word: וַיָּנֻסוּ אִישׁ לְאֹהָלָיו
  choice: kila mmoja akakimbilia hema lake
  rationale: אִישׁ imetumiwa kwa maana ya kugawa, yaani kila mtu mmoja mmoja. “Hema” huhifadhi taswira halisi ya Kiebrania, huku tanbihi ikitaja uwezekano wa maana ya makao au nyumbani.
- source_word: וַתְּהִי הַמַּכָּה גְּדוֹלָה מְאֹד
  choice: Mauaji yakawa makubwa sana
  rationale: מַכָּה kimsingi ni pigo, lakini katika simulizi hili la vita na mbele ya idadi ya waliokufa, huelekea kumaanisha mauaji makubwa. Tanbihi huhifadhi tafsiri iliyo karibu zaidi na neno halisi.
- source_word: וַיִּפֹּל מִיִּשְׂרָאֵל
  choice: wa Israeli wakaanguka
  rationale: Katika lugha ya vita, נפל hutumiwa kwa kufa vitani. “Wakaanguka” huhifadhi tamathali ya kijeshi ya chanzo bila kuibadili moja kwa moja kuwa “wakafa.”
- source_word: שְׁלֹשִׁים אֶלֶף
  choice: elfu thelathini
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya idadi hiyo katika Kiswahili.
- source_word: רַגְלִי
  choice: askari wa miguu
  rationale: Neno hilo linataja wapiganaji walioenda kwa miguu, tofauti na askari waliopanda wanyama au magari; “askari wa miguu” ni wazi kwa msomaji wa sasa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa asili na wenye hadhi lakini unaoeleweka kwa wasomaji wa kawaida. Viunganishi vya “waka-” vinahifadhi mfululizo wa vitendo vya simulizi la Kiebrania. Alama ya tanbihi [a] imewekwa baada ya “hema lake,” ambako maelezo yake yanahusika.
