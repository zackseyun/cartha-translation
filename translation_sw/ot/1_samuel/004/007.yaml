base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/007.yaml
  text: The Philistines were afraid[a], for they said, “God has come into the camp.” And they said, “Woe to us! For nothing like this has happened before.”
translation:
  language: sw
  text: Wafilisti wakaogopa[a], kwa maana walisema, “Mungu ameingia kambini.” Wakasema, “Ole wetu! Kwa maana jambo kama hili halijawahi kutokea hapo kabla.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mungu ameingia kambini”; nomino ya Kiebrania ina umbo la wingi, lakini kitenzi kinachoandamana nayo ni cha umoja, jambo linalounga mkono tafsiri ya “Mungu” katika andiko kuu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּֽרְאוּ
  choice: wakaogopa
  rationale: Kitenzi ירא katika mfululizo wa masimulizi kinaonyesha mwitikio wao wa mara moja; “wakaogopa” ni Kiswahili cha kawaida na chenye nguvu inayofaa.
- source_word: הַפְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili cha Biblia.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa kinaingiza sababu ya hofu yao na kuendeleza mtindo wa masimulizi kwa ufasaha.
- source_word: בָּא אֱלֹהִים
  choice: Mungu ameingia
  rationale: Ingawa אֱלֹהִים lina umbo la wingi, kitenzi בָּא ni cha umoja. “Ameingia” huonyesha mwendo kuingia kambini kwa namna ya asili katika Kiswahili; uwezekano wa “mungu mmoja” umehifadhiwa katika tanbihi.
- source_word: אֶל הַמַּחֲנֶה
  choice: kambini
  rationale: Muundo huu wa mahali unaeleza kuingia ndani ya kambi kwa Kiswahili kifupi na cha kawaida.
- source_word: אוֹי לָנוּ
  choice: Ole wetu!
  rationale: Ni kilio cha msiba, hofu, au maangamizi yanayotarajiwa; “Ole wetu!” huhifadhi uzito wake.
- source_word: לֹא הָיְתָה כָּזֹאת
  choice: jambo kama hili halijawahi kutokea
  rationale: Ni tafsiri ya kimaanawi iliyo wazi ya usemi unaosisitiza kwamba tukio hilo halikuwa limepata kutokea.
- source_word: אֶתְמוֹל שִׁלְשֹׁם
  choice: hapo kabla
  rationale: Jozi hii ni nahau yenye maana ya wakati uliopita au zamani, si lazima siku mbili zilizotangulia pekee.
theological_decisions:
- issue: Tafsiri ya אֱלֹהִים katika maneno ya Wafilisti
  choice: Mungu
  alternative: mungu mmoja
  rationale: Kitenzi cha umoja בָּא kinaunga mkono rejeo la umoja. Hata hivyo, kwa kuwa haya ni maneno ya Wafilisti na אֱלֹהִים lina umbo la wingi, uwezekano wa wao kumaanisha “mungu mmoja” umewekwa katika tanbihi badala ya kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. “Wakaogopa” na “wakasema” hudumisha mwendo wa simulizi; “Ole wetu!” huhifadhi uzito wa kilio bila kuwa cha kizamani kupita kiasi.
