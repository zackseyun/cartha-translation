base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/002.yaml
  text: The Philistines drew up to meet Israel[a], and the battle spread out, and Israel was defeated before the Philistines; and they struck down about four thousand men in the battle line in the field.
translation:
  language: sw
  text: Wafilisti wakajipanga kukabiliana na Israeli, na mapigano yakasambaa[a]. Israeli wakashindwa mbele ya Wafilisti, nao Wafilisti wakawaua karibu wanaume elfu nne katika safu ya vita uwandani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mapigano yakaanza.” Kitenzi cha Kiebrania kinaweza kueleza kuanza kwa vita au kuenea kwa mapigano wakati pande hizo zilipokabiliana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַרְכוּ
  choice: wakajipanga
  rationale: Katika muktadha wa kijeshi, ערך hueleza kupanga vikosi tayari kwa vita. ‘Wakajipanga’ ni Kiswahili cha kawaida na hudumisha maana hiyo bila kuongeza maelezo yasiyo katika matini.
- source_word: לִקְרַאת
  choice: kukabiliana na
  rationale: Kirai hiki kinaeleza kuelekea katika mkutano au makabiliano na upande mwingine. Katika muktadha wa vita, ‘kukabiliana na’ ni cha asili na hakiongezi maana zaidi ya mazingira yaliyotajwa.
- source_word: וַתִּטֹּשׁ הַמִּלְחָמָה
  choice: mapigano yakasambaa
  rationale: נטש katika muundo huu huenda ikaeleza mapigano kuenea au kuanza kushika nafasi katika uwanja. ‘Yakasambaa’ huhifadhi picha ya Kiebrania, huku tanbihi ikionyesha uwezekano mwingine.
- source_word: וַיִּנָּגֶף
  choice: wakashindwa
  rationale: Niphal ya נגף katika muktadha wa kijeshi ina maana ya kushindwa mbele ya adui. Tafsiri hii haitangulizi maelezo ya waliouawa yanayofuata.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Huhifadhi nahau ya Kiebrania ya kushindwa mbele ya adui, ambayo pia inaeleweka kwa Kiswahili sanifu.
- source_word: וַיַּכּוּ
  choice: wakawaua
  rationale: נכה katika taarifa ya idadi ya walioanguka vitani inaonyesha pigo lenye kuua. ‘Wakawaua’ huwasilisha matokeo hayo wazi kwa Kiswahili cha sasa; kiima cha wingi kimetajwa wazi kuwa Wafilisti ili kuondoa utata wa viwakilishi.
- source_word: בַמַּעֲרָכָה
  choice: katika safu ya vita
  rationale: מַעֲרָכָה hurejelea mpangilio au safu ya kivita. ‘Safu ya vita’ ni fupi, wazi, na hudumisha maana ya kijeshi.
- source_word: בַּשָּׂדֶה
  choice: huko uwanjani
  rationale: שָׂדֶה hapa ni eneo la wazi ambako vita vilipiganwa. ‘Uwanjani’ ni ya asili katika Kiswahili na haiongezi neno la ufafanuzi lisilohitajika.
- source_word: כְּאַרְבַּעַת אֲלָפִים אִישׁ
  choice: karibu wanaume elfu nne
  rationale: כְּ kabla ya namba huonyesha makadirio, kwa hiyo ‘karibu.’ אִישׁ ni neno la kuhesabu watu wa kiume, na katika muktadha huu ni wapiganaji.
