translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi umetumia viambishi vya mfululizo ‘waka-’; kiima ‘Wafilisti’ kimerudiwa katika kishazi cha mwisho ili rejeo liwe wazi. Utata wa וַתִּטֹּשׁ הַמִּלְחָמָה umehifadhiwa katika matini na tanbihi badala ya kutatuliwa kimya kimya.
