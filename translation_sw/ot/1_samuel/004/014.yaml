base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/014.yaml
  text: When Eli heard the sound of the outcry[a], he said, “What is this sound of the uproar?” And the man hurried and came and told Eli.
translation:
  language: sw
  text: Eli aliposikia sauti ya mayowe[a], akasema, “Sauti hii ya kelele ni nini?” Yule mtu akaharakisha, akaja, akamweleza Eli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kilio kikubwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹל
  choice: sauti
  rationale: Neno hili linaweza kumaanisha sauti, kilio cha mtu, au kelele. Hapa linataja jambo linalosikika, hivyo “sauti” linafaa katika kishazi cha kwanza.
- source_word: הַצְּעָקָה
  choice: mayowe
  rationale: Neno hili huonyesha kilio kikubwa, mara nyingi cha dhiki. “Mayowe” yanaonyesha nguvu na hisia za mwitikio wa mji kwa habari mbaya.
- source_word: מֶה
  choice: ni za nini?
  rationale: Swali linataka kujua maana au chanzo cha kelele. Muundo huu ni wa kawaida katika Kiswahili na haubadili swali kuwa dai la moja kwa moja kuhusu sababu pekee.
- source_word: הֶהָמוֹן
  choice: kelele
  rationale: Katika muktadha huu neno linamaanisha makelele au ghasia za umati. “Kelele” ni neno la kawaida linalofikisha vizuri jambo lililosikika na Eli.
- source_word: וְהָאִישׁ
  choice: Yule mtu
  rationale: Kiebrania kinasema tu “yule mtu,” kikimrejelea mtu aliyetajwa awali. Kutumia “mjumbe” kungeongeza ufafanuzi usio wazi katika mstari huu.
- source_word: מִהַר
  choice: akaja haraka
  rationale: 'Kitenzi kinaonyesha kufanya jambo kwa upesi. Kiswahili cha kawaida huunganisha wazo hilo na kuja: “akaja haraka.”'
- source_word: וַיַּגֵּד לְעֵלִי
  choice: na kumweleza Eli
  rationale: Kitenzi katika muundo huu humaanisha kumwambia, kumweleza, au kutoa taarifa. “Kumweleza Eli” ni wazi na cha kawaida katika simulizi.
- source_word: עֵלִי
  choice: Eli
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali umefanywa wa kawaida kwa Kiswahili, huku tofauti kati ya mayowe ya dhiki na kelele za umati ikihifadhiwa.
