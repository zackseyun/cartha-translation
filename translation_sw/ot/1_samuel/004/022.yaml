  text: And she said[a], “The glory has departed from Israel[b], because the ark of God has been taken.”
translation:
  language: sw
  text: Akasema, “Utukufu umeondoka[a] kutoka Israeli, kwa sababu[b] sanduku la Mungu limetwaliwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Utukufu umeenda uhamishoni kutoka Israeli.” Kitenzi cha Kiebrania kinaweza kuwa na maana ya kwenda uhamishoni au kuondolewa.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa maana sanduku la Mungu limetwaliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Akasema
  rationale: Waw-consecutive inaendeleza simulizi; “Akasema” ni usemi wa kawaida na wenye hadhi katika masimulizi ya Kiswahili.
- source_word: גָּלָה
  choice: umeondoka
  rationale: Kitenzi hiki kinaweza kumaanisha kwenda uhamishoni au kuondolewa. Kwa kuwa kiima ni “utukufu,” “umeondoka” ni Kiswahili cha asili kinachohifadhi wazo la kuondolewa bila kulazimisha taswira ya utukufu kuwa mhamishwa.
- source_word: כָבוֹד
  choice: Utukufu
  rationale: Katika muktadha huu neno linabeba maana ya heshima kuu na utukufu unaohusishwa na kuwapo kwa Mungu kati ya Israeli; “utukufu” huhifadhi uzito huo wa kitheolojia.
- source_word: מִיִּשְׂרָאֵל
  choice: katika Israeli
  rationale: Kihusishi מן kinaonyesha kutengwa au kuondoka mahali. Katika Kiswahili, “umeondoka katika Israeli” huwasilisha kwa kawaida kwamba utukufu haupo tena kati ya Israeli.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי inatoa sababu ya kauli iliyotangulia; “kwa sababu” ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: נִלְקַח
  choice: limetwaliwa
  rationale: Kauli ya kutendwa ya לקח humaanisha kuchukuliwa. “Limetwaliwa” huhifadhi kauli ya kutendwa na hadhi ya lugha bila kuingiza kwa lazima maana finyu zaidi ya kutekwa vitani.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: sanduku la Mungu
  rationale: Hii ni tafsiri ya moja kwa moja ya muundo wa umilikaji wa Kiebrania na ni usemi wa kibiblia unaoeleweka katika Kiswahili.
theological_decisions:
- issue: Maana ya “utukufu” kuhusiana na Israeli na sanduku
  choice: “Utukufu” unaonyesha kuondolewa kwa heshima na kuwapo kwa Mungu kulikodhihirishwa kati ya Israeli, bila kufafanua kupita kiasi namna kuwapo huko kulivyohusiana na sanduku.
  alternative: Kulielewa neno hilo kama heshima ya kitaifa ya Israeli pekee, au kama kauli ya moja kwa moja kwamba Mungu mwenyewe ameondoka.
  rationale: Muktadha wa karibu unaunganisha kauli hii na kutwaliwa kwa sanduku, hivyo ina uzito wa kitheolojia unaozidi aibu ya kushindwa vitani. Hata hivyo, mstari haufafanui fundisho maalumu kuhusu kuwapo kwa Mungu ndani ya sanduku; tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na rahisi kueleweka. “Limetwaliwa” limechaguliwa badala ya “limetekwa” ili kutodokeza zaidi ya kauli pana ya Kiebrania.
