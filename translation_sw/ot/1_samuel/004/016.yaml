base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/016.yaml
  text: The man said to Eli[a], “I am the one who came from the battle line, and I fled from the battle line today.” And he said, “What happened, my son?”
translation:
  language: sw
  text: Yule mtu akamwambia Eli, “Mimi ndiye niliyekuja kutoka kwenye safu ya vita[a], nami nilikimbia kutoka kwenye safu ya vita leo.” Eli akamuuliza, “Kumetokea nini, mwanangu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vitani,” “kutoka kwenye safu za askari,” au “kutoka kambini”; neno la Kiebrania linamaanisha mpangilio au safu ya kijeshi vitani.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: Yule mtu
  rationale: Nomino ya Kiebrania ni neno la kawaida la ‘mtu,’ si neno maalumu la ‘mjumbe.’ ‘Yule mtu’ humrejelea kwa kawaida mtu aliyetajwa katika muktadha.
- source_word: הַבָּא
  choice: niliyekuja
  rationale: Kirai kishirikishi pamoja na אָנֹכִי humtambulisha msemaji kuwa ndiye aliyekuja; wakati uliopita unafaa kwa kuwa tayari amewasili.
- source_word: מִן הַמַּעֲרָכָה
  choice: kutoka kwenye safu ya vita
  rationale: מַעֲרָכָה huelekea kumaanisha mpangilio au safu ya kijeshi vitani, wala si tukio la vita kwa ujumla tu.
- source_word: נַסְתִּי
  choice: nimekimbia
  rationale: Kitenzi נוּס humaanisha kukimbia ili kujiepusha na hatari; ‘nimekimbia’ ni cha moja kwa moja na hakiongezi maana ya kwamba alifanikiwa kuokoka.
- source_word: הַיּוֹם
  choice: leo
  rationale: Neno hili linaonyesha wakati wa kukimbia, na ‘leo’ ni tafsiri ya kawaida na sahihi.
- source_word: מֶה הָיָה הַדָּבָר
  choice: Kumetokea nini
  rationale: Kwa neno moja moja ni ‘jambo lilikuwa nini?’ lakini katika muktadha ni swali la kutaka kujua yaliyotokea; usemi huu ni Kiswahili cha kawaida.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Kiambishi cha umilikaji kiko wazi. Hapa ni namna ya upole au ukaribu ya Eli kumwita kijana huyo, bila kumaanisha lazima awe mwana wake wa kimwili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kurudiwa kwa wazo la kutoka kwenye safu ya vita kumehifadhiwa, huku ‘kutoka huko’ kikiepuka urudiaji mzito usio wa kawaida katika Kiswahili.
