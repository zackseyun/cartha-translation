  terminology: “Sanduku la Mungu” ni sahihi kwa אֲרוֹן הָאֱלֹהִים katika muktadha huu. “Tazama,” “kiti,” na “kando ya njia” zinafaa kwa register na maana ya matini. Dokezo la nahau ya “upande wa njia” limewekwa kwenye nanga sahihi.
