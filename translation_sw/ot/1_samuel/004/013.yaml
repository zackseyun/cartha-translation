  to: Alipofika, tazama, Eli alikuwa ameketi kwenye kiti kando ya njia[a], akitazamia, kwa sababu moyo wake ulitetemeka[b] kwa ajili ya sanduku la Mungu. Yule mtu akaja kutoa habari mjini, nao mji wote ukapaza kilio.
