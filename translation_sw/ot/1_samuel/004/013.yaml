base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/013.yaml
  text: When he came[a], behold, Eli was sitting on the seat by the road, watching, because his heart trembled for the ark of God. And the man came to report it in the city[b], and the whole city cried out.
translation:
  language: sw
  text: Alipofika, tazama, Eli alikuwa ameketi kwenye kiti kando ya njia[a], akitazamia, kwa sababu moyo wake ulitetemeka[b] kwa ajili ya sanduku la Mungu. Yule mtu akaja kutoa habari mjini, nao mji wote ukapaza kilio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, ‘kwenye mkono/upande wa njia’; hii ni nahau yenye maana ya kuwa kando ya njia.
    reason: cultural_note
  - marker: b
    text: Au ‘moyo wake ulikuwa na wasiwasi.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Alipofika
  rationale: Waw-consecutive inaendeleza simulizi, na muundo wa wakati unaunganisha kuwasili kwa mjumbe na tukio analolikuta bila kubadili maana ya msingi ya בוא.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili linavuta fikira za msomaji kwenye mandhari inayofunuliwa ghafla; ‘tazama’ linahifadhi uhai wake wa kisimulizi.
- source_word: יֹשֵׁב עַל־הַכִּסֵּא
  choice: alikuwa ameketi kwenye kiti
  rationale: Muundo wa kishirikishi unaeleza hali ya Eli akiwa ameketi; ‘kiti’ ni neno la kawaida na lisiloingiza wazo la kiti cha enzi.
- source_word: יַד דֶּרֶךְ
  choice: kando ya njia
  rationale: Nahau hiyo, kihalisi ‘mkono/upande wa njia,’ inaonyesha mahali pembeni mwa njia.
- source_word: מְצַפֶּה
  choice: akitazamia
  rationale: Kishirikishi cha צפה kinaonyesha kuangalia kwa makini huku mtu akingojea jambo; ‘akitazamia’ kinadokeza uangalifu na matarajio hayo.
- source_word: כִּי הָיָה לִבּוֹ חָרֵד
  choice: kwa sababu moyo wake ulikuwa ukitetemeka
  rationale: Tafsiri hii inadumisha taswira halisi ya Kiebrania na nguvu ya hofu au hangaiko bila kuamua kimya-kimya kwamba ni hisia ipi hasa iliyotawala.
- source_word: עַל אֲרוֹן הָאֱלֹהִים
  choice: kwa ajili ya sanduku la Mungu
  rationale: עַל pamoja na חרד inaonyesha kitu kilichosababisha hangaiko la Eli; ‘kwa ajili ya’ huwasilisha wasiwasi wake kuhusu sanduku.
- source_word: וְהָאִישׁ
  choice: Yule mtu
  rationale: Kirai hiki kinamrejelea mjumbe aliyetajwa katika muktadha uliotangulia.
- source_word: לְהַגִּיד בָּעִיר
  choice: akaingia mjini kutoa habari
  rationale: Lengo la kuingia kwake ni kutangaza habari za mapigano ndani ya mji; ‘kutoa habari’ linaeleza kazi ya נגד kwa Kiswahili cha kawaida.
- source_word: וַתִּזְעַק כָּל־הָעִיר
  choice: nao mji wote ukapiga yowe
  rationale: זעק ni kilio cha dhiki au hofu; ‘kupiga yowe’ huhifadhi uzito wa mwitikio wa pamoja kuliko ‘kupiga kelele’ isiyoeleza aina ya kilio.
