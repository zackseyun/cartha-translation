  source_fidelity: 'Muundo mkuu na maana vimehifadhiwa vizuri: Eli ameketi kando ya njia, anatazamia, na ana hofu/mtetemeko wa moyo kuhusu sanduku la Mungu; mji nao unalia kwa sauti. Hata hivyo, “akaingia mjini” huongeza tendo la kuingia ambalo halisemwi wazi katika Kiebrania. Kitenzi בוא pamoja na בָּעִיר kinaeleza kuja ili kutoa habari mjini/ndani ya mji, si lazima kuingia mjini.'
