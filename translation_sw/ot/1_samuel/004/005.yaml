source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/ב֨וֹא אֲר֤וֹן בְּרִית יְהוָה֙ אֶל הַֽ/מַּחֲנֶ֔ה וַ/יָּרִ֥עוּ כָל יִשְׂרָאֵ֖ל תְּרוּעָ֣ה גְדוֹלָ֑ה וַ/תֵּהֹ֖ם הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/005.yaml
  text: When the ark of the covenant of Yahweh came into the camp[a], all Israel shouted with a great shout, and the earth resounded.
translation:
  language: sw
  text: Sanduku la agano la Yahwe lilipoingia kambini, Waisraeli wote wakapiga kelele kubwa, nayo ardhi ikavuma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ardhi ikatetemeka.” Kitenzi cha Kiebrania kinaweza kumaanisha kufanya mshindo au kuwa katika vurugu, na pia kutetemeka; “ikavuma” hakilazimishi kwamba kulikuwa na tetemeko halisi la ardhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: lilipoingia
  rationale: Muundo huu unaanzisha kishazi cha wakati katika simulizi. “Lilipoingia” ni Kiswahili cha kawaida kinachohifadhi maana ya ‘wakati ... lilipoingia’ bila kuongeza kauli nzito ya ‘ikawa kwamba.’
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: Sanduku la agano la Yahwe
  rationale: Huhifadhi wazi mnyororo wa umilikaji katika Kiebrania na kutumia neno la kawaida la kibiblia “sanduku” kwa אֲרוֹן.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja katika tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: הַמַּחֲנֶה
  choice: kambini
  rationale: Katika muktadha huu wa kijeshi, “kambini” ni tafsiri ya kawaida na sahihi.
- source_word: כָל יִשְׂרָאֵל
  choice: Waisraeli wote
  rationale: Kiebrania hutumia jina la taifa kwa maana ya jumuiya nzima; Kiswahili cha sasa hueleweka kwa urahisi zaidi kwa kusema “Waisraeli wote.”
- source_word: וַיָּרִעוּ ... תְּרוּעָה גְדוֹלָה
  choice: wakapiga kelele kubwa
  rationale: Kauli hii inawasilisha tendo la kutoa mwangwi au kilio kikubwa na kuhifadhi uzito wa kirai cha Kiebrania bila kukibainisha mno kuwa shangwe au kilio maalumu cha vita.
- source_word: וַתֵּהֹם הָאָרֶץ
  choice: nayo nchi ikavuma
  rationale: Kitenzi kinaweza kueleza makelele, mshindo, au kutetemeka. “Ikavuma” huonyesha nguvu ya sauti iliyotanda katika nchi bila kulazimisha maana ya tetemeko halisi.
theological_decisions:
- issue: Namna ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko lina jina la agano moja kwa moja. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Kama kelele hiyo ilikuwa shangwe au kilio cha vita
  choice: kelele kubwa
  alternative: shangwe kubwa au kilio kikubwa cha vita
  rationale: Muktadha unaweza kupendekeza shangwe au kilio cha vita, lakini neno la Kiebrania halilazimishi mojawapo hapa; tafsiri pana huhifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya moja kwa moja kwa usomaji wa hadhara; “Sanduku la agano” na “Yahwe” huhifadhi istilahi muhimu za maandiko, huku “Waisraeli wote” na “kambini” zikiwa za kawaida kwa wasomaji wa leo.
