  text: הִֽתְחַזְּק֞וּ וִֽ/הְי֤וּ לַֽ/אֲנָשִׁים֙ פְּלִשְׁתִּ֔ים פֶּ֚ן תַּעַבְד֣וּ לָ/עִבְרִ֔ים כַּ/אֲשֶׁ֥ר עָבְד֖וּ לָ/כֶ֑ם וִ/הְיִיתֶ֥ם לַ/אֲנָשִׁ֖ים וְ/נִלְחַמְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/009.yaml
  text: Be strong and be men[a], O Philistines, lest you become servants to the Hebrews as they have been to you[b]. Be men and fight!
translation:
  language: sw
  text: Jitieni nguvu, nanyi iweni wanaume[a], enyi Wafilisti, msije mkawa watumwa wa Waebrania, kama wao walivyokuwa watumwa wenu[b]. Iweni wanaume, piganeni!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Iweni wanaume” ni msemo unaowahimiza wapiganaji waonyeshe ujasiri wa kiume; au “tendeni kama wanaume” au “jionyesheni kuwa wanaume.”
    reason: lexical_alternative
  - marker: b
    text: Au “msije mkawatumikia Waebrania, kama wao walivyowatumikia ninyi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַזְּקוּ
  choice: Jitieni nguvu
  rationale: Amri ya wingi katika Hitpael inawahimiza wajitie nguvu na moyo. “Jitieni nguvu” ni ya moja kwa moja, ya asili katika Kiswahili, na inafaa katika hotuba ya kabla ya vita.
- source_word: וִהְיוּ לַאֲנָשִׁים / וִהְיִיתֶם לַאֲנָשִׁים
  choice: muwe wanaume
  rationale: Hifadhi msemo wa Kiebrania wenye jinsia na urudiaji wake wa kimakusudi. Katika muktadha huu ni himizo kwa wapiganaji wa kiume waonyeshe ujasiri.
- source_word: פְּלִשְׁתִּים
  choice: enyi Wafilisti
  rationale: “Enyi” huonyesha kwa kawaida katika Kiswahili kwamba jina hili linatumika kama mwito wa moja kwa moja.
- source_word: פֶּן
  choice: msije
  rationale: Huanzisha onyo kuhusu matokeo yasiyotakikana; “msije” ni njia fupi na ya kawaida ya kuonyesha maana hiyo.
- source_word: תַּעַבְדוּ / עָבְדוּ
  choice: mkawa watumwa / walivyokuwa watumwa
  rationale: Katika muktadha wa kushindwa vitani, kitenzi עבד kinaonyesha kutiishwa na kuwa katika hali ya utumwa, si utumishi wa hiari. Nomino “watumwa” inaweka wazi nguvu hiyo katika Kiswahili.
- source_word: לָעִבְרִים
  choice: Waebrania
  rationale: Chanzo kinasema “Waebrania,” jina linalotumiwa mara nyingi na watu wa nje kuwataja Waisraeli; halijabadilishwa kuwa “Waisraeli.”
- source_word: וְנִלְחַמְתֶּם
  choice: mkapigane
  rationale: Katika mfululizo huu wa amri, “mkapigane” ni himizo la moja kwa moja na la kawaida la kuingia vitani.
theological_decisions:
- issue: Himizo lenye jinsia לַאֲנָשִׁים
  choice: muwe wanaume
  alternative: tendeni kama wanaume; jionyesheni kuwa wanaume; iweni jasiri
  rationale: Maneno yanaelekezwa kwa wapiganaji wa kiume na yamebeba taswira ya ujasiri wa kiume. Tafsiri isiyoonyesha jinsia ingefifisha usemi wa chanzo; tanbihi inaeleza nguvu yake ya kimsemo.
- issue: Nguvu ya עבד katika kutiishwa kijeshi
  choice: mkawa watumwa wa Waebrania, kama wao walivyokuwa watumwa wenu
  alternative: mkawatumikia Waebrania, kama wao walivyowatumikia ninyi
  rationale: Muktadha ni hofu ya kushindwa na kutiishwa baada ya vita. “Watumwa” huonyesha wazi hali ya kulazimishwa, huku tanbihi ikihifadhi uwezekano wa kutafsiri kitenzi kwa “kutumikia.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa “muwe wanaume” umehifadhiwa kwa sababu ni sehemu ya nguvu ya balagha ya hotuba. “Enyi” huweka wazi mwito bila kutumia mtindo wa kizamani kupita kiasi.
