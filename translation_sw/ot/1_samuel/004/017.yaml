translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. Mfuatano wa taarifa umehifadhiwa ili kuonyesha uzito unaoongezeka wa habari: Israeli kukimbia, mauaji, vifo vya wana wa Eli, na kuchukuliwa kwa sanduku la Mungu.'
