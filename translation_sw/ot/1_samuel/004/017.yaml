base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/017.yaml
  text: The messenger answered and said[a], “Israel has fled before the Philistines, and there has also been a great slaughter among the people; and your two sons also are dead, Hophni and Phinehas[b]; and the ark of God has been taken.”
translation:
  language: sw
  text: Mleta habari akajibu, akasema, “Israeli wamekimbia mbele ya Wafilisti, tena kumekuwa na mauaji makubwa miongoni mwa watu[a]. Pia wanao wawili, Hofni na Finehasi, wamekufa; na sanduku la Mungu limechukuliwa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumekuwa na pigo kubwa miongoni mwa watu.” Neno la Kiebrania linaweza kumaanisha pigo kali, tauni, kushindwa vibaya, au mauaji; hapa muktadha wa vita unaunga mkono “mauaji makubwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “sanduku la Mungu limetekwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְבַשֵּׂר
  choice: Mleta habari
  rationale: Neno hili ni umbo la kishiriki linalomaanisha mtu anayeleta habari. ‘Mleta habari’ ni la kawaida na linafaa katika simulizi hili.
- source_word: נָס
  choice: wamewakimbia
  rationale: Kitenzi kinamaanisha kukimbia au kutoroka mbele ya adui. Muundo huu unaonyesha kwamba Israeli walirudi nyuma kwa kuwaepuka Wafilisti bila kuongeza wazo la kushindwa kabisa ambalo halijasemwa moja kwa moja.
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Katika muundo ‘wamewakimbia Wafilisti,’ kiambishi cha yambwa kinaeleza kwa Kiswahili cha kawaida maana ya kukimbia mbele ya adui.
- source_word: מַגֵּפָה גְדוֹלָה
  choice: mauaji makubwa
  rationale: Katika muktadha wa vita, neno hili linaweza kumaanisha pigo kali au kuuawa kwa watu wengi. ‘Mauaji makubwa’ linaonyesha maafa ya vita, huku tanbihi ikihifadhi uwezekano wa ‘ushindi mkubwa dhidi ya watu’ au ‘pigo kubwa.’
- source_word: בָעָם
  choice: miongoni mwa watu
  rationale: Hii inafuata neno la Kiebrania ‘watu’ bila kulibadili moja kwa moja kuwa ‘jeshi,’ ingawa hapa linawahusu wapiganaji wa Israeli.
- source_word: שְׁנֵי בָנֶיךָ
  choice: wanao wawili
  rationale: Tafsiri ya moja kwa moja na ya kawaida inayosisitiza wana wawili hususa wa Eli.
- source_word: מֵתוּ
  choice: wamekufa
  rationale: Hutoa kwa kawaida tendo lililokamilika linaloripotiwa mara tu baada ya kutokea.
- source_word: חָפְנִי וּפִינְחָס
  choice: Hofni na Finehasi
  rationale: Majina yameandikwa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: sanduku la Mungu
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kirai hiki, bila kuongeza maelezo yasiyokuwamo katika chanzo.
- source_word: נִלְקָחָה
  choice: limechukuliwa
  rationale: Huhifadhi hali ya kutendwa na maana ya msingi ya ‘kuchukuliwa.’ Katika muktadha huu ‘limetekwa’ pia linawezekana, na limeonyeshwa katika tanbihi.
