  text: וַ/תִּקְרָ֣א לַ/נַּ֗עַר אִֽי כָבוֹד֙ לֵ/אמֹ֔ר גָּלָ֥ה כָב֖וֹד מִ/יִּשְׂרָאֵ֑ל אֶל הִלָּקַח֙ אֲר֣וֹן הָ/אֱלֹהִ֔ים וְ/אֶל חָמִ֖י/הָ וְ/אִישָֽׁ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/021.yaml
  text: And she named the boy Ichabod[a], saying, “The glory has departed from Israel,” because the ark of God had been taken, and because of her father-in-law and her husband.
translation:
  language: sw
  text: Akamwita mtoto huyo Ikabodi[a], akisema, “Utukufu umeondoka katika Israeli,” kwa sababu sanduku la Mungu lilikuwa limetekwa, na kwa sababu ya baba-mkwe wake na mume wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Ikabodi linasikika kama limeundwa kwa vipashio vya Kiebrania vinavyohusishwa na maana ya “hakuna utukufu,” au huenda, “utukufu uko wapi?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא לַנַּעַר
  choice: Akamwita mtoto huyo
  rationale: Katika muktadha wa kumpa jina mtoto mchanga, קרא ל־ humaanisha kumwita au kumpa jina. Kiswahili cha kawaida hutumia “akamwita”; “mtoto huyo” ni cha asili zaidi hapa kuliko “kijana,” kwa kuwa anayezungumziwa ni mtoto mchanga.
- source_word: אִי כָבוֹד
  choice: Ikabodi
  rationale: Jina limenakiliwa kwa tahajia inayosomeka kwa Kiswahili badala ya kutafsiriwa moja kwa moja; maana zake zinazowezekana zinaelezwa katika tanbihi.
- source_word: גָּלָה
  choice: umeondoka
  rationale: Kitenzi kinaweza kuhusiana na kuondoka, kuhamishwa, au kwenda uhamishoni. Kwa kuwa kiima ni “utukufu,” “umeondoka” ni cha kawaida huku kikidumisha wazo la kutoweka kutoka Israeli.
- source_word: כָבוֹד
  choice: utukufu
  rationale: “Utukufu” huhifadhi uzito wa neno la Kiebrania bila kulifafanua kuwa uwepo wa Mungu pekee au heshima ya Israeli pekee.
- source_word: מִיִּשְׂרָאֵל
  choice: katika Israeli
  rationale: Ingawa מן kwa kawaida huonyesha kujitenga na chanzo, Kiswahili cha asili husema kitu “kimeondoka katika” mahali; kauli hii inawasilisha wazi kuondoka kutoka Israeli.
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: kwa sababu sanduku la Mungu lilikuwa limetekwa
  rationale: אֶל ngumu hapa imeeleweka kwa maana ya sababu kulingana na muktadha. “Limetekwa” huonyesha wazi kuwa sanduku lilichukuliwa na adui, huku wakati timilifu “lilikuwa limetekwa” ukitangulia tendo la kumpa jina.
- source_word: וְאֶל חָמִיהָ וְאִישָׁהּ
  choice: na kwa sababu ya mkwe wake na mume wake
  rationale: אֶל iliyorudiwa inaendeleza msingi wa sababu. “Mkwe wake” humaanisha hapa baba ya mume wake kwa mujibu wa muktadha, na אִישָׁהּ ni “mume wake.”
theological_decisions:
- issue: Maana ya “utukufu” kuhusiana na Israeli
  choice: Kutafsiri כָבוֹד kuwa “utukufu” bila kuongeza kwamba ni utukufu wa Mungu au heshima ya Israeli pekee.
  alternative: “Utukufu wa Mungu umeondoka katika Israeli” au “Heshima imeondoka katika Israeli.”
  rationale: Kiebrania kinaacha msemo ukiwa mfupi na wenye maana nyingi zinazohusiana. Kutekwa kwa sanduku kunaashiria uwepo mtukufu wa Mungu, huku vifo katika nyumba ya Eli na kushindwa kwa Israeli vikihusisha pia heshima na hali ya taifa. Tafsiri haifungi mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa simulizi umehifadhiwa bila kuwa mgumu; istilahi “sanduku la Mungu” na “utukufu” zinaendeleza uzito wa muktadha wa ibada na teolojia.
