  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר שְׁמוּאֵ֖ל לְ/כָל יִשְׂרָאֵ֑ל וַ/יֵּצֵ֣א יִשְׂרָאֵל֩ לִ/קְרַ֨את פְּלִשְׁתִּ֜ים לַ/מִּלְחָמָ֗ה וַֽ/יַּחֲנוּ֙ עַל הָ/אֶ֣בֶן הָעֵ֔זֶר וּ/פְלִשְׁתִּ֖ים חָנ֥וּ בַ/אֲפֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/001.yaml
  text: And the word of Samuel came to all Israel[a]. Then Israel went out to meet the Philistines in battle, and they camped at Ebenezer[b], while the Philistines camped at Aphek.
translation:
  language: sw
  text: Neno la Samweli likawafikia Israeli wote.[a] Kisha Israeli wakaenda kuwakabili Wafilisti vitani. Wakapiga kambi huko Ebenezeri,[b] nao Wafilisti wakapiga kambi huko Afeki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Habari kuhusu Samweli zikawafikia Israeli wote.” Kiebrania kinaweza kumaanisha neno au ujumbe wa Samweli, na katika muktadha huenda kinarejelea neno lake la kinabii.
    reason: alternative_reading
  - marker: b
    text: Ebenezeri maana yake ni “jiwe la msaada.” Hapa ni jina la mahali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר שְׁמוּאֵל לְכָל יִשְׂרָאֵל
  choice: Neno la Samweli likawafikia Israeli wote
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo la neno au ujumbe wa Samweli kuwafikia watu wote wa Israeli, huku ikidumisha nomino ya umoja “neno” na uhusiano wake na huduma yake ya kinabii.
- source_word: וַיֵּצֵא יִשְׂרָאֵל
  choice: Israeli wakaenda
  rationale: Kitenzi “wakaenda” ni cha kawaida na hakiongezi dhana ya kuandamana kijeshi ambayo haijaelezwa moja kwa moja mpaka kishazi kinachofuata.
- source_word: לִקְרַאת פְּלִשְׁתִּים
  choice: kuwakabili Wafilisti
  rationale: Katika muktadha wa vita, “kuwakabili” huonyesha kwenda kukutana na adui bila kuzidisha maana ya neno la Kiebrania.
- source_word: לַמִּלְחָמָה
  choice: vitani
  rationale: Ni usemi mfupi na wa kawaida unaoonyesha kusudi na mazingira ya kijeshi.
- source_word: וַיַּחֲנוּ
  choice: Wakapiga kambi
  rationale: “Kupiga kambi” ni Kiswahili cha sasa na cha kawaida kwa kitendo cha kuweka kambi.
- source_word: עַל הָאֶבֶן הָעֵזֶר
  choice: huko Ebenezeri
  rationale: Kirai hiki kinatumika kama jina la mahali; kwa hiyo jina limetoholewa badala ya kutafsiriwa katika matini kuu.
- source_word: וּפְלִשְׁתִּים חָנוּ בַאֲפֵק
  choice: nao Wafilisti wakapiga kambi huko Afeki
  rationale: “Nao” huonyesha kwa kawaida mpangilio wa kambi ya upande mwingine, huku majina ya watu na mahali yakitoholewa kwa Kiswahili.
theological_decisions:
- issue: Iwapo דְבַר שְׁמוּאֵל ni neno la kinabii la Samweli au habari kuhusu Samweli
  choice: Neno la Samweli
  alternative: Habari kuhusu Samweli
  rationale: Muktadha wa mwisho wa sura ya 3 unaunganisha Samweli na neno la BWANA na kutambuliwa kwake kama nabii. Hata hivyo, muundo wa Kiebrania unaweza kueleweka kama habari kuhusu Samweli; kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Majina Ebenezeri na Afeki yametoholewa kwa muundo unaofaa Kiswahili. Uambishi wa wingi kwa “Israeli” unawasilisha taifa kama watu kwa namna ya kawaida katika Kiswahili.
