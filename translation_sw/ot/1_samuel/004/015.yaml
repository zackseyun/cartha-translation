- source_word: וְלֹא יָכֹל לִרְאוֹת
  choice: naye hakuweza kuona
  rationale: Hutoa kwa uwazi na kwa Kiswahili cha kawaida matokeo ya hali ya macho yake bila kuongeza uhusiano wa kisababishi usioonyeshwa wazi na kiunganishi cha Kiebrania.
- source_word: וְ
  choice: na / naye
  rationale: Viunganishi vya Kiebrania vimewakilishwa kwa viunganishi vya kawaida vya Kiswahili; hakuna neno la wazi lenye maana ya ‘sasa’ katika chanzo.
