  text: Then Saul hurled the spear at him to strike him[a], and Jonathan knew that his father was determined to put David to death.
translation:
  language: sw
  text: Ndipo Sauli akamrushia mkuki ili ampige, na Yonathani akajua kwamba baba yake alikuwa ameazimia[a] kumuua Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baba yake alikuwa amekwisha kuamua kumuua Daudi.” Nahau ya Kiebrania inaonyesha uamuzi thabiti, uliokamilika upande wa Sauli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּטֶל
  choice: akamrushia
  rationale: Kitenzi kina maana ya kutupa au kurusha; pamoja na yambwa ya mtu, “akamrushia” huonyesha kwa kawaida tendo la nguvu lililoelekezwa dhidi yake.
- source_word: הַחֲנִית
  choice: mkuki
  rationale: “Mkuki” ni neno la kawaida na pana la Kiswahili kwa silaha hii; halilazimishi utofautishaji wa aina nyepesi ya mkuki ambao maandishi hayahitaji.
- source_word: עָלָיו
  choice: -m- katika “akamrushia”
  rationale: Kiambishi cha yambwa katika muundo “akamrushia mkuki” huwasilisha mwelekeo wa uhasama wa עָלָיו kwa Kiswahili cha kawaida.
- source_word: לְהַכֹּתוֹ
  choice: ili ampige
  rationale: Muundo wa kusudi unaonyesha kwamba Sauli alirusha mkuki kwa nia ya kumpiga Yonathani.
- source_word: וַיֵּדַע
  choice: akajua
  rationale: Hili ndilo neno la moja kwa moja na la kawaida kwa kitenzi cha Kiebrania kinachomaanisha kujua; katika muktadha pia linabeba wazo la kutambua kwa hakika.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa linaanzisha maudhui ya jambo ambalo Yonathani alijua, si sababu.
- source_word: כָלָה הִיא מֵעִם אָבִיו
  choice: baba yake alikuwa ameazimia
  rationale: Nahau ya Kiebrania inaonyesha uamuzi uliokamilika na kusimama imara upande wa baba yake; “alikuwa ameazimia” ni ya asili na huhifadhi uthabiti wa nia hiyo.
- source_word: לְהָמִית אֶת דָּוִד
  choice: kumuua Daudi
  rationale: “Kumuua” huwasilisha kwa uwazi kusudi la kusababisha kifo bila kuongeza wazo la utaratibu rasmi wa hukumu ambalo si lazima liwe katika chanzo.
- source_word: יְהוֹנָתָן
  choice: Yonathani
  rationale: Tahajia ya kawaida ya jina hili katika mapokeo ya Biblia ya Kiswahili.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Tahajia ya kawaida ya jina hili katika Kiswahili.
- source_word: דָּוִד
  choice: Daudi
  rationale: Tahajia ya kawaida ya jina hili katika Kiswahili.
theological_decisions:
- issue: Kiwango cha uthabiti wa uamuzi wa Sauli
  choice: baba yake alikuwa ameazimia kumuua Daudi
  alternative: 'jambo hilo lilikuwa limeamuliwa na baba yake: kumuua Daudi'
  rationale: Tafsiri kuu huonyesha nia thabiti ya Sauli bila kudai kwamba mauaji yenyewe yalikuwa tayari yametimia; tanbihi huhifadhi muundo mbadala ulio karibu zaidi na nahau ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Simulizi limetumia mfuatano wa “aka-” unaofaa katika usimulizi wa Biblia. Kiwakilishi cha “ampige” kinarejelea Yonathani; tanbihi imewekwa baada ya sentensi kwa sababu inafafanua kishazi cha mwisho kuhusu uamuzi wa Sauli.
