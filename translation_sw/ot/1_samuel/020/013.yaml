base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/013.yaml
  text: May Yahweh do so to Jonathan[a], and more also, if my father intends evil against you and I do not disclose it to you and send you away, so that you may go in peace. And may Yahweh be with you[c][b], as he has been with my father.
translation:
  language: sw
  text: Yahwe na amfanyie Yonathani hivyo, na zaidi, ikiwa baba yangu anakusudia kukudhuru[a], nami nisipokujulisha[b] na kukuruhusu uende kwa amani[c]. Yahwe na awe pamoja nawe, kama alivyokuwa pamoja na baba yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “ikiwa kuleta ubaya dhidi yako kunampendeza baba yangu,” yaani, ikiwa baba yangu ameamua au anapenda kukudhuru.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “na nitafunua sikio lako,” nahau ya Kiebrania yenye maana ya kukujulisha au kukupasha habari.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kina kauli fupi ya kiapo bila neno la wazi la kukanusha. Maana inayodokezwa ni kwamba laana impate Yonathani asipomjulisha Daudi na kumruhusu aende kwa amani.
    reason: source_ambiguity
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִיהוֹנָתָן וְכֹה יֹסִיף
  choice: Yahwe na amfanyie Yonathani hivyo, tena na zaidi
  rationale: Hii ni kauli ya kiapo inayotaja laana kwa msemaji mwenyewe. Jina “Yonathani” limehifadhiwa katika nafsi ya tatu kama ilivyo katika Kiebrania.
- source_word: יֵיטִב אֶל אָבִי אֶת הָרָעָה עָלֶיךָ
  choice: ikiwa baba yangu anakusudia kukudhuru
  rationale: Kauli ya Kiebrania ni ya kidokezo, kihalisi ikisema kwamba ubaya dhidi ya Daudi unampendeza baba yake. Tafsiri hii inaeleza nia ya kumdhuru bila kudai kwamba madhara tayari yametendeka.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: nami nisipokujulisha
  rationale: 'Kihalisi ni “kufunua sikio lako,” nahau yenye maana ya kumpasha mtu habari. Hali ya kukanusha imewekwa wazi kwa sababu ya muundo wa kiapo: laana impate Yonathani asipomwonya Daudi.'
- source_word: וְשִׁלַּחְתִּיךָ
  choice: na kukuruhusu uondoke
  rationale: Kitenzi cha Kiebrania kinaonyesha Yonathani kumwacha au kumpeleka Daudi aondoke. Kauli hii ni ya kawaida katika Kiswahili na haiingizi wazo lisilotajwa la kumsindikiza.
- source_word: וְהָלַכְתָּ לְשָׁלוֹם
  choice: ili uende kwa amani
  rationale: “Kwenda kwa amani” huhifadhi usemi wa Kiebrania, huku “ili” ikionyesha kusudi au matokeo ya Yonathani kumruhusu Daudi aondoke.
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: Yahwe na awe pamoja nawe
  rationale: Muundo wa kutakia umehifadhiwa kwa “na awe,” na jina la Mungu יְהוָה limetafsiriwa “Yahwe.”
- source_word: כַּאֲשֶׁר הָיָה עִם אָבִי
  choice: kama alivyokuwa pamoja na baba yangu
  rationale: Wakati uliopita katika Kiebrania umehifadhiwa bila kuamua ikiwa uwepo huo bado unaendelea kwa Sauli.
theological_decisions:
- issue: Ukanushaji uliodokezwa katika kiapo cha Yonathani
  choice: nami nisipokujulisha na kukuruhusu uondoke
  alternative: nami nitakujulisha na kukuruhusu uondoke
  rationale: Kiebrania hakina neno la wazi la kukanusha katika sehemu hii, lakini kauli ya laana inahitaji kueleweka kuwa Yonathani anaomba aadhibiwe ikiwa hatamjulisha Daudi na kumwacha aende. Ukanushaji umewekwa katika matini ili kiapo kieleweke kwa Kiswahili, huku tanbihi ikihifadhi ufupi na utata wa kisarufi wa chanzo.
- issue: Uwepo wa Yahwe pamoja na Daudi ukilinganishwa na Sauli
  choice: kama alivyokuwa pamoja na baba yangu
  alternative: kama alivyo pamoja na baba yangu
  rationale: Kitenzi cha Kiebrania kiko katika wakati timilifu/uliopita. Tafsiri ya wakati uliopita huhifadhi tofauti inayoweza kudokezwa kati ya utegemezo wa Mungu kwa Sauli hapo awali na ombi la Yonathani kwa ajili ya Daudi, bila kueleza zaidi hali ya Sauli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Yahwe” limehifadhiwa kama jina la Mungu, “Yonathani” ni tahajia ya kawaida ya kibiblia, na muundo wa kiapo umefanywa wa asili kwa Kiswahili bila kuondoa uzito wake.
