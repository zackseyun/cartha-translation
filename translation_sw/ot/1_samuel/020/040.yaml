  text: Then Jonathan gave his weapons to the young man who was with him and said to him[a], “Go[c][b], bring them to the city.”
translation:
  language: sw
  text: Kisha Yonathani akampa kijana wake silaha zake, akamwambia, “Nenda ukazipeleke mjini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akampa
  rationale: Kitenzi נתן katika masimulizi kina maana ya kawaida ya ‘kutoa/kumpa’; muundo ‘akampa’ unaonyesha pia mpokeaji aliyetajwa.
- source_word: יְהוֹנָתָן
  choice: Yonathani
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: כֵּלָיו
  choice: silaha zake
  rationale: כְּלִי linaweza kumaanisha vifaa au vyombo kwa upana, lakini muktadha wa upinde na mishale unaunga mkono ‘silaha.’
- source_word: הַנַּעַר אֲשֶׁר לוֹ
  choice: kijana wake
  rationale: נַעַר ni kijana au mtumishi kijana, na אֲשֶׁר לוֹ huonyesha uhusiano wake na Yonathani. ‘Kijana wake’ ni fupi na asilia huku ikiacha hadhi mahsusi ikiwa na kiasi cha utata.
- source_word: וַיֹּאמֶר לוֹ
  choice: akamwambia
  rationale: אמר ni ‘kusema’; katika Kiswahili ‘akamwambia’ huwasilisha kwa kawaida maana ya kusema kwa mtu.
- source_word: לֵךְ
  choice: Nenda
  rationale: Ni amri ya moja kwa moja ya הלך, ‘kwenda.’
- source_word: הָבֵיא
  choice: ukazipeleke
  rationale: Hiphili ya בוא kwa kawaida ni ‘kuleta,’ lakini kwa kuwa kijana anaagizwa aondoke alipo Yonathani na kwenda nazo mjini, Kiswahili cha kimwelekeo hutumia kwa asili ‘kuzipeleka.’ Kiambishi -zi- kinarejelea silaha bila kuongeza nomino nyingine.
- source_word: הָעִיר
  choice: mjini
  rationale: הָעִיר ni ‘mji’; baada ya kitenzi cha mwendo, ‘mjini’ ni usemi wa kawaida wa Kiswahili unaomaanisha kwenda katika mji unaojulikana katika muktadha.
