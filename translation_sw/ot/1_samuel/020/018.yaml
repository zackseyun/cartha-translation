translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. ‘Sikukuu ya mwezi mpya’ huweka wazi maana ya kiibada inayodokezwa na muktadha, huku ‘nafasi yako’ ikifaa zaidi kwa nafasi ya mtu mezani kuliko ‘kiti chako’ pekee.
