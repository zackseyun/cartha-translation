translation:
  language: sw
  text: Yonathani akamwambia, “Kesho ni mwezi mpya, nawe utakosekana, kwa sababu nafasi yako itakuwa tupu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: akamwambia
  rationale: Kitenzi cha masimulizi pamoja na yambwa humaanisha kwa kawaida ‘akamwambia’; muundo huu ni wa asili katika Kiswahili.
- source_word: יְהוֹנָתָן
  choice: Yonathani
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Biblia za Kiswahili.
- source_word: מָחָר חֹדֶשׁ
  choice: Kesho ni sikukuu ya mwezi mpya
  rationale: Katika muktadha wa chakula cha kifalme, חֹדֶשׁ haimaanishi tu mwezi wa kalenda bali maadhimisho ya mwezi mpya.
- source_word: וְנִפְקַדְתָּ
  choice: Wewe utakosekana
  rationale: Nifali ya פקד hapa huonyesha kwamba kutokuwapo kwa Daudi kutagunduliwa. ‘Utakosekana’ ni fupi, ya kawaida, na inadumisha hali ya kutendwa bila kufafanua kupita kiasi.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya kutambuliwa kwa kutokuwapo kwa Daudi.
- source_word: יִפָּקֵד מוֹשָׁבֶךָ
  choice: nafasi yako itakuwa tupu
  rationale: Katika muktadha wa mlo, מוֹשָׁבֶךָ ni nafasi ya Daudi mezani. Kiswahili cha kawaida hueleza matokeo ya kutokaliwa kwa nafasi hiyo kwa kusema itakuwa tupu.
