lexical_decisions:
- source_word: וַאֲנִי
  choice: Nami
  rationale: Kiunganishi pamoja na kiwakilishi huru hubadili mkazo kwenda kwenye tendo la Yonathani; “Nami” ni Kiswahili cha kawaida na hudumisha mtiririko wa habari.
- source_word: שְׁלֹשֶׁת הַחִצִּים
  choice: ile mishale mitatu
  rationale: Nomino yenye uainisho inarejelea mishale maalumu iliyokuwa sehemu ya ishara waliyopanga; “ile” huonyesha urejeo huo kwa njia ya kawaida katika Kiswahili.
- source_word: צִדָּה
  choice: kuelekea ubavuni pake
  rationale: Nomino yenye kiambishi cha nafsi ya tatu umoja wa kike ina maana ya mwelekeo wa kuelekea upande wake; uwezekano mkubwa kiambishi hicho kinarejelea jiwe au alama iliyotajwa katika muktadha, bila kuitaja wazi katika mstari huu.
- source_word: אוֹרֶה
  choice: nitapiga
  rationale: Katika muktadha wa upinde na mshale, kitenzi ירה katika Hifili humaanisha kupiga au kurusha mshale; “nitapiga ... mishale” ni usemi wa kawaida wa Kiswahili.
- source_word: לְשַׁלַּח לִי
  choice: kana kwamba ninajizoeza
  rationale: Kirai hiki ni cha kiidioma na kinaonyesha kwamba tendo hilo lingeonekana kama mazoezi ya kawaida ya kupiga mishale; tafsiri hii huwasilisha maana kwa Kiswahili fasaha bila kulazimisha muundo wa Kiebrania.
- source_word: לְמַטָּרָה
  choice: kulenga shabaha
  rationale: מַטָּרָה ni shabaha au alama inayolengwa; “kulenga shabaha” ni usemi wa asili katika muktadha wa mazoezi ya upigaji mishale.
