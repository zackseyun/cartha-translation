base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/026.yaml
  text: But Saul did not say anything that day[a], for he thought, “Something has happened; he is not clean—surely he is not clean.”
translation:
  language: sw
  text: Lakini siku hiyo Sauli hakusema jambo lolote, kwa maana aliwaza, “Huenda kuna jambo limetokea; yeye si safi[a]—hakika si safi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yeye si safi kwa ibada.” Kiebrania kinarejelea usafi wa kiibada katika muktadha wa mlo huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... מְאוּמָה
  choice: hakusema jambo lolote
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba Sauli hakutoa maoni yoyote.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Huhifadhi rejeo la wakati kwa mtindo wa kawaida wa Kiswahili.
- source_word: כִּי אָמַר
  choice: kwa maana aliwaza
  rationale: Kitenzi kwa kawaida ni ‘alisema,’ lakini hapa kinawasilisha mawazo ya ndani ya Sauli; ‘aliwaza’ huonyesha hilo bila kuongeza msemaji mwingine.
- source_word: מִקְרֶה הוּא
  choice: Lazima jambo fulani limetokea
  rationale: Nomino מִקְרֶה huonyesha tukio au jambo lililotokea. ‘Lazima’ huwasilisha hitimisho la Sauli, bila kuongeza ‘kwake,’ ambalo halijaelezwa wazi katika Kiebrania.
- source_word: בִּלְתִּי טָהוֹר הוּא
  choice: yeye si safi
  rationale: Hubaki karibu na muundo wa Kiebrania huku muktadha wa usafi wa kiibada ukifafanuliwa katika tanbihi.
- source_word: כִּי לֹא טָהוֹר
  choice: naam, hakika yeye si safi
  rationale: Kurudiwa kwa kauli kunasisitiza hitimisho la Sauli; ‘naam, hakika’ huonyesha nguvu hiyo ya uthibitisho.
theological_decisions:
- issue: Aina ya kutokuwa safi inayodokezwa na טָהוֹר
  choice: Kutokuwa safi kiibada kunakohusiana na kushiriki katika mlo
  alternative: Uchafu wa jumla wa kimaadili
  rationale: Muktadha wa karamu ya Mwandamo wa Mwezi na kutokuwapo kwa Daudi unaelekeza kwenye usafi wa kiibada, si hukumu ya maadili. Matini kuu inadumisha neno pana ‘safi,’ na tanbihi inaeleza maana ya kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa wasomaji wa kawaida, huku marudio na msisitizo wa Kiebrania vikihifadhiwa.
