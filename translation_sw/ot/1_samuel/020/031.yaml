  text: כִּ֣י כָל הַ/יָּמִ֗ים אֲשֶׁ֤ר בֶּן יִשַׁי֙ חַ֣י עַל הָ/אֲדָמָ֔ה לֹ֥א תִכּ֖וֹן אַתָּ֣ה וּ/מַלְכוּתֶ֑/ךָ וְ/עַתָּ֗ה שְׁלַ֨ח וְ/קַ֤ח אֹת/וֹ֙ אֵלַ֔/י כִּ֥י בֶן מָ֖וֶת הֽוּא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/031.yaml
  text: For as long as the son of Jesse lives on the earth[a], neither you nor your kingdom will be established. So now, send and bring him to me, for he is a son of death.
translation:
  language: sw
  text: Kwa maana maadamu mwana wa Yese anaishi duniani, wewe na ufalme wako hamtasimama imara. Basi sasa, tuma watu wamlete kwangu, kwa maana yeye ni mwana wa mauti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Msemo wa Kiebrania “mwana wa mauti” humaanisha mtu anayestahili kufa au aliye chini ya hukumu ya kifo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaingiza sababu ambayo Sauli anatoa kwa hasira na amri yake.
- source_word: כָל הַיָּמִים אֲשֶׁר
  choice: siku zote ... atakapoishi
  rationale: Huwasilisha muda unaoendelea kwa Kiswahili cha kawaida, yaani ‘maadamu’ au ‘kwa muda wote ambao’.
- source_word: בֶּן יִשַׁי
  choice: mwana wa Yese
  rationale: Inahifadhi namna ya Sauli kumtaja Daudi kwa jina la baba yake badala ya jina lake mwenyewe, jambo linaloonyesha kumweka mbali au kumdharau.
- source_word: חַי עַל הָאֲדָמָה
  choice: atakapoishi juu ya nchi
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi maana pana ya אֲדָמָה bila kuifanya mahsusi kuwa eneo la kisiasa.
- source_word: לֹא תִכּוֹן
  choice: hamtathibitika
  rationale: Kitenzi katika Nifali kina maana ya kuimarishwa au kuthibitika; ‘hamtathibitika’ huhifadhi hali hiyo na kinaweza kuwahusu Yonathani na ufalme wake kwa pamoja.
- source_word: אַתָּה וּמַלְכוּתֶךָ
  choice: wewe na ufalme wako
  rationale: Inahifadhi uratibu wa Kiebrania na muktadha wa kisiasa na wa nasaba.
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Inaonyesha hitimisho la haraka linalotokana na kauli iliyotangulia.
- source_word: שְׁלַח וְקַח אֹתוֹ אֵלַי
  choice: tuma watu wamlete kwangu
  rationale: Kiswahili huhitaji kutaja kwa kawaida wale wanaotumwa; ‘wamlete kwangu’ huwasilisha matokeo yaliyokusudiwa ya amri bila kudokeza kwamba Yonathani mwenyewe lazima aende.
- source_word: בֶּן מָוֶת הוּא
  choice: yeye ni mwana wa mauti
  rationale: Inahifadhi tamathali halisi na nzito ya Kiebrania badala ya kuamua kimya kimya ikiwa maana yake ni kustahili kufa au kuwa amehukumiwa kufa; tanbihi inaifafanua.
theological_decisions:
- issue: Maana ya msemo בֶּן מָוֶת
  choice: mwana wa mauti
  alternative: anastahili kufa / amehukumiwa kufa
  rationale: Msemo unaweza kuonyesha mtu anayestahili kuuawa au aliye chini ya hukumu ya kifo. Tafsiri kuu inahifadhi mvutano huo, na tanbihi inaeleza maana zake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mwana wa Yese’ na ‘mwana wa mauti’ zimehifadhiwa kwa uzito wa usemi wa Sauli; tanbihi imewekwa baada ya msemo unaoelezwa.
