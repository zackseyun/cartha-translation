translation:
  language: sw
  text: Yonathani akamjibu Sauli, “Daudi aliniomba sana[a] ruhusa ya kwenda Bethlehemu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Daudi aliniomba tena na tena ruhusa ya kwenda Bethlehemu.” Kiebrania hutumia kitenzi-jina pamoja na kitenzi chenye ukomo cha mzizi huohuo ili kusisitiza ombi; muundo huo unaweza pia kueleweka kuwa ombi lililorudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: akamjibu
  rationale: Muundo wa kisimulizi unaanzisha jibu la Yonathani kwa Sauli; “akamjibu” ni wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: אֶת שָׁאוּל
  choice: Sauli
  rationale: Kiashiria cha yambwa pamoja na jina kinaonyesha kwamba Sauli ndiye aliyejibiwa; Kiswahili hutumia kiambishi cha yambwa katika “akamjibu Sauli.”
- source_word: נִשְׁאֹל נִשְׁאַל
  choice: aliniomba sana
  rationale: Kitenzi-jina halisi kinachofuatana na kitenzi chenye ukomo kinakazia ombi. “Aliniomba sana” huonyesha msisitizo huo kwa Kiswahili cha kawaida bila kulazimisha maana ya kurudia.
- source_word: מֵעִמָּדִי
  choice: aliniomba ... ruhusa
  rationale: Kirai kinaonyesha kwamba Daudi aliomba kutoka kwa Yonathani, yaani, aliomba ruhusa yake. Kiambishi “-ni-” katika “aliniomba” kinaonyesha wazi mtu aliyeombwa.
- source_word: עַד בֵּית לָחֶם
  choice: ya kwenda Bethlehemu
  rationale: Katika muktadha wa kuomba ruhusa, mahali panapotajwa ni mwisho wa safari iliyokusudiwa; kutaja “kwenda” kwa uwazi ni Kiswahili cha asili na hakuzidishi maana ya muktadha.
- source_word: בֵּית לָחֶם
  choice: Bethlehemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali hapo katika Kiswahili cha Biblia.
