base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/019.yaml
  text: On the third day[a], go down quickly and come to the place where you hid yourself on the day of the deed[b], and remain beside the stone Ezel.
translation:
  language: sw
  text: Siku ya tatu[a], shuka sana, uende mahali ulipojificha siku ya lile jambo[b], nawe ukae karibu na jiwe la Ezel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno moja moja, Kiebrania kinaweza kueleweka, “utafanya mara ya tatu”; katika muktadha huu maana inayowezekana zaidi ni “siku ya tatu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “siku ya lile tendo,” “siku ya lile tukio,” au “siku ya ile shughuli.” Inaelekea usemi huu unarejelea jambo au tukio lililojulikana tayari.
    reason: lexical_alternative
  - marker: c
    text: “Ezel” huenda ni jina la mahali au jina maalumu la jiwe. Neno la Kiebrania linaweza kuhusiana na kwenda au kuondoka, lakini maana yake kamili haijulikani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּשְׁתָּ
  choice: Siku ya tatu
  rationale: Kitenzi hiki cha Kiebrania kina maana isiyo ya kawaida ya kufanya jambo mara ya tatu; katika muktadha wa siku zilizotajwa katika mstari uliotangulia, kinarejelea siku ya tatu. Tanbihi inahifadhi ugumu wa usemi wa asili.
- source_word: תֵּרֵד מְאֹד
  choice: shuka haraka sana
  rationale: תֵּרֵד ni ‘shuka,’ na מְאֹד hulitia tendo mkazo. Katika agizo hili la kwenda mafichoni, ‘haraka sana’ linaeleza kwa Kiswahili cha kawaida nguvu na uharaka unaodokezwa, ingawa Kiebrania kwa neno moja moja ni ‘shuka sana.’
- source_word: וּבָאתָ אֶל הַמָּקוֹם
  choice: uende mahali
  rationale: בוא inaweza kumaanisha kuja, kwenda au kufika kulingana na mtazamo wa msemaji. ‘Uende mahali’ ni agizo la kawaida na wazi katika Kiswahili kwa Daudi anayeelekezwa mahali pa kujificha.
- source_word: אֲשֶׁר נִסְתַּרְתָּ שָּׁם
  choice: ulipojificha
  rationale: Nifali ya סתר hapa inaeleza Daudi kujisitiri mwenyewe. ‘Ulipojificha’ ni ya asili na huwasilisha tendo hilo bila uzito usiohitajika.
- source_word: בְּיוֹם הַמַּעֲשֶׂה
  choice: siku ya lile jambo
  rationale: מַעֲשֶׂה inaweza kuwa tendo, jambo, shughuli au tukio. ‘Lile jambo’ huhifadhi upana na utata wa rejeleo kuliko kulifafanua kuwa tendo fulani mahsusi; tanbihi inaonyesha uwezekano mwingine.
- source_word: וְיָשַׁבְתָּ
  choice: nawe ukae
  rationale: ישׁב inaweza kumaanisha kuketi, kukaa au kubaki. ‘Ukae’ huhifadhi maana pana inayofaa kusubiri mafichoni bila kulazimisha ikiwa Daudi alipaswa kuketi kimwili au kubaki tu hapo.
- source_word: אֵצֶל הָאֶבֶן הָאָזֶל
  choice: karibu na jiwe linaloitwa Ezeli
  rationale: אֵצֶל ni ‘karibu na/kando ya,’ na הָאָזֶל inaeleweka vizuri zaidi kama jina au jina maalumu la jiwe. Kutaja ‘Ezeli’ bila kulitafsiri huepuka kudai kwa uhakika etimolojia yake isiyo wazi.
