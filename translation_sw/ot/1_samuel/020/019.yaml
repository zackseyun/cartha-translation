translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa maagizo umewekwa wa kawaida na wa moja kwa moja. ‘Lile jambo’ na tanbihi zake huhifadhi utata wa בְּיוֹם הַמַּעֲשֶׂה, na ‘Ezeli’ limehifadhiwa kama jina badala ya kupewa maana ya kubashiri.
