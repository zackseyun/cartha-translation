  text: In the morning[a], Jonathan went out to the field for the appointed meeting with David[b], and a young boy was with him.
translation:
  language: sw
  text: Asubuhi, Yonathani akaenda shambani kwenye miadi aliyokuwa nayo na Daudi,[a] akiwa na mvulana mdogo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati uliowekwa kwa ajili ya Daudi.” Neno la Kiebrania מוֹעֵד linaweza kumaanisha wakati uliowekwa au miadi; muktadha wa makubaliano yao unaunga mkono maana ya miadi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kijana mdogo” au “mtumishi kijana.” Neno la Kiebrania נַעַר linaweza kumaanisha mvulana, kijana, au mtumishi kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Asubuhi
  rationale: Muundo huu unaendeleza simulizi na kutaja wakati wa tukio. Katika Kiswahili, “Asubuhi” ni mwanzo wa kawaida na wazi bila kulazimisha tafsiri ya neno kwa neno ya וַיְהִי.
- source_word: וַיֵּצֵא
  choice: akatoka kwenda
  rationale: Kitenzi יצא kina maana ya kutoka au kwenda nje; “akatoka kwenda” kinahifadhi wazo hilo la mwendo na kinaendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: יְהוֹנָתָן
  choice: Yonathani
  rationale: Hili ni umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: הַשָּׂדֶה
  choice: shambani
  rationale: שָׂדֶה humaanisha shamba au eneo la wazi; “shambani” linafaa kwa mazingira haya ya simulizi.
- source_word: לְמוֹעֵד דָּוִד
  choice: kwa ajili ya mkutano aliopanga na Daudi
  rationale: מוֹעֵד linaweza kumaanisha wakati uliowekwa au mkutano uliopangwa. Muktadha unaonyesha mpango wa Yonathani kukutana na Daudi, huku tanbihi ikihifadhi maana nyingine inayowezekana.
- source_word: וְנַעַר קָטֹן
  choice: akiwa pamoja na mvulana mdogo
  rationale: נַעַר linaweza kumaanisha mvulana, kijana, au mtumishi, na קָטֹן linaonyesha udogo au umri mdogo. “Mvulana mdogo” linahifadhi maelezo ya wazi ya matini bila kuamua kwamba alikuwa mtumishi.
- source_word: עִמּוֹ
  choice: akiwa pamoja na
  rationale: Kirai hiki kinaonyesha kwamba mvulana huyo aliandamana na Yonathani; muundo huu ni wa kawaida na wenye mtiririko mzuri katika Kiswahili.
