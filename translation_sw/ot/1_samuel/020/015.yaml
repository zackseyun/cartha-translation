  text: וְ/לֹֽא תַכְרִ֧ת אֶֽת חַסְדְּ/ךָ֛ מֵ/עִ֥ם בֵּיתִ֖/י עַד עוֹלָ֑ם וְ/לֹ֗א בְּ/הַכְרִ֤ת יְהוָה֙ אֶת אֹיְבֵ֣י דָוִ֔ד אִ֕ישׁ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/015.yaml
  text: And you shall not cut off your steadfast love from my house forever[a], not even when Yahweh cuts off David’s enemies, every one of them, from the face of the earth.
translation:
  language: sw
  text: Wala usiondoe kamwe upendo wako mwaminifu kutoka kwa nyumba yangu[a], hata wakati Yahwe atakapowaondoa maadui wa Daudi, kila mmoja wao, kutoka uso wa dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uaminifu wako wa agano” au “upendo wako wa kudumu.” Neno la Kiebrania חֶסֶד mara nyingi humaanisha upendo wa uaminifu katika uhusiano wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכְרִת / בְּהַכְרִת (כרת)
  choice: usiondoe / atakapowaondoa
  rationale: 'Kitenzi kilekile cha Kiswahili kimetumiwa katika sehemu zote mbili ili kuhifadhi mwangwi wa kitenzi cha Kiebrania: Yonathani anamwomba Daudi asiuondoe upendo wake mwaminifu, hata Yahwe atakapowaondoa maadui wa Daudi.'
- source_word: חַסְדְּךָ
  choice: upendo wako mwaminifu
  rationale: חסד hapa ni upendo unaodhihirika kwa uaminifu katika uhusiano wa agano, si hisia au wema wa kawaida tu. Tafsiri hii ni ya asili kwa Kiswahili na haifanyi neno hilo kuwa istilahi ya kisheria kupita kiasi.
- source_word: מֵעִם בֵּיתִי
  choice: katika nyumba yangu
  rationale: “Nyumba” huhifadhi maana ya kifamilia na ya ukoo wa בית katika muktadha huu, huku maelezo ya karibu yakionyesha kuwa si jengo linalokusudiwa.
- source_word: עַד עוֹלָם
  choice: kamwe
  rationale: Pamoja na kitenzi hasi, “kamwe” huwasilisha kwa Kiswahili cha kawaida ombi kwamba upendo huo usiondolewe wakati wowote.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: אֹיְבֵי דָוִד
  choice: maadui wa Daudi
  rationale: Muundo huu wa umilikaji ni wa kawaida na wazi katika Kiswahili.
- source_word: אִישׁ
  choice: kila mmoja wao
  rationale: 'Kirai hiki kinahifadhi nguvu ya mgawanyo ya umoja אִישׁ baada ya nomino ya wingi: hakuna adui hata mmoja anayeachwa.'
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: kutoka juu ya uso wa dunia
  rationale: Tafsiri hii huhifadhi taswira na uzito wa nahau ya Kiebrania inayomaanisha kuondolewa kabisa duniani.
- source_word: וְלֹא ... וְלֹא
  choice: Wala ... hata ...
  rationale: Muundo huu unaeleza wazi kuwa ombi la Yonathani linaendelea kutumika hata wakati Yahwe atakapowaondoa maadui wa Daudi.
theological_decisions:
- issue: Maana ya חסד katika muktadha wa agano
  choice: upendo mwaminifu
  alternative: uaminifu wa agano; upendo wa kudumu; fadhili
  rationale: Muktadha wa agano unahitaji maana ya upendo wenye uaminifu, lakini neno halijabanwa kuwa istilahi ya kiufundi ya mkataba.
- issue: Uhusiano wa kishazi cha pili na ombi la Yonathani
  choice: Kishazi cha pili kinaonyesha kwamba ombi hilo linatumika hata Yahwe atakapowaondoa maadui wa Daudi.
  alternative: Kukichukulia kishazi hicho kuwa maelezo ya pembeni yasiyohusiana moja kwa moja na ombi.
  rationale: Muundo wa Kiebrania unaendeleza na kusisitiza ombi, huku ukihifadhi mvutano wa Yonathani kuomba rehema kwa nyumba yake wakati wa kuanguka kwa maadui wa Daudi.
- issue: Nguvu ya mgawanyo ya אִישׁ
  choice: kila mmoja wao
  alternative: wote; kila mtu
  rationale: Hii inaonyesha kwamba kila adui anahusika mmoja mmoja bila kuongeza jinsia isiyo lazima katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Marudio ya “ondoa” yanahifadhi mchezo wa maneno wa Kiebrania bila kufanya sentensi kuwa ngumu.
