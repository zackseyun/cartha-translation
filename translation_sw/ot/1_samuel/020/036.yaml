  yaml_path: translation/ot/1_samuel/020/036.yaml
  text: He said to his young man[a], “Run, please, find the arrows that I am shooting.” The young man ran, and he shot the arrow beyond him.
translation:
  language: sw
  text: Akamwambia kijana wake, “Tafadhali, kimbia ukatafute mishale ninayopiga.” Kijana huyo akakimbia, naye Yonathani akapiga mshale ukapita mbali zaidi ya kijana huyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukampita,” yaani, mshale ulipita zaidi ya mahali alipokuwa kijana huyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ / הַנַּעַר
  choice: kijana wake / kijana huyo
  rationale: Neno נַעַר linaweza kumaanisha kijana au mhudumu. “Kijana wake” huhifadhi maana ya umri au hadhi bila kufafanua kupita kiasi kwamba alikuwa mtumishi; rejeo la pili limetolewa kwa njia ya kawaida ya Kiswahili kama “kijana huyo.”
- source_word: רוּץ
  choice: kimbia
  rationale: Hii ni amri ya moja kwa moja inayotaja tendo halisi la kukimbia.
- source_word: מְצָא נָא
  choice: tafadhali kimbia, ukatafute
  rationale: “Ukatafute” huonyesha kusudi la kukimbia kwa Kiswahili cha kawaida, huku “tafadhali” ikihifadhi nguvu ya upole ya נָא.
- source_word: הַחִצִּים
  choice: mishale
  rationale: Nomino iko katika wingi na ni shamirisho la tendo la kutafuta.
- source_word: אֲשֶׁר אָנֹכִי מוֹרֶה
  choice: ninayoipiga
  rationale: Kauli ya wakati unaoendelea au unaokaribia inafaa katika muktadha wa Yonathani kupiga mishale ili kijana aichukue.
- source_word: וְהוּא יָרָה הַחֵצִי
  choice: naye akaupiga mshale
  rationale: Umoja wenye kibainishi katika Kiebrania umehifadhiwa kama “mshale,” huku kiwakilishi “naye” kikirejelea Yonathani kwa mtiririko wa kawaida.
- source_word: לְהַעֲבִירוֹ
  choice: ukapita mbele yake
  rationale: Muundo huu unaonyesha kwamba Yonathani aliufanya mshale upite ng’ambo ya kijana. Tafsiri ya msingi “mbele yake” ni ya kawaida katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa “ukampita.”
