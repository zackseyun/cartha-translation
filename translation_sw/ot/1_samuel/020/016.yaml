translation:
  language: sw
  text: Basi Yonathani akafanya agano na nyumba ya Daudi, naye BWANA akadai hilo kutoka kwa maadui wa Daudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “BWANA na alitake hilo kutoka kwa maadui wa Daudi.” Kiebrania hakitaji wazi ni kitu gani kinachotakiwa au kudaiwa.
    reason: Kuhifadhi uwezekano wa kulisoma tamko hili kama ombi au kiapo cha kiagano, na kuonyesha kuwa shamirisho limedokezwa tu katika matini ya Kiebrania.
lexical_decisions:
- source_word: וַיִּכְרֹת ... עִם
  choice: akafanya agano na
  rationale: Kitenzi כרת, kwa maana halisi ‘kata’, kinapotumiwa pamoja na עִם ni nahau ya Kiebrania yenye maana ya kufanya au kuweka agano.
- source_word: בֵּית דָּוִד
  choice: nyumba ya Daudi
  rationale: ‘Nyumba’ inadumisha maana pana ya ukoo, familia na nasaba ya Daudi, badala ya kuibana kuwa familia ya karibu tu.
- source_word: וּבִקֵּשׁ יְהוָה מִיַּד
  choice: naye BWANA akawadai ... kwa hilo
  rationale: בקש מן־יד ni usemi wa kutaka jambo kutoka kwa mtu au kumtaka awajibike. ‘Akawadai’ ni Kiswahili cha kawaida kinachowasilisha uwajibikaji unaodokezwa, huku ‘kwa hilo’ likiwakilisha kitu kisichotajwa wazi katika Kiebrania.
- source_word: אֹיְבֵי דָוִד
  choice: maadui wa Daudi
  rationale: Tafsiri ya moja kwa moja na ya asili ya nomino ya wingi katika hali ya utegemezi.
theological_decisions:
- issue: Kitenzi וּבִקֵּשׁ kinaweza kusomwa kama taarifa au ombi/laana ya kiagano
  choice: BWANA akawadai maadui wa Daudi kwa hilo
  alternative: BWANA na awadai maadui wa Daudi kwa hilo
  rationale: Umbo la Kimasoreti ni kitenzi timilifu, hivyo matini kuu inadumisha taarifa hiyo; hata hivyo, muktadha wa kiagano unaruhusu kukielewa kama ombi au tamko la hukumu, jambo lililohifadhiwa katika tanbihi.
- issue: Kitu kinachodaiwa hakitajwi wazi katika Kiebrania
  choice: kwa hilo
  alternative: kuacha shamirisho bila kutajwa
  rationale: Kiswahili huhitaji rejeo linaloeleweka zaidi. ‘Hilo’ linaelekea kwenye wajibu wa agano bila kufafanua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Nyumba ya Daudi’ imehifadhiwa kama istilahi ya kibiblia ya ukoo/nasaba; ‘akawadai ... kwa hilo’ huepuka nahau isiyo ya kawaida ya ‘kutafuta kutoka mkononi’ huku ikidumisha wazo la kuwajibishwa.
