base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/006.yaml
  text: If your father surely notices me[a], then say, ‘David earnestly asked leave of me to run to Bethlehem, his city[d][c][b], because the yearly sacrifice is there for the whole family.’
translation:
  language: sw
  text: Ikiwa baba yako ataona wazi kwamba sipo[a], basi useme, ‘Daudi aliniomba sana ruhusa ya kwenda haraka Bethlehemu, mji wake, kwa sababu huko kuna dhabihu ya kila mwaka[d] kwa ajili ya ukoo wote.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa baba yako atanikosa.” Kiebrania kinasisitiza kitenzi, na katika muktadha kinaweza kumaanisha kutambua kutokuwapo kwa Daudi au kumkosa.
    reason: lexical_alternative
  - marker: d
    text: Au, “dhabihu ya mwaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקֹד יִפְקְדֵנִי
  choice: ataona wazi kwamba sipo
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi chenye nafsi unasisitiza tendo. Katika muktadha, Sauli ataona kwamba Daudi hayupo mezani; tafsiri hii ni ya asili kwa Kiswahili na bado inadumisha mkazo huo.
- source_word: אָבִיךָ
  choice: baba yako
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kiambishi cha nafsi ya pili umoja wa kiume.
- source_word: נִשְׁאֹל נִשְׁאַל
  choice: aliniomba sana ruhusa
  rationale: Muundo wa kusisitiza wa kitenzi-jina na kitenzi unaonyesha ombi la dhati au lenye msisitizo; ‘kuomba sana ruhusa’ ni Kiswahili cha kawaida kinachoeleza kuomba idhini ya kuondoka.
- source_word: מִמֶּנִּי
  choice: aliniomba
  rationale: Kiambishi cha yambwa katika ‘aliniomba’ kinawasilisha kwa kawaida maana ya ‘aliomba kutoka kwangu’ bila muundo mzito.
- source_word: לָרוּץ
  choice: aende haraka
  rationale: Maana ya msingi ni ‘kukimbia,’ lakini hapa inaeleza kwenda kwa haraka. Kiswahili ‘aende haraka’ kinawasilisha maana ya kimuktadha bila kudokeza lazima kwamba alikimbia kwa miguu.
- source_word: בֵּית לֶחֶם עִירוֹ
  choice: Bethlehemu, mji wake
  rationale: Inahifadhi jina la mahali na kirai elezi cha Kiebrania kwa namna ya moja kwa moja.
- source_word: זֶבַח הַיָּמִים
  choice: dhabihu ya kila mwaka
  rationale: Kirai kinaonyesha dhabihu inayorudiwa katika mzunguko wa siku au mwaka; ‘ya kila mwaka’ ni wazi na ya kawaida.
- source_word: לְכָל הַמִּשְׁפָּחָה
  choice: kwa ajili ya ukoo wote
  rationale: מִשְׁפָּחָה inaweza kumaanisha familia pana au ukoo. Tukio la pamoja huko Bethlehemu linaelekea kuhusisha jamaa pana, hivyo ‘ukoo wote’ huhifadhi upana huo.
