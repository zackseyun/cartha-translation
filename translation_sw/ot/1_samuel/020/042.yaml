base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/042.yaml
  text: Jonathan said to David, “Go in peace, because the two of us have sworn in the name of the LORD, saying, ‘May the LORD be between me and you, and between my offspring and your offspring forever.’”
translation:
  language: sw
  text: Yonathani akamwambia Daudi, “Nenda kwa amani, kwa kuwa sisi wawili tumeapa kwa jina la BWANA, tukisema, ‘BWANA na awe kati yangu na wewe, na kati ya uzao wangu na uzao wako milele.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ לְשָׁלוֹם
  choice: Nenda kwa amani
  rationale: Ni kauli ya kawaida na ya heshima ya kuagana, inayowasilisha moja kwa moja wazo la kwenda katika amani na usalama.
- source_word: אֲשֶׁר
  choice: kwa kuwa
  rationale: Katika muktadha huu inaunganisha agizo la kuondoka kwa amani na kiapo ambacho kinathibitisha uhusiano wao; Kiswahili hiki ni cha asili bila kuongeza maelezo yasiyokuwapo.
- source_word: בְּשֵׁם יְהוָה
  choice: kwa jina la BWANA
  rationale: Inahifadhi muundo wa kuapa kwa jina la Mungu; ‘BWANA’ ni namna ya kawaida ya kuwakilisha jina la agano יהוה katika tafsiri za Kiswahili.
- source_word: זַרְעִי / זַרְעֲךָ
  choice: uzao wangu / uzao wako
  rationale: ‘Uzao’ huhifadhi maana ya pamoja ya זרע, yaani vizazi au watoto watakaotokana nao, bila kuilazimisha kuwa mtu mmoja au wengi.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Huwasilisha muda usio na mwisho unaokusudiwa na kauli ya agano.
theological_decisions:
- issue: Nguvu ya kitenzi יִהְיֶה katika kauli ya kiapo
  choice: BWANA na awe kati yangu na wewe
  alternative: BWANA atakuwa kati yangu na wewe
  rationale: Kihusishi ‘na’ kinaonyesha ombi au tamko la kiapo kama lilivyoeleweka katika muktadha, huku ‘awe kati’ kikihifadhi lugha ya agano bila kuongeza kwamba BWANA ni ‘shahidi’ au ‘mwamuzi,’ maneno ambayo hayapo wazi katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Majina ‘Yonathani’ na ‘Daudi,’ pamoja na ‘BWANA’ kwa יהוה, yanafuata matumizi mapana ya Biblia za Kiswahili. Muundo wa kurudiwa ‘kati yangu na wewe, na kati ya uzao wangu na uzao wako’ umehifadhiwa kwa sababu ni muhimu kwa uzito na ulinganifu wa kiapo.
