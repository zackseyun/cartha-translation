lexical_decisions:
- source_word: וַיַּעַן
  choice: akamjibu
  rationale: Kitenzi ענה katika kauli hii ya masimulizi humaanisha kujibu; kiambishi -m- kinamtaja Sauli kama anayejibiwa.
- source_word: יְהוֹנָתָן
  choice: Yonathani
  rationale: Jina la mtu limetolewa kwa umbo lililozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: אֶת שָׁאוּל אָבִיו
  choice: baba yake Sauli
  rationale: Usemi huu unamtaja Sauli kuwa ndiye anayejibiwa na pia baba ya Yonathani; mpangilio huu ni wa asili katika Kiswahili.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: akamwambia
  rationale: Huhifadhi tendo la kusema na yule anayeambiwa, ingawa Kiswahili huunganisha yote mawili katika kitenzi kimoja.
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Hili ndilo swali la kawaida na la moja kwa moja la kutaka sababu katika Kiswahili cha sasa.
- source_word: יוּמַת
  choice: auawe
  rationale: Hii ni Hophal ya מות yenye maana ya kusababishiwa kifo, yaani kuuawa, wala si kufa tu. Umbo la utegemezi linafaa kwa swali linalopinga pendekezo la kumhukumu kifo.
- source_word: מֶה עָשָׂה
  choice: Amefanya nini?
  rationale: Wakati timilifu wa Kiswahili unaonyesha kitendo kilichokamilika ambacho bado kinahusika na shtaka la sasa.
