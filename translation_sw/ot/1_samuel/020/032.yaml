  text: Yonathani akamjibu Sauli, baba yake, akamwambia, “Kwa nini auawe?[a] Amefanya nini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa nini lazima auawe?” Kitenzi cha Kiebrania hasa humaanisha mtu kutiwa kifo, si kufa tu.
