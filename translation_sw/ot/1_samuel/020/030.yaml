base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/030.yaml
  text: Then Saul’s anger burned against Jonathan[a], and he said to him, “You son of a perverse, rebellious woman! Do I not know that you have chosen the son of Jesse[c][b], to your own shame and to the shame of your mother’s nakedness?”
translation:
  language: sw
  text: Ndipo hasira ya Sauli ikawaka dhidi ya Yonathani, naye akamwambia, “Wewe mwana wa mwanamke mpotovu na mwasi![a] Je, sijui kwamba umemchagua mwana wa Yese[b], kwa aibu yako mwenyewe na kwa aibu ya uchi wa mama yako[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wewe mwana wa upotovu na uasi!” Tusi hili la Kiebrania ni gumu na lina maana ya kinahau sana.
    reason: lexical_alternative
  - marker: b
    text: Au, “unamuunga mkono mwana wa Yese.”
    reason: lexical_alternative
  - marker: c
    text: Maneno “aibu ya uchi wa mama yako” ni usemi mkali sana wa Kiebrania unaoonyesha fedheha ya familia.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּחַר אַף שָׁאוּל בִּיהוֹנָתָן
  choice: hasira ya Sauli ikawaka dhidi ya Yonathani
  rationale: Nahau ya Kiebrania ina picha ya hasira inayowaka. Kiswahili hiki kinahifadhi uzito na uelekeo wa hasira bila kutafsiri neno אַף kwa maana yake halisi ya ‘pua.’
- source_word: בֶּן נַעֲוַת הַמַּרְדּוּת
  choice: Wewe mwana wa mwanamke mpotovu na mwasi!
  rationale: Hii ni lugha kali ya matusi. Kutaja ‘mwanamke’ kunafanya dhihaka ya kimama inayodokezwa na muundo wa Kiebrania ieleweke, huku tanbihi ikihifadhi uwezekano wa kuielewa kwa hali dhahania kama ‘upotovu na uasi.’
- source_word: הֲלוֹא יָדַעְתִּי
  choice: Je, sijui kwamba
  rationale: Muundo wa swali hasi ni wa balagha na wa makabiliano; umehifadhiwa badala ya kugeuzwa kuwa kauli tambarare.
- source_word: בֹחֵר אַתָּה לְבֶן יִשַׁי
  choice: umemchagua mwana wa Yese
  rationale: ‘Kumchagua’ huhifadhi maana ya msingi ya בחר. Katika muktadha, tendo hilo linamaanisha pia kumuunga mkono au kuchukua upande wake, jambo linaloelezwa katika tanbihi.
- source_word: לְבָשְׁתְּךָ
  choice: kwa aibu yako mwenyewe
  rationale: Kifungu hiki kinaonyesha matokeo ya uchaguzi wa Yonathani—fedheha yake binafsi. ‘Mwenyewe’ huifanya rejea hiyo iwe wazi na ya kawaida katika Kiswahili.
- source_word: וּלְבֹשֶׁת עֶרְוַת אִמֶּךָ
  choice: na kwa aibu ya uchi wa mama yako
  rationale: ‘Uchi’ huhifadhi maana halisi na ukali wa עֶרְוָה, pamoja na wazo la fedheha ya kifamilia, bila kulainisha tusi la Sauli.
