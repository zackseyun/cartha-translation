  text: But the boy did not know anything[a]; only Jonathan and David knew the matter.
translation:
  language: sw
  text: Lakini kijana huyo hakujua lolote; Yonathani na Daudi tu ndio waliojua jambo hilo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kitu hicho” au “mpango huo.” Neno la Kiebrania דָּבָר lina maana pana na linaweza kutaja jambo, kitu, au hali inayozungumziwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: Lakini kijana huyo
  rationale: Kiunganishi וְ kinaonyesha utofautishaji katika muktadha huu, kwa hiyo kimetafsiriwa “Lakini.” נַעַר hapa ni kijana aliyekuwa akimhudumia Yonathani; “kijana huyo” ni ya kawaida na inarejelea wazi mtu aliyetajwa katika muktadha.
- source_word: לֹא יָדַע מְאוּמָה
  choice: hakujua lolote
  rationale: יָדַע ni “kujua,” na מְאוּמָה pamoja na ukanushi huleta maana ya “chochote/lolote.” Kiswahili cha kawaida hapa ni “hakujua lolote.”
- source_word: אַךְ
  choice: ni ... tu
  rationale: אַךְ hapa ina maana ya kuweka mpaka au kuwatenga wahusika fulani; muundo “ni ... tu” unaonyesha kwamba Yonathani na Daudi pekee ndio waliokuwa na ufahamu huo.
- source_word: יְהוֹנָתָן וְדָוִד
  choice: Yonathani na Daudi
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: יָדְעוּ
  choice: waliofahamu
  rationale: Kitenzi ni kilekile יָדַע kilichotumiwa mapema. “Waliofahamu” hapa ni Kiswahili cha asili kinachoonyesha kwamba wao walijua maana ya tukio au mpango, huku utofautishaji na kutokujua kwa kijana ukibaki wazi.
- source_word: אֶת־הַדָּבָר
  choice: jambo hilo
  rationale: דָּבָר ni neno pana linaloweza kumaanisha jambo, kitu, neno, au shughuli inayozungumziwa. “Jambo hilo” ni la kawaida, lina heshima, na halifafanui kupita kiasi mpango uliojulikana na Yonathani na Daudi.
