base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/008.yaml
  text: So show kindness to your servant[a], for you have brought your servant into the covenant of Yahweh with yourself. But if there is guilt in me, put me to death yourself[b]; why should you bring me to your father?
translation:
  language: sw
  text: Basi umtendee mtumishi wako fadhili[a], kwa kuwa umemleta mtumishi wako pamoja nawe katika agano la Yahweh[b]. Lakini ikiwa nina hatia, wewe mwenyewe uniue; kwa nini unipeleke kwa baba yako?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umtendee mtumishi wako wema wa uaminifu wa agano.” Neno la Kiebrania חֶסֶד linaweza kumaanisha fadhili, upendo mwaminifu, au wema wenye uaminifu wa agano.
    reason: lexical_alternative
  - marker: b
    text: Au, “umemleta mtumishi wako katika agano la Yahweh pamoja nawe.” Mpangilio wa maneno ya Kiebrania unaruhusu ‘pamoja nawe’ kuhusishwa kwa karibu ama na ‘umemleta’ ama na ‘katika agano.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָשִׂיתָ חֶסֶד
  choice: mwonyeshe ... fadhili
  rationale: Kitenzi pamoja na חֶסֶד kinaomba tendo la wema wenye uaminifu. ‘Mwonyeshe ... fadhili’ ni Kiswahili cha kawaida na chenye hadhi, huku muktadha wa agano ukidokeza uaminifu wa kudumu.
- source_word: עַל עַבְדֶּךָ
  choice: mtumishi wako
  rationale: עֶבֶד hapa ni namna ya Daudi kujitaja kwa unyenyekevu, si lazima kudai hali ya utumwa; ‘mtumishi wako’ huhifadhi nguvu hiyo ya kijamii.
- source_word: בִּבְרִית יְהוָה
  choice: katika agano la Yahweh
  rationale: Kirai kinarejelea agano lililofanywa chini ya jina na ushuhuda wa Yahweh. ‘Katika agano’ huonyesha kuingizwa katika uhusiano huo wa agano.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limetoholewa badala ya kubadilishwa na cheo.
- source_word: הֵבֵאתָ אֶת עַבְדְּךָ עִמָּךְ
  choice: umemwingiza mtumishi wako ... pamoja nawe
  rationale: Hifili ya בוא ina maana ya ‘kuingiza/kuleta,’ na עִמָּךְ inaonyesha kuwa Daudi ameingizwa katika agano akiwa pamoja na Yonathani.
- source_word: וְאִם יֶשׁ בִּי עָוֹן
  choice: Lakini ikiwa nina hatia
  rationale: עָוֹן hapa inaweza kuonyesha uovu au hatia; ombi la Daudi kuhusu hukumu yake linafanya ‘hatia’ kuwa chaguo wazi na la kawaida.
- source_word: הֲמִיתֵנִי אַתָּה
  choice: wewe mwenyewe uniue
  rationale: Kiwakilishi אַתָּה kinasisitiza kwamba Yonathani mwenyewe atekeleze hukumu. ‘Uniue’ ni cha moja kwa moja na huhifadhi uzito wa ombi.
- source_word: וְעַד אָבִיךָ לָמָּה זֶּה תְבִיאֵנִי
  choice: kwa nini unipeleke kwa baba yako?
  rationale: Swali la balagha linauliza kwa nini Yonathani amkabidhi Daudi kwa Sauli badala ya kumhukumu mwenyewe; ‘unipeleke kwa baba yako’ ni Kiswahili cha asili.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina la agano יהוה, kwa hiyo tafsiri inalihifadhi kama jina binafsi ‘Yahweh’ badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa agano katika עִמָּךְ
  choice: katika agano la Yahweh pamoja nawe
  alternative: pamoja nawe katika agano la Yahweh
  rationale: Mpangilio uliochaguliwa ni wa kawaida katika Kiswahili na unaonyesha kwamba Daudi yumo katika agano pamoja na Yonathani, bila kufuta uwezekano wa kuunganisha ‘pamoja nawe’ kwa karibu zaidi na kitendo cha kuingiza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi ‘mtumishi wako’ umehifadhiwa kama namna ya Daudi kujitaja kwa unyenyekevu. Sentensi ya mwisho ni swali la balagha, na msisitizo wa ‘wewe mwenyewe’ umehifadhiwa.
