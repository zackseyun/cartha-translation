base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/002.yaml
  text: He said to him[a], “Far from it! You will not die. Look, my father does nothing, great or small, without revealing it to me. So why would my father hide this matter from me? It is not so.”
translation:
  language: sw
  text: Akamwambia, “Hasha! Hutakufa. Tazama, baba yangu hafanyi jambo lolote, kubwa au dogo, bila kunijulisha[a]. Basi kwa nini baba yangu anifiche jambo hili? Sivyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “wala haufunui sikio langu,” nahau yenye maana ya “hajanijulisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה
  choice: Hasha!
  rationale: Ni kauli ya mkazo inayokataa kabisa jambo lililosemwa. “Hasha” ni fupi, yenye hadhi, na haiingizi jina la Mungu ambalo halipo wazi katika Kiebrania.
- source_word: לֹא תָמוּת
  choice: Hutakufa
  rationale: Inatoa uhakikisho wa moja kwa moja kwa Kiswahili cha kawaida na kuhifadhi kauli ya wakati ujao.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Inavuta uangalifu kwa maelezo yanayofuata; “Tazama” ni ya kawaida katika usimulizi wenye hadhi.
- source_word: דָּבָר גָּדוֹל אוֹ דָּבָר קָטֹן
  choice: jambo lolote, kubwa au dogo
  rationale: Inahifadhi jozi ya Kiebrania inayomaanisha kila jambo bila kujali ukubwa wake, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: וְלֹא יִגְלֶה אֶת אָזְנִי
  choice: bila kunijulisha
  rationale: Nahau ya Kiebrania ya ‘kufunua sikio’ ina maana ya kumpasha mtu habari. Tafsiri kuu inatoa maana hiyo wazi, na tanbihi inahifadhi taswira halisi.
- source_word: יַסְתִּיר
  choice: anifiche
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitendo cha kuficha jambo lisijulikane.
- source_word: הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: דבר hapa ni mpango au suala linalozungumziwa, si lazima neno lililotamkwa.
- source_word: אֵין זֹאת
  choice: Sivyo kabisa
  rationale: Ni ukataa wa mwisho wenye mkazo dhidi ya dai la Daudi. Kauli hii ya Kiswahili ni fupi na ya kawaida bila kueleza zaidi ya maandishi.
- source_word: אָבִי
  choice: baba yangu
  rationale: Marudio ya wazi ya Kiebrania yamehifadhiwa ili kudumisha mkazo wa Yonathani kuhusu uhusiano wake na baba yake.
theological_decisions: []
