base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/003.yaml
  text: But David swore again and said, “Your father certainly knows that I have found favor in your eyes, and he has said, ‘Jonathan must not know this, lest he be grieved.’ But as the LORD lives, and as your soul lives, there is only a step between me and death.”
translation:
  language: sw
  text: Lakini Daudi akaapa tena, akasema, “Baba yako anajua hakika kwamba nimepata kibali machoni pako, naye amesema, ‘Yonathani asijue jambo hili, asije akahuzunika.’ Lakini, BWANA aishivyo na roho yako iishivyo, ni hatua moja tu iliyo kati yangu na kifo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדֹעַ יָדַע
  choice: anajua hakika
  rationale: Muundo wa kitenzi unaorudiwa unasisitiza uhakika wa kujua; ‘anajua hakika’ ni wa asili na wenye nguvu katika Kiswahili.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: nimepata kibali machoni pako
  rationale: Nahau hii imehifadhiwa kwa lugha ya kibiblia inayoeleweka, ikimaanisha kukubaliwa au kupendelewa na Yonathani.
- source_word: אַל יֵדַע זֹאת יְהוֹנָתָן
  choice: Yonathani asijue jambo hili
  rationale: Agizo hasi la Kiebrania limewasilishwa moja kwa moja bila kuongeza mhusika asiyetajwa katika usemi wa Sauli.
- source_word: חַי יְהוָה
  choice: kama BWANA aishivyo
  rationale: Hii ni fomula ya kiapo. ‘BWANA’ linawakilisha jina la agano יהוה kwa desturi iliyozoeleka katika Biblia za Kiswahili.
- source_word: חֵי נַפְשְׁךָ
  choice: kama uishivyo
  rationale: Maana ya kiapo ni ‘kwa uhai wako’; Kiswahili hiki ni cha kawaida na huepuka tafsiri ngumu ya neno kwa neno ‘roho yako iishivyo’.
- source_word: כְפֶשַׂע
  choice: hatua moja tu
  rationale: Neno linaashiria umbali mdogo sana au hatua; tafsiri hii inahifadhi picha ya ukaribu mkubwa wa kifo.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ ni uwakilishi wa kawaida na wenye hadhi katika Biblia za Kiswahili; herufi kubwa zinaonyesha kuwa chanzo kina jina la Mungu, יהוה.
- issue: Kiapo ‘חֵי נַפְשְׁךָ’
  choice: kama uishivyo
  alternative: kwa uhai wako
  rationale: Chaguo hili linahifadhi muundo sambamba wa kiapo bila kudokeza fundisho maalumu kuhusu asili ya nafsi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kibiblia lakini kinachoeleweka kwa msomaji wa kawaida. Urudiaji wa msisitizo wa Kiebrania umetolewa kwa ‘hakika,’ na picha ya ‘hatua moja’ imehifadhiwa.
