base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/014.yaml
  text: And if I am still alive[a], will you not show me Yahweh’s covenant faithfulness, so that I may not die?
translation:
  language: sw
  text: Na je, ikiwa bado niko hai, hutanitendea uaminifu wa agano wa Yahwe[a], ili nisife?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fadhili za Yahwe” au “upendo thabiti wa Yahwe.” Usemi wa Kiebrania unaweza pia kueleweka kuwa unarejelea kwa karibu zaidi upendo mwaminifu wa Yahwe mwenyewe, badala ya uaminifu wa agano ambao Daudi anamwonyesha Yonathani kwa heshima ya Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אִם
  choice: Na ikiwa
  rationale: Katika muktadha huu wa ombi lenye uzito, mfuatano huu unaeleweka kama utangulizi wa sharti, si kama ukanushaji wa kawaida; “Na ikiwa” ni Kiswahili cha kawaida na huendeleza ombi la Yonathani.
- source_word: עוֹדֶנִּי חָי
  choice: bado niko hai
  rationale: Huhifadhi maana ya kuendelea kuwa hai na ni usemi wa kawaida katika Kiswahili cha sasa.
- source_word: תַעֲשֶׂה עִמָּדִי
  choice: hutanitendea
  rationale: Kitenzi עשה pamoja na עם kina maana ya kumtendea mtu; muundo huu unaendana kwa kawaida na חֶסֶד.
- source_word: חֶסֶד
  choice: uaminifu wa agano
  rationale: Katika muktadha wa ahadi kati ya Yonathani na Daudi chini ya ushuhuda wa Yahwe, neno hili linaonyesha upendo na uaminifu wa kudumu unaodaiwa na uhusiano wa agano, si wema wa kawaida tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika Tetragramatoni limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: וְלֹא אָמוּת
  choice: ili nisife
  rationale: Huwasilisha kwa ufupi na kwa kawaida kusudi au matokeo yanayotamaniwa katika ombi la Yonathani.
theological_decisions:
- issue: Namna ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina binafsi la Mungu; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana na uhusiano wa חֶסֶד יְהוָה
  choice: uaminifu wa agano wa Yahwe
  alternative: fadhili za Yahwe / upendo thabiti wa Yahwe / uaminifu unaomstahili Yahwe
  rationale: Muundo wa Kiebrania unaweza kueleweka kuwa uaminifu wa agano unaomhusu au unaotokana na Yahwe, huku katika muktadha Daudi ndiye anayetakiwa kumtendea Yonathani. Tafsiri kuu hudumisha nguvu ya kiagano, na tanbihi huhifadhi uwezekano wa kuhusisha usemi huo moja kwa moja zaidi na upendo mwaminifu wa Yahwe mwenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali umehifadhiwa, na “uaminifu wa agano” umetumiwa ili kuonyesha uzito wa חֶסֶד katika muktadha bila kuficha uwezekano mwingine wa kisemantiki.
