  text: If he says[a], ‘Good,’ there will be peace for your servant; but if he becomes very angry, know that evil has been determined by him.
translation:
  language: sw
  text: Akisema, “Vema,” kutakuwa na amani kwa mtumishi wako; lakini akikasirika sana, ujue kwamba Sauli ameazimia kabisa kutenda mabaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mabaya yamekwisha kuamuliwa naye”; yaani, Sauli ameazimia kabisa kutenda mabaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Vema
  rationale: Ni jibu fupi la kukubali au kuridhia, linalolingana na matumizi ya kivumishi cha Kiebrania kama tamko kamili na linasikika kwa kawaida katika mazungumzo ya Kiswahili.
- source_word: שָׁלוֹם
  choice: kutakuwa na amani
  rationale: Hapa neno linaeleza usalama na hali njema ya Daudi; muundo wa wakati ujao unadokeza matokeo yatakayotokana na jibu la Sauli.
- source_word: לְעַבְדֶּךָ
  choice: kwa mtumishi wako
  rationale: Yonathani anajitaja kwa unyenyekevu katika nafsi ya tatu. “Mtumishi” linafaa kwa lugha ya heshima katika mazingira haya kuliko “mtumwa.”
- source_word: חָרֹה יֶחֱרֶה לוֹ
  choice: akikasirika sana
  rationale: Uambatanisho wa kitenzi-jina na kitenzi kamili katika Kiebrania unatilia mkazo kiwango cha hasira; “sana” huhifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: דַּע
  choice: ujue
  rationale: Ni amri ya moja kwa moja kwa Daudi afikie hitimisho kutokana na mwitikio wa Sauli.
- source_word: כָלְתָה
  choice: ameamua kabisa
  rationale: Katika muktadha huu kitenzi kinaonyesha nia iliyofikia ukamilifu au uamuzi thabiti; muundo huu ni wa asili katika Kiswahili bila kuondoa wazo la kukamilika.
- source_word: הָרָעָה
  choice: kufanya mabaya
  rationale: Neno lina uzito wa kimaadili wa “uovu” huku likirejelea madhara ambayo Sauli amekusudia kuyafanya.
- source_word: מֵעִמּוֹ
  choice: ameamua
  rationale: Kihusishi kinamtaja Sauli kuwa chanzo cha uamuzi huo; Kiswahili huwasilisha jambo hilo kwa kawaida kwa kumfanya Sauli kuwa mtendaji wa kitenzi.
