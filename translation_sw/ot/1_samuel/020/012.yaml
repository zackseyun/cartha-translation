  text: וַ/יֹּ֨אמֶר יְהוֹנָתָ֜ן אֶל דָּוִ֗ד יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ כִּֽי אֶחְקֹ֣ר אֶת אָבִ֗/י כָּ/עֵ֤ת מָחָר֙ הַ/שְּׁלִשִׁ֔ית וְ/הִנֵּה ט֖וֹב אֶל דָּוִ֑ד וְ/לֹֽא אָז֙ אֶשְׁלַ֣ח אֵלֶ֔י/ךָ וְ/גָלִ֖יתִי אֶת אָזְנֶֽ/ךָ־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/012.yaml
  text: And Jonathan said to David[a], “As Yahweh, the God of Israel, lives, when I sound out my father about this time tomorrow, or the third day, and behold, if it is favorable toward David[c][b], shall I not then send to you and uncover your ear?"
translation:
  language: sw
  text: Yonathani akamwambia Daudi, “Yahwe, Mungu wa Israeli, awe shahidi![a] Kesho wakati kama huu, au siku ya tatu,[b] nitachunguza nia ya baba yangu. Ikiwa ana nia njema kwa Daudi, je, sitakutumia habari na kukujulisha[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hapa ni kifupi na kigumu; maana yake inaonekana kuwa kiapo au ahadi nzito inayomwita Yahwe kuwa shahidi.
    reason: textual_variant
  - marker: b
    text: Au, “kesho wakati kama huu, siku ya tatu.” Usemi wa wakati katika Kiebrania umebanwa na unaweza kueleweka kwa zaidi ya njia moja.
    reason: alternative_reading
  - marker: c
    text: Kiebrania kihalisi, “na kulifunua sikio lako,” yaani, “kukujulisha” au “kukufunulia jambo hilo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni tafsiri ya moja kwa moja ya kishazi cha uhusiano, katika hali ya ufafanuzi baada ya jina Yahwe.
- source_word: כִּי
  choice: awe shahidi
  rationale: Katika sentensi hii yenye pengo la kisarufi, neno hilo linaeleweka katika muktadha wa kiapo. Kiswahili kinahitaji kukamilisha maana ya ahadi nzito bila kudai kwamba maandishi yana maneno halisi ‘aishivyo.’
- source_word: אֶחְקֹר אֶת אָבִי
  choice: nitachunguza nia ya baba yangu
  rationale: Muktadha unaonyesha kuwa Yonathani atachunguza msimamo au nia ya Sauli kuhusu Daudi, si kufanya uchunguzi rasmi juu ya baba yake.
- source_word: כָּעֵת מָחָר הַשְּׁלִשִׁית
  choice: Kesho wakati kama huu, au siku ya tatu
  rationale: Usemi wa wakati ni mfupi na wenye utata. Tafsiri hii inaonyesha hatua mbili za wakati zinazowezekana katika muktadha huku tanbihi ikihifadhi usomaji mwingine.
- source_word: טוֹב אֶל דָּוִד
  choice: ana nia njema kwa Daudi
  rationale: Kirai kinahusu mwelekeo mwema wa Sauli kwa Daudi; Kiswahili hiki ni cha kawaida na kinaweka wazi uhusiano huo.
- source_word: וְלֹא אָז אֶשְׁלַח אֵלֶיךָ
  choice: je, sitakutumia habari
  rationale: Muundo hasi umehifadhiwa kama swali la kusisitiza. ‘Habari’ imewekwa wazi kwa Kiswahili cha kawaida kwa sababu kitu kinachotumwa hakikutajwa katika Kiebrania.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: na kukujulisha
  rationale: Nahau hiyo ina maana ya kumfunulia mtu jambo au kumjulisha. Tafsiri ya maana ni ya kawaida katika Kiswahili, huku picha halisi ikielezwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: ‘Yahwe’ linahifadhi jina la Mungu lililo katika chanzo bila kulibadilisha kuwa cheo.
- issue: Kukamilisha kishazi cha kiapo kilicho na pengo
  choice: Yahwe, Mungu wa Israeli, awe shahidi!
  alternative: Naapa kwa Yahwe, Mungu wa Israeli; au Aishivyo Yahwe, Mungu wa Israeli
  rationale: Maandishi yaliyopokelewa yanamtaja Mungu kwa namna ya kiapo lakini hayana kitenzi cha kawaida cha kiapo. ‘Awe shahidi’ huwasilisha uzito wa ahadi bila kuingiza dai la ‘aishivyo’ ambalo halijaandikwa wazi hapa.
- issue: Nguvu ya muundo hasi וְלֹא אָז
  choice: 'swali la kusisitiza: je, sitakutumia habari'
  alternative: basi nitakutumia habari
  rationale: Swali la kusisitiza linahifadhi umbo la Kiebrania na uhakika wa ahadi bila kulainisha mvutano wa sentensi ngumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kiapo na swali la kusisitiza umehifadhiwa; nahau isiyo ya kawaida imetafsiriwa kwa maana yake na kufafanuliwa katika tanbihi.
