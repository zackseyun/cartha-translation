base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/025.yaml
  text: The king sat in his seat[a], as at other times, by the wall; and Jonathan rose, and Abner sat beside Saul, but David’s place was empty.
translation:
  language: sw
  text: Mfalme akaketi kwenye kiti chake kama kawaida, karibu na ukuta. Yonathani akasimama, naye Abneri akaketi kando ya Sauli, lakini nafasi ya Daudi ilikuwa tupu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafasi ya Daudi haikuwa na mtu,” yaani, nafasi aliyopangiwa kwenye mlo haikuwa na mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Nomino yenye kiambishi cha uainisho inamtaja Sauli kwa cheo chake; tafsiri inadumisha namna hiyo ya kumrejelea.
- source_word: מוֹשָׁבוֹ
  choice: kiti chake
  rationale: Katika muktadha wa mlo wa kifalme, neno hili linamaanisha mahali pa kuketi, si makao ya kuishi.
- source_word: כְּפַעַם בְּפַעַם
  choice: kama kawaida
  rationale: Nahau hii inaonyesha jambo lililofanyika kama nyakati zilizotangulia; ‘kama kawaida’ ni Kiswahili cha sasa na cha asili.
- source_word: אֶל מוֹשַׁב הַקִּיר
  choice: karibu na ukuta
  rationale: Kirai kinaonyesha mahali pa kiti cha mfalme kuhusiana na ukuta. Tafsiri hii inatoa picha ya mahali bila kulazimisha maana ya mwendo ya אֶל.
- source_word: וַיָּקָם
  choice: akasimama
  rationale: Kitenzi קום katika simulizi humaanisha kuinuka au kusimama; ‘akasimama’ ni cha moja kwa moja na kinaacha sababu ya tendo hilo bila kuelezwa.
- source_word: וַיֵּשֶׁב אַבְנֵר מִצַּד שָׁאוּל
  choice: naye Abneri akaketi kando ya Sauli
  rationale: מִצַּד huonyesha kuwa upande wa mtu au karibu naye; ‘kando ya Sauli’ inadumisha uhusiano huo wa mahali.
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: nafasi ya Daudi ilikuwa tupu
  rationale: Katika muktadha huu, umbo la פקד linaonyesha kutokuwapo kwa mtu aliyetarajiwa katika nafasi yake. Kiswahili cha asili hueleza hali hiyo kwa kusema nafasi ilikuwa tupu.
