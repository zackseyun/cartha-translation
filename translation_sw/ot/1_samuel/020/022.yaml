  source_fidelity: Tafsiri inahifadhi muundo wa sharti unaotofautiana, kauli kwa kijana, mishale iliyo mbele/kupita kijana, amri ya kuondoka, na sababu kwamba Yahwe amemtuma Daudi aondoke. Hata hivyo, kitenzi שִׁלַּחֲךָ kina maana mahsusi ya ‘amekutuma/amekupeleka’ katika muktadha wa kuondoka; ‘amekutuma uende’ kinarudia wazo la ‘kwenda’ bila kusisitiza wazi kuondoka. ‘Amekutuma uondoke’ hutoa maana hiyo kwa usahihi.
