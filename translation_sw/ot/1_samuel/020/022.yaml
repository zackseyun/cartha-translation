  text: וְ/אִם כֹּ֤ה אֹמַר֙ לָ/עֶ֔לֶם הִנֵּ֥ה הַ/חִצִּ֖ים מִמְּ/ךָ֣ וָ/הָ֑לְאָה לֵ֕ךְ כִּ֥י שִֽׁלַּחֲ/ךָ֖ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/022.yaml
  text: But if I say this to the young man[a], ‘Look, the arrows are beyond you,’ then go, for Yahweh has sent you away.
translation:
  language: sw
  text: Lakini nikimwambia kijana, “Tazama, mishale iko mbele zaidi yako,” ondoka, kwa maana Yahwe amekutuma uondoke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Lakini niki-
  rationale: Muundo huu unaonyesha sharti linalotofautiana na ishara iliyotangulia katika muktadha.
- source_word: לָעֶלֶם
  choice: kijana
  rationale: עֶלֶם humaanisha kijana; tafsiri hii haiongezi waziwazi jukumu la mtumishi ambalo nomino yenyewe haitaji.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwa jambo linaloonyeshwa na linafaa katika lugha ya kisasa yenye heshima.
- source_word: הַחִצִּים
  choice: mishale
  rationale: Hii ndiyo maana ya moja kwa moja ya nomino ya Kiebrania katika wingi.
- source_word: מִמְּךָ וָהָלְאָה
  choice: iko mbele yako
  rationale: Kirai kinaonyesha kwamba mishale ipo upande wa mbele zaidi, yaani imempita kijana. Kiswahili hiki ni cha kawaida na kinaacha maelezo ya ishara yaeleweke katika muktadha.
- source_word: לֵךְ
  choice: ondoka
  rationale: Katika muktadha huu amri ya kwenda inamaanisha David aondoke mahali hapo, hivyo “ondoka” ni wazi na ya kawaida.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatanguliza sababu ya amri iliyotolewa.
- source_word: שִׁלַּחֲךָ
  choice: amekutuma uende
  rationale: Huhifadhi wazo la msingi la kutumwa huku muktadha ukionyesha kuwa ni kuondoka, bila kuligeuza kuwa ruhusa tu au kuongeza amri isiyotajwa wazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetolewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Namna ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja; “Yahwe” huhifadhi jina hilo badala ya kutumia cheo.
- issue: Maana ya שִׁלַּחֲךָ kuhusu kuondoka kwa David
  choice: amekutuma uende
  alternative: amekuacha uondoke
  rationale: Chaguo hili huhifadhi tendo la Mungu la kumtuma David bila kulifanya kuwa ruhusa tu; muktadha unaonyesha kuwa kutumwa huko kunahusisha kuondoka.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi wa moja kwa moja umetolewa kwa lugha rahisi, huku tofauti ya sharti na maana ya ishara zikihifadhiwa.
