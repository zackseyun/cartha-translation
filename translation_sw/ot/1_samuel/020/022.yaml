  terminology: ‘Yahwe’ ni utoaji unaokubalika wa jina יְהוָה katika Kiswahili. Jina ‘Daudi’ katika tanbihi linafuata matumizi ya kawaida ya Kiswahili sanifu kwa דוד/David.
