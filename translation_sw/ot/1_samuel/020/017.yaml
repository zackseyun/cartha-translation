  text: And Jonathan made David swear again by his love for him[b][a], for he loved him as his own soul.
translation:
  language: sw
  text: Naye Yonathani akamwapisha Daudi tena[a] kwa sababu ya upendo aliokuwa nao kwake, kwa maana alimpenda kama alivyoipenda nafsi yake mwenyewe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaendelea kumwapisha Daudi,” au “akamweka Daudi chini ya kiapo tena.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “alimpenda kwa upendo wa nafsi yake,” nahau inayoonyesha upendo na kujitoa kwa kina sana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף
  choice: tena
  rationale: Kitenzi יסף pamoja na kitenzi-jina kinadokeza kurudiwa au kuendelea kwa tendo; “tena” kinaeleza kurudiwa kwa kiapo kwa Kiswahili cha kawaida.
- source_word: לְהַשְׁבִּיעַ
  choice: akamwapisha
  rationale: Hifili ya שבע ina maana ya kumsababisha mtu aape au kumweka chini ya kiapo; “akamwapisha” huhifadhi maana hiyo ya kisababishi kwa ufupi na kwa ufasaha.
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: kwa sababu ya upendo aliokuwa nao kwake
  rationale: ב hapa inaeleweka kwa kawaida kuwa inaonyesha msingi au sababu ya tendo. Usemi huu ni wa asili katika Kiswahili na bado unahifadhi wazi upendo wa Yonathani kwa Daudi.
- source_word: כִּי
  choice: kwa maana
  rationale: כִּי inaanzisha maelezo ya sababu ya tendo la Yonathani; “kwa maana” huunganisha vifungu kwa mtindo wa masimulizi wenye heshima.
- source_word: אַהֲבַת נַפְשׁוֹ
  choice: kama uhai wake mwenyewe
  rationale: נֶפֶשׁ inaweza kumaanisha nafsi, mtu mwenyewe, au uhai. Katika nahau hii, “kama uhai wake mwenyewe” huwasilisha kujitoa kwa kina bila kuifanya sentensi kuwa ngumu au kuingiza tafsiri isiyomo.
- source_word: אֲהֵבוֹ
  choice: alimpenda
  rationale: Umbo la qatal linaeleza ukweli unaofafanua tendo lililotangulia; wakati uliopita wa Kiswahili unafaa katika muktadha wa simulizi.
theological_decisions:
- issue: Asili ya upendo wa Yonathani kwa Daudi
  choice: Neno limetafsiriwa wazi kuwa “upendo,” wenye nguvu ya kujitoa binafsi, bila kuongeza maana ya kimapenzi au kingono isiyoelezwa katika Kiebrania.
  alternative: Kutumia “urafiki” pekee, jambo ambalo lingepunguza nguvu ya אהב; au kutumia lugha inayodai wazi uhusiano wa kimapenzi, jambo ambalo lingeongeza maana isiyosemwa na maandishi.
  rationale: Kurudiwa kwa lugha ya אהב kunahitaji kuhifadhiwa kama upendo wenye kina. Tafsiri inadumisha nguvu na mvutano wa maandishi bila kuamua zaidi ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akamwapisha” ni wazi kwa wasomaji wa kawaida; “uhai wake mwenyewe” huwasilisha nahau ya נֶפֶשׁ kwa ufasaha huku tanbihi ikihifadhi umbo halisi zaidi la Kiebrania.
