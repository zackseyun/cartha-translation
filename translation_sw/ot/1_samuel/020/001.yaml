  text: וַ/יִּבְרַ֣ח דָּוִ֔ד מ/נוות בָּ/רָמָ֑ה וַ/יָּבֹ֞א וַ/יֹּ֣אמֶר לִ/פְנֵ֣י יְהוֹנָתָ֗ן מֶ֤ה עָשִׂ֨יתִי֙ מֶֽה עֲוֺנִ֤/י וּ/מֶֽה חַטָּאתִ/י֙ לִ/פְנֵ֣י אָבִ֔י/ךָ כִּ֥י מְבַקֵּ֖שׁ אֶת נַפְשִֽׁ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/001.yaml
  text: Then David fled from Naioth in Ramah and came before Jonathan and said[a], “What have I done? What is my guilt, and what is my sin before your father, that he is seeking my life?”
translation:
  language: sw
  text: Ndipo Daudi akakimbia kutoka Nayothi huko Rama, akaja mbele ya Yonathani na kusema, “Nimefanya nini? Hatia yangu ni nini, na dhambi yangu ni nini mbele ya baba yako, hata anatafuta uhai wangu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: akakimbia
  rationale: Kitenzi kina maana ya kukimbia au kutoroka hatari; “akakimbia” ni cha kawaida na kinaonyesha uharaka bila kuongeza maelezo yasiyomo.
- source_word: מִנָּוֹת בָּרָמָה
  choice: kutoka Nayothi huko Rama
  rationale: Katika muktadha huu נָוֹת ni jina la mahali. “Huko Rama” linaonyesha uhusiano wake wa mahali na Rama kwa Kiswahili cha kawaida.
- source_word: וַיָּבֹא
  choice: akaja
  rationale: Hii ni taarifa rahisi ya mwendo kuelekea alikokuwa Yonathani.
- source_word: לִפְנֵי יְהוֹנָתָן
  choice: mbele ya Yonathani
  rationale: Linahifadhi maana ya kuwa mbele au katika uwepo wa Yonathani.
- source_word: מֶה עָשִׂיתִי
  choice: Nimefanya nini?
  rationale: Kauli hii ni swali la kawaida na lenye nguvu katika Kiswahili, sawasawa na hali timilifu ya Kiebrania hapa.
- source_word: עֲוֺנִי
  choice: Hatia yangu
  rationale: עָוֹן hapa inaweza kueleza kosa au hali ya kuwa na hatia; “hatia” linafaa katika utetezi wa Daudi na halichanganyi neno hili na חַטָּאת.
- source_word: חַטָּאתִי
  choice: dhambi yangu
  rationale: “Dhambi” linadumisha uzito wa kimaadili wa חַטָּאת na tofauti yake na “hatia.”
- source_word: לִפְנֵי אָבִיךָ
  choice: mbele ya baba yako
  rationale: Tafsiri hii inahifadhi usemi wa Kiebrania, ambao unaweza kumaanisha machoni pake au kuhusiana naye.
- source_word: כִּי
  choice: hata
  rationale: 'Katika swali hili “hata” linaunganisha kosa linalodhaniwa na hatua ya baba yake kwa Kiswahili cha asili: kosa gani limefikia kiwango cha yeye kutafuta uhai wa Daudi.'
- source_word: מְבַקֵּשׁ אֶת־נַפְשִׁי
  choice: anatafuta uhai wangu
  rationale: Linahifadhi nahau ya Kiebrania ya kutafuta uhai wa mtu, yaani kutaka kumuua, huku maana ikibaki kueleweka katika muktadha.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa maswali matatu umehifadhiwa ili kuonyesha msisitizo na utetezi wa Daudi. Jina Nayothi limenukuliwa kama jina la mahali; hakuna tanbihi iliyowekwa kwa kuwa matini kuu “huko Rama” inawasilisha uhusiano wa mahali kwa uwazi.
