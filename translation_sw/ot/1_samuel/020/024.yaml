  text: So David hid himself in the field. When the new moon came[a], the king sat down to eat the meal.
translation:
  language: sw
  text: Basi Daudi akajificha shambani. Mwezi Mpya ulipofika, mfalme akaketi ili ale mlo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “akaketi juu ya mkate ili kula”; hapa “mkate” unamaanisha mlo mzima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּתֵר
  choice: akajificha
  rationale: Nifali ya סתר hapa ina maana ya kujificha; umbo la kujirejelea linaonyesha kwamba Daudi alijisitiri kwa makusudi.
- source_word: בַּשָּׂדֶה
  choice: shambani
  rationale: שׂדה kwa kawaida ni shamba au eneo la wazi; “shambani” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: וַיְהִי הַחֹדֶשׁ
  choice: Sikukuu ya Mwezi Mpya ilipofika
  rationale: Katika muktadha huu חֹדֶשׁ inarejelea tukio la Mwezi Mpya lililoadhimishwa kwa mlo maalumu, si mwezi kama kipindi tu. Kutaja “Sikukuu” kunafanya tukio hilo lieleweke kwa msomaji wa sasa.
- source_word: וַיֵּשֶׁב
  choice: akaketi
  rationale: ישׁב hapa ni kuketi ili kula; “akaketi” ni ya kawaida na inaendeleza mtiririko wa masimulizi.
- source_word: עַל הַלֶּחֶם
  choice: kula chakula
  rationale: Kihalisi ni “juu ya mkate,” lakini “mkate” hapa unawakilisha mlo mzima. Kiswahili cha kawaida husema “kula chakula”; maana halisi imehifadhiwa katika tanbihi.
- source_word: לֶאֱכֹל
  choice: kula
  rationale: Kitenzi-jina hiki kinaonyesha kusudi la kuketi kwa mfalme.
- source_word: דָּוִד
  choice: Daudi
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Kiebrania kinatumia cheo chenye uainisho, kinachomrejelea Sauli katika muktadha; cheo kimehifadhiwa badala ya kuweka jina lake.
