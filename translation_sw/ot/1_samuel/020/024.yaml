translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. “Mwezi Mpya” limeandikwa kwa herufi kubwa kama jina la maadhimisho, na “shambani” limetumiwa badala ya neno pana zaidi “porini.”
