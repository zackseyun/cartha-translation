  source_fidelity: 'Tafsiri inafuata matini ya Kiebrania kwa uaminifu: Yonathani anamwambia Daudi, anatoa mwaliko wa pamoja wa kwenda shambani, na wote wawili wanaenda huko. Kohotativi וְנֵצֵא umetolewa ipasavyo kwa “twende,” na msisitizo wa שְׁנֵיהֶם umehifadhiwa katika “wote wawili.”'
  naturalness: Kiswahili ni sanifu, cha sasa, na chenye mtiririko wa kawaida. “Njoo, twende nje shambani” na “wakaenda nje shambani” vinaweza kusikika na urudufu kidogo katika usemi wa kila siku, lakini vinaeleweka vizuri na vinahifadhi kwa usalama wazo la kutoka/kwenda shambani lililopo katika matini.
