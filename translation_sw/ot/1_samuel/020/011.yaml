  yaml_path: translation/ot/1_samuel/020/011.yaml
  text: Then Jonathan said to David[a], “Come, and let us go out into the field.” So both of them went out into the field.
translation:
  language: sw
  text: Kisha Yonathani akamwambia Daudi[a], “Njoo, twende nje shambani.” Basi wote wawili wakaenda nje shambani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nenda, twende nje shambani.” Kitenzi לְכָה kinaweza kutafsiriwa moja kwa moja zaidi kuwa “nenda,” lakini katika muktadha huu wa mwaliko wa kwenda pamoja, “njoo” ni Kiswahili cha asili zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Muundo wa simulizi unaendeleza mfuatano wa matukio; “Kisha” na kitenzi cha kumwelekea mtu vinafaa kwa Kiswahili cha kawaida.
- source_word: יְהוֹנָתָן
  choice: Yonathani
  rationale: Jina limetolewa kwa umbo la Kiswahili linalotambulika na linalolingana na matumizi ya kawaida ya Biblia za Kiswahili.
- source_word: אֶל דָּוִד
  choice: akamwambia Daudi
  rationale: Kihusishi אֶל pamoja na kitenzi cha kusema kinatolewa kiasili kwa kiambishi cha mtendewa katika Kiswahili; jina Daudi limehifadhiwa kwa umbo lake la kawaida la Kiswahili.
- source_word: לְכָה
  choice: Njoo
  rationale: Ingawa maana ya msingi inaweza kutolewa kama “nenda,” hapa ni mwaliko wa Yonathani kwa Daudi waondoke pamoja; “Njoo” ni ya asili zaidi katika muktadha huu bila kuficha mbadala wa kileksia.
- source_word: וְנֵצֵא
  choice: twende nje
  rationale: Kohotativi ya nafsi ya kwanza wingi inaonyesha pendekezo au mwaliko wa pamoja; “twende” huiwasilisha moja kwa moja.
- source_word: הַשָּׂדֶה
  choice: shambani
  rationale: שָׂדֶה humaanisha shamba au eneo la wazi; “shambani” ni usemi wa kawaida wa Kiswahili unaoonyesha mahali wanapoelekea, huku marudio yake yakihifadhiwa.
- source_word: וַיֵּצְאוּ
  choice: Basi ... wakaenda nje
  rationale: Waw ya simulizi inaendeleza tendo lililotokana na mwaliko; “Basi” linaonyesha mwendelezo huo kwa lugha ya asili.
- source_word: שְׁנֵיהֶם
  choice: wote wawili
  rationale: Usemi huu unasisitiza kwamba Yonathani na Daudi walikwenda pamoja; “wote wawili” ni wazi na wa kawaida.
