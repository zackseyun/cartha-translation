  text: וְ/הַ֨/דָּבָ֔ר אֲשֶׁ֥ר דִּבַּ֖רְנוּ אֲנִ֣י וָ/אָ֑תָּה הִנֵּ֧ה יְהוָ֛ה בֵּינִ֥/י וּ/בֵינְ/ךָ֖ עַד עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/023.yaml
  text: And as for the matter that you and I have spoken of[a], behold, Yahweh is between me and you forever.
translation:
  language: sw
  text: Na kuhusu jambo[a] ambalo mimi na wewe tumelisema, tazama, Yahwe yuko kati yangu na wewe milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neno.” Neno la Kiebrania דָּבָר linaweza kumaanisha “neno,” “jambo,” au “kitu”; hapa linarejelea yale waliyokubaliana baada ya kuyazungumzia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַדָּבָר
  choice: Na kuhusu jambo
  rationale: דָּבָר inaweza kumaanisha “neno,” “jambo,” au “kitu.” Katika muktadha huu inarejelea makubaliano ambayo Yonathani na Daudi wamezungumzia; “jambo” ni la kawaida na linaacha upana wa neno la Kiebrania.
- source_word: אֲשֶׁר דִּבַּרְנוּ אֲנִי וָאָתָּה
  choice: ambalo mimi na wewe tumelisema
  rationale: Muundo huu unahifadhi kitendo cha kusema na kuwataja wazi wahusika wote wawili, huku ukisomeka kwa Kiswahili cha kawaida.
- source_word: הִנֵּה
  choice: tazama
  rationale: “Tazama” ni kiashiria cha usemi kinachovuta fikira kwa uzito, bila kulifanya neno hilo kuwa maelezo marefu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi, kwa umbo linalotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: בֵּינִי וּבֵינְךָ
  choice: kati yangu na wewe
  rationale: Tafsiri hii inafuata mpangilio wa Kiebrania na kuhifadhi kauli kwamba Yahwe yuko kati ya washirika hawa wawili bila kufafanua kupita maandishi.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: “Milele” ni usemi wa asili na wenye uzito unaowasilisha muda usio na mwisho au wa kudumu.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya Yahwe kuwa “kati” ya watu hao wawili
  choice: yuko kati yangu na wewe
  alternative: ni shahidi na mdhamini kati yetu
  rationale: Muktadha unaashiria kwamba Yahwe ni shahidi au mdhamini wa makubaliano yao, lakini tafsiri kuu inadumisha sitiari na mvutano wa maandishi bila kuingiza ufafanuzi huo moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na uzito unaofaa ahadi ya dhati. Mpangilio wa “mimi na wewe” na “kati yangu na wewe” umehifadhiwa kwa ukaribu na Kiebrania.
