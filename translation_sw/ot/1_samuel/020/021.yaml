base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/021.yaml
  text: And look[a], I will send the young man, saying, ‘Go, find the arrows.’ If I plainly say to the young man, ‘Behold, the arrows are on this side of you; take them and come,’ then there is peace for you and no danger[b], as Yahweh lives.
translation:
  language: sw
  text: Tazama, nitamtuma yule kijana, nikimwambia, ‘Nenda ukazipate mishale.’ Ikiwa nitamwambia yule kijana waziwazi, ‘Tazama, mishale iko upande huu, karibu nawe[a]; zichukue, uje,’ basi utakuwa salama, wala hakuna hatari, kama Yahwe aishivyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mishale iko karibu zaidi kuliko ulipo” au “mishale iko huku, upande huu wako.” Kiebrania kinaonyesha kwamba mishale imeanguka kabla ya kumfikia kijana, si ng’ambo yake.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kama Yahwe aishivyo,” fomula ya kiapo inayothibitisha ukweli wa kauli hiyo.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Kisha tazama
  rationale: “Tazama” huhifadhi nguvu ya neno la kuelekeza fikira, huku “kisha” ikiunganisha hatua hii na mpango unaoendelea.
- source_word: הַנַּעַר
  choice: yule kijana
  rationale: נַעַר inaweza kumaanisha mvulana, kijana, au mtumishi. “Kijana” huhifadhi maana ya umri/hadhi bila kumfafanua zaidi ya maandishi.
- source_word: לֵךְ מְצָא אֶת־הַחִצִּים
  choice: Nenda ukaitafute mishale
  rationale: Kauli hii ya kawaida ya Kiswahili huwakilisha amri mbili zinazofuatana na kudumisha maana ya kutafuta mishale.
- source_word: אִם אָמֹר אֹמַר
  choice: Ikiwa nitamwambia ... waziwazi
  rationale: “Waziwazi” huonyesha msisitizo wa muundo wa kitenzi pamoja na infinitivu absoluto bila kufanya Kiswahili kuwa kizito.
- source_word: הִנֵּה הַחִצִּים מִמְּךָ וָהֵנָּה
  choice: Tazama, mishale iko upande huu wako
  rationale: Kauli inaonyesha kuwa mishale imeanguka upande wa karibu, si ng’ambo ya kijana; tafsiri hii pia hudumisha uelekeo wa ishara.
- source_word: קָחֶנּוּ וָבֹאָה
  choice: ichukue, uje
  rationale: Ingawa kiambishi cha Kiebrania kina umbo la umoja, kinarejelea mishale; Kiswahili hutumia upatanisho wa ngeli ya “mishale.” “Uje” huhifadhi mwendo kuelekea kwa msemaji.
- source_word: כִּי שָׁלוֹם לְךָ
  choice: basi utakuwa salama
  rationale: Katika muktadha huu שָׁלוֹם inaonyesha usalama na hali njema ya Daudi; “utakuwa salama” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וְאֵין דָּבָר
  choice: wala hakuna hatari
  rationale: דָּבָר kwa kawaida ni “jambo/neno,” lakini hapa humaanisha kutokuwapo kwa jambo baya au tishio; “hakuna hatari” huweka wazi maana ya kimuktadha.
- source_word: חַי יְהוָה
  choice: kama Yahwe aishivyo
  rationale: Hii ni fomula ya kiapo ya Kiebrania. Muundo huu huihifadhi kama uthibitisho wenye uzito wa maneno yaliyotangulia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina maalumu יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Nguvu ya kiapo חַי יְהוָה
  choice: kama Yahwe aishivyo
  alternative: Yahwe yu hai
  rationale: Muundo uliochaguliwa unaonyesha wazi kuwa hii ni fomula ya kiapo inayothibitisha ahadi ya Yonathani, huku tanbihi ikieleza matumizi yake ya kitamaduni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ni wazi kwa msomaji wa kawaida; “waziwazi” huonyesha msisitizo wa Kiebrania, na tanbihi huhifadhi tofauti za uelekeo ambazo haziwezi kubebwa kikamilifu na kauli fupi ya Kiswahili.
