base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/009.yaml
  text: Jonathan said[a], “Far be it from you! If I knew for certain that evil had been determined by my father to come upon you, would I not tell you?”
translation:
  language: sw
  text: Yonathani akasema, “Hasha! Ikiwa ningejua kwa hakika kwamba baba yangu alikuwa ameazimia kukuletea mabaya[a], je, nisingekuambia?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwamba madhara kutoka kwa baba yangu yalikuwa yameamuliwa” au “kwamba mabaya yalikuwa yamekamilika.” Usemi wa Kiebrania unaweza kumaanisha kwamba nia ya Sauli ya kumdhuru Daudi ilikuwa imethibitika au imefikia ukamilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לָּךְ
  choice: Hasha!
  rationale: Nahau hii inaonyesha kukataa kwa nguvu. “Hasha!” ni usemi wa Kiswahili ulio wa kawaida na wenye hadhi; jaribio la kutafsiri kiwakilishi לָּךְ neno kwa neno lingekuwa lisilo la kawaida katika Kiswahili.
- source_word: כִּי אִם
  choice: Ikiwa
  rationale: Katika muktadha huu maneno hayo yanaanzisha sharti, ambalo linafuatwa na swali la balagha.
- source_word: יָדֹעַ אֵדַע
  choice: ningejua kwa hakika
  rationale: Muundo wa kitenzi pamoja na infinitivi kamili unasisitiza uhakika wa kujua.
- source_word: כָלְתָה הָרָעָה
  choice: alikuwa ameazimia ... mabaya
  rationale: Katika muktadha huu, usemi unaonyesha kwamba nia ya kudhuru ilikuwa imefikia hatua thabiti au kukamilika. Kiswahili hiki ni cha asili huku tanbihi ikihifadhi maana mbadala ya karibu zaidi na umbo la Kiebrania.
- source_word: מֵעִם אָבִי
  choice: baba yangu
  rationale: Kihusishi kinaonyesha kwamba tishio au nia hiyo ilitoka kwa baba yake Yonathani.
- source_word: לָבוֹא עָלֶיךָ
  choice: kukuletea mabaya
  rationale: Hutoa maana ya mabaya yanayokusudiwa kumfikia Daudi bila kuyabainisha kuwa shambulio la aina fulani.
- source_word: וְלֹא אֹתָהּ אַגִּיד לָךְ
  choice: je, nisingekuambia?
  rationale: 'Swali la balagha linatarajia jibu chanya: bila shaka Yonathani angemjulisha Daudi.'
theological_decisions: []
