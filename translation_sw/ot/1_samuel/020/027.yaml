  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa kawaida, wenye heshima na unaoeleweka. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Daudi, Sauli, Yonathani, na Yese.'
