base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/027.yaml
  text: And it happened on the next day[a], the second day of the new moon, that David’s place was empty. So Saul said to Jonathan his son, “Why has the son of Jesse not come to the meal either yesterday or today?”
translation:
  language: sw
  text: Ikawa siku iliyofuata, siku ya pili ya mwezi mpya, nafasi ya Daudi ikawa tupu. Basi Sauli akamwambia Yonathani mwanawe, “Kwa nini mwana wa Yese hajaja chakulani jana wala leo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִמָּחֳרַת
  choice: siku iliyofuata
  rationale: Ni usemi wa wakati unaomaanisha siku baada ya ile iliyotajwa; tafsiri hii ni ya kawaida katika Kiswahili cha sasa na inadumisha mfuatano wa simulizi.
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  choice: siku ya pili ya mwandamo wa mwezi
  rationale: Katika muktadha huu חֹדֶשׁ inaelekea kurejelea maadhimisho ya mwandamo wa mwezi, si mwezi wa kalenda tu. Tafsiri hii inadumisha maana hiyo bila kuongeza neno ‘sikukuu,’ ambalo halimo wazi katika Kiebrania.
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: nafasi ya Daudi ikawa tupu
  rationale: Nifali ya פקד hapa huonyesha kuwa nafasi ya Daudi mezani ilionekana haina mtu. ‘Ikawa tupu’ ni Kiswahili cha kawaida kinachoeleza hali hiyo kwa uwazi.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Hifadhi ya wazi ya uhusiano wa Yonathani na Sauli kama baba na mwana.
- source_word: מַדּוּעַ
  choice: Kwa nini
  rationale: Ni swali la moja kwa moja linalotaka sababu, na huu ndio usemi wa kawaida wa Kiswahili.
- source_word: בֶן יִשַׁי
  choice: mwana wa Yese
  rationale: Sauli anamtaja Daudi kwa jina la baba yake badala ya jina lake mwenyewe. Tafsiri inadumisha umbali au dharau inayoweza kudokezwa bila kuifafanua kupita kiasi.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: jana wala leo
  rationale: Kiebrania kina maana ya ‘jana pia, leo pia.’ Katika swali hasi la Kiswahili, ‘jana wala leo’ ni usemi wa asili unaodumisha wigo wa siku zote mbili.
- source_word: אֶל הַלָּחֶם
  choice: kwenye chakula
  rationale: Ingawa לֶחֶם kimsingi ni ‘mkate,’ hapa limetumiwa kumaanisha mlo wa pamoja mezani. ‘Kwenye chakula’ hutoa maana ya kimuktadha kwa Kiswahili kinachoeleweka.
theological_decisions: []
