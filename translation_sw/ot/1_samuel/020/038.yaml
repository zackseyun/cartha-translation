  text: And Jonathan called after the boy[b][a], “Hurry! Be quick! Do not stop!” So Jonathan’s boy gathered up the arrows and came to his master.
translation:
  language: sw
  text: Yonathani akamwita kijana kwa sauti, “Haraka! Hima! Usikome![a]” Basi kijana wa Yonathani akaokota ile mishale, akamrudia bwana wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa halisi, “Usisimame.” Katika muktadha huu maana yake ni, “Usikome” au “Usituame.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אַחֲרֵי הַנַּעַר
  choice: akampazia sauti yule kijana
  rationale: Muundo huu unaonyesha kwamba Yonathani alimwita kijana kwa sauti kutoka nyuma yake, bila kulazimisha maana kali zaidi ya ‘kupiga kelele.’ ‘Kijana’ linafaa kwa נַעַר katika muktadha huu wa msaidizi kijana.
- source_word: מְהֵרָה
  choice: Haraka!
  rationale: Katika muktadha huu kielezi hiki kina nguvu ya amri ya dharura; ‘Haraka!’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: חוּשָׁה
  choice: Fanya upesi!
  rationale: Tafsiri hii inadumisha amri ya pili ya kuharakisha, hivyo kuhifadhi msisitizo maradufu wa Kiebrania badala ya kuunganisha maneno hayo mawili.
- source_word: אַל תַּעֲמֹד
  choice: Usisimame!
  rationale: Tafsiri hii inadumisha picha halisi ya kitenzi עמד na pia inaweza kueleweka katika muktadha kuwa kijana asiache kusonga; tanbihi inaeleza maana ya kimuktadha.
- source_word: וַיְלַקֵּט
  choice: akaikusanya
  rationale: לקט humaanisha kukusanya vitu vilivyotapakaa; hapa ni mishale ambayo Yonathani alikuwa ameipiga.
- source_word: נַעַר יְהוֹנָתָן
  choice: kijana wa Yonathani
  rationale: Muundo huu wa kawaida unahifadhi neno נַעַר na kuonyesha kwamba kijana huyo alikuwa katika utumishi wa Yonathani.
- source_word: החצי
  choice: ile mishale
  rationale: Ingawa umbo lililoandikwa linaweza kuonekana kuwa la umoja, muktadha unahusu mishale aliyokuwa ameipiga Yonathani; wingi ndio unaofaa katika Kiswahili.
- source_word: אֶל אֲדֹנָיו
  choice: kwa bwana wake
  rationale: Hapa אָדוֹן humaanisha mkuu wa kibinadamu wa kijana huyo, yaani Yonathani. ‘Bwana wake’ ni usemi wa kawaida unaoonyesha uhusiano huo bila maana ya kimungu.
