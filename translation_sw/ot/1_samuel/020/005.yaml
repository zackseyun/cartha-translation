  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל יְהוֹנָתָ֗ן הִֽנֵּה חֹ֨דֶשׁ֙ מָחָ֔ר וְ/אָנֹכִ֛י יָשֹׁב אֵשֵׁ֥ב עִם הַ/מֶּ֖לֶךְ לֶ/אֱכ֑וֹל וְ/שִׁלַּחְתַּ֨/נִי֙ וְ/נִסְתַּרְתִּ֣י בַ/שָּׂדֶ֔ה עַ֖ד הָ/עֶ֥רֶב הַ/שְּׁלִשִֽׁית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/005.yaml
  text: David said to Jonathan[a], “Look, tomorrow is the new moon, and I am supposed to sit with the king to eat. But let me go[b], so that I may hide myself in the field until the third evening.”
translation:
  language: sw
  text: Daudi akamwambia Yonathani, “Tazama, kesho ni mwandamo wa mwezi[b], nami ninatarajiwa kuketi pamoja na mfalme kula. Lakini niruhusu niende, ili nijifiche shambani mpaka jioni ya siku ya tatu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mpaka jioni ya tatu.” Kirai cha Kiebrania kimefupishwa.
    reason: lexical_alternative
  - marker: b
    text: “Mwandamo wa mwezi” unarejelea adhimisho la kila mwezi wakati wa mwezi mpya, ambalo mara nyingi lilihusisha mlo maalumu.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira za msikilizaji kwa hali inayofuata; “Tazama” ni la heshima na la kawaida katika masimulizi ya Biblia.
- source_word: חֹדֶשׁ מָחָר
  choice: kesho ni mwandamo wa mwezi
  rationale: Katika muktadha huu חֹדֶשׁ inarejelea mwandamo na adhimisho lake la kila mwezi, si mwezi wa kalenda kwa ujumla.
- source_word: יָשֹׁב אֵשֵׁב
  choice: nami ninatarajiwa kuketi
  rationale: Muundo wa kitenzi pamoja na infinitivu kamili unasisitiza matarajio au wajibu wa Daudi kuhudhuria; “ninatarajiwa” huepuka kuufanya kuwa wajibu wa kimaadili.
- source_word: עִם הַמֶּלֶךְ לֶאֱכֹל
  choice: pamoja na mfalme kula
  rationale: Inahifadhi picha halisi ya kuketi na mfalme kwa ajili ya chakula kwa Kiswahili cha kawaida.
- source_word: וְשִׁלַּחְתַּנִי
  choice: Lakini niruhusu niende
  rationale: Ingawa maana ya msingi ni “unitume,” hapa Daudi anamwomba Yonathani amruhusu asiwepo na aondoke.
- source_word: וְנִסְתַּרְתִּי
  choice: ili nijifiche
  rationale: Inaonyesha kusudi au matokeo yaliyokusudiwa ya ruhusa anayoomba Daudi.
- source_word: בַשָּׂדֶה
  choice: shambani
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya mahali palipo wazi nje ya makazi.
- source_word: עַד הָעֶרֶב הַשְּׁלִשִׁית
  choice: mpaka jioni ya siku ya tatu
  rationale: Kirai cha Kiebrania kimefupishwa; tafsiri hii huwasilisha maana yake inayowezekana kwa Kiswahili wazi, huku tanbihi ikihifadhi uwezekano wa muundo halisi zaidi.
