base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/041.yaml
  text: When the boy had come[a], David rose from beside the south side and fell with his face to the ground and bowed three times. Then they kissed one another and wept with one another[b], until David wept the more.
translation:
  language: sw
  text: Yule kijana alipofika, Daudi akainuka kutoka upande wa kusini[a], akaanguka kifudifudi na kuinama mara tatu. Kisha wakabusiana na wakalia pamoja, mpaka kilio cha Daudi kikazidi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kutoka kando ya Negebu/kusini.” Kirai hiki ni kigumu; wengi hukielewa kuwa kinarejelea kilima au jiwe karibu na mahali Daudi alipojificha katika muktadha huu.
    reason: alternative_reading
  - marker: b
    text: Yaani, huenda Daudi alimzidi Yonathani kwa kulia, au kilio chake kilizidi kuwa kikubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר בָּא
  choice: Yule kijana alipofika
  rationale: נַעַר humtaja kijana au mtumishi; katika muktadha huyu ni kijana aliyekuwa akimhudumia Yonathani. Muundo wa wakati unafanya simulizi lisomeke kwa kawaida bila kubadili maana ya בָּא.
- source_word: מֵאֵצֶל הַנֶּגֶב
  choice: kutoka kando ya upande wa kusini[a]
  rationale: נֶגֶב kwa kawaida humaanisha kusini au Negebu. Kirai hiki ni kigumu katika muktadha huu; tafsiri inadumisha maana ya msingi ya Kiebrania na tanbihi inaeleza uwezekano wa kuelekeza kwenye kilima au jiwe karibu na maficho ya Daudi.
- source_word: וַיִּפֹּל לְאַפָּיו אַרְצָה
  choice: akaanguka kifudifudi
  rationale: Hii ni njia ya kawaida na yenye heshima katika Kiswahili ya kueleza kuanguka uso ukielekea ardhini.
- source_word: וַיִּשְׁתַּחוּ שָׁלֹשׁ פְּעָמִים
  choice: na kuinama mara tatu
  rationale: Kitenzi kinaonyesha kuinama chini; tafsiri hii haiongezi kwa lazima wazo maalumu la ibada au kutoa heshima ya kifalme.
- source_word: וַיִּשְּׁקוּ אִישׁ אֶת רֵעֵהוּ
  choice: wakabusiana
  rationale: Muundo wa kurejeleana umeonyeshwa kwa kitenzi cha Kiswahili kinachoeleza kwamba kila mmoja alimbusu mwenzake.
- source_word: וַיִּבְכּוּ אִישׁ אֶת רֵעֵהוּ
  choice: na kulia pamoja
  rationale: Hii inawasilisha hali ya wote wawili kulia bila kuifanya sentensi kuwa nzito au isiyo ya kawaida katika Kiswahili.
- source_word: עַד דָּוִד הִגְדִּיל
  choice: mpaka kilio cha Daudi kikazidi[b]
  rationale: הִגְדִּיל, yaani ‘alifanya kuwa kikubwa/alizidi,’ imetumiwa kwa ufupi bila kitu kinachotajwa wazi. Tafsiri inaacha wazi ikiwa Daudi alimzidi Yonathani kwa kulia au kilio chake mwenyewe kiliongezeka.
