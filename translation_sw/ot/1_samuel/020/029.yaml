base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/029.yaml
  text: He said[a], ‘Please let me go, because we have a family sacrifice in the city, and my brother himself has commanded me. So now, if I have found favor in your eyes[b], please let me escape and see my brothers.’ Therefore he has not come to the king’s table.
translation:
  language: sw
  text: Akasema, “Tafadhali niruhusu niende, kwa maana tuna dhabihu ya ukoo mjini, na ndugu yangu mwenyewe ameniamuru. Basi sasa, ikiwa nimepata kibali machoni pako, tafadhali niruhusu nijiondoe[a] nikawaone ndugu zangu[b].” Kwa hiyo hajaja mezani pa mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “niponyoke.” Kitenzi cha Kiebrania kinaweza kumaanisha kuponyoka au kujiondoa kwa namna ya kisirisiri.
    reason: lexical_alternative
  - marker: b
    text: “Ndugu zangu” huenda ikamaanisha ndugu zake Daudi wa kuzaliwa, au kwa upana zaidi wanaume wa ukoo wake.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי נָא
  choice: Tafadhali niruhusu niende
  rationale: Ombi hili linaomba ruhusa ya kuondoka; tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi adabu ya נָא.
- source_word: זֶבַח מִשְׁפָּחָה
  choice: dhabihu ya ukoo
  rationale: “Dhabihu” inahifadhi maana ya ibada ya זֶבַח, nayo “ukoo” inaonyesha kundi la kifamilia linaloweza kuwa pana kuliko familia ya nyumbani.
- source_word: בָּעִיר
  choice: mjini
  rationale: Ni usemi wa mahali ulio wa kawaida na wa asili katika Kiswahili.
- source_word: וְהוּא צִוָּה לִי אָחִי
  choice: na ndugu yangu ameniamuru
  rationale: “Ameamuru” inahifadhi nguvu ya צוה. Kiswahili cha kawaida hakihitaji kiwakilishi cha ziada kwa הוּא hapa, kwa kuwa mhusika ametajwa wazi kama ndugu yangu.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: ikiwa nimepata kibali machoni pako
  rationale: Inahifadhi nahau na taswira ya Kiebrania huku ikibaki wazi katika Kiswahili.
- source_word: אִמָּלְטָה נָּא
  choice: tafadhali niruhusu nijiondoe
  rationale: מלט inaweza kumaanisha kuponyoka au kujiondoa. Katika muktadha huu wa kuomba ruhusa ya kuondoka, “nijiondoe” ni ya asili na haiongezi dhana ya hatari isiyotajwa wazi.
- source_word: וְאֶרְאֶה אֶת אֶחָי
  choice: nikawaone ndugu zangu
  rationale: “Kuwaona” hufuata maana ya kawaida ya ראה, na “ndugu zangu” huhifadhi uwezekano wa ndugu wa tumbo au wanaume wa ukoo wa karibu.
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinatoa sababu ya kutokuwapo kwa Daudi kwa mtindo rasmi lakini wa kawaida.
- source_word: לֹא בָא
  choice: hajaja
  rationale: Hali timilifu ya Kiswahili inaeleza kutofika kwake hadi wakati unaozungumziwa.
- source_word: אֶל שֻׁלְחַן הַמֶּלֶךְ
  choice: mezani pa mfalme
  rationale: Ni tafsiri ya asili ya Kiswahili inayohifadhi mazingira ya chakula cha kifalme.
