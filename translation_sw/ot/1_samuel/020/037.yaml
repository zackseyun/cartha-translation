base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/037.yaml
  text: When the boy came to the place of the arrow that Jonathan had shot[a], Jonathan called after the boy and said, “Is not the arrow beyond you?”
translation:
  language: sw
  text: Kijana alipofika mahali palipokuwa na ule mshale ambao Yonathani alikuwa ameupiga, Yonathani akamwita kwa sauti kijana huyo aliyekuwa mbele yake, akasema, “Je, ule mshale hauko mbali mbele yako[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupita wewe na kuendelea.” Kwa halisi, “kutoka kwako na kuendelea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: alipofika
  rationale: Kitenzi בוא hapa kinaonyesha kijana kufika mahali palipotajwa; muundo wa ‘alipofika’ unaunganisha kwa kawaida tukio hili na tendo kuu linalofuata.
- source_word: הַנַּעַר
  choice: kijana
  rationale: נַעַר inaweza kumaanisha mvulana, kijana, au mtumishi kijana. ‘Kijana’ ni neno la kawaida na halibani umri kuliko ushahidi wa muktadha.
- source_word: עַד מְקוֹם הַחֵצִי
  choice: mahali palipokuwa na mshale
  rationale: Kirai kinaeleza kufika kwenye eneo la mshale. Tafsiri hii ni ya asili katika Kiswahili na haidai kwamba kijana alikuwa tayari ameuona.
- source_word: אֲשֶׁר יָרָה יְהוֹנָתָן
  choice: ambao Yonathani alikuwa ameupiga
  rationale: ירה katika muktadha huu ni kupiga mshale kwa upinde; ‘alikuwa ameupiga’ huonyesha tendo lililotangulia kufika kwa kijana.
- source_word: וַיִּקְרָא ... אַחֲרֵי
  choice: akamwita ... kutoka nyuma
  rationale: קרא ... אחרי humaanisha kumwita mtu anayesonga mbele yako. ‘Kutoka nyuma’ huweka wazi uhusiano wa mahali bila kudokeza kwamba Yonathani alimfuata.
- source_word: הֲלוֹא
  choice: Je, ... hauko
  rationale: הֲלוֹא huanzisha swali la balagha linalotarajia kukubaliwa; muundo huu unahifadhi nguvu hiyo kwa Kiswahili cha sasa.
- source_word: הַחֵצִי
  choice: mshale
  rationale: חֵץ hapa ni mshale uliopigwa kwa upinde.
- source_word: מִמְּךָ וָהָלְאָה
  choice: mbele yako zaidi
  rationale: Kirai hicho kwa halisi ni ‘kutoka kwako na kuendelea’; katika mazingira haya kinaonyesha kwamba mshale uko mbali zaidi katika mwelekeo ambao kijana anaelekea.
