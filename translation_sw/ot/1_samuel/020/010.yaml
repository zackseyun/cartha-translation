  text: Then David said to Jonathan[a], “Who will tell me? Or what if your father answers you harshly?”
translation:
  language: sw
  text: Ndipo Daudi akamwambia Yonathani[a], “Ni nani atakayeniambia? Au vipi baba yako akikujibu kwa ukali?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa maneno halisi ni, “Ni nani atakayeniambia? Au baba yako atakujibu nini—kwa ukali?” Kiebrania hapa kimebanwa; tafsiri imeeleza maana yake kwa Kiswahili cha kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo wa usimulizi unaendeleza tukio; “ndipo” pamoja na “akamwambia” ni Kiswahili cha kawaida kinachoonyesha mfuatano.
- source_word: דָּוִד
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: אֶל־יְהוֹנָתָן
  choice: akamwambia Yonathani
  rationale: Kitenzi chenye kiambishi cha mtendewa huwasilisha kwa kawaida maana ya kusema kwa mtu; “Yonathani” ni umbo la jina linalotumika katika Biblia za Kiswahili.
- source_word: מִי יַגִּיד לִי
  choice: Ni nani atakayeniambia?
  rationale: Hifadhi swali la moja kwa moja. Hiphil ya נגד ina maana ya kusema, kujulisha, au kutoa taarifa; “atakayeniambia” ni fupi na ya asili.
- source_word: אוֹ
  choice: Au
  rationale: Hifadhi kiunganishi cha kutenganisha kilicho wazi katika Kiebrania badala ya kukiyeyusha kuwa sharti pekee.
- source_word: מַה יַּעַנְךָ אָבִיךָ קָשָׁה
  choice: vipi baba yako akikujibu kwa ukali
  rationale: Kiebrania kimebanwa sana. “Vipi” hudokeza ‘itakuwaje’ huku “akikujibu kwa ukali” ikiwasilisha uwezekano unaomhangaisha Daudi kwa Kiswahili cha kawaida.
theological_decisions: []
