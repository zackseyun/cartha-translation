  verdict: revise
  source_fidelity: 'Ma ... tomar nafsheka is best understood here as an open-ended offer: “whatever your inner self desires/says.” The draft retains a possible literal question, but its main wording is less natural in Swahili and makes the implied object of “hilo” depend awkwardly on a question. Rendering the idiom as desire is contextually faithful.'
  naturalness: “Moyo wako unasema nini? Nitakufanyia hilo” is understandable, but it is not idiomatic contemporary Standard East African Swahili. “Chochote unachotamani, nitakufanyia” is direct, natural, and retains Jonathan’s unrestricted pledge.
  terminology: Yonathani and Daudi are established Swahili biblical forms. “Kutamani” appropriately conveys נפש in this idiom without imposing a theological sense of “soul.” A literal-form footnote preserves the Hebrew imagery.
