lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo wa simulizi unaendeleza tukio; ‘ndipo’ pamoja na ‘akamwambia’ huleta mfuatano wa kawaida wa Kiswahili.
- source_word: יְהוֹנָתָן
  choice: Yonathani
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: אֶל דָּוִד
  choice: akamwambia Daudi
  rationale: Kitenzi ‘akamwambia’ humtambulisha kwa kawaida anayeelekezewa maneno; Daudi ni utohozi wa kawaida wa jina hilo katika Kiswahili.
- source_word: מַה תֹּאמַר נַפְשְׁךָ
  choice: Moyo wako unasema nini?
  rationale: Huhifadhi umbo la swali na sitiari ya nafsi ya ndani ‘kusema.’ ‘Moyo’ ni Kiswahili cha kawaida na chenye hadhi kwa nafsi ya ndani, nia, au tamanio katika muktadha huu.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: Nitakufanyia hilo
  rationale: ‘Nitakufanyia’ huonyesha tendo linalofanywa kwa ajili ya Daudi, na ‘hilo’ huweka wazi kitu kinachodokezwa na kitenzi cha Kiebrania bila kubadili maana.
