id: 1SA.20.34
reference: 1 Samuel 20:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּ֧קָם יְהוֹנָתָ֛ן מֵ/עִ֥ם הַ/שֻּׁלְחָ֖ן בָּ/חֳרִי אָ֑ף וְ/לֹא אָכַ֞ל בְּ/יוֹם הַ/חֹ֤דֶשׁ הַ/שֵּׁנִי֙ לֶ֔חֶם כִּ֤י נֶעְצַב֙ אֶל דָּוִ֔ד כִּ֥י הִכְלִמ֖/וֹ אָבִֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/034.yaml
  text: Then Jonathan rose from the table in fierce anger[a], and he ate no food on the second day of the month, because he was grieved over David, because his father had humiliated him.
translation:
  language: sw
  text: Ndipo Yonathani akaondoka mezani akiwa na hasira kali. Hakula chakula siku ya pili ya mwezi[a], kwa sababu alihuzunika kwa ajili ya Daudi, kwa kuwa baba yake alikuwa amemwaibisha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siku ya pili ya mwandamo.” Neno la Kiebrania חֹדֶשׁ linaweza kumaanisha “mwezi” au “mwandamo”; hapa muktadha ni karamu ya kifalme ya mwandamo.
    reason: lexical_alternative
  - marker: b
    text: “Alikuwa amemwaibisha” huenda ikamaanisha kwamba baba yake alikuwa amemwaibisha Daudi au kwamba alikuwa amemwaibisha Yonathani.
    reason: referential_ambiguity
lexical_decisions:
- source_word: וַיָּקָם
  choice: akaondoka
  rationale: Katika muktadha wa mlo, kitenzi קום kinaonyesha Yonathani kuinuka na kuondoka mezani; “akaondoka” ni cha kawaida na huwasilisha tendo hilo kwa Kiswahili cha sasa.
- source_word: מֵעִם הַשֻּׁלְחָן
  choice: mezani
  rationale: Kirai hiki kinaonyesha kuondoka mahali pa meza; “akaondoka mezani” ni usemi wa asili katika Kiswahili.
- source_word: בָּחֳרִי אָף
  choice: akiwa na hasira kali
  rationale: Kirai cha Kiebrania kinaashiria ukali au mwako wa hasira. “Hasira kali” huhifadhi nguvu ya usemi bila kuwa tafsiri ngumu isiyo ya kawaida.
- source_word: וְלֹא אָכַל ... לֶחֶם
  choice: Hakula chakula
  rationale: לֶחֶם inaweza kumaanisha mkate au chakula kwa ujumla. Katika muktadha wa karamu, maana ni kwamba hakushiriki kula.
- source_word: בְּיוֹם הַחֹדֶשׁ הַשֵּׁנִי
  choice: siku ya pili ya mwezi
  rationale: חֹדֶשׁ inaweza kumaanisha mwezi au mwandamo. Maana ya moja kwa moja imewekwa katika maandishi, huku maana inayohusiana na karamu ya mwandamo ikitajwa katika tanbihi.
- source_word: נֶעְצַב
  choice: alihuzunika
  rationale: Nifali ya עצב huonyesha kuumizwa moyoni au kuhuzunika; “alihuzunika” ni wazi na ya asili.
- source_word: אֶל דָּוִד
  choice: kwa ajili ya Daudi
  rationale: Hapa kihusishi kinaelekeza huzuni ya Yonathani kwa hali iliyompata Daudi; usemi huu ni wa kawaida bila kufafanua zaidi ya maandishi.
- source_word: הִכְלִמוֹ
  choice: alikuwa amemwaibisha
  rationale: Hifili ya כלם humaanisha kumwaibisha au kumfedhehesha mtu. “Kumwaibisha” huhifadhi maana na pia kiwakilishi kisichotaja wazi mhusika.
- source_word: אָבִיו
  choice: baba yake
  rationale: Kiambishi kinamtaja baba ya Yonathani, yaani Sauli, lakini tafsiri inadumisha usemi wa kifamilia wa Kiebrania.
theological_decisions:
- issue: Mhusika anayerejelewa na kiambishi katika הִכְלִמוֹ (“alimwaibisha”)
  choice: Kudumisha kiwakilishi kisichotaja wazi mhusika katika maandishi, pamoja na tanbihi
  alternative: Kutaja wazi kwamba baba yake alimwaibisha Daudi, au kwamba alimwaibisha Yonathani
  rationale: Kisarufi, kiwakilishi cha Kiebrania kinaweza kurejelea Daudi, ambaye ametajwa karibu zaidi, au Yonathani, ambaye baba yake alikuwa ametoka kumtukana. Kutotatua jambo hilo kimya kimya huhifadhi utata halisi wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. Lugha ni ya kisasa na rahisi kueleweka; utata wa kiwakilishi cha Kiebrania umehifadhiwa badala ya kuamuliwa kimya kimya.
