  text: וַ/יֹּ֕אמֶר לָ֥/מָּה זֶּ֛ה אֲדֹנִ֥/י רֹדֵ֖ף אַחֲרֵ֣י עַבְדּ֑/וֹ כִּ֚י מֶ֣ה עָשִׂ֔יתִי וּ/מַה בְּ/יָדִ֖/י רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/018.yaml
  text: And he said[a], “Why is my lord pursuing his servant like this? For what have I done[b], and what evil is in my hand?”
translation:
  language: sw
  text: Naye akasema, “Kwa nini bwana wangu anamwandama mtumishi wake[a] namna hii? Maana nimefanya nini, na ni uovu gani ulio mkononi mwangu[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mtumishi wake.” Tafsiri nyingine husema “mtumishi wako” ili kulainisha mazungumzo ya moja kwa moja, lakini Maandishi ya Kimasoreti yana umbo la nafsi ya tatu.'
    reason: alternative_reading
  - marker: b
    text: Kauli “mkononi mwangu” ni nahau ya Kiebrania inayoweza kumaanisha kuwa na hatia, nia mbaya, au uwezo wa kutenda madhara.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Naye akasema
  rationale: Kauli hii inaendeleza mtiririko wa simulizi wa Kiebrania bila kulazimisha mpangilio maalumu zaidi wa wakati.
- source_word: לָמָּה זֶּה
  choice: Kwa nini ... namna hii?
  rationale: Muundo huu unaonyesha swali lenye msisitizo, ‘kwa nini hivi?’; ‘namna hii’ ni Kiswahili cha kawaida kinachohifadhi msisitizo huo.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Daudi anamwita Sauli kwa heshima kama mkuu wa kibinadamu; hapa si jina la Mungu.
- source_word: רֹדֵף אַחֲרֵי
  choice: anamwandama
  rationale: Neno hili linaonyesha kumfuatilia mtu kwa kusudi la kumkamata au kumdhuru, bila kuongeza maana pana ya mateso ya kidini.
- source_word: עַבְדּוֹ
  choice: mtumishi wake
  rationale: Maandishi ya Kimasoreti yana kiambishi cha nafsi ya tatu, yaani ‘wake’. Hivyo tafsiri haijabadilisha kuwa ‘mtumishi wako’, ingawa hayo yangekuwa mazungumzo ya moja kwa moja yaliyo laini zaidi.
- source_word: כִּי
  choice: Maana
  rationale: Hapa neno linaanzisha swali la maelezo linalothibitisha pingamizi la Daudi.
- source_word: מֶה עָשִׂיתִי
  choice: nimefanya nini
  rationale: Ni swali la balagha linalouliza tendo gani la Daudi lingestahili kufuatwa huku.
- source_word: וּמַה בְּיָדִי רָעָה
  choice: na ni uovu gani ulio mkononi mwangu
  rationale: Tafsiri hii inahifadhi sitiari ya Kiebrania ‘mkononi mwangu’ pamoja na uzito wa רָעָה, ‘uovu’.
