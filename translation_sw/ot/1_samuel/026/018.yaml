translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. ‘Bwana wangu’ inahifadhi namna ya heshima kwa mfalme, huku ‘anamwandama’ ikionyesha ufuatiliaji wenye uhasama. Sitiari ‘mkononi mwangu’ imehifadhiwa na kufafanuliwa katika tanbihi.
