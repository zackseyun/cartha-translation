  text: וַ/יֹּאמֶר֩ דָּוִ֨ד אֶל אַבְנֵ֜ר הֲ/לוֹא אִ֣ישׁ אַתָּ֗ה וּ/מִ֤י כָמ֨וֹ/ךָ֙ בְּ/יִשְׂרָאֵ֔ל וְ/לָ֨/מָּה֙ לֹ֣א שָׁמַ֔רְתָּ אֶל אֲדֹנֶ֖י/ךָ הַ/מֶּ֑לֶךְ כִּי בָא֙ אַחַ֣ד הָ/עָ֔ם לְ/הַשְׁחִ֖ית אֶת הַ/מֶּ֥לֶךְ אֲדֹנֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/015.yaml
  text: David said to Abner[b][a], “Are you not a man? And who is like you in Israel? Why then have you not kept watch over your lord the king? For one of the people came to destroy the king your lord.”
translation:
  language: sw
  text: Daudi akamwambia Abneri, “Je, wewe si mwanamume? Ni nani aliye kama wewe katika Israeli[a]? Basi, kwa nini hukumlinda bwana wako mfalme? Kwa maana mtu mmoja miongoni mwa watu[b] alikuja kumwangamiza mfalme, bwana wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni nani aliye sawa nawe katika Israeli?”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mmoja wa watu,” yaani mtu mmoja kutoka kambini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אִישׁ אַתָּה
  choice: Je, wewe si mwanamume?
  rationale: אִישׁ maana yake ya msingi ni ‘mwanamume.’ Swali la balagha linahifadhiwa bila kuongeza sifa kama ‘shujaa,’ ingawa katika muktadha Daudi anamwaibisha Abneri kwa kushindwa kutekeleza wajibu wake.
- source_word: וּמִי כָמוֹךָ בְּיִשְׂרָאֵל
  choice: Ni nani aliye kama wewe katika Israeli?
  rationale: כָמוֹךָ huonyesha ulinganisho, ‘kama wewe.’ Muundo wa Kiebrania umehifadhiwa kwa Kiswahili cha kawaida huku maana ya kutokuwa na mfano au wa kulinganishwa naye ikibaki wazi.
- source_word: וְלָמָּה לֹא שָׁמַרְתָּ אֶל
  choice: Basi, kwa nini hukumlinda
  rationale: שׁמר hapa ina maana ya kulinda kwa uangalifu. ‘Hukumlinda’ ni ya asili katika Kiswahili na inaonyesha wajibu wa Abneri wa kumweka mfalme salama.
- source_word: אֲדֹנֶיךָ הַמֶּלֶךְ
  choice: bwana wako mfalme
  rationale: אדון humtaja aliye na mamlaka juu ya mwingine. ‘Bwana wako mfalme’ huhifadhi uhusiano wa mamlaka na uradidi wa cheo bila kumchanganya na jina la Mungu.
- source_word: כִּי בָא אַחַד הָעָם
  choice: Kwa maana mtu mmoja miongoni mwa watu alikuja
  rationale: אַחַד הָעָם ni kihalisi ‘mmoja wa watu.’ Kiswahili ‘mtu mmoja miongoni mwa watu’ kinafafanua kwa njia ya kawaida kwamba ni mtu mmoja kutoka katika kundi bila kumtaja hasa kuwa askari.
- source_word: לְהַשְׁחִית
  choice: kumwangamiza
  rationale: Hifili ya שׁחת humaanisha kuangamiza au kuharibu. Katika muktadha matokeo yaliyokusudiwa ni kifo cha mfalme, lakini ‘kumwangamiza’ huhifadhi upana wa neno la chanzo badala ya kulibana kuwa ‘kumuua.’
- source_word: הַמֶּלֶךְ אֲדֹנֶיךָ
  choice: mfalme, bwana wako
  rationale: Mpangilio huu huhifadhi kurudiwa kwa utambulisho wa mfalme na msisitizo wa lawama dhidi ya Abneri.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. Maswali ya balagha, marudio ya ‘mfalme, bwana wako,’ na ukali wa lawama za Daudi yamehifadhiwa. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika.
