id: 1SA.26.12
reference: 1 Samuel 26:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּקַּח֩ דָּוִ֨ד אֶֽת הַ/חֲנִ֜ית וְ/אֶת צַפַּ֤חַת הַ/מַּ֨יִם֙ מֵרַאֲשֹׁתֵ֣י שָׁא֔וּל וַ/יֵּלְכ֖וּ לָ/הֶ֑ם וְ/אֵ֣ין רֹאֶה֩ וְ/אֵ֨ין יוֹדֵ֜עַ וְ/אֵ֣ין מֵקִ֗יץ כִּ֤י כֻלָּ/ם֙ יְשֵׁנִ֔ים כִּ֚י תַּרְדֵּמַ֣ת יְהוָ֔ה נָפְלָ֖ה עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/012.yaml
  text: So David took the spear and the jar of water from beside Saul’s head[a], and they went away. No one saw it, and no one knew it, and no one awoke, for they were all sleeping[b], because a deep sleep from Yahweh had fallen on them.
translation:
  language: sw
  text: Basi Daudi akachukua mkuki na chupa ya maji vilivyokuwa kando ya kichwa cha Sauli[a], kisha wakaenda zao. Hakuna aliyeona, wala aliyejua, wala aliyeamka, kwa maana wote walikuwa wamelala; kwa sababu usingizi mzito kutoka kwa Yahwe ulikuwa umewaangukia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinarejelea mahali karibu na kichwa cha Sauli alipokuwa amelala.
    reason: lexical_alternative
  - marker: b
    text: Au, “usingizi mzito wa Yahwe ulikuwa umewaangukia.” Usemi huu unaonyesha kwamba usingizi huo ulitokana na tendo la Yahwe.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲנִית
  choice: mkuki
  rationale: Neno חֲנִית humaanisha silaha ya kuchoma ya aina ya mkuki; “mkuki” ni neno la kawaida na linalofaa katika muktadha huu wa kijeshi.
- source_word: צַפַּחַת הַמַּיִם
  choice: chupa ya maji
  rationale: צַפַּחַת ni chombo kidogo cha kubebea maji, kama chupa au gudulia. “Chupa ya maji” ni wazi na ya kawaida katika Kiswahili cha sasa bila kudokeza kwamba ilikuwa chupa ya kisasa.
- source_word: מֵרַאֲשֹׁתֵי שָׁאוּל
  choice: kando ya kichwa cha Sauli
  rationale: Usemi huu unaonyesha eneo lililokuwa karibu na kichwa cha Sauli alipokuwa amelala, si kwamba vitu hivyo vilikuwa juu ya kichwa chake.
- source_word: וַיֵּלְכוּ לָהֶם
  choice: wakaenda zao
  rationale: Usemi “wakaenda zao” unaonyesha kwa kawaida kwamba Daudi na Abishai waliondoka mahali pale, huku ukidokeza maana ya לָהֶם bila kuipanua kupita kiasi.
- source_word: וְאֵין רֹאֶה וְאֵין יוֹדֵעַ וְאֵין מֵקִיץ
  choice: Hakuna aliyeona, wala aliyejua, wala aliyeamka
  rationale: Muundo wa marudio umehifadhiwa kwa ajili ya msisitizo wa simulizi. Vitenzi vya Kiebrania havitaji yambwa wazi, hivyo tafsiri pia haiongezi “jambo hilo” au “walichofanya.”
- source_word: כִּי כֻלָּם יְשֵׁנִים
  choice: kwa maana wote walikuwa wamelala
  rationale: Tafsiri hii inaeleza hali yao ya wakati huo kwa Kiswahili cha kawaida na kuhifadhi sababu inayotolewa na kifungu.
- source_word: תַּרְדֵּמַת יְהוָה
  choice: usingizi mzito kutoka kwa Yahwe
  rationale: תַּרְדֵּמָה ni usingizi mzito sana. “Kutoka kwa Yahwe” huonyesha chanzo au utendaji wa Mungu bila kubadili muundo kuwa kauli ya moja kwa moja zaidi kuliko Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi YHWH limetolewa kama jina binafsi “Yahwe,” kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: נָפְלָה עֲלֵיהֶם
  choice: ulikuwa umewaangukia
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania ya usingizi ‘kuwaangukia’ na wakati uliotangulia tendo la Daudi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kina jina binafsi la Mungu, si cheo; kwa hiyo “Yahwe” hulihifadhi badala ya kulibadili kuwa cheo.
- issue: Uhusiano wa Yahwe na usingizi mzito katika תַּרְדֵּמַת יְהוָה
  choice: usingizi mzito kutoka kwa Yahwe ulikuwa umewaangukia
  alternative: Yahwe alikuwa amewaletea usingizi mzito
  rationale: Chaguo hili linaonyesha kwamba usingizi huo ulitokana na Yahwe, lakini linahifadhi namna isiyo ya moja kwa moja ya kishazi cha Kiebrania na taswira yake ya ‘kuwaangukia,’ badala ya kukifanya kuwa kauli ya kisababishi iliyo wazi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Marudio ya “wala” yanahifadhi msisitizo wa Kiebrania; “wakaenda zao” ni usemi wa kawaida unaofaa simulizi, na “umewaangukia” huhifadhi taswira ya chanzo bila kuwa mgumu kueleweka.
