id: 1SA.26.19
reference: 1 Samuel 26:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֗ה יִֽשְׁמַֽע נָא֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֵ֖ת דִּבְרֵ֣י עַבְדּ֑/וֹ אִם יְהוָ֞ה הֱסִֽיתְ/ךָ֥ בִ/י֙ יָרַ֣ח מִנְחָ֔ה וְ/אִ֣ם בְּנֵ֣י הָ/אָדָ֗ם אֲרוּרִ֥ים הֵם֙ לִ/פְנֵ֣י יְהוָ֔ה כִּֽי גֵרְשׁ֣וּ/נִי הַ/יּ֗וֹם מֵ/הִסְתַּפֵּ֜חַ בְּ/נַחֲלַ֤ת יְהוָה֙ לֵ/אמֹ֔ר לֵ֥ךְ עֲבֹ֖ד אֱלֹהִ֥ים אֲחֵרִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/019.yaml
  text: And now[a], please let my lord the king hear the words of his servant. If Yahweh has stirred you up against me, may he accept an offering; but if it is men, they are cursed before Yahweh, because they have driven me out today from having a share in Yahweh’s inheritance, saying, ‘Go[b], serve other gods.’
translation:
  language: sw
  text: Basi sasa, bwana wangu, mfalme, tafadhali ayasikilize maneno ya mtumishi wake. Ikiwa Yahwe amekuchochea dhidi yangu, na aipokee sadaka[a]; lakini ikiwa ni wanadamu, wamelaaniwa mbele za Yahwe, kwa sababu leo wamenifukuza nisishiriki katika urithi wa Yahwe[b], wakisema, “Nenda, ukatumikie miungu mingine.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “na ainuse sadaka,” yaani aikubali sadaka au toleo.
    reason: lexical_alternative
  - marker: b
    text: Au, “nisijiunge na urithi wa Yahwe.” Usemi wa Kiebrania unaweza kusisitiza kuambatanishwa au kujumuishwa katika watu au nchi iliyo urithi wa Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huendeleza simulizi na kuanzisha ombi la Daudi kwa njia ya kawaida katika Kiswahili.
- source_word: יִשְׁמַע נָא
  choice: tafadhali ... ayasikilize
  rationale: Kauli ya ombi pamoja na נָא inaonyesha unyenyekevu na heshima, si amri kali.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Ni namna ya heshima ya kumsemesha Sauli kama mfalme; hapa ‘bwana’ haimaanishi Mungu.
- source_word: דִּבְרֵי עַבְדּוֹ
  choice: maneno ya mtumishi wake
  rationale: Inahifadhi usemi wa unyenyekevu wa nafsi ya tatu uliomo katika Kiebrania.
- source_word: אִם יְהוָה הֱסִיתְךָ בִי
  choice: Ikiwa Yahwe amekuchochea dhidi yangu
  rationale: ‘Amekuchochea’ huhifadhi maana sababishi ya הסית bila kufafanua zaidi aina ya usababisho wa Mungu.
- source_word: יָרַח מִנְחָה
  choice: na aipokee sadaka
  rationale: Kirai hiki kwa neno halisi kinahusu kuinusa sadaka, lakini kimaanisho humaanisha kuikubali; tafsiri kuu inaeleza nahau hiyo kwa Kiswahili cha kawaida.
- source_word: וְאִם בְּנֵי הָאָדָם
  choice: lakini ikiwa ni wanadamu
  rationale: Huweka tofauti kati ya Yahwe na watendaji wa kibinadamu bila kutumia kirai kisicho cha kawaida ‘wana wa Adamu’.
- source_word: אֲרוּרִים הֵם לִפְנֵי יְהוָה
  choice: wamelaaniwa mbele za Yahwe
  rationale: Muundo wa Kiebrania ni tamko kuhusu hali yao, si ombi la watukanwe.
- source_word: גֵרְשׁוּנִי
  choice: wamenifukuza
  rationale: Huwasilisha kwa uwazi tendo la kumwondoa Daudi kwa nguvu.
- source_word: מֵהִסְתַּפֵּחַ
  choice: nisishiriki
  rationale: Katika muktadha wa urithi, usemi huu wa asili unaonyesha kunyimwa kuambatana au kujumuishwa katika sehemu ya Yahwe; ‘nisishiriki’ ni wa kawaida na huhifadhi wazo la kutengwa.
- source_word: בְּנַחֲלַת יְהוָה
  choice: katika urithi wa Yahwe
  rationale: ‘Urithi’ huhifadhi upana wa maana unaoweza kuhusisha nchi pamoja na watu wa agano, bila kuubana kuwa mahali pekee.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Hutambulisha maneno yanayoeleza athari au maana ya tendo la kuwafukuza.
theological_decisions:
- issue: Yahwe kumchochea Sauli dhidi ya Daudi
  choice: Kauli sharti imehifadhiwa bila kufafanua uhusiano wa tendo la Mungu na uwajibikaji wa binadamu.
  alternative: Kuitafsiri kama uchochezi wa moja kwa moja wa Mungu, au kama ruhusa ya Mungu pekee.
  rationale: Kiebrania hakielezi metafizikia ya usababisho huo; tafsiri haipaswi kutatua mvutano ambao andiko lenyewe linauacha.
- issue: Kutengwa na ‘urithi wa Yahwe’
  choice: Imetafsiriwa kwa upana kama kunyimwa kushiriki katika urithi wa Yahwe.
  alternative: Kuufanya urithi huo kuwa nchi pekee, au ibada katika patakatifu pekee.
  rationale: Kirai kinaweza kuhusisha nchi na jumuiya ya agano pamoja na ushiriki wa kidini; lugha pana ya ‘urithi’ inadumisha vipengele hivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Usemi wa heshima wa Daudi kwa mfalme umehifadhiwa, huku nahau ngumu ya dhabihu ikiwekwa wazi katika matini na maana yake halisi kutolewa katika tanbihi.
