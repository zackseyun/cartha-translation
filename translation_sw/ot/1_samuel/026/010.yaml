base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/010.yaml
  text: And David said[a], “As Yahweh lives, surely Yahweh will strike him, or his day will come to die[c][b], or he will go down into battle and perish.”
translation:
  language: sw
  text: Ndipo Daudi akasema, “Kama Yahweh aishivyo, hakika Yahweh atampiga[a], au siku yake itafika naye atakufa[b], au atashuka kwenda vitani na kuangamia[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atampiga chini.”
    reason: Kitenzi cha Kiebrania kinaweza kudokeza pigo la kumwangusha au kumwangamiza, ingawa namna ya pigo haijatajwa wazi.
  - marker: b
    text: Au, “wakati wake utafika naye atakufa.”
    reason: “Siku yake” ni nahau inayoweza kumaanisha wakati wake uliowekwa.
  - marker: c
    text: Au, “atashuka vitani na kuangamizwa.”
    reason: Kitenzi cha Kiebrania kinaweza kueleweka kwa sauti ya kutendwa, yaani kuondolewa au kuangamizwa katika vita.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Kama Yahweh aishivyo
  rationale: Hii ni kauli ya kawaida ya kiapo katika Kiebrania. Tafsiri hii inadumisha uzito wa kiapo na inasikika kwa heshima katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi, badala ya kubadilishwa kuwa cheo.
- source_word: כִּי אִם
  choice: hakika
  rationale: Katika muktadha huu wa kiapo, maneno haya yanatilia mkazo uhakika wa kauli ya Daudi, wala hayaanzishi sharti la kawaida.
- source_word: יִגָּפֶנּוּ
  choice: atampiga
  rationale: Kitenzi נָגַף kinaonyesha Yahweh akimpiga kwa pigo la hukumu, huku namna hasa ya pigo hilo ikiachwa wazi kama ilivyo katika Kiebrania.
- source_word: יוֹמוֹ יָבוֹא וָמֵת
  choice: siku yake itafika naye atakufa
  rationale: Tafsiri hii inadumisha nahau ya Kiebrania kuhusu kufika kwa siku ya mtu na pia inataja wazi matokeo yake, yaani kifo.
- source_word: בַמִּלְחָמָה יֵרֵד
  choice: atashuka kwenda vitani
  rationale: Neno 'atashuka' linahifadhi kitenzi cha mwendo יָרַד, huku 'kwenda vitani' likitoa Kiswahili cha kawaida na kinachoeleweka.
- source_word: וְנִסְפָּה
  choice: na kuangamia
  rationale: Neno hili linahifadhi tofauti ya kimaana na neno la awali 'atakufa' na linaonyesha kuondolewa au kuangamia vitani.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. 'Yahweh' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Wakala wa kifo cha Sauli
  choice: Yahweh mwenyewe atampiga, au siku yake itafika, au ataangamia vitani
  alternative: Kufafanua njia moja tu kama kifo kilichopangwa moja kwa moja
  rationale: Maandishi yanaweka uwezekano wa namna tatu bila kueleza uhusiano wao wote kwa mfumo wa kiteolojia; tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Muundo wa kiapo umehifadhiwa, na mfululizo wa njia tatu za kifo cha Sauli umeachwa wazi bila kuusawazisha kupita kiasi.
