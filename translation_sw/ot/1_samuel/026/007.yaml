base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/007.yaml
  text: So David and Abishai came to the troops by night[a], and behold, Saul was lying asleep within the encampment, with his spear stuck in the ground at his head, and Abner and the troops were lying around him.
translation:
  language: sw
  text: Basi Daudi na Abishai wakawafikia wanajeshi usiku. Kumbe, Sauli alikuwa amelala usingizi ndani ya kambi[a], mkuki wake ukiwa umechomekwa ardhini kando ya kichwa chake; Abneri na wanajeshi walikuwa wamelala kumzunguka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani ya duara”—huenda neno la Kiebrania linarejelea mpangilio wa kambi wa mviringo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: wanajeshi
  rationale: Katika muktadha huu wa kijeshi, neno hili linamaanisha kikosi cha Sauli, si watu kwa ujumla; “wanajeshi” ni Kiswahili cha kawaida na linafaa katika sehemu zote mbili.
- source_word: לַיְלָה
  choice: usiku
  rationale: Hutumika hapa kama kielezi cha wakati na kwa kawaida hutafsiriwa “usiku.”
- source_word: וְהִנֵּה
  choice: Kumbe
  rationale: “Kumbe” linadumisha nguvu ya kisimulizi ya kuonyesha hali ambayo Daudi aliikuta, kwa lugha ya asili na iliyo hai.
- source_word: שֹׁכֵב יָשֵׁן
  choice: alikuwa amelala usingizi
  rationale: Usemi huu unaonyesha kwa pamoja mkao wa kulala chini na hali ya kuwa usingizini.
- source_word: בַּמַּעְגָּל
  choice: katikati ya kambi
  rationale: Katika muktadha huu מַעְגָּל huenda inarejelea eneo la ndani la kambi au mpangilio wake wa mviringo; tafsiri hii inatoa maana ya kimuktadha kwa Kiswahili kinachoeleweka, huku tanbihi ikihifadhi uwezekano wa “ndani ya duara.”
- source_word: חֲנִיתוֹ
  choice: mkuki wake
  rationale: “Mkuki” ndilo neno la kawaida la Kiswahili kwa silaha hii katika simulizi la Sauli.
- source_word: מְעוּכָה בָאָרֶץ
  choice: ukiwa umechomekwa ardhini
  rationale: Kirai kinaonyesha kwamba mkuki ulikuwa umesukumwa na kukazwa ardhini; “umechomekwa” ni cha kawaida na sahihi.
- source_word: מְרַאֲשֹׁתָיו
  choice: karibu na kichwa chake
  rationale: Umbo hili ni nahau ya mahali palipo upande wa kichwa cha mtu; “karibu na kichwa chake” linaeleza mahali hapo kwa kawaida.
- source_word: סְבִיבֹתָיו
  choice: kumzunguka
  rationale: Linaonyesha kwamba Abneri na wanajeshi walilala pande zote za Sauli.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usimulizi. “Wakawafikia” linaendeleza mtiririko wa simulizi; “Kumbe” linatoa mshangao wa וְהִנֵּה bila kutumia usemi wa kizamani. Alama ya tanbihi imewekwa baada ya “usiku” ili kuendana na safu ya Kiingereza iliyotolewa, ingawa tanbihi yenyewe inafafanua “katikati ya kambi.”
