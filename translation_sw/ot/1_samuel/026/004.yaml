  yaml_path: translation/ot/1_samuel/026/004.yaml
  text: So David sent out scouts[a], and he learned that Saul had indeed come.
translation:
  language: sw
  text: Basi Daudi akatuma wapelelezi, naye akapata kujua kwamba kweli Sauli alikuwa amefika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye akathibitisha kwamba Sauli alikuwa amefika.” Neno la mwisho la Kiebrania huenda linaongeza wazo la uhakika au uthibitisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma
  rationale: Kitenzi שׁלח humaanisha ‘kutuma’; ‘akatuma’ ni simulizi la kawaida na la moja kwa moja katika Kiswahili.
- source_word: מְרַגְּלִים
  choice: wapelelezi
  rationale: Neno hili humaanisha watu wanaochunguza au kupeleleza eneo. ‘Wapelelezi’ linafaa katika mazingira ya upelelezi wa kijeshi bila kulazimisha maana ya kisiasa ya ‘majasusi.’
- source_word: וַיֵּדַע
  choice: akapata kujua
  rationale: ידע kimsingi ni ‘kujua,’ lakini hapa inaeleza Daudi kupata taarifa baada ya kutuma wapelelezi. ‘Akapata kujua’ huonyesha mchakato huo kwa Kiswahili cha asili.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי linaanzisha yaliyomo katika taarifa aliyopata Daudi.
- source_word: בָא
  choice: alikuwa amefika
  rationale: Kitenzi timilifu kinaonyesha kwamba kuwasili kwa Sauli kulikuwa tayari kumetokea kabla Daudi hajapata habari; ‘alikuwa amefika’ hudhihirisha uhusiano huo wa wakati.
- source_word: אֶל נָכוֹן
  choice: kweli
  rationale: Kirai hiki kinaeleweka vyema hapa kwa maana ya uthibitisho au uhakika. ‘Kweli’ huwasilisha kwa kawaida kwamba Daudi alithibitisha kufika kwa Sauli, huku tanbihi ikihifadhi uwezekano wa tafsiri nyingine.
- source_word: דָּוִד
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
