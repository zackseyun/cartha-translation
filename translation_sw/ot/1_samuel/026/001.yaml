reference: 1 Samuel 26:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ הַ/זִּפִים֙ אֶל שָׁא֔וּל הַ/גִּבְעָ֖תָ/ה לֵ/אמֹ֑ר הֲ/ל֨וֹא דָוִ֤ד מִסְתַּתֵּר֙ בְּ/גִבְעַ֣ת הַ/חֲכִילָ֔ה עַ֖ל פְּנֵ֥י הַ/יְשִׁימֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/001.yaml
  text: Then the Ziphites came to Saul at Gibeah[a], saying, “Is not David hiding on the hill of Hachilah, which is before the wasteland?”
translation:
  language: sw
  text: Ndipo Wazifi wakamjia Sauli huko Gibea, wakisema, “Je, Daudi hajifichi katika kilima cha Hakila, kinachokabili nyika[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kinachokabili Yeshimoni.” Neno la Kiebrania linaweza kueleweka kuwa nomino ya kawaida yenye maana ya “nyika” au “jangwa,” au kuwa jina la eneo, Yeshimoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Ndipo ... wakamjia
  rationale: Umbo la wayyiqtol linaendeleza simulizi. “Ndipo” linaonyesha mfuatano wa matukio kwa Kiswahili cha kawaida, na “wakamjia” linaonyesha kwamba walikwenda mahali alipokuwa Sauli.
- source_word: הַזִּפִים
  choice: Wazifi
  rationale: Ni jina la wingi la wakazi wa Zifu; “Wazifi” linahifadhi utambulisho wao wa kijiografia kwa ufupi.
- source_word: הַגִּבְעָתָה
  choice: huko Gibea
  rationale: Herufi ya mwelekeo katika jina la mahali huonyesha kwenda Gibea. Kwa kuwa kitenzi tayari ni “wakamjia Sauli,” “huko Gibea” kinaeleza kwa kawaida mahali Sauli alipokuwa bila kurudia wazo la kuelekea.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Kitenzi-jina hiki hutanguliza maneno ya moja kwa moja; “wakisema” ni sawa ya wazi na ya asili.
- source_word: הֲלוֹא
  choice: Je, ... ha-
  rationale: Chembe hii hutanguliza swali la balagha linalotarajia uthibitisho. Muundo “Je, ... hajifichi?” unadumisha nguvu hiyo bila kuibadili kuwa kauli.
- source_word: מִסְתַּתֵּר
  choice: hajifichi
  rationale: Partisipio ya hitpael ya סתר ina maana ya mtu kujiweka mafichoni; “hajifichi” huhifadhi maana ya kujirejelea kwa lugha ya kawaida.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: katika kilima cha Hakila
  rationale: גִּבְעָה kwa kawaida ni kilima. “Katika kilima cha Hakila” ni usemi wa kawaida wa eneo na unafuata kihusishi cha Kiebrania bila kulazimisha sehemu hususa juu ya kilima.
- source_word: עַל פְּנֵי הַיְשִׁימֹן
  choice: kinachokabili nyika
  rationale: Katika maelezo ya kijiografia, עַל־פְּנֵי inaweza kumaanisha mbele ya au kukabiliana na. “Kinachokabili” huepuka kuongeza mwelekeo maalumu kama mashariki. הַיְשִׁימֹן inaweza kueleweka kuwa nyika au jina la eneo, Yeshimoni; maana nyingine imehifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Majina yametoholewa kwa maumbo yanayotambulika: Zifu/Wazifi, Gibea, Hakila, na Yeshimoni. Swali la balagha na utata wa usemi wa mahali vimehifadhiwa.'
