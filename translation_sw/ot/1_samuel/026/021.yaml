source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ שָׁא֨וּל חָטָ֜אתִי שׁ֣וּב בְּנִֽ/י דָוִ֗ד כִּ֠י לֹֽא אָרַ֤ע לְ/ךָ֙ ע֔וֹד תַּ֠חַת אֲשֶׁ֨ר יָקְרָ֥ה נַפְשִׁ֛/י בְּ/עֵינֶ֖י/ךָ הַ/יּ֣וֹם הַ/זֶּ֑ה הִנֵּ֥ה הִסְכַּ֛לְתִּי וָ/אֶשְׁגֶּ֖ה הַרְבֵּ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/021.yaml
  text: Then Saul said[a], “I have sinned. Return, my son David, for I will not harm you again, because my life was precious in your eyes this day. Look[b], I have acted foolishly and have gone badly astray.”
translation:
  language: sw
  text: Ndipo Sauli akasema, “Nimetenda dhambi. Rudi, mwanangu Daudi, kwa maana sitakudhuru tena, kwa sababu maisha yangu yalikuwa ya thamani machoni pako leo hii.[a] Tazama, nimetenda kipumbavu, nami nimekosea vibaya sana.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi yangu ilikuwa ya thamani machoni pako.” Hapa “nafsi” (נֶפֶשׁ) inamaanisha maisha au mtu wa Sauli katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Au, “nami nimeenda kombo sana kabisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: Nimetenda dhambi
  rationale: Kauli timilifu ya nafsi ya kwanza inaonyesha ungamo la moja kwa moja la kosa; wakati timilifu wa Kiswahili unaunganisha tendo lililopita na ungamo la sasa.
- source_word: שׁוּב
  choice: Rudi
  rationale: Amri hii inahifadhi mwito wa moja kwa moja bila kuongeza mahali ambapo Daudi anapaswa kurudi.
- source_word: בְּנִי דָוִד
  choice: mwanangu Daudi
  rationale: Inahifadhi namna ya Sauli ya kumwita Daudi kwa lugha ya uhusiano pamoja na jina lake.
- source_word: לֹא אָרַע לְךָ עוֹד
  choice: sitakudhuru tena
  rationale: Hifili ya רעע hapa humaanisha kumtendea mtu madhara; ‘sitakudhuru’ ni Kiswahili cha sasa, wazi na cha asili.
- source_word: תַּחַת אֲשֶׁר
  choice: kwa sababu
  rationale: Katika muktadha huu kirai kinaonyesha sababu ya ahadi ya Sauli.
- source_word: יָקְרָה נַפְשִׁי בְּעֵינֶיךָ
  choice: maisha yangu yalikuwa ya thamani machoni pako
  rationale: נֶפֶשׁ humaanisha uhai wa Sauli katika simulizi hili, naye Daudi ameuhifadhi; taswira ya Kiebrania ya kuwa wa thamani machoni pa mtu imehifadhiwa.
- source_word: הַיּוֹם הַזֶּה
  choice: leo hii
  rationale: Ni usemi wa kawaida wa Kiswahili unaodumisha msisitizo wa ‘siku hii’.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni kiashiria cha hotuba kinachovuta fikira kwenye ungamo linalofuata, huku kikidumisha hadhi ya lugha.
- source_word: הִסְכַּלְתִּי
  choice: nimetenda kipumbavu
  rationale: Kitenzi hapa kinaeleza kutenda kwa upumbavu, si ukosefu wa akili pekee.
- source_word: וָאֶשְׁגֶּה הַרְבֵּה מְאֹד
  choice: nami nimekosea vibaya sana
  rationale: שגה huonyesha kukosea au kwenda kombo, na viimarishi הַרְבֵּה מְאֹד vinaonyeshwa kwa ‘vibaya sana’ bila kugeuza ungamo kuwa kosa dogo tu.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika ungamo la Sauli
  choice: maisha yangu
  alternative: nafsi yangu
  rationale: Katika simulizi hili Daudi ameacha kumuua Sauli, kwa hiyo neno linarejelea uhai au mtu mwenyewe. Tafsiri hii haingizi dai la ziada kuhusu asili ya nafsi.
- issue: Nguvu ya שגה katika ungamo la Sauli
  choice: nimekosea vibaya sana
  alternative: nimepotoka sana kabisa
  rationale: ‘Nimekosea’ huhifadhi uwezekano wa maana ya kufanya kosa au kwenda kombo, bila kulazimisha maana maalumu ya uasi wa kidini ambayo muktadha haulazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo wa Kiebrania umehifadhiwa pale unapobaki wa asili katika Kiswahili, huku misemo isiyo ya kawaida ikitafsiriwa kwa ulinganifu mwafaka.
