  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יהוָה֙ יָשִׁ֣יב לָ/אִ֔ישׁ אֶת צִדְקָת֖/וֹ וְ/אֶת אֱמֻנָת֑/וֹ אֲשֶׁר֩ נְתָנְ/ךָ֨ יְהוָ֤ה הַ/יּוֹם֙ בְּ/יָ֔ד וְ/לֹ֣א אָבִ֔יתִי לִ/שְׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֥יחַ יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/023.yaml
  text: And Yahweh will repay each man for his righteousness and his faithfulness[a], because Yahweh gave you into my hand today[b], but I was not willing to stretch out my hand against Yahweh’s anointed.
translation:
  language: sw
  text: Yahwe atamlipa kila mtu kadiri ya uadilifu wake na uaminifu wake[a], kwa kuwa leo Yahwe alikutia katika mkono wangu, lakini sikutaka kunyoosha mkono wangu dhidi ya mpakwa mafuta wa Yahwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe atamrudishia kila mtu uadilifu wake na uaminifu wake.”
    reason: Kitenzi cha Kiebrania kina maana ya msingi ya “kurudisha”; katika muktadha huu kinaweza kumaanisha kulipa au kutoa thawabu kulingana na mwenendo.
  - marker: b
    text: Yaani, mfalme ambaye Yahwe alikuwa amemweka wakfu kwa kupakwa mafuta.
    reason: Cheo hiki hapa kinamhusu Sauli kama mfalme, bila kukifanya moja kwa moja kuwa jina la kimasiya.
lexical_decisions:
- source_word: וַיהוָה
  choice: Naye Yahwe
  rationale: Kiunganishi וַ־ kimewasilishwa kwa muunganiko wa kawaida wa hotuba, na jina la agano יְהוָה limetafsiriwa moja kwa moja kuwa “Yahwe.”
- source_word: יָשִׁיב לָאִישׁ
  choice: atamlipa kila mtu
  rationale: Hifili ya שׁוב hapa ina maana ya kurudisha kama malipo au thawabu. “Atamlipa” ni Kiswahili cha kawaida kinachoonyesha matokeo yanayolingana na mwenendo, huku “kila mtu” ikitoa maana ya jumla ya nomino ya umoja אִישׁ.
- source_word: צִדְקָתוֹ
  choice: uadilifu wake
  rationale: Katika muktadha huu צְדָקָה inaelekeza kwa unyofu wa kimaadili ulioonekana katika kitendo cha Daudi. “Uadilifu” ni ya asili na haibani maana kuwa haki ya kimahakama pekee.
- source_word: וְאֶת אֱמֻנָתוֹ
  choice: na uaminifu wake
  rationale: אֱמוּנָה hapa ni uaminifu, kutegemeka, au ushikamanifu unaoonyeshwa kwa matendo. “Uaminifu” linafaa katika jozi hii pamoja na “uadilifu.”
- source_word: אֲשֶׁר נְתָנְךָ יְהוָה הַיּוֹם בְּיָד
  choice: kwa kuwa leo Yahwe alikutia mkononi mwangu
  rationale: Kishazi hiki kinaeleza nafasi ambayo Daudi alipata ya kumdhuru Sauli. “Kwa kuwa” linaonyesha nguvu ya maelezo ya אֲשֶׁר, na “mkononi mwangu” linahifadhi taswira ya Kiebrania huku nafsi ya kwanza ikitokana wazi na muktadha.
- source_word: וְלֹא אָבִיתִי
  choice: lakini sikutaka
  rationale: אבה katika ukanushi huonyesha kutokuwa tayari au kukataa. “Sikutaka” linadumisha tofauti kati ya nafasi aliyopewa Daudi na kujizuia kwake bila kuongeza nguvu isiyolazimu ya maana.
- source_word: לִשְׁלֹחַ יָדִי
  choice: kuunyoosha mkono wangu
  rationale: Nahau hii humaanisha kumshambulia au kumdhuru mtu. Tafsiri inahifadhi taswira halisi ya mkono na bado inaeleweka katika Kiswahili.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: dhidi ya mpakwa-mafuta wa Yahwe
  rationale: מָשִׁיחַ ni mtu aliyepakwa mafuta. Hapa ni cheo cha kifalme cha Sauli, si matumizi ya moja kwa moja ya jina “Masihi.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יְהוָה. “Yahwe” linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya jumla ya אִישׁ ya umoja wa kiume
  choice: kila mtu
  alternative: kila mwanamume
  rationale: Katika kauli hii אִישׁ ina matumizi ya jumla kwa kila mmoja anayelipwa kulingana na mwenendo wake. Kiswahili “mtu” ni la kawaida na haliondoi dai lolote la kitheolojia katika muktadha.
- issue: Cheo מְשִׁיחַ kinapotumiwa kwa Sauli
  choice: mpakwa-mafuta wa Yahwe
  alternative: Masihi wa Yahwe
  rationale: Muktadha unamtaja Sauli kama mfalme aliyewekwa wakfu kwa kupakwa mafuta. “Masihi” lingeweza kuingiza umahususi wa baadaye ambao kifungu hiki hakilazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaosomeka kwa urahisi. Taswira muhimu za Kiebrania—kutia mtu mkononi na kuunyoosha mkono dhidi yake—zimehifadhiwa bila kuficha maana ya muktadha.
