base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/016.yaml
  text: This thing that you have done is not good. As Yahweh lives[a], you are sons of death, because you did not keep watch over your master, over Yahweh’s anointed. And now, look—where are the king’s spear and the water jar that were by his head?
translation:
  language: sw
  text: 'Jambo hili ulilofanya si jema. Kama Yahweh aishivyo, mnastahili kufa[a], kwa sababu hamkumlinda bwana wenu, mtiwa mafuta wa Yahweh. Sasa tazama: mkuki wa mfalme uko wapi, na gudulia la maji lililokuwa karibu na kichwa chake?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maneno halisi, Kiebrania kinasema, “ninyi ni wana wa mauti,” nahau inayomaanisha kwamba wanawajibika kwa adhabu ya kifo au wanastahili kufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא טוֹב הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָ
  choice: Jambo hili ulilofanya si jema
  rationale: Inafuata tathmini ya Kiebrania ‘si jema’ bila kuiongeza kuwa ‘ni ovu,’ huku ikitumia mpangilio wa kawaida wa Kiswahili.
- source_word: חַי יְהוָה
  choice: Kama Yahweh aishivyo
  rationale: Ni namna ya Kiswahili yenye hadhi ya kuhifadhi kiapo cha Kiebrania na jina la agano Yahweh.
- source_word: בְּנֵי מָוֶת אַתֶּם
  choice: mnastahili kufa[a]
  rationale: Nahau ya Kiebrania, neno kwa neno ‘ninyi ni wana wa mauti,’ ina maana ya kuwajibika kwa adhabu ya kifo au kustahili kufa; tafsiri hii inaeleweka kwa msomaji wa sasa, na tanbihi inahifadhi picha halisi.
- source_word: שְׁמַרְתֶּם עַל
  choice: hamkumlinda
  rationale: Katika mazingira ya kijeshi, kitenzi kinaeleza jukumu la ulinzi na uangalizi wa kinga.
- source_word: אֲדֹנֵיכֶם
  choice: bwana wenu
  rationale: Hapa neno linamtaja Sauli kama mkuu wao wa kibinadamu; herufi ndogo zinaitofautisha wazi na jina la Mungu.
- source_word: מְשִׁיחַ יְהוָה
  choice: mtiwa-mafuta wa Yahweh
  rationale: Inahifadhi cheo cha kifalme na kitakatifu cha Sauli bila kumtambulisha moja kwa moja na Masihi wa baadaye.
- source_word: חֲנִית הַמֶּלֶךְ
  choice: mkuki wa mfalme
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya uhusiano wa umilikaji katika Kiebrania.
- source_word: צַפַּחַת הַמַּיִם
  choice: gudulia la maji
  rationale: ‘Gudulia’ linaeleza chombo cha kubebea maji kinachokusudiwa na neno la Kiebrania, kwa lugha ya Kiswahili iliyo wazi na yenye hadhi.
- source_word: מראשתו
  choice: karibu na kichwa chake
  rationale: Inaonyesha mahali kilipowekwa chombo, yaani upande wa kichwa chake, bila kudokeza kwamba kilikuwa juu ya kichwa chake.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la Mungu; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Cheo מְשִׁיחַ יְהוָה katika muktadha wa kifalme
  choice: mtiwa-mafuta wa Yahweh
  alternative: Masihi wa Yahweh; aliyepakwa mafuta na Yahweh
  rationale: ‘Mtiwa-mafuta’ huhifadhi maana ya cheo cha Sauli kama mfalme aliyewekwa wakfu bila kuingiza maana kamili ya baadaye ya jina ‘Masihi.’
- issue: Nahau בְּנֵי מָוֶת
  choice: mnastahili kufa
  alternative: ninyi ni wana wa mauti
  rationale: Maana yake ya hukumu inaelezwa wazi katika maandishi makuu, huku umbo halisi la nahau likihifadhiwa katika tanbihi ili kutoifanya sentensi ya Kiswahili iwe tata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Umoja ‘ulilofanya’ unamwelekea Abneri, kisha wingi ‘mnastahili’ na ‘hamkumlinda’ unawahusisha Abneri pamoja na walinzi wengine, kama ilivyo katika Kiebrania.
