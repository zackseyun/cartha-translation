base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/020.yaml
  text: So now[a], do not let my blood fall to the ground away from the presence of Yahweh, for the king of Israel has come out to seek a single flea[b], as one hunts a partridge in the mountains.
translation:
  language: sw
  text: Basi sasa, damu yangu isimwagike ardhini mbali na uwepo wa Yahweh[a], kwa maana mfalme wa Israeli ametoka kumtafuta kiroboto kimoja, kama mtu awindavyo kwale milimani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa neno kwa neno, “mbali na mbele ya uso wa Yahweh.”
    reason: Nahau ya Kiebrania inaweza kuonyeshwa kwa namna ya moja kwa moja zaidi, ingawa hiyo si kauli ya kawaida katika Kiswahili.
lexical_decisions:
- source_word: דָּמִי
  choice: damu yangu
  rationale: Inahifadhi picha halisi ya damu na maana ya kifo cha jeuri pamoja na hatia ya damu; ‘uhai wangu’ ingeondoa picha hiyo.
- source_word: אַל יִפֹּל ... אַרְצָה
  choice: isimwagike ardhini
  rationale: Kiswahili kwa kawaida husema damu ‘inamwagika’ badala ya ‘inaanguka’; uchaguzi huu unadumisha picha ya damu kufika ardhini kwa lugha ya kawaida.
- source_word: מִנֶּגֶד פְּנֵי יְהוָה
  choice: mbali na uwepo wa Yahweh
  rationale: Unatoa kwa Kiswahili cha kawaida wazo la kuwa mbali na uso au uwepo wa Yahweh, bila kulazimisha kauli ngumu ya neno kwa neno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetolewa kama jina binafsi ‘Yahweh’, si kubadilishwa kuwa cheo.
- source_word: יָצָא ... לְבַקֵּשׁ
  choice: ametoka kumtafuta
  rationale: Inahifadhi mwendo wa mfalme kuondoka kwa kusudi la kumtafuta Daudi na ni kauli ya asili katika Kiswahili.
- source_word: פַּרְעֹשׁ אֶחָד
  choice: kiroboto mmoja
  rationale: Inadumisha sitiari ya Daudi kujishusha na mkazo wa neno ‘mmoja’.
- source_word: הַקֹּרֵא
  choice: kware
  rationale: Hili ndilo jina la ndege linalotumiwa kwa kawaida katika mapokeo ya tafsiri ya kifungu hiki; linafaa katika mlinganisho wa uwindaji, ingawa utambulisho kamili wa ndege haujulikani kwa hakika.
- source_word: יִרְדֹּף ... בֶּהָרִים
  choice: kama mtu awindavyo ... milimani
  rationale: Inatoa kwa Kiswahili cha kawaida mlinganisho wa kumfukuza ndege ili kumwinda na kuhifadhi mazingira ya milimani.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; ‘Yahweh’ hulihifadhi badala ya kuliwakilisha kwa cheo.
- issue: Maana ya kuwa mbali na פני יהוה
  choice: mbali na uwepo wa Yahweh
  alternative: mbali na mbele za uso wa Yahweh
  rationale: ‘Uwepo’ ni Kiswahili cha asili kwa nahau ya Kiebrania inayotaja uso wa Yahweh, huku wazo la umbali wa mahali na uhusiano likiachwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi na sitiari za damu, kiroboto, na uwindaji zimehifadhiwa bila ugumu usio wa lazima.
