base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/006.yaml
  text: Then David answered and said to Ahimelech the Hittite and to Abishai son of Zeruiah[a], Joab’s brother, “Who will go down with me to Saul, to the camp?” And Abishai said, “I will go down with you.”
translation:
  language: sw
  text: Ndipo Daudi akajibu akasema kwa Ahimeleki Mhiti na kwa Abishai mwana wa Seruia, ndugu ya Yoabu, “Ni nani atakayeshuka pamoja nami kwa Sauli, kwenye kambi[a]?” Abishai akasema, “Mimi nitashuka pamoja nawe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa Kiebrania: “kwa Sauli, kwenye kambi.” Kiebrania hurudia kihusishi kabla ya “Sauli” na “kambi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן דָּוִד וַיֹּאמֶר
  choice: Ndipo Daudi akajibu, akawaambia
  rationale: Huhifadhi fomula ya kisimulizi ‘akajibu na kusema’ huku ‘akawaambia’ ikionyesha kwa Kiswahili cha kawaida kwamba maneno yalielekezwa kwa watu wawili waliotajwa.
- source_word: אֲחִימֶלֶךְ הַחִתִּי
  choice: Ahimeleki Mhiti
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili, na utambulisho wa kikabila umetafsiriwa kwa namna ya kawaida.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: Abishai mwana wa Seruia, ndugu yake Yoabu
  rationale: Huhifadhi mahusiano yote mawili ya kifamilia kwa mpangilio wa Kiebrania na kwa Kiswahili kinachoeleweka.
- source_word: מִי יֵרֵד אִתִּי
  choice: Ni nani atakayeshuka pamoja nami
  rationale: ‘Atakayeshuka’ huhifadhi maana ya mwelekeo ya ירד, na ‘pamoja nami’ ni tafsiri ya kawaida ya אִתִּי.
- source_word: אֶל שָׁאוּל אֶל הַמַּחֲנֶה
  choice: kwenda kwa Sauli kambini[a]
  rationale: Hutoa maana ya kwamba Daudi anakusudia kumfikia Sauli akiwa kambini kwa Kiswahili cha kawaida; tanbihi huhifadhi taarifa kuhusu urudiaji wa kihusishi katika Kiebrania.
- source_word: הַמַּחֲנֶה
  choice: kambini
  rationale: ‘Kambi’ ni neno la kawaida na la sasa; hali ya mahali ‘kambini’ inafaa katika sentensi hii.
- source_word: אֲנִי אֵרֵד עִמָּךְ
  choice: Mimi nitashuka pamoja nawe
  rationale: Huhifadhi kitenzi kilekile cha mwelekeo kilichotumiwa katika swali la Daudi na mkazo wa kiwakilishi אֲנִי.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi, na unaoeleweka kwa msomaji wa kawaida. Majina yametoholewa kwa mazoea ya Kiswahili, huku mwelekeo wa ‘kushuka’ na utambulisho wa kifamilia ukihifadhiwa.
