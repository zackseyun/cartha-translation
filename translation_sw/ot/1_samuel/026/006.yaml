  to: Ndipo Daudi akajibu akasema kwa Ahimeleki Mhiti na kwa Abishai mwana wa Seruia, ndugu ya Yoabu, “Ni nani atakayeshuka pamoja nami kwa Sauli, kwenye kambi[a]?” Abishai akasema, “Mimi nitashuka pamoja nawe.”
