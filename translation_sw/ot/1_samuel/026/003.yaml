base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/003.yaml
  text: And Saul camped on the hill of Hachilah[a], which is opposite Jeshimon, by the road. But David was staying in the wilderness, and he saw that Saul had come after him into the wilderness.
translation:
  language: sw
  text: Sauli akapiga kambi kwenye kilima cha Hakila, kilichoelekeana na Yeshimoni[a], kando ya barabara. Lakini Daudi alikuwa akikaa nyikani, naye akaona kwamba Sauli alikuwa amekuja nyikani akimfuata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yeshimoni pia linaweza kueleweka kama neno la kawaida lenye maana ya “eneo la ukiwa” au “jangwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַן
  choice: akapiga kambi
  rationale: Katika muktadha wa safari au jeshi, חנה humaanisha kuweka au kupiga kambi; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: kwenye kilima cha Hakila
  rationale: גִּבְעָה ni ‘kilima,’ huku חֲכִילָה ikiwa jina la mahali; nomino ya kawaida imetafsiriwa na jina limetoholewa.
- source_word: אֲשֶׁר עַל פְּנֵי הַיְשִׁימֹן
  choice: kilichoelekeana na Yeshimoni
  rationale: עַל־פְּנֵי hapa huonyesha mahali panapokabiliana au kuelekeana na pengine; Yeshimoni limehifadhiwa kama jina la kijiografia huku uwezekano wa maana ya kawaida ukielezwa katika tanbihi.
- source_word: עַל הַדָּרֶךְ
  choice: kando ya barabara
  rationale: Katika maelezo haya ya mahali, עַל huonyesha ukaribu; ‘kando ya barabara’ huepuka kudokeza kwamba kambi ilikuwa katikati ya barabara.
- source_word: יֹשֵׁב
  choice: alikuwa akikaa
  rationale: Kitenzi kishirikishi cha ישב kina hali endelevu na katika muktadha huu humaanisha kukaa au kuwepo mahali fulani.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: מִדְבָּר ni eneo la pori au lisilokaliwa sana, si lazima jangwa la mchanga; ‘nyikani’ ni tafsiri fupi na ya asili.
- source_word: וַיַּרְא כִּי בָא שָׁאוּל אַחֲרָיו
  choice: naye akaona kwamba Sauli alikuwa amekuja ... akimfuata
  rationale: Tafsiri inahifadhi kitenzi cha kuona na kuja, pamoja na maana ya אַחֲרָיו ya kumfuata, bila kuibadili moja kwa moja kuwa istilahi ya kijeshi ya kumwinda.
- source_word: הַמִּדְבָּרָה
  choice: nyikani
  rationale: Kiambishi cha mwelekeo -ָה kinaonyesha mwendo kuelekea au kuingia nyikani; katika Kiswahili, kitenzi ‘amekuja’ pamoja na ‘nyikani’ huwasilisha mwelekeo huo kwa kawaida.
