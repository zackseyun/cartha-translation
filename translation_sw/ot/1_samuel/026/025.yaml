base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/025.yaml
  text: Then Saul said to David[a], “Blessed are you, my son David. You will surely do, and you will surely prevail.” Then David went on his way, and Saul returned to his place.
translation:
  language: sw
  text: Kisha Sauli akamwambia Daudi, “Umebarikiwa, mwanangu Daudi. Hakika utatenda, na hakika utafanikiwa.”[a] Kisha Daudi akaenda zake, naye Sauli akarudi mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa neno halisi ni, “kutenda utatenda, na kuweza utaweza.” Miundo hii miwili inasisitiza uhakika wa mafanikio ya Daudi ya wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ אַתָּה
  choice: Umebarikiwa
  rationale: Huhifadhi nguvu ya tamko la hali ya kubarikiwa, badala ya kuligeuza kuwa ombi au tamanio la baraka.
- source_word: בְּנִי דָוִד
  choice: mwanangu Daudi
  rationale: Huhifadhi namna ya kifamilia au ya kiulezi ambayo Sauli anatumia kumwita Daudi, huku ikibaki ya kawaida katika Kiswahili.
- source_word: גַּם עָשֹׂה תַעֲשֶׂה
  choice: Hakika utatenda
  rationale: Muundo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi cha wakati ujao unasisitiza uhakika. Tafsiri haiongezi kitu kisichotajwa, kama vile ‘mambo makuu.’
- source_word: וְגַם יָכֹל תּוּכָל
  choice: na hakika utafanikiwa
  rationale: Muundo wa msisitizo una maana halisi ya ‘kuweza, utaweza’; katika muktadha huu unaashiria kufaulu au kushinda, hivyo ‘utafanikiwa’ ni Kiswahili cha kawaida kinacholeta maana hiyo.
- source_word: וַיֵּלֶךְ דָּוִד לְדַרְכּוֹ
  choice: Kisha Daudi akaenda zake
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kuondoka kwa Daudi bila tafsiri ngumu ya neno kwa neno.
- source_word: וְשָׁאוּל שָׁב לִמְקוֹמוֹ
  choice: naye Sauli akarudi mahali pake
  rationale: Hufuata kwa usahihi rejeo lisilo maalumu la Kiebrania; halibadili ‘mahali pake’ kuwa ‘nyumbani.’
