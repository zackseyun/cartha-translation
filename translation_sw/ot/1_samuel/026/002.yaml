base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/002.yaml
  text: Then Saul arose and went down to the wilderness of Ziph[a], and with him were three thousand chosen men of Israel, to seek David in the wilderness of Ziph.
translation:
  language: sw
  text: Ndipo Sauli akaondoka, akashuka kwenda kwenye nyika ya Zifu; pamoja naye walikuwa wanaume elfu tatu wateule wa Israeli, ili kumtafuta Daudi katika nyika ya Zifu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: akaondoka
  rationale: Katika simulizi, kitenzi קום mara nyingi huanzisha hatua ya makusudi. “Akaondoka” huwasilisha maana hiyo kwa Kiswahili cha kawaida kuliko tafsiri ya moja kwa moja “akainuka.”
- source_word: וַיֵּרֶד
  choice: akashuka
  rationale: Huhifadhi maana ya mwelekeo ya ירד na inafaa kwa safari kuelekea eneo la nyika.
- source_word: מִדְבַּר זִיף
  choice: nyika ya Zifu
  rationale: מִדְבָּר ni eneo kame au lisilokaliwa sana, si lazima jangwa la mchanga; “nyika” ni neno sahihi na la kawaida katika muktadha huu.
- source_word: וְאִתּוֹ
  choice: pamoja naye
  rationale: Hutoa maana ya kuandamana kwa uwazi na huhifadhi nafasi iliyotangulizwa ya kishazi hiki katika Kiebrania.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: wanaume elfu tatu
  rationale: Hufuata maana ya msingi ya “watu/wanaume elfu tatu” bila kuongeza wazi neno “askari,” ingawa muktadha ni wa kijeshi.
- source_word: בְּחוּרֵי יִשְׂרָאֵל
  choice: wateule kutoka Israeli
  rationale: Neno בְּחוּרֵי hapa humaanisha watu waliochaguliwa, yaani kikosi bora. “Wateule kutoka Israeli” ni fupi, asili, na huhifadhi wazo la kuchaguliwa.
- source_word: לְבַקֵּשׁ
  choice: ili kumtafuta
  rationale: בקש katika muktadha huu ni kutafuta mtu kwa kusudi la kumpata; “kumtafuta” ni Kiswahili cha kawaida na sahihi.
- source_word: דָּוִד
  choice: Daudi
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
