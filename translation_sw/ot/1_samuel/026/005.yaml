base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/005.yaml
  text: Then David arose and came to the place where Saul had camped[a], and David saw the place where Saul lay, and Abner son of Ner, the commander of his army. Saul was lying within the encampment, and the people were camped around him.
translation:
  language: sw
  text: Ndipo Daudi akainuka, akaenda mahali ambapo Sauli alikuwa amepiga kambi. Daudi akaona mahali ambapo Sauli alikuwa amelala, na Abneri mwana wa Neri, mkuu wa jeshi lake. Sauli alikuwa amelala katikati ya kambi[a], nao watu walikuwa wamepiga kambi kumzunguka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya moja kwa moja, Kiebrania kinasema “katika duara”; huenda kikimaanisha safu ya ndani au sehemu ya katikati ya kambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Kitenzi קום katika mfululizo wa simulizi kinaonyesha tendo linalofuata; “akainuka” huhifadhi maana ya msingi na mtindo wenye hadhi.
- source_word: וַיָּבֹא אֶל־הַמָּקוֹם
  choice: akaenda mahali
  rationale: בוא pamoja na אֶל huonyesha mwendo kuelekea mahali. Katika mtazamo wa simulizi wa Kiswahili, “akaenda mahali” ni ya kawaida kuliko “akaja mahali” bila kupoteza maana.
- source_word: חָנָה
  choice: alikuwa amepiga kambi
  rationale: Kauli hii inaeleza tendo lililotangulia kufika kwa Daudi; hali timilifu “alikuwa amepiga kambi” huonyesha mpangilio huo kwa kawaida.
- source_word: וַיַּרְא ... אֶת־הַמָּקוֹם
  choice: akaona mahali
  rationale: ראה hapa ni kuona au kutambua kwa macho; “akaona” ndiyo tafsiri ya moja kwa moja na ya kawaida.
- source_word: שָׁכַב ... שֹׁכֵב
  choice: alikuwa amelala ... alikuwa amelala
  rationale: שכב huonyesha hali ya kulala au kujilaza. Kiswahili cha kawaida hutumia “alikuwa amelala” katika vifungu vyote viwili, huku muktadha ukitofautisha mahali alipoonekana na maelezo ya hali yake.
- source_word: וְאַבְנֵר בֶּן־נֵר שַׂר צְבָאוֹ
  choice: na Abneri mwana wa Neri, mkuu wa jeshi lake
  rationale: Muundo wa uratibu wa Kiebrania umehifadhiwa bila kuongeza “pamoja na,” jambo ambalo lingeweza kuamua kimyakimya uhusiano wa kisintaksia wenye utata kati ya mahali pa Sauli na Abneri.
- source_word: בַּמַּעְגָּל
  choice: katikati ya kambi
  rationale: מַעְגָּל kimsingi hudokeza duara au mpangilio wa mviringo. Katika muktadha huu inaelekea kumaanisha eneo la ndani au la kati la kambi; “katikati ya kambi” hutoa picha inayoeleweka, huku tanbihi ikihifadhi maana halisi zaidi.
- source_word: חֹנִים סְבִיבֹתָיו
  choice: walikuwa wamepiga kambi kumzunguka
  rationale: Kirai hiki kinaeleza wanajeshi waliokuwa wamekaa kambini pande zote za Sauli. “Kumzunguka” ni Kiswahili cha kawaida na huhifadhi maelezo ya nafasi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na hadhi. Uratibu unaomhusu Abneri umeachwa karibu na muundo wa Kiebrania ili kutotatua kimyakimya utata wake; tanbihi imewekwa kwenye tafsiri ya בַּמַּעְגָּל, ambako maelezo hayo yanahusika.
