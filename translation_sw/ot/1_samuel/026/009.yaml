base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/009.yaml
  text: But David said to Abishai[a], “Do not destroy him, for who can stretch out his hand against Yahweh’s anointed and remain guiltless?”
translation:
  language: sw
  text: Lakini Daudi akamwambia Abishai, “Usimwangamize, kwa maana ni nani anaweza kunyoosha mkono wake dhidi ya mpakwa mafuta wa Yahwe[a] na kubaki bila hatia?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “mpakwa mafuta” linatokana na mzizi uleule wa neno “Masihi.” Hapa linamtaja Sauli kama mfalme aliyetiwa mafuta na Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini Daudi akamwambia
  rationale: Kiunganishi cha simulizi kinaendeleza tukio, huku “Lakini” kikionyesha kwamba Daudi anapinga pendekezo la Abishai la kumuua Sauli.
- source_word: אַל תַּשְׁחִיתֵהוּ
  choice: Usimwangamize
  rationale: Hifili ya שׁחת ina maana ya kuangamiza au kuharibu. Katika muktadha huu inahusu kumuua Sauli, lakini “usimwangamize” inadumisha upana wa kitenzi cha Kiebrania.
- source_word: שָׁלַח יָדוֹ
  choice: kunyoosha mkono wake dhidi ya
  rationale: Hii ni nahau ya Kiebrania ya kuchukua hatua dhidi ya mtu, mara nyingi kwa nguvu. Tafsiri hii inadumisha taswira ya chanzo bila kuficha maana yake ya uhasama.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: dhidi ya aliyetiwa mafuta na Yahwe
  rationale: מָשִׁיחַ hapa humtaja Sauli kama mfalme aliyewekwa wakfu kwa kutiwa mafuta na Yahwe. Usemi huu unadumisha maana ya kihistoria na uhusiano wa kileksika na neno “Masihi.”
- source_word: וְנִקָּה
  choice: na kubaki bila hatia
  rationale: Kitenzi נקה kinaonyesha kuwa huru na hatia au wajibu wa adhabu. “Kubaki bila hatia” inadumisha uzito wa kimaadili wa swali la balagha bila kuifupisha maana kuwa kutoadhibiwa tu.
theological_decisions:
- issue: Tafsiri ya מְשִׁיחַ inapomtaja Sauli
  choice: aliyetiwa mafuta na Yahwe
  alternative: Masihi wa Yahwe
  rationale: Katika muktadha huu neno hilo linamtaja Sauli kama mfalme aliyetiwa mafuta, wala halitoi moja kwa moja dai la kimasihi kuhusu Masihi ajaye. Tanbihi inadumisha uhusiano wa maneno bila kuingiza maana ya baadaye ndani ya kifungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Nahau ya Kiebrania imedumishwa kwa namna inayoeleweka katika Kiswahili, na jina la Mungu limetafsiriwa “Yahwe.”
