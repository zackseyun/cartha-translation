  yaml_path: translation/ot/1_samuel/026/022.yaml
  text: David answered and said[a], “Here is the king’s spear[b]. Let one of the young men come over and take it.”
translation:
  language: sw
  text: Daudi akajibu, akasema, “Huu hapa mkuki wa mfalme. Mmoja wa vijana na avuke aje kuuchukua.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: akajibu, akasema
  rationale: Inahifadhi vitenzi vyote viwili vya simulizi ya Kiebrania kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: הִנֵּה
  choice: Huu hapa
  rationale: Inaelekeza uangalifu kwenye mkuki uliopo karibu na Daudi kwa njia ya asili katika Kiswahili.
- source_word: הַחֲנִית הַמֶּלֶךְ
  choice: mkuki wa mfalme
  rationale: “Mkuki” ni neno la kawaida na wazi; muundo wa “wa mfalme” unaonyesha uhusiano wa umiliki kwa ufasaha.
- source_word: וְיַעֲבֹר
  choice: na avuke aje
  rationale: עבר ina maana ya kupita au kuvuka. Katika muktadha huu mtu anatakiwa kuvuka kutoka upande wa Sauli hadi alipo Daudi; “avuke aje” huhifadhi mwendo wa kuvuka na mwelekeo wa kuja.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: Mmoja wa vijana
  rationale: Inahifadhi namba “mmoja” na maana ya msingi ya נַעַר bila kuamua kimya-kimya kwamba lazima wawe watumishi au wahudumu.
- source_word: וְיִקָּחֶהָ
  choice: kuuchukua
  rationale: Kitenzi “chukua” ndicho kisawe cha moja kwa moja; kiambishi “u” kinarejelea mkuki.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo “na avuke aje” unaonyesha kwa kawaida ombi/amri ya nafsi ya tatu na pia huhifadhi maana ya kuvuka iliyomo katika Kiebrania.
