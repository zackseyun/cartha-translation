base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/008.yaml
  text: Then Abishai said to David[a], “God has delivered your enemy into your hand today. So now, please let me pin him to the earth with the spear in one blow[c][b], and I will not strike him a second time.”
translation:
  language: sw
  text: Ndipo Abishai akamwambia Daudi, “Leo Mungu amemtia adui yako mkononi mwako.[a] Basi sasa, tafadhali niruhusu nimchome kwa mkuki hadi ardhini, kwa pigo moja[b][c]; sitampiga mara ya pili.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Leo Mungu amemkabidhi adui yako katika mamlaka yako.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa mkuki na ardhini, mara moja”; maana yake ni kumchoma kwa mkuki hadi mkuki uingie ardhini, kwa pigo moja.
    reason: lexical_alternative
  - marker: c
    text: Au, “nimchome kwa mkuki hadi ardhini.”
    reason: previous_rendering
lexical_decisions:
- source_word: סִגַּר
  choice: amemtia
  rationale: Katika muktadha huu kitenzi kina maana ya kumweka au kumkabidhi mtu chini ya mamlaka ya mwingine; pamoja na ‘mkononi mwako,’ ‘amemtia’ ni Kiswahili cha kawaida kinachohifadhi taswira ya Kiebrania.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Kitenzi cha umoja na muktadha vinaelekeza kwa Mungu wa Israeli.
- source_word: אוֹיִבְךָ
  choice: adui yako
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya nomino yenye kiambishi cha nafsi ya pili umoja.
- source_word: בְּיָדֶךָ
  choice: mkononi mwako
  rationale: Nahau hii humaanisha kuwa chini ya mamlaka ya mtu, lakini taswira ya ‘mkono’ inaeleweka pia katika Kiswahili.
- source_word: אַכֶּנּוּ נָא
  choice: tafadhali niruhusu nimchome
  rationale: Umbo la hiari pamoja na נָא linaonyesha ombi la Abishai. ‘Nimchome’ linafaa kwa tendo la kupiga kwa mkuki katika muktadha huu.
- source_word: בַּחֲנִית
  choice: kwa mkuki
  rationale: Hutaja kifaa kilichotumiwa; Kiswahili hakihitaji kutofautisha kwa lazima kati ya ‘mkuki’ na ‘ule mkuki’ hapa.
- source_word: וּבָאָרֶץ
  choice: mpaka ardhini
  rationale: Pamoja na tendo la kumchoma kwa mkuki, maneno haya yanaonyesha kumdunga hadi akafikishwa au akabanwa ardhini.
- source_word: פַּעַם אַחַת
  choice: kwa pigo moja
  rationale: Katika muktadha huu kifungu kinaonyesha kwamba tendo hilo lingekamilishwa kwa mpigo mmoja.
- source_word: וְלֹא אֶשְׁנֶה לוֹ
  choice: sitampiga mara ya pili
  rationale: Kitenzi ‘kurudia’ kinaacha tendo likieleweka kutokana na muktadha; kulitaja kama ‘kumpiga’ kunafanya Kiswahili kiwe wazi bila kubadili maana.
- source_word: וַיֹּאמֶר ... אֶל
  choice: Ndipo Abishai akamwambia Daudi
  rationale: ‘Ndipo’ na umbo la masimulizi ‘akamwambia’ vinaendeleza mtiririko wa simulizi kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Utendaji wa Mungu katika hali ya Sauli kuwa hatarini
  choice: Leo Mungu amemtia adui yako mkononi mwako
  alternative: Leo Mungu amemkabidhi adui yako katika mamlaka yako
  rationale: Haya ni maelezo ya Abishai kuhusu utendaji wa Mungu, si kauli ya msimulizi inayokubali pendekezo lake la kumuua Sauli. Tafsiri inadumisha mvutano huo bila kuongeza kibali au hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mkononi mwako’ huhifadhi nahau ya chanzo, huku tanbihi ikifafanua maana ya kuwa chini ya mamlaka.
