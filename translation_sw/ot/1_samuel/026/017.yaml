  text: וַ/יַּכֵּ֤ר שָׁאוּל֙ אֶת ק֣וֹל דָּוִ֔ד וַ/יֹּ֕אמֶר הֲ/קוֹלְ/ךָ֥ זֶ֖ה בְּנִ֣/י דָוִ֑ד וַ/יֹּ֣אמֶר דָּוִ֔ד קוֹלִ֖/י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/017.yaml
  text: Then Saul recognized David’s voice and said, “Is this your voice, my son David?” And David said, “It is my voice, my lord the king.”
translation:
  language: sw
  text: Ndipo Sauli akaitambua sauti ya Daudi, akasema, “Je, hii ni sauti yako, mwanangu Daudi?” Daudi akasema, “Ni sauti yangu, bwana wangu mfalme.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: akaitambua
  rationale: Kitenzi נכר katika muktadha huu kinaonyesha kutambua kwa kusikia; Sauli anatambua kuwa sauti hiyo ni ya Daudi.
- source_word: קוֹל
  choice: sauti
  rationale: Katika muktadha wa mazungumzo, קוֹל humaanisha sauti ya msemaji, wala si sauti kwa maana pana tu.
- source_word: הֲקוֹלְךָ זֶה
  choice: Je, hii ni sauti yako
  rationale: Muundo huu unabaki karibu na swali la Kiebrania huku ukiwa wa kawaida na wazi katika Kiswahili sanifu.
- source_word: בְּנִי
  choice: mwanangu
  rationale: Neno hili linahifadhi lugha ya kifamilia ambayo Sauli anamtumia Daudi na mvutano wake katika simulizi licha ya uhasama wao.
- source_word: קוֹלִי
  choice: Ni sauti yangu
  rationale: Jibu hili linahifadhi neno halisi 'sauti' na kuongeza kishirikishi kinachoeleweka katika Kiswahili.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: bwana wangu mfalme
  rationale: Hapa אֲדֹנִי ni heshima kwa mtawala wa kibinadamu. Tafsiri hii inahifadhi heshima pamoja na cheo cha kifalme bila kulifanya jina la Mungu.
- source_word: דָּוִד / שָׁאוּל
  choice: Daudi / Sauli
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Kauli ya kifamilia בְּנִי katika maneno ya Sauli
  choice: mwanangu
  alternative: mtoto wangu
  rationale: “Mwanangu” ni tafsiri ya kawaida na yenye heshima inayohifadhi uzito wa uhusiano na mvutano wa simulizi bila kufifisha rejeo la kiume.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Marudio ya neno “sauti” yamehifadhiwa kwa sababu yanaakisi marudio ya makusudi katika Kiebrania.
