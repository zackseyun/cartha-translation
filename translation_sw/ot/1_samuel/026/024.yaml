id: 1SA.26.24
reference: 1 Samuel 26:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הִנֵּ֗ה כַּ/אֲשֶׁ֨ר גָּדְלָ֧ה נַפְשְׁ/ךָ֛ הַ/יּ֥וֹם הַ/זֶּ֖ה בְּ/עֵינָ֑/י כֵּ֣ן תִּגְדַּ֤ל נַפְשִׁ/י֙ בְּ/עֵינֵ֣י יְהוָ֔ה וְ/יַצִּלֵ֖/נִי מִ/כָּל צָרָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/024.yaml
  text: And look[a], just as your life was precious in my eyes this day, so may my life be precious in the eyes of Yahweh, and may he deliver me from all distress.
translation:
  language: sw
  text: Na tazama, kama vile maisha yako yalivyokuwa ya thamani[a] machoni pangu leo, vivyo hivyo maisha yangu na yawe ya thamani machoni pa Yahweh, naye aniokoe na kila dhiki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama vile maisha yako yalivyokuwa makubwa machoni pangu leo, vivyo hivyo maisha yangu na yawe makubwa machoni pa Yahweh.” Nahau ya Kiebrania hutumia “makubwa” kuonyesha thamani kubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Na tazama
  rationale: Huelekeza kwa msisitizo fikira za msikilizaji kwenye yanayofuata; “Na tazama” ni ya heshima na inaeleweka katika Kiswahili cha sasa.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: kama vile ... vivyo hivyo
  rationale: Muundo huu unaonyesha wazi ulinganisho kati ya Daudi kuthamini maisha ya Sauli na ombi lake kwa Yahweh.
- source_word: גָּדְלָה ... נַפְשְׁךָ ... בְּעֵינַי
  choice: maisha yako yalivyokuwa ya thamani machoni pangu
  rationale: Ingawa kitenzi kwa msingi humaanisha “kuwa makubwa,” hapa nahau inaonyesha thamani kubwa; muktadha ni Daudi kutoyachukua maisha ya Sauli.
- source_word: נֶפֶשׁ
  choice: maisha
  rationale: Katika muktadha wa kuachwa hai na kuokolewa kutoka hatarini, neno hili linamaanisha uhai au maisha, si nafsi isiyo ya kimwili.
- source_word: הַיּוֹם הַזֶּה
  choice: leo
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya msisitizo wa wakati katika Kiswahili cha kisasa.
- source_word: תִּגְדַּל ... נַפְשִׁי ... בְּעֵינֵי יְהוָה
  choice: maisha yangu na yawe ya thamani machoni pa Yahweh
  rationale: Umbo la kitenzi linaeleweka kama tamanio au ombi; kurudia wazo la “ya thamani” kunadumisha ulinganisho wa Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano lililoandikwa kwa Tetragramatoni linatunzwa kama jina binafsi.
- source_word: וְיַצִּלֵנִי
  choice: naye aniokoe
  rationale: Hifili ya נצל humaanisha kuokoa au kunusuru; “aniokoe” ni ya asili na inafaa sauti ya ombi.
- source_word: מִכָּל צָרָה
  choice: kutoka katika kila taabu
  rationale: צָרָה linaweza kumaanisha taabu, dhiki, au shida; “kila taabu” huhifadhi upana wa usemi.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya Daudi kuthamini maisha ya Sauli na ombi lake kwa Mungu
  choice: Kuhifadhi ulinganisho kama tamanio au ombi, bila kuufanya kuwa dai la malipo ya lazima
  alternative: Kutafsiri kana kwamba Yahweh ana wajibu wa kumlipa Daudi kwa tendo lake
  rationale: Kitenzi cha pili kinaweza kutoa tamanio katika muktadha; matini haifundishi wazi mfumo wa malipo ya kiotomatiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Machoni pangu/machoni pa Yahweh” kinahifadhi taswira ya Kiebrania, huku “ya thamani” kikitoa maana ya nahau kwa uwazi.
