  text: Then David crossed over to the other side and stood on the top of the mountain at a distance[a]; there was a great space between them.
translation:
  language: sw
  text: Kisha Daudi akavuka kwenda upande mwingine, akasimama juu ya kilele cha mlima akiwa mbali; nafasi kubwa iliwatenganisha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umbali kati yao ulikuwa mkubwa.” Kihalisi, “nafasi/mahali ilikuwa kubwa kati yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: akavuka kwenda
  rationale: Kitenzi עבר kinaonyesha kuvuka kutoka upande mmoja kwenda mwingine; ‘akavuka kwenda’ ni cha kawaida na kinahifadhi mwelekeo wa tendo.
- source_word: הָעֵבֶר
  choice: upande mwingine
  rationale: Nomino yenye kibainishi inaelekeza kwenye upande wa pili au wa ng’ambo; ‘upande mwingine’ ni Kiswahili cha kawaida katika muktadha huu.
- source_word: וַיַּעֲמֹד
  choice: akasimama
  rationale: Hii ndiyo maana ya msingi ya עמד, bila kuongeza wazo lisilo lazima la kujiweka kimakusudi.
- source_word: עַל רֹאשׁ הָהָר
  choice: juu ya kilele cha mlima
  rationale: ראשׁ, kwa matumizi ya kijiografia, humaanisha sehemu ya juu au kilele; ‘kilele cha mlima’ ni wazi na cha asili.
- source_word: מֵרָחֹק
  choice: kwa mbali
  rationale: Kirai hiki huonyesha utengano wa kimaeneo; ‘kwa mbali’ ni kifupi, cha asili, na kinadumisha maana hiyo.
- source_word: רַב הַמָּקוֹם
  choice: nafasi kubwa ilikuwa
  rationale: Kiebrania kinasema kihalisi kuwa mahali/nafasi ilikuwa kubwa. Muundo huu unahifadhi taswira ya nafasi kubwa bila kubadili moja kwa moja kuwa ‘umbali.’
- source_word: בֵּינֵיהֶם
  choice: kati yao
  rationale: Kirai hiki kinaonyesha wazi kuwa nafasi hiyo iliwatenganisha Daudi na wale wengine.
