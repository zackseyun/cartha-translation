translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Alama ya tanbihi [a] imewekwa baada ya ‘kwa mbali’ ili kuonyesha uwezekano wa kuunganisha wazo la umbali na kishazi kinachofuata.
