  text: חָלִ֤ילָ/ה לִּ/י֙ מֵֽ/יהוָ֔ה מִ/שְּׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֣יחַ יְהוָ֑ה וְ֠/עַתָּה קַח נָ֨א אֶֽת הַ/חֲנִ֜ית אֲשֶׁ֧ר מראשת/ו וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם וְ/נֵ֥לֲכָה לָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/011.yaml
  text: Far be it from me[a], by Yahweh, to stretch out my hand against Yahweh’s anointed. But now, please take the spear that is at his head, and the jar of water[c][b], and let us go.
translation:
  language: sw
  text: Yahwe na aniepushe nisinyoshe mkono wangu dhidi ya mtiwa mafuta wa Yahwe.[a] Lakini sasa, tafadhali chukua mkuki ulioko penye kichwa chake na mtungi wa maji, kisha tuondoke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “mtiwa mafuta wa Yahwe.” Hapa humhusu Sauli, mfalme aliyetiwa mafuta na Yahwe. Neno hilo linahusiana na “Masihi.”
    reason: lexical_clarification
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: Yahwe na apishe mbali nami
  rationale: Hii ni nahau yenye nguvu ya kukataa kabisa jambo kwa kumwomba Yahwe kwa uzito. Kiswahili hiki ni cha kawaida na chenye heshima, ingawa muundo wa Kiebrania unaweza pia kueleweka kama ‘hasha kwangu mbele za Yahwe.’
- source_word: מִשְּׁלֹחַ יָדִי
  choice: nisije nikanyoosha mkono wangu
  rationale: Inahifadhi taswira ya Kiebrania huku ikionyesha hatua ya uadui au kumdhuru mtu; ‘nisije’ linaendana na kukataa kwa nguvu katika kishazi kilichotangulia.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: dhidi ya mtiwa-mafuta wa Yahwe
  rationale: ‘Mtiwa-mafuta’ huhifadhi maana ya מָשִׁיחַ na katika muktadha huu humtaja Sauli kama mfalme aliyetiwa mafuta, bila kuibadili kuwa moja kwa moja cheo ‘Masihi.’
- source_word: קַח נָא
  choice: tafadhali chukua
  rationale: Chembe נָא hulainisha amri; ‘tafadhali’ huwasilisha ombi hilo kwa Kiswahili cha sasa.
- source_word: הַחֲנִית אֲשֶׁר מראשתו
  choice: mkuki ulio karibu na kichwa chake
  rationale: Hueleza kwa kawaida mahali mkuki ulipokuwa Saul alipolala, bila kudokeza kwamba ulikuwa umechomekwa kichwani.
- source_word: צַפַּחַת הַמַּיִם
  choice: mtungi wa maji
  rationale: צַפַּחַת ni chombo kidogo cha kubebea kimiminika; ‘mtungi wa maji’ ni wazi na unaeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: וְנֵלֲכָה לָּנוּ
  choice: kisha tuondoke
  rationale: Huwasilisha kohortativi ya wingi kama pendekezo la kuondoka, na ‘kisha’ huonyesha hatua inayofuata baada ya kuchukua vitu hivyo.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: ‘Yahwe’ huwakilisha jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadili kuwa cheo.
- issue: Maana ya מָשִׁיחַ katika simulizi hili
  choice: mtiwa-mafuta
  alternative: Masihi
  rationale: Hapa neno hilo linamhusu Sauli akiwa mfalme aliyetiwa mafuta na Yahwe. ‘Mtiwa-mafuta’ huhifadhi uhusiano wa kileksia bila kudokeza kwamba Sauli ndiye Masihi wa baadaye.
- issue: Nguvu ya מֵיְהוָה katika nahau חָלִילָה לִּי
  choice: Yahwe na apishe mbali nami
  alternative: Hasha kwangu mbele za Yahwe
  rationale: Kihusishi kinaweza kuwa na nguvu ya mwito au kiapo katika nahau hii. Tafsiri kuu huonyesha mwito kwa Yahwe, huku tanbihi ikihifadhi uwezekano wa kuelewa kauli kama chukizo mbele zake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Yahwe’ limetumiwa kwa jina la Mungu; ‘mtiwa-mafuta’ limehifadhiwa kwa sababu ni muhimu katika muktadha wa kifalme na kiteolojia. Muundo umeepuka Kiswahili cha kale kupita kiasi.
