base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/014.yaml
  text: Then David called to the troops and to Abner son of Ner, saying, “Will you not answer, Abner?” Abner answered and said, “Who are you, calling to the king?”
translation:
  language: sw
  text: Kisha Daudi akawaita askari na Abneri mwana wa Neri, akasema, “Abneri, hutajibu?” Abneri akajibu, “Wewe ni nani unayemwita mfalme?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם
  choice: askari
  rationale: Ingawa kwa kawaida neno hili humaanisha ‘watu’, katika muktadha huu linarejelea kundi la Sauli lililopiga kambi, yaani askari wake; tafsiri hii inaweka wazi rejeo la kimuktadha.
- source_word: וַיִּקְרָא
  choice: akawaita / unayemwita
  rationale: Kitenzi קרא hapa kina maana ya kuita kwa sauti. Umbo la Kiswahili limebadilishwa kulingana na yambwa katika kila kishazi.
- source_word: הֲלוֹא תַעֲנֶה
  choice: hutajibu?
  rationale: Swali hili linatarajia jibu na lina sauti ya changamoto; ‘hutajibu?’ ni la kawaida na huhifadhi nguvu hiyo.
- source_word: קָרָאתָ אֶל הַמֶּלֶךְ
  choice: unayemwita mfalme
  rationale: Huhifadhi maana ya kumwita au kumsemesha mfalme kwa sauti bila kuongeza sababu au tathmini.
