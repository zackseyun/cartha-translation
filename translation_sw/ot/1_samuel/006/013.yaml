base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/013.yaml
  text: The people of Beth-shemesh were reaping the wheat harvest in the valley[a], and they lifted up their eyes and saw the ark, and they rejoiced to see it.
translation:
  language: sw
  text: Watu wa Beth-shemeshi walikuwa wakivuna ngano bondeni. Wakainua macho yao[a], wakaona Sanduku, nao wakafurahi kuliona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wakainua macho yao,” nahau ya Kiebrania yenye maana ya kwamba walitazama juu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית שֶׁמֶשׁ
  choice: Watu wa Beth-shemeshi
  rationale: Jina la mahali linawakilisha wakazi wake, kama inavyoonyeshwa na maumbo ya wingi yanayofuata. “Watu wa” huweka maana hiyo wazi bila kubainisha jinsia isiyotajwa katika Kiebrania.
- source_word: קֹצְרִים קְצִיר חִטִּים
  choice: walikuwa wakivuna ngano
  rationale: Muundo wa kitenzi kishirikishi unaonyesha tendo lililokuwa likiendelea; Kiswahili “walikuwa wakivuna” huhifadhi hali hiyo. “Kuvuna ngano” ni usemi wa kawaida na wa wazi kuliko kurudia nomino ya mavuno.
- source_word: בָּעֵמֶק
  choice: bondeni
  rationale: עֵמֶק humaanisha bonde au eneo pana la chini; “bondeni” ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  choice: Wakainua macho yao
  rationale: Tafsiri hii huhifadhi taswira ya nahau ya Kiebrania huku tanbihi ikifafanua maana yake ya kawaida, yaani kutazama juu.
- source_word: וַיִּרְאוּ אֶת הָאָרוֹן
  choice: wakaona Sanduku
  rationale: Katika muktadha wa 1 Samweli 4–6, הָאָרוֹן ni Sanduku la Mungu lililokwisha kutambulishwa. “Sanduku” kwa herufi kubwa hudumisha rejeo hilo bila kuongeza maneno yasiyopo katika mstari.
- source_word: וַיִּשְׂמְחוּ לִרְאוֹת
  choice: nao wakafurahi kuliona
  rationale: Muundo huu unaonyesha kwamba kuliona Sanduku ndiko kulikowapa furaha. Kiambishi “-li-” hurejelea Sanduku ambalo limetajwa wazi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi mbili zimetumiwa ili simulizi lisomeke kwa urahisi, huku mfuatano wa vitendo vya Kiebrania ukihifadhiwa kwa maumbo ya “waka-”. Kiunganishi cha mwanzo hakijapanuliwa kuwa “Basi” au “Wakati huo,” kwa kuwa chanzo hakina neno maalumu la wakati hapo.
