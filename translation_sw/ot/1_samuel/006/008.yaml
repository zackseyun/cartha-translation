base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/008.yaml
  text: Then take the ark of Yahweh and place it on the cart[a], and put the gold objects that you are returning to him as a guilt offering in a box beside it. Then send it away[c][b], and let it go.
translation:
  language: sw
  text: Kisha lichukueni Sanduku la Yahwe na kuliweka juu ya gari. Vitu vya dhahabu[a] mnavyomrudishia kuwa sadaka ya hatia, viwekeni ndani ya kasha[b] kando ya Sanduku. Halafu lipelekeni, nalo liende zake.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vyombo vya dhahabu” au “vifaa vya dhahabu.” Neno la Kiebrania lina maana pana na linaweza kutaja vitu au vyombo vya aina mbalimbali.
    reason: lexical_alternative
  - marker: b
    text: Au “sanduku dogo” au “sanduku la kuhifadhia vitu.”
    reason: lexical_alternative
  - marker: c
    text: Kwa tafsiri ya neno kwa neno, “nalo litaenda.” Katika mfululizo huu wa maagizo, maana ni kulipeleka kisha kuliacha liende.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: Sanduku la Yahwe
  rationale: אֲרוֹן hapa ni sanduku takatifu, na muundo wa Kiebrania unalihusianisha na Yahwe. Herufi kubwa katika “Sanduku” hutofautisha sanduku hilo takatifu na kasha la kawaida lililotajwa baadaye.
- source_word: יְהוָה
  choice: Yahwe
  rationale: “Yahwe” ni uwasilishaji wa kawaida na unaotambulika wa jina la Mungu katika Kiswahili, bila kulibadilisha kuwa cheo.
- source_word: הָעֲגָלָה
  choice: gari
  rationale: עֲגָלָה ni gari la kubebea mizigo; “gari” ni neno la kawaida na la asili katika Kiswahili, huku muktadha ukionyesha kuwa si gari la kisasa.
- source_word: כְּלֵי הַזָּהָב
  choice: vitu vya dhahabu
  rationale: כְּלִי ni neno pana linaloweza kumaanisha vitu, vyombo, au vifaa. “Vitu vya dhahabu” halibani maana kuliko chanzo.
- source_word: הֲשֵׁבֹתֶם לוֹ
  choice: mnavyomrudishia
  rationale: Hifili ya שׁוב ina maana ya kurudisha au kupeleka tena. Kiambishi cha mtendewa “-m-” kinahifadhi rejeo la “kwake,” yaani kwa Yahwe.
- source_word: אָשָׁם
  choice: sadaka ya hatia
  rationale: Hili ni neno la kawaida la ibada kwa sadaka inayohusiana na hatia au fidia. Tafsiri hii inadumisha uhusiano huo bila kuufafanua kupita kiasi.
- source_word: בָאַרְגַּז
  choice: ndani ya kasha
  rationale: אַרְגָּז ni kasha au sanduku la kuhifadhia vitu. “Kasha” huepuka kulichanganya na Sanduku la Yahwe katika sentensi hii.
- source_word: מִצִּדּוֹ
  choice: kando ya Sanduku
  rationale: Kiambishi kinaelekea kurejelea Sanduku la Yahwe. Kutaja “Sanduku” wazi kunaondoa utata wa kisarufi ambao ungejitokeza kwa “kando yake” katika Kiswahili.
- source_word: וְשִׁלַּחְתֶּם אֹתוֹ
  choice: Halafu lipelekeni
  rationale: שׁלח hapa ni kupeleka au kuachilia liende. Upatanisho wa ngeli “li-” unarejelea Sanduku, kama jinsia ya kiwakilishi cha Kiebrania inavyoelekeza.
- source_word: וְהָלָךְ
  choice: nalo liende zake
  rationale: Kitenzi kwa umbo ni “nalo litaenda,” lakini katika mfululizo wa maagizo kina nguvu ya kukiruhusu kilichoondoshwa kiende. “Liende zake” ni Kiswahili cha kawaida kinachohifadhi hatua hiyo ya mwisho.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu, si cheo. “Yahwe” hulihifadhi jina hilo moja kwa moja.
- issue: Maana ya neno la kiibada אָשָׁם katika muktadha wa Wafilisti
  choice: sadaka ya hatia
  alternative: sadaka ya fidia
  rationale: Msimulizi wa Kiebrania anatumia istilahi ya ibada inayohusiana na hatia na fidia. “Sadaka ya hatia” huhifadhi istilahi hiyo bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Kirejelewa cha viwakilishi katika agizo la mwisho
  choice: Sanduku la Yahwe
  alternative: gari lenye Sanduku na sadaka
  rationale: אֹתוֹ na kitenzi וְהָלָךְ ni vya kiume katika Kiebrania na kwa kawaida vinarejelea אֲרוֹן, ambalo ni neno la kiume; עֲגָלָה ni la kike. Tafsiri inadumisha ishara hiyo ya kisarufi ingawa kwa vitendo gari lote ndilo linalosafiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimegawanywa ili maagizo yawe wazi. “Sanduku” limeandikwa kwa herufi kubwa linapotaja Sanduku la Yahwe, na “kasha” limetumiwa kwa אַרְגַּז ili kuepuka mkanganyiko. Alama zote za tanbihi zimewekwa mara moja katika sehemu husika ya matini.
