  text: And the ark of Yahweh was in the territory of the Philistines seven months[a].
translation:
  language: sw
  text: Sanduku la Yahweh lilikuwa katika nchi ya Wafilisti kwa miezi saba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika eneo la Wafilisti.” Kiebrania kinasema kihalisi “katika uwanja wa Wafilisti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: lilikaa
  rationale: Katika mfululizo huu wa simulizi, kitenzi היה kinaeleza hali iliyoendelea. Kiswahili cha kawaida hakihitaji kutafsiri waw kwa kiunganishi tofauti hapa; “lilikaa” huwasilisha kwa asili kwamba sanduku lilibaki huko.
- source_word: אֲרוֹן יְהוָה
  choice: Sanduku la Yahweh
  rationale: Muundo wa hali ya umilikaji umetafsiriwa moja kwa moja kwa “la.” “Sanduku” ni neno lililozoeleka katika muktadha huu wa ibada, na jina la Mungu limehifadhiwa kama Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni limetoholewa badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: katika nchi ya Wafilisti
  rationale: שָׂדֶה humaanisha kihalisi “uwanja/shamba,” lakini katika muundo huu inaweza kutaja eneo au nchi inayomilikiwa na Wafilisti. “Katika nchi ya Wafilisti” ni ya kawaida kwa Kiswahili na huhifadhi maana ya kijiografia; maana halisi imewekwa katika tanbihi.
- source_word: שִׁבְעָה חֳדָשִׁים
  choice: kwa miezi saba
  rationale: “Kwa” huonyesha muda uliodumu hali hiyo kwa Kiswahili cha kawaida, huku idadi ikitafsiriwa moja kwa moja.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Utohozi “Yahweh” huhifadhi jina binafsi lililo katika Kiebrania bila kulibadilisha kuwa cheo wala kuingiza mapokeo maalumu ya dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya kawaida lakini yenye heshima. “Lilikaa” ni cha asili zaidi kuliko “lilikuwa” katika kueleza sanduku kubaki katika eneo hilo kwa miezi saba.
