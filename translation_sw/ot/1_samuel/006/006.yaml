base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/006.yaml
  text: Why then do you harden your hearts[a], as Egypt and Pharaoh hardened their hearts? Was it not when he dealt harshly with them that they sent them away[b], and they went?
translation:
  language: sw
  text: Kwa nini basi mnaifanya mioyo yenu kuwa migumu[a], kama Misri na Farao walivyoifanya mioyo yao kuwa migumu? Je, si wakati alipowatendea kwa ukali walipowaacha waende[b], nao wakaondoka?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnaifanya mioyo yenu kuwa mizito,” na “walivyoifanya mioyo yao kuwa mizito.” Nahau ya Kiebrania hutumia uzito kueleza moyo mgumu au mkaidi.
    reason: lexical_alternative
  - marker: b
    text: Katika “alipowatendea kwa ukali,” wanaorejelewa ni Misri na Farao; katika “walipowaacha waende,” walioachwa waende ni Waisraeli.
    reason: cross_reference
lexical_decisions:
- source_word: תְכַבְּדוּ / כִּבְּדוּ
  choice: mnaifanya mioyo yenu kuwa migumu / walivyoifanya mioyo yao kuwa migumu
  rationale: Pieli ya כבד pamoja na ‘moyo’ ni nahau ya kuufanya moyo kuwa mzito, yaani kuwa mgumu au mkaidi. Kiswahili cha sasa hueleza maana hiyo kwa kawaida kwa ‘kuifanya mioyo kuwa migumu,’ huku tanbihi ikihifadhi picha halisi ya uzito.
- source_word: לְבַבְכֶם / לִבָּם
  choice: mioyo yenu / mioyo yao
  rationale: ‘Moyo’ hapa unahusu nia na utashi wa ndani. Wingi wa Kiswahili unalingana na kundi linalozungumziwa na unaepuka kufafanua zaidi ya maandishi.
- source_word: מִצְרַיִם וּפַרְעֹה
  choice: Misri na Farao
  rationale: Maandishi yanatumia jina la nchi, Misri, kwa maana ya watu au mamlaka yake kwa ujumla; muundo huo unaweza kuhifadhiwa kwa kawaida katika Kiswahili.
- source_word: הִתְעַלֵּל בָּהֶם
  choice: yeye kuwatendea kwa ukali
  rationale: Kitenzi kinaonyesha tendo kali la kuadhibu au kushughulika nao kwa ukali. ‘Kuwatendea kwa ukali’ ni cha kawaida na hakibainishi namna ya adhabu kuliko Kiebrania.
- source_word: וַיְשַׁלְּחוּם
  choice: walipowaacha waende
  rationale: שלח katika muktadha huu ni kuwaachilia au kuwaruhusu Israeli waende. Kiswahili ‘kuwaacha waende’ kinaonyesha wazi tendo la kuwaachilia bila kupoteza dokezo la simulizi la Kutoka.
- source_word: וַיֵּלֵכוּ
  choice: nao wakaondoka
  rationale: ‘Wakaondoka’ ni tafsiri fupi na ya kawaida ya הלך katika muktadha wa watu walioachiliwa waende.
theological_decisions:
- issue: Kiima kisichotajwa cha הִתְעַלֵּל
  choice: Kimehifadhiwa kwa kiwakilishi ‘yeye,’ kikieleweka katika muktadha kuwa Mungu.
  alternative: Kutaja wazi ‘Mungu’ au kutafsiri bila kiima kama ‘walipopata mateso.’
  rationale: Kiebrania hakimtaji Mungu kwa jina katika kishazi hiki, ingawa simulizi la Kutoka linamfanya awe rejeleo la kawaida. ‘Yeye’ huhifadhi kiasi cha udokezi na mvutano wa maandishi ya asili.
- issue: Marejeo tofauti ya viwakilishi katika sehemu ya mwisho
  choice: ‘kuwatendea’ linarejelea Misri na Farao, lakini kiambishi katika ‘walipowaacha’ kinarejelea Israeli.
  alternative: Kutaja ‘Waisraeli’ moja kwa moja katika maandishi makuu.
  rationale: Maandishi ya Kiebrania yanabadilisha rejeleo bila kulitaja wazi. Tanbihi inafafanua ili kuzuia mkanganyiko bila kuongeza jina ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha umehifadhiwa, pamoja na utata wa kiima cha Kiebrania kwa kutumia ‘yeye.’
