  text: וְ/הָ/עֲגָלָ֡ה בָּ֠אָה אֶל שְׂדֵ֨ה יְהוֹשֻׁ֤עַ בֵּֽית הַשִּׁמְשִׁי֙ וַ/תַּעֲמֹ֣ד שָׁ֔ם וְ/שָׁ֖ם אֶ֣בֶן גְּדוֹלָ֑ה וַֽ/יְבַקְּעוּ֙ אֶת עֲצֵ֣י הָ/עֲגָלָ֔ה וְ/אֶת הַ֨/פָּר֔וֹת הֶעֱל֥וּ עֹלָ֖ה לַ/יהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/014.yaml
  text: The cart came into the field of Joshua the Beth-shemite and stopped there[a], where there was a large stone[c][b]. Then they split up the wood of the cart and offered up the cows as a burnt offering to Yahweh.
translation:
  language: sw
  text: Gari likafika katika shamba la Yoshua wa Beth-shemeshi,[a] likasimama hapo.[b] Hapo palikuwa na jiwe kubwa. Kisha wakapasua mbao za gari, wakawatoa ng’ombe wa kike hao kuwa sadaka ya kuteketezwa kwa Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shamba la Yoshua wa Beth-shemeshi.” Kiebrania kinamtambulisha Yoshua kwa uhusiano wake na Beth-shemeshi.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania ni “likasimama”; hapa kinamaanisha kwamba gari lilifika na kusimama hapo.
    reason: lexical_clarification
  - marker: c
    text: 'Kiebrania: YHWH; kwa desturi nyingine hutafsiriwa “BWANA.”'
    reason: divine_name
lexical_decisions:
- source_word: הָעֲגָלָה
  choice: gari
  rationale: Katika muktadha huu neno hili linamaanisha gari lililobeba Sanduku; “gari” ni neno la kawaida na la asili katika Kiswahili.
- source_word: שְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: shamba la Yoshua, mwenyeji wa Beth-shemeshi
  rationale: Kirai hiki kinamtambulisha Yoshua kwa uhusiano wake na Beth-shemeshi. “Mwenyeji wa” kinaeleza uhusiano huo kwa Kiswahili cha kawaida bila kuamua zaidi ikiwa alizaliwa au aliishi huko.
- source_word: וַתַּעֲמֹד שָׁם
  choice: likasimama hapo
  rationale: עמד humaanisha kihalisi “kusimama”; kwa gari lililokuwa likisafiri, Kiswahili hiki pia huwasilisha kwa kawaida maana ya kufika mwisho na kusimama.
- source_word: וְשָׁם אֶבֶן גְּדוֹלָה
  choice: Hapo palikuwa na jiwe kubwa
  rationale: Muundo huu unahifadhi msisitizo wa mahali na uwepo wa jiwe kubwa kwa Kiswahili cha asili.
- source_word: וַיְבַקְּעוּ אֶת עֲצֵי הָעֲגָלָה
  choice: wakapasua mbao za gari
  rationale: בקע ni kupasua au kuchana vipande; “mbao za gari” inaonyesha kwamba sehemu zake za mbao zilitumiwa.
- source_word: הַפָּרוֹת
  choice: ng’ombe hao
  rationale: פרות ni ng’ombe wa kike; Kiswahili kwa kawaida hutumia “ng’ombe,” na “hao” huwarejelea wale waliotajwa katika muktadha uliotangulia bila kuongeza maelezo yasiyosemwa hapa.
- source_word: הֶעֱלוּ עֹלָה
  choice: wakawatoa ... kuwa sadaka ya kuteketezwa
  rationale: Kirai hiki ni lugha ya ibada kuhusu kutoa mnyama kama sadaka inayoteketezwa kabisa; tafsiri hii inadumisha tendo la kutoa na aina ya sadaka.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Jina la agano יהוה limetolewa kama “Yahwe,” umbo linaloeleweka katika Kiswahili na linalohifadhi jina binafsi badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi יהוה. “Yahwe” hulihifadhi moja kwa moja, huku tanbihi ikieleza desturi nyingine ya kulitafsiri kwa cheo “BWANA.”
- issue: Aina ya dhabihu katika הֶעֱלוּ עֹלָה
  choice: sadaka ya kuteketezwa
  alternative: dhabihu ya kuteketezwa
  rationale: עֹלָה ni sadaka inayoteketezwa kabisa. “Sadaka ya kuteketezwa” ni lugha ya kawaida ya Biblia ya Kiswahili na haiongezi maelezo ya kiteolojia kuliko yaliyomo katika neno lenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wazi na wenye hadhi. Majina “Yoshua,” “Beth-shemeshi,” na “Yahwe” yameandikwa kwa maumbo yanayosomeka kwa urahisi katika Kiswahili. Tafsiri inahifadhi mfuatano wa matendo na haitaji watendaji kwa jina kwa sababu Kiebrania kinasema tu “wao.”
