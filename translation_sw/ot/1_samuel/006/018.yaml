source:
  edition: WLC
  text: וְ/עַכְבְּרֵ֣י הַ/זָּהָ֗ב מִסְפַּ֞ר כָּל עָרֵ֤י פְלִשְׁתִּים֙ לַ/חֲמֵ֣שֶׁת הַ/סְּרָנִ֔ים מֵ/עִ֣יר מִבְצָ֔ר וְ/עַ֖ד כֹּ֣פֶר הַ/פְּרָזִ֑י וְ/עַ֣ד אָבֵ֣ל הַ/גְּדוֹלָ֗ה אֲשֶׁ֨ר הִנִּ֤יחוּ עָלֶ֨י/הָ֙ אֵ֚ת אֲר֣וֹן יְהוָ֔ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה בִּ/שְׂדֵ֥ה יְהוֹשֻׁ֖עַ בֵּֽית הַשִּׁמְשִֽׁי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/018.yaml
  text: and the golden mice[a], according to the number of all the cities of the Philistines belonging to the five rulers, from fortified city to unwalled village, and as far as the great stone on which they set down the ark of Yahweh, which remains to this day in the field of Joshua the Beth-shemite.
translation:
  language: sw
  text: Nao panya wa dhahabu walilingana na idadi ya miji yote ya Wafilisti iliyokuwa chini ya watawala hao watano, kuanzia mji wenye ngome hadi kijiji kisicho na ukuta, na mpaka lile jiwe kubwa[a] ambalo juu yake waliweka Sanduku la Yahweh. Jiwe hilo liko mpaka leo katika shamba la Yoshua wa Beth-shemeshi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na mpaka Abeli Kubwa,” ikiwa maneno ya Kiebrania yanasomwa kama jina la mahali badala ya “jiwe kubwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: panya wa dhahabu
  rationale: עַכְבָּר inaweza kumaanisha panya wa aina mbalimbali; “panya” ni neno la kawaida na pana la Kiswahili, nalo linatunza muundo wa Kiebrania unaotumia nomino mbili.
- source_word: מִסְפַּר כָּל עָרֵי פְלִשְׁתִּים
  choice: walilingana na idadi ya miji yote ya Wafilisti
  rationale: מִסְפַּר hapa huonyesha ulinganifu wa kiasi. Kitenzi “walilingana” kimeongezwa ili sentensi iwe kamili na ya asili katika Kiswahili.
- source_word: לַחֲמֵשֶׁת הַסְּרָנִים
  choice: iliyokuwa chini ya watawala hao watano
  rationale: סְרָנִים ni cheo cha watawala wakuu wa Wafilisti. “Watawala” ni wazi kwa msomaji wa sasa, na “chini ya” huonyesha uhusiano wa miji hiyo na mamlaka yao.
- source_word: מֵעִיר מִבְצָר וְעַד כֹּפֶר הַפְּרָזִי
  choice: kuanzia mji wenye ngome hadi kijiji kisicho na ukuta
  rationale: Tafsiri hii inahifadhi tofauti kati ya makao yaliyoimarishwa na kijiji cha wazi kisichozungushiwa ukuta.
- source_word: וְעַד אָבֵל הַגְּדוֹלָה
  choice: na mpaka lile jiwe kubwa
  rationale: Ingawa maandishi ya konsonanti yanaweza kusomwa kama jina la mahali, “Abeli Kubwa,” kishazi kinachofuata kuhusu kuweka Sanduku juu yake na muktadha wa jiwe kubwa katika mstari wa 14 vinaunga mkono maana ya “jiwe kubwa.” Uwezekano wa jina la mahali umehifadhiwa katika tanbihi.
- source_word: אֲשֶׁר הִנִּיחוּ עָלֶיהָ אֵת אֲרוֹן יְהוָה
  choice: ambalo juu yake waliweka Sanduku la Yahweh
  rationale: הִנִּיחוּ ni kuweka au kutua kitu mahali. Mpangilio huu ni wa asili katika Kiswahili na unadumisha uhusiano wa kishazi na jiwe.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: Jiwe hilo liko mpaka leo
  rationale: Nahau hii huonyesha kwamba kitu kilikuwapo hadi wakati wa mwandishi. Sentensi tofauti inafafanua rejeo la jiwe bila kulifanya kishazi cha Kiswahili kuwa kizito.
- source_word: בִּשְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: katika shamba la Yoshua wa Beth-shemeshi
  rationale: בֵּית הַשִּׁמְשִׁי ni jina la kumtambulisha mtu kuwa anatoka Beth-shemeshi; “wa Beth-shemeshi” ni wazi na ya kawaida zaidi katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano יְהוָה. “Yahweh” hulihifadhi kama jina maalumu bila kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umefanywa kuwa sentensi kamili kwa uwazi, huku tofauti ya makao yenye ngome na vijiji visivyo na ukuta, pamoja na utata wa “jiwe kubwa/Abeli Kubwa,” vikihifadhiwa.
