  text: וַ/יֹּאמְר֗וּ אִֽם מְשַׁלְּחִ֞ים אֶת אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ אַל תְּשַׁלְּח֤וּ אֹת/וֹ֙ רֵיקָ֔ם כִּֽי הָשֵׁ֥ב תָּשִׁ֛יבוּ ל֖/וֹ אָשָׁ֑ם אָ֤ז תֵּרָֽפְאוּ֙ וְ/נוֹדַ֣ע לָ/כֶ֔ם לָ֛/מָּה לֹא תָס֥וּר יָד֖/וֹ מִ/כֶּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/003.yaml
  text: And they said[a], “If you are sending away the ark of the God of Israel, do not send it away empty, for you must surely return to him a guilt offering. Then you will be healed[b], and it will be made known to you why his hand has not turned away from you.”
translation:
  language: sw
  text: Wakasema, “Kama mnalituma sanduku la Mungu wa Israeli, msilitume bila kitu; kwa maana lazima mmpatie sadaka ya hatia[a]. Ndipo mtaletewa uponyaji, nanyi mtajulishwa kwa nini mkono wake[b] haujaondoka kwenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya fidia”; tafsiri ya jadi ni “sadaka ya kosa.”
    reason: lexical_alternative
  - marker: b
    text: “Mkono wake” ni nahau ya Kiebrania inayomaanisha nguvu ya Mungu katika hukumu.
    reason: cultural_note
lexical_decisions:
- source_word: מְשַׁלְּחִים / תְּשַׁלְּחוּ
  choice: mnaliondoa / msiliondoe
  rationale: Katika muktadha huu שלח ni kuliondoa sanduku kutoka mikononi mwa Wafilisti ili lirudishwe. ‘Kuliondoa’ ni Kiswahili cha kawaida na kinahifadhi urudiaji wa kitenzi.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: sanduku la Mungu wa Israeli
  rationale: Tafsiri hii inafuata muundo wa Kiebrania bila kuongeza neno ‘agano,’ ambalo halipo katika mstari huu.
- source_word: רֵיקָם
  choice: bila kitu
  rationale: Hii inaeleza kwa kawaida kwamba sanduku halipaswi kurudishwa bila zawadi au malipo yanayoambatana nalo.
- source_word: הָשֵׁב תָּשִׁיבוּ
  choice: lazima mmrudishie
  rationale: Muundo wa kitenzi kisoukomo pamoja na kitenzi kilichokamilika unasisitiza wajibu; ‘lazima’ huwasilisha mkazo huo kwa Kiswahili cha kawaida.
- source_word: לּוֹ
  choice: mmrudishie
  rationale: Kiambishi cha nafsi ya kiume kinaeleweka kwa kawaida kumrejelea Mungu wa Israeli, si sanduku. Kiambishi ‘-m-’ kinahifadhi rejeo hilo la kibinafsi.
- source_word: אָשָׁם
  choice: sadaka ya hatia
  rationale: Neno hili humaanisha sadaka inayohusiana na hatia na kufanya fidia. ‘Sadaka ya hatia’ ni wazi, huku tanbihi ikitaja maana mbadala ya fidia.
- source_word: תֵּרָפְאוּ
  choice: mtakapoponywa
  rationale: Hifadhi hali ya kutendwa ya kitenzi na wazo la kuondolewa kwa tauni au mateso.
- source_word: וְנוֹדַע לָכֶם
  choice: itajulikana kwenu
  rationale: Tafsiri hii inahifadhi usemi usio wa kutenda wa Kiebrania badala ya kuugeuza moja kwa moja kuwa ‘mtajua.’
- source_word: לָמָּה לֹא תָסוּר יָדוֹ מִכֶּם
  choice: kwa nini mkono wake haujaondoka kwenu
  rationale: Inahifadhi sitiari ya Kiebrania ya ‘mkono’ kama nguvu ya Mungu katika hukumu, pamoja na wazo la mkono huo kutokuwa umeondoka.
theological_decisions:
- issue: Rejeo la kiambishi katika לּוֹ
  choice: Sadaka inarudishwa ‘kwake,’ yaani kwa Mungu wa Israeli.
  alternative: Sadaka inarudishwa ‘kwalo,’ yaani inaambatanishwa na sanduku.
  rationale: Kirai cha karibu ‘sanduku la Mungu wa Israeli’ na neno la sadaka אָשָׁם vinaunga mkono rejeo la kibinafsi kwa Mungu. Hata hivyo, sadaka hiyo kwa vitendo ilisafirishwa pamoja na sanduku.
- issue: Maana ya ‘mkono wake’
  choice: Sitiari ya nguvu ya Mungu inayowatesa au kuwahukumu imehifadhiwa kama ‘mkono wake.’
  alternative: Tafsiri ya ufafanuzi kama ‘adhabu yake’ au ‘pigo lake.’
  rationale: Sitiari hii ni muhimu na ya kawaida katika Agano la Kale; kuihifadhi huepuka kufunga maana kwa tafsiri moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa kitenzi na sitiari ya ‘mkono wake’ zimehifadhiwa, huku miundo mizito ya Kiebrania ikitolewa kwa Kiswahili cha asili.
