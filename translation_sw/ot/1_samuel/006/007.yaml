base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/007.yaml
  text: Now then[a], take and make one new cart, and two nursing cows on which no yoke has come, and hitch the cows to the cart[b], but take their calves away from them to the house.
translation:
  language: sw
  text: Basi sasa, chukueni mkafanye gari moja jipya la kukokotwa, na ng’ombe wawili wa kike wanaonyonyesha[a], ambao hawajawahi kutiwa nira[b]. Wafungeni ng’ombe hao kwenye gari hilo, lakini warudisheni ndama wao nyumbani, mbali na mama zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana ya karibu zaidi, “ng’ombe wawili wa kike wanaotoa maziwa.”
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri halisi, “ambao nira haijawahi kuwajia”; yaani, ng’ombe ambao hawajawahi kutumiwa kufanya kazi ya kukokota.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Kauli hii inaendeleza maagizo na kuanzisha hatua inayofuata; “Basi sasa” ni ya kawaida na huhifadhi nguvu ya mpito ya Kiebrania.
- source_word: קְחוּ וַעֲשׂוּ
  choice: chukueni mkafanye
  rationale: Vitenzi vyote viwili vya amri vimehifadhiwa, huku muundo wa Kiswahili ukionyesha mfuatano wa matendo kwa ufasaha.
- source_word: עֲגָלָה חֲדָשָׁה אֶחָת
  choice: gari moja jipya
  rationale: “Gari” hapa ni gari la kukokotwa; “moja” na “jipya” huhifadhi namba na sifa za matini chanzi.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: ng’ombe wawili wanaonyonyesha
  rationale: עָלוֹת inaeleza ng’ombe wa kike walio na maziwa na wanaonyonyesha ndama; tafsiri hii inaonyesha hali yao ya wakati huo badala ya kuwaita tu ng’ombe wa maziwa.
- source_word: אֲשֶׁר לֹא עָלָה עֲלֵיהֶם עֹל
  choice: ambao hawajawahi kutiwa nira
  rationale: Nahau ya Kiebrania, kwa maana halisi kwamba nira haijawahi kuwajia, inaonyesha kuwa hawajawahi kutumiwa katika kazi ya kukokota. Kiswahili hiki ni wazi na huhifadhi maana hiyo.
- source_word: וַאֲסַרְתֶּם אֶת־הַפָּרוֹת בָּעֲגָלָה
  choice: Wafungeni ng’ombe hao kwenye gari
  rationale: Kitenzi kinaonyesha kuwafunga wanyama kwenye gari ili walikokote. “Wafungeni ... kwenye gari” ni Kiswahili cha kawaida bila kudokeza kwamba walikuwa wamewahi kufungwa nira.
- source_word: וַהֲשֵׁיבֹתֶם בְּנֵיהֶם
  choice: warudisheni ndama wao
  rationale: Hifili ya שׁוב ina maana ya kusababisha warudi. בְּנֵיהֶם, kwa habari ya ng’ombe, ni “ndama wao.”
- source_word: מֵאַחֲרֵיהֶם הַבָּיְתָה
  choice: nyumbani, mbali na mama zao
  rationale: Muundo huu unaonyesha ndama warudishwe kuelekea nyumbani na hivyo waondolewe wasiwafuate ng’ombe. Kutaja “mama zao” huondoa utata wa kiwakilishi katika Kiswahili bila kuongeza wahusika wapya.
