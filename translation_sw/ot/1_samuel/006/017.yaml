base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/017.yaml
  text: 'And these are the golden tumors that the Philistines returned as a guilt offering to Yahweh: one for Ashdod[a], one for Gaza, one for Ashkelon, one for Gath, one for Ekron.'
translation:
  language: sw
  text: 'Na haya ndiyo mavimbe ya dhahabu[a] ambayo Wafilisti walirudisha kwa Yahweh kuwa sadaka ya hatia: moja kwa ajili ya Ashdodi, moja kwa ajili ya Gaza, moja kwa ajili ya Ashkeloni, moja kwa ajili ya Gathi, na moja kwa ajili ya Ekroni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vimbe vya dhahabu”; neno la Kiebrania linarejelea tatizo la mwili lililowakilishwa na sadaka hizi za nadhiri, na kwa mapokeo limetafsiriwa kwa umahususi zaidi kuwa “bawasiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Haya ndiyo
  rationale: Hutanguliza orodha ya ufafanuzi kwa Kiswahili cha kawaida; uhusiano na yaliyotangulia unaeleweka katika mtiririko wa simulizi bila kulazimisha kiunganishi ‘na’.
- source_word: טְחֹרֵי הַזָּהָב
  choice: mavimbe ya dhahabu
  rationale: טְחֹרִים hutaja ugonjwa wa mwili uliowakilishwa na vitu hivi vya nadhiri. ‘Mavimbe’ ni neno la kawaida na pana ambalo halilazimishi utambuzi mahsusi wa kitabibu.
- source_word: אֲשֶׁר הֵשִׁיבוּ
  choice: ambayo ... walirudisha
  rationale: Hifili ya שוב hapa ina maana ya kurudisha au kutuma kurudi; ‘walirudisha’ inafaa katika muktadha wa fidia iliyoambatana na kurudishwa kwa sanduku.
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili cha Biblia.
- source_word: אָשָׁם
  choice: kuwa sadaka ya hatia
  rationale: אָשָׁם ni sadaka inayohusiana na hatia na fidia; ‘sadaka ya hatia’ ni wazi, fupi, na huhifadhi wazo la ibada bila kuongeza tafsiri ya kimadhehebu.
- source_word: לַיהוָה
  choice: kwa Yahweh
  rationale: Kiambishi ל־ kinaonyesha mpokeaji wa sadaka, na jina la agano יְהוָה limetoholewa moja kwa moja kuwa ‘Yahweh’.
- source_word: לְאַשְׁדּוֹד אֶחָד ... לְעֶקְרוֹן אֶחָד
  choice: moja kwa ajili ya Ashdodi ... moja kwa ajili ya Ekroni
  rationale: Kurudia kwa לְ pamoja na אֶחָד kunaonyesha kitu kimoja kwa kila mji; muundo huu ni wa asili na unaeleweka katika Kiswahili.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יְהוָה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Majina ya miji yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
