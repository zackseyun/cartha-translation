    reason: lexical_alternative
  revision_rationale: The revision restores the Hebrew connective at the verse opening and refines the lexical footnote so that it acknowledges the traditional “bawasiri” interpretation while avoiding an unsupported identification with boils. The remainder of the draft faithfully and naturally conveys the source text.
