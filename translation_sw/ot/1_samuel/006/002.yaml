base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/002.yaml
  text: So the Philistines called for the priests and the diviners[a], saying, “What shall we do with the ark of Yahweh? Tell us with what we should send it to its place.”
translation:
  language: sw
  text: Basi Wafilisti wakawaita makuhani na waaguzi, wakisema, “Tutafanya nini na sanduku la Yahwe? Tuambieni tutalituma kwa njia gani mahali pake[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa kitu gani tutalituma”; yaani, walitaka kujua ni njia au chombo gani watakachotumia kulituma sanduku hilo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: wakawaita
  rationale: Kitenzi hiki hapa kina maana ya kuwaita wataalamu waje kutoa shauri; “wakawaita” ni ya kawaida na inafaa katika simulizi.
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili cha Biblia.
- source_word: לַכֹּהֲנִים
  choice: makuhani
  rationale: Neno linawataja watumishi wa kidini wa Wafilisti; tafsiri haiongezi maelezo yasiyokuwamo katika maandishi.
- source_word: וְלַקֹּסְמִים
  choice: na waaguzi
  rationale: Waaguzi ni watu wanaotafuta maarifa au mwongozo kwa njia za uaguzi; neno hili ni sahihi na linaeleweka katika Kiswahili cha sasa.
- source_word: מַה נַּעֲשֶׂה
  choice: Tulifanyie nini
  rationale: Hili ni swali la mashauriano katika nafsi ya kwanza wingi. Muundo huu wa Kiswahili unaonyesha kwa kawaida maana ya kufanya nini kuhusu kitu.
- source_word: לַאֲרוֹן יְהוָה
  choice: sanduku la Yahwe
  rationale: “Sanduku” ni tafsiri iliyo wazi ya אֲרוֹן katika muktadha huu, na kihusishi kinaonyeshwa kwa muundo wa kawaida wa Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: הוֹדִיעֻנוּ
  choice: Tuambieni
  rationale: Amri hii ina maana ya “tujulisheni”; “tuambieni” ni ya kawaida, ya moja kwa moja, na inalinda maana.
- source_word: בַּמֶּה
  choice: pamoja na nini
  rationale: Kiebrania kinauliza kihalisi “kwa/na nini,” si namna kwa ujumla tu. “Pamoja na nini” hudokeza kitu ambacho kingeandamana na sanduku bila kukitaja wazi kuwa sadaka.
- source_word: נְשַׁלְּחֶנּוּ
  choice: tulitume
  rationale: Kitenzi kinaeleza hatua wanayotafuta shauri la kuifanya kwa sanduku; “tulitume” kinahifadhi maana bila kuongeza wazi wazo la kulirudisha.
- source_word: לִמְקוֹמוֹ
  choice: mahali pake
  rationale: Hii inatafsiri kihalisi rejeo la mahali pa sanduku; neno “tena” halijaongezwa kwa kuwa halipo wazi katika Kiebrania.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Utambulisho wa makuhani
  choice: makuhani
  alternative: makuhani wa Wafilisti
  rationale: Muktadha unaonyesha kuwa ni makuhani walioitwa na Wafilisti, lakini Kiebrania chenyewe hakiongezi kivumishi hicho; tafsiri haikibainishi zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa na wenye heshima. “Tulifanyie nini” na “Tuambieni” ni miundo ya kawaida na inayoeleweka; “pamoja na nini” huhifadhi upekee wa swali la Kiebrania kuhusu kitu au njia ya kuandamana na sanduku.
