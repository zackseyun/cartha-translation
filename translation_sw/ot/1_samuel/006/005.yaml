  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶם֩ צַלְמֵ֨י עפלי/כם וְ/צַלְמֵ֣י עַכְבְּרֵי/כֶ֗ם הַ/מַּשְׁחִיתִם֙ אֶת הָ/אָ֔רֶץ וּ/נְתַתֶּ֛ם לֵ/אלֹהֵ֥י יִשְׂרָאֵ֖ל כָּב֑וֹד אוּלַ֗י יָקֵ֤ל אֶת יָד/וֹ֙ מֵֽ/עֲלֵי/כֶ֔ם וּ/מֵ/עַ֥ל אֱלֹהֵי/כֶ֖ם וּ/מֵ/עַ֥ל אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/005.yaml
  text: So make images of your tumors and images of your mice that are ravaging the land[a], and give glory to the God of Israel. Perhaps he will lighten his hand from upon you, and from upon your gods, and from upon your land.
translation:
  language: sw
  text: Basi tengenezeni mifano ya uvimbe wenu[a] na mifano ya panya wenu wanaoiharibu nchi, na mpeni Mungu wa Israeli utukufu. Labda atapunguza uzito wa mkono wake kutoka juu yenu, na kutoka juu ya miungu yenu, na kutoka juu ya nchi yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bawasiri zenu.” Neno la Kiebrania linamaanisha uvimbe wa mwili; tafsiri hii ya jadi inawezekana, lakini si ya hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: Basi tengenezeni
  rationale: Kitenzi hiki kinaendeleza agizo linalotokana na yaliyotangulia. “Basi” linaonyesha uhusiano huo, na “tengenezeni” ni agizo la kawaida na la wazi kwa kutengeneza vitu hivi.
- source_word: צַלְמֵי
  choice: mifano ya
  rationale: צֶלֶם humaanisha taswira au kitu kilichotengenezwa kufanana na kingine. “Mifano” hapa linaeleweka kwa vitu vinavyowakilisha uvimbe na panya bila kuongeza dhana ambayo haijaelezwa wazi.
- source_word: עפלי/כם
  choice: uvimbe wenu
  rationale: Neno la Kiebrania linaonyesha uvimbe wa mwili lakini halibainishi kwa hakika sehemu au aina yake. “Uvimbe” ni pana na halilazimishi maana mahususi ya bawasiri.
- source_word: וְצַלְמֵי עַכְבְּרֵי/כֶם
  choice: na mifano ya panya wenu
  rationale: עַכְבָּר humaanisha panya, ingawa linaweza kutumiwa kwa maana pana ya mnyama wa jamii hiyo. “Panya” ndilo neno la kawaida na linalofaa katika muktadha.
- source_word: הַמַּשְׁחִיתִם אֶת הָאָרֶץ
  choice: wanaoiharibu nchi
  rationale: Kauli ya wakati unaoendelea inaonyesha uharibifu unaofanywa na panya. “Wanaoiharibu” huhifadhi tendo endelevu na ni Kiswahili cha kawaida.
- source_word: וּנְתַתֶּם ... כָּבוֹד
  choice: mkampe utukufu
  rationale: Kirai hiki ni wito wa kumtambua na kumheshimu Mungu wa Israeli. “Kumpa utukufu” huhifadhi uzito wa כָּבוֹד na ni usemi wa asili katika Kiswahili cha Biblia.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huu ni ujenzi wa kawaida unaomtaja Mungu anayehusishwa na Israeli; umoja wake uko wazi katika muktadha na katika kitenzi kinachofuata.
- source_word: אוּלַי
  choice: Labda
  rationale: Neno hili linaonyesha uwezekano wenye tumaini bila kutoa uhakika.
- source_word: יָקֵל אֶת יָדוֹ
  choice: ataupunguza uzito wa mkono wake
  rationale: Hiphil ya קלל ina maana ya kufanya kitu kiwe chepesi. Tafsiri hii huhifadhi sitiari ya mkono huku ikifanya maana ya kupunguza shinikizo au adhabu ieleweke kwa Kiswahili.
- source_word: מֵעֲלֵיכֶם וּמֵעַל אֱלֹהֵיכֶם וּמֵעַל אַרְצְכֶם
  choice: ulio juu yenu, juu ya miungu yenu, na juu ya nchi yenu
  rationale: Kurudiwa kwa מֵעַל kunasisitiza kuwa mkono mzito unawakalia wao, miungu yao, na nchi yao. Muundo wa Kiswahili huhifadhi marudio na taswira hiyo kwa njia inayoeleweka.
theological_decisions:
- issue: Aina ya ugonjwa unaotajwa na עפלים
  choice: uvimbe
  alternative: bawasiri
  rationale: Neno la Kiebrania linaelekeza kwenye uvimbe wa mwili lakini halitoshi kuthibitisha kwa hakika kwamba ni bawasiri. Maana ya jadi imehifadhiwa katika tanbihi badala ya kuondoa utata katika maandishi makuu.
- issue: Sitiari ya mkono wa Mungu
  choice: mkono wake
  alternative: nguvu zake au adhabu yake
  rationale: Maandishi ya Kiebrania yanatumia “mkono” kama taswira ya nguvu ya Mungu inayowaelemea. Taswira hiyo inaeleweka kwa Kiswahili na inapaswa kuhifadhiwa badala ya kufafanuliwa kuwa dhana moja tu.
- issue: Kutajwa kwa miungu ya Wafilisti
  choice: miungu yenu
  alternative: sanamu zenu
  rationale: אֱלֹהֵיכֶם hapa ni “miungu yenu.” Kutafsiri “sanamu” kungebadili neno na kupunguza mkazo wa kifungu kwamba hata miungu yao iko chini ya mkono wa Mungu wa Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umehifadhi marudio ya “juu ya” na taswira ya mkono mzito, huku “ataupunguza uzito” likifanya sitiari hiyo iwe ya kawaida katika Kiswahili.
