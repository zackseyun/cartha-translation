base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/004.yaml
  text: 'And they said[a], “What is the guilt offering that we should return to him?” They said, “According to the number of the Philistine rulers: five golden tumors and five golden mice[c][b], for one plague was on all of them and on your rulers.”'
translation:
  language: sw
  text: 'Wakasema, “Ni sadaka gani ya hatia[a] tunayopaswa kumrudishia?” Wakasema, “Kulingana na idadi ya watawala[b] wa Wafilisti: mivimbe mitano ya dhahabu[c] na panya watano wa dhahabu, kwa maana pigo moja limewapata nyote pamoja na watawala wenu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya fidia” au “sadaka ya kosa.”
    reason: lexical_alternative
  - marker: b
    text: Au “wakuu wa Wafilisti.” Neno hili ni cheo cha viongozi wao wakuu.
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania huenda linamaanisha mivimbe iliyotokana na pigo; wengine hulitafsiri kwa maana mahsusi zaidi kuwa “bawasiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָשָׁם
  choice: sadaka ya hatia
  rationale: Katika muktadha huu wa ibada na fidia, neno hili linamaanisha sadaka inayotolewa kwa sababu ya hatia na kwa kusudi la kurekebisha kosa. “Sadaka ya hatia” ni wazi na linaeleweka katika Kiswahili cha Biblia.
- source_word: נָשִׁיב לוֹ
  choice: tunayopaswa kumrudishia
  rationale: Hifili ya שוב ina maana ya kurudisha, na kiwakilishi cha umoja wa kiume kinarejelea Mungu wa Israeli. Muundo huu wa Kiswahili unaonyesha kuwa sadaka ndiyo inayorudishwa kwake.
- source_word: מִסְפַּר סַרְנֵי פְלִשְׁתִּים
  choice: kulingana na idadi ya watawala wa Wafilisti
  rationale: Kirai kinaonyesha ulinganifu kati ya idadi ya vitu vya dhahabu na idadi ya viongozi wa Wafilisti. “Kulingana na idadi ya” ni Kiswahili cha kawaida na huweka maana hiyo wazi.
- source_word: סַרְנֵי
  choice: watawala
  rationale: Hili ni jina la viongozi wakuu wa kisiasa wa Wafilisti. “Watawala” linaonyesha mamlaka yao bila kuingiza dhana za kifalme au kiukoo zisizotajwa.
- source_word: עפלי זָהָב
  choice: mivimbe mitano ya dhahabu
  rationale: Nomino hiyo inaelekea kumaanisha uvimbe unaohusiana na pigo. “Mivimbe” huhifadhi maana ya jumla bila kudai kwa uhakika kuwa ilikuwa bawasiri.
- source_word: עַכְבְּרֵי זָהָב
  choice: panya watano wa dhahabu
  rationale: עַכְבָּר humaanisha panya. Muundo huu ni wa kawaida katika Kiswahili na unaonyesha kuwa sanamu hizo zilitengenezwa kwa dhahabu.
- source_word: מַגֵּפָה אַחַת
  choice: pigo moja
  rationale: Kirai kinasisitiza kuwa wote walipatwa na pigo lilelile. “Pigo moja” ni fupi na linakaribia muundo wa Kiebrania.
- source_word: לְכֻלָּם וּלְסַרְנֵיכֶם
  choice: limewapata ninyi nyote pamoja na watawala wenu
  rationale: Kiswahili huhitaji kutaja waathiriwa kwa muundo wa kitenzi. “Ninyi nyote” hufanya wazi kwamba kiambishi cha nafsi ya pili katika “watawala wenu” kinaelekezwa kwa Wafilisti wanaozungumziwa.
theological_decisions:
- issue: Kirejelewa cha kiwakilishi לוֹ katika swali kuhusu sadaka
  choice: “kumrudishia,” kikimrejelea Mungu wa Israeli
  alternative: “kuirudishia,” kikilirejelea sanduku
  rationale: Kiwakilishi cha Kiebrania ni cha umoja wa kiume, na mantiki ya kifungu inahusu kurekebisha kosa lililofanywa dhidi ya Mungu wa Israeli kwa sababu ya kutekwa kwa sanduku lake. Tafsiri ya nafsi hudumisha kiwakilishi hicho bila kuongeza maelezo ndani ya aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Wakauliza/Wakajibu” hutofautisha swali la Wafilisti na jibu la makuhani na waaguzi bila kuongeza wahusika ambao hawatajwi moja kwa moja katika aya. Alama zote za tanbihi zimewekwa mara moja katika matini kuu.
