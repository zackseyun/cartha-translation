base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/011.yaml
  text: Then they put the ark of Yahweh on the cart[a], along with the box and the gold mice and the images of their tumors.
translation:
  language: sw
  text: Kisha wakaliweka sanduku la Yahweh juu ya gari, pamoja na kisanduku, panya wa dhahabu, na sanamu za vivimbe vyao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uvimbe wao”; huenda “bawasiri zao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: Kisha wakaliweka
  rationale: Kitenzi hiki cha masimulizi kinaendeleza mfuatano wa matukio; “Kisha” na “wakaliweka” ni Kiswahili cha kawaida kinachoonyesha hatua iliyofuata.
- source_word: אֲרוֹן יְהוָה
  choice: sanduku la Yahweh
  rationale: Katika muktadha huu אֲרוֹן ni sanduku takatifu linalojulikana; “sanduku la Yahweh” ni wazi na linaendeleza istilahi ya kibiblia bila kulichanganya na kisanduku kingine kilichotajwa baadaye.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limewasilishwa kama jina binafsi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: אֶל הָעֲגָלָה
  choice: juu ya gari
  rationale: Kihusishi kinaonyesha kuwekwa kwenye gari; “juu ya gari” ni usemi wa asili wa Kiswahili katika muktadha huu.
- source_word: הָאַרְגַּז
  choice: kisanduku
  rationale: Neno hili linamaanisha chombo tofauti kilichobeba vitu vya sadaka. “Kisanduku” hukitofautisha kwa kawaida na sanduku la Yahweh.
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: panya wa dhahabu
  rationale: Muundo huu unamaanisha panya waliotengenezwa kwa dhahabu; “panya wa dhahabu” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: צַלְמֵי
  choice: sanamu za
  rationale: צֶלֶם humaanisha mfano au kitu kilichotengenezwa kuwakilisha kitu kingine; “sanamu” inafaa kwa maumbo yaliyotengenezwa hapa bila kudokeza kwamba yaliabudiwa.
- source_word: טְחֹרֵיהֶם
  choice: majipu yao
  rationale: Neno linahusu uvimbe wenye kuumiza uliowapata. “Majipu” ni neno la kawaida na linaloeleweka, huku utambulisho sahihi wa kitabibu ukibaki na utata.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. “Yahweh” hulihifadhi kama jina na kuepuka kulibadilisha kuwa “BWANA.”
- issue: Utambulisho wa ugonjwa unaoitwa טְחֹרִים
  choice: majipu
  alternative: uvimbe; bawasiri
  rationale: Maana halisi ya kitabibu haijulikani kwa uhakika. “Majipu” linaonyesha majeraha au uvimbe wenye kuumiza bila kuamua kimyakimya kwamba yalikuwa bawasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa wazi kwa wasomaji wa kawaida; “sanduku” na “kisanduku” vinatofautisha vitu viwili vya Kiebrania. Alama ya tanbihi imewekwa baada ya kirai kinachohusika.
