base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/010.yaml
  text: 'So the men did so: they took two milk cows and harnessed them to the cart[b][a], and shut up their calves in the house.'
translation:
  language: sw
  text: 'Basi wanaume hao wakafanya hivyo: wakachukua ng’ombe wawili wa kike waliokuwa wakitoa maziwa[a], wakawafunga kwenye mkokoteni, kisha wakawafungia ndama wao ndani ya nyumba[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ng’ombe wawili wa kike waliokuwa wakinyonyesha.” Kiebrania kinaeleza ng’ombe waliokuwa wakitoa maziwa na waliokuwa na ndama.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakawazuia ndama wao ndani ya nyumba.” Kiebrania husema kihalisi “wana wao” kwa watoto wa ng’ombe, yaani ndama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... כֵּן
  choice: wakafanya hivyo
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kwa ufupi kwamba walitekeleza maagizo yaliyotangulia.
- source_word: הָאֲנָשִׁים
  choice: wale wanaume
  rationale: Nomino ya Kiebrania hapa inarejelea wanaume mahususi waliotenda jambo hilo; ‘wale’ huunganisha kwa kawaida na wahusika waliotajwa katika muktadha.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: ng’ombe wawili wa kike waliokuwa wakinyonyesha
  rationale: פָרוֹת ni ng’ombe wa kike, na עָלוֹת hapa huwaeleza kama waliokuwa wakitoa maziwa na kunyonyesha ndama. Tafsiri hii inaweka wazi sifa muhimu kwa ishara inayofuata.
- source_word: וַיַּאַסְרוּם
  choice: wakawafunga
  rationale: Kitenzi אסר kimsingi ni ‘kufunga’; pamoja na gari, maana ni kuwafunga ng’ombe ili walivute. Kiswahili hiki ni cha kawaida na hakiongezi maelezo yasiyokuwamo wazi katika maandishi.
- source_word: בָּעֲגָלָה
  choice: kwenye gari
  rationale: עֲגָלָה ni gari la kubebea mizigo linalovutwa na wanyama. ‘Gari’ ni neno rahisi na la kawaida katika muktadha huu.
- source_word: וְאֶת בְּנֵיהֶם
  choice: ndama wao
  rationale: Ingawa בְּנֵיהֶם kihalisi ni ‘wana wao,’ kwa ng’ombe inarejelea watoto wao, yaani ndama.
- source_word: כָּלוּ בַבָּיִת
  choice: wakawafungia ... nyumbani
  rationale: Kitenzi kinaonyesha kuwazuia au kuwafungia ndani, na בַבָּיִת kihalisi ni ‘katika nyumba/nyumbani.’ ‘Nyumbani’ ni ya asili katika Kiswahili huku tanbihi ikihifadhi uwezekano wa ‘ndani ya nyumba.’
