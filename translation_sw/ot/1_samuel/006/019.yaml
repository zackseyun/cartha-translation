reference: 1 Samuel 6:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּ֞ךְ בְּ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ כִּ֤י רָאוּ֙ בַּ/אֲר֣וֹן יְהוָ֔ה וַ/יַּ֤ךְ בָּ/עָם֙ שִׁבְעִ֣ים אִ֔ישׁ חֲמִשִּׁ֥ים אֶ֖לֶף אִ֑ישׁ וַ/יִּֽתְאַבְּל֣וּ הָ/עָ֔ם כִּֽי הִכָּ֧ה יְהוָ֛ה בָּ/עָ֖ם מַכָּ֥ה גְדוֹלָֽה־־
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/019.yaml
  text: And he struck down some of the men of Beth-shemesh because they had looked into the ark of Yahweh[a]. He struck down seventy men among the people, fifty thousand men[b], and the people mourned because Yahweh had struck the people with a great blow.
translation:
  language: sw
  text: Naye akawaua baadhi ya wanaume wa Beth-shemeshi kwa sababu walitazama ndani ya sanduku la Yahwe[a]. Akawaua wanaume sabini miongoni mwa watu, wanaume elfu hamsini[b]. Watu wakaomboleza kwa sababu Yahwe aliwapiga watu kwa pigo kubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu walilitazama sanduku la Yahwe.” Kihusishi cha Kiebrania kinaweza kueleweka kwa maana hii pana zaidi, ingawa “walitazama ndani ya” huenda kikaeleza kosa lililotendwa katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema, “wanaume sabini, wanaume elfu hamsini,” usemi wenye utata. Huenda ukamaanisha “wanaume sabini kati ya wanaume elfu hamsini” au “wanaume elfu hamsini na sabini,” au huenda ukatokana na tatizo la maandishi; baadhi ya mashahidi wa kale huunga mkono idadi ndogo zaidi.
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּךְ
  choice: akawaua / alikuwa amewapiga
  rationale: Kitenzi נכה humaanisha kupiga; katika tukio hili matokeo ni kifo, kwa hiyo mara mbili za kwanza zimetafsiriwa ‘akawaua’. Mwishoni ‘alikuwa amewapiga ... kwa pigo kubwa’ huhifadhi urudiaji wa mzizi unaoonekana pia katika מַכָּה.
- source_word: בְּאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: baadhi ya wanaume wa Beth-shemeshi
  rationale: Muundo wenye בְּ una maana ya sehemu ya kundi, nayo אַנְשֵׁי ni ‘wanaume wa’. ‘Baadhi ya’ inaonyesha kwamba si wanaume wote wa mji waliouawa.
- source_word: כִּי רָאוּ בַּאֲרוֹן יְהוָה
  choice: kwa sababu walitazama ndani ya sanduku la Yahwe
  rationale: ראה pamoja na בְּ inaweza kumaanisha kulitazama sanduku au kutazama ndani yake. Muktadha wa kosa dhidi ya sanduku unaunga mkono ‘ndani ya’, lakini uwezekano mpana zaidi umehifadhiwa katika tanbihi.
- source_word: אֲרוֹן יְהוָה
  choice: sanduku la Yahwe
  rationale: ‘Sanduku’ ni neno la kawaida na linaloeleweka kwa אֲרוֹן katika muktadha wa sanduku takatifu; jina la agano יְהוָה limetoholewa kuwa ‘Yahwe’.
- source_word: שִׁבְעִים אִישׁ חֲמִשִּׁים אֶלֶף אִישׁ
  choice: wanaume sabini miongoni mwa watu, wanaume elfu hamsini
  rationale: Mpangilio mgumu wa idadi katika Andiko la Kimasora umehifadhiwa bila kuunganishwa kimya kuwa jumla moja au kutafsiriwa kama sehemu ya jumla.
- source_word: וַיִּתְאַבְּלוּ
  choice: wakaomboleza
  rationale: Hitpaeli ya אבל inaeleza kuomboleza baada ya kifo au maafa; ‘wakaomboleza’ ni Kiswahili cha sasa, cha heshima na cha kawaida.
- source_word: מַכָּה גְדוֹלָה
  choice: pigo kubwa
  rationale: Tafsiri hii huhifadhi maana ya msingi ya ‘pigo’ na uhusiano wake na kitenzi נכה bila kulifanya kwa lazima kuwa tauni au mauaji makubwa.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. ‘Yahwe’ hulihifadhi kama jina huku likifuata matamshi yanayotumika kwa urahisi katika Kiswahili.
- issue: Idadi ngumu ya waliokufa katika Andiko la Kimasora
  choice: Kuhifadhi mfuatano ‘wanaume sabini ... wanaume elfu hamsini’ katika andiko kuu
  alternative: wanaume sabini kati ya elfu hamsini; wanaume elfu hamsini na sabini; idadi ndogo zaidi
  rationale: Kiebrania kina muundo wenye utata mkubwa. Kuuhifadhi na kueleza uwezekano katika tanbihi huepuka kutatua kimya tatizo la kimaandishi na kifasiri.
- issue: 'Sababu ya hukumu: kutazama sanduku'
  choice: walitazama ndani ya sanduku
  alternative: walilitazama sanduku
  rationale: Kihusishi בְּ kinaweza kueleweka kwa namna zote mbili. ‘Ndani ya’ inafaa zaidi na kosa linalodokezwa na muktadha, lakini maana pana haijaondolewa na imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Wanaume’ huhifadhi jinsia ya maneno אַנְשֵׁי na אִישׁ, na ‘Beth-shemeshi’ ni utohozi unaosomeka kwa urahisi. Utata wa kutazama sanduku na wa idadi haujafichwa.
