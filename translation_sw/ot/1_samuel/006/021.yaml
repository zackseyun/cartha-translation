base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/021.yaml
  text: So they sent messengers to the inhabitants of Kiriath-jearim[a], saying, “The Philistines have returned the ark of Yahweh. Come down; bring it up to yourselves.”
translation:
  language: sw
  text: Basi wakatuma wajumbe kwa wakazi wa Kiriath-yearimu, wakisema, “Wafilisti wamelirudisha sanduku la Yahwe. Shukeni[a], mlipandisheni kwenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinatumia vitenzi vya kushuka na kupandisha: “shukeni” kisha “mlipandisheni.” Huenda vitenzi hivi vinaonyesha topografia kati ya Beth-shemeshi na Kiriath-yearimu.'
    reason: Ufafanuzi wa maana ya vitenzi vya kijiografia na taswira inayoweza kukusudiwa.
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Basi wakatuma
  rationale: Umbo la masimulizi linaendeleza mfuatano wa matukio; “Basi” linaonyesha mwendelezo huo kwa Kiswahili cha kawaida.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu neno linamaanisha watu waliotumwa kupeleka ujumbe, si malaika.
- source_word: יוֹשְׁבֵי קִרְיַת יְעָרִים
  choice: wakazi wa Kiriath-yearimu
  rationale: Kirai kinamaanisha watu wanaoishi mahali hapo; “wakazi” ni kifupi na cha kawaida, huku jina la mahali likinakiliwa kwa sauti.
- source_word: הֵשִׁבוּ פְלִשְׁתִּים
  choice: Wafilisti wamelirudisha
  rationale: Hifili ya שוב ina maana ya kusababisha kitu kirudi; wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye umuhimu wa sasa.
- source_word: אֲרוֹן יְהוָה
  choice: sanduku la Yahwe
  rationale: Muundo wa umilikaji umetafsiriwa moja kwa moja; “sanduku” ni neno linaloeleweka kwa chombo hiki kitakatifu, na jina la agano limewakilishwa kama Yahwe.
- source_word: רְדוּ
  choice: Shukeni
  rationale: Amri ya wingi ya ירד inaonyesha mwendo wa kushuka. “Shukeni” huhifadhi maana ya kijiografia bila kulazimisha tofauti ya ‘njooni’ au ‘endeni’ ambayo Kiebrania yenyewe haiamui wazi hapa.
- source_word: הַעֲלוּ אֹתוֹ אֲלֵיכֶם
  choice: mlipandishe kwenu
  rationale: Hifili ya עלה ina maana ya kukifanya kitu kipande; “kwenu” linahifadhi wazo la kulipeleka mahali walipo wale walioambiwa.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ni ya masimulizi ya kawaida; wingi wa amri umehifadhiwa, na lugha haiongezi maelezo yasiyokuwamo katika chanzo.
