  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/רְאִיתֶ֗ם אִם דֶּ֨רֶךְ גְּבוּל֤/וֹ יַֽעֲלֶה֙ בֵּ֣ית שֶׁ֔מֶשׁ ה֚וּא עָ֣שָׂה לָ֔/נוּ אֶת הָ/רָעָ֥ה הַ/גְּדוֹלָ֖ה הַ/זֹּ֑את וְ/אִם לֹ֗א וְ/יָדַ֨עְנוּ֙ כִּ֣י לֹ֤א יָד/וֹ֙ נָ֣גְעָה בָּ֔/נוּ מִקְרֶ֥ה ה֖וּא הָ֥יָה לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/009.yaml
  text: 'And watch: if it goes up by the way of its territory to Beth-shemesh[a], then he is the one who has done this great harm to us; but if not, then we will know that it was not his hand that struck us[b]; it happened to us by chance.'
translation:
  language: sw
  text: 'Nanyi mtazame: likipanda kwa njia ya eneo lake kuelekea Beth-shemeshi, basi ni yeye aliyetuletea janga hili kubwa[a]. Lakini kama sivyo, tutajua kwamba si mkono wake uliotupiga; jambo hilo lilitupata kwa bahati tu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “madhara haya makubwa” au “maafa haya makubwa.” Neno la Kiebrania linaweza kumaanisha madhara au maafa makali, si lazima uovu wa kimaadili.
    reason: lexical_alternative
  - marker: b
    text: Au “lilikuwa tukio la bahati kwetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Nanyi mtazame
  rationale: Kitenzi hiki ni agizo kwa wingi linalowataka waangalie matokeo ya jaribio; “mtazame” ni cha kawaida na kinafaa kwa kufuatilia mwendo.
- source_word: דֶּרֶךְ גְּבוּלוֹ
  choice: kwa njia inayoelekea eneo lake
  rationale: דֶּרֶךְ ni njia au barabara, na גְּבוּל inaweza kuwa mpaka au eneo. Kauli hii inaeleza njia inayoelekea katika eneo linalohusishwa na Sanduku, yaani nchi ya Israeli, bila kulazimisha maana finyu ya mpaka.
- source_word: יַעֲלֶה
  choice: likipanda
  rationale: עלה kwa kawaida ni “kupanda” au “kwenda juu.” Kiambishi cha ngeli ya “Sanduku” kinaonyesha mhusika anayefikiriwa katika muktadha, huku maana ya mwendo kuelekea Beth-shemeshi ikihifadhiwa.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Beth-shemeshi
  rationale: Jina la mahali limetoholewa kwa mwandiko na matamshi yanayosomeka kwa Kiswahili bila kulitafsiri kimaana.
- source_word: הוּא עָשָׂה לָנוּ
  choice: ni yeye aliyetuletea
  rationale: Kiwakilishi huru הוּא kina mkazo. “Ni yeye” kinahifadhi mkazo kwamba Mungu wa Israeli, wala si bahati, ndiye aliyesababisha yaliyowapata.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: janga hili kubwa
  rationale: רָעָה hapa linaweza kumaanisha madhara, maafa, au janga, si lazima uovu wa kimaadili. “Janga” linaeleza uzito wa pigo kwa Kiswahili cha kawaida.
- source_word: וְאִם לֹא
  choice: Lakini lisipofanya hivyo
  rationale: Hii inaonyesha matokeo yanayokinzana katika jaribio. Kuongeza “kufanya hivyo” kunafanya rejeo la masharti lieleweke kwa Kiswahili.
- source_word: וְיָדַעְנוּ
  choice: tutajua
  rationale: Katika mfuatano huu, umbo hilo linaonyesha hitimisho litakalotokana na jaribio.
- source_word: יָדוֹ נָגְעָה בָּנוּ
  choice: mkono wake uliotupiga
  rationale: “Mkono” ni taswira ya nguvu na tendo la Mungu; “ulitupiga” huonyesha athari ya hukumu vizuri kuliko “ulitugusa,” ambalo linaweza kuwa hafifu mno.
- source_word: מִקְרֶה הוּא הָיָה לָנוּ
  choice: jambo hilo lilitupata kwa bahati tu
  rationale: מִקְרֶה ni tukio la bahati au lisilokusudiwa. Kauli hii ni ya asili kwa Kiswahili na huhifadhi dai la Wafilisti kwamba huenda tukio hilo halikusababishwa na mkono wa Mungu.
theological_decisions:
- issue: Maana ya רָעָה inapohusishwa na tendo la Mungu
  choice: janga hili kubwa
  alternative: madhara haya makubwa; maafa haya makubwa; uovu huu mkubwa
  rationale: Katika muktadha, neno linaeleza pigo au maafa yaliyowapata Wafilisti. “Janga” halifichi ukali wa hukumu, lakini pia halidokezi bila msingi kwamba Mungu alifanya uovu wa kimaadili.
- issue: Uhusiano kati ya mkono wa Mungu na bahati
  choice: 'Jaribio linaweka wazi uwezekano wao wawili: ni yeye aliyesababisha janga, au liliwatokea kwa bahati'
  alternative: Kueleza moja kwa moja kwamba kwa hakika Mungu ndiye aliyelifanya
  rationale: Mstari unaripoti hoja ya masharti ya Wafilisti kabla ya matokeo ya jaribio. Tafsiri inahifadhi mvutano huo badala ya kuamua hitimisho mapema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia “lisipofanya hivyo” kwa uwazi wa kawaida, huku “mkono wake” ikidumisha taswira ya Kiebrania. Jina Beth-shemeshi limetoholewa badala ya kutafsiriwa.
