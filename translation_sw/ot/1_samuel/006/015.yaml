  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם הוֹרִ֣ידוּ אֶת אֲר֣וֹן יְהוָ֗ה וְ/אֶת הָ/אַרְגַּ֤ז אֲשֶׁר אִתּ/וֹ֙ אֲשֶׁר בּ֣/וֹ כְלֵֽי זָהָ֔ב וַ/יָּשִׂ֖מוּ אֶל הָ/אֶ֣בֶן הַ/גְּדוֹלָ֑ה וְ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ הֶעֱל֨וּ עֹל֜וֹת וַֽ/יִּזְבְּח֧וּ זְבָחִ֛ים בַּ/יּ֥וֹם הַ/ה֖וּא לַֽ/יהוָֽה׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/015.yaml
  text: And the Levites took down the ark of Yahweh[a], and the box that was with it, in which were the gold objects, and set them on the great stone[c][b]. And the men of Beth-shemesh offered burnt offerings and sacrificed sacrifices on that day to Yahweh.
translation:
  language: sw
  text: Walawi wakashusha sanduku la Yahweh[a] na kisanduku kilichokuwa pamoja nalo, ambamo vilikuwa vitu vya dhahabu[b]; wakaviweka juu ya jiwe kubwa[c]. Wanaume wa Beth-shemeshi wakatoa sadaka za kuteketezwa na wakachinja dhabihu[d] siku hiyo kwa Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh ni jina la Kiebrania YHWH, ambalo kwa desturi mara nyingi hutafsiriwa “BWANA.”
    reason: alternative_reading
  - marker: b
    text: Kiebrania kina neno pana linaloweza pia kutafsiriwa “vyombo vya dhahabu” au “vifaa vya dhahabu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kwenye jiwe kubwa”; kihusishi cha Kiebrania kinaweza kueleza kuelekea au kufikia mahali, na katika muktadha huu huenda vitu viliwekwa juu ya jiwe.
    reason: source_ambiguity
  - marker: d
    text: Kiebrania hutumia kitenzi na nomino zenye mzizi mmoja, kwa maana ya karibu “wakatoa dhabihu za dhabihu.” Kwa Kiswahili laini zaidi, “wakatoa dhabihu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם הוֹרִידוּ
  choice: Walawi wakashusha
  rationale: Hifili ya ירד inaonyesha kuviondoa sanduku na kisanduku kutoka kwenye gari kwa kuvishusha; Kiswahili hiki ni cha kawaida na cha moja kwa moja.
- source_word: אֲרוֹן יְהוָה
  choice: sanduku la Yahweh
  rationale: אֲרוֹן hapa ni sanduku takatifu la agano; “sanduku” ni istilahi inayoeleweka vizuri, huku jina la agano יְהוָה likitolewa kama “Yahweh.”
- source_word: הָאַרְגַּז אֲשֶׁר אִתּוֹ
  choice: kisanduku kilichokuwa pamoja nalo
  rationale: אַרְגַּז ni chombo tofauti na sanduku la Yahweh. “Kisanduku” kinakitofautisha kwa kawaida bila kudokeza umbo au matumizi yasiyotajwa.
- source_word: אֲשֶׁר בּוֹ כְלֵי זָהָב
  choice: ambacho ndani yake mlikuwa na vitu vya dhahabu
  rationale: כְּלֵי ni neno pana linaloweza kumaanisha vyombo, vifaa, au vitu; “vitu” halibainishi zaidi ya Kiebrania.
- source_word: וַיָּשִׂמוּ אֶל הָאֶבֶן הַגְּדוֹלָה
  choice: wakaviweka juu ya jiwe kubwa
  rationale: Katika muktadha huu שׂים pamoja na אֶל inaelekea kumaanisha kuweka vitu kwenye jiwe, ingawa kihusishi chenyewe kinaweza kuelekea maana ya “kwenye/kando ya”; utata huo umeonyeshwa katika tanbihi.
- source_word: וְאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: Wanaume wa Beth-shemeshi
  rationale: אַנְשֵׁי ni wingi wa kiume, na hakuna msingi wa wazi katika mstari huu wa kuibadili kuwa “watu.”
- source_word: הֶעֱלוּ עֹלוֹת
  choice: wakatoa sadaka za kuteketezwa
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili kueleza usemi wa dhabihu ambao kihalisi unahusu kuzipandisha sadaka zinazoteketezwa.
- source_word: וַיִּזְבְּחוּ זְבָחִים
  choice: wakachinja dhabihu
  rationale: Uundaji huu unadumisha kitendo halisi cha kuchinja katika mzizi זבח na mwangwi wa kitenzi na nomino bila kuwa mzito kupita kiasi katika Kiswahili.
- source_word: בַּיּוֹם הַהוּא לַיהוָה
  choice: siku hiyo kwa Yahweh
  rationale: “Siku hiyo” huhifadhi kishazi cha wakati, na “kwa Yahweh” humtaja anayepokea sadaka hizo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu, YHWH. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo; tanbihi inataja desturi nyingine iliyoenea.
- issue: Jinsia katika אַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: Wanaume wa Beth-shemeshi
  alternative: Watu wa Beth-shemeshi
  rationale: Nomino ya Kiebrania ni ya kiume, na muktadha hauonyeshi wazi kwamba ni neno jumuishi kwa wakazi wote; kwa hiyo jinsia ya maandishi imehifadhiwa.
- issue: Uhusiano kati ya sadaka za kuteketezwa na dhabihu nyingine
  choice: wakatoa sadaka za kuteketezwa na wakachinja dhabihu
  alternative: wakatoa sadaka za kuteketezwa na sadaka nyingine
  rationale: Maandishi yanatumia istilahi mbili, עֹלוֹת na זְבָחִים. Tafsiri haizichanganyi wala kuamua aina mahususi ya dhabihu za kundi la pili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya masimulizi ya Biblia. Sentensi imewekwa wazi bila kuondoa marudio na tofauti za istilahi za dhabihu katika Kiebrania.
