  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini rahisi kueleweka. Jina Beth-shemesh limetoholewa kuwa Beth-shemeshi ili litamkike kwa urahisi kwa wasomaji wa Kiswahili. Hakuna tanbihi iliyohitajika; taarifa muhimu za kileksika zimewasilishwa moja kwa moja katika maandishi.
