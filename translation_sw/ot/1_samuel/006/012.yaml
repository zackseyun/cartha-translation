base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/012.yaml
  text: And the cows went straight on the road toward Beth-shemesh[a], along one highway; they went on, lowing as they went, and did not turn aside to the right or to the left[c][b]. And the lords of the Philistines were walking behind them as far as the border of Beth-shemesh.
translation:
  language: sw
  text: Nao ng’ombe wa kike wakaenda moja kwa moja katika njia ya kuelekea Beth-shemeshi, wakifuata barabara moja; waliendelea kwenda huku wakilia, bila kugeuka kwenda kulia wala kushoto. Nao watawala wa Wafilisti walikuwa wakitembea nyuma yao hadi mpaka wa Beth-shemeshi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִשַּׁרְנָה
  choice: wakaenda moja kwa moja
  rationale: Kitenzi cha mzizi ישר kinaonyesha mwendo wa moja kwa moja bila kupotoka; usemi huu ni wa kawaida na sahihi katika Kiswahili.
- source_word: הַפָּרוֹת
  choice: ng’ombe hao
  rationale: Muktadha wa mistari 7 na 10 unaonyesha ng’ombe wa kike waliokuwa wakikamuliwa; katika Kiswahili cha kawaida, ‘ng’ombe’ ni neno la asili na muktadha tayari hubainisha jinsia yao.
- source_word: בַּדֶּרֶךְ עַל דֶּרֶךְ בֵּית שֶׁמֶשׁ
  choice: katika njia ya kuelekea Beth-shemeshi
  rationale: Marudio ya דרך yanasisitiza njia maalumu na mwelekeo wake; Kiswahili hiki huhifadhi mwelekeo bila marudio yasiyo ya kawaida.
- source_word: בִּמְסִלָּה אַחַת
  choice: wakifuata barabara moja
  rationale: מְסִלָּה ni barabara au njia iliyotengenezwa; ‘barabara moja’ huhifadhi msisitizo wa njia moja maalumu bila kuleta taswira ya barabara kuu ya kisasa.
- source_word: הָלְכוּ הָלוֹךְ
  choice: waliendelea kwenda
  rationale: Muundo wa kitenzi na infinitivu kamili una nguvu ya mwendelezo; ‘waliendelea kwenda’ huwasilisha hali hiyo kwa uwazi.
- source_word: וְגָעוֹ
  choice: huku wakilia
  rationale: Kitenzi kinataja sauti ya ng’ombe. ‘Wakilia’ ni usemi wa kawaida kuhusu sauti ya mnyama na pia huhifadhi uwezekano wa sauti yenye huzuni katika muktadha wa ndama wao kuachwa.
- source_word: וְלֹא סָרוּ יָמִין וּשְׂמֹאול
  choice: bila kugeuka kwenda kulia wala kushoto
  rationale: Huhifadhi nahau ya Kiebrania ya kutopotoka kutoka kwenye njia kwa Kiswahili cha kawaida.
- source_word: וְסַרְנֵי פְלִשְׁתִּים
  choice: watawala wa Wafilisti
  rationale: סַרְנֵי ni cheo cha watawala wa majiji ya Wafilisti; ‘watawala’ ni wazi na hakileti maana ya umiliki wa kifalme isiyokusudiwa.
- source_word: הֹלְכִים אַחֲרֵיהֶם
  choice: waliwafuata
  rationale: Ingawa Kiebrania kinaeleza mwendo endelevu nyuma yao, ‘waliwafuata’ ni Kiswahili asilia kinachowasilisha tendo hilo bila uzito usiohitajika.
- source_word: עַד גְּבוּל בֵּית שָׁמֶשׁ
  choice: mpaka kwenye mpaka wa Beth-shemeshi
  rationale: גְּבוּל hapa ina maana ya mpaka wa eneo; urudiaji wa ‘mpaka’ katika Kiswahili una maana mbili tofauti na unabaki wazi katika muktadha.
