base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/020.yaml
  text: Then the men of Beth-shemesh said[a], “Who is able to stand before Yahweh, this holy God? And to whom shall he go up from us?”
translation:
  language: sw
  text: Ndipo wanaume wa Beth-shemeshi wakasema, “Ni nani awezaye kusimama mbele ya Yahwe, Mungu huyu mtakatifu? Na atapanda kutoka kwetu kwenda kwa nani?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nalo litapanda kutoka kwetu kwenda kwa nani?”—huenda ikirejelea sanduku la Yahwe.
    reason: Usomaji mbadala unaohifadhi uwezekano kwamba mtendaji asiyeelezwa wazi ni sanduku la Yahwe.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ndipo ... wakasema
  rationale: Muundo wa waw-consecutive unasogeza simulizi mbele; “Ndipo” unaonyesha mfuatano wa tukio kwa Kiswahili cha kawaida.
- source_word: אַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: wanaume wa Beth-shemeshi
  rationale: Neno la Kiebrania linamaanisha kihalisi “wanaume wa”; tafsiri haibadilishi kwa “watu” bila sababu ya kimatini.
- source_word: מִי יוּכַל
  choice: Ni nani awezaye
  rationale: Inahifadhi swali kuhusu uwezo na uzito wa kutoweza kustahimili uwepo wa Mungu.
- source_word: לַעֲמֹד לִפְנֵי
  choice: kusimama mbele za
  rationale: Ni usemi wa kawaida unaoweza kumaanisha kusimama au kudumu katika uwepo wa mwenye mamlaka; tafsiri inahifadhi taswira ya asili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: הָאֱלֹהִים הַקָּדוֹשׁ הַזֶּה
  choice: Mungu huyu mtakatifu
  rationale: Inahifadhi utakatifu na nguvu ya kiashiria הַזֶּה, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: וְאֶל מִי יַעֲלֶה
  choice: Naye atapanda kwenda kwa nani
  rationale: “Kupanda kwenda” huhifadhi maana ya עלה na swali la anakoelekea. Kiwakilishi kinafuata umbo la kiume la kitenzi cha Kiebrania, huku tanbihi ikieleza rejeo linalowezekana.
- source_word: מֵעָלֵינוּ
  choice: kutoka kwetu
  rationale: Inatoa kwa ufupi mwendo wa kuondoka katika eneo lao bila kuongeza maelezo yasiyosemwa wazi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia jina la agano lenyewe, kwa hiyo jina hilo linahifadhiwa badala ya kuwekwa cheo.
- issue: Mtendaji asiyeelezwa wazi wa יַעֲלֶה
  choice: Naye atapanda
  alternative: Nalo litapanda, likirejelea sanduku la Yahwe
  rationale: Kitenzi cha Kiebrania ni cha umoja wa kiume lakini hakitaji mtendaji. Muktadha huenda unaelekeza kwa sanduku, ila tafsiri kuu haipaswi kufuta utata huo; uwezekano huo umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Mbele za” na “awezaye” vina uzito wa heshima bila kuwa vya kizamani kupita kiasi. Jina la mahali limetoholewa kuwa “Beth-shemeshi.”
