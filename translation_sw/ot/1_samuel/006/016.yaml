lexical_decisions:
- source_word: וַ/חֲמִשָּׁה סַרְנֵי פְלִשְׁתִּים
  choice: wale watawala watano wa Wafilisti
  rationale: Kirai hiki kinawatambulisha viongozi watano wa Wafilisti waliokwisha tajwa katika simulizi. “Watawala” linaonyesha mamlaka yao ya kisiasa kwa Kiswahili cha sasa, huku “wale” likionyesha kuwa ni watu wanaojulikana katika muktadha.
- source_word: סַרְנֵי
  choice: watawala
  rationale: סֶרֶן ni cheo maalumu cha viongozi wa miji ya Wafilisti. “Watawala” ni neno la kawaida na lenye heshima linalowasilisha mamlaka yao bila kutumia cheo cha kidini au cha kifalme kisichothibitishwa na neno la Kiebrania.
- source_word: רָאוּ
  choice: walipoona hayo
  rationale: Kiebrania kinasema tu “waliona” bila kutaja kitu kilichoonekana. Kiswahili huhitaji muktadha huu uwasilishwe kwa ulaini; “hayo” hurejelea mambo yaliyotokea na kusimuliwa mara moja kabla, bila kuyafafanua zaidi.
- source_word: וַ/יָּשֻׁבוּ
  choice: walirudi
  rationale: Kitenzi שוב katika mfuatano wa simulizi kinaonyesha kurudi kwao baada ya kuona yaliyotokea. “Walirudi” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: עֶקְרוֹן
  choice: Ekroni
  rationale: Jina la mahali limetoholewa kwa muundo wa kawaida wa Kiswahili; umbo la mahali “Ekroni” linaonyesha kwamba huko ndiko walikorudi bila kuhitaji kihusishi cha ziada.
- source_word: בַּ/יּוֹם הַ/הוּא
  choice: siku iyo hiyo
  rationale: Maana ya msingi ni “siku hiyo.” Katika simulizi, “siku iyo hiyo” huonyesha kwa kawaida kwamba walirudi bila kungoja siku nyingine.
