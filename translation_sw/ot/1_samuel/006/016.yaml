  text: When the five rulers of the Philistines saw it[b][a], they returned to Ekron that same day.
translation:
  language: sw
  text: Wale watawala watano wa Wafilisti[b] walipoona hayo, walirudi Ekroni siku hiyo hiyo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “siku hiyo.”'
    reason: lexical_alternative
  - marker: b
    text: Cheo cha Kifilisti סַרְנֵי kinaweza pia kutafsiriwa “wakuu.”
