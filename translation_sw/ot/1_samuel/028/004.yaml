  text: וַ/יִּקָּבְצ֣וּ פְלִשְׁתִּ֔ים וַ/יָּבֹ֖אוּ וַ/יַּחֲנ֣וּ בְ/שׁוּנֵ֑ם וַ/יִּקְבֹּ֤ץ שָׁאוּל֙ אֶת כָּל יִשְׂרָאֵ֔ל וַֽ/יַּחֲנ֖וּ בַּ/גִּלְבֹּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/004.yaml
  text: The Philistines gathered and came and camped at Shunem[a], and Saul gathered all Israel[b], and they camped at Gilboa.
translation:
  language: sw
  text: Wafilisti wakakusanyika, wakaja, wakapiga kambi huko Shunemu. Naye Sauli akawakusanya Waisraeli wote, nao wakapiga kambi huko Gilboa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “juu ya Gilboa,” au “kwenye Mlima Gilboa,” kwa kuwa jina hili linahusu eneo la miinuko ya Gilboa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ פְלִשְׁתִּים
  choice: Wafilisti wakakusanyika
  rationale: Kitenzi קבץ kina maana ya kukusanyika au kukusanya. Muundo wa kujirejelea ‘wakakusanyika’ unaonyesha kwamba Wafilisti wenyewe ndio waliokusanyika, huku ukihifadhi maana ya kijeshi bila kuiongeza.
- source_word: וַיָּבֹאוּ
  choice: wakaja
  rationale: בוא ni kitenzi cha kawaida cha mwendo, ‘kuja.’ Tafsiri hii inadumisha mfuatano rahisi wa simulizi bila kuongeza wazo la kushambulia au kusonga mbele.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: חנה humaanisha kuweka au kupiga kambi. ‘Kupiga kambi’ ni Kiswahili cha sasa, cha kawaida na kinachoeleweka vizuri.
- source_word: בְשׁוּנֵם
  choice: huko Shunemu
  rationale: Kihusishi בְ־ huonyesha mahali. ‘Huko Shunemu’ ni usemi wa asili wa Kiswahili kwa eneo lililotajwa katika simulizi.
- source_word: וַיִּקְבֹּץ שָׁאוּל
  choice: Naye Sauli akawakusanya
  rationale: 'Hapa קבץ ni kitenzi elekezi: Sauli aliwakusanya wengine. ‘Naye’ huonyesha kwa kawaida badiliko la mhusika kutoka kwa Wafilisti kwenda kwa Sauli.'
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: Waisraeli wote
  rationale: Ingawa Kiebrania kinasema kihalisi ‘Israeli wote,’ usemi wa Kiswahili ‘Waisraeli wote’ huwasilisha kwa kawaida maana ya pamoja ya taifa au jeshi bila kuibana wazi kwa wanaume pekee.
- source_word: בַּגִּלְבֹּעַ
  choice: huko Gilboa
  rationale: Maandishi yanataja Gilboa bila kuongeza neno ‘mlima.’ ‘Huko Gilboa’ huhifadhi jina la mahali na kuepuka kuongeza maelezo ya kijiografia yasiyotajwa moja kwa moja.
