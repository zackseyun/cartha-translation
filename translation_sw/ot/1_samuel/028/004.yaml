  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wenye hadhi lakini wa kawaida. Mfuatano wa vitenzi vya Kiebrania umehifadhiwa kwa vitenzi vya ‘waka-’. ‘Kupiga kambi’ limetumiwa mara zote mbili kwa ulinganifu wa kileksika.
