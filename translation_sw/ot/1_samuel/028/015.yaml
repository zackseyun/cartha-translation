  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לָ֥/מָּה הִרְגַּזְתַּ֖/נִי לְ/הַעֲל֣וֹת אֹתִ֑/י וַ/יֹּ֣אמֶר שָׁ֠אוּל צַר לִ֨/י מְאֹ֜ד וּ/פְלִשְׁתִּ֣ים נִלְחָמִ֣ים בִּ֗/י וֵֽ/אלֹהִ֞ים סָ֤ר מֵֽ/עָלַ/י֙ וְ/לֹֽא עָנָ֣/נִי ע֗וֹד גַּ֤ם בְּ/יַֽד הַ/נְּבִיאִם֙ גַּם בַּ֣/חֲלֹמ֔וֹת וָ/אֶקְרָאֶ֣/ה לְ/ךָ֔ לְ/הוֹדִיעֵ֖/נִי מָ֥ה אֶעֱשֶֽׂה־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/015.yaml
  text: Then Samuel said to Saul[a], “Why have you disturbed me by bringing me up?” Saul answered, “I am in great distress. The Philistines are fighting against me, and God has turned away from me and no longer answers me, either by prophets or by dreams[b]. So I have called you to tell me what I should do.”
translation:
  language: sw
  text: Ndipo Samueli akamwambia Sauli, “Kwa nini umenisumbua kwa kunipandisha[a]?” Sauli akajibu, “Niko katika dhiki kubwa. Wafilisti wanapigana dhidi yangu, na Mungu amejitenga nami; hanijibu tena, wala kwa njia ya manabii[b] wala kwa ndoto. Kwa hiyo nimekuita ili unijulishe nifanye nini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kunileta juu.”
    reason: ‘Kunipandisha’ huhifadhi taswira ya Kiebrania; ‘kunileta juu’ ni tafsiri nyingine ya kitenzi hicho katika muktadha huu.
  - marker: b
    text: Kiebrania ni “kwa mkono wa manabii,” nahau yenye maana ya “kwa njia ya manabii.”
    reason: Maelezo haya huhifadhi muundo halisi wa Kiebrania huku maandishi makuu yakitumia nahau ya kawaida ya Kiswahili.
lexical_decisions:
- source_word: הִרְגַּזְתַּנִי
  choice: umenisumbua
  rationale: Kitenzi hiki kina maana ya kusababisha hali ya kutotulia, usumbufu au fadhaa. ‘Umenisumbua’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kufafanua zaidi namna Samueli alivyoitwa.
- source_word: לְהַעֲלוֹת אֹתִי
  choice: kwa kunipandisha
  rationale: Neno עלה lina picha ya kuelekea au kuleta juu. ‘Kunipandisha’ huhifadhi taswira ya Samueli kuitwa kutoka chini bila kutumia lugha inayoweza kudokeza ufufuo.
- source_word: צַר לִי מְאֹד
  choice: Niko katika dhiki kubwa
  rationale: Kirai hiki huonyesha hali ya kubanwa na kufadhaika sana. Tafsiri hii ni ya asili, yenye hadhi, na inaeleweka kwa wasomaji wa kawaida.
- source_word: נִלְחָמִים בִּי
  choice: wanapigana dhidi yangu
  rationale: Muundo huu unaonyesha mapambano ya kijeshi yanayoelekezwa kwa Sauli. ‘Dhidi yangu’ huwasilisha uadui huo waziwazi.
- source_word: וֵאלֹהִים סָר מֵעָלַי
  choice: Mungu amejitenga nami
  rationale: סור מעל huonyesha kuondoka au kujiondoa kwa upande wa mtu. ‘Amejitenga nami’ huhifadhi wazo la kuvunjika kwa ukaribu bila kuongeza madai kuhusu kutokuwapo kwa Mungu kabisa.
- source_word: וְלֹא עָנָנִי עוֹד
  choice: Hanijibu tena
  rationale: ענה hapa ni kujibu, na עוד pamoja na ukanushi huonyesha kwamba jibu lililokuwapo halipatikani tena.
- source_word: גַּם בְּיַד הַנְּבִיאִם גַּם בַּחֲלֹמוֹת
  choice: iwe kupitia kwa manabii au kwa ndoto
  rationale: Muundo wa גַּם ... גַּם unataja njia mbili za ufunuo ambazo sasa hazitoi jibu. ‘Kupitia kwa manabii’ huwasilisha nahau ‘kwa mkono wa manabii’ kwa Kiswahili cha kawaida.
- source_word: וָאֶקְרָאֶה לְךָ
  choice: Kwa hiyo nimekuita
  rationale: קרא pamoja na ל inaweza kumaanisha kumwita au kumleta mtu kwa wito. ‘Nimekuita’ ni ya moja kwa moja na haiingizi istilahi maalumu za uchawi ambazo hazipo katika kirai hiki.
- source_word: לְהוֹדִיעֵנִי מָה אֶעֱשֶׂה
  choice: ili unijulishe nifanye nini
  rationale: Hifili ya ידע ni kufanya jambo lijulikane. ‘Unijulishe nifanye nini’ huwasilisha ombi la Sauli la kupewa mwongozo kwa Kiswahili cha asili.
theological_decisions:
- issue: Utambulisho na hali ya Samueli katika simulizi la kumwita aliyekufa
  choice: Kutafsiri moja kwa moja kwamba Samueli ndiye anayesema na Sauli, kama simulizi la Kiebrania linavyosema.
  alternative: Kumweleza msemaji kuwa roho inayejifanya Samueli, mzuka, au mtazamo wa mwanamke mwenye pepo.
  rationale: Andiko linasema wazi, ‘Samueli akamwambia Sauli.’ Tafsiri inafuata namna simulizi linavyomwasilisha msemaji bila kuamua mijadala ya kitheolojia kuhusu utaratibu au asili ya tukio hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa sasa na hadhi ya kisimulizi. Majina ‘Samueli,’ ‘Sauli,’ na ‘Wafilisti’ yanafuata matumizi yaliyozoeleka katika tafsiri za Biblia za Kiswahili. Lugha imehifadhi taswira ya kupandishwa na ukimya wa Mungu bila kuongeza maelezo ya kimadhehebu kuhusu tukio.
