base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/002.yaml
  text: David said to Achish[a], “Then you yourself will know what your servant can do.” And Achish said to David, “Very well[b], I will make you my bodyguard for all your days.”
translation:
  language: sw
  text: Daudi akamwambia Akishi, “Basi wewe mwenyewe utajua mtumishi wako atakachofanya.[a]” Naye Akishi akamwambia Daudi, “Basi, nitakuweka kuwa mlinzi wangu binafsi[b] siku zote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anachoweza kufanya.” Maneno ya Daudi yanaweza kueleweka kwa zaidi ya njia moja.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “mlinzi kwa ajili ya kichwa changu,” yaani mlinzi wa karibu wa mtu wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Basi
  rationale: Katika kauli zote mbili neno hili linaunganisha jibu na yaliyotangulia; “Basi” ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: אַתָּה תֵדַע
  choice: wewe mwenyewe utajua
  rationale: Kiwakilishi cha wazi אַתָּה kinaweka msisitizo kwa mhusika; “wewe mwenyewe” kinauhifadhi kwa njia ya asili.
- source_word: אֵת אֲשֶׁר יַעֲשֶׂה
  choice: atakachofanya
  rationale: Hii inafuata maana ya moja kwa moja, “kile ambacho atafanya,” bila kuamua kwa niaba ya msomaji kama Daudi anaahidi kitendo gani.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Hapa ni namna ya unyenyekevu ya kujitaja mbele ya mtawala, si lazima hali ya utumwa.
- source_word: שֹׁמֵר לְרֹאשִׁי
  choice: mlinzi wangu binafsi
  rationale: Ingawa kwa muundo ni “mlinzi wa kichwa changu,” msemo unamaanisha mlinzi wa mtu wa karibu; tafsiri hii huwasilisha jukumu hilo wazi katika Kiswahili.
- source_word: אֲשִׂימְךָ
  choice: nitakuweka kuwa
  rationale: Kitenzi שׂים kina maana ya kuweka au kuteua; muundo huu unafaa kwa kumpa mtu wadhifa.
- source_word: כָּל הַיָּמִים
  choice: siku zote
  rationale: Huhifadhi usemi wa Kiebrania wa kudumu bila kuongeza neno “zako,” ambalo halipo katika matini.
theological_decisions:
- issue: Utata wa jibu la Daudi
  choice: atakachofanya
  alternative: anachoweza kufanya
  rationale: Wakati ujao wa Kiebrania unasema kwa karibu zaidi “atakachofanya,” huku muktadha ukiacha kusudi halisi la Daudi bila kufafanuliwa. Tanbihi inaonyesha uwezekano mwingine wa kimatumizi bila kuondoa utata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi ya kibiblia lakini kinachoeleweka kwa msomaji wa leo. “Akamwambia” huhifadhi mfululizo wa masimulizi; “mlinzi wangu binafsi” huepuka tafsiri isiyo ya kawaida ya msemo wa Kiebrania.
