base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/001.yaml
  text: In those days the Philistines gathered their camps for war[a], to fight against Israel. And Achish said to David, “You surely know that you and your men must go out with me in the camp.”
translation:
  language: sw
  text: Siku hizo, Wafilisti walikusanya vikosi vyao kwa ajili ya vita ili kupigana na Israeli. Akishi akamwambia Daudi, “Bila shaka unajua kwamba wewe pamoja na watu wako mtakwenda nami vitani[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtatoka pamoja nami katika kambi.” Neno la Kiebrania linaweza kumaanisha kambi yenyewe au, kwa upana, jeshi lililopiga kambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: Siku hizo
  rationale: Hutoa utangulizi wa wakati na mpito wa simulizi kwa Kiswahili cha kawaida bila kuongeza neno lisilokuwapo kama ‘sasa.’
- source_word: וַיִּקְבְּצוּ פְלִשְׁתִּים אֶת מַחֲנֵיהֶם
  choice: Wafilisti walikusanya vikosi vyao
  rationale: מַחֲנֶה kimsingi ni ‘kambi,’ lakini katika muktadha wa kijeshi inaweza kumaanisha jeshi au kikosi kilichopiga kambi. ‘Vikosi vyao’ ni ya asili zaidi hapa kuliko ‘kambi zao’ na inaonyesha kwamba watu wa vita ndio waliokusanywa.
- source_word: לַצָּבָא לְהִלָּחֵם בְּיִשְׂרָאֵל
  choice: kwa ajili ya vita ili kupigana na Israeli
  rationale: Inahifadhi kusudi la mkusanyiko wa kijeshi na mwelekeo wa uadui dhidi ya Israeli kwa lugha wazi.
- source_word: יָדֹעַ תֵּדַע
  choice: Bila shaka unajua
  rationale: Muundo wa kitenzi kisicho na kikomo pamoja na kitenzi kamili unatia mkazo. Kauli hii ya Kiswahili huhifadhi msisitizo wa uhakika bila kuifanya amri.
- source_word: אִתִּי תֵּצֵא בַמַּחֲנֶה
  choice: mtakwenda nami vitani[a]
  rationale: Kauli ya Kiebrania ina maana halisi ya kwenda au kutoka pamoja na Akishi katika kambi au jeshi. ‘Kwenda nami vitani’ huwasilisha kwa Kiswahili cha asili maana ya kushiriki katika msafara wa kijeshi, huku tanbihi ikihifadhi picha halisi na upeo wa maana wa מַחֲנֶה.
- source_word: אַתָּה וַאֲנָשֶׁיךָ
  choice: wewe pamoja na watu wako
  rationale: Inahifadhi msisitizo juu ya Daudi mwenyewe na watu wake.
- source_word: אָכִישׁ
  choice: Akishi
  rationale: Jina limetoholewa kwa tahajia inayofaa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Akisi akamwambia’ hudumisha mwendelezo wa masimulizi, na ‘vitani’ huepuka usemi mgumu wa moja kwa moja kama ‘katika jeshi.’
