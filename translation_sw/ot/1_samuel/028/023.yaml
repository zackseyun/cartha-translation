base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/023.yaml
  text: But he refused and said[a], “I will not eat.” Yet his servants, along with the woman, urged him, and he listened to their voice[c][b]. So he rose from the ground and sat on the bed.
translation:
  language: sw
  text: Lakini akakataa na kusema, “Sitakula.” Hata hivyo, watumishi wake pamoja na yule mwanamke wakamsisitiza sana, naye akawasikiliza.[a] Basi akainuka kutoka chini na kuketi juu ya kitanda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “akaisikiliza sauti yao.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linalotafsiriwa “kitanda” linaweza pia kumaanisha kochi au divani.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: akakataa
  rationale: Kitenzi מָאֵן kinaonyesha kukataa au kutokuwa tayari; “akakataa” ni tafsiri ya moja kwa moja na ya kawaida katika simulizi.
- source_word: לֹא אֹכַל
  choice: Sitakula
  rationale: Kauli hii rahisi ya moja kwa moja huhifadhi uamuzi wa Sauli wa kutokula bila kuongeza kitu kisichotajwa katika Kiebrania.
- source_word: וַיִּפְרְצוּ בוֹ
  choice: wakamsisitiza sana
  rationale: Nahau פרץ ב hapa inaonyesha kumsonga mtu kwa msisitizo, si kuvunja kihalisi. “Wakamsisitiza sana” huwasilisha nguvu ya ushawishi wao kwa Kiswahili cha kawaida.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika muktadha huu wa mfalme, neno hilo linawahusu watu waliokuwa wakimhudumia Sauli; “watumishi” halisisitizi hali ya utumwa isiyo kiini cha mstari huu.
- source_word: וְגַם הָאִשָּׁה
  choice: pamoja na yule mwanamke
  rationale: Huhifadhi maana ya kuongeza mwanamke kwa watumishi kama washiriki wa kumsisitiza Sauli.
- source_word: וַיִּשְׁמַע לְקֹלָם
  choice: naye akawasikiliza
  rationale: Nahau ya Kiebrania ni kihalisi “akaisikiliza sauti yao,” lakini katika Kiswahili “akawasikiliza” huwasilisha maana ya kuitikia ombi lao bila kulazimisha maana pana ya kutii.
- source_word: מֵהָאָרֶץ
  choice: kutoka chini
  rationale: Katika muktadha huu אֶרֶץ ni sehemu ya chini ambako Sauli alikuwa amelala; “kutoka chini” ni ya kawaida na haidai kama palikuwa sakafu au ardhi wazi.
- source_word: וַיֵּשֶׁב אֶל הַמִּטָּה
  choice: kuketi kitandani
  rationale: מִטָּה inaweza kumaanisha kitanda au kochi la kulalia. “Kitandani” ni tafsiri ya kawaida, huku uwezekano mwingine ukielezwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida lakini wenye hadhi. Muundo “akakataa na kusema” umehifadhi uratibu wa Kiebrania; “wakamsisitiza sana” huonyesha nguvu ya nahau ya chanzo. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
