  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: mfalme anamwambia mwanamke asiogope na kumuuliza analoona; kisha mwanamke anamwambia Sauli juu ya kiumbe anayeonekana akipanda kutoka ardhini. Wakati wa sasa katika “Unaona nini?” unaendana na muktadha wa ono, huku tanbihi ikihifadhi uwezekano wa umbo timilifu la Kiebrania.'
