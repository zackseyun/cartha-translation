base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/013.yaml
  text: The king said to her[a], “Do not be afraid. What do you see?” And the woman said to Saul[b], “I see a divine being coming up from the earth.”
translation:
  language: sw
  text: Mfalme akamwambia, “Usiogope. Unaona nini?[a]” Yule mwanamke akamwambia Sauli, “Ninaona kiumbe cha kimungu[b] kikipanda kutoka ardhini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Umeona nini?” Kitenzi cha Kiebrania kina umbo la tendo lililokamilika, ingawa katika muktadha kinaweza kumaanisha jambo analoliona wakati huo.'
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania אֱלֹהִים lina umbo la wingi, na kitenzi kinacholifuata pia ni cha wingi; kwa hiyo inaweza pia kutafsiriwa “miungu.” Katika muktadha linaweza kumaanisha kiumbe cha kimungu.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Kiebrania kinatumia nomino ya kawaida yenye kibainishi, si jina la Sauli; ‘Mfalme’ huhifadhi mtindo wa simulizi.
- source_word: אַל תִּירְאִי
  choice: Usiogope
  rationale: Ni katazo la moja kwa moja kwa mwanamke mmoja, na huu ndio usemi wa kawaida na wa asili katika Kiswahili cha sasa.
- source_word: כִּי מָה רָאִית
  choice: Unaona nini?
  rationale: Ingawa רָאִית ni kitenzi cha hali timilifu, muktadha wa maono yanayotokea papo hapo unaruhusu swali la wakati wa sasa. כִּי haijalazimishwa kuwa ‘kwa maana’ kwa kuwa mgawanyo wa sentensi unatoa Kiswahili cha asili.
- source_word: הָאִשָּׁה
  choice: Yule mwanamke
  rationale: Maandishi yanasema tu ‘mwanamke’; ‘yule’ humrejelea mwanamke aliyetajwa katika muktadha bila kuingiza cheo cha kimafasiri kama ‘mwenye pepo’.
- source_word: אֱלֹהִים
  choice: kiumbe cha kimungu
  rationale: Neno hili lina umbo la wingi, lakini hapa linaweza kueleza kiumbe kisicho cha kawaida kinachoonekana. Tafsiri hii haikitambulishi kuwa Mungu wala kulazimisha maana ya miungu mingi.
- source_word: עֹלִים
  choice: kikipanda
  rationale: Kitenzi kishirikishi cha עלה kinaonyesha mwendo wa kwenda juu. Upatanisho wa Kiswahili umefuata nomino ya umoja ‘kiumbe,’ huku umbo la wingi la Kiebrania likielezwa katika tanbihi.
- source_word: מִן הָאָרֶץ
  choice: kutoka ardhini
  rationale: Huhifadhi picha ya kupanda kutoka chini; ‘ardhini’ ni ya asili na pana kuliko kutaja shimo au kaburi ambalo halipo katika mstari.
theological_decisions:
- issue: Jinsi ya kutafsiri אֱלֹהִים katika taarifa ya mwanamke
  choice: kiumbe cha kimungu
  alternative: miungu; Mungu; kiumbe cha rohoni
  rationale: Mstari unasimulia kile mwanamke anachodai kuona, wala hautoi tamko la mwandishi kuhusu utambulisho wake. Chaguo hili huhifadhi hali ya kiumbe kisicho cha kawaida bila kuidhinisha miungu mingi au kukitambulisha na Mungu mwenyewe; umbo la wingi linahifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa sasa. ‘Akamwambia’ hudumisha mfululizo wa matendo; sentensi fupi katika maneno ya mfalme ni ya asili. Alama zote za tanbihi zimewekwa mahali panapohusika moja kwa moja.
