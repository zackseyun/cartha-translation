  terminology: '“Kiumbe cha kimungu” ni chaguo la tahadhari linalofaa kwa אֱלֹהִים katika muktadha huu: halimtambulishi kiumbe huyo na Mungu wala halilazimishi maana ya miungu wengi. Tanbihi inaeleza kwa usahihi umbo la wingi la אֱלֹהִים na participle עֹלִים. Majina na istilahi nyingine, hasa “Mfalme,” “Sauli,” na “mwanamke,” zimetumiwa kwa uaminifu.'
