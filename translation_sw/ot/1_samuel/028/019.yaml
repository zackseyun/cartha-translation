base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/019.yaml
  text: And Yahweh will also give Israel with you into the hand of the Philistines[a], and tomorrow you and your sons will be with me[b]. Yahweh will also give the camp of Israel into the hand of the Philistines.
translation:
  language: sw
  text: Yahwe pia atawatia Israeli pamoja nawe mikononi mwa Wafilisti; na kesho wewe na wanao mtakuwa pamoja nami.[a] Yahwe pia ataitia kambi ya Israeli mikononi mwa Wafilisti.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja nami katika kifo” au “pamoja nami katika Kuzimu.” Kiebrania kinasema tu “pamoja nami.”
    reason: alternative_reading
  - marker: b
    text: Au, “jeshi la Israeli.” Neno la Kiebrania linaweza kumaanisha “kambi” au, katika muktadha huu, “jeshi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la Mungu lililoandikwa katika Kiebrania badala ya kulibadili kuwa cheo kama “BWANA”.
- source_word: וְיִתֵּן / יִתֵּן ... בְּיַד
  choice: atawatia / ataitia ... mikononi mwa
  rationale: Muundo נתן בְּיַד una maana ya kumweka mtu au kitu chini ya mamlaka ya mwingine. “Kutia mikononi mwa” ni nahau ya Kiswahili inayoeleweka na pia inahifadhi taswira ya Kiebrania.
- source_word: גַּם
  choice: pia
  rationale: Neno hili linaonyesha nyongeza au msisitizo katika kauli zote mbili.
- source_word: עִמְּךָ
  choice: pamoja nawe
  rationale: Linatafsiri moja kwa moja wazo kwamba Israeli watashiriki hatima ya Sauli.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo umbo la kawaida la jina la taifa hilo katika Kiswahili.
- source_word: וּמָחָר
  choice: na kesho
  rationale: Kiunganishi kimehifadhiwa ili kufuata mfululizo na uzito wa tangazo la Kiebrania.
- source_word: וּבָנֶיךָ
  choice: na wanao
  rationale: בנים hapa inarejelea wana wa kiume wa Sauli; “wanao” ni usemi wa kawaida na sahihi katika Kiswahili.
- source_word: עִמִּי
  choice: pamoja nami
  rationale: Kiebrania hakitaji wazi kifo, kaburi, au Kuzimu. Tafsiri hii inahifadhi ufupi na utata wa kauli ya asili.
- source_word: מַחֲנֵה יִשְׂרָאֵל
  choice: kambi ya Israeli
  rationale: מַחֲנֶה inaweza kumaanisha kambi au jeshi. “Kambi” ni ya karibu zaidi na maana ya msingi huku muktadha wa vita ukiruhusu pia kueleweka kwa maana ya jeshi lililopiga kambi.
theological_decisions:
- issue: Maana ya kauli “kesho wewe na wanao mtakuwa pamoja nami”
  choice: pamoja nami
  alternative: pamoja nami katika kifo; pamoja nami katika Kuzimu; mahali nilipo
  rationale: Muktadha unaonyesha kwamba Sauli na wanawe watakufa, lakini mstari wenyewe haufafanui hali au mahali pao baada ya kifo. Kuacha kauli ikiwa “pamoja nami” kunahifadhi mvutano wa kiteolojia wa maandishi.
- issue: Jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: “Yahwe” linawakilisha jina binafsi katika maandishi ya Kiebrania bila kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo “kutia mikononi mwa” unahifadhi taswira ya Kiebrania bila kuwa mgumu. Alama za tanbihi zimewekwa baada ya maneno yanayohusika ili kuepuka mkanganyiko uliokuwapo katika safu ya Kiingereza.
