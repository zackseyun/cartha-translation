  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַֽה תָּאֳר֔/וֹ וַ/תֹּ֗אמֶר אִ֤ישׁ זָקֵן֙ עֹלֶ֔ה וְ/ה֥וּא עֹטֶ֖ה מְעִ֑יל וַ/יֵּ֤דַע שָׁאוּל֙ כִּֽי שְׁמוּאֵ֣ל ה֔וּא וַ/יִּקֹּ֥ד אַפַּ֛יִם אַ֖רְצָ/ה וַ/יִּשְׁתָּֽחוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/014.yaml
  text: He said to her[a], “What is his appearance?” And she said, “An old man is coming up, and he is wrapped in a robe.” Then Saul knew that it was Samuel[c][b], and he bowed with his face to the ground and prostrated himself.
translation:
  language: sw
  text: Akamwuliza, “Ana sura gani?” Akajibu, “Mzee mmoja anakuja juu[a], naye amejifunika kwa joho[b].” Ndipo Sauli akajua kwamba huyo ni Samueli, akainama, uso wake mpaka ardhini, akasujudu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anainuka” au “anapanda.” Kitenzi cha Kiebrania kinaonyesha mwendo unaoendelea kuelekea juu.
    reason: lexical_alternative
  - marker: b
    text: Au, “amevaa joho.” Kiebrania kinaonyesha kwa nguvu zaidi kujifunika au kufunikwa kwa joho.
    reason: lexical_alternative
  - marker: c
    text: Au, “akainama chini.” Kitenzi hiki pia kinaweza kutafsiriwa “akaabudu” katika miktadha fulani; hapa kinaeleza kusujudu mbele ya yule aliyetambuliwa kuwa Samueli.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּאֳרוֹ
  choice: Ana sura gani?
  rationale: Nomino תֹּאַר humaanisha umbo au mwonekano unaoonekana. ‘Sura’ ni neno la kawaida na la heshima katika Kiswahili kwa maelezo yanayoweza kumtambulisha mtu.
- source_word: אִישׁ זָקֵן
  choice: Mzee mmoja
  rationale: Kirai hiki humaanisha mwanamume aliyezeeka. ‘Mzee mmoja’ ni tafsiri ya asili katika Kiswahili na haiongezi hadhi ambayo haipo katika muktadha.
- source_word: עֹלֶה
  choice: anapanda juu
  rationale: Hali ya kitenzi inaonyesha tendo linaloendelea, na mzizi unaonyesha mwendo wa kwenda juu. ‘Anapanda juu’ huhifadhi mwelekeo huo katika tukio hili.
- source_word: עֹטֶה מְעִיל
  choice: amejifunika joho
  rationale: עֹטֶה ina wazo la kujifunika au kuzungushiwa vazi, si kulivaa tu; מְעִיל ni joho au vazi la nje. ‘Amejifunika joho’ huhifadhi nguvu ya taswira hiyo.
- source_word: וַיֵּדַע
  choice: Sauli akajua
  rationale: ידע kwa msingi humaanisha ‘kujua’; hapa ni kujua kwa kutambua kutokana na maelezo. Tafsiri hii inabaki karibu na Kiebrania huku muktadha ukionyesha maana ya utambuzi.
- source_word: כִּי שְׁמוּאֵל הוּא
  choice: kwamba huyo ni Samueli
  rationale: Kiebrania hutumia kiwakilishi cha kiume. ‘Huyo ni Samueli’ ni Kiswahili cha kawaida baada ya maelezo ya mtu na huhifadhi utambulisho unaodaiwa na simulizi.
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה
  choice: akainamisha uso wake mpaka chini
  rationale: Nahau hii inaeleza kuinama uso au pua ikielekea ardhini. Maneno haya yanaonyesha wazi mkao wa Sauli bila kuwa magumu.
- source_word: וַיִּשְׁתָּחוּ
  choice: na kusujudu
  rationale: Kitenzi kinaweza kumaanisha kujitupa chini, kusujudu kwa heshima, au kuabudu kulingana na muktadha. ‘Kusujudu’ huonyesha tendo la mwili na ukubwa wa heshima bila kulazimisha maana ya ibada.
theological_decisions:
- issue: Iwapo tendo la Sauli lielezwe wazi kuwa ibada kwa Samueli
  choice: kusujudu
  alternative: kuabudu; kuinama chini; kutoa heshima
  rationale: שׁחה inaweza kueleza ibada au kusujudu kwa heshima kulingana na muktadha. Hapa simulizi linaeleza tendo la mwili mbele ya yule anayetambuliwa kuwa Samueli; ‘kusujudu’ huhifadhi mvutano huo bila kudai moja kwa moja kwamba Sauli alimwabudu kidini.
- issue: Utambulisho wa yule aliyeonekana
  choice: Sauli akajua kwamba huyo ni Samueli
  alternative: Sauli alitambua kuwa alionekana kama Samueli
  rationale: Kiebrania cha simulizi kinasema moja kwa moja כִּי שְׁמוּאֵל הוּא, ‘kwamba yeye ni Samueli.’ Tafsiri haiongezi tahadhari ya ‘alionekana kama,’ wala haitoi uamuzi wa ziada kuhusu asili ya tukio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye heshima. Mtiririko wa simulizi umehifadhiwa kwa vitenzi vya mfululizo (‘akamwuliza,’ ‘akajibu,’ ‘akajua’). ‘Joho’ ni neno linaloeleweka kwa vazi la nje, na ‘kusujudu’ huhifadhi uzito wa tendo bila kuingiza hitimisho la kimadhehebu.
