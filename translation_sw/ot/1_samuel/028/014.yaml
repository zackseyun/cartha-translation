review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the Hebrew sequence and all principal details accurately: Saul asks for the figure''s appearance; the woman describes an old man ascending and clothed in a robe; Saul identifies him as Samuel; and Saul performs a deeply deferential bodily gesture. The identification is retained without importing a conclusion about the nature of the apparition.'
  naturalness: Two expressions benefit from revision for idiomatic Standard East African Swahili. “Anapanda juu” is redundant and can suggest climbing; “anakuja juu” naturally retains the upward emergence. “Akainamisha uso wake mpaka chini” is understandable but less natural than describing Saul himself as bowing with his face toward the ground.
  terminology: “Mzee mmoja,” “joho,” “Samueli,” and “kusujudu” are appropriate. “Kusujudu” accurately represents the physical act without forcing the potentially stronger theological sense “kuabudu.”
  issues:
