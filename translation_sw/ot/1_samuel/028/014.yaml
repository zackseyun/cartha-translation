  to: Akamwuliza, “Ana sura gani?” Akajibu, “Mzee mmoja anakuja juu[a], naye amejifunika kwa joho[b].” Ndipo Sauli akajua kwamba huyo ni Samueli, akainama, uso wake mpaka ardhini, akasujudu[c].
