  text: When Saul saw the camp of the Philistines[a], he was afraid, and his heart trembled greatly.
translation:
  language: sw
  text: Sauli alipoiona kambi ya Wafilisti, aliogopa, na moyo wake ukatetemeka sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moyo wake ukatetemeka sana kwa hofu.” Kiebrania hutaja moyo waziwazi, ikihifadhi taswira ya hofu ya ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: alipoiona
  rationale: Kitenzi ראה hapa kinaonyesha kuona kwa macho. Muundo “alipoiona” unaunganisha kwa kawaida kuona huko na hofu iliyofuata katika simulizi.
- source_word: מַחֲנֵה
  choice: kambi
  rationale: Neno מַחֲנֶה linamaanisha kambi au mahali jeshi lilipopiga kambi; “kambi” inadumisha picha halisi ya mazingira ya kijeshi bila kulifasiri moja kwa moja kuwa “jeshi.”
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili cha Biblia.
- source_word: וַיִּרָא
  choice: aliogopa
  rationale: Kitenzi ירא kinaeleza hofu. “Aliogopa” ni Kiswahili cha kawaida na kinaonyesha itikio la Sauli baada ya kuona kambi.
- source_word: וַיֶּחֱרַד
  choice: ukatetemeka
  rationale: Kitenzi חרד kinaweza kueleza kutetemeka, kushtuka, au kufadhaika kwa hofu. “Ukatetemeka” kinadumisha nguvu na taswira ya Kiebrania bila kuongeza tafsiri ya hali hiyo.
- source_word: לִבּוֹ
  choice: moyo wake
  rationale: Ingawa “moyo” unaweza kumaanisha utu wa ndani, Kiebrania kinataja moyo waziwazi; hivyo taswira hiyo imehifadhiwa.
- source_word: מְאֹד
  choice: sana
  rationale: Neno מְאֹד linatia mkazo kiwango kikubwa; “sana” ni la kawaida na la asili katika Kiswahili.
