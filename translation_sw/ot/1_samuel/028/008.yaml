base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/008.yaml
  text: So Saul disguised himself and put on other clothes[a], and he went, he and two men with him. They came to the woman by night, and he said, “Please divine for me by a medium, and bring up for me the one whom I name to you.”
translation:
  language: sw
  text: Basi Sauli akajifanya asitambulike, akavaa mavazi mengine, kisha akaenda, yeye pamoja na watu wawili waliokuwa naye. Wakamjia yule mwanamke usiku, naye akasema, “Tafadhali, nifanyie uaguzi kwa njia ya roho[a], kisha unipandishie yule nitakayemtaja.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia ya mwenye pepo” au “mwenye roho.” Neno la Kiebrania linaweza kurejelea roho inayohusishwa na uaguzi au mtu anayehusishwa na kutafuta habari kutoka kwa wafu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַפֵּשׂ
  choice: akajibadilisha sura
  rationale: Kauli ya kujirejelea inaonyesha kwamba Sauli alibadili mwonekano wake ili asitambulike. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: בְּגָדִים אֲחֵרִים
  choice: akavaa mavazi mengine
  rationale: Inadumisha maana ya kubadili mavazi kama sehemu ya kujificha bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: וַיֵּלֶךְ הוּא וּשְׁנֵי אֲנָשִׁים עִמּוֹ
  choice: akaondoka pamoja na wanaume wawili
  rationale: Ni Kiswahili cha asili kinachohifadhi kwamba Sauli mwenyewe alienda akiwa na wanaume wawili.
- source_word: לָיְלָה
  choice: usiku
  rationale: Tafsiri fupi na ya kawaida inayohifadhi mazingira ya safari yao ya usiku.
- source_word: קָסֳמִי נָא לִי
  choice: Tafadhali, nipigie ramli
  rationale: Kitenzi קסם kinamaanisha kufanya uaguzi. ‘Kupiga ramli’ ni usemi wa Kiswahili unaoeleweka kwa urahisi, na ‘tafadhali’ linawakilisha ombi la נָא.
- source_word: בָּאוֹב
  choice: kwa kuwasiliana na roho ya mfu
  rationale: Katika muktadha huu אוֹב inahusu njia ya uaguzi inayohusishwa na kutafuta habari kutoka kwa wafu. Tafsiri hii inaeleza tendo kwa lugha inayoeleweka, huku tanbihi ikihifadhi uwezekano wa neno hilo kumaanisha mwenye pepo au mpiga ramli wa wafu.
- source_word: וְהַעֲלִי לִי
  choice: na unipandishie
  rationale: Inahifadhi taswira ya kitenzi cha Kiebrania עלה, yaani kumfanya mtu aliyekufa ‘apande,’ bila kuifafanua au kuikana namna tendo hilo linavyodhaniwa kutokea.
- source_word: אֵת אֲשֶׁר אֹמַר אֵלָיִךְ
  choice: yule nitakayemtaja
  rationale: Kishazi hiki kinamtambulisha mtu ambaye Sauli atamtaja; tafsiri ni ya kawaida na sahihi katika muktadha wa ombi hilo.
theological_decisions:
- issue: Istilahi za kutafuta habari kwa wafu bila kuthibitisha au kukanusha ufanisi wake
  choice: Ombi la Sauli limetafsiriwa moja kwa moja kwa maneno ‘nipigie ramli,’ ‘kwa kuwasiliana na roho ya mfu,’ na ‘unipandishie.’
  alternative: Kuongeza maneno ya mashaka kama ‘ujifanye kuwa unampandisha,’ au maneno yenye uthibitisho zaidi kama ‘uwasiliane kweli na roho ya.’
  rationale: Simulizi linatoa ombi la Sauli kwa mujibu wa mtazamo wa tukio hilo. Tafsiri haipaswi kuamua kimbele kama uaguzi huo ulifanya kazi au namna ulivyofanya kazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mavazi’ na ‘wanaume wawili’ ni maneno ya sasa yasiyo ya kilahaja; ‘kupiga ramli’ linadumisha uzito wa tendo la uaguzi bila kuingiza msimamo wa dhehebu.
