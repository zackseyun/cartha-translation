  text: כַּ/אֲשֶׁ֤ר לֹֽא שָׁמַ֨עְתָּ֙ בְּ/ק֣וֹל יְהוָ֔ה וְ/לֹֽא עָשִׂ֥יתָ חֲרוֹן אַפּ֖/וֹ בַּ/עֲמָלֵ֑ק עַל כֵּן֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה עָשָֽׂה לְ/ךָ֥ יְהוָ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/018.yaml
  text: Because you did not obey the voice of Yahweh and did not carry out his burning anger against Amalek[a], therefore Yahweh has done this thing to you today.
translation:
  language: sw
  text: Kwa sababu hukuitii sauti ya Yahweh, wala hukutekeleza hasira yake inayowaka dhidi ya Amaleki,[a] kwa hiyo Yahweh amekutendea jambo hili leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hukutimiza ghadhabu yake kali dhidi ya Amaleki.”
    reason: Mbadala huu huwasilisha maana ya kiidioma ya kutekeleza hasira kali, ingawa hauhifadhi moja kwa moja taswira ya kuwaka.
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Kwa sababu
  rationale: Katika muktadha huu kiunganishi kinaeleza sababu ya hukumu ya Sauli; ‘Kwa sababu’ ni ya kawaida na wazi katika Kiswahili.
- source_word: שָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: hukuitii sauti ya Yahweh
  rationale: Muundo wa Kiebrania unamaanisha kutii, si kusikia tu; ‘kutii sauti’ huhifadhi taswira ya chanzo na maana yake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa katika Kiebrania linawasilishwa kama jina binafsi, si kubadilishwa kuwa cheo.
- source_word: עָשִׂיתָ חֲרוֹן אַפּוֹ
  choice: hukutekeleza hasira yake iwakayo
  rationale: Kirai hicho kwa halisi kina wazo la kufanya au kutekeleza kuwaka kwa hasira yake; hapa kinahusu kutimiza hukumu ya Mungu dhidi ya Amaleki.
- source_word: חֲרוֹן אַפּוֹ
  choice: hasira yake iwakayo
  rationale: ‘Iwakayo’ huhifadhi taswira ya joto au kuwaka iliyomo katika חֲרוֹן אַף huku ikibaki Kiswahili kinachoeleweka.
- source_word: בַּעֲמָלֵק
  choice: dhidi ya Amaleki
  rationale: Kihusishi kinaonyesha mlengwa wa hasira iliyotekelezwa; ‘dhidi ya’ ni cha kawaida katika muktadha huu.
- source_word: עַל כֵּן
  choice: kwa hiyo
  rationale: Huonyesha matokeo yanayotokana na kutotii kwa Sauli.
- source_word: הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: דָּבָר hapa inarejelea kwa upana hukumu au hali iliyotangazwa; ‘jambo hili’ ni tafsiri ya asili na inayoeleweka.
- source_word: עָשָׂה לְךָ יְהוָה
  choice: Yahweh amekutendea jambo hili
  rationale: Kauli hii huhifadhi Mungu kama mtendaji na Sauli kama anayepokea tendo la hukumu.
- source_word: הַיּוֹם הַזֶּה
  choice: leo
  rationale: ‘Leo’ ni Kiswahili cha kawaida kinachowasilisha mkazo wa wakati uliopo katika chanzo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia Tetragramatoni moja kwa moja; ‘Yahweh’ huhifadhi jina binafsi la Mungu bila kulibadilisha kuwa cheo.
- issue: Maana ya kutekeleza חֲרוֹן אַפּוֹ dhidi ya Amaleki
  choice: hukutekeleza hasira yake iwakayo dhidi ya Amaleki
  alternative: hukutimiza ghadhabu yake kali dhidi ya Amaleki
  rationale: Chaguo kuu huhifadhi kwa kadiri iwezekanavyo taswira ya Kiebrania ya hasira inayowaka na wazo la kutekeleza hukumu, bila kuficha ukali wa kauli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sababu na matokeo umehifadhiwa. Jina ‘Amaleki’ limetumiwa kwa taifa au jamii inayorejelewa hapa; usemi ‘hasira yake iwakayo’ umechaguliwa ili kuhifadhi taswira halisi ya Kiebrania huku tanbihi ikitoa mbadala wa kiidioma.
