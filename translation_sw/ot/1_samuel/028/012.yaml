base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/012.yaml
  text: When the woman saw Samuel[a], she cried out with a loud voice, and the woman said to Saul, “Why have you deceived me? You are Saul!”
translation:
  language: sw
  text: Mwanamke akamwona Samweli[a], akapiga kelele kwa sauti kubwa. Kisha mwanamke akamwambia Sauli, “Kwa nini umenidanganya? Wewe ni Sauli!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kile kilichoonekana kuwa Samweli.” Maandishi ya Kiebrania yanasema tu “Samweli,” bila kueleza mwonekano huo ulikuwa wa namna gani.
    reason: Usomaji mbadala unaohifadhi utata wa namna Samweli alivyoonekana bila kuubadili usemi wa moja kwa moja wa maandishi makuu.
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: alipomwona
  rationale: Kitenzi ראה hapa kinaeleza kuona moja kwa moja katika simulizi. Muundo wa Kiswahili ‘alipomwona’ unaunganisha kwa kawaida tendo hili na itikio linalofuata.
- source_word: הָאִשָּׁה
  choice: mwanamke
  rationale: Nomino ya Kiebrania inasema tu ‘mwanamke.’ Ingawa muktadha unamtambulisha kwa kazi yake, cheo hicho hakijaingizwa katika mstari huu.
- source_word: אֶת שְׁמוּאֵל
  choice: Samweli
  rationale: Maandishi yanamtaja Samweli moja kwa moja kuwa ndiye aliyeonekana; tafsiri haiongezi maelezo kuhusu asili ya mwonekano huo.
- source_word: וַתִּזְעַק בְּקוֹל גָּדוֹל
  choice: alipiga kelele kwa sauti kubwa
  rationale: זעק pamoja na בְּקוֹל גָּדוֹל huonyesha kilio chenye nguvu na sauti kubwa. Usemi huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: וַתֹּאמֶר ... לֵאמֹר
  choice: akamwambia
  rationale: Kiswahili hakihitaji kurudia ‘akasema, akisema.’ ‘Akamwambia’ huhifadhi msemaji, anayesemeshwa, na mtiririko wa simulizi kwa kawaida.
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Hii ndiyo njia ya kawaida ya kuuliza sababu katika Kiswahili Sanifu.
- source_word: רִמִּיתָנִי
  choice: umenidanganya
  rationale: Piel ya רמה ina maana ya kudanganya au kuhadaa. ‘Umenidanganya’ ni ya kawaida na inaonyesha kuwa udanganyifu wa awali sasa umefunuliwa.
- source_word: וְאַתָּה שָׁאוּל
  choice: Wewe ni Sauli!
  rationale: Kiwakilishi אַתָּה kina mkazo. Kutaja ‘Wewe’ wazi na kutumia alama ya mshangao kunahifadhi nguvu ya utambuzi huo.
theological_decisions:
- issue: Iwapo jina ‘Samweli’ lielezwe katika maandishi makuu kuwa mzuka, roho, au kitu kilichoonekana kama Samweli
  choice: Kutumia jina ‘Samweli’ moja kwa moja kama yalivyo maandishi ya Kiebrania
  alternative: kile kilichoonekana kuwa Samweli; mzuka wa Samweli; roho ya Samweli
  rationale: Kiebrania kinasema mwanamke alimwona Samweli bila kufafanua asili ya mwonekano huo. Kuongeza ufafanuzi katika maandishi makuu kungeamua mjadala wa kitheolojia ambao mstari wenyewe hauamui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. ‘Alipiga kelele kwa sauti kubwa’ huhifadhi ukali wa itikio bila kutumia lugha ya kusisimua kupita kiasi. Mgawanyo kuwa sentensi mbili huleta mtiririko wa kawaida huku ukidumisha mfuatano wa Kiebrania.
