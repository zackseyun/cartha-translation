base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/021.yaml
  text: The woman came to Saul[a], and when she saw that he was very terrified, she said to him, “Behold, your servant has obeyed your voice[b], and I have put my life in my hand and listened to your words that you spoke to me.”
translation:
  language: sw
  text: Mwanamke huyo akamjia Sauli, naye alipoona kwamba Sauli alikuwa ameingiwa na hofu sana, akamwambia, “Tazama, mimi mtumishi wako[a] nimekutii. Nimehatarisha maisha yangu[b] na kuyasikiliza maneno yako uliyoniambia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “mjakazi wako amesikiliza sauti yako”; usemi huo unamaanisha kwamba amemtii Sauli.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “nimeweka uhai wangu katika kiganja changu,” yaani, “nimehatarisha maisha yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא הָאִשָּׁה אֶל שָׁאוּל
  choice: Mwanamke huyo akamjia Sauli
  rationale: Muundo wa masimulizi unaendeleza tukio; ‘akamjia’ unaonyesha mwendo kuelekea kwa Sauli, na ‘mwanamke huyo’ hudumisha nomino yenye uainisho bila kuongeza maelezo kutoka muktadha.
- source_word: וַתֵּרֶא כִּי נִבְהַל מְאֹד
  choice: alipoona kwamba Sauli alikuwa ameingiwa na hofu sana
  rationale: Kitenzi נבהל huonyesha kushtuka, kufadhaika, au kuogopa sana. ‘Ameingiwa na hofu sana’ ni Kiswahili cha kawaida kinachobeba uzito wa מְאֹד; kutaja Sauli tena huondoa utata wa kiwakilishi.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni kiashiria cha mazungumzo kinachovuta fikira kwa ombi lake; ‘Tazama’ kina hadhi ya simulizi la Biblia bila kuwa kigumu kueleweka.
- source_word: שָׁמְעָה שִׁפְחָתְךָ בְּקוֹלֶךָ
  choice: mimi mtumishi wako nimekutii
  rationale: Nahau שׁמע בקול humaanisha kutii au kuitikia, si kusikia tu. ‘Mtumishi wako’ ni namna ya heshima ya kujirejelea; jinsia ya msemaji tayari inaeleweka kutokana na ‘mwanamke huyo.’
- source_word: וָאָשִׂים נַפְשִׁי בְּכַפִּי
  choice: Nimehatarisha maisha yangu
  rationale: Nahau ya Kiebrania kwa uhalisi ni kuweka uhai katika kiganja, lakini maana yake ni kuhatarisha maisha. Tafsiri ya maana ni ya kawaida na wazi katika Kiswahili, huku taswira halisi ikihifadhiwa katika tanbihi.
- source_word: וָאֶשְׁמַע אֶת דְּבָרֶיךָ אֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: na kuyasikiliza maneno yako uliyonena nami
  rationale: Hapa שׁמע yenye shamirisho la moja kwa moja ni kusikia au kusikiliza. ‘Kuyasikiliza’ hudumisha tofauti na nahau ya awali iliyotafsiriwa ‘nimekutii,’ na ‘uliyonena nami’ hutoa sajili yenye hadhi na maana ya kusema kwake.
