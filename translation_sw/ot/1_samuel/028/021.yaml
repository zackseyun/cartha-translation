translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa sasa na hadhi ya simulizi la Biblia. Nahau zisizo za kawaida katika Kiswahili zimetafsiriwa kwa maana yake, huku miundo yake halisi ikielezwa katika tanbihi.
