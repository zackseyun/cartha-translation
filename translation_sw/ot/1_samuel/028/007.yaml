base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/007.yaml
  text: Then Saul said to his servants, “Find for me a woman who is a medium, so that I may go to her and inquire through her.” And his servants said to him, “Look, there is a woman who is a medium at En-dor.”
translation:
  language: sw
  text: Ndipo Sauli akawaambia watumishi wake, “Nitafutieni mwanamke mwenye ’ovu[a], ili niende kwake nipate habari kupitia kwake.” Watumishi wake wakamwambia, “Tazama, huko Endori kuna mwanamke mwenye ’ovu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: ’ov. Neno hili humtaja kile kilichohusishwa na uaguzi au kuwasiliana na wafu; maana yake mahususi haiko wazi.'
    reason: Huhifadhi neno la Kiebrania na utata wake, bila kudai kwamba ’ov ni pepo au aina fulani ya nguvu.
lexical_decisions:
- source_word: אֵשֶׁת בַּעֲלַת אוֹב
  choice: mwanamke mwenye pepo wa kuagua
  rationale: Kirai hiki kinadumisha taswira ya Kiebrania ya mwanamke aliye na ’ov, huku ‘pepo wa kuagua’ kikieleweka kwa Kiswahili cha sasa bila kudai kwa uhakika ’ov alikuwa nini.
- source_word: בַּקְּשׁוּ לִי
  choice: Nitafutieni
  rationale: Amri hii inamaanisha wamtafutie Sauli mwanamke huyo; umbo la Kiswahili ni la kawaida na linahifadhi maana ya ‘kwa ajili yangu.’
- source_word: וְאֶדְרְשָׁה בָּהּ
  choice: na kutafuta habari kupitia kwake
  rationale: Kiambishi בָּהּ hapa kinaweza kuonyesha njia au chombo. ‘Kupitia kwake’ kinahifadhi kwamba mwanamke ndiye anayetumiwa katika utafutaji wa habari, badala ya kusema Sauli anamwuliza yeye tu.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwenye taarifa inayofuata; ‘Tazama’ lina hadhi ya kisimulizi na ni wazi kwa wasomaji.
- source_word: עֵין דּוֹר
  choice: Endori
  rationale: Hili ni umbo la jina la mahali lililozoeleka katika Biblia za Kiswahili.
theological_decisions:
- issue: Utambulisho wa אוֹב na hali ya nguvu ya mwanamke
  choice: mwenye pepo wa kuagua, pamoja na tanbihi ya ufafanuzi
  alternative: mwanamke mpiga ramli / mwanamke mwenye mizimu
  rationale: Maandishi yanamtaja kwa usemi wa Kiebrania unaohusishwa na kuwasiliana na wafu, lakini hayatoi hapa maelezo kamili ya ontolojia ya ’ov. Tafsiri haipaswi kumfanya mpiga ramli wa kawaida wala kuamua bila msingi kwamba מדובר kwa wingi wa ‘mizimu.’
- issue: Jinsi Sauli anavyotafuta habari
  choice: kupitia kwake
  alternative: kumwuliza yeye / kutafuta habari kwake
  rationale: Hii inaakisi matumizi ya ב instrumental na haidai kwamba mwanamke mwenyewe ndiye chanzo cha mwisho cha ujumbe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi ya Maandiko. ‘Nitafutieni’ na ‘kupitia kwake’ ni vya kawaida na wazi; ‘Tazama’ huhifadhi ishara ya kuvuta fikira ya הִנֵּה.
