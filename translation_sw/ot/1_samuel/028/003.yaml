base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/003.yaml
  text: Samuel had died[a], and all Israel had mourned for him and buried him in Ramah, in his own city. And Saul had removed the mediums and the spiritists from the land.
translation:
  language: sw
  text: Samweli alikuwa amekufa, na Israeli wote walikuwa wamemwombolezea na kumzika huko Rama, katika mji wake. Naye Sauli alikuwa amewaondoa waaguzi wa mizimu na wenye kuwasiliana na roho nchini[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenye mizimu waaguzi na wataalamu wa mambo ya siri.” Istilahi mbili za Kiebrania zinataja makundi mawili ya watendaji wa mambo ya roho; tofauti kamili kati yao haijulikani.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵת
  choice: alikuwa amekufa
  rationale: Wakati timilifu uliopita unaonyesha kuwa kifo cha Samweli kilikuwa tukio la awali linalotoa msingi wa simulizi linalofuata.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: walikuwa wamemwombolezea
  rationale: Kitenzi kinaeleza maombolezo ya hadharani, hasa katika mazingira ya mazishi; ‘kumwombolezea’ ni Kiswahili cha kawaida na chenye heshima.
- source_word: כָּל יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Inahifadhi usemi wa pamoja unaolitaja taifa zima bila kuufafanua zaidi kuwa kila mtu mmoja mmoja.
- source_word: וַיִּקְבְּרֻהוּ
  choice: na kumzika
  rationale: Tendo la mazishi linaunganishwa kiasili na kitenzi kisaidizi cha awali, ‘walikuwa,’ bila kurudia maneno yasiyo ya lazima.
- source_word: בָרָמָה
  choice: huko Rama
  rationale: Jina la mahali limetoholewa kwa umbo linalotumika katika Kiswahili; ‘huko’ huonyesha mahali pa mazishi kwa ufasaha.
- source_word: וּבְעִירוֹ
  choice: katika mji wake mwenyewe
  rationale: Inabainisha kuwa Rama ulikuwa mji wake, huku kiunganishi cha Kiebrania kikielezwa kwa uhusiano wa ufafanuzi badala ya kutafsiriwa neno kwa neno.
- source_word: הֵסִיר
  choice: alikuwa amewaondoa
  rationale: Wakati timilifu uliopita unaonyesha hatua ya Sauli iliyotangulia matukio yanayosimuliwa; ‘kuwaondoa’ haibainishi bila ushahidi ikiwa aliwafukuza, aliwakataza, au aliwakandamiza kwa njia nyingine.
- source_word: הָאֹבוֹת
  choice: waaguzi kwa mizimu
  rationale: Neno linawahusu watu waliotafutwa ili kupata ujumbe kutoka kwa wafu au mizimu; tafsiri hii inaeleweka bila kuingiza dhana za kisasa za fantasia.
- source_word: הַיִּדְּעֹנִים
  choice: wenye kuwasiliana na roho
  rationale: Neno linataja aina ya mtendaji wa mambo ya roho na mara nyingi huambatana na אוֹב; usemi huu unaacha mipaka halisi ya kundi hilo ikiwa wazi.
- source_word: מֵהָאָרֶץ
  choice: nchini
  rationale: Katika muktadha wa taifa, ‘nchini’ ni tafsiri ya kawaida na yenye maana sawa na kuwaondoa kutoka katika nchi hiyo.
theological_decisions:
- issue: Kutafsiri majina ya watendaji wa mambo ya mizimu bila kuingiza ngano au makundi ya baadaye
  choice: waaguzi kwa mizimu na wenye kuwasiliana na roho
  alternative: wenye pepo na wachawi; waaguzi kwa wafu na wapiga ramli
  rationale: Maneno ya Kiebrania yanataja watendaji wawili wa mambo yaliyokatazwa yanayohusiana na kutafuta habari katika ulimwengu wa roho, lakini tofauti yao kamili si wazi. Tafsiri iliyochaguliwa inawasilisha maana ya msingi bila kuwafanya kuwa ‘wachawi’ kwa maana ya ngano za kisasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Miundo ya wakati timilifu uliopita imetumiwa kuonyesha kwamba mstari huu unatoa habari ya awali kwa simulizi linalofuata. Alama ya tanbihi imewekwa baada ya istilahi mbili inazozifafanua.
