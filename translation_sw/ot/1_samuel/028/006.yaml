base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/006.yaml
  text: Saul inquired of Yahweh[a], but Yahweh did not answer him[b], either by dreams or by the Urim or by the prophets.
translation:
  language: sw
  text: Sauli akamwuliza Yahwe, lakini Yahwe hakumjibu kwa ndoto, wala kwa Urimu[a], wala kwa manabii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Urimu ilikuwa njia ya kikuhani ya kutafuta mwongozo kutoka kwa Mungu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: akamwuliza
  rationale: Katika muundo שׁאל ב pamoja na jina la Mungu, kitenzi kina maana ya kutafuta jibu au mwongozo kutoka kwa Mungu. “Akamwuliza” ni ya moja kwa moja na ya kawaida katika Kiswahili, bila kuongeza maelezo yasiyomo katika mstari.
- source_word: בַּיהוָה / יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kama “Yahwe,” badala ya kubadilishwa kuwa cheo kama “BWANA.” Kihusishi ב kimetolewa kwa namna ya kawaida katika Kiswahili kupitia kiambishi cha yambwa katika “akamwuliza.”
- source_word: וְלֹא עָנָהוּ
  choice: lakini Yahwe hakumjibu
  rationale: ענה hapa ni kutoa jibu kwa ombi la mwongozo. “Hakumjibu” ni sahihi, wazi, na huhifadhi msisitizo wa kurudiwa kwa jina Yahwe.
- source_word: גַּם ... גַּם ... גַּם
  choice: wala ... wala ... wala
  rationale: 'Baada ya kauli hasi, urudiaji wa “wala” huwasilisha kwa kawaida nguvu ya mgawanyo ya גַּם: hakuna njia hata moja kati ya zilizoorodheshwa iliyotoa jibu.'
- source_word: בַּחֲלֹמוֹת
  choice: kwa ndoto
  rationale: Kihusishi ב kinaonyesha njia ambayo jibu lingeweza kutolewa; “kwa ndoto” ni usemi wa kawaida na mfupi.
- source_word: בָּאוּרִים
  choice: kwa Urimu
  rationale: אוּרִים ni jina la njia au kifaa kitakatifu cha kikuhani cha kutafuta mwongozo wa Mungu. Limenukuliwa kama “Urimu” badala ya kutafsiriwa kwa kubahatisha.
- source_word: בַּנְּבִיאִם
  choice: kwa manabii
  rationale: “Kwa manabii” huhifadhi muundo sambamba wa njia tatu za ufunuo na ni Kiswahili cha kawaida.
theological_decisions:
- issue: Utoaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu יהוה. “Yahwe” huhifadhi jina hilo bila kuligeuza kuwa cheo.
- issue: Sababu ya Sauli kutopata jibu
  choice: Kutaja tu kwamba Yahwe hakumjibu kwa njia yoyote iliyoorodheshwa
  alternative: Kuongeza sababu ya Yahwe kukataa kumjibu
  rationale: Mstari huu hautoi sababu ya ukimya wa Mungu. Tafsiri inaacha mvutano huo wa kiteolojia bila kuutatua kwa maelezo ya ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo wa “wala ... wala ... wala” umechaguliwa ili orodha isikike kwa kawaida baada ya kauli hasi.
