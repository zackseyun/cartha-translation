  text: וַ/יַּ֤עַשׂ יְהוָה֙ ל֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר בְּ/יָדִ֑/י וַ/יִּקְרַ֨ע יְהוָ֤ה אֶת הַ/מַּמְלָכָה֙ מִ/יָּדֶ֔/ךָ וַֽ/יִּתְּנָ֖/הּ לְ/רֵעֲ/ךָ֥ לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/017.yaml
  text: 'And Yahweh has done for you just as he spoke by my hand: Yahweh has torn the kingdom out of your hand and given it to your neighbor[b][a], to David.'
translation:
  language: sw
  text: 'Yahwe amefanya kwa ajili yake[a], kama alivyosema kwa mkono wangu[b]: Yahwe amerarua ufalme kutoka mkononi mwako na amempa jirani yako, Daudi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa ajili yake” au “kwa ajili yake mwenyewe.” Tafsiri nyingi husema “amekutendea” au “amefanya kwa ajili yako,” zikielekeza maana kwa Sauli; lakini Matini ya Kimasoreti hapa ina kiwakilishi cha nafsi ya tatu, “yake.”'
    reason: alternative_reading
  - marker: b
    text: Au “kama alivyosema kupitia kwangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina la Mungu YHWH kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: וַיַּעַשׂ ... לוֹ
  choice: amefanya kwa ajili yake
  rationale: Linatafsiri moja kwa moja kiwakilishi לוֹ, ‘kwa ajili yake/kwake,’ bila kukibadili kimya kimya kuwa ‘kwa ajili yako.’ Pia linaacha wazi kwa kiasi fulani anayerejelewa na kiwakilishi hicho.
- source_word: כַּאֲשֶׁר דִּבֶּר בְּיָדִי
  choice: kama alivyosema kwa mkono wangu
  rationale: Linahifadhi nahau ya Kiebrania בְּיַדִי; maana yake ya uwakala, ‘kupitia kwangu,’ imeelezwa katika tanbihi.
- source_word: וַיִּקְרַע
  choice: ameurarua
  rationale: Kitenzi קָרַע kina picha halisi ya kurarua; umbo hili linadumisha sitiari kali ya kuondolewa kwa ufalme.
- source_word: הַמַּמְלָכָה
  choice: ufalme
  rationale: Ni neno la kawaida na lenye hadhi kwa utawala wa kifalme wa Sauli katika muktadha huu.
- source_word: מִיָּדֶךָ
  choice: kutoka mkononi mwako
  rationale: Linahifadhi picha ya Kiebrania ya kuondoa kitu kutoka katika umiliki au mamlaka ya mtu.
- source_word: וַיִּתְּנָהּ
  choice: na kumpa
  rationale: Kiambishi cha yambwa katika Kiswahili kinaeleweka kwa kurejelea ufalme uliotajwa; muundo huu ni wa asili na unaunganisha tendo hilo na kuraruliwa kwa ufalme.
- source_word: לְרֵעֲךָ
  choice: jirani yako
  rationale: רֵעַ inaweza kumaanisha jirani, mwenzako, au rafiki; ‘jirani yako’ ni pana na inaeleweka, huku jina Daudi likimtambulisha anayekusudiwa.
- source_word: לְדָוִד
  choice: yaani Daudi
  rationale: ‘Yaani’ linaonyesha wazi kuwa Daudi ndiye ‘jirani yako’ anayetajwa, bila kubadili uhusiano wa kisarufi wa Kiebrania.
theological_decisions:
- issue: Usomaji wa לוֹ katika kishazi cha kwanza
  choice: kwa ajili yake
  alternative: kwa ajili yako / amekutendea
  rationale: Matini ya Kimasoreti iliyotolewa ina לוֹ, nafsi ya tatu umoja, si לְךָ, nafsi ya pili. Tafsiri hairekebishi matini kwa kutegemea muktadha; tanbihi inaonyesha uwezekano wa kuielewa kuwa ‘kwa ajili yake mwenyewe.’
- issue: Nahau ya kinabii בְיָדִי
  choice: kwa mkono wangu
  alternative: kupitia kwangu
  rationale: Muundo halisi umehifadhiwa katika matini, na maana yake ya Samueli kuwa mjumbe au chombo cha usemi wa Mungu imetolewa kama mbadala katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sitiari za ‘kurarua ufalme’ na ‘kutoka mkononi mwako’ zimehifadhiwa, huku ‘yaani Daudi’ ikifanya uhusiano wa mwisho usomeke kwa urahisi.
