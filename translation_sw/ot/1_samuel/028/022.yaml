  to: Sasa basi, tafadhali, nawe usikilize sauti ya mjakazi wako,[a] nami nikuwekee kipande cha mkate mbele yako. Ule ili upate nguvu, kwa maana utaenda njiani.
  rationale: Revised the opening and the offer for idiomatic Kiswahili, used the natural gender-specific term “mjakazi,” and rendered the final clause without adding an explicit notion of obligation or continuation. The footnote now covers both the Hebrew idiom and the gendered servant term at its single anchor.
