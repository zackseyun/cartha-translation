  text: וְ/עַתָּ֗ה שְׁמַֽע נָ֤א גַם אַתָּה֙ בְּ/ק֣וֹל שִׁפְחָתֶ֔/ךָ וְ/אָשִׂ֧מָה לְ/פָנֶ֛י/ךָ פַּת לֶ֖חֶם וֶ/אֱכ֑וֹל וִ/יהִ֤י בְ/ךָ֙ כֹּ֔חַ כִּ֥י תֵלֵ֖ךְ בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/022.yaml
  text: Now then[a], please listen, you also, to the voice of your female servant, and let me set a piece of bread before you. Eat, so that there may be strength in you[c][b], because you must go on your way.
translation:
  language: sw
  text: Sasa basi, tafadhali, nawe usikilize sauti ya mjakazi wako,[a] nami nikuwekee kipande cha mkate mbele yako. Ule ili upate nguvu, kwa maana utaenda njiani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “sauti ya mjakazi wako”; usemi huu unamaanisha kumsikiliza au kutii ombi la mjakazi wako. Neno “mjakazi” ni nomino ya kike; pia linaweza kutafsiriwa “mtumishi wako wa kike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Ni kiashiria cha mazungumzo kinachoanzisha ombi la haraka; “Basi sasa” huhifadhi maana ya wakati na ya kuhitimisha kutokana na yaliyotangulia.
- source_word: שְׁמַע נָא
  choice: tafadhali ... umsikilize
  rationale: Amri pamoja na נָא imewasilishwa kama ombi la heshima. “Kumsikiliza” hapa kwa kawaida humaanisha kukubali na kutenda kwa kufuata ombi lake.
- source_word: גַּם אַתָּה
  choice: nawe
  rationale: '“Nawe” huhifadhi msisitizo wa kutendeana: Sauli naye anapaswa kumsikiliza mwanamke huyo.'
- source_word: בְּקוֹל שִׁפְחָתֶךָ
  choice: msikilize mtumishi wako wa kike
  rationale: Tafsiri ya kiidioma ya Kiswahili; “wa kike” huhifadhi jinsia iliyotajwa wazi na nomino ya Kiebrania שִׁפְחָה.
- source_word: וְאָשִׂימָה לְפָנֶיךָ
  choice: nami niweke ... mbele yako
  rationale: Umbo la kohortativi linaonyesha ombi au pendekezo la hiari, si taarifa rahisi tu ya wakati ujao.
- source_word: פַּת לֶחֶם
  choice: kipande cha mkate
  rationale: פַּת ni kipande au tonge; “kipande cha mkate” ni sahihi na cha kawaida katika Kiswahili cha sasa.
- source_word: וֶאֱכֹל
  choice: Ule
  rationale: Amri hiyo imehifadhiwa moja kwa moja na kwa mtiririko wa kawaida wa Kiswahili.
- source_word: וִיהִי בְךָ כֹּחַ
  choice: ili upate nguvu
  rationale: Huwasilisha kwa Kiswahili cha kawaida kusudi au matokeo yanayotakiwa ya kula, yaani kurejea kwa nguvu za mwili.
- source_word: כִּי תֵלֵךְ בַּדָּרֶךְ
  choice: kwa maana lazima uendelee na safari yako
  rationale: כִּי hutoa sababu, na kitenzi kisichotimilika huelekeza kwenye kuondoka kunakokaribia. “Safari yako” huwasilisha idiomu ya kwenda njiani katika muktadha.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wa kawaida kwa wasomaji wa leo huku ukihifadhi ombi la upole, msisitizo wa “nawe,” na jinsia ya neno la Kiebrania.
