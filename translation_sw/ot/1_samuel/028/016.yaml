  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל וְ/לָ֖/מָּה תִּשְׁאָלֵ֑/נִי וַ/יהוָ֛ה סָ֥ר מֵ/עָלֶ֖י/ךָ וַ/יְהִ֥י עָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/016.yaml
  text: And Samuel said[a], “Why then do you ask me, since Yahweh has turned away from you and has become your adversary?”
translation:
  language: sw
  text: Samweli akasema, “Basi, kwa nini unaniuliza, kwa kuwa Yahwe amejitenga nawe na amekuwa adui yako[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amekuwa mpinzani wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל
  choice: Samweli akasema
  rationale: Muundo huu wa kawaida wa masimulizi ya Kiswahili unawakilisha mwendelezo wa simulizi unaoonyeshwa na waw-consecutive bila kulazimisha kiunganishi kisicho cha lazima.
- source_word: וְלָמָּה
  choice: Basi, kwa nini
  rationale: “Basi” huhifadhi nguvu ya kiunganishi na ukali wa swali la balagha kwa Kiswahili cha kawaida.
- source_word: תִּשְׁאָלֵנִי
  choice: unaniuliza
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi שאל hapa; “unatafuta jibu kwangu” au “unataka ushauri wangu” zingefafanua zaidi ya maandishi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: סָר מֵעָלֶיךָ
  choice: amejitenga nawe
  rationale: Huhifadhi wazo la kuondoka au kujiondoa kutoka kwa mtu pamoja na uzito wa uhusiano unaopatikana katika muktadha.
- source_word: וַיְהִי עָרֶךָ
  choice: amekuwa adui yako
  rationale: עָר humaanisha adui au mpinzani. “Adui yako” ni ya wazi, nzito, na ya kawaida kwa wasomaji wa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Kauli kuhusu uhusiano wa Yahwe na Sauli
  choice: amekuwa adui yako
  alternative: amekuwa mpinzani wako
  rationale: Tafsiri inahifadhi ukali wa עָרֶךָ—upinzani wa Mungu kwa Sauli—bila kuupunguza kuwa kutompendelea tu. “Mpinzani” ni uwezekano halali wa kileksika na umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Swali la balagha na uzito wa upinzani wa Mungu vimehifadhiwa.
