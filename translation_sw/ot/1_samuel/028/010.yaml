base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/010.yaml
  text: So Saul swore to her by Yahweh[a], saying, “As Yahweh lives, no punishment will come upon you in this matter.”
translation:
  language: sw
  text: Basi Sauli akamwapia kwa kumtaja Yahweh, akisema, “Kwa hakika, kama Yahweh aishivyo, hakuna adhabu itakayokupata katika jambo hili.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuna hatia itakayokupata katika jambo hili.” Neno la Kiebrania linaweza kumaanisha uovu, hatia, au adhabu inayotokana na hatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע לָהּ
  choice: akamwapia
  rationale: Kitenzi cha Kiswahili ‘kuapia’ kinaeleza kwa kawaida na kwa ufupi kwamba Sauli alimthibitishia mwanamke jambo kwa kiapo.
- source_word: בַּיהוָה
  choice: kwa Yahweh
  rationale: Kihusishi kinaonyesha yule ambaye jina lake linaombwa kuwa shahidi na dhamana ya kiapo; jina la agano יְהוָה limetoholewa kuwa ‘Yahweh’.
- source_word: חַי יְהוָה
  choice: Hakika Yahweh aishivyo
  rationale: Hii inahifadhi kauli ya kawaida ya kiapo cha Kiebrania huku ‘Hakika’ ikiwasilisha nguvu ya uthibitisho kwa Kiswahili cha kawaida.
- source_word: אִם
  choice: hakuna
  rationale: Katika kiapo, אִם huanzisha laana iliyodokezwa na hivyo huwa na nguvu ya ukanushaji mkali; tafsiri ya neno kwa neno ‘ikiwa’ ingeficha maana.
- source_word: יִקְּרֵךְ
  choice: itakayokupata
  rationale: קרא hapa humaanisha tukio kumpata mtu; ‘itakayokupata’ ni Kiswahili cha asili na wazi.
- source_word: עָוֺן
  choice: adhabu
  rationale: Katika muktadha huu neno linaweza kutaja adhabu au matokeo ya hatia. Sauli anamhakikishia mwanamke kwamba hataadhibiwa kwa jambo hili.
- source_word: בַּדָּבָר הַזֶּה
  choice: katika jambo hili
  rationale: Hii ni tafsiri ya kawaida inayorejelea kitendo kilichokuwa kikizungumziwa bila kuongeza ufafanuzi usiotajwa katika mstari.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya עָוֺן katika kiapo cha Sauli
  choice: adhabu
  alternative: hatia; uovu; adhabu ya hatia
  rationale: Muktadha wa tishio la kisheria unaunga mkono maana ya matokeo ya hatia, lakini wigo halisi wa neno la Kiebrania umehifadhiwa katika tanbihi ili kutotatua kimya kimya utata wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kiapo umehifadhiwa bila kuwa mgumu kupita kiasi; ‘akamwapia’ na ‘itakayokupata’ ni maneno ya kawaida yanayoeleweka kwa urahisi.
