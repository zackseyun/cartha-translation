source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר הָֽ/אִשָּׁ֜ה אֵלָ֗י/ו הִנֵּ֨ה אַתָּ֤ה יָדַ֨עְתָּ֙ אֵ֣ת אֲשֶׁר עָשָׂ֣ה שָׁא֔וּל אֲשֶׁ֥ר הִכְרִ֛ית אֶת הָ/אֹב֥וֹת וְ/אֶת הַ/יִּדְּעֹנִ֖י מִן הָ/אָ֑רֶץ וְ/לָ/מָ֥ה אַתָּ֛ה מִתְנַקֵּ֥שׁ בְּ/נַפְשִׁ֖/י לַ/הֲמִיתֵֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/009.yaml
  text: But the woman said to him[a], “Look, you yourself know what Saul has done, that he has cut off the mediums and the spiritists from the land. So why are you laying a snare for my life, to put me to death?”
translation:
  language: sw
  text: Lakini mwanamke akamwambia, “Tazama, wewe mwenyewe unajua alichofanya Sauli—amewaondoa nchini waaguzi wa mizimu na wapiga ramli[a]. Kwa nini basi unaniwekea mtego ili kuniua?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenye pepo na wachawi.”
    reason: Mbadala huu wa jadi unaonyesha uwezekano mwingine wa kutafsiri הָאֹבוֹת na הַיִּדְּעֹנִי, maneno yanayohusu watendaji wa mambo ya mizimu na maarifa ya siri.
lexical_decisions:
- source_word: וַתֹּאמֶר הָאִשָּׁה אֵלָיו
  choice: Lakini mwanamke akamwambia
  rationale: Waw inaendeleza simulizi, lakini katika muktadha jibu la mwanamke linapinga ombi alilopewa; kwa hiyo “Lakini” linaonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwa msisitizo. “Tazama” ni la heshima na linaeleweka katika Kiswahili sanifu.
- source_word: אַתָּה יָדַעְתָּ
  choice: wewe mwenyewe unajua
  rationale: Kiwakilishi kilichotajwa wazi pamoja na kitenzi kinaongeza msisitizo, unaohifadhiwa kwa “wewe mwenyewe.”
- source_word: אֵת אֲשֶׁר עָשָׂה שָׁאוּל
  choice: alichofanya Sauli
  rationale: Hii ni namna ya asili ya Kiswahili ya kuwasilisha kishazi cha yambwa bila kupoteza rejeo la tendo la Sauli.
- source_word: אֲשֶׁר הִכְרִית
  choice: kwamba amewaondoa
  rationale: Kishazi hiki kinafafanua alichofanya Sauli. Ingawa kitenzi kina maana kali ya ‘kukata mbali’ au ‘kuangamiza,’ katika muktadha huu kinamaanisha kuwaondoa wahusika hao nchini; “amewaondoa” ni wazi bila kudai kwamba wote waliuawa.
- source_word: הָאֹבוֹת
  choice: waaguzi wa mizimu
  rationale: Katika muktadha huu neno linawahusu watu waliotafutwa ili kuwasiliana na wafu au mizimu. Tafsiri hii ni ya kueleweka na haifanyi uamuzi kuhusu uhalisi au utendaji wa dai lao.
- source_word: הַיִּדְּעֹנִי
  choice: wapiga ramli
  rationale: Neno linahusu watu wanaodai maarifa ya siri kwa njia za kiroho au za uganga. “Wapiga ramli” ni neno la Kiswahili linaloeleweka, huku mbadala wa jadi ukihifadhiwa katika tanbihi.
- source_word: מִן הָאָרֶץ
  choice: nchini
  rationale: Hapa ‘nchi’ ni eneo lililotawaliwa na Sauli, si dunia nzima. “Nchini” ni fupi na ya asili katika Kiswahili.
- source_word: וְלָמָה
  choice: Kwa nini basi
  rationale: “Basi” linaonyesha hitimisho la mwanamke kutokana na sera ya Sauli na hofu yake kwamba anategwa.
- source_word: מִתְנַקֵּשׁ בְּנַפְשִׁי לַהֲמִיתֵנִי
  choice: unaniwekea mtego ili kuniua
  rationale: Tafsiri hii huhifadhi picha ya mtego na kusudi la kuutoa uhai wake, kwa Kiswahili cha kawaida na kisicho na urudiaji usio wa asili.
theological_decisions:
- issue: Jinsi ya kutafsiri majina ya watendaji wa mambo ya mizimu bila kuhalalisha madai yao au kuingiza dhana za baadaye
  choice: waaguzi wa mizimu na wapiga ramli
  alternative: wenye pepo na wachawi
  rationale: Chaguo kuu linatambulisha aina za watendaji wanaokusudiwa kwa lugha ya sasa, lakini halisemi kwamba mawasiliano yao na mizimu yalikuwa halisi wala kueleza yalivyofanya kazi. Mbadala wa jadi umewekwa katika tanbihi kwa sababu maneno ya Kiebrania yana upeo wa maana usio rahisi kutenganishwa kikamilifu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia “Tazama” kwa msisitizo wa הִנֵּה, na “mtego” ili kuhifadhi sitiari ya Kiebrania. Alama ya tanbihi imewekwa mara tu baada ya istilahi inazozifafanua.
