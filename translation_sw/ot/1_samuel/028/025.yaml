  text: Then she brought it before Saul and before his servants[a], and they ate. Then they rose and went away that night.
translation:
  language: sw
  text: Kisha akaleta chakula mbele ya Sauli na watumishi wake, nao wakala. Kisha waliinuka, wakaondoka usiku huo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּגֵּשׁ
  choice: akaleta chakula mbele ya
  rationale: Kitenzi katika muktadha huu humaanisha kuleta karibu au kuweka mbele ya mtu. Kiebrania hakitaji yambwa wazi, lakini muktadha uliotangulia unaonyesha kuwa ni chakula kilichoandaliwa; kukitaja kunafanya Kiswahili kiwe wazi na cha kawaida.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya kuweka chakula mbele ya watu.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Neno linaweza kumaanisha watumishi, watumwa, au wahudumu kulingana na muktadha. Hapa linawahusu watu waliokuwa wakimhudumia na kuandamana na Sauli; “watumishi wake” ni pana na haliongezi dai lisilo la lazima kuhusu hali yao ya kisheria.
- source_word: וַיֹּאכֵלוּ
  choice: nao wakala
  rationale: Kiswahili kinaweza kuacha yambwa kwa kawaida kwa kuwa chakula kinajulikana kutokana na muktadha. “Nao” huunganisha Sauli na watumishi wake kama watendaji.
- source_word: וַיָּקֻמוּ וַיֵּלְכוּ
  choice: Kisha wakaondoka
  rationale: Kiebrania kinasema kihalisi “wakainuka, wakaenda.” Katika Kiswahili, “wakaondoka” huwasilisha kwa kawaida tendo zima la kuinuka na kuondoka bila uzito usio wa lazima.
- source_word: בַּלַּיְלָה הַהוּא
  choice: usiku huohuo
  rationale: Kauli hii ya kawaida ya Kiswahili huhifadhi maana ya wakati huo maalumu, yaani usiku uleule wa matukio hayo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Tafsiri inafuata mlolongo wa simulizi huku ikitumia “wakaondoka” kwa muhtasari wa kawaida wa “wakainuka, wakaenda.” Hakuna tanbihi iliyohitajika kwa kuwa yambwa lililodokezwa na Kiebrania linaweza kutajwa wazi kama “chakula” kutokana na muktadha wa karibu.
