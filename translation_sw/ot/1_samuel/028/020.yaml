base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/020.yaml
  text: Saul immediately fell full length to the ground[a], and he was very afraid because of Samuel’s words. There was no strength in him either, because he had eaten no bread all that day and all that night.
translation:
  language: sw
  text: Mara Sauli akaanguka chini akiwa amenyooka mwili wote, naye akaogopa sana kwa sababu ya maneno ya Samweli. Pia hakuwa na nguvu, kwa kuwa hakuwa amekula mkate[a] siku ile yote na usiku ule wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “mkate” linaweza pia kumaanisha “chakula” kwa ujumla; tafsiri hii imehifadhi neno “mkate” ili kuonyesha neno la chanzo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: Mara hiyo
  rationale: Kitenzi kina maana ya kufanya jambo kwa haraka. Katika muktadha huu kinaonyesha kwamba kuanguka kwa Sauli kulitokea papo hapo, bila kudokeza kwamba aliharakisha kwa kusudi fulani.
- source_word: וַיִּפֹּל
  choice: akaanguka
  rationale: Hili ndilo wazo la msingi la kitenzi; huepuka tafsiri pana zaidi kama ‘akazimia’ au ‘akaporomoka.’
- source_word: מְלֹא קוֹמָתוֹ
  choice: kwa urefu wake wote
  rationale: Nahau hii inaonyesha kwamba mwili wake wote ulilala chini kwa urefu wake, si kwamba alijikwaa tu.
- source_word: אַרְצָה
  choice: chini
  rationale: Nomino yenye kiambishi cha mwelekeo ina maana ya kuelekea ardhini; ‘chini’ ni Kiswahili cha kawaida katika simulizi hii.
- source_word: וַיִּרָא מְאֹד
  choice: akaogopa sana
  rationale: Huwasilisha moja kwa moja kiwango kikubwa cha hofu kinachoonyeshwa na מְאֹד.
- source_word: מִדִּבְרֵי שְׁמוּאֵל
  choice: kwa sababu ya maneno ya Samweli
  rationale: Katika muktadha huu kiambishi מִן kinaonyesha kisababishi cha hofu yake.
- source_word: גַּם כֹּחַ לֹא הָיָה בוֹ
  choice: Pia hakuwa na nguvu
  rationale: ‘Pia’ huhifadhi maana ya nyongeza ya גַּם, na sentensi haisemi kwa ziada kwamba nguvu zilikuwa ‘zimemwishia.’
- source_word: כִּי
  choice: kwa kuwa
  rationale: Huanzisha sababu ya kutokuwa kwake na nguvu kwa Kiswahili cha kawaida na chenye staha.
- source_word: לֹא אָכַל לֶחֶם
  choice: hakuwa amekula mkate
  rationale: ‘Mkate’ huhifadhi neno halisi לֶחֶם, ingawa katika matumizi haya linaweza kumaanisha chakula kwa upana zaidi.
- source_word: כָּל הַיּוֹם וְכָל הַלָּיְלָה
  choice: siku ile yote na usiku ule wote
  rationale: Huhifadhi ukamilifu wa vipindi vyote viwili na kuvihusisha na siku na usiku hususa wa simulizi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘kwa urefu wake wote’ umechaguliwa ili kuhifadhi nahau ya Kiebrania bila kuongeza kwamba alianguka kifudifudi. Alama ya tanbihi imewekwa baada ya ‘mkate,’ ambako maelezo yake ya kileksika yanahusika.
