base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/024.yaml
  text: The woman had a fattened calf in the house[a], and she hurried and slaughtered it. Then she took flour, kneaded it[c][b], and baked unleavened bread.
translation:
  language: sw
  text: Mwanamke huyo alikuwa na ndama aliyenoneshwa ndani ya nyumba[a]. Akaharakisha, akamchinja[b]. Kisha akachukua unga, akaukanda, na kuoka mikate isiyotiwa chachu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndama wa zizini”; kwa mapokeo, “ndama aliyenoneshwa.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi hiki kinaweza kumaanisha kuchinja kwa ajili ya dhabihu katika baadhi ya miktadha, lakini hapa kinamaanisha kumchinja mnyama kwa ajili ya chakula.
    reason: lexical_alternative
  - marker: c
    text: Au, “mikate myembamba isiyotiwa chachu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵגֶל מַרְבֵּק
  choice: ndama aliyenoneshwa
  rationale: Kirai hiki humaanisha ndama aliyefugwa kwa kusudi la kunenepeshwa, labda zizini. Tafsiri hii ni ya kawaida na inaeleweka kuliko tafsiri ya neno kwa neno kama ‘ndama wa zizini’.
- source_word: בַּבַּיִת
  choice: ndani ya nyumba
  rationale: Huhifadhi maana halisi ya mahali iliyo katika Kiebrania, badala ya maana pana zaidi ya ‘nyumbani’.
- source_word: וַתְּמַהֵר
  choice: akafanya haraka
  rationale: Inaonyesha uharaka wa tendo kwa Kiswahili cha kawaida na cha simulizi.
- source_word: וַתִּזְבָּחֵהוּ
  choice: akamchinja
  rationale: Katika muktadha huu mnyama anachinjwa ili kuandaa chakula; hakuna dalili kwamba ni dhabihu ya ibada.
- source_word: קֶמַח
  choice: unga
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa unga unaotumiwa kuoka.
- source_word: וַתָּלָשׁ
  choice: akaukanda
  rationale: Kitenzi cha Kiebrania kinamaanisha kukanda unga; kiambishi cha yambwa kinahifadhi mfululizo wa matendo.
- source_word: וַתֹּפֵהוּ מַצּוֹת
  choice: na kuoka mikate isiyotiwa chachu
  rationale: Tafsiri hii ya kawaida huonyesha matokeo ya kuoka bila kufanya sentensi ya Kiswahili kuwa nzito kwa kulazimisha kiwakilishi cha yambwa.
theological_decisions:
- issue: Ikiwa kuchinja ndama hapa kulikuwa dhabihu ya kidini
  choice: akamchinja
  alternative: akamtoa dhabihu
  rationale: Muktadha ni maandalizi ya chakula. Ingawa kitenzi זבח kinaweza kutumiwa kwa uchinjaji wa dhabihu katika miktadha mingine, hapa tafsiri ya kidini ingeongeza maana isiyoelezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa na wenye heshima. ‘Ndani ya nyumba’ huhifadhi uhalisi wa mahali, na mfululizo wa vitenzi vya ‘aka-’ huleta mtiririko wa kawaida wa masimulizi.
