  text: וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה אֶת מִ֖י אַֽעֲלֶה לָּ֑/ךְ וַ/יֹּ֕אמֶר אֶת שְׁמוּאֵ֖ל הַֽעֲלִי לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/011.yaml
  text: Then the woman said[a], “Whom shall I bring up for you?” And he said, “Bring up Samuel for me.”
translation:
  language: sw
  text: Kisha mwanamke akasema, “Nikupandishie[a] nani?” Naye akasema, “Nipandishie Samweli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nikuitie nani atoke?” Kitenzi cha Kiebrania kwa maana halisi ni “kupandisha” au “kusababisha apande,” nacho kinaakisi nahau iliyotumiwa katika muktadha huu wa kuwasiliana na wafu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Kisha ... akasema
  rationale: Kitenzi hiki katika mtiririko wa simulizi kinaendeleza tukio; “Kisha” kinaonyesha mfuatano huo kwa Kiswahili cha kawaida.
- source_word: הָאִשָּׁה
  choice: mwanamke
  rationale: Katika muktadha kinamtaja mwanamke wa Endori; “mwanamke” ndiyo tafsiri ya moja kwa moja na isiyoingiza maelezo ya ziada.
- source_word: אֶת מִי
  choice: nani
  rationale: Kiswahili hutumia “nani” kwa mtu anayefanywa yambwa wa kitenzi, bila kuhitaji umbo tofauti kama lilivyo katika baadhi ya lugha.
- source_word: אַעֲלֶה ... לָּךְ
  choice: Nikupandishie
  rationale: Umbo la kutendesha la עלה lina maana ya ‘kusababisha apande/kumpandisha.’ Kiambishi cha utendea -i- pamoja na -ku- kinaonyesha kuwa tendo linafanywa kwa ajili ya Sauli na kuhifadhi picha ya ‘kupandisha’.
- source_word: וַיֹּאמֶר
  choice: Naye akasema
  rationale: Hii inaendeleza mazungumzo kwa kawaida huku ikionyesha wazi kubadilika kwa msemaji.
- source_word: אֶת שְׁמוּאֵל
  choice: Samweli
  rationale: Kiashiria cha yambwa אֶת hakitafsiriwi kama neno tofauti; jina שְׁמוּאֵל linatolewa kwa umbo la Kiswahili lililozoeleka, “Samweli.”
- source_word: הַעֲלִי לִי
  choice: Nipandishie
  rationale: Amri hii kwa mwanamke inarudia mzizi na picha ya kitenzi cha awali. Umbo la utendea linaonyesha kwamba Sauli anaomba tendo hilo lifanywe kwa ajili yake.
theological_decisions:
- issue: Nahau ya עלה katika muktadha wa kuwasiliana na wafu
  choice: kupandisha
  alternative: kuita atoke; kumwita aje
  rationale: “Kupandisha” huhifadhi picha ya Kiebrania ya kusababisha mtu apande bila kufafanua jinsi tukio hilo lilivyotokea au kulazimisha msimamo wa kiteolojia kuhusu uwezo wa mwanamke huyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa kawaida lakini wenye heshima. “Nikupandishie” ni fupi, asilia, na hudumisha urudiaji wa kitenzi katika mistari yote miwili.
