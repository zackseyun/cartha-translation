  to: Mfilisti alipotazama na kumwona Daudi, alimdharau, kwa sababu alikuwa kijana, mwekundu[a] na mwenye sura nzuri.
  rationale: 'The revision removes the unwarranted object marker from the first verb so that the Swahili follows the Hebrew narrative progression: the Philistine looked, then saw David. It also uses the more concise adjective ''mwekundu,'' while the retained note preserves the lexical ambiguity concerning reddish colouring and hair.'
