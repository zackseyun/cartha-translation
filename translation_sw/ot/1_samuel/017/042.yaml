base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/042.yaml
  text: When the Philistine looked and saw David[a], he despised him, because he was a youth, ruddy and handsome in appearance.
translation:
  language: sw
  text: Mfilisti alipotazama na kumwona Daudi, alimdharau, kwa sababu alikuwa kijana, mwekundu[a] na mwenye sura nzuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwenye nywele nyekundu”; kivumishi cha Kiebrania kinaweza kumaanisha rangi yenye wekundu kwa ujumla, si lazima rangi ya nywele pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: alipomtazama
  rationale: Kitenzi נבט kinaonyesha kuelekeza macho kwa mtu; “kumtazama” ni Kiswahili cha kawaida na kinahifadhi mfuatano na kitenzi kinachofuata, “kumwona.”
- source_word: הַפְּלִשְׁתִּי
  choice: Yule Mfilisti
  rationale: Neno la Kiebrania ni “Mfilisti” tu. Kiashiria “yule” kinatambulisha mhusika aliyekwisha tajwa bila kuongeza cheo cha “shujaa.”
- source_word: וַיִּרְאֶה אֶת דָּוִד
  choice: kumwona Daudi
  rationale: ראה ni kitenzi cha kawaida cha kuona; tafsiri hii inadumisha hatua ya simulizi kutoka kutazama hadi kuona.
- source_word: וַיִּבְזֵהוּ
  choice: alimdharau
  rationale: בזה humaanisha kumwona mtu kuwa hafai au kumtendea kwa dharau; “alimdharau” ni fupi, wazi, na ya asili.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי inatoa sababu ya Mfilisti kumdharau Daudi.
- source_word: הָיָה נַעַר
  choice: alikuwa kijana
  rationale: נַעַר inaweza kuwa mvulana au kijana kulingana na muktadha; “kijana” haimfanyi Daudi aonekane lazima kuwa mtoto mdogo.
- source_word: אַדְמֹנִי
  choice: mwenye rangi nyekundu
  rationale: Kivumishi hiki huonyesha rangi yenye wekundu, lakini hakibainishi kwa lazima kama ni ngozi au nywele; tafsiri pana inalinda utata huo.
- source_word: עִם יְפֵה מַרְאֶה
  choice: na sura nzuri
  rationale: Kirai kinaeleza mwonekano mzuri; “sura nzuri” ni cha kawaida, chenye heshima, na kinachoeleweka kwa urahisi.
