review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the two sequential Hebrew actions ('looked' and 'saw David'), the Philistine designation, contempt, David's youth, the broad reddish-colouring adjective, and his attractive appearance. However, 'alipomtazama na kumwona Daudi' makes the first verb explicitly take David as its object and then repeats the same perception, whereas the Hebrew first says simply that the Philistine looked, then that he saw David.
  naturalness: The wording is generally clear and suitably formal. 'Mfilisti alipotazama na kumwona Daudi' is more idiomatic and accurately reflects the Hebrew sequence. 'Mwekundu' is a concise natural rendering of the adjective and, with the footnote retained, does not limit it to hair colour.
  terminology: '''Mfilisti,'' ''Daudi,'' ''alimdharau,'' and ''kijana'' are appropriate Standard East African Swahili choices. ''Mwenye sura nzuri'' naturally conveys ''fair/handsome in appearance.'''
  issues:
  - severity: medium
    issue: 'The first perception verb is given an explicit David-object before the second verb: ''alipomtazama na kumwona Daudi.'''
    rationale: The Hebrew construction has an intransitive/general 'looked' followed by 'saw David.' The draft's object-marked first verb blurs this deliberate sequence and makes the wording slightly tautological.
  revised_text: Mfilisti alipotazama na kumwona Daudi, alimdharau, kwa sababu alikuwa kijana, mwekundu[a] na mwenye sura nzuri.
  revised_footnotes:
  - marker: a
    text: Au “mwenye nywele nyekundu”; kivumishi cha Kiebrania kinaweza kumaanisha rangi yenye wekundu kwa ujumla, si lazima rangi ya nywele pekee.
    reason: lexical_alternative
  revision_rationale: 'The revision removes the unwarranted object marker from the first verb so that the Swahili follows the Hebrew narrative progression: the Philistine looked, then saw David. It also uses the more concise adjective ''mwekundu,'' while the retained note preserves the lexical ambiguity concerning reddish colouring and hair.'
