source:
  edition: WLC
  text: הַ/יּ֣וֹם הַ/זֶּ֡ה יְסַגֶּרְ/ךָ֩ יְהוָ֨ה בְּ/יָדִ֜/י וְ/הִכִּיתִ֗/ךָ וַ/הֲסִרֹתִ֤י אֶת רֹֽאשְׁ/ךָ֙ מֵ/עָלֶ֔י/ךָ וְ/נָ֨תַתִּ֜י פֶּ֣גֶר מַחֲנֵ֤ה פְלִשְׁתִּים֙ הַ/יּ֣וֹם הַ/זֶּ֔ה לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/חַיַּ֣ת הָ/אָ֑רֶץ וְ/יֵֽדְעוּ֙ כָּל הָ/אָ֔רֶץ כִּ֛י יֵ֥שׁ אֱלֹהִ֖ים לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/046.yaml
  text: This day Yahweh will deliver you into my hand[a], and I will strike you down and remove your head from you. And this day I will give the corpses of the Philistine camp to the birds of the sky and to the wild animals of the earth, so that all the earth may know that there is a God for Israel.
translation:
  language: sw
  text: Leo hii Yahweh atakutia mkononi mwangu; nami nitakuangusha na nitaondoa kichwa chako kutoka kwako. Leo hii nitawapa ndege wa angani na wanyama wa mwituni maiti za kambi ya Wafilisti, ili dunia yote ijue kwamba kuna Mungu kwa ajili ya Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuna Mungu katika Israeli.” Kiebrania kinasema kihalisi “kwa Israeli,” jambo linaloweza kuonyesha uhusiano wa agano au kwamba Mungu anaitetea Israeli.
    reason: alternative_reading
lexical_decisions:
- source_word: יְסַגֶּרְךָ ... בְּיָדִי
  choice: atakutia mkononi mwangu
  rationale: Hifili ya סגר hapa ina maana ya kumtia mtu chini ya mamlaka ya mwingine. Kauli hii inahifadhi taswira ya Kiebrania ya mkono kama mamlaka na ni ya kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limeendelezwa kama jina binafsi badala ya kubadilishwa na cheo.
- source_word: וְהִכִּיתִךָ
  choice: nitakuangusha
  rationale: Katika pambano hili, נכה inaashiria kumpiga adui mpaka aanguke na kufa. 'Nitakuangusha' ni ya asili na haipunguzi nguvu ya tishio.
- source_word: וַהֲסִרֹתִי אֶת־רֹאשְׁךָ מֵעָלֶיךָ
  choice: kukiondoa kichwa chako kutoka mwilini mwako
  rationale: Kitenzi סור kimsingi ni 'ondoa,' si kitenzi cha moja kwa moja cha 'kata.' Kutaja mwili kunafanya taswira hiyo ieleweke kwa Kiswahili bila kubadili tendo linalokusudiwa.
- source_word: פֶּגֶר מַחֲנֵה פְלִשְׁתִּים
  choice: maiti za kambi ya Wafilisti
  rationale: Ingawa פֶּגֶר iko katika umoja wa kimofolojia, hapa ina maana ya jumla inayohusu waliokufa katika kambi. 'Maiti' linafaa kwa miili ya wanadamu na lina hadhi inayofaa.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: ndege wa angani
  rationale: Hii ni namna ya kawaida na ya sasa ya kuwasilisha usemi wa Kiebrania bila kupoteza taswira yake.
- source_word: וּלְחַיַּת הָאָרֶץ
  choice: wanyama wa mwituni
  rationale: חַיָּה katika muktadha huu ni wanyama wa nchi wasiofugwa; 'wanyama wa mwituni' ni Kiswahili cha kawaida na wazi.
- source_word: וְיֵדְעוּ כָּל־הָאָרֶץ
  choice: ili dunia yote ijue
  rationale: Muunganiko wa וְ na kitenzi kisichotimilika hapa unaweza kuonyesha matokeo au kusudi. 'Ili' huwasilisha mtiririko huo kwa Kiswahili cha asili.
- source_word: יֵשׁ אֱלֹהִים לְיִשְׂרָאֵל
  choice: kuna Mungu kwa ajili ya Israeli
  rationale: Tafsiri hii inadumisha nguvu ya kawaida ya לְ kama 'kwa ajili ya' na hivyo kuhifadhi uwezekano wa uhusiano au utetezi wa Mungu kwa Israeli.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo. 'Yahweh' hulihifadhi moja kwa moja bila kutumia kibadala cha 'Bwana.'
- issue: Uhusiano unaoonyeshwa na לְיִשְׂרָאֵל
  choice: kuna Mungu kwa ajili ya Israeli
  alternative: kuna Mungu katika Israeli
  rationale: לְ kwa kawaida humaanisha 'kwa/ kwa ajili ya,' lakini katika usemi huu pia inaweza kueleweka kimahali au kama umilikaji. Tafsiri kuu inahifadhi uhusiano wa moja kwa moja, huku tafsiri nyingine ikiwekwa katika tanbihi ili kutatua utata huo bila kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi ukali wa hotuba ya vita bila kutumia msamiati wa kale usio wa lazima. Alama ya tanbihi imewekwa baada ya kishazi inachokifafanua.
