base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/051.yaml
  text: Then David ran and stood over the Philistine[a], took his sword, drew it from its sheath, and killed him; then he cut off his head with it. When the Philistines saw that their champion was dead[b], they fled.
translation:
  language: sw
  text: Ndipo Daudi akakimbia, akasimama juu ya yule Mfilisti[a], akauchukua upanga wa yule Mfilisti, akaunyoa katika ala yake, akamuua; kisha akamkata kichwa kwa upanga huo. Wafilisti walipoona kwamba shujaa wao alikuwa amekufa[b], wakatoroka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akasimama karibu na yule Mfilisti.” Kirai cha Kiebrania kinaweza kumaanisha kuchukua nafasi karibu naye; “juu ya” kinaonyesha tukio linalowezekana la Daudi kusimama juu ya Goliathi aliyeanguka.
    reason: lexical_alternative
  - marker: b
    text: Au, “mpiganaji wao hodari.” Neno la Kiebrania linaweza kumaanisha mtu hodari, mpiganaji, au shujaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: akakimbia
  rationale: Kitenzi רוץ kina maana ya msingi ya kukimbia; “akakimbia” ni simulizi la kawaida na la asili katika Kiswahili.
- source_word: וַיַּעֲמֹד אֶל הַפְּלִשְׁתִּי
  choice: akasimama juu ya yule Mfilisti
  rationale: Kirai kinaweza kumaanisha kusimama karibu na Mfilisti au juu yake. “Juu ya” kinaafikiana na tukio linalodokezwa la Daudi kusimama juu ya Goliathi aliyeanguka, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: חַרְבּוֹ
  choice: upanga wake
  rationale: Kiwakilishi cha Kiebrania kinaonyesha wazi kuwa ulikuwa upanga wa Mfilisti.
- source_word: וַיִּשְׁלְפָהּ מִתַּעְרָהּ
  choice: kuuchomoa alani mwake
  rationale: שלף ni kuchomoa silaha, na תער hapa ni ala, yaani kifuniko cha kuhifadhia upanga.
- source_word: וַיְמֹתְתֵהוּ
  choice: akamuua
  rationale: Umbo la kitenzi kutoka מות linaeleza kumsababishia kifo. Mpangilio wa simulizi umehifadhiwa bila kujaribu kuondoa mvutano na mstari uliotangulia.
- source_word: וַיִּכְרָת בָּהּ אֶת רֹאשׁוֹ
  choice: ak amkata kichwa kwa upanga huo
  rationale: כרת pamoja na ראשׁ humaanisha kukata kichwa; “kwa upanga huo” huweka wazi kwamba kiwakilishi kinarejelea upanga.
- source_word: גִּבּוֹרָם
  choice: shujaa wao
  rationale: גבור humaanisha mtu hodari au mpiganaji. “Shujaa wao” ni Kiswahili cha asili kinachowasilisha hadhi ya Goliathi kama mpiganaji mkuu wa Wafilisti bila kuficha upana wa neno.
- source_word: וַיָּנֻסוּ
  choice: wakakimbia
  rationale: Kitenzi נוס kinaonyesha kukimbia kutoka vitani; muktadha unaweka wazi kuwa walitoroka.
theological_decisions:
- issue: Kauli kwamba Daudi “akamuua” baada ya Goliathi kuanguka katika mstari uliotangulia
  choice: 'Kudumisha mfuatano wa Kiebrania: “akamuua; kisha akamkata kichwa.”'
  alternative: Kutafsiri kwa ufafanuzi kuwa Daudi “akammaliza” au kwamba kukatwa kichwa ndiko kulikomuua.
  rationale: Chanzo chenyewe kinatumia kitenzi cha kuua kabla ya kutaja kukatwa kichwa. Tafsiri haipaswi kusawazisha kimya kimya mvutano wa kisimulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa Biblia lakini kinachoeleweka kwa msomaji wa kawaida. “Ala” limetumiwa kwa sheath, na viunganishi vya mfululizo vimehifadhi mwendo wa haraka wa simulizi.
