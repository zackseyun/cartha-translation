  terminology: «Asiyetahiriwa» na «Mungu aliye hai» ni sahihi na zinafaa. «Safu za vita» huakisi מַעַרְכוֹת kwa usahihi zaidi kuliko «majeshi», bila kudai kwamba Mungu ana jeshi kama referenti ya moja kwa moja ya neno hilo.
