base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/026.yaml
  text: And David said to the men standing with him, “What will be done for the man who strikes down this Philistine and removes disgrace from Israel? For who is this uncircumcised Philistine, this one who has defied the battle lines of the living God?”
translation:
  language: sw
  text: Daudi akawaambia wale wanaume waliokuwa wamesimama pamoja naye, “Atatendewa nini mtu atakayempiga huyu Mfilisti na kuiondolea Israeli aibu? Kwa maana huyu Mfilisti asiyetahiriwa ni nani, ambaye amezitukana safu za vita za Mungu aliye hai?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַכֶּה
  choice: atakayemuua
  rationale: Katika muktadha wa pambano hili, kitenzi ‘kupiga’ kinamaanisha kumpiga na kumuua Goliathi; ‘kumuua’ huwasilisha maana iliyokusudiwa kwa Kiswahili cha kawaida.
- source_word: חֶרְפָּה
  choice: aibu
  rationale: Neno hili huonyesha fedheha au shutuma iliyowekwa juu ya Israeli; ‘aibu’ ni ya asili na inaeleweka kwa urahisi hapa.
- source_word: הֶעָרֵל
  choice: asiyetahiriwa
  rationale: Tafsiri ya moja kwa moja inayohifadhi alama ya agano na dharau iliyomo katika usemi wa Daudi bila kuifafanua kupita kiasi.
- source_word: מַעַרְכוֹת
  choice: majeshi
  rationale: Kwa wingi katika muktadha wa vita, neno hili linaweza kumaanisha safu za mapigano au vikosi vilivyopangwa; ‘majeshi’ ni usemi wa kawaida unaofaa kwa Israeli waliopangwa vitani.
- source_word: חֵרֵף
  choice: ayatukane
  rationale: Huwasilisha tendo la kumkashifu au kumdharau Mungu kwa kuyadhihaki majeshi yake; hali ya kutimilika katika Kiswahili inaendana na muundo wa Kiebrania baada ya ‘hata’.
theological_decisions:
- issue: Utambulisho wa Mungu kama אֱלֹהִים חַיִּים
  choice: Mungu aliye hai
  alternative: Mungu mwenye uhai
  rationale: ‘Mungu aliye hai’ ni usemi wa kawaida, wa heshima, na huhifadhi tofauti ya Mungu wa Israeli na miungu isiyo na uhai.
- issue: Nguvu ya swali כִּי מִי ... כִּי חֵרֵף
  choice: ni nani, hata ayatukane
  alternative: ni nani, huyu ambaye ameyatukana
  rationale: Muundo huu huhifadhi swali la kejeli na hasira ya Daudi bila kulazimisha iwapo tendo linaangaliwa kama lililokamilika au linaloendelea; hapa Kiebrania kina kitenzi timilifu lakini athari ya dhihaka inaendelea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi nguvu ya usemi wa Daudi na mpangilio wa hoja ya Kiebrania, huku ikiepuka lugha nzito isiyo ya lazima.
