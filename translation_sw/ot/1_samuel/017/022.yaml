base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/022.yaml
  text: So David left the supplies with the keeper of the supplies[a], and ran to the battle line[c][b]. When he arrived, he asked his brothers how they were.
translation:
  language: sw
  text: Basi Daudi akaacha vitu alivyobeba mikononi mwa mtunzaji wa mizigo[a], akakimbia kwenda kwenye safu ya vita[b]. Alipofika, akawauliza ndugu zake hali zao[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vifaa.” Neno la Kiebrania כֵּלִים linaweza kumaanisha vitu, vyombo, vifaa au mizigo; hapa linaelekea kurejelea vitu ambavyo Daudi alikuwa amebeba.
    reason: lexical_alternative
  - marker: b
    text: Au “safu za jeshi.” Neno la Kiebrania מַעֲרָכָה hurejelea mpangilio wa askari walio tayari kwa vita.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “akawauliza ndugu zake kuhusu amani.” Hii ni nahau ya Kiebrania inayomaanisha kuulizia hali au ustawi wao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: akaviacha
  rationale: Kitenzi kina maana ya kuacha au kutenga; hapa hakidokezi kwamba Daudi alivitelekeza, bali alivikabidhi kwa muda.
- source_word: הַכֵּלִים מֵעָלָיו
  choice: vitu alivyobeba
  rationale: כֵּלִים ni neno pana kwa vitu, vyombo, vifaa au mizigo, na מֵעָלָיו huonyesha kwamba Daudi alikuwa amevibeba. Tafsiri hii inaweka wazi muktadha bila kuvifanya silaha au vifaa vya kijeshi.
- source_word: עַל יַד שׁוֹמֵר הַכֵּלִים
  choice: mikononi mwa mtunzaji wa mizigo
  rationale: Nahau hiyo inaonyesha kukabidhi vitu katika uangalizi wa mtu. 'Mikononi mwa' huhifadhi taswira ya Kiebrania na ni Kiswahili cha kawaida, huku 'mtunzaji wa mizigo' ikieleza kazi yake.
- source_word: וַיָּרָץ
  choice: akakimbia
  rationale: Hii ndiyo maana ya moja kwa moja ya kitenzi na inadumisha haraka ya tendo la Daudi.
- source_word: הַמַּעֲרָכָה
  choice: safu ya vita
  rationale: Neno linamaanisha mpangilio au safu iliyopangwa ya wanajeshi; 'safu ya vita' ni wazi na ya asili katika muktadha huu.
- source_word: וַיָּבֹא
  choice: Alipofika
  rationale: Kuweka tendo hili kama kishazi cha wakati kunawasilisha kwa Kiswahili cha asili mfuatano wa simulizi wa Kiebrania.
- source_word: וַיִּשְׁאַל לְאֶחָיו לְשָׁלוֹם
  choice: akawauliza ndugu zake hali zao
  rationale: Nahau ya Kiebrania, kihalisi kuuliza kuhusu amani, humaanisha kuulizia hali au ustawi wa mtu; 'hali zao' ni ya kawaida na sahihi.
