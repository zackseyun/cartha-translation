base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/033.yaml
  text: Saul said to David[a], “You are not able to go against this Philistine to fight with him, because you are a youth[b], and he has been a man of war from his youth.”
translation:
  language: sw
  text: Sauli akamwambia Daudi, “Huwezi kwenda kumkabili huyu Mfilisti na kupigana naye, kwa maana wewe ni kijana[a], naye amekuwa mtu wa vita tangu ujana wake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mvulana.” Neno la Kiebrania linaweza kumaanisha kijana, na katika baadhi ya miktadha mvulana.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: Huwezi
  rationale: Kitenzi hiki kinaonyesha kutokuwa na uwezo, si katazo tu. “Huwezi” ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: לָלֶכֶת אֶל
  choice: kwenda kumkabili
  rationale: Katika muktadha huu wa mapambano, maneno haya yana maana ya kumwendea mpinzani ili kukabiliana naye, si kwenda kwake tu.
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: huyu Mfilisti
  rationale: Hii inawakilisha kwa kawaida jina la kabila pamoja na kiashiria cha karibu.
- source_word: לְהִלָּחֵם עִמּוֹ
  choice: na kupigana naye
  rationale: Tafsiri hii inaeleza wazi kusudi la kumkabili na inadumisha wazo la kupigana pamoja na kiwakilishi cha mhusika.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa neno hili linaanzisha sababu ambayo Sauli anatoa kuhusu kutoweza kwa Daudi.
- source_word: נַעַר
  choice: kijana
  rationale: Neno la Kiebrania linaweza kumaanisha kijana au, kulingana na muktadha, mvulana. “Kijana” linafaa hapa bila kuamua kwa kupita kiasi umri mahususi wa Daudi.
- source_word: אִישׁ מִלְחָמָה
  choice: mtu wa vita
  rationale: Tafsiri hii inadumisha taswira na uzito wa usemi wa Kiebrania; katika muktadha inaashiria mtu mwenye uzoefu wa kupigana.
- source_word: מִנְּעֻרָיו
  choice: tangu ujana wake
  rationale: Hii inaonyesha kipindi kilichoanza wakati wa ujana wake na kuendelea hadi wakati unaozungumziwa.
