base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/020.yaml
  text: So David rose early in the morning[a], left the sheep with a keeper, took the supplies, and went, just as Jesse had commanded him[b]. He came to the encampment as the army was going out to the battle line and shouting the war cry.
translation:
  language: sw
  text: Basi Daudi akaamka asubuhi na mapema, akawaacha kondoo kwa mlinzi, akachukua vyakula, akaenda kama Yese alivyomwamuru. Alipofika kambini[a], jeshi lilikuwa likitoka kwenda kwenye mstari wa mapambano huku likipiga kelele za vita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye duara la kambi” au “kwenye boma la magari”; neno la Kiebrania huenda likarejelea hasa mpangilio wa kambi wa mviringo au uzio wake wa kujilinda.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi zaidi, “wakapiga kelele vitani” au “kwa ajili ya vita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם דָּוִד בַּבֹּקֶר
  choice: Daudi akaamka asubuhi na mapema
  rationale: Huwasilisha maana ya kuamka mapema na msisitizo wa wakati kwa Kiswahili cha kawaida na cha asili.
- source_word: וַיִּטֹּשׁ אֶת־הַצֹּאן עַל־שֹׁמֵר
  choice: akawaacha kondoo chini ya uangalizi wa mchungaji
  rationale: Kirai kinaonyesha kuwa kondoo waliachwa mikononi mwa mtu wa kuwatunza; ‘mchungaji’ linafaa mazingira ya ufugaji kuliko ‘mlinzi’ pekee.
- source_word: וַיִּשָּׂא
  choice: akachukua vyakula
  rationale: Kitenzi ni ‘akachukua/akabeba’; yambwa iliyodokezwa imetolewa katika muktadha wa mstari uliotangulia, yaani vyakula alivyotumwa kupeleka.
- source_word: כַּאֲשֶׁר צִוָּהוּ יִשָׁי
  choice: kama Yese alivyomwamuru
  rationale: ‘Alivyomwamuru’ huhifadhi nguvu ya צוה, yaani kutoa amri, bila kuongeza tafsiri ya kidhehebu.
- source_word: הַמַּעְגָּלָה
  choice: kambini
  rationale: Katika muktadha huu neno linarejelea eneo la kambi, ingawa linaweza kueleza kwa mahususi zaidi mpangilio wa kambi wa mviringo au uzio wake; uwezekano huo umehifadhiwa katika tanbihi.
- source_word: הַחַיִל הַיֹּצֵא אֶל־הַמַּעֲרָכָה
  choice: jeshi lilikuwa likitoka kwenda kwenye mstari wa mapambano
  rationale: Muundo huu huonyesha tendo lililokuwa likiendelea Daudi alipofika, na מַעֲרָכָה ni safu au mstari uliopangwa kwa vita.
- source_word: וְהֵרֵעוּ בַּמִּלְחָמָה
  choice: huku likipiga kelele za vita
  rationale: Hiphil ya רוע hapa ni kutoa sauti kubwa ya kijeshi. Tafsiri hii ni ya asili kwa Kiswahili huku tanbihi ikihifadhi muundo wa karibu zaidi na Kiebrania.
