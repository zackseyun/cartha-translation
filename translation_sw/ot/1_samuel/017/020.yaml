  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi unaoeleweka kwa wasomaji wa kawaida lakini wenye hadhi inayofaa maandiko. Viambishi vya mfululizo vimetumiwa katika sehemu ya kwanza, huku ‘lilikuwa likitoka’ kikihifadhi tendo la usuli lililokuwa likiendelea wakati Daudi alipofika.
