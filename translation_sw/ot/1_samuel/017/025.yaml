base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/025.yaml
  text: And the men of Israel said[a], “Have you seen this man who is coming up? Surely he is coming up to defy Israel. And it shall be that the man who strikes him down, the king will enrich him with great riches, and will give him his daughter, and will make his father’s house free in Israel.”
translation:
  language: sw
  text: Waisraeli wakasema, “Je, mmemwona mtu huyu anayekuja? Hakika anakuja kuitukana Israeli. Mtu atakayemwangusha, mfalme atamtajirisha sana, atampa binti yake, na ataifanya jamaa ya baba yake kuwa huru katika Israeli[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ataiondolea jamaa ya baba yake wajibu wa kifalme katika Israeli”; yaelekea ikimaanisha msamaha wa kodi au wa huduma nyingine za kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: Wanaume wa Israeli
  rationale: Ingawa אִישׁ ni umoja kisarufi, katika muktadha huu ina maana ya kijumla kwa wanajeshi Waisraeli waliokuwa wakizungumza; wingi ni wa kawaida na wazi katika Kiswahili.
- source_word: הַרְּאִיתֶם
  choice: Je, mmemwona
  rationale: Kitenzi hiki ni nafsi ya pili wingi na kina nguvu ya swali; wakati timilifu wa Kiswahili unaendana na mazungumzo ya papo hapo.
- source_word: הָאִישׁ הָעֹלֶה הַזֶּה
  choice: mtu huyu anayekuja mbele
  rationale: Kirai cha wakati endelevu kinaonyesha mwendo unaoendelea. ‘Anayekuja mbele’ ni Kiswahili cha kawaida kinachoonyesha kujitokeza au kusonga kuelekea eneo la mapambano bila kuongeza kwamba tayari anapigana.
- source_word: כִּי
  choice: Hakika
  rationale: Hapa כִּי inasisitiza maelezo yanayofuata kuliko kuonyesha sababu ya moja kwa moja.
- source_word: לְחָרֵף
  choice: kuitukana
  rationale: חרף humaanisha kutoa shutuma au dharau ya hadharani. ‘Kuitukana’ inaonyesha dharau hiyo dhidi ya Israeli bila kuipanua kuwa majeshi ya Israeli.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Chanzo kinataja Israeli yenyewe, si ‘majeshi ya Israeli’; tafsiri haiongezi maneno kutoka mistari ya jirani.
- source_word: יַכֶּנּוּ
  choice: atakayemwangusha
  rationale: נכה inaweza kumaanisha kumpiga, kumwangusha, au kumuua kulingana na muktadha. ‘Kumwangusha’ inaonyesha ushindi wa kuamua bila kuondoa kabisa upana wa kitenzi.
- source_word: יַעְשְׁרֶנּוּ ... עֹשֶׁר גָּדוֹל
  choice: mfalme atamtajirisha sana
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida kitenzi cha kumfanya tajiri pamoja na msisitizo wa nomino inayomaanisha utajiri mwingi.
- source_word: בִּתּוֹ יִתֶּן לוֹ
  choice: atampa binti yake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya zawadi iliyoahidiwa.
- source_word: בֵּית אָבִיו
  choice: jamaa ya baba yake
  rationale: Kirai hiki kinamaanisha nyumba au ukoo mpana wa upande wa baba, si jengo tu; ‘jamaa ya baba yake’ hutoa maana hiyo kwa uwazi.
- source_word: יַעֲשֶׂה חָפְשִׁי בְּיִשְׂרָאֵל
  choice: ataifanya jamaa ya baba yake kuwa huru katika Israeli[a]
  rationale: Maandishi makuu yanahifadhi maana pana ya חָפְשִׁי, huku tanbihi ikieleza uwezekano wa maana ya kiutawala bila kuifanya kuwa hakika.
