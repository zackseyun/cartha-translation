  text: And he had bronze greaves on his legs[a], and a bronze javelin between his shoulders.
translation:
  language: sw
  text: Alikuwa amevaa kinga za shaba kwenye miundi yake, naye alikuwa na mkuki wa kurusha wa shaba[a] kati ya mabega yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkuki.” Neno la Kiebrania huenda linamaanisha silaha nyepesi ya namna ya mkuki. Wengine wamelielewa kuwa aina nyingine ya silaha, lakini “mkuki wa kurusha” unafaa zaidi katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְחַת
  choice: kinga
  rationale: Neno hili linamaanisha silaha ya kujikinga iliyofunika sehemu ya chini ya mguu. “Kinga” pamoja na kirai “kwenye miundi yake” ni ya kawaida na inaeleweka kuliko istilahi ya kitaalamu isiyozoeleka.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Katika Kiswahili cha kawaida, “shaba” ndilo neno linalotumiwa kwa chuma hiki katika silaha za kale; katika muktadha huu chanzo huenda kinamaanisha aloi ya bronzi.
- source_word: עַל רַגְלָיו
  choice: kwenye miundi yake
  rationale: Kwa kuwa kinga hizi zilivaliwa kwenye sehemu za chini za miguu, “miundi” ni sahihi zaidi kuliko “nyayo” au “miguu” kwa ujumla.
- source_word: כִידוֹן
  choice: mkuki wa kurusha
  rationale: Neno la Kiebrania linaweza kumaanisha silaha nyepesi ya namna ya mkuki, huenda iliyotumiwa kurushwa, na linatofautishwa na mkuki mkubwa unaotajwa baadaye katika simulizi.
- source_word: בֵּין כְּתֵפָיו
  choice: katikati ya mabega yake
  rationale: Hii inafuata taswira ya Kiebrania moja kwa moja bila kuongeza kwamba silaha ilikuwa imefungwa au imetundikwa mgongoni.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umehifadhi maelezo ya moja kwa moja ya silaha na taswira ya “katikati ya mabega” bila kuongeza namna ilivyobebwa.
