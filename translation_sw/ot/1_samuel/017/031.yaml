  text: When the words that David had spoken were heard[a], they reported them before Saul, and he sent for him.
translation:
  language: sw
  text: Maneno ambayo Daudi alikuwa amesema yaliposikiwa, wakamweleza Sauli; naye akamwita Daudi aje kwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya neno kwa neno, “akamchukua.” Huenda Kiebrania kinamaanisha kwamba Sauli aliagiza Daudi aletwe mbele yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְּשָּׁמְעוּ
  choice: yaliposikiwa
  rationale: Kauli hii inaweza kueleweka kwa hali isiyotaja mtendaji. Kiswahili cha ‘yaliposikiwa’ huepuka kuingiza wahusika ambao Kiebrania hakiwataji wazi.
- source_word: הַדְּבָרִים אֲשֶׁר דִּבֶּר דָּוִד
  choice: Maneno ambayo Daudi alikuwa amesema
  rationale: ‘Maneno’ huhifadhi muktadha wa kauli za Daudi, na ‘alikuwa amesema’ huonyesha kuwa kusema kulitangulia kuripotiwa kwake.
- source_word: וַיַּגִּדוּ
  choice: watu wakayapeleka
  rationale: Kitenzi נגד hapa kina maana ya kutoa habari au kufikisha yaliyonenwa. ‘Wakayapeleka’ ni usemi wa kawaida wa kufikisha maneno kwa mfalme, huku ‘watu’ ikifanya mtendaji asiyeainishwa aeleweke kwa Kiswahili.
- source_word: לִפְנֵי שָׁאוּל
  choice: mbele ya Sauli
  rationale: Huhifadhi kwa ukaribu nahau ya Kiebrania, ambayo katika muktadha huu humaanisha kuyafikisha maneno hayo kwa Sauli au mbele yake.
- source_word: וַיִּקָּחֵהוּ
  choice: akaagiza Daudi aletwe kwake
  rationale: Ingawa לקח kwa kawaida ni ‘chukua,’ hapa Sauli anaonekana kusababisha Daudi aletwe mbele yake. Jina ‘Daudi’ limerudiwa ili kuepuka utata wa viwakilishi katika Kiswahili.
