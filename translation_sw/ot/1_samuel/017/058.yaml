  text: Saul said to him[a], “Whose son are you, young man?” And David said, “I am the son of your servant Jesse the Bethlehemite.”
translation:
  language: sw
  text: Sauli akamwambia, “Wewe ni mwana wa nani, kijana?” Daudi akasema, “Mimi ni mwana wa mtumishi wako Yese, mtu wa Bethlehemu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya neno kwa neno zaidi: “Mwana wa mtumishi wako Yese, mtu wa Bethlehemu.” Jibu la Kiebrania halina maneno ya wazi “Mimi ni.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן מִי
  choice: mwana wa nani
  rationale: Huhifadhi swali la Kiebrania kuhusu ukoo wa upande wa baba, huku likiwa la kawaida na wazi katika Kiswahili.
- source_word: הַנָּעַר
  choice: kijana
  rationale: Neno hili linaweza kumaanisha mvulana au kijana; katika muktadha huu “kijana” linafaa kwa umri na nafasi ya Daudi bila kumfanya aonekane mtoto mdogo.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Hapa ni namna ya heshima na kujishusha katika mazungumzo na mfalme; “mtumishi wako” huwasilisha matumizi hayo bila kusisitiza hali ya utumwa.
- source_word: בֵּית הַלַּחְמִי
  choice: Mbethlehemu
  rationale: Hili ni jina la kumtambulisha mtu kwa asili yake, yaani mtu wa Bethlehemu; “Mbethlehemu” huhifadhi muundo huo kwa ufupi.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: akamwambia ... akasema
  rationale: Kitenzi kilekile cha kawaida cha kusema kimetafsiriwa kwa namna ya kawaida katika Kiswahili; kiambishi cha yambwa katika usemi wa kwanza kinaonyesha kwamba Sauli alisema naye.
- source_word: בֶּן עַבְדְּךָ יִשַׁי
  choice: Mimi ni mwana wa mtumishi wako Yese
  rationale: Kiebrania hakina kitenzi kishirikishi kilichoandikwa, lakini Kiswahili cha kawaida huhitaji “Mimi ni” ili jibu lisikike kamili na wazi.
