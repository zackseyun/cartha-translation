base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/034.yaml
  text: David said to Saul[a], “Your servant was tending his father’s sheep[b], and when a lion or a bear would come and carry off a lamb from the flock,”
translation:
  language: sw
  text: Daudi akamwambia Sauli, “Mtumishi wako alikuwa mchungaji wa kondoo wa baba yake. Simba au dubu[a] alikuwa akija na kunyakua mwanakondoo[b] kutoka kundini,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa muundo rasmi zaidi, “simba na dubu.” Kiebrania hutumia “na,” lakini huenda maana yake ni ya mgawanyo: simba au dubu angeweza kuja.'
    reason: lexical_alternative
  - marker: b
    text: “Mwanakondoo” pia inaweza kutafsiriwa “kondoo” au “mnyama mmoja wa kundi,” kwa kuwa neno la Kiebrania linaweza kuwa pana kuliko mwanakondoo pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה הָיָה
  choice: alikuwa mchungaji
  rationale: Kirai hiki kinaeleza jukumu la Daudi lililoendelea wakati uliopita. ‘Alikuwa mchungaji’ ni Kiswahili cha kawaida na huhifadhi maana ya kazi yake.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Hii ni njia ya unyenyekevu ya kujitaja mbele ya mfalme; ‘mtumishi wako’ huepuka kusisitiza hali ya utumwa ambayo si hoja kuu hapa.
- source_word: לְאָבִיו בַּצֹּאן
  choice: wa kondoo wa baba yake
  rationale: Tafsiri hii ya asili inaonyesha kwamba Daudi alimchungia baba yake kundi la kondoo, bila kulazimisha muundo wa Kiebrania usio wa kawaida katika Kiswahili.
- source_word: וּבָא
  choice: alikuwa akija
  rationale: Katika simulizi hili tendo linaeleweka kuwa la kawaida au lililotokea kwa nyakati tofauti; umbo hili la Kiswahili linaonyesha hali hiyo ya mazoea.
- source_word: הָאֲרִי וְאֶת הַדּוֹב
  choice: simba au dubu
  rationale: 'Ingawa Kiebrania hutumia kiunganishi ‘na,’ maana inaelekea kuwa ya mgawanyo: kila mara mmoja wa wanyama hao ndiye aliyekuja.'
- source_word: וְנָשָׂא
  choice: na kumnyakua
  rationale: Katika muktadha wa mnyama mwindaji, neno hili lina maana ya kumkamata na kumchukua mawindo; ‘kumnyakua’ ni wazi na ya asili.
- source_word: שֶׂה
  choice: mwanakondoo
  rationale: Neno la Kiebrania linaweza kumaanisha mnyama mmoja wa kundi kwa upana zaidi, lakini ‘mwanakondoo’ linafaa katika muktadha huu na linaungwa mkono na mapokeo ya tafsiri.
- source_word: מֵהָעֵדֶר
  choice: kutoka kundini
  rationale: ‘Kundi’ ni neno la kawaida kwa mkusanyiko wa kondoo, na umbo ‘kundini’ linaonyesha wazi alikotolewa mnyama.
