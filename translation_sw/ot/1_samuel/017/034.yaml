  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa mazoea ‘alikuwa akija’ umehifadhiwa, na alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
