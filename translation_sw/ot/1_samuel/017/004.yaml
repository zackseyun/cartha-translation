  text: וַ/יֵּצֵ֤א אִֽישׁ הַ/בֵּנַ֨יִם֙ מִ/מַּחֲנ֣וֹת פְּלִשְׁתִּ֔ים גָּלְיָ֥ת שְׁמ֖/וֹ מִ/גַּ֑ת גָּבְה֕/וֹ שֵׁ֥שׁ אַמּ֖וֹת וָ/זָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/004.yaml
  text: Then a champion came out from the camps of the Philistines[a]; his name was Goliath, from Gath[b]. His height was six cubits and a span.
translation:
  language: sw
  text: Ndipo shujaa mmoja akatoka katika kambi za Wafilisti[a]; jina lake lilikuwa Goliathi, kutoka Gathi. Kimo chake kilikuwa dhiraa sita na shibiri moja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mtu wa katikati,” huenda ikimaanisha mpiganaji mwakilishi aliyetoka na kusimama kati ya safu za majeshi; ndiyo sababu limetafsiriwa “shujaa.”'
    reason: lexical_alternative
  - marker: b
    text: Dhiraa sita na shibiri moja ni takriban mita 3.0, ikitegemea urefu wa dhiraa iliyotumiwa.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ הַבֵּנַיִם
  choice: shujaa
  rationale: Nahau hii kihalisi ni ‘mtu wa katikati’ na inaelekea kumaanisha mpiganaji mwakilishi anayesimama kati ya safu za majeshi. ‘Shujaa’ ni neno la kawaida na linaloeleweka katika muktadha huu, huku maana halisi ikielezwa katika tanbihi.
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Kitenzi kina maana ya kutoka; muundo wa masimulizi ‘akatoka’ ni wa asili katika Kiswahili na unaendeleza tukio.
- source_word: מִמַּחֲנוֹת פְּלִשְׁתִּים
  choice: katika kambi za Wafilisti
  rationale: Nomino ya Kiebrania iko katika wingi, kwa hiyo ‘kambi za’ inadumisha idadi ya matini chanzi.
- source_word: גָּלְיָת
  choice: Goliathi
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: שְׁמוֹ
  choice: jina lake lilikuwa
  rationale: Hii inadumisha kwa njia ya kawaida muundo wa Kiebrania unaomtambulisha mtu kwa jina.
- source_word: מִגַּת
  choice: kutoka Gathi
  rationale: Kiebrania kinataja moja kwa moja mahali alikotoka badala ya kutumia jina la kimajimbo.
- source_word: גָּבְהוֹ
  choice: Kimo chake kilikuwa
  rationale: Nomino yenye kiambishi cha umilikaji inataja kimo chake; tafsiri hii ni wazi na ya kawaida.
- source_word: שֵׁשׁ אַמּוֹת וָזָרֶת
  choice: dhiraa sita na shibiri moja
  rationale: Vipimo vya kale vimehifadhiwa katika matini kuu kwa uaminifu kwa chanzo; makadirio ya kipimo cha kisasa yamewekwa katika tanbihi.
