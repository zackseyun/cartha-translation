translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina ‘Sauli’ na ‘Abneri’ yanafuata maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili. Alama ya tanbihi imewekwa baada ya kauli ya kiapo ambayo inaifafanua.
