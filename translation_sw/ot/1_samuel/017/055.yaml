base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/055.yaml
  text: When Saul saw David going out to meet the Philistine[a], he said to Abner, the commander of the army, “Whose son is this young man, Abner?” And Abner said, “As your soul lives, O king, I do not know.”
translation:
  language: sw
  text: Sauli alipomwona Daudi akitoka kwenda kukutana na yule Mfilisti, akamwambia Abneri, mkuu wa jeshi, “Abneri, kijana huyu ni mwana wa nani?” Abneri akajibu, “Kwa hakika, kama uishivyo,[a] ee mfalme, sijui.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hii ni kauli ya kiapo ya Kiebrania; kwa maana halisi zaidi, “Kwa uhai wa nafsi yako,” yaani, “Kwa hakika, kama uishivyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִ/רְאוֹת
  choice: alipomwona
  rationale: Muundo wa kiunganishi pamoja na kitenzi-jina unaanzisha kishazi cha wakati; ‘alipomwona’ ni Kiswahili cha kawaida kinachohifadhi uhusiano huo wa wakati.
- source_word: יֹצֵא לִ/קְרַאת
  choice: akitoka kwenda kukutana na
  rationale: Kivumishi-tendo יֹצֵא kinaonyesha Daudi akiwa katika mwendo wa kutoka, na לִקְרַאת humaanisha kwenda kukutana na mtu. Tafsiri hii inahifadhi mwendo wenye kuendelea bila kuongeza wazo lisilotajwa moja kwa moja kama ‘kupambana.’
- source_word: הַ/פְּלִשְׁתִּי
  choice: yule Mfilisti
  rationale: Kiebrania kina nomino ya mtu mmoja wa taifa la Wafilisti pamoja na kibainishi. ‘Yule Mfilisti’ ni ya asili katika muktadha huu na haiongezi cheo cha ‘shujaa’ ambacho hakipo katika kishazi hiki.
- source_word: שַׂר הַ/צָּבָא
  choice: mkuu wa jeshi
  rationale: Cheo hiki kinaonyesha uongozi wa kijeshi; ‘mkuu wa jeshi’ ni wazi, cha sasa, na chenye hadhi katika Kiswahili sanifu.
- source_word: בֶּן מִי זֶה הַ/נַּעַר
  choice: kijana huyu ni mwana wa nani?
  rationale: Hii inafuata maana ya swali la Kiebrania kwa mpangilio wa kawaida wa Kiswahili. ‘Kijana’ linafaa kuliko ‘mvulana’ kwa kuwa Daudi ni mdogo kwa umri lakini anatenda kama mpiganaji.
- source_word: חֵי נַפְשְׁ/ךָ
  choice: Kama uishivyo
  rationale: Hii ni kauli ya kiapo inayohusisha uhai wa anayesemeshwa. ‘Kama uishivyo’ hutoa maana yake kwa Kiswahili cha kawaida, huku maelezo ya chini yakihifadhi umbo lake halisi zaidi.
- source_word: אִם יָדָעְתִּי
  choice: sijui
  rationale: Katika kauli ya kiapo, אִם hutumiwa kwa namna iliyofupishwa kuonyesha kanusho lenye msisitizo. ‘Sijui’ hutoa maana inayokusudiwa bila kuleta fumbo la tafsiri sisisi ‘ikiwa najua.’
