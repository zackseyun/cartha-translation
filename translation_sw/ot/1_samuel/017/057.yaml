base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/057.yaml
  text: When David returned from striking down the Philistine[a], Abner took him and brought him before Saul, with the Philistine’s head in his hand.
translation:
  language: sw
  text: Daudi aliporudi baada ya kumuua yule Mfilisti, Abner akamchukua na kumleta mbele ya Sauli, na kichwa cha yule Mfilisti kilikuwa mkononi mwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “huku kichwa cha yule Mfilisti kikiwa mkononi mwake.” Kiebrania kina kishazi kisicho na kitenzi ambacho kinaweza kutafsiriwa kama kishazi cha hali inayoambatana na tukio au kama kishazi kingine kinachounganishwa na cha kwanza.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְשׁוּב
  choice: Daudi aliporudi
  rationale: Muundo wa kiunganishi pamoja na kitenzi-jina cha שוב unaanzisha kishazi cha wakati; ‘aliporudi’ ni Kiswahili cha kawaida kinachohifadhi uhusiano huo wa wakati.
- source_word: מֵהַכּוֹת
  choice: baada ya kumuua
  rationale: נכה humaanisha kupiga au kuangusha kwa pigo; katika muktadha huu tendo hilo lilisababisha kifo cha Mfilisti. ‘Kumuua’ linaeleza wazi maana inayokusudiwa hapa bila kutumia Kiswahili kisicho cha kawaida.
- source_word: הַפְּלִשְׁתִּי
  choice: yule Mfilisti
  rationale: Kiebrania kinasema ‘Mfilisti,’ si jina Goliathi wala ‘shujaa wa Mfilisti.’ ‘Yule’ humrejelea kwa kawaida mtu aliyetajwa katika simulizi.
- source_word: וַיִּקַּח אֹתוֹ
  choice: Abner akamchukua
  rationale: לקח pamoja na kiwakilishi cha yambwa humaanisha moja kwa moja ‘akamchukua’; uchaguzi huu haudokezi nguvu au ukamataji usiotajwa.
- source_word: וַיְבִאֵהוּ לִפְנֵי שָׁאוּל
  choice: na kumleta mbele ya Sauli
  rationale: Hifili ya בוא ni ‘kuleta,’ na לִפְנֵי hapa ni ‘mbele ya’ au katika uwepo wa Sauli.
- source_word: וְרֹאשׁ הַפְּלִשְׁתִּי בְּיָדוֹ
  choice: huku kichwa cha yule Mfilisti kikiwa mkononi mwake
  rationale: Kishazi hiki kisicho na kitenzi kinaeleweka kiasili kama hali iliyoambatana na kuletwa kwa Daudi. Muundo huu huhifadhi picha iliyo wazi na pia utata mdogo wa kimuundo wa Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa masimulizi umetumia mfuatano wa ‘aka-’ baada ya kishazi cha wakati. ‘Mkononi mwake’ limeachwa bila kufafanua jina la mwenye mkono, kama ilivyo katika chanzo, ingawa katika muktadha linamrejelea Daudi.
