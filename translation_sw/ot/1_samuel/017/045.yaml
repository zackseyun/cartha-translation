  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/פְּלִשְׁתִּ֔י אַתָּה֙ בָּ֣א אֵלַ֔/י בְּ/חֶ֖רֶב וּ/בַ/חֲנִ֣ית וּ/בְ/כִיד֑וֹן וְ/אָנֹכִ֣י בָֽא אֵלֶ֗י/ךָ בְּ/שֵׁם֙ יְהוָ֣ה צְבָא֔וֹת אֱלֹהֵ֛י מַעַרְכ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר חֵרַֽפְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/045.yaml
  text: Then David said to the Philistine[a], “You come to me with a sword, with a spear, and with a javelin, but I come to you in the name of Yahweh of Armies, the God of the armies of Israel[c][b], whom you have defied.”
translation:
  language: sw
  text: Ndipo Daudi akamwambia yule Mfilisti, “Wewe unanijia kwa upanga, mkuki na mkuki wa kurusha, lakini mimi ninakujia kwa jina la Yahweh wa Majeshi[a], Mungu wa safu za vita za Israeli[b], ambaye umemdharau[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yahweh wa Majeshi” pia hutafsiriwa kimapokeo “BWANA wa majeshi.” Neno la Kiebrania linaweza kurejelea majeshi au makundi makubwa yaliyopangwa.
    reason: lexical_alternative
  - marker: b
    text: Au “Mungu wa majeshi ya Israeli.” Kiebrania kina wazo la safu au vikosi vilivyopangwa kwa vita.
    reason: lexical_alternative
  - marker: c
    text: “Umemdharau” pia inaweza kutafsiriwa “umemtukana” au “umemdhihaki.” Neno la Kiebrania hapa linaeleza dharau ya kumkabili Mungu wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Waw ya usimulizi inaendeleza mfuatano wa matukio; “Ndipo” na kitenzi cha usimulizi ni Kiswahili cha kawaida kinachohifadhi mwendelezo huo.
- source_word: הַפְּלִשְׁתִּי
  choice: yule Mfilisti
  rationale: Nomino humtambulisha Goliathi kwa taifa lake bila kuongeza wazo la “shujaa,” ambalo halijaandikwa hapa.
- source_word: בָּא אֵלַי / בָא אֵלֶיךָ
  choice: unanijia / ninakujia
  rationale: Maumbo haya yanaonyesha tendo la sasa au linalokaribia; muktadha tayari unaonyesha kuwa kuja huko ni kwa uhasama.
- source_word: בְּחֶרֶב
  choice: kwa upanga
  rationale: Kihusishi ב kinaonyesha chombo au njia; “kwa upanga” ni usemi wa kawaida wa Kiswahili.
- source_word: וּבַחֲנִית
  choice: mkuki
  rationale: חֲנִית ni mkuki; neno la kawaida limetumiwa ili maandishi yaeleweke kwa urahisi.
- source_word: וּבְכִידוֹן
  choice: mkuki wa kurusha
  rationale: כִידוֹן ni silaha nyepesi ya jamii ya mkuki, hasa ya kurushwa; tafsiri hii huitofautisha na חֲנִית bila kutumia neno lisiloeleweka kwa wasomaji wengi.
- source_word: בְּשֵׁם
  choice: kwa jina la
  rationale: Usemi huu huhusisha mamlaka na uwakilishi; “kwa jina la” huhifadhi nahau ya kibiblia na uzito wake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa na cheo.
- source_word: צְבָאוֹת
  choice: wa Majeshi
  rationale: צְבָאוֹת humaanisha majeshi au makundi makubwa yaliyopangwa; “wa Majeshi” ni wazi na huhifadhi maana ya kijeshi ya cheo hiki.
- source_word: אֱלֹהֵי מַעַרְכוֹת יִשְׂרָאֵל
  choice: Mungu wa safu za vita za Israeli
  rationale: מַעַרְכוֹת huelekeza hasa kwa vikosi vilivyopangwa katika safu za mapigano, si kwa dhana ya jumla ya majeshi pekee.
- source_word: אֲשֶׁר חֵרַפְתָּ
  choice: ambazo umezikaidi
  rationale: חרף hapa ni kudharau kwa kutoa changamoto. Kiambishi cha ngeli katika Kiswahili kimehusishwa na “safu za vita,” jambo linalolingana na marudio ya usemi huo katika muktadha wa karibu; tanbihi inaweka wazi uwezekano mwingine wa kisarufi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina la agano יְהוָה moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Jinsi ya kutafsiri יְהוָה צְבָאוֹת
  choice: Yahweh wa Majeshi
  alternative: BWANA wa majeshi / Yahweh wa majeshi ya mbinguni
  rationale: “Wa Majeshi” hutafsiri צְבָאוֹת kwa uwazi bila kuamua kimya-kimya kama majeshi yanayokusudiwa ni ya mbinguni, ya duniani, au yote mawili.
- issue: Rejeleo la אֲשֶׁר katika kifungu cha mwisho
  choice: safu za vita za Israeli ambazo Goliathi amezikaidi
  alternative: Mungu ambaye Goliathi amemkaidi
  rationale: Kiwakilishi cha Kiebrania אֲשֶׁר hakionyeshi idadi wala jinsia. Muktadha wa karibu unarudia wazo la Goliathi kuzikaidi safu za Israeli, lakini muundo pia unaweza kueleweka kuwa dharau yake ilimlenga Mungu; utata huo umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa moja kwa moja wa hotuba umehifadhiwa, huku istilahi za silaha na za kijeshi zikielezwa kwa maneno yanayoeleweka kwa wasomaji wa kawaida.
