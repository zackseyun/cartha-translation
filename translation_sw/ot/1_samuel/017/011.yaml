base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/011.yaml
  text: When Saul and all Israel heard these words of the Philistine[a], they were dismayed and greatly afraid.
translation:
  language: sw
  text: Sauli na Israeli wote waliposikia maneno hayo ya yule Mfilisti, walivunjika moyo na kuogopa sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: waliposikia
  rationale: Kitenzi שׁמע katika qal hapa humaanisha kusikia; muundo wa “waliposikia” unaunganisha kwa kawaida kitendo hicho na mwitikio unaofuata katika simulizi la Kiswahili.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Jina limetolewa kwa umbo la Kiswahili linalotumika kwa kawaida katika tafsiri za Biblia.
- source_word: וְכָל יִשְׂרָאֵל
  choice: na Israeli wote
  rationale: Hudumisha usemi wa pamoja wa Kiebrania, “Israeli wote,” badala ya kuufafanua kimyakimya kuwa jeshi au Waisraeli wote mmoja mmoja.
- source_word: דִּבְרֵי ... הָאֵלֶּה
  choice: maneno hayo
  rationale: דְּבָרִים hapa ni yale aliyosema Mfilisti; “maneno hayo” ni tafsiri ya moja kwa moja na ya kawaida kwa muktadha wa simulizi.
- source_word: הַפְּלִשְׁתִּי
  choice: yule Mfilisti
  rationale: Neno la pekee lenye kibainishi humrejelea Mfilisti maalumu aliyetangulia kutajwa; “yule Mfilisti” hutoa urejeleaji huo wazi na kwa Kiswahili cha kawaida.
- source_word: וַיֵּחַתּוּ
  choice: walivunjika moyo
  rationale: חתת hubeba wazo la kuvunjwa, kutiwa hofu, au kufadhaishwa. “Walivunjika moyo” huhifadhi taswira ya kuvunjika na kueleza kukata tamaa au kufadhaika bila kurudia tu kitenzi kinachofuata cha kuogopa.
- source_word: וַיִּירְאוּ מְאֹד
  choice: na kuogopa sana
  rationale: ירא humaanisha kuogopa, na מְאֹד huongeza kiwango; “kuogopa sana” ni usemi wa asili na wenye nguvu katika Kiswahili cha sasa.
