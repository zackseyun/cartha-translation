base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/043.yaml
  text: And the Philistine said to David[a], “Am I a dog[b], that you come to me with sticks?” And the Philistine cursed David by his gods.
translation:
  language: sw
  text: Mfilisti akamwambia Daudi, “Je, mimi ni mbwa, hata unanijia na vijiti[a]?” Kisha Mfilisti akamlaani Daudi kwa miungu yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fimbo.” Neno la Kiebrania linaweza kumaanisha vijiti, fimbo, au magongo; hapa usemi huo unaonyesha dharau ya Mfilisti.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa jina la miungu yake.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: Mfilisti
  rationale: Nomino hii inamtambulisha Goliathi kwa kabila lake. “Mfilisti” ni tafsiri ya kawaida na haiongezi maelezo yasiyokuwamo kama vile “shujaa.”
- source_word: הֲכֶלֶב אָנֹכִי
  choice: Je, mimi ni mbwa
  rationale: Swali hili la balagha linaonyesha hasira na kudharauliwa. Picha halisi ya “mbwa” imehifadhiwa kwa kuwa ni muhimu katika muktadha wa simulizi.
- source_word: כִּי
  choice: hata
  rationale: Katika swali hili la balagha, “hata” linaunganisha kwa Kiswahili cha kawaida hali anayodai Mfilisti na kitendo cha Daudi, bila kulifanya kuwa kauli ya sababu iliyo wazi kupita kiasi.
- source_word: בָא אֵלַי
  choice: unanijia
  rationale: Muundo huu unaonyesha kitendo kinachoendelea wakati huo. “Unanijia” ni wa moja kwa moja na wa kawaida katika mazungumzo.
- source_word: בַּמַּקְלוֹת
  choice: na vijiti
  rationale: מַקֵּל inaweza kumaanisha fimbo, gongo, au kijiti. Wingi na usemi wa dharau wa Mfilisti umehifadhiwa kwa “vijiti,” huku uwezekano wa “fimbo” ukitajwa katika tanbihi.
- source_word: וַיְקַלֵּל
  choice: akamlaani
  rationale: Kitenzi קלל hapa kinamaanisha kutamka au kuomba laana, si kumtukana tu; kwa hiyo “akamlaani” kinahifadhi maana ya kidini.
- source_word: בֵּאלֹהָיו
  choice: kwa miungu yake
  rationale: Kihusishi ב kinaonyesha chombo au kile kinachoombwa katika laana. “Kwa miungu yake” ni kifupi na cha kawaida, na wingi unaafikiana na muktadha wa Kifilisti.
theological_decisions:
- issue: Maana ya אֱלֹהִים yenye kiambishi cha nafsi ya tatu umoja katika muktadha wa Kifilisti
  choice: miungu yake
  alternative: mungu wake
  rationale: Ingawa אֱלֹהִים wakati mwingine inaweza kuwa umoja, katika muktadha huu wa mtu asiye Mwisraeli maana ya wingi ndiyo ya kawaida zaidi. Tafsiri hii haileti dhana ya umoja wa Mungu mahali ambapo maandishi yanaweza kurejelea miungu ya Wafilisti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa kawaida, wenye heshima na unaoeleweka kwa wasomaji wa leo. “Unanijia” na “vijiti” vinahifadhi uharaka na dharau ya kauli bila kuongeza maelezo ya kiufafanuzi ndani ya mstari.
