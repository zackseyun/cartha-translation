translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi na hadhi inayofaa maandiko. Viunganishi vya mfululizo vya ‘aka-’ vinawakilisha matendo ya Kiebrania yanayofuatana. ‘Yule Mfilisti’ hutumika kwa rejeleo la mhusika aliyekwisha tambuliwa, bila kuingiza tafsiri ya kidhehebu.
