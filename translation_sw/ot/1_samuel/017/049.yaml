base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/049.yaml
  text: Then David reached his hand into the bag[a], took a stone from there, slung it, and struck the Philistine on his forehead. The stone sank into his forehead[c][b], and he fell on his face to the ground.
translation:
  language: sw
  text: Kisha Daudi akaingiza mkono wake katika mfuko wake[a], akatoa jiwe humo, akalirusha kwa kombeo, akampiga Mfilisti kwenye paji la uso. Jiwe likazama katika paji la uso wake[b], naye akaanguka kifudifudi chini[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kibindoni.” Neno la Kiebrania lina maana pana ya chombo, kifaa, au kitu; hapa linarejelea chombo kilichokuwa na mawe ya Daudi.
    reason: lexical_alternative
  - marker: b
    text: Au, “Jiwe likajikita katika paji la uso wake.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “akaanguka juu ya uso wake kuelekea ardhini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ אֶל הַכֶּלִי
  choice: akaingiza mkono wake mfukoni
  rationale: Kirai cha Kiebrania kinasema kihalisi kwamba Daudi ‘alipeleka mkono wake kwenye/ndani ya chombo.’ Katika muktadha huu, ‘akaingiza mkono wake mfukoni’ ni Kiswahili cha kawaida na huonyesha kwamba alichukua jiwe kutoka ndani yake.
- source_word: הַכֶּלִי
  choice: mfuko
  rationale: כְּלִי ni neno pana kwa chombo, kifaa, au kitu cha matumizi; hapa ni kifaa kilichohifadhi mawe ya Daudi. ‘Mfuko’ ni wazi katika muktadha, huku tanbihi ikihifadhi uwezekano wa ‘kibindo.’
- source_word: אֶבֶן
  choice: jiwe
  rationale: ‘Jiwe’ ndilo neno la kawaida na sahihi kwa kitu ambacho Daudi alitumia kama kombora.
- source_word: וַיְקַלַּע
  choice: akalirusha kwa kombeo
  rationale: Kitenzi hiki humaanisha kurusha kwa kutumia kombeo. Tafsiri hii huweka wazi kifaa kilichotumiwa bila kuongeza maelezo yasiyokuwamo.
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי אֶל מִצְחוֹ
  choice: akampiga yule Mfilisti kwenye paji la uso
  rationale: ‘Kwenye paji la uso’ huonyesha kwa kawaida sehemu iliyopigwa, na אֶל hapa huelekeza kwenye sehemu ya mguso.
- source_word: וַתִּטְבַּע הָאֶבֶן בְּמִצְחוֹ
  choice: Jiwe likazama katika paji la uso wake
  rationale: Kitenzi טָבַע huonyesha kuzama au kujikita. ‘Likazama katika’ ni cha moja kwa moja na hakiongezi maelezo ya kianatomia yasiyotajwa.
- source_word: וַיִּפֹּל עַל פָּנָיו אַרְצָה
  choice: akaanguka kifudifudi chini
  rationale: Kirai hicho ni kihalisi ‘akaanguka juu ya uso wake kuelekea ardhini.’ ‘Kifudifudi chini’ ni Kiswahili cha asili kinachohifadhi mkao na mwelekeo wa kuanguka.
