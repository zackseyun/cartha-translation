base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/035.yaml
  text: I went out after it and struck it and rescued it from its mouth[a]; and when it rose up against me[b], I seized it by its beard and struck it and killed it.
translation:
  language: sw
  text: Nami nikatoka kumfuata, nikampiga, nikamwokoa kutoka kinywani mwake[a]. Alipoinuka dhidi yangu, nilimkamata kwa ndevu zake[b], nikampiga na kumuua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia viambishi vya umoja wa kiume kumrejelea mnyama; kwa Kiswahili pia mnyama hapa anarejelewa kwa viambishi vya ngeli ya A-WA.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni ‘kwa ndevu zake.’ Tafsiri nyingine hufasiri maneno hayo kuwa ‘kwa manyoya ya shingo yake’ au ‘kwa taya yake.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָאתִי אַחֲרָיו
  choice: Nami nilimfuata
  rationale: Katika mfululizo huu wa vitendo, maana ya kwenda nje na kumfuata mnyama inaelezwa kwa Kiswahili cha kawaida kwa ‘nilimfuata’; viambishi vya nafsi ya tatu ngeli ya A-WA vinafaa kwa mnyama anayejulikana katika simulizi.
- source_word: וְהִכִּתִיו
  choice: nikampiga
  rationale: Kitenzi נכה kina maana pana ya kupiga. ‘Nikampiga’ hakitangulizi maana ya kuua, kwa kuwa kifo kinaelezwa wazi mwishoni.
- source_word: וְהִצַּלְתִּי מִפִּיו
  choice: nikamwokoa kutoka kinywani mwake
  rationale: Hiphil ya נצל inaeleza kuokoa au kukomboa. Tafsiri inahifadhi taswira halisi ya ‘kinywa’ badala ya kuibadili kuwa ‘taya.’ Yule aliyeokolewa anaeleweka kutokana na mstari uliotangulia.
- source_word: וַיָּקָם עָלַי
  choice: Aliponiinukia
  rationale: Kirai קום על kinaonyesha mnyama kuinuka au kujitokeza kwa uhasama dhidi ya Daudi. Muundo wa ‘alipo-’ unaonyesha vizuri uhusiano wa wakati katika muktadha.
- source_word: וְהֶחֱזַקְתִּי בִּזְקָנוֹ
  choice: nilimkamata kwa ndevu zake
  rationale: חזק katika Hiphil hapa ni kushika kwa nguvu, na זקן kwa kawaida ni ‘ndevu.’ Tafsiri inahifadhi picha mahsusi ya Kiebrania badala ya kuifasiri kuwa manyoya ya shingo au taya.
- source_word: וַהֲמִיתִּיו
  choice: na kumuua
  rationale: Hiphil ya מות ina maana ya kusababisha afe, yaani kuua. Hii ndiyo hatua ya mwisho yenye maana ya kifo waziwazi.
