  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֵּ֨לְכ֜וּ שְׁלֹ֤שֶׁת בְּנֵֽי יִשַׁי֙ הַ/גְּדֹלִ֔ים הָלְכ֥וּ אַחֲרֵי שָׁא֖וּל לַ/מִּלְחָמָ֑ה וְ/שֵׁ֣ם שְׁלֹ֣שֶׁת בָּנָ֗י/ו אֲשֶׁ֤ר הָלְכוּ֙ בַּ/מִּלְחָמָ֔ה אֱלִיאָ֣ב הַ/בְּכ֗וֹר וּ/מִשְׁנֵ֨/הוּ֙ אֲבִ֣ינָדָ֔ב וְ/הַ/שְּׁלִשִׁ֖י שַׁמָּֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/013.yaml
  text: The three oldest sons of Jesse had gone after Saul to the battle. And the names of his three sons who had gone to the battle were Eliab the firstborn[a], his second Abinadab, and the third Shammah.
translation:
  language: sw
  text: Wana watatu wakubwa wa Yese walikuwa wameenda kumfuata Sauli vitani.[a] Majina ya wanawe watatu walioenda vitani yalikuwa Eliabu, mzaliwa wa kwanza; Abinadabu, wa pili; na Shama, wa tatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai cha Kiebrania kinaweza pia kutafsiriwa “kwenda nyuma ya Sauli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ / הָלְכוּ
  choice: walikuwa wameenda / walioenda
  rationale: Kauli ya wakati uliopita uliotangulia inaonyesha habari ya usuli katika simulizi, huku kirai cha pili kikitambulisha wana hao watatu.
- source_word: שְׁלֹשֶׁת בְּנֵי יִשַׁי הַגְּדֹלִים
  choice: wana watatu wakubwa wa Yese
  rationale: Katika muktadha wa familia, הַגְּדֹלִים humaanisha wakubwa kwa umri, si ukubwa wa mwili au cheo.
- source_word: אַחֲרֵי שָׁאוּל
  choice: kumfuata Sauli
  rationale: אַחֲרֵי inaweza kumaanisha kuwa nyuma ya mtu au kumfuata; hapa inaonyesha kwenda pamoja na Sauli katika kampeni ya kijeshi.
- source_word: לַמִּלְחָמָה / בַּמִּלְחָמָה
  choice: vitani
  rationale: Neno מִלְחָמָה linaweza kumaanisha vita au mapigano; ‘vitani’ ni usemi wa kawaida wa Kiswahili unaofaa kwa kwenda kushiriki katika mapambano haya.
- source_word: וְשֵׁם
  choice: Majina ... yalikuwa
  rationale: Ingawa שֵׁם ni umbo la umoja katika Kiebrania, hapa linaanzisha orodha ya majina mengi, hivyo wingi ni wa kawaida katika Kiswahili.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Kiambishi cha umilikaji kinamrejelea Yese na kinadumisha mshikamano wa sentensi ya Kiebrania.
- source_word: הַבְּכוֹר
  choice: mzaliwa wa kwanza
  rationale: בְּכוֹר ni neno la hadhi ya kifamilia linalomaanisha mzaliwa wa kwanza, si tu aliye mkubwa zaidi.
- source_word: וּמִשְׁנֵהוּ
  choice: wa pili
  rationale: Neno hili humtaja anayefuata kwa mpangilio baada ya mzaliwa wa kwanza; ‘wa pili’ ni wazi na asilia kwa Kiswahili.
- source_word: וְהַשְּׁלִשִׁי
  choice: na Shama, wa tatu
  rationale: Muundo huu unahifadhi mpangilio rasmi wa wana watatu.
- source_word: שַׁמָּה
  choice: Shama
  rationale: Hili ni umbo la kawaida la jina hili la Kiebrania katika tahajia ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Vitani’ na ‘kumfuata Sauli’ ni misemo ya kawaida na inayoeleweka, huku ‘mzaliwa wa kwanza’ ikihifadhi usahihi wa istilahi ya kifamilia.
