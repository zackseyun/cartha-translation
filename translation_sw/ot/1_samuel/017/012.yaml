  text: וְ/דָוִד֩ בֶּן אִ֨ישׁ אֶפְרָתִ֜י הַ/זֶּ֗ה מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה וּ/שְׁמ֣/וֹ יִשַׁ֔י וְ/ל֖/וֹ שְׁמֹנָ֣ה בָנִ֑ים וְ/הָ/אִישׁ֙ בִּ/ימֵ֣י שָׁא֔וּל זָקֵ֖ן בָּ֥א בַ/אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/012.yaml
  text: David was the son of an Ephrathite from Bethlehem of Judah[a], whose name was Jesse, and he had eight sons. In the days of Saul, the man was old, advanced in years.
translation:
  language: sw
  text: Daudi alikuwa mwana wa mtu huyu, Mwefrathi kutoka Bethlehemu ya Yuda, aliyeitwa Yese. Yese alikuwa na wana wanane. Katika siku za Sauli, mtu huyo alikuwa mzee, aliyeendelea sana kwa umri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina usemi usio wa kawaida; neno kwa neno, “mzee, aliyekuja miongoni mwa watu.” Inaelekea kuwa nahau inayomaanisha kwamba alikuwa ameendelea sana kwa umri.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: Mwefrathi
  rationale: Katika muktadha huu neno linamtaja mtu wa Efratha/Bethlehemu, si mtu wa kabila la Efraimu. “Mwefrathi” linahifadhi jina la kijiografia na kikabila la Kiebrania.
- source_word: הַזֶּה
  choice: huyu
  rationale: Kiwakilishi hiki cha kuonyesha kimehifadhiwa kwa Kiswahili cha kawaida katika kirai “mtu huyu Mwefrathi,” bila kuongeza kiashirio cha wakati kama “basi.”
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: kutoka Bethlehemu ya Yuda
  rationale: Hii ni tafsiri ya moja kwa moja ya mahali, na “ya Yuda” inaitofautisha Bethlehemu hii na maeneo mengine yenye jina hilo.
- source_word: וּשְׁמוֹ יִשַׁי
  choice: aliyeitwa Yese
  rationale: Hutoa utambulisho kwa Kiswahili cha asili huku ikihifadhi maana ya kwamba jina la mtu huyo lilikuwa Yese.
- source_word: וְלוֹ שְׁמֹנָה בָנִים
  choice: Yese alikuwa na wana wanane
  rationale: Muundo wa umilikaji umetafsiriwa kwa Kiswahili cha kawaida. Jina “Yese” limerudiwa ili kuondoa utata wa kiwakilishi bila kubadili anayerejelewa.
- source_word: בִּימֵי שָׁאוּל
  choice: Wakati wa Sauli
  rationale: Hii ndiyo njia ya kawaida na wazi ya Kiswahili ya kueleza kipindi kinachomaanishwa na nahau halisi “katika siku za Sauli.”
- source_word: זָקֵן
  choice: alikuwa mzee
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya hali ya kuwa mzee.
- source_word: בָּא בָאֲנָשִׁים
  choice: mwenye umri mkubwa
  rationale: Kirai cha Kiebrania si cha kawaida na maana yake ya muktadha inaelekea kwa mtu aliyeendelea sana kwa umri. Tafsiri hii ni ya asili kwa Kiswahili, huku tanbihi ikihifadhi usemi halisi na kutokawaida kwake.
- source_word: וְהָאִישׁ
  choice: mtu huyo
  rationale: Inahifadhi kurudiwa kwa “mtu” katika Kiebrania na inaonyesha wazi kwamba anayezungumziwa ni Yese.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Daudi, Bethlehemu, Yuda, Yese na Sauli. Sentensi imegawanywa ili marejeo kwa Yese yawe wazi; alama ya tanbihi imewekwa baada ya kirai kigumu cha mwisho ambacho tanbihi inafafanua.'
