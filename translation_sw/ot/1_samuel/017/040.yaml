base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/040.yaml
  text: He took his staff in his hand and chose for himself five smooth stones from the wadi[a], and put them in the shepherd’s bag that he had, in the pouch; and his sling was in his hand[b]. Then he approached the Philistine.
translation:
  language: sw
  text: Akaichukua fimbo yake mkononi, akajichagulia mawe matano laini kutoka kwenye kijito[a], akayatia katika mfuko wa mchungaji aliokuwa nao, yaani, katika pochi[b]. Kombeo lake lilikuwa mkononi; kisha akamkaribia yule Mfilisti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “korongo” au “njia ya maji ya msimu.” Neno la Kiebrania נַחַל linaweza kumaanisha kijito, korongo, au mkondo wa maji wa msimu, ambao unaweza kuwa mkavu wakati fulani.
    reason: lexical_alternative
  - marker: b
    text: Au “kibeti” au “mfuko mdogo.” Neno la Kiebrania יַלְקוּט humaanisha mfuko mdogo wa kubebea vitu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלוֹ
  choice: fimbo yake
  rationale: “Fimbo” ni neno la kawaida na lenye heshima kwa mkongojo au kijiti cha mchungaji katika muktadha huu.
- source_word: בְּיָדוֹ
  choice: mkononi
  rationale: Huhifadhi picha halisi ya tendo na msisitizo unaorudiwa kwamba vifaa vya Daudi vilikuwa tayari mkononi.
- source_word: וַיִּבְחַר לוֹ
  choice: akajichagulia
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida maana ya kuchagua kwa ajili yake mwenyewe iliyomo katika לוֹ.
- source_word: חֲמִשָּׁה חַלֻּקֵי אֲבָנִים
  choice: mawe matano laini
  rationale: “Laini” huwasilisha ulaini wa mawe yaliyosuguliwa na maji bila kudokeza lazima kwamba yalikuwa yameng'arishwa kwa makusudi.
- source_word: מִן הַנַּחַל
  choice: kutoka kwenye kijito
  rationale: נַחַל inaweza kumaanisha kijito, korongo lenye maji, au njia ya maji ya msimu. “Kijito” ni ya asili kwa wasomaji wa Kiswahili, huku tanbihi ikihifadhi upana wa maana.
- source_word: בִּכְלִי הָרֹעִים אֲשֶׁר לוֹ
  choice: katika mfuko wake wa kichungaji
  rationale: Ingawa כְּלִי ni neno pana kwa chombo au kifaa, muktadha wa kuweka mawe na יַלְקוּט inayofuata unaunga mkono “mfuko”; umilikaji umeunganishwa kiasili katika “wake.”
- source_word: וּבַיַּלְקוּט
  choice: yaani, katika pochi
  rationale: Kirai hiki kinaeleweka vizuri kama ufafanuzi wa chombo kilichotajwa kabla. “Pochi” hutofautisha mfuko mdogo bila kurudia tu neno “mfuko.”
- source_word: וְקַלְעוֹ בְיָדוֹ
  choice: Teo yake ilikuwa mkononi
  rationale: Kitenzi “ilikuwa” kimeongezwa ili kukamilisha sentensi ya Kiswahili, huku muundo wa orodha na picha ya silaha mkononi vikihifadhiwa.
- source_word: וַיִּגַּשׁ אֶל הַפְּלִשְׁתִּי
  choice: kisha akamkaribia yule Mfilisti
  rationale: “Akamkaribia” huonyesha kuja karibu naye bila kuongeza wazo lisilo la lazima la kushambulia; “kisha” huonyesha mwendelezo wa simulizi.
