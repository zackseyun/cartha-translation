base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/047.yaml
  text: and all this assembly will know that Yahweh does not save by sword or by spear[a]; for the battle belongs to Yahweh[c][b], and he will give you into our hand.
translation:
  language: sw
  text: Na kusanyiko hili lote litajua kwamba Yahweh haokoi kwa upanga wala kwa mkuki[a]; kwa maana vita ni vya Yahweh[b], naye atawatia mikononi mwetu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahweh hakomboi kwa upanga wala kwa mkuki.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “vita ni vya Yahweh.”'
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “mkononi mwetu”; nahau hii ina maana ya “chini ya uwezo wetu” au “katika mamlaka yetu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: na ... litajua
  rationale: Kitenzi cha Kiebrania kinaeleza matokeo ya wakati ujao katika hotuba ya Daudi; “litajua” kinahifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: kusanyiko hili lote
  rationale: קהל ni kundi lote lililokusanyika mahali hapo. “Kusanyiko” linafaa katika mazingira haya bila kuingiza maana maalumu ya kidini.
- source_word: לֹא בְּחֶרֶב וּבַחֲנִית יְהוֹשִׁיעַ יְהוָה
  choice: Yahweh haokoi kwa upanga wala kwa mkuki
  rationale: Hiphil ya ישׁע ina maana ya kuokoa au kukomboa. “Haokoi” inadumisha upana wa neno hilo, na “kwa ... wala kwa ...” inaonyesha vyombo ambavyo si chanzo cha wokovu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: כִּי לַיהוָה הַמִּלְחָמָה
  choice: kwa maana vita ni vya Yahweh
  rationale: כִּי hapa inatoa sababu, na muundo wenye ל unaonyesha kuwa vita ni mali au jambo la Yahweh. Kauli hii ni ya asili na wazi katika Kiswahili.
- source_word: וְנָתַן
  choice: naye atawatia
  rationale: Ingawa umbo ni qatal, muktadha wa tangazo linalotazamia matokeo unalipa maana ya wakati ujao.
- source_word: אֶתְכֶם בְּיָדֵנוּ
  choice: ninyi mkononi mwetu
  rationale: Maneno hayo yana maana halisi ya “ninyi katika mkono wetu” na ni nahau ya kuwaweka chini ya mamlaka yetu. “Mkononi mwetu” inadumisha umoja wa neno la Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu moja kwa moja; kulitohowa kama “Yahweh” kunadumisha jina hilo badala ya kuliweka kama cheo.
- issue: Upana wa maana ya יְהוֹשִׁיעַ katika mazingira ya vita
  choice: haokoi
  alternative: hakomboi; hatoi ushindi
  rationale: “Kuokoa” linafaa kwa ukombozi wa vitani huku likidumisha maana pana ya kitheolojia ya kitenzi; “kutoa ushindi” kungeifanya maana kuwa finyu zaidi.
- issue: Umiliki katika לַיהוָה הַמִּלְחָמָה
  choice: vita ni vya Yahweh
  alternative: vita ni mali ya Yahweh
  rationale: Tafsiri iliyochaguliwa inadumisha dai kwamba vita na matokeo yake yako chini ya Yahweh, bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sentensi unafuata hoja ya Kiebrania: matokeo, sababu, kisha tangazo la kukabidhi adui. Jina “Yahweh” limehifadhiwa.'
