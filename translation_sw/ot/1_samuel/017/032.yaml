translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau ya Kiebrania “moyo wa mtu usianguke” imetolewa kwa Kiswahili cha kawaida “asivunjike moyo.” Neno “mtumishi” linadumisha lugha ya heshima mbele ya mfalme. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
