  text: And David said to Saul[a], “Let no man's heart fail because of him[b]. Your servant will go and fight with this Philistine.”
translation:
  language: sw
  text: Ndipo Daudi akamwambia Sauli, “Mtu yeyote asikate tamaa kwa sababu yake.[a] Mtumishi wako atakwenda kupigana na huyu Mfilisti.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ya huyu Mfilisti.” Kiebrania kinasema “kwa sababu yake,” na anayerejelewa anajulikana kutokana na muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo ... akamwambia” ni mtiririko wa kawaida wa Kiswahili na pia inaonyesha kwamba maneno yanaelekezwa kwa Sauli.
- source_word: אַל יִפֹּל לֵב אָדָם
  choice: Mtu yeyote asivunjike moyo
  rationale: Hii ni tafsiri ya kawaida na wazi ya nahau ya Kiebrania inayosema kihalisi moyo wa mtu ‘usianguke’; “asivunjike moyo” huhifadhi maana ya kukata tamaa bila kuwa ngumu kueleweka.
- source_word: עָלָיו
  choice: kwa sababu yake
  rationale: Kiwakilishi kinamhusu Mfilisti kutokana na muktadha. Tafsiri hii huhifadhi kiwakilishi cha Kiebrania badala ya kutaja mhusika waziwazi katika matini kuu.
- source_word: עַבְדְּךָ
  choice: Mtumishi wako
  rationale: Ni namna ya heshima ya Daudi kujitaja mbele ya mfalme; “mtumishi” inafaa zaidi hapa kuliko “mtumwa.”
- source_word: יֵלֵךְ
  choice: atakwenda
  rationale: Kauli isiyotimilika hapa inaonyesha azimio au kusudi la Daudi.
- source_word: וְנִלְחַם
  choice: kupigana
  rationale: Pamoja na “atakwenda,” Kiswahili cha kawaida husema “atakwenda kupigana,” huku maana ya hatua mbili zilizoratibiwa ikibaki wazi.
- source_word: עִם הַפְּלִשְׁתִּי הַזֶּה
  choice: na huyu Mfilisti
  rationale: “Na” hufuata kwa karibu kihusishi עִם, ambacho katika muktadha wa vita humaanisha kukabiliana na mpinzani; kitenzi “kupigana” huondoa utata wa uhusiano huo.
