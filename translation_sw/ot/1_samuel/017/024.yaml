- source_word: הָאִישׁ
  choice: mtu huyo
  rationale: Kibainishi cha Kiebrania kinamrejelea yule mtu aliyekwisha tajwa, yaani Goliathi, bila kuongeza jina lisilo katika mstari huu.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: walimkimbia
  rationale: Inaonyesha walikimbia kutoka mbele yake au kwa sababu yake; ‘walimkimbia’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: וַיִּירְאוּ מְאֹד
  choice: na kuogopa sana
  rationale: Kitenzi na kielezi vinasisitiza kiwango kikubwa cha hofu; muundo huu ni wazi na wa kawaida.
