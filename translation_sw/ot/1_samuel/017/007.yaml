  text: The shaft of his spear was like a weaver’s beam[a], and the iron head of his spear weighed six hundred shekels; and the bearer of the shield went before him.
translation:
  language: sw
  text: Mti wa mkuki wake ulikuwa kama mti wa mfumaji, na kichwa cha mkuki wake cha chuma kilikuwa na uzito wa shekeli mia sita; naye mbeba ngao[a] alienda mbele yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ngao kubwa”; neno la Kiebrania linaweza kumaanisha ngao kubwa inayofunika mwili, tofauti na ngao ndogo.
    reason: lexical_alternative
lexical_decisions:
- source_word: חץ חֲנִיתוֹ
  choice: mpini wa mkuki wake
  rationale: Katika muktadha huu חץ inarejelea sehemu ndefu ya mkuki, si mshale. “Mpini wa mkuki” ni Kiswahili cha kawaida kinachoeleweka, ingawa sehemu hiyo pia inaweza kuitwa mti wa mkuki.
- source_word: כמנור ארגים
  choice: kama mti wa kufumia nguo
  rationale: Inahifadhi taswira ya mti mzito wa kifaa cha kufumia nguo kwa lugha inayoeleweka kwa msomaji wa kawaida.
- source_word: להבת חניתו
  choice: kichwa cha chuma cha mkuki wake
  rationale: להבת kwa kawaida hudokeza sehemu yenye makali au ncha; katika mkuki, “kichwa” hutaja kwa kawaida sehemu ya chuma inayochoma. Neno “chuma” linatokana na ברזל katika kishazi kinachofuata.
- source_word: שש מאות שקלים ברזל
  choice: kilikuwa na uzito wa shekeli mia sita
  rationale: Kiebrania kinasema kwa ufupi “shekeli mia sita za chuma.” Kuongeza “kilikuwa na uzito wa” kunatoa maana iliyokusudiwa kwa Kiswahili cha asili bila kubadili taarifa.
- source_word: נשא הצנה
  choice: mbeba ngao
  rationale: Hili ni jina la mtu aliyembebea Goliathi ngao. Muundo mfupi “mbeba ngao” ni wa kawaida na unaofuata maana ya Kiebrania.
- source_word: צנה
  choice: ngao
  rationale: צנה inaweza kumaanisha ngao kubwa inayofunika sehemu kubwa ya mwili. “Ngao” inafaa katika matini kuu, huku maana mahsusi zaidi ikihifadhiwa katika tanbihi.
- source_word: הלך לפניו
  choice: alitangulia mbele yake
  rationale: Inawasilisha tendo la mhudumu kwenda mbele ya Goliathi kwa Kiswahili cha kawaida na chenye hadhi.
