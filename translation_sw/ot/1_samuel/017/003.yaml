base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/003.yaml
  text: The Philistines were standing on the mountain on one side[a], and Israel was standing on the mountain on the other side[b], with the valley between them.
translation:
  language: sw
  text: Wafilisti walikuwa wamesimama juu ya mlima[a] upande mmoja, na Israeli walikuwa wamesimama juu ya mlima upande wa pili, huku bonde[b] likiwa katikati yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kilima” badala ya “mlima” katika sehemu zote mbili; neno la Kiebrania הַר linaweza kumaanisha mlima au kilima kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au “korongo” badala ya “bonde”; neno la Kiebrania גַּיְא linaweza kumaanisha bonde lenye pande zenye miteremko mikali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Wafilisti
  rationale: Jina la kawaida la Kiswahili la kundi hili la watu. Kiunganishi וּ hakihitaji kutafsiriwa kwa neno la mwanzo hapa kwa kuwa mstari unaendeleza simulizi bila kuongeza kiashirio cha wakati.
- source_word: עֹמְדִים
  choice: walikuwa wamesimama
  rationale: Muundo huu unaonyesha hali inayoendelea katika mandhari; tafsiri hii ni ya kawaida na haiingizi dhana ya ziada ya kuwa walipangwa rasmi vitani.
- source_word: אֶל הָהָר מִזֶּה
  choice: kwenye mlima upande huu
  rationale: Pamoja na kitenzi עמד, אֶל hapa inaeleza mahali jeshi lilipokuwa. ‘Upande huu’ huhifadhi utofautishaji wa מִזֶּה, na הַר inaweza kuwa mlima au kilima.
- source_word: וְיִשְׂרָאֵל
  choice: na Israeli
  rationale: Huhifadhi jina la pamoja ‘Israeli’ kama lilivyo katika Kiebrania, badala ya kulibadili moja kwa moja kuwa ‘Waisraeli.’
- source_word: עֹמְדִים
  choice: walikuwa wamesimama
  rationale: Upatanisho wa kisemantiki wa wingi unaonyesha kwamba ‘Israeli’ hapa ni watu au jeshi, na pia huhifadhi hali ileile inayoendelea kama katika kishazi cha kwanza.
- source_word: אֶל הָהָר מִזֶּה
  choice: kwenye mlima upande ule
  rationale: Tafsiri sambamba na kishazi cha kwanza; ‘upande ule’ huonyesha upande unaokabiliana na ‘upande huu.’
- source_word: וְהַגַּיְא
  choice: huku bonde
  rationale: גַּיְא kwa kawaida ni bonde, ingawa inaweza kumaanisha korongo. ‘Huku’ huunganisha maelezo ya mwisho kwa Kiswahili cha kawaida bila kupoteza uhusiano wa kishazi.
- source_word: בֵּינֵיהֶם
  choice: likiwa katikati yao
  rationale: Hutoa kwa uwazi mahali pa bonde kati ya makundi hayo mawili.
