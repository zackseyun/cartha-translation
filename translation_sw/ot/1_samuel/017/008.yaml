  text: וַֽ/יַּעֲמֹ֗ד וַ/יִּקְרָא֙ אֶל מַעַרְכֹ֣ת יִשְׂרָאֵ֔ל וַ/יֹּ֣אמֶר לָ/הֶ֔ם לָ֥/מָּה תֵצְא֖וּ לַ/עֲרֹ֣ךְ מִלְחָמָ֑ה הֲ/ל֧וֹא אָנֹכִ֣י הַ/פְּלִשְׁתִּ֗י וְ/אַתֶּם֙ עֲבָדִ֣ים לְ/שָׁא֔וּל בְּרוּ לָ/כֶ֥ם אִ֖ישׁ וְ/יֵרֵ֥ד אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/008.yaml
  text: He stood and called out to the battle lines of Israel and said to them[a], “Why do you come out to array yourselves for battle? Am I not the Philistine, and are you not servants of Saul? Choose a man for yourselves[b], and let him come down to me.”
translation:
  language: sw
  text: Akasimama, akaita kwa sauti kuelekea safu za vita za Israeli, akawaambia, “Kwa nini mnatoka kujipanga kwa vita[a]? Je, mimi si yule Mfilisti, nanyi si watumwa[b] wa Sauli? Jichagulieni mwanamume, naye ashuke kwangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kupanga safu kwa vita.” Kiebrania kinaeleza kupanga au kuweka safu kwa ajili ya mapigano.
    reason: lexical_alternative
  - marker: b
    text: Au “watumishi.” Neno la Kiebrania linaweza kumaanisha watumishi au watumwa; “watumwa” hapa linadumisha nguvu ya dhihaka ya Goliathi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Akasimama
  rationale: Kitenzi hiki katika usimulizi kinaonyesha kusimama au kuchukua nafasi; “akasimama” ni kifupi, cha kawaida, na kinahifadhi mkao wa makabiliano.
- source_word: וַיִּקְרָא
  choice: akazipazia sauti
  rationale: Hapa קרא ni kuita kwa sauti kubwa kuelekea safu za upande mwingine; “kuzipazia sauti” linaonyesha wazi tangazo la hadharani kutoka mbali.
- source_word: מַעַרְכוֹת יִשְׂרָאֵל
  choice: safu za vita za Israeli
  rationale: מַעַרְכוֹת ni vikosi vilivyopangwa kwa mapigano, hivyo “safu za vita” ni sahihi zaidi kuliko neno pana kama “jeshi.”
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: kujipanga kwa vita
  rationale: Kirai hiki kinahusu kupanga au kuweka safu kwa mapigano; tafsiri hii ni ya asili katika Kiswahili na inadumisha taswira ya mpangilio wa kijeshi.
- source_word: אָנֹכִי הַפְּלִשְׁתִּי
  choice: mimi si yule Mfilisti
  rationale: Kibainishi cha Kiebrania kinamtambulisha msemaji kama Mfilisti maalumu anayewakilisha upande wake; “yule Mfilisti” kinadumisha mkazo huo.
- source_word: עֲבָדִים לְשָׁאוּל
  choice: watumwa wa Sauli
  rationale: עֲבָדִים linaweza kumaanisha watumishi au watumwa. Katika dhihaka hii, “watumwa” linawasilisha kwa nguvu zaidi hali duni na ya kudhalilisha ambayo Goliathi anawapa Waisraeli.
- source_word: בְּרוּ לָכֶם אִישׁ
  choice: Jichagulieni mwanamume
  rationale: Amri ברו ina maana ya kuchagua, na לָכֶם inaonyesha kujichagulia. “Mwanamume” linahifadhi wazi jinsia ya אִישׁ katika muktadha wa mpiganaji wa pambano la mtu mmoja.
- source_word: וְיֵרֵד אֵלָי
  choice: naye ashuke aje kwangu
  rationale: Muundo huu una nguvu ya agizo au ruhusa baada ya amri. “Ashuke aje kwangu” linahifadhi pia mwendo wa kushuka unaoonyeshwa na ירד.
theological_decisions:
- issue: Maana ya עֲבָדִים katika dhihaka ya Goliathi
  choice: watumwa wa Sauli
  alternative: watumishi wa Sauli
  rationale: Neno lina wigo wa maana unaojumuisha watumishi na watumwa. “Watumwa” linadumisha ukali wa dhihaka bila kuondoa uwezekano wa maana nyepesi, ambao umeonyeshwa katika tanbihi.
- issue: Jinsia ya אִישׁ
  choice: mwanamume
  alternative: mtu au mpiganaji
  rationale: Kiebrania kinatumia nomino ya umoja wa kiume katika muktadha wa pambano la mwakilishi mmoja; kutaja “mwanamume” kunahifadhi taarifa hiyo badala ya kuifanya isionekane.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Vitenzi vya mfululizo vimetumiwa kwa usimulizi wa asili, huku istilahi za kijeshi na nguvu ya dhihaka zikidumishwa.
