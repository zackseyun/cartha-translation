lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Ni kitenzi cha kawaida cha usimulizi kinachoanzisha usemi wa moja kwa moja; “akasema” ni Kiswahili cha asili katika mfuatano wa simulizi.
- source_word: דָּוִד
  choice: Daudi
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
- source_word: מֶה עָשִׂיתִי עָתָּה
  choice: Nimefanya nini sasa?
  rationale: Muundo huu unahifadhi swali la kulalamika na hali ya jambo kuwa na umuhimu wa papo hapo; “sasa” pia huonyesha kuchoshwa kwa Daudi na lawama hiyo.
- source_word: הֲלוֹא
  choice: Je, halikuwa
  rationale: Swali la balagha linatarajia jibu la kukubali; umbo la wakati uliopita linafaa kwa tendo lililokuwa likijadiliwa.
- source_word: דָּבָר
  choice: neno tu
  rationale: דָּבָר linaweza kumaanisha “neno,” “jambo,” au “kitu.” “Neno tu” linaonyesha kuwa Daudi anapunguza uzito wa alichofanya bila kufuta utata wa kileksika.
- source_word: הוּא
  choice: halikuwa
  rationale: Kiwakilishi hiki kinarejelea jambo lililokuwa likizungumziwa; katika Kiswahili maana yake imejumuishwa kwa kawaida katika muundo wa kitenzi “halikuwa.”
