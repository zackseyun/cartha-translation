  text: Sauli, wao, na wanaume wote wa Israeli walikuwa katika Bonde la Ela, wakipigana na Wafilisti[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhidi ya Wafilisti.” Kihusishi cha Kiebrania kwa maana halisi ni “na,” lakini katika muktadha wa vita kinaweza kuonyesha mapambano dhidi ya mtu au kundi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שָׁאוּל
  choice: Sauli
  rationale: Jina שָׁאוּל limetoholewa kwa umbo la Kiswahili linalotumiwa kwa kawaida. Kiunganishi וְ kinaendeleza simulizi, lakini hakihitaji kutafsiriwa kwa neno tofauti mwanzoni mwa sentensi.
- source_word: וְ/הֵמָּה
  choice: wao na
  rationale: Kiwakilishi huru הֵמָּה kimehifadhiwa kama “wao,” kikirejelea waliotajwa katika muktadha, badala ya kufichwa katika sentensi iliyolainishwa.
- source_word: וְ/כָל אִישׁ יִשְׂרָאֵל
  choice: wanaume wote wa Israeli
  rationale: Hili linaonyesha kundi zima la wanaume wa Israeli kwa Kiswahili cha kawaida na kuhifadhi maana ya כָל אִישׁ.
- source_word: בְּ/עֵמֶק הָאֵלָה
  choice: katika Bonde la Ela
  rationale: עֵמֶק ni bonde; Ela ni jina la mahali lililotoholewa kwa urahisi wa usomaji wa Kiswahili.
- source_word: נִלְחָמִים
  choice: walikuwa ... wakipigana
  rationale: Umbo la kitenzi kishirikishi linaonyesha tendo lililokuwa likiendelea; “walikuwa ... wakipigana” linafikisha hali hiyo kwa uwazi.
- source_word: עִם פְּלִשְׁתִּים
  choice: na Wafilisti
  rationale: עִם kwa msingi humaanisha “na/pamoja na,” lakini pamoja na kitenzi cha kupigana humaanisha kushiriki mapambano dhidi yao. Kiswahili “kupigana na” huhifadhi muundo huo na kueleweka kwa kawaida kuwa ni upinzani.
