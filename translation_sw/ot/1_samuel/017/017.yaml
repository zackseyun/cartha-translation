base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/017.yaml
  text: And Jesse said to David his son[a], “Please take to your brothers this ephah of roasted grain and these ten loaves[b], and run to the camp to your brothers.”
translation:
  language: sw
  text: Yese akamwambia Daudi mwanawe, “Tafadhali, wachukulie ndugu zako efa[a] hii ya nafaka iliyokaangwa[b] na mikate hii kumi, na ukimbie kambini kwa ndugu zako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efa ilikuwa kipimo cha kale cha vitu vikavu, chenye ujazo wa takriban lita 22.
    reason: cultural_note
  - marker: b
    text: Au, “nafaka iliyokaushwa kwa moto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח נָא
  choice: Tafadhali wachukulie
  rationale: Kitenzi cha kuamuru pamoja na נָא kinaonyesha ombi lenye upole na pia uharaka. ‘Tafadhali wachukulie’ ni Kiswahili cha kawaida kinachobainisha pia kwamba vitu hivyo vinapelekwa kwa ndugu zake.
- source_word: לְאַחֶיךָ
  choice: ndugu zako
  rationale: Katika muktadha huu לְ inaonyesha wapokeaji; ‘ndugu zako’ ni ya kawaida na haiongezi ufafanuzi usio katika Kiebrania.
- source_word: אֵיפַת
  choice: efa hii ya
  rationale: אֵיפָה ni kipimo cha kale cha vitu vikavu. Kutunza jina ‘efa’ kunahifadhi kipimo mahususi cha ulimwengu wa kale, huku tanbihi ikikieleza.
- source_word: הַקָּלִיא
  choice: nafaka iliyokaangwa
  rationale: Neno hilo humaanisha nafaka iliyotayarishwa kwa kukaangwa au kukaushwa kwa moto. ‘Nafaka iliyokaangwa’ ni wazi na ya sasa katika Kiswahili.
- source_word: וַעֲשָׂרָה לֶחֶם הַזֶּה
  choice: na mikate hii kumi
  rationale: לֶחֶם inaweza kumaanisha mkate kwa ujumla, lakini pamoja na idadi katika muktadha wa vyakula vya kupeleka, ‘mikate hii kumi’ ni ya kawaida na thabiti.
- source_word: וְהָרֵץ
  choice: kisha ukimbie kwenda
  rationale: Amri hii inayotokana na רוץ inaleta picha halisi ya kwenda kwa haraka. ‘Ukimbie kwenda’ huhifadhi uhai wa usemi badala ya kuufanya kuwa ‘uharakishe’ tu.
- source_word: הַמַּחֲנֶה
  choice: kambini
  rationale: Katika muktadha wa kijeshi, מַחֲנֶה ni kambi. ‘Kambini’ ni usemi wa kawaida wa kueleza mahali anakoelekezwa kwenda.
- source_word: בְּנוֹ
  choice: mwanawe
  rationale: Kirai hiki kinamtambulisha Daudi kwa uhusiano wake na Yese. ‘Mwanawe’ ni kifupi, cha asili, na sahihi.
