translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umefanywa uwe wa kawaida katika Kiswahili bila kuondoa uharaka wa amri au maelezo ya kipimo cha kale. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayoelezwa.
