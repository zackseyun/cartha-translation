lexical_decisions:
- source_word: וַיִּסֹּב מֵאֶצְלוֹ
  choice: akageuka kutoka kwake
  rationale: Kifungu kinaonyesha Daudi akigeuka kimwili na kuacha kuzungumza na Eliabu; tafsiri hii ni ya kawaida na inahifadhi mwendo huo.
- source_word: אֶל מוּל אַחֵר
  choice: akamwelekea mtu mwingine
  rationale: מול ina wazo la kuelekea au kukabiliana uso kwa uso; 'akamwelekea mtu mwingine' linaeleza kwa kawaida kwamba Daudi alimgeukia mtu mwingine.
- source_word: וַיֹּאמֶר כַּדָּבָר הַזֶּה
  choice: akauliza jambo lilelile
  rationale: Kitenzi kwa kawaida ni 'akasema,' lakini katika muktadha Daudi anarudia swali lake la mstari wa 26; 'akauliza' huwasilisha tendo linalokusudiwa bila kubadili yaliyomo.
- source_word: וַיְשִׁבֻהוּ
  choice: wakamjibu
  rationale: Hifili ya שוב hapa ina maana ya kumrudishia mtu jibu; 'wakamjibu' ni Kiswahili cha kawaida na sahihi.
- source_word: הָעָם
  choice: watu
  rationale: עם ni neno pana la 'watu.' Ingawa muktadha ni wa kijeshi, tafsiri pana huepuka kulibana kuwa 'askari' bila ulazima.
- source_word: דָּבָר כַּדָּבָר הָרִאשׁוֹן
  choice: kama hapo awali
  rationale: Kisahili ni 'neno kama neno la kwanza'; maana yake ni kwamba walimpa jibu lilelile walilokuwa wametoa mara ya kwanza.
