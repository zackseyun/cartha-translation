lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: walirudi
  rationale: Kitenzi שוב kina maana ya msingi ya kurudi; “walirudi” ni Kiswahili cha kawaida kinachoonyesha kurejea baada ya kuwafuatilia adui.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa muundo wa Kiebrania ni “wana wa Israeli,” hapa unalitaja taifa kwa ujumla. “Waisraeli” ni tafsiri ya asili na iliyo wazi katika Kiswahili bila kubadili mhusika wa pamoja.
- source_word: מִדְּלֹק אַחֲרֵי
  choice: baada ya kuwafuatilia
  rationale: דלק pamoja na אַחֲרֵי huonyesha kuwafuatia kwa lengo la kuwakamata. Katika sentensi hii, “baada ya kuwafuatilia” huwasilisha kwa kawaida kwamba walirudi walipomaliza kuwafukuza.
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili cha Biblia.
- source_word: וַיָּשֹׁסּוּ
  choice: wakapora
  rationale: Kitenzi שסס kinamaanisha kutwaa mali kwa nguvu baada ya ushindi; “wakapora” ni neno la sasa, wazi, na linalofaa muktadha wa vita.
- source_word: מַחֲנֵיהֶם
  choice: kambi zao
  rationale: Umbo lililowekewa irabu katika WLC ni la wingi na lina kiambishi cha nafsi ya tatu wingi; kwa hiyo “kambi zao” linafuata maandishi hayo moja kwa moja.
