  text: וַ/יִּשְׁמַ֤ע אֱלִיאָב֙ אָחִ֣י/ו הַ/גָּד֔וֹל בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים וַ/יִּֽחַר אַף֩ אֱלִיאָ֨ב בְּ/דָוִ֜ד וַ/יֹּ֣אמֶר לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ וְ/עַל מִ֨י נָטַ֜שְׁתָּ מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙ בַּ/מִּדְבָּ֔ר אֲנִ֧י יָדַ֣עְתִּי אֶת זְדֹנְ/ךָ֗ וְ/אֵת֙ רֹ֣עַ לְבָבֶ֔/ךָ כִּ֗י לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה יָרָֽדְתָּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/028.yaml
  text: Eliab his oldest brother heard him speaking to the men[a], and Eliab’s anger burned against David, and he said, “Why have you come down here? And with whom have you left those few sheep in the wilderness? I know your presumption and the evil of your heart[b], for you have come down to see the battle.”
translation:
  language: sw
  text: Eliabu, kaka yake mkubwa, alimsikia akizungumza na wale wanaume. Hasira ya Eliabu ikawaka dhidi ya Daudi, naye akasema, “Kwa nini umeshuka huku? Na kondoo wale wachache umewaacha na nani nyikani? Najua kiburi chako[a] na ubaya wa moyo wako[b]; umeshuka ili uone mapigano.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “majivuno yako” au “jeuri yako.”
    reason: lexical_alternative
  - marker: b
    text: Au, “uovu wa moyo wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים
  choice: akizungumza na wale wanaume
  rationale: Muundo wa infinitivu unaonyesha hali ya Daudi kuwa katika tendo la kuzungumza. “Wale wanaume” huhifadhi maana ya kawaida ya אֲנָשִׁים bila kuongeza kwamba walikuwa wanajeshi.
- source_word: וַ/יִּֽחַר אַף
  choice: Hasira ... ikawaka
  rationale: Huhifadhi taswira hai ya nahau ya Kiebrania kuhusu hasira kuwaka, huku ikiwa Kiswahili cha kawaida na kinachoeleweka.
- source_word: לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ
  choice: Kwa nini umeshuka huku?
  rationale: “Umeshuka” hufuata kitenzi ירד, na “huku” huwasilisha kwa kawaida nguvu ya kiashiria זֶה katika mazingira ya msemaji.
- source_word: וְ/עַל מִ֨י נָטַ֜שְׁתָּ
  choice: umewaacha na nani
  rationale: Katika muktadha wa kuchunga, usemi huu unauliza ni nani aliyeachiwa kondoo; tafsiri hii haiongezi wazo lenye nguvu zaidi la kuwatelekeza kabisa.
- source_word: מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙
  choice: kondoo wale wachache
  rationale: Huhifadhi uchache wa kundi na sauti ya Eliabu ya kulidharau, pamoja na kiashiria kinachowarejelea kondoo.
- source_word: בַּ/מִּדְבָּ֔ר
  choice: kule nyikani
  rationale: “Nyikani” hufaa kwa eneo lisilolimwa linalotumiwa kwa malisho; “kule” huifanya sentensi ya Kiswahili iwe ya kawaida bila kubadili mahali panaporejelewa.
- source_word: זְדֹנְ/ךָ֗
  choice: kiburi chako
  rationale: זָדוֹן inaweza kueleza kiburi, majivuno, au jeuri ya mtu anayejitokeza kwa ujasiri usiofaa. “Kiburi” ni neno la kawaida, lenye hadhi, na pana vya kutosha kuhifadhi shtaka hilo.
- source_word: רֹ֣עַ לְבָבֶ֔/ךָ
  choice: ubaya wa moyo wako
  rationale: Hufuata kwa karibu wazo la ubaya uliomo katika utu wa ndani bila kuufanya usemi kuwa mkali zaidi kuliko Kiebrania; “uovu” umetolewa kama uwezekano katika tanbihi.
- source_word: לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה
  choice: ili uone mapigano
  rationale: “Ili” huonyesha kusudi la לְמַעַן, na “mapigano” huelekeza kwenye pambano la kijeshi lililopo badala ya vita nzima ya muda mrefu.
