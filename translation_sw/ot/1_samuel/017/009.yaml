base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/009.yaml
  text: If he is able to fight with me and strike me down[a], then we will be your servants. But if I prevail against him and strike him down[c][b], then you will be our servants and serve us.
translation:
  language: sw
  text: Ikiwa anaweza kupigana nami na kuniangusha, tutakuwa watumwa wenu.[a] Lakini ikiwa mimi nitaweza kumshinda[b] na kumwangusha,[c] mtakuwa watumwa wetu na kututumikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi” katika matukio yote mawili ya עֲבָדִים. “Watumwa” limetumiwa hapa kwa sababu muktadha unaonyesha taifa kutiishwa na kulazimishwa kutumikia baada ya pambano.
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu zaidi, “ikiwa nina uwezo dhidi yake.” Katika muktadha huu wa pambano, kitenzi יכל kinaweza kuwa na maana ya kumzidi au kumshinda mtu.
    reason: lexical_alternative
  - marker: c
    text: Kitenzi נכה katika vifungu vyote viwili kinaweza pia kutafsiriwa “kumuua” au “kumshinda.” “Kumwangusha” kinadumisha uzito wa pigo bila kusema wazi zaidi ya inavyosema Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוּכַל
  choice: anaweza
  rationale: Kitenzi יכל kinaonyesha uwezo; “anaweza” kinadumisha hali ya sharti katika changamoto hii.
- source_word: לְהִלָּחֵם אִתִּי
  choice: kupigana nami
  rationale: Muundo huu unaonyesha pambano la pande mbili; “kupigana nami” ni wa kawaida na unaweka wazi maana ya pambano.
- source_word: וְהִכָּנִי / וְהִכִּיתִיו
  choice: kuniangusha / kumwangusha
  rationale: נכה inaweza kumaanisha kupiga, kuangusha, kushinda, au kuua kulingana na muktadha. “Kuangusha” linaonyesha pigo lenye matokeo makubwa bila kulazimisha maana ya kuua.
- source_word: עֲבָדִים
  choice: watumwa
  rationale: Katika muktadha wa taifa kutiishwa baada ya pambano, neno hili linaonyesha hali ya utumwa na si huduma ya hiari tu.
- source_word: אֲנִי אוּכַל לוֹ
  choice: mimi nitaweza kumshinda
  rationale: יכל pamoja na ל inaweza kueleza kuwa na uwezo dhidi ya mtu au kumzidi. Tafsiri hii inadumisha wazo la uwezo huku ikieleza kwa Kiswahili cha kawaida matokeo ya pambano.
- source_word: וַעֲבַדְתֶּם אֹתָנוּ
  choice: na kututumikia
  rationale: Kitenzi עבד hapa kinaeleza huduma inayotolewa na watu waliotiishwa; “kututumikia” ni tafsiri ya kawaida na ya moja kwa moja.
