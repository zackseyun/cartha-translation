translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Kauli ya Mfilisti imewekwa fupi na yenye nguvu ili kudumisha ladha ya changamoto ya hadharani. ‘Safu za vita’ huhifadhi taswira ya vikosi vilivyopangwa, na ‘sisi kwa sisi’ huonyesha kwamba pambano linalokusudiwa ni la wapiganaji wawili dhidi ya kila mmoja.
