base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/010.yaml
  text: Then the Philistine said[a], “I have defied the ranks of Israel this day. Give me a man[c][b], and let us fight together.”
translation:
  language: sw
  text: Ndipo yule Mfilisti akasema, “Nimezitukana[a] safu za vita za Israeli[b] leo hii[c]. Nipeni mtu mmoja, tupigane sisi kwa sisi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nimezidhihaki,” “nimezikejeli,” au “nimezilaumu kwa dharau.” Katika muktadha huu neno la Kiebrania linaonyesha dharau ya wazi iliyoambatana na changamoto ya kivita.
    reason: lexical_alternative
  - marker: b
    text: Au “safu za Israeli”; kwa maana pana, “majeshi ya Israeli.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “siku hii”; katika Kiswahili cha kawaida, “leo hii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: yule Mfilisti
  rationale: Nomino yenye kiambishi bainishi inamtambulisha Goliathi kwa taifa lake; neno ‘shujaa’ halimo katika kirai hiki.
- source_word: חֵרַפְתִּי
  choice: nimezitukana
  rationale: Kitenzi kinaonyesha dharau na fedheha ya wazi katika changamoto ya kivita. ‘Nimezitukana’ ni ya moja kwa moja na ya kawaida katika Kiswahili, bila kupunguza uzito wa kejeli hiyo.
- source_word: מַעַרְכוֹת
  choice: safu za vita
  rationale: Wingi huu unarejelea vikosi vilivyopangwa tayari kwa mapambano; ‘safu za vita’ huhifadhi picha ya mpangilio wa kijeshi kuliko neno pana ‘majeshi’.
- source_word: הַיּוֹם הַזֶּה
  choice: leo hii
  rationale: Kirai hiki huhifadhi msisitizo wa demonstrativi katika Kiebrania na kina nguvu ya kirhetorika inayofaa tamko la Mfilisti.
- source_word: תְּנוּ לִי אִישׁ
  choice: Nipeni mtu mmoja
  rationale: Kauli hiyo ni changamoto ya kutaka apewe mpiganaji mmoja mwakilishi. ‘Mtu mmoja’ ni ya asili katika Kiswahili na huonyesha wazi pambano la mtu mmoja dhidi ya mwingine.
- source_word: וְנִלָּחֲמָה
  choice: tupigane
  rationale: Umbo la cohortative linaonyesha mwaliko au changamoto yenye nia, jambo linalowasilishwa vizuri na ‘tupigane’ kuliko wakati ujao wa taarifa.
- source_word: יָחַד
  choice: sisi kwa sisi
  rationale: Ingawa neno hilo kihalisi linaweza kuwa ‘pamoja,’ hapa linamaanisha kupigana mmoja dhidi ya mwingine; ‘sisi kwa sisi’ huweka wazi maana hiyo katika Kiswahili.
