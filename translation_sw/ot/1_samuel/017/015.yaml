lexical_decisions:
- source_word: הֹלֵךְ וָשָׁב
  choice: alikuwa akienda na kurudi
  rationale: Muundo huu unaonyesha tendo la kawaida au linalorudiwa, si safari moja tu. Kiswahili cha hali ya mazoea, “alikuwa akienda na kurudi,” kinahifadhi maana hiyo kwa njia ya kawaida.
- source_word: מֵעַל שָׁאוּל
  choice: kutoka kwa Sauli
  rationale: Katika muktadha huu kihusishi kinaonyesha kuondoka mahali alipokuwa Sauli au katika utumishi wake. “Kutoka kwa Sauli” ni kifupi na hakiongezi maelezo yasiyosemwa wazi.
- source_word: לִרְעוֹת
  choice: ili kuchunga
  rationale: Kitenzi hiki kinamaanisha kufanya kazi ya mchungaji. “Kuchunga” ni neno la kawaida na sahihi katika Kiswahili kwa kutunza kundi la mifugo.
- source_word: צֹאן
  choice: kundi
  rationale: Neno hili linaweza kumaanisha kwa ujumla wanyama wadogo wa kufugwa, hasa kondoo na mbuzi. “Kundi” linahifadhi maana hiyo ya mkusanyiko bila kuibana iwe kondoo peke yao.
- source_word: אָבִיו
  choice: la baba yake
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuonyesha kwamba kundi lilikuwa mali ya baba yake Daudi.
- source_word: בֵּית לָחֶם
  choice: Bethlehemu
  rationale: Hili ndilo umbo la kawaida la jina la mahali hapa katika Kiswahili.
- source_word: וְ
  choice: halikutafsiriwa kwa neno tofauti
  rationale: Kiunganishi kinaendeleza simulizi, lakini Kiswahili hakihitaji lazima kuanza sentensi hii kwa “na”; kuachwa kwake kunafanya sentensi iwe ya kawaida bila kupoteza uhusiano wa kisimulizi.
