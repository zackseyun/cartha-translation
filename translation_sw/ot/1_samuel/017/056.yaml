review_pass:
  verdict: revise
  source_fidelity: Draft preserves the king’s title, the narrative verb, the explicit emphatic pronoun, and the inquiry concerning the young man’s paternal identity. However, the placement in “uliza kijana huyu ni mwana wa nani” can naturally be read as directing the addressee to question the young man himself, rather than to inquire about his lineage.
  naturalness: The wording is generally clear and appropriately formal, but repositioning “huyu kijana” after the indirect question removes the possible object-reading and is more idiomatic for the intended meaning.
  terminology: “Mfalme,” “Wewe,” “mwana wa nani,” and “kijana” are suitable Standard East African Swahili equivalents. No theological terminology is involved.
  issues:
  - severity: medium
    issue: Potential syntactic ambiguity in “Wewe uliza kijana huyu ni mwana wa nani.”
    rationale: In Swahili, “uliza kijana huyu” may mean “ask this young man,” which could imply questioning him directly. The Hebrew asks for an inquiry into whose son the young man is. “Uliza ni mwana wa nani huyu kijana” clearly makes the lineage question the content of the command.
