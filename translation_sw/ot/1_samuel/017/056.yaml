  text: And the king said[a], “You, inquire whose son this young man is.”
translation:
  language: sw
  text: Mfalme akasema, “Wewe, uliza ni mwana wa nani huyu kijana.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Muundo wa usimulizi unaendeleza tukio; kiambishi -ka- ni cha kawaida na cha asili katika simulizi la Kiswahili.
- source_word: הַמֶּלֶךְ
  choice: Mfalme
  rationale: Neno la Kiebrania linatumia cheo chenye uainisho, si jina la Sauli; Kiswahili hutumia ‘Mfalme’ kwa rejeleo hili maalumu katika muktadha.
- source_word: שְׁאַל
  choice: uliza
  rationale: Amri hii inaweza kumaanisha kuuliza au kufanya uchunguzi. ‘Uliza’ huhifadhi kwa karibu tendo lililotajwa na ni ya kawaida katika Kiswahili.
- source_word: אַתָּה
  choice: Wewe
  rationale: Kiwakilishi huru kimetajwa wazi kwa msisitizo, hivyo ‘Wewe’ kimehifadhiwa badala ya kutegemea kiambishi cha kitenzi pekee.
- source_word: בֶּן מִי
  choice: ni mwana wa nani
  rationale: Hii ni njia ya kawaida na ya moja kwa moja ya kuuliza ukoo wa upande wa baba bila kuongeza maelezo yasiyokuwamo katika matini.
- source_word: זֶה
  choice: huyu
  rationale: Kionyeshi hiki cha karibu kinapatana na ngeli ya mtu na hali ya kijana kuwa mbele yao au katika upeo wao.
- source_word: הָעָלֶם
  choice: kijana
  rationale: ‘Kijana’ ni neno la sasa, la kawaida, na lenye heshima kwa mwanamume mwenye umri mdogo.
