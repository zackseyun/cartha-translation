  text: וְ/שָׁא֤וּל וְ/אִֽישׁ יִשְׂרָאֵל֙ נֶאֶסְפ֔וּ וַֽ/יַּחֲנ֖וּ בְּ/עֵ֣מֶק הָאֵלָ֑ה וַ/יַּעַרְכ֥וּ מִלְחָמָ֖ה לִ/קְרַ֥את פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/002.yaml
  text: And Saul and the men of Israel gathered together and camped in the Valley of Elah[a], and they drew up for battle against the Philistines.
translation:
  language: sw
  text: Sauli na wanaume wa Israeli wakakusanyika, wakapiga kambi katika Bonde la Ela, kisha wakajipanga kwa vita dhidi ya Wafilisti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwakabili Wafilisti” au “wakiwaelekea Wafilisti.”
    reason: Kirai לִקְרַאת kinaweza kuonyesha kwenda kukutana au kukabiliana nao, au kuwa katika mkao unaowaelekea; muktadha wa kijeshi unaruhusu tafsiri “dhidi ya.”
lexical_decisions:
- source_word: וְשָׁאוּל וְאִישׁ יִשְׂרָאֵל
  choice: Sauli na wanaume wa Israeli
  rationale: Muundo huu unaonyesha Sauli pamoja na kundi la wanaume wa Israeli; אִישׁ imetumiwa kwa maana ya pamoja, wala si kumaanisha mtu mmoja tu.
- source_word: נֶאֶסְפוּ
  choice: wakakusanyika
  rationale: Kitenzi cha Kiebrania kinaeleza kukusanyika kwao kama kundi, hapa katika mazingira ya kijeshi.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Hii ni Kiswahili cha kawaida na cha sasa kinachoeleza kuweka kambi mahali.
- source_word: בְּעֵמֶק הָאֵלָה
  choice: katika Bonde la Ela
  rationale: עֵמֶק ni bonde, na הָאֵלָה hapa ni jina la mahali, lililotoholewa kuwa Ela.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: wakajipanga kwa vita
  rationale: Nahau hiyo ina maana ya kupanga vikosi katika mpangilio wa kupigana; tafsiri hii ni ya kawaida na inadumisha maana ya kijeshi.
- source_word: לִקְרַאת פְּלִשְׁתִּים
  choice: dhidi ya Wafilisti
  rationale: Katika muktadha wa mapambano, kirai hiki kinaonyesha kwamba walijipanga kukabiliana na Wafilisti, ingawa kwa karibu zaidi kinaweza kumaanisha kwenda kuwakabili au kuwaelekea.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa vitenzi umetafsiriwa kwa viambishi vya usimulizi vya -ka-, huku “kisha” ikisaidia mtiririko wa sentensi. Jina Elah limetoholewa kuwa Ela, na Philistines kuwa Wafilisti.
