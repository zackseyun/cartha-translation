base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/023.yaml
  text: While he was speaking with them[a], behold, the champion came up—the Philistine named Goliath, from Gath, from the ranks of the Philistines—and he spoke these words[b], and David heard.
translation:
  language: sw
  text: Alipokuwa akizungumza nao, tazama, mpiganaji bingwa[a] akaja kutoka katika safu za Wafilisti[b]—Goliathi, yule Mfilisti wa Gathi—akasema maneno yale, naye Daudi akasikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya moja kwa moja, Kiebrania kinasema “mtu wa katikati,” nahau ya mpiganaji mwakilishi katika pambano la mtu mmoja dhidi ya mwingine.
    reason: lexical_alternative
  - marker: b
    text: Usemi wa Kiebrania hapa una ugumu wa kimapokeo; huenda unamaanisha safu au mistari ya vita ya Wafilisti. Wengine hutafsiri “kutoka katika kambi za Wafilisti.”
    reason: alternative_reading
lexical_decisions:
- source_word: מְדַבֵּר עִמָּם
  choice: alipokuwa akizungumza nao
  rationale: Muundo wa kitenzi kishirikishi pamoja na הוּא unaonyesha tendo lililokuwa likiendelea; עִם ni ‘pamoja na/nao,’ yaani mazungumzo, si hotuba ya upande mmoja tu.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Imehifadhiwa kama kiashiria cha simulizi kinacholeta tukio mbele ya msomaji kwa ghafla na kwa uhai.
- source_word: אִישׁ הַבֵּנַיִם
  choice: mpiganaji bingwa
  rationale: Ni nahau inayomaanisha mpiganaji mwakilishi anayesimama kati ya majeshi kwa pambano la mtu mmoja dhidi ya mwingine. ‘Mpiganaji bingwa’ ni wazi na ya kawaida katika Kiswahili.
- source_word: עוֹלֶה
  choice: akatokea
  rationale: Katika muktadha wa safu za vita, neno linaonyesha Goliathi akijitokeza au akipanda kutoka upande wa Wafilisti; ‘akatokea’ huendeleza simulizi kwa Kiswahili cha asili bila kupoteza mwendo huo.
- source_word: גָּלְיָת הַפְּלִשְׁתִּי שְׁמוֹ מִגַּת
  choice: Jina lake lilikuwa Goliathi, Mfilisti kutoka Gathi
  rationale: Huhifadhi utambulisho, asili ya kikabila, na mahali alikotoka kwa mpangilio wa kawaida wa Kiswahili.
- source_word: ממערות פְּלִשְׁתִּים
  choice: kutoka katika safu za Wafilisti
  rationale: Ingawa mapokeo ya maandishi hapa yana ugumu, muktadha unaelekeza kwenye safu au mpangilio wa vita wa Wafilisti.
- source_word: וַיְדַבֵּר כַּדְּבָרִים הָאֵלֶּה
  choice: Akasema maneno yale
  rationale: Usemi huu unarejelea changamoto au dhihaka ambayo Goliathi alikuwa ameisema awali; ‘maneno yale’ ni rejeo la asili katika simulizi la Kiswahili.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: naye Daudi akasikia
  rationale: Kiswahili kinaweza kuacha kisichosemwa wazi kile alichosikia, kama ilivyo katika Kiebrania, kwa kuwa muktadha unakibainisha.
