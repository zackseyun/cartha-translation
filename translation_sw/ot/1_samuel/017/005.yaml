  text: וְ/כ֤וֹבַע נְחֹ֨שֶׁת֙ עַל רֹאשׁ֔/וֹ וְ/שִׁרְי֥וֹן קַשְׂקַשִּׂ֖ים ה֣וּא לָב֑וּשׁ וּ/מִשְׁקַל֙ הַ/שִּׁרְי֔וֹן חֲמֵשֶׁת אֲלָפִ֥ים שְׁקָלִ֖ים נְחֹֽשֶֽׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/005.yaml
  text: He had a bronze helmet on his head[a], and he was clothed with a coat of scale armor[b]; and the weight of the coat was five thousand shekels of bronze.
translation:
  language: sw
  text: Alikuwa na kofia ya shaba kichwani, naye alikuwa amevaa vazi la kivita la magamba[a]. Uzito wa vazi hilo ulikuwa shekeli elfu tano za shaba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, vazi la kujikinga lililotengenezwa kwa vipande vya metali vilivyopishana kama magamba.
    reason: lexical_alternative
  - marker: b
    text: Shekeli elfu tano ni takriban kilogramu 57.
    reason: cultural_note
lexical_decisions:
- source_word: כּוֹבַע
  choice: kofia
  rationale: Katika muktadha wa kijeshi, neno hili linamaanisha kifuniko cha kichwa cha kujikinga. “Kofia” ni neno la kawaida na linaloeleweka; dhana ya kijeshi inawekwa wazi na muktadha.
- source_word: נְחֹשֶׁת
  choice: shaba
  rationale: Neno la Kiebrania linaweza kurejelea shaba au aloi yake, bronzi. “Shaba” ni neno la kawaida katika Kiswahili cha Biblia kwa vyombo na silaha za metali hii, huku likihifadhi kutokuwa mahususi kwa aina kamili ya metali.
- source_word: שִׁרְיוֹן קַשְׂקַשִּׂים
  choice: vazi la kivita la magamba
  rationale: Kirai hiki kinaeleza vazi la kujikinga lililotengenezwa kwa vipande vya metali vilivyopangwa kama magamba. Tafsiri hii ni wazi kwa msomaji wa kawaida na haichanganyi muundo huo na vazi la pete za chuma.
- source_word: הוּא לָבוּשׁ
  choice: alikuwa amevaa
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza hali yake ya kuwa amevalia silaha hiyo, bila kupoteza maana ya hali inayoendelea.
- source_word: מִשְׁקַל
  choice: uzito
  rationale: “Uzito” ndilo neno la kawaida la Kiswahili kwa kipimo cha heaviness katika maelezo haya.
- source_word: חֲמֵשֶׁת אֲלָפִים שְׁקָלִים
  choice: shekeli elfu tano
  rationale: Kipimo cha kale kimehifadhiwa katika matini ili kuwakilisha chanzo moja kwa moja; thamani ya kisasa inayokadiriwa imetolewa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sentensi umefanywa wa asili kwa Kiswahili huku vipengele vya silaha, metali na kipimo cha Kiebrania vikihifadhiwa.
