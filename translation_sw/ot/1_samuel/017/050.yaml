translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kombeo” ni neno linaloeleweka kwa silaha ya kurushia jiwe. Muundo wa masimulizi wenye “aka-” unadumisha mwendo wa simulizi la Kiebrania bila kusikika wa kizamani.
