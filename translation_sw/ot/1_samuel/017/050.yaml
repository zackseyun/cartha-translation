  yaml_path: translation/ot/1_samuel/017/050.yaml
  text: So David prevailed over the Philistine with a sling and with a stone; he struck the Philistine and killed him[a], though there was no sword in David’s hand.
translation:
  language: sw
  text: Hivyo Daudi akamshinda yule Mfilisti kwa kombeo na jiwe; akampiga yule Mfilisti na akamuua,[a] ingawa hapakuwa na upanga mkononi mwa Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na hapakuwa na upanga mkononi mwa Daudi.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa kwa kawaida kama “na”; maandishi makuu yametumia “ingawa” ili kuonyesha hali ya kukinzana inayojitokeza katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק דָּוִד מִן הַפְּלִשְׁתִּי
  choice: Daudi akamshinda yule Mfilisti
  rationale: Katika muundo huu, חזק pamoja na מן humaanisha kuwa na nguvu kuliko au kumshinda mpinzani. “Akamshinda” ni Kiswahili cha kawaida na kinafaa katika muktadha wa mapambano.
- source_word: בַּקֶּלַע
  choice: kwa kombeo
  rationale: Herufi ב inaonyesha chombo au njia iliyotumiwa. “Kwa kombeo” ni usemi wa asili katika Kiswahili.
- source_word: וּבָאֶבֶן
  choice: na jiwe
  rationale: ב inaonyesha chombo kilichotumiwa; umoja “jiwe” umehifadhiwa kwa sababu maandishi yanataja jiwe moja.
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי
  choice: akampiga yule Mfilisti
  rationale: נכה hapa ni kupiga kwa nguvu. “Akampiga” ni wazi, ya kisasa, na inadumisha mlolongo wa matendo.
- source_word: וַיְמִיתֵהוּ
  choice: na kumuua
  rationale: Hifili ya מות humaanisha kusababisha afe, yaani kuua. Tafsiri hii ni ya moja kwa moja bila kuficha dai la maandishi.
- source_word: וְחֶרֶב אֵין בְּיַד דָּוִד
  choice: ingawa Daudi hakuwa na upanga mkononi
  rationale: 'ו inaweza kuunganisha tu kwa “na,” lakini katika muktadha kishazi hiki kina maana ya hali ya kushangaza au kukinzana: Daudi alishinda na kuua bila upanga. Kiswahili “ingawa” huleta maana hiyo kwa kawaida, huku tanbihi ikihifadhi uwezekano rasmi zaidi.'
- source_word: בְּיַד דָּוִד
  choice: Daudi ... mkononi
  rationale: Picha halisi ya “mkono” imehifadhiwa badala ya kuifanya kuwa dhana pana ya kumiliki, kwa kuwa inafaa katika mazingira ya vita.
