  text: Daudi alikuwa mdogo kuliko wote, na wale watatu wakubwa zaidi walikuwa wamemfuata Sauli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/דָוִד
  choice: Daudi
  rationale: Kiunganishi ו kinaendeleza simulizi, lakini Kiswahili hakihitaji lazima kuanza sentensi hii kwa “Na”; uhusiano wake na muktadha unabaki wazi.
- source_word: הוּא הַ/קָּטָן
  choice: ndiye aliyekuwa mdogo zaidi
  rationale: Kiwakilishi huru הוּא kina mkazo, unaowakilishwa kwa “ndiye”; katika muktadha wa ndugu, הַקָּטָן humaanisha aliye mdogo zaidi kwa umri.
- source_word: וּ/שְׁלֹשָׁה הַ/גְּדֹלִים
  choice: na wale watatu wakubwa
  rationale: Hurejelea ndugu watatu wakubwa kwa umri; “wale” hufanya usemi uwe wa kawaida na wazi katika Kiswahili.
- source_word: הָלְכוּ אַחֲרֵי
  choice: walikuwa wamefuata
  rationale: Kirai hiki kwa msingi ni “walikwenda nyuma ya,” lakini hapa humaanisha kumfuata Sauli. Wakati timilifu wa nyuma unaonyesha kuwa tendo hilo lilitangulia maelezo ya Daudi katika simulizi.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Jina limeandikwa kwa umbo la kawaida la Kiswahili la kibiblia.
