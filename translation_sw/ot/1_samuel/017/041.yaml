  text: And the Philistine came on[a], coming closer to David[b], with the man carrying the shield before him.
translation:
  language: sw
  text: Yule Mfilisti akasonga mbele[a], akizidi kumkaribia Daudi, huku mtu aliyebeba ngao[b] akimtangulia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaenda, akisonga na kumkaribia Daudi.” Kiebrania hutumia kitenzi kikuu kikifuatiwa na vishiriki ili kuonyesha mwendo wa kuendelea kwenda mbele.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania צִנָּה (tsinnah) linaweza kumaanisha hasa ngao kubwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akasonga mbele
  rationale: Kitenzi הלך kwa kawaida humaanisha ‘kwenda,’ lakini hapa, pamoja na vivumishi-tendaji vinavyofuata, kinaonyesha kusonga kwa kuendelea kuelekea mpinzani vitani.
- source_word: הַפְּלִשְׁתִּי
  choice: Yule Mfilisti
  rationale: Ni jina la kabila lililo katika umoja na lenye uainisho. ‘Yule Mfilisti’ humrejelea kwa kawaida mtu ambaye tayari ametambulishwa katika simulizi, bila kuongeza ‘shujaa’ lisilopo katika mstari huu.
- source_word: הֹלֵךְ וְקָרֵב
  choice: akizidi kumkaribia
  rationale: Mfuatano wa vivumishi-tendaji unaonyesha mwendo unaoendelea na kukaribia hatua kwa hatua; ‘akizidi kumkaribia’ ni Kiswahili cha kawaida kinachohifadhi hali hiyo ya kuendelea.
- source_word: אֶל דָּוִד
  choice: Daudi
  rationale: Kihusishi אֶל kinaonyesha uelekeo kwa Daudi; katika muundo ‘kumkaribia Daudi,’ uelekeo huo umeonyeshwa kiasili bila kihusishi cha ziada.
- source_word: וְהָאִישׁ
  choice: huku mtu
  rationale: Kishazi hiki kinaeleza hali iliyoandamana na kusonga kwa Mfilisti, si tendo kuu jingine; ‘huku’ huonyesha uhusiano huo kwa wazi.
- source_word: נֹשֵׂא הַצִּנָּה
  choice: aliyebeba ngao kubwa
  rationale: נשא ni ‘kubeba,’ na צִנָּה hurejelea aina ya ngao kubwa. Kutaja ukubwa katika matini kuu kunawakilisha tofauti ya kileksia iliyomo katika neno la Kiebrania.
- source_word: לְפָנָיו
  choice: akitangulia mbele yake
  rationale: Kirai hiki kinaonyesha kwamba mbeba-ngao alikuwa katika nafasi ya mbele ya Mfilisti; ‘akitangulia mbele yake’ ni wazi na ya kawaida katika simulizi.
