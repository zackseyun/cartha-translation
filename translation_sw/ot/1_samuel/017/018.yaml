  text: וְ֠/אֵת עֲשֶׂ֜רֶת חֲרִצֵ֤י הֶֽ/חָלָב֙ הָ/אֵ֔לֶּה תָּבִ֖יא לְ/שַׂר הָ/אָ֑לֶף וְ/אֶת אַחֶ֨י/ךָ֙ תִּפְקֹ֣ד לְ/שָׁל֔וֹם וְ/אֶת עֲרֻבָּתָ֖/ם תִּקָּֽח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/018.yaml
  text: Also bring these ten cuts of cheese to the commander of the thousand[a], check on your brothers’ welfare, and bring back some token from them.
translation:
  language: sw
  text: Pia mpelekee mkuu wa kikosi cha askari elfu vipande hivi kumi vya jibini, ukajue hali ya ndugu zako, kisha urudi na ishara fulani kutoka kwao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uchukue dhamana yao,” yaani kitu au ishara ya kuleta kama uthibitisho wa hali ya ndugu zako.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲרִצֵי הֶחָלָב
  choice: vipande vya jibini
  rationale: Kirai hiki kinaweza kumaanisha vipande au mabonge ya bidhaa ya maziwa. “Vipande vya jibini” ni lugha ya kawaida na inahifadhi picha halisi ya sehemu zilizotengwa.
- source_word: שַׂר הָאָלֶף
  choice: mkuu wa kikosi cha askari elfu
  rationale: שַׂר ni mkuu au kamanda, na הָאָלֶף hapa ni kitengo cha kijeshi cha askari elfu; tafsiri hii inaweka wazi muundo wa kijeshi bila kutumia lugha ya kale.
- source_word: תִּפְקֹד לְשָׁלוֹם
  choice: ukajue hali ya ndugu zako
  rationale: Katika muktadha huu פקד pamoja na לְשָׁלוֹם humaanisha kuchunguza au kuhakikisha hali njema ya mtu. Kiswahili hiki ni cha kawaida na kinafikisha maana ya kujua walivyo.
- source_word: עֲרֻבָּתָם
  choice: ishara fulani kutoka kwao
  rationale: Neno hili linaweza kumaanisha dhamana, kitu cha utambulisho, au uthibitisho. “Ishara fulani kutoka kwao” linaeleweka katika muktadha huku tanbihi ikihifadhi uwezekano wa maana halisi zaidi ya “dhamana yao.”
- source_word: תָּבִיא
  choice: mpelekee
  rationale: Kwa kuwa vitu vinapelekwa kwa mkuu aliyeko kambini, “mpelekee” huonyesha kwa kawaida utoaji kwa mpokeaji huyo.
- source_word: תִּקָּח
  choice: urudi na
  rationale: Ingawa kitenzi chenyewe ni “chukua,” muktadha unaonyesha kuwa Daudi alipaswa kuchukua kitu kutoka kwa ndugu zake na kurudi nacho kwa Yese.
theological_decisions: []
