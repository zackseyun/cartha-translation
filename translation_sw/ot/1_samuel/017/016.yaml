  text: The Philistine came forward morning and evening and took his stand for forty days[a].
translation:
  language: sw
  text: Kwa siku arobaini, Mfilisti huyo alijitokeza asubuhi na jioni, akajisimamisha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikaribia ... akachukua msimamo wake kwa siku arobaini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: akaja mbele
  rationale: Kitenzi נגשׁ humaanisha kukaribia au kuja karibu; katika muktadha huu wa kijeshi, “akaja mbele” kinaonyesha kusogea kwake mbele ya majeshi kwa lugha ya kawaida.
- source_word: הַפְּלִשְׁתִּי
  choice: Yule Mfilisti
  rationale: Kiebrania kinasema tu “Mfilisti.” Kiashiria “yule” kinatambulisha mhusika aliyekwisha tajwa bila kuongeza cheo kama “shujaa.”
- source_word: הַשְׁכֵּם וְהַעֲרֵב
  choice: asubuhi na jioni
  rationale: Usemi huu unaonyesha nyakati mbili za kila siku; “asubuhi na jioni” ni jozi ya kawaida na ya asili katika Kiswahili.
- source_word: וַיִּתְיַצֵּב
  choice: akasimama mahali pake
  rationale: Kauli ya kujirejelea ya יצב ina maana ya kujiweka au kusimama mahali; tafsiri hii inahifadhi wazo la kuchukua nafasi yake kwa ajili ya changamoto.
- source_word: אַרְבָּעִים יוֹם
  choice: kwa siku arobaini
  rationale: Kirai kinaonyesha muda ambao tendo hili lilirudiwa; “kwa siku arobaini” ni usemi wa kawaida wa Kiswahili.
