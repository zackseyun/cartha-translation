  text: וַ/יָּקֻ֣מוּ אַנְשֵׁי֩ יִשְׂרָאֵ֨ל וִ/יהוּדָ֜ה וַ/יָּרִ֗עוּ וַֽ/יִּרְדְּפוּ֙ אֶת הַ/פְּלִשְׁתִּ֔ים עַד בּוֹאֲ/ךָ֣ גַ֔יְא וְ/עַ֖ד שַׁעֲרֵ֣י עֶקְר֑וֹן וַֽ/יִּפְּל֞וּ חַֽלְלֵ֤י פְלִשְׁתִּים֙ בְּ/דֶ֣רֶךְ שַׁעֲרַ֔יִם וְ/עַד גַּ֖ת וְ/עַד עֶקְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/052.yaml
  text: Then the men of Israel and Judah rose up and shouted[a], and they pursued the Philistines as far as Gai and as far as the gates of Ekron. The slain Philistines fell along the road to Shaaraim[b], as far as Gath and as far as Ekron.
translation:
  language: sw
  text: Ndipo wanaume wa Israeli na Yuda wakainuka, wakapiga kelele[a], wakawafukuza Wafilisti mpaka maingilio ya bonde[b] na mpaka malango ya Ekroni. Wafilisti waliouawa walianguka njiani kuelekea Shaaraimu, mpaka Gathi na mpaka Ekroni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakapiga mwito wa vita.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinaweza kueleweka kihalisi kuwa “mpaka unapofika bondeni.” Kirai hiki ni kigumu kimaandishi na kisarufi; wengine hukichukulia kuwa jina la mahali, Gai.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: wakainuka
  rationale: Kitenzi קום katika mfululizo wa masimulizi kinaonyesha wanajeshi kuinuka na kuanza kutenda mara moja baada ya kuanguka kwa Goliathi.
- source_word: אַנְשֵׁי יִשְׂרָאֵל וִיהוּדָה
  choice: wanaume wa Israeli na Yuda
  rationale: Neno אַנְשֵׁי ni ‘wanaume wa’; tafsiri hii inadumisha maana halisi na muktadha wa jeshi.
- source_word: וַיָּרִיעוּ
  choice: wakapiga kelele
  rationale: רוע hapa ni kutoa sauti kubwa ya vita. ‘Wakapiga kelele’ ni Kiswahili cha kawaida, huku tanbihi ikihifadhi maana mahususi ya mwito wa vita.
- source_word: וַיִּרְדְּפוּ
  choice: wakawafuatilia
  rationale: רדף katika muktadha wa kijeshi humaanisha kuwafuata adui wanaokimbia; ‘kuwafuatilia’ ni ya kawaida na sahihi.
- source_word: עַד בּוֹאֲךָ גַיְא
  choice: mpaka maingilio ya bonde
  rationale: Kirai hiki ni kigumu kisarufi na kimaandishi. Tafsiri hii inaeleza בוא kwa maana ya njia au sehemu ya kuingilia na גיא kama ‘bonde,’ bila kuficha ugumu huo, ambao umeelezwa katika tanbihi.
- source_word: וְעַד שַׁעֲרֵי עֶקְרוֹן
  choice: na mpaka malango ya Ekroni
  rationale: Hii inadumisha kikomo cha kijiografia na wingi halisi wa ‘malango.’
- source_word: וַיִּפְּלוּ חַלְלֵי פְלִשְׁתִּים
  choice: Wafilisti waliouawa walianguka
  rationale: חַלְלֵי hurejelea waliouawa vitani, si waliojeruhiwa tu. Muundo huu unadumisha kitenzi ‘walianguka’ cha Kiebrania.
- source_word: בְּדֶרֶךְ שַׁעֲרַיִם
  choice: kandokando ya njia iendayo Shaaraimu
  rationale: בדרך pamoja na jina la mahali kwa kawaida huonyesha njia inayoelekea huko; ‘kandokando ya njia’ pia huonyesha jinsi maiti walivyokuwa kwenye njia hiyo.
- source_word: שַׁעֲרַיִם
  choice: Shaaraimu
  rationale: Jina la mahali limetoholewa kwa matamshi yanayofaa Kiswahili badala ya kutafsiriwa.
- source_word: וְעַד גַּת וְעַד עֶקְרוֹן
  choice: mpaka Gathi na mpaka Ekroni
  rationale: Kurudia ‘mpaka’ kunadumisha urudiaji wa עַד na kusisitiza umbali wa kuwafuatilia na wa hasara.
