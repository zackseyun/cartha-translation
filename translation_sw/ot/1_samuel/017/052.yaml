translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Mfuatano wa vitenzi vya simulizi umehifadhiwa kwa viambishi vya -ka-. Majina ya maeneo yametoholewa kama Ekroni, Gathi, na Shaaraimu. Tanbihi zimewekwa kwenye vipengele vinavyohusika, badala ya kufuata mpangilio uliogeuzwa kimakosa katika safu ya mashauriano ya Kiingereza.
