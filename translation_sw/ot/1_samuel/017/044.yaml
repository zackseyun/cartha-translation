  yaml_path: translation/ot/1_samuel/017/044.yaml
  text: And the Philistine said to David[a], “Come to me[b], and I will give your flesh to the birds of the heavens and to the beasts of the field.”
translation:
  language: sw
  text: Yule Mfilisti akamwambia Daudi, “Njoo kwangu, nami nitawapa ndege wa angani na wanyama wa porini nyama yako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: Yule Mfilisti
  rationale: Nomino yenye kibainishi inamrejelea Goliathi, ambaye tayari ametambulishwa katika muktadha. “Yule Mfilisti” ni ya asili katika simulizi la Kiswahili na haiongezi neno “shujaa,” ambalo halipo wazi katika mstari huu.
- source_word: לְכָה אֵלַי
  choice: Njoo kwangu
  rationale: Amri hii ni changamoto ya moja kwa moja. “Njoo kwangu” huhifadhi mwelekeo na sauti ya kejeli bila kuongeza maneno.
- source_word: וְאֶתְּנָה
  choice: nami nitawapa
  rationale: Umbo hili linaonyesha azimio au tishio thabiti la msemaji. Wakati ujao “nitawapa” ni wa kawaida na wenye nguvu katika Kiswahili.
- source_word: בְּשָׂרְךָ
  choice: nyama yako
  rationale: “Nyama” huhifadhi picha halisi na kali ya בשר kuliko tafsiri pana kama “mwili” au tafsiri ya kimuktadha kama “mzoga.”
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: ndege wa angani
  rationale: Katika tishio hili עוֹף inarejelea ndege, na “wa angani” ni usemi wa kawaida wa Kiswahili unaowakilisha הַשָּׁמַיִם bila kuleta maana ya makao ya Mungu isiyolazimishwa na muktadha.
- source_word: וּלְבֶהֱמַת הַשָּׂדֶה
  choice: na wanyama wa porini
  rationale: בְּהֵמָה ni wanyama, huku הַשָּׂדֶה hapa ikionyesha eneo la wazi nje ya makazi. “Wanyama wa porini” ni usemi wa sasa na wa asili unaofaa tishio la kuachwa bila kuzikwa.
