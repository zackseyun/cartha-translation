  text: וַ/יַּחְגֹּ֣ר דָּוִ֣ד אֶת חַ֠רְבּ/וֹ מֵ/עַ֨ל לְ/מַדָּ֜י/ו וַ/יֹּ֣אֶל לָ/לֶכֶת֮ כִּ֣י לֹֽא נִסָּה֒ וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל שָׁא֗וּל לֹ֥א אוּכַ֛ל לָ/לֶ֥כֶת בָּ/אֵ֖לֶּה כִּ֣י לֹ֣א נִסִּ֑יתִי וַ/יְסִרֵ֥/ם דָּוִ֖ד מֵ/עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/039.yaml
  text: And David strapped his sword over his armor and tried to go[a], for he had not tested them. But David said to Saul, “I cannot go with these[b], for I have not tested them.” So David removed them from himself.
translation:
  language: sw
  text: Daudi akaufunga upanga wake juu ya mavazi yake ya vita, kisha akajaribu kwenda[a], kwa maana hakuwa amevijaribu. Lakini Daudi akamwambia Sauli, “Siwezi kwenda nikiwa na vitu hivi[b], kwa maana sijavijaribu.” Basi Daudi akavivua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akathubutu kwenda”; usemi wa Kiebrania unaweza kumaanisha kujaribu, kujitosa, au kuamua kwenda.
    reason: lexical_alternative
  - marker: b
    text: “Vitu hivi” vinarejelea mavazi na vifaa vya vita ambavyo Sauli alikuwa amemvalisha Daudi.
    reason: referent_clarification
lexical_decisions:
- source_word: וַיַּחְגֹּר
  choice: akajifungia
  rationale: Kitenzi חגר humaanisha kujifunga au kufunga silaha mwilini; ‘akajifungia’ ni Kiswahili cha kawaida kinachoonyesha tendo la kuweka upanga tayari kubebwa.
- source_word: חַרְבּוֹ
  choice: upanga wake
  rationale: Hii ndiyo maana ya kawaida ya חֶרֶב pamoja na kiambishi cha nafsi ya tatu umoja.
- source_word: מֵעַל לְמַדָּיו
  choice: juu ya mavazi yake ya vita
  rationale: לְמַדִּים inaweza kumaanisha mavazi au vifaa vya kuvaliwa; katika muktadha huu ni mavazi ya kijeshi. ‘Mavazi yake ya vita’ huhifadhi maana hiyo bila kudai kwamba neno lenyewe linamaanisha silaha zote za kujikinga.
- source_word: וַיֹּאֶל לָלֶכֶת
  choice: akajaribu kutembea
  rationale: Muundo יאל pamoja na kitenzi-jina unaweza kumaanisha kuanza, kujitosa, au kujaribu kufanya jambo. Katika simulizi hili Daudi anapima uwezo wake wa kusogea akiwa amevaa vifaa hivyo.
- source_word: כִּי לֹא נִסָּה
  choice: kwa maana hakuwa amevijaribu
  rationale: נסה katika piel humaanisha kujaribu au kupima kwa matumizi. Kiambishi ‘vi-’ kinaelekeza kwa ujumla kwenye vifaa alivyovaa, ambavyo havitajwi wazi kama kiima cha yambwa katika Kiebrania.
- source_word: לֹא אוּכַל לָלֶכֶת בָּאֵלֶּה
  choice: Siwezi kutembea nikiwa na vitu hivi
  rationale: הלך hapa inahusu kutembea au kusogea, na בָּאֵלֶּה hurejelea vifaa alivyovaa. Usemi huu ni wa asili katika Kiswahili na unaweka wazi kuwa tatizo ni kusogea akiwa navyo.
- source_word: לֹא נִסִּיתִי
  choice: sijavijaribu
  rationale: Inarudia mzizi נסה katika nafsi ya kwanza; tafsiri ileile ya msingi imedumishwa, huku yambwa iliyodokezwa ikionyeshwa kwa kiambishi ‘vi-’.
- source_word: וַיְסִרֵם ... מֵעָלָיו
  choice: akavivua
  rationale: Hiphil ya סור hapa humaanisha kuviondoa kutoka mwilini. ‘Akavivua’ ni tafsiri fupi, ya kawaida, na sahihi kwa vifaa vilivyovaliwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya kisimulizi. ‘Mavazi ya vita’ yametumiwa kuhifadhi upana wa לְמַדִּים, na ‘vitu hivi’ kuhifadhi namna Kiebrania kinavyorejelea vifaa hivyo kwa ujumla.
