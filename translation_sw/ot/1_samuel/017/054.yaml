  text: וַ/יִּקַּ֤ח דָּוִד֙ אֶת רֹ֣אשׁ הַ/פְּלִשְׁתִּ֔י וַ/יְבִאֵ֖/הוּ יְרוּשָׁלִָ֑ם וְ/אֶת כֵּלָ֖י/ו שָׂ֥ם בְּ/אָהֳלֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/054.yaml
  text: David took the head of the Philistine and brought it to Jerusalem[b][a], and he put his weapons in his tent.
translation:
  language: sw
  text: Daudi akachukua kichwa cha Mfilisti, akakileta Yerusalemu[b], na akaweka silaha zake[a] katika hema lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vifaa vyake” au “zana zake za kijeshi”; neno la Kiebrania ni pana na linaweza kujumuisha silaha, mavazi ya kivita, au vifaa vingine vya kijeshi.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya wasomaji huona mvutano wa mpangilio wa matukio katika maneno “akakileta Yerusalemu,” kwa kuwa wakati huu Yerusalemu ulikuwa bado haujatawaliwa kikamilifu na Israeli. Tafsiri imehifadhi maneno ya Kiebrania bila kujaribu kuyaoanisha na simulizi pana.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akakichukua
  rationale: Kitenzi לקח katika usimulizi kina maana ya kawaida ya ‘kuchukua’; kiambishi -ki- kinarejelea ‘kichwa’.
- source_word: רֹאשׁ הַפְּלִשְׁתִּי
  choice: kichwa cha yule Mfilisti
  rationale: רֹאשׁ limetafsiriwa kwa maana yake halisi ya sehemu ya mwili. ‘Yule Mfilisti’ ni njia ya kawaida ya Kiswahili ya kumrejelea Goliathi aliyetajwa katika muktadha.
- source_word: וַיְבִאֵהוּ יְרוּשָׁלִָם
  choice: na kukileta Yerusalemu
  rationale: Kiambishi cha Kiebrania kinarejelea רֹאשׁ, nomino ya kiume katika Kiebrania; Kiswahili hutumia upatanisho wa ngeli ya ‘kichwa’. Maneno yanaachwa kama simulizi la moja kwa moja bila kuoanisha mpangilio wa matukio.
- source_word: כֵּלָיו
  choice: silaha zake
  rationale: כְּלִי ni neno pana linaloweza kumaanisha vifaa, zana, silaha, au vyombo. Katika muktadha wa vita, ‘silaha’ ni tafsiri fupi na ya kawaida, huku tanbihi ikihifadhi upana wa neno.
- source_word: שָׂם
  choice: akaweka
  rationale: ‘Akaweka’ ni Kiswahili cha kawaida kwa tendo rahisi la kuweka kitu mahali.
- source_word: בְּאָהֳלוֹ
  choice: katika hema lake
  rationale: אָהֶל kwa kawaida ni ‘hema’. Kiwakilishi cha umilikaji kinahifadhiwa; kwa muktadha, hema linaeleweka kuwa la Daudi.
theological_decisions:
- issue: Warejelewa wa viambishi vya umilikaji katika kishazi cha mwisho
  choice: Silaha ni za Mfilisti, na hema ni la Daudi.
  alternative: Silaha na hema vyote ni vya Daudi; au hema ni la kijeshi/jumuiya.
  rationale: Muktadha unaonyesha Daudi akichukua nyara za Goliathi. Kwa hiyo ‘silaha zake’ hurejelea Mfilisti, ilhali mahali alipoweka silaha hizo panaeleweka kuwa hema la Daudi. Tanbihi ya msamiati inaonya kwamba כֵּלָיו ni pana kuliko silaha pekee.
- issue: Mvutano unaoonekana kuhusu kuletwa Yerusalemu katika hatua hii ya simulizi
  choice: Kutafsiri moja kwa moja ‘kukileta Yerusalemu’ bila kuoanisha mpangilio wa matukio.
  alternative: ‘Ambacho baadaye alikileta Yerusalemu’ au ‘alikileta kuelekea Yerusalemu.’
  rationale: Kiebrania kinasimulia tendo moja kwa moja. Tafsiri inalinda maneno na mvutano wa simulizi badala ya kuongeza maelezo ya wakati au mwelekeo yasiyomo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘aka-’ unafaa kwa mfululizo wa matendo katika simulizi. Kiunganishi ‘naye’ kinabeba וְ bila kuingiza maana ya upinzani. Alama za tanbihi zimewekwa mara tu baada ya vifungu vinavyohusika.
