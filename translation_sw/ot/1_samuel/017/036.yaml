base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/036.yaml
  text: Your servant struck down both the lion and the bear[a], and this uncircumcised Philistine will be like one of them, because he has defied the battle lines of the living God.
translation:
  language: sw
  text: Mtumishi wako amewapiga simba na dubu[a], na huyu Mfilisti asiyetahiriwa atakuwa kama mmoja wao, kwa sababu amezitukana safu za vita za Mungu aliye hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “amewaua simba na dubu.” Kitenzi cha Kiebrania kinaweza kumaanisha kupiga, kuangusha, au kuua.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: amewaua
  rationale: Kitenzi נכה kinaweza kumaanisha kupiga au kuua. Katika muktadha wa Daudi kuwashinda wanyama hatari na wa hatima inayomngojea Goliathi, “amewaua” ni Kiswahili cha kawaida na wazi, ingawa maana ya msingi ni kupiga na kuwaangusha.
- source_word: עַבְדֶּךָ
  choice: Mtumishi wako
  rationale: Hapa Daudi anatumia lugha ya heshima anapozungumza na Sauli; “mtumishi wako” huhifadhi mtindo huo bila kusisitiza hali ya utumwa.
- source_word: הָאֲרִי ... הַדּוֹב
  choice: simba na dubu
  rationale: Kiswahili hakihitaji viambajengo vya kuonyesha uarifu kama Kiebrania. Majina haya yanaeleweka kwa kawaida kuwa wanyama maalumu ambao Daudi alikabiliana nao.
- source_word: וְהָיָה
  choice: atakuwa
  rationale: Katika muktadha huu umbo hilo linatabiri kwa uhakika yatakayompata Mfilisti.
- source_word: הֶעָרֵל
  choice: asiyetahiriwa
  rationale: Tafsiri halisi huhifadhi alama ya kimwili ya agano na nguvu ya kejeli ya Daudi bila kuibadili kuwa ufafanuzi wa kitheolojia.
- source_word: כְּאַחַד מֵהֶם
  choice: kama mmoja wao
  rationale: Huhifadhi ulinganisho wa moja kwa moja kati ya hatima ya Mfilisti na ile ya simba au dubu.
- source_word: חֵרֵף
  choice: ameyatukana
  rationale: חרף hubeba maana ya kutukana, kudhihaki, au kukaidi kwa dharau. “Ameyatukana” huonyesha wazi dharau iliyoelekezwa kwa vikosi vya Mungu.
- source_word: מַעַרְכֹת
  choice: majeshi
  rationale: Neno מערכות linaweza kumaanisha safu au mistari ya mapigano na, kwa upanuzi, majeshi. “Majeshi” ni Kiswahili cha kawaida katika sentensi hii; tanbihi huhifadhi taswira halisi ya safu za vita.
- source_word: אֱלֹהִים חַיִּים
  choice: Mungu aliye hai
  rationale: Hili ni fungu la kawaida linalosisitiza kwamba Mungu yu hai na ni halisi; umoja wa “Mungu” unatakiwa na maana.
theological_decisions:
- issue: Nguvu ya kiagano ya הֶעָרֵל katika maelezo ya Daudi kuhusu Mfilisti
  choice: Kuhifadhi neno halisi “asiyetahiriwa” katika matini kuu
  alternative: aliye nje ya agano; Mfilisti asiyemcha Mungu
  rationale: Kiebrania kinatumia alama ya kimwili ya agano kama dhihaka ya kitheolojia. Tafsiri ya maelezo ingeongeza ufafanuzi na kudhoofisha usemi wa chanzo.
- issue: Maana ya מַעַרְכֹת kuhusiana na Mungu
  choice: Kutafsiri “majeshi” katika matini kuu na kuweka “safu za vita” katika tanbihi
  alternative: safu za vita za Mungu aliye hai; mistari ya mapigano ya Mungu aliye hai
  rationale: Neno linaonyesha vikosi vilivyopangwa kwa vita na linaweza kutumiwa kwa upanuzi kuhusu majeshi. “Majeshi” ni cha asili zaidi katika Kiswahili, huku tanbihi ikihifadhi picha halisi na utata wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ni rahisi kusomeka lakini huhifadhi dhihaka ya kiagano na kauli yenye uhakika ya Daudi.
