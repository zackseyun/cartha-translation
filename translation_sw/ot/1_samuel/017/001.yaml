base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/001.yaml
  text: The Philistines gathered their armies for battle[a], and they assembled at Socoh, which belongs to Judah, and camped between Socoh and Azekah[b], at Ephes-dammim.
translation:
  language: sw
  text: Wafilisti wakakusanya majeshi yao kwa ajili ya vita[a]. Wakakusanyika huko Soko, mji uliokuwa wa Yuda[b], wakapiga kambi kati ya Soko na Azeka, huko Efes-Damimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kambi zao”; neno la Kiebrania linaweza kumaanisha kambi za kijeshi au majeshi.
    reason: lexical_alternative
  - marker: b
    text: Soko ulikuwa mji katika eneo la kabila la Yuda.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּאַסְפוּ
  choice: wakakusanya
  rationale: Kitenzi אָסַף katika masimulizi humaanisha kukusanya; umbo hili linadumisha mwendo wa mfululizo wa matukio.
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa taifa hili la kale.
- source_word: מַחֲנֵיהֶם
  choice: majeshi yao
  rationale: Ingawa מַחֲנֶה inaweza kumaanisha kambi, katika muktadha wa kukusanyika kwa vita inarejelea vikosi au majeshi yaliyopangwa kambini.
- source_word: לַמִּלְחָמָה
  choice: kwa ajili ya vita
  rationale: Hutoa wazi kusudi la kukusanyika na kufaa kwa tukio hili la mapigano.
- source_word: וַיֵּאָסְפוּ
  choice: wakakusanyika
  rationale: Umbo la Kiebrania hapa linaonyesha wao wenyewe kukusanyika; Kiswahili hiki ni cha kawaida na sahihi.
- source_word: שֹׂכֹה
  choice: Soko
  rationale: Unukuzi wa jina la mahali unaolingana na mfumo wa sauti wa Kiswahili.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: mji uliokuwa wa Yuda
  rationale: Kirai cha לְ kinaonyesha uhusiano wa kumilikiwa au kuhusishwa na eneo la Yuda; kutaja 'mji' hufanya rejeo la mahali lieleweke kwa kawaida.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza חנה, yaani kukaa kambini.
- source_word: בֵּין ... וּבֵין
  choice: kati ya ... na
  rationale: Hili ndilo tamko la kawaida la Kiswahili la uhusiano huu wa mahali.
- source_word: עֲזֵקָה
  choice: Azeka
  rationale: Unukuzi wa jina la mahali unaofaa Kiswahili.
- source_word: בְּאֶפֶס דַּמִּים
  choice: huko Efes-Damimu
  rationale: Kirai kinachukuliwa kuwa jina la mahali; 'huko' kinaonyesha eneo la kambi bila kutafsiri jina hilo kimaana.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfululizo wa vitenzi vya ki- hutunza kasi ya masimulizi ya Kiebrania, huku sentensi mbili zikisaidia usomaji wa kawaida. Majina ya mahali yameandikwa kwa maumbo yanayosomeka kwa urahisi katika Kiswahili.
