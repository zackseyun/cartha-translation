translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi, wa sasa na wenye heshima. Marudio ya “kukabiliana na” yanahifadhi urudiaji wa לִקְרַאת katika chanzo; kiwakilishi “naye” huzuia kurudia jina la Daudi kwa namna nzito.
