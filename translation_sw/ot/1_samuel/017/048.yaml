base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/048.yaml
  text: And when the Philistine rose and came and drew near to meet David[a], David hurried and ran toward the battle line to meet the Philistine.
translation:
  language: sw
  text: Ikawa, Mfilisti alipoinuka, akasonga mbele na kumkaribia Daudi ili kukutana naye, Daudi akafanya haraka, akakimbia kuelekea mstari wa vita[a] ili kukutana na Mfilisti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “safu za vita.” Nomino ya Kiebrania inaweza kumaanisha mstari wa vita au mpangilio wa vita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Ikawa ... alipo-
  rationale: Muundo huu wa masimulizi unaanzisha tukio linalofuata; “Ikawa ... alipo-” huhifadhi mtiririko na maana ya wakati kwa Kiswahili cha simulizi.
- source_word: קָם
  choice: alipoinuka
  rationale: Kitenzi kinaonyesha kuinuka au kusimama ili kuanza kutenda; “alipoinuka” kinahifadhi picha halisi bila kuongeza kwamba alikuwa bingwa.
- source_word: הַפְּלִשְׁתִּי
  choice: Mfilisti
  rationale: Chanzo kinasema tu “Mfilisti”; hakiongezi jina la cheo kama “shujaa” katika aya hii.
- source_word: וַיֵּלֶךְ
  choice: akasonga mbele
  rationale: Katika muktadha wa kukaribiana vitani, “akasonga mbele” hueleza mwendo wake kwa Kiswahili cha kawaida kuliko tafsiri kavu ya “akaenda,” bila kuzidisha maana.
- source_word: וַיִּקְרַב
  choice: na kumkaribia Daudi
  rationale: Huhifadhi wazo la Mfilisti kupunguza umbali kati yake na Daudi.
- source_word: לִקְרַאת
  choice: ili kukabiliana na
  rationale: Kirai hiki huonyesha mwendo wa kwenda kukutana na mtu; katika mazingira ya vita, “kukabiliana na” huwasilisha kukutana kwa uhasama. Kimetumiwa katika sehemu zote mbili.
- source_word: וַיְמַהֵר
  choice: akafanya haraka
  rationale: Hueleza wazi kwamba Daudi alitenda kwa upesi kwa lugha ya sasa na inayoeleweka.
- source_word: וַיָּרָץ
  choice: akakimbia
  rationale: Ni maana ya moja kwa moja ya kitenzi na inadumisha kasi ya simulizi.
- source_word: הַמַּעֲרָכָה
  choice: kuelekea mstari wa vita
  rationale: Nomino inaweza kumaanisha mstari au safu iliyopangwa kwa vita. “Mstari wa vita” inafaa mazingira ya kijeshi, huku “kuelekea” ikieleza mwendo wa Daudi katika muktadha.
