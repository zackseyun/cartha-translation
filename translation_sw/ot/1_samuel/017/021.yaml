  text: And Israel and the Philistines drew up battle line against battle line[a].
translation:
  language: sw
  text: Waisraeli na Wafilisti wakajipanga kwa safu za vita, safu ikikabiliana na safu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpangilio wa vita ukikabiliana na mpangilio wa vita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲרֹךְ
  choice: wakajipanga
  rationale: Kitenzi ערך katika muktadha wa kijeshi kinaonyesha kupanga vikosi kwa ajili ya mapambano. “Wakajipanga” ni Kiswahili cha kawaida na cha sasa kinachowasilisha tendo hilo kwa uwazi.
- source_word: יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Katika sentensi hii jina la taifa linarejelea watu au jeshi lake; “Waisraeli” ni usemi wa asili katika Kiswahili na unaendana na kitenzi cha wingi.
- source_word: וּפְלִשְׁתִּים
  choice: na Wafilisti
  rationale: Hili ni jina la kawaida la Kiswahili kwa kundi hili la watu.
- source_word: מַעֲרָכָה
  choice: safu za vita / safu
  rationale: Nomino hii katika muktadha huu ni mpangilio au mstari wa vikosi vitani. “Safu za vita” inaeleweka kwa urahisi, huku kurudiwa kwa “safu” kukihifadhi taswira na msisitizo wa Kiebrania.
- source_word: לִקְרַאת
  choice: ikikabiliana na
  rationale: Neno hili kimsingi lina maana ya kuelekea kukutana au kukutana uso kwa uso; katika mazingira ya vita linaonyesha safu mbili pinzani zinazotazamana. “Ikikabiliana na” huhifadhi maana hiyo ya kijeshi bila kuifanya kuwa shambulio ambalo bado halijasemwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umetumia wingi wa watu (“Waisraeli na Wafilisti”) kwa sababu kitenzi cha Kiebrania cha umoja kinaweza kueleweka kwa kulingana na “Israeli” kama taifa, lakini Kiswahili cha kawaida huhitaji upatanisho wa wingi hapa. Alama ya tanbihi [a] imewekwa katika maandishi.
