  text: וַ/יַּלְבֵּ֨שׁ שָׁא֤וּל אֶת דָּוִד֙ מַדָּ֔י/ו וְ/נָתַ֛ן ק֥וֹבַע נְחֹ֖שֶׁת עַל רֹאשׁ֑/וֹ וַ/יַּלְבֵּ֥שׁ אֹת֖/וֹ שִׁרְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/038.yaml
  text: Then Saul clothed David with his garments[a], put a bronze helmet on his head[b], and clothed him with armor.
translation:
  language: sw
  text: Ndipo Sauli akamvika Daudi mavazi yake[a], akamwekea kofia ya vita ya shaba kichwani, kisha akamvika vazi la vita la kujikinga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mavazi yake ya kijeshi.” Neno la Kiebrania linaweza kumaanisha mavazi yanayohusishwa na cheo au mavazi ya kwenda vitani.
    reason: lexical_alternative
  - marker: b
    text: Au, “deraya.” Neno la Kiebrania linamaanisha kinga inayovaliwa mwilini, lakini hapa halitaji kwa uhakika jinsi ilivyotengenezwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּלְבֵּשׁ
  choice: akamvika
  rationale: Kitenzi hiki katika kausativi humaanisha kumfanya mtu avae kitu. “Akamvika” ni Kiswahili cha kawaida kinachohifadhi maana hiyo na pia marudio ya kitenzi katika mstari.
- source_word: מַדָּיו
  choice: mavazi yake
  rationale: Neno מַד linaweza kumaanisha mavazi, hasa mavazi ya cheo au ya kijeshi. Kwa kuwa kofia ya vita na vazi la kujikinga vinatajwa kando, “mavazi yake” halivichanganyi vitu hivyo. Kiambishi cha nafsi ya tatu umoja kinamrejelea Sauli bila kuongeza msisitizo usiomo katika Kiebrania.
- source_word: קוֹבַע נְחֹשֶׁת
  choice: kofia ya vita ya shaba
  rationale: קוֹבַע ni kofia ya kujikinga vitani, na נְחֹשֶׁת hapa ni metali ya shaba/bronzi. “Kofia ya vita” inaeleweka kwa urahisi kuliko “helmeti,” huku “shaba” likiwa neno la kawaida la Kiswahili katika muktadha huu wa kale.
- source_word: עַל רֹאשׁוֹ
  choice: kichwani
  rationale: Hii ni tafsiri ya asili na fupi ya kirai “juu ya kichwa chake,” bila kupoteza maana.
- source_word: שִׁרְיוֹן
  choice: vazi la vita la kujikinga
  rationale: Neno hili linamaanisha kinga inayovaliwa mwilini. Tafsiri hii ni wazi kwa msomaji wa kawaida na haibainishi isivyohitajika kama lilikuwa deraya ya pete, magamba, au aina nyingine.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi ulio wazi na wenye heshima. Marudio ya “akamvika” yamehifadhiwa kwa sababu yapo mara mbili katika Kiebrania. Alama ya tanbihi [b] imewekwa baada ya “vazi la vita la kujikinga,” ambacho ndicho kinachoelezwa na tanbihi hiyo.
