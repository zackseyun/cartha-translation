source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָ֗ה אֲשֶׁ֨ר הִצִּלַ֜/נִי מִ/יַּ֤ד הָֽ/אֲרִי֙ וּ/מִ/יַּ֣ד הַ/דֹּ֔ב ה֣וּא יַצִּילֵ֔/נִי מִ/יַּ֥ד הַ/פְּלִשְׁתִּ֖י הַ/זֶּ֑ה וַ/יֹּ֨אמֶר שָׁא֤וּל אֶל דָּוִד֙ לֵ֔ךְ וַֽ/יהוָ֖ה יִהְיֶ֥ה עִמָּֽ/ךְס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/037.yaml
  text: David said[a], “Yahweh, who delivered me from the paw of the lion and from the paw of the bear, he will deliver me from the hand of this Philistine.” Then Saul said to David, “Go, and may Yahweh be with you.”
translation:
  language: sw
  text: Daudi akasema, “Yahwe, aliyeniokoa katika makucha ya simba na makucha ya dubu, ndiye atakayeniokoa mkononi mwa Mfilisti huyu.” Sauli akamwambia Daudi, “Nenda, na Yahwe awe pamoja nawe[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na Yahwe atakuwa pamoja nawe.” Kiebrania kinaweza kueleweka ama kama dua au baraka, ama kama taarifa ya wakati ujao.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne YHWH limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama ‘BWANA’.
- source_word: הִצִּלַנִי / יַצִּילֵנִי
  choice: aliyeniokoa / atakayeniokoa
  rationale: Kitenzi נצל katika muundo wa Hifili kinaonyesha kuokolewa kutoka hatarini; kurudia mzizi ‘okoa’ kunahifadhi uhusiano kati ya ukombozi wa zamani na tumaini la wakati ujao.
- source_word: מִיַּד
  choice: katika makucha / mkononi
  rationale: Kwa wanyama, ‘makucha’ ni taswira ya kawaida na yenye kueleweka katika Kiswahili; kwa Mfilisti, ‘mkononi mwa’ huhifadhi nahau ya Kiebrania inayomaanisha kuwa chini ya nguvu au uwezo wake.
- source_word: הָאֲרִי / הַדֹּב
  choice: simba / dubu
  rationale: Majina ya wanyama yametafsiriwa moja kwa moja kwa Kiswahili sanifu.
- source_word: הוּא
  choice: ndiye
  rationale: Kiwakilishi huru cha Kiebrania kina mkazo; ‘ndiye’ kinahifadhi msisitizo wa Daudi kwamba Yahwe mwenyewe atamwokoa.
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: Mfilisti huyu
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi rejeo la Daudi lenye kuelekezwa kwa adui huyo mahususi.
- source_word: לֵךְ
  choice: Nenda
  rationale: Amri fupi na ya moja kwa moja inaendana na jibu la Sauli.
- source_word: יִהְיֶה עִמָּךְ
  choice: awe pamoja nawe
  rationale: Katika muktadha huu kauli inaweza kueleweka kama dua au baraka ya Sauli; hali ya kutakia imewasilishwa kwa Kiswahili cha kawaida huku usomaji wa wakati ujao ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Namna ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Matini ya Kiebrania inatumia jina la Mungu moja kwa moja; kulitohowa kama ‘Yahwe’ huhifadhi jina binafsi badala ya kuliweka kama cheo.
- issue: Nguvu ya kauli ya mwisho ya Sauli
  choice: naye Yahwe awe pamoja nawe
  alternative: naye Yahwe atakuwa pamoja nawe
  rationale: Umbo la Kiebrania linaweza kueleweka kama dua/baraka au taarifa ya wakati ujao. Matini kuu inatumia dua inayofaa muktadha wa kumuaga, na tanbihi inahifadhi usomaji mwingine bila kuondoa utata.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Makucha’ ni ya asili kwa wanyama, huku ‘mkononi mwa’ ikihifadhi nahau ya mamlaka kwa adui wa kibinadamu. Mtiririko wa masimulizi umetolewa kwa ‘akasema’ na ‘akamwambia’.
