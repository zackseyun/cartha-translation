base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/008.yaml
  text: The next day[a], the Philistines came to strip the slain, and they found Saul and his three sons fallen on Mount Gilboa.
translation:
  language: sw
  text: Siku iliyofuata, Wafilisti walikuja kuwavua waliouawa[a], nao wakamkuta Sauli na wanawe watatu wakiwa wameanguka juu ya Mlima Gilboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwavua wafu” au “kuwapora waliouawa.” Kitenzi cha Kiebrania hapa kinamaanisha kuondoa mavazi au silaha kutoka kwa waliouawa vitani.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Kesho yake
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha siku iliyofuata matukio ya vita yaliyosimuliwa.
- source_word: לְפַשֵּׁט
  choice: kuwavua
  rationale: Katika muktadha huu kitenzi kinamaanisha kuvua mavazi au silaha kutoka kwa waliouawa vitani; uchaguzi huu ni wa moja kwa moja na wa asili.
- source_word: הַחֲלָלִים
  choice: waliouawa
  rationale: Hurejelea watu waliouawa vitani na huhifadhi muktadha wa mapigano bila kutumia neno lisilo la lazima la maiti.
- source_word: וַיִּמְצְאוּ
  choice: wakamkuta
  rationale: Huhifadhi mfuatano wa simulizi na ni Kiswahili cha kawaida kwa tendo la kumpata mtu mahali fulani.
- source_word: נֹפְלִים
  choice: wakiwa wameanguka
  rationale: Huhifadhi taswira halisi ya Kiebrania ya walioanguka vitani badala ya kuifafanua tu kuwa walikuwa wamekufa.
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: juu ya Mlima Gilboa
  rationale: Ni namna ya kawaida na inayofaa kijiografia ya kutaja mahali hapo kwa Kiswahili.
- source_word: שְׁלֹשֶׁת בָּנָיו
  choice: wanawe watatu
  rationale: Ni tafsiri fupi na ya asili inayohifadhi uhusiano wa kifamilia na idadi.
