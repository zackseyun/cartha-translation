  yaml_path: translation/ot/1_samuel/031/013.yaml
  text: They took their bones and buried them under the tamarisk tree in Jabesh[b][a], and they fasted seven days.
translation:
  language: sw
  text: Wakachukua mifupa yao, wakaizika chini ya mti wa tamariski[a] huko Yabeshi[b], kisha wakafunga kwa siku saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tamariski” tu; Kiebrania hutaja spishi hii ya mti hasa.
    reason: lexical_alternative
  - marker: b
    text: Yabeshi hapa ni ufupisho wa Yabeshi-gileadi, iliyotajwa katika muktadha uliotangulia.
    reason: cross_reference
lexical_decisions:
- source_word: עַצְמֹתֵיהֶם
  choice: mifupa yao
  rationale: עֶצֶם humaanisha hasa ‘mfupa’; kwa kuwa miili ilikuwa imechomwa katika mstari uliotangulia, tafsiri halisi na wazi ‘mifupa yao’ inafaa kuliko neno la jumla ‘mabaki yao’.
- source_word: וַיִּקְבְּרוּ
  choice: wakaizika
  rationale: קבר ni kitenzi cha kawaida cha ‘kuzika’; kiambishi -i- kinarejelea mifupa kama mkusanyiko mmoja katika matumizi ya kawaida ya Kiswahili.
- source_word: תַחַת
  choice: chini ya
  rationale: Hii ndiyo tafsiri ya kawaida na ya asili ya תַחַת katika muktadha huu.
- source_word: הָאֶשֶׁל
  choice: mti wa mkwaju
  rationale: אֶשֶׁל hutaja mti wa tamariski; ‘mti wa mkwaju’ ni jina la Kiswahili linalotumiwa kwa tamariski, huku tanbihi ikihifadhi utambulisho wa spishi kwa uwazi.
- source_word: בְּיָבֵשָׁה
  choice: huko Yabeshi
  rationale: Ni jina la mahali Yabeshi, lililofupishwa kutoka Yabeshi-gileadi katika muktadha uliotangulia; ‘huko’ huonyesha mahali kwa Kiswahili cha asili.
- source_word: וַיָּצֻמוּ
  choice: wakafunga
  rationale: צום humaanisha kujizuia kula kwa kusudi la kufunga; ‘kufunga’ ndiyo kauli ya kawaida ya Kiswahili katika muktadha wa kidini na maombolezo.
- source_word: שִׁבְעַת יָמִים
  choice: siku saba
  rationale: Ni uwasilishaji wa moja kwa moja na wa kawaida wa idadi na kipindi hicho.
- source_word: וַיִּקְחוּ
  choice: Wakayachukua
  rationale: לקח ni ‘kuchukua’; muundo wa ‘waka-’ unaendeleza mfuatano wa simulizi wa wayyiqtol bila kuongeza maana isiyokuwamo.
