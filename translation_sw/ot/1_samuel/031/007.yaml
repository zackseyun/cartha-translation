translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, katika mtindo wa masimulizi ulio wazi, wa sasa na wenye heshima. Muundo wa sentensi umefanywa kuwa wa asili kwa Kiswahili huku urudiaji na mpangilio wa matukio wa Kiebrania ukihifadhiwa. Tanbihi zimepangwa kulingana na maneno yanayohusika katika maandishi, kwa kuwa viashiria vya tanbihi katika safu ya Kiingereza havikulingana na maelezo yake.
