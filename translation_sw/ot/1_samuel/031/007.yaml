base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/007.yaml
  text: When the men of Israel who were on the other side of the valley[a], and those on the other side of the Jordan, saw that the men of Israel had fled and that Saul and his sons were dead, they abandoned the cities and fled[b]; and the Philistines came and lived in them.
translation:
  language: sw
  text: Wanaume wa Israeli waliokuwa ng’ambo ya bonde[a], na wale waliokuwa ng’ambo ya Yordani, walipoona kwamba wanaume wa Israeli walikuwa wamekimbia, na kwamba Sauli na wanawe walikuwa wamekufa, wakaiacha miji hiyo na kukimbia. Kisha Wafilisti wakaja na kukaa humo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Usemi wa Kiebrania unaorudiwa hapa, “ng’ambo ya,” humaanisha upande wa pili au eneo lililo ng’ambo ya mahali fulani; pia unaweza kutafsiriwa, “upande ule mwingine wa bonde” na “upande ule mwingine wa Yordani.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kufanya makao humo.” Kitenzi cha Kiebrania kinaweza kumaanisha kukaa, kuishi, au kufanya makao mahali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: walipoona
  rationale: Kitenzi ראה kimsingi ni ‘kuona.’ Muundo wa ‘walipoona kwamba’ unaonyesha jambo walilotambua kutokana na hali iliyokuwa wazi bila kuongeza tafsiri ya ‘walitambua.’
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: wanaume wa Israeli
  rationale: Huhifadhi maana ya moja kwa moja ya ‘wanaume wa Israeli’ na inafaa katika mazingira haya ya vita kuliko kuitafsiri kwa ujumla kuwa ‘Waisraeli.’
- source_word: בְּעֵבֶר הָעֵמֶק / בְּעֵבֶר הַיַּרְדֵּן
  choice: ng’ambo ya bonde / ng’ambo ya Yordani
  rationale: Neno עֵבֶר huonyesha upande wa pili au eneo lililo ng’ambo ya sehemu inayotajwa. ‘Ng’ambo ya’ ni Kiswahili cha kawaida na huhifadhi urudiaji wa usemi wa Kiebrania.
- source_word: כִּי נָסוּ
  choice: kwamba ... walikuwa wamekimbia
  rationale: Hili ndilo jambo waliloona, na wakati timilifu ‘walikuwa wamekimbia’ huonyesha kwamba kukimbia kulitangulia mwitikio wa wakazi hao.
- source_word: מֵתוּ
  choice: walikuwa wamekufa
  rationale: מות hutaja kifo bila kubainisha namna kilivyotokea; kwa hiyo tafsiri haiongezi kwamba waliuawa.
- source_word: וּבָנָיו
  choice: na wanawe
  rationale: Huhifadhi uunganishi rahisi wa Sauli na wanawe kama waliokuwa wamekufa.
- source_word: וַיַּעַזְבוּ אֶת־הֶעָרִים
  choice: wakaiacha miji
  rationale: עזב humaanisha kuacha nyuma au kutelekeza. ‘Kuiacha miji’ ni ya asili katika Kiswahili na muktadha wa kukimbia unaonyesha kwamba waliitelekeza.
- source_word: וַיָּנֻסוּ
  choice: na kukimbia
  rationale: נוס ni kitenzi cha kawaida cha kukimbia hatari au adui; usemi huu ni wazi na wa asili.
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: Kisha Wafilisti wakaja
  rationale: בוא ni ‘kuja’ au ‘kuingia.’ ‘Wakaja’ hufuata Kiebrania kwa karibu, huku sentensi inayofuata ikionyesha walichofanya katika miji hiyo.
- source_word: וַיֵּשְׁבוּ בָּהֶן
  choice: na kukaa humo
  rationale: ישב inaweza kumaanisha kukaa, kuishi, au kufanya makao. ‘Kukaa humo’ huhifadhi upana huo wa maana; uwezekano wa ‘kufanya makao’ umetajwa katika tanbihi.
