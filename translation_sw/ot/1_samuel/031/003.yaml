  text: And the battle grew heavy against Saul[a], and the archers found him[b], and he was greatly wounded by the archers.
translation:
  language: sw
  text: Mapigano yakazidi kuwa makali dhidi ya Sauli, nao wapiga mishale[a] wakampata. Akapatwa na uchungu mwingi sana kwa sababu ya wapiga mishale.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno: “wapigaji, watu wenye upinde.”'
    reason: previous_rendering
  - marker: b
    text: Au “Alijeruhiwa vibaya sana na wapiga mishale.” Kitenzi cha Kiebrania hapa ni kigumu; kinaweza kumaanisha maumivu makali, kutetemeka, au dhiki kubwa badala ya kutaja wazi jeraha la mwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד הַמִּלְחָמָה אֶל שָׁאוּל
  choice: Mapigano yakazidi kuwa makali dhidi ya Sauli
  rationale: Kitenzi kinamaanisha kihalisi kuwa kizito; katika muktadha wa vita kinaonyesha mapigano kuongezeka kwa ukali na kumwelemea Sauli. Tafsiri hii ni ya kawaida katika Kiswahili huku ikihifadhi wazo la shinikizo kali dhidi yake.
- source_word: וַיִּמְצָאֻהוּ
  choice: w wakampata
  rationale: Kitenzi kinamaanisha ‘walimpata/walimwona.’ ‘Wakampata’ ni cha asili katika simulizi la vita na kinaweza kumaanisha kwamba walimfikia kama shabaha bila kuongeza kwamba tayari walimpiga.
- source_word: הַמּוֹרִים אֲנָשִׁים בַּקָּשֶׁת
  choice: wapiga mishale
  rationale: Kauli ya Kiebrania ni ‘wapigaji, watu wenye upinde.’ ‘Wapiga mishale’ huwasilisha maana yote kwa Kiswahili cha kawaida bila urudiaji usio wa lazima; muundo halisi umeonyeshwa katika tanbihi.
- source_word: וַיָּחֶל מְאֹד מֵהַמּוֹרִים
  choice: Akapatwa na uchungu mwingi sana kwa sababu ya wapiga mishale
  rationale: Kitenzi hiki kigumu kinaweza kueleza kuumia, kutetemeka, au kuwa katika dhiki/uchungu mkali. ‘Akapatwa na uchungu mwingi sana’ hudumisha upana huo kuliko kuamua kimya kimya kuwa jeraha la mwili tu, na ‘kwa sababu ya’ huonyesha chanzo cha hali yake.
theological_decisions:
- issue: Ikiwa hali ya Sauli ilikuwa jeraha la mwili au dhiki/uchungu mkali
  choice: Akapatwa na uchungu mwingi sana
  alternative: Alijeruhiwa vibaya sana
  rationale: Kiebrania hapa hakisemi kwa uwazi namna ileile kama 1 Mambo ya Nyakati 10:3 kwamba Sauli alijeruhiwa. Tafsiri kuu inadumisha utata wa neno, huku uwezekano wa jeraha la mwili ukitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi la heshima lakini kinachoeleweka kwa urahisi. ‘Mapigano yakazidi kuwa makali’ na ‘wakampata’ ni misemo ya kawaida; tanbihi zinahifadhi ukamilifu wa muundo wa Kiebrania na utata wa kitenzi cha mwisho.
