  source_fidelity: 'Tafsiri inafuata Kiebrania kwa uaminifu: kichwa kinakatwa, vifaa vya Saul vinaondolewa, wajumbe wanatumwa kote katika nchi ya Wafilisti, na habari ya ushindi inatangazwa kwenye mahali pa ibada ya sanamu zao na kwa watu. Nyongeza ya “wajumbe” ni ya kiasili na inaungwa mkono na muktadha.'
