  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יִּכְרְתוּ֙ אֶת רֹאשׁ֔/וֹ וַ/יַּפְשִׁ֖יטוּ אֶת כֵּלָ֑י/ו וַ/יְשַׁלְּח֨וּ בְ/אֶֽרֶץ פְּלִשְׁתִּ֜ים סָבִ֗יב לְ/בַשֵּׂ֛ר בֵּ֥ית עֲצַבֵּי/הֶ֖ם וְ/אֶת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/009.yaml
  text: They cut off his head and stripped off his armor[a], and sent messengers throughout the land of the Philistines all around[b], to proclaim the good news to the house of their idols and to the people.
translation:
  language: sw
  text: Walilikata kichwa chake na kumvua silaha zake[a]. Kisha wakatuma wajumbe kote katika nchi ya Wafilisti ili kutangaza habari njema katika hekalu la sanamu zao[b] na kwa watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, vifaa vyake vya vita.
    reason: Neno la Kiebrania linaweza kumaanisha silaha, mavazi ya vita, au vifaa kwa upana zaidi.
  - marker: b
    text: Kwa neno halisi, nyumba ya sanamu zao.
    reason: בֵּית humaanisha ‘nyumba’ na pia hutumiwa kwa hekalu au mahali pa ibada.
lexical_decisions:
- source_word: וַיִּכְרְתוּ אֶת־רֹאשׁוֹ
  choice: Walilikata kichwa chake
  rationale: Kitenzi pamoja na yambwa ‘kichwa chake’ humaanisha kukikata na kukitenga; kiambishi cha ngeli katika ‘walilikata’ kinarejelea ‘kichwa.’
- source_word: וַיַּפְשִׁיטוּ אֶת־כֵּלָיו
  choice: kumvua silaha zake
  rationale: וַיַּפְשִׁיטוּ hueleza kumvua mtu alichovaa au kubeba, na כֵּלָיו inaweza kuwa silaha, mavazi ya vita, au vifaa. ‘Kumvua silaha zake’ ni Kiswahili cha kawaida katika muktadha wa vita, huku tanbihi ikihifadhi upana wa neno hilo.
- source_word: וַיְשַׁלְּחוּ
  choice: wakatuma wajumbe
  rationale: Kiebrania kinasema tu ‘wakatuma’ bila kutaja yambwa. Muktadha wa kutangaza habari kote unaashiria watu waliotumwa; ‘wajumbe’ huifanya sentensi iwe ya asili katika Kiswahili bila kubadili tendo lililokusudiwa.
- source_word: בְאֶרֶץ פְּלִשְׁתִּים סָבִיב
  choice: kote katika nchi ya Wafilisti
  rationale: ‘Kote’ linaonyesha nguvu ya סָבִיב, yaani habari kusambazwa sehemu mbalimbali za eneo la Wafilisti.
- source_word: לְבַשֵּׂר
  choice: ili kutangaza habari njema
  rationale: Kitenzi hiki humaanisha kuleta au kutangaza habari njema; hapa ni habari ya ushindi kwa mtazamo wa Wafilisti, si tathmini ya kimaadili ya msimulizi.
- source_word: בֵּית עֲצַבֵּיהֶם
  choice: katika hekalu la sanamu zao
  rationale: בֵּית ni ‘nyumba’ lakini katika mazingira ya ibada inaweza kumaanisha hekalu; עֲצַבִּים ni sanamu za kuabudiwa. ‘Hekalu la sanamu zao’ ni la asili na wazi, huku tanbihi ikihifadhi tafsiri ya moja kwa moja.
- source_word: וְאֶת־הָעָם
  choice: na kwa watu
  rationale: Alama ya yambwa inaonyesha kuwa watu pia ndio waliopashwa habari. ‘Kwa watu’ hutoa maana hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Jina la mahali na vitu vya ibada vya Wafilisti
  choice: hekalu la sanamu zao
  alternative: nyumba ya sanamu zao
  rationale: Tafsiri hii inaeleza mazingira ya ibada bila kudai kuwa miungu hiyo ilikuwa halisi. ‘Sanamu’ linadumisha mtazamo wa neno la Kiebrania, na ‘nyumba’ imehifadhiwa katika tanbihi kama tafsiri ya karibu zaidi.
- issue: Maana ya ‘habari njema’ katika ushindi wa Wafilisti
  choice: habari njema
  alternative: habari
  rationale: לְבַשֵּׂר hubeba wazo la habari njema au ya kufurahisha. Hapa furaha hiyo ni ya Wafilisti; tafsiri haiungi mkono kimaadili kitendo chao bali inadumisha mtazamo wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa wasomaji wa kawaida; urudiaji usio wa lazima umeepukwa, na utata wa maneno כֵּלָיו na בֵּית umehifadhiwa kwa tanbihi.
