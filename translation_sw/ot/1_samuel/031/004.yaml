  text: וַ/יֹּ֣אמֶר שָׁאוּל֩ לְ/נֹשֵׂ֨א כֵלָ֜י/ו שְׁלֹ֥ף חַרְבְּ/ךָ֣ וְ/דָקְרֵ֣/נִי בָ֗/הּ פֶּן יָ֠בוֹאוּ הָ/עֲרֵלִ֨ים הָ/אֵ֤לֶּה וּ/דְקָרֻ֨/נִי֙ וְ/הִתְעַלְּלוּ בִ֔/י וְ/לֹ֤א אָבָה֙ נֹשֵׂ֣א כֵלָ֔י/ו כִּ֥י יָרֵ֖א מְאֹ֑ד וַ/יִּקַּ֤ח שָׁאוּל֙ אֶת הַ/חֶ֔רֶב וַ/יִּפֹּ֖ל עָלֶֽי/הָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and thrust me through and mistreat me.” But his armor-bearer was not willing, because he was very afraid. So Saul took the sword and fell on it.
translation:
  language: sw
  text: Ndipo Sauli akamwambia mchukua-silaha wake, “Futa upanga wako, unichome nao, hawa wasiotahiriwa wasije wakaja kunichoma na kunitendea vibaya[a].” Lakini mchukua-silaha wake hakutaka, kwa sababu aliogopa sana. Basi Sauli akauchukua upanga, akauangukia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kunidhihaki,” “kunidhalilisha,” au “kunifanyia fedheha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: mchukua-silaha wake
  rationale: Kirai hiki humaanisha msaidizi wa kijeshi aliyembebea shujaa au mfalme silaha na vifaa vyake. “Mchukua-silaha” ni kifupi, cha kawaida katika Kiswahili cha Biblia, na kinaonyesha cheo hicho bila tafsiri ndefu ya kimaelezo.
- source_word: שְׁלֹף
  choice: Futa
  rationale: Kitenzi kinaagiza upanga utolewe alani. “Futa upanga” ni usemi wa Kiswahili unaofaa katika muktadha wa kijeshi.
- source_word: וְדָקְרֵנִי בָהּ / וּדְקָרֻנִי
  choice: unichome nao / wakanichoma
  rationale: דקר humaanisha kutoboa au kuchoma kwa silaha. Kurudia “choma” kunahifadhi urudiaji wa kitenzi katika maneno ya Sauli; “nao” inarejelea upanga kwa upatanisho wa kisarufi.
- source_word: פֶּן
  choice: wasije ... wakaja
  rationale: Muundo huu wa Kiswahili unaonyesha matokeo yanayoogopwa na Sauli, sawa na tahadhari ya Kiebrania, huku ukisomeka kwa kawaida.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: hawa wasiotahiriwa
  rationale: Huhifadhi kwa karibu jina la dharau lenye msingi wa agano katika Kiebrania badala ya kulibadili kuwa “Wafilisti,” ingawa hao ndio wanaorejelewa katika muktadha.
- source_word: וְהִתְעַלְּלוּ בִי
  choice: kunifanyia fedheha
  rationale: Katika muktadha huu kitenzi kinaonyesha kutendewa kwa namna ya kudhalilisha au ya kikatili. “Kunifanyia fedheha” huhifadhi wazo la kudhalilishwa bila kutaja kwa uhakika kama ni dhihaka, mateso, au namna nyingine ya unyanyasaji.
- source_word: וְלֹא אָבָה
  choice: hakutaka
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kutokuwa tayari au kukataa kufanya jambo.
- source_word: כִּי יָרֵא מְאֹד
  choice: kwa sababu aliogopa sana
  rationale: Hutoa sababu ya kukataa kwake na kuhifadhi kisisitizo cha מְאֹד, “sana.”
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: akauangukia
  rationale: Hufuata kwa karibu usemi wa Kiebrania “akaanguka juu yake,” huku kiambishi “u” kikirejelea upanga kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kutobainisha kupita kiasi aina ya kitendo ambacho Sauli aliogopa kufanyiwa
  choice: kunifanyia fedheha
  alternative: kunidhihaki; kunitesa; kunitendea vibaya
  rationale: Kitenzi cha Kiebrania kinaweza kuhusisha kutendewa kwa ukatili, dhihaka, au udhalilishaji, lakini mstari hautaji namna kamili. Tafsiri inadumisha uzito na utata huo bila kuingiza tukio maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa leo. Muundo wa mazungumzo ni wa kawaida, na urudiaji wa “choma” umehifadhiwa ili kuakisi Kiebrania.
