base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/010.yaml
  text: They put his armor in the house of the Ashtaroths[c][b][a], and they fastened his body to the wall of Beth-shan.
translation:
  language: sw
  text: Wakaweka vifaa vyake vya vita[a] katika nyumba ya Ashtarothi[b], nao wakauambatisha mwili wake kwenye ukuta wa Beth-shani.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “silaha zake,” “zana zake za vita,” au kwa upana zaidi “vifaa vyake”; neno la Kiebrania linaweza kutaja vifaa mbalimbali vya kijeshi.
    reason: lexical_alternative
  - marker: b
    text: Au “hekalu la Ashtarothi.” Kihalisi, “nyumba ya Ashtarothi”; katika muktadha huu “nyumba” inaweza kumaanisha hekalu au mahali pa ibada.
    reason: lexical_alternative
  - marker: c
    text: Au “wakaukita mwili wake ukutani.” Kitenzi cha Kiebrania kinaweza kumaanisha kukita, kuchomeka, au kuambatisha kwa uthabiti; namna kamili ya kuuweka mwili huo wazi haijabainishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: Wakaweka
  rationale: Kitenzi שׂוּם hapa humaanisha kuweka au kupeleka kitu mahali fulani; “wakaweka” ni simulizi la kawaida na la moja kwa moja.
- source_word: כֵּלָיו
  choice: vifaa vyake vya vita
  rationale: כְּלִי lina maana pana ya vyombo, zana, silaha au vifaa. Katika muktadha huu ni vifaa vya kijeshi vya Sauli; tafsiri hii huhifadhi upana huo kuliko “silaha” peke yake.
- source_word: בֵּית עַשְׁתָּרוֹת
  choice: hekalu la Maashtarothi
  rationale: Ingawa בֵּית kwa kawaida ni “nyumba,” katika muktadha wa ibada inamaanisha hekalu au mahali patakatifu. “Maashtarothi” hudumisha umbo la wingi la jina la Kiebrania.
- source_word: גְּוִיָּתוֹ
  choice: mwili wake
  rationale: Neno hilo humaanisha mwili, na hapa ni wazi kutokana na muktadha kwamba ni mwili wa mtu aliyekufa. “Mwili wake” ni ya kawaida na yenye heshima bila kupunguza maana.
- source_word: תָּקְעוּ
  choice: wakaufunga
  rationale: תקע linaweza kumaanisha kukita, kuchomeka au kufunga kwa uthabiti. “Wakaufunga” huonyesha kwamba mwili uliambatishwa ukutani bila kuamua kwa uhakika namna ambayo maandishi hayajaibainisha.
- source_word: בְּחוֹמַת
  choice: kwenye ukuta wa
  rationale: Kwa kuambatana na תקע, kihusishi ב kinaonyesha mahali mwili ulipofungwa; “kwenye ukuta wa” ni Kiswahili cha kawaida.
- source_word: בֵּית שָׁן
  choice: Beth-shani
  rationale: Jina la mahali limetoholewa kwa namna inayosomeka kwa Kiswahili huku likibaki karibu na umbo la Kiebrania.
theological_decisions:
- issue: Utambulisho na idadi ya Maashtarothi
  choice: Maashtarothi
  alternative: Ashtarothi
  rationale: Umbo la Kiebrania עַשְׁתָּרוֹת ni la wingi; tafsiri hailazimishi ikiwa linarejelea miungu mingi, maumbo mengi ya mungu huyo, au matumizi ya jina la ibada.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye hadhi. “Vifaa vya vita” hueleweka kwa msomaji wa kawaida na huhifadhi upana wa neno la Kiebrania; tanbihi zinaweka wazi tafsiri nyingine zinazowezekana bila kuamua zaidi ya ushahidi wa maandishi.
