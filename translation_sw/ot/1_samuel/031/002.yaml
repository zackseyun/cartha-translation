  yaml_path: translation/ot/1_samuel/031/002.yaml
  text: The Philistines overtook Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua[b], the sons of Saul.
translation:
  language: sw
  text: Wafilisti wakawafikia Sauli na wanawe[a], wakawapiga Yonathani, Abinadabu na Malki-shua[b], wana wa Sauli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliwapata Sauli na wanawe,” au, “waliwafuatilia Sauli na wanawe kwa karibu.” Kitenzi cha Kiebrania kinaonyesha kufuatilia kwa karibu hadi kuwafikia walengwa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi ni “wakawapiga Yonathani, Abinadabu na Malki-shua”; katika muktadha huu wa vita, huenda tendo hilo lilisababisha vifo vyao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ
  choice: wakawafikia
  rationale: Kitenzi דבק hapa kinaonyesha kuwafuatilia kwa karibu hadi kuwafikia. “Wakawafikia” ni Kiswahili cha kawaida kinachoeleza kwamba harakati hiyo ilifikia walengwa bila kutumia maana ya msingi ya “kushikamana,” ambayo haifai katika muktadha huu.
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la watu hawa katika Kiswahili cha Biblia.
- source_word: אֶת שָׁאוּל וְאֶת בָּנָיו
  choice: Sauli na wanawe
  rationale: בָּנָיו humaanisha wana wake wa kiume hapa, kama majina yanayofuata yanavyothibitisha. “Wanawe” ni usemi wa kawaida na wenye hadhi.
- source_word: וַיַּכּוּ
  choice: wakawapiga na kuwaua
  rationale: נכה kimsingi ni “kupiga,” lakini katika simulizi hili la vita tendo hilo linaishia katika kifo cha wana waliotajwa. Usemi huu unahifadhi tendo la kupiga na pia unaweka wazi matokeo yanayodokezwa na muktadha.
- source_word: יְהוֹנָתָן
  choice: Yonathani
  rationale: Umbo la jina linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: אֲבִינָדָב
  choice: Abinadabu
  rationale: Umbo la jina lililozoeleka katika Kiswahili cha Biblia, likifuata mfumo wa sauti wa Kiswahili.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malki-shua
  rationale: Unukuzi unaokaribia jina la Kiebrania; kistari kinaonyesha muundo wake wa vipashio viwili.
- source_word: בְּנֵי שָׁאוּל
  choice: wana wa Sauli
  rationale: Kirai hiki cha ufafanuzi kinawatambulisha wanaume watatu waliotajwa na kuhifadhi msisitizo wa muundo wa Kiebrania.
