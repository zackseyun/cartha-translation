base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/012.yaml
  text: Then all the valiant men arose and went all night[a], and they took the body of Saul and the bodies of his sons from the wall of Beth-shan[b], and they came to Jabesh and burned them there.
translation:
  language: sw
  text: Ndipo wanaume wote mashujaa wakainuka, wakasafiri usiku kucha. Wakauchukua mwili wa Sauli na miili ya wanawe[a] kutoka kwenye ukuta wa Beth-shani, wakaenda Yabeshi[b], wakazichoma miili hiyo huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maiti ya Sauli na maiti za wanawe.” Neno la Kiebrania linamaanisha hasa miili ya watu waliokufa.
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha mpana, Yabeshi hapa ni Yabeshi-gileadi.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: wanaume wote mashujaa
  rationale: Nahau hii inamaanisha wanaume shujaa au hodari katika mazingira ya kijeshi. Tafsiri hii ni ya kawaida kwa Kiswahili na inadumisha rejeo la kiume la Kiebrania.
- source_word: וַיָּק֜וּמוּ
  choice: wakainuka
  rationale: Kitenzi hiki kwa msingi kinamaanisha kuinuka; hapa pia kinaanzisha hatua iliyofuata katika simulizi.
- source_word: וַיֵּלְכ֣וּ כָל הַלַּיְלָה
  choice: wakasafiri usiku kucha
  rationale: Kirai kinaonyesha mwendo ulioendelea usiku wote bila kubainisha namna ya usafiri.
- source_word: גְּוִיַּת ... גְּוִיֹּת
  choice: mwili ... miili
  rationale: Neno la Kiebrania linarejelea hasa mwili wa mtu aliyekufa. 'Mwili/miili' ni lugha ya kawaida na yenye heshima; maana mahususi imeelezwa katika tanbihi.
- source_word: מֵחוֹמַת
  choice: kutoka kwenye ukuta
  rationale: Hii inawakilisha moja kwa moja maana ya kuondoa miili kutoka kwenye ukuta, bila kuongeza maelezo yasiyokuwamo katika maandishi.
- source_word: בֵּית שָׁן
  choice: Beth-shani
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: יָבֵשָׁה
  choice: wakaenda Yabeshi
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha kwenda Yabeshi. Maandishi yenyewe yanataja tu Yabeshi, si jina kamili Yabeshi-gileadi.
- source_word: וַיִּשְׂרְפוּ אֹתָם שָׁם
  choice: wakaichoma miili hiyo huko
  rationale: Kitenzi kinamaanisha kuchoma. Kurudia 'miili hiyo' kunaweka wazi rejeo la kiwakilishi cha Kiebrania kwa Kiswahili cha kawaida bila kutumia neno la kitaalamu kama 'kuteketeza maiti kwa moto.'
theological_decisions:
- issue: Usemi wa kiume unaowataja waliokwenda kuichukua miili
  choice: wanaume wote mashujaa
  alternative: mashujaa wote
  rationale: Kiebrania kinatumia maumbo ya kiume katika mazingira ya kijeshi. Kutaja 'wanaume' kunahifadhi ubainifu huo badala ya kuufanya usemi usioonyesha jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa urahisi. Sentensi ndefu ya Kiebrania imegawanywa baada ya ‘usiku kucha’ ili simulizi lisomeke kwa urahisi. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
