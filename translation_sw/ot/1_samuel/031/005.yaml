translation:
  language: sw
  text: Mbeba silaha wake alipoona kwamba Sauli alikuwa amekufa[a], yeye pia akaangukia upanga wake, akafa pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Sauli alikuwa mfu.” Kiebrania kinaweza kumaanisha hali ya Sauli kuwa mfu au kifo chake kuwa tukio lililokuwa tayari limetokea kabla ya mbeba silaha kutenda.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: Mbeba silaha wake
  rationale: Kirai hiki humaanisha mtu aliyebeba vifaa au silaha za Sauli. “Mbeba silaha” ni jina la kawaida na linaloeleweka kwa jukumu hilo la kijeshi.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linatanguliza maudhui ya kile mbeba silaha alichoona, si sababu ya tendo lake.
- source_word: מֵת
  choice: alikuwa amekufa
  rationale: Huwasilisha hali ya Sauli kuwa tayari amekufa wakati mbeba silaha alipomwona, huku uwezekano wa kulitazama kama tukio lililokamilika ukibainishwa katika tanbihi.
- source_word: גַּם הוּא
  choice: yeye pia
  rationale: 'Huhifadhi msisitizo wa nyongeza: mbeba silaha alifanya jambo linalolingana na tendo la Sauli.'
- source_word: עַל חַרְבּוֹ
  choice: akaangukia upanga wake
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kujiangusha juu ya upanga wake.
- source_word: וַיָּמָת עִמּוֹ
  choice: akafa pamoja naye
  rationale: “Pamoja naye” huonyesha kushiriki kifo katika tukio hilo bila kuongeza wazo la mahali ambalo halipo wazi katika Kiebrania.
- source_word: וַיַּרְא
  choice: alipoona
  rationale: Muundo huu huunganisha kwa kawaida kuona kwa mbeba silaha na tendo lililofuata, huku ukihifadhi mtiririko wa wakati katika simulizi.
