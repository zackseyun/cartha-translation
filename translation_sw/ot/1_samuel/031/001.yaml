base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/001.yaml
  text: The Philistines were fighting against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: sw
  text: Wafilisti walikuwa wakipigana na Israeli, nao wanaume wa Israeli wakakimbia Wafilisti[a] na wakaanguka wameuawa kwenye Mlima Gilboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno zaidi, “wakakimbia kutoka mbele ya Wafilisti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Kiunganishi ו kinaendeleza simulizi, lakini si lazima kitafsiriwe kwa neno la mwanzo katika Kiswahili; “Wafilisti” ni jina la kawaida la kundi hili.
- source_word: נִלְחָמִים בְּ/יִשְׂרָאֵל
  choice: walikuwa wakipigana na Israeli
  rationale: Umbo la kushiriki linaonyesha tendo lililokuwa likiendelea; “walikuwa wakipigana” hulihifadhi. Katika Kiswahili, “kupigana na” huonyesha kwa kawaida upande unaopingwa.
- source_word: וַ/יָּנֻסוּ
  choice: wakawakimbia
  rationale: Katika mazingira ya vita, kitenzi hiki kina maana ya kukimbia kwa hofu au baada ya kushindwa; muundo huu unaonyesha wazi kwamba Wafilisti ndio waliokimbiwa.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: wanaume wa Israeli
  rationale: Huhifadhi kwa uwazi umbo la kiume la neno la Kiebrania bila kuongeza kwamba walikuwa wanajeshi, jambo ambalo halijasemwa moja kwa moja.
- source_word: מִ/פְּנֵי פְלִשְׁתִּים
  choice: wakawakimbia Wafilisti[a]
  rationale: Hii ni tafsiri ya kawaida na ya wazi ya hali ya kujiondoa mbele ya adui; tanbihi inahifadhi taswira halisi ya “kutoka mbele ya.”
- source_word: וַ/יִּפְּלוּ חֲלָלִים
  choice: wakaanguka wakiwa wameuawa
  rationale: Huhifadhi picha ya kuanguka vitani na pia hali yao kama waliouawa, badala ya kutumia tu neno la jumla “wakafa.”
- source_word: בְּ/הַר הַ/גִּלְבֹּעַ
  choice: kwenye Mlima Gilboa
  rationale: “Mlima Gilboa” ni namna ya kawaida ya kutaja mahali hapa, na “kwenye” huonyesha eneo walikoanguka.
