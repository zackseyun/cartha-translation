base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/006.yaml
  text: So Saul died[a], and his three sons, and his armor-bearer, and all his men[b], together on that day.
translation:
  language: sw
  text: Basi Sauli, wanawe watatu, mchukua silaha wake, na watu wake wote[a][b] wakafa pamoja siku hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “askari wake wote.” Kiebrania kinasema “watu wake wote,” lakini katika muktadha huu wa vita huenda kinarejelea kikosi cha Sauli au wafuasi wake wa kijeshi, wala si kila mtu aliyekuwa na uhusiano naye.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya nakala za kale za Kigiriki zinasema “silaha zake zote” badala ya “watu wake wote.” Maandishi ya Kiebrania yanaunga mkono “watu wake wote.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: wakafa
  rationale: Kitenzi kinaendeleza simulizi. Muundo wa Kiswahili unaweka wahusika wote kuwa kiima cha pamoja, kwa hiyo wingi “wakafa” ni wa kawaida na unawasilisha maana kamili ya orodha ya Kiebrania.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: wanawe watatu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya namba pamoja na nomino yenye kiambishi cha umilikaji.
- source_word: וְנֹשֵׂא כֵלָיו
  choice: mchukua silaha wake
  rationale: Kirai cha Kiebrania humaanisha mtu anayebeba vifaa au silaha za mfalme; “mchukua silaha” ni istilahi wazi na iliyozoeleka katika muktadha wa kijeshi.
- source_word: גַּם כָּל אֲנָשָׁיו
  choice: na watu wake wote
  rationale: Katika muktadha huu אֲנָשָׁיו inaelekea kumaanisha watu wa Sauli waliokuwa katika jeshi au wafuasi wake wa kijeshi. “Watu wake” huhifadhi upana wa neno la Kiebrania bila kulifasiri moja kwa moja kuwa “askari.” Kiunganishi “na” kinatosha kuingiza sehemu ya mwisho ya orodha kwa Kiswahili cha kawaida.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Ni usemi wa kawaida na wazi wa wakati katika Kiswahili.
- source_word: יַחְדָּו
  choice: pamoja
  rationale: Huhifadhi maana ya kwamba wote waliokufa walikufa katika tukio na siku ileile.
