  source_fidelity: 'Tafsiri inawasilisha kwa uaminifu orodha ya Kiebrania: Sauli, wanawe watatu, mchukua silaha wake, na watu wake wote; pia inahifadhi kufa kwao pamoja siku hiyo. Kitenzi cha wingi “wakafa” ni mpangilio halali wa Kiswahili kwa kiima cha orodha nzima, bila kuongeza au kupunguza maana.'
