  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imepangwa upya kwa kawaida ya Kiswahili ili orodha yote iwe kiima cha “wakafa,” huku ikihifadhi wahusika wote, tukio la pamoja, na wakati uliotajwa katika Kiebrania.
