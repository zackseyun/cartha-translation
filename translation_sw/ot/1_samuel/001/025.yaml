  yaml_path: translation/ot/1_samuel/001/025.yaml
  text: Then they slaughtered the bull and brought the boy to Eli[a][b].
translation:
  language: sw
  text: Kisha wakamchinja fahali[a], wakampeleka yule mtoto[b] kwa Eli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamuua.” Kitenzi cha Kiebrania kinaweza kutafsiriwa kwa maana ya jumla zaidi, lakini “wakamchinja” kinaonyesha vizuri zaidi muktadha wa dhabihu.
    reason: lexical_alternative
  - marker: b
    text: Au, “yule mvulana.” Neno la Kiebrania naʿar linaweza kumaanisha mtoto, mvulana, au kijana kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: Kisha wakamchinja
  rationale: Kitenzi hiki kinaendeleza mfuatano wa simulizi. ‘Kumchinja’ kinafaa katika muktadha wa dhabihu kuliko ‘kumuua,’ huku ‘kisha’ kikionyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: הַפָּר
  choice: fahali
  rationale: פַּר humaanisha fahali, hasa katika mazingira ya dhabihu. Ingawa muktadha wa awali unaweza kufafanua umri wake, mstari huu wenyewe unasema tu ‘fahali.’
- source_word: וַיָּבִיאוּ
  choice: wakampeleka
  rationale: Kitenzi kinaendeleza mfuatano wa matendo. Kwa kuwa kinachopelekwa ni mtoto kwa mtu, ‘wakampeleka’ ni cha kawaida na sahihi zaidi kuliko ‘wakamleta’ bila kubadili mwelekeo unaoonyeshwa na אֶל.
- source_word: הַנַּעַר
  choice: yule mtoto
  rationale: נַעַר inaweza kumaanisha mtoto, mvulana, au kijana. Katika muktadha huu Samueli bado ni mdogo sana, hivyo ‘mtoto’ ni neno la asili zaidi; ‘yule’ pia huonyesha urejeleaji wa mtoto ambaye tayari ametajwa.
- source_word: אֶל עֵלִי
  choice: kwa Eli
  rationale: אֶל huonyesha mwendo kuelekea kwa mtu. ‘Kwa Eli’ ni usemi wa kawaida wa Kiswahili unaohifadhi maana hiyo.
theological_decisions:
- issue: Dokezo la dhabihu katika kuchinjwa kwa fahali
  choice: Kutumia ‘wakamchinja’ ili kudumisha mazingira ya dhabihu bila kuongeza maelezo yasiyomo katika Kiebrania.
  alternative: Kutumia neno la jumla zaidi, ‘wakamuua.’
  rationale: Muktadha wa karibu unahusu ibada na matoleo huko Shilo. ‘Kumchinja’ huhifadhi dokezo hilo la dhabihu na pia hutafsiri moja kwa moja kitenzi cha Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na heshima inayofaa simulizi la Biblia. Muundo wa vitenzi mfululizo (‘wakamchinja … wakampeleka’) unaakisi mwendelezo wa simulizi la Kiebrania kwa namna ya asili katika Kiswahili.
