base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/023.yaml
  text: And Elqanah her husband said to her[a], “Do what seems good in your eyes. Stay until you have weaned him; only may Yahweh establish his word.” So the woman stayed and nursed her son until she had weaned him.
translation:
  language: sw
  text: Naye Elkana, mume wake, akamwambia, “Fanya unaloona kuwa jema. Kaa mpaka utakapomwachisha kunyonya; ila Yahwe athibitishe neno lake[a].” Basi huyo mwanamke akakaa, akamnyonyesha mwanawe mpaka alipomwachisha kunyonya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “athibitishe” inaweza kumaanisha “atimize” au “atekeleze neno lake.” Kiebrania kinaweza kurejelea ahadi ya Yahwe au jambo lililosemwa katika muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישָׁהּ
  choice: mume wake
  rationale: Katika muktadha huu אִישׁ pamoja na kiambishi cha umilikaji inaonyesha uhusiano wa ndoa wa Elkana na Hana; “mume wake” ni Kiswahili cha kawaida na sahihi.
- source_word: עֲשִׂי הַטּוֹב בְּעֵינַיִךְ
  choice: Fanya unaloona kuwa jema
  rationale: Kauli hii inaeleza jambo ambalo mtu analiona kuwa linafaa. Tafsiri hii ni ya asili katika Kiswahili na bado inadumisha wazo la uamuzi wa Hana mwenyewe.
- source_word: שְׁבִי
  choice: Kaa
  rationale: Kitenzi hapa kina maana ya kubaki alipo, si kuketi tu. “Kaa” kwa muktadha huu ni usemi wa kawaida wa Kiswahili wenye maana ya kubaki.
- source_word: עַד גָּמְלֵךְ אֹתוֹ / עַד גָּמְלָהּ אֹתוֹ
  choice: mpaka utakapomwachisha kunyonya / mpaka alipomwachisha kunyonya
  rationale: Katika muktadha wa kumlea mtoto, גמל ina maana dhahiri ya kumwachisha mtoto kunyonya.
- source_word: אַךְ
  choice: ila
  rationale: Neno hili linaweka sharti au tahadhari baada ya ruhusa iliyotolewa; “ila” linaonyesha kazi hiyo ya kisemantiki kwa Kiswahili cha kawaida.
- source_word: יָקֵם
  choice: na alithibitishe
  rationale: 'Muundo huu una nguvu ya ombi au tamanio: “na ... alithibitishe.” “Thibitisha” huonyesha kusimamisha au kuhakikisha neno bila kuamua kimya kimya kama maana ni kulitimiza au kulihakikisha.'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limewasilishwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa na cheo.
- source_word: דְּבָרוֹ
  choice: neno lake
  rationale: דבר inaweza kumaanisha neno, jambo, au ahadi. “Neno lake” ni ya moja kwa moja na inadumisha utata wa rejeo lake.
- source_word: וַתֵּינֶק
  choice: akamnyonyesha
  rationale: Kitenzi hiki kinaonyesha mama kumpa mtoto maziwa ya matiti; “akamnyonyesha” ni wazi, cha kawaida, na cha heshima.
- source_word: הָאִשָּׁה
  choice: huyo mwanamke
  rationale: Kiebrania kinatumia nomino yenye kibainishi, si jina Hana. “Huyo mwanamke” hudumisha nomino hiyo huku ikirejelea kwa uwazi mwanamke aliyetajwa.
theological_decisions:
- issue: Rejeo na maana ya “neno lake” katika kauli ya Elkana
  choice: “neno lake” limeachwa bila kufafanuliwa zaidi
  alternative: “ahadi yake,” “neno kuhusu mtoto,” au neno/nadhiri ya Hana ambayo Yahwe ataithibitisha
  rationale: Kiebrania kinasema “neno lake,” na rejeo linaweza kuwa ahadi ya Yahwe au jambo lililosemwa katika muktadha. Tafsiri inadumisha utata huo wa kweli badala ya kuutatua kwa tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa masimulizi ya Biblia lakini unaeleweka kwa wasomaji wa kawaida. Alama ya tanbihi [a] inapaswa kuwekwa baada ya “neno lake” katika matini ya uchapishaji.
