base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/028.yaml
  text: So I also have given him to Yahweh[a]; all the days that he lives[b], he is given to Yahweh.” And he worshiped Yahweh there.
translation:
  language: sw
  text: “Nami pia nimemkabidhi[a] kwa Yahwe; siku zote atakazoishi, amekabidhiwa kwa Yahwe.” Kisha akamwabudu[b] Yahwe huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimemtoa kwa Yahwe” au “nimemweka wakfu kwa Yahwe.” Kiebrania kinatumia mzizi uleule uliotumiwa kuhusu “kuomba” mapema katika sura hii; kwa hiyo kuna mchezo wa maneno ambao hauhifadhiwi kikamilifu katika Kiswahili.
    reason: lexical_alternative
  - marker: b
    text: Au, “Kisha wakaabudu Yahwe huko.” Umbo la Kiebrania limeeleweka kwa njia tofauti katika mapokeo ya tafsiri.
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁאִלְתִּהוּ
  choice: nimemkabidhi
  rationale: Kitenzi cha Kiebrania kinatokana na mzizi שׁאל, uliotumiwa pia kuhusu kuomba. Katika muktadha huu kinaonyesha Hana kumtoa au kumweka Samweli mikononi mwa Yahwe kwa maisha yake yote. ‘Nimemkabidhi’ ni Kiswahili cha kawaida na chenye heshima, na kinaweza kurudiwa katika kauli tendwa.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Kihusishi kinaonyesha kwamba Samweli amekabidhiwa kwa Yahwe; jina la agano יהוה limetafsiriwa ‘Yahwe’.
- source_word: כָּל הַיָּמִים אֲשֶׁר הָיָה
  choice: siku zote atakazoishi
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza kipindi chote cha maisha.
- source_word: שָׁאוּל
  choice: atakuwa amekabidhiwa
  rationale: Neno hili linatokana na mzizi uleule wa הִשְׁאִלְתִּהוּ. Kurudia ‘kabidhi’ kunahifadhi marudio ya maana kwa kiasi, huku kukieleza hali ya Samweli kuwa wa Yahwe maisha yake yote.
- source_word: וַיִּשְׁתַּחוּ
  choice: akamwabudu
  rationale: Kitenzi kinaeleza kuinama katika ibada. ‘Akamwabudu’ huwasilisha maana ya tendo la kidini kwa Kiswahili cha kawaida, huku kiima kisichotajwa wazi kikibaki bila kufafanuliwa.
- source_word: שָׁם
  choice: huko
  rationale: Ni tafsiri ya kawaida ya kielezi cha mahali katika muktadha huu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina la agano יהוה moja kwa moja; ‘Yahwe’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Kiima cha וַיִּשְׁתַּחוּ
  choice: akamwabudu Yahwe huko
  alternative: wakaabudu Yahwe huko
  rationale: Umbo la Kim Masora linaeleweka vizuri kama umoja, lakini kiima chake hakitajwi wazi na mapokeo fulani ya tafsiri yamechukua maana ya wingi. Tofauti hiyo imehifadhiwa katika tanbihi.
- issue: Maana ya kumkabidhi Samweli kwa Yahwe
  choice: nimemkabidhi kwa Yahwe
  alternative: nimemtoa/nikamweka wakfu kwa Yahwe
  rationale: ‘Nimemkabidhi’ huonyesha kujitoa kwa kudumu bila kuongeza istilahi maalumu ya kimadhehebu, na tanbihi huhifadhi uhusiano wa neno hili na ombi la Hana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi; marudio ya ‘amekabidhiwa kwa Yahwe’ yamehifadhiwa kwa sababu maandishi ya Kiebrania yanarudia mzizi muhimu. Kiima cha tendo la mwisho hakikutajwa kwa jina ili kutohitimisha jambo ambalo maandishi yenyewe hayafafanui.
