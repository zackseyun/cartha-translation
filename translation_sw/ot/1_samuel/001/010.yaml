lexical_decisions:
- source_word: מָרַת נָפֶשׁ
  choice: alikuwa na uchungu mwingi moyoni
  rationale: Hii ni nahau inayomaanisha maumivu makali ya ndani. Tafsiri hii inadumisha taswira ya uchungu huku ikisikika kwa kawaida katika Kiswahili.
- source_word: וַתִּתְפַּלֵּל
  choice: akamwomba
  rationale: Kitenzi hapa humaanisha kusali au kumwomba Mungu. “Akamwomba” ni cha kawaida na kinaeleza wazi kuwa sala ilielekezwa kwa Yahwe bila kuongeza wazo la bidii ambalo halimo katika kitenzi chenyewe.
- source_word: עַל יְהוָה
  choice: Yahwe
  rationale: Ingawa עַל mara nyingi humaanisha “juu ya” au “kuhusu,” pamoja na kitenzi cha kusali hapa inaeleza yule anayeombwa. Kiswahili hakihitaji kihusishi baada ya “akamwomba.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama jina binafsi “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: וּבָכֹה תִבְכֶּה
  choice: na kulia sana
  rationale: Muundo wa kitenzi-jina halisi pamoja na kitenzi chenye ukomo unasisitiza tendo la kulia. “Kulia sana” huwasilisha msisitizo huo bila kuingiza tena neno “uchungu” ndani ya kitenzi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuleta fundisho la dhehebu fulani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Uchungu mwingi moyoni” ni wa kawaida zaidi kuliko tafsiri ya neno kwa neno “mchungu wa nafsi,” huku tanbihi ikihifadhi nahau ya Kiebrania. Muundo “akamwomba Yahwe na kulia sana” ni mfupi, wazi, na unadumisha ukali wa hisia za mstari.
