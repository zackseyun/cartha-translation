base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/013.yaml
  text: Hannah was speaking in her heart; only her lips were moving[a], but her voice was not heard. So Eli thought she was drunk.
translation:
  language: sw
  text: Hana alikuwa akisema moyoni mwake; midomo yake tu ndiyo iliyokuwa ikisogea[a], lakini sauti yake haikusikika. Kwa hiyo, Eli akadhani alikuwa amelewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa akisema kimoyomoyo” / “alikuwa akisali ndani ya moyo wake.” Kiebrania kwa uhalisi kinasema, “alikuwa akisema moyoni mwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְדַבֶּרֶת עַל לִבָּהּ
  choice: alikuwa akisema moyoni mwake
  rationale: Nahau ya Kiebrania kwa uhalisi inasema kwamba alikuwa akinena moyoni mwake. Tafsiri hii inahifadhi taswira ya Kiebrania na, katika muktadha, inaeleweka kuwa kusema kimoyomoyo bila kutoa sauti.
- source_word: רַק
  choice: tu ndiyo
  rationale: 'Neno hili huonyesha ukomo: ishara pekee iliyoonekana ilikuwa kusogea kwa midomo yake. Muundo “tu ndiyo” unaleta msisitizo huo kwa Kiswahili cha kawaida.'
- source_word: שְׂפָתֶיהָ נָּעוֹת
  choice: midomo yake ... ilikuwa ikisogea
  rationale: Kitenzi נוּעַ hapa kinaonyesha mwendo unaoonekana wa midomo, kinyume na sauti isiyosikika. Hali ya kuendelea inafaa participio ya Kiebrania.
- source_word: וְקוֹלָהּ לֹא יִשָּׁמֵעַ
  choice: lakini sauti yake haikusikika
  rationale: 'Niphal ya שׁמע ina maana ya kupokea tendo: sauti yake haikusikika. “Lakini” huonyesha kwa kawaida tofauti kati ya midomo inayosogea na kutosikika kwa sauti.'
- source_word: וַיַּחְשְׁבֶהָ
  choice: akadhani alikuwa
  rationale: חשב pamoja na kiambishi cha yambwa na kiarifu humaanisha kumwona au kumhesabu mtu kuwa katika hali fulani. “Akadhani alikuwa” ni wazi na ya kawaida.
- source_word: לְשִׁכֹּרָה
  choice: amelewa
  rationale: Kivumishi hiki humaanisha mlevi au aliyekuwa katika hali ya kulewa. Kiswahili cha kawaida hutumia “alikuwa amelewa” katika muundo huu.
- source_word: וְחַנָּה הִיא
  choice: Hana
  rationale: Kiwakilishi הִיא kinaweka Hana kama mada yenye msisitizo. Kiswahili kinaweza kuonyesha mada hiyo kwa kutaja jina moja kwa moja bila kuongeza kiunganishi cha wakati ambacho hakipo katika chanzo.
