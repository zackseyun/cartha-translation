base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/024.yaml
  text: When she had weaned him[a], she took him up with her, with three bulls, one ephah of flour, and a skin of wine, and brought him to the house of Yahweh at Shiloh. Now the boy was young.
translation:
  language: sw
  text: Baada ya kumwachisha kunyonya, akapanda naye, akiwa na mafahali watatu[a], efa moja ya unga na kiriba cha divai. Akamleta katika nyumba ya Yahweh huko Shilo. Naye mtoto huyo alikuwa bado mdogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mafahali watatu”; baadhi ya mashahidi wa kale na wafasiri husoma, “fahali mmoja wa miaka mitatu.”'
    reason: textual_variant
lexical_decisions:
- source_word: וַתַּעֲלֵהוּ עִמָּהּ
  choice: akamchukua pamoja naye
  rationale: Kitenzi עלה kina wazo la kupanda au kupeleka juu, hasa katika safari ya kwenda mahali patakatifu. Kiswahili cha kawaida hakihitaji kutaja mwelekeo huo wazi hapa; “akamchukua pamoja naye” kinahifadhi tendo na uandamani bila kuchanganywa na kitenzi kinachofuata cha kumleta.
- source_word: כַּאֲשֶׁר גְּמָלַתּוּ
  choice: baada ya kumwachisha kunyonya
  rationale: Katika muktadha huu גמל humaanisha kumwachisha mtoto kunyonya; kishazi hiki kinaonyesha kuwa tendo hilo lilikuwa limekamilika kabla ya safari.
- source_word: בְּפָרִים שְׁלֹשָׁה
  choice: akiwa na mafahali watatu[a]
  rationale: Maandishi ya Kimasoreti yanasema wazi “mafahali watatu.” Tofauti inayopatikana katika ushahidi fulani wa kale imewekwa katika tanbihi badala ya kubadili maandishi makuu.
- source_word: וְאֵיפָה אַחַת קֶמַח
  choice: efa moja ya unga
  rationale: אֵיפָה ni kipimo cha kale cha vitu vikavu; jina “efa” limehifadhiwa badala ya kukibadili kuwa makadirio ya kisasa. קֶמַח ni unga.
- source_word: וְנֵבֶל יַיִן
  choice: kiriba cha divai
  rationale: נֵבֶל hapa ni chombo cha kubebea divai, kinachoeleweka vizuri kama kiriba katika Kiswahili.
- source_word: וַתְּבִאֵהוּ
  choice: akamleta
  rationale: Hifili ya בוא humaanisha kuleta; hapa ndiyo kitenzi kikuu cha kufika mahali patakatifu.
- source_word: בֵית יְהוָה
  choice: nyumba ya Yahweh
  rationale: בֵית ni nyumba au mahali patakatifu, na jina la Mungu יהוה limetoholewa kuwa “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: שִׁלֹה
  choice: huko Shilo
  rationale: Jina la mahali limetoholewa kwa namna ya kawaida ya Kiswahili, na “huko” linaonyesha mahali nyumba ya Yahweh ilipokuwa.
- source_word: וְהַנַּעַר נָעַר
  choice: Naye mtoto huyo alikuwa bado mdogo
  rationale: Kurudiwa kwa נַעַר kunasisitiza udogo wa mtoto. Kiswahili cha asili kinawasilisha msisitizo huo kwa “bado mdogo” badala ya kurudia neno kwa namna isiyo ya kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu, יהוה. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Idadi na aina ya fahali katika sadaka
  choice: mafahali watatu
  alternative: fahali mmoja wa miaka mitatu
  rationale: Maandishi ya Kimasoreti yana wingi “mafahali watatu.” Usomaji mbadala wa kale ni muhimu lakini haupaswi kuchukua nafasi ya maandishi msingi; umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi zimegawanywa kwa mtiririko wa asili; vipimo na majina ya kale yamehifadhiwa kwa kutoholewa.
