base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/007.yaml
  text: 'And so it happened year after year: whenever she went up to the house of Yahweh[a], Peninnah would provoke her[b], and she would weep and not eat.'
translation:
  language: sw
  text: Ndivyo ilivyokuwa mwaka baada ya mwaka:[a] kila mara Hana alipopanda kwenda kwenye nyumba ya Yahwe,[b] Penina alimchokoza, na Hana akalia wala hakula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ndivyo alivyokuwa akifanya mwaka baada ya mwaka.” Kitenzi cha Kiebrania ni cha umoja wa kiume (“alikuwa akifanya”), na mara nyingi hueleweka kumhusu Elkana; lakini kishazi hicho pia kinaweza kutumiwa kwa maana ya kujumlisha hali iliyokuwa ikijirudia.
    reason: alternative_reading
  - marker: b
    text: Au, “katika nyumba ya Yahwe.” Kihusishi cha Kiebrania ni kihalisi “katika/kwenye,” ingawa pamoja na kitenzi cha mwendo “kwenye” huweza kuonyesha mahali anakoelekea mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן יַעֲשֶׂה
  choice: Ndivyo ilivyokuwa
  rationale: Kitenzi cha Kiebrania ni cha nafsi ya tatu, umoja, jinsia ya kiume, yaani kihalisi ‘alifanya hivyo’; hata hivyo, katika muktadha huu kishazi kinaweza kueleweka kama muhtasari wa hali iliyojirudia. Tafsiri hii ni ya kawaida kwa Kiswahili huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: שָׁנָה בְשָׁנָה
  choice: mwaka baada ya mwaka
  rationale: Usemi huu wa mgawanyo unaonyesha jambo lililojirudia kila mwaka.
- source_word: מִדֵּי עֲלֹתָהּ
  choice: kila Hana alipopanda kwenda
  rationale: מִדֵּי pamoja na jina-kitenzi huonyesha kila tukio lilipojirudia; kiambishi cha kike kinamrejelea Hana. ‘Kupanda kwenda’ pia hudumisha wazo la safari ya kwenda mahali pa ibada.
- source_word: בְּבֵית יְהוָה
  choice: kwenye nyumba ya Yahwe
  rationale: Ingawa בְּ kwa kawaida humaanisha ‘katika/kwenye,’ pamoja na kitenzi cha mwendo Kiswahili hutumia ‘kwenye’ kwa kawaida kuonyesha mahali anakoelekea mtu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa namna ya matamshi ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: תַּכְעִסֶנָּה
  choice: alimchokoza
  rationale: Hifili ya כעס hapa ni kumkasirisha au kumsumbua mtu kwa makusudi. ‘Alimchokoza’ huonyesha uhasama wa Penina na matokeo yake ya kihisia kwa Hana.
- source_word: וַתִּבְכֶּה וְלֹא תֹאכַל
  choice: naye akalia na hakula
  rationale: Maumbo haya yanaeleza matokeo yaliyojirudia ndani ya muhtasari wa kila mwaka. Kiswahili cha masimulizi kinaweza kutumia ‘akalia’ na ‘hakula’ huku muktadha ukibeba maana ya mazoea.
theological_decisions:
- issue: Kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia moja kwa moja Tetragramatoni, jina la agano la Mungu. ‘Yahwe’ huhifadhi jina hilo bila kuligeuza kuwa cheo.
- issue: Mtendaji wa יַעֲשֶׂה
  choice: 'Kishazi kisicho na mtendaji maalumu: ‘Ndivyo ilivyokuwa’'
  alternative: ‘Ndivyo alivyofanya’ akimrejelea Elkana
  rationale: Umbo la kitenzi ni la umoja wa kiume na linaweza kumrejelea Elkana, lakini pia kishazi kizima kinaweza kufanya kazi kama muhtasari wa hali iliyokuwa ikijirudia. Tafsiri kuu haifungi maana kwa mtendaji mmoja, na tanbihi inahifadhi usomaji wa Elkana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina yametolewa kama ‘Hana,’ ‘Penina,’ na ‘Yahwe.’ Muundo ‘mwaka baada ya mwaka’ unaweka wazi kurudiwa kwa tukio, huku tanbihi zikihifadhi utata halisi wa mtendaji wa kitenzi na kihusishi cha mahali.
