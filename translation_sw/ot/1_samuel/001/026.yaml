base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/026.yaml
  text: And she said[a], “Please, my lord, as surely as you live, my lord, I am the woman who stood here beside you, praying to Yahweh.
translation:
  language: sw
  text: Akasema, “Tafadhali, bwana wangu! Kama uishivyo[a], bwana wangu, mimi ndiye yule mwanamke aliyesimama hapa karibu nawe, nikimwomba Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa uhai wako,” au kwa tafsiri ya neno kwa neno zaidi, “kama nafsi yako iishivyo”; hii ni kauli ya kiapo inayoonyesha ombi la dhati.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: Tafadhali
  rationale: Katika usemi wa moja kwa moja, neno hili ni chembe ya kusihi kwa heshima; “Tafadhali” ni ya kawaida na inaendeleza unyenyekevu wa Hana.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Ni namna ya heshima ya kumwita Eli, si jina la Mungu. “Bwana wangu” inadumisha heshima na tofauti yake na jina Yahweh.
- source_word: חֵי נַפְשְׁךָ
  choice: Kama uishivyo
  rationale: Hii ni kauli ya kiapo inayothibitisha ukweli kwa kurejelea uhai wa anayeambiwa. Tafsiri hii ni ya asili katika Kiswahili huku tanbihi ikihifadhi maana halisi zaidi.
- source_word: הָאִשָּׁה
  choice: yule mwanamke
  rationale: Kibainishi kinamtambulisha Hana kuwa mwanamke maalumu ambaye Eli alikuwa amemwona hapo awali; “yule” huonyesha rejeo hilo kwa uwazi.
- source_word: הַנִּצֶּבֶת
  choice: aliyesimama
  rationale: Kauli ya kushiriki inaeleza hali yake mahali pale katika tukio la awali. “Aliyesimama” ni ya asili na inadumisha maana bila kuongezea maelezo.
- source_word: עִמְּכָה
  choice: karibu nawe
  rationale: Katika muktadha huu neno linaonyesha ukaribu wa mahali, si ushirika; “karibu nawe” linafaa kwa tukio la Hana kuwa karibu na Eli.
- source_word: בָּזֶה
  choice: hapa
  rationale: Muundo huu unaelekeza mahali ambapo tukio lilitokea; “hapa” ni tafsiri fupi na ya kawaida.
- source_word: לְהִתְפַּלֵּל
  choice: nikimwomba
  rationale: Kitenzi kinaonyesha shughuli ya kusali au kuomba kwa Mungu. Muundo wa “nikimwomba” unaunganisha tendo hilo kwa kawaida na utambulisho wa msemaji.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kuwa “Yahweh” badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina la Mungu moja kwa moja; “Yahweh” hulihifadhi kama jina binafsi badala ya kuliweka kama cheo.
- issue: Nguvu ya kauli חֵי נַפְשְׁךָ
  choice: Kama uishivyo
  alternative: Kwa uhai wako / Kama nafsi yako iishivyo
  rationale: Kauli hii imetafsiriwa kama kiapo cha kusisitiza ukweli, bila kuifanya kuwa tamko kuhusu muundo wa nafsi ya binadamu. Tanbihi inahifadhi umbo lake halisi zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mazungumzo yanaonyesha heshima ya Hana kwa Eli bila kutumia lugha ya kizamani kupita kiasi.
