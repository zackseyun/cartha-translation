  - marker: b
    text: Yaelekea maana yake ni kwamba sura yake haikuonyesha tena huzuni kama hapo awali.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  choice: na nipate
  rationale: Umbo hili katika kauli ya moja kwa moja linaeleza ombi au tumaini la heshima; “na nipate” ni usemi wa kawaida wa Kiswahili unaohifadhi hali hiyo.
- source_word: שִׁפְחָתְךָ
  choice: mimi mtumishi wako
  rationale: Neno la Kiebrania humtaja mtumishi wa kike na hapa ni namna ya Hana kujirejelea kwa unyenyekevu mbele ya Eli. Kiswahili “mtumishi wako” ni cha asili na jinsia ya msemaji inaeleweka katika muktadha.
- source_word: חֵן בְּעֵינֶיךָ
  choice: nipate kibali machoni pako
  rationale: Huhifadhi taswira ya nahau ya Kiebrania kuhusu kukubaliwa au kutazamwa kwa wema, huku ikieleweka katika Kiswahili cha sasa.
- source_word: לְדַרְכָּהּ
  choice: akaenda zake
  rationale: Hii ni nahau ya kuondoka na kuendelea na safari au shughuli zake; “akaenda zake” ni tafsiri ya asili ya Kiswahili.
- source_word: וַתֹּאכַל
  choice: akala
  rationale: Kitenzi kinasimulia hatua iliyofuata kwa urahisi; “akala” huhifadhi maana bila kuongeza kwamba alianza kula.
- source_word: וּפָנֶיהָ לֹא הָיוּ לָהּ עוֹד
  choice: uso wake haukuwa tena kama hapo awali
  rationale: Kiebrania ni kifupi na chenye sintaksia isiyo ya kawaida, kikidokeza mabadiliko ya sura au hali yake. Tafsiri hii huhifadhi kiasi cha kutotajwa wazi badala ya kuongeza moja kwa moja kwamba uso ulikuwa na huzuni.
