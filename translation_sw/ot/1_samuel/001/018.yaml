translation:
  language: sw
  text: Akasema[a], “Mjakazi wako na apate kibali machoni pako.” Kisha huyo mwanamke akaenda zake, akala, na uso wake haukuwa tena kama ulivyokuwa hapo awali.[b]
  philosophy: optimal-equivalence
  footnotes:
