translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa kawaida. Usemi “na nipate kibali machoni pako” umehifadhi nahau ya chanzo; kishazi cha mwisho kimeachwa kwa kiasi fulani katika hali yake ya kidokezo.
