lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ עֵלִי
  choice: Eli akamwambia
  rationale: Muundo wa kitenzi cha masimulizi umetafsiriwa kwa kiambishi cha mfululizo ‘aka-’; ‘akamwambia’ pia huwasilisha kwa kawaida maana ya ‘akamwambia yeye’ bila kurudia kiwakilishi.
- source_word: עַד מָתַי
  choice: mpaka lini
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaolingana moja kwa moja na swali la muda katika Kiebrania.
- source_word: תִּשְׁתַּכָּרִין
  choice: utaendelea kulewa
  rationale: Kauli hii inabeba shutuma ya Eli kuhusu hali au tendo linalodhaniwa kuendelea; ‘kulewa’ linaacha wazi kwa kadiri inayowezekana ikiwa ni kuingia katika ulevi au kuwa katika hali ya ulevi.
- source_word: הָסִירִי
  choice: Iondoe ... mbali
  rationale: Amri hii ina maana ya kuondoa kitu kutoka kwa mtu; ‘iondoe ... mbali’ ni ya asili katika Kiswahili cha sasa huku ikihifadhi nguvu ya amri.
- source_word: אֶת יֵינֵךְ
  choice: divai yako
  rationale: Huu ni uwasilishaji wa moja kwa moja wa nomino pamoja na kiambishi cha nafsi ya pili umoja wa kike.
- source_word: מֵעָלָיִךְ
  choice: mbali nawe
  rationale: Kiebrania ni kihalisi ‘kutoka juu yako’; ‘mbali nawe’ ni Kiswahili kinachoeleweka na bado kinadumisha picha ya kuiondoa divai kutoka kwa mtu bila kuamua kimya kimya ikiwa inamaanisha chombo cha divai au athari yake.
