base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/020.yaml
  text: And in due time Hannah conceived and bore a son[a], and she called his name Samuel, for she said[b], “I asked for him from Yahweh.”
translation:
  language: sw
  text: Ikawa, wakati ulipotimia, Hana akapata mimba na akazaa mwana[a]. Akamwita Samweli, kwa maana alisema, “Nilimwomba kutoka kwa Yahweh.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa tafsiri sisisi, “katika mizunguko ya siku” au “wakati wa kugeuka kwa siku”; ni nahau inayomaanisha wakati unaofaa ulipofika.
    reason: lexical_alternative
  - marker: b
    text: 'Jina “Samweli” linaelezwa hapa kwa mchezo wa maneno unaohusiana na kitenzi cha Kiebrania שׁאל (sha’al), “kuomba/kuuliza”: “Nilimwomba kutoka kwa Yahweh.” Asili kamili ya jina hilo inajadiliwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקֻפוֹת הַיָּמִים
  choice: wakati ulipotimia
  rationale: Kirai hiki kinamaanisha kufika kwa wakati unaofaa. Tafsiri hii ni ya kawaida katika Kiswahili na inaepuka tafsiri sisisi isiyoeleweka ya ‘mzunguko wa siku.’
- source_word: וַתַּהַר
  choice: akapata mimba
  rationale: Ni usemi wa kawaida na wazi wa Kiswahili kwa tendo la kutungwa kwa mimba katika simulizi.
- source_word: וַתֵּלֶד בֵּן
  choice: akazaa mwana
  rationale: Inawakilisha kwa usahihi kitenzi ילד pamoja na בן, kwa mtindo mfupi na wenye heshima.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: akamwita jina lake
  rationale: Inahifadhi kwa kiasi kikubwa muundo wa Kiebrania wa kumpa mtu jina, huku ikibaki kueleweka katika Kiswahili.
- source_word: שְׁמוּאֵל
  choice: Samweli
  rationale: Hili ndilo umbo la jina lililozoeleka katika Biblia za Kiswahili.
- source_word: כִּי מֵיְהוָה שְׁאִלְתִּיו
  choice: kwa maana alisema, “Nilimwomba Yahweh anipe mtoto huyu”
  rationale: Kitenzi שׁאל hapa kina maana ya kuomba kitu kutoka kwa mtu. Muundo huu unaweka wazi kwa Kiswahili kwamba Hana alimwomba Yahweh ampe mtoto huyo, bila kupoteza uhusiano na maelezo ya jina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano lililoandikwa kwa herufi nne za Kiebrania linatolewa kama jina binafsi ‘Yahweh,’ kulingana na utaratibu wa mradi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko linatumia moja kwa moja jina la Mungu la herufi nne. ‘Yahweh’ huhifadhi jina binafsi badala ya kulibadili kuwa cheo.
- issue: Maelezo ya jina Samweli kwa mchezo wa maneno
  choice: Kuhifadhi maana ya kuomba katika matini na kueleza mchezo wa maneno katika tanbihi
  alternative: Kulazimisha matini kuu itoe etimolojia sisisi ya jina Samweli
  rationale: Kiebrania kinahusianisha שְׁמוּאֵל na kitenzi שׁאל, ‘kuomba,’ ingawa asili kamili ya jina hilo inajadiliwa. Tanbihi huhifadhi uhusiano huo bila kudai etimolojia isiyo na uhakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa asili, wa sasa, wenye heshima, na unaoeleweka kwa wasomaji wa kawaida. ‘Mwana’ limetumiwa kwa sauti ya kibiblia iliyozoeleka bila kuwa ya kizamani kupita kiasi.
