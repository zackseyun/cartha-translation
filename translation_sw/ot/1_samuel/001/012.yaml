  text: Alipokuwa akiendelea kusali mbele ya Yahwe[a], Eli alikuwa akiangalia kinywa chake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Ikawa kwamba, alipoendelea kusali mbele ya Yahwe, Eli alikuwa akiangalia kinywa chake.”
    reason: Njia mbadala inaonyesha kwa wazi zaidi fomula ya kisimulizi וְהָיָה כִּי na maana ya kuendelea kusali katika הִרְבְּתָה לְהִתְפַּלֵּל.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Alipokuwa
  rationale: Muundo huu wa kisimulizi unaanzisha hali ya wakati ambamo tendo linalofuata lilifanyika. “Alipokuwa” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kutumia muundo mzito wa “ikawa kwamba”.
- source_word: הִרְבְּתָה לְהִתְפַּלֵּל
  choice: akiendelea kusali
  rationale: Kitenzi רבה katika Hiphil pamoja na kitenzi-jina kinaonyesha kuwa tendo la kusali liliendelea au lilidumu kwa muda; “akiendelea kusali” hutoa maana hiyo kwa lugha ya kawaida na yenye heshima.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Hii ni nahau inayoonyesha kusali katika uwepo wa Mungu. “Mbele za” ni usemi wa kawaida wa Kiswahili unaohifadhi taswira ya Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kulibadilisha kuwa cheo kama “BWANA.”
- source_word: שֹׁמֵר
  choice: alikuwa akiutazama
  rationale: Kivumishi-tendaji cha Qal kinaonyesha tendo lililokuwa likiendelea; usemi huu unaonyesha kwamba Eli alikuwa akichunguza mdomo wake wakati akisali.
- source_word: אֶת פִּיהָ
  choice: mdomo wake
  rationale: Neno פֶּה humaanisha kihalisi “mdomo.” Tafsiri hii inadumisha tofauti na “midomo,” ambayo inatajwa wazi katika mstari unaofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina hilo la agano bila kulibadilisha kuwa cheo, huku “Yehova” likiwa umbo jingine la kimapokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Muundo wa wakati ni wa kawaida, huku dokezo likihifadhi tafsiri iliyo rasmi zaidi na inayofuata muundo wa Kiebrania kwa karibu.
