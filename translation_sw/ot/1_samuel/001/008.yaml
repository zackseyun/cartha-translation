  text: וַ/יֹּ֨אמֶר לָ֜/הּ אֶלְקָנָ֣ה אִישָׁ֗/הּ חַנָּה֙ לָ֣/מֶה תִבְכִּ֗י וְ/לָ֨/מֶה֙ לֹ֣א תֹֽאכְלִ֔י וְ/לָ֖/מֶה יֵרַ֣ע לְבָבֵ֑/ךְ הֲ/ל֤וֹא אָֽנֹכִי֙ ט֣וֹב לָ֔/ךְ מֵ/עֲשָׂרָ֖ה בָּנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/008.yaml
  text: Then Elkanah her husband said to her[a], “Hannah, why are you weeping? And why do you not eat? And why is your heart troubled? Am I not better to you than ten sons?”
translation:
  language: sw
  text: Ndipo Elkana, mume wake, akamwambia, “Hana, kwa nini unalia? Na kwa nini huli? Na kwa nini moyo wako una huzuni?[a] Je, mimi si bora kwako kuliko wana kumi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa nini moyo wako umesikitika?” Kihalisi, “kwa nini moyo wako ni mbaya?”
    reason: Neno la Kiebrania limetumiwa kinahau kuhusu huzuni au dhiki ya ndani, ingawa maana yake ya moja kwa moja ni “kuwa mbaya.”
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Muundo wa simulizi wenye waw-consecutive unaendeleza tukio; “Ndipo” na kitenzi cha usimulizi huonyesha mfuatano kwa Kiswahili cha asili.
- source_word: אֶלְקָנָה אִישָׁהּ
  choice: Elkana, mume wake
  rationale: Hutambulisha wazi uhusiano wa Elkana na Hana huku ukisomeka kwa urahisi katika Kiswahili.
- source_word: לָמֶה
  choice: kwa nini
  rationale: Ni kiulizi cha moja kwa moja, na kurudiwa kwake mara tatu kumehifadhiwa kwa msisitizo wa usemi.
- source_word: תִבְכִּי
  choice: unalia
  rationale: Huonyesha kitendo cha Hana kinachoendelea wakati Elkana anapozungumza naye.
- source_word: לֹא תֹאכְלִי
  choice: huli
  rationale: Huwakilisha swali kuhusu kutokula kwake bila kuongeza maana ya kukataa kwa hiari.
- source_word: יֵרַע לְבָבֵךְ
  choice: moyo wako una huzuni
  rationale: Kihalisi ni moyo kuwa “mbaya,” lakini katika muktadha huu ni nahau ya huzuni au dhiki ya ndani; tafsiri hii huhifadhi taswira ya moyo.
- source_word: לְבָבֵךְ
  choice: moyo wako
  rationale: Taswira ya Kiebrania ya moyo kama kitovu cha hali ya ndani imehifadhiwa badala ya kubadilishwa kuwa “mawazo” au “nafsi.”
- source_word: הֲלוֹא
  choice: Je, mimi si
  rationale: Huhifadhi swali la balagha linalotarajia jibu la kukubali.
- source_word: טוֹב לָךְ
  choice: bora kwako
  rationale: Huonyesha ulinganisho wa thamani ya Elkana kwa Hana bila kuongeza ufafanuzi usio katika matini.
- source_word: מֵעֲשָׂרָה בָּנִים
  choice: kuliko wana kumi
  rationale: Huhifadhi idadi “kumi” na nomino mahususi ya kiume “wana,” bila kuibadili kuwa “watoto.”
theological_decisions:
- issue: Nomino ya kijinsia בָּנִים
  choice: wana
  alternative: watoto
  rationale: Kiebrania kinataja wana wa kiume waziwazi, na muktadha unaakisi thamani ya kijamii iliyohusishwa na wana; tafsiri haifanyi neno hilo kuwa lisiloonyesha jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya “Na kwa nini” yamehifadhiwa ili kudumisha nguvu ya maswali matatu ya Elkana. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika moja kwa moja.
