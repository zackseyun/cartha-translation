  terminology: Majina ya watu yamehifadhiwa kwa unukuzi unaosomeka, na “Mwefrathi” huacha umbo la Kiebrania lisawazishwe kimya kimya na “Mwefraimu.” Tanbihi inaweka wazi usomaji mbadala wa kieneo.
