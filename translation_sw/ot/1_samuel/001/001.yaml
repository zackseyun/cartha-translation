base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/001.yaml
  text: There was a certain man from Ramathaim-zophim[a], from the hill country of Ephraim, and his name was Elkanah son of Jeroham, son of Elihu, son of Tohu, son of Zuph, an Ephraimite.
translation:
  language: sw
  text: Kulikuwa na mtu mmoja kutoka Ramathaimu-Sofimu, katika nchi ya vilima ya Efraimu, na jina lake lilikuwa Elkana mwana wa Yerohamu, mwana wa Elihu, mwana wa Tohu, mwana wa Sufu, Mwefrathi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, yawezekana, “Mwefraimu.” Kiebrania kinasema “Mwefrathi,” neno ambalo huenda hapa likatumika kama utambulisho wa kieneo unaohusishwa na Efraimu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Palikuwa na
  rationale: Hufungua simulizi kwa Kiswahili cha kawaida bila kuongeza kielezi cha wakati kisichotajwa wazi katika Kiebrania.
- source_word: אִישׁ אֶחָד
  choice: mtu mmoja
  rationale: Hutambulisha mtu mahususi ambaye bado hajatajwa jina, huku ikibaki ya kawaida na yenye heshima katika Kiswahili.
- source_word: מִן הָרָמָתַיִם צוֹפִים
  choice: kutoka Ramathaim-sofimu
  rationale: Inachukuliwa kuwa jina la mahali; unukuzi hulihifadhi bila kulifasiri kupita ushahidi wa maandishi.
- source_word: מֵהַר אֶפְרָיִם
  choice: katika nchi ya vilima ya Efraimu
  rationale: Katika usemi huu הַר humaanisha eneo la vilima, si mlima mmoja.
- source_word: וּשְׁמוֹ
  choice: Jina lake lilikuwa
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha kishazi cha Kiebrania kwa uwazi.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Jina la mtu limenukuliwa kwa umbo linalosomeka kwa Kiswahili.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶן
  choice: mwana wa ... mwana wa ... mwana wa ... mwana wa
  rationale: Huhifadhi muundo wa nasaba wa Kiebrania bila kuugeuza kuwa ‘mzao wa,’ ingawa nasaba za Kiebrania wakati mwingine zinaweza kuruka vizazi.
- source_word: אֶפְרָתִי
  choice: Mwefrathi
  rationale: Huhifadhi umbo rasmi la neno la Kiebrania; uwezekano wa maana ya kieneo ‘Mwefraimu’ unawekwa katika tanbihi.
theological_decisions:
- issue: Utambulisho wa kikabila au kieneo katika אֶפְרָתִי
  choice: Mwefrathi
  alternative: Mwefraimu
  rationale: Umbo la Kiebrania linaelekeza moja kwa moja kwa ‘Mwefrathi,’ lakini muktadha wa nchi ya vilima ya Efraimu unaweza kufanya neno hilo lieleweke kama utambulisho wa kieneo. Utata huo haujaondolewa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa baada ya taarifa ya mahali ili nasaba ndefu isomeke kwa urahisi. Alama ya tanbihi imewekwa moja kwa moja baada ya ‘Mwefrathi,’ neno linalohusika.
