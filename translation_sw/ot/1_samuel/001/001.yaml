  source_fidelity: Mfuatano wa mahali, nasaba, na utata wa אֶפְרָתִי umehifadhiwa kwa uaminifu. Hata hivyo, “Palikuwa na” kwa kawaida huhitaji mahali palipotajwa au kurejelewa; kwa utangulizi huu wa simulizi, “Kulikuwa na” hutafsiri וַיְהִי kwa usahihi na bila utata wa kilokativi.
