  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עָלָה֩ הָ/אִ֨ישׁ הַ/ה֤וּא מֵֽ/עִיר/וֹ֙ מִ/יָּמִ֣ים יָמִ֔ימָ/ה לְ/הִֽשְׁתַּחֲוֺ֧ת וְ/לִ/זְבֹּ֛חַ לַ/יהוָ֥ה צְבָא֖וֹת בְּ/שִׁלֹ֑ה וְ/שָׁ֞ם שְׁנֵ֣י בְנֵֽי עֵלִ֗י חָפְנִי֙ וּ/פִ֣נְחָ֔ס כֹּהֲנִ֖ים לַ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/003.yaml
  text: That man used to go up from his city year after year to worship and to sacrifice to Yahweh of Armies at Shiloh. And the two sons of Eli[a], Hophni and Phinehas, were there as priests of Yahweh.
translation:
  language: sw
  text: Mtu huyo alikuwa akipanda kutoka mjini kwake mwaka baada ya mwaka kwenda kuabudu na kutoa dhabihu kwa Yahwe wa Majeshi[a] huko Shilo. Huko, wana wawili wa Eli, Hofni na Finehasi, walikuwa makuhani wa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa mapokeo, “BWANA wa Majeshi.”
    reason: Tafsiri mbadala ya kimapokeo ya jina יהוה צבאות.
lexical_decisions:
- source_word: וְעָלָה
  choice: alikuwa akipanda
  rationale: Muundo huu unaonyesha tendo la kawaida lililorudiwa zamani; ‘alikuwa akipanda’ pia huhifadhi maana halisi ya kwenda juu katika safari ya ibada.
- source_word: הָאִישׁ הַהוּא
  choice: mtu huyo
  rationale: Kiwakilishi ‘huyo’ kinamrejelea kwa wazi Elikana ambaye tayari ametajwa.
- source_word: מֵעִירוֹ
  choice: kutoka mjini kwake
  rationale: Hii ni tafsiri ya kawaida na ya asili ya ‘kutoka katika mji wake’ katika Kiswahili.
- source_word: מִיָּמִים יָמִימָה
  choice: mwaka baada ya mwaka
  rationale: Nahau hii ya Kiebrania inaonyesha kurudiwa kwa jambo kila mwaka.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: kuabudu
  rationale: Ingawa kitenzi kinaweza kumaanisha kujinama au kusujudu, hapa kinaeleza tendo la ibada mbele za Mungu.
- source_word: וְלִזְבֹּחַ
  choice: kutoa dhabihu
  rationale: Usemi huu ni wa kawaida katika Kiswahili na unaeleza wazi utoaji wa sadaka ya dhabihu.
- source_word: לַיהוָה
  choice: kwa Yahwe
  rationale: Jina la agano יהוה limetoholewa moja kwa moja kuwa ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: צְבָאוֹת
  choice: wa Majeshi
  rationale: Neno hili linamaanisha majeshi au vikosi; ‘wa Majeshi’ huhifadhi maana ya jina hilo la Mungu kwa uwazi.
- source_word: בְּשִׁלֹה
  choice: huko Shilo
  rationale: ‘Huko’ linafaa kwa mahali pa safari na patakatifu palipokuwa Shilo.
- source_word: וְשָׁם
  choice: Huko
  rationale: Neno hili huhifadhi kiunganishi cha mahali kinachoanzisha taarifa kuhusu wana wa Eli.
- source_word: שְׁנֵי בְנֵי עֵלִי
  choice: wana wawili wa Eli
  rationale: Tafsiri hii huhifadhi mkazo wa Kiebrania juu ya idadi ya wana hao.
- source_word: חָפְנִי וּפִנְחָס
  choice: Hofni na Finehasi
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: כֹּהֲנִים לַיהוָה
  choice: makuhani wa Yahwe
  rationale: Hii inaonyesha kwa ufupi na kwa usahihi kwamba walihudumu kama makuhani wake.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania inatumia jina maalumu la Mungu; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Tafsiri ya יהוה צבאות
  choice: Yahwe wa Majeshi
  alternative: BWANA wa Majeshi
  rationale: ‘Wa Majeshi’ inatafsiri maana ya צבאות kwa uwazi bila kuibadilisha kuwa dhana pana zaidi kama ‘Mwenyezi.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. ‘Alikuwa akipanda’ na ‘mwaka baada ya mwaka’ zinaonyesha safari ya ibada iliyorudiwa; majina Shilo, Hofni na Finehasi yanafuata maumbo yaliyozoeleka katika Kiswahili.
