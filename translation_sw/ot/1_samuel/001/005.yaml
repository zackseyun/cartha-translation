  yaml_path: translation/ot/1_samuel/001/005.yaml
  text: But to Hannah he would give a double portion[a], because he loved Hannah, though Yahweh had closed her womb.
translation:
  language: sw
  text: Lakini Elikana angempa Hana fungu maradufu[a], kwa sababu alimpenda Hana, ingawa Yahwe alikuwa amefunga tumbo lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “fungu moja la nyuso mbili.” Kirai hiki ni kigumu; huenda kikamaanisha “fungu maradufu” au “fungu maalumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/חַנָּה
  choice: Lakini Hana
  rationale: Kiunganishi na kihusishi vina maana ya msingi ya ‘na/kwa Hana,’ lakini ‘Lakini Hana’ linaonyesha kwa Kiswahili sanifu utofauti na mafungu waliyopewa Penina na watoto wake katika mstari uliotangulia.
- source_word: יִתֵּן
  choice: alimpa
  rationale: Kauli hii inamhusu Elikana akimpa Hana sehemu yake ya chakula cha dhabihu. Wakati uliopita unasomeka kwa kawaida katika simulizi; desturi ya kila mwaka inaeleweka kutokana na muktadha mpana.
- source_word: מָנָה
  choice: fungu
  rationale: Neno hili ni sehemu iliyogawiwa mtu katika mlo wa dhabihu. ‘Fungu’ ni la kawaida, lenye heshima, na linafaa katika muktadha huu.
- source_word: אַחַת אַפָּיִם
  choice: fungu maradufu
  rationale: Kirai hiki kigumu kina maana halisi inayokaribia ‘fungu moja la nyuso/pua mbili.’ Huenda kikamaanisha fungu maradufu au fungu maalumu; tafsiri inayowezekana zaidi imetumiwa katika maandishi, huku utata ukihifadhiwa katika tanbihi.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya Elikana kumpa Hana fungu hilo.
- source_word: אֶת חַנָּה אָהֵב
  choice: alimpenda
  rationale: Kitenzi kinaeleza moja kwa moja upendo wa Elikana kwa Hana. Jina halijarudiwa kwa sababu kiwakilishi cha Kiswahili kinamtaja Hana kwa uwazi katika muktadha wa karibu.
- source_word: וַֽ/יהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa kwa namna ya kulitamka, ‘Yahwe,’ badala ya kulibadilisha kuwa cheo.
- source_word: סָגַר רַחְמָהּ
  choice: alikuwa amefunga tumbo lake la uzazi
  rationale: Kitenzi kinamaanisha kufunga, na ‘tumbo la uzazi’ linaeleza רֶחֶם kwa Kiswahili cha sasa. Muundo ‘alikuwa amefunga’ unaonyesha hali iliyokuwapo tayari.
theological_decisions:
- issue: Kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina יהוה lenyewe. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya upendo wa Elikana na kufungwa kwa tumbo la uzazi la Hana
  choice: ingawa Yahwe alikuwa amefunga tumbo lake la uzazi
  alternative: na Yahwe alikuwa amefunga tumbo lake la uzazi
  rationale: 'Kiebrania kina kiunganishi cha kawaida ‘na,’ lakini mfuatano wa mawazo unawezesha maana ya kukubali hali iliyo kinyume: Elikana alimpenda Hana licha ya kutokuwa kwake na watoto. ‘Ingawa’ huwasilisha uhusiano huo wa kimuktadha bila kuondoa dai la chanzo kwamba Yahwe alikuwa amefunga tumbo lake la uzazi.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka katika usomaji wa hadhara. Utata wa אַחַת אַפָּיִם haujafichwa, bali umewekwa katika tanbihi.
