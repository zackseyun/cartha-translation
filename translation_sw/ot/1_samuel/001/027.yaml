  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu maana ya Kiebrania: Hana anaeleza sala yake kuhusu/akwa ajili ya mtoto huyu, na kwamba Yahweh amempa ombi lake. Umilikaji katika שְׁאֵלָתִי umehifadhiwa kwa “ombi langu,” na uhusiano wa kuomba unaorudiwa katika kifungu cha mwisho umehifadhiwa kwa kawaida katika Kiswahili.'
  naturalness: “Kwa ajili ya mtoto huyu niliomba, naye Yahweh amenipa ombi langu nililomwomba” ni Kiswahili Sanifu kinachoeleweka na chenye mtiririko unaofaa kwa hotuba ya simulizi. “Amenipa” huwasilisha vizuri tendo lililotimizwa lenye athari ya sasa.
  terminology: “Yahweh” huhifadhi jina la יהוה kama lilivyoamuliwa katika mwelekeo wa mradi. “Mtoto,” “ombi,” na “kuomba” zinafaa kwa muktadha na kwa rejesta ya maandiko. Tanbihi (a) huhifadhi ipasavyo uwezekano wa “kuhusu,” bila kulazimisha maana moja ya kihusishi cha Kiebrania.
