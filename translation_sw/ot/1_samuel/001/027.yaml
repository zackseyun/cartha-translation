id: 1SA.1.27
reference: 1 Samuel 1:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֶל הַ/נַּ֥עַר הַ/זֶּ֖ה הִתְפַּלָּ֑לְתִּי וַ/יִּתֵּ֨ן יְהוָ֥ה לִ/י֙ אֶת שְׁאֵ֣לָתִ֔/י אֲשֶׁ֥ר שָׁאַ֖לְתִּי מֵ/עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/027.yaml
  text: For this boy I prayed[b][a], and Yahweh has given me my petition that I asked from him.
translation:
  language: sw
  text: Kwa ajili ya mtoto huyu niliomba[a], naye Yahweh amenipa ombi langu[b] nililomwomba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kuhusu mtoto huyu niliomba.” Kihusishi cha Kiebrania kinaweza kutaja jambo ambalo sala ililihusu.
    reason: lexical_alternative
  - marker: b
    text: Au, “maombi yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל הַנַּעַר הַזֶּה
  choice: Kwa ajili ya mtoto huyu
  rationale: אֶל pamoja na kitenzi cha kuomba huonyesha jambo au mtu aliyehusu sala. ‘Kwa ajili ya mtoto huyu’ ni Kiswahili cha kawaida na kinafaa kwa Samweli aliyekuwa mtoto mdogo; uwezekano wa ‘Kuhusu mtoto huyu’ umehifadhiwa katika tanbihi.
- source_word: הִתְפַּלָּלְתִּי
  choice: niliomba
  rationale: Wakati uliopita unafaa kwa simulizi na unaonyesha sala ambayo Hana alikuwa amekwisha kutoa.
- source_word: וַיִּתֵּן
  choice: amenipa
  rationale: Ingawa umbo la Kiebrania linasimulia tendo la wakati uliopita, wakati timilifu wa Kiswahili unaonyesha vizuri matokeo yaliyopo sasa Hana anapomleta Samweli.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi, si kubadilishwa kuwa cheo.
- source_word: שְׁאֵלָתִי
  choice: ombi langu
  rationale: Nomino hii humaanisha ombi au dua. ‘Ombi langu’ huhifadhi kiambishi cha umilikaji na pia uhusiano wa mzizi na kitenzi kinachofuata.
- source_word: אֲשֶׁר שָׁאַלְתִּי מֵעִמּוֹ
  choice: nililomwomba
  rationale: Muundo huu wa Kiswahili ni wa asili na unaonyesha kwamba ombi hilo liliombwa kwa Yahweh, huku ukihifadhi mwangwi kati ya ‘ombi’ na ‘kuomba’.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia jina binafsi יְהוָה. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya אֶל katika sala ya Hana
  choice: Kwa ajili ya mtoto huyu
  alternative: Kuhusu mtoto huyu
  rationale: Kihusishi kinaweza kueleza aliyelengwa au jambo lililohusu sala. Tafsiri kuu inaeleza kwa kawaida kwamba Hana alimwomba Mungu ampate mtoto huyo, lakini tanbihi huhifadhi maana pana ya ‘kuhusu’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. ‘Mtoto’ limetumiwa badala ya ‘mvulana’ kwa sababu Samweli alikuwa bado mdogo; ‘naye’ huunganisha sentensi kwa mtiririko wa kawaida. Mwangwi wa mzizi wa Kiebrania שאל umeakisiwa kwa ‘ombi ... nililomwomba’.
