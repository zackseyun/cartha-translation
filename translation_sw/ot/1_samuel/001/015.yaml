base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/015.yaml
  text: But Hannah answered and said[a], “No, my lord. I am a woman troubled in spirit. I have drunk neither wine nor strong drink[b], but I have poured out my soul before Yahweh.”
translation:
  language: sw
  text: Lakini Hana akajibu, “La, bwana wangu. Mimi ni mwanamke mwenye roho iliyotaabika.[a] Sijakunywa divai wala kileo,[b] bali nimeimwaga nafsi yangu mbele za Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanamke mwenye huzuni rohoni.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, kinywaji kingine chenye kulevya mbali na divai.
    reason: lexical_clarification
lexical_decisions:
- source_word: לֹא אֲדֹנִי
  choice: Sivyo, bwana wangu
  rationale: Hii ni namna ya heshima ya kumwambia Eli, si cheo cha Mungu. “Bwana wangu” inadumisha heshima na umbo la umilikaji la Kiebrania.
- source_word: אִשָּׁה קְשַׁת רוּחַ
  choice: mwanamke mwenye huzuni rohoni
  rationale: Kirai hiki kinaonyesha maumivu au dhiki ya ndani, si ukaidi. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha wazo la רוּחַ kama hali ya ndani.
- source_word: וְיַיִן וְשֵׁכָר
  choice: divai wala kileo
  rationale: שֵׁכָר ni kinywaji chenye kulevya tofauti na divai. “Kileo” ni neno fupi na pana lisilobainisha aina ambayo maandishi hayajabainisha.
- source_word: לֹא שָׁתִיתִי
  choice: Sijanywa
  rationale: Kauli hii inaonyesha kwamba Hana hakuwa amekunywa; “wala” inaunganisha vitu viwili vinavyokanushwa kwa Kiswahili cha kawaida.
- source_word: וָאֶשְׁפֹּךְ אֶת נַפְשִׁי
  choice: nimeimwaga nafsi yangu
  rationale: Tafsiri hii inadumisha sitiari ya Kiebrania ya kumwaga nafsi na kueleza kujifunua kikamilifu katika sala, bila kuibadili kuwa “moyo.”
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: “Mbele za” huonyesha kuwa sala ilitolewa katika uwepo wa Mungu, na jina la agano יְהוָה limetolewa kama “Yahweh.”
- source_word: וַתַּעַן חַנָּה וַתֹּאמֶר
  choice: Lakini Hana akajibu
  rationale: “Lakini” huonyesha jibu lake kwa shtaka la Eli. Kitenzi kimoja “akajibu” ni Kiswahili cha asili na kinawasilisha fomula ya Kiebrania “akajibu akasema” bila uradidi usio wa lazima.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi yanatumia Tetragramatoni moja kwa moja. “Yahweh” linadumisha jina la agano badala ya kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Sivyo, bwana wangu” hudumisha heshima ya Hana kwa Eli; “nimeimwaga nafsi yangu” huhifadhi taswira ya maandishi ya Kiebrania.
