base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/017.yaml
  text: Then Eli answered and said[a], “Go in peace, and may the God of Israel grant your petition that you have asked from him.”
translation:
  language: sw
  text: Ndipo Eli akajibu, akasema, “Nenda kwa amani, na Mungu wa Israeli akujalie ombi lako[a] ulilomwomba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kile ulichokiomba.” Neno la Kiebrania linamaanisha jambo lililoombwa katika sala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: akajibu, akasema
  rationale: 'Vitenzi vyote viwili vya Kiebrania vimehifadhiwa ili kuakisi mtindo wa simulizi: Eli alijibu kisha akaanza kusema.'
- source_word: לְכִי לְשָׁלוֹם
  choice: Nenda kwa amani
  rationale: Hii ni tafsiri ya kawaida na yenye heshima ya nahau ya baraka inayomaanisha kuondoka salama na katika hali njema.
- source_word: וֵאלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Muundo huu unalitaja wazi jina la uhusiano wa Mungu na Israeli bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: יִתֵּן
  choice: akujalie
  rationale: Hapa kitenzi נתן kina nguvu ya ombi au baraka. ‘Akujalie’ huwasilisha kwa Kiswahili cha kawaida maana ya ‘na akupe’ au ‘na akubalie’ bila kuifanya kauli kuwa ahadi ya moja kwa moja.
- source_word: שֵׁלָתֵךְ
  choice: ombi lako
  rationale: Neno hili linamaanisha jambo lililoombwa. ‘Ombi lako’ ni la kawaida, wazi, na linafaa katika muktadha wa sala.
- source_word: אֲשֶׁר שָׁאַלְתְּ מֵעִמּוֹ
  choice: ulilomwomba
  rationale: Muundo huu wa Kiswahili huonyesha kwamba Hana alimwomba Mungu jambo hilo, huku ukihifadhi kiwakilishi cha nafsi kilichopo katika Kiebrania.
theological_decisions:
- issue: Mhusika anayerejelewa na kiwakilishi katika מֵעִמּוֹ
  choice: Kiwakilishi katika ‘ulilomwomba’ kinamrejelea Mungu.
  alternative: Kuacha mhusika akiwa na utata zaidi au kukitafsiri kifungu kana kwamba kinamrejelea Eli.
  rationale: Muktadha wa karibu unaonyesha kwamba Hana alikuwa akisali mbele za Bwana; kwa hiyo Eli anazungumzia ombi alilomwomba Mungu. Tafsiri bado inatumia kiwakilishi badala ya kurudia jina ‘Mungu.’
- issue: Nguvu ya יִתֵּן
  choice: 'Imetafsiriwa kama baraka au tamanio: ‘akujalie.’'
  alternative: 'Kauli ya uhakika: ‘atakujalia.’'
  rationale: Katika muktadha huu kauli ya Eli inaeleweka kwa kawaida kama baraka yenye tamanio, si lazima kama ahadi ya kinabii isiyo na sharti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. ‘Ndipo’ na mfuatano ‘akajibu, akasema’ huhifadhi mtiririko wa simulizi ya Kiebrania, huku ‘akujalie’ ikitoa sauti ya baraka kwa njia ya kawaida ya Kiswahili.
