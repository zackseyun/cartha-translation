  text: וְ/כִֽעֲסַ֤תָּ/ה צָֽרָתָ/הּ֙ גַּם כַּ֔עַס בַּ/עֲב֖וּר הַרְּעִמָ֑/הּ כִּֽי סָגַ֥ר יְהוָ֖ה בְּעַ֥ד רַחְמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/006.yaml
  text: And her rival would provoke her bitterly in order to irritate her[a], because Yahweh had closed her womb.
translation:
  language: sw
  text: Naye mpinzani wake[a] alikuwa akimchokoza sana ili kumtia uchungu, kwa sababu Yahwe alikuwa amefunga tumbo lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, mke mwenza wake; neno la Kiebrania humaanisha mpinzani wa kike, na hapa linamhusu Penina katika uhusiano wake wa mke mwenza wa Hana.
    reason: Huhifadhi maana ya msingi ya “mpinzani” katika maandishi na hutoa mbadala wa kimuktadha wa uhusiano wa wake wenza.
lexical_decisions:
- source_word: וְכִעֲסַתָּה
  choice: alikuwa akimkasirisha
  rationale: Pieli ya כעס ina maana ya kusababisha hasira au dhiki; muundo wa Kiswahili unaonyesha kitendo cha kawaida kilichorudiwa katika simulizi.
- source_word: צָרָתָהּ
  choice: mwenzake
  rationale: Neno hili humtaja Penina kama mwanamke aliye katika uhusiano wa ushindani ndani ya ndoa. “Mwenzake” ni lugha ya kawaida, huku tanbihi ikifafanua kuwa alikuwa mke mwenza na mpinzani wake.
- source_word: גַּם כַּעַס
  choice: sana
  rationale: Kirai hiki kinasisitiza ukali wa uchokozi. “Sana” huwasilisha msisitizo huo kwa Kiswahili cha kawaida bila kurudia mzizi wa hasira kwa namna isiyo ya kawaida.
- source_word: בַּעֲבוּר
  choice: ili
  rationale: Katika muktadha huu linaonyesha kusudi la kitendo cha Penina.
- source_word: הַרְּעִמָהּ
  choice: amsononeshe
  rationale: Kitenzi hiki adimu kinaeleweka kuwa kusababisha fadhaa au dhiki. “Amsononeshe” huonyesha maumivu ya ndani yaliyokusudiwa bila kulinganisha kabisa na kitenzi kilichotangulia.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kinaanzisha sababu iliyomwezesha Penina kumchokoza Hana.
- source_word: סָגַר
  choice: alikuwa ameufunga
  rationale: Hutafsiri maana ya kufunga, na wakati uliotangulia unaonyesha hali iliyokuwapo kabla ya uchokozi unaosimuliwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limewasilishwa kwa uhawilishaji wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: בְּעַד רַחְמָהּ
  choice: tumbo lake
  rationale: רֶחֶם ni tumbo la uzazi; pamoja na סגר, usemi huo unamaanisha kunyimwa uwezo wa kupata mimba. Kiswahili cha Biblia hutumia kwa kawaida “kufunga tumbo” kwa nahau hii.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה. “Yahwe” hulihifadhi kama jina binafsi kwa tahajia inayofaa Kiswahili, badala ya kuliweka kwa cheo.
- issue: Uhusiano wa tendo la Mungu na utasa wa Hana
  choice: Yahwe alikuwa ameufunga tumbo lake
  alternative: Hana hakuweza kupata mtoto
  rationale: Tafsiri inadumisha dai la moja kwa moja la maandishi kwamba hali hiyo ilihusishwa na tendo la Yahwe, bila kulipunguza kuwa maelezo ya hali pekee wala kuliongezea ufafanuzi wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “alikuwa akimkasirisha” unaonyesha tendo lililorudiwa; “amsononeshe” huwasilisha dhiki ya kihisia. Jina יהוה limeandikwa “Yahwe” kwa tahajia ya Kiswahili.
