review_pass:
  verdict: revise
  source_fidelity: The draft retains the repeated/custary sense, purpose clause, causal clause, and explicit attribution that Yahweh had closed Hannah's womb. However, “mwenzake” is too broad in the main text for צָרָתָהּ, which specifically denotes her rival in this domestic context. “Amsononeshe” narrows the rare verb to making sad; “kumtia uchungu” more naturally conveys the intended distress while preserving the source's force.
  naturalness: “Mpinzani wake alikuwa akimchokoza sana ili kumtia uchungu” is idiomatic, dignified Standard East African Swahili and clearly represents the repeated hostile conduct. “Yahwe alikuwa amefunga tumbo lake” uses the established and natural biblical Swahili idiom without the less smooth object form “ameufunga tumbo lake.”
  terminology: Use “mpinzani wake” in the text for the primary lexical sense, with “mke mwenza” retained as a footnoted contextual alternative. Retain “Yahwe” consistently as the transliterated divine name selected by the draft.
  issues:
  - severity: medium
    issue: “Mwenzake” is semantically underspecified for צָרָתָהּ.
    rationale: It can simply mean a companion or fellow person and does not itself communicate the adversarial relationship conveyed by the Hebrew. The footnote cannot fully compensate for loss of the primary sense in the text.
  - severity: low
    issue: “Amsononeshe” is overly specific.
    rationale: The Hebrew rare verb denotes causing agitation or distress in context; “kumtia uchungu” is a more natural and suitably broad rendering.
  - severity: low
    issue: “Alikuwa ameufunga tumbo lake” is less idiomatic than the established Swahili biblical expression.
    rationale: “Alikuwa amefunga tumbo lake” naturally expresses the idiom while retaining the Hebrew assertion that Yahweh closed the womb.
  revised_text: Naye mpinzani wake[a] alikuwa akimchokoza sana ili kumtia uchungu, kwa sababu Yahwe alikuwa amefunga tumbo lake.
