  text: And when the day came[a], Elkanah sacrificed and gave portions to Peninnah his wife and to all her sons and daughters.
translation:
  language: sw
  text: Ikawa, siku ile Elikana alipotoa dhabihu, aliwapa[a] Penina, mke wake, na wanawe wote, wa kiume na wa kike, mafungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa akiwapa mafungu”; umbo la Kiebrania linaweza kutafsiriwa kama wakati uliopita wa kawaida, lakini muktadha unaweza kuonyesha tendo lililorudiwa kila wakati wa mlo wa dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Ikawa, siku hiyo
  rationale: Kauli hii ya Kiebrania huanzisha tukio kwa kutaja wakati. Tafsiri hii inadumisha muundo wa masimulizi kwa Kiswahili cha asili bila kuufanya useme zaidi ya chanzo.
- source_word: וַיִּזְבַּח
  choice: alipotoa dhabihu
  rationale: Kitenzi זבח humaanisha kuchinja au kutoa dhabihu. Katika muktadha huu, ‘kutoa dhabihu’ ni usemi wa kawaida na wenye heshima unaobakiza maana ya kiibada.
- source_word: וְנָתַן
  choice: akampa
  rationale: Umbo la Kiebrania linaweza kueleweka kama tendo la wakati uliopita katika mlolongo wa masimulizi, ingawa muktadha mpana unaweza kudokeza desturi ya kurudiwa. Tafsiri kuu inadumisha mlolongo wa vitenzi; tanbihi inaonyesha uwezekano wa maana ya mazoea.
- source_word: לִפְנִנָּה אִשְׁתּוֹ
  choice: Penina mke wake
  rationale: Mpangilio huu unafuata kwa karibu mfuatano wa Kiebrania na ni wa kawaida katika Kiswahili.
- source_word: וּלְכָל בָּנֶיהָ וּבְנוֹתֶיהָ
  choice: pamoja na wanawe wote wa kiume na wa kike
  rationale: Chanzo kinataja wazi wana wa kiume na mabinti. Usemi huu unabaki wazi kuwa wote walihusika na unaepuka utata wa ‘wana’ peke yake.
- source_word: מָנוֹת
  choice: mafungu
  rationale: Neno hili humaanisha sehemu zilizogawiwa, hapa katika mlo wa dhabihu. ‘Mafungu’ ni la kawaida na linaonyesha mgao bila kuongeza maelezo yasiyotajwa wazi.
