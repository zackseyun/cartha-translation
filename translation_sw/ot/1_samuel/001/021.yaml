base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/021.yaml
  text: Then the man Elkanah went up with all his household to sacrifice to Yahweh the yearly sacrifice and his vow[a].
translation:
  language: sw
  text: Kisha Elkana, yule mwanamume, akapanda pamoja na watu wote wa nyumbani kwake ili kumtolea Yahweh dhabihu ya kila mwaka na kutimiza nadhiri yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na nadhiri yake,” huku kitendo “kutoa dhabihu” kikieleweka bila kutajwa tena; maana ni kwamba alipanda pia kuitimiza nadhiri aliyokuwa ameweka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה kina maana ya kupanda/kwenda juu; katika muktadha wa safari kwenda mahali patakatifu huko Shilo, “akapanda” kinahifadhi nahau ya Kiebrania na kinaeleweka kwa Kiswahili.
- source_word: הָאִישׁ אֶלְקָנָה
  choice: Elkana, yule mtu
  rationale: אִישׁ ni “mtu/mwanamume,” si lazima “mume.” Mpangilio huu wa Kiswahili unabainisha kuwa anayezungumziwa ni Elkana huku ukihifadhi nomino hiyo.
- source_word: וְכָל־בֵּיתוֹ
  choice: pamoja na watu wote wa nyumbani mwake
  rationale: בַּיִת hapa humaanisha watu wa nyumba au jamaa ya nyumbani, wala si jengo lenyewe. Usemi huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: ili kumtolea Yahweh dhabihu
  rationale: זבח katika muktadha wa ibada ni kuchinja au kutoa dhabihu. Muundo “kumtolea ... dhabihu” ni wa asili katika Kiswahili na unaonyesha wazi mpokeaji wa dhabihu.
- source_word: זֶבַח הַיָּמִים
  choice: dhabihu ya kila mwaka
  rationale: Nahau hii inarejelea dhabihu iliyotolewa kwa utaratibu wa mwaka baada ya mwaka; “ya kila mwaka” huwasilisha maana hiyo kwa uwazi.
- source_word: וְאֶת־נִדְרוֹ
  choice: na kutimiza nadhiri yake
  rationale: Kiebrania kinaunganisha “nadhiri yake” kama kitu cha pili kwa muundo wa kiellipsi. Kiswahili huhitaji kitendo kinachoeleweka; “kutimiza” kinaonyesha kwenda kutekeleza alichokuwa ameahidi bila kudai kwamba nadhiri yenyewe ilikuwa dhabihu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina la agano יְהוָה moja kwa moja. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Uhusiano wa נִדְרוֹ na kitendo cha kutoa dhabihu
  choice: na kutimiza nadhiri yake
  alternative: na nadhiri yake
  rationale: Maandishi ya Kiebrania yana ellipsi inayoweza kueleweka kama kuendeleza kitendo kilichotangulia. Tafsiri kuu inaweka wazi kusudi la kutekeleza nadhiri, huku tanbihi ikihifadhi uwezekano wa muundo wa karibu zaidi na Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Watu wote wa nyumbani mwake” limetumiwa badala ya “nyumba yake yote” ili kuzuia dhana ya jengo; “akapanda” kinahifadhi lugha ya safari ya kwenda mahali patakatifu.
