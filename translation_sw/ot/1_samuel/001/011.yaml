  text: וַ/תִּדֹּ֨ר נֶ֜דֶר וַ/תֹּאמַ֗ר יְהוָ֨ה צְבָא֜וֹת אִם רָאֹ֥ה תִרְאֶ֣ה בָּ/עֳנִ֣י אֲמָתֶ֗/ךָ וּ/זְכַרְתַּ֨/נִי֙ וְ/לֹֽא תִשְׁכַּ֣ח אֶת אֲמָתֶ֔/ךָ וְ/נָתַתָּ֥ה לַ/אֲמָתְ/ךָ֖ זֶ֣רַע אֲנָשִׁ֑ים וּ/נְתַתִּ֤י/ו לַֽ/יהוָה֙ כָּל יְמֵ֣י חַיָּ֔י/ו וּ/מוֹרָ֖ה לֹא יַעֲלֶ֥ה עַל רֹאשֽׁ/וֹ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/011.yaml
  text: She made a vow and said[a], “O Yahweh of hosts, if you will indeed look on the affliction of your female servant, and remember me, and not forget your female servant, but give your female servant a male child, then I will give him to Yahweh all the days of his life[b], and no razor shall come upon his head.”
translation:
  language: sw
  text: Naye akaweka nadhiri, akasema, “Ee Yahwe wa majeshi, ikiwa kweli utayatazama mateso ya mjakazi wako, na ukinikumbuka wala usimsahau mjakazi wako, bali ukimpa mjakazi wako mtoto wa kiume[a], basi nitamtoa kwa Yahwe siku zote za maisha yake, na wembe hautapita juu ya kichwa chake[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu, “uzao wa wanaume”; hapa ni nahau yenye maana ya mtoto wa kiume.
    reason: lexical_alternative
  - marker: b
    text: Maneno “wembe hautapita juu ya kichwa chake” yanafanana na lugha ya kujiweka wakfu kwa namna ya nadhiri ya Mnadhiri. Hata hivyo, mstari huu unataja katazo la wembe bila kutumia jina “Mnadhiri.”
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּדֹּר נֶדֶר
  choice: akaweka nadhiri
  rationale: Muundo wa Kiebrania unatumia kitenzi na nomino zenye mzizi mmoja kwa msisitizo. Kiswahili cha kawaida hutumia ‘kuweka nadhiri,’ ambacho kinadumisha uzito wa tendo rasmi bila kurudia maneno kwa namna isiyo ya asili.
- source_word: יְהוָה צְבָאוֹת
  choice: Ee Yahwe wa majeshi
  rationale: ‘Yahwe’ linawakilisha jina la agano יְהוָה, na ‘wa majeshi’ linahifadhi cheo צְבָאוֹת badala ya kukifafanua kwa neno jingine kama ‘Mwenyezi.’ ‘Ee’ linaonyesha mwito wa sala.
- source_word: אִם רָאֹה תִרְאֶה
  choice: ikiwa kweli utayatazama
  rationale: Kitenzi-jina kisicho na kikomo pamoja na kitenzi kilichokamilika huongeza msisitizo. ‘Kweli’ linaonyesha msisitizo huo, huku ‘kutazama’ hapa kukidokeza kuyaangalia mateso kwa uangalifu.
- source_word: בָּעֳנִי
  choice: mateso
  rationale: Neno hili linaweza kumaanisha dhiki, taabu, au hali ya kudhalilishwa. ‘Mateso’ ni neno pana na la kawaida linalobeba uchungu wa Hana bila kuufafanua kupita maandishi.
- source_word: אֲמָתֶךָ / לַאֲמָתְךָ
  choice: mjakazi wako
  rationale: Neno la Kiebrania linamtaja mtumishi wa kike. ‘Mjakazi’ linahifadhi jinsia na pia linafaa katika lugha ya unyenyekevu wa sala.
- source_word: וּזְכַרְתַּנִי
  choice: ukikumbuka
  rationale: Linahifadhi lugha ya moja kwa moja ya ombi na ulinganifu wake na ombi la kutosahauliwa.
- source_word: וְלֹא תִשְׁכַּח אֶת אֲמָתֶךָ
  choice: wala usimsahau mjakazi wako
  rationale: ‘Wala’ linaendeleza mkusanyiko wa maombi, na ‘usimsahau’ ni ombi la asili kwa Kiswahili linalohifadhi ulinganifu na ‘ukikumbuka.’
- source_word: וְנָתַתָּה לַאֲמָתְךָ זֶרַע אֲנָשִׁים
  choice: ukimpa mjakazi wako mtoto wa kiume
  rationale: Kirai hiki kwa karibu ni ‘uzao wa wanaume,’ lakini katika muktadha ni nahau inayomaanisha mtoto wa kiume. Tafsiri kuu inaweka maana wazi, huku tanbihi ikihifadhi umbo halisi.
- source_word: וּנְתַתִּיו לַיהוָה
  choice: basi nitamtoa kwa Yahwe
  rationale: Kitenzi cha msingi ni ‘kutoa/kumpa.’ ‘Nitamtoa kwa Yahwe’ kinabaki karibu na Kiebrania na hakiongezi neno la kifasiri kama ‘nitamweka wakfu,’ ingawa kuwekwa wakfu kunadokezwa na muktadha.
- source_word: כָּל יְמֵי חַיָּיו
  choice: siku zote za maisha yake
  rationale: Tafsiri hii ya moja kwa moja inahifadhi wazo la muda wote wa maisha.
- source_word: וּמוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: na wembe hautapita juu ya kichwa chake
  rationale: ‘Wembe’ ndiyo maana inayofaa zaidi ya מוֹרָה hapa. ‘Hautapita juu ya kichwa chake’ linahifadhi taswira halisi ya Kiebrania na linaeleweka kuwa nywele zake hazitanyolewa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja. ‘Yahwe’ linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Dokezo linalowezekana la nadhiri ya Mnadhiri katika katazo la wembe
  choice: Kuhifadhi maneno halisi ya nadhiri bila kumwita mtoto ‘Mnadhiri’ katika maandishi makuu
  alternative: Kusema wazi kwamba mtoto atakuwa Mnadhiri
  rationale: Lugha hii inafanana sana na masharti ya kujitenga kwa Mnadhiri, lakini mstari wenyewe unataja tu kutolewa kwa Yahwe maisha yote na kutopitishwa wembe kichwani. Tafsiri haiongezi utambulisho ambao maandishi hayautaji wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sala umehifadhi marudio ya ‘mjakazi wako’ na mvutano wa ombi la masharti, huku nahau isiyoeleweka moja kwa moja ikifafanuliwa kwa tanbihi badala ya kulemewa katika maandishi makuu.
