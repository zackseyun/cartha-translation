base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/022.yaml
  text: But Hannah did not go up[a], for she said to her husband, “Not until the boy is weaned will I bring him[b], so that he may appear before Yahweh and stay there forever.”
translation:
  language: sw
  text: Lakini Hana hakupanda, kwa maana alimwambia mume wake, “Sitamleta mtoto mpaka atakapoachishwa kunyonya. Kisha nitamleta ili aonekane mbele ya Yahwe[a] na akae huko milele[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata uchanganuzi mwingine au mapokeo mengine ya maandishi: “nami nitaonekana mbele ya Yahwe, naye atakaa huko milele.”'
    reason: alternative_reading
  - marker: b
    text: Hapa “milele” inamaanisha kwamba Samweli aliwekwa wakfu kudumu katika huduma ya Yahwe, yaani, kwa maisha yake yote.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָתָה
  choice: hakupanda kwenda huko
  rationale: Kitenzi עלה humaanisha ‘kupanda’; hapa kinarejelea safari ya kwenda mahali patakatifu huko Shilo. Nyongeza ‘kwenda huko’ huifanya nahau hiyo ieleweke kwa Kiswahili bila kuigeuza kuwa maelezo marefu.
- source_word: לְאִישָׁהּ
  choice: mume wake
  rationale: Katika muktadha huu אִישׁ pamoja na kiambishi cha umilikaji humaanisha wazi ‘mume wake’.
- source_word: עַד יִגָּמֵל הַנַּעַר
  choice: mpaka atakapoachishwa kunyonya
  rationale: עַד inaweka kikomo cha wakati, na גמל katika muktadha huu ni kuachishwa kunyonya. Muundo wa ‘mpaka atakapo-’ ni wa kawaida na huhifadhi maana ya kuahirisha safari.
- source_word: הַנַּעַר
  choice: mtoto
  rationale: Ingawa נַעַר inaweza kumaanisha mvulana au kijana, Samweli bado ni mdogo anayenyonya; ‘mtoto’ ndiyo lugha ya kawaida na sahihi kwa muktadha huu.
- source_word: וַהֲבִאֹתִיו
  choice: Kisha nitamleta
  rationale: Muundo huu unaonyesha tendo linalofuata baada ya mtoto kuachishwa kunyonya. ‘Kisha’ huweka wazi mfuatano huo kwa Kiswahili cha kawaida.
- source_word: וְנִרְאָה אֶת־פְּנֵי יְהוָה
  choice: ili aonekane mbele za Yahwe
  rationale: Nifali ya ראה katika nahau hii ya ibada ina maana ya kuonekana au kujitokeza mbele za Mungu. Mtoto amechukuliwa kuwa kiima, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa na cheo, ili kuhifadhi jina la Mungu katika maandishi.
- source_word: וְיָשַׁב שָׁם
  choice: na akae huko
  rationale: ישב hapa ina maana ya kukaa au kubaki mahali hapo; ‘akae huko’ ni ya asili na inaonyesha kuendelea kuishi na kutumikia katika mahali patakatifu.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: עַד עוֹלָם huonyesha muda unaodumu bila kikomo kilichotajwa. ‘Milele’ huhifadhi usemi wa Kiebrania, huku tanbihi ikifafanua maana yake katika muktadha huu.
theological_decisions:
- issue: Kiima cha ‘aonekane mbele za Yahwe’ na ‘akae huko’
  choice: 'Samweli ndiye kiima: ‘aonekane ... na akae huko.’'
  alternative: 'Hana ndiye kiima cha kitenzi cha kwanza: ‘nami nitaonekana mbele za Yahwe, naye atakaa huko milele.’'
  rationale: Baada ya ‘nitamleta,’ mfuatano wa sentensi unaelekea kwa mtoto kama kiima cha kuonekana na kukaa huko, jambo linalopatana na kuwekwa kwake wakfu kwa huduma. Hata hivyo, uchanganuzi au mapokeo mengine ya maandishi yanaelewa kitenzi cha kwanza kuwa na Hana kama kiima; tofauti hiyo imehifadhiwa katika tanbihi.
- issue: Maana ya ‘milele’ katika kuwekwa wakfu kwa Samweli
  choice: Neno ‘milele’ limehifadhiwa katika maandishi, likieleweka katika muktadha kuwa maisha yote ya Samweli.
  alternative: ‘maisha yake yote’
  rationale: Kutafsiri עוֹלָם kwa ‘milele’ huhifadhi upana wa neno la chanzo; tanbihi inaeleza matumizi yake ya kimuktadha bila kupunguza usemi mkuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. ‘Hakupanda kwenda huko’ huhifadhi nahau ya safari ya kupanda kwenda mahali patakatifu huku ikiweka maana wazi; ‘akae huko’ ni ya kawaida kuliko lugha nzito kama ‘adumu huko.’
