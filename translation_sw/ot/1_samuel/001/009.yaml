base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/009.yaml
  text: After they had eaten in Shiloh[a], and after they had drunk, Hannah rose. Now Eli the priest was sitting on the seat by the doorpost of the temple of Yahweh.
translation:
  language: sw
  text: Baada ya Hana kula huko Shilo na kunywa, akainuka. Wakati huo, Eli, kuhani, alikuwa ameketi kwenye kiti kando ya mwimo wa mlango wa hekalu la Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “patakatifu pa Yahwe.”
    reason: Neno הֵיכָל linaweza kutafsiriwa “hekalu” au “patakatifu.”
lexical_decisions:
- source_word: וַתָּקָם
  choice: akainuka
  rationale: Kitenzi קום hapa kinaendeleza simulizi kwa kuonyesha Hana akiinuka ili kutenda jambo; “akainuka” ni la kawaida na lenye hadhi katika Kiswahili.
- source_word: אַחֲרֵי אָכְלָה ... וְאַחֲרֵי שָׁתֹה
  choice: Baada ya kula ... na baada ya kunywa
  rationale: Miundo isiyo na kiima kilichotajwa wazi inahifadhi utata wa Kiebrania kuhusu aliyekula na kunywa, badala ya kulazimisha maana ya “yeye” au “wao.”
- source_word: בְשִׁלֹה
  choice: huko Shilo
  rationale: “Huko Shilo” ni usemi wa asili wa Kiswahili unaoonyesha mahali pa tendo la kula.
- source_word: וְעֵלִי הַכֹּהֵן יֹשֵׁב
  choice: Wakati huo, Eli kuhani alikuwa ameketi
  rationale: Kirai hiki ni maelezo ya hali iliyokuwapo wakati Hana alipoinuka; “wakati huo” na “alikuwa ameketi” vinaonyesha kazi hiyo ya usuli.
- source_word: עַל הַכִּסֵּא
  choice: kwenye kiti
  rationale: כִּסֵּא inaweza kuwa kiti au kiti cha enzi; “kiti” hakiongezi wazo la kifalme lisilolazimishwa na muktadha.
- source_word: עַל מְזוּזַת
  choice: karibu na mwimo wa mlango
  rationale: מְזוּזָה ni mwimo wa mlango, na עַל hapa ina maana ya mahali karibu na mwimo, si kuketi juu yake.
- source_word: הֵיכַל יְהוָה
  choice: hekalu la Yahwe
  rationale: הֵיכָל inaweza kumaanisha hekalu au patakatifu; “hekalu” linafaa katika matini kuu, huku maana mbadala ikihifadhiwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: “Yahwe” linawakilisha jina binafsi lililo katika matini ya Kiebrania bila kulibadilisha kuwa cheo.
- issue: Maana ya הֵיכַל katika Shilo
  choice: hekalu
  alternative: patakatifu
  rationale: Neno la Kiebrania linaweza kumaanisha jengo takatifu au hekalu. “Hekalu” limetumiwa katika matini, lakini “patakatifu” limetolewa katika tanbihi ili kuhifadhi upana wa maana na mazingira ya kabla ya hekalu la Sulemani.
- issue: Kiima cha kula na kunywa
  choice: muundo usiotaja kiima
  alternative: baada ya wao kula na kunywa / baada ya Hana kula na kunywa
  rationale: Maumbo ya Kiebrania na muktadha yameruhusu kutofautiana kuhusu kiima; Kiswahili cha “baada ya kula ... baada ya kunywa” kinahifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na rahisi kueleweka. Muundo usiotaja kiima katika “baada ya kula ... baada ya kunywa” umetumiwa kwa makusudi kuhifadhi utata wa chanzo.
