base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/002.yaml
  text: He had two wives. The name of one was Hannah[a], and the name of the second was Peninnah. Peninnah had children, but Hannah had no children.
translation:
  language: sw
  text: Alikuwa na wake wawili.[a] Jina la mke mmoja lilikuwa Hana, na jina la mke wa pili lilikuwa Penina. Penina alikuwa na watoto, lakini Hana hakuwa na watoto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi zaidi: “Na kwake kulikuwa na wake wawili.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹו
  choice: Alikuwa na
  rationale: Muundo wa Kiebrania unaoonyesha umiliki kwa kihusishi, kihalisi ‘na kwake,’ umetafsiriwa kwa Kiswahili cha kawaida kama ‘alikuwa na.’ Kiunganishi וְ hakijarudiwa kimitambo kwa kuwa mtiririko wa sentensi haukihitaji.
- source_word: שְׁתֵּי נָשִׁים
  choice: wake wawili
  rationale: Katika muktadha huu wa ndoa, נָשִׁים inamaanisha wake, si wanawake kwa ujumla; tafsiri hii pia inaweka wazi hali ya familia yenye wake wawili iliyotajwa na Kiebrania.
- source_word: שֵׁם אַחַת ... וְשֵׁם הַשֵּׁנִית
  choice: Jina la mmoja ... na jina la pili
  rationale: Kiebrania kinarudia neno ‘jina’ katika muundo wa kuwatambulisha wahusika. Kurudia huko kumehifadhiwa kwa namna rasmi lakini inayoeleweka katika Kiswahili.
- source_word: חַנָּה
  choice: Hana
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: פְּנִנָּה
  choice: Penina
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: וַיְהִי לִפְנִנָּה יְלָדִים
  choice: Penina alikuwa na watoto
  rationale: Kishazi cha uwepo na umiliki kimetolewa kwa Kiswahili cha kawaida. יְלָדִים ni neno pana linalomaanisha watoto na halibainishi jinsia zao katika mstari huu.
- source_word: וּלְחַנָּה אֵין יְלָדִים
  choice: lakini Hana hakuwa na watoto
  rationale: אֵין huonyesha kutokuwapo, na kwa Kiswahili cha kawaida hapa ni ‘hakuwa na.’ ‘Lakini’ linaonyesha wazi utofauti uliomo katika ulinganisho wa hali ya Penina na Hana.
