base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/016.yaml
  text: Do not regard your servant as a worthless woman[b][a], for out of the abundance of my complaint and my vexation I have spoken until now.
translation:
  language: sw
  text: Usimhesabu mjakazi wako kuwa mwanamke mwovu[a], kwa maana kwa wingi wa malalamiko yangu na fadhaa yangu nimekuwa nikisema mpaka sasa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “binti wa kutokuwa na maana,” nahau inayomaanisha mwanamke mwovu au asiyeheshimika.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa sababu ya malalamiko yangu mengi na fadhaa yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן ... לִפְנֵי
  choice: Usimhesabu ... kuwa
  rationale: Muundo huu wa Kiebrania hapa una maana ya kumwona au kumhesabu mtu kuwa wa aina fulani, si ‘kutoa mbele ya’ kwa maana ya mahali.
- source_word: אֲמָתְךָ
  choice: mtumishi wako
  rationale: Ni namna ya Hana kujitaja kwa unyenyekevu. Kiswahili ‘mtumishi wako’ ni cha kawaida na kinachoeleweka; jinsia yake inaonekana katika neno ‘mwanamke’ linalofuata.
- source_word: בַּת בְּלִיָּעַל
  choice: mwanamke mwovu
  rationale: Nahau hii, kihalisi ‘binti wa kutokuwa na thamani,’ humaanisha mwanamke mwenye tabia mbaya au asiyeheshimika. ‘Mwanamke mwovu’ huwasilisha hukumu ya kimaadili kwa Kiswahili cha kawaida bila kufasiri ‘Beliali’ kuwa jina maalumu.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza maelezo ya Hana kuhusu sababu ya kusema kwake.
- source_word: מֵרֹב
  choice: kwa sababu ya wingi wa
  rationale: Huhifadhi wazo la kiwango kikubwa cha dhiki kilichomsukuma kusema.
- source_word: שִׂיחִי
  choice: malalamiko yangu
  rationale: Neno linaweza kumaanisha tafakari yenye taabu au malalamiko; katika sala ya Hana, ‘malalamiko’ yanafaa huku utata wa kile alichokuwa akimimina mbele za Mungu ukidokezwa katika tanbihi.
- source_word: וְכַעְסִי
  choice: na huzuni yangu
  rationale: Katika muktadha huu neno linaonyesha maumivu na fadhaa ya ndani, si lazima hasira ya dhambi. ‘Huzuni’ ni ya kawaida na asilia katika Kiswahili.
- source_word: דִּבַּרְתִּי עַד הֵנָּה
  choice: nimesema mpaka sasa
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililoendelea hadi wakati huu, na ‘mpaka sasa’ ni maana ya nahau ya wakati.
theological_decisions:
- issue: Maana ya בְּלִיָּעַל
  choice: Imetafsiriwa kama sifa ya uovu wa kimaadili, ‘mwovu.’
  alternative: Kuichukulia kama jina maalumu ‘Beliali.’
  rationale: Katika matumizi haya ya Kiebrania, neno ni sehemu ya nahau ‘binti wa kutokuwa na thamani/uovu’ na halilazimishi kutajwa kwa kiumbe au jina maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi ombi la unyenyekevu la Hana na maelezo yake ya dhiki bila kutumia msamiati wa kimadhehebu.
