base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/019.yaml
  text: They rose early in the morning and bowed down before Yahweh[a]. Then they returned and came to their house at Ramah, and Elkanah knew Hannah his wife[b], and Yahweh remembered her.
translation:
  language: sw
  text: Wakaamka asubuhi na mapema, wakasujudu mbele za Yahwe. Kisha wakarudi, wakafika nyumbani kwao huko Rama. Elkana akamjua Hana, mke wake[a], naye Yahwe akamkumbuka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “akamjua” ni tamathali ya staha inayomaanisha kuwa na mahusiano ya kingono ndani ya ndoa.
    reason: lexical_alternative
  - marker: b
    text: Katika Kiebrania, Mungu anaposemwa kwamba “anamkumbuka” mtu, mara nyingi ni zaidi ya kumrejesha akilini; inaweza kumaanisha kumwelekea kwa uaminifu na kumtendea jambo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: Wakaamka asubuhi na mapema
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha wazi kuamka mapema, kama inavyodai kitenzi cha Kiebrania pamoja na neno ‘asubuhi’.
- source_word: וַיִּשְׁתַּחֲווּ לִפְנֵי יְהוָה
  choice: wakasujudu mbele za Yahwe
  rationale: ‘Kusujudu’ huhifadhi tendo halisi la kuinama kwa heshima na ibada, badala ya kulifanya kuwa wazo la jumla la kuabudu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo la Kiswahili linalowakilisha Tetragramatoni, badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: וַיָּשֻׁבוּ וַיָּבֹאוּ אֶל־בֵּיתָם הָרָמָתָה
  choice: Kisha wakarudi, wakafika nyumbani kwao huko Rama
  rationale: 'Vitenzi vyote viwili vya mwendo vimehifadhiwa: walirudi, kisha wakafika nyumbani kwao katika Rama.'
- source_word: וַיֵּדַע אֶלְקָנָה אֶת־חַנָּה אִשְׁתּוֹ
  choice: Elkana akamjua Hana, mke wake
  rationale: ‘Akamjua’ huhifadhi tamathali ya staha ya Kiebrania kuhusu mahusiano ya ndoa; tanbihi inaeleza maana yake ili msomaji wa sasa asipotoshwe.
- source_word: וַיִּזְכְּרֶהָ יְהוָה
  choice: Yahwe akamkumbuka
  rationale: ‘Akamkumbuka’ huhifadhi nahau ya simulizi la Kiebrania bila kutangulia kueleza tendo au matokeo ambayo mstari huu bado haujataja.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko lina jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kuliwakilisha kwa cheo.
- issue: Iwapo tamathali ya ngono ifanywe wazi katika matini kuu
  choice: Kuhifadhi ‘akamjua’ na kuifafanua katika tanbihi
  alternative: alilala na; alikuwa na mahusiano ya ndoa na
  rationale: Kiebrania kimetumia kwa makusudi tamathali ya staha. Kuihifadhi hudumisha mtindo wa chanzo, huku tanbihi ikihakikisha maana inaeleweka.
- issue: Maana ya Mungu ‘kumkumbuka’ Hana
  choice: Kuhifadhi ‘akamkumbuka’
  alternative: akamwangalia kwa fadhili; akamjalia ombi lake
  rationale: Katika simulizi la Kiebrania, kumkumbuka kwa Mungu mara nyingi huashiria kujali kunakoleta tendo, si kurejesha jambo akilini tu. Hata hivyo, mstari huu hautaji wazi matokeo, kwa hiyo tafsiri haipaswi kuyaingiza mapema.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wa heshima. Majina yametolewa kama Elkana, Hana, Rama, na Yahwe. Tamathali na mvutano wa kitheolojia wa chanzo vimehifadhiwa, huku tanbihi zikitoa ufafanuzi bila kuingiza hitimisho katika matini kuu.
