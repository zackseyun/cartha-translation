  yaml_path: translation/ot/1_samuel/023/020.yaml
  text: Now then[a], O king, come down according to all the desire of your soul to come down[b], and it is for us to hand him over into the king’s hand.
translation:
  language: sw
  text: Basi sasa, ee mfalme, shuka kadiri ya matamanio yote ya moyo wako ya kushuka[a]; nasi tutamkabidhi mikononi mwa mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinarudia kitenzi “shuka” kwa msisitizo: “kushuka, shuka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Inaonyesha mpito wa haraka na kuanzisha ombi kwa Kiswahili cha kawaida.
- source_word: לְכָל אַוַּת נַפְשְׁךָ
  choice: kama moyo wako unavyotamani sana
  rationale: Kirai cha Kiebrania kinamaanisha kutenda kulingana na tamaa kubwa ya nafsi; ‘moyo wako’ ni nahau ya asili na inayoeleweka katika Kiswahili, huku ‘sana’ ikiwakilisha nguvu ya כָל katika muktadha.
- source_word: הַמֶּלֶךְ
  choice: ee mfalme
  rationale: Nomino yenye kibainishi imetumiwa kama mwito wa moja kwa moja; ‘ee mfalme’ huonyesha wazi heshima na mwito huo.
- source_word: לָרֶדֶת רֵד
  choice: shuka ... kushuka
  rationale: Muundo wa kitenzi-jina ukifuatwa na amri unasisitiza kitendo. Marudio yamehifadhiwa kwa namna inayoeleweka katika Kiswahili.
- source_word: וְלָנוּ
  choice: nasi
  rationale: Katika muktadha huu inaonyesha kwamba jukumu linalofuata ni lao; muundo mfupi ‘nasi’ ni wa asili pamoja na kitenzi kinachofuata.
- source_word: הַסְגִּירוֹ
  choice: tutamtia
  rationale: Hiphil ya סגר hapa ni kumkabidhi mtu chini ya mamlaka ya mwingine. Pamoja na ‘mikononi mwa,’ ‘tutamtia’ huwasilisha dhana hiyo kwa Kiswahili cha kawaida.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: mikononi mwa mfalme
  rationale: Nahau ya Kiebrania kuhusu kuingia chini ya mamlaka ya mtu imehifadhiwa kwa nahau sambamba ya Kiswahili.
