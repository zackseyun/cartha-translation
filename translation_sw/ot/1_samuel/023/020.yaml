translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya simulizi, yenye heshima katika kumwambia mfalme, na inaeleweka kwa wasomaji wa kawaida. Nahau ya ‘tamaa ya nafsi’ imetolewa kwa Kiswahili asilia kama ‘moyo wako unavyotamani sana,’ huku marudio ya kitenzi cha Kiebrania yakihifadhiwa na kufafanuliwa katika tanbihi.
