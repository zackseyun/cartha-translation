  to: Sauli alikuwa akienda upande mmoja wa mlima,[a] naye Daudi na watu wake walikuwa upande mwingine wa mlima. Daudi alikuwa akiharakisha kuondoka mbele ya Sauli, huku Sauli na watu wake wakiwazingira Daudi na watu wake ili kuwakamata.[b][c]
