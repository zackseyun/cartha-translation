base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/026.yaml
  text: Saul was going on one side of the mountain[a], and David and his men were on the other side of the mountain. David was hurrying to go away from Saul[c][b], while Saul and his men were closing in on David and his men to capture them.
translation:
  language: sw
  text: Sauli alikuwa akienda upande mmoja wa mlima,[a] naye Daudi na watu wake walikuwa upande mwingine wa mlima. Daudi alikuwa akiharakisha kuondoka mbele ya Sauli, huku Sauli na watu wake wakiwazingira Daudi na watu wake ili kuwakamata.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kwa maana halisi, “Sauli alikuwa akienda upande wa mlima kutoka upande huu, nao Daudi na watu wake walikuwa upande wa mlima kutoka upande huu.” Tafsiri imetumia “upande mmoja” na “upande mwingine” ili kuonyesha utofauti uliokusudiwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “walikuwa wakiwakaribia Daudi na watu wake.”
    reason: alternative_reading
  - marker: c
    text: Au, “ili kuwashika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: alikuwa akienda
  rationale: Muundo wa kuendelea unaonyesha harakati ya Sauli iliyokuwa ikiendelea wakati Daudi na watu wake walikuwa upande mwingine wa mlima.
- source_word: מִצַּד הָהָר מִזֶּה ... מִצַּד הָהָר מִזֶּה
  choice: upande mmoja wa mlima ... upande mwingine wa mlima
  rationale: Ingawa Kiebrania kinarudia kwa namna halisi ‘upande huu,’ Kiswahili hiki kinaeleza wazi utofauti wa mahali walipokuwa bila kupoteza picha ya pande mbili za mlima.
- source_word: נֶחְפָּז
  choice: alikuwa akiharakisha
  rationale: Neno linaonyesha haraka ya dharura, si lazima hofu au wasiwasi wa ndani.
- source_word: לָלֶכֶת מִפְּנֵי שָׁאוּל
  choice: kwenda mbali na Sauli
  rationale: Hii inadumisha wazo la msingi la kuondoka kutoka mbele ya Sauli bila kutumia kitenzi chenye nguvu zaidi kama ‘kukimbia.’
- source_word: עֹטְרִים
  choice: wakiwakaribia ... kutoka pande zote
  rationale: Katika muktadha huu, kitenzi kinaonyesha vikosi vya Sauli vikisonga kutoka pande mbalimbali ili kuwafungia Daudi na watu wake; tanbihi inahifadhi tafsiri ya moja kwa moja zaidi ya ‘kuwazunguka.’
- source_word: לְתָפְשָׂם
  choice: ili kuwakamata
  rationale: Infinitivu inaonyesha kusudi, na ‘kuwakamata’ inafaa kwa muktadha wa msako wa kijeshi.
