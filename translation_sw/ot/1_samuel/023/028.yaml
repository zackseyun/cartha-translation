base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/028.yaml
  text: So Saul returned from pursuing David and went to meet the Philistines. Therefore that place was called the Rock of Division[a].
translation:
  language: sw
  text: Basi Sauli akarudi kutoka kumfuatia Daudi, akaenda kukutana na Wafilisti. Kwa hiyo, mahali pale pakaitwa Mwamba wa Matengano[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwamba wa Migawanyiko” au “Mwamba wa Kuachana.” Huenda jina hilo linarejelea kutengana kwa Sauli na Daudi wakati Sauli alipoacha kumfuatia Daudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: akaacha
  rationale: Katika muundo מִרְדֹף, kitenzi שוב kinaonyesha kwamba Sauli aligeuka kutoka katika hatua aliyokuwa akiendelea nayo. “Akaacha” huwasilisha kwa Kiswahili cha kawaida kusitisha huko bila kudokeza kwamba alirudi mahali fulani.
- source_word: מִרְדֹף אַחֲרֵי
  choice: kumfuatia
  rationale: רדף katika simulizi hili ni kumwandama au kumfuatia mtu kwa lengo la kumkamata. “Kumfuatia” ni ya asili na inaendana na muktadha wa kijeshi bila kuwa ya mazungumzo mno.
- source_word: לִקְרַאת
  choice: kukutana na
  rationale: Neno hili linaweza kumaanisha kwenda kumlaki, kukutana na, au kumkabili mtu. “Kukutana na” huhifadhi upana wa Kiebrania; muktadha unaonyesha kwamba mkutano huo ulihusiana na tishio la kijeshi.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili cha Biblia.
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Kauli hii hutambulisha sababu ya jina la mahali. “Kwa hiyo” ni wazi, fupi, na ya kawaida katika Kiswahili sanifu.
- source_word: קָרְאוּ לַמָּקוֹם הַהוּא
  choice: mahali pale pakaitwa
  rationale: Kiebrania hutumia wingi usio na mtendaji aliyetajwa. Kauli ya kutendwa katika Kiswahili huepuka kuongeza mtendaji ambaye maandishi hayamtaji.
- source_word: סֶלַע
  choice: Mwamba
  rationale: סֶלַע humaanisha mwamba au jabali. “Mwamba” ni chaguo la moja kwa moja na linafaa kama sehemu ya jina la mahali.
- source_word: הַמַּחְלְקוֹת
  choice: Matengano
  rationale: Nomino hii inayohusiana na חלק hudokeza kugawanyika, kutengana, au kuachana. “Matengano” linafaa kwa jina la mahali na linaakisi kutenganishwa kwa Sauli na Daudi wakati Sauli alipoacha kumfuatia.
