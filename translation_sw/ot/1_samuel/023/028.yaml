  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. Tafsiri imehifadhi upana wa לִקְרַאת na kutokuwa na uhakika kamili kuhusu maana ya jina סֶלַע הַמַּחְלְקוֹת.
