base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/025.yaml
  text: So Saul and his men went to seek him. And they told David[a], so he went down to the rock and stayed in the wilderness of Maon. When Saul heard, he pursued David in the wilderness of Maon.
translation:
  language: sw
  text: Basi Sauli na watu wake wakaenda kumtafuta Daudi. Watu wakamjulisha Daudi, naye akashuka hadi kwenye mwamba[a] akakaa katika nyika ya Maoni. Sauli aliposikia habari hiyo, akamfuata Daudi katika nyika ya Maoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jabali” au “mwamba mwinuko.” Huenda Kiebrania kinarejelea ngome au sehemu maarufu yenye miamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַקֵּשׁ
  choice: kumtafuta Daudi
  rationale: Kitenzi-jina kinaonyesha kusudi la kwenda. Yambwa ‘Daudi’ linaeleweka kutokana na muktadha na limetajwa wazi kwa ufasaha wa Kiswahili.
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: Watu wakamjulisha Daudi
  rationale: Kitenzi cha Kiebrania ni cha nafsi ya tatu wingi lakini mtendaji hajatajwa. ‘Watu’ huhifadhi hali hiyo ya jumla kwa Kiswahili cha kawaida bila kugeuza sentensi kuwa tendwa.
- source_word: וַיֵּרֶד
  choice: akashuka
  rationale: Huhifadhi maana ya mwendo kuelekea chini kwa lugha fupi na ya kawaida.
- source_word: הַסֶּלַע
  choice: mwamba
  rationale: Neno linaweza kumaanisha mwamba, jabali, au genge la mawe. ‘Mwamba’ huhifadhi picha ya msingi bila kufafanua kupita ushahidi wa matini.
- source_word: וַיֵּשֶׁב
  choice: kukaa
  rationale: Katika muktadha huu linaonyesha kubaki au kukaa mahali; ‘kukaa’ ni la kawaida na halidokezi makazi ya kudumu.
- source_word: בְּמִדְבַּר מָעוֹן / מִדְבַּר מָעוֹן
  choice: katika nyika ya Maoni
  rationale: מִדְבָּר si lazima iwe jangwa la mchanga; ‘nyika’ linafaa kwa eneo la pori lisilokaliwa sana. Jina Maoni limeandikwa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: akamfuatilia
  rationale: Msemo huu una maana ya kumwandama au kumfuata mtu kwa kusudi la kumkamata. ‘Kumfuatilia’ ni wa asili na huhifadhi kitendo cha kuendelea kumtafuta.
- source_word: וַיֵּלֶךְ שָׁאוּל וַאֲנָשָׁיו
  choice: Basi Sauli na watu wake wakaenda
  rationale: ‘Basi’ huendeleza simulizi kama waw-consecutive na pia huonyesha matokeo ya muktadha uliotangulia.
theological_decisions: []
