base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/021.yaml
  text: Saul said[a], “May you be blessed by Yahweh[b], because you have had compassion on me.”
translation:
  language: sw
  text: Sauli akasema, “Mbarikiwe na Yahweh[a], kwa sababu mmenihurumia[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mmebarikiwa na Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kina maana ya kuhurumia au kusikitikia; katika baadhi ya miktadha kinaweza pia kumaanisha kutomwangamiza mtu au kumwacha hai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Ni namna ya kawaida ya Kiswahili ya kuendeleza mfululizo wa simulizi unaoonyeshwa na wayyiqtol ya Kiebrania.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: בְּרוּכִים אַתֶּם
  choice: Mbarikiwe
  rationale: Kauli hii ni tamko la baraka kwa watu wengi; umbo la kutakia linaonyesha nguvu yake ya kiutendaji kwa Kiswahili cha kawaida.
- source_word: לַיהוָה
  choice: na Yahweh
  rationale: Katika kauli hii ya baraka, לַיהוָה humhusisha Yahweh kama chanzo au mtendaji wa baraka; ‘na Yahweh’ ni usemi wa asili wa Kiswahili.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya Sauli kutamka baraka.
- source_word: חֲמַלְתֶּם
  choice: mmenihurumia
  rationale: Kitenzi חמל hapa, kikiwa na עָלַי, kinaeleza huruma iliyoelekezwa kwa Sauli; katika miktadha mingine kinaweza pia kuhusisha kutomwangamiza au kumwacha hai.
- source_word: עָלַי
  choice: -ni- katika ‘mmenihurumia’
  rationale: Kiswahili huweka yambwa ndani ya kitenzi; hivyo maana ya ‘juu yangu/kwangu’ imewasilishwa kiasili kwa kiambishi cha yambwa -ni-.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה. ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Nguvu ya kauli בְּרוּכִים אַתֶּם
  choice: Mbarikiwe
  alternative: Mmebarikiwa
  rationale: Muundo unaweza kusomeka kama hali iliyotangazwa, lakini katika muktadha huu una nguvu ya kutamka au kutakia baraka; tafsiri kuu inahifadhi nguvu hiyo bila kuifanya kuwa fundisho maalumu kuhusu namna baraka hutolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Wingi wa wazungumziwa umehifadhiwa katika ‘mbarikiwe’ na ‘mmenihurumia’; sentensi imewekwa kwa mtiririko wa kawaida wa simulizi.
