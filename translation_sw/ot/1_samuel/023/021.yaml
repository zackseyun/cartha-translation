  source_fidelity: 'Tafsiri inahifadhi vipengele vikuu vya Kiebrania: mtendaji Sauli, kauli ya baraka kwa wingi, Yahweh kama chanzo cha baraka, na sababu kwamba wasikilizaji wamemhurumia Sauli. ‘Mbarikiwe na Yahweh’ inawakilisha ipasavyo nguvu ya fomula בְּרוּכִים אַתֶּם, ingawa kimaumbo chanzo kinaweza pia kusomwa kama tamko, kama dokezo linavyoonyesha. ‘Mmenihurumia’ ni tafsiri sahihi ya חֲמַלְתֶּם עָלַי katika muktadha huu.'
