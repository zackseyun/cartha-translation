base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/003.yaml
  text: But David’s men said to him[a], “Look, we are afraid here in Judah; how much more, then, if we go to Keilah against the battle lines of the Philistines?”
translation:
  language: sw
  text: Lakini watu wa Daudi wakamwambia[a], “Tazama, tunaogopa hapa Yuda; sembuse tukienda Keila kukabiliana na safu za Wafilisti?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “si zaidi sana tukikwenda Keila kukabiliana na safu za Wafilisti?” Nahau ya Kiebrania inaonyesha hoja kutoka hali ndogo kwenda hali kubwa zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lakini ... wakamwambia
  rationale: Kiunganishi kinaendeleza simulizi, lakini katika muktadha jibu la watu linaonyesha kusita na kutofautiana na agizo lililotangulia; kwa hiyo “Lakini” linafaa kwa Kiswahili cha kawaida.
- source_word: אַנְשֵׁי דָוִד
  choice: watu wa Daudi
  rationale: Hii ni tafsiri ya kawaida na ya asili ya muundo wa umilikaji, ikitaja kundi la watu walio chini ya Daudi.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linaanzisha msisitizo wa ombi lao. “Tazama” ni la heshima na linaeleweka katika mtindo wa Biblia bila kutumia lugha nzito kupita kiasi.
- source_word: אֲנַחְנוּ פֹה בִּיהוּדָה יְרֵאִים
  choice: sisi tunaogopa hapa Yuda
  rationale: Mpangilio huu unasikika kwa kawaida katika Kiswahili na unahifadhi msisitizo wa kiwakilishi “sisi,” hali ya hofu, na mahali walipo.
- source_word: וְאַף כִּי
  choice: si zaidi sana ...?
  rationale: 'Nahau hii inatoa hoja kutoka hali ndogo kwenda iliyo kubwa zaidi: ikiwa wanaogopa wakiwa Yuda, watakuwa na sababu kubwa zaidi ya kuogopa wakienda Keila. Muundo wa swali unaleta mantiki hiyo kwa Kiswahili cha asili.'
- source_word: נֵלֵךְ קְעִלָה
  choice: tukienda Keila
  rationale: Kitenzi pamoja na jina la mahali kinaonyesha kwenda kwenye mahali palipokusudiwa.
- source_word: אֶל מַעַרְכוֹת פְּלִשְׁתִּים
  choice: kukabiliana na safu za vita za Wafilisti
  rationale: מַעַרְכוֹת humaanisha safu au mpangilio wa kijeshi. “Kukabiliana na” linaweka wazi mwelekeo wa uadui unaodokezwa na muktadha bila kupanua maana kuwa majeshi yote.
