base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/017.yaml
  text: He said to him[a], “Do not be afraid, for the hand of Saul my father will not find you. You will reign over Israel, and I will be second to you[b]. Even Saul my father knows this.”
translation:
  language: sw
  text: Akamwambia, “Usiogope, kwa maana mkono wa Sauli baba yangu hautakupata[a]. Wewe utatawala Israeli, nami nitakuwa wa pili baada yako[b]. Hata Sauli baba yangu anajua kwamba ni hivyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguvu za Sauli baba yangu hazitakufikia.” Kiebrania kinasema, “mkono wa Sauli baba yangu hautakupata,” kikitumia “mkono” kumaanisha nguvu au uwezo wa kumkamata mtu.
    reason: lexical_alternative
  - marker: b
    text: Au, “nami nitakuwa wa pili katika mamlaka baada yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Usiogope
  rationale: Ni kauli ya kawaida na ya moja kwa moja katika Kiswahili kwa amri hasi inayotokana na kitenzi ירא, huku ikihifadhi uzito wa kumtia moyo mtu asiwe na hofu.
- source_word: לֹא תִמְצָאֲךָ יַד שָׁאוּל אָבִי
  choice: mkono wa Sauli baba yangu hautakupata
  rationale: Inahifadhi picha halisi ya Kiebrania ya “mkono” kama ishara ya nguvu au uwezo wa kumkamata mtu, pamoja na kitenzi “kupata,” bila kuibadili kimya kimya kuwa “kukamata” au “kukudhuru.”
- source_word: וְאַתָּה תִּמְלֹךְ עַל יִשְׂרָאֵל
  choice: Wewe utatawala Israeli
  rationale: “Utatawala” linawakilisha kitenzi מלך kwa Kiswahili cha kawaida na linaonyesha wazi utawala wa kifalme katika muktadha bila kubadili kitenzi kuwa cheo cha nomino.
- source_word: וְאָנֹכִי אֶהְיֶה לְּךָ לְמִשְׁנֶה
  choice: nami nitakuwa wa pili kwako
  rationale: Kauli hii inahifadhi wazo la nafasi ya pili au ya chini yake bila kuingiza cheo cha kisasa cha kiutawala. Tanbihi inaonyesha tafsiri iliyo wazi zaidi kimamlaka.
- source_word: וְגַם שָׁאוּל אָבִי יֹדֵעַ כֵּן
  choice: Hata Sauli baba yangu anajua kwamba ndivyo itakavyokuwa
  rationale: “Hata” linaonyesha nguvu ya וְגַם katika muktadha, na “kwamba ndivyo itakavyokuwa” linaelekeza kwa kawaida kwenye yaliyosemwa kuhusu utawala wa Daudi na nafasi ya Yonathani.
theological_decisions:
- issue: Kiwango cha uwazi kuhusu matarajio ya Yonathani kwamba Daudi atakuwa mfalme na yeye atakuwa chini yake
  choice: Kauli imetafsiriwa kama matarajio ya moja kwa moja ya kisiasa na ya wakati ujao bila kuongeza lugha ya agano, unabii, au Umasihi.
  alternative: Kuitafsiri waziwazi kama unabii wa uteuzi wa Mungu.
  rationale: Mstari unasema kwa uthabiti kwamba Daudi atatawala na Yonathani atakuwa wa pili kwake, lakini haumtajii BWANA katika sentensi hii. Tafsiri haiongezi ufafanuzi wa kiteolojia ambao haujatamkwa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Picha ya Kiebrania ya “mkono” imehifadhiwa katika matini kuu, huku maana yake ikifafanuliwa katika tanbihi. Viwakilishi vya msisitizo “Wewe” na “nami” vinahifadhi utofautishaji wa Kiebrania kati ya Daudi na Yonathani.
