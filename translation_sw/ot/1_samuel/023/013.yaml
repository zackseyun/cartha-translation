base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/013.yaml
  text: Then David arose with his men[a], about six hundred men, and they went out from Keilah and went wherever they could go. And it was told to Saul that David had escaped from Keilah[b], so he stopped going out.
translation:
  language: sw
  text: Ndipo Daudi akainuka pamoja na watu wake, wapatao wanaume mia sita, nao wakatoka Keila, wakazunguka popote walipoweza kwenda.[a] Sauli akaambiwa kwamba Daudi alikuwa ameponyoka kutoka Keila; basi akaacha kwenda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakaenda huku na huku popote walipoweza kwenda.” Usemi wa Kiebrania unasisitiza kuendelea kuhama kutoka mahali hadi mahali.
    reason: lexical_alternative
  - marker: b
    text: “Akaacha kwenda” yaelekea kumaanisha kwamba Sauli aliacha kwenda kumfuata Daudi baada ya kusikia kwamba Daudi alikuwa ameponyoka kutoka Keila.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם דָּוִד וַאֲנָשָׁיו
  choice: Ndipo Daudi akaondoka pamoja na watu wake
  rationale: קום katika mfululizo huu wa simulizi huonyesha kuinuka na kuanza kuchukua hatua. ‘Akaondoka’ ni ya kawaida katika Kiswahili na haiharakishi maana kuwa tayari walikuwa wametoka Keila, jambo linalotajwa baadaye.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: wapatao wanaume mia sita
  rationale: Kiambishi כְּ huonyesha makadirio; ‘wapatao’ huwasilisha takriban. ‘Wanaume’ inafaa kwa kundi la wapiganaji wa Daudi katika muktadha huu.
- source_word: וַיֵּצְאוּ מִקְּעִלָה
  choice: nao wakatoka Keila
  rationale: יצא ni ‘kutoka’; tafsiri hii huhifadhi picha ya kuondoka ndani ya mji huku ikiwa ya asili katika Kiswahili.
- source_word: וַיִּתְהַלְּכוּ בַּאֲשֶׁר יִתְהַלָּכוּ
  choice: wakazunguka popote walipoweza kwenda
  rationale: Muundo unaorudia הלך unaonyesha mwendo wa kuendelea kutoka mahali hadi mahali. ‘Wakazunguka’ huwasilisha hali hiyo bila kudai kwamba hawakuwa na kusudi.
- source_word: וּלְשָׁאוּל הֻגַּד
  choice: Sauli akaambiwa
  rationale: Hophal ya נגד ni kauli tendwa, ‘aliambiwa/iliarifiwa.’ Kiswahili cha kawaida hupendelea kumweka mpokeaji kama kiima kuliko kauli isiyo na mtendaji.
- source_word: כִּי נִמְלַט דָּוִד מִקְּעִילָה
  choice: kwamba Daudi alikuwa ameponyoka kutoka Keila
  rationale: נמלט humaanisha kuponyoka au kutoroka hatarini. ‘Alikuwa ameponyoka’ huonyesha kwamba tukio hilo lilitangulia taarifa aliyopewa Sauli.
- source_word: וַיֶּחְדַּל לָצֵאת
  choice: basi akaacha kwenda
  rationale: חדל pamoja na kitenzi-jina humaanisha kuacha kufanya jambo. Tafsiri inahifadhi usemi mfupi na usioeleza wazi wa Kiebrania; muktadha unaonyesha safari ya kumfuata Daudi.
