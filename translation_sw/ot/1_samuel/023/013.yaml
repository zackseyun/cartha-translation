translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Majina yametolewa kama Daudi, Sauli, na Keila. Utata wa kifungu cha mwisho umehifadhiwa katika maandishi na kufafanuliwa kwa tahadhari katika tanbihi.
