lexical_decisions:
- source_word: מַלְאָךְ
  choice: mjumbe
  rationale: Katika muktadha huu neno hili linamaanisha mtu aliyeleta taarifa, si lazima kiumbe wa mbinguni.
- source_word: מַהֲרָה וְלֵכָה
  choice: Fanya haraka, uje
  rationale: Kauli mbili za amri zimehifadhiwa kwa Kiswahili cha kawaida; 'uje' huwasilisha mwito wa Sauli kwenda alikokuwa mjumbe au kwenye eneo linalohitaji msaada.
- source_word: פָשְׁטוּ
  choice: wameivamia
  rationale: Kitenzi kinaonyesha kufanya shambulio la ghafla au uvamizi; 'wameivamia' ni cha asili na kinafaa katika simulizi la kijeshi.
- source_word: עַל הָאָרֶץ
  choice: nchi
  rationale: Muktadha unaonyesha eneo la Israeli lililoshambuliwa; kiambishi katika 'wameivamia' kinawasilisha uhusiano wa 'dhidi ya/juu ya nchi' bila kuongeza ufafanuzi usiotajwa.
