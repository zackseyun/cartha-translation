base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/023.yaml
  text: See and find out from all the hiding places where he hides there, then return to me with certainty, and I will go with you. And if he is in the land, I will search him out among all the clans of Judah.
translation:
  language: sw
  text: Chunguzeni na mpate habari za maficho yote ambamo hujificha; kisha mrudi kwangu mkiwa na taarifa za hakika, nami nitakwenda pamoja nanyi. Ikiwa yuko katika nchi, nitamsaka katika koo zote za Yuda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “maelfu yote ya Yuda”; huenda neno hilo linamaanisha koo au migawanyiko ya kifamilia ndani ya Yuda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאוּ וּדְעוּ
  choice: Chunguzeni na mjue
  rationale: Vitenzi viwili vya amri vinadumishwa. Katika muktadha huu, ראה ina maana ya kuchunguza, huku ידע ikisisitiza kupata ujuzi wa hakika.
- source_word: מִכֹּל הַמַּחֲבֹאִים אֲשֶׁר יִתְחַבֵּא שָׁם
  choice: maficho yote anakojificha
  rationale: Neno מַחֲבֹא linamaanisha mahali pa kujificha. Muundo huu ni wa kawaida katika Kiswahili na unadumisha wazo la kuchunguza sehemu zote ambako Daudi hujificha, bila kurudia kwa namna isiyo ya kawaida kiwakilishi cha mahali cha Kiebrania.
- source_word: וְשַׁבְתֶּם אֵלַי אֶל נָכוֹן
  choice: kisha mrudi kwangu mkiwa na uhakika
  rationale: Waw inaonyesha hatua inayofuata, na אֶל נָכוֹן hapa inaeleza kurudi baada ya kuthibitisha taarifa kwa uhakika.
- source_word: וְהָלַכְתִּי אִתְּכֶם
  choice: nami nitakwenda pamoja nanyi
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya ahadi ya Sauli kwamba ataandamana nao.
- source_word: וְהָיָה אִם יֶשְׁנוֹ בָאָרֶץ
  choice: Ikiwa yumo nchini
  rationale: Muundo wa sharti umetolewa kwa Kiswahili cha kawaida. 'Yumo' inadumisha maana ya kuwapo kwake ndani ya eneo linalozungumziwa.
- source_word: וְחִפַּשְׂתִּי אֹתוֹ
  choice: nitamsaka
  rationale: חפשׂ ina maana ya kutafuta kwa makini; 'nitamsaka' ni fupi, ya asili, na inaonyesha jitihada makusudi za kumpata.
- source_word: בְּכֹל אַלְפֵי יְהוּדָה
  choice: katika koo zote za Yuda
  rationale: Ingawa אַלְפֵי kwa umbo ni 'maelfu,' hapa inaelekea kutaja vikundi vya kijamii au kifamilia vya Yuda. 'Koo' huwasilisha maana hiyo kwa msomaji wa kawaida, huku maana halisi ikihifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Muundo unadumisha mfululizo wa maagizo, uhakika wa taarifa unaotakiwa, na maana ya kijamii ya אַלְפֵי bila kuficha tafsiri yake halisi.
