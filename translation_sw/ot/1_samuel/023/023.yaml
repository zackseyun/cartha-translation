revisions:
- from: Chunguzeni na mjue maficho yote anakojificha, kisha mrudi kwangu mkiwa na uhakika, nami nitakwenda pamoja nanyi. Ikiwa yumo nchini, nitamsaka katika koo zote za Yuda.[a]
  to: Chunguzeni na mpate habari za maficho yote ambamo hujificha; kisha mrudi kwangu mkiwa na taarifa za hakika, nami nitakwenda pamoja nanyi. Ikiwa yuko katika nchi, nitamsaka katika koo zote za Yuda.[a]
  rationale: The revision clarifies the investigative force of the first two imperatives, expresses the required confirmed intelligence more explicitly, and avoids narrowing ‘the land’ to the modern sense of a country. It retains the contextual rendering ‘koo’ and its literal Hebrew alternative in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T21:45:07Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the command sequence, the requirement for confirmed intelligence, Saul's promise to accompany them, the conditional clause, and the likely clan sense of אַלְפֵי. However, “mjue maficho yote” is not fully idiomatic for the investigative sense of ‘ascertain/find out about all the hiding places,’ and “nchini” can imply a modern nation-state rather than the land/territory in view.
  naturalness: The revision uses natural Standard East African Swahili while retaining the Hebrew sequence and scope. “Mpate habari za” makes the required intelligence explicit, and “katika nchi” is more contextually neutral than “nchini.”
  terminology: “Koo zote za Yuda” is an appropriate contextual rendering of אַלְפֵי יְהוּדָה, with the literal ‘thousands’ retained in the footnote. The name Yuda is correctly rendered. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: “mjue maficho yote” is semantically and idiomatically imprecise.
    rationale: Kujua maficho can be understood as simply knowing the hiding places, whereas the Hebrew paired imperatives call for investigation and the acquisition of reliable information concerning every place where David hides. “Mpate habari za maficho yote” expresses this naturally.
  - severity: low
    issue: “nchini” is more specific than the Hebrew’s ‘in the land.’
    rationale: In contemporary Swahili, nchini commonly denotes being within a country. “Katika nchi” more directly preserves the territorial wording without adding a modern political nuance.
  revised_text: Chunguzeni na mpate habari za maficho yote ambamo hujificha; kisha mrudi kwangu mkiwa na taarifa za hakika, nami nitakwenda pamoja nanyi. Ikiwa yuko katika nchi, nitamsaka katika koo zote za Yuda.[a]
  revised_footnotes:
  - marker: a
    text: 'Kiebrania: “maelfu yote ya Yuda”; huenda neno hilo linamaanisha koo au migawanyiko ya kifamilia ndani ya Yuda.'
    reason: lexical_alternative
  revision_rationale: The revision clarifies the investigative force of the first two imperatives, expresses the required confirmed intelligence more explicitly, and avoids narrowing ‘the land’ to the modern sense of a country. It retains the contextual rendering ‘koo’ and its literal Hebrew alternative in the footnote.
