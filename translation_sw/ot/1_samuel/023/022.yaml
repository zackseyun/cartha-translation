  yaml_path: translation/ot/1_samuel/023/022.yaml
  text: Please go and make further preparations[a], and know and see his place where his foot is, who has seen him there; for I am told[c][b], ‘He is very cunning.’
translation:
  language: sw
  text: Nendeni, tafadhali, mkafanye maandalizi zaidi. Mjueni na muone mahali pake, mahali mguu wake ulipo[a], na ni nani aliyemwona huko; kwa maana nimeambiwa[b], “Yeye hutenda kwa ujanja mwingi.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno na neno, “mahali mguu wake ulipo”; ni msemo unaomaanisha mahali alipo au anakokwenda.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa maana alisema kwangu.” Kiebrania hakimtaji wazi mtendaji wa kitenzi “alisema.”
    reason: alternative_reading
  - marker: c
    text: Kiebrania kinasisitiza kwa kutumia maneno yenye mzizi mmoja, kwa maana ya karibu na “hutenda kwa ujanja kwa ujanja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכִינוּ עוֹד
  choice: mkafanye maandalizi zaidi
  rationale: Kitenzi הכין katika Hiphil humaanisha kuandaa au kuweka tayari; pamoja na עוֹד kinaelekeza kufanya maandalizi ya ziada.
- source_word: וּדְעוּ וּרְאוּ
  choice: Jueni na mjionee
  rationale: 'Vitenzi vyote viwili vimehifadhiwa ili kuonyesha uchunguzi wa makini: kupata ufahamu na kuthibitisha kwa kuona.'
- source_word: מְקוֹמוֹ
  choice: mahali pake
  rationale: Huhifadhi nomino מקום pamoja na kiambishi cha nafsi ya tatu umoja wa kiume, “pake.”
- source_word: אֲשֶׁר תִּהְיֶה רַגְלוֹ
  choice: ambapo mguu wake huwa
  rationale: Huhifadhi taswira halisi ya “mguu wake” huku “huwa” ikiruhusu maana ya mahali anapokuwa au anakokwenda; msemo unaelezwa katika tanbihi.
- source_word: מִי רָאָהוּ שָׁם
  choice: ni nani aliyemwona huko
  rationale: Huwasilisha swali kuhusu shahidi au mtoa habari aliyemwona Daudi mahali hapo.
- source_word: כִּי אָמַר אֵלַי
  choice: kwa maana nimeambiwa
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu umoja wa kiume bila kumtaja mtendaji. Kauli tendwa ya Kiswahili huepuka kumtambua msemaji bila ushahidi.
- source_word: עָרוֹם יַעְרִם הוּא
  choice: Yeye hutenda kwa ujanja mwingi
  rationale: Muundo wenye maneno ya mzizi mmoja unasisitiza ujanja. “Kwa ujanja mwingi” huwasilisha nguvu hiyo kwa Kiswahili cha kawaida bila kuiga muundo usio wa kawaida.
theological_decisions:
- issue: Mtendaji asiyeelezwa wa אָמַר (“alisema”)
  choice: nimeambiwa
  alternative: alisema kwangu
  rationale: Kauli tendwa inahifadhi kutotajwa kwa mtoa taarifa; tanbihi inaonyesha tafsiri ya karibu zaidi ya umbo la kitenzi bila kuamua mtendaji ni nani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tafadhali” huhifadhi נָא, na “mahali pake” huhifadhi kiambishi cha Kiebrania. Taswira ya “mguu wake” na utata wa mtendaji wa “alisema” zimehifadhiwa na kufafanuliwa kwa tanbihi.
