reference: 1 Samuel 23:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שָׁמֹ֤עַ שָׁמַע֙ עַבְדְּ/ךָ֔ כִּֽי מְבַקֵּ֥שׁ שָׁא֖וּל לָ/ב֣וֹא אֶל קְעִילָ֑ה לְ/שַׁחֵ֥ת לָ/עִ֖יר בַּ/עֲבוּרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/010.yaml
  text: Then David said[a], “O Yahweh, God of Israel, your servant has surely heard that Saul is seeking to come to Keilah to destroy the city because of me.”
translation:
  language: sw
  text: Ndipo Daudi akasema, “Ee Yahwe[a], Mungu wa Israeli, mtumishi wako amesikia kwa hakika kwamba Sauli anataka kuja Keila ili kuuangamiza mji kwa sababu yangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi limetafsiriwa “BWANA.”'
    reason: Kufafanua jina la Mungu na kutaja tafsiri ya jadi.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” huonyesha mfuatano kwa Kiswahili cha kawaida bila kuifanya kuwa hitimisho.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni unukuzi wa kawaida wa Kiswahili wa jina la Mungu YHWH, badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa umilikaji wa Kiebrania.
- source_word: שָׁמֹעַ שָׁמַע
  choice: amesikia kwa hakika
  rationale: Kitenzi-jina kisicho na kikomo pamoja na kitenzi chenye ukomo kinakazia tendo la kusikia; “kwa hakika” huhifadhi mkazo huo kwa Kiswahili cha asili.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Katika sala, Daudi anajitaja kwa unyenyekevu kuwa mtumishi wa Mungu; neno hili linafaa kuliko “mtumwa” katika muktadha huu.
- source_word: מְבַקֵּשׁ
  choice: anataka
  rationale: Huwasilisha nia inayoendelea ya Sauli kwa Kiswahili cha kawaida bila kuongeza uhakika wa mpango uliokamilika.
- source_word: לָבוֹא אֶל קְעִילָה
  choice: kuja Keila
  rationale: “Kuja” hudumisha mtazamo wa kitenzi cha Kiebrania, huku Keila likiwa jina la mahali.
- source_word: לְשַׁחֵת
  choice: kuuangamiza
  rationale: Katika muktadha wa kijeshi, neno hili linaonyesha uharibifu mkubwa unaokusudiwa.
- source_word: לָעִיר
  choice: mji
  rationale: Linarejelea Keila kama makazi ya mjini; kiambishi cha yambwa katika “kuuangamiza” kinaonyesha urejeleo mahususi.
- source_word: בַּעֲבוּרִי
  choice: kwa sababu yangu
  rationale: 'Hueleza sababu au kisababishi waziwazi: mji uko hatarini kwa sababu ya kuwapo kwa Daudi.'
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi YHWH. “Yahwe” hulihifadhi kama jina, huku tanbihi ikieleza desturi nyingine ya kulitafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa nafsi ya tatu “mtumishi wako amesikia” umehifadhiwa ili kuakisi namna ya Daudi kujitaja kwa unyenyekevu.
