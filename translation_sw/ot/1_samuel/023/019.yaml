  text: וַ/יַּעֲל֤וּ זִפִים֙ אֶל שָׁא֔וּל הַ/גִּבְעָ֖תָ/ה לֵ/אמֹ֑ר הֲ/ל֣וֹא דָ֠וִד מִסְתַּתֵּ֨ר עִמָּ֤/נוּ בַ/מְּצָדוֹת֙ בַּ/חֹ֔רְשָׁה בְּ/גִבְעַת֙ הַֽ/חֲכִילָ֔ה אֲשֶׁ֖ר מִ/ימִ֥ין הַ/יְשִׁימֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/019.yaml
  text: Then the Ziphites went up to Saul at Gibeah[a], saying, “Is not David hiding among us in the strongholds in the wooded area, on the hill of Hachilah[b], which is to the right of the Jeshimon?”
translation:
  language: sw
  text: Kisha Wazifu wakapanda kwa Sauli huko Gibea, wakisema, “Je, Daudi hajifichi miongoni mwetu, katika ngome zilizoko katika eneo lenye miti[a], kwenye kilima cha Hakila, kilicho upande wa kulia wa Yeshimoni[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Horeshi,” ikiwa neno hili linaeleweka kuwa jina la mahali badala ya “eneo lenye miti.”
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “upande wa kulia wa Yeshimoni”; katika matumizi ya Kiebrania kuhusu maeneo, huenda ikamaanisha “kusini mwa Yeshimoni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: wakapanda kwenda
  rationale: Kitenzi עלה kina maana ya kupanda au kwenda juu; tafsiri hii inadumisha mwelekeo wa safari bila kuongeza ufafanuzi usio katika maandishi.
- source_word: זִפִים
  choice: Wazifu
  rationale: Ni jina la wingi la wenyeji wa Zifu; muundo wa Kiswahili wa ‘Wa-’ unaeleweka kwa kawaida.
- source_word: הַגִּבְעָתָה
  choice: huko Gibea
  rationale: Herufi ya mwelekeo inaonyesha kwenda Gibea; pamoja na ‘kwenda kwa Sauli,’ ‘huko Gibea’ hutaja kwa kawaida mahali Sauli alipokuwa.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Inadumisha muundo wa Kiebrania unaoingiza usemi wa moja kwa moja na ni wa kawaida katika Kiswahili.
- source_word: הֲלוֹא
  choice: Je, ... ha-
  rationale: Huanzisha swali la balagha linalotarajia jibu la kukubali; muundo huu ni wa asili katika Kiswahili.
- source_word: מִסְתַּתֵּר
  choice: hajifichi
  rationale: Hifili ya kujirejelea inaonyesha Daudi anajificha mwenyewe, na umbo la hali ya sasa linafaa kwa tendo linaloendelea.
- source_word: עִמָּנוּ
  choice: kwetu
  rationale: Ingawa kihalisi ni ‘pamoja nasi,’ muktadha unaonyesha eneo lao; ‘kwetu’ huwasilisha maana hiyo kwa ufupi na kawaida.
- source_word: בַמְּצָדוֹת
  choice: katika ngome
  rationale: מְצָדוֹת ni mahali penye ulinzi au ngome; ‘ngome’ ni neno la kawaida na linalofaa mazingira ya jangwani.
- source_word: בַּחֹרְשָׁה
  choice: kwenye eneo lenye miti
  rationale: Neno linaweza kuwa nomino ya kawaida yenye maana ya eneo la miti au jina la mahali Horeshi. Maana ya kawaida imetumika katika matini, na uwezekano wa jina la mahali umehifadhiwa katika tanbihi.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: katika kilima cha Hakila
  rationale: גִּבְעָה ni kilima; muundo huu ni wa asili katika Kiswahili na huhifadhi jina la mahali.
- source_word: אֲשֶׁר מִימִין הַיְשִׁימוֹן
  choice: kilicho upande wa kulia wa Yeshimoni
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania ‘upande wa kulia’ bila kuamua kimya-kimya kwamba lazima uwe ‘kusini’; maana inayowezekana ya kijiografia imeelezwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Majina yametoholewa kwa maumbo yaliyozoeleka katika Kiswahili: Sauli, Gibea, Daudi, Hakila na Yeshimoni. Utata wa חֹרְשָׁה na maana ya kijiografia ya מִימִין umehifadhiwa kwa tanbihi.'
