base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/002.yaml
  text: So David inquired of Yahweh[a], saying, “Shall I go and strike these Philistines?” And Yahweh said to David, “Go and strike the Philistines, and save Keilah.”
translation:
  language: sw
  text: Basi Daudi akamwuliza Yahwe, akisema, “Je, niende nikawapige hawa Wafilisti?” Yahwe akamwambia Daudi, “Nenda ukawapige Wafilisti, na uokoe[a] Keila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uikomboe Keila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: akamwuliza Yahwe
  rationale: Muundo huu unaonyesha kuwa Daudi alimwendea Yahwe ili kupata mwongozo, si kwamba aliuliza swali la kawaida tu. Kiswahili hiki ni cha kawaida na bado kinadumisha maana ya kushauriana na Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa kwa umbo la Kiswahili linalotamkika, badala ya kubadilishwa kuwa cheo.
- source_word: הַאֵלֵךְ
  choice: Je, niende
  rationale: Swali la mashauriano kuhusu hatua inayopaswa kuchukuliwa linaelezwa kwa Kiswahili cha kawaida bila kulifanya kuwa amri.
- source_word: וְהִכֵּיתִי / וְהִכִּיתָ
  choice: nikawapige / ukawapige
  rationale: Kitenzi 'kupiga' kinadumisha nguvu ya kijeshi ya נכה na urudiaji uliopo kati ya swali la Daudi na jibu la Yahwe, bila kudai wazi kwamba tayari walishindwa.
- source_word: בַּפְּלִשְׁתִּים הָאֵלֶּה
  choice: hawa Wafilisti
  rationale: Kiwakilishi 'hawa' kinahifadhi demonstrativi ya Kiebrania inayowaonyesha Wafilisti hawa mahususi.
- source_word: וְהוֹשַׁעְתָּ
  choice: uokoe
  rationale: Katika muktadha huu ישׁע ni kuokoa au kukomboa mahali na wakazi wake kutoka hatarini; 'uokoe' ni fupi, wazi, na ya kawaida.
- source_word: קְעִילָה
  choice: Keila
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu. 'Yahwe' linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya וְהוֹשַׁעְתָּ katika muktadha wa vita
  choice: uokoe Keila
  alternative: uikomboe Keila
  rationale: '''Uokoe'' huhifadhi upana wa kitenzi cha Kiebrania; hapa kinahusu kuondolewa kwa Keila katika hatari ya Wafilisti, bila kuingiza maana maalumu ya wokovu wa kiroho.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Urudiaji wa kitenzi 'kupiga' umehifadhiwa ili kuonyesha ulinganifu wa swali na jibu katika Kiebrania.
