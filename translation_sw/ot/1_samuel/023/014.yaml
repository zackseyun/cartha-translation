source:
  edition: WLC
  text: וַ/יֵּ֨שֶׁב דָּוִ֤ד בַּ/מִּדְבָּר֙ בַּ/מְּצָד֔וֹת וַ/יֵּ֥שֶׁב בָּ/הָ֖ר בְּ/מִדְבַּר זִ֑יף וַ/יְבַקְשֵׁ֤/הוּ שָׁאוּל֙ כָּל הַ/יָּמִ֔ים וְ/לֹֽא נְתָנ֥/וֹ אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/014.yaml
  text: David stayed in the wilderness strongholds[a], and he stayed in the hill country in the wilderness of Ziph. Saul sought him all the days, but God did not give him into his hand.
translation:
  language: sw
  text: Daudi akakaa nyikani katika ngome, naye akakaa katika nchi ya milima, katika nyika ya Zifu. Sauli alimtafuta siku zote, lakini Mungu hakumtia mikononi mwa Sauli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “hakumkabidhi kwa Sauli.” Kiebrania: “hakumtia mkononi mwake.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: akakaa
  rationale: Kitenzi hiki kinaweza kumaanisha kukaa, kuishi, au kubaki. “Akakaa” ni cha kawaida katika simulizi na kinadumisha wazo la Daudi kuendelea kuwa katika maeneo hayo.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: מִדְבָּר hapa ni eneo lisilolimwa na lenye makazi machache, si lazima jangwa la mchanga; “nyika” linafaa kwa mazingira haya.
- source_word: בַּמְּצָדוֹת
  choice: katika ngome
  rationale: מְצָדוֹת ni maeneo yenye ulinzi wa kiasili au yaliyo rahisi kutetewa. “Ngome” linahifadhi dhana ya mahali salama pa kujilinda.
- source_word: בָּהָר
  choice: katika eneo la milima
  rationale: הַר inaweza kutaja mlima au eneo la milima. Muktadha wa kijiografia unaelekea kwenye eneo la milima, si lazima kilele kimoja.
- source_word: בְּמִדְבַּר זִיף
  choice: katika nyika ya Zifu
  rationale: Muundo huu unalitaja eneo maalumu la nyika lililohusishwa na Zifu.
- source_word: וַיְבַקְשֵׁהוּ
  choice: alimtafuta
  rationale: בקשׁ katika muktadha huu inaonyesha kumtafuta kwa kusudi la kumkamata; “alimtafuta” ni sahihi na la kawaida.
- source_word: כָּל הַיָּמִים
  choice: siku zote
  rationale: Tafsiri hii inafuata kwa karibu nahau ya Kiebrania na kueleza ufuatiliaji ulioendelea katika kipindi hicho.
- source_word: וְלֹא נְתָנוֹ
  choice: lakini ... hakumtia
  rationale: נתן pamoja na “mkononi” ni nahau ya kumweka mtu chini ya mamlaka ya mwingine. “Hakumtia” hudumisha picha ya usemi wa chanzo.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Ingawa umbo la neno ni la wingi kisarufi, hapa linahusiana na tendo la umoja na linamtaja Mungu wa Israeli.
- source_word: בְּיָדוֹ
  choice: mkononi mwake
  rationale: Usemi huu wa Kiebrania unamaanisha chini ya uwezo au udhibiti wake. Kiswahili pia kinaweza kuelewa nahau hii, hivyo picha ya chanzo imehifadhiwa.
theological_decisions:
- issue: Tendo la Mungu katika kumlinda Daudi
  choice: Mungu hakumtia Daudi mkononi mwa Sauli
  alternative: Mungu hakumkabidhi Daudi kwa Sauli
  rationale: Kifungu kinahusisha moja kwa moja kuokoka kwa Daudi na tendo la Mungu, bila kueleza zaidi namna ya ulinzi huo. Tafsiri inadumisha dai hilo na pia nahau ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye hadhi. “Nyika” huepuka kuifanya מִדְבָּר kuwa jangwa la mchanga tu; marudio ya “akakaa” yanahifadhi marudio ya chanzo; na nahau “mkononi mwake” inadumishwa huku tanbihi ikifafanua maana yake.
