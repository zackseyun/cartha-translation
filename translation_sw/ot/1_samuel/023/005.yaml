base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/005.yaml
  text: So David and his men went to Keilah and fought against the Philistines[a], and he drove off their livestock and struck them with a great blow[c][b]. So David saved the inhabitants of Keilah.
translation:
  language: sw
  text: Basi Daudi pamoja na watu wake akaenda Keila, akapigana na Wafilisti, akaendesha mifugo yao[a], na akawapiga pigo kubwa[b]. Hivyo Daudi akawaokoa wakazi wa Keila[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaiondoa mifugo yao kwa kuiendesha.” Neno la Kiebrania linahusu mifugo kwa upana, si ng’ombe pekee.
    reason: lexical_alternative
  - marker: b
    text: Au, “akawashinda vibaya” au “akawapiga kwa kushindwa kukubwa.”
    reason: lexical_alternative
  - marker: c
    text: Au, “akawakomboa” au “akawanusuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד וַאֲנָשׁוֹ קְעִילָה
  choice: Daudi pamoja na watu wake akaenda Keila
  rationale: Muundo wa Kiswahili unaweka Daudi kuwa kiini cha kiima, hivyo kitenzi cha umoja kinatunza mfuatano wa vitenzi vya umoja katika Kiebrania huku ‘pamoja na watu wake’ ikionyesha wazi kuwa walikuwa naye.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: akapigana na Wafilisti
  rationale: Katika muktadha huu, לָחַם pamoja na בְּ inaonyesha kupigana dhidi ya adui. Kiswahili cha kawaida hutumia ‘kupigana na’ bila kudokeza ushirika.
- source_word: וַיִּנְהַג אֶת־מִקְנֵיהֶם
  choice: akachukua mifugo yao
  rationale: נָהַג hapa ni kuendesha au kuondoa wanyama, na מִקְנֶה ni neno pana kwa mifugo. ‘Akachukua mifugo yao’ ni Kiswahili cha kawaida kinachoeleza kuondolewa kwa mifugo bila kuibana maana iwe ng’ombe pekee.
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: kuwashinda vibaya sana
  rationale: Nahau ya Kiebrania ya ‘kuwapiga pigo kubwa’ inaeleza kushindwa vibaya katika mapigano. Tafsiri hii ni ya asili kwa Kiswahili na haiongezi kwa lazima wazo la mauaji makubwa.
- source_word: וַיֹּשַׁע
  choice: akawaokoa
  rationale: יָשַׁע katika muktadha wa kijeshi humaanisha kuwaokoa au kuwaepusha watu na hatari. ‘Akawaokoa’ ni ya moja kwa moja na inaeleweka kwa urahisi.
- source_word: יֹשְׁבֵי קְעִילָה
  choice: wakazi wa Keila
  rationale: Kirai hiki humaanisha watu wanaokaa Keila; ‘wakazi wa Keila’ ni kifupi, cha sasa, na cha kawaida.
