translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki chenye mtindo wa simulizi ulio wazi na wenye heshima. Majina yametolewa kwa maumbo yanayotumika kwa kawaida katika Kiswahili: Zifu, Sauli, Daudi, Maoni, Araba, na Yeshimoni. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja ili kurekebisha kutolingana kwa nafasi ya alama katika safu ya ushauri ya Kiingereza.'
