base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/024.yaml
  text: They arose and went to Ziph ahead of Saul[a]. Now David and his men were in the wilderness of Maon, in the Arabah[b], to the south of the Jeshimon.
translation:
  language: sw
  text: Wakainuka wakaenda Zifu kabla ya Sauli. Wakati huo, Daudi na watu wake walikuwa katika nyika ya Maoni, katika Araba, upande wa kusini[a] wa Yeshimoni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upande wa kulia wa Yeshimoni.” Kiebrania kihalisi hutumia “mkono wa kulia/upande wa kulia,” ambao katika matumizi ya kijiografia unaweza kumaanisha kusini.
    reason: lexical_alternative
  - marker: b
    text: “Yeshimoni” pia linaweza kueleweka kuwa “ukiwa” au “jangwa,” lakini hapa huenda ni jina la mahali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֛וּמוּ וַיֵּלְכ֥וּ
  choice: Wakainuka wakaenda
  rationale: Inahifadhi mfuatano wa matendo katika simulizi; קום imetafsiriwa moja kwa moja kuwa “kuinuka,” na הלך kuwa “kwenda.”
- source_word: זִ֖יפָה
  choice: Zifu
  rationale: Herufi ya mwelekeo mwishoni mwa jina inaonyesha kwenda kuelekea Zifu; Kiswahili huonyesha mwelekeo huo kwa kitenzi “wakaenda” bila kuhitaji kihusishi kingine.
- source_word: לִפְנֵ֣י שָׁא֑וּל
  choice: mbele ya Sauli
  rationale: Hapa לִפְנֵי inaonyesha kwamba waliwatangulia au walikwenda kabla ya Sauli; “mbele ya” huhifadhi maana ya mahali na wakati bila kuifafanua kupita kiasi.
- source_word: וְדָוִ֨ד וַאֲנָשָׁ֜יו
  choice: Wakati huo, Daudi na watu wake walikuwa
  rationale: Kirai cha Kiebrania hakina kitenzi na kinahamisha mandhari kueleza walikokuwa Daudi na watu wake. “Wakati huo” na “walikuwa” hufanya mpito huo uwe wa kawaida katika Kiswahili.
- source_word: בְּמִדְבַּ֤ר מָעוֹן֙
  choice: katika nyika ya Maoni
  rationale: מִדְבָּר inaweza kumaanisha eneo kame lisilokaliwa sana, si lazima jangwa la mchanga; “nyika” linafaa kwa mazingira hayo.
- source_word: בָּעֲרָבָ֔ה
  choice: katika Araba
  rationale: Kwa kuwa neno hili linatokea katika maelezo ya kijiografia, limedumishwa kama jina la eneo badala ya kutafsiriwa kwa jumla kuwa tambarare au bonde.
- source_word: אֶ֖ל יְמִ֥ין הַיְשִׁימֽוֹן
  choice: upande wa kusini wa Yeshimoni
  rationale: יָמִין maana yake ya msingi ni upande wa kulia, lakini katika maelekezo ya kijiografia ya Kiebrania inaweza kumaanisha kusini. Tafsiri kuu inatoa mwelekeo unaoeleweka, huku tanbihi ikihifadhi usemi halisi.
- source_word: הַיְשִׁימֽוֹן
  choice: Yeshimoni
  rationale: Ingawa neno linaweza kumaanisha eneo tupu au ukiwa, hapa linaelekea kutumiwa kama jina la mahali; kwa hiyo jina limedumishwa na maana nyingine imewekwa katika tanbihi.
