translation:
  language: sw
  text: Daudi akamwuliza BWANA tena, naye BWANA akamjibu, akasema, “Inuka, ushuke hadi Keila, kwa maana ninawatia Wafilisti mikononi mwako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִשְׁאֹל בַּיהוָה
  choice: akamwuliza ... BWANA
  rationale: Kitenzi 'kuuliza' pamoja na 'BWANA' kinaonyesha kutafuta mwongozo wa Mungu, huku kikibaki karibu na muundo wa Kiebrania.
- source_word: ק֚וּם
  choice: Ondoka
  rationale: Katika amri hii, neno hilo ni wito wa kuchukua hatua, si lazima kusimama kutoka hali ya kuketi.
- source_word: רֵד קְעִילָה
  choice: ushuke mpaka Keila
  rationale: Huhifadhi mwelekeo wa kijiografia wa kitenzi cha Kiebrania na kutaja mahali kwa namna ya kawaida katika Kiswahili.
- source_word: אֲנִי נֹתֵן
  choice: ninawatia
  rationale: Wakati wa sasa wa Kiebrania unaonyesha tendo ambalo Mungu ameamua na analifanya; Kiswahili cha sasa kinahifadhi nguvu hiyo.
- source_word: בְּיָדֶךָ
  choice: mikononi mwako
  rationale: Nahau ya Kiswahili inaeleza kukabidhi chini ya mamlaka au uwezo wa Daudi na huhifadhi taswira ya 'mkono' kwa wingi wa kawaida katika Kiswahili.
theological_decisions:
- issue: Uwakilishi wa jina la agano יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: BWANA ni uwakilishi uliozoeleka katika tafsiri za Kiswahili na unaendana na safu ya ushauri ya POB; hakuna tanbihi inayohitajika katika mstari huu.
- issue: Kauli ya Mungu kuhusu ushindi
  choice: ninawatia Wafilisti mikononi mwako
  alternative: nitawatia Wafilisti mikononi mwako
  rationale: Wakati wa sasa unadumisha namna ya asili ya Kiebrania na uhakika wa tendo la Mungu bila kuubadili kuwa wakati ujao tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi urudiaji wa BWANA na mfuatano wa simulizi wa Kiebrania bila kuwa nzito isivyo lazima.
