translation:
  language: sw
  text: Basi Sauli akawaita watu wote kwa vita[a], ili washuke kwenda Keila kuwazingira Daudi na watu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawakusanya watu wote kwa ajili ya vita.” Kitenzi cha Kiebrania kinaweza kumaanisha “aliwafanya wasikie”; katika muktadha huu huenda kinarejelea kuwaita watu wakusanyike kwa shughuli ya kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: akawaita
  rationale: Katika Hifili, kitenzi kina maana ya kusababisha kusikia; katika muktadha huu wa kijeshi kinadokeza kuwaita au kuwakusanya watu kwa ajili ya vita. “Akawaita” ni Kiswahili cha kawaida na kinaeleza uhamasishaji huo bila tafsiri isiyo ya kawaida ya “akawasababisha wasikie.”
- source_word: כָּל הָעָם
  choice: watu wote
  rationale: Hii ndiyo maana ya moja kwa moja ya Kiebrania. Ingawa muktadha unawahusu walioitishwa kwa shughuli ya kijeshi, neno lenyewe halisemi wazi “jeshi” au “askari.”
- source_word: לַמִּלְחָמָה
  choice: kwenda vitani
  rationale: Kirai kinaonyesha kusudi la mwito wa Sauli. “Kwenda vitani” ni cha asili katika Kiswahili na kinawasilisha tendo la kijeshi bila kulibana kuwa pambano moja tu.
- source_word: לָרֶדֶת
  choice: washuke
  rationale: Kitenzi ירד humaanisha kushuka au kwenda chini. “Washuke” kinahifadhi taswira ya mwendo kwenda mahali pa chini katika simulizi.
- source_word: קְעִילָה
  choice: Keila
  rationale: Hili ni umbo linalofaa la jina la mahali katika tahajia ya Kiswahili.
- source_word: לָצוּר
  choice: ili wamzingire
  rationale: Katika muktadha huu צור hueleza tendo la kijeshi la kumfunga adui kwa kumzingira. Kiambishi cha umoja katika “wamzingire” kinamlenga Daudi, huku “na watu wake” wakijumuishwa pamoja naye kama walengwa.
- source_word: אֶל דָּוִד וְאֶל אֲנָשָׁיו
  choice: Daudi na watu wake
  rationale: אֶל hutaja walengwa wa kuzingirwa. “Watu wake” huhifadhi upana wa אֲנָשָׁיו kuliko “askari wake,” ingawa hapa wanafanya kazi kama kundi la wapiganaji.
