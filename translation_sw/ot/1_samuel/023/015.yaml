  text: David saw that Saul had come out to seek his life[a], while David was in the wilderness of Ziph at Horesh.
translation:
  language: sw
  text: Daudi akaona kwamba Sauli alikuwa ametoka kutafuta uhai wa Daudi, naye Daudi alikuwa katika nyika ya Zifu, huko Horesha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msituni” au “mahali penye miti.” Neno la Kiebrania linaweza kueleweka kama nomino ya kawaida, lakini hapa huenda ni jina la mahali, Horesha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: akaona
  rationale: Kitenzi ראה kimsingi humaanisha kuona, lakini hapa kinaweza pia kumaanisha kutambua au kupata habari. “Akaona kwamba” kinahifadhi namna ya Kiebrania huku kikieleweka kama utambuzi wa jambo.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי kinaanzisha maudhui ya jambo ambalo Daudi aliliona au kulitambua.
- source_word: יָצָא
  choice: alikuwa ametoka kwenda
  rationale: יצא humaanisha kutoka au kwenda nje; umbo hili linaonyesha kwamba Sauli alikuwa tayari ameanza safari ya kumsaka Daudi.
- source_word: לְבַקֵּשׁ אֶת נַפְשׁוֹ
  choice: kwenda kuutafuta uhai wake
  rationale: Tafsiri hii inadumisha nahau ya Kiebrania ya “kutafuta uhai” wa mtu, ambayo katika muktadha huu inaashiria kumtafuta kwa nia ya kumuua, bila kubadili nahau hiyo moja kwa moja kuwa maelezo ya wazi zaidi.
- source_word: בְּמִדְבַּר זִיף
  choice: katika nyika ya Zifu
  rationale: מִדְבָּר ni eneo kame, pori, au nyika, si lazima jangwa la mchanga. “Nyika” ni neno la kawaida na pana linalofaa mazingira haya.
- source_word: בַּחֹרְשָׁה
  choice: huko Horeshi
  rationale: Ingawa חֹרְשָׁה linaweza kumaanisha msitu au mahali penye miti, katika muktadha huu huenda ni jina la mahali. “Huko Horeshi” linaonyesha wazi matumizi hayo ya kijiografia.
- source_word: וְדָוִד
  choice: naye Daudi alikuwa
  rationale: Kiunganishi kinaanzisha maelezo ya hali yanayoonyesha mahali Daudi alipokuwa wakati huo; “naye” ni mwunganiko wa asili katika simulizi la Kiswahili.
