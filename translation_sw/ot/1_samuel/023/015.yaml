  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. Nahau ya Kiebrania kuhusu kuutafuta uhai imehifadhiwa, na alama ya tanbihi imewekwa baada ya “Horeshi,” ambako tanbihi hiyo inahusika.
