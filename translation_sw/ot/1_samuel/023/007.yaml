  text: וַ/יֻּגַּ֣ד לְ/שָׁא֔וּל כִּי בָ֥א דָוִ֖ד קְעִילָ֑ה וַ/יֹּ֣אמֶר שָׁא֗וּל נִכַּ֨ר אֹת֤/וֹ אֱלֹהִים֙ בְּ/יָדִ֔/י כִּ֚י נִסְגַּ֣ר לָ/ב֔וֹא בְּ/עִ֖יר דְּלָתַ֥יִם וּ/בְרִֽיחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/007.yaml
  text: And it was reported to Saul that David had come to Keilah[a]. So Saul said, “God has delivered him into my hand[b], for he has shut himself in by entering a city with doors and bars.”
translation:
  language: sw
  text: Ikawa Sauli akaambiwa kwamba Daudi alikuwa amefika Keila. Basi Sauli akasema, “Mungu amemtia mkononi mwangu[a], kwa maana amejifungia ndani kwa kuingia katika mji wenye milango miwili na komeo[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu amemkabidhi mikononi mwangu.” Sauli anaeleza hali ya Daudi kana kwamba Mungu mwenyewe amemweka chini ya mamlaka yake.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mji wa milango miwili na komeo,” yaani mji wenye ngome ambao lango lake lilikuwa na mabawa mawili yaliyofungwa kwa boriti ya kuvuka. Neno “amejifungia” pia linaweza kutafsiriwa “amefungiwa ndani.”'
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: akaambiwa
  rationale: Kauli ya kutendwa inaonyesha kwamba habari ilifikishwa kwa Sauli; ‘akaambiwa’ ni ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: בָא דָוִד קְעִילָה
  choice: Daudi alikuwa amefika Keila
  rationale: Wakati timilifu ‘alikuwa amefika’ unaonyesha kwamba Daudi alikuwa tayari amewasili kabla habari hiyo haijapelekwa kwa Sauli.
- source_word: נִכַּר אֹתוֹ אֱלֹהִים בְּיָדִי
  choice: Mungu amemtia mkononi mwangu
  rationale: Kauli hii hudokeza kukabidhi au kumweka mtu chini ya mamlaka ya mwingine. ‘Mkononi mwangu’ inadumisha nahau ya Kiebrania huku ikieleweka vizuri kwa Kiswahili.
- source_word: נִסְגַּר
  choice: amejifungia ndani
  rationale: Nifali inaweza kueleweka kwa maana ya kujifungia au kufungiwa. Katika hoja ya Sauli, Daudi amejitia katika hali ya kunaswa kwa kuingia mjini; tanbihi inadumisha uwezekano wa maana ya kutendwa.
- source_word: לָבוֹא
  choice: kwa kuingia
  rationale: Kitenzi-jina kinaeleza jinsi au sababu ya Daudi kuwa amefungiwa ndani.
- source_word: בְּעִיר דְּלָתַיִם וּבְרִיחַ
  choice: katika mji wenye milango miwili na komeo
  rationale: דְּלָתַיִם inaelekeza kwenye jozi ya mabawa ya lango, na בְּרִיחַ ni boriti au komeo la kuyafungia. Tafsiri inadumisha picha halisi ya mji wenye ngome.
theological_decisions:
- issue: Sauli anahusisha hali ya Daudi na tendo la Mungu
  choice: 'Kauli ya Sauli imetafsiriwa moja kwa moja: ‘Mungu amemtia mkononi mwangu.’'
  alternative: Kuongeza umbali wa kifafanuzi, kama vile ‘Sauli alidhani kwamba Mungu alikuwa amemtia mkononi mwake.’
  rationale: Kiebrania kinanukuu maneno ya Sauli moja kwa moja bila kuthibitisha kwamba tathmini yake ni sahihi. Tafsiri haipaswi kuongeza hukumu ya msimulizi wala kuondoa mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Komeo’ linadumisha taswira ya kifaa cha kufungia lango, na muundo wa hotuba ya moja kwa moja unahifadhi mvutano wa madai ya Sauli bila kuyaidhinisha.
