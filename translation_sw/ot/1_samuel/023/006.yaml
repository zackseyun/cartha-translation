  text: וַ/יְהִ֗י בִּ֠/בְרֹחַ אֶבְיָתָ֧ר בֶּן אֲחִימֶ֛לֶךְ אֶל דָּוִ֖ד קְעִילָ֑ה אֵפ֖וֹד יָרַ֥ד בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/006.yaml
  text: When Abiathar son of Ahimelech fled to David at Keilah[a], he came down with an ephod in his hand.
translation:
  language: sw
  text: Abiathari mwana wa Ahimeleki alipomkimbilia Daudi huko Keila, alishuka akiwa na efodi mkononi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “efodi ilishuka mkononi mwake,” kwa usomaji unaochukua ‘efodi’ kuwa kiima cha kitenzi cha Kiebrania.
    reason: Huhifadhi uwezekano wa kisarufi wa matini ya Kiebrania bila kudai kwamba ndio usomaji wa kawaida katika muktadha.
lexical_decisions:
- source_word: וַיְהִי
  choice: (haijatafsiriwa kwa neno maalumu)
  rationale: Hapa muundo huu unaendeleza simulizi. Kiswahili cha kawaida hakihitaji kuongeza ‘ikawa’ au ‘basi,’ kwa kuwa kishazi cha ‘alipomkimbilia’ kinaunganisha tukio kwa ufasaha.
- source_word: בִּבְרֹחַ
  choice: alipomkimbilia
  rationale: ב pamoja na kitenzi-jina huonyesha hali ya wakati, ‘alipo…’; ‘kumkimbilia’ huonyesha kukimbia kuelekea kwa mtu ili kupata hifadhi bila kufanya sentensi kuwa nzito.
- source_word: אֶבְיָתָר בֶּן אֲחִימֶלֶךְ
  choice: Abiathari mwana wa Ahimeleki
  rationale: Majina yametoholewa kwa muundo unaotambulika katika Kiswahili, na uhusiano wa mwana na baba umehifadhiwa moja kwa moja.
- source_word: אֶל דָּוִד קְעִילָה
  choice: Daudi huko Keila
  rationale: Maneno yanaonyesha kwamba Abiathari alikimbilia kwa Daudi, aliyekuwa Keila. ‘Huko Keila’ ni Kiswahili cha asili kinachohifadhi mahali bila kudai kwamba Keila yenyewe ndiyo lengo tofauti la mwendo.
- source_word: אֵפוֹד
  choice: efodi
  rationale: Neno la kifaa au vazi maalumu la kikuhani limetoholewa badala ya kubanwa kuwa ‘vazi’ tu, jambo ambalo lingeondoa upekee wake wa kihistoria na kidini.
- source_word: יָרַד
  choice: alishuka
  rationale: Kitenzi kinamaanisha kushuka au kwenda chini. ‘Alishuka’ huhifadhi mwelekeo ulio wazi katika Kiebrania.
- source_word: בְּיָדוֹ
  choice: akiwa na efodi mkononi
  rationale: Tafsiri hii huhifadhi taswira halisi ya kitu kuwa mkononi mwake na kwa Kiswahili cha kawaida huonyesha kwamba alikileta pamoja naye.
theological_decisions:
- issue: Asili ya אֵפוֹד katika muktadha
  choice: Kutumia ‘efodi’ bila kuifafanua zaidi
  alternative: vazi la kikuhani; vazi takatifu
  rationale: Kifungu kinataja kifaa hicho kwa jina lake bila kueleza umbo au matumizi yake. Kutoholewa kwa neno kunahifadhi upekee wake wa kidini bila kuingiza ufafanuzi wa kimadhehebu au maana finyu kuliko chanzo.
- issue: Kiima cha יָרַד katika mpangilio wa Kiebrania
  choice: Kumchukulia Abiathari kuwa kiima katika matini kuu
  alternative: efodi ndiyo iliyoshuka mkononi mwake
  rationale: Kwa muktadha, tafsiri ya kwamba Abiathari alishuka akiwa ameibeba efodi ndiyo inayoeleweka zaidi, lakini mpangilio wa maneno wa Kiebrania unaweza kusomwa kihalisi kana kwamba ‘efodi ilishuka’; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa nyepesi kwa msomaji wa kawaida, huku neno maalumu ‘efodi,’ mwendo wa ‘kushuka,’ na utata halisi wa mpangilio wa Kiebrania vikihifadhiwa.
