base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/009.yaml
  text: When David learned that Saul was secretly plotting harm against him[a], he said to Abiathar the priest[b], “Bring the ephod here.”
translation:
  language: sw
  text: Daudi alipotambua kwamba Sauli alikuwa akipanga kwa siri kumdhuru[a], alimwambia kuhani Abiathari, “Leta efodi[b] hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa akitunga mabaya dhidi yake.”
    reason: lexical_alternative
  - marker: b
    text: Efodi ilikuwa vazi au kifaa cha kikuhani kilichohusishwa na kutafuta mwongozo kutoka kwa Mungu katika muktadha huu wa simulizi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּדַע
  choice: alipotambua
  rationale: Katika simulizi, kitenzi hiki kinaonyesha kwamba Daudi alipata kujua jambo hilo wakati huu; “alipotambua” pia huunganisha kwa kawaida taarifa hii na kauli inayofuata.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linaanzisha maudhui ya jambo ambalo Daudi alitambua.
- source_word: עָלָיו
  choice: kumdhuru
  rationale: Maana ya uhasama ya kihusishi hiki inaelezwa kwa kawaida ndani ya kishazi cha kupanga madhara dhidi ya Daudi.
- source_word: מַחֲרִישׁ
  choice: alikuwa akipanga kwa siri
  rationale: Kauli endelevu ya Kiebrania ina maana ya kupanga au kutunga jambo, huku muktadha ukidokeza usiri; usemi huu unahifadhi vipengele vyote viwili.
- source_word: הָרָעָה
  choice: kumdhuru
  rationale: Katika muktadha huu, “mabaya” yanayokusudiwa ni madhara dhidi ya Daudi. Kitenzi “kumdhuru” ni cha kawaida na wazi bila kuongeza tafsiri ya kidhehebu.
- source_word: אֶל אֶבְיָתָר הַכֹּהֵן
  choice: alimwambia kuhani Abiathari
  rationale: Huu ni utambulisho wa moja kwa moja wa Abiathari kwa cheo chake cha kikuhani, kwa mpangilio wa kawaida wa Kiswahili.
- source_word: הַגִּישָׁה
  choice: Leta ... hapa
  rationale: Amri hii ina maana ya kukileta kitu karibu au kukiwasilisha; “leta hapa” ni usemi wa kawaida wa Kiswahili unaohifadhi nguvu ya agizo.
- source_word: הָאֵפוֹד
  choice: efodi
  rationale: Jina hili la kitu au vazi maalumu la kikuhani limetoholewa badala ya kutafsiriwa kwa neno la jumla, ili kuhifadhi umaalumu wake.
theological_decisions:
- issue: Maana ya nia ya Sauli katika מַחֲרִישׁ הָרָעָה
  choice: Sauli alikuwa akipanga kwa siri kumdhuru Daudi
  alternative: Sauli alikuwa akitunga mabaya dhidi ya Daudi
  rationale: Tafsiri kuu inaeleza tishio halisi kwa lugha ya kawaida, huku tanbihi ikihifadhi uwezekano mpana wa neno “mabaya” katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “alipotambua ... alimwambia” unatoa mtiririko wa kawaida wa simulizi; “efodi” limehifadhiwa kama istilahi maalumu ya kibiblia na kufafanuliwa katika tanbihi.
