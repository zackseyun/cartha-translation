base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/018.yaml
  text: And the two of them made a covenant before Yahweh[a]. Then David remained in the wooded area[b], and Jonathan went to his house.
translation:
  language: sw
  text: Wote wawili wakafanya agano mbele ya Yahweh[a]. Kisha Daudi akabaki katika msitu[b], naye Yonathani akaenda nyumbani kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, “wakakata agano.”
    reason: lexical_alternative
  - marker: b
    text: Au “katika Horesh”; Kiebrania kinaweza kueleweka kuwa jina la mahali au “msitu/eneo lenye miti.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרְתוּ
  choice: wakafanya
  rationale: Kirai cha Kiebrania כרת ברית kina maana halisi ya ‘kukata agano,’ lakini katika Kiswahili cha kawaida tendo hilo husemwa kwa njia ya asili zaidi kuwa ‘kufanya agano.’ Maana halisi imehifadhiwa katika tanbihi.
- source_word: שְׁנֵיהֶם
  choice: hao wawili
  rationale: Huwataja Daudi na Yonathani kwa pamoja na kuonyesha wazi dhana ya wawili iliyomo katika Kiebrania.
- source_word: בְּרִית
  choice: agano
  rationale: ‘Agano’ huhifadhi uzito wa uhusiano rasmi na ahadi nzito katika muktadha wa Daudi na Yonathani; ‘makubaliano’ lingekuwa dhaifu zaidi.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Ni tafsiri fupi na ya asili ya kuwapo mbele ya Mungu katika tukio hili zito la kufanya agano.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limetafsiriwa moja kwa moja kuwa ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: וַיֵּשֶׁב
  choice: akabaki
  rationale: Katika muktadha huu kitenzi kinaonyesha kuendelea kukaa mahali hapo, si kitendo halisi cha kuketi.
- source_word: בַּחֹרְשָׁה
  choice: katika eneo lenye miti
  rationale: חֹרֶשׁ inaweza kumaanisha eneo la miti au kichaka. Hata hivyo, katika muktadha inaweza pia kueleweka kama jina la mahali, Horesh; uwezekano huo umehifadhiwa katika tanbihi.
- source_word: הָלַךְ לְבֵיתוֹ
  choice: akaenda nyumbani kwake
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kwamba alikwenda katika nyumba yake mwenyewe, bila kubadili maana ya Kiebrania.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia Tetragramatoni יְהוָה moja kwa moja. ‘Yahweh’ huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Uzito wa neno בְּרִית katika uhusiano wa Daudi na Yonathani
  choice: agano
  alternative: makubaliano
  rationale: ‘Agano’ hudumisha uzito wa ahadi ya dhati iliyofanywa mbele za Yahweh bila kuingiza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo ‘Nao hao wawili’ unadumisha msisitizo wa wahusika wote wawili, na ‘naye’ huunganisha sentensi kwa mtiririko wa masimulizi ya kibiblia.
