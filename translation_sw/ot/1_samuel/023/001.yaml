base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/001.yaml
  text: Then they told David[a], saying, “Look, the Philistines are fighting against Keilah, and they are plundering the threshing floors.”
translation:
  language: sw
  text: Kisha wakamwambia Daudi, “Tazama, Wafilisti wanapigana dhidi ya Keila[a], nao wanapora sakafu za kupuria.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanapigana huko Keila” au “kwenye Keila.” Kihusishi cha Kiebrania kwa maana halisi ni “katika/kwenye,” lakini katika muktadha huu wa kijeshi huenda maana ni kwamba Wafilisti wanaushambulia mji huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: Kisha watu wakamwambia
  rationale: Hifili ya וַיַּגִּדוּ inaendeleza mfululizo wa simulizi na ina kiima cha wingi kisichotajwa wazi; “watu wakamwambia” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: לְדָוִד
  choice: Daudi
  rationale: לְ inaonyesha mpokeaji wa taarifa; katika Kiswahili huwasilishwa kwa kiambishi cha mtendewa katika “wakamwambia Daudi.”
- source_word: לֵאמֹר
  choice: —
  rationale: Neno hili hutanguliza usemi wa moja kwa moja. Katika Kiswahili, kazi yake inaonyeshwa kwa kawaida na koma pamoja na alama za kunukuu, hivyo “wakisema” haikuhitajika.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Chembe hii inavuta fikira kwa taarifa ya haraka. “Tazama” ni yenye hadhi na inaeleweka katika Kiswahili cha sasa.
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Ni jina linalotambulika la kundi hili la watu katika Kiswahili.
- source_word: נִלְחָמִים
  choice: wanapigana dhidi ya
  rationale: Kauli ya hali ya kuendelea inaonyesha mapigano yanayoendelea; “dhidi ya” inaeleza mwelekeo wa uhasama bila kubainisha mbinu ya shambulio.
- source_word: בִּקְעִילָה
  choice: dhidi ya Keila
  rationale: Ingawa בְּ kwa msingi humaanisha “katika/kwenye,” katika muktadha huu wa kijeshi inaelekea kuonyesha mji unaoshambuliwa. Utata huo umehifadhiwa katika tanbihi.
- source_word: וְהֵמָּה
  choice: nao
  rationale: Kiwakilishi huru cha Kiebrania kinakazia kiima; “nao” kinaendeleza habari na kuhifadhi mkazo huo kwa ufupi.
- source_word: שֹׁסִים
  choice: wanapora
  rationale: Kitenzi kina maana ya kunyang’anya mali au mavuno kwa nguvu katika uvamizi; “wanapora” ni cha kawaida na kinafaa katika muktadha wa vita.
- source_word: אֶת הַגֳּרָנוֹת
  choice: sakafu za kupuria nafaka
  rationale: גֳּרָנוֹת hutaja maeneo yaliyotayarishwa kwa ajili ya kupuria. Kutaja “nafaka” kunafanya kitu hicho kieleweke kwa msomaji wa sasa bila kubadili rejeo la mahali.
