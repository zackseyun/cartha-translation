  yaml_path: translation/ot/1_samuel/023/016.yaml
  text: Then Jonathan son of Saul arose and went to David at Horesh[a], and strengthened his hand in God.
translation:
  language: sw
  text: Ndipo Yonathani mwana wa Sauli akainuka, akaenda kwa Daudi huko Horesha, akautia nguvu mkono wake katika Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamtia moyo katika Mungu”; kihalisi, “akautia nguvu mkono wake katika Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Kitenzi קום katika mfululizo wa masimulizi huonyesha kuanza kwa tendo lenye kusudi. “Akainuka” kinahifadhi mpangilio na ladha ya simulizi la Kiebrania.
- source_word: יְהוֹנָתָן בֶּן שָׁאוּל
  choice: Yonathani mwana wa Sauli
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili, na muundo wa kifamilia umehifadhiwa ili kuonyesha wazi uhusiano wa Yonathani na Sauli.
- source_word: וַיֵּלֶךְ אֶל
  choice: akaenda kwa
  rationale: הלך אל hapa inaonyesha kwenda mpaka kwa mtu fulani; “akaenda kwa” ni usemi wa kawaida na sahihi katika Kiswahili.
- source_word: חֹרְשָׁה
  choice: huko Horesha
  rationale: Neno hili linaeleweka hapa kuwa jina la mahali, Horesha, si nomino ya kawaida yenye maana ya msitu. “Huko” linaonyesha mahali bila kubadili jina lenyewe.
- source_word: וַיְחַזֵּק
  choice: akautia nguvu
  rationale: Katika kausativi, חזק humaanisha kufanya kitu kiwe imara au kukitia nguvu. Tafsiri hii inadumisha maana ya moja kwa moja huku ikikubaliana na taswira ya “mkono.”
- source_word: אֶת יָדוֹ
  choice: mkono wake
  rationale: Kiebrania kinasema kihalisi “mkono wake.” Taswira hiyo imehifadhiwa badala ya kuibadili kimya kimya kuwa “alimtia moyo,” ingawa maana ya kimuktadha ni kumwimarisha Daudi au kumtia moyo.
- source_word: בֵּאלֹהִים
  choice: katika Mungu
  rationale: Kihusishi ב hapa kinaonyesha msingi au mazingira ambamo Daudi aliimarishwa. “Katika Mungu” kinahifadhi uhusiano huo bila kuufasiri zaidi kuwa “kwa njia ya Mungu” au “na Mungu.”
theological_decisions:
- issue: Jinsi ya kutafsiri אֱלֹהִים katika muktadha huu
  choice: Mungu
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana אֱלֹהִים, si jina la agano יהוה. Kwa hiyo “Mungu” hufuata ushahidi wa lugha asilia na huepuka kuingiza jina tofauti la Mungu.
- issue: Maana ya kutiwa nguvu “katika Mungu”
  choice: Taswira na kihusishi vimehifadhiwa bila kufafanua njia hususa
  alternative: Yonathani alimtia Daudi moyo kwa kumkumbusha ahadi za Mungu
  rationale: Mstari unasema tu kwamba Yonathani aliutia nguvu mkono wake katika Mungu; hauelezi hapa maneno au njia alizotumia. Tafsiri haipaswi kuongeza ufafanuzi wa kitheolojia ambao mstari wenyewe hautoi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio rasmi lakini unaoeleweka. “Yonathani,” “Sauli,” “Daudi,” na “Horesha” ni maumbo yanayofaa katika mapokeo ya majina ya Biblia ya Kiswahili. Nahau ya Kiebrania “mkono wake” imehifadhiwa katika maandishi, huku tanbihi ikitoa maana yake ya kawaida zaidi.
