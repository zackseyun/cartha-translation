  text: הֲ/יַסְגִּרֻ֣/נִי בַעֲלֵי֩ קְעִילָ֨ה בְ/יָד֜/וֹ הֲ/יֵרֵ֣ד שָׁא֗וּל כַּֽ/אֲשֶׁר֙ שָׁמַ֣ע עַבְדֶּ֔/ךָ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַגֶּד נָ֖א לְ/עַבְדֶּ֑/ךָ וַ/יֹּ֥אמֶר יְהוָ֖ה יֵרֵֽד־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/011.yaml
  text: Will the men of Keilah hand me over into his hand? Will Saul come down[a], as your servant has heard? O Yahweh, God of Israel, please tell your servant.” And Yahweh said, “He will come down.”
translation:
  language: sw
  text: “Je, watu wa Keila[b] watanikabidhi mkononi mwake[a]? Je, Sauli atashuka, kama mtumishi wako alivyosikia? Ee Yahweh, Mungu wa Israeli, niambie, tafadhali, mimi mtumishi wako.” Yahweh akasema, “Atashuka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mkononi mwake,” yaani, chini ya mamlaka yake.'
    reason: Ufafanuzi wa nahau ya Kiebrania kuhusu mamlaka au udhibiti.
  - marker: b
    text: Neno la Kiebrania linaweza kumaanisha wanaume wenye mamlaka au viongozi wa mji.
    reason: Kuhifadhi upana wa maana ya בַעֲלֵי katika muktadha wa kiraia.
lexical_decisions:
- source_word: יַסְגִּרֻנִי
  choice: watanikabidhi
  rationale: Hifili ya סגר hapa ina maana ya kumtoa mtu na kumweka chini ya mamlaka ya mwingine. ‘Watanikabidhi’ ni Kiswahili cha kawaida kinachoonyesha tendo hilo la kumtoa kwa adui.
- source_word: בַעֲלֵי קְעִילָה
  choice: watu wa Keila
  rationale: Katika muktadha huu wa mji, בעלי inawataja wenyeji wenye mamlaka au wanaume wa mji. ‘Watu wa Keila’ ni ya kawaida na haisisitizi bila sababu kwamba ni watawala pekee; tanbihi inahifadhi uwezekano huo wa maana.
- source_word: בְיָדוֹ
  choice: mkononi mwake
  rationale: Tafsiri hii inadumisha nahau ya Kiebrania inayotumia ‘mkono’ kumaanisha mamlaka au udhibiti. Kiwakilishi kinamrejelea Sauli.
- source_word: יֵרֵד
  choice: atashuka kuja huku / atashuka
  rationale: ירד maana yake ya msingi ni ‘kushuka.’ Katika swali, ‘kuja huku’ huonyesha mwendo kuelekea mahali alipo Daudi; katika jibu fupi, ‘atashuka’ inadumisha umbo la chanzo.
- source_word: כַּאֲשֶׁר שָׁמַע עַבְדֶּךָ
  choice: kama mtumishi wako alivyosikia
  rationale: Hii inawasilisha kwa ufupi habari ambayo Daudi alikuwa ameisikia na kudumisha kujitaja kwake kwa unyenyekevu.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Katika sala mbele za Mungu, עבד ni namna ya unyenyekevu ya kujitaja; ‘mtumishi wako’ inafaa kwa sajili hiyo kuliko neno linalosisitiza hali ya utumwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu la herufi nne limetoholewa kama ‘Yahweh’ badala ya kubadilishwa na cheo.
- source_word: הַגֶּד נָא
  choice: tafadhali mwambie
  rationale: Amri נגד pamoja na chembe נא ni ombi la heshima lakini la dharura la kupewa habari. ‘Tafadhali mwambie’ ni Kiswahili cha asili katika muktadha huu.
- source_word: וַיֹּאמֶר יְהוָה
  choice: Yahweh akasema
  rationale: Hii ni simulizi ya kawaida ya Kiebrania inayoanzisha jibu la Mungu; mpangilio huu ni wa kawaida na wenye hadhi katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Utambulisho wa בַעֲלֵי קְעִילָה
  choice: watu wa Keila, pamoja na tanbihi kuhusu viongozi au wenye mamlaka
  alternative: viongozi wa Keila
  rationale: Neno linaweza kuelekeza kwa wanaume wenye hadhi au mamlaka katika mji, lakini muktadha haulazimishi kulifungia kwa viongozi rasmi pekee. Tafsiri pana pamoja na tanbihi huhifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mazungumzo ya sala yamewekwa kwa lugha inayoeleweka kwa urahisi, huku nahau ya ‘mkononi mwake,’ mwendo wa ‘kushuka,’ na jina ‘Yahweh’ vikihifadhiwa.
