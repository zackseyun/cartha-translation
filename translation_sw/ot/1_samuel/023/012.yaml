base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/012.yaml
  text: Then David said[a], “Will the men of Keilah hand me and my men over into Saul’s hand?” And Yahweh said[c][b], “They will hand you over.”
translation:
  language: sw
  text: Ndipo Daudi akauliza, “Je, watu wa Keila watanikabidhi mimi na watu wangu mikononi mwa Sauli?” Yahweh akasema, “Watakukabidhi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kwa umoja, “Watakukabidhi.” Daudi anasemeshwa kama kiongozi anayewawakilisha watu wake, ambao wanaeleweka kutokana na swali lake.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַסְגִּרוּ / יַסְגִּירוּ
  choice: watakabidhi / Watakukabidhi
  rationale: Hifili ya סגר hapa ina maana ya kumtoa mtu na kumweka chini ya mamlaka ya mwingine. ‘Kukabidhi’ ni Kiswahili cha sasa na cha kawaida kinachoonyesha kumtia mtu mikononi mwa adui.
- source_word: בַּעֲלֵי קְעִילָה
  choice: watu wa Keila
  rationale: Katika muktadha huu wa mji, neno hilo linawahusu wenyeji au viongozi wa Keila. ‘Watu wa Keila’ ni la kawaida na halibani maana kwa viongozi pekee.
- source_word: אֹתִי וְאֶת־אֲנָשַׁי
  choice: mimi na watu wangu
  rationale: Tafsiri hii inahifadhi maana ya msingi ya ‘mimi na watu wangu’ bila kufafanua kupita kiasi kama askari au wafuasi.
- source_word: בְּיַד שָׁאוּל
  choice: mikononi mwa Sauli
  rationale: Nahau ya Kiebrania ina maana ya kutiwa chini ya mamlaka ya Sauli. ‘Mikononi mwa’ huhifadhi taswira ya asili na ni nahau inayoeleweka katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limewasilishwa kama jina binafsi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; ‘Yahweh’ hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Jibu la Yahweh lina kiwakilishi cha umoja ingawa swali linamtaja Daudi pamoja na watu wake
  choice: Watakukabidhi
  alternative: Watakukabidhi wewe na watu wako
  rationale: Kiebrania cha jibu kinamtaja Daudi kwa umoja. Tafsiri inahifadhi hali hiyo na kuepuka kuongeza maneno yasiyokuwamo, huku tanbihi ikieleza kuwa watu wake wanaeleweka kutokana na swali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Kukabidhi mikononi mwa’ huhifadhi nahau na taswira ya Kiebrania bila kuwa ngumu.
