  yaml_path: translation/ot/1_samuel/018/002.yaml
  text: Saul took him that day and did not allow him to return to his father's house[a].
translation:
  language: sw
  text: Siku hiyo Sauli akamchukua Daudi, wala hakumruhusu arudi nyumbani kwa baba yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakumpa ruhusa arudi.” Kiebrania husema kihalisi “hakumpa arudi,” kikitumia נתן kama nahau ya kutoa ruhusa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: akamchukua Daudi
  rationale: Kitenzi לקח maana yake ya msingi ni ‘chukua.’ Jina ‘Daudi’ limetumiwa badala ya kiwakilishi ili rejeo liwe wazi kwa msomaji wa Kiswahili, bila kuongeza maana ya ‘kumwingiza katika utumishi wake,’ ingawa muktadha unaidokeza.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Hili ndilo umbo la kawaida la jina hili katika tafsiri za Biblia za Kiswahili.
- source_word: בַּיּוֹם הַהוּא
  choice: Siku hiyo
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya Kiswahili inayohifadhi wakati maalumu unaotajwa.
- source_word: וְלֹא נְתָנוֹ
  choice: wala hakumruhusu
  rationale: נתן pamoja na kitenzi-jina hapa ni nahau ya kutoa ruhusa. ‘Hakumruhusu’ huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku ‘wala’ ikiendeleza mtiririko wa simulizi.
- source_word: לָשׁוּב
  choice: arudi
  rationale: שׁוב kwa kawaida humaanisha kurudi; ‘arudi’ ni umbo la asili baada ya ‘hakumruhusu.’
- source_word: בֵּית אָבִיו
  choice: nyumbani kwa baba yake
  rationale: Usemi wa Kiebrania unamaanisha nyumba au kaya ya baba yake. ‘Nyumbani kwa baba yake’ ni wa asili katika Kiswahili na huhifadhi maana ya mahali alipoishi chini ya kaya ya baba yake.
