translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, ya heshima, na rahisi kueleweka. Muundo wa simulizi wenye ‘aka-’ umetumiwa kuonyesha mfuatano wa matendo. Nahau ‘machoni pa’ imehifadhiwa kwa kuwa inaeleweka katika Kiswahili na inadumisha ladha ya chanzo.
