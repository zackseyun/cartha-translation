base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/005.yaml
  text: David went out wherever Saul sent him[a], and he acted wisely. So Saul appointed him over the men of war[b], and this was good in the eyes of all the people and also in the eyes of Saul’s servants.
translation:
  language: sw
  text: Daudi akaenda kila mahali Sauli alipomtuma, naye akatenda kwa busara.[a] Basi Sauli akamweka kuwa mkuu wa wapiganaji, na jambo hilo likawa jema machoni pa watu wote na pia machoni pa watumishi wa Sauli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akafanikiwa” au “alikuwa na mafanikio.” Kitenzi cha Kiebrania שׂכל katika muundo huu kinaweza kuonyesha kutenda kwa busara na pia mafanikio yanayotokana na tendo hilo.
    reason: lexical_alternative
  - marker: b
    text: Au, “jambo hilo likawapendeza watu wote na watumishi wa Sauli pia.” Kiebrania kinaweza kumrejelea Daudi mwenyewe, uteuzi wake, au hali yote iliyoelezwa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: akaenda
  rationale: Kitenzi יצא kimsingi ni ‘kutoka/kwenda nje,’ lakini hapa kinaeleza Daudi kwenda kutekeleza majukumu au shughuli alizotumwa na Sauli. ‘Akaenda’ ni ya kawaida katika Kiswahili na haiongezi kwa uhakika wazo la kampeni ambalo limedokezwa tu na muktadha.
- source_word: בְּכֹל אֲשֶׁר יִשְׁלָחֶנּוּ שָׁאוּל
  choice: kila mahali Sauli alipomtuma
  rationale: Kirai hiki kihalisi kina wazo la ‘katika yote ambayo Sauli alimtuma.’ Katika muktadha wa kwenda kutekeleza maagizo mbalimbali, ‘kila mahali ... alipomtuma’ hutoa maana ya kurudiwa na usambazaji kwa Kiswahili cha kawaida.
- source_word: יַשְׂכִּיל
  choice: akatenda kwa busara
  rationale: Hiphil ya שׂכל inaweza kumaanisha kutenda kwa hekima au busara, na pia kufanikiwa kutokana na mwenendo huo. Tafsiri hii inahifadhi kiini cha busara, huku tanbihi ikionyesha maana halali ya kufanikiwa.
- source_word: וַיְשִׂמֵהוּ ... עַל
  choice: akamweka kuwa mkuu wa
  rationale: שׂים pamoja na עַל hapa inaonyesha kumweka mtu katika mamlaka juu ya wengine. ‘Akamweka kuwa mkuu wa’ ni Kiswahili cha asili kinachoeleza uteuzi huo bila kutumia muundo mgumu wa ‘juu ya.’
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: wapiganaji
  rationale: Kirai hiki kihalisi ni ‘watu wa vita.’ ‘Wapiganaji’ ni tafsiri ya kawaida, yenye heshima, na inayoeleweka vizuri kwa kundi la kijeshi bila kulifanya lazima kuwa jeshi la kisasa.
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: jambo hilo likawa jema machoni pa
  rationale: Muundo wa Kiebrania unasema kuwa jambo fulani lilikuwa jema machoni pa watu. ‘Jambo hilo’ linaacha wazi kama kinachorejelewa ni Daudi, uteuzi wake, au hali yote iliyosimuliwa, na ‘machoni pa’ linahifadhi taswira ya nahau ya Kiebrania.
- source_word: כָל הָעָם
  choice: watu wote
  rationale: עָם hapa ina maana pana ya watu, si lazima wanajeshi pekee, hasa kwa kuwa watumishi wa Sauli wanatajwa kando.
- source_word: עַבְדֵי שָׁאוּל
  choice: watumishi wa Sauli
  rationale: עבדים inaweza kutaja watumishi wa kifalme, wakiwemo maofisa na wahudumu. ‘Watumishi’ ni pana na ya moja kwa moja, hivyo haibani maana kuwa maofisa pekee.
