  text: וַ/יְהִ֗י כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֣ר אֶל שָׁא֔וּל וְ/נֶ֨פֶשׁ֙ יְה֣וֹנָתָ֔ן נִקְשְׁרָ֖ה בְּ/נֶ֣פֶשׁ דָּוִ֑ד ו/יאהבו יְהוֹנָתָ֖ן כְּ/נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/001.yaml
  text: And it happened[a], when he had finished speaking to Saul, that Jonathan’s soul was bound to David’s soul[b], and Jonathan loved him as his own soul.
translation:
  language: sw
  text: Ikawa, alipomaliza kuzungumza na Sauli, nafsi ya Yonathani ikafungamana na nafsi ya Daudi[a], naye Yonathani akampenda kama nafsi yake mwenyewe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafsi ya Yonathani ikafungwa pamoja na nafsi ya Daudi.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinarudia neno “nafsi” mara tatu katika aya hii: “nafsi ya Yonathani ... nafsi ya Daudi ... nafsi yake mwenyewe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi kaida ya Kiebrania ya kuendeleza simulizi kwa lugha fupi na yenye hadhi, bila kutumia mtindo wa kizamani usio wa lazima.
- source_word: כְּכַלֹּתוֹ לְדַבֵּר אֶל שָׁאוּל
  choice: alipomaliza kuzungumza na Sauli
  rationale: Muundo wa כְ pamoja na kitenzi-jina unaonyesha wakati unaofuatana. Kiswahili hiki ni cha kawaida na huonyesha kwamba mazungumzo yalikuwa yamekamilika kabla ya tukio linalofuata.
- source_word: נֶפֶשׁ
  choice: nafsi
  rationale: Neno hili limerudiwa mara tatu katika aya. Kulitafsiri kwa uthabiti kuwa ‘nafsi’ kunahifadhi marudio hayo na uzito wa uhusiano wa ndani kuliko kutumia ‘maisha’ au ‘mwenyewe’ pekee.
- source_word: נִקְשְׁרָה
  choice: ikafungamana
  rationale: Mzizi קשר una wazo la kufunga au kuunganisha. ‘Ikafungamana’ ni Kiswahili cha asili kinachohifadhi sitiari ya uhusiano wenye nguvu bila kudokeza wakala ambaye hajatajwa.
- source_word: בְּנֶפֶשׁ דָּוִד
  choice: na nafsi ya Daudi
  rationale: Huhifadhi nomino ‘nafsi’ iliyo wazi katika Kiebrania na kueleza kuunganishwa kwa nafsi hizo kwa namna inayoeleweka katika Kiswahili.
- source_word: וַיֶּאֱהָבוֹ
  choice: naye Yonathani akampenda
  rationale: Kiambishi cha yambwa kinamrejelea Daudi, huku Yonathani akiwa mtendaji. Kumtaja Yonathani wazi kunaondoa utata wa viwakilishi katika Kiswahili bila kuongeza maana.
- source_word: כְּנַפְשׁוֹ
  choice: kama nafsi yake mwenyewe
  rationale: Huhifadhi matumizi ya tatu ya נֶפֶשׁ na nguvu ya ulinganisho. ‘Mwenyewe’ huweka wazi kwamba ni nafsi ya Yonathani mwenyewe.
theological_decisions:
- issue: Asili ya upendo wa Yonathani kwa Daudi
  choice: 'Kutumia lugha ya wazi ya mshikamano wa kina wa kibinafsi: ‘akampenda kama nafsi yake mwenyewe,’ bila kuufafanua kuwa wa kingono au wa kimapenzi.'
  alternative: Kuufasiri hasa kuwa muungano wa kisiasa, au kuwa upendo wa kimapenzi/kingono.
  rationale: Maneno נֶפֶשׁ na אהב yanaonyesha uhusiano na upendo wenye kina, lakini aya yenyewe haitaji wazi asili ya kingono wala kuufanya uhusiano huu kuwa wa kisiasa tu. Tafsiri inadumisha nguvu na uwazi huo bila kuongeza dai lisilomo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ikawa’ huhifadhi mwendo wa simulizi; ‘ikafungamana’ ni ya asili na hubeba sitiari ya Kiebrania. Marudio ya ‘nafsi’ yamehifadhiwa kwa makusudi.
