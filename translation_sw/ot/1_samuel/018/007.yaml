  yaml_path: translation/ot/1_samuel/018/007.yaml
  text: And the women who were celebrating sang responsively[a], saying, “Saul has struck down his thousands[c][b], and David his tens of thousands.”
translation:
  language: sw
  text: 'Wanawake waliokuwa wakisherehekea[b] wakaimbiana[a], wakisema,


    “Sauli amepiga maelfu yake[c],

    na Daudi makumi ya maelfu yake.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakaitikiana”; hapa inaelekea kumaanisha kuimba kwa kuitikiana.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza pia kumaanisha kucheza, kufurahi, au kufanya shamrashamra.
    reason: lexical_alternative
  - marker: c
    text: Au, “amewaua.” Kitenzi cha Kiebrania maana yake halisi ni “amepiga,” lakini hapa kimetumiwa katika maana ya kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנֶינָה
  choice: wakaimbiana
  rationale: Katika muktadha wa wimbo, kitenzi ענה kinaonyesha kuitikiana kwa kuimba. “Wakaimbiana” ni usemi wa kawaida unaowasilisha uimbaji wa kuitikiana bila kuufanya kuwa jibu la mazungumzo tu.
- source_word: הַנָּשִׁים
  choice: wanawake
  rationale: Nomino ya wingi imetafsiriwa moja kwa moja na kubaki wazi katika sentensi.
- source_word: הַמְשַׂחֲקוֹת
  choice: waliokuwa wakisherehekea
  rationale: Kitenzi שׂחק katika mazingira haya ya sherehe ya ushindi kinaweza kujumuisha kucheza, kufurahi, au kufanya shamrashamra. “Kusherehekea” ni pana na ya kawaida bila kubainisha tendo moja tu.
- source_word: וַתֹּאמַרְןָ
  choice: wakisema
  rationale: Hiki kinaunganisha kwa kawaida tendo la kuimba na maneno ya kibwagizo huku kikidumisha mfuatano wa simulizi.
- source_word: הִכָּה
  choice: amewaangusha
  rationale: נכה maana yake ya msingi ni kupiga, lakini hapa iko katika muktadha wa ushindi wa kijeshi. “Amewaangusha” huhifadhi nguvu ya kijeshi na maana inayoweza kuhusisha kuwaua au kuwashinda bila kulazimisha maana moja pekee.
- source_word: באלפו
  choice: maelfu yake
  rationale: Kihusishi pamoja na namba hapa kinaonyesha idadi ya mafanikio ya kijeshi; “maelfu yake” huhifadhi umbo la kishairi na ulinganifu.
- source_word: בְּרִבְבֹתָיו
  choice: makumi ya maelfu yake
  rationale: רבבה humaanisha elfu kumi, na wingi wake hapa unalinganishwa kishairi na “maelfu” ya Sauli.
