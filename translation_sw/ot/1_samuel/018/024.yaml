  text: Saul’s servants told him[a], saying, “David spoke words like these.”
translation:
  language: sw
  text: Watumishi wa Sauli wakamwambia, “Daudi alisema maneno kama haya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa neno kwa neno, “Daudi alisema kulingana na maneno haya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: wakamwambia
  rationale: Hifili ya נגד humaanisha kumwambia au kumjulisha mtu jambo. Katika muktadha huu, “wakamwambia” ni Kiswahili cha kawaida na huunganika kwa urahisi na taarifa inayofuata.
- source_word: עַבְדֵי שָׁאוּל
  choice: Watumishi wa Sauli
  rationale: עבד inaweza kumaanisha watumishi, wahudumu, au maafisa. “Watumishi” inadumisha upana wa neno la Kiebrania bila kubainisha cheo kisichotajwa.
- source_word: לוֹ
  choice: -mw- katika “wakamwambia”
  rationale: Kiwakilishi hiki kinamrejelea Sauli; katika Kiswahili huwasilishwa kiasili kwa kiambishi cha yambwa ndani ya kitenzi.
- source_word: לֵאמֹר
  choice: imewasilishwa kwa usemi wa moja kwa moja
  rationale: Infinitivu hii hutambulisha yaliyosemwa. Alama za usemi wa moja kwa moja zinatimiza kazi hiyo kwa Kiswahili cha sasa bila kuongeza “wakisema,” ambalo lingekuwa zito baada ya “wakamwambia.”
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: maneno kama haya
  rationale: Kiambishi כ־ kina maana ya “kama” au “kulingana na.” Tafsiri hii inadumisha wazo la taarifa inayolingana kwa namna au maudhui na maneno yaliyotangulia, badala ya kuifanya nukuu ya neno kwa neno.
- source_word: דִּבֶּר
  choice: alisema
  rationale: דבר humaanisha kusema au kunena. “Alisema” ni ya kawaida na yenye hadhi katika taarifa ya mazungumzo.
- source_word: דָּוִד
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
