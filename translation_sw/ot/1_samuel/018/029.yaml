translation:
  language: sw
  text: Sauli akaendelea kumwogopa Daudi zaidi[a], naye Sauli akawa adui wa Daudi siku zote[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sauli akazidi kumwogopa Daudi,” au “akaendelea kumwogopa Daudi bado.” Nahau ya Kiebrania huunganisha “kuongeza/kuendelea” na “kuogopa,” nayo עוֹד huongeza maana ya “zaidi” au “bado.”
    reason: lexical_alternative
  - marker: b
    text: Au, “maisha yake yote.” Usemi wa Kiebrania unaweza kumaanisha “daima” au kusisitiza muda wote wa maisha ya Sauli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאסֶף
  choice: akaendelea
  rationale: Muundo wa יָסַף pamoja na kitenzi-jina mara nyingi humaanisha kuendelea au kufanya zaidi; “akaendelea” ni Kiswahili cha kawaida na huhifadhi mwendelezo huo.
- source_word: לֵרֹא
  choice: kumwogopa
  rationale: Kitenzi ירא hapa kinaeleza hofu au woga wa Sauli kwa Daudi; “kumwogopa” ni wazi na cha asili katika Kiswahili.
- source_word: מִפְּנֵי דָוִד
  choice: Daudi
  rationale: Pamoja na ירא, usemi halisi “kutoka/mbele ya uso wa Daudi” humtaja Daudi kama yule anayeogopwa; Kiswahili hakihitaji kutafsiri פָּנִים kihalisi hapa.
- source_word: עוֹד
  choice: hata zaidi
  rationale: Katika muktadha, עוֹד huongeza kiwango cha hofu iliyotajwa tayari; “hata zaidi” huonyesha ongezeko hilo kwa uwazi huku tanbihi ikihifadhi uwezekano wa maana ya “bado/zaidi.”
- source_word: וַיְהִי
  choice: akawa
  rationale: היה inaweza kueleza hali iliyokuwapo au iliyoanza. “Akawa” ni ya asili katika mtiririko wa simulizi na haidai kwamba uadui ulianza hapo kwa mara ya kwanza.
- source_word: אֹיֵב אֶת דָּוִד
  choice: adui wa Daudi
  rationale: אֹיֵב humaanisha adui au mpinzani, na אֶת דָּוִד humweka Daudi kama mlengwa wa uadui; “adui wa Daudi” ni usemi wa moja kwa moja na wa kawaida.
- source_word: כָּל הַיָּמִים
  choice: siku zote
  rationale: Usemi huu unaweza kumaanisha wakati wote au kwa kuendelea. “Siku zote” huhifadhi upana huo bila kulazimisha maana ya kipindi chote cha maisha ya Sauli.
