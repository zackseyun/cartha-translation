base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/018.yaml
  text: And David said to Saul[a], “Who am I, and what is my life, or my father’s family in Israel, that I should become the king’s son-in-law?”
translation:
  language: sw
  text: Ndipo Daudi akamwambia Sauli, “Mimi ni nani, na maisha yangu ni nini, au jamaa ya baba yangu ni nini katika Israeli, hata niwe mkwe wa mfalme?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na hali yangu ni ipi, au jamaa ya baba yangu ni ipi katika Israeli?” Kiebrania husema kwa karibu, “na maisha yangu ni nini?” Usemi huo huenda unasisitiza udogo au hadhi duni ya Daudi; maneno yanayofuata yanaelekeza pia kwenye jamaa ya baba yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akamwambia
  rationale: Wayyiqtol inaendeleza simulizi; “ndipo ... akamwambia” ni ya kawaida na inaonyesha kuwa maneno yanaelekezwa kwa Sauli.
- source_word: מִי אָנֹכִי
  choice: Mimi ni nani
  rationale: Huhifadhi swali la moja kwa moja lenye kujishusha kwa lugha ya Kiswahili iliyo ya kawaida.
- source_word: וּמִי חַיַּי
  choice: na maisha yangu ni nini
  rationale: Hufuata kwa karibu usemi wa Kiebrania usio wa kawaida na kuhifadhi uwezekano kwamba Daudi anasisitiza udogo au kutokuwa na umuhimu kwake, bila kuubadili moja kwa moja kuwa ‘jamaa zangu’.
- source_word: מִשְׁפַּחַת אָבִי בְּיִשְׂרָאֵל
  choice: au jamaa ya baba yangu ina cheo gani katika Israeli
  rationale: מִשְׁפַּחַת אָבִי ni ukoo au jamaa ya upande wa baba. Kuongeza “ina cheo gani” kwa njia ya kimuktadha hufanya swali lililodokezwa lieleweke kwa Kiswahili na kuonyesha hadhi ya familia katika Israeli.
- source_word: כִּי אֶהְיֶה
  choice: hata niwe
  rationale: Katika mfululizo wa maswali ya balagha, “hata niwe” huwasilisha kwa kawaida mshangao wa unyenyekevu kuhusu uwezekano huo.
- source_word: חָתָן לַמֶּלֶךְ
  choice: mkwe wa mfalme
  rationale: Katika muktadha huu חָתָן humaanisha mwanamume anayeingia katika uhusiano wa ndoa na familia ya mfalme. “Mkwe wa mfalme” ni Kiswahili cha kawaida, ingawa neno hilo linaweza kutaja mahusiano mbalimbali ya ukwe.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Tafsiri inahifadhi usemi mgumu wa Kiebrania katika matini kuu na kuueleza katika tanbihi. Alama ya tanbihi imewekwa mwishoni mwa kauli ili isikatishe mfululizo wa maswali.
