base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/027.yaml
  text: So David arose and went[a], he and his men, and struck down two hundred Philistine men. Then David brought their foreskins, and they counted them out in full to the king, so that he might become the king’s son-in-law. And Saul gave him Michal his daughter as a wife.
translation:
  language: sw
  text: Basi Daudi akaondoka, akaenda yeye pamoja na watu wake, akawaua Wafilisti mia mbili. Kisha Daudi akaleta magovi yao, nao wakayahesabu yote mbele ya mfalme[a], ili awe mkwe wa mfalme. Ndipo Sauli akampa Daudi binti yake Mikali kuwa mke wa Daudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawasilisha yote kwa mfalme kwa idadi kamili.” Kitenzi cha Kiebrania ni kigumu na kinaweza kumaanisha kuyahesabu yote au kuwasilisha idadi kamili iliyotakiwa mbele ya mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akaondoka
  rationale: Katika masimulizi, kitenzi קום huonyesha kuanza kwa hatua ya makusudi. ‘Akaondoka’ ni Kiswahili cha kawaida kinachobeba nguvu hiyo bila kudokeza tu kusimama kutoka alipoketi.
- source_word: וַיֵּלֶךְ הוּא וַאֲנָשָׁיו
  choice: akaenda pamoja na watu wake
  rationale: Muundo huu ni wa asili katika Kiswahili na unahifadhi kwamba Daudi mwenyewe alienda akiwa na watu wake.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים
  choice: wakawaua Wafilisti
  rationale: Katika muktadha wa kijeshi נכה humaanisha kupiga hadi kuua; kuletwa kwa magovi yao kunathibitisha kwamba waliuawa. Wingi umewekwa kwa sababu Daudi na watu wake ndio waliotekeleza tendo hilo.
- source_word: מָאתַיִם אִישׁ
  choice: Wafilisti mia mbili
  rationale: אִישׁ baada ya namba huhesabu watu wa kiume. Kiswahili hutumia kwa kawaida ‘Wafilisti mia mbili,’ na muktadha pamoja na tendo la kutahiri baada ya kifo unaweka wazi kuwa walikuwa wanaume.
- source_word: עָרְלֹתֵיהֶם
  choice: magovi yao
  rationale: ‘Magovi’ ni neno la moja kwa moja la kianatomia linalolingana na עָרְלוֹת; kuepuka neno hilo kungeficha maana wazi ya maandishi.
- source_word: וַיְמַלְאוּם לַמֶּלֶךְ
  choice: wakayahesabu yote mbele ya mfalme
  rationale: Kitenzi hiki na kiambishi chake ni vigumu kisintaksia. Katika muktadha kinadokeza kukamilisha idadi iliyotakiwa kwa kuyahesabu au kuyawasilisha mbele ya mfalme; tafsiri kuu inatoa maana ya kuhesabu huku tanbihi ikihifadhi uwezekano wa kuwasilisha idadi kamili.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: ili awe mkwe wa mfalme
  rationale: Hitpaeli ya חתן humaanisha kuingia katika uhusiano wa ndoa. ‘Awe mkwe wa mfalme’ ni fupi, ya kawaida, na inafaa kwa Daudi kuwa mume wa binti ya mfalme.
- source_word: וַיִּתֶּן לוֹ שָׁאוּל אֶת מִיכַל בִּתּוֹ לְאִשָּׁה
  choice: Sauli akampa Daudi binti yake Mikali awe mke wake
  rationale: Tafsiri hii inahifadhi tendo rasmi la Sauli kumpa Daudi binti yake katika ndoa, huku ikitumia mpangilio wa maneno ulio wazi na wa asili katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wa sasa na wenye heshima. Neno la moja kwa moja ‘magovi’ limetumiwa kwa uaminifu kwa maandishi ya Kiebrania. Jina מִיכַל limetolewa kwa tahajia iliyozoeleka ya Kiswahili, ‘Mikali’.
