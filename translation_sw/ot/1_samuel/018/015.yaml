  yaml_path: translation/ot/1_samuel/018/015.yaml
  text: When Saul saw that he was very successful[b][a], he was afraid of him.
translation:
  language: sw
  text: Sauli alipoona kwamba Daudi alifanikiwa sana[a], alimwogopa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alitenda kwa busara sana” au “alisitawi sana.” Kitenzi cha Kiebrania kinaweza kumaanisha kutenda kwa busara na mafanikio yanayotokana na jambo hilo.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “aliogopa kutoka mbele yake,” nahau ya Kiebrania yenye maana ya kumwogopa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Sauli alipoona
  rationale: Mfuatano wa simulizi unaonyesha kwamba kuona kwa Sauli kulitangulia na kuchochea hofu yake; muundo wa “alipoona” unaunganisha vishazi hivyo kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר הוּא
  choice: kwamba Daudi
  rationale: Kiwakilishi cha Kiebrania kinamrejelea Daudi. Kutaja jina lake huondoa utata usio wa maana katika Kiswahili bila kubadili rejeleo.
- source_word: מַשְׂכִּיל
  choice: alifanikiwa
  rationale: Katika muktadha huu, neno linaweza kumaanisha kutenda kwa busara na pia kufanikiwa kunakotokana na mwenendo huo. “Alifanikiwa” linaonyesha matokeo yaliyoonekana ambayo yalimtia Sauli hofu, huku tanbihi ikihifadhi maana mbadala.
- source_word: מְאֹד
  choice: sana
  rationale: Ni kielezi cha kawaida cha Kiswahili kinachowasilisha nguvu ya neno la Kiebrania.
- source_word: וַיָּגָר
  choice: alimwogopa
  rationale: Kitenzi katika muktadha huu kinaeleza hofu au woga wa Sauli dhidi ya Daudi; “alimwogopa” ni cha asili na wazi kwa Kiswahili.
- source_word: מִפָּנָיו
  choice: alimwogopa
  rationale: Kirai hiki ni, kihalisi, “kutoka mbele yake,” lakini pamoja na kitenzi kinaunda nahau yenye maana ya kumwogopa mtu. Maana hiyo imewasilishwa kwa kitenzi chenye yambwa.
