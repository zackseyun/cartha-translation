base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/012.yaml
  text: Saul was afraid of David[a], because Yahweh was with him and had departed from Saul.
translation:
  language: sw
  text: Sauli alimwogopa Daudi[a], kwa sababu Yahwe alikuwa pamoja naye, na alikuwa ameondoka kwa Sauli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sauli alimhofu Daudi.” Kiebrania kinasema kihalisi, “Sauli aliogopa kutoka mbele ya Daudi,” nahau inayomaanisha kwamba Daudi ndiye aliyekuwa kitu au sababu ya hofu ya Sauli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: alimwogopa
  rationale: Kitenzi ירא hapa kinaonyesha hofu ya Sauli kwa Daudi. “Alimwogopa” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: מִלִּפְנֵי
  choice: Daudi (kama kitu cha hofu katika “alimwogopa Daudi”)
  rationale: Ingawa kihalisi ni “kutoka mbele ya/uweponi mwa,” pamoja na ירא na mtu hutumika kama nahau inayomtaja mtu anayesababisha au kuwa kitu cha hofu.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatanguliza sababu ya Sauli kumwogopa Daudi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kwa tahajia ya kawaida ya Kiswahili, “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: עִמּוֹ
  choice: pamoja naye
  rationale: Kiwakilishi kinamhusu Daudi kwa kawaida katika muktadha, huku tafsiri ikihifadhi muundo wa kiwakilishi wa Kiebrania.
- source_word: וּמֵעִם שָׁאוּל סָר
  choice: na alikuwa amemwacha Sauli
  rationale: סר ina maana ya kuondoka au kujitenga. “Alikuwa amemwacha Sauli” ni ya asili katika Kiswahili na wakati timilifu unaonyesha hali iliyokuwapo tayari.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko lina jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya Yahwe kumwacha Sauli
  choice: Yahwe mwenyewe alikuwa amemwacha Sauli, bila kufafanua zaidi namna ya kuondoka huko
  alternative: Roho wa Yahwe alikuwa amemwacha Sauli; au kibali cha Yahwe kilikuwa kimemwacha Sauli
  rationale: Mstari huu unasema Yahwe alikuwa pamoja na Daudi na alikuwa amemwacha Sauli. Tafsiri haiingizi “Roho” kutoka vifungu vya karibu wala kupunguza kauli hiyo iwe kibali pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili kwa wasomaji wa kawaida, huku jina Yahwe, uhusiano wa viwakilishi, na mvutano wa kiteolojia wa andiko vikihifadhiwa.
