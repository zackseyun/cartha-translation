review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Saul's offer, the call for David to fight YHWH's battles, and Saul's wish that the Philistines—not he—would act against David. However, "moyoni" ('in his heart') is not expressed in the Hebrew text and should not be added, even though the narrative context indicates an unspoken intention.
  naturalness: The wording is generally clear and suitably dignified. The final contrast is more natural and complete with "bali," and the marriage offer reads more smoothly when Merabu is retained as the object of "nitakupa."
  terminology: '"Sauli," "Daudi," "Merabu," "Wafilisti," "shujaa," and "vita vya BWANA" are appropriate Standard East African Swahili biblical terminology. "BWANA" suitably represents the divine name in keeping with the stated translation convention.'
  issues:
  - severity: medium
    issue: Addition of "moyoni" in "Kwa maana Sauli alisema moyoni".
    rationale: The Hebrew states only "Saul said" and does not contain a word for heart or inward speech. The context may imply private deliberation, but the translation should not make that implication explicit as though it were in the source text.
  - severity: low
    issue: The adversative relation in the final sentence is underexpressed.
    rationale: The Hebrew explicitly contrasts Saul's hand with that of the Philistines ("but let the hand of the Philistines be against him"). Adding "bali" preserves this contrast naturally in Swahili.
  revised_text: Kisha Sauli akamwambia Daudi, “Tazama, Merabu, binti yangu mkubwa; nitakupa awe mke wako. Ila tu uwe shujaa kwa ajili yangu, na upigane vita vya BWANA.” Kwa maana Sauli alisema, “Mkono wangu usiwe dhidi yake, bali mkono wa Wafilisti uwe dhidi yake.”
  revised_footnotes: []
  revision_rationale: The revision removes the unsupported interpretive addition "moyoni" and restores the explicit Hebrew contrast with "bali." It otherwise retains the draft's accurate names, elevated register, and established rendering of the divine name.
