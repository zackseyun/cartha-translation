base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/017.yaml
  text: Then Saul said to David, “Look, my older daughter Merab—I will give her to you as a wife. Only be a valiant man for me, and fight the LORD’s battles.” For Saul said, “Let not my hand be against him, but let the hand of the Philistines be against him.”
translation:
  language: sw
  text: Kisha Sauli akamwambia Daudi, “Tazama, Merabu, binti yangu mkubwa; nitakupa awe mke wako. Ila tu uwe shujaa kwa ajili yangu, na upigane vita vya BWANA.” Kwa maana Sauli alisema, “Mkono wangu usiwe dhidi yake, bali mkono wa Wafilisti uwe dhidi yake.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni kiashiria cha kuelekeza fikira kwenye pendekezo linalofuata; ‘Tazama’ huhifadhi msisitizo wa Kiebrania kwa lugha yenye hadhi.
- source_word: בִתִּי הַגְּדוֹלָה
  choice: binti yangu mkubwa
  rationale: Katika muktadha wa mabinti wawili wa Sauli, ‘mkubwa’ humaanisha aliyezaliwa kwanza au mwenye umri mkubwa.
- source_word: בֶן־חַיִל
  choice: shujaa
  rationale: Kirai hiki humtaja mtu hodari na jasiri wa vita; ‘shujaa’ ni tafsiri ya asili na wazi katika Kiswahili.
- source_word: מִלְחֲמוֹת יְהוָה
  choice: vita vya BWANA
  rationale: Huhifadhi dai la Sauli kwamba mapambano hayo ni ya YHWH, huku kutumia ‘BWANA’ kukifuata desturi pana ya tafsiri za Kiswahili kwa jina hilo.
- source_word: יָד
  choice: mkono
  rationale: Sitiari ya Kiebrania ya uwezo au kitendo cha kumdhuru mtu inabaki wazi na kueleweka katika Kiswahili.
theological_decisions:
- issue: Kauli ya Sauli kwamba Daudi apigane ‘vita vya BWANA’ huku akiwa na nia ya kumuua kwa mkono wa Wafilisti
  choice: Kuhifadhi maneno ya kidini ya Sauli na kufuatisha moja kwa moja nia yake ya siri
  alternative: Kufafanua kwamba Sauli alitumia jina la BWANA kwa hila
  rationale: Matini yenyewe huweka mvutano huo wazi bila kutoa maelezo ya kitheolojia; tafsiri haipaswi kuamua zaidi ya simulizi.
- issue: Maana ya וְשָׁאוּל אָמַר
  choice: Kwa maana Sauli alisema moyoni
  alternative: Naye Sauli alisema
  rationale: Muktadha unaonyesha hii ni nia isiyotamkwa kwa Daudi, lakini ‘moyoni’ ni ufafanuzi mdogo wa kimuktadha; kauli yenyewe na hila yake zimehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimeundwa kwa urahisi wa kusomeka kwa sauti; jina ‘Merabu’ linafuata umbo linalotamkika kwa kawaida katika Kiswahili. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zilizohitajika.
