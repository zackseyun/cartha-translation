source:
  edition: WLC
  text: וַ/יְהִ֣י בְּ/בוֹאָ֗/ם בְּ/שׁ֤וּב דָּוִד֙ מֵ/הַכּ֣וֹת אֶת הַ/פְּלִשְׁתִּ֔י וַ/תֵּצֶ֨אנָה הַ/נָּשִׁ֜ים מִ/כָּל עָרֵ֤י יִשְׂרָאֵל֙ ל/שור וְ/הַ/מְּחֹל֔וֹת לִ/קְרַ֖את שָׁא֣וּל הַ/מֶּ֑לֶךְ בְּ/תֻפִּ֥ים בְּ/שִׂמְחָ֖ה וּ/בְ/שָׁלִשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/006.yaml
  text: And it happened[a], as they were coming in, when David returned from striking down the Philistine, that the women came out from all the cities of Israel, singing and dancing, to meet King Saul with tambourines, with joy, and with three-stringed instruments.
translation:
  language: sw
  text: Ikawa, walipokuwa wakija, Daudi aliporudi baada ya kumwangusha yule Mfilisti, wanawake wakatoka katika miji yote ya Israeli, wakiimba na kucheza, kwenda kumlaki Mfalme Sauli kwa matari, kwa shangwe, na kwa vinanda vya nyuzi tatu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maana ya neno la Kiebrania שָׁלִשִׁים haijulikani kwa uhakika. Huenda linamaanisha vinanda vya nyuzi tatu, ala kama zeze, au aina nyingine ya ala ya muziki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hufungua tukio jipya katika simulizi kwa mtindo wa kawaida na wenye hadhi wa Kiswahili, bila kutumia lugha ya kizamani kupita kiasi.
- source_word: בְּבוֹאָם
  choice: walipokuwa wakija
  rationale: Kiambishi cha wingi katika Kiebrania kimehifadhiwa bila kumtaja wazi mhusika ambaye andiko lenyewe halimtaji katika mstari huu.
- source_word: בְּשׁוּב דָּוִד
  choice: Daudi aliporudi
  rationale: Huwakilisha kishazi cha wakati na Daudi kama kiima chake wazi.
- source_word: מֵהַכּוֹת אֶת־הַפְּלִשְׁתִּי
  choice: baada ya kumwangusha yule Mfilisti
  rationale: Nכה hapa inaweza kumaanisha kupiga, kushinda, au kuua. 'Kumwangusha' linaonyesha matokeo katika muktadha wa Goliathi bila kubana kitenzi kwa maana moja tu; umoja wa 'Mfilisti' umehifadhiwa.
- source_word: וַתֵּצֶאנָה הַנָּשִׁים
  choice: wanawake wakatoka
  rationale: Kitenzi cha mfululizo wa simulizi kimewasilishwa kwa 'waka-', na יצא huonyesha kutoka kwao mijini ili kwenda kumlaki mfalme.
- source_word: מִכָּל עָרֵי יִשְׂרָאֵל
  choice: katika miji yote ya Israeli
  rationale: Ni usemi wa kijumla unaoonyesha wanawake kutoka miji mbalimbali kote Israeli.
- source_word: לָשׁוּר וְהַמְּחֹלוֹת
  choice: wakiimba na kucheza
  rationale: Muungano wa kuimba na ngoma umeelezwa kwa Kiswahili cha kawaida; nomino ya Kiebrania ya 'ngoma/kucheza' imetolewa kama tendo ili sentensi iwe ya asili.
- source_word: לִקְרַאת שָׁאוּל הַמֶּלֶךְ
  choice: kwenda kumlaki Mfalme Sauli
  rationale: '''Kumlaki'' huonyesha kwenda kukutana na kumpokea mtu anayewasili, kulingana na muktadha.'
- source_word: בְּתֻפִּים
  choice: kwa matari
  rationale: תֹּף ni ngoma ya mkono yenye fremu, inayolingana kwa karibu na tari; neno hili linaeleweka katika Kiswahili sanifu.
- source_word: בְּשִׂמְחָה
  choice: kwa shangwe
  rationale: Huwasilisha furaha ya wazi ya maadhimisho na kuendana na muundo wa virai vinavyoanza kwa 'kwa'.
- source_word: וּבְשָׁלִשִׁים
  choice: na kwa vinanda vya nyuzi tatu
  rationale: Neno hili ni gumu na maana yake haijulikani kwa uhakika. Tafsiri hii huhifadhi uwezekano wa ala za muziki zenye nyuzi tatu huku tanbihi ikionyesha kutokuwa na uhakika.
