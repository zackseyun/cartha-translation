translation:
  language: sw
  text: Sauli akaona na akajua kwamba Yahwe alikuwa pamoja na Daudi, na kwamba Mikali, binti wa Sauli, alimpenda Daudi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: akaona
  rationale: Kitenzi ראה kwa kawaida humaanisha ‘kuona.’ Mfuatano ‘akaona na akajua’ unahifadhi hatua kutoka kuona hadi kutambua.
- source_word: וַיֵּדַע
  choice: akajua
  rationale: ידע humaanisha ‘kujua’; hapa inaeleza utambuzi thabiti wa Sauli kutokana na alichokiona.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי inaanzisha maudhui ya jambo ambalo Sauli alijua.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetolewa kwa umbo la Kiswahili ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: עִם
  choice: alikuwa pamoja na
  rationale: Hili linaonyesha uwepo au ushirika wa Yahwe na Daudi bila kufafanua kupita kiasi maana ya kibali cha Mungu.
- source_word: וּמִיכַל בַּת שָׁאוּל
  choice: na kwamba Mikali binti Sauli
  rationale: Ingawa hakuna כִּי ya pili katika Kiebrania, ‘kwamba’ imerudiwa ili kuweka wazi kwamba kifungu hiki pia ni sehemu ya yale Sauli aliyojua. ‘Binti Sauli’ ni uwasilishaji wa kawaida na wa karibu wa muundo wa Kiebrania.
- source_word: אֲהֵבַתְהוּ
  choice: alimpenda
  rationale: Umbo hili linaonyesha hali au tendo linaloendelea; wakati uliopita wa kawaida ni wa asili katika simulizi la Kiswahili bila kuongeza wazo la ‘kuanza kumpenda.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Maandishi yana jina binafsi la Mungu, YHWH. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, na ni tahajia iliyozoeleka katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi, chenye heshima na kinachoeleweka kwa urahisi. Muundo ‘akaona na akajua’ umehifadhiwa kwa makusudi ili kufuata mfuatano wa Kiebrania; hakuna tanbihi inayohitajika.
