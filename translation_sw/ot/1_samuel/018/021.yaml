translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Taswira ya “mkono” na “mtego” imehifadhiwa, huku utata halisi wa בִּשְׁתַּיִם ukionyeshwa kwa tanbihi.
