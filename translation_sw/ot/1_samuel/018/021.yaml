base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/021.yaml
  text: Then Saul said[a], “I will give her to him, so that she may become a snare to him and the hand of the Philistines may be against him.” So Saul said to David, “By the second one you may become my son-in-law today.”
translation:
  language: sw
  text: Ndipo Sauli akasema, “Nitampa awe mke wake, ili awe mtego kwake, na mkono wa Wafilisti uwe dhidi yake.” Kisha Sauli akamwambia Daudi, “Kwa binti wa pili[a] unaweza kuwa mkwe wangu leo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kwa mara ya pili unaweza kuwa mkwe wangu leo.” Kirai cha Kiebrania ni cha mkato, na kinaweza kumaanisha ama binti wa pili wa Sauli ama nafasi ya pili ya Daudi kuoa katika familia ya Sauli.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְּנֶנָּה לּוֹ
  choice: Nitamtoa kwake
  rationale: Katika muktadha wa ndoa, kitenzi נתן chenye yambwa wa kike humaanisha kumpa binti kwa mwanamume awe mke wake. Tafsiri fupi inadumisha namna ya Kiebrania huku muktadha ukibainisha maana ya ndoa.
- source_word: וּתְהִי לוֹ לְמוֹקֵשׁ
  choice: ili awe mtego kwake
  rationale: מוֹקֵשׁ ni mtego au tanzi. “Mtego” ni Kiswahili cha kawaida kinachohifadhi sitiari, na “ili” huonyesha kusudi ovu la Sauli katika muktadha.
- source_word: וּתְהִי בוֹ יַד פְּלִשְׁתִּים
  choice: na mkono wa Wafilisti uwe dhidi yake
  rationale: “Mkono” ni sitiari ya Kiebrania kwa nguvu au hatua ya uhasama. Kuihifadhi huendeleza taswira ya chanzo, huku “dhidi yake” ikifanya uhasama huo uwe wazi.
- source_word: בִּשְׁתַּיִם
  choice: Kupitia wa pili
  rationale: Kirai hiki ni cha mkato na kina utata. Katika muktadha kinaweza kuelekeza kwa binti wa pili wa Sauli, Mikali; “kupitia wa pili” huhifadhi maana hiyo bila kuuficha uwezekano wa kuelewa “mara ya pili,” unaotolewa katika tanbihi.
- source_word: תִּתְחַתֵּן בִּי
  choice: unaweza kuwa mkwe wangu
  rationale: Hitpaeli ya חתן pamoja na ב humaanisha kuingia katika uhusiano wa kindoa na mtu. Kwa kuwa Daudi angeoa binti ya Sauli, “kuwa mkwe wangu” ni usemi wa asili na sahihi katika Kiswahili.
- source_word: הַיּוֹם
  choice: leo
  rationale: הַיּוֹם kwa kawaida humaanisha “leo”; hapa inadumisha msisitizo wa wakati wa sasa katika maneno ya Sauli.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Ndipo Sauli akasema ... Kisha Sauli akamwambia
  rationale: 'Muundo wa usemi maradufu umehifadhiwa: kwanza nia ya Sauli, kisha maneno yake kwa Daudi. Tofauti ndogo ya viunganishi na kuingizwa kwa yambwa “Daudi” huleta usomaji wa kawaida wa Kiswahili.'
