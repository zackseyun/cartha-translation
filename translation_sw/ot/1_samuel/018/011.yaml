  text: Sauli akarusha mkuki huku akisema, “Nitampigilia Daudi ukutani.” Lakini Daudi akamkwepa mara mbili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּטֶל
  choice: akarusha
  rationale: Kitenzi kinaeleza Sauli kuutupa au kuurusha mkuki; “akarusha” ni cha kawaida na kinaonyesha shambulio lililolengwa.
- source_word: אַכֶּה בְדָוִד וּבַקִּיר
  choice: Nitampigilia Daudi ukutani
  rationale: Usemi wa Kiebrania kwa uhalisi ni ‘nitampiga Daudi na ukuta’; maana katika muktadha ni kumchoma au kumgandamiza Daudi kwa mkuki dhidi ya ukuta. “Nitampigilia ... ukutani” huhifadhi taswira hiyo kwa Kiswahili cha kawaida.
- source_word: וַיִּסֹּב ... מִפָּנָיו
  choice: akamkwepa
  rationale: Kifungu kina maana ya kugeuka au kuondoka mbele yake; katika shambulio hili, “akamkwepa” huwasilisha kitendo hicho kwa uwazi bila kuongeza namna maalumu ya mwendo.
- source_word: פַּעֲמָיִם
  choice: mara mbili
  rationale: Tafsiri ya moja kwa moja ya idadi ya matukio.
