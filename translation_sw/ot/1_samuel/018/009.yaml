  yaml_path: translation/ot/1_samuel/018/009.yaml
  text: And Saul eyed David from that day forward[a].
translation:
  language: sw
  text: Tangu siku hiyo na kuendelea, Sauli akawa akimtazama Daudi kwa jicho baya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sauli akaendelea kumwangalia Daudi,” kwa maana ya kumchunguza kwa wivu au mashaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: akawa aki-
  rationale: Muundo huu unaunganisha simulizi na kuonyesha hali au tendo lililoendelea, badala ya tukio la mara moja.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: עון
  choice: akimtazama ... kwa jicho baya
  rationale: Neno hili adimu katika muktadha huu linaonyesha kumwangalia mtu kwa uhasama, wivu, au mashaka. Nahau ya Kiswahili ‘kumtazama kwa jicho baya’ hudumisha wazo la mtazamo hasi bila kuamua kuwa ulikuwa wivu pekee au mashaka pekee.
- source_word: אֶת דָּוִד
  choice: Daudi
  rationale: אֶת ni kiashiria cha yambwa tendwa kisichotafsiriwa moja kwa moja; Daudi ni umbo la kawaida la jina hilo katika Kiswahili.
- source_word: מֵהַיּוֹם הַהוּא וָהָלְאָה
  choice: Tangu siku hiyo na kuendelea
  rationale: Kauli hii ya wakati inaonyesha mwanzo wa mtazamo wa Sauli ulioendelea baadaye.
theological_decisions:
- issue: Chanzo cha mtazamo hasi wa Sauli
  choice: kwa jicho baya
  alternative: kwa wivu; kwa mashaka
  rationale: Muktadha unaruhusu wivu na mashaka, lakini neno lenyewe halilazimishi kuchagua mojawapo. Tafsiri kuu inahifadhi upana huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishazi cha wakati mwanzoni ni wa asili katika Kiswahili, na ‘kwa jicho baya’ ni nahau inayoeleweka bila kuongeza sababu mahususi kuliko ilivyo katika Kiebrania.
