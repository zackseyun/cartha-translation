base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/022.yaml
  text: So Saul commanded his servants[a], “Speak to David privately, saying, ‘Look, the king delights in you, and all his servants love you[b]. So now become the king’s son-in-law.’”
translation:
  language: sw
  text: Basi Sauli akawaamuru watumishi wake, “Semeni na Daudi kwa siri[a], mkisema, ‘Tazama, mfalme anapendezwa nawe, na watumishi wake wote wanakupenda. Basi sasa uwe mwana-mkwe wa mfalme[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa faragha” au “kwa sauti ya chini.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana nyingine, “uingie katika ukoo wa mfalme kwa ndoa” au “uungane na mfalme kwa ndoa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: akawaamuru
  rationale: Kitenzi צוה kina nguvu ya kutoa amri; ‘akawaamuru’ kinaonyesha wazi kwamba Sauli alitoa agizo.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: עבד katika mazingira ya kifalme inaweza kumaanisha watumishi, wahudumu, au maafisa; ‘watumishi wake’ ni ya kawaida na haiainishi vyeo vyao kupita ushahidi.
- source_word: דַּבְּרוּ אֶל־דָּוִד
  choice: Semeni na Daudi
  rationale: Muundo huu unaagiza watumishi wazungumze moja kwa moja na Daudi; ‘semeni na Daudi’ ni wa heshima na wa moja kwa moja.
- source_word: בַּלָּט
  choice: kwa siri
  rationale: Neno hili hueleza kusema kwa namna iliyofichwa au isiyosikiwa na wengine; ‘kwa siri’ ni Kiswahili cha kawaida, huku ‘kwa faragha’ likibaki chaguo linalowezekana.
- source_word: הִנֵּה
  choice: Tazama
  rationale: הנה huvuta fikira kwenye kauli inayofuata; ‘Tazama’ huhifadhi nguvu hiyo kwa mtindo wenye hadhi.
- source_word: חָפֵץ בְּךָ
  choice: anapendezwa nawe
  rationale: חפץ ב־ humaanisha kupendezwa au kufurahia mtu; ‘anapendezwa nawe’ ni ya asili na huepuka maana ya kimapenzi isiyokusudiwa.
- source_word: אֲהֵבוּךָ
  choice: wanakupenda
  rationale: אהב kwa msingi humaanisha ‘kupenda’; tafsiri hii huhifadhi kauli ya moja kwa moja bila kuipunguza kuwa kupendelea tu.
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Kirai hiki kinaunganisha upendeleo uliotajwa na mwito wa kuchukua hatua; ‘Basi sasa’ huonyesha mpito na hitimisho hilo.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: uwe mkwe wa mfalme
  rationale: Hitpaeli ya חתן humaanisha kuingia katika uhusiano wa kindoa; katika muktadha huu Daudi angekuwa mkwe wa mfalme kwa kumwoa binti yake. ‘Uwe mkwe wa mfalme’ ni kifupi na cha asili, ingawa neno ‘mkwe’ laweza kutaja mahusiano kadhaa ya kindoa.
