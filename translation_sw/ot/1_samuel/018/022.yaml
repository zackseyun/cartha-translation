  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kauli ya moja kwa moja imehifadhiwa, na msamiati wa kifalme umetolewa kwa lugha inayoeleweka kwa wasomaji wa kawaida.
