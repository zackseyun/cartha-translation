base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/030.yaml
  text: Then the commanders of the Philistines went out[a], and as often as they went out, David acted more wisely than all the servants of Saul[c][b], so that his name was highly esteemed.
translation:
  language: sw
  text: Kisha makamanda wa Wafilisti wakatoka. Kila mara walipotoka, Daudi alitenda kwa busara kuliko watumishi wote wa Sauli[a], na jina lake likaheshimiwa sana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Daudi alifanikiwa zaidi kuliko watumishi wote wa Sauli.” Kitenzi cha Kiebrania kinaweza kumaanisha kutenda kwa busara kunakoleta mafanikio.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “jina lake likawa la thamani sana,” yaani sifa yake ikaheshimiwa sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: makamanda wa Wafilisti
  rationale: Katika muktadha huu wa mapigano, שָׂרִים inaelekea kumaanisha viongozi wa kijeshi; “makamanda” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: וַיֵּצְאוּ
  choice: wakatoka
  rationale: Huhifadhi maana ya msingi ya יצא bila kuongeza wazi kwamba waliandamana au walienda vitani, jambo ambalo halijasemwa moja kwa moja katika Kiebrania.
- source_word: מִדֵּי צֵאתָם
  choice: kila mara walipotoka
  rationale: 'Muundo huu unaonyesha tendo lililorudiwa: kila wakati viongozi hao walipotoka.'
- source_word: שָׂכַל
  choice: alitenda kwa busara
  rationale: Kitenzi hiki kinaweza kueleza kutenda kwa hekima au busara kwa namna inayoleta mafanikio. Tafsiri hii huhifadhi wazo la mwenendo wa busara, huku tanbihi ikionyesha maana inayowezekana ya kufanikiwa.
- source_word: מִכֹּל עַבְדֵי שָׁאוּל
  choice: kuliko watumishi wote wa Sauli
  rationale: עֲבָדִים hapa inawahusu watu waliokuwa katika utumishi wa kifalme wa Sauli. “Watumishi” ni pana vya kutosha bila kuwafanya watumwa au maofisa pekee.
- source_word: וַיִּיקַר שְׁמוֹ מְאֹד
  choice: jina lake likaheshimiwa sana
  rationale: Usemi wa Kiebrania unasema jina lake likawa la thamani au heshima kubwa, yaani sifa yake ikathaminiwa sana. Tafsiri hii huhifadhi picha ya “jina” kwa Kiswahili cha asili.
