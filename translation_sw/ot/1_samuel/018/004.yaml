base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/004.yaml
  text: Then Jonathan stripped off the robe that was on him and gave it to David[a], along with his armor, and even his sword, his bow, and his belt.
translation:
  language: sw
  text: Ndipo Yonathani akavua joho alilokuwa amevaa, akampa Daudi[a], pamoja na mavazi yake, hata upanga wake, upinde wake na mshipi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mavazi yake rasmi” au “mavazi yake ya kijeshi.” Neno la Kiebrania linaweza kumaanisha mavazi, mara nyingi rasmi au ya kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּשֵּׁט
  choice: akavua
  rationale: Kitenzi hiki katika kauli ya kujitendea kinaonyesha kwamba Yonathani alijivua vazi; “akavua” ni Kiswahili cha kawaida na hakidokezi kwamba alivua nguo zote.
- source_word: הַמְּעִיל
  choice: joho
  rationale: Neno hili hutaja vazi la nje kama joho au koti refu; “joho” linafaa kwa vazi lenye hadhi katika simulizi hili.
- source_word: אֲשֶׁר עָלָיו
  choice: alilokuwa amevaa
  rationale: Hutambulisha joho lililokuwa mwilini mwa Yonathani; tafsiri hii ni ya asili katika Kiswahili.
- source_word: וַיִּתְּנֵהוּ לְדָוִד
  choice: akampa Daudi
  rationale: Kiwakilishi cha Kiebrania kinarejelea joho, na muundo huu mfupi unaeleweka wazi katika Kiswahili.
- source_word: וּמַדָּיו
  choice: pamoja na mavazi yake
  rationale: מַדִּים humaanisha mavazi, mara nyingi mavazi rasmi au ya kijeshi. “Mavazi” huhifadhi upana wa maana kuliko “silaha,” hasa kwa kuwa silaha maalumu zinafuata katika orodha.
- source_word: וְעַד
  choice: hata
  rationale: עַד inayorudiwa inapanua orodha hadi vitu vya Yonathani vya binafsi; “hata” huwasilisha msisitizo huo kwa Kiswahili cha kawaida bila kurudia kwa namna nzito.
- source_word: חַרְבּוֹ
  choice: upanga wake
  rationale: Ni tafsiri ya kawaida na sahihi ya neno hili katika muktadha wa kijeshi.
- source_word: קַשְׁתּוֹ
  choice: upinde wake
  rationale: Ni tafsiri ya kawaida ya silaha hii.
- source_word: חֲגֹרוֹ
  choice: mshipi wake
  rationale: Neno hutaja kitu kinachofungwa kiunoni; “mshipi” ni neno la sasa, lenye heshima na linaloeleweka kwa urahisi.
theological_decisions:
- issue: Maana ya kisimulizi ya zawadi za Yonathani
  choice: Aya inaeleza tu kwamba Yonathani alimpa Daudi joho, mavazi na vifaa vyake bila kutaja moja kwa moja maana ya ishara hiyo.
  alternative: Kufafanua zawadi hizo kuwa kukiri kwamba Daudi angekuwa mfalme, au kuwa ishara za urafiki wa agano pekee.
  rationale: Kiebrania kinaeleza matendo yenyewe lakini hakifafanui ishara yake katika aya hii. Tafsiri inaacha mvutano huo wa kisimulizi na kiteolojia uamuliwe na muktadha mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Joho,” “mavazi,” na “mshipi” ni maneno yanayoeleweka bila lugha ya kizamani. Muundo wa sentensi unafuata mtiririko wa simulizi la Kiebrania huku ukibaki wa asili katika Kiswahili.
