base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/008.yaml
  text: Then Saul became very angry[a], and this matter displeased him. He said, “They have given David ten thousands, but to me they have given the thousands[b]; what more can he have but the kingdom?”
translation:
  language: sw
  text: Ndipo Sauli akakasirika sana, na jambo hilo likamchukiza. Akasema, “Wamempa Daudi makumi ya maelfu[a], lakini mimi wamenipa maelfu tu. Ni nini kingine kilichobaki kwake isipokuwa ufalme?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata zaidi muundo wa Kiebrania, “Wamemhesabia Daudi makumi ya maelfu, lakini mimi wamenihesabia maelfu tu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kimebanwa: “na bado kwake ni ufalme tu,” yaani, kwa maoni ya Sauli, kitu pekee kilichosalia kwa Daudi kupokea ni ufalme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְשָׁאוּל מְאֹד
  choice: Sauli akakasirika sana
  rationale: Kitenzi kinaonyesha hasira inayowaka, na מְאֹד hukazia kiwango chake. ‘Akakasirika sana’ ni Kiswahili cha kawaida na chenye nguvu inayofaa.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: jambo hilo likamchukiza
  rationale: Nahau ya Kiebrania, kihalisi ‘likawa baya machoni pake,’ hapa inaonyesha kuwa Sauli hakupendezwa kabisa na jambo hilo. ‘Likamchukiza’ huwasilisha hisia hiyo kwa Kiswahili cha asili.
- source_word: הַדָּבָר הַזֶּה
  choice: jambo hilo
  rationale: דבר inaweza kuwa neno, kauli, jambo, au tukio. Hapa inarejelea wimbo au kauli iliyotangulia, na ‘jambo hilo’ inadumisha upana wa maana.
- source_word: נָתְנוּ
  choice: wamempa / wamenipa
  rationale: Maana ya msingi ni ‘kutoa/kumpa.’ Katika muktadha, ni kuwapa Daudi na Sauli sifa au idadi ya ushindi; tafsiri kuu inadumisha taswira ya Kiebrania, huku tanbihi ikieleza maana ya kimuktadha.
- source_word: רְבָבוֹת
  choice: makumi ya maelfu
  rationale: Wingi huu unaonyesha vikundi vya elfu kumi. ‘Makumi ya maelfu’ ni Kiswahili wazi na hudumisha utofauti na ‘maelfu.’
- source_word: הָאֲלָפִים
  choice: maelfu tu
  rationale: ‘Maelfu’ huhifadhi ulinganisho wa namba. ‘Tu’ huonyesha dharau na tofauti iliyo katika malalamiko ya Sauli, bila kubadili kiini cha kauli.
- source_word: וְעוֹד לוֹ אַךְ הַמְּלוּכָה
  choice: Sasa amebakiwa na nini ila ufalme?
  rationale: Kifungu cha Kiebrania kimebanwa, kihalisi ‘na bado kwake ni ufalme tu.’ Swali hili la balagha linaeleza kwa kawaida hofu ya Sauli kwamba kitu pekee kilichosalia kwa Daudi ni ufalme.
- source_word: הַמְּלוּכָה
  choice: ufalme
  rationale: Neno linaweza kumaanisha ufalme, ukuu wa kifalme, au mamlaka ya kutawala. ‘Ufalme’ ni neno la kawaida linalofaa katika muktadha wa hofu ya Sauli kuhusu Daudi kutawala.
