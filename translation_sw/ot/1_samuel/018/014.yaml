  text: And David was acting wisely in all his ways[a], and Yahweh was with him.
translation:
  language: sw
  text: Daudi alitenda kwa hekima katika kila jambo[a], naye Yahweh alikuwa pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alifanikiwa” au “alifaulu”; neno la Kiebrania linaweza kumaanisha kutenda kwa busara kunakoleta mafanikio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: alitenda
  rationale: Muundo huu unatanguliza mwenendo unaoendelea wa Daudi; katika Kiswahili, kitenzi kinachofuata kinabeba wazo hilo kwa kawaida bila kutafsiri kitenzi hiki kivyake kuwa ‘alikuwa’.
- source_word: דָוִד
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: לְכָל דָּרְכָו
  choice: katika njia zake zote
  rationale: Huhifadhi taswira ya Kiebrania ya ‘njia’ huku ikimaanisha mwenendo na shughuli zake zote.
- source_word: מַשְׂכִּיל
  choice: kwa hekima
  rationale: Neno hili linaweza kuonyesha kutenda kwa busara na pia kufanikiwa kunakotokana na busara hiyo. ‘Kwa hekima’ huhifadhi kiini cha mwenendo bila kulifanya liwe matokeo pekee.
- source_word: וַיהוָה
  choice: naye Yahwe
  rationale: Jina la agano יְהוָה limetolewa kwa jina ‘Yahwe’; ‘naye’ huunganisha kishazi kwa Kiswahili cha kawaida.
- source_word: עִמּוֹ
  choice: alikuwa pamoja naye
  rationale: Huonyesha kuwapo na kuandamana kwa Mungu na Daudi, pamoja na dokezo la msaada na kibali katika muktadha.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu la herufi nne. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Uhusiano kati ya hekima na mafanikio katika מַשְׂכִּיל
  choice: alitenda kwa hekima
  alternative: alifanikiwa; alisitawi
  rationale: Chaguo hili halidai kwamba neno linahusu matokeo tu; huhifadhi mvutano wa maana kati ya mwenendo wa busara na mafanikio yanayotokana nao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kwa msomaji wa kawaida, huku ‘njia zake zote’ ikihifadhi taswira ya asili na tanbihi ikihifadhi upana wa maana ya מַשְׂכִּיל.
