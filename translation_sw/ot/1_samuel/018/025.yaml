  text: וַ/יֹּ֨אמֶר שָׁא֜וּל כֹּֽה תֹאמְר֣וּ לְ/דָוִ֗ד אֵֽין חֵ֤פֶץ לַ/מֶּ֨לֶךְ֙ בְּ/מֹ֔הַר כִּ֗י בְּ/מֵאָה֙ עָרְל֣וֹת פְּלִשְׁתִּ֔ים לְ/הִנָּקֵ֖ם בְּ/אֹיְבֵ֣י הַ/מֶּ֑לֶךְ וְ/שָׁא֣וּל חָשַׁ֔ב לְ/הַפִּ֥יל אֶת דָּוִ֖ד בְּ/יַד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/025.yaml
  text: Then Saul said[a], “Thus you shall say to David, ‘The king has no desire for a bride-price except a hundred Philistine foreskins[c][b], to take vengeance on the king’s enemies.’” Now Saul intended to make David fall by the hand of the Philistines.
translation:
  language: sw
  text: 'Ndipo Sauli akasema, “Mwambieni Daudi hivi: ‘Mfalme hataki mahari yoyote[a], isipokuwa magovi mia moja ya Wafilisti[b], ili kulipiza kisasi kwa maadui wa mfalme.’” Lakini Sauli alikusudia kumwangusha Daudi kwa mkono wa Wafilisti[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mahari” hapa ni malipo yaliyotolewa na bwana-arusi au familia yake kuhusiana na ndoa; si mali ambayo familia ya bibi-arusi humpa bwana-arusi.
    reason: cultural_note
  - marker: b
    text: Au, “bali magovi mia moja ya Wafilisti tu.”
    reason: lexical_alternative
  - marker: c
    text: “Kumwangusha Daudi kwa mkono wa Wafilisti” huenda kunamaanisha kusababisha auawe na Wafilisti, lakini Kiebrania kinaacha jambo hilo bila kusemwa wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹהַר
  choice: mahari
  rationale: Katika Kiswahili cha Afrika Mashariki, “mahari” ni malipo yanayotolewa kuhusiana na ndoa, hivyo inafaa kwa מֹהַר kuliko maneno yanayoweza kumaanisha mali anayopewa bibi-arusi.
- source_word: אֵין חֵפֶץ לַמֶּלֶךְ
  choice: Mfalme hataki ... yoyote
  rationale: Hii ni njia ya kawaida na ya wazi ya kueleza kwamba mfalme hana tamaa au shauku ya kupokea mahari ya kawaida katika muktadha huu.
- source_word: בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  choice: isipokuwa magovi mia moja ya Wafilisti
  rationale: “Magovi” huhifadhi waziwazi na bila kupunguza ukali wa dai la Kiebrania; “isipokuwa” huonyesha kwamba kitu hiki kinachukua nafasi ya mahari ya kawaida.
- source_word: לְהִנָּקֵם בְּאֹיְבֵי הַמֶּלֶךְ
  choice: ili kulipiza kisasi kwa maadui wa mfalme
  rationale: Tafsiri hii inaonyesha kusudi la dai hilo na maana ya kisasi ya נקם bila kuongeza maelezo yasiyosemwa kuhusu namna kisasi hicho kingetekelezwa.
- source_word: חָשַׁב
  choice: alikusudia
  rationale: Katika muktadha huu neno hilo linaonyesha nia au mpango wa makusudi, si wazo la kawaida tu.
- source_word: לְהַפִּיל אֶת־דָּוִד
  choice: kumwangusha Daudi
  rationale: Hii huhifadhi sitiari ya Kiebrania ya kumsababisha Daudi aanguke, ambayo katika muktadha huenda inadokeza kuuawa kwake bila kulitaja moja kwa moja.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: kwa mkono wa Wafilisti
  rationale: Huhifadhi nahau ya Kiebrania inayotaja Wafilisti kuwa watendaji ambao Sauli alitarajia wamsababishie Daudi kuanguka.
theological_decisions:
- issue: Mhusika wa kulipiza kisasi katika לְהִנָּקֵם
  choice: ili kulipiza kisasi kwa maadui wa mfalme
  alternative: ili mfalme alipiziwe kisasi kwa maadui wake
  rationale: Muundo usio na mtenda aliyetajwa wazi huepuka kuamua kupita kiasi ikiwa mfalme ndiye anayelipiza kisasi au analipiziwa kisasi, huku ukihifadhi kusudi la kauli ya Sauli.
- issue: Maana ya “kumwangusha Daudi”
  choice: Kuhifadhi sitiari ya kuanguka
  alternative: kumuua Daudi
  rationale: Muktadha unaelekea kwenye kifo, lakini Kiebrania hakitumii kitenzi cha moja kwa moja cha kuua; tafsiri haipaswi kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mwambieni Daudi hivi” ni agizo la kawaida na linaloeleweka; “magovi” huhifadhi uwazi mkali wa maandishi; nahau “kwa mkono wa” imehifadhiwa kwa sababu inaeleweka katika mtindo wa kibiblia na inaelezwa na tanbihi.
