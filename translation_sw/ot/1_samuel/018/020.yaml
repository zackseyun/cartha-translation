translation:
  language: sw
  text: Mikali, binti ya Sauli, alimpenda Daudi. Wakamwambia Sauli, na jambo hilo likampendeza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, “jambo hilo lilikuwa sawa machoni pake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֶּאֱהַב
  choice: alimpenda
  rationale: Kitenzi אהב humaanisha kupenda moja kwa moja. “Alimpenda” hakiongezi maana ya kuanza kupenda ambayo haijaelezwa wazi katika umbo la Kiebrania.
- source_word: מִיכַל
  choice: Mikali
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בַּת שָׁאוּל
  choice: binti ya Sauli
  rationale: Huwasilisha kwa Kiswahili cha kawaida uhusiano wa kifamilia ulio katika mfuatano wa nomino wa Kiebrania.
- source_word: אֶת דָּוִד
  choice: Daudi
  rationale: Kiashiria cha yambwa אֶת hakitafsiriwi kwa neno tofauti; jina limetoholewa kwa desturi ya Kiswahili.
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: Wakamwambia Sauli
  rationale: Umbo la wingi lenye mtendaji asiyetajwa limehifadhiwa badala ya kugeuzwa kuwa kauli tendwa; נגד katika Hifili hapa ni kusema au kutoa taarifa.
- source_word: וַיִּשַׁר
  choice: likampendeza
  rationale: Katika nahau hii, ישר huonyesha kuwa jambo lilionekana jema au la kupendeza kwa mtu. “Likampendeza” ni Kiswahili cha asili kinachohifadhi tathmini hiyo.
- source_word: הַדָּבָר
  choice: jambo hilo
  rationale: דבר hapa hurejelea taarifa au hali iliyotajwa, si lazima neno lililosemwa; “jambo hilo” hurejelea kwa uwazi habari kuhusu upendo wa Mikali.
- source_word: בְּעֵינָיו
  choice: -mpendeza
  rationale: Nahau ya Kiebrania “machoni pake” imetolewa kwa Kiswahili cha kawaida ndani ya kitenzi “likampendeza,” huku umbo halisi likiwekwa katika tanbihi.
