base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/010.yaml
  text: And it happened on the next day that an evil spirit from God rushed upon Saul[a], and he prophesied within the house while David was playing with his hand, as day by day[d][c][b]; and the spear was in Saul’s hand.
translation:
  language: sw
  text: Ikawa siku iliyofuata, roho mbaya kutoka kwa Mungu ikamvamia Sauli[a]. Naye akatabiri[b] ndani ya nyumba, huku Daudi akipiga muziki kwa mkono wake[c], kama alivyofanya kila siku; na mkuki ulikuwa mkononi mwa Sauli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho yenye kudhuru kutoka kwa Mungu.” Kwa Kiebrania, kwa tafsiri halisi ni “roho mbaya ya Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akawa katika msisimko wa kinabii.” Kitenzi kinaweza kumaanisha kutabiri au kutenda kama nabii katika hali ya msisimko; katika muktadha huu huenda kinaeleza tabia isiyodhibitiwa.
    reason: alternative_reading
  - marker: c
    text: Ala ya muziki haitajwi katika mstari huu, ingawa inatambulishwa katika muktadha wa karibu.
    reason: cross_reference
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: siku iliyofuata
  rationale: Ni usemi wa wakati unaoonyesha siku baada ya matukio yaliyotangulia; Kiswahili hiki ni cha kawaida na hudumisha mfuatano wa simulizi.
- source_word: וַתִּצְלַח
  choice: ikamvamia
  rationale: Kitenzi hiki, roho ikiwa kiima, huonyesha ujio wa ghafla na wenye nguvu juu ya mtu. ‘Ikamvamia’ huwasilisha nguvu hiyo kwa Kiswahili cha asili.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: roho mbaya kutoka kwa Mungu
  rationale: Huhifadhi maana ya kawaida ya רָעָה na uhusiano wa roho hiyo na Mungu bila kudai kwamba ubaya ni sifa ya Mungu mwenyewe. Tanbihi inadumisha tafsiri mbadala ya ‘yenye kudhuru’ na muundo halisi ‘ya Mungu.’
- source_word: וַיִּתְנַבֵּא
  choice: akatabiri
  rationale: Hii ndiyo maana ya msingi ya kitenzi, nayo hudumisha utata wa maandishi kuhusu hali ya Sauli badala ya kuamua kimya kimya kwamba alikuwa akipayuka. Muktadha na uwezekano wa hali ya kinabii yenye msisimko vinaelezwa katika tanbihi.
- source_word: בְּתוֹךְ הַבַּיִת
  choice: ndani ya nyumba
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mahali panapotajwa.
- source_word: מְנַגֵּן בְּיָדוֹ
  choice: akipiga muziki kwa mkono wake
  rationale: Kitenzi huonyesha kupiga muziki, na Kiebrania hutaja wazi mkono wake. Ala haikutajwa katika mstari huu, kwa hiyo haijaongezwa katika matini kuu.
- source_word: כְּיוֹם בְּיוֹם
  choice: kama alivyofanya kila siku
  rationale: Nahau hii huonyesha tendo la kawaida linalorudiwa siku kwa siku; tafsiri hii ni ya asili katika Kiswahili bila kupoteza maana hiyo.
- source_word: הַחֲנִית
  choice: mkuki
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa silaha inayotajwa hapa.
- source_word: בְּיַד שָׁאוּל
  choice: mkononi mwa Sauli
  rationale: Ni Kiswahili cha kawaida kinachohifadhi mahali pa mkuki na uzito wa maelezo hayo katika simulizi.
theological_decisions:
- issue: Jinsi ya kutafsiri רוּחַ אֱלֹהִים רָעָה kuhusiana na utendaji wa Mungu na tabia yake
  choice: roho mbaya kutoka kwa Mungu
  alternative: roho yenye kudhuru kutoka kwa Mungu; roho mbaya ya Mungu
  rationale: Matini ya Kiebrania inahusianisha roho hiyo moja kwa moja na Mungu, hivyo uhusiano huo haupaswi kufichwa. ‘Kutoka kwa Mungu’ hudumisha mvutano wa kitheolojia huku ikiepuka dokezo lisilokusudiwa kwamba Mungu mwenyewe ana ubaya wa kimaadili.
- issue: Ikiwa וַיִּתְנַבֵּא iamuliwe kuwa unabii wa kweli au kupayuka kwa wazimu
  choice: akatabiri
  alternative: akawa katika msisimko wa kinabii; akapayuka
  rationale: Kitenzi chenyewe ni cha kinabii, lakini katika muktadha huu kinaweza kueleza tabia ya msisimko au isiyodhibitiwa. Matini kuu hudumisha neno la msingi, na tanbihi huonyesha uwezekano mwingine bila kuufanya kuwa hakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘Ikawa siku iliyofuata’ huhifadhi ladha ya simulizi la Kiebrania, huku ‘kama alivyofanya kila siku’ ukitoa nahau hiyo kwa Kiswahili cha asili.
