translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘machoni penu’ umehifadhiwa kwa sababu unaeleweka na pia unadumisha picha ya Kiebrania; ‘ilhali’ huhifadhi mvutano wa kauli ya Daudi bila kugeuza kiunganishi kuwa sababu ya moja kwa moja.
