base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/023.yaml
  text: So Saul’s servants spoke these words in David’s hearing[a], and David said, “Does it seem to you a small thing to become the king’s son-in-law, when I am a poor and lightly regarded man?”
translation:
  language: sw
  text: Watumishi wa Sauli wakasema maneno haya Daudi akiyasikia. Daudi akasema, “Je, machoni penu ni jambo dogo kuwa mkwe wa mfalme[a], ilhali mimi ni mtu maskini na wa hali ya chini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuingia katika uhusiano wa ndoa na mfalme.”
    reason: Neno la Kiebrania linaweza kueleza kuingia katika uhusiano wa kifamilia kwa njia ya ndoa; katika muktadha huu Daudi angekuwa mkwe wa mfalme kwa kumwoa binti yake.
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: wakasema
  rationale: Katika simulizi, kitenzi hiki kinaeleza tendo la kusema bila kudokeza ujumbe rasmi; ‘wakasema’ ni Kiswahili cha kawaida na cha asili.
- source_word: בְּאָזְנֵי דָוִד
  choice: Daudi akisikia
  rationale: Hii inawasilisha kwa Kiswahili cha kawaida nahau ya Kiebrania ‘masikioni mwa Daudi,’ yaani maneno yalisemwa huku Daudi akiyasikia.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: maneno hayo
  rationale: ‘Maneno hayo’ yanafaa katika muktadha unaorejelea yale ambayo watumishi walikuwa wameagizwa wamwambie Daudi.
- source_word: הַנְקַלָּה בְעֵינֵיכֶם
  choice: Je, machoni penu ni jambo dogo
  rationale: Tafsiri hii inadumisha swali la balagha na nahau ya tathmini ‘machoni penu,’ huku ikibaki wazi na ya kueleweka.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: kuwa mkwe wa mfalme
  rationale: Katika muktadha, Daudi angeingia katika ukoo wa kifalme kwa kumwoa binti wa mfalme. ‘Kuwa mkwe wa mfalme’ ni tafsiri fupi inayodumisha lugha ya uhusiano wa ndoa.
- source_word: וְאָנֹכִי
  choice: ilhali mimi ni
  rationale: ‘Ilhali’ linaonyesha tofauti kati ya hadhi ya kuwa mkwe wa mfalme na hali ya chini ya Daudi bila kuifanya waw kuwa sababu iliyoelezwa wazi zaidi kuliko chanzo.
- source_word: אִישׁ רָשׁ
  choice: mtu maskini
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kujieleza kwa Daudi kuhusu hali yake ya kiuchumi.
- source_word: וְנִקְלֶה
  choice: wa hali ya chini
  rationale: Usemi huu unaonyesha hadhi ndogo na kutothaminiwa kijamii bila kutumia ‘mdharauliwa,’ ambalo linaweza kuwa kali kuliko neno la Kiebrania hapa.
