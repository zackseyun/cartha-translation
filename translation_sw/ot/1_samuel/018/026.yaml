base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/026.yaml
  text: So his servants told David these words[a], and the matter seemed right in David’s eyes, to become the king’s son-in-law[c][b]; and the days had not yet been fulfilled.
translation:
  language: sw
  text: Watumishi wake wakamweleza Daudi maneno hayo, na jambo hilo likawa jema machoni pa Daudi[a], ili awe mkwe wa mfalme[b]; na siku zilizowekwa zilikuwa bado hazijatimia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo hilo likampendeza Daudi.” Kwa tafsiri halisi, nahau ya Kiebrania inasema, “jambo hilo likawa jema machoni pa Daudi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuingia katika ukoo wa mfalme kwa njia ya ndoa.” Usemi wa Kiebrania kwa maana pana unamaanisha kuingia katika uhusiano wa kindoa na mfalme.
    reason: lexical_alternative
  - marker: c
    text: Yaani, muda uliokuwa umewekwa ulikuwa bado haujaisha.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: wakamweleza
  rationale: Hifili ya נגד hapa ina maana ya kumjulisha au kumwambia mtu jambo. “Wakamweleza” ni Kiswahili cha kawaida kinachofaa kwa watumishi waliowasilisha ujumbe kwa Daudi.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika mazingira ya ikulu, neno hili linawarejelea watumishi au wahudumu wa Sauli. “Watumishi” ni sahihi bila kulazimisha maana ya watumwa.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: maneno hayo
  rationale: Ingawa דְּבָרִים linaweza kumaanisha maneno au mambo, hapa watumishi wanawasilisha kwa mdomo ujumbe wa Sauli, hivyo “maneno hayo” linafaa.
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינֵי דָוִד
  choice: jambo hilo likawa jema machoni pa Daudi
  rationale: Tafsiri hii inadumisha nahau ya Kiebrania “likawa jema machoni pa” huku ikibaki wazi na yenye kueleweka katika Kiswahili cha heshima.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: kuwa mkwe wa mfalme
  rationale: Katika muktadha huu, Daudi angeingia katika uhusiano wa ndoa na nyumba ya Sauli kwa kumwoa binti yake. “Kuwa mkwe wa mfalme” ni fupi na ya asili, huku tanbihi ikihifadhi maana pana ya usemi wa Kiebrania.
- source_word: וְלֹא מָלְאוּ הַיָּמִים
  choice: na siku zilizowekwa zilikuwa bado hazijatimia
  rationale: Usemi huu unamaanisha kwamba muda uliowekwa ulikuwa haujaisha. “Hazijatimia” inadumisha sitiari ya siku kufikia ukamilifu, na “zilizowekwa” huweka wazi maana ya kimuktadha.
