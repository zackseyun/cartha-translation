base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/019.yaml
  text: But when the time came to give Merab[a], Saul’s daughter, to David, she was given to Adriel the Meholathite as a wife.
translation:
  language: sw
  text: Lakini wakati wa Merabu, binti ya Sauli, kupewa Daudi ulipofika, alipewa Adrieli, mwenyeji wa Mehola, kuwa mke wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: Lakini wakati ulipofika
  rationale: Muundo huu unaendeleza simulizi kwa kuonyesha wakati na pia mgeuko usiotazamiwa; “Lakini wakati ulipofika” ni Kiswahili cha kawaida kinachobeba yote mawili.
- source_word: תֵּת אֶת מֵרַב בַּת שָׁאוּל לְדָוִד
  choice: wa kumpa Daudi Merabu, binti ya Sauli
  rationale: Kitenzi נתן kimetafsiriwa moja kwa moja kuwa “kumpa”; mpangilio huu ni wa asili katika Kiswahili na unabainisha kwamba Daudi ndiye aliyekusudiwa kupewa Merabu katika ndoa.
- source_word: וְהִיא נִתְּנָה
  choice: alipewa
  rationale: Kauli tendwa inadumishwa ili kuweka mkazo wa Kiebrania juu ya jambo lililompata Merabu na matokeo yasiyotazamiwa.
- source_word: לְעַדְרִיאֵל הַמְּחֹלָתִי
  choice: Adrieli, Mmeholathi
  rationale: Jina limetoholewa kwa tahajia inayofaa Kiswahili, na kivumishi cha asili הַמְּחֹלָתִי kimetolewa kama jina la mtu wa Mehola.
- source_word: לְאִשָּׁה
  choice: kuwa mke wake
  rationale: Hii ni nahau ya kawaida ya ndoa katika Kiebrania; “kuwa mke wake” ni wazi, ya asili, na inahifadhi maana bila kuongeza maelezo ya kimadhehebu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa sentensi unahifadhi tofauti kati ya kusudi la kumpa Merabu kwa Daudi na matokeo ya kupewa Adrieli.
