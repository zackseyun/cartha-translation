lexical_decisions:
- source_word: וְ/כָל
  choice: Lakini ... wote
  rationale: Kiunganishi kinaunganisha mstari huu kwa hali ya utofauti na hofu na uadui wa Sauli katika muktadha uliotangulia; “Lakini” huonyesha nguvu hiyo ya kimazungumzo, na “wote” huhifadhi maana jumuishi ya כָל.
- source_word: יִשְׂרָאֵל וִ/יהוּדָה
  choice: Israeli wote na Yuda
  rationale: Majina hayo mawili yanahifadhi utofauti wa kijamii na kisiasa kati ya Israeli na Yuda katika simulizi la Samueli bila kuufafanua kupita kiasi.
- source_word: אֹהֵב
  choice: walimpenda
  rationale: Kitenzi kishirikishi cha Kiebrania kinaonyesha hali iliyoendelea au ya kawaida; wakati uliopita katika Kiswahili unasomeka kwa kawaida katika simulizi.
- source_word: אֶת דָּוִד
  choice: Daudi
  rationale: Kiashiria cha yambwa אֶת hakitafsiriwi, na jina דָּוִד linatolewa kwa umbo la Kiswahili lililozoeleka, “Daudi.”
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי hutoa sababu ya watu kumpenda Daudi; “kwa sababu” huonyesha wazi uhusiano huo wa kisababishi.
- source_word: הוּא
  choice: alikuwa
  rationale: Kiwakilishi huru kinaonyesha Daudi kuwa ndiye mhusika wa vitenzi vinavyofuata; katika Kiswahili mhusika huyo anawakilishwa kiasili na kiambishi cha nafsi katika “alikuwa.”
- source_word: יוֹצֵא וָ/בָא
  choice: alikuwa akitoka na kuingia
  rationale: Tafsiri hii huhifadhi kwa uwazi jozi ya vitenzi vya Kiebrania na hali yake ya kuendelea, bila kuongeza yambwa “wao” ambalo halijatajwa wazi katika matini.
- source_word: לִ/פְנֵי/הֶם
  choice: mbele yao
  rationale: Hii ndiyo tafsiri ya moja kwa moja inayoweza pia kudokeza kuwa Daudi alikuwa akiwaongoza hadharani, bila kulazimisha maana hiyo katika matini kuu.
