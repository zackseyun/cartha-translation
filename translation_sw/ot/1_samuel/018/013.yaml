  text: So Saul removed him from his presence and appointed him commander of a thousand[a], and he went out and came in before the people.
translation:
  language: sw
  text: Basi Sauli akamwondoa kutoka mbele yake na kumteua kuwa mkuu wa askari elfu moja. Naye akatoka na kuingia mbele ya watu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “akatoka na kuingia,” usemi unaoweza kumaanisha kutekeleza shughuli za hadharani au za kijeshi, huenda ukiwa na maana ya kuwaongoza watu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסִרֵהוּ
  choice: akamwondoa
  rationale: Kitenzi katika kausativi humaanisha kumwondoa au kumweka mbali; ‘akamwondoa’ kinahifadhi tendo lenyewe bila kuongeza sababu ya Sauli.
- source_word: מֵעִמּוֹ
  choice: mbele yake
  rationale: Kihalisi ni ‘kutoka pamoja naye’; katika muktadha wa kifalme, ‘mbele yake’ ni Kiswahili cha kawaida kinachoonyesha kuondolewa katika uwepo au utumishi wa karibu wa Sauli.
- source_word: וַיְשִׂמֵהוּ לוֹ
  choice: kumteua kuwa
  rationale: Muundo huu unaonyesha kumpa mtu cheo au jukumu rasmi; ‘kumteua kuwa’ ni wazi na wa asili katika Kiswahili.
- source_word: שַׂר אָלֶף
  choice: mkuu wa askari elfu moja
  rationale: שַׂר ni mkuu au kamanda. Neno ‘askari’ limewekwa wazi kutokana na muktadha wa kijeshi, huku idadi ya elfu moja ikihifadhiwa.
- source_word: וַיֵּצֵא וַיָּבֹא
  choice: akatoka na kuingia
  rationale: Tafsiri hii inahifadhi taswira ya Kiebrania na kutofunga maana yake kwa shughuli za kijeshi pekee; usemi huo unaweza kumaanisha kutekeleza shughuli hadharani au kuongoza.
- source_word: לִפְנֵי הָעָם
  choice: mbele ya watu
  rationale: Hii inafuata maana ya msingi ya maneno hayo na kuhifadhi uwezekano wa kumaanisha mbele ya macho yao au akiwa akiwaongoza.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi usemi wa Kiebrania ‘akatoka na kuingia’ katika maandishi makuu, huku tanbihi ikieleza upana wa maana yake bila kuamua kwa lazima kuwa ni uongozi wa kijeshi pekee.
