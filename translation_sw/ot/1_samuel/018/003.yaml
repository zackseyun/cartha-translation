base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/003.yaml
  text: Then Jonathan made a covenant with David[b][a], because he loved him as his own soul.
translation:
  language: sw
  text: Ndipo Yonathani akafanya agano na Daudi[a], kwa sababu alimpenda kama nafsi yake mwenyewe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “akakata agano.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika upendo wake kwake.” Viwakilishi vya Kiebrania vina utata kimuundo, lakini muktadha unapendelea maana kwamba Yonathani alimpenda Daudi kama nafsi yake mwenyewe.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: akafanya
  rationale: Kirai cha Kiebrania כרת ברית kwa maana halisi ni ‘kukata agano,’ lakini ‘kufanya agano’ ndicho kirai cha kawaida na cha asili katika Kiswahili.
- source_word: יְהוֹנָתָן
  choice: Yonathani
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Biblia za Kiswahili.
- source_word: וְדָוִד
  choice: na Daudi
  rationale: Kiunganishi kinaunganisha Daudi na tendo la kufanya agano, huku kitenzi cha umoja kikimwonyesha Yonathani kuwa mhusika wa kisarufi.
- source_word: בְּרִית
  choice: agano
  rationale: ‘Agano’ linaonyesha mapatano rasmi na yenye kuwafunga wahusika, na linahifadhi uzito wa kimahusiano wa neno la Kiebrania.
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: kwa sababu alimpenda
  rationale: Katika muktadha huu בְּ linaeleweka vizuri kwa maana ya sababu; muktadha unampendelea Yonathani kuwa anayependa na Daudi kuwa anayependwa.
- source_word: כְּנַפְשׁוֹ
  choice: kama nafsi yake mwenyewe
  rationale: ‘Nafsi’ linahifadhi taswira ya Kiebrania נֶפֶשׁ na kina cha upendo, ingawa pia linaweza kumaanisha ‘mwenyewe’ au ‘uhai wake.’
theological_decisions:
- issue: Marejeo ya viwakilishi vya nafsi ya tatu katika ‘alimpenda kama nafsi yake mwenyewe’
  choice: Yonathani alimpenda Daudi kama nafsi yake mwenyewe
  alternative: Daudi alimpenda Yonathani kama nafsi yake mwenyewe; au kuacha marejeo hayo yakiwa na utata kamili
  rationale: Viwakilishi vya Kiebrania vinaweza kuwa na utata vikichukuliwa peke yake, lakini muktadha wa karibu, hasa 1 Samweli 18:1 na mhusika wa kitenzi katika 18:3, unampendelea Yonathani kuwa anayependa na Daudi kuwa anayependwa. Tanbihi inahifadhi utata wa kimuundo bila kuingiza dai jingine kuhusu aina ya uhusiano wao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Akafanya agano’ ni usemi wa kawaida kuliko tafsiri ya neno kwa neno ‘akakata agano’; ‘nafsi yake mwenyewe’ imehifadhiwa kwa ajili ya taswira na mwangwi wa Kiebrania.
