base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/015.yaml
  text: And Saul’s servants said to him[a], “Look now, an evil spirit from God is terrifying you.”
translation:
  language: sw
  text: Watumishi wa Sauli wakamwambia, “Tazama sasa, roho mbaya[a] kutoka kwa Mungu inakutia hofu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “roho yenye kudhuru au kusumbua kutoka kwa Mungu.” Neno hilo la Kiebrania linaweza kuieleza roho kuwa mbaya au kuwa yenye kusababisha madhara au usumbufu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: wakamwambia
  rationale: Umbo la wayyiqtol linaendeleza simulizi; “wakamwambia” ni mtiririko wa kawaida wa masimulizi ya Kiswahili na linaonyesha kitendo kinachofuata.
- source_word: עַבְדֵי שָׁאוּל
  choice: Watumishi wa Sauli
  rationale: Katika mazingira ya jumba la kifalme, “watumishi” ni neno la kawaida na lenye heshima, bila kulazimisha maana ya utumwa wa mali.
- source_word: אֵלָיו
  choice: -mwambia
  rationale: Kiambishi cha mtendewa katika “wakamwambia” kinawasilisha kwa kawaida maana ya “walisema kwake.”
- source_word: הִנֵּה נָא
  choice: Tazama
  rationale: Maneno haya yanavuta fikira na kuonyesha uzito wa hali. “Tazama” ni ya heshima na inaeleweka, ingawa נָא haitafsiriwi kwa neno tofauti kwa kuwa nguvu yake imebebwa na usemi mzima.
- source_word: רוּחַ אֱלֹהִים
  choice: roho ... kutoka kwa Mungu
  rationale: “Kutoka kwa Mungu” linaonyesha uhusiano wa chanzo au utume uliopo katika muktadha bila kuitambulisha roho hiyo kuwa Roho wa Mungu mwenyewe.
- source_word: רָעָה
  choice: mbaya
  rationale: Neno la Kiebrania linaweza kumaanisha uovu au hali yenye kudhuru/kusumbua. “Mbaya” huhifadhi upana huo kwa Kiswahili; maana mbadala inaelezwa katika tanbihi.
- source_word: מְבַעִתֶּךָ
  choice: inakutia hofu
  rationale: Kirai hiki kinaonyesha kitendo kinachoendelea cha kusababisha woga mkubwa. “Inakutia hofu” ni cha asili na wazi katika Kiswahili cha sasa.
theological_decisions:
- issue: Jinsi ya kutafsiri רוּחַ אֱלֹהִים רָעָה bila kuondoa uhusiano wake na Mungu wala kuingiza hitimisho la kimadhehebu
  choice: roho mbaya kutoka kwa Mungu
  alternative: roho yenye kudhuru/kusumbua kutoka kwa Mungu; roho mbaya ya Mungu
  rationale: Andiko linaonyesha kwamba roho hiyo inatoka kwa Mungu kwa namna fulani. “Kutoka kwa Mungu” huhifadhi dai hilo na mvutano wake wa kiteolojia, lakini huepuka kudokeza moja kwa moja kwamba ni Roho wa Mungu mwenyewe. Tanbihi huhifadhi uwezekano wa רָעָה kumaanisha yenye kudhuru au kusumbua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. “Tazama” limetumiwa kama neno la kibiblia linaloeleweka bila kutumia lugha ya kizamani kupita kiasi.
