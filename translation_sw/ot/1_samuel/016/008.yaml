base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/008.yaml
  text: Then Jesse called Abinadab and made him pass before Samuel. And he said[a], “Yahweh has not chosen this one either.”
translation:
  language: sw
  text: Kisha Yese akamwita Abinadabu na kumfanya apite mbele ya Samueli. Akasema[a], “Yahwe hajamchagua huyu pia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hakimtaji msemaji kwa jina; kutokana na muktadha, msemaji ni Samueli.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: Kitenzi קרא hapa kina maana ya kumwita mtu. Umbo hili linaendeleza mtiririko wa simulizi kwa Kiswahili cha kawaida.
- source_word: אֶל אֲבִינָדָב
  choice: Abinadabu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili; kihusishi אֶל kimewasilishwa kiasili ndani ya muundo ‘akamwita Abinadabu.’
- source_word: וַיַּעֲבִרֵהוּ לִפְנֵי שְׁמוּאֵל
  choice: na kumfanya apite mbele ya Samueli
  rationale: 'Hifili ya עבר pamoja na kiambishi cha yambwa inaonyesha usababishaji: Yese alimfanya Abinadabu apite mbele ya Samueli. Tafsiri hii inadumisha maana hiyo bila kuibadili kuwa tu ‘alimleta.’'
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Kiebrania hakimtaji msemaji kwa jina. ‘Akasema’ inadumisha mtindo mfupi wa simulizi na kutolazimisha ufafanuzi ndani ya matini.
- source_word: גַּם בָּזֶה
  choice: huyu pia
  rationale: גַּם ina nguvu ya kuongezea; baada ya kauli hasi, ‘huyu pia’ ni Kiswahili cha kawaida kinachowasilisha maana ya ‘also this one/this one either.’
- source_word: לֹא בָחַר
  choice: hajamchagua
  rationale: Wakati timilifu wa Kiswahili unaonyesha uamuzi uliokwisha kufanywa ambao matokeo yake yanaendelea kuwa halali katika tukio hili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania inatumia jina maalumu la Mungu, hivyo ‘Yahwe’ linahifadhi hadhi yake kama jina badala ya kulibadilisha kuwa cheo.
- issue: Utambulisho wa msemaji wa וַיֹּאמֶר
  choice: Msemaji hakuainishwa ndani ya matini kuu
  alternative: Samueli akasema
  rationale: Muktadha unaelekeza kwa Samueli, lakini kitenzi cha Kiebrania hakimtaji kwa jina. Tafsiri inalinda hali hiyo huku tanbihi ikitoa ufafanuzi wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na wenye heshima. Majina yametoholewa kama Yese, Abinadabu, Samueli, na Yahwe.
