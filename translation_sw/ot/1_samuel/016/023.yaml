base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/023.yaml
  text: And whenever the spirit of God came upon Saul[a], David would take the lyre and play it with his hand; then Saul found relief, and it was well with him[c][b], and the harmful spirit departed from him.
translation:
  language: sw
  text: Wakati wowote roho ya Mungu[c] ilipomjia Sauli, Daudi alichukua kinubi[a] na kukipiga kwa mkono wake. Ndipo Sauli akapata nafuu, hali yake ikawa njema, nayo roho yenye kudhuru[b] ikamwondoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “harpa.” Neno la Kiebrania kinnor linataja ala ya kale yenye nyuzi, ambayo huenda ilifanana zaidi na lyre kuliko harpa ya kisasa.
    reason: lexical_alternative
  - marker: b
    text: Au, “roho mbaya.” Neno la Kiebrania linaweza kumaanisha “mbaya” au “yenye kudhuru”; hapa huenda mkazo uko kwenye jinsi roho hiyo ilivyomsumbua Sauli.
    reason: lexical_alternative
  - marker: c
    text: Kishazi cha kwanza kinasema “roho ya Mungu,” lakini kishazi cha mwisho kinasema “roho yenye kudhuru.” Tafsiri inadumisha tofauti hiyo ya maneno katika Kiebrania badala ya kuipatanisha.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בִּהְיוֹת
  choice: Kila ... ilipomjia
  rationale: Muundo huu unaonyesha jambo lililokuwa likitokea mara kwa mara; “kila ... ilipo-” huwasilisha hali hiyo kwa Kiswahili cha kawaida.
- source_word: רוּחַ אֱלֹהִים
  choice: roho ya Mungu
  rationale: Hii inafuata maneno ya Kiebrania moja kwa moja bila kuingiza kivumishi “mbaya” au “yenye kudhuru” kutoka sehemu ya mwisho ya mstari.
- source_word: אֶל שָׁאוּל
  choice: ilipomjia Sauli
  rationale: “Kumjia” ni usemi wa asili wa Kiswahili unaoonyesha kuanza kwa athari ya roho juu ya Sauli.
- source_word: הַכִּנּוֹר
  choice: kinubi
  rationale: Kinubi ni neno linaloeleweka kwa ala ya nyuzi; tanbihi inaeleza kwamba ala ya kale huenda ilikuwa karibu zaidi na lyre kuliko harp ya kisasa.
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: na kukipiga kwa mkono wake
  rationale: Kitenzi kinamaanisha kupiga ala ya nyuzi, na kiwakilishi “-ki-” kinarejelea kinubi kilichotajwa.
- source_word: וְרָוַח לְשָׁאוּל
  choice: Sauli alipata nafuu
  rationale: Huwasilisha wazi wazo la kupata afueni au utulivu baada ya kusumbuliwa.
- source_word: וְטוֹב לוֹ
  choice: na akawa vizuri
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kuwa hali yake iliboreka bila kufafanua zaidi aina ya ustawi uliokusudiwa.
- source_word: רוּחַ הָרָעָה
  choice: roho yenye kudhuru
  rationale: רָעָה inaweza kumaanisha uovu au madhara; katika muktadha huu tafsiri inaonyesha athari yake ya kumsumbua Sauli bila kuamua kwa lazima tabia yake ya kimaadili.
- source_word: וְסָרָה מֵעָלָיו
  choice: ikamwondoka
  rationale: Hii ni njia fupi na ya kawaida ya kueleza kwamba roho hiyo iliondoka kutoka juu yake au ilimwacha.
theological_decisions:
- issue: Uhusiano kati ya רוּחַ אֱלֹהִים katika kishazi cha kwanza na רוּחַ הָרָעָה katika kishazi cha mwisho
  choice: Kutafsiri la kwanza “roho ya Mungu” na la mwisho “roho yenye kudhuru,” bila kuyapatanisha kimaneno.
  alternative: Kutafsiri la kwanza “roho yenye kudhuru kutoka kwa Mungu,” au la mwisho “roho mbaya.”
  rationale: Maandishi ya Kiebrania yenyewe yanatumia misemo tofauti. Kuhifadhi tofauti hiyo kunadumisha mvutano na utata wa maandishi bila kuingiza ufafanuzi wa kiteolojia ndani ya tafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya simulizi la Biblia. “Kila ... ilipo-” linaonyesha kurudiwa kwa tukio; “alipata nafuu na akawa vizuri” ni la kawaida na linaeleweka kwa wasomaji wa kisasa.
