base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/014.yaml
  text: The Spirit of Yahweh had departed from Saul[a], and an evil spirit from Yahweh terrified him.
translation:
  language: sw
  text: Roho wa Yahwe alikuwa ameondoka kwa Sauli, nayo roho mbaya[a] kutoka kwa Yahwe ikamtia hofu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho yenye kudhuru” au “roho yenye kuleta taabu.” Kivumishi cha Kiebrania kinaweza kumaanisha kitu kiovu, chenye kudhuru, au chenye kuleta maafa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: Roho wa Yahwe
  rationale: רוּחַ hapa inarejelea kuwapo kwa Mungu kulikokuwa kumemwezesha Sauli, hivyo “Roho” linafaa kuliko “upepo” au “pumzi.” Jina יהוה limetolewa kama “Yahwe.”
- source_word: סָרָה מֵעִם
  choice: akamwondoka
  rationale: Kitenzi סוּר pamoja na מֵעִם kinaonyesha kuondoka au kutokuwa tena pamoja na mtu. “Akamwondoka” ni kifupi, cha kawaida katika simulizi, na kinahifadhi wazo la kujiondoa bila kuongeza kwamba Roho alitumwa mbali.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: וּבִעֲתַתּוּ
  choice: ikamtia hofu
  rationale: Kitenzi בעת huonyesha kutisha au kusababisha hofu kali. “Ikamtia hofu” kinaeleza athari hiyo kwa Kiswahili cha kawaida bila kupanua maana kuwa mateso kwa ujumla.
- source_word: רוּחַ רָעָה
  choice: roho mbaya
  rationale: רָעָה linaweza kumaanisha uovu, ubaya wenye kudhuru, au taabu. “Roho mbaya” ndilo tafsiri ya moja kwa moja, huku maana nyingine zikihifadhiwa katika tanbihi.
- source_word: מֵאֵת יְהוָה
  choice: kutoka kwa Yahwe
  rationale: מֵאֵת huonyesha chanzo. “Kutoka kwa Yahwe” kinadumisha kauli ya Kiebrania bila kuongeza wazo linalofasiri zaidi kwamba roho hiyo ‘ilitumwa’ na Yahwe.
theological_decisions:
- issue: Jinsi ya kutafsiri kwamba roho mbaya ilitoka kwa Yahwe bila kupunguza au kufafanua kupita kiasi mvutano wa kiteolojia
  choice: roho mbaya kutoka kwa Yahwe
  alternative: roho yenye kudhuru/kusumbua kutoka kwa Yahwe; roho mbaya iliyotumwa na Yahwe
  rationale: Kiebrania kinataja wazi Yahwe kuwa chanzo cha roho hiyo. Tafsiri inadumisha mvutano huo badala ya kuuficha. Kwa kuwa רָעָה pia linaweza kueleza madhara au taabu, uwezekano huo umewekwa katika tanbihi; “iliyotumwa” haikutumiwa kwa sababu inaongeza ufafanuzi usiotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa kawaida na wenye heshima. Kiunganishi “nayo” kinaonyesha uendelezaji na utofautishaji wa roho hizo mbili bila kuongeza kiashirio cha wakati ambacho hakipo wazi katika chanzo.
