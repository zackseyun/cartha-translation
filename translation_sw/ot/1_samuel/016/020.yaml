base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/020.yaml
  text: So Jesse took a donkey[a], bread, a skin of wine, and one young goat[b], and sent them by the hand of David his son to Saul.
translation:
  language: sw
  text: Basi Yese akachukua punda aliyebeba mikate[a], kiriba cha divai, na mwana-mbuzi mmoja, akavipeleka kwa Sauli kwa mkono wa Daudi mwanawe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “punda, mkate”; yaani, punda aliyebeba au aliyepakiwa mikate.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “kwa mkono wa Daudi mwanawe”; hii ni nahau ya Kiebrania inayomaanisha kwamba Daudi ndiye aliyekuwa mpeleka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Basi Yese akachukua
  rationale: Kitenzi cha masimulizi kinaendeleza tukio; “Basi” na “akachukua” hutoa mtiririko wa kawaida wa masimulizi ya Kiswahili.
- source_word: חֲמוֹר לֶחֶם
  choice: punda aliyebeba mikate
  rationale: Kiebrania kinaweka “punda” na “mkate” pamoja bila kutaja wazi uhusiano wao. Muktadha unaelekea kumaanisha punda aliyebeba mikate; tafsiri hii ni ya asili kwa Kiswahili huku tanbihi ikihifadhi muundo halisi na uwezekano wake.
- source_word: נֹאד יַיִן
  choice: kiriba cha divai
  rationale: נֹאד ni chombo cha ngozi cha kuhifadhia kimiminika; “kiriba cha divai” ni sahihi na kinaeleweka kuliko “chupa,” ambayo ingebadili aina ya chombo.
- source_word: גְּדִי עִזִּים אֶחָד
  choice: mwana-mbuzi mmoja
  rationale: Kirai hiki kinamaanisha mbuzi mmoja mchanga; “mwana-mbuzi mmoja” huhifadhi umri na idadi.
- source_word: וַיִּשְׁלַח
  choice: akavipeleka
  rationale: Yaliyotumwa yanaeleweka kutokana na orodha iliyotangulia. “Akavipeleka” huwasilisha tendo hilo kwa Kiswahili cha kawaida bila kuongeza kitu kipya katika simulizi.
- source_word: בְּיַד
  choice: kupitia
  rationale: Kwa maana halisi ni “kwa mkono wa,” lakini hapa ni nahau ya wakala au mpeleka. “Kupitia” hutoa maana hiyo wazi; tanbihi inahifadhi usemi halisi.
- source_word: דָּוִד בְּנוֹ
  choice: Daudi mwanawe
  rationale: Mpangilio huu unafuata Kiebrania na bado ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: אֶל שָׁאוּל
  choice: kwa Sauli
  rationale: Huwasilisha kwa kawaida mwelekeo na mpokeaji wa vitu vilivyopelekwa.
