- from: Bwana wetu na awaagize watumishi wako walio mbele yako wamtafute mtu anayejua kupiga kinubi. Na roho yenye kudhuru kutoka kwa Mungu inapokujia[a], mtu huyo atapiga kinubi kwa mkono wake, nawe utapata nafuu.
  to: Bwana wetu, tafadhali, awaambie watumishi wako walio mbele yako wamtafute mtu anayejua kupiga kinubi. Na roho yenye kudhuru kutoka kwa Mungu inapokuwa juu yako[a], mtu huyo atapiga kinubi kwa mkono wake, nayo itakuwa vema kwako.
