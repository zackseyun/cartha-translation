base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/016.yaml
  text: Please let our lord say to your servants before you that they should seek out a man who knows how to play the lyre; and when a harmful spirit from God is upon you[a], he will play with his hand, and it will be well for you.
translation:
  language: sw
  text: Bwana wetu, tafadhali, awaambie watumishi wako walio mbele yako wamtafute mtu anayejua kupiga kinubi. Na roho yenye kudhuru kutoka kwa Mungu inapokuwa juu yako[a], mtu huyo atapiga kinubi kwa mkono wake, nayo itakuwa vema kwako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho mbaya kutoka kwa Mungu”; Kiebrania kinaweza kumaanisha “roho mbaya/yenye kudhuru ya/kutoka kwa Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: יֹאמַר נָא אֲדֹנֵינוּ
  choice: Bwana wetu na awaagize
  rationale: Kauli ya ombi la heshima yenye נָא inaelekezwa kwa Sauli ili atoe agizo; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha unyenyekevu wa watumishi.
- source_word: עֲבָדֶיךָ לְפָנֶיךָ
  choice: watumishi wako walio mbele yako
  rationale: Inahifadhi taswira ya wahudumu wa mfalme walioko mbele yake katika mazingira ya ikulu.
- source_word: יְבַקְשׁוּ אִישׁ
  choice: wamtafute mtu
  rationale: Inaonyesha pendekezo la kufanya utafutaji wa mtu anayefaa.
- source_word: יֹדֵעַ מְנַגֵּן
  choice: anayejua kupiga
  rationale: Muundo huu unaonyesha uwezo au ustadi wa kupiga ala.
- source_word: כִּנּוֹר
  choice: kinubi
  rationale: Kinubi ni jina linaloeleweka la ala ya kale ya nyuzi; ni karibu zaidi na kinor kuliko kinanda au ala nyingine za kisasa.
- source_word: וְהָיָה בִּהְיוֹת עָלֶיךָ
  choice: inapokujia
  rationale: Inatoa kwa lugha ya asili wazo la tukio la roho kumjia au kuwa juu ya Sauli.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: roho yenye kudhuru kutoka kwa Mungu
  rationale: ‘Yenye kudhuru’ huonyesha athari mbaya ya רָעָה bila kulazimisha maana ya uovu wa kimaadili, huku ‘kutoka kwa Mungu’ ikidumisha wazi chanzo kinachotajwa na Kiebrania.
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: atapiga kinubi kwa mkono wake
  rationale: Inadumisha usemi halisi wa Kiebrania kuhusu kupiga ala kwa mkono na kuweka ala wazi kwa Kiswahili.
- source_word: וְטוֹב לָךְ
  choice: nawe utapata nafuu
  rationale: Katika muktadha huu usemi unaonyesha hali ya Sauli kuboreka baada ya muziki, na ‘utapata nafuu’ ni Kiswahili cha kawaida kisichobana maana kuwa hisia pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri רוּחַ אֱלֹהִים רָעָה bila kufuta uhusiano wake na Mungu wala kuamua kwa lazima aina ya ubaya unaokusudiwa
  choice: roho yenye kudhuru kutoka kwa Mungu
  alternative: roho mbaya ya/kutoka kwa Mungu
  rationale: Kiebrania kinaweza kueleweka kuwa roho ‘mbaya’ au ‘yenye kudhuru,’ na uhusiano wa אֱלֹהִים unaweza kuonyeshwa kwa ‘ya’ au ‘kutoka kwa.’ Maandishi makuu yanatumia ‘yenye kudhuru kutoka kwa Mungu’ ili kuhifadhi athari mbaya na madai ya chanzo, huku tanbihi ikihifadhi utata wa kileksika na kisintaksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Bwana’ hapa ni cheo cha heshima kwa Sauli, si jina la Mungu.
