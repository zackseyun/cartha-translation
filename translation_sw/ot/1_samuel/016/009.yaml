translation:
  language: sw
  text: Kisha Yese akamfanya Shama apite, naye akasema, “Yahwe hakumchagua huyu pia.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: akamleta ... apite mbele yake
  rationale: Hifili ya עבר ina maana ya kusababisha mtu apite. Kauli hii inahifadhi maana hiyo na ni ya kawaida katika Kiswahili; ‘mbele yake’ inaonyesha mazingira ya kumleta mwana mbele ya Samweli bila kutafsiri kitenzi kuwa ‘alimwasilisha’ tu.
- source_word: יִשַׁי
  choice: Yese
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: שַׁמָּה
  choice: Shama
  rationale: Unukuzi wa kawaida na unaosomeka wa jina la Kiebrania katika Kiswahili.
- source_word: וַיֹּאמֶר
  choice: naye akasema
  rationale: Kiebrania kinasema tu ‘naye akasema.’ Kiwakilishi kinahifadhi kutotajwa wazi kwa msemaji katika mstari huu; muktadha unaonyesha kuwa ni Samweli.
- source_word: גַּם
  choice: pia
  rationale: Katika kauli hasi, ‘pia’ huonyesha kwamba Shama anaongezwa kwa waliotangulia ambao hawakuchaguliwa.
- source_word: בָּזֶה
  choice: huyu
  rationale: Kionyeshi kinamhusu mwana anayechunguzwa wakati huo; ‘huyu’ ni usemi wa asili wa Kiswahili kwa mtu aliye karibu.
- source_word: לֹא בָחַר
  choice: hakumchagua
  rationale: בחר humaanisha kuchagua au kuteua. Wakati uliopita wa Kiswahili unafaa katika simulizi na hukataa kwamba Yahwe alimchagua Shama.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu linahifadhiwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana Tetragramatoni yenyewe. ‘Yahwe’ huhifadhi jina hilo binafsi kwa umbo linalosomeka kwa kawaida katika Kiswahili bila kulibadilisha kuwa cheo.
- issue: Utambulisho wa msemaji wa וַיֹּאמֶר
  choice: naye akasema
  alternative: Samweli akasema
  rationale: Ingawa muktadha unaonyesha kuwa msemaji ni Samweli, mstari wenyewe hautaji jina lake. Kiwakilishi huhifadhi muundo wa chanzo bila kuingiza ufafanuzi ndani ya maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Sentensi inahifadhi usababishi wa kitenzi cha Kiebrania na kiwakilishi kisichomtaja msemaji wazi. Hakuna tanbihi zinazohitajika.
