  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֵ֣יךְ אֵלֵ֔ךְ וְ/שָׁמַ֥ע שָׁא֖וּל וַ/הֲרָגָ֑/נִי וַ/יֹּ֣אמֶר יְהוָ֗ה עֶגְלַ֤ת בָּקָר֙ תִּקַּ֣ח בְּ/יָדֶ֔/ךָ וְ/אָ֣מַרְתָּ֔ לִ/זְבֹּ֥חַ לַֽ/יהוָ֖ה בָּֽאתִיס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/002.yaml
  text: Samuel said[a], “How can I go? If Saul hears, he will kill me.” And Yahweh said, “Take a heifer with you and say, ‘I have come to sacrifice to Yahweh.’”
translation:
  language: sw
  text: Samweli akasema, “Nitawezaje kwenda? Sauli akisikia, ataniua.” Yahwe akasema, “Chukua ndama jike[a] pamoja nawe, useme, ‘Nimekuja kumtolea Yahwe dhabihu.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ng’ombe jike mchanga.”
    reason: Njia nyingine ya kutafsiri עֶגְלַת בָּקָר kwa maneno yanayoeleza maana yake wazi zaidi.
lexical_decisions:
- source_word: אֵיךְ אֵלֵךְ
  choice: Nitawezaje kwenda?
  rationale: Swali hili linahusu uwezekano wa Samweli kwenda akiwa katika hatari, si njia au mwelekeo wa safari tu. Tafsiri hii ni ya kawaida na inaweka wazi hofu yake bila kuongeza maana.
- source_word: וְשָׁמַע שָׁאוּל
  choice: Sauli akisikia
  rationale: Ingawa muundo wa Kiebrania una kiunganishi na kitenzi timilifu, katika muktadha huu unaonyesha sharti linalotarajiwa. Muundo wa ‘akisikia’ ni wa asili katika Kiswahili na huhifadhi hali hiyo ya sharti.
- source_word: וַהֲרָגַנִי
  choice: ataniua
  rationale: Kitenzi kinaonyesha tokeo ambalo Samweli anatarajia ikiwa Sauli atasikia; wakati ujao unaeleza tishio hilo la moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa na cheo kama ‘BWANA.’
- source_word: עֶגְלַת בָּקָר
  choice: ndama jike
  rationale: Kirai hiki kinamaanisha ng’ombe jike mchanga. ‘Ndama jike’ ni sahihi, wazi, na rahisi kueleweka katika Kiswahili cha sasa.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: Chukua ... pamoja nawe
  rationale: Maneno halisi ‘chukua mkononi mwako’ ni nahau ya Kiebrania yenye maana ya kwenda na kitu hicho. ‘Pamoja nawe’ hutoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: kumtolea Yahwe dhabihu
  rationale: Tafsiri hii inaonyesha tendo la ibada la kutoa dhabihu na mhusika anayepokea dhabihu bila kufafanua zaidi aina ya taratibu.
- source_word: בָּאתִי
  choice: Nimekuja
  rationale: Kauli timilifu inaonyesha kwamba msemaji amefika na sasa anatangaza kusudi lake; ‘Nimekuja’ ni usemi wa kawaida wa Kiswahili katika hali hiyo.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la herufi nne la Mungu. ‘Yahwe’ huhifadhi jina hilo binafsi kwa tahajia inayotumika kwa kawaida katika Kiswahili, badala ya kulibadilisha kuwa cheo.
- issue: Ukweli wa kauli kuhusu kusudi la safari
  choice: Kauli ya kutoa dhabihu imetafsiriwa kama ilivyo bila kuitaja kuwa udanganyifu au maelezo kamili ya kusudi
  alternative: Kuifafanua kauli kuwa hila au kuwa sababu pekee ya safari
  rationale: Mstari unasema Mungu alimwagiza Samweli atangaze kusudi halisi la kutoa dhabihu, lakini haufafanui hapa uhusiano wake na kusudi jingine la kumpaka mafuta mfalme. Tafsiri inaacha mvutano huo bila kuutatua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Nitawezaje kwenda?’ huwasilisha wasiwasi wa kiutendaji wa Samweli; ‘ndama jike’ ni sahihi lakini bado ya kawaida, huku tanbihi ikitoa maelezo mbadala.
