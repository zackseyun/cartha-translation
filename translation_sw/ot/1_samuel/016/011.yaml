base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/011.yaml
  text: Then Samuel said to Jesse[a], “Are these all the young men?” And he said, “The youngest still remains, and behold, he is shepherding the flock.” Then Samuel said to Jesse, “Send and bring him[b], for we will not sit down until he comes here.”
translation:
  language: sw
  text: Kisha Samueli akamwambia Yese, “Je, hawa ndio vijana wote?” Akasema, “Bado amebaki mdogo wao; na tazama, analichunga kundi la kondoo[a].” Kisha Samueli akamwambia Yese, “Tuma wakamlete, kwa maana hatutaketi[b] mpaka atakapofika hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anawachunga kondoo.” Kwa Kiebrania, ni “analichunga kundi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hatutachukua nafasi zetu.” Huenda maana yake ni kwamba hawangeanza chakula au mkusanyiko rasmi mpaka afike.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַמּוּ הַנְּעָרִים
  choice: Je, hawa ndio vijana wote?
  rationale: Kitenzi תמם kina wazo la kukamilika au kuwa wote. Katika muktadha huu Samueli anauliza ikiwa hawa ndio vijana wote waliopaswa kuletwa; tafsiri hii ni ya kawaida na haileti maana isiyokusudiwa ya kwamba wameondoka au wamekufa.
- source_word: עוֹד שָׁאַר הַקָּטָן
  choice: Bado amebaki mdogo wao
  rationale: עוֹד שָׁאַר husisitiza kwamba mmoja bado hajaletwa, na הַקָּטָן katika muktadha wa familia humaanisha mdogo wao kwa umri.
- source_word: וְהִנֵּה
  choice: na tazama
  rationale: Neno hili huvuta fikira kwenye habari inayofuata. “Na tazama” linahifadhi nguvu hiyo ya usemi na linafaa kwa usimulizi wenye hadhi.
- source_word: רֹעֶה בַּצֹּאן
  choice: analichunga kundi la kondoo
  rationale: Kauli ya wakati unaoendelea inaonyesha kazi aliyokuwa akiifanya wakati huo. “Kundi la kondoo” linaonyesha maana ya pamoja ya צֹאן, huku tanbihi ikitoa namna nyingine ya kawaida ya kusema.
- source_word: שִׁלְחָה וְקָחֶנּוּ
  choice: Tuma mtu akamlete
  rationale: Amri hii inataka mtu atumwe ili kijana huyo aletwe. Kiswahili hiki ni cha kawaida na kinahifadhi hatua zote mbili bila ukakasi wa tafsiri ya neno kwa neno.
- source_word: לֹא נָסֹב
  choice: hatutaketi
  rationale: Katika muktadha huu usemi huo unaelekea kumaanisha kutoketi au kutochukua nafasi zao ili kuanza chakula au mkusanyiko rasmi. Tanbihi inadumisha upana wa maana ya nahau.
- source_word: עַד בֹּאוֹ פֹה
  choice: mpaka atakapofika hapa
  rationale: Hii ni tafsiri ya kawaida ya kishazi cha wakati, yenye kuonyesha kwamba hawataendelea kabla kijana huyo hajafika mahali walipo.
