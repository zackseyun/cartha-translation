translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Majina “Samueli” na “Yese” yanafuata matumizi yaliyozoeleka katika Biblia za Kiswahili. Muundo wa mazungumzo na marudio ya “Kisha Samueli akamwambia Yese” umehifadhiwa ili kufuata mwendo wa simulizi la Kiebrania.
