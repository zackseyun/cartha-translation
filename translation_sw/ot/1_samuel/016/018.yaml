base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/018.yaml
  text: Then one of the young men answered and said[a], “Look, I have seen a son of Jesse the Bethlehemite who is skillful in playing, a mighty man of valor, a man of war, prudent in speech, and a handsome man[d][c][b], and Yahweh is with him.”
translation:
  language: sw
  text: Ndipo mmoja wa wale vijana akajibu, akasema, “Tazama, nimemwona mwana wa Yese, mtu wa Bethlehemu[a], ambaye anajua kupiga muziki[b], ni shujaa hodari[c], mtu wa vita, mwenye busara katika kusema, na mtu mwenye sura nzuri; naye Yahwe yu pamoja naye.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mtu wa Bethlehemu,” yaani mtu anayetoka Bethlehemu.'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hakitaji ala fulani katika mstari huu; muktadha unahusu kumpigia Sauli muziki.
    reason: lexical_alternative
  - marker: c
    text: Kirai hiki kinaweza pia kutafsiriwa “mtu mwenye uwezo na ujasiri” au “mpiganaji shujaa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: akajibu, akasema
  rationale: Huhifadhi mtindo wa simulizi wa Kiebrania na maana ya kujibu kwa kusema.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: mmoja wa wale vijana
  rationale: Neno linaweza kumaanisha vijana au watumishi; tafsiri hii inabaki karibu na umbo la msingi bila kuamua cheo chao katika ikulu.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni neno la kawaida lenye heshima la kuvuta usikivu wa msikilizaji.
- source_word: רָאִיתִי
  choice: nimemwona
  rationale: Hali timilifu inaonyesha jambo lililotokea ambalo ni msingi wa pendekezo la sasa.
- source_word: בֵּן לְיִשַׁי בֵּית הַלַּחְמִי
  choice: mwana wa Yese, Mbethlehemu
  rationale: Huhifadhi usemi wa kifamilia na kivumishi cha mahali kinachomhusu mtu wa Bethlehemu.
- source_word: יֹדֵעַ נַגֵּן
  choice: anajua kupiga ala za muziki
  rationale: Kitenzi kinamaanisha kupiga muziki kwa ala; ala yenyewe haitajwi katika mstari huu, hivyo haijaainishwa.
- source_word: גִּבּוֹר חַיִל
  choice: shujaa hodari
  rationale: Huwasilisha sifa ya ujasiri na uwezo, huku muktadha wa kijeshi ukifuata wazi katika kirai kinachofuata.
- source_word: אִישׁ מִלְחָמָה
  choice: mtu wa vita
  rationale: Tafsiri ya karibu inayohifadhi muundo na maana ya kijeshi ya Kiebrania.
- source_word: נְבוֹן דָּבָר
  choice: mwenye busara katika kusema
  rationale: Huhifadhi wazo la ufahamu unaodhihirika katika maneno au mazungumzo bila kulifanya kuwa ufasaha pekee.
- source_word: אִישׁ תֹּאַר
  choice: mtu mwenye sura nzuri
  rationale: Neno תֹּאַר linahusu umbo au mwonekano; usemi huu ni wa kawaida na wenye heshima katika Kiswahili.
- source_word: וַיהוָה עִמּוֹ
  choice: naye Yahwe yu pamoja naye
  rationale: Huhifadhi jina la agano lililoandikwa katika matini na kueleza uwepo au kibali cha Mungu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ina jina maalumu la Mungu, YHWH; “Yahwe” hulitofautisha na cheo “Bwana” na kulihifadhi kama jina.
- issue: Maana ya kauli kwamba Yahwe yu pamoja na Daudi
  choice: yu pamoja naye
  alternative: anampendelea
  rationale: Tafsiri ya moja kwa moja huhifadhi upana wa kauli, ambao unaweza kujumuisha uwepo, msaada, au kibali cha Mungu bila kuchagua maana moja tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa orodha ya sifa umefanywa uwe wa kawaida kwa Kiswahili huku ukihifadhi mfuatano wa Kiebrania. “Yu” limetumiwa kwa mtindo mfupi wenye hadhi katika kauli “Yahwe yu pamoja naye.”
