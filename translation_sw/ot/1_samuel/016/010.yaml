  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּעֲבֵ֥ר יִשַׁ֛י שִׁבְעַ֥ת בָּנָ֖י/ו לִ/פְנֵ֣י שְׁמוּאֵ֑ל וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל יִשַׁ֔י לֹא בָחַ֥ר יְהוָ֖ה בָּ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/010.yaml
  text: So Jesse had seven of his sons pass before Samuel, and Samuel said to Jesse, “Yahweh has not chosen any of these.”
translation:
  language: sw
  text: Basi Yese akawapitisha wanawe saba mbele ya Samueli. Samueli akamwambia Yese, “Yahwe hajamchagua yeyote kati ya hawa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: akawapitisha
  rationale: Hifili ya עבר ina maana ya kusababisha wapite; ‘akawapitisha’ huhifadhi maana hiyo ya kisababishi kwa Kiswahili cha kawaida.
- source_word: שִׁבְעַת בָּנָיו
  choice: wanawe saba
  rationale: Kirai hiki humaanisha wana saba walio wake. Katika muktadha, Kiswahili hiki ni cha asili na hakilazimishi kueleweka kwamba hao ndio wanawe wote.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Hii ni tafsiri ya kawaida ya uhusiano wa mahali na inaonyesha kuwa wana hao waliwasilishwa mbele ya Samueli.
- source_word: לֹא בָחַר
  choice: hajamchagua
  rationale: Kitenzi בחר ni ‘chagua.’ Wakati timilifu wa Kiswahili unaonyesha hitimisho la Samueli kuhusu wana waliokwisha pita mbele yake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo; ‘Yahwe’ ni umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: בָּאֵלֶּה
  choice: yeyote kati ya hawa
  rationale: Muundo huu unaonyesha kuwa hakuna mmoja miongoni mwa waliowasilishwa aliyechaguliwa; tafsiri hii ni wazi na ya asili kwa Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Aya inatumia jina la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimewekwa kwa mtiririko wa kawaida wa simulizi huku maana ya kisababishi na upekee wa kila mwana zikihifadhiwa.
