  yaml_path: translation/ot/1_samuel/016/003.yaml
  text: Invite Jesse to the sacrifice[a], and I will make known to you what you shall do[c][b]; and you shall anoint for me the one whom I tell you.
translation:
  language: sw
  text: Mwalike Yese kwenye dhabihu[a], nami nitakujulisha utakachofanya[b]; nawe utampaka mafuta yule nitakayekuambia kwa ajili yangu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwite Yese aje kwenye dhabihu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nitakuonyesha unachopaswa kufanya.”
    reason: lexical_alternative
  - marker: c
    text: Au, “utampaka mafuta kwa ajili yangu yeyote nitakayekuambia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרָאתָ
  choice: Mwalike
  rationale: Katika muktadha wa tukio la dhabihu, קרא ina maana ya kumwita mtu ili ahudhurie. “Mwalike” ni Kiswahili cha kawaida kinachoonyesha mwito wa kushiriki bila kupunguza nguvu ya agizo.
- source_word: לְיִשַׁי
  choice: Yese
  rationale: Jina la mtu limetolewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בַּזָּבַח
  choice: kwenye dhabihu
  rationale: זבח inaweza kumaanisha dhabihu yenyewe au tukio linalohusiana nayo. “Kwenye dhabihu” linahifadhi upana huo bila kuongeza wazi wazo la karamu.
- source_word: וְאָנֹכִי אוֹדִיעֲךָ
  choice: nami nitakujulisha
  rationale: Hifili ya ידע ina maana ya kusababisha mtu ajue au kumjulisha. “Nitakujulisha” ni ya asili na inahifadhi maana hiyo ya kisababishi; “nami” pia linaonyesha msisitizo wa kiwakilishi huru אָנֹכִי.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: utakachofanya
  rationale: Usemi huu unahifadhi maana ya jambo ambalo Samueli atafanya bila kuongeza kwa lazima neno lenye nguvu zaidi kama “lazima.”
- source_word: וּמָשַׁחְתָּ
  choice: Kisha utampaka mafuta
  rationale: משׁח ni kitenzi cha kawaida cha kumtia mtu wakfu kwa kumpaka mafuta. “Utampaka mafuta” linahifadhi tendo lenyewe na umuhimu wake katika simulizi.
- source_word: לִי
  choice: kwa ajili yangu
  rationale: Kirai hiki kinaonyesha kuwa tendo hilo linafanywa kwa niaba ya Mungu au kwa kusudi lake. “Kwa ajili yangu” ni Kiswahili wazi na cha kawaida.
- source_word: אֵת אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: yule nitakayekuambia
  rationale: Kiebrania kinamtambulisha mtu kwa kauli ambayo Mungu atamwambia Samueli. Tafsiri hii huepuka kuongeza neno “nitakayemtaja,” ambalo lingeweka wazi zaidi ya kitenzi cha asili cha kusema.
theological_decisions:
- issue: Aina ya upako
  choice: Kuhifadhi tendo la “kumpaka mafuta” bila kutaja moja kwa moja kuwa ni kumweka mfalme.
  alternative: Kutafsiri wazi kuwa Samueli atamtia mafuta awe mfalme.
  rationale: Muktadha unaonyesha kuwa huu ni upako wa kifalme, lakini mstari huu wenyewe hautaji cheo hicho. Tafsiri inaacha simulizi litoe maana hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye staha. Sentensi imegawanywa sehemu mbili ili isomeke kwa urahisi, huku mfuatano wa maagizo ya Kiebrania ukihifadhiwa. Alama zote za tanbihi [a], [b], na [c] zimewekwa katika matini kuu.
