base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/012.yaml
  text: So he sent and brought him in. Now he was ruddy[a], with beautiful eyes and a handsome appearance. And Yahweh said, “Rise, anoint him, for this is he.”
translation:
  language: sw
  text: Basi akatuma akamleta. Alikuwa mwekundu, mwenye macho mazuri na sura ya kupendeza. Yahweh akasema, “Inuka, mpake mafuta, kwa maana ndiye huyu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח וַיְבִיאֵהוּ
  choice: Basi akatuma watu, nao wakamleta
  rationale: Vitenzi vinaendeleza simulizi. Kiswahili cha kawaida kinahitaji kuweka wazi kwa ufupi kwamba watu waliotumwa ndio waliomleta, bila kudokeza kwamba Yese aliondoka mwenyewe kumleta.
- source_word: אַדְמוֹנִי
  choice: mwekundu
  rationale: Neno linaonyesha rangi yenye wekundu, huenda ya ngozi au mwonekano kwa jumla. Tafsiri haifanyi wekundu huo kuwa rangi ya nywele pekee.
- source_word: עִם יְפֵה עֵינַיִם
  choice: mwenye macho mazuri
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya maelezo kuhusu macho yake.
- source_word: וְטוֹב רֹאִי
  choice: na sura ya kupendeza
  rationale: Kirai kinaeleza mwonekano unaopendeza; uchaguzi huu ni wa asili katika Kiswahili na hauongezi sifa za kiroho au za maadili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi, si kubadilishwa kuwa cheo.
- source_word: קוּם
  choice: Inuka
  rationale: Amri fupi, ya kawaida na yenye hadhi inayomwelekezwa Samueli.
- source_word: מְשָׁחֵהוּ
  choice: umtie mafuta
  rationale: Hili ni tamko la kawaida la Kiswahili kwa tendo la kumweka mtu wakfu kwa kumpaka mafuta katika muktadha wa uteuzi wa kifalme.
- source_word: כִּי זֶה הוּא
  choice: kwa maana ndiye huyu
  rationale: Mpangilio huu wa Kiswahili unabaki mfupi na unahifadhi msisitizo wa utambulisho uliomo katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina binafsi la Mungu moja kwa moja; kulitaja kama Yahwe kunalihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Maelezo ya mwonekano wa Daudi
  choice: Kuyahifadhi kama maelezo ya kimwili bila kuyapa maana ya ziada
  alternative: Kutafsiri אַדְמוֹנִי kuwa na nywele nyekundu au kuyafanya maelezo hayo yaashirie tabia njema
  rationale: Kiebrania kinataja mwonekano wa Daudi lakini hakisemi kwamba wekundu huo ni wa nywele wala kwamba sifa hizi ni za kiroho au za maadili.
- issue: Utambulisho katika כִּי זֶה הוּא
  choice: kwa maana ndiye huyu
  alternative: kwa maana huyu ndiye yule
  rationale: Kiebrania ni kifupi na chenye msisitizo. Chaguo kuu ni la asili katika Kiswahili, huku mbadala ukionyesha kwa uwazi zaidi maana ya ‘huyu ndiye yule aliyechaguliwa.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Muundo ni rahisi kueleweka katika usomaji wa hadhara. Maelezo ya mwonekano yamehifadhiwa bila kuyapanua, na alama ya tanbihi [a] imewekwa kwenye kirai inachokihusu.
