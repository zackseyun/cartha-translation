translation:
  language: sw
  text: Kisha Sauli akawaambia watumishi wake, “Tafadhali nitafutieni mwanamume anayejua kupiga muziki vizuri, na mleteni kwangu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akawaambia
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, na kiambishi -wa- kinaonyesha kuwa aliwaambia watumishi wengi.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: עֶבֶד hapa humaanisha watumishi wa Sauli katika mazingira ya kifalme. “Watumishi” ni ya karibu na Kiebrania na ya asili katika Kiswahili.
- source_word: רְאוּ נָא לִי
  choice: Tafadhali nitafutieni
  rationale: Amri רְאוּ pamoja na chembe ya heshima נָא inatumika hapa kwa maana ya kutafuta au kumpata mtu; kiambishi “-ni-” kinawakilisha לִי, yaani kwa ajili yangu.
- source_word: אִישׁ
  choice: mtu
  rationale: Ingawa אִישׁ inaweza kumaanisha “mwanamume,” katika ombi hili neno “mtu” ni la kawaida zaidi kwa Kiswahili na bado linarejelea mtu mmoja ambaye baadaye anaonyeshwa kwa ngeli ya m-wa.
- source_word: מֵיטִיב לְנַגֵּן
  choice: anayejua kupiga ala vizuri
  rationale: Kirai hicho kihalisi ni mtu “anayefanya vizuri katika kupiga.” Katika muktadha wa muziki, “kupiga ala vizuri” huwasilisha ustadi bila kutaja ala maalumu, ambayo haikutajwa katika mstari huu.
- source_word: וַהֲבִיאוֹתֶם אֵלָי
  choice: kisha mleteni kwangu
  rationale: Umbo hili ni agizo la wingi kwa watumishi, lenye kitu cha umoja. “Mleteni kwangu” linaonyesha yote mawili kwa njia wazi na ya kawaida.
