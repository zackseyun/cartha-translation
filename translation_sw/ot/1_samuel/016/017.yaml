translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri imetumia mtiririko wa simulizi ulio wazi na agizo la heshima. “Ala” limeongezwa kama kijalizo cha lazima kimaana katika Kiswahili ili “kupiga” ieleweke kuwa ni kupiga muziki, bila kubainisha aina ya ala.
