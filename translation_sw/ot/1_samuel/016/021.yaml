lexical_decisions:
- source_word: וַיָּבֹא
  choice: akaja kwa
  rationale: Kitenzi בוא pamoja na אֶל kinaonyesha mwendo kuelekea kwa Sauli; “akaja kwa Sauli” ni Kiswahili cha kawaida bila kuongeza wazo la kuingia.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: akasimama mbele yake
  rationale: Huhifadhi picha halisi ya Kiebrania, huku muktadha ukidokeza kusimama katika huduma mbele ya mfalme.
- source_word: וַיֶּאֱהָבֵהוּ מְאֹד
  choice: naye Sauli akampenda sana
  rationale: Jina “Sauli” linaweka wazi mhusika wa kitenzi kulingana na muktadha, na “akampenda sana” huhifadhi nguvu ya מְאֹד bila kuongeza maana ya kihisia.
- source_word: וַיְהִי לוֹ
  choice: Daudi akawa ... zake
  rationale: Muundo huu unaonyesha hali au jukumu jipya. Kurudia “Daudi” kunazuia utata wa viwakilishi katika Kiswahili.
- source_word: נֹשֵׂא כֵלִים
  choice: mchukua silaha
  rationale: Kirai cha Kiebrania humaanisha mtu anayebeba vifaa vya kijeshi vya mkuu; “mchukua silaha” ni wazi na huhifadhi upana wa כֵלִים kuliko kulihusisha na aina moja tu ya kinga.
