  text: So David came to Saul and stood before him[a], and Saul loved him greatly, and he became his armor-bearer.
translation:
  language: sw
  text: Basi Daudi akaja kwa Sauli, akasimama mbele yake, naye Sauli akampenda sana. Daudi akawa mbeba silaha wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbeba vifaa vya kijeshi vya Sauli.” Kiebrania humaanisha mtu anayebeba vifaa vya kijeshi.
