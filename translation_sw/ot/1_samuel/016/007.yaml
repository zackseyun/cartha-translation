base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/007.yaml
  text: But Yahweh said to Samuel[a], “Do not look at his appearance or at the height of his stature, because I have rejected him. For not as man sees does God see, for man sees what is before the eyes[c][b], but Yahweh sees the heart.”
translation:
  language: sw
  text: Lakini Yahweh akamwambia Samweli, “Usitazame mwonekano wake wala urefu wa kimo chake, kwa maana nimemkataa. Kwa maana Yahweh haoni kama mwanadamu anavyoona:[a] mwanadamu huona yaliyo mbele ya macho,[b] lakini Yahweh huona moyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa uhalisi zaidi, “Kwa maana si kama anavyoona mwanadamu.” Kiebrania ni cha mkato; maana ni kwamba Yahweh haoni kwa namna mwanadamu anavyoona.
    reason: lexical_alternative
  - marker: b
    text: Yaani, mambo yanayoonekana kwa nje.
    reason: clarification
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika maandishi ya Kiebrania limeandikwa moja kwa moja; ‘Yahweh’ hulihifadhi badala ya kulibadilisha kuwa cheo.
- source_word: תַּבֵּט
  choice: usitazame
  rationale: Kitenzi hiki hapa kinakataa kuelekeza uangalifu kwa sifa za nje; ‘usitazame’ ni cha kawaida na sahihi katika muktadha.
- source_word: מַרְאֵהוּ
  choice: sura yake
  rationale: Katika muktadha huu neno linamaanisha mwonekano unaoonekana; ‘sura yake’ ni Kiswahili cha asili kinacholingana na kutajwa kwa kimo.
- source_word: גְּבֹהַּ קוֹמָתוֹ
  choice: urefu wa kimo chake
  rationale: Huhifadhi msisitizo wa Kiebrania juu ya urefu wa mwili kwa mtindo wenye hadhi na unaoeleweka.
- source_word: מְאַסְתִּיהוּ
  choice: nimemkataa
  rationale: Katika uchaguzi wa mfalme, kitenzi hiki humaanisha kumkataa mtu kuwa hafai kwa jukumu hilo, si lazima kumdharau.
- source_word: הָאָדָם
  choice: mwanadamu
  rationale: Umoja huu unatumiwa kwa maana ya jumla kuhusu binadamu; ‘mwanadamu’ ni jumuishi na huhifadhi ulinganisho na Yahweh.
- source_word: לֹא אֲשֶׁר יִרְאֶה הָאָדָם
  choice: Yahweh haoni kama mwanadamu anavyoona
  rationale: Kiebrania ni kifupi na kinaweza kutafsiriwa kihalisi kuwa ‘si kama anavyoona mwanadamu’; kutaja Yahweh hukamilisha maana inayodokezwa na kuweka tofauti wazi bila kubadili hoja.
- source_word: לַעֵינַיִם
  choice: yaliyo mbele ya macho
  rationale: Huhifadhi taswira halisi ya Kiebrania badala ya kuifupisha kuwa ‘mwonekano wa nje’.
- source_word: לַלֵּבָב
  choice: moyo
  rationale: ‘Moyo’ huhifadhi maana ya kitovu cha ndani cha fikira, nia na tabia katika matumizi ya Kiebrania.
theological_decisions:
- issue: Tofauti kati ya namna mwanadamu na Mungu wanavyoona
  choice: Yahweh haoni kama mwanadamu anavyoona ... Yahweh huona moyo
  alternative: Si kama anavyoona mwanadamu; mwanadamu huona yaliyo mbele ya macho, lakini Yahweh huona moyo
  rationale: Maandishi ya Kiebrania ni ya mkato katika kishazi cha kwanza. Tafsiri iliyochaguliwa inaweka wazi mhusika anayelinganishwa, huku tanbihi ikihifadhi muundo na utata wa Kiebrania.
- issue: Maana ya ‘moyo’
  choice: moyo
  alternative: utu wa ndani
  rationale: ‘Moyo’ huhifadhi istiari ya Kiebrania na mvutano wake wa kiteolojia bila kuibana iwe hisia, akili au tabia pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya asili kwa msomaji wa kawaida, huku taswira za ‘macho’ na ‘moyo’ pamoja na jina Yahweh zikihifadhiwa.
