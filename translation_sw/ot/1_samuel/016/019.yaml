translation:
  language: sw
  text: Basi Sauli akatuma wajumbe kwa Yese na kusema, “Nitumie Daudi mwanao, aliye pamoja na kondoo[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliye katika kundi la kondoo.”
    reason: Kihusishi בְּ katika בַּצֹּאן kinaweza kueleza kuwa pamoja na kondoo au kuwa katika/miongoni mwa kundi lao.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma
  rationale: Kitenzi hiki kinasimulia tendo linalofuata katika masimulizi; “akatuma” ni namna ya kawaida na wazi ya kukieleza kwa Kiswahili.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu neno linawahusu wajumbe wa kibinadamu, si malaika; “wajumbe” haliongezi wazo la ujumbe rasmi wa kidiplomasia.
- source_word: אֶל יִשָׁי
  choice: kwa Yese
  rationale: Kihusishi kinaonyesha walikoelekezwa wajumbe; “kwa Yese” ni Kiswahili cha kawaida katika muktadha huu.
- source_word: וַיֹּאמֶר
  choice: na kusema
  rationale: Neno hili linaanzisha maneno ya Sauli yaliyonukuliwa moja kwa moja. Muundo huu unaunganisha kwa kawaida kutumwa kwa wajumbe na ujumbe waliobeba.
- source_word: שִׁלְחָה אֵלַי
  choice: Nitumie
  rationale: Amri ya kumtuma mtu kwa Sauli inaelezwa kwa ufupi na kwa kawaida kwa “Nitumie,” bila kupoteza mwelekeo wa “kwangu.”
- source_word: אֶת דָּוִד בִּנְךָ
  choice: Daudi mwanao
  rationale: Muundo huu unahifadhi jina na uhusiano wa Daudi na Yese kwa Kiswahili cha asili.
- source_word: אֲשֶׁר בַּצֹּאן
  choice: aliye pamoja na kondoo
  rationale: Tafsiri hii inadumisha wazo la kuwa pamoja na kondoo bila kuongeza wazi kwamba Daudi alikuwa akiwachunga, jambo ambalo halisemwi moja kwa moja katika kishazi hiki.
