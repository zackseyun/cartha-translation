base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/004.yaml
  text: So Samuel did what Yahweh had spoken and came to Bethlehem. The elders of the city trembled at his coming and said[a], “Do you come in peace?”
translation:
  language: sw
  text: Basi Samueli akafanya yale ambayo Yahweh alikuwa amesema, akafika Bethlehemu. Wazee wa mji wakaja kumlaki wakitetemeka, wakamwuliza, “Je, umekuja kwa amani?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: akafanya
  rationale: Ni tafsiri ya kawaida ya עשה katika mfuatano wa simulizi, ikionyesha wazi kwamba Samueli alitii bila kuongeza maana ya ‘kuamriwa’ ambayo haijaelezwa moja kwa moja hapa.
- source_word: אֵת אֲשֶׁר דִּבֶּר יְהוָה
  choice: kama Yahweh alivyokuwa amesema
  rationale: Inahifadhi maana ya kile Yahweh alichokuwa amesema awali na kutumia Kiswahili cha asili katika muktadha huu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Inawakilisha jina la Mungu lililoandikwa kwa herufi nne יְהוָה badala ya kulibadili kuwa cheo.
- source_word: וַיָּבֹא בֵּית לָחֶם
  choice: akafika Bethlehemu
  rationale: בוא inaweza kumaanisha kuja, kwenda, au kufika kulingana na mtazamo; ‘akafika’ ni ya kawaida katika simulizi la Kiswahili na inaeleza kuwasili kwake bila utata wa kimtazamo.
- source_word: וַיֶּחֶרְדוּ
  choice: wakitetemeka
  rationale: Inahifadhi nguvu ya חרד, ambayo huonyesha mtikisiko wa hofu au wasiwasi, badala ya kuifanya tu ‘wakaogopa.’
- source_word: זִקְנֵי הָעִיר
  choice: Wazee wa mji
  rationale: Ni usemi wa kawaida unaohifadhi wajibu wao wa kijamii kama viongozi wazee wa mji.
- source_word: לִקְרָאתוֹ
  choice: wakaja kumlaki
  rationale: לקראת משמעו kuelekea mtu ili kukutana naye; ‘kملaki’ kwa usahihi ni kwenda kumpokea anayewasili na huungana vizuri na kitenzi cha kutetemeka.
- source_word: שָׁלוֹם בּוֹאֶךָ
  choice: Je, umekuja kwa amani?
  rationale: Ni swali la kawaida la Kiswahili linaloonyesha wasiwasi kuhusu kusudi au matokeo ya kuja kwa Samueli.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi יְהוָה; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wakaja kumlaki wakitetemeka’ huhifadhi uhusiano wa kisarufi kati ya kutetemeka na kwenda kukutana naye, na hivyo haihitaji tanbihi ya mbadala. Muundo wa simulizi wenye viambishi ‘aka-/waka-’ ni wa kawaida na wenye mtiririko mzuri.
