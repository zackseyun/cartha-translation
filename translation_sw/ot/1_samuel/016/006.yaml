  yaml_path: translation/ot/1_samuel/016/006.yaml
  text: When they came in[a], he saw Eliab and said, “Surely Yahweh’s anointed is before Yahweh.”
translation:
  language: sw
  text: Walipoingia, akamwona Eliabu, akasema, “Hakika, mtiwa-mafuta[a] wa Yahwe yuko mbele ya Yahwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Masihi wa Yahwe.” Neno la Kiebrania lililotafsiriwa “mtiwa-mafuta” ndilo linalotumiwa pia kwa “Masihi”; hapa linamhusu mtu ambaye Samweli anadhani Yahwe amemchagua na kumtia mafuta kuwa mfalme.
    reason: Kuonyesha chaguo jingine la msamiati na uhusiano wake na cheo “Masihi” bila kulazimisha maana hiyo ya baadaye katika muktadha huu.
lexical_decisions:
- source_word: בְּבוֹאָם
  choice: Walipoingia
  rationale: Muundo wa ב pamoja na kitenzi-jina בוא na kiambishi cha wingi unaonyesha wakati walipoingia; tafsiri hii ni ya kawaida katika simulizi la Kiswahili.
- source_word: וַיַּרְא אֶת אֱלִיאָב
  choice: akamwona Eliabu
  rationale: Inadumisha tendo rahisi la kuona pamoja na jina la mtu, bila kuongeza wazo la kumchunguza.
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: אמר kwa kawaida humaanisha kusema; maandishi hayasemi wazi kwamba Samweli alisema moyoni, kwa hiyo tafsiri haiongezi ufafanuzi huo.
- source_word: אַךְ
  choice: Hakika
  rationale: Hapa neno hili linaonyesha uhakika mkubwa wa Samweli alipomwona Eliabu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa na cheo.
- source_word: מְשִׁיחוֹ
  choice: mtiwa-mafuta wa Yahwe
  rationale: Neno hilo linamtaja mtu aliyetiwa mafuta, hapa yule ambaye Samweli anadhani amechaguliwa kuwa mfalme; umilikaji wake umeelezwa kwa kumtaja Yahwe wazi.
- source_word: נֶגֶד יְהוָה
  choice: mbele za Yahwe
  rationale: Tafsiri hii inahifadhi kwa uwazi maana ya kuwa mbele ya Yahwe au katika uwepo wake, bila kubadili jina la Mungu kuwa kiwakilishi.
theological_decisions:
- issue: Maana ya מְשִׁיחוֹ katika mazingira ya kuchaguliwa kwa mfalme
  choice: mtiwa-mafuta wa Yahwe
  alternative: Masihi wa Yahwe
  rationale: Katika simulizi hili neno linamhusu mtu ambaye Samweli anadhani Yahwe amemchagua na kumtia mafuta kuwa mfalme. Tafsiri kuu inaonyesha maana hiyo ya kihistoria bila kuingiza mapema maana maalumu ya baadaye ya cheo “Masihi”; uhusiano wa msamiati umehifadhiwa katika tanbihi.
- issue: Mhusika wa kirai נֶגֶד יְהוָה
  choice: mbele za Yahwe
  alternative: mbele zake
  rationale: Maandishi ya Kiebrania yanamtaja Yahwe wazi baada ya נֶגֶד. Kurudia jina katika Kiswahili kunadumisha uwazi huo, ingawa “mbele zake” ni tafsiri ya kawaida inayowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. Mfuatano wa vitenzi “akamwona, akasema” ni wa kawaida katika usimulizi wa Kiswahili. Marudio ya jina “Yahwe” yamehifadhiwa kwa sababu maandishi ya Kiebrania yanaliweka wazi katika kirai cha mwisho.
