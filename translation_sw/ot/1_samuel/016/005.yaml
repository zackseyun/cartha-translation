base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/005.yaml
  text: He said[a], “Peace. I have come to sacrifice to Yahweh. Consecrate yourselves, and come with me to the sacrifice.” And he consecrated Jesse and his sons and invited them to the sacrifice.
translation:
  language: sw
  text: Akasema[a], “Amani. Nimekuja kumtolea Yahweh dhabihu. Jitakaseni, kisha mje pamoja nami kwenye dhabihu.” Naye akawatakasa Yese na wanawe, akawaalika kwenye dhabihu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kila kitu ni salama,” au, “Nimekuja kwa amani.” Kiebrania kinasema tu, “Amani,” likiwa hakikisho kwamba kuja kwa Samueli hakukuwa kwa uhasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: Amani
  rationale: Nomino hii peke yake inajibu hofu ya wazee kuhusu kuja kwa Samueli kwa nia njema; “Amani” huhifadhi ufupi na upana wa neno la Kiebrania.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: kumtolea Yahweh dhabihu
  rationale: Muundo huu unaeleza kusudi la kuja kwa Samueli na unasikika kwa kawaida katika Kiswahili huku ukihifadhi tendo la ibada ya dhabihu.
- source_word: הִתְקַדְּשׁוּ
  choice: Jitakaseni
  rationale: Katika muktadha huu kitenzi kinamaanisha kujitayarisha na kujiweka wakfu kwa ushiriki mtakatifu katika dhabihu; “jitakaseni” ni neno la kawaida la kibiblia lisilopunguza maana kuwa kuoga au kujisafisha tu.
- source_word: וּבָאתֶם אִתִּי בַּזָּבַח
  choice: kisha mje pamoja nami kwenye dhabihu
  rationale: Waw inayofuata agizo inaendeleza hatua inayofuata; “kisha” huleta mtiririko wa kawaida wa Kiswahili bila kubadili mwaliko/agizo la kuandamana naye.
- source_word: וַיְקַדֵּשׁ
  choice: akawatakasa
  rationale: Pieli ya קדשׁ inaonyesha kwamba Samueli aliwatayarisha au kuwaweka wakfu kiibada Yese na wanawe; “akawatakasa” hudumisha uhusiano wa msamiati na “jitakaseni.”
- source_word: וַיִּקְרָא לָהֶם לַזָּבַח
  choice: akawaalika kwenye dhabihu
  rationale: קרא + ל hapa ina maana ya kuwaita washiriki katika tukio la dhabihu; “akawaalika” huonyesha kujumuishwa kwao bila kuingiza lazima isiyothibitishwa na muktadha.
- source_word: יִשַׁי
  choice: Yese
  rationale: Jina limetolewa kwa umbo lililozoeleka katika mapokeo ya Biblia ya Kiswahili.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Muktadha unaonyesha wana wa kiume wa Yese; “wanawe” ni umbo la Kiswahili la asili na sahihi hapa.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yana jina la agano moja kwa moja; “Yahweh” hulitambulisha kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya kujitakasa kabla ya dhabihu
  choice: Jitakaseni / akawatakasa
  alternative: Jisafisheni / akawasafisha
  rationale: Mzizi קדשׁ una wazo la utakatifu na kuwekwa tayari kwa ibada, si usafi wa kimwili pekee; tafsiri haibainishi taratibu ambazo mstari hauzitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi zimewekwa kwa mtiririko wa asili; ufupi wa jibu la Kiebrania “Amani” umehifadhiwa, na msamiati wa kiibada umetolewa bila maelezo ya kimadhehebu.
