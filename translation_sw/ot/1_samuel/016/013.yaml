base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/013.yaml
  text: Then Samuel took the horn of oil and anointed him in the midst of his brothers[a]. And the Spirit of Yahweh rushed upon David from that day onward[b]. Then Samuel rose and went to Ramah.
translation:
  language: sw
  text: Ndipo Samueli akachukua pembe ya mafuta, akampaka Daudi mafuta katikati ya kaka zake. Roho[b] ya Yahwe ikamjia Daudi kwa nguvu[a] tangu siku hiyo na kuendelea. Kisha Samueli akaondoka, akaenda Rama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Roho ya Yahwe ikaja kwa nguvu juu ya Daudi.” Kitenzi cha Kiebrania kinaweza kueleza ujio wa Roho wenye nguvu unaomwezesha mtu.
    reason: lexical_alternative
  - marker: b
    text: Au, “roho ya Yahwe ikamjia Daudi kwa nguvu.” Maandishi ya Kiebrania hayatofautishi maana kwa kutumia herufi kubwa au ndogo; kuandika “Roho” kwa herufi kubwa ni uamuzi wa kitafsiri.
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: pembe ya mafuta
  rationale: Neno קֶרֶן humaanisha kihalisi ‘pembe,’ yaelekea pembe ya mnyama iliyotumiwa kama chombo cha kuhifadhia mafuta. Tafsiri hii inadumisha taswira halisi ya simulizi.
- source_word: וַיִּמְשַׁח
  choice: akamtia Daudi mafuta
  rationale: Kitenzi משׁח kinaeleza tendo la kumpaka au kumtia mtu mafuta kwa kusudi maalumu. Kauli hii ni ya kawaida na yenye heshima katika Kiswahili, na inadumisha tendo lenyewe pamoja na maana yake ya kifalme bila kuongeza ufafanuzi.
- source_word: בְּקֶרֶב אֶחָיו
  choice: akiwa miongoni mwa kaka zake
  rationale: בְּקֶרֶב ni ‘katikati ya’ au ‘miongoni mwa.’ Katika muktadha huu אחיו ni ndugu wa kiume wa Daudi, ambao pia ni kaka zake; hivyo tafsiri hii ni ya asili na sahihi kimuktadha.
- source_word: וַתִּצְלַח רוּחַ יְהוָה אֶל דָּוִד
  choice: Roho ya Yahwe ikamjia Daudi kwa nguvu
  rationale: צָלַח pamoja na רוּחַ יְהוָה katika vitabu vya Samueli huonyesha ujio wenye nguvu unaomwezesha mtu. ‘Ikamjia ... kwa nguvu’ ni Kiswahili cha asili kinachodumisha nguvu ya kitenzi bila kulazimisha taswira isiyo ya kawaida.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa konsonanti יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi katika matini.
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: tangu siku hiyo na kuendelea
  rationale: Kirai hiki kinaonyesha mwanzo wa hali inayoendelea. Tafsiri iliyochaguliwa ni ya kawaida katika Kiswahili na inadumisha maana hiyo ya muda.
- source_word: וַיָּקָם ... וַיֵּלֶךְ
  choice: akaondoka, akaenda
  rationale: Katika mfuatano wa kisimulizi קום mara nyingi huonyesha mtu kuondoka au kuanza safari, na וילך huonyesha kwenda. Kiswahili hiki ni cha asili na kinadumisha matendo yote mawili.
- source_word: הָרָמָתָה
  choice: Rama
  rationale: Herufi ya kuelekeza iliyo mwishoni mwa jina inaonyesha kwenda mahali hapo. ‘Rama’ ni utohozi mfupi na unaotambulika wa jina la mahali.
theological_decisions:
- issue: Maana ya רוּחַ יְהוָה na matumizi ya herufi kubwa
  choice: Roho ya Yahwe
  alternative: roho ya Yahwe
  rationale: Muktadha unaelekea kuonyesha uwepo wa Mungu unaomtia Daudi nguvu, kwa hiyo ‘Roho’ imeandikwa kwa herufi kubwa. Hata hivyo, Kiebrania hakitumii tofauti ya herufi kubwa na ndogo; tanbihi inadumisha uwezekano huo wa kisarufi na kitafsiri.
- issue: Namna ya kueleza nguvu ya kitenzi צלח
  choice: ikamjia Daudi kwa nguvu
  alternative: ikaja kwa nguvu juu ya Daudi
  rationale: Tafsiri iliyochaguliwa ni ya kawaida zaidi katika Kiswahili huku ikidumisha ujio wa Roho wenye nguvu na wa kumwezesha Daudi. Njia nyingine inadumisha kwa karibu zaidi muundo wa kihusishi wa Kiebrania.
- issue: Hadhara iliyokuwepo wakati Daudi alipotiwa mafuta
  choice: akiwa miongoni mwa kaka zake
  alternative: akiwa katikati ya kaka zake
  rationale: Matini inasema wazi kwamba Daudi alitiwa mafuta akiwa miongoni mwa ndugu zake wa kiume. Tafsiri haiongezi madai kuhusu kiwango ambacho tukio hilo lilikuwa la hadhara au jinsi lilivyoeleweka kisiasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi na hadhi inayofaa Maandiko. Muundo wa vitenzi mfululizo (‘akachukua ... akamtia ... akaondoka, akaenda’) ni wa asili katika simulizi la Kiswahili. ‘Pembe ya mafuta’ inadumisha taswira halisi, na ‘akamjia ... kwa nguvu’ huepuka usemi mgumu huku ikihifadhi msisitizo wa Kiebrania.
