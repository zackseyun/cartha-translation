  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל עַד מָתַי֙ אַתָּה֙ מִתְאַבֵּ֣ל אֶל שָׁא֔וּל וַ/אֲנִ֣י מְאַסְתִּ֔י/ו מִ/מְּלֹ֖ךְ עַל יִשְׂרָאֵ֑ל מַלֵּ֨א קַרְנְ/ךָ֜ שֶׁ֗מֶן וְ/לֵ֤ךְ אֶֽשְׁלָחֲ/ךָ֙ אֶל יִשַׁ֣י בֵּֽית הַלַּחְמִ֔י כִּֽי רָאִ֧יתִי בְּ/בָנָ֛י/ו לִ֖/י מֶֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/001.yaml
  text: And Yahweh said to Samuel[a], “How long will you grieve over Saul, since I have rejected him from being king over Israel? Fill your horn with oil and go; I am sending you to Jesse the Bethlehemite, for I have provided for myself a king among his sons.”
translation:
  language: sw
  text: Yahwe akamwambia Samueli, “Utaendelea kumwombolezea Sauli mpaka lini, kwa kuwa nimemkataa asiwe mfalme juu ya Israeli? Jaza pembe yako mafuta, kisha uende. Nitakutuma kwa Yese wa Bethlehemu, kwa maana nimejipatia mfalme miongoni mwa wanawe.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa maana halisi ni, “Nimeona kwa ajili yangu mfalme.” Katika muktadha huu, kitenzi “kuona” kinaweza pia kudokeza kuchagua au kujipatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatunza jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo kama “Bwana.”
- source_word: מִתְאַבֵּל אֶל־שָׁאוּל
  choice: kumwombolezea Sauli
  rationale: Kitenzi kinaeleza kuomboleza au kuhuzunika sana; “kumwombolezea” ni cha kawaida na kinadumisha nguvu ya kihisia ya kauli.
- source_word: מְאַסְתִּיו מִמְּלֹךְ עַל־יִשְׂרָאֵל
  choice: nimemkataa asiwe mfalme juu ya Israeli
  rationale: Kinaonyesha kuwa kukataliwa kunahusu utawala wa Sauli juu ya Israeli, bila kupanua kauli hiyo kuwa hukumu kuhusu hali yake yote mbele za Mungu.
- source_word: מַלֵּא קַרְנְךָ שֶׁמֶן
  choice: Jaza pembe yako mafuta
  rationale: Linahifadhi picha halisi ya pembe iliyotumiwa kama chombo cha mafuta ya kutia mafuta.
- source_word: אֶשְׁלָחֲךָ
  choice: Nitakutuma
  rationale: Wakati ujao wa karibu unafaa kwa agizo la Mungu linalofuata mara moja.
- source_word: יִשַׁי בֵּית הַלַּחְמִי
  choice: Yese wa Bethlehemu
  rationale: Ni Kiswahili cha asili kinachoonyesha mahali alikotoka Yese bila kutumia neno lisilo la kawaida la kumwita mwenyeji wa Bethlehemu.
- source_word: רָאִיתִי ... לִי
  choice: nimejipatia
  rationale: Katika muktadha huu, maana ya nahau ni kwamba Mungu amejitayarishia au amejichagulia mfalme, ingawa kitenzi chenyewe kwa msingi humaanisha “kuona”; tanbihi inalinda taswira hiyo ya Kiebrania.
- source_word: בְּבָנָיו
  choice: miongoni mwa wanawe
  rationale: Inaonyesha kwamba mfalme huyo ni mmoja kati ya wana wa Yese.
- source_word: מֶלֶךְ
  choice: mfalme
  rationale: Nomino inamtambulisha mtu wa kushika wadhifa wa kifalme bila kumtaja bado.
theological_decisions:
- issue: Upeo wa Mungu kumkataa Sauli
  choice: nimemkataa asiwe mfalme juu ya Israeli
  alternative: nimemkataa asitawale juu ya Israeli
  rationale: Tafsiri inahusisha kukataliwa moja kwa moja na ufalme wa Sauli, kama maandishi yanavyofanya, bila kuamua maana pana zaidi kuhusu wokovu au hadhi yake yote mbele za Mungu.
- issue: Maana ya רָאִיתִי לִי katika kumteua mfalme
  choice: nimejipatia mfalme
  alternative: nimejionea mfalme
  rationale: “Nimejipatia” huwasilisha kwa Kiswahili maana ya kimuktadha ya uteuzi au maandalizi ya Mungu, huku tanbihi ikihifadhi maana halisi ya “kuona” na utata wake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi za usemi wa moja kwa moja ni rahisi kueleweka, huku picha ya “pembe” na jina “Yahwe” zikihifadhiwa kutoka maandishi ya asili.
