  text: Then Saul sent to Jesse[a], saying, “Please let David stand before me, for he has found favor in my eyes.”
translation:
  language: sw
  text: Ndipo Sauli akamtumia Yese ujumbe, akisema, “Tafadhali, mwache Daudi asimame mbele yangu,[a] kwa maana amepata kibali machoni pangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aendelee kuwa mbele yangu,” kwa maana ya kuendelea kumhudumia Sauli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Ndipo Sauli akatuma ujumbe
  rationale: Wayyiqtol inaendeleza simulizi. ‘Ndipo ... akatuma ujumbe’ ni Kiswahili cha kawaida na hufanya wazi kuwa Sauli alituma ujumbe, huku לֵאמֹר ikitambulisha maneno yake.
- source_word: אֶל יִשַׁי
  choice: kwa Yese
  rationale: אֶל hapa inaelekeza ujumbe kwa mtu; ‘kwa Yese’ ni matumizi ya kawaida ya Kiswahili katika muktadha huu.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Infinitivi hii hutambulisha usemi wa moja kwa moja; ‘akisema’ huhifadhi kazi yake kwa lugha ya kawaida.
- source_word: יַעֲמָד נָא
  choice: Tafadhali, mwache ... akae
  rationale: Jussive pamoja na נָא ni ombi la heshima. Katika muktadha wa huduma ya kifalme, עמד inaweza kumaanisha kusimama au kuendelea kukaa katika huduma; ‘akae’ ni ya asili zaidi kwa Kiswahili huku tanbihi ikihifadhi taswira halisi.
- source_word: לְפָנַי
  choice: mbele yangu
  rationale: Huhifadhi nahau ya Kiebrania na pia inadokeza kuhudumu mbele ya mfalme.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza sababu ya ombi la Sauli kwa mtiririko wa kawaida na wenye hadhi.
- source_word: מָצָא חֵן
  choice: amepata kibali
  rationale: Nahau hii ina maana ya kupata upendeleo au kukubaliwa. ‘Kibali’ kinafaa katika muktadha wa kifalme bila kuingiza maana maalumu ya kiteolojia.
- source_word: בְּעֵינַי
  choice: machoni pangu
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania na inaeleweka katika Kiswahili cha sasa.
- source_word: דָוִד / שָׁאוּל / יִשַׁי
  choice: Daudi / Sauli / Yese
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili.
