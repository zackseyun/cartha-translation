translation:
  language: sw
  text: Ndipo Daudi akaondoka siku hiyo, akamkimbia Sauli, akaenda kwa Akishi, mfalme wa Gathi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: akaondoka
  rationale: Ingawa kitenzi קום kimsingi humaanisha kuinuka au kusimama, katika mfululizo huu wa simulizi ‘akaondoka’ ni Kiswahili cha kawaida kinachoonyesha Daudi alianza safari bila kuongeza wazo lisilokuwamo.
- source_word: וַיִּבְרַח
  choice: akamkimbia
  rationale: Kitenzi ברח humaanisha kukimbia au kutoroka. ‘Akamkimbia Sauli’ kinaonyesha moja kwa moja kuwa Daudi alikimbia ili awe mbali naye na kinadumisha uharaka wa tendo.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya kirai cha wakati, ikihifadhi rejeo lake mahususi.
- source_word: מִפְּנֵי שָׁאוּל
  choice: Sauli
  rationale: Katika muundo ‘akamkimbia Sauli,’ Kiswahili huwasilisha kwa kawaida maana ya nahau ya Kiebrania ‘kutoka mbele/uweponi mwa Sauli’ bila tafsiri ngumu ya neno kwa neno.
- source_word: וַיָּבֹא אֶל
  choice: akaenda kwa
  rationale: בוא pamoja na אֶל inaweza kueleza kwenda au kufika kwa mtu. ‘Akaenda kwa’ ni ya asili katika mtazamo wa msimulizi wa Kiswahili na haibadili lengo la safari.
- source_word: אָכִישׁ
  choice: Akishi
  rationale: Jina limeandikwa kwa namna inayofaa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: מֶלֶךְ גַּת
  choice: mfalme wa Gathi
  rationale: Muundo huu unatambulisha cheo cha Akishi kwa uwazi; koma linaonyesha kuwa ni maelezo ya Akishi.
