translation:
  language: sw
  text: Kisha akainuka, akaenda zake, naye Yonathani akaingia mjini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: Kisha akainuka
  rationale: Kitenzi cha Qal wayyiqtol kutoka קום kinaendeleza simulizi kwa maana ya kuinuka; “Kisha” huonyesha mfuatano wa matukio kwa Kiswahili cha kawaida.
- source_word: וַיֵּלַךְ
  choice: akaenda zake
  rationale: Qal wayyiqtol ya הלך humaanisha kwenda. Katika muktadha wa kuachana, “akaenda zake” huonyesha kwa kawaida kwamba aliondoka bila kuongeza wazo lisilokuwamo katika chanzo.
- source_word: וִיהוֹנָתָן
  choice: naye Yonathani
  rationale: Jina limetoholewa kwa tahajia ya kawaida ya Biblia ya Kiswahili; “naye” huhifadhi kiunganishi na mabadiliko ya mtendaji.
- source_word: בָּא
  choice: akaingia
  rationale: Qal perfect ya בוא inaweza kumaanisha kuja au kuingia. Ikiwa na יעד ya mahali, “akaingia” ni Kiswahili cha asili na huepuka kulazimisha mtazamo wa mwendo wa ‘kuja’ au ‘kwenda’.
- source_word: הָעִיר
  choice: mjini
  rationale: עיר ni mji. Muundo “akaingia mjini” ni wa kawaida na wa asili kwa Kiswahili, huku ukihifadhi maana ya kuingia katika mji unaojulikana katika muktadha.
