  text: וַ/יֹּ֣אמֶר הַ/כֹּהֵ֗ן חֶרֶב֩ גָּלְיָ֨ת הַ/פְּלִשְׁתִּ֜י אֲשֶׁר הִכִּ֣יתָ בְּ/עֵ֣מֶק הָאֵלָ֗ה הִנֵּה הִ֞יא לוּטָ֣ה בַ/שִּׂמְלָה֮ אַחֲרֵ֣י הָ/אֵפוֹד֒ אִם אֹתָ֤/הּ תִּֽקַּח לְ/ךָ֙ קָ֔ח כִּ֣י אֵ֥ין אַחֶ֛רֶת זוּלָתָ֖/הּ בָּ/זֶ֑ה וַ/יֹּ֧אמֶר דָּוִ֛ד אֵ֥ין כָּמ֖וֹ/הָ תְּנֶ֥/נָּה לִּֽ/י־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/010.yaml
  text: And the priest said[a], “The sword of Goliath the Philistine, whom you struck down in the Valley of Elah—behold, it is wrapped in a cloth behind the ephod. If you will take that for yourself, take it, for there is no other here except it.” And David said, “There is none like it; give it to me.”
translation:
  language: sw
  text: Kuhani akasema, “Upanga wa Goliathi, yule Mfilisti uliyempiga katika Bonde la Ela—tazama, umefungwa katika vazi[a] nyuma ya efodi. Ukitaka kujichukulia huo, uchukue, kwa maana hakuna upanga mwingine hapa isipokuwa huo.” Daudi akasema, “Hakuna mwingine kama huo; nipe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “nguo” au “joho.”'
    reason: Neno la Kiebrania שׂמלה humaanisha vazi la nje, nguo, au joho; aina halisi ya vazi lililotumika kuufunga upanga haijaainishwa.
lexical_decisions:
- source_word: חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: Upanga wa Goliathi, yule Mfilisti
  rationale: Muundo wa umilikaji umetafsiriwa kwa ‘wa’; ‘yule Mfilisti’ inadumisha utambulisho wa Goliathi kwa lugha ya kawaida ya Kiswahili.
- source_word: הִכִּיתָ
  choice: uliyemuua
  rationale: Katika muktadha huu wa pambano na kifo cha Goliathi, נכה humaanisha kumpiga hadi kumuua; Kiswahili ‘uliyemuua’ kinaweka wazi matokeo yanayojulikana katika simulizi.
- source_word: בְּעֵמֶק הָאֵלָה
  choice: katika Bonde la Ela
  rationale: Ni tafsiri ya kawaida na inayoeleweka ya jina la mahali.
- source_word: הִנֵּה
  choice: tazama
  rationale: Inahifadhi kazi ya neno la Kiebrania la kuelekeza uangalifu, katika sajili yenye heshima.
- source_word: לוּטָה בַשִּׂמְלָה
  choice: umefungwa katika vazi
  rationale: Kitenzi kinaonyesha upanga umefunikwa au kuzungushiwa kitu; שׂמלה kimsingi ni vazi au nguo, si lazima kitambaa maalumu.
- source_word: אַחֲרֵי הָאֵפוֹד
  choice: nyuma ya efodi
  rationale: אַחֲרֵי ina maana ya mahali hapa; ‘nyuma ya’ ni ya asili katika Kiswahili.
- source_word: אִם אֹתָהּ תִּקַּח לְךָ קָח
  choice: Ukitaka kujichukulia huo, uchukue
  rationale: Inawasilisha sharti lenye ruhusa na inadumisha wazo la kuchukua kwa ajili yake mwenyewe.
- source_word: כִּי אֵין אַחֶרֶת זוּלָתָהּ בָּזֶה
  choice: kwa maana hakuna upanga mwingine hapa isipokuwa huo
  rationale: Kutaja tena ‘upanga’ kunafanya rejeo la kiwakilishi cha kike cha Kiebrania lieleweke kwa Kiswahili; ‘hapa’ huwasilisha maana ya mahali katika בָּזֶה.
- source_word: אֵין כָּמוֹהָ
  choice: Hakuna mwingine kama huo
  rationale: Nahau hii inadumisha dai la upekee au ubora bila kulifafanua kupita kiasi.
- source_word: תְּנֶנָּה לִּי
  choice: nipe
  rationale: Katika Kiswahili, kiambishi cha kitu kinaweza kuachwa kwa kawaida kwa kuwa upanga umetajwa wazi; maana ni ‘nipe huo.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Efodi’ imetumika kama istilahi ya kawaida ya kibiblia. Viwakilishi vya upanga vimefuata ngeli ya Kiswahili (‘huo’) badala ya jinsia ya kisarufi ya Kiebrania.
