base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/002.yaml
  text: David came to Nob, to Ahimelech the priest. Ahimelech trembled when he met David and said to him, “Why are you alone, and no man is with you?”
translation:
  language: sw
  text: Daudi akafika Nobu kwa Ahimeleki kuhani. Ahimeleki akatetemeka alipokutana na Daudi, akamwambia, “Kwa nini uko peke yako, wala hakuna mtu pamoja nawe?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: akafika
  rationale: Katika muktadha wa kufika mahali palipoitwa Nobu, ‘akafika’ ni Kiswahili cha kawaida na huwasilisha tendo la kuja bila kuongeza maelezo.
- source_word: וַיֶּחֱרַד
  choice: akatetemeka
  rationale: Huhifadhi taswira halisi ya kutetemeka kwa sababu ya hofu au mshtuko, bila kuamua kimyakimya sababu kamili ya mwitikio wake.
- source_word: לִקְרַאת
  choice: alipokutana na
  rationale: Huonyesha kukutana na Daudi kwa Kiswahili cha sasa na cha asili; hapa muundo huu unaeleza wakati wa mwitikio wa Ahimeleki.
- source_word: אִישׁ
  choice: mtu
  rationale: Katika swali hili neno linamaanisha mtu yeyote aliyeandamana na Daudi; ‘mtu’ ni la kawaida na halilazimishi jinsia pasipo ulazima wa kimuktadha.
- source_word: אִתָּךְ
  choice: pamoja nawe
  rationale: Huwasilisha wazi wazo la mtu kuandamana au kuwa pamoja na Daudi.
theological_decisions: []
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Majina yametolewa kwa maumbo ya kawaida ya Kiswahili: Daudi, Nobu, na Ahimeleki. Urudiaji wa swali umehifadhiwa kwa mtiririko wa kawaida wa Kiswahili.'
