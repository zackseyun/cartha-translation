base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/009.yaml
  text: And David said to Ahimelech[a], “Is there not here under your hand a spear or a sword? For I did not take my sword or my weapons in my hand[c][b], because the king’s matter was urgent.”
translation:
  language: sw
  text: Ndipo Daudi akamwambia Ahimeleki, “Je, hapa kwako kuna mkuki au upanga? Kwa maana sikuchukua upanga wangu wala vifaa vyangu pamoja nami[a], kwa sababu jambo la mfalme lilikuwa la haraka[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “silaha zangu.” Neno la Kiebrania linaweza kumaanisha kwa upana vyombo, vifaa, au silaha; katika muktadha huu huenda linamaanisha silaha.
    reason: lexical_alternative
  - marker: b
    text: Au “shughuli ya mfalme” au “amri ya mfalme.” Neno la Kiebrania lina maana pana kuliko chaguo lolote moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד לַאֲחִימֶלֶךְ
  choice: Ndipo Daudi akamwambia Ahimeleki
  rationale: Muundo wa masimulizi wa Kiebrania umetafsiriwa kwa Kiswahili cha kawaida kinachoendeleza tukio; jina limetoholewa kwa namna inayoeleweka katika Kiswahili.
- source_word: וְאִין יֵשׁ פֹּה תַחַת יָדְךָ
  choice: Je, hapa una ... wowote?
  rationale: Kirai halisi ‘chini ya mkono wako’ ni nahau ya kuwa nacho au kuwa nacho tayari kwa matumizi. Kiswahili cha asili hutumia ‘una’ bila kuingiza taswira isiyoeleweka.
- source_word: חֲנִית אוֹ חָרֶב
  choice: mkuki au upanga
  rationale: Haya ni majina ya moja kwa moja ya silaha hizo mbili; neno ‘wowote’ linaendeleza swali la kutokuwapo kwa silaha.
- source_word: גַם חַרְבִּי וְגַם כֵּלַי לֹא לָקַחְתִּי בְיָדִי
  choice: sikuja na upanga wangu wala silaha zangu
  rationale: ‘Sikuja na’ huwasilisha kwa Kiswahili cha kawaida maana ya kutokuchukua vitu hivyo mkononi au pamoja naye. כֵּלַי ni neno pana la vifaa, lakini katika muktadha huu wa kutafuta mkuki au upanga, ‘silaha’ ndiyo maana inayowezekana zaidi; uwezekano mpana umehifadhiwa katika tanbihi.
- source_word: דְבַר הַמֶּלֶךְ
  choice: jambo la mfalme
  rationale: דבר linaweza kumaanisha jambo, shughuli, neno, au amri. ‘Jambo’ huhifadhi upana wake bila kuamua kwamba lilikuwa hasa agizo au shughuli.
- source_word: נָחוּץ
  choice: la haraka
  rationale: Huwasilisha hali ya jambo kuwa la dharura au lenye kuhitaji utekelezaji wa haraka kwa lugha ya kawaida na yenye hadhi.
