translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Nahau ya Kiebrania ‘chini ya mkono wako’ imetolewa kwa maana yake ya kawaida ‘una,’ huku utata wa כֵּלַי na דְבַר ukihifadhiwa kwa tanbihi.
