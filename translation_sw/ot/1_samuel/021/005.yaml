base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/005.yaml
  text: The priest answered David and said[a], “There is no ordinary bread on hand, but there is holy bread—if the young men have kept themselves from women.”
translation:
  language: sw
  text: Kuhani akamjibu Daudi, akasema, “Sina mkate wa kawaida hapa; ila kuna mkate mtakatifu, ikiwa tu vijana wamejiepusha na wanawake.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “na mwanamke,” yaani, ikiwa wamejiepusha na mahusiano ya kingono kwa ajili ya usafi wa kiibada.
    reason: Hutoa tafsiri mbadala ya umoja מֵאִשָּׁה na kufafanua maana yake katika muktadha.
lexical_decisions:
- source_word: לֶחֶם חֹל
  choice: mkate wa kawaida
  rationale: Hutofautisha mkate usio wakfu na לֶחֶם קֹדֶשׁ bila kutoa maana ya kwamba mkate huo ni mwovu au najisi.
- source_word: אֶל תַּחַת יָדִי
  choice: Sina ... hapa
  rationale: Nahau ya Kiebrania ina maana ya kitu kilicho mikononi au kinachopatikana; Kiswahili hiki ni cha kawaida na wazi katika muktadha.
- source_word: כִּי אִם
  choice: ila
  rationale: Huonyesha kinyume au jambo la pekee baada ya kukana kuwapo kwa mkate wa kawaida.
- source_word: לֶחֶם קֹדֶשׁ
  choice: mkate mtakatifu
  rationale: Hudumisha moja kwa moja tofauti ya kiibada kati ya kilicho cha kawaida na kilichotengwa kuwa kitakatifu.
- source_word: אִם נִשְׁמְרוּ
  choice: ikiwa ... wamejiepusha
  rationale: Nifali ya שׁמר hapa inaeleza kujilinda au kujizuia na jambo fulani; ‘wamejiepusha’ ni ya asili katika Kiswahili.
- source_word: הַנְּעָרִים
  choice: vijana
  rationale: Neno linaweza kumaanisha vijana au waandamani; ‘vijana’ hudumisha maana yake ya msingi bila kubainisha cheo kisichotajwa.
- source_word: אַךְ מֵאִשָּׁה
  choice: na wanawake
  rationale: אַךְ inaweka kikomo kwenye sharti, na umoja אִשָּׁה baada ya מן unaweza kueleweka kwa maana ya kijumla. Kiswahili cha asili kinaeleza kujiepusha na wanawake, huku tanbihi ikifafanua muktadha wa mahusiano ya kingono.
theological_decisions:
- issue: Sharti la usafi wa kiibada ili kupewa mkate mtakatifu
  choice: Sharti limeelezwa kama vijana kujiepusha na wanawake, bila kulipanua ndani ya matini.
  alternative: Kusema wazi ‘ikiwa vijana wamejiepusha na mahusiano ya kingono ili wawe safi kiibada.’
  rationale: Kiebrania kinataja kujiepusha na mwanamke/wanawake, na muktadha unaonyesha kujizuia kingono kwa usafi wa kiibada. Tafsiri kuu inadumisha usemi wa chanzo na tanbihi inaeleza maana bila kuingiza dai la jumla kuhusu wanawake au ngono.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Mkate wa kawaida’ na ‘mkate mtakatifu’ zinadumisha tofauti ya kiibada, na ‘ila upo’ ni usemi wa kawaida usio mzito.
