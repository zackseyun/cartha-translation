  text: וַ/יִּתֶּן ל֥/וֹ הַ/כֹּהֵ֖ן קֹ֑דֶשׁ כִּי֩ לֹא הָ֨יָה שָׁ֜ם לֶ֗חֶם כִּֽי אִם לֶ֤חֶם הַ/פָּנִים֙ הַ/מּֽוּסָרִים֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה לָ/שׂוּם֙ לֶ֣חֶם חֹ֔ם בְּ/י֖וֹם הִלָּקְחֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/007.yaml
  text: So the priest gave him holy bread[a], for there was no bread there except the bread of the Presence, which had been removed from before Yahweh, to put hot bread there on the day it was taken away.
translation:
  language: sw
  text: Basi kuhani akampa mkate mtakatifu[a], kwa maana hapakuwa na mkate mwingine pale isipokuwa mkate wa Uwepo, uliokuwa umeondolewa kutoka mbele za Yahwe ili kuweka mkate wa moto siku ulipoondolewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa istilahi ya jadi, “mikate ya wonyesho.” Kihalisi, “mkate wa Uwepo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֶשׁ
  choice: mkate mtakatifu
  rationale: Ingawa neno lenyewe lina maana ya kitu kitakatifu, muktadha unaonyesha wazi kuwa kinachotajwa ni mkate uliowekwa wakfu; kutaja “mkate” kunafanya Kiswahili kiwe wazi bila kuongeza wazo jipya.
- source_word: לֶחֶם הַפָּנִים
  choice: mkate wa Uwepo
  rationale: Hifadhi maana ya istilahi ya ibada ya Kiebrania kwa mkate uliowekwa mbele za Mungu. “Uwepo” ni wazi zaidi kwa msomaji wa sasa kuliko istilahi ya jadi “mikate ya wonyesho.”
- source_word: הַמּוּסָרִים
  choice: uliokuwa umeondolewa
  rationale: Kauli tendwa ya wakati uliopita inaonyesha mkate ambao tayari ulikuwa umeondolewa katika utaratibu wa kawaida wa kuubadilisha.
- source_word: מִלִּפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Hii inadumisha picha ya mahali na ibada katika usemi wa Kiebrania, bila kuubadili kuwa maelezo mapana zaidi kuhusu uwepo wa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetolewa kama jina binafsi kwa tahajia iliyozoeleka katika Kiswahili, badala ya kulibadilisha kuwa cheo “BWANA.”
- source_word: לָשׂוּם
  choice: ili kuweka
  rationale: Muundo huu unawakilisha kitenzi-jina cha kusudi moja kwa moja na kwa Kiswahili cha kawaida.
- source_word: לֶחֶם חֹם
  choice: mkate wa moto
  rationale: Kivumishi cha Kiebrania kinamaanisha kihalisi “moto.” Ingawa mkate huo bila shaka ulikuwa mpya, tafsiri haibadili maana hiyo kuwa “mkate mpya.”
- source_word: בְּיוֹם הִלָּקְחוֹ
  choice: siku ulipoondolewa
  rationale: Usemi huu wa wakati unabaki na maana ya siku ambayo mkate wa awali uliondolewa, huku kiwakilishi kikirejelea mkate uliotajwa.
- source_word: כִּי לֹא הָיָה שָׁם לֶחֶם כִּי אִם
  choice: kwa maana hapakuwa na mkate mwingine pale isipokuwa
  rationale: “Kwa maana” linaonyesha sababu, na “isipokuwa” linahifadhi nguvu ya upekee. “Mwingine” linaweka wazi kwa Kiswahili kuwa mkate mtakatifu ulikuwapo lakini hakukuwa na mkate wa aina nyingine.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la Mungu lenye herufi nne. “Yahwe” hulihifadhi kama jina binafsi kwa umbo la Kiswahili badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לֶחֶם הַפָּנִים katika mazingira ya ibada
  choice: mkate wa Uwepo
  alternative: mikate ya wonyesho
  rationale: Tafsiri iliyochaguliwa inadumisha uhusiano wa mkate huo na kuwekwa mbele za Yahwe, bila kuingiza ufafanuzi wa kimadhehebu kuhusu namna ya uwepo huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo umebaki karibu na mantiki ya Kiebrania. “Mkate wa moto” umehifadhiwa badala ya kufasiriwa kuwa “mkate mpya,” na usemi haujaongeza “mahali pake,” ambalo halisemwi wazi katika maandishi ya Kiebrania.
