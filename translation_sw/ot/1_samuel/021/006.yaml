base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/006.yaml
  text: David answered the priest and said to him[a], “Indeed, women have been kept from us as before, when I went out, and the young men’s vessels are holy, though it is an ordinary journey[d][c][b]. How much more today will it be made holy in the vessel.”
translation:
  language: sw
  text: Daudi akamjibu kuhani, akamwambia[a], “Kwa kweli, tumejiepusha na wanawake kama ilivyokuwa hapo awali nilipoondoka; na vyombo vya vijana ni vitakatifu[c], ingawa safari ni ya kawaida[b][d]. Na zaidi ya hayo, leo itakuwa takatifu katika chombo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwanamke amezuiwa kwetu,” yaani, “tumejiepusha na wanawake.” Usemi wa Kiebrania unahusu kujizuia kufanya ngono kwa ajili ya utayari wa kushughulika na vitu vitakatifu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kama jana, siku tatu zilizopita,” nahau ya Kiebrania inayorejelea siku zilizotangulia; wengine huielewa hasa kuwa “kwa karibu siku tatu.”
    reason: lexical_alternative
  - marker: c
    text: “Vyombo” vinaweza kumaanisha vifaa vya vijana; wengine huelewa neno hilo kuwa njia ya fumbo ya kutaja miili yao au wao wenyewe.
    reason: lexical_alternative
  - marker: d
    text: 'Kiebrania cha kishazi cha mwisho ni kigumu. Pia kinaweza kueleweka hivi: “Ingawa safari ni ya kawaida, leo kitakuwa kitakatifu kuhusiana na chombo au vifaa,” au kwa namna inayofanana na hiyo.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה עֲצֻרָה לָנוּ
  choice: tumejiepusha na wanawake
  rationale: Hueleza kujizuia kufanya ngono kwa ajili ya utayari wa kiibada. Kauli hii ni ya kawaida na wazi kwa Kiswahili, huku hali ya kutendwa ya Kiebrania ikielezwa katika tanbihi.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: kama ilivyokuwa hapo awali
  rationale: Nahau hii ya Kiebrania hurejelea siku zilizotangulia bila kulazimisha hesabu kamili ya siku tatu.
- source_word: בְּצֵאתִי
  choice: tangu nilipoondoka
  rationale: Huonyesha wakati wa kuondoka kwa Daudi kwenda katika safari au shughuli hiyo.
- source_word: כְלֵי הַנְּעָרִים
  choice: vyombo vya vijana
  rationale: Neno כְּלִי linaweza kumaanisha chombo, kifaa, au vifaa; huenda pia limetumiwa kwa maana ya fumbo kuhusu miili yao. 'Vyombo' huhifadhi utata huo.
- source_word: קֹדֶשׁ
  choice: vitakatifu
  rationale: Huhifadhi maana ya hali ya kuwekwa wakfu badala ya kuipunguza kuwa usafi wa kawaida tu.
- source_word: וְהוּא דֶּרֶךְ חֹל
  choice: ingawa safari hii ni ya kawaida
  rationale: חֹל hapa inatofautisha kilicho cha kawaida na kilicho kitakatifu, wala haimaanishi uovu wa kimaadili.
- source_word: וְאַף כִּי
  choice: Si zaidi sana kwamba
  rationale: Huwakilisha nguvu ya hoja ya kuongeza, 'how much more,' huku ikihifadhi ugumu wa sintaksia.
- source_word: הַיּוֹם יִקְדַּשׁ
  choice: leo vitatakaswa
  rationale: Huhifadhi namna ya kitenzi na uwezekano wa maana ya kutendwa au kujirejelea.
- source_word: בַּכֶּלִי
  choice: katika chombo
  rationale: Tafsiri ya karibu inayodumisha mwangwi wa כְלֵי na kutoamua kimya kimya ikiwa kinachorejelewa ni kifaa, mwili, au kitu kingine.
theological_decisions:
- issue: Lugha ya usafi wa kiibada inayohusiana na kujizuia na mkate mtakatifu
  choice: Kutafsiri kwa lugha ya utakatifu na kuwekwa wakfu kwa ibada
  alternative: Kuitafsiri hasa kama usafi wa kimaadili au usafi wa kawaida
  rationale: Muktadha unahusu kustahili kupokea mkate uliowekwa wakfu. Tafsiri inadumisha tofauti ya kibiblia kati ya kitakatifu na cha kawaida bila kuingiza mafundisho ya baadaye.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Maneno “vitakatifu,” “ya kawaida,” na “vitatakaswa” yanadumisha msamiati wa kiibada; tanbihi zinahifadhi utata wa nahau na wa neno “vyombo.”
