  yaml_path: translation/ot/1_samuel/021/016.yaml
  text: Do I lack madmen[a], that you have brought this one to act like a madman before me? Shall this one come into my house?
translation:
  language: sw
  text: Je, mimi ninakosa watu wazimu, hata mmemleta huyu atende kama mwendawazimu mbele yangu? Je, huyu ataingia nyumbani mwangu?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲסַר מְשֻׁגָּעִים
  choice: nina upungufu wa watu wenye wazimu
  rationale: Muundo huu wa swali la balagha unahifadhi kejeli kali ya Akishi na maana ya kuwa bila au kuhitaji watu wanaodhaniwa kuwa na wazimu.
- source_word: הֲבֵאתֶם אֶת זֶה
  choice: mmemleta huyu
  rationale: Kiwakilishi 'huyu' kinadumisha namna ya kumdharau Daudi iliyo katika kiashiria cha Kiebrania, huku Kiswahili kikibaki cha kawaida.
- source_word: לְהִשְׁתַּגֵּעַ
  choice: ajifanye mwendawazimu
  rationale: Hifili ya kujirejelea inaeleza kutenda kama mwenye wazimu; muktadha unaonyesha kwamba Daudi aliigiza hali hiyo kwa makusudi.
- source_word: עָלָי
  choice: mbele yangu
  rationale: Katika muktadha huu inaonyesha kitendo kinachofanywa katika uwepo wa mfalme, si lazima uhasama dhidi yake.
- source_word: יָבֹא אֶל־בֵּיתִי
  choice: ataingia nyumbani mwangu
  rationale: Kitenzi kinaonyesha mwendo wa kuingia ndani ya nyumba au kaya ya kifalme; 'ataingia' ni wazi na asilia katika Kiswahili.
