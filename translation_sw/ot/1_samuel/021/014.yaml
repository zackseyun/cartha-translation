base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/014.yaml
  text: So he changed his behavior before their eyes and acted like a madman in their hands[b][a]; he made marks on the doors of the gate and let his saliva run down onto his beard.
translation:
  language: sw
  text: Basi akabadilisha mwenendo wake mbele ya macho yao, akajifanya mwendawazimu[a] alipokuwa mikononi mwao. Akakwaruza-kwaruza milango ya lango[b], na kuacha mate yake yatiririke kwenye ndevu zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akatenda kama mwendawazimu.” Kitenzi cha Kiebrania kinaeleza kutenda kwa namna ya wazimu, na muktadha unaonyesha kwamba alifanya hivyo kwa makusudi.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania hapa ni kigumu; huenda pia kikatafsiriwa “akaweka alama” au “akaandikaandika” kwenye milango ya lango.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁנּוֹ אֶת טַעְמוֹ
  choice: akabadilisha mwenendo wake
  rationale: Kirai hiki kinaweza kuhusisha akili, utambuzi, au tabia inayoonekana; katika simulizi hili kinarejelea mabadiliko ya makusudi katika mwenendo wa Daudi bila kudai kwamba hali yake ya ndani ilibadilika.
- source_word: בְּעֵינֵיהֶם
  choice: mbele ya macho yao
  rationale: Huhifadhi taswira ya nahau ya Kiebrania huku ikieleweka kwa kawaida kuwa mbele yao au machoni pao.
- source_word: וַיִּתְהֹלֵל
  choice: akajifanya mwendawazimu
  rationale: Kitenzi kinaeleza kutenda kwa namna ya wazimu; muktadha mpana unaonyesha kwamba Daudi aliigiza hali hiyo kwa makusudi.
- source_word: בְּיָדָם
  choice: akiwa mikononi mwao
  rationale: Huhifadhi sitiari halisi ya Kiebrania, ambayo pia inaweza kumaanisha kuwa chini ya mamlaka au udhibiti wao.
- source_word: ויתו
  choice: akakwaruza-kwaruza
  rationale: Kitenzi hiki ni kigumu na usomaji wake hauna uhakika kamili. Katika muktadha kinaashiria kufanya alama, kukwaruza, au kucharaza juu ya milango; chaguo hili ni la kawaida na linaonyesha kitendo kisicho na mpangilio.
- source_word: דַּלְתוֹת הַשַּׁעַר
  choice: milango ya lango
  rationale: Ni tafsiri ya moja kwa moja ya vibao au milango inayofunga lango.
- source_word: וַיּוֹרֶד רִירוֹ אֶל זְקָנוֹ
  choice: kuacha mate yake yatiririke kwenye ndevu zake
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la kuyafanya mate yashuke hadi juu ya ndevu zake.
