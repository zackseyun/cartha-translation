base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/003.yaml
  text: David said to Ahimelech the priest[a], “The king has charged me with a matter and said to me[b], ‘Let no man know anything about the matter for which I am sending you and with which I have charged you.’ And I have directed the young men to a certain place.”
translation:
  language: sw
  text: Daudi akamwambia Ahimeleki kuhani, “Mfalme ameniagiza jambo fulani, akaniambia, ‘Mtu yeyote asijue chochote kuhusu jambo ambalo ninakutuma kwa ajili yake na ambalo nimekuagiza.’ Nami nimewaelekeza vijana waende mahali fulani.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina nahau yenye maana ya “mahali fulani na fulani,” yaani, mahali pasipotajwa au ambako utambulisho wake haujawekwa wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוַּנִי דָבָר
  choice: ameniagiza jambo fulani
  rationale: Kitenzi צוה kina maana ya kuamuru au kuagiza; pamoja na דָבָר hapa kinahusu jambo au shughuli aliyokabidhiwa Daudi. “Ameniagiza jambo fulani” ni Kiswahili cha kawaida kinachohifadhi uzito wa agizo la mfalme bila kulifanya kuwa cheo maalumu.
- source_word: אִישׁ אַל יֵדַע מְאוּמָה
  choice: Mtu yeyote asijue chochote
  rationale: Ingawa אִישׁ kwa umbo ni “mtu/mwanamume,” katika sentensi hasi hii hutumiwa kwa maana ya jumla, “mtu yeyote.” Kiswahili hiki ni cha asili na hakibadili upeo wa katazo.
- source_word: הַדָּבָר
  choice: jambo
  rationale: דָבָר hapa ni shughuli au ujumbe wa siri unaozungumziwa, si neno lililotamkwa tu. “Jambo” ni pana na la kawaida katika muktadha huu.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחֲךָ
  choice: ambalo ninakutuma kulifanya
  rationale: Kiebrania kina “ambalo ninakutuma” bila kutaja kitenzi cha utekelezaji. Kiswahili huhitaji uhusiano uwe wazi; “kulifanya” linaonyesha kuwa kutumwa kunahusu jambo hilo bila kuongeza maelezo ya aina ya kazi.
- source_word: וַאֲשֶׁר צִוִּיתִךָ
  choice: na ambalo nimekuagiza
  rationale: Tafsiri hii inadumisha marudio ya mzizi צוה na sauti ya agizo la kifalme. Kutokutaja tena “kulifanya” kunafuata ufupi wa chanzo.
- source_word: וְאֶת־הַנְּעָרִים
  choice: vijana
  rationale: נְעָרִים inaweza kumaanisha vijana, watumishi, au wasaidizi. “Vijana” ndiyo tafsiri ya moja kwa moja na inaacha wazi kama walikuwa watumishi au wafuasi.
- source_word: יוֹדַעְתִּי ... אֶל־מְקוֹם
  choice: nimewaelekeza ... waende mahali
  rationale: Hifili ya ידע kwa kawaida ni “kujــulisha,” lakini muundo wenye יעד ya mahali unaonyesha kupanga au kuwaelekeza vijana waende huko. “Nimewaelekeza ... waende” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: פְּלֹנִי אַלְמוֹנִי
  choice: mahali fulani
  rationale: Jozi hii ni nahau inayotaja mahali pasipobainishwa au pasipotakiwa kutajwa. “Mahali fulani” ni tafsiri fupi na ya asili; maana halisi zaidi imewekwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mazungumzo ya moja kwa moja yamehifadhiwa, marudio ya “kuagiza” yanaakisi chanzo, na utata wa נְעָרִים umeachwa katika neno “vijana.” Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
