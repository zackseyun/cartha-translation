  text: וְ/שָׁ֡ם אִישׁ֩ מֵ/עַבְדֵ֨י שָׁא֜וּל בַּ/יּ֣וֹם הַ/ה֗וּא נֶעְצָר֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/שְׁמ֖/וֹ דֹּאֵ֣ג הָ/אֲדֹמִ֑י אַבִּ֥יר הָ/רֹעִ֖ים אֲשֶׁ֥ר לְ/שָׁאֽוּל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/008.yaml
  text: A man of Saul’s servants was there that day[a], detained before Yahweh; his name was Doeg the Edomite, the chief of Saul’s shepherds.
translation:
  language: sw
  text: Siku hiyo, mmoja wa watumishi wa Sauli alikuwa huko, akiwa amezuiliwa mbele za Yahwe.[a] Jina lake lilikuwa Doegi, Mwedomu, mkuu wa wachungaji wa Sauli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akiwa ameshikiliwa mbele za Yahwe” au “akiwa amezuiwa kubaki mbele za Yahwe.” Kiebrania hakielezi kwa nini Doegi alizuiliwa.
    reason: Hutoa chaguo za kimsamiati za נֶעְצָר na hudumisha hali ya kuzuiliwa pamoja na utata kuhusu sababu yake.
lexical_decisions:
- source_word: וְשָׁם אִישׁ מֵעַבְדֵי שָׁאוּל בַּיּוֹם הַהוּא
  choice: Siku hiyo, mmoja wa watumishi wa Sauli alikuwa huko
  rationale: Muundo huu wa Kiswahili unaonyesha wazi kwamba mtu huyo alikuwa mmoja kati ya watumishi wa Sauli, huku ukihifadhi mahali na wakati unaotajwa katika Kiebrania.
- source_word: נֶעְצָר לִפְנֵי יְהוָה
  choice: akiwa amezuiliwa mbele za Yahwe
  rationale: Kitenzi cha Kiebrania kinaweza kumaanisha kuzuiliwa au kuwekwa huko bila kueleza sababu. “Amezuiliwa” huhifadhi kutokujulikana huko, na “mbele za Yahwe” hudumisha usemi wa uwepo wa Mungu.
- source_word: וּשְׁמוֹ דֹּאֵג הָאֲדֹמִי
  choice: Jina lake lilikuwa Doegi, Mwedomu
  rationale: Huu ni usemi wa kawaida na wa asili wa kumtambulisha mtu kwa jina na asili yake katika Kiswahili.
- source_word: אַבִּיר הָרֹעִים אֲשֶׁר לְשָׁאוּל
  choice: mkuu wa wachungaji wa Sauli
  rationale: Katika muktadha wa watumishi wa kifalme, אַבִּיר inaeleweka vizuri kama cheo au ukuu kuliko nguvu za mwili; kirai cha mwisho kinaonyesha kwamba wachungaji hao walikuwa wa Sauli.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: “Yahwe” linawasilisha jina binafsi la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- issue: Maana ya נֶעְצָר לִפְנֵי יְהוָה
  choice: akiwa amezuiliwa mbele za Yahwe
  alternative: akiwa ameshikiliwa mbele za Yahwe; akiwa amebaki mbele za Yahwe
  rationale: Andiko halielezi kwa nini Doegi alizuiliwa wala kama sababu ilikuwa ya kiibada; tafsiri haiongezi maelezo yasiyokuwamo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Doegi” na “Mwedomu” zimetumiwa kwa maumbo yanayosomeka kwa urahisi katika Kiswahili; sentensi imepangwa kwa mtiririko wa kawaida bila kuondoa taarifa yoyote ya msingi.
