  yaml_path: translation/ot/1_samuel/021/013.yaml
  text: David took these words to heart[a], and he was very much afraid of Achish king of Gath.
translation:
  language: sw
  text: Daudi akayatia maneno hayo moyoni[a], naye akamwogopa sana Akishi, mfalme wa Gathi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Daudi akayaweka mambo hayo moyoni.” Nahau ya Kiebrania ina maana kwamba aliyachukulia maneno hayo kwa uzito na kuyatafakari ndani yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... בִּלְבָבוֹ
  choice: akayatia ... moyoni
  rationale: Nahau hii ya Kiebrania inaeleza kuyaweka maneno ndani ya fikira na kuyachukulia kwa uzito. Kiswahili ‘kutia moyoni’ huhifadhi picha ya lugha ya chanzo na maana yake ya kutafakari kwa ndani.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: maneno hayo
  rationale: Ingawa דְּבָרִים inaweza kumaanisha maneno, mambo, au jambo, hapa inarejelea maneno yaliyosemwa na watumishi katika mstari uliotangulia.
- source_word: וַיִּרָא מְאֹד
  choice: akamwogopa sana
  rationale: Kitenzi cha kuogopa pamoja na מְאֹד kinaonyesha hofu kubwa; ‘sana’ huwasilisha msisitizo huo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: מִפְּנֵי אָכִישׁ
  choice: akamwogopa ... Akishi
  rationale: 'Katika muundo huu wa Kiebrania, מִפְּנֵי hutambulisha mtu anayeogopwa. Kiswahili huieleza kiasili kwa kitenzi chenye kiambishi cha yambwa: ‘akamwogopa Akishi.’'
- source_word: אָכִישׁ
  choice: Akishi
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: מֶלֶךְ גַּת
  choice: mfalme wa Gathi
  rationale: Muundo tegemezi wa Kiebrania umetafsiriwa moja kwa moja kwa ‘mfalme wa’; jina Gathi limetoholewa kwa matumizi ya Kiswahili.
