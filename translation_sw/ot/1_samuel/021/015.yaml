  text: And Achish said to his servants[a], “Look, you see a man acting like a madman. Why do you bring him to me?”
translation:
  language: sw
  text: Ndipo Akishi akawaambia watumishi wake, “Tazameni, mnamwona mtu akifanya kama mwendawazimu.[a] Kwa nini mnamleta kwangu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenye wazimu.” Neno la Kiebrania linaweza kueleza mtu mwenye wazimu au mtu anayefanya kana kwamba ana wazimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akawaambia
  rationale: Huwasilisha mfululizo wa simulizi wa waw-consecutive kwa Kiswahili cha kawaida; kiambishi cha yambwa kinawasilisha kwa kawaida usemi kwa watumishi wake.
- source_word: אָכִישׁ
  choice: Akishi
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: Katika mazingira ya kifalme neno hili humaanisha watu walio katika utumishi wa mfalme; ‘watumishi’ ni la moja kwa moja bila kuwalazimisha kuwa maofisa.
- source_word: הִנֵּה תִרְאוּ
  choice: Tazameni, mnamwona
  rationale: ‘Tazameni’ huvuta usikivu, huku ‘mnamwona’ ikihifadhi kitenzi cha nafsi ya pili wingi badala ya kukifuta.
- source_word: אִישׁ
  choice: mtu
  rationale: ‘Mtu’ ni tafsiri ya kawaida ya אִישׁ hapa na humrejelea mwanamume anayejulikana katika muktadha bila kuongeza neno lisilo la lazima.
- source_word: מִשְׁתַּגֵּעַ
  choice: anayejifanya mwendawazimu
  rationale: Muundo wa Hitpael na muktadha wa Daudi kujibadili tabia unaelekea kwenye kutenda kana kwamba ana wazimu; tanbihi inadumisha uwezekano wa kueleza hali ya wazimu yenyewe.
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Swali la sababu limetafsiriwa moja kwa moja.
- source_word: תָּבִיאוּ אֹתוֹ אֵלָי
  choice: mnamleta kwangu
  rationale: Wakati wa sasa wa Kiswahili unafaa karipio la moja kwa moja na unaakisi imperfect ya Kiebrania bila kulazimisha tofauti kati ya tendo lililokamilika na linalotazamwa sasa.
