translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mwendawazimu’ ni neno linaloeleweka na lenye staha zaidi kuliko misemo ya mazungumzo kama ‘kichaa’; alama ya tanbihi imewekwa mara tu baada ya kirai husika.
