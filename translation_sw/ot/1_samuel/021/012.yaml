base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/012.yaml
  text: And the servants of Achish said to him[a], “Is this not David, the king of the land? Is this not the one of whom they sang in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: sw
  text: 'Watumishi wa Akishi wakamwambia, “Je, huyu si Daudi, mfalme wa nchi? Je, si huyu ambaye waliimba kumhusu walipokuwa wakicheza ngoma[a], wakisema,


    ‘Sauli ameua maelfu yake,

    na Daudi makumi ya maelfu yake[b]’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waliimbiana katika ngoma,” yaani, waliimba kwa kuitikiana walipokuwa wakicheza.
    reason: lexical_alternative
  - marker: b
    text: “Makumi ya maelfu” pia yanaweza kuitwa “elfu kumi” au “myriad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: Watumishi
  rationale: Neno hili kwa upana humaanisha watumishi wa Akishi au watu wa nyumba na makao yake. ‘Watumishi’ ni tafsiri ya moja kwa moja isiyobana maana kuwa maofisa pekee.
- source_word: הֲלוֹא
  choice: Je, ... si
  rationale: Muundo huu wa swali la balagha unatarajia jibu la kukubali na kwa hiyo unahifadhi nguvu ya Kiebrania.
- source_word: מֶלֶךְ הָאָרֶץ
  choice: mfalme wa nchi
  rationale: Hii inafuata usemi wa Kiebrania bila kuamua kama watumishi walimwona Daudi kuwa mfalme halisi au walizungumza kwa kutia chumvi kuhusu umaarufu wake.
- source_word: לָזֶה
  choice: si huyu ambaye
  rationale: Hutambulisha Daudi kama mtu anayehusika katika wimbo unaofuata; muundo huu ni wa kawaida katika Kiswahili na hauongezi ufafanuzi usio katika chanzo.
- source_word: יַעֲנוּ
  choice: waliimbiana
  rationale: Katika muktadha wa muziki na dansi, kitenzi kinaweza kumaanisha kuimba kwa kuitikiana. ‘Waliimbiana’ huwasilisha tendo la kuimba na pia hudokeza mwitikio wa kupokezana.
- source_word: בַמְּחֹלוֹת
  choice: wakati wa kucheza ngoma
  rationale: Kirai kinarejelea shughuli za dansi katika sherehe. Usemi huu ni wa asili katika Kiswahili cha Afrika Mashariki na unaepuka kueleweka kana kwamba ‘ngoma’ ni ala pekee.
- source_word: הִכָּה
  choice: ameua
  rationale: Katika wimbo huu wa ushindi, kupiga kunamaanisha kuangamiza maadui vitani. ‘Ameua’ huwasilisha maana inayokusudiwa kwa uwazi na kwa lugha ya sasa.
- source_word: באלפו
  choice: maelfu yake
  rationale: Huhifadhi hesabu inayohusishwa na Sauli na ulinganifu wa kishairi wa wimbo.
- source_word: ברבבתו
  choice: makumi ya maelfu yake
  rationale: רבבה humaanisha elfu kumi au idadi kubwa ya aina hiyo. ‘Makumi ya maelfu’ ni ya kawaida katika Kiswahili na huhifadhi tofauti na ‘maelfu’ ya Sauli.
theological_decisions:
- issue: Kama ‘mfalme wa nchi’ ni cheo halisi au mtazamo wa watumishi wa Kifilisti
  choice: mfalme wa nchi
  alternative: kiongozi wa nchi au mfalme anayedhaniwa wa nchi
  rationale: Kiebrania kinaripoti maneno ya watumishi bila kufafanua kama walimaanisha kwamba Daudi alikuwa akitawala rasmi au kwamba alikuwa mtu mashuhuri zaidi katika Israeli. Tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa maswali ya balagha na mistari ya wimbo umehifadhiwa. Alama za tanbihi [a] na [b] zimewekwa karibu na maneno yanayohusika badala ya kufuata nafasi isiyolingana katika safu ya mashauriano ya Kiingereza.
