  text: Now then[a], what do you have on hand? Give me five loaves of bread[c][b], or whatever is available.
translation:
  language: sw
  text: Sasa basi, una nini mkononi mwako?[a] Nipe[b] mikate mitano, au chochote kinachopatikana.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kilicho chini ya mkono wako,” nahau ya Kiebrania inayomaanisha kitu kilicho tayari kutumiwa au kilicho katika milki ya mtu.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “nipe katika mkono wangu,” yaani, “nipe.”
    reason: lexical_alternative
  - marker: c
    text: Au, “au chochote kinachoweza kupatikana.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huonyesha mpito wa mazungumzo na ombi la haraka; kauli hii ni ya kawaida na huhifadhi maana ya ‘na sasa/basi sasa.’
- source_word: מַה יֵּשׁ תַּחַת יָדְךָ
  choice: una nini mkononi mwako?
  rationale: Nahau ya Kiebrania inauliza kile kilicho karibu na kinachoweza kutolewa. ‘Mkononi mwako’ ni nahau ya Kiswahili inayoeleweka kwa maana ya kitu alicho nacho au kilicho tayari kupatikana.
- source_word: חֲמִשָּׁה לֶחֶם
  choice: mikate mitano
  rationale: Ingawa ‘mkate’ umetumiwa kwa maana ya jumla katika Kiebrania, namba tano inaonyesha vipande au mikate inayohesabika; Kiswahili cha asili hutumia wingi ‘mikate mitano.’
- source_word: תְּנָה בְיָדִי
  choice: Nipe
  rationale: Maana halisi ni ‘toa/weke mkononi mwangu,’ lakini ‘nipe’ huwasilisha kwa kawaida na kwa usahihi uhamisho unaoombwa.
- source_word: אוֹ הַנִּמְצָא
  choice: au chochote kinachopatikana
  rationale: Kirai hiki kinaweza kumaanisha kile kinachopatikana au kinachoweza kupatikana. Tafsiri hii huhifadhi upana wa ombi bila kulifanya lihusu chakula pekee, jambo ambalo halijasemwa wazi katika mstari huu.
