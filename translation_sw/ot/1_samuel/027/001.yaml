base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/001.yaml
  text: Then David said in his heart[a], “Now I will one day perish by the hand of Saul. There is nothing better for me than that I should surely escape to the land of the Philistines. Then Saul will despair of seeking me any longer in all the territory of Israel[c][b], and I will escape from his hand.”
translation:
  language: sw
  text: Kisha Daudi akasema moyoni mwake[a], “Siku moja nitaangamia kwa mkono wa Sauli. Hakuna lililo bora kwangu kuliko hakika nikimbilie[b] nchi ya Wafilisti. Ndipo Sauli atakata tamaa ya kuendelea kunitafuta katika eneo lote la Israeli, nami nitamponyoka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Daudi akajisemea.” Kiebrania, neno kwa neno: “akasema kwa moyo wake.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinasisitiza kitendo hicho kwa kurudia mzizi wa kitenzi: “kuponyoka nitaponyoka,” yaani, “hakika nitaponyoka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל־לִבּוֹ
  choice: moyoni mwake
  rationale: Nahau ya Kiebrania inaonyesha kujisemea au kuwaza kwa ndani; ‘moyoni mwake’ huihifadhi kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: אֶסָּפֶה
  choice: nitaangamia
  rationale: Nifali ya ספה hapa humaanisha kuondolewa au kuangamia. ‘Nitaangamia’ ni ya asili katika Kiswahili na inafaa kwa tishio la kuuawa na Sauli, bila kulazimisha taswira isiyo wazi.
- source_word: יוֹם אֶחָד
  choice: siku moja
  rationale: Ni usemi wa wakati unaomaanisha ‘siku moja’ au ‘hatimaye’; tafsiri hii ni ya moja kwa moja na ya kawaida.
- source_word: בְּיַד שָׁאוּל
  choice: kwa mkono wa Sauli
  rationale: Inahifadhi taswira ya Kiebrania ya mkono kama chombo cha nguvu au utawala, na inaeleweka kwa Kiswahili.
- source_word: אֵין לִי טוֹב כִּי
  choice: Hakuna jambo lililo bora kwangu kuliko
  rationale: Muundo huu unaonyesha ulinganisho wa jambo lenye faida zaidi; tafsiri inahifadhi nguvu hiyo bila kuufanya kuwa amri au ulazima.
- source_word: הִמָּלֵט אִמָּלֵט
  choice: kukimbilia
  rationale: Kitenzi kisicho na kikomo pamoja na kitenzi kamili hutia mkazo wazo la kuponyoka. Katika muktadha huu, ‘kukimbilia nchi’ huwasilisha hatua yenyewe kwa Kiswahili cha asili; mkazo wa Kiebrania umeelezwa katika tanbihi [b].
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: nchi ya Wafilisti
  rationale: Ni tafsiri wazi na ya karibu ya eneo la Wafilisti.
- source_word: וְנוֹאַשׁ מִמֶּנִּי שָׁאוּל
  choice: Sauli atakata tamaa
  rationale: יאשׁ humaanisha kupoteza tumaini au kuacha jitihada; ‘atakata tamaa’ ni usemi wa kawaida na unaunganika vizuri na kutafuta kunakofuata.
- source_word: לְבַקְשֵׁנִי עוֹד
  choice: ya kuendelea kunitafuta
  rationale: עוֹד hapa inaonyesha mwendelezo wa utafutaji; ‘kuendelea kunitafuta’ huonyesha kwamba Sauli ataacha jitihada hizo.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: katika eneo lote la Israeli
  rationale: גְּבוּל katika muktadha huu ni eneo lote lenye mipaka, si mstari wa mpaka pekee.
- source_word: וְנִמְלַטְתִּי מִיָּדוֹ
  choice: nami nitaokoka kutoka mkononi mwake
  rationale: Inadumisha wazo la kuponyoka na taswira ya kuwa chini ya nguvu ya Sauli; ‘nitaokoka’ hapa ni kuponyoka hatarini, si tamko la kiufundi la kitheolojia.
