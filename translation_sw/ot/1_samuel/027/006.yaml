base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/006.yaml
  text: So Achish gave him Ziklag that day[b][a]. Therefore Ziklag has belonged to the kings of Judah to this day.
translation:
  language: sw
  text: Basi, siku hiyo Akishi akampa Daudi Siklagi. Kwa hiyo, Siklagi imekuwa mali ya wafalme wa Yuda hadi leo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֶּן
  choice: akampa
  rationale: Kitenzi נתן pamoja na kiambishi cha yambwa לּוֹ kinamaanisha kwa kawaida ‘akampa’; muundo huu ni wa asili na wazi katika Kiswahili.
- source_word: לּוֹ
  choice: Daudi
  rationale: Kiwakilishi cha nafsi ya tatu ya kiume kinamrejelea Daudi katika muktadha wa karibu. Kutaja jina lake huleta uwazi wa kawaida katika Kiswahili bila kubadili maana.
- source_word: אָכִישׁ
  choice: Akishi
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Huu ni usemi wa kawaida wa wakati, unaohifadhi umahususi wa siku inayotajwa.
- source_word: צִקְלָג
  choice: Siklagi
  rationale: Jina la mahali limetoholewa kwa tahajia inayofaa matamshi ya Kiswahili.
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Huonyesha matokeo yanayotokana na Akishi kumpa Daudi mji huo.
- source_word: הָיְתָה ... לְמַלְכֵי יְהוּדָה
  choice: umekuwa mali ya wafalme wa Yuda
  rationale: Muundo huu unaeleza hali ya umiliki iliyoanza wakati huo na kuendelea mpaka wakati wa msimulizi; Kiswahili hiki ni cha asili kuliko tafsiri sisisi ya ‘umekuwa kwa.’
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hadi leo
  rationale: Ni usemi wa kawaida unaoonyesha mwendelezo mpaka wakati wa msimulizi.
theological_decisions:
- issue: Mtazamo wa kihistoria katika ‘hadi leo’ na ‘wafalme wa Yuda’
  choice: Kuhifadhi maelezo ya msimulizi ya kutazama nyuma bila kuyafafanua zaidi.
  alternative: Kupanua maneno ili kueleza wazi kuwa ni mtazamo wa baadaye wa kifalme wa Yuda.
  rationale: Kiebrania chenyewe kinataja tu hali hiyo ya kihistoria; tafsiri haipaswi kuingiza nadharia ya uandishi au uhariri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. ‘Basi’ linaunganisha sentensi na simulizi lililotangulia, huku ‘Kwa hiyo’ likihifadhi uhusiano wa matokeo. Hakuna tanbihi inayohitajika, kwa kuwa tofauti ya ‘siku hiyo/on that day’ haileti tofauti halisi katika Kiswahili, na maana ya umiliki imeelezwa wazi katika matini.
