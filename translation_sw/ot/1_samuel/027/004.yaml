  language: sw
  text: Sauli alipoarifiwa kwamba Daudi alikuwa amekimbilia Gathi, hakuendelea tena kumtafuta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: alipoarifiwa
  rationale: Kauli tendwa hii inaonyesha kwamba habari ilifikishwa kwa Sauli bila kumtaja aliyeitoa; “alipoarifiwa” ni Kiswahili cha kawaida kinachohifadhi kutotajwa kwa mtendaji.
- source_word: לְשָׁאוּל
  choice: Sauli
  rationale: Sauli ndiye mpokeaji wa taarifa; katika muundo wa Kiswahili, uhusiano huo umejumuishwa kiasili katika kitenzi “alipoarifiwa.”
- source_word: כִּי
  choice: kwamba
  rationale: Hutambulisha yaliyomo katika taarifa.
- source_word: בָרַח
  choice: alikuwa amekimbilia
  rationale: Kitenzi kina maana ya kukimbia au kutoroka; wakati timilifu unaonyesha kwamba kukimbia kulitangulia kuarifiwa kwa Sauli.
- source_word: גַּת
  choice: Gathi
  rationale: Jina la mahali limetolewa kwa umbo lililozoeleka katika Kiswahili, huku kiambishi cha kuelekea kikiwa katika “amekimbilia.”
- source_word: וְלֹא יֹסֶף עוֹד
  choice: hakuendelea tena
  rationale: Muundo יסף pamoja na עוד unaonyesha kutorudia au kutokuendelea kufanya jambo; tafsiri hii inahifadhi kwa uwazi wazo la kukoma.
- source_word: לְבַקְשׁוֹ
  choice: kumtafuta
  rationale: בקש ina maana pana ya kutafuta. “Kumtafuta” inadumisha upana huo bila kuamua zaidi kwamba lilikuwa tendo la kumfuatilia au kumkamata.
