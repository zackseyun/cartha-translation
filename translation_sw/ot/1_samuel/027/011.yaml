base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/011.yaml
  text: David left alive neither man nor woman to bring to Gath[a], saying, “Otherwise they might report about us, saying, ‘This is what David did[b], and this was his practice all the days that he lived in the country of the Philistines.’”
translation:
  language: sw
  text: Daudi hakumwacha hai mwanamume wala mwanamke ili mtu yeyote asije akapelekwa Gathi, akisema, “Wasije wakatoa habari kutuhusu, wakisema, ‘Hivi ndivyo Daudi alivyofanya, na hii ndiyo ilikuwa desturi yake[b] muda wote alipokaa katika nchi ya Wafilisti[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “katika shamba/uwanja wa Wafilisti”; hapa ni nahau inayoweza kurejelea eneo au sehemu za mashambani za Wafilisti.'
    reason: cultural_note
  - marker: b
    text: Au “namna yake” au “mazoea yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ וְאִשָּׁה לֹא יְחַיֶּה
  choice: hakumwacha hai mwanamume wala mwanamke
  rationale: Jozi ya umoja katika Kiebrania ina maana ya kugawa kwa kila mtu mmoja mmoja. Kiswahili hiki kinahifadhi wazo kwamba Daudi hakumsaza mtu yeyote, mwanamume au mwanamke.
- source_word: לְהָבִיא גַת
  choice: ili ampeleke Gathi
  rationale: Kitenzi-jina kinaonyesha kusudi. Kwa kuwa waliotajwa wako katika umoja wa kugawa, ‘ampeleke’ ni Kiswahili cha kawaida na humweka Daudi kama mtendaji anayeeleweka katika muktadha.
- source_word: פֶּן יַגִּדוּ עָלֵינוּ
  choice: Wasije wakatoa habari kutuhusu
  rationale: פֶּן huonyesha jambo lisilotakiwa ambalo kitendo kilikusudiwa kulizuia; ‘wasije’ huwasilisha maana hiyo kwa kawaida. ‘Kutoa habari kutuhusu’ huhifadhi maana ya kuripoti habari zinazomhusu Daudi na watu wake bila kulazimisha wazo la shtaka rasmi.
- source_word: כֹּה עָשָׂה דָוִד
  choice: Hivi ndivyo Daudi alivyofanya
  rationale: Tafsiri hii huhifadhi nguvu ya kuonyesha ya כֹּה na ni ya asili katika Kiswahili cha kisasa.
- source_word: וְכֹה מִשְׁפָּטוֹ
  choice: na hii ndiyo ilikuwa desturi yake
  rationale: מִשְׁפָּט hapa inaelekea kumaanisha namna au desturi iliyozoeleka, si hukumu ya mahakama. ‘Desturi yake’ inafaa muktadha huku tanbihi ikitaja uwezekano mwingine wa kileksika.
- source_word: כָּל הַיָּמִים אֲשֶׁר יָשַׁב
  choice: muda wote alioishi
  rationale: Kirai hiki huonyesha kipindi chote cha kukaa kwa Daudi; ‘muda wote alioishi’ ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: katika nchi ya Wafilisti
  rationale: Ingawa שָׂדֶה kimsingi ni ‘uwanja’ au ‘uwanda,’ hapa kirai kinamaanisha eneo au nchi ya Wafilisti kwa upana.
