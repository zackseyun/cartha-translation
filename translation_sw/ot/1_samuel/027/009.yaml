source:
  edition: WLC
  text: וְ/הִכָּ֤ה דָוִד֙ אֶת הָ/אָ֔רֶץ וְ/לֹ֥א יְחַיֶּ֖ה אִ֣ישׁ וְ/אִשָּׁ֑ה וְ/לָקַח֩ צֹ֨אן וּ/בָקָ֜ר וַ/חֲמֹרִ֤ים וּ/גְמַלִּים֙ וּ/בְגָדִ֔ים וַ/יָּ֖שָׁב וַ/יָּבֹ֥א אֶל אָכִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/009.yaml
  text: David struck the land and left alive neither man nor woman[a], and he took sheep, cattle, donkeys, camels, and clothing. Then he returned and came to Achish.
translation:
  language: sw
  text: Daudi aliishambulia nchi hiyo, wala hakumwacha hai mwanamume au mwanamke yeyote[a]. Alichukua kondoo, ng’ombe, punda, ngamia na mavazi. Kisha akarudi, akaja kwa Akishi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakumruhusu mwanamume wala mwanamke kuishi.”
    reason: Njia nyingine ya kutafsiri Hifili ya חיה, yenye maana ya kumwacha mtu hai au kumruhusu aishi.
lexical_decisions:
- source_word: וְהִכָּה
  choice: aliishambulia
  rationale: Hifili ya נכה hapa inaeleza kuishambulia au kuipiga nchi iliyolengwa. “Aliishambulia” ni ya kawaida katika Kiswahili cha sasa na haiongezi maelezo yasiyokuwamo.
- source_word: הָאָרֶץ
  choice: nchi hiyo
  rationale: אֶרֶץ hapa ni eneo au nchi ya watu waliovamiwa, si dunia. Kiashiria “hiyo” kinaunganisha kwa kawaida na eneo lililotajwa katika muktadha.
- source_word: וְלֹא יְחַיֶּה אִישׁ וְאִשָּׁה
  choice: wala hakumwacha hai mwanamume au mwanamke yeyote
  rationale: Hifili ya חיה humaanisha kumwacha au kumweka mtu hai. Usemi huu unaonyesha kwamba Daudi hakusaza manusura, huku ukiendeleza jozi ya wazi ya mwanamume na mwanamke.
- source_word: וְלָקַח
  choice: Alichukua
  rationale: לקח kwa msingi ni “kuchukua.” Katika muktadha huu wa uvamizi inahusu nyara, lakini tafsiri haiongezi namna ya kuchukuliwa ambayo Kiebrania hakuitaji wazi.
- source_word: צֹאן
  choice: kondoo
  rationale: צֹאן inaweza kumaanisha mifugo midogo kwa ujumla, lakini “kondoo” ni tafsiri halisi na inayoeleweka katika orodha hii.
- source_word: בָקָר
  choice: ng’ombe
  rationale: בָקָר ni mifugo ya jamii ya ng’ombe; “ng’ombe” ni neno la kawaida la Kiswahili.
- source_word: חֲמֹרִים
  choice: punda
  rationale: Hii ndiyo tafsiri ya kawaida na ya sasa ya חמור katika wingi wa kimuktadha.
- source_word: גְמַלִּים
  choice: ngamia
  rationale: Ni kisawe cha moja kwa moja na cha kawaida.
- source_word: בְגָדִים
  choice: mavazi
  rationale: בגדים humaanisha nguo au mavazi. “Mavazi” lina hadhi inayofaa simulizi la Biblia na linaeleweka kwa urahisi.
- source_word: וַיָּשָׁב וַיָּבֹא
  choice: Kisha akarudi na kwenda
  rationale: 'Maneno yote mawili ya mfuatano yamehifadhiwa: alirudi kutoka uvamizi kisha akaenda kwa Akishi. “Kisha” huonyesha mwendelezo wa simulizi kwa Kiswahili cha kawaida.'
- source_word: אָכִישׁ
  choice: Akishi
  rationale: Jina limenukuliwa kwa tahajia inayolingana na mfumo wa sauti wa Kiswahili.
theological_decisions:
- issue: Kueleza tendo la vurugu bila kulainisha wala kuliongezea ukali
  choice: Aya inaeleza wazi kwamba Daudi aliishambulia nchi na hakumwacha hai mwanamume au mwanamke yeyote.
  alternative: Kutumia maneno laini yanayoficha mauaji, au kuongeza lugha ya kusisimua inayozidi maelezo ya Kiebrania.
  rationale: Simulizi linaeleza tendo gumu kimaadili. Tafsiri haipaswi kulisitiri wala kulitia chumvi, bali ihifadhi ukali na mipaka ya maneno ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo umeepuka lugha ya kizamani na umehifadhi uwazi wa simulizi pamoja na orodha ya nyara.
