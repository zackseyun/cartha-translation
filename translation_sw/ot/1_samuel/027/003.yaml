base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/003.yaml
  text: So David stayed with Achish in Gath[a], he and his men, each man with his household—David with his two wives, Ahinoam the Jezreelite and Abigail[b], the wife of Nabal the Carmelite.
translation:
  language: sw
  text: Basi Daudi akakaa pamoja na Akishi huko Gathi[a], yeye na watu wake, kila mtu pamoja na watu wa nyumbani mwake[b]—Daudi na wake zake wawili, Ahinoamu wa Yezreeli na Abigaili, mke wa Nabali, Mkarmeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaishi pamoja na Akishi huko Gathi.” Kitenzi cha Kiebrania kinaweza kumaanisha kuishi mahali au kubaki huko kwa muda.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “kila mtu na nyumba yake”; hapa “nyumba” humaanisha watu wa nyumbani mwake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: akakaa
  rationale: Kitenzi hiki kinaweza kumaanisha kukaa, kuishi, au kubaki mahali. “Akakaa” ni cha kawaida katika Kiswahili na hakidokezi bila sababu kwamba makao hayo yalikuwa ya kudumu.
- source_word: עִם אָכִישׁ בְּגַת
  choice: pamoja na Akishi huko Gathi
  rationale: “Pamoja na” huonyesha ushirika na Akishi, na “huko Gathi” huonyesha mahali walipokaa kwa Kiswahili cha kawaida.
- source_word: הוּא וַאֲנָשָׁיו
  choice: yeye na watu wake
  rationale: Tafsiri hii huhifadhi usemi mpana wa Kiebrania. Katika muktadha hawa ni wafuasi wa Daudi wenye uwezo wa kupigana, lakini “watu wake” haiongezi ufafanuzi usiotajwa wazi.
- source_word: אִישׁ וּבֵיתוֹ
  choice: kila mtu pamoja na watu wa nyumbani mwake
  rationale: אִישׁ imetumiwa kwa maana ya mgawanyo, yaani kila mmoja; בֵּיתוֹ hapa ni watu wa nyumba yake, si jengo lenyewe.
- source_word: וּשְׁתֵּי נָשָׁיו
  choice: akiwa pamoja na wake zake wawili
  rationale: Kirai hiki kinafafanua watu wa nyumbani mwa Daudi mwenyewe. Muundo huu unaunganisha maelezo hayo kwa uwazi na sentensi iliyotangulia.
- source_word: הַיִּזְרְעֵאלִית
  choice: wa Yezreeli
  rationale: Jina hili la kike humtambulisha Ahinoamu kwa mahali alikotoka. “Wa Yezreeli” ni la asili na lenye heshima katika Kiswahili.
- source_word: אֵשֶׁת נָבָל הַכַּרְמְלִית
  choice: mke wa Nabali wa Karmeli
  rationale: Muundo wa Kiebrania humtaja Abigaili kuwa mke wa Nabali na humhusianisha Nabali na Karmeli. “Wa Karmeli” huepuka mkanganyiko unaoweza kutokana na kutumia jina la dhehebu la baadaye.
