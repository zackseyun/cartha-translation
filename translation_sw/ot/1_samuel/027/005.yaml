base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/005.yaml
  text: Then David said to Achish[a], “If I have now found favor in your eyes, let them give me a place in one of the towns in the countryside, so that I may live there[c][b]. For why should your servant live with you in the royal city?”
translation:
  language: sw
  text: Kisha Daudi akamwambia Akishi, “Ikiwa sasa nimepata kibali machoni pako, basi wanipatie mahali katika mojawapo ya miji ya mashambani[a], nami nikae huko[b]. Kwa nini mtumishi wako akae pamoja nawe katika mji wa kifalme[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno, “katika mojawapo ya miji ya shamba,” yaani, miji iliyo mashambani, tofauti na mji wa kifalme.
    reason: lexical_alternative
  - marker: b
    text: Au “nami nitaishi huko.”
    reason: lexical_alternative
  - marker: c
    text: Kwa neno, “mji wa ufalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: nimepata kibali machoni pako
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kupata kukubaliwa au kupendelewa. “Kibali” ni neno la kawaida na lenye heshima, huku “machoni pako” kikihifadhi taswira ya chanzo.
- source_word: נָא
  choice: sasa
  rationale: Chembe hii hulainisha ombi. “Sasa” inadumisha namna ya ombi la heshima katika kishazi cha masharti bila kuongeza neno jingine la kusihi.
- source_word: יִתְּנוּ לִי
  choice: basi na wanipe
  rationale: Kitenzi kiko katika nafsi ya tatu wingi na kina nguvu ya ombi la heshima. “Na wanipe” kinahifadhi wingi usiotaja watendaji, yaani watu walio chini ya mamlaka ya Akishi.
- source_word: מָקוֹם
  choice: mahali
  rationale: Neno hili ni la jumla kwa eneo au sehemu, na “mahali” ni tafsiri ya kawaida na ya moja kwa moja katika muktadha.
- source_word: בְּאַחַת עָרֵי הַשָּׂדֶה
  choice: katika mojawapo ya miji ya mashambani
  rationale: Tafsiri ya karibu ni “katika mmoja wa miji ya shamba/nchi ya wazi.” “Miji ya mashambani” inaonyesha wazi utofauti na mji wa kifalme bila kuwa tafsiri ngumu.
- source_word: וְאֵשְׁבָה שָּׁם
  choice: nami nikae huko
  rationale: ישב hapa humaanisha kukaa au kuishi mahali. Muundo huu huhifadhi uratibu wa Kiebrania na pia unaeleza kusudi la kupewa mahali.
- source_word: לָמָּה יֵשֵׁב
  choice: Kwa nini ... akae
  rationale: Swali la balagha linatoa sababu ya ombi la Daudi. “Akae” ni la asili katika Kiswahili na linaweza kumaanisha kuishi au kukaa mahali.
- source_word: עַבְדְּךָ
  choice: mtumishi wako
  rationale: Hapa Daudi anajitaja kwa heshima mbele ya mfalme, si kusisitiza hali ya utumwa; kwa hiyo “mtumishi wako” linafaa kwa sajili ya hotuba ya ikulu.
- source_word: בְּעִיר הַמַּמְלָכָה
  choice: katika mji wa kifalme
  rationale: Kwa neno ni “mji wa ufalme.” “Mji wa kifalme” ni usemi wa asili unaodokeza makao ya mfalme bila kuongeza kwa uhakika kwamba ulikuwa mji mkuu.
- source_word: עִמָּךְ
  choice: pamoja nawe
  rationale: Huhifadhi maana ya ukaribu wa kukaa na Akishi inayopatikana katika kihusishi cha Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Usemi wa Daudi umehifadhi sajili yake ya unyenyekevu mbele ya mfalme, na wingi usiotaja watendaji katika “na wanipe” haujageuzwa kuwa kauli tendwa.
