translation:
  language: sw
  text: Basi Daudi akaondoka, akavuka kwenda kwa Akishi mwana wa Maoki, mfalme wa Gathi, yeye na watu mia sita waliokuwa naye.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: akaondoka
  rationale: Kitenzi קום katika mfululizo huu wa masimulizi kinaanzisha tendo la uamuzi. ‘Akaondoka’ ni Kiswahili cha kawaida kinachodumisha wazo la kuanza safari bila kukifanya kiwe tu ‘alisafiri.’
- source_word: וַיַּעֲבֹר
  choice: akavuka
  rationale: עבר humaanisha kuvuka au kupita kwenda upande mwingine. ‘Akavuka’ huhifadhi nguvu ya kimwelekeo ya kuhama kwenda eneo la Wafilisti.
- source_word: הוּא וְשֵׁשׁ מֵאוֹת אִישׁ
  choice: pamoja na wale watu mia sita
  rationale: Kiswahili huonyesha kwa kawaida muundo wa Daudi na kundi lake kwa ‘pamoja na.’ ‘Wale’ linaonyesha kuwa ni kundi linalojulikana tayari katika simulizi.
- source_word: אֲשֶׁר עִמּוֹ
  choice: waliokuwa pamoja naye
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kishazi kinacholitambulisha kundi lililokuwa na Daudi.
- source_word: אֶל אָכִישׁ
  choice: wakaenda kwa Akishi
  rationale: אֶל huonyesha mwendo unaomwelekea mtu. Kitenzi cha wingi ‘wakaenda’ kinakamilisha kwa Kiswahili cha kawaida mwendo wa Daudi na watu wake hadi kwa Akishi, bila kubadili lengo la kirai.
- source_word: בֶּן מָעוֹךְ
  choice: mwana wa Maoki
  rationale: Muundo huu huhifadhi uhusiano wa kifamilia wa jina la baba kwa mtindo wa kawaida wa Kiswahili.
- source_word: מֶלֶךְ גַּת
  choice: mfalme wa Gathi
  rationale: Huhifadhi moja kwa moja cheo cha kifalme cha Akishi na mahali alipotawala.
