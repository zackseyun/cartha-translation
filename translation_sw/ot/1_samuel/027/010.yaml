base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/010.yaml
  text: Then Achish said[a], “Where have you made a raid today?” And David said, “Against the Negev of Judah, against the Negev of the Jerahmeelites[b], and against the Negev of the Kenites.”
translation:
  language: sw
  text: Ndipo Akishi akasema[a], “Leo mmevamia wapi?” Daudi akasema, “Dhidi ya Negebu ya Yuda, dhidi ya Negebu ya Wayerahmeeli[b], na dhidi ya Negebu ya Wakeni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya moja kwa moja, maandishi ya Kiebrania yanasema kitu kama, “Je, leo hamkuvamia?” Lakini katika muktadha maana yake ni swali, “Leo mmevamia wapi?”
    reason: textual_variant
  - marker: b
    text: Au, “kusini mwa Yuda ... kusini mwa Wayerahmeeli ... kusini mwa Wakeni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל פְּשַׁטְתֶּם הַיּוֹם
  choice: Leo mmevamia wapi?
  rationale: Ingawa maandishi ya konsonanti yana אַל, ambalo kwa kawaida humaanisha ‘si,’ muktadha na ushahidi wa tafsiri za kale unaonyesha swali kuhusu mahali palipovamiwa. ‘Mmevamia’ ni Kiswahili cha kawaida kinachohifadhi maana ya uvamizi wa kijeshi ya פּשט.
- source_word: נֶגֶב
  choice: Negebu
  rationale: Neno linaweza kumaanisha kusini au eneo maalumu kame la Negebu. Kurudiwa kwake pamoja na majina ya maeneo au makundi kunapendelea jina la kijiografia, huku tanbihi ikihifadhi maana mbadala.
- source_word: עַל
  choice: dhidi ya
  rationale: Katika taarifa ya Daudi kuhusu malengo ya uvamizi, ‘dhidi ya’ huonyesha tendo la uadui kuliko mwelekeo tu.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la kabila na eneo hilo.
- source_word: הַיַּרְחְמְאֵלִי
  choice: Wayerahmeeli
  rationale: Umbo hili la Kiebrania ni jina la watu au ukoo; ‘Wayerahmeeli’ linawasilisha maana hiyo kwa muundo wa kawaida wa majina ya watu katika Kiswahili.
- source_word: הַקֵּינִי
  choice: Wakeni
  rationale: Umbo la Kiebrania linataja watu wa Keni; ‘Wakeni’ ni jina la watu linaloeleweka kwa Kiswahili.
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Huhifadhi kitenzi cha kawaida cha Kiebrania ‘alisema,’ ingawa usemi wa Akishi ni swali na wa Daudi ni jibu.
