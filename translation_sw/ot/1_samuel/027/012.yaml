base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/012.yaml
  text: And Achish trusted David[a], saying, “He has surely made himself stink among his people in Israel[b], so he will be my servant forever.”
translation:
  language: sw
  text: Akishi akamwamini Daudi, akisema, “Hakika amejifanya kuwa mwenye kuchukiza sana[a] kwa watu wake Waisraeli, kwa hiyo atakuwa mtumishi[b] wangu milele.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “amejifanya anuke vibaya sana.” Hii ni nahau inayomaanisha kuwa amejifanya kuwa mwenye kuchukiza sana au mwenye kuchukiwa na watu wake.
    reason: lexical_alternative
  - marker: b
    text: Au, “mtumwa wangu.” Neno la Kiebrania linaweza kumaanisha mtumishi au mtumwa; hapa muktadha unaelekea kusisitiza utumishi wa kudumu na utegemezi kwa Akishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן ... בְּדָוִד
  choice: Akishi akamtumaini Daudi
  rationale: Hifili ya אמן pamoja na בְּ inaonyesha kuweka imani au tumaini kwa mtu. ‘Akamtumaini’ huwasilisha uaminifu wa kibinafsi kuliko ‘akamwamini,’ ambalo pia lingeweza kumaanisha tu kukubali maneno yake kuwa kweli.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hii ni infinitivi ya kawaida ya kutambulisha maneno au fikira zinazofuata. ‘Akisema’ huhifadhi muundo huo bila kuamua kimya kimya kama Akishi alisema kwa sauti au alijiambia moyoni.
- source_word: הַבְאֵשׁ הִבְאִישׁ
  choice: Hakika amejifanya kuwa chukizo kabisa
  rationale: Infinitivi kamili pamoja na kitenzi kilichonyambuliwa inatilia mkazo באש. Kiebrania hutumia picha ya ‘kunuka’ kama nahau ya kuwa mwenye kuchukiza; tafsiri hii ya Kiswahili ni ya asili na inahifadhi nguvu ya usemi, huku tanbihi ikionyesha picha halisi.
- source_word: בְּעַמּוֹ בְיִשְׂרָאֵל
  choice: kwa watu wake katika Israeli
  rationale: ‘Kwa watu wake’ huonyesha jinsi watu wake walivyodhaniwa kumwona, na ‘katika Israeli’ huhifadhi sifa ya kitaifa au kijiografia ya kundi hilo.
- source_word: וְהָיָה לִי
  choice: kwa hiyo atakuwa wangu
  rationale: Waw hapa linaonyesha matokeo ambayo Akishi aliyatarajia. ‘Kwa hiyo’ huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: לְעֶבֶד
  choice: mtumishi
  rationale: עֶבֶד linaweza kumaanisha mtumishi au mtumwa. Katika muktadha huu Akishi anatarajia utegemezi na utumishi wa kudumu wa Daudi; ‘mtumishi’ linafaa zaidi bila kufuta uwezekano mwingine, ambao umeonyeshwa katika tanbihi.
- source_word: עוֹלָם
  choice: milele
  rationale: עוֹלָם hapa linaonyesha wakati ujao unaodhaniwa kudumu bila mwisho unaotazamiwa. ‘Milele’ ni sawa la kawaida na lenye nguvu katika Kiswahili.
theological_decisions:
- issue: Hadhi inayodokezwa na עֶבֶד
  choice: mtumishi
  alternative: mtumwa
  rationale: Muktadha unasisitiza utumishi wa kisiasa au wa kiapo kwa Akishi kuliko umiliki wa Daudi kama mali. Hata hivyo, kwa kuwa neno la Kiebrania linaweza kuwa na maana pana zaidi, uwezekano wa ‘mtumwa’ umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kuwa chukizo kabisa’ kimetumiwa badala ya picha ngumu ya ‘kunuka’ katika matini kuu; picha ya asili imehifadhiwa katika tanbihi. Alama zote za tanbihi zimewekwa mara baada ya maneno yanayofafanuliwa.
