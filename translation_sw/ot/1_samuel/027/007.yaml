  text: The number of days that David lived in the territory of the Philistines was a year and four months[a].
translation:
  language: sw
  text: Hesabu ya siku ambazo Daudi aliishi katika nchi ya Wafilisti ilikuwa mwaka mmoja na miezi minne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa tafsiri ya neno kwa neno, ni “siku na miezi minne”; hapa “siku” ni msemo unaomaanisha “mwaka mmoja” katika usemi wa muda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ilikuwa
  rationale: Katika muhtasari huu wa muda, kitenzi hiki kinaelezwa kwa kawaida kwa kishirikishi cha wakati uliopita, bila kufanya fomula ya simulizi ya Kiebrania iwe nzito.
- source_word: מִסְפַּר הַיָּמִים
  choice: Hesabu ya siku
  rationale: Tafsiri hii inahifadhi kwa uwazi muundo wa Kiebrania, ingawa Kiswahili kingeweza kusema kwa ulaini zaidi ‘muda’.
- source_word: אֲשֶׁר יָשַׁב
  choice: ambazo Daudi aliishi
  rationale: ישב hapa humaanisha kukaa kama mkazi kwa muda, si kitendo halisi cha kuketi; ‘aliishi’ ni ya kawaida na inafaa muda mrefu unaotajwa.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: katika nchi ya Wafilisti
  rationale: שׂדה hapa haimaanishi shamba moja, bali eneo au nchi inayokaliwa na Wafilisti. ‘Nchi ya Wafilisti’ ni wazi na ya kawaida kwa wasomaji wa Kiswahili.
- source_word: יָמִים וְאַרְבָּעָה חֳדָשִׁים
  choice: mwaka mmoja na miezi minne
  rationale: Katika fomula za muda za Kiebrania, יָמִים inaweza kutumiwa kwa maana ya mwaka mmoja; tafsiri ya maana hiyo huepuka usemi usioeleweka wa ‘siku na miezi minne’.
