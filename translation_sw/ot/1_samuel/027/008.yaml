base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/008.yaml
  text: Then David and his men went up and made raids against the Geshurites[a], the Girzites, and the Amalekites, for these were the inhabitants of the land from ancient times, as you go to Shur[b], even to the land of Egypt.
translation:
  language: sw
  text: Kisha Daudi na watu wake wakapanda na kuvamia Wageshuri, Wagirzi[a], na Waamaleki. Watu hao ndio waliokuwa wenyeji wa nchi hiyo tangu zamani, unapoelekea Shuri[b], hadi nchi ya Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wagezri.” Jina hili la watu lina utata katika mapokeo ya maandishi na tafsiri; hapa “Wagirzi” hufuata konsonanti za maandishi ya Kiebrania yaliyotolewa.
    reason: lexical_alternative
  - marker: b
    text: Au, “mpaka nchi ya Misri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: wakapanda
  rationale: Kitenzi עלה kwa kawaida humaanisha ‘kupanda’ katika masimulizi. Tafsiri hii inadumisha picha ya mwendo ya Kiebrania badala ya kuibadili kuwa ‘wakatoka.’
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: na kufanya mashambulizi dhidi ya
  rationale: Katika muktadha wa kijeshi פשט hueleza mashambulizi ya kuvamia au kupora; ‘kufanya mashambulizi dhidi ya’ huwasilisha maana ya uvamizi kwa Kiswahili cha kawaida bila kuifanya iwe tu ‘kwenda kwa.’
- source_word: הַגְּשׁוּרִי
  choice: Wageshuri
  rationale: Jina la kundi la watu limetoholewa kwa mfumo wa kawaida wa Kiswahili wa majina ya mataifa au makabila.
- source_word: הגרזי
  choice: Wagirzi
  rationale: Utohozi huu unafuata kwa karibu konsonanti za maandishi yaliyotolewa (גרזי), huku tanbihi ikitaja uwezekano mwingine wa kimapokeo.
- source_word: הָעֲמָלֵקִי
  choice: Waamaleki
  rationale: Hili ni umbo la kawaida la Kiswahili kwa watu wa Amaleki.
- source_word: כִּי הֵנָּה יֹשְׁבוֹת הָאָרֶץ
  choice: Watu hao ndio waliokuwa wenyeji wa nchi hiyo
  rationale: Viambishi vya kike vya wingi vinaelekea kurejelea makundi ya watu yanayoeleweka; Kiswahili kinahitaji kurejelea huku kuwe wazi na kwa kawaida.
- source_word: מֵעוֹלָם
  choice: tangu zamani
  rationale: Hapa עוֹלָם hueleza muda mrefu uliopita, si umilele wa kifalsafa.
- source_word: בּוֹאֲךָ שׁוּרָה
  choice: unapoelekea Shuri
  rationale: Hii ni nahau ya kijiografia yenye maana ya ‘unapokwenda kuelekea Shuri’; nafsi ya pili imehifadhiwa kama ilivyo katika Kiebrania.
- source_word: וְעַד אֶרֶץ מִצְרָיִם
  choice: hadi nchi ya Misri
  rationale: Kirai hiki kinaonyesha mpaka au upeo wa eneo hilo kwa Kiswahili cha asili.
theological_decisions: []
