reference: 1 Samuel 24:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/כִֽי יִמְצָ֥א אִישׁ֙ אֶת אֹ֣יְב֔/וֹ וְ/שִׁלְּח֖/וֹ בְּ/דֶ֣רֶךְ טוֹבָ֑ה וַֽ/יהוָה֙ יְשַׁלֶּמְ/ךָ֣ טוֹבָ֔ה תַּ֚חַת הַ/יּ֣וֹם הַ/זֶּ֔ה אֲשֶׁ֥ר עָשִׂ֖יתָה לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/020.yaml
  text: For when a man finds his enemy and lets him go on his way safely[b][a], may Yahweh repay you with good for what you have done to me this day.
translation:
  language: sw
  text: Kwa maana mtu akimkuta adui yake, je, humwacha aende zake salama?[a] Yahweh akulipe mema[b] kwa yale uliyonitendea leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “humwacha aende kwa amani.” Kiebrania kihalisi ni “katika njia njema.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Yahweh atakulipa mema.” Umbo la Kiebrania linaweza kueleweka kama ombi au baraka, au kama taarifa ya jambo litakalotokea.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי
  choice: Kwa maana ... je
  rationale: Katika muktadha huu kishazi kinaendeleza hoja ya Sauli kwa swali la balagha; muundo huu ni wa kawaida katika Kiswahili na unahifadhi nguvu ya kauli ya jumla.
- source_word: יִמְצָא אִישׁ
  choice: mtu akimkuta
  rationale: אִישׁ hapa ina maana ya jumla; 'mtu' ni tafsiri ya asili na wazi katika Kiswahili bila kubadili rejeo lake.
- source_word: אֶת אֹיְבוֹ
  choice: adui yake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino yenye kiambishi cha nafsi ya tatu umoja.
- source_word: וְשִׁלְּחוֹ
  choice: humwacha aende zake
  rationale: Katika muktadha wa Daudi kuwa na uwezo wa kumdhuru Sauli lakini akamwachilia, usemi huu unaeleza kwa kawaida kumruhusu aondoke.
- source_word: בְּדֶרֶךְ טוֹבָה
  choice: salama
  rationale: Kiebrania halisi ni 'katika/njia njema,' lakini hapa ni nahau inayoonyesha kwamba adui anaachwa aende bila kudhuriwa; tanbihi inalinda picha halisi ya chanzo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika Tetragramatoni limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: יְשַׁלֶּמְךָ
  choice: akulipe
  rationale: Yiqtol inaweza kueleweka kama ombi/baraka au utabiri. Matini kuu inatumia ombi la nafsi ya tatu, linalofaa katika hotuba ya Sauli, huku tanbihi ikihifadhi uwezekano wa utabiri.
- source_word: טוֹבָה
  choice: mema
  rationale: Inahifadhi wazo la malipo yenye manufaa na uhusiano wa kileksia na 'njia njema' katika chanzo.
- source_word: תַּחַת הַיּוֹם הַזֶּה אֲשֶׁר עָשִׂיתָה לִי
  choice: kwa yale uliyonitendea leo
  rationale: Huu ni uwasilishaji wa kawaida wa Kiswahili wa wazo la malipo kwa tendo la Daudi siku hiyo, huku 'uliyonitendea' ikihifadhi Sauli kama mnufaika wa kujizuia kwa Daudi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu; 'Yahweh' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya יְשַׁלֶּמְךָ
  choice: Yahweh akulipe mema
  alternative: Yahweh atakulipa mema
  rationale: Umbo la Kiebrania linaweza kusikika kama baraka/takwa au taarifa ya wakati ujao. Matini kuu inachagua baraka inayofaa hotuba hii, na tanbihi inaonyesha usomaji mwingine.
- issue: Nguvu ya kauli ya וְכִי ... וְשִׁלְּחוֹ
  choice: swali la balagha
  alternative: 'taarifa: ''mtu akimkuta adui yake, humwacha aende...'''
  rationale: Muktadha na mtiririko wa Kiebrania vinaunga mkono swali lenye jibu linalotarajiwa kuwa hapana, lakini Kiebrania hakina alama za kuuliza; tafsiri inaonyesha nguvu ya balagha bila kuondoa maana ya jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. 'Aende zake salama' ni nahau ya kawaida inayoeleza kuachiliwa bila kudhuriwa; tanbihi inahifadhi usemi halisi wa Kiebrania. Alama za tanbihi zimewekwa mara tu baada ya vipashio vinavyohusika.
