review_pass:
  verdict: revise
  source_fidelity: The opening "Nawe, baba yangu" incorrectly makes the conjunction attach to a second-person pronoun; וְאָבִי is "Na, baba yangu" (or simply "Baba yangu"), with "baba yangu" as David's deferential address to Saul. The remainder conveys the physical garment evidence, David's denial of wrongdoing, and Saul's pursuit of David's life well. "Uasi" is a contextually viable rendering of פשע, while the note preserves its broader range.
  naturalness: The revised wording uses natural Standard East African Swahili. "Tazama—naam, tazama" retains the solemn emphatic repetition without adding a second-person subject at the opening. "Sijakukosea" is more idiomatic than "sijakutendea dhambi" while accurately expressing offense/sin against Saul.
  terminology: '"Joho," "uovu," "uasi," "maisha yangu," and "mkononi mwangu" are suitable. The garment term "upindo" is retained with alternatives in the footnote, since the Hebrew refers broadly to an extremity/edge or corner of the robe. The explanatory claim in footnote c is unnecessary because the text itself is clear; the note is revised to give the literal wording only.'
  issues:
  - severity: medium
    issue: '"Nawe" introduces an unsupported second-person pronoun.'
    rationale: The Hebrew וְאָבִי means "and, my father"; it does not mean "and you, my father." This changes the syntactic force of David's address.
  - severity: low
    issue: '"sijakutendea dhambi" is not the most idiomatic Swahili expression for sinning/offending against someone.'
    rationale: '"Sijakukosea" naturally expresses the Hebrew חטא ל, without weakening David''s moral denial.'
  - severity: low
    issue: Footnote c adds an interpretive explanation beyond the needed lexical note.
    rationale: The phrase already plainly concerns taking David's life; a literal note is sufficient and avoids needless explanatory expansion.
