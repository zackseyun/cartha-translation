reference: 1 Samuel 24:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אָבִ֣/י רְאֵ֔ה גַּ֗ם רְאֵ֛ה אֶת כְּנַ֥ף מְעִילְ/ךָ֖ בְּ/יָדִ֑/י כִּ֡י בְּ/כָרְתִ/י֩ אֶת כְּנַ֨ף מְעִֽילְ/ךָ֜ וְ/לֹ֣א הֲרַגְתִּ֗י/ךָ דַּ֤ע וּ/רְאֵה֙ כִּי֩ אֵ֨ין בְּ/יָדִ֜/י רָעָ֤ה וָ/פֶ֨שַׁע֙ וְ/לֹא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֛ה צֹדֶ֥ה אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/012.yaml
  text: And[a], my father, see—yes, see the corner of your robe in my hand. For when I cut off the corner of your robe[b], I did not kill you. Know and see that there is no evil or transgression in my hand, and I have not sinned against you[c], though you are hunting my life to take it.
translation:
  language: sw
  text: Na, baba yangu, tazama—naam, tazama upindo wa joho lako[a] mkononi mwangu. Kwa maana nilipoukata upindo wa joho lako, sikukuua. Jua na uone kwamba hakuna uovu wala uasi[b] mkononi mwangu, wala sijakukosea; lakini wewe unawinda maisha yangu ili uyachukue.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pembe ya joho lako” au “ukingo wa joho lako.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linaweza pia kutafsiriwa “kosa” au “uvunjaji wa sheria”; katika muktadha huu linaweza kujumuisha uasi dhidi ya mfalme.
    reason: lexical_ambiguity
  - marker: c
    text: Kihalisi, “unawinda maisha yangu ili kuyachukua.”
    reason: literal_rendering
lexical_decisions:
- source_word: וְאָבִי
  choice: Nawe, baba yangu
  rationale: Huhifadhi kiunganishi cha Kiebrania na namna ya Daudi ya kumwita Sauli kwa heshima na kwa lugha ya uhusiano.
- source_word: רְאֵה גַּם רְאֵה
  choice: tazama—naam, tazama
  rationale: Marudio pamoja na גַּם yana mkazo; kauli hii hudumisha msisitizo na haraka kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: כְּנַף מְעִילְךָ
  choice: upindo wa joho lako
  rationale: כָּנָף hapa ni sehemu ya mwisho au pembe ya vazi. ‘Upindo’ ni neno la kawaida na linaloeleweka kwa sehemu iliyokatwa, huku ‘joho’ likiwakilisha מְעִיל.
- source_word: בְּיָדִי
  choice: mkononi mwangu
  rationale: Huhifadhi ushahidi halisi Daudi anaouonyesha na pia mwangwi wa matumizi ya baadaye yanayohusu matendo au uwezo wake.
- source_word: כִּי בְּכָרְתִי
  choice: Kwa maana nilipoukata
  rationale: כִּי hutoa sababu, na muundo wenye בְּ unaelezwa kwa Kiswahili kwa sentensi ya wakati inayosomeka kwa urahisi.
- source_word: וְלֹא הֲרַגְתִּיךָ
  choice: sikukuua
  rationale: Ni tafsiri ya moja kwa moja, ya sasa, na isiyo ya kizamani ya kitenzi kilichokanushwa.
- source_word: דַּע וּרְאֵה
  choice: Jua na uone
  rationale: 'Huhifadhi vitenzi vyote viwili: Sauli aitambue hoja na auone ushahidi wake.'
- source_word: אֵין בְּיָדִי רָעָה וָפֶשַׁע
  choice: hakuna uovu wala uasi mkononi mwangu
  rationale: ‘Mkononi mwangu’ hudumisha taswira na ulinganifu wa mstari. פֶשַׁע inaweza kuwa kosa zito au uasi; katika muktadha wa Daudi na mfalme Sauli, ‘uasi’ huhifadhi vizuri maana ya kisiasa bila kuondoa maana ya maadili.
- source_word: וְלֹא חָטָאתִי לָךְ
  choice: wala sijakutendea dhambi
  rationale: חטא pamoja na ל huonyesha kumkosea mtu; ‘kukutendea dhambi’ huhifadhi uzito wa kimaadili na kidini.
- source_word: וְאַתָּה צֹדֶה אֶת נַפְשִׁי
  choice: lakini wewe unawinda maisha yangu
  rationale: צדה ina taswira ya kuwinda mawindo. ‘Lakini’ huonyesha utofauti wa wazi kati ya kutokuwa na hatia kwa Daudi na tendo la Sauli, huku ‘maisha yangu’ yakitoa maana ya נַפְשִׁי katika muktadha huu.
- source_word: לְקַחְתָּהּ
  choice: ili uyachukue
  rationale: Kiwakilishi cha wingi wa kisarufi katika Kiswahili kinarejelea ‘maisha yangu’ na kuhifadhi maana halisi ya kuchukua maisha, yaani kuua.
theological_decisions:
- issue: Maana ya kimaadili na kisiasa ya פֶשַׁע katika Daudi kukana hatia mbele ya Sauli
  choice: uasi
  alternative: kosa; uvunjaji wa sheria
  rationale: Neno linaweza kumaanisha kosa zito au uasi. Kwa kuwa Daudi anazungumza na mfalme anayemshuku kuwa mpinzani, ‘uasi’ huonyesha kipengele cha kisiasa kilichomo katika muktadha, lakini tanbihi huhifadhi upana wa neno.
- issue: Maana ya נֶפֶשׁ katika tishio la kuuawa
  choice: maisha yangu
  alternative: nafsi yangu; roho yangu
  rationale: Katika muktadha huu Sauli anatafuta kumuua Daudi. ‘Maisha yangu’ huwasilisha maana hiyo wazi bila kuingiza dai maalumu kuhusu muundo wa mwanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya Kiebrania yamehifadhiwa kwa “tazama—naam, tazama,” na taswira za “mkononi mwangu” na “unawinda maisha yangu” zimeachwa wazi badala ya kufupishwa kwa maelezo.
