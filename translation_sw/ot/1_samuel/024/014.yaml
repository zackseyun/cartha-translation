  yaml_path: translation/ot/1_samuel/024/014.yaml
  text: As the ancient proverb says[a], ‘Wickedness comes out from the wicked,’ but my hand will not be against you.
translation:
  language: sw
  text: Kama methali ya kale inavyosema[a], “Uovu hutoka kwa waovu”; lakini mkono wangu hautakuwa dhidi yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kama methali ya watu wa kale inavyosema.” Neno la Kiebrania linaweza kueleweka kuwa “ya kale” au kuwa linawarejelea “watu wa kale.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר יֹאמַר
  choice: Kama ... inavyosema
  rationale: Muundo huu unatambulisha nukuu ya kimethali kwa Kiswahili cha kawaida; wakati wa sasa unaonyesha ukweli unaotajwa kwa kawaida.
- source_word: מְשַׁל הַקַּדְמֹנִי
  choice: methali ya kale
  rationale: מְשַׁל hapa ni usemi mfupi wa hekima, na הַקַּדְמֹנִי inaweza kueleza methali kuwa ya zamani; utata wa uwezekano wa kumaanisha methali ya watu wa kale umehifadhiwa katika tanbihi.
- source_word: מֵרְשָׁעִים
  choice: kwa waovu
  rationale: Kihusishi מִן kinaonyesha chanzo; katika Kiswahili, 'hutoka kwa waovu' huonyesha kwamba uovu hutokana na watu waovu.
- source_word: יֵצֵא רֶשַׁע
  choice: Uovu hutoka
  rationale: Wakati wa mazoea 'hutoka' unafaa kwa kauli ya kimethali na unahifadhi taswira ya kitu kutoka katika chanzo chake.
- source_word: וְיָדִי
  choice: lakini mkono wangu
  rationale: Kiunganishi kimetafsiriwa kwa maana ya utofautishaji kutokana na muktadha. 'Mkono wangu' umehifadhiwa kama sitiari ya tendo au shambulio la Daudi.
- source_word: לֹא תִהְיֶה בָּךְ
  choice: hautakuwa dhidi yako
  rationale: Tafsiri hii inadumisha sitiari ya mkono huku ikionyesha wazi mwelekeo wa uhasama unaokanushwa.
