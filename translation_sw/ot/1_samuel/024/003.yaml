  verdict: revise
  source_fidelity: Neno עַל־פְּנֵי linaelekea kumaanisha nafasi iliyo mbele ya/ikikabili majabali hayo, si kwa upana tu “karibu na.” Tafsiri ya “mbele ya” inalinda uhusiano wa mahali unaokusudiwa. Vipengele vingine vya Kiebrania—Sauli, watu elfu tatu waliochaguliwa, Israeli yote, Daudi na watu wake—vimewasilishwa kwa uaminifu.
  naturalness: 'Marekebisho yanatumia Kiswahili Sanifu cha masimulizi: “akawaendea kumtafuta Daudi na watu wake” yanaweza kusikika kana kwamba Daudi na watu wake ni kikundi kimoja kinachotafutwa. “akaenda kumtafuta Daudi na watu wake” ni ya kawaida, lakini inaweza kueleweka kwamba watu hao walikuwa pamoja naye; maana hiyo inalingana na muktadha. “Majabali” na “mbuzi-mwitu” huandikwa kwa herufi ndogo kwa kuwa kifungu hakihitaji kutendwa kama jina rasmi la mahali katika maandishi ya Kiebrania.'
  terminology: “Mbuzi-mwitu” ni tafsiri inayofikika ya יְעֵלִים; “ibex” ibaki katika tanbihi kama utambulisho unaowezekana, si wa uhakika. Tanbihi pia irejeshe mbadala wa “miamba/makorongo ya miamba” kwa צוּרֵי, unaolingana na mkondo wa ukaguzi wa Kiingereza.
