base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/003.yaml
  text: Then Saul took three thousand chosen men from all Israel and went to seek David and his men in front of the rocks of the wild goats[a].
translation:
  language: sw
  text: Ndipo Sauli akachukua watu elfu tatu waliochaguliwa kutoka Israeli yote, akaenda kumtafuta Daudi na watu wake mbele ya majabali ya mbuzi-mwitu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miamba” au “makorongo ya miamba ya mbuzi-mwitu”; mnyama anayelengwa huenda hasa ni ibex.
    reason: Hutoa mbadala wa maana ya צוּרֵי na kuhifadhi utambulisho unaowezekana, lakini usio wa hakika, wa יְעֵלִים.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: akachukua
  rationale: Kitenzi kinaonyesha kwamba Sauli aliwachukua au aliwakusanya watu kwa ajili ya msafara huu; “akachukua” ni cha moja kwa moja na cha kawaida katika simulizi.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: watu elfu tatu
  rationale: Hii ni namna ya kawaida ya Kiebrania ya kuhesabu watu; muktadha unaonyesha kwamba walikuwa askari bila kulazimisha neno hilo katika tafsiri.
- source_word: בָּחוּר
  choice: waliochaguliwa
  rationale: Hapa neno lina maana ya watu walioteuliwa au walio bora kwa kazi hiyo; “waliochaguliwa” linahifadhi wazo la uteuzi.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: kutoka Israeli yote
  rationale: Kifungu kinaonyesha kuwa watu hao waliteuliwa kutoka katika taifa lote la Israeli.
- source_word: וַיֵּלֶךְ לְבַקֵּשׁ
  choice: akaenda kuwatafuta
  rationale: Muundo huu unaonyesha kusudi la kwenda kwa Sauli; “akaenda kuwatafuta” ni wa asili katika Kiswahili na unadumisha maana ya msako.
- source_word: אֶת דָּוִד וַאֲנָשָׁיו
  choice: Daudi na watu wake
  rationale: Hii inarejelea moja kwa moja Daudi pamoja na wafuasi wake.
- source_word: עַל פְּנֵי
  choice: karibu na
  rationale: Katika maelezo haya ya mahali, kifungu kinaweza kuonyesha eneo lililo mbele ya au jirani na majabali; “karibu na” ni Kiswahili cha kawaida bila kudai kwamba walikuwa juu ya majabali.
- source_word: צוּרֵי הַיְּעֵלִים
  choice: Majabali ya Mbuzi-mwitu
  rationale: צוּרֵי hurejelea miamba au majabali, na יְעֵלִים ni mbuzi wa porini, huenda hasa ibex. “Majabali ya Mbuzi-mwitu” ni wazi na linafaa kama jina la eneo.
