    rationale: Hupunguza mahusiano mahususi ya nafasi katika kifungu cha Kiebrania. “Mbele ya” ni tafsiri ya karibu zaidi na bado ni ya asili kwa Kiswahili.
  - severity: low
    issue: Tanbihi ya sasa haitoi mbadala wa leksia ya צוּרֵי
    rationale: Tanbihi ya ukaguzi wa Kiingereza huonyesha “crags” kama mbadala wa “rocks.” Tanbihi iliyorekebishwa inatoa “miamba/makorongo ya miamba” na kudumisha tahadhari kuhusu ibex.
  - severity: low
    issue: Herufi kubwa katika “Majabali ya Mbuzi-mwitu”
    rationale: Kiebrania hakithibitishi wazi kwamba huu ni umbo la jina rasmi la mahali; herufi ndogo huepuka kuongeza dai hilo.
