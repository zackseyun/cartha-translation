  text: וַ/יֹּאמְרוּ֩ אַנְשֵׁ֨י דָוִ֜ד אֵלָ֗י/ו הִנֵּ֨ה הַ/יּ֜וֹם אֲֽשֶׁר אָמַ֧ר יְהוָ֣ה אֵלֶ֗י/ךָ הִנֵּ֨ה אָנֹכִ֜י נֹתֵ֤ן אֶת איבי/ך בְּ/יָדֶ֔/ךָ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֖ר יִטַ֣ב בְּ/עֵינֶ֑י/ךָ וַ/יָּ֣קָם דָּוִ֗ד וַ/יִּכְרֹ֛ת אֶת כְּנַֽף הַ/מְּעִ֥יל אֲשֶׁר לְ/שָׁא֖וּל בַּ/לָּֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/005.yaml
  text: Then David’s men said to him[a], “Look, this is the day of which Yahweh said to you, ‘Look, I am giving your enemy into your hand, and you may do to him as seems good in your eyes.’” Then David arose and secretly cut off the corner of Saul’s robe.
translation:
  language: sw
  text: Ndipo watu wa Daudi wakamwambia, “Tazama, hii ndiyo siku ambayo Yahwe alikuambia, ‘Tazama, ninamtia adui yako mikononi mwako, nawe unaweza kumtendea kama itakavyoonekana kuwa vyema machoni pako[a].’” Ndipo Daudi akainuka, akakata kwa siri ukingo wa joho la Sauli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa lugha ya kinahau zaidi, “kama upendavyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אַנְשֵׁי דָוִד
  choice: Ndipo watu wa Daudi wakamwambia
  rationale: “Ndipo” huendeleza mfuatano wa simulizi kwa Kiswahili cha kawaida, na “watu wa Daudi” hutaja wafuasi wake kwa uwazi.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili limetumika mara mbili kudumisha msisitizo wa Kiebrania bila kutumia mtindo wa kizamani.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa namna ya kawaida na inayosomeka katika Kiswahili.
- source_word: הִנֵּה אָנֹכִי נֹתֵן
  choice: Tazama, ninamtia
  rationale: Kauli ya wakati uliopo hudumisha uzito na uhai wa tendo linalokaribia kutimizwa.
- source_word: אֶת איביך בְּיָדֶךָ
  choice: adui yako mkononi mwako
  rationale: Umoja unaafikiana na muktadha unaomhusu Sauli na viwakilishi vinavyofuata; taswira ya “mkononi” inadumisha nahau ya kumweka mtu chini ya mamlaka ya mwingine.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: nawe unaweza kumtendea
  rationale: Katika muktadha huu maneno yanaeleza nafasi au ruhusa ya kutenda baada ya adui kutiwa mkononi, bila kuyafanya yawe amri ya moja kwa moja.
- source_word: כַּאֲשֶׁר יִטַב בְּעֵינֶיךָ
  choice: kama inavyoonekana kuwa vyema machoni pako
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya jambo kuwa jema machoni pa mtu; mbadala wa kinahau zaidi umetolewa katika tanbihi.
- source_word: וַיָּקָם דָּוִד
  choice: Ndipo Daudi akainuka
  rationale: Inadumisha hatua inayofuata katika simulizi kwa lugha ya asili na yenye hadhi.
- source_word: וַיִּכְרֹת אֶת כְּנַף הַמְּעִיל אֲשֶׁר לְשָׁאוּל בַּלָּט
  choice: alikata kwa siri pindo la joho la Sauli
  rationale: “Pindo” linaeleza sehemu ya ukingo wa vazi, “joho” linafaa kwa vazi la nje, na “kwa siri” linadumisha namna tendo lilivyofanywa.
theological_decisions:
- issue: Ikiwa kauli inayodaiwa kuwa ya Yahwe ni unabii halisi wa awali au tafsiri ya watu wa Daudi
  choice: 'Kauli imesimuliwa moja kwa moja kama madai ya watu wa Daudi: “siku ambayo Yahwe alikuambia.”'
  alternative: Kutumia maneno yanayoweka wazi zaidi kuwa hiyo ilikuwa tafsiri yao tu, au yanayodokeza kwa nguvu zaidi kuwapo kwa unabii maalumu unaojulikana.
  rationale: Kiebrania kinasimulia tu walichosema watu wa Daudi. Tafsiri haithibitishi wala kukanusha madai yao, hivyo inadumisha mvutano wa simulizi na wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni wa asili kwa msomaji wa kawaida, huku taswira muhimu za Kiebrania—hasa “mkononi mwako” na “machoni pako”—zikidumishwa.
