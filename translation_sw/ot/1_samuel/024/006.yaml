translation:
  language: sw
  text: Baada ya hayo, moyo wa Daudi ulimchoma[a] kwa sababu alikuwa amekata pembe ya vazi la Sauli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “moyo wa Daudi ulimpiga,” nahau inayoonyesha kwamba dhamiri yake ilimsumbua.'
    reason: lexical_alternative
  - marker: b
    text: Au “ukingo” au “upindo” wa vazi la Sauli; neno la Kiebrania linaweza kumaanisha sehemu ya mwisho ya vazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Ni kiunganishi cha wakati kinachoonyesha jambo lililofuata tendo lililotangulia; usemi huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: moyo wa Daudi ulimchoma
  rationale: Huhifadhi moyo kama mtendaji na picha hai ya nahau ya Kiebrania, huku Kiswahili ‘moyo ulimchoma’ kikieleweka kwa kawaida kuwa dhamiri ilimsumbua.
- source_word: לֵב
  choice: moyo
  rationale: Neno halisi ni ‘moyo’ na katika muktadha huu linahusisha utambuzi wa ndani wa mema na mabaya; ‘dhamiri’ lingekuwa fasiri iliyo wazi zaidi kuliko chanzo.
- source_word: עַל אֲשֶׁר
  choice: kwa sababu
  rationale: Huonyesha wazi sababu ya kusumbuliwa kwa moyo wa Daudi.
- source_word: כָּרַת
  choice: alikuwa amekata
  rationale: Wakati huu unaonyesha kwamba tendo la kukata lilitokea kabla ya moyo wake kumchoma.
- source_word: כָּנָף
  choice: upindo
  rationale: Katika vazi, neno linaweza kutaja sehemu ya mwisho, pembe, ukingo, au upindo; ‘upindo’ ni neno la kawaida la Kiswahili bila kulifanya kuwa mahususi kupita kiasi.
- source_word: אֶת כָּנָף אֲשֶׁר לְשָׁאוּל
  choice: upindo wa vazi la Sauli
  rationale: Kiebrania kinataja sehemu ya vazi iliyokuwa ya Sauli; ‘vazi’ limetolewa wazi kutokana na muktadha wa karibu ili sentensi iwe ya asili kwa Kiswahili.
