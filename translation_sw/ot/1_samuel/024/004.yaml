translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka kwa urahisi. Kiunganishi “Nao” kinadumisha mpito wa simulizi kwenda kwa Daudi na watu wake. Alama ya tanbihi imewekwa baada ya “kujisaidia,” ambako ndiko msemo wa Kiebrania unaohusika.
