base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/004.yaml
  text: He came to the sheepfolds by the road[a], where there was a cave, and Saul went in to relieve himself. Now David and his men were sitting in the innermost parts of the cave.
translation:
  language: sw
  text: Akafika kwenye mazizi ya kondoo kando ya njia, ambako kulikuwa na pango. Sauli akaingia pangoni ili kujisaidia.[a] Nao Daudi na watu wake walikuwa wameketi ndani kabisa ya pango.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri halisi, “kufunika miguu yake,” msemo wa Kiebrania unaomaanisha kwenda haja.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּדְרוֹת הַצֹּאן
  choice: mazizi ya kondoo
  rationale: Kirai hiki kinamaanisha maeneo yaliyozungushiwa kwa ajili ya kondoo. “Mazizi ya kondoo” ni usemi wa kawaida wa Kiswahili unaodumisha mazingira halisi ya simulizi.
- source_word: עַל הַדֶּרֶךְ
  choice: kando ya njia
  rationale: Kirai kinaonyesha mahali mazizi yalipokuwa kuhusiana na njia aliyokuwa akisafiria Sauli; “kando ya njia” ni cha asili na wazi katika Kiswahili.
- source_word: מְעָרָה
  choice: pango
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa pango la asili, na linafaa katika muktadha huu.
- source_word: לְהָסֵךְ אֶת רַגְלָיו
  choice: ili kujisaidia
  rationale: Huu ni msemo wa staha wa Kiebrania unaomaanisha kwenda haja. “Kujisaidia” huwasilisha maana kwa staha na kwa uwazi; tafsiri halisi imehifadhiwa katika tanbihi.
- source_word: בְּיַרְכְּתֵי הַמְּעָרָה
  choice: ndani kabisa ya pango
  rationale: Neno hili huelekeza kwenye sehemu za mbali zaidi ndani ya pango. “Ndani kabisa” ni usemi wa Kiswahili ulio wazi na unaosaidia kueleza kwa nini Sauli hakuwaona.
- source_word: יֹשְׁבִים
  choice: walikuwa wameketi
  rationale: Kishiriki hiki kinaeleza hali au mkao wao wakati huo, si makao ya kudumu. “Walikuwa wameketi” hudumisha taswira ya tukio.
- source_word: וַיָּבֹא ... וַיָּבֹא
  choice: Akafika ... akaingia
  rationale: Kitenzi cha kwanza kinaendeleza mwendo wa simulizi, na cha pili kinaeleza kuingia kwa Sauli pangoni. Vitenzi tofauti vya Kiswahili vinaweka mfuatano huo wazi bila marudio yasiyo ya lazima.
