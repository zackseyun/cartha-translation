  text: Kisha Daudi akapanda kutoka huko, akakaa katika ngome za En-Gedi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה kinaonyesha mwendo wa kwenda juu. “Akapanda” ni usemi wa kawaida wa Kiswahili unaohifadhi mwelekeo huo.
- source_word: מִשָּׁם
  choice: kutoka huko
  rationale: Huu ni usemi wa moja kwa moja unaorejelea mahali ambapo Daudi alikuwa kabla ya kuondoka.
- source_word: וַיֵּשֶׁב
  choice: akakaa
  rationale: Katika muktadha huu, ישב humaanisha kukaa mahali kwa muda; “akakaa” haidokezi makazi ya kudumu.
- source_word: בִּמְצָדוֹת
  choice: katika ngome
  rationale: מְצָדוֹת ni maeneo salama yanayoweza kulindwa. “Ngome” inaweza kutaja maeneo hayo bila kulazimisha maana ya majengo rasmi ya kijeshi.
- source_word: עֵין גֶּדִי
  choice: En-gedi
  rationale: Ni jina la mahali, kwa hiyo limenakiliwa kwa herufi za Kiswahili badala ya kutafsiriwa.
