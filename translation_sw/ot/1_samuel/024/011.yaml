  naturalness: “Macho yako mwenyewe” hailingani kisarufi na nomino ya wingi “macho”; “macho yako yenyewe” ni sahihi. “Ndani ya pango” na “mikononi mwangu” ni matumizi ya kawaida na wazi katika Kiswahili Sanifu.
  terminology: “Yahweh” inalinda jina la pekee la Mungu na inalingana na mkondo wa POB. “Aliyetiwa mafuta na Yahweh” ni usemi wa kawaida zaidi kuliko “mtiwa-mafuta wa Yahwe,” huku ukihifadhi maana ya mfalme aliyetiwa wakfu bila kuingiza tafsiri ya kieskatolojia ya “Masihi.”
