  text: הִנֵּה֩ הַ/יּ֨וֹם הַ/זֶּ֜ה רָא֣וּ עֵינֶ֗י/ךָ אֵ֣ת אֲשֶׁר נְתָנְ/ךָ֩ יְהוָ֨ה הַ/יּ֤וֹם בְּ/יָדִ/י֙ בַּ/מְּעָרָ֔ה וְ/אָמַ֥ר לַ/הֲרָגֲ/ךָ֖ וַ/תָּ֣חָס עָלֶ֑י/ךָ וָ/אֹמַ֗ר לֹא אֶשְׁלַ֤ח יָדִ/י֙ בַּֽ/אדֹנִ֔/י כִּי מְשִׁ֥יחַ יְהוָ֖ה הֽוּא־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/011.yaml
  text: Look[a], this day your own eyes have seen that Yahweh gave you today into my hand in the cave, and I said to kill you, but I spared you. I said, ‘I will not stretch out my hand against my lord[b], for he is Yahweh’s anointed.’
translation:
  language: sw
  text: Tazama, leo hii macho yako yenyewe yameona kwamba Yahweh alikutia leo mikononi mwangu ndani ya pango, na mtu akasema nikuue.[a] Lakini ukaachwa hai.[b] Nilisema, ‘Sitanyoosha mkono wangu dhidi ya bwana wangu, kwa maana yeye ni aliyetiwa mafuta na Yahweh.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “naye akasema nikuue,” “ikasemwa nikuue,” au “nikasema nikuue.” Kitenzi cha Kiebrania ni cha umoja, lakini mtendaji wake hakutajwa.
    reason: alternative_reading
  - marker: b
    text: Au, “lakini nilikuhurumia.” Kitenzi cha Kiebrania kinaweza kueleza kumwacha mtu hai kwa sababu ya kumwonea huruma, lakini kiima chake hakitajwi wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta usikivu kwa msisitizo; “Tazama” ni la sasa, lenye heshima, na linafaa katika simulizi.
- source_word: רָאוּ עֵינֶיךָ
  choice: macho yako mwenyewe yameona
  rationale: Inahifadhi picha ya Kiebrania ya macho kuwa mashahidi na msisitizo kwamba Sauli alijionea mwenyewe.
- source_word: נְתָנְךָ יְהוָה ... בְּיָדִי
  choice: Yahwe alikutia ... mkononi mwangu
  rationale: Muundo huu unaonyesha kutiwa chini ya mamlaka ya mwingine; nahau ya “mkononi mwangu” imehifadhiwa kwa Kiswahili kinachoeleweka.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano limetafsiriwa moja kwa moja kama jina la pekee badala ya kubadilishwa kuwa cheo.
- source_word: בַּמְּעָרָה
  choice: pangoni
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya mahali panapotajwa.
- source_word: וְאָמַר לַהֲרָגֲךָ
  choice: na mtu akasema nikuue
  rationale: Kitenzi cha umoja hakimtaji mtendaji. “Mtu” huhifadhi kutotajwa kwa msemaji bila kumtambua kimakusudi kuwa Daudi.
- source_word: וַתָּחָס עָלֶיךָ
  choice: lakini nilikuhurumia
  rationale: Kitenzi kina wazo la kumwonea mtu huruma na hivyo kutomuua; muktadha humtambulisha Daudi kuwa aliyetenda.
- source_word: לֹא אֶשְׁלַח יָדִי
  choice: Sitanyoosha mkono wangu
  rationale: Nahau ya Kiebrania ya kuchukua hatua ya uadui imehifadhiwa kwa namna inayoeleweka katika Kiswahili.
- source_word: בַּאדֹנִי
  choice: dhidi ya bwana wangu
  rationale: “Bwana wangu” linaonyesha heshima kwa Sauli kama mkuu na mfalme wa Daudi, bila kulifanya kuwa jina la Mungu.
- source_word: מְשִׁיחַ יְהוָה
  choice: mtiwa-mafuta wa Yahwe
  rationale: Katika simulizi hili usemi huo unamhusu mfalme aliyewekwa wakfu kwa kutiwa mafuta, huku ukihifadhi uzito wa kitheolojia wa tendo hilo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yana jina la pekee la Mungu; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya מְשִׁיחַ יְהוָה katika simulizi la kifalme
  choice: mtiwa-mafuta wa Yahwe
  alternative: Masihi wa Yahwe
  rationale: Hapa usemi huo unamtaja Sauli kama mfalme aliyewekwa wakfu kwa mafuta. “Mtiwa-mafuta” huepuka kuingiza moja kwa moja maana ya cheo cha kieskatolojia.
- issue: Mtendaji wa וְאָמַר
  choice: mtendaji ameachwa bila kutambuliwa kwa kutumia “mtu”
  alternative: nikasema nikuue
  rationale: Kiebrania kina kitenzi cha nafsi ya tatu umoja bila kiima kilichotajwa. Tafsiri haipaswi kukitambulisha kimyakimya kuwa kauli ya Daudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Marudio ya “leo” yamehifadhiwa kwa sababu yanapatikana mara mbili katika Kiebrania na yanaongeza msisitizo. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
