  - severity: low
    issue: “Macho yako mwenyewe” si upatanisho sahihi wa Kiswahili.
    rationale: “Macho” ni wingi; kivumishi cha msisitizo kinapaswa kuwa “yenyewe.”
  - severity: low
    issue: “Mtiwa-mafuta wa Yahwe” ina umbo lisilo la kawaida na tahajia ya jina hailingani na POB.
    rationale: “Aliyetiwa mafuta na Yahweh” ni Kiswahili cha asili, kinaeleza kwa uwazi muktadha wa kutiwa wakfu kifalme, na kinatumia tahajia inayolingana na mkondo wa audit.
