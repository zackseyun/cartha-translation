  to: Tazama, leo hii macho yako yenyewe yameona kwamba Yahweh alikutia leo mikononi mwangu ndani ya pango, na mtu akasema nikuue.[a] Lakini ukaachwa hai.[b] Nilisema, ‘Sitanyoosha mkono wangu dhidi ya bwana wangu, kwa maana yeye ni aliyetiwa mafuta na Yahweh.’
