  text: Na sasa, tazama, ninajua kwamba hakika utatawala, na ufalme wa Israeli utaimarika mikononi mwako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: tazama
  rationale: Kiashiria hiki huvuta fikira kwenye kauli inayofuata; “tazama” kinadumisha msisitizo wake kwa lugha yenye hadhi.
- source_word: מָלֹךְ תִּמְלוֹךְ
  choice: hakika utakuwa mfalme
  rationale: Muundo wa kitenzi kisicho kikomo pamoja na kitenzi kilichopinda unasisitiza uhakika wa kutawala; Kiswahili cha kawaida huwasilisha hilo kwa “hakika.”
- source_word: וְקָמָה בְּיָדְךָ
  choice: utaimarishwa mkononi mwako
  rationale: Kitenzi קום hapa kina maana ya kusimama imara au kuthibitishwa, huku “mkononi mwako” kikihifadhi taswira ya mamlaka na udhibiti.
theological_decisions:
- issue: Uhakika wa Daudi kuwa mfalme
  choice: hakika utakuwa mfalme
  alternative: utatawala bila shaka
  rationale: Chaguo hili linahifadhi msisitizo wa Kiebrania bila kuongeza maelezo kuhusu namna au wakati wa kutimia kwake.
- issue: Uthabiti wa ufalme wa Israeli chini ya Daudi
  choice: ufalme wa Israeli utaimarishwa mkononi mwako
  alternative: ufalme wa Israeli utathibitika chini ya mamlaka yako
  rationale: Taswira ya “mkono” imehifadhiwa kwa sababu inaweza kuonyesha mamlaka, udhibiti, na umiliki bila kufungia maana katika ufafanuzi mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Tazama” limetumiwa kwa makusudi kama kiashiria cha msisitizo wa kisimulizi; hakuna alama za tanbihi zinazohitajika.
