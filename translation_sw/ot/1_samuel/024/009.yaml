base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/009.yaml
  text: After that David rose and went out of the cave[a], and called after Saul, saying, “My lord the king!” When Saul looked behind him, David bowed with his face to the ground and prostrated himself.
translation:
  language: sw
  text: Baada ya hayo, Daudi akainuka, akatoka pangoni, akamwita Sauli kwa sauti, akisema, “Bwana wangu, mfalme!” Sauli alipotazama nyuma yake, Daudi akainama uso wake kuelekea ardhini, akamsujudia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akainama kabisa mbele yake.” Kitenzi cha Kiebrania kinaweza kumaanisha kusujudu kwa heshima kubwa; hapa kinaeleza namna Daudi alivyojishusha mbele ya Sauli, si kumwabudu kama Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Kitenzi קום hapa kinaonyesha Daudi kuinuka ili atende jambo linalofuata; “akainuka” ni cha kawaida na cha simulizi katika Kiswahili.
- source_word: אַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Nahau hii ya wakati huonyesha mfuatano wa matukio bila kuongeza ufafanuzi.
- source_word: וַיֵּצֵא מִן־הַמְּעָרָה
  choice: akatoka pangoni
  rationale: יצא humaanisha kutoka; umbo “pangoni” ni la asili katika Kiswahili na linahifadhi mahali alikotoka.
- source_word: וַיִּקְרָא אַחֲרֵי שָׁאוּל
  choice: akamwita Sauli kwa sauti akiwa nyuma yake
  rationale: Kirai kinaonyesha kumwita mtu kutoka nyuma yake. Tafsiri hii ni wazi na ya kawaida kuliko tafsiri ya neno kwa neno “akamwita nyuma ya Sauli.”
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Bwana wangu, mfalme
  rationale: Ni kauli ya heshima kwa mfalme; “Bwana wangu” hapa ni namna ya kumheshimu mtawala wa kibinadamu.
- source_word: וַיַּבֵּט שָׁאוּל אַחֲרָיו
  choice: Sauli alipotazama nyuma yake
  rationale: Muundo wa wakati unaunganisha kwa kawaida kutazama kwa Sauli na tendo la Daudi linalofuata, huku “nyuma yake” ikiwakilisha אַחֲרָיו.
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה
  choice: Daudi akainama uso wake mpaka chini
  rationale: Tafsiri hii inaonyesha kuinama kwa kina na maana ya nahau ya Kiebrania ya kuelekeza uso ardhini.
- source_word: וַיִּשְׁתָּחוּ
  choice: akamsujudia
  rationale: Kitenzi kinaonyesha kujishusha kabisa kwa heshima au utiifu. “Akamsujudia” kinahifadhi uzito wa tendo na kulitofautisha na kuinama kulikotajwa kwanza.
theological_decisions:
- issue: Maana ya Daudi kumsujudia Sauli
  choice: Tendo la kimwili la heshima kubwa na kujinyenyekeza mbele ya mfalme, si ibada kwa Mungu
  alternative: “akamwabudu” au “akampa heshima”
  rationale: Kitenzi שׁחה kinaweza kutumiwa kwa ibada kwa Mungu au kwa kusujudu mbele ya mwanadamu kulingana na muktadha. Kwa kuwa hapa tendo linaelekezwa kwa Sauli, tafsiri inapaswa kuhifadhi kina cha kujishusha bila kudokeza kwamba Daudi alimwabudu kama Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Mfuatano wa vitenzi vya “aka-” unatunza mwendo wa simulizi la Kiebrania. Maneno ya heshima “Bwana wangu, mfalme” yamehifadhiwa bila kupewa maana ya kiungu.
