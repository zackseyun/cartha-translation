  text: May the LORD be judge and decide between me and you, see and plead my case, and vindicate me from your hand.
translation:
  language: sw
  text: BWANA awe mwamuzi, na ahukumu kati yangu na wewe; na aone, atetee shauri langu, na anipatie haki kwa kunitoa mkononi mwako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi ya kawaida ya tafsiri za Kiswahili ya kuwakilisha jina la agano YHWH kwa BWANA kwa herufi kubwa.
- source_word: לְדַיָּן ... וְשָׁפַט
  choice: awe mwamuzi, ahukumu
  rationale: Inadumisha tofauti kati ya nomino 'mwamuzi' na kitenzi 'ahukumu' bila kurudia kwa namna isiyo ya asili katika Kiswahili.
- source_word: וְיָרֵב אֶת רִיבִי
  choice: aitetee kesi yangu
  rationale: Nahau ya Kiebrania ina maana ya kuendesha au kutetea shauri la mtu; 'aitetee kesi yangu' ni ya asili na huhifadhi taswira ya kisheria.
- source_word: וְיִשְׁפְּטֵנִי מִיָּדֶךָ
  choice: anipe haki kwa kuniokoa mkononi mwako
  rationale: Kitenzi kinamaanisha kutoa hukumu ya haki kwa niaba ya msemaji, huku מִיָּדֶךָ ikieleza kuokolewa kutoka katika mamlaka au nguvu ya Sauli.
theological_decisions:
- issue: Ombi kwa Mungu kama mwamuzi dhidi ya Sauli
  choice: Vitenzi vya ombi 'na awe ... ahukumu ... aangalie ... aitetee ... anipe'
  alternative: 'Kauli za wakati ujao: ''BWANA atakuwa ... atahukumu ...'''
  rationale: Muundo wa Kiebrania unaweza kuwa na nguvu ya matarajio au ombi. Katika muktadha huu, tafsiri ya ombi inalingana na rufaa ya Daudi kwa Mungu bila kuifanya kuwa amri kali.
- issue: Maana ya hukumu ya mwisho katika mstari
  choice: anipe haki kwa kuniokoa
  alternative: anihukumu kutoka mkononi mwako
  rationale: Huepuka maana potovu ya kwamba Daudi ndiye anayeshutumiwa; huhifadhi wazo la Mungu kumpatia haki na kumkomboa kutoka kwa Sauli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kisheria wa mstari umehifadhiwa, huku sentensi zikisawazishwa kwa mtiririko wa kawaida.
