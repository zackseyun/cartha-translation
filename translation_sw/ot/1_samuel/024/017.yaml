base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/017.yaml
  text: When David had finished speaking these words to Saul[a], Saul said, “Is this your voice, my son David?” Then Saul lifted up his voice and wept.
translation:
  language: sw
  text: Daudi alipomaliza kumwambia Sauli maneno haya, Sauli akasema, “Je, hii ni sauti yako, mwanangu Daudi?” Ndipo Sauli akapaza sauti, akalia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: alipomaliza
  rationale: Muundo huu unaanzisha kishazi cha wakati na kuonyesha kwamba tendo linalofuata lilitokea baada ya Daudi kumaliza kusema. ‘Alipomaliza’ ni Kiswahili cha kawaida na kinahifadhi mfuatano huo.
- source_word: לְדַבֵּר אֶת־הַדְּבָרִים הָאֵלֶּה אֶל־שָׁאוּל
  choice: kumwambia Sauli maneno haya
  rationale: Katika muktadha wa hotuba, דְּבָרִים humaanisha ‘maneno.’ Muundo ‘kumwambia Sauli maneno haya’ ni wa asili katika Kiswahili na unaonyesha wazi anayesemeshwa.
- source_word: הֲקֹלְךָ זֶה
  choice: Je, hiyo ni sauti yako
  rationale: קוֹל hapa ni sauti inayotambulika. ‘Hiyo’ hutumiwa kwa kawaida katika Kiswahili kurejelea sauti inayosikiwa kwa msemaji mwingine, huku swali la utambuzi la Kiebrania likihifadhiwa.
- source_word: בְּנִי דָוִד
  choice: mwanangu Daudi
  rationale: Tafsiri hii inahifadhi moja kwa moja lugha ya kifamilia na hisia za Sauli, kwa mpangilio wa maneno ulio wa kawaida katika Kiswahili.
- source_word: וַיִּשָּׂא שָׁאוּל קֹלוֹ
  choice: Sauli akapaza sauti
  rationale: Huu ni usemi wa Kiebrania unaoonyesha kutoa sauti kwa nguvu kutokana na hisia. ‘Akapaza sauti’ ni usemi wa Kiswahili unaolingana bila kuwa mzito.
- source_word: וַיֵּבְךְּ
  choice: akalia
  rationale: Kitenzi hiki kinamaanisha kulia kwa machozi. Katika muktadha huu ‘akalia’ ni wazi, sahihi, na cha kawaida.
theological_decisions:
- issue: Sauli kumwita Daudi ‘mwanangu’
  choice: Lugha ya uhusiano imehifadhiwa kama ‘mwanangu Daudi.’
  alternative: Kuichukulia tu kama jina la kisiasa la upendeleo au ulezi.
  rationale: Kiebrania kinatumia wazi neno la kifamilia. Tafsiri hailifanyi kuwa dai la uhusiano halisi wa baba na mwana, wala hailiondolei uzito wake wa kihisia na kijamii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Sentensi ni rahisi kueleweka kwa wasomaji wa kawaida, huku sauti ya kihisia ya simulizi ikihifadhiwa.
