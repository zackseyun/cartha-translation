  language: sw
  text: Sauli aliporudi kutoka kuwafuatilia Wafilisti, wakamwambia, “Tazama, Daudi yuko katika nyika ya En-Gedi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאַחֲרֵי פְּלִשְׁתִּים
  choice: kutoka kuwafuatilia Wafilisti
  rationale: Kirai hiki kinamaanisha kurudi baada ya kuwafuatilia Wafilisti; tafsiri hii ni ya asili katika Kiswahili na inadumisha tendo la ufuatiliaji.
- source_word: וַיַּגִּדוּ לוֹ
  choice: aliambiwa
  rationale: Kitenzi cha Kiebrania ni wingi usiotaja watendaji, yaani ‘wakamwambia’; Kiswahili cha kutendwa huepuka kuongeza wahusika ambao hawakutajwa na kinasomeka kwa ufasaha.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta usikivu kwa taarifa inayofuata. ‘Tazama’ ni la heshima na la kawaida katika mtindo wa kibiblia wa Kiswahili.
- source_word: בְּמִדְבַּר עֵין גֶּדִי
  choice: katika nyika ya En-gedi
  rationale: ‘Nyika’ hapa huwakilisha eneo kame lisilokaliwa sana, bila kulazimisha maana ya jangwa la mchanga; jina la mahali limetoholewa kwa tahajia inayosomeka kwa Kiswahili.
