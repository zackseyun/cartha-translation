base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/015.yaml
  text: After whom has the king of Israel come out? After whom are you pursuing? After a dead dog[a], after a single flea.
translation:
  language: sw
  text: Mfalme wa Israeli ametoka kumfuata nani?[a] Unamwandama nani? Kumfuata mbwa mfu, kumfuata kiroboto kimoja tu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mfalme wa Israeli ametoka dhidi ya nani? Unamsaka nani?” Kiebrania kinarudia neno linalomaanisha kihalisi “nyuma ya,” hapa kwa maana ya kumfuata au kumwinda mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי מִי
  choice: kumfuata nani
  rationale: Neno אַחֲרֵי kimsingi lina wazo la kuwa ‘nyuma ya,’ lakini katika muktadha huu linaonyesha kumfuata mtu kwa nia ya kumkamata. ‘Kumfuata nani’ ni Kiswahili cha kawaida na kinahifadhi swali la balagha.
- source_word: יָצָא
  choice: ametoka
  rationale: Kitenzi hiki humaanisha kutoka au kwenda nje. Hapa kinadokeza mfalme kuondoka na kuanza msako; wakati timilifu ‘ametoka’ unafaa katika swali linaloelekezwa moja kwa moja kwa Sauli.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: Mfalme wa Israeli
  rationale: Tafsiri ya moja kwa moja inadumisha hadhi ya cheo hicho, ambayo inasisitiza tofauti kati ya ukuu wa Sauli na udogo anaodai Daudi kuwa nao.
- source_word: אַתָּה רֹדֵף
  choice: Unamwandama
  rationale: ‘Kumwandama’ huonyesha ufuatiliaji wa kudumu wenye nia ya kumkamata au kumdhuru mtu, hivyo inafaa kwa רדף katika muktadha huu wa kijeshi.
- source_word: כֶּלֶב מֵת
  choice: Mbwa mfu
  rationale: Ni tafsiri ya moja kwa moja ya msemo wa kujishusha. ‘Mbwa mfu’ ni wazi na yenye nguvu katika Kiswahili bila kuongeza maelezo yasiyokuwapo katika Kiebrania.
- source_word: פַּרְעֹשׁ אֶחָד
  choice: kiroboto kimoja tu
  rationale: אֶחָד inasisitiza udogo na kutokuwa na maana kwa anayefuatwa. Neno ‘tu’ linatoa mkazo huo kwa Kiswahili cha kawaida.
- source_word: אַחֲרֵי ... אַחֲרֵי ... אַחֲרֵי
  choice: kumfuata ... Unamwandama ... [majibu ya mkato]
  rationale: Kiebrania kinarudia kihusishi kilekile ili kujenga mdundo wa kejeli. Kiswahili hakiwezi kukirudia kwa namna ileile bila kuwa cha kulazimishwa; vitenzi vinavyohusiana na ufuatiliaji pamoja na majibu mafupi vinadumisha nguvu ya balagha.
