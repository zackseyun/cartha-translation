id: 1SA.24.22
reference: 1 Samuel 24:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּׁ֤בְעָ/ה לִּ/י֙ בַּֽ/יהוָ֔ה אִם תַּכְרִ֥ית אֶת זַרְעִ֖/י אַֽחֲרָ֑/י וְ/אִם תַּשְׁמִ֥יד אֶת שְׁמִ֖/י מִ/בֵּ֥ית אָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/022.yaml
  text: Now swear to me by Yahweh that you will not cut off my descendants after me[c][b][a], and that you will not wipe out my name from my father's house.
translation:
  language: sw
  text: Sasa, niapie kwa Yahweh kwamba hutawaangamiza wazao wangu baada yangu[a][b], wala hutalifuta jina langu katika nyumba ya baba yangu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hutumia neno linalomaanisha kihalisi “ikiwa” katika fomula hii ya kiapo; hapa linatanguliza jambo ambalo Sauli anataka Daudi aape kutolifanya.
    reason: lexical_alternative
  - marker: b
    text: Au “uzao wangu.”
    reason: lexical_alternative
  - marker: c
    text: “Jina langu” hapa linahusu kumbukumbu na mwendelezo wa ukoo wa Sauli ndani ya jamaa yake.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Ni kiashiria cha mazungumzo kinachoanzisha ombi la mwisho la Sauli; ‘Basi sasa’ ni Kiswahili cha kawaida na huhifadhi uhusiano na yaliyotangulia.
- source_word: הִשָּׁבְעָה לִּי
  choice: niapie
  rationale: Amri ya Nifali ya שבע pamoja na kiwakilishi cha yule anayepokea kiapo inaelezwa kwa kawaida na kwa ufupi kwa ‘niapie’.
- source_word: בַּיהוָה
  choice: kwa Yahweh
  rationale: Ni fomula ya kiapo inayolitaja moja kwa moja jina la agano יהוה; ‘kwa Yahweh’ ni usemi wa kawaida wa kuapa katika Kiswahili.
- source_word: אִם ... וְאִם
  choice: kwamba ... wala
  rationale: Katika fomula hii ya kiapo, אִם haitangulizi sharti la kawaida bali maudhui hasi ya kiapo. ‘Kwamba ... wala’ huwasilisha ombi hilo kwa Kiswahili kinachoeleweka.
- source_word: תַּכְרִית
  choice: hutawaangamiza
  rationale: Hifili ya כרת hapa ni kuondoa au kukomesha ukoo. ‘Hutawaangamiza’ huonyesha wazi kuwa watu wa ukoo ndio wanaolengwa, bila kutumia nahau isiyo ya kawaida ‘kukata uzao’.
- source_word: זַרְעִי
  choice: wazao wangu
  rationale: זֶרַע hapa humaanisha vizazi au watu wanaotokana na Sauli, si mbegu halisi. ‘Wazao wangu’ ni ya asili na sahihi katika muktadha wa ukoo.
- source_word: אַחֲרַי
  choice: baada yangu
  rationale: Maana yake hapa ni ya wakati, yaani baada ya Sauli kuondoka au kufa; tafsiri hii pia huhifadhi ufupi wa Kiebrania.
- source_word: תַּשְׁמִיד
  choice: hutalifuta
  rationale: Hifili ya שמד ina wazo la kuangamiza kabisa. Pamoja na ‘jina,’ ‘kulifuta’ ni Kiswahili cha asili kinachoonyesha kuondoa kumbukumbu na mwendelezo wa ukoo.
- source_word: שְׁמִי
  choice: jina langu
  rationale: Tafsiri halisi inahifadhi wazo la Kiebrania la utambulisho, kumbukumbu, na mwendelezo wa familia.
- source_word: מִבֵּית אָבִי
  choice: katika nyumba ya baba yangu
  rationale: ‘Nyumba ya baba’ ni usemi wa ukoo unaorejelea jamaa au ukoo wa upande wa baba. ‘Katika’ ni ya asili zaidi hapa kwa kitendo cha kulifuta jina miongoni mwa ukoo huo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה katika kiapo
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni יהוה. ‘Yahweh’ huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Nguvu hasi ya אִם katika fomula ya kiapo
  choice: kwamba hutawaangamiza ... wala hutalifuta
  alternative: ikiwa utawaangamiza ... na ikiwa utalifuta
  rationale: Kiebrania hutumia אִם kwa namna ya kifomula katika viapo; muktadha unaonyesha Sauli anamwomba Daudi aape kutofanya mambo hayo. Tafsiri hasi huepuka kuifanya sentensi ionekane kama sharti lisilokamilika, huku tanbihi ikihifadhi muundo halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia ‘niapie,’ ‘wazao,’ na ‘nyumba ya baba yangu’ ili ibaki wazi kwa msomaji wa kawaida huku ikihifadhi lugha ya ukoo na kiapo ya chanzo. Mpangilio wa alama za tanbihi umewekwa karibu na maneno yanayofafanuliwa.
