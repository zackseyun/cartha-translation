  text: So David swore to Saul. Then Saul went to his house[a], but David and his men went up to the stronghold.
translation:
  language: sw
  text: Basi Daudi akamwapia Sauli. Kisha Sauli akaenda nyumbani kwake, lakini Daudi na watu wake wakapanda mpaka ngomeni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na Daudi na watu wake wakapanda mpaka ngomeni.” Kiunganishi cha Kiebrania ni “na”; “lakini” katika andiko kuu kinaweka wazi tofauti iliyopo katika simulizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע דָּוִד לְשָׁאוּל
  choice: Daudi akamwapia Sauli
  rationale: Kitenzi cha Kiebrania katika Niphal kinamaanisha kuapa au kutoa kiapo; muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba Sauli ndiye aliyepokea kiapo hicho.
- source_word: וַיֵּלֶךְ שָׁאוּל אֶל־בֵּיתוֹ
  choice: Kisha Sauli akaenda nyumbani kwake
  rationale: בַּיִת hapa inaweza kuwa ‘nyumba’ au ‘nyumbani’; ‘nyumbani kwake’ ni usemi wa kawaida wa Kiswahili na unaonyesha mahali Sauli aliporudi.
- source_word: וְדָוִד וַאֲנָשָׁיו
  choice: lakini Daudi na watu wake
  rationale: Kiunganishi cha Kiebrania ni ‘na,’ lakini ‘lakini’ kinaweka wazi tofauti ya kimasimulizi kati ya Sauli kwenda nyumbani na Daudi pamoja na watu wake kwenda mahali pa kujikinga.
- source_word: עָלוּ
  choice: wakapanda kwenda
  rationale: Kitenzi עָלָה kina maana ya kuelekea juu; ‘wakapanda kwenda’ huhifadhi mwelekeo huo kwa Kiswahili cha kawaida.
- source_word: הַמְּצוּדָה
  choice: ngomeni
  rationale: Neno hili humaanisha ngome au mahali penye ulinzi; ‘ngomeni’ ni tafsiri fupi na ya kawaida inayofaa mazingira ya Daudi ya kujisitiri.
