base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/013.yaml
  text: May Yahweh judge between me and you[a], and may Yahweh avenge me on you[c][b]; but my hand will not be against you.
translation:
  language: sw
  text: Yahwe ahukumu kati yangu na wewe, na Yahwe anilipizie kisasi juu yako; lakini mkono wangu hautakuwa juu yako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “mkono wangu hautakuwa juu yako”; huu ni usemi wa Kiebrania unaomaanisha kwamba Daudi hatamshambulia Sauli wala kumtendea kwa uhasama.
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: na ahukumu
  rationale: Hali ya kitenzi hapa ina nguvu ya ombi au tamko la kutaka jambo litendeke, si taarifa rahisi kuhusu wakati ujao.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu katika maandishi ya Kiebrania limehifadhiwa badala ya kubadilishwa kuwa cheo.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: kati yangu na wewe
  rationale: Usemi huu unahifadhi lugha ya hukumu na utofautishaji wa wazi kati ya Daudi na Sauli.
- source_word: וּנְקָמַנִי
  choice: anilipizie kisasi
  rationale: Mzizi נקם unamaanisha kulipiza kisasi au kumtetea mtu kwa kumwadhibu aliyemkosea; tafsiri hii haiufifishi uzito wa neno hilo.
- source_word: מִמֶּךָּ
  choice: juu yako
  rationale: Pamoja na נקם, kihusishi kinamtaja mtu ambaye kisasi kitatekelezwa juu yake; huu ni usemi unaoeleweka katika Kiswahili sanifu.
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  choice: lakini mkono wangu hautakuwa dhidi yako
  rationale: Neno ‘mkono’ limehifadhiwa, huku ‘lakini’ ikionyesha tofauti kati ya tendo la Yahwe na uamuzi wa Daudi wa kutomshambulia Sauli.
theological_decisions:
- issue: Kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina la agano moja kwa moja; kulihifadhi kama ‘Yahwe’ humwezesha msomaji kulitambua kuwa jina binafsi, si cheo.
- issue: Ombi la Daudi kuhusu kisasi
  choice: Yahwe anilipizie kisasi juu yako
  alternative: Yahwe anithibitishe kuwa sina hatia mbele yako
  rationale: Neno נקם lina nguvu ya kulipiza kisasi, na mstari unalinganisha tendo hilo la Mungu na kujizuia kwa Daudi. Tafsiri haibadilishi kisasi kuwa uthibitisho wa kutokuwa na hatia tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ombi umehifadhiwa, pamoja na picha ya Kiebrania ya ‘mkono’ na mvutano kati ya kisasi cha Mungu na kujizuia kwa Daudi.
