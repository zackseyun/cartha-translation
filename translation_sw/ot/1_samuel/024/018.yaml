base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/018.yaml
  text: And he said to David[a], “You are more righteous than I, for you have repaid me with good, while I have repaid you with evil.”
translation:
  language: sw
  text: Akamwambia Daudi, “Wewe ni mwenye haki kuliko mimi[a], kwa maana wewe umenitendea mema, lakini mimi nimekutendea mabaya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wewe uko upande wa haki kuliko mimi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־דָּוִד
  choice: Akamwambia Daudi
  rationale: Muundo wa usimulizi wa Kiebrania umetafsiriwa kwa wakati wa usimulizi wa Kiswahili. Kiambishi cha nafsi katika ‘akamwambia’ kinahifadhi kwamba msemaji ametajwa tu kama ‘yeye’ katika kishazi hiki, bila kuongeza jina la Sauli kutoka muktadha.
- source_word: צַדִּיק אַתָּה מִמֶּנִּי
  choice: Wewe ni mwenye haki kuliko mimi
  rationale: ‘Mwenye haki’ huhifadhi uzito wa kimaadili wa צַדִּיק, huku ‘kuliko mimi’ ikionyesha wazi ulinganisho unaotolewa na מִן. Tanbihi inahifadhi maana nyingine inayowezekana ya kuwa upande wa haki.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha sababu inayothibitisha kauli iliyotangulia kwa lugha ya asili na yenye heshima.
- source_word: גְּמַלְתַּנִי הַטּוֹבָה
  choice: umenitendea mema
  rationale: ‘Kutendea’ linafaa kwa גמל katika muktadha huu, na ‘mema’ huhifadhi maana pana ya הַטּוֹבָה pamoja na ulinganifu wake na ‘mabaya.’
- source_word: וַאֲנִי
  choice: lakini mimi
  rationale: Ingawa kiunganishi cha msingi ni ‘na,’ hapa kinaonyesha tofauti dhahiri kati ya mwenendo wa Daudi na wa msemaji; ‘lakini’ huwasilisha tofauti hiyo kwa Kiswahili cha kawaida.
- source_word: גְּמַלְתִּיךָ הָרָעָה
  choice: mimi nimekutendea mabaya
  rationale: Kurudia ‘kutendea’ kunahifadhi urudiaji wa גמל na ulinganifu wa balagha; ‘mabaya’ huhifadhi tofauti ya moja kwa moja dhidi ya ‘mema’ bila kuibana maana kuwa madhara ya kimwili pekee.
theological_decisions:
- issue: Maana ya צַדִּיק katika kauli ya Sauli
  choice: mwenye haki kuliko mimi
  alternative: uko upande wa haki kuliko mimi
  rationale: Matini inaweza kumaanisha ubora wa kimaadili au kuwa na haki katika mgogoro huu. Tafsiri kuu inadumisha uzito mpana wa kimaadili, na tanbihi inahifadhi maana ya kimuktadha bila kuamua kwa lazima kati ya hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Ulinganifu wa ‘umenitendea mema / nimekutendea mabaya’ umehifadhiwa, na hakuna jina la msemaji lililoongezwa kutoka muktadha.
