  text: וַ/יֹּ֤אמֶר דָּוִד֙ לְ/שָׁא֔וּל לָ֧/מָּה תִשְׁמַ֛ע אֶת דִּבְרֵ֥י אָדָ֖ם לֵ/אמֹ֑ר הִנֵּ֣ה דָוִ֔ד מְבַקֵּ֖שׁ רָעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/010.yaml
  text: And David said to Saul[a], “Why do you listen to the words of a man who says, ‘Look[b], David is seeking your harm’?”
translation:
  language: sw
  text: Daudi akamwambia Sauli, “Kwa nini unasikiliza maneno ya mtu[a] anayesema, ‘Tazama, Daudi anatafuta kukudhuru[b]’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maneno ya wanadamu” au “maneno ya watu.” Neno la Kiebrania liko katika umoja, lakini wakati mwingine linaweza kutumiwa kwa maana ya jumla.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi zaidi, “Daudi anatafuta mabaya dhidi yako.” Neno la Kiebrania linaweza kumaanisha uovu au madhara yanayokusudiwa dhidi ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa kusimulia wenye waw-consecutive unaendeleza simulizi; ‘akamwambia’ ni usemi wa kawaida wa Kiswahili unaojumuisha kitendo cha kusema na anayeelekezewa maneno.
- source_word: לָמָּה תִשְׁמַע
  choice: Kwa nini unasikiliza
  rationale: Kitenzi שׁמע hapa kinamaanisha kuyapa maneno uzito au kuyafuata, si kuyasikia kwa masikio tu; ‘unasikiliza’ hudumisha maana hiyo katika swali la moja kwa moja.
- source_word: אֶת דִּבְרֵי אָדָם
  choice: maneno ya mtu
  rationale: אָדָם iko katika umoja na katika muktadha huu inaweza kumaanisha mtu fulani anayetoa shtaka. Tafsiri ya umoja inahifadhi umbo la Kiebrania bila kuficha uwezekano wa maana ya jumla.
- source_word: לֵאמֹר
  choice: anayesema
  rationale: Kitenzi-jina hiki kinaanzisha yaliyosemwa; baada ya ‘maneno ya mtu,’ kishazi ‘anayesema’ ni cha asili katika Kiswahili.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta fikira za msikilizaji. ‘Tazama’ ni la heshima, linaeleweka, na linafaa katika matini ya Biblia.
- source_word: מְבַקֵּשׁ רָעָתֶךָ
  choice: anatafuta njia ya kukudhuru
  rationale: Kivumishi-tendaji מְבַקֵּשׁ kinaonyesha jitihada inayoendelea, huku רָעָה hapa ikimaanisha madhara yanayokusudiwa dhidi ya Sauli. Usemi huu ni wa asili katika Kiswahili na hauongezi hukumu ya kimaadili isiyolazimishwa na muktadha.
theological_decisions:
- issue: Maana ya אָדָם katika umoja
  choice: mtu
  alternative: watu / mwanadamu kwa maana ya jumla
  rationale: Umbo la Kiebrania ni la umoja, na muktadha unaruhusu kurejelea mshtaki mmoja. Hata hivyo, kwa kuwa אָדָם wakati mwingine huwa na maana ya jumla, uwezekano huo umeonyeshwa katika tanbihi badala ya kuondolewa kimya kimya.
- issue: Maana ya רָעָה dhidi ya Sauli
  choice: kukudhuru
  alternative: kutafuta mabaya yako / kukutendea uovu
  rationale: Katika shtaka hili, neno linaweza kueleza madhara au uovu unaolengwa kwa Sauli. ‘Kukudhuru’ huwasilisha maana ya kimuktadha bila kulazimisha kwamba mkazo uko hasa katika ubaya wa kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima, wa sasa, na unaosomeka kwa urahisi. ‘Akamwambia’ hudumisha mwendo wa simulizi, na ‘anatafuta njia ya kukudhuru’ huhifadhi hali inayoendelea ya kitenzi huku ikiepuka usemi usio wa kawaida kama ‘anatafuta madhara yako.’
