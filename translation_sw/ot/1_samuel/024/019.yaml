base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/019.yaml
  text: 'And you have declared today what good you have done to me: when Yahweh gave me into your hand[b][a], you did not kill me.'
translation:
  language: sw
  text: 'Nawe leo umeonyesha wema ulionitendea[a]: Yahweh aliponikabidhi mikononi mwako[b], hukuniua.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umefanya ijulikane leo mema uliyonitendea.”
    reason: Kitenzi cha Kiebrania kinaweza kumaanisha ‘kueleza,’ ‘kutangaza,’ au ‘kufanya ijulikane’; katika muktadha huu kinaweza pia kueleweka kuwa tendo la Daudi limeonyesha wema wake.
  - marker: b
    text: Kiebrania, “Yahweh aliponifungia katika mkono wako”; yaani, aliponikabidhi au kuniweka chini ya mamlaka yako.
    reason: Kitenzi סגר kwa msingi kina wazo la kufunga, lakini hapa ni nahau ya kumkabidhi mtu mikononi mwa mwingine.
lexical_decisions:
- source_word: הִגַּדְתָּ
  choice: umeonyesha
  rationale: Kitenzi נגד katika Hiphil kwa kawaida ni ‘kueleza, kutangaza, kufanya ijulikane’; katika muktadha huu tendo la Daudi limeudhihirisha wema wake. ‘Umeonyesha’ ni Kiswahili cha kawaida na kinafaa katika muundo huu, huku tanbihi ikihifadhi maana ya karibu zaidi ya ‘umefanya ujulikane.’
- source_word: הַיּוֹם
  choice: leo
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kielezi cha wakati.
- source_word: עָשִׂיתָה אִתִּי טוֹבָה
  choice: wema ulionitendea
  rationale: Kirai hiki kihalisi kinamaanisha mema aliyomtendea Saul. ‘Wema ulionitendea’ ni cha asili katika Kiswahili na huhifadhi wazo la tendo jema bila kulifanya neno hilo kuwa istilahi maalumu ya kiteolojia.
- source_word: סִגְּרַנִי
  choice: aliponitia
  rationale: Katika muktadha huu סגר humaanisha kumweka mtu chini ya mamlaka ya mwingine au kumkabidhi. Pamoja na ‘mikononi mwako,’ ‘aliponitia’ huhifadhi sitiari ya Kiebrania kwa Kiswahili kinachoeleweka.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi יהוה limetafsiriwa kwa kulinakili kama ‘Yahweh,’ badala ya kulibadilisha kuwa cheo.
- source_word: בְּיָדְךָ
  choice: mikononi mwako
  rationale: Kiswahili hutumia kwa kawaida ‘mikononi mwa’ kuonyesha kuwa mtu amewekwa chini ya uwezo au mamlaka ya mwingine; wingi wa kiidioma unaleta maana ya umoja wa Kiebrania kwa kawaida.
- source_word: וְלֹא הֲרַגְתָּנִי
  choice: hukuniua
  rationale: Hii ni tafsiri fupi, ya moja kwa moja, na ya kawaida ya kitenzi kilichokanushwa.
theological_decisions:
- issue: Utafsiri wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ya Kiebrania inatumia jina la Mungu moja kwa moja. ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida; ‘mikononi mwako’ huhifadhi sitiari ya Kiebrania kwa nahau ya kawaida ya Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu.
