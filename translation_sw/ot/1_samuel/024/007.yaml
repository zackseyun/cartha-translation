base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/007.yaml
  text: And he said to his men[a], “Far be it from me, because of Yahweh, that I should do this thing to my lord, Yahweh’s anointed, to stretch out my hand against him, for he is Yahweh’s anointed.”
translation:
  language: sw
  text: Naye akawaambia watu wake, “Hasha kwangu, kwa sababu ya Yahwe, nimfanyie bwana wangu, mtiwa-mafuta wa Yahwe, jambo hili la kunyoosha mkono wangu dhidi yake, kwa maana yeye ni mtiwa-mafuta wa Yahwe.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: Hasha kwangu mbele za Yahwe
  rationale: Kauli hii ya Kiebrania inaonyesha kukataa kwa nguvu na kuchukia tendo hilo kwa sababu ya uhusiano wa Daudi na Yahwe. “Mbele za Yahwe” ni Kiswahili cha heshima kinachohifadhi uhusiano huo bila kuifanya sentensi isikike kana kwamba kitu kinatoka mahali fulani.
- source_word: אִם אֶעֱשֶׂה
  choice: kufanya
  rationale: Baada ya חָלִילָה, אִם ni sehemu ya kauli ya kukataa kwa nguvu, si sharti la kawaida la “ikiwa”; kwa hiyo infinitivu ya Kiswahili inakamilisha kwa kawaida kauli “hasha kwangu.”
- source_word: הַדָּבָר הַזֶּה
  choice: jambo hili
  rationale: דָּבָר hapa ni tendo linalofikiriwa; “jambo hili” huhifadhi upana wa neno la Kiebrania bila kulifafanua kupita kiasi.
- source_word: לַאדֹנִי
  choice: kwa bwana wangu
  rationale: Hili ni jina la heshima ambalo Daudi anamtumia Sauli. “Bwana wangu” huhifadhi unyenyekevu wake, huku uhasama wa tendo ukielezwa baadaye.
- source_word: לִמְשִׁיחַ יְהוָה
  choice: mtiwa-mafuta wa Yahwe
  rationale: מָשִׁיחַ hapa humtaja Sauli kama mfalme aliyewekwa wakfu kwa kutiwa mafuta na Yahwe. “Mtiwa-mafuta” huhifadhi picha na hadhi hiyo bila kuingiza maana ya baadaye ya kimasiya isiyolazimishwa na muktadha.
- source_word: לִשְׁלֹחַ יָדִי בּוֹ
  choice: kunyoosha mkono wangu dhidi yake
  rationale: Tafsiri hii huhifadhi picha halisi ya kunyoosha mkono na pia huonyesha wazi kuwa tendo hilo lingekuwa la kumdhuru.
- source_word: כִּי מְשִׁיחַ יְהוָה הוּא
  choice: kwa maana yeye ni mtiwa-mafuta wa Yahwe
  rationale: כִּי inatoa sababu ya Daudi kukataa. Kurudia cheo hicho, kama Kiebrania kinavyofanya, kunahifadhi msisitizo wa hoja yake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe” badala ya kubadilishwa kwa cheo, hivyo kuhifadhi matumizi ya jina binafsi katika chanzo.
theological_decisions:
- issue: Maana ya מְשִׁיחַ inapomtaja Sauli
  choice: mtiwa-mafuta wa Yahwe
  alternative: Masihi wa Yahwe
  rationale: Katika muktadha huu neno humaanisha Sauli akiwa mfalme aliyewekwa wakfu kwa kutiwa mafuta. “Masihi” lingeweza kuleta maana za baadaye za kikristolojia ambazo kifungu hiki chenyewe hakilazimishi.
- issue: Uhusiano wa kauli חָלִילָה לִּי na Yahwe
  choice: Hasha kwangu mbele za Yahwe
  alternative: Yahwe na apishilie mbali nisifanye
  rationale: Kiebrania kinaweza kutafsiriwa kwa kauli ya jadi inayomfanya Yahwe kuwa mwenye kuzuia tendo, lakini muundo wenyewe kwanza unaonyesha kukataa kwa Daudi kwa nguvu katika uhusiano wake na Yahwe. Tafsiri kuu huhifadhi mvutano huo bila kuongeza wazi wakala ambaye sarufi haimtaji moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Hasha” na “mbele za Yahwe” vina uzito wa kiapo bila kuwa vya kizamani kupita kiasi; “mtiwa-mafuta” ni wazi na huhifadhi taswira ya chanzo.
