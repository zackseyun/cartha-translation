base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/008.yaml
  text: David restrained his men with words and did not allow them to rise up against Saul[a]. Then Saul rose from the cave and went on his way.
translation:
  language: sw
  text: Daudi akawazuia watu wake kwa maneno, wala hakuwaruhusu wainuke dhidi ya Sauli.[a] Kisha Sauli akainuka kutoka pangoni, akaendelea na safari yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Daudi akawakemea watu wake vikali kwa maneno.” Kitenzi cha Kiebrania ni nadra, na huenda kina maana kali zaidi kuliko kuwazuia tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁסַּע
  choice: akawazuia
  rationale: Kitenzi hiki ni nadra na maana yake hapa si wazi kabisa. Muktadha unaonyesha kwamba Daudi aliwazuia watu wake wasimshambulie Sauli; ‘akawazuia’ linaeleza matokeo hayo bila kuingiza taswira isiyo hakika, huku tanbihi ikihifadhi uwezekano wa maana kali zaidi.
- source_word: אֲנָשָׁיו
  choice: watu wake
  rationale: Katika muktadha huu neno linawahusu wanaume waliokuwa wafuasi wa Daudi. ‘Watu wake’ ni Kiswahili cha kawaida na cha asili kwa kundi lililo chini yake.
- source_word: בַּדְּבָרִים
  choice: kwa maneno
  rationale: 'Kirai kinaonyesha njia aliyotumia Daudi kuwazuia: aliingilia kati kwa kusema. ‘Kwa maneno’ kinahifadhi maana hiyo ya chombo.'
- source_word: וְלֹא נְתָנָם
  choice: wala hakuwaruhusu
  rationale: Muundo wa נתן pamoja na kitenzi-jina una maana ya kuruhusu. Tafsiri hii ni wazi, ya sasa, na inaendeleza mkazo wa kwamba Daudi alizuia tendo hilo.
- source_word: לָקוּם אֶל־שָׁאוּל
  choice: wainuke dhidi ya Sauli
  rationale: Katika muktadha huu קום pamoja na אֶל linaashiria kuchukua hatua ya uhasama. ‘Wainuke dhidi ya’ linahifadhi taswira ya Kiebrania na maana ya kupingana bila kufafanua moja kwa moja kuwa walimshambulia.
- source_word: קָם מֵהַמְּעָרָה
  choice: akainuka kutoka pangoni
  rationale: Tafsiri hii inadumisha urudiaji wa kitenzi קום kilichotumiwa pia kuhusu watu wa Daudi. ‘Kutoka pangoni’ ni muundo wa asili katika Kiswahili.
- source_word: וַיֵּלֶךְ בַּדָּרֶךְ
  choice: akaendelea na safari yake
  rationale: Kirai halisi ni kwenda katika njia. Katika simulizi hili, ‘akaendelea na safari yake’ linaeleza kwa Kiswahili cha kawaida kwamba Sauli aliondoka na kuendelea alikokuwa akienda.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa kawaida, wa heshima, na unaoeleweka kwa wasomaji wa leo. Urudiaji wa ‘kuinuka’ umehifadhiwa ili kuakisi uhusiano wa maneno katika Kiebrania; utata wa kitenzi nadra umewekwa wazi katika tanbihi.
