base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/003.yaml
  text: And the lamp of God had not yet gone out[a], and Samuel was lying down in the temple of Yahweh, where the ark of God was.
translation:
  language: sw
  text: Taa ya Mungu ilikuwa bado haijazimika, na Samweli alikuwa amejilaza katika hekalu[a] la Yahwe, ambamo sanduku la Mungu lilikuwamo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali patakatifu pa Yahwe.” Neno la Kiebrania heikhal linaweza kumaanisha hekalu au mahali patakatifu; hapa linataja makao ya Yahwe huko Shilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵר אֱלֹהִים
  choice: taa ya Mungu
  rationale: Neno נֵר humaanisha taa, si mwanga kwa ujumla. Muundo “ya Mungu” unadumisha uhusiano wa moja kwa moja wa maneno ya Kiebrania na mwangwi wake wa ibada katika mahali patakatifu.
- source_word: טֶרֶם יִכְבֶּה
  choice: ilikuwa bado haijazimika
  rationale: טֶרֶם huonyesha kuwa tendo halikuwa limetokea bado, na כבה kuhusu taa humaanisha kuzimika. Kauli hii ni ya kawaida katika Kiswahili na inadumisha maana ya wakati.
- source_word: שֹׁכֵב
  choice: alikuwa amelala
  rationale: Kauli hii huonyesha hali ya Samweli ya kuwa amelala. Haiongezi kwa lazima dai kwamba alikuwa tayari usingizini, ingawa katika Kiswahili neno “amelala” linaweza kueleweka kwa namna zote mbili kulingana na muktadha.
- source_word: הֵיכַל יְהוָה
  choice: hekalu la Yahwe
  rationale: הֵיכָל inaweza kumaanisha hekalu, jumba, au mahali patakatifu. Katika muktadha huu wa ibada huko Shilo, “hekalu” ni tafsiri ya kawaida na inayoeleweka; uwezekano wa “mahali patakatifu” umehifadhiwa katika tanbihi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: אֲשֶׁר שָׁם אֲרוֹן אֱלֹהִים
  choice: ambamo sanduku la Mungu lilikuwamo
  rationale: Kishazi hiki kinatambulisha mahali kwa kuwapo kwa sanduku. “Ambamo ... lilikuwamo” ni Kiswahili fasaha kinachodumisha maana ya mahali ya שָׁם, huku “sanduku la Mungu” kikihifadhi muundo wa Kiebrania.
theological_decisions:
- issue: Tafsiri ya הֵיכַל יְהוָה katika mazingira ya mahali pa ibada kabla ya kujengwa kwa hekalu la Sulemani
  choice: hekalu la Yahwe
  alternative: mahali patakatifu pa Yahwe
  rationale: Ingawa hapa ni mahali pa ibada huko Shilo, kabla ya hekalu la Sulemani, הֵיכָל inaweza kumaanisha “hekalu.” Tafsiri hiyo haihitaji kudhani kuwa jengo linalotajwa ni hekalu la baadaye la Yerusalemu. “Mahali patakatifu” pia ni tafsiri halali, kwa hiyo imeonyeshwa katika tanbihi ili kuepuka kuondoa mvutano wa kihistoria na wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida na unaoeleweka. Muundo wa sentensi unadumisha mwendelezo wa simulizi ya Kiebrania. Alama ya tanbihi imewekwa baada ya neno linalohusika, “Yahwe,” katika kirai “hekalu la Yahwe.”
