base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/017.yaml
  text: And he said[a], “What is the word that he spoke to you? Please do not hide it from me. May God do so to you, and more also, if you hide from me a word of all the word that he spoke to you.”
translation:
  language: sw
  text: Akasema, “Ni neno gani alilosema kwako? Tafadhali usinifiche jambo hilo. Mungu akutendee hivyo, na zaidi ya hayo, ikiwa utanificha hata neno moja katika yote aliyosema kwako.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa ukaribu zaidi na muundo wa Kiebrania: “ikiwa utanificha neno katika neno lote alilosema kwako”; maana yake ni kutoficha sehemu yoyote ya yale aliyosema.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הַדָּבָר
  choice: Ni neno gani
  rationale: “Neno” linadumisha uhusiano wa kifasihi na usemi wa Mungu katika muktadha, ingawa דָּבָר pia inaweza kumaanisha jambo au ujumbe.
- source_word: דִּבֶּר אֵלֶיךָ
  choice: alilosema kwako
  rationale: Tafsiri hii inadumisha kitenzi cha kusema na muundo wa “neno ... alilosema,” huku ikiacha rejeo la mtendaji kuwa la muktadha kama lilivyo katika Kiebrania.
- source_word: אַל נָא תְכַחֵד מִמֶּנִּי
  choice: Tafadhali usinifiche
  rationale: “Tafadhali” linaonyesha chembe ya ombi נָא, na “usinifiche” linawasilisha maana ya כחד kwa Kiswahili cha kawaida.
- source_word: כֹּה יַעֲשֶׂה לְּךָ אֱלֹהִים וְכֹה יוֹסִיף
  choice: Mungu na akutendee hivyo, na zaidi pia
  rationale: Hii ni kauli ya kiapo yenye laana isiyotajwa wazi. Tafsiri inadumisha uzito na kutokutajwa kwa adhabu mahususi bila kuwa ngumu kupita kiasi katika Kiswahili.
- source_word: תְּכַחֵד מִמֶּנִּי דָּבָר מִכָּל הַדָּבָר
  choice: utanificha hata neno moja katika yote
  rationale: “Hata neno moja” linaonyesha kutoficha sehemu yoyote, na “katika yote” linafanya sentensi iwe ya kawaida kwa Kiswahili bila kurudia kwa namna isiyoeleweka “neno katika neno lote.”
theological_decisions:
- issue: Maana ya אֱלֹהִים katika kauli ya kiapo
  choice: Mungu
  alternative: miungu
  rationale: Katika muktadha huu Eli anamwomba Mungu wa Israeli kuwa shahidi wa kiapo; umbo la Kiebrania hutumiwa kawaida kumrejelea Mungu mmoja, hivyo “miungu” lingetoa maana potovu ya ushirikina.
- issue: Nguvu ya kauli ya kiapo yenye laana
  choice: Mungu na akutendee hivyo, na zaidi pia
  alternative: Mungu atakuadhibu vikali
  rationale: Chanzo hakitaji adhabu yenyewe. Tafsiri haifafanui laana ambayo Kiebrania limeiacha bila kutajwa, hivyo inadumisha uzito na utata wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kiapo umehifadhiwa bila kuongeza adhabu ambayo chanzo hakitaji; marudio magumu ya דָּבָר yameelezwa katika tanbihi.
