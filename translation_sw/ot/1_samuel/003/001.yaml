  text: וְ/הַ/נַּ֧עַר שְׁמוּאֵ֛ל מְשָׁרֵ֥ת אֶת יְהוָ֖ה לִ/פְנֵ֣י עֵלִ֑י וּ/דְבַר יְהוָ֗ה הָיָ֤ה יָקָר֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין חָז֖וֹן נִפְרָֽץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/001.yaml
  text: The boy Samuel was ministering to Yahweh before Eli[a], and the word of Yahweh was rare in those days; visions were not widespread.
translation:
  language: sw
  text: Mvulana Samweli alikuwa akimtumikia Yahwe mbele ya Eli, na neno la Yahwe lilikuwa nadra siku hizo; maono hayakuwa ya kawaida[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hapakuwa na maono ya mara kwa mara,” au, kwa karibu zaidi na taswira ya Kiebrania, “maono hayakuwa yakizuka.” Usemi wa Kiebrania unaonyesha kwamba maono ya ufunuo hayakuwa ya kawaida wala hayakuenea waziwazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/נַּעַר
  choice: Kijana
  rationale: הַנַּעַר humaanisha mvulana au kijana. “Kijana” ni la kawaida na lenye heshima katika Kiswahili, bila kuongeza kiunganishi cha wakati kisichokuwamo wazi katika chanzo.
- source_word: מְשָׁרֵת
  choice: alikuwa akimhudumia
  rationale: Umbo la kushiriki linaonyesha huduma iliyoendelea; “alikuwa akimhudumia” huhifadhi hali hiyo na maana ya huduma ya kidini.
- source_word: אֶת יְהוָה
  choice: Yahwe
  rationale: Ni yule anayehudumiwa, na jina la agano יהוה limetoholewa kuwa “Yahwe.”
- source_word: לִפְנֵי עֵלִי
  choice: mbele ya Eli
  rationale: Huhifadhi maana ya msingi ya לִפְנֵי, yaani mbele ya au katika uwepo wa Eli, huku muktadha ukiruhusu wazo la usimamizi wake.
- source_word: וּ/דְבַר יְהוָה
  choice: na neno la Yahwe
  rationale: Tafsiri wazi ya kirai cha Kiebrania inayodumisha istilahi ya ufunuo wa Mungu.
- source_word: יָקָר
  choice: lilikuwa nadra
  rationale: Ingawa יָקָר inaweza kumaanisha kitu cha thamani, hapa muktadha unaonyesha kutokea kwa uchache.
- source_word: בַּ/יָּמִים הָ/הֵם
  choice: siku hizo
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kipindi kinachotajwa.
- source_word: אֵין חָזוֹן נִפְרָץ
  choice: maono hayakuwa yakienea
  rationale: חָזוֹן inaweza kutumiwa kwa maana ya pamoja, na נִפְרָץ hudokeza kuvuma, kuzuka, au kuenea; tafsiri hii huhifadhi taswira na wazo kwamba maono ya ufunuo hayakuwa ya kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia moja kwa moja jina la agano יהוה; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya maono kutokuwa נִפְרָץ
  choice: maono hayakuwa yakienea
  alternative: hapakuwa na maono ya mara kwa mara
  rationale: Tafsiri iliyochaguliwa inadumisha picha ya Kiebrania ya maono kutoenea, huku tanbihi ikieleza kwamba maana yake ni kuwa maono ya ufunuo hayakuwa ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi mwendelezo wa simulizi na uzito wa lugha ya ufunuo bila kutumia istilahi za kimadhehebu.
