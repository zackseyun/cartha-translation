base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/014.yaml
  text: 'Therefore I have sworn to the house of Eli: the iniquity of Eli’s house shall never be atoned for by sacrifice or offering[a][b].'
translation:
  language: sw
  text: 'Kwa hiyo nimeapa kuhusu nyumba ya Eli: uovu wa nyumba ya Eli hautapata upatanisho kamwe kwa dhabihu wala kwa sadaka[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uovu wa nyumba ya Eli hakika hautapata upatanisho.” Kiebrania hutumia nahau ya kiapo yenye neno “ikiwa” baada ya “nimeapa” ili kusisitiza ukanushaji mkali.
    reason: lexical_alternative
  - marker: b
    text: “Sadaka” hapa hutafsiri neno la Kiebrania minchah, ambalo mara nyingi humaanisha hasa “sadaka ya nafaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  choice: Kwa hiyo
  rationale: Huonyesha kwamba kiapo hiki ni matokeo ya hukumu iliyotangulia kutangazwa, kwa Kiswahili cha kawaida na chenye uzito.
- source_word: נִשְׁבַּעְתִּי
  choice: nimeapa
  rationale: Kauli ya wakati timilifu inaonyesha kiapo kilichofanywa ambacho bado kina nguvu; “nimeapa” huhifadhi maana hiyo na uzito wake.
- source_word: לְבֵית עֵלִי
  choice: kuhusu nyumba ya Eli
  rationale: Kihusishi kinaonyesha nyumba ya Eli kuwa mlengwa wa kiapo. “Kuhusu” ni wazi kwa Kiswahili na hakidokezi kwamba kiapo kilielekezwa kwao kama wasikilizaji.
- source_word: אִם
  choice: hautafanyiwa ... kamwe
  rationale: Baada ya kitenzi cha kuapa, אִם ni sehemu ya nahau ya kiapo inayosisitiza ukanushaji mkali, si sharti la kawaida la “ikiwa.”
- source_word: יִתְכַּפֵּר
  choice: hautafanyiwa upatanisho
  rationale: Huhifadhi maana ya kuondolewa kwa kosa au hatia katika muktadha wa dhabihu bila kuongeza hitimisho pana la kimafundisho.
- source_word: עֲוֺן
  choice: uovu
  rationale: Neno la Kiebrania linaweza kuhusisha tendo baya pamoja na hatia yake. “Uovu” huhifadhi uzito wa kosa, ingawa wigo huo wote hauwezi kuonyeshwa kikamilifu kwa neno moja la Kiswahili.
- source_word: בֵּית עֵלִי
  choice: nyumba ya Eli
  rationale: Huhifadhi picha ya Kiebrania ya ukoo au familia ya Eli na pia marudio ya makusudi katika mstari.
- source_word: בְּזֶבַח
  choice: kwa dhabihu
  rationale: “Kwa” huonyesha njia ambayo haiwezi kuleta upatanisho katika hukumu hii.
- source_word: וּבְמִנְחָה
  choice: wala kwa sadaka
  rationale: “Sadaka” ni neno pana na la kawaida; maana mahususi inayowezekana ya sadaka ya nafaka imehifadhiwa katika tanbihi.
- source_word: עַד עוֹלָם
  choice: kamwe
  rationale: Katika sentensi hasi, “kamwe” huwasilisha kwa Kiswahili cha kawaida hali ya kudumu inayokusudiwa na kifungu hiki.
theological_decisions:
- issue: Upeo wa hukumu juu ya nyumba ya Eli
  choice: Mstari unasema kwamba dhabihu na sadaka hazitaupatia uovu wa nyumba ya Eli upatanisho kamwe.
  alternative: Kauli hiyo inaweza kufasiriwa kwa upeo mwembamba kuwa inakataa tu ufanisi wa njia hizi za ibada, bila kutoa tamko la jumla kuhusu kila uwezekano wa rehema ya Mungu.
  rationale: Tafsiri inashikilia dai la moja kwa moja la maandishi kuhusu dhabihu na sadaka, lakini hailipanui kuwa hitimisho la kimafundisho lisilotamkwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na wenye uzito wa kiapo. “Nyumba ya Eli” imehifadhiwa badala ya “familia ya Eli” ili kudumisha taswira ya ukoo katika chanzo; “upatanisho” huhifadhi msamiati wa kidini huku tanbihi zikieleza nahau ya kiapo na maana inayowezekana ya minchah.
