base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/021.yaml
  text: And Yahweh continued to appear at Shiloh[a], for Yahweh revealed himself to Samuel at Shiloh by the word of Yahweh.
translation:
  language: sw
  text: Yahweh aliendelea kujidhihirisha huko Shilo, kwa maana Yahweh alijifunua kwa Samweli huko Shilo kwa neno la Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupitia neno la Yahweh.”
    reason: 'Kihusishi ב katika בִּדְבַר יְהוָה kinaweza kuonyesha njia au chombo: “kwa” au “kupitia.”'
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: akaendelea
  rationale: Muundo יָסַף pamoja na kitenzi-jina hapa unaonyesha tendo lililoendelea au lililorudiwa; “akaendelea” ni Kiswahili cha kawaida kinachobeba wazo hilo.
- source_word: לְהֵרָאֹה
  choice: kujitokeza
  rationale: Nifali ya ראה hapa inaeleza udhihirisho wa Mungu. “Kujitokeza” ni ya asili katika Kiswahili na haielezi kwa lazima namna kamili ya udhihirisho huo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: בְשִׁלֹה / בְשִׁלוֹ
  choice: huko Shilo
  rationale: Kihusishi ב ni cha mahali; “huko Shilo” ni usemi wa kawaida wa Kiswahili kwa eneo lililotajwa.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inaanzisha maelezo yanayotoa msingi wa kauli iliyotangulia.
- source_word: נִגְלָה
  choice: alijifunua
  rationale: Nifali ya גלה ina maana ya kujidhihirisha au kujifunua. “Alijifunua” inadumisha tofauti fulani na לְהֵרָאֹה iliyotafsiriwa “kujitokeza.”
- source_word: אֶל שְׁמוּאֵל
  choice: kwa Samweli
  rationale: Hii ni tafsiri ya kawaida ya mwelekeo wa ufunuo kwa Samweli.
- source_word: בִּדְבַר יְהוָה
  choice: kwa neno la Yahweh
  rationale: Kihusishi ב kinaweza kuonyesha njia au chombo cha ufunuo; usemi huu unahifadhi ufupi na kiasi cha utata wa Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova au BWANA
  rationale: Andiko linatumia jina binafsi la Mungu; “Yahweh” linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Namna ya udhihirisho wa Mungu
  choice: Kudumisha lugha ya kujitokeza na kujifunua kwa neno bila kufafanua zaidi namna yake
  alternative: Kuutaja kuwa ono tu au kutokea kwa umbo la mwili
  rationale: Kiebrania kinazungumzia kujitokeza na kujifunua kwa neno la Yahweh, lakini hakifafanui hapa ikiwa tukio hilo lilikuwa ono tu au udhihirisho wa kimwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida huku ukihifadhi marudio ya “Shilo” na “Yahweh” yaliyomo katika Kiebrania.
