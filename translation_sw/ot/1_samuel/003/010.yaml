  text: וַ/יָּבֹ֤א יְהוָה֙ וַ/יִּתְיַצַּ֔ב וַ/יִּקְרָ֥א כְ/פַֽעַם בְּ/פַ֖עַם שְׁמוּאֵ֣ל שְׁמוּאֵ֑ל וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ דַּבֵּ֔ר כִּ֥י שֹׁמֵ֖עַ עַבְדֶּֽ/ךָ־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/010.yaml
  text: Then Yahweh came and stood there[a], and called as at the other times, “Samuel, Samuel!” And Samuel said, “Speak, for your servant is listening.”
translation:
  language: sw
  text: Kisha Yahwe akaja, akasimama, akaita kama hapo awali[a], “Samweli, Samweli!” Naye Samweli akasema, “Sema, kwa maana mtumishi wako anasikiliza.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama katika nyakati zilizotangulia.” Nahau ya Kiebrania inalinganisha mwito huu na miito iliyotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la Mungu lililoandikwa katika Kiebrania, kwa tahajia ya kawaida na inayosomeka kwa Kiswahili.
- source_word: וַיָּבֹא
  choice: akaja
  rationale: Kitenzi בוא kinaeleza kuja; ‘akaja’ ni tafsiri ya moja kwa moja na ya kawaida katika simulizi.
- source_word: וַיִּתְיַצַּב
  choice: akasimama pale
  rationale: Kauli ya kujirejelea ya יצב inaonyesha kusimama au kuchukua mahali; ‘pale’ huonyesha uwepo katika eneo la tukio bila kupunguza uhalisi wa maelezo.
- source_word: וַיִּקְרָא
  choice: akaita
  rationale: Katika muktadha huu קרא ni kumwita Samweli kwa sauti; ‘akaita’ ni ya asili na haiongezi wazo la kupaza sauti kwa nguvu.
- source_word: כְפַעַם בְּפַעַם
  choice: kama mara zilizotangulia
  rationale: Nahau hii inalinganisha mwito huu na miito iliyotangulia katika simulizi; tafsiri hii inaeleza ulinganisho huo kwa Kiswahili cha kawaida.
- source_word: שְׁמוּאֵל שְׁמוּאֵל
  choice: Samweli! Samweli!
  rationale: Kurudiwa kwa jina kumehifadhiwa ili kuonyesha mwito wa moja kwa moja na wenye msisitizo.
- source_word: דַּבֵּר
  choice: Sema
  rationale: Amri hii ni fupi na ya moja kwa moja; ‘Sema’ inafaa kwa Kiswahili kuliko kuongeza maneno yasiyopo katika chanzo.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inatanguliza sababu ya utayari wa Samweli kusikia.
- source_word: שֹׁמֵעַ
  choice: anasikiliza
  rationale: Umbo la kitenzi linaonyesha hali inayoendelea ya kuwa makini; ‘anasikiliza’ linaonyesha usikivu wa makusudi kuliko ‘anasikia’.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Katika kauli hii ya unyenyekevu kwa Mungu, neno עבד linaonyesha huduma na utiifu; ‘mtumishi wako’ ndilo chaguo linalofaa kimuktadha.
theological_decisions:
- issue: Maelezo ya Yahwe kwa lugha ya kibinadamu
  choice: Kuhifadhi maneno halisi ya simulizi, ‘akaja, akasimama pale’
  alternative: ‘akatokea’ au ‘akajidhihirisha pale’
  rationale: Kiebrania kinaeleza tendo la Yahwe kwa namna thabiti na ya kibinafsi. Tafsiri hailainishi wala kufafanua kimafundisho maelezo hayo.
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: ‘Yahwe’ linawakilisha jina lililo katika matini ya Kiebrania na kulifanya litambulike kama jina maalumu, bila kuingiza desturi ya dhehebu fulani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa simulizi ni mwepesi kueleweka; mwito uliorudiwa na jibu fupi la Samweli vimehifadhi uzito wa kifungu.
