  text: וַ/יֹּ֨אמֶר עֵלִ֣י לִ/שְׁמוּאֵל֮ לֵ֣ךְ שְׁכָב֒ וְ/הָיָה֙ אִם יִקְרָ֣א אֵלֶ֔י/ךָ וְ/אָֽמַרְתָּ֙ דַּבֵּ֣ר יְהוָ֔ה כִּ֥י שֹׁמֵ֖עַ עַבְדֶּ֑/ךָ וַ/יֵּ֣לֶךְ שְׁמוּאֵ֔ל וַ/יִּשְׁכַּ֖ב בִּ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/009.yaml
  text: Then Eli said to Samuel[a], “Go, lie down, and if he calls to you, you shall say, ‘Speak, Yahweh, for your servant is listening.’” So Samuel went and lay down in his place.
translation:
  language: sw
  text: Ndipo Eli akamwambia Samueli, “Nenda ukalale. Na ikiwa atakuita, utasema, ‘Sema, Yahwe, kwa maana mtumishi wako anasikiliza.’” Basi Samueli akaenda akalala mahali pake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo Eli akamwambia
  rationale: Wayyiqtol inaendeleza mfuatano wa simulizi; “Ndipo” na “akamwambia” ni mtiririko wa kawaida wa Kiswahili na pia huonyesha kwamba maneno yanaelekezwa kwa Samueli.
- source_word: לֵךְ שְׁכָב
  choice: Nenda ukalale
  rationale: Vitenzi viwili vya amri vimetafsiriwa kwa muundo wa kawaida wa Kiswahili bila kuongeza wazo lisilo wazi la ‘kulala usingizi.’
- source_word: וְהָיָה אִם
  choice: Na ikiwa
  rationale: Muundo huu unaanzisha sharti; “ikiwa” huhifadhi hali ya uwezekano kuliko “atakapokuita,” ambayo ingeifanya iwe ya hakika zaidi.
- source_word: יִקְרָא אֵלֶיךָ
  choice: atakuita
  rationale: Kitenzi kina kiima cha nafsi ya tatu ya kiume kisichotajwa wazi. Muktadha unamwelekeza msomaji kwa Yahwe, lakini tafsiri haiongezi jina lake ndani ya kishazi hiki.
- source_word: וְאָמַרְתָּ
  choice: utasema
  rationale: Kitenzi baada ya sharti kinaonyesha agizo la matokeo; wakati ujao katika Kiswahili una nguvu ya maagizo hapa.
- source_word: דַּבֵּר
  choice: Sema
  rationale: Ni amri ya moja kwa moja na ya kawaida, bila kuongeza maelezo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo; umbo “Yahwe” linaendana na tahajia ya Kiswahili.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha sababu ya ombi kwa lugha yenye hadhi na iliyo wazi.
- source_word: שֹׁמֵעַ
  choice: anasikiliza
  rationale: Hali ya kuendelea ya kitenzi kishirikishi inaonyesha usikivu wa makusudi, si kusikia sauti tu.
- source_word: עַבְדֶּךָ
  choice: mtumishi wako
  rationale: Katika usemi wa unyenyekevu mbele za Mungu, “mtumishi” linafaa kuliko “mtumwa” bila kufuta dhana ya kujitiisha.
- source_word: וַיֵּלֶךְ ... וַיִּשְׁכַּב
  choice: Basi Samueli akaenda akalala
  rationale: Vitenzi vya mfuatano vinaendeleza simulizi na kuonyesha utekelezaji wa agizo la Eli.
- source_word: בִּמְקוֹמוֹ
  choice: mahali pake
  rationale: Huhifadhi maana ya mahali palipomhusu Samueli bila kuongeza kwamba palikuwa mahali pake pa kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi YHWH. “Yahwe” hulihifadhi kama jina na huepuka kulibadilisha kimya kuwa cheo.
- issue: Kiima kisichotajwa cha יִקְרָא
  choice: atakuita
  alternative: mtu akikuita
  rationale: Kiebrania kina kiima cha nafsi ya tatu ya kiume bila kulitaja jina. Muktadha unaonyesha Eli amemtambua mwitaji kuwa Yahwe; “atakuita” huhifadhi kiima hicho bila kukifanya kisicho maalumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na hadhi inayofaa maandiko. Majina yametolewa kwa maumbo ya Kiswahili “Eli,” “Samueli,” na “Yahwe.” Hakuna tanbihi iliyohitajika kwa kuwa jina la Mungu limetolewa moja kwa moja katika maandishi.
