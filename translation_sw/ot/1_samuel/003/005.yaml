  text: He ran to Eli and said, “Here I am, because you called me.” But he said, “I did not call. Go back; lie down.” So he went and lay down.
translation:
  language: sw
  text: Akakimbia kwa Eli, akasema, “Mimi hapa, kwa sababu uliniita.” Lakini Eli akasema, “Sikukuita. Rudi ukalale.” Basi akaenda akalala.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרָץ אֶל־עֵלִי
  choice: Akakimbia kwa Eli
  rationale: Inawakilisha kwa kawaida mwendo wa haraka kuelekea kwa Eli.
- source_word: הִנְנִי
  choice: Mimi hapa
  rationale: Ni mwitikio wa kawaida unaoonyesha kuwa msemaji yupo na yuko tayari kuitika.
- source_word: כִּי קָרָאתָ לִּי
  choice: kwa sababu uliniita
  rationale: כִּי hapa inaeleza sababu ya Samweli kukimbia na kufika kwa Eli.
- source_word: שׁוּב שְׁכָב
  choice: Rudi ukalale
  rationale: שׁוּב ina maana ya kurudi, na שְׁכָב ni agizo la kulala; Kiswahili hiki ni cha kawaida na kinahifadhi amri zote mbili.
- source_word: וַיֵּלֶךְ וַיִּשְׁכָּב
  choice: Basi akaenda akalala
  rationale: Inahifadhi mfuatano wa vitendo viwili katika simulizi.
