  text: On that day[a], Eli was lying down in his place, and his eyes had begun to grow dim; he could not see.
translation:
  language: sw
  text: Siku hiyo, Eli alikuwa amelala mahali pake, na macho yake[a] yalikuwa yameanza kufifia; hakuweza kuona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jicho lake lilikuwa limeanza kufifia.” Umbo la Kiebrania linaweza kueleweka kwa umoja, lakini pia linaweza kutumiwa kwa maana ya jumla ya uwezo wa kuona; ndiyo sababu maandishi makuu yanasema “macho yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: (imewakilishwa na mtiririko wa simulizi bila neno la ziada)
  rationale: Muundo huu unaendeleza na kuweka mazingira ya simulizi. Kiswahili cha sasa hakihitaji kauli nzito kama “ikawa kwamba” hapa.
- source_word: בַּיּוֹם הַהוּא
  choice: Siku hiyo
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha wakati chenye kiashiria.
- source_word: שֹׁכֵב
  choice: alikuwa amelala
  rationale: Hali ya kuendelea ya Eli imewasilishwa kwa muundo wa Kiswahili unaofaa katika simulizi. Tafsiri haiongezi mahali maalumu kama chumba.
- source_word: בִּמְקֹמוֹ
  choice: mahali pake
  rationale: Neno מָקוֹם linamaanisha “mahali”; chaguo hili linahifadhi maana pana bila kudhani kuwa palikuwa chumbani.
- source_word: וְעֵינוֹ
  choice: macho yake
  rationale: Ingawa umbo lililoandikwa linaweza kutafsiriwa kwa umoja, kitenzi cha wingi na maana ya jumla ya uwezo wa kuona vinafanya “macho yake” kuwa Kiswahili cha kawaida. Uwezekano wa umoja umehifadhiwa katika tanbihi.
- source_word: הֵחֵלּוּ כֵהוֹת
  choice: yalikuwa yameanza kufifia
  rationale: Chaguo hili linahifadhi mwanzo na kuendelea kwa kudhoofika kwa uwezo wa kuona.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: hakuweza kuona
  rationale: Ni kauli fupi, wazi, na ya kawaida inayowasilisha kutoweza kwake kuona.
