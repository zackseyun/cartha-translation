base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/019.yaml
  text: And Samuel grew[a], and Yahweh was with him and let none of his words fall to the ground.
translation:
  language: sw
  text: Samweli akakua, naye Yahwe alikuwa pamoja naye, wala hakuruhusu neno lolote la Samweli lianguke chini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuruhusu neno lolote la Samweli lishindwe.” Kiebrania kinasema kihalisi, “hakuruhusu neno lolote la Samweli lianguke chini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: akakua
  rationale: Kitenzi גדל hapa kinaonyesha kukua na kukomaa kwa Samweli. “Akakua” ni tafsiri fupi na ya kawaida, bila kuifanya ihusu ukuu wa cheo pekee.
- source_word: שְׁמוּאֵל
  choice: Samweli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: “Yahwe” linatunza jina la Mungu lililo katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo, na ni umbo linalofaa matamshi ya Kiswahili.
- source_word: הָיָה עִמּוֹ
  choice: alikuwa pamoja naye
  rationale: Tafsiri hii inatunza maana ya moja kwa moja ya uwepo na kibali cha Yahwe kwa Samweli, huku ikisikika kwa kawaida katika Kiswahili.
- source_word: וְלֹא הִפִּיל
  choice: wala hakuruhusu ... lianguke
  rationale: Hifili ya נפל pamoja na ukanushi inaonyesha kwamba Yahwe hakuliacha neno la Samweli lishindwe. “Hakuruhusu ... lianguke” inadumisha maana ya kisababishi na taswira ya Kiebrania.
- source_word: מִכָּל דְּבָרָיו
  choice: neno lolote la Samweli
  rationale: Kauli hii ina maana ya kwamba hakuna hata moja kati ya maneno yake lililoanguka. Jina “Samweli” limetumiwa badala ya kiwakilishi ili kuzuia mkanganyiko wa Kiswahili kuhusu kama maneno hayo ni ya Yahwe au ya Samweli.
- source_word: אָרְצָה
  choice: chini
  rationale: Katika nahau “kuanguka chini,” neno hili linaeleza kwamba maneno hayakushindwa au kuwa matupu. “Chini” ni ya kawaida zaidi katika Kiswahili kuliko tafsiri ngumu ya “kwenda ardhini.”
theological_decisions:
- issue: Namna ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina binafsi la Mungu. Kulitafsiri “Yahwe” kunalihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya nahau ya maneno kutoanguka chini
  choice: Kudumisha nahau katika mstari na kuifafanua katika tanbihi
  alternative: hakuruhusu neno lolote la Samweli lishindwe kutimia
  rationale: Muktadha unaonyesha uthabiti wa Samweli kama nabii, lakini Kiebrania kinatumia taswira pana ya maneno kutoanguka chini. Kudumisha taswira hiyo huepuka kuibana maana kuwa unabii uliotimia pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa simulizi ni mfupi kama Kiebrania; nahau asilia imehifadhiwa na kufafanuliwa katika tanbihi.
