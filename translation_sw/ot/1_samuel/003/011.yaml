base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/011.yaml
  text: Then the LORD said to Samuel, "Look, I am about to do a thing in Israel that will make both ears of everyone who hears of it tingle."
translation:
  language: sw
  text: Kisha BWANA akamwambia Samueli, “Tazama, niko karibu kufanya jambo katika Israeli; kila atakayelisikia, masikio yake yote mawili yatawasha.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nahau ya Kiebrania: masikio yatawasha; huonyesha athari kubwa ya habari inayosikika.'
    reason: Huhifadhi taswira ya nahau na kueleza matumizi yake kwa kiasi, bila kuongeza tafsiri maalumu ya tukio.
lexical_decisions:
- source_word: יְהוָה
  choice: BWANA
  rationale: Linatumia desturi ya Kiswahili ya kuwakilisha jina la agano YHWH kwa ‘BWANA’ kwa herufi kubwa.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Linahifadhi wito wa kuzingatia tangazo muhimu, kwa lugha yenye hadhi na inayoeleweka.
- source_word: אָנֹכִי עֹשֶׂה דָבָר
  choice: nitafanya jambo
  rationale: Kauli ya wakati wa sasa katika Kiebrania inaelekeza kwenye tendo lililo karibu au lililoamuliwa; wakati ujao wa Kiswahili unasikika kwa kawaida hapa.
- source_word: תְּצִלֶּינָה שְׁתֵּי אָזְנָיו
  choice: litafanya masikio yote mawili ... yawashe
  rationale: Nahau ya Kiebrania inaeleza mshtuko mkubwa unaosababishwa na habari; ‘masikio ... yawashe’ huhifadhi taswira ya kimwili bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Uwakilishi wa jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: ‘BWANA’ ndiyo desturi pana ya tafsiri za Biblia za Kiswahili na inaendana na tabaka la mashauriano la POB; herufi kubwa zinatofautisha jina hili na cheo cha kawaida.
- issue: Hali ya tendo la Mungu katika עֹשֶׂה
  choice: nitafanya
  alternative: ninafanya / niko karibu kufanya
  rationale: Muktadha ni tangazo la hukumu inayokuja. Tafsiri hii haitaji muda mahususi zaidi kuliko inavyodokezwa na Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. ‘Kisha’ linaendeleza simulizi, na ‘Tazama’ linadumisha nguvu ya tangazo la Kiebrania.
