lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Siku hiyo
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha wakati maalumu wa baadaye na kuhifadhi nguvu ya kiashiria.
- source_word: אָקִים אֶל עֵלִי
  choice: nitamtekelezea Eli
  rationale: Hifili ya קום hapa inamaanisha kuyafanya maneno yaliyotangulia yasimame, yaani yatimie. Muundo huu pia huhifadhi uwezekano wa kuelewa אֶל kama ‘kwa Eli,’ huku muktadha ukionyesha kuwa kinachotekelezwa ni hukumu juu yake.
- source_word: אֵת כָּל אֲשֶׁר דִּבַּרְתִּי
  choice: yote niliyosema
  rationale: Huhifadhi ukamilifu unaoonyeshwa na כָּל אֲשֶׁר na maana ya kawaida ya דבר kwa lugha ya sasa.
- source_word: אֶל בֵּיתוֹ
  choice: kuhusu nyumba yake
  rationale: Pamoja na kitenzi ‘kusema,’ אֶל inaweza kuonyesha jambo linalozungumziwa. ‘Kuhusu’ ni ya asili na haiongezi maana ya uadui katika kiunganishi chenyewe.
- source_word: בֵּיתוֹ
  choice: nyumba yake
  rationale: ‘Nyumba’ huhifadhi upana wa בַּיִת, ambayo hapa inaweza kumaanisha watu wa nyumbani, ukoo, au nyumba ya kikuhani ya Eli.
- source_word: הָחֵל וְכַלֵּה
  choice: tangu mwanzo hadi mwisho
  rationale: Usemi huu wa Kiswahili unaonyesha utekelezaji kamili wa yote yaliyotamkwa.
theological_decisions:
- issue: Upeo wa hukumu juu ya Eli na nyumba yake
  choice: Kudumisha neno ‘nyumba’ katika matini kuu bila kulibana kwa familia ya karibu pekee.
  alternative: Kutafsiri moja kwa moja kuwa ‘watu wa nyumba yake,’ ‘ukoo wake,’ au ‘nyumba yake ya kikuhani.’
  rationale: בֵּיתוֹ inaweza kujumuisha watu wa nyumbani, ukoo, na katika muktadha huu nasaba au nyumba ya kikuhani. Neno pana pamoja na tanbihi huhifadhi mvutano huo wa kimaana.
- issue: Mwelekeo wa אֶל עֵלִי
  choice: ‘nitamtekelezea Eli’
  alternative: ‘nitatekeleza dhidi ya Eli’ au ‘nitatimiza kwa Eli’
  rationale: Kiebrania kina kihusishi אֶל, kwa kawaida ‘kwa/kuelekea,’ lakini muktadha ni wa hukumu. Tafsiri iliyochaguliwa inaacha muktadha utoe maana mbaya bila kubadili kihusishi waziwazi kuwa ‘dhidi ya.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nitamtekelezea’ ni sahihi lakini nzito kiasi; kimetumiwa ili kuhifadhi uhusiano wa maneno yaliyotamkwa na Eli bila kufuta utata wa kihusishi cha Kiebrania.
