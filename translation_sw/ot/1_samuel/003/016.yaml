  text: Then Eli called Samuel and said, “Samuel, my son.” And he said, “Here I am.”
translation:
  language: sw
  text: Ndipo Eli akamwita Samweli, akasema, “Samweli, mwanangu.” Naye akasema, “Mimi hapa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: Katika muktadha huu קרא humaanisha kumwita mtu kwa sauti. “Akamwita” ni ya kawaida katika simulizi la Kiswahili na inaonyesha kuwa Eli alimwita Samweli.
- source_word: עֵלִי
  choice: Eli
  rationale: Jina la mtu limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili.
- source_word: אֶת שְׁמוּאֵל
  choice: Samweli
  rationale: Alama ya Kiebrania ya yambwa אֶת haitafsiriwi moja kwa moja; jina limetolewa kwa umbo lake la kawaida la Kiswahili.
- source_word: וַיֹּאמֶר
  choice: na kusema / akajibu
  rationale: אמר ni kitenzi cha kawaida cha usemi. Mara ya kwanza “na kusema” linaunganisha kuitwa na maneno ya Eli; mara ya pili “akajibu” ni Kiswahili cha asili kinachoeleza kwa usahihi kwamba Samweli aliitikia mwito.
- source_word: שְׁמוּאֵל בְּנִי
  choice: Samweli, mwanangu
  rationale: בְּנִי kihalisi ni “mwanangu.” Huhifadhi maana ya uhusiano na upole wa namna Eli anavyomwita Samweli bila kuongeza tafsiri nyingine.
- source_word: הִנֵּנִי
  choice: Mimi hapa
  rationale: Hili ni jibu la kawaida linaloonyesha kuwapo na utayari. “Mimi hapa” ni la asili katika Kiswahili na linahifadhi nguvu ya nahau ya Kiebrania.
- source_word: וַ
  choice: Ndipo / aka- / Naye
  rationale: Miundo ya waw-consecutive inaendeleza mfululizo wa simulizi. “Ndipo” na viambishi vya mfululizo vya “aka-” vinaonyesha hatua zinazofuatana kwa Kiswahili cha asili, huku “Naye” ikibainisha mzungumzaji wa jibu.
