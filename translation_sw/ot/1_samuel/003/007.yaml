  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/שְׁמוּאֵ֕ל טֶ֖רֶם יָדַ֣ע אֶת יְהוָ֑ה וְ/טֶ֛רֶם יִגָּלֶ֥ה אֵלָ֖י/ו דְּבַר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/007.yaml
  text: Samuel did not yet know Yahweh[b][a], and the word of Yahweh had not yet been revealed to him.
translation:
  language: sw
  text: Samweli alikuwa bado hajamjua[a] Yahwe[b], wala neno la Yahwe lilikuwa bado halijafunuliwa kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Samweli alikuwa bado hajamtambua Yahwe.” Neno la Kiebrania linalotafsiriwa “kujua” linaweza kumaanisha kumjua kwa uzoefu au katika uhusiano, hasa kuhusiana na ufunuo wa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania YHWH, ambalo kwa desturi hutafsiriwa “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: טֶרֶם
  choice: bado haja- / bado halija-
  rationale: Muundo huu unaonyesha kwamba hali au tukio lililotajwa halikuwa limetokea kufikia wakati huo katika simulizi.
- source_word: יָדַע אֶת־יְהוָה
  choice: hajamjua Yahwe
  rationale: Kitenzi 'kujua' kinadumisha upana wa maana ya Kiebrania, ambayo hapa inaweza kumaanisha kumtambua au kumjua kwa uzoefu unaohusiana na ufunuo, si kuwa na habari zake tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kama 'Yahwe' badala ya kubadilishwa kuwa cheo, huku tanbihi ikitaja desturi ya kulitafsiri 'BWANA.'
- source_word: יִגָּלֶה
  choice: halijafunuliwa
  rationale: 'Kauli ya kutendwa inadumishwa: neno la Yahwe ndilo linalofunuliwa kwa Samweli.'
- source_word: אֵלָיו
  choice: kwake
  rationale: Huu ni usemi wa kawaida na wa asili wa Kiswahili unaoonyesha kwamba ufunuo ulimjia Samweli.
- source_word: דְּבַר יְהוָה
  choice: neno la Yahwe
  rationale: Usemi huu unadumisha istilahi ya kinabii ya chanzo na uzito wake wa kiteolojia bila kuifafanua zaidi kuwa 'ujumbe.'
- source_word: וּשְׁמוּאֵל
  choice: Samweli
  rationale: Kiunganishi cha Kiebrania kinafanya kazi katika mtiririko wa simulizi; hakihitaji kuongezewa neno la wakati kama 'sasa' katika Kiswahili.
theological_decisions:
- issue: Maana ya Samweli kutokuwa bado amemjua Yahwe
  choice: Kudumisha usemi 'hajamjua' na kueleza katika tanbihi uwezekano wa kumtambua au kumjua kwa uzoefu wa ufunuo.
  alternative: Kusema moja kwa moja kwamba Samweli alikuwa hajamtambua Yahwe au hakuwa amekutana naye katika ufunuo wa kinabii.
  rationale: Mstari unaunganisha kutomjua Yahwe na neno la Yahwe kutokuwa bado limefunuliwa kwake. Tafsiri kuu haipaswi kuamua kwamba Samweli hakuwa na maarifa yoyote kuhusu Mungu wala kutoa dai kuhusu hali yake ya kiroho ambalo andiko halitamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa 'alikuwa bado hajamjua' na 'lilikuwa bado halijafunuliwa' unaweka mstari kama maelezo ya hali iliyokuwapo wakati huo katika simulizi.
