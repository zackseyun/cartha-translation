base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/015.yaml
  text: Samuel lay down until morning; then he opened the doors of the house of Yahweh[a]. But Samuel was afraid to tell the vision to Eli.
translation:
  language: sw
  text: Samweli akajilaza mpaka asubuhi; kisha akafungua milango ya nyumba ya Yahwe. Lakini Samweli aliogopa kumweleza Eli maono[a] hayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwonekano.” Neno la Kiebrania mar’ah linaweza kumaanisha mwonekano, maono, au ufunuo wa kinabii. Katika muktadha huu, “maono” linafaa zaidi kwa ufunuo wa usiku alioupokea Samweli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: akajilaza
  rationale: Kitenzi שׁכב kimsingi humaanisha kujilaza. Tafsiri hii haiongezi dai kwamba Samweli alilala usingizi baada ya ufunuo wa usiku.
- source_word: עַד הַבֹּקֶר
  choice: mpaka asubuhi
  rationale: Hii ni tafsiri ya kawaida na ya asili ya usemi wa wakati katika Kiswahili.
- source_word: וַיִּפְתַּח
  choice: kisha akafungua
  rationale: Neno “kisha” linaonyesha mfuatano wa simulizi unaobebwa na waw, bila kuongeza tendo lisilokuwapo katika Kiebrania.
- source_word: דַּלְתוֹת
  choice: milango
  rationale: Nomino hiyo ni ya wingi na “milango” ndiyo tafsiri ya moja kwa moja na ya kawaida katika muktadha wa jengo la ibada.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: “Nyumba” huhifadhi neno בית bila kutumia “hekalu,” ambalo lingekuwa mahususi kupita kiasi kwa mazingira haya ya simulizi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetolewa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: יָרֵא
  choice: aliogopa
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayoonyesha hofu ya Samweli kwa uwazi.
- source_word: מֵהַגִּיד
  choice: kumweleza
  rationale: Baada ya kitenzi cha kuogopa, muundo huu unatoa kwa Kiswahili maana ya kuogopa kufanya jambo; “kumweleza Eli” ni wa asili kuliko tafsiri ya neno kwa neno.
- source_word: הַמַּרְאָה
  choice: maono hayo
  rationale: מַרְאָה linaweza kumaanisha mwonekano au ufunuo unaoonekana. Katika muktadha wa ufunuo wa usiku alioupokea Samweli, “maono” ni neno la kawaida zaidi huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: אֶל עֵלִי
  choice: Eli
  rationale: Katika muundo “kumweleza Eli,” Kiswahili humweka mpokeaji moja kwa moja baada ya kitenzi bila kuhitaji kihusishi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko la Kiebrania linatumia moja kwa moja Tetragramatoni, kwa hiyo jina la agano linahifadhiwa kwa umbo linalotumika kwa kawaida katika Kiswahili badala ya kubadilishwa kuwa cheo.
- issue: Maana ya הַמַּרְאָה
  choice: maono
  alternative: mwonekano
  rationale: Muktadha unaelekeza kwenye ufunuo wa usiku wa Samweli, lakini tanbihi inahifadhi upana halisi wa neno la Kiebrania bila kuufuta.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kisasa, wa heshima na unaoeleweka kwa urahisi. “Akajilaza” limechaguliwa badala ya “akalala” ili kutotafsiri kwamba lazima alipata usingizi, jambo ambalo andiko halisemi wazi.
