  text: And all Israel from Dan to Beer-sheba knew that Samuel was established as a prophet of Yahweh[a].
translation:
  language: sw
  text: Israeli wote, kuanzia Dani mpaka Beer-sheba, wakajua kwamba Samweli alikuwa amethibitishwa kuwa nabii wa Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa amewekwa imara kuwa nabii wa Yahweh.” Neno la Kiebrania linaweza kumaanisha kuonyeshwa kuwa wa kutegemewa, kuwekwa imara, au kuthibitishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: wakajua
  rationale: Kitenzi kinaonyesha kwamba jambo hili lilikuja kujulikana na kutambuliwa kwa taifa lote; “wakajua” ni tafsiri fupi na ya kawaida katika muktadha huu.
- source_word: כָּל יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Huhifadhi usemi wa pamoja unaolitaja taifa zima, kwa Kiswahili cha kawaida cha Biblia.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: kuanzia Dani mpaka Beer-sheba
  rationale: Huhifadhi majina ya maeneo na msemo wa kijiografia unaomaanisha nchi yote, bila kuubadili kuwa ufafanuzi katika matini kuu.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linaanzisha yaliyokuwa yamejulikana na Israeli.
- source_word: נֶאֱמָן
  choice: alikuwa amethibitishwa
  rationale: Katika muktadha huu linamaanisha kwamba hadhi ya Samueli kuwa nabii ilikuwa imeonyeshwa kuwa ya kweli na kutambuliwa wazi; tafsiri hii huepuka kulifanya hasa kuwa sifa ya uaminifu wa kimaadili.
- source_word: לְנָבִיא
  choice: kuwa nabii
  rationale: Kiambishi לְ kinaonyesha nafasi au hadhi ya Samueli; “kuwa nabii” ni Kiswahili cha asili katika muundo huu.
- source_word: לַיהוָה
  choice: wa Yahweh
  rationale: Hueleza uhusiano wa Samueli na Yahweh kama nabii wake, huku likihifadhi jina la agano lililo katika Kiebrania.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania inatumia moja kwa moja Tetragramatoni; “Yahweh” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Maana ya נֶאֱמָן kuhusu utume wa kinabii wa Samueli
  choice: amethibitishwa kuwa nabii
  alternative: amewekwa imara kuwa nabii; ni mwaminifu akiwa nabii
  rationale: Muktadha wa karibu unasisitiza kwamba maneno ya Samueli yalitimia, hivyo hali yake ya kuwa nabii wa kweli ilithibitishwa hadharani. Maelezo ya chini huhifadhi upana halisi wa neno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Msemo wa kijiografia na jina Yahweh vimehifadhiwa; alama ya tanbihi [a] imewekwa katika matini kuu.
