base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/018.yaml
  text: So Samuel told him all the words and hid nothing from him[a]. And he said, “He is Yahweh[b]; let him do what is good in his eyes.”
translation:
  language: sw
  text: Basi Samweli akamwambia maneno yote, wala hakumficha chochote. Naye akasema, “Yeye ndiye Yahwe; na afanye lililo jema machoni pake.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atafanya lililo jema machoni pake.” Kitenzi cha Kiebrania kinaweza kueleweka ama kama kauli ya kujisalimisha, “na afanye,” ama kama taarifa ya wakati ujao.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֶּד לוֹ שְׁמוּאֵל
  choice: Samweli akamweleza
  rationale: Kitenzi נגד katika Hifili humaanisha kueleza au kujulisha. ‘Akamweleza’ ni Kiswahili cha kawaida na huonyesha mawasiliano ya moja kwa moja kwa Eli.
- source_word: אֶת כָּל הַדְּבָרִים
  choice: maneno yote
  rationale: Huhifadhi kwa ukaribu maana ya ‘maneno/mambo yote’ katika muktadha wa ujumbe ambao Samweli alikuwa amepewa.
- source_word: וְלֹא כִחֵד מִמֶּנּוּ
  choice: wala hakumficha jambo lolote
  rationale: כחד humaanisha kuficha au kuzuia habari; usemi huu ni wa asili katika Kiswahili na unasisitiza kwamba Samweli hakuficha chochote.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu katika Tetragramatoni limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili, badala ya kubadilishwa kuwa cheo.
- source_word: הוּא
  choice: Yeye ni
  rationale: Kiwakilishi hiki kina mkazo. ‘Yeye ni Yahwe’ kinahifadhi utambulisho wenye mkazo na ukubali wa Eli kwamba anayesema na kutenda ni Yahwe.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: lililo jema machoni pake
  rationale: Huhifadhi nahau ya Kiebrania ‘jema machoni pake,’ yaani jambo analoliona kuwa jema au linalompendeza.
- source_word: יַעֲשֶׂה
  choice: na afanye
  rationale: Muundo huu wa Kiswahili unafaa kama kauli ya kujisalimisha au kukubali, huku ukihifadhi nguvu ya jussive inayowezekana katika muktadha.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko lina jina la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi kama jina binafsi bila kulibadili kuwa cheo.
- issue: Nguvu ya kauli ya mwisho ya Eli
  choice: na afanye lililo jema machoni pake
  alternative: atafanya lililo jema machoni pake
  rationale: Muktadha unaonyesha Eli akikubali hukumu iliyotangazwa. Hata hivyo, imperfect ya Kiebrania inaweza pia kueleweka kama wakati ujao, kwa hiyo maana hiyo imetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi ya Biblia lakini kinachoeleweka kwa msomaji wa kawaida. Nahau ‘machoni pake’ imehifadhiwa kwa sababu inaeleweka na pia huakisi kwa karibu usemi wa Kiebrania.
