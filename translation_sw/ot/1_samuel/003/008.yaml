reference: 1 Samuel 3:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨סֶף יְהוָ֥ה קְרֹא שְׁמוּאֵל֮ בַּ/שְּׁלִשִׁית֒ וַ/יָּ֨קָם֙ וַ/יֵּ֣לֶךְ אֶל עֵלִ֔י וַ/יֹּ֣אמֶר הִנְ/נִ֔י כִּ֥י קָרָ֖אתָ לִ֑/י וַ/יָּ֣בֶן עֵלִ֔י כִּ֥י יְהוָ֖ה קֹרֵ֥א לַ/נָּֽעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/008.yaml
  text: And Yahweh called Samuel again a third time. So he got up and went to Eli and said, “Here I am, for you called me.” Then Eli understood that Yahweh was calling the boy.
translation:
  language: sw
  text: Yahweh akamwita Samueli tena, mara ya tatu. Basi Samueli akaamka, akaenda kwa Eli, akasema, “Mimi hapa, kwa maana umeniita.” Ndipo Eli akaelewa kwamba Yahweh alikuwa akimwita yule mvulana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף ... קְרֹא
  choice: akamwita ... tena
  rationale: Muundo wa יָסַף pamoja na kitenzi-jina unaonyesha kurudiwa kwa tendo; Kiswahili cha kawaida husema ‘akamwita tena’ badala ya tafsiri sisisi isiyo ya kawaida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni limeandikwa kwa unukuzi ‘Yahweh,’ badala ya kubadilishwa kuwa cheo.
- source_word: בַּשְּׁלִשִׁית
  choice: mara ya tatu
  rationale: Hueleza wazi kwamba huu ulikuwa mwito wa tatu.
- source_word: וַיָּקָם
  choice: akaamka
  rationale: Katika muktadha wa Samueli kwenda kwa Eli usiku, ‘akaamka’ ni usemi wa asili na unaoeleweka; unaweza pia kumaanisha aliinuka.
- source_word: וַיֵּלֶךְ אֶל־עֵלִי
  choice: akaenda kwa Eli
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mwendo kuelekea kwa Eli.
- source_word: הִנְנִי
  choice: Mimi hapa
  rationale: Ni jibu la kawaida la Kiswahili katika kuitwa na hudokeza kuwa msemaji yupo tayari kuitika.
- source_word: כִּי קָרָאתָ לִי
  choice: kwa maana umeniita
  rationale: כִּי hapa hutoa sababu ya Samueli kufika kwa Eli; ‘kwa maana’ huhifadhi uhusiano huo kwa lugha yenye hadhi.
- source_word: וַיָּבֶן
  choice: akaelewa
  rationale: בין hapa humaanisha kufikia ufahamu wa hali iliyokuwa ikiendelea.
- source_word: קֹרֵא
  choice: alikuwa akimwita
  rationale: Kivumishi-tendo cha Kiebrania kinaonyesha tendo lililokuwa likiendelea au kujirudia wakati huo.
- source_word: לַנָּעַר
  choice: yule mvulana
  rationale: נַעַר linaweza kumaanisha mvulana au kijana; katika simulizi hili Samueli yuko chini ya uangalizi wa Eli, hivyo ‘mvulana’ linafaa, huku ‘yule’ likirejelea mhusika anayejulikana.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Andiko la Kiebrania linatumia jina la Mungu moja kwa moja. ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo; ‘Yehova’ ni namna nyingine ya jadi ya kulitamka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa masimulizi umetumia mfululizo wa ‘aka-’ kwa urahisi wa kusoma. Hakuna tanbihi zinazohitajika, kwa hiyo hakuna alama za tanbihi katika matini.
