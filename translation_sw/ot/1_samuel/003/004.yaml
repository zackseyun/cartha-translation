  text: Then Yahweh called to Samuel[a], and he said, “Here I am.”
translation:
  language: sw
  text: Ndipo Yahwe[a] akamwita Samweli, naye akasema, “Mimi hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH; pia hutoholewa kuwa “Yehova.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: Kitenzi cha Qal wayyiqtol cha קרא kinaendeleza simulizi na hapa kinaeleza mwito unaosikika; “akamwita” ni Kiswahili cha kawaida na huonyesha pia kwamba Samweli ndiye aliyeitwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu YHWH limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: אֶל
  choice: -mw- katika “akamwita Samweli”
  rationale: Kihusishi אֶל humtaja anayeelekezewa mwito. Katika Kiswahili maana hiyo huwasilishwa kwa kawaida kwa kiambishi cha mtendewa -mw- pamoja na jina “Samweli,” badala ya tafsiri ya neno kwa neno “kwa Samweli.”
- source_word: שְׁמוּאֵל
  choice: Samweli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia na matumizi mapana ya Afrika Mashariki.
- source_word: וַיֹּאמֶר
  choice: naye akasema
  rationale: Wayyiqtol ya אמר inaendeleza simulizi. Kiwakilishi “naye” humtambulisha Samweli kwa kawaida kuwa msemaji kulingana na muktadha, bila kubadili yaliyomo katika jibu.
- source_word: הִנֵּנִי
  choice: Mimi hapa
  rationale: Hii ni kauli ya kuitikia inayoonyesha kuwapo na utayari. “Mimi hapa” ni ya asili na inayoeleweka katika Kiswahili cha sasa, huku ikihifadhi uzito wa kauli ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana Tetragramatoni kama jina binafsi, si cheo. “Yahwe” linaakisi kwa karibu zaidi matamshi yanayokubaliwa kwa kawaida na kuhifadhi tofauti kati ya jina hilo na cheo “Bwana”; tanbihi inataja umbo jingine la jadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ndipo” linaendeleza mtiririko wa simulizi; “akamwita” ni asilia zaidi kuliko muundo wa moja kwa moja “aliita kwa.” Jibu “Mimi hapa” ni fupi na linafaa katika mazungumzo ya kuitwa.
