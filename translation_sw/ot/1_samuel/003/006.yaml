base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/006.yaml
  text: Then the LORD called Samuel again. Samuel got up and went to Eli and said, “Here I am, because you called me.” But he said, “I did not call, my son. Go back; lie down.”
translation:
  language: sw
  text: Kisha BWANA akamwita Samweli tena. Samweli akaondoka, akaenda kwa Eli, akasema, “Mimi hapa, kwa sababu uliniita.” Lakini Eli akasema, “Sikukuita, mwanangu. Rudi ukalale.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף יְהוָה קְרֹא עוֹד
  choice: Kisha BWANA akamwita ... tena
  rationale: Muundo wa Kiebrania unaonyesha tendo lililorudiwa; “tena” ni usemi wa kawaida wa Kiswahili, huku BWANA likifuata desturi iliyozoeleka ya kuwakilisha jina la agano יהוה.
- source_word: הִנְנִי
  choice: Mimi hapa
  rationale: Ni jibu la kawaida la kujitokeza na kuwa tayari; “Mimi hapa” ni la asili na linaeleweka kwa wasomaji wa sasa.
- source_word: כִּי קָרָאתָ לִי
  choice: kwa sababu uliniita
  rationale: כִּי hapa linaeleza sababu iliyomfanya Samweli aje kwa Eli, bila kuongeza maana isiyokuwapo katika chanzo.
- source_word: שׁוּב שְׁכָב
  choice: Rudi ukalale
  rationale: Vitenzi viwili vya amri vinawasilishwa kwa Kiswahili cha kawaida, huku maana ya kurudi na kulala ikihifadhiwa.
theological_decisions:
- issue: Uwakilishi wa jina יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: “BWANA” kwa herufi kubwa ni desturi pana ya tafsiri za Biblia za Kiswahili na inaendana na safu ya mashauriano, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Mfuatano wa masimulizi umewekwa kwa vitenzi vya ka-; mazungumzo ni ya kawaida na ya heshima.
