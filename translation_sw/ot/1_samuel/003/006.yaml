  source_fidelity: 'Tafsiri inafuata kwa usahihi muundo wa simulizi na maana ya Kiebrania: BWANA anamwita Samweli tena; Samweli anaondoka na kwenda kwa Eli; jibu lake linaonyesha kuwa alidhani Eli ndiye aliyemwita; Eli anakana na kumwagiza arudi alale. “Mimi hapa” huwasilisha vyema הִנְנִי katika muktadha huu, na “kwa sababu uliniita” huhifadhi sababu inayotolewa na כִּי.'
