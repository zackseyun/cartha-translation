base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/013.yaml
  text: And I have declared to him that I am judging his house forever for the iniquity that he knew[a], because his sons were cursing God, and he did not restrain them.
translation:
  language: sw
  text: 'Nami nimemjulisha kwamba ninaihukumu nyumba yake milele kwa sababu ya uovu alioujua: wanawe walikuwa wakijiletea laana[a], naye hakuwazuia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kufuatana na usomaji mwingine unaoshuhudiwa na baadhi ya mashahidi wa kale na tafsiri nyingi, “wanawe walikuwa wakimlaani Mungu” au “walikuwa wakimkufuru Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגַּדְתִּי
  choice: Nami nimemjulisha
  rationale: Kauli ya hifili ya נגד ina maana ya kumjulisha au kumtangazia mtu jambo. Wakati timilifu umetafsiriwa kwa hali timilifu ya sasa ili kuonyesha tangazo lililotolewa na ambalo bado lina uzito katika muktadha.
- source_word: שֹׁפֵט אֲנִי
  choice: ninaihukumu
  rationale: Kitenzi-shirikishi pamoja na kiwakilishi kilichotajwa wazi kinaonyesha hukumu inayoendelea au iliyo karibu kutekelezwa. ‘Ninaihukumu’ huhifadhi ukaribu na uzito wa tangazo hilo.
- source_word: בֵּיתוֹ
  choice: nyumba yake
  rationale: Nahau ya Kiebrania inaweza kumaanisha jamaa ya karibu pamoja na ukoo unaoendelea. ‘Nyumba yake’ huhifadhi upana huo bila kuufafanua kupita kiasi.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Kirai hiki huonyesha muda usio na mwisho unaotajwa; ‘milele’ ni tafsiri ya kawaida, yenye hadhi na inayohifadhi ukali wa hukumu.
- source_word: בַּעֲוֺן
  choice: kwa sababu ya uovu
  rationale: עָוֹן huweza kumaanisha uovu wenye hatia au hatia itokanayo na kosa. ‘Uovu’ ni neno la kawaida linalohifadhi uzito wa kimaadili katika muktadha huu.
- source_word: יָדַע
  choice: alioujua
  rationale: Tafsiri ya moja kwa moja inasisitiza kwamba Eli alikuwa na habari kuhusu uovu huo, jambo linalohusiana na kuwajibika kwake.
- source_word: מְקַלְלִים לָהֶם
  choice: walikuwa wakijiletea laana
  rationale: Maandishi ya Kimasoreti yanaelekea kusema kwamba wanawe walikuwa wakijiletea laana. Usemi huu wa Kiswahili unaonyesha matokeo ya mwenendo wao bila kudokeza kwamba walitamka laana juu yao wenyewe.
- source_word: כִהָה בָּם
  choice: hakuwazuia
  rationale: Kitenzi kinaweza kumaanisha kudhoofisha, kupunguza makali, au kuzuia. Katika muktadha, Eli hakukomesha mwenendo wa wanawe; ‘hakuwazuia’ hutoa maana hiyo kwa uwazi.
theological_decisions:
- issue: Ikiwa maandishi makuu yafuate usomaji wa Kimasoreti kuhusu kosa la wana wa Eli au usomaji mwingine unaoshuhudiwa na baadhi ya mashahidi wa kale
  choice: Maandishi makuu yanasema ‘wanawe walikuwa wakijiletea laana.’
  alternative: ‘Wanawe walikuwa wakimlaani Mungu’ au ‘walikuwa wakimkufuru Mungu.’
  rationale: Maandishi ya konsonanti ya WLC yanaunga mkono maana ya kujiletea laana, ilhali baadhi ya mashahidi wa kale na tafsiri nyingi huonyesha kwamba walimlaani au walimkufuru Mungu. Usomaji wa WLC umehifadhiwa katika maandishi makuu, na usomaji mwingine umewekwa katika tanbihi ili kutatua tofauti hiyo kwa uwazi bila kuificha.
- issue: Upeo wa hukumu juu ya ‘nyumba yake’
  choice: Nahau ‘nyumba yake’ imehifadhiwa bila kuwekewa mipaka.
  alternative: ‘Jamaa yake’ au ‘ukoo wake.’
  rationale: בֵּיתוֹ inaweza kujumuisha watu wa nyumbani na ukoo unaoendelea. Kuhifadhi nahau hii hakupunguzi kimya kimya upeo wa hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Muundo ‘nyumba yake’ umehifadhiwa kama nahau pana ya kibiblia, huku ‘wakijiletea laana’ ikieleza usomaji mgumu wa Kimasoreti kwa lugha ya kawaida bila kuufanya useme zaidi ya maandishi ya chanzo.
