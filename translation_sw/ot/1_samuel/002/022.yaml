  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עֵלִ֖י זָקֵ֣ן מְאֹ֑ד וְ/שָׁמַ֗ע אֵת֩ כָּל אֲשֶׁ֨ר יַעֲשׂ֤וּ/ן בָּנָי/ו֙ לְ/כָל יִשְׂרָאֵ֔ל וְ/אֵ֤ת אֲשֶֽׁר יִשְׁכְּבוּ/ן֙ אֶת הַ/נָּשִׁ֔ים הַ/צֹּ֣בְא֔וֹת פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/022.yaml
  text: Eli was very old[a], and he heard all that his sons were doing to all Israel, and that they were lying with the women who served at the entrance to the tent of meeting.
translation:
  language: sw
  text: Eli alikuwa mzee sana, naye akasikia mambo yote ambayo wanawe walikuwa wakiwafanyia Waisraeli wote, na kwamba walikuwa wakilala na wanawake waliokuwa wakihudumu[a] mlangoni mwa Hema la Kukutania.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokuwa wakikusanyika mlangoni mwa Hema la Kukutania.” Neno la Kiebrania linaweza kumaanisha kukusanyika au kuhudumu kwa utaratibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: alikuwa mzee sana
  rationale: Muundo huu wa Kiswahili ni wa kawaida na unahifadhi msisitizo wa מְאֹד bila kuongeza kitenzi cha mabadiliko kisichotajwa wazi.
- source_word: וְשָׁמַע
  choice: naye akasikia
  rationale: Kitenzi cha wakati uliotimilika katika simulizi kinaeleza kwamba Eli alipata kusikia taarifa hizo; ‘akasikia’ kinaendeleza simulizi kwa Kiswahili cha asili.
- source_word: כָּל אֲשֶׁר יַעֲשׂוּן
  choice: mambo yote ambayo ... walikuwa wakiwafanyia
  rationale: Hii inawasilisha jumla ya matendo ya wana wa Eli na hali yake ya kuendelea, inayodokezwa na muktadha wa taarifa kuhusu mwenendo wao.
- source_word: לְכָל יִשְׂרָאֵל
  choice: Waisraeli wote
  rationale: Huwataja watu wote walioathiriwa na mwenendo huo bila kuifanya ל kuwa na maana kali zaidi ya ‘dhidi ya.’
- source_word: יִשְׁכְּבוּן אֶת־הַנָּשִׁים
  choice: walikuwa wakilala na wanawake
  rationale: ‘Kulala na’ ni usemi wa staha unaoeleweka kuwa wa kingono katika muktadha huu, hivyo unahifadhi namna ya kujieleza ya Kiebrania bila kuwa wa kitabibu au wa wazi kupita chanzo.
- source_word: הַצֹּבְאוֹת
  choice: waliokuwa wakihudumu
  rationale: Kivumishi-tendaji hiki kinaweza kueleza huduma iliyopangwa. Katika mazingira ya patakatifu na kwa kulinganisha na Kutoka 38:8, ‘wakihudumu’ ni chaguo la asili lisiloingiza cheo maalumu kisichotajwa.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: mlangoni mwa Hema la Kukutania
  rationale: Ni Kiswahili cha kawaida kwa mahali pa kuingia na kinahifadhi jina la patakatifu linalotumiwa katika muktadha huu.
theological_decisions:
- issue: Kazi ya wanawake hao katika patakatifu
  choice: wanawake waliokuwa wakihudumu
  alternative: wanawake waliokuwa wakikusanyika
  rationale: הַצֹּבְאוֹת inaweza kumaanisha kushiriki katika huduma iliyopangwa au kukusanyika. Muktadha wa patakatifu na usemi unaofanana katika Kutoka 38:8 unaunga mkono ‘wakihudumu,’ lakini maana nyingine ya msingi imehifadhiwa katika tanbihi.
- issue: Kiwango cha uwazi katika kutaja uasherati
  choice: walikuwa wakilala na wanawake
  alternative: walikuwa wakifanya ngono na wanawake
  rationale: Kiebrania kinatumia usemi wa staha unaojulikana. Tafsiri ya ‘kulala na’ inaeleza maana bila kuwa ya kitabibu au ya wazi zaidi kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Hema la Kukutania’ limetumiwa kama istilahi ya kawaida ya patakatifu; usemi wa kingono umebaki wa staha kama ulivyo katika chanzo.
