  text: וְ/הָיָ֗ה כָּל הַ/נּוֹתָר֙ בְּ/בֵ֣יתְ/ךָ֔ יָבוֹא֙ לְ/הִשְׁתַּחֲוֺ֣ת ל֔/וֹ לַ/אֲג֥וֹרַת כֶּ֖סֶף וְ/כִכַּר לָ֑חֶם וְ/אָמַ֗ר סְפָחֵ֥/נִי נָ֛א אֶל אַחַ֥ת הַ/כְּהֻנּ֖וֹת לֶ/אֱכֹ֥ל פַּת לָֽחֶם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/036.yaml
  text: And everyone left in your house will come to bow down to him for a piece of silver and a loaf of bread[a], and will say, ‘Please attach me to one of the priestly offices[b], so that I may eat a morsel of bread.’
translation:
  language: sw
  text: Na kila atakayebaki wa nyumba yako atakuja kumwinamia kwa kipande kidogo cha fedha na mkate mmoja[a], naye atasema, ‘Tafadhali niambatanishe na mojawapo ya nafasi za ukuhani[b], ili nipate kula kipande cha mkate.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sarafu ndogo ya fedha na mkate mmoja”; Kiebrania kinataja kiasi kidogo cha fedha.
    reason: lexical_alternative
  - marker: b
    text: Au, “mojawapo ya huduma za kikuhani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָר
  choice: atakayebaki
  rationale: Kitenzi hiki humaanisha mtu anayesalia baada ya hukumu au hasara; ‘atakayebaki’ ni Kiswahili cha kawaida na kinadumisha wazo hilo.
- source_word: בְּבֵיתְךָ
  choice: katika nyumba yako
  rationale: ‘Nyumba’ inadumisha taswira ya Kiebrania na hapa inamaanisha jamaa au ukoo wa Eli, si jengo pekee.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: kumwinamia
  rationale: Neno la Kiebrania linaonyesha kuinama kwa unyenyekevu na dua. ‘Kumwinamia’ linaepuka kulifanya tendo hili kuwa ibada ya kidini bila msingi wa muktadha.
- source_word: לַאֲגֹרַת כֶּסֶף
  choice: ili apewe kipande kidogo cha fedha
  rationale: אֲגוֹרָה ni kiasi kidogo cha fedha. Tafsiri hii inadumisha udogo wake bila kudai kwa hakika kuwa kilikuwa sarafu.
- source_word: כִּכַּר לָחֶם
  choice: mkate mmoja
  rationale: כִּכָּר hapa ni mkate mzima, labda wa mviringo; ‘mkate mmoja’ ni wazi na ya kawaida katika Kiswahili.
- source_word: סְפָחֵנִי
  choice: niunganishe
  rationale: Amri hii ina maana ya kumwambatanisha au kumjumuisha mtu katika kundi au kazi; ‘niunganishe’ inadumisha maana hiyo moja kwa moja.
- source_word: נָא
  choice: Tafadhali
  rationale: Chembe hii huonyesha ombi la kusihi; ‘Tafadhali’ ndiyo njia ya kawaida ya kuwasilisha maana hiyo.
- source_word: אַחַת הַכְּהֻנּוֹת
  choice: mojawapo ya kazi za ukuhani
  rationale: Wingi huu usio wa kawaida unaelekea kumaanisha kazi au wajibu mbalimbali za kikuhani, wala si ukuhani tofauti tofauti.
- source_word: לֶאֱכֹל פַּת לָחֶם
  choice: nipate kula kipande cha mkate
  rationale: פַּת ni kipande kidogo cha mkate; usemi huu unaonyesha ombi la unyonge la kupata chakula.
theological_decisions:
- issue: Anayerejelewa na kiwakilishi לוֹ (‘yeye’)
  choice: Kiwakilishi kimehifadhiwa kwa ‘kumwinamia’ bila kumtambulisha mtu huyo zaidi.
  alternative: Kumtaja wazi kuwa ni kuhani mwenye mamlaka wakati huo.
  rationale: Andiko linasisitiza kugeuzwa kwa hali ya nyumba ya Eli, lakini halimtambulishi wazi mtu huyo katika mstari huu; tafsiri haipaswi kuondoa utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kumwinamia’ limetumiwa badala ya ‘kumsujudia’ ili kuonyesha kujinyenyekeza kwa dua bila kuashiria lazima ibada ya kidini. Muundo wa umoja ‘kila atakayebaki’ unafuata umoja wa kisarufi wa Kiebrania.
