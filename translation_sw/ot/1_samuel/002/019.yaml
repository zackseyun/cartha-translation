base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/019.yaml
  text: And his mother would make for him a small robe and bring it up to him from year to year[b][a], when she went up with her husband to offer the yearly sacrifice.
translation:
  language: sw
  text: Mama yake alikuwa akimshonea joho dogo[a] na kumpelekea huko kila mwaka[b], alipopanda pamoja na mume wake kutoa dhabihu ya kila mwaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vazi dogo la nje.” Neno la Kiebrania מְעִיל linamaanisha vazi la nje; hapa “joho” linafaa katika mazingira ya mahali patakatifu.
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “kutoka siku hadi siku,” nahau yenye maana ya “kila mwaka” au “mwaka baada ya mwaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעִיל
  choice: joho
  rationale: Neno hili humaanisha vazi la nje; “joho” linafaa katika mazingira haya ya huduma mahali patakatifu na ni la kawaida katika Kiswahili sanifu.
- source_word: קָטֹן
  choice: dogo
  rationale: Kivumishi hiki kinaonyesha kwamba joho hilo lilikuwa la ukubwa unaomfaa mtoto.
- source_word: תַּעֲשֶׂה
  choice: alikuwa akimshonea
  rationale: Kauli isiyotimilika hapa inaeleza tendo la kawaida lililorudiwa zamani. Katika muktadha wa vazi, “kushonea” ni tafsiri ya asili ya kufanya au kutengeneza vazi kwa ajili ya mtu.
- source_word: וְהַעַלְתָה לּוֹ
  choice: na kumpelekea huko
  rationale: Kitenzi עלה kina wazo la kupanda kwenda mahali patakatifu. “Huko” huhifadhi mwelekeo wa safari bila kutoa Kiswahili kisicho cha kawaida cha ‘kulipeleka juu kwake.’
- source_word: מִיָּמִים יָמִימָה
  choice: kila mwaka
  rationale: Kirai halisi ‘kutoka siku hadi siku’ ni nahau inayomaanisha tendo la kila mwaka.
- source_word: בַּעֲלוֹתָהּ
  choice: alipopanda
  rationale: Muundo huu una maana ya wakati, ‘wakati alipopanda,’ na huhifadhi lugha ya safari ya kwenda mahali patakatifu.
- source_word: אִישָׁהּ
  choice: mume wake
  rationale: Katika uhusiano huu, אִישׁ yenye kiambishi cha umilikaji humaanisha mume.
- source_word: לִזְבֹּחַ
  choice: kutoa
  rationale: Likifuatwa na ‘dhabihu,’ neno ‘kutoa’ linaeleza kwa kawaida tendo la ibada la kuwasilisha dhabihu.
- source_word: זֶבַח הַיָּמִים
  choice: dhabihu ya kila mwaka
  rationale: Kirai hiki kinarejelea dhabihu iliyotolewa kwa utaratibu wa kila mwaka; tafsiri hii ni wazi na ya asili.
