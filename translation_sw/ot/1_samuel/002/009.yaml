  yaml_path: translation/ot/1_samuel/002/009.yaml
  text: He guards the feet of his faithful ones[a], but the wicked are silenced in darkness[c][b], for not by strength does a man prevail.
translation:
  language: sw
  text: Huilinda miguu ya waaminifu wake[a], lakini waovu watanyamazishwa gizani[b]; kwa maana si kwa nguvu mtu[c] hushinda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mapokeo ya maandishi ya Kiebrania yanaweza pia kusomwa katika umoja, ‘mwaminifu wake.’ Hapa maana ya wingi, ‘waaminifu wake,’ imefuatwa kwa sababu inalingana na ulinganifu wa kishairi na huenda ndiyo maana ya pamoja iliyokusudiwa.
    reason: textual_variant
  - marker: b
    text: Au ‘watatulia’ au ‘watakatiliwa mbali’; kitenzi cha Kiebrania kinaweza kumaanisha kunyamaza au kutulizwa.
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania ni nomino ya kiume katika umoja, lakini hapa limetumiwa kwa maana ya binadamu kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵי
  choice: miguu ya
  rationale: Inahifadhi picha halisi ya Kiebrania ya ‘miguu’; ‘hatua za’ ingewezekana, lakini si ya moja kwa moja kama hii.
- source_word: חסידו
  choice: waaminifu wake
  rationale: Inawasilisha watu wenye uaminifu wa agano bila kuingiza maana za baadaye zinazoweza kuambatana na ‘watakatifu’; wingi unafuata mapokeo ya usomaji na ulinganifu wa kishairi.
- source_word: יִשְׁמֹר
  choice: atailinda
  rationale: Kitenzi kina maana ya kulinda au kutunza. Wakati ujao unafaa kwa hali ya kitenzi cha Kiebrania katika tamko hili la kishairi na unaonyesha ulinzi wa Mungu.
- source_word: וּרְשָׁעִים
  choice: lakini waovu
  rationale: Kiunganishi kinaonyesha utofautishaji kati ya waaminifu na waovu, hivyo ‘lakini’ ni ya asili na sahihi katika Kiswahili.
- source_word: בַּחֹשֶׁךְ
  choice: gizani
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi picha ya kuwa katika giza.
- source_word: יִדָּמּוּ
  choice: watanyamazishwa
  rationale: Kauli ya kutendwa inahifadhi wazo la kufanywa kimya au kutulizwa katika muktadha wa hukumu; uwezekano wa ‘watatulia’ au ‘watakatiliwa mbali’ umewekwa katika tanbihi.
- source_word: כִּי
  choice: kwa maana
  rationale: Inatanguliza sababu au msingi wa kauli iliyotangulia.
- source_word: לֹא בְכֹחַ
  choice: si kwa nguvu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya wazo la kutoshinda kwa nguvu za mtu.
- source_word: יִגְבַּר
  choice: hushinda
  rationale: Inatoa maana ya kufanikiwa au kuwa na ushindi, si kuwa na nguvu tu.
- source_word: אִישׁ
  choice: mtu
  rationale: Katika muktadha huu nomino ya kiume ya umoja imetumiwa kwa maana wakilishi ya binadamu kwa ujumla; ‘mtu’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
theological_decisions:
- issue: Idadi na maana ya חסידו
  choice: 'Maana ya pamoja/wingi: ‘waaminifu wake’'
  alternative: 'Umoja: ‘mwaminifu wake’'
  rationale: Ingawa maandishi ya konsonanti yanaweza kusomwa katika umoja, mapokeo ya usomaji, ushahidi wa kale, na ulinganifu wa kishairi na ‘waovu’ vinaunga mkono maana ya pamoja katika wingi. Tanbihi inadumisha tofauti hiyo ya kimatini.
- issue: Maana wakilishi ya אִישׁ
  choice: ‘mtu’ kwa maana ya binadamu yeyote
  alternative: ‘mwanaume’
  rationale: Nomino ya Kiebrania ni ya kiume katika umoja, lakini hapa kauli ni ya kimethali na inahusu uwezo wa binadamu kwa ujumla. ‘Mtu’ ni ya asili katika Kiswahili na haibadili upeo wa kauli.
- issue: Ulinzi wa waaminifu na kushindwa kwa waovu
  choice: Kuhifadhi utofautishaji bila kueleza namna kamili ya ulinzi au hukumu
  alternative: Kufafanua kwamba ulinzi ni wa kimwili pekee au kwamba kunyamazishwa ni maangamizi pekee
  rationale: Mstari unathibitisha utunzaji wa Mungu na hukumu ya waovu, lakini picha zake za kishairi hazibainishi mipaka ya ulinzi wala namna kamili ya kunyamazishwa. Tafsiri haiongezi ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi ulio wazi na wenye hadhi. Picha ya ‘miguu’ imehifadhiwa, huku miundo ya sentensi na msamiati vikibaki vya kawaida kwa msomaji wa leo. Alama zote za tanbihi zimewekwa mara moja katika sehemu husika ya maandishi.
