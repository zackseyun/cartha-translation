base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/006.yaml
  text: Yahweh puts to death and makes alive[a]; he brings down to Sheol and raises up.
translation:
  language: sw
  text: Yahwe huua na kuhuisha; hushusha mpaka Sheoli[a] na huinua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kaburi” au “makao ya wafu.” Neno la Kiebrania “Sheoli” linamaanisha makao ya wafu; halipaswi kutafsiriwa moja kwa moja kuwa “jehanamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo, kwa tahajia ya Kiswahili iliyo wazi na ya kawaida.
- source_word: מֵמִית
  choice: huua
  rationale: Kitenzi hiki kinahifadhi maana ya kisababishi ya Hiphil na kueleza moja kwa moja mamlaka ya Yahwe juu ya kifo.
- source_word: וּמְחַיֶּה
  choice: na kuhuisha
  rationale: ‘Kuhuisha’ huhifadhi maana ya kisababishi na usambamba wa kishairi na ‘huua,’ bila kuamua ikiwa ni kutoa uhai, kudumisha uhai, au kurudisha uhai.
- source_word: מוֹרִיד
  choice: hushusha hadi
  rationale: Huhifadhi maana ya kisababishi na mwendo wa kuelekea chini unaoelezwa na kitenzi cha Kiebrania.
- source_word: שְׁאוֹל
  choice: Sheoli
  rationale: Kutunza istilahi hii huepuka kuifanya moja kwa moja kuwa ‘jehanamu’ au kuibana kuwa kaburi la mtu mmoja; umbo ‘Sheoli’ linaendana na matumizi ya kawaida ya Kiswahili.
- source_word: וַיָּעַל
  choice: na kuinua kutoka huko
  rationale: Huhifadhi kinyume cha ‘hushusha’ na maana ya kusababisha kupanda, huku ‘kutoka huko’ ikirejelea Sheoli bila kuongeza wazi fundisho mahsusi la ufufuo wa mwili.
theological_decisions:
- issue: Ikiwa mstari utumie wazi lugha ya ufufuo wa mwili
  choice: Kutumia lugha pana ya ‘kuhuisha’ na ‘kuinua kutoka huko.’
  alternative: Kutafsiri ‘hufufua kutoka kwa wafu.’
  rationale: Kiebrania kinathibitisha mamlaka ya Yahwe juu ya kifo na Sheoli, lakini lugha yake ni pana na ya kishairi; tafsiri haipaswi kuongeza ubainifu wa ufufuo wa mwili ambao haujaelezwa moja kwa moja hapa.
- issue: Maana ya שְׁאוֹל
  choice: Kutumia ‘Sheoli’ na kuifafanua katika tanbihi.
  alternative: Kutumia ‘kaburi,’ ‘makao ya wafu,’ au ‘jehanamu’ katika matini kuu.
  rationale: ‘Sheoli’ hudumisha upana wa dhana ya Kiebrania na haichanganyi moja kwa moja na jehanamu; tanbihi huwasaidia wasomaji kuelewa maana yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo mfupi na usambamba wa kishairi wa Kiebrania umehifadhiwa; ‘huko’ huzuia urudiaji mzito wa ‘Sheoli’ huku ikidumisha mwelekeo wa kutoka katika makao ya wafu.
