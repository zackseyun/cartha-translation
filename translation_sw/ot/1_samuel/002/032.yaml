base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/032.yaml
  text: You will look on the distress of the dwelling in all the good that he does for Israel[a], and there will not be an old man in your house all the days.
translation:
  language: sw
  text: Nawe utaiona dhiki ya makao[a] katika mema yote atakayowatendea Israeli, wala katika nyumba yako hatakuwapo mzee siku zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “adui katika makao,” “dhiki mahali patakatifu,” au maana inayofanana; kauli ya Kiebrania ni ngumu.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִבַּטְתָּ
  choice: utaiona
  rationale: Hifili ya נבט humaanisha kutazama au kuona. “Utaiona” ni Kiswahili cha kawaida kinachodumisha wazo la Eli kushuhudia hukumu bila kuongeza hisia ya wivu.
- source_word: צַר
  choice: dhiki
  rationale: Neno hili linaweza kumaanisha dhiki au adui. “Dhiki” linafaa katika muktadha wa hukumu, huku uwezekano wa maana nyingine ukihifadhiwa katika tanbihi.
- source_word: מָעוֹן
  choice: makao
  rationale: מָעוֹן ni mahali pa kukaa au makao. “Makao” yanadumisha maana pana na yanaweza kueleweka kuwa mahali patakatifu bila kulifanya hilo kuwa wazi kuliko Kiebrania.
- source_word: בְּכֹל אֲשֶׁר יֵיטִיב אֶת־יִשְׂרָאֵל
  choice: katika mema yote atakayoitendea Israeli
  rationale: Kauli hii inadumisha upana wa mema anayotendewa Israeli na inaacha mtendaji bila kutajwa kwa jina, kama ilivyo katika chanzo, ingawa muktadha unaelekeza kwa Mungu.
- source_word: זָקֵן
  choice: mzee
  rationale: Hapa neno linamaanisha mtu aliyefikia uzee, si mwenye cheo cha uongozi.
- source_word: בְּבֵיתְךָ
  choice: katika nyumba yako
  rationale: “Nyumba” inaweza kumaanisha kaya au ukoo. Tafsiri hii inadumisha sitiari ya Kiebrania huku muktadha ukionyesha kuwa hukumu inahusu kizazi cha Eli.
- source_word: כָּל הַיָּמִים
  choice: siku zote
  rationale: Hii inafuata nahau halisi ya Kiebrania na kudumisha uzito wake bila kuibadili kuwa kauli iliyo wazi zaidi kuliko chanzo.
theological_decisions:
- issue: Maana ya kauli ngumu צַר מָעוֹן
  choice: dhiki ya makao
  alternative: adui katika makao; dhiki mahali patakatifu
  rationale: Kiebrania kina utata mkubwa hapa. “Dhiki ya makao” kinadumisha muundo na utata wa chanzo badala ya kuamua kwamba kinazungumzia mtu adui au tukio mahususi katika mahali patakatifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka. Muundo unabaki karibu na Kiebrania pale ambapo utata wake ni wa maana.
