review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the priest, divine resolve expressed through heart and soul, and the promised enduring ‘house.’ However, ‘atahudumu mbele ya’ interprets the Hitpael of הלך as priestly service rather than preserving its broader sense of continual walking/conduct before the anointed one. ‘Ataenenda mbele ya’ is both established biblical Kiswahili and closer to the source.
  naturalness: The wording is clear, dignified Standard East African Swahili. ‘Nitajiinulia’ works naturally for divine appointment, and ‘moyoni mwangu na nafsini mwangu’ appropriately retains the paired anthropomorphic idiom. Writing ‘mtiwa mafuta’ without a hyphen is more conventional Swahili orthography.
  terminology: ‘Kuhani mwaminifu,’ ‘nyumba imara,’ and ‘mtiwa mafuta wangu’ preserve the source’s key terms and ambiguity. The footnotes appropriately identify the household/dynasty sense of ‘house’ and the possible renderings of מְשִׁיחִי without imposing a doctrinal interpretation.
  issues:
  - severity: medium
    issue: ‘Atahudumu mbele ya’ is more specific than the source verb.
    rationale: וְהִתְהַלֵּךְ literally denotes walking/continuing to walk and can imply ongoing conduct or attendance. While service is contextually possible, making it the sole main-text sense narrows the Hebrew. ‘Ataenenda mbele ya’ retains the idiom and its range.
  - severity: low
    issue: Hyphenation in ‘mtiwa-mafuta’ is nonstandard.
    rationale: The participial expression is more naturally written as two words, ‘mtiwa mafuta,’ in standard modern Kiswahili.
  revised_text: Nami nitajiinulia kuhani mwaminifu, ambaye atafanya kulingana na yaliyo moyoni mwangu na nafsini mwangu. Nitamjengea nyumba imara[a], naye ataenenda mbele ya mtiwa mafuta wangu[b] siku zote.
  revised_footnotes:
