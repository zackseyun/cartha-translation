base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/035.yaml
  text: And I will raise up for myself a faithful priest[a], who will do according to what is in my heart and in my soul. And I will build for him a faithful house[b], and he will walk before my anointed all the days.
translation:
  language: sw
  text: Nami nitajiinulia kuhani mwaminifu, ambaye atafanya kulingana na yaliyo moyoni mwangu na nafsini mwangu. Nitamjengea nyumba imara[a], naye ataenenda mbele ya mtiwa mafuta wangu[b] siku zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukoo wa kudumu”—yaani, jamaa au nasaba itakayodumu.
    reason: lexical_alternative
  - marker: b
    text: “Mtiwa mafuta wangu” pia inaweza kutafsiriwa “Masihi wangu,” au katika muktadha huu, “mfalme wangu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲקִימֹתִי לִי
  choice: nitajiinulia
  rationale: Kitenzi hiki kinaonyesha kwamba Mungu mwenyewe atamweka mtu huyo katika wadhifa; umbo la kujirejelea linaakisi לִי, ‘kwa ajili yangu mwenyewe.’
- source_word: כֹּהֵן נֶאֱמָן
  choice: kuhani mwaminifu
  rationale: ‘Kuhani’ ni jina la kawaida la wadhifa huu, na ‘mwaminifu’ linaonyesha kutegemeka na uaminifu katika kutimiza wajibu.
- source_word: בִּלְבָבִי וּבְנַפְשִׁי
  choice: moyoni mwangu na nafsini mwangu
  rationale: Tafsiri hii inadumisha lugha ya kibinadamu inayotumiwa kumhusu Mungu na msisitizo wa maneno mawili ya Kiebrania bila kuyapunguza kuwa ‘mapenzi yangu’ pekee.
- source_word: בַּיִת נֶאֱמָן
  choice: nyumba imara
  rationale: ‘Nyumba’ inadumisha sitiari ya Kiebrania, huku ‘imara’ ikionyesha nyumba au ukoo uliothibitishwa na wa kudumu. Maana ya ukoo imeelezwa katika tanbihi bila kuingizwa moja kwa moja katika matini.
- source_word: וְהִתְהַלֵּךְ לִפְנֵי
  choice: atahudumu mbele ya
  rationale: Katika muktadha wa kuhani, nahau ya ‘kuenenda mbele ya’ inaonyesha mwenendo na huduma ya kudumu. ‘Atahudumu mbele ya’ ni Kiswahili cha sasa na cha asili, bila kuifanya kuwa mwendo wa kimwili tu.
- source_word: מְשִׁיחִי
  choice: mtiwa-mafuta wangu
  rationale: Hili linadumisha maana ya msingi ya neno la Kiebrania bila kulibana mapema kuwa jina maalumu ‘Masihi’ au kulifafanua moja kwa moja kuwa ‘mfalme.’
theological_decisions:
- issue: Mhusika anayerejelewa na מְשִׁיחִי
  choice: mtiwa-mafuta wangu
  alternative: Masihi wangu; mfalme wangu
  rationale: Katika mazingira ya karibu, neno linaweza kumaanisha mtawala aliyetiwa mafuta na Bwana; katika usomaji mpana wa kikanoni linaweza pia kueleweka kimasiya. Tafsiri kuu inadumisha upana huo badala ya kuamua maana moja.
- issue: Maana ya ‘nyumba’ katika ahadi kwa kuhani
  choice: nyumba imara
  alternative: ukoo wa kudumu; jamaa itakayodumu
  rationale: ‘Nyumba’ yaelekea kumaanisha jamaa au nasaba ya kikuhani inayodumu, lakini sitiari ya chanzo imeachwa katika matini na kufafanuliwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi inahifadhi picha za ‘moyo,’ ‘nafsi,’ na ‘nyumba,’ huku nahau ya kikuhani ikitolewa kwa lugha inayoeleweka kwa msomaji wa kawaida. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
