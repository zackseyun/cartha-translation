  to: Nami nitajiinulia kuhani mwaminifu, ambaye atafanya kulingana na yaliyo moyoni mwangu na nafsini mwangu. Nitamjengea nyumba imara[a], naye ataenenda mbele ya mtiwa mafuta wangu[b] siku zote.
