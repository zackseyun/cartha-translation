    text: Au, “ukoo wa kudumu”—yaani, jamaa au nasaba itakayodumu.
    reason: lexical_alternative
  - marker: b
    text: “Mtiwa mafuta wangu” pia inaweza kutafsiriwa “Masihi wangu,” au katika muktadha huu, “mfalme wangu.”
    reason: alternative_reading
  revision_rationale: The revision replaces the interpretive ‘atahudumu’ with ‘ataenenda,’ preserving the Hebrew walking idiom and leaving its service-related implication available without narrowing it. It also regularizes ‘mtiwa mafuta’ as two words. No other change is needed.
