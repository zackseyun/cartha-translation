base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/031.yaml
  text: Look[a], days are coming when I will cut off your strength and the strength of your father's house, so that there will not be an old man in your house.
translation:
  language: sw
  text: Tazama, siku zinakuja nitakapozikatilia mbali nguvu zako[a] na nguvu za nyumba ya baba yako, ili asiwepo mzee katika nyumba yako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri halisi, “mkono wako ... mkono wa nyumba ya baba yako.” Hapa “mkono” ni sitiari ya Kiebrania ya nguvu au uwezo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Huanzisha tangazo zito la kinabii; “Tazama” huhifadhi nguvu ya kuelekeza usikivu kwa lugha ya heshima na inayoeleweka.
- source_word: יָמִים בָּאִים
  choice: siku zinakuja
  rationale: Huhifadhi mtindo wa kawaida wa kinabii unaotangaza hukumu inayokuja.
- source_word: וְגָדַעְתִּי
  choice: nitazikata
  rationale: Kitenzi kina maana ya kukata au kukatilia mbali; hapa kinaonyesha kuondolewa kwa nguvu kwa uamuzi mkali.
- source_word: זְרֹעֲךָ
  choice: nguvu zako
  rationale: Ingawa maana ya moja kwa moja ni “mkono wako,” hapa mkono ni sitiari ya nguvu au uwezo.
- source_word: זְרֹעַ בֵּית אָבִיךָ
  choice: nguvu za jamaa ya baba yako
  rationale: Hurejelea nguvu na uendelevu wa ukoo wa Eli; “jamaa ya baba yako” huwasilisha kwa kawaida dhana ya nyumba ya kifamilia.
- source_word: מֵהְיוֹת זָקֵן בְּבֵיתֶךָ
  choice: hata asiwepo mzee katika jamaa yako
  rationale: 'Muundo wa Kiebrania unaonyesha matokeo: kuondolewa kwa nguvu kutasababisha kutokuwapo kwa mtu atakayefikia uzee katika jamaa hiyo.'
- source_word: זָקֵן
  choice: mzee
  rationale: Katika muktadha huu neno humaanisha mtu mwenye umri mkubwa, si mwenye cheo cha uongozi.
theological_decisions:
- issue: Maana ya sitiari ya “mkono” katika tangazo la hukumu
  choice: Kutafsiri זְרוֹעַ kwa maana yake ya sitiari, “nguvu,” katika sehemu zote mbili
  alternative: Kutafsiri moja kwa moja kuwa “mkono”
  rationale: Katika Kiebrania mkono mara nyingi huwakilisha nguvu au uwezo. Muktadha wa hukumu juu ya jamaa ya Eli na kauli inayofuata kuhusu kutokuwapo kwa mzee huunga mkono maana hiyo bila kuongeza fundisho la dhehebu.
- issue: Maana ya בַּיִת katika kauli za kifamilia
  choice: jamaa
  alternative: nyumba
  rationale: Hapa “nyumba” ni jamaa au ukoo, si jengo. “Jamaa” huwasilisha maana hiyo wazi katika Kiswahili cha sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya tangazo la kinabii lakini kinachoeleweka kwa msomaji wa kawaida. “Jamaa” limetumiwa badala ya “nyumba” ili kuonyesha wazi ukoo au familia pana.
