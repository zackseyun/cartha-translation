base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/017.yaml
  text: So the sin of the young men was very great before Yahweh[c][b][a], because the men despised Yahweh’s offering.
translation:
  language: sw
  text: Basi dhambi ya vijana hao ilikuwa kubwa sana mbele ya Yahwe,[a] kwa sababu watu hao waliidharau sadaka ya Yahwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mbele ya uso wa Yahwe,” yaani, mbele ya Yahwe au katika uwepo wake.'
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania minḥah linaweza kumaanisha sadaka kwa ujumla, na katika baadhi ya miktadha humaanisha hasa sadaka ya nafaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: dhambi
  rationale: Katika muktadha huu neno hilo linamaanisha uovu wa wana wa Eli, si sadaka ya dhambi.
- source_word: הַנְּעָרִים
  choice: vijana hao
  rationale: Neno נַעַר linaweza kumaanisha kijana au mtumishi; hapa linawahusu wana wa Eli waliokuwa watu wazima lakini bado lina maana ya vijana.
- source_word: גְּדוֹלָה מְאֹד
  choice: ilikuwa kubwa sana
  rationale: Huhifadhi msisitizo wa Kiebrania kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: אֶת־פְּנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Ni usemi wa asili unaomaanisha mbele ya Yahwe au katika uwepo wake; 'mbele za' ni Kiswahili cha Biblia kinachoeleweka na kuhifadhi wazo la uwepo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetafsiriwa kwa uhawilishaji wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa kiunganishi kinaeleza sababu ya dhambi yao kuhesabiwa kuwa kubwa sana.
- source_word: נִאֲצוּ
  choice: waliidharau
  rationale: Kitenzi kinaonyesha kuidharau au kuifanyia jambo kwa dharau; 'waliidharau' ni cha moja kwa moja na cha asili.
- source_word: הָאֲנָשִׁים
  choice: watu hao
  rationale: Neno la kawaida אִישׁ linaweza kumaanisha mtu au mwanamume; hapa linawarejelea wale vijana waliotajwa na 'watu hao' hudumisha rejeo bila kuongeza tafsiri.
- source_word: מִנְחַת יְהוָה
  choice: sadaka ya Yahwe
  rationale: מִנְחָה linaweza kumaanisha sadaka kwa upana na wakati mwingine sadaka ya nafaka; muktadha huu unahitaji neno pana lisilobainisha kupita kiasi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la Mungu la herufi nne; 'Yahwe' huhifadhi jina hilo badala ya kuliweka kama cheo.
- issue: Maana ya kuwa dhambi ilikuwa אֶת־פְּנֵי יְהוָה
  choice: mbele za Yahwe
  alternative: dhidi ya Yahwe
  rationale: Kiebrania kinataja uso au uwepo wa Yahwe, si kihusishi cha kawaida cha 'dhidi ya'; hivyo tafsiri inahifadhi wazo la kuwa mbele zake bila kuondoa uwezekano wa hukumu yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo 'mbele za Yahwe' una ladha ya lugha ya Biblia lakini bado unaeleweka kwa urahisi; 'waliidharau' ni wa moja kwa moja na wenye nguvu bila kuzidisha maana.
