  text: Samuel was ministering before Yahweh[a], a boy clothed with a linen ephod.
translation:
  language: sw
  text: Samweli alikuwa akihudumu mbele za Yahweh[a], akiwa mvulana aliyevaa efodi ya kitani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mbele ya uso/uwepo wa Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמוּאֵל
  choice: Samweli
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili. Kiunganishi וּ hakikuelezwa kwa neno tofauti kwa kuwa mtiririko wa simulizi ya Kiswahili haukihitaji hapa.
- source_word: מְשָׁרֵת
  choice: alikuwa akihudumu
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea na unafaa kwa huduma katika mazingira ya ibada.
- source_word: אֶת פְּנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Huhifadhi nahau ya Kiebrania inayomaanisha kuwa mbele au katika uwepo wa Mungu, huku jina la agano יְהוָה likitolewa kama Yahweh.
- source_word: נַעַר
  choice: mvulana
  rationale: Neno hili linamtambulisha Samweli kuwa kijana wa kiume bila kuongeza maana ya mtumishi ambayo tayari imo katika מְשָׁרֵת.
- source_word: חָגוּר
  choice: aliyevaa
  rationale: Ni Kiswahili cha kawaida na wazi kwa hali ya kuwa amejifunga au amevalia vazi hilo.
- source_word: אֵפוֹד
  choice: efodi
  rationale: Ni vazi maalumu la ibada la Israeli lisilo na kisawe kamili cha Kiswahili; utohozi huepuka kulifafanua kupita ushahidi wa matini.
- source_word: בָּד
  choice: ya kitani
  rationale: Katika muktadha wa mavazi ya ibada, neno hili hutaja kitani; hakuna haja ya kuongeza sifa ya ubora kama ‘kitani safi’.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina la agano יְהוָה moja kwa moja. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya kuhudumu ‘mbele za’ Yahweh
  choice: mbele za Yahweh
  alternative: katika uwepo wa Yahweh
  rationale: Utoaji huu huhifadhi taswira ya nahau ya Kiebrania bila kudai kwamba huduma hiyo ilikuwa tu mahali fulani au kuondoa wazo la uwepo wa Mungu.
translation_notes:
