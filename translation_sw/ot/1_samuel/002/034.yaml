  text: וְ/זֶה לְּ/ךָ֣ הָ/א֗וֹת אֲשֶׁ֤ר יָבֹא֙ אֶל שְׁנֵ֣י בָנֶ֔י/ךָ אֶל חָפְנִ֖י וּ/פִֽינְחָ֑ס בְּ/י֥וֹם אֶחָ֖ד יָמ֥וּתוּ שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/034.yaml
  text: 'And this will be the sign to you that will come upon your two sons[b][a], Hophni and Phinehas: both of them will die on one day.'
translation:
  language: sw
  text: 'Na hii itakuwa ishara kwako, itakayowapata wana wako wawili[a], Hofni na Finehasi: wote wawili watakufa siku moja[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “itakayowajia wana wako wawili.”
    reason: lexical_alternative
  - marker: b
    text: Neno kwa neno, “katika siku moja”; yaani, wote wawili watakufa siku ileile.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: ishara
  rationale: Neno אוֹת kwa kawaida humaanisha ishara au alama ya kuthibitisha. “Ishara” ni Kiswahili cha kawaida na linafaa hapa kwa jambo linalothibitisha hukumu iliyotangazwa.
- source_word: אֲשֶׁר יָבֹא אֶל
  choice: itakayowapata
  rationale: Kirai hiki kinaeleza tukio au hukumu itakayowajia na kuwapata wahusika. “Itakayowapata” ni lugha ya kawaida ya Kiswahili na huhifadhi wazo la jambo linalokuja juu yao bila kulifafanua kupita kiasi.
- source_word: שְׁנֵי בָנֶיךָ
  choice: wana wako wawili
  rationale: Huhifadhi idadi iliyo wazi na uhusiano wao na Eli.
- source_word: אֶל חָפְנִי וּפִינְחָס
  choice: Hofni na Finehasi
  rationale: אֶל ya pili inawataja kwa ufafanuzi wana hao wawili. Kiswahili huwasilisha uhusiano huo kwa kuweka majina moja kwa moja baada ya kirai “wana wako wawili.”
- source_word: בְּיוֹם אֶחָד
  choice: siku moja
  rationale: Hii ndiyo maana ya moja kwa moja ya kirai cha Kiebrania. Dokezo linaeleza kwamba katika muktadha humaanisha siku ileile, huku matini kuu ikihifadhi muundo wa asili.
- source_word: יָמוּתוּ שְׁנֵיהֶם
  choice: wote wawili watakufa
  rationale: Huhifadhi msisitizo kwamba kila mmoja wa wana hao wawili atakufa, kwa mpangilio wa maneno ulio wa kawaida katika Kiswahili.
theological_decisions:
- issue: Asili ya “ishara”
  choice: Ishara inayothibitisha hukumu iliyotangazwa juu ya nyumba ya Eli
  alternative: Dalili ya kinabii tu isiyo na kazi ya kuthibitisha
  rationale: Katika muktadha, kifo cha wana wawili kinathibitisha kwamba neno la hukumu juu ya nyumba ya Eli litatimia. Tafsiri inabaki na neno pana “ishara” bila kulibana zaidi katika matini kuu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili: Hofni na Finehasi.'
