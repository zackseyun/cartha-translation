  variant: Standard East African Swahili
source:
  edition: WLC
  text: לָ/כֵ֗ן נְאֻם יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ אָמ֣וֹר אָמַ֔רְתִּי בֵּֽיתְ/ךָ֙ וּ/בֵ֣ית אָבִ֔י/ךָ יִתְהַלְּכ֥וּ לְ/פָנַ֖/י עַד עוֹלָ֑ם וְ/עַתָּ֤ה נְאֻם יְהוָה֙ חָלִ֣ילָ/ה לִּ֔/י כִּֽי מְכַבְּדַ֥/י אֲכַבֵּ֖ד וּ/בֹזַ֥/י יֵקָֽלּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/030.yaml
  text: 'Therefore[a], declares Yahweh, the God of Israel: I indeed said that your house and your father’s house would walk before me forever. But now, declares Yahweh: far be it from me! For those who honor me I will honor, but those who despise me will be lightly esteemed.'
translation:
  language: sw
  text: 'Kwa hiyo, Yahweh, Mungu wa Israeli, asema hivi: “Kwa hakika nilisema kwamba nyumba yako na nyumba ya baba yako zingetembea mbele zangu milele. Lakini sasa, asema Yahweh, hilo liwe mbali nami! Kwa maana wale wanaoniheshimu nitawaheshimu, lakini wale wanaonidharau watakuwa wa maana ndogo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watadharauliwa” au “watatendewa kama watu wasio na maana.” Kitenzi cha Kiebrania kina wazo la kuwa wepesi, hafifu, au wasio na uzito, kinyume cha “nitawaheshimu.”
    reason: Kitenzi יֵקָלּוּ kina maana kadhaa zinazokaribiana, na hakuna usemi mmoja wa kawaida wa Kiswahili unaohifadhi kikamilifu utofautishaji wa Kiebrania kati ya uzito/heshima na wepesi/kutokuwa na maana.
lexical_decisions:
- source_word: לָכֵן
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho la hukumu ya Mungu kutokana na mashtaka yaliyotangulia.
- source_word: נְאֻם יְהוָה
  choice: asema Yahweh
  rationale: Ni usemi wa kinabii unaotambulisha tamko lenye mamlaka la Mungu; “asema” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huhifadhi muundo wa Kiebrania unaomtambulisha Yahweh kwa uhusiano wake na Israeli.
- source_word: אָמֹר אָמַרְתִּי
  choice: Kwa hakika nilisema
  rationale: Huhifadhi msisitizo wa kitenzi-jina kisicho na kikomo kinachofuatana na kitenzi kamili.
- source_word: בֵּיתְךָ וּבֵית אָבִיךָ
  choice: nyumba yako na nyumba ya baba yako
  rationale: “Nyumba” huhifadhi maana ya familia au ukoo pamoja na urudiaji wa neno katika Kiebrania.
- source_word: יִתְהַלְּכוּ לְפָנַי
  choice: zingetembea mbele zangu
  rationale: Huhifadhi taswira ya kutembea mbele za Mungu bila kuifinya iwe huduma ya kikuhani pekee, ingawa muktadha unairuhusu maana hiyo.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Ni tafsiri ya kawaida ya usemi wa muda usio na kikomo na huacha mvutano wa ahadi ya awali na tamko linalofuata.
- source_word: וְעַתָּה
  choice: Lakini sasa
  rationale: Huonyesha wazi badiliko kali kutoka tamko la awali kwenda hukumu ya sasa.
- source_word: חָלִילָה לִּי
  choice: Hilo liwe mbali nami!
  rationale: Huhifadhi nguvu na umbo la usemi wa kukataa kabisa bila kuufanya kuwa maelezo marefu.
- source_word: מְכַבְּדַי אֲכַבֵּד
  choice: wale wanaoniheshimu nitawaheshimu
  rationale: Huhifadhi urudiaji wa mzizi כבד na ulinganifu wa tendo la kumheshimu Mungu na jibu lake.
- source_word: וּבֹזַי יֵקָלּוּ
  choice: wale wanaonidharau watahesabiwa kuwa si wa maana
  rationale: “Wanaonidharau” huonyesha dharau ya בזה, na “watahesabiwa kuwa si wa maana” huwasilisha wazo la kuwa wepesi, hafifu, au wasio na uzito katika יֵקָלּוּ, kinyume cha kuheshimiwa.
theological_decisions:
- issue: Asili ya tamko la awali kuhusu nyumba ya Eli
  choice: Tamko la awali limetafsiriwa kuwa ahadi halisi ya Mungu—“Kwa hakika nilisema ... milele”—ikifuatiwa na kukataliwa kwake katika hali ya sasa.
  alternative: Kuchukulia “milele” kuwa chumvi tangu mwanzo, au kulainisha “Hilo liwe mbali nami!” ili lisimaanishe badiliko halisi.
  rationale: Mstari wenyewe unaweka tamko la awali dhidi ya “Lakini sasa” na kulihusisha badiliko hilo na kanuni kwamba Mungu huwaheshimu wanaomheshimu. Tafsiri inaacha mvutano huo wazi bila kuutatua kwa mfumo fulani wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “nyumba yako na nyumba ya baba yako” na taswira “kutembea mbele zangu” zimehifadhiwa kwa sababu zina maana pana ya kifamilia, kimwenendo, na kihuduma. Alama ya tanbihi imewekwa kwenye kishazi cha mwisho ambacho tanbihi inakieleza.
