  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/בְנֵ֥י עֵלִ֖י בְּנֵ֣י בְלִיָּ֑עַל לֹ֥א יָדְע֖וּ אֶת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/012.yaml
  text: Eli’s sons were worthless men[b][a]; they did not know Yahweh.
translation:
  language: sw
  text: Wana wa Eli walikuwa watu waovu[a]; hawakumjua Yahwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kihalisi, ‘wana wa kutofaa’; kwa mapokeo, ‘wana wa Beliali.’
    reason: lexical_alternative
  - marker: b
    text: Au ‘hawakumtambua Yahwe’ au ‘hawakumjali Yahwe.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי עֵלִי
  choice: Wana wa Eli
  rationale: בְנֵי ni wingi wa muundo wa umilikaji, ‘wana wa’; וּ ni kiunganishi cha simulizi ambacho si lazima kitafsiriwe kwa neno tofauti mwanzoni mwa sentensi hii.
- source_word: בְּנֵי בְלִיָּעַל
  choice: watu waovu
  rationale: Nahau ya Kiebrania, kihalisi ‘wana wa kutofaa,’ hapa inawaeleza wanaume wenye tabia potovu. ‘Watu waovu’ ni Kiswahili cha kawaida kinachoonyesha hukumu ya kimaadili bila kulifanya Beliali kuwa jina la kiumbe.
- source_word: לֹא יָדְעוּ
  choice: hawakumjua
  rationale: Kitenzi יָדַע kimsingi ni ‘kujua/kumjua’ na kinaweza pia kudokeza kutomtambua au kutomjali Mungu. Tafsiri ya moja kwa moja inadumisha upana huo wa maana.
- source_word: אֶת יְהוָה
  choice: Yahwe
  rationale: יְהוָה ni jina binafsi la Mungu; ‘Yahwe’ ni umbo linaloeleweka katika Kiswahili. אֶת ni kiashiria cha yambwa tendwa na hakitafsiriwi kwa neno tofauti.
theological_decisions:
- issue: Je, בְלִיָּעַל litafsiriwe kama jina binafsi ‘Beliali’ au kama maelezo ya tabia?
  choice: 'Maelezo ya tabia: ‘watu waovu’'
  alternative: ‘wana wa Beliali’ au ‘wana wa kutofaa’
  rationale: Katika muktadha huu neno hilo linaonyesha ubaya na kutofaa kwao, wala halimtaji wazi kiumbe aitwaye Beliali. Tafsiri ya maana huepuka kuingiza dhana ya baadaye katika mstari.
- issue: Je, לֹא יָדְעוּ ifafanuliwe kuwa hawakumtambua au hawakumjali Yahwe?
  choice: Kudumisha ‘hawakumjua Yahwe’
  alternative: ‘hawakumtambua Yahwe’ au ‘hawakumjali Yahwe’
  rationale: '‘Kumjua’ huhifadhi lugha ya chanzo na mvutano wake wa kitheolojia: si ukosefu tu wa taarifa, bali pia huenda ikahusu uhusiano, utambuzi, na utii.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya moja kwa moja; ‘watu waovu’ inaeleweka kwa wasomaji wa kawaida, huku tanbihi ikihifadhi nahau halisi na tafsiri ya kimapokeo.
