base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/003.yaml
  text: Do not keep speaking so very proudly; do not let arrogance come out of your mouth[a], for Yahweh is a God of knowledge, and by him actions are weighed.
translation:
  language: sw
  text: Msizidi kusema kwa majivuno makubwa; maneno ya majivuno yasitoke vinywani mwenu, kwa maana Yahweh ni Mungu wa maarifa, na matendo hupimwa naye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata kwa karibu zaidi usomaji wa konsonanti, “na matendo hayapimwi.” Maandishi makuu yanafuata usomaji wa kimapokeo kwamba Yahweh hutathmini matendo ya wanadamu.
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּרְבּוּ תְדַבְּרוּ
  choice: Msizidi kusema
  rationale: Muundo wa רבה pamoja na kitenzi kinachofuata unakataza kuendelea au kurudia-rudia kusema. “Msizidi kusema” ni Kiswahili cha kawaida kinachohifadhi nguvu ya katazo.
- source_word: גְּבֹהָה גְבֹהָה
  choice: kwa kiburi kikubwa
  rationale: Urudiaji wa neno linalomaanisha kuwa juu unasisitiza majivuno au majigambo katika usemi. Tafsiri hii inaeleza msisitizo huo kwa Kiswahili cha asili.
- source_word: יֵצֵא עָתָק מִפִּיכֶם
  choice: maneno ya majivuno yasitoke vinywani mwenu
  rationale: עָתָק hapa hudokeza usemi wa kiburi, jeuri, au kujidai. Katazo la kishazi kilichotangulia limeendelezwa wazi, na wingi wa “vinywani mwenu” unalingana na kiambishi cha wingi katika Kiebrania.
- source_word: אֵל דֵּעוֹת יְהוָה
  choice: Yahweh ni Mungu wa maarifa
  rationale: Kirai hiki kihalisi ni “Mungu wa maarifa.” Wingi wa דֵּעוֹת unaonyesha utimilifu au upana wa maarifa; “maarifa” huhifadhi muundo huo bila kuongeza moja kwa moja neno “yote.”
- source_word: וְלֹא / וְלוֹ נִתְכְּנוּ עֲלִלוֹת
  choice: na mbele zake matendo hupimwa
  rationale: Rasimu kuu inafuata usomaji wa kimapokeo לוֹ, “kwake/mbele zake,” pamoja na kitenzi cha hali ya kutendwa. “Hupimwa” huhifadhi sitiari ya kupima kwa maana ya kutathmini matendo.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Chanzo kinatumia moja kwa moja jina la agano YHWH. “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Tofauti ya maandishi katika וְלֹא / וְלוֹ נִתְכְּנוּ עֲלִילוֹת
  choice: na mbele zake matendo hupimwa
  alternative: wala matendo hayapimwi
  rationale: Usomaji wa kimapokeo לוֹ na muktadha huleta maana kwamba Yahweh hutathmini matendo. Maandishi ya konsonanti yanaweza kusomwa לֹא, “si/hapana,” hivyo uwezekano huo muhimu umehifadhiwa katika tanbihi badala ya kufichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Maneno ya majivuno” huepuka usemi mgumu usio wa kawaida, huku “matendo hupimwa” ikihifadhi sitiari ya Kiebrania. Alama ya tanbihi imewekwa baada ya kishazi ambacho tofauti ya maandishi inahusu.
