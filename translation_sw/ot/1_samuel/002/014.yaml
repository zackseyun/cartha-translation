base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/014.yaml
  text: and he would thrust it into the basin[a], or the pot, or the kettle, or the cooking pan; all that the fork brought up, the priest would take with it[b]. Thus they did to all Israel who came there to Shiloh.
translation:
  language: sw
  text: Naye angeutumbukiza uma huo ndani ya beseni,[a] au sufuria, au chungu, au kikaango; kila kitu ambacho uma huo ungeinua, kuhani angekichukua kwa uma huo. Hivyo ndivyo walivyowafanyia Waisraeli wote waliokuja huko Shilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Utambulisho kamili wa vyombo hivi mbalimbali haujulikani kwa uhakika; Kiebrania kinaorodhesha aina kadhaa za vyombo vya kupikia.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכָּה
  choice: angeuchoma
  rationale: Hifili ya נכה katika muktadha huu inaeleza kitendo cha kurudia cha kuingiza kwa nguvu uma wenye meno matatu ndani ya chombo, si kupiga tu.
- source_word: בַכִּיּוֹר
  choice: kwenye birika
  rationale: כִּיּוֹר ni chombo kikubwa au beseni; “birika” ni neno la kawaida la Kiswahili kwa chombo kama hicho bila kulifanya liwe istilahi maalumu ya ibada.
- source_word: בַדּוּד
  choice: au sufuria
  rationale: דּוּד hurejelea chombo cha kupikia; “sufuria” ni wazi na la kawaida.
- source_word: בַקַּלַּחַת
  choice: au chungu
  rationale: Aina kamili ya chombo hiki haijulikani kwa uhakika; “chungu” kinadumisha utofauti wa vyombo vilivyoorodheshwa.
- source_word: בַפָּרוּר
  choice: au kikaango
  rationale: פָּרוּר ni chombo cha kupikia ambacho utambulisho wake kamili una utata; “kikaango” huwasilisha kazi yake huku kikitofautishwa na vyombo vilivyotangulia.
- source_word: כֹּל אֲשֶׁר יַעֲלֶה הַמַּזְלֵג
  choice: kila uma ulichoinua
  rationale: Kirai kinaeleza nyama yoyote iliyokwama kwenye uma na kuinuliwa kutoka chomboni; tafsiri hii inafuata picha ya kitenzi עלה.
- source_word: הַמַּזְלֵג
  choice: uma
  rationale: “Uma” linaeleweka kwa wasomaji wa sasa; mstari uliotangulia unaeleza kuwa ulikuwa na meno matatu.
- source_word: יִקַּח הַכֹּהֵן בּוֹ
  choice: kuhani angekichukua kwa uma huo
  rationale: בּוֹ hapa kwa kawaida huonyesha chombo kilichotumiwa. Kutaja uma wazi kunaondoa utata wa kiwakilishi katika Kiswahili.
- source_word: כָּכָה יַעֲשׂוּ
  choice: Hivyo ndivyo walivyowatendea
  rationale: Wingi wa kitenzi cha Kiebrania unadumishwa, na muundo huu unaonyesha desturi yao iliyokuwa ikirudiwa.
- source_word: לְכָל יִשְׂרָאֵל הַבָּאִים שָׁם בְּשִׁלֹה
  choice: Waisraeli wote waliokuja huko Shilo
  rationale: Hii inawasilisha maana ya pamoja ya “Israeli wote” kama waabudu kutoka Israeli waliokuja Shilo, kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Mabadiliko ya idadi katika kifungu cha muhtasari
  choice: Kudumisha umoja katika “kuhani angekichukua,” kisha wingi katika “walivyowatendea.”
  alternative: 'Kusawazisha sentensi yote iwe katika umoja: “kuhani aliwatendea.”'
  rationale: Kiebrania hubadilika kutoka umoja katika tendo la kuhani kwenda wingi katika muhtasari wa desturi pana ya watumishi au nyumba ya kikuhani. Kudumisha badiliko hilo huepuka kufuta muundo wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Matumizi ya “ange-” yanaonyesha tendo la kawaida lililorudiwa katika muktadha. Alama ya tanbihi [a] imewekwa baada ya chombo cha kwanza ili ihusu orodha nzima ya vyombo.
