base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/002.yaml
  text: There is none holy like Yahweh[a], for there is none besides you, and there is no rock like our God.
translation:
  language: sw
  text: 'Hakuna aliye mtakatifu kama Yahweh[a],

    kwa maana hakuna ila wewe;

    wala hakuna mwamba kama Mungu wetu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: יהוה (YHWH), jina la Mungu; hapa limetafsiriwa Yahweh.'
    reason: Maelezo ya jina la Mungu katika lugha ya asili.
lexical_decisions:
- source_word: אֵין
  choice: hakuna
  rationale: Neno hili linaonyesha kutokuwapo kwa kitu au mtu. Kurudia “hakuna” katika mistari yote mitatu kunahifadhi mkazo na usambamba wa kishairi wa Kiebrania.
- source_word: קָדוֹשׁ
  choice: mtakatifu
  rationale: “Mtakatifu” ni tafsiri ya kawaida na yenye uzito unaofaa, ikieleza upekee na utakatifu wa Mungu.
- source_word: כַּיהוָה
  choice: kama Yahwe
  rationale: Kiambishi כַּ־ kinaonyesha ulinganisho, “kama,” na יְהוָה ni jina la Mungu, lililotafsiriwa “Yahwe.”
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa neno hili linatoa sababu ya dai lililotangulia; “kwa maana” ni la asili katika Kiswahili na linafaa katika ushairi wenye hadhi.
- source_word: בִּלְתֶּךָ
  choice: mwingine ila wewe
  rationale: Kirai hiki kinaonyesha kutengwa kwa wengine wote huku kikihifadhi usemi wa moja kwa moja kwa Mungu katika nafsi ya pili.
- source_word: צוּר
  choice: mwamba
  rationale: “Mwamba” huhifadhi sitiari halisi ya Kiebrania ya uimara, usalama na ulinzi, bila kuifafanua kwa maana moja tu kama “kimbilio.”
- source_word: כֵּאלֹהֵינוּ
  choice: kama Mungu wetu
  rationale: Ingawa אֱלֹהִים ina umbo la wingi, hapa inamtaja Mungu wa Israeli kwa umoja; kiambishi כְּ־ kinaonyesha ulinganisho.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia moja kwa moja jina la agano יְהוָה. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Sitiari ya צוּר kuhusu Mungu
  choice: mwamba
  alternative: kimbilio
  rationale: Tafsiri halisi “mwamba” huhifadhi upana wa picha ya Kiebrania—uimara, nguvu, usalama na ulinzi—badala ya kuifungia katika wazo la kimbilio pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi, wa heshima na unaoeleweka kwa urahisi. Usambamba wa sentensi za Kiebrania umehifadhiwa kwa kurudia “hakuna”; “ila wewe” hudumisha maombi yanayomwelekea Mungu moja kwa moja.
