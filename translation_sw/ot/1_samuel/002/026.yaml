  text: Mtoto Samweli aliendelea kukua, akimpendeza Yahwe na watu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Mtoto Samweli aliendelea kukua, akiwa mwenye kibali kwa Yahwe na kwa watu.” Kiebrania husisitiza pande zote mbili: “pia kwa Yahwe na pia kwa watu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: Mtoto
  rationale: נַעַר inaweza kumaanisha mvulana, kijana, au mtumishi mchanga. Katika muktadha huu Samweli bado ni mtoto anayehudumu katika mahali patakatifu, hivyo “mtoto” linafaa zaidi.
- source_word: שְׁמוּאֵל
  choice: Samweli
  rationale: Jina la mtu limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: הֹלֵךְ וְגָדֵל
  choice: aliendelea kukua
  rationale: Muundo wa הֹלֵךְ pamoja na neno linalofuata unaonyesha maendeleo yanayoendelea; “aliendelea kukua” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וָטוֹב
  choice: na kupendeza
  rationale: Katika muundo טוֹב עִם, טוֹב huonyesha kuwa mtu anakubalika au anapendeza katika uhusiano na mwingine. “Kupendeza mbele za” ni Kiswahili cha asili na huepuka kulifanya neno hili kuwa dai la moja kwa moja kuhusu wema wa kimaadili.
- source_word: גַּם עִם יְהוָה וְגַם עִם אֲנָשִׁים
  choice: mbele za Yahwe na mbele za watu
  rationale: Marudio ya גַּם ... וְגַם yanaonyesha pande mbili zilizosawazishwa. Kurudia “mbele za” kunahifadhi ulinganifu huo, na אֲנָשִׁים hapa hutaja wanadamu kwa ujumla, hivyo “watu” ni la kawaida na sahihi katika Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina la agano יהוה lenyewe; “Yahwe” hulihifadhi kama jina binafsi badala ya kuliwakilisha kwa cheo.
- issue: Maana ya וָטוֹב עִם
  choice: kupendeza mbele za
  alternative: kuwa mwema mbele za
  rationale: Muundo huu unaweza kueleza kukubalika au kupendeza kwa Yahwe na kwa watu. Tafsiri iliyochaguliwa inafaa kwa wahusika wote wawili na haibani neno hilo kuwa sifa ya kimaadili pekee; tanbihi inahifadhi uwezekano wa tafsiri ya karibu zaidi na umbo la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mtoto” linaonyesha umri wa Samweli katika muktadha; “kupendeza mbele za” ni wazi kwa msomaji wa kawaida na huhifadhi uhusiano wa Samweli na Yahwe pamoja na watu.
