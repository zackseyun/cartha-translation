  text: מֵקִ֨ים מֵ/עָפָ֜ר דָּ֗ל מֵֽ/אַשְׁפֹּת֙ יָרִ֣ים אֶבְי֔וֹן לְ/הוֹשִׁיב֙ עִם נְדִיבִ֔ים וְ/כִסֵּ֥א כָב֖וֹד יַנְחִלֵ֑/ם כִּ֤י לַֽ/יהוָה֙ מְצֻ֣קֵי אֶ֔רֶץ וַ/יָּ֥שֶׁת עֲלֵי/הֶ֖ם תֵּבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/008.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap, to seat them with nobles and make them inherit a seat of honor. For the pillars of the earth belong to Yahweh[b], and on them he has set the world.
translation:
  language: sw
  text: Humwinua maskini kutoka mavumbini; humwinua mhitaji kutoka jalalani, ili awaketishe pamoja na wakuu na kuwafanya warithi wa kiti cha heshima[a]. Kwa maana nguzo za dunia ni za Yahwe[b], naye ameuweka ulimwengu juu yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiti cha enzi cha heshima.”
    reason: lexical_alternative
  - marker: b
    text: Au, “misingi ya dunia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים מֵעָפָר דָּל
  choice: Humwinua maskini kutoka mavumbini
  rationale: Kitenzi cha kisababishi kinaonyesha kumtoa mtu wa hali ya chini na kumweka juu; “mavumbini” inadumisha taswira halisi ya unyonge.
- source_word: מֵאַשְׁפֹּת יָרִים אֶבְיוֹן
  choice: humwinua mhitaji kutoka jalalani
  rationale: “Jalalani” huonyesha mahali pa kutupa taka na hivyo kuhifadhi taswira ya fedheha; “mhitaji” hutofautisha אֶבְיוֹן na דָּל bila kupoteza ulinganifu wa kishairi.
- source_word: לְהוֹשִׁיב עִם נְדִיבִים
  choice: ili awaketishe pamoja na wakuu
  rationale: Muundo unaonyesha kusudi au matokeo, na נְדִיבִים hapa ni watu wenye cheo au hadhi.
- source_word: וְכִסֵּא כָבוֹד יַנְחִלֵם
  choice: na kuwafanya warithi kiti cha heshima
  rationale: “Kuwafanya warithi” huhifadhi maana ya kisababishi ya נחל, huku “kiti cha heshima” kikibaki cha kawaida na kisichosisitiza ufalme kuliko maandishi yanavyolazimu.
- source_word: מְצֻקֵי אֶרֶץ
  choice: nguzo za dunia
  rationale: Huhifadhi taswira ya kishairi ya miundo inayotegemeza dunia; maana mbadala ya “misingi” imewekwa katika tanbihi.
- source_word: תֵּבֵל
  choice: ulimwengu
  rationale: Ni tafsiri ya kawaida na ya asili kwa ulimwengu uliopangwa au unaokaliwa.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa umbo la Kiswahili la jina binafsi, kulingana na safu ya mashauriano ya POB, badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Taswira ya ulimwengu katika מְצֻקֵי אֶרֶץ
  choice: Kudumisha “nguzo za dunia” katika matini kuu
  alternative: “misingi ya dunia”
  rationale: Kauli ni ya kishairi na inaeleza enzi kuu ya Yahwe kwa taswira halisi; haipaswi kubadilishwa kimya kimya kuwa maelezo ya kinadharia.
- issue: Maana ya כִסֵּא כָבוֹד
  choice: “kiti cha heshima”
  alternative: “kiti cha enzi cha heshima”
  rationale: כִסֵּא inaweza kuwa kiti au kiti cha enzi. Kwa kuwa wanaoinuliwa ni maskini na wahitaji kwa ujumla, tafsiri kuu haibani maana kwenye kutawazwa kifalme, lakini uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kishairi, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Umoja wa “maskini/mhitaji” umehifadhiwa, kisha kiambishi cha wingi katika “awaketishe” na “kuwafanya” kinafuata kiambishi cha wingi cha Kiebrania kinachowarejelea watu hao kwa pamoja.
