base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/001.yaml
  text: 'And Hannah prayed and said: “My heart exults in Yahweh[a]; my horn is lifted high in Yahweh. My mouth is opened wide against my enemies[c][b], because I rejoice in your salvation.”'
translation:
  language: sw
  text: 'Hana akaomba na kusema:


    “Moyo wangu unashangilia katika Yahweh;

    pembe yangu imeinuliwa juu katika Yahweh.[a]

    Kinywa changu kimefunguka dhidi ya adui zangu,[b]

    kwa maana nimefurahi katika wokovu wako.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “pembe yangu.” Pembe ni sitiari ya nguvu, heshima, au hadhi iliyotukuzwa.
    reason: cultural_note
  - marker: b
    text: Au “ninajisifu juu ya adui zangu” au “ninasema kwa ujasiri dhidi ya adui zangu.” Kiebrania kinasema kihalisi, “kinywa changu kimefunguka dhidi ya adui zangu.”
    reason: lexical_alternative
  - marker: c
    text: Au “ukombozi wako.” Neno la Kiebrania linaweza kumaanisha wokovu kwa upana au kuokolewa kutoka katika dhiki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפַּלֵּל
  choice: akaomba
  rationale: Kitenzi cha Kiebrania katika hitpaeli humaanisha ‘kuomba.’ Tafsiri hii inadumisha utangulizi wa simulizi unaoyatambulisha maneno ya Hana kama sala.
- source_word: וַתֹּאמַר
  choice: na kusema
  rationale: Kiebrania kinatumia kitenzi cha kawaida cha ‘kusema,’ si kitenzi maalumu cha kuimba; kwa hiyo hakijapanuliwa kuwa ‘akaimba.’
- source_word: עָלַץ לִבִּי
  choice: Moyo wangu unashangilia
  rationale: עָלַץ huonyesha furaha kubwa yenye shangwe. ‘Unashangilia’ inadumisha nguvu ya kishairi na taswira ya moyo kama mhusika.
- source_word: בַּיהוָה
  choice: katika Yahwe
  rationale: ‘Katika’ inadumisha kwa kadiri iwezekanavyo wazo la Yahwe kuwa msingi au mazingira ya shangwe na kuinuliwa, bila kulifunga tu kuwa sababu au chombo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetafsiriwa kwa unukuzi ‘Yahwe’ badala ya kubadilishwa na cheo kama ‘BWANA.’
- source_word: רָמָה קַרְנִי
  choice: pembe yangu imeinuliwa juu
  rationale: Taswira ya Kiebrania ya ‘pembe’ imehifadhiwa kwa sababu inaweza kuashiria nguvu, heshima, au hadhi iliyotukuzwa; tanbihi inaifafanua bila kuiondoa katika matini.
- source_word: רָחַב פִּי עַל אֹיְבַי
  choice: Kinywa changu kimefunguka wazi dhidi ya adui zangu
  rationale: Tafsiri inadumisha taswira halisi ya kinywa kilichofunguka dhidi ya maadui, huku tanbihi ikionyesha maana zinazowezekana za kusema kwa ujasiri au kujivunia ushindi.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa kiunganishi kinaeleza sababu ya Hana kusema kwa ushindi.
- source_word: שָׂמַחְתִּי
  choice: ninafurahia
  rationale: Kauli timilifu ya Kiebrania inaweza kuonyesha hali ya sasa inayotokana na tendo lililotimia. ‘Ninafurahia’ inasikika kwa kawaida katika Kiswahili na kuendeleza sauti ya sifa.
- source_word: בִּישׁוּעָתֶךָ
  choice: wokovu wako
  rationale: יְשׁוּעָה inaweza kumaanisha wokovu kwa upana au kuokolewa katika taabu fulani. ‘Wokovu’ inadumisha upana huo, na mbadala wa ‘ukombozi/kuokolewa’ umeelezwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Matini ina jina la Mungu יהוה moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu fulani.
- issue: Maana ya בִּישׁוּעָתֶךָ katika hali ya Hana
  choice: wokovu wako
  alternative: ukombozi wako; jinsi ulivyoniokoa
  rationale: Neno linaweza kueleza wokovu kwa maana pana au uokozi halisi kutoka katika dhiki. Matini kuu inadumisha maana pana, huku tanbihi ikihifadhi uwezekano wa maana mahususi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kishairi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa mistari umehifadhi usambamba wa shairi. Taswira ya ‘pembe’ na ya ‘kinywa kilichofunguka’ imeachwa katika matini na kufafanuliwa kwa tanbihi. Viashiria vya tanbihi vimewekwa baada ya vifungu vinavyohusika.
