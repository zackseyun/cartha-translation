  variant: Standard East African Swahili
source:
  edition: WLC
  text: יְהוָ֞ה יֵחַ֣תּוּ מריב/ו על/ו בַּ/שָּׁמַ֣יִם יַרְעֵ֔ם יְהוָ֖ה יָדִ֣ין אַפְסֵי אָ֑רֶץ וְ/יִתֶּן עֹ֣ז לְ/מַלְכּ֔/וֹ וְ/יָרֵ֖ם קֶ֥רֶן מְשִׁיחֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/010.yaml
  text: Yahweh’s adversaries will be shattered[a]; he will thunder against them from heaven. Yahweh will judge the ends of the earth[c][b]; he will give strength to his king and lift up the horn of his anointed.
translation:
  language: sw
  text: Wapinzani wa Yahwe[a] watavunjwa vipande-vipande; atawapigia radi kutoka mbinguni[b]. Yahwe ataihukumu miisho ya dunia; atampa mfalme wake nguvu na kuiinua pembe ya mtiwa-mafuta wake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wale wanaoshindana naye.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa neno moja ni “mbinguni”; hapa “kutoka mbinguni” linaonyesha mahali radi inakotoka.
    reason: lexical_alternative
  - marker: c
    text: Au, “Masihi wake.” Neno la Kiebrania מְשִׁיחוֹ (meshicho) linamaanisha “mtiwa-mafuta wake”; hapa linaweza kumtaja mfalme wa Yahwe aliyetiwa mafuta na pia lina uzito wa Kimasihi.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la agano la Mungu kwa umbo linalosomeka kwa kawaida katika Kiswahili.
- source_word: יֵחַתּוּ
  choice: watavunjwa vipande-vipande
  rationale: Nifali ya חתת hapa inaonyesha kuvunjwa na kushindwa kabisa, si kuingiwa na hofu tu.
- source_word: מְרִיבוֹ עָלָיו
  choice: Wapinzani wa Yahwe
  rationale: Inatoa kwa lugha ya kawaida maana ya wale wanaoshindana naye, huku tanbihi ikihifadhi usemi wa karibu zaidi na Kiebrania.
- source_word: בַּשָּׁמַיִם יַרְעֵם
  choice: atawapigia radi kutoka mbinguni
  rationale: Kitenzi רעם kinamaanisha kupiga radi; ‘kutoka mbinguni’ kinaeleza kwa Kiswahili chanzo cha tendo hilo linaloelekezwa dhidi yao.
- source_word: יָדִין
  choice: ataihukumu
  rationale: Kinadumisha maana pana ya kutoa hukumu na kutawala kwa haki.
- source_word: אַפְסֵי אָרֶץ
  choice: miisho ya dunia
  rationale: Ni nahau ya kawaida inayoonyesha sehemu zote za dunia, hata zilizo mbali zaidi.
- source_word: וְיִתֶּן עֹז לְמַלְכּוֹ
  choice: atampa mfalme wake nguvu
  rationale: Linahifadhi kwa uwazi neno la kifalme na tendo la Mungu la kumpa uwezo.
- source_word: וְיָרֵם קֶרֶן
  choice: kuiinua pembe
  rationale: Linahifadhi sitiari ya Kiebrania ya pembe kama ishara ya nguvu, heshima na ushindi.
- source_word: מְשִׁיחוֹ
  choice: mtiwa-mafuta wake
  rationale: Hii ndiyo maana ya moja kwa moja ya nomino katika muktadha wa mfalme aliyewekwa rasmi; tanbihi inahifadhi pia uwezekano wa kuitambua kama cheo ‘Masihi.’
theological_decisions:
- issue: Maana ya מְשִׁיחוֹ katika mstari wa kifalme wenye mwangwi wa Kimasihi
  choice: mtiwa-mafuta wake
  alternative: Masihi wake
  rationale: Muktadha wa karibu unamtaja mfalme wa Yahwe aliyetiwa mafuta. Tafsiri hii haibani rejeo kwa utimilifu wa baadaye, na tanbihi inahifadhi kwa uwazi uzito wa cheo cha Kimasihi.
- issue: Sitiari ya קֶרֶן
  choice: kuiinua pembe
  alternative: kuinua nguvu au hadhi
  rationale: Kubakiza ‘pembe’ kunahifadhi taswira ya kishairi na uhusiano wake na mada ya nguvu katika wimbo wa Hana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi na sitiari ya ‘pembe’ zimehifadhiwa, huku sentensi zikiwa wazi kwa msomaji wa kawaida.
