  text: וְ/אִ֗ישׁ לֹֽא אַכְרִ֤ית לְ/ךָ֙ מֵ/עִ֣ם מִזְבְּחִ֔/י לְ/כַלּ֥וֹת אֶת עֵינֶ֖י/ךָ וְ/לַ/אֲדִ֣יב אֶת נַפְשֶׁ֑/ךָ וְ/כָל מַרְבִּ֥ית בֵּיתְ/ךָ֖ יָמ֥וּתוּ אֲנָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/033.yaml
  text: But I will not cut off every man of yours from beside my altar[a], to make your eyes fail and your soul grieve; and all the increase of your house will die by the sword of men.
translation:
  language: sw
  text: Lakini sitamwondoa kila mwanamume wa ukoo wako kutoka kando ya madhabahu yangu, ili macho yako yadhoofike na nafsi yako ihuzunike; na wazao wote wa nyumba yako watakufa wakiwa wanaume[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kihalisi, “watakufa wakiwa wanaume.” Huenda maana yake ni kwamba watakufa wakiwa katika nguvu za utu uzima, kabla ya kufikia uzee.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ לֹא אַכְרִית לְךָ מֵעִם מִזְבְּחִי
  choice: Lakini si kila mwanamume wa ukoo wako nitakayemwondoa kutoka kando ya madhabahu yangu
  rationale: Muundo wa kukanusha unaonyesha kwamba si wanaume wote wa ukoo wa Eli watakaoondolewa. “Kutoka kando ya madhabahu yangu” huhifadhi maana ya מֵעִם na uhusiano wao na huduma ya madhabahuni bila kudai kwamba ukoo wote utaangamizwa mara moja.
- source_word: לְכַלּוֹת אֶת עֵינֶיךָ
  choice: ili kuyadhoofisha macho yako
  rationale: Huhifadhi taswira ya macho yanayodhoofika kwa huzuni na mateso, kwa Kiswahili cha kawaida na chenye staha.
- source_word: וְלַאֲדִיב אֶת נַפְשֶׁךָ
  choice: na kuihuzunisha nafsi yako
  rationale: Kitenzi adimu kinaonyesha kusababisha maumivu au huzuni; “nafsi” huhifadhi lugha ya ndani ya נֶפֶשׁ.
- source_word: וְכָל מַרְבִּית בֵּיתְךָ
  choice: Wazao wote wa nyumba yako
  rationale: מַרְבִּית ni ongezeko au kuongezeka; katika muktadha huu ni watu wanaoendeleza ukoo. “Wazao” hutoa maana hiyo kwa Kiswahili cha asili bila kupoteza wazo la nyumba ya kifamilia.
- source_word: יָמֻתוּ אֲנָשִׁים
  choice: watakufa katika utu uzima[a]
  rationale: Kirai cha Kiebrania ni kifupi na halisi yake ni “watakufa wakiwa wanaume.” Katika muktadha wa hukumu, yaelekea kinamaanisha kufa wakiwa watu wazima, kabla ya uzee. Maana hii imewekwa katika matini, huku usemi halisi na uwezekano wake vikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Hukumu juu ya ukoo wa kikuhani wa Eli
  choice: Si kila mwanamume wa ukoo ataondolewa kutoka kando ya madhabahu; baadhi watabaki, na kubaki kwao kutakuwa chanzo cha huzuni ndani ya hukumu.
  alternative: Ukoo wote unaondolewa kabisa katika huduma ya kikuhani.
  rationale: Kukanusha kwa לֹא pamoja na אִישׁ na vishazi vya kusudi kunaonyesha kwamba hukumu si kutoweka mara moja kwa kila mtu, bali kuachwa kwa baadhi ili matokeo ya hukumu yaendelee kuonekana. Tafsiri haiingizi hitimisho la kimadhehebu kuhusu hali yao ya baadaye.
- issue: Maana ya אֲנָשִׁים mwishoni mwa aya
  choice: katika utu uzima
  alternative: wakiwa wanaume; kwa upanga wa wanaume
  rationale: Kiebrania hakina neno linalomaanisha “upanga,” kwa hiyo wazo la kuuawa kwa upanga halijaingizwa. Maana inayowezekana ya kufa katika utu uzima imetumiwa kwa Kiswahili cha asili, lakini usemi halisi na kutokuwa na uhakika kwake vimeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka. “Madhabahu,” “nafsi,” na “nyumba” zimehifadhi sajili ya kibiblia, huku mpangilio wa sentensi ukifanywa wa asili katika Kiswahili.
