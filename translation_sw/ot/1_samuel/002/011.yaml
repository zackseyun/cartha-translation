base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/011.yaml
  text: Then Elkanah went to Ramah[a], to his house; and the boy was ministering to Yahweh before Eli the priest.
translation:
  language: sw
  text: Kisha Elkana akaenda Rama, nyumbani kwake; naye yule mvulana alikuwa akimhudumia Yahwe mbele ya Eli, kuhani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa halisi, “mbele ya uso wa Eli, kuhani.” Msemo huo unaweza kumaanisha Eli akiwa hapo na unaweza pia kudokeza kwamba huduma hiyo ilifanywa chini ya uangalizi wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaenda
  rationale: Kitenzi הלך kinaendeleza simulizi kwa maana ya ‘akaenda’; hakisemi wazi kwamba alirudi, ingawa muktadha unaweza kudokeza hivyo.
- source_word: הָרָמָתָה
  choice: Rama
  rationale: Herufi ya mwelekeo iliyoambatanishwa na jina la mahali inaonyesha kwenda Rama; kwa Kiswahili, ‘akaenda Rama’ huonyesha lengo hilo kwa kawaida.
- source_word: עַל בֵּיתוֹ
  choice: nyumbani kwake
  rationale: Katika msemo huu, עַל בֵּיתוֹ ina maana ya kwenda nyumbani au kwenye nyumba yake, si kupanda juu ya nyumba.
- source_word: וְהַנַּעַר
  choice: naye yule mvulana
  rationale: נַעַר inaweza kumaanisha mtoto, mvulana, au kijana. Katika hatua hii ya simulizi, Samweli bado ni mvulana mdogo; ‘yule mvulana’ pia humrejelea kwa uwazi.
- source_word: הָיָה מְשָׁרֵת
  choice: alikuwa akimhudumia
  rationale: Muundo wa היה pamoja na kitenzi-shirikishi unaonyesha tendo lililoendelea. ‘Alikuwa akimhudumia’ huhifadhi hali hiyo na muktadha wa huduma ya mahali patakatifu.
- source_word: אֶת יְהוָה
  choice: Yahwe
  rationale: Yahwe ndiye anayehudumiwa, na jina la agano יְהוָה limetafsiriwa kwa namna inayowakilisha matamshi yake badala ya kulibadilisha kuwa cheo.
- source_word: אֶת פְּנֵי עֵלִי הַכֹּהֵן
  choice: mbele ya Eli kuhani
  rationale: Msemo huo kwa halisi unahusu uso au uwepo wa Eli. ‘Mbele ya’ huhifadhi maana ya uwepo wake bila kuamua kimya kimya kama kinachosisitizwa ni eneo au usimamizi wake.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu lenye herufi nne moja kwa moja. ‘Yahwe’ huhifadhi jina hilo la agano badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa huduma ya Samweli na Eli
  choice: mbele ya Eli kuhani
  alternative: chini ya usimamizi wa Eli kuhani
  rationale: Kiebrania kinaweza kuonyesha huduma iliyofanywa Eli akiwa hapo na huenda chini ya uangalizi wake. Tafsiri ‘mbele ya’ huhifadhi mvutano huo bila kuifanya dhana ya usimamizi kuwa ya wazi kuliko chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa wakati unaoendelea umehifadhiwa, na ‘mbele ya’ imetumiwa ili kutofuta utata wa kimaana katika Kiebrania.
