id: 1SA.2.25
reference: 1 Samuel 2:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אִם יֶחֱטָ֨א אִ֤ישׁ לְ/אִישׁ֙ וּ/פִֽלְל֣/וֹ אֱלֹהִ֔ים וְ/אִ֤ם לַֽ/יהוָה֙ יֶֽחֱטָא אִ֔ישׁ מִ֖י יִתְפַּלֶּל ל֑/וֹ וְ/לֹ֤א יִשְׁמְעוּ֙ לְ/ק֣וֹל אֲבִי/הֶ֔ם כִּֽי חָפֵ֥ץ יְהוָ֖ה לַ/הֲמִיתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/025.yaml
  text: If a man sins against another man[a], God will mediate for him; but if a man sins against Yahweh, who will pray for him? But they would not listen to the voice of their father[b], because Yahweh desired to put them to death.
translation:
  language: sw
  text: “Mtu akimkosea mtu mwenzake, Mungu atamhukumu;[a] lakini mtu akimkosea Yahwe, ni nani atakayemwombea?”[b] Lakini hawakuisikiliza sauti ya baba yao, kwa sababu Yahwe alitaka kuwaua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waamuzi watamhukumu.” Neno la Kiebrania אֱלֹהִים linaweza kumaanisha Mungu au, katika mazingira fulani, waamuzi wa kibinadamu.
    reason: alternative_reading
  - marker: b
    text: Au, “ni nani atakayeingilia kati kwa ajili yake?” Kitenzi cha Kiebrania kinaweza kumaanisha kuomba au kuingilia kati kwa ajili ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא
  choice: akimkosea
  rationale: Katika miundo yenye לְ, kitenzi חטא kinaonyesha kumkosea mtu au kutenda dhambi dhidi yake. ‘Akimkosea’ ni Kiswahili cha kawaida kinachohifadhi nguvu ya kimaadili na uhusiano wa kosa.
- source_word: אִישׁ לְאִישׁ
  choice: mtu ... mtu mwenzake
  rationale: Hueleza kosa la mtu mmoja dhidi ya mwingine. ‘Mtu mwenzake’ ni ya asili katika Kiswahili na haibadili maana kwa kuifanya iwe kosa la jumuiya.
- source_word: וּפִלְלוֹ אֱלֹהִים
  choice: Mungu atakuwa mwamuzi katika shauri lake
  rationale: Piel ya פלל hapa ina maana ya kuamua au kusuluhisha shauri. Kauli hii huhifadhi Mungu kama mhusika na huepuka kufanya ‘atamhukumu’ imaanishe bila lazima kwamba atamhukumu kuwa na hatia.
- source_word: לַיהוָה
  choice: akimkosea Yahwe
  rationale: לְ humtaja anayekosewa, na jina la agano יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- source_word: מִי יִתְפַּלֶּל לוֹ
  choice: ni nani atakayemwombea?
  rationale: Hitpael ya פלל inaweza kumaanisha kuomba kwa ajili ya mtu au kumwombea. ‘Atakayemwombea’ ni ya asili na hudumisha swali lenye mkazo.
- source_word: וְלֹא יִשְׁמְעוּ לְקוֹל אֲבִיהֶם
  choice: Lakini hawakuisikiliza sauti ya baba yao
  rationale: Huhifadhi nahau ya Kiebrania ‘kusikiliza sauti’ pamoja na wazo la kukataa ushauri au amri ya baba yao.
- source_word: כִּי חָפֵץ יְהוָה
  choice: kwa sababu Yahwe alitaka
  rationale: חפץ hueleza kutaka au kukusudia. ‘Alitaka’ huhifadhi kauli kali ya matini bila kuigeuza kuwa furaha katika kifo chao wala kuipunguza kuwa ruhusa tu.
- source_word: לַהֲמִיתָם
  choice: kuwaua
  rationale: Hiphil ya מות ni ya kisababishi, yaani kuwasababishia kifo. ‘Kuwaua’ ni Kiswahili wazi, cha kawaida, na chenye uzito unaofaa.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika kishazi cha kwanza
  choice: Mungu
  alternative: waamuzi
  rationale: Ulinganifu na kosa dhidi ya Yahwe unaunga mkono kumwona Mungu kuwa mwamuzi katika shauri la wanadamu. Hata hivyo, kwa kuwa אֱלֹהִים inaweza kutaja waamuzi wa kibinadamu katika baadhi ya mazingira, maana hiyo imehifadhiwa katika tanbihi.
- issue: Uhusiano wa פלל na התפלל
  choice: ‘atakuwa mwamuzi’ katika kishazi cha kwanza na ‘atamwombea’ katika cha pili
  alternative: ‘atamhukumu’ na ‘atamwombea kama mwombezi’
  rationale: 'Maneno hayo yana mzizi mmoja lakini miundo yake ina maana zinazotofautiana kulingana na muktadha: uamuzi wa shauri kwanza, kisha maombi kwa ajili ya mkosaji. Tafsiri haikulazimisha neno moja la Kiswahili kwa matumizi yote mawili.'
- issue: Kusudi la Mungu katika כִּי חָפֵץ יְהוָה לַהֲמִיתָם
  choice: Yahwe alitaka kuwaua
  alternative: Yahwe alikuwa ameamua kuwaua
  rationale: Matini inasema wazi kwamba Yahwe alitaka kifo chao. Tafsiri imehifadhi mvutano kati ya kukataa kwao kusikiliza na kusudi la hukumu la Mungu bila kueleza jinsi mambo hayo mawili yanavyohusiana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masharti umetolewa kwa ‘akimkosea,’ na nahau ‘sauti ya baba yao’ imehifadhiwa kwa sababu inaeleweka vizuri. Jina יהוה limetolewa kama ‘Yahwe’ kwa kufuata safu ya marejeo iliyotolewa.
