  to: “Mtu akimkosea mtu mwenzake, Mungu atamhukumu;[a] lakini mtu akimkosea Yahwe, ni nani atakayemwombea?”[b] Lakini hawakuisikiliza sauti ya baba yao, kwa sababu Yahwe alitaka kuwaua.
