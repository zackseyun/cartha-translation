  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu vitenzi vya usababishi katika Kiebrania: Yahwe ndiye anayefanya maskini na tajiri, anayeshusha na kuinua. Ulinganifu wa kishairi wa jozi zinazokinzana umehifadhiwa. Kuongeza “mtu” ni ufafanuzi wa kisarufi unaokubalika katika Kiswahili; haubainishi mtu fulani wala kubadili maana ya jumla ya matendo hayo.'
