  text: יְהוָ֖ה מוֹרִ֣ישׁ וּ/מַעֲשִׁ֑יר מַשְׁפִּ֖יל אַף מְרוֹמֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/007.yaml
  text: Yahweh makes poor and makes rich[b][a]; he brings low and also lifts up.
translation:
  language: sw
  text: Yahwe humfanya mtu kuwa maskini[a] na humfanya kuwa tajiri; humshusha na pia humwinua[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “humfukarisha mtu.” Kitenzi cha Kiebrania kinaweza pia kuwa na maana pana ya kumsababishia mtu hasara au kumnyang’anya milki.
    reason: lexical_alternative
  - marker: b
    text: Au, “humtukuza” au “humpandisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi, si kubadilishwa kuwa cheo kama “BWANA”.
- source_word: מוֹרִישׁ
  choice: humfanya mtu kuwa maskini
  rationale: Katika ulinganifu wa kishairi na “humfanya kuwa tajiri,” maana inayolengwa ni kumsababishia mtu umaskini. Neno “mtu” linaonyesha mlengwa wa jumla bila kumtaja mtu maalumu.
- source_word: וּמַעֲשִׁיר
  choice: na humfanya kuwa tajiri
  rationale: Huhifadhi maana ya kusababisha utajiri na ulinganifu wake wa moja kwa moja na kufanya kuwa maskini.
- source_word: מַשְׁפִּיל
  choice: humshusha
  rationale: Huhifadhi taswira ya kumweka mtu chini na ulinganifu wa wima na “humwinua,” bila kuifanya maana iwe unyenyekevu wa ndani pekee.
- source_word: אַף
  choice: pia
  rationale: Huonyesha nguvu ya kuongezea katika kishazi cha pili kwa Kiswahili cha kawaida.
- source_word: מְרוֹמֵם
  choice: humwinua
  rationale: Huhifadhi maana ya kuinua au kumweka juu na taswira inayokinzana na “humshusha.”
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano; “Yahwe” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Wigo wa utendaji wa Mungu katika vitenzi vya mstari
  choice: 'Kauli za kusababisha zimehifadhiwa moja kwa moja: humfanya maskini/tajiri, humshusha/humwinua'
  alternative: Kutafsiri kama Mungu anaruhusu tu hali hizo
  rationale: Maumbo ya Kiebrania yanaonyesha Mungu kama mtendaji anayesababisha; tafsiri haipunguzi nguvu hiyo ya kauli wala kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kishairi wa jozi mbili zinazokinzana umehifadhiwa, na viwakilishi vya umoja vinamtaja “mtu” kwa maana ya jumla.
