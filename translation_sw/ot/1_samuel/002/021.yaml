base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/021.yaml
  text: For Yahweh visited Hannah[a], and she conceived and bore three sons and two daughters[b]. And the boy Samuel grew before Yahweh.
translation:
  language: sw
  text: Kwa maana Yahweh alimwangalia Hana kwa fadhili[a], naye akapata mimba, akazaa wana watatu na binti wawili. Naye mvulana Samweli akakua mbele za Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alimtembelea Hana” au “alimjali Hana.” Kitenzi cha Kiebrania kinaweza kumaanisha kumwangalia mtu kwa kusudi la kumtendea kwa neema.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “pamoja na Yahweh”; katika muktadha huu huenda ikamaanisha kwamba Samweli alikua katika uwepo wa Yahweh mahali patakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaendeleza maelezo yenye nguvu ya kisababishi kutoka mstari uliotangulia.
- source_word: פָקַד
  choice: alimwangalia ... kwa fadhili
  rationale: Katika muktadha huu kitenzi kinaonyesha Yahweh kumjali Hana na kuingilia hali yake kwa neema; tafsiri hii ni ya kawaida kwa Kiswahili bila kukifanya kitendo hicho kiwe baraka isiyoainishwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Linahifadhi jina binafsi la Mungu lililoandikwa katika Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: וַתַּהַר
  choice: akapata mimba
  rationale: Ni usemi wa kawaida na wa moja kwa moja wa Kiswahili kwa kutungwa kwa mimba.
- source_word: וַתֵּלֶד
  choice: akazaa
  rationale: Linawasilisha kwa ufupi tendo la kuzaa katika mtiririko wa simulizi.
- source_word: שְׁלֹשָׁה בָנִים וּשְׁתֵּי בָנוֹת
  choice: wana watatu na binti wawili
  rationale: Tafsiri ya moja kwa moja ya idadi na mahusiano ya kifamilia; “wana” hapa humaanisha watoto wa kiume kwa kulinganishwa na “binti.”
- source_word: וַיִּגְדַּל
  choice: akakua
  rationale: Katika muktadha huu linaeleza kukua na kukomaa kwa Samweli.
- source_word: הַנַּעַר שְׁמוּאֵל
  choice: kijana Samweli
  rationale: Linahifadhi muundo wa Kiebrania na kumtambulisha Samweli kama mvulana au kijana.
- source_word: עִם יְהוָה
  choice: pamoja na Yahweh
  rationale: Ni tafsiri ya karibu ya kirai cha Kiebrania na inahifadhi upana wake wa maana badala ya kukifasiri moja kwa moja kuwa mahali patakatifu.
theological_decisions:
- issue: Kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano; “Yahweh” hulihifadhi kama jina badala ya cheo.
- issue: Maana ya עִם יְהוָה katika kukua kwa Samweli
  choice: pamoja na Yahweh
  alternative: mbele za Yahweh; katika uwepo wa Yahweh
  rationale: Kiebrania kinasema kihalisi “pamoja na Yahweh.” Muktadha unaweza kuelekeza kwenye kukua kwake katika uwepo wa Yahweh mahali patakatifu, lakini tafsiri kuu inahifadhi utata na mvutano wa kirai asilia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetunzwa kwa vitenzi vinavyofuatana; “Hana” limerudiwa baada ya nukta mkato ili kuondoa utata wa kiima. Alama zote za tanbihi zimewekwa kwenye sehemu husika ya maandishi.
