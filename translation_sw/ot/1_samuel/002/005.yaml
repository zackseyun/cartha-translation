base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/005.yaml
  text: Those who were full have hired themselves out for bread[a], but those who were hungry have ceased. Even the barren woman has borne seven[c][b], but she who had many sons has withered away.
translation:
  language: sw
  text: Walioshiba wameajiriwa kwa ajili ya mkate, lakini wenye njaa wameacha kuwa na njaa.[a] Hata mwanamke tasa amezaa saba,[b] lakini aliyekuwa na wana wa kiume wengi amedhoofika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kwa ufupi, “wamekoma,” bila kutaja walichokoma kufanya; maana inaweza kuwa kwamba hawana njaa tena au hawapungukiwi tena.
    reason: lexical_alternative
  - marker: b
    text: “Saba” inaweza kuwa idadi halisi, na katika ushairi inaweza pia kudokeza ukamilifu au utimilifu.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂבֵעִים
  choice: walioshiba
  rationale: Kivumishi hiki kinatumika kama nomino kwa watu waliokuwa na chakula tele; “walioshiba” ni ya kawaida na inadumisha wazo la hali kugeuzwa.
- source_word: בַּלֶּחֶם
  choice: ili wapate mkate
  rationale: לֶחֶם ni “mkate” na pia inaweza kumaanisha chakula kwa ujumla. Hapa “mkate” inadumisha taswira halisi ya kufanya kazi ili kupata riziki.
- source_word: נִשְׂכָּרוּ
  choice: wamejiajirisha
  rationale: Nifali ya שׂכר hapa inaonyesha kuingia katika kazi ya ujira; “wamejiajirisha” inaeleza kwamba waliokuwa na vingi sasa wanategemea kuajiriwa.
- source_word: וּרְעֵבִים חָדֵלּוּ
  choice: lakini wenye njaa wameacha kuwa na njaa
  rationale: חָדֵלּוּ kimsingi ni “wameacha/wamekoma,” bila kutaja kitu kilichoachwa. Muktadha wa “wenye njaa” unawezesha kukamilisha maana kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi udhahiri wa muundo wa Kiebrania.
- source_word: עַד
  choice: hata
  rationale: Katika ushairi huu עַד inaonyesha kiwango ambacho mabadiliko yamefikia, yaani “hata,” badala ya maana ya wakati ya “mpaka.”
- source_word: עֲקָרָה
  choice: mwanamke tasa
  rationale: Kivumishi cha kike kimetumiwa kama nomino; “mwanamke tasa” ni Kiswahili wazi na chenye heshima.
- source_word: יָלְדָה שִׁבְעָה
  choice: amezaa saba
  rationale: Tafsiri hii fupi inadumisha mtindo wa kishairi na kuacha wazi iwapo saba ni idadi halisi au pia ishara ya utimilifu.
- source_word: וְרַבַּת בָּנִים
  choice: aliyekuwa na wana wengi
  rationale: בָּנִים ni wingi wa “mwana.” Neno “wana” linadumisha uchaguzi wa neno la chanzo na usambamba wa kishairi.
- source_word: אֻמְלָלָה
  choice: amedhoofika
  rationale: Kitenzi kinaonyesha kudhoofika, kunyong'onyea, au kuishiwa nguvu; “amedhoofika” ni wazi bila kuongeza taswira isiyolazimishwa na Kiebrania.
theological_decisions:
- issue: Iwapo “saba” itafsiriwe kama idadi halisi au kama ishara ya ukamilifu
  choice: Kudumisha “saba” katika matini bila kuamua maana moja
  alternative: Kuifafanua kuwa ishara ya uzazi kamili au mwingi
  rationale: Kiebrania kinataja idadi moja kwa moja, na ushairi unaweza kuruhusu maana halisi pamoja na mwangwi wa utimilifu.
- issue: Iwapo בָּנִים ijumlishwe kuwa “watoto”
  choice: Kutumia “wana”
  alternative: watoto
  rationale: Neno la chanzo ni la kiume kwa umbo na maana yake ya msingi; “wana” hudumisha hilo bila kufanya mstari kuwa mzito.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi wa hali kugeuzwa umehifadhiwa kwa kulinganisha walioshiba na wenye njaa, kisha mwanamke tasa na aliyekuwa na wana wengi.
