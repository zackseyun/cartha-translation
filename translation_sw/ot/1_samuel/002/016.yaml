  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו הָ/אִ֗ישׁ קַטֵּ֨ר יַקְטִיר֤וּ/ן כַּ/יּוֹם֙ הַ/חֵ֔לֶב וְ/קַ֨ח לְ/ךָ֔ כַּ/אֲשֶׁ֥ר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וְ/אָמַ֥ר ל/ו כִּ֚י עַתָּ֣ה תִתֵּ֔ן וְ/אִם לֹ֖א לָקַ֥חְתִּי בְ/חָזְקָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/016.yaml
  text: And the man would say to him[a], “Let them first burn the fat today, and then take for yourself whatever your soul desires.” But he would say to him, “No, you must give it now; and if not, I will take it by force.”
translation:
  language: sw
  text: Ndipo yule mtu angemwambia[a], “Waache kwanza wayachome mafuta leo, kisha ujichukulie chochote unachotamani.” Lakini huyo mtumishi angemwambia, “Hapana, lazima unipe sasa; na kama hutatoa, nitakichukua kwa nguvu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “Hakika wayachome mafuta leo, kisha ujichukulie kadiri unavyotamani.” Kiebrania kimetumia muundo wa kitenzi wenye msisitizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: yule mtu
  rationale: Nomino hii ya umoja yenye uainishaji humrejelea mtoa dhabihu aliyetajwa katika tukio; ‘yule mtu’ ni ya kawaida na huhifadhi umoja.
- source_word: קַטֵּר יַקְטִירוּן
  choice: Waache kwanza waichome
  rationale: Muundo wa kitenzi una msisitizo. ‘Waache ... waichome’ huonyesha ombi lenye nguvu, na ‘kwanza’ huweka wazi mpangilio unaodokezwa na muktadha.
- source_word: כַּיּוֹם
  choice: leo
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya usemi huu wa wakati katika muktadha.
- source_word: הַחֵלֶב
  choice: mafuta
  rationale: Yanarejelea sehemu za mafuta ya dhabihu zilizopaswa kuchomwa; ‘mafuta’ ni neno la kawaida na sahihi katika muktadha huu.
- source_word: וְקַח לְךָ
  choice: kisha ujichukulie
  rationale: Amri inaelekezwa kwa mtumishi baada ya mafuta kuchomwa. ‘Kisha’ hudhihirisha mpangilio unaodokezwa, na ‘ujichukulie’ huhifadhi maana ya kujitwalia.
- source_word: כַּאֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: chochote unachotamani
  rationale: Kiswahili cha kawaida hueleza nahau ya Kiebrania ‘kama nafsi yako inavyotamani’ kwa ‘chochote unachotamani’ bila kupoteza maana yake.
- source_word: וְאָמַר לוֹ
  choice: Lakini huyo mtumishi angemwambia
  rationale: Muktadha unaonyesha jibu lililorudiwa kwa kawaida. ‘Angemwambia’ huonyesha hali hiyo, huku ‘Lakini’ ikionyesha upinzani; ‘huyo mtumishi’ huondoa utata wa viwakilishi unaoweza kumkanganya msomaji.
- source_word: כִּי עַתָּה תִתֵּן
  choice: Hapana, lazima unipe sasa
  rationale: Ingawa ‘hapana’ halijaandikwa wazi, linawasilisha kwa asili ukinzani mkali wa kauli. ‘Lazima unipe sasa’ huhifadhi shinikizo la dai hilo.
- source_word: וְאִם לֹא
  choice: usipofanya hivyo
  rationale: Hutoa sharti kwa Kiswahili cha kawaida na hurejelea wazi kukataa kutoa nyama mara moja.
- source_word: לָקַחְתִּי
  choice: nitakichukua
  rationale: Ingawa umbo la Kiebrania ni timilifu, katika tishio hili lina nguvu ya wakati ujao; kiambishi ‘-ki-’ kinarejelea kile kinachodaiwa.
- source_word: בְחָזְקָה
  choice: kwa nguvu
  rationale: Hueleza kutwaa kwa kutumia nguvu au kulazimisha kwa njia fupi na ya kawaida.
theological_decisions:
- issue: Mpangilio wa ibada ya dhabihu unaodokezwa na pingamizi la mtoa dhabihu
  choice: Kuweka wazi kwamba mafuta yachomwe kwanza, ndipo mtumishi achukue anachotaka.
  alternative: Kutafsiri kwa kufuata muundo wa Kiebrania bila neno ‘kwanza’.
  rationale: Aya inatofautisha utaratibu unaofaa wa dhabihu na unyanyasaji wa watumishi. Kuweka mpangilio wazi husaidia kuelewa bila kuongeza maelezo ya kiteolojia yasiyomo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mazungumzo yamewekwa kwa lugha inayoeleweka kwa urahisi, huku hali ya kitendo kilichorudiwa na ukali wa tishio vikihifadhiwa.
