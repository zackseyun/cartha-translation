  text: גַּם֮ בְּ/טֶרֶם֮ יַקְטִר֣וּ/ן אֶת הַ/חֵלֶב֒ וּ/בָ֣א נַ֣עַר הַ/כֹּהֵ֗ן וְ/אָמַר֙ לָ/אִ֣ישׁ הַ/זֹּבֵ֔חַ תְּנָ֣/ה בָשָׂ֔ר לִ/צְל֖וֹת לַ/כֹּהֵ֑ן וְ/לֹֽא יִקַּ֧ח מִמְּ/ךָ֛ בָּשָׂ֥ר מְבֻשָּׁ֖ל כִּ֥י אִם חָֽי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/015.yaml
  text: Even before they burned the fat[a], the priest’s servant would come and say to the man who was sacrificing, “Give meat for the priest to roast, for he will not take boiled meat from you, but only raw.”
translation:
  language: sw
  text: Hata kabla hawajayateketeza mafuta, mtumishi wa kuhani[a] angekuja na kumwambia mtu aliyekuwa akitoa dhabihu, “Mpe kuhani nyama ya kuoka, kwa maana hatachukua kwako nyama iliyochemshwa, bali mbichi tu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kijana wa kuhani” au “mhudumu wa kuhani.” Neno la Kiebrania נַעַר linaweza kumaanisha kijana au mtumishi; hapa yaelekea ni mtu wa chini aliyekuwa akitenda kwa niaba ya kuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בְּטֶרֶם
  choice: Hata kabla
  rationale: ‘Hata’ linaonyesha msisitizo wa גַּם, na ‘kabla’ linaonyesha kwamba kitendo hicho kilitangulia hatua iliyotakiwa ya ibada.
- source_word: יַקְטִרוּן אֶת־הַחֵלֶב
  choice: hawajayateketeza mafuta
  rationale: Kitenzi kinahusu kuyachoma mafungu ya mafuta ya dhabihu kama tendo la ibada. ‘Kuyateketeza’ ni usemi wa kawaida na wenye hadhi katika muktadha huu.
- source_word: נַעַר הַכֹּהֵן
  choice: mtumishi wa kuhani
  rationale: נַעַר linaweza kumaanisha kijana au mtumishi. Hapa mhusika anatenda kwa niaba ya kuhani, hivyo ‘mtumishi’ linaeleza kazi yake bila kuficha uwezekano mwingine, ambao umetajwa katika tanbihi.
- source_word: לָאִישׁ הַזֹּבֵחַ
  choice: mtu aliyekuwa akitoa dhabihu
  rationale: Uundaji wa kishiriki unamtambulisha mtu aliyekuwa katika tendo la kutoa dhabihu; tafsiri hii ni wazi na ya kawaida kwa Kiswahili.
- source_word: תְּנָה בָשָׂר לִצְלוֹת לַכֹּהֵן
  choice: Mpe kuhani nyama ya kuoka
  rationale: Inahifadhi amri ya moja kwa moja na kusudi la nyama hiyo, yaani kuokwa kwa ajili ya kuhani.
- source_word: וְלֹא יִקַּח מִמְּךָ
  choice: kwa maana hatachukua kwako
  rationale: Inahifadhi dai la kukataa kuchukua nyama hiyo kutoka kwa mtoa dhabihu na kuunganisha sababu kwa Kiswahili cha asili.
- source_word: בָשָׂר מְבֻשָּׁל
  choice: nyama iliyochemshwa
  rationale: מְבֻשָּׁל linamaanisha hasa iliyopikwa kwa kuchemshwa, tofauti na nyama mbichi iliyokusudiwa kuokwa.
- source_word: כִּי אִם חָי
  choice: bali mbichi tu
  rationale: 'Inawasilisha utofautishaji wa kipekee: si iliyochemshwa, bali nyama mbichi pekee.'
