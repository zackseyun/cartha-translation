base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/020.yaml
  text: And Eli would bless Elkanah and his wife and say[b][a], “May Yahweh give you offspring by this woman in place of the petition that was asked for Yahweh.” Then they would go to his place.
translation:
  language: sw
  text: Naye Eli alikuwa akiwabariki Elkana na mke wake, akisema, “Yahweh na akupe uzao kwa mwanamke huyu badala ya ombi lililoombwa kwa Yahweh.”[a][b] Kisha walikuwa wakiondoka kwenda mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaweza kueleweka kihalisi kuwa “badala ya ombi/kitu kilichoombwa kwa Yahweh.” Maneno haya yanarudia mzizi wenye maana ya “kuomba,” unaotumiwa mara nyingi katika simulizi la kuzaliwa kwa Samweli, na huenda yakamdokeza Samweli mwenyewe—mtoto aliyeombwa kisha akatolewa kwa Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kinachotafsiriwa “lililoombwa” ni cha umoja wa kiume, lakini muktadha unamwelekeza msomaji kwa Hana kuwa ndiye aliyemwomba Yahweh mtoto (1 Samweli 1:20, 27–28).
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֵרַךְ
  choice: alikuwa akiwabariki
  rationale: Muundo huu unaonyesha tendo lililorudiwa katika ziara zao za kila mwaka, badala ya baraka iliyotolewa mara moja tu.
- source_word: אֶת אֶלְקָנָה וְאֶת אִשְׁתּוֹ
  choice: Elkana na mke wake
  rationale: Kiebrania kinasema wazi ‘mke wake’ bila kulitaja jina la Hana.
- source_word: יָשֵׂם יְהוָה לְךָ
  choice: Yahweh na akupe
  rationale: Ingawa שׂים kimsingi ni ‘kuweka,’ katika baraka hii maana ya kawaida ni kumjalia au kumpa mtu uzao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa namna ya kulitamka, badala ya kubadilishwa kuwa cheo.
- source_word: זֶרַע
  choice: uzao
  rationale: ‘Uzao’ huhifadhi maana ya pamoja ya זֶרַע na inafaa katika muktadha wa baraka ya kupata watoto.
- source_word: מִן הָאִשָּׁה הַזֹּאת
  choice: kwa mwanamke huyu
  rationale: Kifungu hiki kinamtaja Hana kuwa mwanamke ambaye uzao huo utapatikana kupitia kwake.
- source_word: תַּחַת
  choice: badala ya
  rationale: Neno hili linaonyesha mbadala au fidia kwa kile kilichotolewa kwa Yahweh.
- source_word: הַשְּׁאֵלָה
  choice: kile kilichoombwa
  rationale: Ufasiri huu unabaki karibu na nomino yenye maana ya ombi au kitu kilichoombwa na kuhifadhi mwangwi wa mzizi שׁאל katika simulizi.
- source_word: אֲשֶׁר שָׁאַל לַיהוָה
  choice: kilichoombwa kwa ajili ya Yahweh
  rationale: Uundaji usiotaja mtendaji huhifadhi hali isiyo ya kawaida ya kitenzi cha Kiebrania cha umoja wa kiume, huku muktadha ukielekeza kwa Hana na kwa mtoto aliyetolewa kwa Yahweh.
- source_word: וְהָלְכוּ לִמְקֹמוֹ
  choice: Kisha walikuwa wakirudi nyumbani kwake
  rationale: Kitenzi cha wingi kinawahusu Elkana na mke wake; usemi wa Kiswahili ‘nyumbani kwake’ huwasilisha kwa kawaida ‘mahali pake,’ na hali ya mazoea imehifadhiwa.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Huhifadhi jina binafsi lililo katika matini ya Kiebrania bila kuliweka badala yake cheo.
- issue: Mtendaji wa שָׁאַל katika kishazi rejeshi
  choice: 'muundo usiotaja mtendaji: ‘kilichoombwa kwa ajili ya Yahweh’'
  alternative: ‘ambacho Hana alimwomba Yahweh’ au ‘ambacho aliombwa Yahweh’
  rationale: Kitenzi ni cha umoja wa kiume, ingawa muktadha humwelekeza msomaji kwa Hana. Muundo huu hauondoi mvutano huo kimya kimya na pia huruhusu dokezo la Samweli aliyeombwa kisha akatolewa kwa Yahweh.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida kueleweka. ‘Alikuwa akiwabariki’ na ‘walikuwa wakirudi’ zinaonyesha tendo la mazoea; ‘uzao’ ni neno la kawaida la kibiblia bila kuwa la kale kupita kiasi.
