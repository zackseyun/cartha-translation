base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/028.yaml
  text: And did I not choose him from all the tribes of Israel to be my priest[a], to go up to my altar, to burn incense, to wear an ephod before me? And I gave to your father's house all the food offerings of the sons of Israel.
translation:
  language: sw
  text: Je, sikumchagua kutoka miongoni mwa makabila yote ya Israeli ili awe kuhani wangu, apande kwenye madhabahu yangu, afukize uvumba, na avae efodi mbele yangu? Nami niliwapa watu wa nyumba ya baba yako matoleo yote ya Waisraeli yanayotolewa kwa moto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matoleo yote ya chakula ya Waisraeli.”
    reason: Hutoa tafsiri mbadala inayotumiwa kueleza matoleo ya madhabahuni kama chakula kinachotolewa kwa Mungu, huku matini kuu ikihifadhi wazi wazo la kutolewa kwa moto.
lexical_decisions:
- source_word: וּבָחֹר אֹתוֹ
  choice: Je, sikumchagua
  rationale: Muundo huu unaendeleza swali la balagha lililoanza katika muktadha uliotangulia. Kiswahili cha swali hasi kinawasilisha msisitizo huo kwa kawaida.
- source_word: מִכָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: kutoka miongoni mwa makabila yote ya Israeli
  rationale: Neno “miongoni mwa” linaweka wazi maana ya kuchagua mmoja kutoka katika jumla ya makabila yote.
- source_word: לִי לְכֹהֵן
  choice: ili awe kuhani wangu
  rationale: Huhifadhi kusudi la kuchaguliwa kwake na uhusiano wake wa kikuhani na Mungu kwa Kiswahili rahisi na cha heshima.
- source_word: לַעֲלוֹת עַל מִזְבְּחִי
  choice: apande kwenda kwenye madhabahu yangu
  rationale: Huhifadhi wazo halisi la kupanda au kwenda juu kuelekea madhabahuni bila kulifasiri moja kwa moja kuwa tendo la kutoa sadaka.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: afukize uvumba
  rationale: “Kufukiza uvumba” ni usemi wa kawaida wa Kiswahili kwa tendo hili la ibada.
- source_word: לָשֵׂאת אֵפוֹד לְפָנַי
  choice: avae efodi mbele yangu
  rationale: Katika kazi ya kikuhani, נשא hapa inaeleweka kwa kawaida kuwa kuvaa au kubeba efodi mwilini. “Avae” ni wazi na asilia zaidi kwa msomaji wa Kiswahili.
- source_word: לְבֵית אָבִיךָ
  choice: jamaa ya baba yako
  rationale: Usemi huu unarejelea ukoo au familia pana ya kikuhani ya Eli; “jamaa ya baba yako” ni ya kueleweka na haimaanishi jengo.
- source_word: אֶת כָּל אִשֵּׁי בְּנֵי יִשְׂרָאֵל
  choice: matoleo yote ya Waisraeli yanayotolewa kwa moto
  rationale: אִשֵּׁי ni istilahi pana ya matoleo yanayowasilishwa kwa moto. Tafsiri hii haipunguzi maana yake kuwa sadaka za kuteketezwa kabisa pekee.
theological_decisions:
- issue: Maana ya אִשֵּׁי katika mfumo wa dhabihu
  choice: matoleo ... yanayotolewa kwa moto
  alternative: matoleo ya chakula
  rationale: Chaguo kuu huhifadhi uhusiano wa matoleo hayo na moto na huepuka kudokeza kwamba kila toleo liliteketezwa lote. Chaguo la “chakula” linaonyesha lugha ya chakula cha madhabahuni lakini si maana ya moja kwa moja ya istilahi katika kila matumizi.
- issue: Kazi inayohusiana na efodi
  choice: avae efodi mbele yangu
  alternative: abebe efodi mbele yangu
  rationale: Kitenzi cha Kiebrania kinaweza kumaanisha kubeba, lakini katika mazingira ya vazi la kikuhani kuvaa ndilo tendo linalokusudiwa kwa kawaida. Tafsiri hiyo haiingizi dai la dhehebu.
- issue: Muundo wa swali la balagha
  choice: Je, sikumchagua
  alternative: Nami nilimchagua
  rationale: Muktadha wa sentensi inayotangulia unaunga mkono swali la balagha. Chaguo hili huhifadhi nguvu ya karipio bila kubadili dai la msingi kwamba Mungu alimchagua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Efodi” imehifadhiwa kama istilahi ya vazi maalumu la kikuhani. “Waisraeli” limetumiwa badala ya tafsiri ya neno kwa neno “wana wa Israeli” kwa kuwa hapa ni jina la taifa na ndilo tamko la kawaida zaidi katika Kiswahili.
