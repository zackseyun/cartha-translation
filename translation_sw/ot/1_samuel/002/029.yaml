base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/029.yaml
  text: Why do you scorn my sacrifice and my offering[a], which I commanded for the dwelling, and honor your sons above me, fattening yourselves from the first of every offering of Israel[c][b], my people?
translation:
  language: sw
  text: Kwa nini mnazidharau[a] dhabihu yangu na sadaka yangu, nilizoamuru kwa ajili ya makao[b]? Nawe unawaheshimu wanao kuliko mimi, huku mkijinenepesha kwa sehemu bora ya kila sadaka ya Israeli, watu wangu?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mnazipiga teke” au “mnazitendea kwa dharau.” Kitenzi cha Kiebrania kinatoa picha halisi ya kupiga teke kwa dharau kile ambacho Mungu aliamuru.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kwa ufupi: “nilizoamuru makao.” Huenda maana yake ni “nilizoamuru katika makao” au “nilizoamuru kwa ajili ya mahali pa makao,” yaani mahali patakatifu.'
    reason: alternative_reading
  - marker: c
    text: Au “mkijinenepesha kwa sehemu ya kwanza ya kila sadaka ya Israeli, watu wangu.” Neno la Kiebrania linaweza kumaanisha sehemu ya kwanza au sehemu iliyo bora zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִבְעֲטוּ
  choice: mnazidharau
  rationale: Kitenzi hiki kwa picha halisi hudokeza kupiga teke, lakini hapa ni nahau ya kukataa kwa dharau. “Mnazidharau” ni Kiswahili cha kawaida kinachohifadhi uzito wa karipio; wingi wa kitenzi umehifadhiwa.
- source_word: זִבְחִי
  choice: dhabihu yangu
  rationale: זֶבַח ni dhabihu inayohusisha uchinjaji. “Dhabihu yangu” ni sahihi, ya kawaida, na yenye staha katika muktadha wa ibada.
- source_word: מִנְחָתִי
  choice: sadaka yangu
  rationale: מִנְחָה inaweza kumaanisha sadaka ya nafaka au sadaka kwa maana pana. Ikiwa sambamba na זֶבַח hapa, “sadaka” huepuka kuibana bila ushahidi wa kutosha.
- source_word: אֲשֶׁר צִוִּיתִי מָעוֹן
  choice: nilizoamuru kwa ajili ya makao
  rationale: Kirai cha Kiebrania kimebanwa na uhusiano wa מָעוֹן na kitenzi hauelezwi wazi. “Kwa ajili ya makao” kinafuata uwezekano wa kurejelea mahali patakatifu bila kuongeza kimilikishi kisichotajwa wazi; utata umeonyeshwa katika tanbihi.
- source_word: וַתְּכַבֵּד אֶת־בָּנֶיךָ מִמֶּנִּי
  choice: nawe unawaheshimu wanao kuliko mimi
  rationale: כבד hapa ni “heshimu,” na מִמֶּנִּי inaonyesha ulinganisho. “Kuliko mimi” huwasilisha wazi kwamba Eli aliwapa wanawe heshima kubwa kuliko Mungu.
- source_word: לְהַבְרִיאֲכֶם
  choice: mkijinenepesha
  rationale: Umbo hili linaonyesha kujifanya wanene au kulishwa vizuri kutokana na sadaka. “Mkijinenepesha” huhifadhi picha halisi na shtaka kali, pamoja na wingi wa Kiebrania.
- source_word: מֵרֵאשִׁית
  choice: kwa sehemu bora
  rationale: רֵאשִׁית kimsingi ni mwanzo au sehemu ya kwanza, na katika muktadha wa sadaka inaweza kumaanisha sehemu ya kwanza na bora. “Sehemu bora” ni ya asili katika Kiswahili, huku maana ya karibu zaidi na umbo la neno ikihifadhiwa katika tanbihi.
- source_word: כָּל מִנְחַת יִשְׂרָאֵל לְעַמִּי
  choice: kila sadaka ya Israeli, watu wangu
  rationale: מִנְחָה limetafsiriwa kwa maana pana ya “sadaka.” “Israeli, watu wangu” huchukulia לְעַמִּי kama maelezo ya utambulisho, kwa mtiririko wa asili wa Kiswahili.
theological_decisions:
- issue: Kubadilika kutoka wingi katika karipio la mwanzo kwenda umoja unaomlenga Eli, kisha kurudi wingi
  choice: “mnazidharau … nawe unawaheshimu … mkijinenepesha”
  alternative: Kumtaja Eli peke yake katika mstari wote, au kuielekeza sentensi yote kwa Eli na nyumba yake bila kuonyesha mabadiliko ya idadi
  rationale: Kiebrania huanza na kitenzi cha wingi, kisha humlenga Eli kwa umoja, na katika “mkijinenepesha” hurudi kwenye wingi. Tafsiri imehifadhi mabadiliko hayo bila kuamua kimya kimya mipaka kamili ya wahusika wanaokaripiwa.
- issue: Maana ya מָעוֹן katika agizo kuhusu sadaka
  choice: “kwa ajili ya makao” pamoja na tanbihi
  alternative: “katika makao” au “mahali pa makao”
  rationale: Huenda neno hili linarejelea patakatifu kama makao ya Mungu, lakini uhusiano wa kisarufi umebanwa na wenye utata. Tafsiri kuu haitaji “makao yangu,” kwa kuwa kimilikishi hakipo wazi katika maandishi ya Kiebrania.
- issue: Sehemu walizotumia kujinenepesha
  choice: “sehemu bora”
  alternative: “sehemu za kwanza”
  rationale: רֵאשִׁית linaweza kusisitiza nafasi ya kwanza au ubora wa sehemu hizo. Muktadha wa kutumia vibaya sadaka unaunga mkono “sehemu bora,” lakini tanbihi inadumisha maana nyingine halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Dhabihu” na “sadaka” ni istilahi za ibada zinazoeleweka kwa wasomaji wa kawaida. Mabadiliko ya nafsi na idadi yamehifadhiwa kwa “mnazidharau,” “nawe,” na “mkijinenepesha,” bila kufanya sentensi iwe ngumu isivyo lazima.
