  text: קֶ֥שֶׁת גִּבֹּרִ֖ים חַתִּ֑ים וְ/נִכְשָׁלִ֖ים אָ֥זְרוּ חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/004.yaml
  text: The bows of the mighty are shattered[b][a], but those who stumble are girded with strength.
translation:
  language: sw
  text: 'Pinde za mashujaa zimevunjwa,

    lakini wanaojikwaa wamejivika nguvu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wamejifunga nguvu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁת
  choice: Pinde
  rationale: Nomino iko katika umoja kwa umbo lakini ina maana ya kijumla pamoja na 'mashujaa' na kiarifu cha wingi; hivyo wingi wa Kiswahili unaonyesha maana kwa kawaida.
- source_word: גִּבֹּרִים
  choice: mashujaa
  rationale: Neno linamaanisha watu wenye nguvu au ushujaa, mara nyingi wapiganaji; 'mashujaa' huhifadhi uzito wa kishairi bila kulazimisha maelezo marefu.
- source_word: חַתִּים
  choice: zimevunjwa
  rationale: Katika muktadha wa pinde, maana inayofaa ni kuvunjwa badala ya kufadhaishwa. 'Zimevunjwa' ni ya kawaida na ina nguvu ya kishairi.
- source_word: נִכְשָׁלִים
  choice: wanaojikwaa
  rationale: Huhifadhi taswira halisi ya watu wanaojikwaa au kuyumba badala ya kuifafanua moja kwa moja kuwa 'wadhaifu.'
- source_word: אָזְרוּ
  choice: wamejifunga
  rationale: Kitenzi ni cha kauli tendaji na kinaweza kuwa na maana ya kujifunga au kujivika. Kiswahili 'wamejifunga' huhifadhi taswira ya kujifunga mkanda bila kukifanya kuwa kauli tendwa.
- source_word: חָיִל
  choice: nguvu
  rationale: Katika muktadha huu neno linaonyesha nguvu au uwezo; 'nguvu' hufaa kwa ugeuzi mpana wa nguvu na udhaifu bila kuufanya kuwa wa kijeshi pekee.
theological_decisions:
- issue: Taswira ya kishairi ya kugeuzwa kwa hali katika wimbo wa Hana
  choice: Kuhifadhi taswira halisi za pinde, kujikwaa, na kujifunga nguvu.
  alternative: Silaha za mashujaa zimevunjwa, lakini wadhaifu wamekuwa na nguvu.
  rationale: Taswira hizo huonyesha kwa nguvu kugeuzwa kwa hali ya wenye nguvu na wanyonge bila kuongeza ufafanuzi wa kimadhehebu au kufifisha ushairi.
- issue: Kauli ya kitenzi אָזְרוּ
  choice: wamejifunga nguvu
  alternative: wamefungwa nguvu / wamevikwa nguvu
  rationale: Umbo la Kiebrania ni tendaji, si tendwa. Tafsiri hii huepuka kuingiza mtendaji ambaye hakutajwa, huku ikihifadhi uwezekano wa maana ya kujifunga nguvu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye staha na mdundo wa kishairi. Mistari miwili inahifadhi ulinganifu wa Kiebrania. Alama ya tanbihi [a] iko katika matini kuu na inaeleza mbadala wa taswira ya אָזְרוּ.
