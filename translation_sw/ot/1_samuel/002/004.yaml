review_pass:
  verdict: revise
  source_fidelity: Pinde za mashujaa zimevunjwa accurately conveys the collective sense of קֶשֶׁת, the warrior sense of גִּבֹּרִים, and the broken/shattered sense of חַתִּים. Wanaojikwaa appropriately retains the participial metaphor of נִכְשָׁלִים. The final verb phrase should more idiomatically express אָזְרוּ חָיִל, ‘have girded themselves with strength.’
  naturalness: “Wamejifunga nguvu” is not a natural or clear Standard East African Swahili idiom; it can suggest binding strength rather than putting strength on oneself. “Wamejivika nguvu” is a clear, poetic, and current equivalent that preserves the bodily metaphor.
  terminology: Mashujaa, pinde, wanaojikwaa, and nguvu are suitable poetic-register terms. “Kujivika nguvu” preserves the figurative martial/bodily imagery without specifying an unstated agent or flattening it to merely ‘became strong.’
  issues:
  - severity: medium
    issue: The phrase “wamejifunga nguvu” is idiomatically unclear in Swahili.
    rationale: Although it aims to preserve the active/reflexive nuance of אָזְרוּ, normal Swahili does not readily use kujifunga + nguvu to mean girding oneself with strength. “Wamejivika nguvu” communicates the intended metaphor naturally and faithfully.
