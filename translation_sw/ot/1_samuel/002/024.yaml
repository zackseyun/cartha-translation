base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/024.yaml
  text: No[a], my sons; for the report that I hear is not good. You are making Yahweh’s people transgress.
translation:
  language: sw
  text: La,[a] wanangu; maana habari ninayoisikia si njema. Mnawafanya watu wa Yahweh watende dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uelewa mwingine wa Kiebrania, “habari ninayosikia ambayo watu wa Yahweh wanaieneza.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַל
  choice: La
  rationale: Hapa ni tamko la kukataa na kukemea kwa nguvu, si amri hasi ya kawaida. “La” ni la asili, fupi, na lenye heshima katika Kiswahili.
- source_word: בָּנַי
  choice: wanangu
  rationale: Neno hili linawahusu wana wa kiume wa Eli. “Wanangu” ndilo neno la kawaida na la asili katika Kiswahili; muktadha unaonyesha wazi kuwa wanaozungumziwa ni wanawe wa kiume.
- source_word: כִּי
  choice: maana
  rationale: Linaanzisha sababu ya kukemea kwa Eli. “Maana” linaonyesha uhusiano huo wa maelezo kwa uwazi.
- source_word: לֹא טוֹבָה
  choice: si njema
  rationale: Huhifadhi usemi wa Kiebrania wa kukataa sifa ya wema bila kuufafanua zaidi kuwa “mbaya.” “Njema” inapatana kisarufi na “habari.”
- source_word: הַשְּׁמֻעָה
  choice: habari
  rationale: Inarejelea taarifa inayosikika kuhusu mwenendo wa wana wa Eli. “Habari” ni ya kawaida na haidokezi kutokuwa na uhakika kama “uvumi.”
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: ninayosikia
  rationale: Ni tafsiri ya asili ya kishazi husishi na inadokeza jambo linalomfikia Eli bila kulazimisha zaidi hali ya kuendelea.
- source_word: מַעֲבִרִים
  choice: mnawakosesha
  rationale: 'Huhifadhi nguvu ya kisababishi ya umbo la Hiphil: matendo ya wana wa Eli yanawafanya watu wakose. Kwa kuwa muundo wa Kiebrania una utata, uelewa mwingine umehifadhiwa katika tanbihi.'
- source_word: עַם יְהוָה
  choice: watu wa Yahweh
  rationale: Ni uundaji wa kawaida wa Kiswahili kwa kirai cha umilikaji na huhifadhi maana ya watu walio wa Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kama jina binafsi “Yahweh,” badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Uwasilishaji wa יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Huhifadhi jina binafsi la Mungu lililo katika matini ya Kiebrania bila kulibadilisha kuwa cheo.
- issue: Maana ya מַעֲבִרִים עַם יְהוָה
  choice: Mnawakosesha watu wa Yahweh
  alternative: habari ninayosikia watu wa Yahweh wakiieneza
  rationale: Uelewa mkuu unasoma kitenzi kama kisababishi kinachowahusisha wana wa Eli na kuwafanya watu wakose. Kwa sababu muundo na maana ya kirai hiki ni tata, uelewa kwamba watu wa Yahweh wanaieneza habari umetajwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. “La” linaendeleza ukali wa kukemea, huku “mnawakosesha” likitoa kisababishi kwa ufupi na kwa lugha ya kawaida.
