  verdict: approve
  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: Eli anawauliza wanawe sababu ya mwenendo wao na kusema kwamba anasikia taarifa kutoka kwa watu wote hawa kuhusu matendo yao maovu. “Akawaambia,” “Kwa nini mnafanya,” na “kutoka kwa watu hawa wote” zinahifadhi mtiririko, hali ya karipio, na msisitizo wa chanzo cha taarifa.'
  naturalness: Kiswahili ni sanifu, cha kisasa, na chenye mtiririko wa kawaida. “Mambo kama haya” ni usemi wa asili katika karipio, na “habari za matendo yenu maovu” unaeleweka wazi bila kuwa wa maelezo mengi.
  terminology: “Matendo yenu maovu” ni uwasilishaji salama wa דִּבְרֵיכֶם רָעִים katika muktadha huu, ambapo taarifa zinahusu mwenendo wa wana wa Eli. Hailingizi tafsiri ya kimadhehebu wala kubadili uzito wa shutuma.
