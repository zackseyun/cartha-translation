translation:
  language: sw
  text: Akawaambia, “Kwa nini mnafanya mambo kama haya? Maana ninasikia kutoka kwa watu hawa wote habari za matendo yenu maovu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Akawaambia
  rationale: Muundo huu wa simulizi unaendeleza tukio kwa kawaida katika Kiswahili na unaonyesha wazi kwamba Eli alisema kwa wanawe.
- source_word: לָמָּה תַעֲשׂוּן
  choice: Kwa nini mnafanya
  rationale: Kitenzi cha nafsi ya pili wingi kinaeleza mwenendo unaoendelea; wakati wa sasa wa Kiswahili unafaa katika karipio hili.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: mambo kama haya
  rationale: דְּבָרִים inaweza kumaanisha maneno, mambo, au matendo; katika muktadha huu inarejelea mwenendo wao, na usemi huu ni wa kawaida bila kufinya maana kupita kiasi.
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: ninasikia
  rationale: Kiwakilishi huru pamoja na participle kinaonyesha kusikia kunakoendelea au taarifa zinazomfikia Eli sasa.
- source_word: אֶת דִּבְרֵיכֶם רָעִים
  choice: habari za matendo yenu maovu
  rationale: Kiebrania kina maana pana ya ‘mambo/maneno yenu mabaya.’ Muktadha unaonyesha kwamba Eli anasikia taarifa kuhusu mwenendo mwovu wa wanawe; ‘habari za matendo’ huwasilisha hilo kwa Kiswahili cha kawaida.
- source_word: מֵאֵת כָּל הָעָם אֵלֶּה
  choice: kutoka kwa watu hawa wote
  rationale: מֵאֵת huonyesha chanzo cha taarifa, huku כָּל na אֵלֶּה zikihifadhi maana ya ujumla na msisitizo wa ‘hawa.’
