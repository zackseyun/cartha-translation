  terminology: “Mtu wa Mungu,” “BWANA,” na “nyumba ya baba yako” zinafaa na zinahifadhi istilahi na sitiari ya matini. “Wa nyumba ya Farao” ni mwafaka kwa uhusiano unaoashiriwa na kirai cha Kiebrania.
