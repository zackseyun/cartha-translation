base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/027.yaml
  text: 'And a man of God came to Eli and said to him, “Thus says the LORD: Did I indeed reveal myself to your father''s house when they were in Egypt, belonging to Pharaoh''s house?”'
translation:
  language: sw
  text: 'Mtu wa Mungu akamjia Eli, akamwambia, “BWANA asema hivi: Je, kweli nilijifunua kwa nyumba ya baba yako walipokuwa Misri, wa nyumba ya Farao?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hili ni jina la kawaida la kinabii katika Agano la Kale na linaeleweka kwa urahisi katika Kiswahili.
- source_word: כֹּה אָמַר יְהוָה
  choice: BWANA asema hivi
  rationale: Inahifadhi muundo rasmi wa utangulizi wa ujumbe wa kinabii; BWANA ni uwakilishi wa kawaida wa jina la agano YHWH.
- source_word: הֲנִגְלֹה נִגְלֵיתִי
  choice: Je, sikujifunua wazi
  rationale: Kitenzi chenye umbo lisilo na kikomo pamoja na kitenzi kilichokamilika kinatia mkazo; 'wazi' huwasilisha mkazo huo kwa Kiswahili cha kawaida.
- source_word: בֵּית אָבִיךָ
  choice: nyumba ya baba yako
  rationale: Inadumisha taswira ya ukoo au familia ya babu wa Eli bila kuibana kuwa mtu mmoja tu.
- source_word: בִּהְיוֹתָם בְּמִצְרַיִם לְבֵית פַּרְעֹה
  choice: walipokuwa Misri chini ya nyumba ya Farao
  rationale: Kirai cha mwisho ni kifupi na kinaweza kueleza uhusiano wao na utawala au kaya ya Farao; 'chini ya' ni cha asili na hakidai umiliki halisi.
theological_decisions:
- issue: Rejeo la 'nyumba ya baba yako'
  choice: nyumba ya baba yako
  alternative: ukoo wa baba yako
  rationale: Neno 'nyumba' linahifadhi sitiari ya Kiebrania na upana wake wa kifamilia bila kutaja moja kwa moja Haruni au Lawi.
- issue: Nguvu ya swali la Mungu
  choice: Je, sikujifunua wazi
  alternative: Je, kweli nilijifunua
  rationale: Katika muktadha, swali linakumbusha tendo lililotokea; tafsiri hasi ni ya kawaida katika Kiswahili na huwasilisha nguvu ya swali, ingawa muundo wa Kiebrania wenyewe hauna kikanushi cha wazi.
- issue: Uhusiano na nyumba ya Farao
  choice: chini ya nyumba ya Farao
  alternative: wakiwa wa nyumba ya Farao
  rationale: Kihusishi לְ kinaweza kuonyesha uhusiano au utegemezi. 'Chini ya' huhifadhi wazo la kuwa chini ya mamlaka ya Farao bila kudai kwamba walikuwa washiriki halisi wa familia yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kinabii na sitiari ya 'nyumba' zimehifadhiwa.
