base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/013.yaml
  text: 'The custom of the priests with the people was this: whenever any man was sacrificing a sacrifice[a], the priest’s servant would come while the meat was boiling, with the three-pronged fork in his hand.'
translation:
  language: sw
  text: 'Desturi ya makuhani kwa watu ilikuwa hivi: kila mtu alipokuwa akitoa dhabihu, mtumishi wa kuhani angekuja wakati nyama ilipokuwa ikichemka, akiwa ameshika uma wenye meno matatu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִשְׁפַּט
  choice: Desturi ... ilikuwa hivi
  rationale: מִשְׁפָּט hapa inaeleza utaratibu au desturi iliyofuatwa mara kwa mara, si hukumu ya mahakama. Kiunganishi וּ kinaachwa kijitokeze kwa mtiririko wa muktadha badala ya kuongezewa neno la wakati.
- source_word: הַכֹּהֲנִים אֶת־הָעָם
  choice: ya makuhani kwa watu
  rationale: Huhifadhi uhusiano wa mwenendo wa makuhani kwa watu bila kuufafanua kuwa wa uadui au wa manufaa.
- source_word: כָּל־אִישׁ
  choice: kila mtu
  rationale: Ni Kiswahili cha kawaida kwa maana ya kila mmoja katika hali inayorudiwa; hapa mtu hurejelea mwanadamu bila kulazimisha jinsia katika tafsiri.
- source_word: זֹבֵחַ זֶבַח
  choice: alipokuwa akitoa dhabihu
  rationale: Kiswahili cha asili hakiwezi kurudia mzizi kwa ufasaha kama Kiebrania; muundo wa kuendelea unaweka mazingira ya kitendo kilichofuata.
- source_word: וּבָא
  choice: angekuja
  rationale: Huwasilisha tendo la mazoea lililokuwa likitokea kila mara mtu alipotoa dhabihu.
- source_word: נַעַר הַכֹּהֵן
  choice: mtumishi wa kuhani
  rationale: נַעַר inaweza kumaanisha kijana au mtumishi; kazi yake katika muktadha huu ndiyo inayosisitizwa, bila kudai umri mdogo.
- source_word: כְּבַשֵּׁל הַבָּשָׂר
  choice: wakati nyama ilipokuwa ikichemka
  rationale: כ pamoja na hali ya kitenzi ina maana ya wakati; בָּשָׂר hapa ni nyama ya mnyama wa dhabihu.
- source_word: הַמַּזְלֵג שְׁלֹשׁ הַשִּׁנַּיִם
  choice: uma wenye meno matatu
  rationale: Tafsiri ya karibu ya 'uma wenye meno matatu' ni wazi na ya kawaida zaidi kwa Kiswahili kuliko istilahi ya kizamani.
- source_word: בְּיָדוֹ
  choice: akiwa ameshika
  rationale: Huwasilisha kwa Kiswahili asilia kwamba mtumishi alikuwa na kifaa hicho mkononi.
