base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/015.yaml
  text: Was today the first time that I inquired of God for him? Far be it from me! Let not the king impute anything to his servant or to all my father’s house[a], for your servant knew nothing of all this, whether small or great.
translation:
  language: sw
  text: Je, leo ndiyo nilipoanza kumuuliza Mungu kwa ajili yake?[a] Hasha! Mfalme asimtie mtumishi wake wala nyumba yote ya baba yangu hatiani kwa jambo lolote, kwa maana mtumishi wako hakujua chochote kuhusu haya yote, iwe ni jambo dogo au kubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi: “Je, leo nilianza kumuuliza Mungu kwa ajili yake?” Swali hili la balagha linadokeza kwamba hii haikuwa mara ya kwanza Ahimeleki kufanya hivyo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַחִלֹּתִי
  choice: Je, leo ndiyo nilipoanza
  rationale: Muundo huu unahifadhi swali la balagha la Kiebrania na maana yake ya moja kwa moja bila kuligeuza kimya kimya kuwa kauli.
- source_word: לִשְׁאוֹל לוֹ בֵאלֹהִים
  choice: kumuuliza Mungu kwa ajili yake
  rationale: Kitenzi na viambishi vinaonyesha kutafuta mwongozo wa Mungu kwa manufaa ya mtu huyo; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: חָלִילָה לִּי
  choice: Hasha!
  rationale: Ni tamko fupi na lenye nguvu la kukataa kabisa, linalofaa sajili ya kifasihi ya Kiswahili.
- source_word: אַל יָשֵׂם ... דָבָר
  choice: asimhesabie ... jambo lolote
  rationale: Linabaki karibu na taswira ya Kiebrania ya kumwekea au kumhusisha mtu jambo, huku likieleweka katika muktadha wa lawama au shtaka.
- source_word: בְּכָל בֵּית אָבִי
  choice: wala nyumba yote ya baba yangu
  rationale: Linahifadhi nahau ya Kiebrania inayomaanisha jamaa au ukoo mzima wa baba yake, badala ya kuibana kuwa familia ya nyumbani tu.
- source_word: לֹא יָדַע עַבְדְּךָ בְּכָל זֹאת
  choice: mtumishi wako hakujua chochote kuhusu haya yote
  rationale: Linadumisha kujirejelea kwa unyenyekevu mbele ya mfalme na kukataa kujua jambo lolote kuhusu tukio zima.
- source_word: דָּבָר קָטֹן אוֹ גָדוֹל
  choice: kiwe kidogo au kikubwa
  rationale: Linahifadhi merizimu ya Kiebrania inayojumuisha kila jambo, bila kujali ukubwa wake.
theological_decisions:
- issue: Iwapo swali la mwanzo lisemwe wazi kuwa hili halikuwa tukio la kwanza
  choice: Swali la balagha limehifadhiwa katika maandishi, na dokezo lake limefafanuliwa katika tanbihi.
  alternative: Leo haikuwa mara ya kwanza kumuuliza Mungu kwa ajili yake.
  rationale: Kiebrania kina swali la balagha; kuligeuza moja kwa moja kuwa kauli kungeondoa umbo na kiwango fulani cha uwazi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Nahau “nyumba ya baba yangu” imehifadhiwa kwa sababu ina uzito wa kifamilia na kiukoo katika muktadha huu.
