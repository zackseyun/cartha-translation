base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/013.yaml
  text: Saul said to him[a], “Why have you and the son of Jesse conspired against me, by giving him bread and a sword and by inquiring of God for him, so that he has risen against me to lie in wait[b], as on this day?”
translation:
  language: sw
  text: Sauli akamwambia, “Kwa nini wewe na mwana wa Yese mmepanga njama dhidi yangu, kwa kumpa mkate na upanga, na kwa kumwulizia Mungu kwa ajili yake, ili ainuke dhidi yangu na kunivizia[a], kama ilivyo leo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hata ameinuka dhidi yangu, akinivizia, kama ilivyo leo.”
    reason: alternative_reading
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: mmepanga njama
  rationale: Katika muktadha huu kitenzi kinamaanisha kufanya njama dhidi ya mtawala; kauli hii ni ya kawaida na inaonyesha wazi uhasama wa kisiasa.
- source_word: בֶן־יִשָׁי
  choice: mwana wa Yese
  rationale: Inahifadhi namna ya Sauli kumtaja Daudi kwa jina la baba yake badala ya jina lake mwenyewe, jambo linaloonyesha umbali na dharau.
- source_word: בְּתִתְּךָ לוֹ לֶחֶם וְחֶרֶב
  choice: Umempa mkate na upanga
  rationale: Muundo wa Kiebrania unaeleza msingi wa shtaka; sentensi huru ya Kiswahili ni ya asili huku ikidumisha tendo alilodai Sauli.
- source_word: וְשָׁאוֹל לוֹ בֵּאלֹהִים
  choice: na kumwulizia kwa Mungu
  rationale: Katika muktadha wa kikuhani, usemi huu humaanisha kutafuta mwongozo wa Mungu kwa ajili ya mtu mwingine.
- source_word: בֵּאלֹהִים
  choice: kwa Mungu
  rationale: Chanzo kinatumia Elohim, yaani Mungu, wala si jina la agano YHWH.
- source_word: לָקוּם אֵלַי
  choice: ili ainuke dhidi yangu
  rationale: Inahifadhi uwezekano wa kusudi au matokeo katika infinitivu ya Kiebrania bila kuamua kimya kimya kama tendo hilo tayari limetimia.
- source_word: לְאֹרֵב
  choice: na kunivizia
  rationale: Kitenzi hiki hueleza kuvizia au kukaa kwa siri ili kushambulia; tafsiri hii ni ya asili katika Kiswahili na inaeleza mlengwa kutokana na muktadha.
- source_word: כַּיּוֹם הַזֶּה
  choice: kama ilivyo leo
  rationale: Inawasilisha hali ambayo Sauli anadai kuwa imeonekana wazi wakati huo wa sasa.
theological_decisions:
- issue: Jina la Mungu katika בֵּאלֹהִים
  choice: Mungu
  alternative: BWANA
  rationale: Nakala ya Kiebrania ina אֱלֹהִים, si jina YHWH; kwa hiyo tafsiri inafuata neno lililopo katika chanzo.
- issue: Kusudi au matokeo katika לָקוּם
  choice: ili ainuke dhidi yangu
  alternative: hata ameinuka dhidi yangu
  rationale: Infinitivu inaweza kuonyesha kusudi au matokeo. Kauli ya ‘ili ainuke’ huhifadhi mvutano huo kwa kiasi kikubwa na kuepuka kuthibitisha dai la Sauli kama ukweli wa msimulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Mwana wa Yese’ imehifadhiwa kwa athari yake ya kimatamshi, na muundo wa shtaka umerahisishwa bila kupoteza vipengele vya Kiebrania.
