base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/003.yaml
  text: Then David went from there to Mizpeh of Moab[a], and he said to the king of Moab[b], “Please let my father and my mother come out and stay with you until I know what God will do for me.”
translation:
  language: sw
  text: Kisha Daudi akaondoka huko, akaenda Mispa ya Moabu. Akamwambia mfalme wa Moabu, “Tafadhali, waruhusu baba yangu na mama yangu waondoke wakae kwenu[a] mpaka nitakapojua Mungu atakachofanya nami.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya moja kwa moja zaidi: “waruhusu baba yangu na mama yangu watoke kwenu” au “waende kwenu.” Kitenzi cha Kiebrania ni “kutoka/kuondoka”; katika muktadha, Daudi anaomba wazazi wake wabaki chini ya ulinzi wa mfalme wa Moabu.'
    reason: lexical_alternative
  - marker: b
    text: Au “Mungu atakachonitendea” au “Mungu atakachofanya kwa ajili yangu.” Kiebrania kinaweza kumaanisha kile Mungu atakachomfanyia Daudi, dhidi yake, au kwa ajili yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד מִשָּׁם
  choice: Kisha Daudi akaondoka huko
  rationale: Muundo huu unaonyesha mwendelezo wa simulizi na safari kutoka mahali alikokuwa, kwa Kiswahili cha kawaida na cha asili.
- source_word: מִצְפֵּה מוֹאָב
  choice: Mispa ya Moabu
  rationale: Jina la mahali limetoholewa kwa tahajia inayoeleweka katika Kiswahili, huku uhusiano wake na Moabu ukihifadhiwa.
- source_word: מֶלֶךְ מוֹאָב
  choice: mfalme wa Moabu
  rationale: Hii ni tafsiri ya moja kwa moja ya kishazi kinachomtambulisha mtawala aliyezungumziwa.
- source_word: יֵצֵא נָא אָבִי וְאִמִּי
  choice: Tafadhali, waruhusu baba yangu na mama yangu waondoke
  rationale: Kitenzi יֵצֵא kimehifadhiwa kwa maana yake ya msingi ya kuondoka au kutoka, na נָא imetafsiriwa kama ombi la heshima, “tafadhali.” Kutaja baba na mama mmoja mmoja kunahifadhi msisitizo wa Kiebrania.
- source_word: אִתְּכֶם
  choice: wakae pamoja nanyi
  rationale: Kiwakilishi cha Kiebrania ni cha wingi. “Nanyi” kinahifadhi wingi huo, ambao huenda unamhusisha mfalme pamoja na watu wa nyumba au ikulu yake. Neno “wakae” linaeleza kusudi linaloeleweka katika muktadha bila kufuta maana halisi ya kuondoka.
- source_word: עַד אֲשֶׁר אֵדַע
  choice: mpaka nitakapojua
  rationale: Kishazi hiki kinaonyesha muda ambao wazazi wa Daudi wangekaa huko; tafsiri hii ni ya kawaida na sahihi katika Kiswahili.
- source_word: מַה יַּעֲשֶׂה לִּי אֱלֹהִים
  choice: Mungu atakachonifanyia
  rationale: “Atakachonifanyia” ni Kiswahili cha asili kinachoacha wazi kwa kiasi kinachofaa ikiwa tendo hilo litakuwa kwa faida ya Daudi au litamhusu kwa namna nyingine, kama ilivyo katika לִי.
theological_decisions:
- issue: Maana ya אֱלֹהִים katika kauli ya Daudi
  choice: Mungu
  alternative: miungu; mungu fulani
  rationale: Ingawa umbo la nomino linaweza kuonekana kuwa la wingi, kitenzi cha umoja na muktadha vinaonyesha kwamba hapa anatajwa Mungu wa Israeli.
- issue: Mwelekeo wa tendo la Mungu katika מַה יַּעֲשֶׂה לִּי
  choice: Mungu atakachonifanyia
  alternative: Mungu atakachonitendea; Mungu atakachofanya kwa ajili yangu
  rationale: Kihusishi לִי kinaweza kueleweka kuwa “kwangu,” “juu yangu,” au “kwa ajili yangu.” Tafsiri kuu haipaswi kudai mapema kwamba tendo hilo lazima liwe la manufaa, hivyo utata wa matokeo umehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Nanyi” kimetumiwa kuhifadhi wingi wa kiwakilishi cha Kiebrania. Sentensi imegawanywa baada ya jina la mahali ili simulizi lisomeke kwa urahisi bila kubadili uhusiano wa matukio.
