  yaml_path: translation/ot/1_samuel/022/023.yaml
  text: Stay with me[a]; do not be afraid, for he who seeks my life seeks your life also[b], for you are under my protection.
translation:
  language: sw
  text: Kaa nami; usiogope, kwa maana anayetafuta uhai wangu hutafuta uhai wako pia; kwa maana ukiwa nami uko chini ya ulinzi wangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa karibu: “kwa maana wewe uko nami katika salama/ulinzi.” Kirai cha Kiebrania ni kifupi na kina muundo usio wa kawaida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה אִתִּי
  choice: Kaa pamoja nami
  rationale: Kitenzi ישׁב hapa ni agizo la kubaki katika ushirika wa Daudi, si lazima kuketi kimwili. “Kaa pamoja nami” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: אַל תִּירָא
  choice: usiogope
  rationale: Hili ni katazo la moja kwa moja; “usiogope” ni usemi wa kawaida wa Kiswahili sanifu.
- source_word: אֲשֶׁר יְבַקֵּשׁ אֶת נַפְשִׁי
  choice: anayewinda uhai wangu
  rationale: Katika muktadha huu, ‘kutafuta uhai’ ni kutaka kumuua mtu. “Kuwinda uhai” huhifadhi picha ya kutafuta kwa nia mbaya bila kutumia ‘roho,’ ambalo lingeelekeza maana isiyokusudiwa.
- source_word: נַפְשִׁי / נַפְשֶׁךָ
  choice: uhai wangu / uhai wako
  rationale: נֶפֶשׁ katika nahau hii humaanisha uhai wa mtu, si nafsi isiyo ya kimwili.
- source_word: יְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: anawinda uhai wako pia
  rationale: Marudio ya kitenzi na yambwa yamehifadhiwa. “Pia” huweka wazi ulinganifu unaodokezwa katika Kiebrania.
- source_word: מִשְׁמֶרֶת אַתָּה עִמָּדִי
  choice: Ukiwa pamoja nami, utakuwa salama chini ya ulinzi wangu
  rationale: Kirai cha Kiebrania ni kifupi na kisicho cha kawaida, kikihusisha wazo la kulindwa au kuwekwa salama pamoja na Daudi. Tafsiri hii hutoa maana hiyo kwa Kiswahili cha asili huku tanbihi ikihifadhi muundo mbadala wa karibu zaidi.
