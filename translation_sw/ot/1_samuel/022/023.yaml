  source_fidelity: 'Rasimu inawasilisha ujumbe mkuu kwa usahihi: Daudi anamwamuru Abiathari akae naye, asiogope, kwa sababu adui anayehatarisha uhai wa Daudi anahatarisha wake pia, na Daudi anamhakikishia usalama. Hata hivyo, “anayewinda uhai” si usemi wa kawaida wala wa wazi katika Kiswahili kwa nahau ya Kiebrania “kutafuta uhai.” Pia, sentensi ya mwisho imeifanya ahadi hiyo kuwa ya wakati ujao (“utakuwa salama”), ilhali Kiebrania ni kauli ya hali ya sasa inayohusisha kukaa na Daudi katika ulinzi wake.'
