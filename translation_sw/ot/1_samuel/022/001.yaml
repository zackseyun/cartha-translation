base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/001.yaml
  text: So David went from there and escaped to the cave of Adullam. When his brothers and all his father's household heard[a], they went down there to him.
translation:
  language: sw
  text: Basi Daudi akaondoka huko, akatorokea pango la Adulamu.[a] Ndugu zake na familia yote ya baba yake waliposikia, wakateremka huko kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akakimbilia pango la Adulamu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuponyoka au kukimbia hatarini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: akaondoka
  rationale: Kitenzi הלך hapa kinaonyesha Daudi kuondoka mahali alikokuwa; “akaondoka” ni cha kawaida na kinaunganisha vizuri mfululizo wa simulizi.
- source_word: מִשָּׁם
  choice: huko
  rationale: Kielezi hiki hurejelea mahali palilotajwa katika muktadha uliotangulia; “huko” ni tafsiri ya kawaida ya Kiswahili.
- source_word: וַיִּמָּלֵט
  choice: akatorokea
  rationale: Nifali ya מלט ina maana ya kuponyoka au kutoroka hatarini. “Akatorokea” linaonyesha kuondoka hatarini na kuelekea mahali maalumu bila kuongeza wazo lisilokuwamo la kupata hifadhi rasmi.
- source_word: מְעָרַת עֲדֻלָּם
  choice: pango la Adulamu
  rationale: Muundo wa umilikaji wa Kiebrania unaonyesha pango linalohusishwa na mahali paitwapo Adulamu; muundo huu ni wazi na wa kawaida katika Kiswahili.
- source_word: וַיִּשְׁמְעוּ
  choice: waliposikia
  rationale: Kitenzi שמע kimetafsiriwa kwa maana yake ya kawaida. Kiswahili “waliposikia” kinaonyesha kwa kawaida kuwa tendo lililofuata lilitokea baada ya habari kuwafikia, huku kitu walichosikia kikibaki bila kutajwa kama katika Kiebrania.
- source_word: אֶחָיו
  choice: ndugu zake
  rationale: Katika muktadha huu umbo la kiume la wingi linarejelea ndugu wa kiume wa Daudi; “ndugu zake” ni la kawaida katika Kiswahili na muktadha huweka wazi uhusiano.
- source_word: כָל בֵּית אָבִיו
  choice: familia yote ya baba yake
  rationale: Neno בַּיִת katika nahau hii linamaanisha jamaa au kaya ya upande wa baba, si jengo lenyewe. “Familia yote ya baba yake” huwasilisha maana hiyo kwa lugha ya sasa.
- source_word: וַיֵּרְדוּ
  choice: wakateremka
  rationale: ירד lina maana ya kushuka au kuteremka. “Wakateremka” linahifadhi mwelekeo wa kijiografia uliomo katika chanzo.
- source_word: אֵלָיו שָׁמָּה
  choice: huko kwake
  rationale: Kirai hiki kinaunganisha mahali alikokuwa Daudi na mwendo wa kumwendea; “huko kwake” ni kifupi na cha asili katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Kiunganishi “Basi” kinaendeleza simulizi, na “wakateremka” kinahifadhi maelezo ya mwelekeo yaliyomo katika Kiebrania.
