base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/019.yaml
  text: And Nob[a], the city of the priests, he struck with the edge of the sword, from man to woman, from child to nursing infant, and ox and donkey and sheep, with the edge of the sword.
translation:
  language: sw
  text: Nobu, mji wa makuhani, aliupiga kwa makali ya upanga[a], kuanzia mwanamume mpaka mwanamke, kuanzia mtoto mdogo mpaka mtoto anayenyonya, na ng’ombe, punda, na kondoo, kwa makali ya upanga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, kihalisi, “kwa kinywa cha upanga,” nahau inayomaanisha kuua kwa upanga.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹב
  choice: Nobu
  rationale: Jina la mahali limetoholewa kwa namna ya kawaida na inayoeleweka katika Kiswahili.
- source_word: עִיר הַכֹּהֲנִים
  choice: mji wa makuhani
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha kwamba Nobu ulikuwa mji uliotambulika kwa makuhani wake.
- source_word: הִכָּה
  choice: aliupiga … Akaua
  rationale: ‘Aliupiga’ huhifadhi maana ya msingi ya נכה kuhusu mji; kisha ‘Akaua’ huweka wazi matokeo ya tendo hilo kwa watu na wanyama waliotajwa, kama muktadha na nahau ya upanga zinavyodai.
- source_word: לְפִי חֶרֶב / לְפִי חָרֶב
  choice: kwa makali ya upanga
  rationale: Hii ni tafsiri asilia ya Kiswahili inayohifadhi taswira halisi ya upanga huku ikiwasilisha nahau ya kuuawa kwa upanga.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: mwanamume na mwanamke
  rationale: Majina ya jinsia yaliyoko katika Kiebrania yamehifadhiwa; katika muktadha huu yanaonyesha kwamba mauaji hayakumbakiza mtu wa jinsia yoyote.
- source_word: מֵעוֹלֵל וְעַד יוֹנֵק
  choice: mtoto mdogo na mtoto anayenyonya
  rationale: עוֹלֵל ni mtoto mdogo, na יוֹנֵק ni mtoto anayenyonya. Maneno haya yanahifadhi tofauti na msisitizo wa mauaji yasiyobagua.
- source_word: וְשׁוֹר וַחֲמוֹר וָשֶׂה
  choice: ng’ombe, punda na kondoo
  rationale: Haya ni majina ya kawaida na yanayoeleweka ya wanyama wa kufugwa; ‘kondoo’ ni chaguo linalofaa kwa שֶׂה katika muktadha usiolazimisha kutaja mbuzi.
theological_decisions:
- issue: Maneno ya kijinsia katika usemi unaoonyesha ujumla
  choice: mwanamume na mwanamke
  alternative: wanaume na wanawake; kila mtu
  rationale: Tafsiri inahifadhi jinsia na umoja wa maneno ya Kiebrania bila kuyafanya kuwa kauli ya mafundisho kuhusu jinsia; pamoja yanaonyesha ukamilifu wa maangamizi.
- issue: Kiwango cha kuhifadhi muundo wa kauli ya mauaji
  choice: Kuhifadhi kutajwa mara mbili kwa makali ya upanga na orodha kamili ya wahanga
  alternative: Kufupisha kuwa ‘akawaangamiza wote kwa upanga’
  rationale: Kurudiwa kwa upanga na mfululizo wa watu na wanyama kunasisitiza ukubwa na ukatili wa maangamizi; kuyafupisha kungepunguza uzito wa usemi wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo umegawanywa katika sentensi mbili ili usomeke kwa urahisi bila kupoteza marudio, orodha, au uzito wa maandishi ya Kiebrania.
