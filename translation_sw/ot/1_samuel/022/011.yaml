translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Ukoo wa baba yake” umetumiwa badala ya tafsiri sisisi “nyumba ya baba yake” ili kuepuka dhana ya jengo huku maana ya kijamii ya nahau ikihifadhiwa.
