base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/011.yaml
  text: Then the king sent to summon Ahimelech son of Ahitub the priest[a], and all his father's house, the priests who were at Nob; and they all came to the king.
translation:
  language: sw
  text: Ndipo mfalme akatuma kumwita Ahimeleki mwana wa Ahitubu, kuhani, pamoja na watu wote wa ukoo wa baba yake[a], yaani, makuhani waliokuwa Nobu. Wote wakaja kwa mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania “nyumba ya baba yake” humaanisha jamaa pana au ukoo wa upande wa baba, si familia yake ya karibu tu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח ... לִקְרֹא
  choice: akatuma watu kumwita
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha kwamba mfalme alituma wajumbe ili Ahimeleki aitwe afike kwake; unawasilisha wazo la amri rasmi bila kutumia lugha ngumu.
- source_word: אֲחִימֶלֶךְ בֶּן אֲחִיטוּב
  choice: Ahimeleki mwana wa Ahitubu
  rationale: Majina yamenukuliwa kwa tahajia inayofaa Kiswahili, na uhusiano wa mwana na baba umehifadhiwa moja kwa moja.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Nomino hii inamtambulisha Ahimeleki kwa wadhifa wake wa kikuhani.
- source_word: כָּל בֵּית אָבִיו
  choice: watu wote wa ukoo wa baba yake
  rationale: Nahau ya Kiebrania inamaanisha jamaa pana ya upande wa baba, si nyumba ya kukaliwa wala familia ndogo tu. Tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: הַכֹּהֲנִים אֲשֶׁר בְּנֹב
  choice: yaani, makuhani waliokuwa Nobu
  rationale: Kirai hiki kinawatambulisha zaidi watu wa ukoo wa baba yake kuwa makuhani waliokaa Nobu. Neno “yaani” linaonyesha uhusiano huo wa ufafanuzi.
- source_word: וַיָּבֹאוּ כֻלָּם אֶל הַמֶּלֶךְ
  choice: Wote wakaja kwa mfalme
  rationale: “Wote” huhifadhi msisitizo kwamba kundi zima lililokuwa limeitwa lilifika, na “kwa mfalme” huonyesha mwendo kuelekea kwake bila kuongeza wazo lisilotajwa wazi.
