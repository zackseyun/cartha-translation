  to: Kwa maana ninyi nyote mmekula njama dhidi yangu, wala hakuna hata mmoja anayenijulisha kwamba mwanangu amefanya agano na mwana wa Yese[b]. Hakuna hata mmoja wenu anayenihurumia au kunijulisha kwamba mwanangu amemchochea mtumishi wangu dhidi yangu ili anivizie[a], kama ilivyo leo.
