  - severity: low
    issue: Alama ya tanbihi ya “Mwana wa Yese” iko mwisho wa sentensi.
    rationale: Tanbihi ya kitamaduni inahusu rejeleo “Mwana wa Yese,” hivyo inapaswa kutiwa mara tu baada ya maneno hayo.
