base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/008.yaml
  text: For all of you have conspired against me[a], and no one informs me when my son makes a covenant with the son of Jesse, and none of you is grieved for me or informs me that my son has stirred up my servant against me to lie in wait[d][c][b], as at this day.
translation:
  language: sw
  text: Kwa maana ninyi nyote mmekula njama dhidi yangu, wala hakuna hata mmoja anayenijulisha kwamba mwanangu amefanya agano na mwana wa Yese[b]. Hakuna hata mmoja wenu anayenihurumia au kunijulisha kwamba mwanangu amemchochea mtumishi wangu dhidi yangu ili anivizie[a], kama ilivyo leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amemwinua mtumishi wangu dhidi yangu ili anivizie.”
    reason: lexical_alternative
  - marker: b
    text: “Mwana wa Yese” ni Daudi. Sauli anamrejelea kwa kumtaja kupitia baba yake badala ya kulitaja jina la Daudi.
    reason: cultural_note
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: mmekula njama
  rationale: Katika muktadha huu kitenzi kinaonyesha njama yenye uhasama dhidi ya Sauli, si muungano wa kawaida.
- source_word: גֹּלֶה אֶת אָזְנִי
  choice: anayenijulisha / kunijulisha
  rationale: Nahau ya Kiebrania, kihalisi ‘kufunua sikio langu,’ humaanisha kumfunulia mtu habari; ‘kunijulisha’ ni Kiswahili cha kawaida na wazi.
- source_word: בִּכְרָת
  choice: anapofanya agano
  rationale: ב pamoja na jina-kitenzi huonyesha wakati au mazingira; ‘anapofanya agano’ pia huwasilisha nahau ya Kiebrania ‘kukata agano’ kwa Kiswahili cha sasa.
- source_word: בְּנִי עִם בֶּן יִשַׁי
  choice: mwanangu anapofanya agano na mwana wa Yese
  rationale: ‘Mwanangu’ humrejelea Yonathani, na ‘mwana wa Yese’ limehifadhiwa kwa sababu Sauli anamrejelea Daudi kwa nasaba badala ya kumtaja jina.
- source_word: חֹלֶה ... עָלַי
  choice: anayenihurumia
  rationale: Katika muktadha huu neno halimaanishi ugonjwa halisi bali kusikitishwa na hali ya Sauli au kumjali; ‘kunihurumia’ ni usemi wa asili unaobeba hisia hiyo.
- source_word: הֵקִים
  choice: amemchochea
  rationale: Katika shtaka la Sauli, neno lina maana ya kumwinua au kumsimamisha mtu dhidi yake; ‘amemchochea’ huwasilisha madai ya uchochezi bila kugeuza kauli kuwa ukweli wa msimulizi.
- source_word: עַבְדִּי
  choice: mtumishi wangu
  rationale: Daudi anatajwa kama aliye chini ya mamlaka ya kifalme ya Sauli; ‘mtumishi’ linafaa kuliko neno linalosisitiza utumwa.
- source_word: לְאֹרֵב
  choice: ili anivizie
  rationale: Mzizi ארב unaonyesha kuvizia kwa kusudi la kushambulia; muundo huu ni wa kawaida katika Kiswahili.
- source_word: כַּיּוֹם הַזֶּה
  choice: kama ilivyo leo
  rationale: Nahau hii huelekeza kwenye hali iliyopo wakati wa usemi; tafsiri hii ni ya asili na inahifadhi rejeo la wakati wa sasa.
theological_decisions:
- issue: Kauli kwamba Yonathani alimchochea Daudi dhidi ya Sauli
  choice: Imehifadhiwa kama shtaka la Sauli bila ufafanuzi unaolihakikishia kuwa kweli.
  alternative: Kutafsiri kwa namna inayosema tu kwamba Yonathani ‘alimweka’ Daudi au kuthibitisha wazi kwamba alimwasi Sauli.
  rationale: Kitenzi kinaweza kumaanisha kuinua, kusimamisha, au kuchochea; muktadha ni hotuba ya Sauli yenye mashaka na lawama, hivyo tafsiri haipaswi kutatua kimyakimya usahihi wa shtaka lake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya ‘hakuna hata mmoja’ na ‘kunijulisha’ yamehifadhi msisitizo wa lawama katika hotuba ya Sauli; ‘mwana wa Yese’ limehifadhi umbali wa kimakusudi katika namna yake ya kumtaja Daudi.
