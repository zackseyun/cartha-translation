  source_fidelity: Maana kuu na msisitizo wa shtaka la Sauli vimehifadhiwa vizuri. Hata hivyo, mpangilio wa “ananyenijulisha mwanangu anapofanya agano” unaweza kusomeka kana kwamba mtu anamjulisha Sauli mwanawe mwenyewe, badala ya kumjulisha kuhusu agano hilo. Kuongeza “kwamba” huondoa utata huo bila kupunguza maana.
  naturalness: Kiswahili kwa ujumla ni sanifu na kinafaa kwa hotuba ya lawama. Marekebisho madogo ya kiunganishi na uhamisho wa alama ya tanbihi hufanya sentensi iwe wazi na mtiririko wake uwe wa kawaida zaidi.
  terminology: “Mmekula njama,” “agano,” “mwana wa Yese,” “mtumishi wangu,” na “anivizie” ni chaguo zinazofaa. Tanbihi ya kitamaduni inahitaji kueleza kwa usahihi kwamba Sauli anamrejelea Daudi kwa kumtaja kupitia baba yake, si kwa “jina la nasaba,” ambalo si sawa kabisa na muundo wa Kiebrania hapa.
