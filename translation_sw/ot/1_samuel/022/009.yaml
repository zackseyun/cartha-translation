  text: וַ/יַּ֜עַן דֹּאֵ֣ג הָ/אֲדֹמִ֗י וְ/ה֛וּא נִצָּ֥ב עַל עַבְדֵֽי שָׁא֖וּל וַ/יֹּאמַ֑ר רָאִ֨יתִי֙ אֶת בֶּן יִשַׁ֔י בָּ֣א נֹ֔בֶ/ה אֶל אֲחִימֶ֖לֶךְ בֶּן אֲחִטֽוּב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/009.yaml
  text: Then Doeg the Edomite[a], who was standing among Saul’s servants, answered and said, “I saw the son of Jesse coming to Nob, to Ahimelech son of Ahitub.”
translation:
  language: sw
  text: Ndipo Doegi, Mwedomu[a], aliyekuwa amesimama miongoni mwa watumishi wa Sauli, akajibu na kusema, “Nilimwona mwana wa Yese akija Nobu kwa Ahimeleki mwana wa Ahitubu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyekuwa amewekwa juu ya watumishi wa Sauli.” Maneno ya Kiebrania yanaweza kuonyesha ama Doegi alivyokuwa amesimama miongoni mwa watumishi wa Sauli, ama jukumu la kuwasimamia.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: akajibu
  rationale: Katika masimulizi, kitenzi ענה hutambulisha jibu; “akajibu” kinadumisha mtindo wa Kiebrania hata bila swali la moja kwa moja lililotangulia.
- source_word: הָאֲדֹמִי
  choice: Mwedomu
  rationale: Ni jina la utambulisho wa kikabila linalomfafanua Doegi; “Mwedomu” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: וְהוּא נִצָּב עַל עַבְדֵי שָׁאוּל
  choice: aliyekuwa amesimama miongoni mwa watumishi wa Sauli
  rationale: נִצָּב inaweza kumaanisha kusimama au kuwekwa mahali, na עַל hapa inaweza kuonyesha kuwapo kati ya watu hao au mamlaka juu yao. Maandishi makuu yanaonyesha mahali bila kudai cheo kisicho hakika; uwezekano mwingine umewekwa katika tanbihi.
- source_word: עַבְדֵי שָׁאוּל
  choice: watumishi wa Sauli
  rationale: עבדים inaweza kumaanisha watumishi, wahudumu, au maofisa wa kifalme. “Watumishi” ni pana na ya moja kwa moja bila kufafanua hadhi yao kupita kiasi.
- source_word: וַיֹּאמַר
  choice: na kusema
  rationale: Inahifadhi mfuatano wa vitenzi “akajibu na kusema” uliopo katika Kiebrania badala ya kuvifupisha kuwa kitenzi kimoja.
- source_word: רָאִיתִי
  choice: Nilimwona
  rationale: Kauli hii inaripoti tukio lililoonekana wakati uliopita; kiambishi cha yambwa kinafaa kwa mtu anayeonekana.
- source_word: בֶּן יִשַׁי
  choice: mwana wa Yese
  rationale: Kiebrania kinatumia kwa makusudi uhusiano huu badala ya jina Daudi, hivyo tafsiri inadumisha athari hiyo ya usemi.
- source_word: בָּא
  choice: akija
  rationale: Hali ya kishirikishi baada ya “nilimwona” inaeleza tendo lililokuwa likionekana, ambalo Kiswahili hulieleza kwa kawaida kwa “akija.”
- source_word: נֹבֶה
  choice: Nobu
  rationale: Herufi ya mwelekeo kwenye jina la mahali inaonyesha mwendo kuelekea Nobu; katika Kiswahili, “akija Nobu” hueleza kufika mahali hapo kwa kawaida.
- source_word: אֶל אֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: kwa Ahimeleki mwana wa Ahitubu
  rationale: אֶל huonyesha mtu aliyefuatwa au aliyekuwa mwisho wa safari. “Kwa Ahimeleki” ni Kiswahili cha kawaida kwa kwenda alipo mtu, huku kikidumisha maana ya kuelekea kwake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya masimulizi iliyo wazi na yenye heshima. Majina yametoholewa kwa maumbo yanayotambulika katika mapokeo ya Biblia ya Kiswahili. Muundo “akajibu na kusema” umehifadhiwa ili kuakisi mfuatano wa Kiebrania, na utata wa נִצָּב עַל umehifadhiwa kwa tanbihi.
