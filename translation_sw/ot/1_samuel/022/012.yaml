  text: Then Saul said, “Listen, please, son of Ahitub.” And he answered, “Here I am, my lord.”
translation:
  language: sw
  text: Ndipo Sauli akasema, “Tafadhali sikiliza, mwana wa Ahitubu.” Naye akajibu, “Mimi hapa, bwana wangu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע־נָא
  choice: Tafadhali sikiliza
  rationale: Kitenzi שׁמע ni agizo la kusikiliza, na chembe נָא hulainisha ombi au agizo; ‘tafadhali’ huiwakilisha kwa Kiswahili cha kawaida bila kuifanya iwe ya haraka kama ‘sasa’.
- source_word: הִנְנִי
  choice: Mimi hapa
  rationale: Kauli hii ya utayari na kujitokeza inatafsiriwa kwa usemi wa kawaida wa Kiswahili unaohifadhi maana ya ‘tazama, niko hapa’ bila ukakasi.
- source_word: אֲדֹנִי
  choice: bwana wangu
  rationale: Hapa ni namna ya heshima ya kumwambia Sauli, si jina la Mungu; herufi ndogo zinazuia mkanganyiko wa kitheolojia.
theological_decisions:
- issue: Maana ya אֲדֹנִי katika kumsemesha Sauli
  choice: bwana wangu
  alternative: Bwana wangu
  rationale: Muktadha unaonyesha cheo cha heshima kwa mfalme wa kibinadamu, si rejeo kwa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umehifadhiwa kwa ‘Ndipo ... Naye ...’, huku mazungumzo yakisomeka kwa urahisi.
