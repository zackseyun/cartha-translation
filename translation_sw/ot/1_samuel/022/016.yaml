  text: But the king said[a], “You shall surely die, Ahimelech[b], you and all your father's house.”
translation:
  language: sw
  text: Lakini mfalme akasema, “Hakika utakufa[a], Ahimeleki, wewe pamoja na jamaa yote ya baba yako[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bila shaka utakufa” au “Lazima ufe.” Kiebrania hutumia kitenzi kisicho na wakati pamoja na kitenzi kingine cha “kufa” ili kutia mkazo mkubwa.
    reason: lexical_alternative
  - marker: b
    text: “Jamaa ya baba yako” hapa ni nyumba au ukoo wa upande wa baba.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Kauli ya kawaida ya masimulizi ya Kiebrania; kiambishi -ka- kinaendeleza mfuatano wa matukio kwa Kiswahili cha asili.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye uainisho humtambulisha msemaji; Kiswahili hakihitaji kibainishi tofauti kama ‘the’.
- source_word: מוֹת תָּמוּת
  choice: Hakika utakufa
  rationale: Muundo wa jina-jinsi lisilo na kikomo pamoja na kitenzi huongeza mkazo. ‘Hakika utakufa’ huhifadhi uhakika na uzito wa hukumu kwa Kiswahili cha sasa.
- source_word: אֲחִימֶלֶךְ
  choice: Ahimeleki
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: אַתָּה
  choice: wewe
  rationale: Kiwakilishi kilichotajwa wazi katika Kiebrania kina mkazo; kimehifadhiwa baada ya jina.
- source_word: וְכָל
  choice: pamoja na ... yote
  rationale: Hupanua hukumu kutoka kwa Ahimeleki hadi kwa kundi lote linalotajwa; ‘pamoja na’ ni ya asili katika sentensi hii.
- source_word: בֵּית אָבִיךָ
  choice: jamaa yote ya baba yako
  rationale: Nahau hiyo humaanisha nyumba, ukoo, au familia ya upande wa baba, si jengo halisi. ‘Jamaa ... ya baba yako’ inaeleweka kwa urahisi huku ikihifadhi mwelekeo wa kifamilia.
theological_decisions:
- issue: Nguvu ya kauli מוֹת תָּמוּת
  choice: Hakika utakufa
  alternative: Lazima ufe
  rationale: Kiebrania kinaweza kusikika kama tangazo thabiti au hukumu yenye nguvu. Tafsiri iliyochaguliwa huhifadhi msisitizo bila kuamua kimya kimya kwamba muundo huo unaonyesha wajibu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetungwa kwa mtiririko wa kawaida wa masimulizi; ‘Hakika’ huhifadhi mkazo wa hukumu, na ‘jamaa ya baba yako’ huepuka kueleweka kuwa nyumba ya kujengwa.
