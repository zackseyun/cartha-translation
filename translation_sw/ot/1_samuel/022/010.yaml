base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/010.yaml
  text: And he inquired of Yahweh for him[a], and gave him provisions, and gave him the sword of Goliath the Philistine.
translation:
  language: sw
  text: Akamwuliza Yahweh kwa ajili yake[a], akampa chakula cha safari, na akampa upanga wa Goliathi, yule Mfilisti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alitafuta ushauri kwa Yahweh kwa ajili yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל לוֹ בַּיהוָה
  choice: Akamwuliza Yahweh kwa ajili yake
  rationale: Muundo wa שׁאל pamoja na ב na jina la Mungu una maana ya kumwuliza au kutafuta shauri kwa Mungu. Kauli hii inahifadhi maana ya tendo hilo na neno לוֹ kama ‘kwa ajili yake,’ yaani kwa niaba yake.
- source_word: בַּיהוָה
  choice: Yahweh
  rationale: Jina la agano יְהוָה limetafsiriwa moja kwa moja kuwa ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: צֵידָה
  choice: chakula cha safari
  rationale: צֵידָה humaanisha mahitaji ya chakula yanayochukuliwa kwa safari. ‘Chakula cha safari’ ni usemi wa kawaida na unaoeleweka katika Kiswahili cha sasa.
- source_word: נָתַן לוֹ
  choice: akampa
  rationale: Kitenzi hiki kinatoa kwa ufupi maana ya נתן pamoja na kiambishi cha yambwa. Kurudia ‘akampa’ kunafuata urudiaji wa Kiebrania.
- source_word: וְאֵת חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: na akampa upanga wa Goliathi, yule Mfilisti
  rationale: Tafsiri hii inadumisha uhusiano wa umilikaji katika mnyororo wa Kiebrania na kubainisha kwamba ‘Mfilisti’ anamwelezea Goliathi.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina maalumu la Mungu, si cheo. ‘Yahweh’ hulihifadhi jina hilo wazi katika tafsiri.
- issue: Maana ya kumwuliza Mungu kwa niaba ya Daudi
  choice: Akamwuliza Yahweh kwa ajili yake
  alternative: Alitafuta shauri kwa Yahweh kwa ajili yake
  rationale: Chaguo kuu linahifadhi kwa karibu kitenzi שׁאל bila kueleza kimadhehebu namna ya kupata jibu; tanbihi inaonyesha maana mbadala ya kisemantiki ya ‘kutafuta shauri.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni rahisi kwa msomaji wa kawaida; urudiaji wa ‘akampa’ umehifadhiwa ili kuakisi mtiririko wa shtaka katika Kiebrania.
