translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na hadhi inayofaa Maandiko. ‘Usikae’ na ‘ondoka’ ni maneno yanayoeleweka kwa urahisi; ‘ngome’ huhifadhi wazo la mahali pa kujikinga. Alama ya tanbihi [a] imewekwa baada ya kishazi husika.
