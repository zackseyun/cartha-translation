base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/005.yaml
  text: Then Gad the prophet said to David[a], “Do not stay in the stronghold. Go and come for yourself to the land of Judah.” So David went and came to the forest of Hereth.
translation:
  language: sw
  text: Ndipo nabii Gadi akamwambia Daudi, “Usikae katika ngome. Nenda, ukaingie katika nchi ya Yuda.[a]” Basi Daudi akaondoka, akaingia katika msitu wa Harethi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uende katika nchi ya Yuda.” Kitenzi cha Kiebrania kinaweza kutafsiriwa “kuja” au “kuingia,” au, kulingana na muktadha, kwa maana ya jumla zaidi “kwenda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא
  choice: nabii
  rationale: נָבִיא ni neno la kawaida la Kiebrania kwa nabii; halimaanishi hasa ‘mwonaji,’ ambalo huwakilisha neno jingine la Kiebrania.
- source_word: לֹא תֵשֵׁב
  choice: Usikae
  rationale: Katika muktadha huu, יָשַׁב ni amri ya kutobaki mahali hapo; ‘usikae’ ni ya kawaida na inahifadhi maana hiyo.
- source_word: בַּמְּצוּדָה
  choice: katika ngome
  rationale: מְצוּדָה humaanisha mahali penye ulinzi au palipo vigumu kufikiwa; ‘ngome’ ni tafsiri fupi na ya kawaida katika simulizi hili.
- source_word: לֵךְ
  choice: Ondoka
  rationale: Ingawa הלך kimsingi ni ‘nenda,’ hapa amri inamtoa Daudi katika ngome, hivyo ‘ondoka’ huonyesha mwendo unaokusudiwa kwa Kiswahili cha kawaida.
- source_word: וּבָאתָ לְּךָ אֶרֶץ יְהוּדָה
  choice: uingie katika nchi ya Yuda
  rationale: בוא inaweza kumaanisha kuja au kuingia. Kwa kuwa nchi ya Yuda ndiyo mahali anapoelekezwa, ‘uingie’ ni ya asili na sahihi; לְךָ ina msisitizo wa kibinafsi ambao Kiswahili hakihitaji kuutafsiri kwa kiwakilishi tofauti.
- source_word: אֶרֶץ יְהוּדָה
  choice: nchi ya Yuda
  rationale: Tafsiri hii huhifadhi maana ya eneo la kabila, badala ya kutumia jina ‘Yuda’ peke yake.
- source_word: יַעַר חָרֶת
  choice: msitu wa Herethi
  rationale: יַעַר ni msitu au eneo lenye miti; Herethi ni unukuzi wa jina la mahali.
- source_word: וַיָּבֹא
  choice: akaingia
  rationale: Kitenzi בוא kinatumika tena; ‘akaingia’ kinafaa kwa mwendo wa kuingia katika eneo la msitu na huendeleza ulinganifu na amri iliyotangulia.
