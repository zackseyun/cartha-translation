base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/020.yaml
  text: But one son of Ahimelech son of Ahitub escaped[a], and his name was Abiathar, and he fled after David.
translation:
  language: sw
  text: Lakini mwana mmoja wa Ahimeleki, mwana wa Ahitubu, aliponyoka; jina lake lilikuwa Abiathari, naye akakimbia kumfuata Daudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akakimbilia kwa Daudi.” Kiebrania kinasema kihalisi, “akakimbia baada ya Daudi,” jambo linaloweza kumaanisha kwamba alikwenda kumfuata ili ajiunge naye.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵט
  choice: aliponyoka
  rationale: Kitenzi hiki katika hali ya Nifali kinaonyesha kwamba alifanikiwa kuhepa mauaji yaliyotangulia. “Aliponyoka” ni cha kawaida na kinatofautisha tendo hili na kukimbia kunakotajwa baadaye.
- source_word: בֵּן אֶחָד
  choice: mwana mmoja
  rationale: Huhifadhi maana halisi ya uhusiano wa kifamilia na mkazo kwamba mwana mmoja tu ndiye aliyep逃uka.
- source_word: לַאֲחִימֶלֶךְ בֶּן אֲחִיטוּב
  choice: wa Ahimeleki mwana wa Ahitubu
  rationale: Kiambishi ל hapa kinaonyesha uhusiano; Kiswahili “wa” kinaeleza kwa kawaida kwamba alikuwa mwana wa Ahimeleki, huku nasaba ya Ahimeleki ikihifadhiwa.
- source_word: וּשְׁמוֹ אֶבְיָתָר
  choice: Jina lake lilikuwa Abiathari
  rationale: Ni usemi wa moja kwa moja na wa kawaida wa kumtambulisha mtu kwa jina.
- source_word: וַיִּבְרַח
  choice: akakimbia
  rationale: Huhifadhi maana ya ברח, “kukimbia,” na pia tofauti yake na tendo la awali la kuponyoka.
- source_word: אַחֲרֵי דָוִד
  choice: akimfuata Daudi
  rationale: “Akimfuata” huhifadhi wazo la kwenda nyuma au baada ya Daudi bila kulifafanua kabisa kuwa ni kwenda kwake; katika muktadha linaweza kumaanisha kwenda kujiunga naye.
- source_word: אֶבְיָתָר
  choice: Abiathari
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: אֲחִימֶלֶךְ
  choice: Ahimeleki
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: אֲחִיטוּב
  choice: Ahitubu
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: וַ
  choice: Lakini
  rationale: 'Kiunganishi cha mwanzo kinaunganisha mstari huu na mauaji yaliyotangulia huku kikionyesha utofauti: licha ya mauaji hayo, mwana mmoja aliponyoka.'
