base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/007.yaml
  text: Then Saul said to his servants who were standing around him, “Listen, please, sons of Benjamin! Will the son of Jesse also give all of you fields and vineyards? Will he make all of you commanders of thousands and commanders of hundreds?”
translation:
  language: sw
  text: Ndipo Sauli akawaambia watumishi wake waliokuwa wamesimama kumzunguka, “Tafadhali sikilizeni, enyi wana wa Benyamini! Je, mwana wa Yese atawapa ninyi nyote mashamba na mashamba ya mizabibu? Je, atawaweka ninyi nyote kuwa majemadari wa maelfu na majemadari wa mamia?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנִּצָּבִים עָלָיו
  choice: waliokuwa wamesimama kumzunguka
  rationale: Kirai hiki kinawaonyesha watumishi wakiwa wamesimama karibu na Sauli katika nafasi ya kumhudumia; ‘kumzunguka’ ni Kiswahili cha kawaida kinachowasilisha mazingira hayo bila kuongeza wazo la uadui.
- source_word: שִׁמְעוּ נָא
  choice: Tafadhali sikilizeni
  rationale: נָא ni chembe ya kusihi au kusisitiza kwa upole; ‘tafadhali’ huihifadhi badala ya kuibadili kuwa ‘sasa.’
- source_word: בְּנֵי יְמִינִי
  choice: wana wa Benyamini
  rationale: Tafsiri ya karibu ya muundo wa Kiebrania, inayosisitiza utambulisho wao wa kikabila na kudumisha usemi wa Sauli.
- source_word: שָׂדוֹת וּכְרָמִים
  choice: mashamba na mashamba ya mizabibu
  rationale: ‘Mashamba ya mizabibu’ hutoa maana mahususi ya כְּרָמִים kwa lugha inayoeleweka wazi.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי מֵאוֹת
  choice: majemadari wa maelfu na majemadari wa mamia
  rationale: Vyeo hivi ni vya uongozi wa kijeshi juu ya vikosi vilivyohesabiwa kwa maelfu na mamia; ‘majemadari’ ni neno la kawaida na lenye hadhi kwa muktadha huo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maswali ya balagha ya Sauli yamehifadhiwa kama maswali, na marudio ya ‘ninyi nyote’ yamedumishwa ili kuonyesha msisitizo wa maandishi ya Kiebrania.
