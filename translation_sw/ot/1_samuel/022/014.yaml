  text: וַ/יַּ֧עַן אֲחִימֶ֛לֶךְ אֶת הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר וּ/מִ֤י בְ/כָל עֲבָדֶ֨י/ךָ֙ כְּ/דָוִ֣ד נֶאֱמָ֔ן וַ/חֲתַ֥ן הַ/מֶּ֛לֶךְ וְ/סָ֥ר אֶל מִשְׁמַעְתֶּ֖/ךָ וְ/נִכְבָּ֥ד בְּ/בֵיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/014.yaml
  text: Ahimelech answered the king and said[a], “And who among all your servants is as faithful as David, the king’s son-in-law, who has access to your council[b], and is honored in your house?”
translation:
  language: sw
  text: Ahimeleki akamjibu mfalme, akasema, “Ni nani kati ya watumishi wako wote aliye mwaminifu kama Daudi, mume wa binti ya mfalme, aliye tayari kutii amri yako[a], na anayeheshimiwa katika nyumba yako[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya karibu zaidi, “anayeelekea kwenye agizo lako”; yaani, aliye tayari kuitikia au kutii unapoamuru.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba yako” hapa inaweza kumaanisha watu wa nyumba ya mfalme au jumba lake la kifalme.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן אֲחִימֶלֶךְ אֶת־הַמֶּלֶךְ וַיֹּאמַר
  choice: Ahimeleki akamjibu mfalme, akasema
  rationale: Muundo huu unafuata mtiririko wa simulizi la Kiebrania na kutofautisha ‘akamjibu’ na ‘akasema’ bila kufanya Kiswahili kuwa kizito.
- source_word: וּמִי בְכָל־עֲבָדֶיךָ
  choice: Ni nani kati ya watumishi wako wote
  rationale: ‘Kati ya’ huwasilisha vizuri matumizi ya kigawanyo katika Kiebrania; ‘watumishi’ haibainishi cheo ambacho maandishi hayajabainisha.
- source_word: נֶאֱמָן
  choice: mwaminifu
  rationale: Neno hili linajumuisha uaminifu, kutegemeka, na ushikamanifu wa Daudi kwa mfalme katika muktadha huu.
- source_word: וַחֲתַן הַמֶּלֶךְ
  choice: mume wa binti ya mfalme
  rationale: ‘Mkwe’ katika Kiswahili inaweza kumaanisha mahusiano mbalimbali; usemi huu unaweka wazi kwamba Daudi ni mwanaume aliyemwoa binti ya mfalme.
- source_word: וְסָר אֶל־מִשְׁמַעְתֶּךָ
  choice: aliye tayari kutii amri yako
  rationale: Kirai cha Kiebrania kina wazo la kumgeukia au kuitikia mamlaka ya mfalme. Tafsiri hii ni ya kawaida kwa Kiswahili huku tanbihi ikihifadhi taswira halisi na uwezekano wa maana.
- source_word: וְנִכְבָּד בְּבֵיתֶךָ
  choice: anayeheshimiwa katika nyumba yako
  rationale: ‘Anayeheshimiwa’ huhifadhi maana ya hadhi, na ‘katika nyumba yako’ huhifadhi taswira ya Kiebrania bila kuamua kimya kimya kama inamaanisha jamaa wa nyumbani au ikulu.
theological_decisions:
- issue: Maana ya וְסָר אֶל־מִשְׁמַעְתֶּךָ
  choice: aliye tayari kutii amri yako
  alternative: anayepata nafasi katika baraza lako
  rationale: Kiebrania kinaelekea zaidi kwenye kuitikia, kusikia, au kutii mamlaka ya mfalme kuliko kwenye wazo mahususi la kuingia katika baraza lake. Kwa hiyo maana ya utii imewekwa katika matini, huku kutokuwa na uhakika wa nahau hiyo kukielezwa katika tanbihi.
- issue: Maana ya ‘nyumba’ ya mfalme
  choice: katika nyumba yako
  alternative: katika jumba lako la kifalme / miongoni mwa watu wa nyumba yako
  rationale: Neno בַּיִת linaweza kumaanisha nyumba, watu wa nyumba, au makao ya kifalme. Tafsiri haifungi maana kwenye chaguo moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Swali la balagha limehifadhiwa, pamoja na sifa zote za Daudi. Jina ‘Ahimeleki’ limeandikwa kwa namna inayosomeka kwa kawaida katika Kiswahili.
