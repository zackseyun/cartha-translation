base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/004.yaml
  text: He brought them before the king of Moab[a], and they stayed with him all the days that David was in the stronghold.
translation:
  language: sw
  text: Akawapeleka mbele ya mfalme wa Moabu[a], nao wakakaa kwake muda wote ambao Daudi alikuwa katika ngome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Akawaongoza mbele ya mfalme wa Moabu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwaongoza au kuwapeleka mbele ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Akawapeleka
  rationale: Katika muktadha huu, kitenzi hiki chenye kiambishi cha wingi kina maana ya kuwaongoza au kuwapeleka wazazi wa Daudi mbele ya mfalme. ‘Akawapeleka’ ni Kiswahili cha kawaida na huhifadhi wazo la kuwafikisha huko bila kulazimisha maana finyu.
- source_word: אֶת־פְּנֵי
  choice: mbele ya
  rationale: Hii ni nahau ya Kiebrania yenye maana ya kuingia au kuletwa mbele ya mtu; ‘mbele ya’ ni tafsiri fupi na ya asili katika Kiswahili.
- source_word: מֶלֶךְ מוֹאָב
  choice: mfalme wa Moabu
  rationale: 'Ni muundo wa kawaida wa umilikaji: cheo kinafuatwa na jina la nchi.'
- source_word: וַיֵּשְׁבוּ עִמּוֹ
  choice: nao wakakaa kwake
  rationale: ישב hapa inaeleza kukaa au kuishi kwa kipindi fulani. ‘Wakakaa kwake’ inaonyesha kuwa waliendelea kuishi chini ya uangalizi au katika makao ya mfalme, bila kuongeza maelezo yasiyomo.
- source_word: כָּל יְמֵי
  choice: muda wote ambao
  rationale: Usemi huu unaonyesha kipindi chote kilichotajwa katika kishazi kinachofuata. ‘Muda wote ambao’ ni wa kawaida zaidi katika Kiswahili cha sasa kuliko tafsiri ya neno kwa neno ‘siku zote ambazo.’
- source_word: הֱיוֹת דָּוִד
  choice: Daudi alikuwa
  rationale: Jina-kitenzi la היה pamoja na kiima chake linafanya kazi ya kueleza wakati; kishazi ‘Daudi alikuwa’ ni sahihi na cha asili.
- source_word: בַּמְּצוּדָה
  choice: katika ngome
  rationale: מְצוּדָה humaanisha mahali penye ulinzi au ngome iliyotumiwa kama kimbilio. ‘Ngome’ huhifadhi maana ya mahali palipoimarishwa na inafaa katika simulizi la Daudi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi unaoeleweka kwa wasomaji wa kawaida na hadhi inayofaa kwa maandiko. Kiunganishi ‘nao’ kinaendeleza simulizi na kuweka wazi kuwa wazazi wa Daudi ndio waliokaa kwa mfalme.
