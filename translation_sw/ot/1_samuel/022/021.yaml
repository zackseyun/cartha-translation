  text: Abiathari akamwambia Daudi kwamba Sauli alikuwa amewaua makuhani wa Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: akamwambia
  rationale: Hifili ya נגד hapa ina maana ya kumjulisha au kumweleza mtu jambo. “Akamwambia” ni ya kawaida na inaonyesha Daudi kama mpokeaji wa taarifa.
- source_word: אֶבְיָתָר
  choice: Abiathari
  rationale: Jina la mtu limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: לְדָוִד
  choice: Daudi
  rationale: Kiambishi לְ kinaonyesha mpokeaji wa taarifa; katika Kiswahili uhusiano huo unaonyeshwa na muundo wa kitenzi “akamwambia Daudi.”
- source_word: כִּי
  choice: kwamba
  rationale: Hapa כִּי kinaanzisha maudhui ya taarifa ya Abiathari.
- source_word: הָרַג
  choice: alikuwa amewaua
  rationale: Kitendo cha kuua kilitangulia kitendo cha Abiathari kumwambia Daudi. Muundo huu wa Kiswahili unaonyesha wazi mfuatano huo; wingi wa yambwa “makuhani” unaonyeshwa na “-wa-”.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: כֹּהֲנֵי יְהוָה
  choice: makuhani wa Yahweh
  rationale: Muundo wa uamilifu wa Kiebrania umehifadhiwa kwa Kiswahili cha kawaida, ukionyesha makuhani waliohusishwa na huduma ya Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetolewa kwa unukuzi badala ya kubadilishwa kuwa cheo, kwa kufuata ushahidi wa maandishi ya Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina maalumu la Mungu, si cheo. “Yahweh” hulihifadhi kama jina na huepuka kulibadilisha kimyakimya kuwa “BWANA.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akamwambia” ni cha kawaida na fasaha katika simulizi; “alikuwa amewaua” huweka wazi kuwa mauaji yalikuwa yametokea kabla ya taarifa kutolewa.
