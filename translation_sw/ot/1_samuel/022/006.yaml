base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/006.yaml
  text: Saul heard that David and the men who were with him had become known[a]. Now Saul was sitting at Gibeah, under the tamarisk tree on the height, with his spear in his hand[b], and all his servants were standing around him.
translation:
  language: sw
  text: Sauli akasikia kwamba Daudi na watu waliokuwa pamoja naye walikuwa wamegunduliwa.[a] Wakati huo Sauli alikuwa ameketi huko Gibea, chini ya mti wa tamariski mahali palipoinuka,[b] akiwa ameshika mkuki wake mkononi, na watumishi wake wote walikuwa wamesimama kumzunguka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wamejulikana.” Kitenzi cha Kiebrania kinaweza kumaanisha kwamba mahali Daudi na watu wake walipokuwa palikuwa pamejulikana.
    reason: lexical_alternative
  - marker: b
    text: Au huenda, “chini ya mti wa tamariski huko Rama,” ikiwa בָּרָמָה linasomwa kama jina la mahali, Rama, badala ya kumaanisha mahali palipoinuka.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: akasikia
  rationale: Huhifadhi maana ya msingi ya kupokea habari na mtindo wa masimulizi ya Kiebrania.
- source_word: כִּי נוֹדַע דָּוִד
  choice: kwamba Daudi ... walikuwa wamegunduliwa
  rationale: Nifali ya ידע inaweza kumaanisha kujulikana au kugunduliwa. Katika muktadha huu habari iliyomfikia Sauli ni kwamba Daudi na mahali alikokuwa pamoja na watu wake hawakuwa siri tena; tanbihi huhifadhi maana mbadala.
- source_word: וַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: na watu waliokuwa pamoja naye
  rationale: Ni tafsiri ya kawaida na wazi ya kundi lililoandamana na Daudi; katika muktadha hawa ni wanaume, lakini 'watu' ni Kiswahili cha asili kwa kundi hilo.
- source_word: יוֹשֵׁב
  choice: alikuwa ameketi
  rationale: Hali ya kushiriki inaweka mandhari endelevu ya Sauli akiwa katika kikao, si tendo la ghafula tu.
- source_word: בַּגִּבְעָה
  choice: huko Gibea
  rationale: Hutambua jina la mahali na kutoa usemi wa kawaida wa Kiswahili bila kudokeza kwamba alikuwa ndani ya jengo.
- source_word: תַּחַת הָאֶשֶׁל
  choice: chini ya mkwaju
  rationale: אשל hutambuliwa kwa kawaida kuwa tamarisk; 'mkwaju' ni jina linalotumika katika tafsiri za Kiswahili kwa mti huu, ingawa utambulisho wa kisayansi si sawa kabisa katika matumizi ya kawaida.
- source_word: בָּרָמָה
  choice: uliokuwa juu ya kilima
  rationale: Kihusishi pamoja na umbo lenye kiambishi hubeba vizuri maana ya mahali palipoinuka. Tanbihi huhifadhi uwezekano wa kulisoma kama jina Ramah.
- source_word: וַחֲנִיתוֹ בְיָדוֹ
  choice: akiwa ameshika mkuki wake mkononi
  rationale: Hutoa kwa Kiswahili cha kawaida taswira ya kishazi kisicho na kitenzi, bila kupoteza mkuki uliokuwa mkononi mwa Sauli.
- source_word: וְכָל עֲבָדָיו
  choice: na watumishi wake wote
  rationale: עבדים katika mazingira ya kifalme inaweza kumaanisha watumishi, wahudumu, au maofisa; 'watumishi' ni pana na haibani cheo chao.
- source_word: נִצָּבִים עָלָיו
  choice: walikuwa wamesimama kumzunguka
  rationale: Hueleza wahudumu waliokuwa wamesimama mbele na kandokando ya Sauli katika mandhari ya kifalme.
