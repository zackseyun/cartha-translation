  text: וַ/יֹּ֣אמֶר הַ/מֶּ֡לֶךְ לָ/רָצִים֩ הַ/נִּצָּבִ֨ים עָלָ֜י/ו סֹ֥בּוּ וְ/הָמִ֣יתוּ כֹּהֲנֵ֣י יְהוָ֗ה כִּ֤י גַם יָדָ/ם֙ עִם דָּוִ֔ד וְ/כִ֤י יָֽדְעוּ֙ כִּֽי בֹרֵ֣חַ ה֔וּא וְ/לֹ֥א גָל֖וּ אֶת אזנ/ו וְ/לֹֽא אָב֞וּ עַבְדֵ֤י הַ/מֶּ֨לֶךְ֙ לִ/שְׁלֹ֣חַ אֶת יָדָ֔/ם לִ/פְגֹ֖עַ בְּ/כֹהֲנֵ֥י יְהוָֽה׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/017.yaml
  text: Then the king said to the runners who were standing around him[a], “Turn and kill the priests of Yahweh, because their hand also is with David[b], and because they knew that he was fleeing and did not disclose it to me.” But the king’s servants were not willing to put out their hand to strike the priests of Yahweh.
translation:
  language: sw
  text: Kisha mfalme akawaambia wakimbiaji[a] waliokuwa wamesimama karibu naye, “Geukeni, mwaueni makuhani wa Yahwe, kwa sababu mkono wao pia uko pamoja na Daudi[b], na kwa sababu walijua kwamba alikuwa akitoroka wala hawakunijulisha[c].” Lakini watumishi wa mfalme hawakuwa tayari kuwanyooshea mikono yao ili kuwapiga makuhani wa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wakimbiaji.” Katika mazingira ya kifalme, neno hili linaweza kumaanisha pia walinzi au wajumbe wa mfalme.'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mkono wao pia uko pamoja na Daudi,” yaani, wako upande wake au wanamsaidia.'
    reason: idiom
  - marker: c
    text: 'Kiebrania: “hawakufunua sikio langu,” yaani, hawakunipa habari.'
    reason: idiom
lexical_decisions:
- source_word: לָרָצִים
  choice: walinzi
  rationale: Neno hili humaanisha kihalisi ‘wakimbiaji,’ lakini katika mazingira ya kifalme linaweza kutaja maafisa waliomhudumia na kumlinda mfalme. ‘Walinzi’ linaeleweka kwa urahisi katika Kiswahili cha sasa; maana halisi imehifadhiwa katika tanbihi.
- source_word: הַנִּצָּבִים עָלָיו
  choice: waliokuwa wamesimama kumzunguka
  rationale: Kirai hiki kinaonyesha watu waliokuwa wamesimama karibu na mfalme wakimhudumia; tafsiri hii pia inahifadhi taswira ya mahali waliposimama.
- source_word: סֹבּוּ וְהָמִיתוּ
  choice: Geukeni mkawaue
  rationale: Amri hizi mbili ni za moja kwa moja na zenye ukali. ‘Mkawaue’ huepuka kuongeza wazo la hukumu halali ambalo neno ‘waueni’ halilazimishi.
- source_word: כִּי גַם יָדָם עִם דָּוִד
  choice: kwa maana wao pia wanamuunga mkono Daudi
  rationale: Nahau ya Kiebrania inayosema mkono wao uko pamoja na Daudi humaanisha kwamba wako upande wake au wanamsaidia. Tafsiri ya maana ni ya kawaida na wazi katika Kiswahili.
- source_word: וְכִי יָדְעוּ כִּי בֹרֵחַ הוּא
  choice: Walijua kwamba alikuwa anakimbia
  rationale: Neno בֹרֵחַ ni umbo endelevu linalomwonyesha Daudi akiwa katika hali ya kukimbia, bila kulazimisha kwamba tendo hilo lilikuwa limekamilika.
- source_word: וְלֹא גָלוּ אֶת־אָזְנוֹ
  choice: lakini hawakunijulisha
  rationale: Kihalisi ni ‘hawakufunua sikio lake,’ nahau yenye maana ya kutompa mtu habari. Nafsi ya kwanza inafaa kwa sababu mfalme ndiye anayesema.
- source_word: וְלֹא אָבוּ עַבְדֵי הַמֶּלֶךְ
  choice: Hata hivyo, watumishi wa mfalme hawakukubali
  rationale: אבה huhusu kukubali au kuwa tayari. ‘Hawakukubali’ linaonyesha kukataa kwao kutekeleza amri bila kuongeza sababu ambayo haijatajwa.
- source_word: לִשְׁלֹחַ אֶת־יָדָם לִפְגֹעַ
  choice: kuwanyooshea mkono na kuwashambulia
  rationale: Tafsiri hii inadumisha taswira ya kunyoosha mkono na kuonyesha wazi kwamba kusudi lake hapa ni shambulio la kikatili.
- source_word: כֹּהֲנֵי יְהוָה
  choice: makuhani wa Yahwe
  rationale: Kirai cha umilikaji kimetafsiriwa moja kwa moja, na jina la agano יְהוָה limeandikwa ‘Yahwe.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu lenye konsonanti YHWH. ‘Yahwe’ hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Kauli ya Sauli kuhusu makuhani kuwa pamoja na Daudi
  choice: wanamuunga mkono Daudi
  alternative: mkono wao pia uko pamoja na Daudi
  rationale: Kauli hii imewasilishwa kama madai ya Sauli, bila kuthibitisha kwamba tuhuma zake zilikuwa za haki au kwamba makuhani walikuwa na hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa heshima, na wa sasa. Amri ya Sauli imebaki kali na ya moja kwa moja. Nahau zisizoeleweka kwa urahisi zimetafsiriwa kwa maana yake huku taswira ya Kiebrania ikihifadhiwa katika tanbihi.
