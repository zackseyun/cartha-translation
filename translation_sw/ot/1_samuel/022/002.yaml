base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/002.yaml
  text: And everyone in distress[a], everyone who was in debt, and everyone bitter in soul gathered to him, and he became commander over them[b]. About four hundred men were with him.
translation:
  language: sw
  text: Watu wote waliokuwa katika taabu, wote waliokuwa na mdai[a], na wote waliokuwa na uchungu moyoni[b] wakakusanyika kwake. Naye akawa mkuu wao. Takriban wanaume mia nne walikuwa pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya maana, “waliokuwa na deni.” Kiebrania kinasema kwa karibu zaidi, “waliokuwa na mdai.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “wenye uchungu wa nafsi,” ni nahau inayomaanisha uchungu mkubwa au maumivu makali ya ndani.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ אֵלָיו
  choice: akakusanyika kwake
  rationale: Kitenzi kinaonyesha watu kuja pamoja kwa Daudi. Kiswahili hutumia umoja kwa upatanisho na mfululizo wa “kila mtu,” huku maana ya mkusanyiko wa watu wengi ikibaki wazi.
- source_word: כָּל אִישׁ מָצוֹק
  choice: kila mtu aliyekuwa katika taabu
  rationale: מָצוֹק huhusu dhiki, shinikizo, au hali ngumu. “Katika taabu” ni lugha ya kawaida na pana isiyobana aina ya shida.
- source_word: אֲשֶׁר לוֹ נֹשֶׁא
  choice: aliyekuwa na mdai
  rationale: Usemi wa Kiebrania unasema kwa karibu zaidi kwamba mtu huyo alikuwa na mdai au mtoza aliyemdai. Tafsiri hii inadumisha umbo la chanzo bila kuufanya moja kwa moja kuwa usemi wa jumla “mwenye deni.”
- source_word: מַר נֶפֶשׁ
  choice: aliyekuwa na uchungu moyoni
  rationale: Hii ni nahau ya uchungu mkubwa wa ndani. “Uchungu moyoni” ni Kiswahili cha asili na kinachoeleweka, huku tanbihi ikionyesha picha halisi ya Kiebrania ya “nafsi.”
- source_word: וַיְהִי עֲלֵיהֶם לְשָׂר
  choice: akawa mkuu wao
  rationale: שַׂר inaweza kumaanisha mkuu, kiongozi, au kamanda. “Mkuu wao” inafaa kwa kundi hili na haibani neno hilo kwenye cheo maalumu cha kijeshi.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: wanaume wapatao mia nne
  rationale: Kiambishi כ־ kinaonyesha makadirio, kwa hiyo “wapatao” linafaa. “Wanaume” limetumiwa kwa sababu hapa אִישׁ inahesabu wanaume waliokuwa katika kundi la Daudi.
