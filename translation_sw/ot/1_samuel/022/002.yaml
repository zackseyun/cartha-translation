  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya “kila mtu” yamehifadhiwa ili kuonyesha muundo wa Kiebrania. “Mkuu” limechaguliwa badala ya cheo mahususi zaidi cha kijeshi ili kuhifadhi upana wa שַׂר.
