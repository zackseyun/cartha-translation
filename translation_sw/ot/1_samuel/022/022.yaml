base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/022.yaml
  text: David said to Abiathar[a], “I knew on that day, when Doeg the Edomite was there, that he would surely tell Saul[c][b]. I am responsible for all the lives of your father’s house.”
translation:
  language: sw
  text: Daudi akamwambia Abiathari, “Nilijua siku ile kwamba Doegi Mwedomi alikuwa huko,[a] na kwamba bila shaka angemwambia Sauli.[b] Mimi ndiye niliyesababisha kifo cha kila mtu wa nyumba ya baba yako.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nilijua siku ile, Doegi Mwedomi alipokuwa huko.” Kiunganishi cha Kiebrania kinaweza kueleweka kwa maana ya wakati badala ya kutambulisha jambo alilolijua Daudi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania hutumia infinitivu absoluta pamoja na kitenzi chenye ukomo—kihalisi, “akisema, angesema”—ili kusisitiza kwamba bila shaka angemwambia Sauli.
    reason: lexical_alternative
  - marker: c
    text: Au, “Ninawajibika kwa maisha ya kila mtu wa nyumba ya baba yako,” au “Mimi ndiye sababu ya kifo cha kila mtu wa nyumba ya baba yako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Nilijua
  rationale: Kitenzi hiki katika kauli timilifu kinaeleza ujuzi wa Daudi wa wakati uliopita; ‘nilijua’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: בַּיּוֹם הַהוּא
  choice: siku ile
  rationale: Huhifadhi rejeo la siku mahususi iliyopita kwa Kiswahili cha kawaida.
- source_word: כִּי שָׁם דויג הָאֲדֹמִי
  choice: Doegi Mwedomu alipokuwa huko
  rationale: Huwasilisha kwa ufasaha hali ya wakati iliyomfanya Daudi atambue kitakachotokea, huku tanbihi ikihifadhi uwezekano wa kusoma kiunganishi kama kikitambulisha jambo alilolijua.
- source_word: כִּי הַגֵּד יַגִּיד לְשָׁאוּל
  choice: kwamba bila shaka angemwambia Sauli
  rationale: ‘Bila shaka’ huwakilisha msisitizo wa kitenzi-jina kisicho na kikomo pamoja na kitenzi chenye ukomo, bila kuongeza yambwa lisilokuwamo wazi katika Kiebrania.
- source_word: אָנֹכִי
  choice: Mimi ndiye
  rationale: Muundo huu huhifadhi msisitizo wa kiwakilishi huru cha nafsi ya kwanza.
- source_word: סַבֹּתִי
  choice: niliyesababisha vifo vya
  rationale: Katika muktadha wa mauaji yaliyotangulia, kitenzi kinakiri kwamba Daudi alikuwa chanzo cha matokeo hayo; tafsiri hii ni wazi na ya kawaida, huku tanbihi ikihifadhi usemi mpana zaidi wa kuwajibika.
- source_word: בְּכָל נֶפֶשׁ
  choice: watu wote
  rationale: Neno נֶפֶשׁ hapa linamaanisha maisha au watu mmoja mmoja, si ‘roho’ kwa maana ya sehemu isiyo ya mwili.
- source_word: בֵּית אָבִיךָ
  choice: jamaa ya baba yako
  rationale: Hutoa maana ya nyumba ya kifamilia au ukoo kwa Kiswahili cha sasa, bila kupendekeza jengo halisi.
theological_decisions:
- issue: Kiwango cha kukiri kwa Daudi katika אָנֹכִי סַבֹּתִי
  choice: Mimi ndiye niliyesababisha vifo vya watu wote
  alternative: Ninawajibika kwa maisha ya watu wote
  rationale: Muktadha unaunga mkono kukiri kusababisha matokeo ya kifo, lakini Kiebrania kinaweza pia kueleweka kwa upana kama kukubali wajibu; tanbihi inaacha uwezekano huo wazi bila kupunguza uzito wa kauli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi wa Biblia ulio wa heshima lakini unaoeleweka kwa wasomaji wa sasa. ‘Mwedomu’ limetumiwa kama jina la utaifa, na ‘jamaa ya baba yako’ linaeleza nyumba ya kifamilia badala ya jengo.
