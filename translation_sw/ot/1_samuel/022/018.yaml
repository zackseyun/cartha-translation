  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ ל/דויג סֹ֣ב אַתָּ֔ה וּ/פְגַ֖ע בַּ/כֹּהֲנִ֑ים וַ/יִּסֹּ֞ב דויג הָ/אֲדֹמִ֗י וַ/יִּפְגַּע הוּא֙ בַּ/כֹּ֣הֲנִ֔ים וַ/יָּ֣מֶת בַּ/יּ֣וֹם הַ/ה֗וּא שְׁמֹנִ֤ים וַ/חֲמִשָּׁה֙ אִ֔ישׁ נֹשֵׂ֖א אֵפ֥וֹד בָּֽד־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/018.yaml
  text: Then the king said to Doeg[a], “Turn and strike down the priests.” So Doeg the Edomite turned and struck down the priests, and on that day he put to death eighty-five men who wore a linen ephod.
translation:
  language: sw
  text: Kisha mfalme akamwambia Doegi, “Geuka, uwashambulie makuhani.”[a] Basi Doegi Mwedomu akageuka, akawashambulia makuhani. Siku hiyo akawaua wanaume themanini na watano waliovaa efodi ya kitani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwapige makuhani” au “uwaangukie makuhani.” Kitenzi cha Kiebrania kinaweza kueleza shambulio la ukatili kwa maana pana; “uwashambulie” limetumiwa hapa ili lisitangulize matokeo yanayotajwa baadaye kwamba aliwaua wanaume themanini na watano.
    reason: lexical_alternative
lexical_decisions:
- source_word: סֹב
  choice: Geuka
  rationale: Amri hii inaelekeza Doegi kugeukia kazi au walengwa; “geuka” ni ya moja kwa moja na inadumisha ukali wa amri.
- source_word: וּפְגַע / וַיִּפְגַּע
  choice: uwashambulie / akawashambulia
  rationale: Kitenzi פגע kinaweza kumaanisha kukutana, kuangukia, kushambulia, au kupiga. “Shambulia” kinaonyesha tendo la ukatili bila kukifanya sawa kabisa na kitenzi cha matokeo, “akawaua,” kinachofuata.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida na wazi la Kiswahili kwa wingi huu wenye hali ya uhusika dhahiri katika muktadha.
- source_word: הָאֲדֹמִי
  choice: Mwedomu
  rationale: Jina hili la kabila linamtambulisha Doegi kuwa mtu wa Edomu; limetafsiriwa kwa umbo la kawaida la Kiswahili.
- source_word: וַיָּמֶת
  choice: akawaua
  rationale: Umbo la Hifili ni la kusababisha kifo. “Akawaua” linaonyesha wazi kuwa Doegi ndiye aliyetenda na linatofautisha matokeo na tendo la awali la kuwashambulia.
- source_word: שְׁמֹנִים וַחֲמִשָּׁה אִישׁ
  choice: wanaume themanini na watano
  rationale: איש baada ya namba hapa inawahusu makuhani wa kiume; “wanaume” inadumisha taarifa hiyo badala ya kuitia katika neno lisiloonyesha jinsia.
- source_word: נֹשֵׂא אֵפוֹד בָּד
  choice: waliovaa efodi ya kitani
  rationale: נשא inaweza kumaanisha kubeba au kuvaa. Kwa kuwa efodi ni vazi la kikuhani, “waliovaa” ni Kiswahili cha kawaida; בָּד imetafsiriwa “kitani.”
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Kisha mfalme akamwambia
  rationale: Mfuatano wa simulizi unaendelezwa kwa “Kisha,” huku kiambishi cha yambwa katika “akamwambia” kikimtambulisha Doegi kwa njia ya kawaida ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa, na wenye heshima. “Doegi,” “Mwedomu,” na “efodi” yanafuata maumbo yanayoeleweka katika matumizi ya Biblia ya Kiswahili. Marudio ya kitenzi “shambulia” yamedumishwa kwa sababu yapo katika chanzo cha Kiebrania.
