base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/003.yaml
  text: But his sons did not walk in his ways[a]; they turned aside after dishonest gain, took bribes[b], and perverted justice.
translation:
  language: sw
  text: Lakini wanawe hawakufuata njia yake; waligeukia faida isiyo ya haki[a], wakapokea rushwa, na wakapotosha haki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “faida ya udhalimu” au “tamaa ya faida.” Neno la Kiebrania humaanisha faida inayotafutwa kwa njia ovu au za unyonyaji.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “wakapindisha hukumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלְכוּ ... בִדְרָכוֹ
  choice: hawakufuata njia yake
  rationale: Nahau ya Kiebrania ya ‘kutembea katika njia’ inaeleza mwenendo au namna ya kuishi. ‘Kufuata njia yake’ inadumisha sitiari hiyo kwa Kiswahili cha kawaida na inaonyesha kuwa wanawe hawakuufuata mwenendo wa baba yao.
- source_word: וַיִּטּוּ
  choice: waligeukia
  rationale: Kitenzi נטה hapa kinaonyesha kuacha mwelekeo ulio sawa na kuelekea jambo jingine. ‘Waligeukia’ huunganika kwa kawaida na kitu walichokifuata, yaani faida isiyo ya haki.
- source_word: אַחֲרֵי הַבָּצַע
  choice: faida isiyo ya haki
  rationale: בצע katika muktadha huu ni faida inayotafutwa kwa njia ovu, dhalimu, au za unyonyaji. Tafsiri hii huhifadhi maana ya faida yenyewe pamoja na ubaya wa namna inavyopatikana, bila kuipunguza kuwa hisia ya ndani ya tamaa tu.
- source_word: וַיִּקְחוּ שֹׁחַד
  choice: wakapokea rushwa
  rationale: שֹׁחַד ni rushwa, hasa katika mazingira ya utoaji wa hukumu. ‘Kupokea rushwa’ ni usemi wa kawaida na sahihi katika Kiswahili cha sasa.
- source_word: וַיַּטּוּ מִשְׁפָּט
  choice: wakapotosha haki
  rationale: Nahau hii ina maana ya kupinda au kugeuza uamuzi wa kisheria usiwe wa haki. ‘Kupotosha haki’ ni ya asili katika Kiswahili na huhifadhi uzito wa kosa la kimahakama.
- source_word: בָּנָיו
  choice: wanawe
  rationale: Neno la Kiebrania linawataja wana wa kiume wa Samueli; ‘wanawe’ ni fupi, sahihi, na la kawaida katika muktadha huu.
theological_decisions:
- issue: Maelezo ya kimaadili na kisheria kuhusu wana wa Samueli
  choice: 'Kudumisha msururu wa maneno mahususi kuhusu ufisadi wa kimahakama: faida isiyo ya haki, rushwa, na kupotosha haki.'
  alternative: Kutumia maelezo ya jumla kama ‘walikuwa wenye tamaa’ au ‘walitenda vibaya.’
  rationale: Kiebrania hakitoi tu hukumu ya jumla kuhusu tabia zao, bali kinataja vitendo mahsusi vya ufisadi katika utoaji wa haki. Tafsiri haipunguzi uzito huo wa kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida, huku sitiari ya ‘njia’ na msamiati mahususi wa ufisadi wa kimahakama vikihifadhiwa. Alama za tanbihi zimewekwa baada ya vifungu vinavyofafanuliwa.
