base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/018.yaml
  text: And in that day you will cry out because of your king, whom you have chosen for yourselves, but Yahweh will not answer you in that day.
translation:
  language: sw
  text: Siku hiyo mtalia kwa sauti kwa sababu ya mfalme wenu mliyejichagulia, lakini Yahweh hatawajibu siku hiyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּזְעַקְתֶּם
  choice: mtalia kwa sauti
  rationale: Kitenzi זעק kinaonyesha kilio kikali cha dhiki au kuomba msaada. ‘Mtalia kwa sauti’ linaonyesha uzito wa kilio bila kutaja moja kwa moja anayeliliwa.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Hii ni tafsiri ya kawaida na ya asili ya usemi wa wakati; kurudiwa kwake mwishoni mwa mstari kumehifadhiwa.
- source_word: מִלִּפְנֵי
  choice: kwa sababu ya
  rationale: 'Ingawa maana ya msingi ni ‘kutoka mbele ya/uweponi mwa,’ katika muktadha huu kihusishi kinaonyesha sababu ya kilio: mfalme wao.'
- source_word: מַלְכְּכֶם
  choice: mfalme wenu
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kiambishi cha umilikaji.
- source_word: אֲשֶׁר בְּחַרְתֶּם לָכֶם
  choice: mliyejichagulia
  rationale: Muundo huu wa Kiswahili unahifadhi wazo la kwamba watu wenyewe walimchagua mfalme kwa manufaa yao, na hivyo unasisitiza wajibu wao.
- source_word: וְלֹא יַעֲנֶה
  choice: lakini ... hatawajibu
  rationale: ‘Lakini’ linaonyesha kwa kawaida tofauti kati ya kilio chao na kutopata jibu, huku ‘hatawajibu’ likihifadhi maana ya kitenzi na yambwa wake.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo; ‘Yahwe’ ni tahajia ya kawaida ya Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni kama jina binafsi. ‘Yahwe’ huhifadhi jina hilo, ilhali ‘BWANA’ ni cheo mbadala.
translation_notes:
  register: Lugha ni ya sasa, yenye heshima, na inayoeleweka kwa urahisi katika Kiswahili Sanifu cha Afrika Mashariki. Kurudiwa kwa ‘siku hiyo’ kumehifadhiwa kwa ajili ya mkazo wa maandishi ya Kiebrania.
