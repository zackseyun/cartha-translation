  text: So Samuel spoke all the words of Yahweh to the people who were asking him for a king[a].
translation:
  language: sw
  text: Basi Samueli akawaambia watu waliokuwa wakimwomba awape mfalme[a] maneno yote ya Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokuwa wamemwomba awape mfalme.” Kishirikishi cha Kiebrania kinaweza kuonyesha tendo lililokuwa likiendelea au kuwatambulisha watu kuwa wale waliotoa ombi hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akawaambia
  rationale: Kitenzi cha Kiebrania kwa msingi ni ‘alisema’; katika muktadha huu ‘akawaambia’ huwasilisha kwa Kiswahili cha kawaida kitendo cha Samueli kuwaeleza watu ujumbe wote.
- source_word: אֵת כָּל דִּבְרֵי יְהוָה
  choice: maneno yote ya Yahweh
  rationale: Muundo huu unahifadhi msisitizo wa כָּל, yaani ujumbe wote, na usemi wa kibiblia ‘maneno ya Yahweh’ bila kuufupisha kuwa maelezo ya jumla.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi ‘Yahweh,’ si kwa cheo mbadala.
- source_word: אֶל הָעָם
  choice: watu
  rationale: Kiebrania kinasema tu ‘watu’; kiambishi cha mtendewa katika ‘akawaambia’ kinawasilisha kwa ufasaha maana ya אֶל katika Kiswahili.
- source_word: הַשֹּׁאֲלִים מֵאִתּוֹ מֶלֶךְ
  choice: waliokuwa wakimwomba mfalme
  rationale: Kirai hiki kinahifadhi hali endelevu au sifa ya kundi inayoletwa na kitenzi-jina cha Kiebrania. ‘Kumwomba mfalme’ ni Kiswahili cha kawaida kwa kueleza kwamba walitaka Samueli awape mfalme.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יְהוָה; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Hali ya ombi la watu katika הַשֹּׁאֲלִים
  choice: waliokuwa wakimwomba
  alternative: waliokuwa wamemwomba
  rationale: Kitenzi-jina cha Kiebrania kinaweza kuonyesha tendo lililokuwa likiendelea au kuwatambulisha watu kwa ombi walilotoa. Tafsiri kuu inadumisha hali endelevu, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya maandiko. ‘Basi’ huendeleza simulizi, na ‘akawaambia’ huepuka ugumu wa usemi wa neno kwa neno huku ikihifadhi kitendo cha kuwasilisha ujumbe.
