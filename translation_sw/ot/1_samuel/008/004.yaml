  text: Ndipo wazee wote wa Israeli wakakusanyika pamoja, wakamwendea Samueli huko Rama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kuelekea Rama.” Tafsiri “huko Rama” inaeleza kwa Kiswahili cha kawaida kwamba Rama ndiko Samueli alikokuwa na ndiko walikokwenda.'
