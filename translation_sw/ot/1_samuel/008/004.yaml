lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: wakakusanyika pamoja
  rationale: Muundo wa hitpael wa קבץ unaonyesha kukusanyika kwa pamoja kama kundi; Kiswahili hiki ni cha kawaida na kinahifadhi maana hiyo ya pamoja.
- source_word: כֹּל
  choice: wote
  rationale: Neno hili linaonyesha kwamba kundi zima la wazee wawakilishi linahusika.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: wazee wa Israeli
  rationale: Hili ni jina la kawaida la viongozi wakuu wa kijamii na kisiasa wa Israeli, na tafsiri hii ni wazi na yenye hadhi.
- source_word: וַיָּבֹאוּ אֶל
  choice: wakamwendea
  rationale: בוא pamoja na אֶל hapa huonyesha kwenda mpaka kwa mtu; “wakamwendea” ni Kiswahili cha asili kinachowasilisha mwendo kuelekea kwa Samueli.
- source_word: שְׁמוּאֵל
  choice: Samueli
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: הָרָמָתָה
  choice: huko Rama
  rationale: Herufi ya mwelekeo ־ה inaonyesha kuelekea Rama. “Huko Rama” kwa kawaida humtambulisha Samueli kuwa mahali walikokwenda bila kupoteza wazo la mahali pa mwisho pa safari.
