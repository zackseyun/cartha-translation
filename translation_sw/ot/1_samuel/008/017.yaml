  text: He will take a tenth of your flocks[a], and you will become his servants.
translation:
  language: sw
  text: Atachukua sehemu ya kumi ya kondoo na mbuzi wenu, nanyi mtakuwa watumwa wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumishi wake.” Neno la Kiebrania linaweza kumaanisha watu walio katika utumishi, lakini hapa madai ya lazima ya mfalme na kupoteza uhuru yanaunga mkono tafsiri “watumwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹאנְכֶם
  choice: makundi yenu ya kondoo na mbuzi
  rationale: צֹאן hurejelea mifugo midogo kwa ujumla, hasa kondoo na mbuzi. Tafsiri hii inaepuka kuifanya iwe kondoo pekee au kuitanua ihusishe kila aina ya mifugo.
- source_word: יַעְשֹׂר
  choice: atachukua sehemu ya kumi
  rationale: Katika onyo hili kuhusu madai ya mfalme, kitenzi kina maana ya kuchukua moja ya kumi. Kauli hii ni wazi na haidokezi utoaji wa hiari au zaka ya kidini.
- source_word: וְאַתֶּם תִּהְיוּ לוֹ
  choice: nanyi mtakuwa ... wake
  rationale: Muundo huu unahifadhi hali itakayowapata watu chini ya mamlaka ya mfalme na unasikika kwa kawaida katika Kiswahili.
- source_word: לַעֲבָדִים
  choice: watumwa
  rationale: Katika muktadha wa madai ya lazima ya mfalme na kupoteza uhuru, 'watumwa' huwasilisha ukali wa עֲבָדִים vizuri kuliko 'watumishi,' ingawa neno la Kiebrania linaweza pia kumaanisha watumishi.
theological_decisions:
- issue: Maana ya עֲבָדִים katika muktadha wa kutiishwa na mfalme
  choice: watumwa
  alternative: watumishi
  rationale: Onyo linafikia kilele kwa watu kuwekwa chini ya mfalme kwa hali yenye shuruti. 'Watumwa' huhifadhi uzito wa onyo bila kuingiza maana ya kidhehebu, huku tanbihi ikihifadhi uwezekano mpana wa neno la Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. 'Makundi yenu ya kondoo na mbuzi' hutumiwa ili kuonyesha kwa usahihi mifugo midogo inayokusudiwa na צֹאן.
