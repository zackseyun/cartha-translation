base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/022.yaml
  text: And Yahweh said to Samuel[a], “Listen to their voice and make a king for them.” Then Samuel said to the men of Israel, “Go[b], each man to his city.”
translation:
  language: sw
  text: Yahweh akamwambia Samueli, “Sikiliza sauti yao[a], uwateulie mfalme.” Kisha Samueli akawaambia wanaume wa Israeli, “Nendeni, kila mtu katika mji wake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Watii” au “Kubali wanachosema.” Nahau ya Kiebrania “sikiliza sauti yao” inaweza kumaanisha kutenda kulingana na ombi lao.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: שְׁמַע בְּקוֹלָם
  choice: Sikiliza sauti yao
  rationale: Inahifadhi nahau ya Kiebrania, ambayo katika muktadha huu pia ina maana ya kukubali ombi lao.
- source_word: וְהִמְלַכְתָּ לָהֶם מֶלֶךְ
  choice: uwateulie mfalme
  rationale: Hifili ya מלך inaonyesha kumweka au kumteua mtu awe mfalme; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: wanaume wa Israeli
  rationale: Inahifadhi umbo la kiume lililo wazi katika matini ya Kiebrania.
- source_word: לְכוּ
  choice: Nendeni
  rationale: Ni amri ya wingi ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: אִישׁ לְעִירוֹ
  choice: kila mtu arudi katika mji wake
  rationale: אִישׁ imetumiwa kwa maana ya mgawanyo, ‘kila mmoja’; ‘arudi’ huonyesha kwa kawaida kusudi la kuwaaga waende makwao bila kubadili maana ya msingi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova; BWANA
  rationale: Matini ina jina la Mungu moja kwa moja; kulihifadhi kama Yahweh hutofautisha jina hilo na cheo.
- issue: Lugha ya kijinsia katika אַנְשֵׁי יִשְׂרָאֵל na אִישׁ
  choice: ‘wanaume wa Israeli’ katika utambulisho wa waliohutubiwa; ‘kila mtu’ katika kauli ya mgawanyo
  alternative: Waisraeli; watu wa Israeli; kila mwanamume
  rationale: ‘Wanaume wa Israeli’ huhifadhi umbo la kiume la kundi. Katika אִישׁ לְעִירוֹ, Kiswahili cha kawaida hutumia ‘kila mtu ... mji wake’ kwa mgawanyo wa kila mmoja; bado muktadha unarejelea wanaume waliotajwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau ‘sikiliza sauti yao’ imehifadhiwa kwa sababu inaeleweka, huku tanbihi ikifafanua maana yake ya kukubali ombi. ‘Uwateulie mfalme’ ni ya asili zaidi kuliko tafsiri halisi ‘uwafanyie mfalme’.
