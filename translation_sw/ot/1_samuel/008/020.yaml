base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/020.yaml
  text: so that we too may be like all the nations[b][a], and our king may judge us and go out before us and fight our battles.
translation:
  language: sw
  text: ili sisi pia tuwe kama mataifa yote[a], na mfalme wetu atuhukumu[b], aende mbele yetu, na apigane vita vyetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na sisi pia tutakuwa kama mataifa yote.” Umbo la Kiebrania linaweza kutafsiriwa kwa uhalisi zaidi kama mfuatano wa wakati ujao, ingawa hapa yaelekea linaonyesha kusudi la watu la kumwomba mfalme.
    reason: lexical_alternative
  - marker: b
    text: “Atuhukumu” pia inaweza kuwa na maana pana ya “atutawale” au “atuongoze.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִינוּ
  choice: ili ... tuwe
  rationale: Katika muktadha huu, umbo hilo linaendeleza kusudi la watu la kumwomba mfalme. Kiswahili cha kusudi, “ili ... tuwe,” ni cha kawaida na hakilazimishi maana ya wakati ujao tu.
- source_word: גַם אֲנַחְנוּ
  choice: sisi pia
  rationale: Huhifadhi msisitizo kwamba Israeli nao wanataka kufanana na mataifa mengine.
- source_word: כְּכָל הַגּוֹיִם
  choice: kama mataifa yote
  rationale: “Mataifa” hurejelea jamii nyingine zinazowazunguka Israeli, bila kuingiza maana ya baadaye ya kidini ya “Watu wa Mataifa.” Muundo huu pia huhifadhi mvutano wa Israeli kutaka kufanana na mataifa hayo.
- source_word: וּשְׁפָטָנוּ
  choice: atuhukumu
  rationale: Kitenzi kinaweza kumaanisha kuhukumu, kutawala, au kuendesha serikali. “Atuhukumu” huhifadhi uhusiano wa kimsamiati na nafasi ya waamuzi katika kitabu hiki, huku tanbihi ikionyesha maana pana.
- source_word: מַלְכֵּנוּ
  choice: mfalme wetu
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kiambishi cha umilikaji, ikionyesha wazi mfumo wa uongozi wanaoutaka watu.
- source_word: וְיָצָא לְפָנֵינוּ
  choice: aende mbele yetu
  rationale: Huhifadhi taswira ya Kiebrania ya mfalme kwenda mbele ya watu, hasa akiwa kiongozi wa kijeshi, kwa Kiswahili kinachoeleweka.
- source_word: וְנִלְחַם אֶת מִלְחֲמֹתֵינוּ
  choice: apigane vita vyetu
  rationale: Huhifadhi muundo wa Kiebrania unaorudia mzizi wa “kupigana/vita” na maana ya mfalme kupigana katika vita vya taifa.
theological_decisions:
- issue: Maana ya גּוֹיִם katika ombi la Israeli la kuwa na mfalme
  choice: mataifa
  alternative: Watu wa Mataifa
  rationale: Muktadha unalinganisha Israeli kisiasa na kijamii na jamii nyingine zinazowazunguka. “Mataifa” huakisi Kiebrania bila kuingiza matumizi ya baadaye ya istilahi ya kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inadumisha taswira ya kwenda mbele ya watu na uhusiano wa kimsamiati wa kuhukumu, huku ikieleza maana mbadala katika tanbihi.
