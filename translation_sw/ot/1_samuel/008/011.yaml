base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/011.yaml
  text: 'He said[a], “This will be the custom of the king who will reign over you: he will take your sons and assign them to his chariots and among his horsemen[c][b], and they will run before his chariots.”'
translation:
  language: sw
  text: 'Akasema, “Hii ndiyo desturi[a] ya mfalme atakayewatawala: atawachukua wana wenu wa kiume[b] na kuwaweka watumikie katika magari yake na miongoni mwa wapanda farasi wake; nao watakimbia mbele ya magari yake[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “haki ya kisheria ya mfalme.” Neno la Kiebrania linaweza kumaanisha desturi, dai la kisheria, au kanuni ya hukumu; hapa linaeleza jinsi mfalme atakavyokuwa akiwatendea watu.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wana wenu,” yaani, wana wa kiume; hii inalingana na muktadha wa utumishi wa kijeshi wa kifalme.'
    reason: cultural_note
  - marker: c
    text: Au “mbele ya gari lake.” Katika Kiebrania nomino hiyo iko katika umoja, lakini inaweza kueleweka kuhusu gari moja au magari kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: desturi
  rationale: Katika muktadha huu neno hilo linaeleza namna au utendaji ambao utakuwa kawaida ya mfalme kwa watu. “Desturi” linafikisha onyo kuhusu atakavyotenda bila kudai moja kwa moja kwamba ana haki halali ya kufanya hivyo.
- source_word: הַמֶּלֶךְ אֲשֶׁר יִמְלֹךְ עֲלֵיכֶם
  choice: mfalme atakayewatawala
  rationale: Linahifadhi maana ya kifalme ya kitenzi מלך na uhusiano wa mamlaka unaoonyeshwa na עַל, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: אֶת־בְּנֵיכֶם יִקָּח
  choice: atawachukua wana wenu wa kiume
  rationale: Kiebrania kinataja wana wa kiume hasa, jambo linaloafikiana na muktadha wa huduma ya kijeshi ya mfalme.
- source_word: וְשָׂם לוֹ
  choice: na kuwaweka watumikie
  rationale: שׂים pamoja na לוֹ hapa huonyesha kuwaweka katika utumishi wa mfalme. “Kuwaweka watumikie” ni wazi na ya kawaida bila kuongeza wazo la hiari.
- source_word: בְּמֶרְכַּבְתּוֹ
  choice: katika magari yake ya vita
  rationale: Ingawa umbo la Kiebrania ni umoja, linaweza kutumiwa kwa maana ya jumla au ya kikosi. Wingi unasomeka kwa kawaida katika Kiswahili na unaafikiana na mazingira ya utumishi wa kifalme.
- source_word: וּבְפָרָשָׁיו
  choice: miongoni mwa wapanda farasi wake
  rationale: פָרָשִׁים ni wapanda farasi wa kijeshi. Tafsiri hii inadumisha picha ya wana kuwekwa katika kundi hilo la utumishi.
- source_word: וְרָצוּ לִפְנֵי מֶרְכַּבְתּוֹ
  choice: nao watakimbia mbele ya magari yake ya vita
  rationale: Hii inaonyesha wakimbiaji wa kifalme waliotangulia magari ya mfalme. Wingi unatumia maana ya jumla ya nomino, huku uwezekano wa umoja ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Je, מִשְׁפַּט inaidhinisha haki halali ya mfalme au inaeleza mwenendo wake?
  choice: desturi
  alternative: haki ya kisheria ya mfalme
  rationale: Muktadha ni onyo kuhusu yale ambayo mfalme atawafanyia watu. Tafsiri kuu haipaswi kuamua kimyakimya kwamba matendo hayo yameidhinishwa kimaadili au kisheria; maana mbadala imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Maandiko. “Magari ya vita” limetumiwa badala ya istilahi ya kitaalamu zaidi ili picha ya kijeshi ieleweke kwa wasomaji wa kawaida. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
