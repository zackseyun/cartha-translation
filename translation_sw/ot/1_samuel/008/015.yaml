  text: He will take a tenth of your seed and your vineyards and give it to his officials and his servants[a].
translation:
  language: sw
  text: Atachukua sehemu ya kumi ya mbegu zenu na ya mashamba yenu ya mizabibu, na kuwapa maafisa wake[a] na watumishi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matowashi wake”; neno la Kiebrania סָרִיסָיו linaweza kumaanisha matowashi au, kwa maana pana zaidi, maafisa wa ikulu ya mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעֵיכֶם
  choice: mbegu zenu
  rationale: זֶרַע kimsingi ni ‘mbegu’ na katika muktadha huu inaweza pia kumaanisha mazao yanayotokana na mbegu. ‘Mbegu zenu’ huhifadhi taswira ya Kiebrania na inaeleweka katika muktadha wa ushuru wa kilimo.
- source_word: כַרְמֵיכֶם
  choice: mashamba yenu ya mizabibu
  rationale: כֶּרֶם humaanisha shamba la mizabibu. Usemi huu ni wa kawaida na wazi katika Kiswahili, huku kuchukuliwa kwa sehemu ya kumi kukieleweka kuwa kunahusu mazao yake.
- source_word: יַעְשֹׂר
  choice: atachukua sehemu ya kumi
  rationale: Katika muundo huu, עשר humaanisha kutoza au kuchukua sehemu ya kumi. Tafsiri hii inaonyesha wazi kitendo cha mfalme katika onyo hili bila kutumia neno lenye maana mahsusi ya kidini.
- source_word: וְנָתַן
  choice: na kuwapa
  rationale: Kitenzi hiki kinaendeleza mfululizo wa matendo ya wakati ujao. ‘Na kuwapa’ ni Kiswahili cha kawaida na kinaonyesha kwamba vitu vilivyochukuliwa vitapewa makundi yote mawili yanayofuata.
- source_word: לְסָרִיסָיו
  choice: maafisa wake
  rationale: סָרִיס inaweza kumaanisha towashi au, kwa maana pana, afisa wa ikulu. ‘Maafisa wake’ inafaa katika muktadha wa utawala bila kuamua hali yao ya kimwili; maana nyingine imehifadhiwa katika tanbihi.
- source_word: וְלַעֲבָדָיו
  choice: watumishi wake
  rationale: עֶבֶד inaweza kumaanisha mtumishi au mtumwa kutegemea muktadha. Hapa inarejelea watu walio katika huduma ya mfalme, hivyo ‘watumishi wake’ ni tafsiri ya kawaida isiyobainisha zaidi ya maandishi.
