  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: mfalme atachukua sehemu ya kumi ya mbegu na mashamba ya mizabibu ya watu, kisha kuwapa maafisa wake na watumishi wake. «Mbegu zenu» huhifadhi maana ya msingi ya זַרְעֵיכֶם, ingawa muktadha unaashiria mazao ya kilimo; «mashamba yenu ya mizabibu» hutafsiri כַּרְמֵיכֶם kwa usahihi.'
  naturalness: Kiswahili ni sanifu, wazi, na kina mtiririko wa kawaida. Ujenzi «sehemu ya kumi ya mbegu zenu na ya mashamba yenu ya mizabibu» unaweka wazi kwamba sehemu ya kumi inahusishwa na vipengele vyote viwili.
  terminology: «Maafisa wake» ni chaguo linalofaa kwa סָרִיסָיו katika muktadha wa utawala, bila kufunga maana kwenye hali ya kuwa towashi. «Watumishi wake» ni tafsiri ya kawaida na isiyo ya kupindukia kwa עֲבָדָיו. Tanbihi inahifadhi kwa usahihi maana mbadala ya «matowashi».
