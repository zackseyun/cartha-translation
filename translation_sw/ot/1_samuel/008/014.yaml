  yaml_path: translation/ot/1_samuel/008/014.yaml
  text: He will take your fields[a], your vineyards, and your best olive groves[b], and give them to his servants.
translation:
  language: sw
  text: Atachukua mashamba yenu, mashamba yenu ya mizabibu, na mashamba yenu ya mizeituni yaliyo bora zaidi[a], na atayapa watumishi wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mizeituni yenu iliyo bora zaidi”; Kiebrania kinaweza kurejelea miti ya mizeituni kwa ujumla au mashamba yake kama mali ya kilimo.
    reason: lexical_alternative
  - marker: b
    text: Au “watumwa wake”; neno la Kiebrania linaweza kumaanisha watumishi au watumwa kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֹתֵיכֶם
  choice: mashamba yenu
  rationale: שָׂדֶה humaanisha shamba au eneo la ardhi inayolimwa; “mashamba” ni neno la kawaida na la moja kwa moja katika orodha ya mali za kilimo.
- source_word: כַּרְמֵיכֶם
  choice: mashamba yenu ya mizabibu
  rationale: כֶּרֶם kwa kawaida ni shamba la mizabibu. Usemi huu ni wa asili na unaeleweka wazi katika Kiswahili cha Afrika Mashariki.
- source_word: זֵיתֵיכֶם הַטּוֹבִים
  choice: mashamba yenu bora ya mizeituni
  rationale: זַיִת inaweza kurejelea miti ya mizeituni kwa ujumla au mashamba yake; kwa kuwa iko sambamba na mashamba na mizabibu, tafsiri ya mali ya kilimo inafaa. הַטּוֹבִים inaonyesha yaliyo bora au yenye thamani zaidi.
- source_word: יִקָּח
  choice: atachukua
  rationale: לָקַח ni kitenzi cha kawaida chenye maana ya “kuchukua.” Muktadha wenyewe unaonyesha kuwa huku ni kunyang'anya kwa mamlaka, bila kuhitaji kuongeza ukali usio katika kitenzi.
- source_word: וְנָתַן
  choice: kisha atawapa
  rationale: נָתַן humaanisha “kutoa/kumpa.” “Kisha” linaonyesha mwendelezo wa vitendo unaobebwa na וְ bila kubadili maana.
- source_word: לַעֲבָדָיו
  choice: watumishi wake
  rationale: עֶבֶד inaweza kumaanisha mtumishi au mtumwa. Katika muktadha wa mfalme na watu wake wa utawala, “watumishi” ni chaguo la kawaida, huku uwezekano wa “watumwa” ukihifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya kawaida lakini yenye hadhi. Muundo wa orodha na onyo la kuchukuliwa kwa mali umehifadhiwa; “mashamba ya mizeituni” linaweka wazi kuwa kinachokusudiwa ni mashamba yenye miti hiyo, si zao la zeituni pekee.
