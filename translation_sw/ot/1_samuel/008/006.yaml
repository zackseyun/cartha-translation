base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/006.yaml
  text: But the matter was displeasing in Samuel’s eyes when they said[b][a], “Give us a king to judge us.” And Samuel prayed to Yahweh.
translation:
  language: sw
  text: Lakini jambo hilo lilikuwa baya machoni pa Samweli[a] waliposema, “Tupe mfalme atuhukumu[b].” Naye Samweli akasali kwa Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo hilo halikumpendeza Samweli.” Kiebrania kinasema kihalisi kwamba jambo hilo “lilikuwa baya” machoni pake, kikionyesha tathmini yake kali na hasi.
    reason: lexical_alternative
  - marker: b
    text: Neno “atuhukumu” hapa linaweza pia kumaanisha “atutawale” au “atuongoze.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: lilikuwa baya
  rationale: Huhifadhi nguvu ya tathmini hasi ya kitenzi רעע, badala ya kuifanya iwe taarifa ya hisia pekee.
- source_word: הַדָּבָר
  choice: jambo hilo
  rationale: דבר hapa hurejelea jambo lililosemwa katika muktadha uliotangulia bila kulibana kuwa ‘ombi’ tu.
- source_word: בְּעֵינֵי שְׁמוּאֵל
  choice: machoni pa Samweli
  rationale: Huhifadhi taswira ya nahau ya Kiebrania inayoonyesha tathmini ya Samweli.
- source_word: כַּאֲשֶׁר אָמְרוּ
  choice: waliposema
  rationale: Tafsiri ya wakati inafaa mtiririko wa simulizi na haikazii uhusiano wa kisababishi kuliko maandishi yanavyodai.
- source_word: תְּנָה לָּנוּ
  choice: Tupe
  rationale: Ni amri ya moja kwa moja na ya kawaida ya נתן pamoja na kiwakilishi cha nafsi ya kwanza wingi.
- source_word: מֶלֶךְ
  choice: mfalme
  rationale: Ni istilahi ya kawaida na sahihi kwa מלך katika muktadha huu.
- source_word: לְשָׁפְטֵנוּ
  choice: atuhukumu
  rationale: Huhifadhi mzizi wa maana ya שׁפט na uhusiano wake na mada ya waamuzi, huku maana pana ya kutawala ikiwekwa katika tanbihi.
- source_word: וַיִּתְפַּלֵּל
  choice: akamwomba
  rationale: Katika Kiswahili cha kibiblia na cha kawaida, ‘kumwomba Mungu’ huwasilisha tendo la kusali bila kulifanya mahususi kuwa maombezi.
- source_word: אֶל יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kuwa ‘Yahwe’; kiambishi cha yambwa katika ‘akamwomba’ kinawasilisha kuelekezwa kwa sala kwake.
theological_decisions:
- issue: Nguvu ya tathmini katika וַיֵּרַע
  choice: jambo hilo lilikuwa baya machoni pa Samweli
  alternative: jambo hilo halikumpendeza Samweli
  rationale: Chaguo kuu linahifadhi lugha ya tathmini ya mema na mabaya pamoja na mtazamo wa Samweli, bila kuipunguza kuwa hisia ya kutopendezwa tu.
- issue: Maana ya לְשָׁפְטֵנוּ
  choice: atuhukumu
  alternative: atutawale
  rationale: ‘Atuhukumu’ huhifadhi kiungo cha kileksia na wajibu wa waamuzi, lakini tanbihi inakiri kwamba katika muktadha wa kifalme neno hilo linaweza kujumuisha kutawala.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Kutumia ‘Yahwe’ huhifadhi jina binafsi la Mungu katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye staha. Nahau ‘machoni pa Samweli’ imehifadhiwa kwa sababu inaeleweka na inalinda mtazamo wa maandishi ya Kiebrania; tanbihi hutoa usemi laini zaidi. Jina ‘Yahwe’ limetumiwa kwa uthabiti.
