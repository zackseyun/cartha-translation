base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/016.yaml
  text: He will take your male servants[a], your female servants, your best young men, and your donkeys, and use them for his work.
translation:
  language: sw
  text: Atawachukua watumwa wenu wa kiume[a], watumwa wenu wa kike, vijana wenu bora, na punda wenu, na kuwatumia kwa kazi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumishi wenu wa kiume … watumishi wenu wa kike.” Maneno ya Kiebrania yanaweza kumaanisha watumishi kwa upana zaidi, lakini katika muktadha huu wa mfalme kuwachukua kwa lazima, “watumwa” linafaa zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵיכֶם
  choice: watumwa wenu wa kiume
  rationale: עֶבֶד inaweza kumaanisha mtumishi au mtumwa. Katika muktadha huu wa mfalme kuwachukua watu kwa lazima ili wafanye kazi zake, “watumwa” linaonyesha kwa uwazi zaidi hali ya kutawaliwa na kutumiwa; “wa kiume” linahifadhi tofauti na neno linalofuata.
- source_word: שִׁפְחוֹתֵיכֶם
  choice: watumwa wenu wa kike
  rationale: שִׁפְחָה humaanisha mtumwa au mtumishi wa kike. Tafsiri hii inahifadhi ulinganifu wa kijinsia na עַבְדֵיכֶם na inafaa muktadha wa kuwachukua kwa lazima.
- source_word: בַּחוּרֵיכֶם הַטּוֹבִים
  choice: vijana wenu bora
  rationale: בָּחוּר ni kijana wa kiume aliye katika nguvu zake, na הַטּוֹבִים humaanisha walio bora. Kiswahili hiki ni cha kawaida na kinahifadhi maana ya umri na ubora.
- source_word: חֲמוֹרֵיכֶם
  choice: punda wenu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa wanyama wanaotajwa hapa.
- source_word: יִקָּח
  choice: atawachukua
  rationale: לקח humaanisha kuchukua. Wakati ujao unafaa mfululizo wa maonyo ya kinabii kuhusu mambo ambayo mfalme atafanya.
- source_word: וְעָשָׂה לִמְלַאכְתּוֹ
  choice: na kuwatumia kwa kazi zake
  rationale: Kirai hiki kinaeleza kuwa mfalme atawaweka watu na wanyama aliowachukua katika utumishi wa kazi zake. “Kuwatumia kwa kazi zake” ni Kiswahili cha kawaida na hakiongezi maelezo yasiyokuwamo wazi katika Kiebrania.
theological_decisions: []
