lexical_decisions:
- source_word: וְאֶת
  choice: '[alama ya yambwa; haijatafsiriwa kwa neno tofauti]'
  rationale: Inaonyesha kwamba “binti zenu” ndio yambwa wa kitenzi “atawachukua”; Kiswahili hakihitaji neno tofauti kuiwakilisha.
- source_word: בְּנוֹתֵיכֶם
  choice: binti zenu
  rationale: Nomino hii ya wingi yenye kiambishi cha nafsi ya pili wingi kimsingi humaanisha “binti zenu”; inafaa katika onyo kuhusu mfalme kuwachukua watu wa familia kwa huduma yake.
- source_word: יִקָּח
  choice: atawachukua
  rationale: Kauli isiyotimilika hapa ina maana ya wakati ujao katika onyo la Samueli. “Atawachukua” pia inadumisha wazo la kuwatwaa au kuwaingiza katika huduma kwa mamlaka, badala ya kulainisha kwa kusema “atawaajiri.”
- source_word: לְרַקָּחוֹת
  choice: wawe watengenezaji wa manukato
  rationale: Neno hili la kike kwa wingi linawahusu wanawake waliotayarisha michanganyiko yenye harufu nzuri, kutia ndani manukato au marhamu. Usemi huu ni wazi na wa kawaida katika Kiswahili cha sasa.
- source_word: וּלְטַבָּחוֹת
  choice: wapishi
  rationale: Nomino ya kike kwa wingi inamaanisha wanawake wanaotayarisha chakula. “Wapishi” ni tafsiri ya kawaida, na jinsia yao tayari inaeleweka kutokana na “binti zenu.”
- source_word: וּלְאֹפוֹת
  choice: waokaji
  rationale: Neno hili linatokana na kitenzi “kuoka” na limetumiwa kama nomino kwa wanawake wanaooka. “Waokaji” ni jina la kazi lililo wazi na la kawaida.
