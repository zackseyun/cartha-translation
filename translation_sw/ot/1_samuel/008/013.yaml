  text: Atawachukua binti zenu ili wawe watengenezaji wa manukato[a], wapishi, na waokaji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watengenezaji wa marhamu.” Neno la Kiebrania linaweza kumaanisha kwa upana wale wanaotayarisha michanganyiko yenye harufu nzuri, kutia ndani manukato au marhamu.
