base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/009.yaml
  text: So now[a], listen to their voice; only, you must solemnly warn them and tell them the justice of the king who will reign over them.
translation:
  language: sw
  text: Sasa basi, wasikilize; lakini uwaonye kwa dhati na uwaeleze desturi[a] ya mfalme atakayewatawala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utaratibu wa mfalme” au “haki ya kisheria ya mfalme.” Neno la Kiebrania מִשְׁפָּט linaweza pia kumaanisha hukumu, haki ya kisheria, au mwenendo uliozoeleka.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע בְּקוֹלָם
  choice: wasikilize
  rationale: Nahau hii humaanisha kuwasikiliza au kuyakubali wanayosema. Kiswahili cha moja kwa moja ‘wasikilize’ ni cha asili na hakimaanishi kwamba Samweli anaunga mkono ombi lao.
- source_word: אַךְ כִּי
  choice: lakini
  rationale: Hutoa sharti au tahadhari yenye nguvu baada ya agizo la kuwasikiliza; ‘lakini’ huonyesha ugeuzi huo kwa Kiswahili cha kawaida.
- source_word: הָעֵד תָּעִיד
  choice: ni lazima uwaonye kwa dhati
  rationale: Muundo wa kitenzi-jina pamoja na kitenzi kilichonyambuliwa unatilia tendo mkazo, huku mzizi huu katika Hifili ukihusu kutoa onyo au ushahidi rasmi.
- source_word: וְהִגַּדְתָּ לָהֶם
  choice: na kuwaeleza
  rationale: Huwasilisha maana ya kutangaza au kuwajulisha kwa lugha wazi na ya sasa.
- source_word: מִשְׁפַּט הַמֶּלֶךְ
  choice: desturi ya mfalme
  rationale: Katika muktadha huu מִשְׁפָּט inaweza kumaanisha haki ya kisheria, utaratibu, au mwenendo uliozoeleka. ‘Desturi’ inaelekeza kwenye yale mfalme atakayofanya bila kudai kwamba matendo hayo ni ya haki kimaadili.
- source_word: אֲשֶׁר יִמְלֹךְ עֲלֵיהֶם
  choice: atakayewatawala
  rationale: Hutoa maana ya mfalme kutawala juu yao kwa Kiswahili cha kawaida; utambulisho wake kama mfalme tayari umo katika kirai kilichotangulia.
theological_decisions:
- issue: Ikiwa מִשְׁפַּט הַמֶּלֶךְ ni haki halali ya mfalme au mazoea yake ya kifalme
  choice: desturi ya mfalme
  alternative: haki ya mfalme; utaratibu wa mfalme
  rationale: Mistari inayofuata inaonya kuhusu madai na matendo mazito ya mfalme. ‘Desturi’ huhifadhi hali ya maelezo na onyo bila kuhalalisha matendo hayo kiadili au kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kwa dhati’ huhifadhi uzito wa onyo rasmi bila kutumia lugha nzito isiyo ya kawaida.
