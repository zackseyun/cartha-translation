  text: When Samuel grew old[a], he appointed his sons as judges over Israel.
translation:
  language: sw
  text: Samweli alipozeeka, aliwaweka wanawe kuwa waamuzi kwa ajili ya Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliwaweka wanawe kuwa waamuzi juu ya Israeli.” Kitenzi cha Kiebrania kwa maana halisi ni “weka,” na kihusishi kilicho kabla ya “Israeli” kinaweza kueleweka kuwa “kwa ajili ya” au “juu ya,” kutegemea jinsi uteuzi huo unavyoeleweka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: alipo-
  rationale: Kauli ya simulizi inaweka mazingira ya wakati; muundo wa Kiswahili wenye kiambishi -po- unatoa maana hiyo kwa njia ya kawaida bila kutafsiri neno kwa neno ‘ikawa wakati.’
- source_word: זָקֵן
  choice: zeeka
  rationale: Kitenzi kinaonyesha kuingia katika hali ya uzee, si kueleza tu hali tuli; ‘alipozeeka’ huhifadhi maana hiyo.
- source_word: שְׁמוּאֵל
  choice: Samweli
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: וַיָּשֶׂם
  choice: aliwaweka ... kuwa
  rationale: Kitenzi cha Kiebrania maana yake ya msingi ni ‘kuweka’; katika muktadha huu muundo huu unaeleza kuwapa cheo bila kuficha taswira ya neno la asili.
- source_word: אֶת בָּנָיו
  choice: wanawe
  rationale: Kiebrania kinataja wana wa kiume wa Samweli; ‘wanawe’ ni kifupi, cha asili, na sahihi.
- source_word: שֹׁפְטִים
  choice: waamuzi
  rationale: Neno hili huhifadhi kazi ya kutoa hukumu na kuongoza katika muktadha wa kitabu cha Samweli.
- source_word: לְיִשְׂרָאֵל
  choice: kwa ajili ya Israeli
  rationale: Kihusishi לְ kinaweza kuonyesha wale ambao huduma hiyo ilifanywa kwa ajili yao; chaguo hili huhifadhi maana ya ‘for Israel’ huku uwezekano wa mamlaka juu ya Israeli ukitajwa katika tanbihi.
