  text: וְ/לָ/שׂ֣וּם ל֔/וֹ שָׂרֵ֥י אֲלָפִ֖ים וְ/שָׂרֵ֣י חֲמִשִּׁ֑ים וְ/לַ/חֲרֹ֤שׁ חֲרִישׁ/וֹ֙ וְ/לִ/קְצֹ֣ר קְצִיר֔/וֹ וְ/לַ/עֲשׂ֥וֹת כְּלֵֽי מִלְחַמְתּ֖/וֹ וּ/כְלֵ֥י רִכְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/012.yaml
  text: He will appoint for himself commanders of thousands and commanders of fifties[a], and some to plow his ground and reap his harvest[c][b], and to make his weapons of war and the equipment of his chariots.
translation:
  language: sw
  text: Atawaweka baadhi yao kuwa makamanda wa maelfu na makamanda wa hamsini[a], na wengine walime mashamba yake na kuvuna mavuno yake[b], na kutengeneza vifaa vyake vya vita[c] na vifaa vya magari yake ya vita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakuu wa maelfu na wakuu wa hamsini.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “walime kilimo chake na kuvuna mavuno yake,” muundo unaokazia kazi inayofanywa kwa ajili ya mfalme.
    reason: lexical_alternative
  - marker: c
    text: Au, “silaha zake za vita.” Neno la Kiebrania linaweza kumaanisha vifaa kwa ujumla au silaha hasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָשׂוּם לוֹ
  choice: Atajiwekea
  rationale: Kitenzi jina kinaendeleza maelezo ya matendo ya mfalme kutoka mstari uliotangulia. Kiswahili cha kawaida hutumia kitenzi kamili; kiwakilishi cha kujirejelea kinahifadhi maana ya kufanya uteuzi kwa matumizi au manufaa yake mwenyewe.
- source_word: שָׂרֵי אֲלָפִים
  choice: makamanda wa maelfu
  rationale: שַׂר katika muktadha huu wa kijeshi ni mkuu au kamanda. Usemi huu unahifadhi mgawanyo wa kijeshi wa maelfu bila kutumia lugha ya kizamani.
- source_word: וְשָׂרֵי חֲמִשִּׁים
  choice: na makamanda wa hamsini
  rationale: Huhifadhi muundo unaolingana na kishazi kilichotangulia na kundi la watu hamsini lililotajwa katika Kiebrania.
- source_word: וְלַחֲרֹשׁ חֲרִישׁוֹ
  choice: na wengine walime mashamba yake
  rationale: Kiebrania kina muundo wa neno lenye mzizi mmoja, kihalisi 'kulima kilimo chake.' 'Mashamba yake' ni Kiswahili asilia kinachoonyesha kazi ya kilimo inayofanywa kwa ajili ya mfalme bila kuiga muundo usio wa kawaida.
- source_word: וְלִקְצֹר קְצִירוֹ
  choice: na kuvuna mavuno yake
  rationale: Muundo huu wa Kiebrania unaweza kuhifadhiwa kwa kawaida katika Kiswahili, huku ukisisitiza kwamba mavuno ni ya mfalme.
- source_word: וְלַעֲשׂוֹת כְּלֵי מִלְחַמְתּוֹ
  choice: na kutengeneza vifaa vyake vya vita
  rationale: כְּלִי ni neno pana linaloweza kumaanisha zana, vifaa, au silaha. 'Vifaa vya vita' kinahifadhi upana huo; uwezekano wa maana finyu zaidi 'silaha' umewekwa katika tanbihi.
- source_word: וּכְלֵי רִכְבּוֹ
  choice: na vifaa vya magari yake ya vita
  rationale: רֶכֶב hapa yahusu magari ya vita au kikosi chake cha magari. Tafsiri hii inaeleweka kwa msomaji wa sasa na huhifadhi uhusiano wa vifaa hivyo na magari ya mfalme.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inaendeleza onyo kuhusu yale ambayo mfalme atafanya; 'wengine' imeongezwa kwa uwazi wa kisintaksia bila kubadili wahusika wanaochukuliwa kutoka muktadha uliotangulia. 'Magari ya vita' limetumiwa badala ya 'magari' pekee ili kuepuka maana ya magari ya kisasa.
