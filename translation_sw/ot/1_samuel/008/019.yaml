base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/019.yaml
  text: But the people refused to listen to the voice of Samuel[a], and they said, “No, but there shall be a king over us.”
translation:
  language: sw
  text: Lakini watu walikataa kuisikiliza sauti ya Samweli[a], wakasema, “Hapana! Bali mfalme atatutawala.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walikataa kumtii Samweli.” Nahau ya Kiebrania “kuisikiliza sauti ya” inaweza kumaanisha kuzingatia au kutii, si kusikia tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ
  choice: walikataa
  rationale: Kitenzi מאן kinaonyesha kukataa au kutokuwa tayari; “walikataa” ni cha kawaida na kinahifadhi upinzani wao wa makusudi.
- source_word: הָעָם
  choice: watu
  rationale: עם hapa inawarejelea kwa ujumla Waisraeli waliokuwa wakidai mfalme; “watu” ni tafsiri ya kawaida na ya asili.
- source_word: לִשְׁמֹעַ בְּקוֹל
  choice: kuisikiliza sauti ya
  rationale: Nahau hii inaweza kumaanisha kusikiliza, kutii, au kuzingatia. Tafsiri hii inahifadhi taswira ya Kiebrania, huku tanbihi ikieleza maana pana ya kutii.
- source_word: שְׁמוּאֵל
  choice: Samweli
  rationale: Hili ndilo umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וַיֹּאמְרוּ
  choice: wakasema
  rationale: אמר ni kitenzi cha kawaida cha kusema; “wakasema” kinaendeleza mfuatano wa simulizi kwa Kiswahili cha asili.
- source_word: לֹא
  choice: Hapana!
  rationale: Kanusho hili la pekee linaonyesha kukataa kwa mkazo; alama ya mshangao inawasilisha nguvu yake katika mazungumzo.
- source_word: כִּי אִם
  choice: Ni lazima
  rationale: Katika muktadha huu, כי אם baada ya לֹא huanzisha dai mbadala lenye msisitizo. “Ni lazima” huwasilisha azimio lao kwa Kiswahili cha kawaida bila kulifanya ombi tu.
- source_word: מֶלֶךְ יִהְיֶה עָלֵינוּ
  choice: tuwe na mfalme atakayetutawala
  rationale: Kauli hii inasisitiza kwamba mfalme atakuwa juu yao kwa mamlaka. “Atakayetutawala” huonyesha wazi maana ya עָלֵינוּ katika muktadha wa ufalme, na “tuwe na” ni Kiswahili cha kawaida kwa dai lao.
theological_decisions:
- issue: Nguvu ya kauli מֶלֶךְ יִהְיֶה עָלֵינוּ
  choice: Ni lazima tuwe na mfalme atakayetutawala
  alternative: Mfalme atakuwa juu yetu
  rationale: Kiswahili cha neno kwa neno kingekuwa kigumu na kisicho cha asili. Chaguo hili linahifadhi msisitizo wa watu na mamlaka ya kifalme bila kuamua zaidi kuhusu uhalali wa dai lao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa nahau ya Kiebrania umehifadhiwa katika maandishi, huku maana yake ya kutii ikifafanuliwa katika tanbihi.
