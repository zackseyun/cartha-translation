  text: The name of his firstborn was Joel, and the name of his second was Abijah; they were judges in Beersheba.
translation:
  language: sw
  text: Jina la mwanawe mzaliwa wa kwanza lilikuwa Yoeli, na jina la mwanawe wa pili lilikuwa Abiya; walikuwa waamuzi huko Beer-sheba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי שֶׁם
  choice: Jina ... lilikuwa
  rationale: Katika muundo huu wa kutaja majina, kitenzi kinaunganisha jina na mwenye jina; tafsiri hii ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: בְּנוֹ הַבְּכוֹר
  choice: mwana wake mzaliwa wa kwanza
  rationale: בֵּן humaanisha mwana wa kiume, na הַבְּכוֹר hutaja mzaliwa wa kwanza; umilikishi unamrejelea Samweli katika muktadha.
- source_word: יוֹאֵל
  choice: Yoeli
  rationale: Umbo la kawaida la Kiswahili la jina hili la Kiebrania.
- source_word: מִשְׁנֵהוּ
  choice: mwana wake wa pili
  rationale: Neno hili hutaja wa pili kwa mpangilio. Kurudia ‘mwana wake’ kunafanya maana iwe wazi na ya kawaida katika Kiswahili bila kubadili yaliyomo.
- source_word: אֲבִיָּה
  choice: Abiya
  rationale: Unukuzi wa jina la Kiebrania unaolingana na matamshi na tahajia ya Kiswahili.
- source_word: שֹׁפְטִים
  choice: walikuwa waamuzi
  rationale: Kivumishi-tendo cha wingi kinaeleza jukumu au wadhifa wao wa kuendelea kuwa waamuzi.
- source_word: בִּבְאֵר שָׁבַע
  choice: huko Beer-sheba
  rationale: ‘Huko’ huonyesha mahali kwa Kiswahili cha asili, na Beer-sheba huhifadhi jina la mahali.
