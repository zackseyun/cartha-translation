review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the comparison, the Exodus time span, abandonment of the LORD, service of other gods, and the intentionally general statement about how the people treat Samuel. However, the opening construction renders the Hebrew comparison less idiomatically in Swahili, and the internal verbal coordination can be made more natural.
  naturalness: “Kama matendo yote ambayo wamefanya ... ndivyo ...” is awkward because the comparative “kama ... ndivyo” ordinarily compares corresponding actions or manners, not a bare noun phrase. “Kama walivyofanya katika matendo yao yote ... ndivyo ...” is fluent Standard East African Swahili and retains the sense. The paired participial wording is also smoother with “wakiniacha na wakitumikia.”
  terminology: “Matendo,” “Misri,” “miungu mingine,” and “kunitendea” are appropriate. “Kuitumikia” rightly retains the literal force of עבד, while the footnote responsibly supplies “kuiabudu” as a contextual alternative.
  issues:
  - severity: medium
    issue: Comparative opening is syntactically awkward in Swahili.
    rationale: The phrase “Kama matendo yote ambayo wamefanya ... ndivyo wanavyokutendea” compares Samuel's treatment with “deeds” rather than directly with what the people did. Recasting it as “Kama walivyofanya katika matendo yao yote ... ndivyo...” preserves כְּכָל while making the comparison grammatical and clear.
  - severity: low
    issue: The coordinated phrase “wakiniacha na kuitumikia miungu mingine” is less parallel than it can be.
    rationale: Using “wakiniacha na wakitumikia miungu mingine” gives each action its own finite-dependent verb form and avoids an unnecessarily compressed infinitival coordination.
  revised_text: Kama walivyofanya katika matendo yao yote tangu siku nilipowapandisha kutoka Misri hadi leo[a]—wakiniacha na wakitumikia miungu mingine[b]—ndivyo wanavyokutendea wewe pia.
  revised_footnotes:
  - marker: a
    text: Au, “hadi siku hii.”
    reason: lexical_alternative
  - marker: b
    text: “Kuitumikia miungu mingine” pia kunaweza kusemwa “kuiabudu miungu mingine”; kitenzi cha Kiebrania kihalisi ni “kutumikia.”
    reason: lexical_alternative
  revision_rationale: The revision makes the comparative syntax natural in Standard East African Swahili without narrowing the Hebrew's deliberately open-ended “doing to you.” It retains the upward-Exodus imagery in “nilipowapandisha,” the moral force of “matendo,” and the literal religious-service terminology, with both original footnote anchors preserved.
