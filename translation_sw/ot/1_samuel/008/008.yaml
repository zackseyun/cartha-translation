revisions:
- from: Kama matendo yote ambayo wamefanya tangu siku nilipowapandisha kutoka Misri mpaka leo[a]—wakiniacha na kuitumikia miungu mingine[b]—ndivyo wanavyokutendea wewe pia.
  to: Kama walivyofanya katika matendo yao yote tangu siku nilipowapandisha kutoka Misri hadi leo[a]—wakiniacha na wakitumikia miungu mingine[b]—ndivyo wanavyokutendea wewe pia.
  rationale: The revision makes the comparative syntax natural in Standard East African Swahili without narrowing the Hebrew's deliberately open-ended “doing to you.” It retains the upward-Exodus imagery in “nilipowapandisha,” the moral force of “matendo,” and the literal religious-service terminology, with both original footnote anchors preserved.
  reviewer_model: gpt-5.6-terra
