base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/008.yaml
  text: According to all the deeds that they have done from the day I brought them up out of Egypt to this day[a], forsaking me and serving other gods[b], so they are also doing to you.
translation:
  language: sw
  text: Kama walivyofanya katika matendo yao yote tangu siku nilipowapandisha kutoka Misri hadi leo[a]—wakiniacha na wakitumikia miungu mingine[b]—ndivyo wanavyokutendea wewe pia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi siku hii.”
    reason: lexical_alternative
  - marker: b
    text: “Kuitumikia miungu mingine” pia kunaweza kusemwa “kuiabudu miungu mingine”; kitenzi cha Kiebrania kihalisi ni “kutumikia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכָל הַמַּעֲשִׂים אֲשֶׁר עָשׂוּ
  choice: Kama matendo yote ambayo wamefanya
  rationale: “Kama” huhifadhi nguvu ya ulinganisho ya כְּ, na “matendo” huwasilisha מַעֲשִׂים kwa uzito wake wa kimaadili.
- source_word: מִיּוֹם הַעֲלֹתִי אֹתָם מִמִּצְרַיִם
  choice: tangu siku nilipowapandisha kutoka Misri
  rationale: Huhifadhi usemi wa Kutoka unaotumia Hiphil ya עלה, huku “tangu siku” ikiwa Kiswahili cha kawaida kwa kipindi kinachoanzia wakati huo.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Ni usemi wa sasa na wa kawaida unaohifadhi mwisho wa kipindi hadi siku ya msemaji.
- source_word: וַיַּעַזְבֻנִי
  choice: wakiniacha
  rationale: Huhifadhi maana ya kuachwa kwa YHWH bila kuongeza maelezo ya kimadhehebu; umbo la kitenzi tegemezi linaonyesha kuwa hili ni mojawapo ya matendo yanayotajwa.
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: na kuitumikia miungu mingine
  rationale: “Kuitumikia” hukaa karibu na maana halisi ya עבד, huku muktadha ukionyesha wazi utii na ibada ya kidini.
- source_word: כֵּן הֵמָּה עֹשִׂים גַּם לָךְ
  choice: ndivyo wanavyokutendea wewe pia
  rationale: “Ndivyo” hukamilisha ulinganisho; “wanavyokutendea” huhifadhi kauli iliyo wazi kwa makusudi, na “wewe pia” huonyesha גַּם pamoja na mkazo wa kiwakilishi.
theological_decisions:
- issue: Uhusiano kati ya kumkataa Samweli na kumwacha YHWH
  choice: 'Kutafsiri kama mwendelezo wa mwenendo uleule: “ndivyo wanavyokutendea wewe pia.”'
  alternative: “Wanakukataa kama walivyonikataa” au “wanakuasi kama walivyoniasi.”
  rationale: Kiebrania kinafananisha matendo yao kwa Samweli na mwenendo wao wa zamani kwa YHWH, lakini hakitumii hapa vitenzi vya moja kwa moja vya “kukataa” au “kuasi.” Tafsiri inaacha ulinganisho huo bila kuufafanua kupita matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi huhifadhi ulinganisho mrefu wa Kiebrania, huku vistari virefu vikibainisha matendo yaliyohusika bila kuyageuza kuwa ufafanuzi wa ziada.
