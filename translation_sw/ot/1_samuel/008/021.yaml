base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/021.yaml
  text: Samuel heard all the words of the people[b][a], and he spoke them in the ears of Yahweh.
translation:
  language: sw
  text: Samweli alisikia maneno yote ya watu, akayasema masikioni mwa Yahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “masikioni mwa Yahwe,” nahau yenye maana ya kusema ili Yahwe asikie, au kusema mbele yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: alisikia
  rationale: Kitenzi שׁמע hapa katika usimulizi kinaeleza moja kwa moja kwamba Samweli alisikia yale watu waliyosema; “alisikia” ni cha kawaida na hakiongezi wazo la kutii.
- source_word: כָּל דִּבְרֵי הָעָם
  choice: maneno yote ya watu
  rationale: Huhifadhi jumla inayosisitizwa na כָּל na muundo halisi wa דִּבְרֵי, huku ikibaki wazi katika Kiswahili.
- source_word: וַיְדַבְּרֵם
  choice: akayanena
  rationale: Kiambishi -ya- kinarejelea maneno ya watu. “Akayanena” huhifadhi maana ya kusema bila kuongeza wazi dhana ya kuripoti au kurudia.
- source_word: בְּאָזְנֵי
  choice: masikioni mwa
  rationale: Huhifadhi taswira ya nahau ya Kiebrania, inayomaanisha kusema katika usikivu au mbele ya mhusika.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni umbo la kawaida la Kiswahili la jina la Mungu YHWH, badala ya kulibadilisha kuwa cheo kama BWANA.
- source_word: שְׁמוּאֵל
  choice: Samweli
  rationale: Ni umbo la jina hili lililozoeleka katika Kiswahili.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko la Kiebrania linatumia jina binafsi YHWH. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Nahau ya Kiebrania imehifadhiwa katika mstari na kufafanuliwa katika tanbihi.
