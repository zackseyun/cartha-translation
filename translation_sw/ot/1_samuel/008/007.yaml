base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/007.yaml
  text: And Yahweh said to Samuel[a], “Listen to the voice of the people in all that they say to you, for they have not rejected you, but they have rejected me from being king over them.”
translation:
  language: sw
  text: Yahwe akamwambia Samweli, “Sikiliza sauti ya watu katika yote wanayokuambia, kwa maana hawajakukataa wewe, bali wamenikataa mimi nisiwe mfalme wao.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nisitawale juu yao.”
    reason: מִמְּלֹךְ ni umbo la kitenzi linaloweza kutafsiriwa moja kwa moja kuwa ‘kutawala’; tafsiri kuu ‘nisiwe mfalme wao’ inasisitiza maana ya kifalme kwa Kiswahili cha kawaida.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo la Kiswahili ‘Yahwe’ badala ya kulibadilisha kuwa cheo kama ‘BWANA’.
- source_word: שְׁמַע
  choice: Sikiliza
  rationale: Katika muktadha huu amri inamtaka Samweli ayatie maanani maneno ya watu na kutenda kulingana na ombi lao; ‘Sikiliza’ ni ya kawaida na haiongezi wazi zaidi ya chanzo.
- source_word: בְּקוֹל הָעָם
  choice: sauti ya watu
  rationale: Huhifadhi taswira ya nahau ya Kiebrania huku ikieleweka katika Kiswahili cha sasa.
- source_word: לְכֹל אֲשֶׁר יֹאמְרוּ אֵלֶיךָ
  choice: katika yote watakayokuambia
  rationale: Huwasilisha upeo kamili wa agizo bila kupanua maana.
- source_word: מָאַס
  choice: kataa
  rationale: Kitenzi hiki hapa kinaonyesha kumkataa au kumtupilia mbali mwenye mamlaka; ‘kataa’ kinafaa katika matukio yote mawili.
- source_word: כִּי לֹא אֹתְךָ מָאָסוּ כִּי אֹתִי מָאֲסוּ
  choice: kwa maana si wewe waliyekukataa, bali ni mimi waliyekataa
  rationale: Muundo wa mkazo na utofautishaji kati ya Samweli na Mungu umehifadhiwa kwa ‘si ... bali’ na kwa kutaja ‘mimi’ waziwazi.
- source_word: מִמְּלֹךְ עֲלֵיהֶם
  choice: nisiwe mfalme wao
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la wao kukataa ufalme wa Mungu juu yao, huku maelezo ya chini yakihifadhi uwezekano wa kutafsiri kwa kitenzi ‘kutawala’.
theological_decisions:
- issue: Ufalme wa Mungu katika ombi la Israeli la kuwa na mfalme wa kibinadamu
  choice: Ombi la watu linaelezwa kuwa kumkataa Mungu asiwe mfalme wao.
  alternative: Watu walikataa uongozi wa Samweli pekee, si utawala wa Mungu mwenyewe.
  rationale: Kiebrania kinatofautisha wazi kati ya Samweli na Mungu na kuhusianisha kukataa kwao na ufalme wa Mungu; tafsiri haiongezi hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Akamwambia’ linaendeleza masimulizi, na ‘Yahwe’ linahifadhi jina binafsi la Mungu.
