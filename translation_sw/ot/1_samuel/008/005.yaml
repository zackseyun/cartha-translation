base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/005.yaml
  text: They said to him[a], “Look, you have grown old, and your sons have not walked in your ways. Now appoint for us a king to judge us, like all the nations.”
translation:
  language: sw
  text: Wakamwambia, “Tazama, wewe umezeeka, na wanao hawajafuata njia zako. Sasa tuwekee mfalme atuhukumu[a], kama mataifa yote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “atuongoze” au “atutawale”; kitenzi cha Kiebrania kilichotafsiriwa “kuhukumu” hapa kinaweza kujumuisha mamlaka mapana ya kuongoza.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni kiashiria cha usemi kinachohifadhi msisitizo wa Kiebrania na kinafaa katika lugha ya Biblia iliyo wazi na yenye hadhi.
- source_word: זָקַנְתָּ
  choice: umezeeka
  rationale: Kauli timilifu inaonyesha mchakato uliofikia hali ya sasa; “umezeeka” ni Kiswahili cha kawaida na sahihi.
- source_word: הָלְכוּ בִּדְרָכֶיךָ
  choice: hawajafuata njia zako
  rationale: Huwasilisha kwa Kiswahili cha asili sitiari ya kimaadili ya kutembea katika njia za mtu bila kufanya sentensi kuwa ngumu.
- source_word: שִׂימָה לָּנוּ
  choice: tuwekee
  rationale: Katika muktadha huu humaanisha kumsimika au kumteua mtu kwa ajili yao; “tuwekee” huhifadhi muundo wa ombi na ni ya asili kwa Kiswahili.
- source_word: מֶלֶךְ
  choice: mfalme
  rationale: Ni tafsiri ya moja kwa moja ya jina la mtawala wa kifalme.
- source_word: לְשָׁפְטֵנוּ
  choice: atuhukumu
  rationale: Huhifadhi maana ya msingi ya kitenzi שׁפט, huku tanbihi ikionyesha kuwa hapa inaweza kujumuisha mamlaka mapana ya kuongoza.
- source_word: כְּכָל הַגּוֹיִם
  choice: kama mataifa mengine yote
  rationale: “Mataifa” inarejelea jamii zinazowazunguka Israeli; “mengine” huleta kwa Kiswahili maana ya kulinganisha Israeli na mataifa hayo bila kutumia istilahi ya baadaye ya “Watu wa Mataifa.”
theological_decisions:
- issue: Ombi la kuwa na ufalme kwa kujilinganisha na mataifa yanayowazunguka
  choice: kama mataifa mengine yote
  alternative: kama watu wa mataifa yote
  rationale: “Mataifa” huhifadhi tofauti ya kisiasa na ya agano kati ya Israeli na jamii nyingine bila kuingiza matumizi ya baadaye ya kidini ya “Watu wa Mataifa.”
- issue: Wigo wa kazi ya mfalme katika לְשָׁפְטֵנוּ
  choice: atuhukumu
  alternative: atuongoze / atutawale
  rationale: Maana ya msingi “kuhukumu” imehifadhiwa katika matini, bila kuficha kwamba katika muktadha wa uongozi wa Israeli neno hilo linaweza kujumuisha kutawala au kuongoza kwa upana zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili kwa wasomaji wa kawaida, huku maana ya msingi ya maneno ya Kiebrania na mvutano wa kisiasa na kiteolojia vikihifadhiwa.
