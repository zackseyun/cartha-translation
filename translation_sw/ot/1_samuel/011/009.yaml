base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/009.yaml
  text: 'They said to the messengers who were coming[a], “Thus you shall say to the men of Jabesh-gilead: Tomorrow, by the heat of the sun, you will have deliverance.” So the messengers came and told the men of Jabesh[b], and they rejoiced.'
translation:
  language: sw
  text: 'Wakawaambia wajumbe waliokuja, “Mtawaambia hivi watu wa Yabesh-gileadi[a]: ‘Kesho, wakati wa joto la jua[b], mtaokolewa.’” Basi wajumbe wakaja na kuwaambia watu wa Yabesh, nao wakafurahi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “mtu wa Yabesh-gileadi”; umoja huo unaelekea kutumiwa kwa maana ya pamoja kuhusu wakazi wa mji.
    reason: lexical_alternative
  - marker: b
    text: Au “jua litakapokuwa kali,” yaani, karibu na wakati wa joto kali zaidi mchana.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: wajumbe
  rationale: Katika simulizi hili neno hili linamaanisha wanadamu waliotumwa kupeleka ujumbe, si malaika.
- source_word: הַבָּאִים
  choice: waliokuja
  rationale: Huhifadhi maana ya kishiriki kinachowatambulisha wajumbe waliowasili, huku ikiwa ya kawaida katika Kiswahili.
- source_word: כֹּה תֹאמְרוּן
  choice: Mtawaambia hivi
  rationale: Ni usemi wa kawaida wa Kiswahili unaotambulisha maneno halisi yanayofuata na unaendana kwa karibu na fomula ya Kiebrania.
- source_word: לְאִישׁ יָבֵישׁ גִּלְעָד
  choice: watu wa Yabesh-gileadi
  rationale: Ingawa אִישׁ ni umoja kisarufi, hapa limetumiwa kwa maana ya pamoja kuhusu wakazi wa mji; ‘watu’ huepuka kuleta dhana potovu ya mtu mmoja.
- source_word: תִּהְיֶה לָכֶם תְּשׁוּעָה
  choice: mtaokolewa
  rationale: Katika muktadha wa tishio la kijeshi, תְּשׁוּעָה ni kuokolewa kutoka hatarini. Kitenzi hiki ni cha kawaida na wazi kwa wasomaji wa Kiswahili.
- source_word: בְּחֹם הַשָּׁמֶשׁ
  choice: wakati wa joto la jua
  rationale: Huhifadhi taswira ya joto la jua na maana yake ya wakati bila kuifasiri moja kwa moja kuwa adhuhuri.
- source_word: וַיִּשְׂמָחוּ
  choice: wakafurahi
  rationale: Hutoa kwa kawaida nguvu ya simulizi na hisia ya shangwe iliyomo katika kitenzi cha Kiebrania.
