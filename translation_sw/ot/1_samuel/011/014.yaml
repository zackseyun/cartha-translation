id: 1SA.11.14
reference: 1 Samuel 11:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל הָ/עָ֔ם לְכ֖וּ וְ/נֵלְכָ֣ה הַ/גִּלְגָּ֑ל וּ/נְחַדֵּ֥שׁ שָׁ֖ם הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/014.yaml
  text: Then Samuel said to the people[a], “Come, let us go to Gilgal, and there renew the kingship.”
translation:
  language: sw
  text: Kisha Samweli akawaambia watu, “Njooni, twende Gilgali, na huko tuufanye upya ufalme[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tuuthibitishe ufalme,” au “tuifanye upya mamlaka ya kifalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akawaambia
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, na “akawaambia” humfaa msemaji anayewaelekea watu wengi.
- source_word: שְׁמוּאֵל
  choice: Samweli
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: אֶל הָעָם
  choice: watu
  rationale: עָם hapa inamaanisha watu wa Israeli waliokusanyika; “watu” ni tafsiri ya kawaida isiyoongeza dhana ya jeshi.
- source_word: לְכוּ וְנֵלְכָה
  choice: Njooni, twende
  rationale: Imperative ikifuatwa na cohortative ni mwaliko wa kwenda pamoja. “Njooni, twende” ni usemi wa asili wa Kiswahili na huhifadhi wito wa Samweli pamoja na hatua ya pamoja.
- source_word: הַגִּלְגָּל
  choice: Gilgali
  rationale: Hili ndilo umbo la kawaida la jina la mahali hapa katika Biblia za Kiswahili.
- source_word: וּנְחַדֵּשׁ
  choice: tuufanye upya
  rationale: Piel ya חדש ina maana ya kufanya upya au kuhuisha. Kauli hii huhifadhi maana ya msingi bila kuamua kimya kimya kwamba tendo hilo lilikuwa kuthibitisha tu.
- source_word: שָׁם
  choice: huko
  rationale: Kielezi hiki hurejelea mahali palipotajwa, yaani Gilgali; “huko” ni cha asili baada ya mwendo kuelekea mahali hapo.
- source_word: הַמְּלוּכָה
  choice: ufalme
  rationale: מְלוּכָה inaweza kumaanisha mamlaka au cheo cha kifalme, na pia ufalme. “Ufalme” ni neno la kawaida na lenye heshima, huku tanbihi ikihifadhi uwezekano wa maana ya uthibitisho wa mamlaka ya kifalme.
theological_decisions:
- issue: Maana ya kufanya upya הַמְּלוּכָה
  choice: tuufanye upya ufalme
  alternative: tuuthibitishe ufalme; tuifanye upya mamlaka ya kifalme
  rationale: Muktadha unaonyesha kuimarishwa tena kwa utawala wa Sauli baada ya ushindi wake, lakini Kiebrania hakitaji wazi ibada maalumu ya kutawazwa. Tafsiri kuu huhifadhi tamathali ya ‘kufanya upya,’ na tanbihi huonyesha maana nyingine halali bila kufunga utata wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Njooni, twende” ni mwaliko wa asili; “tuufanye upya ufalme” huhifadhi mvutano wa kileksika kati ya kuufanya upya, kuuthibitisha, na kuhuisha mamlaka ya kifalme.
