  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יָּ֨שֶׂם שָׁא֣וּל אֶת הָ/עָם֮ שְׁלֹשָׁ֣ה רָאשִׁים֒ וַ/יָּבֹ֤אוּ בְ/תוֹךְ הַֽ/מַּחֲנֶה֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּכּ֥וּ אֶת עַמּ֖וֹן עַד חֹ֣ם הַ/יּ֑וֹם וַ/יְהִ֤י הַ/נִּשְׁאָרִים֙ וַ/יָּפֻ֔צוּ וְ/לֹ֥א נִשְׁאֲרוּ בָ֖/ם שְׁנַ֥יִם יָֽחַד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/011.yaml
  text: And it happened on the next day that Saul set the people in three groups[a], and they came into the midst of the camp during the morning watch and struck Ammon until the heat of the day. And it happened that the survivors were scattered[c][b], so that no two of them were left together.
translation:
  language: sw
  text: Siku iliyofuata, Sauli akawapanga watu katika vikosi vitatu[a]. Wakaingia katikati ya kambi wakati wa zamu ya ulinzi ya asubuhi[b], wakawapiga Waamoni mpaka siku ilipopata joto[c]. Walionusurika wakatawanyika, hata hawakubaki wawili pamoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “vichwa vitatu,” yaani migawanyiko au vikosi vitatu.'
    reason: lexical_alternative
  - marker: b
    text: Hii ilikuwa zamu ya ulinzi ya mapema asubuhi, karibu na mapambazuko.
    reason: cultural_note
  - marker: c
    text: Au, “mpaka joto la mchana”; yaelekea kuelekea adhuhuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Kesho yake
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha siku iliyofuata matukio yaliyotangulia.
- source_word: וַיָּשֶׂם ... שְׁלֹשָׁה רָאשִׁים
  choice: akawapanga watu katika vikosi vitatu
  rationale: Neno la Kiebrania linalomaanisha kihalisi “vichwa vitatu” ni nahau ya migawanyiko au vikosi vitatu; “vikosi” linaonyesha wazi muktadha wa kijeshi.
- source_word: בְתוֹךְ הַמַּחֲנֶה
  choice: wakaingia katikati ya kambi
  rationale: Linaonyesha kupenya hadi ndani ya kambi, si kuwapo tu karibu nayo.
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: wakati wa zamu ya ulinzi ya asubuhi
  rationale: Linahifadhi rejeo la kipindi maalumu cha ulinzi wa kijeshi cha mapema asubuhi.
- source_word: וַיַּכּוּ אֶת עַמּוֹן
  choice: wakawapiga Waamoni
  rationale: “Ammoni” limetumiwa kwa maana ya jeshi au watu wa Waamoni. “Wakawapiga” linahifadhi upana wa kitenzi cha Kiebrania bila kulazimisha kama wote waliuawa au walishindwa tu.
- source_word: עַד חֹם הַיּוֹם
  choice: mpaka mchana ulipokuwa na joto
  rationale: Linahifadhi taswira ya Kiebrania ya joto la siku badala ya kuibadili moja kwa moja kuwa saa sita mchana.
- source_word: הַנִּשְׁאָרִים
  choice: walionusurika
  rationale: Katika muktadha wa mapigano, neno hili linarejelea wale waliobaki hai baada ya kushambuliwa.
- source_word: וַיָּפֻצוּ
  choice: wakatawanyika
  rationale: Ni usemi wa asili unaoeleza kuvunjika na kusambaratika kwa jeshi baada ya kushindwa.
- source_word: וְלֹא נִשְׁאֲרוּ בָם שְׁנַיִם יָחַד
  choice: hata hawakubaki wawili pamoja
  rationale: Linadumisha picha ya kutawanyika kabisa, kiasi kwamba hakuna wawili waliobaki pamoja.
- source_word: וַיְהִי ... וַיְהִי
  choice: Kesho yake ... Walionusurika
  rationale: Mfuatano wa vitenzi vya simulizi umeonyeshwa kwa mtiririko wa kawaida wa Kiswahili; kurudia kihalisi “ikawa” kungefanya sentensi iwe nzito bila kuongeza maana muhimu.
