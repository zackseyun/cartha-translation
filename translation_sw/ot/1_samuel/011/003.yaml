  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו זִקְנֵ֣י יָבֵ֗ישׁ הֶ֤רֶף לָ֨/נוּ֙ שִׁבְעַ֣ת יָמִ֔ים וְ/נִשְׁלְחָה֙ מַלְאָכִ֔ים בְּ/כֹ֖ל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/אִם אֵ֥ין מוֹשִׁ֛יעַ אֹתָ֖/נוּ וְ/יָצָ֥אנוּ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/003.yaml
  text: The elders of Jabesh said to him, “Leave us alone for seven days, and we will send messengers throughout all the territory of Israel. Then, if there is no one to save us, we will come out to you.”
translation:
  language: sw
  text: Wazee wa Yabeshi wakamwambia, “Tupe muda wa siku saba, nasi tutatuma wajumbe katika nchi yote ya Israeli. Kisha, ikiwa hakuna mtu wa kutuokoa, tutatoka na kuja kwako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶרֶף לָנוּ
  choice: Tupe muda
  rationale: Kitenzi הֶרֶף hapa kinaomba Nahashi alegeze au asitishe hatua dhidi yao kwa muda. ‘Tupe muda’ ni Kiswahili cha kawaida kinachoeleza ombi hilo bila kudokeza kwamba tayari walikuwa wameachwa huru.
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: katika eneo lote la Israeli
  rationale: גְּבוּל inaweza kumaanisha mpaka au eneo lililo ndani ya mipaka; hapa wajumbe wanasafiri kote Israeli, hivyo ‘eneo lote’ linafaa katika muktadha.
- source_word: מוֹשִׁיעַ
  choice: mtu wa kutuokoa
  rationale: Nomino hii humaanisha mwokozi au mtu anayetoa msaada wa ukombozi. Muundo huu wa kawaida unahifadhi maana bila kuifanya iwe cheo maalumu.
- source_word: וְיָצָאנוּ אֵלֶיךָ
  choice: tutatoka na kujisalimisha kwako
  rationale: Kwa maana halisi ni ‘tutatoka kwako,’ lakini katika muktadha wa mji uliozingirwa kutoka nje kwenda kwa adui kunamaanisha kujisalimisha. Ufafanuzi huu ni wa asili katika Kiswahili na unahifadhi kusudi la kauli.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Yabeshi’ imetumiwa kama umbo la kawaida la jina la mahali; sentensi inafuata mtiririko wa simulizi wa Kiebrania.
