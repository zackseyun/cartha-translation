- from: Wazee wa Yabeshi wakamwambia, “Tupe muda wa siku saba, ili tutume wajumbe katika eneo lote la Israeli. Kisha, ikiwa hakuna mtu wa kutuokoa, tutatoka na kujisalimisha kwako.”
