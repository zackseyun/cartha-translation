  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם נָחָשׁ֙ הָ/עַמּוֹנִ֔י בְּ/זֹאת֙ אֶכְרֹ֣ת לָ/כֶ֔ם בִּ/נְק֥וֹר לָ/כֶ֖ם כָּל עֵ֣ין יָמִ֑ין וְ/שַׂמְתִּ֥י/הָ חֶרְפָּ֖ה עַל כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/002.yaml
  text: 'Nahash the Ammonite said to them, “On this condition I will make a treaty with you: that every right eye of yours be gouged out, and I will make it a disgrace upon all Israel.”'
translation:
  language: sw
  text: 'Nahashi, Mwamoni, akawaambia, “Nitafanya agano nanyi kwa sharti hili: niwang’oe kila mmoja wenu jicho la kulia, na hivyo niwaletee Israeli wote aibu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶכְרֹת לָכֶם
  choice: nitafanya agano nanyi
  rationale: Kirai halisi kinamaanisha ‘kukata agano’; Kiswahili cha kawaida na chenye heshima hutumia ‘kufanya agano’, huku kikihifadhi wazo la makubaliano rasmi.
- source_word: בִּנְקוֹר לָכֶם כָּל־עֵין יָמִין
  choice: niwang’oe kila mmoja wenu jicho la kulia
  rationale: Kitenzi נקר kinaeleza kung’oa au kutoboa jicho. Muundo huu wa Kiswahili unaweka wazi kuwa Nahashi anataka kila mtu apoteze jicho lake la kulia, bila kutumia kauli tendwa isiyo ya asili.
- source_word: חֶרְפָּה
  choice: aibu
  rationale: Neno hili lina maana ya fedheha, shutuma, au aibu ya hadharani; ‘aibu’ ni ya kawaida na inafaa katika muktadha huu.
- source_word: עַל כָּל־יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Hurejelea taifa au watu wote wa Israeli, si eneo pekee.
theological_decisions:
- issue: Uhusiano kati ya kung’olewa kwa macho na kuletwa kwa aibu juu ya Israeli
  choice: na hivyo niwaletee Israeli wote aibu
  alternative: na niwaletee Israeli wote aibu
  rationale: Kiwakilishi cha Kiebrania katika וְשַׂמְתִּיהָ kinaweza kurejelea tendo au matokeo yake; ‘na hivyo’ huonyesha kwa kawaida kwamba sharti hilo ndilo lingekuwa fedheha kwa taifa, bila kuongeza fundisho la kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mwamoni’ limetumiwa kama jina la utaifa. Sentensi imeundwa kwa uwazi wa mazungumzo huku ukatili na dharau ya kauli ya Nahashi vikihifadhiwa.
