base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/008.yaml
  text: He mustered them at Bezek[a], and the sons of Israel were three hundred thousand, and the men of Judah thirty thousand.
translation:
  language: sw
  text: Akawahesabu huko Bezeki, na wana wa Israeli[a] walikuwa 300,000, nao wanaume wa Yuda walikuwa 30,000.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania kinasema, “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקְדֵם
  choice: Akawahesabu
  rationale: Katika muktadha wa kijeshi, kitenzi פקד humaanisha kuwahesabu au kuwaandikisha watu waliokusanywa kwa vita. ‘Akawahesabu’ ni usemi wa kawaida wa Kiswahili na unaafikiana na idadi zinazofuata.
- source_word: בְּבָזֶק
  choice: huko Bezeki
  rationale: בָזֶק ni jina la mahali; ‘Bezeki’ ni uhawilishaji unaosomeka kwa kawaida katika Kiswahili, na kihusishi ב kinaonyesha mahali walipohesabiwa.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Usemi huu unahifadhi taswira ya kifamilia ya Kiebrania na pia utofauti wa kifasihi kati ya Israeli na Yuda katika mstari huu.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: 300,000
  rationale: Hii ni idadi ya moja kwa moja; tarakimu huifanya isomeke kwa urahisi bila kubadili maana.
- source_word: וְאִישׁ יְהוּדָה
  choice: watu wa Yuda
  rationale: Ingawa אִישׁ ni umbo la umoja, hapa limetumiwa kwa maana ya jumla kuhusu watu wa Yuda. ‘Watu wa Yuda’ ni ya kawaida na haidai kwamba walikuwa wanaume pekee zaidi ya inavyodai matini.
- source_word: שְׁלֹשִׁים אָלֶף
  choice: 30,000
  rationale: Hii ni idadi ya moja kwa moja, iliyowasilishwa kwa tarakimu kwa uwazi.
theological_decisions:
- issue: Tafsiri ya usemi wa kikabila בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Hakuna fundisho maalumu linalotegemea uchaguzi huu. Tafsiri kuu inahifadhi usemi halisi wa kifamilia na utofauti kati ya Israeli na Yuda, huku tanbihi ikitoa namna ya kawaida zaidi ya Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi na wazi; ‘nao’ hutenganisha kwa kawaida hesabu ya Yuda na ile ya Israeli.
