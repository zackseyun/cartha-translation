  text: Then the people said to Samuel[a], “Who is it that said, ‘Shall Saul reign over us?’ Hand over the men, and we will put them to death.”
translation:
  language: sw
  text: Ndipo watu wakamwambia Samweli, “Ni nani aliyesema, ‘Je, Sauli atatutawala?’[a] Tupeni watu hao, nasi tutawaua.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Sauli atatutawala?” Kitenzi cha Kiebrania katika hali ya imperfecti kinaweza kutafsiriwa kama swali kuhusu wakati ujao au, ingawa uwezekano huo ni mdogo hapa, kama kauli: “Sauli atatutawala.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר הָעָם
  choice: Ndipo watu wakamwambia
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” huonyesha mfuatano kwa Kiswahili cha kawaida. Kiambishi “-mw-” pamoja na “-ambia” kinaonyesha kwamba maneno yanaelekezwa kwa Samweli.
- source_word: אֶל שְׁמוּאֵל
  choice: Samweli
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Biblia za Kiswahili; uelekeo wa usemi umeonyeshwa katika “wakamwambia.”
- source_word: מִי הָאֹמֵר
  choice: Ni nani aliyesema
  rationale: Muundo wenye kibainishi na kitenzi-shirikishi unamtambulisha ‘yule aliyesema’; Kiswahili hiki ni cha asili na hudumisha dai la kumtambua mhusika.
- source_word: שָׁאוּל יִמְלֹךְ עָלֵינוּ
  choice: Je, Sauli atatutawala?
  rationale: Imperfecti ya Kiebrania inaeleweka vizuri hapa kama swali linalokumbusha upinzani wa awali dhidi ya ufalme wa Sauli. “Atatutawala” huhifadhi maana ya utawala wa kifalme ya מלך.
- source_word: תְּנוּ הָאֲנָשִׁים
  choice: Tukabidhini watu hao
  rationale: Amri inataka wapinzani hao wakabidhiwe kwa ajili ya hukumu. “Watu hao” huwarejelea kwa uwazi wale waliotajwa bila kudai kwamba neno hilo lazima lihusu wanaume kwa kutofautisha jinsia.
- source_word: וּנְמִיתֵם
  choice: nasi tutawaua
  rationale: Hiphil ya מות humaanisha kuwasababisha wafe. Katika Kiswahili, “tutawaua” ni usemi wa moja kwa moja na wa kawaida unaowasilisha dhamira ya kuwaua.
