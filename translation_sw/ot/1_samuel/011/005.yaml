  text: וְ/הִנֵּ֣ה שָׁא֗וּל בָּ֣א אַחֲרֵ֤י הַ/בָּקָר֙ מִן הַ/שָּׂדֶ֔ה וַ/יֹּ֣אמֶר שָׁא֔וּל מַה לָּ/עָ֖ם כִּ֣י יִבְכּ֑וּ וַ/יְסַ֨פְּרוּ ל֔/וֹ אֶת דִּבְרֵ֖י אַנְשֵׁ֥י יָבֵֽישׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/005.yaml
  text: And behold[a], Saul was coming from the field behind the cattle, and Saul said, “What is wrong with the people[b], that they are weeping?” And they told him the words of the men of Jabesh.
translation:
  language: sw
  text: Tazama, Sauli alikuwa akija kutoka shambani nyuma ya ng’ombe[a]. Sauli akauliza, “Watu wana nini hata wanalia?” Wakamweleza maneno ya wanaume wa Yabeshi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwafuata ng’ombe.” Kifungu cha Kiebrania kinaweza kueleweka kuwa Sauli alikuwa akija kutoka shambani akifuata ng’ombe.
    reason: lexical_alternative
  - marker: b
    text: Au, “ujumbe wa wanaume wa Yabeshi.” Kiebrania kinasema kihalisi, “maneno ya wanaume wa Yabeshi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Inahifadhi nguvu ya alama ya simulizi inayogeuza tukio na kulifanya lionekane wazi, badala ya kuiacha kabisa.
- source_word: בָּא
  choice: alikuwa akija
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea, kama participle ya Kiebrania.
- source_word: אַחֲרֵי הַבָּקָר
  choice: nyuma ya ng’ombe
  rationale: אַחֲרֵי ina maana ya mahali, ‘nyuma ya/baada ya’; tafsiri hii inaonyesha Sauli akija nyuma ya ng’ombe waliotoka shambani bila kuibana בָּקָר kuwa maksai pekee.
- source_word: מִן הַשָּׂדֶה
  choice: kutoka shambani
  rationale: Inaonyesha mahali Sauli alikotoka kwa Kiswahili cha kawaida.
- source_word: מַה לָעָם
  choice: Watu wana nini
  rationale: Hii ni njia ya kawaida ya Kiswahili kuuliza jambo linalowasumbua watu.
- source_word: כִּי יִבְכּוּ
  choice: hata wanalia
  rationale: Inaunganisha kilio chao na swali la Sauli na kudumisha hali ya tendo linaloendelea.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: Wakamweleza
  rationale: Ni kitenzi cha kawaida na cha moja kwa moja kwa kutoa taarifa katika muktadha huu.
- source_word: דִּבְרֵי אַנְשֵׁי יָבֵישׁ
  choice: maneno ya wanaume wa Yabeshi
  rationale: ‘Maneno’ inahifadhi maana ya karibu ya דִּבְרֵי, huku ‘wanaume’ ikiwakilisha kwa usahihi אַנְשֵׁי katika rejeo hili.
