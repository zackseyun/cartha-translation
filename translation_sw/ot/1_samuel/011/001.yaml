source:
  edition: WLC
  text: וַ/יַּ֗עַל נָחָשׁ֙ הָֽ/עַמּוֹנִ֔י וַ/יִּ֖חַן עַל יָבֵ֣שׁ גִּלְעָ֑ד וַ/יֹּ֨אמְר֜וּ כָּל אַנְשֵׁ֤י יָבֵישׁ֙ אֶל נָחָ֔שׁ כְּרָת לָ֥/נוּ בְרִ֖ית וְ/נַעַבְדֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/001.yaml
  text: Then Nahash the Ammonite went up and encamped against Jabesh-gilead. And all the men of Jabesh said to Nahash[a], “Make a covenant with us, and we will serve you.”
translation:
  language: sw
  text: Kisha Nahashi, Mwamoni, akapanda na kupiga kambi dhidi ya Yabeshi-gileadi. Wanaume wote wa Yabeshi wakamwambia Nahashi, “Fanya agano nasi[a], nasi tutakutumikia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “Kata agano nasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה katika simulizi humaanisha kupanda au kwenda juu, na hapa kinaweza pia kudokeza mwendo wa kijeshi bila kulazimisha maana ya kuzingira.
- source_word: נָחָשׁ הָעַמּוֹנִי
  choice: Nahashi, Mwamoni
  rationale: Jina limetoholewa kwa muundo wa kawaida wa Kiswahili, na gentiliki imetafsiriwa kwa namna ya asili na iliyo wazi.
- source_word: וַיִּחַן עַל
  choice: kupiga kambi dhidi ya
  rationale: חנה pamoja na עַל katika muktadha wa kijeshi ni kupiga kambi dhidi ya mahali au adui; tafsiri hii haiongezi wazo mahsusi la kuzingira ambalo kitenzi chenyewe halilazimishi.
- source_word: יָבֵשׁ גִּלְעָד
  choice: Yabeshi-gileadi
  rationale: Jina la mahali limetoholewa kwa namna inayosomeka katika Kiswahili huku vipengele vyote viwili vya jina vikihifadhiwa.
- source_word: כָּל אַנְשֵׁי יָבֵישׁ
  choice: wanaume wote wa Yabeshi
  rationale: אַנְשֵׁי ni ‘wanaume wa’; maana ya kijinsia imehifadhiwa, hasa katika mazungumzo haya ya kiraia na kijeshi.
- source_word: כְּרָת לָנוּ בְרִית
  choice: Fanya agano nasi
  rationale: Nahau ya Kiebrania ni kihalisi ‘kata agano’; ‘fanya agano’ ni Kiswahili cha kawaida kinachohifadhi dhana ya בְרִית bila kuibana kuwa mkataba wa kisiasa pekee.
- source_word: וְנַעַבְדֶךָּ
  choice: nasi tutakutumikia
  rationale: עבד ikiwa na mtu kama yambwa humaanisha kumtumikia; tafsiri hii ni ya moja kwa moja na haiongezi kwa lazima wazo la kuwa watumwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa vitenzi mfululizo umetumiwa kuakisi mwendo wa simulizi la Kiebrania; majina yametoholewa kwa maumbo yanayofaa Kiswahili.
