  text: And the Spirit of God rushed upon Saul when he heard these words[b][a], and his anger burned greatly.
translation:
  language: sw
  text: Roho wa Mungu akamjia Sauli kwa nguvu[a] aliposikia maneno hayo, naye hasira yake ikawaka sana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamshukia Sauli kwa nguvu.” Kitenzi cha Kiebrania kinaweza kumaanisha Roho kumjia mtu kwa nguvu na kumwezesha.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “pua yake ikawaka sana,” nahau ya Kiebrania inayomaanisha kuwa na hasira kali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח
  choice: akamjia ... kwa nguvu
  rationale: Katika muktadha wa Roho kumjia mtu, kitenzi צלח kinaonyesha ujio wa ghafla wenye nguvu na uwezeshaji. Kiswahili hiki ni cha kawaida na hakidokezi tu kuwasili.
- source_word: רוּחַ אֱלֹהִים
  choice: Roho wa Mungu
  rationale: Hutafsiri moja kwa moja kirai cha Kiebrania na kuhifadhi uzito wake wa kumtaja Roho wa kimungu.
- source_word: עַל
  choice: akamjia
  rationale: Maana ya עַל imejumuishwa kwa kawaida katika kitenzi cha Kiswahili 'akamjia'; tafsiri ya neno kwa neno kama 'juu ya' ingekuwa isiyo ya kawaida hapa.
- source_word: בְּשָׁמְעוֹ
  choice: aliposikia
  rationale: Muundo wa ב pamoja na kitenzi-jina na kiambishi ni wa wakati; 'aliposikia' huonyesha kwa uwazi wakati tukio lilipotokea.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: maneno hayo
  rationale: Katika muktadha huu wa taarifa iliyosemwa, דְּבָרִים inaeleweka vizuri kama 'maneno'; 'hayo' hurejelea ujumbe uliotangulia.
- source_word: וַיִּחַר אַפּוֹ
  choice: akawaka hasira
  rationale: Huhifadhi sitiari ya Kiebrania ya hasira kuwaka huku ikiwa Kiswahili cha asili na kinachoeleweka.
- source_word: מְאֹד
  choice: sana
  rationale: Ni kiongezi cha kawaida na chenye nguvu katika Kiswahili, kinacholingana na kiwango cha מְאֹד.
theological_decisions:
- issue: Asili ya רוּחַ אֱלֹהִים katika simulizi hili
  choice: Roho wa Mungu anayemjia Sauli kwa nguvu
  alternative: roho kutoka kwa Mungu
  rationale: Muktadha wa kumwezesha Sauli kuongoza na kuleta ukombozi unaunga mkono rejeo kwa Roho wa Mungu mwenyewe, bila kuongeza ufafanuzi wa kimadhehebu usiomo katika kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Akamjia ... kwa nguvu' ni cha asili kuliko tafsiri ya moja kwa moja ya 'juu yake,' huku 'akawaka hasira' ikihifadhi taswira ya chanzo. Alama zote za tanbihi zimewekwa katika matini kuu.
