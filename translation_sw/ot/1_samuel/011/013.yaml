  yaml_path: translation/ot/1_samuel/011/013.yaml
  text: But Saul said[a], “Not a man shall be put to death on this day, for today Yahweh has brought salvation in Israel.”
translation:
  language: sw
  text: Lakini Sauli akasema, “Hakuna mtu atakayeuawa siku hii, kwa maana leo Yahweh ameleta wokovu katika Israeli.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lakini Sauli akasema
  rationale: Waw-consecutive inaendeleza simulizi, lakini muktadha wa mstari uliotangulia unaonyesha tofauti na pendekezo la watu; hivyo “Lakini” ni ya asili na sahihi hapa.
- source_word: לֹא יוּמַת אִישׁ
  choice: Hakuna mtu atakayeuawa
  rationale: Kitenzi cha kausativi/pasivi kutoka מות kina maana ya kuuawa au kuhukumiwa kufa, si kufa tu. “Hakuna mtu” linaonyesha matumizi ya אִישׁ kwa maana ya jumla.
- source_word: בַּיּוֹם הַזֶּה
  choice: leo
  rationale: Ingawa muundo halisi ni “katika siku hii,” Kiswahili cha kawaida na fasaha hutumia “leo” bila kupoteza msisitizo wa wakati.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי inatanguliza sababu ya Sauli kukataa watu hao wauawe.
- source_word: הַיּוֹם
  choice: leo
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kielezi hiki cha wakati.
- source_word: עָשָׂה יְהוָה תְּשׁוּעָה
  choice: Yahweh ameleta wokovu
  rationale: Nahau hiyo inaeleza kwamba Yahweh ametenda au kufanikisha ukombozi. “Ameleta wokovu” huhifadhi upana wa תְּשׁוּעָה na uhusika mkuu wa Mungu, huku “ushindi” na “ukombozi” pia zikiwezekana katika muktadha wa kijeshi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne linatolewa kama jina binafsi “Yahweh,” badala ya kubadilishwa kuwa cheo.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Huhifadhi maana ya kawaida ya kihusishi ב kama mahali au ndani ya jamii ya Israeli; “kwa ajili ya Israeli” pia yawezekana lakini inaongeza wazi maana ya mnufaika.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; “Yahweh” hulihifadhi badala ya kuliwakilisha kwa cheo.
- issue: Maana ya תְּשׁוּעָה katika muktadha wa kijeshi
  choice: wokovu
  alternative: ukombozi; ushindi
  rationale: Muktadha unahusu kuokolewa kijeshi, hivyo “ukombozi” au “ushindi” vinawezekana. “Wokovu” huhifadhi upana wa neno la Kiebrania na kumtaja Yahweh kuwa mtendaji, bila kulifunga kwenye mafanikio ya kijeshi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa kauli unaendeleza uzito wa kisheria wa tamko la Sauli bila kuwa mgumu. Hakuna tanbihi iliyohitajika kwa rasimu hii.
