base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/004.yaml
  text: When the messengers came to Gibeah of Saul and spoke these words in the hearing of the people[a], all the people lifted up their voices and wept.
translation:
  language: sw
  text: Wajumbe walipofika Gibea ya Sauli, wakayasema maneno hayo mbele ya watu wote. Ndipo watu wote wakapaza sauti zao[a] na kulia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “wakainua sauti zao.” Huu ni msemo wa Kiebrania unaoonyesha kulia kwa sauti.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu ni watu waliotumwa kutoka Yabeshi, si malaika; “wajumbe” ni neno la kawaida na wazi.
- source_word: גִּבְעַת שָׁאוּל
  choice: Gibea ya Sauli
  rationale: Muundo huu unahifadhi uhusiano wa mji huo na Sauli bila kuufupisha kuwa “Gibea” pekee.
- source_word: וַיְדַבְּרוּ הַדְּבָרִים
  choice: wakayasema maneno hayo
  rationale: Huhifadhi maana halisi ya kusema maneno yaliyotajwa na pia ni Kiswahili cha kawaida.
- source_word: בְּאָזְנֵי הָעָם
  choice: watu wakisikia
  rationale: Hutoa maana ya msemo wa Kiebrania “masikioni mwa watu” kwa Kiswahili cha asili, huku ikidumisha wazo la watu kuyasikia moja kwa moja.
- source_word: וַיִּשְׂאוּ ... אֶת קוֹלָם
  choice: wakapaza sauti zao
  rationale: Ni msemo wa kawaida wa Kiswahili unaowasilisha kitendo cha kuinua sauti kwa maombolezo; wingi “sauti zao” unapatana na kiambishi cha wingi katika maandishi ya Kiebrania na unasikika kwa kawaida.
- source_word: וַיִּבְכּוּ
  choice: na kulia
  rationale: Kitenzi kinaonyesha kilio cha huzuni; “kulia” ndilo neno la kawaida na sahihi katika Kiswahili.
- source_word: כָל הָעָם
  choice: watu wote
  rationale: Huwasilisha kwa uwazi maana jumuishi ya kifungu cha Kiebrania.
