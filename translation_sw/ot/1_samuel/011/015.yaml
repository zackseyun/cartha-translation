id: 1SA.11.15
reference: 1 Samuel 11:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֵּלְכ֨וּ כָל הָ/עָ֜ם הַ/גִּלְגָּ֗ל וַ/יַּמְלִכוּ֩ שָׁ֨ם אֶת שָׁא֜וּל לִ/פְנֵ֤י יְהוָה֙ בַּ/גִּלְגָּ֔ל וַ/יִּזְבְּחוּ שָׁ֛ם זְבָחִ֥ים שְׁלָמִ֖ים לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּשְׂמַ֨ח שָׁ֥ם שָׁא֛וּל וְ/כָל אַנְשֵׁ֥י יִשְׂרָאֵ֖ל עַד מְאֹֽד־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/015.yaml
  text: So all the people went to Gilgal[a], and there they made Saul king before Yahweh at Gilgal. There they sacrificed peace offerings before Yahweh, and there Saul and all the men of Israel rejoiced greatly.
translation:
  language: sw
  text: Basi watu wote wakaenda Gilgali, na huko wakamweka Sauli kuwa mfalme mbele za Yahwe huko Gilgali. Huko wakatoa dhabihu za amani[a] mbele za Yahwe, na huko Sauli pamoja na wanaume wote wa Israeli wakafurahi sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka za ushirika” au “sadaka za hali njema.” Neno la Kiebrania linataja aina ya dhabihu za pamoja zilizohusishwa na amani, ukamilifu, na sherehe ya pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ כָל הָעָם
  choice: watu wote wakaenda
  rationale: Kauli hii inaendeleza simulizi kwa njia ya kawaida na kuonyesha kuwa jamii yote iliyokusanyika ilienda, si wanajeshi peke yao.
- source_word: הַגִּלְגָּל / בַּגִּלְגָּל
  choice: Gilgali
  rationale: Jina la mahali limetoholewa kwa umbo linalotumiwa kwa kawaida katika Kiswahili.
- source_word: וַיַּמְלִכוּ ... אֶת שָׁאוּל
  choice: wakamweka Sauli kuwa mfalme
  rationale: Hifili ya מלך humaanisha kumsababisha mtu atawale au kumweka kuwa mfalme; tafsiri hii haiingizi wazo la kumtia mafuta ambalo halitajwi hapa.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Usemi huu unaonyesha tendo lililofanywa katika uwepo wa Mungu, likiwa na uzito wa hadhara na ibada.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: וַיִּזְבְּחוּ ... זְבָחִים שְׁלָמִים
  choice: wakatoa dhabihu za sadaka za amani
  rationale: Kitenzi na nomino yake zinaeleza utoaji wa aina maalumu ya dhabihu; 'sadaka za amani' ni usemi mfupi na unaotambulika, huku maana nyingine zikihifadhiwa katika tanbihi.
- source_word: וַיִּשְׂמַח ... עַד מְאֹד
  choice: wakafurahi sana
  rationale: Kiswahili hutumia upatanisho wa wingi kwa kiima ambatano, na 'sana' huhifadhi nguvu ya עַד מְאֹד kwa lugha ya kawaida.
- source_word: וְכָל אַנְשֵׁי יִשְׂרָאֵל
  choice: pamoja na wanaume wote wa Israeli
  rationale: אַנְשֵׁי ni usemi wa kiume, kwa hiyo 'wanaume' huhifadhi taarifa ya kileksia badala ya kuibadili kuwa kundi lisiloainishwa kijinsia.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu; 'Yahwe' hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya dhabihu זְבָחִים שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za hali njema
  rationale: Neno hilo linahusu dhabihu za pamoja zinazohusishwa na amani, ukamilifu, ushirika, na sherehe; tafsiri kuu inatumia istilahi iliyo wazi huku tanbihi ikihifadhi upana wa maana.
- issue: Usemi wa kiume אַנְשֵׁי יִשְׂרָאֵל
  choice: wanaume wote wa Israeli
  alternative: Waisraeli wote; watu wote wa Israeli
  rationale: Tafsiri kuu inahifadhi umbo la kiume lililo wazi katika Kiebrania bila kulipanua kimyakimya kuwa kundi lisiloainishwa kijinsia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wa kawaida, wenye heshima, na unaoeleweka kwa wasomaji wa leo. Muundo wa vitenzi vya mfululizo unadumisha mwendo wa simulizi la Kiebrania.
