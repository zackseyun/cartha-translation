translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau “jema machoni penu” imehifadhiwa kwa kuwa inaeleweka na inadumisha taswira ya Kiebrania. Alama ya tanbihi [a] imewekwa baada ya kitenzi cha kusema ili kufafanua kauli inayofuata.
