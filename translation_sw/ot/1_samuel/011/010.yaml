  text: So the men of Jabesh said[a], “Tomorrow we will come out to you, and you may do to us whatever seems good in your eyes.”
translation:
  language: sw
  text: Basi watu wa Yabeshi wakasema[a], “Kesho tutatoka na kuja kwenu, nanyi mtutendee lolote linaloonekana kuwa jema machoni penu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tutatoka kwenda kwenu.” Kiebrania hakisemi wazi “tutajisalimisha,” ingawa muktadha unadokeza kujisalimisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Basi ... wakasema
  rationale: Waw ya usimulizi inaendeleza simulizi na hapa pia inaonyesha matokeo ya yaliyotangulia; “Basi” ni ya kawaida na ya heshima katika Kiswahili.
- source_word: אַנְשֵׁי יָבֵישׁ
  choice: watu wa Yabeshi
  rationale: Ingawa אַנְשֵׁי inaweza kumaanisha wanaume, katika muktadha huu inawakilisha wakazi au wawakilishi wa mji; “watu wa Yabeshi” ni Kiswahili cha kawaida bila kuongeza “Gileadi,” ambalo halipo katika mstari huu.
- source_word: מָחָר
  choice: Kesho
  rationale: Ni kielezi cha wakati kinachomaanisha siku inayofuata.
- source_word: נֵצֵא אֲלֵיכֶם
  choice: tutatoka kuja kwenu
  rationale: יצא maana yake ya moja kwa moja ni kutoka; “kuja kwenu” huwasilisha mtazamo wa wanaoambiwa. Tafsiri ya “tutajisalimisha” ingeweka wazi maana inayodokezwa na muktadha lakini isiyotajwa moja kwa moja katika Kiebrania.
- source_word: וַעֲשִׂיתֶם לָּנוּ
  choice: nanyi mtutendee
  rationale: Muundo huu unaeleza watakachoruhusiwa au watakachoweza kuwafanyia baada ya wao kutoka; Kiswahili hiki kinahifadhi kauli bila kuifanya amri ya moja kwa moja.
- source_word: כְּכָל הַטּוֹב בְּעֵינֵיכֶם
  choice: lolote linaloonekana kuwa jema machoni penu
  rationale: Hii inadumisha nahau ya Kiebrania inayohusu jambo linaloonekana kuwa jema au sawa kwa mtazamo wa waambiwa, badala ya kuifupisha kuwa “lolote mtakalo.”
