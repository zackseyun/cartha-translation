base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/009.yaml
  text: And it happened[a], when he turned his back to go from Samuel, that God gave him another heart[b], and all these signs came to pass on that day.
translation:
  language: sw
  text: Ikawa, alipogeuka ili aondoke kwa Samweli[a], Mungu akaubadili moyo wake ukawa mwingine[b], na ishara hizi zote zikatokea siku hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania husema kihalisi, “alipogeuza bega lake ili aondoke kwa Samweli,” yaani, alipogeuka ili kuondoka.
    reason: lexical_alternative
  - marker: b
    text: Au, “Mungu akamgeuzia moyo mwingine.” Kihalisi, Kiebrania husema kwamba Mungu “alimgeuzia moyo mwingine,” usemi unaoeleza badiliko la ndani alilofanywa na Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Ikawa
  rationale: Huhifadhi fomula ya simulizi ya Kiebrania kwa mtindo mfupi na wenye hadhi unaoeleweka katika Kiswahili.
- source_word: כְּהַפְנֹתוֹ שִׁכְמוֹ
  choice: alipogeuka
  rationale: Kiebrania husema kihalisi ‘alipogeuza bega lake,’ lakini hapa ni nahau ya kugeuka ili kuondoka. Tafsiri hii ni ya asili katika Kiswahili, huku tanbihi ikihifadhi picha halisi.
- source_word: לָלֶכֶת מֵעִם שְׁמוּאֵל
  choice: ili aondoke kwa Samweli
  rationale: Huwasilisha kusudi la kuondoka mahali alipokuwa pamoja na Samweli bila kuongeza maelezo yasiyokuwapo.
- source_word: וַיַּהֲפָךְ
  choice: akaubadili
  rationale: Kitenzi kina maana ya kugeuza au kubadili. ‘Akaubadili’ huhifadhi tendo la Mungu la kufanya badiliko kuliko kukibadili kuwa kitenzi cha kutoa.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Nomino hii inarejelea Mungu wa Israeli na inaambatana na tendo la umoja katika muktadha huu.
- source_word: לֵב אַחֵר
  choice: moyo wake ukawa mwingine
  rationale: Huhifadhi wazo la ‘moyo mwingine’ na kulieleza kwa Kiswahili cha kawaida bila kulifafanua kuwa kuzaliwa upya, uongofu, au ujasiri tu.
- source_word: וַיָּבֹאוּ
  choice: zikatokea
  rationale: Kwa ishara kuwa kiima, ‘zikatokea’ huonyesha kwamba zilitukia bila kuongeza dhana ya kutimizwa ambayo haijaelezwa moja kwa moja na kitenzi.
- source_word: כָּל הָאֹתוֹת הָאֵלֶּה
  choice: ishara hizi zote
  rationale: Ni tafsiri ya moja kwa moja inayorejelea ishara ambazo Samweli alikuwa ametabiri.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Ni usemi wa kawaida na sahihi wa wakati katika Kiswahili.
theological_decisions:
- issue: Asili ya badiliko la ndani la Sauli katika usemi ‘Mungu alimgeuzia moyo mwingine’
  choice: Mungu akaubadili moyo wake ukawa mwingine
  alternative: Mungu akampa moyo mwingine
  rationale: Tafsiri iliyochaguliwa huhifadhi kitenzi cha Kiebrania cha kugeuza au kubadili pamoja na fumbo la ‘moyo mwingine.’ Haifafanui badiliko hilo kuwa kuzaliwa upya, kuongoka, kubadilishwa tabia kabisa, au kupewa ujasiri wa kifalme tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa lakini wenye hadhi. Nahau ya Kiebrania imetafsiriwa kwa lugha ya kawaida katika matini na picha yake halisi kuhifadhiwa katika tanbihi.
