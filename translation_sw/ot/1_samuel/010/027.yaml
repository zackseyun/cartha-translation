base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/027.yaml
  text: But worthless men said[a], “How can this man save us?” And they despised him and did not bring him a gift. But he was like one keeping silent.
translation:
  language: sw
  text: Lakini watu waovu walisema, “Huyu atatuokoaje?” Wakamdharau, wala hawakumletea zawadi. Lakini yeye alikuwa kama mtu aliyekaa kimya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kana kwamba alikuwa kiziwi.” Usemi wa Kiebrania unaweza kueleza kunyamaza kwa makusudi mtu anapochokozwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בְלִיַּעַל
  choice: watu wasiofaa
  rationale: Nahau hii, ambayo kihalisi ni ‘wana wa kutofaa,’ inawaeleza watu wa tabia mbaya na wasiotii. ‘Watu wasiofaa’ huhifadhi nguvu ya Kiebrania kwa lugha ya kawaida bila kuongeza maelezo yasiyomo.
- source_word: מַה יֹּשִׁיעֵנוּ זֶה
  choice: Huyu atatuokoaje?
  rationale: Muundo wa swali unaonyesha changamoto yenye mashaka na dharau. ‘Huyu’ huhifadhi msisitizo wa זֶה, na ‘atatuokoaje?’ huwasilisha maana ya kitenzi ישׁע katika kausativi.
- source_word: וַיִּבְזֻהוּ
  choice: Wakamdharau
  rationale: Kitenzi בזה humaanisha kumdharau au kumwona mtu kuwa asiye na thamani; ‘wakamdharau’ ni tafsiri fupi, ya moja kwa moja na ya asili katika simulizi.
- source_word: מִנְחָה
  choice: zawadi
  rationale: Katika muktadha wa kifalme neno hili ni zawadi au kitu kinacholetwa kwa mtawala, na si lazima sadaka ya ibada. ‘Zawadi’ haifanyi maana ya kisiasa kuwa maalumu kupita kiasi.
- source_word: כְּמַחֲרִישׁ
  choice: kama mtu aliyekaa kimya
  rationale: Umbo hili linaeleweka kwa kawaida kuwa kunyamaza, huku kiambishi כְּ kikionyesha ulinganisho. Tafsiri hii huhifadhi tashbihi na kutoitafsiri nia yake kupita kiasi.
- source_word: וַיְהִי
  choice: alikuwa
  rationale: Hapa היה huanzisha hali ya Sauli baada ya dharau hiyo. ‘Alikuwa’ huunganika moja kwa moja na kishazi cha ulinganisho ‘kama mtu aliyekaa kimya.’
theological_decisions:
- issue: Jinsi mwitikio wa Sauli unavyoelezwa
  choice: Sauli alikuwa kama mtu aliyekaa kimya mbele ya dharau
  alternative: Sauli alikuwa kana kwamba hasikii matusi yao
  rationale: Kiebrania כְּמַחֲרִישׁ kinaweza kueleweka kuwa kunyamaza au kutenda kana kwamba mtu hasikii. Matini kuu inadumisha maana ya moja kwa moja ya ukimya, huku tanbihi ikihifadhi uwezekano wa usemi wa kutosikia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Muundo ni wazi kwa wasomaji wa kawaida; tashbihi ya Kiebrania na utata wake kuhusu ukimya au kutosikia vimehifadhiwa.
