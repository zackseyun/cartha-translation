    reason: lexical_alternative
  revision_rationale: The revision strengthens the rendering of the Hebrew idiom בְנֵי בְלִיַּעַל from the potentially mild “watu wasiofaa” to the natural and morally appropriate “watu waovu.” The footnote is adjusted to state the viable ‘deaf’ alternative more idiomatically. All other wording faithfully retains the source’s wording, narrative tone, and ambiguity.
