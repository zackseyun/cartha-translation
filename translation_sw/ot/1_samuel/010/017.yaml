  text: וַ/יַּצְעֵ֤ק שְׁמוּאֵל֙ אֶת הָ/עָ֔ם אֶל יְהוָ֖ה הַ/מִּצְפָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/017.yaml
  text: Then Samuel called the people together to Yahweh at Mizpah[a].
translation:
  language: sw
  text: Kisha Samueli akawakusanya watu mbele za Yahweh huko Mispa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Samueli akawaita watu wakusanyike kwa Yahweh huko Mispa.” Kitenzi cha Kiebrania kinaweza kumaanisha kuita au kuitisha mkutano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצְעֵק
  choice: akawakusanya
  rationale: Katika muktadha huu, kitenzi kina maana ya kuwaita watu wakusanyike. “Akawakusanya” ni Kiswahili cha kawaida kinachoonyesha kuitishwa kwa mkutano bila kutumia maana ya kawaida ya ‘kulia kwa sauti.’
- source_word: אֶת הָעָם
  choice: watu
  rationale: Neno עָם hapa linamaanisha watu wa Israeli walioitwa kukusanyika; “watu” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אֶל
  choice: mbele za
  rationale: Ingawa אֶל kwa kawaida humaanisha ‘kwa/kuelekea,’ hapa inaeleza kukusanywa kwa watu katika uwepo wa Yahweh. “Mbele za” huwasilisha uhusiano huo kwa Kiswahili cha asili huku tanbihi ikihifadhi uwezekano wa tafsiri ya karibu zaidi na muundo wa Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika matini.
- source_word: הַמִּצְפָּה
  choice: huko Mispa
  rationale: מִצְפָּה ni jina la mahali hapa. “Huko Mispa” linaonyesha kwa Kiswahili cha kawaida mahali ambapo watu walikusanywa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Matini ina jina la agano יְהוָה. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa mkutano na Yahweh katika kifungu אֶל־יְהוָה
  choice: mbele za Yahweh
  alternative: kwa Yahweh
  rationale: “Mbele za Yahweh” ni usemi wa asili unaoeleweka kuwa mkutano ulifanyika katika uwepo wake; “kwa Yahweh” hufuata kihusishi kwa karibu zaidi lakini inaweza kusikika kana kwamba watu walikuwa zawadi au walikabidhiwa kwake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. “Akawakusanya” linaepuka tafsiri isiyo ya kawaida ya ‘akapiga kelele kwa watu,’ na “huko Mispa” linaweka wazi mahali pa mkutano.
