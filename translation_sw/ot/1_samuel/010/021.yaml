base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/021.yaml
  text: Then he brought the tribe of Benjamin near by its clans[a], and the clan of the Matrites was taken. Then Saul son of Kish was taken, but when they sought him[b], he could not be found.
translation:
  language: sw
  text: Kisha akalileta karibu kabila la Benyamini kwa koo zake[a], na ukoo wa Wamatri ukachukuliwa. Kisha Sauli mwana wa Kishi akachukuliwa[b], lakini walipomtafuta, hakupatikana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “kwa familia zake.” Neno la Kiebrania linaweza kumaanisha familia pana au koo ndani ya kabila.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania linalotafsiriwa “akachukuliwa” hapa linaweza kumaanisha kuonyeshwa au kuteuliwa kwa kura katika muktadha huu, si kukamatwa vitani.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: akalileta karibu
  rationale: Hifili ya קרב ina maana ya kuleta karibu au kuwasilisha. Kauli hii inadumisha hatua ya utaratibu wa uteuzi bila kuongeza maelezo yasiyokuwapo katika maandishi.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: kabila la Benyamini
  rationale: “Kabila” ni neno la kawaida la Kiswahili kwa שֵׁבֶט katika mpangilio wa kijamii wa Israeli.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: kwa koo zake
  rationale: מִשְׁפָּחָה hapa ni kundi la jamaa ndani ya kabila; “koo” linaonyesha vizuri hatua ya kabila kwenda kwenye vikundi vidogo vya kifamilia.
- source_word: וַתִּלָּכֵד / וַיִּלָּכֵד
  choice: ukateuliwa kwa kura / akateuliwa kwa kura
  rationale: Nifali ya לכד kwa kawaida inaweza kumaanisha kushikwa, lakini katika muktadha huu inaeleza mtu au kundi lililoonyeshwa na kura. Kiswahili “akachukuliwa” au “akashikwa” kingedokeza kukamatwa, hivyo maana ya kimuktadha imewekwa wazi.
- source_word: מִשְׁפַּחַת הַמַּטְרִי
  choice: ukoo wa Wamatri
  rationale: “Wamatri” linahifadhi jina la kundi linalotokana na umbo la Kiebrania הַמַּטְרִי, huku “ukoo” likidumisha kiwango cha kijamii kinachokusudiwa.
- source_word: שָׁאוּל בֶּן קִישׁ
  choice: Sauli mwana wa Kishi
  rationale: Hili ni umbo la kawaida na la asili la Kiswahili kwa jina na patronimia ya Kiebrania.
- source_word: וַיְבַקְשֻׁהוּ
  choice: walipomtafuta
  rationale: בקשׁ ina maana ya kutafuta; kiunganishi “walipo-” kinaonyesha kwa kawaida uhusiano wa wakati katika simulizi.
- source_word: וְלֹא נִמְצָא
  choice: hakupatikana
  rationale: Nifali ya מצא ina maana ya kupatikana. “Hakupatikana” ni kauli fupi na ya kawaida inayoonyesha kuwa utafutaji haukufanikiwa.
