translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na hadhi ya simulizi la Maandiko. “Akalileta karibu” huhifadhi taswira ya utaratibu wa kumleta mbele, huku “akateuliwa kwa kura” ikizuia maana potovu ya kukamatwa. Majina yameandikwa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili.
