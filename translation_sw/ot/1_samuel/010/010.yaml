  text: וַ/יָּבֹ֤אוּ שָׁם֙ הַ/גִּבְעָ֔תָ/ה וְ/הִנֵּ֥ה חֶֽבֶל נְבִאִ֖ים לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֤ח עָלָי/ו֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּתְנַבֵּ֖א בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/010.yaml
  text: When they came there to the hill[a], behold, a band of prophets came to meet him, and the Spirit of God rushed upon him, and he prophesied among them.
translation:
  language: sw
  text: Walipofika huko, kwenye kilima[a], tazama, kundi la manabii likaja kumlaki. Roho wa Mungu akamjia kwa nguvu, naye akatabiri kati yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Gibea.” Umbo la Kiebrania linaweza kueleweka kama jina la mahali au kama “kwenye kilima.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַגִּבְעָתָה
  choice: kwenye kilima
  rationale: Neno linaweza kueleweka kama nomino ya kawaida, ‘kilima,’ au kama jina la mahali, ‘Gibea.’ Kutumia ‘kwenye kilima’ kunafuata uwezekano unaoungwa mkono na kibainishi cha Kiebrania, huku tanbihi ikihifadhi usomaji wa jina la mahali.
- source_word: חֶבֶל נְבִאִים
  choice: kundi la manabii
  rationale: Katika muktadha huu חֶבֶל humaanisha kundi la watu, si kamba. ‘Kundi la manabii’ ni Kiswahili cha kawaida na wazi.
- source_word: לִקְרָאתוֹ
  choice: likaja kumlaki
  rationale: Kirai hiki kinaonyesha mwendo wa kwenda kukutana naye. ‘Kumlaki’ ni neno la heshima na linalofaa masimulizi ya kibiblia.
- source_word: רוּחַ אֱלֹהִים
  choice: Roho wa Mungu
  rationale: Muktadha unaonyesha Roho wa Mungu akimwezesha Sauli; tafsiri hii inahifadhi maana ya moja kwa moja bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: וַתִּצְלַח עָלָיו
  choice: akamjia kwa nguvu
  rationale: Kitenzi צלח pamoja na ‘roho’ katika Samueli huonyesha ujio wenye nguvu na athari. Kiswahili hiki ni cha asili na kinahifadhi msisitizo huo bila kudokeza kwa lazima mwendo wa kimwili.
- source_word: וַיִּתְנַבֵּא
  choice: akatabiri
  rationale: Hitpaeli ya נבא hapa inaeleza kushiriki katika shughuli ya kinabii. ‘Akatabiri’ ni tafsiri pana na ya kawaida isiyobainisha zaidi namna ya tendo hilo.
- source_word: בְּתוֹכָם
  choice: kati yao
  rationale: Kirai kinaonyesha kwamba Sauli alifanya tendo hilo akiwa miongoni mwa kundi la manabii.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: ‘Tazama’ huhifadhi kazi ya הִנֵּה ya kuvuta fikira kwa tukio linalojitokeza ghafla na inafaa sajili ya Kiswahili cha Biblia.
theological_decisions:
- issue: Tafsiri ya רוּחַ אֱלֹהִים
  choice: Roho wa Mungu
  alternative: roho kutoka kwa Mungu
  rationale: Muktadha wa ishara na uwezeshaji wa Sauli unaelekeza kwa Roho wa Mungu mwenyewe. Tafsiri hii huhifadhi uzito wa kitheolojia wa simulizi bila kuingiza ufafanuzi wa baadaye usiotajwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye heshima. ‘Tazama’ na ‘kumlaki’ hudumisha ladha ya masimulizi ya kibiblia bila kufanya sentensi kuwa ya kizamani. Alama ya tanbihi [a] imewekwa katika matini kuu.
