base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/001.yaml
  text: Then Samuel took the flask of oil and poured it on his head and kissed him[a], and said, “Has not Yahweh anointed you as ruler over his inheritance?”
translation:
  language: sw
  text: Ndipo Samweli akachukua chupa ya mafuta, akayamimina juu ya kichwa cha Sauli, akambusu, kisha akasema, “Je, si Yahwe aliyekutia mafuta uwe mtawala[a] juu ya urithi wake?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kiongozi” au “mkuu.” Neno la Kiebrania linamaanisha mtu aliyewekwa kuongoza au kutawala, na maana yake si sawa kabisa na cheo cha baadaye cha “mfalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּךְ הַשֶּׁמֶן
  choice: chupa ya mafuta
  rationale: Neno פַּךְ humaanisha chombo kidogo cha kuhifadhia kimiminika. “Chupa” ni neno la kawaida na la sasa linalohifadhi picha halisi bila kutumia istilahi ya kizamani.
- source_word: וַיִּצֹק עַל רֹאשׁוֹ
  choice: akayamimina juu ya kichwa chake
  rationale: Kitenzi יצק ni “mimina,” na עַל רֹאשׁוֹ ni “juu ya kichwa chake.” Kiwakilishi cha ngeli katika “akayamimina” kinarejelea mafuta.
- source_word: וַיִּשָּׁקֵהוּ
  choice: akambusu
  rationale: Kitenzi נשׁק hapa kinamaanisha wazi “busu.” Tafsiri hii huhifadhi tendo lenyewe bila kulificha au kulifafanua kupita maandishi.
- source_word: הֲלוֹא כִּי
  choice: Je, si
  rationale: Muundo huu unaanzisha swali la balagha linalotarajia jibu la kukubali. “Je, si” ni wa kawaida katika Kiswahili na huhifadhi nguvu ya swali hilo.
- source_word: מְשָׁחֲךָ
  choice: aliyekutia mafuta
  rationale: משׁח ni istilahi ya kawaida ya kumpaka au kumtia mtu mafuta kwa ajili ya kuwekwa rasmi katika wajibu. “Kukutia mafuta” huhifadhi tendo la ibada pamoja na maana ya uteuzi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetolewa kama “Yahwe,” badala ya kubadilishwa na cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: נַחֲלָתוֹ
  choice: urithi wake
  rationale: נַחֲלָה humaanisha urithi au milki iliyogawiwa. “Urithi wake” huhifadhi wazo la agano kwamba Israeli ni mali ya Yahwe.
- source_word: לְנָגִיד
  choice: uwe mtawala
  rationale: נָגִיד humtaja aliyewekwa juu ya wengine kuongoza au kutawala. “Mtawala” huhifadhi nguvu ya mamlaka ya nafasi hiyo bila kuifanya moja kwa moja kuwa cheo mahsusi cha “mfalme.”
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya נָגִיד katika kuwekwa kwa Sauli
  choice: mtawala
  alternative: kiongozi; mkuu; mwana wa mfalme
  rationale: Katika muktadha huu Sauli anawekwa rasmi kabla ya kutambuliwa hadharani kuwa mfalme. “Mtawala” huonyesha mamlaka ya kuongoza bila kusawazisha נָגִיד kabisa na מֶלֶךְ, “mfalme.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mfuatano wa vitenzi umetolewa kwa mtindo wa masimulizi unaosikika kawaida; “kisha” husaidia kusomeka bila kubadili mfuatano wa matendo. Alama ya tanbihi imewekwa baada ya “mtawala,” neno linalohusika moja kwa moja.
