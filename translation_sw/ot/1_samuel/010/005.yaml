language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אַ֣חַר כֵּ֗ן תָּבוֹא֙ גִּבְעַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁר שָׁ֖ם נְצִבֵ֣י פְלִשְׁתִּ֑ים וִ/יהִי֩ כְ/בֹאֲ/ךָ֨ שָׁ֜ם הָ/עִ֗יר וּ/פָגַעְתָּ֞ חֶ֤בֶל נְבִיאִים֙ יֹרְדִ֣ים מֵֽ/הַ/בָּמָ֔ה וְ/לִ/פְנֵי/הֶ֞ם נֵ֤בֶל וְ/תֹף֙ וְ/חָלִ֣יל וְ/כִנּ֔וֹר וְ/הֵ֖מָּה מִֽתְנַבְּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/005.yaml
  text: After that you will come to Gibeath-ha-Elohim[a], where the Philistine garrison is. And when you enter there, into the city, you will meet a band of prophets coming down from the high place, with harp, tambourine, flute, and lyre before them[c][b], and they will be prophesying.
translation:
  language: sw
  text: Baada ya hayo, utafika Gibea ya Mungu[a], ambako kuna kituo cha kijeshi cha Wafilisti[b]. Itakuwa kwamba utakapofika huko mjini, utakutana na kundi la manabii wakishuka kutoka mahali pa juu pa ibada, wakiwa na mbele yao kinubi, tari, filimbi na zeze[c], nao watakuwa wakitoa unabii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kilima cha Mungu.” Kiebrania kinaweza kueleweka kuwa jina la mahali, “Gibea ya Mungu,” au maelezo ya eneo hilo.
    reason: alternative_reading
  - marker: b
    text: Au “kituo cha Wafilisti” au “maofisa wa Wafilisti.” Neno la Kiebrania linaweza kumaanisha kituo cha kijeshi au maofisa waliowekwa hapo; muktadha unaelekea kuunga mkono maana ya kijeshi.
    reason: alternative_reading
  - marker: c
    text: Utambulisho kamili wa ala hizi za kale hauna uhakika. “Kinubi” (nebel) huenda kilikuwa kinanda au ala nyingine ya nyuzi, na “filimbi” huenda ilikuwa aina ya bomba la kupuliza.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבְעַת הָאֱלֹהִים
  choice: Gibea ya Mungu
  rationale: Kirai hiki huenda ni jina la mahali, lakini pia kinaweza kuwa maelezo yenye maana ya “kilima cha Mungu.” Muundo wa jina unaotambulika kwa Kiswahili umetumiwa katika matini, huku utata huo ukihifadhiwa katika tanbihi.
- source_word: נְצִבֵי פְלִשְׁתִּים
  choice: kituo cha kijeshi cha Wafilisti
  rationale: Neno נְצִיב linaweza kumaanisha kituo cha kijeshi au maofisa waliowekwa mahali fulani. Muktadha wa eneo na simulizi linalofuata unaunga mkono zaidi maana ya kituo cha kijeshi.
- source_word: וִיהִי כְבֹאֲךָ שָׁם הָעִיר
  choice: Utakapoingia huko mjini
  rationale: Hii inatoa kwa Kiswahili cha kawaida maana ya muda ya muundo wa Kiebrania, huku ikiwakilisha שָׁם na הָעִיר bila uradidi usio wa kawaida.
- source_word: וּפָגַעְתָּ
  choice: utakutana na
  rationale: Katika muktadha huu פגע humaanisha kukutana na au kujikuta mbele ya mtu; “utakutana na” ni ya kawaida na wazi.
- source_word: חֶבֶל נְבִיאִים
  choice: kundi la manabii
  rationale: חבל hapa humaanisha kundi au jamii ya watu wanaosafiri pamoja. “Kundi” ni neno la sasa, wazi na lisilo na maana za ziada.
- source_word: יֹרְדִים מֵהַבָּמָה
  choice: wakishuka kutoka mahali pa juu pa ibada
  rationale: במה ni eneo la ibada lililoinuka. Tafsiri hii inaeleza kazi yake ya kiibada bila kulifanya moja kwa moja kuwa hekalu au madhabahu.
- source_word: נֵבֶל
  choice: kinubi
  rationale: Ni ala ya nyuzi ambayo utambulisho wake kamili haujulikani. “Kinubi” ni makadirio yanayoeleweka, huku uwezekano wa ala nyingine ya jamii ya kinanda cha nyuzi ukitajwa katika tanbihi.
- source_word: תֹף
  choice: tari
  rationale: תֹף kwa kawaida ni ala ndogo ya kupigwa kwa mkono, na “tari” ni neno fasaha la Kiswahili kwa ala hiyo.
- source_word: חָלִיל
  choice: filimbi
  rationale: Ni ala ya kupuliza; “filimbi” ni tafsiri ya kawaida na inayoeleweka, ingawa umbo lake kamili la kale halijulikani.
- source_word: כִּנּוֹר
  choice: zeze
  rationale: כִּנּוֹר ilikuwa ala ya nyuzi ya aina ya lyre. “Zeze” huitofautisha na נֵבֶל iliyotafsiriwa “kinubi,” bila kudai usahihi usiowezekana kuhusu muundo wake wa kale.
- source_word: וְהֵמָּה מִתְנַבְּאִים
  choice: nao watakuwa wakitoa unabii
  rationale: Tafsiri hii inadumisha uhusiano na tendo la kinabii bila kulifanya kuwa utabiri wa wakati ujao pekee wala kufafanua kuwa hali ya msisimko wa kidini.
theological_decisions:
- issue: Aina ya shughuli ya kinabii katika מִתְנַבְּאִים
  choice: watakuwa wakitoa unabii
  alternative: watakuwa katika hali ya kinabii; watakuwa wakisema maneno yaliyoongozwa na Mungu
  rationale: Kitenzi kinaonyesha wazi shughuli ya kinabii, lakini hakibainishi ikiwa ilikuwa hotuba ya msisimko, sifa zilizoongozwa na Mungu, au aina nyingine ya usemi wa kinabii. Tafsiri haifungi maana katika mojawapo ya maelezo hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa sasa na unaosomeka kwa urahisi. “Mahali pa juu pa ibada” linafafanua maana ya kiibada ya במה kwa msomaji wa kawaida. Majina ya ala yametolewa kwa istilahi zinazofahamika, huku kutokuwa na uhakika wa kihistoria kukihifadhiwa katika tanbihi.
