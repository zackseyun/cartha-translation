  text: וַ/יַּקְרֵ֣ב שְׁמוּאֵ֔ל אֵ֖ת כָּל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלָּכֵ֖ד שֵׁ֥בֶט בִּנְיָמִֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/020.yaml
  text: Then Samuel brought near all the tribes of Israel[a], and the tribe of Benjamin was taken.
translation:
  language: sw
  text: Kisha Samweli akayaleta mbele makabila yote ya Israeli, na kabila la Benyamini likachukuliwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “likachaguliwa.” Kiebrania kinasema kihalisi “likachukuliwa”; hapa maana yake ni kwamba lilichaguliwa kwa kura.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: akayaleta mbele
  rationale: Hifili ya קרב ina maana ya kuleta karibu au kuwasilisha. Katika muktadha huu wa uchaguzi kwa kura, “akayaleta mbele” ni Kiswahili cha kawaida kinachoonyesha kuwa Samweli aliyawasilisha makabila kwa hatua ya uchaguzi.
- source_word: שְׁמוּאֵל
  choice: Samweli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: makabila yote ya Israeli
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kishazi hiki, ikihifadhi maana ya ujumla.
- source_word: וַיִּלָּכֵד
  choice: likachukuliwa
  rationale: Nifali ya לכד kwa msingi ina maana ya “kuchukuliwa” au “kutekwa.” Hapa neno hilo linaeleza matokeo ya uchaguzi kwa kura. “Likachukuliwa” linahifadhi taswira ya Kiebrania, huku tanbihi ikifafanua maana yake katika muktadha.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: kabila la Benyamini
  rationale: Hili ni umbo la kawaida na wazi la Kiswahili kwa nomino ya umoja inayofuatwa na jina la ukoo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi “akayaleta mbele” ni wa kawaida kuliko tafsiri ngumu ya “akayaleta karibu,” na “likachukuliwa” huhifadhi kwa makusudi usemi wa Kiebrania huku tanbihi ikieleza uchaguzi kwa kura.
