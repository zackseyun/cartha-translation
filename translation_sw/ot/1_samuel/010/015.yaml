  text: Then Saul’s uncle said[a], “Please tell me what Samuel said to you.”
translation:
  language: sw
  text: Kisha mjomba wa Sauli akasema, “Tafadhali niambie Samweli aliwaambia nini[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kiebrania, “ninyi” ni ya wingi; huenda ikimaanisha Sauli na mtumishi wake pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akasema
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: דּוֹד שָׁאוּל
  choice: mjomba wake Sauli
  rationale: דּוֹד humaanisha mjomba katika muktadha huu wa undugu; muundo huu ni wa asili katika Kiswahili.
- source_word: הַגִּידָה נָּא לִי
  choice: Tafadhali niambie
  rationale: Hiphil imperative ya נגד ni ‘ambia, eleza, toa habari,’ na נָא huonyesha ombi la adabu, linalowasilishwa kwa “Tafadhali.”
- source_word: מָה
  choice: nini
  rationale: Neno la kuuliza מָה linatumika hapa kama kiambajengo cha sentensi tegemezi baada ya “niambie”; “nini” ni la kawaida na wazi.
- source_word: אָמַר
  choice: aliwaambia
  rationale: אָמַר ni kitenzi cha kawaida cha kusema. Katika Kiswahili, muundo “aliwaambia nini” unasikika wa asili na pia huwezesha kuhifadhi wingi wa לָכֶם.
- source_word: לָכֶם
  choice: aliwaambia
  rationale: Kiambishi -wa- kinahifadhi wazi nafsi ya pili wingi ya Kiebrania, ikimaanisha Sauli pamoja na mwenzake au kundi analohusishwa nalo.
- source_word: שְׁמוּאֵל
  choice: Samweli
  rationale: Jina limetolewa kwa umbo la Kiswahili linalotumika kwa kawaida.
