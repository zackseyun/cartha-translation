  yaml_path: translation/ot/1_samuel/010/026.yaml
  text: Saul also went to his home at Gibeah[b][a], and with him went the valiant men whose hearts God had touched.
translation:
  language: sw
  text: Sauli pia akaenda nyumbani kwake huko Gibea, na mashujaa[a] ambao Mungu alikuwa ameigusa mioyo yao[b] wakaenda pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanaume hodari,” au “wapiganaji.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “ambao Mungu alikuwa ameigusa mioyo yao”; usemi huu unaonyesha kwamba Mungu aliathiri mwelekeo wao wa ndani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: pia
  rationale: Huonyesha nyongeza na mwendelezo wa simulizi kwa Kiswahili cha kawaida na kifupi.
- source_word: הָלַךְ לְבֵיתוֹ גִּבְעָתָה
  choice: akaenda nyumbani kwake huko Gibea
  rationale: Huhifadhi wazo la kwenda nyumbani kwake pamoja na Gibea kuwa mahali alipokwenda, kwa mpangilio wa asili katika Kiswahili.
- source_word: וַיֵּלְכוּ עִמּוֹ
  choice: wakaenda pamoja naye
  rationale: Huhifadhi mfuatano wa simulizi na maana ya kuandamana na Sauli.
- source_word: הַחַיִל
  choice: mashujaa
  rationale: Katika muktadha huu neno linarejelea kundi la wanaume hodari na wenye uwezo, huenda wa kivita, wala si jeshi lote kama taasisi.
- source_word: אֲשֶׁר נָגַע אֱלֹהִים בְּלִבָּם
  choice: ambao Mungu alikuwa ameigusa mioyo yao
  rationale: Huhifadhi sitiari ya Kiebrania kuhusu tendo la Mungu juu ya utu wao wa ndani bila kulifafanua kupita kiasi kuwa uongofu, shuruti, au hisia tu.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hapa neno linamtaja Mungu wa Israeli, hivyo 'Mungu' ndilo sawia la kawaida.
- source_word: לֵב
  choice: mioyo
  rationale: Katika mtazamo wa Kiebrania, moyo unaweza kujumuisha nia, fikra, mapenzi, na mwelekeo wa ndani; 'mioyo' hudumisha picha ya chanzo.
theological_decisions:
- issue: Asili ya tendo la Mungu la kuigusa mioyo ya mashujaa
  choice: Kudumisha sitiari ya kwamba Mungu aliigusa mioyo yao bila kubainisha utaratibu wa kiteolojia
  alternative: Mungu alikuwa ameichochea mioyo yao; Mungu alikuwa ameelekeza nia zao
  rationale: Andiko linathibitisha kwamba Mungu alianzisha athari katika utu wao wa ndani na kuwaelekeza waandamane na Sauli, lakini halisemi kuwa ilikuwa kuzaliwa upya, shuruti isiyozuilika, au kutiwa moyo kihisia tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi wenye viambishi vya mfululizo umetumiwa kwa urahisi wa kusoma. Sitiari ya 'kuigusa mioyo' imehifadhiwa ili kutunza mvutano na upana wa maana ya chanzo.
