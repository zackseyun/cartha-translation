  yaml_path: translation/ot/1_samuel/010/007.yaml
  text: And when these signs come to you[a], do whatever your hand finds to do, for God is with you.
translation:
  language: sw
  text: Ishara hizi zitakapokujia, fanya lolote ambalo mkono wako utapata kufanya[a], kwa maana Mungu yuko pamoja nawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fanya lolote lililo katika uwezo wako.” Nahau ya Kiebrania inasema kihalisi, “lolote ambalo mkono wako utapata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: zitakapokujia
  rationale: Muundo huu unaanzisha hali ya wakati ujao. Katika Kiswahili cha kawaida, maana yake inaunganishwa kwa kawaida na kitenzi kinachofuata kwa kutumia ‘-takapo-’.
- source_word: תבאינה הָאֹתוֹת הָאֵלֶּה לָךְ
  choice: Ishara hizi zitakapokujia
  rationale: Kitenzi בוא pamoja na ‘ishara’ kinaweza kumaanisha kuja au kutokea. ‘Zitakapokujia’ huhifadhi taswira halisi ya Kiebrania na ni ya asili katika Kiswahili.
- source_word: עֲשֵׂה לְךָ
  choice: fanya
  rationale: Ingawa לְךָ huongeza mguso wa kibinafsi, kuutafsiri wazi kuwa ‘jifanyie’ kungeleta maana isiyokusudiwa ya kujinufaisha. Amri ‘fanya’ huwasilisha wazo hilo kwa Kiswahili cha asili.
- source_word: אֲשֶׁר תִּמְצָא יָדֶךָ
  choice: lolote ambalo mkono wako utapata kufanya
  rationale: Hii huhifadhi nahau halisi ya Kiebrania huku ikiongeza ‘kufanya,’ ambalo tendo lake linaeleweka katika muktadha. Maana yake ni jambo lolote lililo ndani ya uwezo au fursa ya Sauli.
- source_word: כִּי
  choice: kwa maana
  rationale: Hapa כִּי hutoa sababu ya amri, hivyo ‘kwa maana’ ni kiunganishi cha wazi na chenye hadhi.
- source_word: הָאֱלֹהִים
  choice: Mungu
  rationale: Licha ya kuwa na kibainishi katika Kiebrania, hapa neno hilo linamtaja kwa uhakika Mungu wa Israeli; ‘Mungu’ ndiyo tafsiri ya asili katika Kiswahili.
- source_word: עִמָּךְ
  choice: yuko pamoja nawe
  rationale: Kirai hiki kinaeleza uwepo na msaada wa Mungu kwa Sauli. ‘Yuko pamoja nawe’ ni tafsiri ya moja kwa moja na ya asili.
theological_decisions:
- issue: Tafsiri ya הָאֱלֹהִים yenye kibainishi
  choice: Mungu
  alternative: huyo Mungu
  rationale: Kibainishi cha Kiebrania hakihitaji kuonyeshwa kwa ‘huyo’ hapa. ‘Mungu’ hudumisha rejeo maalumu kwa Mungu wa Israeli bila kuongeza msisitizo usiokuwamo.
- issue: Upeo wa amri ya kutenda
  choice: fanya lolote ambalo mkono wako utapata kufanya
  alternative: fanya lolote unalotaka
  rationale: Maneno haya hayatoi ruhusa isiyo na mipaka ya kufanya chochote anachotamani Sauli; yanamhimiza kutumia fursa au uwezo ulio mbele yake kwa kuwa Mungu yuko pamoja naye. Nahau imehifadhiwa ili kutoipanua kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau ya ‘mkono wako’ imehifadhiwa katika matini kwa uaminifu kwa chanzo, huku tanbihi ikifafanua maana yake kwa msomaji wa kawaida.
