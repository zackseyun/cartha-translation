base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/014.yaml
  text: Then Saul’s uncle said to him and to his young man[a], “Where did you go?” And he said, “To seek the donkeys. When we saw that they were nowhere to be found[b], we went to Samuel.”
translation:
  language: sw
  text: Kisha mjomba wa Sauli akawauliza Sauli na kijana wake, “Mlikwenda wapi?” Sauli akajibu, “Tulikwenda kuwatafuta punda[a]. Tulipoona kwamba hawapo, tukaenda kwa Samueli[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania hapa linamaanisha hasa punda wa kike.
    reason: lexical_alternative
  - marker: b
    text: Au, “tukaja kwa Samueli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד שָׁאוּל
  choice: mjomba wa Sauli
  rationale: Katika simulizi hili דּוֹד kwa kawaida humaanisha mjomba. Kiswahili ‘mjomba’ ni neno la kawaida na mahususi kuliko ‘jamaa.’
- source_word: אֵלָיו וְאֶל נַעֲרוֹ
  choice: Sauli na kijana wake
  rationale: נַעַר inaweza kumaanisha kijana, mhudumu, au mtumishi. ‘Kijana wake’ huhifadhi maana ya msingi bila kuamua kwamba lazima alikuwa mtumishi.
- source_word: אָן הֲלַכְתֶּם
  choice: Mlikwenda wapi?
  rationale: Hili linaonyesha wazi wingi wa nafsi ya pili katika kitenzi cha Kiebrania na ni swali la kawaida katika Kiswahili.
- source_word: לְבַקֵּשׁ אֶת הָאֲתֹנוֹת
  choice: kuwatafuta punda
  rationale: בקשׁ ni ‘kutafuta,’ na אֲתֹנוֹת ni punda wa kike. Katika Kiswahili ‘punda’ ni mtajo wa kawaida; jinsia ya wanyama imeelezwa katika tanbihi bila kufanya sentensi iwe nzito.
- source_word: וַנִּרְאֶה כִי אַיִן
  choice: Tulipoona kwamba hawakupatikana
  rationale: Kauli ya Kiebrania ni kwa ufupi ‘tukaona kwamba hawapo/hakuna.’ Tafsiri hii huwasilisha maana ya muktadha kwamba punda hawakuonekana au kupatikana.
- source_word: וַנָּבוֹא אֶל שְׁמוּאֵל
  choice: tukamwendea Samueli
  rationale: בוא pamoja na אֶל huonyesha kumfikia au kwenda kwa Samueli. ‘Tukamwendea’ ni ya kawaida katika simulizi la Kiswahili na huepuka mkanganyiko wa mtazamo unaoweza kutokana na ‘tukaja.’
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. Viambishi vya ngeli kwa ‘punda’ vimetumia ngeli ya viumbe wenye uhai. Jina ‘Samueli’ linafuata umbo lililozoeleka katika Biblia za Kiswahili.
