base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/011.yaml
  text: And it happened that all who had known him formerly saw[a], and behold, he was prophesying with the prophets. So the people said, each man to his neighbor[b], “What has happened to the son of Kish? Is Saul also among the prophets?”
translation:
  language: sw
  text: Ikawa kwamba wale wote waliokuwa wamemjua hapo awali[a] walipoona, tazama, alikuwa akitabiri pamoja na manabii. Basi watu wakasema, kila mtu kwa mwenzake, “Ni nini kilichompata mwana wa Kishi? Je, Sauli pia[b] yumo miongoni mwa manabii?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokuwa wamemjua tangu jana na juzi,” nahau ya Kiebrania yenye maana ya “waliokuwa wamemjua hapo awali.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Je, hata Sauli yumo miongoni mwa manabii?”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹדְעוֹ מֵאִתְּמוֹל שִׁלְשׁוֹם
  choice: waliokuwa wamemjua hapo awali
  rationale: Nahau ya Kiebrania inayosema kihalisi ‘tangu jana na siku iliyotangulia’ humaanisha kumjua mtu tangu zamani au hapo awali. Tafsiri hii ni ya kawaida katika Kiswahili na inaonyesha tofauti kati ya tabia ya Sauli ya zamani na alichokuwa akifanya sasa.
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hii inahifadhi fomula ya kuendeleza simulizi ya Kiebrania kwa mtindo mfupi, wenye hadhi, na unaoeleweka katika Kiswahili cha sasa.
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: walipoona kwamba, tazama
  rationale: ‘Tazama’ inadumisha msisitizo wa ghafla na mshangao unaoletwa na וְהִנֵּה badala ya kuugeuza kuwa taarifa tambarare.
- source_word: עִם נְבִאִים
  choice: pamoja na manabii
  rationale: ‘Pamoja na’ inawakilisha maana ya msingi ya עִם (‘na/pamoja na’) na kuitofautisha na בַּנְּבִיאִים katika swali la mwisho, lililotafsiriwa ‘miongoni mwa manabii.’
- source_word: נִבָּא
  choice: alikuwa akitoa unabii
  rationale: Muundo huu unaonyesha shughuli ya kinabii iliyokuwa ikiendelea wakati mashahidi walipomwona Sauli, bila kudai kwamba alikuwa amewekwa rasmi katika cheo cha kudumu cha nabii.
- source_word: הָעָם אִישׁ אֶל רֵעֵהוּ
  choice: watu wakasema, kila mtu akimwambia mwenzake
  rationale: Tafsiri hii inahifadhi ‘watu’ na pia mgawanyo wa usemi wa Kiebrania, yaani mtu mmoja akisema na mwenzake.
- source_word: מַה זֶּה הָיָה לְבֶן קִישׁ
  choice: Ni nini kilichompata mwana wa Kishi?
  rationale: Swali hili la Kiswahili linaonyesha mshangao juu ya mabadiliko yaliyoonekana kwa Sauli bila kuongeza maelezo kuhusu chanzo au hali ya mabadiliko hayo.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִים
  choice: Je, Sauli pia yumo miongoni mwa manabii?
  rationale: ‘Pia’ inawasilisha maana ya גַּם kwa kawaida; ‘hata’ ni uwezekano mwingine unaosisitiza zaidi mshangao wa wasemaji.
theological_decisions:
- issue: Kueleza shughuli ya kinabii bila kudokeza cheo cha kudumu cha nabii
  choice: alikuwa akitoa unabii pamoja na manabii
  alternative: alikuwa katika msisimko wa kinabii pamoja na manabii; alikuwa akitenda kama nabii miongoni mwa manabii
  rationale: Kitenzi cha Kiebrania kinaripoti kwamba Sauli alishiriki katika shughuli ya kinabii, lakini hakisemi moja kwa moja kwamba alipewa cheo cha kudumu cha nabii. Tafsiri iliyochaguliwa inadumisha mvutano huo bila kuifanya hali hiyo kuwa msisimko tu wala uteuzi rasmi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye hadhi, na unaosomeka kwa urahisi. ‘Tazama’ limehifadhiwa kwa ajili ya mshangao wa simulizi, na ‘kutoa unabii’ limetumiwa bila kufafanua aina ya tukio la kinabii zaidi ya yale yasemwayo na maandishi.
