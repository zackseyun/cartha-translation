base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/003.yaml
  text: 'Then you will pass on from there and go farther[a], and you will come to the oak of Tabor. There three men going up to God at Bethel will meet you: one carrying three young goats, another carrying three loaves of bread[c][b], and another carrying a wineskin.'
translation:
  language: sw
  text: 'Kisha utaendelea kutoka hapo na kwenda mbele zaidi, nawe utafika kwenye mwaloni wa Tabori[a]. Huko utakutana na wanaume watatu wanaopanda kwenda kwa Mungu huko Betheli[b]: mmoja akiwa amebeba mbuzi wadogo watatu, mwingine mikate mitatu, na mwingine kiriba cha divai[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mti mkubwa wa Tabori.” Neno la Kiebrania linaweza kumaanisha mti mkubwa kama mwaloni au terebinthi.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa Kiebrania: “wanaopanda kwenda kwa Mungu, Betheli.” Huenda hii inaeleza safari ya kwenda mahali pa ibada huko Betheli.'
    reason: cultural_note
  - marker: c
    text: 'Kiebrania: “kiriba cha divai”; yaani, chombo cha ngozi kilichotumiwa kubebea divai.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וְחָלַפְתָּ מִשָּׁם וָהָלְאָה
  choice: utaendelea kutoka hapo na kwenda mbele zaidi
  rationale: Kauli hii inaonyesha kuondoka mahali pa awali na kuendelea na safari. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi msisitizo wa kusonga mbele.
- source_word: אֵלוֹן תָּבוֹר
  choice: mwaloni wa Tabori
  rationale: אֵלוֹן hurejelea mti mkubwa, unaoweza kutambuliwa kuwa mwaloni au aina inayofanana na terebinthi. “Mwaloni” ni tafsiri fupi na inayoeleweka, huku tanbihi ikihifadhi upana wa neno la Kiebrania.
- source_word: וּמְצָאוּךָ
  choice: utakutana na
  rationale: Ingawa kitenzi kina maana ya msingi ya “kupata,” katika muktadha huu kinaeleza kukutana njiani; “utakutana na” ni Kiswahili cha asili.
- source_word: עֹלִים אֶל הָאֱלֹהִים בֵּית אֵל
  choice: wanaopanda kwenda kwa Mungu huko Betheli
  rationale: Tafsiri hii inafuata muundo na mwelekeo wa kidini wa Kiebrania bila kuongeza waziwazi tendo la kuabudu ambalo halikutajwa katika kishazi hiki.
- source_word: גְדָיִים
  choice: mbuzi wadogo
  rationale: Neno hilo linamaanisha mbuzi wachanga. “Mbuzi wadogo” linaeleweka kwa urahisi katika Kiswahili cha kawaida.
- source_word: כִּכְּרוֹת לֶחֶם
  choice: mikate
  rationale: כִּכָּר hapa ni mkate mzima, mara nyingi wa umbo la duara. “Mikate mitatu” ni ya kawaida na haitoi maelezo ya umbo yasiyo ya lazima.
- source_word: נֵבֶל יָיִן
  choice: kiriba cha divai
  rationale: Katika muktadha huu נֵבֶל ni chombo cha kubebea kioevu, kwa kawaida kiriba. Kutaja “cha divai” kunawakilisha יָיִן iliyo wazi katika maandishi ya Kiebrania.
theological_decisions:
- issue: Maana ya kupanda kwenda kwa Mungu huko Betheli
  choice: Kuhifadhi usemi “kwenda kwa Mungu huko Betheli” bila kutaja tendo maalumu la ibada
  alternative: wanaopanda kwenda kumwabudu Mungu huko Betheli
  rationale: Muktadha unaelekea kwenye safari ya kidini kwenda mahali pa ibada, lakini kishazi cha Kiebrania hakisemi moja kwa moja “kuabudu.” Tafsiri haiongezi tendo ambalo limedokezwa tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida na unaosomeka kwa urahisi. Muundo wa sentensi umefanywa wa asili bila kuondoa mfuatano wa safari, idadi ya vitu, au utata halisi wa maneno ya Kiebrania.
