base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/012.yaml
  text: 'Then a man from there answered and said[a], “And who is their father?” Therefore it became a proverb: “Is Saul also among the prophets?”'
translation:
  language: sw
  text: 'Ndipo mtu mmoja wa huko akajibu na kusema, “Na baba yao ni nani?”[a] Kwa hiyo ikawa methali: “Je, Sauli pia yumo miongoni mwa manabii?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na baba yake ni nani?” Baadhi ya tafsiri hulichukulia swali hili kuwa linamhusu Sauli hasa, lakini Maandishi ya Kimasoreti yanasema “baba yao.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: akajibu
  rationale: Kitenzi ענה katika usimulizi huu huanzisha jibu; “akajibu” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: אִישׁ מִשָּׁם
  choice: mtu mmoja wa huko
  rationale: Kirai hiki kinamtambulisha msemaji asiyepewa jina kuwa mtu wa mahali hapo; “mtu mmoja wa huko” ni cha asili katika Kiswahili na hakiongezi utambulisho.
- source_word: וּמִי אֲבִיהֶם
  choice: Na baba yao ni nani?
  rationale: Kiambishi cha Kiebrania ni cha wingi, “yao.” Tafsiri hii inadumisha usomaji wa Kimasoreti na utata wake badala ya kuifanya kauli imrejelee Sauli peke yake.
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Kirai hiki kinaonyesha matokeo au sababu ya msemo uliofuata; “Kwa hiyo” ni wazi na cha kawaida.
- source_word: הָיְתָה לְמָשָׁל
  choice: likawa jambo la kusemwa
  rationale: מָשָׁל hapa ni msemo wa kawaida wenye nguvu ya methali. “Jambo la kusemwa” linaeleweka kwa urahisi na huepuka kudokeza lazima methali rasmi au hadithi ya mfano.
- source_word: הֲגַם
  choice: Je, ... pia
  rationale: Muundo huu unaonyesha swali la mshangao kuhusu kujumuishwa; “Je, Sauli pia...” unahifadhi maana hiyo.
- source_word: בַּנְּבִאִים
  choice: yumo miongoni mwa manabii
  rationale: Kihusishi ב hapa kinaonyesha kuwamo katika kundi; “miongoni mwa manabii” ni sahihi na ya kawaida.
theological_decisions:
- issue: Mrejelewa wa “baba yao” katika swali la balagha
  choice: 'Kudumisha wingi wa maandishi ya Kimasoreti: “baba yao,” unaoweza kuwarejelea manabii kama kundi.'
  alternative: “baba yake,” likilenga ukoo wa Sauli peke yake.
  rationale: Umbo la Kiebrania lina kiambishi cha nafsi ya tatu wingi. Usomaji huu unaruhusu hoja kwamba kuwa nabii hakutegemei ukoo wa baba fulani, bila kufunga kabisa maana ya swali. Usomaji wa umoja umetajwa katika tanbihi kwa sababu unaonekana katika baadhi ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kwa msomaji wa kawaida. Kiashiria cha tanbihi kimewekwa baada ya “akasema” ili kuonyesha kuwa tanbihi inahusu namna ya kuelewa swali linalofuata.
