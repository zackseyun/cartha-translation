translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Usemi ‘ameacha kuhangaikia’ huepuka maana inayoweza kupotosha ya kwamba baba aliacha kuwajali punda, na viwakilishi vya wingi vimehifadhiwa wazi.
