  text: בְּ/לֶכְתְּ/ךָ֤ הַ/יּוֹם֙ מֵ/עִמָּדִ֔/י וּ/מָצָאתָ֩ שְׁנֵ֨י אֲנָשִׁ֜ים עִם קְבֻרַ֥ת רָחֵ֛ל בִּ/גְב֥וּל בִּנְיָמִ֖ן בְּ/צֶלְצַ֑ח וְ/אָמְר֣וּ אֵלֶ֗י/ךָ נִמְצְא֤וּ הָ/אֲתֹנוֹת֙ אֲשֶׁ֣ר הָלַ֣כְתָּ לְ/בַקֵּ֔שׁ וְ/הִנֵּ֨ה נָטַ֤שׁ אָבִ֨י/ךָ֙ אֶת דִּבְרֵ֣י הָ/אֲתֹנ֔וֹת וְ/דָאַ֤ג לָ/כֶם֙ לֵ/אמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לִ/בְנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/002.yaml
  text: When you leave me today[a], you will find two men near Rachel’s tomb in the territory of Benjamin at Zelzah, and they will say to you, ‘The donkeys that you went to look for have been found, and look, your father has stopped caring about the donkeys and is anxious about you, saying[c][b], “What shall I do about my son?”’
translation:
  language: sw
  text: Utakapoondoka kwangu leo, utawakuta wanaume wawili karibu na kaburi la Raheli, katika eneo la Benyamini[a], huko Selsa. Watakuambia, “Punda uliokwenda kuwatafuta wamepatikana. Na tazama, baba yako ameacha kuhangaikia punda[b], naye ana wasiwasi juu yenu[c], akisema, ‘Nitafanya nini kuhusu mwanangu?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpakani mwa Benyamini.” Neno la Kiebrania linaweza kumaanisha “eneo” au “mpaka.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “ameacha jambo la punda.”
    reason: lexical_alternative
  - marker: c
    text: Neno “yenu” ni la wingi, huenda likimrejelea Sauli pamoja na mtumishi aliyekuwa akisafiri naye.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתְּךָ הַיּוֹם מֵעִמָּדִי
  choice: Utakapoondoka kwangu leo
  rationale: Muundo wa ב pamoja na kitenzi-jina unaonyesha wakati; ‘utakapoondoka kwangu’ ni Kiswahili cha kawaida kinachohifadhi wazo la kuondoka mbele ya Samweli.
- source_word: וּמָצָאתָ
  choice: utakutana na
  rationale: Katika muktadha huu kitenzi kinatabiri kwamba Sauli atawakuta watu wawili; ‘utakutana na’ ni usemi wa asili wa Kiswahili kwa kukutana na watu njiani.
- source_word: עִם קְבֻרַת רָחֵל
  choice: karibu na kaburi la Raheli
  rationale: עִם hapa ina maana ya mahali, ‘karibu na’ au ‘kando ya’; ‘kaburi’ ni neno la kawaida na lenye heshima.
- source_word: בִּגְבוּל בִּנְיָמִן
  choice: katika eneo la Benyamini
  rationale: גְּבוּל inaweza kumaanisha eneo au mpaka. ‘Eneo’ linafaa kwa mtiririko wa sentensi, huku maana mbadala ya ‘mpaka’ ikihifadhiwa katika tanbihi.
- source_word: בְּצֶלְצַח
  choice: huko Selsa
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Kiswahili; ‘huko’ linaonyesha mahali panapotajwa.
- source_word: נִמְצְאוּ הָאֲתֹנוֹת אֲשֶׁר הָלַכְתָּ לְבַקֵּשׁ
  choice: Punda ambao ulikwenda kuwatafuta wamepatikana
  rationale: Kauli tendwa na hali ya matokeo ya Kiebrania zimehifadhiwa kwa ‘wamepatikana.’ Jinsia ya punda wa kike haijasisitizwa kwa sababu Kiswahili cha kawaida hakihitaji kuitaja hapa.
- source_word: וְהִנֵּה
  choice: Na sasa
  rationale: וְהִנֵּה inaleta jambo jipya kwa msisitizo. ‘Na sasa’ ni usemi wa sasa na wa asili usio na ladha ya kizamani.
- source_word: נָטַשׁ אָבִיךָ אֶת דִּבְרֵי הָאֲתֹנוֹת
  choice: baba yako ameacha kuhangaikia habari ya punda
  rationale: Maana ya moja kwa moja ni kwamba baba ameacha ‘jambo’ la punda; katika muktadha, ‘ameacha kuhangaikia’ huonyesha kuwa jambo hilo si tena linalomshughulisha, bila kudokeza kwamba hawajali punda kabisa.
- source_word: וְדָאַג לָכֶם
  choice: naye ana wasiwasi juu yenu
  rationale: דאג huonyesha hangaiko au wasiwasi. Kiwakilishi cha Kiebrania ni cha wingi, na ‘yenu’ kinahifadhi wazi kwamba Sauli na mtumishi wake wanahusika.
- source_word: מָה אֶעֱשֶׂה לִבְנִי
  choice: Nitafanya nini kuhusu mwanangu?
  rationale: ‘Kuhusu mwanangu’ huwasilisha maana ya לִבְנִי kwa Kiswahili cha kawaida huku ikihifadhi swali la baba mwenye wasiwasi.
