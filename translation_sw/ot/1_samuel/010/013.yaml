  text: When he had finished prophesying[a], he came to the high place.
translation:
  language: sw
  text: Alipomaliza kutabiri, akafika mahali pa juu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “mahali pa ibada palipoinuka.” Kiebrania: “mahali pa juu,” neno linaloweza kurejelea mahali pa ibada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: Alipomaliza
  rationale: Kitenzi kinaonyesha kukamilika kwa shughuli iliyotangulia; kishazi cha wakati ni cha asili katika Kiswahili na kinaweka tukio hilo kabla ya kufika kwake.
- source_word: מֵהִתְנַבּוֹת
  choice: kutoa unabii
  rationale: Muundo huu unaonyesha shughuli ya kutabiri au kutoa unabii. ‘Kutoa unabii’ ni usemi wa kawaida na wenye hadhi, bila kufafanua kupita kiasi hali ya kinabii.
- source_word: וַיָּבֹא
  choice: akafika
  rationale: בוא inaweza kumaanisha kuja, kwenda, au kufika kulingana na mtazamo. ‘Akafika’ linaeleza mwendo wa simulizi bila kulazimisha mtazamo wa msemaji.
- source_word: הַבָּמָה
  choice: mahali pa juu
  rationale: במה ni mahali palipoinuka, mara nyingi mahali pa ibada. Tafsiri hii inahifadhi maana ya msingi na kuacha dokezo la kiibada lielezwe katika tanbihi.
theological_decisions:
- issue: Umuhimu wa kiibada wa הַבָּמָה
  choice: mahali pa juu
  alternative: mahali pa ibada palipoinuka
  rationale: Neno linarejelea eneo la ibada, lakini mstari wenyewe haulazimishi tafsiri inayotaja wazi uhalali au kutokubalika kwa ibada hiyo. Ufafanuzi mfupi katika tanbihi unahifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘alipomaliza … akafika’ unasomeka kwa urahisi katika simulizi. Alama ya tanbihi imewekwa baada ya kirai kinachofafanuliwa.
