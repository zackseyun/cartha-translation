base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/024.yaml
  text: Then Samuel said to all the people[a], “Do you see the one whom Yahweh has chosen? There is no one like him among all the people.” And all the people shouted and said[b], “Long live the king!”
translation:
  language: sw
  text: Ndipo Samweli akawaambia watu wote, “Je, mnamwona[a] yule ambaye Yahwe amemchagua? Maana hakuna yeyote aliye kama yeye miongoni mwa watu wote.” Watu wote wakapaza sauti na kusema[b], “Mfalme aishi!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, mmemwona yule ambaye Yahwe alimchagua?”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “Mfalme aishi!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akawaambia
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” na umbo la mfululizo “akawaambia” huonyesha hatua inayofuata kwa Kiswahili cha kawaida.
- source_word: הַרְּאִיתֶם
  choice: Je, mnamwona
  rationale: Ingawa umbo la Kiebrania ni timilifu la nafsi ya pili wingi, hapa swali linaelekeza macho ya watu kwa Sauli aliye mbele yao; wakati wa sasa ni wa asili katika Kiswahili.
- source_word: אֲשֶׁר בָּחַר בּוֹ יְהוָה
  choice: yule ambaye Yahwe amemchagua
  rationale: Kishazi hiki kinamtambulisha Sauli, na wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye matokeo ya sasa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: כִּי אֵין כָּמֹהוּ
  choice: Maana hakuna yeyote aliye kama yeye
  rationale: “Maana” linawakilisha uhusiano wa maelezo unaoletwa na כִּי, huku usemi unaofuata ukihifadhi dai kwamba Sauli hana mfano kati ya watu.
- source_word: בְּכָל הָעָם
  choice: miongoni mwa watu wote
  rationale: Kirai hiki kinaonyesha ulinganisho wa Sauli na watu wote waliokusanyika.
- source_word: וַיָּרִעוּ
  choice: wakapaza sauti
  rationale: Kitenzi kinaonyesha kutoa mwito mkubwa wa pamoja; tafsiri hii haiingizi kwa lazima maana pana zaidi ya kushangilia.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Mfalme aishi!
  rationale: Umbo la kutakia katika Kiebrania ni mwito wa kumtakia mfalme uhai; subjunktivi ya Kiswahili inaleta mwito huo kwa ufupi na kwa kawaida.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la Mungu. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
- issue: Maana ya kutokuwa na mwingine kama Sauli
  choice: hakuna yeyote aliye kama yeye miongoni mwa watu wote
  alternative: hakuna aliye sawa naye katika kila jambo
  rationale: Tafsiri haiongezi sifa maalumu au ukamilifu wa kiroho ambao mstari hautaji; inadumisha ulinganisho mpana katika muktadha wa kuchaguliwa kwake kuwa mfalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa wasomaji wa kawaida. “Ndipo,” “Maana,” na miundo ya mfululizo wa vitenzi hudumisha mwendo wa simulizi; tahajia “Yahwe” inafuata matamshi ya kawaida ya Kiswahili.
