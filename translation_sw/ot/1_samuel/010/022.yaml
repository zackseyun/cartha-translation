base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/022.yaml
  text: So they inquired of Yahweh again[a], “Has the man come here yet?” And Yahweh said, “Behold, he has hidden himself among the baggage.”
translation:
  language: sw
  text: Wakamwuliza Yahweh tena, “Je, mtu huyo amekuja hapa bado?” Yahweh akasema, “Tazama, amejificha miongoni mwa mizigo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “miongoni mwa vyombo/vitu”; neno hilo linaweza kumaanisha kwa upana vitu, zana, au vifaa. Hapa yaelekea linamaanisha mizigo au vifaa vya watu waliokusanyika.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ ... בַּיהוָה
  choice: wakamwuliza Yahweh
  rationale: Muundo שׁאל בַּיהוָה unaonyesha kumwendea Yahweh ili kupata jibu, si kuuliza swali la kawaida tu. Kiswahili ‘kumwuliza Yahweh’ ni cha asili na kinahifadhi wazo la kutafuta jibu kwake.
- source_word: עוֹד (ya kwanza)
  choice: tena
  rationale: Inaonyesha kuwa tendo la kumwuliza Yahweh lilirudiwa.
- source_word: הֲבָא עוֹד הֲלֹם אִישׁ
  choice: Je, huyo mtu amekuja hapa?
  rationale: Kitenzi timilifu cha בוא kinauliza kama kuja kwake kumetokea. ‘Amekuja’ ni ya asili katika Kiswahili; עוֹד ya pili haikulazimishwa kuwa neno tofauti kwa kuwa maana yake ya ‘bado/kufikia sasa’ inaeleweka katika swali hili.
- source_word: וַיֹּאמֶר יְהוָה
  choice: Yahweh akasema
  rationale: Kitenzi cha Kiebrania ni ‘akasema’; tafsiri hii inadumisha mtindo wa simulizi bila kukibadili kuwa ‘akajibu,’ ingawa kauli hiyo ni jibu.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta usikivu kwa msisitizo. ‘Tazama’ lina hadhi ya kisimulizi na linaeleweka kwa wasomaji wa sasa.
- source_word: נֶחְבָּא
  choice: amejificha
  rationale: Nifali ya חבא katika muktadha huu ina maana ya kujisitiri au kujificha; umbo la Kiswahili linaonyesha wazi tendo la mhusika mwenyewe.
- source_word: אֶל הַכֵּלִים
  choice: katikati ya mizigo
  rationale: כֵּלִים ni neno pana kwa vyombo, vitu, vifaa, au mali. Katika mkusanyiko huu, ‘mizigo’ linaeleza kwa kawaida vitu au vifaa vilivyowekwa pamoja.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יְהוָה moja kwa moja. ‘Yahweh’ hulitofautisha na cheo ‘Bwana’ na kuepuka kuingiza mbadala wa kimapokeo badala ya jina lenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya kisimulizi na rahisi kueleweka; ‘Tazama’ huhifadhi msisitizo wa הִנֵּה bila maelezo ya ziada.
