source:
  edition: WLC
  text: וְ/אַתֶּ֨ם הַ/יּ֜וֹם מְאַסְתֶּ֣ם אֶת אֱלֹהֵי/כֶ֗ם אֲשֶׁר ה֣וּא מוֹשִׁ֣יעַ לָ/כֶם֮ מִ/כָּל רָעוֹתֵי/כֶ֣ם וְ/צָרֹֽתֵי/כֶם֒ וַ/תֹּ֣אמְרוּ ל֔/וֹ כִּי מֶ֖לֶךְ תָּשִׂ֣ים עָלֵ֑י/נוּ וְ/עַתָּ֗ה הִֽתְיַצְּבוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/שִׁבְטֵי/כֶ֖ם וּ/לְ/אַלְפֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/019.yaml
  text: But today you have rejected your God[a], who himself saves you from all your calamities and distresses, and you have said to him, ‘No[b], but set a king over us.’ So now present yourselves before Yahweh by your tribes and by your thousands.
translation:
  language: sw
  text: Lakini leo mmemkataa Mungu wenu, ambaye ndiye huwaokoa kutoka katika misiba yenu yote na dhiki zenu[a]. Nanyi mmemwambia, ‘La, bali tuwekee mfalme juu yetu.’ Basi sasa jitokezeni mbele za Yahweh kwa makabila yenu na kwa maelfu yenu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika mabaya yenu yote na dhiki zenu.” Maneno ya Kiebrania yanaweza kumaanisha mabaya yanayowapata watu, misiba, shida, au mateso.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa koo zenu” au “kwa vikosi vyenu vya watu elfu.” Neno la Kiebrania linalotafsiriwa “maelfu” linaweza kumaanisha migawanyiko ya kijamii au ya kijeshi, si idadi halisi tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַסְתֶּם
  choice: mmemkataa
  rationale: Kitenzi מָאַס humaanisha kukataa au kutupilia mbali. ‘Mmemkataa’ ni Kiswahili cha kawaida na kinahifadhi uzito wa tendo la Israeli dhidi ya Mungu wao.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ingawa אֱלֹהִים ina umbo la wingi, hapa inamtaja Mungu mmoja wa Israeli; kiwakilishi na muktadha vinahitaji umoja.
- source_word: מוֹשִׁיעַ
  choice: anayewaokoa
  rationale: Umbo la kitenzi kishirikishi linaonyesha tendo la Mungu la kawaida au linaloendelea la kuwaokoa watu wake.
- source_word: מִכָּל רָעוֹתֵיכֶם
  choice: kutoka katika mabaya yenu yote
  rationale: רָעוֹת inaweza kumaanisha mabaya, misiba, au madhara yanayowapata watu. ‘Mabaya yenu yote’ huhifadhi upana na ukaribu wa neno la Kiebrania; maana ya misiba imewekwa katika tanbihi.
- source_word: וְצָרֹתֵיכֶם
  choice: na dhiki zenu
  rationale: צָרוֹת hurejelea hali za dhiki, shida, au taabu. ‘Dhiki’ ni neno la sasa, lenye heshima, na linatofautisha nomino hii na רָעוֹת.
- source_word: כִּי
  choice: La, bali
  rationale: 'Katika usemi huu wa moja kwa moja, כִּי linaonyesha msisitizo wa kupinga: watu hawakuridhika na wokovu wa Mungu bali walidai mfalme. ‘La, bali’ huonyesha nguvu hiyo bila kuficha mvutano wa kifungu.'
- source_word: תָּשִׂים עָלֵינוּ
  choice: tuwekee mfalme juu yetu
  rationale: שׂוּם maana yake ni kuweka au kuteua. ‘Tuwekee ... juu yetu’ linabaki karibu na muundo wa Kiebrania bila kuongeza wazi wazo lisilotajwa la ‘kututawala,’ ingawa linadokezwa na cheo cha mfalme.
- source_word: הִתְיַצְּבוּ
  choice: jitokezeni
  rationale: Hapa hitpael inaagiza watu wajiwasilishe rasmi mbele za Yahweh kwa mchakato wa uteuzi. ‘Jitokezeni’ ni la asili zaidi kuliko ‘jisimamisheni’ na linahifadhi wazo la kujiweka tayari mbele yake.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetolewa kwa unukuzi ‘Yahweh,’ badala ya kubadilishwa na cheo.
- source_word: לְשִׁבְטֵיכֶם
  choice: kwa makabila yenu
  rationale: Kihusishi ל hapa kinaonyesha upangaji kwa vikundi; ‘kwa makabila yenu’ ni wazi na kifupi.
- source_word: וּלְאַלְפֵיכֶם
  choice: na kwa maelfu yenu
  rationale: אֶלֶף inaweza kumaanisha elfu halisi, ukoo, au kitengo cha kijamii/kijeshi. ‘Maelfu’ huhifadhi neno la Kiebrania katika matini, na tanbihi inaonyesha maana nyingine zinazowezekana.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Kifungu kinatumia moja kwa moja Tetragramatoni, jina binafsi la Mungu. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nguvu ya maneno ya watu yaliyonukuliwa na Samweli
  choice: ‘La, bali tuwekee mfalme juu yetu.’
  alternative: ‘Tuwekee mfalme juu yetu’ au ‘Naam, tuwekee mfalme juu yetu’
  rationale: Muktadha unaweka dai la watu kinyume na tendo la Mungu la kuwaokoa. ‘La, bali’ linaonyesha msisitizo wa kupinga unaowezekana katika כִּי, bila kuongeza fundisho la kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimewekwa wazi kwa wasomaji wa kawaida huku mkazo wa lawama, jina Yahweh, na utata wa רָעוֹת na אֲלָפִים vikihifadhiwa.
