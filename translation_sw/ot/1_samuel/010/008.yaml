id: 1SA.10.8
reference: 1 Samuel 10:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/יָרַדְתָּ֣ לְ/פָנַ/י֮ הַ/גִּלְגָּל֒ וְ/הִנֵּ֤ה אָֽנֹכִי֙ יֹרֵ֣ד אֵלֶ֔י/ךָ לְ/הַעֲל֣וֹת עֹל֔וֹת לִ/זְבֹּ֖חַ זִבְחֵ֣י שְׁלָמִ֑ים שִׁבְעַ֨ת יָמִ֤ים תּוֹחֵל֙ עַד בּוֹאִ֣/י אֵלֶ֔י/ךָ וְ/הוֹדַעְתִּ֣י לְ/ךָ֔ אֵ֖ת אֲשֶׁ֥ר תַּעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/008.yaml
  text: And you shall go down before me to Gilgal. And behold[a], I am coming down to you to offer burnt offerings and to sacrifice peace offerings. You shall wait seven days, until I come to you and make known to you what you shall do.
translation:
  language: sw
  text: Nawe utashuka mbele yangu kwenda Gilgali. Tazama, ninashuka kuja kwako ili kutoa sadaka za kuteketezwa na kuchinja sadaka za amani[a]. Utasubiri siku saba, mpaka nitakapokuja kwako na kukujulisha utakachofanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka za ushirika” au “sadaka za ustawi.” Neno la Kiebrania hurejelea sadaka zinazohusishwa na amani, ukamilifu au ustawi, na ushirika wa pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַדְתָּ
  choice: Nawe utashuka
  rationale: Kitenzi cha Qal katika mfululizo wa maagizo kinaelezwa kwa wakati ujao wenye nguvu ya agizo; “utashuka” pia huhifadhi maana ya kwenda mahali pa chini.
- source_word: לְפָנַי
  choice: mbele yangu
  rationale: 'Huhifadhi maana ya mahali na wakati: Sauli atatangulia mbele ya Samweli kuelekea Gilgali.'
- source_word: הַגִּלְגָּל
  choice: Gilgali
  rationale: Jina la mahali limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Neno hili la Kiswahili ni la sasa, lenye hadhi, na huhifadhi wito wa kuzingatia unaoletwa na הִנֵּה.
- source_word: יֹרֵד אֵלֶיךָ
  choice: nitashuka kuja kwako
  rationale: Huhifadhi wazo la kushuka pamoja na mwelekeo wa mwendo kuelekea kwa Sauli; wakati ujao huonyesha tendo lililokusudiwa na lililo karibu.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: ili kutoa sadaka za kuteketezwa
  rationale: Hii ni istilahi inayoeleweka ya ibada kwa sadaka zilizoteketezwa kabisa, bila kutafsiri kihalisi nahau ya Kiebrania ya ‘kupandisha’ sadaka.
- source_word: לִזְבֹּחַ זִבְחֵי שְׁלָמִים
  choice: na kuchinja sadaka za amani
  rationale: “Kuchinja” huhifadhi kitendo cha dhabihu, na “sadaka za amani” hudumisha istilahi inayotambulika huku upana wa maana ukielezwa katika tanbihi.
- source_word: תּוֹחֵל
  choice: Utasubiri
  rationale: Katika muktadha huu יחל humaanisha kusubiri, si kutumaini; wakati ujao hapa una nguvu ya agizo.
- source_word: וְהוֹדַעְתִּי לְךָ
  choice: na kukujulisha
  rationale: 'Huhifadhi maana sababishi ya Hiphil: kumfanya mtu ajue.'
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: utakachofanya
  rationale: Ni Kiswahili cha kawaida na sahihi kwa kishazi cha Kiebrania ‘kile ambacho utafanya,’ huku sauti ya mwongozo wa baadaye ikihifadhiwa.
theological_decisions:
- issue: Maana ya istilahi ya dhabihu שְׁלָמִים
  choice: sadaka za amani
  alternative: sadaka za ushirika; sadaka za ustawi
  rationale: Istilahi ya Kiebrania inahusishwa na amani, ukamilifu au ustawi, na ushirika katika mlo wa dhabihu. “Sadaka za amani” ni tafsiri fupi na inayotambulika, lakini tanbihi huhifadhi upana wa maana bila kuifanya kuwa fundisho jembamba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maagizo umetolewa kwa wakati ujao wenye nguvu ya maelekezo. Alama ya tanbihi imewekwa moja kwa moja baada ya istilahi inayofafanuliwa.
