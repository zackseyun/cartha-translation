  text: וַ/יֹּ֣אמֶר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אָנֹכִ֛י הֶעֱלֵ֥יתִי אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם וָ/אַצִּ֤יל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּד֙ כָּל הַ/מַּמְלָכ֔וֹת הַ/לֹּחֲצִ֖ים אֶתְ/כֶֽם׀־פ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/018.yaml
  text: 'And he said to the sons of Israel[a], “Thus says Yahweh, the God of Israel: I brought Israel up from Egypt, and I delivered you from the hand of the Egyptians and from the hand of all the kingdoms that were oppressing you.”'
translation:
  language: sw
  text: 'Akawaambia wana wa Israeli[a], “Yahwe, Mungu wa Israeli, asema hivi: Mimi niliwatoa Israeli kutoka Misri, nikawaokoa kutoka mkononi mwa Wamisri na kutoka mkono wa falme zote zilizokuwa zinawaonea.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli”; kwa mapokeo, “watoto wa Israeli.”
    reason: Njia mbadala za kutafsiri jina la pamoja בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi muundo wa Kiebrania unaomaanisha kihalisi ‘wana wa Israeli,’ huku ukiendelea kueleweka kama jina la pamoja la watu wa Israeli. Tanbihi inaonyesha tafsiri ya kawaida zaidi.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Ni kauli ya kawaida ya mjumbe au nabii. Mpangilio huu ni wa asili katika Kiswahili na unahifadhi uzito wa tamko.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Hutaja jina binafsi la Mungu lililoandikwa kwa herufi YHWH badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni tafsiri ya moja kwa moja ya muundo wa umilikaji unaomtambulisha Yahwe kuwa Mungu wa Israeli.
- source_word: הֶעֱלֵיתִי
  choice: niliipandisha
  rationale: Huhifadhi taswira ya kitenzi עלה, ‘kupandisha,’ inayotumiwa kuhusu kutoka Misri, badala ya kuifanya tu ‘kutoa.’ Kiambishi ‘-i-’ kinaafikiana na Israeli kama jamii/nchi.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israeli
  rationale: Huhifadhi jina la pamoja lililo katika umoja katika chanzo.
- source_word: וָאַצִּיל
  choice: nikawaokoa
  rationale: Kitenzi cha Hiphil נצל kina maana ya kuokoa au kukomboa kutoka mamlaka yenye uhasama. ‘Kuokoa’ ni wazi na cha asili katika Kiswahili.
- source_word: מִיַּד
  choice: kutoka mkononi mwa / kutoka mikononi mwa
  rationale: Huhifadhi sitiari ya Kiebrania ya ‘mkono’ kama mamlaka au udhibiti. Umoja umetumiwa kwa Wamisri kama kundi moja, na wingi kwa falme nyingi.
- source_word: מִצְרַיִם
  choice: Wamisri
  rationale: Katika kirai ‘mkono wa,’ jina hili linawakilisha watu na mamlaka ya Misri; ‘Wamisri’ ni sahihi na la asili zaidi hapa kuliko nchi ya Misri.
- source_word: כָּל הַמַּמְלָכוֹת
  choice: falme zote
  rationale: Huwasilisha wingi na upeo kamili wa ממלכות bila kuongeza maelezo yasiyomo katika chanzo.
- source_word: הַלֹּחֲצִים אֶתְכֶם
  choice: zilizokuwa zikiwaonea
  rationale: Muundo huu unaonyesha tendo la kuonea lililokuwa likiendelea, kulingana na nguvu ya participio ya Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina la Mungu YHWH moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Jina la kikabila lenye jinsia בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Tafsiri kuu inahifadhi neno la Kiebrania ‘wana,’ lakini tanbihi inaweka wazi kwamba kirai hiki hapa ni jina la pamoja linaloweza kutafsiriwa kwa Kiswahili cha kawaida kuwa ‘Waisraeli.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kibiblia lakini kinachoeleweka kwa msomaji wa sasa. Taswira za Kiebrania za ‘kupandisha’ na ‘mkono’ zimehifadhiwa kwa kuwa zinaeleweka katika muktadha; miundo imepangwa kwa ufasaha wa Kiswahili.
