base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/025.yaml
  text: Then Samuel told the people the rights and duties of the kingship[a], and he wrote them in the book and laid it before Yahweh. Then Samuel sent all the people away[b], each man to his house.
translation:
  language: sw
  text: Kisha Samweli akawaeleza watu haki na wajibu wa ufalme[a]. Akaviandika katika kitabu, akakiweka mbele ya Yahweh. Kisha Samweli akawaruhusu watu wote waende zao[b], kila mtu nyumbani kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utaratibu wa ufalme” au “desturi ya ufalme.” Kirai cha Kiebrania kinaweza kumaanisha kanuni za kisheria au utendaji uliowekwa wa utawala wa kifalme.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kila mtu nyumbani kwake,” usemi wa mgawanyo unaomaanisha kwamba kila mmoja akaenda nyumbani kwake.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akawaeleza
  rationale: Katika muundo huu, kitenzi דבר pamoja na אֶל na jambo linalosemwa kinaonyesha kwamba Samweli aliwaambia au aliwaeleza watu masharti yanayohusu ufalme. “Akawaeleza” ni Kiswahili cha kawaida na kinaonyesha yaliyomo katika hotuba hiyo.
- source_word: מִשְׁפַּט הַמְּלֻכָה
  choice: haki na wajibu wa ufalme
  rationale: מִשְׁפַּט inaweza kumaanisha haki, wajibu, kanuni, au desturi iliyowekwa; מְלֻכָה hapa ni cheo au mfumo wa kifalme. Usemi huu unaonyesha masharti yanayotawala ufalme bila kuufanya kuwa eneo la kijiografia.
- source_word: וַיִּכְתֹּב בַּסֵּפֶר
  choice: Akaziandika katika kitabu
  rationale: Kiambishi “-zi-” kinarejelea haki na wajibu waliotangulia. סֵפֶר inaweza kuwa kitabu, hati, au gombo; “kitabu” ni neno la kawaida lisilobainisha kupita kiasi umbo la hati hiyo.
- source_word: וַיַּנַּח לִפְנֵי יְהוָה
  choice: akakiweka mbele za Yahweh
  rationale: Kiambishi “-ki-” kinarejelea kitabu kilichoandikwa. Kitenzi נוח katika muundo huu kina maana ya kukiweka au kukiacha kitu mahali, huenda katika uwepo wa ibada mbele za Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: וַיְשַׁלַּח
  choice: akawaacha watu wote waende zao
  rationale: Katika muktadha huu שלח ina maana ya kuwaondoa au kuwapa ruhusa waondoke, si kuwatuma kutekeleza kazi. Usemi huu ni wa kawaida katika Kiswahili.
- source_word: אִישׁ לְבֵיתוֹ
  choice: kila mtu nyumbani kwake
  rationale: 'Huu ni usemi wa mgawanyo: watu waliondoka mmoja mmoja, kila mmoja akielekea katika nyumba yake. “Kila mtu nyumbani kwake” ni Kiswahili cha asili kinachohifadhi maana hiyo.'
theological_decisions:
- issue: Tafsiri ya jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina binafsi la Mungu, si jina la cheo; kwa hiyo limetoholewa kuwa “Yahweh.”
- issue: Upeo wa maana ya מִשְׁפַּט הַמְּלֻכָה
  choice: haki na wajibu wa ufalme
  alternative: utaratibu au desturi ya ufalme
  rationale: Kirai hicho kinaweza kueleza kanuni za kisheria au utendaji uliowekwa wa utawala wa kifalme. Tafsiri kuu inaonyesha upande wa kikanuni, huku tanbihi ikihifadhi maana mbadala bila kuamua mvutano huo kimya kimya.
- issue: Usemi wa mgawanyo אִישׁ לְבֵיתוֹ
  choice: kila mtu nyumbani kwake
  alternative: kila mwanamume nyumbani kwake
  rationale: אִישׁ ya umoja imetumiwa hapa kwa mgawanyo kwa kurejelea kila mshiriki wa kundi. Kiswahili “kila mtu” huwasilisha kazi hiyo ya kisarufi kwa kawaida bila kubadili hoja ya aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimegawanywa kwa mtiririko wa kawaida wa Kiswahili, huku viunganishi vya simulizi vya Kiebrania vikihifadhiwa kwa “Kisha” na maumbo ya “aka-.”
