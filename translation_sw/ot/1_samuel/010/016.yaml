  text: וַ/יֹּ֤אמֶר שָׁאוּל֙ אֶל דּוֹד֔/וֹ הַגֵּ֤ד הִגִּיד֙ לָ֔/נוּ כִּ֥י נִמְצְא֖וּ הָ/אֲתֹנ֑וֹת וְ/אֶת דְּבַ֤ר הַ/מְּלוּכָה֙ לֹֽא הִגִּ֣יד ל֔/וֹ אֲשֶׁ֖ר אָמַ֥ר שְׁמוּאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/016.yaml
  text: Saul said to his uncle[b][a], “He plainly told us that the donkeys had been found.” But he did not tell him about the matter of the kingship that Samuel had spoken of.
translation:
  language: sw
  text: Sauli akamwambia mjomba wake, “Alituambia wazi kwamba punda-jike walikuwa wamepatikana.” Lakini hakumwambia jambo la ufalme[a] alilolisema Samweli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo la utawala wa kifalme.” Neno la Kiebrania hapa linaelekea kurejelea kuwa mfalme au kutawala kwa Sauli, si lazima ufalme kama nchi.
    reason: alternative_reading
lexical_decisions:
- source_word: דּוֹדוֹ
  choice: mjomba wake
  rationale: Katika muktadha huu דּוֹד ni ndugu wa karibu wa kiume, kwa kawaida mjomba, si ‘mpendwa.’
- source_word: הַגֵּד הִגִּיד
  choice: Alituambia wazi
  rationale: Muundo wa kitenzi pamoja na infinitivi kamili unasisitiza tendo la kusema; ‘wazi’ huonyesha mkazo huo kwa Kiswahili cha kawaida bila kutia chumvi.
- source_word: נִמְצְאוּ
  choice: walikuwa wamepatikana
  rationale: Hutoa maana ya kutendwa ya מצא na huonyesha kwamba kupatikana kulitangulia taarifa ya Samweli.
- source_word: הָאֲתֹנוֹת
  choice: punda-jike
  rationale: Neno la Kiebrania linataja wazi punda wa kike; ‘punda-jike’ ni sahihi na linaeleweka katika Kiswahili.
- source_word: דְּבַר הַמְּלוּכָה
  choice: jambo la ufalme
  rationale: דָּבָר hapa ni jambo au suala, na מְלוּכָה linaweza kuelekeza kwenye ufalme au utawala wa kifalme wa Sauli. ‘Ufalme’ huhifadhi upana huo wa maana.
- source_word: לֹא הִגִּיד לוֹ
  choice: hakumwambia
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kutomjulisha mjomba wake.
- source_word: אֲשֶׁר אָמַר שְׁמוּאֵל
  choice: alilolisema Samweli
  rationale: Kishazi hiki kinarejelea ‘jambo la ufalme’ na kuhifadhi maana ya kwamba Samweli alikuwa amelisema.
theological_decisions:
- issue: Maana ya מְלוּכָה katika habari ya Sauli
  choice: ufalme
  alternative: utawala wa kifalme
  rationale: ‘Ufalme’ ni neno la kawaida linaloweza kurejelea cheo au utawala wa mfalme, huku tanbihi ikihifadhi uwezekano wa maana mahsusi ya utawala wa kifalme badala ya eneo la kifalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. ‘Punda-jike’ huhifadhi taarifa ya kijinsia iliyo wazi katika Kiebrania; ‘jambo la ufalme’ huhifadhi mvutano wa kimaana kati ya ufalme na utawala wa kifalme.
