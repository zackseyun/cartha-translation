  text: וְ/צָלְחָ֤ה עָלֶ֨י/ךָ֙ ר֣וּחַ יְהוָ֔ה וְ/הִתְנַבִּ֖יתָ עִמָּ֑/ם וְ/נֶהְפַּכְתָּ֖ לְ/אִ֥ישׁ אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/006.yaml
  text: Then the Spirit of Yahweh will rush upon you[a], and you will prophesy with them[b], and be turned into another man.
translation:
  language: sw
  text: Ndipo Roho wa Yahwe atakujilia kwa nguvu[a], nawe utatabiri pamoja nao, kisha utageuzwa kuwa mtu mwingine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakuja juu yako kwa nguvu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “utageuzwa kuwa mtu tofauti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָלְחָה עָלֶיךָ
  choice: atakujilia kwa nguvu
  rationale: Katika vifungu ambamo Roho wa Yahwe ndiye mtendaji, צלח על huonyesha kumjia mtu kwa nguvu, si kufanikiwa au kustawi. Kauli hii ni ya asili katika Kiswahili na inadokeza tendo lenye nguvu bila kuongeza maelezo yasiyokuwamo.
- source_word: רוּחַ יְהוָה
  choice: Roho wa Yahwe
  rationale: רוּחַ hapa ni Roho wa Mungu, wala si upepo au pumzi. Jina la agano יְהוָה limeandikwa “Yahwe” kwa uwazi.
- source_word: וְהִתְנַבִּיתָ
  choice: utatabiri
  rationale: Hitpaeli ya נבא katika simulizi hili inaeleza Sauli kushiriki katika shughuli ya kinabii pamoja na kundi la manabii. “Utatabiri” ni fupi, wazi, na ya kawaida.
- source_word: עִמָּם
  choice: pamoja nao
  rationale: עִם inaonyesha ushirika au kuandamana; “pamoja nao” inaonyesha kwamba Sauli atajiunga nao katika kutabiri.
- source_word: וְנֶהְפַּכְתָּ
  choice: utageuzwa
  rationale: Nifali ya הפך inaonyesha mabadiliko ya hali. “Utageuzwa” inadumisha maana ya kutendewa na haitoi uamuzi kuhusu kiwango au kudumu kwa mabadiliko hayo.
- source_word: לְאִישׁ אַחֵר
  choice: kuwa mtu mwingine
  rationale: Kauli hii inadumisha nomino ya kiume אִישׁ na fumbo la Kiebrania, bila kufafanua mabadiliko hayo kuwa kuzaliwa upya au mageuzi kamili ya kimaadili.
theological_decisions:
- issue: Asili na upeo wa mabadiliko ya Sauli
  choice: Andiko linasema Sauli atageuzwa kuwa mtu mwingine, bila kufafanua kama mabadiliko hayo ni ya kudumu au ni uhuisho kamili wa ndani.
  alternative: Kulifafanua kama tukio la nje la kinabii tu, au kama kuzaliwa upya na kufanywa upya kabisa kiroho.
  rationale: Kiebrania kinathibitisha mabadiliko halisi yanayohusiana na kazi ya Roho na kutabiri kwa Sauli, lakini hakielezi upeo wake wa kiteolojia wala kudumu kwake. Tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Muundo wa kishairi-kisimulizi na mfuatano wa matendo umehifadhiwa bila kuingiza istilahi za kimadhehebu.
