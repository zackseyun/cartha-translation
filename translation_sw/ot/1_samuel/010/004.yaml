lexical_decisions:
- source_word: וְשָׁאֲלוּ לְךָ לְשָׁלוֹם
  choice: Watakuuliza hali yako
  rationale: Kirai hiki cha Kiebrania ni nahau ya kuuliza kuhusu hali njema ya mtu, au ya kumsalimu. Tafsiri hii inahifadhi tendo la kuuliza na ni ya kawaida katika Kiswahili.
- source_word: שָׁלוֹם
  choice: hali yako
  rationale: Katika muktadha huu, neno hili halimaanishi tu amani, bali hali njema ya mtu kwa ujumla. ‘Hali yako’ linafaa katika usemi wa Kiswahili wa kuulizana hali.
- source_word: וְנָתְנוּ לְךָ
  choice: na kukupa
  rationale: Mfuatano wa vitenzi vya Kiebrania unaendeleza utabiri wa matukio yajayo. Muundo huu wa Kiswahili unaunganisha kwa kawaida tendo hili na kitenzi kilichotangulia.
- source_word: שְׁתֵּי לֶחֶם
  choice: mikate miwili
  rationale: Ingawa לֶחֶם kwa umbo ni ‘mkate/chakula cha mkate,’ pamoja na idadi mbili humaanisha vipande au mikate miwili. Kiswahili cha kawaida hutumia wingi ‘mikate miwili.’
- source_word: וְלָקַחְתָּ מִיָּדָם
  choice: nawe utaipokea mikononi mwao
  rationale: לקח kimsingi ni ‘chukua,’ lakini katika muktadha wa kitu kinachotolewa, ‘pokea’ linaeleza tendo hilo kwa kawaida. ‘Mikononi mwao’ linahifadhi taswira ya mkono iliyo katika Kiebrania.
