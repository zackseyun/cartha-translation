base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/023.yaml
  text: So they ran and took him from there[a], and he stood in the midst of the people. And he was taller than all the people from his shoulders upward.
translation:
  language: sw
  text: Basi wakakimbia, wakamchukua kutoka huko[a], naye akasimama katikati ya watu. Aliwapita watu wote kwa kimo, kuanzia mabegani mwake kwenda juu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamtoa huko.” Kitenzi cha Kiebrania kwa kawaida humaanisha “kuchukua,” lakini katika muktadha huu kinaweza kudokeza kumrejesha kutoka mahali alipokuwa amejificha (tazama mst. 22).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֻצוּ
  choice: wakakimbia
  rationale: Kitenzi רוץ kina maana ya kukimbia au kwenda kwa haraka. “Wakakimbia” kinadumisha uwazi na uchangamfu wa simulizi.
- source_word: וַיִּקָּחֻהוּ
  choice: wakamchukua
  rationale: לקח kwa kawaida humaanisha “chukua.” Katika muktadha huu walimtoa Sauli mahali alipokuwa amejificha, lakini tafsiri hii haiongezi maana hiyo kwa lazima.
- source_word: מִשָּׁם
  choice: kutoka huko
  rationale: Hii ni tafsiri ya moja kwa moja ya kirai kinachoonyesha mahali walikomtoa.
- source_word: וַיִּתְיַצֵּב
  choice: akasimama
  rationale: Hitpaeli ya יצב inaweza kumaanisha kujiweka au kusimama mahali fulani. “Akasimama” ni ya kawaida na haiongezi wazo la sherehe lisilo wazi katika Kiebrania.
- source_word: בְּתוֹךְ הָעָם
  choice: katikati ya watu
  rationale: Kirai hiki kinahifadhi maana ya kuwa ndani au katikati ya kusanyiko la watu.
- source_word: וַיִּגְבַּהּ
  choice: alikuwa mrefu
  rationale: Katika maelezo ya kimo, Kiswahili cha kawaida hutumia “mrefu” badala ya tafsiri sisisi ya “juu.”
- source_word: מִכָּל הָעָם
  choice: kuliko watu wote
  rationale: Muundo huu unaonyesha ulinganisho wa kimo kati ya Sauli na watu wote waliokusanyika bila kupunguza maana ya הָעָם kuwa wanaume pekee.
- source_word: מִשִּׁכְמוֹ וָמָעְלָה
  choice: kuanzia mabegani mwake kwenda juu
  rationale: Hii inaeleza kwa lugha ya kawaida kwamba Sauli aliwazidi wengine kwa sehemu ya mwili kuanzia mabegani kwenda juu, huku ikihifadhi taswira ya Kiebrania.
