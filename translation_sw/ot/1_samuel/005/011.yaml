base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/011.yaml
  text: So they sent and gathered all the lords of the Philistines[a], and they said, “Send away the ark of the God of Israel, and let it return to its place, so that it may not kill us and our people.” For there was a deadly panic throughout the whole city[b]; the hand of God was very heavy there.
translation:
  language: sw
  text: Basi wakatuma wajumbe, wakawakusanya watawala wote wa Wafilisti, wakasema, “Liondoeni sanduku la Mungu wa Israeli, nalo lirudi mahali pake, ili lisiniue mimi na watu wangu.” Kwa maana kulikuwa na taharuki ya kufisha katika mji wote[a]; mkono wa Mungu ulikuwa mzito sana huko[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “taharuki ya mauti,” “vurugu ya kufisha,” au “hofu iliyoleta kifo.”
    reason: Usemi wa Kiebrania מְהוּמַת מָוֶת unaweza kueleza hofu, mkanganyiko, au vurugu kali inayohusiana na kifo.
  - marker: b
    text: 'Kiebrania: “mkono wa Mungu ulikuwa mzito sana huko,” yaani taswira ya nguvu ya Mungu ikitenda katika hukumu.'
    reason: Dokezo linaeleza taswira ya Kiebrania bila kuiondoa katika matini kuu.
lexical_decisions:
- source_word: סַרְנֵי
  choice: watawala
  rationale: Neno hili linawataja viongozi rasmi wa miji ya Wafilisti. “Watawala” linaeleweka kwa urahisi na linaonyesha cheo chao cha kisiasa bila kuingiza mfumo usiotajwa katika maandishi.
- source_word: שַׁלְּחוּ
  choice: Liondoeni
  rationale: Amri hii inataka sanduku liondolewe kutoka mjini na kupelekwa kwingine; “liondoeni” linaonyesha wazi maana hiyo katika Kiswahili cha kawaida.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: sanduku la Mungu wa Israeli
  rationale: Tafsiri hii inahifadhi uhusiano wa kisarufi na wazo kwamba sanduku hilo ni la Mungu wa Israeli.
- source_word: וְיָשֹׁב לִמְקֹמוֹ
  choice: nalo lirudi mahali pake
  rationale: Umbo la kutakia au kuamuru kwa upole linalofuata amri limewakilishwa kwa “lirudi”; “mahali pake” linahifadhi usemi wa Kiebrania.
- source_word: וְלֹא יָמִית אֹתִי וְאֶת עַמִּי
  choice: ili lisiniue mimi na watu wangu
  rationale: Kitenzi kina maana ya kuua, na kishazi kinaonyesha kusudi la kuzuia jambo hilo. Viwakilishi vya umoja vya Kiebrania vimehifadhiwa katika “mimi na watu wangu,” ingawa wasemaji waliotangulia wametajwa kwa wingi.
- source_word: מְהוּמַת מָוֶת
  choice: taharuki ya kufisha
  rationale: Usemi huu unaunganisha vurugu au hofu kali na kifo. “Taharuki ya kufisha” ni ya asili katika Kiswahili na inahifadhi ukali pamoja na matokeo ya mauti.
- source_word: בְּכָל הָעִיר
  choice: katika mji wote
  rationale: Hii inaonyesha kwamba taharuki ilikuwa imeenea kotekote mjini.
- source_word: כָּבְדָה מְאֹד יַד הָאֱלֹהִים
  choice: mkono wa Mungu ulikuwa mzito sana
  rationale: Taswira muhimu ya kibiblia ya “mkono” imehifadhiwa, na “mzito sana” linaakisi nguvu ya maneno ya Kiebrania bila kuyafafanua kupita kiasi.
theological_decisions:
- issue: Kuhifadhi au kufafanua taswira ya “mkono wa Mungu”
  choice: mkono wa Mungu ulikuwa mzito sana huko
  alternative: Mungu aliwaadhibu vikali sana huko
  rationale: Kiebrania kinatumia wazi taswira ya mkono kuonyesha utendaji na hukumu ya Mungu. Kuihifadhi kunadumisha uhusiano wake na matumizi mengine ya kibiblia bila kulazimisha ufafanuzi mmoja pekee.
- issue: Tofauti kati ya wasemaji wa wingi na viwakilishi vya umoja
  choice: mimi na watu wangu
  alternative: sisi na watu wetu
  rationale: Maandishi ya Kiebrania yana viambishi vya umoja, huenda yakionyesha sauti ya msemaji mwakilishi au mtawala wa mji. Tafsiri haijasawazisha tofauti hii kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi “Basi ... wakasema” ni wa asili, na taswira muhimu ya Kiebrania pamoja na tofauti ya idadi ya viwakilishi imehifadhiwa.
