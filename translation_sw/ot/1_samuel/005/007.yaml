base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/007.yaml
  text: When the men of Ashdod saw that it was so[a], they said, “The ark of the God of Israel must not remain with us[b], because his hand is heavy against us and against Dagon our god.”
translation:
  language: sw
  text: Wanaume wa Ashdodi walipoona kwamba hali ilikuwa hivyo, wakasema, “Sanduku la Mungu wa Israeli halipaswi kubaki pamoja nasi[a], kwa maana mkono wake umekuwa mzito dhidi yetu na dhidi ya Dagoni, mungu wetu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “halipaswi kukaa pamoja nasi.” Kitenzi cha Kiebrania kinaweza kumaanisha kukaa, kuishi, au kubaki.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “mkono wake umekuwa mzito dhidi yetu na dhidi ya Dagoni, mungu wetu”; huu ni usemi unaoonyesha nguvu kali au hukumu ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ אַנְשֵׁי אַשְׁדּוֹד
  choice: Watu wa Ashdodi walipoona
  rationale: Muundo wa wakati unaendeleza simulizi na kuunganisha walichokiona na kauli yao. Ingawa אַנְשֵׁי kihalisi ni ‘wanaume wa,’ hapa ni usemi wa wakazi au wawakilishi wa mji; ‘watu wa Ashdodi’ ni Kiswahili cha kawaida kisichozidisha maana.
- source_word: כִּי כֵן
  choice: kwamba mambo yalikuwa hivyo
  rationale: Usemi huu hurejelea hali iliyoelezwa katika muktadha uliotangulia. Tafsiri hii ni ya asili katika Kiswahili na inadumisha maana ya kurejelea hali hiyo.
- source_word: לֹא יֵשֵׁב
  choice: halipaswi kubaki
  rationale: Kitenzi יָשַׁב kinaweza kumaanisha kukaa, kuishi, au kubaki. Sanduku likiwa kiima, ‘kubaki’ huonyesha kwa usahihi kuendelea kuwapo mahali hapo, na ‘halipaswi’ huwasilisha azimio la wasemaji.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: Sanduku la Mungu wa Israeli
  rationale: Tafsiri ya karibu inayohifadhi jina rasmi na utofautishaji na ‘Dagoni mungu wetu.’
- source_word: עִמָּנוּ
  choice: pamoja nasi
  rationale: Hii inatafsiri moja kwa moja wazo la kuwa ‘pamoja nasi’ bila kuongeza maana ya mahali isiyolazimu.
- source_word: קָשְׁתָה יָדוֹ עָלֵינוּ
  choice: mkono wake umetulemea
  rationale: Huhifadhi sitiari ya Kiebrania ya mkono wa Mungu huku ikitoa kwa Kiswahili cha asili maana ya nguvu au hukumu yake inayowakandamiza.
- source_word: וְעַל דָּגוֹן אֱלֹהֵינוּ
  choice: sisi na Dagoni mungu wetu
  rationale: ‘Metulemea sisi na Dagoni’ inafanya kiambishi cha yambwa ‘-tu-’ kiwahusu watu, kisha inapanua athari hiyo kwa Dagoni. ‘Mungu wetu’ huhifadhi mtazamo wa Wafilisti bila kuuthibitisha.
theological_decisions:
- issue: Sitiari ya hukumu ya Mungu katika קָשְׁתָה יָדוֹ
  choice: mkono wake umetulemea
  alternative: ametutesa vikali
  rationale: Tafsiri iliyochaguliwa inadumisha taswira ya ‘mkono’ wa Mungu na tendo lake dhidi yao, badala ya kuondoa sitiari kwa kuifafanua tu.
- issue: Dagoni kuitwa אֱלֹהֵינוּ
  choice: Dagoni mungu wetu
  alternative: Dagoni sanamu yetu
  rationale: Maneno ya Wafilisti yamehifadhiwa kama yalivyo ili kuonyesha mtazamo wao na mvutano wa simulizi, bila kuongeza neno la kupinga lisilomo katika Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Sanduku’ limetumiwa kwa sanduku la agano kulingana na muktadha. Alama zote za tanbihi zimewekwa katika matini kuu.
