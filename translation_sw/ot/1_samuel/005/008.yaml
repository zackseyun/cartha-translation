base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/008.yaml
  text: So they sent and gathered all the lords of the Philistines to themselves[a], and said, “What shall we do with the ark of the God of Israel?” And they said, “Let the ark of the God of Israel be brought around to Gath.” So they brought the ark of the God of Israel around.
translation:
  language: sw
  text: Basi wakatuma, wakawakusanya kwao watawala wote wa Wafilisti. Wakawaambia, “Tulifanyie nini Sanduku la Mungu wa Israeli?” Nao wakasema, “Sanduku la Mungu wa Israeli lihamishwe hadi Gathi.”[a] Kwa hiyo wakalihamisha Sanduku la Mungu wa Israeli hadi Gathi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sanduku la Mungu wa Israeli liende kuzunguka hadi Gathi.” Kitenzi cha Kiebrania kinaweza kukazia mwendo wa kuzunguka au uhamishaji, bila kubainisha namna hasa lilivyosafirishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: wakatuma wajumbe
  rationale: Kitenzi שׁלח ni ‘kutuma’; katika muktadha wa kuwakusanya watawala, ‘wajumbe’ linaeleweka kutokana na tendo bila kudai kwamba maandishi yanawataja moja kwa moja.
- source_word: וַיַּאַסְפוּ
  choice: na kuwakusanya
  rationale: אָסף humaanisha kukusanya au kuleta pamoja; ‘kuwakusanya’ ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: watawala wote wa Wafilisti
  rationale: סֶרֶן ni cheo cha watawala wa miji ya Wafilisti. ‘Watawala’ huepuka maana ya kifalme ya ‘wakuu’ au ‘wafalme’ na ni wazi kwa wasomaji wa sasa.
- source_word: אֲלֵיהֶם
  choice: kwao
  rationale: Kihusishi kinaonyesha kuwa watawala walikusanywa mahali walipokuwa wazungumzaji; ‘kwao’ ni usemi wa asili wa Kiswahili.
- source_word: מַה נַּעֲשֶׂה
  choice: Tulifanyie nini
  rationale: Kauli ya nafsi ya kwanza wingi inaonyesha mashauriano. ‘Tulifanyie nini’ ni ya asili na huhifadhi wazo la kuamua hatua ya kuchukua kuhusu Sanduku.
- source_word: לַאֲרוֹן
  choice: Sanduku
  rationale: ל katika swali hili huwasilishwa kiasili kwa kiambishi cha kitendewa katika ‘tulifanyie nini,’ badala ya kutafsiriwa neno kwa neno.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huu ni muundo wa umilikaji unaomaanisha moja kwa moja ‘Mungu wa Israeli.’
- source_word: גַּת
  choice: Gathi
  rationale: Jina la mahali limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: יִסֹּב
  choice: lihamishwe hadi Gathi
  rationale: סבב huonyesha kwenda, kuzunguka, au kugeuzwa. Katika simulizi hili maana ya kimuktadha ni kulipeleka Sanduku kutoka mji mmoja hadi mwingine; ‘lihamishwe’ ni wazi huku tanbihi ikihifadhi upana wa kitenzi.
- source_word: וַיַּסֵּבּוּ
  choice: wakalihamisha ... hadi huko
  rationale: 'Hiphil ni ya kusababisha mwendo: walilisababisha Sanduku liende. ‘Wakalihamisha’ huonyesha uhamishaji huo kwa Kiswahili cha kawaida bila kubainisha njia ya usafirishaji.'
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Sanduku’ limeandikwa kwa herufi kubwa kama jina fupi la Sanduku la Mungu. Muundo umerahisishwa kwa usomaji wa kawaida huku maana ya uhamishaji katika סבב ikihifadhiwa katika tanbihi.
