- from: Basi wakatuma wajumbe na kuwakusanya kwao watawala wote wa Wafilisti. Wakawauliza, “Tulifanyie nini Sanduku la Mungu wa Israeli?” Nao wakasema, “Sanduku la Mungu wa Israeli lihamishwe hadi Gathi.” Kwa hiyo wakalihamisha Sanduku la Mungu wa Israeli hadi huko.[a]
