  source_fidelity: Rasimu inaakisi kwa ujumla hoja ya simulizi na uhamishaji wa Sanduku kwenda Gathi. Hata hivyo, “wakatuma wajumbe” huongeza wazi kitu kisichotajwa katika Kiebrania; kitenzi kinasema tu “wakatuma.” Pia, ויאמרו ni “wakasema,” wala si “wakawauliza,” ingawa swali linalofuata linaonyesha waliwaelekeza wakuu hao.
