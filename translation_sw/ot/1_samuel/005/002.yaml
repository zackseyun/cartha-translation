base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/002.yaml
  text: So the Philistines took the ark of God and brought it into the house of Dagon[a], and set it beside Dagon.
translation:
  language: sw
  text: Basi Wafilisti wakalichukua sanduku la Mungu, wakaliingiza katika nyumba ya Dagoni[a], wakaliweka kando ya Dagoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hekalu la Dagoni.” Kwa maana halisi, “nyumba ya Dagoni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: wakalichukua
  rationale: Kitenzi לקח hapa ni ‘chukua’; muundo wa -ka- unaendeleza mfululizo wa matukio bila kuongeza wazo la kuliteka kwa nguvu.
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili sanifu.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: sanduku la Mungu
  rationale: ‘Sanduku’ ni istilahi ya kawaida ya Kiswahili kwa אֲרוֹן katika muktadha huu mtakatifu; הָאֱלֹהִים imetafsiriwa ‘Mungu’ bila kuibadili kuwa jina YHWH ambalo halipo katika mstari huu.
- source_word: וַיָּבִיאוּ אֹתוֹ
  choice: wakaliingiza
  rationale: Hifili ya בוא humaanisha ‘kuleta/kuingiza.’ Kwa kuwa mahali panapotajwa ni ndani ya nyumba ya Dagoni, ‘wakaliingiza’ ni Kiswahili cha asili na hakiongezi namna ya kulibeba.
- source_word: בֵּית דָּגוֹן
  choice: nyumba ya Dagoni
  rationale: Huhifadhi usemi halisi ‘nyumba ya Dagoni’; katika muktadha huu nyumba hiyo ni hekalu, jambo linaloelezwa katika tanbihi.
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: na kuliweka
  rationale: Hifili ya יצג ni kuweka au kusimamisha kitu mahali fulani. ‘Kuliweka’ ni wazi na ya kawaida kwa sanduku.
- source_word: אֵצֶל דָּגוֹן
  choice: kando ya Dagoni
  rationale: אֵצֶל huonyesha ukaribu, ‘kando ya/karibu na.’ Maandishi yanasema Dagoni tu; hayafafanui moja kwa moja kuwa ni sanamu yake, hivyo utata huo umehifadhiwa.
theological_decisions:
- issue: Jina la Mungu katika usemi ‘sanduku la Mungu’
  choice: Mungu
  alternative: BWANA
  rationale: Kiebrania kina הָאֱלֹהִים, si YHWH; kwa hiyo tafsiri inahifadhi jina la jumla lililotumiwa katika mstari huu.
- issue: Dagoni anayerejelewa mwisho wa mstari
  choice: Dagoni
  alternative: sanamu ya Dagoni
  rationale: Muktadha huenda unarejelea sanamu ya ibada, lakini Kiebrania kinasema tu ‘Dagoni.’ Kuongeza ‘sanamu’ katika maandishi makuu kungesuluhisha kimya-kimya jambo ambalo chanzo hakilisemi wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi vya -ka- unaakisi usimulizi wa Kiebrania kwa mtiririko wa asili wa Kiswahili.
