base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/006.yaml
  text: And the hand of Yahweh was heavy against the people of Ashdod[a], and he devastated them and struck them with tumors, Ashdod and its territory.
translation:
  language: sw
  text: Mkono wa Yahweh ulikuwa mzito dhidi ya watu wa Ashdodi; akawaletea maangamizi na kuwapiga kwa vimbe[a] katika Ashdodi na eneo lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uvimbe”; kwa mapokeo, wengine hutafsiri kwa maana mahususi zaidi kuwa “bawasiri.”
    reason: Neno la Kiebrania linaweza kumaanisha vimbe za mwili; tafsiri ya jadi ya “bawasiri” ni mahususi kuliko ushahidi wa neno lenyewe.
lexical_decisions:
- source_word: וַתִּכְבַּד יַד יְהוָה
  choice: Mkono wa Yahweh ukawa mzito
  rationale: Inahifadhi taswira halisi ya nahau ya Kiebrania kuhusu tendo lenye nguvu na hukumu kali ya Mungu, bila kuigeuza kuwa wazo lisilo na taswira.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Inawakilisha jina binafsi la Mungu lililoandikwa kwa herufi יהוה badala ya kulibadilisha kuwa cheo.
- source_word: אֶל הָאַשְׁדּוֹדִים
  choice: dhidi ya watu wa Ashdodi
  rationale: Nomino hii inawataja wakazi wa Ashdodi, na kihusishi hapa kinaonyesha mwelekeo wa uadui.
- source_word: וַיְשִׁמֵּם
  choice: akawaletea uharibifu
  rationale: Kitenzi kina maana ya kusababisha ukiwa au uharibifu mkubwa; kauli hii huepuka kudokeza bila msingi kwamba wote waliuawa.
- source_word: וַיַּךְ אֹתָם
  choice: kuwapiga
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi cha hukumu kinachomaanisha kupiga au kuleta pigo.
- source_word: בָּעֳפָלִים
  choice: kwa uvimbe
  rationale: Neno la Kiebrania linaeleza uvimbe wa mwili bila kuhakikisha mahali pake; tafsiri pana inalinda kutokuwa na uhakika kwa neno hilo.
- source_word: אֶת אַשְׁדּוֹד וְאֶת גְּבוּלֶיהָ
  choice: yaani Ashdodi pamoja na eneo lake
  rationale: Kirai hiki kinafafanua upeo wa pigo kuwa mji wenyewe pamoja na eneo lililokuwa chini yake.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Kutumia “Yahweh” kunahifadhi jina binafsi la Mungu wa agano badala ya kuweka cheo mahali pake.
- issue: Mahali au aina mahususi ya uvimbe
  choice: uvimbe
  alternative: bawasiri
  rationale: Maana mahususi ya bawasiri ni mapokeo ya kale yanayowezekana, lakini neno la chanzo halilazimishi ufasiri huo; kwa hiyo utata umehifadhiwa katika mstari na mbadala umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Taswira ya “mkono ... kuwa mzito” imehifadhiwa; “yaani” inaonyesha wazi kuwa Ashdodi na eneo lake vinafafanua upeo wa pigo.
