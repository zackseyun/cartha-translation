lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Jina la taifa limetolewa kwa umbo la kawaida la Kiswahili. Kiunganishi וּ kinaunganisha simulizi, lakini hakihitaji kutafsiriwa kwa “Na” mwanzoni mwa sentensi ya Kiswahili; tofauti hiyo imeonyeshwa katika tanbihi.
- source_word: לָקְחוּ
  choice: walikuwa wamelichukua
  rationale: Kitenzi cha Qal timilifu, nafsi ya tatu wingi, kutoka לקח humaanisha ‘kuchukua.’ Umbo la wakati uliopita uliotangulia linaonyesha kuwa mstari huu unarejelea tendo lililotokea katika simulizi lililotangulia.
- source_word: אֵת
  choice: '[hakikutafsiriwa]'
  rationale: Hiki ni kiashiria cha yambwa mahususi cha Kiebrania, ambacho hakina neno linalolingana nacho moja kwa moja katika Kiswahili.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: sanduku la Mungu
  rationale: Muundo huu wa uhusiano unafuata maana ya Kiebrania kwa uwazi na ni wa kawaida katika Kiswahili cha Biblia.
- source_word: וַיְבִאֻהוּ
  choice: na kulileta
  rationale: Hiphil wayyiqtol ya בוא pamoja na kiambishi cha yambwa cha kiume umoja humaanisha ‘na wakalileta.’ Muundo wa kitenzi-jina unaendeleza kwa kawaida kitenzi ‘walikuwa wamelichukua’ bila kurudia kiima.
- source_word: מֵאֶבֶן הָעֵזֶר
  choice: kutoka Eben-ezeri
  rationale: Kihusishi מִן kimetafsiriwa ‘kutoka,’ na jina la mahali limetoholewa kwa umbo linalotambulika katika Kiswahili.
- source_word: אַשְׁדּוֹדָה
  choice: hadi Ashdodi
  rationale: Herufi ה ya mwelekeo inaonyesha mwendo kuelekea Ashdodi. ‘Hadi’ linaeleza kikomo cha safari kwa Kiswahili cha kawaida.
