  text: The Philistines had taken the ark of God and brought it from Ebenezer to Ashdod[a].
translation:
  language: sw
  text: Wafilisti[a] walikuwa wamelichukua sanduku la Mungu na kulileta kutoka Eben-ezeri hadi Ashdodi.
  philosophy: optimal-equivalence
  footnotes:
