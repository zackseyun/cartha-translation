  terminology: '''Dagoni,'' ''sanduku la Yahwe,'' na ''viganja'' zinafaa. Jina Yahwe linawasilisha tetragramu kama jina binafsi kwa uthabiti. Tanbihi inapaswa kunukuu usemi wa Kiebrania kwa karibu na kueleza kuwa rejeleo la kiwakilishi ni gumu.'
