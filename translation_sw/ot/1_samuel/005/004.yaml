  to: Walipoamka asubuhi na mapema siku iliyofuata, tazama, Dagoni alikuwa ameanguka kifudifudi ardhini mbele ya sanduku la Yahwe. Kichwa cha Dagoni na viganja vya mikono yake miwili vilikuwa vimekatwa, navyo vilikuwa juu ya kizingiti; Dagoni pekee ndiye aliyebaki[a].
