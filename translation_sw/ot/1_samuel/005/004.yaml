source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּקֶר֮ מִֽ/מָּחֳרָת֒ וְ/הִנֵּ֣ה דָג֗וֹן נֹפֵ֤ל לְ/פָנָי/ו֙ אַ֔רְצָ/ה לִ/פְנֵ֖י אֲר֣וֹן יְהוָ֑ה וְ/רֹ֨אשׁ דָּג֜וֹן וּ/שְׁתֵּ֣י כַּפּ֣וֹת יָדָ֗י/ו כְּרֻתוֹת֙ אֶל הַ/מִּפְתָּ֔ן רַ֥ק דָּג֖וֹן נִשְׁאַ֥ר עָלָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/004.yaml
  text: When they rose early the next morning[a], behold, Dagon had fallen facedown on the ground before the ark of Yahweh, and the head of Dagon and both the palms of his hands were cut off on the threshold; only Dagon was left on him.
translation:
  language: sw
  text: Walipoamka asubuhi na mapema siku iliyofuata, tazama, Dagoni alikuwa ameanguka kifudifudi ardhini mbele ya sanduku la Yahwe. Kichwa cha Dagoni na viganja vya mikono yake miwili vilikuwa vimekatwa, navyo vilikuwa juu ya kizingiti; Dagoni pekee ndiye aliyebaki[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ni Dagoni tu aliyebaki juu yake.” Kifungu hiki ni kigumu; huenda kinamaanisha kwamba, baada ya kichwa na viganja kukatwa, kiwiliwili cha sanamu ndicho kilichobaki.'
    reason: Kuhifadhi usemi mgumu wa Kiebrania katika matini kuu na kueleza katika tanbihi maana inayowezekana kutokana na muktadha, bila kuifanya kuwa tafsiri ya lazima.
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר מִמָּחֳרָת
  choice: Walipoamka asubuhi na mapema siku iliyofuata
  rationale: Huwasilisha kuamka mapema pamoja na wakati wa asubuhi ya siku iliyofuata kwa Kiswahili cha kawaida, huku muundo wa 'walipo-' ukiunganisha tukio na walichokuta.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili linadumisha mshangao na kuvuta fikira za msomaji kwenye jambo lililokutwa.
- source_word: נֹפֵל לְפָנָיו אַרְצָה
  choice: alikuwa ameanguka kifudifudi ardhini
  rationale: Kauli hii inaonyesha hali ambayo sanamu ilikutwa tayari imo; 'kifudifudi' huonyesha kwamba uso wake ulikuwa chini.
- source_word: אֲרוֹן יְהוָה
  choice: sanduku la Yahwe
  rationale: Hutafsiri אֲרוֹן kwa neno la kawaida 'sanduku' na kuhifadhi jina binafsi la Mungu, Yahwe.
- source_word: וּשְׁתֵּי כַּפּוֹת יָדָיו
  choice: viganja vya mikono yake yote miwili
  rationale: כַּפּוֹת hutaja viganja hasa, na 'yote miwili' huhifadhi wazo la mikono miwili.
- source_word: כְּרֻתוֹת אֶל הַמִּפְתָּן
  choice: vilikuwa vimekatwa na vilikuwa juu ya kizingiti
  rationale: Hueleza hali ya viungo vilivyokatwa na mahali vilipokutwa bila kudokeza ni nani aliyekata au kwamba vilitupwa huko.
- source_word: רַק דָּגוֹן נִשְׁאַר עָלָיו
  choice: ni Dagoni tu aliyebaki kwake
  rationale: Huhifadhi kwa kiasi kikubwa ugumu na utata wa Kiebrania badala ya kuingiza moja kwa moja neno 'kiwiliwili'; tanbihi inaeleza maana inayowezekana.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina la agano יהוה; 'Yahwe' hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kifungu cha mwisho kuhusu Dagoni
  choice: ni Dagoni tu aliyebaki kwake
  alternative: ni kiwiliwili cha Dagoni tu kilichobaki
  rationale: Kiebrania ni kifupi na kigumu, na hakitaji wazi 'kiwiliwili.' Tafsiri kuu inadumisha mvutano huo, huku tanbihi ikitoa maana inayowezekana kutokana na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa na wenye heshima. 'Tazama' limetumiwa kudumisha msisitizo wa ghafla wa simulizi, na sentensi imegawanywa ili isomeke kwa urahisi.
