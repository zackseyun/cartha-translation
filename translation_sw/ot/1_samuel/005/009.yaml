reference: 1 Samuel 5:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֞י אַחֲרֵ֣י הֵסַ֣בּוּ אֹת֗/וֹ וַ/תְּהִ֨י יַד יְהוָ֤ה בָּ/עִיר֙ מְהוּמָה֙ גְּדוֹלָ֣ה מְאֹ֔ד וַ/יַּךְ֙ אֶת אַנְשֵׁ֣י הָ/עִ֔יר מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּשָּׂתְר֥וּ לָ/הֶ֖ם עפלים׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/009.yaml
  text: And after they had moved it around[a], the hand of Yahweh was against the city, causing a very great panic; and he struck the men of the city, from small to great, and tumors broke out on them.
translation:
  language: sw
  text: Ikawa, baada ya kulihamisha, mkono wa Yahwe ulikuwa dhidi ya mji, ukaleta hofu kubwa sana. Akawapiga wanaume wa mji, kuanzia mdogo hadi mkubwa; vivimbe ziliwatokea[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walipatwa na vivimbe.” Usemi wa Kiebrania unaeleza kuonekana au kuzuka kwa uvimbe mwilini.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסַבּוּ אֹתוֹ
  choice: baada ya kulihamisha
  rationale: Kauli ya Hifili ya סבב pamoja na kiwakilishi cha kitu inaonyesha kuliondoa Sanduku na kulipeleka mahali pengine. ‘Kulihamisha’ ni Kiswahili cha kawaida na hakiongezi mwelekeo ambao Kiebrania hakijautaja.
- source_word: יַד יְהוָה
  choice: mkono wa Yahwe
  rationale: Hifadhi sitiari ya Kiebrania inayoonyesha nguvu na hukumu ya Mungu inayotenda kazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa moja kwa moja badala ya kubadilishwa kuwa cheo kama ‘BWANA.’
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: hofu kubwa sana
  rationale: מְהוּמָה inaweza kumaanisha hofu, vurugu, au kuchanganyikiwa; katika muktadha huu wa pigo lililoujia jiji, ‘hofu kubwa sana’ ni ya asili na inaeleweka vizuri.
- source_word: וַיַּךְ
  choice: Akawapiga
  rationale: Kitenzi cha umoja kinamrejelea Yahwe kama mtendaji na kinahifadhi nguvu halisi ya kitenzi נכה.
- source_word: אַנְשֵׁי הָעִיר
  choice: wanaume wa mji
  rationale: Kiebrania kinataja wanaume kwa namna mahsusi, si wakazi kwa ujumla; tafsiri inahifadhi utofauti huo.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: kuanzia mdogo hadi mkubwa
  rationale: Hifadhi nahau ya Kiebrania na kuacha wazi iwapo inahusu umri, cheo, au hadhi.
- source_word: וַיִּשָּׂתְרוּ לָהֶם עפלים
  choice: nao wakatokwa na vivimbe
  rationale: Kirai kinaeleza kuonekana au kuzuka kwa uvimbe mwilini. ‘Vivimbe’ hakilazimishi utambuzi maalumu wa kitabibu ambao neno la Kiebrania halithibitishi kwa uhakika.
theological_decisions:
- issue: Kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia Tetragramatoni moja kwa moja. ‘Yahwe’ huhifadhi jina la agano na ndilo umbo linalokubalika zaidi kitaaluma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umefanywa uwe wa kawaida kwa msomaji wa leo huku sitiari ‘mkono wa Yahwe,’ jinsia ya ‘wanaume,’ na kutokuwa dhahiri kwa ‘mdogo hadi mkubwa’ vikihifadhiwa. Alama ya tanbihi imewekwa kwenye kirai cha vivimbe, ambacho ndicho kinachofafanuliwa na tanbihi.
