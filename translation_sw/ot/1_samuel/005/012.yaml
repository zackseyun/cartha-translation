lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Nao wanaume
  rationale: אֲנָשִׁים kwa kawaida humaanisha “wanaume.” “Nao” linaendeleza muunganiko wa simulizi unaoonyeshwa na וְ bila kuongeza habari isiyomo katika matini.
- source_word: אֲשֶׁר לֹא מֵתוּ
  choice: ambao hawakufa
  rationale: Tafsiri hii ya moja kwa moja inawatofautisha walioendelea kuishi na wale waliokufa.
- source_word: הֻכּוּ
  choice: walipigwa
  rationale: Umbo la kutendwa la נכה lina maana ya “walipigwa” au “waliteswa.” “Walipigwa” linahifadhi taswira yenye nguvu ya Kiebrania.
- source_word: בָעֳפָלִים
  choice: kwa uvimbe
  rationale: עֳפָלִים humaanisha uvimbe wa mwili au vivimbe. “Uvimbe” ni neno la sasa linaloeleweka na halibainishi kwa uhakika ugonjwa ambao Kiebrania hakibainishi wazi.
- source_word: וַתַּעַל
  choice: kikapanda
  rationale: עלה humaanisha “kupanda” au “kwenda juu.” “Kikapanda” linahifadhi taswira ya kilio kinachofika juu.
- source_word: שַׁוְעַת
  choice: kilio
  rationale: שַׁוְעָה ni kilio cha dhiki au cha kuomba msaada. “Kilio” ni kifupi, cha kawaida, na kinafaa katika muktadha.
- source_word: הָעִיר
  choice: cha mji
  rationale: Muundo שַׁוְעַת הָעִיר ni “kilio cha mji,” yaani kilio cha pamoja cha wakazi wake.
- source_word: הַשָּׁמָיִם
  choice: mpaka mbinguni
  rationale: Ingawa שָׁמַיִם lina umbo la wingi katika Kiebrania, “mbinguni” ni usemi wa kawaida wa Kiswahili. “Mpaka” linaonyesha kwamba kilio kilifika huko bila kulazimisha kutaja moja kwa moja aliyekisikia.
