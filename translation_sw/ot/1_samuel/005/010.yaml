  text: וַֽ/יְשַׁלְּח֛וּ אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים עֶקְר֑וֹן וַ/יְהִ֗י כְּ/ב֨וֹא אֲר֤וֹן הָ/אֱלֹהִים֙ עֶקְר֔וֹן וַ/יִּזְעֲק֨וּ הָֽ/עֶקְרֹנִ֜ים לֵ/אמֹ֗ר הֵסַ֤בּוּ אֵלַ/י֙ אֶת אֲרוֹן֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לַ/הֲמִיתֵ֖/נִי וְ/אֶת עַמִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/010.yaml
  text: So they sent the ark of God to Ekron. But when the ark of God came to Ekron, the Ekronites cried out, saying, “They have brought around to me the ark of the God of Israel, to kill me and my people!”
translation:
  language: sw
  text: Basi wakalipeleka sanduku la Mungu huko Ekroni. Lakini sanduku la Mungu lilipofika Ekroni, watu wa Ekroni wakapiga kelele wakisema, “Wameniletea sanduku la Mungu wa Israeli ili waniue mimi na watu wangu!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: wakalipeleka
  rationale: Kitenzi hiki kimsingi ni ‘wakatuma/wakapeleka’; kwa sanduku linalohamishwa kutoka mji mmoja kwenda mwingine, ‘wakalipeleka’ ni Kiswahili cha kawaida na sahihi.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: sanduku la Mungu
  rationale: ‘Sanduku’ ni istilahi iliyo wazi na ya kawaida kwa ארון katika muktadha huu; kiambishi cha uhusiano kinahifadhi maana ya ‘la Mungu’.
- source_word: וַיִּזְעֲקוּ
  choice: wakapiga kelele
  rationale: Huwasilisha kilio kikubwa cha hofu na taharuki, si kusema kwa sauti ya kawaida tu.
- source_word: הֵסַבּוּ אֵלַי
  choice: Wameniletea
  rationale: Hifil ya סבב hapa ina wazo la kugeuza au kuhamisha kitu hadi kwa msemaji; ‘wameniletea’ ni ya asili katika Kiswahili na inahifadhi mwelekeo wa nafsi ya kwanza umoja.
- source_word: לַהֲמִיתֵנִי וְאֶת־עַמִּי
  choice: ili waniue mimi na watu wangu
  rationale: Inahifadhi wazi nafsi ya kwanza umoja ya maandishi ya Kiebrania na kusudi linalodhaniwa na walalamikaji.
theological_decisions:
- issue: Mabadiliko ya nafsi kati ya ‘watu wa Ekroni’ na kilio cha umoja ‘mimi/watu wangu’
  choice: Kuhifadhi ‘mimi’ na ‘watu wangu’
  alternative: ‘sisi’ na ‘watu wetu’
  rationale: Maandishi ya Kimasora yana viambishi vya nafsi ya kwanza umoja (אֵלַי, הֲמִיתֵנִי, עַמִּי). Tafsiri haipaswi kusawazisha mvutano huo kuwa wingi bila ushahidi wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo wa simulizi umetumia ‘Basi’ na vitenzi vya mfululizo; kilio cha moja kwa moja kimehifadhi msisitizo wa ‘mimi’ uliomo katika Kiebrania.
