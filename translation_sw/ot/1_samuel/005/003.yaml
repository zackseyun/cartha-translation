  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֤מוּ אַשְׁדּוֹדִים֙ מִֽ/מָּחֳרָ֔ת וְ/הִנֵּ֣ה דָג֗וֹן נֹפֵ֤ל לְ/פָנָי/ו֙ אַ֔רְצָ/ה לִ/פְנֵ֖י אֲר֣וֹן יְהוָ֑ה וַ/יִּקְחוּ֙ אֶת דָּג֔וֹן וַ/יָּשִׁ֥בוּ אֹת֖/וֹ לִ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/003.yaml
  text: When the Ashdodites rose early the next day, behold, Dagon had fallen facedown on the ground before the ark of Yahweh. So they took Dagon and put him back in his place.
translation:
  language: sw
  text: Watu wa Ashdodi walipoamka asubuhi na mapema siku iliyofuata, tazama, Dagoni alikuwa ameanguka kifudifudi chini mbele ya sanduku la Yahweh. Basi wakamchukua Dagoni na kumrudisha mahali pake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: walipoamka asubuhi na mapema
  rationale: Hifili ya שׁכם humaanisha kuamka mapema. Kauli hii ni ya kawaida katika Kiswahili na inadumisha msisitizo wa wakati.
- source_word: אַשְׁדּוֹדִים
  choice: Watu wa Ashdodi
  rationale: Wingi huu wa jina la wenyeji unamaanisha wakazi wa Ashdodi. Kiswahili cha kawaida huwatambulisha kwa urahisi kama 'Watu wa Ashdodi'.
- source_word: מִמָּחֳרָת
  choice: siku iliyofuata
  rationale: Kirai hiki kinaonyesha siku inayofuata; tafsiri hii ni wazi na ya sasa.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Neno hili linavuta fikira kwenye jambo la ghafla na la kushangaza; 'tazama' inadumisha nguvu hiyo ya usimulizi.
- source_word: נֹפֵל
  choice: alikuwa ameanguka
  rationale: Ingawa umbo la Kiebrania ni participio, hapa linaeleza hali iliyokutwa baada ya kuanguka. Wakati timilifu wa Kiswahili unaonyesha kwamba Dagoni alikuwa tayari chini walipomwona.
- source_word: לְפָנָיו אַרְצָה
  choice: kifudifudi chini
  rationale: Maneno haya yanaonyesha Dagoni akiwa ameanguka uso ukielekea ardhini. 'Kifudifudi chini' ni ya asili, wazi, na inadumisha picha ya kudhalilishwa.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: mbele ya sanduku la Yahweh
  rationale: לִפְנֵי ina maana ya mahali hapa, na אֲרוֹן ni sanduku. Tafsiri haiongezi neno 'agano,' ambalo halipo katika mstari huu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne linawakilishwa kama jina binafsi 'Yahweh,' badala ya kubadilishwa na cheo.
- source_word: וַיִּקְחוּ אֶת־דָּגוֹן
  choice: wakamchukua Dagoni
  rationale: לקח ni kitenzi cha kawaida cha kuchukua. Upatanisho wa ngeli ya mtu unaakisi jinsi maandishi yanavyomtaja Dagoni kwa viambishi vya kiume.
- source_word: וַיָּשִׁבוּ אֹתוֹ לִמְקוֹמוֹ
  choice: kumrudisha mahali pake
  rationale: Hifili ya שׁוב humaanisha kusababisha arudi au kumrudisha. Kauli hii inaonyesha kurejeshwa kwa Dagoni kwenye nafasi yake ya kawaida.
theological_decisions:
- issue: Uwakilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina binafsi la Mungu, si cheo. 'Yahweh' linadumisha tofauti hiyo.
- issue: Ikiwa Dagoni atatajwa kama mungu mwenye uhai au kama sanamu
  choice: Jina 'Dagoni' limedumishwa bila kuongeza 'sanamu,' huku viambishi vya kiume vikitumiwa
  alternative: sanamu ya Dagoni; kuipeleka/kuiweka mahali pake
  rationale: Kiebrania kinamtaja Dagoni moja kwa moja na kutumia viambishi vya kiume, lakini katika tukio hilo watu wanainua kitu kinachoonekana. Tafsiri inadumisha mvutano huo badala ya kuamua wazi kuwa ni mungu au sanamu yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida lakini hadhi inayofaa simulizi la Biblia. 'Tazama' limedumishwa ili kuonyesha mshangao wa usimulizi; 'kifudifudi chini' ni wazi kwa msomaji wa sasa.
