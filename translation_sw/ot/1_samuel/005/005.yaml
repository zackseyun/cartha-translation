base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/005.yaml
  text: Therefore, to this day the priests of Dagon and all who enter Dagon's temple in Ashdod do not step on Dagon's threshold[a][b].
translation:
  language: sw
  text: Kwa hiyo, mpaka leo makuhani wa Dagoni na wote wanaoingia katika hekalu la Dagoni huko Ashdodi hawakanyagi kizingiti cha Dagoni.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa mtindo rasmi zaidi, “hawakanyagi juu ya kizingiti cha Dagoni.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “nyumba ya Dagoni”; hapa limetafsiriwa “hekalu la Dagoni” kwa kuwa muktadha unaonyesha jengo la ibada ya kipagani.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Huonyesha matokeo ya tukio lililotangulia kwa Kiswahili cha kawaida na chenye nguvu ya kisababishi.
- source_word: לֹא יִדְרְכוּ
  choice: hawakanyagi
  rationale: Kitenzi דרך humaanisha kukanyaga au kwenda kwa hatua; wakati wa sasa unaonyesha desturi inayoendelea hadi wakati wa msimulizi.
- source_word: כֹהֲנֵי דָגוֹן
  choice: makuhani wa Dagoni
  rationale: Ni tafsiri ya moja kwa moja ya muundo tegemezi na inaweka wazi huduma yao katika ibada ya Dagoni.
- source_word: וְכָל הַבָּאִים בֵּית דָּגוֹן
  choice: na wote wanaoingia katika hekalu la Dagoni
  rationale: Katika muktadha huu בוא בית hurejelea kuingia katika jengo la ibada; 'hekalu' hutoa maana hiyo wazi kwa msomaji wa sasa.
- source_word: עַל מִפְתַּן דָּגוֹן
  choice: kizingiti cha Dagoni
  rationale: מִפְתָּן ni kizingiti; muundo 'cha Dagoni' unahifadhi uhusiano wa nomino katika Kiebrania.
- source_word: בְּאַשְׁדּוֹד
  choice: huko Ashdodi
  rationale: Huonyesha mahali ambapo hekalu na desturi hiyo vilikuwapo; 'huko' ni ya asili katika sentensi hii.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba desturi iliendelea hadi wakati wa msimulizi.
theological_decisions: []
