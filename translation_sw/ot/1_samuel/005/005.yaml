  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri imetumia 'hekalu' kwa uwazi wa kimuktadha huku tanbihi ikihifadhi usemi halisi 'nyumba'; 'hawakanyagi' ni ya kawaida na inaeleza desturi inayoendelea.
