  source_fidelity: 'Tafsiri inahifadhi vipengele vyote vya Kiebrania: kiunganishi cha kisababishi, desturi endelevu ya kutokukanyaga, makuhani wa Dagoni pamoja na wote waingiao, mahali pa Ashdodi, kizingiti cha Dagoni, na upeo wa “mpaka leo.” “Hekalu” ni ufasiri wa kimuktadha unaokubalika kwa בית katika muktadha wa mahali pa ibada, huku tanbihi ikihifadhi usemi wa karibu zaidi, “nyumba ya Dagoni.”'
