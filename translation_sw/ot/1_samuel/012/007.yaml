base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/007.yaml
  text: Now therefore[a], stand here[b], and I will contend with you before Yahweh concerning all the righteous acts of Yahweh that he did for you and for your fathers.
translation:
  language: sw
  text: Basi sasa, simameni, nami nitashitaki nanyi[a] mbele za Yahweh kuhusu matendo yote ya haki ya Yahweh[b] aliyowatendea ninyi na baba zenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitawahukumu,” “nitateta shauri nanyi,” au “nitasema nanyi katika shauri.” Kiebrania kina maana ya kimahakama ya kuingia katika shauri mbele za Yahweh.
    reason: lexical_alternative
  - marker: b
    text: “Matendo ya haki” ni matendo ya Yahweh yanayoonyesha haki yake na uaminifu wake kwa agano kwa ajili ya watu wake.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Huonyesha mpito wenye hitimisho katika hotuba ya Samueli, si wakati tu.
- source_word: הִתְיַצְּבוּ
  choice: simameni tayari
  rationale: Amri hii inawaita wasikilizaji kusimama na kujiweka tayari kwa shauri rasmi.
- source_word: וְאִשָּׁפְטָה אִתְּכֶם
  choice: nami nitajadiliana nanyi
  rationale: Kauli ya Kiebrania ina maana ya kimahakama ya kuingia katika shauri. Tafsiri hii inaepuka kudokeza kwamba Samueli tayari ametoa hukumu, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Ni usemi wa kawaida unaoonyesha kwamba shauri linafanyika katika uwepo wa Yahweh na chini ya mamlaka yake.
- source_word: אֵת כָּל צִדְקוֹת יְהוָה
  choice: kuhusu matendo yote ya haki ya Yahweh
  rationale: צִדְקוֹת humaanisha matendo halisi yanayoonyesha haki na uaminifu wa Yahweh kwa agano; ‘matendo ya haki’ huhifadhi upana huo kuliko ‘matendo ya wokovu.’
- source_word: אֲשֶׁר עָשָׂה אִתְּכֶם וְאֶת אֲבוֹתֵיכֶם
  choice: aliyowatendea ninyi na mababu zenu
  rationale: Ingawa kihusishi kinaweza kuwa ‘pamoja na,’ muktadha unaonyesha matendo ya Yahweh kwa manufaa ya kizazi cha sasa na ya mababu zao.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya צִדְקוֹת יְהוָה
  choice: matendo ya haki ya Yahweh
  alternative: matendo ya wokovu ya Yahweh
  rationale: Kirai hiki kinahusu matendo ya Yahweh yaliyo ya haki na yenye uaminifu kwa agano. Tafsiri iliyochaguliwa haipunguzi maana yake iwe wokovu pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Simameni tayari’ na ‘nitajadiliana nanyi’ ni lugha inayoeleweka kwa wasomaji wa kawaida; tanbihi inaeleza uzito wa kimahakama ambao haujitokezi kikamilifu katika kitenzi cha kawaida cha Kiswahili.
