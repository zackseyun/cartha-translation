id: 1SA.12.11
reference: 1 Samuel 12:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ אֶת יְרֻבַּ֣עַל וְ/אֶת בְּדָ֔ן וְ/אֶת יִפְתָּ֖ח וְ/אֶת שְׁמוּאֵ֑ל וַ/יַּצֵּ֨ל אֶתְ/כֶ֜ם מִ/יַּ֤ד אֹֽיְבֵי/כֶם֙ מִ/סָּבִ֔יב וַ/תֵּשְׁב֖וּ בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/011.yaml
  text: And Yahweh sent Jerubbaal and Bedan and Jephthah and Samuel[a], and he delivered you from the hand of your enemies all around[b], and you lived in safety.
translation:
  language: sw
  text: Na Yahwe akawatuma Yerubaali[a], Bedani[b], Yeftha na Samweli; naye akawaokoa kutoka mikononi mwa adui zenu waliowazunguka, nanyi mkaishi salama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yerubaali ni jina lingine la Gideoni (tazama Waamuzi 6:32; 7:1).
    reason: cross_reference
  - marker: b
    text: Matini ya Kiebrania ina “Bedani.” Utambulisho wake hauna uhakika; baadhi ya wafafanuzi hulielewa jina hili kuwa Baraka au, kwa nadra zaidi, Abdoni.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni unukuzi wa kawaida wa Kiswahili wa jina la agano la Mungu, na unalihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- source_word: וַיִּשְׁלַח
  choice: akawatuma
  rationale: Kitenzi שׁלח hapa kina maana ya kutuma; kiambishi cha watendewa kinafaa kwa orodha ya watu waliotumwa.
- source_word: יְרֻבַּעַל
  choice: Yerubaali
  rationale: Jina lililo katika maandishi ya Kiebrania limehifadhiwa badala ya kubadilishwa kuwa Gideoni; utambulisho wake unaelezwa katika tanbihi.
- source_word: בְּדָן
  choice: Bedani
  rationale: Usomaji wa maandishi ya Kimasora umehifadhiwa bila kuusahihisha kimya kuwa Baraka au Abdoni.
- source_word: יִפְתָּח
  choice: Yeftha
  rationale: Huu ni umbo la jina linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: שְׁמוּאֵל
  choice: Samweli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: וַיַּצֵּל
  choice: akawaokoa
  rationale: נצל huonyesha kuondolewa katika hatari au mamlaka ya adui; 'akaokoa' ni wazi na ya asili katika Kiswahili.
- source_word: מִיַּד אֹיְבֵיכֶם
  choice: kutoka mikononi mwa adui zenu
  rationale: Inahifadhi sitiari ya Kiebrania ya 'mkono' kama mamlaka au udhibiti, ambayo inaeleweka vizuri katika Kiswahili.
- source_word: מִסָּבִיב
  choice: waliowazunguka
  rationale: Katika muktadha huu inaeleza kwamba maadui walikuwa pande zote; usemi huu ni wa asili na una nguvu ya kieneo.
- source_word: וַתֵּשְׁבוּ בֶּטַח
  choice: nanyi mkaishi kwa usalama
  rationale: ישׁב hapa ni kuishi au kukaa kwa kudumu, na בטח ni hali ya kutokuwa katika tishio; tafsiri hii ni wazi na ya kawaida.
theological_decisions:
- issue: Utambulisho wa בְּדָן
  choice: Kuhifadhi 'Bedani' katika matini kuu kama lilivyo jina katika maandishi ya Kimasora.
  alternative: Baraka au, kwa nadra zaidi, Abdoni.
  rationale: Ushahidi wa chanzo cha Kiebrania una uzito wa kwanza. Kwa kuwa utambulisho huo hauna uhakika, ugumu haupaswi kutatuliwa kimya kwa kuoanisha jina na mwamuzi mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Viunganishi vinafuata mtiririko wa masimulizi ya Kiebrania bila kuongeza dhana ya kusudi au matokeo; alama za tanbihi zimewekwa moja kwa moja baada ya majina husika.
