  text: אַ֣ךְ יְר֣אוּ אֶת יְהוָ֗ה וַ/עֲבַדְתֶּ֥ם אֹת֛/וֹ בֶּ/אֱמֶ֖ת בְּ/כָל לְבַבְ/כֶ֑ם כִּ֣י רְא֔וּ אֵ֥ת אֲשֶׁר הִגְדִּ֖ל עִמָּ/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/024.yaml
  text: Only fear Yahweh and serve him faithfully with all your heart[a], for consider what great things he has done with you.
translation:
  language: sw
  text: Lakini mwogopeni Yahweh tu, na mtumikieni kwa uaminifu kwa mioyo yenu yote; kwa maana tazameni mambo makuu aliyotenda nanyi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “aliyotenda nanyi”; yaweza pia kueleweka “aliyowafanyia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Lakini ... tu
  rationale: Katika muktadha huu chembe hii ina nguvu ya kuzuia na kusisitiza himizo; muundo huu wa Kiswahili unaendeleza tofauti na onyo lililotangulia huku ukisisitiza wajibu pekee unaofaa.
- source_word: יְרָאוּ
  choice: mwogopeni
  rationale: Kitenzi hiki kinahusisha hofu yenye heshima na utiifu kwa Mungu. 'Mwogopeni' kinahifadhi uzito wa nahau ya kibiblia kuliko kukifanya kuwa 'mheshimuni' pekee.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: na kumtumikia
  rationale: עבד kimsingi ni kutumikia; hapa kunajumuisha ibada na utiifu wa agano bila kuwekewa maana finyu ya ibada pekee.
- source_word: בֶּאֱמֶת
  choice: kwa uaminifu
  rationale: Katika himizo hili אֱמֶת linaeleza huduma ya kweli, thabiti na yenye uaminifu; 'kwa uaminifu' ni ya kawaida na wazi katika Kiswahili.
- source_word: בְּכָל לְבַבְכֶם
  choice: kwa mioyo yenu yote
  rationale: Nahau hii inaonyesha kujitoa kwa ndani bila kugawanyika; wingi wa 'mioyo' unalingana kwa uwazi na kundi linalosemewa.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi kinaanzisha sababu ya himizo lililotangulia.
- source_word: רְאוּ
  choice: tafakarini
  rationale: Ingawa maana ya msingi ni 'tazameni/angalia,' hapa amri inawataka watambue kwa kutafakari matendo ya Mungu.
- source_word: אֵת אֲשֶׁר הִגְדִּיל
  choice: mambo makuu aliyowatendea
  rationale: Hifili ya גדל ni nahau ya kufanya mambo makuu; tafsiri hii ni ya asili katika Kiswahili na inadumisha wazo hilo.
- source_word: עִמָּכֶם
  choice: aliyowatendea
  rationale: Kihalisia עִם ni 'pamoja na/nanyi,' lakini katika nahau hii kinaweza kueleza matendo makuu aliyowafanyia. Tafsiri kuu ya Kiswahili inatumia muundo wa kawaida, huku tanbihi ikihifadhi umbo la Kiebrania.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia Tetragramatoni moja kwa moja; 'Yahweh' linahifadhi jina la agano badala ya kulibadilisha na cheo.
- issue: Maana ya kumwogopa Mungu
  choice: mwogopeni
  alternative: mheshimuni
  rationale: Chaguo hili linadumisha mvutano wa kibiblia wa hofu yenye heshima, utiifu na kicho, bila kuupunguza kuwa heshima tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inalenga usomaji wa kawaida wa hadhara; 'kwa uaminifu' na 'tafakarini' zinafikisha maana ya kimuktadha bila kupoteza uzito wa himizo. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
