translation:
  language: sw
  text: Nao wakasema, “Hujatuonea wala hujatukandamiza, wala hujachukua chochote kutoka mkononi mwa mtu yeyote.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kutoka mkononi mwa mtu yeyote.” Huenda msemo huu unamaanisha kupokea malipo, zawadi, au rushwa kutoka kwa mtu yeyote.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Nao wakasema
  rationale: Inaendeleza mtiririko wa masimulizi unaoonyeshwa na wayyiqtol, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: עֲשַׁקְתָּנוּ
  choice: Hujatuonea
  rationale: Kitenzi hiki kinaweza kumaanisha kuonea, kunyanyasa, au kujipatia faida kwa kumdhulumu mwingine. ‘Hujatuonea’ ni kauli ya kawaida na pana inayofaa muktadha wa haki ya uongozi.
- source_word: רַצּוֹתָנוּ
  choice: wala kutukandamiza
  rationale: Mzizi רצץ kimsingi una wazo la kuponda au kuvunja, na hapa unatumiwa kwa maana ya kuwatesa au kuwakandamiza watu. ‘Kutukandamiza’ huhifadhi uzito wa neno bila kudokeza lazima kupondwa kimwili.
- source_word: לָקַחְתָּ מִיַּד אִישׁ מְאוּמָה
  choice: wala hujachukua chochote kutoka mkononi mwa mtu yeyote
  rationale: Tafsiri hii huhifadhi taswira halisi ya Kiebrania ‘kutoka mkononi mwa mtu’ na pia ni wazi kwa msomaji wa Kiswahili; katika muktadha inaweza kuhusisha malipo, zawadi, au rushwa.
- source_word: אִישׁ
  choice: mtu yeyote
  rationale: Ingawa nomino ya Kiebrania iko katika umoja wa kiume, hapa imetumiwa kwa maana ya jumla. ‘Mtu yeyote’ huwasilisha maana hiyo ya uwakilishi kwa Kiswahili cha kawaida bila kupotosha rejeleo.
- source_word: מְאוּמָה
  choice: chochote
  rationale: Katika kishazi hasi neno hili humaanisha kitu chochote kabisa; ‘chochote’ ndiyo tafsiri ya kawaida na ya moja kwa moja.
