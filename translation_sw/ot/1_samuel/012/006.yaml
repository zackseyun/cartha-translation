base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/006.yaml
  text: Then Samuel said to the people[b][a], “Yahweh is the one who appointed Moses and Aaron and who brought your fathers up from the land of Egypt.”
translation:
  language: sw
  text: Kisha Samweli akawaambia watu, “Yahwe ndiye aliyewateua Musa na Haruni[a], na aliyewapandisha baba zenu[b] kutoka nchi ya Misri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri halisi zaidi, “aliyewafanya Musa na Haruni.” Hapa kitenzi cha Kiebrania huenda kinamaanisha kuwaweka au kuwathibitisha katika wajibu wao.
    reason: lexical_alternative
  - marker: b
    text: “Baba zenu” hapa inaweza kueleweka kwa upana zaidi kuwa “mababu zenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל אֶל הָעָם
  choice: Kisha Samweli akawaambia watu
  rationale: Kiunganishi cha kisimulizi kinaendeleza mfuatano wa matukio; ‘Kisha’ ni cha asili katika Kiswahili. ‘Akawaambia watu’ huwasilisha kwa ufasaha maana ya ‘alisema kwa watu.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: אֲשֶׁר עָשָׂה אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: aliyewateua Musa na Haruni
  rationale: Kitenzi עשה kwa maana ya kawaida ni ‘fanya,’ lakini hapa kinaelekea kumaanisha kuwaweka au kuwathibitisha Musa na Haruni katika wajibu wao. ‘Aliyewateua’ huwasilisha maana hiyo bila kudokeza kwamba ndipo walipoumbwa.
- source_word: וַאֲשֶׁר הֶעֱלָה
  choice: na ndiye aliyewapandisha
  rationale: Hifili ya עלה humaanisha ‘kupandisha’ au ‘kuleta juu.’ ‘Aliyewapandisha’ huhifadhi tamathali ya kawaida ya simulizi la kutoka Misri.
- source_word: אֶת אֲבֹתֵיכֶם
  choice: baba zenu
  rationale: Hili ndilo tumizi la karibu la neno la Kiebrania; katika muktadha linaweza kuwahusu mababu kwa upana zaidi.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: kutoka nchi ya Misri
  rationale: Tafsiri hii inafuata kwa karibu muundo wa Kiebrania na kuhifadhi kauli ya kihistoria kuhusu kutoka Misri.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina binafsi la Mungu, kwa hiyo limetoholewa kama ‘Yahwe’ badala ya kubadilishwa kuwa cheo.
- issue: Maana ya עָשָׂה kuhusu Musa na Haruni
  choice: aliyewateua Musa na Haruni
  alternative: aliyewafanya Musa na Haruni
  rationale: Muktadha unaelekeza kwenye hatua ya Yahwe ya kuwaweka viongozi hao katika wajibu wao, lakini maana halisi zaidi ya kitenzi imehifadhiwa katika tanbihi ili kutoficha utata wa kiisimu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘Yahwe ndiye’ unaonyesha wazi kishazi cha Kiebrania kisicho na kitenzi, ambacho kinamtambulisha Yahwe kuwa mtendaji. ‘Aliyewapandisha’ limehifadhiwa ingawa ‘aliyewatoa’ lingekuwa la kawaida zaidi, kwa sababu tamathali ya Kiebrania ya kupandisha kutoka Misri ni muhimu.
