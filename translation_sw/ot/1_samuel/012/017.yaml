  text: הֲ/ל֤וֹא קְצִיר חִטִּים֙ הַ/יּ֔וֹם אֶקְרָא֙ אֶל יְהוָ֔ה וְ/יִתֵּ֥ן קֹל֖וֹת וּ/מָטָ֑ר וּ/דְע֣וּ וּ/רְא֗וּ כִּֽי רָעַתְ/כֶ֤ם רַבָּה֙ אֲשֶׁ֤ר עֲשִׂיתֶם֙ בְּ/עֵינֵ֣י יְהוָ֔ה לִ/שְׁא֥וֹל לָ/כֶ֖ם מֶֽלֶךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/017.yaml
  text: Is it not wheat harvest today? I will call to Yahweh[a], and he will send thunder and rain, so that you may know and see that your wickedness is great[b], which you have done in the sight of Yahweh by asking for yourselves a king.
translation:
  language: sw
  text: Je, leo si mavuno ya ngano? Nitamlilia Yahweh, naye ataleta[a] ngurumo[b] na mvua, ili mjue na muone kwamba uovu wenu ni mkubwa sana, ambao mmeufanya mbele za Yahweh kwa kuomba mfalme kwa ajili yenu wenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni ‘atatoa.’ Katika muktadha huu, ‘ataleta’ ni Kiswahili cha kawaida zaidi kwa hali ya hewa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni ‘sauti’; hapa neno hilo linamaanisha ngurumo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Je, ... si
  rationale: Muundo huu unahifadhi swali la balagha linalotarajia jibu la kukubali.
- source_word: קְצִיר חִטִּים הַיּוֹם
  choice: leo si wakati wa mavuno ya ngano
  rationale: Hii ni Kiswahili cha kawaida kinachohifadhi mazingira ya kilimo na msisitizo wa wakati uliopo.
- source_word: אֶקְרָא אֶל יְהוָה
  choice: Nitamwita Yahweh
  rationale: ‘Kumwita’ huwasilisha kwa kawaida tendo la kumwomba au kumlilia Mungu, huku jina la agano likihifadhiwa.
- source_word: וְיִתֵּן
  choice: ataleta
  rationale: Kitenzi cha Kiebrania ni ‘atatoa,’ lakini kuhusu hali ya hewa ‘ataleta’ ni cha kawaida na kinaeleza kwamba Mungu ndiye anayesababisha tukio.
- source_word: קֹלוֹת
  choice: ngurumo
  rationale: Ingawa maana ya msingi ni ‘sauti,’ katika muktadha wa mvua neno hili humaanisha ngurumo.
- source_word: וּמָטָר
  choice: mvua
  rationale: Hiki ni kisawe cha moja kwa moja na cha kawaida.
- source_word: וּדְעוּ וּרְאוּ
  choice: ili mjue na muone
  rationale: Muundo huu unaonyesha matokeo yaliyokusudiwa ya ishara hiyo na kuhifadhi vitenzi vyote viwili.
- source_word: רָעַתְכֶם רַבָּה
  choice: uovu ... ni mkubwa sana
  rationale: ‘Uovu’ unaonyesha tathmini ya kimaadili, na ‘mkubwa sana’ huwasilisha uzito wa רַבָּה kwa Kiswahili cha kawaida.
- source_word: בְּעֵינֵי יְהוָה
  choice: mbele za Yahweh
  rationale: Ni nahau ya kawaida ya Kiswahili inayohifadhi maana ya tendo kutathminiwa na Mungu.
- source_word: לִשְׁאֹל לָכֶם מֶלֶךְ
  choice: kwa kujiombea mfalme
  rationale: ‘Kujiombea’ huhifadhi wazo la kuwaomba mfalme kwa ajili yao wenyewe bila kulifanya kuwa ombi lisilo na kusudi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko la Kiebrania linatumia jina la agano lenyewe; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Tathmini ya ombi la Israeli la kutaka mfalme
  choice: uovu mliofanya ... kwa kujiombea mfalme
  alternative: uovu wenu ni mkubwa ... kwa sababu mlitaka mfalme
  rationale: Muundo uliochaguliwa unaunganisha moja kwa moja uovu na tendo lao la kuomba mfalme, kama ilivyo katika Kiebrania, bila kuongeza maelezo ya kimadhehebu kuhusu ufalme kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa swali la balagha, vitenzi viwili ‘mjue na muone,’ na ukali wa hukumu ya kimaadili vimehifadhiwa.
