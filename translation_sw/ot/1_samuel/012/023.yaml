id: 1SA.12.23
reference: 1 Samuel 12:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: גַּ֣ם אָנֹכִ֗י חָלִ֤ילָ/ה לִּ/י֙ מֵ/חֲטֹ֣א לַֽ/יהוָ֔ה מֵ/חֲדֹ֖ל לְ/הִתְפַּלֵּ֣ל בַּעַדְ/כֶ֑ם וְ/הוֹרֵיתִ֣י אֶתְ/כֶ֔ם בְּ/דֶ֥רֶךְ הַ/טּוֹבָ֖ה וְ/הַ/יְשָׁרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/023.yaml
  text: As for me[a], far be it from me that I should sin against Yahweh by ceasing to pray for you[c][b]; and I will instruct you in the good and upright way.
translation:
  language: sw
  text: Na mimi, hasha, nisije nikamkosea Yahwe kwa kuacha kuwaombea; nami nitawafundisha njia njema na iliyonyooka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: Lakini mimi
  rationale: Katika muktadha, maneno haya yanamtenga Samueli na watu na kukazia wajibu wake; ‘Lakini mimi’ ni Kiswahili cha kawaida kinachoonyesha utofauti huo.
- source_word: חָלִילָה לִּי
  choice: hasha!
  rationale: Nahau hii ni katazo kali lenye kuonyesha kuchukizwa kabisa na wazo hilo. ‘Hasha!’ huhifadhi nguvu yake kwa Kiswahili fasaha.
- source_word: מֵחֲטֹא לַיהוָה
  choice: Nisimtendee Yahwe dhambi
  rationale: Muundo huu unaonyesha kwamba kuacha kuwaombea watu kungekuwa dhambi dhidi ya Yahwe mwenyewe, si kupuuza wajibu wa uongozi tu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano YHWH limetoholewa kuwa ‘Yahwe’ badala ya kubadilishwa na cheo.
- source_word: מֵחֲדֹל לְהִתְפַּלֵּל בַּעַדְכֶם
  choice: kwa kuacha kuwaombea
  rationale: 'Hii inaeleza tendo ambalo lingekuwa dhambi: kukoma kufanya maombezi kwa ajili yao. ‘Kuwaombea’ ni usemi wa asili na wazi katika Kiswahili.'
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: nami nitawafundisha
  rationale: Hifili ya ירה inaweza kumaanisha kufundisha au kuelekeza; ‘nitawafundisha’ inafaa katika muktadha wa mwongozo wa kinabii na kimaadili.
- source_word: בְּדֶרֶךְ הַטּוֹבָה וְהַיְשָׁרָה
  choice: njia iliyo njema na nyoofu
  rationale: Taswira ya ‘njia’ kama mwenendo wa maisha imehifadhiwa. ‘Njema na nyoofu’ huwasilisha sifa za kimaadili za טוֹב na יָשָׁר.
theological_decisions:
- issue: Je, Samueli anaeleza kutowaombea watu kama kupuuza wajibu tu au kama dhambi dhidi ya Mungu?
  choice: Dhambi dhidi ya Yahwe
  alternative: Kupuuza wajibu wa uongozi bila kukazia kosa dhidi ya Mungu
  rationale: Kiebrania kinasema wazi ‘kumtendea Yahwe dhambi’; uzito huo wa kiteolojia umehifadhiwa bila kuongezewa fundisho jingine.
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko lina jina binafsi YHWH, hivyo limetoholewa kama ‘Yahwe’ badala ya kubadilishwa na cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Hasha!’ huhifadhi nguvu ya nahau ya Kiebrania, huku sentensi nyingine ikiwa rahisi kueleweka kwa msomaji wa kawaida.
