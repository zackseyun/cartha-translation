base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/014.yaml
  text: If you fear Yahweh and serve him and listen to his voice and do not rebel against the command of Yahweh[b][a], then both you and the king who reigns over you will follow Yahweh your God.
translation:
  language: sw
  text: Kama mkimcha Yahwe, mkimtumikia, mkiitii sauti yake,[a] wala msipoiasi amri ya Yahwe, ndipo ninyi pamoja na mfalme anayewatawala mtamfuata Yahwe Mungu wenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kuitii sauti yake” pia kunaweza kutafsiriwa “kuisikiliza sauti yake.” Usemi wa Kiebrania unahusisha kusikia kunakoambatana na utii.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kihalisi: “nanyi mtakuwa, ninyi pamoja na mfalme anayewatawala, baada ya Yahwe Mungu wenu.” Maana inaonekana kuwa kwamba watu na mfalme wao wataendelea kuwa waaminifu kwa Yahwe, au watamfuata.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Kama
  rationale: Hutanguliza sharti katika onyo na ahadi ya agano; “kama” ni ya kawaida na huhifadhi maana ya sharti.
- source_word: תִּירְאוּ
  choice: mtamcha
  rationale: Kitenzi ירא hapa kina maana ya hofu yenye heshima na unyenyekevu mbele za Mungu; “kumcha” ni usemi wa kawaida wa Kiswahili wenye uzito huo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA.”
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: mkamtumikia
  rationale: עבד kwa Mungu ni kumtumikia kwa uaminifu, kukihusisha pia kitendo cha ibada bila kukifupisha kuwa ibada pekee.
- source_word: וּשְׁמַעְתֶּם בְּקֹלוֹ
  choice: mkaitii sauti yake
  rationale: Usemi שׁמע בקול humaanisha kusikia kwa kuitikia kwa utii. “Kuitii sauti yake” ni Kiswahili cha asili na huhifadhi pia taswira ya sauti.
- source_word: וְלֹא תַמְרוּ אֶת־פִּי יְהוָה
  choice: na msiiasi amri ya Yahwe
  rationale: מרה inaonyesha uasi, si kutotii kwa kawaida tu; פי יהוה, kihalisi “kinywa cha Yahwe,” ni nahau inayomaanisha amri au tamko lake.
- source_word: גַּם אַתֶּם וְגַם הַמֶּלֶךְ
  choice: ninyi pamoja na mfalme
  rationale: Muundo wa גַּם ... וְגַם unawakusanya watu na mfalme chini ya sharti lilelile; “pamoja na” ni ya asili katika Kiswahili.
- source_word: אֲשֶׁר מָלַךְ עֲלֵיכֶם
  choice: anayewatawala
  rationale: Ingawa kitenzi cha Kiebrania kina umbo timilifu, kinamtambulisha mfalme aliyeko madarakani; wakati wa sasa unaendelea unafaa katika Kiswahili.
- source_word: אַחַר יְהוָה אֱלֹהֵיכֶם
  choice: mtamfuata Yahwe Mungu wenu
  rationale: אַחַר ikihusishwa na mtu inaweza kuonyesha kumfuata kwa uaminifu. Tafsiri hii huwasilisha maana inayowezekana kwa lugha ya kawaida huku tanbihi ikihifadhi ugumu wa muundo halisi.
theological_decisions:
- issue: Maana ya kifungu cha mwisho וִהְיִתֶם ... אַחַר יְהוָה אֱלֹהֵיכֶם
  choice: “ndipo ninyi pamoja na mfalme ... mtamfuata Yahwe Mungu wenu”
  alternative: 'Kihalisi zaidi: “nanyi mtakuwa, ninyi pamoja na mfalme ... baada ya Yahwe Mungu wenu,” muundo ambao uhusiano wake wa kisarufi na maana yake kamili hubaki tata.'
  rationale: Muktadha unaunga mkono wazo la kuendelea kuwa waaminifu kwa Yahwe na kumfuata, lakini maandishi ya Kiebrania ni mafupi na magumu. Matini kuu inatoa maana inayoeleweka, huku tanbihi ikihifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kumcha,” “kumtumikia,” “kuasi,” na “kumfuata” huhifadhi lugha ya agano bila kuwa ngumu isivyo lazima. Alama zote za tanbihi zimewekwa katika matini kuu.
