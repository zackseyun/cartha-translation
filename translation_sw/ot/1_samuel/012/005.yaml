base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/005.yaml
  text: And he said to them[a], “Yahweh is witness against you, and his anointed is witness this day, that you have found nothing in my hand.” And they said[c][b], “He is witness.”
translation:
  language: sw
  text: Naye akawaambia[a], “Yahwe ni shahidi dhidi yenu, na mtiwa mafuta wake[b] ni shahidi leo kwamba hamkupata kitu chochote mikononi mwangu.” Nao wakasema[c], “Yeye ni shahidi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “Yahwe ni shahidi miongoni mwenu/pamoja nanyi.” Katika muktadha huu maana ni ya kisheria: Yahwe anasimama kama shahidi katika shauri linalowahusu.'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “mtiwa mafuta wake.” Hapa neno hilo linamrejelea mfalme Sauli, wala si moja kwa moja cheo cha Masihi wa baadaye.'
    reason: cultural_note
  - marker: c
    text: Kitenzi cha mwisho katika Kiebrania kiko katika umoja (“akasema”), lakini katika muktadha kinawakilisha jibu la pamoja la watu; kwa hiyo limetafsiriwa “wakasema.”
    reason: textual_note
lexical_decisions:
- source_word: עֵד
  choice: shahidi
  rationale: Nomino hii ina maana ya shahidi katika mazingira ya kisheria au ya agano; “shahidi” ni neno la kawaida na linalofaa kwa Samueli kujitetea hadharani.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa unukuzi wa Kiswahili badala ya kubadilishwa kuwa cheo “BWANA”.
- source_word: בָּכֶם
  choice: dhidi yenu
  rationale: Pamoja na עֵד katika muktadha huu wa kisheria, kirai kinaeleweka kuwa shahidi katika shauri linalowahusu, yaani “dhidi yenu”; maana halisi zaidi “miongoni mwenu/pamoja nanyi” imehifadhiwa katika tanbihi.
- source_word: מְשִׁיחוֹ
  choice: mtiwa-mafuta wake
  rationale: Hapa neno linamrejelea mfalme aliyetiwa mafuta, yaani Sauli. Tafsiri hii huhifadhi maana ya Kiebrania bila kuingiza moja kwa moja cheo cha baadaye cha Masihi.
- source_word: הַיּוֹם הַזֶּה
  choice: leo
  rationale: “Leo” ni Kiswahili cha kawaida na cha hadhi kinachowasilisha wakati wa tamko hili la hadharani.
- source_word: מְצָאתֶם
  choice: hamkupata
  rationale: Kitenzi kamilifu katika kauli hasi kinaeleza matokeo ya uchunguzi wao uliokamilika kufikia wakati wa ushuhuda.
- source_word: בְּיָדִי
  choice: mkononi mwangu
  rationale: Nahau ya chanzo imehifadhiwa; katika muktadha ina maana ya kitu kilicho katika milki au chini ya udhibiti wa Samueli.
- source_word: מְאוּמָה
  choice: chochote
  rationale: Pamoja na ukanushi לֹא, “chochote” hutoa kwa kawaida maana ya “hakuna kitu hata kidogo.”
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: akawaambia ... wakasema
  rationale: Kitenzi cha kwanza cha umoja kinamrejelea Samueli. Ingawa kitenzi cha mwisho ni cha umoja katika Kiebrania, muktadha unaonyesha jibu la pamoja la watu, hivyo “wakasema” ni Kiswahili cha asili; tofauti hiyo imebainishwa katika tanbihi.
theological_decisions:
- issue: Kutafsiri מְשִׁיחוֹ katika muktadha wa kifalme usiolenga moja kwa moja Masihi wa baadaye
  choice: mtiwa-mafuta wake
  alternative: Masihi wake; mfalme wake
  rationale: Katika muktadha wa karibu, neno linamrejelea Sauli kama mfalme aliyetiwa mafuta na Yahwe. “Mtiwa-mafuta wake” huhifadhi uhusiano wa kileksia na kuepuka kuamua kimyakimya kwamba hapa ni cheo cha moja kwa moja cha Masihi wa baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ushahidi wa hadharani umehifadhiwa, pamoja na nahau “mkononi mwangu.” “Mtiwa-mafuta” limeandikwa kwa kistari ili dhana ya mtu aliyetiwa mafuta isomeke wazi.
