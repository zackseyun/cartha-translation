language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: הִנְ/נִ֣י עֲנ֣וּ בִ/י֩ נֶ֨גֶד יְהוָ֜ה וְ/נֶ֣גֶד מְשִׁיח֗/וֹ אֶת שׁוֹר֩ מִ֨י לָקַ֜חְתִּי וַ/חֲמ֧וֹר מִ֣י לָקַ֗חְתִּי וְ/אֶת מִ֤י עָשַׁ֨קְתִּי֙ אֶת מִ֣י רַצּ֔וֹתִי וּ/מִ/יַּד מִי֙ לָקַ֣חְתִּי כֹ֔פֶר וְ/אַעְלִ֥ים עֵינַ֖/י בּ֑/וֹ וְ/אָשִׁ֖יב לָ/כֶֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/003.yaml
  text: 'Here I am[a]; testify against me before Yahweh and before his anointed: whose ox have I taken, or whose donkey have I taken? Whom have I oppressed? Whom have I mistreated? From whose hand have I taken a bribe[b], that I should hide my eyes with it? I will restore it to you.'
translation:
  language: sw
  text: '“Mimi hapa. Toeni ushahidi dhidi yangu mbele ya Yahweh na mbele ya mtiwa mafuta wake: Nimechukua ng’ombe wa nani? Nimechukua punda wa nani? Nimemwonea nani? Nimemkandamiza nani?[a] Nimepokea hongo[b] kutoka kwa nani ili nifumbie macho kwa sababu yake? Nami nitawarejeshea.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nimemtendea vibaya nani?” Kitenzi cha Kiebrania ni kigumu; huenda kinamaanisha kumponda, kumkandamiza, au kumtendea mtu kwa ukali.
    reason: lexical_alternative
  - marker: b
    text: Neno “hongo” linaweza pia kutafsiriwa “fidia” au “malipo”; lakini katika muktadha huu, kufumbia macho kunaashiria malipo yanayopotosha haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Mimi hapa
  rationale: Ni usemi wa kawaida wa Kiswahili wa kujitokeza wazi na kuonyesha utayari wa kujibu mashtaka.
- source_word: עֲנוּ בִי
  choice: Toeni ushahidi dhidi yangu
  rationale: Katika mazingira haya ya hadhara na ya kisheria, kitenzi kina maana ya kujibu kwa kutoa ushahidi dhidi ya Samweli.
- source_word: נֶגֶד
  choice: mbele za
  rationale: Inaonyesha uwajibikaji wa hadhara katika uwepo wa Yahweh na mfalme aliyetiwa mafuta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu katika Kiebrania limetolewa kama jina maalumu badala ya kubadilishwa kuwa cheo.
- source_word: מְשִׁיחוֹ
  choice: mtiwa-mafuta wake
  rationale: Katika muktadha huu anamrejelea mfalme aliyetiwa mafuta, bila kuingiza moja kwa moja maana ya baadaye ya cheo ‘Masihi.’
- source_word: שׁוֹר
  choice: ng’ombe
  rationale: Neno hili ni la kawaida na linaloeleweka kwa mnyama wa kufugwa anayetajwa kama mali.
- source_word: חֲמוֹר
  choice: punda
  rationale: Ni kisawe cha kawaida na sahihi katika Kiswahili cha sasa.
- source_word: לָקַחְתִּי
  choice: Nimechukua
  rationale: Wakati timilifu unafaa kwa Samweli anapochunguza mwenendo wake wa zamani, na urudiaji wake umehifadhiwa.
- source_word: עָשַׁקְתִּי
  choice: Nimemwonea
  rationale: ‘Kumwonea’ huonyesha kumdhulumu au kumtendea mtu isivyo haki, ikifaa maana pana ya ukandamizaji wa kijamii au kiuchumi.
- source_word: רַצּוֹתִי
  choice: Nimemkandamiza
  rationale: Kitenzi cha Kiebrania ni kigumu, lakini huenda kinaonyesha kumponda au kumtendea mtu kwa ukali. ‘Kumkandamiza’ huhifadhi nguvu ya picha hiyo huku kikibaki cha kawaida katika Kiswahili.
- source_word: כֹפֶר
  choice: hongo
  rationale: Ingawa neno linaweza kumaanisha fidia au malipo, kutajwa kwa kufumbia macho kunaelekeza kwenye malipo ya rushwa yanayopotosha haki.
- source_word: אַעְלִים עֵינַי בּוֹ
  choice: ili nifumbie macho kwa sababu yake
  rationale: Huhifadhi lugha ya macho na uhusiano wa malipo hayo na kupuuza kosa, bila kulazimisha kwa kupita kiasi rejeo la kiwakilishi cha Kiebrania.
- source_word: וְאָשִׁיב לָכֶם
  choice: Nami nitawarudishia
  rationale: Huhifadhi ahadi ya kurejesha kwao kile kilichochukuliwa bila kuongeza nomino ambayo haipo wazi katika maandishi ya Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja; ‘Yahweh’ hulihifadhi kama jina maalumu.
- issue: Maana ya מְשִׁיחוֹ katika muktadha wa kifalme
  choice: mtiwa-mafuta wake
  alternative: Masihi wake
  rationale: Mrejelewa wa karibu ni mfalme aliyetiwa mafuta na Yahweh. Tafsiri hii huhifadhi maana ya neno bila kulifanya moja kwa moja kuwa cheo cha kimasihi cha baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya hotuba ya hadhara lakini kinachoeleweka kwa wasomaji wa kawaida. Maswali ya balagha na urudiaji wa Kiebrania vimehifadhiwa. Alama [a] imewekwa kwenye kitenzi kigumu רַצּוֹתִי, si baada ya ‘Mimi hapa,’ ili ilingane na maelezo yake.
