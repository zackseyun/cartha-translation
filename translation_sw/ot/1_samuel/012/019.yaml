    issue: The additive phrase 'juu ya dhambi zetu zote' is somewhat unnatural in this context.
    rationale: Hebrew עַל with יסף means adding this evil to their prior sins. In contemporary standard Swahili, 'kwa dhambi zetu zote' expresses that relationship more idiomatically without changing the meaning.
  - severity: low
    issue: The footnote anchor follows 'watumishi wako,' although the alternative principally concerns the rendering of the imperative and intercessory construction.
    rationale: Placing the anchor after 'Mwombe' makes the lexical alternative's scope immediately intelligible.
