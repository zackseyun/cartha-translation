base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/019.yaml
  text: 'Then all the people said to Samuel[a], “Pray to Yahweh your God for your servants, and do not let us die, for we have added to all our sins this evil: to ask for a king for ourselves.”'
translation:
  language: sw
  text: 'Ndipo watu wote wakamwambia Samweli, “Mwombe[a] Yahwe Mungu wako kwa ajili yetu, sisi watumishi wako, ili tusife, kwa maana tumeongeza uovu huu kwa dhambi zetu zote: kuomba tupewe mfalme.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Utuombee kwa Yahwe Mungu wako, sisi watumishi wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְפַּלֵּל בְּעַד עֲבָדֶיךָ
  choice: Mwombe ... kwa ajili yetu sisi watumishi wako
  rationale: Kitenzi kinaagiza kusali, na בְּעַד inaonyesha kusali kwa niaba ya wengine. Muundo huu ni wa kawaida katika Kiswahili na unadumisha namna ya watu kujishusha mbele ya Samweli.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa kulitamka kama jina binafsi badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Kiambishi cha nafsi ya pili umoja kimehifadhiwa; watu wanamwomba Samweli awaombee bila kubadili mvutano wa usemi kuwa ‘Mungu wetu.’
- source_word: וְאַל נָמוּת
  choice: ili tusife
  rationale: Hueleza matokeo hasi wanayotaka yaepukwe kutokana na sala ya Samweli; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: יָסַפְנוּ עַל כָּל חַטֹּאתֵינוּ רָעָה
  choice: tumeongeza uovu huu juu ya dhambi zetu zote
  rationale: Inahifadhi wazo la kuongeza kosa jingine juu ya dhambi zilizokuwapo tayari na uzito wa kimaadili wa רָעָה.
- source_word: לִשְׁאֹל לָנוּ מֶלֶךְ
  choice: kuomba tupewe mfalme
  rationale: Hueleza kwa Kiswahili cha kawaida kwamba walijiombea wapate mfalme, huku ikihifadhi maana ya לָנוּ bila muundo mgumu usio wa kawaida.
- source_word: כָל הָעָם
  choice: watu wote
  rationale: Ni tafsiri ya kawaida ya kundi lote linalozungumziwa.
- source_word: וַיֹּאמְרוּ
  choice: Ndipo ... wakamwambia
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha asili.
theological_decisions:
- issue: Nguvu ya kimahusiano ya אֱלֹהֶיךָ katika ombi kwa Samweli
  choice: Mungu wako
  alternative: Mungu wetu
  rationale: Nafsi ya pili imehifadhiwa kama ilivyo katika Kiebrania. Hii inadumisha mvutano wa usemi wa watu wanaomgeukia Samweli kama mwombezi bila kudokeza kwamba Yahwe si Mungu wa Israeli.
- issue: Tathmini ya kuomba mfalme
  choice: uovu huu
  alternative: kosa hili
  rationale: רָעָה lina uzito wa uovu wa kimaadili katika ungamo hili; ‘uovu’ haupunguzi tathmini hiyo wala kuingiza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi ‘sisi watumishi wako’ unadumisha unyenyekevu wa watu, na ‘ili tusife’ unasikika kwa kawaida huku ukihifadhi kusudi la ombi lao.
