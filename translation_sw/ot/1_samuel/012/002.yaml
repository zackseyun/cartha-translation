base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/002.yaml
  text: And now[a], look, the king is walking before you, and I have grown old and gray, and here are my sons with you[c][b]. And I have walked before you from my youth until this day.
translation:
  language: sw
  text: 'Na sasa, tazameni: mfalme anatembea mbele yenu[a]. Nami nimezeeka na kuwa na mvi[b], na hawa hapa wanangu wako pamoja nanyi. Nami nimetembea mbele yenu[c] tangu ujana wangu mpaka leo hii.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mfalme anakwenda mbele yenu” au “mfalme anawaongoza.” Nahau ya Kiebrania ya “kutembea mbele” inaweza kumaanisha kuwaongoza watu hadharani.
    reason: lexical_alternative
  - marker: b
    text: Au “nimezeeka na mvi zimenijaa.”
    reason: lexical_alternative
  - marker: c
    text: Au “nimekwenda mbele yenu” au “nimewaongoza.” Samweli analinganisha kwa makusudi jukumu lake la hadharani na lile la mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inahifadhi kiunganishi וְ pamoja na alama ya mazungumzo עַתָּה, ambayo inaanzisha wito wa Samweli kuhusu hali ya sasa.
- source_word: הִנֵּה
  choice: tazameni
  rationale: Neno hili huvuta usikivu wa wasikilizaji. Wingi unafaa kwa kuwa Samweli anahutubia watu, na ni wa kawaida kuliko usemi wa kizamani.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Nomino yenye uainisho inamtaja mfalme ambaye amewekwa karibuni; Kiswahili hakihitaji neno tofauti la kuonyesha uainisho huo.
- source_word: מִתְהַלֵּךְ לִפְנֵיכֶם
  choice: anatembea mbele yenu
  rationale: Muundo wa wakati unaoendelea unaakisi participio ya Kiebrania na kuhifadhi nahau ya kwenda au kuongoza mbele ya watu bila kuifasiri kupita kiasi.
- source_word: זָקַנְתִּי וָשַׂבְתִּי
  choice: nimezeeka na kuwa na mvi
  rationale: Vitenzi timilifu vinaonyesha hali iliyofikiwa; tafsiri hii pia huhifadhi picha mahsusi ya mvi badala ya kurudia tu wazo la uzee.
- source_word: וּבָנַי הִנָּם אִתְּכֶם
  choice: na hawa hapa wanangu wako pamoja nanyi
  rationale: “Hawa hapa” inahifadhi mkazo wa kuwatambulisha unaotolewa na הִנָּם, huku “pamoja nanyi” ikitoa maana ya אִתְּכֶם kwa kawaida.
- source_word: הִתְהַלַּכְתִּי לִפְנֵיכֶם
  choice: nimetembea mbele yenu
  rationale: Kurudia maneno yale yale ya msingi kunahifadhi ulinganifu wa kimakusudi kati ya jukumu la sasa la mfalme na huduma ya zamani ya Samweli.
- source_word: מִנְּעֻרַי עַד הַיּוֹם הַזֶּה
  choice: tangu ujana wangu mpaka leo hii
  rationale: Huu ni usemi wa muda unaoonyesha kipindi kinachoanzia ujana wa Samweli na kuendelea hadi wakati wa hotuba yake.
theological_decisions:
- issue: Nahau ya kutembea mbele ya watu
  choice: Kutumia “anatembea/nimetembea mbele yenu” katika sehemu zote mbili
  alternative: Kutumia “anawaongoza/nimewaongoza”
  rationale: Nahau inaweza kumaanisha uongozi wa hadharani, lakini tafsiri ya moja kwa moja zaidi huhifadhi uwezekano huo pamoja na ulinganifu wa kimakusudi bila kuufanya “uongozi” kuwa maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tazameni” ni wito wa kawaida wa kuvuta usikivu; “hawa hapa wanangu” huhifadhi mkazo wa kuwatambulisha. Kurudiwa kwa “mbele yenu” kumedumishwa ili kuhifadhi muundo na mvutano wa maana wa Kiebrania.
