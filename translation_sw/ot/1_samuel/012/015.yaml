  yaml_path: translation/ot/1_samuel/012/015.yaml
  text: But if you do not listen to the voice of Yahweh and rebel against the command of Yahweh[a], then the hand of Yahweh will be against you and against your fathers.
translation:
  language: sw
  text: Lakini msipoisikiliza sauti ya Yahwe na mkiasi agizo la Yahwe, basi mkono wa Yahwe utakuwa dhidi yenu na dhidi ya baba zenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “baba zenu.” Baadhi ya tafsiri za kale na wafafanuzi wengi husoma “mfalme wenu,” jambo linaloafikiana na muktadha wa karibu wa onyo la Samweli kuhusu watu na mfalme wao.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Lakini msipo-
  rationale: Huanzisha sharti linalotofautiana na ahadi ya mstari uliotangulia; “lakini” linaonyesha utofauti huo kwa kawaida katika Kiswahili.
- source_word: לֹא תִשְׁמְעוּ בְּקוֹל יְהוָה
  choice: msipoisikiliza sauti ya Yahwe
  rationale: Linahifadhi tamathali ya Kiebrania ya kuisikiliza sauti, ambayo katika muktadha huu inahusisha kutii, bila kuifupisha kuwa “kutii” pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uwasilishaji wa kawaida wa Kiswahili wa jina la Mungu YHWH na hulitofautisha na cheo “Bwana.”
- source_word: וּמְרִיתֶם
  choice: mkaliasi
  rationale: Kitenzi מרה huonyesha uasi au ukaidi wa makusudi, si kutotii kwa kawaida tu.
- source_word: אֶת פִּי יְהוָה
  choice: agizo la Yahwe
  rationale: Kihalisi ni “kinywa cha Yahwe,” lakini ni nahau inayomaanisha jambo alilosema au kuamuru; “agizo” ni wazi na linafaa kwa muktadha.
- source_word: וְהָיְתָה יַד יְהוָה
  choice: basi mkono wa Yahwe utakuwa
  rationale: “Basi” huonyesha matokeo ya sharti, huku “mkono wa Yahwe” ukihifadhi tamathali ya nguvu yake inayotenda katika hukumu.
- source_word: בָּכֶם
  choice: dhidi yenu
  rationale: Katika muktadha wa hukumu, kihusishi kinaonyesha upinzani, hivyo “dhidi yenu” ni cha asili na sahihi.
- source_word: וּבַאֲבֹתֵיכֶם
  choice: na dhidi ya baba zenu
  rationale: Hufuata maandishi ya Kimasora, ambayo yanasema “baba zenu,” huku uwezekano wa usomaji “mfalme wenu” ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: “Yahwe” hulihifadhi jina binafsi la Mungu katika matini badala ya kulibadili kuwa cheo, bila kuingiza msimamo wa kimadhehebu.
- issue: Kirai cha mwisho וּבַאֲבֹתֵיכֶם
  choice: na dhidi ya baba zenu
  alternative: na dhidi ya mfalme wenu
  rationale: Matini ya WLC/Kimasora iliyotolewa inasema “baba zenu.” Baadhi ya matoleo ya kale na wasomaji wengi hupendelea “mfalme wenu” kwa sababu ya muktadha wa karibu; tofauti hiyo inawekwa wazi katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “kuisikiliza sauti” na tamathali “mkono wa Yahwe” zimehifadhiwa kwa kuwa zinaeleweka na zina uzito wa kibiblia; “agizo” limetumiwa badala ya “kinywa” ili nahau iwe wazi.
