base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/010.yaml
  text: Then they cried out to the LORD and said, “We have sinned, because we have forsaken the LORD and have served the Baals and the Ashtaroths. But now, deliver us from the hand of our enemies, and we will serve you.”
translation:
  language: sw
  text: Ndipo wakamlilia BWANA wakisema, “Tumetenda dhambi, kwa sababu tumemwacha BWANA na tumetumikia miungu ya Baali na Maashtorethi. Lakini sasa, tuokoe kutoka mikononi mwa adui zetu, nasi tutakutumikia.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: wakamlilia
  rationale: Kitenzi hiki humaanisha kupaza sauti kwa kuomba msaada; ‘wakamlilia’ ni Kiswahili cha kawaida kinachohifadhi uzito wa ombi lao.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea katika Biblia za Kiswahili ya kuwakilisha jina la agano YHWH kwa ‘BWANA’ kwa herufi kubwa.
- source_word: הַבְּעָלִים
  choice: miungu ya Baali
  rationale: Umbo la Kiebrania ni la wingi na linaweza kumaanisha miungu mbalimbali iliyoitwa Baali; tafsiri hii huonyesha uwingi kwa uwazi katika Kiswahili.
- source_word: הָעַשְׁתָּרוֹת
  choice: Maashtorethi
  rationale: Huhifadhi jina la ibada katika umbo la wingi badala ya kulifanya jina moja la kike.
- source_word: מִיַּד אֹיְבֵינוּ
  choice: kutoka mikononi mwa adui zetu
  rationale: Nahau ya ‘mkono’ inaashiria mamlaka au nguvu; uwingi wa ‘mikononi’ ni wa asili katika Kiswahili na huhifadhi taswira hiyo.
theological_decisions:
- issue: Uhusiano wa sababu katika ungamo
  choice: kwa sababu tumemwacha BWANA
  alternative: kwa kuwa tumemwacha BWANA
  rationale: ‘Kwa sababu’ huakisi כִּי kama maelezo ya dhambi bila kuongeza tafsiri ya kimadhehebu.
- issue: Ahadi ya kuitumikia BWANA baada ya kuokolewa
  choice: nasi tutakutumikia
  alternative: ili tukutumikie
  rationale: Kiebrania lina kiunganishi pamoja na kitenzi cha wakati/namna isiyokamilika, kinachofaa kusomwa kama ahadi; tafsiri haibadili ahadi hiyo kuwa kusudi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya usomaji wa Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Majina ya ibada yamewasilishwa kwa uwazi bila maelezo ya ziada ndani ya mstari.
