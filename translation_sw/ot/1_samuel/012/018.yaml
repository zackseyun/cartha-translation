base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/018.yaml
  text: Then Samuel called to Yahweh[a], and Yahweh sent thunder and rain that day; and all the people greatly feared Yahweh and Samuel.
translation:
  language: sw
  text: Ndipo Samweli akamlilia Yahwe, naye Yahwe akaleta ngurumo[a] na mvua siku hiyo; watu wote wakawaogopa sana Yahwe na Samweli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “sauti”; katika muktadha huu wa dhoruba neno hilo linamaanisha ngurumo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל יְהוָה
  choice: akamlilia Yahwe
  rationale: Muundo קרא אל יהוה humaanisha kumwita au kumlilia Yahwe katika sala. “Akamlilia” ni Kiswahili cha kawaida kinachoonyesha ombi la moja kwa moja bila kuongeza maelezo kuhusu yaliyosemwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetoholewa kama “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: וַיִּתֵּן
  choice: akaleta
  rationale: Kitenzi hiki kwa msingi ni “akatoa,” lakini katika muktadha wa hali ya hewa “akaleta” huwasilisha kwa Kiswahili cha asili kwamba Yahwe alisababisha ngurumo na mvua.
- source_word: קֹלֹת
  choice: ngurumo
  rationale: Neno hili kwa msingi linaweza kumaanisha “sauti,” lakini linapotumiwa kuhusu dhoruba, hasa pamoja na mvua, humaanisha ngurumo.
- source_word: וּמָטָר
  choice: na mvua
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya מָטָר, bila kuongeza kiwango cha mvua kisichotajwa.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Huhifadhi rejeo mahsusi la wakati kwa Kiswahili cha kawaida.
- source_word: וַיִּירָא ... מְאֹד
  choice: wakamwogopa sana
  rationale: Huhifadhi maana ya hofu na nguvu ya kielezi מְאֹד bila kuipunguza iwe mshangao au heshima tu.
- source_word: כָל הָעָם
  choice: watu wote
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi upeo wa kundi zima.
- source_word: אֶת יְהוָה וְאֶת שְׁמוּאֵל
  choice: Yahwe na Samweli
  rationale: Kitenzi kilekile cha kuogopa kinaelekezwa kwa wote wawili, kama ilivyo katika Kiebrania, bila kudai kwamba hadhi yao ni sawa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini inatumia jina binafsi la agano, kwa hiyo limetoholewa badala ya kubadilishwa na cheo.
- issue: Watu kumwogopa Yahwe na Samweli
  choice: wakamwogopa sana Yahwe na Samweli
  alternative: wakamwogopa Yahwe na kumheshimu Samweli
  rationale: Kiebrania kinatumia kitenzi kilekile kwa Yahwe na Samweli. Tafsiri inahifadhi mvutano huo badala ya kuugawa kimafundisho kuwa hofu kwa mmoja na heshima kwa mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa simulizi wenye “ndipo” na viambishi vya mfululizo unaendeleza mtiririko wa tukio. Alama ya tanbihi imewekwa baada ya “ngurumo,” neno linalofafanuliwa na tanbihi.
