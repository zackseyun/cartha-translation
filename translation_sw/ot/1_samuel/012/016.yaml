- from: Basi sasa, simameni mahali penu, muone jambo hili kuu ambalo Yahwe[a] anafanya mbele ya macho yenu.
  to: Sasa basi, simameni mahali penu, tazameni jambo hili kuu ambalo Yahweh[a] anafanya mbele ya macho yenu.
  rationale: The revision corrects the plural command to a natural imperative, improves the transitional phrasing, and standardizes the transliteration of the Tetragrammaton, while retaining the source’s broad “great thing/matter,” present participial force (“anafanya”), and visible-public emphasis.
