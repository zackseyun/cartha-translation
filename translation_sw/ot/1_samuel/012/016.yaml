  text: גַּם עַתָּה֙ הִתְיַצְּב֣וּ וּ/רְא֔וּ אֶת הַ/דָּבָ֥ר הַ/גָּד֖וֹל הַ/זֶּ֑ה אֲשֶׁ֣ר יְהוָ֔ה עֹשֶׂ֖ה לְ/עֵינֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/016.yaml
  text: Now then[a], stand still and see this great thing that Yahweh is doing before your eyes.
translation:
  language: sw
  text: Sasa basi, simameni mahali penu, tazameni jambo hili kuu ambalo Yahweh[a] anafanya mbele ya macho yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “YHWH”; kwa desturi hutafsiriwa “BWANA.”'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Basi sasa
  rationale: Kirai hiki ni kiashiria cha mpito kinachoanzisha wito wenye uzito; “Basi sasa” ni Kiswahili cha kawaida na huhifadhi nguvu hiyo bila kulazimisha maana ya “hata sasa.”
- source_word: הִתְיַצְּבוּ
  choice: simameni mahali penu
  rationale: Amri ya Hitpael ya יצב inawataka wasikilizaji wajipange au wabaki wamesimama kwa makini ili kushuhudia kitakachotokea. “Simameni mahali penu” huonyesha mkao na utayari bila kudokeza ukimya ambao haujatajwa wazi.
- source_word: וּרְאוּ
  choice: muone
  rationale: Amri hii inawaita watu washuhudie moja kwa moja tendo litakalofanyika; “muone” ni ya asili katika Kiswahili na huhifadhi wazo la kuona kwa macho.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: jambo hili kuu
  rationale: דבר inaweza kumaanisha jambo, neno, au tukio. Hapa inarejelea tendo la ajabu linalokaribia kutokea; “jambo hili kuu” huhifadhi upana wa neno la Kiebrania bila kulifafanua kupita kiasi kuwa ishara au muujiza.
- source_word: אֲשֶׁר יְהוָה עֹשֶׂה
  choice: ambalo Yahwe anafanya
  rationale: Kitenzi-shirikishi עֹשֶׂה huonyesha tendo kama linaloendelea au lililo karibu sana kutokea kwa mtazamo wa msemaji. Wakati wa sasa “anafanya” huhifadhi uhai huo kuliko “atakavyofanya.”
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo “BWANA,” ili kuhifadhi matumizi ya jina binafsi katika matini ya Kiebrania.
- source_word: לְעֵינֵיכֶם
  choice: mbele ya macho yenu
  rationale: Nahau hii inasisitiza jambo linaloonekana wazi na kushuhudiwa moja kwa moja. “Mbele ya macho yenu” ni ya picha, inafahamika, na iko karibu na umbo la Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ina Tetragramatoni יהוה moja kwa moja. “Yahwe” huhifadhi jina binafsi badala ya kulibadilisha kuwa cheo, huku tanbihi ikitaja desturi nyingine ya tafsiri bila kulazimisha msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri ni wazi na wa kawaida; “jambo hili kuu” huhifadhi upana wa דבר, na “mbele ya macho yenu” huhifadhi msisitizo wa ushuhuda wa moja kwa moja.
