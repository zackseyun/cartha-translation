  variant: Standard East African Swahili
source:
  edition: WLC
  text: כַּֽ/אֲשֶׁר בָּ֥א יַעֲקֹ֖ב מִצְרָ֑יִם וַ/יִּזְעֲק֤וּ אֲבֽוֹתֵי/כֶם֙ אֶל יְהוָ֔ה וַ/יִּשְׁלַ֨ח יְהוָ֜ה אֶת מֹשֶׁ֣ה וְ/אֶֽת אַהֲרֹ֗ן וַ/יּוֹצִ֤יאוּ אֶת אֲבֹֽתֵי/כֶם֙ מִ/מִּצְרַ֔יִם וַ/יֹּשִׁב֖וּ/ם בַּ/מָּק֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/008.yaml
  text: When Jacob came into Egypt[a], your fathers cried out to Yahweh, and Yahweh sent Moses and Aaron[b], and they brought your fathers out of Egypt and settled them in this place.
translation:
  language: sw
  text: Yakobo alipokuja Misri, mababu zenu[a] walimlilia Yahwe, naye Yahwe akamtuma Musa na Haruni. Wao wakawatoa mababu zenu Misri na kuwafanya wakae mahali hapa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “baba zenu”; pia, “mababu” au “wahenga wenu.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “na kuwakalisha mahali hapa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר בָּא
  choice: alipokuja
  rationale: Muundo huu unaonyesha wakati wa tukio na kwa Kiswahili unasomeka kwa kawaida kuliko tafsiri ya neno kwa neno.
- source_word: אֲבוֹתֵיכֶם
  choice: mababu zenu
  rationale: Katika simulizi hili neno hilo linamaanisha vizazi vya awali vya Israeli. ‘Mababu zenu’ ni la kawaida na lenye heshima, huku tanbihi ikihifadhi maana halisi ya ‘baba zenu.’
- source_word: וַיִּזְעֲקוּ
  choice: walimlilia
  rationale: Kitenzi kinaonyesha kilio cha dharura cha kuomba msaada; ‘walimlilia’ huhifadhi nguvu hiyo na pia mwelekeo wa kilio kwa Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huhifadhi jina la agano lililoandikwa moja kwa moja katika maandishi ya Kiebrania.
- source_word: וַיּוֹצִיאוּ
  choice: wakawatoa
  rationale: Hii ni kausativi yenye wahusika wengi; muktadha unaelekeza kwa Musa na Haruni kuwa mawakala wa kuwatoa watu Misri.
- source_word: וַיֹּשִׁבוּם
  choice: kuwakalisha
  rationale: Kausativi ya ישׁב ina maana ya kuwafanya wakae au kuwatuliza mahali; ‘kuwakalisha’ huhifadhi muundo huo bila kuifanya maana iwe maalumu kupita kiasi.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: mahali hapa
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kishazi kinachoonyesha mahali walipo sasa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina binafsi la Mungu; ‘Yahwe’ hulihifadhi wazi badala ya kulibadili kuwa cheo.
- issue: Wahusika wa vitenzi vya kuwatoa na kuwakalisha
  choice: Musa na Haruni ndio wahusika wa kisarufi
  alternative: Yahwe ndiye mtendaji wa mwisho kupitia Musa na Haruni
  rationale: Vitenzi vya Kiebrania viko katika wingi na kwa kawaida vinarejelea Musa na Haruni waliotajwa mara moja kabla. Tafsiri haiwezi kufuta ukweli wa kitheolojia kwamba Yahwe ndiye aliyewatuma na kuwaokoa kupitia wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili simulizi lisomeke kwa urahisi bila kupoteza mfuatano wa matendo katika Kiebrania.
