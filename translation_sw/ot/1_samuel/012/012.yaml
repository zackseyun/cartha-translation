base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/012.yaml
  text: When you saw that Nahash king of the Ammonites was coming against you[a], you said to me, ‘No, but a king shall reign over us’—though Yahweh your God was your king.
translation:
  language: sw
  text: Mlipoona kwamba Nahashi, mfalme wa Waamoni, alikuwa akija kuwashambulia, mkaniambia, “La, bali mfalme atutawale,” ingawa Yahwe, Mungu wenu, alikuwa mfalme wenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yahwe, Mungu wenu, ndiye mfalme wenu.” Kishazi cha Kiebrania hakina kitenzi kilichoandikwa wazi, kwa hiyo muktadha unaweza kuruhusu wakati uliopita au wakati wa sasa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּרְאוּ
  choice: Mlipoona
  rationale: Muundo wa wakati unaonyesha tukio lililowasukuma Waisraeli kujibu; “mlipoona” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: כִּי
  choice: kwamba
  rationale: Hapa neno hili linatanguliza maudhui ya kile walichoona.
- source_word: נָחָשׁ
  choice: Nahashi
  rationale: Jina la mtu limetoholewa kwa muundo unaosomeka kwa urahisi katika Kiswahili.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: mfalme wa Waamoni
  rationale: Hii ni tafsiri ya kawaida ya jina la taifa linalomaanisha watu wa Amoni.
- source_word: בָּא עֲלֵיכֶם
  choice: alikuwa akija kuwashambulia
  rationale: Katika muktadha wa kijeshi, בוא pamoja na עַל huonyesha kuja dhidi ya watu kwa uhasama; “kuwashambulia” huifanya maana hiyo iwe wazi bila kupanua wazo.
- source_word: וַתֹּאמְרוּ לִי
  choice: mkaniambia
  rationale: Inawasilisha kwa ufupi na kwa kawaida maneno yaliyoelekezwa moja kwa moja kwa Samueli.
- source_word: לֹא כִּי
  choice: Hapana!
  rationale: “Hapana” linaonyesha kukataa kwa msisitizo kabla ya dai linalofuata; alama ya mshangao huhifadhi nguvu ya usemi.
- source_word: מֶלֶךְ יִמְלֹךְ עָלֵינוּ
  choice: Ni lazima mfalme atutawale
  rationale: Muundo huu unaonyesha msisitizo wa watu kwamba wanataka utawala wa mfalme; “ni lazima” huwasilisha nguvu ya dai hilo kwa Kiswahili cha sasa.
- source_word: וַיהוָה
  choice: Yahwe
  rationale: Jina la agano limetoholewa moja kwa moja kutoka יהוה badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Ni tafsiri ya moja kwa moja ya kiwakilishi na jina la Mungu.
- source_word: מַלְכְּכֶם
  choice: alikuwa mfalme wenu
  rationale: Kishazi cha Kiebrania hakina kitenzi wazi. Wakati uliopita unalingana na simulizi la Samueli kuhusu hali yao walipodai mfalme wa kibinadamu, huku uwezekano wa wakati wa sasa ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Kitenzi kilichodokezwa katika וַיהוָה אֱלֹהֵיכֶם מַלְכְּכֶם
  choice: Yahwe Mungu wenu alikuwa mfalme wenu
  alternative: Yahwe Mungu wenu ndiye mfalme wenu
  rationale: Kishazi nomino cha Kiebrania hakibainishi wakati. Wakati uliopita unafaa katika masimulizi ya Samueli kuhusu dai lao la awali, lakini wakati wa sasa unaweza kuonyesha ukweli unaoendelea; tanbihi huhifadhi uwezekano huo bila kuamua mvutano wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Usemi wa watu umepewa msisitizo wa kawaida bila kutumia lugha ya kizamani. Tanbihi imewekwa baada ya kishazi kinachohusika.
