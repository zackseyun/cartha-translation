base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/020.yaml
  text: And Samuel said to the people[a], “Do not be afraid. You have done all this evil. Yet do not turn aside from following Yahweh[b], but serve Yahweh with all your heart.”
translation:
  language: sw
  text: Samweli akawaambia watu, “Msiogope. Ninyi mmefanya uovu huu wote. Lakini msiache kumfuata Yahwe[a]; bali mtumikieni Yahwe kwa mioyo yenu yote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa neno kwa neno: “msigeuke kutoka nyuma ya Yahwe”; hii ni nahau inayomaanisha kuacha kumfuata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל אֶל הָעָם
  choice: Samweli akawaambia watu
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kuendeleza simulizi na kutambulisha maneno ambayo Samweli aliwaambia Waisraeli waliokusanyika.
- source_word: אַל תִּירָאוּ
  choice: Msiogope
  rationale: Amri ya kukataza katika wingi; tafsiri hii ni fupi, ya kawaida, na inadumisha nguvu ya kauli ya Kiebrania.
- source_word: אַתֶּם עֲשִׂיתֶם
  choice: Ninyi mmefanya
  rationale: Kiwakilishi huru אַתֶּם kinasisitiza wahusika; “Ninyi” kinahifadhi msisitizo huo, na “mmefanya” linaonyesha tendo lililokamilika ambalo matokeo yake bado yanawahusu.
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: uovu huu wote
  rationale: רָעָה hapa lina uzito wa kimaadili, si kosa dogo tu. Mpangilio huu ni wa asili katika Kiswahili na unahifadhi maana ya jumla.
- source_word: אַךְ
  choice: Lakini
  rationale: Neno hili linaweka tofauti yenye nguvu kati ya kukiri uovu wao na wajibu wao wa sasa wa kuendelea kuwa waaminifu kwa Yahwe.
- source_word: אַל תָּסוּרוּ מֵאַחֲרֵי יְהוָה
  choice: msigeuke na kuacha kumfuata Yahwe
  rationale: Tafsiri hii inahifadhi picha ya kugeuka na pia maana ya nahau ya kuacha kumfuata Yahwe, bila kuifanya kauli hiyo kuwa wazo la jumla lisilo na picha.
- source_word: יְהוָה
  choice: Yahwe
  rationale: “Yahwe” ni umbo la kawaida la Kiswahili la jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: וַעֲבַדְתֶּם אֶת יְהוָה
  choice: bali mtumikieni Yahwe
  rationale: עבד katika muktadha huu ni kumtumikia kwa uaminifu wa agano. “Bali” linaonyesha vizuri tofauti kati ya katazo lililotangulia na amri hii chanya.
- source_word: בְּכָל לְבַבְכֶם
  choice: kwa moyo wenu wote
  rationale: Ni nahau ya Kiebrania inayoonyesha kujitoa kikamilifu kwa ndani. Umbo hili ni la heshima na linaeleweka kwa urahisi katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia jina binafsi la Mungu, si neno la Kiebrania linalomaanisha “Bwana.” Kutumia “Yahwe” kunahifadhi tofauti hiyo ya kimaandishi na ya kiagano.
- issue: Uzito wa kimaadili wa רָעָה
  choice: uovu
  alternative: kosa
  rationale: Muktadha ni karipio la Samweli kuhusu tendo la watu lililokuwa baya mbele za Mungu. “Uovu” haupunguzi uzito huo kuwa kosa au hitilafu ya kawaida.
- issue: Uhusiano kati ya katazo na amri chanya
  choice: bali mtumikieni Yahwe
  alternative: na mtumikieni Yahwe
  rationale: Kiunganishi cha Kiebrania kinaweza kutafsiriwa “na,” lakini hapa kauli chanya inatofautishwa na kugeuka na kuacha kumfuata Yahwe. “Bali” huwasilisha uhusiano huo kwa Kiswahili cha asili bila kubadili agizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Yahwe” limetumiwa kama umbo la Kiswahili la jina la Mungu. Msisitizo wa “Ninyi” na uzito wa “uovu” vimedumishwa; nahau ya Kiebrania kuhusu kugeuka kutoka nyuma ya Yahwe imefafanuliwa kwa lugha ya asili huku picha ya kugeuka ikihifadhiwa.
