  text: And do not turn aside after worthless things that cannot profit or deliver[b][a], for they are worthless.
translation:
  language: sw
  text: Wala msigeuke mkafuata mambo ya ubatili[a], ambayo hayawezi kuwanufaisha wala kuwaokoa[b], kwa maana ni ubatili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mambo matupu,” “mambo ya bure,” au “sanamu.” Neno la Kiebrania tohu humaanisha kilicho tupu, bure, au kisicho na maana.
    reason: lexical_alternative
  - marker: b
    text: Au “kuwakomboa” au “kuwanusuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּסוּרוּ
  choice: msigeuke
  rationale: Kitenzi סור humaanisha kugeuka, kukengeuka, au kuacha njia. “Msigeuke” ni Kiswahili cha kawaida kinachohifadhi picha ya kuacha mwelekeo unaofaa.
- source_word: אַחֲרֵי
  choice: mkafuata
  rationale: Neno hili kwa msingi humaanisha “nyuma ya/baada ya,” na katika muktadha huu lina wazo la kufuata au kuandama. Muundo “msigeuke mkafuata” unaeleza hilo kwa Kiswahili cha asili.
- source_word: הַתֹּהוּ / תֹהוּ
  choice: mambo ya ubatili / ubatili
  rationale: תֹהוּ huonyesha hali ya kuwa tupu, bure, isiyo na maana, au isiyo na uwezo wa kufanikisha chochote. “Mambo ya ubatili” huhifadhi upana huo bila kuyataja moja kwa moja kuwa sanamu, na “ni ubatili” huhifadhi marudio ya Kiebrania.
- source_word: אֲשֶׁר לֹא יוֹעִילוּ
  choice: ambayo hayawezi kuwanufaisha
  rationale: Kauli hii inaeleza kwamba mambo hayo hayawezi kuleta faida au msaada. “Hayawezi kuwanufaisha” ni ya kawaida na huonyesha kutokuwa na uwezo kwao.
- source_word: וְלֹא יַצִּילוּ
  choice: wala kuwaokoa
  rationale: Katika kausativi, נצל humaanisha kuokoa au kukomboa kutoka hatarini. “Kuwaokoa” ni neno la kawaida na linalofaa katika muktadha huu.
- source_word: הֵמָּה
  choice: ni
  rationale: Kiwakilishi hiki kinarejelea mambo yaliyotajwa. Katika kishazi nomino cha Kiswahili, “ni ubatili” ni muundo wa asili unaowasilisha maana ya “hayo ni ubatili.”
theological_decisions:
- issue: Kile kinachorejelewa na “mambo ya ubatili”
  choice: Rejeo la jumla kwa mambo matupu na yasiyofaa ambayo watu wanaweza kuyategemea badala ya BWANA
  alternative: sanamu
  rationale: Muktadha unaweza kuelekeza kwa sanamu au miungu mingine, lakini תֹהוּ ni pana kuliko neno mahsusi la “sanamu.” Tafsiri inaacha upana huo na haiongezi umahususi usiowekwa wazi katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “msigeuke mkafuata” ni wa asili na unahifadhi wazo la kukengeuka kisha kuandama kitu kingine. Marudio ya “ubatili” yanadumishwa kwa kuwa ni muhimu katika msisitizo wa mstari.
