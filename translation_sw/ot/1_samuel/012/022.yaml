base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/022.yaml
  text: For Yahweh will not forsake his people[a], for the sake of his great name[b], because Yahweh has been pleased to make you his people.
translation:
  language: sw
  text: Kwa maana Yahweh hatawaacha watu wake[a] kwa ajili ya jina lake kuu, kwa kuwa Yahweh ameona vema kuwafanya ninyi kuwa watu wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hatawatelekeza” au “hatawatupa.”
    reason: lexical_alternative
  - marker: b
    text: Au “Yahweh ameamua kuwafanya ninyi kuwa watu wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִטֹּשׁ
  choice: hatawaacha
  rationale: Kitenzi נטש hapa humaanisha kuwaacha au kuwatupa watu; “hatawaacha” ni Kiswahili cha kawaida na kinachobeba uzito wa uaminifu wa agano.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limeandikwa moja kwa moja katika Kiebrania; kulitafsiri kwa “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- source_word: עַמּוֹ
  choice: watu wake
  rationale: עַם hapa inaeleza jamii yenye utambulisho wa kitaifa na wa agano, hivyo “watu wake” ni sahihi na ya kawaida.
- source_word: בַּעֲבוּר שְׁמוֹ הַגָּדוֹל
  choice: kwa ajili ya jina lake kuu
  rationale: Kauli hii huhifadhi sababu au msingi wa tendo la Mungu na taswira ya Kiebrania ya jina lake, yaani heshima na sifa yake iliyofunuliwa.
- source_word: הוֹאִיל
  choice: amependezwa
  rationale: הוֹאִיל huonyesha utayari au uamuzi wenye ridhaa; “amependezwa” huhifadhi wazo la hiari yenye neema bila kulifanya kuwa fundisho la kiufundi lisilosemwa wazi.
- source_word: לַעֲשׂוֹת אֶתְכֶם לוֹ לְעָם
  choice: kuwafanya ninyi kuwa watu wake
  rationale: Muundo huu unaeleza tendo la Yahweh la kuwafanya Israeli wawe watu walio wake; “ninyi” hufanya wingi wa kiwakilishi cha Kiebrania uwe wazi.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina la agano lenyewe; “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya ridhaa ya Mungu katika הוֹאִיל
  choice: amependezwa
  alternative: amechagua au ameamua
  rationale: Chaguo hili huhifadhi mvutano kati ya kupendezwa, kuwa tayari, na kuamua, bila kuingiza maana maalumu ya kiteolojia zaidi ya andiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio unabaki karibu na Kiebrania huku sentensi ikiwa ya kawaida kusomeka. Jina “Yahweh” limehifadhiwa, na kiwakilishi “ninyi” kinaonyesha wazi kuwa אֶתְכֶם ni wingi.
