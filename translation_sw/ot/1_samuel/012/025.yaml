  text: וְ/אִם הָרֵ֖עַ תָּרֵ֑עוּ גַּם אַתֶּ֥ם גַּֽם מַלְכְּ/כֶ֖ם תִּסָּפֽוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/025.yaml
  text: But if you persist in doing evil[b][a], both you and your king will be swept away.
translation:
  language: sw
  text: Lakini mkiendelea kutenda maovu[a], ninyi pamoja na mfalme wenu mtaangamizwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkitenda maovu” au “mkitenda kwa uovu”; Kiebrania kinasisitiza kitenzi kwa kutumia kitenzi-jina halisi pamoja na kitenzi.
    reason: lexical_alternative
  - marker: b
    text: Au “mtafagiliwa mbali,” “mtaangamia,” au “mtaondolewa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Lakini mki-
  rationale: Kiunganishi hiki kinaanzisha sharti linalotofautiana na ahadi iliyotangulia; “lakini” linaonyesha vizuri utofauti huo katika Kiswahili.
- source_word: הָרֵעַ תָּרֵעוּ
  choice: mkiendelea kutenda maovu
  rationale: Muundo wa kitenzi pamoja na kitenzi-jina halisi unasisitiza tendo la kufanya uovu. “Mkiendelea kutenda maovu” huwasilisha msisitizo huo kwa Kiswahili cha kawaida bila kurudia kitenzi kwa namna isiyo ya asili.
- source_word: גַּם אַתֶּם גַּם מַלְכְּכֶם
  choice: ninyi pamoja na mfalme wenu
  rationale: Kurudiwa kwa גַּם kunawahusisha watu na mfalme wao wote wawili katika onyo.
- source_word: תִּסָּפוּ
  choice: mtaangamizwa
  rationale: Nifali ya ספה ina maana ya kuondolewa, kuharibiwa, au kuangamia chini ya hukumu. Kauli tendwa “mtaangamizwa” inadumisha uzito na upana wa onyo bila kutaja namna mahsusi ya hukumu.
theological_decisions:
- issue: Aina ya hukumu iliyotangazwa juu ya watu na mfalme
  choice: Onyo la pamoja la hukumu na kuangamizwa kwa watu na mfalme wao
  alternative: Kushindwa vitani pekee au kuharibika kiroho pekee
  rationale: Mstari hautaji namna mahsusi ya hukumu. Tafsiri haibani maana kuwa kushindwa kijeshi au kuharibika kiroho tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ni wazi kwa wasomaji wa kawaida, huku msisitizo wa Kiebrania na upana wa hukumu vikihifadhiwa katika maandishi na tanbihi.
