  text: וְ/עַתָּ֗ה הִנֵּ֥ה הַ/מֶּ֛לֶךְ אֲשֶׁ֥ר בְּחַרְתֶּ֖ם אֲשֶׁ֣ר שְׁאֶלְתֶּ֑ם וְ/הִנֵּ֨ה נָתַ֧ן יְהוָ֛ה עֲלֵי/כֶ֖ם מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/013.yaml
  text: And now[a], here is the king whom you have chosen, whom you have asked for; and look, Yahweh has set a king over you.
translation:
  language: sw
  text: Basi sasa, huyu hapa mfalme mliyemchagua, ambaye mlimwomba; na tazameni, Yahwe amemweka mfalme juu yenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa tafsiri ya moja kwa moja zaidi: “Yahwe amewapa mfalme.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Kirai hiki huhifadhi kiunganishi pamoja na alama ya wakati na ya hoja, kikitambulisha hitimisho la Samweli kutokana na yaliyotangulia.
- source_word: הִנֵּה
  choice: huyu hapa
  rationale: Katika tukio la kwanza, neno hili linaelekeza usikivu kwa mfalme aliyepo mbele ya watu; ‘huyu hapa’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: הַמֶּלֶךְ
  choice: mfalme
  rationale: Linamtaja mfalme maalumu ambaye watu walimwomba, si ufalme kwa ujumla.
- source_word: אֲשֶׁר בְּחַרְתֶּם
  choice: mliyemchagua
  rationale: Kitenzi בחר humaanisha kuchagua; umbo la wakati uliotimilika linaonyesha tendo lao lililokamilika.
- source_word: אֲשֶׁר שְׁאֶלְתֶּם
  choice: ambaye mlimwomba
  rationale: Huhifadhi maana ya שׁאל, ‘kuomba/kutaka apewe,’ na mwangwi wa ombi la watu la kutaka mfalme katika simulizi.
- source_word: וְהִנֵּה
  choice: na tazameni
  rationale: Tukio la pili la הִנֵּה linavuta tena usikivu; ‘tazameni’ huhifadhi msisitizo bila kurudia ‘huyu hapa.’
- source_word: נָתַן יְהוָה
  choice: Yahwe amemweka
  rationale: נתן maana yake ya msingi ni ‘kutoa,’ lakini pamoja na עַל na mfalme inaeleza kumweka mtu katika mamlaka juu ya wengine.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa tetragramatoni linatolewa kama jina binafsi ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
- source_word: עֲלֵיכֶם
  choice: juu yenu
  rationale: Katika muktadha huu עַל huonyesha mamlaka ya mfalme juu ya watu.
- source_word: מֶלֶךְ
  choice: mfalme
  rationale: Nomino isiyo na kibainishi inamtaja mfalme aliyewekwa juu yao; Kiswahili hakihitaji kibainishi kinacholingana na ‘a.’
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu moja kwa moja; ‘Yahwe’ hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Wakala wa Mungu katika kuwekwa kwa mfalme
  choice: Yahwe amemweka mfalme juu yenu
  alternative: Yahwe amewapa mfalme
  rationale: Tafsiri kuu inaonyesha kwamba Mungu ndiye aliyemweka mfalme katika mamlaka, huku tanbihi ikihifadhi maana ya msingi ya נתן, ‘kutoa.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Basi sasa’ na ‘tazameni’ huhifadhi mtiririko na msisitizo wa hotuba, huku ‘huyu hapa’ ikifanya deiksisi ya kwanza iwe ya kawaida kwa msomaji wa leo.
