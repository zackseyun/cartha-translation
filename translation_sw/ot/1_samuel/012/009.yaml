id: 1SA.12.9
reference: 1 Samuel 12:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יִּמְכֹּ֣ר אֹתָ֡/ם בְּ/יַ֣ד סִֽיסְרָא֩ שַׂר צְבָ֨א חָצ֜וֹר וּ/בְ/יַד פְּלִשְׁתִּ֗ים וּ/בְ/יַד֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּֽלָּחֲמ֖וּ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/009.yaml
  text: But they forgot Yahweh their God[a], and he sold them into the hand of Sisera, commander of the army of Hazor, and into the hand of the Philistines, and into the hand of the king of Moab; and they fought against them.
translation:
  language: sw
  text: Lakini walimsahau Yahwe, Mungu wao, naye akawauza[a] mikononi mwa Sisera, mkuu wa jeshi la Hazori, mikononi mwa Wafilisti, na mikononi mwa mfalme wa Moabu; nao wakapigana dhidi yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawatia chini ya mamlaka ya maadui zao.” Kiebrania kinasema kihalisi “akawauza,” nahau ya hukumu ya agano inayoonyesha kuwakabidhi watu chini ya nguvu za maadui wao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: walimsahau
  rationale: Kitenzi שׁכח kimsingi humaanisha ‘kusahau.’ Katika muktadha wa agano kinaweza kudokeza kupuuza au kukosa uaminifu, lakini ‘walimsahau’ huhifadhi usemi wa Kiebrania bila kuufafanua kupita kiasi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kwa tahajia ya kawaida na inayotamkika kwa Kiswahili, badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵיהֶם
  choice: Mungu wao
  rationale: Muundo wenye kiambishi cha umilikaji unatafsirika kwa kawaida kuwa ‘Mungu wao’ na huhifadhi mkazo wa uhusiano wa agano.
- source_word: וַיִּמְכֹּר
  choice: akawauza
  rationale: Kitenzi מכר humaanisha kihalisi ‘kuuza.’ Hapa ni tamathali ya hukumu ya agano inayomaanisha kuwatia chini ya mamlaka ya maadui; tafsiri ya moja kwa moja imehifadhiwa na kufafanuliwa katika tanbihi.
- source_word: בְּיַד
  choice: mikononi mwa
  rationale: Nahau ya Kiebrania ‘katika mkono wa’ huonyesha kutiwa chini ya mamlaka ya mwingine. ‘Mikononi mwa’ ni usemi wa asili wa Kiswahili unaohifadhi taswira hiyo.
- source_word: סִיסְרָא
  choice: Sisera
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: שַׂר צְבָא חָצוֹר
  choice: mkuu wa jeshi la Hasori
  rationale: שַׂר צְבָא humaanisha kiongozi au mkuu wa kijeshi; muundo huu pia huhifadhi uhusiano wa jeshi na Hasori.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la taifa hilo katika Kiswahili.
- source_word: מֶלֶךְ מוֹאָב
  choice: mfalme wa Moabu
  rationale: Tafsiri ya moja kwa moja ya muundo wa umilikaji wa Kiebrania.
- source_word: וַיִּלָּחֲמוּ בָם
  choice: nao wakapigana dhidi yao
  rationale: Kitenzi cha wingi kwa kawaida huwarejelea watawala na mataifa ya ukandamizaji waliotajwa, huku kiwakilishi cha mwisho kikiwarejelea Israeli. Usemi huu huhifadhi viwakilishi vya maandishi bila kuongeza majina yasiyokuwamo.
theological_decisions:
- issue: Mtenda wa ‘akawauza’
  choice: Yahwe ndiye mtenda anayeeleweka wa kitenzi cha umoja.
  alternative: Kutumia kauli isiyoonyesha mtenda, kama ‘wakauzwa.’
  rationale: Kishazi kilichotangulia kinamtaja Yahwe, Mungu wao, na kitenzi kinachofuata cha umoja kwa kawaida kinaendelea kumhusu yeye. Hivyo maandishi yanaonyesha kwamba Yahwe aliwatia Israeli chini ya maadui kama hukumu, bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Maana ya ‘walimsahau Yahwe’
  choice: Kudumisha ‘walimsahau,’ huku kutokuwa waaminifu kwa agano kukidokezwa na muktadha.
  alternative: Kutafsiri kwa ufafanuzi zaidi, kama ‘walimwacha Yahwe’ au ‘walimpuuza Yahwe.’
  rationale: Ingawa kitenzi kinaweza kuwa na uzito wa kutokuwa waaminifu kwa agano, neno lenyewe ni ‘kusahau.’ Tafsiri ya moja kwa moja huhifadhi maana na mvutano wa kitheolojia wa chanzo.
- issue: Wahusika wa ‘nao wakapigana dhidi yao’
  choice: Watawala na mataifa waliotajwa ndio wanaopigana dhidi ya Israeli.
  alternative: Kuacha kauli ikieleweke kana kwamba Israeli ndio waliopigana dhidi ya maadui hao.
  rationale: Kitenzi cha wingi kinafuata orodha ya Sisera, Wafilisti, na mfalme wa Moabu kama nguvu za ukandamizaji. Hata hivyo, viwakilishi vya chanzo vimehifadhiwa badala ya kubadilishwa na majina ya ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. ‘Yahwe’ huhifadhi jina la Mungu; ‘mikononi mwa’ huhifadhi taswira ya Kiebrania kwa njia ya asili katika Kiswahili. Alama ya tanbihi imewekwa baada ya ‘akawauza,’ neno linalofafanuliwa na tanbihi.
