  yaml_path: translation/ot/1_samuel/012/001.yaml
  text: Then Samuel said to all Israel, “Look, I have listened to your voice in all that you have said to me, and I have made a king reign over you.”
translation:
  language: sw
  text: Kisha Samueli akawaambia Waisraeli wote, “Tazameni, nimewasikiliza katika yote mliyoniambia, nami nimemweka mfalme atawale juu yenu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazameni
  rationale: Kielekezi hiki huvuta usikivu wa wasikilizaji; “Tazameni” ni cha heshima na cha kawaida katika simulizi la kibiblia.
- source_word: שָׁמַעְתִּי בְקֹלְכֶם
  choice: nimewasikiliza
  rationale: Nahau ya Kiebrania, kihalisi “nimeisikia sauti yenu,” hapa humaanisha kukubali na kutenda kulingana na ombi lao; tafsiri hii ni ya asili katika Kiswahili.
- source_word: וָאַמְלִיךְ עֲלֵיכֶם מֶלֶךְ
  choice: nami nimemweka mfalme atawale juu yenu
  rationale: Huhifadhi maana ya kitenzi cha kusababisha kutawala, si kuweka tu cheo cha mfalme.
theological_decisions:
- issue: Wajibu wa Samueli katika kuanzishwa kwa ufalme
  choice: nimemweka mfalme atawale juu yenu
  alternative: nimewapa mfalme
  rationale: Muundo uliochaguliwa unafuata kitenzi cha Kiebrania cha kusababisha mtu awe mfalme bila kuongeza dai kuhusu chanzo cha mwisho cha mamlaka yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Waisraeli wote” ni ya asili zaidi kuliko “Israeli yote” inapowarejelea watu; usemi wa moja kwa moja umehifadhiwa.
