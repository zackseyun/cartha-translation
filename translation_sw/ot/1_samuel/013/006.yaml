id: 1SA.13.6
reference: 1 Samuel 13:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אִ֨ישׁ יִשְׂרָאֵ֤ל רָאוּ֙ כִּ֣י צַר ל֔/וֹ כִּ֥י נִגַּ֖שׂ הָ/עָ֑ם וַ/יִּֽתְחַבְּא֣וּ הָ/עָ֗ם בַּ/מְּעָר֤וֹת וּ/בַֽ/חֲוָחִים֙ וּ/בַ/סְּלָעִ֔ים וּ/בַ/צְּרִחִ֖ים וּ/בַ/בֹּרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/006.yaml
  text: When the men of Israel saw that they were in trouble[a], because the people were hard pressed, the people hid themselves in caves, in thickets, among rocks, in strongholds[c][b], and in pits.
translation:
  language: sw
  text: Wanaume wa Israeli walipoona kwamba walikuwa taabani, kwa sababu watu walikuwa wamebanwa sana, walijificha mapangoni, katika vichaka[a], miambani, katika vyumba vya chini ya ardhi[b], na katika mashimo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika vichaka vya miiba.” Neno la Kiebrania ni adimu na huenda linarejelea hasa vichaka vyenye miiba.
    reason: lexical_alternative
  - marker: b
    text: Au “katika mashimo ya chini ya ardhi,” “katika ghala za chini ya ardhi,” au “katika ngome.” Maana ya neno la Kiebrania si hakika.
    reason: lexical_alternative
  - marker: c
    text: Au “katika mabirika” au “visimani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: Wanaume wa Israeli
  rationale: Nomino ya umoja אִישׁ imetumiwa kwa maana ya kijumla pamoja na kitenzi cha wingi; tafsiri hii inahifadhi rejeo la kiume na kusikika kwa kawaida katika Kiswahili.
- source_word: רָאוּ
  choice: walipoona
  rationale: Inahifadhi maana ya msingi ya kuona, huku muktadha ukionyesha kwamba walitambua hali yao.
- source_word: כִּי צַר לוֹ
  choice: kwamba walikuwa taabani
  rationale: Kirai cha Kiebrania ni kifupi na kina kiwakilishi cha umoja baada ya mhusika wa kijumla; wingi ni wa kawaida katika Kiswahili na 'taabani' huwasilisha dhiki bila kufafanua kupita kiasi.
- source_word: כִּי נִגַּשׂ הָעָם
  choice: kwa sababu watu walikuwa wamebanwa sana
  rationale: Nifali ya נגשׂ inaweza kumaanisha kusukumwa, kukandamizwa, au kubanwa; katika mazingira haya ya kijeshi, 'wamebanwa sana' ni wazi na ya kawaida.
- source_word: וַיִּתְחַבְּאוּ
  choice: walijificha
  rationale: Kitenzi cha kujirejelea katika Kiebrania kinawakilishwa vizuri na kitenzi cha Kiswahili 'kujificha'.
- source_word: בַּמְּעָרוֹת
  choice: mapangoni
  rationale: מְעָרָה humaanisha pango; umbo la mahali ni la kawaida na fasaha katika Kiswahili.
- source_word: וּבַחֲוָחִים
  choice: katika vichaka
  rationale: Neno hili adimu huenda linarejelea vichaka vyenye miiba; 'vichaka' ni pana na rahisi kueleweka, huku uwezekano wa miiba ukihifadhiwa katika tanbihi.
- source_word: וּבַסְּלָעִים
  choice: miambani
  rationale: סֶלַע humaanisha mwamba, jabali, au genge; 'miambani' ni mahali pa kujificha panapoeleweka bila kubainisha mandhari kupita kiasi.
- source_word: וּבַצְּרִחִים
  choice: katika vyumba vya chini ya ardhi
  rationale: Neno hili adimu na lisilo na uhakika huenda linamaanisha nafasi au ghala za chini ya ardhi. Tafsiri hii inatoa mahali halisi pa kujificha na kulitofautisha na mashimo yanayofuata.
- source_word: וּבַבֹּרוֹת
  choice: katika mashimo
  rationale: בּוֹר inaweza kumaanisha shimo, kisima, au birika. 'Mashimo' ni tafsiri pana inayofaa muktadha wa kujificha.
