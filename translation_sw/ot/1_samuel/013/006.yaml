translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Marudio ya 'watu' kutoka katika Kiebrania yamehifadhiwa kwa kadiri inavyowezekana, na kutokuwa na uhakika kwa majina mawili adimu ya maficho kumewekwa wazi katika tanbihi.
