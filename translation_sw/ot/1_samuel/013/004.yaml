base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/004.yaml
  text: And all Israel heard it said[a], “Saul has struck down the Philistine garrison[c][b], and Israel has also become odious to the Philistines.” Then the people were called out to join Saul at Gilgal.
translation:
  language: sw
  text: Waisraeli wote wakasikia habari kwamba, “Sauli amekipiga kituo cha kijeshi cha Wafilisti[b], na Waisraeli pia wamekuwa chukizo kwa Wafilisti[c].” Ndipo watu wakaitwa wamfuate Sauli huko Gilgali[d].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli wote wakasikia ikisemwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “afisa wa Wafilisti” au “kituo cha Wafilisti.” Neno la Kiebrania linaweza kumaanisha afisa au kituo/kikosi cha kijeshi kilichowekwa mahali; muktadha wa kijeshi unapendelea “kituo cha kijeshi.”
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “Israeli wamenuka kwa Wafilisti,” nahau inayomaanisha kwamba wamekuwa chukizo au wenye kuchukiwa nao.
    reason: lexical_alternative
  - marker: d
    text: Au, “watu wakakusanywa nyuma ya Sauli huko Gilgali.” Usemi huo huenda unamaanisha kuwakusanya watu wamfuate Sauli vitani.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ לֵאמֹר
  choice: wakasikia ikisemwa
  rationale: Muundo huu unatambulisha taarifa iliyokuwa ikienea; tafsiri hii inafuata nahau ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: הִכָּה
  choice: amekishinda
  rationale: Katika muktadha wa kijeshi, kitenzi hiki kinaweza kumaanisha kupiga au kushinda. 'Amekishinda' ni ya kawaida kwa kikosi, bila kudokeza lazima kwamba kila askari aliuawa.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: kikosi cha Wafilisti
  rationale: Neno נְצִיב linaweza kumaanisha afisa, kituo, au kikosi kilichowekwa mahali. Muktadha wa kijeshi unaunga mkono 'kikosi,' huku tanbihi ikihifadhi utata wa neno.
- source_word: נִבְאַשׁ
  choice: wamekuwa chukizo
  rationale: Kitenzi kina picha halisi ya kunuka, lakini hapa kimetumika kinahau kumaanisha kuchukiwa au kuwa chukizo.
- source_word: בַּפְּלִשְׁתִּים
  choice: kwa Wafilisti
  rationale: Kihusishi kinaonyesha jinsi Wafilisti walivyowaona Israeli; 'kwa Wafilisti' ni fupi na ya asili.
- source_word: וַיִּצָּעֲקוּ
  choice: wakaitwa wakusanyike
  rationale: Ingawa mzizi mara nyingi humaanisha kulia kwa sauti, katika muktadha huu wa kijeshi unaelekea kumaanisha kuwaita au kuwakusanya watu.
- source_word: אַחֲרֵי שָׁאוּל
  choice: kumfuata Sauli
  rationale: Hii inadumisha maana ya msingi ya 'nyuma ya/baada ya Sauli' na pia inaeleweka kama kujiunga chini ya uongozi wake.
- source_word: הַגִּלְגָּל
  choice: huko Gilgali
  rationale: Jina la mahali limetoholewa kwa tahajia iliyozoeleka katika Kiswahili; muktadha unaonyesha mahali pa mkusanyiko.
