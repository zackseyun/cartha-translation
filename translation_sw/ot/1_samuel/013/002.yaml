  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa heshima na unaoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yanayotumika sana katika Biblia za Kiswahili: Sauli, Mikmashi, Betheli, Yonathani, Gibea, na Benyamini.'
