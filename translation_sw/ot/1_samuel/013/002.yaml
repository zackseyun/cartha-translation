source:
  edition: WLC
  text: וַ/יִּבְחַר ל֨/וֹ שָׁא֜וּל שְׁלֹ֣שֶׁת אֲלָפִים֮ מִ/יִּשְׂרָאֵל֒ וַ/יִּהְי֨וּ עִם שָׁא֜וּל אַלְפַּ֗יִם בְּ/מִכְמָשׂ֙ וּ/בְ/הַ֣ר בֵּֽית אֵ֔ל וְ/אֶ֗לֶף הָיוּ֙ עִם י֣וֹנָתָ֔ן בְּ/גִבְעַ֖ת בִּנְיָמִ֑ין וְ/יֶ֣תֶר הָ/עָ֔ם שִׁלַּ֖ח אִ֥ישׁ לְ/אֹהָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/002.yaml
  text: And Saul chose for himself three thousand men from Israel[a]. Two thousand were with Saul at Michmash and in the hill country of Bethel, and a thousand were with Jonathan at Gibeah of Benjamin. The rest of the people he sent away[b], each man to his tent.
translation:
  language: sw
  text: Sauli akajichagulia wanaume elfu tatu kutoka Israeli. Wanaume elfu mbili walikuwa pamoja na Sauli huko Mikmashi na katika eneo la milima la Betheli[a], na elfu moja walikuwa pamoja na Yonathani huko Gibea ya Benyamini. Watu wengine waliobaki aliwatuma, kila mtu kwenye hema lake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye mlima wa Betheli.” Neno la Kiebrania linaweza kumaanisha eneo la milima linalozunguka Betheli au eneo fulani lililoinuka karibu na Betheli.
    reason: lexical_alternative
  - marker: b
    text: Usemi “kila mtu kwenye hema lake” ni nahau ya kawaida ya Kiebrania inayomaanisha kuwa watu waliondoka na kurudi kwenye makao yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: akajichagulia
  rationale: Kitenzi cha Kiswahili chenye kiambishi cha kujitendea kinaonyesha kwa ufupi kwamba Sauli alichagua watu kwa ajili yake mwenyewe.
- source_word: שְׁלֹשֶׁת אֲלָפִים מִיִּשְׂרָאֵל
  choice: wanaume elfu tatu kutoka Israeli
  rationale: Idadi na maana ya chanzo zimehifadhiwa; ‘wanaume’ inafafanua kwa kawaida kwamba waliochaguliwa hapa ni askari.
- source_word: וַיִּהְיוּ עִם שָׁאוּל
  choice: walikuwa pamoja na Sauli
  rationale: Huhifadhi kauli rahisi ya Kiebrania kuhusu mahali kikosi kilipowekwa bila kuongeza wazo la kubaki.
- source_word: בְּמִכְמָשׂ
  choice: huko Mikmashi
  rationale: ‘Huko’ ni njia ya kawaida ya Kiswahili ya kutaja mahali kikosi kilipokuwa.
- source_word: וּבְהַר בֵּית אֵל
  choice: na katika eneo la milima la Betheli
  rationale: הַר inaweza kumaanisha mlima au eneo la milima; tafsiri ya kieneo inafaa katika muktadha huu wa upangaji wa vikosi huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: וְאֶלֶף הָיוּ עִם יוֹנָתָן
  choice: na elfu moja walikuwa pamoja na Yonathani
  rationale: Muundo sambamba wa hesabu na mahali umehifadhiwa kwa Kiswahili cha kawaida.
- source_word: בְּגִבְעַת בִּנְיָמִין
  choice: huko Gibea ya Benyamini
  rationale: Uwekaji wa irabu katika maandishi ya Kimasora unaunga mkono ‘Gibea’; ‘ya Benyamini’ huitofautisha kwa eneo lake.
- source_word: וְיֶתֶר הָעָם
  choice: Watu wengine waliobaki
  rationale: Huhifadhi maana halisi ya ‘watu waliobaki’ bila kubadili moja kwa moja kuwa ‘jeshi’ au ‘askari.’
- source_word: שִׁלַּח
  choice: aliwaruhusu waende
  rationale: Katika muktadha huu kitenzi kina maana ya kuwaondoa au kuwaachilia kutoka katika mkusanyiko; usemi huu ni wa kawaida na haudokezi kwamba walipelekwa kwenye kazi nyingine.
- source_word: אִישׁ לְאֹהָלָיו
  choice: kila mtu kwenye hema lake
  rationale: Taswira halisi ya Kiebrania imehifadhiwa, pamoja na maana yake ya kawaida ya kila mmoja kurudi kwenye makao yake.
