  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vifungu viwili sambamba umehifadhiwa, huku “kikosi” kikitumiwa kwa maana ya kijeshi iliyo wazi kwa msomaji wa kawaida.
