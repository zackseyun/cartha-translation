base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/018.yaml
  text: and one company turned toward the road to Beth-horon[a], and one company turned toward the road of the border that overlooks the Valley of Zeboim[b], toward the wilderness.
translation:
  language: sw
  text: Kikosi kimoja kikaelekea kwenye barabara ya Beth-horoni[a], na kikosi kimoja kikaelekea kwenye njia ya mpaka unaotazama Bonde la Seboimu[b], kuelekea nyikani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sehemu moja” au “kikundi kimoja”; kwa neno halisi, “kichwa kimoja.”
    reason: lexical_alternative
  - marker: b
    text: “Seboimu” huenda ni jina la mahali; neno la Kiebrania linalohusika huenda linahusiana na “mafisi.”
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ אֶחָד
  choice: kikosi kimoja
  rationale: Ingawa רֹאשׁ maana yake ya msingi ni “kichwa,” katika muktadha huu wa kijeshi inaashiria mojawapo ya vikundi vya wavamizi vilivyotajwa katika mstari uliotangulia. “Kikosi” ni Kiswahili cha kawaida na wazi kwa kitengo hicho.
- source_word: יִפְנֶה
  choice: kikaelekea
  rationale: פנה hueleza kugeuka au kuelekea upande fulani. Katika habari ya kusonga kwa askari, “kikaelekea” huwasilisha mwelekeo wa safari kwa lugha ya kawaida.
- source_word: דֶּרֶךְ
  choice: barabara
  rationale: דֶּרֶךְ humaanisha njia au barabara; hapa inarejelea njia halisi ya kusafiria.
- source_word: בֵּית חֹרוֹן
  choice: Beth-horoni
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Waswahili, huku likihifadhi utambulisho wake kama jina maalumu.
- source_word: הַגְּבוּל
  choice: mpakani
  rationale: גְּבוּל ni mpaka au eneo la mpaka. Katika muundo דֶּרֶךְ הַגְּבוּל, “barabara ya mpakani” ni ya asili na hudumisha maana ya kitopografia.
- source_word: הַנִּשְׁקָף
  choice: inayoangalia chini
  rationale: Kauli hii inaeleza mahali palipoinuka panapotazama eneo la chini. “Inayoangalia chini kwenye” hudumisha wazi uhusiano wa kitopografia.
- source_word: גֵּי הַצְּבֹעִים
  choice: Bonde la Seboimu
  rationale: Kirai hiki kinafanya kazi kama jina la mahali. “Seboimu” limetoholewa badala ya kutafsiriwa kuwa “mafisi,” huku tanbihi ikihifadhi uwezekano wa maana hiyo ya msingi.
- source_word: הַמִּדְבָּרָה
  choice: kuelekea nyikani
  rationale: Kiambishi cha mwelekeo -ה kinaonyesha mwendo kuelekea nyikani; “kuelekea nyikani” huwasilisha dhana hiyo kwa Kiswahili cha kawaida.
