base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/015.yaml
  text: Then Samuel arose and went up from Gilgal to Gibeah of Benjamin[a], and Saul counted the people who were present with him, about six hundred men.
translation:
  language: sw
  text: Ndipo Samueli akaondoka, akapanda kutoka Gilgali kwenda Gibea ya Benyamini[a]. Naye Sauli akawahesabu watu waliokuwa pamoja naye, karibu wanaume mia sita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya mashahidi wa kale wa maandishi na tafsiri husoma “Geba ya Benyamini” badala ya “Gibea ya Benyamini.” Maandishi ya Kiebrania hapa yanasoma “Gibea ya Benyamini.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקָם
  choice: akaondoka
  rationale: Kitenzi קום katika mfululizo wa simulizi kinaweza kumaanisha kuinuka au kuondoka. Katika muktadha wa safari, “akaondoka” ni Kiswahili cha asili bila kukiondolea tendo hilo nafasi yake katika mfululizo.
- source_word: וַיַּעַל
  choice: akapanda
  rationale: עלה huhifadhi wazo la kwenda juu kuelekea mahali palipo juu; “akapanda” ni usemi mfupi na wa kawaida wa safari hiyo.
- source_word: מִן הַגִּלְגָּל
  choice: kutoka Gilgali
  rationale: Kirai hiki kinaonyesha mahali safari ilipoanzia; jina la mahali limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: גִּבְעַת בִּנְיָמִן
  choice: kwenda Gibea ya Benyamini
  rationale: Maandishi ya Kiebrania yaliyowekewa irabu yanasoma Gibea ya Benyamini na, baada ya kitenzi cha mwendo, kirai kinaeleweka kama kikomo cha safari. Tofauti ya “Geba” imewekwa katika tanbihi.
- source_word: וַיִּפְקֹד
  choice: akawahesabu
  rationale: Katika muktadha wa kikosi, פקד inaweza kuwa kuhesabu au kukagua walio tayari. “Akawahesabu” linaeleza wazi tendo la kujua idadi bila kuongeza wazo la kuwapanga kijeshi.
- source_word: הָעָם
  choice: watu
  rationale: עם kwa msingi ni “watu.” Ingawa hapa wako katika mazingira ya kijeshi, uchaguzi huu haufinyi maana kuwa “askari” zaidi ya maandishi yenyewe.
- source_word: הַנִּמְצְאִים עִמּוֹ
  choice: waliokuwa pamoja naye
  rationale: Kauli ya Kiebrania, kihalisi “waliopatikana pamoja naye,” humaanisha waliokuwapo naye. Kiswahili hiki ni cha kawaida na hakilazimishi maana ya kwamba walikuwa wamebaki baada ya wengine kuondoka.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: karibu wanaume mia sita
  rationale: Kiambishi כ־ kinaonyesha makadirio, kwa hiyo “karibu.” אִישׁ katika hesabu hii ya kijeshi inarejelea wanaume, si watu kwa jumla.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa urahisi. Muundo wa vitenzi mfululizo umehifadhi mwendo wa simulizi; majina yametoholewa kama Samueli, Sauli, Gilgali, Gibea na Benyamini.
