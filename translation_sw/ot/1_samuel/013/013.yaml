base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/013.yaml
  text: And Samuel said to Saul[a], “You have acted foolishly. You have not kept the command of Yahweh your God, which he commanded you; for now Yahweh would have established your kingdom over Israel forever.”
translation:
  language: sw
  text: Samweli akamwambia Sauli, “Umetenda kwa upumbavu.[a] Hukushika amri ya Yahweh Mungu wako, aliyokuamuru. Kwa maana sasa Yahweh angeuimarisha ufalme wako juu ya Israeli milele.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Umekuwa mpumbavu.”
    reason: 'Tofauti ya kileksia: נִסְכָּלְתָּ inaweza kutafsiriwa kwa kusisitiza hali au sifa ya mpokeaji badala ya tendo lake.'
lexical_decisions:
- source_word: נִסְכָּלְתָּ
  choice: Umetenda kipumbavu
  rationale: Kitenzi cha Kiebrania katika nifali kinatathmini tendo au mwenendo wa Sauli kuwa wa kipumbavu, si kueleza hali yake tu. Usemi huu ni wa kawaida na wenye nguvu katika Kiswahili cha sasa.
- source_word: לֹא שָׁמַרְתָּ
  choice: Hukushika
  rationale: שׁמר inaweza kumaanisha kushika, kutunza, au kuzingatia. ‘Kushika amri’ huhifadhi taswira ya Kiebrania na pia hudokeza utiifu bila kuifafanua kupita kiasi.
- source_word: מִצְוַת
  choice: amri
  rationale: Nomino hii ya umoja inarejelea agizo mahususi la Mungu. ‘Amri’ ni neno wazi na la kawaida katika Kiswahili.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa konsonanti YHWH limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: 'Huu ni ujenzi wa moja kwa moja unaoonyesha uhusiano: Mungu wa Sauli.'
- source_word: אֲשֶׁר צִוָּךְ
  choice: aliyokuamuru
  rationale: צוה ni kitenzi cha kawaida chenye maana ya kuamuru; kiwakilishi rejeshi kinarejelea Yahweh.
- source_word: כִּי עַתָּה
  choice: Kwa maana sasa
  rationale: כִּי hapa inaanzisha maelezo ya matokeo yaliyopotezwa, na עַתָּה huweka mkazo kwenye wakati huo.
- source_word: הֵכִין
  choice: angeuimarisha
  rationale: Mzizi כון katika hifili una wazo la kuweka imara au kuthibitisha. Umbo la masharti ‘angeuimarisha’ linaonyesha matokeo ambayo yangetokea kama Sauli angetii, kulingana na muktadha.
- source_word: מַמְלַכְתְּךָ
  choice: ufalme wako
  rationale: ממלכה hapa ni mamlaka ya kifalme au ufalme wa Sauli; ‘ufalme wako’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: אֶל יִשְׂרָאֵל
  choice: juu ya Israeli
  rationale: Ingawa אֶל kwa kawaida ni ‘kwa/kuelekea,’ katika muktadha wa ufalme linaonyesha eneo au watu wanaotawaliwa.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Hii ndiyo tafsiri ya kawaida ya kishazi kinachoonyesha kudumu bila kikomo kilichotajwa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja; kulitohowa kama ‘Yahweh’ huhifadhi jina badala ya kuliweka cheo mahali pake.
- issue: Nguvu ya masharti isiyotimia katika כִּי עַתָּה הֵכִין יְהוָה
  choice: Kwa maana sasa Yahweh angeuimarisha ufalme wako
  alternative: Kwa maana sasa Yahweh alikuwa ameimarisha ufalme wako
  rationale: Muktadha unaeleza matokeo ambayo Sauli alipoteza kwa kutotii. Kiswahili huhitaji umbo la ‘ange-’ ili kuonyesha wazi hali hiyo isiyotimia, ingawa kitenzi cha Kiebrania chenyewe ni timilifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ‘akamwambia’ ni wa asili katika masimulizi ya Biblia. Sentensi imegawanywa baada ya ‘aliyokuamuru’ ili iwe wazi bila kupoteza uhusiano wa hoja.
