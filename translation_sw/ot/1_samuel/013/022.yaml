base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/022.yaml
  text: So on the day of battle[a], not a sword or spear was found in the hand of any of the people who were with Saul and Jonathan; but Saul and his son Jonathan had them.
translation:
  language: sw
  text: Basi, siku ya vita,[a] upanga wala mkuki havikupatikana mikononi mwa mtu yeyote miongoni mwa watu waliokuwa pamoja na Sauli na Yonathani; lakini Sauli na mwanawe Yonathani walikuwa na silaha hizo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa muundo wa karibu zaidi na Kiebrania: “Ikawa, siku ya vita, upanga na mkuki haukupatikana mkononi mwa watu wote waliokuwa pamoja na Sauli na Yonathani.” Katika usemi huu wa ukanushi, maana yake ni kwamba hakuna hata mmoja wa askari aliyekuwa na silaha hizo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Basi
  rationale: Kiunganishi hiki kinaonyesha hali iliyotokana na maelezo yaliyotangulia na kuendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: בְּיוֹם מִלְחֶמֶת
  choice: siku ya vita
  rationale: Huhifadhi maana ya wakati iliyo wazi katika Kiebrania huku ikiwa ya kawaida katika Kiswahili.
- source_word: לֹא נִמְצָא
  choice: hakupatikana
  rationale: Huhifadhi muundo wa kutendwa wa kitenzi cha Kiebrania bila kuongeza wazo la kutowezekana.
- source_word: חֶרֶב וַחֲנִית
  choice: upanga wala mkuki
  rationale: 'Katika sentensi kanushi, “wala” huwasilisha kwa kawaida nguvu ya mgawanyo ya jozi ya Kiebrania: hakuna silaha yoyote kati ya hizo mbili.'
- source_word: בְּיַד
  choice: mikononi mwa
  rationale: Huhifadhi taswira ya Kiebrania ya kuwa kitu mkononi, inayomaanisha kuwa nacho au kukimiliki.
- source_word: כָּל הָעָם
  choice: hata mmoja wa watu
  rationale: Chini ya ukanushi, כָּל ina maana ya mgawanyo; tafsiri hii inaweka wazi kwamba hakuna mtu yeyote miongoni mwao aliyekuwa na silaha hizo.
- source_word: אֲשֶׁר אֶת־שָׁאוּל וְאֶת־יוֹנָתָן
  choice: waliokuwa pamoja na Sauli na Yonathani
  rationale: Muundo huu unaonyesha ushirika au kuandamana nao, si alama ya yambwa ya moja kwa moja.
- source_word: וַתִּמָּצֵא לְשָׁאוּל וּלְיוֹנָתָן בְּנוֹ
  choice: lakini Sauli na Yonathani mwanawe walikuwa na silaha hizo
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la silaha hizo kupatikana kwao, huku “lakini” ikionyesha tofauti ya kimuktadha kati yao na watu wengine.
