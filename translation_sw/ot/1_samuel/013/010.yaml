id: 1SA.13.10
reference: 1 Samuel 13:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/כַלֹּת/וֹ֙ לְ/הַעֲל֣וֹת הָ/עֹלָ֔ה וְ/הִנֵּ֥ה שְׁמוּאֵ֖ל בָּ֑א וַ/יֵּצֵ֥א שָׁא֛וּל לִ/קְרָאת֖/וֹ לְ/בָרֲכֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/010.yaml
  text: And it happened[a], as soon as he had finished offering up the burnt offering, that behold, Samuel came. And Saul went out to meet him, to bless him.
translation:
  language: sw
  text: Ikawa, mara tu alipomaliza kutoa sadaka ya kuteketezwa, tazama, Samueli akaja. Sauli akatoka kwenda kumlaki ili ambariki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ili amsalimu” au “ili ampe salamu.” Kitenzi cha Kiebrania kwa maana halisi ni “kubariki,” lakini katika muktadha huu wa kukutana kinaweza kumaanisha kutoa salamu rasmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni fomula ya kawaida ya simulizi inayoanzisha tukio linalofuata; “Ikawa” huhifadhi mtiririko wa Kiebrania kwa Kiswahili cha kibiblia kinachoeleweka.
- source_word: כְּכַלֹּתוֹ
  choice: mara tu alipomaliza
  rationale: Muundo wa כ pamoja na kitenzi-jina na kiambishi cha nafsi unaonyesha wakati; muktadha unasisitiza kuwa kuja kwa Samueli kulifuata mara moja baada ya tendo kukamilika.
- source_word: לְהַעֲלוֹת
  choice: kutoa
  rationale: Hifili ya עלה pamoja na kitu cha dhabihu humaanisha kuitoa dhabihu; kwa Kiswahili, “kutoa sadaka” ni usemi wa kawaida na wazi.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: עֹלָה ni istilahi maalumu ya dhabihu iliyoteketezwa; tafsiri hii ni wazi na imezoeleka katika Kiswahili.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: הִנֵּה huleta msisitizo, uhai wa simulizi, na hali ya kutokea kwa ghafla; “tazama” huhifadhi kazi hiyo.
- source_word: בָּא
  choice: akaja
  rationale: Kitenzi hiki kinaripoti kuwasili kwa Samueli kwa namna ya moja kwa moja katika mfululizo wa simulizi.
- source_word: וַיֵּצֵא
  choice: akatoka
  rationale: Huhifadhi wazo la kutoka mahali alikokuwa ili kwenda kukutana na Samueli.
- source_word: לִקְרָאתוֹ
  choice: kwenda kumlaki
  rationale: Ni usemi wa Kiebrania wa kwenda kuelekea kwa mtu kwa kusudi la kukutana naye; “kumlaki” ni Kiswahili cha asili katika muktadha huu.
- source_word: לְבָרֲכוֹ
  choice: ili ambariki
  rationale: Kitenzi ברך kwa maana ya msingi ni “bariki.” Katika mazingira ya kukutana kinaweza kutumika kwa maana ya kutoa salamu rasmi, lakini tafsiri kuu huhifadhi maana yake ya kileksika na tanbihi huonyesha uwezekano mwingine.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Ikawa” na “tazama” zimetumiwa kuhifadhi mtiririko na msisitizo wa Kiebrania bila kufanya sentensi iwe nzito. Alama ya tanbihi imewekwa baada ya “ambariki,” neno linalohusika na tofauti ya kileksika.
