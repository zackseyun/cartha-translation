  yaml_path: translation/ot/1_samuel/013/009.yaml
  text: So Saul said[b][a], “Bring near to me the burnt offering and the peace offerings.” And he offered up the burnt offering.
translation:
  language: sw
  text: Basi Sauli akasema, “Nileteeni sadaka ya kuteketezwa na sadaka za amani[a].” Kisha akatoa sadaka ya kuteketezwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka za ushirika.” Neno la Kiebrania linaweza kumaanisha sadaka zinazohusishwa na amani, ustawi, au ushirika wa pamoja.
    reason: lexical_alternative
  - marker: b
    text: Kishazi cha mwisho kinaeleweka kwa kawaida kuwa Sauli alitoa sadaka ya kuteketezwa; wengine hukielewa kwa njia isiyo ya moja kwa moja, kwamba aliagiza sadaka hiyo itolewe.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Basi Sauli akasema
  rationale: Kiunganishi cha simulizi kinaendeleza mfululizo wa matukio; “Basi” ni cha kawaida katika Kiswahili cha simulizi na kinaonyesha hatua inayofuata.
- source_word: הַגִּשׁוּ אֵלַי
  choice: Nileteeni
  rationale: Kauli ya kuamuru katika Hiphil ya נגשׁ humaanisha kuleta karibu au kuwasilisha. “Nileteeni” ni Kiswahili cha asili kinachohifadhi wazo la vitu kuletwa kwa Sauli.
- source_word: הָעֹלָה
  choice: sadaka ya kuteketezwa
  rationale: עֹלָה ni istilahi ya kawaida ya sadaka iliyoteketezwa yote; tafsiri hii ni wazi na inayotambulika katika Kiswahili cha Biblia.
- source_word: וְהַשְּׁלָמִים
  choice: na sadaka za amani
  rationale: שְׁלָמִים ni sadaka zinazohusishwa na amani au ustawi. “Sadaka za amani” inabaki karibu na istilahi ya Kiebrania, huku maana nyingine ikielezwa katika tanbihi.
- source_word: וַיַּעַל
  choice: Kisha yeye mwenyewe akatoa
  rationale: Katika muktadha wa dhabihu, עלה humaanisha kutoa sadaka. “Yeye mwenyewe” huweka wazi usomaji wa kawaida kwamba Sauli ndiye aliyetenda kitendo hicho, bila kuficha uwezekano mwingine unaotajwa katika tanbihi.
theological_decisions:
- issue: Mtendaji wa kitendo katika kishazi cha mwisho
  choice: Sauli mwenyewe alitoa sadaka ya kuteketezwa
  alternative: Sauli aliagiza au alisababisha sadaka itolewe
  rationale: Kitenzi cha umoja kinaendeleza kwa kawaida Sauli kama kiima kilichotangulia, na muktadha wa kukemewa kwake unaunga mkono utendaji wake wa moja kwa moja. Hata hivyo, matumizi yasiyo ya moja kwa moja yanawezekana katika lugha ya utoaji wa dhabihu, kwa hiyo yamehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Istilahi za dhabihu zimehifadhiwa kwa usahihi bila kufanya sentensi iwe ngumu kupita kiasi.
