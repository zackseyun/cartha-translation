base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/012.yaml
  text: So I said[a], ‘Now the Philistines will come down against me at Gilgal[b], and I have not sought the favor of Yahweh.’ So I forced myself and offered up the burnt offering.
translation:
  language: sw
  text: Basi nikasema, “Sasa Wafilisti watashuka dhidi yangu huko Gilgali, nami sijatafuta kibali cha Yahwe[a].” Kwa hiyo nikajilazimisha[b] kutoa sadaka ya kuteketezwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “sijauomba uso wa Yahwe,” yaani, sijamwomba Yahwe anipe kibali chake.'
    reason: lexical_alternative
  - marker: b
    text: Au “nikajizuia.” Kitenzi cha Kiebrania kinaweza kumaanisha kujizuia au kujitawala; hapa yaelekea Sauli anamaanisha kwamba alijilazimisha kuchukua hatua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Basi nikasema
  rationale: Kiunganishi cha masimulizi kinaendeleza maelezo ya Sauli na hapa pia kinaonyesha hitimisho alilofikia kutokana na hali iliyokuwapo.
- source_word: עַתָּה
  choice: Sasa
  rationale: Huonyesha uharaka wa wakati katika hoja ya Sauli kwa lugha ya kawaida na ya moja kwa moja.
- source_word: יֵרְדוּ
  choice: watashuka
  rationale: Hudumisha maana ya msingi ya kushuka, inayofaa kwa mwendo wa kijeshi kuelekea Gilgali.
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la kundi hili la watu katika Kiswahili cha Biblia.
- source_word: אֵלַי
  choice: kunishambulia
  rationale: Ingawa kihalisi ni ‘kwangu,’ muktadha wa kijeshi unaonyesha mwendo wa uadui dhidi ya Sauli; ‘kunishambulia’ huwasilisha maana hiyo kwa kawaida.
- source_word: הַגִּלְגָּל
  choice: huko Gilgali
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili, na ‘huko’ huonyesha mahali pa pambano lililotarajiwa.
- source_word: וּפְנֵי יְהוָה לֹא חִלִּיתִי
  choice: nami sijatafuta kibali cha Yahwe
  rationale: Nahau ya Kiebrania ya kuomba uso wa mtu humaanisha kumwomba au kutafuta kibali chake. Tafsiri hii inaeleweka kwa urahisi huku tanbihi ikihifadhi picha halisi ya ‘uso.’
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kuwa ‘Yahwe’ badala ya kubadilishwa na cheo.
- source_word: וָאֶתְאַפַּק
  choice: Kwa hiyo nikajilazimisha
  rationale: Kitenzi kinaweza kueleza kujizuia au kujitawala; katika muktadha huu Sauli anadai kwamba alijisukuma kufanya jambo alilosita kulifanya.
- source_word: וָאַעֲלֶה הָעֹלָה
  choice: kutoa sadaka ya kuteketezwa
  rationale: Hii ni lugha ya kawaida ya Kiswahili kwa tendo la kutoa עֹלָה, sadaka iliyoteketezwa kabisa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu mwenyewe. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha na cheo.
- issue: Dai la Sauli kwamba alijilazimisha
  choice: nikajilazimisha
  alternative: nikajizuia
  rationale: Muktadha unaonyesha Sauli akijitetea kwamba shinikizo la hali lilimfanya atoe sadaka. Hata hivyo, maana nyingine ya kitenzi—kujizuia au kujitawala—imehifadhiwa katika tanbihi bila kuondoa mvutano wa maelezo yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Sentensi imeweka mtiririko wa maelezo ya Sauli, istilahi ya kawaida ya dhabihu, na jina ‘Yahwe.’ Alama za tanbihi zimewekwa kwenye vifungu vinavyohusika moja kwa moja, badala ya kufuata nafasi zisizolingana katika safu ya mashauriano ya Kiingereza.
