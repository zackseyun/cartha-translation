  text: He waited seven days[a], until the appointed time that Samuel had set, but Samuel did not come to Gilgal[b], and the people were scattering from him.
translation:
  language: sw
  text: Akangoja siku saba[a], mpaka wakati uliowekwa na Samueli. Lakini Samueli hakufika Gilgali, nao watu walikuwa wakitawanyika kutoka kwake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi wakati maalumu ambao Samueli alikuwa ameuweka.” Kishazi cha Kiebrania kimefupishwa; tafsiri hutoa wazi maana inayodokezwa.
    reason: lexical_alternative
  - marker: b
    text: Yaani, watu walikuwa wakiondoka kwa Sauli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיחֶל
  choice: Akangoja
  rationale: Katika muktadha huu kitenzi kinaonyesha kungoja kwa muda, si kutumaini kwa maana ya jumla.
- source_word: שִׁבְעַת יָמִים
  choice: siku saba
  rationale: Huu ni usemi wa moja kwa moja unaoonyesha muda ambao Sauli alingoja.
- source_word: לַמּוֹעֵד
  choice: mpaka wakati uliowekwa
  rationale: Katika muktadha, מוֹעֵד ni wakati maalumu uliokuwa umepangwa; ‘mpaka’ huonyesha kikomo cha muda wa kungoja.
- source_word: אֲשֶׁר שְׁמוּאֵל
  choice: uliowekwa na Samueli
  rationale: Kishazi cha Kiebrania kimefupishwa na hakina kitenzi kilichotajwa wazi. Tafsiri hii huwasilisha maana inayodokezwa bila kuongeza maelezo yasiyo ya lazima.
- source_word: וְלֹא בָא שְׁמוּאֵל הַגִּלְגָּל
  choice: Lakini Samueli hakufika Gilgali
  rationale: ‘Lakini’ huonyesha tofauti ya kimuktadha kati ya wakati uliotarajiwa na kutofika kwa Samueli; ‘hakufika’ ni Kiswahili cha kawaida kwa kuja mahali palipotajwa.
- source_word: וַיָּפֶץ הָעָם
  choice: watu walikuwa wakitawanyika
  rationale: Muundo endelevu unaonyesha kwamba watu walikuwa katika hatua ya kusambaratika, si lazima tukio moja lililokamilika ghafla.
- source_word: מֵעָלָיו
  choice: na kumwacha
  rationale: Kiwakilishi kinamrejelea Sauli. Katika Kiswahili, ‘kumwacha’ huwasilisha kwa kawaida wazo la watu kutawanyika na kuondoka kwake.
