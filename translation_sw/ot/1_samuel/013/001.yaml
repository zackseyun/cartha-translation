  text: Saul was one year old when he became king[a], and he reigned two years over Israel.
translation:
  language: sw
  text: Sauli alikuwa na umri wa mwaka mmoja alipoanza kutawala[a], naye akatawala Israeli kwa miaka miwili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maandishi ya Kiebrania hapa ni magumu na huenda yana upungufu. Kwa tafsiri halisi yanasema, “Sauli alikuwa mwana wa mwaka mmoja alipoanza kutawala, naye akatawala Israeli kwa miaka miwili.” Baadhi ya mashahidi wa kale na mapendekezo ya baadaye huweka namba kubwa zaidi, kama vile “thelathini” kwa umri wa Sauli na “arobaini na miwili” kwa muda wa utawala wake.
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שָׁנָה
  choice: alikuwa na umri wa mwaka mmoja
  rationale: Nahau ya Kiebrania בן שנה kwa kawaida humaanisha kuwa na umri wa mwaka mmoja. Tafsiri hii inahifadhi maneno ya maandishi ya Kimasoreti bila kuyarekebisha, ingawa hapa yanaleta tatizo dhahiri la kihistoria.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: בְּמָלְכוֹ
  choice: alipoanza kuwa mfalme
  rationale: Muundo huu unaonyesha wakati Sauli alipoingia katika ufalme; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: וּשְׁתֵּי שָׁנִים
  choice: naye ... kwa miaka miwili
  rationale: Inatafsiri moja kwa moja kiunganishi na muda unaotajwa katika maandishi ya Kimasoreti.
- source_word: מָלַךְ
  choice: akatawala
  rationale: Kitenzi מלך humaanisha kutawala au kuwa mfalme; ‘akatawala’ ni usemi wa asili katika taarifa hii ya kifalme.
- source_word: עַל יִשְׂרָאֵל
  choice: Israeli
  rationale: Pamoja na kitenzi ‘kutawala,’ Kiswahili cha kawaida hakihitaji kihusishi kinacholingana moja kwa moja na על; maana ya kutawala juu ya Israeli inabaki wazi.
theological_decisions:
- issue: Taarifa ya miaka ya utawala iliyo ngumu au yenye upungufu katika maandishi ya Kimasoreti
  choice: Kuhifadhi maneno ya Kimasoreti katika matini kuu bila kuongeza namba kwa kukisia
  alternative: Sauli alikuwa na umri wa miaka thelathini alipoanza kuwa mfalme, naye akatawala Israeli kwa miaka arobaini na miwili; au matini yenye mapengo katika namba
  rationale: Maandishi ya Kiebrania yaliyopokelewa ni magumu na huenda yana upungufu, lakini chanzo kilichotolewa ni WLC. Kwa uwazi na uaminifu kwa chanzo, matini kuu huhifadhi namba zilizopo, huku maelezo ya chini yakitaja tatizo na mapendekezo mengine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Matini kuu ni ya asili badala ya kuwa tafsiri ya neno kwa neno isiyo ya kawaida; ugumu wa maandishi umewekwa wazi katika tanbihi.
