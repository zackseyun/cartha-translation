base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/020.yaml
  text: So all Israel went down to the Philistines[a], each man to sharpen his plowshare, his mattock, his axe, and his sickle.
translation:
  language: sw
  text: Basi, Waisraeli wote walishuka kwa Wafilisti, kila mmoja kunoa ncha yake ya plau, sululu yake, shoka lake, na mundu wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “sehemu yake ya plau,” au zana nyingine ya kulimia; maana ya neno la Kiebrania haijulikani kwa hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: walishuka kwenda
  rationale: Huhifadhi maana ya mwendo wa kuelekea chini ya kitenzi ירד huku ikitoa Kiswahili cha kawaida katika simulizi.
- source_word: כָל יִשְׂרָאֵל
  choice: Waisraeli wote
  rationale: Ni namna ya asili ya Kiswahili ya kuwasilisha usemi wa kijumla ‘Israeli wote’ bila kupoteza maana ya taifa zima.
- source_word: הַפְּלִשְׁתִּים
  choice: kwa Wafilisti
  rationale: Kiebrania kinawataja watu, si nchi yao wala wahunzi wao; tafsiri hii haiongezi habari ambayo haijasemwa wazi.
- source_word: לִלְטוֹשׁ
  choice: kunoa
  rationale: Katika muktadha wa zana za chuma, לטש inamaanisha kuzitia makali.
- source_word: אִישׁ
  choice: kila mtu
  rationale: Huwasilisha matumizi ya nomino ya umoja yenye maana ya kugawa tendo kwa kila mmoja baada ya kiima cha kijumla.
- source_word: מַחֲרַשְׁתּוֹ
  choice: jembe lake la plau
  rationale: Neno linaelekea kumaanisha sehemu ya plau inayochimba udongo; usemi huu unaeleweka kwa wasomaji wa Afrika Mashariki na unaonyesha kuwa ni zana ya kulimia kwa plau.
- source_word: אֵתוֹ
  choice: sululu yake
  rationale: את ni zana ya kuchimbia au kutifulia udongo; ‘sululu’ ni jina la kawaida la Kiswahili kwa zana hiyo nzito.
- source_word: קַרְדֻּמּוֹ
  choice: shoka lake
  rationale: Neno hili kwa kawaida hutaja zana ya kukatia inayofanana na shoka.
- source_word: מַחֲרֵשָׁתוֹ
  choice: mundu wake
  rationale: Utambulisho wa zana hii hauna uhakika. ‘Mundu’ unafaa katika orodha ya zana zinazohitaji kunolewa na huepuka kurudia zana ya kwanza, huku tanbihi ikihifadhi uwezekano mwingine.
