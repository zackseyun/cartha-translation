translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imehifadhi mwelekeo wa ‘walishuka,’ mlengwa akiwa Wafilisti wenyewe, na mgawanyo wa tendo kwa ‘kila mtu.’ Alama ya tanbihi imewekwa baada ya zana ya mwisho kwa sababu ndiyo inayotokana na neno la Kiebrania lisilo na uhakika.
