translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Majina ya zana yametolewa kwa maneno yanayotambulika kwa urahisi, huku kutokuwa na uhakika kwa maneno adimu ya Kiebrania kukihifadhiwa katika tanbihi.
