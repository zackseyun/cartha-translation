base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/021.yaml
  text: And the charge was a pim for the plowshares[a], for the mattocks, for the three-pronged forks, and for the axes[b], and for setting the goads.
translation:
  language: sw
  text: Ada ilikuwa pimu moja[a][b] kwa kunoa ncha za plau, sululu, uma zenye meno matatu, na mashoka, na kwa kuweka sawa kichokoo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pimu ilikuwa kipimo kidogo cha uzito au kiasi cha malipo, ambacho kwa kawaida hudhaniwa kuwa karibu theluthi mbili za shekeli.
    reason: cultural_note
  - marker: b
    text: Au, “Kunoa kuligharimu pimu moja.” Maneno ya Kiebrania hapa ni magumu; huenda mstari huu unaeleza gharama iliyotozwa au tendo lenyewe la kunoa.
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְּצִירָה
  choice: gharama ya kunoa
  rationale: Nomino hii adimu inaweza kumaanisha malipo yaliyotozwa au tendo la kunoa. Katika muktadha huu, פִים inaonekana kutaja kiasi cha malipo, hivyo tafsiri kuu inatumia “gharama ya kunoa,” huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: פִים
  choice: pimu moja
  rationale: Jina la kipimo au malipo limeendelezwa kwa unukuzi kwa sababu thamani yake si dhahiri kwa msomaji wa kisasa; maelezo ya kiasi kinachokadiriwa yametolewa katika tanbihi.
- source_word: מַחֲרֵשֹׁת
  choice: ncha za plau
  rationale: Neno linarejelea sehemu za chuma za plau zinazokata udongo na kuhitaji kunolewa. “Ncha za plau” ni wazi zaidi katika Kiswahili cha sasa kuliko kutumia “majembe,” ambalo linaweza kueleweka kama hoes.
- source_word: אֵתִים
  choice: sululu
  rationale: Neno linataja zana za kuchimbia au kukatakata udongo. “Sululu” linafaa kwa zana nzito zinazohitaji kunolewa, ingawa utambulisho kamili wa zana hiyo hauna uhakika.
- source_word: שְׁלֹשׁ קִלְּשׁוֹן
  choice: uma zenye meno matatu
  rationale: Usemi huu unaonyesha zana yenye ncha au meno matatu; tafsiri hii inahifadhi picha hiyo kwa lugha ya kawaida na iliyo wazi.
- source_word: קַּרְדֻּמִּים
  choice: mashoka
  rationale: Nomino hii kwa kawaida hutaja zana za kukatia. “Mashoka” ni tafsiri ya moja kwa moja, ingawa huenda baadhi ya zana hizo zilifanana na sepetu za kuchongea.
- source_word: לְהַצִּיב הַדָּרְבָן
  choice: ya kuweka sawa michokoo
  rationale: Kitenzi kinaweza kumaanisha kusimamisha, kurekebisha, au kurudisha katika hali inayofaa. “Kuweka sawa” kinahifadhi upana huo bila kudai kwamba tendo lilikuwa kunoa pekee.
