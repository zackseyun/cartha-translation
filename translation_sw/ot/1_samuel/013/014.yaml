  text: וְ/עַתָּ֖ה מַמְלַכְתְּ/ךָ֣ לֹא תָק֑וּם בִּקֵּשׁ֩ יְהוָ֨ה ל֜/וֹ אִ֣ישׁ כִּ/לְבָב֗/וֹ וַ/יְצַוֵּ֨/הוּ יְהוָ֤ה לְ/נָגִיד֙ עַל עַמּ֔/וֹ כִּ֚י לֹ֣א שָׁמַ֔רְתָּ אֵ֥ת אֲשֶֽׁר צִוְּ/ךָ֖ יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/014.yaml
  text: But now your kingdom will not endure[a]. Yahweh has sought for himself a man according to his own heart, and Yahweh has appointed him ruler over his people[c][b], because you have not kept what Yahweh commanded you.
translation:
  language: sw
  text: Lakini sasa ufalme wako hautadumu.[a] Yahwe amejitafutia mtu kulingana na moyo wake,[b] naye Yahwe amemteua kuwa mtawala juu ya watu wake,[c] kwa sababu hukushika yale ambayo Yahwe alikuamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hautasimama.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi, “kulingana na moyo wake.” Kiwakilishi hicho kinaeleweka kwa kawaida kumrejelea Yahwe.
    reason: lexical_and_referential_clarification
  - marker: c
    text: Yaani, watu wa Yahwe.
    reason: referent_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: Lakini sasa
  rationale: Katika muktadha huu maneno hayo yanaonyesha badiliko kali kutoka hali ya awali ya Sauli kwenda hukumu inayotangazwa.
- source_word: מַמְלַכְתְּךָ לֹא תָקוּם
  choice: ufalme wako hautadumu
  rationale: Ingawa kitenzi תָקוּם kwa msingi humaanisha ‘kusimama,’ hapa kinahusu ufalme wa Sauli kutothibitika au kutoendelea.
- source_word: בִּקֵּשׁ יְהוָה לוֹ
  choice: Yahwe amejitafutia
  rationale: Muundo wa kujirejelea katika ‘amejitafutia’ unaonyesha kwamba Yahwe anamtafuta mtu kwa ajili ya kusudi lake mwenyewe, huku wakati timilifu wa Kiebrania ukihifadhiwa.
- source_word: אִישׁ כִּלְבָבוֹ
  choice: mtu kulingana na moyo wake
  rationale: Tafsiri hii inahifadhi taswira ya Kiebrania bila kuipanua kuwa maelezo ya tabia au utiifu ambayo hayajasemwa wazi katika mstari huu.
- source_word: וַיְצַוֵּהוּ יְהוָה לְנָגִיד
  choice: naye Yahwe amemteua kuwa mtawala
  rationale: Katika muundo huu צוה pamoja na לְנָגִיד ina maana ya kumweka au kumteua mtu katika nafasi ya uongozi, si kumpa amri tu.
- source_word: עַל עַמּוֹ
  choice: juu ya watu wake
  rationale: Kiwakilishi kinarejelea kwa kawaida Yahwe; tafsiri inakihifadhi badala ya kurudia jina.
- source_word: כִּי לֹא שָׁמַרְתָּ אֵת אֲשֶׁר צִוְּךָ יְהוָה
  choice: kwa sababu hukutii jambo ambalo Yahwe alikuamuru
  rationale: שׁמר inapohusishwa na amri hutoa maana ya kuitunza kwa kuitii. Kiswahili cha ‘kukutii jambo alilokuamuru’ ni cha kawaida na kinaeleza sababu ya hukumu kwa uwazi.
theological_decisions:
- issue: Kirejelewa cha kiwakilishi katika כִּלְבָבוֹ
  choice: Maneno ‘moyo wake’ yanaeleweka kwa kawaida kumrejelea Yahwe.
  alternative: Kiwakilishi kinaweza kuchukuliwa kuwa kinamhusu mtu anayetafutwa.
  rationale: Muundo na muktadha vinaelekeza zaidi kwa Yahwe, lakini tafsiri imehifadhi kiwakilishi cha Kiebrania bila kuongeza maelezo kama ‘atakayefanya mapenzi yake yote,’ ili kutofuta kabisa mvutano uliopo katika usemi.
- issue: Maana ya נָגִיד
  choice: mtawala
  alternative: kiongozi; mkuu
  rationale: Neno hili hapa linaonyesha mtu aliyewekwa katika mamlaka juu ya watu, bila kulifanya kuwa cheo maalumu cha kifalme au cha kimasiya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Amejitafutia’ na ‘amemteua kuwa mtawala’ ni misemo ya asili inayowasilisha kwa uwazi kazi za miundo ya Kiebrania. Taswira ya ‘moyo wake’ imehifadhiwa ili kutoingiza ufafanuzi wa kimadhehebu.
