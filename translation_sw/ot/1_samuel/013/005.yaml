source:
  edition: WLC
  text: וּ/פְלִשְׁתִּ֞ים נֶאֶסְפ֣וּ לְ/הִלָּחֵ֣ם עִם יִשְׂרָאֵ֗ל שְׁלֹשִׁ֨ים אֶ֤לֶף רֶ֨כֶב֙ וְ/שֵׁ֤שֶׁת אֲלָפִים֙ פָּרָשִׁ֔ים וְ/עָ֕ם כַּ/ח֛וֹל אֲשֶׁ֥ר עַל שְׂפַֽת הַ/יָּ֖ם לָ/רֹ֑ב וַֽ/יַּעֲלוּ֙ וַ/יַּחֲנ֣וּ בְ/מִכְמָ֔שׂ קִדְמַ֖ת בֵּ֥ית אָֽוֶן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/005.yaml
  text: 'And the Philistines gathered to fight against Israel: thirty thousand chariots[a], and six thousand horsemen, and troops as numerous as the sand that is on the seashore. They went up and camped at Mikmash, east of Beth-aven.'
translation:
  language: sw
  text: 'Wafilisti wakakusanyika ili kupigana na Israeli: magari ya vita elfu thelathini[a], wapanda farasi elfu sita, na watu wengi, kama mchanga ulio ufukweni mwa bahari. Wakapanda na kupiga kambi Mikmashi, mashariki mwa Beth-Aveni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “magari ya vita elfu thelathini.” Baadhi ya wafasiri na mashahidi wa kale wamependekeza idadi ndogo zaidi (kwa mfano, “elfu tatu”), kwa kuwa elfu thelathini inaonekana kuwa idadi kubwa isiyo ya kawaida katika muktadha huu; hata hivyo, matini kuu inafuata maandishi ya Kiebrania ya Kimasoreti.
    reason: textual_variant
lexical_decisions:
- source_word: נֶאֶסְפוּ
  choice: wakakusanyika
  rationale: Kauli ya Niphal ya אסף hapa inaeleza kukusanyika kwa ajili ya vita; “wakakusanyika” ni ya kawaida na hudumisha maana hiyo.
- source_word: לְהִלָּחֵם עִם
  choice: ili kupigana na
  rationale: Katika muktadha huu, kishazi hiki kinaonyesha mapambano dhidi ya Israeli; Kiswahili hutumia kwa kawaida “kupigana na.”
- source_word: שְׁלֹשִׁים אֶלֶף רֶכֶב
  choice: magari ya vita elfu thelathini
  rationale: רֶכֶב hapa inarejelea magari ya vita au kikosi chake; tafsiri hii hufuata kwa uwazi maandishi ya Kimasoreti huku tofauti ya idadi ikielezwa katika tanbihi.
- source_word: שֵׁשֶׁת אֲלָפִים פָּרָשִׁים
  choice: wapanda farasi elfu sita
  rationale: פָּרָשִׁים ni askari waliopanda farasi; “wapanda farasi” ni Kiswahili sanifu, wazi, na sahihi.
- source_word: וְעָם
  choice: na wanajeshi
  rationale: Ingawa עָם kwa msingi ni “watu,” hapa muktadha wa vita unaonyesha jeshi au vikosi; “wanajeshi” hutoa maana hiyo kwa uwazi.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: wengi kama mchanga ulio kwenye ufukwe wa bahari
  rationale: Hii huhifadhi tashbihi ya Kiebrania ya umati usiohesabika katika Kiswahili cha kawaida na chenye hadhi.
- source_word: וַיַּעֲלוּ
  choice: wakapanda
  rationale: עלה ni kitenzi cha kuelekea juu; “wakapanda” huhifadhi mwelekeo wa simulizi bila kuongeza wazo la kijeshi lisilotajwa wazi.
- source_word: וַיַּחֲנוּ
  choice: kupiga kambi
  rationale: חנה humaanisha kuweka au kupiga kambi; usemi huu ni wa kawaida katika Kiswahili cha sasa.
- source_word: בְמִכְמָשׂ
  choice: huko Mikmashi
  rationale: Jina la mahali limetoholewa kama “Mikmashi,” na “huko” linafaa kwa mahali walikopiga kambi.
- source_word: קִדְמַת בֵּית אָוֶן
  choice: mashariki mwa Beth-Aveni
  rationale: קִדְמַת hapa inaonyesha upande wa mashariki kuhusiana na Beth-Aveni; tafsiri hii ni wazi kijiografia.
