  yaml_path: translation/ot/1_samuel/013/007.yaml
  text: And Hebrews crossed over the Jordan into the land of Gad and Gilead[a]. But Saul was still at Gilgal[b], and all the people trembled behind him.
translation:
  language: sw
  text: Nao Waebrania wakavuka Yordani na kuingia katika nchi ya Gadi na Gileadi.[a] Lakini Sauli alikuwa bado huko Gilgali, na watu wote wakatetemeka nyuma yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli”; maandishi ya Kiebrania yanasema “Waebrania,” jina ambalo hapa huenda linawatambulisha kwa namna ya kikabila zaidi.
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri nyingine: “watu wote waliokuwa wakimfuata walitetemeka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִים
  choice: Waebrania
  rationale: Huhifadhi jina la kikabila lililo wazi katika Kiebrania bila kulifasiri moja kwa moja kuwa ‘Waisraeli’.
- source_word: עָבְרוּ אֶת הַיַּרְדֵּן
  choice: wakavuka Yordani
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kitendo cha kuvuka Mto Yordani; jina ‘Yordani’ linatosha katika muktadha huu.
- source_word: אֶרֶץ גָּד וְגִלְעָד
  choice: na kuingia katika nchi ya Gadi na Gileadi
  rationale: Kiunganishi ‘na kuingia’ huonyesha kwamba walivuka kuelekea eneo hilo, huku ‘nchi’ ikihifadhi maana ya kijiografia ya אֶרֶץ.
- source_word: עוֹדֶנּוּ
  choice: alikuwa bado
  rationale: Huwasilisha hali ya kuendelea kuwepo kwa Sauli mahali hapo.
- source_word: בַגִּלְגָּל
  choice: huko Gilgali
  rationale: ‘Huko’ ni ya asili kwa kurejelea mahali palipotajwa, na Gilgali ni umbo la jina linaloeleweka katika Kiswahili cha Biblia.
- source_word: חָרְדוּ
  choice: walitetemeka kwa hofu
  rationale: Huhifadhi taswira halisi ya kutetemeka na pia huweka wazi kwamba sababu yake ni hofu.
- source_word: אַחֲרָיו
  choice: waliokuwa wakimfuata
  rationale: Katika muktadha wa watu waliokuwa pamoja na Sauli, maana ya ufuasi ni ya asili zaidi katika Kiswahili; tanbihi huhifadhi uwezekano wa taswira ya mahali ‘nyuma yake’.
