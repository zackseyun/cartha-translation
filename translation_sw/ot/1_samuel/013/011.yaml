  yaml_path: translation/ot/1_samuel/013/011.yaml
  text: Then Samuel said[a], “What have you done?” And Saul said, “Because I saw that the people were scattering from me, and you had not come at the appointed time[b], and the Philistines were gathering at Michmash,”
translation:
  language: sw
  text: Ndipo Samweli akasema, “Umefanya nini?” Sauli akasema, “Kwa sababu niliona kwamba watu walikuwa wakitawanyika kutoka kwangu, nawe hukuja kwa wakati uliowekwa[a], na Wafilisti walikuwa wakikusanyika katika Mikmashi,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya karibu, “kwa wakati uliowekwa wa siku”; huenda hii inarejelea kipindi walichokuwa wamekubaliana hapo awali.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: Umefanya nini?
  rationale: Kauli hii ya Kiswahili inaleta kwa kawaida swali kali la Samweli kuhusu tendo lililokwisha kufanywa na ambalo matokeo yake bado yapo.
- source_word: כִּי רָאִיתִי כִּי
  choice: Niliona kwamba
  rationale: כִּי ya kwanza inaanzisha maelezo ya Sauli, lakini katika Kiswahili sababu hiyo inaeleweka vizuri bila kuongeza ‘kwa sababu’ kabla ya ‘niliona’; כִּי ya pili imetafsiriwa ‘kwamba.’
- source_word: נָפַץ הָעָם מֵעָלַי
  choice: watu walikuwa wakitawanyika na kuniacha
  rationale: נָפַץ hapa inaonyesha watu wakitawanyika, na מֵעָלַי inaonyesha walikuwa wakiondoka kwa Sauli; ‘na kuniacha’ huwasilisha wazo hilo kwa Kiswahili cha kawaida.
- source_word: לֹא בָאתָ
  choice: hukuja
  rationale: Ni namna ya kawaida na ya moja kwa moja ya kueleza kwamba Samweli hakufika kama alivyotarajiwa.
- source_word: לְמוֹעֵד הַיָּמִים
  choice: kwa wakati uliowekwa
  rationale: Tafsiri hii inawasilisha muda maalumu uliokuwa umekubaliwa bila kulazimisha muundo usio wa kawaida wa Kiebrania, ‘wakati uliowekwa wa siku.’
- source_word: נֶאֱסָפִים
  choice: walikuwa wakikusanyika
  rationale: Kitenzi kishirikishi cha Nifali kinaonyesha tendo lililokuwa likiendelea au hali iliyokuwa ikijengeka.
- source_word: מִכְמָשׂ
  choice: Mikmashi
  rationale: Unukuzi unaofaa kwa matamshi na tahajia ya Kiswahili ya jina la mahali.
