  text: וַ/יֵּצֵ֧א הַ/מַּשְׁחִ֛ית מִ/מַּחֲנֵ֥ה פְלִשְׁתִּ֖ים שְׁלֹשָׁ֣ה רָאשִׁ֑ים הָ/רֹ֨אשׁ אֶחָ֥ד יִפְנֶ֛ה אֶל דֶּ֥רֶךְ עָפְרָ֖ה אֶל אֶ֥רֶץ שׁוּעָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/017.yaml
  text: And raiders came out from the camp of the Philistines in three companies[a]. One company turned toward the road to Ophrah[b], toward the land of Shual.
translation:
  language: sw
  text: Nao wavamizi wakatoka katika kambi ya Wafilisti wakiwa vikosi vitatu.[a] Kikosi kimoja kikaelekea kwenye njia ya Ofra, kuelekea nchi ya Shuali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania ni “vichwa vitatu,” na baadaye “kichwa kimoja”; hii ni nahau inayomaanisha migawanyiko au vikosi vya kijeshi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׁחִית
  choice: wavamizi
  rationale: Nomino ya umoja yenye kibainishi imetumiwa kwa maana ya pamoja kuhusu kikosi cha uharibifu kilichotoka kambini; “wavamizi” ni Kiswahili cha kawaida kinachofaa muktadha wa mashambulizi ya kijeshi.
- source_word: שְׁלֹשָׁה רָאשִׁים / הָרֹאשׁ אֶחָד
  choice: vikosi vitatu / kikosi kimoja
  rationale: Kiebrania halisi ni “vichwa vitatu / kichwa kimoja,” nahau inayotaja migawanyiko au makundi ya kijeshi. “Vikosi” hutoa maana hiyo kwa uwazi na kudumisha ulinganifu wa vifungu.
- source_word: יִפְנֶה
  choice: kikaelekea
  rationale: Kitenzi kina maana ya kugeuka au kuelekea upande fulani; hapa kinaeleza mwelekeo uliochukuliwa na kikosi.
- source_word: דֶּרֶךְ עָפְרָה
  choice: njia ya Ofra
  rationale: דֶּרֶךְ ni njia au barabara; muundo huu wa Kiswahili unaeleza njia inayoelekea Ofra bila kuongeza uhakika usio katika chanzo.
- source_word: אֶרֶץ שׁוּעָל
  choice: nchi ya Shuali
  rationale: אֶרֶץ inaweza kuwa nchi, eneo, au sehemu ya nchi; “nchi ya Shuali” ni usemi wazi wa jina la eneo.
- source_word: פְלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la kundi hili la watu.
- source_word: עָפְרָה
  choice: Ofra
  rationale: Jina la mahali limetoholewa kwa tahajia ya Kiswahili.
- source_word: שׁוּעָל
  choice: Shuali
  rationale: Jina la eneo limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
theological_decisions: []
