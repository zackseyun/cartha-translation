  text: And a garrison of the Philistines went out to the pass of Michmash[a].
translation:
  language: sw
  text: Kikosi cha Wafilisti kikatoka kwenda kwenye njia ya kupita ya Mikmashi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kikosi cha Wafilisti kilichowekwa mahali kikatoka kwenda kwenye kivuko cha Mikmashi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: kikatoka kwenda
  rationale: Kitenzi יצא kinaonyesha kutoka au kwenda nje; muundo huu wa Kiswahili unaendeleza simulizi na unaweka wazi mwendo kuelekea mahali palipotajwa bila kuongeza maana ya kijeshi.
- source_word: מַצַּב
  choice: kikosi
  rationale: Katika muktadha huu wa kijeshi, neno hili linaweza kumaanisha jeshi lililowekwa mahali fulani au kituo chake. “Kikosi” ni lugha ya kawaida na huhifadhi uwezekano kwamba kinachotoka ni kundi la askari.
- source_word: פְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Hili ndilo jina la kawaida la Kiswahili la kundi hili la watu; uhusiano wa umilikaji unaelezwa kwa “cha Wafilisti.”
- source_word: אֶל
  choice: kwenda kwenye
  rationale: Kihusishi kinaonyesha mwelekeo; “kwenda kwenye” ni cha kawaida katika Kiswahili na hakiongezi dhana ya kushambulia.
- source_word: מַעֲבַר
  choice: njia ya kupita
  rationale: Neno lina maana ya mahali pa kuvuka au kupita. “Njia ya kupita” ni ya asili na inaeleweka kwa urahisi, huku tanbihi ikihifadhi uwezekano wa “kivuko.”
- source_word: מִכְמָשׂ
  choice: Mikmashi
  rationale: Unukuzi huu unafuata kwa ukaribu matamshi ya jina la Kiebrania na muundo wa majina unaosomeka kwa Kiswahili.
