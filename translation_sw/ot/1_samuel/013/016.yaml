lexical_decisions:
- source_word: יֹשְׁבִים
  choice: walikuwa wakikaa
  rationale: Kitenzi hiki katika muktadha wa mahali humaanisha kukaa au kubaki mahali fulani, si tendo la kuketi tu. Usemi huu ni wa kawaida katika Kiswahili na unaonyesha hali iliyoendelea.
- source_word: הַנִּמְצָא עִמָּם
  choice: watu waliokuwa pamoja nao
  rationale: Ingawa muundo wa Kiebrania unasema kihalisi ‘watu waliopatikana pamoja nao,’ katika muktadha unawahusu wale waliokuwa bado pamoja na Sauli na Yonathani. Tafsiri ya kawaida imewekwa katika matini, huku maana halisi ikihifadhiwa katika tanbihi.
- source_word: בְּגֶבַע בִּנְיָמִן
  choice: Geba ya Benyamini
  rationale: Jina la mahali katika matini ya Kiebrania ni Geba, si Gibea. ‘Ya Benyamini’ linaonyesha eneo la kikabila ambalo mji huo ulikuwamo.
- source_word: חָנוּ
  choice: walikuwa wamepiga kambi
  rationale: חנה ni neno la kawaida la kijeshi linalomaanisha kupiga kambi. Muundo huu unaonyesha kuwa Wafilisti tayari walikuwa wameweka kambi yao.
- source_word: בְמִכְמָשׂ
  choice: huko Mikmashi
  rationale: Jina la mahali limetoholewa kuwa Mikmashi; ‘huko’ ni usemi wa kawaida wa Kiswahili unaoonyesha mahali pa kambi.
- source_word: וְ
  choice: nao
  rationale: Kiunganishi kinachotangulia kishazi cha Wafilisti kimetafsiriwa ‘nao’ ili kuendeleza simulizi na kuonyesha utofauti wa mahali walipokuwa pande hizo mbili, bila kuongeza alama ya wakati isiyokuwamo katika chanzo.
