base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/003.yaml
  text: Jonathan struck down the Philistine garrison that was at Geba[a], and the Philistines heard of it. Then Saul blew the ram's horn throughout all the land, saying[b], “Let the Hebrews hear!”
translation:
  language: sw
  text: Yonathani akakipiga kikosi cha Wafilisti kilichokuwa Geba[a], nao Wafilisti wakasikia habari hizo. Kisha Sauli akapuliza pembe ya kondoo dume[b] katika nchi yote, akisema, “Waebrania na wasikie!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “afisa” au “msimamizi wa Wafilisti.” Neno la Kiebrania linaweza kumaanisha afisa au kituo/kikosi cha kijeshi kilichowekwa mahali. Katika muktadha huu wa vita, maana ya kikosi cha kijeshi inafaa zaidi.
    reason: lexical_alternative
  - marker: b
    text: Au, “akapiga tarumbeta.” Neno la Kiebrania shofari humaanisha hasa pembe, kwa kawaida pembe ya kondoo dume.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ
  choice: akalishambulia
  rationale: Kitenzi נכה kina maana ya kupiga au kushambulia, mara nyingi kwa nguvu ya kuua au kushinda. Kwa kuwa kitu kinacholengwa hapa kinaweza kueleweka kuwa kikosi au kituo cha kijeshi, ‘akalishambulia’ ni cha asili na hakilazimishi maana ya kuua mtu mmoja.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: jeshi la Wafilisti
  rationale: Neno נְצִיב linaweza kumaanisha afisa au kikosi/kituo cha kijeshi kilichowekwa mahali. Muktadha wa vita unaunga mkono maana ya kikosi cha Wafilisti, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: בְּגֶבַע
  choice: huko Geba
  rationale: Geba ni jina la mahali; ‘huko’ hutaja eneo kwa Kiswahili cha kawaida bila kudai kwamba tukio lilifanyika ndani kabisa ya mji.
- source_word: וַיִּשְׁמְעוּ פְּלִשְׁתִּים
  choice: Wafilisti wakapata habari
  rationale: Kiebrania husema kihalisi ‘Wafilisti wakasikia.’ Katika muktadha huu, ‘wakapata habari’ huwasilisha kwa asili kwamba walisikia kuhusu shambulio hilo.
- source_word: תָּקַע בַּשּׁוֹפָר
  choice: akapiga baragumu ya pembe
  rationale: שׁוֹפָר ni chombo cha kupuliza kilichotengenezwa kwa pembe, kwa kawaida pembe ya kondoo dume. ‘Baragumu ya pembe’ hudumisha umbo lake la kitamaduni na kutofautisha na tarumbeta ya chuma.
- source_word: בְּכָל הָאָרֶץ
  choice: katika nchi yote
  rationale: הָאָרֶץ hapa humaanisha nchi au eneo husika, si dunia nzima. Usemi huu ni wa kawaida na unaonyesha kwamba tangazo lilienezwa kote.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Huu ni uwasilishaji wa moja kwa moja na wa kawaida wa neno linaloanzisha maneno yaliyonukuliwa.
- source_word: יִשְׁמְעוּ הָעִבְרִים
  choice: Waebrania na wasikie!
  rationale: Umbo la kitenzi lina nguvu ya amri au mwito wa tangazo. ‘Na wasikie’ huhifadhi nguvu hiyo, na ‘Waebrania’ hudumisha jina lililotumiwa katika chanzo badala ya kulibadili kuwa ‘Waisraeli.’
