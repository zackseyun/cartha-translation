  text: וְ/חָרָשׁ֙ לֹ֣א יִמָּצֵ֔א בְּ/כֹ֖ל אֶ֣רֶץ יִשְׂרָאֵ֑ל כִּֽי אמר פְלִשְׁתִּ֔ים פֶּ֚ן יַעֲשׂ֣וּ הָ/עִבְרִ֔ים חֶ֖רֶב א֥וֹ חֲנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/019.yaml
  text: No blacksmith could be found in all the land of Israel[a], because the Philistines said, “Otherwise the Hebrews will make swords or spears.”
translation:
  language: sw
  text: Hakupatikana mhunzi[a] hata mmoja katika nchi yote ya Israeli, kwa sababu Wafilisti walisema, “Waebrania wasije wakatengeneza upanga au mkuki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fundi.” Neno la Kiebrania linaweza kumaanisha fundi kwa ujumla, lakini hapa muktadha unaonyesha fundi wa metali.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרָשׁ
  choice: mhunzi
  rationale: Neno hili linaweza kumaanisha fundi kwa ujumla, lakini muktadha wa kutengeneza silaha na kunoa vyombo unaonyesha kwamba hapa anatajwa fundi wa metali.
- source_word: יִמָּצֵא
  choice: Hakupatikana ... hata mmoja
  rationale: Kauli ya Niphal inaeleza kutopatikana au kutokuwapo kwa mhunzi; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: בְּכֹל אֶרֶץ יִשְׂרָאֵל
  choice: katika nchi yote ya Israeli
  rationale: Huhifadhi maana ya eneo lote la Israeli kwa lugha ya kawaida yenye hadhi.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatanguliza sababu ya kutopatikana kwa wahunzi.
- source_word: אמר
  choice: walisema
  rationale: Wakati uliopita unafaa katika usimulizi huu; Kiswahili hakihitaji kuingiza wazi wakati timilifu uliopita.
- source_word: פֶּן
  choice: wasije waka-
  rationale: Muundo huu wa Kiswahili unaonyesha jambo ambalo Wafilisti walitaka kulizuia, sawa na maana ya tahadhari ya פֶּן.
- source_word: הָעִבְרִים
  choice: Waebrania
  rationale: Huhifadhi jina la kikundi lililotumiwa katika chanzo badala ya kulibadili kuwa ‘Waisraeli.’
- source_word: יַעֲשׂוּ
  choice: wakatengeneza
  rationale: Kitenzi hiki kinaeleza utengenezaji wa silaha na kinaungana kwa kawaida na muundo ‘wasije waka-.’
- source_word: חֶרֶב אֹו חֲנִית
  choice: upanga au mkuki
  rationale: Chanzo kinatumia majina ya umoja kwa maana ya jumla; Kiswahili pia kinaweza kutumia umoja kwa kawaida katika kauli hii.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, ya kawaida na yenye hadhi. Muundo ‘wasije wakatengeneza’ huhifadhi wazi kusudi la kuzuia bila kutumia maelezo marefu.
