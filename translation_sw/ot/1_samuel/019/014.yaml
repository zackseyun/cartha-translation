  yaml_path: translation/ot/1_samuel/019/014.yaml
  text: Then Saul sent messengers to seize David[a], and she said, “He is sick.”
translation:
  language: sw
  text: Ndipo Sauli akatuma wajumbe ili wamkamate Daudi, naye Mikali akasema[a], “Yeye ni mgonjwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema tu “akasema” kwa umbo la umoja wa kike; kutokana na muktadha, msemaji anaeleweka kuwa Mikali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Ndipo ... akatuma
  rationale: Muundo wa simulizi unaendeleza mfuatano wa matukio; “ndipo” ni wa asili katika Kiswahili na unaonyesha hatua inayofuata.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu ni watu waliotumwa na Sauli, si malaika.
- source_word: לָקַחַת
  choice: ili wamkamate
  rationale: Ingawa kitenzi kwa msingi humaanisha “kuchukua,” hapa wajumbe wametumwa kumtia Daudi mikononi; “kumkamata” huwasilisha kusudi hilo bila kuliongezea maana.
- source_word: אֶת דָּוִד
  choice: Daudi
  rationale: Ni jina la yule anayelengwa moja kwa moja na kitendo.
- source_word: וַתֹּאמֶר
  choice: naye Mikali akasema
  rationale: Kitenzi cha Kiebrania ni cha nafsi ya tatu, umoja wa kike. Kiswahili hakionyeshi jinsia katika umbo la “akasema,” kwa hiyo jina Mikali, linaloeleweka kutokana na muktadha, linawekwa wazi ili kuzuia kudhani kuwa msemaji ni Daudi.
- source_word: חֹלֶה הוּא
  choice: Yeye ni mgonjwa
  rationale: Hii inawasilisha kwa kawaida muundo wa Kiebrania wa kivumishi cha hali pamoja na kiwakilishi, huku msisitizo mdogo wa kiwakilishi ukihifadhiwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wajumbe” ni neno la kawaida na wazi; “wamkamate” linafaa kwa kusudi la uadui katika simulizi. Kiunganishi “naye” kinahifadhi mwendelezo wa kawaida wa Kiebrania bila kulazimisha maana ya upinzani iliyo wazi zaidi kuliko chanzo.
