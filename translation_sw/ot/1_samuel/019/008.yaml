base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/008.yaml
  text: And the war broke out again[a], and David went out and fought against the Philistines and struck them with a great blow, so that they fled before him.
translation:
  language: sw
  text: Vita vikazuka tena,[a] naye Daudi akatoka akapigana na Wafilisti, akawapiga pigo kubwa, nao wakakimbia kutoka mbele yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Vita viliendelea,” au “Kulikuwa na vita tena.” Nahau ya Kiebrania yasema kihalisi, “vita vikaongeza kuwapo,” ikionyesha vita vilivyoanza tena au vilivyoendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף הַמִּלְחָמָה לִהְיוֹת
  choice: Vita vikazuka tena
  rationale: Nahau ya Kiebrania yenye maana halisi ya ‘vita vikaongeza kuwapo’ inaonyesha vita kuanza tena au kuendelea. ‘Vikazuka tena’ ni Kiswahili cha kawaida kinachoonyesha kurejea kwa mapigano.
- source_word: וַיֵּצֵא דָוִד
  choice: Daudi akaenda
  rationale: Kitenzi kina maana ya ‘akatoka/akaenda nje.’ Katika muktadha huu ni kwenda vitani, lakini lengo halijatajwa wazi katika Kiebrania; ‘akaenda’ ni ya asili na haiingizi maelezo yasiyosemwa.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: akapigana na Wafilisti
  rationale: Katika Kiswahili, ‘kupigana na’ humaanisha kupambana dhidi ya mtu; hapa muktadha unaondoa uwezekano wa kueleweka kama ushirika.
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: kuwashinda vibaya sana
  rationale: Muundo wa Kiebrania unaeleza kuwapiga pigo kubwa, yaani kuwaletea ushindi mkubwa dhidi yao. Tafsiri hii ni ya kawaida katika Kiswahili na haiongezi wazo mahsusi la mauaji.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: wakamkimbia
  rationale: Nahau hii ina maana ya kukimbia kutoka mbele au uweponi pake. ‘Wakamkimbia’ huwasilisha kwa kawaida kwamba walitoroka kwa sababu ya Daudi na mbele yake.
