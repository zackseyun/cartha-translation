  terminology: “Yahwe” huhifadhi jina la Mungu badala ya cheo, na “wokovu mkubwa” ni chaguo linalofaa kwa תְּשׁוּעָה huku tanbihi ikitoa “ukombozi” na “ushindi.” Majina Daudi, Mfilisti, na Israeli yameandikwa kwa usahihi. Alama za tanbihi zimewekwa mahali panapolingana na mada zao.
