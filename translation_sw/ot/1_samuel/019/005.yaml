id: 1SA.19.5
reference: 1 Samuel 19:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ אֶת נַפְשׁ֨/וֹ בְ/כַפּ֜/וֹ וַ/יַּ֣ךְ אֶת הַ/פְּלִשְׁתִּ֗י וַ/יַּ֨עַשׂ יְהוָ֜ה תְּשׁוּעָ֤ה גְדוֹלָה֙ לְ/כָל יִשְׂרָאֵ֔ל רָאִ֖יתָ וַ/תִּשְׂמָ֑ח וְ/לָ֤/מָּה תֶֽחֱטָא֙ בְּ/דָ֣ם נָקִ֔י לְ/הָמִ֥ית אֶת דָּוִ֖ד חִנָּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/005.yaml
  text: For he put his life in his hand and struck down the Philistine[a], and Yahweh brought about a great salvation for all Israel. You saw it and rejoiced[c][b]. So why should you sin against innocent blood by putting David to death for no reason?
translation:
  language: sw
  text: Kwa maana alihatarisha maisha yake[a] na kumwangusha yule Mfilisti, naye Yahwe akaleta wokovu mkubwa[b] kwa ajili ya Israeli yote. Wewe uliliona jambo hilo ukafurahi. Basi kwa nini utende dhambi dhidi ya damu isiyo na hatia kwa kumwua Daudi bila sababu?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “aliweka maisha yake kiganjani mwake.”
    reason: lexical_alternative
  - marker: b
    text: “Wokovu mkubwa” pia inaweza kutafsiriwa “ukombozi mkubwa” au “ushindi mkubwa.”
    reason: lexical_alternative
  - marker: c
    text: Au, “bure.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֶת־נַפְשׁוֹ בְכַפּוֹ
  choice: alihatarisha maisha yake
  rationale: Nahau ya Kiebrania husema kihalisi kwamba aliweka maisha yake kiganjani mwake; Kiswahili cha sasa huwasilisha maana yake ya kujitia katika hatari ya kufa kwa kusema ‘alihatarisha maisha yake.’ Taswira halisi imehifadhiwa katika tanbihi.
- source_word: נַפְשׁוֹ
  choice: maisha yake
  rationale: Katika muktadha huu neno hili linamaanisha uhai wa mtu, si nafsi isiyo ya kimwili.
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי
  choice: kumwangusha yule Mfilisti
  rationale: Kitenzi kinataja kumpiga na kumshinda Mfilisti; ‘kumwangusha’ hudumisha picha ya tendo hilo bila kupunguza usemi kuwa ‘kumwua’ pekee.
- source_word: וַיַּעַשׂ יְהוָה
  choice: Yahwe akaleta
  rationale: Kitenzi עשה pamoja na nomino dhahania hapa kina maana ya kusababisha au kutimiza jambo; ‘akaleta’ ni usemi wa kawaida unaoonyesha wazi utendaji wa Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa badala ya kubadilishwa kuwa cheo.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: wokovu mkubwa
  rationale: Neno תְּשׁוּעָה linaweza kumaanisha wokovu, ukombozi, au ushindi. ‘Wokovu’ huhifadhi upana wa neno huku muktadha ukionyesha kwamba hapa unahusisha kuokolewa vitani.
- source_word: לְכָל־יִשְׂרָאֵל
  choice: kwa ajili ya Israeli yote
  rationale: Kihusishi לְ kinaonyesha manufaa; usemi huu unaonyesha kwamba Israeli yote ilinufaika.
- source_word: רָאִיתָ וַתִּשְׂמָח
  choice: Wewe uliliona jambo hilo ukafurahi
  rationale: Kiwakilishi ‘Wewe’ huhifadhi mkazo wa kumwelekea Sauli, na ‘jambo hilo’ huweka wazi kile alichokiona bila kuongeza tafsiri ya ziada.
- source_word: וְלָמָּה תֶחֱטָא
  choice: Basi kwa nini utende dhambi
  rationale: ‘Basi’ huonyesha hitimisho linalotokana na furaha ya Sauli ya awali, na swali hudumisha nguvu ya kimaadili na mtazamo wa tendo linalokusudiwa.
- source_word: בְּדָם נָקִי
  choice: dhidi ya damu isiyo na hatia
  rationale: Tafsiri hii huhifadhi lugha ya Kiebrania kuhusu hatia ya damu na sauti yake ya kisheria na kimaadili.
- source_word: לְהָמִית אֶת־דָּוִד חִנָּם
  choice: kwa kumwua Daudi bila sababu
  rationale: Kiswahili hiki kinaonyesha namna ambavyo dhambi hiyo ingetendwa na huhifadhi dai kwamba Daudi hastahili kuuawa.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano moja kwa moja; ‘Yahwe’ huhifadhi jina hilo badala ya kuliwakilisha kwa cheo.
- issue: Maana ya תְּשׁוּעָה katika muktadha wa vita
  choice: wokovu mkubwa
  alternative: ukombozi mkubwa; ushindi mkubwa
  rationale: Muktadha unahusu ushindi dhidi ya adui, lakini neno la Kiebrania ni pana kuliko ushindi wa kijeshi pekee. ‘Wokovu’ huhifadhi mvutano huo, huku tanbihi ikitaja maana nyingine zinazowezekana.
- issue: Lugha ya hatia ya damu katika בְּדָם נָקִי
  choice: dhambi dhidi ya damu isiyo na hatia
  alternative: dhambi kwa kumwaga damu isiyo na hatia
  rationale: Chaguo kuu huhifadhi tamathali ya chanzo na mwangwi wake wa kisheria; mbadala unaweka wazi maana lakini unaongeza kitenzi ‘kumwaga,’ ambacho hakipo wazi katika kishazi hiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Nahau isiyo ya kawaida ya Kiebrania imetafsiriwa kwa maana yake katika matini kuu na umbo lake halisi limewekwa katika tanbihi. Viunganishi vya simulizi vimetolewa kwa mtiririko wa kawaida wa Kiswahili, huku lugha ya kisheria kuhusu damu isiyo na hatia ikihifadhiwa.
