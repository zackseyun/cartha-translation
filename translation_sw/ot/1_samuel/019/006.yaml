  text: Saul listened to Jonathan’s voice[a], and Saul swore, “As Yahweh lives, he shall not be put to death.”
translation:
  language: sw
  text: Sauli akamsikiliza Yonathani, naye akaapa, “Kama Yahweh aishivyo, hatauawa kamwe.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע שָׁאוּל בְּקוֹל יְהוֹנָתָן
  choice: Sauli akamsikiliza Yonathani
  rationale: Kitenzi שׁמע pamoja na בְּקוֹל hapa kina maana ya kusikiliza na kukubali ombi, si kusikia sauti tu. Kiswahili cha kawaida hakihitaji kuhifadhi kihalisi usemi ‘sauti ya Yonathani’ ili kutoa maana hiyo.
- source_word: וַיִּשָּׁבַע
  choice: akaapa
  rationale: ‘Kuapa’ ni kitenzi cha Kiswahili kilicho wazi na cha kawaida kwa kiapo kizito kinachofuata.
- source_word: חַי יְהוָה
  choice: Kama Yahweh aishivyo
  rationale: Huu ni mlingano wa asili wa Kiswahili kwa fomula ya kiapo ya Kiebrania, huku jina la Mungu יְהוָה likihifadhiwa kama Yahweh.
- source_word: אִם יוּמָת
  choice: hatauawa kamwe
  rationale: Katika kiapo, אִם ni sehemu ya fomula iliyofupishwa yenye nguvu ya ukanushaji. Hophali יוּמָת ni ya kusababisha katika hali tendwa, kwa hiyo maana ni ‘atauawa,’ si ‘atakufa’ tu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja. ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya fomula ya kiapo אִם יוּמָת
  choice: hatauawa kamwe
  alternative: ikiwa atauawa
  rationale: Katika aina hii ya kiapo cha Kiebrania, kishazi cha adhabu kinachodhaniwa hakikutajwa; אִם kwa hiyo huwasilisha ukanushaji mkali. Tafsiri inatoa maana ya kiapo bila kuifanya ionekane kama sharti la kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa Biblia lakini kinachoeleweka kwa wasomaji wa sasa. ‘Kama Yahweh aishivyo’ huhifadhi uzito wa kiapo; ‘kamwe’ huonyesha nguvu ya ukanushaji wa fomula iliyofupishwa ya Kiebrania.
