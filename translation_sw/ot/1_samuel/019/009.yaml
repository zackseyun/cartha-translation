  yaml_path: translation/ot/1_samuel/019/009.yaml
  text: And an evil spirit from Yahweh came upon Saul while he was sitting in his house with his spear in his hand[b][a], and David was playing the lyre with his hand.
translation:
  language: sw
  text: Ndipo roho mbaya[a] kutoka kwa Yahweh ikamjia Sauli alipokuwa ameketi nyumbani mwake, mkuki wake ukiwa mkononi; naye Daudi alikuwa akipiga muziki kwa mkono wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho yenye kudhuru” au “roho yenye kutesa.” Kivumishi cha Kiebrania kinaweza kumaanisha “mbaya,” “yenye kudhuru,” au “yenye kuleta taabu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema kihalisi, “akipiga kwa mkono.” Ala haikutajwa wazi katika mstari huu, ingawa muktadha wa karibu unaonyesha kwamba Daudi alikuwa akipiga kinubi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: Ndipo ... ikamjia
  rationale: Muundo huu unaonyesha tukio jipya katika simulizi na, pamoja na אֶל שָׁאוּל, unaeleza kwa Kiswahili cha kawaida kwamba roho hiyo ilimjia Sauli.
- source_word: רוּחַ יְהוָה רָעָה
  choice: roho mbaya kutoka kwa Yahweh
  rationale: רוּחַ ni ‘roho,’ na רָעָה linaweza kumaanisha ‘mbaya,’ ‘yenye kudhuru,’ au ‘yenye kutesa.’ ‘Kutoka kwa Yahweh’ linaonyesha chanzo au utumaji bila kusema kwamba Yahweh mwenyewe ana uovu wa kimaadili.
- source_word: אֶל שָׁאוּל
  choice: ikamjia Sauli
  rationale: Ingawa אֶל kimsingi ni ‘kwa/kuelekea,’ katika muktadha huu kitenzi ‘ikamjia’ kinaeleza kwa kawaida kuanza kwa hali iliyomkumba Sauli.
- source_word: בְּבֵיתוֹ יוֹשֵׁב
  choice: alipokuwa ameketi nyumbani mwake
  rationale: Kauli endelevu ya Kiebrania inaweka mandhari ya tendo lililokuwa likiendelea.
- source_word: וַחֲנִיתוֹ בְּיָדוֹ
  choice: mkuki wake ukiwa mkononi
  rationale: Kirai kisicho na kitenzi kinaeleza hali ya Sauli; Kiswahili hiki ni cha kawaida na kinahifadhi picha ya mkuki uliokuwa mkononi mwake.
- source_word: מְנַגֵּן
  choice: alikuwa akipiga kinubi
  rationale: Kitenzi kinamaanisha kupiga ala ya muziki. Ala haijatajwa wazi katika mstari huu, lakini muktadha wa karibu unaonyesha kinubi; kutaja ala kunafanya sentensi iwe ya kawaida kwa Kiswahili.
- source_word: בְּיָד
  choice: kwa mkono wake
  rationale: Tafsiri hii inafuata kwa karibu usemi wa Kiebrania ‘kwa mkono,’ huku kiwakilishi ‘wake’ kikifafanua mhusika kwa Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יְהוָה moja kwa moja; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Jinsi ya kueleza רוּחַ יְהוָה רָעָה bila kuondoa mvutano wa kiteolojia
  choice: roho mbaya kutoka kwa Yahweh
  alternative: roho yenye kudhuru kutoka kwa Yahweh; roho mbaya ya Yahweh
  rationale: ‘Mbaya’ ni tafsiri ya moja kwa moja ya רָעָה, huku ‘kutoka kwa’ ikionyesha uhusiano wa chanzo au utumaji. Tafsiri haiondoi dai gumu la maandishi kwamba roho hiyo ilitoka kwa Yahweh, wala haidai kwamba uovu ni sifa ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wa kawaida na wenye heshima. ‘Kinubi’ limetumiwa kwa uwazi wa kimuktadha, huku tanbihi ikihifadhi ukweli kwamba ala haikutajwa katika mstari huu.
