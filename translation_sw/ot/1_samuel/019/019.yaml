lexical_decisions:
- source_word: וַיֻּגַּד
  choice: Ikaja taarifa
  rationale: Kitenzi cha Kiebrania ni cha kutendwa na hakimtaji mtoa habari; usemi huu wa Kiswahili huwasilisha kufikishwa kwa habari bila kuongeza mtendaji.
- source_word: לְשָׁאוּל
  choice: kwa Sauli
  rationale: Huwasilisha Sauli kama mpokeaji wa taarifa kwa Kiswahili cha kawaida.
- source_word: לֵאמֹר
  choice: ikisema
  rationale: Hudumisha muundo wa kunukuu wa Kiebrania huku ukisomeka kwa kawaida katika Kiswahili.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta fikira kwenye taarifa inayofuata na kuhifadhi msisitizo wa ghafla wa chanzo.
- source_word: דָוִד
  choice: Daudi
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: בְּנוָיֹת
  choice: yuko Nayothi
  rationale: Hulitendea Nayothi kama jina la mahali na kuwasilisha kihusishi cha mahali bila kuamua kwa nguvu kati ya ‘katika’ na ‘kwenye’.
- source_word: בָּרָמָה
  choice: huko Rama
  rationale: Hutambulisha Rama kama eneo ambamo Nayothi ilikuwamo, kwa mtiririko wa kawaida wa Kiswahili.
