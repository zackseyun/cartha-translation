base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/013.yaml
  text: Then Michal took the household idol and laid it on the bed[b][a], and she put a cushion of goats’ hair at its head and covered it with the garment.
translation:
  language: sw
  text: Ndipo Mikali akachukua sanamu ya nyumbani[a] na kuiweka kitandani. Akaweka kitambaa cha manyoya ya mbuzi[b] kwenye sehemu ya kichwa chake, kisha akaifunika kwa vazi lile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “terafimu,” “miungu ya nyumbani,” au “sanamu.” Neno la Kiebrania linamaanisha vitu vya ibada vya nyumbani; hapa kitu hicho kinaonekana kutumiwa kama umbo moja kitandani.
    reason: lexical_alternative
  - marker: b
    text: Maana kamili ya neno la Kiebrania haijulikani. Huenda lilimaanisha kitu kilichofumwa kwa manyoya ya mbuzi, kama kifuniko, wavu, mto, au kitu kingine cha namna hiyo kilichowekwa sehemu ya kichwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: sanamu ya nyumbani
  rationale: Neno תְּרָפִים humaanisha vitu vya ibada vilivyotumiwa nyumbani. Ingawa umbo la Kiebrania ni la wingi, katika tukio hili kitu hicho kinawekwa kitandani kama umbo moja; kwa hiyo umoja unafaa katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa tafsiri nyingine.
- source_word: אֶל הַמִּטָּה
  choice: kuiweka kitandani
  rationale: Katika muktadha huu אֶל pamoja na kitenzi שׂים inaeleza kuwekwa kwa kitu kitandani ili kuandaa hila, si lazima mwendo unaoelekea tu kwenye kitanda.
- source_word: כְּבִיר הָעִזִּים
  choice: kitambaa cha manyoya ya mbuzi
  rationale: כְּבִיר ni neno adimu lenye maana isiyo hakika. 'Kitambaa' ni tafsiri pana na ya kawaida inayowasilisha kitu cha manyoya ya mbuzi bila kukiamulia kwa uhakika kuwa mto, wavu, au kifuniko.
- source_word: מְרַאֲשֹׁתָיו
  choice: mahali pa kichwa chake
  rationale: Neno hili linaelekeza kwenye sehemu ya kichwa au sehemu ya kuegemeza kichwa. Tafsiri hii inadumisha rejeo la kiwakilishi lililomo katika Kiebrania bila kulifafanua kupita kiasi.
- source_word: בַּבָּגֶד
  choice: kwa lile vazi
  rationale: בֶּגֶד ni neno la jumla kwa vazi au nguo. Kiambishi cha uainisho katika Kiebrania kinaonyeshwa kwa 'lile,' kikidokeza vazi maalumu lililotumika katika tukio hilo.
- source_word: וַתְּכַס
  choice: akaifunika
  rationale: Kitenzi כסה humaanisha kufunika. Kiambishi 'i-' kinaelekeza kwa sanamu au mpangilio uliokuwa kitandani bila kuongeza maelezo yasiyokuwapo katika chanzo.
