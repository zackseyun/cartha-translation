translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili ili mfululizo wa vitendo uwe wazi. 'Ndipo' na vitenzi vya mfululizo vinaendeleza mtindo wa simulizi, huku tanbihi zikihifadhi kutokuwa na uhakika kwa maneno תְּרָפִים na כְּבִיר.
