base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/002.yaml
  text: Jonathan told David[a], saying, “Saul my father is seeking to kill you. So now, please be on your guard in the morning, and stay in a secret place and hide yourself.”
translation:
  language: sw
  text: Yonathani akamwambia Daudi, “Sauli baba yangu anatafuta kukuua. Basi sasa, tafadhali uwe macho asubuhi, ukae mahali pa kujificha[a] na ujifiche.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukae mafichoni.” Kiebrania kinaunganisha “ukae” na nomino inayoweza kumaanisha siri au mahali pa kujificha, kisha kinaongeza “ujifiche” ili kutia mkazo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: akamwambia
  rationale: Hifili ya נגד humaanisha kumweleza au kumjulisha mtu. “Akamwambia” ni ya kawaida na inafaa kwa utangulizi wa maneno yanayofuata.
- source_word: לֵאמֹר
  choice: imewakilishwa kwa alama za kunukuu
  rationale: Katika Kiswahili, fomula ya Kiebrania ya kuanzisha usemi huwasilishwa kwa kawaida na kwa ufasaha kwa usemi wa moja kwa moja bila kuongeza “akisema,” ambalo lingekuwa rudufu baada ya “akamwambia.”
- source_word: מְבַקֵּשׁ
  choice: anatafuta
  rationale: Kitenzi kishirikishi kinaonyesha nia inayoendelea wakati huo; “anatafuta” huhifadhi maana hiyo bila kudai kwamba jaribio la kuua tayari limeanza.
- source_word: לַהֲמִיתֶךָ
  choice: kukuua
  rationale: Hifili ya מות hapa ni kusababisha mtu afe, yaani kumuua; “kukuua” ni ya moja kwa moja na haiongezi wazo la hukumu rasmi.
- source_word: הִשָּׁמֶר נָא
  choice: tafadhali uwe macho
  rationale: Amri hii ni ya kujilinda au kujihadhari. “Uwe macho” ni Kiswahili cha kawaida katika muktadha wa hatari, na “tafadhali” huakisi נָא.
- source_word: בַבֹּקֶר
  choice: asubuhi
  rationale: Hii inatafsiri wakati uliotajwa bila kuongeza waziwazi “kesho,” jambo ambalo halimo katika maneno ya Kiebrania.
- source_word: וְיָשַׁבְתָּ
  choice: ukae
  rationale: ישב inaweza kumaanisha kuketi, kukaa, au kubaki. Hapa “ukae” huwasilisha kwa kawaida agizo la kubaki mahali pa kujificha.
- source_word: בַסֵּתֶר
  choice: mahali pa siri
  rationale: סֵתֶר inaweza kutaja siri, maficho, au mahali palipofichika. “Mahali pa siri” huhifadhi maana ya mahali na pia upana wa neno hilo.
- source_word: וְנַחְבֵּאתָ
  choice: ujifiche
  rationale: חבא hapa ni kujificha. “Ujifiche” huhifadhi maana ya kujitendea na mkazo unaotokana na kuifuata kauli kuhusu mahali pa siri.
- source_word: יְהוֹנָתָן ... לְדָוִד ... שָׁאוּל אָבִי
  choice: Yonathani ... Daudi ... Sauli baba yangu
  rationale: Majina yametolewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili; “baba yangu” imehifadhiwa kwa sababu inaonyesha mvutano wa kibinafsi katika onyo la Yonathani.
