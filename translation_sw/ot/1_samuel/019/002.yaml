translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. Usemi wa moja kwa moja umetumiwa badala ya tafsiri ngumu ya לֵאמֹר; tahadhari, wakati, na urudiaji wenye mkazo wa Kiebrania vimehifadhiwa.
