source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח שָׁא֣וּל מַלְאָכִים֮ לָ/קַ֣חַת אֶת דָּוִד֒ וַ/יַּ֗רְא אֶֽת לַהֲקַ֤ת הַ/נְּבִיאִים֙ נִבְּאִ֔ים וּ/שְׁמוּאֵ֕ל עֹמֵ֥ד נִצָּ֖ב עֲלֵי/הֶ֑ם וַ/תְּהִ֞י עַֽל מַלְאֲכֵ֤י שָׁאוּל֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵֽמָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/020.yaml
  text: Then Saul sent messengers to seize David[a]. When they saw the company of prophets prophesying, with Samuel standing over them, the Spirit of God came upon Saul’s messengers[b], and they also prophesied.
translation:
  language: sw
  text: Ndipo Sauli akatuma wajumbe wamkamate Daudi. Walipoliona kundi[a] la manabii wakitabiri, Samweli akiwa amesimama akiwaongoza, Roho wa Mungu akawajia wajumbe wa Sauli[b], nao pia wakatabiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kusanyiko la manabii.” Neno la Kiebrania humaanisha kikundi kilichokusanyika.
    reason: lexical_alternative
  - marker: b
    text: Au “Samweli akiwa amesimama miongoni mwao” au “juu yao”; Kiebrania kinaweza pia kuonyesha kwamba alikuwa katika nafasi ya kuwaongoza au kuwasimamia.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים / מַלְאֲכֵי
  choice: wajumbe
  rationale: Katika muktadha huu ni watu waliotumwa na Sauli, si malaika; “wajumbe” ni neno la kawaida na sahihi.
- source_word: לָקַחַת
  choice: wamkamate
  rationale: Ingawa kitenzi kina maana pana ya “kuchukua,” hapa kusudi la Sauli ni kumtia Daudi mikononi; “kumkamata” linaonyesha kusudi hilo la uhasama bila kuzidisha maana.
- source_word: לַהֲקַת הַנְּבִיאִים
  choice: kundi la manabii
  rationale: Nomino hii humaanisha kikundi kilichokusanyika; “kundi” ni Kiswahili cha asili na kinachoeleweka kwa urahisi.
- source_word: נִבְּאִים / וַיִּתְנַבְּאוּ
  choice: wakitoa unabii / wakatoa unabii
  rationale: Miundo hii huhifadhi tendo la kinabii linaloendelea katika sehemu ya kwanza na tukio lililofuata kwa wajumbe wa Sauli, huku ikidumisha urudiaji wa mzizi wa Kiebrania.
- source_word: עֹמֵד נִצָּב עֲלֵיהֶם
  choice: akiwa amesimama juu yao
  rationale: Kauli hii huhifadhi taswira ya mahali pamoja na uwezekano wa Samweli kuwa katika nafasi ya uongozi au usimamizi.
- source_word: רוּחַ אֱלֹהִים
  choice: Roho wa Mungu
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili inayoonyesha utendaji wa Mungu bila kuingiza ufafanuzi wa kiteolojia unaozidi matini.
- source_word: וַתְּהִי עַל
  choice: akawajia
  rationale: Hutoa maana ya tukio la Roho kuwajia na kuwa juu yao kwa ajili ya tendo lililofuata, kwa Kiswahili cha kawaida.
- source_word: גַּם הֵמָּה
  choice: nao pia
  rationale: Huhifadhi msisitizo kwamba hata wajumbe wa Sauli walishiriki tendo hilo la kinabii.
theological_decisions:
- issue: Asili ya רוּחַ אֱלֹהִים katika simulizi hili
  choice: Roho wa Mungu akawajia wajumbe wa Sauli
  alternative: roho kutoka kwa Mungu ikawajia wajumbe wa Sauli
  rationale: Muundo wa Kiebrania kwa kawaida humtaja Roho wa Mungu kama mtendaji wa kimungu. Tafsiri hii huhifadhi nguvu hiyo huku isiongeze ufafanuzi wa mafundisho ya baadaye.
- issue: Nafasi ya Samweli kwa kundi la manabii
  choice: akiwa amesimama juu yao
  alternative: akiwa amesimama miongoni mwao
  rationale: Kihusishi kinaweza kuwa cha mahali au kuashiria usimamizi. Matini kuu huhifadhi usemi wa karibu na Kiebrania, na tanbihi hutaja uwezekano mwingine bila kuamua kwa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Sentensi ni ya kisimulizi na ina mtiririko wa kawaida; istilahi za kinabii zimetolewa kwa lugha inayoeleweka na wasomaji wa kawaida.
