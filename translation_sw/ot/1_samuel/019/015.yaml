  text: Then Saul sent the messengers to see David[a], saying, “Bring him up to me in the bed, so that I may put him to death.”
translation:
  language: sw
  text: Ndipo Sauli akawatuma wale wajumbe wamwone Daudi, akisema, “Mleteni kwangu akiwa kitandani[a] ili nimuue.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “juu ya kitanda” au “pamoja na kitanda.” Kihusishi cha Kiebrania kinaweza kueleweka kwa njia zaidi ya moja; huenda agizo lilikuwa wamlete Daudi akiwa amelala kitandani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Ndipo Sauli akawatuma
  rationale: Waw-consecutive inaendeleza mfululizo wa simulizi; “Ndipo” ni kiunganishi cha kawaida cha Kiswahili kinachohifadhi mpangilio wa matukio.
- source_word: הַמַּלְאָכִים
  choice: wale wajumbe
  rationale: מַלְאָךְ hapa ni watu waliotumwa na Sauli, si malaika wa mbinguni; “wajumbe” huwasilisha maana hiyo wazi.
- source_word: לִרְאוֹת אֶת דָּוִד
  choice: wamwone Daudi
  rationale: Tafsiri hii inahifadhi maana ya msingi ya ראה, “kuona,” bila kuamua kimya kimya kama walitumwa kumkagua au kuthibitisha kuwapo kwake.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hiki ni kifungu cha kawaida kinachoanzisha maneno ya moja kwa moja; umoja unamrejelea Sauli kama mtoa agizo.
- source_word: הַעֲלוּ אֹתוֹ
  choice: Mleteni
  rationale: Hiphil ya עלה ina maana ya kumleta au kumpandisha. “Mleteni” ni ya asili katika Kiswahili hapa; wazo la kubebwa linajitokeza kutokana na kitanda.
- source_word: בַמִּטָּה
  choice: akiwa kitandani
  rationale: ב inaweza kumaanisha “katika,” “juu ya,” au kwa muktadha huu kuonyesha kwamba Daudi aletwe akiwa amelala kitandani. “Akiwa kitandani” ni ya kawaida na huhifadhi wazo hilo bila kudai kwa uhakika kwamba kitanda chenyewe kilibebwa.
- source_word: אֵלַי
  choice: kwangu
  rationale: Inaonyesha wazi kwamba Sauli alitaka Daudi aletwe mahali alipo yeye.
- source_word: לַהֲמִתוֹ
  choice: ili nimuue
  rationale: Infinitivu yenye ל inaonyesha kusudi. “Ili nimuue” ni ya moja kwa moja, yenye uzito, na ya kawaida katika Kiswahili cha sasa.
