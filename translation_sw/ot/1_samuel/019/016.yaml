base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/016.yaml
  text: When the messengers came in[a], behold, the teraphim was in the bed[b], with the quilt of goats’ hair at its head.
translation:
  language: sw
  text: Wajumbe walipoingia, tazama, terafimu[a] ilikuwa kitandani, na kifuniko cha manyoya ya mbuzi[b] kilikuwa mahali pa kichwa chake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sanamu ya nyumbani” au “sanamu ya kuabudiwa.” Neno la Kiebrania terafimu linamaanisha sanamu iliyotumiwa katika ibada ya nyumbani.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiebrania lililotafsiriwa “kifuniko” ni adimu na huenda likamaanisha kwa ujumla kitu kilichofumwa. Hapa huenda kilikuwa kifuniko kilichotengenezwa kwa manyoya ya mbuzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu ni watu waliotumwa na Sauli kumkamata Daudi; “wajumbe” ni neno la kawaida lisilodokeza viumbe wa mbinguni.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: Linahifadhi msisitizo wa ghafla na hali hai ya ugunduzi katika simulizi la Kiebrania.
- source_word: הַתְּרָפִים
  choice: terafimu
  rationale: Utohozi huu unahifadhi jina maalumu la kitu cha kidini cha utamaduni huo bila kuamua zaidi kuhusu ukubwa au matumizi yake; tanbihi inaeleza maana inayowezekana.
- source_word: אֶל הַמִּטָּה
  choice: ilikuwa kitandani
  rationale: Ingawa אֶל kwa kawaida huelekeza kwenye au kuelekea mahali, hapa muktadha wa ugunduzi unaonyesha kwamba sanamu hiyo ilikuwa imelazwa kitandani kama mbadala wa mwili.
- source_word: וּכְבִיר
  choice: kifuniko
  rationale: Nomino hii ni adimu na huenda inamaanisha kitu kilichofumwa au kifuniko; “kifuniko” ni cha kawaida na hakibani maana kupita ushahidi wa neno.
- source_word: הָעִזִּים
  choice: cha manyoya ya mbuzi
  rationale: Katika muktadha huu kinachoelezwa ni nyenzo ya kifuniko, kwa hiyo “manyoya ya mbuzi” huwasilisha maana inayowezekana kwa uwazi.
- source_word: מְרַאֲשֹׁתָיו
  choice: upande wa kichwa chake
  rationale: Kirai kinamaanisha mahali pa kichwa; “upande wa kichwa chake” kinahifadhi kiambishi cha umoja wa kiume kinachorejelea terafimu bila kudokeza kuwa mtu halisi alikuwa kitandani.
theological_decisions:
- issue: Jinsi ya kutafsiri תְּרָפִים, kitu cha ibada kinachohusishwa na dini ya nyumbani au ibada ya sanamu
  choice: terafimu
  alternative: sanamu ya nyumbani; sanamu ya kuabudiwa
  rationale: Andiko linakitaja kitu hicho bila kutoa hukumu ya wazi katika mstari huu. Utohozi unahifadhi upekee wa kitamaduni na kuepuka kuongeza tafsiri ya kimadhehebu, huku tanbihi ikifafanua maana yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Tazama” limetumiwa kuhifadhi nguvu ya ghafla ya וְהִנֵּה; “terafimu” limefafanuliwa katika tanbihi kwa sababu si neno la kawaida.
