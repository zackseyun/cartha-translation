base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/011.yaml
  text: Then Saul sent messengers to David’s house to watch him and to kill him in the morning. And Michal his wife told David[a], saying, “If you do not save your life tonight, tomorrow you will be put to death.”
translation:
  language: sw
  text: Sauli akatuma wajumbe nyumbani kwa Daudi ili wamfuatilie na kumuua asubuhi. Na Mikali, mkewe, akamwambia Daudi[a], “Usipojiokoa usiku huu, kesho utauawa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usipotoroka na uhai wako usiku huu, kesho utauawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Katika muktadha huu ni watu waliotumwa na Sauli, si malaika; “wajumbe” ni neno la kawaida na sahihi.
- source_word: לְשָׁמְרוֹ
  choice: ili wamvizie
  rationale: Kitenzi hapa kinaeleza kumchunga kwa nia ya uhasama ili kumkamata au kumuua; “wamvizie” huonyesha ufuatiliaji huo bila maana ya kumlinda.
- source_word: וְלַהֲמִיתוֹ
  choice: na kumuua
  rationale: Hifili ya מות ina maana ya kusababisha afe; “kumuua” ni ya moja kwa moja na inafaa njama hii.
- source_word: בַּבֹּקֶר
  choice: asubuhi
  rationale: Kirai hiki kinaonyesha wakati uliokusudiwa wa kumuua.
- source_word: וַתַּגֵּד
  choice: akamwambia
  rationale: Hutoa kwa lugha ya kawaida taarifa au onyo la Mikali kwa Daudi, likifuatiwa na usemi wa moja kwa moja.
- source_word: מִיכַל אִשְׁתּוֹ
  choice: Mikali, mkewe
  rationale: Huhifadhi uhusiano wa kiambatisho katika Kiebrania na kumtambulisha Mikali wazi kuwa mke wa Daudi.
- source_word: מְמַלֵּט אֶת־נַפְשְׁךָ
  choice: kuokoa maisha yako
  rationale: Ni tafsiri ya kawaida ya nahau ya kujiokoa nafsi au uhai katika hatari ya kifo; uwezekano wa maana ya kutoroka umehifadhiwa katika tanbihi.
- source_word: הַלַּיְלָה
  choice: usiku huu
  rationale: Huonyesha usiku wa sasa kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: מוּמָת
  choice: utauawa
  rationale: Huhifadhi hali ya kutendwa na kueleza wazi kwamba kifo kitasababishwa na watu wengine.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. “Wamvizie” limetumiwa kuzuia maana ya ulinzi inayoweza kutolewa na “wamchunge.” Kiunganishi “Lakini” kinaonyesha utofautishaji wa kimasimulizi kati ya njama ya Sauli na onyo la Mikali, ingawa Kiebrania hutumia waw ya kawaida.
