lexical_decisions:
- source_word: וַתֹּרֶד
  choice: akamshusha
  rationale: Kitenzi cha Kiebrania kinamaanisha kumshusha mtu kutoka juu kwenda chini; umbo hili pia linaonyesha kwamba Mikali ndiye aliyemshusha Daudi.
- source_word: בְּעַד הַחַלּוֹן
  choice: kupitia dirishani
  rationale: Kirai hiki kinaonyesha njia aliyopitishwa Daudi, yaani kupitia kwenye dirisha; Kiswahili hiki ni cha kawaida na wazi.
- source_word: וַיֵּלֶךְ וַיִּבְרַח וַיִּמָּלֵט
  choice: akaenda, akakimbia, akaokoka
  rationale: Mfuatano wa vitenzi vitatu umehifadhiwa ili kudumisha mwendo na msisitizo wa simulizi la Kiebrania bila kuvifanya kuwa kitendo kimoja.
