  text: וַ/יֵּ֨לֶךְ גַּם ה֜וּא הָ/רָמָ֗תָ/ה וַ/יָּבֹא֙ עַד בּ֤וֹר הַ/גָּדוֹל֙ אֲשֶׁ֣ר בַּ/שֶּׂ֔כוּ וַ/יִּשְׁאַ֣ל וַ/יֹּ֔אמֶר אֵיפֹ֥ה שְׁמוּאֵ֖ל וְ/דָוִ֑ד וַ/יֹּ֕אמֶר הִנֵּ֖ה ב/נוית בָּ/רָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/022.yaml
  text: He too went to Ramah[a], and he came as far as the great well that is at Seku. He asked and said, “Where are Samuel and David?” And one said, “Look[b], they are at Naioth in Ramah.”
translation:
  language: sw
  text: Yeye pia akaenda Rama, akafika mpaka kwenye kisima kikubwa[a] kilichoko Seku. Akauliza, “Samweli na Daudi wako wapi?” Mtu mmoja[b] akasema, “Tazama, wako Nayothi huko Rama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “birika kubwa la kuhifadhia maji” au “shimo kubwa.” Neno la Kiebrania בּוֹר linaweza kuwa na mojawapo ya maana hizo.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “akasema.” Mtoa jibu hajatajwa; “mtu mmoja” imeongezwa ili sentensi iwe wazi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָמָתָה
  choice: akaenda Rama
  rationale: Kiambishi cha mwelekeo -ה kinaonyesha mwendo kuelekea Rama; Kiswahili cha kawaida hutumia ‘kwenda Rama’ bila kuongeza kihusishi.
- source_word: בּוֹר הַגָּדוֹל
  choice: kisima kikubwa
  rationale: בּוֹר inaweza kumaanisha shimo, birika la kuhifadhia maji, au kisima. Hapa ni alama inayojulikana ya mahali, hivyo ‘kisima kikubwa’ ni tafsiri ya kawaida, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: בַּשֶּׂכוּ
  choice: kilichoko Seku
  rationale: Seku ni jina la mahali; muundo huu unaonyesha mahali kisima kilipokuwa kwa Kiswahili cha asili.
- source_word: וַיִּשְׁאַל וַיֹּאמֶר
  choice: Akauliza
  rationale: Jozi ya vitenzi vya Kiebrania inaanzisha swali la moja kwa moja. Katika Kiswahili, ‘akauliza’ pamoja na maneno yanayofuata huwasilisha maana hiyo kwa kawaida bila urudiaji usio wa lazima.
- source_word: אֵיפֹה
  choice: wako wapi
  rationale: Kiwakilishi cha mahali kinauliza walipo Samweli na Daudi; ‘wako wapi’ kinakubaliana kiasili na watu wawili.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linaelekeza usikivu kwenye jibu. ‘Tazama’ ni la heshima, linaeleweka, na linahifadhi nguvu yake ya kuonyesha.
- source_word: בנוית
  choice: Nayothi
  rationale: Ni jina la mahali au makao, hivyo limetoholewa badala ya kutafsiriwa kimaana.
- source_word: בָּרָמָה
  choice: huko Rama
  rationale: Kirai hiki kinabainisha Nayothi iliyokuwa Rama; ‘huko Rama’ ni usemi wa kawaida na wazi wa mahali.
- source_word: וַיֹּאמֶר
  choice: Mtu mmoja akasema
  rationale: Kitenzi cha Kiebrania kiko katika umoja lakini mtendaji wa jibu hajatajwa. ‘Mtu mmoja’ huweka kutotambulika kwake huku ikifanya sentensi iwe wazi kwa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Masimulizi yametumia mfululizo wa vitenzi vya ‘aka-’. Majina ya mahali yametoholewa kama Rama, Seku, na Nayothi; utata wa בּוֹר na wa mtendaji asiyeainishwa umehifadhiwa katika tanbihi.
