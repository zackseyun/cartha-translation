base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/001.yaml
  text: Saul spoke to Jonathan his son and to all his servants to put David to death[b][a], but Jonathan son of Saul delighted greatly in David.
translation:
  language: sw
  text: Sauli akawaambia Yonathani mwanawe na watumishi wake wote wamuue Daudi,[a] lakini Yonathani mwana wa Sauli alipendezwa sana na Daudi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wamsababishie Daudi kifo.” Kitenzi cha Kiebrania kiko katika kauli ya kusababisha, lakini hapa maana yake ya kawaida ni kumuua Daudi.
    reason: lexical_alternative
  - marker: b
    text: Au, “alimpenda sana Daudi” au “alikuwa na furaha kubwa kwa sababu ya Daudi.” Kiebrania kinasema kwamba Yonathani alipendezwa sana na Daudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: akawaambia
  rationale: Katika muktadha huu דִּבֵּר אֶל pamoja na kishazi cha lengo huwasilisha jambo ambalo Sauli aliwaambia; “akawaambia” ni Kiswahili cha kawaida na hakiongezi kwamba alinukuliwa moja kwa moja.
- source_word: עֲבָדָיו
  choice: watumishi wake
  rationale: עבד katika mazingira ya kifalme inaweza kumaanisha watumishi au maofisa wa mfalme. “Watumishi wake” huhifadhi neno pana la Kiebrania bila kulibana kuwa cheo maalumu.
- source_word: לְהָמִית אֶת־דָּוִד
  choice: wamuue Daudi
  rationale: Hifili ya מות ina maana ya kusababisha afe, yaani kumuua. Muundo wa Kiswahili “akawaambia ... wamuue” huwasilisha kwa kawaida kusudi au yaliyomo katika maneno ya Sauli.
- source_word: וִיהוֹנָתָן
  choice: lakini Yonathani
  rationale: Waw hapa inaingiza tofauti kati ya kusudi la Sauli na hisia za Yonathani kwa Daudi; “lakini” huonyesha kazi hiyo ya kiusemi.
- source_word: חָפֵץ בְּדָוִד מְאֹד
  choice: alimpenda sana Daudi
  rationale: חפץ ב־ huonyesha kupendezwa sana, kufurahia, au kuwa na mapenzi kwa mtu. “Alimpenda sana” ni Kiswahili cha asili kinachowasilisha hisia chanya zenye nguvu, huku tanbihi ikihifadhi taswira ya msingi ya kupendezwa au kufurahia.
- source_word: בְּנוֹ / בֶּן־שָׁאוּל
  choice: mwanawe / mwana wa Sauli
  rationale: Misemo yote miwili ya uana imehifadhiwa, kama ilivyo katika Kiebrania, kwa uwazi wa simulizi na msisitizo wa uhusiano.
