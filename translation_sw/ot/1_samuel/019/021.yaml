base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/021.yaml
  text: When they told Saul[a], he sent other messengers, and they also prophesied. Then Saul again sent a third group of messengers[b], and they also prophesied.
translation:
  language: sw
  text: Walipomweleza Sauli, akatuma wajumbe wengine, nao pia wakatabiri. Kisha Sauli akatuma tena kundi la tatu la wajumbe[a], nao pia wakatabiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wa tatu”; yaani, Sauli alituma wajumbe kwa mara ya tatu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: Walipomweleza Sauli
  rationale: Kitenzi נגד katika Hifili humaanisha kueleza au kutoa taarifa. Muundo wa wakati unaunganisha taarifa hiyo kwa kawaida na hatua iliyofuata ya Sauli.
- source_word: מַלְאָכִים אֲחֵרִים
  choice: wajumbe wengine
  rationale: מַלְאָכִים hapa ni watu waliotumwa na Sauli, si malaika; “wajumbe wengine” ni tafsiri wazi na ya kawaida.
- source_word: וַיִּתְנַבְּאוּ גַּם הֵמָּה
  choice: nao pia wakatoa unabii
  rationale: Hitpaeli ya נבא inaonyesha kuingia katika hali au tendo la kinabii. “Wakatoa unabii” huhifadhi maana pana bila kufafanua isivyohitajika namna hasa ya tukio hilo; “nao pia” hudumisha msisitizo wa גַּם הֵמָּה.
- source_word: וַיֹּסֶף שָׁאוּל וַיִּשְׁלַח
  choice: Kisha Sauli akatuma tena
  rationale: יסף pamoja na tendo linalofuata huonyesha kurudia; “akatuma tena” ni Kiswahili cha asili kinachowasilisha maana hiyo.
- source_word: מַלְאָכִים שְׁלִשִׁים
  choice: wajumbe mara ya tatu
  rationale: שְׁלִשִׁים katika muktadha huu hutumika kwa maana ya ordinali, yaani utumaji wa tatu, wala si idadi ya wajumbe thelathini.
theological_decisions:
- issue: Maana ya tendo la kinabii la wajumbe wa Sauli
  choice: wakatoa unabii
  alternative: wakaingia katika hali ya kinabii; wakatenda kama manabii
  rationale: Aya inaonyesha tukio la kinabii lakini haibainishi ikiwa lilikuwa kusema kwa msisimko, kusifu kwa uvuvio, au udhihirisho mwingine. Tafsiri pana huhifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; istilahi ya kinabii imeachwa pana ili kutofafanua zaidi ya Kiebrania.
