translation:
  language: sw
  text: Basi Yonathani akamwita Daudi na kumweleza mambo hayo yote. Kisha Yonathani akamleta Daudi kwa Sauli, naye Daudi akawa mbele ya Sauli kama zamani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kama jana na juzi,” nahau ya Kiebrania yenye maana ya “kama zamani” au “kama hapo awali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akamwita
  rationale: Kitenzi קרא pamoja na לְ kina maana ya kumwita au kumtaka mtu aje. “Akamwita” ni Kiswahili cha kawaida na hakilazimishi wazo la amri rasmi.
- source_word: וַיַּגֶּד
  choice: kumweleza
  rationale: Katika Hifili, נגד humaanisha kufanya jambo lijulikane au kueleza. “Kumweleza” linafaa kwa simulizi na kwa taarifa yote ambayo Yonathani alimpa Daudi.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: mambo hayo yote
  rationale: דבר inaweza kumaanisha neno, jambo, au habari. Katika muktadha huu, “mambo hayo yote” hujumuisha maneno na makusudi ya Sauli kwa Kiswahili cha asili.
- source_word: וַיָּבֵא ... אֶל
  choice: akamleta ... kwa
  rationale: Hifili ya בוא mara nyingi humaanisha kuleta. “Akamleta Daudi kwa Sauli” linaonyesha maana hiyo ya kisababishi bila kuongeza namna alivyompeleka.
- source_word: וַיְהִי לְפָנָיו
  choice: naye akawa mbele yake
  rationale: Nahau hii inaweza kueleza kuwa katika uwepo wa mtu au katika huduma yake. “Akawa mbele yake” huhifadhi upana huo badala ya kuamua wazi kuwa ni uwepo tu au utumishi rasmi.
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: kama zamani
  rationale: Usemi huu wa Kiebrania hurejelea wakati uliopita na kwa kawaida humaanisha “kama hapo awali.” “Kama zamani” ni wa asili na unaeleweka katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo “mbele yake” umeachwa ili kuhifadhi uwezekano wa maana ya kuwapo mbele ya Sauli au kumhudumia.
