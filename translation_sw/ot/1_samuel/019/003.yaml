base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/003.yaml
  text: I will go out and stand beside my father in the field where you are[a], and I will speak to my father about you. Then I will see what happens and tell you.
translation:
  language: sw
  text: Nami nitatoka na kusimama kando ya baba yangu katika shamba ulipo. Nitazungumza na baba yangu kukuhusu, kisha nitaona litakalotokea[a] na kukuambia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “nitaona nini,” usemi uliodondoshwa unaomaanisha “nitaona litakalotokea” au “nitaona hali ilivyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: nitatoka
  rationale: Kitenzi cha Qal kisichotimilika, nafsi ya kwanza umoja, kinaeleza hatua ambayo Yonathani anakusudia kuchukua; “nitatoka” ni Kiswahili cha kawaida na huhifadhi maana ya kwenda nje.
- source_word: וְעָמַדְתִּי לְיַד אָבִי
  choice: na kusimama karibu na baba yangu
  rationale: לְיַד ni nahau yenye maana ya kuwa kando au karibu na mtu. “Kusimama karibu na baba yangu” ni ya asili na inaeleweka wazi katika muktadha.
- source_word: בַּשָּׂדֶה אֲשֶׁר אַתָּה שָׁם
  choice: katika shamba ambako utakuwa
  rationale: Kifungu hiki kinataja mahali Daudi atakapojificha kulingana na agizo la mstari uliotangulia. Wakati ujao unaifanya mfuatano wa mpango huo uwe wazi kwa Kiswahili bila kubadili mahali panaporejelewa.
- source_word: אֲדַבֵּר בְּךָ אֶל אָבִי
  choice: Nitazungumza na baba yangu juu yako
  rationale: Muundo דבר ב pamoja na mtu hapa unamaanisha kuzungumza kumhusu mtu huyo. “Juu yako” huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: וְרָאִיתִי מָה
  choice: kisha nitaona litakalotokea
  rationale: Kiebrania kina usemi uliodondoshwa, kihalisi “nitaona nini.” Kiswahili huhitaji kukamilisha wazo; “litakalotokea” huonyesha matokeo au hali atakayochunguza bila kuyabainisha mapema.
- source_word: וְהִגַּדְתִּי לָךְ
  choice: na kukuambia
  rationale: Hiphil ya נגד humaanisha kujulisha au kutoa taarifa. “Kukuambia” ni usemi wa kawaida unaofaa kwa mazungumzo haya.
