base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/017.yaml
  text: Then Saul said to Michal[a], “Why have you deceived me like this and sent away my enemy, so that he escaped?” And Michal said to Saul, “He said to me, ‘Let me go. Why should I kill you?’”
translation:
  language: sw
  text: Ndipo Sauli akamwambia Mikali, “Kwa nini umenidanganya hivi, ukamwachilia adui yangu, naye akatoroka?” Mikali akamjibu Sauli, “Aliniambia, ‘Niachilie. Kwa nini nikuue?’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri inayoeleza maana iliyodokezwa zaidi, “Niachilie, la sivyo nitakuua.” Kiebrania kinasema kihalisi, “Niachilie. Kwa nini nikuue?”
    reason: alternative_reading
lexical_decisions:
- source_word: רִמִּיתִנִי
  choice: umenidanganya
  rationale: Kitenzi רמה kinaonyesha tendo la kudanganya. ‘Umenidanganya’ ni Kiswahili cha kawaida kinachohifadhi shtaka la Sauli bila kuongeza wazo mahususi la usaliti.
- source_word: כָּכָה
  choice: hivi
  rationale: Neno hili huonyesha namna ya tendo; ‘hivi’ ni la kawaida na linafaa katika swali la Sauli.
- source_word: וַתְּשַׁלְּחִי
  choice: ukamwachilia
  rationale: שלח hapa inamaanisha kumruhusu mtu aondoke au kumwacha aende. ‘Ukamwachilia’ linaeleza tendo la Mikali la kumwezesha Daudi kuondoka na pia linaweza kurudiwa kwa kawaida katika usemi wa mwisho.
- source_word: אֹיְבִי
  choice: adui yangu
  rationale: Huhifadhi moja kwa moja jina la uhasama ambalo Sauli anampa Daudi.
- source_word: וַיִּמָּלֵט
  choice: naye akatoroka
  rationale: Nifali ya מלט ina maana ya kutoroka. Kiunganishi ‘naye’ kinahifadhi mfuatano na matokeo ya tendo bila kuufanya wazi kuwa kusudi.
- source_word: שַׁלְּחִנִי
  choice: Niachilie
  rationale: Amri hii ya שלח yenye kiambishi cha nafsi ya kwanza inaomba kuachwa aende. ‘Niachilie’ ni fupi, ya moja kwa moja, na inadumisha uhusiano wa kimsamiati na ‘ukamwachilia’.
- source_word: לָמָה אֲמִיתֵךְ
  choice: Kwa nini nikuue?
  rationale: Hii ndiyo maana ya moja kwa moja ya Kiebrania. Tafsiri inahifadhi swali lenyewe na haiongezi maneno kama ‘la sivyo,’ ingawa katika muktadha linaweza kudokeza tishio.
- source_word: מִיכַל
  choice: Mikali
  rationale: Jina limetoholewa kwa umbo linalotumika katika mapokeo ya kawaida ya Biblia ya Kiswahili.
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Jina limetoholewa kwa umbo linalotumika katika mapokeo ya kawaida ya Biblia ya Kiswahili.
theological_decisions:
- issue: Usemi unaoripotiwa kuwa wa Daudi katika jibu la Mikali
  choice: ‘Niachilie. Kwa nini nikuue?’
  alternative: ‘Niachilie, la sivyo nitakuua.’
  rationale: Kiebrania kina amri ikifuatiwa na swali la למה pamoja na kitenzi cha nafsi ya kwanza. Hakina maneno ya wazi yanayomaanisha ‘la sivyo.’ Tafsiri inahifadhi maneno na mvutano wa chanzo, huku tanbihi ikieleza maana inayoweza kudokezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na wenye heshima. ‘Mikali akamjibu Sauli’ limetumiwa badala ya kurudia ‘akasema’ ili sentensi iwe ya asili bila kubadili maana. Alama ya tanbihi imewekwa baada ya usemi unaohusika.
