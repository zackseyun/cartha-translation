translation:
  language: sw
  text: Sauli akajaribu kumbandika Daudi ukutani kwa mkuki, lakini Daudi akakwepa mbele ya Sauli, naye Sauli akaupigiza mkuki ukutani. Kisha Daudi akakimbia na kuponyoka usiku ule.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַכּוֹת בַּחֲנִית בְּדָוִד וּבַקִּיר
  choice: kumchoma Daudi kwa mkuki na kumbandika ukutani
  rationale: Muundo wa Kiebrania unaeleza jaribio la kumpiga Daudi kwa mkuki mpaka ukutani; tafsiri hii ya Kiswahili inaonyesha kwa kawaida kusudi la kumchoma na kumbandika ukutani bila kudhoofisha ukatili wa tendo.
- source_word: וַיִּפְטַר מִפְּנֵי שָׁאוּל
  choice: Daudi akakwepa mbele yake
  rationale: Kitenzi kinaonyesha Daudi alijiondoa au akakwepa kutoka mbele ya Sauli; ‘akakwepa’ ni ya kawaida na inafaa katika tukio la shambulio la ghafla.
- source_word: וַיִּמָּלֵט
  choice: kuponyoka
  rationale: Neno lina maana ya kuokoka au kutoroka hatari; ‘kuponyoka’ linaonyesha wazi kwamba Daudi alinusurika na shambulio hilo.
- source_word: בַּלַּיְלָה הוּא
  choice: usiku ule
  rationale: Kirai hiki kinarejelea usiku maalumu wa tukio hilo, kwa hiyo ‘usiku ule’ ni Kiswahili cha kawaida na sahihi.
theological_decisions:
- issue: Mhusika wa tendo la kuuchoma mkuki ukutani
  choice: naye Sauli akauchoma mkuki ukutani
  alternative: naye akauchoma mkuki ukutani
  rationale: Kiebrania hubadili kutoka Daudi aliyekwepa hadi mhusika anayepiga mkuki bila kurudia jina; muktadha unaonyesha kuwa Sauli ndiye aliyeuchoma mkuki ukutani. Kutaja jina kunazuia utata usio wa maana katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha masimulizi, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa vitenzi mfululizo umehifadhi kasi ya tukio.
