base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/023.yaml
  text: So he went there[a], to Naioth in Ramah, and the Spirit of God came upon him also; and he went on, prophesying[b], until he came to Naioth in Ramah.
translation:
  language: sw
  text: Basi akaenda huko, kuelekea Naiothi katika Rama[a]. Roho wa Mungu akaja juu yake pia[b], naye akaendelea na safari yake huku akitoa unabii, mpaka alipofika Naiothi katika Rama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Naiothi huko Rama.”
    reason: lexical_alternative
  - marker: b
    text: Au, “roho ya Mungu ilikuwa juu yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נוית בָּרָמָה
  choice: Naiothi huko Rama
  rationale: Jina la mahali נוית limetoholewa kuwa “Naiothi,” na בָּרָמָה limetafsiriwa kwa Kiswahili cha kawaida kuwa “huko Rama,” kikionyesha kuwa Naiothi ilikuwa Rama au katika eneo lake.
- source_word: וַתְּהִי עָלָיו ... רוּחַ אֱלֹהִים
  choice: Roho wa Mungu akamjia
  rationale: Muundo היה על pamoja na רוּחַ unaeleza Roho kumjia au kuwa juu ya mtu. “Akamjia” ni ya asili katika Kiswahili na inaonyesha tukio hilo bila kulifafanua kupita maandishi.
- source_word: גַּם הוּא
  choice: yeye pia
  rationale: Huhifadhi msisitizo wa nyongeza kwamba Sauli pia alipata yaliyowapata wajumbe waliotangulia.
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: akaendelea kwenda
  rationale: Kitenzi pamoja na kitenzi-jina halisi huonyesha tendo linaloendelea; “akaendelea kwenda” huwasilisha hali hiyo kwa Kiswahili cha kawaida.
- source_word: וַיִּתְנַבֵּא
  choice: huku akitoa unabii
  rationale: Huhifadhi maana pana ya kutenda au kunena kinabii chini ya ushawishi wa Mungu bila kudai kwamba ilikuwa jazba au aina nyingine maalumu ya tabia.
- source_word: עַד בֹּאוֹ
  choice: mpaka alipofika
  rationale: Muundo huu wa wakati umetafsiriwa kama kishazi cha kawaida cha Kiswahili kinachoonyesha mwisho wa tendo linaloendelea.
- source_word: שָׁם
  choice: huko
  rationale: Huhifadhi rejeo la mazungumzo kwa mahali palipotajwa katika muktadha uliotangulia.
theological_decisions:
- issue: Ikiwa רוּחַ אֱלֹהִים itafsiriwe kama Roho binafsi wa Mungu au roho fulani itokayo kwa Mungu
  choice: Roho wa Mungu
  alternative: roho ya Mungu
  rationale: Katika simulizi hili, kirai hicho kinaelekea kumaanisha Roho wa Mungu anayemwezesha mtu. Kiswahili “Roho wa Mungu” huonyesha rejeo hilo linalowezekana sana bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Jinsi ya kueleza tendo la Sauli la kinabii bila kulifafanua kupita kiasi
  choice: akitoa unabii
  alternative: akitenda kama nabii
  rationale: Maandishi yanasema alifanya tendo la kinabii lakini hayaelezi namna yake hasa. “Akitoa unabii” huhifadhi upana na mvutano huo badala ya kuingiza wazo la jazba ya kinabii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Mfululizo wa vitenzi umehifadhi mwendo wa simulizi, huku “akaendelea kwenda huku akitoa unabii” ukionyesha matendo yanayoendelea kwa pamoja.
