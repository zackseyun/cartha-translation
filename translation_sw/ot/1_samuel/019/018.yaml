translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kawaida na hadhi inayofaa maandiko. Mfululizo wa ‘aka-/waka-’ umetumiwa kuakisi maendeleo ya matukio katika simulizi la Kiebrania. Alama ya tanbihi imewekwa baada ya ‘Nayothi,’ neno ambalo tanbihi inalifafanua.
