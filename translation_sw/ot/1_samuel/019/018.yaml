base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/018.yaml
  text: David fled and escaped[a], and he came to Samuel at Ramah and told him all that Saul had done to him. Then he and Samuel went and stayed at Naioth.
translation:
  language: sw
  text: Daudi akakimbia na kuponyoka, akamwendea Samweli huko Rama na kumwambia yote ambayo Sauli alikuwa amemtendea. Kisha yeye na Samweli wakaenda kukaa Naiothi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Naiothi ni jina la mahali; huenda linarejelea makao au eneo la makazi lililohusishwa na Rama.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרַח וַיִּמָּלֵט
  choice: akakimbia na kuponyoka
  rationale: Vitenzi hivi viwili vinaonyesha kukimbia hatari na kufanikiwa kuiepuka; ‘kuponyoka’ hahusishi moja kwa moja wazo la ukombozi wa kimungu ambalo mstari hautaji.
- source_word: וַיָּבֹא אֶל שְׁמוּאֵל הָרָמָתָה
  choice: akamwendea Samueli huko Rama
  rationale: Kiambishi cha mwelekeo katika הָרָמָתָה kinaonyesha kuelekea Rama, huku Samueli akiwa mtu aliyefuatwa; Kiswahili hiki ni cha kawaida na huhifadhi mambo yote mawili.
- source_word: וַיַּגֶּד לוֹ
  choice: na kumweleza
  rationale: Hiphil ya נגד hapa ina maana ya kumwambia au kumpa taarifa; ‘kumweleza’ inafaa simulizi la Kiswahili la sasa.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה לוֹ שָׁאוּל
  choice: yote ambayo Sauli alikuwa amemtendea
  rationale: ‘Yote’ huhifadhi ukamilifu wa כָּל, na ‘alikuwa amemtendea’ huonyesha kwamba matendo hayo yalitangulia taarifa ya Daudi.
- source_word: וַיֵּלֶךְ הוּא וּשְׁמוּאֵל
  choice: Kisha yeye na Samueli wakaenda
  rationale: Kiwakilishi cha wazi הוּא kimehifadhiwa kwa ‘yeye,’ na ‘Kisha’ huonyesha mfuatano wa matukio bila kuongeza neno la wakati mwanzoni mwa mstari.
- source_word: וַיֵּשְׁבוּ
  choice: kukaa
  rationale: Katika muktadha wa safari, ישׁב ina maana ya kukaa au kufanya makao kwa muda, si kuketi tu.
- source_word: בְנוית
  choice: Nayothi
  rationale: Limewasilishwa kama jina la mahali kwa unukuzi unaofaa matamshi ya Kiswahili.
