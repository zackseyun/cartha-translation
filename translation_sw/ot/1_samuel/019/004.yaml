base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/004.yaml
  text: Jonathan spoke well of David to Saul his father[a], and said to him, “Let not the king sin against his servant David, because he has not sinned against you[b], and because his deeds have been very good for you.”
translation:
  language: sw
  text: Yonathani akasema mema kuhusu Daudi kwa Sauli, baba yake[a], akamwambia, “Mfalme asitende dhambi dhidi ya mtumishi wake, dhidi ya Daudi[b], kwa sababu Daudi hakukutendea dhambi, na matendo yake yamekuwa mema sana kwako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akazungumza kwa kumpendelea Daudi.” Nahau ya Kiebrania, kwa tafsiri ya karibu, ni “alisema mema kuhusu Daudi.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinarudia kihusishi: “dhidi ya mtumishi wake, dhidi ya Daudi,” ili kumtambulisha na kumkazia Daudi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... בְּדָוִד טוֹב
  choice: akasema mema kumhusu Daudi
  rationale: Hii ni nahau yenye maana ya kusema kwa upendeleo au kwa sifa kuhusu mtu. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi utetezi chanya wa Yonathani bila kutumia tafsiri ngumu ya neno kwa neno.
- source_word: אֶל שָׁאוּל אָבִיו
  choice: kwa Sauli baba yake
  rationale: “Kwa” inaonyesha kwamba maneno hayo yalielekezwa kwa Sauli, huku mpangilio wa Kiebrania wa jina na uhusiano ukihifadhiwa kwa namna inayoeleweka.
- source_word: אַל יֶחֱטָא הַמֶּלֶךְ
  choice: Mfalme asitende dhambi
  rationale: Muundo wa kukataza unaonyesha ombi lenye heshima katika mazingira ya kifalme. Kutaja “Mfalme” kwa nafsi ya tatu kunadumisha namna ya heshima ya Kiebrania.
- source_word: בְּעַבְדּוֹ בְדָוִד
  choice: dhidi ya mtumishi wake Daudi
  rationale: Kihusishi ב pamoja na חטא hapa kina maana ya kumtendea mtu dhambi. “Daudi” linamtambulisha mtumishi; urudiaji wa kihusishi katika Kiebrania umeelezwa katika tanbihi.
- source_word: כִּי לֹא חָטָא לָךְ
  choice: kwa sababu Daudi hakukutendea dhambi
  rationale: Tafsiri inadumisha mzizi wa wazo la “dhambi” uliotumiwa katika kishazi kilichotangulia na hivyo kuhifadhi ulinganisho wa hoja ya Yonathani. Jina “Daudi” limetumiwa badala ya kiwakilishi ili kuzuia utata wa marejeo katika Kiswahili.
- source_word: וְכִי מַעֲשָׂיו טוֹב לְךָ מְאֹד
  choice: na matendo yake yamekuwa mema sana kwako
  rationale: Hii inahifadhi sababu ya pili katika hoja ya Yonathani na kueleza wazi kwamba matendo ya Daudi yalikuwa yenye manufaa kwa Sauli, bila kuongeza maana isiyokuwapo katika chanzo.
