    issue: “akalala hivyo” specifies sleep.
    rationale: וַיִּפֹּל עָרוֹם with the all-day-and-night duration describes Saul as fallen/lying naked; it does not state that he slept. The added verb narrows the event beyond the Hebrew.
  - severity: low
    issue: The clothing lexical alternative lacks its own footnote anchor, while the extant note concerns “uchi.”
    rationale: The source audit trail distinguishes the alternative for removing clothes from the ambiguity of עָרוֹם. Separate Swahili notes anchored to “mavazi” and “uchi” preserve both alternatives clearly.
