  text: וַ/יִּפְשַׁ֨ט גַּם ה֜וּא בְּגָדָ֗י/ו וַ/יִּתְנַבֵּ֤א גַם הוּא֙ לִ/פְנֵ֣י שְׁמוּאֵ֔ל וַ/יִּפֹּ֣ל עָרֹ֔ם כָּל הַ/יּ֥וֹם הַ/ה֖וּא וְ/כָל הַ/לָּ֑יְלָה עַל כֵּן֙ יֹֽאמְר֔וּ הֲ/גַ֥ם שָׁא֖וּל בַּ/נְּבִיאִֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/024.yaml
  text: He too stripped off his clothes[a], and he too prophesied before Samuel. He lay naked all that day and all that night. Therefore they say[b], “Is Saul also among the prophets?”
translation:
  language: sw
  text: Yeye pia akavua mavazi yake[a], naye pia akatabiri mbele ya Samweli. Akaanguka akiwa uchi[b], akabaki hivyo siku hiyo yote na usiku huo wote. Kwa hiyo watu husema, “Je, Sauli pia yumo miongoni mwa manabii?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akavua nguo zake.”
    reason: lexical_alternative
  - marker: b
    text: Neno “uchi” linaweza kumaanisha kutokuwa na nguo kabisa au kuwa amevua mavazi ya nje; Kiebrania hakifafanui zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁט ... בְּגָדָיו
  choice: akavua mavazi yake
  rationale: Kitenzi פשט pamoja na בְּגָדִים humaanisha kuondoa mavazi. “Akavua mavazi yake” ni Kiswahili cha kawaida na chenye heshima, bila kuongeza namna alivyoyavua.
- source_word: גַּם הוּא ... גַם הוּא
  choice: Yeye pia ... naye pia
  rationale: Urudiaji wa Kiebrania unasisitiza kwamba Sauli mwenyewe alipata yaliyowapata wajumbe waliomtangulia; urudiaji huo umehifadhiwa kwa Kiswahili cha asili.
- source_word: וַיִּתְנַבֵּא
  choice: akatabiri
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa shughuli ya kinabii. Halibainishi ikiwa ilikuwa kusema mambo yajayo, kunena kwa uvuvio, au hali nyingine ya kinabii.
- source_word: לִפְנֵי שְׁמוּאֵל
  choice: mbele ya Samweli
  rationale: לִפְנֵי hapa humaanisha akiwa katika uwepo wa Samweli; “mbele ya Samweli” ni tafsiri fupi na ya moja kwa moja.
- source_word: וַיִּפֹּל עָרֹם
  choice: Akaanguka akiwa uchi, akalala hivyo
  rationale: “Akaanguka” huhifadhi maana ya msingi ya נפל, na “akalala hivyo” huonyesha kwa Kiswahili cha kawaida hali iliyoendelea siku nzima na usiku mzima. “Uchi” huhifadhi nguvu ya עָרֹם bila kuipunguza.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: siku hiyo yote na usiku huo wote
  rationale: Tafsiri hii huhifadhi msisitizo wa muda wote wa mchana na wa usiku.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: Kwa hiyo watu husema
  rationale: Kauli hii inaanzisha msemo uliojulikana. “Watu husema” huwasilisha wingi usiotajwa kwa jina kwa Kiswahili cha kawaida.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִם
  choice: Je, Sauli pia yumo miongoni mwa manabii?
  rationale: Hii huhifadhi swali la kimsemo na maana ya kuwa miongoni mwa kundi la manabii.
theological_decisions:
- issue: Maana ya hali ya Sauli ya kuwa עָרֹם
  choice: akiwa uchi
  alternative: akiwa amevua mavazi ya nje tu
  rationale: עָרֹם kwa kawaida humaanisha “uchi,” lakini muktadha hauamui kwa uhakika kiwango cha kutokuwa na nguo. Maandishi makuu yanatumia maana ya moja kwa moja, huku tanbihi ikihifadhi uwezekano wa kuwa alivua mavazi ya nje tu.
- issue: Asili ya shughuli ya kinabii ya Sauli
  choice: akatabiri
  alternative: akaingia katika hali ya msisimko wa kinabii / akatenda kama nabii
  rationale: Mstari hautaji kwa usahihi shughuli hiyo ilihusisha nini. “Akatabiri” huhifadhi mvutano huo bila kuamua kwamba Sauli alitabiri mambo yajayo au kwamba alifanya tu vitendo vya msisimko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtiririko wa masimulizi umehifadhiwa kwa vitenzi vya mfululizo, na swali la mwisho limetolewa kama msemo unaotumiwa na watu.
