  text: וַֽ/יַּעֲל֖וּ הָ/עִ֑יר הֵ֗מָּה בָּאִים֙ בְּ/ת֣וֹךְ הָ/עִ֔יר וְ/הִנֵּ֤ה שְׁמוּאֵל֙ יֹצֵ֣א לִ/קְרָאתָ֔/ם לַ/עֲל֖וֹת הַ/בָּמָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/014.yaml
  text: So they went up to the city. As they were entering the city[a], behold, Samuel was coming out to meet them, to go up to the high place.
translation:
  language: sw
  text: Wakapanda kwenda mjini. Walipokuwa wakiingia mjini[a], tazama, Samweli alikuwa akitoka ili akutane nao, ili apande kwenda mahali pa juu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katikati ya mji.” Kiebrania kinasema “ndani ya/katikati ya mji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: wakapanda kwenda
  rationale: Kitenzi עלה kinaonyesha kwenda juu; muundo huu wa Kiswahili ni wa kawaida na unahifadhi mwelekeo wa kupanda kuelekea mjini.
- source_word: הָעִיר
  choice: mjini
  rationale: עיר ni mji au jiji. Katika muktadha huu, 'mjini' ni usemi wa asili wa Kiswahili unaoonyesha mahali walipokuwa wakielekea.
- source_word: הֵמָּה בָּאִים
  choice: walipokuwa wakiingia
  rationale: Kiwakilishi huru pamoja na participle kinaonyesha tendo lililokuwa likiendelea; 'walipokuwa wakiingia' linaonyesha kwamba kuonekana kwa Samweli kulitokea wakati huo.
- source_word: בְּתוֹךְ הָעִיר
  choice: mjini
  rationale: בְּתוֹךְ kwa neno kwa neno ni 'katikati ya/ndani ya,' lakini hapa kwa kawaida humaanisha kuingia ndani ya mji. Uwezekano wa maana halisi zaidi umehifadhiwa katika tanbihi.
- source_word: וְהִנֵּה
  choice: tazama
  rationale: הנה huvuta fikira kwenye jambo la ghafla au muhimu katika simulizi; 'tazama' huhifadhi msisitizo huo.
- source_word: יֹצֵא
  choice: alikuwa akitoka
  rationale: Participle ya יצא inaonyesha tendo lililokuwa likiendelea; 'alikuwa akitoka' linahifadhi hali hiyo.
- source_word: לִקְרָאתָם
  choice: kuwalaki
  rationale: לקראת ina maana ya kuelekea watu ili kukutana nao. 'Kuwalaki' ni Kiswahili fasaha na cha kawaida kwa kutoka ili kukutana na wanaokuja.
- source_word: לַעֲלוֹת
  choice: ili apande kwenda
  rationale: Infinitive hii inaonyesha kusudi la Samweli na inadumisha wazo la kupanda.
- source_word: הַבָּמָה
  choice: mahali pa juu
  rationale: במה ni mahali pa ibada palipoinuka au 'high place.' 'Mahali pa juu' huhifadhi istilahi ya kihistoria ya kidini bila kuibadili moja kwa moja kuwa 'hekalu' au 'mahali patakatifu.'
theological_decisions:
- issue: Tafsiri ya mahali pa ibada במה
  choice: mahali pa juu
  alternative: mahali pa ibada palipoinuka
  rationale: '''Mahali pa juu'' huhifadhi aina maalumu ya mahali pa ibada katika Israeli ya kabla ya hekalu bila kuingiza hukumu ya baadaye kuhusu uhalali wake.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Simulizi limetolewa kwa lugha inayoeleweka kwa wasomaji wa kawaida, huku 'tazama' na 'mahali pa juu' zikihifadhi uzito wa kifasihi na istilahi ya chanzo.
