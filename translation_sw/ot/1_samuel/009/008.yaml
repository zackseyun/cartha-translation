  yaml_path: translation/ot/1_samuel/009/008.yaml
  text: The young man answered Saul again and said[a], “Look, I have in my hand a quarter shekel of silver. I will give it to the man of God, and he will tell us our way.”
translation:
  language: sw
  text: Kijana akamjibu Sauli tena, akasema, “Tazama, nina robo shekeli ya fedha mkononi mwangu. Nitampa mtu wa Mungu, naye atatuambia njia yetu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “njia tunayopaswa kufuata.” Kiebrania kinasema “njia yetu,” jambo linaloweza kumaanisha njia iliyo mbele yao au hatua wanayopaswa kuchukua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף הַנַּעַר לַעֲנוֹת
  choice: Kijana akamjibu Sauli tena
  rationale: Muundo יסף + kitenzi-jina unaonyesha kurudia au kuendelea kufanya jambo. “Akamjibu ... tena” ni Kiswahili cha kawaida kinachohifadhi maana hiyo; “kijana” pia hudumisha upana wa maana wa נער bila kuamua wazi kuwa ni mtumishi.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili huvuta fikira kwa jambo linalofuata. “Tazama” ni la heshima, linaeleweka, na linafaa katika simulizi la Biblia.
- source_word: נִמְצָא בְיָדִי
  choice: nina ... mkononi mwangu
  rationale: Ingawa Kiebrania kinasema kwa karibu “inapatikana mkononi mwangu,” usemi huu humaanisha kumiliki au kuwa nacho. Tafsiri hii ni ya asili kwa Kiswahili na bado inahifadhi picha ya kitu kilicho mkononi.
- source_word: רֶבַע שֶׁקֶל כָּסֶף
  choice: robo shekeli ya fedha
  rationale: Hii ni robo ya kipimo cha uzito cha shekeli katika fedha. Usemi huu ni mfupi na sahihi bila kubadili thamani kuwa sarafu ya kisasa.
- source_word: וְנָתַתִּי לְאִישׁ הָאֱלֹהִים
  choice: Nitamtolea mtu wa Mungu
  rationale: Kitenzi kinaonyesha nia ya kutoa fedha hiyo. “Mtu wa Mungu” huhifadhi cheo cha kawaida cha Kiebrania bila kukipanua moja kwa moja kuwa “nabii.”
- source_word: וְהִגִּיד לָנוּ
  choice: naye atatuambia
  rationale: Hifili ya נגד hapa ina maana ya kuwaambia au kuwajulisha. “Atatuambia” ni ya kawaida na inafaa katika muktadha.
- source_word: אֶת דַּרְכֵּנוּ
  choice: njia yetu
  rationale: 'Tafsiri ya moja kwa moja inadumisha utata halisi: inaweza kumaanisha njia ya safari au hatua wanayopaswa kuchukua.'
