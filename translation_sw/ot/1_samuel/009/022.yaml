  text: וַ/יִּקַּ֤ח שְׁמוּאֵל֙ אֶת שָׁא֣וּל וְ/אֶֽת נַעֲר֔/וֹ וַ/יְבִיאֵ֖/ם לִשְׁכָּ֑תָ/ה וַ/יִּתֵּ֨ן לָ/הֶ֤ם מָקוֹם֙ בְּ/רֹ֣אשׁ הַ/קְּרוּאִ֔ים וְ/הֵ֖מָּה כִּ/שְׁלֹשִׁ֥ים אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/022.yaml
  text: Then Samuel took Saul and his young man and brought them into the hall[a], and gave them a place at the head of those who had been invited[c][b]; and they were about thirty men.
translation:
  language: sw
  text: Kisha Samueli akamchukua Sauli na mtumishi wake[a], akawaingiza katika ukumbi[b], na kuwapa mahali pa mbele miongoni mwa walioalikwa. Nao walikuwa wanaume wapatao thelathini.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kijana wake” au “msaidizi wake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika chumba.” Neno la Kiebrania linaweza kumaanisha chumba au ukumbi; hapa huenda linamaanisha mahali palipotumiwa kwa karamu.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “nao walikuwa wanaume wapatao thelathini.” Huenda “wao” inawarejelea walioalikwa.'
    reason: referential_ambiguity
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: mtumishi wake
  rationale: Katika muktadha wa simulizi, neno hili linamtaja kijana aliyekuwa akiandamana na Sauli akiwa chini yake. “Mtumishi wake” ni Kiswahili cha kawaida na cha asili zaidi hapa; tanbihi huhifadhi maana mbadala ya “kijana wake” au “msaidizi wake.”
- source_word: לִשְׁכָּתָה
  choice: katika ukumbi
  rationale: Neno hilo linaweza kumaanisha chumba au ukumbi. Kwa kuwa hapa kuna karamu yenye karibu watu thelathini, “ukumbi” linafaa kwa mazingira hayo bila kudai ukubwa mahususi kupita ushahidi.
- source_word: מָקוֹם
  choice: nafasi
  rationale: Maana ya msingi ni mahali au nafasi. Katika mpangilio wa karamu, “nafasi” huonyesha mahali walipopangiwa bila kubadili neno hilo kuwa “kiti.”
- source_word: בְּרֹאשׁ
  choice: ya heshima mbele
  rationale: Kirai cha Kiebrania ni “kichwani/mbele” na huonyesha nafasi ya kwanza au yenye heshima. Kiswahili “nafasi ya heshima mbele” huwasilisha umaarufu huo kwa uwazi na kwa lugha ya kawaida.
- source_word: הַקְּרוּאִים
  choice: wale walioalikwa
  rationale: Katika muktadha wa karamu, kauli tendwa ya קרא inamaanisha walioitwa, yaani walioalikwa. “Wale walioalikwa” ni sahihi na asilia.
- source_word: וְהֵמָּה כִּשְׁלֹשִׁים אִישׁ
  choice: Nao walioalikwa walikuwa wanaume wapatao thelathini
  rationale: Kiwakilishi cha wingi huenda kinawarejelea walioalikwa waliotajwa mara moja kabla. Kurudia “walioalikwa” huondoa utata usio wa lazima katika Kiswahili, huku tanbihi ikieleza muundo halisi wa Kiebrania. אִישׁ imetafsiriwa “wanaume.”
- source_word: וַיִּקַּח
  choice: akamchukua
  rationale: לקח kwa kawaida ni kuchukua. Mfuatano unaofuata unaonyesha kuwa Samueli aliwaongoza Sauli na mtumishi wake kwenda ndani.
- source_word: וַיְבִיאֵם
  choice: akawaingiza
  rationale: Hifili ya בוא humaanisha kuleta au kuingiza. Kwa kuwa lengo ni ndani ya ukumbi, “akawaingiza” ni fupi, wazi, na asilia.
