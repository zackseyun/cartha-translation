translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Viunganishi vya mfululizo vimehifadhi mwendo wa masimulizi, huku sentensi ya mwisho ikifafanuliwa kwa kiasi ili rejeleo la kiwakilishi lieleweke. Alama zote za tanbihi zimewekwa katika matini kuu.
