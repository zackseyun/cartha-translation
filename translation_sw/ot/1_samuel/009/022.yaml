revisions:
- from: Kisha Samueli akamchukua Sauli pamoja na mtumishi wake[a], akawaingiza katika ukumbi[b], na kuwapa nafasi ya heshima mbele ya wale walioalikwa. Nao walioalikwa walikuwa wanaume wapatao thelathini.[c]
  to: Kisha Samueli akamchukua Sauli na mtumishi wake[a], akawaingiza katika ukumbi[b], na kuwapa mahali pa mbele miongoni mwa walioalikwa. Nao walikuwa wanaume wapatao thelathini.[c]
  rationale: The revision retains the source’s ambiguous pronoun in the final clause rather than specifying its likely antecedent in the text. It also renders the seating position as being at the foremost place among the invited guests, more closely reflecting the Hebrew construction while remaining natural in Standard East African Swahili.
