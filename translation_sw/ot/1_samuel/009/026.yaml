base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/026.yaml
  text: They rose early[a], and when the dawn was breaking, Samuel called to Saul on the roof, saying, “Get up, and I will send you on your way.” So Saul got up, and the two of them, he and Samuel[b], went outside.
translation:
  language: sw
  text: Wakaamka mapema, na alfajiri ilipoanza kuchomoza[a], Samweli akamwita Sauli juu ya paa, akisema, “Inuka, nami nitakuruhusu uende zako[b].” Basi Sauli akainuka, nao wawili—yeye na Samweli—wakatoka nje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa karibu zaidi na muundo wa Kiebrania: “wakati alfajiri ilipokuwa ikichomoza.”'
    reason: lexical_alternative
  - marker: b
    text: Au “nami nitakutuma uende zako” au “nami nitakuaga uende zako.” Kiebrania humaanisha kumtuma mtu aondoke au kumuaga aende.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: Wakaamka mapema
  rationale: Kitenzi hiki katika muundo wa Hifili mara nyingi humaanisha kuamka au kuanza shughuli mapema; tafsiri hii ni ya kawaida na inadumisha msisitizo wa wakati.
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: alfajiri ilipoanza kuchomoza
  rationale: Huhifadhi taswira halisi ya alfajiri ‘kupanda/kuchomoza’ huku ikisomeka kwa Kiswahili cha kawaida.
- source_word: הַגָּג
  choice: huko juu ya paa
  rationale: Inarejelea paa tambarare la nyumba, mahali Sauli alipokuwa amelala; ‘juu ya paa’ ni wazi katika muktadha.
- source_word: קוּמָה
  choice: Inuka
  rationale: Ni amri ya kusimama au kuondoka alipolala, na ‘Inuka’ ni ya moja kwa moja na yenye hadhi.
- source_word: וַאֲשַׁלְּחֶךָּ
  choice: nami nitakuaga uende zako
  rationale: שורש שׁלח hapa inaweza kumaanisha kumruhusu mtu aondoke au kumsindikiza kwa maneno ya kuaga; uchaguzi huu unaonyesha kuondoka kwa heshima bila ukali wa ‘kukufukuza.’
- source_word: וַיֵּצְאוּ ... הַחוּצָה
  choice: wakatoka nje
  rationale: Huonyesha kutoka kuelekea nje bila kuongeza mahali mahsusi kama barabarani.
- source_word: שְׁנֵיהֶם הוּא וּשְׁמוּאֵל
  choice: nao wawili—yeye na Samweli
  rationale: Inadumisha msisitizo na umbo la ufafanuzi la Kiebrania; kiwakilishi ‘yeye’ kinamrejelea Sauli aliyetajwa mara moja kabla.
