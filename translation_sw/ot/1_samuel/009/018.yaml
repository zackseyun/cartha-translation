base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/018.yaml
  text: Then Saul approached Samuel in the midst of the gate and said[b][a], “Please tell me where the seer’s house is.”
translation:
  language: sw
  text: Ndipo Sauli akamkaribia Samweli katikati ya lango, akasema, “Tafadhali niambie nyumba ya mwonaji[a] iko wapi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mwonaji” ni jina la zamani la mtu ambaye baadaye aliitwa kwa kawaida “nabii”; simulizi lenyewe linaeleza jambo hili katika 1 Samweli 9:9.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: akamkaribia
  rationale: Kitenzi hiki kinaonyesha Sauli akienda karibu na Samweli; ‘akamkaribia’ ni Kiswahili cha kawaida na huhifadhi mwelekeo wa tendo kwa mtu.
- source_word: בְּתוֹךְ הַשָּׁעַר
  choice: katikati ya lango
  rationale: Huhifadhi maana halisi ya kuwa ndani au katikati ya lango; katika muktadha huu ‘lango’ linaweza kumaanisha sehemu nzima ya kuingilia mjini, si mlango unaofunguka pekee.
- source_word: הַגִּידָה נָּא לִי
  choice: Tafadhali niambie
  rationale: ‘Tafadhali’ huwakilisha chembe ya ombi la heshima נָא, huku ‘niambie’ ikitoa agizo kwa Kiswahili cha kawaida.
- source_word: אֵי זֶה
  choice: iko wapi
  rationale: Katika muktadha, usemi huu unauliza mahali nyumba ilipo; ‘iko wapi’ ni swali la kawaida na wazi kwa Kiswahili.
- source_word: בֵּית הָרֹאֶה
  choice: nyumba ya mwonaji
  rationale: Muundo huu unafuata uhusiano wa maneno ya Kiebrania kwa Kiswahili cha kawaida. ‘Mwonaji’ huhifadhi istilahi ya zamani inayotofautishwa na ‘nabii’ katika simulizi.
theological_decisions:
- issue: Uhusiano wa ‘mwonaji’ na ‘nabii’
  choice: Kudumisha ‘mwonaji’ katika aya
  alternative: nabii
  rationale: Aya ya 9 inaeleza kwamba mtu aliyeitwa ‘nabii’ baadaye aliitwa ‘mwonaji’ zamani. Kutumia ‘nabii’ hapa kungefuta tofauti hiyo ya kihistoria iliyokusudiwa na simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mwendo wa simulizi kwa ‘Ndipo’ na mfululizo wa vitenzi ‘akamkaribia ... akasema.’ ‘Katikati ya lango’ imeachwa kwa hali yake thabiti ili kutofafanua kupita kiasi ikiwa ni lango lenyewe au eneo pana la lango.
