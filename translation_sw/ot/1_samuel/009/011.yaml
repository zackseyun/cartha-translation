base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/011.yaml
  text: As they were going up the ascent to the city[a], they found young women coming out to draw water, and they said to them, “Is the seer here?”
translation:
  language: sw
  text: Walipokuwa wakipanda njia ya kupanda kuelekea mjini, walikutana na wasichana waliokuwa wakitoka kwenda kuchota maji. Wakawauliza, “Je, mwonaji[a] yupo hapa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nabii.” Kiebrania kinasema hasa “mwonaji,” neno la zamani kwa yule ambaye baadaye aliitwa nabii.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלִים
  choice: walipokuwa wakipanda
  rationale: Kiambishi cha wakati pamoja na kitenzi cha hali inayoendelea kinaonyesha tendo lililokuwa likiendelea; tafsiri hii ni ya kawaida na wazi katika masimulizi ya Kiswahili.
- source_word: בְּמַעֲלֵה הָעִיר
  choice: njia ya mwinuko kuelekea mjini
  rationale: מַעֲלֶה humaanisha sehemu au njia ya kupandia; usemi huu unahifadhi maelezo ya kijiografia bila kufanya Kiswahili kuwa kigumu.
- source_word: מָצְאוּ
  choice: walikutana na
  rationale: Ingawa maana ya msingi ni 'walipata,' katika muktadha huu kitenzi kinaeleza kukutana na watu njiani; 'walikutana na' ni Kiswahili cha asili na sahihi kwa tukio hili.
- source_word: נְעָרוֹת
  choice: wasichana
  rationale: Neno hili linataja vijana wa kike. 'Wasichana' ni neno la kawaida la Kiswahili na halina mtindo wa kizamani.
- source_word: יֹצְאוֹת לִשְׁאֹב מָיִם
  choice: waliokuwa wakitoka kwenda kuteka maji
  rationale: Kirai kinaonyesha tendo linaloendelea na kusudi lake. 'Kuteka maji' ni usemi wa kawaida wa Kiswahili kwa kuchota maji kisimani au kwenye chanzo.
- source_word: הֲיֵשׁ בָּזֶה
  choice: yupo hapa?
  rationale: Usemi wa Kiebrania unauliza kama mtu huyo yuko mahali hapo; 'yupo hapa?' ni sawa, mfupi, na wa kawaida kwa mtu.
- source_word: הָרֹאֶה
  choice: mwonaji
  rationale: Kiebrania kinatumia hasa jina 'mwonaji,' istilahi ya zamani inayohusiana na yule aliyeitwa baadaye nabii. Kulihifadhi kunatunza istilahi ya kihistoria ya simulizi.
