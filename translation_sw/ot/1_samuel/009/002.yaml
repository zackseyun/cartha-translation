  text: And he had a son whose name was Saul[a], a young man and handsome. There was not a man among the sons of Israel more handsome than he[b]; from his shoulders upward he was taller than all the people.
translation:
  language: sw
  text: Naye alikuwa na mwana aliyeitwa Sauli, kijana mzuri wa sura. Miongoni mwa wana wa Israeli, hapakuwa na mtu mzuri wa sura kuliko yeye; kuanzia mabegani kwenda juu, aliwapita watu wote kwa urefu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵן
  choice: mwana
  rationale: Katika muktadha huu neno hilo lina maana ya moja kwa moja ya mwana wa Kishi.
- source_word: וּשְׁמוֹ
  choice: aliyeitwa
  rationale: Hii ni njia ya asili ya Kiswahili ya kumtambulisha mwana kwa jina huku ikihifadhi maana ya ‘jina lake lilikuwa.’
- source_word: שָׁאוּל
  choice: Sauli
  rationale: Jina la mtu limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: בָּחוּר
  choice: kijana
  rationale: Neno hilo hapa humaanisha mwanamume kijana aliye katika ujana wake, si ‘mteule.’
- source_word: טוֹב / וָטוֹב
  choice: mzuri wa sura
  rationale: Katika maelezo haya טוֹב inahusu mvuto wa mwonekano; ‘mzuri wa sura’ ni wazi na ya kawaida katika Kiswahili.
- source_word: וְאֵין אִישׁ מִבְּנֵי יִשְׂרָאֵל
  choice: Miongoni mwa wana wa Israeli, hapakuwa na mtu
  rationale: Inahifadhi muundo wa kuwapo/kutokuwapo na pia usemi wa chanzo ‘wana wa Israeli.’
- source_word: טוֹב מִמֶּנּוּ
  choice: mzuri wa sura kuliko yeye
  rationale: Ulinganisho unaendeleza maana ya mwonekano kutoka kishazi kilichotangulia.
- source_word: מִשִּׁכְמוֹ וָמַעְלָה
  choice: kuanzia mabegani kwenda juu
  rationale: Hii inatoa kwa Kiswahili cha kawaida nahau ya Kiebrania inayoonyesha kuwa Sauli aliwazidi wengine kwa sehemu yote iliyo juu ya mabega.
- source_word: גָּבֹהַּ
  choice: alikuwa mrefu
  rationale: Katika ulinganisho wa kimo, maana inayokusudiwa ni urefu wa mwili.
- source_word: מִכָּל הָעָם
  choice: kuliko watu wote
  rationale: Inahifadhi ulinganisho na jamii nzima unaotolewa na Kiebrania.
