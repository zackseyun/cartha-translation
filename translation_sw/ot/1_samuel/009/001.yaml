base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/001.yaml
  text: There was a man of Benjamin[a], and his name was Kish son of Abiel, son of Zeror, son of Becorath, son of Aphiah, son of a Benjaminite, a mighty man of valor.
translation:
  language: sw
  text: Kulikuwa na mtu mmoja wa kabila la Benyamini, jina lake Kishi, mwana wa Abieli, mwana wa Serori, mwana wa Bekorathi, mwana wa Afia, mwana wa mtu wa kabila la Benyamini, mtu hodari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shujaa mwenye nguvu,” “mtu mashuhuri,” au “tajiri mwenye ushawishi.” Usemi wa Kiebrania unaweza kuonyesha ushujaa wa kijeshi, hadhi ya kijamii, au uwezo wa kiuchumi kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Kulikuwa na
  rationale: Hufungua sehemu mpya ya simulizi kwa njia ya kawaida na ya asili katika Kiswahili, bila kuongeza neno la wakati lisilokuwamo wazi katika Kiebrania.
- source_word: אִישׁ מִבֶּן־יָמִין
  choice: mtu mmoja wa kabila la Benyamini
  rationale: Kifungu hiki kinamtambulisha mwanamume kwa asili yake ya kikabila; kutaja 'kabila' huifanya maana iwe wazi na ya kawaida kwa msomaji wa Kiswahili.
- source_word: וּשְׁמוֹ
  choice: jina lake
  rationale: Ni namna fupi na ya asili ya kuhifadhi fomula ya Kiebrania ya kumtaja mhusika.
- source_word: קִישׁ / אֲבִיאֵל / צְרוֹר / בְּכוֹרַת / אֲפִיחַ
  choice: Kishi / Abieli / Serori / Bekorathi / Afia
  rationale: Majina yametoholewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: בֶּן ... בֶּן ...
  choice: mwana wa ... mwana wa ...
  rationale: Marudio ya fomula ya ukoo yamehifadhiwa; ingawa 'mwana' wakati mwingine anaweza kuwa mzao wa mbali, hapa ndiyo tafsiri ya kawaida ya mtindo huu wa nasaba.
- source_word: בֶּן־אִישׁ יְמִינִי
  choice: mwana wa Mbenyamini
  rationale: Huhifadhi hitimisho la nasaba linalomtambulisha babu huyo kuwa mtu wa kabila la Benyamini, bila kulifanya kuwa jina binafsi.
- source_word: גִּבּוֹר חָיִל
  choice: mtu hodari
  rationale: '''Hodari'' huhifadhi upana wa usemi, ambao unaweza kuonyesha uwezo, ushujaa, hadhi, au utajiri, bila kuufunga mapema katika maana ya kijeshi pekee.'
