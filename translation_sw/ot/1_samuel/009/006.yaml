base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/006.yaml
  text: He said to him, “Look now, there is a man of God in this city, and the man is held in honor; everything that he says surely comes to pass. Now let us go there. Perhaps he will tell us the way we should go.”
translation:
  language: sw
  text: Akamwambia, “Tazama basi, katika mji huu kuna mtu wa Mungu. Mtu huyo anaheshimiwa sana; kila analosema hutimia hakika. Sasa twende huko. Labda atatuambia njia tunayopaswa kuifuata.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu, “njia yetu tuliyoenda juu yake.” Kifungu cha Kiebrania kinaweza kurejelea njia au mwelekeo wa safari yao.
    reason: Huhifadhi umbo na utata wa kifungu cha Kiebrania bila kufanya tafsiri kuu isikike kana kwamba wanaomba tu maelezo ya njia waliyokwisha fuata.
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: mtu wa Mungu
  rationale: Ni istilahi ya kawaida na yenye heshima kwa nabii au mwakilishi wa Mungu, bila kuongeza cheo kisichotajwa wazi hapa.
- source_word: נִכְבָּד
  choice: anaheshimiwa sana
  rationale: Inaonyesha kwamba mtu huyo alikuwa mwenye kuheshimika au kuheshimiwa; usemi huu ni wa kawaida katika Kiswahili cha sasa.
- source_word: בּוֹא יָבוֹא
  choice: hutimia hakika
  rationale: Muundo huu unasisitiza uhakika wa kutokea kwa yale anayosema; ‘hutimia hakika’ huhifadhi msisitizo huo kwa lugha ya asili.
- source_word: אֶת דַּרְכֵּנוּ אֲשֶׁר הָלַכְנוּ עָלֶיהָ
  choice: kuhusu njia yetu tuliyoifuata
  rationale: Hufuata kwa karibu taswira ya Kiebrania ya njia au safari ambayo tayari wameifuata, badala ya kuibadili moja kwa moja kuwa njia wanayopaswa kwenda.
theological_decisions:
- issue: Uhakika wa maneno ya mtu wa Mungu
  choice: kila analosema hutimia hakika
  alternative: kila analosema hakika litatokea
  rationale: Chaguo hili linaonyesha sifa inayotambuliwa ya mtu huyo bila kudai kwamba kila kauli ya kila mtu wa Mungu daima ni unabii.
- issue: Maana ya ‘njia yetu’
  choice: njia yetu tuliyoifuata
  alternative: njia tunayopaswa kwenda
  rationale: Kitenzi cha Kiebrania kiko katika umbo linaloelekea kurejelea njia ambayo tayari wameiendea. Tafsiri haifuti uwezekano wa maana pana kuhusu mwelekeo au matokeo ya safari yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Tazama basi’ huhifadhi msisitizo wa הִנֵּה נָא, na sentensi fupi zinafuata mwendo wa mazungumzo ya simulizi.
