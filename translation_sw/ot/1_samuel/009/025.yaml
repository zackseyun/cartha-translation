  text: When they came down from the high place into the city[a], he spoke with Saul on the roof.
translation:
  language: sw
  text: Waliposhuka kutoka mahali pa juu na kuingia mjini,[a] Samueli alizungumza na Sauli juu ya paa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nao wakashuka kutoka mahali pa juu na kuingia mjini, naye akazungumza na Sauli juu ya paa.”
    reason: Mbadala huu huhifadhi kwa karibu zaidi mfululizo wa vitenzi vya simulizi katika Kiebrania.
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: Waliposhuka
  rationale: Muundo huu unaonyesha kushuka kwao na unaunganisha kwa kawaida tendo hilo na kitenzi cha umoja kinachofuata.
- source_word: מֵהַבָּמָה
  choice: kutoka mahali pa juu
  rationale: בָּמָה hapa inaelekea kuwa mahali pa ibada palipoinuka; ‘mahali pa juu’ huhifadhi maana hiyo bila kupanua tafsiri.
- source_word: הָעִיר
  choice: na kuingia mjini
  rationale: Katika muktadha wa kitenzi cha mwendo, maneno haya yanaeleza kwa Kiswahili cha kawaida mwendo kutoka mahali pa juu kuingia ndani ya mji.
- source_word: וַיְדַבֵּר
  choice: Samueli alizungumza
  rationale: Kitenzi ni cha umoja. Jina ‘Samueli’ limetumiwa ili kubainisha mhusika wa tendo katika Kiswahili, kwa kuzingatia muktadha wa karibu.
- source_word: עִם שָׁאוּל
  choice: na Sauli
  rationale: עִם kwa kawaida humaanisha ‘pamoja na’; ‘alizungumza na Sauli’ hudokeza mazungumzo bila kuyafanya kuwa hotuba ya upande mmoja.
- source_word: עַל הַגָּג
  choice: juu ya paa
  rationale: גָּג ni paa tambarare lililotumika kama eneo la kukaa; ‘juu ya paa’ ni wazi na ya kawaida katika Kiswahili.
