base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/003.yaml
  text: The donkeys belonging to Kish[a], Saul’s father, were lost. So Kish said to Saul his son, “Please take with you one of the young men, and get up, go[b], seek the donkeys.”
translation:
  language: sw
  text: Punda wa Kishi[a], baba ya Sauli, walipotea. Kishi akamwambia Sauli mwanawe, “Tafadhali chukua pamoja nawe mmoja wa vijana[b], uondoke, uende ukawatafute punda hao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “punda-jike.”'
    reason: lexical_alternative
  - marker: b
    text: Au “watumishi” au “wasaidizi.” Neno la Kiebrania linaweza kumaanisha vijana au watu wanaohudumu katika nyumba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאבַדְנָה
  choice: walipotea
  rationale: Kitenzi אבד hapa kinaonyesha kwamba wanyama hawakupatikana; “walipotea” ni Kiswahili cha kawaida na hakidokezi kwamba walikufa.
- source_word: הָאֲתֹנוֹת
  choice: punda
  rationale: Neno la Kiebrania linamaanisha hasa punda-jike, lakini “punda” ni neno la kawaida na la asili katika simulizi hii; jinsia yao imeelezwa katika tanbihi.
- source_word: לְקִישׁ
  choice: wa Kishi
  rationale: Kiambishi לְ kinaonyesha umiliki hapa; muundo “punda wa Kishi” ni wa kawaida katika Kiswahili.
- source_word: אֲבִי שָׁאוּל
  choice: baba yake Sauli
  rationale: Muundo huu unawakilisha kwa uwazi uhusiano wa kifamilia uliomo katika mnyororo wa hali ya umilikaji wa Kiebrania.
- source_word: קַח נָא אִתְּךָ
  choice: Tafadhali, chukua pamoja nawe
  rationale: “Tafadhali” linawakilisha nguvu ya נָא ya kulainisha amri, huku “pamoja nawe” likihifadhi maana ya אִתְּךָ.
- source_word: אַחַד מֵהַנְּעָרִים
  choice: mmoja wa vijana
  rationale: נְעָרִים inaweza kumaanisha vijana, watumishi, au wasaidizi; “vijana” ni tafsiri ya karibu zaidi na haiamui kimyakimya hadhi yao ya kijamii.
- source_word: וְקוּם לֵךְ
  choice: uondoke, uende
  rationale: Maneno haya mawili yanahifadhi amri mbili za Kiebrania na kwa Kiswahili yanaonyesha kuanza safari bila kutumia usemi mgumu wa “simama, nenda.”
- source_word: בַּקֵּשׁ
  choice: ukawatafute
  rationale: בקש katika muktadha huu ni kutafuta vitu vilivyopotea; “ukawatafute” ni usemi wa kawaida unaounganisha kusafiri na kusudi la safari.
