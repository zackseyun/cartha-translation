translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umewekwa rahisi kwa usomaji wa kawaida huku picha halisi za “mkate” na lakabu “mtu wa Mungu” zikihifadhiwa.
