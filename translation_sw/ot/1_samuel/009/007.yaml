base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/007.yaml
  text: Then Saul said to his young man[a], “But look, if we go, what will we bring to the man? For the bread is gone from our bags, and there is no gift to bring to the man of God[b]. What do we have?”
translation:
  language: sw
  text: Ndipo Sauli akamwambia kijana wake, “Lakini tazama, tukienda, tutampelekea mtu yule nini? Mkate umekwisha katika mifuko yetu[a], wala hatuna zawadi[b] ya kumpelekea mtu wa Mungu. Tuna nini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “katika vyombo vyetu.” Neno la Kiebrania ni “vyombo”; katika muktadha huu linaweza kurejelea vyombo au mifuko ya kubebea chakula.
    reason: lexical_alternative
  - marker: b
    text: Au “kipawa.” Neno la Kiebrania humaanisha zawadi inayopelekwa kwa mtu anayeheshimiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: kijana wake
  rationale: Neno hili linaweza kumaanisha kijana au mhudumu kijana. “Kijana wake” huhifadhi maana ya umri bila kulazimisha hadhi ya utumwa; muktadha unaonyesha kuwa alikuwa mwandamani wa Sauli.
- source_word: וְהִנֵּה
  choice: Lakini tazama
  rationale: Kirai hiki huvuta fikira kwenye tatizo la vitendo ambalo Sauli analitaja. “Lakini tazama” huhifadhi msisitizo na pia uhusiano wa kipingamizi.
- source_word: נֵלֵךְ
  choice: tukienda
  rationale: 'Kauli hii ina nguvu ya sharti katika muktadha: ikiwa wataenda, watachukua nini. “Tukienda” ni Kiswahili cha kawaida na sahihi.'
- source_word: נָּבִיא
  choice: tutampelekea
  rationale: Hifili ya בוא hapa humaanisha kuleta kitu kwa mtu. Kwa Kiswahili, “kumpelekea” huonyesha wazi kwamba kitu kinachukuliwa na kuwasilishwa kwa huyo mtu.
- source_word: לֶחֶם
  choice: mkate
  rationale: Maana ya msingi ni “mkate.” Ingawa inaweza kuwakilisha chakula kwa ujumla, tafsiri inadumisha picha halisi ya maandishi.
- source_word: אָזַל
  choice: umekwisha
  rationale: Kitenzi kinaonyesha kwamba akiba imetumika yote. “Umekwisha” ni usemi wa kawaida na wa moja kwa moja.
- source_word: כְּלִי
  choice: mifuko
  rationale: Neno la Kiebrania humaanisha vyombo au vifaa vya kubebea. Katika safari hii, “mifuko” ni picha ya kawaida ya vyombo walivyobebea chakula.
- source_word: תְּשׁוּרָה
  choice: zawadi
  rationale: Neno hili humaanisha kitu kinachopelekwa kwa mtu anayeheshimiwa. “Zawadi” ni wazi na huepuka maana ya kiibada ambayo “sadaka” ingeweza kuleta.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hii ni lakabu inayotambuliwa kwa mtu aliyepewa utume na Mungu. “Mtu wa Mungu” huhifadhi lakabu ya Kiebrania bila kuibadilisha kuwa “nabii.”
- source_word: מָה אִתָּנוּ
  choice: Tuna nini?
  rationale: Nahau hii huuliza ni kitu gani walicho nacho tayari. “Tuna nini?” ni ya asili na hudumisha swali fupi la Sauli.
