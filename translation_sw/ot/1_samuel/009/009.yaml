base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/009.yaml
  text: Formerly in Israel[a], when a man went to inquire of God, he would say, “Come, and let us go to the seer,” for the prophet of today was formerly called the seer.
translation:
  language: sw
  text: Hapo zamani katika Israeli[a], mtu alipokwenda kumwuliza Mungu, angesema, “Njooni, twende kwa mwonaji,” kwa maana yule anayeitwa nabii leo aliitwa mwonaji hapo zamani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Katika nyakati za zamani katika Israeli, mtu alipokwenda kumtafuta Mungu, angesema, ‘Njooni, twende kwa mwonaji.’”
    reason: Mbadala huu unaonyesha uwezekano wa kutafsiri לְפָנִים kwa ‘katika nyakati za zamani’ na לִדְרֹשׁ kwa ‘kumtafuta.’
lexical_decisions:
- source_word: לְפָנִים
  choice: hapo zamani
  rationale: Ni kielezi cha wakati kinachomaanisha zamani au katika nyakati zilizopita; kimetumiwa katika sehemu zote mbili za mstari ili kudumisha ulinganifu.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: Kifungu cha mahali kinachoonyesha ambako desturi hiyo ilikuwa ikifuatwa.
- source_word: כֹּה אָמַר
  choice: angesema
  rationale: Ingawa kwa muundo ni ‘alisema hivi,’ hapa kinaeleza jambo lililokuwa desturi wakati uliopita; ‘angesema’ ni Kiswahili cha kawaida kwa tendo hilo la mazoea.
- source_word: הָאִישׁ
  choice: mtu
  rationale: Umoja huu umetumiwa kwa maana ya jumla, si kumtaja mwanamume fulani. ‘Mtu’ ni ya kawaida katika Kiswahili na haisemi zaidi ya muktadha.
- source_word: בְּלֶכְתּוֹ
  choice: alipokwenda
  rationale: Jina-kitenzi lenye kiambishi cha nafsi linafanya kazi ya kuonyesha wakati; limetafsiriwa kwa kishazi cha wakati kinachoeleweka kwa urahisi.
- source_word: לִדְרֹשׁ אֱלֹהִים
  choice: kumwuliza Mungu
  rationale: Katika muktadha huu דָּרַשׁ humaanisha kutafuta jibu au mwongozo kutoka kwa Mungu kupitia mwonaji; ‘kumwuliza Mungu’ huhifadhi maana hiyo ya kutaka shauri.
- source_word: לְכוּ וְנֵלְכָה
  choice: Njooni, twende
  rationale: Huhifadhi amri inayofuatwa na himizo la pamoja, huku ikisikika kwa kawaida katika Kiswahili.
- source_word: עַד הָרֹאֶה
  choice: kwa mwonaji
  rationale: עַד hapa huonyesha mwendo kuelekea kwa mtu, na ‘mwonaji’ ni jina la cheo cha zamani linalotokana na wazo la kuona.
- source_word: לַנָּבִיא
  choice: nabii
  rationale: Hili ndilo neno la kawaida na lililoeleweka kwa נָבִיא; muundo wa Kiswahili hauhitaji kibainishi kinacholingana moja kwa moja na ha- ya Kiebrania.
- source_word: הַיּוֹם
  choice: leo
  rationale: Linatofautisha istilahi ya wakati wa msimulizi na jina lililotumiwa hapo zamani.
- source_word: יִקָּרֵא
  choice: anayeitwa … aliitwa
  rationale: 'Kiswahili kinahitaji kufafanua mtazamo wa sasa na wa zamani: huyo anayeitwa nabii leo aliitwa mwonaji hapo zamani.'
- source_word: הָרֹאֶה
  choice: mwonaji
  rationale: Ni cheo cha zamani cha mtu wa kinabii; neno hili ni fupi na linaonyesha uhusiano wake na kitenzi ‘kuona.’
theological_decisions:
- issue: Maana ya jumla ya הָאִישׁ
  choice: mtu
  alternative: mwanamume
  rationale: Katika Kiswahili ‘mtu’ ni namna ya kawaida ya kueleza mhusika wa jumla. Haifuti jinsia ya mtu maalumu kwa sababu mstari haumrejelei mtu maalumu, bali unaeleza desturi.
- issue: Maana ya דָּרַשׁ אֱלֹהִים katika muktadha wa kinabii
  choice: kumwuliza Mungu
  alternative: kumtafuta Mungu
  rationale: Muktadha ni wa kutaka jibu au mwongozo wa Mungu kwa kwenda kwa mwonaji. Tafsiri hii huhifadhi maana ya kuuliza bila kuingiza madai ya ziada kuhusu namna unabii ulivyofanya kazi.
- issue: Uhusiano kati ya ‘nabii’ na ‘mwonaji’
  choice: mtu anayeitwa nabii leo hapo zamani aliitwa mwonaji
  alternative: nabii wa leo hapo zamani aliitwa mwonaji
  rationale: Muundo uliochaguliwa unaonyesha wazi kuwa mstari unaeleza mabadiliko ya jina la cheo, bila kudai kwamba kila tofauti ya kazi au maana kati ya istilahi hizo ilitoweka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Njooni, twende’ ni himizo la kawaida na lenye hadhi; ‘mwonaji’ limetumiwa kama cheo cha kale na kutofautishwa wazi na ‘nabii.’
