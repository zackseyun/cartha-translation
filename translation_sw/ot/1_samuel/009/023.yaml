translation:
  language: sw
  text: Ndipo Samweli akamwambia mpishi[a], “Leta sehemu niliyokupa, ambayo nilikuambia uiweke kando kwako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “mchinjaji.” Kwa uhalisi zaidi, Kiebrania husema: “Toa sehemu niliyokupa, ambayo nilikuambia uiweke kwako.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַּבָּח
  choice: mpishi
  rationale: Katika muktadha wa karamu, neno hili linamtaja mtu anayehusika na kuandaa na kutoa nyama/chakula; ‘mpishi’ ni la kawaida na linalofaa kuliko ‘mchinjaji.’
- source_word: תְּנָה
  choice: Leta
  rationale: Kimsingi kitenzi humaanisha ‘toa,’ lakini hapa Samweli anamwagiza mpishi alete sehemu iliyokuwa imehifadhiwa; ‘leta’ linawasilisha maana ya kimuktadha kwa Kiswahili cha asili.
- source_word: מָּנָה
  choice: sehemu
  rationale: Neno linamaanisha fungu au kiasi cha chakula kilichotengewa mtu. ‘Sehemu’ ni wazi na linafaa katika muktadha wa mlo.
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: niliyokupa
  rationale: Linahifadhi kwa ufupi maana ya moja kwa moja kwamba Samweli alikuwa amempa mpishi sehemu hiyo.
- source_word: אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: ambayo nilikuambia
  rationale: Muundo huu unadumisha kishazi rejeshi cha Kiebrania na kuhusianisha agizo linalofuata na sehemu iliyotajwa.
- source_word: שִׂים אֹתָהּ עִמָּךְ
  choice: Iweke kando kwako
  rationale: ‘Iweke kando’ huonyesha kuwa sehemu hiyo ilitengwa kwa matumizi ya baadaye, huku ‘kwako’ likihifadhi wazo halisi la Kiebrania la kuiweka pamoja na mpishi.
