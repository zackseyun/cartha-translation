base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/019.yaml
  text: Samuel answered Saul and said[a], “I am the seer. Go up before me to the high place, and eat with me today. In the morning I will send you on your way[b], and I will tell you all that is in your heart.”
translation:
  language: sw
  text: Samweli akamjibu Shauli, akasema, “Mimi ndiye mwonaji[a]. Panda mbele yangu kwenda mahali pa juu, nanyi mtakula pamoja nami leo[b]. Asubuhi nitakuaga uende zako, nami nitakuambia yote yaliyo moyoni mwako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nabii.” Kiebrania kimetumia jina la zamani “mwonaji,” ambalo 1 Samweli 9:9 linaeleza kuwa lilikuwa jina la awali la nabii.
    reason: alternative_reading
  - marker: b
    text: Neno “mtakula” liko katika wingi katika Kiebrania, huenda likimhusisha mtumishi wa Shauli pamoja na Shauli mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאֶה
  choice: mwonaji
  rationale: Neno hili humaanisha kihalisi mtu anayeona na hapa ni jina la zamani la nabii; “mwonaji” linahifadhi istilahi ya simulizi na uhusiano wake na kuona.
- source_word: הַבָּמָה
  choice: mahali pa juu
  rationale: Kirai hiki kinahifadhi picha ya eneo lililoinuka lililotumiwa kwa ibada bila kulifasiri kwa neno finyu zaidi kama “madhabahu” au “hekalu.”
- source_word: עֲלֵה לְפָנַי
  choice: Panda mbele yangu
  rationale: Tafsiri hii inaonyesha kupanda kuelekea eneo lililoinuka na kwamba Shauli atangulie mbele ya Samweli.
- source_word: וַאֲכַלְתֶּם עִמִּי הַיּוֹם
  choice: nanyi mtakula pamoja nami leo
  rationale: Kitenzi cha Kiebrania kiko katika nafsi ya pili wingi, kwa hiyo “nanyi mtakula” kinahifadhi uwezekano kwamba mtumishi wa Shauli anahusishwa pamoja naye.
- source_word: וְשִׁלַּחְתִּיךָ
  choice: nitakuaga uende zako
  rationale: Katika muktadha huu kitenzi kina maana ya kumruhusu au kumtuma Shauli aende baada ya kukaa kwake; usemi huu ni wa kawaida na hauashirii kufukuzwa.
- source_word: בַבֹּקֶר
  choice: Asubuhi
  rationale: Inafuata wakati uliotajwa wazi katika Kiebrania bila kuongeza “kesho,” ingawa muktadha unaonyesha asubuhi inayofuata.
- source_word: וְכֹל אֲשֶׁר בִּלְבָבְךָ
  choice: yote yaliyo moyoni mwako
  rationale: Inahifadhi picha ya Kiebrania ya moyo kama kitovu cha mawazo, makusudi, na mahangaiko ya ndani.
- source_word: אַגִּיד לָךְ
  choice: nitakuambia
  rationale: Ni usemi wa Kiswahili wa kawaida unaowasilisha maana ya kufanya jambo lijulikane.
