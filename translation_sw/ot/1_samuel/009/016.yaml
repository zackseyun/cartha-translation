language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כָּ/עֵ֣ת מָחָ֡ר אֶשְׁלַח֩ אֵלֶ֨י/ךָ אִ֜ישׁ מֵ/אֶ֣רֶץ בִּנְיָמִ֗ן וּ/מְשַׁחְתּ֤/וֹ לְ/נָגִיד֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הוֹשִׁ֥יעַ אֶת עַמִּ֖/י מִ/יַּ֣ד פְּלִשְׁתִּ֑ים כִּ֤י רָאִ֨יתִי֙ אֶת עַמִּ֔/י כִּ֛י בָּ֥אָה צַעֲקָת֖/וֹ אֵלָֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/016.yaml
  text: About this time tomorrow I will send to you a man from the land of Benjamin[a], and you shall anoint him as ruler over my people Israel. He will save my people from the hand of the Philistines, for I have seen my people[b], because their cry has come to me.
translation:
  language: sw
  text: Kesho majira kama haya nitampeleka kwako mwanamume kutoka nchi ya Benyamini. Utamtia mafuta awe mtawala[a] juu ya watu wangu Israeli. Naye atawaokoa watu wangu kutoka mkononi mwa Wafilisti, kwa maana nimewaona watu wangu, kwa sababu kilio chao[b] kimenifikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania נָגִיד (nagid); pia yaweza kutafsiriwa “kiongozi” au “mkuu.” Neno hili humaanisha mtu aliyewekwa rasmi kutawala, si mtu mwenye cheo cha heshima tu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa tafsiri ya moja kwa moja ni “kilio chake,” kwa kiambishi cha umoja kinachorejelea jina la mkusanyiko “watu wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּעֵת מָחָר
  choice: Kesho majira kama haya
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili inayoonyesha wakati unaokaribiana na saa hii siku inayofuata, bila kuufanya usemi kuwa mkavu.
- source_word: אֶשְׁלַח אֵלֶיךָ
  choice: nitakutumia
  rationale: Kitenzi pamoja na kihusishi kinaeleza kwamba Mungu atampeleka huyo mtu kwa Samweli; muundo huu ni wa asili katika Kiswahili.
- source_word: אִישׁ מֵאֶרֶץ בִּנְיָמִן
  choice: mwanamume kutoka nchi ya Benyamini
  rationale: “Mwanamume” huhifadhi umahususi wa jinsia ya אִישׁ katika muktadha huu, na “nchi” huhifadhi maana ya eneo la Benyamini.
- source_word: וּמְשַׁחְתּוֹ
  choice: Utampaka mafuta
  rationale: Kupaka mafuta ni tendo halisi la kumweka rasmi mtu katika wadhifa; wakati ujao hapa una nguvu ya agizo la Mungu kwa Samweli.
- source_word: לְנָגִיד
  choice: awe mtawala
  rationale: נָגִיד humaanisha mtu aliyewekwa rasmi kuongoza na kutawala. “Mtawala” huonyesha mamlaka hiyo bila kulazimisha cheo kamili cha “mfalme.”
- source_word: וְהוֹשִׁיעַ
  choice: Naye atawaokoa
  rationale: Mzizi יָשַׁע unaeleza kuokoa au kukomboa kutoka hatarini; “atawaokoa” ni wazi na pia huonyesha matokeo ya kuwekwa kwake.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: kutoka mkononi mwa Wafilisti
  rationale: Tafsiri hii huhifadhi taswira ya Kiebrania ya “mkono” kama nguvu au udhibiti, na inaeleweka vizuri kwa Kiswahili.
- source_word: כִּי רָאִיתִי אֶת עַמִּי
  choice: kwa maana nimewaona watu wangu
  rationale: Huhifadhi kauli ya moja kwa moja kwamba Mungu amewaona watu wake, yenye maana ya kutambua hali na taabu yao.
- source_word: כִּי בָּאָה צַעֲקָתוֹ אֵלָי
  choice: kwa sababu kilio chao kimenifikia
  rationale: Kiwakilishi cha Kiebrania ni cha umoja kwa sababu kinarejelea jina la mkusanyiko “watu wangu”; Kiswahili cha kawaida hutumia wingi “chao” kwa “watu.”
theological_decisions:
- issue: Cheo cha נָגִיד katika nafasi ya Sauli
  choice: mtawala
  alternative: kiongozi; mkuu
  rationale: “Mtawala” huhifadhi mamlaka ya kisiasa ya mtu aliyewekwa na Mungu bila kumwita moja kwa moja “mfalme” wala kuingiza ufafanuzi wa kimadhehebu.
- issue: Kiwakilishi cha umoja katika צַעֲקָתוֹ
  choice: kilio chao
  alternative: kilio chake
  rationale: Kiebrania hutumia umoja unaorejelea “watu wangu” kama kundi moja. Kiswahili hutaja “watu” kwa wingi, hivyo “chao” huwasilisha maana kwa ufasaha huku tanbihi ikihifadhi umbo la chanzo.
- issue: Uhusiano wa וְהוֹשִׁיעַ na kuwekwa kwa mtawala
  choice: Naye atawaokoa
  alternative: ili awaokoe; na awaokoe
  rationale: Umbo linaweza kubeba matokeo au kusudi. Wakati ujao huendeleza mtiririko wa kauli bila kufunga kabisa mvutano huo kwa maelezo ya ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wazi na wa sasa. Taswira ya “mkono wa Wafilisti” na tendo la “kupaka mafuta” zimehifadhiwa kwa kuwa zinaeleweka na zina uzito wa kifungu cha chanzo.
