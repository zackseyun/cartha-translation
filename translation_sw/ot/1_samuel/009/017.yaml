base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/017.yaml
  text: When Samuel saw Saul[a], Yahweh answered him, “Look, this is the man of whom I spoke to you. This one shall rule over my people.”
translation:
  language: sw
  text: Samweli alipomwona Sauli, Yahwe akamjibu, “Tazama, huyu ndiye mtu niliyekuambia habari zake. Huyu atawatawala[a] watu wangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri iliyo halisi zaidi, “atawazuia / atawadhibiti watu wangu.” Kitenzi cha Kiebrania kinaweza kumaanisha kuzuia, kudhibiti, au kutawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: alipomwona
  rationale: Kitenzi hiki kinaonyesha kumwona kwa macho; muundo wa wakati ‘alipomwona’ unaunganisha kwa kawaida tukio hilo na jibu la Yahwe katika simulizi.
- source_word: וַיהוָה
  choice: Yahwe
  rationale: Jina la agano יְהוָה limetolewa kama jina binafsi ‘Yahwe’ kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: עָנָהוּ
  choice: akamjibu
  rationale: Huhifadhi maana ya msingi ya ‘kujibu/kuitikia,’ hata ingawa hakuna swali lililotajwa wazi katika mstari huu.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili linavuta fikira kwa mtu anayeelekezwa; ‘Tazama’ ni la heshima, wazi, na la kawaida katika usimulizi wa kibiblia.
- source_word: הָאִישׁ אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: huyu ndiye mtu niliyekuambia habari zake
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya mtu ambaye Yahwe alikuwa amemzungumzia kwa Samweli, huku likihifadhi utambulisho wenye mkazo.
- source_word: זֶה
  choice: Huyu
  rationale: Kiwakilishi hiki cha kuonyesha kinahifadhi mkazo wa Kiebrania unaomteua Sauli moja kwa moja.
- source_word: יַעְצֹר
  choice: atawatawala
  rationale: Katika muktadha wa kuteuliwa kwa Sauli kuwa kiongozi, neno hili linaonyesha kutumia mamlaka ya kudhibiti au kutawala. Dokezo linahifadhi maana halisi zaidi ya kuzuia au kudhibiti.
- source_word: בְּעַמִּי
  choice: watu wangu
  rationale: Pamoja na יַעְצֹר, watu ndio wanaokuwa chini ya mamlaka hiyo; kiambishi cha yambwa katika ‘atawatawala’ kinaonyesha uhusiano wa ‘juu ya watu wangu’ kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Utoaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania hutumia jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya יַעְצֹר kuhusu uongozi wa Sauli
  choice: atawatawala watu wangu
  alternative: atawazuia watu wangu; atawadhibiti watu wangu
  rationale: Muktadha unaelekeza kwenye utawala wa kifalme, lakini kitenzi chenyewe kina wigo wa kuzuia, kudhibiti, au kutawala. Tafsiri kuu inatoa maana ya kimuktadha, na dokezo linaweka wazi mvutano wa kileksika bila kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa sasa. ‘Tazama’ huhifadhi nguvu ya neno la kuonyesha bila kutumia lugha nzito isiyo ya kawaida; sentensi nyingine zimeundwa kwa mtiririko wa kawaida wa simulizi.
