base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/005.yaml
  text: When they came into the land of Zuph[a], Saul said to his young man who was with him, “Come, let us return[b], lest my father stop caring about the donkeys and become anxious about us.”
translation:
  language: sw
  text: Walipofika katika nchi ya Sufu, Sauli akamwambia kijana wake aliyekuwa pamoja naye, “Njoo, turudi, la sivyo baba yangu ataacha kuhangaikia punda na kuwa na wasiwasi juu yetu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאוּ בְּאֶרֶץ צוּף
  choice: Walipofika katika nchi ya Sufu
  rationale: Kitenzi בוא pamoja na ב hapa kinaonyesha kufika katika eneo. Kiswahili ‘walipofika katika’ ni cha kawaida na huhifadhi maana ya kuingia/kufika huko; צוּף limetoholewa kuwa ‘Sufu.’
- source_word: נַעֲרוֹ
  choice: kijana
  rationale: נַעַר kimsingi humaanisha kijana, ingawa katika muktadha fulani inaweza kuwa mtumishi au msaidizi. ‘Kijana’ huepuka kubainisha hadhi yake zaidi ya maandishi.
- source_word: לְכָה וְנָשׁוּבָה
  choice: Njoo, turudi
  rationale: Amri ikifuatwa na kohortativi ni mwaliko au himizo la kutenda pamoja. ‘Njoo, turudi’ ni ya asili katika Kiswahili na hudumisha nguvu hiyo.
- source_word: פֶּן
  choice: la sivyo
  rationale: פֶּן huanzisha jambo lisilotakiwa ambalo msemaji anataka kuliepuka. ‘La sivyo’ hutoa onyo hilo kwa Kiswahili cha sasa bila kutumia muundo mzito.
- source_word: יֶחְדַּל ... מִן הָאֲתֹנוֹת
  choice: ataacha kuhangaikia punda
  rationale: Kwa maana ya moja kwa moja ni ‘ataacha/atakoma kutoka kwa punda,’ nahau inayoonyesha kuacha kujishughulisha au kuwa na wasiwasi kuhusu punda. ‘Kuhangaikia’ huunganisha kujishughulisha na kuwa na wasiwasi bila kudai kuwa amekoma kuwajali kabisa.
- source_word: וְדָאַג לָנוּ
  choice: na kuanza kuwa na wasiwasi juu yetu
  rationale: דאג humaanisha kuwa na wasiwasi au kuhangaika, na לָנוּ hutaja walengwa wa wasiwasi. ‘Kuanza’ huwasilisha mgeuko unaodokezwa kutoka kwa punda kwenda kwa Sauli na mwenzake.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa kwa mtiririko wa kawaida wa simulizi; ‘punda’ linaachwa bila alama ya wingi kwa kuwa umbo hilo la Kiswahili hutumika kwa umoja na wingi. Hakuna tanbihi iliyohitajika, kwa kuwa nahau ya Kiebrania inaweza kutafsiriwa wazi katika matini bila kupoteza utata muhimu.
