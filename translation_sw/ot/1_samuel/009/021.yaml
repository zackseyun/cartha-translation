  text: וַ/יַּ֨עַן שָׁא֜וּל וַ/יֹּ֗אמֶר הֲ/ל֨וֹא בֶן יְמִינִ֤י אָ֨נֹכִי֙ מִ/קַּטַנֵּי֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וּ/מִשְׁפַּחְתִּ/י֙ הַ/צְּעִרָ֔ה מִ/כָּֽל מִשְׁפְּח֖וֹת שִׁבְטֵ֣י בִנְיָמִ֑ן וְ/לָ֨/מָּה֙ דִּבַּ֣רְתָּ אֵלַ֔/י כַּ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/021.yaml
  text: Saul answered and said[a], “Am I not a Benjaminite, from the smallest of the tribes of Israel? And is not my clan the least of all the clans of the tribe of Benjamin? So why have you spoken to me in this way?”
translation:
  language: sw
  text: Sauli akajibu, “Je, mimi si Mbenyamini, kutoka kabila dogo zaidi kati ya makabila ya Israeli? Na je, ukoo wangu si mdogo zaidi kati ya koo zote za kabila la Benyamini? Basi, kwa nini umesema nami hivi[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa nini umeniambia jambo kama hili?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן שָׁאוּל וַיֹּאמֶר
  choice: Sauli akajibu
  rationale: Muundo wa Kiebrania wenye maana halisi ya ‘akajibu na kusema’ unatolewa kwa Kiswahili cha kawaida kama ‘akajibu,’ bila kupoteza kazi yake ya kuanzisha jibu.
- source_word: הֲלוֹא בֶן־יְמִינִי אָנֹכִי
  choice: Je, mimi si Mbenyamini
  rationale: הֲלוֹא huanzisha swali la balagha linalotarajia kukubaliwa; ‘Je, mimi si ...’ huhifadhi nguvu hiyo. ‘Mbenyamini’ ni jina la kawaida la mtu wa kabila la Benyamini.
- source_word: מִקַּטַנֵּי שִׁבְטֵי יִשְׂרָאֵל
  choice: kutoka kabila dogo zaidi kati ya makabila ya Israeli
  rationale: Kirai kinaonyesha kuwa Sauli anatoka katika kabila linalohesabiwa kuwa dogo au la hadhi ndogo. Tafsiri hii huhifadhi wazo la udogo bila kulazimisha kama ni idadi au hadhi pekee.
- source_word: וּמִשְׁפַּחְתִּי
  choice: na ... ukoo wangu
  rationale: מִשְׁפָּחָה hapa ni kundi la kindugu ndani ya kabila, pana kuliko familia ya nyumbani; kwa hiyo ‘ukoo’ linafaa katika mpangilio wa kijamii wa kifungu.
- source_word: הַצְּעִרָה
  choice: mdogo zaidi
  rationale: Neno linaweza kueleza udogo wa ukubwa, cheo, au umuhimu. ‘Mdogo zaidi’ huhifadhi upana huo wa maana badala ya kuamua wazi kuwa ni ‘duni zaidi.’
- source_word: מִכָּל מִשְׁפְּחוֹת שִׁבְטֵי בִנְיָמִן
  choice: kati ya koo zote za kabila la Benyamini
  rationale: Ingawa maandishi yana umbo la wingi katika ‘makabila ya Benyamini,’ muktadha unalinganisha koo zilizo ndani ya kabila moja la Benyamini; Kiswahili hiki kinaeleza uhusiano huo kwa kawaida.
- source_word: וְלָמָּה
  choice: Basi, kwa nini
  rationale: Kiunganishi kinaonyesha hitimisho linalotokana na maelezo ya Sauli kuhusu nafasi yake; ‘Basi’ huleta nguvu hiyo ya kimantiki.
- source_word: דִּבַּרְתָּ אֵלַי
  choice: umesema nami
  rationale: דבר pamoja na אֶל ni kusema au kuzungumza na mtu. ‘Umesema nami’ ni ya asili katika Kiswahili na inafaa kwa maneno yaliyotangulia ya Samweli.
- source_word: כַּדָּבָר הַזֶּה
  choice: kwa namna hii
  rationale: Kirai kinaweza kurejelea namna au yaliyomo katika kauli ya Samweli. ‘Kwa namna hii’ ni tafsiri ya kawaida, huku uwezekano wa ‘jambo kama hili’ ukihifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa urahisi. Maswali ya balagha yamehifadhiwa, na ‘ukoo’ limetumiwa kwa kitengo cha kindugu kilicho chini ya kabila. Alama ya tanbihi imewekwa baada ya sentensi inayohusika.
