  edition: WLC
  text: וַ/תַּעֲנֶ֧ינָה אוֹתָ֛/ם וַ/תֹּאמַ֥רְנָה יֵּ֖שׁ הִנֵּ֣ה לְ/פָנֶ֑י/ךָ מַהֵ֣ר עַתָּ֗ה כִּ֤י הַ/יּוֹם֙ בָּ֣א לָ/עִ֔יר כִּ֣י זֶ֧בַח הַ/יּ֛וֹם לָ/עָ֖ם בַּ/בָּמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/012.yaml
  text: They answered them and said[a], “Yes, look—he is just ahead of you. Hurry now, because he came to the city today[b], because today there is a sacrifice for the people at the high place.”
translation:
  language: sw
  text: Nao wakawajibu na kusema, “Ndiyo, tazama, yuko mbele yako.[a] Harakisha sasa, kwa maana amekuja mjini leo, kwa sababu leo kuna dhabihu kwa ajili ya watu mahali pa juu.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ndiyo, huyo hapo mbele yako.” Kiebrania kina neno la kukubali pamoja na usemi unaoelekeza uangalifu.
    reason: lexical_alternative
  - marker: b
    text: “Mahali pa juu” ni eneo la ibada la mahali hapo, kwa kawaida lililokuwa sehemu iliyoinuka.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעֲנֶינָה אוֹתָם וַתֹּאמַרְנָה
  choice: Nao wakawajibu na kusema
  rationale: Muundo huu unahifadhi mfuatano wa Kiebrania wa ‘wakajibu na kusema.’ Viambishi vya vitenzi vya Kiebrania vinaonyesha kuwa wasemaji ni wanawake, lakini Kiswahili hakionyeshi jinsia katika muundo huu; muktadha unaowatambulisha unabaki kutimiza kazi hiyo.
- source_word: יֵשׁ הִנֵּה לְפָנֶיךָ
  choice: Ndiyo, tazama, yuko mbele yako
  rationale: יֵשׁ hutumika hapa kama jibu la kukubali, ‘Ndiyo’; הִנֵּה huvuta uangalifu, na לְפָנֶיךָ ina maana ya mahali, ‘mbele yako.’ Tafsiri haiongezi wazo lisilo wazi la umbali mfupi sana.
- source_word: מַהֵר עַתָּה
  choice: Harakisha sasa
  rationale: Kauli ya amri ya umoja pamoja na kielezi cha wakati inaeleza uharaka kwa Kiswahili cha kawaida na cha sasa.
- source_word: כִּי הַיּוֹם בָּא לָעִיר
  choice: kwa maana amekuja mjini leo
  rationale: Kauli hii inaeleza sababu ya kuharakisha. Wakati timilifu wa Kiswahili unaonyesha kuwasili kwake leo na umuhimu wa matokeo yake kwa hali ya sasa.
- source_word: זֶבַח הַיּוֹם לָעָם
  choice: leo kuna dhabihu kwa ajili ya watu
  rationale: זֶבַח ni dhabihu; tafsiri haiongezi wazi wazo la karamu ambalo linaweza kudokezwa na muktadha lakini halijasemwa moja kwa moja katika mstari huu.
- source_word: בַּבָּמָה
  choice: mahali pa juu
  rationale: במה ni mahali pa ibada palipoinuka. ‘Mahali pa juu’ huhifadhi taswira ya kihistoria na maana ya kiibada bila kuingiza hukumu ya baadaye dhidi ya maeneo kama hayo.
theological_decisions:
- issue: Maana ya במה katika mazingira ya dhabihu kabla ya kujengwa kwa hekalu
  choice: mahali pa juu
  alternative: mahali pa ibada palipoinuka; patakatifu pa kilimani
  rationale: ‘Mahali pa juu’ huhifadhi istilahi na mazingira ya kale bila kudokeza kwamba mstari wenyewe unakubali au unalaumu ibada iliyofanyika hapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa masimulizi umehifadhiwa bila kuwa wa kizamani, na vifungu viwili vya sababu vimeachwa ili kuonyesha kurudiwa kwa כִּי katika Kiebrania.
