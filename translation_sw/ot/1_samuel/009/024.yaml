base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/024.yaml
  text: So the cook took up the leg and what was on it and set it before Saul[a]. And he said, “Look, what has been kept is set before you. Eat, because it was kept for you for the appointed time, from when I said[d][c][b], ‘I have invited the people.’” So Saul ate with Samuel that day.
translation:
  language: sw
  text: Mpishi akainua sehemu ya mguu[a] pamoja na kile kilichokuwa juu yake[b], akaiweka mbele ya Sauli. Kisha akasema, “Tazama, hii ndiyo sehemu iliyohifadhiwa[c]; imewekwa mbele yako. Ule, kwa maana ilikuwa imehifadhiwa kwa ajili yako kwa wakati uliowekwa, tangu niliposema, ‘Niliwaalika[d] watu.’” Basi siku hiyo Sauli akala pamoja na Samueli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “paja.” Neno la Kiebrania שׁוֹק humaanisha sehemu ya mguu wa mnyama.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni, “mguu na kile kilichokuwa juu yake.” Maandiko hayataji wazi kile kilichoambatana na sehemu hiyo.
    reason: lexical_alternative
  - marker: c
    text: Au, “sehemu iliyobaki.” Neno la Kiebrania linaweza kumaanisha kilichosalia au kilichowekwa akiba; muktadha unaunga mkono sehemu iliyotengwa kwa ajili ya Sauli.
    reason: alternative_reading
  - marker: d
    text: Au, “Niliwaita watu.” Katika muktadha huu wa mlo, “niliwaalika” ndiyo maana inayowezekana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטַּבָּח
  choice: mpishi
  rationale: Katika muktadha wa karamu ya dhabihu, mtu huyu anatayarisha na kuandaa nyama mezani; ‘mpishi’ ni ya kawaida na inafaa zaidi kuliko ‘mchinjaji’.
- source_word: הַשּׁוֹק
  choice: sehemu ya mguu
  rationale: Neno hili linamaanisha sehemu ya mguu wa mnyama bila kubainisha kwa uhakika ikiwa ni paja au muundi.
- source_word: וְהֶעָלֶיהָ
  choice: pamoja na kile kilichokuwa juu yake
  rationale: Tafsiri hii inadumisha ujumla wa Kiebrania, ambacho hakitaji wazi sehemu nyingine iliyoambatana na mguu.
- source_word: הַנִּשְׁאָר
  choice: sehemu iliyohifadhiwa
  rationale: Kitenzi kinaweza kumaanisha kilichobaki, lakini muktadha unaonyesha kuwa sehemu hiyo ilikuwa imetengwa makusudi kwa ajili ya Sauli.
- source_word: שִׂים לְפָנֶיךָ
  choice: imewekwa mbele yako
  rationale: Usemi huu unaeleweka kwa kawaida katika tukio hili baada ya mpishi kuiweka sehemu hiyo mbele ya Sauli; tafsiri huepuka amri isiyoeleweka ya Sauli kujiwekea chakula ambacho tayari kimewekwa.
- source_word: לַמּוֹעֵד
  choice: hadi wakati uliowekwa
  rationale: מוֹעֵד huonyesha wakati au tukio lililowekwa; ‘wakati uliowekwa’ inadumisha kusudi la mpango wa awali bila kuufanya kuwa sikukuu maalumu.
- source_word: שָׁמוּר לְךָ
  choice: ilihifadhiwa kwa ajili yako
  rationale: Hali ya neno la Kiebrania inaonyesha kuwa sehemu hiyo ilikuwa imetunzwa au kutengwa hasa kwa ajili ya Sauli.
- source_word: הָעָם קָרָאתִי
  choice: Nimewaalika watu
  rationale: קרא inaweza kuwa ‘kuita’ au ‘kualika’; katika muktadha wa mlo wa pamoja, ‘kualika’ huwasilisha maana inayowezekana zaidi.
- source_word: עִם שְׁמוּאֵל
  choice: pamoja na Samueli
  rationale: Hii inaonyesha moja kwa moja kwamba Sauli na Samueli walishiriki mlo huo.
