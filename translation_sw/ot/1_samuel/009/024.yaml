translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaosomeka kwa urahisi. Viambishi vya ‘aka-’ vinaendeleza mfuatano wa matendo. Jina ‘Samueli’ limetumiwa kwa umbo lililozoeleka katika Kiswahili cha Biblia. Utambulisho wa msemaji haujaongezwa kwa kuwa Kiebrania kinasema tu ‘akasema’.
