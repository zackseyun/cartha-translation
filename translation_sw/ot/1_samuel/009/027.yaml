base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/027.yaml
  text: As they were going down to the edge of the city[a], Samuel said to Saul, “Tell the young man to go on ahead of us.” And he went on ahead. “But you, stand here now[b], and I will let you hear the word of God.”
translation:
  language: sw
  text: Walipokuwa wakishuka kuelekea ukingoni mwa mji, Samueli akamwambia Sauli, “Mwambie yule kijana[a] atangulie mbele yetu.” Naye akatangulia. “Lakini wewe, simama hapa sasa[b], nami nitakufanya usikie neno la Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi.” Neno la Kiebrania נַעַר linaweza kumaanisha kijana, mhudumu, au mtumishi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “simama sasa/kwa wakati huu”; huu ni usemi wa kiidiomu unaomaanisha kusimama na kubaki hapo kwa muda huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹרְדִים
  choice: walipokuwa wakishuka
  rationale: Hali ya kushiriki inaonyesha tendo lililokuwa likiendelea katika simulizi; Kiswahili hiki kinawasilisha mwendo huo kwa kawaida.
- source_word: בִּקְצֵה הָעִיר
  choice: kuelekea ukingoni mwa mji
  rationale: קָצֶה ni mwisho au ukingo. Muundo huu unahifadhi wazo la kufika pembezoni mwa mji bila kufasiri zaidi kuwa vitongoji.
- source_word: אֱמֹר לַנַּעַר
  choice: mwambie yule kijana
  rationale: נַעַר inaweza kumaanisha kijana, mhudumu, au mtumishi. “Kijana” huhifadhi upana wa neno, huku muktadha ukionyesha kuwa ni mwandamani wa Sauli.
- source_word: וְיַעֲבֹר לְפָנֵינוּ
  choice: atangulie mbele yetu
  rationale: עבר pamoja na לִפְנֵי hapa ina maana ya kusonga na kwenda mbele ya wengine; usemi huu ni wa kawaida katika Kiswahili.
- source_word: וַיַּעֲבֹר
  choice: naye akatangulia
  rationale: Kitenzi kinaeleza utekelezaji wa agizo; “akatangulia” huendeleza simulizi kwa ufupi na uwazi.
- source_word: עֲמֹד כַּיּוֹם
  choice: simama hapa sasa
  rationale: Usemi wa Kiebrania ni wa kiidiomu, kwa maana ya kusimama na kubaki kwa muda huo. “Hapa” inadokezwa na mazingira na kufanya agizo liwe la kawaida katika Kiswahili.
- source_word: וְאַשְׁמִיעֲךָ
  choice: nitakufanya usikie
  rationale: Hifili ya שׁמע ni ya kisababishi, yaani “kusababisha usikie.” Tafsiri hii huhifadhi wazi maana hiyo.
- source_word: דְּבַר אֱלֹהִים
  choice: neno la Mungu
  rationale: דָּבָר inaweza kuwa neno, jambo, au ujumbe. Katika mazingira ya ufunuo wa kinabii, “neno la Mungu” huhifadhi uzito na mwangwi wa kifungu bila kukifafanua kupita kiasi.
- source_word: אֱלֹהִים
  choice: Mungu
  rationale: Hapa אֱלֹהִים humrejelea Mungu wa Israeli kwa maana ya umoja; “Mungu” ndiyo tafsiri ya kawaida ya Kiswahili.
theological_decisions:
- issue: Tafsiri ya usemi wa ufunuo דְּבַר אֱלֹהִים
  choice: neno la Mungu
  alternative: ujumbe wa Mungu
  rationale: Kifungu hiki kinaelekea kutambulisha ufunuo wa Mungu ambao Samueli atamweleza Sauli. “Neno la Mungu” huhifadhi uzito wa kitheolojia na wa kinabii bila kuamua mapema namna hasa ya ujumbe huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa simulizi umehifadhiwa, pamoja na tofauti kati ya agizo kwa kijana na agizo kwa Sauli. Alama zote za tanbihi zimewekwa katika matini.
