  text: Then Saul said to his young man[a], “Your word is good. Come[b], let us go.” So they went to the city where the man of God was.
translation:
  language: sw
  text: Ndipo Sauli akamwambia kijana wake, “Ushauri wako ni mzuri. Njoo, twende.” Basi wakaenda katika mji ambako mtu wa Mungu[a] alikuwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mtu wa Mungu” ni cheo cha Kiebrania kinachotumiwa mara nyingi kumaanisha nabii au mtu anayesema kwa niaba ya Mungu.
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: kijana wake
  rationale: Neno hili kimsingi humaanisha kijana, na kiambishi cha umilikaji kinahifadhi uhusiano ulio katika Kiebrania bila kulazimisha tafsiri ya cheo rasmi kama ‘mtumishi’.
- source_word: טוֹב דְּבָרְךָ
  choice: Uliyosema ni mazuri
  rationale: Hapa דָּבָר hurejelea pendekezo au maneno ya mwandamani katika mstari uliotangulia. Kiswahili hiki ni cha kawaida na kinaonyesha kwamba Sauli anakubaliana na alichosema.
- source_word: לְכָה נֵלֵכָה
  choice: Njoo, twende
  rationale: Muundo huu una mwaliko au himizo la kwenda pamoja; ‘Njoo, twende’ huhifadhi nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: הָעִיר
  choice: mji
  rationale: עִיר linaweza kumaanisha mji wa ukubwa mbalimbali; ‘mji’ ndilo neno la kawaida na lisiloongeza dhana ya ukubwa.
- source_word: אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  rationale: Hii ni tafsiri ya moja kwa moja ya cheo cha Kiebrania, na inahifadhi istilahi ya maandiko badala ya kuibadili moja kwa moja kuwa ‘nabii’.
- source_word: אֲשֶׁר שָׁם
  choice: ambako ... alikuwako
  rationale: Muundo wa Kiebrania unaeleza mahali; ‘ambako ... alikuwako’ ni wa asili katika Kiswahili na unafaa simulizi la wakati uliopita.
theological_decisions:
- issue: Tafsiri ya cheo אִישׁ הָאֱלֹהִים
  choice: mtu wa Mungu
  alternative: nabii
  rationale: Ingawa cheo hiki hutumiwa kwa nabii au msemaji wa Mungu, tafsiri ya moja kwa moja huhifadhi msamiati wa kiteolojia wa matini bila kuufasiri kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Uliyosema ni mazuri’ ni cha kawaida kuliko tafsiri sisisi ‘Neno lako ni jema’ katika muktadha huu, huku ‘mtu wa Mungu’ ikihifadhi cheo cha asili.
