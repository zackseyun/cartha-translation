base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/013.yaml
  text: As soon as you enter the city[a], you will find him, before he goes up to the high place to eat. For the people will not eat until he comes, because he is the one who blesses the sacrifice; afterward those who are invited eat. So go up now[c][b], for today you will find him.
translation:
  language: sw
  text: Mnapoingia mjini, mtamkuta kabla hajapanda hadi mahali pa juu[b] ili ale. Kwa maana watu hawatakula mpaka atakapokuja, kwa sababu yeye ndiye atakayeibariki dhabihu[c]; baada ya hayo, walioalikwa watakula. Basi pandeni sasa, kwa maana mtamkuta leo hii[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakati huu.” Neno la Kiebrania כְהַיּוֹם linaweza kusisitiza ukaribu wa wakati, si lazima siku ya kalenda peke yake.
    reason: lexical_alternative
  - marker: b
    text: “Mahali pa juu” ni eneo la ibada lililoinuka ambako dhabihu zilitolewa na milo ya dhabihu ilifanywa.
    reason: cultural_note
  - marker: c
    text: “Kuibariki dhabihu” huenda kunamaanisha kutamka baraka iliyohusiana na mlo wa dhabihu kabla ya walioalikwa kula.
    reason: cultural_note
lexical_decisions:
- source_word: כְּבֹאֲכֶם הָעִיר
  choice: Mnapoingia mjini
  rationale: Muundo wa כ pamoja na kitenzi-jina na kiambishi cha nafsi una maana ya wakati. Kiswahili cha sasa hutumia kwa kawaida “mnapoingia” bila kulazimisha msisitizo wa “mara tu” ambao si lazima katika Kiebrania.
- source_word: כֵּן תִּמְצְאוּן אֹתוֹ
  choice: mtamkuta
  rationale: כֵּן hapa inaimarisha matokeo au uhakika wake; mfuatano huo unaeleweka vizuri katika Kiswahili bila kuongeza neno tofauti kama “ndipo.”
- source_word: בְּטֶרֶם יַעֲלֶה
  choice: kabla hajapanda
  rationale: בְּטֶרֶם huonyesha tendo litakalotangulia jingine, na עלה huhifadhiwa kwa “kupanda,” kwa kuwa mahali pa ibada panatajwa kuwa mahali pa juu.
- source_word: הַבָּמָתָה
  choice: kwenda mahali pa juu
  rationale: במה ni mahali palipoinuka pa ibada na dhabihu. “Mahali pa juu” huhifadhi maana ya msingi bila kukifafanua kupita kiasi kuwa hekalu au madhabahu.
- source_word: לֶאֱכֹל
  choice: kula
  rationale: Kitenzi-jina hiki kina maana ya moja kwa moja ya kula; muktadha unaonyesha kwamba ni mlo unaohusiana na dhabihu.
- source_word: לֹא יֹאכַל הָעָם
  choice: watu hawatakula
  rationale: Kauli ya wakati ujao inafaa katika maelezo ya kile kitakachotokea; “watu” huhifadhi nomino ya pamoja הָעָם.
- source_word: עַד בֹּאוֹ
  choice: mpaka atakapokuja
  rationale: Kitenzi-jina chenye kiambishi baada ya עַד kinatolewa kwa kawaida katika Kiswahili kama kishazi cha wakati.
- source_word: כִּי הוּא יְבָרֵךְ הַזֶּבַח
  choice: kwa sababu yeye ndiye atakayeibariki dhabihu
  rationale: “Yeye ndiye” huhifadhi msisitizo wa kiwakilishi הוּא, huku “kuibariki dhabihu” ikibaki karibu na maneno ya chanzo na kutokufanya maana ya desturi hiyo kuwa wazi kupita kiasi.
- source_word: אַחֲרֵי כֵן יֹאכְלוּ הַקְּרֻאִים
  choice: baada ya hayo, walioalikwa watakula
  rationale: Tafsiri hii huhifadhi mfuatano wa matendo na maana ya kitenzi-tendaji cha kupokewa הַקְּרֻאִים, yaani watu walioalikwa.
- source_word: וְעַתָּה עֲלוּ
  choice: Basi pandeni sasa
  rationale: “Basi” huonyesha hitimisho la ushauri, “sasa” hutafsiri עַתָּה, na “pandeni” huhifadhi mwelekeo wa עלה.
- source_word: כְהַיּוֹם
  choice: leo hii
  rationale: Neno hili linaweza kuelekeza kwenye siku ya leo au kusisitiza wakati wa karibu. “Leo hii” ni la asili na huhifadhi maana ya siku, huku tanbihi ikionyesha uwezekano wa “wakati huu.”
theological_decisions:
- issue: Maana ya ‘kuibariki dhabihu’
  choice: Maneno ya chanzo yamehifadhiwa katika matini kuu.
  alternative: Kutafsiri moja kwa moja kuwa ‘kutoa baraka kabla ya mlo wa dhabihu.’
  rationale: Kiebrania kinasema יְבָרֵךְ הַזֶּבַח, na ingawa huenda kinamaanisha kutamka baraka inayohusiana na mlo wa dhabihu, matini kuu haipaswi kufunga kabisa namna baraka hiyo ilivyohusiana na dhabihu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Mnapoingia,” “pandeni,” na “walioalikwa” ni miundo ya kawaida na ya moja kwa moja. Alama za tanbihi zimewekwa mara moja kila moja karibu na maneno yanayofafanuliwa.
