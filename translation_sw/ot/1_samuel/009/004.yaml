translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa na wenye heshima. Majina ya maeneo yamehifadhiwa kwa matamshi yanayosomeka kwa Kiswahili. Mabadiliko ya umoja na wingi katika vitenzi yamefuata maandishi ya Kiebrania.
