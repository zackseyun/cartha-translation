base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/004.yaml
  text: He passed through the hill country of Ephraim and passed through the land of Shalishah[a], but they did not find them. Then they passed through the land of Shaalim, but they were not there. Then he passed through the land of Benjamin[b], but they did not find them.
translation:
  language: sw
  text: Akapita katika nchi ya vilima ya Efraimu, akapita katika nchi ya Shalisha, lakini hawakuwapata[a]. Kisha wakapita katika nchi ya Shaalimu, lakini hawakuwako huko[b]. Kisha akapita katika nchi ya Benyamini, lakini hawakuwapata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania hakitaji kitu kinachotafutwa moja kwa moja; kiambishi cha yambwa “-wa-” kinarejelea punda waliopotea waliotajwa katika muktadha uliotangulia.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “hapakuwa na kitu” au “hakukuwako”; ni usemi mfupi unaomaanisha kwamba punda hawakuwako huko.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר / וַיַּעַבְרוּ
  choice: akapita / wakapita
  rationale: Kitenzi עבר pamoja na בְ kinaonyesha kusafiri kupitia eneo. “Kupita katika” ni Kiswahili cha kawaida na huhifadhi mfuatano wa safari; umoja na wingi wa vitenzi vya Kiebrania umehifadhiwa.
- source_word: בְּהַר אֶפְרַיִם
  choice: katika nchi ya vilima ya Efraimu
  rationale: Katika usemi huu wa kijiografia, הַר humaanisha eneo la vilima, si kilima kimoja tu. “Nchi ya vilima” ni ya asili na inaeleweka katika Kiswahili.
- source_word: אֶרֶץ שָׁלִשָׁה
  choice: nchi ya Shalisha
  rationale: אֶרֶץ hapa ni eneo lenye jina. “Nchi ya” huhifadhi maana ya kijiografia bila kudai hadhi maalumu ya kisiasa.
- source_word: וְלֹא מָצָאוּ
  choice: lakini hawakuwapata
  rationale: Kitenzi cha wingi kinawahusu Sauli na mtumishi wake. Kiebrania hakitaji yambwa; kiambishi “wa-” kimeongezwa kwa uwazi wa Kiswahili na kinarejelea punda waliotajwa awali.
- source_word: אֶרֶץ שַׁעֲלִים
  choice: nchi ya Shaalimu
  rationale: Jina la eneo limetoholewa kwa mfumo unaosomeka kwa Waswahili, huku “nchi ya” ikihifadhi maana ya eneo.
- source_word: וָאַיִן
  choice: lakini hawakuwako huko
  rationale: Usemi wa Kiebrania ni mfupi, kihalisi “na hapakuwa/hakukuwako.” Muktadha unaonyesha kuwa unawahusu punda; tafsiri hii huweka maana hiyo wazi bila kuificha hali ya usemi wa asili, ambayo imeelezwa katika tanbihi.
- source_word: אֶרֶץ יְמִינִי
  choice: nchi ya Benyamini
  rationale: יְמִינִי ni umbo la kivumishi au la jina la watu linalohusiana na Benyamini. Katika muktadha wa kijiografia, “nchi ya Benyamini” ndiyo tafsiri iliyo wazi na ya kawaida.
