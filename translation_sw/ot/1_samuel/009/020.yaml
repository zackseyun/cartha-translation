  text: וְ/לָ/אֲתֹנ֞וֹת הָ/אֹבְד֣וֹת לְ/ךָ֗ הַ/יּוֹם֙ שְׁלֹ֣שֶׁת הַ/יָּמִ֔ים אַל תָּ֧שֶׂם אֶֽת לִבְּ/ךָ֛ לָ/הֶ֖ם כִּ֣י נִמְצָ֑אוּ וּ/לְ/מִי֙ כָּל חֶמְדַּ֣ת יִשְׂרָאֵ֔ל הֲ/ל֣וֹא לְ/ךָ֔ וּ/לְ/כֹ֖ל בֵּ֥ית אָבִֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/020.yaml
  text: And as for the donkeys that were lost to you three days ago[a], do not set your heart on them, for they have been found[b]. And for whom is all the desire of Israel? Is it not for you and for all your father's house?
translation:
  language: sw
  text: Na kuhusu wale punda-jike wako waliopotea siku tatu zilizopita, usijishughulishe nao, kwa maana wamepatikana. Na tamaa yote ya Israeli ni ya nani?[a] Je, si yako wewe na ya nyumba yote ya baba yako?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na yote yanayotamanika katika Israeli ni ya nani?” Neno la Kiebrania linaweza kumaanisha tamaa ya Israeli au vitu vinavyopendeza na vya thamani katika Israeli.
    reason: lexical_alternative
  - marker: b
    text: “Nyumba ya baba yako” ni usemi wa Kiebrania unaomaanisha jamaa au ukoo mpana kuliko familia ya karibu tu.
    reason: cultural_note
lexical_decisions:
- source_word: אֲתֹנוֹת
  choice: punda-jike
  rationale: Nomino ya Kiebrania inataja wazi punda wa kike. Kiswahili cha sasa kinaweza kueleza jinsia hii kwa kawaida bila kuifanya sentensi kuwa nzito.
- source_word: הָאֹבְדוֹת
  choice: waliopotea
  rationale: Huwasilisha hali ya wanyama waliokuwa wamepotea kwa lugha ya kawaida na iliyo wazi.
- source_word: הַיּוֹם שְׁלֹשֶׁת הַיָּמִים
  choice: siku tatu zilizopita
  rationale: Hii ndiyo namna ya asili ya Kiswahili ya kuwasilisha msemo wa wakati wa Kiebrania unaorejelea siku tatu kabla.
- source_word: אַל תָּשֶׂם אֶת־לִבְּךָ לָהֶם
  choice: usijishughulishe nao
  rationale: Nahau ya Kiebrania, kihalisi ‘usiweke moyo wako kwao,’ humaanisha kutowakazia fikira au kutokuwa na wasiwasi juu yao. Chaguo hili ni la kawaida katika Kiswahili na haliongezi wazo lisilokuwapo.
- source_word: נִמְצָאוּ
  choice: wamepatikana
  rationale: 'Huhifadhi kauli tendwa na hali ya matokeo ya kitenzi cha Kiebrania: sasa punda hao wamekwisha kupatikana.'
- source_word: וּלְמִי כָּל חֶמְדַּת יִשְׂרָאֵל
  choice: Na matamanio yote ya Israeli yanamwelekea nani?
  rationale: חֶמְדַּת inaweza kumaanisha tamanio, kitu cha kupendeza, au kitu cha thamani. Tafsiri hii huhifadhi usemi wa hali ya juu na swali la balagha, huku tanbihi ikionyesha maana nyingine halali.
- source_word: הֲלוֹא
  choice: Je, si
  rationale: Huhifadhi swali la balagha linalotarajia jibu la kukubali.
- source_word: לְךָ וּלְכֹל בֵּית אָבִיךָ
  choice: kwako wewe na kwa nyumba yote ya baba yako
  rationale: Huhifadhi istilahi ya kijamii na ukoo ya Kiebrania badala ya kuifupisha kuwa familia ya karibu pekee.
theological_decisions:
- issue: Maana ya kauli ya Samweli kuhusu חֶמְדַּת יִשְׂרָאֵל
  choice: Kauli imeachwa kuwa ya hali ya juu na yenye uwezekano wa kurejelea matamanio ya Israeli yanayomwelekea Sauli na nyumba ya baba yake.
  alternative: Inaweza kumaanisha kwamba vitu vyote vinavyotamanika au vya thamani katika Israeli ni vya Sauli na nyumba ya baba yake; wengine huiona kuwa dokezo la ufalme ambao Israeli iliutamani.
  rationale: Muktadha unaelekea kwenye kuteuliwa kwa Sauli, lakini mstari wenyewe hautaji ufalme waziwazi. Tafsiri haipaswi kuingiza hitimisho hilo ndani ya matini wala kuondoa utata wa Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ni rahisi kueleweka kwa wasomaji wa kawaida, huku swali la balagha, utata wa חֶמְדַּת, na usemi wa ukoo ‘nyumba ya baba yako’ vikihifadhiwa.
