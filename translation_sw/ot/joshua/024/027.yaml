  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם הִנֵּ֨ה הָ/אֶ֤בֶן הַ/זֹּאת֙ תִּֽהְיֶה בָּ֣/נוּ לְ/עֵדָ֔ה כִּֽי הִ֣יא שָׁמְעָ֗ה אֵ֚ת כָּל אִמְרֵ֣י יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר עִמָּ֑/נוּ וְ/הָיְתָ֤ה בָ/כֶם֙ לְ/עֵדָ֔ה פֶּֽן תְּכַחֲשׁ֖וּ/ן בֵּ/אלֹהֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/027.yaml
  text: And Joshua said to all the people[a], “Look, this stone will be a witness against us, for it has heard all the words of Yahweh that he spoke with us. And it will be a witness against you[c][b], lest you deny your God.”
translation:
  language: sw
  text: Yoshua akawaambia watu wote, “Tazama, jiwe hili litakuwa shahidi dhidi yetu[a], kwa maana lenyewe limesikia[b] maneno yote ambayo Yahwe alisema nasi. Nalo litakuwa shahidi dhidi yenu, msije mkamkana Mungu wenu[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shahidi kwetu” au “shahidi kwa ajili yetu.” Kihusishi cha Kiebrania kinaweza kueleweka kwa namna isiyoegemea upande, lakini katika muktadha jiwe linatoa ushahidi dhidi ya kutokuwa waaminifu kwa agano.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “limesikia.” Jiwe linaelezwa kana kwamba ni mtu aliyesikia maneno ya agano na anayeweza kutoa ushahidi.'
    reason: cultural_note
  - marker: c
    text: Au “msimtendee Mungu wenu kwa udanganyifu” au “msikose kuwa waaminifu kwa Mungu wenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tazama
  rationale: Neno hili la kawaida na lenye heshima linavuta fikira kwenye jiwe bila kutumia lugha ya kizamani.
- source_word: הָאֶבֶן הַזֹּאת
  choice: jiwe hili
  rationale: אֶבֶן kwa kawaida ni ‘jiwe’; tafsiri hii inafaa kwa jiwe lililosimamishwa kuwa ishara ya agano.
- source_word: תִּהְיֶה ... לְעֵדָה
  choice: litakuwa shahidi
  rationale: Inahifadhi lugha ya kisheria ya agano na pia uhuishaji wa jiwe kama shahidi.
- source_word: בָּנוּ / בָכֶם
  choice: dhidi yetu / dhidi yenu
  rationale: Ingawa kihusishi ב kinaweza kueleweka kwa namna isiyoegemea upande, muktadha wa onyo la agano unaonyesha ushahidi unaoweza kuwashtaki wale wasio waaminifu.
- source_word: שָׁמְעָה
  choice: limesikia
  rationale: Inadumisha kauli ya moja kwa moja inayolifanya jiwe kuwa kama mtu aliyesikia maneno ya agano.
- source_word: כָּל אִמְרֵי יְהוָה
  choice: maneno yote ya Yahwe
  rationale: ‘Maneno’ ni Kiswahili cha kawaida kinachofaa kwa matamko ya agano, huku jina la Mungu likihifadhiwa kama Yahwe.
- source_word: אֲשֶׁר דִּבֶּר עִמָּנוּ
  choice: aliyosema nasi
  rationale: ‘Nasi’ linaakisi kihusishi עִם, ‘pamoja na/sisi,’ badala ya kubadili kauli kuwa mawasiliano ya upande mmoja tu.
- source_word: פֶּן
  choice: msije
  rationale: Muundo huu wa Kiswahili unatoa kwa kawaida nguvu ya onyo na kinga iliyomo katika פֶּן.
- source_word: תְּכַחֲשׁוּן בֵּאלֹהֵיכֶם
  choice: mkamkana Mungu wenu
  rationale: כחש hapa inaweza kumaanisha kumkana au kutenda kwa uongo kwa Mungu; ‘mkamkana’ ni wazi na inafaa katika onyo la kutokuwa mwaminifu kwa agano.
theological_decisions:
- issue: Jiwe kuhuishwa kana kwamba linasikia na kushuhudia
  choice: Kuhifadhi moja kwa moja lugha ya kwamba jiwe ‘limesikia’ na ‘litakuwa shahidi’
  alternative: Kulieleza tu kuwa kumbukumbu ya mfano bila kusema kwamba limesikia
  rationale: Kiebrania hulihuisha jiwe waziwazi katika mazingira ya kufanywa upya kwa agano; kuacha usemi huo kungedhoofisha balagha ya chanzo.
- issue: Mwelekeo wa ushahidi wa jiwe
  choice: ‘dhidi yetu’ na ‘dhidi yenu’
  alternative: ‘kwa ajili yetu/yenu’ au ‘kwetu/kwenu’
  rationale: Kihusishi cha Kiebrania kina nafasi ya maana pana, lakini onyo linalofuata linaunga mkono maana ya jiwe kutoa ushahidi dhidi ya uvunjaji wa agano. Utata huo umeonyeshwa katika tanbihi.
- issue: Maana ya כחש katika uhusiano na Mungu
  choice: ‘kumkana Mungu wenu’
  alternative: ‘kumtendea Mungu wenu kwa udanganyifu’ au ‘kutokuwa waaminifu kwa Mungu wenu’
  rationale: ‘Kumkana’ huhifadhi ukali wa onyo bila kuingiza maelezo ya kimadhehebu; tanbihi inaonyesha maana nyingine zinazowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki chenye mtindo wa sasa, wa heshima, na unaosomeka kwa urahisi. ‘Tazama’ huhifadhi msisitizo wa הִנֵּה; ‘nasi’ hudumisha wazo la kusema pamoja na watu; na urudiaji wa ‘litakuwa shahidi’ unafuata urudiaji wa Kiebrania.
