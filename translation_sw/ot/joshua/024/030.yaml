  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Majina ya mahali yametoholewa kama Timnath-sera na Gaashi; istilahi ya kijiografia ‘nchi ya vilima’ imetumiwa badala ya kuashiria mlima mmoja.
