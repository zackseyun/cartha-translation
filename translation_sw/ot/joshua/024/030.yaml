base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/030.yaml
  text: And they buried him within the territory of his inheritance[a], at Timnath-serah, which is in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: sw
  text: Nao wakamzika katika eneo la urithi wake[a], huko Timnath-sera, ambayo iko katika nchi ya vilima ya Efraimu, kaskazini mwa Mlima Gaashi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika mpaka wa urithi wake.” Neno la Kiebrania linaweza kumaanisha mpaka au eneo lililo ndani yake; hapa huenda linamaanisha eneo la sehemu aliyogawiwa Yoshua kama urithi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Nao wakamzika
  rationale: Muundo wa simulizi wa wayyiqtol unaendeleza tukio linalofuata; kiambishi -m- kinawakilisha אֹתוֹ na kumrejelea Yoshua.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: katika eneo la urithi wake
  rationale: גְּבוּל inaweza kumaanisha mpaka au eneo lililo ndani ya mpaka. Katika muktadha wa mahali pa maziko ndani ya sehemu aliyogawiwa Yoshua, ‘eneo la urithi wake’ ni Kiswahili cha kawaida huku utata wa kileksika ukihifadhiwa katika tanbihi.
- source_word: בְּתִמְנַת סֶרַח
  choice: huko Timnath-sera
  rationale: Jina la mahali limetoholewa kwa mwandiko wa Kiswahili; ‘huko’ huonyesha kwa kawaida mahali pa maziko.
- source_word: בְּהַר אֶפְרָיִם
  choice: katika nchi ya vilima ya Efraimu
  rationale: הַר hapa inaashiria eneo la vilima, si mlima mmoja; ‘nchi ya vilima’ huwasilisha maana hiyo ya kijiografia kwa uwazi.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: kaskazini mwa Mlima Gaashi
  rationale: Kirai kinaonyesha mahali panapohusiana na alama ya kijiografia, yaani upande wa kaskazini wa Mlima Gaashi.
