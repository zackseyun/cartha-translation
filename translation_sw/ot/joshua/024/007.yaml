  edition: WLC
  text: וַ/יִּצְעֲק֣וּ אֶל יְהוָ֗ה וַ/יָּ֨שֶׂם מַֽאֲפֵ֜ל בֵּינֵי/כֶ֣ם וּ/בֵ֣ין הַ/מִּצְרִ֗ים וַ/יָּבֵ֨א עָלָ֤י/ו אֶת הַ/יָּם֙ וַ/יְכַסֵּ֔/הוּ וַ/תִּרְאֶ֨ינָה֙ עֵינֵי/כֶ֔ם אֵ֥ת אֲשֶׁר עָשִׂ֖יתִי בְּ/מִצְרָ֑יִם וַ/תֵּשְׁב֥וּ בַ/מִּדְבָּ֖ר יָמִ֥ים רַבִּֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/007.yaml
  text: Then they cried out to Yahweh[a], and he put darkness between you and the Egyptians, and brought the sea upon him and covered him, and your eyes saw what I did in Egypt. Then you lived in the wilderness many days.
translation:
  language: sw
  text: Ndipo wakamlilia Yahweh, naye akaweka giza kati yenu na Wamisri. Akaileta bahari juu yake[a], akamfunika. Macho yenu yaliona yale niliyofanya katika Misri. Kisha mkakaa jangwani siku nyingi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinatumia viwakilishi vya umoja hapa: “juu yake” na “akamfunika.” Huenda umoja huo unarejelea Misri au jeshi la Wamisri kwa maana ya kijumla; tafsiri nyingi hutumia wingi, “juu yao” na “akawafunika.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצְעֲקוּ אֶל יְהוָה
  choice: wakamlilia Yahweh
  rationale: Kitenzi צעק kinaonyesha kilio cha dhiki cha kuomba msaada; “wakamlilia” ni Kiswahili cha kawaida kinachohifadhi uzito huo na mwelekeo wa kilio kwa Yahweh.
- source_word: מַאֲפֵל
  choice: giza
  rationale: Neno hili humaanisha giza au giza zito; “giza” ni wazi na la kawaida bila kuongeza kiwango kisichobainishwa na muktadha huu.
- source_word: בֵּינֵיכֶם וּבֵין הַמִּצְרִים
  choice: kati yenu na Wamisri
  rationale: Huhifadhi nafsi ya pili wingi katika hotuba ya agano na kutaja Wamisri moja kwa moja.
- source_word: וַיָּבֵא עָלָיו אֶת הַיָּם וַיְכַסֵּהוּ
  choice: Akaileta bahari juu yake, nayo ikamfunika
  rationale: “Juu yake” na “ikamfunika” zinahifadhi viambishi vya Kiebrania vya umoja; kutaja bahari kuwa mtendaji wa kufunika hufanya sentensi iwe ya asili katika Kiswahili bila kulainisha umoja kuwa wingi.
- source_word: וַתִּרְאֶינָה עֵינֵיכֶם
  choice: Macho yenu yaliona
  rationale: Huhifadhi kutajwa wazi kwa macho, ambako kunasisitiza ushuhuda wa moja kwa moja.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי בְּמִצְרָיִם
  choice: yale niliyofanya Misri
  rationale: Huhifadhi mabadiliko ya ghafla kutoka nafsi ya tatu kwenda sauti ya Mungu katika nafsi ya kwanza, na kutafsiri ב kwa maana ya mahali bila kuongeza “dhidi ya.”
- source_word: וַתֵּשְׁבוּ בַמִּדְבָּר יָמִים רַבִּים
  choice: mkakaa jangwani siku nyingi
  rationale: “Mkakaa” ni la asili kwa ישב katika kipindi kirefu, na “siku nyingi” huhifadhi usemi halisi יָמִים רַבִּים.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano lenye herufi nne, si cheo; “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Viambishi vya umoja vinavyorejelea upande wa Misri
  choice: kuhifadhi umoja katika “juu yake” na “ikamfunika”
  alternative: “juu yao” na “ikawafunika,” au kutaja jeshi la Wamisri waziwazi
  rationale: Kiebrania kina viambishi vya umoja katika עָלָיו na וַיְכַסֵּהוּ. Umoja unaweza kuwa wa kijumla ukirejelea Misri au jeshi lake; rasimu haubadili utata huo kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa msomaji wa kawaida, huku ukihifadhi nafsi ya pili wingi, mabadiliko kwenda nafsi ya kwanza katika “niliyofanya,” usemi “macho yenu,” na viambishi tata vya umoja.
