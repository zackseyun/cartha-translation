  yaml_path: translation/ot/joshua/024/029.yaml
  text: And it happened after these things that Joshua son of Nun[a], the servant of Yahweh, died[b], being one hundred and ten years old.
translation:
  language: sw
  text: Ikawa, baada ya mambo haya[a], Yoshua mwana wa Nuni, mtumishi[b] wa Yahwe, akafa akiwa na umri wa miaka mia moja na kumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya matukio haya.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania pia kinaweza kutafsiriwa “mtumwa wa Yahwe,” lakini hapa cheo hiki kinakazia utumishi wenye heshima kuliko hali ya utumwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi kazi ya kifungu hiki cha Kiebrania ya kuendeleza simulizi na kutambulisha tukio linalofuata, kwa Kiswahili cha kawaida cha masimulizi.
- source_word: אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: baada ya mambo haya
  rationale: Ni tafsiri ya karibu ya usemi wa wakati; neno דְּבָרִים linaweza kumaanisha mambo au matukio katika muktadha huu.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yoshua mwana wa Nuni
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili, huku uhusiano wa kifamilia wa בִּן ukihifadhiwa wazi.
- source_word: וַיָּמָת
  choice: akafa
  rationale: Kitenzi מות kinamaanisha moja kwa moja kufa; tafsiri hii hailegezi kauli ya chanzo.
- source_word: עֶבֶד יְהוָה
  choice: mtumishi wa Yahwe
  rationale: Ingawa עֶבֶד inaweza kumaanisha mtumwa au mtumishi, hapa ni cheo cha heshima kinachoonyesha utumishi wa Yoshua kwa Yahwe.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: akiwa na umri wa miaka mia moja na kumi
  rationale: Hii inatoa kwa Kiswahili cha asili nahau ya Kiebrania inayosema kihalisi kwamba alikuwa 'mwana wa miaka' mia moja na kumi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu, YHWH. 'Yahwe' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya עֶבֶד katika cheo cha Yoshua
  choice: mtumishi
  alternative: mtumwa
  rationale: Neno linaweza kubeba maana zote mbili, lakini katika muktadha huu linafanya kazi kama cheo cha heshima cha mtu anayemtumikia Yahwe, si msisitizo wa hali ya utumwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa heshima na unaoeleweka kwa msomaji wa kawaida. 'Ikawa' imetumiwa kwa ladha ya simulizi bila kutumia lugha nzito au ya kizamani kupita kiasi.
