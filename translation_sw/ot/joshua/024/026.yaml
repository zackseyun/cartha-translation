base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/026.yaml
  text: And Joshua wrote these words in the Book of the Law of God[b][a], and he took a large stone and set it up there under the oak that was in the sanctuary of Yahweh.
translation:
  language: sw
  text: Yoshua akaandika maneno haya katika Kitabu cha Sheria ya Mungu. Kisha akachukua jiwe kubwa na kulisimamisha pale chini ya mwaloni[a] uliokuwa katika mahali patakatifu pa Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chini ya mti wa mterebinthi.” Neno la Kiebrania linaweza kumaanisha mterebinthi badala ya mwaloni.
    reason: lexical_alternative
  - marker: b
    text: Au, “uliokuwa karibu na mahali patakatifu pa Yahweh.” Kihusishi cha Kiebrania kinaweza kueleweka kwa maana pana zaidi ya mahali katika muktadha huu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: akaandika
  rationale: Kitenzi כתב humaanisha moja kwa moja ‘kuandika’; umbo la masimulizi ‘akaandika’ linaendeleza mfululizo wa matendo katika Kiebrania.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: maneno haya
  rationale: Ingawa דברים pia linaweza kumaanisha ‘mambo,’ hapa linaelekea kwa maneno ya agano yaliyoandikwa, hivyo ‘maneno haya’ huhifadhi maana ya kimatini.
- source_word: בְּסֵפֶר תּוֹרַת אֱלֹהִים
  choice: katika Kitabu cha Sheria ya Mungu
  rationale: ‘Kitabu’ ni tafsiri ya kawaida na inayoeleweka ya ספר, ingawa kitu chenyewe huenda kilikuwa gombo; ‘Sheria ya Mungu’ huhifadhi muundo wa סמיכות na muktadha wa agano.
- source_word: וַיִּקַּח אֶבֶן גְּדוֹלָה
  choice: akachukua jiwe kubwa
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya jiwe lenye ukubwa mkubwa.
- source_word: וַיְקִימֶהָ
  choice: kulisimamisha
  rationale: Hifili ya קום hapa ina maana ya kulifanya jiwe lisimame, yaani kulisimamisha kama jiwe la ukumbusho.
- source_word: תַּחַת הָאַלָּה
  choice: chini ya mwaloni
  rationale: אַלָּה hutaja mti mkubwa ambao utambulisho wake unaweza kuwa mwaloni au mterebinthi; ‘mwaloni’ ni neno linaloeleweka zaidi, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: בְּמִקְדַּשׁ יְהוָה
  choice: katika mahali patakatifu pa Yahwe
  rationale: מִקְדָּשׁ ni mahali patakatifu au patakatifu rasmi, na בְּ kwa kawaida ni ‘katika’; usemi huu pia unaweza kumaanisha eneo takatifu, si lazima ndani ya jengo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetafsiriwa kwa umbo la Kiswahili ‘Yahwe’ badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina binafsi יהוה; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano wa mti na מִקְדַּשׁ יהוה
  choice: mti ulikuwa katika mahali patakatifu pa Yahwe
  alternative: mti ulikuwa karibu na mahali patakatifu pa Yahwe
  rationale: Kihusishi בְּ kwa kawaida hutoa maana ya ‘katika,’ kwa hiyo hiyo ndiyo tafsiri kuu; maana pana ya mahali, ‘karibu na,’ imehifadhiwa katika tanbihi kwa sababu muktadha unaweza kuruhusu usomaji huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaosomeka kwa urahisi. ‘Kisha’ husaidia kutenganisha tendo la kuandika na tendo la kusimamisha jiwe bila kuongeza uhusiano wa kimantiki usiokuwapo. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
