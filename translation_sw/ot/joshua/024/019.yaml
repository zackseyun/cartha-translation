  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל הָ/עָ֗ם לֹ֤א תֽוּכְלוּ֙ לַ/עֲבֹ֣ד אֶת יְהוָ֔ה כִּֽי אֱלֹהִ֥ים קְדֹשִׁ֖ים ה֑וּא אֵֽל קַנּ֣וֹא ה֔וּא לֹֽא יִשָּׂ֥א לְ/פִשְׁעֲ/כֶ֖ם וּ/לְ/חַטֹּאותֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/019.yaml
  text: And Joshua said to the people[a], “You are not able to serve Yahweh, for he is a holy God; he is a jealous God[b]. He will not forgive your transgressions and your sins.”
translation:
  language: sw
  text: Yoshua akawaambia watu, “Hamwezi kumtumikia Yahwe, kwa kuwa yeye ni Mungu mtakatifu[a]; yeye ni Mungu mwenye wivu. Hatasamehe maasi yenu wala dhambi zenu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Katika Kiebrania, maneno yanayotafsiriwa “Mungu mtakatifu” yana maumbo ya wingi, lakini kiwakilishi kinachofuata ni cha umoja: kwa tafsiri ya neno kwa neno, “Miungu watakatifu, yeye.” Kiwakilishi cha umoja kinaonyesha kuwa anayerejelewa ni Mungu mmoja wa Israeli.'
    reason: lexical_alternative
  - marker: b
    text: Au, “Hatabeba” au “hataondoa maasi yenu wala dhambi zenu.” Nahau hii ya Kiebrania hutumiwa kwa kawaida kumaanisha kusamehe.
    reason: alternative_reading
lexical_decisions:
- source_word: תֽוּכְלוּ
  choice: Hamwezi
  rationale: Kitenzi יכל kinaeleza uwezo; ‘hamwezi’ kinaonyesha wazi kutokuwa na uwezo katika muktadha huu.
- source_word: לַעֲבֹד
  choice: kumtumikia
  rationale: עבד hapa inahusu kumtumikia Mungu katika uaminifu wa agano, maana pana inayojumuisha ibada bila kuishia kwenye matendo ya ibada pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa na cheo kama ‘BWANA’.
- source_word: אֱלֹהִים קְדֹשִׁים הוּא
  choice: yeye ni Mungu mtakatifu
  rationale: Ingawa ‘Mungu’ na ‘mtakatifu’ zina maumbo ya wingi katika Kiebrania, kiwakilishi הוּא ni cha umoja na kinamrejelea Mungu mmoja wa Israeli.
- source_word: אֵל קַנּוֹא
  choice: Mungu mwenye wivu
  rationale: קַנּוֹא inaeleza dai la Mungu la uaminifu usiogawanyika na kutokubali miungu au waaminifu washindani; ‘mwenye wivu’ huhifadhi nguvu hiyo ya kimahusiano na kiagano.
- source_word: לֹא יִשָּׂא
  choice: Hatasamehe
  rationale: נשא pamoja na maneno ya dhambi ni nahau inayoweza kumaanisha kusamehe, ingawa maana halisi ya kubeba au kuondoa imeonyeshwa katika tanbihi.
- source_word: פִשְׁעֲכֶם
  choice: maasi yenu
  rationale: פשע hubeba maana ya kuvunja mamlaka kwa uasi; ‘maasi’ huhifadhi uzito wa ukiukaji wa agano.
- source_word: חַטֹּאותֵיכֶם
  choice: dhambi zenu
  rationale: חטאת ni neno la kawaida la dhambi; ‘dhambi’ ndiyo tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Maumbo ya wingi katika אֱלֹהִים קְדֹשִׁים pamoja na kiwakilishi cha umoja
  choice: 'Kutafsiri kwa umoja: ‘yeye ni Mungu mtakatifu,’ huku umbo la Kiebrania likielezwa katika tanbihi.'
  alternative: Tafsiri ya neno kwa neno yenye maumbo ya wingi, ambayo kwa Kiswahili ingedokeza kimakosa miungu mingi.
  rationale: Kiwakilishi cha umoja הוּא na muktadha vinathibitisha kuwa anayerejelewa ni Mungu mmoja wa Israeli; tanbihi huhifadhi hali isiyo ya kawaida ya kisarufi bila kuleta maana potovu.
- issue: Maana ya לֹא יִשָּׂא kuhusu maasi na dhambi
  choice: Kutumia maana ya kinahau ‘Hatasamehe.’
  alternative: ‘Hatabeba’ au ‘hataondoa’ maasi na dhambi.
  rationale: נשא pamoja na dhambi hutumiwa kwa maana ya kusamehe, lakini uwezekano wa picha halisi ya kubeba au kuondoa umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Kumtumikia’ huhifadhi maana pana ya huduma na uaminifu wa agano; ‘maasi’ huonyesha kwa nguvu zaidi wazo la פשע kuliko ‘makosa.’
