  to: Kwa maana Yahwe Mungu wetu ndiye aliyetupandisha sisi pamoja na baba zetu kutoka nchi ya Misri, kutoka nyumba ya watumwa,[a] na aliyefanya ishara hizi kuu mbele ya macho yetu,[b] akatulinda katika njia yote tuliyoitembea na miongoni mwa mataifa yote tuliyopita katikati yao.
