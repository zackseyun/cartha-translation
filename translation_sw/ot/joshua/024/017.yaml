id: JOS.24.17
reference: Joshua 24:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוּא֩ הַ/מַּעֲלֶ֨ה אֹתָ֧/נוּ וְ/אֶת אֲבוֹתֵ֛י/נוּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֣ית עֲבָדִ֑ים וַ/אֲשֶׁ֧ר עָשָׂ֣ה לְ/עֵינֵ֗י/נוּ אֶת הָ/אֹת֤וֹת הַ/גְּדֹלוֹת֙ הָ/אֵ֔לֶּה וַֽ/יִּשְׁמְרֵ֗/נוּ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הָלַ֣כְנוּ בָ֔/הּ וּ/בְ/כֹל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֥ר עָבַ֖רְנוּ בְּ/קִרְבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/017.yaml
  text: For Yahweh our God is the one who brought us and our fathers up from the land of Egypt[a], from the house of servants, and who did these great signs before our eyes, and kept us in all the way in which we walked[b], and among all the peoples through whose midst we passed.
translation:
  language: sw
  text: Kwa maana Yahwe Mungu wetu ndiye aliyetupandisha sisi pamoja na baba zetu kutoka nchi ya Misri, kutoka nyumba ya watumwa,[a] na aliyefanya ishara hizi kuu mbele ya macho yetu,[b] akatulinda katika njia yote tuliyoitembea na miongoni mwa mataifa yote tuliyopita katikati yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka nyumba ya utumwa.” Kiebrania ni, “kutoka nyumba ya watumwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “maajabu haya makuu” au “miujiza hii mikuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Inaonyesha sababu inayotolewa na watu kwa uamuzi wao katika mstari uliotangulia, huku ikidumisha uhusiano wa hoja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inawakilisha jina la agano la Mungu lililoandikwa moja kwa moja katika Kiebrania.
- source_word: הוּא הַמַּעֲלֶה
  choice: ndiye aliyetupandisha
  rationale: Neno 'ndiye' linadumisha mkazo wa kiwakilishi huru הוּא, na 'aliyetupandisha' linahifadhi taswira ya kitenzi עלה, yaani kuleta au kupandisha juu kutoka Misri.
- source_word: וְאֶת אֲבוֹתֵינוּ
  choice: sisi na baba zetu
  rationale: Inadumisha rejeo la moja kwa moja kwa vizazi vya kiume vilivyotangulia katika usemi wa kihistoria wa Israeli; 'mababu zetu' lingewezekana pia.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: kutoka nchi ya Misri
  rationale: Inahifadhi nomino 'nchi' iliyo wazi katika matini ya Kiebrania.
- source_word: מִבֵּית עֲבָדִים
  choice: kutoka nyumba ya watumwa
  rationale: Ni tafsiri ya karibu ya usemi halisi 'nyumba ya watumwa' na hailegezi hali yao ya kufungwa katika utumwa.
- source_word: הָאֹתוֹת הַגְּדֹלוֹת הָאֵלֶּה
  choice: ishara hizi kuu
  rationale: Neno 'ishara' linahifadhi maana ya msingi ya אוֹת bila kuamua kimbele kwamba neno hilo lazima litafsiriwe 'miujiza' au 'maajabu'.
- source_word: וַיִּשְׁמְרֵנוּ
  choice: Alitulinda
  rationale: Katika muktadha wa safari, שׁמר lina maana ya ulinzi na uhifadhi; 'alitulinda' ni Kiswahili cha kawaida na wazi.
- source_word: בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַכְנוּ בָהּ
  choice: katika njia yote tuliyosafiri
  rationale: Inawasilisha kwa Kiswahili cha asili wazo la kulindwa katika mwendo wote waliouendea.
- source_word: וּבְכֹל הָעַמִּים אֲשֶׁר עָבַרְנוּ בְּקִרְבָּם
  choice: na kati ya mataifa yote tuliyopita katikati yao
  rationale: Inahifadhi wazo la kupita miongoni au katikati ya mataifa hayo, bila kuyafanya mataifa yenyewe kuwa njia.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ina jina la Mungu la herufi nne moja kwa moja; 'Yahwe' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya עֲבָדִים katika usemi wa kutoka Misri
  choice: watumwa
  alternative: utumwa
  rationale: Kiebrania kimetumia nomino ya wingi inayowataja watu waliokuwa watumwa. Uchaguzi huu unadumisha hali yao halisi ya kijamii, huku tanbihi ikieleza maana ya nahau nzima.
- issue: Nguvu ya הוּא katika sentensi
  choice: ndiye
  alternative: yeye
  rationale: 'Kiwakilishi huru kina mkazo: Yahwe ndiye aliyefanya mambo hayo. ''Ndiye'' huonyesha mkazo huo kwa kawaida katika Kiswahili.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo umegawanywa katika sentensi mbili ili kuepuka sentensi ndefu isiyo ya kawaida, bila kuvunja mwendelezo wa hoja. Alama za tanbihi zimewekwa baada ya vifungu vinavyoelezwa.
