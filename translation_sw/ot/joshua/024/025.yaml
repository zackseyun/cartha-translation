  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּכְרֹ֨ת יְהוֹשֻׁ֧עַ בְּרִ֛ית לָ/עָ֖ם בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יָּ֥שֶׂם ל֛/וֹ חֹ֥ק וּ/מִשְׁפָּ֖ט בִּ/שְׁכֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/025.yaml
  text: So Joshua made a covenant with the people on that day[b][a], and there in Shechem he set for them a statute and an ordinance.
translation:
  language: sw
  text: Basi Yoshua akafanya agano[a] na watu siku hiyo, na huko Shekemu akawawekea sheria na hukumu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, Kiebrania kinasema, “alikata agano.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akawawekea amri na uamuzi wa kisheria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: akafanya
  rationale: Kitenzi hiki maana yake halisi ni ‘alikata,’ lakini katika msemo כרת ברית humaanisha kufanya au kufunga agano. ‘Akafanya agano’ ni Kiswahili cha kawaida na wazi bila kupoteza maana ya tendo lenye nguvu ya kisheria.
- source_word: בְּרִית
  choice: agano
  rationale: ‘Agano’ huhifadhi maana ya makubaliano rasmi yenye wajibu wa kudumu na uzito wa kimahusiano na kitheolojia.
- source_word: לָעָם
  choice: na watu
  rationale: Ingawa kihusishi cha Kiebrania kwa kawaida ni ‘kwa,’ katika msemo huu watu wanahusika kama washiriki wa agano; ‘na watu’ ni Kiswahili cha asili.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha wakati.
- source_word: וַיָּשֶׂם
  choice: akawawekea
  rationale: Kitenzi שׂים kina maana pana ya kuweka. Hapa kinahusu kuwawekea watu masharti yenye nguvu ya kisheria.
- source_word: לוֹ
  choice: -wa-
  rationale: Kiwakilishi cha Kiebrania ni cha umoja kwa sababu עָם (‘watu’) ni nomino ya mkusanyiko; Kiswahili hutumia upatanisho wa wingi kwa watu.
- source_word: חֹק
  choice: sheria
  rationale: Neno hili humaanisha jambo lililowekwa au kuamriwa. ‘Sheria’ linaeleweka kwa urahisi na linahifadhi uzito wake wa kisheria.
- source_word: וּמִשְׁפָּט
  choice: na hukumu
  rationale: Katika muktadha huu neno linaweza kumaanisha hukumu, uamuzi, au kanuni ya kisheria. ‘Hukumu’ huhifadhi neno la msingi bila kulifanya kuwa dhana ya jumla ya haki.
- source_word: בִּשְׁכֶם
  choice: huko Shekemu
  rationale: ‘Huko’ huunganisha tendo hili na mahali pa tukio katika simulizi, huku ‘Shekemu’ ikihifadhi jina la mahali.
theological_decisions:
- issue: Asili ya tendo la Yoshua la kufanya agano
  choice: Yoshua akafanya agano na watu
  alternative: Yoshua akafanya agano kwa ajili ya watu; Yoshua akafanya upya agano kwa niaba ya watu
  rationale: Mstari unamtaja Yoshua kama mtendaji na watu kama wanaohusika katika agano, lakini hautaji wazi katika mstari huu upande mwingine wa agano wala kusema moja kwa moja kwamba agano lilifanywa upya. Tafsiri inahifadhi namna maandishi yalivyo bila kuingiza ufafanuzi wa kitheolojia kutoka muktadha mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo ‘akafanya agano’ umechaguliwa kwa uwazi; ‘sheria na hukumu’ huhifadhi jozi ya maneno ya kisheria ya Kiebrania na kiwango fulani cha upana wake wa maana.
