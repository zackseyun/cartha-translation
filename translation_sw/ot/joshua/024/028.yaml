lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: akawaacha ... waende
  rationale: Katika kauli ya piel hapa, kitenzi kinaonyesha kwamba Yoshua alihitimisha mkutano na kuwaruhusu watu waondoke. Usemi huu ni wa kawaida katika Kiswahili na unaonyesha kuondoka kwao bila kudokeza kwamba aliwafukuza.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Jina limetolewa kwa umbo lililozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: הָעָם
  choice: watu
  rationale: Neno hili linarejelea kwa ujumla Waisraeli waliokuwa wamekusanyika; “watu” ni la kawaida na haliongezi maana ya taifa ambayo haijalazimishwa na muktadha.
- source_word: אִישׁ
  choice: kila mtu
  rationale: Umoja wa kiume umetumiwa kwa maana ya kugawa mmoja mmoja. “Kila mtu” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuufanya mstari uonekane kuwa unawahusu wanaume pekee.
- source_word: לְנַחֲלָתוֹ
  choice: kwenye urithi wake
  rationale: Katika Yoshua, נַחֲלָה kwa kawaida ni sehemu ya ardhi iliyogawiwa kwa urithi. “Urithi wake” huhifadhi wazo la ardhi ya urithi, huku “kwenye” ikionyesha kurudi mahali hapo kwa Kiswahili cha kawaida.
