  text: וְ/עַתָּ֞ה יְר֧אוּ אֶת יְהוָ֛ה וְ/עִבְד֥וּ אֹת֖/וֹ בְּ/תָמִ֣ים וּ/בֶֽ/אֱמֶ֑ת וְ/הָסִ֣ירוּ אֶת אֱלֹהִ֗ים אֲשֶׁר֩ עָבְד֨וּ אֲבוֹתֵי/כֶ֜ם בְּ/עֵ֤בֶר הַ/נָּהָר֙ וּ/בְ/מִצְרַ֔יִם וְ/עִבְד֖וּ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/014.yaml
  text: Now fear Yahweh and serve him with integrity and faithfulness[a], and put away the gods that your fathers served beyond the River and in Egypt[b], and serve Yahweh.
translation:
  language: sw
  text: Sasa basi, mcheni Yahwe, na mtumikieni kwa unyofu na uaminifu[a]. Ondoeni miungu ambayo baba zenu waliitumikia ng’ambo ya Mto[b] na nchini Misri, na mtumikieni Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ukamilifu wa moyo na kwa kweli.” Maneno ya Kiebrania yanaweza kueleza ukamilifu, unyofu, ukweli, na kutegemeka.
    reason: lexical_alternative
  - marker: b
    text: Yaani, ng’ambo ya Mto Frati.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sasa basi
  rationale: Ni kiashiria cha hitimisho na mwito unaotokana na simulizi lililotangulia; “Sasa basi” ni Kiswahili cha kawaida na huonyesha uhusiano huo.
- source_word: יְרָאוּ אֶת־יְהוָה
  choice: mcheni Yahwe
  rationale: “Mcheni” huhifadhi uzito wa kitenzi cha Kiebrania cha kumwogopa Mungu, huku muktadha ukijumuisha heshima na utiifu wa agano. Jina la agano limetolewa kama “Yahwe.”
- source_word: וְעִבְדוּ אֹתוֹ
  choice: na kumtumikia
  rationale: Kitenzi kina maana pana ya huduma, utiifu, na ibada; “kumtumikia” huihifadhi vizuri kuliko kukipunguza kuwa ibada pekee.
- source_word: בְּתָמִים וּבֶאֱמֶת
  choice: kwa unyofu na uaminifu
  rationale: “Unyofu” huwasilisha ukamilifu wa nia na kutokuwa na hila, bila kudai kutokuwa na dhambi; “uaminifu” huwasilisha ukweli, uthabiti, na kutegemeka kwa אֱמֶת katika muktadha wa agano.
- source_word: וְהָסִירוּ אֶת־אֱלֹהִים
  choice: Iondoeni miungu
  rationale: Amri inataka waiondoe miungu pinzani kabisa; hakuna kivumishi cha “kigeni” katika Kiebrania, kwa hiyo hakijaongezwa.
- source_word: אֲבוֹתֵיכֶם
  choice: baba zenu
  rationale: Hufuata umbo la kiume la neno la Kiebrania na kurejelea mababu wa kiume waliotangulia.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: ng’ambo ya Mto
  rationale: Huhifadhi usemi wa kijiografia wa Kiebrania; utambulisho wa Mto kuwa Frati unaelezwa katika tanbihi.
- source_word: וּבְמִצְרַיִם
  choice: na nchini Misri
  rationale: Ni tafsiri ya kawaida ya kishazi cha mahali na inasomeka kwa ufasaha katika Kiswahili.
- source_word: וְעִבְדוּ אֶת־יְהוָה
  choice: nanyi mtumikieni Yahwe
  rationale: Huhifadhi kurudiwa kwa amri ya kumtumikia Yahwe na msisitizo wake; “nanyi” huunganisha na pia kuonyesha tofauti iliyomo katika muktadha bila kubadili kiunganishi kuwa “lakini.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la agano יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini inatumia Tetragramatoni moja kwa moja; “Yahwe” huhifadhi jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Iwapo kupunguza maana ya ירא kuwa heshima tu
  choice: mcheni Yahwe
  alternative: mheshimuni Yahwe
  rationale: “Mcheni” hudumisha mvutano wa kitheolojia wa hofu ya Mungu katika Kiebrania; muktadha huonyesha kwamba hofu hiyo inahusisha heshima, uaminifu, na utiifu.
- issue: Maana ya בְּתָמִים וּבֶאֱמֶת
  choice: kwa unyofu na uaminifu
  alternative: kwa moyo wote na kwa kweli
  rationale: Chaguo hili huonyesha ibada isiyogawanyika, ya kweli, na ya kutegemeka bila kudai ukamilifu usio na dhambi. Tanbihi huhifadhi upana wa maana unaowezekana.
- issue: Jinsi ya kutafsiri אֲבוֹתֵיכֶם
  choice: baba zenu
  alternative: mababu zenu
  rationale: “Baba zenu” hufuata kwa karibu neno la kifamilia la kiume katika chanzo; katika muktadha linawahusu waliowatangulia katika ukoo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Marudio ya “mtumikieni Yahwe” yamehifadhiwa kwa ajili ya msisitizo wa matini.
