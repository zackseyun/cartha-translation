base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/033.yaml
  text: And Eleazar the son of Aaron died, and they buried him at Gibeath-phinehas, his son’s hill country, which had been given to him in the hill country of Ephraim.
translation:
  language: sw
  text: Eleazari mwana wa Aroni akafa, nao wakamzika katika Gibea ya Finehasi[a], mwanawe, ambako alipewa[b] katika nchi ya vilima ya Efraimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kilima cha Finehasi.”
    reason: Neno גִבְעַת linaweza kueleweka kama sehemu ya jina la mahali au kama nomino ya kawaida, ‘kilima.’
  - marker: b
    text: Kiebrania hakisemi wazi kama mahali hapo alipewa Eleazari au Finehasi.
    reason: Kiwakilishi לוֹ kinaweza kumrejelea Eleazari au Finehasi katika muktadha huu.
lexical_decisions:
- source_word: גִבְעַת פִּינְחָס
  choice: Gibea ya Finehasi
  rationale: Muundo huo unaweza kuwa jina la mahali au kumaanisha ‘kilima cha Finehasi.’ Matini kuu inalichukulia kama jina la mahali, huku tanbihi ikihifadhi maana nyingine inayowezekana.
- source_word: הַר אֶפְרָיִם
  choice: nchi ya vilima ya Efraimu
  rationale: Hapa הַר hurejelea eneo la milima au vilima, si mlima mmoja tu; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha Afrika Mashariki.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: nao wakamzika
  rationale: Huwasilisha kwa kawaida mfuatano wa simulizi wa Kiebrania na kiwakilishi kinachomrejelea Eleazari.
theological_decisions:
- issue: Mhusika anayerejelewa na kiwakilishi לו (‘kwake’)
  choice: Kudumisha kiwakilishi kisichoainisha wazi mhusika katika matini kuu, pamoja na tanbihi ya ufafanuzi
  alternative: ‘mahali Finehasi mwanawe alipokuwa amepewa’ au ‘mahali Eleazari alipokuwa amepewa’
  rationale: Kiebrania hakisemi wazi kama mahali hapo alikuwa amepewa Eleazari au Finehasi; tafsiri haipaswi kuondoa utata huo kimya-kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa heshima na unaosomeka kwa urahisi. ‘Eleazari,’ ‘Aroni,’ ‘Finehasi,’ na ‘Efraimu’ ni maumbo ya majina yaliyozoeleka katika Biblia za Kiswahili.
