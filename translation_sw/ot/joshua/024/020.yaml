base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/020.yaml
  text: If you forsake Yahweh and serve foreign gods[a], then he will turn and do you harm and consume you[b], after he has done good to you.
translation:
  language: sw
  text: Mkimwacha Yahwe na kuitumikia miungu ya kigeni, atageuka na kuwaletea maafa[a] na kuwaangamiza[b], baada ya kuwatendea mema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwadhuru.” Kitenzi cha Kiebrania kinaweza kumaanisha kusababisha madhara au maafa, si kutenda uovu wa kimaadili.
    reason: lexical_alternative
  - marker: b
    text: Au “kuwateketeza kabisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Mki-
  rationale: Katika muktadha huu neno hili linaanzisha hali ya sharti; kiambishi cha Kiswahili “mki-” kinaonyesha kwa kawaida maana ya “ikiwa ninyi”.
- source_word: תַעַזְבוּ אֶת־יְהוָה
  choice: mkimwacha Yahwe
  rationale: Kitenzi עזב hapa kinaonyesha kumwacha Mungu kwa kuvunja uaminifu wa agano. “Kumwacha” ni lugha ya sasa na ya kawaida, huku “Yahwe” ikihifadhi jina la Mungu.
- source_word: וַעֲבַדְתֶּם
  choice: na kuitumikia
  rationale: עבד linapotumiwa kuhusu miungu humaanisha kuitumikia kwa utii wa kidini na ibada; “kuitumikia” huhifadhi wazo hilo moja kwa moja.
- source_word: אֱלֹהֵי נֵכָר
  choice: miungu ya kigeni
  rationale: Kirai hiki kinataja miungu iliyo migeni kwa Israeli na kinyume cha uaminifu kwa Yahwe; “miungu ya kigeni” ni usemi wa kawaida na wazi.
- source_word: וְשָׁב
  choice: atageuka
  rationale: שׁוב hapa huonyesha kubadilika kwa mwelekeo wa matendo ya Yahwe kwa watu; “atageuka” huhifadhi sitiari hiyo bila kufafanua kupita kiasi.
- source_word: וְהֵרַע לָכֶם
  choice: na kuwaletea maafa
  rationale: Katika kausativi, רעה hapa ni kusababisha madhara au maafa, si kutenda uovu wa kimaadili. “Kuwaletea maafa” huonyesha hukumu hiyo wazi.
- source_word: וְכִלָּה אֶתְכֶם
  choice: na kuwaangamiza
  rationale: כלה huonyesha kufikisha mwisho au kuharibu kabisa. “Kuwaangamiza” ni ya asili katika Kiswahili na huhifadhi uzito wa onyo.
- source_word: אַחֲרֵי אֲשֶׁר הֵיטִיב לָכֶם
  choice: baada ya kuwatendea mema
  rationale: היטיב humaanisha kutenda mema au kunufaisha; tafsiri hii ni ya kawaida na inadumisha tofauti kali kati ya wema wa awali na hukumu inayofuata.
theological_decisions:
- issue: Hukumu ya Mungu baada ya kuwatendea watu mema
  choice: Yahwe anaonyeshwa akibadili mwelekeo wa matendo yake na kuleta hukumu ikiwa Israeli itamwacha.
  alternative: Kueleza maafa kuwa matokeo ya kawaida tu ya ibada ya sanamu, bila kutaja tendo la moja kwa moja la Yahwe.
  rationale: Vitenzi vya Kiebrania vinamhusisha Yahwe moja kwa moja na kuleta maafa na kuangamiza kama jibu la kihukumu kwa kuvunja agano. Tafsiri inadumisha mvutano huo wa kiteolojia bila kuupunguza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sharti umeonyeshwa kwa “mki-”; lugha kali ya hukumu na tendo la moja kwa moja la Yahwe vimehifadhiwa.
