  text: Then I sent Moses and Aaron[a], and I struck Egypt as I did in its midst[b], and afterward I brought you out.
translation:
  language: sw
  text: Kisha nikawatuma Musa na Haruni, nikaipiga[a] Misri kwa kadiri ya yale niliyoyafanya katikati yake[b], na baadaye nikawatoa ninyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nikaatesa Misri”; kitenzi cha Kiebrania kinaweza kumaanisha “kupiga” au “kutesa.” Katika muktadha huu kinarejelea mapigo ya Mungu dhidi ya Misri.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “kama/kulingana na yale niliyoyafanya katikati yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: nikawatuma
  rationale: Kitenzi שׁלח katika Qal humaanisha ‘kutuma.’ Kiambishi cha ngeli ya watu kinaonyesha kuwa Musa na Haruni ndio waliotumwa.
- source_word: מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Musa na Haruni
  rationale: Haya ndiyo maumbo ya kawaida ya majina haya katika Biblia za Kiswahili na matumizi ya Kiswahili sanifu.
- source_word: וָאֶגֹּף
  choice: nikaipiga
  rationale: נגף inaweza kumaanisha kupiga au kutesa. ‘Nikaipiga’ inadumisha usemi wa moja kwa moja wa Kiebrania bila kuufanya wazi zaidi kuwa ‘mapigo’ ingawa muktadha unayahusu.
- source_word: מִצְרַיִם
  choice: Misri
  rationale: Jina hili linaweza kurejelea nchi au watu wake; ‘Misri’ ni tafsiri ya kawaida, na hapa inachukuliwa kama kitu kimoja kwa mujibu wa kiwakilishi cha umoja katika sentensi inayofuata.
- source_word: כַאֲשֶׁר עָשִׂיתִי בְּקִרְבּוֹ
  choice: kama nilivyofanya katikati yake
  rationale: Tafsiri hii inafuata kwa karibu muundo uliofupishwa wa Kiebrania na kuhifadhi kiwakilishi cha umoja kinachorejelea Misri, bila kufafanua kimyakimya matendo hayo kuwa mapigo.
- source_word: וְאַחַר
  choice: na baadaye
  rationale: אַחַר imetumiwa hapa kwa maana ya wakati na inaonyesha mfuatano wa matukio.
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: nikawatoa ninyi
  rationale: Hiphil ya יצא humaanisha ‘kutoa’ au ‘kusababisha watoke.’ ‘Ninyi’ imetajwa wazi ili kudumisha mkazo na hotuba ya moja kwa moja kwa Israeli kwa umoja wa agano.
theological_decisions:
- issue: Wanaorejelewa na kiwakilishi cha nafsi ya pili wingi אֶתְכֶם
  choice: ‘nikawatoa ninyi,’ ikihutubia Israeli kwa pamoja katika mshikamano na kizazi cha mababu kilichotoka Misri
  alternative: ‘nikawatoa baba zenu,’ jambo ambalo lingeweka rejeo kwa mababu wa wasikilizaji pekee
  rationale: Kiebrania kinasema moja kwa moja ‘niliwatoa ninyi.’ Tafsiri inadumisha nguvu ya hotuba ya agano na mvutano wake badala ya kuibadili kuwa maelezo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mfuatano wa vitenzi ‘nikawatuma … nikaipiga … nikawatoa’ unaendeleza simulizi la nafsi ya kwanza na mpangilio wa matukio. ‘Ninyi’ imedumishwa kwa uwazi ili kutopoteza usemi wa pamoja wa Kiebrania.
