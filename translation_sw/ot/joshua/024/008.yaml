  text: ו/אבא/ה אֶתְ/כֶ֗ם אֶל אֶ֤רֶץ הָ/אֱמֹרִי֙ הַ/יּוֹשֵׁב֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּֽלָּחֲמ֖וּ אִתְּ/כֶ֑ם וָ/אֶתֵּ֨ן אוֹתָ֤/ם בְּ/יֶדְ/כֶם֙ וַ/תִּֽירְשׁ֣וּ אֶת אַרְצָ֔/ם וָ/אַשְׁמִידֵ֖/ם מִ/פְּנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/008.yaml
  text: Then I brought you into the land of the Amorites[a], who lived beyond the Jordan, and they fought with you. And I gave them into your hand, and you took possession of their land, and I destroyed them from before you.
translation:
  language: sw
  text: Kisha nikawaleta katika nchi ya Waamori waliokuwa wakiishi ng’ambo ya Yordani, nao wakapigana nanyi.[a] Nikawatia mikononi mwenu, nanyi mkaimiliki nchi yao; nami nikawaangamiza mbele yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakapigana dhidi yenu.” Kauli ya Kiebrania inasema kwa karibu zaidi “wakapigana nanyi,” lakini muktadha unaonyesha kwamba walikuwa maadui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲבִיאָה אֶתְכֶם
  choice: Kisha nikawaleta
  rationale: Kitenzi cha Kiebrania kiko katika Hiphil na kina maana ya kusababisha kuja, yaani ‘kuleta.’ ‘Kisha’ kinaonyesha mfuatano wa simulizi unaobebwa na waw.
- source_word: אֶל אֶרֶץ הָאֱמֹרִי
  choice: katika nchi ya Waamori
  rationale: אֶל pamoja na kitenzi ‘kuleta’ huonyesha kuingia katika eneo. Jina la umoja la jumla הָאֱמֹרִי limetafsiriwa kwa jina la watu, ‘Waamori.’
- source_word: הַיּוֹשֵׁב בְּעֵבֶר הַיַּרְדֵּן
  choice: waliokuwa wakiishi ng’ambo ya Yordani
  rationale: Kishirikishi cha ישב kinawaeleza Waamori kuwa wakazi wa eneo hilo. ‘Ng’ambo ya Yordani’ huhifadhi mtazamo wa kijiografia bila kuongeza ‘mashariki’ au ‘magharibi.’
- source_word: וַיִּלָּחֲמוּ אִתְּכֶם
  choice: nao wakapigana nanyi
  rationale: לחם pamoja na אִתְּ inaweza kueleza kuingia vitani na mtu, na katika muktadha huu ni mapambano ya uadui. ‘Wakapigana nanyi’ ni Kiswahili cha kawaida na kinabaki karibu na muundo wa chanzo.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: Nikawatia mikononi mwenu
  rationale: Hii huhifadhi nahau ya Kiebrania נתן ביד, yenye maana ya kuwatia adui chini ya mamlaka au uwezo wa upande mwingine. Wingi ‘mikononi’ ni wa kawaida katika Kiswahili.
- source_word: וַתִּירְשׁוּ אֶת אַרְצָם
  choice: nanyi mkaimiliki nchi yao
  rationale: ירש hapa hueleza kuipata na kuikalia nchi baada ya ushindi. ‘Mkaimiliki’ huonyesha matokeo hayo bila kulazimisha maana ya urithi.
- source_word: וָאַשְׁמִידֵם מִפְּנֵיכֶם
  choice: nami nikawaangamiza mbele yenu
  rationale: שׁמד ni neno lenye nguvu la kuangamiza. ‘Mbele yenu’ huhifadhi kwa ufupi nahau מִפְּנֵיכֶם na wazo la kuondolewa kwao kutoka mbele ya Israeli.
theological_decisions:
- issue: Lugha ya ushindi na uangamizi katika simulizi la kutwaa nchi
  choice: 'Kauli ya Mungu na vitenzi vyenye nguvu zimehifadhiwa: ‘Nikawatia mikononi mwenu ... mkaimiliki ... nikawaangamiza.’'
  alternative: Kutumia maneno mepesi kama ‘nikawashinda’ au ‘nikawaondoa.’
  rationale: Chanzo kinamtaja Mungu moja kwa moja kama mtendaji na kinatumia lugha wazi ya vita, kumiliki nchi, na kuangamiza. Tafsiri haipaswi kupunguza wala kupanua uzito huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa maandiko. ‘Ng’ambo ya Yordani’ huhifadhi kutobainishwa kwa upande wa mto, na nahau ‘mikononi mwenu’ inaeleweka katika matumizi ya kawaida.
