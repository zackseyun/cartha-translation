  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וָ֠/אֶקַּח אֶת אֲבִי/כֶ֤ם אֶת אַבְרָהָם֙ מֵ/עֵ֣בֶר הַ/נָּהָ֔ר וָ/אוֹלֵ֥ךְ אוֹת֖/וֹ בְּ/כָל אֶ֣רֶץ כְּנָ֑עַן ו/ארב אֶת זַרְע֔/וֹ וָֽ/אֶתֶּן ל֖/וֹ אֶת יִצְחָֽק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/003.yaml
  text: Then I took your father Abraham from beyond the River[a], and I led him through all the land of Canaan[b], and I multiplied his offspring and gave him Isaac.
translation:
  language: sw
  text: Kisha nikamchukua baba yenu Abrahamu kutoka ng’ambo ya Mto[a], nikamwongoza katika nchi yote ya Kanaani, nikauzidisha uzao wake[b], na nikampa Isaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda “Mto” hapa unamaanisha Mto Frati.
    reason: cultural_note
  - marker: b
    text: Au “wazao wake”; neno la Kiebrania linalomaanisha “uzao” liko katika umoja lakini linaweza kutaja wazao kwa pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Kisha nikamchukua
  rationale: Kitenzi cha Qal katika mfuatano wa masimulizi kinaeleza tendo la Mungu lililofuata. “Kisha” na umbo la mfululizo “nikam-” vinaonyesha mfuatano kwa Kiswahili cha kawaida.
- source_word: אֲבִיכֶם
  choice: baba yenu
  rationale: Neno la Kiebrania ni “baba yenu.” Ingawa Abrahamu ni babu wa mbali wa taifa, usemi huu unahifadhi lugha ya kifamilia na ya agano ya chanzo.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: kutoka ng’ambo ya Mto
  rationale: Usemi huu unaonyesha upande wa pili wa mto kwa kuzingatia mahali pa msemaji. “Mto” limehifadhiwa kama jina la kijiografia lenye kiarifu, bila kuingiza jina “Frati” katika matini kuu.
- source_word: וָאוֹלֵךְ אֹתוֹ
  choice: nikamwongoza
  rationale: Hiphil ya הלך ina maana ya kusababisha mtu aende. “Nikamwongoza” ni ya asili katika Kiswahili na inahifadhi maana ya uongozi wa Mungu.
- source_word: בְּכָל אֶרֶץ כְּנָעַן
  choice: katika nchi yote ya Kanaani
  rationale: Kirai hiki kinaonyesha mwendo wa Abrahamu katika eneo lote la Kanaani. Tafsiri hii ni wazi na ya kawaida bila kuzidisha maana ya kihusishi.
- source_word: וָאַרְבֶּה אֶת זַרְעוֹ
  choice: nikauzidisha uzao wake
  rationale: Hiphil ya רבה inaonyesha kufanya uwe mwingi au kuongezeka. “Uzao” huhifadhi maana ya pamoja ya זֶרַע, na “kuuzidisha” huonyesha Mungu kama mtendaji.
- source_word: וָאֶתֶּן לוֹ אֶת יִצְחָק
  choice: na nikampa Isaka
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba Isaka alitolewa na Mungu kuwa zawadi kwa Abrahamu.
theological_decisions:
- issue: Jinsi Abrahamu anavyotajwa kama mzazi wa Israeli
  choice: baba yenu Abrahamu
  alternative: babu yenu Abrahamu; babu yenu wa kale Abrahamu
  rationale: Chanzo kinasema kihalisi “baba yenu.” Kuhifadhi usemi huo kunadumisha msisitizo wa kifamilia na wa agano bila kuubadili kuwa maelezo ya jumla kuhusu ukoo.
- issue: Utambulisho wa “Mto”
  choice: Mto
  alternative: Mto Frati
  rationale: Matini ya Kiebrania inatumia nomino yenye kiarifu, “Mto,” si jina maalumu “Frati.” Utambulisho unaokubalika zaidi umewekwa katika tanbihi badala ya kuongezwa katika matini kuu.
- issue: Maana ya זַרְעוֹ
  choice: uzao wake
  alternative: wazao wake
  rationale: “Uzao” unahifadhi umoja wa kimkusanyiko wa neno la Kiebrania na kubaki wazi kuhusu kundi la wazao, bila kulifanya neno hilo kuwa wingi wa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi ya heshima na unaoeleweka kwa wasomaji wa kawaida. Maumbo ya mfululizo “nika-” yanaonyesha mfuatano wa matendo ya Mungu; majina “Abrahamu,” “Kanaani,” na “Isaka” yanafuata matumizi yaliyozoeleka katika Biblia za Kiswahili.
