base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/024.yaml
  text: And the people said to Joshua[a], “We will serve Yahweh our God[b], and we will obey his voice.”
translation:
  language: sw
  text: Nao watu wakamwambia Yoshua, “Tutamtumikia[a] Yahweh Mungu wetu, na tutatii sauti yake[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tutamwabudu.” Kitenzi cha Kiebrania kinaweza kumaanisha kumtolea Mungu utumishi wa ibada, lakini “kumtumikia” hapa huhifadhi maana pana zaidi ya uaminifu wa agano.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “tutaisikiliza sauti yake”; hii ni nahau inayomaanisha kuitikia kwa utiifu yale anayosema.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָעָם אֶל יְהוֹשֻׁעַ
  choice: Nao watu wakamwambia Yoshua
  rationale: Muundo wa usimulizi wenye וַיֹּאמְרוּ unaendelezwa kwa ‘Nao ... wakamwambia’; הָעָם ni jumuiya ya agano iliyokusanyika, kwa hiyo ‘watu’ ni ya kawaida na sahihi.
- source_word: אֶת יְהוָה אֱלֹהֵינוּ
  choice: Yahweh Mungu wetu
  rationale: Jina la agano יְהוָה limetoholewa kuwa ‘Yahweh’, na אֱלֹהֵינוּ limefasiriwa moja kwa moja kuwa ‘Mungu wetu’.
- source_word: נַעֲבֹד
  choice: Tutamtumikia
  rationale: Kitenzi עבד hapa kinaonyesha utumishi wa uaminifu kwa Mungu unaojumuisha ibada, lakini maana yake katika agano ni pana kuliko tendo la kuabudu pekee.
- source_word: וּבְקוֹלוֹ נִשְׁמָע
  choice: na tutaitii sauti yake
  rationale: Kishazi hiki humaanisha kwa msingi ‘kusikiliza sauti yake’, lakini katika muktadha huu שמׁע lina nguvu ya kuitikia kwa utiifu. ‘Tutaitii sauti yake’ huhifadhi neno ‘sauti’ pamoja na maana ya utii.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la agano, YHWH. ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya kidini ya עבד katika muktadha wa agano
  choice: tutamtumikia
  alternative: tutamwabudu
  rationale: Ahadi hii inahusu uaminifu wa agano na matendo ya utiifu, si ibada ya kidini pekee; ‘kutumikia’ huhifadhi upana huo.
- issue: Nahau ya kusikia sauti katika וּבְקוֹלוֹ נִשְׁמָע
  choice: tutaitii sauti yake
  alternative: tutaisikiliza sauti yake
  rationale: Maana inayolengwa ni kusikia kunakozaa utii. Tafsiri kuu inaweka wazi utii huku ikihifadhi taswira ya ‘sauti’; tafsiri halisi zaidi imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa urahisi. ‘Nao ... wakamwambia’ hudumisha mwendelezo wa usimulizi; ‘Yahweh’ hutumiwa kama jina maalumu.
