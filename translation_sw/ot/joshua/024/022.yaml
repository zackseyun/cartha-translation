source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל הָ/עָ֗ם עֵדִ֤ים אַתֶּם֙ בָּ/כֶ֔ם כִּֽי אַתֶּ֞ם בְּחַרְתֶּ֥ם לָ/כֶ֛ם אֶת יְהוָ֖ה לַ/עֲבֹ֣ד אוֹת֑/וֹ וַ/יֹּאמְר֖וּ עֵדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/022.yaml
  text: Then Joshua said to the people[a], “You are witnesses against yourselves that you have chosen Yahweh for yourselves, to serve him.” And they said, “We are witnesses.”
translation:
  language: sw
  text: Kisha Yoshua akawaambia watu, “Ninyi ni mashahidi dhidi yenu wenyewe[a] kwamba mmejichagulia Yahweh ili kumtumikia.” Nao wakasema, “Sisi ni mashahidi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mashahidi juu yenu wenyewe,” yaani, maneno yenu wenyewe yanashuhudia uchaguzi wenu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akawaambia
  rationale: Waw-consecutive inaendeleza simulizi; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, na kitenzi chenye kiambishi cha yambwa kinafaa kwa usemi unaoelekezwa kwa watu.
- source_word: הָעָם
  choice: watu
  rationale: Katika muktadha huu עָם ni kusanyiko la watu wa Israeli; “watu” ni tafsiri ya kawaida na ya asili.
- source_word: עֵדִים אַתֶּם בָּכֶם
  choice: Ninyi ni mashahidi dhidi yenu wenyewe
  rationale: Muundo wenye בָּכֶם una nguvu ya kisheria ya ushuhuda wao wenyewe kuwawajibisha; “dhidi yenu wenyewe” huhifadhi maana hiyo huku tanbihi ikitaja uwezekano mwingine.
- source_word: כִּי
  choice: kwamba
  rationale: כִּי hapa inatanguliza yaliyomo katika ushuhuda wao, si sababu tu.
- source_word: בְּחַרְתֶּם לָכֶם
  choice: mmejichagulia
  rationale: Kitenzi cha kujirejelea pamoja na -chagulia kinahifadhi msisitizo kwamba uchaguzi huo ni wao wenyewe na wameufanya kwa upande wao.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa moja kwa moja katika Kiebrania; linatoholewa kama “Yahweh” badala ya kubadilishwa kuwa cheo.
- source_word: לַעֲבֹד אֹתוֹ
  choice: ili kumtumikia
  rationale: עבד inahusu huduma na utii wa agano, unaoweza kujumuisha ibada; “kumtumikia” huhifadhi upana huo.
- source_word: וַיֹּאמְרוּ עֵדִים
  choice: Nao wakasema, “Sisi ni mashahidi.”
  rationale: Jibu la Kiebrania limefupishwa; kuongeza “Sisi ni” hufanya sentensi iwe ya kawaida kwa Kiswahili bila kuongeza maana mpya.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: Yehova au BWANA
  rationale: Andiko la Kiebrania linatumia Tetragramatoni kama jina binafsi; “Yahweh” hulihifadhi kama jina badala ya kuliweka cheo.
- issue: Nguvu ya ushuhuda wa watu juu yao wenyewe
  choice: mashahidi dhidi yenu wenyewe
  alternative: mashahidi kwenu wenyewe
  rationale: Muktadha wa agano na wa kisheria unaonyesha kuwa maneno yao wenyewe yatawawajibisha, lakini uwezekano wa maana ya “kwenu wenyewe” umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mmejichagulia” ni cha kawaida na huhifadhi msisitizo wa Kiebrania wa uchaguzi wao wenyewe; “kumtumikia” huepuka kuifanya עבד iwe ibada pekee.
