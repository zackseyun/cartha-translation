  text: וְ/לֹ֥א אָבִ֖יתִי לִ/שְׁמֹ֣עַ לְ/בִלְעָ֑ם וַ/יְבָ֤רֶךְ בָּרוֹךְ֙ אֶתְ/כֶ֔ם וָ/אַצִּ֥ל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/010.yaml
  text: But I was not willing to listen to Balaam[a], and he indeed blessed you; so I delivered you from his hand.
translation:
  language: sw
  text: Lakini sikutaka kumsikiliza Balaamu, naye akawabariki kwa hakika[a]; hivyo nikawaokoa kutoka mkononi mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kiebrania kwa karibu zaidi, “akawabariki kwa baraka.” Kiebrania hutumia kitenzi pamoja na kitenzi-jina cha mzizi uleule ili kukazia tendo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיתִי
  choice: sikutaka
  rationale: Kitenzi hiki huonyesha kutaka au kukubali, si uwezo tu; “sikutaka” kinahifadhi maana ya hiari katika usemi wa Mungu.
- source_word: לִשְׁמֹעַ לְבִלְעָם
  choice: kumsikiliza Balaamu
  rationale: שׁמע pamoja na ל mara nyingi humaanisha kumsikiliza au kumtii mtu. “Kumsikiliza” ni ya kawaida na haiongezi tafsiri zaidi ya lazima.
- source_word: וַיְבָרֶךְ בָּרוֹךְ
  choice: naye akawabariki kwa hakika
  rationale: Kitenzi pamoja na kitenzi-jina cha mzizi uleule hukazia tendo. “Kwa hakika” huonyesha mkazo huo bila kudai kwamba tendo lilirudiwa mara nyingi.
- source_word: אֶתְכֶם
  choice: akawabariki
  rationale: Kiambishi -wa- kinaonyesha yambwa nafsi ya pili wingi kwa njia ya kawaida katika Kiswahili.
- source_word: וָאַצִּל
  choice: nikawaokoa
  rationale: נצל humaanisha kuokoa au kukomboa kutoka hatarini au mamlakani; “kuwaokoa” ni Kiswahili cha kawaida na chenye hadhi katika simulizi hili.
- source_word: מִיָּדוֹ
  choice: kutoka mkononi mwake
  rationale: Huhifadhi sitiari ya Kiebrania ya mkono kama mamlaka au udhibiti, nayo inaeleweka katika Kiswahili.
theological_decisions:
- issue: Mtendaji wa tendo la kuwabariki
  choice: Balaamu ndiye anayewabariki, kama inavyoonyeshwa na “naye.”
  alternative: 'Mungu ndiye mtendaji asiyeelezwa wazi: “nami nikawabariki.”'
  rationale: Kitenzi cha Kiebrania kiko katika nafsi ya tatu umoja wa kiume, na Balaamu ndiye rejeo la karibu zaidi. Muktadha unaonyesha kwamba Mungu alizuia kusudi lake la kulaani, bila kubadili mtendaji wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “kutoka mkononi mwake” umehifadhiwa kwa kuwa sitiari hiyo inaeleweka; “kwa hakika” hutoa mkazo bila kuingiza wazo lisilo lazima la kurudiwa-rudiwa.
