base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/016.yaml
  text: Then the people answered and said[a], “Far be it from us to forsake Yahweh and serve other gods.”
translation:
  language: sw
  text: Ndipo watu wakajibu na kusema[a], “Hasha! Kamwe hatutamwacha Yahwe ili kuitumikia miungu mingine.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu aepushe mbali sisi kumwacha Yahwe ili kuitumikia miungu mingine.” Nahau ya Kiebrania inaonyesha kukataa kwa nguvu sana, ingawa haimtaji Mungu waziwazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: wakajibu
  rationale: Katika muktadha wa mazungumzo, kitenzi ענה kina maana ya kujibu; umbo la masimulizi limewasilishwa kwa ‘waka-’.
- source_word: הָעָם
  choice: watu
  rationale: עם hapa ni jumuiya ya agano iliyokusanyika; ‘watu’ ndilo neno la kawaida na la asili katika Kiswahili.
- source_word: וַיֹּאמֶר
  choice: na kusema
  rationale: אמר ni kitenzi cha kawaida cha kusema. Muundo ‘wakajibu na kusema’ unadumisha vitenzi vyote vya Kiebrania bila kufanya Kiswahili kuwa kizito mno.
- source_word: חָלִילָה לָּנוּ
  choice: La hasha! Kamwe hatutamwacha
  rationale: Nahau hii inakataa jambo kwa msisitizo mkubwa. ‘La hasha!’ pamoja na ‘kamwe’ huonyesha nguvu hiyo bila kuongeza jina la Mungu, ambalo halitajwi wazi katika nahau ya Kiebrania.
- source_word: מֵעֲזֹב
  choice: hatutamwacha
  rationale: עזב katika muktadha wa agano ni kuacha au kuutelekeza uaminifu kwa mtu. ‘Kumwacha’ ni ya kawaida na bado ina uzito unaofaa hapa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano יהוה limetoholewa kuwa ‘Yahwe’ badala ya kubadilishwa na cheo kama ‘BWANA’.
- source_word: לַעֲבֹד
  choice: ili kuitumikia
  rationale: עבד kuhusu miungu huhusisha huduma ya kidini, ibada, na utiifu. ‘Kuitumikia’ inadumisha upana huo; ‘ili’ linaonyesha uhusiano wa infinitivu ya Kiebrania bila kulazimisha kuwa tendo lililoratibiwa kwa ‘na’.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: miungu mingine
  rationale: Hii ndiyo maana ya moja kwa moja ya kifungu hicho; ‘miungu ya kigeni’ ingeongeza wazo ambalo halijaelezwa wazi na אֲחֵרִים.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Andiko linatumia jina la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina binafsi la agano badala ya kulibadilisha kwa cheo.
- issue: Nguvu ya nahau חָלִילָה לָּנוּ
  choice: La hasha! Kamwe hatutamwacha
  alternative: Mungu apishie mbali tusimwache
  rationale: Kiebrania kinaonyesha kukataa kwa nguvu lakini hakimtaji Mungu ndani ya nahau hiyo. Tafsiri iliyochaguliwa haitoi ufafanuzi wa kitheolojia usio wazi katika chanzo.
- issue: Uhusiano wa לַעֲבֹד na מֵעֲזֹב
  choice: ili kuitumikia
  alternative: na kuitumikia
  rationale: 'Lamed kwenye infinitivu לַעֲבֹד inaweza kuwasilisha matokeo au kusudi: kumwacha Yahwe ili kutumikia miungu mingine. ‘Na kuitumikia’ pia inawezekana kimuktadha, lakini ingeonyesha uratibu wazi zaidi kuliko muundo wa Kiebrania.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘La hasha!’ ni kauli fupi ya kukataa kwa nguvu; ‘kamwe’ hufanya msisitizo wake uwe wazi katika matumizi ya sasa. Alama ya tanbihi [a] imewekwa baada ya kitenzi cha utangulizi kama katika safu ya ushauri ya Kiingereza.
