  text: וְ/עַתָּ֕ה הָסִ֛ירוּ אֶת אֱלֹהֵ֥י הַ/נֵּכָ֖ר אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֑ם וְ/הַטּוּ֙ אֶת לְבַבְ/כֶ֔ם אֶל יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/023.yaml
  text: So now[a], remove the foreign gods that are among you, and turn your heart to Yahweh[b], the God of Israel.
translation:
  language: sw
  text: Sasa basi, iondoeni miungu ya kigeni iliyo kati yenu[a], na ielekezeni mioyo yenu kwa Yahwe[b], Mungu wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iwekeni mbali miungu ya kigeni iliyo miongoni mwenu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “iinamisheni moyo wenu kwa Yahwe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Muunganiko huu unaonyesha kuwa agizo hili linatokana na yale yaliyotangulia na linapaswa kutekelezwa mara moja.
- source_word: הָסִירוּ
  choice: iondoeni
  rationale: Kitenzi hiki ni agizo kwa wingi lenye maana ya kuondoa au kuweka mbali; “iondoeni” ni wazi na cha kawaida katika Kiswahili cha sasa.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: miungu ya kigeni
  rationale: Kirai hiki kinamaanisha miungu ya watu au ibada za kigeni, si miungu yenye hali ya ajabu tu.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: iliyo kati yenu
  rationale: בקרבכם hapa inaonyesha kuwapo katikati ya jamii; “kati yenu” huepuka kuifanya iwe hali ya ndani ya mtu pekee.
- source_word: וְהַטּוּ
  choice: kuielekeza
  rationale: נטה ina maana ya kuinamisha au kuelekeza upande fulani. “Kuielekeza” huhifadhi taswira ya mwelekeo wa ndani kuelekea kwa Mungu.
- source_word: לְבַבְכֶם
  choice: mioyo yenu
  rationale: Ingawa Kiebrania kina nomino ya umoja yenye kiambishi cha nafsi ya pili wingi, Kiswahili cha kawaida hutumia “mioyo yenu” kwa kundi la watu huku kikihifadhi maana ya nia na uaminifu wa ndani.
- source_word: אֶל יְהוָה
  choice: kwa Yahwe
  rationale: אֶל huonyesha mwelekeo kuelekea kwake, na jina la agano יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Hili ni tumizi la wazi na la kawaida la kirai cha Kiebrania kinachomtambulisha Mungu wa Israeli.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Andiko linatumia moja kwa moja jina la agano יהוה; “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya kuelekeza moyo
  choice: kuielekeza mioyo yenu kwa Yahwe
  alternative: kugeuza mioyo yenu kwa Yahwe
  rationale: Chaguo hili huhifadhi sitiari ya Kiebrania ya kuinamisha au kuelekeza moyo bila kuifanya kwa lazima kuwa istilahi maalumu ya kitheolojia kuhusu uongofu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa agizo kwa wingi umehifadhiwa, huku “mioyo yenu” ikitumika kwa ufasaha wa Kiswahili. Jina “Yahwe” limetumiwa kwa יהוה.
