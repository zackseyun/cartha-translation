base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/009.yaml
  text: Then Balak son of Zippor[a], king of Moab, arose and fought against Israel[b]. He sent and called Balaam son of Beor to curse you.
translation:
  language: sw
  text: Ndipo Balaki mwana wa Sipori, mfalme wa Moabu, akainuka[a] na kupigana dhidi ya Israeli[b]. Akatuma na kumwita Balaamu mwana wa Beori ili awalaani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaanza kuchukua hatua.” Kitenzi cha Kiebrania kinaweza kuonyesha mwanzo wa hatua madhubuti.
    reason: lexical_alternative
  - marker: b
    text: Au, “akaanzisha vita dhidi ya Israeli” au “akaenda vitani dhidi ya Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: akainuka
  rationale: Kitenzi קום katika simulizi kinaweza kumaanisha kuinuka kihalisi au kuanza kuchukua hatua madhubuti. “Akainuka” kinahifadhi taswira na mwendo wa simulizi bila kuamua kimyakimya maana moja tu.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: kupigana dhidi ya Israeli
  rationale: Kitenzi לחם pamoja na ב hapa huonyesha uhasama unaoelekezwa kwa Israeli. “Kupigana dhidi ya” ni Kiswahili cha sasa kilicho wazi na hakipunguzi kauli kuwa maandalizi tu ya vita.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: Akatuma watu kumwita
  rationale: Kiswahili huhitaji kutaja kwa njia ya kawaida kile kilichotumwa; “akatuma watu kumwita” huwasilisha vitendo vyote viwili vya kutuma na kuita bila mtindo mgumu usio wa kawaida.
- source_word: לְבִלְעָם בֶּן בְּעוֹר
  choice: Balaamu mwana wa Beori
  rationale: Majina yameandikwa kwa tahajia zinazotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: לְקַלֵּל אֶתְכֶם
  choice: ili awalaani
  rationale: קלל katika muktadha huu ni kutamka au kuleta laana juu ya watu. “Awalaani” ni tafsiri ya moja kwa moja, ya kawaida, na inayohifadhi nia ya uhasama.
theological_decisions:
- issue: Kauli kwamba Balaki alipigana dhidi ya Israeli, ilhali Hesabu husisitiza jaribio lake la kumlaani Israeli kupitia Balaamu
  choice: Kudumisha maana ya wazi kwamba Balaki alipigana dhidi ya Israeli
  alternative: Kutafsiri kwa upana kuwa alifanya uhasama, alijiandaa kupigana, au kuondoa lugha ya mapigano ya moja kwa moja
  rationale: Kiebrania kinasema wazi וַיִּלָּחֶם בְּיִשְׂרָאֵל. Tofauti au mvutano na muhtasari wa simulizi jingine haupaswi kusawazishwa kwa kubadili tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. “Ndipo” hudumisha mfuatano wa simulizi; “akatuma watu kumwita” ni muundo wa kawaida wa Kiswahili unaowakilisha vitenzi viwili vya Kiebrania.
