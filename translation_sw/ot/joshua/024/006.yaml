  variant: Standard East African Swahili
source:
  edition: WLC
  text: וָֽ/אוֹצִ֤יא אֶת אֲבֽוֹתֵי/כֶם֙ מִ/מִּצְרַ֔יִם וַ/תָּבֹ֖אוּ הַ/יָּ֑מָּ/ה וַ/יִּרְדְּפ֨וּ מִצְרַ֜יִם אַחֲרֵ֧י אֲבוֹתֵי/כֶ֛ם בְּ/רֶ֥כֶב וּ/בְ/פָרָשִׁ֖ים יַם סֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/006.yaml
  text: Then I brought your fathers out from Egypt[a], and you came to the sea; and the Egyptians pursued your fathers with chariots and horsemen to the Red Sea.
translation:
  language: sw
  text: Kisha nikawatoa baba zenu nchini Misri, nanyi mkafika baharini. Wamisri wakawafuatilia baba zenu kwa magari ya vita na wapanda farasi mpaka Bahari ya Shamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa tafsiri ya karibu zaidi, “Bahari ya Matete.” Kiebrania: yam suph.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאוֹצִיא
  choice: Kisha nikawatoa
  rationale: Hifili ya יצא ina maana ya ‘kutoa’ au ‘kuongoza watoke’; ‘Kisha’ linaonyesha mwendelezo wa masimulizi unaobebwa na waw.
- source_word: אֶת אֲבוֹתֵיכֶם
  choice: baba zenu
  rationale: Hili ndilo tafsiri ya karibu ya neno la Kiebrania ‘baba zenu,’ likiwataja waliotangulia katika historia ya agano bila kuligeuza kuwa neno lisiloonyesha jinsia.
- source_word: מִמִּצְרַיִם
  choice: nchini Misri
  rationale: Muundo huu ni wa kawaida na wa asili katika Kiswahili; kitenzi ‘nikawatoa’ tayari kinaonyesha kutoka ndani ya nchi hiyo.
- source_word: וַתָּבֹאוּ הַיָּמָּה
  choice: nanyi mkafika baharini
  rationale: בוא pamoja na kiishio cha kuelekea huonyesha kufika kuelekea baharini. Nafsi ya pili ya wingi imehifadhiwa ili kudumisha jinsi wasikilizaji wanavyohusishwa na kizazi cha Kutoka.
- source_word: וַיִּרְדְּפוּ מִצְרַיִם
  choice: Wamisri wakawafuatilia
  rationale: Ingawa maandishi yana jina la pamoja ‘Misri,’ kitenzi cha wingi kinaelekeza kwa watu au majeshi ya Misri; ‘Wamisri’ ni sahihi na ya asili katika Kiswahili.
- source_word: בְּרֶכֶב
  choice: kwa magari ya vita
  rationale: רֶכֶב hapa humaanisha magari ya kijeshi; ‘magari ya vita’ ni wazi kuliko ‘magari’ peke yake.
- source_word: וּבְפָרָשִׁים
  choice: na wapanda farasi
  rationale: פָּרָשִׁים humaanisha askari wapandao farasi; tafsiri hii ni ya kawaida na inaeleweka.
- source_word: יַם סוּף
  choice: Bahari ya Shamu
  rationale: ‘Bahari ya Shamu’ ni jina la jadi linalotambulika katika Biblia za Kiswahili; maana ya karibu zaidi ya Kiebrania imewekwa katika tanbihi.
theological_decisions:
- issue: Wasikilizaji wa Israeli kutajwa kwa nafsi ya pili ingawa tukio liliwahusu waliowatangulia
  choice: nanyi mkafika baharini
  alternative: nao wakafika baharini
  rationale: Hotuba inawahusisha wasikilizaji wa wakati wa Yoshua na baba zao katika historia ya agano; kubaki na nafsi ya pili kunahifadhi nguvu hiyo ya usemi.
- issue: Tafsiri ya יַם סוּף
  choice: Bahari ya Shamu
  alternative: Bahari ya Matete
  rationale: Jina la jadi linabaki katika maandishi kwa utambulisho wa tukio, huku tafsiri ya karibu zaidi ya jina la Kiebrania ikitolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi mbili zimetumiwa kwa usomaji wa kawaida; ‘magari ya vita’ huepuka utata wa ‘magari’ katika matumizi ya kisasa.
