source:
  edition: WLC
  text: וָ/אֶתֵּ֨ן לָ/כֶ֜ם אֶ֣רֶץ אֲשֶׁ֧ר לֹֽא יָגַ֣עְתָּ בָּ֗/הּ וְ/עָרִים֙ אֲשֶׁ֣ר לֹא בְנִיתֶ֔ם וַ/תֵּשְׁב֖וּ בָּ/הֶ֑ם כְּרָמִ֤ים וְ/זֵיתִים֙ אֲשֶׁ֣ר לֹֽא נְטַעְתֶּ֔ם אַתֶּ֖ם אֹכְלִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/013.yaml
  text: And I gave you a land on which you had not labored[a], and cities that you had not built, and you live in them. You are eating from vineyards and olive groves that you did not plant.
translation:
  language: sw
  text: Nami niliwapa nchi ambayo hamkuwa mmeifanyia kazi, na miji ambayo hamkuwa mmeijenga; nanyi mnaishi humo. Mnakula mazao ya mizabibu na mizeituni ambayo hamkuipanda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: Nami niliwapa
  rationale: Wayyiqtol ya nafsi ya kwanza umoja inaeleza tendo la Mungu lililotangulia; wakati uliopita wa Kiswahili unafaa katika hotuba hii ya kukumbusha historia.
- source_word: אֶרֶץ
  choice: nchi
  rationale: ‘Nchi’ ni neno la kawaida na lenye hadhi linaloweza kumaanisha eneo walilopewa, bila kuingiza maelezo yasiyomo katika Kiebrania.
- source_word: אֲשֶׁר לֹא יָגַעְתָּ בָּהּ
  choice: ambayo hamkuwa mmeifanyia kazi
  rationale: יגע huhusu kufanya kazi kwa taabu. Usemi huu wa Kiswahili ni wa asili na unaonyesha kuwa hawakuwa wameifanyia nchi hiyo kazi kabla ya kupewa.
- source_word: וְעָרִים אֲשֶׁר לֹא בְנִיתֶם
  choice: na miji ambayo hamkuwa mmeijenga
  rationale: ‘Miji’ ni maana ya kawaida ya עָרִים, na wakati timilifu uliopita unaonyesha wazi kuwa kujenga kulitangulia kupewa na kukaliwa.
- source_word: וַתֵּשְׁבוּ בָּהֶם
  choice: nanyi mnaishi humo
  rationale: ישב hapa ni kuishi au kukaa mahali. Wakati wa sasa unaonyesha matokeo yanayoendelea ya zawadi ya awali, huku ‘humo’ ikirejelea miji.
- source_word: כְּרָמִים
  choice: mashamba ya mizabibu
  rationale: Hii ndiyo njia ya kawaida na inayoeleweka ya kutaja maeneo yaliyopandwa mizabibu.
- source_word: וְזֵיתִים
  choice: mashamba ya mizeituni
  rationale: Kiebrania kwa karibu ni ‘mizeituni’ au ‘zeituni’; ‘mashamba ya mizeituni’ huonyesha katika muktadha huu upandaji uliolimwa sambamba na mashamba ya mizabibu.
- source_word: אֲשֶׁר לֹא נְטַעְתֶּם
  choice: ambayo hamkuipanda
  rationale: נטע ni ‘kupanda.’ Kiambishi cha ngeli ya miti kinapatana na ‘mizabibu’ na ‘mizeituni’ inayokusudiwa katika mashamba hayo.
- source_word: אַתֶּם אֹכְלִים
  choice: Mnakula mazao ya
  rationale: Kiwakilishi pamoja na kitenzi-shirikishi kina nguvu ya sasa na mkazo. ‘Mazao ya’ huleta Kiswahili cha asili kwa chakula kinachopatikana kutoka mashambani bila kudai kwamba mashamba yenyewe ndiyo yanayoliwa.
theological_decisions:
- issue: Kubadilika kwa nafsi ya pili kutoka umoja hadi wingi katika Kiebrania
  choice: Kutumia wingi ‘-wa-/-m-’ kwa Israeli kama taifa katika mstari mzima
  alternative: Kuhifadhi umoja katika ‘ambayo hukuifanyia kazi,’ kisha kutumia wingi katika vifungu vinavyofuata
  rationale: Anayezungumziwa ni Israeli kwa pamoja. Kubadilisha umoja na wingi katika Kiswahili kungeonekana kama kubadilisha wahusika bila sababu, ilhali maana ya kijumuiya ni ileile.
- issue: Nguvu ya וַתֵּשְׁבוּ na אַתֶּם אֹכְלִים
  choice: ‘mnaishi’ na ‘mnakula’
  alternative: ‘mkakaa’ na ‘mlikula’
  rationale: Hotuba inataja tendo la Mungu la zamani na hali ambayo Israeli bado wanaifurahia. Wakati wa sasa huhifadhi matokeo endelevu na nguvu ya kitenzi-shirikishi bila kuongeza dai la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida na kinachoeleweka. Muundo umehifadhi mfululizo wa zawadi ya nchi, miji, na mazao, huku nyakati za vitenzi zikitofautisha tendo la Mungu la zamani na hali ya sasa ya watu.
