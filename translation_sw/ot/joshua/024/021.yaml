base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/021.yaml
  text: But the people said to Joshua[a], “No, but we will serve Yahweh.”
translation:
  language: sw
  text: Lakini watu wakamwambia Yoshua, “La, bali tutamtumikia Yahwe[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: YHWH; katika desturi nyingine za tafsiri hutolewa kama “BWANA.”'
    reason: Hufafanua jina la Mungu katika maandishi ya Kiebrania na hutaja namna nyingine ya kawaida ya kulitoa katika tafsiri.
lexical_decisions:
- source_word: וַיֹּאמֶר הָעָם
  choice: watu wakamwambia
  rationale: Nomino ya mkusanyiko הָעָם humaanisha jumuiya ya Israeli iliyokusanyika. Kiswahili cha kawaida hutumia upatanisho wa wingi kwa “watu,” na muktadha unaonyesha kuwa walimwambia Yoshua.
- source_word: לֹא
  choice: La!
  rationale: Hapa לֹא ni jibu la mkazo linalokataa onyo au changamoto iliyotangulia; “La!” lina nguvu hiyo kwa Kiswahili cha sasa.
- source_word: כִּי
  choice: Bali
  rationale: 'Baada ya “La,” כִּי inaleta kauli ya kusahihisha au kupinga: si hivyo, bali watamtumikia Yahwe. “Bali” ni ya asili na huhifadhi nguvu ya ulinganifu bila kufafanua kupita kiasi.'
- source_word: אֶת יְהוָה
  choice: Yahwe
  rationale: אֶת ni kiashiria cha yambwa kisichohitaji neno tofauti katika Kiswahili. Jina la Mungu יהוה limetolewa kama “Yahwe,” umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: נַעֲבֹד
  choice: tutamtumikia
  rationale: Kitenzi עבד katika muktadha wa agano kinahusu huduma yenye utii na uaminifu, ambayo inaweza kujumuisha ibada. “Tutamtumikia” huhifadhi upana huo kuliko kukifinya kuwa “tutamwabudu” pekee.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi yanatumia moja kwa moja jina la agano יהוה. “Yahwe” hulihifadhi kama jina binafsi, huku tanbihi ikitaja desturi nyingine ya kulitafsiri “BWANA.”
- issue: Maana ya עבד katika tamko la agano
  choice: tutamtumikia
  alternative: tutamwabudu
  rationale: “Kutumikia” huhifadhi maana pana ya utii, uaminifu, na ibada kwa Mungu bila kuifanya ihusu matendo ya ibada pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “La! Bali” linaonyesha kwa uwazi jibu la mkazo na marekebisho yaliyomo katika לֹא כִּי; “tutamtumikia” linafaa kwa lugha ya agano bila kuingiza msimamo wa dhehebu.
