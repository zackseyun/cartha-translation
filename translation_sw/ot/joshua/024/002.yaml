  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם כֹּֽה אָמַ֣ר יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ בְּ/עֵ֣בֶר הַ/נָּהָ֗ר יָשְׁב֤וּ אֲבֽוֹתֵי/כֶם֙ מֵֽ/עוֹלָ֔ם תֶּ֛רַח אֲבִ֥י אַבְרָהָ֖ם וַ/אֲבִ֣י נָח֑וֹר וַ/יַּעַבְד֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/002.yaml
  text: 'And Joshua said to all the people[a], “Thus says Yahweh, the God of Israel: Long ago your fathers lived beyond the River—Terah[b], the father of Abraham and the father of Nahor—and they served other gods.”'
translation:
  language: sw
  text: 'Yoshua akawaambia watu wote, “Yahwe, Mungu wa Israeli, asema hivi: Hapo kale baba zenu[b] waliishi ng’ambo ya Mto[a]—Tera, baba wa Ibrahimu na baba wa Nahori—na waliitumikia miungu mingine.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upande wa pili wa Mto”; huenda “Mto” hapa ni Eufrate.
    reason: cultural_note
  - marker: b
    text: 'Kiebrania: “baba zenu”; yaani mababu au wahenga wenu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akawaambia
  rationale: Muundo huu unaendeleza mtiririko wa simulizi wa Kiebrania na pia unaonyesha kwa kawaida kwamba Yoshua alisema maneno hayo kwa watu wote.
- source_word: אֶל כָּל הָעָם
  choice: watu wote
  rationale: עָם hapa ni jumuiya yote ya agano iliyokusanyika; “watu wote” ni Kiswahili cha kawaida na sahihi kwa muktadha.
- source_word: כֹּה אָמַר
  choice: asema hivi
  rationale: Hii ni fomula ya mjumbe inayotanguliza maneno ya Mungu; wakati uliopo ni wa kawaida katika Kiswahili kwa tamko lenye mamlaka linalonukuliwa moja kwa moja.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetolewa kama jina maalumu badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Huu ni uwasilishaji wa wazi na wa kawaida wa muundo wa Kiebrania unaomtambulisha Yahwe kwa uhusiano wake na Israeli.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: ng’ambo ya Mto
  rationale: “Ng’ambo ya” huhifadhi mtazamo wa kijiografia wa upande wa pili, na “Mto” huhifadhi nomino ya kawaida yenye maana ya mto unaojulikana bila kuingiza jina Eufrate katika matini.
- source_word: יָשְׁבוּ
  choice: waliishi
  rationale: Katika muhtasari huu wa kihistoria, kitenzi kinaeleza makao ya mababu; “waliishi” ni cha sasa, wazi, na cha kawaida kuliko “walikaa” ambacho kinaweza kumaanisha kuketi au kukaa kwa muda.
- source_word: אֲבוֹתֵיכֶם
  choice: baba zenu
  rationale: Huhifadhi umbo la kiume la wingi lililo katika Kiebrania, huku tanbihi ikifafanua maana yake ya mababu wa kale.
- source_word: מֵעוֹלָם
  choice: Hapo kale
  rationale: Katika muktadha huu neno linaonyesha wakati wa zamani sana, si umilele; “hapo kale” ni usemi wa kawaida na wenye hadhi.
- source_word: תֶּרַח אֲבִי אַבְרָהָם וַאֲבִי נָחוֹר
  choice: Tera, baba yake Abrahamu na baba yake Nahori
  rationale: Kurudiwa kwa “baba yake” kunawakilisha kurudiwa kwa אֲבִי katika matini ya Kiebrania.
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: na waliitumikia miungu mingine
  rationale: “Kuitumikia” huhifadhi maana ya msingi ya עבד na maana yake ya kidini katika uhusiano na miungu, bila kuipunguza kuwa tendo la ibada pekee.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini ina jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina la agano bila kulibadilisha kuwa cheo.
- issue: Maana ya אֲבוֹתֵיכֶם
  choice: baba zenu
  alternative: mababu zenu
  rationale: “Baba zenu” hudumisha umbo la kiume la Kiebrania, lakini tanbihi inaweka wazi kwamba hapa linamaanisha mababu au wahenga, si baba wa kizazi kimoja tu.
- issue: Aina ya huduma kwa miungu mingine
  choice: waliitumikia miungu mingine
  alternative: waliiabudu miungu mingine
  rationale: עבד katika muktadha huu bila shaka ina maana ya huduma ya kidini, lakini “kuitumikia” huhifadhi upana wa neno la asili na mvutano wake wa utii pamoja na ibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akawaambia” hudumisha mtiririko wa simulizi, “hapo kale” huepuka lugha ya kizamani kupita kiasi, na alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
