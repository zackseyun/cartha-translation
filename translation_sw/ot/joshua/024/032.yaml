  text: וְ/אֶת עַצְמ֣וֹת י֠וֹסֵף אֲשֶׁר הֶעֱל֨וּ בְנֵי יִשְׂרָאֵ֥ל מִ/מִּצְרַיִם֮ קָבְר֣וּ בִ/שְׁכֶם֒ בְּ/חֶלְקַ֣ת הַ/שָּׂדֶ֗ה אֲשֶׁ֨ר קָנָ֧ה יַעֲקֹ֛ב מֵ/אֵ֛ת בְּנֵֽי חֲמ֥וֹר אֲבִֽי שְׁכֶ֖ם בְּ/מֵאָ֣ה קְשִׂיטָ֑ה וַ/יִּֽהְי֥וּ לִ/בְנֵֽי יוֹסֵ֖ף לְ/נַחֲלָֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/032.yaml
  text: And the bones of Joseph[a], which the sons of Israel had brought up from Egypt, they buried at Shechem, in the portion of the field that Jacob had bought from the sons of Hamor, the father of Shechem, for a hundred qesitahs[c][b]; and it became an inheritance for the sons of Joseph.
translation:
  language: sw
  text: Mifupa ya Yosefu, ambayo wana wa Israeli walikuwa wamezileta kutoka Misri, wakaizika huko Shekemu, katika kipande cha shamba[a] ambacho Yakobo alikuwa amenunua kutoka kwa wana wa Hamori, baba ya Shekemu,[b] kwa kesita mia moja.[c] Mifupa hiyo ikawa urithi wa wana wa Yosefu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kiwanja cha shamba.” Neno la Kiebrania humaanisha kipande au sehemu maalumu ya ardhi.
    reason: lexical_alternative
  - marker: b
    text: Au huenda “mwanzilishi” au “babu mkuu wa Shekemu,” ikiwa “baba” limetumiwa kwa maana pana ya ukoo.
    reason: lexical_alternative
  - marker: c
    text: Kesita ilikuwa kipimo cha kale cha thamani au fedha; thamani yake halisi haijulikani. Kiebrania cha mwisho wa mstari kina kitenzi cha wingi kinacholingana na “mifupa”; kwa kuzingatia muktadha, wengine hulielewa eneo la maziko kuwa ndilo lililokuwa urithi wa wana wa Yosefu.
    reason: cultural_and_textual_note
lexical_decisions:
- source_word: עַצְמוֹת
  choice: mifupa
  rationale: Neno la Kiebrania linamaanisha moja kwa moja “mifupa”; tafsiri hii inadumisha taswira halisi na mwangwi wa simulizi la kuzikwa kwa Yosefu.
- source_word: הֶעֱלוּ
  choice: walikuwa wameileta
  rationale: Hifili ya עלה hapa ina maana ya kuleta kutoka Misri. Muundo wa wakati uliotangulia unaonyesha kuwa tendo hilo lilikuwa limefanyika kabla ya maziko, bila kulazimisha kitenzi kisicho cha kawaida cha “kupandisha” katika Kiswahili.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi wa kifamilia wa chanzo na bado ni Kiswahili cha kawaida na kinachoeleweka.
- source_word: בִשְׁכֶם
  choice: huko Shekemu
  rationale: “Huko” huonyesha mahali pa maziko kwa njia ya kawaida bila kuamua kwa lazima kama palikuwa ndani ya mji wenyewe.
- source_word: בְּחֶלְקַת הַשָּׂדֶה
  choice: katika kipande cha shamba
  rationale: חלקה ni sehemu au kiwanja maalumu cha ardhi; “kipande cha shamba” ni cha kawaida na kinabaki karibu na maana ya chanzo.
- source_word: קָנָה
  choice: alikuwa amenunua
  rationale: Muktadha unaonyesha ununuzi, na wakati uliotangulia unaweka tendo hilo kabla ya maziko.
- source_word: בְּנֵי חֲמוֹר
  choice: wana wa Hamori
  rationale: Hii inafuata kwa karibu usemi halisi wa Kiebrania bila kuubadili moja kwa moja kuwa “wazao.”
- source_word: אֲבִי שְׁכֶם
  choice: baba ya Shekemu
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya muundo wa Kiebrania; uwezekano wa maana pana zaidi umewekwa katika tanbihi.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: kwa kesita mia moja
  rationale: Kesita ni kipimo cha kale cha thamani ambacho thamani yake halisi haijulikani; kulitohowa huepuka kutoa ulinganifu wa kisasa usio na uhakika.
- source_word: וַיִּהְיוּ לִבְנֵי יוֹסֵף לְנַחֲלָה
  choice: Mifupa hiyo ikawa urithi wa wana wa Yosefu
  rationale: Kitenzi cha Kiebrania ni cha wingi na kwa sarufi kinaweza kurejelea mifupa. Tafsiri hii inadumisha uhusiano huo badala ya kubadili kimya kimya rejeo kuwa shamba, ingawa muktadha unaweza kufanya eneo la maziko lieleweke pia.
theological_decisions:
- issue: Usemi wa kifamilia בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: “Wana wa Israeli” hudumisha utambulisho wa kifamilia na wa agano uliomo katika chanzo bila kuingiza msimamo wa dhehebu.
- issue: Rejeo la kitenzi cha wingi וַיִּהְיוּ
  choice: Mifupa hiyo ikawa urithi wa wana wa Yosefu
  alternative: Eneo hilo likawa urithi wa wana wa Yosefu
  rationale: Sarufi ya Kiebrania inaelekeza kwa kawaida kwenye “mifupa,” lakini muktadha wa kipande cha shamba unaweza kuunga mkono “eneo.” Matini kuu inafuata sarufi ya wazi zaidi, huku maelezo yakitambua mvutano huo badala ya kuutatua kwa uhakika usio katika chanzo.
- issue: Kipimo cha kale קְשִׂיטָה
  choice: kesita
  alternative: kipande cha fedha
  rationale: Kutumia jina la kale huepuka kudai kwa makosa kwamba thamani au aina yake ya fedha inajulikana sawasawa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa sasa, na unaosomeka kwa urahisi. Majina “Yosefu,” “Israeli,” “Misri,” “Shekemu,” “Yakobo,” na “Hamori” yanafuata maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili. Sentensi imehifadhi mtiririko wa simulizi la Kiebrania, huku viambishi vya ngeli katika “mifupa ... ambayo ... ikawa” vikifuata sarufi ya Kiswahili.
