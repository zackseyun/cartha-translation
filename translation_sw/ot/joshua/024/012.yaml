  text: וָ/אֶשְׁלַ֤ח לִ/פְנֵי/כֶם֙ אֶת הַ/צִּרְעָ֔ה וַ/תְּגָ֤רֶשׁ אוֹתָ/ם֙ מִ/פְּנֵי/כֶ֔ם שְׁנֵ֖י מַלְכֵ֣י הָ/אֱמֹרִ֑י לֹ֥א בְ/חַרְבְּ/ךָ֖ וְ/לֹ֥א בְ/קַשְׁתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/012.yaml
  text: And I sent the hornet ahead of you[a], and it drove them out before you—the two kings of the Amorites—not by your sword and not by your bow.
translation:
  language: sw
  text: Nami nikatuma mavu[a] mbele yenu, yakawafukuza kutoka mbele yenu wale wafalme wawili wa Waamori—si kwa upanga wako wala kwa upinde wako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda ni usemi wa kitamathali unaomaanisha hofu au kitisho kilichotumwa na Mungu, badala ya mavu halisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: Nami nikatuma
  rationale: Kauli ya wayyiqtol ya nafsi ya kwanza umoja inaendeleza masimulizi ya matendo ya YHWH; “Nami nikatuma” huhifadhi mfuatano na mkazo wa mtendaji.
- source_word: לִפְנֵיכֶם
  choice: mbele yenu
  rationale: Huwakilisha moja kwa moja wazo la kutumwa kabla ya Israeli na ni usemi wa kawaida wa Kiswahili.
- source_word: הַצִּרְעָה
  choice: mavu
  rationale: Nomino hii kimsingi humaanisha mdudu aina ya nyigu mkubwa/hornet. Kiswahili hutumia “mavu” kwa kawaida katika hali ya wingi, inayofaa pia kueleza kundi linalowakilishwa na umoja wa Kiebrania. Uwezekano wa maana ya kitamathali umewekwa katika tanbihi.
- source_word: וַתְּגָרֶשׁ
  choice: nao wakawafukuza
  rationale: Mzizi גרשׁ humaanisha kufukuza au kutoa kwa nguvu. Upatanisho wa Kiswahili unafuata “mavu” kama wingi, ingawa kitenzi cha Kiebrania ni cha kike umoja kikikubaliana na nomino ya umoja.
- source_word: מִפְּנֵיכֶם
  choice: kutoka mbele yenu
  rationale: Huhifadhi kihusishi cha kuondolewa kutoka mbele/uweponi mwa Israeli na kueleza wazi matokeo ya kufukuzwa.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: wale wafalme wawili wa Waamori
  rationale: Huhifadhi muundo na utambulisho wa watawala hao wawili; “wale” huonyesha kwamba ndio wanaorejelewa na kiwakilishi cha awali.
- source_word: לֹא בְחַרְבְּךָ
  choice: si kwa upanga wako
  rationale: “Kwa” huonyesha chombo au njia, huku umoja wa “wako” ukihifadhi usemi wa Kiebrania unaomwelekea Israeli kwa umoja wa kijumla.
- source_word: וְלֹא בְקַשְׁתֶּךָ
  choice: wala kwa upinde wako
  rationale: “Wala” huunda ulinganifu wa kawaida na “si” na kuhifadhi msisitizo kwamba ushindi haukupatikana kwa silaha za Israeli.
theological_decisions:
- issue: Iwapo הַצִּרְעָה litafsiriwe kihalisi au kama tamathali ya hofu iliyotumwa na Mungu
  choice: Kutafsiri kihalisi kama “mavu” katika matini kuu
  alternative: “hofu” au “kitisho”
  rationale: Maana ya msingi ya neno ni mdudu aina ya hornet, na muktadha haulazimishi tafsiri ya kitamathali. Matini kuu huhifadhi picha halisi na uwakala wa Mungu, huku tanbihi ikitaja uwezekano mwingine bila kuutatua kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mavu” ni neno linaloeleweka kwa hornets/wasps na kwa kawaida huchukua upatanisho wa wingi. Mstari mrefu umetenganishwa kwa alama ya mkato ili kudumisha ufafanuzi wa wale waliofukuzwa na msisitizo wa mwisho.
