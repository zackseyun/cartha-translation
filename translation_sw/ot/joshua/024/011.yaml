base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/011.yaml
  text: Then you crossed the Jordan and came to Jericho[a], and the men of Jericho fought against you—the Amorites, the Perizzites, the Canaanites, the Hittites, the Girgashites, the Hivites, and the Jebusites—and I gave them into your hand.
translation:
  language: sw
  text: Kisha mkavuka Yordani na mkafika Yeriko. Watu wa Yeriko[a] wakapigana nanyi—Waamori, Waperizi, Wakanaani, Wahiti, Wagirgashi, Wahivi na Wayebusi—nami nikawatia mikononi mwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mabwana wa Yeriko” au “wakuu wa Yeriko.” Neno la Kiebrania kwa maana halisi ni “wenye” au “mabwana wa Yeriko”; huenda likarejelea watawala au watu mashuhuri wa mji huo, badala ya wakazi wake wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַבְרוּ
  choice: mkavuka
  rationale: Kitenzi עבר katika muktadha huu kinaeleza kuvuka Mto Yordani; “mkavuka” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: הַיַּרְדֵּן
  choice: Yordani
  rationale: Hili ndilo jina la kawaida la mto huo katika Kiswahili cha Biblia; muktadha unaonyesha wazi kuwa ni mto.
- source_word: וַתָּבֹאוּ אֶל יְרִיחוֹ
  choice: na kufika Yeriko
  rationale: בוא pamoja na אֶל inaweza kumaanisha kufika mahali; “kufika Yeriko” huepuka kudai kwa lazima kwamba waliingia ndani ya mji.
- source_word: וַיִּלָּחֲמוּ בָכֶם
  choice: wakapigana nanyi
  rationale: לחם pamoja na ב hapa huonyesha mapambano ya uadui; katika Kiswahili, “kupigana na” huwasilisha maana hiyo kwa kawaida.
- source_word: בַּעֲלֵי יְרִיחוֹ
  choice: Watawala wa Yeriko
  rationale: בעלי kwa maana halisi ni mabwana au wenye mamlaka; katika mazingira ya mji inaweza kumaanisha watawala au wakuu wake. “Watawala” huhifadhi maana hiyo huku tanbihi ikitaja uwezekano mwingine.
- source_word: הָאֱמֹרִי וְהַפְּרִזִּי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַגִּרְגָּשִׁי הַחִוִּי וְהַיְבוּסִי
  choice: Waamori, Waperizi, Wakanaani, Wahiti, Wagirgashi, Wahivi na Wayebusi
  rationale: Majina hayo ya umoja katika Kiebrania yanatumika kwa maana ya makabila au mataifa kwa ujumla, kwa hiyo yametolewa katika wingi wa kawaida wa Kiswahili.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: nami nikawatia mikononi mwenu
  rationale: Usemi נתן ביד humaanisha kuwatia maadui chini ya mamlaka ya mtu; “mikononi mwenu” huhifadhi sitiari ya Kiebrania kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Utendaji wa Mungu katika ushindi wa Israeli
  choice: “nami nikawatia mikononi mwenu”
  alternative: “nikawaacha mshinde”
  rationale: Kauli ya nafsi ya kwanza ya Mungu inasema wazi kwamba yeye ndiye aliyewatia maadui chini ya mamlaka ya Israeli; haijapunguzwa kuwa ruhusa tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi unaoeleweka na hadhi inayofaa maandiko. Muundo wa “wakapigana nanyi” ni wa asili katika Kiswahili; sitiari “mikononi mwenu” imehifadhiwa kwa sababu inaeleweka na kubeba uzito wa kauli ya chanzo.
