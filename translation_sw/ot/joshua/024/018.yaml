base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/018.yaml
  text: And Yahweh drove out from before us all the peoples[a], including the Amorites who lived in the land. We also will serve Yahweh, for he is our God.
translation:
  language: sw
  text: Yahwe akawafukuza kutoka mbele yetu mataifa yote, pamoja na Waamori[a] waliokaa katika nchi. Sisi pia tutamtumikia Yahwe, kwa maana yeye ndiye Mungu wetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na Waamori waliokaa katika nchi.”
    reason: Muundo wa Kiebrania unaweza kusomwa kuwa unawaongeza Waamori kwa uratibu, badala ya kuwaonyesha wazi kuwa ni sehemu ya “mataifa yote.”
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: akawafukuza
  rationale: Kitenzi גרש kina maana ya kuwafukuza au kuwaondoa watu mahali; “akawafukuza” kinahifadhi nguvu ya kuondolewa bila kuongeza maelezo ya kijeshi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kuwa “Yahwe” badala ya kubadilishwa na cheo.
- source_word: כָּל הָעַמִּים
  choice: watu wote
  rationale: Nomino ya wingi עמים hapa inarejelea makundi mbalimbali ya watu; “watu wote” ni Kiswahili cha kawaida kinachofaa katika muktadha huu.
- source_word: וְאֶת הָאֱמֹרִי
  choice: pamoja na Waamori
  rationale: Kauli hii inaweza kuwa nyongeza inayowataja Waamori kama sehemu ya watu waliotangulia kutajwa; “pamoja na” ni ya kawaida, huku uwezekano wa usomaji wa uratibu ukihifadhiwa katika tanbihi.
- source_word: יֹשֵׁב הָאָרֶץ
  choice: waliokaa katika nchi
  rationale: Kirai cha hali kinawaeleza Waamori kuwa wakazi wa nchi, na “waliokaa” ni cha kawaida na chenye maana pana kuliko ibada au umiliki.
- source_word: מִפָּנֵינוּ
  choice: kutoka mbele yetu
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya kuondolewa kutoka mbele ya Israeli.
- source_word: גַּם אֲנַחְנוּ
  choice: Sisi pia
  rationale: Maneno haya yanasisitiza ahadi ya watu kwa kuitikia msimamo uliotangulia wa Yoshua.
- source_word: נַעֲבֹד
  choice: tutamtumikia
  rationale: עבד inapomhusu Mungu inajumuisha ibada, utii, na uaminifu wa agano; “kumtumikia” huhifadhi upana huo.
- source_word: כִּי הוּא אֱלֹהֵינוּ
  choice: kwa maana yeye ndiye Mungu wetu
  rationale: כִּי inatoa sababu ya ahadi, na “ndiye” huwasilisha kwa kawaida kiima kilichosisitizwa katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia jina la agano moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kuliweka kama cheo.
- issue: Upeo wa עבד katika muktadha wa agano
  choice: tutamtumikia
  alternative: tutamwabudu
  rationale: Kitenzi hiki kinajumuisha ibada lakini pia utii na uaminifu mpana wa agano; “kumtumikia” hakipunguzi maana yake kuwa shughuli za ibada pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni wazi kwa msomaji wa kawaida, huku mpangilio “kutoka mbele yetu” ukihifadhi taswira ya chanzo. Jina “Waamori” limetumiwa kwa maana ya jamii kwa wingi, ingawa Kiebrania lina umbo la umoja wa kijamii.
