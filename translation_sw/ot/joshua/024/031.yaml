  text: וַ/יַּעֲבֹ֤ד יִשְׂרָאֵל֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשֻׁ֔עַ וַ/אֲשֶׁ֣ר יָדְע֗וּ אֵ֚ת כָּל מַעֲשֵׂ֣ה יְהוָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/031.yaml
  text: Israel served Yahweh all the days of Joshua[a], and all the days of the elders who outlived Joshua and who had known all the work of Yahweh that he had done for Israel.
translation:
  language: sw
  text: Waisraeli walimtumikia Yahweh siku zote za Yoshua, na siku zote za wazee waliomzidi Yoshua kuishi, ambao waliyajua matendo yote[a] ya Yahweh aliyowafanyia Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kazi yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: walimtumikia
  rationale: Kitenzi עבד kinapotumiwa na Yahweh kama yambwa huonyesha kumtumikia kwa uaminifu wa agano; maana yake ni pana kuliko ibada ya kidini pekee.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa konsonanti YHWH limehifadhiwa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: כֹּל יְמֵי
  choice: siku zote za
  rationale: Huu ni usemi wa asili wa Kiswahili unaohifadhi muundo na maana ya muda katika Kiebrania.
- source_word: הַזְּקֵנִים
  choice: wale wazee
  rationale: “Wazee” huweza kuonyesha umri pamoja na hadhi ya uongozi katika jamii ya Israeli bila kufafanua kupita kiasi.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי יְהוֹשֻׁעַ
  choice: walioendelea kuishi baada ya Yoshua
  rationale: Usemi wa Kiebrania una maana ya kwamba wazee hao waliishi muda mrefu kuliko Yoshua na wakaendelea kuwa hai baada yake.
- source_word: יָדְעוּ
  choice: walijua
  rationale: Neno hili linaonyesha kwamba wazee hao walikuwa na ufahamu wa matendo ya Yahweh; “walijua” huhifadhi maana bila kulazimisha tafsiri mahususi ya “walijionea.”
- source_word: כָּל מַעֲשֵׂה יְהוָה
  choice: kazi yote ya Yahweh
  rationale: מַעֲשֶׂה inaweza kumaanisha kazi, tendo, au matendo. “Kazi yote” ni tafsiri ya karibu na ya kawaida; uwezekano wa “matendo yote” umehifadhiwa katika tanbihi.
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: alikuwa ameifanyia Israeli
  rationale: Kihusishi ל katika muktadha huu huonyesha kitendo kilichofanywa kwa ajili ya Israeli; muundo huu wa Kiswahili unaonyesha wazi manufaa hayo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: Yehova
  rationale: Andiko linatumia jina la agano יהוה moja kwa moja. “Yahweh” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo “walioendelea kuishi baada ya Yoshua” umetumiwa badala ya usemi mgumu wa neno kwa neno, huku maana ya Kiebrania ikihifadhiwa.
