source:
  edition: WLC
  text: וְ/אִם֩ רַ֨ע בְּֽ/עֵינֵי/כֶ֜ם לַ/עֲבֹ֣ד אֶת יְהוָ֗ה בַּחֲר֨וּ לָ/כֶ֣ם הַ/יּוֹם֮ אֶת מִ֣י תַעֲבֹדוּ/ן֒ אִ֣ם אֶת אֱלֹהִ֞ים אֲשֶׁר עָבְד֣וּ אֲבוֹתֵי/כֶ֗ם אֲשֶׁר֙ ב/עבר הַ/נָּהָ֔ר וְ/אִם֙ אֶת אֱלֹהֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֣ים בְּ/אַרְצָ֑/ם וְ/אָנֹכִ֣י וּ/בֵיתִ֔/י נַעֲבֹ֖ד אֶת יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/015.yaml
  text: But if it is evil in your eyes to serve Yahweh[a], choose for yourselves today whom you will serve—whether the gods your fathers served beyond the River, or the gods of the Amorites in whose land you are dwelling. But as for me and my house[d][c][b], we will serve Yahweh.
translation:
  language: sw
  text: 'Lakini ikiwa kumtumikia Yahwe ni jambo baya machoni penu[a], jichagulieni leo ni nani mtakayemtumikia: iwe ni miungu ambayo baba zenu[b] waliitumikia ng’ambo ya Mto[c], au miungu ya Waamori ambao mnaishi katika nchi yao. Lakini mimi na nyumba yangu[d], tutamtumikia Yahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa mnaona kuwa si sawa” au “ikiwa jambo hilo haliwapendezi”; kihalisi, “ikiwa ni baya machoni penu.”
    reason: lexical_alternative
  - marker: b
    text: 'Au, “mababu zenu”; Kiebrania: “baba zenu.”'
    reason: lexical_alternative
  - marker: c
    text: “Mto” hapa ni Mto Frati.
    reason: cultural_note
  - marker: d
    text: Au, “watu wa nyumbani mwangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם רַע בְּעֵינֵיכֶם
  choice: Lakini ikiwa machoni penu ni jambo baya
  rationale: Huhifadhi sharti, utofautishaji, na taswira ya Kiebrania ya jambo kuwa ‘baya machoni’ mwa wasikilizaji, huku sentensi ikibaki wazi katika Kiswahili cha sasa.
- source_word: לַעֲבֹד / תַעֲבֹדוּן / נַעֲבֹד
  choice: kumtumikia / mtakayemtumikia / tutamtumikia
  rationale: ‘Kutumikia’ huhifadhi urudiaji wa mzizi עבד na maana pana ya ibada, utiifu, na uaminifu wa agano bila kuibana kuwa ibada ya kidini pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa umbo la Kiswahili ‘Yahwe’ badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: בַּחֲרוּ לָכֶם הַיּוֹם
  choice: jichagulieni leo
  rationale: Huwasilisha amri, msisitizo wa kuchagua kwa ajili yao wenyewe, na uharaka wa ‘leo’ kwa Kiswahili cha kawaida.
- source_word: אֶת מִי תַעֲבֹדוּן
  choice: mtakayemtumikia
  rationale: Muundo huu wa Kiswahili unaeleza kwa ufupi na kwa kawaida yule watakayemchagua kuwa wa kumtumikia.
- source_word: אֱלֹהִים ... אֱלֹהֵי
  choice: miungu ... miungu
  rationale: Muktadha unarejelea miungu ya mataifa; wingi umehifadhiwa bila kutumia neno la kitaalamu lisilo la kawaida.
- source_word: אֲשֶׁר עָבְדוּ אֲבוֹתֵיכֶם
  choice: ambayo baba zenu waliitumikia
  rationale: ‘Baba zenu’ huhifadhi neno la Kiebrania lililo na maana ya msingi ya baba, huku tanbihi ikionyesha maana pana inayowezekana ya mababu.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: ng’ambo ya Mto
  rationale: Huhifadhi usemi wa kijiografia wa Kiebrania; herufi kubwa inaonyesha kwamba ‘Mto’ ni jina rejelezi linalojulikana katika muktadha.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la kundi hilo la watu.
- source_word: אֲשֶׁר אַתֶּם יֹשְׁבִים בְּאַרְצָם
  choice: ambao mnaishi katika nchi yao
  rationale: Huwasilisha hali yao ya sasa ya kuishi katika nchi ya Waamori kwa lugha ya kawaida na yenye hadhi.
- source_word: וְאָנֹכִי וּבֵיתִי
  choice: Lakini mimi na nyumba yangu
  rationale: Huhifadhi utofautishaji wenye msisitizo na sitiari ya ‘nyumba,’ ambayo inaweza kumaanisha watu wote wa nyumbani.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Upana wa maana ya עבד katika uaminifu wa kidini
  choice: kutumikia
  alternative: kuabudu
  rationale: ‘Kutumikia’ huhifadhi maana pana ya huduma na uaminifu na pia urudiaji wa neno katika mstari; ‘kuabudu’ lingeweza kuifanya maana kuwa finyu zaidi.
- issue: Maana ya אֲבוֹתֵיכֶם
  choice: baba zenu
  alternative: mababu zenu
  rationale: Chaguo kuu hufuata maana ya moja kwa moja ya neno la Kiebrania, huku tanbihi ikihifadhi uwezekano wa maana pana ya vizazi vilivyotangulia.
- issue: Wigo wa בֵיתִי
  choice: nyumba yangu
  alternative: watu wa nyumbani mwangu
  rationale: ‘Nyumba yangu’ huhifadhi taswira ya Kiebrania bila kuamua kimya kimya mipaka kamili ya kundi linalokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘machoni penu’ na ‘nyumba yangu’ umehifadhi taswira ya Kiebrania, lakini sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayofafanuliwa.
