reference: Joshua 24:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וָ/אֶתֵּ֣ן לְ/יִצְחָ֔ק אֶֽת יַעֲקֹ֖ב וְ/אֶת עֵשָׂ֑ו וָ/אֶתֵּ֨ן לְ/עֵשָׂ֜ו אֶת הַ֤ר שֵׂעִיר֙ לָ/רֶ֣שֶׁת אוֹת֔/וֹ וְ/יַעֲקֹ֥ב וּ/בָנָ֖י/ו יָרְד֥וּ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/004.yaml
  text: And I gave Isaac Jacob and Esau[a], and I gave Esau the hill country of Seir to possess[b]; but Jacob and his sons went down to Egypt.
translation:
  language: sw
  text: Nami nikampa Isaka Yakobo na Esau; nikampa Esau nchi ya milima ya Seiri[a] ili aimiliki; lakini[b] Yakobo na wanawe walishuka kwenda Misri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mlima Seiri,” au, “milima ya Seiri.”
    reason: lexical_alternative
  - marker: b
    text: Au, “na Yakobo na wanawe walishuka kwenda Misri.” Kiunganishi cha Kiebrania ni “na”; maandishi yametumia “lakini” ili kuweka wazi tofauti iliyopo katika muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: nikampa
  rationale: Kitenzi נתן hapa kinamaanisha kumpa au kumjalia mtu watoto na eneo. “Nikampa” ni tafsiri ya moja kwa moja na hudumisha kurudiwa kwa tendo la Mungu.
- source_word: לְיִצְחָק
  choice: Isaka
  rationale: Jina limetoholewa kwa umbo la kawaida katika Kiswahili.
- source_word: אֶת יַעֲקֹב וְאֶת עֵשָׂו
  choice: Yakobo na Esau
  rationale: Kiashiria cha yambwa אֶת hakihitaji kutafsiriwa; majina yametoholewa kwa maumbo ya kawaida ya Kiswahili.
- source_word: הַר שֵׂעִיר
  choice: nchi ya milima ya Seiri
  rationale: הַר inaweza kumaanisha mlima mmoja, milima, au eneo la milima. Katika muktadha huu ni eneo alilopewa Esau, hivyo “nchi ya milima ya Seiri” huonyesha maana ya kieneo huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: לָרֶשֶׁת אֹתוֹ
  choice: ili aimiliki
  rationale: ירש hapa ni kuimiliki au kuipokea nchi iwe milki. “Ili aimiliki” ni ya asili katika Kiswahili na inahifadhi kusudi linaloonyeshwa na umbo la Kiebrania.
- source_word: וְיַעֲקֹב וּבָנָיו
  choice: lakini Yakobo na wanawe
  rationale: וְ kimsingi ni “na,” lakini muktadha unalinganisha Esau kupewa Seiri na Yakobo pamoja na wanawe kushuka Misri. “Lakini” huweka ulinganisho huo wazi katika Kiswahili cha kawaida.
- source_word: יָרְדוּ מִצְרָיִם
  choice: walishuka kwenda Misri
  rationale: ירד ni kushuka. Usemi huu huhifadhi mwelekeo wa simulizi na unasomeka kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya kiunganishi cha mwisho וְ
  choice: lakini
  alternative: na
  rationale: 'Kiunganishi cha Kiebrania hakilazimishi maana ya upinzani, lakini muktadha unaweka matokeo mawili tofauti sambamba: Esau anapewa Seiri, huku Yakobo na wanawe wakishuka Misri. “Lakini” huonyesha tofauti hiyo bila kuongeza fundisho; tanbihi inahifadhi tafsiri rasmi zaidi ya “na.”'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Maandiko. Muundo wa “Nami nikampa” unaunganisha aya na muktadha uliotangulia, huku majina Isaka, Yakobo, Esau, Seiri, na Misri yakifuata matumizi yaliyozoeleka katika Kiswahili.
