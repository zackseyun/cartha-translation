  text: וַ/יֶּאֶסֹ֧ף יְהוֹשֻׁ֛עַ אֶת כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל שְׁכֶ֑מָ/ה וַ/יִּקְרָא֩ לְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל וּ/לְ/רָאשָׁ֗י/ו וּ/לְ/שֹֽׁפְטָי/ו֙ וּ/לְ/שֹׁ֣טְרָ֔י/ו וַ/יִּֽתְיַצְּב֖וּ לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/001.yaml
  text: Then Joshua gathered all the tribes of Israel to Shechem[a], and he called for the elders of Israel, its heads, its judges, and its officers[c][b], and they presented themselves before God.
translation:
  language: sw
  text: Kisha Yoshua akakusanya makabila yote ya Israeli kwenda Shekemu[a], akawaita wazee wa Israeli, wakuu wa Israeli[b], waamuzi wake, na maafisa wake; nao wakajitokeza mbele za Mungu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “huko Shekemu.” Umbo la Kiebrania linaonyesha mwelekeo wa kwenda Shekemu.
    reason: lexical_alternative
  - marker: b
    text: Au “viongozi wa Israeli.” Neno la Kiebrania ni “wakuu wake,” kihalisi “vichwa vyake.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema “mbele za Mungu”; usemi huu unaweza kudokeza kujitokeza katika mahali patakatifu au eneo takatifu la agano.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֶסֹף
  choice: akakusanya
  rationale: Kitenzi hiki katika simulizi kina maana ya kuwaleta watu pamoja kwa kusudi maalumu; “akakusanya” ni cha kawaida na sahihi katika Kiswahili.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: makabila yote ya Israeli
  rationale: “Makabila” ni neno la kawaida kwa vikundi vya kijamii na kisiasa vya Israeli; “yote” inawakilisha כָּל.
- source_word: שְׁכֶמָה
  choice: huko Shekemu
  rationale: Kiambishi cha mwelekeo katika Kiebrania kinaonyesha kuelekea Shekemu. Kiswahili cha kawaida hutaja mahali pa mkusanyiko kwa “huko Shekemu,” huku maana halisi ya mwelekeo ikihifadhiwa katika tanbihi.
- source_word: וַיִּקְרָא לְ
  choice: akawaita
  rationale: Katika muktadha huu kitenzi kinamaanisha kuwaita viongozi waliotajwa wahudhurie; “akawaita” ni wazi na cha asili.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: wazee wa Israeli
  rationale: Hili ni jina la kawaida na sahihi la kundi rasmi la viongozi.
- source_word: רָאשָׁיו
  choice: wakuu wake
  rationale: Tafsiri hii inahifadhi taswira ya neno “vichwa/wakuu” na kiambishi cha umoja kinachorejelea Israeli kama jumuiya; “viongozi wake” ni tafsiri mbadala iliyo wazi zaidi.
- source_word: שֹׁפְטָיו
  choice: waamuzi wake
  rationale: Ni cheo cha kiraia na kimahakama kinacholingana moja kwa moja na neno la Kiebrania.
- source_word: שֹׁטְרָיו
  choice: maafisa wake
  rationale: Neno la Kiebrania linamaanisha maafisa au watendaji wa kiutawala; “maafisa” ni pana na la kawaida katika Kiswahili.
- source_word: וַיִּתְיַצְּבוּ
  choice: wakajihudhurisha
  rationale: Kauli hii inaonyesha kujitokeza au kuchukua nafasi rasmi mbele ya mwenye mamlaka; “wakajihudhurisha” inafaa mazingira ya kusanyiko la agano.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: mbele za Mungu
  rationale: Kiebrania kinamtaja Mungu moja kwa moja, si jina YHWH wala patakatifu; tafsiri hii inaacha wazi uwezekano wa mazingira ya ibada.
theological_decisions:
- issue: Maana ya לִפְנֵי הָאֱלֹהִים katika kusanyiko la agano
  choice: mbele za Mungu
  alternative: mbele za BWANA; mbele ya mahali patakatifu pa Mungu
  rationale: Maandishi yana הָאֱלֹהִים, “Mungu,” wala si jina YHWH. Kwa hiyo jina “BWANA” halijaingizwa. Ingawa usemi huu unaweza kudokeza kujitokeza katika mahali patakatifu, maana hiyo haijaongezwa katika matini kuu bali imeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina ya vyeo yametofautishwa, na sentensi imegawanywa mara mbili ili iwe nyepesi kusoma bila kuvunja mwendelezo wa simulizi.
