  text: From there he went up against the inhabitants of Debir[a]. (Formerly the name of Debir was Kiriath-sepher.)
translation:
  language: sw
  text: Kutoka huko akapanda dhidi ya wakazi wa Debiri. (Hapo zamani Debiri iliitwa Kiriath-sefer[a].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiriath-sefer huenda likamaanisha “Mji wa Kitabu” au “Mji wa Uandishi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda kwenda dhidi ya
  rationale: Kitenzi עלה kimsingi humaanisha “kupanda.” Katika muktadha huu wa kijeshi, mwendo huo unaelekezwa dhidi ya wakazi wa mji; tafsiri hii huhifadhi wazo la kupanda na pia uhasama wa muktadha bila kukifupisha kuwa “akashambulia.”
- source_word: מִשָּׁם
  choice: Kutoka huko
  rationale: Ni usemi wa kawaida wa kuonyesha kuondoka mahali palipotajwa katika simulizi lililotangulia.
- source_word: אֶל יֹשְׁבֵי דְּבִר
  choice: dhidi ya wakazi wa Debiri
  rationale: יֹשְׁבֵי ni “wakazi” au “wanaokaa,” na אֶל pamoja na עלה katika simulizi la kijeshi inaeleweka kwa kawaida kama mwendo dhidi yao.
- source_word: דְּבִר
  choice: Debiri
  rationale: Jina la mahali limetoholewa kwa umbo linalosomeka kwa kawaida katika Kiswahili badala ya kutafsiriwa maana yake.
- source_word: וְשֵׁם דְּבִר לְפָנִים
  choice: Hapo zamani Debiri iliitwa
  rationale: לְפָנִים hapa ina maana ya wakati, “zamani.” Muundo huu ni wa asili katika Kiswahili na unawasilisha taarifa ya jina la awali kwa uwazi.
- source_word: קִרְיַת סֵפֶר
  choice: Kiriath-sefer
  rationale: Ni jina la mahali, kwa hiyo limetoholewa katika matini kuu. Maana inayowezekana ya vipashio vyake imehifadhiwa katika tanbihi.
