  text: הַ/קַּ֖יִן גִּבְעָ֣ה וְ/תִמְנָ֑ה עָרִ֥ים עֶ֖שֶׂר וְ/חַצְרֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/057.yaml
  text: 'Hak-kain[a], Gibeah, and Timnah: ten cities with their settlements.'
translation:
  language: sw
  text: Hakaini, Gibea na Timna—jumla ya miji kumi, pamoja na makazi yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vijiji vyake.” Neno la Kiebrania linamaanisha makazi madogo yaliyotegemea miji iliyotajwa au yaliyohusishwa nayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקַּיִן
  choice: Hakaini
  rationale: Ni jina la mahali. Umbo hili la unukuzi linahifadhi kiambishi הַ־ kama sehemu ya jina katika orodha hii, badala ya kukitafsiri kama kibainishi cha kawaida.
- source_word: גִּבְעָה
  choice: Gibea
  rationale: Katika orodha ya miji, neno hili ni jina la mahali, hivyo limenukuliwa badala ya kutafsiriwa kwa maana yake ya kawaida, ‘kilima.’
- source_word: תִמְנָה
  choice: Timna
  rationale: Ni jina la mahali katika orodha ya maeneo ya urithi; umbo la Kiswahili ‘Timna’ ni la asili na rahisi kusomeka.
- source_word: עָרִים עֶשֶׂר
  choice: jumla ya miji kumi
  rationale: Hii ni kauli ya muhtasari inayotaja idadi ya maeneo ya mijini yaliyoorodheshwa. ‘Miji’ ni tafsiri ya kawaida na inayofaa ya עָרִים hapa.
- source_word: חַצְרֵיהֶן
  choice: makazi yake
  rationale: Neno חָצֵר hapa linamaanisha makazi madogo yaliyohusishwa na miji iliyotajwa. ‘Makazi’ ni pana na ya kawaida katika Kiswahili, bila kulazimisha aina maalumu ya kijiji.
