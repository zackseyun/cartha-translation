translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Kistari kimetumiwa kuonyesha kuwa kauli inayofuata ni muhtasari wa idadi ya miji katika kundi hili.
