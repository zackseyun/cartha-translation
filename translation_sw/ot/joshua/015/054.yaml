base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/054.yaml
  text: 'Humtah[a], Kiriath-arba (that is, Hebron)[b], and Zior: nine cities with their settlements.'
translation:
  language: sw
  text: 'Humta, Kiriath-arba[a] (yaani, Hebroni), na Siori: miji tisa pamoja na makazi yake[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno ya Kiebrania, “Kiriath-arba, hiyo ndiyo Hebroni,” yanabainisha kwamba jina la zamani Kiriath-arba ni Hebroni.
    reason: cross_reference
  - marker: b
    text: Au “vijiji vyake.” Neno la Kiebrania linaweza kumaanisha makazi madogo yaliyohusishwa na miji iliyoorodheshwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻמְטָה
  choice: Humta
  rationale: Ni jina la mahali; limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: קִרְיַת אַרְבַּע
  choice: Kiriath-arba
  rationale: Ni jina ambatani la mahali. Limeandikwa kwa unukuzi badala ya kutafsiriwa kama ‘Mji wa Arba,’ kwa kuwa hapa linatumika kama jina rasmi.
- source_word: הִיא חֶבְרוֹן
  choice: yaani, Hebroni
  rationale: Kiwakilishi na jina vinabainisha kwamba Kiriath-arba ni jina la Hebroni; ‘yaani’ huwasilisha ufafanuzi huo kwa Kiswahili cha kawaida.
- source_word: צִיעֹר
  choice: Siori
  rationale: Ni jina la mahali; limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili.
- source_word: עָרִים תֵּשַׁע
  choice: miji tisa
  rationale: עָרִים ni neno la kawaida kwa miji au miji midogo; ‘miji’ linafaa katika orodha hii ya maeneo.
- source_word: חַצְרֵיהֶן
  choice: makazi yake
  rationale: Katika orodha za ugawaji wa ardhi, neno hili linaweza kumaanisha vijiji au makazi madogo yaliyo chini ya miji iliyotajwa. ‘Makazi’ halibani maana kwa aina moja tu ya eneo.
