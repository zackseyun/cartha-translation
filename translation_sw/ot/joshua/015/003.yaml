  text: וְ֠/יָצָא אֶל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה וְ/עָלָ֥ה מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/עָבַ֤ר חֶצְרוֹן֙ וְ/עָלָ֣ה אַדָּ֔רָ/ה וְ/נָסַ֖ב הַ/קַּרְקָֽעָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/003.yaml
  text: Then it went out southward to the ascent of Akrabbim[a], crossed over to Zin, went up from the south to Kadesh-barnea, crossed over Hezron, went up to Addar[b], and turned toward Karka.
translation:
  language: sw
  text: Kisha mpaka huo ukaelekea upande wa kusini hadi mwinuko wa Akrabimu[a], ukapita hadi Sini, ukapanda kutoka kusini kuelekea Kadeshi-barnea, ukapita Hesroni, ukapanda hadi Adari, kisha ukageuka kuelekea Karka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda Akrabimu linamaanisha “nge”; jina la Kiebrania limetoholewa kwa sababu hapa ni jina la mahali.
    reason: lexical_alternative
  - marker: b
    text: Au, “kuelekea Karkaa”; tahajia ya jina hili la mahali haijulikani kwa uhakika.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָא
  choice: mpaka huo ukaelekea
  rationale: Katika maelezo ya mipaka, kitenzi hiki kinaonyesha mstari wa mpaka ukiendelea kutoka sehemu iliyotangulia. Kutaja wazi “mpaka huo” hufanya Kiswahili kiwe cha kawaida bila kupoteza picha ya mwendo.
- source_word: אֶל מִנֶּגֶב
  choice: upande wa kusini
  rationale: Kirai hiki kinaonyesha mwelekeo wa mpaka kuelekea kusini.
- source_word: לְמַעֲלֵה עַקְרַבִּים
  choice: hadi mwinuko wa Akrabimu
  rationale: מַעֲלֵה ni njia au sehemu ya kupandia. “Mwinuko” huhifadhi wazo la kupanda, na Akrabimu limetoholewa kama jina la mahali.
- source_word: וְעָבַר צִנָה
  choice: ukapita hadi Sini
  rationale: עבר katika maelezo ya mpaka huonyesha mpaka ukipita au kuvuka kuelekea mahali fulani; צִנָה lina kiambishi cha mwelekeo.
- source_word: וְעָלָה מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: ukapanda kutoka kusini kuelekea Kadeshi-barnea
  rationale: Tafsiri hii huhifadhi kwa karibu mwendo unaoonyeshwa na מִן (“kutoka”) na לְ (“kuelekea”), bila kubadili kirai kuwa tu eneo lililo kusini mwa Kadeshi-barnea.
- source_word: חֶצְרוֹן
  choice: Hesroni
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: וְעָלָה אַדָּרָה
  choice: ukapanda hadi Adari
  rationale: Kitenzi kinaonyesha kupanda, na kiambishi cha mwisho katika jina kinaonyesha mwelekeo kuelekea Adari.
- source_word: וְנָסַב הַקַּרְקָעָה
  choice: ukageuka kuelekea Karka
  rationale: נסב huonyesha mpaka ukibadili mwelekeo, na kiambishi cha mwelekeo katika הַקַּרְקָעָה kinafaa kutafsiriwa “kuelekea,” bila kudai kwamba mpaka uliishia hapo.
