  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עָלָ֨ה הַ/גְּב֜וּל גֵּ֣י בֶן הִנֹּ֗ם אֶל כֶּ֤תֶף הַ/יְבוּסִי֙ מִ/נֶּ֔גֶב הִ֖יא יְרֽוּשָׁלִָ֑ם וְ/עָלָ֨ה הַ/גְּב֜וּל אֶל רֹ֣אשׁ הָ/הָ֗ר אֲ֠שֶׁר עַל פְּנֵ֤י גֵֽי הִנֹּם֙ יָ֔מָּ/ה אֲשֶׁ֛ר בִּ/קְצֵ֥ה עֵֽמֶק רְפָאִ֖ים צָפֹֽנָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/008.yaml
  text: Then the border went up by the Valley of Ben-hinnom to the slope of the Jebusite on the south (that is[a], Jerusalem), and the border went up to the top of the mountain that lies west of the Valley of Hinnom[c][b], at the northern end of the Valley of Rephaim.
translation:
  language: sw
  text: Kisha mpaka ukapanda kupitia Bonde la Ben-Hinomu hadi kwenye mteremko wa Myebusi upande wa kusini (yaani, Yerusalemu)[a]. Mpaka ukaendelea kupanda hadi kilele cha mlima ulio upande wa magharibi[b] wa Bonde la Hinomu, kwenye ncha ya kaskazini ya Bonde la Warefai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hilo ndilo Yerusalemu.” Kiebrania hulitambulisha eneo la Myebusi kuwa Yerusalemu.
    reason: alternative_reading
  - marker: b
    text: 'Kiebrania: “kuelekea baharini,” nahau ya kawaida inayomaanisha upande wa magharibi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה
  choice: Kisha ... ukapanda / ukaendelea kupanda
  rationale: Katika maelezo ya mipaka, kitenzi hiki husimulia mwendo wa mstari wa mpaka kuelekea sehemu ya juu; Kiswahili hiki ni cha kawaida na huhifadhi mfuatano na mwelekeo.
- source_word: הַגְּבוּל
  choice: mpaka
  rationale: Katika muktadha wa ugawaji wa nchi, neno hili humaanisha mstari unaotenganisha maeneo.
- source_word: גֵּי בֶן הִנֹּם
  choice: Bonde la Ben-Hinomu
  rationale: Jina limedumishwa kama jina maalumu la mahali badala ya kutafsiriwa kikamilifu kuwa ‘mwana wa Hinomu.’
- source_word: כֶּתֶף
  choice: mteremko
  rationale: Ingawa maana ya msingi ni ‘bega,’ katika jiografia neno hili hueleza ubavu au mteremko wa kilima.
- source_word: הַיְבוּסִי
  choice: Myebusi
  rationale: Huhifadhi rejeo la Kiebrania kwa Myebusi au eneo lake, huku kifungu kinachofuata kikilitambulisha kuwa Yerusalemu.
- source_word: מִנֶּגֶב
  choice: upande wa kusini
  rationale: Katika maelezo haya ya kijiografia, kifungu kinaonyesha upande wa kusini wa mteremko au eneo la Myebusi.
- source_word: הִיא יְרוּשָׁלִָם
  choice: yaani, Yerusalemu
  rationale: Kiwakilishi pamoja na jina la mahali kinafanya kazi ya kulitambulisha eneo lililotajwa; ‘yaani’ huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: רֹאשׁ הָהָר
  choice: kilele cha mlima
  rationale: Hii ni tafsiri ya kawaida na wazi ya nahau inayomaanisha sehemu ya juu zaidi ya mlima.
- source_word: אֲשֶׁר עַל פְּנֵי גֵי הִנֹּם יָמָּה
  choice: ulio upande wa magharibi wa Bonde la Hinomu
  rationale: Muundo unaonyesha mahali mlima ulipo kuhusiana na bonde; יָמָּה, kihalisi ‘kuelekea baharini,’ ni nahau ya kawaida ya ‘magharibi.’
- source_word: בִּקְצֵה עֵמֶק רְפָאִים צָפֹנָה
  choice: kwenye ncha ya kaskazini ya Bonde la Warefai
  rationale: Huwasilisha kwa kawaida kwamba mlima uko kwenye mwisho au ukingo wa kaskazini wa bonde hilo.
- source_word: עֵמֶק רְפָאִים
  choice: Bonde la Warefai
  rationale: ‘Warefai’ limedumishwa kama jina la kundi linalounda jina la mahali, bila kulipa maana ya kiteolojia au kifasiri isiyolazimishwa na muktadha.
theological_decisions:
- issue: Utambulisho wa eneo la Myebusi na Yerusalemu
  choice: yaani, Yerusalemu
  alternative: hilo ndilo Yerusalemu
  rationale: Kiebrania kinaweza kusomwa kama maelezo ya utambulisho. Tafsiri kuu inaleta kazi hiyo ya kiambatisho kwa ufasaha, huku tanbihi ikihifadhi uwezekano wa kauli iliyo wazi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina ya mahali yametoholewa kwa maumbo yanayotambulika katika mapokeo ya Biblia ya Kiswahili. Sentensi zimegawanywa mara mbili ili maelezo marefu ya mpaka yasomeke vizuri bila kupoteza mfuatano wa Kiebrania.
