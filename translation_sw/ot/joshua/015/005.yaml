  yaml_path: translation/ot/joshua/015/005.yaml
  text: And the eastern border was the Salt Sea, as far as the mouth of the Jordan. And the border on the north side was from the tongue of the sea, from the mouth of the Jordan.
translation:
  language: sw
  text: Mpaka wa mashariki ulikuwa Bahari ya Chumvi hadi kwenye mdomo wa Yordani. Mpaka wa upande wa kaskazini ulianzia kwenye ulimi wa bahari, kwenye mdomo wa Yordani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָם הַמֶּלַח
  choice: Bahari ya Chumvi
  rationale: Ni tafsiri ya moja kwa moja na jina la kijiografia linaloeleweka katika Kiswahili sanifu.
- source_word: קְצֵה הַיַּרְדֵּן
  choice: mdomo wa Yordani
  rationale: Ingawa קצה kwa kawaida humaanisha ‘mwisho’ au ‘ukingo,’ hapa muktadha wa kijiografia unaonyesha mahali Mto Yordani unapoingia katika Bahari ya Chumvi; ‘mdomo’ huwasilisha jambo hilo kwa lugha ya kawaida.
- source_word: לְשׁוֹן הַיָּם
  choice: ulimi wa bahari
  rationale: Inahifadhi taswira halisi ya Kiebrania kuhusu sehemu nyembamba ya bahari inayoingia nchi kavu, bila kubainisha zaidi umbo la eneo kuliko chanzo.
- source_word: לִפְאַת צָפוֹנָה
  choice: upande wa kaskazini
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha upande au pembe ya kaskazini wa mpaka.
