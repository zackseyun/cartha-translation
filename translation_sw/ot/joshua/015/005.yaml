translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo wa sentensi mbili na urudiaji wa ‘mdomo wa Yordani’ umehifadhiwa ili kufuata maelezo ya mipaka katika chanzo.
