translation:
  language: sw
  text: na Shaaraimu[a], na Adithaimu, na Gedera, na Gederothaimu—miji kumi na minne na vijiji vyake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wafafanuzi fulani wanaona kwamba majina manne ya mahali yaliyotajwa katika mstari huu hayalingani kwa wazi na jumla iliyosemwa ya “miji kumi na minne.” Huenda historia ya maandishi ya sehemu hii kubwa ikaeleza tofauti hiyo, lakini hapa maandishi ya Kiebrania yametafsiriwa kama yalivyo.
    reason: textual_variant
lexical_decisions:
- source_word: שַׁעֲרַיִם
  choice: Shaaraimu
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili huku likihifadhi umbo la Kiebrania.
- source_word: עֲדִיתַיִם
  choice: Adithaimu
  rationale: Jina la mahali limetoholewa, si kutafsiriwa, na kupewa irabu ya mwisho ili litamkike kwa urahisi katika Kiswahili.
- source_word: הַגְּדֵרָה
  choice: Gedera
  rationale: Neno ni jina la mahali; kibainishi cha Kiebrania hakiongezwi kama neno tofauti kwa kuwa matumizi ya kawaida ya Kiswahili hayahitaji 'ile' mbele ya jina hili.
- source_word: גְדֵרֹתָיִם
  choice: Gederothaimu
  rationale: Jina la mahali limetoholewa moja kwa moja katika umbo linalofaa matamshi ya Kiswahili.
- source_word: עָרִים
  choice: miji
  rationale: Katika orodha ya maeneo, עִיר humaanisha makazi makuu ya kiutawala; 'miji' ni neno la kawaida na linaloeleweka.
- source_word: אַרְבַּע עֶשְׂרֵה
  choice: kumi na minne
  rationale: Idadi imetafsiriwa kwa upatanisho wa kawaida wa Kiswahili na nomino 'miji'.
- source_word: חַצְרֵיהֶן
  choice: vijiji vyake
  rationale: Katika orodha za mgao wa ardhi, neno hili hurejelea vijiji au makazi madogo yaliyotegemea miji iliyotajwa; 'vijiji vyake' ni tafsiri ya asili na wazi.
