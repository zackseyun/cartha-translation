  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mtiririko wa usimulizi na tofauti ndogo kati ya shambulio na kutekwa kwa mji. Alama ya tanbihi [a] imewekwa baada ya kitenzi cha kusema ili kufuata safu ya mashauriano ya Kiingereza.
