base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/016.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him Achsah my daughter as a wife.”
translation:
  language: sw
  text: Kalebu akasema[a], “Yeyote atakayeushambulia Kiriath-seferi na kuuteka, nitampa Aksa binti yangu awe mke wake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yule atakayeushambulia Kiriath-seferi na kuuteka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Muundo wa kawaida wa usimulizi unaoendeleza tukio linalofuata; ‘akasema’ ni wa asili katika Kiswahili na huhifadhi mtiririko huo.
- source_word: כָּלֵב
  choice: Kalebu
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: אֲשֶׁר
  choice: yeyote atakaye-
  rationale: Kiwakilishi hiki kinaanzisha kishazi cha uhusiano kisichomtaja mtu maalumu; ‘yeyote atakaye-’ huwasilisha mwito ulio wazi kwa mtu yeyote.
- source_word: יַכֶּה
  choice: atakayeushambulia
  rationale: Hiphili ya נכה ina maana ya kupiga au kushambulia; katika muktadha wa kijeshi dhidi ya mji, ‘kuushambulia’ ni ya kawaida na haidai kwamba ushindi tayari umepatikana.
- source_word: אֶת קִרְיַת סֵפֶר
  choice: Kiriath-seferi
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa; sehemu ya ‘mji wa’ inabaki ndani ya jina lenyewe.
- source_word: וּלְכָדָהּ
  choice: na kuuteka
  rationale: לכד katika muktadha wa kijeshi humaanisha kuteka; kiambishi ‘u-’ kinarejelea mji.
- source_word: וְנָתַתִּי לוֹ
  choice: nitampa
  rationale: Huonyesha ahadi ya Kalebu na mpokeaji wa kiume kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: עַכְסָה
  choice: Aksa
  rationale: Jina la mtu limetoholewa kwa muundo unaosomeka kwa urahisi katika Kiswahili.
- source_word: בִתִּי
  choice: binti yangu
  rationale: Huhifadhi wazi uhusiano wa kifamilia uliotajwa katika Kiebrania.
- source_word: לְאִשָּׁה
  choice: awe mke wake
  rationale: Ni usemi wa asili wa Kiswahili unaoeleza kumpa mwanamke katika ndoa; ‘wake’ humrejelea mpokeaji aliyekwishaonyeshwa na ‘nitampa’.
