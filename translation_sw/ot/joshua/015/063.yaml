reference: Joshua 15:63
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֶת הַ/יְבוּסִי֙ יוֹשְׁבֵ֣י יְרֽוּשָׁלִַ֔ם לֹֽא יוכלו בְנֵֽי יְהוּדָ֖ה לְ/הֽוֹרִישָׁ֑/ם וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י יְהוּדָה֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/063.yaml
  text: But the sons of Judah could not dispossess the Jebusites[a], the inhabitants of Jerusalem, so the Jebusites have lived with the sons of Judah in Jerusalem to this day.
translation:
  language: sw
  text: Lakini wazao wa Yuda hawakuweza kuwafukuza[a] Wayebusi, waliokuwa wakikaa Yerusalemu. Kwa hiyo, Wayebusi wameendelea kuishi pamoja na wazao wa Yuda huko Yerusalemu mpaka leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwanyang’anya milki yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Lakini
  rationale: Kiunganishi pamoja na alama ya yambwa kinaanzisha tofauti na maelezo yaliyotangulia kuhusu mgao wa nchi; “Lakini” huwasilisha nguvu hiyo ya kimuktadha kwa Kiswahili cha kawaida.
- source_word: הַיְבוּסִי
  choice: Wayebusi
  rationale: Ingawa neno la Kiebrania liko katika umoja wa kisarufi, hapa ni jina la kikundi cha watu kwa maana ya jumla; Kiswahili hutumia umbo la wingi “Wayebusi.”
- source_word: יוֹשְׁבֵי יְרוּשָׁלַם
  choice: waliokuwa wakikaa Yerusalemu
  rationale: Muundo wa kivumishi-tendo unawatambulisha Wayebusi kuwa wakazi wa Yerusalemu; tafsiri hii ni ya asili na inaonyesha hali iliyokuwapo wakati huo.
- source_word: לֹא יוכלו
  choice: hawakuweza
  rationale: Kitenzi kinaonyesha kutoweza katika simulizi la wakati uliopita; “hawakuweza” ni sahihi na ya kawaida.
- source_word: בְנֵי יְהוּדָה
  choice: wazao wa Yuda
  rationale: Usemi huu wa kifamilia unamaanisha washiriki wa kabila waliotokana na Yuda. “Wazao wa Yuda” huhifadhi uhusiano wa nasaba bila kudokeza kwamba wanaume pekee ndio wanaokusudiwa.
- source_word: לְהוֹרִישָׁם
  choice: kuwafukuza
  rationale: Katika muktadha wa kuitwaa nchi, Hifili ya ירשׁ humaanisha kuwafanya wakaaji waondoke na kupoteza milki yao. “Kuwafukuza” ni wazi na ya kawaida kwa wasomaji wa Kiswahili, ingawa wazo la kuwanyang’anya milki limo ndani ya maana.
- source_word: וַיֵּשֶׁב
  choice: wameendelea kuishi
  rationale: Pamoja na “mpaka leo,” kitenzi kinaeleza hali iliyoanza zamani na kuendelea hadi wakati wa msimulizi; “wameendelea kuishi” huonyesha mwendelezo huo.
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: pamoja na wazao wa Yuda
  rationale: Muundo wa Kiebrania si wa kawaida baada ya kitenzi “kuishi,” lakini muktadha unaonyesha kuishi kwa pamoja. “Pamoja na” huhifadhi maana hiyo bila kufafanua kupita kiasi aina ya uhusiano wao.
- source_word: בִּירוּשָׁלַם
  choice: huko Yerusalemu
  rationale: Ni tafsiri ya mahali; “huko” husaidia kurejelea Yerusalemu iliyotajwa tayari.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba hali iliendelea hadi wakati wa msimulizi.
theological_decisions:
- issue: Tafsiri ya בְנֵי יְהוּדָה
  choice: wazao wa Yuda
  alternative: wana wa Yuda; watu wa Yuda; kabila la Yuda
  rationale: “Wazao wa Yuda” huhifadhi taswira ya nasaba ya Kiebrania na wakati huohuo huonyesha kwamba kabila kwa jumla ndilo linalokusudiwa, si wanaume binafsi tu.
- issue: Maana ya kishazi וַיֵּשֶׁב ... אֶת בְּנֵי יְהוּדָה
  choice: Wayebusi wameendelea kuishi pamoja na wazao wa Yuda
  alternative: Wayebusi waliishi miongoni mwa wazao wa Yuda; Wayebusi waliishi kando ya wazao wa Yuda
  rationale: Kiebrania kina muundo usio wa kawaida, lakini muktadha unaunga mkono maana ya makundi hayo kuishi katika eneo moja. “Pamoja na” haidai zaidi ya maandishi kuhusu hali ya uhusiano wao.
- issue: Maana ya לְהוֹרִישָׁם katika simulizi la kuitwaa nchi
  choice: kuwafukuza
  alternative: kuwanyang’anya milki; kuwaondoa
  rationale: Neno linaweza kusisitiza kuwaondoa wakaaji kutoka katika milki yao. “Kuwafukuza” huwasilisha matokeo yanayokusudiwa kwa lugha wazi bila kuongeza sababu ya kushindwa kwa Yuda.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi mbili zimetumiwa kwa usomaji wa kawaida; “Kwa hiyo” huonyesha matokeo ya kushindwa kuwafukuza. Jina la kikundi “Wayebusi” limetumiwa kwa wingi ingawa Kiebrania kina umoja wa kijumla.
