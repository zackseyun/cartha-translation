  text: and Dannah[a], and Kiriath-sannah (that is, Debir),
translation:
  language: sw
  text: na Dana, na Kiriath-sana (yaani, Debiri),
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַנָּה
  choice: Dana
  rationale: Jina la mahali limetoholewa kwa tahajia ya Kiswahili badala ya kutafsiriwa.
- source_word: קִרְיַת סַנָּה
  choice: Kiriath-sana
  rationale: Jina ambatani la mahali limetoholewa; sehemu ya kwanza imehifadhiwa kama sehemu ya jina maalumu, badala ya kutafsiriwa kuwa ‘mji wa’.
- source_word: הִיא
  choice: yaani
  rationale: Katika utambulisho huu wa jina moja la mahali kwa jina jingine, ‘yaani’ huonyesha usawa wa majina kwa Kiswahili cha kawaida na wazi.
- source_word: דְבִר
  choice: Debiri
  rationale: Jina la mahali limetoholewa kwa muundo unaosomeka kiasili katika Kiswahili; hapa ni jina jingine la Kiriath-sana.
- source_word: וְ
  choice: na
  rationale: Kiunganishi kimehifadhiwa ili kudumisha muundo wa orodha ya miji.
