translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa heshima, wa sasa, na unaoeleweka kwa urahisi. Majina yamewasilishwa kwa maumbo yanayosomeka kiasili katika Kiswahili, huku tofauti kati ya misemo miwili ya ukoo ikihifadhiwa katika matini na kufafanuliwa katika tanbihi.
