  source_fidelity: 'Matini inafuata kwa uaminifu mpangilio na maana ya Kiebrania: Kalebu ndiye mtenda; וַיֹּרֶשׁ imetafsiriwa kwa kawaida kama “akawafukuza”; מִשָּׁם ni “kutoka huko”; na watu watatu wametajwa kwa majina. “Wana watatu wa Anaki” huhifadhi בני הענק, na “wazao wa Anaki” hutafsiri kwa kawaida יְלִידֵי הָעֲנָק bila kudai kwamba Anaki alikuwa baba yao wa moja kwa moja. Tofauti ya misemo miwili ya ukoo imehifadhiwa na kufafanuliwa katika tanbihi.'
