  terminology: “Anaki” ni umbo linalotambulika katika Kiswahili cha kibiblia. “Wana” na “wazao” ni chaguo linalofaa kwa misemo ya ukoo; tanbihi inaweka wazi kwamba Kiebrania cha mwisho ni kwa karibu “waliozaliwa na Anaki.” Tanbihi ya kwanza inatoa mbadala halali wa kimsamiati wa Hifili ya ירשׁ bila kubadilisha maana ya matini.
