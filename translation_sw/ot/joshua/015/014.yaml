base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/014.yaml
  text: 'And Caleb drove out from there the three sons of Anak: Sheshai[a], Ahiman, and Talmai[b], the children of Anak.'
translation:
  language: sw
  text: 'Kalebu akawafukuza[a] kutoka huko wana watatu wa Anaki: Sheshai, Ahimani, na Talmai, ambao walikuwa wazao wa Anaki.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawanyang’anya milki.” Kitenzi cha Kiebrania kinaweza kusisitiza kuitwaa milki kwa kuwafukuza waliokuwa wakiikalia.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina “wana wa Anaki” kisha “waliozaliwa na Anaki.” Misemo hiyo miwili inayohusiana inaeleza ukoo wa watu hao hao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרֶשׁ
  choice: akawafukuza
  rationale: Kitenzi ירשׁ katika Hifili hapa kina maana ya kuwafanya wenyeji waondoke au wapoteze milki yao. Kwa kuwa watendwa ni watu, “akawafukuza” ni Kiswahili cha kawaida na kinachofaa katika muktadha wa kuitwaa nchi.
- source_word: מִשָּׁם
  choice: kutoka huko
  rationale: Huu ni ufasiri wa moja kwa moja na wa kawaida wa kirai cha mahali.
- source_word: שְׁלוֹשָׁה בְּנֵי הָעֲנָק
  choice: wana watatu wa Anaki
  rationale: “Wana” huhifadhi usemi wa ukoo wa Kiebrania בְּנֵי, badala ya kuufasiri moja kwa moja kuwa jina la kabila.
- source_word: שֵׁשַׁי
  choice: Sheshai
  rationale: Unukuzi wa jina la mtu unaofuata kwa karibu umbo la Kiebrania.
- source_word: אֲחִימַן
  choice: Ahimani
  rationale: Umbo la jina linalosomeka kwa kawaida katika Kiswahili huku likihifadhi jina la Kiebrania.
- source_word: תַּלְמַי
  choice: Talmai
  rationale: Unukuzi wa jina la mtu unaofuata kwa karibu umbo la Kiebrania.
- source_word: יְלִידֵי הָעֲנָק
  choice: wazao wa Anaki
  rationale: Neno יְלִידֵי humaanisha waliozaliwa na mtu au walio wa ukoo wake. “Wazao” linaeleza uhusiano huo kwa Kiswahili cha kawaida bila kulazimisha kwamba hawa walikuwa wana wa moja kwa moja.
