lexical_decisions:
- source_word: זָנוֹחַ
  choice: Zanoa
  rationale: Ni jina la mahali katika orodha ya miji; limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili badala ya kutafsiriwa.
- source_word: עֵין גַּנִּים
  choice: En-ganimu
  rationale: Ni jina ambatani la mahali, linalotokana na maneno ya Kiebrania yanayomaanisha “chemchemi” na “bustani.” Katika matini kuu limetoholewa kama jina, huku maana yake ikielezwa katika tanbihi.
- source_word: תַּפּוּחַ
  choice: Tapua
  rationale: Hapa neno hili linafanya kazi kama jina la mahali. Limetoholewa, ingawa neno la msingi la Kiebrania linaweza pia kumaanisha tofaa au aina ya mti wa matunda.
- source_word: הָעֵינָם
  choice: Enamu
  rationale: Ni jina la mahali lenye kibainishi cha Kiebrania kilichoambatanishwa. Limetoholewa kama jina maalumu, na maana inayoweza kuwa nyuma ya muundo huo imewekwa katika tanbihi.
