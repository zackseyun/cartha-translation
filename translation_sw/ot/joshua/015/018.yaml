translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. “Mume wake” limeongezwa ili kubainisha rejea ya kiwakilishi cha kiume kwa mujibu wa muktadha wa karibu, bila kutaja jina ambalo halimo katika mstari huu.
