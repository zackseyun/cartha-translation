  yaml_path: translation/ot/joshua/015/018.yaml
  text: And when she came[a], she urged him to ask her father for a field. Then she got down from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: sw
  text: Alipofika, akamshawishi[a] amwombe baba yake shamba. Kisha akashuka kutoka kwa punda,[b] naye Kalebu akamuuliza, “Unataka nini?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akamhimiza” au, kwa maana hasi zaidi, “akamchochea.”
    reason: lexical_alternative
  - marker: b
    text: Au “akashuka kutoka kwa punda”; kitenzi cha Kiebrania huenda kikadokeza kushuka kwa ghafla.
    reason: lexical_alternative
  - marker: c
    text: Nahau ya Kiebrania ni, kwa tafsiri halisi, “Nini kwako?” Inaweza kumaanisha “Unataka nini?” au “Una shida gani?”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: alipofika
  rationale: Muundo wa ב pamoja na kitenzi-jina na kiambishi cha nafsi ya tatu ya kike unaonyesha wakati. “Alipofika” ni Kiswahili cha kawaida na hakitaji mahali ambapo hakuelezwi katika Kiebrania.
- source_word: וַתְּסִיתֵהוּ
  choice: akamhimiza
  rationale: Kitenzi סות kinaweza kumaanisha kuchochea, kushawishi, au kuhimiza. Katika muktadha huu wa ombi la kifamilia, “akamhimiza” huonyesha msukumo wake bila kulazimisha maana hasi.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ שָׂדֶה
  choice: amwombe baba yake shamba
  rationale: שאל hapa ni kuomba kitu kutoka kwa mtu. Muundo “amwombe baba yake shamba” ni wa asili katika Kiswahili na unahifadhi shamba kama kitu kilichoombwa.
- source_word: שָׂדֶה
  choice: shamba
  rationale: שָׂדֶה kwa kawaida humaanisha shamba au kipande cha ardhi. “Shamba” ni tafsiri ya moja kwa moja na inayoeleweka.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: akashuka kutoka juu ya punda
  rationale: צנח inaweza kudokeza kushuka kwa ghafla, lakini katika simulizi tendo kuu ni kushuka kutoka juu ya punda. Tanbihi huhifadhi uwezekano wa mwendo wa haraka.
- source_word: מַה לָּךְ
  choice: Unataka nini?
  rationale: Nahau hii ni halisi “Kuna nini kwako?” na inaweza kuuliza mtu anataka nini au ana tatizo gani. Muktadha wa ombi linalofuata unaunga mkono “Unataka nini?”
