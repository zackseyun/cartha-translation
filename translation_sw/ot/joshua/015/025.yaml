lexical_decisions:
- source_word: וְ/חָצוֹר
  choice: na Hazori
  rationale: Kiunganishi וְ kimetafsiriwa “na,” na jina la mahali חָצוֹר limeandikwa “Hazori,” kwa mtindo unaosomeka kwa kawaida katika Kiswahili.
- source_word: חֲדַתָּה
  choice: -hadata
  rationale: Neno hili limechukuliwa kuwa sehemu ya jina ambatani “Hazori-hadata,” kulingana na mgawanyo wa lafudhi katika maandishi ya Kiebrania; limetoholewa badala ya kutafsiriwa “mpya” kwa sababu hapa linafanya kazi kama kipengele cha jina la mahali.
- source_word: וּ/קְרִיּוֹת
  choice: na Kerioth
  rationale: Katika orodha hii ya miji, קְרִיּוֹת linaeleweka vizuri zaidi kama jina la mahali kuliko nomino ya kawaida “miji.” Tahajia “Kerioth” huhifadhi utambulisho wa jina.
- source_word: חֶצְרוֹן
  choice: -hezroni
  rationale: Limeunganishwa na jina lililotangulia kuwa jina ambatani “Kerioth-hezroni.” Irabu ya mwisho imetumiwa ili jina lisomeke kwa urahisi katika Kiswahili.
- source_word: הִיא
  choice: yaani
  rationale: Kiwakilishi hiki kinaanzisha ufafanuzi wa jina lililotangulia. “Yaani” ni ya kawaida na huhifadhi maana ya utambulisho wa kiambatisho.
- source_word: חָצוֹר
  choice: Hazori
  rationale: Jina la mwisho linamtambulisha mji uliotajwa kabla yake na limetoholewa kwa namna ileile kama jina la kwanza.
