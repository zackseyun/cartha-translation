  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda ikawa, “Hazori, Hadata, na Kerioth-Hezroni (yaani Hazori),” ikiwa חֲדַתָּה linaeleweka kuwa jina la mji tofauti badala ya kuwa sehemu ya jina ambatani “Hazori-Hadata.”
    reason: alternative_reading
