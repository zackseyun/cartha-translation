base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/060.yaml
  text: 'Kiriath-baal (that is[a], Kiriath-jearim), and Rabbah: two cities with their settlements.'
translation:
  language: sw
  text: Kiriath-Baali (yaani Kiriath-Yearimu), na Raba—miji miwili pamoja na vijiji vyao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִרְיַת בַּעַל
  choice: Kiriath-Baali
  rationale: Ni jina la mahali; limetoholewa badala ya kutafsiriwa kuwa “Mji wa Baali,” ili lihifadhiwe kama jina maalumu.
- source_word: הִיא
  choice: yaani
  rationale: Kiwakilishi hiki kinatumika kufafanua kwamba Kiriath-Baali ni jina jingine la Kiriath-Yearimu.
- source_word: קִרְיַת יְעָרִים
  choice: Kiriath-Yearimu
  rationale: Ni jina maalumu la mahali, kwa hiyo limetoholewa; hapa linamtambulisha mji uleule uliotajwa kwa jina Kiriath-Baali.
- source_word: הָרַבָּה
  choice: Raba
  rationale: Ni jina la mahali. Kiarifu cha Kiebrania hakijahifadhiwa kama neno tofauti kwa kuwa si cha lazima katika matumizi ya kawaida ya majina ya mahali kwa Kiswahili.
- source_word: עָרִים שְׁתַּיִם
  choice: miji miwili
  rationale: Hii ni tafsiri ya kawaida na inayoeleweka ya muhtasari wa idadi ya miji iliyoorodheshwa.
- source_word: חַצְרֵיהֶן
  choice: vijiji vyake
  rationale: Katika orodha za maeneo, neno hili humaanisha vijiji au makazi madogo yaliyotegemea miji iliyotajwa. “Vyake” linarejelea kwa kawaida miji hiyo miwili kama kundi.
