lexical_decisions:
- source_word: יִזְרְעֶאל
  choice: Yezreeli
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Kiswahili na inayohifadhi umbo la Kiebrania kwa kiasi kinachowezekana.
- source_word: יָקְדְעָם
  choice: Yokdeamu
  rationale: Jina la mahali limetoholewa moja kwa moja; vokali ya mwisho husaidia matamshi ya kawaida ya Kiswahili bila kulitafsiri jina.
- source_word: זָנוֹחַ
  choice: Zanoa
  rationale: Jina la mahali limetoholewa kwa umbo linalotamkika kwa urahisi katika Kiswahili; konsonanti ya mwisho ya Kiebrania haiwakilishwi kama silabi tofauti.
- source_word: וְ
  choice: na
  rationale: Kiunganishi cha Kiebrania kinaunganisha majina katika orodha rahisi; katika Kiswahili koma na “na” kabla ya jina la mwisho ni muundo wa kawaida.
