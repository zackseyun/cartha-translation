base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/032.yaml
  text: and Lebaoth[a], Shilhim, Ain, and Rimmon—twenty-nine cities in all, with their villages.
translation:
  language: sw
  text: na Lebaothi, Shilhimu, Aini na Rimoni—jumla ya miji ishirini na tisa, pamoja na vijiji vyao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania lililotafsiriwa “vijiji” linaweza pia kutafsiriwa “makazi” au “vitongoji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבָאוֹת
  choice: na Lebaothi
  rationale: Ni jina la mahali katika orodha ya miji; limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, huku kiunganishi cha Kiebrania kikihifadhiwa.
- source_word: וְשִׁלְחִים
  choice: Shilhimu
  rationale: Ni jina la mahali; limetoholewa badala ya kutafsiriwa.
- source_word: וְעַיִן
  choice: Aini
  rationale: Katika muktadha huu ni jina la mji, si nomino ya kawaida yenye maana ya ‘jicho’ au ‘chemchemi’; kwa hiyo limetoholewa.
- source_word: וְרִמּוֹן
  choice: Rimoni
  rationale: Ni jina la mahali katika orodha hii; halijatafsiriwa kwa maana yake ya kawaida ya ‘komamanga’.
- source_word: כָּל עָרִים עֶשְׂרִים וָתֵשַׁע
  choice: jumla ya miji ishirini na tisa
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida na kwa uwazi jumla ya miji iliyoorodheshwa.
- source_word: וְחַצְרֵיהֶן
  choice: pamoja na vijiji vyao
  rationale: חָצֵר katika orodha za maeneo hurejelea vijiji au makazi madogo yaliyohusishwa na miji; ‘vijiji’ ni neno la kawaida na linaloeleweka kwa urahisi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Majina ya mahali yametoholewa kwa umbo linalofaa matamshi ya Kiswahili. Alama ya tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja, yaani “vijiji vyao.”
