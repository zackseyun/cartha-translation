- source_word: עֲנָב
  choice: Anabu
  rationale: Jina la mahali katika orodha ya miji; limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, huku konsonanti za Kiebrania zikiwakilishwa.
- source_word: אֶשְׁתְּמֹה
  choice: Eshtemo
  rationale: Jina la mahali; limetoholewa moja kwa moja kutoka umbo la Kiebrania אֶשְׁתְּמֹה. Irabu ya mwisho haijaongezwa kwa sababu he ya mwisho hapa si lazima iwakilishe silabi tofauti.
- source_word: עָנִים
  choice: Animu
  rationale: Ni jina la mahali, ingawa umbo lake linaonekana kama wingi; halijatafsiriwa kimaana. Irabu ya mwisho imeongezwa ili jina litamkike kwa urahisi katika Kiswahili.
- source_word: וְ
  choice: na
  rationale: Kiunganishi kinachounganisha majina katika orodha kimetafsiriwa kwa neno la kawaida la Kiswahili “na”.
