  yaml_path: translation/ot/joshua/015/002.yaml
  text: Their southern border was from the end of the Salt Sea[b][a], from the tongue that faces southward.
translation:
  language: sw
  text: Mpaka wao wa kusini ulianzia kwenye ncha ya Bahari ya Chumvi[a], kutoka kwenye ulimi unaoelekea kusini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Bahari ya Chumvi inayojulikana pia kama Bahari ya Mauti.
    reason: cross_reference
  - marker: b
    text: Kiebrania ni “ulimi,” istilahi ya kijiografia kwa ghuba au sehemu ya maji yenye umbo la ulimi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: wao ... ulianzia
  rationale: Muundo wa Kiebrania unaanzisha maelezo ya mpaka waliokuwa nao; Kiswahili cha umilikaji pamoja na kitenzi “ulianzia” kinaeleza kwa kawaida mahali mpaka ulipoanzia.
- source_word: גְּבוּל נֶגֶב
  choice: mpaka wao wa kusini
  rationale: Katika ugawaji wa nchi, גְּבוּל ni mpaka wa eneo, na נֶגֶב hapa inaonyesha upande wa kusini, si lazima jina maalumu la eneo la Negebu.
- source_word: מִקְצֵה
  choice: kwenye ncha ya
  rationale: Neno hili linaonyesha sehemu ya mwisho au ukingo wa mbali wa kitu; “ncha” ni usemi mfupi na wa kawaida katika maelezo ya kijiografia.
- source_word: יָם הַמֶּלַח
  choice: Bahari ya Chumvi
  rationale: Hili linahifadhi jina la Kiebrania moja kwa moja badala ya kulibadilisha katika jina la baadaye, Bahari ya Chumvi.
- source_word: מִן הַלָּשׁוֹן
  choice: katika ghuba
  rationale: Ingawa maana ya moja kwa moja ni “ulimi,” hapa ni istilahi ya kijiografia kwa sehemu ya maji yenye umbo la ulimi, yaani ghuba au mwendelezo wa maji unaoingia nchi kavu. “Ghuba” inaeleweka kwa urahisi katika Kiswahili; taswira ya Kiebrania imehifadhiwa katika tanbihi.
- source_word: הַפֹּנֶה נֶגְבָּה
  choice: inayoelekea kusini
  rationale: Kitenzi kishirikishi kinaonyesha mwelekeo wa sehemu hiyo ya kijiografia; “inayoelekea kusini” ni ya kawaida na inahifadhi maana ya uelekeo.
