translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. Muundo umetolewa kwa ulinganifu mwafaka, huku jina la asili “Bahari ya Chumvi” likidumishwa na taswira halisi ya “ulimi” ikielezwa katika tanbihi.
