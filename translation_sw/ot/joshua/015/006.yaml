base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/006.yaml
  text: Then the border went up to Beth-hoglah[a], and passed north of Beth-arabah; and the border went up to the stone of Bohan son of Reuben.
translation:
  language: sw
  text: Kisha mpaka ukapanda hadi Beth-hogla, ukapita kaskazini mwa Beth-araba; kisha mpaka ukapanda hadi kwenye jiwe la Bohani mwana wa Reubeni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה
  choice: ukapanda
  rationale: Katika maelezo ya mipaka, kitenzi hiki huonyesha mpaka ukiendelea kwenda juu kwa mwinuko au mwelekeo. “Ukapanda” ni cha kawaida na kinahifadhi ladha ya kijiografia.
- source_word: הַגְּבוּל
  choice: mpaka
  rationale: Neno hili hapa linamaanisha mstari unaotenga maeneo, si eneo lote.
- source_word: בֵּית חָגְלָה
  choice: Beth-hogla
  rationale: Jina la mahali limetoholewa kwa herufi za Kiswahili badala ya kutafsiriwa.
- source_word: וְעָבַר
  choice: ukapita
  rationale: Katika orodha hii ya mipaka, kitenzi kinaonyesha mstari wa mpaka ukiendelea kupita kando ya mahali fulani.
- source_word: מִצְּפוֹן לְבֵית הָעֲרָבָה
  choice: upande wa kaskazini wa Beth-araba
  rationale: Muundo huu wa maelezo ya mipaka unaonyesha mahali mpaka ulipopita ukilinganishwa na Beth-araba; tafsiri hii ni wazi na ya kawaida kwa Kiswahili.
- source_word: אֶבֶן בֹּהַן
  choice: jiwe la Bohani
  rationale: Muundo wa uhusiano wa nomino umehifadhiwa kwa njia ya kawaida katika Kiswahili.
- source_word: בֶּן רְאוּבֵן
  choice: mwana wa Reubeni
  rationale: Kiebrania kinasema wazi “mwana wa Reubeni”; tafsiri hii huepuka kubadili usemi huo kuwa “Mreubeni,” ambalo ni chaguo lenye ufafanuzi zaidi.
