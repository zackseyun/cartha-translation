translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na sentensi inayoeleweka kwa urahisi. Majina ya maeneo yametoholewa kwa uthabiti. Tanbihi ya Kiingereza haikuhamishwa kwa sababu imewekwa baada ya Beth-hoglah lakini maelezo yake yanahusu “jiwe la Bohani,” na katika Kiswahili badala hiyo haina tofauti ya maana inayohitaji tanbihi.
