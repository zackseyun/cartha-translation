lexical_decisions:
- source_word: לָכִישׁ
  choice: Lakishi
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili; umbo hili ni la kawaida katika Biblia za Kiswahili.
- source_word: בָצְקַת
  choice: Boskathi
  rationale: Jina la mji limetoholewa moja kwa moja kutoka umbo la Kiebrania בָצְקַת, huku sauti zake zikirekebishwa kwa mfumo wa Kiswahili.
- source_word: עֶגְלוֹן
  choice: Egloni
  rationale: Katika orodha hii neno linataja mji; jina limetoholewa kwa namna inayosomeka kwa Kiswahili bila kulitafsiri kama nomino ya kawaida.
- source_word: וּ / וְ
  choice: na
  rationale: Viunganishi vya Kiebrania vinaunganisha majina katika orodha rahisi ya miji; Kiswahili cha kawaida hutumia “na” kabla ya jina la mwisho.
