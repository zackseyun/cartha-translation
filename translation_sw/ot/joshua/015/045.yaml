lexical_decisions:
- source_word: עֶקְרוֹן
  choice: Ekroni
  rationale: Jina la mahali limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: וּבְנֹתֶיהָ
  choice: pamoja na miji yake
  rationale: Neno la Kiebrania linalomaanisha kihalisi ‘binti zake’ ni nahau ya miji au makazi madogo yaliyotegemea mji mkuu. ‘Miji yake’ huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku ‘pamoja na’ ikionyesha uhusiano wa kiunganishi katika orodha.
- source_word: וַחֲצֵרֶיהָ
  choice: na vijiji vyake
  rationale: Katika orodha za mgao wa nchi, neno hili humaanisha makazi madogo au vijiji vinavyohusishwa na mji; ‘vijiji’ ni neno wazi na la kawaida.
