  text: Ekroni[a], pamoja na miji yake na vijiji vyake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “na binti zake na vijiji vyake.” Hapa “binti” ni nahau ya Kiebrania inayomaanisha miji au makazi yaliyo chini ya mji mkubwa.
