  source_fidelity: 'Maana ya msingi imehifadhiwa: majina matatu ya mahali, jumla ya miji tisa, na makazi tegemezi yanayohusishwa nayo. Hata hivyo, kiambishi cha umilikaji katika tafsiri kinahitaji kurekebishwa ili kirejee miji ya wingi, kama ilivyo katika Kiebrania (חַצְרֵיהֶן, “vijiji/makazi yao”).'
