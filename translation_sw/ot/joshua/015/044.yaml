  yaml_path: translation/ot/joshua/015/044.yaml
  text: 'Keilah[a], Achzib, and Mareshah: nine cities with their villages.'
translation:
  language: sw
  text: Keila, Akzibu na Maresha—miji tisa pamoja na vijiji vyao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makazi yao.” Neno la Kiebrania linaweza kumaanisha makazi ya mashambani yanayohusishwa na miji hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְעִילָה
  choice: Keila
  rationale: Jina la mahali limenukuliwa kwa umbo la Kiswahili linalosomeka kwa urahisi.
- source_word: אַכְזִיב
  choice: Akzibu
  rationale: Jina la mahali limenukuliwa kwa kufuata sauti za Kiebrania huku likitumia tahajia ya kawaida ya Kiswahili.
- source_word: מָרֵאשָׁה
  choice: Maresha
  rationale: Jina la mahali limenukuliwa badala ya kutafsiriwa.
- source_word: עָרִים
  choice: miji
  rationale: Neno hili linamaanisha makazi ya mjini na linafaa katika orodha hii ya maeneo.
- source_word: תֵּשַׁע
  choice: tisa
  rationale: Namba ya kawaida inayoeleza jumla ya miji katika kundi hili.
- source_word: חַצְרֵיהֶן
  choice: vijiji vyake
  rationale: Neno hilo linarejelea makazi madogo ya mashambani yaliyohusishwa na miji hiyo; “vijiji” ni neno la kawaida na linaloeleweka katika Kiswahili cha sasa.
- source_word: וְ
  choice: na / pamoja na
  rationale: 'Viunganishi vimetolewa kwa mtiririko wa kawaida wa Kiswahili: “na” katika orodha ya majina, na “pamoja na” katika kishazi cha kuhitimisha.'
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. Alama ya mkato mrefu inaweka wazi kwamba “miji tisa” ni muhtasari wa kundi lote, huku “pamoja na vijiji vyake” ikihifadhi uhusiano wa makazi madogo na miji hiyo.
