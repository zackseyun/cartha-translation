  terminology: '“Miji,” “vijiji,” na uandishi wa majina Keila, Akzibu, na Maresha vinafaa. Maelezo ya chini ya ukurasa yarekebishwe pia: “yake” na “chini yake” ni ya umoja na hayatoi kwa usahihi wazo la makazi yanayohusishwa na miji.'
