  text: 'Goshen, Holon, and Giloh: eleven cities with their villages.'
translation:
  language: sw
  text: Gosheni, Holoni na Gilo—miji kumi na moja na vijiji vyake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹשֶׁן
  choice: Gosheni
  rationale: Jina la mahali limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili na linalosomeka kwa urahisi.
- source_word: חֹלֹן
  choice: Holoni
  rationale: Jina la mahali limetoholewa kwa Kiswahili huku sauti kuu za jina la Kiebrania zikihifadhiwa.
- source_word: גִלֹה
  choice: Gilo
  rationale: Jina la mahali limetoholewa moja kwa moja; umbo hili linaakisi kwa uwazi גִלֹה bila kuongeza silabi isiyohitajika.
- source_word: עָרִים
  choice: miji
  rationale: Neno hili ndilo tafsiri ya kawaida ya עָרִים katika orodha ya maeneo, ingawa ukubwa wa makazi hayo unaweza kutofautiana.
- source_word: אַחַת עֶשְׂרֵה
  choice: kumi na mmoja
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kuhesabu nomino ya ngeli ya miji.
- source_word: חַצְרֵיהֶן
  choice: vijiji vyake
  rationale: Katika muktadha huu neno linaonyesha makazi madogo ya kandokando yaliyohusishwa na miji hiyo; 'vijiji' ni tafsiri ya asili na inayoeleweka.
