lexical_decisions:
- source_word: צְנָן
  choice: Zenani
  rationale: Jina la mahali katika orodha ya miji ya Yuda; limenukuliwa kwa tahajia inayosomeka kwa kawaida katika Kiswahili badala ya kutafsiriwa.
- source_word: חֲדָשָׁה
  choice: Hadasha
  rationale: Ingawa neno la msingi linaweza kumaanisha ‘jipya,’ hapa ni jina la mahali katika mfululizo wa miji, hivyo limenukuliwa kama jina.
- source_word: מִגְדַּל גָּד
  choice: Migdal-Gadi
  rationale: Ni jina ambatani la mahali. Ingawa מִגְדָּל humaanisha ‘mnara,’ muktadha wa orodha ya miji unaunga mkono kulihifadhi kama jina; kistari kinaonyesha muundo wake ambatani.
- source_word: וַ / וּ
  choice: na
  rationale: Viunganishi vya Kiebrania vinaunganisha majina katika orodha; katika Kiswahili ‘na’ kabla ya jina la mwisho hutoa orodha ya kawaida na ya asili.
