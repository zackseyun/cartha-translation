lexical_decisions:
- source_word: חֲצַר שׁוּעָל
  choice: Hazari-Shuali
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Kiswahili badala ya kutafsiriwa kuwa ‘Kijiji cha Mbweha’; kufanya hivyo kunafaa katika orodha ya miji na kunahifadhi jina maalumu.
- source_word: בְּאֵר שֶׁבַע
  choice: Beer-sheba
  rationale: Jina hili la mahali linalojulikana limetoholewa; tahajia yenye kistari inaonyesha vipashio vya jina na kuruhusu dokezo la maana zake za Kiebrania bila kuzitafsiri katika matini kuu.
- source_word: בִּזְיוֹתְיָה
  choice: Biziotia
  rationale: Asili na maana ya jina hili la mahali hazina uhakika, kwa hiyo limetoholewa kwa mfumo unaosomeka kwa Kiswahili.
- source_word: וַ / וּ
  choice: na
  rationale: Kiunganishi cha Kiebrania kinaunganisha majina katika orodha; Kiswahili hutumia koma na ‘na’ kabla ya jina la mwisho.
