lexical_decisions:
- source_word: מֵעֶקְרוֹן
  choice: kutoka Ekroni
  rationale: Kiambishi מִן kinaonyesha mahali pa kuanzia; umbo la Kiswahili la jina la mahali limetumiwa kwa ufasaha.
- source_word: וָיָמָּה
  choice: kuelekea magharibi
  rationale: Neno יָם, kihalisi ‘bahari,’ katika matumizi ya mwelekeo humaanisha upande wa magharibi.
- source_word: כֹּל אֲשֶׁר עַל יַד אַשְׁדּוֹד
  choice: pamoja na yote yaliyokuwa kando ya Ashdodi
  rationale: עַל יַד kihalisi ni ‘mkono wa,’ lakini hapa ni nahau ya ukaribu; ‘kando ya’ huhifadhi maana hiyo bila kuamua kwa usahihi mipaka ya eneo.
- source_word: וְחַצְרֵיהֶן
  choice: na vijiji vyake
  rationale: חֲצֵרִים katika orodha hii hurejelea makazi madogo yanayohusiana na miji; kiwakilishi cha wingi cha Kiebrania kina rejeleo lisilo wazi kisarufi, lakini Kiswahili cha kawaida hutumia ‘vyake’ kwa Ashdodi kama kitovu cha karibu.
