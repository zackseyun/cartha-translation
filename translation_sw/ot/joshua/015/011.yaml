translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa na wenye hadhi. Majina yametoholewa kwa namna inayosomeka kwa Waswahili. Taswira ya Kiebrania ya ‘bega’ imetafsiriwa ‘upande’ kwa uwazi, huku uwezekano wa tafsiri halisi zaidi ukielezwa katika tanbihi. Mfuatano wa vitenzi vya mpaka umehifadhiwa kwa viambishi vya u- vinavyorejelea ‘mpaka.’
