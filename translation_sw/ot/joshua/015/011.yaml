  text: וְ/יָצָ֨א הַ/גְּב֜וּל אֶל כֶּ֣תֶף עֶקְרוֹן֮ צָפוֹנָ/ה֒ וְ/תָאַ֤ר הַ/גְּבוּל֙ שִׁכְּר֔וֹנָ/ה וְ/עָבַ֥ר הַר הַֽ/בַּעֲלָ֖ה וְ/יָצָ֣א יַבְנְאֵ֑ל וְ/הָי֛וּ תֹּצְא֥וֹת הַ/גְּב֖וּל יָֽמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/011.yaml
  text: Then the border went out to the shoulder of Ekron northward[a], and the border bent toward Shikkeron, and passed over Mount Baalah, and went out to Jabneel[c][b]; and the ends of the border were at the sea.
translation:
  language: sw
  text: Kisha mpaka ukaendelea hadi upande wa Ekroni kuelekea kaskazini[a]; ukapinda kuelekea Shikeroni[b], ukavuka Mlima Baala, ukaendelea hadi Yabneeli. Miisho ya mpaka ilikuwa baharini[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi upande wa kaskazini wa Ekroni.” Kiebrania kinaunganisha “upande wa Ekroni” na umbo linaloonyesha mwelekeo wa kaskazini.
    reason: lexical_alternative
  - marker: b
    text: Au, “ukageuka kuelekea Shikeroni.” Kitenzi kinaeleza mstari wa mpaka ukibadili mwelekeo.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania ni, “miisho ya mpaka ilikuwa kuelekea baharini / baharini.” Huenda hii inaonyesha kwamba mpaka uliishia kwenye Bahari ya Mediterania upande wa magharibi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא
  choice: ukaendelea / kuendelea hadi
  rationale: Katika maelezo ya mipaka, kitenzi hiki huonyesha mstari wa mpaka ukiendelea hadi sehemu inayofuata. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha mwendo wa mpaka bila kutumia kauli isiyo ya asili kama ‘ukatoka’ kila mara.
- source_word: גְּבוּל
  choice: mpaka
  rationale: ‘Mpaka’ ni neno la kawaida na lililo wazi kwa mstari unaotenganisha maeneo.
- source_word: כֶּתֶף
  choice: upande
  rationale: Ingawa maana halisi ni ‘bega,’ katika matumizi ya kijiografia neno hili humaanisha upande au ubavu wa mahali. ‘Upande’ ni wazi na wa asili katika Kiswahili.
- source_word: עֶקְרוֹן צָפוֹנָה
  choice: Ekroni kuelekea kaskazini
  rationale: Kauli hii inadumisha umbo la mwelekeo lililopo katika Kiebrania bila kuamua kabisa kama ni upande wa kaskazini wa mji au mwendo unaoelekea kaskazini.
- source_word: תָּאַר
  choice: ukapinda kuelekea
  rationale: Katika maelezo ya mipaka, kitenzi hiki huonyesha mstari ukibadili mwelekeo au ukichorwa kuelekea mahali fulani. ‘Ukapinda kuelekea’ hutoa picha hiyo kwa Kiswahili cha kawaida.
- source_word: שִׁכְּרוֹנָה
  choice: Shikeroni
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: עָבַר
  choice: ukavuka
  rationale: Kitenzi hiki huonyesha kuvuka au kupita juu ya eneo fulani; ‘ukavuka’ kinafaa kwa mpaka unaopita katika sehemu ya mwinuko.
- source_word: הַר הַבַּעֲלָה
  choice: Mlima Baala
  rationale: הַר ni mlima au kilima, na hapa ni sehemu ya jina la kijiografia. ‘Mlima Baala’ ni fupi na ya asili.
- source_word: יַבְנְאֵל
  choice: Yabneeli
  rationale: Jina la mahali limetoholewa kwa kufuata matamshi ya Kiebrania na muundo wa majina katika Kiswahili.
- source_word: תֹּצְאוֹת
  choice: mwisho
  rationale: Ingawa Kiebrania kina umbo la wingi linaloweza kutafsiriwa ‘miisho,’ katika muktadha huu maana ni mahali ambapo mstari wa mpaka unaishia. ‘Mwisho wa mpaka’ ni Kiswahili cha kawaida.
- source_word: יָמָּה
  choice: baharini
  rationale: Umbo hili linaweza kumaanisha ‘kuelekea baharini’ au ‘magharibi.’ Katika kishazi hiki linaonyesha kwamba mpaka uliishia baharini, yaelekea Bahari ya Mediterania.
