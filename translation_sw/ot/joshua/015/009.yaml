  text: וְ/תָאַ֨ר הַ/גְּב֜וּל מֵ/רֹ֣אשׁ הָ/הָ֗ר אֶל מַעְיַן֙ מֵ֣י נֶפְתּ֔וֹחַ וְ/יָצָ֖א אֶל עָרֵ֣י הַר עֶפְר֑וֹן וְ/תָאַ֤ר הַ/גְּבוּל֙ בַּעֲלָ֔ה הִ֖יא קִרְיַ֥ת יְעָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/009.yaml
  text: Then the border curved from the top of the mountain to the spring of the waters of Nephtoah[a], and went out to the cities of Mount Ephron; then the border curved to Baalah (that is, Kiriath-jearim).
translation:
  language: sw
  text: Kisha mpaka ukapinda kutoka kilele cha mlima hadi chemchemi ya maji ya Neftoa[a], ukaendelea hadi miji ya Mlima Efroni. Kisha mpaka ukapinda kuelekea Baala, yaani, Kiriath-Yearimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka ukaainishwa” au “mpaka ukageuka.” Katika maelezo haya ya mipaka, kitenzi cha Kiebrania kinaweza kumaanisha kuchora au kuonyesha njia ya mpaka, au mpaka kubadili mwelekeo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: ukapinda
  rationale: Katika maelezo ya mipaka, kitenzi hiki kinaweza kueleza mstari wa mpaka unaogeuka au unaochorwa kuzunguka eneo fulani. “Ukapinda” ni Kiswahili cha kawaida kinachofaa muktadha wa kijiografia, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: הַגְּבוּל
  choice: mpaka
  rationale: “Mpaka” ni neno la kawaida na wazi katika Kiswahili kwa mstari unaotenga maeneo.
- source_word: מֵרֹאשׁ הָהָר
  choice: kutoka kilele cha mlima
  rationale: “Kilele” huwasilisha maana ya רֹאשׁ katika usemi huu wa kijiografia kwa njia ya asili na sahihi.
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: chemchemi ya maji ya Neftoa
  rationale: Uamuzi huu unahifadhi kwa ukaribu mnyororo wa nomino wa Kiebrania na kutaja Neftoa kama jina la mahali.
- source_word: וְיָצָא
  choice: ukaendelea
  rationale: Katika maelezo ya mipaka, kitenzi hiki huonyesha mstari wa mpaka ukiendelea kuelekea sehemu inayofuata. “Ukaendelea” ni cha asili zaidi katika Kiswahili kuliko tafsiri sisisi ya kwenda nje.
- source_word: עָרֵי הַר עֶפְרוֹן
  choice: miji ya Mlima Efroni
  rationale: 'Hii inafuata muundo wa Kiebrania kwa karibu: עָרֵי ni “miji,” na הַר עֶפְרוֹן ni “Mlima Efroni,” bila kuipanua kuwa eneo lote la vilima.'
- source_word: בַּעֲלָה
  choice: Baala
  rationale: Ni jina la mahali, hivyo limeandikwa kwa matamshi yanayofaa Kiswahili.
- source_word: הִיא קִרְיַת יְעָרִים
  choice: yaani, Kiriath-yearimu
  rationale: Kiwakilishi cha Kiebrania kinatambulisha Baala kuwa mahali pale pale panapoitwa Kiriath-yearimu; “yaani” ni njia ya kawaida ya kutoa utambulisho huo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Majina ya mahali yameandikwa kwa namna inayokaribia matamshi ya asili huku Kiriath ikihifadhiwa kama umbo linalotambulika la jina.
