  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima lakini rahisi kueleweka. Majina ya maeneo yametoholewa kwa uangalifu, na lugha ya kijiografia imewekwa wazi bila kufuta taswira ya maandishi ya Kiebrania.
