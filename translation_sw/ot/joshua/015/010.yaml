  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/נָסַב֩ הַ/גְּב֨וּל מִ/בַּעֲלָ֥ה יָ֨מָּ/ה֙ אֶל הַ֣ר שֵׂעִ֔יר וְ/עָבַ֕ר אֶל כֶּ֧תֶף הַר יְעָרִ֛ים מִ/צָּפ֖וֹנָ/ה הִ֣יא כְסָל֑וֹן וְ/יָרַ֥ד בֵּֽית שֶׁ֖מֶשׁ וְ/עָבַ֥ר תִּמְנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/010.yaml
  text: Then the border turned from Baalah westward to Mount Seir[a], passed along to the northern slope of Mount Jearim (that is, Chesalon), went down to Beth-shemesh, and passed on to Timnah.
translation:
  language: sw
  text: Kisha mpaka ukageuka kutoka Baala kuelekea magharibi[a] hadi Mlima Seiri, ukapita hadi mteremko wa kaskazini wa Mlima Yearimu (yaani, Kesaloni), ukashuka hadi Beth-shemeshi, na ukapita hadi Timna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “kuelekea baharini,” nahau ya kawaida inayomaanisha “kuelekea magharibi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב הַגְּבוּל
  choice: mpaka ukageuka
  rationale: Katika maelezo ya mipaka, kitenzi hiki kinaonyesha mpaka kubadili mwelekeo; ‘ukageuka’ ni Kiswahili cha kawaida na huhifadhi maana ya kijiografia.
- source_word: מִבַּעֲלָה
  choice: kutoka Baala
  rationale: Jina la mahali limetoholewa kwa mtindo unaosomeka kwa Kiswahili.
- source_word: יָמָּה
  choice: kuelekea magharibi
  rationale: Umbo la Kiebrania lina maana halisi ya ‘kuelekea baharini,’ lakini katika jiografia ya nchi hiyo ni nahau ya kuelekea magharibi.
- source_word: אֶל הַר שֵׂעִיר
  choice: hadi Mlima Seiri
  rationale: הַר hapa imeeleweka kuwa mlima katika mfululizo wa alama za mpaka, huku jina Seiri likihifadhiwa kama jina la mahali.
- source_word: וְעָבַר אֶל כֶּתֶף
  choice: ukapita kando ya mteremko
  rationale: כֶּתֶף ni ‘bega’ au ‘ubavu’; kuhusu mlima, ‘mteremko’ huwasilisha sehemu ya upande wa mlima kwa lugha ya kawaida.
- source_word: הַר יְעָרִים מִצָּפוֹנָה
  choice: mteremko wa kaskazini wa Mlima Yearimu
  rationale: Muktadha unaonyesha upande wa kaskazini wa mlima; muundo huu ni wa asili katika Kiswahili.
- source_word: הִיא כְסָלוֹן
  choice: (yaani, Kesaloni)
  rationale: Kiwakilishi kinatoa utambulisho wa ufafanuzi wa mahali palipotangulia; mabano huonyesha vizuri ufafanuzi huo.
- source_word: וְיָרַד
  choice: ukashuka
  rationale: Kitenzi kinahifadhi maana ya kushuka kwa mwinuko katika maelezo ya njia ya mpaka.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Beth-shemeshi
  rationale: Jina la mahali limetoholewa kwa tahajia inayofaa matamshi ya Kiswahili bila kulitafsiri kisemantiki.
- source_word: וְעָבַר תִּמְנָה
  choice: na kuendelea hadi Timna
  rationale: Katika kanuni za maelezo ya mpaka, וְעָבַר huonyesha mstari wa mpaka kuendelea kuelekea au kupita kwenye alama inayofuata; ‘kuendelea hadi’ ni wazi na ya asili.
