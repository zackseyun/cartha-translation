base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/019.yaml
  text: She said[a], “Please give me a blessing, since you have given me the land of the Negev[c][b]; give me also springs of water.” So he gave her the upper springs and the lower springs.
translation:
  language: sw
  text: Akasema, “Tafadhali, nipe baraka[a]. Kwa kuwa umenipa nchi ya Negebu[b], nipe pia chemchemi za maji[c].” Basi akampa chemchemi za juu na chemchemi za chini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “zawadi.” Kiebrania husema “baraka,” neno linalotumiwa hapa kwa ajili ya kipawa chenye manufaa.
    reason: lexical_alternative
  - marker: b
    text: “Negebu” pia linaweza kumaanisha “nchi ya kusini” au “eneo la kusini.”
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania linaweza kumaanisha chemchemi, vidimbwi, au mabwawa ya maji; “chemchemi” linafaa zaidi katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרָכָה
  choice: baraka
  rationale: Neno la Kiebrania kwa kawaida humaanisha ‘baraka,’ lakini hapa linahusu fadhili au mali yenye manufaa anayoomba apewe. ‘Baraka’ inadumisha lugha ya chanzo bila kuifasiri moja kwa moja kuwa ‘zawadi.’
- source_word: אֶרֶץ הַנֶּגֶב
  choice: eneo la Negebu
  rationale: נֶגֶב linaweza kumaanisha eneo la kusini au Negebu kama jina la kijiografia. ‘Eneo la Negebu’ ni la kawaida na linaeleweka katika Kiswahili huku likidumisha rejeo la mahali.
- source_word: גֻּלֹּת מָיִם
  choice: chemchemi za maji
  rationale: Maana kamili ya גֻּלֹּת inajadiliwa; huenda ni chemchemi, vidimbwi, au mabonde yenye maji. Katika muktadha wa ardhi na mgawanyo wa vyanzo vya juu na vya chini, ‘chemchemi za maji’ ni tafsiri ya asili na inayofaa.
- source_word: תְּנָה
  choice: Tafadhali, nipe
  rationale: Ni amri yenye nguvu ya ombi. ‘Tafadhali’ huwasilisha ombi la heshima katika Kiswahili cha sasa bila kuongeza madai makali.
- source_word: וְנָתַתָּה לִי
  choice: nipe pia
  rationale: 'Kiunganishi kinaendeleza ombi la nyongeza: pamoja na eneo alilopewa, anaomba vyanzo vya maji.'
- source_word: גֻּלֹּת עִלִּיּוֹת
  choice: chemchemi za juu
  rationale: Tafsiri hii inadumisha ulinganifu na ‘chemchemi za maji’; kivumishi kinaonyesha mahali pa juu.
- source_word: גֻּלֹּת תַּחְתִּיּוֹת
  choice: chemchemi za chini
  rationale: Ni usemi sambamba na ‘chemchemi za juu’ na unaonyesha vyanzo vilivyo sehemu ya chini.
- source_word: וַיִּתֶּן לָהּ
  choice: Basi akampa
  rationale: ‘Basi’ huendeleza simulizi na kuonyesha jibu lililofuata ombi lake kwa mtiririko wa kawaida wa Kiswahili.
theological_decisions: []
