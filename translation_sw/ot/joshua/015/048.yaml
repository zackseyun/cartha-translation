  text: 'Katika nchi ya vilima: Shamiri, Yatiri, na Soko.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בָ/הָר
  choice: Katika nchi ya vilima
  rationale: Kirai hiki kwa maana halisi ni ‘na katika eneo la mlima/vilima.’ Katika orodha hii ya miji, ‘nchi ya vilima’ ni usemi wa kawaida wa kijiografia kwa nyanda za juu za Yuda; kiunganishi cha mwanzo hakihitaji kutafsiriwa kwa kuwa aya inaendeleza orodha.
- source_word: שָׁמִיר
  choice: Shamiri
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: וְ/יַתִּיר
  choice: Yatiri
  rationale: Jina la mahali limetoholewa moja kwa moja kutoka Kiebrania; kiunganishi וְ kinawakilishwa na mpangilio wa orodha.
- source_word: וְ/שׂוֹכֹה
  choice: Sokoho
  rationale: Jina la mahali limetoholewa kutoka Kiebrania, huku konsonanti ya mwisho ikionyeshwa kwa tahajia inayoweza kutamkwa kwa kawaida katika Kiswahili; kiunganishi וְ kinawakilishwa na ‘na.’
