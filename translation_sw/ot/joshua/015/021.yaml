base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/021.yaml
  text: And the cities at the extremity of the tribe of the sons of Judah[a], toward the border of Edom in the Negev, were Kabzeel, Eder[b], and Jagur.
translation:
  language: sw
  text: 'Na miji iliyokuwa kwenye ukingo wa kabila la wana wa Yuda[a], kuelekea mpaka wa Edomu katika Negebu[b], ni hii: Kabzeeli, Ederi na Yaguri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka mwisho wa kabila la wana wa Yuda.” Usemi wa Kiebrania unarejelea sehemu ya mwisho au ukingo wa eneo la Yuda.
    reason: lexical_alternative
  - marker: b
    text: “Negebu” pia linaweza kutafsiriwa “kusini” au “eneo la kusini.” Hapa huenda linataja eneo maalumu la kusini mwa Yuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ הֶעָרִים
  choice: Na miji ... ilikuwa
  rationale: Muundo huu unaendeleza simulizi na kutambulisha orodha ya miji kwa Kiswahili cha kawaida huku ukihifadhi maana ya kitenzi היה.
- source_word: מִקְצֵה לְמַטֵּה בְנֵי יְהוּדָה
  choice: kwenye ukingo wa eneo la kabila la wana wa Yuda
  rationale: מִקְצֵה inaonyesha sehemu ya nje au ukingo wa eneo; kuongeza “eneo” kunafanya maana ya kijiografia iwe wazi bila kuondoa usemi wa kikabila “wana wa Yuda.”
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: kuelekea mpaka wa Edomu
  rationale: “Kuelekea” linahifadhi mwelekeo unaoonyeshwa na אֶל bila kudai kwamba kila mji ulikuwa moja kwa moja mpakani.
- source_word: בַּנֶּגְבָּה
  choice: katika Negebu
  rationale: Katika maelezo haya ya mipaka, neno hilo linaelekea kutaja eneo maalumu la kusini; jina “Negebu” linahifadhi utambulisho wake wa kijiografia.
- source_word: קַבְצְאֵל וְעֵדֶר וְיָגוּר
  choice: Kabseeli, Ederi na Yaguri
  rationale: Majina ya mahali yamenukuliwa kwa maumbo yanayosomeka kwa kawaida katika Kiswahili, huku sauti zake za Kiebrania zikihifadhiwa kwa kadiri iwezekanavyo.
