  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa sasa na unaoeleweka. Usemi “wana wa Yuda” umehifadhiwa kama jina la kawaida la kikabila, na “Negebu” limetumiwa kama jina la eneo huku maana mbadala ikiwekwa katika tanbihi.
