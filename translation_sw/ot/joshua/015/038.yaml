lexical_decisions:
- source_word: דִלְעָן
  choice: Dileani
  rationale: Ni jina la mahali katika orodha ya miji ya Yuda; limetoholewa kwa umbo linalofaa matamshi na matumizi ya kawaida ya Kiswahili badala ya kutafsiriwa maana yake.
- source_word: הַמִּצְפֶּה
  choice: Mispa
  rationale: Ingawa neno la Kiebrania lina kibainishi na linahusiana na maana ya ‘mnara wa ulinzi’ au ‘mahali pa kuchungulia,’ hapa linatumika kama jina la mahali katika orodha ya miji; kwa hiyo limetoholewa kama Mispa.
- source_word: יָקְתְאֵל
  choice: Yoktheeli
  rationale: Ni jina la mahali; limetoholewa kwa namna ya kawaida na inayoeleweka katika Kiswahili.
