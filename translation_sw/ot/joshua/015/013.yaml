base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/013.yaml
  text: 'And to Caleb son of Jephunneh he gave a portion among the sons of Judah[a], according to the command of Yahweh to Joshua: Kiriath-arba (Arba was the father of Anak), that is[b], Hebron.'
translation:
  language: sw
  text: 'Naye Kalebu mwana wa Yefune akapewa sehemu miongoni mwa wana wa Yuda, kwa amri ya Yahwe kwa Yoshua: Kiriath-arba (Arba alikuwa baba[a] ya Anaki), yaani, Hebroni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linalotafsiriwa “baba” linaweza pia kumaanisha babu wa ukoo au mwanzilishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/כָלֵב בֶּן יְפֻנֶּה
  choice: Naye Kalebu mwana wa Yefune
  rationale: Kiunganishi na kihusishi vinaanzisha taarifa inayomhusu Kalebu; “naye” ni ya kawaida katika masimulizi ya Kiswahili, na majina yamenukuliwa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: נָתַן חֵלֶק
  choice: akapewa sehemu
  rationale: Ingawa Kiebrania kina kitenzi tendaji chenye mtendaji asiye tajwa, Kiswahili cha kutendwa hudumisha kutotajwa kwake kwa njia ya asili bila kumfanya Yoshua au Yahwe kuwa mtendaji wazi.
- source_word: בְּתוֹךְ בְּנֵי יְהוּדָה
  choice: katikati ya wazawa wa Yuda
  rationale: “Katikati ya” hudumisha wazo la kuwa ndani ya mgao wa kabila; “wazawa wa Yuda” linaonyesha kundi la ukoo bila kudai kuwa wote ni wana wa moja kwa moja.
- source_word: אֶל־פִּי יְהוָה לִיהוֹשֻׁעַ
  choice: kama Yahwe alivyomwamuru Yoshua
  rationale: Nahau ya Kiebrania, kihalisi “kwa kinywa cha Yahwe,” humaanisha kufuatana na agizo lake; muundo huu ni wa asili na unaonyesha agizo lililoelekezwa kwa Yoshua.
- source_word: קִרְיַת אַרְבַּע
  choice: Kiriath-arba
  rationale: Jina la mahali limenukuliwa badala ya kutafsiriwa.
- source_word: אֲבִי הָעֲנָק
  choice: Arba alikuwa baba[a] ya Anaki
  rationale: Kufanya Arba kuwa kiima kunazuia mkanganyiko kwamba mji ndio baba ya Anaki; “baba” huhifadhi usemi wa msingi huku tanbihi ikitaja maana pana zinazowezekana.
- source_word: הִיא חֶבְרוֹן
  choice: yaani, Hebroni
  rationale: Huu ni utambulisho wa Kiriath-arba kuwa Hebroni; “yaani” ni kiunganishi cha ufafanuzi cha kawaida katika Kiswahili.
theological_decisions:
- issue: Mtendaji asiye tajwa wa נָתַן (“alitoa/akampa”)
  choice: Kutumia “akapewa,” bila kumtaja mtendaji
  alternative: “Yoshua akampa” au “Yahwe akampa”
  rationale: Kiebrania hakimtaji mtendaji wazi. Muundo wa kutendwa wa Kiswahili huhifadhi hali hiyo bila kutatua kimyakimya kama mtendaji ni Yoshua au Yahwe.
- issue: Maana ya אָב katika uhusiano wa Arba na Anaki
  choice: “baba,” pamoja na tanbihi
  alternative: “babu,” “mwasisi,” au “mwenye kuanzisha ukoo”
  rationale: “Baba” ndio tafsiri ya moja kwa moja, lakini neno la Kiebrania linaweza kueleza babu wa ukoo au mwanzilishi; tanbihi huhifadhi upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kutendwa umetumiwa kimakusudi kuhifadhi kutotajwa kwa mtendaji katika Kiebrania. Alama ya tanbihi [a] imewekwa mara moja katika maandishi.
