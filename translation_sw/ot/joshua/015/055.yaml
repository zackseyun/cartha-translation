lexical_decisions:
- source_word: מָעוֹן
  choice: Maoni
  rationale: Ni jina la mahali katika orodha ya miji, hivyo limetoholewa kwa tahajia inayosomeka kwa Kiswahili badala ya kutafsiriwa kama nomino ya kawaida ‘makao’.
- source_word: כַּרְמֶל
  choice: Karmeli
  rationale: Ni jina la mji wa Yuda hapa, si nomino ya kawaida; umbo la Kiswahili ‘Karmeli’ linadumisha utambuzi wa jina hilo.
- source_word: וָזִיף
  choice: Zifu
  rationale: Kiunganishi ו kimetafsiriwa kwa ‘na’ katika mfuatano, na jina זִיף limetoholewa kuwa ‘Zifu’ kwa matamshi ya Kiswahili.
- source_word: וְיוּטָּה
  choice: na Yuta
  rationale: Kiunganishi ו kimetafsiriwa ‘na,’ huku jina יוּטָּה likitoholewa moja kwa moja kuwa ‘Yuta,’ kwa kuzingatia konsonanti ya kwanza ya Kiebrania.
