base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/001.yaml
  text: And the lot for the tribe of the sons of Judah[a], according to their clans, was to the border of Edom, to the wilderness of Zin, southward[c][b], at the farthest south.
translation:
  language: sw
  text: Kura ya kabila la wazao wa Yuda[a], kwa koo zao, ilifika hadi kwenye mpaka wa Edomu, katika nyika ya Sini upande wa kusini, hadi mwisho wa kusini kabisa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Yuda”; yaani, wazao wa Yuda waliounda kabila hilo.'
    reason: cultural_note
  - marker: b
    text: Au “kutoka mwisho wa kusini.” Kiebrania kinaweza pia kutafsiriwa kwa namna ya moja kwa moja zaidi, “kutoka mwisho wa Temani/kusini.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: Kura ... ilienea
  rationale: Muundo huu unaonyesha matokeo ya ugawaji wa nchi huku ukihifadhi ‘kura’ kama njia halisi iliyotumiwa kuigawa. ‘Ilienea’ ni ya kawaida katika maelezo ya eneo la ardhi na inaonyesha kufika kwa sehemu hiyo hadi mpaka uliotajwa.
- source_word: לְמַטֵּה בְּנֵי יְהוּדָה
  choice: ya kabila la wazao wa Yuda
  rationale: מַטֶּה hapa ni ‘kabila.’ Ingawa בְּנֵי maana yake halisi ni ‘wana,’ katika muktadha huu inawataja watu waliotokana na Yuda; ‘wazao wa Yuda’ ni wazi na ya kawaida katika Kiswahili.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: מִשְׁפָּחָה hapa ni kitengo cha ukoo ndani ya kabila, si familia ndogo tu; kwa hiyo ‘koo’ linafaa katika muktadha wa ugawaji wa kikabila.
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: hadi mpaka wa Edomu
  rationale: גְּבוּל ni mpaka wa eneo. ‘Hadi’ linaeleza mpaka ambao eneo la mgao lilifikia kwa Kiswahili cha kawaida.
- source_word: מִדְבַּר צִן
  choice: kwenye nyika ya Sini
  rationale: מִדְבָּר ni eneo kame au nyika. ‘Nyika ya Sini’ ni tafsiri sahihi na yenye hadhi ya jina hili la kijiografia.
- source_word: נֶגְבָּה
  choice: kuelekea kusini
  rationale: Umbo hili lina nguvu ya mwelekeo; hapa limetafsiriwa kama upande au mwelekeo wa kusini badala ya kuchukuliwa moja kwa moja kuwa jina la eneo la Negebu.
- source_word: מִקְצֵה תֵימָן
  choice: mpaka mwisho wa kusini kabisa
  rationale: Katika muktadha huu תֵימָן inaeleweka kwa kawaida kuwa kusini, na kirai kizima kinaonyesha ukomo wa mbali kabisa wa eneo la kusini. Tanbihi inahifadhi uwezekano wa tafsiri ya moja kwa moja zaidi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi la kihistoria na maelezo ya mipaka. Msamiati ‘kura,’ ‘kabila,’ ‘koo,’ ‘mpaka,’ na ‘nyika’ ni wa sasa, unaoeleweka, na wenye hadhi. Ukariri wa ‘kusini’ umehifadhiwa kwa sababu unatokana na msisitizo wa kijiografia katika Kiebrania.
