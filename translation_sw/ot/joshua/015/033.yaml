- source_word: בַּשְּׁפֵלָה
  choice: Katika eneo la vilima vya chini
  rationale: Neno hili ni jina la kijiografia la Shefela, eneo la vilima vya chini kati ya milima ya Yuda na uwanda wa pwani. Tafsiri hii inaeleza hali ya eneo hilo kwa Kiswahili cha kawaida bila kulifanya kuwa tambarare kabisa.
- source_word: אֶשְׁתָּאוֹל
  choice: Eshtaoli
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: וְצָרְעָה
  choice: Sora
  rationale: Jina la mahali limetoholewa kwa Kiswahili; kiunganishi cha Kiebrania kinawakilishwa kwa mpangilio wa kawaida wa orodha ya Kiswahili.
- source_word: וְאַשְׁנָה
  choice: na Ashna
  rationale: Jina la mahali limetoholewa, na kiunganishi וְ kimetafsiriwa kuwa “na” mwishoni mwa orodha.
