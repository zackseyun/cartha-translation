lexical_decisions:
- source_word: חֲצַר גַּדָּה
  choice: Hasar-gada
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Waswahili badala ya kutafsiriwa; kistari kinaonyesha kuwa ni jina ambatani.
- source_word: חֶשְׁמוֹן
  choice: Heshmoni
  rationale: Jina la mahali limetoholewa kwa namna ya kawaida ya Kiswahili, huku vokali ya mwisho ikisaidia matamshi ya asili bila kulitafsiri.
- source_word: בֵּית פָּלֶט
  choice: Beth-peleti
  rationale: Jina ambatani la mahali limehifadhiwa kwa utohozi; Beth haijatafsiriwa kuwa ‘nyumba ya’ kwa sababu hapa muundo mzima unatumika kama jina la mahali.
- source_word: וְ / וּ
  choice: na
  rationale: Viambishi vya uunganishi vinavyoratibu majina katika orodha vimetafsiriwa kwa kiunganishi cha kawaida cha Kiswahili ‘na’; koma zinatenganisha vipashio vya orodha.
