  text: Baala[a], Iyimu[b], na Ezemu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya tafsiri huandika jina hili “Bala,” huenda kwa kufuata orodha zinazofanana za miji; lakini Maandishi ya Kimasora hapa yanasoma “Baala.”
    reason: alternative_reading
  - marker: b
    text: Huenda jina Iyimu linahusiana na neno la Kiebrania linalomaanisha “magofu” au “marundo”; lakini hapa limetumiwa kama jina la mahali, kwa hiyo limenakiliwa.
    reason: lexical_alternative
  - marker: c
    text: Baadhi ya tafsiri huandika jina hili “Azemu”; “Ezemu” linaakisi moja kwa moja zaidi vokali za Kiebrania katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלָה
  choice: Baala
  rationale: Ni jina la mahali. Limeandikwa kwa kufuata matamshi ya Kiebrania huku likirekebishwa kwa tahajia ya kawaida ya Kiswahili; vokali mbili zinaonyesha silabi tofauti bila kutumia herufi h ya mwisho isiyotamkika katika Kiswahili.
- source_word: עִיִּים
  choice: Iyimu
  rationale: Katika orodha hii neno hili ni jina la mahali, kwa hiyo limenakiliwa badala ya kutafsiriwa kuwa “magofu” au “marundo.” Umbo “Iyimu” linaakisi jina la Kiebrania kwa namna inayoweza kutamkwa kwa urahisi katika Kiswahili.
- source_word: עָצֶם
  choice: Ezemu
  rationale: Ni jina la mahali. “Ezemu” linafuata vokali za maandishi ya Kimasora na muundo wa silabi unaofaa Kiswahili; “Azemu” ni tahajia nyingine inayotokana na desturi tofauti ya kunakili jina hilo.
- source_word: וְ / וָ
  choice: na
  rationale: Viambishi hivi vya Kiebrania vinaunganisha majina katika orodha rahisi; “na” ndilo neno la kawaida la Kiswahili.
