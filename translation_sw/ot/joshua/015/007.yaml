  text: וְ/עָלָ֨ה הַ/גְּב֥וּל דְּבִרָ/ה֮ מֵ/עֵ֣מֶק עָכוֹר֒ וְ/צָפ֜וֹנָ/ה פֹּנֶ֣ה אֶל הַ/גִּלְגָּ֗ל אֲשֶׁר נֹ֨כַח֙ לְ/מַעֲלֵ֣ה אֲדֻמִּ֔ים אֲשֶׁ֥ר מִ/נֶּ֖גֶב לַ/נָּ֑חַל וְ/עָבַ֤ר הַ/גְּבוּל֙ אֶל מֵי עֵ֣ין שֶׁ֔מֶשׁ וְ/הָי֥וּ תֹצְאֹתָ֖י/ו אֶל עֵ֥ין רֹגֵֽל׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/007.yaml
  text: And the border went up to Debir from the Valley of Achor[a], and turned northward toward Gilgal, which is opposite the Ascent of Adummim, which is south of the wadi. Then the border passed on to the waters of En-shemesh[c][b], and its end was at En-rogel.
translation:
  language: sw
  text: Mpaka ukapanda hadi Debiri kutoka Bonde la Akori, kisha ukageukia kaskazini kuelekea Gilgali[a], iliyo mkabala na Mwinuko wa Adumimu, ulio kusini mwa kijito cha msimu[b]. Kisha mpaka ukapita hadi kwenye maji ya En-Shemeshi, ukaishia En-Rogeli[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi Gilgali.” Kiebrania kinaweza kuonyesha ama kuelekea mahali hapo ama kufika huko katika maelezo haya ya mpaka.
    reason: lexical_alternative
  - marker: b
    text: “Kijito cha msimu” hapa ni mkondo au korongo ambalo kwa kawaida huwa na maji katika majira fulani; neno la Kiebrania נחל linaweza kuwa na maana hiyo katika maelezo ya kijiografia.
    reason: cultural_note
  - marker: c
    text: Kiebrania kwa tafsiri ya moja kwa moja kina umbo la wingi, “miisho yake” au “sehemu zake za kutokea,” likirejelea mahali mpaka ulipoishia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה הַגְּבוּל
  choice: Mpaka ukapanda
  rationale: Katika maelezo ya mipaka, kitenzi עלה huonyesha mpaka ukielekea sehemu ya juu au kupanda kijiografia. Kauli hii ni ya kawaida na inahifadhi maana hiyo.
- source_word: דְּבִרָה
  choice: hadi Debiri
  rationale: Herufi ya mwelekeo iliyoambatanishwa na jina la mahali huonyesha mwendo kuelekea Debiri; “hadi” inaeleza kufikiwa kwa kituo hicho kwa lugha ya kawaida.
- source_word: מֵעֵמֶק עָכוֹר
  choice: kutoka Bonde la Akori
  rationale: עֵמֶק ni bonde, na jina la mahali עָכוֹר limetoholewa kuwa Akori.
- source_word: וְצָפוֹנָה פֹּנֶה
  choice: kisha ukageukia kaskazini
  rationale: פּנה pamoja na neno la mwelekeo huonyesha kugeuka au kuelekea upande fulani; hapa mpaka unageukia kaskazini.
- source_word: אֶל הַגִּלְגָּל
  choice: kuelekea Gilgali
  rationale: אֶל inaweza kueleza mwelekeo au kufika mahali. “Kuelekea” inafaa katika ufuatiliaji wa mstari wa mpaka huku tanbihi ikihifadhi uwezekano wa “hadi.”
- source_word: אֲשֶׁר נֹכַח לְמַעֲלֵה אֲדֻמִּים
  choice: iliyo mkabala na Mwinuko wa Adumimu
  rationale: נֹכַח humaanisha kuwa mkabala na au kuelekeana na; מַעֲלֵה ni sehemu ya kupandia au mwinuko. Jina Adumimu limehifadhiwa kama jina maalumu.
- source_word: אֲשֶׁר מִנֶּגֶב לַנָּחַל
  choice: ambao uko kusini mwa kijito cha msimu
  rationale: נֶגֶב hapa ni upande wa kusini, na נַחַל katika mazingira haya mara nyingi ni mkondo unaotiririka kwa msimu au bonde lake, si lazima mto wa kudumu.
- source_word: וְעָבַר הַגְּבוּל
  choice: Kisha mpaka ukapita
  rationale: עבר katika maelezo ya mipaka huonyesha mstari wa mpaka ukiendelea au kupita kuelekea kituo kinachofuata bila kulazimisha maana ya kuvuka.
- source_word: אֶל מֵי עֵין שֶׁמֶשׁ
  choice: hadi kwenye maji ya En-Shemeshi
  rationale: מֵי ni “maji ya.” Jina la mahali limetoholewa badala ya kutafsiriwa ili lisichanganywe na maelezo ya kawaida kuhusu chemchemi.
- source_word: וְהָיוּ תֹצְאֹתָיו אֶל עֵין רֹגֵל
  choice: ukaishia En-Rogeli
  rationale: תֹצְאוֹתָיו katika maelezo ya mipaka hurejelea mwisho au mahali mpaka unapotokea. Kiswahili cha umoja “ukaishia” ni cha asili, huku wingi wa Kiebrania ukielezwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Majina ya maeneo yametoholewa kwa maumbo yanayoeleweka katika Kiswahili. “Mwinuko” na “kijito cha msimu” zinahifadhi maelezo ya mandhari bila kutumia istilahi ngumu ya kigeni; utata halisi wa אֶל na umbo la wingi תֹצְאוֹתָיו umehifadhiwa katika tanbihi.
