  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa; herufi ח imewakilishwa kwa h, na vokali ya mwisho imeongezwa ili umbo lisomeke kwa kawaida katika Kiswahili.
- source_word: כִתְלִישׁ
  choice: Kitilishi
  rationale: Jina la mahali limetoholewa kwa K ya mwanzo na silabi zinazolingana kwa karibu na umbo la Kiebrania, huku likirekebishwa kwa mfumo wa sauti wa Kiswahili.
- source_word: וְ
  choice: na
  rationale: Kiunganishi cha Kiebrania kinaunganisha majina katika orodha; Kiswahili cha kawaida hutumia koma na 'na' kabla ya jina la mwisho.
