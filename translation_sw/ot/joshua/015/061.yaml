  text: 'Katika nyika: Beth-araba, Midini, na Sekaka.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּמִּדְבָּר
  choice: Katika nyika
  rationale: Kiambishi ב pamoja na kibainishi huunda kishazi cha mahali kinachotaja eneo ambalo miji inayofuata ilikuwamo. “Nyika” ni neno la kawaida na lenye heshima kwa eneo kame lenye watu wachache, na hapa linafaa kwa nyika ya Yuda.
- source_word: בֵּית הָעֲרָבָה
  choice: Beth-araba
  rationale: Ni jina la mahali, hivyo limetoholewa badala ya kutafsiriwa; umbo hili linafuata matamshi ya Kiebrania kwa namna inayoeleweka katika Kiswahili.
- source_word: מִדִּין
  choice: Midini
  rationale: Ni jina la mahali; limetoholewa kwa tahajia inayolingana na mfumo wa sauti wa Kiswahili.
- source_word: וּסְכָכָה
  choice: na Sekaka
  rationale: וּ limetafsiriwa “na,” nalo jina la mahali סְכָכָה limetoholewa “Sekaka” kwa tahajia ya Kiswahili.
