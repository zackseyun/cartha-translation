  text: 'and Gederoth[a], Beth-dagon, Naamah, and Makkedah: sixteen cities with their villages.'
translation:
  language: sw
  text: 'na Gederothi, Beth-Dagoni[a], Naama, na Makeda: miji kumi na sita pamoja na vijiji vyake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Beth-Dagoni linamaanisha kihalisi “nyumba ya Dagoni,” lakini hapa ni jina la mahali, kwa hiyo limetoholewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְדֵרוֹת
  choice: Gederothi
  rationale: Ni jina la mahali lenye kiunganishi cha Kiebrania. Limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: בֵּית דָּגוֹן
  choice: Beth-dagoni
  rationale: Ni jina la mahali lililoundwa kwa maneno yanayomaanisha kihalisi ‘nyumba ya Dagoni.’ Kwa kuwa hapa linatumika kama toponimu, limetoholewa badala ya kutafsiriwa.
- source_word: וְ/נַעֲמָה
  choice: Naama
  rationale: Ni jina la mahali; limetoholewa kwa tahajia rahisi na ya kawaida ya Kiswahili.
- source_word: וּ/מַקֵּדָה
  choice: Makeda
  rationale: Ni jina la mahali; konsonanti mbili za utohozi wa Kiingereza hazihitajiki katika tahajia ya Kiswahili.
- source_word: עָרִים
  choice: miji
  rationale: Katika orodha za maeneo, neno hili humaanisha vituo vya makazi; ‘miji’ ni tafsiri ya kawaida na inayofaa hapa.
- source_word: שֵׁשׁ עֶשְׂרֵה
  choice: kumi na sita
  rationale: Ni idadi kamili inayohesabu miji iliyotajwa.
- source_word: וְ/חַצְרֵיהֶן
  choice: pamoja na vijiji vyake
  rationale: Neno hili katika orodha za mgao wa maeneo hurejelea makazi madogo ya kandokando yaliyohusishwa na miji hiyo. ‘Vijiji’ ni lugha ya kawaida na huonyesha uhusiano huo; ‘vyake’ hurejelea miji kama kundi.
