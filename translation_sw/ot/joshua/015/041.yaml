  register: Kiswahili sanifu cha Afrika Mashariki, kwa mtindo mfupi na wenye hadhi unaofaa orodha ya maeneo. Alama ya tanbihi imewekwa baada ya Beth-dagoni, ambalo ndilo jina linalofafanuliwa na tanbihi. Kistari kimetumiwa kutenganisha orodha ya majina na jumla ya miji.
