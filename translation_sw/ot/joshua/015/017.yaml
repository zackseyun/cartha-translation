base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/017.yaml
  text: Othniel son of Kenaz[a], Caleb’s brother, captured it[b], and he gave him his daughter Achsah as a wife.
translation:
  language: sw
  text: Othnieli mwana wa Kenazi, ndugu ya Kalebu,[a] akauteka mji huo.[b] Kisha Kalebu akamtoa Aksa, binti yake, awe mke wa Othnieli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jamaa ya Kalebu.” Neno la Kiebrania linalotafsiriwa “ndugu” wakati mwingine linaweza kumaanisha jamaa wa karibu; maana yake ya kawaida ni “ndugu.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, mji wa Kiriath-seferi, ambao pia huitwa Debiri, uliotajwa katika mstari uliotangulia.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: akauteka mji huo
  rationale: Kitenzi לכד kina maana ya kuteka au kuchukua kwa nguvu. Kiambishi cha nafsi ya tatu umoja wa kike kinarejelea mji uliotajwa katika mstari uliotangulia; kutaja “mji huo” ni wazi na kwa kawaida katika Kiswahili.
- source_word: עָתְנִיאֵל
  choice: Othnieli
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בֶּן קְנַז
  choice: mwana wa Kenazi
  rationale: Inahifadhi moja kwa moja uhusiano wa mwana na baba katika Kiebrania.
- source_word: אֲחִי כָלֵב
  choice: ndugu yake Kalebu
  rationale: Neno אָח kwa maana yake ya kawaida ni ndugu wa kiume, lakini pia linaweza kumaanisha jamaa. Muundo wa sentensi unaliunganisha kwa karibu zaidi na Kenazi; tafsiri kuu inaacha “ndugu” bila kuongeza “wa kiume” ili isifunge kabisa maana pana inayowezekana.
- source_word: וַיִּתֶּן לוֹ
  choice: Kisha Kalebu akampa
  rationale: Ingawa Kiebrania kina viwakilishi, kuwataja wazi Kalebu kama mtoaji na Othnieli kama anayerejelewa na kiambishi katika “akampa” huondoa mkanganyiko wa Kiswahili bila kubadili maana.
- source_word: אֶת עַכְסָה בִתּוֹ
  choice: Aksa binti yake
  rationale: Inahifadhi jina na maelezo kwamba Aksa alikuwa binti ya Kalebu kwa mpangilio wa asili wa Kiswahili.
- source_word: לְאִשָּׁה
  choice: awe mke wake
  rationale: Hii ni njia ya kawaida na ya wazi ya Kiswahili ya kueleza kwamba alimtoa katika ndoa, bila kuongeza maelezo yasiyokuwapo katika chanzo.
theological_decisions:
- issue: Utambulisho wa “ndugu yake Kalebu”
  choice: Maneno hayo yamewekwa baada ya Kenazi, yakimwelezea Kenazi kwa maana ya kawaida ya sarufi ya mstari huu.
  alternative: Yanaweza kueleweka kuwa yanamwelezea Othnieli, au “ndugu” likawa na maana pana ya jamaa.
  rationale: Katika Kiebrania, אֲחִי כָלֵב hufuata mara moja “Kenazi,” kwa hiyo uhusiano wa karibu wa kisarufi unapendeleza Kenazi. Hata hivyo, matumizi mapana ya אָח na namna ukoo huu unavyoelezwa katika vifungu vingine vinafanya dokezo lifae badala ya kufuta uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Majina yametolewa kwa maumbo yanayotambulika katika matumizi ya Biblia za Kiswahili. “Mji huo” huweka wazi rejeleo la kiambishi cha Kiebrania, na kurudia jina “Kalebu” kunazuia utata usio wa lazima wa viwakilishi.
