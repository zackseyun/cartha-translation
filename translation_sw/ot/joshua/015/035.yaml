  text: Yarmuthi[a], Adulamu, Soko, na Azeka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kina orodha rahisi ya majina ya miji ya Yuda: “Yarmuthi, Adulamu, Soko, na Azeka.” Tahajia za majina haya ya mahali hutofautiana katika tafsiri mbalimbali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְמוּת
  choice: Yarmuthi
  rationale: Jina la mahali limetoholewa kwa tahajia ya Kiswahili; umbo hili linafuata matamshi ya Kiebrania kwa ukaribu na linafaa katika maandishi ya Kiswahili.
- source_word: וַ/עֲדֻלָּם
  choice: Adulamu
  rationale: Kiunganishi cha Kiebrania kinawakilishwa kwa uakifishaji wa orodha, na jina la mahali limetoholewa kwa tahajia na muundo unaosomeka kwa Kiswahili.
- source_word: שׂוֹכֹה
  choice: Soko
  rationale: Jina la mahali limetoholewa moja kwa moja kutoka Kiebrania; Soko ni umbo rahisi na la kawaida katika Kiswahili.
- source_word: וַ/עֲזֵקָה
  choice: na Azeka
  rationale: Kiunganishi וַ kimetafsiriwa kwa “na” katika kipengele cha mwisho cha orodha, na jina la mahali limetoholewa kama Azeka.
