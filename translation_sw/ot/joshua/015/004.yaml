translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. Mpaka umetajwa wazi kama kiima ili mfululizo wa vitenzi usomeke kwa kawaida. Alama ya tanbihi imewekwa baada ya ‘Kijito cha Misri,’ ambako maelezo yake ya kileksika yanahusika.
