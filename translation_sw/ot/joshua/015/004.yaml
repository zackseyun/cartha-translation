base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/004.yaml
  text: Then it passed on to Azmon[a], and went out to the Brook of Egypt; and the boundary ended at the sea. This shall be your southern boundary.
translation:
  language: sw
  text: Kisha mpaka ukapita hadi Asmoni, ukaendelea hadi Kijito cha Misri[a], na ukaishia baharini. Huo ndio utakaokuwa mpaka wenu wa kusini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wadi ya Misri.” Neno la Kiebrania naḥal mara nyingi humaanisha bonde au mkondo wa maji unaoweza kuwa mkavu wakati fulani wa mwaka. Tafsiri ya kimapokeo “Mto wa Misri” inaweza kueleweka kimakosa kuwa Mto Nile katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: ukapita hadi
  rationale: Katika maelezo ya mipaka, kitenzi hiki huonyesha mpaka ukiendelea kutoka sehemu moja hadi nyingine; usemi huu ni wa kawaida bila kudokeza lazima uvuke kitu fulani.
- source_word: עַצְמוֹנָה
  choice: Asmoni
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: וְיָצָא
  choice: ukaendelea hadi
  rationale: Ingawa maana ya msingi ni ‘kutoka,’ katika orodha ya mipaka kitenzi kinaonyesha mpaka ukifikia sehemu inayofuata. Tafsiri hii inaeleza kazi yake katika muktadha kwa Kiswahili cha kawaida.
- source_word: נַחַל מִצְרַיִם
  choice: Kijito cha Misri
  rationale: נַחַל mara nyingi ni mkondo au bonde la maji ya msimu, si lazima mto mkubwa. ‘Kijito’ huepuka kuifanya ionekane kuwa Mto Nile, huku tanbihi ikihifadhi maana sahihi zaidi ya kijiografia.
- source_word: וְהָיוּ תֹּצְאוֹת הַגְּבוּל יָמָּה
  choice: na kuishia baharini
  rationale: Nahau ya Kiebrania inaeleza mwisho wa mpaka kuelekea baharini. Kiswahili hiki ni cha kawaida na kinahifadhi bahari bila kuitaja kwa jina lisilotajwa katika mstari.
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל נֶגֶב
  choice: Huo ndio utakaokuwa mpaka wenu wa kusini
  rationale: נֶגֶב hapa ina kazi ya mwelekeo, yaani kusini, badala ya kuwa jina maalumu la eneo la Negebu.
