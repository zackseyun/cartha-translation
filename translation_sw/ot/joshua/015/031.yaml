lexical_decisions:
- source_word: צִקְלַג
  choice: Siklagi
  rationale: Jina la mahali limetoholewa kwa tahajia ya Kiswahili; umbo “Siklagi” linapatana na matumizi yaliyozoeleka katika Biblia za Kiswahili.
- source_word: מַדְמַנָּה
  choice: Madmana
  rationale: Jina la mahali limetoholewa kwa mfumo wa sauti na tahajia ya Kiswahili; marudio ya konsonanti ya Kiebrania hayahitaji kuonyeshwa kwa herufi mbili katika Kiswahili.
- source_word: סַנְסַנָּה
  choice: Sansana
  rationale: Jina la mahali limetoholewa moja kwa moja kwa tahajia ya Kiswahili; he ya mwisho ya Kiebrania haiongezwi kama konsonanti isiyotamkwa.
- source_word: וְ
  choice: na
  rationale: Kiunganishi hiki kinaunganisha majina katika orodha; kwa mtindo wa kawaida wa Kiswahili, koma hutenganisha majina na “na” hutangulia jina la mwisho.
