  text: 'and Maarath[a], and Beth-anoth, and Eltekon: six cities with their villages.'
translation:
  language: sw
  text: na Maarathi, na Beth-anothi, na Eltekoni—miji sita na vijiji vyake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “makazi yao madogo.” Neno la Kiebrania linamaanisha maeneo ya vijijini yaliyotegemea miji iliyoorodheshwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַעֲרָת
  choice: na Maarathi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili; kiambishi וּ kimetafsiriwa kuwa “na.”
- source_word: וּ/בֵית עֲנוֹת
  choice: na Beth-anothi
  rationale: Hili ni jina ambatani la mahali, hivyo limetoholewa badala ya kutafsiriwa neno kwa neno; kistari kinaonyesha kuwa ni jina moja ambatani.
- source_word: וְ/אֶלְתְּקֹן
  choice: na Eltekoni
  rationale: Jina la mahali limetoholewa kwa umbo linalofaa matamshi na tahajia ya Kiswahili; וְ imetafsiriwa kuwa “na.”
- source_word: עָרִים
  choice: miji
  rationale: Katika orodha hii ya maeneo, neno hili linamaanisha makazi makuu yaliyohesabiwa kama miji; “miji” ni tafsiri ya kawaida na inayoeleweka.
- source_word: שֵׁשׁ
  choice: sita
  rationale: Namba ya msingi imetafsiriwa moja kwa moja na kupatanishwa na ngeli ya “miji.”
- source_word: וְ/חַצְרֵי/הֶן
  choice: pamoja na vijiji vyake
  rationale: חָצֵר hapa haimaanishi hasa nyua, bali makazi madogo ya kandokando yaliyohusishwa na miji iliyotajwa. “Vijiji” huwasilisha maana hiyo kwa Kiswahili cha sasa.
