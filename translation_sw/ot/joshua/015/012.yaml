base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/012.yaml
  text: And the western border was the Great Sea as a border[a]. This was the border of the sons of Judah all around[b], by their clans.
translation:
  language: sw
  text: Mpaka wa magharibi ulikuwa Bahari Kuu pamoja na pwani yake.[a] Huu ndio mpaka wa wana wa Yuda kuzunguka pande zote, kwa koo zao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “bahari, Bahari Kuu”; yaani, Bahari ya Mediterania. “Pwani yake” hutafsiri mpaka wa bahari unaotajwa katika kifungu hiki.
    reason: cultural_note
  - marker: b
    text: Au “kulingana na jamaa zao.” Neno la Kiebrania linamaanisha vikundi vya koo ndani ya kabila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּגְבוּל יָם
  choice: Mpaka wa upande wa magharibi
  rationale: Katika maelezo ya mipaka ya nchi, יָם (‘bahari’) hutumiwa pia kuelekeza upande wa bahari, yaani magharibi, kwa kuwa Bahari ya Mediterania ilikuwa magharibi mwa nchi.
- source_word: הַיָּמָּה הַגָּדוֹל
  choice: Bahari Kuu
  rationale: Hili ni jina la kawaida la kijiografia la Bahari ya Mediterania katika maandiko ya Kiebrania.
- source_word: וּגְבוּל
  choice: ambayo ndiyo iliyokuwa mpaka
  rationale: Kurudiwa kwa גְּבוּל baada ya ‘Bahari Kuu’ kunaonyesha kwa ufupi kwamba bahari yenyewe ndiyo iliyoweka mpaka; muundo huu ni wa asili na wazi katika Kiswahili.
- source_word: בְּנֵי יְהוּדָה
  choice: wana wa Yuda
  rationale: Huhifadhi taswira ya kifamilia ya Kiebrania huku ikitaja kwa pamoja wazao wa Yuda kama kabila.
- source_word: סָבִיב
  choice: kuzunguka pande zote
  rationale: Kifungu hiki kinafupisha mipaka yote iliyozunguka eneo la kabila la Yuda.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kulingana na koo zao
  rationale: מִשְׁפָּחָה hapa humaanisha vikundi vya ukoo ndani ya kabila, si familia ndogo tu.
theological_decisions:
- issue: Usemi wa kikabila wenye jinsia katika בְּנֵי יְהוּדָה
  choice: wana wa Yuda
  alternative: watu wa Yuda; wazao wa Yuda
  rationale: Kiebrania hutumia usemi halisi wa kifamilia ‘wana wa Yuda’ kwa kabila zima. Kiswahili kinaweza kuuhifadhi bila kuingiza fundisho la dhehebu wala kubadili maana yake ya pamoja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa urahisi. ‘Bahari Kuu’ limehifadhiwa kama jina la kijiografia, huku tanbihi ikifafanua kuwa ni Bahari ya Mediterania.
