base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/047.yaml
  text: Ashdod[a], its daughter towns and its villages; Gaza, its daughter towns and its villages; as far as the Brook of Egypt, and the Great Sea[c][b], which is its boundary.
translation:
  language: sw
  text: Ashdodi, pamoja na miji yake iliyoitegemea[a] na vijiji vyake; Gaza, pamoja na miji yake iliyoitegemea na vijiji vyake; mpaka Kijito cha Misri[b] na bahari[c], ambayo ndiyo mpaka wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, Kiebrania kinasema “binti zake,” nahau inayomaanisha miji midogo iliyokuwa chini ya mji mkuu.
    reason: lexical_alternative
  - marker: b
    text: Au “Wadi ya Misri.” Neno la Kiebrania נחל linaweza kumaanisha kijito au korongo ambalo huwa na maji kwa misimu.
    reason: lexical_alternative
  - marker: c
    text: Yaani, Bahari ya Mediterania.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנוֹתֶיהָ
  choice: miji yake iliyoitegemea
  rationale: Neno la Kiebrania kwa maana halisi ni ‘binti zake,’ lakini katika orodha za maeneo ni nahau inayomaanisha miji midogo iliyokuwa chini ya mji mkuu. Tafsiri hii huwasilisha maana kwa Kiswahili cha kawaida; tanbihi huhifadhi sitiari ya asili.
- source_word: חֲצֵרֶיהָ
  choice: vijiji vyake
  rationale: Katika muktadha huu wa kijiografia, neno hili linamaanisha makazi madogo ya nje, tofauti na miji iliyoitegemea.
- source_word: נַחַל מִצְרָיִם
  choice: Kijito cha Misri
  rationale: Hili ni jina la alama ya mpaka wa kusini. ‘Kijito’ ni neno linaloeleweka kwa urahisi, huku tanbihi ikionyesha kwamba נחל pia inaweza kumaanisha korongo lenye maji kwa misimu.
- source_word: הַיָּם
  choice: Bahari Kuu
  rationale: Katika maelezo ya mipaka ya Israeli, bahari hii ni Mediterania. ‘Bahari Kuu’ huhifadhi istilahi ya kibiblia, na tanbihi hutaja marejeo yake waziwazi.
- source_word: הַגְּבוּל וּגְבוּל
  choice: ambayo ndiyo mpaka wake
  rationale: Mwisho wa Kiebrania ni mfupi na wenye udondoshaji wa maneno; maana yake ni kwamba bahari ndiyo iliyokuwa mpaka wa eneo hilo. Kiswahili hiki ni wazi bila kuficha hali hiyo ya kimuundo.
- source_word: עַד
  choice: mpaka
  rationale: ‘Mpaka’ ni usemi wa kawaida wa Kiswahili unaoonyesha upeo wa eneo.
- source_word: אַשְׁדּוֹד / עַזָּה
  choice: Ashdodi / Gaza
  rationale: Majina haya yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
