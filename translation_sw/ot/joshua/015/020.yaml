  text: This was the inheritance of the tribe of the sons of Judah according to their clans[a].
translation:
  language: sw
  text: Huu ulikuwa urithi wa kabila la wazao wa Yuda kulingana na koo zao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Huu ni urithi wa kabila la wazao wa Yuda kulingana na koo zao.”
    reason: Kiebrania hakina kitenzi kilichoandikwa wazi; kwa hiyo wakati wa sasa pia unawezekana.
lexical_decisions:
- source_word: זֹאת
  choice: Huu ndio ulikuwa
  rationale: Kiwakilishi hiki cha kike cha umoja kinarejelea urithi wa eneo uliotajwa kabla. Wakati uliopita unasikika wa kawaida katika muhtasari huu wa simulizi, ingawa Kiebrania hakina kitenzi kilichoandikwa wazi.
- source_word: נַחֲלַת
  choice: urithi
  rationale: Neno hili humaanisha mali au eneo lililogawiwa kuwa urithi; “urithi” linadumisha maana ya ardhi ya agano.
- source_word: מַטֵּה
  choice: kabila
  rationale: Katika muktadha wa makabila na ugawaji wa ardhi, maana inayokusudiwa ni “kabila,” si maana halisi ya fimbo.
- source_word: בְנֵי יְהוּדָה
  choice: wazao wa Yuda
  rationale: “Wazao wa Yuda” linaonyesha msemo wa ukoo wa Kiebrania kwa Kiswahili cha kawaida na wazi kuliko tafsiri ya neno kwa neno “wana wa Yuda.”
- source_word: לְמִשְׁפְּחֹתָם
  choice: kulingana na koo zao
  rationale: Katika ugawaji wa kikabila, מִשְׁפָּחָה ni kundi la ukoo ndani ya kabila; kiambishi לְ kinaonyesha ugawaji kulingana na koo hizo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wazao wa Yuda” ni wazi kwa wasomaji wa kawaida huku kikihifadhi dhana ya ukoo; “koo” ni sahihi katika muktadha wa vikundi vidogo ndani ya kabila.
