- source_word: קֶדֶשׁ
  choice: Kedeshi
  rationale: Ni jina la mahali katika orodha ya miji. Limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili, bila kutafsiri maana ya jina.
- source_word: חָצוֹר
  choice: Hasori
  rationale: Ni jina la mahali; herufi ya Kiebrania צ imetoholewa kwa sauti ya Kiswahili 's', na vokali ya mwisho imeongezwa ili jina lisomeke kwa urahisi.
- source_word: יִתְנָן
  choice: Yitnani
  rationale: Ni jina la mahali. Mwanzo wa Kiebrania yod umehifadhiwa kwa 'Y', na jina limetoholewa katika umbo linalosomeka kiasili kwa Kiswahili.
- source_word: וְ
  choice: na
  rationale: Kiunganishi hiki kinaunganisha majina katika orodha; matumizi ya koma na 'na' kabla ya jina la mwisho ni mtindo wa kawaida wa Kiswahili.
