lexical_decisions:
- source_word: ו/ינים
  choice: na Yanimi
  rationale: Kiambishi ו kimetafsiriwa kuwa “na.” Jina la mahali limenukuliwa kwa mfumo wa sauti unaosomeka kwa urahisi katika Kiswahili, huku konsonanti za Kiebrania ינים zikihifadhiwa.
- source_word: וּ/בֵית תַּפּוּחַ
  choice: na Beth-tapua
  rationale: Kiunganishi וּ kimetafsiriwa kuwa “na.” Kwa kuwa huu ni mchanganyiko uliotumika kama jina la mahali, בֵית תַּפּוּחַ limenukuliwa badala ya kutafsiriwa kuwa kirai cha kawaida; “Beth-tapua” pia linadumisha utambulisho wa jina unaojulikana katika mapokeo ya Biblia.
- source_word: וַ/אֲפֵקָה
  choice: na Afeka
  rationale: Kiunganishi וַ kimetafsiriwa kuwa “na.” Jina אֲפֵקָה limenukuliwa kama “Afeka”; herufi פ isiyo na dageshi inawakilishwa kwa sauti ya “f,” na mwisho wake umetolewa kwa namna ya kawaida ya Kiswahili.
