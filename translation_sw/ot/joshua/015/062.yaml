  text: 'and Nibshan[a], the City of Salt, and En-gedi: six cities with their settlements.'
translation:
  language: sw
  text: 'na Nibshani, Mji wa Chumvi, na En-Gedi: miji sita pamoja na makazi yake.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vijiji vyake.” Neno la Kiebrania linaweza kumaanisha makazi madogo yanayotegemea miji iliyotajwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּבְשָׁן
  choice: Nibshani
  rationale: Ni jina la mahali; limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili, bila kuwakilisha kibainishi cha Kiebrania kama sehemu ya jina.
- source_word: עִיר הַמֶּלַח
  choice: Mji wa Chumvi
  rationale: Kirai hiki chenye maana wazi kimetafsiriwa kama jina la mahali badala ya kutoholewa, huku muundo wake wa Kiebrania ukihifadhiwa kwa Kiswahili cha kawaida.
- source_word: עֵין גֶּדִי
  choice: En-gedi
  rationale: Ni jina la mahali linalotoholewa; ingawa sehemu zake zina maana ya ‘chemchemi ya mwana-mbuzi,’ kulitafsiri kungeficha kwamba hapa ni jina maalumu linalojulikana.
- source_word: עָרִים שֵׁשׁ
  choice: majiji sita
  rationale: Huu ni muhtasari wa idadi ya maeneo yaliyotajwa. ‘Majiji’ huhifadhi maana ya kawaida ya עָרִים katika orodha za maeneo, bila kudai kwamba yalikuwa makubwa kwa viwango vya kisasa.
- source_word: חַצְרֵיהֶן
  choice: vitongoji vyake
  rationale: Neno hilo linaonyesha maeneo madogo yanayohusiana na majiji yaliyotajwa. ‘Vitongoji’ huonyesha uhusiano huo, huku ‘vijiji’ kikitolewa kama tafsiri nyingine inayowezekana.
- source_word: וְ
  choice: na
  rationale: Kiunganishi kinahifadhi mwendelezo wa orodha ya maeneo kutoka aya zilizotangulia na kuunganisha majina yaliyomo katika aya hii.
