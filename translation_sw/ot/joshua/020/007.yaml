  text: וַ/יַּקְדִּ֜שׁוּ אֶת קֶ֤דֶשׁ בַּ/גָּלִיל֙ בְּ/הַ֣ר נַפְתָּלִ֔י וְ/אֶת שְׁכֶ֖ם בְּ/הַ֣ר אֶפְרָ֑יִם וְ/אֶת קִרְיַ֥ת אַרְבַּ֛ע הִ֥יא חֶבְר֖וֹן בְּ/הַ֥ר יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/007.yaml
  text: So they set apart Kedesh in Galilee in the hill country of Naphtali[a], and Shechem in the hill country of Ephraim, and Kiriath-arba (that is, Hebron) in the hill country of Judah.
translation:
  language: sw
  text: Basi wakatenga Kedeshi katika Galilaya, katika nchi ya milima ya Naftali; na Shekemu katika nchi ya milima ya Efraimu; na Kiriath-arba (yaani, Hebroni)[a] katika nchi ya milima ya Yuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Kiriath-arba, yaani Hebroni”—yaani, Kiriath-arba ni jina jingine la Hebroni.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְדִּשׁוּ
  choice: wakatenga
  rationale: Katika muktadha huu wa kisheria na kiraia, kitenzi קדשׁ kinaonyesha kuyateua rasmi miji hii kwa kusudi maalumu la kuwa miji ya makimbilio; “wakatenga” ni ya kawaida na haiongezi maana ya ibada isiyodaiwa na muktadha.
- source_word: קֶדֶשׁ
  choice: Kedeshi
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: בַּגָּלִיל
  choice: katika Galilaya
  rationale: Galilaya ndilo jina la kawaida la Kiswahili kwa eneo hili.
- source_word: בְּהַר נַפְתָּלִי
  choice: kwenye eneo la milima la Naftali
  rationale: הַר hapa inaelekea kumaanisha ukanda wa nyanda za juu au milima, si kilele kimoja; usemi huu unaweka wazi maana hiyo ya kijiografia.
- source_word: שְׁכֶם
  choice: Shekemu
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: בְּהַר אֶפְרָיִם
  choice: katika eneo la milima la Efraimu
  rationale: Kirai hiki kinarejelea ukanda wa milima unaohusishwa na Efraimu, wala si mlima mmoja.
- source_word: קִרְיַת אַרְבַּע
  choice: Kiriath-arba
  rationale: Ni jina maalumu la mahali; limetoholewa badala ya kutafsiriwa kuwa “Mji wa Arba,” ili kutunza utambulisho wake kama jina.
- source_word: הִיא חֶבְרוֹן
  choice: (yaani, Hebroni)
  rationale: Kiwakilishi na jina vinafafanua kwamba Kiriath-arba ni Hebroni; mabano yanaonyesha kwa kawaida kwamba hili ni jina jingine la mahali pale.
- source_word: בְּהַר יְהוּדָה
  choice: katika eneo la milima la Yuda
  rationale: הַר ina maana ya eneo la milima la Yuda katika maelezo haya ya kijiografia.
