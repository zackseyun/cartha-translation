source:
  edition: WLC
  text: וְ/יָשַׁ֣ב בָּ/עִ֣יר הַ/הִ֗יא עַד עָמְד֞/וֹ לִ/פְנֵ֤י הָֽ/עֵדָה֙ לַ/מִּשְׁפָּ֔ט עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם אָ֣ז יָשׁ֣וּב הָ/רוֹצֵ֗חַ וּ/בָ֤א אֶל עִיר/וֹ֙ וְ/אֶל בֵּית֔/וֹ אֶל הָ/עִ֖יר אֲשֶׁר נָ֥ס מִ/שָּֽׁם׀־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/006.yaml
  text: And he shall live in that city until he stands before the congregation for judgment[a], until the death of the high priest who is in office in those days. Then the manslayer may return and come to his city and to his house[b], to the city from which he fled.
translation:
  language: sw
  text: Naye atakaa katika mji huo mpaka atakaposimama mbele ya kusanyiko kwa ajili ya hukumu[a], na mpaka kuhani mkuu atakayekuwa akihudumu siku hizo atakapokufa. Kisha huyo aliyeua[b] ataruhusiwa kurudi na kwenda mjini kwake na nyumbani kwake, katika mji alikoutoka alipokimbia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jumuiya.” Kiebrania kinamaanisha jamii iliyokusanyika ili kutoa hukumu ya kisheria.
    reason: lexical_alternative
  - marker: b
    text: Yaani, mtu aliyesababisha kifo. Hapa neno hilo halimaanishi moja kwa moja kwamba ameua kwa kukusudia au kwamba tayari amehukumiwa kuwa na hatia ya mauaji.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְיָשַׁב בָּעִיר הַהִיא
  choice: atakaa katika mji huo
  rationale: Kitenzi ישב hapa kinaonyesha kuendelea kuishi katika mji wa makimbilio; “atakaa” ni cha kawaida na kinahifadhi sharti la kubaki humo.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה
  choice: mpaka atakaposimama mbele ya kusanyiko
  rationale: עמד לפני ni usemi wa kujitokeza mbele ya chombo chenye mamlaka. “Kusanyiko” linaonyesha jumuiya iliyokusanyika kutekeleza wajibu wa kisheria.
- source_word: לַמִּשְׁפָּט
  choice: kwa ajili ya hukumu
  rationale: משפט hapa ni uamuzi au mchakato wa kisheria; tafsiri hii haibani maana kuwa kesi pekee wala haki kwa ujumla.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדוֹל אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: mpaka kuhani mkuu atakayekuwa akihudumu siku hizo atakapokufa
  rationale: Muundo huu unatambulisha kuhani mkuu aliyeshika wadhifa wakati huo. “Akihudumu” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kudai jambo zaidi.
- source_word: אָז יָשׁוּב
  choice: Kisha ... ataruhusiwa kurudi
  rationale: Katika sheria hii, kurudi kunaruhusiwa baada ya masharti kutimia. “Ataruhusiwa” huonyesha ruhusa ya kisheria badala ya kutabiri tu kuwa hakika atarudi.
- source_word: הָרֹצֵחַ
  choice: huyo aliyeua
  rationale: רצח humtaja mtu aliyesababisha kifo, lakini katika muktadha huu hukumu ya kuwa muuaji wa kukusudia haijaamuliwa. “Aliyeua” ni wazi na haimpi hatia ya mauaji ya kukusudia kabla ya hukumu.
- source_word: אֶל עִירוֹ וְאֶל בֵּיתוֹ
  choice: mjini kwake na nyumbani kwake
  rationale: 'Tafsiri inadumisha urejesho wa pande mbili: katika jamii yake na katika makao yake. “Nyumbani” ni ya asili zaidi katika Kiswahili cha sasa kuliko “katika nyumba yake” hapa.'
- source_word: אֶל הָעִיר אֲשֶׁר נָס מִשָּׁם
  choice: katika mji alioukimbia
  rationale: Kiswahili hiki huwasilisha kwa ufupi mji ambao mtu huyo alikimbia kutoka humo, bila marudio mazito.
theological_decisions:
- issue: Hali ya kisheria ya הָרֹצֵחַ katika sheria ya miji ya makimbilio
  choice: huyo aliyeua
  alternative: muuaji
  rationale: “Muuaji” linaweza kueleweka kuwa mtu mwenye hatia ya kuua kwa kukusudia. Muktadha unatenganisha kuua bila kukusudia na mauaji yenye hatia, hivyo tafsiri haipaswi kutanguliza uamuzi wa mahakama.
- issue: Nguvu ya kurudi baada ya kifo cha kuhani mkuu
  choice: ataruhusiwa kurudi
  alternative: atarudi
  rationale: Muktadha ni wa sheria inayompa ruhusa ya kuondoka katika mji wa makimbilio. Tafsiri hii haidai kwamba lazima atarudi, bali kwamba sasa ana haki ya kufanya hivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kisheria umehifadhiwa, huku sentensi ikisawazishwa kwa mtiririko wa kawaida wa Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu.
