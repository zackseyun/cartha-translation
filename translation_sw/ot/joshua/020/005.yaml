  edition: WLC
  text: וְ/כִ֨י יִרְדֹּ֜ף גֹּאֵ֤ל הַ/דָּם֙ אַֽחֲרָ֔י/ו וְ/לֹֽא יַסְגִּ֥רוּ אֶת הָ/רֹצֵ֖חַ בְּ/יָד֑/וֹ כִּ֤י בִ/בְלִי דַ֨עַת֙ הִכָּ֣ה אֶת רֵעֵ֔/הוּ וְ/לֹֽא שֹׂנֵ֥א ה֛וּא ל֖/וֹ מִ/תְּמ֥וֹל שִׁלְשֽׁוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/005.yaml
  text: And if the avenger of blood pursues him[a], they shall not hand the manslayer over into his hand, because he struck his neighbor without intent and had not hated him before, from yesterday or the day before.
translation:
  language: sw
  text: Na ikiwa mlipiza kisasi cha damu atamfuatilia, hawatamkabidhi yule aliyeua mikononi mwake, kwa sababu alimpiga mwenzake bila kukusudia, wala hakuwa amemchukia hapo awali[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “tangu jana na juzi”; hii ni nahau ya Kiebrania yenye maana ya “hapo awali” au “zamani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Na ikiwa
  rationale: Huendeleza utaratibu wa kisheria kutoka mstari uliotangulia huku ikidumisha maana ya sharti.
- source_word: גֹּאֵל הַדָּם
  choice: mlipiza kisasi cha damu
  rationale: Ni istilahi ya kisheria kwa mwakilishi wa jamaa mwenye jukumu la kulipiza damu; tafsiri hii inaeleweka na haitumii maana isiyofaa ya ‘mkombozi’ katika muktadha huu.
- source_word: יִרְדֹּף ... אַחֲרָיו
  choice: atamfuatilia
  rationale: Wakati ujao unafaa kwa tukio linalowezekana katika sharti, na kitenzi hiki huwasilisha wazo la kumwandama mtu kwa lengo la kumkamata.
- source_word: וְלֹא יַסְגִּרוּ
  choice: hawatamkabidhi
  rationale: Hiphil ya סגר hapa humaanisha kumtoa mtu na kumweka chini ya mamlaka ya mwingine. ‘Kumkabidhi’ ni Kiswahili cha kawaida chenye uzito wa kisheria.
- source_word: הָרֹצֵחַ
  choice: yule aliyeua
  rationale: Hutaja ukweli kwamba mtu amesababisha kifo bila kumwita ‘muuaji’ kwa maana inayoweza kudokeza tayari kuwa ana hatia ya mauaji ya kukusudia.
- source_word: בְּיָדוֹ
  choice: mikononi mwake
  rationale: Nahau ya Kiswahili huonyesha kukabidhiwa chini ya mamlaka au uwezo wa mlipiza kisasi, huku ikihifadhi taswira ya Kiebrania.
- source_word: בִּבְלִי דַעַת
  choice: bila kukusudia
  rationale: Katika sheria hii, kirai kinaonyesha kutokuwapo kwa nia ya kufanya tendo hilo, si ukosefu wa taarifa tu.
- source_word: הִכָּה אֶת רֵעֵהוּ
  choice: alimpiga mwenzake
  rationale: ‘Alimpiga’ hudumisha maana ya msingi ya הִכָּה bila kuingiza matokeo ya kifo ndani ya kitenzi chenyewe; ‘mwenzake’ huonyesha uhusiano wa kawaida wa kijamii wa רֵעַ.
- source_word: וְלֹא שֹׂנֵא הוּא לוֹ
  choice: wala hakuwa amemchukia
  rationale: Huwasilisha wazi kutokuwapo kwa chuki ya awali, jambo muhimu katika kutofautisha tendo la kukusudia na lisilokusudiwa.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: hapo awali
  rationale: Hii ni nahau ya Kiebrania yenye maana ya wakati uliotangulia. Kiswahili ‘hapo awali’ hutoa maana hiyo kwa kawaida, huku tanbihi ikihifadhi taswira halisi.
theological_decisions:
- issue: Hali ya kisheria ya הָרֹצֵחַ katika sheria ya miji ya makimbilio
  choice: yule aliyeua
  alternative: muuaji
  rationale: Mstari wenyewe unakanusha nia na chuki ya awali. ‘Yule aliyeua’ hutaja tendo bila kuhukumu mapema kwamba lilikuwa mauaji ya kukusudia.
- issue: Maana ya בִּבְלִי דַעַת
  choice: bila kukusudia
  alternative: bila kujua
  rationale: Hoja ya kisheria ni kutokuwapo kwa kusudi la kuua. ‘Bila kujua’ ingeweza kueleweka kama ukosefu wa maarifa kwa ujumla na kufifisha tofauti hiyo.
- issue: Nahau ya wakati מִתְּמוֹל שִׁלְשׁוֹם
  choice: hapo awali
  alternative: tangu jana na juzi
  rationale: Tafsiri ya maana huzuia msomaji kudhani kuwa sheria inahusu siku mbili tu; tanbihi inaonyesha umbo halisi la nahau bila kuficha ushahidi wa chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kisheria umebaki wazi bila kutumia msamiati unaomhukumu mapema mtu aliyesababisha kifo. Alama ya tanbihi imewekwa baada ya kirai kinachoelezewa.
