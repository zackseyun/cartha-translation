  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֵ֣לֶּה הָיוּ֩ עָרֵ֨י הַ/מּֽוּעָדָ֜ה לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָ֑ה וְ/לֹ֣א יָמ֗וּת בְּ/יַד֙ גֹּאֵ֣ל הַ/דָּ֔ם עַד עָמְד֖/וֹ לִ/פְנֵ֥י הָ/עֵדָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/009.yaml
  text: These were the appointed cities for all the sons of Israel and for the sojourner residing among them[c][b][a], so that anyone who struck down a person unintentionally might flee there and not die by the hand of the avenger of blood until he stood before the congregation.
translation:
  language: sw
  text: Hii ndiyo miji iliyoteuliwa kwa ajili ya wana wote wa Israeli[a] na kwa ajili ya mgeni anayeishi kati yao[b], ili kila aliyempiga mtu bila kukusudia akimbilie huko, na asife kwa mkono wa mlipiza kisasi cha damu mpaka atakaposimama mbele ya kusanyiko[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa Kiswahili cha kawaida zaidi, “Waisraeli wote.” Kiebrania kinasema “wana wote wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: “Mgeni” hapa ni mtu asiye Mwisraeli aliyeishi miongoni mwa Waisraeli chini ya utaratibu wa jamii yao.
    reason: cultural_note
  - marker: c
    text: Au “jumuiya.” Hapa neno hilo linaonyesha jamii iliyokusanyika kwa ajili ya kusikiliza shauri.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמּוּעָדָה
  choice: miji iliyoteuliwa
  rationale: Kirai hiki kinaonyesha miji iliyowekwa au kuteuliwa rasmi. Tafsiri hii inahifadhi maana hiyo bila kuongeza neno “makimbilio,” ambalo linaeleweka kutokana na muktadha lakini halipo wazi katika kirai hiki.
- source_word: לְכֹל בְּנֵי יִשְׂרָאֵל
  choice: kwa ajili ya wana wote wa Israeli
  rationale: Hii inafuata kwa karibu usemi wa Kiebrania “wana wa Israeli,” huku tanbihi ikitoa Kiswahili cha kawaida zaidi, “Waisraeli wote.”
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: na kwa ajili ya mgeni anayeishi kati yao
  rationale: גֵּר humaanisha mtu asiye mzawa aliyeweka makao katika jamii ya Israeli. “Mgeni anayeishi kati yao” ni ya kawaida na inaonyesha ukaaji, si mgeni wa kupita tu.
- source_word: לָנוּס שָׁמָּה
  choice: akimbilie huko
  rationale: נוּס ni kukimbia ili kuepuka hatari. “Akimbilie huko” linaonyesha mwendo wenye kusudi kwa Kiswahili cha kawaida.
- source_word: כָּל מַכֵּה נֶפֶשׁ בִּשְׁגָגָה
  choice: kila aliyemuua mtu bila kukusudia
  rationale: Ingawa kirai hicho kwa karibu ni kumpiga mtu, katika sheria hii matokeo ni kifo. “Aliyemuua mtu bila kukusudia” linaweka wazi maana ya kisheria ya mauaji yasiyo ya kukusudia.
- source_word: גֹּאֵל הַדָּם
  choice: mlipiza-kisasi cha damu
  rationale: Hili ni jina la mhusika wa kisheria wa ukoo aliyedai kulipiza kifo cha jamaa. Tafsiri hii inahifadhi picha ya damu na jukumu la kulipiza kisasi.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה
  choice: mpaka atakaposimama mbele ya kusanyiko
  rationale: Muundo wa Kiebrania unaonyesha mpaka wa muda wa ulinzi. Wakati ujao wa Kiswahili baada ya “mpaka” ni wa kawaida na unaonyesha kwamba mtuhumiwa lazima afikishwe mbele ya jumuiya iliyokusanyika.
theological_decisions:
- issue: Usemi wa agano בְּנֵי יִשְׂרָאֵל wenye umbo la kiume
  choice: wana wote wa Israeli
  alternative: Waisraeli wote
  rationale: Matini kuu inadumisha picha ya ukoo iliyo katika Kiebrania bila kudai kwamba ulinzi uliwahusu wanaume pekee; tanbihi inatoa usemi wa kawaida unaoonyesha taifa lote.
- issue: Hadhi ya kisheria ya גֵּר
  choice: mgeni anayeishi kati yao
  alternative: mgeni mkazi aliye kati yao
  rationale: Ulinzi wa miji hii uliwahusu pia wasio Waisraeli waliokuwa wakikaa chini ya utaratibu wa jamii ya Israeli. Chaguo hili halimfanyi kuwa msafiri wa muda wala kuingiza makundi ya kisasa ya uhamiaji.
- issue: Utambulisho wa גֹּאֵל הַדָּם
  choice: mlipiza-kisasi cha damu
  alternative: jamaa mwenye wajibu wa kulipiza damu
  rationale: Usemi huu unahifadhi jukumu la kisheria la jamaa wa aliyeuawa bila kuamua zaidi ya matini kuhusu uhalali wa tendo lake kabla ya kesi kusikilizwa.
- issue: Maana ya הָעֵדָה katika muktadha wa hukumu
  choice: kusanyiko
  alternative: jumuiya
  rationale: “Kusanyiko” linaweza kumaanisha jamii iliyokusanyika kutekeleza jukumu la hukumu; halibani neno hilo kwa taasisi ya kidini ya baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa sentensi unahifadhi mtiririko wa sheria ya Kiebrania, huku “akimbilie,” “bila kukusudia,” na “mpaka atakaposimama” yakitoa Kiswahili cha sasa na cha kawaida. Alama zote za tanbihi zimewekwa mara moja katika matini kuu.
