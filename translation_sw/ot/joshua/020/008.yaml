translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. Majina ya mahali na makabila yametoholewa kwa mazoea ya Kiswahili. Alama ya tanbihi imewekwa baada ya “Gileadi,” ambako maelezo yake yanahusika moja kwa moja.
