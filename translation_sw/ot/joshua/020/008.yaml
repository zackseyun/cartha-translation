  text: וּ/מֵ/עֵ֜בֶר לְ/יַרְדֵּ֤ן יְרִיחוֹ֙ מִזְרָ֔חָ/ה נָתְנ֞וּ אֶת בֶּ֧צֶר בַּ/מִּדְבָּ֛ר בַּ/מִּישֹׁ֖ר מִ/מַּטֵּ֣ה רְאוּבֵ֑ן וְ/אֶת רָאמֹ֤ת בַּ/גִּלְעָד֙ מִ/מַּטֵּה גָ֔ד וְ/אֶת גלון בַּ/בָּשָׁ֖ן מִ/מַּטֵּ֥ה מְנַשֶּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/008.yaml
  text: And beyond the Jordan east of Jericho[a], they designated Bezer in the wilderness on the plateau from the tribe of Reuben, and Ramoth in Gilead from the tribe of Gad, and Golan in Bashan from the tribe of Manasseh.
translation:
  language: sw
  text: Na ng’ambo ya Yordani, mashariki ya Yeriko, walitenga Beseri, iliyoko nyikani katika nchi tambarare, kutoka katika kabila la Reubeni; walitenga Ramothi katika Gileadi[a], kutoka katika kabila la Gadi; na Golani katika Bashani, kutoka katika kabila la Manase.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili pia huandikwa “Ramothi-Gileadi.” Kiebrania kinasema kihalisi, “Ramothi katika Gileadi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן
  choice: Na ng’ambo ya Yordani
  rationale: “Ng’ambo ya Yordani” ni usemi wa kawaida wa Kiswahili unaohifadhi mtazamo wa kijiografia wa upande mwingine wa Mto Yordani bila kuongeza neno lisilohitajika katika maandishi.
- source_word: יְרִיחוֹ מִזְרָחָה
  choice: mashariki ya Yeriko
  rationale: Muundo huu unaeleza mahali pa miji hiyo upande wa mashariki wa Yeriko; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: נָתְנוּ
  choice: walitenga
  rationale: Katika muktadha wa miji ya makimbilio, kitenzi hiki kinaonyesha kuitoa au kuiweka rasmi kwa kusudi maalumu. “Walitenga” linaeleza tendo hilo kwa uwazi.
- source_word: בֶּצֶר
  choice: Beseri
  rationale: Jina la mahali limetoholewa kwa tahajia na matamshi yanayoeleweka katika Kiswahili.
- source_word: בַּמִּדְבָּר
  choice: nyikani
  rationale: “Nyika” linaweza kumaanisha eneo kame au lisilolimwa, na hivyo linahifadhi upana wa maana ya neno la Kiebrania kuliko “jangwa” pekee.
- source_word: בַּמִּישֹׁר
  choice: katika nchi tambarare
  rationale: Neno hili linarejelea uwanda tambarare wa mashariki ya Yordani. Usemi huu ni wa kawaida na unaeleweka kuliko istilahi ya kitaalamu zaidi.
- source_word: מִמַּטֵּה רְאוּבֵן
  choice: kutoka katika kabila la Reubeni
  rationale: Muundo huu unatambulisha eneo la urithi wa kikabila ambalo mji ulitolewa, na unafuata kwa uthabiti vifungu vinavyofanana katika mstari huu.
- source_word: רָאמֹת בַּגִּלְעָד
  choice: Ramothi katika Gileadi
  rationale: Kiebrania kina jina la mji likifuatiwa na eneo lake. Tafsiri hii inahifadhi muundo huo badala ya kuyaunganisha kuwa jina moja.
- source_word: מִמַּטֵּה גָד
  choice: kutoka katika kabila la Gadi
  rationale: Hii ni tafsiri ya wazi na thabiti ya usemi unaotambulisha sehemu ya kikabila.
- source_word: גלון
  choice: Golani
  rationale: Umbo la konsonanti katika maandishi linahusiana na jina la mahali linalojulikana kama Golani; limetoholewa kwa Kiswahili.
- source_word: בַּבָּשָׁן
  choice: katika Bashani
  rationale: Huu ni usemi wa kawaida wa mahali unaohifadhi jina la eneo.
- source_word: מִמַּטֵּה מְנַשֶּׁה
  choice: kutoka katika kabila la Manase
  rationale: Tafsiri hii inaonyesha kuwa mji huo ulitoka katika eneo la urithi wa kabila la Manase.
