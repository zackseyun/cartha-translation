  - severity: medium
    issue: “Watampokea ndani ya mji miongoni mwao” haionyeshi kwa uwazi mwendo wa הָעִירָה.
    rationale: Kitenzi אָסַף katika muktadha huu kinaweza kumaanisha kumkusanya/kumwingiza au kumpokea; “watamwingiza mjini kwao” ni ya asili na huhifadhi kuingia mjini pamoja na kipengele cha uhusiano אֲלֵיהֶם.
