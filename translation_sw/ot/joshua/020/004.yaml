base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/004.yaml
  text: He shall flee to one of these cities and stand at the entrance of the city gate[a], and he shall speak his case in the hearing of the elders of that city. Then they shall take him into the city to themselves, and they shall give him a place[b], and he shall live with them.
translation:
  language: sw
  text: Atakimbilia mojawapo ya miji hii na atasimama penye lango la mji. Kisha atawaeleza wazee wa mji huo jambo lake[a]. Nao watamwingiza mjini kwao[b], watampa mahali, naye ataishi pamoja nao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maneno yake” au “shauri lake”; neno la Kiebrania linaweza kumaanisha maneno anayosema au jambo analowasilisha.
    reason: lexical_alternative
  - marker: b
    text: Au “watampokea mjini miongoni mwao”; kitenzi cha Kiebrania kinaweza kumaanisha kukusanya, kuingiza, au kupokea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָס
  choice: Atakimbilia
  rationale: Katika mfululizo huu wa maagizo ya kisheria, kitenzi kina maana ya jambo litakalopaswa kufanywa; “atakimbilia” ni ya kawaida na huhifadhi wazo la kukimbilia mahali pa usalama.
- source_word: אַחַת מֵהֶעָרִים הָאֵלֶּה
  choice: mojawapo ya miji hii
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaowakilisha kwa usahihi muundo wa sehemu kutoka katika kundi.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: kwenye mwingilio wa lango la mji
  rationale: “Mwingilio” huwakilisha פֶּתַח, na “lango la mji” huhifadhi mahali pa wazi pa shughuli za kiraia na hukumu.
- source_word: וְדִבֶּר בְּאָזְנֵי
  choice: atawaeleza ... wakiwa wanasikiliza
  rationale: Hii inatoa maana ya nahau “masikioni mwa” kwa Kiswahili cha kawaida bila tafsiri ngumu ya neno kwa neno, huku ikionyesha kwamba wazee wenyewe wanasikia maelezo yake.
- source_word: זִקְנֵי הָעִיר הַהִיא
  choice: wazee wa mji huo
  rationale: “Mji huo” huhifadhi umahususi wa הַהִיא.
- source_word: אֶת דְּבָרָיו
  choice: jambo lake
  rationale: דָּבָר inaweza kumaanisha neno, jambo, au shauri. Katika mazingira haya ya kisheria, “jambo lake” ni pana vya kutosha kuhifadhi uwezekano wa maelezo yake au shauri analowasilisha.
- source_word: וְאָסְפוּ אֹתוֹ הָעִירָה אֲלֵיהֶם
  choice: watampokea ndani ya mji miongoni mwao
  rationale: אָסַף hapa inaonyesha kumpokea au kumwingiza rasmi mjini; “miongoni mwao” huhifadhi sehemu ya uhusiano iliyo katika אֲלֵיהֶם.
- source_word: וְנָתְנוּ לוֹ מָקוֹם
  choice: watampa mahali
  rationale: מָקוֹם ni neno pana la “mahali”; tafsiri hii haibainishi isivyofaa kama ni nyumba, malazi, au eneo jingine.
- source_word: וְיָשַׁב עִמָּם
  choice: ataishi pamoja nao
  rationale: Katika muktadha wa makazi, יָשַׁב humaanisha kuishi au kukaa; “ataishi pamoja nao” ni Kiswahili cha sasa na cha kawaida.
