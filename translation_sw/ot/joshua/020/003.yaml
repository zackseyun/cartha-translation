base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/003.yaml
  text: so that a manslayer who strikes down a person unintentionally[a], without knowledge, may flee there[b], and they shall be for you a refuge from the avenger of blood.
translation:
  language: sw
  text: ili mtu aliyemuua mtu mwingine bila kukusudia[a] wala bila kujua aweze kukimbilia huko; na miji hiyo itakuwa kwenu mahali pa kukimbilia kutoka kwa mlipiza kisasi cha damu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu aliyeua”; hapa neno la Kiebrania linafafanuliwa na “bila kukusudia” na “wala bila kujua,” hivyo katika mstari huu halimaanishi mtu aliyeua kwa makusudi.
    reason: lexical_alternative
  - marker: b
    text: Yaani, mtu aliyekuwa na wajibu wa kulipiza kifo katika mfumo wa sheria wa Israeli uliotegemea uhusiano wa kifamilia.
    reason: cultural_note
lexical_decisions:
- source_word: לָנוּס שָׁמָּה
  choice: aweze kukimbilia huko
  rationale: Infinitivi yenye ל inaeleza kusudi katika muktadha wa amri iliyotangulia. “Kukimbilia huko” ni Kiswahili cha kawaida kinachoonyesha kuelekea kwenye miji hiyo.
- source_word: רוֹצֵחַ
  choice: mtu aliyeua
  rationale: Katika mstari huu neno linafafanuliwa na misemo inayoonyesha kutokukusudia na kutokujua; kwa hiyo “muuaji” lingeweza kueleweka kimakosa kuwa mtu aliyeua kwa makusudi.
- source_word: מַכֵּה נֶפֶשׁ
  choice: mtu aliyemuua mtu mwingine
  rationale: Nahau hii ya kisheria humaanisha kusababisha kifo cha mtu. Tafsiri hii inaweka wazi matokeo ya kitendo badala ya kutoa picha isiyo kamili ya kumpiga tu.
- source_word: נֶפֶשׁ
  choice: mtu mwingine
  rationale: Hapa נֶפֶשׁ humaanisha binadamu, si “nafsi” kama sehemu isiyoonekana ya mtu.
- source_word: בִּשְׁגָגָה
  choice: bila kukusudia
  rationale: Hueleza kitendo kilichofanywa bila nia katika muktadha wa kisheria; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: בִּבְלִי דָעַת
  choice: wala kujua
  rationale: Huhifadhi wazo la kutokuwa na maarifa au ufahamu na pia nguvu ya kirai cha pili kinachosisitiza kutokuwapo kwa kusudi.
- source_word: וְהָיוּ לָכֶם לְמִקְלָט
  choice: nayo yatakuwa mahali penu pa kukimbilia
  rationale: Kitenzi cha wingi kinarejelea miji. “Mahali pa kukimbilia” ni usemi wa kawaida na wenye hadhi unaowasilisha kazi ya miji hiyo kama kimbilio.
- source_word: מִגֹּאֵל הַדָּם
  choice: kutoka kwa mlipiza kisasi cha damu
  rationale: גֹּאֵל hapa ni mtu mwenye wajibu wa kifamilia wa kulipiza kifo. Tafsiri hii huhifadhi istilahi ya damu na wazo la kulipiza kisasi bila kuongeza undugu moja kwa moja katika matini.
theological_decisions:
- issue: Jinsi ya kumtambulisha aliyesababisha kifo
  choice: Mtu huyu amesababisha kifo bila kukusudia wala kujua, si muuaji wa kukusudia.
  alternative: Kutumia neno la jumla “muuaji” bila ufafanuzi wa kisheria.
  rationale: Misemo בִּשְׁגָגָה na בִּבְלִי דָעַת inaweka wazi kwamba kifo hakikusababishwa kwa makusudi. Tafsiri haipaswi kuingiza uovu wa kukusudia ambao mstari huu hauusemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa wasomaji wa kawaida huku tofauti kati ya kuua bila kukusudia na kuua kwa makusudi ikihifadhiwa. Viashiria vyote vya tanbihi vimo katika matini.
