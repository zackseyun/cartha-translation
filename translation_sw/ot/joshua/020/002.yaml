  yaml_path: translation/ot/joshua/020/002.yaml
  text: Speak to the sons of Israel[a], saying, ‘Appoint for yourselves the cities of refuge, about which I spoke to you through Moses,’
translation:
  language: sw
  text: “Waambie Waisraeli, ‘Jiteulieni miji ya makimbilio ambayo niliwaambia habari zake kupitia Musa[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kwa mkono wa Musa,” nahau yenye maana ya “kupitia Musa.”'
