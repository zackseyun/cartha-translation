lexical_decisions:
- source_word: דַּבֵּר
  choice: Waambie
  rationale: Amri ya Piel kwa Yoshua ina maana ya kusema moja kwa moja na watu; “waambie” ni Kiswahili cha kawaida na huunganisha kwa ufasaha na kauli inayofuata.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa kwa umbo ni “wana wa Israeli,” hapa ni jina la kawaida la watu wote wa Israeli. “Waisraeli” huwasilisha maana hiyo kwa Kiswahili cha sasa bila kudokeza kwamba wanaume pekee ndio wanaolengwa.
- source_word: לֵאמֹר
  choice: —
  rationale: Kiashiria hiki cha kunukuu kimewasilishwa kiasili kwa alama ya nukuu baada ya “Waambie,” badala ya kuongeza “ukisema,” jambo ambalo lingekuwa zito na lisilo la lazima katika Kiswahili.
- source_word: תְּנוּ לָכֶם
  choice: Jiteulieni
  rationale: Kitenzi נתן maana yake ya msingi ni “kutoa,” lakini hapa kinamaanisha kuchagua au kutenga miji kwa kazi maalumu. “Jiteulieni” huhifadhi pia wazo la לָכֶם, “kwa ajili yenu.”
- source_word: עָרֵי הַמִּקְלָט
  choice: miji ya makimbilio
  rationale: Hili ni neno la kisheria kwa miji iliyotengwa kuwa mahali pa kukimbilia na kupata ulinzi; “miji ya makimbilio” ni wazi na lenye hadhi.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֲלֵיכֶם
  choice: ambayo niliwaambia habari zake
  rationale: Usemi huu unadhihirisha kwamba Mungu alikuwa amewaambia kuhusu miji hiyo, na ni wa kawaida zaidi kwa Kiswahili kuliko tafsiri ya neno kwa neno.
- source_word: בְּיַד מֹשֶׁה
  choice: kupitia Musa
  rationale: Nahau ya Kiebrania “kwa mkono wa Musa” huonyesha kwamba maagizo yalifikishwa kwa njia ya Musa. “Kupitia Musa” huwasilisha uwakala huo kwa uwazi.
theological_decisions:
- issue: Jina la agano בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  alternative: wana wa Israeli
  rationale: Katika muktadha huu usemi wa kiume wa kifamilia ni jina la kawaida la taifa zima, si kizuizi kwa wanaume pekee. “Waisraeli” ni sawa kimaana na cha kawaida katika Kiswahili, huku “wana wa Israeli” kingeweza kueleweka kuwa wanaume tu.
- issue: Uwakala katika nahau בְּיַד מֹשֶׁה
  choice: kupitia Musa
  alternative: kwa mkono wa Musa
  rationale: Chaguo hili linadumisha Musa kuwa mpatanishi wa kibinadamu ambaye kupitia kwake Mungu alitoa agizo, bila kufanya nahau ya Kiebrania ionekane kama tendo halisi la mkono.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri umehifadhiwa, huku kiashiria cha kunukuu לֵאמֹר kikionyeshwa kwa alama za nukuu badala ya tafsiri nzito ya moja kwa moja. Alama ya tanbihi imewekwa baada ya “Musa,” ambako nahau inayofafanuliwa inatokea.
