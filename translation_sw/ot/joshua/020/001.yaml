lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kisha ... akazungumza
  rationale: Muundo wa simulizi wenye waw-consecutive unaendeleza mfululizo wa matukio. “Kisha ... akazungumza” ni Kiswahili cha kawaida kinachohifadhi maana ya kufuatana na pia wazo la kusema au kumwelekeza mtu maneno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kuwa “Yahweh,” badala ya kubadilishwa na cheo.
- source_word: אֶל
  choice: na
  rationale: Katika Kiswahili, “kuzungumza na Yoshua” ni njia ya kawaida ya kuonyesha anayeelekezewa maneno, ingawa Kiebrania hutumia kihusishi chenye maana ya msingi ya “kwa/kuelekea.”
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Jina la Kiebrania limetolewa kwa umbo la Kiswahili linalotumika kwa kawaida.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Kitenzi-jina hiki huanzisha rasmi maneno yanayofuata; “akisema” kinahifadhi kazi hiyo kwa Kiswahili cha asili.
theological_decisions:
- issue: Utoaji wa jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Aya inatumia jina binafsi la Mungu, יהוה. Kulihifadhi kama “Yahweh” hakubadili jina hilo kuwa cheo.
translation_notes:
