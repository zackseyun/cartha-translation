base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/007.yaml
  text: And the border of Manasseh was from Asher to Michmethath[a], which is opposite Shechem; then the border went southward[c][b], toward the inhabitants of En-tappuah.
translation:
  language: sw
  text: Mpaka wa Manase ulianzia Asheri hadi Mikmethathi, iliyokuwa mkabala na Shekemu[a]. Kisha mpaka huo ukaenda upande wa kulia kuelekea kwa wakazi wa En-Tapua[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliyokuwa mbele ya Shekemu,” au “inayoelekeana na Shekemu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “upande wa kulia.” Katika maelezo ya mipaka, huenda hii ikamaanisha kuelekea kusini.'
    reason: lexical_alternative
  - marker: c
    text: En-Tapua maana yake ni “chemchemi ya Tapua.”
    reason: cultural_note
lexical_decisions:
- source_word: גְבוּל
  choice: mpaka
  rationale: Katika maelezo ya mgao wa nchi, neno hili linamaanisha mstari wa mpaka wa eneo la kabila, si eneo lote.
- source_word: מֵאָשֵׁר
  choice: ulianzia upande wa Asheri
  rationale: Kihusishi kinaonyesha mahali au upande ambako maelezo ya mpaka yanaanzia; 'upande wa' huepuka kudai kwamba mpaka ulianzia ndani ya mji fulani.
- source_word: הַמִּכְמְתָת
  choice: Mikmethathi
  rationale: Ni jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa.
- source_word: אֲשֶׁר עַל־פְּנֵי שְׁכֶם
  choice: uliokuwa mkabala na Shekemu
  rationale: '''Mkabala na'' huhifadhi uhusiano wa mahali bila kuamua kwamba Mikmethathi ilikuwa upande fulani maalumu wa Shekemu.'
- source_word: וְהָלַךְ הַגְּבוּל
  choice: Kisha mpaka huo ukaelekea
  rationale: Katika maelezo ya mipaka, kitenzi הלך hueleza njia inayofuatwa na mpaka; 'ukaelekea' ni Kiswahili cha kawaida na kinachoeleweka.
- source_word: אֶל־הַיָּמִין
  choice: upande wa kulia
  rationale: Huhifadhi maana ya moja kwa moja ya Kiebrania. Ingawa katika muktadha wa kijiografia huenda ikamaanisha kusini, jambo hilo halijaamuliwa kimya kimya katika matini kuu.
- source_word: יֹשְׁבֵי
  choice: wakazi wa
  rationale: Huwataja watu wanaokaa mahali hapo kwa lugha ya kawaida na yenye heshima.
- source_word: עֵין תַּפּוּחַ
  choice: En-Tapua
  rationale: Ni jina la mahali na limetoholewa katika matini kuu; maana ya sehemu ya kwanza imeelezwa katika tanbihi.
