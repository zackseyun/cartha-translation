  yaml_path: translation/ot/joshua/017/017.yaml
  text: Joshua said to the house of Joseph—to Ephraim and Manasseh—saying[a], “You are a numerous people, and you have great strength[b]; you shall not have only one allotment.”
translation:
  language: sw
  text: Yoshua akawaambia watu wa nyumba ya Yusufu, yaani Efraimu na Manase, “Ninyi ni watu wengi[a], tena mna nguvu nyingi. Hamtapata fungu[b] moja tu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ninyi ni watu wakuu.” Kirai cha Kiebrania kinaweza kuonyesha wingi wa watu au ukuu; hapa muktadha wa ugawaji wa ardhi unapendelea “watu wengi.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania “kura.” Katika kitabu cha Yoshua neno hili mara nyingi humaanisha fungu la urithi lililogawiwa kwa kura.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יוֹסֵף
  choice: nyumba ya Yusufu
  rationale: Inahifadhi nahau ya kifamilia na kikabila ya Kiebrania, huku majina Efraimu na Manase yakifafanua wanaokusudiwa.
- source_word: לְאֶפְרַיִם וְלִמְנַשֶּׁה
  choice: yaani Efraimu na Manase
  rationale: Kirai hiki kinabainisha kwamba ‘nyumba ya Yusufu’ hapa ni makabila ya Efraimu na Manase; ‘yaani’ huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: עַם רַב
  choice: watu wengi
  rationale: Katika muktadha wa malalamiko kuhusu ukubwa wa eneo, kirai hiki kinaelekea kuonyesha wingi wa watu, ingawa neno רַב linaweza pia kumaanisha ukubwa au ukuu.
- source_word: וְכֹחַ גָּדוֹל לָךְ
  choice: tena mna nguvu nyingi
  rationale: Ni usemi wa asili katika Kiswahili unaohifadhi maana ya kuwa na nguvu au uwezo mkubwa.
- source_word: לֹא יִהְיֶה לְךָ גּוֹרָל אֶחָד
  choice: Hamtapata fungu moja tu
  rationale: ‘Fungu’ linaeleza sehemu ya urithi wa ardhi iliyogawiwa kwa kura; ‘moja tu’ huwasilisha maana ya kizuizi inayodokezwa na muktadha.
