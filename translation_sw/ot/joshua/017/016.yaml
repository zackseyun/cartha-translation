translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Tafsiri inadumisha tofauti ya kijiografia kati ya nchi ya vilima na nchi ya bonde, na inaeleza nahau ya miji tegemezi kwa lugha asilia.
