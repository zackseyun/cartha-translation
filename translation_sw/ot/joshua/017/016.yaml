  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יוֹסֵ֔ף לֹֽא יִמָּ֥צֵא לָ֖/נוּ הָ/הָ֑ר וְ/רֶ֣כֶב בַּרְזֶ֗ל בְּ/כָל הַֽ/כְּנַעֲנִי֙ הַ/יֹּשֵׁ֣ב בְּ/אֶֽרֶץ הָ/עֵ֔מֶק לַֽ/אֲשֶׁ֤ר בְּ/בֵית שְׁאָן֙ וּ/בְנוֹתֶ֔י/הָ וְ/לַֽ/אֲשֶׁ֖ר בְּ/עֵ֥מֶק יִזְרְעֶֽאל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/016.yaml
  text: And the sons of Joseph said[a], “The hill country is not enough for us, and all the Canaanites who live in the valley land have iron chariots[c][b], both those in Beth-shean and its daughter towns and those in the Valley of Jezreel.”
translation:
  language: sw
  text: Nao wana wa Yosefu wakasema, “Nchi ya vilima haitutoshi,[a] na Wakanaani wote wanaoishi katika nchi ya bonde wana magari ya vita ya chuma,[b] wale walioko Beth-sheani na miji yake tegemezi,[c] na wale walioko katika Bonde la Yezreeli.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, kwa kufuata maneno yenyewe, kinaweza kutafsiriwa, “nchi ya vilima haipatikani kwetu”; katika muktadha maana yake ni kwamba nchi hiyo haiwatoshi makabila ya Yosefu.
    reason: lexical_alternative
  - marker: b
    text: Au, “magari ya chuma.”
    reason: lexical_alternative
  - marker: c
    text: Kauli “miji yake tegemezi” inamaanisha makazi madogo yaliyotegemea mji mkuu.
    reason: cultural_note
lexical_decisions:
- source_word: הָהָר
  choice: nchi ya vilima
  rationale: Katika muktadha wa kugawa maeneo, neno hili linamaanisha eneo la miinuko, si mlima mmoja tu. ‘Nchi ya vilima’ huonyesha tofauti yake na nchi ya bonde.
- source_word: לֹא יִמָּצֵא לָנוּ
  choice: haitutoshi
  rationale: Ingawa kwa kufuata umbo la maneno linaweza kuwa ‘haipatikani kwetu,’ katika muktadha malalamiko ni kwamba eneo hilo halitoshi kwa makabila ya Yosefu.
- source_word: רֶכֶב בַּרְזֶל
  choice: magari ya vita ya chuma
  rationale: רֶכֶב hapa ni magari ya kijeshi, na בַּרְזֶל inaeleza uhusiano wake na chuma. Tafsiri hii ni wazi katika Kiswahili bila kubainisha zaidi ya chanzo kama gari lote lilikuwa la chuma au lilikuwa limeimarishwa kwa chuma.
- source_word: הַכְּנַעֲנִי
  choice: Wakanaani wote
  rationale: Nomino ya Kiebrania iko katika umoja wa kijumla lakini inarejelea wakazi Wakanaani kama kundi; wingi ni wa kawaida na wazi katika Kiswahili.
- source_word: הַיֹּשֵׁב
  choice: wanaoishi
  rationale: Kitenzi kishirikishi cha umoja kinakubaliana na nomino ya kijumla katika Kiebrania; Kiswahili hutumia wingi kwa kawaida.
- source_word: אֶרֶץ הָעֵמֶק
  choice: nchi ya bonde
  rationale: Huhifadhi maana ya eneo la chini linalotofautishwa na nchi ya vilima, bila kulifanya kuwa bonde moja tu lisilo na upana.
- source_word: בְּבֵית שְׁאָן
  choice: Beth-sheani
  rationale: Unukuzi huu huhifadhi jina la mahali la Kiebrania kwa namna inayoweza kutamkwa kwa urahisi katika Kiswahili.
- source_word: וּבְנוֹתֶיהָ
  choice: na miji yake iliyo chini yake
  rationale: ‘Binti zake’ ni nahau ya Kiebrania kwa makazi madogo yaliyotegemea mji mkuu. Tafsiri hii huwasilisha maana hiyo wazi kwa msomaji wa kawaida.
- source_word: עֵמֶק יִזְרְעֶאל
  choice: Bonde la Yezreeli
  rationale: Ni jina la moja kwa moja la kijiografia linalofuata muundo wa Kiebrania na matumizi ya kawaida ya Kiswahili.
- source_word: בְּכָל
  choice: wote ... wana
  rationale: Muundo huu unaonyesha kwamba hali hiyo inawahusu Wakanaani wa eneo la bonde kwa ujumla; Kiswahili cha mgawanyo ‘wote ... wana’ ni cha kawaida.
