  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כִּ֣י הַ֤ר יִֽהְיֶה לָּ/ךְ֙ כִּֽי יַ֣עַר ה֔וּא וּ/בֵ֣רֵאת֔/וֹ וְ/הָיָ֥ה לְ/ךָ֖ תֹּֽצְאֹתָ֑י/ו כִּֽי תוֹרִ֣ישׁ אֶת הַֽ/כְּנַעֲנִ֗י כִּ֣י רֶ֤כֶב בַּרְזֶל֙ ל֔/וֹ כִּ֥י חָזָ֖ק הֽוּא־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/018.yaml
  text: But the hill country will be yours[a]; for it is a forest, and you shall clear it, and its farthest borders shall be yours. For you shall dispossess the Canaanites[c][b], though they have iron chariots and though they are strong.
translation:
  language: sw
  text: Lakini nchi ya vilima itakuwa yako[a]; kwa maana ni msitu, nawe utaifyeka, na mipaka yake ya mbali itakuwa yako[b]. Kwa maana utawafukuza Wakanaani[c], ingawa wana magari ya vita ya chuma na ingawa wana nguvu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mlima utakuwa wako.” Neno la Kiebrania הַר linaweza kumaanisha mlima au nchi ya vilima; hapa yaelekea linataja eneo la miinuko walilogawiwa wazao wa Yosefu.
    reason: lexical_alternative
  - marker: b
    text: Au “miisho yake” au “sehemu zake za nje.” Kiebrania kinataja mipaka au kingo za nje za eneo hilo la vilima lenye msitu.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema kwa umoja, “Mkanaani ... ana nguvu,” kikitumia umoja kuwakilisha jamii nzima.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר
  choice: nchi ya vilima
  rationale: Katika muktadha wa ugawaji wa ardhi, neno hili linaelekea kumaanisha eneo la miinuko badala ya kilele kimoja.
- source_word: יִהְיֶה לָּךְ
  choice: itakuwa yako
  rationale: Muundo היה + ל unaonyesha umiliki au sehemu iliyogawiwa; Kiswahili hiki ni cha kawaida na cha moja kwa moja.
- source_word: כִּי
  choice: lakini / kwa maana / ingawa
  rationale: 'Neno hili limetumiwa mara kadhaa kwa kazi tofauti za kimuktadha: kuleta tofauti, kutoa sababu, na kukubali kizuizi kisichozuia matokeo.'
- source_word: יַעַר
  choice: msitu
  rationale: Hutaja eneo lenye miti; 'msitu' ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וּבֵרֵאתוֹ
  choice: utaifyeka
  rationale: Piel ya ברא hapa humaanisha kusafisha eneo lenye miti ili litumike; 'kufyeka' huwasilisha tendo hilo kwa kawaida.
- source_word: תֹּצְאֹתָיו
  choice: mipaka yake ya mbali
  rationale: Neno linaweza kutaja kingo, miisho, au sehemu za nje za eneo; katika ugawaji wa ardhi linadokeza eneo lote hadi mipaka yake.
- source_word: תוֹרִישׁ
  choice: utawafukuza
  rationale: Hiphil ya ירש humaanisha kuwaondoa watu katika milki yao; 'kuwafukuza' ni ya kawaida kwa Kiswahili na huhifadhi maana ya kuwaondoa katika nchi.
- source_word: הַכְּנַעֲנִי
  choice: Wakanaani
  rationale: Ingawa umbo la Kiebrania ni umoja, hapa linatumika kwa maana ya jamii nzima; wingi wa Kiswahili unaeleweka kwa urahisi.
- source_word: רֶכֶב בַּרְזֶל
  choice: magari ya vita ya chuma
  rationale: Kirai kinataja magari ya vita yaliyotengenezwa au kuimarishwa kwa chuma; tafsiri hii ni wazi bila kudai undani usiotajwa.
- source_word: חָזָק הוּא
  choice: wana nguvu
  rationale: Umoja wa Kiebrania unarejelea Wakanaani kama jamii; wingi unaafikiana na matumizi ya kawaida ya Kiswahili.
theological_decisions:
- issue: Umoja wa kijamii unaotumiwa kwa Wakanaani
  choice: 'Kutafsiri kwa wingi: “Wakanaani ... wana ... wana nguvu.”'
  alternative: 'Kutafsiri kwa umoja wa karibu zaidi na umbo la Kiebrania: “Mkanaani ... ana ... ana nguvu.”'
  rationale: Nomino ya taifa katika Kiebrania mara nyingi huwa umoja lakini huwakilisha watu wote. Wingi huonyesha rejeo hilo wazi katika Kiswahili bila kubadili maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa sasa na unaoeleweka kwa wasomaji wa kawaida. Muundo unaendeleza uhusiano wa sababu katika “kwa maana ni msitu,” huku “ingawa” ikionyesha kwamba magari ya chuma na nguvu za Wakanaani hazitazuia kufukuzwa kwao.
