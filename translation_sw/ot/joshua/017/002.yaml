base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/002.yaml
  text: 'And it was for the remaining sons of Manasseh according to their clans: for the sons of Abiezer[a], and for the sons of Helek, and for the sons of Asriel, and for the sons of Shechem, and for the sons of Hepher, and for the sons of Shemida. These were the male sons of Manasseh son of Joseph[c][b], according to their clans.'
translation:
  language: sw
  text: 'Nao wana wa Manase waliosalia walipata sehemu kulingana na koo zao: wana wa Abiezeri, wana wa Heleki, wana wa Asrieli, wana wa Shekemu, wana wa Heferi, na wana wa Shemida. Hawa walikuwa wana wa kiume wa Manase mwana wa Yosefu, kulingana na koo zao.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לִבְנֵי מְנַשֶּׁה
  choice: Nao wana wa Manase ... walipata sehemu
  rationale: Katika muktadha wa kugawiwa ardhi, וַיְהִי pamoja na לְ huonyesha kwamba sehemu ilikuwa ya watu hawa. Kiswahili ‘walipata sehemu’ huwasilisha maana hiyo kwa kawaida huku ‘Nao’ kikidumisha mwendelezo wa simulizi.
- source_word: הַנּוֹתָרִים
  choice: wengine
  rationale: Neno hili linawataja wana au wazao wengine wa Manase baada ya kundi lililotangulia; ‘wengine’ ni la kawaida na halidokezi kwamba hawakuwa na umuhimu.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kulingana na koo zao
  rationale: מִשְׁפָּחָה hapa ni kitengo cha ukoo ndani ya kabila, si familia ndogo ya nyumbani.
- source_word: לִבְנֵי אֲבִיעֶזֶר ... וְלִבְנֵי שְׁמִידָע
  choice: wana wa Abiezeri ... na wana wa Shemida
  rationale: Muundo unaorudiwa wa לִבְנֵי pamoja na jina umehifadhiwa kwa ‘wana wa,’ ambao unaweza pia kuwahusisha wazao wa kila mstari wa ukoo.
- source_word: הַזְּכָרִים
  choice: wana wa kiume
  rationale: Tafsiri hii inadumisha msisitizo wa Kiebrania kwamba mistari iliyoorodheshwa hapa ni ya wanaume, tofauti na binti za Selofehadi katika muktadha wa karibu.
- source_word: בְּנֵי מְנַשֶּׁה בֶּן יוֹסֵף
  choice: wana ... wa Manase mwana wa Yosefu
  rationale: Mfumo wa nasaba umehifadhiwa kwa karibu, huku ‘mwana wa Yosefu’ ikimtambulisha Manase.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaosomeka kwa urahisi. Marudio ya ‘wana wa’ na hitimisho ‘kulingana na koo zao’ yamedumishwa ili kuhifadhi muundo wa kisheria na wa kinasaba wa orodha ya Kiebrania.
