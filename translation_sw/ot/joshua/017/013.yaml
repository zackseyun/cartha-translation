base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/013.yaml
  text: And it happened that when the sons of Israel became strong[a], they put the Canaanites to forced labor[c][b], but they did not completely drive them out.
translation:
  language: sw
  text: Ikawa Waisraeli walipopata nguvu[a], waliwalazimisha Wakanaani kufanya kazi[b], lakini hawakuwafukuza kabisa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
  - marker: b
    text: Au “waliwaweka Wakanaani chini ya utumishi wa lazima” au “waliwatoza ushuru.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania kinatilia mkazo tendo hili: “hawakuwafukuza kabisa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Ikawa ... walipo-
  rationale: Muundo huu unatambulisha hatua mpya ya simulizi na hali iliyoambatana nayo. Kiswahili cha “Ikawa ... walipo-” kinahifadhi mtiririko huo bila kutumia lugha nzito au ya kizamani.
- source_word: חָזְקוּ
  choice: walipopata nguvu
  rationale: Kitenzi kinaonyesha kuongezeka au kupata nguvu, si kuwa na nguvu tu; usemi huu ni wa kawaida na unaonyesha mabadiliko hayo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ingawa Kiebrania kinasema kihalisi “wana wa Israeli,” hapa usemi huo ni jina la kawaida la taifa. “Waisraeli” ni Kiswahili cha sasa, wazi na cha kiasili; maana halisi imehifadhiwa katika tanbihi.
- source_word: וַיִּתְּנוּ אֶת־הַכְּנַעֲנִי לָמַס
  choice: waliwaweka Wakanaani kufanya kazi ya kulazimishwa
  rationale: מַס katika muktadha huu inaelekea kumaanisha utumishi au kazi ya lazima iliyowekwa kwa watu waliotiishwa. Tafsiri hii inaonyesha wazi hali ya kulazimishwa, huku uwezekano wa ushuru ukitajwa katika tanbihi.
- source_word: וְהוֹרֵשׁ לֹא הוֹרִישׁוֹ
  choice: lakini hawakuwafukuza kabisa
  rationale: Nomino ya kitenzi pamoja na kitenzi chenyewe inatilia mkazo tendo lililokanushwa. “Hawakuwafukuza kabisa” huwasilisha mkazo huo kwa Kiswahili cha kawaida. Kiwakilishi cha umoja katika Kiebrania kinarejelea Wakanaani kama kundi, hivyo kimetafsiriwa kwa wingi.
theological_decisions:
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  alternative: wana wa Israeli
  rationale: Usemi wa Kiebrania ni wa kiume kisarufi lakini hapa hutumika kama jina la taifa lote. “Waisraeli” huepuka kuufanya usemi huo uonekane kana kwamba unawahusu wanaume pekee, bila kubadili utambulisho wa taifa; tafsiri halisi imetolewa katika tanbihi.
- issue: Maana ya מַס
  choice: kazi ya kulazimishwa
  alternative: ushuru au utumishi wa lazima
  rationale: Muktadha wa kutiishwa kwa Wakanaani unaunga mkono kazi ya lazima, lakini neno la Kiebrania linaweza pia kuhusisha ushuru au huduma ya lazima. Tanbihi inadumisha upana huo wa maana.
- issue: Mkazo katika וְהוֹרֵשׁ לֹא הוֹרִישׁוֹ
  choice: hawakuwafukuza kabisa
  alternative: hawakuwanyang’anya kabisa milki yao
  rationale: Muundo wa Kiebrania unatilia mkazo kushindwa kuwafukuza. Tafsiri iliyochaguliwa ni wazi na haiongezi dai kwamba walishindwa tu kuwanyang’anya ardhi huku wakibaki mahali hapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya kisimulizi na inatumia maneno yanayoeleweka kwa wasomaji wa kawaida. “Kazi ya kulazimishwa” imechaguliwa badala ya istilahi ya kitaalamu “corvée,” na tanbihi zinahifadhi maana mbadala na umbo halisi la Kiebrania.
