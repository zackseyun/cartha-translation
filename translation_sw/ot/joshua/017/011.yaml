source:
  edition: WLC
  text: וַ/יְהִ֨י לִ/מְנַשֶּׁ֜ה בְּ/יִשָּׂשכָ֣ר וּ/בְ/אָשֵׁ֗ר בֵּית שְׁאָ֣ן וּ֠/בְנוֹתֶי/הָ וְ/יִבְלְעָ֨ם וּ/בְנוֹתֶ֜י/הָ וְֽ/אֶת יֹשְׁבֵ֧י דֹ֣אר וּ/בְנוֹתֶ֗י/הָ וְ/יֹשְׁבֵ֤י עֵֽין דֹּר֙ וּ/בְנֹתֶ֔י/הָ וְ/יֹשְׁבֵ֤י תַעְנַךְ֙ וּ/בְנֹתֶ֔י/הָ וְ/יֹשְׁבֵ֥י מְגִדּ֖וֹ וּ/בְנוֹתֶ֑י/הָ שְׁלֹ֖שֶׁת הַ/נָּֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/011.yaml
  text: And Manasseh had in Issachar and in Asher Beth-shean and its daughter villages[a], and Ibleam and its daughter villages, and the inhabitants of Dor and its daughter villages, and the inhabitants of En-dor and its daughter villages, and the inhabitants of Taanach and its daughter villages[b], and the inhabitants of Megiddo and its daughter villages—the three regions.
translation:
  language: sw
  text: Katika maeneo ya Isakari na Asheri, Manase alikuwa na Beth-sheani na vijiji vilivyoitegemea[a], Ibleamu na vijiji vilivyoitegemea, wakazi wa Dori na vijiji vilivyoitegemea, wakazi wa En-dori na vijiji vilivyoitegemea, wakazi wa Taanaki na vijiji vilivyoitegemea, na wakazi wa Megido na vijiji vilivyoitegemea—maeneo hayo matatu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “binti zake.” Hii ni nahau ya Kiebrania inayomaanisha vijiji au makazi yaliyokuwa chini ya mji mkuu.
    reason: cultural_note
  - marker: b
    text: Kifungu cha Kiebrania hapa ni kigumu. Kinaweza pia kutafsiriwa “majimbo hayo matatu” au “miinuko hiyo mitatu,” na huenda kinataja mgawanyo wa kijiografia au wa kiutawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִמְנַשֶּׁה
  choice: Manase alikuwa na
  rationale: Muundo wa Kiebrania ויהי ל unaonyesha umiliki au sehemu iliyokuwa ya kabila. Kauli hii ni ya kawaida kwa Kiswahili na haiongezi waziwazi kwamba miji hiyo ‘ilipewa,’ jambo ambalo halijasemwa moja kwa moja hapa.
- source_word: בְּיִשָּׂשכָר וּבְאָשֵׁר
  choice: Katika maeneo ya Isakari na Asheri
  rationale: Kihusishi ב kinaonyesha kwamba miji hii ilikuwa ndani ya maeneo ya makabila hayo; kuongeza ‘maeneo’ hufanya maana ya kijiografia iwe wazi kwa Kiswahili.
- source_word: בֵּית שְׁאָן
  choice: Beth-sheani
  rationale: Jina la mahali limetoholewa kwa namna inayoweza kutamkwa kwa Kiswahili huku likibaki karibu na umbo la Kiebrania.
- source_word: בְנוֹתֶיהָ
  choice: vijiji vilivyoitegemea
  rationale: Neno hili humaanisha kihalisi ‘binti zake,’ lakini katika matumizi haya ni nahau ya vijiji au makazi yaliyokuwa chini ya mji mkuu. Tafsiri hii huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: יִבְלְעָם
  choice: Ibleamu
  rationale: Utohozi wa jina la mahali unaofuata matamshi ya Kiebrania na muundo wa majina katika Kiswahili.
- source_word: יֹשְׁבֵי
  choice: wakazi wa
  rationale: Hili ni umbo la kitenzi linalotaja watu wanaokaa mahali fulani; ‘wakazi wa’ ni fupi na asilia kwa Kiswahili.
- source_word: עֵין דֹּר
  choice: En-dori
  rationale: Utohozi unaohifadhi jina ambatani la Kiebrania na kulifanya litamkike kwa urahisi katika Kiswahili.
- source_word: תַעְנַךְ
  choice: Taanaki
  rationale: Utohozi wa jina la mahali unaokaribia konsonanti na irabu za Kiebrania katika mfumo wa Kiswahili.
- source_word: מְגִדּוֹ
  choice: Megido
  rationale: Hili ndilo umbo linalofaa na linalotamkika kwa Kiswahili la jina la Kiebrania.
- source_word: שְׁלֹשֶׁת הַנָּפֶת
  choice: maeneo hayo matatu
  rationale: נפה hapa huenda ni istilahi ya kijiografia au kiutawala. ‘Maeneo’ ni pana vya kutosha kuhifadhi kutokuwa na uhakika, huku tanbihi ikieleza uwezekano mwingine.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaosomeka kwa urahisi. Orodha ndefu ya Kiebrania imehifadhiwa, pamoja na tofauti kati ya kutaja miji miwili ya kwanza moja kwa moja na kutaja ‘wakazi’ wa miji inayofuata. Nahau ya ‘miji-binti’ imefafanuliwa kwa usemi wa kawaida, huku taswira yake halisi ikiwekwa katika tanbihi.
