id: JOS.17.1
reference: Joshua 17:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/גּוֹרָל֙ לְ/מַטֵּ֣ה מְנַשֶּׁ֔ה כִּי ה֖וּא בְּכ֣וֹר יוֹסֵ֑ף לְ/מָכִיר֩ בְּכ֨וֹר מְנַשֶּׁ֜ה אֲבִ֣י הַ/גִּלְעָ֗ד כִּ֣י ה֤וּא הָיָה֙ אִ֣ישׁ מִלְחָמָ֔ה וַֽ/יְהִי ל֖/וֹ הַ/גִּלְעָ֥ד וְ/הַ/בָּשָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/001.yaml
  text: 'The lot fell to the tribe of Manasseh[a], for he was the firstborn of Joseph: to Machir the firstborn of Manasseh, the father of Gilead, because he was a man of war, there belonged Gilead and Bashan.'
translation:
  language: sw
  text: Kura ikaangukia kabila la Manase, kwa kuwa yeye alikuwa mzaliwa wa kwanza wa Yosefu. Makiri, mzaliwa wa kwanza wa Manase na baba wa Gileadi[a], alipata Gileadi na Bashani, kwa sababu alikuwa shujaa wa vita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “babu wa ukoo wa Gileadi” au “mwanzilishi wa Gileadi.” Neno la Kiebrania linalotafsiriwa “baba wa” linaweza kumaanisha babu wa ukoo au mwanzilishi, si lazima baba mzazi wa moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: Kura ikaangukia
  rationale: Hii ni nahau ya kugawa urithi wa eneo kwa kupiga kura. Kiswahili hiki ni cha kawaida na kinadumisha wazo la matokeo ya kura.
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: kabila la Manase
  rationale: Katika muktadha huu מַטֶּה humaanisha kabila, si fimbo halisi.
- source_word: כִּי הוּא בְּכוֹר יוֹסֵף
  choice: kwa kuwa yeye alikuwa mzaliwa wa kwanza wa Yosefu
  rationale: Kiwakilishi kinamrejelea Manase, na כִּי inaleta sababu. Neno 'yeye' linaweka rejeleo wazi bila kuongeza maana mpya.
- source_word: לְמָכִיר
  choice: Makiri ... alipata
  rationale: Muundo umegeuzwa kwa Kiswahili cha kawaida ili kuonyesha kwamba ukoo wa Makiri ndio uliopokea eneo hilo.
- source_word: בְּכוֹר מְנַשֶּׁה
  choice: mzaliwa wa kwanza wa Manase
  rationale: Inadumisha taarifa ya nasaba na umuhimu wa cheo cha mzaliwa wa kwanza.
- source_word: אֲבִי הַגִּלְעָד
  choice: baba wa Gileadi
  rationale: Inahifadhi nahau ya kifamilia ya Kiebrania; maana pana ya babu au mwanzilishi imeelezwa katika tanbihi.
- source_word: אִישׁ מִלְחָמָה
  choice: shujaa wa vita
  rationale: Ni usemi wa asili na wenye hadhi unaoeleza mtu mwenye uwezo na uzoefu wa kupigana.
- source_word: וַיְהִי לוֹ
  choice: alipata
  rationale: Katika muktadha wa ugawaji wa urithi, kitenzi hiki kinaonyesha kwamba maeneo hayo yakawa sehemu aliyogawiwa, si umiliki wa kawaida tu.
- source_word: הַגִּלְעָד וְהַבָּשָׁן
  choice: Gileadi na Bashani
  rationale: Haya ni majina ya maeneo, yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Rejeleo la kiwakilishi katika כִּי הוּא הָיָה אִישׁ מִלְחָמָה
  choice: alikuwa shujaa wa vita, likimrejelea Makiri
  alternative: Kulichukulia kama rejeleo la Manase au ukoo kwa ujumla
  rationale: Makiri ndiye nomino ya karibu na ndiye anayehusishwa moja kwa moja na kupokea Gileadi na Bashani; hata hivyo tafsiri haiongezi jina lake mara ya pili, hivyo inadumisha muundo wa kiwakilishi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imepangwa upya kidogo ili mtiririko uwe wa kawaida kwa msomaji wa Kiswahili, huku uhusiano wa sababu, nasaba, na ugawaji wa maeneo ukihifadhiwa.
