base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/006.yaml
  text: For the daughters of Manasseh received an inheritance among his sons[c][b][a], and the land of Gilead belonged to the rest of the sons of Manasseh.
translation:
  language: sw
  text: Kwa maana binti za Manase walipokea urithi[a] miongoni mwa wanawe wa kiume[b], na nchi ya Gileadi ilikuwa ya wana wa kiume wa Manase waliosalia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi na uradidi wa Kiebrania: “walirithi urithi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “miongoni mwa wanawe”; binti na wana wa kiume wanatofautishwa wazi katika mpangilio huu wa urithi.'
    reason: cultural_note
  - marker: c
    text: 'Au: “nchi ya Gileadi ilikuwa kwa ajili ya wana wa Manase waliosalia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kwa maana
  rationale: Kishazi hiki kinaeleza sababu au msingi wa mpangilio wa mgao uliotajwa kabla yake; “kwa maana” huhifadhi nguvu hiyo ya ufafanuzi kwa Kiswahili cha kawaida.
- source_word: בְּנוֹת מְנַשֶּׁה
  choice: binti za Manase
  rationale: Muundo huu unaonyesha uhusiano wa moja kwa moja na Manase. Neno “binti” limehifadhiwa kwa sababu mstari unatofautisha wazi binti na wana wa kiume katika urithi.
- source_word: נָחֲלוּ נַחֲלָה
  choice: walipokea urithi
  rationale: Kitenzi na nomino za mzizi mmoja katika Kiebrania zinasisitiza kupokea mali ya kurithi. “Walipokea urithi” ni Kiswahili cha asili na kinahifadhi maana ya kisheria ya kupangiwa sehemu bila kurudia neno kwa namna isiyo ya kawaida.
- source_word: בְּתוֹךְ בָּנָיו
  choice: miongoni mwa wanawe wa kiume
  rationale: בְּתוֹךְ humaanisha “katikati ya” au “miongoni mwa.” Nyongeza “wa kiume” inaweka wazi jinsia ya בָּנָיו na kuhifadhi utofautishaji wa makusudi kati ya binti na wana katika kifungu hiki.
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: nayo nchi ya Gileadi
  rationale: “Nchi ya Gileadi” ni namna ya kawaida na iliyo wazi ya kutaja eneo hilo; “nayo” huunganisha kishazi huku ikionyesha utofautishaji wa sehemu mbili za urithi.
- source_word: הָיְתָה לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: ilikuwa ya wana wengine wa kiume wa Manase
  rationale: Muundo wa Kiebrania unaonyesha umiliki au mgao. “Ilikuwa ya” ni ya asili kwa Kiswahili, na “wana wengine” huwatofautisha na binti waliotajwa bila kudokeza kwa lazima kwamba hao tu ndio walionusurika.
theological_decisions:
- issue: Utofautishaji wa binti na wana katika mpangilio wa urithi
  choice: Kutaja wazi “wanawe wa kiume”
  alternative: “wanawe” au “watoto wake”
  rationale: Kiebrania kinatumia neno la kiume na kuweka tofauti ya moja kwa moja kati ya binti na wana. Kutumia “watoto” kungefifisha jambo hilo, ilhali “wana” peke yake katika Kiswahili cha sasa linaweza kueleweka kwa upana zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi muundo wa ufafanuzi na utofautishaji wa kisheria wa maandishi ya Kiebrania, huku ikiepuka uradidi usio wa kawaida katika Kiswahili.
