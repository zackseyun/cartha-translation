  text: נֶ֣גְבָּ/ה לְ/אֶפְרַ֗יִם וְ/צָפ֨וֹנָ/ה֙ לִ/מְנַשֶּׁ֔ה וַ/יְהִ֥י הַ/יָּ֖ם גְּבוּל֑/וֹ וּ/בְ/אָשֵׁר֙ יִפְגְּע֣וּ/ן מִ/צָּפ֔וֹן וּ/בְ/יִשָּׂשכָ֖ר מִ/מִּזְרָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/010.yaml
  text: Southward it belonged to Ephraim[a], and northward to Manasseh, and the sea was its border; on the north they reached Asher, and on the east Issachar.
translation:
  language: sw
  text: Upande wa kusini nchi hiyo ilikuwa ya Efraimu, na upande wa kaskazini ilikuwa ya Manase. Bahari ilikuwa mpaka wake; nao walipakana na Asheri[a] upande wa kaskazini, na Isakari upande wa mashariki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nao walikutana na Asheri upande wa kaskazini, na Isakari upande wa mashariki.” Kitenzi cha Kiebrania kinaweza kumaanisha “walikutana na,” “waligusa,” au “walipakana na” katika maelezo ya mipaka ya maeneo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגְבָּה לְאֶפְרַיִם
  choice: Upande wa kusini nchi hiyo ilikuwa ya Efraimu
  rationale: Muundo wa Kiebrania ni wa mkato na unaonyesha upande pamoja na mgawo wa eneo. Kutaja “nchi hiyo” kunafanya rejeo lieleweke kwa Kiswahili bila kubadili maana.
- source_word: וְצָפוֹנָה לִמְנַשֶּׁה
  choice: na upande wa kaskazini ilikuwa ya Manase
  rationale: Inahifadhi ulinganifu wa pande mbili na maana ya eneo kugawiwa au kuwa mali ya kabila husika.
- source_word: וַיְהִי הַיָּם גְּבוּלוֹ
  choice: Bahari ilikuwa mpaka wake
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kifungu kinachotaja mpaka wa eneo.
- source_word: יִפְגְּעוּן
  choice: walipakana na
  rationale: Katika maelezo ya mipaka, kitenzi hiki huonyesha kukutana au kugusana kwa maeneo; “walipakana na” ni Kiswahili cha kijiografia kilicho wazi.
- source_word: מִצָּפוֹן
  choice: upande wa kaskazini
  rationale: Katika muktadha huu kihusishi kinaonyesha upande ambao maeneo yanagusana, si mwendo kutoka kaskazini.
- source_word: מִמִּזְרָח
  choice: upande wa mashariki
  rationale: Kinaonyesha upande wa ujirani wa eneo na Isakari.
