base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/009.yaml
  text: Then the border went down to the Brook of Kanah[a], south of the brook. These cities belonged to Ephraim among the cities of Manasseh, and the border of Manasseh was on the north side of the brook[c][b], and its end was at the sea.
translation:
  language: sw
  text: Kisha mpaka ukashuka hadi Kijito cha Kana[a], upande wa kusini wa kijito hicho. Miji hii ilikuwa ya Efraimu, miongoni mwa miji ya Manase[b]. Mpaka wa Manase ulikuwa upande wa kaskazini wa kijito hicho, nao uliishia baharini[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wadi ya Kana.” Neno la Kiebrania נחל linaweza kumaanisha kijito, bonde lenye mkondo wa maji wakati wa mvua, au korongo.
    reason: lexical_alternative
  - marker: b
    text: Yaani, Efraimu ilikuwa na miji iliyokuwa ndani ya eneo lililogawiwa Manase.
    reason: cultural_note
  - marker: c
    text: “Bahari” hapa ni Bahari ya Mediterania.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד
  choice: Kisha ... ukashuka
  rationale: Katika maelezo ya mipaka, kitenzi hiki huonyesha mpaka ukielekea chini kwa mwinuko au mwelekeo. “Ukashuka” ni Kiswahili cha kawaida, na “Kisha” huwasilisha mfuatano wa simulizi.
- source_word: הַגְּבוּל
  choice: mpaka
  rationale: Neno hili humaanisha mstari unaotenganisha maeneo; “mpaka” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: נַחַל קָנָה
  choice: Kijito cha Kana
  rationale: נחל linaweza kumaanisha kijito, mkondo wa msimu, au korongo. “Kijito” kinaeleweka kwa urahisi, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: נֶגְבָּה לַנַּחַל
  choice: upande wa kusini wa kijito hicho
  rationale: Kirai hiki kinaonyesha mahali pa mpaka kuhusiana na kijito, yaani upande wake wa kusini, bila kudokeza kimakosa kwamba mpaka ulikuwa ukielekea kwenye kijito.
- source_word: עָרִים הָאֵלֶּה לְאֶפְרַיִם
  choice: Miji hii ilikuwa ya Efraimu
  rationale: Kishazi kisicho na kitenzi kinaonyesha umiliki au mgao wa eneo; “ilikuwa ya Efraimu” huwasilisha hilo kwa kawaida.
- source_word: בְּתוֹךְ עָרֵי מְנַשֶּׁה
  choice: miongoni mwa miji ya Manase
  rationale: בְּתוֹךְ hapa huonyesha kwamba miji ya Efraimu ilikuwa ndani ya eneo lenye miji ya Manase. “Miongoni mwa” ni ya kawaida bila kufafanua zaidi ya chanzo.
- source_word: וּגְבוּל מְנַשֶּׁה מִצְּפוֹן לַנַּחַל
  choice: Mpaka wa Manase ulikuwa upande wa kaskazini wa kijito hicho
  rationale: Tafsiri hii huonyesha kwa wazi nafasi ya mpaka wa Manase kuhusiana na kijito.
- source_word: וַיְהִי תֹצְאֹתָיו הַיָּמָּה
  choice: nao uliishia baharini
  rationale: Katika kauli za mipaka, תֹצְאוֹת humaanisha mwisho au mahali mpaka unapofikia. “Uliishia baharini” ni tafsiri ya kawaida na sahihi.
