  text: The land of Tappuah belonged to Manasseh[a], but Tappuah on the border of Manasseh belonged to the sons of Ephraim.
translation:
  language: sw
  text: Nchi ya Tapua ilikuwa ya Manase[a], lakini Tapua kwenye mpaka wa Manase ilikuwa ya wana wa Efraimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa namna inayofuata muundo wa Kiebrania kwa karibu zaidi, “Kwa Manase kulikuwa na nchi ya Tapua; lakini Tapua kwenye mpaka wa Manase ilikuwa ya wana wa Efraimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִמְנַשֶּׁה הָיְתָה
  choice: ilikuwa ya Manase
  rationale: Muundo wenye ל pamoja na היה unaonyesha milki au sehemu iliyogawiwa; Kiswahili ‘ilikuwa ya Manase’ ni cha kawaida na huhifadhi maana hiyo.
- source_word: אֶרֶץ תַּפּוּחַ
  choice: nchi ya Tapua
  rationale: אֶרֶץ hapa ni eneo la ardhi katika muktadha wa mgao wa makabila, si taifa; ‘nchi ya Tapua’ hutofautisha eneo hilo na mji unaotajwa baadaye.
- source_word: תַּפּוּחַ
  choice: Tapua
  rationale: Ni jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa.
- source_word: וְתַפּוּחַ
  choice: lakini mji wa Tapua
  rationale: וְ inaonyesha utofautishaji hapa. Neno ‘mji’ limeongezwa kwa uwazi kutokana na tofauti ya kimuktadha kati ya ‘nchi ya Tapua’ na Tapua yenyewe; halidai kwamba neno hilo liko wazi katika Kiebrania.
- source_word: אֶל גְּבוּל מְנַשֶּׁה
  choice: uliokuwa kwenye mpaka wa Manase
  rationale: אֶל pamoja na גְּבוּל ina maana ya mahali karibu na au kwenye mpaka; ‘kwenye mpaka’ ni usemi wa kawaida wa Kiswahili.
- source_word: לִבְנֵי אֶפְרָיִם
  choice: ulikuwa wa wana wa Efraimu
  rationale: ל inaonyesha milki au mgao, na ‘wana wa Efraimu’ huhifadhi usemi wa ukoo wa Kiebrania bila kuubadili kuwa ‘Waefraimu.’
