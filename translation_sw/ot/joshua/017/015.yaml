base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/015.yaml
  text: Joshua said to them[a], “If you are a numerous people, go up to the forest and clear land for yourselves there in the land of the Perizzites and the Rephaim[b], since the hill country of Ephraim is too narrow for you.”
translation:
  language: sw
  text: Yoshua akawaambia, “Ikiwa ninyi ni watu wengi, pandeni msituni, mkafyeke eneo huko kwa ajili yenu[a], katika nchi ya Waperizi na Warefai, kwa kuwa nchi ya vilima ya Efraimu[b] ni finyu mno kwenu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkafyeke msitu huko kwa ajili yenu.” Kitenzi cha Kiebrania kinamaanisha kufyeka au kusafisha eneo lenye miti.
    reason: lexical_alternative
  - marker: b
    text: “Nchi ya vilima ya Efraimu” inaweza pia kutafsiriwa “Mlima Efraimu”; hapa jina hilo linarejelea nyanda za juu walizopewa Waefraimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם רַב
  choice: watu wengi
  rationale: Kirai hiki kinaonyesha wingi wa idadi. “Watu wengi” ni Kiswahili cha kawaida na kinaendeleza dai lao kwamba walikuwa wengi.
- source_word: עֲלֵה לְךָ הַיַּעְרָה
  choice: pandeni msituni
  rationale: Kitenzi kinaonyesha kwenda juu au kuelekea eneo la msitu. Wingi umetumiwa kwa kuwa Yoshua analiambia kundi, ingawa Kiebrania kinatumia umoja wa kijumla.
- source_word: וּבֵרֵאתָ לְךָ שָׁם
  choice: mkajisafishie eneo huko
  rationale: Katika kauli hii, ברא katika Piel humaanisha kusafisha eneo lenye miti. “Jisafishie eneo” linaonyesha pia maana ya manufaa iliyo katika לְךָ.
- source_word: בְּאֶרֶץ הַפְּרִזִּי וְהָרְפָאִים
  choice: katika nchi ya Waperizi na Warefai
  rationale: Majina ya makundi yote mawili yameandikwa kwa namna inayolingana na mfumo wa majina ya watu katika Kiswahili, bila kutafsiri Warefai kwa maana ya kimafundisho au ya kimaumbile.
- source_word: כִּי אָץ לְךָ
  choice: kwa kuwa ... ni finyu mno kwenu
  rationale: Neno hili linaonyesha kubanwa au kukosa nafasi ya kutosha; “ni finyu mno kwenu” linaeleza kwa kawaida kwamba eneo walilo nalo halikutosha kwa idadi yao.
- source_word: הַר אֶפְרָיִם
  choice: eneo la milima la Efraimu
  rationale: Katika muktadha wa ugawaji wa nchi, הַר linarejelea eneo la nyanda za juu au milima, si lazima kilele kimoja.
