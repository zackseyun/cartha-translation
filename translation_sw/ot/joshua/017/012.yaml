translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Wazao wa Manase’ hutambulisha kabila kwa uwazi, na ‘wakang’ang’ania’ huhifadhi wazo la azimio lenye kuendelea huku tanbihi ikibakiza umoja wa Kiebrania na maana mbadala ya kitenzi.
