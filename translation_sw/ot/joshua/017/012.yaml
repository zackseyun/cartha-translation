  text: But the sons of Manasseh were not able to dispossess these cities[a], and the Canaanites persisted in dwelling in this land.
translation:
  language: sw
  text: Lakini wazao wa Manase hawakuweza kuwaondoa wenyeji wa miji hiyo, nao Wakanaani wakadhamiria kukaa katika nchi hiyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mkanaani alikubali kukaa katika nchi hiyo.” Kiebrania kinatumia nomino ya umoja yenye maana ya kundi, pamoja na kitenzi kinachoweza kumaanisha kuwa tayari au kudhamiria.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: hawakuweza
  rationale: Hueleza kutokuwa na uwezo wa kutimiza jambo, bila kugeuza maana kuwa kutotaka tu.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: wazao wa Manase
  rationale: Ingawa maana halisi ni ‘wana wa Manase,’ hapa kirai hicho kinataja kundi la kikabila; ‘wazao’ ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: לְהוֹרִישׁ אֶת הֶעָרִים הָאֵלֶּה
  choice: kuwaondoa wenyeji wa miji hiyo
  rationale: Hifili ya ירש katika muktadha huu humaanisha kuwanyang’anya waliokuwapo eneo lao au kuwafukuza. Kwa kuwa Kiebrania hutumia ‘miji’ kimajazi kama kitu kinachoondolewa, tafsiri hii huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: וַיּוֹאֶל
  choice: wakang’ang’ania
  rationale: Kitenzi kinaweza kuonyesha hiari, azimio, au kusisitiza kufanya jambo. Katika muktadha huu, ‘wakang’ang’ania’ huonyesha kuazimia kuendelea kuwapo bila kudai kwamba tendo lilirudiwa mara nyingi.
- source_word: הַכְּנַעֲנִי
  choice: Wakanaani
  rationale: Nomino iko katika umoja wa kimofolojia lakini inatumika kwa maana ya kundi; wingi ni wa kawaida na wazi katika Kiswahili.
- source_word: לָשֶׁבֶת
  choice: kukaa
  rationale: Hueleza kuishi au kudumu mahali; ‘kukaa’ ni neno la kawaida linalofaa hapa.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: katika nchi hiyo
  rationale: אֶרֶץ hapa ni eneo linalozungumziwa, si dunia kwa ujumla; ‘nchi’ huwasilisha maana ya eneo hilo kwa kawaida.
