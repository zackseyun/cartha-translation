source:
  edition: WLC
  text: וְ/לִ/צְלָפְחָד֩ בֶּן חֵ֨פֶר בֶּן גִּלְעָ֜ד בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֗ה לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔י/ו מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/003.yaml
  text: 'Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, had no sons, but only daughters; and these are the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: sw
  text: Selofehadi, mwana wa Heferi, mwana wa Gileadi, mwana wa Makiri, mwana wa Manase, hakuwa na wana wa kiume, bali alikuwa na mabinti tu. Majina ya mabinti zake yalikuwa Mahla, Noa[a], Hogla, Milka na Tirsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Noa huyu ni binti ya Selofehadi, si yule mwanamume anayetajwa katika kitabu cha Mwanzo.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/צְלָפְחָד
  choice: Selofehadi
  rationale: Kiunganishi וְ pamoja na לִ לפני ya jina kinatanguliza habari ya Selofehadi katika muktadha huu. Kiswahili cha kawaida hakihitaji kuongeza neno la wakati kama “sasa”; jina linaweza kuanza sentensi moja kwa moja.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: mwana wa ... mwana wa ... mwana wa ... mwana wa
  rationale: Kurudiwa kwa “mwana wa” kunahifadhi wazi mnyororo wa ukoo uliomo katika Kiebrania, ambao ni muhimu katika habari ya urithi.
- source_word: לֹא הָיוּ לוֹ בָּנִים
  choice: hakuwa na wana wa kiume
  rationale: Hii inaonyesha wazi kuwa Selofehadi hakuwa na watoto wa kiume, bila kupanua maana kuwa hakuwa na watoto kabisa; utofauti na mabinti ndio hoja ya kifungu.
- source_word: כִּי אִם בָּנוֹת
  choice: bali alikuwa na mabinti tu
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida na kwa wazi utofauti na upekee unaowasilishwa na כִּי אִם baada ya ukanushaji.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: Majina ya mabinti zake yalikuwa
  rationale: Ni utangulizi wa kawaida wa orodha ya majina katika Kiswahili cha masimulizi na unahifadhi uhusiano wa mabinti hao na Selofehadi.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: Mahla, Noa, Hogla, Milka na Tirsa
  rationale: Majina yamenukuliwa kwa maumbo yanayotambulika na wasomaji wa Biblia ya Kiswahili huku yakifuata kwa karibu matamshi ya Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Wana wa kiume” imetumiwa ili kudumisha utofauti wa Kiebrania kati ya wana na mabinti bila kuleta utata wa neno “wana” katika matumizi ya kisasa.
