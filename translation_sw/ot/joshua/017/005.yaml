  yaml_path: translation/ot/joshua/017/005.yaml
  text: Ten portions fell to Manasseh[a], besides the land of Gilead and Bashan, which is beyond the Jordan.
translation:
  language: sw
  text: Manase alipata sehemu kumi, bila kuhesabu nchi ya Gileadi na Bashani, iliyokuwa ng’ambo ya Yordani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: akapata
  rationale: Katika muktadha wa kugawa nchi kwa kura, נפל ni nahau inayoonyesha sehemu iliyomwangukia au kumpata mhusika. Kiswahili cha kawaida husema ‘akapata’ kwa maana hii, bila kudai kwamba ardhi ilianguka kihalisi.
- source_word: חַבְלֵי
  choice: sehemu
  rationale: חבל inaweza kumaanisha eneo lililopimwa au sehemu iliyogawiwa. ‘Sehemu’ ni ya kawaida, wazi, na haibainishi kupita kiasi namna ya ugawaji.
- source_word: מְנַשֶּׁה
  choice: Manase
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: עֲשָׂרָה
  choice: kumi
  rationale: Ni tafsiri ya moja kwa moja ya namba ya msingi.
- source_word: לְבַד
  choice: mbali na
  rationale: Katika muundo huu neno linaonyesha kwamba sehemu kumi zilikuwa tofauti na nchi ya mashariki ya Yordani ambayo tayari ilikuwa mali ya Manase.
- source_word: מֵאֶרֶץ
  choice: nchi ya
  rationale: Baada ya לְבַד, מן linafanya kazi ya kuonyesha kile kilichotengwa na hesabu ya sehemu kumi; ‘mbali na nchi ya’ ni Kiswahili cha asili.
- source_word: הַגִּלְעָד וְהַבָּשָׁן
  choice: Gileadi na Bashani
  rationale: Maumbo haya ya majina ya maeneo yanaeleweka na yamezoeleka katika Biblia za Kiswahili.
- source_word: אֲשֶׁר מֵעֵבֶר לַיַּרְדֵּן
  choice: iliyokuwa ng’ambo ya Yordani
  rationale: Kiwakilishi cha umoja kinarejelea kwa pamoja ‘nchi ya Gileadi na Bashani.’ ‘Ng’ambo ya Yordani’ huhifadhi mtazamo wa kijiografia wa maandishi bila kuongeza upande wa mashariki usiotajwa wazi katika mstari huu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akapata sehemu kumi’ ni cha kueleweka kwa wasomaji wa kawaida, huku tanbihi ikihifadhi nahau ya Kiebrania na uhusiano wake na ugawaji kwa kura.
