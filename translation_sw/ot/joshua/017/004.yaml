  text: וַ/תִּקְרַ֡בְנָה לִ/פְנֵי֩ אֶלְעָזָ֨ר הַ/כֹּהֵ֜ן וְ/לִ/פְנֵ֣י יְהוֹשֻׁ֣עַ בִּן נ֗וּן וְ/לִ/פְנֵ֤י הַ/נְּשִׂיאִים֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה אֶת מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ נַחֲלָ֖ה בְּ/ת֣וֹךְ אַחֵ֑י/נוּ וַ/יִּתֵּ֨ן לָ/הֶ֜ם אֶל פִּ֤י יְהוָה֙ נַֽחֲלָ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אֲבִי/הֶֽן׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/004.yaml
  text: So they came near before Eleazar the priest[a], and before Joshua son of Nun, and before the leaders, saying, “Yahweh commanded Moses to give us an inheritance among our brothers.” So he gave them, according to the command of Yahweh[c][b], an inheritance among their father's brothers.
translation:
  language: sw
  text: Basi wakakaribia mbele ya Eleazari kuhani, mbele ya Yoshua mwana wa Nuni, na mbele ya viongozi, wakisema, “Yahwe alimwamuru Musa atupe urithi miongoni mwa ndugu zetu[a].” Naye, kwa agizo la Yahwe[c], akawapa urithi miongoni mwa ndugu wa baba yao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ndugu zetu wa kiume.” Binti hao waliomba sehemu katika urithi uliogawiwa wanaume wa ukoo wao.'
    reason: cultural_note
  - marker: b
    text: Yaani, miongoni mwa ndugu wa kiume wa baba yao, ndani ya ukoo wa upande wa baba.
    reason: cultural_note
  - marker: c
    text: Kwa tafsiri ya neno kwa neno, “kulingana na kinywa cha Yahwe,” nahau yenye maana ya “kwa agizo la Yahwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: wakakaribia
  rationale: Kitenzi kiko katika nafsi ya tatu, wingi wa kike, na kinawarejelea binti waliotajwa katika muktadha. ‘Wakakaribia’ ni Kiswahili cha kawaida kinachohifadhi wazo la kujitokeza mbele ya wenye mamlaka.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Kirai hiki kimerudiwa mara tatu na kinaonyesha kufika rasmi mbele ya viongozi. ‘Mbele ya’ kinahifadhi muundo huo wa Kiebrania kwa Kiswahili cha asili.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Hili ndilo neno la kawaida na sahihi la cheo כֹּהֵן.
- source_word: הַנְּשִׂיאִים
  choice: viongozi
  rationale: Katika muktadha huu neno linamaanisha viongozi wa makabila au jamii; ‘viongozi’ linaeleweka kwa urahisi bila kudokeza ufalme.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Hiki ni kitenzi-jina kinachoanzisha usemi wa moja kwa moja. ‘Wakisema’ kinafuata mtiririko wa simulizi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limewasilishwa kama jina binafsi, si kubadilishwa na cheo.
- source_word: צִוָּה אֶת־מֹשֶׁה
  choice: alimwamuru Musa
  rationale: צוה huonyesha amri yenye mamlaka; ‘alimwamuru Musa’ linaonyesha nguvu hiyo wazi.
- source_word: לָתֶת לָנוּ נַחֲלָה
  choice: atupe urithi
  rationale: נַחֲלָה hapa ni sehemu ya ardhi inayorithiwa. ‘Atupe urithi’ ni fupi, ya kawaida, na sahihi katika muktadha wa ugawaji wa nchi.
- source_word: בְּתוֹךְ אַחֵינוּ
  choice: miongoni mwa ndugu zetu
  rationale: ‘Miongoni mwa’ huonyesha kuingizwa katika sehemu ya ukoo. ‘Ndugu zetu’ huhifadhi neno la undugu bila kulazimisha katika matini kuu maana pana kuliko iliyo katika Kiebrania; maelezo ya jinsia yanawekwa katika tanbihi.
- source_word: וַיִּתֵּן
  choice: Naye akawapa
  rationale: Kitenzi cha Kiebrania ni umoja. Kiswahili kinahifadhi umoja bila kutaja wazi mhusika, kwa kuwa Yoshua ndiye rejeo linalowezekana lakini matini haisemi jina lake tena.
- source_word: אֶל־פִּי יְהוָה
  choice: kulingana na agizo la Yahwe
  rationale: Nahau hiyo kwa herufi ni ‘kulingana na kinywa cha Yahwe,’ lakini hapa ina maana ya kutenda kwa mujibu wa agizo lake.
- source_word: אֲחֵי אֲבִיהֶן
  choice: ndugu za baba yao
  rationale: Tafsiri hii huhifadhi uhusiano maalumu wa upande wa baba badala ya kuufanya kuwa ‘jamaa’ kwa ujumla.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Matini ya Kiebrania ina jina binafsi la Mungu. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Lugha ya kijinsia katika אַחֵינוּ
  choice: ndugu zetu, pamoja na tanbihi kuwa Kiebrania kinamaanisha ndugu wa kiume
  alternative: ndugu zetu wa kiume
  rationale: Neno la Kiswahili ‘ndugu’ halibainishi jinsia lenyewe. Tanbihi huhifadhi umaalumu wa Kiebrania na muktadha wa madai ya binti bila kufanya sentensi kuu kuwa nzito.
- issue: Umahususi wa אֲחֵי אֲבִיהֶן
  choice: ndugu za baba yao
  alternative: jamaa zao
  rationale: Kiebrania kinataja wazi ndugu wa baba, hivyo tafsiri haipaswi kufifisha muundo wa ukoo wa upande wa baba.
- issue: Mhusika wa וַיִּתֵּן
  choice: Naye akawapa
  alternative: Yoshua akawapa
  rationale: Kitenzi ni cha umoja na huenda kinamrejelea Yoshua, lakini jina lake halijarudiwa katika Kiebrania. Kiwakilishi cha Kiswahili kinahifadhi kiwango hicho cha kutotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa sasa, na unaosomeka kwa urahisi. Marudio ya ‘mbele ya’ yamehifadhiwa ili kuonyesha mazingira rasmi ya kujitokeza mbele ya wenye mamlaka. ‘Naye akawapa’ huepuka kutatua kimya kimya utata mdogo kuhusu mhusika wa kitenzi.
