base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/014.yaml
  text: Then the sons of Joseph spoke to Joshua[a], saying, “Why have you given me one lot and one portion as an inheritance, though I am a numerous people, since Yahweh has blessed me until now?”
translation:
  language: sw
  text: Kisha wana wa Yosefu wakamwambia Yoshua, “Kwa nini umenipa kura moja na sehemu moja kuwa urithi, ilhali mimi ni taifa lenye watu wengi, kwa kuwa Yahwe amenibariki mpaka sasa?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבְּרוּ בְּנֵי יוֹסֵף אֶת יְהוֹשֻׁעַ לֵאמֹר
  choice: wana wa Yosefu wakamwambia Yoshua
  rationale: Muundo wa Kiebrania ‘walisema ... wakisema’ umeunganishwa kwa Kiswahili cha kawaida kuwa ‘wakamwambia,’ huku ‘wana wa Yosefu’ ikihifadhi jina la pamoja la makabila yaliyotokana na Yosefu.
- source_word: נָתַתָּה לִּי
  choice: umenipa
  rationale: Umoja wa nafsi ya kwanza umehifadhiwa kwa sababu kundi zima linajisemea kama nafsi moja.
- source_word: נַחֲלָה גּוֹרָל אֶחָד
  choice: urithi wa kura moja tu
  rationale: ‘Urithi’ hapa ni ardhi iliyogawiwa, na ‘kura’ inaonyesha njia au fungu la mgao; ‘tu’ huonyesha mkazo wa malalamiko uliomo katika ‘moja.’
- source_word: וְחֶבֶל אֶחָד
  choice: na sehemu moja tu
  rationale: חֶבֶל inaweza kumaanisha sehemu ya ardhi iliyopimwa au eneo. ‘Sehemu’ ni ya kawaida na hudumisha tofauti yake na ‘kura.’
- source_word: וַאֲנִי עַם רָב
  choice: ilhali mimi ni watu wengi
  rationale: ‘Ilhali’ huonyesha tofauti iliyo katika malalamiko. Kiswahili kisicho cha kawaida kidogo ‘mimi ni watu wengi’ kimehifadhiwa kwa makusudi ili kuonyesha kundi linalojinena kwa umoja kama katika Kiebrania.
- source_word: עַד אֲשֶׁר עַד כֹּה בֵּרְכַנִי
  choice: kwa kuwa ... amenibariki mpaka sasa
  rationale: Usemi huu uliobanwa unaonyesha sababu na baraka zilizoendelea hadi wakati huo; tafsiri haiongezi wazo la kiwango ambacho hakijaelezwa wazi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa umbo la Kiswahili ‘Yahwe,’ badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana Tetragramatoni, jina binafsi la Mungu; kulihifadhi kama ‘Yahwe’ hutofautisha jina hilo na cheo ‘Bwana.’
- issue: Kundi kujisemea kwa umoja
  choice: mimi ni watu wengi
  alternative: sisi ni watu wengi
  rationale: Kiebrania hutumia viambishi vya umoja huku ‘wana wa Yosefu’ wakizungumza kama kundi moja. Umoja umehifadhiwa ili kutoondoa mvutano huo wa kisarufi na wa pamoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wakamwambia’ ni ya asili kuliko kunakili marudio ya Kiebrania ‘wakasema ... wakisema.’ Neno ‘ilhali’ linaweka wazi tofauti ya kimantiki bila kuibadili kuwa hitimisho la kitheolojia.
