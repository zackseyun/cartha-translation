  text: And Balaam son of Beor[a], the diviner, the sons of Israel killed with the sword among their slain.
translation:
  language: sw
  text: Nao wana wa Israeli walimuua Balaamu, mwana wa Beori, yule mwaguzi, kwa upanga, pamoja na wengine waliowaua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwa watu waliowaua.” Kishazi cha Kiebrania mwishoni mwa aya si cha kawaida sana; kinaonyesha kwamba Balaamu aliuawa kwa kuhusishwa na watu wengine waliouawa na Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: Nao
  rationale: וְ inaongeza Balaamu katika muhtasari wa waliouawa; kiambishi cha Kiswahili “Nao” kinaonyesha mwendelezo huo, huku אֶת ikiwa alama ya yambwa isiyohitaji kutafsiriwa kivyake.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Balaamu mwana wa Beori
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia, na patronimu ya Kiebrania imetafsiriwa moja kwa moja.
- source_word: הַקּוֹסֵם
  choice: yule mwaguzi
  rationale: קֹסֵם humaanisha mtu anayefanya uaguzi. “Mwaguzi” ni neno fupi, la sasa, na lenye maana inayofaa katika muktadha huu; “yule” huonyesha kuwa ni maelezo ya Balaamu.
- source_word: הָרְגוּ בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli walimuua
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi wazi mtendaji na mtendewa. “Wana wa Israeli” hudumisha muundo wa Kiebrania kuliko “Waisraeli.”
- source_word: בַּחֶרֶב
  choice: kwa upanga
  rationale: Hii ni tafsiri ya kawaida ya beth ya chombo na inaeleza njia ya kuuawa bila kuongeza maelezo yasiyokuwamo.
- source_word: אֶל חַלְלֵיהֶם
  choice: pamoja na watu waliowaua
  rationale: Kishazi hiki kisicho cha kawaida kinaonyesha kuhusishwa kwa Balaamu na wengine waliouawa na Israeli. “Pamoja na” ni Kiswahili cha asili, huku tanbihi ikihifadhi uwezekano wa maana ya “miongoni mwa.”
