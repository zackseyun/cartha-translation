base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/005.yaml
  text: and the land of the Gebalites[a], and all Lebanon toward the sunrise, from Baal-gad below Mount Hermon to Lebo-hamath,
translation:
  language: sw
  text: na nchi ya Wagebali, na Lebanoni yote upande wa mashariki, kuanzia Baal-gadi chini ya Mlima Hermoni mpaka Lebo-hamathi[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka kwenye njia ya kuingilia Hamathi.” Kiebrania kinaweza kueleweka kuwa maelezo ya mpaka badala ya jina maalumu la mahali.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאָרֶץ הַגִּבְלִי
  choice: nchi ya Wagebali
  rationale: Kirai hiki kinataja eneo la watu waliohusishwa na Gebali. “Nchi ya Wagebali” ni Kiswahili cha kawaida kinachohifadhi uhusiano na jina la mahali.
- source_word: כָל הַלְּבָנוֹן
  choice: Lebanoni yote
  rationale: Huhifadhi maana ya ujumla ya כָל na kulitaja eneo la Lebanoni kwa namna fupi na ya kawaida.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: upande wa mashariki
  rationale: Nahau hiyo ina maana halisi inayohusiana na mawio ya jua, lakini katika maelezo haya ya mipaka inaonyesha upande wa mashariki. Tafsiri hii ni wazi na ya kawaida kwa msomaji wa Kiswahili.
- source_word: מִבַּעַל גָּד
  choice: kuanzia Baal-gadi
  rationale: מִן huonyesha mwanzo wa mpaka; “kuanzia” linaeleza kazi hiyo kwa kawaida, huku jina la mahali likinakiliwa.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: chini ya Mlima Hermoni
  rationale: Hueleza mahali palipo chini kwa kulinganishwa na mlima bila kubainisha zaidi topografia ambayo Kiebrania hakubainishi.
- source_word: עַד לְבוֹא חֲמָת
  choice: mpaka Lebo-hamathi
  rationale: Kirai kinaweza kueleweka kama jina la mahali linalotumika kama mpaka. Jina hilo limehifadhiwa katika matini, na uwezekano wa maana ya maelezo umewekwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo wa heshima, wazi, na wa kisasa. Muundo wa orodha ya maeneo na mipaka umehifadhiwa kwa kuwa aya hii inaendelea kutoka muktadha uliotangulia. Alama ya tanbihi imewekwa baada ya “Lebo-hamathi,” ambako tofauti ya usomaji inahusika.
