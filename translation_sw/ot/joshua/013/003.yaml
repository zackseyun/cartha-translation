base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/003.yaml
  text: 'from the Shihor, which is east of Egypt, as far as the border of Ekron to the north—it is counted as Canaanite territory—the five rulers of the Philistines: the Gazite, the Ashdodite, the Ashkelonite, the Gittite, and the Ekronite, and the Avvim.'
translation:
  language: sw
  text: 'kuanzia Shihori, ulio mbele ya Misri, hadi mpaka wa Ekroni kuelekea kaskazini—eneo hilo huhesabiwa kuwa la Wakanaani—watawala watano wa Wafilisti: wa Gaza, wa Ashdodi, wa Ashkeloni, wa Gathi na wa Ekroni; na Waavi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיחוֹר
  choice: Shihori
  rationale: Jina la mahali limeandikwa kwa mwandiko wa Kiswahili badala ya kutafsiriwa; utambulisho wake kamili haujaelezwa katika mstari.
- source_word: עַל־פְּנֵי מִצְרַיִם
  choice: ulio upande wa mashariki wa Misri
  rationale: Katika muktadha huu usemi wa kijiografia unaelekea kutaja upande wa mbele/mashariki wa Misri, ingawa kwa neno kwa neno ni ‘mbele ya Misri’.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: watawala ... wa Wafilisti
  rationale: Seren ni cheo cha kipekee cha watawala wa miji ya Wafilisti; ‘watawala’ ni neno la kawaida lisilodokeza mfumo wa kifalme usiotajwa.
- source_word: הָעַזָּתִי ... הָעֶקְרוֹנִי
  choice: wa Gaza ... wa Ekroni
  rationale: Majina haya ya kiwakilishi yanaonyesha watawala/maeneo yanayohusishwa na miji hiyo; muundo wa ‘wa [mji]’ ni wa asili zaidi katika Kiswahili.
- source_word: הָעַוִּים
  choice: Waavi
  rationale: Jina la kundi la watu limetoholewa bila kulifananisha na kundi jingine.
theological_decisions:
- issue: Kuhesabiwa kuwa la Wakanaani
  choice: eneo hilo huhesabiwa kuwa la Wakanaani
  alternative: huhesabiwa kuwa Mkanaani
  rationale: Kiebrania kina umoja wa kijumla ‘kwa Mkanaani’; Kiswahili cha eneo la Wakanaani huhifadhi maana ya uainishaji wa kikabila/kieneo bila kuifanya kuwa mtu mmoja.
- issue: Uhusiano wa ‘Waavi’ na orodha
  choice: pamoja na Waavi
  alternative: Waavi kama kundi la sita chini ya watawala watano
  rationale: Sintaksia ya mwisho ni fupi na ina utata kuhusu uhusiano kamili wa Waavi na orodha; ‘pamoja na’ huwahusisha bila kutatua kimabavu muundo huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Dashi ndefu zinatenga maelezo ya mabano; majina ya maeneo yametoholewa kwa maumbo yaliyozoeleka katika Kiswahili.
