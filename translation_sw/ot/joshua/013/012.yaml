base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/012.yaml
  text: all the kingdom of Og in Bashan[a], who reigned in Ashtaroth and in Edrei—he was left of the remnant of the Rephaim. Moses struck them down and dispossessed them.
translation:
  language: sw
  text: ufalme wote wa Ogu katika Bashani, ambaye alitawala katika Ashtarothi na Edrei—alikuwa amesalia miongoni mwa Warefai waliosalia.[a] Musa aliwapiga na kuwanyang’anya milki yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “majitu.” Kiebrania ni “Warefai,” huenda likiwa jina la kundi la watu wa kale.
    reason: Neno la Kiebrania linaweza kuhifadhiwa kama jina la watu au kufasiriwa kuwa maelezo ya majitu.
lexical_decisions:
- source_word: כָּל מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: ufalme wote wa Ogu huko Bashani
  rationale: כָּל pamoja na nomino ya umoja מַמְלְכוּת inaonyesha eneo lote la ufalme wa Ogu; בַּבָּשָׁן ina maana ya mahali.
- source_word: אֲשֶׁר מָלַךְ
  choice: ambaye alitawala
  rationale: Kitenzi מלך hapa kinaeleza utawala wa kifalme wa Ogu kwa lugha ya kawaida na yenye heshima.
- source_word: בְּעַשְׁתָּרוֹת וּבְאֶדְרֶעִי
  choice: huko Ashtarothi na Edrei
  rationale: Majina ya mahali yametoholewa kwa tahajia inayosomeka kwa Kiswahili; kihusishi kinaonyesha mahali alipokuwa akitawala.
- source_word: הוּא נִשְׁאַר מִיֶּתֶר הָרְפָאִים
  choice: yeye alikuwa mmoja wa mabaki ya Warefai
  rationale: Muundo huu unaonyesha kwamba Ogu alikuwa amesalia kutoka miongoni mwa sehemu iliyobaki ya kundi hilo, bila kuongeza kwamba alikuwa peke yake.
- source_word: הָרְפָאִים
  choice: Warefai
  rationale: Neno limehifadhiwa kama jina la kundi la kale badala ya kufasiriwa moja kwa moja kuwa 'majitu'.
- source_word: וַיַּכֵּם
  choice: Musa aliwapiga
  rationale: נכה katika muktadha wa vita humaanisha kuwapiga au kuwashinda; 'aliwapiga' huhifadhi taswira ya kitenzi cha Kiebrania.
- source_word: וַיֹּרִשֵׁם
  choice: na kuwafukuza kutoka katika milki yao
  rationale: Hifili ya ירשׁ hapa ina maana ya kuwanyang’anya umiliki kwa kuwaondoa; tafsiri hii inaweka wazi maana ya kuwanyang’anya nchi bila kudokeza urithi.
theological_decisions:
- issue: Maana ya רְפָאִים
  choice: Warefai
  alternative: majitu
  rationale: Kiebrania kinaweza kutaja kundi la kale linalojulikana kwa jina hili. Kulihifadhi kama jina la watu huepuka kuamua kimyakimya kwamba neno lenyewe ni maelezo ya ukubwa wao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaoeleweka. Majina Ogu, Bashani na Ashtarothi yametoholewa kwa mfumo unaofaa matamshi ya Kiswahili. Alama ya tanbihi imewekwa baada ya neno linalofafanuliwa, “Warefai.”
