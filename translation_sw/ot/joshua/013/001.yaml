  text: וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו אַתָּ֤ה זָקַ֨נְתָּה֙ בָּ֣אתָ בַ/יָּמִ֔ים וְ/הָ/אָ֛רֶץ נִשְׁאֲרָ֥ה הַרְבֵּֽה מְאֹ֖ד לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/001.yaml
  text: Joshua was old[a], advanced in years, and Yahweh said to him, “You are old, advanced in years, and very much of the land remains to be possessed.”
translation:
  language: sw
  text: Yoshua alikuwa mzee, amesonga sana kiumri, naye Yahwe akamwambia, “Wewe ni mzee, umesonga sana kiumri, na nchi nyingi sana bado imesalia kuimiliki[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuirithi.” Kitenzi cha Kiebrania kinaweza kumaanisha kuitwaa nchi iwe milki au kuipokea kama urithi.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  choice: alikuwa mzee
  rationale: Ni usemi wa kihabari unaoeleza hali ya umri wa Yoshua; ‘alikuwa mzee’ ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: בָּא בַּיָּמִים
  choice: amesonga sana kiumri
  rationale: Nahau hii, kihalisi ‘ameingia katika siku,’ humaanisha kuwa na umri mkubwa. Tafsiri hii ni ya sasa na ya asili bila kutumia usemi wa kizamani.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lenye herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: אַתָּה זָקַנְתָּה בָּאתָ בַיָּמִים
  choice: Wewe ni mzee, umesonga sana kiumri
  rationale: Maneno ya Yahwe yanarudia maelezo ya msimulizi kwa kusisitiza; marudio hayo yamehifadhiwa kwa Kiswahili cha kawaida.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: ‘Nchi’ huhifadhi maana ya kijiografia na ya kiagano iliyo ya kawaida katika kitabu cha Yoshua.
- source_word: נִשְׁאֲרָה הַרְבֵּה מְאֹד
  choice: bado sehemu kubwa sana ... haijamilikiwa
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba kiasi kikubwa mno cha nchi kilikuwa bado kimesalia kuchukuliwa, huku ukihifadhi msisitizo wa הַרְבֵּה מְאֹד.
- source_word: לְרִשְׁתָּהּ
  choice: haijamilikiwa
  rationale: Katika muktadha huu ירשׁ inahusu Israeli kuichukua nchi iwe milki yao. Tafsiri haifungi maana kwenye urithi pekee; maana hiyo mbadala imeonyeshwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; ‘Yahwe’ hulihifadhi kwa kulitohowa moja kwa moja.
- issue: Maana ya ירשׁ kuhusu nchi
  choice: kumiliki/kutwaa iwe milki
  alternative: kurithi
  rationale: Muktadha unasisitiza nchi iliyobaki kuchukuliwa na Israeli, lakini kitenzi kinaweza pia kuwa na maana ya kurithi; uwezekano huo haujaondolewa bali umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya maelezo kuhusu uzee yamehifadhiwa kwa sababu yapo katika simulizi na katika hotuba ya Yahwe. Kiunganishi ‘naye’ kinabeba mtiririko wa וַ bila kuongeza kielezi cha wakati kisichokuwapo katika chanzo.
