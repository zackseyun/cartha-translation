  rationale: Jina la mahali limetoholewa; herufi שׂ hapa inawakilishwa kwa sauti ya s.
- source_word: צֶרֶת הַשַּׁחַר
  choice: Sereth-shahari
  rationale: Katika orodha hii ya miji, kirai limetazamwa kuwa jina ambatani la mahali na limetoholewa badala ya kutafsiri sehemu yake ya pili.
- source_word: בְּהַר הָעֵמֶק
  choice: juu ya kilima cha bondeni
  rationale: בְּ imetafsiriwa kwa maana ya mahali; הַר ni ‘kilima’ katika maelezo haya ya mandhari, na umbo ‘cha bondeni’ linatoa Kiswahili cha asili huku likihifadhi uhusiano na bonde.
