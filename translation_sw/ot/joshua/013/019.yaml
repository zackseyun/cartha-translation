lexical_decisions:
- source_word: קִרְיָתַיִם
  choice: Kiriathaimu
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili badala ya kutafsiriwa.
- source_word: שִׂבְמָה
