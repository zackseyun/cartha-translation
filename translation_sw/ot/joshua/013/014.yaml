  text: Only to the tribe of Levi he gave no inheritance[a]; the offerings by fire to Yahweh, the God of Israel, are his inheritance[b], as he spoke to him.
translation:
  language: sw
  text: Lakini hakulipa kabila la Lawi urithi; sadaka zinazotolewa kwa moto kwa Yahwe, Mungu wa Israeli, ndizo urithi wake[a], kama alivyomwambia.
  philosophy: optimal-equivalence
  footnotes:
