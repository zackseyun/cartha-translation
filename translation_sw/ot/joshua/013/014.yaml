lexical_decisions:
- source_word: רַק
  choice: Lakini
  rationale: Katika muktadha huu neno hilo linaweka kabila la Lawi kuwa tofauti na makabila yaliyotangulia; “Lakini” ni ya asili katika Kiswahili na huhifadhi nguvu ya kutenga.
- source_word: לְשֵׁבֶט הַלֵּוִי
  choice: kabila la Lawi
  rationale: Hili ndilo umbo la kawaida la Kiswahili kwa jina la kabila, huku kiambishi cha yambwa kikionyeshwa katika kitenzi “hakulipa.”
- source_word: לֹא נָתַן נַחֲלָה
  choice: hakulipa urithi wa ardhi
  rationale: “Urithi wa ardhi” huweka wazi kuwa מדובר kuhusu mgao wa nchi, bila kupanua maana hadi mali kwa ujumla.
- source_word: אִשֵּׁי יְהוָה
  choice: sadaka zinazotolewa kwa moto kwa Yahwe
  rationale: Tafsiri hii huhifadhi maana ya dhabihu zinazotolewa kwa moto na uhusiano wake na Yahwe, badala ya kuibadili kwa kufasiri kuwa chakula pekee.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja katika umbo linaloeleweka kwa Kiswahili.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Muundo huu wa kawaida wa Kiswahili huhifadhi kirai cha Kiebrania kinachomtambulisha Yahwe.
- source_word: הוּא נַחֲלָתוֹ
  choice: ndizo urithi wake
  rationale: “Ndizo” hurejelea sadaka zilizo karibu kisintaksia, huku umoja wa dhana ya urithi ukihifadhiwa.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: kama alivyomwambia
  rationale: Huhifadhi wazo la kusema bila kulifasiri moja kwa moja kuwa kuahidi; kiwakilishi cha umoja kinamrejelea Lawi kwa maana ya kijumuiya.
theological_decisions:
- issue: Asili ya urithi wa Lawi
  choice: sadaka zinazotolewa kwa moto kwa Yahwe ... ndizo urithi wake
  alternative: Yahwe, Mungu wa Israeli, ndiye urithi wake
  rationale: Mpangilio wa karibu wa sentensi unafanya sadaka kuwa rejeo la “ndizo urithi wake.” Hata hivyo, usomaji unaomfanya Yahwe mwenyewe kuwa urithi unajulikana kutokana na vifungu vya karibu, hivyo umehifadhiwa katika tanbihi bila kuondoa mvutano wa maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Urithi wa ardhi” huonyesha muktadha wa ugawaji wa nchi. Alama ya tanbihi [a] imewekwa baada ya dai linalohusika.
