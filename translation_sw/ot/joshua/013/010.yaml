lexical_decisions:
- source_word: וְ/כֹל
  choice: na ... yote
  rationale: Kiunganishi וְ kinaendeleza maelezo ya eneo kutoka mstari uliotangulia, huku כֹל kikionyesha ujumla.
- source_word: עָרֵי
  choice: miji
  rationale: Huu ni wingi wa hali ya uambatano wa עִיר; “miji” ni neno la kawaida na linalofaa katika orodha ya maeneo.
- source_word: סִיחוֹן
  choice: Sihoni
  rationale: Jina la mtu limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: מֶלֶךְ הָ/אֱמֹרִי
  choice: mfalme wa Waamori
  rationale: Tafsiri hii inahifadhi wazi uhusiano wa uambatano na maana ya Sihoni kuwa mfalme wa jamii hiyo.
- source_word: אֲשֶׁר מָלַךְ
  choice: aliyetawala
  rationale: Kitenzi מָלַךְ kinaonyesha kutawala kama mfalme; “aliyetawala” ni cha asili katika Kiswahili na muktadha tayari unataja cheo chake cha kifalme.
- source_word: בְּ/חֶשְׁבּוֹן
  choice: huko Heshboni
  rationale: Kihusishi בְ kinaonyesha mahali; “huko” huleta Kiswahili cha asili bila kubadili maana.
- source_word: עַד גְּבוּל
  choice: hadi mpaka wa
  rationale: עַד inaonyesha ukomo wa eneo, nao גְּבוּל ni mpaka.
- source_word: בְּנֵי עַמּוֹן
  choice: wana wa Amoni
  rationale: Tafsiri hii inahifadhi kwa karibu muundo wa Kiebrania unaomaanisha kihalisi “wana wa Amoni”; namna laini zaidi ya kutaja jamii imewekwa katika tanbihi.
