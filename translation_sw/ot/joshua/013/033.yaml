base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/033.yaml
  text: But to the tribe of Levi Moses gave no inheritance; Yahweh[a], the God of Israel, is their inheritance, just as he spoke to them.
translation:
  language: sw
  text: Lakini Musa hakulipa kabila la Lawi urithi wowote; Yahwe, Mungu wa Israeli, ndiye urithi wao, kama alivyowaambia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/שֵׁבֶט הַ/לֵּוִי
  choice: Lakini ... kabila la Lawi
  rationale: Kiunganishi kinaonyesha utofauti na mgao wa makabila yaliyotangulia; “kabila la Lawi” ni Kiswahili cha kawaida na humaanisha jamii ya kikabila, si Mlawi mmoja.
- source_word: לֹא נָתַן מֹשֶׁה
  choice: Musa hakulipa
  rationale: Kitenzi cha wakati uliopita na ukanushi kimetafsiriwa kwa mtiririko wa kawaida wa Kiswahili; kiambishi “-li-” kinarejelea kabila.
- source_word: נַחֲלָה / נַחֲלָתָם
  choice: urithi / urithi wao
  rationale: “Urithi” huhifadhi maana ya mgao wa ardhi pamoja na uzito wa lugha ya agano, na limetumiwa katika sehemu zote mbili kwa uthabiti.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Hii ni tafsiri ya kawaida na ya wazi ya muundo wa Kiebrania unaomtambulisha Mungu kwa uhusiano wake na Israeli.
- source_word: הוּא נַחֲלָתָם
  choice: ndiye urithi wao
  rationale: “Ndiye” huhifadhi msisitizo wa kiwakilishi cha Kiebrania na dai kwamba Yahwe mwenyewe ndiye urithi wao.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: kama alivyowaambia
  rationale: Hutafsiri tendo la kusema kwa Kiswahili cha asili bila kuongeza maana yenye nguvu zaidi ya “aliahidi.”
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi yana jina binafsi la Mungu; kulitohowa kama “Yahwe” hulihifadhi badala ya kuliwakilisha kwa cheo.
- issue: Asili ya urithi wa Lawi
  choice: Yahwe mwenyewe ndiye urithi wao
  alternative: Yahwe ndiye fungu lao
  rationale: Tafsiri inadumisha dai la moja kwa moja na mvutano wa kiteolojia wa Kiebrania, bila kulipunguza kuwa marupurupu ya kikuhani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Mpangilio umefanywa kuwa wa kawaida katika Kiswahili huku utofauti, msisitizo, na sitiari ya Kiebrania vikihifadhiwa.
