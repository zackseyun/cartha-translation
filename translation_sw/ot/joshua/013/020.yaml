  text: and Beth-peor[a], and the slopes of Pisgah, and Beth-jeshimoth.
translation:
  language: sw
  text: na Beth-Peori, na miteremko ya Pisga[a], na Beth-Yeshimothi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chemchemi za Pisga” au “vilima vya chini vya Pisga.” Neno la Kiebrania linaweza kueleweka kwa maana zaidi ya moja kuhusu sura ya eneo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית פְּעוֹר
  choice: Beth-Peori
  rationale: Ni jina la mahali; limetoholewa badala ya kutafsiriwa kuwa “nyumba ya Peori.” Umbo hili linafuata matumizi yanayotambulika katika Kiswahili cha Biblia.
- source_word: אַשְׁדּוֹת
  choice: miteremko
  rationale: Katika orodha hii ya maeneo, neno linaelekea kumaanisha sehemu za mlima zinazoteremka. “Miteremko” ni Kiswahili cha kawaida na huacha maana ya kijiografia ikiwa wazi.
- source_word: הַפִּסְגָּה
  choice: Pisga
  rationale: Hapa linatumika kama jina la eneo la kijiografia, hivyo limetoholewa badala ya kutafsiriwa kuwa “kilele.” Kibainishi cha Kiebrania hakihitaji kuwakilishwa katika muundo wa kawaida wa jina hili kwa Kiswahili.
- source_word: בֵית הַיְשִׁמוֹת
  choice: Beth-Yeshimothi
  rationale: Ni jina la mahali, hivyo limetoholewa badala ya kutafsiriwa kwa maana yake halisi. “Y” huwakilisha yod ya Kiebrania, na irabu ya mwisho hurahisisha matamshi ya Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi wa orodha ya maeneo. Kiunganishi “na” kimerudiwa ili kuhifadhi muundo wa Kiebrania. Alama ya tanbihi imewekwa baada ya “miteremko ya Pisga,” ambako utata wa neno אַשְׁדּוֹת unahusika.
