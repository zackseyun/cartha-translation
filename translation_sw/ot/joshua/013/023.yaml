  text: And the border of the sons of Reuben was the Jordan and its border. This was the inheritance of the sons of Reuben according to their clans[a], the cities and their villages.
translation:
  language: sw
  text: 'Mpaka wa wazao wa Reubeni ulikuwa Yordani pamoja na mpaka wake.[a] Huu ulikuwa urithi wa wazao wa Reubeni kwa koo zao: miji pamoja na vijiji vyake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “Yordani na mpaka.” Kirai hiki kifupi kinaweza kumaanisha kwamba Yordani ulikuwa mstari wa mpaka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ulikuwa
  rationale: Katika muundo huu wa kueleza mipaka, kitenzi kinaonyesha mpaka ulikuwa nini, si mchakato wa kuwa.
- source_word: גְּבוּל
  choice: mpaka
  rationale: Neno hili linafaa kwa mstari wa kijiografia unaotenga eneo.
- source_word: בְּנֵי רְאוּבֵן
  choice: wazao wa Reubeni
  rationale: Huhifadhi maana ya nasaba ya kabila kwa Kiswahili cha kawaida na chenye staha.
- source_word: הַיַּרְדֵּן וּגְבוּל
  choice: Yordani kama mpaka
  rationale: Kirai cha Kiebrania ni kifupi; tafsiri hii inaeleza kwa kawaida kwamba Mto Yordani ndio uliokuwa mstari wa mpaka.
- source_word: נַחֲלַת
  choice: urithi
  rationale: Ni istilahi inayofaa kwa sehemu ya nchi waliyopewa kabila.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Katika ugawaji wa kikabila, מִשְׁפָּחוֹת humaanisha koo zilizo ndani ya kabila, si familia ndogo tu.
- source_word: הֶעָרִים
  choice: miji
  rationale: Ni tafsiri ya kawaida ya עָרִים katika orodha za maeneo.
- source_word: וְחַצְרֵיהֶן
  choice: pamoja na vijiji vyake
  rationale: Neno hili humaanisha makazi madogo yaliyohusishwa na miji; kiambishi cha umilikaji kinarejelea miji.
