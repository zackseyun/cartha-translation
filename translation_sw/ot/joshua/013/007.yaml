  text: Now divide this land as an inheritance to the nine tribes and the half-tribe of Manasseh[a].
translation:
  language: sw
  text: Sasa igawanye nchi hii iwe urithi wa makabila tisa na wa nusu ya kabila la Manase.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na sasa igawanye nchi hii kuwa urithi wa makabila tisa na wa nusu ya kabila la Manase.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sasa
  rationale: Huanzisha amri inayofuata katika mfululizo. “Sasa” ni ya kawaida katika Kiswahili cha sasa; “Na sasa” pia inawezekana.
- source_word: חַלֵּק
  choice: igawanye
  rationale: Ni amri inayoelekezwa kwa Yoshua. “Igawanye” ni wazi na huhifadhi maana ya kugawa nchi miongoni mwa wapokeaji.
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: nchi hii
  rationale: Ni yambwa ya moja kwa moja inayorejelea nchi inayozungumziwa; “nchi” ni neno la kawaida na lenye upana unaofaa hapa.
- source_word: בְּנַחֲלָה
  choice: iwe urithi
  rationale: נַחֲלָה humaanisha urithi uliogawiwa, hasa ardhi ya makabila katika Yoshua. Usemi huu unatoa Kiswahili cha asili huku ukihifadhi dhana ya urithi.
- source_word: לְתִשְׁעַת הַשְּׁבָטִים
  choice: wa makabila hayo tisa
  rationale: Kihusishi kinaonyesha wapokeaji wa urithi; muundo “iwe urithi wa” ni wa kawaida katika Kiswahili.
- source_word: וַחֲצִי הַשֵּׁבֶט
  choice: na nusu ya kabila
  rationale: Huhifadhi kwa uwazi muundo wa Kiebrania na maana ya sehemu moja ya kabila.
- source_word: הַמְנַשֶּׁה
  choice: la Manase
  rationale: Jina la mtu na kabila limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
