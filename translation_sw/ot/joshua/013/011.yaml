  yaml_path: translation/ot/joshua/013/011.yaml
  text: and Gilead[a], and the territory of the Geshurite and the Maacathite, and all Mount Hermon[b], and all Bashan as far as Salecah—
translation:
  language: sw
  text: na Gileadi, na eneo la Wageshuri na Wamaakathi, na Mlima Hermoni wote[a], na Bashani yote mpaka Salka—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “Mlima Hermoni wote”; huenda usemi huu ukamaanisha safu au eneo lote la milima ya Hermoni, si kilele pekee.
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָד
  choice: Gileadi
  rationale: Jina la eneo limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia, bila kuhamisha kibainishi cha Kiebrania kisicho cha lazima mbele ya jina la mahali.
- source_word: גְבוּל
  choice: eneo
  rationale: Katika orodha hii ya maeneo, neno hili linaashiria milki au eneo la watu, si mstari wa mpaka tu.
- source_word: הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: Wageshuri na Wamaaka
  rationale: Nomino hizi za watu ziko katika umoja wa kijumla katika Kiebrania; Kiswahili cha asili hutumia maumbo ya wingi kwa makundi ya watu, huku yakitegemea neno moja ‘eneo’.
- source_word: כֹל הַר חֶרְמוֹן
  choice: Mlima Hermoni wote
  rationale: Huhifadhi maana ya msingi ya ‘mlima’ na nguvu ya כֹל; muktadha unaweza kuhusisha eneo lote la milima ya Hermoni, jambo linaloelezwa katika tanbihi.
- source_word: כָל הַבָּשָׁן
  choice: Bashani yote
  rationale: Huhifadhi ukamilifu unaoonyeshwa na כָל kwa lugha ya kawaida ya Kiswahili.
- source_word: עַד סַלְכָה
  choice: mpaka Saleka
  rationale: ‘Mpaka’ huonyesha kikomo cha eneo kwa wazi na kwa ufupi; Saleka ni utohozi unaosomeka kwa Kiswahili wa jina la mahali.
theological_decisions: []
