id: JOS.13.6
reference: Joshua 13:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כָּל יֹשְׁבֵ֣י הָ֠/הָר מִֽן הַ/לְּבָנ֞וֹן עַד מִשְׂרְפֹ֥ת מַ֨יִם֙ כָּל צִ֣ידֹנִ֔ים אָֽנֹכִי֙ אוֹרִישֵׁ֔/ם מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֠ק הַפִּלֶ֤/הָ לְ/יִשְׂרָאֵל֙ בְּֽ/נַחֲלָ֔ה כַּ/אֲשֶׁ֖ר צִוִּיתִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/006.yaml
  text: All the inhabitants of the hill country from Lebanon to Misrephoth-maim[a], all the Sidonians—I myself will drive them out before the sons of Israel. Only allot it to Israel as an inheritance[c][b], as I have commanded you.
translation:
  language: sw
  text: Wakazi wote wa nchi ya milima, kuanzia Lebanoni mpaka Misrefoth-maimu[a], Wasidoni wote—mimi mwenyewe nitawafukuza kutoka mbele ya wana wa Israeli[b]. Lakini uigawie Israeli nchi hiyo kama urithi[c], kama nilivyokuamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Misrefoth-maimu ni jina la mahali. Huenda jina hilo likawa na maana kama “mahali pa kuteketeza maji,” lakini maana yake kamili haijulikani kwa uhakika.
    reason: cultural_note
  - marker: b
    text: Au, “nitawaondoa kutoka mbele ya wana wa Israeli.”
    reason: lexical_alternative
  - marker: c
    text: Kiebrania “uigawie” hutumia nahau ya kugawa nchi, ambayo mara nyingi huhusishwa na kura.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי הָהָר
  choice: wakazi wote wa nchi ya milima
  rationale: Katika muktadha huu הָהָר inaonyesha eneo la kijiografia lenye milima, si mlima mmoja; “wakazi” hutafsiri kwa kawaida umbo la kishiriki יֹשְׁבֵי.
- source_word: מִן הַלְּבָנוֹן עַד מִשְׂרְפֹת מַיִם
  choice: kuanzia Lebanoni mpaka Misrefoth-maimu
  rationale: Majina yote mawili yametumiwa kama majina ya mahali. Jina מִשְׂרְפֹת מַיִם limetoholewa badala ya kupewa maana ya kubahatisha.
- source_word: כָּל צִידֹנִים
  choice: yaani Wasidoni wote
  rationale: Kirai hiki kinataja kwa ujumla watu wa Sidoni na kinafafanua wakazi wanaozungumziwa; “wote” huhifadhi nguvu ya כָּל.
- source_word: אָנֹכִי אוֹרִישֵׁם
  choice: mimi mwenyewe nitawafukuza
  rationale: “Mimi mwenyewe” huhifadhi msisitizo wa kiwakilishi huru אָנֹכִי. Hiphil ya ירשׁ hapa ina maana ya kuwaondoa au kuwafukuza wakazi kutoka nchini.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: mbele ya wana wa Israeli
  rationale: Tafsiri hii huhifadhi picha ya Kiebrania ya kuondolewa kwao mbele ya mwendo wa Israeli, pamoja na usemi wa kifamilia “wana wa Israeli.”
- source_word: רַק
  choice: tu
  rationale: '“Tu” huonyesha kizuizi au mkazo wa agizo: Yoshua anapaswa kuigawa nchi licha ya kwamba Mungu ndiye atakayewafukuza wakazi.'
- source_word: הַפִּלֶהָ
  choice: gawa tu nchi hiyo kwa kura
  rationale: Hiphil ya נפל hapa ni nahau ya kugawa eneo kwa kuangusha au kupiga kura. “Nchi hiyo” huweka wazi rejeo la kiambishi cha kike cha umoja bila kuongeza kitu kisichodokezwa na muktadha.
- source_word: לְיִשְׂרָאֵל בְּנַחֲלָה
  choice: kwa Israeli iwe urithi wao
  rationale: נַחֲלָה ni milki inayokabidhiwa kama urithi; “urithi” huhifadhi maana yake ya kisheria na ya agano.
- source_word: כַּאֲשֶׁר צִוִּיתִיךָ
  choice: kama nilivyokuamuru
  rationale: Kauli hii inarejelea agizo la Mungu lililotolewa tayari kwa Yoshua; umbo la Kiswahili ni la kawaida na huhifadhi uhusiano huo wa wakati.
theological_decisions:
- issue: Tafsiri ya בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: Kiebrania kinatumia usemi wa kifamilia wenye maana halisi ya “wana wa Israeli.” Tafsiri imeuhifadhi bila kuubadili kimakusudi kuwa jina la taifa pekee.
- issue: Tafsiri ya נַחֲלָה katika ugawaji wa nchi
  choice: urithi
  alternative: milki; sehemu ya kumiliki
  rationale: Neno hili linawasilisha nchi kama sehemu iliyokabidhiwa Israeli, si eneo la kumiliki tu; “urithi” huhifadhi uzito huo bila kuongeza fundisho la dhehebu.
- issue: Uhusiano kati ya tendo la Mungu na wajibu wa Yoshua
  choice: Mungu atawafukuza wakazi, lakini Yoshua anaagizwa kuigawa nchi
  alternative: Kusema kwamba Yoshua ndiye atakayewafukuza kabla ya kuigawa
  rationale: 'Muundo wa mstari huhifadhi mvutano wa maandishi: Mungu anasisitiza tendo lake mwenyewe, huku Yoshua akiwajibika kuigawa nchi kama alivyoamriwa.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Majina ya mahali yametoholewa kwa namna inayosomeka kwa Kiswahili, huku nahau ya ugawaji kwa kura na msisitizo wa “mimi mwenyewe” vikihifadhiwa.
