base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/030.yaml
  text: 'Their territory was from Mahanaim: all Bashan[a], all the kingdom of Og king of Bashan[b], and all the villages of Jair that are in Bashan—sixty cities.'
translation:
  language: sw
  text: Eneo lao lilianzia Mahanaimu na kutia ndani Bashani yote, ufalme wote wa Ogu mfalme wa Bashani, na makazi yote ya Yairi[a] yaliyokuwa Bashani—miji sitini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Havoth-Yairi,” namna ya jadi ya kutohowa jina la Kiebrania la makazi haya.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  choice: Eneo lao
  rationale: Katika muktadha wa ugawaji wa nchi, neno hili linamaanisha eneo lililowekewa mipaka, si mstari wa mpaka pekee.
- source_word: מִמַּחֲנַיִם
  choice: lilianzia Mahanaimu
  rationale: Kihusishi מִן kinaonyesha mahali maelezo ya eneo yanapoanzia; jina la mahali limetoholewa kwa namna ya kawaida ya Kiswahili.
- source_word: כָּל הַבָּשָׁן
  choice: Bashani yote
  rationale: Huhifadhi nguvu jumuishi ya כָּל kwa Kiswahili cha kawaida na wazi.
- source_word: מַמְלְכוּת עוֹג מֶלֶךְ הַבָּשָׁן
  choice: ufalme wote wa Ogu mfalme wa Bashani
  rationale: מַמְלְכוּת ni ufalme au himaya; “ufalme” ni neno la kawaida na linalofaa hapa.
- source_word: חַוֹּת יָאִיר
  choice: vijiji vyote vya Yairi
  rationale: Kirai hiki kinataja makazi yaliyohusishwa na Yairi. “Vijiji” kinaeleweka kwa wasomaji wa sasa, huku umbo la jadi la jina likihifadhiwa katika tanbihi.
- source_word: אֲשֶׁר בַּבָּשָׁן
  choice: vilivyokuwa Bashani
  rationale: Kishazi hiki kinabainisha mahali vijiji hivyo vilipokuwa; wakati uliopita unafaa katika simulizi la kihistoria la ugawaji wa nchi.
- source_word: שִׁשִּׁים עִיר
  choice: jumla ya miji sitini
  rationale: עִיר inaweza kumaanisha mji wa ukubwa mbalimbali. “Jumla ya” huonyesha wazi kwamba sitini ni idadi ya vijiji au makazi yaliyotajwa.
