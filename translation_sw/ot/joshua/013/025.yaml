base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/025.yaml
  text: And their territory was Jazer[a], and all the cities of Gilead, and half the land of the Ammonites, as far as Aroer, which is opposite Rabbah.
translation:
  language: sw
  text: Eneo lao lilijumuisha Yaazeri, miji yote ya Gileadi, na nusu ya nchi ya Waamoni, mpaka Aroeri, inayokabili Raba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliyokuwa mbele ya Raba.” Kiebrania kihalisi kinasema “iliyokuwa mbele ya Raba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: Eneo lao lilikuwa
  rationale: Neno גְּבוּל linaweza kumaanisha mpaka au eneo. Kwa kuwa kifungu hiki kinataja maeneo yaliyokuwa ndani ya mgao, “eneo lao” ni Kiswahili cha kawaida kinachoeleza maana hiyo bila kupoteza dhana ya mipaka.
- source_word: יַעְזֵר
  choice: Yazeri
  rationale: Hili ni umbo la Kiswahili la jina la mahali hapo.
- source_word: וְכָל עָרֵי הַגִּלְעָד
  choice: miji yote ya Gileadi
  rationale: עָרֵי inaweza kumaanisha miji au makazi ya mjini; “miji” inafaa katika orodha rasmi ya maeneo.
- source_word: וַחֲצִי אֶרֶץ בְּנֵי עַמּוֹן
  choice: na nusu ya nchi ya Waamoni
  rationale: בְּנֵי עַמּוֹן ni usemi wa kawaida unaowataja Waamoni kama watu, na אֶרֶץ hapa ni nchi au eneo lao.
- source_word: עַד
  choice: mpaka
  rationale: Inaonyesha kikomo cha kijiografia kwa njia ya kawaida na iliyo wazi katika Kiswahili.
- source_word: עֲרוֹעֵר
  choice: Aroeri
  rationale: Hili ni umbo la Kiswahili la jina la mahali hapo.
- source_word: אֲשֶׁר עַל פְּנֵי רַבָּה
  choice: uliokuwa mkabala na Raba
  rationale: Nahau עַל־פְּנֵי inaweza kueleza mahali palipo mbele ya, panapoikabili, au palipo mkabala na mahali pengine. “Mkabala na” huhifadhi uhusiano wa kijiografia bila kuongeza upande wa dira ambao haukutajwa katika Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa urahisi. Majina ya mahali yametolewa kwa maumbo yaliyozoeleka katika Kiswahili. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika, si baada ya “Yazeri,” kwa sababu tanbihi inaeleza nahau ya Kiebrania kuhusu mahali Aroeri ilipokuwa.
