lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akawapa
  rationale: Katika muktadha wa kugawa nchi, kitenzi נתן kinaonyesha kutoa au kukabidhi sehemu. Kiswahili kinahitaji upatanisho wa wingi kwa wapokeaji, huku kitu kilichotolewa kikibaki hakikutajwa wazi kama katika Kiebrania.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: לְמַטֵּה גָד
  choice: kabila la Gadi
  rationale: מַטֶּה hapa humaanisha kabila, si fimbo, kwa sababu mstari unahusu ugawaji wa nchi kwa makabila.
- source_word: לִבְנֵי גָד
  choice: wazao wa Gadi
  rationale: Ingawa בְּנֵי humaanisha kihalisi ‘wana,’ katika usemi wa kikabila humaanisha wanajamii au wazao wa babu huyo. ‘Wazao wa Gadi’ ni ya kawaida na inajumuisha kundi zima bila kupoteza maana ya ukoo.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: מִשְׁפָּחָה katika muktadha wa mgawanyo wa kikabila ni koo au vikundi vya jamaa. ‘Kwa koo zao’ hudumisha maana ya ugawaji kulingana na koo.
