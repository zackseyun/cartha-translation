  text: But the sons of Israel did not drive out the Geshurites or the Maacathites, and Geshur and Maacath lived among Israel to this day.
translation:
  language: sw
  text: Lakini Waisraeli hawakuwafukuza Wageshuri wala Wamaaka; Geshuri na Maaka wakaishi kati ya Israeli hadi leo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Ni Kiswahili cha kawaida na cha asili kwa maana ya ‘wana wa Israeli’ kama jina la watu wote.
- source_word: הוֹרִישׁוּ
  choice: hawakuwafukuza
  rationale: Katika muktadha wa kuimiliki nchi, kitenzi hiki kinamaanisha kuwaondoa au kuwafukuza wakazi kutoka katika eneo lao.
- source_word: הַגְּשׁוּרִי ... הַמַּעֲכָתִי
  choice: Wageshuri ... Wamaaka
  rationale: Maumbo ya Kiswahili yanawatambulisha watu wa makundi haya, tofauti na majina ya maeneo yanayofuata.
- source_word: וַיֵּשֶׁב
  choice: wakaendelea kuishi
  rationale: Kitenzi cha umoja kinafuata majina ya pamoja Geshuri na Maaka; ‘wakaendelea kuishi’ hutoa kwa kawaida matokeo ya kutofukuzwa kwao bila kubadili maana.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: kati ya Israeli
  rationale: Huhifadhi Israeli kama jina la taifa/jamii, huku kikieleza kwamba makundi hayo yaliishi miongoni mwao.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hadi leo
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi mtazamo wa wakati wa msimuliaji.
