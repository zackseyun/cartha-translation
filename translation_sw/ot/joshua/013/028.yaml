translation:
  language: sw
  text: Huu ndio ulikuwa urithi wa wazao wa Gadi kulingana na koo zao—miji na vijiji vyake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huu ndio urithi wa wazao wa Gadi kulingana na koo zao—miji na vijiji vyake.” Kauli hii ya muhtasari katika Kiebrania inaweza kutafsiriwa kwa wakati wa sasa au uliopita.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Huo ndio ulikuwa
  rationale: Kiwakilishi cha kuonyesha cha kike katika Kiebrania kinarejelea urithi wa eneo uliotajwa kabla. Wakati uliopita unasikika kwa kawaida katika muhtasari huu wa simulizi, ingawa Kiebrania pia kinaweza kutafsiriwa kwa wakati wa sasa.
- source_word: נַחֲלַת
  choice: urithi
  rationale: Neno hili humaanisha sehemu ya milki iliyogawiwa na kurithiwa; “urithi” linahifadhi maana ya ardhi ya agano katika kitabu cha Yoshua.
- source_word: בְּנֵי גָד
  choice: wazao wa Gadi
  rationale: Hili ni jina rasmi la kikabila linalomaanisha watu waliotokana na Gadi. “Wazao wa Gadi” ni la asili katika Kiswahili na linaweka wazi uhusiano wa nasaba.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kulingana na koo zao
  rationale: Kiambishi ל hapa kinaonyesha ugawaji au uainishaji, na מִשְׁפָּחוֹת ni makundi ya ukoo ndani ya kabila.
- source_word: הֶעָרִים
  choice: miji
  rationale: עָרִים ni neno la kawaida kwa maeneo ya makazi yaliyotajwa katika orodha za ugawaji wa ardhi; “miji” ni tafsiri sanifu na wazi.
- source_word: וְחַצְרֵיהֶם
  choice: na vijiji vyake
  rationale: Katika kauli za mipaka na maeneo, חָצֵר humaanisha makazi madogo ya kandokando yaliyohusishwa na miji. Kiwakilishi cha umoja “vyake” kinarejelea urithi/eneo hilo kwa ujumla, huku “vijiji” likitoa maana ya kawaida katika Kiswahili.
