translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya maandiko. “Wazao wa Gadi” limetumiwa badala ya “wana wa Gadi” ili kuepuka dhana ya wana wa moja kwa moja pekee; alama ya tanbihi [a] imewekwa katika matini.
