base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/016.yaml
  text: Their border was from Aroer[a], which is on the edge of the Valley of the Arnon, and the city that is in the middle of the valley[b], and all the tableland as far as Medeba.
translation:
  language: sw
  text: Mpaka wao ulikuwa kuanzia Aroeri, ulioko ukingoni mwa Bonde la Arnoni[a], pamoja na mji ulioko katikati ya bonde, na nchi yote tambarare ya juu[b] hadi Medeba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukingoni mwa korongo la Arnoni.” Neno la Kiebrania nahal linaweza kumaanisha bonde, korongo, au njia ya maji.
    reason: lexical_alternative
  - marker: b
    text: Au “uwanda wote wa juu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: Mpaka wa eneo lao ulianzia
  rationale: גְּבוּל hutaja mpaka au eneo lenye mipaka. Kauli hii ya Kiswahili inaweka wazi kuwa mstari wa mpaka unaelezwa, huku ikibaki ya kawaida na inayoeleweka.
- source_word: מֵעֲרוֹעֵר
  choice: Aroeri
  rationale: Herufi ya mwisho imeongezwa kwa kufuata namna ya kawaida ya Kiswahili ya kuandika jina hili la mahali, huku מִן ikitafsiriwa kwa kitenzi ‘ulianzia’.
- source_word: אֲשֶׁר עַל שְׂפַת נַחַל אַרְנוֹן
  choice: ulioko ukingoni mwa Bonde la Arnoni
  rationale: שָׂפָה ni ‘ukingo,’ na נַחַל katika jiografia hii inaweza kutaja bonde au korongo lenye kijito. ‘Bonde’ ni neno la kawaida, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: וְהָעִיר אֲשֶׁר בְּתוֹךְ הַנַּחַל
  choice: ukatia ndani mji ulio katikati ya bonde hilo
  rationale: בְּתוֹךְ huonyesha kuwapo ndani au katikati. ‘Ukatia ndani’ hufanya uhusiano wa mji na eneo linaloorodheshwa ueleweke kwa Kiswahili bila kubadili mahali pake katikati ya bonde.
- source_word: וְכָל הַמִּישֹׁר
  choice: na nchi yote tambarare ya juu
  rationale: מִישׁוֹר hapa ni nchi tambarare ya nyanda za juu mashariki mwa Yordani; tafsiri hii huepuka dhana ya uwanda wa chini.
- source_word: עַל מֵידְבָא
  choice: hadi Medeba
  rationale: Katika maelezo ya mipaka, עַל inaweza kuonyesha eneo kufikia mahali fulani. ‘Hadi’ ni ya kawaida na wazi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Majina Aroeri, Arnoni, na Medeba yameandikwa kwa mtindo wa kawaida wa Kiswahili. Muundo umewekwa wa asili kadiri iwezekanavyo, huku ‘ukatia ndani’ ikisaidia kuonyesha kwa kawaida kwamba mji na nchi tambarare ni sehemu ya eneo linalotajwa.
