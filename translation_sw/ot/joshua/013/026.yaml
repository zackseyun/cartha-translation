lexical_decisions:
- source_word: וּ/מֵ/חֶשְׁבּוֹן
  choice: na kutoka Heshboni
  rationale: Kiunganishi ו pamoja na kihusishi מִן kina maana ya “na kutoka”; jina la mahali limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: עַד
  choice: mpaka
  rationale: Katika orodha ya mipaka, עַד huonyesha mwisho wa eneo au umbali unaofikiwa; “mpaka” ni ya kawaida na wazi kwa Kiswahili.
- source_word: רָמַת הַמִּצְפֶּה
  choice: Ramath-mispe
  rationale: Hili ni jina la mahali, hivyo limetoholewa badala ya kutafsiriwa kuwa “kilima cha mnara wa ulinzi.”
- source_word: וּ/בְטֹנִים
  choice: na Betonimu
  rationale: Ni jina la mahali lenye kiunganishi ו; limetoholewa kwa mtindo wa majina ya Biblia katika Kiswahili.
- source_word: וּ/מִֽ/מַּחֲנַיִם
  choice: na kutoka Mahanaimu
  rationale: Muundo una kiunganishi, kihusishi cha kutoka, na jina la mahali; vipengele hivyo vyote vimehifadhiwa.
- source_word: גְּבוּל
  choice: mpaka
  rationale: Katika muktadha wa ugawaji wa nchi, גְּבוּל ni mpaka wa eneo.
- source_word: לִדְבִר
  choice: wa Debiri
  rationale: Baada ya גְּבוּל, ל inaweza kueleza uhusiano wa mpaka na Debiri; “mpaka wa Debiri” ni Kiswahili laini, huku uwezekano wa maana ya mwelekeo ukihifadhiwa katika tanbihi.
