  text: and from Heshbon to Ramath-mizpeh and Betonim[a], and from Mahanaim to the border of Debir.
translation:
  language: sw
  text: na kutoka Heshiboni mpaka Ramath-mispe na Betonimu, na kutoka Mahanaimu hadi mpaka wa Debiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka kuelekea Debiri.” Muundo wa Kiebrania unaweza kuonyesha mwelekeo.
