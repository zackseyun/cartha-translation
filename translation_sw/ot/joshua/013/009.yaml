base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/009.yaml
  text: from Aroer, which is on the edge of the Arnon Valley, and the city that is in the middle of the valley, and all the tableland from Medeba to Dibon,
translation:
  language: sw
  text: kutoka Aroeri, ulio kwenye ukingo wa Bonde la Arnoni, na mji ulio katikati ya bonde hilo, pamoja na uwanda wote kutoka Medeba hadi Diboni,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵעֲרוֹעֵר
  choice: kutoka Aroeri
  rationale: Kiambishi מֵ־ kinaonyesha mahali pa kuanzia; Aroeri ni umbo la jina linalotumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: עַל שְׂפַת נַחַל אַרְנוֹן
  choice: kwenye ukingo wa Bonde la Arnoni
  rationale: שְׂפַת ni kihalisi 'mdomo/ukingo'; hapa linaonyesha mpaka wa bonde. נַחַל linaweza kumaanisha kijito au bonde lenye kijito; 'Bonde' linafaa katika maelezo haya ya kijiografia bila kulazimisha kwamba kinachokusudiwa ni maji pekee.
- source_word: בְּתוֹךְ הַנַּחַל
  choice: katikati ya bonde hilo
  rationale: בְּתוֹךְ humaanisha 'ndani/katikati ya'; kurudia 'bonde hilo' kunadumisha marejeo ya נַחַל na kusikika kwa kawaida kwa Kiswahili.
- source_word: כָל הַמִּישֹׁר
  choice: uwanda wote
  rationale: מִישׁוֹר ni eneo tambarare au nyanda za juu; 'uwanda' ni neno la kawaida na sahihi bila kuongeza wazo lisilo wazi katika mstari.
- source_word: מֵידְבָא עַד דִּיבוֹן
  choice: kutoka Medeba hadi Diboni
  rationale: Muundo מִן...עַד unaonyesha eneo kuanzia sehemu moja hadi nyingine.
