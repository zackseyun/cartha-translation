base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/004.yaml
  text: from the south[a], all the land of the Canaanites, and Mearah that belongs to the Sidonians, as far as Aphek[b], to the border of the Amorites.
translation:
  language: sw
  text: kutoka kusini, nchi yote ya Wakanaani, na Meara[a] ya Wasidoni, hadi Afeki, kufikia mpaka wa Waamori.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na pango la Wasidoni,” ikiwa מְעָרָה linachukuliwa kuwa nomino ya kawaida badala ya jina la mahali.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinatumia maumbo ya umoja, kihalisi “Mkanaani” na “Mwamori,” kwa maana ya jamii nzima; hapa yametafsiriwa kwa wingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתֵּימָן
  choice: kutoka kusini
  rationale: תֵּימָן mara nyingi humaanisha upande au eneo la kusini. Katika orodha hii ya mipaka, maana ya kijiografia inafaa kuliko kulichukulia kama jina la mahali, Temani.
- source_word: כָּל אֶרֶץ הַכְּנַעֲנִי
  choice: nchi yote ya Wakanaani
  rationale: Kiebrania kinasema kihalisi ‘nchi yote ya Mkanaani,’ lakini umoja wa jina la kabila umetumiwa kwa maana ya jamii nzima; wingi wa Kiswahili unaeleza maana hiyo kwa kawaida.
- source_word: וּמְעָרָה
  choice: na Meara
  rationale: Ingawa מְעָרָה linaweza kuwa nomino ya kawaida yenye maana ya ‘pango,’ muktadha wa orodha ya maeneo unaunga mkono kulichukulia kama jina la mahali. Jina Meara linahifadhi uwezekano huo bila kuficha maana nyingine, ambayo imewekwa katika tanbihi.
- source_word: אֲשֶׁר לַצִּידֹנִים
  choice: ya Wasidoni
  rationale: Muundo huu mfupi na wa kawaida wa Kiswahili unaonyesha kwamba Meara lilihusishwa na au lilikuwa mali ya Wasidoni, kama inavyoonyeshwa na לַ katika Kiebrania.
- source_word: עַד אֲפֵקָה
  choice: hadi Afeki
  rationale: עַד huonyesha ukomo wa eneo, na kiambishi cha mwelekeo katika אֲפֵקָה hakihitaji kutafsiriwa tofauti na ‘hadi’ katika Kiswahili.
- source_word: עַד גְּבוּל הָאֱמֹרִי
  choice: kufikia mpaka wa Waamori
  rationale: גְּבוּל hapa ni mpaka wa eneo. ‘Kufikia’ huepuka urudiaji usio wa kawaida wa ‘hadi ... hadi’ huku ikihifadhi hatua ya mwisho ya maelezo ya eneo; ‘Waamori’ huwasilisha maana ya kijamii ya umoja wa Kiebrania.
