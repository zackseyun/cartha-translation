  yaml_path: translation/ot/joshua/013/017.yaml
  text: 'Heshbon and all its cities that are on the plateau: Dibon[a], Bamoth-baal, and Beth-baal-meon.'
translation:
  language: sw
  text: Heshboni na miji yake yote iliyoko katika uwanda wa juu:[a] Diboni, Bamoth-baali, na Beth-baal-meoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika uwanda” au “katika nchi tambarare.” Neno la Kiebrania linamaanisha eneo tambarare lililoinuka upande wa mashariki wa Yordani.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: Heshboni
  rationale: Jina la mahali limetoholewa kwa tahajia inayotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וְכָל עָרֶיהָ
  choice: na miji yake yote
  rationale: Kiwakilishi cha nafsi ya tatu umoja kinarejelea Heshboni; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: אֲשֶׁר בַּמִּישֹׁר
  choice: iliyoko kwenye nchi tambarare ya juu
  rationale: Katika muktadha wa eneo la mashariki ya Yordani, מִישׁוֹר huelekeza kwenye eneo tambarare lililoinuka, si uwanda wa chini kwa ujumla.
- source_word: דִּיבוֹן
  choice: Diboni
  rationale: Jina la mahali limetoholewa kwa namna ya kawaida ya Kiswahili.
- source_word: וּבָמוֹת בַּעַל
  choice: Bamoth-baali
  rationale: Ni jina la mahali, si kirai cha kawaida cha kutafsiriwa kama ‘mahali pa juu pa Baali’; kistari huonyesha kuwa ni jina ambatani.
- source_word: וּבֵית בַּעַל מְעוֹן
  choice: na Beth-baal-meoni
  rationale: Jina ambatani la mahali limetoholewa badala ya kutafsiri sehemu בֵּית kuwa ‘nyumba ya.’
