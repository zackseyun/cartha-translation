  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: עִמּ֗/וֹ הָ/רֽאוּבֵנִי֙ וְ/הַ/גָּדִ֔י לָקְח֖וּ נַחֲלָתָ֑/ם אֲשֶׁר֩ נָתַ֨ן לָ/הֶ֜ם מֹשֶׁ֗ה בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה כַּ/אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/008.yaml
  text: With him[a], the Reubenites and the Gadites received their inheritance, which Moses gave them beyond the Jordan eastward, just as Moses the servant of Yahweh gave them.
translation:
  language: sw
  text: Pamoja naye, Wareubeni na Wagadi walipokea urithi wao ambao Musa aliwapa ng’ambo ya Yordani, upande wa mashariki,[a] kama vile Musa, mtumishi wa Yahweh, alivyowapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “ng’ambo ya Yordani kuelekea mashariki,” yaani upande wa mashariki wa Mto Yordani.'
    reason: cultural_note
lexical_decisions:
- source_word: עִמּוֹ
  choice: Pamoja naye
  rationale: Kiwakilishi cha nafsi ya tatu umoja kinaelekea kurejelea nusu ya kabila la Manase iliyotajwa katika muktadha uliotangulia; usemi huu unahifadhi rejeo hilo bila kulifafanua kupita maandishi.
- source_word: הָרְאוּבֵנִי וְהַגָּדִי
  choice: Wareubeni na Wagadi
  rationale: Majina haya ya Kiebrania yako katika umoja wa kijamii lakini yanawakilisha makabila kwa ujumla; wingi wa Kiswahili ni wa kawaida na wazi.
- source_word: לָקְחוּ
  choice: walipokea
  rationale: Kitenzi kinaweza kumaanisha kuchukua au kupokea. Katika muktadha wa urithi wa nchi uliotolewa na Musa, “walipokea” ni Kiswahili cha kawaida bila kudokeza unyakuzi.
- source_word: נַחֲלָתָם
  choice: urithi wao
  rationale: Neno hili humaanisha sehemu ya nchi iliyotolewa kuwa milki ya urithi; “urithi wao” huhifadhi maana ya nchi pamoja na uzito wake wa agano.
- source_word: בְּעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: ng’ambo ya Yordani, upande wa mashariki
  rationale: Tafsiri hii inaonyesha wazi kwamba eneo lilikuwa upande wa mashariki wa Mto Yordani, huku ikidumisha dhana ya kuwa ng’ambo ya mto.
- source_word: כַּאֲשֶׁר
  choice: kama vile
  rationale: Huonyesha ulinganifu au uthibitisho wa kwamba urithi huo ulikuwa sawasawa na alivyowapa Musa.
- source_word: עֶבֶד יְהוָה
  choice: mtumishi wa Yahweh
  rationale: “Mtumishi” ni cheo cha heshima cha Musa katika muktadha huu, na “Yahweh” huhifadhi jina la Mungu lililoandikwa katika maandishi ya Kiebrania.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יהוה, kwa hiyo limetolewa kama jina binafsi “Yahweh” badala ya kubadilishwa kuwa cheo.
- issue: Maana ya לקחו kuhusiana na urithi
  choice: walipokea
  alternative: walichukua
  rationale: “Walipokea” huonyesha kuwa nchi hiyo ilikuwa zawadi au mgao waliyopewa na Musa, bila kuondoa maana halali ya kitenzi katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Marudio ya Musa kuwapa urithi yamehifadhiwa kwa sababu yapo katika maandishi ya Kiebrania.
