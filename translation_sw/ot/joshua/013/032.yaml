base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/032.yaml
  text: These are what Moses apportioned as an inheritance in the plains of Moab[b][a], beyond the Jordan east of Jericho.
translation:
  language: sw
  text: Haya ndiyo Musa aliyoyagawa kuwa urithi[a] katika nchi tambarare za Moabu, ng’ambo ya Yordani[b], mashariki mwa Yeriko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyoyatoa kuwa urithi” au “aliyoyapanga kuwa urithi.” Kitenzi cha Kiebrania kinakazia kugawa ardhi iwe milki ya urithi.
    reason: lexical_alternative
  - marker: b
    text: Au, “upande mwingine wa Yordani.” Msemo wa Kiebrania ni kauli ya kawaida ya kijiografia, na namna ya kuutafsiri inaweza kutegemea mahali anapotazama msemaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: Haya ndiyo
  rationale: Muundo huu wa Kiswahili unatanguliza muhtasari wa maeneo yaliyotajwa bila kulazimika kuongeza nomino isiyokuwapo wazi katika Kiebrania.
- source_word: נִחַל
  choice: aliyoyagawa kuwa urithi
  rationale: Kitenzi hiki katika kausativi kinahusu kugawa ardhi iwe milki ya urithi; tafsiri hii inahifadhi wazo la ugawaji na la urithi.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: katika nchi tambarare za Moabu
  rationale: עֲרָבוֹת humaanisha eneo la tambarare au nyika; ‘nchi tambarare’ ni ya kawaida na inaeleweka katika Kiswahili cha sasa.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: ng’ambo ya Yordani
  rationale: Huu ni msemo wa kawaida wa kijiografia unaohifadhi mtazamo usiofafanuliwa kikamilifu katika usemi wenyewe.
- source_word: מִזְרָחָה־יְרִיחוֹ
  choice: mashariki mwa Yeriko
  rationale: Kielezi cha mwelekeo kinaonyesha eneo lililo upande wa mashariki kuhusiana na Yeriko.
