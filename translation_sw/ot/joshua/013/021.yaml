  text: וְ/כֹל֙ עָרֵ֣י הַ/מִּישֹׁ֔ר וְ/כָֽל מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חֶשְׁבּ֑וֹן אֲשֶׁר֩ הִכָּ֨ה מֹשֶׁ֜ה אֹת֣/וֹ וְ/אֶת נְשִׂיאֵ֣י מִדְיָ֗ן אֶת אֱוִ֤י וְ/אֶת רֶ֨קֶם֙ וְ/אֶת צ֤וּר וְ/אֶת חוּר֙ וְ/אֶת רֶ֔בַע נְסִיכֵ֣י סִיח֔וֹן יֹשְׁבֵ֖י הָ/אָֽרֶץ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/021.yaml
  text: 'and all the cities of the plateau[a], and all the kingdom of Sihon king of the Amorites, who reigned in Heshbon, whom Moses struck down—him and the chiefs of Midian: Evi, Rekem, Zur, Hur, and Reba, the princes of Sihon[c][b], who lived in the land.'
translation:
  language: sw
  text: na miji yote ya uwanda wa juu[a], na ufalme wote wa Sihoni, mfalme wa Waamori, aliyetawala huko Heshboni, ambaye Musa alimshinda[b]—yeye pamoja na viongozi wa Midiani, yaani Evi, Rekemu, Suri, Huri na Reba, watawala wa Sihoni[c] walioishi katika nchi hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miji ya tambarare” au “miji ya nchi tambarare ya juu.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “alimpiga”; katika muktadha huu wa kijeshi, maana yake ni kumshinda kabisa.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania kinatumia maneno mawili tofauti ya vyeo: “viongozi wa Midiani” (נְשִׂיאֵי) na “watawala wa Sihoni” (נְסִיכֵי).'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּישֹׁר
  choice: miji ya uwanda wa juu
  rationale: מִישׁוֹר hapa ni eneo tambarare la juu mashariki mwa Yordani; “uwanda wa juu” linaonyesha jiografia hiyo vizuri kuliko “tambarare” pekee.
- source_word: מַמְלְכוּת סִיחוֹן
  choice: ufalme wa Sihoni
  rationale: Hili ni tafsiri ya moja kwa moja na ya kawaida ya מַמְלְכוּת katika muktadha huu.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: mfalme wa Waamori
  rationale: Linahifadhi uhusiano wa maneno katika Kiebrania kwa Kiswahili cha kawaida.
- source_word: אֲשֶׁר מָלַךְ בְּחֶשְׁבּוֹן
  choice: aliyetawala huko Heshboni
  rationale: Ingawa מָלַךְ huhusu kutawala kama mfalme, “aliyetawala” ni ya asili katika Kiswahili, huku utambulisho wake kama mfalme ukiwa tayari umetajwa.
- source_word: אֲשֶׁר הִכָּה מֹשֶׁה אֹתוֹ
  choice: ambaye Musa alimshinda
  rationale: Katika muktadha wa kijeshi, נכה humaanisha kupiga na kumshinda adui; “alimshinda” linaeleza maana hiyo bila kuamua kimya kimya kwamba kitenzi chenyewe lazima kimaanishe kumuua.
- source_word: נְשִׂיאֵי מִדְיָן
  choice: viongozi wa Midiani
  rationale: נָשִׂיא linaweza kumaanisha mkuu, kiongozi au mwana wa kifalme. “Viongozi” ni wazi na linasaidia kulitofautisha na neno jingine la cheo, נְסִיכֵי, linalotokea baadaye.
- source_word: אֱוִי וְאֶת רֶקֶם וְאֶת צוּר וְאֶת חוּר וְאֶת רֶבַע
  choice: Evi, Rekemu, Suri, Huri na Reba
  rationale: Majina haya yametoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili huku yakifuata maumbo ya Kiebrania.
- source_word: נְסִיכֵי סִיחוֹן
  choice: watawala wa Sihoni
  rationale: נָסִיךְ humaanisha mtawala au mkuu mwenye cheo. “Watawala” linatofautisha cheo hiki na נְשִׂיאֵי na linaepuka kudokeza kimakosa kwamba walikuwa wana wa mfalme.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: walioishi katika nchi hiyo
  rationale: Linatoa maana ya kitenzi kishirikishi ישׁב kwa Kiswahili cha sasa na kuonyesha kwamba nchi inayorejelewa ni ile iliyotajwa katika muktadha.
