  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: miji ya mishor, ufalme wa Sihoni, utambulisho wake kama mfalme wa Waamori aliyekuwa akitawala Heshboni, na Musa kumshinda yeye pamoja na wakuu wa Midiani. Marudio ya “yeye” yanawakilisha kwa ufaafu kiwakilishi cha mkazo אֹתוֹ. Orodha ya majina na maelezo ya mwisho kuhusu wakuu wa Sihoni wanaoishi katika nchi vimehifadhiwa.'
