lexical_decisions:
- source_word: וַיִּתֵּן
  choice: akaipa … mgao
  rationale: Kitenzi נָתַן kina maana ya ‘kutoa/kupa.’ Kwa kuwa kitu kilichotolewa hakitajwi wazi katika mstari huu lakini muktadha ni wa kugawa nchi, ‘mgao’ huonyesha rejeleo linalodokezwa kwa Kiswahili cha kawaida bila kulibadili kuwa fundisho la ziada.
- source_word: לַחֲצִי שֵׁבֶט
  choice: nusu ya kabila
  rationale: חֲצִי ni ‘nusu,’ na שֵׁבֶט hapa ni kikundi cha kikabila, si fimbo au fimbo ya enzi.
- source_word: מְנַשֶּׁה
  choice: Manase
  rationale: Jina la mtu na la kabila limetoholewa kwa umbo la Kiswahili lililozoeleka.
- source_word: וַיְהִי
  choice: mgao huo ulikuwa wa
  rationale: Kauli hiyo kihalisi ni ‘ikawa/ilikuwa,’ lakini katika muktadha wa ugawaji inaonyesha kuwa mgao ulikuwa wa kundi lililotajwa. Tafsiri hii hudumisha muundo wa kuwa bila kuufanya kuwa maelezo yasiyoeleweka kwa Kiswahili.
- source_word: מַטֵּה
  choice: kabila
  rationale: Ingawa מַטֶּה pia inaweza kumaanisha ‘fimbo,’ hapa inarejelea kabila, sawa na matumizi ya שֵׁבֶט katika muktadha huu.
- source_word: בְנֵי מְנַשֶּׁה
  choice: wana wa Manase
  rationale: Huhifadhi usemi wa Kiebrania wa kindugu ‘wana wa Manase’; katika muktadha unamaanisha wazao wa kikabila wa Manase.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: kulingana na koo zao
  rationale: מִשְׁפָּחוֹת ni koo au vikundi vya kifamilia ndani ya kabila, na לְ hapa ina nguvu ya ugawaji ‘kulingana na.’
