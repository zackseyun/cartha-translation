  yaml_path: translation/ot/joshua/013/029.yaml
  text: 'And Moses gave to the half-tribe of Manasseh[a], and it was for the half-tribe of the sons of Manasseh according to their clans:'
translation:
  language: sw
  text: 'Musa akawapa nusu ya kabila la Manase; nayo ikawa ya nusu ya kabila la wana wa Manase[a], kulingana na koo zao:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Manase,” usemi wa undugu unaowarejelea wazao wa kikabila wa Manase.'
