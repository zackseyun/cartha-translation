base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/027.yaml
  text: and in the valley[a], Beth-haram, Beth-nimrah, Succoth, and Zaphon—the rest of the kingdom of Sihon king of Heshbon—with the Jordan as its border, as far as the lower end of the Sea of Kinnereth, beyond the Jordan eastward.
translation:
  language: sw
  text: na katika bonde, Beth-harami, Beth-nimra, Sukothi na Safoni—sehemu iliyobaki ya ufalme wa Sihoni, mfalme wa Heshboni—Yordani ikiwa mpaka wake, hadi mwisho wa Bahari ya Kinerethi[a], ng’ambo ya Yordani, upande wa mashariki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi ukingo wa Bahari ya Kinerethi.”
    reason: Neno קְצֵה linaweza kumaanisha mwisho, ukomo, au ukingo; muktadha wa mpaka unaruhusu tafsiri zote mbili.
lexical_decisions:
- source_word: וּ/בָ/עֵמֶק
  choice: na katika bonde
  rationale: עֵמֶק kwa kawaida ni bonde au eneo la chini; “bonde” ni neno la kawaida na la asili katika Kiswahili kwa eneo hili la kijiografia.
- source_word: בֵּית הָרָם וּ/בֵית נִמְרָה וְ/סֻכּוֹת וְ/צָפוֹן
  choice: Beth-haramu, Beth-nimra, Sukothi na Safoni
  rationale: Haya ni majina ya mahali, hivyo yamenukuliwa kwa maumbo yanayosomeka kwa urahisi katika Kiswahili badala ya kutafsiriwa; צָפוֹן hapa ni Safoni, si neno la mwelekeo “kaskazini.”
- source_word: יֶתֶר מַמְלְכוּת סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: sehemu iliyobaki ya ufalme wa Sihoni, mfalme wa Heshboni
  rationale: יֶתֶר humaanisha sehemu iliyosalia, na מַמְלָכוּת hapa ni ufalme; muundo huu unaeleza kwa uwazi kuwa eneo lililotajwa ndilo lililobaki katika ufalme wa Sihoni.
- source_word: הַ/יַּרְדֵּן וּ/גְבֻל
  choice: Yordani ikiwa mpaka wake
  rationale: Kiebrania kina usemi mfupi wa kiuambatano unaoonyesha kwamba Mto Yordani ulikuwa mpaka wa eneo hilo; Kiswahili hiki kinaweka uhusiano huo wazi bila kuongeza wazo jipya.
- source_word: עַד קְצֵה יָם כִּנֶּרֶת
  choice: hadi mwisho wa Bahari ya Kinerethi[a]
  rationale: קְצֵה ni mwisho, ukingo, au ukomo. “Mwisho” huhifadhi kutokubainishwa kwa neno la Kiebrania kuliko kuamua kimya kimya kwamba ni “mwisho wa chini”; uwezekano wa “ukingo” umewekwa katika tanbihi.
- source_word: עֵבֶר הַ/יַּרְדֵּן מִזְרָחָ/ה
  choice: upande wa mashariki wa Yordani
  rationale: Huu ni usemi wa kieneo unaolitaja eneo la ng’ambo ya Yordani lililo mashariki; tafsiri hii ni ya kawaida katika Kiswahili na huepuka utata wa mahali anaposimama msemaji.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa kisasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Majina ya mahali yameandikwa kwa maumbo yanayofaa matamshi ya Kiswahili, huku jina la kale Kinerethi likihifadhiwa.
