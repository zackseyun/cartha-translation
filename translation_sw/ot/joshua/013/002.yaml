base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/002.yaml
  text: 'This is the land that remains: all the districts of the Philistines[b][a], and all the Geshurites—'
translation:
  language: sw
  text: 'Hii ndiyo nchi iliyobaki: maeneo yote ya Wafilisti[a], na Wageshuri wote[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wilaya zote.” Neno la Kiebrania גְּלִילוֹת linamaanisha maeneo ya nchi yaliyohusishwa na Wafilisti.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania “Mgeshuri,” katika umoja; hapa jina hilo linatumika kwa maana ya kijumla kuwataja Wageshuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָאָרֶץ
  choice: Hii ndiyo nchi
  rationale: Muundo huu wa Kiswahili unatoa kwa kawaida nguvu ya utambulisho ya kishazi cha Kiebrania, huku “nchi” ikifaa kwa eneo linalozungumziwa katika muktadha wa ugawaji wa ardhi.
- source_word: הַנִּשְׁאָרֶת
  choice: iliyobaki
  rationale: Hutafsiri hali ya eneo ambalo bado halijamilikiwa, bila kuongeza maelezo yasiyotajwa wazi katika mstari.
- source_word: כָּל גְּלִילוֹת
  choice: maeneo yote
  rationale: גְּלִילוֹת humaanisha maeneo au sehemu za kijiografia. “Maeneo yote” ni Kiswahili cha kawaida na kinachofikika, huku “wilaya” likibaki chaguo lenye maana ya kiutawala zaidi.
- source_word: הַפְּלִשְׁתִּים
  choice: Wafilisti
  rationale: Kiebrania kinataja watu wenyewe; “ya Wafilisti” huhifadhi uhusiano wa maeneo hayo na kundi hilo la watu.
- source_word: וְכָל הַגְּשׁוּרִי
  choice: na Wageshuri wote
  rationale: Ingawa jina la Kiebrania lina umbo la umoja la kumtaja mtu wa kundi hilo, hapa linatumika kwa maana ya kijumla; wingi wa Kiswahili unaonyesha maana hiyo kwa kawaida.
