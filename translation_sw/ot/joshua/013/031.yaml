base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/031.yaml
  text: and half of Gilead[a], and Ashtaroth and Edrei, the cities of the kingdom of Og in Bashan, belonged to the sons of Machir son of Manasseh—to half of the sons of Machir[b], according to their clans.
translation:
  language: sw
  text: na nusu ya Gileadi, na Ashtarothi na Edrei, miji ya ufalme wa Ogu huko Bashani[a], zilipewa wana wa Makiri, mwana wa Manase—nusu ya wana wa Makiri[b], kulingana na koo zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miji ya kifalme ya Ogu huko Bashani.” Kiebrania kinasema kihalisi, “miji ya ufalme wa Ogu huko Bashani.”
    reason: lexical_alternative
  - marker: b
    text: Usemi “wana wa Makiri” unaweza kumaanisha wazao wa Makiri kwa upana zaidi, lakini tafsiri imehifadhi usemi wa kifamilia wa Kiebrania.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲצִי הַגִּלְעָד
  choice: na nusu ya Gileadi
  rationale: Kiunganishi kinaendeleza orodha ya mgao kutoka mstari uliotangulia; “nusu ya” huonyesha sehemu ya eneo hilo bila kuongeza neno lisilokuwamo katika Kiebrania.
- source_word: עַשְׁתָּרוֹת וְאֶדְרֶעִי
  choice: Ashtarothi na Edrei
  rationale: Majina ya mahali yameandikwa kwa namna inayofaa matamshi na matumizi ya kawaida ya Kiswahili.
- source_word: עָרֵי מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: miji ya ufalme wa Ogu huko Bashani
  rationale: Tafsiri hii inadumisha uhusiano wa maneno katika Kiebrania bila kuamua kwamba miji hiyo ilikuwa miji mikuu au makao maalumu ya kifalme.
- source_word: לִבְנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: zilipewa wana wa Makiri mwana wa Manase
  rationale: Kihusishi ל־ kinaonyesha mgao; “zilipewa” hufanya kishazi kisicho na kitenzi katika Kiebrania kiwe cha asili kwa Kiswahili huku kikihifadhi maana ya ugawaji wa nchi.
- source_word: לַחֲצִי בְנֵי מָכִיר
  choice: yaani, nusu ya wana wa Makiri
  rationale: Kirai cha pili kinafafanua kwamba ni nusu tu ya ukoo wa Makiri inayozungumziwa; “yaani” huonyesha uhusiano huo wa ufafanuzi bila kuongeza dhana ya nusu-kabila.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: kulingana na koo zao
  rationale: Katika masimulizi ya kugawa nchi, מִשְׁפָּחוֹת hurejelea migawanyo ya ukoo ndani ya kabila; “koo” ni sahihi zaidi hapa kuliko “familia” kwa maana yake ya kisasa.
