lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל
  choice: akawaita
  rationale: Muundo wa קרא pamoja na אֶל hapa unaeleza Yoshua kuwaita watu hao waje kwake; “akawaita” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: שְׁנֵים הֶעָשָׂר אִישׁ
  choice: wale wanaume kumi na wawili
  rationale: Kundi hili tayari limetambulishwa katika muktadha, hivyo “wale” linaonyesha urejeo huo maalumu.
- source_word: אֲשֶׁר הֵכִין
  choice: aliokuwa amewateua
  rationale: Ingawa הֵכִין inaweza kumaanisha kuandaa au kuweka tayari, hapa inahusu watu walioteuliwa kwa kazi hiyo; “amewateua” huwasilisha maana ya muktadha bila kudokeza maandalizi ya kimwili.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: kutoka miongoni mwa wana wa Israeli
  rationale: “Wana wa Israeli” huhifadhi muundo wa Kiebrania, huku “kutoka miongoni mwa” kikionyesha wazi kwamba watu hao walichaguliwa katika jamii hiyo.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד מִשָּׁבֶט
  choice: mwanamume mmoja kutoka kila kabila
  rationale: Urudiaji wa Kiebrania una maana ya ugawaji; Kiswahili cha asili huieleza kwa “mmoja kutoka kila kabila.”
