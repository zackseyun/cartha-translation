  text: Basi Yoshua akawaita wale wanaume kumi na wawili aliokuwa amewateua[a] kutoka miongoni mwa wana wa Israeli[b], mwanamume mmoja kutoka kila kabila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliokuwa amewaandaa” au “aliokuwa amewachagua.”
