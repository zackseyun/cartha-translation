- source_word: וַיֹּאמֶר
  choice: Kisha akawaambia
  rationale: Wayyiqtol inaendeleza simulizi. Kwa kuwa Kiebrania kina kihusishi אֶל, ‘akawaambia’ ni Kiswahili cha kawaida na sahihi kuliko ‘alisema kwa’.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi wa kifamilia na wa agano wa Kiebrania, ingawa ‘Waisraeli’ lingekuwa chaguo laini zaidi.
- source_word: אֲשֶׁר יִשְׁאָלוּן ... מָחָר
  choice: Wakati ujao, ... watakapowauliza
  rationale: מָחָר hapa ina maana ya wakati wa baadaye, si lazima kesho ya siku inayofuata; muundo wa ‘watakapowauliza’ unaonyesha hali hiyo ya wakati ujao kwa Kiswahili cha asili.
- source_word: בְּנֵיכֶם
  choice: watoto wenu
  rationale: Ingawa umbo la Kiebrania ni ‘wana wenu,’ katika muktadha linaweza kutaja watoto au wazao kwa ujumla.
- source_word: אֶת אֲבוֹתָם
  choice: baba zao
  rationale: Huu ndio maana wa moja kwa moja wa אֲבוֹתָם katika tukio la watoto kuwauliza baba zao; ‘mababu zao’ lingeipanua bila ulazima.
- source_word: מָה הָאֲבָנִים הָאֵלֶּה
  choice: Mawe haya ni nini?
  rationale: Huhifadhi swali la Kiebrania lililo la moja kwa moja na kutoliafsiri kimya kimya kuwa swali kuhusu maana au kusudi la mawe.
