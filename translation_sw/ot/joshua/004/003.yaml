translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Jitwalieni” na “Yavusheni” huhifadhi mfuatano halisi wa kuchukua mawe kisha kuyavusha. Viashiria vya tanbihi vimewekwa kwenye vifungu vinavyohusika moja kwa moja.
