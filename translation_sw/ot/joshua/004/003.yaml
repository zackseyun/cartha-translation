  text: וְ/צַוּ֣וּ אוֹתָ/ם֮ לֵ/אמֹר֒ שְׂאֽוּ לָ/כֶ֨ם מִ/זֶּ֜ה מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֗ן מִ/מַּצַּב֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים הָכִ֖ין שְׁתֵּים עֶשְׂרֵ֣ה אֲבָנִ֑ים וְ/הַעֲבַרְתֶּ֤ם אוֹתָ/ם֙ עִמָּ/כֶ֔ם וְ/הִנַּחְתֶּ֣ם אוֹתָ֔/ם בַּ/מָּל֕וֹן אֲשֶׁר תָּלִ֥ינוּ ב֖/וֹ הַ/לָּֽיְלָה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/003.yaml
  text: and command them[a], saying, ‘Take up for yourselves from here, from the midst of the Jordan, from the place where the priests’ feet stood firm, twelve stones[b], and carry them over with you and set them down at the lodging place where you will spend the night.’
translation:
  language: sw
  text: 'na uwaagize hivi: “Jitwalieni kutoka hapa, kutoka katikati ya Yordani, kutoka mahali pale miguu ya makuhani iliposimama imara,[a] mawe kumi na mawili. Yavusheni pamoja nanyi, mkayaweke mahali mtakapolala usiku wa leo.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi na muundo wa Kiebrania, “kutoka mahali pa kusimama kwa miguu ya makuhani, palipo imara.”
    reason: lexical_alternative
  - marker: b
    text: Mahali pa kulala hapa ni kituo ambacho Waisraeli wangekaa usiku baada ya kuvuka; si lazima pawe makazi ya kudumu.
    reason: cultural_note
lexical_decisions:
- source_word: וְצַוּוּ אוֹתָם לֵאמֹר
  choice: na uwaamuru hivi
  rationale: Kitenzi cha Pi‘el צוה kina nguvu ya amri ya moja kwa moja. “Hivi” ni njia ya asili ya Kiswahili ya kutambulisha maneno yanayofuata bila kulazimisha muundo mzito wa “ukisema.”
- source_word: שְׂאוּ לָכֶם
  choice: Jitwalieni
  rationale: Muundo huu unaunganisha tendo la kuchukua au kuinua na dative לָכֶם, ukionyesha ushiriki wao wenyewe bila kudokeza kwamba mawe yatakuwa mali yao binafsi.
- source_word: מִזֶּה מִתּוֹךְ הַיַּרְדֵּן
  choice: kutoka hapa, katikati ya Yordani
  rationale: Maneno mawili ya mahali yamehifadhiwa ili kuonyesha kwamba mawe yachukuliwe hapa hasa, yaani ndani ya mto Yordani.
- source_word: מִמַּצַּב רַגְלֵי הַכֹּהֲנִים הָכִין
  choice: mahali pale miguu ya makuhani iliposimama imara
  rationale: מַצָּב huonyesha mahali pa kusimama au kituo, na הָכִין hukazia uthabiti. Kiswahili hiki ni cha asili huku kikihifadhi picha ya miguu yao kuwa imara.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: mawe kumi na mawili
  rationale: Hii ni tafsiri ya moja kwa moja ya hesabu na nomino.
- source_word: וְהַעֲבַרְתֶּם אוֹתָם עִמָּכֶם
  choice: Yavusheni pamoja nanyi
  rationale: Hiphil ya עבר inaonyesha kuyafanya mawe yavuke; “pamoja nanyi” huhifadhi wazo la kuandamana lililo katika עִמָּכֶם.
- source_word: וְהִנַּחְתֶּם אוֹתָם
  choice: mkayaweke
  rationale: Hiphil ya נוח hapa ni kuyaweka au kuyatua mawe mahali yatakapobaki. “Mkayaweke” ni ya kawaida na inaendeleza mfuatano wa vitendo.
- source_word: בַּמָּלוֹן אֲשֶׁר תָּלִינוּ בוֹ הַלָּיְלָה
  choice: mahali mtakapolala usiku wa leo
  rationale: מָלוֹן ni mahali pa kukaa usiku, na kishazi kinachofuata kinafafanua matumizi hayo. Tafsiri hii ni ya asili na haiingizi dhana ya makazi ya kudumu.
