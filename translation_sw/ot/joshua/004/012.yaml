base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/012.yaml
  text: And the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh crossed over armed before the sons of Israel[c][b], just as Moses had spoken to them.
translation:
  language: sw
  text: Nao wana wa Reubeni[a], wana wa Gadi, na nusu ya kabila la Manase wakavuka wakiwa wamejihami[c] mbele ya wana wa Israeli[b], kama Musa alivyowaambia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wareubeni, Wagadi, na nusu ya kabila la Manase.” Kiebrania kinasema kwa uhalisi zaidi, “wana wa Reubeni ... wana wa Gadi ...”
    reason: lexical_alternative
  - marker: b
    text: Au, “Waisraeli.” Kiebrania kinasema kwa uhalisi zaidi, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania lililotafsiriwa “wamejihami” linaweza kumaanisha kuwa wameandaliwa au wamepangwa kwa ajili ya vita; wengine wamependekeza maana ya moja kwa moja zaidi kama “wakiwa wamepangwa katika safu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: wakavuka
  rationale: Katika muktadha huu kitenzi עבר kinamaanisha kuvuka Yordani; “wakavuka” ni cha kawaida na huhifadhi tendo la kuvuka bila kuongeza jina la mto lisilomo katika mstari.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: wana wa Reubeni, wana wa Gadi
  rationale: Huhifadhi kwa uwazi muundo wa Kiebrania wa “wana wa,” huku tanbihi ikitoa usemi wa kawaida zaidi wa majina ya makabila.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: nusu ya kabila la Manase
  rationale: Ni Kiswahili cha kawaida na sahihi kwa muundo unaotaja sehemu moja ya kabila la Manase.
- source_word: חֲמֻשִׁים
  choice: wakiwa wamejihami
  rationale: Katika muktadha wa kuvuka kuelekea vitani, neno hili linaonyesha kuwa walikuwa tayari na vifaa vya vita; “wamejihami” ni fupi na wazi, bila kuficha uwezekano wa maana ya kujipanga kwa vita.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Hueleza mahali walipokuwa, yaani mbele ya Waisraeli wengine walipokuwa wakivuka.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi halisi wa ukoo katika Kiebrania; tanbihi inatoa “Waisraeli” kama usemi wa kawaida zaidi.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶם מֹשֶׁה
  choice: kama Musa alivyokuwa amewaambia
  rationale: “Kama” huonyesha kwamba walitenda kulingana na maneno ya Musa, na “alivyokuwa amewaambia” huonyesha kuwa maneno hayo yalitangulia tendo la kuvuka.
