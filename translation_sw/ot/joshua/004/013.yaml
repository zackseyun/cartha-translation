  yaml_path: translation/ot/joshua/004/013.yaml
  text: About forty thousand armed for war crossed over before Yahweh for battle[a], to the plains of Jericho.
translation:
  language: sw
  text: Karibu wanajeshi elfu arobaini waliojihami kwa vita walivuka mbele ya Yahweh kwenda vitani hadi tambarare za Yeriko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּ/אַרְבָּעִים אֶלֶף
  choice: Karibu watu elfu arobaini
  rationale: Kiambishi כְּ kwenye hesabu kinaonyesha makadirio; “karibu” ni njia ya kawaida na wazi ya kuhifadhi maana hiyo kwa Kiswahili.
- source_word: חֲלוּצֵי הַצָּבָא
  choice: waliokuwa wamejiandaa kwa silaha
  rationale: Kirai hiki kinaeleza watu waliokuwa wamejizatiti au wameandaliwa kwa shughuli ya kijeshi. Tafsiri hii inaonyesha utayari wa kivita bila kuongeza wazo lisilo hakika la kuwa kikosi cha mbele.
- source_word: עָבְרוּ
  choice: walivuka
  rationale: Katika muktadha wa Yoshua 3–4, kitenzi hiki kinarejelea kuvuka Mto Yordani; “walivuka” kinadumisha uhusiano huo wa masimulizi kwa njia ya asili.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: לִפְנֵי humaanisha “mbele ya/katika uwepo wa.” Usemi “mbele za Yahweh” ni wa heshima na unaeleweka katika Kiswahili cha Biblia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano lililoandikwa kwa Tetragramatoni linatolewa kama “Yahweh,” badala ya kulibadilisha kuwa cheo.
- source_word: לַמִּלְחָמָה
  choice: kwenda vitani
  rationale: Kirai kinaonyesha kusudi la kuvuka kwao, yaani kushiriki mapigano. “Kwenda vitani” ni usemi wa kawaida wa Kiswahili na haudai kwamba vita vyote vilikuwa tukio moja tu.
- source_word: אֶל עַרְבוֹת יְרִיחוֹ
  choice: mpaka kwenye tambarare za Yeriko
  rationale: עַרְבוֹת hurejelea eneo tambarare la bonde la Yordani. “Tambarare za Yeriko” ni wazi na ya asili kuliko istilahi ya kitaalamu kama “nyanda za nyika.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano lenyewe. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umewekwa wa asili kwa Kiswahili huku uhusiano wa vikundi vya Kiebrania ukihifadhiwa; hakuna tanbihi inayohitajika kwa sababu maana ya mstari inaweza kutolewa wazi bila kuficha utata halisi.
