base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/001.yaml
  text: And it happened[a], when all the nation had finished crossing the Jordan, that Yahweh said to Joshua,
translation:
  language: sw
  text: Ikawa, taifa lote[a] lilipomaliza kuvuka Yordani, Yahwe akamwambia Yoshua,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wote”; Kiebrania kinasema “taifa lote” kwa kutumia nomino ya umoja inayowakilisha Israeli kwa pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hufikisha kwa ufupi kazi ya kifungu hiki katika masimulizi, yaani kuanzisha tukio linalofuata, bila kutumia lugha ya kizamani.
- source_word: כַּאֲשֶׁר תַּמּוּ
  choice: lilipomaliza
  rationale: Muundo huu wa wakati unaonyesha kwamba tendo la kuvuka lilikamilika kabla ya Yahwe kusema.
- source_word: כָל הַגּוֹי
  choice: taifa lote
  rationale: Neno גּוֹי liko katika umoja na linarejelea Israeli kwa pamoja kama taifa; tafsiri hii inadumisha maana hiyo ya kijumla.
- source_word: לַעֲבוֹר אֶת הַיַּרְדֵּן
  choice: kuvuka Yordani
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha tendo lililokamilishwa; jina Yordani linatosha katika muktadha huu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linatumiwa kama umbo la kawaida la Kiswahili la jina binafsi la Mungu katika herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: וַיֹּאמֶר ... אֶל יְהוֹשֻׁעַ לֵאמֹר
  choice: akamwambia Yoshua,
  rationale: Hutoa kwa Kiswahili cha kawaida fomula ya Kiebrania ya kuanzisha maneno yanayofuata, huku koma ikionyesha kwamba usemi unaendelea katika mstari unaofuata.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la Mungu moja kwa moja. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ikawa’ hudumisha mtiririko wa masimulizi ya Kiebrania; ‘taifa lote’ huhifadhi umoja wa neno la pamoja, huku tanbihi ikitoa usemi wa kawaida zaidi, ‘watu wote.’
