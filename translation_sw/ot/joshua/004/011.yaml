  text: And when all the people had finished crossing over[a], the ark of Yahweh and the priests crossed over before the people.
translation:
  language: sw
  text: Ikawa watu wote walipomaliza kuvuka, sanduku la Yahwe na makuhani wakavuka mbele ya watu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wakitazama.” Kirai cha Kiebrania kinaweza kumaanisha mahali, yaani “mbele ya watu,” au tendo kufanyika mbele yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni kiunganishi cha usimulizi kinachoendeleza tukio kwa lugha ya kawaida na yenye hadhi.
- source_word: כַּאֲשֶׁר תַּם כָּל הָעָם לַעֲבוֹר
  choice: watu wote walipomaliza kuvuka
  rationale: Muundo huu unaonyesha kwamba kuvuka kwa watu wote kulikuwa kumekamilika kabla ya tendo linalofuata, huku ukihifadhi msisitizo wa כָּל, ‘wote’.
- source_word: וַיַּעֲבֹר
  choice: wakavuka
  rationale: Kitenzi ‘kuvuka’ kinarudia mzizi עבר kama ilivyo katika kishazi kilichotangulia na kinaendeleza mfululizo wa usimulizi.
- source_word: אֲרוֹן יְהוָה
  choice: sanduku la Yahwe
  rationale: ‘Sanduku’ ni istilahi ya kawaida ya Kiswahili kwa ארון katika muktadha huu, na jina la agano יְהוָה limetoholewa kuwa ‘Yahwe’.
- source_word: וְהַכֹּהֲנִים
  choice: na makuhani
  rationale: Kiunganishi kinawaweka makuhani pamoja na sanduku kama wahusika wa tendo la kuvuka.
- source_word: לִפְנֵי הָעָם
  choice: mbele ya watu
  rationale: Hili ndilo chaguo la kawaida linaloweza kueleza mahali, yaani kuwa mbele yao; uwezekano wa maana ya kuwapo machoni pao umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano, kwa hiyo limetoholewa badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- issue: Maana ya לִפְנֵי הָעָם
  choice: mbele ya watu
  alternative: machoni pa watu
  rationale: Muktadha wa kuvuka unaunga mkono maana ya mahali, lakini kirai hicho pia kinaweza kumaanisha kuwapo mbele ya watu; utata huo umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa usimulizi ni wa sasa, wa kawaida na wenye hadhi. ‘Ikawa’ huhifadhi mwendelezo wa simulizi bila kuongeza maelezo, na ‘wakavuka’ huonyesha mfululizo wa matendo kwa uwazi.
