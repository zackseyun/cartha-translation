  text: בַּ/יּ֣וֹם הַ/ה֗וּא גִּדַּ֤ל יְהוָה֙ אֶת יְהוֹשֻׁ֔עַ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּֽרְא֣וּ אֹת֔/וֹ כַּ/אֲשֶׁ֛ר יָרְא֥וּ אֶת מֹשֶׁ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/014.yaml
  text: On that day Yahweh made Joshua great in the eyes of all Israel[a], and they feared him just as they had feared Moses all the days of his life.
translation:
  language: sw
  text: Siku hiyo Yahweh alimfanya Yoshua kuwa mkuu machoni pa Israeli wote, nao wakamcha[a] kama walivyomcha Musa maisha yake yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakamwogopa” au “wakamheshimu kwa kicho”; kitenzi cha Kiebrania kinaweza kumaanisha hofu, kicho, au heshima kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Siku hiyo
  rationale: Hiki ni kirai cha wakati katika simulizi; “Siku hiyo” ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: גִּדַּל
  choice: alimfanya ... kuwa mkuu
  rationale: 'Kauli ya Piel hapa ina maana ya kisababishi: Yahweh alisababisha Yoshua aonekane na kuhesabiwa kuwa mkuu. Tafsiri hii inalinda maana hiyo bila kuifanya kuwa tu sifa ya ndani.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: machoni pa Israeli wote
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya “machoni pa” huku ikionyesha jinsi taifa lote lilivyomwona na kumhesabu Yoshua.
- source_word: וַיִּירְאוּ אֹתוֹ
  choice: nao wakamcha
  rationale: Kitenzi “kumcha” kinaweza kuonyesha hofu yenye heshima, kicho, au hofu kulingana na muktadha, hivyo kinadumisha upana wa maana ya ירא kuliko kukifafanua kwa namna moja tu.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: “Kama” linaonyesha ulinganisho wa moja kwa moja na wa kawaida kati ya mtazamo wao kwa Yoshua na kwa Musa.
- source_word: יָרְאוּ אֶת מֹשֶׁה
  choice: walivyokuwa wamemcha Musa
  rationale: Muundo huu wa Kiswahili unaweka wazi kwamba mwitikio wao kwa Musa ulikuwa mfano wa awali wa mwitikio wao kwa Yoshua.
- source_word: כָּל יְמֵי חַיָּיו
  choice: siku zote za maisha yake
  rationale: Tafsiri hii inadumisha nahau na mwendo wa kirai cha Kiebrania; katika muktadha, kiwakilishi kinaelekea kumrejelea Musa.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi yana jina la agano moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya ירא kuhusu Yoshua
  choice: wakamcha
  alternative: wakamwogopa / wakamheshimu kwa kicho
  rationale: “Wakamcha” hudumisha mvutano wa maana kati ya hofu, kicho, na heshima bila kuupunguza mwitikio wa Israeli kuwa woga mtupu au heshima tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa msomaji wa kawaida. Taswira ya “machoni pa” imehifadhiwa, na “kumcha” limetumiwa ili kuhifadhi upana wa maana ya neno la Kiebrania.
