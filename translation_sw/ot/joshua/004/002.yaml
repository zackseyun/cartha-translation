lexical_decisions:
- source_word: קְחוּ לָכֶם
  choice: Jichukulieni
  rationale: Amri ya wingi קְחוּ pamoja na לָכֶם ina nguvu ya kujirejelea au ya manufaa; “jichukulieni” huhifadhi wazo la ‘chukueni kwa ajili yenu’ kwa Kiswahili cha kawaida na chenye ufupi.
- source_word: מִן הָעָם
  choice: kutoka miongoni mwa watu
  rationale: Ingawa kihalisi ni ‘kutoka kwa watu,’ muktadha unaonyesha uchaguzi kutoka ndani ya jumuiya; “kutoka miongoni mwa watu” huwasilisha maana hiyo kwa uwazi bila kubadili rejeo la עָם.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: wanaume kumi na wawili
  rationale: אֲנָשִׁים hapa inarejelea wanaume kumi na wawili, si watu bila kubainisha jinsia; tafsiri hii huhifadhi umahususi wa chanzo.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: mwanamume mmoja kutoka katika kila
  rationale: Marudio ya Kiebrania yana kazi ya ugawaji, yaani mtu mmoja kwa kila kitengo. Kiswahili cha kawaida huwasilisha hilo kwa ‘mwanamume mmoja kutoka katika kila,’ huku tanbihi ikihifadhi taarifa kuhusu marudio ya asili.
- source_word: מִשָּׁבֶט
  choice: kabila
  rationale: שֵׁבֶט katika muktadha huu ni moja ya makabila ya Israeli; “kabila” ndilo neno la kawaida na sahihi katika Kiswahili.
