lexical_decisions:
- source_word: וַיְצַו
  choice: akawaamuru
  rationale: Kitenzi צוה kinaonyesha amri yenye mamlaka; “akawaamuru” huhifadhi nguvu hiyo, huku kiambishi “ka-” kikiendeleza simulizi.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: אֶת הַכֹּהֲנִים
  choice: makuhani
  rationale: Nomino yenye hali ya uamuzi imetafsiriwa kwa wingi wa kawaida wa Kiswahili; muktadha unaonyesha kundi maalumu la makuhani.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hutambulisha maneno ya moja kwa moja na kuhifadhi mtindo wa simulizi wa Kiebrania kwa Kiswahili cha asili.
- source_word: עֲלוּ
  choice: Pandeni
  rationale: עלה ni kwenda au kupanda juu. Kwa kuwa makuhani walikuwa ndani ya mto na waliamriwa watoke kuelekea ukingoni, “Pandeni” huhifadhi taswira ya mwendo wa kwenda juu.
- source_word: מִן הַיַּרְדֵּן
  choice: kutoka katika Yordani
  rationale: מן hapa inaonyesha mwendo kutoka ndani ya mahali; “kutoka katika” huonyesha kwamba makuhani walikuwa ndani ya Yordani bila kuongeza neno lisilokuwapo katika chanzo.
