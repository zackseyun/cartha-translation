  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אֶל יְהוֹשֻׁ֖עַ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/015.yaml
  text: And Yahweh said to Joshua,[a]
translation:
  language: sw
  text: Kisha Yahweh akamwambia Yoshua,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “akisema”; neno hili hutanguliza maneno ya moja kwa moja katika mstari unaofuata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akamwambia
  rationale: Waw-consecutive pamoja na אמר inaendeleza simulizi. “Kisha ... akamwambia” ni Kiswahili cha kawaida kinachoonyesha mfuatano wa matukio na kwamba maneno yanaelekezwa kwa Yoshua.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahweh” badala ya kubadilishwa na cheo, hivyo kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: אֶל
  choice: -mw- katika “akamwambia”
  rationale: Kihusishi kinachoonyesha anayeelekezewa usemi kimewasilishwa kwa kiambishi cha yambwa “-mw-,” ambacho ni muundo wa asili katika Kiswahili.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: “Yoshua” ni umbo la kawaida la Kiswahili la jina hili la Kiebrania.
- source_word: לֵאמֹר
  choice: ','
  rationale: Kitenzi-jina hiki hutanguliza maneno ya moja kwa moja katika mstari unaofuata. Katika Kiswahili, koma hufanya kazi hiyo kwa ufasaha zaidi kuliko tafsiri ya moja kwa moja “akisema.” Maana ya Kiebrania imeelezwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja Tetragramatoni יהוה. Kutumia “Yahweh” huhifadhi jina hilo badala ya kulibadilisha na cheo, bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kisha” huendeleza simulizi kwa kawaida; “akamwambia” huunganisha kitendo cha kusema na anayeelekezewa. Alama ya tanbihi imewekwa baada ya koma ili kufafanua לֵאמֹר, ambayo imewakilishwa kwa uakifishaji.
