  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּעֲשׂוּ כֵ֣ן בְּנֵי יִשְׂרָאֵ֘ל כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוֹשֻׁעַ֒ וַ/יִּשְׂא֡וּ שְׁתֵּֽי עֶשְׂרֵ֨ה אֲבָנִ֜ים מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֗ן כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ לְ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יִשְׂרָאֵ֑ל וַ/יַּעֲבִר֤וּ/ם עִמָּ/ם֙ אֶל הַ/מָּל֔וֹן וַ/יַּנִּח֖וּ/ם שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/008.yaml
  text: And the sons of Israel did so[a], just as Joshua had commanded, and they carried twelve stones from the midst of the Jordan, just as Yahweh had spoken to Joshua, according to the number of the tribes of the sons of Israel[c][b]; and they brought them over with them to the lodging place and set them down there.
translation:
  language: sw
  text: Wana wa Israeli[a] wakafanya hivyo, kama Yoshua alivyokuwa amewaamuru. Wakabeba mawe kumi na mawili kutoka katikati ya Yordani[b], kama Yahwe alivyokuwa amesema na Yoshua, kulingana na idadi ya makabila ya wana wa Israeli. Wakayavusha pamoja nao hadi mahali pa kulala usiku[c], wakayaweka huko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wa Israeli”; yaani, Waisraeli.'
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoka ndani ya Yordani.” Huenda usemi huo unarejelea sehemu ya mto ambako makuhani walikuwa wamesimama.
    reason: lexical_alternative
  - marker: c
    text: Au, “mahali pa kupiga kambi.” Neno la Kiebrania linamaanisha hasa mahali pa kukaa au kulala usiku.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi usemi wa kifamilia wa Kiebrania badala ya kuufupisha kuwa “Waisraeli,” huku ukiendelea kueleweka katika Kiswahili sanifu.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: wakafanya hivyo
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba walitekeleza agizo lililotangulia.
- source_word: צִוָּה
  choice: alivyokuwa amewaamuru
  rationale: “Kuamuru” huonyesha mamlaka iliyomo katika kitenzi cha Kiebrania; wakati uliotumika unaonyesha kuwa agizo lilitangulia utekelezaji.
- source_word: וַיִּשְׂאוּ
  choice: wakachukua
  rationale: Katika muktadha wa mawe yanayohamishwa, “kuchukua” kwa kawaida hujumuisha kuyainua na kwenda nayo.
- source_word: שְׁתֵּי עֶשְׂרֵה אֲבָנִים
  choice: mawe kumi na mawili
  rationale: Hutoa idadi na nomino kwa njia ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: kutoka katikati ya Yordani
  rationale: Huhifadhi maana ya mahali ndani au katikati ya Yordani bila kuamua wazi kama kinachokusudiwa ni maji au sehemu ya mto iliyokuwa kavu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina la Mungu la herufi nne kwa umbo linalotumika kwa kawaida katika tahajia ya Kiswahili.
- source_word: דִּבֶּר ... אֶל יְהוֹשֻׁעַ
  choice: alivyokuwa amemwambia Yoshua
  rationale: Ni Kiswahili cha asili kinachowasilisha kitendo cha Yahwe kusema na Yoshua kabla ya utekelezaji.
- source_word: לְמִסְפַּר
  choice: kulingana na idadi ya
  rationale: Huonyesha ulinganifu kati ya mawe kumi na mawili na idadi ya makabila.
- source_word: שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: makabila ya wana wa Israeli
  rationale: Huhifadhi usemi kamili wa Kiebrania na uhusiano wake na kutajwa kwa “wana wa Israeli” mwanzoni mwa aya.
- source_word: וַיַּעֲבִרוּם
  choice: wakayavusha
  rationale: Umbo la kusababisha la “kuvuka” linaonyesha kwamba watu hao waliyapeleka mawe upande mwingine.
- source_word: עִמָּם
  choice: pamoja nao
  rationale: Huonyesha kwamba waliyachukua mawe pamoja nao walipovuka.
- source_word: הַמָּלוֹן
  choice: mahali pa kulala
  rationale: Huhifadhi maana mahsusi ya mahali pa kukaa usiku, badala ya kuitafsiri kwa ujumla tu kuwa kambi.
- source_word: וַיַּנִּיחוּם שָׁם
  choice: wakayaweka huko
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kuyaacha au kuyaweka mawe mahali hapo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano, si cheo. “Yahwe” hulihifadhi jina hilo kwa tahajia ya kawaida ya Kiswahili bila kulibadili kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Msururu wa vitenzi vya “waka-” huhifadhi mwendo wa simulizi la Kiebrania, huku sentensi zikigawanywa ili zisomeke kwa kawaida.
