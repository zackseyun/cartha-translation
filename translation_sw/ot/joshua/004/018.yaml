id: JOS.4.18
reference: Joshua 4:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ֠/יְהִי ב/עלות הַ/כֹּהֲנִ֜ים נֹשְׂאֵ֨י אֲר֤וֹן בְּרִית יְהוָה֙ מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֔ן נִתְּק֗וּ כַּפּוֹת֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים אֶ֖ל הֶ/חָרָבָ֑ה וַ/יָּשֻׁ֤בוּ מֵֽי הַ/יַּרְדֵּן֙ לִ/מְקוֹמָ֔/ם וַ/יֵּלְכ֥וּ כִ/תְמוֹל שִׁלְשׁ֖וֹם עַל כָּל גְּדוֹתָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/018.yaml
  text: And it happened[a], when the priests carrying the ark of the covenant of Yahweh came up from the midst of the Jordan, and the soles of the priests’ feet were lifted up to the dry ground[b], that the waters of the Jordan returned to their place and went as before over all its banks.
translation:
  language: sw
  text: Ikawa makuhani waliolibeba sanduku la agano la Yahweh walipopanda kutoka katikati ya Yordani, na nyayo za miguu ya makuhani zilipoondoka kwenye maji na kufika nchi kavu[b], maji ya Yordani yakarudi mahali pake na yakafurika kingo zake zote kama hapo awali[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kama jana na juzi,” nahau yenye maana ya “kama hapo awali” au “kama zamani.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania kinaweza pia kutafsiriwa: “nyayo za miguu ya makuhani zilipoinuliwa kuelekea nchi kavu.” Kitenzi hicho huonyesha nyayo zikiondolewa kutoka mahali zilipokuwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi utangulizi wa tukio katika usimulizi wa Kiebrania kwa lugha ya heshima na iliyozoeleka katika masimulizi ya Kiswahili.
- source_word: בַעֲלוֹת
  choice: walipopanda
  rationale: ב pamoja na kitenzi-jina cha עלה huunda kishazi cha wakati; ‘walipopanda’ huonyesha kutoka ndani ya bonde la mto kwenda nchi kavu.
- source_word: נֹשְׂאֵי
  choice: waliolibeba
  rationale: Kauli endelevu ya נשׂא inawaeleza makuhani kuwa wabebaji wa sanduku; ‘kubeba’ ni Kiswahili cha kawaida na wazi.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahweh
  rationale: Hufuata mnyororo wa umilikaji wa Kiebrania na kuhifadhi jina binafsi la Mungu, יהוה, kama ‘Yahweh’.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: kutoka katikati ya Yordani
  rationale: תוך huonyesha ndani au katikati ya mto, si ukingo wake tu.
- source_word: נִתְּקוּ כַּפּוֹת רַגְלֵי
  choice: nyayo za miguu ... zilipoinuliwa
  rationale: נִתְּקוּ hapa huonyesha nyayo zikiondolewa au kuinuliwa kutoka mahali zilipokuwa; tafsiri hii huhifadhi mwendo wa kimwili bila kutumia usemi mkali wa ‘kung’olewa’ katika matini kuu.
- source_word: אֶל הֶחָרָבָה
  choice: hadi kwenye nchi kavu
  rationale: אֶל huonyesha mwelekeo au mwisho wa mwendo, na חָרָבָה ni nchi kavu tofauti na sakafu yenye maji ya mto.
- source_word: וַיָּשֻׁבוּ מֵי הַיַּרְדֵּן לִמְקוֹמָם
  choice: maji ya Yordani yakarudi mahali pake
  rationale: Tafsiri ya moja kwa moja inayohifadhi taswira ya maji kurudi mahali yalipokuwa.
- source_word: כִתְמוֹל שִׁלְשׁוֹם
  choice: kama hapo awali
  rationale: Nahau hii ya Kiebrania, kihalisi ‘kama jana na siku ya tatu,’ humaanisha hali iliyokuwa kawaida hapo kabla.
- source_word: וַיֵּלְכוּ ... עַל כָּל גְּדוֹתָיו
  choice: yakafurika kingo zake zote
  rationale: Katika muktadha wa mto, הלך pamoja na עַל kingo huonyesha maji yakienda au kutiririka juu ya kingo; ‘yakafurika’ ni Kiswahili cha asili kinachowasilisha picha hiyo kwa uwazi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Matini ya Kiebrania ina jina la agano יהוה moja kwa moja; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kulibadili kuwa cheo.
- issue: Uhusiano wa kuinuliwa kwa nyayo na kurudi kwa maji
  choice: 'Matukio yanafuatana ndani ya sentensi moja: makuhani wanapanda, nyayo zinafika nchi kavu, kisha maji yanarudi.'
  alternative: Kufanya kuinuliwa kwa nyayo kuwa sehemu tu ya kishazi cha wakati na kurudi kwa maji kuwa tendo kuu pekee.
  rationale: Muundo wa Kiebrania una utata wa kisintaksia kiasi, lakini mfuatano wa vitenzi unaonyesha wazi hatua zinazofuatana bila kuhitaji madai ya ziada ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa masimulizi ulio wa heshima lakini unaoeleweka kwa msomaji wa kawaida. ‘Sanduku la agano’ na ‘nyayo za miguu’ huhifadhi istilahi na taswira za matini chanzi; ‘yakafurika kingo zake zote’ hutumia Kiswahili cha asili kueleza maji kwenda juu ya kingo.
