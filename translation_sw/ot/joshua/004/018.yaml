revisions:
- from: Ikawa makuhani waliolibeba sanduku la agano la Yahweh walipopanda kutoka katikati ya Yordani, na nyayo za miguu ya makuhani zilipoinuliwa hadi kwenye nchi kavu[b], maji ya Yordani yakarudi mahali pake na yakafurika kingo zake zote kama hapo awali[a].
  to: Ikawa makuhani waliolibeba sanduku la agano la Yahweh walipopanda kutoka katikati ya Yordani, na nyayo za miguu ya makuhani zilipoondoka kwenye maji na kufika nchi kavu[b], maji ya Yordani yakarudi mahali pake na yakafurika kingo zake zote kama hapo awali[a].
  rationale: The revision preserves the Hebrew narrative progression and all key terms while making the movement of the priests’ feet idiomatic in modern Standard East African Swahili. It also corrects the literal explanation of the Hebrew idiom in footnote a and properly identifies footnote b as a lexical alternative.
