    reason: lexical_alternative
  revision_rationale: The revision preserves the Hebrew narrative progression and all key terms while making the movement of the priests’ feet idiomatic in modern Standard East African Swahili. It also corrects the literal explanation of the Hebrew idiom in footnote a and properly identifies footnote b as a lexical alternative.
