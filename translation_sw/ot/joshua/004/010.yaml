  text: וְ/הַ/כֹּהֲנִ֞ים נֹשְׂאֵ֣י הָ/אָר֗וֹן עֹמְדִים֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ עַ֣ד תֹּ֣ם כָּֽל הַ֠/דָּבָר אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת יְהוֹשֻׁ֨עַ֙ לְ/דַבֵּ֣ר אֶל הָ/עָ֔ם כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וַ/יְמַהֲר֥וּ הָ/עָ֖ם וַֽ/יַּעֲבֹֽרוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/010.yaml
  text: And the priests carrying the ark stood in the midst of the Jordan until everything was finished that Yahweh had commanded Joshua to speak to the people[a], according to all that Moses had commanded Joshua. And the people hurried and crossed over.
translation:
  language: sw
  text: Makuhani waliolibeba Sanduku waliendelea kusimama katikati ya Yordani mpaka yote ambayo Yahweh alimwamuru Yoshua ayaseme kwa watu yakamilike[a], sawasawa na yote ambayo Musa alikuwa amemwagiza Yoshua. Watu wakafanya haraka, wakavuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “mpaka kukamilika kwa jambo lote”; msemo huu unajumlisha kutimizwa kwa yote ambayo Yahweh alikuwa amemwagiza Yoshua ayaseme kwa watu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים נֹשְׂאֵי הָאָרוֹן
  choice: Makuhani waliolibeba Sanduku
  rationale: Muundo wa kishirikishi unawatambulisha makuhani kwa tendo lao linaloendelea. “Waliolibeba” ni Kiswahili cha kawaida; “Sanduku” limetumiwa bila kuongeza “la Agano,” kwa kuwa maneno hayo hayapo katika mstari huu.
- source_word: עֹמְדִים בְּתוֹךְ הַיַּרְדֵּן
  choice: waliendelea kusimama katikati ya Yordani
  rationale: Kishirikishi cha Kiebrania kinaonyesha hali iliyoendelea. “Waliendelea kusimama” huonyesha udumifu huo, na “katikati ya Yordani” huhifadhi maana ya mahali ndani ya mto.
- source_word: עַד תֹּם כָּל הַדָּבָר
  choice: mpaka jambo lote ... lilipokamilika
  rationale: דָּבָר inaweza kumaanisha neno, jambo, au suala. “Jambo lote” huhifadhi upana wa msemo wa Kiebrania kuliko kuugeuza moja kwa moja kuwa “kila kitu,” huku tanbihi ikifafanua muundo halisi.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת יְהוֹשֻׁעַ לְדַבֵּר אֶל הָעָם
  choice: ambalo Yahweh alikuwa amemwagiza Yoshua awaambie watu
  rationale: “Awaambie watu” ni njia ya kawaida ya Kiswahili ya kueleza kusema kwao, bila kuainisha zaidi yaliyosemwa. “Alikuwa amemwagiza” huonyesha kuwa agizo lilitangulia kutimizwa kwake.
- source_word: כְּכֹל אֲשֶׁר צִוָּה מֹשֶׁה אֶת יְהוֹשֻׁעַ
  choice: sawasawa na yote ambayo Musa alikuwa amemwagiza Yoshua
  rationale: “Sawasawa na” huonyesha ulinganifu au kufuata kikamilifu unaobebwa na כְּכֹל, huku “yote” ikihifadhi wazo la ujumla.
- source_word: וַיְמַהֲרוּ הָעָם וַיַּעֲבֹרוּ
  choice: Watu wakafanya haraka wakavuka
  rationale: Vitenzi vinavyofuatana kwa “waka-” vinafaa kwa mtiririko wa simulizi la Kiswahili na huhifadhi dhana ya haraka pamoja na kuvuka.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la agano la Mungu limetafsiriwa moja kwa moja kama “Yahweh,” badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yana jina la Mungu lenye herufi nne, si cheo. “Yahweh” huhifadhi jina hilo bila kuingiza mapokeo ya dhehebu fulani.
- issue: Uhusiano kati ya agizo la Yahweh na agizo la Musa
  choice: Kudumisha vifungu vyote viwili bila kuvifanya kuwa agizo moja lililoelezwa upya
  alternative: Kufafanua kwamba Yahweh alimwagiza Yoshua jambo lilelile ambalo Musa alikuwa amemwagiza
  rationale: Kiebrania kinaweka kauli hizi kwa mfuatano lakini hakifafanui kikamilifu uhusiano wao. Tafsiri inadumisha mvutano huo badala ya kuutatua kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “waliendelea kusimama” unaonyesha tendo la muda, na mfululizo wa “waka-” mwishoni unaendeleza kasi ya simulizi.
