revisions:
- from: Makuhani waliolibeba Sanduku waliendelea kusimama katikati ya Yordani mpaka jambo lote ambalo Yahweh alikuwa amemwagiza Yoshua awaambie watu lilipokamilika[a], sawasawa na yote ambayo Musa alikuwa amemwagiza Yoshua. Watu wakafanya haraka wakavuka.
  to: Makuhani waliolibeba Sanduku waliendelea kusimama katikati ya Yordani mpaka yote ambayo Yahweh alimwamuru Yoshua ayaseme kwa watu yakamilike[a], sawasawa na yote ambayo Musa alikuwa amemwagiza Yoshua. Watu wakafanya haraka, wakavuka.
  rationale: Revision replaces ‘awaambie’ with ‘ayaseme kwa watu’ to retain the source’s explicit ‘speak to’ language and adjusts the completion clause so that its scope is clearer in Swahili. The wording continues to preserve the source’s broad ‘matter/word’ and does not harmonize or explain the relation between Yahweh’s command and Moses’ command.
