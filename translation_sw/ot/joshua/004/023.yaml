id: JOS.4.23
reference: Joshua 4:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֲשֶׁר הוֹבִישׁ֩ יְהוָ֨ה אֱלֹהֵי/כֶ֜ם אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵי/כֶ֖ם עַֽד עָבְרְ/כֶ֑ם כַּ/אֲשֶׁ֣ר עָשָׂה֩ יְהוָ֨ה אֱלֹהֵי/כֶ֧ם לְ/יַם ס֛וּף אֲשֶׁר הוֹבִ֥ישׁ מִ/פָּנֵ֖י/נוּ עַד עָבְרֵֽ/נוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/023.yaml
  text: For Yahweh your God dried up the waters of the Jordan before you until you crossed over[a], just as Yahweh your God did to the Sea of Reeds, which he dried up before us until we crossed over.
translation:
  language: sw
  text: Kwa maana Yahwe, Mungu wenu, aliyakausha maji ya Yordani mbele yenu mpaka mlipovuka, kama vile Yahwe, Mungu wenu, alivyofanya kwa Bahari ya Matete[a], ambayo aliikausha mbele yetu mpaka tulipovuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa desturi hutafsiriwa “Bahari ya Shamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹבִישׁ
  choice: aliyakausha / aliikausha
  rationale: 'Hifili ya יבש hapa ina maana ya kusababisha maji yakauke ili watu waweze kuvuka. Kiswahili kinahitaji upatanisho wa ngeli: “aliyakausha” kwa “maji” na “aliikausha” kwa “bahari,” huku kitenzi kilekile cha msingi kikihifadhiwa.'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA,” hivyo jina la agano linahifadhiwa.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: 'Katika muundo huu unaohusishwa na Yahwe, neno lina maana ya umoja: Mungu wa Israeli.'
- source_word: מֵי הַיַּרְדֵּן
  choice: maji ya Yordani
  rationale: Huhifadhi picha halisi ya maji ya mto; “Yordani” ni jina linalotambulika kwa urahisi katika Kiswahili cha Biblia.
- source_word: מִפְּנֵיכֶם
  choice: mbele yenu
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya mahali ya nahau ya Kiebrania, yaani maji kuondolewa mbele yao.
- source_word: עַד עָבְרְכֶם
  choice: mpaka mlipovuka
  rationale: Huonyesha muda ulioendelea hadi tendo la kuvuka lilipotimia, kwa lugha ya kawaida na iliyo wazi.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: kama vile ... alivyoifanyia
  rationale: Muundo huu unaonyesha wazi ulinganisho wa tukio la Yordani na tukio la baharini.
- source_word: יַם סוּף
  choice: Bahari ya Matete
  rationale: סוּף humaanisha matete au mimea ya majini; tafsiri hii hutanguliza maana ya Kiebrania kuliko jina la kimapokeo “Bahari ya Shamu.”
- source_word: מִפָּנֵינוּ
  choice: mbele yetu
  rationale: Huhifadhi ulinganifu na “mbele yenu” pamoja na mabadiliko ya nafsi kutoka ‘ninyi’ kwenda ‘sisi.’
- source_word: עַד עָבְרֵנוּ
  choice: mpaka tulipovuka
  rationale: Huhifadhi marudio yaliyokusudiwa ya kishazi cha awali, sasa katika nafsi ya kwanza wingi.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova; BWANA
  rationale: Matini ya Kiebrania inatumia jina maalumu la Mungu. Kulihifadhi kama “Yahwe” huepuka kulibadilisha kwa cheo na hakupotezi utambulisho wake wa kiagano.
- issue: Kutafsiri יַם סוּף
  choice: Bahari ya Matete
  alternative: Bahari ya Shamu
  rationale: Maana ya moja kwa moja ya neno סוּף inahusiana na matete. Tafsiri ya kimapokeo imehifadhiwa katika tanbihi ili wasomaji waweze kuitambua bila kuifanya itawale matini ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imehifadhi ulinganifu na marudio ya Kiebrania kati ya kuvuka Yordani na kuvuka bahari. Alama ya tanbihi imewekwa baada ya “Bahari ya Matete,” ambako mbadala huo wa kileksika unahusika.
