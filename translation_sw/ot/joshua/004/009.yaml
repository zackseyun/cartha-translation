  variant: Standard East African Swahili
source:
  edition: WLC
  text: וּ/שְׁתֵּ֧ים עֶשְׂרֵ֣ה אֲבָנִ֗ים הֵקִ֣ים יְהוֹשֻׁעַ֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ תַּ֗חַת מַצַּב֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים נֹשְׂאֵ֖י אֲר֣וֹן הַ/בְּרִ֑ית וַ/יִּ֣הְיוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/009.yaml
  text: And Joshua set up twelve stones in the midst of the Jordan[a], under the place where the feet of the priests carrying the ark of the covenant stood, and they are there to this day.
translation:
  language: sw
  text: Yoshua akasimamisha mawe kumi na mawili katikati ya Yordani, chini ya mahali pale ambapo miguu ya makuhani waliobeba sanduku la agano ilisimama,[a] nayo yako huko mpaka leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chini ya mahali pa kusimama kwa miguu ya makuhani.” Usemi wa Kiebrania ni wa neno kwa neno zaidi na unarejelea mahali ambapo makuhani walisimama huku wakibeba sanduku la agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵקִים
  choice: akasimamisha
  rationale: Hifili ya קום hapa ina maana ya kusimamisha au kuweka kitu kikiwa kimesimama; “akasimamisha” ni ya kawaida na inafaa kwa mawe ya ukumbusho.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: katikati ya Yordani
  rationale: תּוֹךְ huonyesha sehemu ya kati au ndani; “katikati ya Yordani” huhifadhi dai la wazi kwamba mawe yaliwekwa ndani ya mto.
- source_word: תַּחַת מַצַּב רַגְלֵי
  choice: mahali pale ambapo miguu ... ilisimama
  rationale: מַצָּב hurejelea mahali pa kusimama. Muundo huu ni wa asili katika Kiswahili huku ukihifadhi taarifa ya mahali, bila tafsiri nzito ya neno kwa neno.
- source_word: נֹשְׂאֵי אֲרוֹן הַבְּרִית
  choice: waliobeba sanduku la agano
  rationale: Kivumishi-shirikishi נֹשְׂאֵי huwaeleza makuhani kuwa wabebaji wa sanduku; “waliobeba” ni wazi na ya kawaida.
- source_word: וַיִּהְיוּ שָׁם
  choice: nayo yako huko
  rationale: Pamoja na עַד הַיּוֹם הַזֶּה, usemi unaonyesha hali iliyoendelea hadi wakati wa msimulizi; “yako huko” huonyesha mtazamo huo.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Huu ni usemi wa kawaida unaomaanisha kuendelea hadi siku ya msimulizi; “mpaka leo” ni Kiswahili cha kawaida na chenye hadhi.
theological_decisions:
- issue: Mvutano wa kisimulizi kati ya mawe ya mstari huu na mawe kumi na mawili yaliyosimamishwa Gilgali katika muktadha unaozunguka
  choice: Kutafsiri wazi kwamba Yoshua alisimamisha mawe kumi na mawili katikati ya Yordani yenyewe.
  alternative: Kufasiri kuwa ni muhtasari wa mawe yaliyotolewa Yordani na kuwekwa kwingine, au kuoanisha maandishi ili yawe na ukumbusho mmoja tu.
  rationale: Kiebrania kinasema wazi בְּתוֹךְ הַיַּרְדֵּן, “katikati ya Yordani.” Tafsiri inapaswa kuhifadhi dai hilo badala ya kuondoa mvutano wa maandishi.
- issue: Nguvu ya usemi wa ukumbusho עַד הַיּוֹם הַזֶּה
  choice: 'Kuonyesha hali inayoendelea kwa mtazamo wa msimulizi: “nayo yako huko mpaka leo.”'
  alternative: “Nayo yalikuwa huko mpaka leo.”
  rationale: Hii huhifadhi mtazamo wa wakati wa msimulizi bila kudai kwamba mawe hayo yanaonekana katika siku ya msomaji wa sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Sanduku la agano” limetumiwa kwa uwazi na mwendelezo wa istilahi za Biblia. Alama ya tanbihi [a] imewekwa mara tu baada ya kishazi kinachohusika.
