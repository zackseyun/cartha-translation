  text: so that this may be a sign among you[a]. When your children ask in time to come, saying[c][b], ‘What do these stones mean to you?’
translation:
  language: sw
  text: ili jambo hili liwe ishara miongoni mwenu. Watoto wenu[a] watakapouliza siku zijazo[c], wakisema, “Mawe haya yana maana gani kwenu?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wana wenu.” Hapa neno hilo linaelekea kuwakilisha kizazi kijacho kwa ujumla, ndiyo maana limetafsiriwa “watoto wenu.”'
    reason: lexical_alternative
  - marker: b
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kiebrania, “Mawe haya ni nini kwenu?”
    reason: lexical_alternative
  - marker: c
    text: Neno la Kiebrania linalomaanisha “kesho” linaweza kutumiwa hapa kwa maana ya “siku zijazo” au “baadaye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ili
  rationale: Huanzisha kusudi; “ili” ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: תִּהְיֶה
  choice: liwe
  rationale: Hali tegemezi baada ya “ili” huonyesha matokeo yaliyokusudiwa.
- source_word: זֹאת
  choice: jambo hili
  rationale: Kiwakilishi cha kike cha umoja kinarejelea mpango huu wa mawe kuwa ukumbusho; “jambo hili” ni wazi na la kawaida katika Kiswahili.
- source_word: אוֹת
  choice: ishara
  rationale: Neno hili humaanisha alama yenye umuhimu; “ishara” huhifadhi maana yake ya moja kwa moja bila kuongeza ufafanuzi usiotajwa.
- source_word: בְּקִרְבְּכֶם
  choice: miongoni mwenu
  rationale: Huonyesha mahali ndani ya jumuiya, si ndani ya mtu mmoja mmoja.
- source_word: כִּי
  choice: watakapouliza
  rationale: Maana ya mazingira yanayotarajiwa imewasilishwa kwa kiambishi cha wakati -taka- katika muundo wa Kiswahili.
- source_word: יִשְׁאָלוּן
  choice: watakapouliza
  rationale: Kitenzi “kuuliza” ni tafsiri ya kawaida na wazi ya שאל.
- source_word: בְּנֵיכֶם
  choice: watoto wenu
  rationale: Ingawa umbo la Kiebrania ni “wana wenu,” hapa linawakilisha kizazi kijacho kwa ujumla.
- source_word: מָחָר
  choice: siku zijazo
  rationale: Katika muktadha huu neno “kesho” linatumika kwa maana pana ya wakati ujao; “siku zijazo” hutoa maana hiyo kiasili.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Huhifadhi kiashiria cha kunukuu kinachotanguliza swali.
- source_word: מָה ... לָכֶם
  choice: yana maana gani kwenu?
  rationale: Kiebrania halisi ni “Mawe haya ni nini kwenu?”; usemi wa Kiswahili unauliza kiasili umuhimu wa mawe hayo huku ukihifadhi “kwenu.”
- source_word: הָאֲבָנִים הָאֵלֶּה
  choice: Mawe haya
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kiambishi cha uhakika na kiwakilishi kionyeshi.
theological_decisions:
- issue: Lugha ya kijinsia katika בְּנֵיכֶם
  choice: watoto wenu
  alternative: wana wenu
  rationale: Umbo la Kiebrania ni la kiume kwa wingi, lakini katika mazingira ya ukumbusho linawakilisha kizazi kijacho kitakachouliza kuhusu mawe. “Watoto wenu” huepuka kuingiza kizuizi cha wana wa kiume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mgawanyo wa sentensi mbili umehifadhiwa kwa urahisi wa usomaji; “wakisema” huhifadhi muundo wa kunukuu wa Kiebrania.
