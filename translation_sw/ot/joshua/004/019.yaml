base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/019.yaml
  text: And the people came up from the Jordan on the tenth day of the first month[b][a], and they camped at Gilgal on the eastern border of Jericho.
translation:
  language: sw
  text: Watu wakapanda kutoka Mto Yordani siku ya kumi ya mwezi wa kwanza, wakapiga kambi huko Gilgali, kwenye ukingo wa mashariki wa Yeriko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upande wa mashariki wa Yeriko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלוּ
  choice: walitoka
  rationale: Katika muktadha wa kuvuka mto, kitenzi kinaeleza kupanda na kutoka katika Yordani. Kiswahili cha kawaida husema kwa ufasaha zaidi ‘walitoka katika Mto Yordani’ bila kupoteza mwendo unaokusudiwa.
- source_word: מִן הַיַּרְדֵּן
  choice: katika Mto Yordani
  rationale: Kirai kinaonyesha mahali walikotoka. Kutaja ‘Mto’ kunafanya jina Yordani lieleweke wazi kwa msomaji wa kawaida.
- source_word: בֶּעָשׂוֹר
  choice: siku ya kumi
  rationale: Hii ni nahau ya tarehe; neno ‘siku’ linaongezwa kwa kawaida katika Kiswahili ili maana iwe wazi.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: ya mwezi wa kwanza
  rationale: חֹדֶשׁ katika kauli hii ya kalenda humaanisha mwezi.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Hii ni kauli ya asili na ya sasa ya Kiswahili kwa tendo la kusimama na kuweka kambi.
- source_word: בַּגִּלְגָּל
  choice: huko Gilgali
  rationale: Jina la mahali limetoholewa kwa umbo linalotambulika katika Kiswahili; ‘huko’ linaonyesha mahali walipopiga kambi.
- source_word: בִּקְצֵה מִזְרַח יְרִיחוֹ
  choice: kwenye ukingo wa mashariki wa Yeriko
  rationale: קָצֶה inaweza kumaanisha ukingo, mwisho, au mpaka; pamoja na מִזְרַח, kirai kinaeleza upande wa mashariki wa Yeriko. ‘Ukingo’ huhifadhi taswira ya mwisho wa eneo bila kudai kwa lazima mpaka rasmi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wazi na wenye heshima. ‘Wakapiga kambi’ limetumiwa badala ya neno la kizamani zaidi; utata mdogo wa kirai cha mwisho umehifadhiwa kwa tanbihi.
