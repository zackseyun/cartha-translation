base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/024.yaml
  text: so that all the peoples of the earth may know that the hand of Yahweh is strong[b][a], and so that you may fear Yahweh your God all your days.
translation:
  language: sw
  text: ili watu wa mataifa yote duniani[a] wajue kwamba mkono wa Yahweh una nguvu, na ili mmche[b] Yahweh, Mungu wenu, siku zenu zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa mataifa yote ya nchi,” ikiwa הָאָרֶץ inaeleweka kwa maana ya nchi au eneo hilo badala ya dunia nzima.
    reason: lexical_alternative
  - marker: b
    text: Hapa “kumcha” kunajumuisha kicho na heshima kwa Yahweh, wala si hofu pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ili
  rationale: Huonyesha kusudi katika vifungu vyote viwili na ni muundo wa kawaida na wa asili katika Kiswahili.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: jamii zote za watu duniani
  rationale: Huhifadhi wingi wa עַמִּים (‘jamii za watu’) bila kuifanya iwe hasa mataifa ya kisiasa; ‘duniani’ linafaa na muktadha mpana.
- source_word: יַד יְהוָה
  choice: mkono wa Yahweh
  rationale: Huhifadhi taswira halisi ya Kiebrania badala ya kuifafanua moja kwa moja kuwa ‘nguvu za Yahweh’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Huwakilisha jina la agano lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadilisha kuwa cheo.
- source_word: כִּי חֲזָקָה הִיא
  choice: kwamba ... una nguvu
  rationale: Kivumishi חֲזָקָה kinaeleza ‘mkono’; ‘una nguvu’ ni Kiswahili cha asili kinachohifadhi maana ya kuwa na nguvu.
- source_word: יְרָאתֶם
  choice: mmche
  rationale: Kitenzi ‘kumcha’ huhifadhi uzito wa ירא na kinaweza kujumuisha hofu, kicho, na heshima bila kuipunguza maana kuwa heshima peke yake.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Katika muundo ‘Yahweh Mungu wenu,’ אֱלֹהֵיכֶם humrejelea Mungu mmoja wa agano.
- source_word: כָּל הַיָּמִים
  choice: siku zote
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha mwendelezo wa kudumu katika maisha.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini inatumia jina la Mungu moja kwa moja; ‘Yahweh’ huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Maana ya ירא katika muktadha wa agano
  choice: mmche
  alternative: mheshimu au mwe na kicho kwa
  rationale: ‘Kumcha’ huhifadhi mvutano wa maana unaojumuisha hofu takatifu, kicho, na heshima, bila kuamua kwamba ni heshima tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘jamii zote za watu duniani’ huhifadhi wingi wa makundi ya watu huku ukibaki wazi kwa msomaji wa kawaida; taswira ‘mkono wa Yahweh’ imehifadhiwa.
