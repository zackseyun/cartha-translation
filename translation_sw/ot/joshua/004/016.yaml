  text: Command the priests who carry the ark of the testimony to come up from the Jordan[a].
translation:
  language: sw
  text: Waamuru makuhani wanaobeba sanduku la ushuhuda watoke Yordani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sanduku la ushahidi.” Kiebrania kinasema “ushuhuda,” si “agano,” neno linalotumiwa katika marejeo mengine mengi ya sanduku hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַוֵּה
  choice: Waamuru
  rationale: Kauli ya amri ya moja kwa moja kwa Yoshua; “waamuru” huhifadhi uzito wa agizo bila kulainisha maana.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Tafsiri ya kawaida ya כֹּהֲנִים; hali ya urejeo maalumu inaeleweka katika muktadha wa Kiswahili.
- source_word: נֹשְׂאֵי
  choice: wanaobeba
  rationale: Kauli ya uhusiano ya Kiswahili inawakilisha kwa njia ya asili nomino-tendo ya Kiebrania inayowafafanua makuhani.
- source_word: אֲרוֹן הָעֵדוּת
  choice: sanduku la ushuhuda
  rationale: Huhifadhi neno עֵדוּת, “ushuhuda,” badala ya kulisawazisha na usemi unaojulikana zaidi “sanduku la agano.”
- source_word: וְיַעֲלוּ
  choice: wapande
  rationale: Kitenzi עלה kina maana ya kupanda au kutoka juu; katika muktadha huu makuhani wanapanda kutoka ndani ya mto.
- source_word: מִן הַיַּרְדֵּן
  choice: kutoka Yordani
  rationale: מן huonyesha mwendo wa kutoka mahali; “kutoka Yordani” ni fupi na ya kawaida, huku muktadha ukionyesha kuwa Yordani ni mto.
