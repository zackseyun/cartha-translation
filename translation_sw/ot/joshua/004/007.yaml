language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֣ם לָ/הֶ֗ם אֲשֶׁ֨ר נִכְרְת֜וּ מֵימֵ֤י הַ/יַּרְדֵּן֙ מִ/פְּנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה בְּ/עָבְר/וֹ֙ בַּ/יַּרְדֵּ֔ן נִכְרְת֖וּ מֵ֣י הַ/יַּרְדֵּ֑ן וְ֠/הָיוּ הָ/אֲבָנִ֨ים הָ/אֵ֧לֶּה לְ/זִכָּר֛וֹן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/007.yaml
  text: then you shall say to them[a], ‘The waters of the Jordan were cut off before the ark of the covenant of Yahweh. When it crossed over the Jordan, the waters of the Jordan were cut off.’ And these stones shall be a memorial to the sons of Israel forever.
translation:
  language: sw
  text: ndipo mtakapowaambia, ‘Maji ya Yordani yalikatizwa mbele ya sanduku la agano la Yahwe. Sanduku hilo lilipovuka Yordani, maji ya Yordani yalikatizwa.’ Mawe haya yatakuwa ukumbusho kwa wana wa Israeli[a] milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.” Kiebrania ni “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְרְתוּ
  choice: yalikatizwa
  rationale: Kauli hii inaeleza kusimamishwa kwa maji ya mto. “Yalikatizwa” huhifadhi picha ya Kiebrania ya kukatwa huku ikiwa wazi katika Kiswahili.
- source_word: מֵימֵי / מֵי
  choice: maji ya
  rationale: Huhifadhi usemi wa wingi wa Kiebrania na kueleza maji au mtiririko wa Mto Yordani kwa njia ya kawaida.
- source_word: מִפְּנֵי
  choice: mbele ya
  rationale: 'Huhifadhi maana ya mahali: maji yalisimamishwa mbele ya uwepo wa sanduku.'
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahwe
  rationale: Huhifadhi jina kamili la kitu hicho na uhusiano wake na agano la Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Ni uhawilishaji wa kawaida wa Kiswahili wa jina la Mungu lililoandikwa kwa herufi nne za Kiebrania.
- source_word: בְּעָבְרוֹ
  choice: Sanduku hilo lilipovuka
  rationale: Kiambishi cha nafsi ya tatu umoja kinarejelea sanduku. Kurudia “sanduku hilo” huondoa utata usio wa lazima katika Kiswahili bila kubadili rejeo.
- source_word: וְהָיוּ
  choice: yatakuwa
  rationale: Katika maagizo haya, kitenzi kina nguvu ya wakati ujao na kinaeleza kusudi la kudumu la mawe.
- source_word: הָאֲבָנִים הָאֵלֶּה
  choice: mawe haya
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha kuonyesha.
- source_word: לְזִכָּרוֹן
  choice: ukumbusho
  rationale: Neno hili linafaa kwa kitu cha kudumu kinachokumbusha tukio la kihistoria, si kumbukumbu ya akilini tu.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kwa wana wa Israeli
  rationale: “Wana wa Israeli” huhifadhi muundo wa Kiebrania na pia ni usemi wa Kiswahili unaoweza kurejelea taifa lote.
- source_word: עַד עוֹלָם
  choice: milele
  rationale: Ni tafsiri fupi na ya kawaida ya usemi unaoonyesha muda unaoendelea bila kikomo kilichotajwa.
theological_decisions:
- issue: Uwakilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu; “Yahwe” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Chaguo hili huhifadhi kwa karibu muundo wa Kiebrania bila kuamua kwamba rejeo linawahusu wanaume pekee; katika muktadha ni jina la pamoja la watu wa Israeli.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Marudio ya “maji ya Yordani yalikatizwa” yamehifadhiwa kwa sababu yapo katika chanzo na yanasisitiza ishara hiyo.
