base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/005.yaml
  text: And Joshua said to them[a], “Cross over before the ark of Yahweh your God into the middle of the Jordan, and let each man lift up one stone on his shoulder, according to the number of the tribes of the sons of Israel.”
translation:
  language: sw
  text: Yoshua akawaambia, “Piteni mbele ya sanduku la Yahwe, Mungu wenu, mkaingie katikati ya Yordani. Kila mwanamume na ainue jiwe moja begani mwake, kwa kadiri ya idadi ya makabila ya wana wa Israeli[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania kinasema kihalisi, “wana wa Israeli.”
    reason: Kuonyesha tafsiri mbadala ya kawaida huku usemi rasmi wa Kiebrania ukihifadhiwa katika maandishi.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akawaambia
  rationale: Muundo huu unaendeleza mtiririko wa simulizi wa Kiebrania na kuonyesha kuwa Yoshua alisema maneno hayo kwa wale wanaume waliotajwa katika muktadha.
- source_word: עִבְרוּ לִפְנֵי
  choice: Piteni mbele ya
  rationale: Ni amri ya kuvuka au kupita na inaonyesha mahali pao kuhusiana na sanduku, bila kuongeza maelezo yasiyomo katika chanzo.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵיכֶם
  choice: sanduku la Yahwe, Mungu wenu
  rationale: Inahifadhi mfuatano wa maana wa chanzo; neno “agano” halijaongezwa kwa sababu halipo katika mstari huu.
- source_word: אֶל תּוֹךְ הַיַּרְדֵּן
  choice: hadi katikati ya Mto Yordani
  rationale: תּוֹךְ inaonyesha sehemu ya ndani au katikati, huku “Mto Yordani” ikiwa namna ya kawaida na wazi ya kutaja Yordani kwa Kiswahili.
- source_word: וְהָרִימוּ לָכֶם אִישׁ אֶבֶן אַחַת עַל שִׁכְמוֹ
  choice: Kila mwanamume ainue jiwe moja na kuliweka begani mwake
  rationale: Inadumisha amri ya kuinua, mgawanyo wa jiwe moja kwa kila mwakilishi wa kiume, na umoja wa “bega lake”; “kuliweka” hufanya uhusiano wa jiwe na bega uwe wa kawaida kwa Kiswahili.
- source_word: לְמִסְפַּר
  choice: ili idadi ya mawe ilingane na idadi ya
  rationale: 'Inafafanua kwa Kiswahili cha kawaida ulinganifu unaokusudiwa: jiwe moja kwa kila kabila, bila kubadili idadi.'
- source_word: שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: makabila ya wana wa Israeli
  rationale: Inahifadhi usemi rasmi wa Kiebrania בְנֵי יִשְׂרָאֵל badala ya kuufupisha moja kwa moja kuwa “Waisraeli.”
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu, tetragramatoni; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Jinsi ya kutafsiri אִישׁ katika muktadha wa wawakilishi kumi na wawili
  choice: kila mwanamume
  alternative: kila mmoja
  rationale: Muktadha wa karibu unawahusu wanaume waliochaguliwa, mmoja kutoka kila kabila; tafsiri ya kiume inatunza umbo na rejeleo la chanzo bila kulipanua.
- issue: Jinsi ya kutafsiri בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Usemi rasmi wa ukoo na agano umehifadhiwa, huku tanbihi ikitoa namna ya kawaida zaidi bila kufuta upekee wa maneno ya chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi ya Biblia. Sentensi imegawanywa kwa uwazi, lakini mwendo wa amri na ulinganifu wa jiwe moja kwa kila kabila umehifadhiwa.
