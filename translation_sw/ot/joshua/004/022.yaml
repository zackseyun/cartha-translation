  text: ndipo mtawajulisha watoto wenu[a], mkisema, ‘Israeli walivuka Yordani hii juu ya nchi kavu.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ‘wana wenu,’ ikiwa neno hilo linaeleweka kwa maana finyu zaidi; Kiebrania kinaweza kumaanisha wana wa kiume hasa au watoto kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹדַעְתֶּם
  choice: ndipo mtawajulisha
  rationale: Hifili ya ידע ina maana ya kusababisha wajue au kuwajulisha. ‘Mtawajulisha’ ni Kiswahili cha kawaida chenye maana hiyo ya kisababishi, na ‘ndipo’ linaonyesha mwendelezo wa agizo katika muktadha.
- source_word: בְּנֵיכֶם
  choice: watoto wenu
  rationale: בנים inaweza kumaanisha wana wa kiume hasa au watoto kwa ujumla. Katika muktadha wa kufundisha kizazi kinachofuata, ‘watoto wenu’ linafaa bila kuibana maana isivyo lazima.
- source_word: לֵאמֹר
  choice: mkisema
  rationale: Kitenzi-jina hiki kinatanguliza yaliyomo katika usemi; ‘mkisema’ ni cha asili na kifupi katika Kiswahili.
- source_word: בַּיַּבָּשָׁה
  choice: juu ya nchi kavu
  rationale: Neno hilo humaanisha nchi au ardhi kavu. ‘Juu ya nchi kavu’ linaeleza wazi kwamba walipita mahali pasipo maji.
- source_word: עָבַר
  choice: alivuka
  rationale: עבר humaanisha kupita au kuvuka; pamoja na Yordani kama yambwa, ‘alivuka’ ndilo chaguo la kawaida na lililo wazi.
- source_word: יִשְׂרָאֵל
  choice: Israeli
  rationale: Ni jina la watu au taifa, na umbo la kawaida la Kiswahili ni ‘Israeli.’ Umoja wa kisarufi unalitazama taifa kama kundi moja.
- source_word: הַיַּרְדֵּן הַזֶּה
  choice: Yordani hii
  rationale: Kionyeshi הַזֶּה kinaleta ukaribu na msisitizo wa mto uliopo mbele yao. ‘Yordani hii’ kinahifadhi maana hiyo; si lazima kuongeza ‘Mto’ kwa kuwa Yordani ni jina linalotambulika.
