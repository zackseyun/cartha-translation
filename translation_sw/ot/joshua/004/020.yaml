  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵת
  choice: aka-
  rationale: Kiambishi cha usimulizi “aka-” kinaunganisha tendo hili na mfululizo wa matukio yaliyotangulia; alama ya yambwa אֵת haina neno linalolingana nayo moja kwa moja katika Kiswahili.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: kumi na mawili
  rationale: Hii ndiyo namna ya kawaida ya kutaja idadi kumi na mbili inapopatana na ngeli ya “mawe”.
- source_word: הָאֲבָנִים הָאֵלֶּה
  choice: mawe haya
  rationale: Tafsiri hii inahifadhi nomino na kionyeshi cha ukaribu cha Kiebrania kwa mpangilio wa kawaida wa Kiswahili.
- source_word: אֲשֶׁר לָקְחוּ
  choice: waliyoyatoa
  rationale: Kishazi rejeshi kinayatambulisha mawe; “-toa” linaeleza kuyachukua mawe kutoka ndani au eneo la Yordani, na umbo la wakati uliopita linaonyesha tendo lililotangulia kuyasimamisha.
- source_word: מִן הַיַּרְדֵּן
  choice: katika Yordani
  rationale: “Katika” huwasilisha chanzo walikoyatoa mawe. Jina “Yordani” linatosha katika muktadha bila kuongeza neno lisilokuwapo wazi katika mstari huu.
- source_word: הֵקִים
  choice: akayasimamisha
  rationale: Katika muktadha wa mawe ya ukumbusho, “kusimamisha” ni usemi wa kawaida unaowasilisha maana ya kuyaweka yakiwa yamesimamishwa au kuunda alama ya kudumu.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Jina limetolewa kwa tahajia iliyozoeleka katika Kiswahili cha Biblia.
- source_word: בַּגִּלְגָּל
  choice: huko Gilgali
  rationale: “Huko” ni kiashiria cha mahali kinachofaa kwa eneo lililotajwa, na “Gilgali” ni tahajia iliyozoeleka katika Kiswahili.
