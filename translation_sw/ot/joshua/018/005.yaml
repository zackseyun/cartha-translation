base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/005.yaml
  text: And they shall divide it into seven portions. Judah shall remain at its border on the south[a], and the house of Joseph shall remain at their border on the north.
translation:
  language: sw
  text: Nao wataigawanya katika sehemu saba. Yuda atabaki kwenye mpaka wake wa kusini[a], na nyumba ya Yosefu itabaki kwenye mpaka wao wa kaskazini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “atasimama kwenye mpaka wake” / “watasimama kwenye mpaka wao”; kitenzi cha Kiebrania humaanisha kihalisi “kusimama,” lakini hapa yaelekea kinamaanisha kuendelea kubaki katika mipaka iliyokwisha kuwekwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְחַלְּקוּ אֹתָהּ
  choice: Nao wataigawanya
  rationale: Kitenzi cha Kiebrania kinaonyesha kugawanya nchi katika mgao; “wataigawanya” ni Kiswahili cha kawaida na huhifadhi kiwakilishi cha nchi pamoja na mhusika wa wingi.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: katika sehemu saba
  rationale: חֲלָקִים ni sehemu au mafungu yaliyogawanywa; “sehemu saba” ni wazi na ya kawaida katika muktadha wa ugawaji wa nchi.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: יַעֲמֹד עַל גְּבוּלוֹ
  choice: atabaki kwenye mpaka wake
  rationale: Ingawa עמד humaanisha kihalisi “kusimama,” hapa inaelekea kumaanisha kuendelea kubaki katika mipaka ya eneo lililokwisha kuwekwa.
- source_word: מִנֶּגֶב
  choice: upande wa kusini
  rationale: Neno hili linatumika hapa kwa mwelekeo wa kusini, sambamba na upande wa kaskazini katika kishazi kinachofuata.
- source_word: וּבֵית יוֹסֵף
  choice: nayo nyumba ya Yosefu
  rationale: “Nyumba ya Yosefu” huhifadhi usemi wa pamoja unaowataja makabila yanayotokana na Yosefu; “nayo” huunganisha kishazi kwa Kiswahili cha asili.
- source_word: יַעַמְדוּ עַל גְּבוּלָם
  choice: itabaki kwenye mpaka wao
  rationale: Kitenzi cha wingi na kiambishi cha umilikaji cha wingi katika Kiebrania vinahusu washiriki wa nyumba ya Yosefu. Kiswahili hutumia “itabaki” kwa nomino ya ngeli ya nyumba lakini huhifadhi wingi huo katika “mpaka wao.”
- source_word: מִצָּפוֹן
  choice: upande wa kaskazini
  rationale: Ni matumizi ya kimwelekeo yanayolingana na “upande wa kusini” katika kishazi cha awali.
