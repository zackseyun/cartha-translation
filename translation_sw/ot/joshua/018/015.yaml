base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/015.yaml
  text: And the southern side was from the edge of Kiriath-jearim[b][a], and the border went out westward and went out to the spring of the waters of Nephtoah.
translation:
  language: sw
  text: Upande wa kusini ulianzia kwenye ukingo wa Kiriath-yearimu, nao mpaka ukaenda upande wa magharibi[a], kisha ukaendelea hadi kwenye chemchemi ya maji ya Neftoa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, neno kwa neno, “kuelekea baharini”; katika jiografia hii maana yake ni “upande wa magharibi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “chemchemi ya Neftoa.” Kiebrania kina muundo wa moja kwa moja, “chemchemi ya maji ya Neftoa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת נֶגְבָּה
  choice: Upande wa kusini
  rationale: פֵאָה hapa ni upande wa eneo, na נֶגְבָּה huonyesha upande wa kusini. Kauli hii ni ya kawaida na wazi katika Kiswahili.
- source_word: מִקְצֵה
  choice: kwenye ukingo wa
  rationale: קָצֶה humaanisha mwisho, kingo, au ncha. Katika maelezo ya mpaka wa eneo, “ukingo” huwasilisha vizuri maana ya mahali.
- source_word: קִרְיַת יְעָרִים
  choice: Kiriath-yearimu
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili badala ya kutafsiriwa kimaana.
- source_word: וְיָצָא הַגְּבוּל
  choice: nao mpaka ukaelekea
  rationale: יָצָא kwa halisi ni “kutoka,” lakini katika kauli za mipaka hueleza mstari wa mpaka unaoendelea kuelekea mahali fulani. “Ukaelekea” ni ya asili katika Kiswahili bila kupoteza kazi yake ya kijiografia.
- source_word: יָמָּה
  choice: upande wa magharibi
  rationale: Neno hili kwa halisi linahusiana na “bahari,” lakini katika jiografia ya nchi ya Israeli hutumika kumaanisha kuelekea magharibi.
- source_word: אֶל מַעְיַן מֵי נֶפְתּוֹחַ
  choice: hadi kwenye chemchemi ya maji ya Neftoa
  rationale: מַעְיַן ni chemchemi, na מֵי ni umbo la kutegemezana la “maji.” Tafsiri hii inadumisha muundo wa Kiebrania huku ikibaki wazi kwa msomaji wa Kiswahili.
- source_word: נֶפְתּוֹחַ
  choice: Neftoa
  rationale: Jina la mahali limetoholewa kwa mfumo wa sauti na tahajia unaofaa Kiswahili.
