base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/012.yaml
  text: Their border on the north side was from the Jordan[a], and the border went up to the northern slope of Jericho, then went up into the hill country westward[b], and its end was at the wilderness of Beth-aven.
translation:
  language: sw
  text: Mpaka wao upande wa kaskazini ulianzia Yordani. Mpaka huo ukapanda hadi mteremko wa Yeriko wa kaskazini[a], kisha ukapanda katika nchi ya vilima kuelekea magharibi, na mwisho wake[b] ulikuwa kwenye nyika ya Beth-aveni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “bega la Yeriko upande wa kaskazini”; “bega” ni usemi wa kijiografia unaomaanisha ubavu au mteremko.
    reason: lexical_alternative
  - marker: b
    text: Au “miisho yake”; Kiebrania kinatumia neno la wingi la kijiografia kwa sehemu ambako mpaka unaishia.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹנָה
  choice: upande wa kaskazini
  rationale: פאה hurejelea upande au ukingo; katika maelezo ya mipaka, “upande wa kaskazini” ni Kiswahili cha kawaida na sahihi.
- source_word: הַגְּבוּל
  choice: mpaka
  rationale: גְּבוּל hapa ni mstari wa mpaka wa eneo lililogawiwa; “mpaka” ni neno la kawaida na wazi.
- source_word: מִן הַיַּרְדֵּן
  choice: ulianzia Yordani
  rationale: Kiambishi מִן huonyesha mahali mpaka ulipoanzia. Jina Yordani linaweza kutumiwa bila kuongeza “Mto” kwa kuwa jina lenyewe linatambulika.
- source_word: וְעָלָה
  choice: ukapanda
  rationale: עלה huhifadhi taswira ya kupanda kijiografia katika maelezo ya njia ya mpaka.
- source_word: אֶל כֶּתֶף יְרִיחוֹ מִצָּפוֹן
  choice: kuelekea mteremko wa Yeriko upande wa kaskazini
  rationale: כֶּתֶף maana yake ya msingi ni “bega,” lakini katika matumizi ya kijiografia humaanisha ubavu au mteremko; מִצָּפוֹן hubainisha kuwa ni upande wa kaskazini.
- source_word: בָהָר יָמָּה
  choice: katika nchi ya vilima kuelekea magharibi
  rationale: הָר hapa inaeleweka kwa maana ya eneo la vilima, na יָמָּה ni kielezi cha mwelekeo, “kuelekea magharibi.”
- source_word: תֹּצְאֹתָיו
  choice: mwisho wake
  rationale: Katika maelezo ya mipaka, neno hili la wingi hutaja sehemu au sehemu mbalimbali ambako mpaka unaishia; “mwisho wake” ni Kiswahili cha kawaida huku tanbihi ikihifadhi umbo la Kiebrania.
- source_word: מִדְבַּרָה בֵּית אָוֶן
  choice: kwenye nyika ya Beth-aveni
  rationale: מִדְבָּר ni eneo lisilolimwa au nyika, na kuelekea huko hapa kunafanya mahali hapo kuwa kikomo cha mpaka. Beth-aveni limehifadhiwa kama jina la mahali.
