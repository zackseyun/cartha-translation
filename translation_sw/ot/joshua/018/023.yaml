lexical_decisions:
- source_word: הָעַוִּים
  choice: Avimu
  rationale: Katika orodha hii ya maeneo, neno hili linatumika kama jina la mji. Umbo la Kiswahili “Avimu” linafuata matamshi ya jina la Kiebrania kwa namna inayoeleweka kwa wasomaji wa Kiswahili.
- source_word: הַפָּרָה
  choice: Para
  rationale: Ni jina la mahali katika eneo la Benyamini; kiambishi cha utambulisho cha Kiebrania hakihitaji kuwakilishwa kando katika jina la Kiswahili.
- source_word: עָפְרָה
  choice: Ofra
  rationale: Ni jina la mahali. “Ofra” linawakilisha jina la Kiebrania kwa tahajia ya kawaida na inayosomeka katika Kiswahili.
- source_word: וְ
  choice: na
  rationale: Viunganishi vinavyorudiwa katika orodha ya Kiebrania vimetolewa kwa koma na “na” kabla ya jina la mwisho, kulingana na Kiswahili cha kawaida.
