  text: וְ/אַתֶּ֞ם תִּכְתְּב֤וּ אֶת הָ/אָ֨רֶץ֙ שִׁבְעָ֣ה חֲלָקִ֔ים וַֽ/הֲבֵאתֶ֥ם אֵלַ֖/י הֵ֑נָּה וְ/יָרִ֨יתִי לָ/כֶ֤ם גּוֹרָל֙ פֹּ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/006.yaml
  text: And you shall write down the land in seven portions and bring it here to me, and I will cast the lot for you here before the LORD our God.
translation:
  language: sw
  text: Nanyi mtayaandika maelezo ya nchi kwa sehemu saba, kisha mtaniletea hapa; nami nitawapigia kura hapa mbele za BWANA Mungu wetu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִכְתְּבוּ אֶת־הָאָרֶץ
  choice: mtayaandika maelezo ya nchi
  rationale: Kitenzi 'andika' chenye nchi kama yambwa kinamaanisha kuiandika au kuieleza kwa maandishi; 'maelezo ya nchi' hufanya maana hiyo ieleweke kwa Kiswahili bila kuongeza wazo la ramani lisilotajwa wazi.
- source_word: שִׁבְעָה חֲלָקִים
  choice: kwa sehemu saba
  rationale: Huwakilisha moja kwa moja mgawanyo wa nchi katika sehemu saba.
- source_word: וְיָרִיתִי לָכֶם גּוֹרָל
  choice: nitawapigia kura
  rationale: Nahau hii ya Kiswahili huonyesha Yoshua akifanya tendo la kupiga kura kwa niaba yao; umoja wa Kiebrania גּוֹרָל unaweza kutaja utaratibu au kura yenyewe.
- source_word: יְהוָה
  choice: BWANA
  rationale: Hufuata desturi iliyoenea katika tafsiri za Biblia za Kiswahili ya kuwakilisha jina la agano YHWH kwa 'BWANA' kwa herufi kubwa.
theological_decisions:
- issue: Kura mbele za YHWH
  choice: mbele za BWANA Mungu wetu
  alternative: mbele za Yahwe Mungu wetu
  rationale: Maandishi yanaacha wazi kwamba ugawaji unafanywa mbele za Mungu, bila kufafanua zaidi jinsi matokeo ya kura yanavyohusiana na uamuzi wa Mungu; tafsiri haiongezi ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa wakati ujao unahifadhi mfululizo wa maagizo na tendo la Yoshua.
