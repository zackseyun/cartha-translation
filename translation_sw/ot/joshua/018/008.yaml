base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/008.yaml
  text: So the men arose and went[a], and Joshua commanded those who were going to write down the land, saying, “Go and walk through the land, and write it down, and return to me; and here I will cast lots for you before Yahweh in Shiloh.”
translation:
  language: sw
  text: Basi wale wanaume wakasimama, wakaenda. Yoshua akawaamuru wale waliokuwa wakienda kuandika maelezo ya nchi[a], akisema, “Nendeni, mkapite huku na huku katika nchi, mkaandike maelezo yake, kisha mrudi kwangu. Hapa nitawapigia kura mbele za Yahwe huko Shilo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kuandika nchi”; maana yake ni kuichunguza nchi na kuandika maelezo yake kwa ajili ya ugawaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ הָאֲנָשִׁים וַיֵּלֵכוּ
  choice: wale wanaume wakasimama, wakaenda
  rationale: Inahifadhi mfuatano wa kisimulizi wa vitenzi vya Kiebrania na kutaja kwa usahihi kwamba wajumbe walikuwa wanaume.
- source_word: וַיְצַו יְהוֹשֻׁעַ
  choice: Yoshua akawaamuru
  rationale: Kitenzi צוה kinaonyesha agizo lenye mamlaka; “akawaamuru” ni cha kawaida na chenye uzito unaofaa.
- source_word: לִכְתֹּב אֶת־הָאָרֶץ
  choice: kuandika maelezo ya nchi
  rationale: Kiebrania husema kihalisi “kuandika nchi,” lakini katika muktadha huu maana ni kufanya uchunguzi na kuweka maelezo ya nchi kwa maandishi kwa ajili ya ugawaji.
- source_word: וְהִתְהַלְּכוּ בָאָרֶץ
  choice: mkapite huku na huku katika nchi
  rationale: Muundo wa hitpaeli wa הלך unaonyesha kuzunguka au kuvuka sehemu mbalimbali za nchi, si kutembea mara moja tu.
- source_word: וְכִתְבוּ אוֹתָהּ
  choice: mkaandike maelezo yake
  rationale: Kiwakilishi kinarejelea nchi; tafsiri hii inafanya tendo la kuandika lieleweke kwa Kiswahili bila kuongeza wazo la ramani ambalo halijasemwa wazi.
- source_word: וּפֹה אַשְׁלִיךְ לָכֶם גּוֹרָל
  choice: Hapa Shilo nitawapigia kura
  rationale: “Kupiga kura” ni nahau ya kawaida ya Kiswahili kwa uamuzi wa mgao kwa kura; “hapa Shilo” inaunganisha kielezi cha mahali na eneo lililotajwa mwishoni mwa sentensi.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Inahifadhi maana ya tendo kufanywa mbele za Mungu na kutaja jina la agano lililo katika matini.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ina jina la Mungu YHWH moja kwa moja. “Yahwe” hulihifadhi kama jina maalumu bila kulibadili kuwa cheo.
- issue: Utambulisho wa הָאֲנָשִׁים
  choice: wale wanaume
  alternative: watu wale
  rationale: Nomino ya Kiebrania hapa ni ya kiume na inawahusu wajumbe maalumu waliotumwa kufanya uchunguzi; tafsiri hiyo haiufanyi utambulisho wao kuwa usio na jinsia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi ulio wazi na heshima inayofaa maandiko. “Mkapite huku na huku” ni lugha ya kawaida inayoonyesha kuizunguka nchi kwa uchunguzi; “nitawapigia kura” ni nahau ya asili ya Kiswahili kwa kugawa kwa njia ya kura.
