lexical_decisions:
- source_word: וַיִּוָּתְרוּ
  choice: walibaki
  rationale: Kitenzi cha Kiebrania katika Niphal kinaonyesha waliokuwa bado wamebaki; ‘walibaki’ ni Kiswahili cha kawaida na huhifadhi maana hiyo.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: miongoni mwa Waisraeli
  rationale: Ingawa tamko halisi ni ‘miongoni mwa wana wa Israeli,’ ‘Waisraeli’ ni la asili zaidi katika Kiswahili cha sasa na humaanisha watu wa Israeli bila kubadili rejeleo.
- source_word: אֲשֶׁר לֹא חָלְקוּ
  choice: ambayo bado hayakuwa yamegawiwa
  rationale: חלק inaweza kumaanisha kugawa au kugawia sehemu. Katika muktadha huu makabila saba ndiyo yaliyokuwa bado hayajapokea maeneo yao kwa mgawo; muundo wa kutendwa huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano wa muundo wa kutenda.
- source_word: אֶת נַחֲלָתָם
  choice: urithi wao
  rationale: נחלה hapa ni eneo la ardhi lililotolewa kama sehemu ya urithi; ‘urithi wao’ huhifadhi istilahi ya msingi na uzito wake wa kitheolojia.
- source_word: שִׁבְעָה שְׁבָטִים
  choice: makabila saba
  rationale: Huu ndio ulinganifu wa moja kwa moja na wa kawaida kwa muundo wa makabila ya Israeli.
theological_decisions:
- issue: Je, makabila ndiyo yaliyogawa urithi au ndiyo yaliyokuwa hayajagawiwa urithi?
  choice: ambayo bado hayakuwa yamegawiwa urithi wao
  alternative: ambayo bado hayakuwa yamegawa urithi wao
  rationale: Muundo wa Kiebrania kwa nje una kitenzi cha kutenda chenye makabila kama kiima, lakini katika muktadha wa ugawaji wa nchi unaweza kueleweka kuwa sehemu zao zilikuwa bado hazijagawiwa. Tafsiri kuu inatoa maana ya kimuktadha, na tanbihi inadumisha utata wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Waisraeli’ limetumiwa badala ya tamko halisi ‘wana wa Israeli’ kwa ufasaha wa kawaida; ‘urithi’ limedumishwa kwa sababu ni istilahi ya msingi katika simulizi la ugawaji wa nchi.
