base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/019.yaml
  text: Then the border passed to the northern shoulder of Beth-hoglah[a], and the border ended at the northern tongue of the Salt Sea, at the southern end of the Jordan[b]. This is the southern border.
translation:
  language: sw
  text: Kisha mpaka ukapita upande wa kaskazini wa Beth-hogla, na mpaka ukaishia kwenye ulimi[a] wa Bahari ya Chumvi[b] ulio upande wa kaskazini, kwenye ncha ya kusini ya Yordani. Huu ndio mpaka wa kusini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “ulimi wa Bahari ya Chumvi”; huu ni usemi wa kijiografia unaoweza kumaanisha ghuba au sehemu ya maji yenye umbo la ulimi.
    reason: lexical_alternative
  - marker: b
    text: Au “Bahari ya Mauti”; maandishi ya Kiebrania yanasema “Bahari ya Chumvi.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר הַגְּבוּל
  choice: Kisha mpaka ukapita
  rationale: Katika maelezo ya mipaka, עָבַר huonyesha mstari wa mpaka ukiendelea au ukipita mahali fulani. “Ukapita” ni Kiswahili cha kawaida na kinafuata mfuatano wa maeneo.
- source_word: כֶּתֶף
  choice: upande
  rationale: Neno hili kwa kawaida ni “bega,” lakini katika jiografia humaanisha ubavu, mteremko, au upande wa eneo. “Upande” linaeleweka kwa urahisi katika maelezo ya mpaka bila kulazimisha taswira isiyo ya kawaida katika Kiswahili.
- source_word: בֵּית חָגְלָה
  choice: Beth-hogla
  rationale: Jina la mahali limetoholewa kwa herufi za Kiswahili badala ya kutafsiriwa.
- source_word: צָפוֹנָה
  choice: wa kaskazini / ulio upande wa kaskazini
  rationale: Umbo la kuelekea kaskazini linaonyesha mahali au mwelekeo. Miundo hii ya Kiswahili inaonyesha kwa wazi upande unaokusudiwa katika sehemu zote mbili.
- source_word: תּוֹצְאֹתָיו
  choice: ukaishia
  rationale: Katika kanuni za kueleza mipaka, neno hili hurejelea mwisho wa mpaka. “Ukaishia” ni usemi wa asili na ulio wazi katika Kiswahili.
- source_word: לְשׁוֹן
  choice: ulimi
  rationale: Maana halisi ni “ulimi,” na hapa ni istilahi ya kijiografia kwa sehemu ya maji au nchi yenye umbo la ulimi. Taswira ya Kiebrania imehifadhiwa, huku tanbihi ikifafanua matumizi yake.
- source_word: יָם הַמֶּלַח
  choice: Bahari ya Chumvi
  rationale: Jina hili linatafsiri moja kwa moja jina la Kiebrania badala ya kulibadilisha kuwa jina la kisasa “Bahari ya Mauti.”
- source_word: קְצֵה הַיַּרְדֵּן נֶגְבָּה
  choice: kwenye mwisho wa kusini wa Yordani
  rationale: קָצֶה ni mwisho au ncha, na נֶגְבָּה huonyesha upande wa kusini. Tafsiri hii ni sahihi na ya kawaida katika Kiswahili.
- source_word: זֶה גְּבוּל נֶגֶב
  choice: Huu ndio mpaka wa kusini
  rationale: Katika muhtasari huu wa mgao, נֶגֶב hutumiwa kwa maana ya upande wa kusini, wala si lazima kama jina maalumu la eneo la Negeb.
