translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Majina ya mahali yametoholewa; lugha ya maelezo ya mpaka imewekwa ya kawaida. Taswira ya “ulimi” imehifadhiwa kwa sababu ni neno la kijiografia la chanzo, kisha imefafanuliwa katika tanbihi.
