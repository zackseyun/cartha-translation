  source_fidelity: 'Tafsiri inafuata orodha ya majina katika Kiebrania kwa uaminifu: Sela, Haelefu, Myebusi ikifafanuliwa kuwa Yerusalemu, Gibeathi, na Kiriathi. Jumla ya miji kumi na minne, vijiji vyake, na hitimisho la urithi wa wana wa Benyamini kwa koo zao vimetolewa bila kuongeza “-yearimu” ambayo haipo katika mstari huu.'
