  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/צֵלַ֡ע הָאֶ֜לֶף וְ/הַ/יְבוּסִ֨י הִ֤יא יְרֽוּשָׁלִַ֨ם֙ גִּבְעַ֣ת קִרְיַ֔ת עָרִ֥ים אַרְבַּֽע עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶ֑ן זֹ֛את נַֽחֲלַ֥ת בְּנֵֽי בִנְיָמִ֖ן לְ/מִשְׁפְּחֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/028.yaml
  text: Zela[a], Haeleph, the Jebusite (that is, Jerusalem), Gibeath, Kiriath—fourteen cities with their villages[c][b]. This was the inheritance of the sons of Benjamin according to their clans.
translation:
  language: sw
  text: Sela, Haelefu[b], Myebusi[a] (yaani, Yerusalemu), Gibeathi, na Kiriathi[c]—miji kumi na minne pamoja na vijiji vyake. Huu ndio ulikuwa urithi wa wana wa Benyamini kulingana na koo zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema kwa neno halisi, “Myebusi, huo ndio Yerusalemu.” Ingawa “Myebusi” kwa kawaida humaanisha mtu wa taifa la Wayebusi, hapa limetumiwa kutaja mahali, yaani Yerusalemu.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya tafsiri hutaja Haelefu kuwa Elefu, na Gibeathi kuwa Gibea.
    reason: alternative_reading
  - marker: c
    text: Matini ya Kiebrania katika mstari huu inasema “Kiriathi,” si “Kiriath-yearimu.”
    reason: textual_variant
lexical_decisions:
- source_word: וְ/צֵלַע
  choice: Sela
  rationale: Jina la mahali limetoholewa kwa tahajia ya kawaida ya Kiswahili; konsonanti ya Kiebrania צ imewakilishwa kwa “s” katika umbo linalosomeka kwa urahisi.
- source_word: הָאֶלֶף
  choice: Haelefu
  rationale: Jina la mahali limetoholewa, huku kiambishi cha Kiebrania ha- kikihifadhiwa kama sehemu ya umbo lililo katika matini; vokali ya mwisho husaidia utamkaji wa Kiswahili.
- source_word: וְ/הַ/יְבוּסִי הִיא יְרוּשָׁלִַם
  choice: Myebusi (yaani, Yerusalemu)
  rationale: “Myebusi” huhifadhi umbo la Kiebrania ambalo kwa kawaida ni jina la mtu wa taifa hilo, ingawa hapa limetumiwa kama jina la mahali; “yaani, Yerusalemu” hudumisha ufafanuzi wa הִיא.
- source_word: גִּבְעַת
  choice: Gibeathi
  rationale: Jina limetoholewa kutokana na umbo la konsonanti la matini hii, badala ya kulisawazisha kimya kimya na umbo linalojulikana zaidi, Gibea.
- source_word: קִרְיַת
  choice: Kiriathi
  rationale: Matini ya Kiebrania katika mstari huu ina Kiriathi peke yake; sehemu “-yearimu” haijaongezwa kutoka vifungu vingine.
- source_word: עָרִים אַרְבַּע עֶשְׂרֵה
  choice: miji kumi na minne
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya jumla ya makazi yaliyotajwa.
- source_word: וְ/חַצְרֵי/הֶן
  choice: pamoja na vijiji vyake
  rationale: Katika orodha za mgao wa ardhi, חֲצֵרִים ni makazi madogo yanayohusiana na miji; “vijiji” ni neno la asili na wazi kwa msomaji wa Kiswahili.
- source_word: זֹאת נַחֲלַת
  choice: Huu ndio ulikuwa urithi
  rationale: Huhifadhi kauli ya kuhitimisha kuhusu mgao wa kabila na kutumia wakati uliopita unaofaa katika simulizi, ingawa kishazi cha Kiebrania hakina kitenzi kilichoandikwa.
- source_word: בְּנֵי בִנְיָמִן
  choice: wana wa Benyamini
  rationale: Huhifadhi sitiari ya kifamilia na kikabila ya Kiebrania badala ya kuibadili moja kwa moja kuwa “watu” au “wazao.”
- source_word: לְ/מִשְׁפְּחֹתָם
  choice: kulingana na koo zao
  rationale: Katika muktadha wa mgao wa kikabila, מִשְׁפָּחָה humaanisha kitengo cha ukoo ndani ya kabila; “koo” ni sahihi kuliko “familia.”
