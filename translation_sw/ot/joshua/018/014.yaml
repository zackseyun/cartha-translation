base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/014.yaml
  text: Then the border curved and turned on the west side southward from the mountain that faces Beth-horon on the south[a], and its end was at Kiriath-baal (that is, Kiriath-jearim), a city of the sons of Judah. This was the western side.
translation:
  language: sw
  text: Kisha mpaka ukapinda na kugeukia upande wa magharibi, kuelekea kusini kutoka mlima unaokabili Beth-horoni upande wa kusini. Ukaishia Kiriath-baali (yaani, Kiriath-yearimu), mji wa wazao wa Yuda.[a] Huu ndio uliokuwa upande wa magharibi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “wana wa Yuda”; hili ni jina la kikabila linalomaanisha watu au wazao wa Yuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: ukapinda
  rationale: Katika maelezo ya mipaka, kitenzi hiki hueleza mstari wa mpaka unapochorwa au kuendelea kwa kupinda; hapa muktadha pamoja na וְנָסַב unaonyesha badiliko la mwelekeo.
- source_word: הַגְּבוּל
  choice: mpaka
  rationale: Hili ndilo neno la kawaida na la asili katika Kiswahili kwa mpaka wa eneo.
- source_word: וְנָסַב
  choice: na kugeukia
  rationale: Kitenzi kina maana ya kuzunguka au kubadili mwelekeo; ‘kugeukia’ linafaa katika maelezo haya ya kijiografia.
- source_word: לִפְאַת יָם
  choice: upande wa magharibi
  rationale: Neno ים, ‘bahari,’ hutumiwa katika kaida za mipaka kumaanisha magharibi, upande wa Bahari ya Mediterania.
- source_word: נֶגְבָּה
  choice: kusini / upande wa kusini
  rationale: Nomino yenye kiambishi cha kuelekea inaonyesha mwelekeo wa kusini; matumizi mawili katika mstari yamehifadhiwa kwa namna ya asili katika Kiswahili.
- source_word: מִן הָהָר
  choice: kuanzia mlima
  rationale: Kirai kinaonyesha mahali ambapo sehemu hii ya mpaka ilianzia; umoja wenye kibainishi unaelekeza kwenye mlima mahususi.
- source_word: אֲשֶׁר עַל־פְּנֵי בֵית חֹרוֹן
  choice: unaokabili Beth-horoni
  rationale: Katika maelezo ya mahali, על־פני inaweza kumaanisha kuwa mbele ya au kukabiliana na eneo fulani.
- source_word: וְהָיָה תֹצְאֹתָיו
  choice: Ukaishia
  rationale: Nahau hii hueleza mwisho wa mstari wa mpaka; kitenzi hiki ni kifupi na cha kawaida katika Kiswahili.
- source_word: אֶל קִרְיַת בַּעַל
  choice: Kiriath-baali
  rationale: Jina la mahali limetoholewa kwa tahajia inayoweza kutamkwa kwa urahisi katika Kiswahili.
- source_word: הִיא קִרְיַת יְעָרִים
  choice: (yaani, Kiriath-yearimu)
  rationale: Kiwakilishi kinatambulisha jina jingine la mji uleule; mabano yanaonyesha ufafanuzi huo kwa uwazi.
- source_word: עִיר בְּנֵי יְהוּדָה
  choice: mji wa wazao wa Yuda
  rationale: בני kwa maana halisi ni ‘wana,’ lakini hapa ni jina la kikabila linalowahusu watu au wazao wa Yuda; ‘wazao’ linaweka maana ya ukoo bila kudokeza wakazi wa kiume pekee.
