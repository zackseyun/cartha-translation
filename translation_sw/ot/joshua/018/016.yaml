base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/016.yaml
  text: Then the border went down to the end of the mountain that faces the Valley of Ben-hinnom[a], which is at the northern end of the Valley of Rephaim. Then it went down the Valley of Hinnom to the southern slope of the Jebusite[c][b], and went down to En-rogel.
translation:
  language: sw
  text: Kisha mpaka ukashuka hadi mwisho wa mlima unaoelekeana na Bonde la Ben-Hinomu[a], ulio katika Bonde la Warefai upande wa kaskazini. Kisha ukashuka katika Bonde la Hinomu hadi mteremko wa Myebusi, upande wa kusini[b], kisha ukashuka hadi En-Rogeli[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “Bonde la mwana wa Hinomu”; hapa “Ben-Hinomu” limetumiwa kama jina la mahali.
    reason: lexical_alternative
  - marker: b
    text: Au “hadi ubavu wa Myebusi kuelekea kusini.” Neno la Kiebrania linalotafsiriwa “mteremko” kwa msingi humaanisha “bega” na katika maelezo ya kijiografia linaweza kumaanisha ubavu au mteremko. “Myebusi” huenda likarejelea makazi ya Wayebusi, yaani Yerusalemu, lakini matini haisemi wazi “mji.”
    reason: lexical_alternative
  - marker: c
    text: En-Rogeli ni jina la mahali; neno En kwa msingi humaanisha “chemchemi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: Kisha mpaka ukashuka
  rationale: ירד ina maana ya kushuka, na wakati wa kueleza mpaka wa kijiografia, “mpaka ukashuka” ni Kiswahili cha kawaida kinachohifadhi maana ya mwinuko.
- source_word: קְצֵה הָהָר
  choice: mwisho wa mlima
  rationale: קצה ni mwisho au ukingo wa kitu, na הר imetafsiriwa moja kwa moja kuwa “mlima” bila kuibadili kuwa kilima kwa kudhani jiografia hususa.
- source_word: אֲשֶׁר עַל־פְּנֵי גֵּי בֶן־הִנֹּם
  choice: unaoelekeana na Bonde la Ben-Hinomu
  rationale: עַל־פְּנֵי hapa inaonyesha uhusiano wa mahali, yaani kuwa mbele ya au kukabiliana na; “unaoelekeana na” ni usemi wa asili wa Kiswahili.
- source_word: גֵּי בֶן־הִנֹּם
  choice: Bonde la Ben-Hinomu
  rationale: Kirai hiki kinafanya kazi kama jina la mahali, hivyo “Ben-Hinomu” limetoholewa badala ya kutafsiriwa moja kwa moja.
- source_word: אֲשֶׁר בְּעֵמֶק רְפָאִים צָפוֹנָה
  choice: ulio upande wa kaskazini wa Bonde la Warefai
  rationale: צָפוֹנָה inaelekeza kaskazini. Tafsiri hii inaonyesha mahali pa mlima kuhusiana na Bonde la Warefai bila kulazimisha wazo la “mwisho” ambalo halijasemwa wazi katika Kiebrania.
- source_word: וְיָרַד גֵּי הִנֹּם
  choice: ukashuka kupitia Bonde la Hinomu
  rationale: Kiebrania kinaeleza mwendo wa mpaka ukishuka katika au kupitia bonde; “kupitia” hutoa maelezo ya kijiografia yaliyo wazi na ya kawaida kwa Kiswahili.
- source_word: אֶל־כֶּתֶף הַיְבוּסִי נֶגְבָּה
  choice: hadi upande wa kusini wa Myebusi
  rationale: כֶּתֶף kwa msingi ni “bega,” lakini katika jiografia humaanisha ubavu, upande, au mteremko. “Upande wa kusini” ni wa asili, huku “Myebusi” ikihifadhi umoja wa הַיְבוּסִי bila kuongeza neno “mji” lisilopo katika matini.
- source_word: עֵין רֹגֵל
  choice: En-Rogeli
  rationale: Hili ni jina la mahali, hivyo limetoholewa kwa namna inayotambulika katika Kiswahili; maana yake ya kimsingi inayohusisha chemchemi imeelezwa katika tanbihi.
