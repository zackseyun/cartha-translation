  text: וְ/עָבַר֩ מִ/שָּׁ֨ם הַ/גְּב֜וּל ל֗וּזָ/ה אֶל כֶּ֤תֶף ל֨וּזָ/ה֙ נֶ֔גְבָּ/ה הִ֖יא בֵּֽית אֵ֑ל וְ/יָרַ֤ד הַ/גְּבוּל֙ עַטְר֣וֹת אַדָּ֔ר עַל הָ/הָ֕ר אֲשֶׁ֛ר מִ/נֶּ֥גֶב לְ/בֵית חֹר֖וֹן תַּחְתּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/013.yaml
  text: From there the border passed to Luz[a], to the southern slope of Luz (that is, Bethel), and the border went down to Atroth-addar[c][b], on the mountain that is south of Lower Beth-horon.
translation:
  language: sw
  text: Kutoka hapo mpaka ulipita kuelekea Luzi[a], hadi kwenye mteremko wa kusini wa Luzi[b] (huko ni Betheli). Kisha mpaka ukashuka hadi Ataroth-adari[c], juu ya mlima ulio kusini mwa Beth-horoni ya Chini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa Luzi inatambulishwa kuwa Betheli.
    reason: cross_reference
  - marker: b
    text: Au, “kwenye bega la Luzi upande wa kusini.” Neno la Kiebrania linalomaanisha “bega” hutumiwa hapa kuhusu upande au mteremko wa kilima.
    reason: lexical_alternative
  - marker: c
    text: Jina hili pia linaweza kuandikwa “Atroth-adari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: ulipita
  rationale: Katika maelezo ya mipaka, kitenzi hiki huonyesha njia ambayo mstari wa mpaka ulifuata; “ulipita” ni Kiswahili cha kawaida na cha asili.
- source_word: הַגְּבוּל
  choice: mpaka
  rationale: “Mpaka” ndilo neno la kawaida la Kiswahili kwa mstari unaotenganisha maeneo, na linafaa katika maelezo ya kugawa ardhi.
- source_word: לוּזָה
  choice: kuelekea Luzi
  rationale: Kiambishi cha Kiebrania kinachoonyesha mwelekeo kimewasilishwa kwa “kuelekea”; jina la mahali limetoholewa kuwa “Luzi” kwa mtindo wa Kiswahili.
- source_word: אֶל כֶּתֶף לוּזָה נֶגְבָּה
  choice: kwenye mteremko wa kusini wa Luzi
  rationale: כֶּתֶף maana yake ya msingi ni “bega,” lakini katika jiografia hutaja upande au mteremko wa kilima. “Mteremko wa kusini” huwasilisha maana hiyo kwa lugha ya kawaida bila kuondoa taswira ya mandhari.
- source_word: הִיא בֵּית אֵל
  choice: hiyo ndiyo Betheli
  rationale: Kauli hii inaitambulisha Luzi kuwa Betheli. “Hiyo ndiyo” ni namna ya kawaida ya Kiswahili ya kutoa utambulisho huo.
- source_word: וְיָרַד
  choice: ukashuka
  rationale: Kitenzi kinahifadhi taswira ya kushuka kijiografia katika mfuatano wa maelezo ya mpaka.
- source_word: עַטְרוֹת אַדָּר
  choice: Ataroth-adari
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa Kiswahili huku likibakiza muundo wa jina la Kiebrania.
- source_word: עַל הָהָר
  choice: juu ya mlima
  rationale: Nomino ya umoja yenye kibainishi inaelekea kutaja mlima au kilima maalumu; “juu ya mlima” huhifadhi rejeo hilo halisi.
- source_word: אֲשֶׁר מִנֶּגֶב לְבֵית חֹרוֹן תַּחְתּוֹן
  choice: ulio kusini mwa Beth-horoni ya Chini
  rationale: מִנֶּגֶב huonyesha mahali palipo kusini, na תַּחְתּוֹן hutofautisha mji huu na Beth-horoni ya Juu.
