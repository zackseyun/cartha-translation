translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, kimetumiwa. Sentensi zimewekwa katika mtiririko wa kawaida wa maelezo ya mipaka, huku majina ya maeneo yakitoholewa kwa namna inayosomeka kwa wasemaji wa Kiswahili.
