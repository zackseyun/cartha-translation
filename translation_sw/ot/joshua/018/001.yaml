base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/001.yaml
  text: Then the whole congregation of the sons of Israel assembled at Shiloh and set up the tent of meeting there[b][a], and the land was subdued before them.
translation:
  language: sw
  text: Kisha kusanyiko lote la wana wa Israeli[a] likakusanyika Shilo, wakalisimamisha Hema la Kukutania huko, nayo nchi ilikuwa imetiishwa mbele yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Waisraeli.” Kiebrania: “wana wa Israeli.”'
    reason: Hutoa mbadala wa jina la pamoja na kufafanua umbo halisi la Kiebrania.
  - marker: b
    text: Au, “nchi ilikuwa imetekwa mbele yao.”
    reason: Hutoa mbadala wa tafsiri ya נִכְבְּשָׁה.
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: likakusanyika
  rationale: Kitenzi hiki cha mzizi קהל katika Niphal kinaonyesha jamii kukusanyika pamoja; ‘likakusanyika’ ni Kiswahili cha kawaida na kinadumisha maana ya mkutano wa jumuiya.
- source_word: כָּל עֲדַת
  choice: kusanyiko lote
  rationale: עֵדָה ni jumuiya iliyokusanyika; ‘kusanyiko lote’ huwakilisha כָּל na maana ya kijamii ya nomino hiyo bila kuifanya lugha kuwa ya kidhehebu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hifadhi umbo halisi la Kiebrania, ‘wana wa Israeli,’ ambalo hapa ni jina la pamoja la watu wa Israeli.
- source_word: שִׁלֹה
  choice: Shilo
  rationale: Jina la mahali limetoholewa kwa tahajia inayofaa Kiswahili.
- source_word: וַיַּשְׁכִּינוּ
  choice: wakalisimamisha
  rationale: Hiphil ya שכן ina maana halisi ya ‘kusababisha likae’; kwa hema, ‘wakalisimamisha’ ni ya asili na huonyesha kuliweka rasmi mahali hapo.
- source_word: אֹהֶל מוֹעֵד
  choice: hema la kukutania
  rationale: Tafsiri hii ya moja kwa moja hudumisha wazo la hema lililotengwa kwa kukutana, bila kutumia neno la kimapokeo lenye tafsiri pana zaidi.
- source_word: נִכְבְּשָׁה
  choice: ilikuwa imetiishwa
  rationale: Kitenzi cha kutendwa kutoka כבשׁ kinaonyesha nchi kuwa tayari imewekwa chini ya mamlaka yao; ‘imetiishwa’ hakidai kwa lazima kwamba kila eneo lilikuwa limetekwa kabisa.
- source_word: לִפְנֵיהֶם
  choice: mbele yao
  rationale: Hifadhi nahau ya Kiebrania kwa Kiswahili kinachoeleweka, huku ikiacha uhusiano kamili wa mamlaka bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Jina la pamoja la Israeli
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: ‘Wana wa Israeli’ hudumisha umbo la Kiebrania na lugha ya utambulisho wa pamoja; hapa halikusudii wanaume pekee, jambo linalofafanuliwa katika tanbihi.
- issue: Kiwango cha ushindi kinachodokezwa na נִכְבְּשָׁה
  choice: nchi ilikuwa imetiishwa mbele yao
  alternative: nchi ilikuwa imetekwa mbele yao
  rationale: ‘Imetiishwa’ huhifadhi dai la kuwekwa chini ya mamlaka bila kulazimisha hitimisho kwamba kila sehemu ya nchi ilikuwa imetekwa, kwa kuwa simulizi pana bado linataja maeneo yaliyobaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘kusanyiko lote ... likakusanyika’ una urudiaji wa kimakusudi unaoakisi mzizi na nomino tofauti za Kiebrania, ingawa unasikika rasmi. Alama ya tanbihi imewekwa baada ya kishazi kinachohusu mbadala wake.
