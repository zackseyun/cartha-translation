base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/017.yaml
  text: Then it curved northward and went out to En-shemesh[a], and went out to Geliloth, which is opposite the Ascent of Adummim[c][b], and it went down to the stone of Bohan son of Reuben.
translation:
  language: sw
  text: Kisha mpaka ukapinda kuelekea kaskazini, ukafika En-shemeshi[a], ukafika Gelilothi[b], palipo mkabala na Mwinuko wa Adumimu[c], kisha ukateremka hadi kwenye jiwe la Bohani mwana wa Reubeni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En-shemeshi maana yake ni “Chemchemi ya Jua,” lakini katika maandishi jina hilo limetoholewa kama jina la mahali.
    reason: lexical_alternative
  - marker: b
    text: Gelilothi pia linaweza kueleweka kuwa “mizunguko” au “wilaya,” lakini hapa limechukuliwa kuwa jina la mahali.
    reason: lexical_alternative
  - marker: c
    text: Au, “Njia ya Kupandia ya Adumimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: mpaka ukapinda
  rationale: Katika maelezo ya mipaka, kitenzi hiki hueleza mstari wa mpaka unapogeuka au kufuata umbo la ardhi; kutaja 'mpaka' kwa uwazi kunafanya Kiswahili kiwe cha kawaida.
- source_word: מִצָּפוֹן
  choice: kuelekea kaskazini
  rationale: Muktadha wa vitenzi vya mwendo unaonyesha mwelekeo wa mpaka, si mahali ulipotoka.
- source_word: וְיָצָא
  choice: ukafika / ukaendelea hadi
  rationale: Katika fomula za mipaka, kitenzi kinaeleza mwendo au kuenea kwa mpaka hadi mahali fulani. Utofauti mdogo wa Kiswahili huepuka urudiaji usio wa kawaida bila kupoteza mfuatano.
- source_word: עֵין שֶׁמֶשׁ
  choice: En-shemeshi
  rationale: Ni jina la mahali, kwa hiyo limetoholewa badala ya kutafsiriwa; umbo hili linafuata matamshi ya Kiswahili.
- source_word: גְּלִילוֹת
  choice: Gelilothi
  rationale: Ingawa neno linaweza kuwa na maana ya kawaida, hapa linatumika kama jina la mahali na limetoholewa.
- source_word: נֹכַח
  choice: mkabala na
  rationale: Ni usemi wazi wa mahali unaomaanisha kuwa kitu kiko kuelekeana na kingine.
- source_word: מַעֲלֵה אֲדֻמִּים
  choice: Mwinuko wa Adumimu
  rationale: מַעֲלֵה huonyesha njia au sehemu inayopanda; jina Adumimu limetoholewa huku sifa ya kijiografia ikitafsiriwa.
- source_word: וְיָרַד
  choice: ukateremka
  rationale: Hueleza mwendo wa mpaka kushuka katika ardhi ya chini.
- source_word: אֶבֶן בֹּהַן בֶּן רְאוּבֵן
  choice: jiwe la Bohani mwana wa Reubeni
  rationale: Muundo huu unaonyesha alama ya mpaka iliyoitwa kwa jina la Bohani, anayetambulishwa kuwa mwana au mzao wa Reubeni.
