  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל עַד אָ֨נָה֙ אַתֶּ֣ם מִתְרַפִּ֔ים לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵ֥י אֲבֽוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/003.yaml
  text: And Joshua said to the sons of Israel[a], “How long will you be slack about going in to take possession of the land that Yahweh, the God of your fathers, has given you?”
translation:
  language: sw
  text: Kisha Yoshua akawaambia wana wa Israeli[a], “Mpaka lini mtakawia kuingia na kuimiliki nchi ambayo Yahwe, Mungu wa baba zenu, amewapa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kihalisi, “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akawaambia
  rationale: Wayyiqtol inaendeleza simulizi; ‘Kisha’ ni kiunganishi cha kawaida katika masimulizi ya Kiswahili, na ‘akawaambia’ inawakilisha usemi ulioelekezwa kwa kundi.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Hili ni umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili na linakaribia jina la Kiebrania.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Linahifadhi taswira ya kifamilia na umbo la kiume la usemi wa Kiebrania; ‘Waisraeli’ ni tafsiri mbadala iliyo laini zaidi.
- source_word: עַד אָנָה
  choice: Mpaka lini
  rationale: Ni njia ya kawaida na ya moja kwa moja ya Kiswahili ya kutoa changamoto ya muda iliyomo katika Kiebrania.
- source_word: מִתְרַפִּים
  choice: mtasita
  rationale: Katika muktadha huu kitenzi kinaonyesha kulegea, kukawia, au kutokuwa na azimio la kutenda. ‘Mtasita’ hutoa karipio hilo kwa lugha ya asili bila kuongeza hukumu kali kama ‘kuwa wavivu.’
- source_word: לָבוֹא
  choice: kuingia
  rationale: Kitenzi kinaeleza kuingia ndani ya nchi; ‘kuingia’ kinahifadhi mwelekeo huo kwa ufupi na kwa kawaida.
- source_word: לָרֶשֶׁת
  choice: kuimiliki
  rationale: ירשׁ hapa ina maana ya kuitwaa na kuishikilia nchi kama milki; ‘kuimiliki’ huonyesha umiliki bila kuifunga maana kwenye urithi wa kisheria pekee.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Rejeo ni nchi maalumu iliyoahidiwa; Kiswahili kwa kawaida hutumia ‘nchi’ katika muktadha huu.
- source_word: אֲשֶׁר נָתַן לָכֶם
  choice: ambayo ... amewapa
  rationale: Wakati timilifu wa Kiswahili unaonyesha kwamba Mungu tayari amewapa nchi hiyo, ingawa bado hawajakamilisha kuimiliki.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu linatafsiriwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: Mungu wa baba zenu
  rationale: Linahifadhi usemi wa agano wa Kiebrania na rejeo lake la wazi kwa mababu wa kiume.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia Tetragramatoni kama jina binafsi. ‘Yahwe’ hulihifadhi jina hilo kwa umbo la kawaida la Kiswahili badala ya kulibadilisha kuwa cheo.
- issue: Zawadi ya nchi na wajibu wa kuimiliki
  choice: ‘amewapa’ pamoja na ‘kuingia na kuimiliki’
  alternative: ‘atawapa’ au lugha inayofanya umiliki uwe tayari umekamilika
  rationale: 'Tafsiri inahifadhi mvutano wa andiko: Mungu amekwisha kuitoa nchi, lakini Israeli bado wanapaswa kuingia na kuimiliki.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Mtasita’ ni ya asili zaidi kuliko ‘mtakuwa wazembe,’ huku ikihifadhi karipio bila kulifanya kuwa kali kupita chanzo.
