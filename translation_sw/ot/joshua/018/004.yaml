- from: Jichagulieni watu watatu kutoka kila kabila[a], nami nitawatuma. Wataondoka, wataizunguka nchi na kuandika habari zake kulingana na urithi wao[b]; kisha watanijia.
  to: Jipatieni wanaume watatu kutoka kila kabila[a], nami nitawatuma. Wataondoka, watapita-pita katika nchi na kuandika maelezo ya nchi kulingana na sehemu zao za urithi[b]; kisha watakuja kwangu.
  rationale: Marekebisho yanaondoa dhana isiyo ya lazima ya kuchagua, yanabadilisha usemi unaoweza kueleweka kama kuzunguka pembezoni mwa nchi, na yanahifadhi jinsia ya nomino ya Kiebrania. Pia yanaweka wazi kwa kiasi kidogo, na kwa Kiswahili cha kawaida, kwamba kilichoandikwa ni maelezo ya nchi kuhusiana na mgao wa urithi.
