base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/004.yaml
  text: Provide for yourselves three men from each tribe[a], and I will send them out; they shall arise and walk through the land and write it down according to their inheritance[b], and they shall come to me.
translation:
  language: sw
  text: Jipatieni wanaume watatu kutoka kila kabila[a], nami nitawatuma. Wataondoka, watapita-pita katika nchi na kuandika maelezo ya nchi kulingana na sehemu zao za urithi[b]; kisha watakuja kwangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jiteulieni wanaume watatu kwa kila kabila.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, walipaswa kuandika maelezo ya nchi kwa kuzingatia sehemu za urithi zitakazogawiwa.
    reason: cultural_note
lexical_decisions:
- source_word: הָבוּ לָכֶם
  choice: Jichagulieni
  rationale: Amri hii inawataka wasikilizaji wawatoe au wawateue watu miongoni mwao. ‘Jichagulieni’ ni Kiswahili cha kawaida kinachowasilisha tendo hilo na nguvu ya לָכֶם (‘kwa ajili yenu wenyewe’) bila kutumia tafsiri ngumu ya neno kwa neno.
- source_word: שְׁלֹשָׁה אֲנָשִׁים
  choice: watu watatu
  rationale: Katika Kiswahili, ‘watu watatu’ ni usemi wa kawaida kwa wawakilishi hawa; muktadha wa kale hauhitaji kuongeza neno ‘wanaume’ ili kutofautisha jinsia, ingawa nomino ya Kiebrania iko katika umbo la kiume.
- source_word: לַשָּׁבֶט
  choice: kutoka kila kabila
  rationale: 'Nomino ya umoja yenye kiambishi ina maana ya mgawanyo katika muktadha huu: watu watatu kutoka kwa kila kabila.'
- source_word: וְאֶשְׁלָחֵם
  choice: nami nitawatuma
  rationale: Huhifadhi maana ya moja kwa moja ya שלח, yaani kuwatuma kwa kazi.
- source_word: וְיָקֻמוּ
  choice: Wataondoka
  rationale: Ingawa maana ya msingi ni ‘watainuka,’ hapa kitenzi kinaanzisha safari na kazi yao. ‘Wataondoka’ ni Kiswahili cha sasa na cha kawaida kinachofaa muktadha.
- source_word: וְיִתְהַלְּכוּ בָאָרֶץ
  choice: wataizunguka nchi
  rationale: Umbo la kitenzi linaonyesha kwenda huku na huku au kuipitia nchi. ‘Kuizunguka’ huonyesha uchunguzi wa eneo lote bila kudokeza tu kutembea kwa miguu.
- source_word: וְיִכְתְּבוּ אוֹתָהּ
  choice: kuandika habari zake
  rationale: Kiwakilishi cha kitu kinarejelea nchi. Kiswahili hakiwezi kusema kwa kawaida ‘waiandike nchi’; ‘kuandika habari zake’ huweka wazi tendo la kurekodi taarifa za nchi bila kulifanya mahsusi kuwa ramani au aina fulani ya uchunguzi.
- source_word: לְפִי נַחֲלָתָם
  choice: kulingana na urithi wao
  rationale: Huhifadhi usemi wenye uwezekano wa kurejelea urithi au sehemu zao za urithi; tanbihi inaeleza matumizi yake katika ugawaji wa nchi.
- source_word: וְיָבֹאוּ אֵלָי
  choice: kisha watanijia
  rationale: Hufuata maana ya moja kwa moja ‘watakuja kwangu’ bila kuongeza dhana ya ‘kurudi,’ ingawa muktadha unaidokeza.
