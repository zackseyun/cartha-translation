base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/009.yaml
  text: So the men went and passed through the land[a], and they wrote it down by cities in seven portions in a book[b], and they came to Joshua at the camp in Shiloh.
translation:
  language: sw
  text: Basi wale watu wakaenda, wakapita katika nchi hiyo, wakaandika habari zake mji kwa mji katika sehemu saba kwenye hati[a]. Kisha wakamjia Yoshua kambini Shilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “juu ya kitabu/gombo” (עַל־סֵפֶר), yaani katika waraka ulioandikwa.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלְכוּ הָאֲנָשִׁים
  choice: wale watu wakaenda
  rationale: ‘Wale watu’ hurejelea kwa dhahiri wajumbe wanaume waliotajwa katika muktadha, huku ikiwa Kiswahili cha kawaida; ‘wakaenda’ huhifadhi mfuatano wa masimulizi.
- source_word: וַיַּעַבְרוּ בָאָרֶץ
  choice: wakapita katika nchi hiyo
  rationale: Huwasilisha tendo la kuizunguka au kuivuka nchi kwa ajili ya uchunguzi bila kuongeza wazo lisilotajwa wazi.
- source_word: וַיִּכְתְּבוּהָ
  choice: wakaiandika
  rationale: Kiambishi ‘-i-’ kinarejelea nchi na kuhifadhi yambwa ya kike umoja ya Kiebrania kwa njia ya kawaida katika Kiswahili.
- source_word: לֶעָרִים
  choice: kwa kufuata miji
  rationale: Hueleza maana ya kupanga maelezo ya nchi mji kwa mji, badala ya tafsiri isiyo ya kawaida ‘kwa miji’.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: katika sehemu saba
  rationale: ‘Sehemu’ ni neno la kawaida na pana linalohifadhi mgawanyo wa nchi bila kulazimisha maana maalumu ya mgao.
- source_word: עַל סֵפֶר
  choice: kwenye hati
  rationale: סֵפֶר hapa ni maandishi au waraka; ‘hati’ ni ya asili zaidi kuliko ‘kitabu’ kwa kumbukumbu ya uchunguzi wa kale, huku tanbihi ikitaja uwezekano wa gombo.
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ
  choice: wakaja kwa Yoshua
  rationale: Hufuata kitenzi cha Kiebrania ‘wakaja’ bila kuongeza ‘wakarudi,’ ingawa kurudi kunaeleweka kutokana na muktadha.
- source_word: אֶל הַמַּחֲנֶה שִׁלֹה
  choice: kambini huko Shilo
  rationale: Hutaja kwa Kiswahili cha kawaida mahali Yoshua alipokuwa, bila kurudia kihusishi baada ya ‘kwa Yoshua’.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha masimulizi yenye hadhi lakini kinachoeleweka kwa urahisi. Mfuatano wa vitenzi vya ‘waka-’ umehifadhi mwendo wa simulizi la Kiebrania. Maana ya לֶעָרִים imewekwa wazi katika matini kama ‘kwa kufuata miji,’ kwa hiyo hakuna tanbihi tofauti inayohitajika kwa kirai hicho.
