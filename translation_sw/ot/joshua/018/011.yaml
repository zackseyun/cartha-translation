translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wazao’ limetumiwa badala ya ‘wana’ ili kuepuka dhana ya wana wa moja kwa moja, na ‘koo’ linaonyesha vikundi vya ukoo ndani ya kabila.
