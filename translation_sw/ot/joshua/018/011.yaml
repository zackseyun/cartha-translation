base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/011.yaml
  text: And the lot for the tribe of the sons of Benjamin[a], by their clans, came up[b], and the territory of their lot came out between the sons of Judah and the sons of Joseph.
translation:
  language: sw
  text: Kura ya kabila la wazao wa Benyamini, kwa koo zao, ikatokea; na mpaka wa kura yao[a] ukatokea kati ya wazao wa Yuda na wazao wa Yosefu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “eneo la kura yao likatokea.” Neno la Kiebrania linaweza kurejelea mpaka au, kwa maana ya kimajazi, eneo linalobainishwa na mpaka huo.
    reason: lexical_alternative
  - marker: b
    text: “Wazao wa Yosefu” hapa ni jina la pamoja la makabila yaliyotokana na Yosefu, hasa Efraimu na Manase.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: ilitokea
  rationale: Kitenzi עָלָה kwa msingi humaanisha ‘kupanda,’ lakini katika muktadha wa kupiga kura kinaeleza kura iliyotokea au kuibuka. ‘Ilitokea’ ni Kiswahili cha kawaida kinachohifadhi picha hiyo bila kuongeza wazo la namna maalumu ya kuitoa kura.
- source_word: גּוֹרָל
  choice: kura
  rationale: Neno hili linataja kura iliyotumiwa kugawa nchi; ‘kura’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: מַטֵּה
  choice: kabila
  rationale: Katika muktadha wa mgawanyo wa nchi, neno hili linamaanisha kundi la kikabila, si fimbo yake ya msingi.
- source_word: בְנֵי בִנְיָמִן
  choice: wazao wa Benyamini
  rationale: ‘Wazao’ huwasilisha maana ya kifamilia ya בְּנֵי kwa Kiswahili cha sasa bila kudokeza kuwa ni wana wa moja kwa moja tu.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: מִשְׁפָּחוֹת ni vikundi vya ukoo ndani ya kabila; ‘koo’ ni sahihi zaidi hapa kuliko ‘familia’ kwa maana yake ya kisasa.
- source_word: גְּבוּל גּוֹרָלָם
  choice: eneo walilopewa kwa kura
  rationale: גְּבוּל inaweza kuwa mpaka au nchi iliyo ndani ya mpaka. Katika sentensi hii, mahali palipokuwa kati ya Yuda na Yosefu ni eneo la Benyamini; tafsiri hii hutumia maana hiyo ya kimajazi na kuweka mbadala wa ‘mpaka’ katika tanbihi.
- source_word: בֵּין ... וּבֵין
  choice: kati ya ... na ...
  rationale: Muundo huu unaonyesha moja kwa moja kwamba sehemu ya Benyamini ilikuwa baina ya maeneo ya Yuda na Yosefu.
- source_word: בְנֵי יְהוּדָה
  choice: wazao wa Yuda
  rationale: ‘Wazao’ huhifadhi uhusiano wa nasaba unaoonyeshwa na Kiebrania na ni wa kawaida kwa Kiswahili.
- source_word: בְנֵי יוֹסֵף
  choice: wazao wa Yosefu
  rationale: Kirai hiki kinataja kwa pamoja makabila yaliyotokana na Yosefu, hasa Efraimu na Manase.
