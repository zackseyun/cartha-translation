base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/021.yaml
  text: And the cities belonging to the tribe of the sons of Benjamin[a], according to their clans, were Jericho, Beth-hoglah, and Emek-keziz.
translation:
  language: sw
  text: Na miji ya kabila la wana wa Benyamini, kulingana na koo zao, ilikuwa Yeriko, Beth-hogla, na Emek-Kesisi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda, “Bonde la Kesisi,” ikiwa jina hilo linaeleweka kuwa maelezo ya mahali badala ya kutoholewa kama jina maalumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ הֶעָרִים
  choice: Miji ... ilikuwa
  rationale: Muundo huu wa Kiswahili unatanguliza orodha ya miji kwa njia ya kawaida huku ukihifadhi kazi ya kishazi cha Kiebrania.
- source_word: לְמַטֵּה בְּנֵי בִנְיָמִן
  choice: ya kabila la wana wa Benyamini
  rationale: Neno לְמַטֵּה linaonyesha uhusiano au mgao wa kikabila; 'ya kabila la' ni ya asili katika Kiswahili. 'Wana wa Benyamini' huhifadhi tamathali ya ukoo ya Kiebrania.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: kulingana na koo zao
  rationale: Katika muktadha wa mgao wa kikabila, מִשְׁפָּחָה ni kikundi cha ukoo ndani ya kabila, hivyo 'koo' ni sahihi kuliko 'familia'.
- source_word: יְרִיחוֹ
  choice: Yeriko
  rationale: Tahajia ya kawaida ya jina hili la mahali katika Kiswahili.
- source_word: בֵית חָגְלָה
  choice: Beth-hogla
  rationale: Jina la mahali limenukuliwa kwa tahajia inayotambulika, huku sehemu בית ikibaki kama sehemu ya jina maalumu.
- source_word: עֵמֶק קְצִיץ
  choice: Emek-Kesisi
  rationale: Kirai hiki kimechukuliwa kuwa jina maalumu la mahali na kunukuliwa, badala ya kutafsiri עֵמֶק moja kwa moja kuwa 'Bonde'.
