  text: Then it passed on to the shoulder opposite the Arabah on the north[b][a], and went down to the Arabah.
translation:
  language: sw
  text: Kisha mpaka ukaendelea hadi kwenye bega[b] lililoelekeana na Araba[a] upande wa kaskazini, kisha ukashuka kuelekea Araba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tambarare.” Neno la Kiebrania linaweza kuwa jina la eneo la Araba au neno la kawaida la kueleza aina hiyo ya ardhi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “bega”; hii ni sitiari ya kijiografia inayoweza kumaanisha ubavu, tuta, au mteremko wa eneo.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָבַר
  choice: Kisha mpaka ukapita
  rationale: Katika maelezo ya mipaka, kitenzi hiki huonyesha mpaka ukiendelea kutoka sehemu moja hadi nyingine. Kutaja “mpaka” kwa uwazi kunafanya Kiswahili kiwe cha asili bila kubadili maana inayodokezwa na muktadha.
- source_word: אֶל
  choice: hadi kwenye
  rationale: Huonyesha mwendo wa mpaka kuelekea alama inayofuata ya kijiografia.
- source_word: כֶּתֶף
  choice: bega
  rationale: Neno la Kiebrania humaanisha kihalisi “bega” na limetumiwa kama sitiari ya sehemu ya ubavu, tuta, au mteremko wa eneo. Taswira hiyo imehifadhiwa katika matini na kufafanuliwa katika tanbihi.
- source_word: מוּל
  choice: lililoelekeana na
  rationale: Huonyesha uhusiano wa mahali kati ya “bega” hilo na Araba; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: הָעֲרָבָה
  choice: Araba
  rationale: Hapa neno linaweza kutumiwa kama jina la eneo la kijiografia, hivyo limetoholewa kuwa “Araba” badala ya kufasiriwa kwa namna inayoweza kulibana kuwa “tambarare” tu.
- source_word: צָפֹנָה
  choice: upande wa kaskazini
  rationale: Kiambishi cha mwelekeo huonyesha uhusiano wa upande wa kaskazini; tafsiri hii huepuka kudokeza bila lazima kwamba mpaka wenyewe ulikuwa ukisonga kaskazini.
- source_word: וְיָרַד
  choice: ukashuka
  rationale: Kitenzi huonyesha kushuka kwa kufuata mwinuko wa ardhi; “ukashuka” ni kifupi na cha asili katika simulizi la mpaka.
- source_word: הָעֲרָבָתָה
  choice: hadi Araba
  rationale: Herufi ya mwelekeo mwishoni mwa neno huonyesha mwendo kuelekea Araba; “hadi” huiwasilisha kwa kawaida katika Kiswahili.
