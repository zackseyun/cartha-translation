translation:
  language: sw
  text: Beth-araba[a], Semaraimu na Betheli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Majina haya ya Kiebrania ni majina ya mahali. “Beth-araba” lingeweza kutafsiriwa moja kwa moja kuwa “nyumba ya Araba,” na “Betheli” kuwa “nyumba ya Mungu,” lakini katika kifungu kikuu yamehifadhiwa kama majina ya mahali yaliyotoholewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית הָעֲרָבָה
  choice: Beth-araba
  rationale: Ni jina la mahali katika orodha ya miji, kwa hiyo limetoholewa badala ya kutafsiriwa kwa maana ya vipashio vyake. Umbo hili linafuata matamshi ya Kiebrania huku likisomeka kwa urahisi katika Kiswahili.
- source_word: צְמָרַיִם
  choice: Semaraimu
  rationale: Ni jina maalumu la mahali. Limetoholewa kwa mfumo unaofaa sauti na tahajia ya Kiswahili, huku mwisho wa jina la Kiebrania ukihifadhiwa kwa kadiri inayowezekana.
- source_word: בֵית אֵל
  choice: Betheli
  rationale: Ni jina la mahali lililozoeleka katika Kiswahili cha Biblia. Limetoholewa badala ya kutafsiriwa kuwa “nyumba ya Mungu.”
- source_word: וּ
  choice: na
  rationale: Kiunganishi hiki kinaunganisha majina ya mahali katika orodha; Kiswahili cha kawaida hutumia koma na kuweka “na” kabla ya jina la mwisho.
