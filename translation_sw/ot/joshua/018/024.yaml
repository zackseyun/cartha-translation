translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi wa orodha ya mipaka na maeneo. Mstari umeanza kwa “na” ili kuhifadhi mwendelezo wa orodha katika Kiebrania. Alama ya mkato mrefu kabla ya jumla ya miji huonyesha kwa uwazi kwamba sehemu ya mwisho ni muhtasari wa orodha.
