  text: 'And Chephar-ammoni[a], Ophni, and Geba: twelve cities with their villages.'
translation:
  language: sw
  text: 'Na Kefar-haamoni[a], Ofni, na Geba: miji kumi na miwili pamoja na vijiji vyake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina hili pia linaweza kutoholewa “Kefar-haammoni” au “Kefar-ha-Amoni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפַר העמני
  choice: Kefar-Haamoni
  rationale: Ni jina la mahali, kwa hiyo limetoholewa kwa kufuata sauti za Kiebrania badala ya kutafsiriwa kuwa “kijiji cha Waamoni.” Kiunganishi וּ kimetafsiriwa “na.”
- source_word: הָעָפְנִי
  choice: Ofni
  rationale: Ni jina la mji katika orodha; kibainishi cha Kiebrania kimechukuliwa kuwa sehemu ya muundo wa jina na hakikutafsiriwa kando.
- source_word: גָבַע
  choice: Geba
  rationale: Katika muktadha huu ni jina maalumu la mji, si nomino ya kawaida yenye maana ya kilima.
- source_word: עָרִים
  choice: miji
  rationale: Neno hili linataja makao makuu katika orodha ya maeneo; “miji” ni tafsiri ya kawaida, ya asili na yenye hadhi katika Kiswahili.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: kumi na miwili
  rationale: Idadi imepatana kisarufi na nomino ya ngeli ya MI, “miji.”
- source_word: חַצְרֵיהֶן
  choice: vijiji vyake
  rationale: Hurejelea makao madogo ya kandokando yaliyohusishwa na miji iliyotajwa. “Vijiji” ni neno la kawaida zaidi kuliko maelezo marefu kama “makao yasiyozungushiwa ukuta”; “vyake” hudumisha uhusiano wake na mkusanyo wa miji.
