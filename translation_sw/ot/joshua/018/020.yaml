  yaml_path: translation/ot/joshua/018/020.yaml
  text: And the Jordan formed its border on the east side[a]. This was the inheritance of the sons of Benjamin, according to its borders all around[b], by their clans.
translation:
  language: sw
  text: Mto Yordani ulikuwa mpaka wake upande wa mashariki.[a] Huu ndio uliokuwa urithi wa wazao wa Benyamini,[b] kwa mipaka yake pande zote, kulingana na koo zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uliupaka mpaka” au “ulikuwa mpaka wake.” Kitenzi cha Kiebrania kinaonyesha kwamba Mto Yordani ulitumika kuwa mpaka wa eneo hilo.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “wana wa Benyamini,” yaani wazao wa Benyamini kama kabila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיַּרְדֵּן
  choice: Mto Yordani
  rationale: Jina hilo linaashiria mto; kuongeza “Mto” ni Kiswahili cha kawaida na huondoa utata bila kubadili maana.
- source_word: יִגְבֹּל אֹתוֹ
  choice: ukawa mpaka wake
  rationale: Kitenzi גבל hapa kinaonyesha kwamba Yordani ndiyo iliyokuwa mpaka wa eneo hilo; usemi huu ni wa asili katika Kiswahili.
- source_word: לִפְאַת קֵדְמָה
  choice: upande wa mashariki
  rationale: Huwasilisha wazi upande wa eneo unaokusudiwa na פאה pamoja na mwelekeo wa קֵדְמָה.
- source_word: זֹאת נַחֲלַת
  choice: Huo ndio uliokuwa urithi
  rationale: Kirai cha Kiebrania hakina kitenzi kilichoandikwa; wakati uliopita unasikika kwa kawaida katika simulizi hili, na kiwakilishi “huo” kinarejelea mgao wa ardhi.
- source_word: בְּנֵי בִנְיָמִן
  choice: wazao wa Benyamini
  rationale: Katika muktadha wa kabila, “wana wa Benyamini” ni jina la ukoo mzima; “wazao” huwasilisha maana hiyo kwa Kiswahili cha sasa bila kuifanya iwe wanaume pekee.
- source_word: לִגְבוּלֹתֶיהָ סָבִיב
  choice: kwa mipaka yake yote kuzunguka
  rationale: Huhifadhi wazo la mistari ya mpaka inayolizunguka eneo lote.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kulingana na koo zao
  rationale: מִשְׁפָּחוֹת hapa ni vikundi vya kifamilia ndani ya kabila; “koo” ndiyo istilahi fupi na ya kawaida katika muktadha wa ugawaji wa ardhi.
