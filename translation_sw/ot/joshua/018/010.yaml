  text: וַ/יַּשְׁלֵךְ֩ לָ/הֶ֨ם יְהוֹשֻׁ֧עַ גּוֹרָ֛ל בְּ/שִׁלֹ֖ה לִ/פְנֵ֣י יְהוָ֑ה וַ/יְחַלֶּק שָׁ֨ם יְהוֹשֻׁ֧עַ אֶת הָ/אָ֛רֶץ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל כְּ/מַחְלְקֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/010.yaml
  text: Then Joshua cast lots for them at Shiloh before Yahweh[a], and there Joshua divided the land to the sons of Israel according to their divisions.
translation:
  language: sw
  text: Kisha Yoshua akawapigia kura huko Shilo mbele za Yahwe, na hapo Yoshua akaigawa nchi kwa wana wa Israeli kulingana na migawanyo yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁלֵךְ ... גּוֹרָל
  choice: akawapigia kura
  rationale: Hii ni nahau ya kupiga kura ili kuamua mgao. Kiswahili ‘kuwapigia kura’ kinaonyesha kwamba kura hizo zilihusu makabila yaliyokuwa yanapokea sehemu zao.
- source_word: בְּשִׁלֹה
  choice: huko Shilo
  rationale: ‘Huko’ ni usemi wa kawaida wa Kiswahili unaorejelea mahali palipotajwa, yaani Shilo.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Inahifadhi maana ya tendo kufanywa katika uwepo wa Yahwe, katika mazingira ya ibada huko Shilo.
- source_word: וַיְחַלֶּק
  choice: akaigawa
  rationale: Kitenzi kinaeleza kugawa nchi katika sehemu; maana ya ugawaji kwa kura tayari inaonekana katika kishazi cha kwanza.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha wa Yoshua, neno hili linamaanisha nchi iliyokuwa ikigawiwa kwa Israeli.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kwa wana wa Israeli
  rationale: Tafsiri hii inafuata kwa karibu usemi wa Kiebrania ‘wana wa Israeli,’ ambao hapa unawataja watu wa Israeli kwa ujumla.
- source_word: כְּמַחְלְקֹתָם
  choice: kulingana na migawanyo yao
  rationale: Inahifadhi wazo la sehemu au makundi yaliyowekwa katika utaratibu wa kugawa nchi bila kulifanya kuwa mahususi kuliko Kiebrania.
theological_decisions:
- issue: Kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Kiebrania kinatumia moja kwa moja jina la agano, YHWH; ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Muundo wa simulizi wenye ‘Kisha ... aka-’ unadumisha mfuatano wa matendo. Hakuna tanbihi iliyowekwa kwa kuwa taarifa ya Kiingereza kuhusu ‘sons of Israel’ haipatani na mahali pa alama [a] baada ya ‘Yahweh’; badala yake usemi wa Kiebrania umetafsiriwa wazi katika matini.
