  text: כִּ֠י אֵֽין חֵ֤לֶק לַ/לְוִיִּם֙ בְּ/קִרְבְּ/כֶ֔ם כִּֽי כְהֻנַּ֥ת יְהוָ֖ה נַחֲלָת֑/וֹ וְ/גָ֡ד וּ/רְאוּבֵ֡ן וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה לָקְח֣וּ נַחֲלָתָ֗/ם מֵ/עֵ֤בֶר לַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/007.yaml
  text: For there is no portion for the Levites among you[a], because the priesthood of Yahweh is their inheritance. And Gad, Reuben, and the half-tribe of Manasseh have received their inheritance beyond the Jordan eastward, which Moses the servant of Yahweh gave them.
translation:
  language: sw
  text: Kwa maana Walawi hawana sehemu miongoni mwenu, kwa sababu ukuhani wa Yahwe ndio urithi wao[a]. Nao Gadi, Reubeni, na nusu ya kabila la Manase wamepokea urithi wao ng’ambo ya Yordani, upande wa mashariki, ambao Musa mtumishi wa Yahwe aliwapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “urithi wake.” Umoja huo huenda unamrejelea Lawi, au Walawi kama kundi; kwa hiyo matini kuu imetumia “urithi wao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶק
  choice: sehemu
  rationale: Neno hili linaonyesha fungu au sehemu inayogawiwa. “Sehemu” ni ya kawaida katika Kiswahili na pia inalinda tofauti yake na נַחֲלָה, lililotafsiriwa “urithi” baadaye katika aya.
- source_word: לַלְוִיִּם
  choice: Walawi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa watu wa kabila la Lawi, wanaotajwa hapa kama kundi.
- source_word: בְּקִרְבְּכֶם
  choice: miongoni mwenu
  rationale: Kauli hii inaeleza kwamba Walawi hawana sehemu katika mgawanyo unaofanywa kati ya makabila yaliyopo.
- source_word: כְהֻנַּת יְהוָה
  choice: ukuhani wa Yahwe
  rationale: “Ukuhani” huhifadhi maana ya cheo na huduma ya kikuhani, huku “wa Yahwe” ikidumisha uhusiano wa moja kwa moja uliomo katika Kiebrania.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo, hivyo kuhifadhi jina la agano lililo katika matini ya Kiebrania.
- source_word: נַחֲלָתוֹ
  choice: urithi wao
  rationale: Kiwakilishi cha Kiebrania ni cha umoja, lakini kinarejelea Lawi au Walawi kwa maana ya pamoja. Kiswahili cha kawaida hutumia wingi “wao” kwa kundi hili; tanbihi inaonyesha umbo halisi la Kiebrania.
- source_word: לָקְחוּ
  choice: wamekwisha kupokea
  rationale: Ingawa kitenzi kinaweza kutafsiriwa “walichukua,” katika muktadha wa ugawaji wa ardhi “kupokea” huonyesha kwa usahihi kwamba urithi huo walipewa kihalali.
- source_word: נַחֲלָתָם
  choice: urithi wao
  rationale: Hii ni istilahi inayofaa kwa ardhi ya kudumu iliyogawiwa makabila kuwa milki yao.
- source_word: מֵעֵבֶר לַיַּרְדֵּן מִזְרָחָה
  choice: ng’ambo ya Yordani, upande wa mashariki
  rationale: Tafsiri hii inaweka wazi kuwa eneo linalokusudiwa ni upande wa mashariki wa Mto Yordani.
- source_word: עֶבֶד יְהוָה
  choice: mtumishi wa Yahwe
  rationale: “Mtumishi” ni neno la heshima na la kawaida katika Kiswahili kwa cheo hiki cha Musa; hapa maana ya utumwa haitiliwi mkazo.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Matini inatumia jina la Mungu lenye herufi nne moja kwa moja. “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Kiwakilishi cha umoja katika נַחֲלָתוֹ
  choice: urithi wao
  alternative: urithi wake
  rationale: Kisarufi, Kiebrania kina kiwakilishi cha nafsi ya tatu umoja wa kiume, lakini kinarejelea Lawi/Walawi kama jumuiya. Wingi ni wa asili katika Kiswahili, huku tanbihi ikihifadhi taarifa kuhusu umoja wa matini chanzi.
- issue: Maana ya כְהֻנַּת יְהוָה
  choice: ukuhani wa Yahwe
  alternative: huduma ya kikuhani kwa Yahwe
  rationale: “Ukuhani” huhifadhi uwezekano wa kurejelea cheo, wajibu, au huduma ya kikuhani bila kuibana maana kuwa shughuli pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Majina Gadi, Reubeni, Manase, Yordani, na Yahwe yametolewa kwa maumbo yanayotambulika katika matumizi ya kibiblia ya Kiswahili. Tanbihi imewekwa baada ya “urithi wao,” yaani mahali panapohusika moja kwa moja na tofauti ya umoja katika Kiebrania.
