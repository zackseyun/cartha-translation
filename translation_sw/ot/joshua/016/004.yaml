  text: And the sons of Joseph[a], Manasseh and Ephraim, received their inheritance.
translation:
  language: sw
  text: Nao wana wa Yosefu, Manase na Efraimu, wakapokea[a] urithi wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliurithi” au “waliingia katika milki ya urithi wao.”
    reason: Kitenzi cha Kiebrania kinaweza kueleza kupokea urithi, kuurithi, au kuingia katika milki yake.
lexical_decisions:
- source_word: וַיִּנְחֲלוּ
  choice: wakapokea urithi wao
  rationale: Kitenzi נחל hapa kinaonyesha kupewa au kuingia katika milki ya sehemu iliyotengwa kuwa urithi. Kauli hii ni ya kawaida katika Kiswahili na inafaa muktadha wa ugawaji wa nchi bila kusisitiza mno tendo la kuiteka.
- source_word: בְנֵי יוֹסֵף
  choice: wana wa Yosefu
  rationale: Huhifadhi tamathali ya ukoo ya Kiebrania, huku Manase na Efraimu wakitajwa wazi kama wana wa Yosefu na pia wakiwakilisha makabila yao.
- source_word: מְנַשֶּׁה
  choice: Manase
  rationale: Jina limetolewa kwa tahajia inayotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: וְאֶפְרָיִם
  choice: na Efraimu
  rationale: Jina limetolewa kwa tahajia inayotumika kwa kawaida katika Biblia za Kiswahili, na kiunganishi cha Kiebrania kimehifadhiwa.
- source_word: וַ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi kutoka katika maelezo yaliyotangulia; “Nao” ni cha asili na chenye hadhi katika Kiswahili.
