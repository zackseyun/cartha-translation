translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Muundo wa kurudia ‘mpaka’ unahifadhi hatua za maelezo ya mpaka katika Kiebrania, huku tanbihi ikiweka wazi nahau ya mwisho bila kuilazimisha katika matini kuu.
