base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/003.yaml
  text: Then it went down westward to the border of the Japhletites[a], as far as the border of Lower Beth-horon, and as far as Gezer; and its goings out were at the sea.
translation:
  language: sw
  text: Kisha ukateremka kuelekea magharibi hadi mpakani mwa Yafleti, hadi mpakani mwa Beth-horoni ya Chini, na hadi Gezeri; na miisho yake ilikuwa baharini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania, “na sehemu zake za kuishia zilikuwa baharini”; huu ni usemi wa maelezo ya mipaka unaomaanisha kwamba ncha za mpaka zilifikia bahari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: Kisha ukateremka
  rationale: Katika maelezo ya mipaka, kitenzi hiki huonyesha mpaka ukishuka kufuatana na mwinuko wa ardhi au mwelekeo wake. Kiswahili hiki kinahifadhi maana ya kuteremka na kuendeleza mfululizo wa maelezo.
- source_word: יָמָּה
  choice: kuelekea magharibi
  rationale: Umbo hili la kimwelekeo, linalotokana na neno ‘bahari,’ kwa kawaida humaanisha kuelekea magharibi katika jiografia ya Israeli, ambako Bahari ya Mediterania iko.
- source_word: אֶל גְּבוּל הַיַּפְלֵטִי
  choice: hadi kwenye mpaka wa Wayafleti
  rationale: גְּבוּל ni mpaka au mstari wa mpaka. הַיַּפְלֵטִי ni jina la kikabila au la wakazi wa eneo, hivyo limetoholewa kwa namna ya kawaida ya Kiswahili kama ‘Wayafleti.’
- source_word: עַד גְּבוּל בֵּית חוֹרֹן תַּחְתּוֹן
  choice: mpaka kwenye mpaka wa Beth-horoni ya Chini
  rationale: עַד huonyesha mwisho wa mwendo wa mpaka. תַּחְתּוֹן hutofautisha mji huu na Beth-horoni ya Juu; ‘ya Chini’ ni wazi na ya kawaida kwa Kiswahili.
- source_word: וְעַד גָּזֶר
  choice: na mpaka Gezeri
  rationale: Kurudiwa kwa עַד kumehifadhiwa ili kuonyesha hatua nyingine ya mpaka. Jina גָּזֶר limetoholewa kama ‘Gezeri.’
- source_word: וְהָיוּ תֹצְאֹתָיו יָמָּה
  choice: na miisho yake ilikuwa baharini
  rationale: תֹצְאֹתָיו ni fomula ya maelezo ya mipaka inayorejelea ncha au sehemu ambako mpaka unaishia. Hapa יָמָּה inaeleweka kwa maana halisi ya kufikia bahari, si tu kuelekea magharibi.
