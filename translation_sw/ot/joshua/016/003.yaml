    issue: '"Wayafleti" interprets the Hebrew gentilic as a plural people-group name.'
    rationale: The Hebrew הַיַּפְלֵטִי is a gentilic designation and need not be made explicitly plural in Swahili. "Yafleti" preserves the designation without adding number.
  - severity: low
    issue: The boundary phrasing and footnote contain awkward Swahili.
    rationale: '"Mpaka kwenye mpaka" is clumsy, and "kwa neno halisi" / "sehemu zake za kutokea" do not naturally express a Hebrew boundary formula in Standard East African Swahili.'
