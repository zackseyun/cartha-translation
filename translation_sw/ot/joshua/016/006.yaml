  text: וְ/יָצָ֨א הַ/גְּב֜וּל הַ/יָּ֗מָּ/ה הַֽ/מִּכְמְתָת֙ מִ/צָּפ֔וֹן וְ/נָסַ֧ב הַ/גְּב֛וּל מִזְרָ֖חָ/ה תַּאֲנַ֣ת שִׁלֹ֑ה וְ/עָבַ֣ר אוֹת֔/וֹ מִ/מִּזְרַ֖ח יָנֽוֹחָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/006.yaml
  text: Then the border went out westward to Michmethath on the north[a], and the border turned eastward to Taanath-shiloh, and passed it on the east to Janoah.
translation:
  language: sw
  text: Kisha mpaka ukaendelea kuelekea magharibi[a] hadi Mikmethathi, upande wa kaskazini. Mpaka ukapinda kuelekea mashariki hadi Taanath-shilo, ukapita upande wake wa mashariki hadi Yanoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kuelekea baharini,” nahau ya Kiebrania inayomaanisha “kuelekea magharibi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Kisha ... ukaendelea
  rationale: Katika maelezo ya mipaka, kitenzi hiki huonyesha mstari wa mpaka ukiendelea mbele; ‘ukaendelea’ ni Kiswahili cha kawaida na huhifadhi mwendo wa simulizi.
- source_word: הַגְּבוּל
  choice: mpaka
  rationale: Neno hili hapa linamaanisha mstari wa kugawa maeneo ya makabila; ‘mpaka’ ni neno la kawaida na sahihi katika Kiswahili.
- source_word: הַיָּמָּה
  choice: kuelekea magharibi
  rationale: Kihalisi ni ‘kuelekea baharini,’ lakini ni nahau ya Kiebrania inayomaanisha upande wa magharibi; maana ya kijiografia imetolewa wazi huku maana halisi ikiwekwa katika tanbihi.
- source_word: הַמִּכְמְתָת
  choice: Mikmethathi
  rationale: Jina la mahali limetoholewa kwa tahajia inayoweza kusomeka kwa kawaida katika Kiswahili huku ikifuata umbo la Kiebrania.
- source_word: מִצָּפוֹן
  choice: upande wa kaskazini
  rationale: Kirai hiki kinaeleweka zaidi kama maelezo ya mahali pa Mikmethathi kuhusiana na mpaka.
- source_word: וְנָסַב
  choice: ukapinda
  rationale: Katika orodha za mipaka, kitenzi hiki huonyesha mstari ukibadili mwelekeo; ‘ukapinda’ huwasilisha picha hiyo ya kijiografia.
- source_word: מִזְרָחָה
  choice: kuelekea mashariki
  rationale: Kiambishi cha mwelekeo kinaonyesha mwendo upande wa mashariki.
- source_word: תַּאֲנַת שִׁלֹה
  choice: Taanath-shilo
  rationale: Jina la mahali limetoholewa kutoka Kiebrania; kistari kinaonyesha kwamba ni jina changamano.
- source_word: וְעָבַר אֹתוֹ
  choice: ukapita
  rationale: Katika maelezo ya mpaka, kirai hiki huonyesha mpaka ukiendelea kupita mahali palipotajwa, si lazima kuvuka kizuizi.
- source_word: מִמִּזְרַח
  choice: upande wake wa mashariki
  rationale: 'Tafsiri hii inaeleza uhusiano wa mpaka na Taanath-shilo: mpaka ulipita upande wa mashariki wa mahali hapo.'
- source_word: יָנוֹחָה
  choice: Yanoa
  rationale: Jina la mahali limetoholewa kwa mfumo wa sauti unaofaa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa msomaji wa kawaida. Kurudiwa kwa ‘mpaka’ kumehifadhiwa kwa uwazi, na majina ya mahali yametoholewa kwa tahajia inayosomeka kwa Kiswahili.
