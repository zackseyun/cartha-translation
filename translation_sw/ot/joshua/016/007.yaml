  yaml_path: translation/ot/joshua/016/007.yaml
  text: Then it went down from Janoah to Ataroth and Naarah[a], and reached Jericho[c][b], and ended at the Jordan.
translation:
  language: sw
  text: Kisha mpaka ukashuka kutoka Yanoa hadi Atarothi na Naara[a], ukafika Yeriko[b], na ukaishia kwenye Mto Yordani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: Naara; wengine hulihusianisha jina hili la mahali na Naarathi.'
    reason: alternative_reading
  - marker: b
    text: Au, “ukagusa Yeriko”; kitenzi cha Kiebrania kinaweza kueleza mpaka unaofikia, unaokutana na, au unaogusa mahali fulani.
    reason: lexical_alternative
  - marker: c
    text: Au, “ukaenda hadi Mto Yordani”; nahau ya Kiebrania inaeleza mkondo au mwisho wa mpaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: Kisha mpaka ukashuka
  rationale: Katika maelezo ya mipaka, ירד hueleza mpaka unaoshuka kwa mwinuko au mwelekeo. Neno “mpaka” limewekwa wazi ili kiima cha kijiografia kieleweke kwa Kiswahili cha kawaida.
- source_word: מִיָּנוֹחָה
  choice: kutoka Yanoa
  rationale: Kiambishi מִן kimetafsiriwa “kutoka,” na jina la mahali יָנוֹחַ limetoholewa kama Yanoa kwa namna inayosomeka kwa Kiswahili.
- source_word: עֲטָרוֹת
  choice: Atarothi
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa; “th” ya Kiebrania imewakilishwa kwa “th” na irabu ya mwisho imesaidia matamshi ya Kiswahili.
- source_word: וְנַעֲרָתָה
  choice: na Naara
  rationale: Maandishi ya Kimasora hapa yanaelekeza kwenye umbo Naara; uwezekano wa kulihusianisha na Naarathi umehifadhiwa katika tanbihi.
- source_word: וּפָגַע בִּירִיחוֹ
  choice: ukafika Yeriko
  rationale: Katika maelezo ya mipaka, פגע inaweza kumaanisha kufikia, kukutana na, au kugusa eneo. “Ukafika” ni ya asili kwa Kiswahili na haiamui kwa kupita kiasi namna mpaka ulivyolikuta eneo hilo.
- source_word: וְיָצָא הַיַּרְדֵּן
  choice: na kuishia kwenye Mto Yordani
  rationale: Katika kanuni za kueleza mipaka, יצא mara nyingi huonyesha mahali mpaka unapofikia au kuishia. Tafsiri hii inaeleza kazi ya kishazi kwa uwazi; maana halisi zaidi imeonyeshwa katika tanbihi.
- source_word: הַיַּרְדֵּן
  choice: Mto Yordani
  rationale: Hili ndilo jina la kawaida la mto huu katika Kiswahili, na kutaja “Mto” huondoa utata.
