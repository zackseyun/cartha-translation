translation:
  language: sw
  text: Na miji iliyotengwa[a] kwa ajili ya wana wa Efraimu ndani ya urithi wa wana wa Manase—miji yote pamoja na vijiji vyake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliyotenganishwa.” Neno la Kiebrania huonyesha miji iliyowekwa kando kwa ajili ya Efraimu; ilikuwa ndani ya urithi wa Manase.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: miji
  rationale: עִיר humaanisha mji au mji mdogo; “miji” inafaa katika orodha za maeneo ya Yoshua na ni istilahi ya kawaida ya Kiswahili.
- source_word: הַמִּבְדָּלוֹת
  choice: iliyotengwa
  rationale: Kitenzi בדל huonyesha kutenganisha au kuweka kando. Katika muktadha wa ugawaji wa nchi, “iliyotengwa” huonyesha kwamba miji hii iliwekwa mahsusi kwa ajili ya Efraimu ingawa ilikuwa ndani ya urithi wa Manase.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: kwa ajili ya wana wa Efraimu
  rationale: בני kwa maana ya moja kwa moja ni “wana wa”; hapa ni usemi wa kikabila unaowataja watu wa Efraimu kwa ukoo wao.
- source_word: בְּתוֹךְ
  choice: ndani ya
  rationale: Hueleza wazi kuwa miji hiyo ilikuwa katika eneo lililokuwa sehemu ya urithi wa Manase.
- source_word: נַחֲלַת
  choice: urithi
  rationale: נחלה katika Yoshua hurejelea sehemu ya nchi iliyogawiwa kuwa milki ya kurithi; “urithi” huhifadhi dhana hiyo.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: wana wa Manase
  rationale: Huhifadhi muundo wa kikabila wa Kiebrania na kuendana na “wana wa Efraimu” katika sentensi hiyo.
- source_word: כָּל הֶעָרִים
  choice: miji hiyo yote
  rationale: כָּל huonyesha jumla ya miji iliyotajwa; kiashiria “hiyo” hufanya muhtasari huu uwe wa asili katika Kiswahili.
- source_word: וְחַצְרֵיהֶן
  choice: pamoja na vijiji vyake
  rationale: חָצֵר katika orodha za maeneo mara nyingi ni kijiji au makazi yasiyozungushiwa ukuta yaliyotegemea mji; “vijiji” ni tafsiri iliyo wazi kwa wasomaji wa sasa.
