  variant: Standard East African Swahili
source:
  edition: WLC
  text: מִ/תַּפּ֜וּחַ יֵלֵ֨ךְ הַ/גְּב֥וּל יָ֨מָּ/ה֙ נַ֣חַל קָנָ֔ה וְ/הָי֥וּ תֹצְאֹתָ֖י/ו הַ/יָּ֑מָּ/ה זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי אֶפְרַ֖יִם לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/008.yaml
  text: From Tappuah the border goes westward to the Brook of Kanah[a], and its end was at the sea[c][b]. This is the inheritance of the tribe of the sons of Ephraim according to their families.
translation:
  language: sw
  text: Kutoka Tapua, mpaka unaelekea magharibi hadi Bonde la Kana[a], na mwisho wake ulikuwa baharini. Huu ndio urithi wa kabila la wana wa Efraimu, kwa koo zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hadi Kijito cha Kana” au “hadi Wadi Kana.” Neno la Kiebrania linaweza kumaanisha bonde, kijito, au mkondo wa maji wa msimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתַּפּוּחַ
  choice: Kutoka Tapua
  rationale: Kihusishi מִן kinaonyesha mahali mpaka unapoanzia; jina la mahali limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: יֵלֵךְ הַגְּבוּל
  choice: mpaka unaelekea
  rationale: Katika maelezo ya mipaka, הלך pamoja na גְּבוּל hueleza mkondo au mwelekeo wa mpaka; usemi huu ni wa asili katika Kiswahili.
- source_word: יָמָּה
  choice: magharibi
  rationale: Umbo hili la kuelekeza, linalohusiana na 'bahari,' kwa kawaida humaanisha kuelekea magharibi katika maelezo ya mipaka ya nchi.
- source_word: נַחַל קָנָה
  choice: Bonde la Kana
  rationale: נַחַל inaweza kumaanisha bonde lenye kijito au mkondo wa maji wa msimu. 'Bonde' linaeleweka kwa urahisi na halidai kwamba maji hutiririka daima.
- source_word: וְהָיוּ תֹצְאֹתָיו הַיָּמָּה
  choice: na mwisho wake ulikuwa baharini
  rationale: תֹצְאֹתָיו katika kanuni za mipaka hueleza mwisho wa mpaka; Kiswahili cha umoja kinaendana kwa kawaida na mpaka unaotajwa.
- source_word: זֹאת נַחֲלַת מַטֵּה
  choice: Huu ndio urithi wa kabila
  rationale: Hii ni taarifa ya muhtasari kuhusu eneo lililogawiwa; מַטֵּה hapa ni kabila.
- source_word: בְנֵי אֶפְרַיִם
  choice: wana wa Efraimu
  rationale: Tafsiri hii inahifadhi usemi wa Kiebrania 'wana wa Efraimu,' ambao ni jina la kawaida la kikabila.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa kufuata koo zao
  rationale: Katika muktadha wa mgawanyo wa kikabila, מִשְׁפָּחוֹת hurejelea koo au makundi ya ukoo; 'koo' ni sahihi na ya kawaida kwa Kiswahili.
theological_decisions:
- issue: Jina la kikabila lenye jinsia katika בְנֵי אֶפְרַיִם
  choice: wana wa Efraimu
  alternative: wazao wa Efraimu
  rationale: Usemi wa asili ni 'wana wa Efraimu' na hutumika kama jina la kawaida la kabila; umehifadhiwa bila kuugeuza kimya kuwa usemi usio na jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Majina yametoholewa kama Tapua, Kana, na Efraimu. Tofauti na vidokezo vya Kiingereza vilivyopangiliwa vibaya, tanbihi imewekwa tu kwenye neno lenye mbadala halisi wa kileksika.
