  text: Then it went out from Bethel to Luz[a], and passed on to the border of the Arkites at Ataroth.
translation:
  language: sw
  text: Kisha mpaka huo ukatoka Betheli kuelekea Luzu, ukapita hadi kwenye mpaka wa Waarki, huko Atarothi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָצָא
  choice: Kisha mpaka huo ukatoka
  rationale: Kitenzi hicho kinaeleza kuendelea kwa mstari wa mpaka uliotajwa katika mstari uliotangulia; maneno “mpaka huo” yamewekwa wazi kwa Kiswahili cha kawaida.
- source_word: מִבֵּית אֵל
  choice: Betheli
  rationale: Ni umbo la jina la mahali linalotambulika katika matumizi ya kawaida ya Biblia ya Kiswahili.
- source_word: לוּזָה
  choice: kuelekea Luzu
  rationale: Herufi ya mwisho ya Kiebrania inaonyesha mwelekeo; “kuelekea” huhifadhi maana hiyo bila kulazimisha kwamba mstari uliingia au kufika katikati ya mji.
- source_word: וְעָבַר
  choice: ukaendelea
  rationale: Katika orodha ya njia ya mpaka, kitenzi hiki kinaonyesha mstari wa mpaka ukiendelea mbele, si lazima ukivuka kitu fulani.
- source_word: אֶל גְּבוּל
  choice: hadi mpakani mwa
  rationale: Huwasilisha kwa Kiswahili cha asili wazo la kufika kwenye mpaka wa eneo au watu fulani.
- source_word: הָאַרְכִּי
  choice: Waarki
  rationale: Ni jina la watu au ukoo; kiambishi “Wa-” kinaonyesha kundi la watu kwa Kiswahili, huku umbo la jina la Kiebrania likihifadhiwa.
- source_word: עֲטָרוֹת
  choice: Atarothi
  rationale: Ni unukuzi wa jina la mahali unaolingana na mazoea ya majina ya kibiblia katika Kiswahili.
