base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/005.yaml
  text: 'And the territory of the sons of Ephraim by their clans was as follows: the border of their inheritance on the east was Ataroth-addar[a], as far as Upper Beth-horon.'
translation:
  language: sw
  text: 'Eneo la wazao wa Efraimu kwa koo zao lilikuwa hivi: mpaka wa urithi wao upande wa mashariki ulikuwa Ataroth-Adari,[a] hadi Beth-horoni ya Juu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka wa urithi wao kuelekea mashariki ulikuwa Ataroth-Adari.” Kirai cha Kiebrania kinaweza kutafsiriwa kwa njia hii bila kubadili maana ya kijiografia.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל
  choice: eneo / mpaka
  rationale: Neno hili limetumiwa mara mbili. Mara ya kwanza linamaanisha kwa upana eneo la kabila; mara ya pili linaonyesha hasa mstari wa mpaka unaofuatwa kwa majina ya mahali.
- source_word: בְּנֵי אֶפְרַיִם
  choice: wazao wa Efraimu
  rationale: Katika muktadha wa kikabila, usemi huu unawahusu watu waliotokana na Efraimu; 'wazao' ni Kiswahili cha kawaida na hudumisha maana ya nasaba bila kutafsiri nahau ya Kiebrania kwa ugumu.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kwa koo zao
  rationale: Katika ugawaji wa ardhi kwa makabila, neno hili linaonyesha migawanyiko ya koo ndani ya kabila.
- source_word: נַחֲלָתָם
  choice: urithi wao
  rationale: Neno hili katika Yoshua humaanisha ardhi waliyopewa iwe milki yao ya kurithi, na 'urithi' hudumisha maana hiyo.
- source_word: מִזְרָחָה
  choice: upande wa mashariki
  rationale: Umbo la kuelekeza linaonyesha upande wa mashariki wa mpaka; usemi huu ni wa kawaida katika maelezo ya kijiografia ya Kiswahili.
- source_word: עַטְרוֹת אַדָּר
  choice: Atarothi-adari
  rationale: Jina la mahali limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili, huku kistari kikionyesha kuwa ni jina ambatani.
- source_word: עַד
  choice: hadi
  rationale: Katika maelezo ya mipaka, 'hadi' huonyesha mwisho wa eneo au mstari unaoelezwa.
- source_word: בֵּית חוֹרֹן עֶלְיוֹן
  choice: Beth-horoni ya Juu
  rationale: Kirai hiki hutofautisha mahali hapa na Beth-horoni ya Chini; mpangilio huu ni wa asili katika Kiswahili.
