  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Nomino za makundi zimetafsiriwa kwa wingi wa kawaida wa Kiswahili: “Wakanaani” na “Waefraimu.” Muundo wa matukio umehifadhiwa bila kuufanya mstari utoe hukumu ya kitheolojia isiyotajwa wazi.'
