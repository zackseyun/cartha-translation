base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/010.yaml
  text: But they did not drive out the Canaanites who lived in Gezer, so the Canaanites have lived in the midst of Ephraim to this day and became forced laborers.
translation:
  language: sw
  text: Lakini hawakuwafukuza Wakanaani waliokuwa wakiishi Gezeri. Wakanaani wakaendelea kuishi miongoni mwa Waefraimu hadi leo, wakawa wafanyakazi wa kulazimishwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרִישׁוּ
  choice: hawakuwafukuza
  rationale: Kitenzi hiki katika muktadha wa kuiteka nchi kina maana ya kuwaondoa au kuwafukuza wakaaji; tafsiri hii ni ya kawaida na wazi kwa wasomaji wa Kiswahili.
- source_word: בְּקֶרֶב אֶפְרַיִם
  choice: miongoni mwa Waefraimu
  rationale: Inahifadhi wazo la Wakanaani kuendelea kukaa ndani ya jamii au eneo la Efraimu.
- source_word: לְמַס עֹבֵד
  choice: wafanyakazi wa kulazimishwa
  rationale: Kirai hiki kinaonyesha watu waliowekwa chini ya kazi ya lazima kama ushuru; tafsiri hii inaeleza hali hiyo kwa Kiswahili cha kawaida bila kuongeza maelezo yasiyo katika mstari.
