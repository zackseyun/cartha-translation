base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/001.yaml
  text: And the lot came out for the sons of Joseph from the Jordan at Jericho[a], to the waters of Jericho on the east, through the wilderness[b], going up from Jericho into the hill country of Bethel.
translation:
  language: sw
  text: 'Kura ikatoka kwa wazao wa Yosefu: kutoka Yordani upande wa Yeriko[a], hadi kwenye maji ya Yeriko[b] upande wa mashariki, kupitia nyikani, ikipanda kutoka Yeriko kuingia katika nchi ya vilima ya Betheli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kura ikawa ya wazao wa Yosefu.” Kiebrania kinasema kihalisi “kura ikatoka,” katika muktadha wa kugawa nchi kwa kura.
    reason: lexical_alternative
  - marker: b
    text: “Maji ya Yeriko” huenda yakamaanisha chemchemi au chanzo cha maji cha Yeriko.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ikatoka
  rationale: Kitenzi יצא kimsingi humaanisha ‘kutoka.’ Katika muktadha wa kugawa nchi kwa kura, ‘kura ikatoka’ huhifadhi taswira ya Kiebrania bila kuibadili kimyakimya kuwa ‘ikaangukia.’
- source_word: הַגּוֹרָל
  choice: kura
  rationale: גורל ni kura iliyotumiwa kuamua mgao; ‘kura’ ni neno la kawaida na la moja kwa moja katika Kiswahili.
- source_word: לִבְנֵי יוֹסֵף
  choice: kwa ajili ya wazao wa Yosefu
  rationale: Ingawa בני ni ‘wana wa,’ hapa inarejelea kwa pamoja makabila yaliyotokana na Yosefu. ‘Wazao wa Yosefu’ ni ya asili zaidi na huepuka kudokeza wana wake wa moja kwa moja pekee.
- source_word: מִיַּרְדֵּן יְרִיחוֹ
  choice: kutoka Yordani karibu na Yeriko
  rationale: Kirai kinaonyesha mwanzo wa mpaka kwenye Mto Yordani katika eneo la Yeriko. ‘Karibu na Yeriko’ huonyesha uhusiano wa kijiografia bila kudai kuwa mto ulikuwa ndani ya mji.
- source_word: לְמֵי יְרִיחוֹ
  choice: hadi kwenye maji ya Yeriko
  rationale: מי ni wingi au nomino ya mkusanyiko, ‘maji.’ Tafsiri hii inadumisha kutokuwa na uhakika kama yanamaanisha chemchemi moja au vyanzo vya maji kwa ujumla.
- source_word: מִזְרָחָה
  choice: upande wa mashariki
  rationale: Hutoa mwelekeo wa mahali kwa Kiswahili cha kawaida katika maelezo ya mpaka.
- source_word: הַמִּדְבָּר
  choice: nyikani
  rationale: מדבר ni nchi kame, pori, au nyika, si lazima jangwa la mchanga. ‘Nyika’ linafaa katika jiografia hii na ni la kawaida katika sajili ya kibiblia.
- source_word: עֹלֶה
  choice: ikipanda
  rationale: Hushika hali ya kitenzi-shirikishi na mwendo wa kupanda kutoka uwanda wa Yeriko kuelekea nyanda za juu.
- source_word: בָּהָר
  choice: kuingia katika nchi ya vilima
  rationale: הר hapa inaelekea kumaanisha eneo la nyanda za juu, si mlima mmoja. ‘Nchi ya vilima’ huwasilisha maana hiyo ya kijiografia.
- source_word: בֵּית אֵל
  choice: Betheli
  rationale: Hili ni umbo la jina la mahali lililozoeleka katika Biblia za Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mpaka umefanywa kuwa wa asili kwa kutumia ‘kupitia nyikani,’ huku mfuatano wa maeneo na mwendo wa kupanda ukihifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
