base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/015.yaml
  text: And they came to the sons of Reuben[a], and to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead, and they spoke with them, saying[b],
translation:
  language: sw
  text: Wakafika kwa wana wa Reubeni, kwa wana wa Gadi, na kwa nusu ya kabila la Manase, katika nchi ya Gileadi[a], wakazungumza nao, wakisema:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye nchi ya Gileadi.” Kihusishi cha Kiebrania kinaweza kusomwa kwa maana ya mwelekeo, ingawa hapa yaelekea kinaonyesha mahali walipofika na kuwakuta makabila ya mashariki.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakawaambia hivi:”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Wakafika
  rationale: Kitenzi בוא katika mfululizo wa masimulizi kinaonyesha kuja au kufika. “Wakafika” ni cha kawaida katika Kiswahili na kinaweka wazi kuwa walifika walikokuwa makabila ya mashariki bila kuongeza maana isiyokuwamo.
- source_word: בְּנֵי
  choice: wana wa
  rationale: Katika majina ya kikabila, בְּנֵי ni usemi wa kawaida unaowataja watu wa ukoo au kabila fulani. “Wana wa” hudumisha muundo huo wa Kiebrania na ni usemi unaoeleweka katika lugha ya Biblia ya Kiswahili.
- source_word: חֲצִי שֵׁבֶט
  choice: nusu ya kabila
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya jina la sehemu ya kabila la Manase iliyokaa upande huu wa Yordani.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: katika nchi ya Gileadi
  rationale: Ingawa אֶל kwa kawaida huonyesha mwelekeo (“kwenda kwenye”), hapa kirai kinafafanua mahali walipowakuta watu wa makabila hayo. “Katika nchi ya Gileadi” ni Kiswahili cha kawaida na huhifadhi uwezekano wa maana ya mahali; maana ya mwelekeo imewekwa katika tanbihi.
- source_word: וַיְדַבְּרוּ אִתָּם
  choice: wakazungumza nao
  rationale: Muundo דבר pamoja na אֵת unaweza kumaanisha kuzungumza pamoja na mtu, si kumhutubia tu. “Wakazungumza nao” hudumisha hisia hiyo bila kudokeza zaidi kuhusu urefu au namna ya mazungumzo.
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Huu ni usemi wa Kiebrania unaotanguliza maneno ya moja kwa moja katika mstari unaofuata. “Wakisema” huhifadhi kiungo hicho cha kisimulizi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaofaa masimulizi ya Biblia. Majina “Reubeni,” “Gadi,” “Manase,” na “Gileadi” yanafuata maumbo yaliyozoeleka katika Biblia za Kiswahili. Marudio ya “kwa” yanahifadhi mfuatano wa makundi matatu katika Kiebrania, huku sentensi ikibaki wazi na ya kawaida.
