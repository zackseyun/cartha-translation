  rationale: The revision preserves the Hebrew’s conditional alternatives and its use of “and” between the burnt offering and grain offering. It also corrects the final imprecatory clause into idiomatic Standard East African Swahili while retaining Yahweh’s emphatic role as the one who calls them to account.
