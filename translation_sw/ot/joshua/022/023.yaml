review_pass:
  verdict: revise
  source_fidelity: The principal sacrificial terms and the conjunction between the burnt offering and grain offering accurately reflect the Hebrew. The repeated וְאִם introduces a further conditional alternative, however, and should not be reduced to a mere alternative purpose of the first altar-building clause.
  naturalness: 'The draft is generally clear, but “Yahweh mwenyewe na atutake hesabu” is not natural Standard East African Swahili: after the optative particle na, the subjunctive form should be used (adai), and “dai hesabu” is the idiomatic expression.'
  terminology: “Madhabahu,” “sadaka ya kuteketezwa,” “sadaka ya nafaka,” and “dhabihu za amani” are suitable formal, comprehensible renderings. “Yahweh” consistently preserves the divine name.
  issues:
  - severity: medium
    issue: The second conditional alternative lacks an explicit conditional construction.
    rationale: וְאִם introduces “or if [we built it] to offer ...”; “au ili kutoa” can instead sound like another purpose for the altar in the first clause. Repeating the conditional and referring back to the altar makes the alternatives clear.
  - severity: high
    issue: “na atutake hesabu” has an incorrect/nonstandard verbal form and collocation.
    rationale: The imprecatory/optative construction with na calls for subjunctive “adai,” and Kiswahili idiom is “kudai hesabu,” not “kutaka hesabu.”
  revised_text: ikiwa tulijijengea madhabahu ili kuacha kumfuata Yahweh, au ikiwa tulijenga madhabahu hiyo ili kutoa juu yake sadaka ya kuteketezwa na sadaka ya nafaka, au ikiwa tulijenga madhabahu hiyo ili kutoa juu yake dhabihu za amani[a], Yahweh mwenyewe na atudai hesabu kwa hilo.[b]
  revised_footnotes:
  - marker: a
    text: “Dhabihu za amani” zinaweza pia kuitwa “dhabihu za ushirika.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Yahweh mwenyewe atatudai hesabu kwa hilo.”
    reason: alternative_reading
  revision_rationale: The revision preserves the Hebrew’s conditional alternatives and its use of “and” between the burnt offering and grain offering. It also corrects the final imprecatory clause into idiomatic Standard East African Swahili while retaining Yahweh’s emphatic role as the one who calls them to account.
