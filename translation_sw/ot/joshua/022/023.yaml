  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: לִ/בְנ֥וֹת לָ֨/נוּ֙ מִזְבֵּ֔חַ לָ/שׁ֖וּב מֵ/אַחֲרֵ֣י יְהוָ֑ה וְ/אִם לְ/הַעֲל֨וֹת עָלָ֜י/ו עוֹלָ֣ה וּ/מִנְחָ֗ה וְ/אִם לַ/עֲשׂ֤וֹת עָלָי/ו֙ זִבְחֵ֣י שְׁלָמִ֔ים יְהוָ֖ה ה֥וּא יְבַקֵּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/023.yaml
  text: if we built for ourselves an altar to turn away from following Yahweh[a], or if to offer on it burnt offering or grain offering, or if to make on it sacrifices of peace offerings[b], may Yahweh himself require it.
translation:
  language: sw
  text: ikiwa tulijijengea madhabahu ili kuacha kumfuata Yahweh, au ikiwa tulijenga madhabahu hiyo ili kutoa juu yake sadaka ya kuteketezwa na sadaka ya nafaka, au ikiwa tulijenga madhabahu hiyo ili kutoa juu yake dhabihu za amani[a], Yahweh mwenyewe na atudai hesabu kwa hilo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dhabihu za amani” zinaweza pia kuitwa “dhabihu za ushirika.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Yahweh mwenyewe atatudai hesabu kwa hilo.”
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנוֹת לָנוּ מִזְבֵּחַ
  choice: ikiwa tulijijengea madhabahu
  rationale: 'Kiambishi לִ cha kitenzi-jina kinaeleweka kwa kutegemea kiapo cha mstari uliotangulia kama sharti: ‘ikiwa’. ‘Tulijijengea’ kinahifadhi maana ya לָנוּ na kutoa Kiswahili cha kawaida.'
- source_word: לָשׁוּב מֵאַחֲרֵי יְהוָה
  choice: ili tuache kumfuata Yahweh
  rationale: Muundo שׁוּב מֵאַחֲרֵי unaonyesha kugeuka na kuacha kwenda nyuma ya mtu; tafsiri hii inahifadhi wazo la kuacha ufuasi bila kuongeza maelezo ya kimadhehebu.
- source_word: וְאִם לְהַעֲלוֹת עָלָיו עוֹלָה וּמִנְחָה
  choice: au ili kutoa juu yake sadaka ya kuteketezwa na sadaka ya nafaka
  rationale: הַעֲלוֹת ni lugha ya kutoa dhabihu, עוֹלָה ni sadaka ya kuteketezwa, na מִנְחָה katika muktadha huu ni sadaka ya nafaka. Kiunganishi וּ- kimetafsiriwa ‘na’ kulingana na maandishi ya Kiebrania.
- source_word: וְאִם לַעֲשׂוֹת עָלָיו זִבְחֵי שְׁלָמִים
  choice: au ili kutoa juu yake dhabihu za amani
  rationale: Katika lugha ya ibada, עָשָׂה hapa ni kutoa dhabihu. ‘Dhabihu za amani’ linaakisi זִבְחֵי שְׁלָמִים huku tanbihi ikihifadhi tafsiri nyingine inayowezekana.
- source_word: יְהוָה הוּא יְבַקֵּשׁ
  choice: Yahweh mwenyewe na atutake hesabu kwa hilo
  rationale: הוּא ina mkazo unaowakilishwa na ‘mwenyewe’. Katika kiapo hiki יְבַקֵּשׁ ni kudai uwajibikaji au kuadhibu; muundo ‘na atutake’ unaonyesha nguvu ya laana ya kujitakia badala ya kuitoa tu kama taarifa ya wakati ujao.
theological_decisions:
- issue: Jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi yana jina la agano יְהוָה; ‘Yahweh’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Nguvu ya יְבַקֵּשׁ mwishoni mwa kiapo
  choice: Yahweh mwenyewe na atutake hesabu kwa hilo
  alternative: Yahweh mwenyewe atatutaka hesabu kwa hilo
  rationale: Muktadha ni kiapo chenye laana ya kujitakia. ‘Na atutake’ huhifadhi nguvu hiyo, lakini wakati ujao wa kawaida pia unawezekana kisarufi na umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeachwa kuanza kwa herufi ndogo kwa sababu mstari huu unaendeleza kiapo kilichoanza katika mstari uliotangulia. Lugha ya dhabihu ni wazi kwa msomaji wa kawaida bila kufuta istilahi muhimu za Kiebrania.
