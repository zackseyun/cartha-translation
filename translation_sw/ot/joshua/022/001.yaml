lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Ni kiashiria cha wakati kinachoendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida.
- source_word: יִקְרָא
  choice: akawaita
  rationale: Kitenzi hiki humaanisha kuita au kuwaita waje; hapa ‘akawaita’ ni cha asili na hakiongezi uzito wa lazima wa amri rasmi.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Hili ni umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: לָרֽאוּבֵנִי
  choice: Wareubeni
  rationale: Nomino ya nasaba iliyo katika umoja wa Kiebrania inawakilisha kundi lote; wingi wa Kiswahili unaonyesha maana hiyo kwa kawaida.
- source_word: וְלַגָּדִי
  choice: Wagadi
  rationale: Kama ilivyo kwa Wareubeni, umbo la nasaba la Kiebrania linatumika kwa maana ya pamoja, hivyo limetafsiriwa kwa wingi.
- source_word: וְלַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: na nusu ya kabila la Manase
  rationale: מַטֶּה hapa ni kabila, na kirai hiki hurejelea nusu ya kabila la Manase; muundo huu ni wazi na wa kawaida katika Kiswahili.
