base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/017.yaml
  text: Was the iniquity of Peor too little for us[a], from which we have not cleansed ourselves to this day[b], and the plague came upon the congregation of Yahweh?
translation:
  language: sw
  text: Je, uovu wa Peori[b] ulikuwa mdogo sana kwetu[a], ambao hadi leo hatujajitakasa kutokana na uovu huo, na pigo lililipata kusanyiko la Yahwe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatia ya Peori.” Neno la Kiebrania linaweza kumaanisha uovu, hatia, au matokeo ya hatia.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kina “Peori”; linganisha usemi kamili “Baal-peori” katika vifungu vingine vinavyohusiana.
    reason: cross_reference
lexical_decisions:
- source_word: הַמְעַט לָנוּ
  choice: ulikuwa jambo dogo sana kwetu?
  rationale: Muundo huu ni swali la kejeli lenye maana ya kuuliza kama kosa hilo halikutosha kuwa onyo; Kiswahili hiki ni cha asili na kinadumisha nguvu ya karipio.
- source_word: עֲוֺן
  choice: uovu
  rationale: Neno linaweza kumaanisha uovu, hatia, au matokeo ya hatia. “Uovu” hapa linatanguliza kosa la kimaadili bila kufuta uwezekano wa maana ya hatia, ambao umeelezwa katika tanbihi.
- source_word: פְּעוֹר
  choice: Peori
  rationale: Chanzo kinasema Peori pekee, si Baal-Peori; kwa hiyo umbo kamili kutoka vifungu vingine halijaingizwa.
- source_word: אֲשֶׁר לֹא הִטַּהַרְנוּ מִמֶּנּוּ
  choice: Hadi leo hatujajitakasa kutokana nao
  rationale: “Hatujajitakasa” inadumisha hali ya kujirejelea ya kitenzi cha Kiebrania, na “kutokana nao” inaonyesha kuondolewa kwa unajisi wa uovu huo.
- source_word: וַיְהִי הַנֶּגֶף
  choice: ingawa pigo liliupata
  rationale: '“Pigo” linafaa kwa adhabu mbaya iliyolipata taifa. “Ingawa” linaonyesha uhusiano wa kimantiki katika swali: kosa bado halijaondolewa, licha ya pigo lililokwisha kutokea.'
- source_word: בַּעֲדַת יְהוָה
  choice: kusanyiko la Yahwe
  rationale: “Kusanyiko” linaonyesha jumuiya ya agano, na jina la Mungu limetafsiriwa kwa kutamkwa kama Yahwe.
theological_decisions:
- issue: Maana ya עֲוֺן katika tukio la Peori
  choice: uovu
  alternative: hatia; adhabu ya uovu
  rationale: Muktadha unarejelea kosa la Israeli na unajisi wake unaodumu. Tafsiri kuu haitakiwi kulifungia neno katika maana ya hatia au adhabu pekee.
- issue: Uhusiano wa וַיְהִי הַנֶּגֶף na kifungu kilichotangulia
  choice: ingawa pigo liliupata
  alternative: na pigo liliupata
  rationale: Kiunganishi cha Kiebrania chenyewe ni pana, lakini muktadha wa swali la karipio unaonyesha tofauti kati ya kutotakaswa hadi sasa na pigo lililokwisha kulipata kusanyiko. “Ingawa” huifanya hoja ieleweke kwa Kiswahili; mbadala wa karibu zaidi umehifadhiwa katika tanbihi.
- issue: Jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Jina la agano limetolewa moja kwa moja kama Yahwe badala ya kubadilishwa kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Peori” linafuata matumizi ya kawaida ya majina ya kibiblia katika Kiswahili; “kusanyiko” linadumisha maana ya jumuiya ya agano bila kuwa la dhehebu fulani.
