  text: וַ/עֲשָׂרָ֤ה נְשִׂאִים֙ עִמּ֔/וֹ נָשִׂ֨יא אֶחָ֜ד נָשִׂ֤יא אֶחָד֙ לְ/בֵ֣ית אָ֔ב לְ/כֹ֖ל מַטּ֣וֹת יִשְׂרָאֵ֑ל וְ/אִ֨ישׁ רֹ֧אשׁ בֵּית אֲבוֹתָ֛/ם הֵ֖מָּה לְ/אַלְפֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/014.yaml
  text: and with him ten leaders[a], one leader for each ancestral house from all the tribes of Israel; and each of them was the head of his ancestral house among the thousands of Israel.
translation:
  language: sw
  text: Na pamoja naye walikuwapo viongozi kumi—kiongozi mmoja kwa kila familia ya upande wa baba kutoka katika makabila yote ya Israeli; kila mmoja wao alikuwa mkuu wa familia yake ya upande wa baba miongoni mwa maelfu[a] ya Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “maelfu ya Israeli.” Hapa huenda “maelfu” yanamaanisha vitengo vya koo au makundi makubwa ya kifamilia katika Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשִׂאִים / נָשִׂיא
  choice: viongozi / kiongozi
  rationale: Katika muktadha huu neno hilo linamaanisha watu wenye cheo cha uongozi katika mpangilio wa kikabila; “viongozi” ni Kiswahili cha sasa, wazi na chenye hadhi.
- source_word: עִמּוֹ
  choice: pamoja naye
  rationale: Kirai hiki kinamrejelea Finehasi aliyetajwa katika mstari uliotangulia.
- source_word: נָשִׂיא אֶחָד נָשִׂיא אֶחָד
  choice: kiongozi mmoja kutoka katika kila
  rationale: Urudiaji wa Kiebrania una maana ya ugawaji, yaani mwakilishi mmoja kutoka kila kitengo cha kifamilia.
- source_word: לְבֵית אָב
  choice: katika kila jamaa ya ukoo wa baba
  rationale: בֵּית אָב ni istilahi ya ukoo na utawala. Tafsiri hii inaonyesha jamaa inayotokana na mstari wa baba bila kutumia usemi usio wa kawaida wa “nyumba ya baba”.
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: kutoka katika makabila yote ya Israeli
  rationale: Kirai hiki kinaonyesha kwamba viongozi hao waliwakilisha makabila ya Israeli.
- source_word: וְאִישׁ
  choice: kila mmoja wao
  rationale: אִישׁ hapa limetumiwa kwa maana ya ugawaji kuhusu wale viongozi kumi; “kila mmoja wao” ni ya kawaida na sahihi katika Kiswahili.
- source_word: רֹאשׁ בֵּית אֲבוֹתָם
  choice: mkuu wa jamaa ya mababu zake
  rationale: “Mkuu” huhifadhi maana ya cheo cha רֹאשׁ, na “jamaa ya mababu zake” huwasilisha muundo wa ukoo unaokusudiwa.
- source_word: לְאַלְפֵי יִשְׂרָאֵל
  choice: miongoni mwa maelfu ya Israeli
  rationale: “Maelfu” hufuata maana ya msingi ya אַלְפֵי na kuhifadhi uwezekano wa neno hilo kumaanisha ama makundi ya watu elfu moja ama vitengo vya ukoo; tanbihi inaeleza matumizi ya kijamii yanayowezekana.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi bila kuondoa utata halisi wa neno אַלְפֵי; alama ya tanbihi imewekwa moja kwa moja baada ya “maelfu” inayohusika.
