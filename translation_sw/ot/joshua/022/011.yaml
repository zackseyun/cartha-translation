  text: וַ/יִּשְׁמְע֥וּ בְנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הִנֵּ֣ה בָנ֣וּ בְנֵֽי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה אֶת הַ/מִּזְבֵּ֗חַ אֶל מוּל֙ אֶ֣רֶץ כְּנַ֔עַן אֶל גְּלִילוֹת֙ הַ/יַּרְדֵּ֔ן אֶל עֵ֖בֶר בְּנֵ֥י יִשְׂרָאֵֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/011.yaml
  text: And the sons of Israel heard it said[a], “Look, the sons of Reuben and the sons of Gad and the half-tribe of Manasseh have built the altar opposite the land of Canaan, in the region of the Jordan[d][c][b], on the side of the sons of Israel.”
translation:
  language: sw
  text: 'Waisraeli wakasikia habari hii[a]: “Tazama, Wareubeni, Wagadi, na nusu ya kabila la Manase wamejenga madhabahu hiyo mkabala na nchi ya Kanaani[b], katika maeneo ya Yordani[c], upande wa Waisraeli[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli wakasikia, ikisemwa,” kwa kufuata kwa karibu zaidi mtindo wa taarifa wa Kiebrania.
    reason: lexical_alternative
  - marker: b
    text: Au “ikielekeana na nchi ya Kanaani.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “maeneo/wilaya za Yordani”; maana kamili ya kijiografia ya maneno hayo haijulikani kwa hakika.'
    reason: cultural_note
  - marker: d
    text: Au “ng’ambo kutoka kwa Waisraeli” au “upande unaowaelekea Waisraeli.” Maneno haya ya mwisho ya kijiografia ni magumu, na huenda yakamaanisha upande wa magharibi wa Yordani uliokuwa wa Waisraeli au mahali palipokuwa mkabala nao.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ בְנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Waisraeli wakasikia habari hii
  rationale: Huwasilisha kwa Kiswahili cha kawaida utangulizi wa Kiebrania wa taarifa iliyosikiwa. Neno לֵאמֹר linaanzisha maudhui ya taarifa; tanbihi inadumisha uwezekano wa tafsiri ya karibu zaidi na muundo wa Kiebrania.
- source_word: הִנֵּה
  choice: Tazama
  rationale: Ni neno la sasa na lenye hadhi linalovuta fikira za msikilizaji kwenye taarifa inayofuata.
- source_word: בְנֵי רְאוּבֵן וּבְנֵי גָד
  choice: Wareubeni, Wagadi
  rationale: Majina haya ya makundi ya kikabila ni ya asili na wazi katika Kiswahili kuliko kurudia kihalisi ‘wana wa,’ bila kupoteza maana ya ukoo.
- source_word: בָנוּ
  choice: wamejenga
  rationale: Kauli timilifu inaeleza tendo lililokamilika lenye umuhimu kwa hali ya sasa; wakati timilifu wa Kiswahili unafaa.
- source_word: הַמִּזְבֵּחַ
  choice: madhabahu hiyo
  rationale: Kiwakilishi ‘hiyo’ kinaonyesha uainisho wa nomino katika Kiebrania na madhabahu maalumu inayozungumziwa katika taarifa.
- source_word: אֶל מוּל אֶרֶץ כְּנַעַן
  choice: mkabala na nchi ya Kanaani
  rationale: ‘Mkabala na’ huhifadhi uhusiano wa kijiografia wa kuwa kuelekeana au upande unaolingana bila kuamua umbali au mwelekeo kwa usahihi usiokuwapo katika chanzo.
- source_word: גְּלִילוֹת הַיַּרְדֵּן
  choice: maeneo ya Yordani
  rationale: גְּלִילוֹת inaweza kumaanisha maeneo au wilaya; ‘maeneo’ ni ya kawaida na haiweki mpaka maalumu usiohakikishwa.
- source_word: אֶל עֵבֶר בְּנֵי יִשְׂרָאֵל
  choice: upande wa Waisraeli
  rationale: Huhifadhi neno la uhusiano wa kijiografia ‘upande’ na sintaksia yenye utata bila kulazimisha maana ya umiliki au ya kuwa ng’ambo.
