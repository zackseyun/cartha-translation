base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/013.yaml
  text: Then the sons of Israel sent Phinehas son of Eleazar the priest to the sons of Reuben[a], to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead.
translation:
  language: sw
  text: Ndipo wana wa Israeli wakamtuma Finehasi mwana wa Eleazari kuhani kwa wana wa Reubeni[a], kwa wana wa Gadi, na kwa nusu ya kabila la Manase, katika nchi ya Gileadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa lugha ya kawaida zaidi, “Waisraeli wakamtuma Finehasi ... kwa Wareubeni, Wagadi, na nusu ya kabila la Manase.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Ndipo ... wakamtuma
  rationale: Waw-consecutive inaendeleza simulizi; “Ndipo” huonyesha mfuatano kwa Kiswahili cha kawaida, na kiambishi “-m-” kinaonyesha Finehasi ndiye aliyetumwa.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi tamathali ya Kiebrania “wana wa Israeli” badala ya kuibadili moja kwa moja kuwa jina la kijamii.
- source_word: אֶל
  choice: kwa
  rationale: Katika muktadha wa kumtuma mwakilishi, kihusishi kinaonyesha watu aliotumwa kwao.
- source_word: בְּנֵי רְאוּבֵן
  choice: wana wa Reubeni
  rationale: Tafsiri wazi ya muundo wa Kiebrania, huku mbadala wa kawaida zaidi ukiwekwa katika tanbihi.
- source_word: בְּנֵי גָד
  choice: wana wa Gadi
  rationale: Hufuata kwa uthabiti muundo wa Kiebrania “wana wa” unaotumiwa pia kwa Reubeni.
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: nusu ya kabila la Manase
  rationale: Ni Kiswahili cha kawaida na sahihi kinachoonyesha kwamba sehemu inayozungumziwa ni nusu ya kabila hilo.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: katika nchi ya Gileadi
  rationale: Hapa kishazi kinataja mahali walipokuwapo watu waliolengwa na ujumbe, si lazima safari nyingine tofauti; “katika” hutoa maana hiyo kwa kawaida.
- source_word: אֶת פִּינְחָס
  choice: Finehasi
  rationale: Alama ya yambwa אֶת haitafsiriwi; jina limetolewa kwa umbo linalotambulika katika Kiswahili.
- source_word: בֶּן אֶלְעָזָר
  choice: mwana wa Eleazari
  rationale: Hutoa moja kwa moja uhusiano wa kifamilia unaoonyeshwa na Kiebrania.
- source_word: הַכֹּהֵן
  choice: kuhani
  rationale: Nomino hii hutaja cheo cha kuhani. Kwa mpangilio wa Kiebrania, inaelekea kumtambulisha Eleazari kuwa kuhani, hivyo “Eleazari kuhani” huhifadhi uhusiano huo bila kuongeza maneno.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “wana wa” umehifadhiwa ili kuonyesha usemi wa Kiebrania; tanbihi inatoa majina ya kijamii yaliyo ya kawaida zaidi.
