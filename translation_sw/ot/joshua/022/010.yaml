  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אֶל גְּלִיל֣וֹת הַ/יַּרְדֵּ֔ן אֲשֶׁ֖ר בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יִּבְנ֣וּ בְנֵי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִ֣י שֵׁבֶט֩ הַֽ/מְנַשֶּׁ֨ה שָׁ֤ם מִזְבֵּ֨חַ֙ עַל הַ/יַּרְדֵּ֔ן מִזְבֵּ֥חַ גָּד֖וֹל לְ/מַרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/010.yaml
  text: When they came to the region of the Jordan that is in the land of Canaan[b][a], the sons of Reuben and the sons of Gad and the half-tribe of Manasseh built there an altar by the Jordan—an altar great in appearance.
translation:
  language: sw
  text: Walipofika katika eneo la Yordani lililo katika nchi ya Kanaani[a], wana wa Reubeni, wana wa Gadi, na nusu ya kabila la Manase wakajenga huko madhabahu kando ya Yordani—madhabahu kubwa yenye kuonekana wazi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wilaya” au “mipaka” ya Yordani.
    reason: lexical_alternative
  - marker: b
    text: Au “madhabahu kubwa ya kutazamwa,” yaani, madhabahu iliyokuwa yenye kutokeza kwa mwonekano wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּלִילוֹת
  choice: eneo
  rationale: Neno hilo humaanisha eneo au wilaya inayozunguka mahali fulani. “Eneo” ni Kiswahili cha kawaida na cha wazi, huku tanbihi ikihifadhi uwezekano wa “wilaya” au “mipaka.”
- source_word: וַיָּבֹאוּ אֶל
  choice: Walipofika katika
  rationale: Muundo huu unaunganisha kufika kwao na tendo linalofuata kwa mtiririko wa kawaida wa simulizi ya Kiswahili.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: lililo katika nchi ya Kanaani
  rationale: Huhifadhi kishazi bainishi cha Kiebrania kinachoeleza eneo husika la Yordani.
- source_word: בְנֵי רְאוּבֵן
  choice: wana wa Reubeni
  rationale: Huhifadhi nahau ya kifamilia na kikabila ya maandishi ya Kiebrania bila kuibadili kuwa jina la kundi.
- source_word: בְנֵי גָד
  choice: wana wa Gadi
  rationale: Huhifadhi ulinganifu na “wana wa Reubeni” pamoja na muundo wa chanzo.
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: nusu ya kabila la Manase
  rationale: Ni tafsiri wazi na ya kawaida ya kirai hicho cha Kiebrania.
- source_word: מִזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa jengo la ibada linalotajwa hapa.
- source_word: עַל הַיַּרְדֵּן
  choice: kando ya Yordani
  rationale: Katika muktadha wa kijiografia, עַל huonyesha ukaribu; “kando ya” ni ya asili na haimaanishi kuwa madhabahu ilikuwa ndani au juu ya mto.
- source_word: גָּדוֹל
  choice: kubwa
  rationale: Huhifadhi maana ya ukubwa bila kuingiza mapema hukumu kuhusu kusudi au fahari ya madhabahu.
- source_word: לְמַרְאֶה
  choice: yenye kuonekana kwa mbali
  rationale: Kirai kinaeleza madhabahu kuwa kitu kikubwa na dhahiri kwa macho. Tafsiri hii inaeleweka kwa urahisi, huku tanbihi ikihifadhi tafsiri ya karibu zaidi, “kubwa kwa kuonekana.”
theological_decisions:
- issue: Uwezekano wa kudokeza madhabahu pinzani ya ibada
  choice: Kueleza tu kwamba walijenga madhabahu kubwa yenye kuonekana kwa mbali
  alternative: Kusema walijenga madhabahu ya kuvutia au madhabahu pinzani
  rationale: Aya hii bado haitaji kusudi la dhabihu wala haitoi hukumu kuhusu nia yao. Tafsiri inaacha mvutano huo wa simulizi bila kuamua mapema kwamba madhabahu hiyo ilikuwa halali au pinzani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kikabila “wana wa” umehifadhiwa kwa ukaribu na chanzo, na sentensi imepangwa kwa mtiririko wa kawaida wa simulizi.
