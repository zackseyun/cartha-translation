  yaml_path: translation/ot/joshua/022/021.yaml
  text: 'Then the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh answered and spoke to the heads of the clans of Israel:'
translation:
  language: sw
  text: 'Ndipo wana wa Reubeni, wana wa Gadi, na nusu ya kabila la Manase wakajibu, wakasema na wakuu wa maelfu ya Israeli[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “wakuu wa maelfu ya Israeli”; huenda maana yake ni viongozi wa koo au wa makundi ya kikabila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: wakajibu
  rationale: Kitenzi ענה katika simulizi ya mazungumzo huonyesha jibu kwa yaliyotangulia; “wakajibu” ni cha kawaida na huhifadhi uhusiano huo.
- source_word: בְּנֵי רְאוּבֵן
  choice: wana wa Reubeni
  rationale: Huhifadhi usemi wa ukoo wa Kiebrania badala ya kuugeuza kuwa jina la kundi la kikabila.
- source_word: וּבְנֵי גָד
  choice: wana wa Gadi
  rationale: Huhifadhi muundo halisi wa kifamilia na kuendana na “wana wa Reubeni.”
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: nusu ya kabila la Manase
  rationale: Ni Kiswahili cha kawaida na sahihi kwa kirai hicho cha Kiebrania.
- source_word: וַיְדַבְּרוּ
  choice: na kuwaambia
  rationale: דבר ni “kunena/kusema”; katika muktadha huu, ambapo walengwa wameainishwa, “kuwaambia” ni ya asili zaidi kwa Kiswahili huku ikihifadhi kitenzi tofauti na “wakajibu.”
- source_word: אֶת רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: viongozi wa maelfu ya Israeli
  rationale: “Viongozi” huwasilisha רָאשֵׁי kwa kawaida, na “maelfu” huhifadhi neno tata אַלְפֵי bila kuliamulia kimyakimya kuwa koo; tanbihi inaeleza maana inayowezekana.
