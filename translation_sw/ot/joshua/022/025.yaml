  text: וּ/גְב֣וּל נָֽתַן יְ֠הוָה בֵּינֵ֨/נוּ וּ/בֵינֵי/כֶ֜ם בְּנֵי רְאוּבֵ֤ן וּ/בְנֵי גָד֙ אֶת הַ/יַּרְדֵּ֔ן אֵין לָ/כֶ֥ם חֵ֖לֶק בַּֽ/יהוָ֑ה וְ/הִשְׁבִּ֤יתוּ בְנֵי/כֶם֙ אֶת בָּנֵ֔י/נוּ לְ/בִלְתִּ֖י יְרֹ֥א אֶת יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/025.yaml
  text: For Yahweh has made the Jordan a boundary between us and you[a], sons of Reuben and sons of Gad. You have no portion in Yahweh. And so your sons might cause our sons to stop fearing Yahweh.
translation:
  language: sw
  text: Kwa maana Yahweh ameweka Yordani kuwa mpaka kati yetu na ninyi, enyi wazao wa Reubeni na wa Gadi. Ninyi hamna fungu katika Yahweh.[a] Na hivyo wana wenu huenda wakawafanya wana wetu waache kumcha Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ninyi hamna sehemu katika Yahweh.”
    reason: Neno חֵלֶק linaweza kutafsiriwa kwa Kiswahili kuwa “fungu” au “sehemu.”
lexical_decisions:
- source_word: וּגְבוּל נָתַן
  choice: ameweka ... kuwa mpaka
  rationale: Muungano huu una maana ya kuanzisha au kuweka kitu kiwe mpaka; tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi tendo la Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetafsiriwa kwa namna ya kulitamka, badala ya kulibadilisha kuwa cheo.
- source_word: אֶת הַיַּרְדֵּן
  choice: Yordani
  rationale: Jina hili peke yake hutambulika kwa kawaida kuwa Mto Yordani; kuongeza neno 'Mto' si lazima katika sentensi hii.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: wazao wa Reubeni na wa Gadi
  rationale: Katika muktadha wa makabila, בְּנֵי humaanisha watu au wazao wa makabila hayo, si lazima wana wa kiume wa moja kwa moja. 'Wazao' ni wazi na ya asili katika Kiswahili.
- source_word: אֵין לָכֶם חֵלֶק בַּיהוָה
  choice: Ninyi hamna fungu katika Yahwe
  rationale: '''Fungu'' huhifadhi wazo la sehemu au ushiriki wa mtu bila kuongeza dhana ya urithi ambayo haikutajwa wazi.'
- source_word: וְהִשְׁבִּיתוּ
  choice: huenda wakawafanya ... waache
  rationale: Hifili ya שבת ina maana ya kusababisha kukoma. 'Huenda' huonyesha kwamba maneno haya yanaeleza matokeo yanayohofiwa katika hali inayodhaniwa.
- source_word: לְבִלְתִּי יְרֹא אֶת יְהוָה
  choice: waache kumcha Yahwe
  rationale: Tungo hii inaonyesha kusababisha hali ya kutomcha tena Yahwe; 'kumcha' huhifadhi maana ya hofu yenye heshima inayohusishwa na Mungu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi la Mungu, kwa hiyo 'Yahwe' huhifadhi jina hilo badala ya kuweka cheo mahali pake.
- issue: Maana ya kuwa na חֵלֶק בַּיהוָה
  choice: kuwa na fungu katika Yahwe
  alternative: kuwa na sehemu katika Yahwe
  rationale: Tafsiri hii inadumisha lugha ya ushiriki wa agano bila kuamua kwa undani zaidi aina ya fungu linalokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. 'Enyi' inaonyesha wazi kwamba majina ya makabila ni mwito kwa wasikilizaji; 'wazao' huepuka kudokeza kwamba wanaume pekee ndio wanaokusudiwa.
