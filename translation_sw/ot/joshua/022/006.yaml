lexical_decisions:
- source_word: וַיְבָרְכֵם
  choice: akawabariki
  rationale: Kitenzi ברך katika muundo huu kinaonyesha Yoshua akiwapa baraka. “Akawabariki” ni tafsiri fupi, ya kawaida, na inayohifadhi tendo rasmi.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Jina hili limetolewa kwa umbo la Kiswahili linalotumiwa kwa kawaida katika tafsiri za Biblia.
- source_word: וַיְשַׁלְּחֵם
  choice: kuwaaga
  rationale: Katika muktadha huu שלח ina maana ya kuwaruhusu waondoke au kuwaacha waende. “Kuwaaga” ni ya asili katika Kiswahili na inafaa kwa tukio la kuondoka, bila kudokeza kwamba walifukuzwa.
- source_word: וַיֵּלְכוּ
  choice: wakaenda
  rationale: הלך ni kitenzi cha kawaida cha kwenda. “Wakaenda” ni tafsiri ya moja kwa moja; “wakarudi” ingeongeza maana isiyotajwa wazi na kitenzi chenyewe.
- source_word: אֶל
  choice: kwenye
  rationale: Kihusishi hiki kinaonyesha mwendo kuelekea mahali walikokusudia; “kwenye” ni cha kawaida kabla ya “mahema yao.”
- source_word: אָהֳלֵיהֶם
  choice: mahema yao
  rationale: Nomino hiyo humaanisha kihalisi “mahema yao.” Ingawa inaweza kutumiwa kumaanisha makao au nyumbani, tafsiri halisi inafaa katika mazingira haya ya kihistoria na inaacha uwezekano huo wazi kupitia tanbihi.
