translation:
  language: sw
  text: Kisha Yoshua akawabariki, akawaruhusu waondoke, nao wakaenda kwenye mahema yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “makwao”; kihalisi, “mahema yao.”
