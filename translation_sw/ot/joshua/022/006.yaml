  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa masimulizi wa kawaida na heshima. Muundo wa vitenzi vinavyofuatana—“akawabariki,” “kuwaaga,” “wakaenda”—unahifadhi mfululizo wa matendo katika Kiebrania. Alama ya tanbihi [a] imewekwa mara tu baada ya kirai kinachohusika.
