  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau ya ‘jema machoni pa’ na ‘wana wa Israeli’ imehifadhiwa kwa ukaribu na chanzo, huku usemi wa kijeshi ukitolewa kwa Kiswahili kinachoeleweka kwa urahisi.
