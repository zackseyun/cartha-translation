source:
  edition: WLC
  text: וַ/יִּיטַ֣ב הַ/דָּבָ֗ר בְּ/עֵינֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְבָרֲכ֥וּ אֱלֹהִ֖ים בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֣א אָמְר֗וּ לַ/עֲל֤וֹת עֲלֵי/הֶם֙ לַ/צָּבָ֔א לְ/שַׁחֵת֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֛ר בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/033.yaml
  text: And the matter was good in the eyes of the sons of Israel[a], and the sons of Israel blessed God[c][b]. And they did not speak of going up against them in war to destroy the land where the sons of Reuben and the sons of Gad were living.
translation:
  language: sw
  text: Jambo hilo likawa jema machoni pa wana wa Israeli[a], nao wana wa Israeli wakambariki Mungu[b]. Hawakusema waende kupigana nao ili kuiangamiza nchi ambamo wana wa Reubeni na wana wa Gadi walikuwa wakiishi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania ni, “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wakamsifu Mungu.” Kitenzi cha Kiebrania kwa maana ya moja kwa moja ni “bariki.”
    reason: lexical_alternative
  - marker: c
    text: Kwa maana ya moja kwa moja, “Hawakusema wapande juu dhidi yao kwa vita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי
  choice: Jambo hilo likawa jema machoni pa
  rationale: Huhifadhi nahau ya Kiebrania ya kutathmini jambo kuwa jema machoni pa mtu, huku Kiswahili kikiwa wazi na chenye hadhi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hufuata kwa karibu muundo wa Kiebrania ‘wana wa Israeli’ badala ya kuufanya moja kwa moja kuwa jina la jumla ‘Waisraeli’; tanbihi inatoa namna hiyo ya kawaida zaidi.
- source_word: וַיְבָרֲכוּ אֱלֹהִים
  choice: wakambariki Mungu
  rationale: Kitenzi ברך kimetafsiriwa kwa maana yake ya moja kwa moja ‘bariki’; katika muktadha wa Mungu kuwa mtendewa kinaweza pia kumaanisha kumsifu, jambo linaloonyeshwa katika tanbihi.
- source_word: וְלֹא אָמְרוּ
  choice: Hawakusema tena kwamba
  rationale: Kitenzi ni ‘hawakusema’; ‘tena’ huonyesha kwamba baada ya maelezo hayo hawakuendelea na kusudio lililokuwa limetajwa, bila kubadili usemi kuwa uamuzi rasmi.
- source_word: לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  choice: waende kupigana nao
  rationale: Huwasilisha kwa Kiswahili cha kawaida nahau ya kijeshi ‘kwenda juu dhidi yao kwa vita’ bila kupoteza maana ya kusonga dhidi yao vitani.
- source_word: לְשַׁחֵת אֶת הָאָרֶץ
  choice: ili kuiangamiza nchi
  rationale: ‘Kuiangamiza’ hudumisha uzito wa שׁחת, na ‘nchi’ hapa ni eneo walilokalia makabila hayo.
- source_word: יֹשְׁבִים בָּהּ
  choice: walikuwa wakiishi
  rationale: Huonyesha hali endelevu ya kitenzi-shirikishi cha Kiebrania kwa Kiswahili cha asili.
