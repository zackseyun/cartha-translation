id: JOS.22.28
reference: Joshua 22:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/נֹּ֕אמֶר וְ/הָיָ֗ה כִּֽי יֹאמְר֥וּ אֵלֵ֛י/נוּ וְ/אֶל דֹּרֹתֵ֖י/נוּ מָחָ֑ר וְ/אָמַ֡רְנוּ רְא֣וּ אֶת תַּבְנִית֩ מִזְבַּ֨ח יְהוָ֜ה אֲשֶׁר עָשׂ֣וּ אֲבוֹתֵ֗י/נוּ לֹ֤א לְ/עוֹלָה֙ וְ/לֹ֣א לְ/זֶ֔בַח כִּי עֵ֣ד ה֔וּא בֵּינֵ֖י/נוּ וּ/בֵינֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/028.yaml
  text: 'So we said[a], ‘If they should say to us or to our generations in time to come, then we will say: “Look at the pattern of the altar of Yahweh, which our fathers made—not for burnt offering and not for sacrifice, but it is a witness between us and you.”’'
translation:
  language: sw
  text: 'Kwa hiyo tulisema[a], “Ikiwa wakati ujao watasema nasi au na vizazi vyetu, basi tutasema: ‘Tazameni mfano wa madhabahu ya Yahweh ambao baba zetu waliutengeneza—si kwa ajili ya sadaka ya kuteketezwa wala si kwa ajili ya dhabihu, bali ni shahidi kati yetu na ninyi.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kielelezo,” “nakala,” au “umbo” la madhabahu ya Yahweh. Neno la Kiebrania humaanisha umbo, kielelezo, au nakala; katika muktadha huu, madhabahu hiyo ni ya ushahidi, si ya kutolea sadaka ya kuteketezwa au dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Kwa hiyo tulisema
  rationale: Waw-consecutive inaendeleza simulizi huku muktadha ukitoa nguvu ya maelezo; “Kwa hiyo” ni ya asili katika Kiswahili.
- source_word: וְהָיָה כִּי
  choice: Ikiwa
  rationale: Nahau hii inaanzisha hali ya baadaye inayoweza kutokea; “Ikiwa” huhifadhi maana ya sharti kwa uwazi.
- source_word: יֹאמְרוּ אֵלֵינוּ וְאֶל דֹּרֹתֵינוּ מָחָר
  choice: wakati ujao watatuambia sisi au vizazi vyetu
  rationale: מָחָר hapa humaanisha wakati ujao, si lazima kesho halisi; “vizazi vyetu” huakisi דֹּרֹתֵינוּ.
- source_word: וְאָמַרְנוּ
  choice: basi tutasema
  rationale: “Basi” huonyesha kwa kawaida jibu linalofuata sharti.
- source_word: רְאוּ
  choice: Tazameni
  rationale: Ni amri ya wingi inayowataka wasikilizaji waelekeze fikira zao kwenye madhabahu.
- source_word: תַּבְנִית
  choice: mfano
  rationale: Neno linaweza kumaanisha umbo, kielelezo, au nakala; “mfano” linaonyesha kuwa madhabahu hiyo ilikuwa uwakilishi, bila kuifanya madhabahu halali ya dhabihu.
- source_word: מִזְבַּח יְהוָה
  choice: madhabahu ya Yahweh
  rationale: Muundo wa nomino umefasiriwa moja kwa moja, na jina la Mungu יְהוָה limehifadhiwa kama Yahweh.
- source_word: אֲשֶׁר עָשׂוּ אֲבוֹתֵינוּ
  choice: ambao baba zetu walijenga
  rationale: “Baba zetu” huhifadhi istilahi ya ukoo ya kiume; “walijenga” ni kitenzi cha kawaida kwa kutengeneza madhabahu.
- source_word: לֹא לְעוֹלָה וְלֹא לְזֶבַח
  choice: si kwa ajili ya sadaka ya kuteketezwa wala si kwa ajili ya dhabihu
  rationale: Muundo huu huhifadhi msisitizo wa ukanushaji maradufu לֹא...וְלֹא; עֹלָה ni sadaka ya kuteketezwa na זֶבַח ni dhabihu kwa maana pana.
- source_word: כִּי עֵד הוּא
  choice: bali ni shahidi
  rationale: כִּי hapa hutambulisha kusudi halisi kwa kulinganisha na matumizi ya dhabihu; “ni shahidi” huhifadhi kishazi nomino na sitiari ya Kiebrania.
- source_word: בֵּינֵינוּ וּבֵינֵיכֶם
  choice: kati yetu na ninyi
  rationale: Huhifadhi uhusiano na wingi wa wanaosemeshwa kwa Kiswahili sanifu.
theological_decisions:
- issue: Ufasiri wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yana jina binafsi la agano; “Yahweh” hulihifadhi badala ya kulibadilisha kuwa cheo.
- issue: Istilahi ya ukoo אֲבוֹתֵינוּ
  choice: baba zetu
  alternative: mababu zetu
  rationale: “Baba zetu” huhifadhi kwa karibu neno la kiume lililo katika chanzo, ingawa katika muktadha linawahusu waliotangulia katika ukoo.
- issue: Kazi ya madhabahu
  choice: bali ni shahidi
  alternative: bali iwe ushuhuda
  rationale: Tafsiri iliyochaguliwa haidokezi kuwa madhabahu hii ilikuwa ya kutoa dhabihu; pia huhifadhi dai la moja kwa moja la Kiebrania kwamba yenyewe ni shahidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Tazameni” na “ninyi” hudumisha wingi wa wasemeshwa; ukanushaji maradufu umehifadhiwa kwa msisitizo.
