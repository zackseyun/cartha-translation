  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יָּשֻׁ֣בוּ וַ/יֵּלְכ֡וּ בְּנֵי רְאוּבֵ֨ן וּ/בְנֵי גָ֜ד וַ/חֲצִ֣י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֗ה מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/שִּׁלֹ֖ה אֲשֶׁ֣ר בְּ/אֶֽרֶץ כְּנָ֑עַן לָ/לֶ֜כֶת אֶל אֶ֣רֶץ הַ/גִּלְעָ֗ד אֶל אֶ֤רֶץ אֲחֻזָּתָ/ם֙ אֲשֶׁ֣ר נֹֽאחֲזוּ בָ֔/הּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/009.yaml
  text: So the sons of Reuben and the sons of Gad and the half-tribe of Manasseh returned and departed from the sons of Israel[a], from Shiloh, which is in the land of Canaan, to go to the land of Gilead, to the land of their possession, which they had taken possession of by the command of Yahweh through Moses.
translation:
  language: sw
  text: Basi Wareubeni, Wagadi, na nusu ya kabila la Manase wakarudi, wakaondoka kutoka kwa Waisraeli, kutoka Shilo, iliyoko katika nchi ya Kanaani, kwenda nchi ya Gileadi, nchi ya milki yao, ambako walikuwa wamepata milki[a] kwa amri ya Yahwe kupitia Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambayo waliimiliki.” Kitenzi cha Kiebrania kinaweza kusisitiza ama kupokea na kushikilia nchi hiyo kama milki, ama kuwa na umiliki ndani yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיֵּלְכוּ
  choice: wakarudi wakaondoka
  rationale: 'Huhifadhi mfuatano wa vitenzi viwili vya Kiebrania: kurudi na kisha kuondoka kwenda kwao, bila kufanya Kiswahili kuwa kizito.'
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: Wareubeni, Wagadi, na nusu ya kabila la Manase
  rationale: Majina ya makundi ya kikabila ni ya kawaida na ya asili zaidi katika Kiswahili kuliko tafsiri ya moja kwa moja ‘wana wa Reubeni’; ‘nusu ya kabila’ huhifadhi maana ya חֲצִי שֵׁבֶט.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: kwa Waisraeli
  rationale: Katika muundo ‘wakaondoka kwa Waisraeli,’ kihusishi ‘kwa’ kinaonyesha kujitenga na kundi la Waisraeli kwa Kiswahili cha kawaida.
- source_word: מִשִּׁלֹה אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: huko Shilo, katika nchi ya Kanaani
  rationale: Hutambulisha Shilo wazi kuwa mahali walipoondoka na huhifadhi maelezo ya kijiografia ya kishazi cha Kiebrania.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: nchi ya Gileadi
  rationale: Huhifadhi neno אֶרֶץ na msisitizo wake wa eneo la nchi, badala ya kutumia jina Gileadi peke yake.
- source_word: אֶל אֶרֶץ אֲחֻזָּתָם
  choice: nchi ya milki yao
  rationale: ‘Milki’ huwasilisha wazo la eneo walilopewa na kulishikilia kisheria kama אֲחֻזָּה, na si mali ya kawaida tu.
- source_word: אֲשֶׁר נֹאחֲזוּ בָהּ
  choice: ambako walikuwa wamepata milki
  rationale: Huwasilisha hali iliyotimia ya kuwa na eneo hilo kama milki, huku tanbihi ikihifadhi uwezekano wa kusisitiza kulitwaa au kulimiliki.
- source_word: עַל פִּי יְהוָה
  choice: kwa amri ya Yahwe
  rationale: Nahau עַל־פִּי hapa ina maana ya kutenda kwa amri au agizo; ‘kwa amri ya’ ni Kiswahili wazi na cha asili.
- source_word: בְּיַד מֹשֶׁה
  choice: kupitia Musa
  rationale: Huwasilisha Musa kama mpatanishi wa amri, ambayo ndiyo kazi ya nahau ya Kiebrania ‘kwa mkono wa Musa.’
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה; ‘Yahwe’ hulihifadhi kama jina maalumu bila kulibadili kuwa cheo.
- issue: Namna ya kupata au kumiliki nchi katika נֹאחֲזוּ
  choice: walikuwa wamepata milki
  alternative: walikuwa wameitwaa kuwa milki
  rationale: Kauli ya Kiebrania inaweza kuelekezwa kwenye kupokea/kushikilia eneo au kulitwaa. Matini kuu inatumia usemi usio mkali zaidi, na tanbihi inahifadhi maana nyingine bila kuamua mvutano kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi cha Biblia lakini kinachoeleweka kwa wasomaji wa leo. Majina ya makabila yametolewa kwa umbo la kawaida la Kiswahili; muundo wa Kiebrania umehifadhiwa pale ambapo hauleti ugumu usio wa lazima.
