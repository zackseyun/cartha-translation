  source_fidelity: Rasimu inafuata kwa karibu mfuatano wa vitenzi, makundi ya kikabila, mahali pa kuondokea, kusudi la safari, eneo la urithi, na amri ya Yahwe kupitia Musa. Hata hivyo, «ili waende nchi ya Gileadi» hukosa kihusishi kinachohitajika katika Kiswahili sanifu, na «huko Shilo» haionyeshi kwa uwazi kishazi cha Kiebrania kinachomtambulisha Shilo kuwa iko Kanaani.
  naturalness: «Wakarudi, wakaondoka kutoka kwa Waisraeli, kutoka Shilo, iliyoko katika nchi ya Kanaani» ni wazi na ya kawaida zaidi, huku ikihifadhi marudio ya vyanzo viwili yaliyopo katika Kiebrania. «Kwenda nchi ya Gileadi» ni muundo sahihi na wa asili.
  terminology: Wareubeni, Wagadi, Manase, Gileadi, Kanaani, milki, na Yahwe zinafaa kwa Kiswahili Sanifu cha Afrika Mashariki na kwa rejesta ya simulizi la Biblia. Tanbihi irekelebishwe ili isiseme kwa lazima tendo hai la «kutwaa», kwa kuwa umbo la Kiebrania linaweza kuelekea kupokea/kumiliki makazi ya urithi.
