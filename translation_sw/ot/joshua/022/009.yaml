  - severity: low
    issue: «huko Shilo, katika nchi ya Kanaani» hafanyi kikamilifu kazi ya kishazi «Shilo, ambayo iko katika nchi ya Kanaani».
    rationale: Kutumia «Shilo, iliyoko katika nchi ya Kanaani» huweka wazi kuwa maelezo ya mahali yanaihusu Shilo, kama ilivyo katika אֲשֶׁר בְּאֶרֶץ כְּנָעַן.
  - severity: low
    issue: Tafsiri ya pembeni «walikuwa wameitwaa kuwa milki» inaweza kudokeza umiliki wa kutwaa kwa tendo hai kuliko umbo la Niphal linavyodai.
    rationale: Nֹאחֲזוּ inaweza kueleza kupewa, kupata, au kuwa na umiliki/makazi katika nchi. Tanbihi iliyoegemea «waliimiliki» huhifadhi uwezekano wa kileksia bila kuongeza dai la ushindi au kutwaa.
