revisions:
- from: Lakini ikiwa nchi ya milki yenu ni najisi[a], vukeni mwende katika nchi ya milki ya Yahwe, ambako Maskani ya Yahwe imekaa[b], mkajipatie sehemu ya kumiliki kati yetu[c]. Ila msimwasi Yahwe wala msituasi sisi kwa kujijengea madhabahu nyingine kando ya madhabahu ya Yahwe, Mungu wetu[d].
  to: Lakini ikiwa nchi ya milki yenu ni najisi[a], vukeni mwende katika nchi ya milki ya Yahwe, ambako Maskani ya Yahwe ipo[b], mpate milki katikati yetu[c]. Ila msimwasi Yahwe wala msituasi sisi kwa kujijengea madhabahu isipokuwa madhabahu ya Yahwe, Mungu wetu[d].
  rationale: The revision makes the tabernacle clause idiomatic in Standard East African Swahili, streamlines the phrase about acquiring a holding, and renders the altar prohibition without adding “another” beyond what the Hebrew explicitly states. It preserves the source’s ambiguity concerning the land’s uncleanness and the exact scope of the prohibition.
