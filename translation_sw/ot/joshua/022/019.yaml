id: JOS.22.19
reference: Joshua 22:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אַ֨ךְ אִם טְמֵאָ֜ה אֶ֣רֶץ אֲחֻזַּתְ/כֶ֗ם עִבְר֨וּ לָ/כֶ֜ם אֶל אֶ֨רֶץ אֲחֻזַּ֤ת יְהוָה֙ אֲשֶׁ֤ר שָֽׁכַן שָׁם֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/הֵאָחֲז֖וּ בְּ/תוֹכֵ֑/נוּ וּ/בַֽ/יהוָ֣ה אַל תִּמְרֹ֗דוּ וְ/אֹתָ֨/נוּ֙ אֶל תִּמְרֹ֔דוּ בִּ/בְנֹֽתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ מִֽ/בַּלְעֲדֵ֔י מִזְבַּ֖ח יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/019.yaml
  text: But if the land of your possession is unclean[a], cross over for yourselves into the land of Yahweh’s possession, where Yahweh’s tabernacle dwells, and take possession among us. Only do not rebel against Yahweh, or against us[d][c][b], by building for yourselves an altar besides the altar of Yahweh our God.
translation:
  language: sw
  text: Lakini ikiwa nchi ya milki yenu ni najisi[a], vukeni mwende katika nchi ya milki ya Yahwe, ambako Maskani ya Yahwe ipo[b], mpate milki katikati yetu[c]. Ila msimwasi Yahwe wala msituasi sisi kwa kujijengea madhabahu isipokuwa madhabahu ya Yahwe, Mungu wetu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi ya urithi wenu.” Neno la Kiebrania linaweza kumaanisha milki ya kurithi.
    reason: lexical_alternative
  - marker: b
    text: Au “ambako Maskani ya Yahwe imekaa.” Kiebrania husema kihalisi kwamba Maskani ya Yahwe imekaa huko.
    reason: lexical_alternative
  - marker: c
    text: Au “mkakae katikati yetu.” Kitenzi cha Kiebrania kinaweza kumaanisha kupata eneo la kumiliki au kukaa mahali.
    reason: lexical_alternative
  - marker: d
    text: Au “mbali na” au “zaidi ya” madhabahu ya Yahwe, Mungu wetu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַךְ
  choice: Lakini
  rationale: Huonyesha sharti lenye msisitizo linalogeuza hoja iliyotangulia; “Lakini” ni ya kawaida na yenye nguvu inayofaa hapa.
- source_word: טְמֵאָה
  choice: najisi
  rationale: “Najisi” huhifadhi maana ya uchafu wa kiibada au kidini bila kuamua kwa nini hasa nchi hiyo ingeonwa hivyo.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: nchi ya milki yenu
  rationale: אֲחֻזָּה ni mali au eneo linalomilikiwa, mara nyingi kama urithi. “Milki” huhifadhi ulinganifu wake na “milki ya Yahwe” katika sentensi hiyo hiyo.
- source_word: עִבְרוּ לָכֶם
  choice: vukeni mwende
  rationale: Kitenzi kinamaanisha kuvuka, yaelekea kuvuka Yordani. Kiswahili cha kawaida hakihitaji kutafsiri לָכֶם neno kwa neno; wazo la hatua wanayopaswa kuchukua linaeleweka katika amri.
- source_word: אֶל אֶרֶץ אֲחֻזַּת יְהוָה
  choice: katika nchi ya milki ya Yahwe
  rationale: Huhifadhi urudiaji wa אֲחֻזָּה na tofauti iliyokusudiwa kati ya milki yao na milki ya Yahwe.
- source_word: אֲשֶׁר שָׁכַן שָׁם מִשְׁכַּן יְהוָה
  choice: ambako Maskani ya Yahwe imekaa
  rationale: 'Huhifadhi kwa kadiri inayowezekana mchezo wa maneno kati ya שׁכן na מִשְׁכָּן: Maskani ndiyo inayosemwa kuwa imekaa huko.'
- source_word: וְהֵאָחֲזוּ בְּתוֹכֵנוּ
  choice: mkajipatie sehemu ya kumiliki kati yetu
  rationale: Huonyesha kupata eneo au fungu la kudumu, si kukaa tu, huku ikitoa Kiswahili kinachoeleweka.
- source_word: וּבַיהוָה אַל תִּמְרֹדוּ
  choice: Ila msimwasi Yahwe
  rationale: '“Ila” huleta msisitizo wa zuio: lolote watakalofanya, wasimwasi Yahwe.'
- source_word: וְאֹתָנוּ אַל תִּמְרֹדוּ
  choice: wala msituasi sisi
  rationale: Huhifadhi zuio la pili lililo sambamba na la kwanza na kutaja wazi wale ambao pia wasiasiwe.
- source_word: בִּבְנֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: kwa kujijengea madhabahu nyingine
  rationale: “Kwa kujijengea” huonyesha njia ambayo uasi ungefanywa; “nyingine” inaeleweka kutokana na kulinganishwa na madhabahu iliyopo ya Yahwe.
- source_word: מִבַּלְעֲדֵי מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: kando ya madhabahu ya Yahwe, Mungu wetu
  rationale: “Kando ya” linaweza kuonyesha madhabahu ya ziada au ya ushindani bila kufafanua kupita kiasi aina kamili ya katazo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi badala ya kubadilishwa na cheo.
theological_decisions:
- issue: Aina ya unajisi wa nchi ya mashariki ya Yordani
  choice: ikiwa nchi ya milki yenu ni najisi
  alternative: ikiwa nchi yenu imetiwa unajisi; ikiwa eneo lenu halifai kiibada
  rationale: Kiebrania hakielezi ikiwa unajisi huo ni wa kiibada, wa kijiografia, au kauli ya hoja. Tafsiri inaacha jambo hilo wazi.
- issue: Hadhi na kusudi la madhabahu nyingine
  choice: madhabahu nyingine kando ya madhabahu ya Yahwe
  alternative: madhabahu yoyote ya pili; madhabahu ya dhabihu inayoshindana na ile kuu
  rationale: Mstari unapinga madhabahu iliyo nje ya ile ya Yahwe, lakini haufafanui peke yake upeo kamili wa katazo. Tafsiri haiongezi nadharia maalumu kuhusu madhabahu hiyo.
- issue: Maskani kuwa ndiyo inayokaa
  choice: Maskani ya Yahwe imekaa
  alternative: Yahwe anakaa katika Maskani yake huko; Maskani ya Yahwe iko huko
  rationale: Muundo wa Kiebrania humfanya Maskani kuwa kiima cha kitenzi “kukaa.” Chaguo kuu huhifadhi taswira hiyo isiyo ya kawaida badala ya kuibadili kuwa dai tofauti kuhusu namna ya uwepo wa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Najisi,” “Maskani,” na “madhabahu” huhifadhi msamiati wa kiibada; “milki” huweka wazi ulinganifu wa kimakusudi katika Kiebrania. Muundo wa sentensi umerahisishwa kiasi bila kuondoa tahadhari, masharti, au utata wa kiteolojia.
