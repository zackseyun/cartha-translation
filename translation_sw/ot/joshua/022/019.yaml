review_pass:
  verdict: revise
  source_fidelity: Draft retains the conditional ambiguity of טְמֵאָה, the deliberate possession/milki parallel, the paired prohibitions, and the warning about an altar besides Yahwe’s altar. However, “madhabahu nyingine kando ya” somewhat overstates and redundantly expands the Hebrew preposition; the source itself says an altar “besides/apart from” Yahwe’s altar.
  naturalness: “Maskani ya Yahwe imekaa” is an overly literal and unnatural personification in modern Standard East African Swahili. “Ambako Maskani ya Yahwe ipo” is idiomatic while retaining the locative claim. “Mkajipatie sehemu ya kumiliki” is understandable but wordy; “mpate milki katikati yetu” is more direct and preserves the land-holding sense.
  terminology: “Najisi,” “milki,” “Maskani,” and “madhabahu” suit the biblical-cultic register. “Yahwe” consistently renders the divine name. The revised wording preserves “milki” in both corresponding Hebrew phrases.
  issues:
  - severity: medium
    issue: Unnatural rendering of the tabernacle clause
    rationale: “Maskani ... imekaa” calques the Hebrew verb in a way that is not idiomatic Swahili. The source’s point is that the tabernacle is located there; “ipo” communicates this naturally, with the literal wording retained in the footnote.
  - severity: medium
    issue: Added and duplicated qualification concerning the altar
    rationale: “Madhabahu nyingine kando ya” adds “nyingine” and then uses “kando ya,” whereas מִבַּלְעֲדֵי is adequately represented by “isipokuwa” (“besides/apart from”). The revision avoids making the implied characterization more explicit than the source.
  - severity: low
    issue: Wordy rendering of obtaining a holding
    rationale: “Mkajipatie sehemu ya kumiliki” is periphrastic. “Mpate milki katikati yetu” is natural and maintains the possession/holding sense of the Hebrew verb.
  revised_text: Lakini ikiwa nchi ya milki yenu ni najisi[a], vukeni mwende katika nchi ya milki ya Yahwe, ambako Maskani ya Yahwe ipo[b], mpate milki katikati yetu[c]. Ila msimwasi Yahwe wala msituasi sisi kwa kujijengea madhabahu isipokuwa madhabahu ya Yahwe, Mungu wetu[d].
  revised_footnotes:
