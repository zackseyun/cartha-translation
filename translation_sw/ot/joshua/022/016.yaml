  text: כֹּ֣ה אָמְר֞וּ כֹּ֣ל עֲדַ֣ת יְהוָ֗ה מָֽה הַ/מַּ֤עַל הַ/זֶּה֙ אֲשֶׁ֤ר מְעַלְתֶּם֙ בֵּ/אלֹהֵ֣י יִשְׂרָאֵ֔ל לָ/שׁ֣וּב הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה בִּ/בְנֽוֹתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ לִ/מְרָדְ/כֶ֥ם הַ/יּ֖וֹם בַּ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/016.yaml
  text: 'Thus says the whole congregation of Yahweh: ‘What is this breach of faith that you have committed against the God of Israel[a], turning away today from following Yahweh by building for yourselves an altar, rebelling today against Yahweh?’'
translation:
  language: sw
  text: 'Hivi ndivyo kusanyiko lote la Yahwe linavyosema: “Ni tendo gani hili la kuvunja uaminifu mliomtendea Mungu wa Israeli,[a] kwa kugeuka leo na kuacha kumfuata Yahwe, kwa kujijengea madhabahu ili kumwasi Yahwe leo?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “usaliti” au “kutokuwa waaminifu.” Neno la Kiebrania humaanisha kutokuwa mwaminifu katika agano au ibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמְרוּ
  choice: Hivi ndivyo ... linavyosema
  rationale: Kauli ya kuwasilisha ujumbe imetafsiriwa kwa Kiswahili cha kawaida; kitenzi cha umoja kinaafikiana na nomino ya pamoja “kusanyiko.”
- source_word: כֹּל עֲדַת יְהוָה
  choice: kusanyiko lote la Yahwe
  rationale: עֵדָה humaanisha jumuiya iliyokusanyika; “kusanyiko” huhifadhi maana ya pamoja na ni lugha yenye hadhi inayoeleweka.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika maandishi ya Kiebrania.
- source_word: מָה הַמַּעַל הַזֶּה אֲשֶׁר מְעַלְתֶּם
  choice: Ni ukosefu gani huu wa uaminifu mliofanya
  rationale: Muundo wenye nomino na kitenzi vya mzizi mmoja unaonyesha tendo la kuvunja uaminifu wa agano au ibada; tafsiri hii ni ya asili katika Kiswahili bila kupunguza uzito wake.
- source_word: בֵּאלֹהֵי יִשְׂרָאֵל
  choice: dhidi ya Mungu wa Israeli
  rationale: Baada ya מעל, kihusishi ב humtaja yule aliyekosewa; “dhidi ya” huonyesha wazi kuwa tendo hilo lilimlenga Mungu.
- source_word: לָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: kwa kuacha leo kumfuata Yahwe
  rationale: Nahau ya Kiebrania ya kugeuka kutoka nyuma ya mtu ina maana ya kuacha kumfuata; “kumfuata” huhifadhi wazo la utiifu na uaminifu.
- source_word: בִּבְנוֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: mkijijengea madhabahu
  rationale: Kiambishi ב pamoja na jina-kitenzi huonyesha hali au njia ya kuacha kumfuata Yahwe; “-ji-...-ea” huhifadhi maana ya kujengea wenyewe.
- source_word: לִמְרָדְכֶם הַיּוֹם בַּיהוָה
  choice: na hivyo kumwasi Yahwe leo
  rationale: מרד ni kuasi mamlaka. “Na hivyo” huonyesha uhusiano wa kusudi au matokeo bila kuufanya kuwa mkali kuliko unavyoruhusiwa na muundo wa Kiebrania.
theological_decisions:
- issue: Maana ya מַעַל kama kosa la agano na ibada
  choice: ukosefu wa uaminifu
  alternative: usaliti; kuvunja uaminifu
  rationale: “Ukosefu wa uaminifu” huonyesha kutokuwa mwaminifu kwa Mungu katika uhusiano wa agano na ibada, bila kuifanya kuwa dhana ya jumla tu ya dhambi. Tanbihi huhifadhi mbadala wenye nguvu zaidi.
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina binafsi la Mungu, si cheo; “Yahwe” hulihifadhi kwa namna inayotambulika katika Kiswahili.
- issue: Uhusiano wa לִמְרָדְכֶם na ujenzi wa madhabahu
  choice: na hivyo kumwasi
  alternative: ili kumwasi
  rationale: ל inaweza kuonyesha kusudi au matokeo. “Na hivyo” huhifadhi mvutano huo badala ya kuamua bila shaka kwamba walikuwa na nia ya wazi ya kuasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya “leo” yamehifadhiwa kwa msisitizo wa mashtaka, na sentensi ndefu ya usemi wa wajumbe imebaki na mtiririko wa kawaida wa Kiswahili.
