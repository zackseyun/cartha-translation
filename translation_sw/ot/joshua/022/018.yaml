  text: וְ/אַתֶּם֙ תָּשֻׁ֣בוּ הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה וְ/הָיָ֗ה אַתֶּ֞ם תִּמְרְד֤וּ הַ/יּוֹם֙ בַּֽ/יהוָ֔ה וּ/מָחָ֕ר אֶֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יִקְצֹֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/018.yaml
  text: And you are turning away today from following Yahweh[a]; and if you rebel today against Yahweh[c][b], tomorrow he will be angry with the whole congregation of Israel.
translation:
  language: sw
  text: Nanyi leo mnaacha kumfuata Yahwe[a][b]; na ikiwa leo mtamwasi Yahwe, kesho atalikasirikia[c] kusanyiko lote la Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnarudi nyuma.” Kitenzi cha Kiebrania kinaweza kumaanisha kurudi au kugeuka; hapa kina maana ya kugeuka kwa kukosa uaminifu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kutoka nyuma ya Yahwe,” nahau ya Kiebrania yenye maana ya kuacha kumfuata.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema tu “atakasirika”; kutokana na muktadha, mtendaji anayeeleweka ni Yahwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשֻׁבוּ
  choice: mnageuka na kuacha
  rationale: Kitenzi שוב pamoja na מֵאַחֲרֵי hapa kinaonyesha kugeuka kwa kukosa uaminifu na kuacha kumfuata Yahwe, si kurudi tu mahali fulani.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: kuacha kumfuata Yahwe
  rationale: Nahau ya Kiebrania, kihalisi ‘kutoka nyuma ya Yahwe,’ ina maana ya kuacha kumfuata; tafsiri hii ni ya kawaida katika Kiswahili huku ikihifadhi picha ya ufuasi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Inawakilisha jina binafsi la Mungu katika maandishi ya Kiebrania badala ya kulibadilisha kuwa cheo.
- source_word: וְהָיָה
  choice: na ikiwa
  rationale: Katika muundo huu, kishazi kinaanzisha onyo lenye sharti na matokeo yake; ‘na ikiwa’ ni Kiswahili cha asili kinachowasilisha uhusiano huo.
- source_word: תִּמְרְדוּ
  choice: mtamwasi
  rationale: מרד hueleza uasi dhidi ya mamlaka halali; ‘kumwasi’ ni neno thabiti na la kawaida, na kiambishi -mw- kinaelekeza tendo hilo kwa Yahwe.
- source_word: בַּיהוָה
  choice: Yahwe
  rationale: Baada ya מרד, kihusishi בְּ kina maana ya uadui, yaani kumwasi Yahwe; maana hiyo imejengwa ndani ya kitenzi cha Kiswahili ‘mtamwasi.’
- source_word: וּמָחָר
  choice: kesho
  rationale: Inadumisha ukaribu na uharaka wa matokeo yanayotajwa katika onyo.
- source_word: יִקְצֹף
  choice: atalikasirikia
  rationale: קצף huonyesha hasira kali; ‘atalikasirikia’ ni ya sasa, yenye heshima, na inataja kusanyiko kama mlengwa wa hasira bila kuongeza maelezo yasiyokuwapo.
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: kusanyiko lote la Israeli
  rationale: עֵדָה hueleza jamii ya agano ikiwa kundi la pamoja; ‘kusanyiko lote’ huhifadhi maana hiyo ya ushirika kuliko neno pana zaidi la jamii.
theological_decisions:
- issue: Mtendaji aliyedokezwa katika יִקְצֹף
  choice: Yahwe ndiye mtendaji anayeeleweka katika ‘atalikasirikia’
  alternative: Kauli isiyo na mtendaji maalumu, kama ‘hasira itawajia’
  rationale: Muktadha wa karibu unamtaja Yahwe kuwa yule ambaye wanaacha kumfuata na ambaye wanamwasi; kwa hiyo ndiye anayeeleweka kuwa atakasirika, huku onyo likihifadhi wazo la matokeo kwa Israeli yote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unabaki karibu na sentensi ya Kiebrania, lakini nahau na uhusiano wa sharti vimetolewa kwa Kiswahili cha kawaida. Jina ‘Yahwe’ limetumiwa kwa יהוה, na ‘kusanyiko’ linadumisha uzito wa jamii ya agano.
