  text: וַ/יֹּ֣אמֶר פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֡ן אֶל בְּנֵי רְאוּבֵ֨ן וְ/אֶל בְּנֵי גָ֜ד וְ/אֶל בְּנֵ֣י מְנַשֶּׁ֗ה הַ/יּ֤וֹם יָדַ֨עְנוּ֙ כִּֽי בְ/תוֹכֵ֣/נוּ יְהוָ֔ה אֲשֶׁ֛ר לֹֽא מְעַלְתֶּ֥ם בַּֽ/יהוָ֖ה הַ/מַּ֣עַל הַ/זֶּ֑ה אָ֗ז הִצַּלְתֶּ֛ם אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/יַּ֥ד יְהוָֽה־־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/031.yaml
  text: And Phinehas son of Eleazar the priest said to the sons of Reuben[a], and to the sons of Gad, and to the sons of Manasseh, “Today we know that Yahweh is among us, because you have not acted unfaithfully against Yahweh in this matter[c][b]. Then you have delivered the sons of Israel from the hand of Yahweh.”
translation:
  language: sw
  text: Kisha Finehasi mwana wa kuhani Eleazari akawaambia wana wa Reubeni, wana wa Gadi na wana wa Manase, “Leo tunajua kwamba Yahwe yuko kati yetu, kwa sababu hamjamsaliti Yahwe kwa usaliti huu.[a] Kwa hiyo, mmewaokoa wana wa Israeli kutoka mkononi mwa Yahwe.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinarudia mzizi mmoja: “hamjamsaliti Yahwe kwa usaliti huu.” Maneno hayo yanaonyesha kuvunja uaminifu au uhaini katika uhusiano wa agano.'
    reason: lexical_alternative
  - marker: b
    text: “Kutoka mkononi mwa Yahwe” ni nahau ya Kiebrania inayomaanisha kuokolewa kutoka katika nguvu au hukumu ya Yahwe.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kisha ... akawaambia
  rationale: Muundo huu unaendeleza mtiririko wa simulizi na kuonyesha wazi kwamba maneno yaliwaelekea makabila yaliyotajwa.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Finehasi mwana wa kuhani Eleazari
  rationale: Kiswahili hiki kinaonyesha kwa kawaida kwamba Eleazari ndiye kuhani, sambamba na uwezekano mkubwa wa muundo wa Kiebrania.
- source_word: אֶל בְּנֵי רְאוּבֵן וְאֶל בְּנֵי גָד וְאֶל בְּנֵי מְנַשֶּׁה
  choice: wana wa Reubeni, wana wa Gadi na wana wa Manase
  rationale: Neno 'wana' linadumisha muundo wa kikabila wa Kiebrania bila kutumia majina ya makabila yasiyo ya kawaida katika Kiswahili.
- source_word: הַיּוֹם יָדַעְנוּ
  choice: Leo tunajua
  rationale: Kauli timilifu ya Kiebrania ina nguvu ya utambuzi wa sasa; tafsiri hii ni ya kawaida na ya moja kwa moja.
- source_word: בְּתוֹכֵנוּ
  choice: yuko kati yetu
  rationale: Ni Kiswahili cha kawaida kinachoeleza kuwapo kwa Mungu miongoni mwa jumuiya, si ndani ya miili yao.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa unukuzi unaokubalika badala ya kubadilishwa kuwa cheo.
- source_word: מְעַלְתֶּם בַּיהוָה הַמַּעַל הַזֶּה
  choice: hamjatenda kwa kukosa uaminifu kwa Yahwe katika jambo hili
  rationale: Mzizi מעל unaashiria kuvunja uaminifu wa agano. Tafsiri inaweka uzito huo huku ikiepuka urudiaji mgumu wa kitenzi na nomino zenye mzizi mmoja.
- source_word: אָז
  choice: Kwa hiyo
  rationale: Katika muktadha huu kiunganishi kinaonyesha matokeo au hitimisho kutokana na kutokuwa kwao na hatia, si tu mfuatano wa wakati.
- source_word: הִצַּלְתֶּם
  choice: mmewaokoa
  rationale: Hifili ya נצל humaanisha kuokoa au kukomboa kutoka hatarini; 'mmewaokoa' ni ya asili katika Kiswahili.
- source_word: מִיַּד יְהוָה
  choice: kutoka mkononi mwa Yahwe
  rationale: Nahau ya Kiebrania imedumishwa kwa sababu inaeleweka na kuhifadhi nguvu ya picha ya mamlaka au hukumu ya Mungu.
theological_decisions:
- issue: Kauli kuhusu kuwapo kwa Mungu
  choice: Yahwe yuko kati yetu
  alternative: Yahwe yumo katikati yetu
  rationale: Kauli hii inadumisha uthibitisho wa kuwapo kwa Yahwe miongoni mwa watu wake bila kuingiza maelezo ya kiteolojia yasiyosemwa na mstari.
- issue: Maana ya lugha ya מעל
  choice: kutenda kwa kukosa uaminifu kwa Yahwe
  alternative: kumwasi Yahwe; kufanya kosa la uhaini dhidi ya Yahwe
  rationale: Chaguo hili linaonyesha uvunjaji wa uaminifu wa agano, si kosa la kawaida tu, bila kuamua kwa undani zaidi aina ya kosa.
- issue: Maana ya ‘kutoka mkononi mwa Yahwe’
  choice: nahau imehifadhiwa katika maandishi
  alternative: kutoka katika hukumu ya Yahwe; kutoka katika nguvu za Yahwe
  rationale: Maandishi yanaashiria kuokolewa na mamlaka au hukumu ya Yahwe, lakini hayatumii wazi neno 'hukumu'; hivyo picha ya asili imehifadhiwa na kufafanuliwa katika tanbihi.
translation_notes:
  register: Lugha ni ya sasa, yenye heshima na inayoeleweka kote Afrika Mashariki. Muundo wa kikabila ‘wana wa’ na nahau ‘mkononi mwa Yahwe’ zimehifadhiwa kwa uwazi wa chanzo, huku sentensi ikiwekwa katika mpangilio wa kawaida wa Kiswahili.
