  text: וַ/יָּ֣שָׁב פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וְ/הַ/נְּשִׂיאִ֡ים מֵ/אֵ֣ת בְּנֵֽי רְאוּבֵן֩ וּ/מֵ/אֵ֨ת בְּנֵי גָ֜ד מֵ/אֶ֧רֶץ הַ/גִּלְעָ֛ד אֶל אֶ֥רֶץ כְּנַ֖עַן אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּשִׁ֥בוּ אוֹתָ֖/ם דָּבָֽר־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/032.yaml
  text: Then Phinehas son of Eleazar the priest[a], and the leaders, returned from the sons of Reuben and from the sons of Gad, from the land of Gilead to the land of Canaan, to the sons of Israel[b], and brought back word to them.
translation:
  language: sw
  text: Kisha Finehasi mwana wa Eleazari kuhani, pamoja na viongozi, walirudi kutoka kwa Wareubeni na Wagadi, huko katika nchi ya Gileadi, kwenda katika nchi ya Kanaani, kwa Waisraeli[b], wakawaletea habari[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawaarifu kuhusu jambo hilo.” Neno la Kiebrania דָּבָר linaweza kumaanisha “neno,” “jambo,” au “habari,” kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “kwa wana wa Israeli”; yaani, kwa Waisraeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: walirudi
  rationale: Kitenzi שׁוב kinaeleza kurudi kulikokamilika. Ingawa Kiebrania kina kitenzi cha umoja kinachomfuata Finehasi, Kiswahili sanifu hutumia wingi kwa kiima ambacho kinajumuisha Finehasi na viongozi.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Finehasi mwana wa Eleazari kuhani
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia, huku uhusiano wa kifamilia na cheo cha Eleazari vikihifadhiwa.
- source_word: וְהַנְּשִׂיאִים
  choice: pamoja na viongozi
  rationale: נְשִׂיאִים hapa ni viongozi wa makabila, si lazima wafalme; “viongozi” ni wazi na ya kisasa. “Pamoja na” huunda kiima cha pamoja kwa Kiswahili cha kawaida.
- source_word: מֵאֵת בְּנֵי רְאוּבֵן וּמֵאֵת בְּנֵי גָד
  choice: kutoka kwa Wareubeni na Wagadi
  rationale: בְּנֵי ikifuatwa na jina la babu wa kabila hutaja watu wa kabila hilo. “Wareubeni na Wagadi” ni Kiswahili asilia na kinahifadhi rejeleo la kikabila.
- source_word: מֵאֶרֶץ הַגִּלְעָד
  choice: katika nchi ya Gileadi
  rationale: אֶרֶץ ina maana ya nchi au eneo la kijiografia; “nchi ya Gileadi” huhifadhi utofautishaji wake na nchi ya Kanaani. “Katika” inaunganisha eneo hili na watu waliokuwa huko bila Kiswahili kizito cha kurudia “kutoka”.
- source_word: אֶל אֶרֶץ כְּנַעַן
  choice: kwenda katika nchi ya Kanaani
  rationale: Neno “nchi” limehifadhiwa ili kuonyesha ulinganifu wa kijiografia kati ya Gileadi na Kanaani.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: kwa Waisraeli
  rationale: Ingawa kwa neno moja moja ni “wana wa Israeli,” usemi huu hapa unamaanisha watu wa Israeli kwa ujumla; “Waisraeli” ni wazi na wa kawaida katika Kiswahili.
- source_word: וַיָּשִׁבוּ אוֹתָם דָּבָר
  choice: wakawaletea habari
  rationale: Usemi huu una maana ya kuwarudishia au kuwaletea neno, taarifa, au jambo. “Wakawaletea habari” ni wa kawaida katika Kiswahili na unaonyesha kwamba walirudi na taarifa bila kuifanya דָּבָר kuwa tamko moja tu.
