base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/027.yaml
  text: Rather, it is a witness between us and you, and between our generations after us, that we may perform the service of the LORD before him with our burnt offerings, our sacrifices, and our peace offerings, so that your children may not say to our children in time to come, ‘You have no share in the LORD.’
translation:
  language: sw
  text: Bali, hiyo ni shahidi kati yetu na ninyi, na kati ya vizazi vyetu vitakavyokuja baada yetu, ili tupate kufanya ibada ya BWANA mbele yake kwa sadaka zetu za kuteketezwa, dhabihu zetu na sadaka zetu za amani, ili watoto wenu wasije kuwaambia watoto wetu wakati ujao, ‘Ninyi hamna sehemu katika BWANA.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Bali
  rationale: Katika muktadha huu neno linaendeleza ukanushaji wa wazo lililotangulia kwa maana ya ‘bali’ au ‘badala yake,’ si sababu tu.
- source_word: עֵד
  choice: shahidi
  rationale: Huhifadhi taswira ya madhabahu kuwa shahidi kati ya makundi hayo, badala ya kuigeuza tu kuwa ‘ushahidi.’
- source_word: לַעֲבֹד אֶת־עֲבֹדַת יְהוָה
  choice: tutafanya ibada ya BWANA
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la kutekeleza huduma ya ibada kwa BWANA, kama linavyofafanuliwa na matoleo yanayofuata.
- source_word: עֹלוֹת
  choice: sadaka za kuteketezwa
  rationale: Ni istilahi ya kawaida na iliyo wazi kwa matoleo yaliyoteketezwa madhabahuni.
- source_word: זְבָחִים
  choice: dhabihu
  rationale: Neno la jumla linalofaa kwa wanyama waliotolewa kama dhabihu.
- source_word: שְׁלָמִים
  choice: sadaka za amani
  rationale: Huhifadhi istilahi ya aina hii ya sadaka bila kuibana kuwa tafsiri moja tu ya kusudi lake.
- source_word: חֵלֶק בַּיהוָה
  choice: sehemu katika BWANA
  rationale: Huhifadhi sitiari ya kuwa na fungu, nafasi au ushirika katika uhusiano wa agano na BWANA bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Jina la Mungu יהוה
  choice: BWANA
  alternative: Yahwe
  rationale: Inafuata desturi pana ya tafsiri za Kiswahili ya kuonyesha jina la agano kwa herufi kubwa, huku ikibaki wazi kwamba maandishi ya Kiebrania yana jina la Mungu.
- issue: Madhabahu kama shahidi
  choice: hiyo ni shahidi
  alternative: hiyo ni ushahidi
  rationale: Neno la Kiebrania linaiwasilisha madhabahu kwa lugha ya kisheria na ya kimfano kama shahidi; tafsiri hii haiifuti taswira hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi imegawanywa mara mbili ili kusomeka kwa kawaida bila kupoteza uhusiano wa kusudi katika maandishi ya Kiebrania.
