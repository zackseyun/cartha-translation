base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/002.yaml
  text: And he said to them[a], “You have kept all that Moses the servant of Yahweh commanded you, and you have listened to my voice in all that I commanded you.”
translation:
  language: sw
  text: Naye akawaambia, “Mmezingatia yote ambayo Musa, mtumishi wa Yahweh, aliwaamuru, nanyi mmeisikiliza sauti yangu[a] katika yote niliyowaamuru.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nanyi mmenitii katika yote niliyowaamuru.” Nahau ya Kiebrania “kuisikiliza sauti” mara nyingi humaanisha kusikiliza na kuitikia kwa kutii.
    reason: Mbadala wa kileksika unaofafanua maana ya nahau ya Kiebrania.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Naye akawaambia
  rationale: Muundo huu unaendeleza simulizi kwa kawaida katika Kiswahili na unaonyesha wazi kuwa alisema kwao.
- source_word: שְׁמַרְתֶּם
  choice: Mmeshika
  rationale: Katika muktadha wa maagizo, kitenzi hiki humaanisha kuyatunza au kuyafuata; “mmeshika” ni usemi wa kawaida wa Kiswahili unaodumisha wazo hilo.
- source_word: כָּל אֲשֶׁר צִוָּה אֶתְכֶם
  choice: yote ambayo ... aliwaamuru
  rationale: Huwasilisha upeo kamili wa maagizo na mamlaka ya kitenzi צוה kwa Kiswahili cha kawaida.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: Musa, mtumishi wa Yahwe
  rationale: “Mtumishi” hapa ni cheo cha heshima kinachoonyesha huduma ya Musa kwa Mungu, si mkazo juu ya hali ya utumwa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linawakilisha jina binafsi la Mungu lililoandikwa kwa herufi nne za Kiebrania, badala ya kulibadili kuwa cheo.
- source_word: וַתִּשְׁמְעוּ בְקוֹלִי
  choice: nanyi mmeisikiliza sauti yangu
  rationale: Tafsiri hii inadumisha taswira ya Kiebrania ya kuisikiliza sauti, huku muktadha ukidokeza kuitikia kwa kutii.
- source_word: לְכֹל אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: katika yote niliyowaamuru
  rationale: Inaonyesha kwamba walimsikiliza kuhusiana na kila agizo alilowapa.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya עֶבֶד inapomtaja Musa
  choice: mtumishi
  alternative: mtumwa
  rationale: Katika kifungu hiki neno hilo ni cheo cha heshima cha Musa katika uhusiano wake na Yahwe; hadhi ya utumwa haijasisitizwa.
- issue: Nahau שׁמע בקול
  choice: mmeisikiliza sauti yangu
  alternative: mmenitii
  rationale: Chaguo kuu linahifadhi nahau na taswira ya kusikia iliyo katika Kiebrania, bila kuondoa maana inayodokezwa ya kuitikia kwa utiifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi inayofaa maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi urudiaji na upeo wa maneno ya Kiebrania bila kuwa mgumu isivyo lazima.
