base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/024.yaml
  text: No, rather, we did this out of anxious concern, saying, ‘In time to come your children may say to our children, “What have you to do with the LORD, the God of Israel?”’
translation:
  language: sw
  text: La, bali tulifanya hivi kwa sababu ya wasiwasi juu ya jambo fulani, tukisema, “Siku zijazo watoto wenu huenda wakawaambia watoto wetu, ‘Ninyi mna uhusiano gani na BWANA, Mungu wa Israeli?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִדְּאָגָה מִדָּבָר
  choice: kwa sababu ya wasiwasi
  rationale: Kirai hiki kinaonyesha kuwa walichochewa na hofu au hangaiko kuhusu jambo fulani; ‘kwa sababu ya wasiwasi’ ni Kiswahili cha kawaida kinachobeba uzito huo bila kuongeza sababu isiyotajwa.
- source_word: מָחָר
  choice: Siku zijazo
  rationale: Ingawa neno hili kimsingi humaanisha ‘kesho,’ hapa linatumika kwa maana ya wakati ujao, yaani kizazi kitakachofuata.
- source_word: מַה לָּכֶם וְלַיהוָה
  choice: Ninyi mna uhusiano gani na BWANA
  rationale: Nahau ya Kiebrania inauliza watu hao wana sehemu, dai, au uhusiano gani na BWANA. Tafsiri hii ni ya asili katika Kiswahili na haibani swali kuwa kuhusu jambo moja tu.
- source_word: יהוה
  choice: BWANA
  rationale: Linawakilisha jina la agano la Mungu kwa namna iliyozoeleka katika tafsiri za Biblia za Kiswahili.
theological_decisions:
- issue: Maana ya swali kuhusu uhusiano na BWANA
  choice: Ninyi mna uhusiano gani na BWANA
  alternative: Mna sehemu gani katika BWANA
  rationale: 'Chaguo hili linahifadhi upana wa nahau: inaweza kugusa uhusiano, haki ya kushiriki katika ibada, au dai la kuwa watu wa Mungu, bila kuamua mapema kipengele kimoja.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetiririka kwa kawaida huku ikihifadhi viwango vya usemi wa moja kwa moja katika Kiebrania.
