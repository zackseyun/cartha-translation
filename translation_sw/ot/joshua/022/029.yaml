  text: חָלִילָ/ה֩ לָּ֨/נוּ מִמֶּ֜/נּוּ לִ/מְרֹ֣ד בַּֽ/יהוָ֗ה וְ/לָ/שׁ֤וּב הַ/יּוֹם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה לִ/בְנ֣וֹת מִזְבֵּ֔חַ לְ/עֹלָ֖ה לְ/מִנְחָ֣ה וּ/לְ/זָ֑בַח מִ/לְּ/בַ֗ד מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ אֲשֶׁ֖ר לִ/פְנֵ֥י מִשְׁכָּנֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/029.yaml
  text: Far be it from us that we should rebel against Yahweh and turn away today from following Yahweh by building an altar for burnt offering[a], grain offering, or sacrifice, besides the altar of Yahweh our God that is before his tabernacle.
translation:
  language: sw
  text: Hasha kwetu kumwasi Yahwe na kuacha kumfuata Yahwe leo kwa kujenga madhabahu kwa ajili ya sadaka ya kuteketezwa, sadaka ya nafaka, au dhabihu, kando na madhabahu ya Yahwe Mungu wetu iliyo mbele ya maskani yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה לָּנוּ מִמֶּנּוּ
  choice: Hasha kabisa kwetu
  rationale: Nahau hii inaonyesha kukataa kwa nguvu na kuchukizwa na jambo linalotajwa. ‘Hasha kabisa kwetu’ ni ya asili, yenye heshima, na inahifadhi mkazo wa Kiebrania.
- source_word: לִמְרֹד בַּיהוָה
  choice: kumwasi Yahwe
  rationale: Kitenzi מרד pamoja na kihusishi ב kina maana ya uasi dhidi ya mtu; ‘kumwasi’ huonyesha wazi ukaidi wa agano dhidi ya Mungu.
- source_word: וְלָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: na kuacha leo kumfuata Yahwe[a]
  rationale: Nahau ya Kiebrania inasema kugeuka kutoka nyuma ya Yahwe, yaani kuacha kumfuata. Tafsiri hii ni ya kawaida katika Kiswahili huku tanbihi ikihifadhi picha ya kugeuka au kurudi nyuma.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: kwa kujenga madhabahu
  rationale: Kitenzi-jina hiki kinaeleza njia ambayo uasi na kuacha kumfuata Yahwe kungetendeka.
- source_word: לְעֹלָה
  choice: kwa ajili ya sadaka ya kuteketezwa
  rationale: עֹלָה ni istilahi ya ibada kwa sadaka inayoteketezwa; tafsiri hii ni wazi na imezoeleka katika Kiswahili cha Biblia.
- source_word: לְמִנְחָה
  choice: sadaka ya nafaka
  rationale: Katika muktadha wa dhabihu, מִנְחָה ni sadaka ya mazao au nafaka, si sadaka kwa maana pana tu.
- source_word: וּלְזָבַח
  choice: au dhabihu
  rationale: זֶבַח hapa ni neno pana la dhabihu; halijabainisha aina maalumu, kwa hiyo tafsiri haiongezi aina isiyotajwa.
- source_word: מִלְּבַד
  choice: tofauti na
  rationale: Kirai hiki kinatofautisha madhabahu nyingine na madhabahu halali ya Yahwe bila kudokeza lazima kwamba moja ingebadilishwa na nyingine.
- source_word: מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: madhabahu ya Yahwe Mungu wetu
  rationale: Muundo huu unahifadhi wazi ungamo la agano, ‘Yahwe Mungu wetu.’
- source_word: אֲשֶׁר לִפְנֵי מִשְׁכָּנוֹ
  choice: iliyo mbele ya maskani yake
  rationale: ‘Maskani’ huonyesha mahali patakatifu pa kukaa kwa Mungu, na ‘yake’ huhifadhi kiambishi cha nafsi ya tatu katika Kiebrania; ‘mbele ya’ huhifadhi uhusiano wa mahali.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano YHWH. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Uhusiano kati ya kujenga madhabahu na uasi
  choice: kwa kujenga madhabahu
  alternative: kujenga madhabahu
  rationale: ‘Kwa kujenga’ huonyesha kwamba kujenga madhabahu ya dhabihu tofauti na ile iliyo mbele ya maskani kungekuwa namna ya kumwasi Yahwe na kuacha kumfuata, bila kudai kwamba kila madhabahu kwa kusudi lolote ni uasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Hasha kabisa’ huhifadhi nguvu ya kukataa; istilahi za ibada ‘madhabahu,’ ‘sadaka ya kuteketezwa,’ ‘sadaka ya nafaka,’ ‘dhabihu,’ na ‘maskani’ zimetumiwa kwa usahihi wa muktadha.
