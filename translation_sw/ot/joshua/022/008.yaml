source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם לֵ/אמֹ֗ר בִּ/נְכָסִ֨ים רַבִּ֜ים שׁ֤וּבוּ אֶל אָֽהֳלֵי/כֶם֙ וּ/בְ/מִקְנֶ֣ה רַב מְאֹ֔ד בְּ/כֶ֨סֶף וּ/בְ/זָהָ֜ב וּ/בִ/נְחֹ֧שֶׁת וּ/בְ/בַרְזֶ֛ל וּ/בִ/שְׂלָמ֖וֹת הַרְבֵּ֣ה מְאֹ֑ד חִלְק֥וּ שְׁלַל אֹיְבֵי/כֶ֖ם עִם אֲחֵי/כֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/008.yaml
  text: And he said to them[a], “Return to your tents with great wealth, with very much livestock, with silver and gold, with bronze and iron, and with very many garments[c][b]. Divide the plunder of your enemies with your brothers.”
translation:
  language: sw
  text: Akawaambia, “Rudini kwenye hema zenu mkiwa na mali nyingi, mifugo mingi sana, fedha, dhahabu, shaba[a], chuma, na mavazi mengi sana. Gawanyeni nyara za adui zenu pamoja na ndugu zenu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania linaweza kumaanisha shaba nyekundu au shaba ya aloi.
    reason: lexical_alternative
  - marker: b
    text: “Ndugu zenu” hapa ni Waisraeli wenzao wa makabila mengine.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם לֵאמֹר
  choice: Akawaambia
  rationale: Muundo huu wa kawaida wa Kiswahili unawasilisha kwa asili fomula ya Kiebrania ‘akawaambia, akisema’ bila kurudia kitenzi cha kusema.
- source_word: בִּנְכָסִים רַבִּים
  choice: mkiwa na mali nyingi
  rationale: נְכָסִים ni mali au vitu vinavyomilikiwa; ‘mali nyingi’ ni pana na inaeleweka kabla ya orodha inayofuata.
- source_word: שׁוּבוּ אֶל אָהֳלֵיכֶם
  choice: Rudini kwenye hema zenu
  rationale: ‘Hema’ huhifadhi mazingira ya kihistoria ya neno אָהֳלֵיכֶם badala ya kulifasiri moja kwa moja kuwa nyumba.
- source_word: וּבְמִקְנֶה רַב מְאֹד
  choice: mifugo mingi sana
  rationale: מִקְנֶה ni neno la jumla kwa wanyama wanaofugwa, na מְאֹד inaonyeshwa kwa ‘sana.’
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: fedha, dhahabu
  rationale: Haya ni majina ya moja kwa moja ya metali zilizotajwa; Kiswahili hakihitaji kurudia kihusishi mbele ya kila kitu katika orodha.
- source_word: וּבִנְחֹשֶׁת וּבְבַרְזֶל
  choice: shaba, chuma
  rationale: נְחֹשֶׁת inaweza kuwa shaba nyekundu au shaba ya aloi kulingana na muktadha; ‘shaba’ ni neno la kawaida la Kiswahili, huku tanbihi ikihifadhi uwezekano huo. בַּרְזֶל ni chuma.
- source_word: וּבִשְׂלָמוֹת הַרְבֵּה מְאֹד
  choice: na mavazi mengi sana
  rationale: שְׂלָמוֹת ni mavazi au nguo; ‘mavazi’ ni pana, ya heshima, na ‘mengi sana’ huhifadhi msisitizo.
- source_word: חִלְקוּ
  choice: Gawaneni
  rationale: Ni amri kwa watu wengi. ‘Gawaneni’ hutoa maana ya kugawana vitu kati yao, inayofaa pamoja na עִם ‘pamoja na.’
- source_word: שְׁלַל אֹיְבֵיכֶם
  choice: nyara mlizoteka kutoka kwa adui zenu
  rationale: שָׁלָל ni mali iliyotekwa vitani. ‘Nyara mlizoteka’ huweka wazi maana hiyo ya kijeshi kwa Kiswahili cha sasa.
- source_word: עִם אֲחֵיכֶם
  choice: pamoja na ndugu zenu
  rationale: אָחִים kwa msingi ni ndugu wa kiume lakini hapa inarejelea Waisraeli wenzao. ‘Ndugu zenu’ ni usemi wa asili wa Kiswahili unaohifadhi uhusiano wa kindugu bila kulazimisha ufafanuzi ndani ya mstari.
theological_decisions:
- issue: Upeo wa neno la kindugu אֲחֵיכֶם
  choice: pamoja na ndugu zenu
  alternative: pamoja na Waisraeli wenzenu
  rationale: Kiebrania hutumia neno la kindugu la wingi wa kiume, lakini katika muktadha linawahusu watu wa makabila mengine ya Israeli. Tafsiri kuu huhifadhi taswira ya kindugu, na tanbihi hufafanua rejeo lake bila kuondoa mvutano wa neno la asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha umefanywa kuwa wa asili katika Kiswahili huku msisitizo wa ‘mingi sana’ ukihifadhiwa. ‘Hema’ na ‘nyara’ zinadumisha mazingira ya kihistoria na kijeshi ya mstari.
