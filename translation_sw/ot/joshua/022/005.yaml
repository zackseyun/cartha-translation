language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: רַ֣ק שִׁמְר֣וּ מְאֹ֗ד לַ/עֲשׂ֨וֹת אֶת הַ/מִּצְוָ֣ה וְ/אֶת הַ/תּוֹרָה֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֮ מֹשֶׁ֣ה עֶֽבֶד יְהוָה֒ לְ֠/אַהֲבָה אֶת יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם וְ/לָ/לֶ֧כֶת בְּ/כָל דְּרָכָ֛י/ו וְ/לִ/שְׁמֹ֥ר מִצְוֺתָ֖י/ו וּ/לְ/דָבְקָה ב֑/וֹ וּ/לְ/עָבְד֕/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/005.yaml
  text: 'Only be very careful to do the commandment and the law that Moses the servant of Yahweh commanded you: to love Yahweh your God[a], to walk in all his ways, to keep his commandments, to cling to him, and to serve him with all your heart and with all your soul.'
translation:
  language: sw
  text: 'Lakini jihadharini sana kutekeleza amri na sheria[a] ambazo Musa, mtumishi wa Yahweh, aliwaamuru ninyi: kumpenda Yahweh Mungu wenu, kutembea katika njia zake zote, kuzishika amri zake, kushikamana naye, na kumtumikia kwa moyo wenu wote na kwa nafsi yenu yote.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “mafundisho” badala ya “sheria” (Kiebrania: torah).'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Ila
  rationale: Katika muktadha huu neno linaweka msisitizo wenye sharti baada ya kuwaruhusu waondoke; “Ila” ni ya kawaida na ina nguvu ya himizo.
- source_word: שִׁמְרוּ מְאֹד
  choice: mjihadhari sana
  rationale: Muundo huu ni onyo la kuchukua tahadhari kubwa, si agizo la ‘kushika’ tu.
- source_word: לַעֲשׂוֹת
  choice: kutekeleza
  rationale: Kitenzi kinaeleza kutenda kwa vitendo yale yaliyoamriwa; “kutekeleza” ni wazi na asilia katika Kiswahili.
- source_word: הַמִּצְוָה
  choice: amri
  rationale: Huhifadhi maana ya agizo lenye mamlaka na sauti yake ya agano.
- source_word: הַתּוֹרָה
  choice: sheria
  rationale: Katika muktadha wa Musa, “sheria” ndiyo tafsiri inayotambulika zaidi; maana halali ya “mafundisho” imehifadhiwa katika tanbihi.
- source_word: עֶבֶד יְהוָה
  choice: mtumishi wa Yahweh
  rationale: Hapa עֶבֶד ni cheo cha heshima cha Musa; “mtumishi” linafaa kuliko “mtumwa.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetoholewa badala ya kubadilishwa na cheo.
- source_word: וְלָלֶכֶת בְּכָל דְּרָכָיו
  choice: kutembea katika njia zake zote
  rationale: Huhifadhi sitiari ya Kiebrania ya mwenendo wa kimaadili na wa kiagano huku ikibaki kueleweka.
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: kuzishika amri zake
  rationale: “Kushika amri” ni usemi wa kawaida wa Kiswahili unaoonyesha utii wa kudumu.
- source_word: וּלְדָבְקָה בּוֹ
  choice: kushikamana naye
  rationale: Huwasilisha ukaribu na uaminifu thabiti unaodokezwa na kitenzi cha Kiebrania.
- source_word: וּלְעָבְדוֹ
  choice: kumtumikia
  rationale: Huhifadhi maana pana ya huduma ya utiifu kwa Mungu bila kuibana iwe ibada pekee.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano moja kwa moja; “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Sitiari za kimaadili za agano
  choice: kutembea katika njia zake zote ... kushikamana naye
  alternative: kuishi kulingana na mapenzi yake ... kudumu mwaminifu kwake
  rationale: Tafsiri iliyochaguliwa huhifadhi picha na uzito wa uhusiano uliomo katika Kiebrania bila kufafanua zaidi ya chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mfuatano wa vitenzi vya agano umehifadhiwa, na maumbo ya pamoja “moyo wenu wote” na “nafsi yenu yote” yanaakisi msisitizo wa chanzo.
