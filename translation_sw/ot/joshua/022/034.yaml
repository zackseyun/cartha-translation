  text: וַֽ/יִּקְרְא֛וּ בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד לַ/מִּזְבֵּ֑חַ כִּ֣י עֵ֥ד הוּא֙ בֵּֽינֹתֵ֔י/נוּ כִּ֥י יְהוָ֖ה הָ/אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/034.yaml
  text: And the sons of Reuben and the sons of Gad called the altar Witness[a], for it is a witness between us that Yahweh is God.
translation:
  language: sw
  text: Nao wana wa Reubeni na wana wa Gadi wakaiita madhabahu “Shahidi”[a], kwa maana ni shahidi kati yetu kwamba Yahwe ndiye Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa upana zaidi, “wakaiita madhabahu ‘Shahidi Kati Yetu Kwamba Yahwe Ndiye Mungu,’” ikiwa kifungu cha maelezo kinachukuliwa kuwa sehemu ya jina badala ya kuwa sababu ya jina hilo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: wakaiita
  rationale: Kitenzi קרא pamoja na ל hapa kina maana ya kuita au kuipa kitu jina; “wakaiita” ni Kiswahili cha kawaida kinachobeba maana hiyo.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: wana wa Reubeni na wana wa Gadi
  rationale: Huhifadhi kwa uwazi muundo wa Kiebrania na uhusiano wa makabila na mababu wao.
- source_word: לַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida na lenye heshima kwa מִזְבֵּחַ; hapa ndiyo kitu kinachopewa jina.
- source_word: עֵד
  choice: Shahidi
  rationale: עֵד humaanisha shahidi; herufi kubwa na alama za kunukuu zinaonyesha kwamba neno hili linatumika kama jina la madhabahu.
- source_word: כִּי עֵד הוּא
  choice: kwa maana ni shahidi
  rationale: כִּי ya kwanza inaingiza maelezo au sababu ya jina, na “kwa maana” huwasilisha uhusiano huo kwa Kiswahili cha asili.
- source_word: בֵּינֹתֵינוּ
  choice: kati yetu
  rationale: Huonyesha uhusiano wa ushuhuda kati ya pande zinazowakilishwa na makabila hayo.
- source_word: כִּי יְהוָה הָאֱלֹהִים
  choice: kwamba Yahwe ndiye Mungu
  rationale: כִּי ya pili inaingiza maudhui ya ushuhuda. “Ndiye Mungu” huwasilisha nguvu ya ungamo la Kiebrania bila kuongeza maelezo yasiyokuwapo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kwa namna ya kulitaja moja kwa moja badala ya kulibadilisha kuwa cheo.
theological_decisions:
- issue: Ikiwa kifungu chote cha maelezo kinapaswa kuchukuliwa kuwa jina rasmi la madhabahu
  choice: Katika matini kuu, “Shahidi” pekee limetolewa kama jina, kisha kifungu kinachofuata kama sababu au maelezo yake.
  alternative: Wakaiita madhabahu “Shahidi Kati Yetu Kwamba Yahwe Ndiye Mungu.”
  rationale: Matini ya Kimasora iliyopo haionyeshi wazi jina refu; עֵד inaweza kuwa jina linalofuatwa na maelezo. Hata hivyo, uwezekano wa kuona kifungu kizima kama jina umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “wana wa Reubeni na wana wa Gadi” umehifadhiwa kwa uwazi wa kimat文; “Nao” huunganisha mstari na simulizi linalotangulia. Jina “Shahidi” limetiwa alama za kunukuu ili kazi yake kama jina ionekane.
