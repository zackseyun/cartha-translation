  text: הֲ/ל֣וֹא עָכָ֣ן בֶּן זֶ֗רַח מָ֤עַל מַ֨עַל֙ בַּ/חֵ֔רֶם וְ/עַֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל הָ֣יָה קָ֑צֶף וְ/הוּא֙ אִ֣ישׁ אֶחָ֔ד לֹ֥א גָוַ֖ע בַּ/עֲוֺנֽ/וֹ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/020.yaml
  text: Was it not Achan son of Zerah who acted unfaithfully in the matter of what was devoted to destruction, and wrath came upon all the congregation of Israel? Yet he was not the only man who perished in his iniquity.
translation:
  language: sw
  text: Je, si Akani mwana wa Zera aliyekosa uaminifu kuhusu kile kilichowekwa wakfu kwa ajili ya kuangamizwa, na ghadhabu ikalijia kusanyiko lote la Israeli? Naye hakufa peke yake kwa sababu ya uovu wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָעַל מַעַל
  choice: aliyekosa uaminifu
  rationale: Muundo huu wa Kiebrania unasisitiza kutenda kwa kukiuka uaminifu; Kiswahili hiki ni cha asili na kinahifadhi wazo la usaliti wa agano bila kuongeza maelezo.
- source_word: בַחֵרֶם
  choice: kuhusu kile kilichowekwa wakfu kwa ajili ya kuangamizwa
  rationale: חֵרֶם hapa hurejelea mali iliyotengwa kwa amri ya Mungu ili iangamizwe; tafsiri hii inaepuka neno lisiloeleweka la kiufundi huku ikihifadhi kusudi lake katika simulizi.
- source_word: קָצֶף
  choice: ghadhabu
  rationale: Hutoa uzito wa hasira ya hukumu inayodokezwa na neno la Kiebrania.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: kusanyiko lote la Israeli
  rationale: עֵדָה ni jamii au kusanyiko lililoundwa; 'kusanyiko' linafaa katika muktadha huu kuliko kundi lisilo rasmi.
- source_word: לֹא גָוַע בַּעֲוֹנוֹ
  choice: hakuwa mtu pekee aliyekufa kwa sababu ya uovu wake
  rationale: Huwasilisha maana kwamba matokeo ya kosa lake hayakumpata yeye peke yake, huku 'kwa sababu ya' ikionyesha uhusiano wa kosa na kifo bila kulazimisha tafsiri finyu ya kiufundi.
theological_decisions:
- issue: Uwajibikaji wa mtu mmoja na athari kwa jamii
  choice: Naye hakuwa mtu pekee aliyekufa kwa sababu ya uovu wake
  alternative: Naye hakufa peke yake katika uovu wake
  rationale: Chaguo linaweka wazi maana ya kimuktadha kwamba wengine waliathiriwa na kosa la Akani, bila kufuta mvutano wa kifungu kati ya hatia binafsi na hukumu iliyoifikia jamii.
- issue: Maana ya חֵרֶם
  choice: kile kilichowekwa wakfu kwa ajili ya kuangamizwa
  alternative: kitu kilicholaaniwa
  rationale: Neno la chanzo linahusu kitu kilichotengwa chini ya marufuku ya kiibada, mara nyingi kwa kuangamizwa; 'kilicholaaniwa' kingeweza kudokeza tu hali ya kuwa chini ya laana na kupoteza wazo la kutengwa wakfu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Swali la balagha na tofauti kati ya kosa la mtu mmoja na athari zake kwa kusanyiko lote zimehifadhiwa.
