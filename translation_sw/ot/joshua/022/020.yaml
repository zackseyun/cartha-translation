  terminology: Majina «Akani» na «Zera» yanafuata matumizi ya kawaida ya Kiswahili cha Biblia. «Kile kilichowekwa wakfu kwa ajili ya kuangamizwa» hueleza חֵרֶם kwa uelewekevu bila kulifanya kuwa istilahi ya kiufundi isiyoeleweka; «ghadhabu» na «kusanyiko» zina register inayofaa.
