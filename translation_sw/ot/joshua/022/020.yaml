  source_fidelity: Kifungu cha mwisho katika rasimu kinaelekeza kwamba watu wengine walikufa «kwa sababu ya uovu wake [Akani]». Kiebrania וְהוּא אִישׁ אֶחָד לֹא גָוַע בַּעֲוֹנוֹ husema kwa uangalifu kwamba mtu huyo hakupotea/ hakufa peke yake katika (au kwa) uovu wake. Marekebisho yanahifadhi mkazo huo bila kufafanua kupita kiasi ni nani hasa walioathiriwa au msingi wa hatia yao. Kiunganishi cha וְ kabla ya «ghadhabu» pia ni cha uambatanisho, si cha matokeo kinachosisitizwa na «hata».
