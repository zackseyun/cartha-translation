  yaml_path: translation/ot/joshua/022/012.yaml
  text: When the sons of Israel heard[b][a], the whole congregation of the sons of Israel assembled at Shiloh to go up against them for war.
translation:
  language: sw
  text: Wana wa Israeli[a] wakasikia, na kusanyiko lote la wana wa Israeli likakusanyika Shilo ili kwenda kupigana nao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania ni “wana wa Israeli” kihalisi.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania ni “kupanda dhidi yao kwa vita,” nahau ya kawaida inayomaanisha kuchukua hatua ya kijeshi dhidi yao.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: waliposikia
  rationale: Kitenzi שׁמע hapa kina maana ya ‘kusikia.’ Muundo wa ‘waliposikia’ unaunganisha kwa Kiswahili cha kawaida kitendo hiki na kukusanyika kulikofuata, bila kuongeza kitu walichosikia ambacho hakitajwi wazi katika mstari huu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Hii inafuata kwa karibu usemi wa Kiebrania, ambao kihalisi ni ‘wana wa Israeli,’ na inatumiwa kwa uthabiti katika sehemu zote mbili za mstari.
- source_word: וַיִּקָּהֲלוּ
  choice: lilikusanyika
  rationale: Mzizi קהל unaonyesha kukusanyika kwa jumuiya; ‘lilikusanyika’ ni usemi wa kawaida na unaofaa kwa tendo rasmi la kusanyiko.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: kusanyiko lote la wana wa Israeli
  rationale: עֵדָה ni jumuiya au kusanyiko lililokusanyika, na כָּל inaonyeshwa kwa ‘lote.’
- source_word: שִׁלֹה
  choice: Shilo
  rationale: Jina la mahali limetoholewa kwa tahajia ya Kiswahili.
- source_word: לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  choice: ili kwenda kupigana nao
  rationale: Kirai hiki ni nahau ya kijeshi yenye maana ya kwenda dhidi yao kwa vita. Tafsiri hii ni ya asili katika Kiswahili huku tanbihi ikihifadhi uwazi kuhusu umbo la nahau ya Kiebrania.
