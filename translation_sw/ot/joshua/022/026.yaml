  text: So we said[b][a], ‘Let us now build for ourselves the altar—not for burnt offering and not for sacrifice.’
translation:
  language: sw
  text: Kwa hiyo tukasema[a], “Sasa tujijengee madhabahu[b]—si kwa ajili ya sadaka ya kuteketezwa wala si kwa ajili ya dhabihu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ndipo tukasema” au “Na tukasema.” Kiunganishi cha Kiebrania kinaweza kutafsiriwa kwa njia mbalimbali kulingana na jinsi kauli hii inavyohusishwa na mstari uliotangulia.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, kihalisi, “Na tufanye kwa ajili yetu, kujenga madhabahu”—muundo unaotafsiriwa kiasili, “Tujijengee madhabahu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Kwa hiyo tukasema
  rationale: Kauli ya wayyiqtol katika nafsi ya kwanza wingi inaendeleza maelezo ya kundi na hapa ina nguvu ya kimatokeo; ‘Kwa hiyo tukasema’ inaunganisha kwa kawaida na mstari uliotangulia bila kuficha uwezekano wa ‘Ndipo’ au ‘Na.’
- source_word: נַעֲשֶׂה נָּא לָנוּ לִבְנוֹת
  choice: Basi na tujijengee
  rationale: Muundo wa Kiebrania, kihalisi ‘na tujifanyie, kujenga,’ ni nahau inayoonyesha azimio au pendekezo. ‘Basi na tujijengee’ ni Kiswahili cha kawaida kinachobeba msisitizo wa נָּא na maana ya manufaa binafsi ya לָנוּ.
- source_word: אֶת הַמִּזְבֵּחַ
  choice: madhabahu
  rationale: Nomino yenye kibainishi katika Kiebrania inarejelea madhabahu mahususi inayozungumziwa. Kiswahili hakihitaji kibainishi tofauti hapa; muktadha huonyesha umahususi huo.
- source_word: לֹא לְעוֹלָה
  choice: si kwa ajili ya sadaka ya kuteketezwa
  rationale: עוֹלָה ni sadaka inayoteketezwa madhabahuni; tafsiri hii huhifadhi istilahi ya ibada na kusudi linalokanushwa.
- source_word: וְלֹא לְזָבַח
  choice: wala si kwa ajili ya dhabihu
  rationale: זֶבַח ni neno pana la dhabihu, tofauti hapa na sadaka ya kuteketezwa. ‘Wala si’ huwasilisha ukanushaji wa pili kwa Kiswahili cha kawaida na chenye hadhi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Basi na tujijengee’ ni pendekezo la pamoja linalosomeka kwa urahisi; istilahi ‘sadaka ya kuteketezwa’ na ‘dhabihu’ zinadumisha tofauti ya maneno ya ibada katika chanzo.
