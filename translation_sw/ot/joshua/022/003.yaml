base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/003.yaml
  text: You have not forsaken your brothers these many days[a], up to this day, and you have kept the charge of the commandment of Yahweh your God.
translation:
  language: sw
  text: Hamjawaacha ndugu zenu[a] kwa muda mrefu, hadi leo, nanyi meshika wajibu wa amri ya Yahwe, Mungu wenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli wenzenu.” Neno la Kiebrania ni wingi wa kiume, “ndugu zenu,” na katika muktadha huu linaweza kuwahusu kwa upana watu wengine wa Israeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזַבְתֶּם
  choice: hamkuwaacha
  rationale: Kitenzi עזב kina maana ya kuacha au kutelekeza. “Hamkuwaacha” ni Kiswahili cha kawaida kinachoonyesha kwamba hawakujitenga na ndugu zao katika kipindi chote kinachotajwa.
- source_word: אֲחֵיכֶם
  choice: ndugu zenu
  rationale: Neno la Kiebrania ni wingi wa kiume wa neno “ndugu,” lakini hapa linawahusu kwa upana Waisraeli wenzao. “Ndugu zenu” huhifadhi lugha ya undugu wa agano bila kuifanya kuwa ya jinsia moja tu katika matumizi ya kawaida ya Kiswahili.
- source_word: זֶה יָמִים רַבִּים
  choice: kwa muda wote huu mrefu
  rationale: Nahau hii inaonyesha kipindi kirefu kilichodumu hadi wakati wa kusema. Tafsiri hii ni ya asili katika Kiswahili na huhifadhi msisitizo wa urefu na mwendelezo wa kipindi hicho.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo hii
  rationale: Hii ni kauli ya wakati inayoonyesha mwendelezo kutoka zamani hadi siku yenyewe ya kusema. “Leo hii” huhifadhi msisitizo wa הַזֶּה.
- source_word: וּשְׁמַרְתֶּם
  choice: nanyi mmeendelea kutekeleza
  rationale: שׁמר hapa ni kushika au kutunza wajibu kwa uaminifu. “Mmeendelea kutekeleza” huonyesha utii uliodumu katika kipindi chote bila kudokeza tu tendo lililokwisha mara moja.
- source_word: מִשְׁמֶרֶת מִצְוַת
  choice: wajibu wa kuitii amri
  rationale: 'Muundo huu unahusu jukumu walilokabidhiwa la kushika amri. Kiswahili hiki ni wazi na cha asili huku kikihifadhi vipengele vyote viwili: wajibu na amri.'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetafsiriwa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Hii ni tafsiri ya moja kwa moja ya usemi wa agano unaomtaja Yahwe kuwa Mungu wao.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Chanzo kinatumia jina la Mungu moja kwa moja. “Yahwe” hulihifadhi kama jina binafsi badala ya kulibadilisha kuwa cheo.
- issue: Upeo wa neno אֲחֵיכֶם
  choice: ndugu zenu
  alternative: Waisraeli wenzenu
  rationale: Neno la msingi ni la undugu, ingawa katika muktadha linawahusu Waisraeli wenzao kwa upana. Maandishi makuu yanahifadhi picha ya kindugu, na tanbihi inaeleza upeo wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kwa muda wote huu mrefu” limetumiwa badala ya tafsiri neno kwa neno “siku hizi nyingi,” ambayo si ya kawaida katika Kiswahili cha sasa.
