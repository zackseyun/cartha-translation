  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: אֵל֩ אֱלֹהִ֨ים יְהוָ֜ה אֵ֣ל אֱלֹהִ֤ים יְהוָה֙ ה֣וּא יֹדֵ֔עַ וְ/יִשְׂרָאֵ֖ל ה֣וּא יֵדָ֑ע אִם בְּ/מֶ֤רֶד וְ/אִם בְּ/מַ֨עַל֙ בַּֽ/יהוָ֔ה אַל תּוֹשִׁיעֵ֖/נוּ הַ/יּ֥וֹם הַ/זֶּֽה׀׀׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/022.yaml
  text: 'The Mighty One[a], God, Yahweh! The Mighty One, God, Yahweh! He knows, and Israel itself will know: if it was in rebellion, or if in unfaithfulness against Yahweh[b], do not save us this day.'
translation:
  language: sw
  text: 'Mwenye Nguvu[a], Mungu, Yahweh! Mwenye Nguvu, Mungu, Yahweh! Yeye anajua, na Israeli yenyewe itajua: ikiwa ilikuwa ni kwa uasi, au ikiwa ilikuwa ni kwa kukosa uaminifu dhidi ya Yahweh[b], usituokoe leo hii.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinarudia mfuatano wa majina ya kimungu mara mbili: “El, Elohim, Yahweh; El, Elohim, Yahweh.” Huu ni mwito wa kusisitiza, ulio kama kiapo.'
    reason: cultural_note
  - marker: b
    text: Au “kwa kuvunja uaminifu” au “kwa kutokuwa mwaminifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: Mwenye Nguvu, Mungu, Yahweh
  rationale: Inahifadhi majina matatu ya mwito wa Kiebrania na uzito wa אֵל kama cheo kinachoonyesha nguvu, bila kuyafanya yote kuwa jina moja. Mfuatano wote umerudiwa kama ulivyo katika chanzo.
- source_word: הוּא יֹדֵעַ
  choice: Yeye anajua
  rationale: Kiwakilishi ‘Yeye’ kinahifadhi msisitizo wa הוּא, na ‘anajua’ ni Kiswahili cha kawaida kwa maana ya sasa.
- source_word: וְיִשְׂרָאֵל הוּא יֵדָע
  choice: na Israeli yenyewe itajua
  rationale: ‘Yenyewe’ linaonyesha msisitizo wa kiwakilishi הוּא, huku wakati ujao wa יֵדָע ukihifadhiwa kwa ‘itajua’.
- source_word: אִם בְּמֶרֶד
  choice: ikiwa ni kwa uasi
  rationale: Neno מֶרֶד lina maana ya uasi au kuasi mamlaka. Muundo huu unahifadhi ufupi wa sharti la Kiebrania bila kuongeza kitendo kisichotajwa wazi.
- source_word: וְאִם בְּמַעַל
  choice: au ikiwa ni kwa kukosa uaminifu
  rationale: מַעַל huonyesha kuvunja uaminifu au kutenda kwa hiana, hasa katika uhusiano wa agano. ‘Kukosa uaminifu’ ni ya kawaida na inaeleweka katika Kiswahili cha sasa.
- source_word: בַּיהוָה
  choice: kwa Yahweh
  rationale: Katika muktadha huu, ‘kwa Yahweh’ inaonyesha kwamba ukosefu huo wa uaminifu umeelekezwa kwake, huku jina la agano likihifadhiwa.
- source_word: אַל תּוֹשִׁיעֵנוּ
  choice: usituokoe
  rationale: Ni ombi hasi lenye nguvu linaloelekezwa kwa Mungu. Kitenzi ‘okoa’ kinatoa moja kwa moja maana ya Hiphil ya ישׁע.
- source_word: הַיּוֹם הַזֶּה
  choice: leo hii
  rationale: ‘Leo hii’ huhifadhi msisitizo na uzito wa usemi wa Kiebrania kuliko ‘leo’ peke yake.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Jina la agano limetolewa moja kwa moja kama ‘Yahweh’, bila kulibadilisha kuwa cheo.
- issue: Nguvu ya kurudiwa kwa majina ya Mungu
  choice: Mfuatano kamili ‘Mwenye Nguvu, Mungu, Yahweh’ umerudiwa mara mbili
  alternative: Kuunganisha majina hayo katika cheo kimoja au kutaja mfuatano mara moja tu
  rationale: Kurudiwa huko ni mwito wa kusisitiza, ulio karibu na kiapo. Kulihifadhi kunadumisha uzito wa usemi bila kuamua zaidi ya chanzo kuhusu muundo wake kamili.
- issue: Msemaji wa ‘usituokoe’
  choice: Ombi kwa Yahweh katika nafsi ya pili umoja
  alternative: Kauli kuhusu Israeli kutowaokoa
  rationale: Umbo la kitenzi תּוֹשִׁיעֵנוּ ni nafsi ya pili umoja na katika muktadha wa mwito uliotangulia linaelekezwa kwa Yahweh.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Marudio na muundo mfupi wa masharti umehifadhiwa ili kudumisha uzito wa kiapo cha chanzo.
