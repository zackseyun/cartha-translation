base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/030.yaml
  text: When Phinehas the priest[a], the leaders of the congregation, and the heads of the thousands of Israel who were with him heard the words that the sons of Reuben, the sons of Gad, and the sons of Manasseh spoke[b], it was good in their eyes.
translation:
  language: sw
  text: Finehasi kuhani, viongozi wa kusanyiko, na wakuu wa maelfu ya Israeli[a] waliokuwa pamoja naye waliposikia maneno ambayo wana wa Reubeni, wana wa Gadi, na wana wa Manase walisema, maneno hayo yakawa mema machoni pao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kwa neno halisi, “wakuu wa maelfu ya Israeli.” Huenda “maelfu” hapa yakamaanisha vikundi vya koo au sehemu za makabila, si lazima idadi kamili ya watu elfu moja.
    reason: lexical_alternative
  - marker: b
    text: Yaani, maneno hayo yaliwapendeza au waliona kuwa ni mema.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: waliposikia
  rationale: Kitenzi שׁמע hapa kina maana ya kusikia. Muundo wa ‘waliposikia ... yakawa’ unaendeleza kwa Kiswahili mfuatano wa matukio ya simulizi la Kiebrania.
- source_word: פִּינְחָס הַכֹּהֵן
  choice: Finehasi kuhani
  rationale: Jina limeandikwa kwa namna iliyozoeleka katika Kiswahili cha Biblia, na התואר הַכֹּהֵן imetafsiriwa moja kwa moja kuwa ‘kuhani.’
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: viongozi wa kusanyiko
  rationale: נְשִׂיאִים ni viongozi wenye mamlaka, na עֵדָה hapa ni jamii iliyokusanyika; ‘kusanyiko’ ni neno la kawaida, lenye heshima, lisiloingiza cheo kisichotajwa.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: wakuu wa maelfu ya Israeli
  rationale: 'Tafsiri hii inahifadhi usemi wa Kiebrania na kutokuamuliwa kwake: אַלְפֵי inaweza kumaanisha maelfu au vikundi vya kijamii/kikabila vinavyoitwa kwa jina hilo. Tanbihi inaeleza uwezekano huo.'
- source_word: אֲשֶׁר אִתּוֹ
  choice: waliokuwa pamoja naye
  rationale: Kifungu hiki kinahifadhi kiwakilishi cha Kiebrania na kinaonyesha kwamba viongozi hao walikuwa pamoja na Finehasi.
- source_word: הַדְּבָרִים אֲשֶׁר דִּבְּרוּ
  choice: maneno ambayo ... walisema
  rationale: ‘Maneno’ yanafaa kwa muktadha wa hotuba, huku ‘walisema’ ikitoa Kiswahili cha kawaida bila kupoteza uhusiano wa nomino na kitenzi.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וּבְנֵי מְנַשֶּׁה
  choice: wana wa Reubeni, wana wa Gadi, na wana wa Manase
  rationale: Kurudia ‘wana wa’ kunahifadhi muundo, mkazo, na utambulisho wa makabila katika maandishi ya Kiebrania.
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: maneno hayo yakawa mema machoni pao
  rationale: Usemi huu unahifadhi nahau ya Kiebrania ‘ikawa njema machoni pao’ huku kurejelea ‘maneno hayo’ kukifanya Kiswahili kiwe wazi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. Muundo wa ‘mema machoni pao’ umehifadhi ladha ya nahau ya Kiebrania, huku tanbihi ikitoa maana yake ya kawaida. Alama zote za tanbihi zimewekwa karibu na maneno yanayoelezwa.
