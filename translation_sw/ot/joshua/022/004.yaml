  to: Sasa Yahwe, Mungu wenu, amewapa ndugu zenu[a] pumziko, kama alivyowaambia.[b] Basi sasa geukeni, mwende kwenye mahema yenu katika nchi mnayomiliki, ambayo Musa, mtumishi wa Yahwe, aliwapa ng’ambo ya Yordani.[d]
  rationale: 'Marekebisho yanaweka alama ya uandishi baada ya ‘Yahwe’ kwa uwazi wa kiambajengo, na kuboresha muundo wa lengwa la kurejea: mahema yamo katika nchi waliyopewa kuimiliki. Pia ‘nchi mnayomiliki’ hutoa maana ya אֲחֻזָּה kwa Kiswahili cha kawaida. Tanbihi c imehifadhiwa kwa kuwa inaeleza mbadala halali wa ‘mahema,’ ingawa rasimu haikuwa imeiweka alama yake katika matini; ili seti ya alama ilingane, alama c inapaswa kuongezwa baada ya ‘mahema yenu’ katika utekelezaji wa matini.'
