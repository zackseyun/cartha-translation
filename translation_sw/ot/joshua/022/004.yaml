id: JOS.22.4
reference: Joshua 22:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֵנִ֨יחַ יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ לַֽ/אֲחֵי/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר לָ/הֶ֑ם וְ/עַתָּ֡ה פְּנוּ֩ וּ/לְכ֨וּ לָ/כֶ֜ם לְ/אָהֳלֵי/כֶ֗ם אֶל אֶ֨רֶץ֙ אֲחֻזַּתְ/כֶ֔ם אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/004.yaml
  text: And now Yahweh your God has given rest to your brothers[a], just as he spoke to them. So now turn and go to your tents, to the land of your possession[d][c][b], which Moses the servant of Yahweh gave you beyond the Jordan.
translation:
  language: sw
  text: Sasa Yahwe, Mungu wenu, amewapa ndugu zenu[a] pumziko, kama alivyowaambia.[b] Basi sasa geukeni, mwende kwenye mahema yenu katika nchi mnayomiliki, ambayo Musa, mtumishi wa Yahwe, aliwapa ng’ambo ya Yordani.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu zenu” hapa ni Waisraeli wenzao.
    reason: lexical_alternative
  - marker: b
    text: Au, “kama alivyowaahidi.” Kiebrania kinasema kihalisi, “kama alivyowaambia.”
    reason: lexical_alternative
  - marker: d
    text: Au, “upande mwingine wa Yordani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵנִיחַ
  choice: amewapa ... pumziko
  rationale: Hifili ya נוח ina maana ya kusababisha wapumzike au kuwapa utulivu baada ya vita. Kauli hii ni ya kawaida katika Kiswahili na inadumisha taswira ya pumziko.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama “BWANA”.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Katika muundo huu, אֱלֹהִים humrejelea Mungu wa Israeli kwa maana ya umoja.
- source_word: לַאֲחֵיכֶם
  choice: ndugu zenu
  rationale: Neno la Kiebrania ni la kiume katika wingi, lakini hapa linamaanisha Waisraeli wenzao; “ndugu zenu” hudumisha mshikamano wa kikabila bila kulazimisha maana ya ndugu wa tumbo.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: kama alivyowaambia
  rationale: דבר kimsingi ni kusema au kunena. Tafsiri hii inadumisha wording ya chanzo bila kuibadili moja kwa moja kuwa “alivyowaahidi,” ingawa muktadha unahusu ahadi.
- source_word: פְּנוּ וּלְכוּ לָכֶם
  choice: geukeni, mwende
  rationale: פְּנוּ ni agizo la kugeuka, nalo linafuatwa na agizo la kwenda. Dativu לָכֶם haihitaji kutafsiriwa kando katika Kiswahili.
- source_word: לְאָהֳלֵיכֶם
  choice: kwenye mahema yenu
  rationale: Tafsiri ya moja kwa moja ni “mahema yenu.” Inaweza kumaanisha makazi kwa upana, lakini kutaja mahema kunahifadhi mazingira ya kihistoria.
- source_word: אֶל אֶרֶץ אֲחֻזַּתְכֶם
  choice: katika nchi ya milki yenu
  rationale: אֲחֻזָּה ni ardhi inayomilikiwa au fungu la kudumu. “Milki” huonyesha umiliki huo bila kuingiza moja kwa moja dhana tofauti ya urithi.
- source_word: אֲשֶׁר נָתַן לָכֶם מֹשֶׁה
  choice: ambayo Musa ... aliwapa
  rationale: נתן ni kitenzi cha kawaida cha kutoa; “aliwapa” kinakaribia chanzo kuliko ufafanuzi kama “aliwagawia.”
- source_word: עֶבֶד יְהוָה
  choice: mtumishi wa Yahwe
  rationale: Ingawa עבד inaweza kumaanisha mtumwa au mtumishi, hapa ni cheo cha heshima cha Musa katika uhusiano wake na Yahwe.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ng’ambo ya Yordani
  rationale: Kirai hiki huonyesha upande mwingine wa Yordani kwa kutegemea mahali pa msemaji. “Ng’ambo ya Yordani” ni kifupi na kinadumisha mtazamo huo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi la agano יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya “kama alivyowaambia”
  choice: Kudumisha kitenzi cha kusema
  alternative: kama alivyowaahidi
  rationale: Muktadha unaonyesha kwamba maneno hayo yalikuwa ahadi, lakini Kiebrania chenyewe kinasema “kama alivyosema/kuwaambia.” Tafsiri kuu haifuti tofauti hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima, na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umebaki karibu na Kiebrania bila kuwa mgumu; “pumziko,” “mahema,” na “milki” zinahifadhi taswira na istilahi kuu za chanzo.
