  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לַ/חֲצִ֣י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֗ה נָתַ֣ן מֹשֶׁה֮ בַּ/בָּשָׁן֒ וּ/לְ/חֶצְי֗/וֹ נָתַ֤ן יְהוֹשֻׁ֨עַ֙ עִם אֲחֵי/הֶ֔ם מ/עבר הַ/יַּרְדֵּ֖ן יָ֑מָּ/ה וְ֠/גַם כִּ֣י שִׁלְּחָ֧/ם יְהוֹשֻׁ֛עַ אֶל אָהֳלֵי/הֶ֖ם וַ/יְבָרֲכֵֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/007.yaml
  text: To the one half-tribe of Manasseh Moses had given land in Bashan[a], but to the other half Joshua gave land with their brothers beyond the Jordan westward. And when Joshua sent them away to their tents, he blessed them.
translation:
  language: sw
  text: Musa alikuwa ameipa nusu moja ya kabila la Manase eneo katika Bashani, lakini Yoshua aliipa nusu nyingine eneo pamoja na ndugu zao[a] ng’ambo ya Yordani upande wa magharibi. Tena Yoshua alipowaaga waende kwenye mahema yao, aliwabariki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Waisraeli wenzao wa makabila mengine.
    reason: Ufafanuzi huu unaonyesha kwamba ‘ndugu zao’ si lazima ndugu wa familia moja, bali washiriki wa taifa la Israeli.
lexical_decisions:
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: nusu moja ya kabila la Manase
  rationale: ‘Nusu moja’ huonyesha wazi kuwa hii ni sehemu moja kati ya sehemu mbili za kabila la Manase.
- source_word: נָתַן מֹשֶׁה
  choice: Musa alikuwa ameipa
  rationale: Kauli hii inatangulia ugawaji uliofanywa na Yoshua; wakati timilifu unaonyesha kwa kawaida kwamba tendo la Musa lilikuwa limetokea hapo awali.
- source_word: בַּבָּשָׁן
  choice: katika Bashani
  rationale: Hili ni jina la kawaida la Kiswahili la eneo la Bashan likiwa na kiishio kinachotumika katika matumizi ya kibiblia.
- source_word: וּלְחֶצְיוֹ
  choice: nusu nyingine
  rationale: Kiwakilishi kinarejelea kabila la Manase, na ‘nusu nyingine’ huwasilisha utofautishaji kwa uwazi.
- source_word: נָתַן יְהוֹשֻׁעַ
  choice: Yoshua aliipa ... eneo
  rationale: ‘Eneo’ ni yambwa inayoeleweka kutokana na muktadha wa kugawa nchi, na kutajwa kwake kunafanya sentensi iwe wazi kwa Kiswahili.
- source_word: עִם אֲחֵיהֶם
  choice: pamoja na ndugu zao
  rationale: Tafsiri hii inadumisha taswira halisi ya kindugu ya Kiebrania huku ikirejelea Waisraeli wenzao wa makabila mengine.
- source_word: מֵעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: ng’ambo ya Yordani upande wa magharibi
  rationale: ‘Kuelekea baharini’ katika usemi wa Kiebrania huonyesha upande wa magharibi; tafsiri hii inadumisha pia wazo la kuwa ng’ambo ya Yordani.
- source_word: וְגַם כִּי
  choice: Tena ... alipo-
  rationale: Muundo huu unaongeza tendo jingine katika simulizi na pia una nguvu ya wakati; ‘Tena ... alipo-’ ni ya asili katika Kiswahili.
- source_word: שִׁלְּחָם
  choice: alipowaaga waende
  rationale: Kitenzi hapa kina maana ya kuwaaga au kuwaruhusu waondoke, si kuwatuma kufanya kazi fulani.
- source_word: אֶל אָהֳלֵיהֶם
  choice: kwenye mahema yao
  rationale: ‘Mahema’ huhifadhi neno halisi na taswira ya kihistoria ya chanzo.
- source_word: וַיְבָרֲכֵם
  choice: aliwabariki
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya tendo la kuwapa baraka.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi umefanywa wa asili bila kuondoa tofauti kati ya ugawaji wa Musa na ule wa Yoshua; ‘ng’ambo ... upande wa magharibi’ huhifadhi mtazamo wa kijiografia wa chanzo.
