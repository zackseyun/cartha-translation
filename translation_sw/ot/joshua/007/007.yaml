  to: Yoshua akasema, “Aa, Bwana Yahwe[a], kwa nini uliwavusha watu hawa kuvuka Yordani, ili kututia mikononi mwa Waamori na kutuangamiza? Laiti tungalikubali kukaa ng’ambo ya Yordani!”
  rationale: 'Revised only the two points affecting idiomatic precision: the potentially over-specific “hasa” is removed, and the crossing is expressed with the natural complement “kuvuka Yordani.” The lament, ambiguity of Joshua’s rhetorical question, divine name, and all other source meanings are retained.'
