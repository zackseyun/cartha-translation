  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה לָ֠/מָה הֵעֲבַ֨רְתָּ הַעֲבִ֜יר אֶת הָ/עָ֤ם הַ/זֶּה֙ אֶת הַ/יַּרְדֵּ֔ן לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַאֲבִידֵ֑/נוּ וְ/לוּ֙ הוֹאַ֣לְנוּ וַ/נֵּ֔שֶׁב בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/007.yaml
  text: And Joshua said[a], “Ah, Lord GOD, why have you brought this people across the Jordan at all—to give us into the hand of the Amorites, to destroy us? If only we had been willing to dwell beyond the Jordan!”
translation:
  language: sw
  text: Yoshua akasema, “Aa, Bwana Yahwe[a], kwa nini uliwavusha watu hawa kuvuka Yordani, ili kututia mikononi mwa Waamori na kutuangamiza? Laiti tungalikubali kukaa ng’ambo ya Yordani!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “Adonai YHWH,” yaani cheo “Bwana” kikifuatiwa na jina la Mungu, “Yahwe.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲהָהּ
  choice: Aa
  rationale: Ni kilio cha ghafla cha huzuni na kufadhaika. “Aa” kinahifadhi nguvu ya maombolezo bila kutumia lugha ya kizamani.
- source_word: אֲדֹנָי יְהוִה
  choice: Bwana Yahwe
  rationale: Muunganiko huu una cheo אֲדֹנָי (“Bwana”) na jina la Mungu יְהוִה (“Yahwe”); tafsiri inahifadhi vipengele vyote viwili bila marudio yasiyo ya kawaida.
- source_word: הֵעֲבַרְתָּ הַעֲבִיר
  choice: kwa nini hasa uliwavusha
  rationale: Kitenzi pamoja na jina-kitenzi la kusisitiza kinaongeza nguvu ya swali. “Hasa” kinaonyesha msisitizo wa malalamiko, huku “uliwavusha” kikieleza tendo la kuwafanya wavuke.
- source_word: אֶת־הָעָם הַזֶּה
  choice: watu hawa
  rationale: עָם ni jamii ya watu kwa pamoja; “watu hawa” ni Kiswahili cha kawaida na wazi.
- source_word: אֶת־הַיַּרְדֵּן
  choice: Yordani
  rationale: Pamoja na “uliwavusha,” jina hili linaeleweka wazi kuwa ni Mto Yordani bila kulazimika kuongeza neno lisilokuwapo katika sentensi.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: ili kututia mikononi mwa Waamori
  rationale: “Kutia mikononi mwa” ni nahau ya Kiswahili inayoeleweka na pia inahifadhi taswira ya Kiebrania ya kuwekwa chini ya mamlaka ya adui.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Ingawa umbo la Kiebrania ni la umoja, hapa jina hilo linatumika kwa maana ya kundi la watu; wingi wa Kiswahili ndio wa kawaida.
- source_word: לְהַאֲבִידֵנוּ
  choice: na kutuangamiza
  rationale: Kitenzi kinaonyesha kuharibu au kusababisha kuangamia. “Kutuangamiza” kina uzito unaofaa na ni cha moja kwa moja.
- source_word: וְלוּ הוֹאַלְנוּ
  choice: Laiti tungalikubali
  rationale: וְלוּ huanzisha tamanio lisilotimia, na הוֹאַלְנוּ huonyesha hiari au kukubali. Tafsiri hii haiingizi wazo la kuridhika ambalo halimo wazi katika mzizi.
- source_word: וַנֵּשֶׁב בְּעֵבֶר הַיַּרְדֵּן
  choice: kukaa ng’ambo ya Yordani
  rationale: Baada ya usemi wa tamanio, “kukaa” linaeleza kuendelea kuishi mahali pale. “Ng’ambo ya Yordani” linahifadhi mtazamo wa kijiografia wa maandishi bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu katika אֲדֹנָי יְהוִה
  choice: Bwana Yahwe
  alternative: Bwana MUNGU
  rationale: “Yahwe” linaonyesha jina la agano lililo katika maandishi ya Kiebrania, huku “Bwana” likitafsiri cheo אֲדֹנָי. Hivyo tafsiri haifichi jina wala kuunda marudio “Bwana BWANA.”
- issue: Malalamiko ya Yoshua kuhusu kusudi la kuvuka Yordani
  choice: 'Swali limeachwa kama malalamiko ya moja kwa moja: “ili kututia ... na kutuangamiza?”'
  alternative: Kulieleza kama kana kwamba Yoshua anathibitisha kuwa hilo ndilo kusudi halisi la Mungu
  rationale: Muundo wa Kiebrania unaonyesha swali la uchungu la Yoshua. Tafsiri haipaswi kuligeuza kuwa tamko la mafundisho kuhusu nia ya Mungu wala kulipunguza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Aa” linaonyesha kilio cha huzuni; “hasa” kinabeba msisitizo wa muundo wa Kiebrania; na “tungalikubali” linahifadhi maana ya hiari bila kudokeza kuridhika.
