review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Joshua’s lament, the emphatic causative crossing of the Jordan, delivery into Amorite power, destruction, and the unrealized wish to remain on the far side. “Tungalikubali” appropriately preserves the volitional sense of הוֹאַלְנוּ without introducing ‘contentment.’
  naturalness: The wording is generally clear Standard East African Swahili. However, “kwa nini hasa” most naturally asks ‘why precisely?’ rather than carrying the anguished emphatic force ‘why at all’; and “uliwavusha watu hawa Yordani” is smoother with “kuvuka Yordani.”
  terminology: “Bwana Yahwe” faithfully represents the compound divine address and retains the divine name. “Waamori,” “Yordani,” and “kutia mikononi mwa” are suitable established biblical terminology.
  issues:
  - severity: low
    issue: “kwa nini hasa” can shift the force of the Hebrew emphatic construction.
    rationale: In contemporary Swahili it often requests a precise reason (‘why exactly’). Omitting it avoids this slight narrowing while the lamenting question and causative verb retain the sense.
  - severity: low
    issue: The crossing construction lacks the most natural Swahili complement.
    rationale: “Uliwavusha watu hawa kuvuka Yordani” is more idiomatic and explicit than “uliwavusha watu hawa Yordani,” without adding interpretive content.
  revised_text: Yoshua akasema, “Aa, Bwana Yahwe[a], kwa nini uliwavusha watu hawa kuvuka Yordani, ili kututia mikononi mwa Waamori na kutuangamiza? Laiti tungalikubali kukaa ng’ambo ya Yordani!”
  revised_footnotes:
  - marker: a
    text: 'Kiebrania: “Adonai YHWH,” yaani cheo “Bwana” kikifuatiwa na jina la Mungu, “Yahwe.”'
    reason: alternative_reading
  revision_rationale: 'Revised only the two points affecting idiomatic precision: the potentially over-specific “hasa” is removed, and the crossing is expressed with the natural complement “kuvuka Yordani.” The lament, ambiguity of Joshua’s rhetorical question, divine name, and all other source meanings are retained.'
