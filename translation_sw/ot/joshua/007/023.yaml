base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/023.yaml
  text: They took them from inside the tent and brought them to Joshua and to all the sons of Israel[c][b][a], and they laid them out before Yahweh.
translation:
  language: sw
  text: Wakavichukua kutoka ndani ya hema, wakavileta kwa Yoshua na kwa wana wote wa Israeli[a], kisha wakaviweka wazi[b] mbele ya Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli wote.” Kiebrania ni “wana wote wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kiebrania kinaweza kumaanisha kihalisi “wakavimwaga.” Katika muktadha huu huenda kinamaanisha waliviweka au walivitandaza wazi mbele za Yahweh.
    reason: lexical_alternative
  - marker: c
    text: Jina la Kiebrania יְהוָה limetoholewa hapa kuwa “Yahweh”; katika desturi nyingine hutolewa kama “BWANA.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחוּם
  choice: wakavichukua
  rationale: Kitenzi לקח hapa kina maana ya kawaida ya ‘kuchukua’; kiambishi -vi- kinarejelea vitu vilivyotajwa katika muktadha.
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: kutoka ndani ya hema
  rationale: מִתּוֹךְ inaonyesha wazi kutoka sehemu ya ndani, si kutoka kwenye hema kwa maana pana tu.
- source_word: וַיְבִאוּם
  choice: wakavileta
  rationale: Hifili ya בוא kwa kawaida humaanisha ‘kuleta’; tafsiri hii inadumisha wazo la kuvihamisha bila kuongeza maana ya sherehe.
- source_word: אֶל יְהוֹשֻׁעַ וְאֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: kwa Yoshua na kwa wana wote wa Israeli
  rationale: Kurudia ‘kwa’ kunaakisi kurudiwa kwa אֶל, na ‘wana wa Israeli’ linahifadhi kwa uwazi umbo la nahau ya Kiebrania בְּנֵי יִשְׂרָאֵל.
- source_word: וַיַּצִּקֻם
  choice: wakavimwaga
  rationale: יצק mara nyingi humaanisha ‘kumwaga.’ Kiswahili ‘kumwaga’ kinaweza kutumiwa pia kwa vitu, hivyo kinahifadhi picha ya Kiebrania bila kudokeza kimakosa kuwa vilikuwa kimiminika.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahweh
  rationale: ‘Mbele za’ ni usemi wa kawaida wa Kiswahili unaowasilisha לִפְנֵי kama kuwa katika uwepo wa mtu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu lililoandikwa kwa herufi nne limetoholewa kama jina binafsi badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Matini ya Kiebrania ina jina binafsi la Mungu. ‘Yahweh’ hulihifadhi, ilhali ‘BWANA’ ni desturi ya kulibadilisha kwa cheo.
- issue: Jinsi ya kutafsiri בְּנֵי יִשְׂרָאֵל
  choice: wana wote wa Israeli
  alternative: Waisraeli wote
  rationale: ‘Wana wa Israeli’ linadumisha usemi wa agano na muundo wa chanzo; ‘Waisraeli’ ni tafsiri ya maana iliyo laini zaidi.
- issue: Picha inayotolewa na וַיַּצִּקֻם
  choice: wakavimwaga
  alternative: wakaviweka wazi
  rationale: Maana ya msingi ya יצק ni ‘kumwaga,’ lakini katika muktadha vitu vinaweza kuwa vilitandazwa au kuwekwa wazi mbele za Yahweh. Matini kuu inadumisha picha ya chanzo huku tanbihi ikionyesha maana inayowezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi unaotumia mfululizo wa vitenzi vya -ka-. Lugha ni ya sasa na yenye heshima. Usemi ‘wana wa Israeli’ umehifadhiwa kwa uwazi wa kimatinin, huku tanbihi ikitoa ‘Waisraeli’ kama namna ya kawaida zaidi.
