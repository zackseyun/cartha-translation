base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/011.yaml
  text: Israel has sinned[a]. They have also transgressed my covenant that I commanded them, and they have also taken some of what was devoted to destruction, and they have also stolen, and they have also deceived[c][b], and they have also put it among their own belongings.
translation:
  language: sw
  text: Israeli ametenda dhambi. Pia wamekiuka agano langu nililowaamuru, pia wamechukua baadhi ya vitu vilivyowekwa wakfu ili viangamizwe[a], pia wameiba, pia wamedanganya[b], na pia wameviweka miongoni mwa mali zao[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitu vilivyowekwa chini ya marufuku.” Neno la Kiebrania humaanisha vitu vilivyotengwa kwa Mungu na, katika muktadha huu, kuamriwa viangamizwe.
    reason: lexical_alternative
  - marker: b
    text: Au, “wamesema uongo” au “wamekana.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “katika vyombo/vifaa vyao”; hapa maana yake ni kuvificha miongoni mwa mali zao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָא יִשְׂרָאֵל
  choice: Israeli ametenda dhambi
  rationale: Kitenzi cha kwanza ni cha umoja, nacho kinamtaja Israeli kwa pamoja kama taifa; “ametenda dhambi” hudumisha uzito wa kosa dhidi ya Mungu.
- source_word: עָבְרוּ אֶת־בְּרִיתִי
  choice: wamekiuka agano langu
  rationale: “Kukiuka” huonyesha kuvuka mipaka ya agano na ni Kiswahili cha sasa, cha heshima, na kinachoeleweka.
- source_word: אֲשֶׁר צִוִּיתִי אוֹתָם
  choice: nililowaamuru
  rationale: Tafsiri inadumisha usemi mfupi wa Kiebrania bila kuongeza waziwazi maneno kama “walishike,” ingawa maana hiyo inaweza kueleweka katika muktadha.
- source_word: לָקְחוּ מִן־הַחֵרֶם
  choice: wamechukua baadhi ya vitu vilivyowekwa wakfu kwa kuangamizwa
  rationale: חֵרֶם hapa ni mali iliyotengwa kwa Mungu na kuwekwa chini ya hukumu ya kuangamizwa; usemi huu huwasilisha pande zote mbili bila kutumia neno la kitaalamu lisiloeleweka kwa wengi.
- source_word: גָּנְבוּ
  choice: wameiba
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la wizi.
- source_word: כִּחֲשׁוּ
  choice: wamedanganya
  rationale: Kitenzi kinaweza kumaanisha kusema uongo, kudanganya, au kukana; “wamedanganya” hudumisha upana wake kuliko kulifunga katika maana moja tu.
- source_word: שָׂמוּ בִכְלֵיהֶם
  choice: wameviweka vitu hivyo miongoni mwa mali zao
  rationale: כְּלִים linaweza kumaanisha vyombo, vifaa, au mali. Katika muktadha huu vitu vilifichwa miongoni mwa mali binafsi, kwa hiyo “mali zao” ni ya asili na sahihi.
- source_word: וְגַם ... וְגַם ... וְגַם
  choice: Pia ... , ... , ... , na ...
  rationale: “Pia” na mfululizo wa vitenzi hudumisha mkusanyiko wa mashtaka, huku Kiswahili kikibaki cha asili na kisichokuwa kizito kwa kurudia neno hilo katika kila kishazi.
theological_decisions:
- issue: Israeli anahesabiwa kuwa na hatia ingawa kosa la moja kwa moja lilitendwa na mtu mmoja
  choice: Kudumisha “Israeli” kama mhusika wa pamoja na mabadiliko kutoka kitenzi cha umoja hadi vitenzi vya wingi
  alternative: Kumtaja Akani peke yake au kubadili sentensi yote iwe ya umoja
  rationale: Kiebrania huanza kwa “Israeli ametenda dhambi” kisha hutumia vitenzi vya wingi. Tafsiri haipaswi kuondoa mvutano huu wa uwajibikaji wa pamoja wa taifa la agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha sauti ya mashtaka inayoongezeka na tofauti ya Kiebrania kati ya Israeli wa pamoja katika umoja na vitenzi vinavyofuata katika wingi.
