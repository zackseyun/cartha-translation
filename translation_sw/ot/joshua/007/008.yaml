base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/008.yaml
  text: Please[a], Lord[b], what can I say after Israel has turned its back before its enemies?
translation:
  language: sw
  text: Ee Bwana, niseme nini baada ya Israeli kuwapa kisogo[b] adui zake?
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Kwa neno halisi, “Israeli imegeuza shingo ya nyuma (au mgongo) mbele ya adui zake.” Hii ni nahau ya Kiebrania inayomaanisha kurudi nyuma kwa kushindwa vitani.
    reason: cultural_note
lexical_decisions:
- source_word: בִּי
  choice: Ee
  rationale: Katika ombi linaloelekezwa kwa mwenye mamlaka, neno hili ni chembe ya kusihi. “Ee” linaonyesha kilio cha Yoshua cha dharura na cha heshima kwa Kiswahili cha sala.
- source_word: אֲדֹנָי
  choice: Bwana
  rationale: Hili ni jina la heshima kwa Mungu katika usemi wa moja kwa moja. “Bwana” ni tafsiri ya kawaida na yenye heshima bila kuingiza jina la agano ambalo halipo hapa.
- source_word: מָה אֹמַר
  choice: niseme nini
  rationale: Kauli hii inaweza kueleweka kama swali la wakati ujao au la kutoweza kujua la kusema. “Niseme nini” ni ya kawaida na huhifadhi hali ya Yoshua ya kufadhaika bila kuamua maana hiyo kupita kiasi.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: baada ya
  rationale: Kirai hiki kinaanzisha tukio linalosababisha swali la Yoshua; “baada ya” ni wazi na cha kawaida.
- source_word: הָפַךְ עֹרֶף
  choice: kuwapa kisogo
  rationale: Kiebrania kinasema kugeuza nyuma ya shingo kuelekea adui, nahau ya kurudi nyuma au kukimbia vitani. “Kuwapa kisogo” huhifadhi picha hiyo kwa Kiswahili cha kawaida.
- source_word: לִפְנֵי
  choice: kwa
  rationale: Katika muundo wa Kiswahili “kuwapa kisogo adui,” uhusiano wa kuwa mbele ya adui unaonyeshwa kiasili bila kutafsiri kihusishi hiki neno kwa neno.
- source_word: אֹיְבָיו
  choice: adui zake
  rationale: Kiambishi cha Kiebrania ni umoja wa kiume na kinarejelea Israeli kama taifa la pamoja. Kiswahili pia hutumia “zake” kurejelea Israeli katika muktadha huu.
theological_decisions:
- issue: Tafsiri ya jina la kimungu אֲדֹנָי
  choice: Bwana
  alternative: Bwana wangu
  rationale: “Bwana” hudumisha heshima ya usemi kwa Mungu na matumizi yaliyozoeleka ya jina hili, bila kulichanganya na jina la agano lisilopatikana katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sala ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Nahau “kuwapa kisogo” imetumiwa ili kuhifadhi picha ya Kiebrania na wakati huohuo kuwasilisha maana ya kurudi nyuma vitani.
