source:
  edition: WLC
  text: וַ/יִּקַּ֣ח יְהוֹשֻׁ֣עַ אֶת עָכָ֣ן בֶּן זֶ֡רַח וְ/אֶת הַ/כֶּ֣סֶף וְ/אֶת הָ/אַדֶּ֣רֶת וְֽ/אֶת לְשׁ֣וֹן הַ/זָּהָ֡ב וְֽ/אֶת בָּנָ֡י/ו וְֽ/אֶת בְּנֹתָ֡י/ו וְ/אֶת שׁוֹר/וֹ֩ וְ/אֶת חֲמֹר֨/וֹ וְ/אֶת צֹאנ֤/וֹ וְ/אֶֽת אָהֳל/וֹ֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/כָל יִשְׂרָאֵ֖ל עִמּ֑/וֹ וַ/יַּעֲל֥וּ אֹתָ֖/ם עֵ֥מֶק עָכֽוֹר־־־־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/024.yaml
  text: Then Joshua took Achan son of Zerah[a], and the silver, the cloak, the bar of gold, his sons, his daughters, his ox, his donkey, his flock, his tent[b], and all that belonged to him—and all Israel with him—and they brought them up to the Valley of Achor.
translation:
  language: sw
  text: Kisha Yoshua akamchukua Akani mwana wa Zera, pamoja na ile fedha, lile joho, kile kipande cha dhahabu chenye umbo la ulimi[a], wanawe na binti zake, ng’ombe wake, punda wake, kundi lake la mifugo, hema lake, na kila kitu alichokuwa nacho; Israeli wote walikuwa pamoja naye, nao wakawapeleka juu mpaka Bonde la Akori[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, “ulimi wa dhahabu,” yaani, kipande cha dhahabu chenye umbo la ulimi; kwa mapokeo, “kabari ya dhahabu.”
    reason: lexical_alternative
  - marker: b
    text: Jina Akori linasikika kama neno la Kiebrania linalomaanisha “taabu.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kisha Yoshua akamchukua
  rationale: Muundo wa simulizi unaendeleza tukio linalofuata; “Kisha” ni wa kawaida katika Kiswahili, na “akamchukua” haiongezi wazo la kutumia nguvu ambalo halijasemwa wazi.
- source_word: עָכָן בֶּן זֶרַח
  choice: Akani mwana wa Zera
  rationale: Majina yametoholewa kwa namna inayosomeka kwa Kiswahili, huku uhusiano wa mwana na baba ukihifadhiwa moja kwa moja.
- source_word: הַכֶּסֶף
  choice: ile fedha
  rationale: Neno כסף hapa linamaanisha fedha iliyotajwa tayari katika simulizi, si “pesa” kwa maana pana zaidi.
- source_word: הָאַדֶּרֶת
  choice: lile joho
  rationale: אדרת ni vazi la nje la pekee; “joho” ni neno la sasa, lenye heshima na linaloeleweka kwa urahisi.
- source_word: לְשׁוֹן הַזָּהָב
  choice: kile kipande cha dhahabu chenye umbo la ulimi
  rationale: Tafsiri hii inahifadhi taswira halisi ya לשון, “ulimi,” lakini inaonyesha wazi kwamba kinachozungumziwa ni kipande cha dhahabu kilichotengenezwa kwa umbo hilo.
- source_word: בָּנָיו ... בְּנֹתָיו
  choice: wanawe wa kiume na wa kike
  rationale: Kiebrania kinataja wana na mabinti kwa tofauti; tafsiri haivijumlishi kimya kimya kuwa “watoto” tu.
- source_word: שׁוֹרוֹ
  choice: ng’ombe wake
  rationale: שור ni mnyama mmoja wa jamii ya ng’ombe. “Ng’ombe” ni neno la kawaida la Kiswahili lisilobana jinsia au matumizi kuliko ushahidi wa mstari.
- source_word: חֲמֹרוֹ
  choice: punda wake
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa חמור katika Kiswahili cha sasa.
- source_word: צֹאנוֹ
  choice: kundi lake
  rationale: צאן ni jina la kijumla la mifugo midogo, hasa kondoo na mbuzi; “kundi” huhifadhi maana ya kijumla bila kutaja aina moja pekee.
- source_word: אָהֳלוֹ
  choice: hema lake
  rationale: Hii ndiyo maana ya moja kwa moja ya neno la Kiebrania, bila upanuzi usiohitajika.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: kila kitu alichokuwa nacho
  rationale: Usemi huu wa kawaida wa Kiswahili unaonyesha kwa ufasaha mali yote iliyokuwa yake.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: Israeli wote wakaenda pamoja naye
  rationale: Kiwakilishi kinaelekea kumrejelea Yoshua, mhusika mkuu wa sentensi; tafsiri inahifadhi maana ya Israeli wote kuandamana naye.
- source_word: וַיַּעֲלוּ אֹתָם עֵמֶק עָכוֹר
  choice: nao wakawapandisha hadi Bonde la Akori
  rationale: “Wakawapandisha” huhifadhi kitenzi cha mwendo wa kupanda, na “hadi” huonyesha mahali walipopelekwa.
theological_decisions:
- issue: Iwapo mstari udokeze hatia au kutokuwa na hatia kwa familia ya Akani
  choice: Kutaja wanawe wa kiume na wa kike bila maelezo ya kuwahukumu au kuwaondolea hatia
  alternative: Kusema kwamba walishiriki kosa, au kwamba walikuwepo tu wala hawakuadhibiwa
  rationale: Mstari huu unawataja miongoni mwa waliochukuliwa kwenda bondeni, lakini wenyewe hausemi wazi kiwango cha ushiriki wao. Tafsiri inaacha mvutano huo wa kifasiri bila kuutatua kwa kuongeza maelezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Vipashio vya orodha vimehifadhiwa, na alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
