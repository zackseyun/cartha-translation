base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/026.yaml
  text: And they raised over him a large heap of stones to this day[a], and Yahweh turned from the burning of his anger. Therefore the name of that place has been called the Valley of Achor to this day.
translation:
  language: sw
  text: Wakaweka juu yake rundo kubwa la mawe, nalo lipo mpaka leo. Kisha Yahwe akageuka kutoka katika makali ya hasira yake. Kwa hiyo, mahali pale pameitwa Bonde la Akori[a] mpaka leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Akori linahusiana na neno la Kiebrania linalomaanisha “taabu” na kitenzi kinachomaanisha “kusumbua”; linganisha Yoshua 7:25.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקִימוּ עָלָיו
  choice: Wakamwinulia
  rationale: Hifili ya קום ina maana ya kusimamisha au kuinua; kiambishi -m- pamoja na -inulia kinaonyesha kwamba rundo liliwekwa juu yake.
- source_word: גַּל אֲבָנִים גָּדוֹל
  choice: rundo kubwa la mawe
  rationale: Hii ni tafsiri ya kawaida na iliyo wazi ya גַּל אֲבָנִים, huku גָּדוֹל ikitafsiriwa ‘kubwa.’
- source_word: עַד הַיּוֹם הַזֶּה
  choice: mpaka leo
  rationale: Ni nahau ya Kiebrania inayoonyesha kuwa hali au jina hilo liliendelea hadi wakati wa mwandishi.
- source_word: וַיָּשָׁב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: Kisha Yahwe akauacha ukali wa hasira yake
  rationale: ‘Akauacha’ huwasilisha kugeuka au kuondoka kwa hasira katika Kiswahili cha kawaida; ‘ukali wa hasira’ huhifadhi nguvu ya nahau ya Kiebrania bila kuifanya kuwa kauli ya kimafundisho.
- source_word: עַל כֵּן
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha wazi sababu ya jina linalofuata.
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: mahali pale pameitwa
  rationale: Kauli tendwa ya wakati timilifu inaeleza tendo la kupa jina na matokeo yake yanayoendelea hadi leo.
- source_word: עֵמֶק עָכוֹר
  choice: Bonde la Akori
  rationale: Jina la mahali limetoholewa badala ya kutafsiriwa; mchezo wa maneno unaelezwa katika tanbihi.
theological_decisions:
- issue: Uwakilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina maalumu la Mungu; kulitaja kama ‘Yahwe’ hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maelezo ya ghadhabu ya Mungu katika מֵחֲרוֹן אַפּוֹ
  choice: akauacha ukali wa hasira yake
  alternative: akageuka kutoka katika kuwaka kwa hasira yake
  rationale: Chaguo hili ni la kawaida zaidi katika Kiswahili huku likidumisha nguvu ya taswira ya hasira kali na wazo la kugeuka kutoka kwayo, bila kufafanua zaidi hali ya Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Kishazi ‘nalo lipo mpaka leo’ kinaweka wazi kwamba rundo, si tendo la kulijenga, ndilo lililoendelea kuwapo.
