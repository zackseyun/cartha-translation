  text: וְ/נִקְרַבְתֶּ֥ם בַּ/בֹּ֖קֶר לְ/שִׁבְטֵי/כֶ֑ם וְ/הָיָ֡ה הַ/שֵּׁבֶט֩ אֲשֶׁר יִלְכְּדֶ֨/נּוּ יְהוָ֜ה יִקְרַ֣ב לַ/מִּשְׁפָּח֗וֹת וְ/הַ/מִּשְׁפָּחָ֞ה אֲשֶֽׁר יִלְכְּדֶ֤/נָּה יְהוָה֙ תִּקְרַ֣ב לַ/בָּתִּ֔ים וְ/הַ/בַּ֨יִת֙ אֲשֶׁ֣ר יִלְכְּדֶ֣/נּוּ יְהוָ֔ה יִקְרַ֖ב לַ/גְּבָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/014.yaml
  text: In the morning you shall come near by your tribes[a], and it shall be that the tribe that Yahweh selects shall come near by clans, and the clan that Yahweh selects shall come near by households[b], and the household that Yahweh selects shall come near man by man.
translation:
  language: sw
  text: Asubuhi mtakaribia kwa makabila yenu; na itakuwa kwamba kabila ambalo Yahwe atalichagua[a] litakaribia kwa koo zake, na ukoo ambao Yahwe atauchagua utakaribia kwa kaya zake, na kaya ambayo Yahwe ataichagua itakaribia, mwanamume mmoja mmoja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “atalikamata.” Kitenzi cha Kiebrania kinaweza kumaanisha “kukamata” au “kutwaa”; hapa kinarejelea kundi ambalo Yahwe analitambulisha, yawezekana kwa kura.
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “kwa wanaume”; usemi huu hubainisha utambulisho wa mwisho, mwanamume mmoja mmoja ndani ya kaya hiyo.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וְנִקְרַבְתֶּם / יִקְרַב / תִּקְרַב
  choice: mtakaribia / litakaribia / utakaribia / itakaribia
  rationale: Kitenzi קרב hapa kinaonyesha kukaribia kwa utaratibu mbele za Yahwe ili wahusika watambuliwe. ‘Kukaribia’ pia huhifadhi urudiaji wa kitenzi katika mstari mzima.
- source_word: לְשִׁבְטֵיכֶם
  choice: kwa makabila yenu
  rationale: Huwasilisha mpangilio wa watu kwa makabila bila kuongeza maelezo yasiyomo katika Kiebrania.
- source_word: יִלְכְּדֶנּוּ / יִלְכְּדֶנָּה
  choice: atalichagua / atauchagua / ataichagua
  rationale: Ingawa לכד kwa kawaida humaanisha kukamata au kutwaa, hapa hutumiwa katika utaratibu wa kutambua kundi husika. ‘Kuchagua’ huwasilisha maana ya kimuktadha, huku tanbihi ikihifadhi maana halisi na uwezekano wa uchaguzi kwa kura takatifu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu lililoandikwa kwa herufi nne za Kiebrania limetafsiriwa kwa umbo la jina lenyewe badala ya kubadilishwa kuwa cheo.
- source_word: לַמִּשְׁפָּחוֹת
  choice: kwa koo zake
  rationale: מִשְׁפָּחָה ni kundi la kijamii lililo chini ya kabila na kubwa kuliko familia moja; ‘ukoo’ linafaa katika mpangilio huu.
- source_word: לַבָּתִּים
  choice: kwa familia zake
  rationale: בַּיִת hapa haimaanishi jengo, bali watu wa nyumba moja, yaani familia au kaya. ‘Familia’ ni neno la kawaida na linautofautisha vizuri na ukoo.
- source_word: לַגְּבָרִים
  choice: mwanamume mmoja mmoja
  rationale: Wingi wa kiume גְּבָרִים umetumiwa kwa maana gawanyishi, ukipunguza uchunguzi kutoka familia hadi kwa kila mwanamume mmoja mmoja.
- source_word: וְהָיָה
  choice: Kisha
  rationale: Katika muktadha huu fomula hiyo inaendeleza hatua inayofuata ya utaratibu; ‘Kisha’ ni ya asili katika Kiswahili na haibadili uhusiano wa hatua hizo.
theological_decisions:
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandiko ya Kiebrania yanatumia jina binafsi la agano, si cheo. ‘Yahwe’ hulihifadhi jina hilo bila kuingiza badala ya kimapokeo.
- issue: Namna ya uchaguzi wa kundi lenye hatia
  choice: atalichagua
  alternative: atalikamata
  rationale: Muktadha unaonyesha utaratibu wa Yahwe kutambulisha kabila, ukoo, familia, na hatimaye mtu. Tafsiri haijasema moja kwa moja kuwa kura ilitumika kwa sababu mstari huu hautaji kura, ingawa uwezekano huo umeelezwa kwa tahadhari katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Ngazi za kijamii zimetofautishwa kuwa kabila, ukoo, familia, kisha mwanamume mmoja mmoja. Urudiaji wa ‘kukaribia’ na ‘kuchagua’ umehifadhiwa ili kuonyesha utaratibu wa hatua kwa hatua uliomo katika Kiebrania.
