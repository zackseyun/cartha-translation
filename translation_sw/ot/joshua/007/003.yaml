base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/003.yaml
  text: They returned to Joshua and said to him[a], “Do not have all the people go up. Let about two thousand men, or about three thousand men, go up and strike Ai. Do not weary all the people there[b], for they are few.”
translation:
  language: sw
  text: Wakarudi kwa Yoshua wakamwambia, “Watu wote wasiende huko. Wanaume wapatao elfu mbili au elfu tatu waende na kuushambulia mji wa Ai. Usiwachoshe watu wote huko,[a] kwa maana watu wa Ai ni wachache.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usiwataabishe watu wote huko.” Kitenzi cha Kiebrania kinaweza kumaanisha kusababisha uchovu au taabu kwa jitihada isiyo ya lazima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֶל יְהוֹשֻׁעַ וַיֹּאמְרוּ אֵלָיו
  choice: Wakarudi kwa Yoshua na kumwambia
  rationale: Kauli ya simulizi ya Kiebrania imetafsiriwa kwa wakati uliopita wa mfululizo ulio wa kawaida katika Kiswahili. Kitenzi cha umoja katika “kumwambia” kinamrejelea Yoshua.
- source_word: אַל יַעַל כָּל הָעָם
  choice: Watu wote wasiende huko
  rationale: Muundo אַל pamoja na jussive unatoa ushauri au katazo. “Watu” huhifadhi upana wa הָעָם, ingawa katika muktadha hawa ni wapiganaji; “huko” hufanya mwendo unaokusudiwa kuelekea Ai uwe wazi kwa Kiswahili cha kawaida.
- source_word: כְּאַלְפַּיִם אִישׁ אוֹ כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: Wanaume wapatao elfu mbili au elfu tatu
  rationale: Kiambishi כ־ kinaonyesha ukadiriaji. “Wapatao” ni usemi wa asili wa Kiswahili, na “wanaume” huafiki אִישׁ katika muktadha wa kikosi cha vita.
- source_word: יַעֲלוּ וְיַכּוּ אֶת הָעָי
  choice: waende na kuushambulia mji wa Ai
  rationale: עלה ina maana ya kwenda juu au kusonga kuelekea shabaha, lakini Kiswahili “waende” ni cha asili hapa. נכה katika muktadha huu ni kuushambulia mji, si lazima tayari kuushinda. “Mji wa Ai” hubainisha kwamba jina Ai linarejelea mji.
- source_word: אַל תְּיַגַּע שָׁמָּה אֶת כָּל הָעָם
  choice: Usiwachoshe watu wote kwa kuwapeleka huko
  rationale: Piel ya יגע ina wazo la kusababisha uchovu au taabu kwa jitihada isiyo ya lazima. Kirai “kwa kuwapeleka huko” huonyesha kwa kawaida katika Kiswahili jinsi watu hao wangechoshwa.
- source_word: כִּי מְעַט הֵמָּה
  choice: kwa maana watu wa Ai ni wachache
  rationale: Kiwakilishi cha Kiebrania kina maana inayotegemea muktadha. Kutaja “watu wa Ai” huepusha uwezekano wa msomaji kudhani kwamba “wao” ni Waisraeli waliotajwa mara moja kabla.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa kawaida na wenye heshima. Neno “watu” limehifadhiwa badala ya kulibana kuwa “jeshi” au “wanajeshi,” lakini maana ya kijeshi inaonekana kutokana na muktadha. Alama ya tanbihi [a] imewekwa katika matini kuu.
