  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּמְעֲל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מַ֖עַל בַּ/חֵ֑רֶם וַ/יִּקַּ֡ח עָכָ֣ן בֶּן כַּרְמִי֩ בֶן זַבְדִּ֨י בֶן זֶ֜רַח לְ/מַטֵּ֤ה יְהוּדָה֙ מִן הַ/חֵ֔רֶם וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/001.yaml
  text: But the sons of Israel acted unfaithfully regarding the things devoted to destruction[a], for Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, took some of the things devoted to destruction; so the anger of Yahweh burned against the sons of Israel.
translation:
  language: sw
  text: Lakini wana wa Israeli walikuwa wasio waaminifu kuhusu vitu vilivyotengwa ili viangamizwe[a], kwa kuwa Akani mwana wa Karmi, mwana wa Zabdi, mwana wa Zera, wa kabila la Yuda, alichukua baadhi ya vitu vilivyotengwa ili viangamizwe; basi hasira ya Yahwe ikawaka dhidi ya wana wa Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vitu vilivyowekwa wakfu,” au, kwa usemi wa kiufundi zaidi, “vitu vilivyowekwa chini ya marufuku.” Neno la Kiebrania חֵרֶם linamaanisha watu au vitu vilivyotengwa kwa ajili ya Mungu ili viangamizwe au viondolewe katika matumizi ya kawaida ya wanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ ... מַעַל
  choice: walitenda kwa kukosa uaminifu
  rationale: Mzizi מעל unaonyesha kuvunja uaminifu au wajibu mtakatifu, si kutenda dhambi kwa maana ya jumla tu. Muundo huu pia unaakisi msisitizo wa kitenzi na nomino ya mzizi mmoja bila kufanya Kiswahili kuwa kizito.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi usemi wa kifamilia wa Kiebrania na utambulisho wa taifa kwa pamoja, huku ikiendelea kueleweka katika Kiswahili sanifu.
- source_word: בַּחֵרֶם / מִן הַחֵרֶם
  choice: vitu vilivyotengwa kwa ajili ya kuangamizwa
  rationale: חֵרֶם hapa ni vitu vilivyowekwa kando chini ya amri takatifu, hasa kwa kuangamizwa au kuondolewa katika matumizi ya kawaida. Tafsiri hii inaweka wazi maana ya muktadha bila kuificha katika istilahi isiyoeleweka.
- source_word: וַיִּקַּח ... מִן
  choice: alichukua baadhi ya
  rationale: מִן ina maana ya sehemu kutoka katika jumla; neno 'baadhi' linaifanya maana hiyo kuwa ya asili katika Kiswahili bila kudai kiasi mahususi.
- source_word: לְמַטֵּה יְהוּדָה
  choice: wa kabila la Yuda
  rationale: מַטֶּה katika ukoo huu humaanisha kabila; usemi huu ni mfupi na wa kawaida katika Kiswahili.
- source_word: וַיִּחַר אַף יְהוָה
  choice: hasira ya Yahwe ikawaka
  rationale: Inahifadhi sitiari hai ya Kiebrania ya hasira kuwaka badala ya kuirahisisha kuwa 'Yahwe akakasirika.'
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo kama 'BWANA.'
theological_decisions:
- issue: 'Uwajibikaji wa pamoja: wana wa Israeli kwa wingi wanatajwa kukosa uaminifu, ingawa Akani ndiye aliyechukua vitu.'
  choice: Kudumisha 'wana wa Israeli' kama mhusika wa sentensi ya kwanza na kumtaja Akani wazi kuwa mtendaji binafsi.
  alternative: Kuweka lawama yote kwa Akani pekee, au kurahisisha kuwa 'Israeli ilitenda dhambi.'
  rationale: Kiebrania kinadumisha kwa makusudi mvutano kati ya tendo la mtu mmoja na hatia pamoja na matokeo kwa jumuiya; tafsiri haipaswi kuutatua kimyakimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. 'Kwa maana' linaonyesha kuwa kutajwa kwa Akani kunafafanua kitendo cha pamoja; sentensi zimegawanywa ili ukoo mrefu na hoja kuu zisomeke kwa urahisi. Alama ya tanbihi [a] imewekwa mara baada ya kutajwa kwa kwanza kwa חֵרֶם.
