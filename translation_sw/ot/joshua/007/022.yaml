  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יְהוֹשֻׁ֨עַ֙ מַלְאָכִ֔ים וַ/יָּרֻ֖צוּ הָ/אֹ֑הֱלָ/ה וְ/הִנֵּ֧ה טְמוּנָ֛ה בְּ/אָהֳל֖/וֹ וְ/הַ/כֶּ֥סֶף תַּחְתֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/022.yaml
  text: So Joshua sent messengers[a], and they ran to the tent; and behold, it was hidden in his tent, with the silver underneath it.
translation:
  language: sw
  text: Basi Yoshua akatuma wajumbe, nao wakakimbia kwenda hemani. Tazama, lilikuwa limefichwa ndani ya hema lake, na fedha ilikuwa chini yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma
  rationale: Katika simulizi, kitenzi שלח kina maana ya kumtuma mtu kufanya jambo; “akatuma” ni cha kawaida na kinaendeleza mfululizo wa matukio.
- source_word: מַלְאָכִים
  choice: wajumbe
  rationale: Hapa neno hili linamaanisha watu waliotumwa na Yoshua, si malaika; “wajumbe” huhifadhi maana hiyo waziwazi.
- source_word: וַיָּרֻצוּ
  choice: wakakimbia
  rationale: Neno רוץ linataja kukimbia moja kwa moja na kuhifadhi kasi na uhai wa simulizi kuliko “wakafanya haraka.”
- source_word: הָאֹהֱלָה
  choice: kwenda hemani
  rationale: Herufi ya mwelekeo inaonyesha mwendo kuelekea hemani; muundo huu ni wa asili katika Kiswahili bila kutaja wazi kwamba ni hema la Akani, jambo ambalo muktadha tayari unaonyesha.
- source_word: וְהִנֵּה
  choice: Tazama
  rationale: Neno hili linaonyesha ugunduzi wa ghafla na kuvuta fikira za msomaji; “Tazama” lina uzito wa kisimulizi unaofaa.
- source_word: טְמוּנָה
  choice: lilikuwa limefichwa
  rationale: Umbo la kike la umoja linaelekea kwa vazi lililotajwa katika mstari uliotangulia. “Limefichwa” haliongezi wazo mahsusi la kuzikwa ambalo mzizi wenyewe haulazimishi.
- source_word: בְּאָהֳלוֹ
  choice: ndani ya hema lake
  rationale: Huu ni usemi wa mahali wenye kiambishi cha nafsi ya tatu ya kiume, kinachomrejelea Akani.
- source_word: וְהַכֶּסֶף
  choice: na fedha ilikuwa
  rationale: Kiebrania kinaunganisha “na fedha” na taarifa iliyotangulia. Kuifanya kuwa kishazi kamili katika Kiswahili huhifadhi uratibu huo bila kuficha uwezekano wa kuitafsiri kama kitu cha ziada katika mandhari.
- source_word: תַּחְתֶּיהָ
  choice: chini yake
  rationale: Kiambishi cha kike cha umoja kinaelekea kwa vazi lililotajwa katika mstari uliotangulia; “chini yake” ni wazi na ya kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa kawaida lakini wenye hadhi. “Tazama” limehifadhiwa kwa ajili ya msisitizo wa ugunduzi. Urudiaji wa “hema/hemani” unafuata chanzo na kusaidia uwazi. Hakuna alama ya tanbihi kwa kuwa tafsiri kuu “na fedha ilikuwa chini yake” huhifadhi kwa uwazi uratibu wa Kiebrania; tanbihi ya Kiingereza inaeleza hasa hitaji la kimtindo la Kiingereza, si tofauti ya lazima katika Kiswahili.
