  yaml_path: translation/ot/joshua/007/010.yaml
  text: Yahweh said to Joshua[a], “Get up[b]. Why are you falling on your face?”
translation:
  language: sw
  text: Yahwe akamwambia Yoshua, “Inuka! Kwa nini basi umeanguka kifudifudi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa kama jina binafsi, badala ya kubadilishwa na cheo ‘BWANA’.
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Katika usimulizi wa Kiswahili, kitenzi hiki huendeleza mfululizo wa matukio kwa kawaida na pia huonyesha anayeelekezewa maneno.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya jina hili la Kiebrania.
- source_word: קֻם לָךְ
  choice: Inuka!
  rationale: Amri ya kuacha hali ya kujitupa chini imetolewa kwa Kiswahili cha kawaida; לָךְ ni sehemu ya usemi wa Kiebrania na haihitaji kutafsiriwa kando.
- source_word: לָמָּה זֶּה
  choice: Kwa nini basi
  rationale: ‘Basi’ linadokeza msisitizo wa זֶּה bila kuunda sentensi isiyo ya kawaida katika Kiswahili.
- source_word: אַתָּה נֹפֵל עַל־פָּנֶיךָ
  choice: umeanguka kifudifudi
  rationale: Kirai hiki kinaeleza hali ya Yoshua akiwa amejitupa chini uso ukielekea ardhini. Kauli timilifu ya Kiswahili inaonyesha vizuri hali iliyotokana na tendo hilo kuliko ‘unaanguka,’ ambayo ingeweza kumaanisha kwamba bado yuko katika hatua ya kuanguka.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina binafsi la Mungu moja kwa moja; ‘Yahwe’ huhifadhi tofauti kati ya jina hilo na cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akamwambia’ linafaa kwa usimulizi unaoendelea, ‘Inuka’ ni amri ya kawaida yenye nguvu, na ‘kifudifudi’ ni njia ya asili ya kueleza kujitupa chini uso ukielekea ardhini.
