base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/017.yaml
  text: Then he brought near the clan of Judah[a], and the clan of the Zerahites was taken. Then he brought near the clan of the Zerahites man by man, and Zabdi was taken.
translation:
  language: sw
  text: Kisha akauleta mbele ukoo wa Yuda, na ukoo wa Wazera ukachaguliwa. Kisha akauleta mbele ukoo wa Wazera mtu mmoja baada ya mwingine[a], na Zabdi akachaguliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa wanaume.” Kiebrania kinaweza kumaanisha kwamba ukoo wa Wazera uliletwa mbele kwa wanaume mmoja mmoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: akauleta karibu
  rationale: Hifili ya קרב ina maana ya kuleta karibu au kuwasilisha mbele. Kauli hii inahifadhi hatua ya kuleta vikundi mbele katika mchakato wa utambuzi bila kufafanua kupita kiasi.
- source_word: מִשְׁפַּחַת
  choice: ukoo
  rationale: Katika mpangilio wa kikabila wa kifungu hiki, neno hili linamaanisha kundi la jamaa lililo ndani ya kabila; “ukoo” ni la kawaida na linafaa katika Kiswahili.
- source_word: יְהוּדָה
  choice: Yuda
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: וַיִּלְכֹּד / וַיִּלָּכֵד
  choice: ukachaguliwa / akachaguliwa
  rationale: Katika muktadha huu kitenzi kinaeleza kutambuliwa katika mchakato wa uteuzi, si kutekwa vitani. “Kuchaguliwa” huwasilisha maana ya kimuktadha na kuhifadhi hali ya kutendwa.
- source_word: הַזַּרְחִי
  choice: Wazera
  rationale: Umbo la kikundi linalowataja wazao au ukoo wa Zera; “Wazera” ni fupi na la asili katika Kiswahili.
- source_word: לַגְּבָרִים
  choice: mtu mmoja baada ya mwingine
  rationale: Ingawa kwa karibu zaidi ni “kwa wanaume,” katika mchakato huu inaonyesha kwamba wanaume wa ukoo waliletwa mmoja mmoja. Tafsiri hii inatoa maana ya ugawanyaji kwa Kiswahili cha kawaida.
- source_word: זַבְדִּי
  choice: Zabdi
  rationale: Unukuzi wa kawaida wa jina la mtu.
theological_decisions:
- issue: Njia ya uteuzi haikutajwa wazi katika mstari huu
  choice: ukachaguliwa / akachaguliwa
  alternative: ukapatikana / akapatikana; ukatwaliwa / akatwaliwa
  rationale: Tafsiri haiongezi wazi kwamba kura ilitumika, kwa kuwa kitenzi chenyewe hapa kinasisitiza matokeo ya kutambuliwa. “Kuchaguliwa” huepuka maana ya kijeshi ya kutekwa, ingawa haifafanui mhusika wa uteuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. “Ukoo” limetumiwa kwa kitengo cha jamaa ndani ya kabila, na miundo ya “akauleta/ukachaguliwa” inadumisha mwendo wa simulizi.
