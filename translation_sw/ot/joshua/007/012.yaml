id: JOS.7.12
reference: Joshua 7:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/לֹ֨א יֻכְל֜וּ בְּנֵ֣י יִשְׂרָאֵ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֵי/הֶ֔ם עֹ֗רֶף יִפְנוּ֙ לִ/פְנֵ֣י אֹֽיְבֵי/הֶ֔ם כִּ֥י הָי֖וּ לְ/חֵ֑רֶם לֹ֤א אוֹסִיף֙ לִֽ/הְי֣וֹת עִמָּ/כֶ֔ם אִם לֹ֥א תַשְׁמִ֛ידוּ הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/012.yaml
  text: Therefore the sons of Israel cannot stand before their enemies; they turn their backs before their enemies[a], because they have become devoted to destruction. I will no longer be with you unless you destroy the devoted thing from your midst.
translation:
  language: sw
  text: Kwa hiyo, wana wa Israeli hawawezi kusimama mbele ya adui zao. Wanawapa adui zao kisogo[a], kwa sababu wamekuwa waliowekwa wakfu kwa ajili ya kuangamizwa. Sitakuwa pamoja nanyi tena, msipokiangamiza kutoka miongoni mwenu kile kilichowekwa wakfu kwa ajili ya kuangamizwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “wanageuza kisogo.” Huu ni usemi unaoonyesha kurudi nyuma au kukimbia kwa kushindwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Inahifadhi kwa uwazi usemi wa Kiebrania na maana yake ya jamii ya agano, huku ikiwa Kiswahili sanifu kinachoeleweka.
- source_word: יֻכְלוּ
  choice: hawawezi
  rationale: Wakati usiotimilifu hapa unaonyesha kutoweza katika hali ya sasa kutokana na hukumu ya Mungu.
- source_word: לָקוּם לִפְנֵי אֹיְבֵיהֶם
  choice: kusimama mbele ya adui zao
  rationale: Inahifadhi taswira ya Kiebrania ya kusimama imara mbele ya wapinzani na inaeleweka kwa kawaida katika muktadha wa vita.
- source_word: עֹרֶף יִפְנוּ
  choice: wanawageuzia adui zao migongo
  rationale: Usemi huo kihalisi unahusu kugeuza kisogo au mgongo, yaani kurudi nyuma kwa kushindwa; tafsiri hii inahifadhi sitiari badala ya kusema tu 'wanakimbia'.
- source_word: כִּי
  choice: kwa sababu
  rationale: Inaingiza sababu ya Israeli kushindwa kusimama na kuwarudia nyuma adui zao.
- source_word: הָיוּ לְחֵרֶם
  choice: wao wenyewe wamekuwa kitu kilichowekwa wakfu kwa ajili ya kuangamizwa
  rationale: חֵרֶם hapa inaonyesha hali ya kuwa chini ya wakfu wa hukumu unaoishia katika maangamizi. 'Wao wenyewe' huweka wazi kwamba kiima ni Waisraeli, bila kupunguza uzito wa dhana hiyo kuwa laana ya kawaida.
- source_word: לֹא אוֹסִיף לִהְיוֹת עִמָּכֶם
  choice: Sitakuwa pamoja nanyi tena
  rationale: Muundo אוֹסִיף pamoja na kitenzi-jina unaonyesha kutokuendelea; Kiswahili hiki ni cha kawaida na chenye uzito unaofaa.
- source_word: אִם לֹא
  choice: msipo-
  rationale: Sharti hasi la Kiebrania linatolewa kwa kawaida kwa muundo wa Kiswahili 'msipo-', wenye maana ya 'isipokuwa mkifanya'.
- source_word: תַשְׁמִידוּ
  choice: kiangamiza
  rationale: Hifili ya שׁמד inadai uharibifu wa kabisa wa kile kilicho chini ya marufuku; 'angamiza' ni kali na sahihi bila kuongeza maelezo yasiyokuwamo.
- source_word: הַחֵרֶם
  choice: kile kilichowekwa wakfu kwa ajili ya kuangamizwa
  rationale: Hapa חֵרֶם inarejelea kitu halisi kilicho katikati ya jamii. Usemi huu unadumisha uhusiano wa kileksia na matumizi ya awali katika aya.
- source_word: מִקִּרְבְּכֶם
  choice: kutoka miongoni mwenu
  rationale: Ni Kiswahili cha kawaida kwa usemi wa kuondoa kitu ndani ya jamii, na huhifadhi maana ya ushirika wa agano.
theological_decisions:
- issue: Kutafsiri חֵרֶם katika matumizi yake ya hali na ya kitu halisi ndani ya aya moja
  choice: Kutumia 'kitu kilichowekwa wakfu kwa ajili ya kuangamizwa' kwa לְחֵרֶם na 'kile kilichowekwa wakfu kwa ajili ya kuangamizwa' kwa הַחֵרֶם
  alternative: '''waliolaaniwa'' na ''kitu kilicholaaniwa'', au ''chini ya marufuku'' na ''kitu kilichopigwa marufuku'''
  rationale: 'Neno lilelile la Kiebrania lina maana zinazohusiana lakini tofauti kidogo: Israeli wameingia katika hali ya חֵרֶם, na חֵרֶם fulani bado imo miongoni mwao. Kurudia usemi wa ''kuwekwa wakfu kwa ajili ya kuangamizwa'' huhifadhi uhusiano huo na maana ya kiibada-kihukumu bila kuufanya kuwa laana ya jumla tu.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimewekwa wazi kwa wasomaji wa kawaida huku taswira ya Kiebrania na mvutano wa dhana ya חֵרֶם vikihifadhiwa.
