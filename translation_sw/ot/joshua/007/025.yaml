base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/025.yaml
  text: And Joshua said[a], “Why have you troubled us? Yahweh will trouble you this day.” And all Israel stoned him with stones[c][b], and they burned them with fire and stoned them with stones.
translation:
  language: sw
  text: Yoshua akasema[a], “Kwa nini umetutia taabuni? Yahweh atakutia taabuni leo.” Waisraeli wote wakampiga kwa mawe; kisha wakawachoma[b] kwa moto na kuwapiga kwa mawe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kinarudia kitenzi kilekile: “Kwa nini umetutia taabuni? Yahweh atakutia taabuni”; tafsiri imehifadhi mchezo huo wa maneno.'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinabadilika kutoka umoja (“wakampiga”) kwenda wingi (“wakawachoma” na “kuwapiga”). Huenda wingi huo unamhusisha Akani pamoja na wengine au pamoja na nyumba na mali zake; tafsiri haijasawazisha mabadiliko hayo.
    reason: alternative_reading
  - marker: c
    text: Kiebrania kimetumia vitenzi viwili tofauti kwa tendo la kupiga kwa mawe katika aya hii; vyote vimetafsiriwa kwa usemi unaofanana katika Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲכַרְתָּנוּ / יַעְכֳּרְךָ
  choice: umetutia taabuni / atakutia taabuni
  rationale: Kitenzi עכר kina maana ya kuleta taabu, msiba, au vurugu. Kutumia kishazi kilekile katika sehemu zote mbili kunahifadhi mchezo wa maneno na uwiano wa hukumu katika kauli ya Yoshua, huku Kiswahili kikibaki cha kawaida na chenye hadhi.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama “Yahwe” badala ya kubadilishwa kwa cheo, hivyo kuhifadhi jina binafsi katika matini ya Kiebrania.
- source_word: בַּיּוֹם הַזֶּה
  choice: leo
  rationale: “Leo” ni tafsiri ya asili na ya moja kwa moja ya usemi huu katika muktadha, na inadumisha uharaka wa hukumu iliyotangazwa.
- source_word: וַיִּרְגְּמוּ אֹתוֹ ... אֶבֶן
  choice: wakampiga kwa mawe
  rationale: רגם hapa hueleza kumpiga mtu kwa mawe katika kutekeleza hukumu. Kiswahili “wakampiga kwa mawe” ni wazi na cha kawaida, huku kikihifadhi kifaa kilichotajwa wazi katika Kiebrania.
- source_word: וַיִּשְׂרְפוּ אֹתָם בָּאֵשׁ
  choice: wakawachoma kwa moto
  rationale: Tafsiri hii inahifadhi kitendo cha kuchoma, kishazi cha kifaa “kwa moto,” na mabadiliko ya Kiebrania kutoka mtendewa mmoja kwenda wengi.
- source_word: וַיִּסְקְלוּ אֹתָם בָּאֲבָנִים
  choice: kuwapiga kwa mawe
  rationale: סקל pia hueleza kupiga kwa mawe. Kurudia usemi huo wa Kiswahili kunahifadhi kurudiwa kwa tendo katika matini, huku tanbihi ikieleza kuwa Kiebrania kimetumia vitenzi viwili tofauti.
theological_decisions:
- issue: Mabadiliko kutoka kiwakilishi cha umoja kumhusu Akani kwenda kiwakilishi cha wingi
  choice: Kuhifadhi umoja katika “wakampiga,” kisha wingi katika “wakawachoma” na “kuwapiga.”
  alternative: Kusawazisha viwakilishi vyote viwe vya umoja, au kufafanua kuwa wingi unahusu mali za Akani pekee.
  rationale: Matini ya Kimasora inabadilika wazi kutoka umoja kwenda wingi. Tafsiri inahifadhi mvutano huo bila kuamua ikiwa wingi unawahusu watu wengine, nyumba ya Akani, mali zake, au vyote kwa pamoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kutia taabuni” huhifadhi urudiaji wa kitenzi na sauti nzito ya hukumu bila kuwa cha kizamani mno. Muundo wa umoja kisha wingi umeachwa kama ulivyo katika chanzo.
