lexical_decisions:
- source_word: וַיַּעַן
  choice: akamjibu
  rationale: Kitenzi hiki katika simulizi kinaonyesha jibu kwa mtu aliyetajwa; “akamjibu” ni Kiswahili cha kawaida na huhifadhi muundo wa mazungumzo.
- source_word: עָכָן
  choice: Akani
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika tafsiri za Kiswahili.
- source_word: אֶת יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Jina limetoholewa moja kwa moja na kutumika kama yambwa wa “akamjibu.”
- source_word: וַיֹּאמַר
  choice: akasema
  rationale: Huhifadhi kitenzi cha pili cha usemi katika Kiebrania bila kuufanya usemi wa Kiswahili kuwa mzito.
- source_word: אָמְנָה
  choice: Kweli
  rationale: Huonyesha uthibitisho wenye mkazo katika ungamo kwa lugha ya sasa na yenye heshima.
- source_word: אָנֹכִי חָטָאתִי
  choice: nimetenda dhambi
  rationale: Kauli ya nafsi ya kwanza pamoja na wakati timilifu huwasilisha tendo lililokamilika lenye umuhimu wa sasa; umbo la kitenzi cha Kiswahili tayari huonyesha nafsi ya kwanza.
- source_word: לַיהוָה
  choice: dhidi ya Yahweh
  rationale: Pamoja na kitenzi “kutenda dhambi,” kihusishi humtaja aliyekosewa; “dhidi ya” ni wazi na “Yahweh” huhifadhi jina la Mungu lililo katika matini.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Tafsiri ya moja kwa moja ya kirai unganifu kinachomtambulisha Yahweh.
- source_word: וְכָזֹאת וְכָזֹאת עָשִׂיתִי
  choice: Nilifanya hivi
  rationale: Nahau hii inatanguliza maelezo yatakayofuata; “Nilifanya hivi” ni ya asili katika Kiswahili na haidokezi matendo yasiyotajwa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Matini ina jina la agano יהוה moja kwa moja; kulitaja “Yahweh” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya חטא pamoja na ל
  choice: nimetenda dhambi dhidi ya Yahweh
  alternative: nimemkosea Yahweh
  rationale: “Kutenda dhambi dhidi ya” huhifadhi wazi dhana ya dhambi na kumtaja Mungu kuwa aliyekosewa, bila kupunguza uzito wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi “akamjibu… akasema” umehifadhiwa kwa sababu unaakisi vitenzi vyote viwili vya Kiebrania; nahau ya mwisho imetafsiriwa kwa lugha ya asili na ufafanuzi wake kuwekwa katika tanbihi.
