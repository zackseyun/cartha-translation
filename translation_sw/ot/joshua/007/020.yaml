  yaml_path: translation/ot/joshua/007/020.yaml
  text: Achan answered Joshua and said[a], “Truly, I have sinned against Yahweh, the God of Israel, and this is what I did:”
translation:
  language: sw
  text: Akani akamjibu Yoshua, akasema, “Kweli, nimetenda dhambi dhidi ya Yahweh, Mungu wa Israeli, na nilifanya hivi[a]:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa maneno ya moja kwa moja: “nilifanya hivi na hivi.” Hii ni nahau ya Kiebrania inayotanguliza maelezo ya yale aliyofanya.'
