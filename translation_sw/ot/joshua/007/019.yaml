base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/019.yaml
  text: Then Joshua said to Achan[a], “My son, please give glory to Yahweh, the God of Israel, and give thanks to him. Please tell me what you have done; do not hide it from me.”
translation:
  language: sw
  text: Kisha Yoshua akamwambia Akani, “Mwanangu, tafadhali mpe Yahwe, Mungu wa Israeli, utukufu, na umtolee shukrani[a]. Tafadhali niambie ulichofanya; usiniwekee siri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umsifu”; au katika muktadha huu huenda, “ukiri kwake.”
    reason: Neno la Kiebrania תוֹדָה linaweza kumaanisha shukrani au sifa, na katika mazingira haya linaweza pia kuwa mwito wa kuungama.
lexical_decisions:
- source_word: בְּנִי
  choice: Mwanangu
  rationale: Inahifadhi namna ya kumwita mwana wa kiume kwa sauti ya kindugu na ya kusihi, bila kudokeza kwamba Akani alikuwa mwana halisi wa Yoshua.
- source_word: שִׂים נָא כָבוֹד
  choice: tafadhali mpe ... utukufu
  rationale: Ingawa kwa neno moja moja ni ‘weka utukufu,’ huu ni msemo wa kumtaka mtu akiri na kuheshimu utukufu wa Mungu. ‘Tafadhali’ inaonyesha nguvu ya נָא.
- source_word: לַיהוָה
  choice: Yahwe
  rationale: Jina la agano יְהוָה limetoholewa moja kwa moja kwa Kiswahili kama ‘Yahwe.’
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo huu wa Kiebrania.
- source_word: וְתֶן לוֹ תוֹדָה
  choice: na umtolee shukrani[a]
  rationale: ‘Kumtolea shukrani’ ni Kiswahili cha asili kinachohifadhi maana pana ya תוֹדָה, huku tanbihi ikionyesha uwezekano wa sifa au ungamo katika muktadha huu.
- source_word: וְהַגֶּד נָא לִי
  choice: Tafadhali niambie
  rationale: Inawasilisha amri ya kusimulia au kutangaza kwa lugha ya sasa, na ‘tafadhali’ inahifadhi kusihi kwa נָא.
- source_word: מֶה עָשִׂיתָ
  choice: ulichofanya
  rationale: Kiswahili hutumia kwa kawaida umbo hili kurejelea tendo lililokwisha kufanywa ambalo sasa linachunguzwa.
- source_word: אַל תְּכַחֵד מִמֶּנִּי
  choice: usinifiche
  rationale: Kitenzi כחד hapa kina maana ya kuficha au kuficha habari. Kiswahili hakihitaji kutaja kiwakilishi cha kitu kwa sababu jambo linalofichwa linaeleweka kutokana na sentensi iliyotangulia.
theological_decisions:
- issue: Maana ya תוֹדָה katika mazingira ya kukiri kosa
  choice: umtolee shukrani
  alternative: umsifu; au, katika muktadha huu, ukiri mbele zake
  rationale: Neno תוֹדָה linaweza kumaanisha shukrani, sifa, au ungamo. Maagizo yanayofuata yanamtaka Akani aseme alichofanya, hivyo kivuli cha ungamo kipo; hata hivyo, hakijaingizwa kama maana pekee katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Mpangilio ‘mpe Yahwe ... utukufu’ umetumiwa ili msemo usikike wa asili kwa Kiswahili, na ‘Mwanangu’ inadumisha sauti ya binafsi na nzito ya Yoshua.
