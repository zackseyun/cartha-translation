source:
  edition: WLC
  text: קֻ֚ם קַדֵּ֣שׁ אֶת הָ/עָ֔ם וְ/אָמַרְתָּ֖ הִתְקַדְּשׁ֣וּ לְ/מָחָ֑ר כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל חֵ֤רֶם בְּ/קִרְבְּ/ךָ֙ יִשְׂרָאֵ֔ל לֹ֣א תוּכַ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֶ֔י/ךָ עַד הֲסִירְ/כֶ֥ם הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/013.yaml
  text: 'Get up[a], consecrate the people, and say, ‘Consecrate yourselves for tomorrow, for thus says Yahweh, the God of Israel: There is something devoted to destruction in your midst, Israel. You cannot stand before your enemies until you remove the thing devoted to destruction from your midst.’'
translation:
  language: sw
  text: 'Inuka, watakase watu, nawe useme, ‘Jitakaseni kwa ajili ya kesho, kwa maana hivi ndivyo asemavyo Yahwe, Mungu wa Israeli: Kitu kilichowekwa wakfu kwa kuangamizwa[a] kiko katikati yako, Israeli. Hutaweza kusimama mbele ya adui zako mpaka mtakapoondoa kitu hicho kilichowekwa wakfu kwa kuangamizwa kutoka katikati yenu.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania חֵרֶם (kherem), ambacho kwa desturi hutafsiriwa “kitu kilichowekwa wakfu” au “kitu kilicho chini ya marufuku”; humaanisha kitu kilichotengwa kwa wakfu usioweza kubatilishwa, hapa kwa kuangamizwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֻם
  choice: Inuka
  rationale: Amri kwa Yoshua ya kuanza kuchukua hatua mara moja; ni Kiswahili cha kawaida chenye uzito unaofaa.
- source_word: קַדֵּשׁ
  choice: uwatakase
  rationale: Kauli ya kusababisha katika Piel inaelekeza Yoshua awaandae watu kwa kuwatenga kiibada kwa ajili ya Mungu.
- source_word: הָעָם
  choice: watu
  rationale: Huwataja watu wa agano waliokusanyika katika muktadha huu.
- source_word: הִתְקַדְּשׁוּ
  choice: Jitakaseni
  rationale: Hifadhi maana ya kujirejelea ya Hitpael na uhusiano wake wa kimsamiati na קַדֵּשׁ.
- source_word: לְמָחָר
  choice: kwa ajili ya kesho
  rationale: Huonyesha maandalizi yanayofanywa kwa kutazamia siku inayofuata.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Huwakilisha jina binafsi la Mungu badala ya kulibadilisha kuwa cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Tafsiri ya moja kwa moja ya muundo huu unaomtambulisha Yahwe kwa uhusiano wake na Israeli.
- source_word: חֵרֶם
  choice: kitu kilichowekwa wakfu kwa kuangamizwa
  rationale: Katika muktadha wa Yoshua, neno hili huashiria kitu kilichotengwa kabisa chini ya amri isiyoweza kubatilishwa, hapa kwa kusudi la kuangamizwa.
- source_word: בְּקִרְבְּךָ יִשְׂרָאֵל
  choice: kiko katikati yako, Israeli
  rationale: Huhifadhi usemi wa moja kwa moja kwa Israeli kama jumuiya moja pamoja na maana ya kuwapo ndani yake.
- source_word: לֹא תוּכַל לָקוּם לִפְנֵי אֹיְבֶיךָ
  choice: Hutaweza kusimama mbele ya adui zako
  rationale: Ni usemi unaoeleweka wa kutoweza kuwastahimili au kuwashinda maadui, huku ukihifadhi taswira ya kusimama mbele yao.
- source_word: עַד הֲסִירְכֶם
  choice: mpaka mtakapoondoa
  rationale: 'Huonyesha mpaka wa wakati wenye sharti: Israeli haiwezi kusimama mbele ya maadui hadi kitu hicho kiondolewe.'
theological_decisions:
- issue: Maana ya חֵרֶם katika muktadha wa hukumu na vita
  choice: kitu kilichowekwa wakfu kwa kuangamizwa
  alternative: kitu kilichowekwa wakfu; kitu kilicholaaniwa; kitu kilicho chini ya marufuku
  rationale: Chaguo hili linaonyesha kutengwa kusikoweza kubatilishwa na, katika muktadha huu, kusudi la kuangamizwa; halipunguzi neno kuwa laana ya jumla wala kuacha maana yake kuu ikiwa fiche.
- issue: Umoja na wingi katika kumsemesha Israeli
  choice: katikati yako ... adui zako ... mtakapoondoa ... katikati yenu
  alternative: kutumia wingi kila mahali ili kulainisha Kiswahili
  rationale: Matini ya Kiebrania hubadilika kwa makusudi kutoka Israeli kama jumuiya moja hadi watu wake kwa wingi. Tafsiri inadumisha mvutano huo wa kisarufi na kiteolojia.
- issue: Uwasilishaji wa jina יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Jina binafsi limehifadhiwa kwa uwazi badala ya kubadilishwa kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa sasa. Muundo “hivi ndivyo asemavyo” umetumiwa kuhifadhi uzito wa kauli ya kinabii. Mabadiliko ya viwakilishi kutoka umoja kwenda wingi yamehifadhiwa kwa sababu yapo katika matini chanzi.
