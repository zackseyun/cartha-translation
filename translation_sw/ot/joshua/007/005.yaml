  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi na hadhi inayofaa Maandiko. Muundo wa vitenzi vinavyofuatana umehifadhi mwendo wa haraka wa simulizi la Kiebrania; sitiari ya mioyo kuyeyuka na kuwa kama maji imeachwa wazi badala ya kufasiriwa tu kuwa kupoteza ujasiri.
