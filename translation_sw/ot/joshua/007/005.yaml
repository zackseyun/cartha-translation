  text: וַ/יַּכּ֨וּ מֵ/הֶ֜ם אַנְשֵׁ֣י הָ/עַ֗י כִּ/שְׁלֹשִׁ֤ים וְ/שִׁשָּׁה֙ אִ֔ישׁ וַֽ/יִּרְדְּפ֞וּ/ם לִ/פְנֵ֤י הַ/שַּׁ֨עַר֙ עַד הַ/שְּׁבָרִ֔ים וַ/יַּכּ֖וּ/ם בַּ/מּוֹרָ֑ד וַ/יִּמַּ֥ס לְבַב הָ/עָ֖ם וַ/יְהִ֥י לְ/מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/005.yaml
  text: And the men of Ai struck down about thirty-six men from among them[a], and pursued them from before the gate as far as Shebarim, and struck them down on the descent. So the heart of the people melted and became like water.
translation:
  language: sw
  text: Watu wa Ai wakawapiga wanaume wapatao thelathini na sita miongoni mwao, wakawafukuza kutoka mbele ya lango mpaka Shebarimu[a], na wakawapiga kwenye mteremko. Ndipo mioyo ya watu ikayeyuka na kuwa kama maji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mpaka kwenye machimbo” au “mpaka sehemu zilizovunjika”; neno la Kiebrania שברים linaweza kueleweka kuwa jina la mahali, Shebarimu, au neno la kueleza mahali.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ מֵהֶם
  choice: wakawaua ... miongoni mwao
  rationale: Katika simulizi la vita, נכה pamoja na idadi ya walioanguka inaonyesha mapigo yaliyosababisha vifo; ‘wakawaua’ ni ya kawaida na wazi katika Kiswahili, huku ‘miongoni mwao’ ikionyesha kwamba waliouawa walitoka katika jeshi la Israeli.
- source_word: אַנְשֵׁי הָעַי
  choice: Watu wa Ai
  rationale: Kirai hiki kinawataja watu wa mji wa Ai, hasa wapiganaji wake. ‘Watu wa Ai’ ni cha asili katika Kiswahili na hakiongezi neno lisilokuwapo katika chanzo.
- source_word: כִּשְׁלֹשִׁים וְשִׁשָּׁה אִישׁ
  choice: karibu wanaume thelathini na sita
  rationale: Kiambishi כ־ kinaonyesha makadirio; ‘karibu’ huhifadhi maana hiyo. ‘Wanaume’ huakisi אִישׁ na muktadha wa kijeshi.
- source_word: וַיִּרְדְּפוּם
  choice: wakawafukuza
  rationale: רדף katika muktadha wa vita humaanisha kuwafuatia adui anayekimbia; ‘kuwafukuza’ ni usemi wa kawaida na sahihi katika Kiswahili.
- source_word: לִפְנֵי הַשַּׁעַר
  choice: kutoka mbele ya lango
  rationale: Tafsiri hii huhifadhi dhana ya mahali iliyo katika לִפְנֵי na mwanzo wa harakati unaoeleweka kutokana na muktadha.
- source_word: עַד הַשְּׁבָרִים
  choice: mpaka Shebarimu
  rationale: Neno linaweza kuwa jina la mahali au nomino yenye maana ya machimbo au sehemu zilizovunjika. Jina la mahali limehifadhiwa katika matini, na utata umeelezwa katika tanbihi.
- source_word: וַיַּכּוּם בַּמּוֹרָד
  choice: wakawapiga walipokuwa wakiteremka
  rationale: ‘Wakawapiga’ huhifadhi upana wa נכה bila kudai kwamba kundi lote lililofukuzwa liliuawa. בַּמּוֹרָד inaonyesha sehemu au njia ya mteremko; muundo huu ni wa asili katika Kiswahili.
- source_word: וַיִּמַּס לְבַב הָעָם
  choice: mioyo ya watu ikayeyuka
  rationale: Nahau ya Kiebrania inaeleza kupotea kwa ujasiri. Taswira halisi ya kuyeyuka imehifadhiwa kwa sababu inaeleweka na ina nguvu katika Kiswahili.
- source_word: וַיְהִי לְמָיִם
  choice: na kuwa kama maji
  rationale: Tafsiri hii huhifadhi sitiari ya kuvunjika kabisa kwa moyo bila kutoa picha ya mabadiliko halisi ya kimwili.
