base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/016.yaml
  text: Joshua rose early in the morning and brought Israel near by its tribes[b][a], and the tribe of Judah was taken.
translation:
  language: sw
  text: Yoshua akaondoka asubuhi na mapema, akawaleta Israeli karibu, kabila kwa kabila[a]; kabila la Yuda likatwaliwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawaleta Israeli mbele kwa makabila yao.”
    reason: lexical_alternative
  - marker: b
    text: Kwa Kiebrania, “kabila la Yuda likatwaliwa”; hapa ni nahau yenye maana ya kutengwa au kubainishwa katika mchakato huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: akaamka asubuhi na mapema
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha wazi kwamba Yoshua aliamka mapema, huku ukihifadhi rejeo la wakati wa asubuhi.
- source_word: וַיַּקְרֵב
  choice: akawaleta ... karibu
  rationale: Huhifadhi maana ya msingi ya Hiphil ya קרב, yaani kuwaleta karibu au mbele, bila kufasiri tendo hilo kuwa kuwasilisha rasmi.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israeli
  rationale: Jina hili linawarejelea watu wa agano kwa ujumla na linafuata moja kwa moja neno la Kiebrania.
- source_word: לִשְׁבָטָיו
  choice: kabila kwa kabila
  rationale: Hutoa kwa Kiswahili sanifu maana ya ugawaji au ufuatano kwa vitengo vya makabila; kiambishi cha umilikaji si lazima kwa sababu Israeli ni watu wengi na Kiswahili huepuka umilikaji usio wa kawaida hapa.
- source_word: וַיִּלָּכֵד
  choice: likanaswa
  rationale: Huhifadhi taswira ya kitenzi לכד, ‘kunasa/kukamata,’ na pia hali yake ya kutendwa, badala ya kuibadili moja kwa moja kuwa ‘likachaguliwa’ au kuongeza utaratibu usiotajwa katika mstari huu.
- source_word: שֵׁבֶט יְהוּדָה
  choice: kabila la Yuda
  rationale: Ni tafsiri ya kawaida, wazi, na ya moja kwa moja ya uhusiano wa maneno hayo.
theological_decisions:
- issue: Namna ya mchakato wa utambuzi unaodokezwa na וַיִּלָּכֵד
  choice: likanaswa
  alternative: likachaguliwa; likatambuliwa; likanaswa kwa kura
  rationale: Mstari wenyewe hautaji wazi kama utaratibu ulikuwa kura wala hautaji mtendaji wa tendo hilo. ‘Likanaswa’ huhifadhi nahau na mvutano wa Kiebrania, huku tanbihi ikifafanua matumizi yake katika muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. ‘Asubuhi na mapema’ ni usemi wa kawaida; ‘kabila kwa kabila’ hufanya utaratibu wa makabila ueleweke. ‘Likanaswa’ kwa makusudi huhifadhi nahau ya chanzo, nayo tanbihi huondoa uwezekano wa kueleweka kama kukamatwa vitani.
