  source_fidelity: 'Tafsiri inafuata kwa uaminifu mtiririko wa Kiebrania: Yoshua anawatuma wanaume kutoka Yeriko kwenda Ai; Ai inaelezwa kwa uhusiano wake na Beth-Aveni na Betheli; amri ya ‘kupanda’ na ‘kupeleleza nchi’ inadumishwa; kisha wanaume wanapanda na kupeleleza Ai. Tofauti ya ‘nchi’ katika amri na ‘Ai’ katika utekelezaji imehifadhiwa sawasawa na chanzo.'
