  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ יְהוֹשֻׁ֨עַ אֲנָשִׁ֜ים מִֽ/ירִיח֗וֹ הָ/עַ֞י אֲשֶׁ֨ר עִם בֵּ֥ית אָ֨וֶן֙ מִ/קֶּ֣דֶם לְ/בֵֽית אֵ֔ל וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ לֵ/אמֹ֔ר עֲל֖וּ וְ/רַגְּל֣וּ אֶת הָ/אָ֑רֶץ וַֽ/יַּעֲלוּ֙ הָ/אֲנָשִׁ֔ים וַֽ/יְרַגְּל֖וּ אֶת הָ/עָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/002.yaml
  text: And Joshua sent men from Jericho to Ai[a], which is near Beth-aven, east of Bethel, and said to them, “Go up and spy out the land.” So the men went up and spied out Ai.
translation:
  language: sw
  text: Yoshua akatuma wanaume kutoka Yeriko kwenda Ai, ulioko karibu[a] na Beth-Aveni, mashariki mwa Betheli. Akawaambia, “Pandeni mkaipeleleze nchi.” Basi wanaume hao wakapanda na kuipeleleza Ai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulioko kando ya Beth-Aveni.” Kiebrania kinasema kihalisi “ulio pamoja na Beth-Aveni,” kwa kutumia kihusishi ambacho hapa kinaweza kuonyesha ukaribu wa kijiografia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: akatuma
  rationale: Ni kitenzi cha kawaida cha masimulizi kinachoeleza kitendo cha Yoshua bila kuongeza wazo la uteuzi rasmi.
- source_word: אֲנָשִׁים
  choice: wanaume
  rationale: Neno la Kiebrania ni wingi wa kiume na katika muktadha huu linawataja wanaume waliotumwa kufanya upelelezi.
- source_word: מִירִיחוֹ
  choice: kutoka Yeriko
  rationale: Kiambishi מִ־ kinaonyesha mahali walikotumwa kutoka; Yeriko ni umbo la kawaida la jina hilo katika Kiswahili.
- source_word: הָעַי
  choice: Ai
  rationale: Ni jina la mahali; ingawa Kiebrania lina kibainishi, Kiswahili hulitumia kwa kawaida bila kukitafsiri.
- source_word: אֲשֶׁר עִם בֵּית אָוֶן
  choice: ulioko karibu na Beth-Aveni
  rationale: עִם kwa msingi humaanisha ‘pamoja na,’ lakini katika maelezo ya kijiografia hapa huonyesha ukaribu; ‘karibu na’ ni Kiswahili cha kawaida huku tanbihi ikihifadhi uwezekano wa tafsiri halisi zaidi.
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: mashariki mwa Betheli
  rationale: Kirai hiki kinaonyesha mahali pa Ai kwa kulinganisha na Betheli, yaani upande wake wa mashariki.
- source_word: עֲלוּ
  choice: Pandeni
  rationale: עלה huhifadhi wazo la kwenda juu, linaloweza kuonyesha mwinuko wa eneo au mwendo kuelekea mahali husika.
- source_word: וְרַגְּלוּ
  choice: mkaipeleleze
  rationale: Piel ya רגל hapa ina maana ya kufanya upelelezi wa eneo; umbo hili la Kiswahili linaonyesha kwenda kwa kusudi hilo.
- source_word: אֶת הָאָרֶץ
  choice: nchi
  rationale: אָרֶץ hapa ni eneo au nchi inayopaswa kupelel ezwa; ‘nchi’ huhifadhi upana wa neno hilo.
- source_word: וַיַּעֲלוּ
  choice: wakapanda
  rationale: Inarudia kitenzi עלה kilichotumiwa katika amri na hivyo kuhifadhi mwangwi wa amri na utekelezaji wake.
- source_word: וַיְרַגְּלוּ
  choice: wakaipeleleza
  rationale: Inadumisha ulinganifu wa msamiati na amri ya awali ya kupeleleza.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usomaji wa Maandiko. Majina ya mahali yametolewa kwa maumbo yaliyozoeleka katika Kiswahili. Muundo wa masimulizi ni wa asili bila kufuta marudio ya kimakusudi ya ‘kupanda’ na ‘kupeleleza’.
