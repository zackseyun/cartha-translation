  edition: WLC
  text: וְ/הָיָה֙ הַ/נִּלְכָּ֣ד בַּ/חֵ֔רֶם יִשָּׂרֵ֣ף בָּ/אֵ֔שׁ אֹת֖/וֹ וְ/אֶת כָּל אֲשֶׁר ל֑/וֹ כִּ֤י עָבַר֙ אֶת בְּרִ֣ית יְהוָ֔ה וְ/כִֽי עָשָׂ֥ה נְבָלָ֖ה בְּ/יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/015.yaml
  text: And the one who is taken with the devoted thing shall be burned with fire[a], he and all that belongs to him, because he has transgressed the covenant of Yahweh and because he has done an outrageous thing in Israel.
translation:
  language: sw
  text: Na yule atakayepatikana na kitu kilichowekwa wakfu kwa kuangamizwa[a] atateketezwa kwa moto, yeye pamoja na vyote alivyo navyo, kwa sababu amelivunja agano la Yahweh na kwa sababu ametenda jambo la fedheha katika Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya kimapokeo, “kitu kilicholaaniwa.” Neno la Kiebrania ḥerem humaanisha kitu kilichowekwa chini ya marufuku, kikawa wakfu na kukusudiwa kuangamizwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּלְכָּד
  choice: atakayepatikana
  rationale: Kauli tendwa ya לכד hapa inamhusu mtu atakayetambuliwa kwa utaratibu wa kura takatifu; “atakayepatikana” ni ya kawaida katika Kiswahili na haidokezi kukamatwa vitani.
- source_word: בַּחֵרֶם
  choice: na kitu kilichowekwa wakfu kwa kuangamizwa
  rationale: חֵרֶם ni kitu kilichotengwa kwa Mungu na kuondolewa katika matumizi ya kawaida, mara nyingi kwa kuangamizwa. Tafsiri hii inaonyesha kwa pamoja kuwekwa wakfu na kusudi la kuangamizwa; “na” huonyesha kuhusishwa kwa mkosaji na kitu hicho.
- source_word: יִשָּׂרֵף בָּאֵשׁ
  choice: atateketezwa kwa moto
  rationale: Hii inawakilisha kauli tendwa na matumizi ya moto kama chombo, huku “kuteketezwa” ikionyesha kuangamizwa kwa kuchomwa.
- source_word: אֹתוֹ וְאֶת כָּל אֲשֶׁר לוֹ
  choice: yeye pamoja na vyote alivyo navyo
  rationale: Muundo huu unajumuisha mkosaji na kila kilicho chake bila kuamua kimyakimya iwapo unahusu mali pekee au pia watu wa nyumbani.
- source_word: עָבַר אֶת בְּרִית יְהוָה
  choice: amelivunja agano la Yahweh
  rationale: עבר pamoja na “agano” humaanisha kuvuka mipaka ya agano au kulikiuka. “Kulivunja agano” ni Kiswahili cha kawaida chenye uzito wa kisheria na kiagano.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa kuwa cheo.
- source_word: נְבָלָה
  choice: jambo la aibu sana
  rationale: נְבָלָה hapa ni tendo la fedheha na ovu linalochukiza kimaadili, si upumbavu wa kiakili tu.
- source_word: בְּיִשְׂרָאֵל
  choice: katika Israeli
  rationale: 'Kihusishi kinaeleza mahali au jumuiya ambamo kosa lilitendwa: ndani ya Israeli.'
theological_decisions:
- issue: Maana ya חֵרֶם katika hukumu ya agano
  choice: kitu kilichowekwa wakfu kwa kuangamizwa
  alternative: kitu kilicholaaniwa; kitu kilichowekwa chini ya marufuku
  rationale: Uchaguzi huu huhifadhi wazo kwamba kitu hicho kilitengwa kwa Mungu na kwa hiyo hakikuruhusiwa kutumiwa kwa kawaida, huku ukieleza kwamba katika muktadha huu kilikusudiwa kuangamizwa. Tanbihi huhifadhi tafsiri mbadala ya kimapokeo.
- issue: Upeo wa כָּל אֲשֶׁר לוֹ
  choice: vyote alivyo navyo
  alternative: mali yake yote
  rationale: Kiebrania kina upeo mpana. Tafsiri haipunguzi maana iwe mali pekee wala kutaja wazi watu wa nyumbani ambao hawajaorodheshwa katika mstari huu.
- issue: Jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Unukuzi “Yahweh” huhifadhi jina binafsi la Mungu katika matini badala ya kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha urudiaji wa sababu mbili wa Kiebrania (“kwa sababu ... na kwa sababu”) na haibainishi zaidi ya matini upeo wa “vyote alivyo navyo.”
