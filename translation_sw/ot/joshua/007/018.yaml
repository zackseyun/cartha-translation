base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/018.yaml
  text: Then he brought his household near man by man[a], and Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, was taken.
translation:
  language: sw
  text: Kisha akaileta jamaa yake karibu, mwanaume mmoja baada ya mwingine[a], na Akani mwana wa Karmi, mwana wa Zabdi, mwana wa Zera, wa kabila la Yuda, akapatikana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa wanaume”; kirai cha Kiebrania ni kifupi na huenda kinaeleza jamaa hiyo ikiletwa mbele kwa migawanyo ya wanaume katika mchakato wa kura ya kuchagua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: akaileta ... karibu
  rationale: Hifili ya קרב humaanisha kuleta karibu au kuwasilisha. Muundo huu unadumisha taswira ya Kiebrania na unaeleweka katika mchakato wa kusogezwa mbele kwa ajili ya kura.
- source_word: בֵּיתוֹ
  choice: jamaa yake
  rationale: בַּיִת hapa ni kundi la kifamilia, si jengo. ‘Jamaa yake’ ni Kiswahili cha kawaida kinachoonyesha watu wa nyumba au ukoo mdogo waliowasilishwa pamoja.
- source_word: לַגְּבָרִים
  choice: mtu mmoja baada ya mwingine
  rationale: Kirai hiki kifupi kinaweza kueleza kuwasilishwa kwa wanaume mmoja mmoja au kwa migawanyo ya wanaume. Tafsiri hii inaonyesha utaratibu wa mtu kwa mtu bila kudai uhakika usiokuwapo katika Kiebrania.
- source_word: וַיִּלָּכֵד
  choice: akapatikana
  rationale: Nifali ya לכד kwa msingi ni ‘alikamatwa,’ lakini katika muktadha wa kutambuliwa kwa kura, ‘akapatikana’ ni ya asili katika Kiswahili na bado inaonyesha kuwa kura ilimfichua, bila kutumia neno la kijeshi lisilofaa hapa.
- source_word: עָכָן
  choice: Akani
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: בֶּן כַּרְמִי בֶן זַבְדִּי בֶּן זֶרַח
  choice: mwana wa Karmi, mwana wa Zabdi, mwana wa Zera
  rationale: Mnyororo kamili wa nasaba umehifadhiwa kwa kufuata muundo wa chanzo.
- source_word: לְמַטֵּה יְהוּדָה
  choice: wa kabila la Yuda
  rationale: מַטֶּה katika muktadha huu humaanisha kabila; usemi huu ni wazi na wa kawaida katika Kiswahili.
