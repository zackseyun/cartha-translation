translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi katika ungamo la Akani huhifadhi mwendo wa simulizi na msisitizo wa “Tazama.” “Nyara,” “joho,” na “hema” ni maneno yanayoeleweka kwa wasomaji wa kawaida bila kuondoa mazingira ya kale.
