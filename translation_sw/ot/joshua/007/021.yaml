id: JOS.7.21
reference: Joshua 7:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: ו/אראה בַ/שָּׁלָ֡ל אַדֶּ֣רֶת שִׁנְעָר֩ אַחַ֨ת טוֹבָ֜ה וּ/מָאתַ֧יִם שְׁקָלִ֣ים כֶּ֗סֶף וּ/לְשׁ֨וֹן זָהָ֤ב אֶחָד֙ חֲמִשִּׁ֤ים שְׁקָלִים֙ מִשְׁקָל֔/וֹ וָֽ/אֶחְמְדֵ֖/ם וָֽ/אֶקָּחֵ֑/ם וְ/הִנָּ֨/ם טְמוּנִ֥ים בָּ/אָ֛רֶץ בְּ/ת֥וֹךְ הָ/אָֽהֳלִ֖/י וְ/הַ/כֶּ֥סֶף תַּחְתֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/021.yaml
  text: I saw among the spoil one beautiful cloak from Shinar[a], two hundred shekels of silver, and one bar of gold weighing fifty shekels. I coveted them and took them, and look, they are hidden in the ground inside my tent[c][b], with the silver underneath it.
translation:
  language: sw
  text: Niliona kati ya nyara joho moja zuri kutoka Shinari[a], shekeli mia mbili za fedha, na kipande kimoja cha dhahabu[b] chenye uzito wa shekeli hamsini. Nikavitamani na kuvichukua. Tazama, vimefichwa ardhini ndani ya hema langu, nayo fedha iko chini ya joho hilo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vazi moja la fahari kutoka Shinari.” Neno la Kiebrania linaweza kumaanisha joho, vazi zuri la nje, au vazi refu.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kwa maana halisi ni “ulimi mmoja wa dhahabu.” Huenda ikawa kipande cha dhahabu chenye umbo kama ulimi; kwa kawaida pia kimetafsiriwa “bapa la dhahabu.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiwakilishi cha mwisho katika Kiebrania ni cha kike umoja, na huenda kinarejelea joho: “fedha iko chini yake.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַשָּׁלָל
  choice: kati ya nyara
  rationale: שָׁלָל ni mali iliyotekwa vitani; “nyara” ni neno la kawaida na linalofaa katika simulizi hili, huku ב ikionyesha mahali kati ya vitu hivyo.
- source_word: אַדֶּרֶת שִׁנְעָר אַחַת טוֹבָה
  choice: joho moja zuri kutoka Shinari
  rationale: אַדֶּרֶת hapa ni vazi la nje lenye fahari, joho au vazi refu; “joho” ni la asili na linaeleweka. שִׁנְעָר ni jina la mahali, na “kutoka Shinari” linaonyesha asili ya vazi. טוֹבָה hapa inaeleza uzuri au ubora.
- source_word: וּמָאתַיִם שְׁקָלִים כֶּסֶף
  choice: shekeli mia mbili za fedha
  rationale: Kipimo cha kale kimehifadhiwa bila kukibadili kuwa kipimo cha kisasa.
- source_word: וּלְשׁוֹן זָהָב אֶחָד
  choice: kipande kimoja cha dhahabu
  rationale: לָשׁוֹן maana yake ya moja kwa moja ni “ulimi,” lakini hapa inaelekea kuwa kipande cha dhahabu kilichofanana na ulimi. “Kipande” ni cha kawaida na hakilazimishi umbo maalumu kupita ushahidi wa Kiebrania.
- source_word: חֲמִשִּׁים שְׁקָלִים מִשְׁקָלוֹ
  choice: chenye uzito wa shekeli hamsini
  rationale: Hutoa kwa Kiswahili cha kawaida maelezo ya uzito wa kipande cha dhahabu.
- source_word: וָאֶחְמְדֵם
  choice: Nikavitamani
  rationale: חמד hueleza tamaa yenye nguvu; katika ungamo hili muktadha wa kuchukua kilichokatazwa unabaki wazi bila kuongeza hukumu isiyosemwa moja kwa moja.
- source_word: וָאֶקָּחֵם
  choice: na kuvichukua
  rationale: לקח ni kitenzi cha kawaida cha kuchukua; hakuna ulazima wa kutumia kitenzi chenye nguvu zaidi.
- source_word: וְהִנָּם
  choice: Tazama, vimefichwa
  rationale: הִנָּם huvuta usikivu kwa kile kinachoonyeshwa; “Tazama” huhifadhi msisitizo huo kwa lugha yenye hadhi.
- source_word: טְמוּנִים בָּאָרֶץ
  choice: vimefichwa ardhini
  rationale: טְמוּנִים inaonyesha kufichwa, na בָּאָרֶץ hapa ni ndani ya udongo, si katika nchi kwa ujumla.
- source_word: בְּתוֹךְ הָאֳהֳלִי
  choice: ndani ya hema langu
  rationale: Ni tafsiri ya kawaida na wazi ya mahali ndani ya hema.
- source_word: וְהַכֶּסֶף תַּחְתֶּיהָ
  choice: nayo fedha iko chini ya joho hilo
  rationale: Kiambishi cha Kiebrania ni cha kike umoja na kwa kawaida kinarejelea joho; kutaja “joho hilo” huonyesha rejeo hilo wazi kwa Kiswahili huku tanbihi ikihifadhi maelezo ya kisarufi.
