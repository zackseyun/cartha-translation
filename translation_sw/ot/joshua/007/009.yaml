source:
  edition: WLC
  text: וְ/יִשְׁמְע֣וּ הַֽ/כְּנַעֲנִ֗י וְ/כֹל֙ יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נָסַ֣בּוּ עָלֵ֔י/נוּ וְ/הִכְרִ֥יתוּ אֶת שְׁמֵ֖/נוּ מִן הָ/אָ֑רֶץ וּ/מַֽה תַּעֲשֵׂ֖ה לְ/שִׁמְ/ךָ֥ הַ/גָּדֽוֹל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/009.yaml
  text: For the Canaanites and all the inhabitants of the land will hear[a], and they will surround us and cut off our name from the earth[b]. And what will you do for your great name?
translation:
  language: sw
  text: Kwa maana Wakanaani na wakazi wote wa nchi watasikia; nao watatuzingira na watalifuta jina letu duniani.[a] Basi, utafanya nini kwa ajili ya jina lako kuu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kulifuta jina letu duniani” ni msemo wa Kiebrania unaomaanisha kuwaangamiza watu kabisa na kuondoa hata kumbukumbu yao.
    reason: cultural_note
  - marker: b
    text: Au, “utafanya nini kuhusu jina lako kuu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׁמְעוּ
  choice: watasikia habari hii
  rationale: Kitenzi cha Kiebrania kina maana ya kusikia au kupata habari. Kirai “habari hii” kinaeleza kwa Kiswahili cha kawaida jambo linaloeleweka katika muktadha—kushindwa kwa Israeli—bila kubadili maana.
- source_word: הַכְּנַעֲנִי וְכֹל יֹשְׁבֵי הָאָרֶץ
  choice: Wakanaani na wakazi wote wa nchi
  rationale: Nomino ya Kiebrania “Mkanaani” ni ya umoja kimaumbo lakini inawakilisha jamii nzima; kwa hiyo wingi wa Kiswahili unafaa. Hapa הָאָרֶץ inaelekea kumaanisha nchi au eneo linalowazunguka, si ulimwengu wote.
- source_word: וְנָסַבּוּ עָלֵינוּ
  choice: nao watatuzingira
  rationale: נסב pamoja na עַל huonyesha kuzunguka au kuzingira, hasa katika tishio la kivita linalotajwa hapa.
- source_word: וְהִכְרִיתוּ אֶת שְׁמֵנוּ מִן הָאָרֶץ
  choice: na kulifuta jina letu duniani
  rationale: Tafsiri hii inadumisha tamathali ya Kiebrania ya “jina” huku “kulifuta ... duniani” ikieleweka kuwa kuangamiza taifa kabisa na kuondoa kumbukumbu yake.
- source_word: וּמַה תַּעֲשֶׂה
  choice: Basi, utafanya nini
  rationale: Kiswahili hiki kinadumisha swali la moja kwa moja kwa Mungu; “basi” linaonyesha matokeo ya hali ambayo Yoshua anahofia.
- source_word: לְשִׁמְךָ הַגָּדוֹל
  choice: kwa ajili ya jina lako kuu
  rationale: Kihusishi לְ kinaweza kuonyesha jambo linalohusu au linalofanywa kwa ajili ya mwingine. Katika muktadha huu, Yoshua anauliza Mungu atafanya nini kulinda heshima ya jina lake mbele ya mataifa.
theological_decisions:
- issue: Maana ya “jina lako kuu” katika ombi la Yoshua
  choice: Ni ombi linalohusu heshima ya Mungu mbele ya mataifa, ambayo itaathiriwa na kuangamizwa kwa Israeli.
  alternative: Swali la jumla kuhusu jina la Mungu bila kusisitiza sifa yake mbele ya mataifa.
  rationale: Muktadha unaunganisha wazi hatima ya Israeli na yale ambayo Wakanaani na wakazi wengine watasikia. Hata hivyo, tafsiri haiongezi maelezo ya kiagano yasiyosemwa moja kwa moja.
- issue: Nguvu ya kihusishi לְ katika לְשִׁמְךָ
  choice: kwa ajili ya jina lako kuu
  alternative: kuhusu jina lako kuu
  rationale: “Kwa ajili ya” linafaa zaidi kwa ombi la Yoshua kuhusu hatua ambayo Mungu atachukua kwa heshima ya jina lake, lakini tanbihi inahifadhi uwezekano mpana wa “kuhusu.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi lakini unadumisha tamathali ya “jina letu” na mvutano wa swali la Yoshua. Alama zote za tanbihi zimewekwa katika matini kuu.
