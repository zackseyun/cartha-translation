source:
  edition: WLC
  text: וַ/יִּקְרַ֨ע יְהוֹשֻׁ֜עַ שִׂמְלֹתָ֗י/ו וַ/יִּפֹּל֩ עַל פָּנָ֨י/ו אַ֜רְצָ/ה לִ/פְנֵ֨י אֲר֤וֹן יְהוָה֙ עַד הָ/עֶ֔רֶב ה֖וּא וְ/זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעֲל֥וּ עָפָ֖ר עַל רֹאשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/006.yaml
  text: Then Joshua tore his clothes and fell facedown to the ground before the ark of Yahweh until evening[a], he and the elders of Israel[b], and they put dust on their heads.
translation:
  language: sw
  text: Ndipo Yoshua akararua mavazi yake, naye pamoja na wazee wa Israeli wakaanguka kifudifudi chini mbele ya sanduku la Yahwe hadi jioni.[a] Kisha wakaweka mavumbi juu ya vichwa vyao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa mpangilio mwingine wa kirai: “hadi jioni mbele ya sanduku la Yahwe.”'
    reason: alternative_reading
  - marker: b
    text: Kuweka mavumbi juu ya kichwa ilikuwa desturi ya kuonyesha huzuni, maombolezo, au kujinyenyekeza.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרַע
  choice: akararua
  rationale: Kitenzi קרע katika muktadha wa huzuni kinaonyesha kurarua mavazi; “akararua” ni cha kawaida na kinahifadhi tendo halisi.
- source_word: שִׂמְלֹתָיו
  choice: mavazi yake
  rationale: שִׂמְלָה ni neno la jumla kwa nguo au mavazi; “mavazi yake” ni la heshima na linaeleweka kwa urahisi.
- source_word: וַיִּפֹּל עַל־פָּנָיו אַרְצָה
  choice: wakaanguka kifudifudi chini
  rationale: Nahau hii inaonyesha kujilaza uso ukielekea chini. Umbo la wingi linatumika kwa sababu kauli inayofuata inamtaja Yoshua pamoja na wazee wa Israeli kuwa washiriki wa tendo hilo.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: mbele ya sanduku la Yahwe
  rationale: לִפְנֵי ni “mbele ya/katika uwepo wa,” na אֲרוֹן ni sanduku takatifu linalotajwa hapa. Neno “agano” halijaongezwa kwa kuwa halipo wazi katika mstari huu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kuwa “Yahwe,” badala ya kubadilishwa na cheo.
- source_word: עַד הָעֶרֶב
  choice: hadi jioni
  rationale: Hii ni tafsiri ya moja kwa moja, ya kawaida na iliyo wazi ya kipindi kinachotajwa.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: naye pamoja na wazee wa Israeli
  rationale: Maneno haya yanamweka Yoshua pamoja na wazee wa Israeli kama washiriki wa tendo la kuanguka kifudifudi.
- source_word: וַיַּעֲלוּ עָפָר עַל־רֹאשָׁם
  choice: wakajitupia mavumbi vichwani
  rationale: Kauli hii inaeleza desturi ya kuweka au kutupa mavumbi juu ya kichwa kama ishara ya huzuni na kujinyenyekeza; “wakajitupia” ni ya asili katika Kiswahili na inadumisha tendo lenyewe.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; “Yahwe” linahifadhi jina hilo badala ya kulibadilisha na cheo.
- issue: Washiriki wa tendo la kuanguka kifudifudi
  choice: Yoshua pamoja na wazee wa Israeli wakaanguka
  alternative: Yoshua peke yake akaanguka, huku wazee wakitajwa baadaye
  rationale: Ingawa kitenzi cha Kiebrania kiko katika umoja, kirai הוּא וְזִקְנֵי יִשְׂרָאֵל kinamjumuisha Yoshua na wazee katika tendo hilo. Kiswahili kinahitaji upatanisho wa wingi ili maana hiyo iwe wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. “Kifudifudi” huwasilisha vizuri hali ya uso kuelekea chini, na sentensi imegawanywa mara mbili ili kuepuka muundo mzito bila kupoteza mfuatano wa Kiebrania.
