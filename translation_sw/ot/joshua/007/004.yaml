- from: Basi watu wapatao elfu tatu kutoka miongoni mwa watu wakapanda kwenda huko, lakini wakawakimbia watu wa Ai.
  to: Basi wanaume wapatao elfu tatu kutoka miongoni mwa watu wakapanda kwenda huko, lakini wakawakimbia wanaume wa Ai.
