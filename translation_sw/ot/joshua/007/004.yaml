  yaml_path: translation/ot/joshua/007/004.yaml
  text: So about three thousand men from the people went up there, but they fled before the men of Ai.
translation:
  language: sw
  text: Basi wanaume wapatao elfu tatu kutoka miongoni mwa watu wakapanda kwenda huko, lakini wakawakimbia wanaume wa Ai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: wakapanda kwenda
  rationale: Kitenzi עלה kimsingi humaanisha kupanda au kwenda juu. Katika simulizi hili la kijeshi kuelekea Ai, “wakapanda kwenda” kinahifadhi dhana ya mwendo kuelekea mahali palipo juu bila kuingiza wazo la kushambulia ndani ya kitenzi.
- source_word: מִן הָעָם
  choice: kutoka miongoni mwa watu
  rationale: עם humaanisha “watu.” Kirai hiki kinaonyesha kuwa kundi hilo lilitolewa miongoni mwa watu wa Israeli; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: שָׁמָּה
  choice: huko
  rationale: Kielezi hiki huonyesha kuelekea mahali palipotajwa tayari. “Huko” ni tafsiri fupi na ya asili katika muktadha huu.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: watu wapatao elfu tatu
  rationale: כִּ־ pamoja na idadi huonyesha ukadiriaji, hivyo “wapatao.” אִישׁ hapa hutumiwa kuhesabu watu, si kama nomino mahsusi ya wanajeshi; kwa hiyo “watu” huepuka kufafanua zaidi ya Kiebrania.
- source_word: וַיָּנֻסוּ
  choice: wakawakimbia
  rationale: נוס humaanisha kukimbia ili kujiokoa. Muundo “wakawakimbia watu wa Ai” ni wa kawaida katika Kiswahili na unaonyesha wazi kuwa walirudi nyuma kwa hofu au kushindwa.
- source_word: לִפְנֵי
  choice: wakawakimbia
  rationale: 'Katika muundo unaohusu kukimbia, לִפְנֵי huonyesha kuondoka mbele ya adui. Kiswahili huwasilisha maana hiyo kwa kawaida kwa kitenzi chenye yambwa: “wakawakimbia watu wa Ai.”'
- source_word: אַנְשֵׁי הָעָי
  choice: watu wa Ai
  rationale: Kirai hiki humaanisha wanaume wa Ai, hapa hasa watetezi au wapiganaji wake. “Watu wa Ai” ni cha asili na hakiongezi nomino ya kijeshi ambayo haikutumiwa moja kwa moja katika chanzo.
