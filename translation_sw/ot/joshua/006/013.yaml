  text: וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֜וֹת הַ/יֹּבְלִ֗ים לִ/פְנֵי֙ אֲר֣וֹן יְהוָ֔ה הֹלְכִ֣ים הָל֔וֹךְ וְ/תָקְע֖וּ בַּ/שּׁוֹפָר֑וֹת וְ/הֶ/חָלוּץ֙ הֹלֵ֣ךְ לִ/פְנֵי/הֶ֔ם וְ/הַֽ/מְאַסֵּ֗ף הֹלֵךְ֙ אַֽחֲרֵי֙ אֲר֣וֹן יְהוָ֔ה הולך וְ/תָק֥וֹעַ בַּ/שּׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/013.yaml
  text: And the seven priests[a], carrying seven ram’s-horn trumpets before the ark of Yahweh, were walking on and blowing the trumpets, and the armed men were going before them, and the rear guard was going behind the ark of Yahweh, while they went on blowing the trumpets.
translation:
  language: sw
  text: Nao makuhani saba, wakiwa wamebeba baragumu saba za pembe za kondoo dume[a] mbele ya sanduku la Yahweh, waliendelea kutembea huku wakipiga baragumu. Watu wenye silaha walitembea mbele yao, na walinzi wa nyuma walitembea nyuma ya sanduku la Yahweh, huku wakiendelea kutembea na kupiga baragumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “baragumu saba za yubile,” au “pembe saba za kondoo dume.” Usemi wa Kiebrania unataja baragumu zilizotengenezwa kwa pembe za kondoo dume au zilizohusianishwa nazo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹפְרוֹת הַיֹּבְלִים
  choice: baragumu saba za pembe za kondoo dume
  rationale: Neno שׁוֹפָר humaanisha pembe inayopigwa kama chombo cha muziki au kutoa ishara, na הַיֹּבְלִים huihusianisha na kondoo dume. Tafsiri hii inaonyesha chombo hicho na asili yake kwa Kiswahili kinachoeleweka.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo.
- source_word: הֹלְכִים הָלוֹךְ
  choice: waliendelea kutembea
  rationale: Muundo wa kitenzi pamoja na kitenzi-jina kisicho na kikomo unaonyesha tendo linaloendelea au kusisitizwa.
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: huku wakipiga baragumu
  rationale: Katika Kiswahili, ‘kupiga baragumu’ ni usemi wa kawaida kwa tendo la kutoa sauti kwa chombo hiki, na ‘huku’ huonyesha kuwa tendo hilo liliendelea sambamba na kutembea.
- source_word: הֶחָלוּץ
  choice: watu wenye silaha
  rationale: Neno hili humaanisha kikosi kilichojitayarisha kwa vita kilichotangulia msafara.
- source_word: הַמְאַסֵּף
  choice: walinzi wa nyuma
  rationale: Katika muktadha wa kijeshi na wa msafara, neno hili hutaja kikosi kinachofunga msafara kwa nyuma.
- source_word: הוֹלֵךְ וְתָקוֹעַ
  choice: huku wakiendelea kutembea na kupiga baragumu
  rationale: Tafsiri hii inadumisha hali ya mwendo na upigaji wa baragumu unaoendelea, bila kuondoa uwezekano wa kiwakilishi kurejelea washiriki wa msafara waliotajwa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; ‘Yahweh’ hulihifadhi kama jina binafsi badala ya kuweka cheo mahali pake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Baragumu’ linafaa kwa chombo cha kutoa ishara katika muktadha huu; miundo ya ‘waliendelea’ na ‘huku’ inadokeza mwendo na upigaji ulioendelea. Alama ya tanbihi imewekwa baada ya kirai inachokifafanua.
