  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo wa maandamano katika Kiebrania: makuhani saba wenye baragumu saba, watu wenye silaha mbele yao, na kikosi cha nyuma nyuma ya sanduku la Yahweh. Miundo ya ''waliendelea kutembea'' na ''huku ... wakipiga'' inawakilisha ipasavyo hali endelevu ya הֹלְכִים הָלוֹךְ na הוֹלֵךְ וְתָקוֹעַ.'
  naturalness: Kiswahili ni sanifu, cha sasa, na kinaeleweka. 'Kupiga baragumu,' 'watu wenye silaha,' na 'walinzi wa nyuma' ni misemo ya kawaida katika muktadha wa maandamano ya kijeshi. Kiwakilishi cha wingi katika kirai cha mwisho kinaendana kiasili na 'walinzi wa nyuma' kama kundi.
  terminology: '''Yahweh'' linahifadhi jina la Kiebrania kama inavyotakiwa. ''Baragumu za pembe za kondoo dume'' linaonyesha kwa uwazi maana ya שׁוֹפְרוֹת הַיֹּבְלִים, na tanbihi inatoa mbadala wa kileksia bila kudai maana moja isiyothibitishwa.'
