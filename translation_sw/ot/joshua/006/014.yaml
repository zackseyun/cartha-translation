  text: On the second day they went around the city once and returned to the camp[b][a]. Thus they did for six days.
translation:
  language: sw
  text: Siku ya pili waliuzunguka mji mara moja tu, kisha wakarudi kambini. Walifanya hivyo kwa siku sita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: waliuzunguka
  rationale: Kitenzi סבב hapa kinaeleza kwenda kuuzunguka mji. “Waliuzunguka” ni Kiswahili cha kawaida na hakiongezi wazo la kijeshi lisilotajwa wazi.
- source_word: הָעִיר
  choice: mji
  rationale: עִיר kwa kawaida humaanisha mji, na hapa unarejelea Yeriko.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Siku ya pili
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha wakati.
- source_word: פַּעַם אַחַת
  choice: mara moja
  rationale: Kirai hiki humaanisha mara moja; usemi huo ni wa kawaida na sahihi katika Kiswahili.
- source_word: וַיָּשֻׁבוּ
  choice: kisha wakarudi
  rationale: שורש שוב humaanisha kurudi. “Kisha” huonyesha kwa kawaida mfuatano wa matukio unaobebwa na simulizi la Kiebrania.
- source_word: הַמַּחֲנֶה
  choice: kambini
  rationale: מַחֲנֶה humaanisha kambi; hali ya mahali “kambini” huonyesha kwa Kiswahili walikorudi.
- source_word: כֹּה עָשׂוּ
  choice: Walifanya hivyo
  rationale: Usemi huu unaonyesha kwamba utaratibu ulioelezwa ndio walioufuata; “walifanya hivyo” ni wa asili na hudumisha maana hiyo.
- source_word: שֵׁשֶׁת יָמִים
  choice: kwa siku sita
  rationale: Katika muktadha huu kirai kinaonyesha muda ambao utaratibu huo ulifuatwa; “kwa siku sita” ni usemi wa kawaida wa Kiswahili.
