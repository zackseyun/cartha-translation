  text: וַ/יָּבֹ֜אוּ הַ/נְּעָרִ֣ים הַֽ/מְרַגְּלִ֗ים וַ/יֹּצִ֡יאוּ אֶת רָ֠חָב וְ/אֶת אָבִ֨י/הָ וְ/אֶת אִמָּ֤/הּ וְ/אֶת אַחֶ֨י/הָ֙ וְ/אֶת כָּל אֲשֶׁר לָ֔/הּ וְ/אֵ֥ת כָּל מִשְׁפְּחוֹתֶ֖י/הָ הוֹצִ֑יאוּ וַ/יַּ֨נִּיח֔וּ/ם מִ/ח֖וּץ לְ/מַחֲנֵ֥ה יִשְׂרָאֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/023.yaml
  text: So the young men[a], the spies, went in and brought out Rahab, her father, her mother, her brothers, and all who belonged to her[b]. They brought out all her families and placed them outside the camp of Israel.
translation:
  language: sw
  text: Basi wale vijana waliokuwa wapelelezi wakaingia na kuwatoa Rahabu, baba yake, mama yake, ndugu zake, na wote waliokuwa wake[a]. Wakawatoa jamaa zake wote[b] na kuwaweka nje ya kambi ya Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na vyote vilivyokuwa vyake.” Kauli ya Kiebrania inaweza kuhusisha zaidi ya watu peke yao, ingawa katika muktadha huu yaelekea hasa kuwarejelea watu wa nyumba yake.
    reason: lexical_alternative
  - marker: b
    text: Au, “koo zake zote” au “familia zake zote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּעָרִים
  choice: wale vijana
  rationale: Neno נַעַר hapa linawataja wanaume vijana waliokuwa wapelelezi; “vijana” ni tafsiri ya kawaida na ya asili katika Kiswahili sanifu.
- source_word: הַמְרַגְּלִים
  choice: yaani wale wapelelezi
  rationale: Kivumishi hiki kinabainisha vijana wanaokusudiwa. “Yaani” linaonyesha kwamba ni wale vijana wale waliofanya upelelezi, bila kuongeza kitu kisichotajwa katika mstari huu.
- source_word: וַיֹּצִיאוּ / הוֹצִיאוּ
  choice: wakawatoa
  rationale: Hiphil ya יצא humaanisha kusababisha watoke au kuwatoa. Kurudia “wakawatoa” kunahifadhi urudiaji wa kitenzi katika Kiebrania.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: wote waliokuwa wake
  rationale: Kauli ya Kiebrania ni pana, kwa maana ya vyote au wote waliokuwa mali yake. Katika muktadha huu inaelekea hasa kwa watu wa nyumba yake, lakini tanbihi inadumisha uwezekano mpana zaidi.
- source_word: מִשְׁפְּחוֹתֶיהָ
  choice: jamaa zake wote
  rationale: מִשְׁפָּחָה inaweza kumaanisha familia pana, ukoo, au kundi la jamaa. “Jamaa zake wote” ni ya asili katika Kiswahili na inatofautisha kundi hili pana na ndugu waliotajwa tayari.
- source_word: וַיַּנִּיחוּם
  choice: kuwaweka
  rationale: Hiphil ya נוח hapa ina maana ya kuwaweka au kuwaacha mahali fulani. “Kuwaweka” huonyesha tendo la makusudi bila kueleza sababu yake.
- source_word: מִחוּץ לְמַחֲנֵה יִשְׂרָאֵל
  choice: nje ya kambi ya Israeli
  rationale: Tafsiri hii inahifadhi taarifa ya mahali kwa uwazi na bila kuongeza maelezo kuhusu sababu ya wao kuwekwa huko.
theological_decisions:
- issue: Sababu ya Rahabu na watu wake kuwekwa nje ya kambi
  choice: Kutaja mahali pekee bila kueleza sababu
  alternative: Kutafsiri kuwa walitengwa kwa muda kwa sababu za kiibada, ulinzi, au maandalizi ya kuingizwa katika Israeli
  rationale: Maandishi ya Kiebrania hayasemi sababu. Tafsiri inadumisha ukimya na mvutano wa simulizi badala ya kuingiza ufafanuzi wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi wenye “waka-” umehifadhi mwendelezo wa matendo; “yaani wale wapelelezi” hubainisha vijana bila kuongeza “nchi,” ambalo halipo wazi katika mstari huu.
