base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/004.yaml
  text: And seven priests shall carry seven ram’s-horn trumpets before the ark. On the seventh day you shall march around the city seven times[a], and the priests shall blow the trumpets.
translation:
  language: sw
  text: Makuhani saba watabeba tarumbeta saba za pembe za kondoo dume[a] mbele ya Sanduku. Siku ya saba mtauzunguka mji mara saba, nao makuhani watazipiga tarumbeta hizo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pembe saba za kondoo dume,” au “shofari saba za pembe za kondoo dume.” Kirai cha Kiebrania hurejelea vyombo vya kupuliza vya pembe; huenda kinahusisha pembe za kondoo dume.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: watabeba
  rationale: Kitenzi נשא hapa kinaeleza kubeba vyombo kwa mikono katika msafara; “watabeba” ni Kiswahili cha kawaida na sahihi.
- source_word: שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: tarumbeta za pembe za kondoo dume
  rationale: Kirai hiki kinataja vyombo vya kupuliza vya pembe, yaelekea pembe za kondoo dume. Tafsiri hii inaonyesha matumizi yake kama tarumbeta na kitu kilichotumiwa kuzitengeneza, bila kutumia neno la mkopo lisiloeleweka kwa wengi.
- source_word: לִפְנֵי הָאָרוֹן
  choice: mbele ya Sanduku
  rationale: לִפְנֵי ina maana ya mahali, “mbele ya.” “Sanduku” limetumiwa kama jina la chombo kitakatifu kinachojulikana katika muktadha, bila kuongeza “la Agano,” ambayo haipo wazi katika mstari huu.
- source_word: תָּסֹבּוּ אֶת הָעִיר
  choice: mtauzunguka mji
  rationale: סבב ina maana ya kwenda au kuzunguka kitu. “Mtauzunguka mji” ni ya asili na hudumisha tendo la msafara bila kuongeza wazo la kijeshi lisilotajwa moja kwa moja katika kitenzi.
- source_word: שֶׁבַע פְּעָמִים
  choice: mara saba
  rationale: פְּעָמִים pamoja na namba huonyesha idadi ya kurudiwa kwa tendo; “mara saba” ni usemi wa kawaida wa Kiswahili.
- source_word: יִתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: watazipiga tarumbeta hizo
  rationale: Katika Kiswahili, “kupiga tarumbeta” ni usemi wa kawaida wa kutoa sauti kwa chombo hiki. Kiwakilishi “hizo” kinarejelea tarumbeta zilizotajwa mwanzoni.
