  text: וַ/יָּ֣רַע הָ/עָ֔ם וַֽ/יִּתְקְע֖וּ בַּ/שֹּֽׁפָר֑וֹת וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הָ/עָ֜ם אֶת ק֣וֹל הַ/שּׁוֹפָ֗ר וַ/יָּרִ֤יעוּ הָ/עָם֙ תְּרוּעָ֣ה גְדוֹלָ֔ה וַ/תִּפֹּ֨ל הַֽ/חוֹמָ֜ה תַּחְתֶּ֗י/הָ וַ/יַּ֨עַל הָ/עָ֤ם הָ/עִ֨ירָ/ה֙ אִ֣ישׁ נֶגְדּ֔/וֹ וַֽ/יִּלְכְּד֖וּ אֶת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/020.yaml
  text: So the people shouted[a], and they blew the trumpets. And when the people heard the sound of the trumpet, the people shouted a great shout, and the wall fell down beneath it, and the people went up into the city, each man straight before him[b], and they captured the city.
translation:
  language: sw
  text: Basi watu wakapiga kelele, nao wakapiga tarumbeta[b]. Watu waliposikia sauti ya tarumbeta, wakapiga kelele kubwa, na ukuta ukaporomoka chini mahali pake[a]. Kisha watu wakapanda kuingia mjini, kila mwanamume akielekea moja kwa moja mbele yake, nao wakauteka mji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukuta ukaanguka chini ukawa tambarare.” Kiebrania kinasema kihalisi kwamba ukuta ulianguka “chini yake,” usemi usio wa kawaida ambao huenda unaeleza ukuta kuporomoka moja kwa moja pale uliposimama.
    reason: lexical_alternative
  - marker: b
    text: “Tarumbeta” hapa inatafsiri neno la Kiebrania shofar, yaani ala ya pembe iliyotumiwa kutoa ishara; inaweza pia kuitwa “pembe ya kondoo dume.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּרַע / וַיָּרִיעוּ / תְּרוּעָה
  choice: wakapiga kelele / wakapiga kelele kubwa
  rationale: Mzizi רוע na nomino תְּרוּעָה zinaonyesha sauti kubwa ya pamoja, mara nyingi katika vita au ibada. “Kupiga kelele” ni Kiswahili cha kawaida kisichoongeza wazi wazo la kilio cha vita ambalo halikutajwa moja kwa moja.
- source_word: שׁוֹפָרוֹת / שׁוֹפָר
  choice: tarumbeta
  rationale: שׁוֹפָר ni ala ya pembe iliyotumiwa kutoa ishara. “Tarumbeta” inaeleweka kwa urahisi katika Kiswahili cha sasa; maelezo ya chini yanafafanua aina ya ala bila kuifanya aya iwe nzito.
- source_word: קוֹל הַשּׁוֹפָר
  choice: sauti ya tarumbeta
  rationale: קוֹל ni “sauti” au “sauti ya kiumbe”; inapohusishwa na ala, “sauti” ni ya kawaida na inabaki karibu na Kiebrania.
- source_word: וַתִּפֹּל הַחוֹמָה תַּחְתֶּיהָ
  choice: ukuta ukaporomoka chini mahali pake
  rationale: Kirai cha Kiebrania ni kisicho cha kawaida, kihalisi kikielekea kusema ukuta ulianguka “chini yake.” Tafsiri hii inaonyesha kuporomoka moja kwa moja pale uliposimama bila kulazimisha maana ya “kuwa tambarare.”
- source_word: וַיַּעַל ... הָעִירָה
  choice: wakapanda kuingia mjini
  rationale: עלה ni “kupanda/kwenda juu,” na kiambishi elekezi katika הָעִירָה kinaonyesha mwendo kuelekea na kuingia mjini.
- source_word: אִישׁ נֶגְדּוֹ
  choice: kila mwanamume akielekea moja kwa moja mbele yake
  rationale: אִישׁ ni nomino ya kiume iliyotumiwa kwa maana ya kila mmoja mmoja, na נֶגְדּוֹ huonyesha kilichokuwa moja kwa moja mbele ya kila mwanamume.
- source_word: וַיִּלְכְּדוּ
  choice: wakauteka mji
  rationale: לכד katika simulizi la kijeshi humaanisha kuteka au kuushika mji kwa nguvu; “kuteka” ni neno wazi na la kawaida katika muktadha huu.
theological_decisions:
- issue: Usemi wa kiume wa kugawa אִישׁ נֶגְדּוֹ
  choice: kila mwanamume akielekea moja kwa moja mbele yake
  alternative: kila mmoja akaelekea moja kwa moja mbele yake
  rationale: Kiebrania kimetumia אִישׁ, “mwanamume,” kwa umoja wa kugawa. Tafsiri kuu inadumisha jinsia iliyo wazi katika maandishi badala ya kuifanya isiyo na jinsia.
- issue: Maana ya kirai kisicho cha kawaida תַּחְתֶּיהָ kuhusu kuanguka kwa ukuta
  choice: ukuta ukaporomoka chini mahali pake
  alternative: ukuta ukaanguka chini ukawa tambarare
  rationale: Maandishi yanaweza kueleza ukuta kuporomoka moja kwa moja pale uliposimama, lakini hayalazimishi wazi kwamba ulianguka na kuwa tambarare. Tafsiri inadumisha mvutano huo, na maelezo ya chini yanataja uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye hadhi. Viunganishi na vitenzi vya mfululizo vinadumisha kasi ya simulizi, huku maneno ya kijeshi yasiyosemwa wazi katika Kiebrania yakiepukwa.
