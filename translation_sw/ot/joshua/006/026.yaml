  text: וַ/יַּשְׁבַּ֣ע יְהוֹשֻׁ֔עַ בָּ/עֵ֥ת הַ/הִ֖יא לֵ/אמֹ֑ר אָר֨וּר הָ/אִ֜ישׁ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֤ר יָקוּם֙ וּ/בָנָ֞ה אֶת הָ/עִ֤יר הַ/זֹּאת֙ אֶת יְרִיח֔וֹ בִּ/בְכֹר֣/וֹ יְיַסְּדֶ֔/נָּה וּ/בִ/צְעִיר֖/וֹ יַצִּ֥יב דְּלָתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/026.yaml
  text: At that time Joshua made them swear[a], saying, “Cursed before Yahweh is the man who rises up and rebuilds this city, Jericho. At the cost of his firstborn he will lay its foundation[c][b], and at the cost of his youngest he will set up its gates.”
translation:
  language: sw
  text: Wakati huo Yoshua aliwaapisha[a], akisema, “Amelaaniwa mbele za Yahwe mtu yeyote[b] atakayeinuka na kuujenga upya mji huu, yaani Yeriko. Ataweka msingi wake kwa gharama ya mwanawe wa kwanza[c], naye ataweka malango yake kwa gharama ya mwanawe mdogo zaidi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “aliwaweka chini ya kiapo.” Kitenzi cha Kiebrania ni cha kisababishi: Yoshua aliwasababisha watu waape.'
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi ni “mtu.” Nomino hiyo ni ya kiume umoja lakini hapa inatumika kwa maana ya mtu yeyote.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “kwa/katika mwanawe wa kwanza ... na kwa/katika mwanawe mdogo zaidi.” Katika muktadha huu usemi huo huenda unamaanisha “kwa gharama ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבַּע
  choice: aliwaapisha
  rationale: Hifili ya שׁבע ina maana ya kuwasababisha wengine waape au kuwaweka chini ya kiapo. Kiswahili ‘aliwaapisha’ huonyesha maana hiyo ya kisababishi kwa ufupi na kwa kawaida.
- source_word: בָּעֵת הַהִיא
  choice: Wakati huo
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili unaowakilisha vizuri kirai cha wakati.
- source_word: אָרוּר הָאִישׁ
  choice: Amelaaniwa ... mtu yeyote
  rationale: ‘Amelaaniwa’ huhifadhi muundo na uzito wa tamko la laana. Ingawa Kiebrania kina nomino ya kiume umoja ‘mtu,’ hapa matumizi ni ya jumla; ‘mtu yeyote’ yanafikisha wigo huo kwa Kiswahili cha kawaida.
- source_word: לִפְנֵי יְהוָה
  choice: mbele za Yahwe
  rationale: Huhifadhi wazo la kuwa katika uwepo au mbele ya YHWH, huku jina la Mungu likitafsiriwa kwa ‘Yahwe’ kulingana na ushahidi na safu ya mashauriano iliyotolewa.
- source_word: יָקוּם וּבָנָה
  choice: atakayeinuka na kuujenga upya
  rationale: Jozi hii inaonyesha mtu kuchukua hatua ya kuurudisha mji ulioharibiwa. ‘Kuinuka na kuujenga upya’ huhifadhi taswira ya Kiebrania na kuweka wazi muktadha.
- source_word: הָעִיר הַזֹּאת אֶת יְרִיחוֹ
  choice: mji huu, yaani Yeriko
  rationale: ‘Yaani’ huwasilisha kwa asili uhusiano wa kiambatisho unaotambulisha mji huo kuwa Yeriko.
- source_word: בִּבְכֹרוֹ
  choice: kwa gharama ya mzaliwa wake wa kwanza
  rationale: Herufi ב katika muktadha huu inaeleweka kuwa gharama au hasara inayohusiana na kuweka msingi. Tafsiri hii haitaji njia hasa ambayo mzaliwa huyo atapotea.
- source_word: יְיַסְּדֶנָּה
  choice: Ataweka msingi wake
  rationale: Kitenzi יסד katika muktadha wa ujenzi kina maana halisi ya kuweka msingi; kiambishi cha kike kinarejelea jiji.
- source_word: וּבִצְעִירוֹ
  choice: kwa gharama ya mwanawe mdogo zaidi
  rationale: צָעִיר katika ulinganifu na mzaliwa wa kwanza humaanisha mwana mdogo zaidi. Kutaja ‘mwanawe’ huifanya maana hiyo iwe wazi na ya kawaida katika Kiswahili.
- source_word: יַצִּיב דְּלָתֶיהָ
  choice: atasimamisha malango yake
  rationale: Katika muktadha wa mji wenye ngome, דלתות hurejelea milango ya lango la mji. ‘Kusimamisha malango’ ni usemi wa heshima unaokaribia muundo wa chanzo.
theological_decisions:
- issue: Asili ya tamko la Yoshua
  choice: Tamko rasmi la laana mbele za Yahwe dhidi ya yeyote atakayeijenga Yeriko upya
  alternative: Tamaa binafsi tu ya Yoshua au marufuku ya kiraia isiyo na uzito wa kitheolojia
  rationale: Maneno ‘amelaaniwa mbele za Yahwe’ yanaonyesha laana nzito inayotamkwa katika uwepo wa Mungu, bila kuongeza maelezo ambayo mstari hautoi.
- issue: Maana ya laana inayowahusu wana wa mjenzi
  choice: Mjenzi atawapoteza mzaliwa wake wa kwanza na mwanawe mdogo zaidi katika hatua za kuweka msingi na kusimamisha malango
  alternative: Watoto watatolewa dhabihu kwa makusudi, au mjenzi atapatwa tu na mikosi isiyohusisha kupoteza wanawe
  rationale: Kirai cha Kiebrania kinaonyesha gharama au hasara kubwa inayofungamanishwa na hatua za ujenzi, lakini hakielezi wazi utaratibu wa vifo wala dhabihu; tafsiri inaacha jambo hilo bila kuliamua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa sasa. ‘Aliwaapisha’ ni wazi kwa wasomaji wa kawaida; ‘amelaaniwa mbele za Yahwe’ huhifadhi uzito wa fomula ya laana. ‘Mtu yeyote’ huepuka kuifanya jinsia ya kisarufi kuwa kizuizi cha maana ya jumla. Alama zote za tanbihi [a], [b], na [c] zimewekwa katika matini kuu.
