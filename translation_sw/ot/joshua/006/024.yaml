  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָ/עִ֛יר שָׂרְפ֥וּ בָ/אֵ֖שׁ וְ/כָל אֲשֶׁר בָּ֑/הּ רַ֣ק הַ/כֶּ֣סֶף וְ/הַ/זָּהָ֗ב וּ/כְלֵ֤י הַ/נְּחֹ֨שֶׁת֙ וְ/הַ/בַּרְזֶ֔ל נָתְנ֖וּ אוֹצַ֥ר בֵּית יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/024.yaml
  text: And they burned the city with fire[a], and everything that was in it. Only the silver and the gold, and the articles of bronze and iron, they put into the treasury of the house of Yahweh.
translation:
  language: sw
  text: Nao wakauteketeza mji kwa moto, pamoja na vyote vilivyokuwa ndani yake. Isipokuwa tu fedha, dhahabu, na vyombo vya shaba na chuma[a]; vitu hivyo waliviweka katika hazina ya nyumba ya Yahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vifaa vya shaba na chuma.” Neno la Kiebrania linaweza kumaanisha kwa upana vyombo, vifaa, au zana.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: wakauteketeza ... kwa moto
  rationale: Kitenzi שׂרף kinamaanisha kuchoma au kuteketeza; “kwa moto” linaonyesha moto kuwa njia iliyotumiwa. “Wakauteketeza” ni Kiswahili cha kawaida na hudumisha tendo la uharibifu kamili katika muktadha.
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: pamoja na vyote vilivyokuwa ndani yake
  rationale: Maneno haya yanajumuisha kila kilichokuwamo mjini. “Vyote” huhifadhi upana wa usemi bila kufafanua zaidi vitu au viumbe vilivyohusika.
- source_word: רַק
  choice: Isipokuwa tu
  rationale: רַק hapa linaanzisha vitu vilivyoondolewa katika uharibifu uliotajwa. “Isipokuwa tu” linaonyesha wazi hali hiyo ya kuvitenga.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: fedha, dhahabu
  rationale: Haya ndiyo majina ya kawaida ya metali hizo katika Kiswahili. Kiswahili hakihitaji vibainishi vinavyolingana na הַ katika orodha hii.
- source_word: וּכְלֵי הַנְּחֹשֶׁת וְהַבַּרְזֶל
  choice: vyombo vya shaba na chuma
  rationale: כְּלֵי ni neno pana linaloweza kumaanisha vyombo, vifaa, au zana. “Vyombo” ni fasiri ya kawaida na yenye upana wa kutosha, huku tanbihi ikihifadhi uwezekano wa “vifaa.” נְחֹשֶׁת limetafsiriwa “shaba,” neno la kawaida la Kibiblia la Kiswahili kwa metali hiyo katika muktadha huu.
- source_word: נָתְנוּ
  choice: waliviweka
  rationale: Ingawa נתן mara nyingi ni “kutoa,” hapa linaeleza kuweka vitu katika hazina. “Waliviweka” huwasilisha maana hiyo ya kimuktadha kwa Kiswahili cha kawaida.
- source_word: אוֹצַר
  choice: hazina
  rationale: אוֹצָר hapa ni mahali pa kuhifadhi vitu vya thamani vilivyowekwa kwa matumizi matakatifu; “hazina” linafaa kwa mahali na mali inayohifadhiwa humo.
- source_word: בֵּית יְהוָה
  choice: nyumba ya Yahwe
  rationale: “Nyumba” hudumisha בית bila kutumia “hekalu,” ambalo lingekuwa mahususi kupita mazingira ya wakati wa Yoshua. Jina la agano יהוה limetolewa kama “Yahwe.”
theological_decisions:
- issue: Utoaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la Mungu יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina la agano badala ya kulibadilisha kuwa cheo.
- issue: Mahali metali zilipowekwa
  choice: katika hazina ya nyumba ya Yahwe
  alternative: katika hazina iliyo ya nyumba ya Yahwe
  rationale: Mnyororo wa nomino אוֹצַר בֵּית יְהוָה unaonyesha hazina inayohusiana na nyumba ya Yahwe. Fasiri haitaji “hekalu” wala kuongeza maelezo yasiyomo kuhusu matumizi ya metali hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “Nao” unaendeleza simulizi, na “Isipokuwa tu” unaonyesha wazi tofauti kati ya vitu vilivyoteketezwa na metali zilizohifadhiwa. Alama ya tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja, yaani “vyombo vya shaba na chuma.”
