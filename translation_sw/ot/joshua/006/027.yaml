  text: וַ/יְהִ֥י יְהוָ֖ה אֶת יְהוֹשֻׁ֑עַ וַ/יְהִ֥י שָׁמְע֖/וֹ בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/027.yaml
  text: And Yahweh was with Joshua[a], and his fame was in all the land.
translation:
  language: sw
  text: Yahwe alikuwa pamoja na Yoshua, na umaarufu wake[a] ukaenea katika nchi yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “habari zake” au “taarifa kumhusu.” Neno la Kiebrania linaweza kumaanisha habari, taarifa, au sifa; hapa huenda linarejelea jinsi Yoshua alivyozidi kujulikana.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kwa cheo kama “BWANA,” kulingana na sera ya mradi.
- source_word: וַיְהִי
  choice: alikuwa
  rationale: Katika muktadha huu kitenzi ni kishirikishi cha wakati uliopita kinachoeleza kwamba Yahwe alikuwa pamoja na Yoshua.
- source_word: אֶת יְהוֹשֻׁעַ
  choice: pamoja na Yoshua
  rationale: Muundo wa Kiebrania una maana ya uwepo na ushirika; “Yoshua” ndiyo namna ya kawaida ya jina hili katika Kiswahili.
- source_word: שָׁמְעוֹ
  choice: umaarufu wake
  rationale: Nomino hii inaweza kumaanisha habari, taarifa, au sifa. Baada ya ushindi wa Yeriko, “umaarufu wake” linaeleza kwa kawaida jinsi Yoshua alivyopata kujulikana, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: בְּכָל הָאָרֶץ
  choice: katika nchi yote
  rationale: Hapa הָאָרֶץ inaelekea kurejelea nchi inayozungumziwa katika simulizi, si dunia nzima.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: “Yahwe” huhifadhi jina binafsi la Mungu kwa namna inayolingana na ushahidi wa lugha chanzi na sera ya mradi, bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. “Ukaenea” limetumiwa badala ya tafsiri ngumu ya moja kwa moja “ulikuwa katika,” ili kutoa maana ya umaarufu kufika nchi yote bila kuondoa tanbihi inayohifadhi upana wa neno la Kiebrania.
