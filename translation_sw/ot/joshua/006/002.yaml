base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/002.yaml
  text: And Yahweh said to Joshua[a], “See, I have given Jericho into your hand, along with its king and the mighty men of valor.”
translation:
  language: sw
  text: Yahwe akamwambia Yoshua, “Tazama, nimeiweka Yeriko mikononi mwako, pamoja na mfalme wake na mashujaa hodari.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wapiganaji wenye nguvu” au “wapiganaji mashujaa.” Maneno ya Kiebrania yanaunganisha mawazo ya nguvu na ushujaa wa kivita.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina binafsi la Mungu, YHWH, kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo huu wa masimulizi unaendeleza tukio kwa Kiswahili cha kawaida huku kiambishi cha yambwa kikionyesha kuwa Yoshua ndiye anayeambiwa.
- source_word: רְאֵה
  choice: Tazama
  rationale: Ni amri inayovuta usikivu na inafaa kwa lugha ya heshima bila kuwa ya kizamani kupita kiasi.
- source_word: נָתַתִּי
  choice: nimeutia
  rationale: Wakati timilifu wa Kiswahili unahifadhi mtazamo wa tendo lililokamilika au ushindi uliothibitishwa na msemaji. Kitenzi 'kutia' pia kinaendana na nahau inayofuata ya kuwa mkononi mwa mtu.
- source_word: בְיָדְךָ
  choice: mkononi mwako
  rationale: Linahifadhi nahau ya Kiebrania ya kukabidhi kitu chini ya mamlaka ya mtu, nayo inaeleweka katika Kiswahili.
- source_word: יְרִיחוֹ
  choice: Yeriko
  rationale: Hili ndilo umbo la kawaida la jina la mji huu katika Biblia za Kiswahili.
- source_word: מַלְכָּהּ
  choice: mfalme wake
  rationale: Kiambishi kinamrejelea Yeriko; Kiswahili hutumia 'wake' kwa urejeo huu kwa njia ya kawaida.
- source_word: גִּבּוֹרֵי הֶחָיִל
  choice: mashujaa hodari
  rationale: Maneno haya yanawasilisha kwa pamoja nguvu, ujasiri, na uwezo wa kivita bila kutumia tafsiri nzito au isiyo ya kawaida.
theological_decisions:
- issue: Nguvu ya wakati timilifu katika נָתַתִּי kabla ya vita
  choice: nimeutia
  alternative: nitautia au ninautia
  rationale: Tafsiri hii inadumisha tangazo la Mungu kana kwamba tendo limekwisha hakikishwa, huku ikiacha mvutano wa kisimulizi kwamba mapigano bado hayajatokea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi ni wa kawaida, huku nahau 'mkononi mwako' ikihifadhi ladha ya Kiebrania bila kuzuia uelewekaji. Alama ya tanbihi imewekwa baada ya kirai kinachofafanuliwa.
