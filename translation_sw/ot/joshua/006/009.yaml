  text: וְ/הֶ/חָל֣וּץ הֹלֵ֔ךְ לִ/פְנֵי֙ הַ/כֹּ֣הֲנִ֔ים תקעו הַ/שּֽׁוֹפָר֑וֹת וְ/הַֽ/מְאַסֵּ֗ף הֹלֵךְ֙ אַחֲרֵ֣י הָ/אָר֔וֹן הָל֖וֹךְ וְ/תָק֥וֹעַ בַּ/שּׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/009.yaml
  text: And the armed men were going before the priests who were blowing the trumpets[a], and the rear guard was going behind the ark, while they kept blowing the trumpets.
translation:
  language: sw
  text: Nao watu wenye silaha walikuwa wakitembea mbele ya makuhani waliokuwa wakipiga pembe[a], na walinzi wa nyuma walikuwa wakitembea nyuma ya Sanduku, huku pembe zikiendelea kupigwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania shofarot; mara nyingi hutafsiriwa “pembe za kondoo dume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָלוּץ
  choice: watu wenye silaha
  rationale: Neno hili hapa linamaanisha kikosi kilichojihami kilichotangulia katika mpangilio wa msafara; tafsiri hii ni wazi na ya kawaida kuliko istilahi ya kijeshi isiyozoeleka.
- source_word: הֹלֵךְ
  choice: walikuwa wakitembea
  rationale: Kivumishi-tendo cha Kiebrania kinaonyesha mwendo uliokuwa ukiendelea katika msafara.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Hutoa uhusiano wa mahali katika mpangilio wa msafara kwa njia ya kawaida ya Kiswahili.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa wahudumu hawa wa ibada.
- source_word: תקעו הַשּׁוֹפָרוֹת
  choice: waliokuwa wakipiga pembe
  rationale: Kishazi kinawaeleza makuhani na kitendo chao kinachoendelea; 'piga pembe' ni usemi wa kawaida, huku 'pembe' ikihifadhi aina ya chombo kuliko 'tarumbeta' ya jumla.
- source_word: הַמְאַסֵּף
  choice: walinzi wa nyuma
  rationale: Neno linaonyesha kikosi kilichofuata nyuma ya msafara na kutekeleza jukumu la ulinzi.
- source_word: אַחֲרֵי
  choice: nyuma ya
  rationale: Maana yake hapa ni ya mahali, si ya wakati.
- source_word: הָאָרוֹן
  choice: Sanduku
  rationale: Muktadha unatambulisha Sanduku tayari; hakuna haja ya kuongeza 'la Agano,' ambalo halipo katika mstari huu.
- source_word: הָלוֹךְ וְתָקוֹעַ בַּשּׁוֹפָרוֹת
  choice: huku pembe zikiendelea kupigwa
  rationale: Muundo huu unaonyesha kitendo kinachoendelea wakati wa mwendo. Kauli isiyotaja mtendaji huepuka kudai bila shaka kwamba walinzi wa nyuma ndio waliopiga pembe, huku muktadha wa karibu ukiwa umetaja makuhani kama wapigaji.
theological_decisions:
- issue: Mtendaji wa kitendo cha mwisho cha kupiga pembe
  choice: huku pembe zikiendelea kupigwa
  alternative: huku wao wakiendelea kupiga pembe
  rationale: Kiebrania cha mwisho hakimtaji mtendaji wazi. Tafsiri isiyotaja mtendaji inalinda uwezekano kwamba makuhani waliendelea kupiga pembe, badala ya kuhusisha kitendo hicho moja kwa moja na walinzi wa nyuma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inahifadhi mwendo unaoendelea wa msafara na mpangilio wake. 'Sanduku' limeandikwa kwa herufi kubwa kwa kuwa linarejelea Sanduku maalumu linalojulikana katika muktadha.
source_grounding:
  english_pob_role: consult_only
