id: JOS.6.8
reference: Joshua 6:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֗י כֶּ/אֱמֹ֣ר יְהוֹשֻׁעַ֮ אֶל הָ/עָם֒ וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֤וֹת הַ/יּֽוֹבְלִים֙ לִ/פְנֵ֣י יְהוָ֔ה עָבְר֕וּ וְ/תָקְע֖וּ בַּ/שּֽׁוֹפָר֑וֹת וַֽ/אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה הֹלֵ֖ךְ אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/008.yaml
  text: And it happened[a], when Joshua spoke to the people, that the seven priests carrying the seven ram's-horn trumpets before Yahweh passed on and blew the trumpets[b], and the ark of the covenant of Yahweh went behind them.
translation:
  language: sw
  text: Ikawa Yoshua aliposema kwa watu, makuhani wale saba waliobeba baragumu saba za pembe za kondoo-dume[a] wakapita mbele ya Yahweh[b] huku wakizipiga baragumu hizo; nalo sanduku la agano la Yahweh likafuata nyuma yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “baragumu saba za yobel.” Huenda hii inamaanisha baragumu za pembe za kondoo-dume, ingawa “baragumu za yubile” pia ni tafsiri inayowezekana lakini isiyoelekea sana katika muktadha huu.'
    reason: lexical_alternative
  - marker: b
    text: Au, “katika uwepo wa Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni kiashiria cha kawaida cha mfululizo wa simulizi katika Kiebrania; “Ikawa” huhifadhi mpito huo kwa lugha fupi na yenye hadhi.
- source_word: כֶּאֱמֹר יְהוֹשֻׁעַ אֶל הָעָם
  choice: Yoshua aliposema na watu
  rationale: Muundo wa כ pamoja na kitenzi-jina una maana ya wakati, “aliposema.” “Watu” humaanisha kusanyiko la Waisraeli, si lazima wanajeshi pekee.
- source_word: שִׁבְעָה הַכֹּהֲנִים נֹשְׂאִים
  choice: makuhani wale saba waliobeba
  rationale: Kishiriki נֹשְׂאִים kinawaeleza makuhani kuwa ndio waliokuwa wamebeba vyombo hivyo; “wale saba” huonyesha urejeo maalumu wa muktadha.
- source_word: שִׁבְעָה שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: baragumu saba za pembe za kondoo-dume
  rationale: שׁוֹפָר ni pembe inayopigwa kama baragumu, na יוֹבֵל hapa yaelekea kumaanisha kondoo-dume au pembe yake. Tafsiri hii inaonyesha aina na matumizi ya chombo.
- source_word: לִפְנֵי יְהוָה
  choice: mbele ya Yahweh
  rationale: לִפְנֵי huonyesha nafasi ya kuwa mbele ya mtu au katika uwepo wake; “mbele ya” huhifadhi picha ya maandamano bila kuondoa uwezekano wa maana ya uwepo.
- source_word: עָבְרוּ וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: wakapita ... huku wakizipiga baragumu hizo
  rationale: עָבְרוּ inaeleza kusonga mbele katika maandamano, na תקע pamoja na שופר ni kupiga baragumu. “Huku” huunganisha matendo hayo kwa Kiswahili cha kawaida bila kudai kwamba yalitokea kwa nyakati zilizotengana.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: sanduku la agano la Yahweh
  rationale: Huhifadhi kwa uwazi mnyororo wa nomino wa Kiebrania na maana yake ya agano.
- source_word: הֹלֵךְ אַחֲרֵיהֶם
  choice: likafuata nyuma yao
  rationale: Kishiriki הֹלֵךְ kinaonyesha mwendo unaoendelea, na אַחֲרֵיהֶם huonyesha nafasi nyuma yao. “Likafuata nyuma yao” ni ya asili na huhifadhi picha ya mahali.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi la agano יְהוָה. “Yahweh” hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Maana ya לִפְנֵי katika maandamano
  choice: mbele ya Yahweh
  alternative: katika uwepo wa Yahweh
  rationale: “Mbele ya” huhifadhi maana ya msingi ya mahali katika mpangilio wa maandamano, huku tanbihi ikitambua maana halali ya uwepo wa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Baragumu” ni neno linaloeleweka katika muktadha wa kibiblia, na “kondoo-dume” huweka wazi aina ya pembe. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyofafanuliwa.
