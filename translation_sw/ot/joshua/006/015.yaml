  yaml_path: translation/ot/joshua/006/015.yaml
  text: And it happened on the seventh day that they rose early, at the going up of the dawn, and marched around the city in this manner seven times. Only on that day did they march around the city seven times.
translation:
  language: sw
  text: Ikawa, siku ya saba wakaamka mapema, mapambazuko yalipoanza, wakauzunguka mji kwa namna hiyo mara saba. Siku hiyo tu waliuzunguka mji mara saba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Inahifadhi mtindo wa simulizi wa Kiebrania kwa Kiswahili cha kibiblia kinachoeleweka.
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: kulipopambazuka
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha wakati ambapo mapambazuko yalikuwa yanaanza.
- source_word: וַיָּסֹבּוּ אֶת־הָעִיר
  choice: wakauzunguka mji
  rationale: Kitenzi סבב hapa humaanisha kwenda kuzunguka mji; tafsiri hii haiongezi dhana mahususi ya mwendo wa kijeshi isiyoelezwa wazi na kitenzi chenyewe.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: kwa utaratibu ule
  rationale: Katika muktadha huu מִשְׁפָּט humaanisha namna au utaratibu uliowekwa, si hukumu ya kisheria.
- source_word: רַק בַּיּוֹם הַהוּא
  choice: Ni siku hiyo tu
  rationale: Inahifadhi mkazo wa רַק kwamba tendo la kuuzunguka mji mara saba lilikuwa la pekee kwa siku hiyo.
