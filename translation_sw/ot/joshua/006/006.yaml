base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/006.yaml
  text: So Joshua son of Nun called the priests and said to them[a], “Carry the ark of the covenant[b], and let seven priests carry seven ram’s-horn trumpets before the ark of Yahweh.”
translation:
  language: sw
  text: Basi Yoshua mwana wa Nuni akawaita makuhani, akawaambia, “Libebeni sanduku la agano, na makuhani saba wabebe tarumbeta saba za pembe za kondoo dume[a] mbele ya sanduku la Yahwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaweza kutafsiriwa pia, “baragumu saba za pembe za kondoo dume.” Neno linaloeleza pembe hizi linahusiana pia na neno “yubile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: akawaita
  rationale: Kitenzi קרא hapa kinaonyesha kwamba Yoshua aliwaita makuhani ili aseme nao; “akawaita” ni sahihi, ya kawaida, na hakiongezi wazo lenye nguvu zaidi la kuwaita rasmi.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yoshua mwana wa Nuni
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili, na uhusiano wa mwana na baba umeonyeshwa moja kwa moja.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa כֹּהֵן katika muktadha wa ibada.
- source_word: שְׂאוּ
  choice: Libebeni
  rationale: Amri ya נשׂא inahusu kulichukua na kulisafirisha sanduku; “libebeni” huwasilisha tendo hilo wazi na kwa kawaida.
- source_word: אֲרוֹן הַבְּרִית
  choice: sanduku la agano
  rationale: Tafsiri hii inafuata muundo wa Kiebrania na ni istilahi inayoeleweka kwa wasomaji wa Kiswahili.
- source_word: וְשִׁבְעָה כֹהֲנִים יִשְׂאוּ
  choice: na makuhani saba wabebe
  rationale: Kitenzi kisicho timilifu baada ya amri kina nguvu ya agizo; hali tegemezi “wabebe” huiwasilisha kwa Kiswahili cha kawaida.
- source_word: שִׁבְעָה שׁוֹפְרוֹת יוֹבְלִים
  choice: tarumbeta saba za pembe za kondoo dume
  rationale: שׁוֹפָר ni tarumbeta ya pembe, na יוֹבְלִים hapa inaeleweka kuwa pembe za kondoo dume. Tafsiri hii inaeleza chombo hicho wazi bila kukichanganya na tarumbeta ya chuma.
- source_word: לִפְנֵי
  choice: mbele ya
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya mahali katika msafara.
- source_word: אֲרוֹן יְהוָה
  choice: sanduku la Yahwe
  rationale: Muundo huu unalihusianisha sanduku moja kwa moja na jina la Mungu יהוה; “Yahwe” linahifadhi jina hilo badala ya kulibadili kuwa cheo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la agano יהוה moja kwa moja. “Yahwe” hulihifadhi kama jina, huku “BWANA” ikiwa tafsiri ya kimapokeo inayolibadili kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. “Tarumbeta” limetumiwa katika maandishi, na “baragumu” limehifadhiwa tanbihini kama neno mbadala linalojulikana katika lugha ya Biblia.
