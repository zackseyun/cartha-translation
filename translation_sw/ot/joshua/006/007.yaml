lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Nao wakawaambia
  rationale: Kitenzi cha mfululizo wa masimulizi kinaendeleza tendo linalofuata, huku wingi wa mtenda ukihifadhiwa.
- source_word: אֶל־הָעָם
  choice: watu
  rationale: עָם kwa kawaida humaanisha watu; muktadha ni wa kijeshi, lakini tafsiri haifinyangi maana kuwa jeshi pekee.
- source_word: עִבְרוּ
  choice: Piteni
  rationale: Amri hii inawaagiza wasonge mbele katika msafara, si lazima wavuke mpaka au mto.
- source_word: וְסֹבּוּ אֶת־הָעִיר
  choice: mkauzunguke mji
  rationale: Hueleza mwendo wa kuuzunguka mji kwa Kiswahili cha kawaida bila kuongeza wazo la mashambulizi.
- source_word: וְהֶחָלוּץ
  choice: kikosi chenye silaha
  rationale: חָלוּץ humaanisha watu waliojiandaa au waliojihami kwa vita; nomino ya mkusanyiko 'kikosi' pia inapatana na kitenzi cha Kiebrania kilicho katika umoja.
- source_word: יַעֲבֹר
  choice: kipite
  rationale: Kauli ya kutaka au kuamuru imewasilishwa kwa kiambishi cha hali tegemezi, kinachofaa katika agizo hili.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: mbele ya sanduku la Yahwe
  rationale: לִפְנֵי huonyesha nafasi ya kutangulia; אֲרוֹן hapa ni sanduku takatifu linalotajwa katika muktadha.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa moja kwa moja kwa umbo la Kiswahili badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Andiko linatumia jina binafsi la Mungu; 'Yahwe' hulihifadhi kama jina na ni tahajia inayosomeka kwa kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Muundo wa amri umewekwa wa moja kwa moja, na maana ya kijeshi ya חָלוּץ imeelezwa bila kuifanya kuwa maalumu kuliko Kiebrania.
