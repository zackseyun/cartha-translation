  text: And they said to the people[a], “Pass on and go around the city, and let the armed men pass before the ark of Yahweh.”
translation:
  language: sw
  text: Nao wakawaambia watu, “Piteni na mzunguke mji; na kikosi chenye silaha[a] kipite mbele ya sanduku la Yahwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kikosi cha mbele,” yaani, watu wenye silaha wanaokwenda mbele ya sanduku.
