  text: וְ/רַק אַתֶּם֙ שִׁמְר֣וּ מִן הַ/חֵ֔רֶם פֶּֽן תַּחֲרִ֖ימוּ וּ/לְקַחְתֶּ֣ם מִן הַ/חֵ֑רֶם וְ/שַׂמְתֶּ֞ם אֶת מַחֲנֵ֤ה יִשְׂרָאֵל֙ לְ/חֵ֔רֶם וַ/עֲכַרְתֶּ֖ם אוֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/018.yaml
  text: But as for you[a], keep yourselves from what is devoted to destruction, lest you yourselves become devoted to destruction and take some of what is devoted to destruction, and make the camp of Israel devoted to destruction[c][b], and bring trouble on it.
translation:
  language: sw
  text: Lakini ninyi, jihadharini na kile kilichowekwa wakfu kwa maangamizi[a], msije mkajiweka ninyi wenyewe chini ya maangamizi[b] kwa kuchukua chochote katika kile kilichowekwa wakfu kwa maangamizi, mkaifanya kambi ya Israeli iwe ya kuangamizwa, na mkailetea taabu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania חֵרֶם (kherem), kwa mapokeo “marufuku” au “kitu kilicholaaniwa”; hapa ni watu au vitu vilivyotengwa kwa Mungu kabisa ili viangamizwe.
    reason: lexical_alternative
  - marker: b
    text: Au, “msije mkajiweka chini ya marufuku ya kuangamizwa.”
    reason: alternative_reading
  - marker: c
    text: Usemi “kuiletea taabu” unaakisi mada inayoonekana baadaye katika dhambi ya Akani na matokeo yake kwa Israeli (Yoshua 7:1, 25).
    reason: cross_reference
lexical_decisions:
- source_word: וְרַק אַתֶּם
  choice: Lakini ninyi
  rationale: Kiunganishi pamoja na רַק kinaanzisha onyo lenye mkazo na tofauti; kiwakilishi huru אַתֶּם kinasisitiza watu wanaoambiwa.
- source_word: שִׁמְרוּ מִן
  choice: jilindeni na
  rationale: Muundo huu una maana ya kujilinda au kujiepusha na jambo fulani, na kauli ya kujirejelea inafaa katika Kiswahili cha kawaida.
- source_word: הַחֵרֶם
  choice: kile kilichowekwa wakfu kwa kuangamizwa
  rationale: חֵרֶם ni kitu au watu waliotengwa kwa Mungu bila uwezekano wa kurejeshwa, hapa kwa kuangamizwa. Usemi huu unaeleza maana kuliko kutumia istilahi isiyoeleweka ya ‘marufuku’ au ‘kitu kilicholaaniwa’.
- source_word: פֶּן תַּחֲרִימוּ וּלְקַחְתֶּם מִן־הַחֵרֶם
  choice: msije kwa kuchukua chochote ... mkajitia ninyi wenyewe chini ya maangamizi
  rationale: Kiswahili hiki kinaonyesha onyo kwamba kuchukua katika kilichowekwa wakfu kungewafanya wao wenyewe waingie katika hali ileile ya hukumu, huku kikihifadhi mkazo wa kiwakilishi.
- source_word: וְשַׂמְתֶּם אֶת־מַחֲנֵה יִשְׂרָאֵל לְחֵרֶם
  choice: mkaifanya kambi ya Israeli iwe chini ya maangamizi
  rationale: ‘Mkaifanya’ huwasilisha matokeo ya kisababishi, na ‘kambi ya Israeli’ huhifadhi muundo na mazingira ya jumuiya nzima.
- source_word: וַעֲכַרְתֶּם אֹתוֹ
  choice: na kuiletea taabu
  rationale: עכר humaanisha kuleta taabu au maafa; kiwakilishi ‘i’ kinarejelea kambi ya Israeli.
theological_decisions:
- issue: Maana ya חֵרֶם katika mazingira ya hukumu na vita vitakatifu
  choice: kilichowekwa wakfu kwa kuangamizwa
  alternative: kitu kilichopigwa marufuku; kitu kilicholaaniwa; kilichowekwa wakfu
  rationale: Neno hilo linaonyesha kutengwa kwa Mungu kusikoweza kubatilishwa, na katika muktadha huu kunatekelezwa kwa kuangamizwa. Tafsiri hii hudumisha uzito wa hukumu bila kuingiza istilahi za kimadhehebu.
- issue: Jinsi ya kuelewa תַּחֲרִימוּ kama hali ya hukumu inayowapata wenye kuchukua
  choice: mkajitia ninyi wenyewe chini ya maangamizi
  alternative: ninyi wenyewe mkawekwa wakfu kwa kuangamizwa; mkajiweka chini ya marufuku
  rationale: Muktadha unaonya kwamba kwa kuchukua kilichowekwa wakfu, Waisraeli wenyewe wangeingia katika hukumu ileile. Usemi huu unaonyesha matokeo hayo bila kudai kwamba walijitolea wenyewe kwa hiari kama sadaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Kurudiwa kwa usemi unaohusu kuangamizwa kunahifadhi uhusiano wa matumizi matatu ya mzizi ח־ר־ם, huku ‘wakfu’ ikifafanuliwa na ‘kwa kuangamizwa’ ili isieleweke kama wakfu wa kawaida wa ibada.
