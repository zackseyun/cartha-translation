  text: Joshua rose early in the morning[a], and the priests carried the ark of Yahweh.
translation:
  language: sw
  text: Yoshua akaamka asubuhi na mapema, nao makuhani wakalibeba sanduku la Yahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: akaamka ... na mapema
  rationale: Hifili ya שׁכם huonyesha kuamka au kuanza mapema; Kiswahili cha kawaida ‘akaamka asubuhi na mapema’ huhifadhi msisitizo huo wa wakati.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Jina la mtu limetoholewa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: בַּבֹּקֶר
  choice: asubuhi
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya kirai cha wakati ‘asubuhi’; pamoja na ‘na mapema’ inaleta maana kamili ya Kiebrania.
- source_word: וַיִּשְׂאוּ
  choice: wakalibeba
  rationale: Katika muktadha wa kulisafirisha sanduku, נשא ina maana ya kubeba; kiambishi ‘-li-’ kinarejelea sanduku kwa Kiswahili sanifu.
- source_word: הַכֹּהֲנִים
  choice: makuhani
  rationale: Tafsiri ya moja kwa moja ya nomino ya wingi yenye uainisho; Kiswahili hakihitaji kibainishi tofauti hapa.
- source_word: אֲרוֹן יְהוָה
  choice: sanduku la Yahwe
  rationale: Muundo wa Kiebrania unaonyesha sanduku linalohusishwa na Yahwe; ‘sanduku la Yahwe’ ni muundo wa asili wa Kiswahili.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo ‘BWANA’; tahajia ‘Yahwe’ inafaa matamshi na uandishi wa Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yanatumia jina binafsi יְהוָה. ‘Yahwe’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku likitolewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi wenye ‘aka-’ na ‘waka-’ unaendeleza simulizi kwa ufasaha. Hakuna tanbihi iliyoongezwa kwa kuwa hakuna usomaji mbadala unaohitajika katika aya hii.
