source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/פַּ֣עַם הַ/שְּׁבִיעִ֔ית תָּקְע֥וּ הַ/כֹּהֲנִ֖ים בַּ/שּׁוֹפָר֑וֹת וַ/יֹּ֨אמֶר יְהוֹשֻׁ֤עַ אֶל הָ/עָם֙ הָרִ֔יעוּ כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/016.yaml
  text: And it happened at the seventh time[a], when the priests blew the trumpets, that Joshua said to the people, “Shout, for Yahweh has given you the city.”
translation:
  language: sw
  text: Ikawa mara ya saba, makuhani walipopiga baragumu[a], Yoshua akawaambia watu, “Pigeni kelele, kwa maana Yahwe amewapa mji.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: shofarot, yaani pembe zilizotumiwa kama baragumu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni mwanzo wa kawaida wa simulizi unaoendeleza mfuatano wa matukio; “Ikawa” huhifadhi ladha ya Kiebrania bila kuwa nzito.
- source_word: בַּפַּעַם הַשְּׁבִיעִית
  choice: mara ya saba
  rationale: פַּעַם hapa humaanisha tukio au zamu ya saba katika tendo lililorudiwa.
- source_word: תָּקְעוּ
  choice: walipopiga
  rationale: Kitenzi תקע pamoja na שופר humaanisha kupiga au kuvuvia chombo hicho; Kiswahili kwa kawaida husema “kupiga baragumu.” Muundo wa “walipo-” unaonyesha wakati Yoshua aliposema.
- source_word: שׁוֹפָרוֹת
  choice: baragumu
  rationale: שופר ni chombo cha kupulizwa, kwa kawaida kilichotengenezwa kwa pembe. “Baragumu” ni neno la kawaida na lenye hadhi katika Kiswahili cha Biblia; tanbihi huhifadhi maana mahususi ya pembe.
- source_word: וַיֹּאמֶר
  choice: akawaambia
  rationale: אמר ni “kusema”; kiambishi cha watendewa “-wa-” kinaeleza kwa kawaida kwamba Yoshua aliwaambia watu.
- source_word: הָרִיעוּ
  choice: Pigeni kelele
  rationale: Amri hii inataka watu watoe sauti kubwa ya pamoja. Tafsiri hii ni ya kawaida na haiongezi kwa lazima wazo mahususi la kilio cha vita.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha sababu ya amri iliyotangulia.
- source_word: נָתַן
  choice: amewapa
  rationale: Kauli timilifu huonyesha tendo la Mungu kuwa limetimizwa au kuwa hakika kwa mtazamo wa msemaji; wakati timilifu wa Kiswahili huhifadhi nguvu hiyo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu la herufi nne limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo.
- source_word: הָעִיר
  choice: mji
  rationale: Nomino yenye uainisho inarejelea mji unaojulikana katika muktadha, yaani Yeriko; Kiswahili hakihitaji kibainishi tofauti hapa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Matini ina jina la agano lenyewe, si cheo. “Yahwe” hulihifadhi kama jina binafsi kwa tahajia inayoeleweka katika Kiswahili.
- issue: Nguvu ya נָתַן kuhusu kutolewa kwa mji kabla ya ushindi kuonekana
  choice: amewapa
  alternative: atawapa; amekabidhi
  rationale: Kauli timilifu ya Kiebrania inaonyesha utoaji huo kuwa tendo lililokamilika au matokeo yaliyo hakika kwa sababu ya ahadi ya Mungu. “Amewapa” huhifadhi mvutano huo bila kuubadili kuwa wakati ujao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inahifadhi mwendo wa simulizi la Kiebrania huku ikitumia miundo ya kawaida ya Kiswahili. Alama ya tanbihi imewekwa baada ya “baragumu,” neno linalohusika moja kwa moja.
