  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/הָיְתָ֨ה הָ/עִ֥יר חֵ֛רֶם הִ֥יא וְ/כָל אֲשֶׁר בָּ֖/הּ לַֽ/יהוָ֑ה רַק֩ רָחָ֨ב הַ/זּוֹנָ֜ה תִּֽחְיֶ֗ה הִ֚יא וְ/כָל אֲשֶׁ֣ר אִתָּ֣/הּ בַּ/בַּ֔יִת כִּ֣י הֶחְבְּאַ֔תָה אֶת הַ/מַּלְאָכִ֖ים אֲשֶׁ֥ר שָׁלָֽחְנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/017.yaml
  text: And the city and all that is in it shall be devoted to destruction for Yahweh[a]. Only Rahab the prostitute shall live, she and all who are with her in the house[b], because she hid the messengers whom we sent.
translation:
  language: sw
  text: Mji huo na vyote vilivyomo ndani yake vitawekwa wakfu kwa Yahwe kwa maangamizi[a]. Ni Rahabu, yule kahaba, pekee atakayeishi, yeye na wote walio pamoja naye ndani ya nyumba, kwa sababu aliwaficha wajumbe[b] tuliowatuma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitawekwa chini ya marufuku ya kuangamizwa.” Neno la Kiebrania humaanisha kitu kilichowekwa wakfu kwa Yahwe bila uwezekano wa kurudishwa; hapa, kupitia kuangamizwa.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania, “wajumbe.” Kwa muktadha, hawa ni wale wanaume ambao Yoshua aliwatuma kuipeleleza nchi.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵרֶם
  choice: vitatengwa kwa ajili ya kuangamizwa
  rationale: Neno hili katika muktadha wa ushindi humaanisha kutolewa kabisa kwa Mungu kupitia kuangamizwa. Tafsiri hii inadumisha pamoja wazo la kuwekwa wakfu na la kuharibiwa.
- source_word: לַיהוָה
  choice: mbele za Yahwe
  rationale: Kihusishi kinaonyesha kwamba mji umetolewa kwa Yahwe. Katika muundo huu wa Kiswahili, “mbele za Yahwe” huonyesha kuwa tendo hilo linafanywa kwa mamlaka na kwa ajili yake, bila kudokeza kuwa ni sadaka ya kawaida.
- source_word: רַק
  choice: Ni ... peke yake
  rationale: Muundo huu unaonyesha kwa mkazo kwamba Rahabu ndiye pekee anayeondolewa katika hukumu ya mji.
- source_word: הַזּוֹנָה
  choice: kahaba
  rationale: Hili ni neno la kawaida, la sasa, na la moja kwa moja kwa kazi au hali inayotajwa na Kiebrania.
- source_word: תִּחְיֶה
  choice: atakayeishi
  rationale: Huhifadhi maana ya msingi ya kitenzi, ‘kuishi/kubaki hai,’ na kuacha tofauti yake na kuangamizwa ionekane bila kuongeza maelezo.
- source_word: אִתָּהּ בַּבַּיִת
  choice: walio pamoja naye ndani ya nyumba
  rationale: Hurejelea watu waliokusanyika kimwili pamoja na Rahabu ndani ya nyumba, si lazima jamaa zake pekee.
- source_word: הֶחְבְּאַתָה
  choice: aliwaficha
  rationale: Hutoa maana ya moja kwa moja ya kusababisha wasionekane au wasipatikane, bila kuongeza dhana nyingine kama kuwalinda.
- source_word: הַמַּלְאָכִים
  choice: wajumbe
  rationale: Maana ya msingi ni wajumbe. Katika simulizi hili ni wale wanaume waliotumwa na Yoshua; “wapelelezi” ni ufafanuzi unaotokana na muktadha mpana.
- source_word: שָׁלָחְנוּ
  choice: tuliowatuma
  rationale: Wakati uliopita wa Kiswahili unaonyesha wazi tendo la awali la kuwatuma.
- source_word: וְהָיְתָה הָעִיר ... הִיא וְכָל אֲשֶׁר בָּהּ
  choice: Nao mji huo pamoja na vyote vilivyomo ndani yake vitatengwa
  rationale: Muundo huu ni wa asili katika Kiswahili na bado unaweka mji na vyote vilivyomo ndani yake chini ya tamko moja lenye mkazo.
theological_decisions:
- issue: Tafsiri ya neno la ushindi חֵרֶם
  choice: kutengwa kwa ajili ya kuangamizwa
  alternative: kuwekwa chini ya marufuku; kulaaniwa
  rationale: Hii haipunguzi ukali wa hukumu wala kuifanya ionekane kuwa laana tu. Inahifadhi wazo kwamba mji umetolewa kwa Yahwe katika hukumu kupitia kuangamizwa.
- issue: Uhusiano wa חֵרֶם na Yahwe katika לַיהוָה
  choice: mbele za Yahwe
  alternative: kwa ajili ya Yahwe; kwa Yahwe
  rationale: Chaguo hili linaepuka taswira isiyo ya kawaida kwamba uharibifu ni zawadi ya matumizi, huku likidumisha kwamba kutengwa na kuangamizwa huko kunamhusu Yahwe na hufanywa chini ya mamlaka yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kahaba” ni wazi bila kuwa cha kizamani. Muundo “Ni Rahabu ... peke yake” unadumisha mkazo wa החריג. Jina “Yahwe” linafuata safu ya Kiingereza iliyotolewa na kuonyesha jina binafsi יהוה.
