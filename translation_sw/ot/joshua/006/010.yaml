base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/010.yaml
  text: And Joshua commanded the people[a], saying, “Do not shout, and do not let your voice be heard, and do not let a word go out from your mouth until the day I say to you[b], ‘Shout!’ Then you shall shout.”
translation:
  language: sw
  text: Yoshua akawaamuru watu, akisema, “Msipige kelele[a], wala msifanye sauti yenu isikike, wala neno lolote lisitoke vinywani mwenu[b], mpaka siku nitakapowaambia, ‘Pigeni kelele!’ Ndipo mtakapopiga kelele.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana mahsusi zaidi katika muktadha huu, “Msitoe mwito wa vita” au “Msipige ukelele wa vita.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wala neno lisitoke vinywani mwenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוָּה
  choice: akawaamuru
  rationale: Kitenzi hiki kinaonyesha amri yenye mamlaka, si maelekezo ya kawaida tu.
- source_word: הָעָם
  choice: watu
  rationale: Neno la Kiebrania ni neno la kawaida linalomaanisha ‘watu’; halijafafanuliwa kuwa jeshi ingawa muktadha ni wa kijeshi.
- source_word: לֹא תָרִיעוּ
  choice: Msipige kelele
  rationale: Mzizi רוע katika Hiphil humaanisha kutoa sauti kubwa au mwito, mara nyingi wa vita au ushindi. ‘Kupiga kelele’ ni Kiswahili cha kawaida kinachohifadhi upana huo, huku tanbihi ikionyesha maana mahsusi ya kimuktadha.
- source_word: וְלֹא תַשְׁמִיעוּ אֶת קוֹלְכֶם
  choice: wala msifanye sauti zenu zisikike
  rationale: Hiphil ya שׁמע ina maana sababishi, ‘kusababisha isikike.’ Tafsiri hii inahifadhi muundo na mkazo wa chanzo.
- source_word: וְלֹא יֵצֵא מִפִּיכֶם דָּבָר
  choice: wala neno lolote lisitoke vinywani mwenu
  rationale: Inahifadhi taswira ya Kiebrania ya neno ‘kutoka’ kinywani, kwa Kiswahili kinachoeleweka. ‘Lolote’ huwasilisha vizuri katazo la kutamka hata neno moja.
- source_word: עַד יוֹם
  choice: mpaka siku
  rationale: Huhifadhi usemi halisi wa wakati katika Kiebrania badala ya kuufanya kuwa ‘mpaka wakati.’
- source_word: אָמְרִי אֲלֵיכֶם
  choice: nitakapowaambia
  rationale: Muundo wa Kiebrania una kazi ya wakati; Kiswahili hiki ni cha kawaida na kinaonyesha kwamba Yoshua atawaambia watu wote.
- source_word: הָרִיעוּ
  choice: Pigeni kelele!
  rationale: Amri hii inarudia mzizi uleule wa katazo la awali, kwa hiyo kauli ileile imerudiwa katika Kiswahili.
- source_word: וַהֲרִיעֹתֶם
  choice: Ndipo mtakapopiga kelele
  rationale: ‘Ndipo’ inaonyesha matokeo na mfuatano baada ya amri, huku ikihifadhi urudiaji wa kitenzi kilekile.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Urudiaji wa ‘piga kelele’ umehifadhiwa ili kuonyesha uhusiano wa maneno ya Kiebrania, na taswira ya neno kutoka kinywani imebakizwa bila kufanya sentensi kuwa ngumu.
