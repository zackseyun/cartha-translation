base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/003.yaml
  text: You shall march around the city[a], all the men of war, circling the city once. Thus you shall do for six days.
translation:
  language: sw
  text: Mtaizunguka mji, wanaume wote wa vita[a], mkiuzunguka mji mara moja. Utafanya hivyo kwa siku sita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wapiganaji wote” au “mashujaa wote.” Kiebrania ni “wanaume wote wa vita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסַבֹּתֶם
  choice: Nanyi mtauzunguka
  rationale: Kitenzi hiki ni cha nafsi ya pili wingi na kinaagiza kuzunguka mji. ‘Mtauzunguka’ ni Kiswahili cha kawaida na huhifadhi tendo la kufanya mzunguko bila kuongeza wazo lisilo lazima la kutembea kijeshi.
- source_word: הָעִיר
  choice: mji
  rationale: Ni tafsiri ya moja kwa moja ya nomino yenye kibainishi; ingawa muktadha unautambulisha kuwa Yeriko, chanzo kinasema tu ‘mji.’
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: wanaume wote wa vita
  rationale: Huhifadhi kwa ukaribu maana halisi ya ‘wanaume wote wa vita’ na uhusiano wake wa kiume na kijeshi.
- source_word: הַקֵּיף אֶת הָעִיר
  choice: mkiuzunguka mji
  rationale: Huhifadhi msisitizo wa kurudia tendo la kuzunguka uliomo katika Kiebrania, kwa muundo unaoeleweka katika Kiswahili.
- source_word: פַּעַם אֶחָת
  choice: mara moja
  rationale: Ni usemi wa kawaida wa Kiswahili kwa tukio moja.
- source_word: כֹּה
  choice: hivyo
  rationale: Hurejelea namna ya kutekeleza agizo lililotangulia kwa lugha ya asili na yenye hadhi.
- source_word: תַעֲשֶׂה
  choice: Utafanya
  rationale: Huhifadhi nafsi ya pili umoja, ikimwelekea Yoshua kama mwenye wajibu wa kusimamia utekelezaji.
- source_word: שֵׁשֶׁת יָמִים
  choice: kwa siku sita
  rationale: Huonyesha muda ambao tendo hilo litarudiwa.
theological_decisions:
- issue: Uwasilishaji wa jinsia katika אַנְשֵׁי הַמִּלְחָמָה
  choice: wanaume wote wa vita
  alternative: wapiganaji wote; mashujaa wote
  rationale: Kiebrania kinataja wanaume kwa uwazi katika muktadha wa kijeshi; tafsiri haibadili rejeo hilo kuwa lisiloonyesha jinsia.
- issue: Mabadiliko ya idadi ya wanaoelekezwa
  choice: wingi katika ‘mtauzunguka,’ kisha umoja katika ‘utafanya’
  alternative: kusawazisha vitenzi vyote viwe vya wingi au vyote viwe vya umoja
  rationale: Chanzo hubadilika kutoka nafsi ya pili wingi kwenda nafsi ya pili umoja, huenda kutoka kwa wanaotekeleza tendo kwenda kwa Yoshua mwenye wajibu; tofauti hiyo imehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umehifadhi marudio ya Kiebrania na mabadiliko ya wingi kwenda umoja. Hakuna tanbihi iliyoongezwa kwa sababu ‘wanaume wote wa vita’ tayari huwasilisha kwa uwazi maana ya chanzo; kwa hiyo hakuna alama ya tanbihi katika matini.
