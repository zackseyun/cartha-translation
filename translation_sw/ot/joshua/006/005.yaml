translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa kwa uakifishaji ili maagizo na matokeo yawe wazi. Maneno ya kijeshi yasiyotajwa wazi katika Kiebrania hayajaongezwa.
