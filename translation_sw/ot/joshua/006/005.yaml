base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/005.yaml
  text: And when the ram's horn is drawn out[a], when you hear the sound of the trumpet, all the people shall raise a great shout, and the wall of the city will fall beneath itself, and the people shall go up[c][b], each man straight before him.
translation:
  language: sw
  text: Pembe ya kondoo dume itakapolia kwa sauti ndefu[a], mtakaposikia sauti ya baragumu, watu wote watapiga ukelele mkubwa. Ndipo ukuta wa mji utaanguka chini palepale ulipo[b], na watu watapanda, kila mtu akielekea moja kwa moja mbele yake.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pembe ya kondoo dume itakapopulizwa kwa muda mrefu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu zaidi, “ukuta wa mji utaanguka chini yake”; yaelekea ikimaanisha kwamba utaporomoka wima mahali ulipo.
    reason: lexical_alternative
  - marker: c
    text: Au, “kila mmoja moja kwa moja mbele yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְשֹׁךְ
  choice: itakapolia kwa sauti ndefu
  rationale: Katika nahau hii kitenzi משׁך kinaonyesha kuendelezwa kwa mlio wa pembe. Kiswahili hiki ni cha kawaida na kinaeleza mlio mrefu bila kudokeza kwamba pembe yenyewe inavutwa.
- source_word: קֶרֶן הַיּוֹבֵל
  choice: pembe ya kondoo dume
  rationale: Hapa יוֹבֵל inahusu kondoo dume au pembe yake inayotumiwa kama ala ya kupuliza, si mwaka wa yubile.
- source_word: ק֣וֹל הַשּׁוֹפָר
  choice: sauti ya baragumu
  rationale: שׁוֹפָר ni pembe inayopulizwa kama baragumu. Neno 'baragumu' ni la kawaida katika Kiswahili cha Biblia, huku 'sauti ya' ikihifadhi קוֹל.
- source_word: יָרִיעוּ ... תְּרוּעָה גְדוֹלָה
  choice: watapiga ukelele mkubwa
  rationale: Muungano huu unaeleza watu wakitoa ukelele mkubwa. 'Kupiga ukelele' ni usemi wa asili wa Kiswahili na hauulazimishi kuwa kilio maalumu cha vita.
- source_word: תַּחְתֶּיהָ
  choice: chini palepale ulipo
  rationale: Usemi wa Kiebrania una picha ya ukuta kuanguka chini yake wenyewe, yaani kuporomoka wima mahali ulipo. Tafsiri hii inaeleweka kwa urahisi, huku tanbihi ikihifadhi umbo la karibu zaidi na Kiebrania.
- source_word: וְעָלוּ
  choice: watapanda
  rationale: עלה kimsingi ni 'kupanda/kwenda juu.' 'Watapanda' huhifadhi maana hiyo bila kuongeza wazo la kushambulia ambalo halijasemwa wazi.
- source_word: אִישׁ נֶגְדּוֹ
  choice: kila mtu akielekea moja kwa moja mbele yake
  rationale: אִישׁ ina nguvu ya kugawa, 'kila mmoja,' na נֶגְדּוֹ inaonyesha kila mtu kwenda moja kwa moja kwenye sehemu iliyo mbele yake. 'Kila mtu' ni Kiswahili cha kawaida na kinafaa kwa kundi linalotajwa.
