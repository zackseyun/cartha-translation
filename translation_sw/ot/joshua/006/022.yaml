  text: וְ/לִ/שְׁנַ֨יִם הָ/אֲנָשִׁ֜ים הַֽ/מְרַגְּלִ֤ים אֶת הָ/אָ֨רֶץ֙ אָמַ֣ר יְהוֹשֻׁ֔עַ בֹּ֖אוּ בֵּית הָ/אִשָּׁ֣ה הַ/זּוֹנָ֑ה וְ/הוֹצִ֨יאוּ מִ/שָּׁ֤ם אֶת הָֽ/אִשָּׁה֙ וְ/אֶת כָּל אֲשֶׁר לָ֔/הּ כַּ/אֲשֶׁ֥ר נִשְׁבַּעְתֶּ֖ם לָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/022.yaml
  text: And to the two men who had spied out the land[a], Joshua said, “Go into the house of the prostitute and bring out from there the woman and all that belongs to her, just as you swore to her.”
translation:
  language: sw
  text: Kisha Yoshua akawaambia wale wanaume wawili waliokuwa wameipeleleza nchi, “Ingieni katika nyumba ya yule mwanamke kahaba[a], mkamtoe humo huyo mwanamke pamoja na kila kilicho chake, kama mlivyomwapia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule kahaba.” Kiebrania hurudia, “mwanamke, kahaba.”
    reason: Hutoa mbadala mfupi unaohusu usemi uliotiwa alama na hufafanua marudio ya Kiebrania kwa usahihi.
lexical_decisions:
- source_word: וְלִשְׁנַיִם הָאֲנָשִׁים
  choice: Kisha Yoshua akawaambia wale wanaume wawili
  rationale: Muundo wa Kiswahili umebadilisha mpangilio wa kishazi ili usemi uwe wa kawaida, huku kiunganishi וְ kikionyesha mwendelezo wa simulizi na לִ kikitambulisha watu walioambiwa.
- source_word: הַמְרַגְּלִים אֶת הָאָרֶץ
  choice: waliokuwa wameipeleleza nchi
  rationale: Kitenzi רגל katika muktadha huu kinamaanisha kufanya upelelezi wa nchi. Umbo hili linaonyesha kuwa kazi hiyo ilikuwa imeshafanyika.
- source_word: בֹּאוּ בֵּית
  choice: Ingieni katika nyumba
  rationale: בוא pamoja na 'nyumba' hapa ni amri ya kuingia ndani; 'Ingieni' ni ya kawaida na sahihi kwa mtazamo wa Kiswahili.
- source_word: הָאִשָּׁה הַזּוֹנָה
  choice: yule mwanamke kahaba
  rationale: Tafsiri hii inahifadhi nomino 'mwanamke' na maelezo yake 'kahaba' kama yalivyorudiwa katika Kiebrania, bila kutumia lugha ya kizamani au kuficha maana ya זוֹנָה.
- source_word: וְהוֹצִיאוּ מִשָּׁם
  choice: mkamtoe humo
  rationale: Hiphil ya יצא inamaanisha kumsababisha mtu atoke, yaani kumtoa; 'humo' linahifadhi wazo la kutoka mahali pale.
- source_word: אֶת הָאִשָּׁה
  choice: huyo mwanamke
  rationale: Kiebrania kinarudia 'mwanamke' badala ya kutumia kiwakilishi pekee; marudio hayo yamehifadhiwa.
- source_word: וְאֶת כָּל אֲשֶׁר לָהּ
  choice: pamoja na kila kilicho chake
  rationale: Usemi huu unabaki mpana, kama Kiebrania, na unaweza kujumuisha watu na vitu vilivyo chini ya ulinzi au milki yake bila kuamua kimya kimya kuwa ni mali tu.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתֶּם לָהּ
  choice: kama mlivyomwapia
  rationale: Kishazi hiki kinaunganisha amri na kiapo ambacho wale wanaume walikuwa wamempa; 'kama mlivyomwapia' ni Kiswahili cha kawaida na kinachofuata maana ya chanzo.
theological_decisions:
- issue: Maana ya זוֹנָה kumhusu Rahabu
  choice: kahaba
  alternative: malaya
  rationale: זוֹנָה humaanisha mwanamke anayefanya ukahaba. 'Kahaba' ni neno la sasa, lenye heshima ya kimtindo, na halifichi maelezo ya maandiko; 'malaya' linaweza kuwa na matumizi mapana na sauti ya dharau zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Mpangilio wa sentensi umefanywa wa kawaida katika Kiswahili, lakini marudio na upana wa maana ya Kiebrania vimehifadhiwa.
