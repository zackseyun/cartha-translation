base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/019.yaml
  text: But all the silver and gold[a], and the vessels of bronze and iron, are holy to Yahweh[b]; they shall go into the treasury of Yahweh.
translation:
  language: sw
  text: Lakini fedha yote, dhahabu yote, na vyombo vyote vya shaba na chuma ni vitakatifu kwa Yahweh; vyote vitaingia katika hazina ya Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kina “ni kitakatifu” na “kitaingia” katika umoja, kikichukulia fedha, dhahabu, na vyombo vilivyoorodheshwa kuwa jumla moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Lakini ... yote
  rationale: Kiunganishi וְ kinaendeleza kauli iliyotangulia huku kikionyesha tofauti na vitu vilivyopaswa kuangamizwa; “Lakini” huleta nguvu hiyo kwa Kiswahili cha kawaida. כֹּל limewakilishwa kwa “yote.”
- source_word: כֶּסֶף וְ/זָהָב
  choice: fedha yote na dhahabu yote
  rationale: Katika orodha hii כֶּסֶף ni metali ya fedha, si pesa kwa ujumla. Kurudia “yote” kunafanya upeo wa כֹּל uwe wazi na wa kawaida kwa Kiswahili.
- source_word: וּ/כְלֵי נְחֹשֶׁת וּ/בַרְזֶל
  choice: pamoja na vyombo vya shaba na chuma
  rationale: כְּלִי ni neno pana kwa vyombo au vifaa; “vyombo” linafaa katika muktadha wa hazina. “Shaba” ni neno la kawaida la Kiswahili linaloweza kutaja metali inayokusudiwa na נְחֹשֶׁת, mara nyingi bronzi katika muktadha huu.
- source_word: קֹדֶשׁ הוּא לַ/יהוָה
  choice: ni vitakatifu kwa Yahwe
  rationale: Kauli hii inaonyesha kuwa vitu hivyo vimetengwa kuwa vya Mungu. Tafsiri ya karibu “vitakatifu kwa Yahwe” inadumisha lugha ya utakatifu bila kuibadili kuwa kauli ya umiliki pekee.
- source_word: אוֹצַר יְהוָה
  choice: hazina ya Yahwe
  rationale: אוֹצָר hapa ni mahali pa kuhifadhi mali yenye thamani iliyowekwa wakfu; “hazina” ni tafsiri fupi na ya kawaida.
- source_word: יָבֽוֹא
  choice: vyote vitaingia
  rationale: Kitenzi cha Kiebrania kiko katika umoja kwa sababu orodha inatazamwa kama jumla moja. Kiswahili cha kawaida hutumia upatanisho wa wingi kwa vitu vilivyoorodheshwa; “vyote” huonyesha wazi rejeleo hilo bila kuongeza kauli tendwa isiyopo katika chanzo.
theological_decisions:
- issue: Namna ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Chanzo kinatumia jina maalumu la agano יהוה. “Yahwe” hulihifadhi kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya קֹדֶשׁ ... לַיהוָה
  choice: vitakatifu kwa Yahwe
  alternative: vimewekwa wakfu kwa Yahwe
  rationale: “Vitakatifu kwa Yahwe” huhifadhi usemi wa chanzo na mvutano wake kati ya utakatifu, kuwekwa wakfu, na kuwa mali ya Mungu; mbadala unaeleza zaidi lakini ni wa kifafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi unadumisha orodha na lugha ya kuwekwa wakfu ya chanzo huku upatanisho wa Kiswahili ukiwa wa asili.
