base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/011.yaml
  text: So the ark of Yahweh went around the city[a], circling it once. Then they came into the camp and spent the night in the camp.
translation:
  language: sw
  text: Basi sanduku la Yahweh likauzunguka mji[a], likiuzunguka mara moja. Kisha wakaingia kambini, wakalala kambini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “sanduku la Yahweh likauzunguka mji, likiuzunguka mara moja.” Maneno hayo yanalifanya sanduku kuwa kiima cha kisarufi, ingawa makuhani ndio waliolibeba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: likauzunguka
  rationale: Kitenzi hiki cha mfuatano wa simulizi kinaeleza mwendo wa kulizunguka jiji. Kiswahili ‘likauzunguka’ kinafuata sanduku kama kiima cha kisarufi, kama ilivyo katika Kiebrania, bila kuongeza wazi kwamba lilibebwa.
- source_word: אֲרוֹן יְהוָה
  choice: sanduku la Yahweh
  rationale: Muundo huu wa umilikaji unatambulisha sanduku takatifu kuwa la Yahweh. ‘Sanduku’ ni neno la kawaida na linaloeleweka katika muktadha wa simulizi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina binafsi la Mungu katika Tetragramatoni limeandikwa ‘Yahweh’ ili kuhifadhi jina lililo katika matini ya Kiebrania.
- source_word: הָעִיר
  choice: mji
  rationale: Nomino hii yenye uainisho inarejelea Yeriko katika muktadha; ‘mji’ huhifadhi namna ya rejeo la Kiebrania bila kurudia jina Yeriko.
- source_word: הַקֵּף
  choice: likiuzunguka
  rationale: Usemi huu unaendeleza na kufafanua tendo la kuzunguka. Muundo wa Kiswahili unaonyesha tendo linaloandamana na kuzunguka kikamilifu bila uliteralisti usio wa kawaida.
- source_word: פַּעַם אֶחָת
  choice: mara moja
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya idadi ya mizunguko.
- source_word: וַיָּבֹאוּ הַמַּחֲנֶה
  choice: wakaingia kambini
  rationale: בוא inaweza kumaanisha kuja au kuingia; kwa kuwa kambi ndiyo mahali walikokwenda, ‘wakaingia kambini’ ni ya kawaida katika Kiswahili na haiongezi wazo la ‘kurudi’ ambalo halisemwi wazi na kitenzi.
- source_word: וַיָּלִינוּ
  choice: wakalala ... usiku
  rationale: Kitenzi לון humaanisha kukaa au kulala mahali wakati wa usiku. ‘Wakalala ... usiku’ ni Kiswahili cha sasa, wazi, na chenye hadhi.
- source_word: בַּמַּחֲנֶה
  choice: kambini
  rationale: Kiambishi ב kinaonyesha mahali. Kurudiwa kwa ‘kambini’ kumehifadhiwa kwa kuwa nomino hiyo imerudiwa pia katika Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini inatumia moja kwa moja Tetragramatoni, jina binafsi la Mungu. ‘Yahweh’ huhifadhi jina hilo bila kulibadilisha kuwa cheo, huku ‘Yehova’ ikiwa namna nyingine ya kimapokeo.
- issue: Sanduku kama kiima cha tendo
  choice: sanduku ... likauzunguka mji
  alternative: makuhani wakalibeba sanduku kulizunguka mji
  rationale: Kiebrania kinalifanya sanduku kuwa kiima cha kisarufi, ingawa katika simulizi makuhani ndio waliolibeba. Tafsiri inahifadhi mtazamo huo wa matini badala ya kuingiza wahusika ambao hawatajwi katika sentensi hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi wenye viambishi vya mfuatano (‘lika-’, ‘waka-’) umetumiwa kwa mtiririko wa kawaida. Kurudiwa kwa ‘kambini’ kunahifadhi msisitizo na uwazi wa matini ya Kiebrania.
