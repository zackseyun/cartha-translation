  text: וְֽ/אֶת רָחָ֣ב הַ֠/זּוֹנָה וְ/אֶת בֵּ֨ית אָבִ֤י/הָ וְ/אֶת כָּל אֲשֶׁר לָ/הּ֙ הֶחֱיָ֣ה יְהוֹשֻׁ֔עַ וַ/תֵּ֨שֶׁב֙ בְּ/קֶ֣רֶב יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֤י הֶחְבִּ֨יאָה֙ אֶת הַ/מַּלְאָכִ֔ים אֲשֶׁר שָׁלַ֥ח יְהוֹשֻׁ֖עַ לְ/רַגֵּ֥ל אֶת יְרִיחֽוֹ־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/025.yaml
  text: But Joshua kept Rahab the prostitute alive[a], along with her father's household and all that belonged to her, and she has lived in the midst of Israel to this day[b], because she hid the messengers whom Joshua sent to spy out Jericho.
translation:
  language: sw
  text: Lakini Yoshua akamhifadhi hai Rahabu yule kahaba[a], pamoja na watu wa nyumba ya baba yake na vyote vilivyokuwa vyake. Naye ameendelea kuishi katikati ya Israeli hadi leo, kwa sababu aliwaficha wale wajumbe[b] ambao Yoshua aliwatuma kuipeleleza Yeriko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “malaya.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “wajumbe”; yaani, watu ambao Yoshua aliwatuma kuipeleleza Yeriko.'
    reason: lexical_clarification
lexical_decisions:
- source_word: הַזּוֹנָה
  choice: kahaba
  rationale: Neno זוֹנָה humaanisha mwanamke anayefanya ukahaba. “Kahaba” ni neno la sasa, wazi na linalofaa katika usimulizi wenye hadhi.
- source_word: בֵּית אָבִיהָ
  choice: watu wa nyumba ya baba yake
  rationale: Kirai hiki kinamaanisha kaya au jamaa iliyo chini ya nyumba ya baba yake, si jengo pekee. Tafsiri hii inadumisha picha ya Kiebrania huku ikieleweka kwa kawaida.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: vyote vilivyokuwa vyake
  rationale: Kirai hiki ni kipana na kinahusu kila kilichokuwa chake bila kukifafanua kupita kiasi.
- source_word: הֶחֱיָה
  choice: akamhifadhi hai
  rationale: Hifili ya חיה ina maana ya kumweka au kumwacha mtu hai. “Akamhifadhi hai” inadumisha maana ya kisababishi na si tafsiri pana tu ya ‘kumsamehe’.
- source_word: וַתֵּשֶׁב ... עַד הַיּוֹם הַזֶּה
  choice: anaishi ... hadi leo
  rationale: Muktadha unaonyesha hali iliyoanza zamani na kuendelea hadi wakati wa msimulizi. Wakati wa sasa katika Kiswahili unaeleza mwendelezo huo kwa asili.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: katikati ya Israeli
  rationale: Hii inafuata nahau ya Kiebrania na kueleza kuishi ndani ya jamii ya Israeli bila kuongeza hitimisho la kitheolojia.
- source_word: הֶחְבִּיאָה
  choice: aliwaficha
  rationale: Hifili ya חבא hapa humaanisha kuwaficha au kuwafunika wasionekane; “aliwaficha” ni ya moja kwa moja na ya kawaida.
- source_word: הַמַּלְאָכִים
  choice: wajumbe
  rationale: מַלְאָכִים kwa kawaida ni ‘wajumbe.’ Kazi yao ya upelelezi inaelezwa na kirai kinachofuata, hivyo hakuna haja ya kubadili neno hili kuwa ‘wapelelezi.’
- source_word: לְרַגֵּל
  choice: kuipeleleza
  rationale: Kitenzi רגל katika muktadha huu kinahusu kufanya upelelezi wa Yeriko. “Kuipeleleza” ni tafsiri ya kawaida na sahihi.
theological_decisions:
- issue: Kuingizwa kwa Rahabu katika maisha ya Israeli
  choice: anaishi katikati ya Israeli hadi leo
  alternative: akaishi miongoni mwa Waisraeli hadi leo
  rationale: Tafsiri iliyochaguliwa inadumisha dai la aya kuhusu kuendelea kwake kuishi ndani ya Israeli, bila kuingiza hitimisho la baadaye la kitheolojia ambalo aya yenyewe halitamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi umewekwa wa kawaida bila kupoteza upana wa misemo ya Kiebrania.
