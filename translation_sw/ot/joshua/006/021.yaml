base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/021.yaml
  text: And they devoted to destruction everything that was in the city[a], from man to woman, from young to old, and even ox and sheep and donkey, by the edge of the sword.
translation:
  language: sw
  text: Nao wakaangamiza kabisa kila kitu kilichokuwa mjini[a]—mwanamume na mwanamke, kijana na mzee, hata ng’ombe, kondoo na punda—kwa makali ya upanga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakaviweka wakfu kwa maangamizi,” au, “wakavitia chini ya marufuku.” Kitenzi cha Kiebrania hurejelea kuweka watu au vitu chini ya ḥerem, yaani, wakfu kwa maangamizi yasiyoweza kutenguliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲרִימוּ
  choice: wakaangamiza kabisa
  rationale: Kitenzi cha Kiebrania חרם katika Hiphil kina maana maalumu ya kuweka watu au vitu chini ya ḥerem ili viangamizwe bila kubakizwa. “Wakaangamiza kabisa” ni Kiswahili cha kawaida na chenye uzito; tanbihi inahifadhi maana yake ya kiufundi.
- source_word: כָּל אֲשֶׁר בָּעִיר
  choice: kila kitu kilichokuwa mjini
  rationale: Huhifadhi ujumla wa usemi wa Kiebrania, ambao unafafanuliwa mara moja kwa kutaja watu na wanyama waliokuwamo mjini.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: mwanamume na mwanamke
  rationale: Huwasilisha jozi ya Kiebrania inayojumuisha jinsia zote kwa Kiswahili cha kawaida bila kuifanya kuwa wingi usio katika chanzo.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: kijana na mzee
  rationale: Huhifadhi usemi wa kuonyesha wigo mzima wa umri, kuanzia vijana hadi wazee.
- source_word: וְעַד שׁוֹר וָשֶׂה וַחֲמוֹר
  choice: hata ng’ombe, kondoo na punda
  rationale: “Hata” huonyesha kwamba wigo wa maangamizi uliwahusu pia wanyama wa kufugwa; majina ya umoja ya Kiebrania yanatumika hapa kwa maana ya aina kwa ujumla.
- source_word: לְפִי חָרֶב
  choice: kwa makali ya upanga
  rationale: Huhifadhi taswira ya nahau ya Kiebrania huku ikieleweka kwa urahisi kuwa waliuawa kwa upanga.
theological_decisions:
- issue: Tafsiri ya lugha ya חרם katika muktadha wa hukumu ya kivita
  choice: wakaangamiza kabisa
  alternative: wakavitia chini ya marufuku ya kuangamizwa; wakavitoa viangamizwe
  rationale: Tafsiri kuu inasema kwa uwazi tendo lililotekelezwa bila kupunguza ukali wa kifungu. Kwa kuwa חרם ni istilahi pana kuliko kuua au kuharibu kwa kawaida, tanbihi inaeleza kwamba vitu hivyo viliwekwa chini ya marufuku maalumu na kutolewa viangamizwe kabisa, bila kuingiza maelezo marefu au msimamo wa kimadhehebu katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia jozi fupi zenye mfuatano wa asili, na vistari virefu vinatenganisha orodha ya waliouawa na njia iliyotumiwa. Alama ya tanbihi [a] ipo katika matini kuu.
