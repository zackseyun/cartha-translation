  text: וַ/יַּ֥עַשׂ לָ/הֶ֖ם כֵּ֑ן וַ/יַּצֵּ֥ל אוֹתָ֛/ם מִ/יַּ֥ד בְּנֵֽי יִשְׂרָאֵ֖ל וְ/לֹ֥א הֲרָגֽוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/026.yaml
  text: So he did this for them[a], and he delivered them from the hand of the sons of Israel, and they did not kill them.
translation:
  language: sw
  text: Basi akawatendea hivyo, akawaokoa kutoka mikononi mwa wana wa Israeli[a], nao hawakawaua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania kinasema “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: Basi akawatendea hivyo
  rationale: Muundo huu unahifadhi maana ya kufanya kama ilivyoelezwa katika muktadha uliotangulia, huku ukisomeka kwa Kiswahili cha kawaida.
- source_word: וַיַּצֵּל
  choice: akawaokoa
  rationale: Kitenzi נצל katika Hifili kina maana ya kuokoa au kukomboa kutoka hatarini; “akawaokoa” ni wazi na cha asili katika muktadha huu.
- source_word: אוֹתָם
  choice: -wa-
  rationale: Kiambishi cha yambwa katika “akawaokoa” kinawarejelea Wagibeoni.
- source_word: מִיַּד
  choice: kutoka mikononi mwa
  rationale: Hii ni nahau ya Kiswahili inayolingana na taswira ya Kiebrania ya kuondolewa chini ya mamlaka au nguvu za mtu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii inadumisha umbo halisi la kirai cha Kiebrania; “Waisraeli” ni mbadala wa asili zaidi katika Kiswahili na umewekwa katika tanbihi.
- source_word: וְלֹא הֲרָגוּם
  choice: nao hawakawaua
  rationale: “Kuua” ndiyo maana ya moja kwa moja ya הרג. Kiwakilishi “nao” kinaonyesha kwa kawaida kwamba watendaji ni wana wa Israeli waliotajwa mara moja kabla.
theological_decisions:
- issue: Jina la pamoja lenye jinsia katika בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli
  rationale: Kiebrania kinasema kihalisi “wana wa Israeli.” Tafsiri kuu inahifadhi muundo huo bila kudai kwamba taifa lilihusisha wanaume pekee; jina la kitaifa “Waisraeli” limetolewa kama mbadala katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muunganiko wa vishazi unafuata mfululizo wa Kiebrania, na “nao” huweka wazi mhusika wa kitenzi cha mwisho bila kurudia jina.
