  text: וַ/יֹּאמְר֤וּ כָל הַ/נְּשִׂיאִים֙ אֶל כָּל הָ֣/עֵדָ֔ה אֲנַ֨חְנוּ֙ נִשְׁבַּ֣עְנוּ לָ/הֶ֔ם בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/עַתָּ֕ה לֹ֥א נוּכַ֖ל לִ/נְגֹּ֥עַ בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/019.yaml
  text: But all the leaders said to all the congregation[a], “We have sworn to them by Yahweh, the God of Israel, and now we cannot touch them.”
translation:
  language: sw
  text: Lakini viongozi wote waliambia kusanyiko lote, “Tumewaapia kwa Yahweh, Mungu wa Israeli, na sasa hatuwezi kuwagusa[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwadhuru” au “kuwapiga”; neno kwa neno, “kuwagusa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lakini ... wakaliambia
  rationale: Kiunganishi cha Kiebrania kinaendeleza simulizi lakini hapa kinaonyesha jibu linalokinzana na malalamiko ya kusanyiko; “Lakini” huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: כָל הַנְּשִׂיאִים
  choice: viongozi wote
  rationale: נָשִׂיא humaanisha wakuu au viongozi wa jamii; “viongozi” ni wazi na la kisasa katika muktadha huu.
- source_word: כָל הָעֵדָה
  choice: kusanyiko lote
  rationale: עֵדָה ni jamii ya Israeli iliyokusanyika; “kusanyiko lote” huhifadhi maana ya kundi zima bila kuifanya istilahi ya dhehebu.
- source_word: נִשְׁבַּעְנוּ לָהֶם
  choice: Tumewaapia
  rationale: Kitenzi kinaonyesha kuwa waliwawekea Wagibeoni kiapo, ambacho bado kinawafunga wakati huu; wakati timilifu wa Kiswahili unafaa.
- source_word: בַּיהוָה
  choice: kwa Yahweh
  rationale: Kihusishi pamoja na kitenzi cha kuapa humtaja yule ambaye kwa yeye kiapo kilifanywa; jina la agano יהוה limetafsiriwa “Yahweh.”
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Hii ni tafsiri ya moja kwa moja ya muundo unaomtambulisha Yahweh kwa uhusiano wake na Israeli.
- source_word: וְעַתָּה
  choice: na sasa
  rationale: Kirai hiki huunganisha kiapo cha awali na matokeo yake kwa wakati wa sasa.
- source_word: לֹא נוּכַל
  choice: hatuwezi
  rationale: יכל huonyesha kutoweza; hapa kutoweza huko kuna uzito wa kimaadili kwa sababu ya kiapo, bila kuhitaji kufafanuliwa zaidi katika matini.
- source_word: לִנְגֹּעַ בָּהֶם
  choice: kuwagusa
  rationale: נגע maana yake ya msingi ni “kugusa,” lakini katika muktadha huu ni nahau ya kuwashambulia au kuwadhuru. Matini kuu inadumisha picha ya Kiebrania, na tanbihi inaeleza maana ya kimuktadha.
theological_decisions:
- issue: Tafsiri ya jina la Mungu יהוה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ya Kiebrania hutumia jina la agano יהוה moja kwa moja. “Yahweh” hulihifadhi kama jina maalumu bila kulibadili kuwa cheo.
- issue: Sababu ya viongozi kutoweza kuwadhuru Wagibeoni
  choice: hatuwezi
  alternative: haturuhusiwi
  rationale: Kiebrania husema kwa namna halisi kwamba hawawezi. Tafsiri hii huhifadhi mvutano kati ya kutoweza na wajibu wa kimaadili unaotokana na kiapo, badala ya kuubainisha kimadhehebu kama katazo la moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida na unaoeleweka. “Kusanyiko” limetumiwa kwa jamii nzima iliyokusanyika, na “kuwagusa” limehifadhiwa ili kudumisha nahau ya Kiebrania huku tanbihi ikifafanua maana yake.
