base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/008.yaml
  text: They said to Joshua[a], “We are your servants.” Then Joshua said to them, “Who are you, and where do you come from?”
translation:
  language: sw
  text: Wakamwambia Yoshua[a], “Sisi ni watumishi wako.” Ndipo Yoshua akawaambia, “Ninyi ni nani, na mnatoka wapi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sisi ni watumwa wako.” Neno la Kiebrania עֲבָדֶיךָ linaweza kumaanisha watumishi au watumwa; hapa limetafsiriwa “watumishi” kwa sababu wasemaji wanatumia lugha ya heshima katika ombi la kidiplomasia.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: watumishi wako
  rationale: Neno עֶבֶד linaweza kumaanisha mtumishi au mtumwa kutegemea muktadha. Hapa Wagibeoni wanatumia lugha ya heshima na unyenyekevu katika ombi la kidiplomasia, hivyo “watumishi wako” linafaa zaidi; “watumwa wako” linabaki kuwa tafsiri halali ya kileksika.
- source_word: אֲנָחְנוּ
  choice: Sisi ni
  rationale: Kiwakilishi huru cha Kiebrania kinasisitiza wahusika, na kishirikishi “ni” kinahitajika ili sentensi ya Kiswahili iwe ya kawaida na kamili.
- source_word: מִי אַתֶּם
  choice: Ninyi ni nani
  rationale: Hii inatafsiri moja kwa moja kiulizi na kiwakilishi bila kuongeza nomino ambayo haipo katika Kiebrania.
- source_word: וּמֵאַיִן תָּבֹאוּ
  choice: na mnatoka wapi
  rationale: מֵאַיִן huuliza asili au mahali mtu anakotoka. Kiswahili cha kawaida “mnatoka wapi” kinaeleza maana hiyo bila kulazimisha wazo la mwendo unaoendelea.
- source_word: וַיֹּאמְרוּ / וַיֹּאמֶר
  choice: Wakamwambia ... Ndipo Yoshua akawauliza
  rationale: Miundo ya usimulizi yenye waw-consecutive imetolewa kwa vitenzi vinavyoendeleza simulizi. “Ndipo” inaonyesha zamu ya msemaji, na “akawauliza” ni ya asili kwa kuwa maneno yanayofuata ni maswali.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. “Wakamwambia” linaweka wazi kuwa maneno yanaelekezwa kwa Yoshua, huku “Ninyi ni nani” kikihifadhi msisitizo wa kiwakilishi cha Kiebrania.
