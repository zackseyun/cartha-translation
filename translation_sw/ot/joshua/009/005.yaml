base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/005.yaml
  text: They had worn-out and patched sandals on their feet[a], and worn-out clothes on themselves; and all the bread of their provision was dry and crumbly.
translation:
  language: sw
  text: Walikuwa wamevaa viatu vilivyochakaa na vilivyotiwa viraka miguuni mwao, na walikuwa wamevaa mavazi yaliyokuwa yamechakaa; mkate wote waliokuwa wameuchukua kama chakula cha safari ulikuwa mkavu na umevunjika-vunjika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umeota ukungu.” Neno la Kiebrania lililotafsiriwa “umevunjika-vunjika” ni adimu. Huenda likamaanisha mkate uliokauka na kuvunjika vipande-vipande, ingawa wengine hulielewa kuwa mkate ulioota ukungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָלוֹת
  choice: viatu
  rationale: Katika Kiswahili cha kawaida, “viatu” ni neno la asili na linaloeleweka kwa aina ya viatu vilivyovaliwa miguuni; “sandali” lingekuwa maalumu kupita ushahidi wa neno hili.
- source_word: בָּלוֹת
  choice: vilivyochakaa / yaliyokuwa yamechakaa
  rationale: “Kuchakaa” huonyesha hali iliyotokana na kutumiwa kwa muda, si kuwa vya zamani tu.
- source_word: מְטֻלָּאוֹת
  choice: kutiwa viraka
  rationale: Huwasilisha wazi hali ya viatu vilivyorekebishwa kwa kuwekewa viraka.
- source_word: בְּרַגְלֵיהֶם
  choice: miguuni
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maelezo halisi ya mahali viatu vilipovaliwa.
- source_word: שְׂלָמוֹת
  choice: mavazi
  rationale: Neno pana na lenye hadhi kwa nguo, bila kulibana isivyohitajika kuwa majoho au mavazi ya nje.
- source_word: עֲלֵיהֶם
  choice: walikuwa wamevaa
  rationale: Kiswahili cha kawaida huonyesha mavazi yaliyokuwa juu yao kwa kitenzi “kuvaa,” badala ya tafsiri gumu ya neno kwa neno.
- source_word: לֶחֶם צֵידָם
  choice: mkate wote waliokuwa wameuchukua kama chakula cha safari
  rationale: Huhifadhi “mkate” kama kitu halisi na kueleza kwa kawaida kwamba ulikuwa sehemu ya mahitaji yao ya safari.
- source_word: יָבֵשׁ הָיָה
  choice: ulikuwa umekauka
  rationale: Hueleza hali ya mkate kwa Kiswahili cha kawaida na kudokeza kuwa ukavu ulikuwa umetokea kabla ya wakati unaosimuliwa.
- source_word: נִקֻּדִים
  choice: kuvunjikavunjika
  rationale: Neno la Kiebrania ni adimu na maana yake si hakika. Chaguo hili linafaa kwa mkate mkavu uliokuwa ukimeguka vipandevipande, huku maana mbadala ya ukungu ikihifadhiwa katika tanbihi.
