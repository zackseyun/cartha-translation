source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/ם יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא חֹטְבֵ֥י עֵצִ֛ים וְ/שֹׁ֥אֲבֵי מַ֖יִם לָֽ/עֵדָ֑ה וּ/לְ/מִזְבַּ֤ח יְהוָה֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה אֶל הַ/מָּק֖וֹם אֲשֶׁ֥ר יִבְחָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/027.yaml
  text: So Joshua made them woodcutters and water carriers on that day for the congregation and for the altar of Yahweh[a], to this day, in the place that he would choose.
translation:
  language: sw
  text: Basi siku hiyo Yoshua akawafanya wawe wakata kuni na wachota maji[a] kwa ajili ya kusanyiko na kwa ajili ya madhabahu ya Yahwe, hadi leo hii, mahali ambapo Yahwe angechagua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, wateka maji.
    reason: Mbadala huu unaonyesha pia kazi ya kuteka maji; ‘wachota maji’ ndiyo tafsiri ya moja kwa moja zaidi ya שאב.
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: akawafanya wawe
  rationale: Ingawa kitenzi נתן kwa msingi humaanisha ‘kutoa’ au ‘kuweka,’ hapa pamoja na majina ya watendaji kinaonyesha kuwapa kazi au hadhi fulani. ‘Akawafanya wawe’ huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: חֹטְבֵי עֵצִים
  choice: wakata kuni
  rationale: Kirai hiki humaanisha watu wanaokata miti au kuni. ‘Wakata kuni’ ni kifupi, cha sasa, na kinaeleweka kwa urahisi.
- source_word: וְשֹׁאֲבֵי מַיִם
  choice: wachota maji
  rationale: Kitenzi שאב humaanisha kuchota maji. ‘Wachota maji’ huonyesha tendo lenyewe kwa usahihi kuliko tafsiri inayosisitiza tu kubeba maji.
- source_word: לָעֵדָה
  choice: kwa ajili ya kusanyiko
  rationale: עֵדָה hapa ni jumuiya iliyokusanyika ya Israeli. ‘Kusanyiko’ huhifadhi maana ya kundi la agano lililokusanyika bila kuifanya kuwa taasisi ya kidhehebu.
- source_word: וּלְמִזְבַּח יְהוָה
  choice: na madhabahu ya Yahwe
  rationale: Tafsiri hii huhifadhi uhusiano wa moja kwa moja kati ya huduma yao na madhabahu inayomhusu Yahwe.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahwe’ badala ya kubadilishwa na cheo, ili kuhifadhi jina la binafsi lililo katika maandishi ya Kiebrania.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hadi leo hii
  rationale: Hii ni nahau inayoonyesha kwamba hali hiyo iliendelea mpaka wakati wa mwandishi; ‘hadi leo hii’ ni Kiswahili cha kawaida na cha wazi.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר יִבְחָר
  choice: mahali ambapo angechagua
  rationale: Kirai kinaelekeza kwenye mahali pa ibada patakapochaguliwa. ‘Angechagua’ huonyesha mtazamo wa simulizi unaotazama mbele kutoka wakati wa Yoshua, bila kuongeza wazi jina la mtendaji ambalo Kiebrania limeliacha katika kiwakilishi.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi yana jina la agano יהוה, kwa hiyo limetoholewa kama jina badala ya kubadilishwa na cheo.
- issue: Mtendaji wa kitendo katika ‘mahali ambapo angechagua’
  choice: Kiwakilishi kisichoelezwa wazi kwa jina, kikirejelea kwa muktadha kwa Yahwe
  alternative: mahali ambapo pangeteuliwa
  rationale: Muundo wa Kiebrania una kiima cha nafsi ya tatu, na katika matumizi ya Kumbukumbu la Torati na Yoshua kiima hicho kwa kawaida ni Yahwe. Tafsiri inadumisha kiwakilishi badala ya kukifanya kifungu kuwa cha kutendwa, hivyo haiufuti msisitizo wa uchaguzi wa Mungu wala kuongeza jina lisilorudiwa katika kifungu.
- issue: Uhusiano wa ‘hadi leo hii’ na ‘mahali ambapo angechagua’
  choice: Mpangilio wa vifungu umehifadhiwa kwa ukaribu
  alternative: kufafanua kwamba kazi iliendelea hadi leo katika mahali alipochagua
  rationale: Sintaksia ya mwisho wa mstari inaweza kuhisiwa kuwa ngumu na inaweza kuhusishwa kwa namna zaidi ya moja na huduma au madhabahu. Tafsiri haijaongeza kishazi kinachofunga maana hiyo kwa upande mmoja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa sasa. Maneno ya kizamani na istilahi za kidhehebu zimeepukwa. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, ‘wachota maji.’
