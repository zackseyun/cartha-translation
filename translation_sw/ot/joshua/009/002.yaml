  text: they gathered together to fight against Joshua and against Israel[a], with one accord.
translation:
  language: sw
  text: wakakusanyika pamoja ili kupigana dhidi ya Yoshua na dhidi ya Israeli kwa umoja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kwa kinywa kimoja”; nahau ya Kiebrania humaanisha kutenda kwa umoja kamili au kwa makubaliano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: wakakusanyika
  rationale: Nifali yenye waw mfululizo inaonyesha walikusanyika kuwa kundi; ‘wakakusanyika’ ni Kiswahili cha kawaida na huhifadhi tendo la pamoja.
- source_word: יַחְדָּו
  choice: pamoja
  rationale: Kielezi hiki hukazia kwamba walitenda kwa umoja; ‘pamoja’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: לְהִלָּחֵם
  choice: ili kupigana
  rationale: Kitenzi hiki katika Nifali humaanisha kuingia vitani; ‘ili kupigana’ huonyesha kwa kawaida kusudi la kukusanyika kwao.
- source_word: עִם יְהוֹשֻׁעַ וְעִם יִשְׂרָאֵל
  choice: na Yoshua na Israeli
  rationale: Baada ya kitenzi cha kupigana, עִם hueleza upande unaopingwa. Katika Kiswahili, ‘kupigana na’ kwa kawaida humaanisha kupigana dhidi ya mtu, huku marudio ya ‘na’ yakihifadhi kwa kiasi muundo wa Kiebrania.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: פֶּה אֶחָד
  choice: kwa nia moja
  rationale: Nahau hii, kihalisi ‘kinywa kimoja,’ inaonyesha makubaliano kamili na kusudi la pamoja; ‘kwa nia moja’ ni ya asili na wazi katika Kiswahili cha sasa.
