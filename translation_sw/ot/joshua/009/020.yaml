    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת נַעֲשֶׂה לָהֶם
  choice: Tutawatendea hivi
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida hatua wanayokusudia kuwafanyia, huku ukihifadhi kiwakilishi cha kuonyesha זֹאת na maana ya wakati ujao ya נַעֲשֶׂה.
- source_word: וְהַחֲיֵה אוֹתָם
  choice: na tutawaacha waishi
  rationale: Hifili ya חיה hapa ina maana ya kuwaacha hai au kutowaua. Kauli hii ni ya kawaida katika Kiswahili na haiongezi wazo lisilokuwamo katika Kiebrania.
- source_word: וְלֹא יִהְיֶה עָלֵינוּ קֶצֶף
  choice: ili ghadhabu isitupate
  rationale: “Ili” huwasilisha uhusiano wa kusudi au matokeo katika muktadha huu; “isitupate” ni usemi wa asili wa Kiswahili kwa ghadhabu inayoweza kuwa juu yao.
- source_word: קֶצֶף
  choice: ghadhabu
  rationale: “Ghadhabu” inadumisha uzito wa neno la Kiebrania kuliko “hasira,” bila kumtaja wazi mwenye ghadhabu wakati andiko halimtaji.
- source_word: עַל הַשְּׁבוּעָה
  choice: kwa sababu ya kiapo
  rationale: עַל hapa inaonyesha sababu ya ghadhabu inayohofiwa; “kwa sababu ya” huieleza wazi kwa Kiswahili cha sasa.
- source_word: אֲשֶׁר נִשְׁבַּעְנוּ לָהֶם
  choice: tulichowaapia
  rationale: Kitenzi hiki kinaonyesha kwamba waliapa kiapo kwao; muundo wa Kiswahili unahifadhi wahusika na uhusiano huo kwa ufupi.
theological_decisions:
- issue: Mhusika wa ghadhabu katika muktadha wa kuvunja kiapo
  choice: Neno “ghadhabu” limetumiwa bila kuongeza “ya BWANA” katika andiko kuu.
  alternative: “ghadhabu ya BWANA”
  rationale: Muktadha unaelekea kuashiria ghadhabu ya Mungu, lakini Kiebrania cha mstari huu hakimtaji BWANA waziwazi. Tafsiri inadumisha dokezo hilo bila kulifanya kuwa kauli ya moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa uratibu umehifadhiwa bila kugeuza wazi sehemu ya pili kuwa ufafanuzi wa kwanza.
