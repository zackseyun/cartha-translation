  text: This is what we will do to them and let them live[b][a], so that wrath may not come upon us because of the oath that we swore to them.
translation:
  language: sw
  text: Hivi ndivyo tutakavyowatendea, na tutawaacha waishi[a], ili ghadhabu[b] isitupate kwa sababu ya kiapo tulichowaapia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tutawahifadhi hai” au “tutawaacha hai.”
    reason: lexical_alternative
  - marker: b
