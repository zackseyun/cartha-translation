base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/017.yaml
  text: So the sons of Israel set out and came to their cities on the third day[a]. Now their cities were Gibeon, Chephirah, Beeroth[b], and Kiriath-jearim.
translation:
  language: sw
  text: Basi wana wa Israeli[a] wakaondoka, wakafika katika miji ya hao Wakibeoni siku ya tatu. Miji hiyo ilikuwa Gibeoni, Kefira[b], Beerothi, na Kiriath-yearimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli.” Kiebrania kinasema kihalisi “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Jina hili huandikwa pia “Kefirah” katika baadhi ya mifumo ya unukuzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: wakaondoka
  rationale: Kitenzi נסע katika mfululizo wa simulizi kinaonyesha kuanza safari; “wakaondoka” ni Kiswahili cha kawaida na hakiongezi wazo lisilotajwa la kuvunja kambi.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Tafsiri hii inaakisi moja kwa moja muundo wa Kiebrania na hapa ni jina la jumla la watu wa Israeli, si taarifa kwamba waliohusika walikuwa wanaume pekee.
- source_word: וַיָּבֹאוּ אֶל עָרֵיהֶם
  choice: wakafika kwenye miji yao
  rationale: בוא pamoja na אֶל humaanisha kufika mahali; “kwenye miji yao” ni ya kawaida katika Kiswahili na inahifadhi kiwakilishi cha Kiebrania.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: siku ya tatu
  rationale: Hii ndiyo maana ya moja kwa moja ya kirai cha wakati katika simulizi.
- source_word: וְעָרֵיהֶם
  choice: Miji yao ilikuwa
  rationale: Kiunganishi kinaanzisha maelezo yanayotaja miji hiyo; sentensi mpya huwasilisha maelezo hayo kwa Kiswahili cha kawaida.
- source_word: גִּבְעוֹן
  choice: Gibeoni
  rationale: Umbo la jina la mahali lililozoeleka katika Kiswahili.
- source_word: הַכְּפִירָה
  choice: Kefira
  rationale: Unukuzi unaosomeka kwa kawaida katika Kiswahili na unaokaribia konsonanti za jina la Kiebrania.
- source_word: בְּאֵרוֹת
  choice: Beerothi
  rationale: Unukuzi wa Kiswahili unaohifadhi kwa kiasi kikubwa umbo la jina la Kiebrania.
- source_word: קִרְיַת יְעָרִים
  choice: Kiriath-yearimu
  rationale: Unukuzi wa Kiswahili wa jina ambatani; kistari huonyesha vipashio vyake viwili.
