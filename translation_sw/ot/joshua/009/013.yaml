source:
  edition: WLC
  text: וְ/אֵ֨לֶּה נֹאד֤וֹת הַ/יַּ֨יִן֙ אֲשֶׁ֣ר מִלֵּ֣אנוּ חֲדָשִׁ֔ים וְ/הִנֵּ֖ה הִתְבַּקָּ֑עוּ וְ/אֵ֤לֶּה שַׂלְמוֹתֵ֨י/נוּ֙ וּ/נְעָלֵ֔י/נוּ בָּל֕וּ מֵ/רֹ֥ב הַ/דֶּ֖רֶךְ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/013.yaml
  text: And these wineskins[a], which we filled when they were new—look, they have burst[c][b]; and these our garments and our sandals have worn out from the journey being very long.
translation:
  language: sw
  text: Na viriba hivi vya divai[a] tulivijaza vikiwa vipya; tazama, vimepasuka[b]. Na mavazi yetu haya na sandali zetu vimechakaa kwa sababu safari ilikuwa ndefu sana.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mifuko iliyotengenezwa kwa ngozi kwa ajili ya kuhifadhia divai.
    reason: cultural_clarification
  - marker: b
    text: Au, “vimeachanika.”
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania kwa karibu zaidi: “kwa sababu ya urefu mkubwa sana wa safari.”'
    reason: literal_rendering
lexical_decisions:
- source_word: נֹאדוֹת הַיַּיִן
  choice: viriba vya divai
  rationale: Neno נֹאד humaanisha chombo cha ngozi cha kubebea kimiminika. “Viriba vya divai” ni usemi wa Kiswahili unaofaa mazingira ya kale na unaepuka dhana ya chupa za kisasa.
- source_word: מִלֵּאנוּ חֲדָשִׁים
  choice: tulipovijaza vilikuwa vipya
  rationale: Muundo huu unaonyesha kwa uwazi kwamba viriba vilikuwa vipya wakati vilipojazwa, huku ukihifadhi maana ya kitenzi “tulijaza” na kivumishi “vipya.”
- source_word: וְהִנֵּה
  choice: tazama
  rationale: “Tazama” huhifadhi kazi ya chembe hii ya Kiebrania ya kumwelekeza msikilizaji aangalie ushahidi unaotajwa, kwa mtindo wenye hadhi lakini unaoeleweka.
- source_word: הִתְבַּקָּעוּ
  choice: vimepasuka
  rationale: Kitenzi hiki kinaonyesha kwamba viriba vimeachanika au kupasuka. “Vimepasuka” ni cha kawaida na kinaonyesha hali iliyotokana na uharibifu huo.
- source_word: שַׂלְמוֹתֵינוּ
  choice: mavazi yetu
  rationale: Neno hili linarejelea mavazi kwa maana pana. “Mavazi” lina hadhi inayofaa masimulizi na ni pana kuliko kutaja aina fulani ya vazi.
- source_word: נְעָלֵינוּ
  choice: viatu vyetu
  rationale: נַעַל humaanisha kiatu au kandambili ya kale. “Viatu” ni neno la kawaida na linaloeleweka kote katika Kiswahili cha Afrika Mashariki bila kuingiza picha mahususi ya viatu vya kisasa.
- source_word: בָּלוּ
  choice: vimechakaa
  rationale: Kitenzi kinaeleza kuchakaa au kuzeeka kwa sababu ya matumizi. “Vimechakaa” huwasilisha hali hiyo ya sasa kwa Kiswahili cha kawaida.
- source_word: מֵרֹב הַדֶּרֶךְ מְאֹד
  choice: kwa sababu safari ilikuwa ndefu sana
  rationale: Tafsiri hii ya kimawasiliano huhifadhi sababu inayodokezwa na מִן pamoja na mkazo wa מְאֹד, bila kutumia muundo wa Kiswahili usio wa kawaida kama “kutokana na wingi wa njia sana.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inaendeleza sauti ya ushuhuda wa moja kwa moja; “tazama” huhifadhi msisitizo wa usemi wa Kiebrania. Maneno ya kawaida yametangulizwa, huku maelezo ya kitamaduni na muundo halisi zaidi yakiwekwa katika tanbihi.
