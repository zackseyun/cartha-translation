translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imeachwa ikiendelea baada ya koma kwa sababu muundo wa Kiebrania unakamilishwa katika mstari unaofuata. Alama zote za tanbihi zimewekwa katika matini kuu.
