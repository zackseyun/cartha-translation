base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/001.yaml
  text: And it happened[a], when all the kings who were beyond the Jordan—in the hill country, in the lowland, and along the whole coast of the Great Sea toward Lebanon—the Hittite, the Amorite, the Canaanite, the Perizzite, the Hivite, and the Jebusite—heard of it[c][b],
translation:
  language: sw
  text: Ikawa[a], wafalme wote waliokuwa ng’ambo ya Yordani[b]—katika nchi ya vilima, katika nchi ya tambarare[c], na kandokando ya pwani yote ya Bahari Kuu kuelekea Lebanoni—Wahiti, Waamori, Wakanaani, Waperizi, Wahivi na Wayebusi—waliposikia[d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinaanza kwa usemi wa kisimulizi unaoweza pia kutafsiriwa, “Basi ikawa.”
    reason: lexical_alternative
  - marker: b
    text: Au “upande wa pili wa Yordani.” Usemi wa Kiebrania unaweza kutafsiriwa kwa njia zote mbili kutegemea mahali anaposimama msemaji.
    reason: lexical_alternative
  - marker: c
    text: Au “katika Shefela,” yaani eneo la vilima vya chini upande wa magharibi.
    reason: cultural_note
  - marker: d
    text: Kiebrania hakitaji wazi kitu walichosikia; maana yake inaeleweka kutokana na muktadha unaozunguka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Huhifadhi kazi ya kifungu hiki katika simulizi ya Kiebrania, kikianzisha tukio jipya, bila kutumia usemi mrefu au wa kizamani kupita kiasi.
- source_word: כִשְׁמֹעַ
  choice: waliposikia
  rationale: Muundo wa כ pamoja na kitenzi-jina unaonyesha wakati, yaani ‘waliposikia.’ Kitu walichosikia hakikutajwa katika mstari huu, kwa hiyo hakijaongezwa katika matini kuu.
- source_word: כָּל הַמְּלָכִים
  choice: wafalme wote
  rationale: Ni tafsiri ya moja kwa moja ya kiashiria cha ujumla na nomino.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: waliokuwa ng’ambo ya Yordani
  rationale: בְּעֵבֶר inaweza kumaanisha ‘ng’ambo’ au ‘upande wa pili’; ‘ng’ambo ya Yordani’ huhifadhi mtazamo wa kijiografia bila kutaja upande ambao Kiebrania hakijautaja wazi.
- source_word: בָּהָר
  choice: katika nchi ya vilima
  rationale: הַר hapa ni eneo la nyanda za juu, si mlima mmoja; ‘nchi ya vilima’ ni wazi na ya kawaida katika Kiswahili.
- source_word: וּבַשְּׁפֵלָה
  choice: katika nchi ya chini
  rationale: שְׁפֵלָה hutaja eneo la chini au la vilima vya chini upande wa magharibi; tafsiri hii inatoa maana ya kijiografia badala ya kuacha jina lisiloeleweka kwa wasomaji wengi.
- source_word: וּבְכֹל חוֹף הַיָּם הַגָּדוֹל
  choice: na kandokando ya pwani yote ya Bahari Kuu
  rationale: חוֹף ni ‘pwani’ au ‘ufuo’; ‘kandokando ya pwani yote’ huwasilisha eneo lote la ukanda wa bahari. ‘Bahari Kuu’ huhifadhi jina la Kiebrania la Bahari ya Mediterania.
- source_word: אֶל מוּל הַלְּבָנוֹן
  choice: kuelekea Lebanoni
  rationale: Kirai kinaonyesha mwelekeo au mahali panapohusiana na Lebanoni; ‘kuelekea’ ni cha kawaida na hakibani maana kuwa ‘mbele ya’ au ‘mkabala na.’
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: wafalme wa Wahiti, Waamori, Wakanaani, Waperizi, Wahivi na Wayebusi
  rationale: Majina ya makabila katika Kiebrania yako katika umoja wa kijumla na yanafafanua wafalme waliotangulia. Kiswahili cha kawaida hutumia majina ya watu katika wingi na kurudia dhana ya ‘wafalme wa’ ili uhusiano uwe wazi.
