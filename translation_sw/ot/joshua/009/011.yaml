  text: וַ/יֹּאמְר֣וּ אֵלֵ֡י/נוּ זְֽקֵינֵי/נוּ֩ וְ/כָל יֹשְׁבֵ֨י אַרְצֵ֜/נוּ לֵ/אמֹ֗ר קְח֨וּ בְ/יֶדְ/כֶ֤ם צֵידָה֙ לַ/דֶּ֔רֶךְ וּ/לְכ֖וּ לִ/קְרָאתָ֑/ם וַ/אֲמַרְתֶּ֤ם אֲלֵי/הֶם֙ עַבְדֵי/כֶ֣ם אֲנַ֔חְנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/011.yaml
  text: So our elders and all the inhabitants of our land said to us[a], ‘Take provisions in your hand for the journey, and go to meet them. Say to them, “We are your servants”[b]; and now make a covenant with us.’
translation:
  language: sw
  text: Basi wazee wetu na wakazi wote wa nchi yetu walituambia, ‘Chukueni masurufu kwa ajili ya safari, nendeni kukutana nao, mkawaambie, “Sisi ni watumishi wenu”[b]; basi sasa, fanyeni agano nasi[a].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya moja kwa moja zaidi, “kateni agano nasi.”
    reason: lexical_alternative
  - marker: b
    text: “Watumishi wenu” ni lugha ya kidiplomasia ya kujishusha; neno la Kiebrania linaweza pia kumaanisha “watumwa” katika miktadha mingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵינֵינוּ
  choice: wazee wetu
  rationale: Katika muktadha huu neno hilo linamaanisha viongozi wa jumuiya, si wanaume wenye umri mkubwa tu; “wazee” ni neno la kawaida la Kiswahili kwa cheo hicho.
- source_word: יֹשְׁבֵי אַרְצֵנוּ
  choice: wakazi wote wa nchi yetu
  rationale: Huwataja kwa ujumla wote wanaoishi katika nchi yao; “wakazi” ni ya asili na wazi katika Kiswahili cha sasa.
- source_word: צֵידָה
  choice: masurufu
  rationale: Neno hili linamaanisha chakula au mahitaji yanayochukuliwa kwa safari; “masurufu” huhifadhi maana hiyo bila kuiwekea mipaka ya chakula pekee.
- source_word: בְיֶדְכֶם
  choice: chukueni
  rationale: Kiswahili kwa kawaida huwasilisha wazo la kubeba kitu kwa kitenzi “chukua”; kutafsiri “mkononi mwenu” moja kwa moja kungekuwa kizito bila kuongeza maana muhimu hapa.
- source_word: לַדֶּרֶךְ
  choice: kwa ajili ya safari
  rationale: Katika muktadha huu דֶּרֶךְ hurejelea safari, na usemi huu unaonyesha kusudi kwa Kiswahili cha kawaida.
- source_word: לִקְרָאתָם
  choice: kukutana nao
  rationale: Muundo huu una maana ya kwenda kumlaki au kukutana na mtu; “kukutana nao” ni wazi na ya kawaida.
- source_word: עַבְדֵיכֶם
  choice: watumishi wenu
  rationale: Ingawa עבד pia inaweza kumaanisha watumwa, hapa ni lugha ya kidiplomasia ya kujishusha mbele ya wale wanaoombwa kufanya agano.
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: fanyeni agano nasi
  rationale: Hii ni nahau ya Kiebrania yenye maana halisi ya “kata agano”; “fanyeni agano nasi” huhifadhi dhana ya agano kwa Kiswahili cha asili.
- source_word: וְעַתָּה
  choice: basi sasa
  rationale: Maneno haya yanaashiria mpito kuelekea ombi; “basi sasa” yanaonyesha mtiririko huo kwa kawaida.
- source_word: וַיֹּאמְרוּ אֵלֵינוּ ... לֵאמֹר
  choice: walituambia
  rationale: Kauli ya Kiebrania ya kutanguliza maneno imenyooshwa kuwa usemi wa kawaida wa Kiswahili, huku nukuu ikitoa yaliyosemwa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye heshima. Maumbo ya amri ya wingi yametumiwa kwa sababu wazee waliwaagiza wajumbe kadhaa. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja; mpangilio huu unasahihisha kutolingana kwa alama katika safu ya ushauri ya Kiingereza.
