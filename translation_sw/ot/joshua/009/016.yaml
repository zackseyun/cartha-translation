base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/016.yaml
  text: And it happened at the end of three days, after they had made a covenant with them, that they heard that they were near to them and were living among them.
translation:
  language: sw
  text: Ikawa, mwishoni mwa siku tatu baada ya Waisraeli kufanya agano nao, wakasikia kwamba watu hao walikuwa karibu nao na waliishi kati yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְצֵה שְׁלֹשֶׁת יָמִים
  choice: baada ya siku tatu
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kipindi cha siku tatu bila tafsiri ngumu ya neno kwa neno kama ‘mwishoni mwa siku tatu’.
- source_word: כָּרְתוּ ... בְּרִית
  choice: kufanya agano
  rationale: Nahau ya Kiebrania ni ‘kukata agano’; Kiswahili cha kawaida na chenye hadhi hutumia ‘kufanya agano’.
- source_word: קְרֹבִים הֵם אֵלָיו
  choice: watu hao walikuwa karibu nao
  rationale: Kiwakilishi cha umoja katika Kiebrania kinaweza kuwa cha kijumla kikimrejelea Israeli; ‘nao’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: וּבְקִרְבּוֹ הֵם יֹשְׁבִים
  choice: waliishi kati yao
  rationale: Huhifadhi wazo kwamba Wagibeoni walikaa ndani au miongoni mwa eneo/jumuiya ya Israeli, bila kulifanya liwe mahususi kuliko chanzo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha simulizi, cha sasa na chenye hadhi. ‘Waisraeli’ na ‘watu hao’ zimetumiwa kufafanua marejeo ya viwakilishi yanayoweza kuwa magumu katika Kiswahili, bila kuongeza tafsiri ya kimadhehebu.
