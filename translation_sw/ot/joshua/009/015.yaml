  text: וַ/יַּ֨עַשׂ לָ/הֶ֤ם יְהוֹשֻׁ֨עַ֙ שָׁל֔וֹם וַ/יִּכְרֹ֥ת לָ/הֶ֛ם בְּרִ֖ית לְ/חַיּוֹתָ֑/ם וַ/יִּשָּׁבְע֣וּ לָ/הֶ֔ם נְשִׂיאֵ֖י הָ/עֵדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/015.yaml
  text: So Joshua made peace with them and made a covenant with them to let them live[c][b][a], and the leaders of the congregation swore to them.
translation:
  language: sw
  text: Basi Yoshua akafanya amani nao, akafanya agano nao ili waachwe hai; nao viongozi wa kusanyiko wakawaapia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ ... שָׁלוֹם
  choice: akafanya amani nao
  rationale: Hii ni nahau ya Kiebrania inayomaanisha kuanzisha uhusiano wa amani; tafsiri hii ni ya asili katika Kiswahili na inadumisha maana ya kisiasa na kiagano.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: kufanya agano
  rationale: Ingawa Kiebrania husema kihalisi ‘kukata agano,’ Kiswahili sanifu hutumia ‘kufanya agano’; maana ya kisheria na kiagano inadumishwa bila usemi usio wa kawaida.
- source_word: לְחַיּוֹתָם
  choice: ili waachwe hai
  rationale: Infinitivu yenye kiambishi cha kiwakilishi inaeleza kusudi la agano, yaani kwamba maisha yao yahifadhiwe; ‘waachwe hai’ ni wazi na ya asili.
- source_word: וַיִּשָּׁבְעוּ לָהֶם
  choice: wakawaapia
  rationale: Kitenzi kinaonyesha kutoa kiapo kwao; ‘wakawaapia’ ni kifupi, wazi, na kinadumisha walengwa wa kiapo.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: viongozi wa kusanyiko
  rationale: נְשִׂיאִים ni viongozi au wakuu wanaotambuliwa, na עֵדָה hapa ni jumuiya iliyokusanyika; ‘kusanyiko’ huepuka kuingiza maana maalumu ya dhehebu.
theological_decisions:
- issue: Tafsiri ya nahau ya agano כרת ברית
  choice: kufanya agano
  alternative: kukata agano
  rationale: ‘Kufanya agano’ ni Kiswahili cha kawaida na sahihi. Tafsiri ya neno kwa neno ‘kukata agano’ ingedumisha taswira ya Kiebrania lakini si nahau ya kawaida ya Kiswahili; hakuna maana ya kiteolojia inayopotea.
- issue: Tafsiri ya הָעֵדָה
  choice: kusanyiko
  alternative: jumuiya
  rationale: Neno hilo linaweza kumaanisha jumuiya ya Israeli iliyokusanyika. ‘Kusanyiko’ linadumisha maana ya pamoja bila kuingiza muundo wa baadaye wa kanisa au dhehebu.
- issue: Kusudi la agano katika לְחַיּוֹתָם
  choice: ili waachwe hai
  alternative: ili kuwahifadhi hai
  rationale: Tafsiri hii inadumisha wazo kwamba agano liliwalinda wasiuawa, bila kuongeza maelezo kuhusu namna au msingi wa ulinzi huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kibiblia lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unafuata mfuatano wa Kiebrania bila kuwa mgumu; hakuna alama za tanbihi kwa kuwa tofauti za kileksika zinaweza kutolewa katika vifaa vya uhariri bila kuhitajika katika mstari wenyewe.
