  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו מֵ/אֶ֨רֶץ רְחוֹקָ֤ה מְאֹד֙ בָּ֣אוּ עֲבָדֶ֔י/ךָ לְ/שֵׁ֖ם יְהוָ֣ה אֱלֹהֶ֑י/ךָ כִּֽי שָׁמַ֣עְנוּ שָׁמְע֔/וֹ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר עָשָׂ֖ה בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/009.yaml
  text: And they said to him[a], “Your servants have come from a very distant land for the name of Yahweh your God, for we have heard of his fame and all that he did in Egypt.”
translation:
  language: sw
  text: Nao wakamwambia, “Sisi watumishi wako tumetoka nchi ya mbali sana kwa ajili ya jina la Yahwe, Mungu wako, kwa maana tumesikia habari zake[a] na yote aliyofanya huko Misri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tumesikia taarifa kumhusu” au “tumesikia sifa zake.” Kiebrania kinatumia maneno yenye mzizi mmoja, kwa maana halisi, “tumesikia habari yake.”
    reason: Mbadala wa kileksika unaohifadhi upana wa maana wa שָׁמַעְנוּ שָׁמְעוֹ.
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Nao wakamwambia
  rationale: Kauli hii inaendeleza simulizi na kuanzisha maneno ya moja kwa moja; “Nao” na umbo “wakamwambia” vinaakisi mtiririko wa wayyiqtol kwa Kiswahili cha kawaida.
- source_word: מֵאֶרֶץ רְחוֹקָה מְאֹד
  choice: tumetoka nchi ya mbali sana
  rationale: “Mbali sana” huhifadhi msisitizo wa מְאֹד, huku “tumetoka” ikieleza kwa kawaida mahali walikotoka katika muktadha wa kufika kwao.
- source_word: בָּאוּ עֲבָדֶיךָ
  choice: Sisi watumishi wako tumetoka
  rationale: עֲבָדֶיךָ ni namna ya kujishusha katika mazungumzo ya kidiplomasia, hivyo “watumishi wako” inafaa kuliko “watumwa wako.” Kiswahili hutaja mhusika “sisi watumishi wako” kwa uwazi kabla ya kitenzi.
- source_word: לְשֵׁם יְהוָה אֱלֹהֶיךָ
  choice: kwa ajili ya jina la Yahwe, Mungu wako
  rationale: “Kwa ajili ya jina” huhifadhi kwa karibu muundo wa Kiebrania na wazo la kuja kwa sababu ya sifa au mamlaka inayohusishwa na jina hilo.
- source_word: שָׁמַעְנוּ שָׁמְעוֹ
  choice: tumesikia habari zake
  rationale: Kirai cha Kiebrania hutumia maneno yenye mzizi mmoja na kinaweza kumaanisha kusikia habari, sifa, au umaarufu wake. “Habari zake” ni ya asili na haifungi maana katika tafsiri moja tu.
- source_word: וְאֵת כָּל אֲשֶׁר עָשָׂה בְּמִצְרָיִם
  choice: na yote aliyofanya huko Misri
  rationale: Hii inawasilisha kwa ufupi na kwa kawaida jumla ya matendo yanayotajwa; “huko” inaonyesha mahali bila kuongeza maana mpya.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia moja kwa moja Tetragramatoni יהוה. “Yahwe” huhifadhi jina la agano kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Maana ya לְשֵׁם katika sababu ya safari
  choice: kwa ajili ya jina la Yahwe
  alternative: kwa sababu ya sifa za Yahwe
  rationale: Tafsiri iliyochaguliwa huhifadhi usemi wa “jina” na mvutano wake wa kimaana, ambao unaweza kuhusisha sifa, umaarufu, au mamlaka, bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Kauli ya kidiplomasia ya kujishusha imehifadhiwa kwa “watumishi wako,” na usemi wenye utata wa “jina” haujafafanuliwa kimadhehebu.
