base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/022.yaml
  text: Then Joshua called for them and spoke to them[a], saying, “Why did you deceive us, saying, ‘We are very far from you,’ when you are living among us?”
translation:
  language: sw
  text: Ndipo Yoshua akawaita, akasema nao, “Kwa nini mmetudanganya kwa kusema, ‘Sisi tuko mbali sana nanyi,’ ilhali ninyi mnaishi katikati yetu[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwetu.”
    reason: Neno בְּקִרְבֵּנוּ humaanisha “katikati yetu” au “miongoni mwetu.”
lexical_decisions:
- source_word: וַיִּקְרָא לָהֶם
  choice: akawaita
  rationale: Katika muktadha huu, kitenzi kinaonyesha kwamba Yoshua aliwaita Wagibeoni waje mbele yake. “Akawaita” ni Kiswahili cha kawaida na kinaacha muktadha uonyeshe kwamba waliitwa ili wahojiwe.
- source_word: וַיְדַבֵּר אֲלֵיהֶם לֵאמֹר
  choice: akasema nao
  rationale: Huu ni utangulizi wa kawaida wa maneno ya moja kwa moja katika Kiebrania. “Akasema nao” ni wa asili katika Kiswahili na huepuka uradidi usio wa lazima wa “akisema.”
- source_word: לָמָּה
  choice: Kwa nini
  rationale: Hili ndilo swali la moja kwa moja na la kawaida linalolingana na neno la Kiebrania.
- source_word: רִמִּיתֶם אֹתָנוּ
  choice: mmetudanganya
  rationale: Kauli hii inaonyesha udanganyifu wa makusudi. “Mmetudanganya” ni wazi, yenye uzito unaofaa, na inaonyesha tendo lililofanyika lenye athari katika hali ya sasa.
- source_word: רְחוֹקִים אֲנַחְנוּ מִכֶּם מְאֹד
  choice: Sisi tuko mbali sana nanyi
  rationale: “Mbali sana” huhifadhi msisitizo wa מְאֹד, na “nanyi” ni njia ya kawaida ya kueleza umbali kutoka kwa watu wanaosemeshwa.
- source_word: וְאַתֶּם
  choice: ilhali ninyi
  rationale: Kiunganishi kinaweka tofauti kati ya dai lao na hali halisi. “Ilhali” huonyesha tofauti hiyo kwa uwazi bila kuongeza maelezo yasiyokuwamo katika mstari.
- source_word: בְּקִרְבֵּנוּ יֹשְׁבִים
  choice: mnaishi kati yetu
  rationale: Kishazi hiki kinaeleza makao yao ya karibu au ndani ya eneo la Israeli. “Mnaishi kati yetu” huhifadhi taswira ya Kiebrania na hali endelevu ya kitenzi tegemezi.
theological_decisions:
- issue: Iwapo shtaka la Yoshua lifafanuliwe kama ukiukaji wa agano
  choice: Kutafsiri shtaka kama udanganyifu kuhusu umbali wa makao yao pekee
  alternative: Kuongeza katika mstari kwamba walidanganya ili kupata agano au kwamba walikiuka masharti ya agano
  rationale: Mstari wenyewe unalenga tofauti kati ya dai lao la kuwa mbali sana na ukweli kwamba waliishi kati ya Israeli. Athari za kiagano zinapatikana katika muktadha, lakini hazipaswi kuingizwa katika maneno ya mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa moja kwa moja umetumiwa kwa shtaka la Yoshua, huku “ilhali” ikiweka wazi tofauti iliyopo katika Kiebrania. Hakuna maelezo ya kidhehebu au ufafanuzi wa kiagano ulioongezwa.
