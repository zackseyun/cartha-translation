  text: וְ/לֹ֤א הִכּוּ/ם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּֽי נִשְׁבְּע֤וּ לָ/הֶם֙ נְשִׂיאֵ֣י הָֽ/עֵדָ֔ה בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלֹּ֥נוּ כָל הָ/עֵדָ֖ה עַל הַ/נְּשִׂיאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/018.yaml
  text: But the sons of Israel did not strike them[a], because the leaders of the congregation had sworn to them by Yahweh, the God of Israel[c][b]. And all the congregation grumbled against the leaders.
translation:
  language: sw
  text: Lakini wana wa Israeli hawakuwapiga[a], kwa sababu viongozi wa kusanyiko walikuwa wamewaapia kwa Yahwe, Mungu wa Israeli. Kusanyiko lote likawanung'unikia viongozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakuwashambulia” au “hawakuwaua.” Kitenzi cha Kiebrania humaanisha “kupiga”; katika muktadha wa kijeshi kinaweza kurejelea kushambulia au kuua.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּם
  choice: hawakuwashambulia
  rationale: Katika muktadha huu wa kijeshi, נכה inaashiria kuwashambulia kwa nguvu na huenda hata kuwaua. ‘Hawakuwashambulia’ ni Kiswahili cha kawaida kinachohifadhi tendo la uadui bila kuamua wazi kwamba matokeo yangekuwa kifo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa uwazi nahau ya Kiebrania ‘wana wa Israeli’ na bado inaeleweka katika mtindo wa kibiblia wa Kiswahili.
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: walikuwa wamewaapia
  rationale: Kauli ya wakati uliotangulia inaonyesha kuwa kiapo kilikuwa kimetolewa kabla ya uamuzi wa kutowashambulia.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: viongozi wa kusanyiko
  rationale: ‘Viongozi’ ni neno la sasa na wazi kwa נְשִׂיאִים; ‘kusanyiko’ linaonyesha jamii ya Israeli iliyokusanyika bila kuingiza muundo wa baadaye wa kanisa.
- source_word: בַּיהוָה
  choice: kwa jina la Yahwe
  rationale: Pamoja na kitenzi cha kuapa, בְּ humtaja yule ambaye kiapo kinafanywa kwa mamlaka yake. ‘Kwa jina la Yahwe’ ni usemi wa asili wa Kiswahili unaoweka wazi maana hiyo.
- source_word: וַיִּלֹּנוּ
  choice: likawanung'unikia
  rationale: לון hapa ni kunung'unika kwa pamoja dhidi ya viongozi; ‘kunung'unikia’ huhifadhi hali ya kutoridhika na mlengwa wake.
- source_word: כָל הָעֵדָה
  choice: kusanyiko lote
  rationale: Hutoa kwa kawaida nguvu ya כָל na hudumisha tafsiri ya עֵדָה ndani ya mstari.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia jina la agano יהוה. ‘Yahwe’ hulitaja kama jina badala ya kulibadili kuwa cheo.
- issue: Maana ya עֵדָה
  choice: kusanyiko
  alternative: mkutano; jumuiya
  rationale: ‘Kusanyiko’ linaonyesha watu wa Israeli kama mwili uliokusanyika, bila kuhusisha moja kwa moja taasisi maalumu ya kidini ya baadaye.
- issue: Upeo wa vurugu katika הִכּוּם
  choice: hawakuwashambulia
  alternative: hawakuwapiga; hawakuwaua
  rationale: Kitenzi kinaweza kumaanisha kupiga, kushambulia, au kuua katika muktadha wa kijeshi. Tafsiri iliyochaguliwa haifichi ukali wa tukio wala kuamua kwamba kifo ndicho maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa simulizi umefanywa wa kawaida kwa Kiswahili, huku jina Yahwe, nahau ‘wana wa Israeli,’ na mvutano wa kimaana wa kitenzi נכה vikihifadhiwa.
