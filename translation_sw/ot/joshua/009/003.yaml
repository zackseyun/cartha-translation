id: JOS.9.3
reference: Joshua 9:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/יֹשְׁבֵ֨י גִבְע֜וֹן שָׁמְע֗וּ אֵת֩ אֲשֶׁ֨ר עָשָׂ֧ה יְהוֹשֻׁ֛עַ לִֽ/ירִיח֖וֹ וְ/לָ/עָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/003.yaml
  text: But the inhabitants of Gibeon heard what Joshua had done to Jericho and to Ai[a].
translation:
  language: sw
  text: Lakini wenyeji wa Gibeoni walisikia yale ambayo Yoshua alikuwa ameyatenda kwa Yeriko na kwa Ai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na wenyeji wa Gibeoni walisikia yale ambayo Yoshua alikuwa ameyatenda kwa Yeriko na kwa Ai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יֹשְׁבֵי
  choice: Lakini wenyeji wa
  rationale: יֹשְׁבֵי ni ‘wenyeji wa’ au ‘wakaao katika.’ Kiunganishi וְ kimetafsiriwa ‘Lakini’ ili kuonyesha tofauti ya kisimulizi kati ya mwitikio wa wafalme katika mistari iliyotangulia na mwitikio tofauti wa Gibeoni.
- source_word: גִבְעוֹן
  choice: Gibeoni
  rationale: Jina la mahali limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: שָׁמְעוּ
  choice: walisikia
  rationale: Kitenzi cha qal timilifu cha שׁמע hapa kina maana ya moja kwa moja ya ‘kusikia’; uchaguzi huu unaepuka tafsiri pana zaidi kama ‘walipata habari.’
- source_word: אֵת אֲשֶׁר
  choice: yale ambayo
  rationale: Kiashiria cha shamirisho pamoja na kiwakilishi rejeshi huanzisha yaliyosikiwa; ‘yale ambayo’ ni Kiswahili cha kawaida kinachohifadhi muundo huo.
- source_word: עָשָׂה
  choice: alikuwa ameyatenda
  rationale: עָשָׂה humaanisha ‘kufanya.’ Wakati uliotangulia unaonyesha kuwa matendo hayo yalikuwa yametokea kabla ya wenyeji wa Gibeoni kuyasikia.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Jina la mtu limetoholewa kwa umbo la kawaida la Kiswahili.
- source_word: לִֽ/ירִיחוֹ
  choice: kwa Yeriko
  rationale: Kihusishi ל pamoja na עשה kinaonyesha mwelekeo wa tendo kwa mji. ‘Kwa Yeriko’ huhifadhi usemi usiofafanua zaidi kuliko chanzo kwa kutumia ‘dhidi ya Yeriko.’
- source_word: וְ/לָ/עָי
  choice: na kwa Ai
  rationale: Hii ni sambamba na ‘kwa Yeriko’; jina Ai limehifadhiwa kama jina maalumu, na ‘na kwa’ inadumisha usambamba wa Kiebrania.
theological_decisions:
- issue: Tafsiri ya kiunganishi וְ mwanzoni mwa mstari
  choice: Lakini
  alternative: Na
  rationale: Hili ni suala la mtiririko wa simulizi, si fundisho la kidini. Ingawa וְ mara nyingi ni ‘na,’ hapa simulizi linahamia kutoka mwitikio wa wafalme (9:1–2) hadi mwitikio tofauti wa Gibeoni. ‘Lakini’ huonyesha tofauti hiyo, huku tanbihi ikihifadhi uwezekano wa ‘Na.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Wenyeji’ ni la kawaida na sahihi kwa wakaaji wa mji; ‘alikuwa ameyatenda’ huhifadhi mpangilio wa wakati wa simulizi. Jina ‘Yeriko’ limetumiwa kwa umbo la kawaida la Kiswahili, huku ‘Ai’ likihifadhiwa.
