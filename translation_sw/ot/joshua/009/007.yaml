  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: ו/יאמרו אִֽישׁ יִשְׂרָאֵ֖ל אֶל הַ/חִוִּ֑י אוּלַ֗י בְּ/קִרְבִּ/י֙ אַתָּ֣ה יוֹשֵׁ֔ב וְ/אֵ֖יךְ אכרות לְ/ךָ֥ בְרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/007.yaml
  text: But the men of Israel said to the Hivite[a], “Perhaps you are living among us[b]; how then could I make a covenant with you?”
translation:
  language: sw
  text: Lakini watu wa Israeli wakamwambia Mhivi, “Labda unaishi miongoni mwetu[a]; basi, ninawezaje kufanya agano[b] nawe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “katikati yangu”; umoja huo huenda unaonyesha msemaji anayewakilisha Israeli.
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kihalisi, “kukata agano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: watu wa Israeli
  rationale: Ingawa אִישׁ ni umoja kimaumbo, hapa ina maana ya pamoja kwa wawakilishi wa Israeli. “Watu wa Israeli” ni Kiswahili cha kawaida kinachohifadhi wazo la kundi bila kudokeza kwamba mtu mmoja tu ndiye aliyesema.
- source_word: הַחִוִּי
  choice: Mhivi
  rationale: Umoja wa Kiebrania umehifadhiwa; anayesemeshwa ni mwakilishi wa kundi lake.
- source_word: אוּלַי
  choice: Labda
  rationale: “Labda” huwasilisha kwa kawaida shaka au uwezekano unaodokezwa na chembe ya Kiebrania.
- source_word: בְּקִרְבִּי
  choice: miongoni mwetu
  rationale: Kihalisi ni “katikati yangu,” lakini msemaji anawakilisha Israeli kwa pamoja. “Miongoni mwetu” huwasilisha maana ya kijamii na kijiografia kwa Kiswahili cha kawaida.
- source_word: יוֹשֵׁב
  choice: unaishi
  rationale: Kitenzi kishirikishi cha ישׁב hapa kinaonyesha kukaa au kuishi mahali kwa kuendelea; “unaishi” ni cha asili katika Kiswahili cha sasa.
- source_word: וְאֵיךְ
  choice: basi, ninawezaje
  rationale: “Basi” huonyesha matokeo ya kimantiki ya shaka iliyotangulia, huku “ninawezaje” ikihifadhi swali na nafsi ya kwanza ya umoja.
- source_word: אכרות ... בְרִית
  choice: kufanya agano
  rationale: Nahau ya Kiebrania ni kihalisi “kukata agano.” “Kufanya agano” ni usemi wazi na wa kawaida wa Kiswahili bila kupoteza dhana ya agano.
- source_word: לְךָ
  choice: nawe
  rationale: Katika muktadha wa kufanya agano, לְךָ huonyesha mshirika wa agano; “nawe” hudumisha umoja wa anayesemeshwa.
theological_decisions:
- issue: Umoja unaowakilisha kundi katika hotuba ya Israeli
  choice: Kutafsiri בְּקִרְבִּי kwa maana ya pamoja, “miongoni mwetu,” lakini kuhifadhi nafsi ya kwanza ya umoja katika “ninawezaje”
  alternative: 'Kuhifadhi umoja kila mahali: “katikati yangu ... ninawezaje,” au kuufanya wingi kila mahali: “miongoni mwetu ... tunawezaje”'
  rationale: Kiebrania kinatumia umoja wa uwakilishi kwa Israeli. Tafsiri hii inaweka wazi maana ya pamoja pale ambapo Kiswahili cha kihalisi kingekuwa kigumu, lakini pia inahifadhi badiliko la nafsi lililo katika kitenzi אכרות na mvutano wa msemaji anayeliwakilisha taifa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mhivi” huhifadhi jina la kabila katika umoja, na “nawe” hudumisha anayesemeshwa katika umoja. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyofafanuliwa.
