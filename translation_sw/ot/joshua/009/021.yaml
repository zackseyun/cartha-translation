base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/021.yaml
  text: The leaders said to them[a], “Let them live.” So they became woodcutters and water-drawers for all the congregation, just as the leaders had spoken to them.
translation:
  language: sw
  text: Viongozi wakawaambia, “Waacheni waishi.” Basi wakawa wakata kuni na wateka maji kwa ajili ya kusanyiko lote, kama vile viongozi walivyokuwa wamewaambia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּשִׂיאִים
  choice: viongozi
  rationale: Katika simulizi hili neno hilo linawataja wakuu wanaotambulika wa jumuiya ya Israeli; “viongozi” ni la kawaida, wazi, na halidokezi cheo cha kifalme.
- source_word: יִחְיוּ
  choice: Waishi
  rationale: Kauli hii fupi inahifadhi nguvu ya jussive—uamuzi kwamba Wagibeoni waachwe hai—bila kuibadili kuwa taarifa ya kawaida ya wakati ujao.
- source_word: וַיִּהְיוּ
  choice: wakawa
  rationale: “Wakawa” linaonyesha mabadiliko ya hali na jukumu walilopewa, si kwamba tayari walikuwa katika hali hiyo.
- source_word: חֹטְבֵי עֵצִים
  choice: wakata kuni
  rationale: Hili ni tamko la kawaida la Kiswahili kwa watu waliopewa kazi ya kukata kuni, huku likihifadhi picha halisi ya maandishi ya Kiebrania.
- source_word: שֹׁאֲבֵי מַיִם
  choice: wateka maji
  rationale: “Kuteka maji” ni usemi wa kawaida wa Kiswahili kwa kuyachota maji kisimani au kwenye chanzo, na unaonyesha kazi endelevu.
- source_word: לְכָל הָעֵדָה
  choice: kwa ajili ya kusanyiko lote
  rationale: “Kusanyiko” linafaa kwa jumuiya ya Israeli iliyokusanyika na huhifadhi maana ya pamoja iliyo katika עֵדָה.
- source_word: כַּאֲשֶׁר דִּבְּרוּ לָהֶם
  choice: kama vile viongozi walivyokuwa wamewaambia
  rationale: Muundo huu unaonyesha kwamba hali yao ilitimiza yale ambayo viongozi walikuwa wamewaambia hapo awali.
