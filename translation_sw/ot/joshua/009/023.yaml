base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/023.yaml
  text: So now you are cursed[a], and there shall never cease to be from among you servants, cutters of wood and drawers of water for the house of my God.
translation:
  language: sw
  text: Kwa hiyo sasa mmelaaniwa, wala kamwe hawatakosekana miongoni mwenu watumwa[a], wakata kuni na wachota maji kwa ajili ya nyumba ya Mungu wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kiebrania kwa karibu zaidi: “wala mtumwa hatakatiliwa mbali kamwe kutoka miongoni mwenu.” Maana yake ni kwamba watu wao wangeendelea daima kutoa wafanyakazi kwa kazi hizi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kwa hiyo sasa
  rationale: Huonyesha mpito kutoka kwa udanganyifu uliotajwa hadi hukumu inayofuata, kwa Kiswahili cha kawaida na chenye uzito.
- source_word: אֲרוּרִים אַתֶּם
  choice: mmelaaniwa
  rationale: Kivumishi cha Kiebrania ni cha wingi na kinawahusu wote wanaoambiwa; kauli hii ya Kiswahili ni ya moja kwa moja.
- source_word: וְלֹא יִכָּרֵת מִכֶּם עֶבֶד
  choice: hatakosekana kamwe miongoni mwenu mtumwa
  rationale: Inahifadhi tamathali ya Kiebrania ya kutokatiliwa au kutoondolewa mtu kutoka miongoni mwao, pamoja na wazo la hali endelevu, bila kudokeza kwamba ni baadhi yao tu waliolaaniwa.
- source_word: עֶבֶד
  choice: mtumwa
  rationale: Hali ya kazi iliyolazimishwa na ya chini ni dhahiri katika hukumu hii; 'mtumwa' inaonyesha ukali huo kuliko 'mtumishi'.
- source_word: חֹטְבֵי עֵצִים
  choice: wakata kuni
  rationale: Ni usemi wa asili na unaoeleweka kwa kazi ya kukata mbao za kutumiwa kama kuni.
- source_word: שֹׁאֲבֵי מַיִם
  choice: wateka maji
  rationale: Hueleza kwa uwazi tendo la kuchota maji kutoka kisimani au chanzo kingine.
- source_word: לְבֵית אֱלֹהָי
  choice: kwa ajili ya nyumba ya Mungu wangu
  rationale: Nyumba hapa ni mahali patakatifu pa ibada, na tafsiri hii inabaki karibu na muundo wa Kiebrania.
theological_decisions:
- issue: Namna ya kutafsiri hali ya utumwa iliyowekwa kwa hukumu
  choice: mtumwa
  alternative: mtumishi
  rationale: Muktadha unaonyesha kazi ya kudumu iliyowekwa kwa watu waliotiishwa. 'Mtumwa' huhifadhi ukali wa עֶבֶד bila kuupunguza kuwa huduma ya hiari.
- issue: Uhusiano wa mtumwa na kazi mbili zinazofuata
  choice: mstari mrefu unaonyesha kwamba wakata kuni na wateka maji wanafafanua kazi ya mtumwa
  alternative: kutumia 'na' kana kwamba ni makundi matatu tofauti
  rationale: Muundo wa Kiebrania unaweza kusikika kama orodha, lakini kimuktadha kazi hizo zinaeleza aina ya utumishi waliowekewa. Uakifishaji huhifadhi mwendelezo huo bila kuufanya kuwa maelezo yasiyoweza kupingwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Wakata kuni' na 'wateka maji' ni maneno rahisi na halisi; 'mmelaaniwa' na 'nyumba ya Mungu wangu' hudumisha uzito wa tamko la Yoshua.
