base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/012.yaml
  text: This bread of ours was warm when we took it as our provisions from our houses on the day we set out to come to you[a], but now, look, it is dry and has become moldy.
translation:
  language: sw
  text: Mkate wetu huu ulikuwa na joto tulipouchukua kutoka nyumba zetu kuwa chakula cha safari siku tulipoondoka kuja kwenu. Lakini sasa, tazameni, umekauka na una madoadoa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umeota ukungu,” “umepasuka,” au “umekuwa wa kuvunjikavunjika.” Neno la Kiebrania hueleza kitu chenye nukta au madoa; linapotumiwa kuhusu mkate wa zamani, maana yake kamili haijulikani kwa hakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה לַחְמֵנוּ
  choice: Mkate wetu huu
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unadumisha nguvu ya kiashiria kinachoelekeza kwenye mkate waliouonyesha.
- source_word: חָם
  choice: ulikuwa bado una joto
  rationale: Hutoa maana halisi ya mkate kuwa na joto bila kuugeuza moja kwa moja kuwa ‘mpya,’ jambo ambalo ni dhana inayodokezwa tu.
- source_word: הִצְטַיַּדְנוּ אֹתוֹ
  choice: tulipouchukua ... kuwa chakula cha safari
  rationale: Kitenzi kinamaanisha kujipatia au kujitayarishia mahitaji ya safari; tafsiri hii ni wazi na ya kawaida huku ikidumisha mkate kama kitu kilichochukuliwa.
- source_word: מִבָּתֵּינוּ
  choice: kutoka nyumbani mwetu
  rationale: Ingawa Kiebrania kina wingi ‘kutoka nyumba zetu,’ Kiswahili cha kawaida hutumia ‘nyumbani mwetu’ kwa makao ya kundi bila kupoteza maana.
- source_word: בְּיוֹם צֵאתֵנוּ
  choice: siku tulipoondoka
  rationale: Inaonyesha wazi wakati ambao safari ilianza kwa lugha ya kawaida ya Kiswahili.
- source_word: לָלֶכֶת אֲלֵיכֶם
  choice: kuja kwenu
  rationale: ‘Kuja kwenu’ ni usemi wa asili kutoka kwa mtazamo wa wasemaji wanaowaambia wale waliowafikia, ingawa kitenzi cha Kiebrania kimsingi ni ‘kwenda.’
- source_word: וְעַתָּה הִנֵּה
  choice: Lakini sasa, tazameni
  rationale: ‘Lakini sasa’ huonyesha utofauti na hali ya awali, na ‘tazameni’ huhifadhi mwito wa kuelekeza fikira kwenye ushahidi uliopo.
- source_word: יָבֵשׁ
  choice: umekauka
  rationale: Hueleza kwa kawaida hali ya sasa iliyotokana na kukauka.
- source_word: וְהָיָה נִקֻּדִים
  choice: na kuwa na madoadoa
  rationale: נִקֻּדִים huelekea kumaanisha kitu chenye nukta au madoa. Chaguo hili huhifadhi taswira ya msingi na kutokuwapo kwa uhakika kama ni ukungu, mipasuko, au hali ya kuvunjikavunjika.
