base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/010.yaml
  text: and all that he did to the two kings of the Amorites who were beyond the Jordan—to Sihon king of Heshbon and to Og king of Bashan[b][a], who was at Ashtaroth—
translation:
  language: sw
  text: na yote aliyowatendea wafalme wawili wa Waamori waliokuwa ng’ambo ya Yordani[a]—Sihoni mfalme wa Heshboni, na Ogu mfalme wa Bashani, aliyekuwa huko Ashtarothi[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upande mwingine wa Yordani.”
    reason: lexical_alternative
  - marker: b
    text: Au “aliyekuwa katika Ashtarothi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: na
  rationale: Kiunganishi kinaendeleza orodha kutoka mstari uliotangulia; alama ya yambwa ya Kiebrania haihitaji kutafsiriwa moja kwa moja.
- source_word: כָּל אֲשֶׁר עָשָׂה
  choice: yote aliyowatendea
  rationale: “Yote” huonyesha ujumla wa matendo. Muundo wa Kiswahili “aliyowatendea” ni wa asili na hubeba kitenzi עשה pamoja na ל kinachoonyesha waliotendewa, bila kufafanua matendo hayo zaidi.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: wafalme wawili wa Waamori
  rationale: Huhifadhi uhusiano wa wafalme na watu wa Waamori. Wingi “Waamori” unafaa kwa jina la taifa katika Kiswahili sanifu.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: waliokuwa ng’ambo ya Yordani
  rationale: “Ng’ambo ya Yordani” ni usemi wa kawaida unaohifadhi mtazamo wa kijiografia wa chanzo bila kuamua kimyakimya ni upande gani.
- source_word: לְסִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: Sihoni mfalme wa Heshboni
  rationale: Majina yameandikwa kwa maumbo yanayoeleweka katika Kiswahili, na cheo cha kifalme kimewekwa kama kiamb apposition cha moja kwa moja.
- source_word: וּלְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: na Ogu mfalme wa Bashani
  rationale: Muundo huu unalingana na kishazi cha Sihoni na kuhifadhi Bashani kama jina la eneo.
- source_word: אֲשֶׁר בְּעַשְׁתָּרוֹת
  choice: aliyekuwa huko Ashtarothi
  rationale: Kishazi rejeshi kinaeleweka kumtambulisha Ogu kwa mahali alipokuwa. “Huko” ni Kiswahili cha asili kwa mahali palipotajwa, huku tanbihi ikihifadhi uwezekano wa “katika.”
theological_decisions:
- issue: Kiima kisichotajwa wazi cha עָשָׂה
  choice: Kiima kimeachwa katika kiambishi cha “aliyowatendea,” na muktadha humtambulisha kuwa BWANA.
  alternative: Kutaja wazi “BWANA aliyowatendea.”
  rationale: Kiebrania hakitaji jina la kiima katika mstari huu. Kulitegemeza kwa muktadha huhifadhi namna ya chanzo na kuepuka kuongeza jina la Mungu lisilotamkwa hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Mstari unaendeleza sentensi ya mstari uliotangulia, kwa hiyo umeanza kwa herufi ndogo na kumalizika kwa kistari kirefu. Alama zote za tanbihi zimewekwa katika matini kuu.
