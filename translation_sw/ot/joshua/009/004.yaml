  text: וַ/יַּעֲשׂ֤וּ גַם הֵ֨מָּה֙ בְּ/עָרְמָ֔ה וַ/יֵּלְכ֖וּ וַ/יִּצְטַיָּ֑רוּ וַ/יִּקְח֞וּ שַׂקִּ֤ים בָּלִים֙ לַ/חֲמ֣וֹרֵי/הֶ֔ם וְ/נֹאד֥וֹת יַ֨יִן֙ בָּלִ֔ים וּ/מְבֻקָּעִ֖ים וּ/מְצֹרָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/004.yaml
  text: They too acted with cunning[a], and went and made provisions, and took worn-out sacks for their donkeys, and worn-out wineskins[b], split open and patched.
translation:
  language: sw
  text: Nao pia wakatenda kwa hila; wakaenda, wakajifanya kana kwamba wametoka safari ya mbali[a], wakachukua magunia yaliyochakaa kwa ajili ya punda wao, na viriba vya divai vilivyochakaa, vilivyopasuka na kufungwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakajiandalia mahitaji ya safari”; wengine huelewa, “wakajifanya wajumbe.” Kitenzi cha Kiebrania ni kigumu na kimeeleweka kwa njia zaidi ya moja. Muktadha wa mwonekano wao wa udanganyifu unaunga mkono tafsiri kwamba walijifanya kuwa wametoka safari ya mbali.
    reason: alternative_reading
  - marker: b
    text: Au, “vilivyotiwa viraka.” Huenda neno la Kiebrania linaeleza viriba vilivyokarabatiwa kwa kuvifunga baada ya kupasuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַם הֵמָּה
  choice: Nao pia
  rationale: Huonyesha kwamba Wagibeoni nao walichukua hatua, kama wale waliotajwa kabla yao.
- source_word: בְּעָרְמָה
  choice: kwa hila
  rationale: Katika muktadha huu neno linaonyesha ujanja wenye kusudi la kudanganya; ‘kwa hila’ ni usemi wa kawaida na wenye uzito unaofaa.
- source_word: וַיִּצְטַיָּרוּ
  choice: wakajifanya wasafiri
  rationale: Kitenzi hiki ni kigumu na kimefasiriwa kwa njia tofauti. Muktadha unaonyesha kwamba walitengeneza mwonekano wa watu waliotoka safari ya mbali, hivyo tafsiri hii inaeleza tendo lao kwa Kiswahili cha asili bila kuficha ugumu wa neno; njia nyingine zimehifadhiwa katika tanbihi.
- source_word: שַׂקִּים בָּלִים
  choice: magunia yaliyochakaa
  rationale: ‘Magunia’ yanafaa kwa mifuko mikubwa iliyobebwa na punda, na ‘yaliyochakaa’ huonyesha kuharibika kwa sababu ya matumizi au umri, si kuwa ya zamani tu.
- source_word: לַחֲמוֹרֵיהֶם
  choice: kwa ajili ya punda wao
  rationale: Huonyesha kuwa magunia hayo yalikuwa ya kutumiwa na kubebwa na punda wao.
- source_word: נֹאדוֹת יַיִן בָּלִים
  choice: viriba vya divai vilivyochakaa
  rationale: ‘Viriba vya divai’ ni jina la kawaida la vyombo vya ngozi vilivyotumiwa kuhifadhi divai; kivumishi huhifadhi hali yake ya kuchakaa.
- source_word: מְבֻקָּעִים
  choice: vilivyopasuka
  rationale: Kitenzi cha Kiebrania huonyesha kugawanyika au kupasuka kwa chombo cha ngozi.
- source_word: מְצֹרָרִים
  choice: vilivyofungwa
  rationale: Neno linaelekea kueleza viriba vilivyofungwa au kubanwa ili kurekebisha sehemu zilizopasuka; tafsiri ya moja kwa moja ‘vilivyofungwa’ huhifadhi picha hiyo.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umewekwa wazi na wa asili; istilahi ‘magunia’ na ‘viriba vya divai’ zinaeleweka katika mazingira ya safari ya kale. Tanbihi zinahifadhi utata halisi wa וַיִּצְטַיָּרוּ na maana inayowezekana ya מְצֹרָרִים.
