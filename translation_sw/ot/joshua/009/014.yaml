base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/014.yaml
  text: So the men took some of their provisions[a], but did not ask for the counsel of Yahweh.
translation:
  language: sw
  text: Basi watu hao wakachukua baadhi ya vyakula vyao vya safari, lakini hawakuomba maelekezo kutoka kwa Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno, “kinywa cha Yahweh”; yaani, mwongozo au uamuzi wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: wakachukua
  rationale: Kitenzi לקח kwa msingi humaanisha ‘chukua.’ Muundo wa ‘waka-’ unaendeleza mtiririko wa simulizi bila kuongeza maana isiyokuwamo.
- source_word: הָאֲנָשִׁים
  choice: watu hao
  rationale: Nomino hii inamaanisha ‘watu hao’ au ‘wanaume hao.’ Muktadha unaonyesha kuwa ni Waisraeli, lakini mstari huu hauwaiti wazi viongozi wala Waisraeli, hivyo tafsiri haiongezi utambulisho huo.
- source_word: מִצֵּידָם
  choice: baadhi ya vyakula vyao vya safari
  rationale: צֵיד hapa ni chakula au masurufu yaliyobebwa kwa safari. Kiambishi מִן kinaeleweka kwa maana ya sehemu, kwa hiyo ‘baadhi ya’ kinahifadhi wazo hilo kwa Kiswahili cha kawaida.
- source_word: פִּי יְהוָה
  choice: maelekezo ya Yahweh
  rationale: Kwa neno halisi ni ‘kinywa cha Yahweh,’ lakini hapa ni nahau ya uamuzi, jibu, au mwongozo unaotoka kwake. ‘Maelekezo ya Yahweh’ huwasilisha maana hiyo kwa lugha ya kawaida, huku tanbihi ikihifadhi picha halisi ya Kiebrania.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu יהוה limetoholewa kama ‘Yahweh’ badala ya kubadilishwa kuwa cheo, ili kuhifadhi jina binafsi lililo katika matini ya Kiebrania.
- source_word: לֹא שָׁאָלוּ
  choice: hawakuomba
  rationale: שׁאל humaanisha kuuliza au kuomba. Pamoja na ‘maelekezo,’ ‘hawakuomba’ ni Kiswahili cha asili kinachoonyesha kuwa hawakutafuta mwongozo wa Mungu.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahweh
  alternative: BWANA au Yehova
  rationale: Matini ina jina la agano יהוה, kwa hiyo ‘Yahweh’ hulihifadhi kama jina badala ya kulibadilisha kuwa cheo.
- issue: Nahau פִּי יְהוָה
  choice: maelekezo ya Yahweh
  alternative: kinywa cha Yahweh; neno la Yahweh; shauri la Yahweh
  rationale: ‘Kinywa cha Yahweh’ ndiyo tafsiri ya neno kwa neno, lakini katika muktadha huu nahau inahusu kutafuta jibu au uamuzi wake. ‘Maelekezo’ hutoa maana hiyo bila kuifanya kuwa amri mahsusi; tanbihi inadumisha picha na uwezekano wa maana za matini chanzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Vyakula vyao vya safari’ ni wazi zaidi kwa wasomaji wa kawaida kuliko ‘masurufu,’ na ‘watu hao’ huepuka kuongeza kwamba walikuwa viongozi, jambo ambalo halijasemwa moja kwa moja katika kishazi hiki.
