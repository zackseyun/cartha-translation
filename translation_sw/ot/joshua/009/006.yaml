source:
  edition: WLC
  text: וַ/יֵּלְכ֧וּ אֶל יְהוֹשֻׁ֛עַ אֶל הַֽ/מַּחֲנֶ֖ה הַ/גִּלְגָּ֑ל וַ/יֹּאמְר֨וּ אֵלָ֜י/ו וְ/אֶל אִ֣ישׁ יִשְׂרָאֵ֗ל מֵ/אֶ֤רֶץ רְחוֹקָה֙ בָּ֔אנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/006.yaml
  text: They went to Joshua at the camp at Gilgal and said to him and to the men of Israel[a], “We have come from a distant land; so now make a covenant with us.”
translation:
  language: sw
  text: Wakaenda kwa Yoshua katika kambi huko Gilgali, wakawaambia Yoshua na wanaume wa Israeli, “Tumetoka nchi ya mbali; basi sasa fanyeni agano[a] nasi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fanyeni mkataba nasi.” Nahau ya Kiebrania ikitafsiriwa neno kwa neno ni “kateni agano nasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Wakaenda
  rationale: Kitenzi הלך kwa kawaida humaanisha kwenda au kutembea. “Wakaenda” kinaendeleza mfuatano wa simulizi bila kuongeza mtazamo wa kufika uliomo tayari katika virai vinavyofuata.
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּל
  choice: kwa Yoshua kwenye kambi huko Gilgali
  rationale: Kurudiwa kwa אֶל kunaonyesha walielekea kwa Yoshua na kwenye kambi. Muundo huu ni wa kawaida katika Kiswahili na unatofautisha mtu waliyemwendea na mahali alipokuwa.
- source_word: הַמַּחֲנֶה
  choice: kambi
  rationale: מַחֲנֶה ni kambi au mahali pa kupiga kambi; “kambi” ni neno la sasa, wazi, na linalofaa muktadha huu.
- source_word: וַיֹּאמְרוּ
  choice: wakamwambia
  rationale: אָמַר ni kitenzi cha kawaida cha kusema. “Wakamwambia” huonyesha kwa kawaida kwamba maneno yaliyofuata yalielekezwa kwa Yoshua na wawakilishi wa Israeli.
- source_word: אֵלָיו וְאֶל אִישׁ יִשְׂרָאֵל
  choice: Yoshua pamoja na wanaume wa Israeli
  rationale: אִישׁ יִשְׂרָאֵל ni muundo wa umoja wenye maana ya kijumla unaowarejelea wanaume au wawakilishi wa Israeli. Jina “Yoshua” limerudiwa badala ya kiwakilishi ili sentensi iwe wazi na ya kawaida katika Kiswahili, huku “wanaume” ikihifadhi alama ya kiume ya אִישׁ.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: nchi ya mbali
  rationale: אֶרֶץ inaweza kumaanisha nchi au ardhi, na רְחוֹקָה humaanisha ya mbali. “Nchi ya mbali” ni usemi wa kawaida unaohifadhi dai lao la umbali wa kijiografia.
- source_word: בָּאנוּ
  choice: Tumetoka
  rationale: Ingawa kitenzi cha Kiebrania ni “tumekuja,” Kiswahili kwa kawaida hueleza mahali pa asili kwa “tumetoka nchi ya mbali.” Chaguo hili linawasilisha matokeo ya tendo lililokamilika na dai lao la mahali walikotoka bila kubadili maana.
- source_word: וְעַתָּה
  choice: basi sasa
  rationale: וְעַתָּה huanzisha hitimisho au ombi linalotokana na kauli iliyotangulia. “Basi sasa” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: fanyeni agano nasi
  rationale: כרת ברית ni nahau yenye maana ya kufanya agano. Tafsiri ya neno kwa neno “kateni agano” si ya kawaida katika Kiswahili cha sasa; “fanyeni agano nasi” ni wazi na huhifadhi neno muhimu בְרִית.
theological_decisions:
- issue: Tafsiri ya בְרִית katika muktadha wa makubaliano ya kisiasa
  choice: agano
  alternative: mkataba
  rationale: Ingawa muktadha ni wa kidiplomasia, בְרִית ndilo neno la kawaida la Biblia kwa agano. “Agano” hudumisha ulinganifu wa istilahi bila kuondoa maana ya kisiasa; “mkataba” limetajwa katika tanbihi kama maana mbadala inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi na hadhi inayofaa maandiko. “Tumetoka nchi ya mbali” limetumiwa kwa uasilia wa Kiswahili badala ya tafsiri ngumu “tumekuja kutoka nchi ya mbali.” Alama ya tanbihi imewekwa baada ya “agano,” neno linalohusika moja kwa moja na tanbihi.
