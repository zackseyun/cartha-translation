  text: וְ/עַתָּ֖ה הִנְ/נ֣וּ בְ/יָדֶ֑/ךָ כַּ/טּ֨וֹב וְ/כַ/יָּשָׁ֧ר בְּ/עֵינֶ֛י/ךָ לַ/עֲשׂ֥וֹת לָ֖/נוּ עֲשֵֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/025.yaml
  text: And now[a], here we are in your hand. Do to us as it is good and right in your eyes to do.
translation:
  language: sw
  text: Na sasa, tuko hapa mkononi mwako. Ututendee kama ilivyo mema na sawa machoni pako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa lugha ya kawaida zaidi, “Ututendee kama unavyoona kuwa ni vyema na sawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Na sasa
  rationale: Inahifadhi kiunganishi וְ pamoja na alama ya wakati עַתָּה, ambayo inaleta kauli yao ya sasa ya kujisalimisha.
- source_word: הִנְנוּ
  choice: tuko hapa
  rationale: Ni usemi wa kuonyesha uwepo wao mbele ya Yoshua; “tuko hapa” ni wa kawaida na unaeleweka kuliko “tazama, sisi.”
- source_word: בְיָדֶךָ
  choice: mkononi mwako
  rationale: Inadumisha sitiari ya Kiebrania ya kuwa chini ya mamlaka au uwezo wa mtu mwingine, nayo inaeleweka katika Kiswahili.
- source_word: כַּטּוֹב וְכַיָּשָׁר
  choice: yaliyo mema na yaliyo sawa
  rationale: Inawakilisha moja kwa moja sifa טוֹב na יָשָׁר bila kuzifanya kuwa “bora” au kuingiza maelezo ya ziada.
- source_word: בְּעֵינֶיךָ
  choice: machoni pako
  rationale: Inahifadhi nahau ya Kiebrania ya tathmini au uamuzi; tanbihi inatoa namna ya kawaida zaidi ya Kiswahili.
- source_word: לַעֲשׂוֹת לָנוּ עֲשֵׂה
  choice: Tutendee
  rationale: Kitenzi hiki kinaonyesha wazi kitendo kinachofanywa kwao. Kiswahili hakiwezi kurudia kwa urahisi muundo wa kitenzi-jina pamoja na amri wa Kiebrania bila kuwa kizito, hivyo amri “Tutendee” inaleta nguvu ya ombi kwa ufupi.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri inadumisha sitiari za “mkononi” na “machoni” katika matini kuu, huku tanbihi ikitoa usemi wa kawaida zaidi.
