- from: Na sasa, tuko hapa mkononi mwako. Tutendee yaliyo mema na yaliyo sawa machoni pako.[a]
  to: Na sasa, tuko hapa mkononi mwako. Ututendee kama ilivyo mema na sawa machoni pako.[a]
  rationale: Added 'kama' to represent the Hebrew comparative prefix and changed the request to the explicit second-person form 'Ututendee.' This preserves the force of the imperative/request, maintains the hand and eyes metaphors in the main text, and avoids implying merely that Joshua should perform good actions for them.
