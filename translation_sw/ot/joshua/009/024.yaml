  text: וַ/יַּעֲנ֨וּ אֶת יְהוֹשֻׁ֜עַ וַ/יֹּאמְר֗וּ כִּי֩ הֻגֵּ֨ד הֻגַּ֤ד לַ/עֲבָדֶ֨י/ךָ֙ אֵת֩ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ לָ/תֵ֤ת לָ/כֶם֙ אֶת כָּל הָ/אָ֔רֶץ וּ/לְ/הַשְׁמִ֛יד אֶת כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶ֑ם וַ/נִּירָ֨א מְאֹ֤ד לְ/נַפְשֹׁתֵ֨י/נוּ֙ מִ/פְּנֵי/כֶ֔ם וַֽ/נַּעֲשֵׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/024.yaml
  text: 'They answered Joshua and said[a], “Because it was clearly told to your servants what Yahweh your God commanded his servant Moses: to give you all the land and to destroy all the inhabitants of the land before you. So we feared greatly for our lives because of you, and we did this thing.”'
translation:
  language: sw
  text: 'Wakamjibu Yoshua, wakasema, “Kwa maana sisi watumishi wako tuliambiwa kwa hakika[a] yale ambayo Yahwe Mungu wako alimwamuru Musa mtumishi wake: awape nchi yote na awaangamize wakaaji wote wa nchi mbele yenu. Kwa hiyo tulihofia sana uhai wetu kwa sababu yenu, nasi tukafanya jambo hili.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tuliambiwa bila shaka.” Kiebrania kinatumia kitenzi kisicho na ukomo pamoja na kitenzi kamili ili kutia mkazo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת־יְהוֹשֻׁעַ וַיֹּאמְרוּ
  choice: Wakamjibu Yoshua, wakasema
  rationale: Inahifadhi mfuatano wa vitenzi vya simulizi na utangulizi wa jibu, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: כִּי
  choice: Kwa maana
  rationale: Hapa neno hili linaanzisha sababu ya tendo la Wagibeoni; ‘Kwa maana’ linaunganisha jibu lao na maelezo yanayofuata.
- source_word: הֻגֵּד הֻגַּד
  choice: tuliambiwa kwa hakika
  rationale: Muundo wa kitenzi kisoukomo pamoja na kitenzi kamili cha mzizi נגד unasisitiza kwamba habari hiyo waliambiwa kwa uhakika. Kiswahili cha nafsi ya kwanza kinapatana na kujitaja kwao kama ‘watumishi wako’.
- source_word: לַעֲבָדֶיךָ
  choice: sisi watumishi wako
  rationale: Huu ni usemi wa kujishusha katika mazungumzo ya kidiplomasia, si lazima dai la hali ya utumwa.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahwe Mungu wako
  rationale: Linahifadhi jina la agano lililo katika maandishi ya Kiebrania pamoja na uhusiano wa ‘Mungu wako’.
- source_word: לָתֵת לָכֶם אֶת־כָּל־הָאָרֶץ
  choice: awape nchi yote
  rationale: Linawasilisha kwa ufupi na kwa kawaida kusudi au yaliyomo katika amri kuhusu kupewa nchi.
- source_word: וּלְהַשְׁמִיד אֶת־כָּל־יֹשְׁבֵי הָאָרֶץ
  choice: na kuwaangamiza wakaaji wote wa nchi
  rationale: ‘Kuwaangamiza’ linaendeleza uzito wa השמיד bila kupunguza ukali wake; ‘wakaaji’ ni Kiswahili cha sasa na kinachoeleweka.
- source_word: מִפְּנֵיכֶם
  choice: mbele yenu
  rationale: Katika kauli ya kuwaangamiza wakaaji, msemo huu unaonyesha kuondolewa kwao kutoka mbele ya Israeli au katika njia ya mwendo wao.
- source_word: וַנִּירָא מְאֹד לְנַפְשֹׁתֵינוּ
  choice: tulihofia sana uhai wetu
  rationale: Linatoa maana ya hofu kubwa kwa ajili ya kuokoa maisha, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: וַנַּעֲשֵׂה אֶת־הַדָּבָר הַזֶּה
  choice: nasi tukafanya jambo hili
  rationale: Linahifadhi hitimisho la moja kwa moja la sababu yao na mwendelezo wa simulizi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yanatumia moja kwa moja jina la Mungu יהוה; ‘Yahwe’ linahifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Ukali wa amri ya השמיד
  choice: kuwaangamiza
  alternative: kuwaondoa; kuwafutilia mbali
  rationale: ‘Kuwaangamiza’ linadumisha nguvu na mvutano wa kauli ya Kiebrania bila kuipunguza wala kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa msomaji wa kawaida. Mfuatano wa kauli umehifadhiwa, na msisitizo wa Kiebrania umeonyeshwa katika maandishi pamoja na tanbihi.
