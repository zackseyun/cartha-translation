  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהֻמֵּ֤/ם יְהוָה֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּכֵּ֥/ם מַכָּֽה גְדוֹלָ֖ה בְּ/גִבְע֑וֹן וַֽ/יִּרְדְּפֵ֗/ם דֶּ֚רֶךְ מַעֲלֵ֣ה בֵית חוֹרֹ֔ן וַ/יַּכֵּ֥/ם עַד עֲזֵקָ֖ה וְ/עַד מַקֵּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/010.yaml
  text: And Yahweh threw them into confusion before Israel[a], and struck them down with a great slaughter at Gibeon, and pursued them by the way of the ascent of Beth-horon, and struck them down as far as Azekah and Makkedah.
translation:
  language: sw
  text: Yahwe akawatia katika fadhaa mbele ya Israeli[a], akawapiga pigo kubwa huko Gibeoni, akawafuatia kwa njia ya kupanda Beth-Horoni, na akawapiga hadi Azeka na Makeda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawatia katika hofu kuu” au “akawavuruga.” Kitenzi cha Kiebrania humaanisha kusababisha fadhaa, hofu, au vurugu vitani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהֻמֵּם
  choice: akawatia katika vurugu
  rationale: Kitenzi המם katika muktadha wa vita humaanisha kusababisha hofu, taharuki, au vurugu. Kauli hii inahifadhi usababishaji wa Yahwe bila kuifupisha kuwa matokeo tu ya kuwashinda.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu יהוה limetoholewa moja kwa moja kwa umbo la kawaida la Kiswahili, badala ya kubadilishwa na cheo.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: mbele ya Israeli
  rationale: Inahifadhi nahau ya Kiebrania, ambayo katika muktadha huu inaweza kumaanisha mbele ya jeshi la Israeli au machoni pao.
- source_word: וַיַּכֵּם מַכָּה גְדוֹלָה
  choice: akawaua wengi sana
  rationale: Katika simulizi la vita, נכה pamoja na מַכָּה גְדוֹלָה huonyesha pigo kubwa lenye vifo vingi. Kiswahili hiki ni cha kawaida na kinaonyesha ukali wa mauaji bila nahau ngumu ya 'pigo kubwa.'
- source_word: בְּגִבְעוֹן
  choice: huko Gibeoni
  rationale: Kiambishi בְּ kinataja mahali pa tukio; 'huko' ni cha asili katika masimulizi ya Kiswahili.
- source_word: וַיִּרְדְּפֵם
  choice: akawafuatia
  rationale: רדף ni kuwafuatia maadui wanaokimbia; uchaguzi huu unafaa muktadha wa kijeshi.
- source_word: דֶּרֶךְ מַעֲלֵה בֵית חוֹרֹן
  choice: katika njia inayopanda kwenda Beth-Horoni
  rationale: Inahifadhi maelezo ya kijiografia kwamba ilikuwa njia ya mteremko wa kupanda kuelekea Beth-Horoni, kwa Kiswahili kinachoeleweka.
- source_word: וַיַּכֵּם עַד עֲזֵקָה וְעַד מַקֵּדָה
  choice: akaendelea kuwaua mpaka Azeka na Makeda
  rationale: Kurudiwa kwa נכה kunaonyesha mashambulizi yaliyoendelea wakati wa kuwafuatia. 'Mpaka' huonyesha kiwango cha kijiografia kinachotajwa na עַד.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Chanzo kinatumia jina binafsi יהוה. 'Yahwe' hulihifadhi kama jina badala ya kulibadilisha kuwa cheo, huku likifuata umbo linalotumika kwa kawaida katika Kiswahili.
- issue: Mtendaji wa vitenzi vinavyofuata
  choice: Yahwe anaendelea kuwa mtendaji wa 'akawaua,' 'akawafuatia,' na 'akaua'
  alternative: Israeli au Yoshua kuwa mtendaji wa vitenzi hivyo
  rationale: Mfuatano wa vitenzi vya umoja wa kiume katika Kiebrania unaendeleza kiima kilichotajwa, יהוה. Tafsiri haibadili kiima kimya kimya kuwa jeshi la Israeli.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Majina ya mahali yametoholewa kwa maumbo Gibeoni, Beth-Horoni, Azeka, na Makeda. Alama ya tanbihi [a] imewekwa mara tu baada ya kishazi kinachohusika.
