base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/004.yaml
  text: Come up to me and help me[a], and let us strike Gibeon[b], because it has made peace with Joshua and with the sons of Israel.
translation:
  language: sw
  text: Pandeni mje kwangu mnisaidie, nasi tuushambulie Gibeoni, kwa sababu imefanya amani[a] na Yoshua na wana wa Israeli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imefanya agano la amani.” Kitenzi cha Kiebrania kinaweza kumaanisha kuingia katika uhusiano wa amani au kufanya mkataba wa amani.
    reason: lexical_alternative
  - marker: b
    text: 'Au, “Waisraeli” au “watu wa Israeli.” Kiebrania: “wana wa Israeli.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֽוּ אֵלַי
  choice: Pandeni mje kwangu
  rationale: Kauli ya kuamuru katika wingi kutoka עלה pamoja na אֵלַי inaonyesha mwendo wa kupanda kuelekea kwa msemaji. Kiswahili cha “Pandeni mje kwangu” kinahifadhi mwelekeo huo kwa njia ya kawaida na inayoeleweka.
- source_word: וְעִזְרֻנִי
  choice: mnisaidie
  rationale: Ni ombi la moja kwa moja kwa watu wengi wampe msemaji msaada; umbo la Kiswahili linaonyesha wingi wa wanaoamriwa na nafsi ya kwanza kama mtendewa.
- source_word: וְנַכֶּה
  choice: nasi tuushambulie
  rationale: Umbo hili lina nguvu ya hiari katika nafsi ya kwanza wingi. Katika muktadha wa kijeshi, “tuushambulie” ni Kiswahili cha kawaida kuliko tafsiri halisi ya “tuupige,” huku likihifadhi pendekezo la hatua ya pamoja.
- source_word: אֶת גִּבְעוֹן
  choice: Gibeoni
  rationale: Jina la mji limeandikwa kwa umbo lililozoeleka katika Kiswahili; kiambishi cha ngeli katika “tuushambulie” kinaurejelea mji.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya ombi, na “kwa sababu” kinaweka wazi uhusiano huo wa kisababishi.
- source_word: הִשְׁלִימָה
  choice: umefanya amani
  rationale: Hifili timilifu ya שלם katika muktadha wa kidiplomasia inaeleza kuingia katika uhusiano wa amani au amani ya mkataba. “Umefanya amani” huhifadhi maana pana bila kuibana kuwa muungano rasmi pekee.
- source_word: אֶת יְהוֹשֻׁעַ וְאֶת בְּנֵי יִשְׂרָאֵל
  choice: na Yoshua na wana wa Israeli
  rationale: Katika nahau hii, אֶת hutambulisha washirika wa amani. “Wana wa Israeli” huhifadhi picha ya kifamilia ya בני ישראל, ingawa hapa inawalenga Waisraeli kama taifa.
theological_decisions:
- issue: Uwasilishaji wa בני ישראל
  choice: wana wa Israeli
  alternative: Waisraeli; watu wa Israeli
  rationale: “Wana wa Israeli” huhifadhi usemi wa Kiebrania na picha yake ya kifamilia. Katika muktadha huu usemi huo unawahusu Waisraeli kwa ujumla, jambo linaloelezwa katika tanbihi ili kuzuia kueleweka kuwa wanaume pekee.
- issue: Maana ya הִשְׁלִימָה katika uhusiano wa Gibeoni na Israeli
  choice: umefanya amani
  alternative: umefanya agano la amani; umeungana kwa mkataba
  rationale: Kitenzi kinaweza kuhusisha amani ya kimkataba, lakini maandishi yenyewe yanaacha upana fulani kati ya kufanya amani na kuingia katika uhusiano wa mkataba. Tafsiri kuu inahifadhi upana huo, huku tanbihi ikionyesha uwezekano wa maana ya mkataba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida. “Pandeni mje kwangu” huhifadhi wazo la kupanda kuelekea kwa msemaji; “tuushambulie” huwasilisha kwa uwazi hatua ya kijeshi. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
