base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/023.yaml
  text: 'And they did so, and brought out to him from the cave these five kings: the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon.'
translation:
  language: sw
  text: 'Wakafanya hivyo, wakawatoa hawa wafalme watano pangoni, wakawaleta kwake: mfalme wa Yerusalemu, mfalme wa Hebroni, mfalme wa Yarmuthi, mfalme wa Lakishi, na mfalme wa Egloni.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Basi wakafanya hivyo
  rationale: Kauli ya kawaida ya masimulizi inayoonyesha kuwa walitekeleza agizo lililotangulia; Kiswahili hiki ni cha asili na kinadumisha mtiririko wa simulizi.
- source_word: וַיֹּצִיאוּ
  choice: wakawatoa
  rationale: Hifil ya יצא ina maana ya kusababisha watoke, yaani kuwatoa; kiambishi cha yambwa kinaeleweka kwa kurejelea wafalme watano.
- source_word: אֵלָיו
  choice: na kuwaleta kwake
  rationale: אל pamoja na kiambishi cha nafsi humaanisha moja kwa moja 'kwake'; kitenzi 'kuwaleta' kinakamilisha kwa Kiswahili cha asili wazo la kuwatoa pangoni kuelekea kwake bila kubadili maana kuwa 'mbele yake.'
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: wale wafalme watano
  rationale: Katika Kiswahili, 'wale' hurejelea kwa kawaida watu ambao tayari wametajwa katika muktadha; inadumisha nguvu ya kionyeshi cha Kiebrania bila kusikika kwa kulazimishwa.
- source_word: מִן הַמְּעָרָה
  choice: pangoni
  rationale: Locative ya Kiswahili huwasilisha kwa ufupi na kwa asili maana ya kutoka ndani ya pango, huku kitenzi 'wakawatoa' kikionyesha mwendo wa kutoka.
- source_word: מֶלֶךְ
  choice: mfalme
  rationale: Hili ndilo neno mahususi na la kawaida la Kiswahili kwa mtawala anayeitwa מֶלֶךְ.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalemu
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: חֶבְרוֹן
  choice: Hebroni
  rationale: Umbo lililozoeleka la jina hili katika Kiswahili.
- source_word: יַרְמוּת
  choice: Yarmuthi
  rationale: Uhawilishaji unaofuata matamshi ya jina la Kiebrania na mfumo wa majina uliozoeleka katika Kiswahili.
- source_word: לָכִישׁ
  choice: Lakishi
  rationale: Umbo la Kiswahili linalokaribia jina la Kiebrania.
- source_word: עֶגְלוֹן
  choice: Egloni
  rationale: Umbo la kawaida la Kiswahili; hapa ni jina la mji unaotawaliwa na mfalme huyu, si jina la mfalme wa Moabu katika Waamuzi.
