  text: וַ/יֵּאָסְפ֨וּ וַֽ/יַּעֲל֜וּ חֲמֵ֣שֶׁת מַלְכֵ֣י הָ/אֱמֹרִ֗י מֶ֣לֶךְ יְרוּשָׁלִַ֜ם מֶֽלֶךְ חֶבְר֤וֹן מֶֽלֶךְ יַרְמוּת֙ מֶֽלֶךְ לָכִ֣ישׁ מֶֽלֶךְ עֶגְל֔וֹן הֵ֖ם וְ/כָל מַֽחֲנֵי/הֶ֑ם וַֽ/יַּחֲנוּ֙ עַל גִּבְע֔וֹן וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/005.yaml
  text: So the five kings of the Amorites—the king of Jerusalem[a], the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon—gathered together and went up, they and all their armies; and they encamped against Gibeon and fought against it.
translation:
  language: sw
  text: Basi wale wafalme watano wa Waamori—mfalme wa Yerusalemu, mfalme wa Hebroni, mfalme wa Yarmuthi, mfalme wa Lakishi, na mfalme wa Egloni—wakakusanyika na kupanda, wao pamoja na majeshi yao yote[a]. Wakapiga kambi dhidi ya Gibeoni na kupigana nayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania kihalisi: “kambi zao zote.”'
    reason: 'Tofauti ya kileksika: neno la Kiebrania linaweza kumaanisha kambi na, kwa upanuzi, jeshi au kikosi kilichopiga kambi.'
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: wakakusanyika
  rationale: Kauli ya Kiebrania inaonyesha kuja pamoja kama kundi; “wakakusanyika” ni ya kawaida na haiingizi wazo la muungano rasmi lisilotajwa wazi.
- source_word: וַיַּעֲלוּ
  choice: wakapanda
  rationale: Neno עלה kimsingi humaanisha kwenda juu au kupanda. Tafsiri hii inahifadhi taswira ya chanzo bila kuamua kama kinachosisitizwa ni jiografia au mwendo wa kijeshi.
- source_word: חֲמֵשֶׁת מַלְכֵי הָאֱמֹרִי
  choice: wale wafalme watano wa Waamori
  rationale: Inahifadhi idadi na utambulisho wa kikabila uliotajwa katika Kiebrania; “wale” huunganisha kwa kawaida na muktadha uliotangulia.
- source_word: מֶלֶךְ יְרוּשָׁלִַם ... מֶלֶךְ עֶגְלוֹן
  choice: mfalme wa Yerusalemu ... mfalme wa Egloni
  rationale: Kurudia “mfalme wa” kunahifadhi namna chanzo kinavyomtaja kila mtawala mmoja mmoja.
- source_word: הֵם וְכָל מַחֲנֵיהֶם
  choice: wao pamoja na majeshi yao yote[a]
  rationale: Katika muktadha huu wa vita, מַחֲנֶה humaanisha vikosi vilivyokusanyika, hivyo “majeshi” huwasilisha maana kwa uwazi. Maana halisi ya “kambi” imehifadhiwa katika tanbihi.
- source_word: וַיַּחֲנוּ עַל גִּבְעוֹן
  choice: wakapiga kambi dhidi ya Gibeoni
  rationale: Kitendo kinachofuata cha kupigana kinaonyesha kuwa עַל hapa ina maana ya uhasama, si mahali tu; “dhidi ya” hudhihirisha uhusiano huo.
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: na kupigana nayo
  rationale: Kiwakilishi cha kike katika Kiebrania kinarejelea mji wa Gibeoni. Kiswahili hutumia ngeli ya mahali kwa jina hili, hivyo “nayo” ni ya asili na sahihi.
