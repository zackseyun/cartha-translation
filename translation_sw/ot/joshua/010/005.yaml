translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia. Muundo mrefu wa orodha umehifadhiwa, huku sentensi ikigawanywa baada ya majeshi kwa usomaji wa asili.
