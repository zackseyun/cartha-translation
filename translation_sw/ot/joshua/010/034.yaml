base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/034.yaml
  text: Then Joshua, and all Israel with him, passed on from Lachish to Eglon; and they camped against it and fought against it.
translation:
  language: sw
  text: Kisha Yoshua na Israeli wote pamoja naye wakatoka Lakishi kwenda Egloni; wakapiga kambi dhidi yake na wakapigana dhidi yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: wakatoka ... kwenda
  rationale: Katika mfululizo huu wa safari ya kijeshi, kitenzi kinaeleza kuondoka sehemu moja na kuelekea nyingine bila kudokeza kuvuka mpaka au eneo la maji.
- source_word: עִמּוֹ
  choice: pamoja na
  rationale: Kirai cha kuonyesha kuwa Israeli wote waliandamana na Yoshua; muundo huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: מִלָּכִישׁ
  choice: Lakishi
  rationale: Kiambishi מִן kinaonyesha mahali walikotoka; maana hiyo imejumuishwa katika muundo 'wakatoka Lakishi.'
- source_word: עֶגְלֹנָה
  choice: kwenda Egloni
  rationale: Herufi ya kuelekeza mwishoni mwa jina inaonyesha mwendo kuelekea Egloni; 'kwenda' huwasilisha mwelekeo huo kwa uwazi.
- source_word: וַיַּחֲנוּ
  choice: wakapiga kambi
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kueleza kuweka kambi, hasa katika mazingira ya kijeshi.
- source_word: עָלֶיהָ
  choice: dhidi ya mji huo
  rationale: Baada ya kitenzi cha kupiga kambi katika muktadha wa kuuzingira mji, עַל inaonyesha msimamo wa uhasama, si kuwa karibu tu. 'Mji huo' huweka wazi rejeleo la kiwakilishi cha kike cha Kiebrania.
- source_word: וַיִּלָּחֲמוּ
  choice: kupigana
  rationale: Kitenzi cha Niphal hapa ni usemi wa kawaida wa kushiriki vitani; 'kupigana' ni Kiswahili cha sasa na cha asili.
- source_word: עָלֶיהָ
  choice: nao
  rationale: Katika Kiswahili, 'kupigana nao' hueleza kwa kawaida mapambano dhidi ya mji na wakazi au jeshi lake, bila kurudia kirai kizito.
- source_word: וְכָל יִשְׂרָאֵל
  choice: Israeli wote
  rationale: Imedumisha jina la pamoja la watu wote wa Israeli waliokuwa pamoja na Yoshua.
