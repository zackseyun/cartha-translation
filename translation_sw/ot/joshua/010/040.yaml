id: JOS.10.40
reference: Joshua 10:40
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּכֶּ֣ה יְהוֹשֻׁ֣עַ אֶת כָּל הָ/אָ֡רֶץ הָ/הָר֩ וְ/הַ/נֶּ֨גֶב וְ/הַ/שְּׁפֵלָ֜ה וְ/הָ/אֲשֵׁד֗וֹת וְ/אֵת֙ כָּל מַלְכֵי/הֶ֔ם לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וְ/אֵ֤ת כָּל הַ/נְּשָׁמָה֙ הֶחֱרִ֔ים כַּ/אֲשֶׁ֣ר צִוָּ֔ה יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/040.yaml
  text: So Joshua struck all the land—the hill country[a], the Negev, the lowland, and the slopes—and all their kings. He left no survivor, but devoted to destruction every breathing thing, just as Yahweh, the God of Israel[b], had commanded.
translation:
  language: sw
  text: Basi Yoshua akaipiga nchi yote—nchi ya vilima, Negebu, nchi tambarare, na miteremko—na wafalme wao wote. Hakuacha yeyote aliyenusurika, bali akaweka wakfu kwa maangamizi[a] kila kilicho na pumzi, kama vile Yahwe, Mungu wa Israeli, alivyoamuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kuweka wakfu kwa maangamizi” kunaweza pia kutafsiriwa “kuangamiza kabisa” au “kuweka chini ya marufuku.” Kitenzi cha Kiebrania humaanisha kukitoa kitu bila kubatilishwa ili kiangamizwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה
  choice: akaipiga
  rationale: Kitenzi נכה katika muktadha wa vita humaanisha kupiga au kushinda kwa silaha. “Akaipiga” kinadumisha nguvu ya kijeshi bila kuongeza maelezo yasiyokuwamo katika kitenzi.
- source_word: כָּל הָאָרֶץ
  choice: nchi yote
  rationale: אֶרֶץ hapa ni eneo lote linalozungumziwa katika muhtasari wa kampeni, si dunia nzima.
- source_word: הָהָר
  choice: nchi ya vilima
  rationale: Katika Yoshua, neno hili hutaja eneo la kijiografia lenye vilima au milima; tafsiri hii ni wazi kwa msomaji wa kawaida.
- source_word: הַנֶּגֶב
  choice: Negebu
  rationale: Hapa נֶגֶב ni jina la eneo kame la kusini, si mwelekeo wa kusini tu; umbo la Kiswahili “Negebu” linadumisha jina hilo la kijiografia.
- source_word: הַשְּׁפֵלָה
  choice: nchi tambarare
  rationale: שְׁפֵלָה hutaja eneo la chini kati ya nchi ya vilima na pwani; “nchi tambarare” ni lugha ya kawaida na inayoeleweka.
- source_word: הָאֲשֵׁדוֹת
  choice: miteremko
  rationale: אֲשֵׁדוֹת humaanisha miteremko au sehemu zinazoteremka, na linaendana na orodha ya maeneo ya kijiografia.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: Hakuacha yeyote aliyenusurika
  rationale: שָׂרִיד ni aliyebaki au aliyenusurika; katika muktadha wa vita, “aliyenusurika” ndilo neno la kawaida na sahihi.
- source_word: כָּל הַנְּשָׁמָה
  choice: kila kilichokuwa na pumzi
  rationale: Kiebrania husema kihalisi “kila pumzi” au kila chenye pumzi. Tafsiri hii inadumisha upana na ukali wa usemi bila kuufinyanga kuwa “kila mtu” pekee.
- source_word: הֶחֱרִים
  choice: akaweka wakfu kwa maangamizi
  rationale: חרם katika muundo huu ni kukitoa kitu bila kubatilishwa ili kiangamizwe. Usemi huu unadumisha maana ya kidini na ya hukumu badala ya kuishusha kuwa kuua tu.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: kama vile ... alivyoamuru
  rationale: Kifungu hiki kinaonyesha kuwa Yoshua alitenda kwa kulingana na amri ya Mungu iliyotangulia.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetafsiriwa kwa unukuzi wa kawaida wa Kiswahili badala ya kubadilishwa kuwa cheo.
theological_decisions:
- issue: Lugha ya חרם katika vita
  choice: akaweka wakfu kwa maangamizi
  alternative: akaangamiza kabisa; akaweka chini ya marufuku
  rationale: Tafsiri iliyochaguliwa inadumisha maana ya tendo la kidini la kukitoa kitu kwa maangamizi yasiyoweza kubatilishwa, bila kuficha ukali wa maandishi.
- issue: Upeo wa כָּל הַנְּשָׁמָה
  choice: kila kilichokuwa na pumzi
  alternative: kila mtu; vyote vilivyokuwa na pumzi
  rationale: Usemi wa Kiebrania umeachwa ukiwa mpana badala ya kufasiriwa kimya kimya kuwa wanadamu pekee.
- issue: Uhusiano wa tendo la Yoshua na amri ya Mungu
  choice: kama vile Yahwe, Mungu wa Israeli, alivyoamuru
  alternative: kama Yahwe alivyoamuru
  rationale: Muundo unadumisha madai ya wazi ya simulizi kwamba tendo hilo lililingana na amri ya Yahwe, bila kuongeza tathmini ya kitheolojia isiyosemwa na mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye heshima na unaoeleweka. Majina “Yoshua,” “Negebu,” “Yahwe,” na “Israeli” yanafuata maumbo yanayotambulika katika Kiswahili. Alama za tanbihi [a] na [b] zimewekwa moja kwa moja baada ya vifungu vinavyofafanuliwa.
