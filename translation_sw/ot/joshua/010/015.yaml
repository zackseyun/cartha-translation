  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
translation:
  language: sw
  text: Kisha Yoshua akarudi pamoja na Israeli yote kwenye kambi huko Gilgali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Taarifa inayofanana ya kurudi Gilgali inapatikana katika Yoshua 10:43. Baadhi ya wafafanuzi huona mstari huu kuwa taarifa ya mapema au kuwa umehamishwa mahali pake katika matini, lakini hapa maandishi ya Kiebrania yametafsiriwa kama yalivyo.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Kisha ... akarudi
  rationale: Kitenzi שוב katika wayyiqtol kinaendeleza mfululizo wa simulizi na kuonyesha kurudi mahali pa awali; “Kisha ... akarudi” ni Kiswahili cha kawaida na sahihi.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Hili ndilo umbo la kawaida la jina hili katika tafsiri za Biblia za Kiswahili.
- source_word: וְכָל יִשְׂרָאֵל
  choice: pamoja na Israeli yote
  rationale: Kauli hii inadumisha maana ya pamoja ya “Israeli yote” bila kuibana iwe lazima taifa zima au wapiganaji pekee.
- source_word: עִמּוֹ
  choice: pamoja na ...
  rationale: Inawakilisha moja kwa moja maana ya kuwa pamoja naye; mpangilio wa Kiswahili unaifanya irejelee Yoshua kwa kawaida.
- source_word: אֶל הַמַּחֲנֶה
  choice: kambini
  rationale: מַחֲנֶה hapa ni kambi, huenda kambi ya kijeshi; “kambini” huonyesha kwa kawaida mwendo kuelekea ndani au kwenye kambi.
- source_word: הַגִּלְגָּלָה
  choice: huko Gilgali
  rationale: Kiambishi cha mwelekeo kwenye jina la mahali kinaonyesha mwendo kuelekea Gilgali; katika “kambini huko Gilgali,” Kiswahili kinaonyesha kambi kuwa katika eneo hilo.
theological_decisions:
- issue: Mahali pa taarifa hii katika simulizi na kufanana kwake na Yoshua 10:43
  choice: Kutafsiri maandishi ya Kimasoreti kama yalivyo bila kuoanisha wala kuondoa mstari huu.
  alternative: Baadhi ya wafafanuzi huona mstari huu kuwa taarifa tangulizi au iliyohamishwa, kwa kuwa taarifa inayofanana nayo inapatikana katika Yoshua 10:43.
  rationale: Hakuna haja ya kuamua swali la mpangilio wa kifasihi katika matini kuu. Tafsiri inapaswa kuwasilisha maandishi ya Kiebrania yaliyopokelewa huku tanbihi ikitaja suala hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa sentensi ni wa kawaida kwa Kiswahili, huku “Israeli yote” ikihifadhi maana ya jumla iliyo katika Kiebrania.
