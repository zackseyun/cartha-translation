  to: Kisha wanaume wa Gibeoni wakatuma ujumbe kwa Yoshua, kambini huko Gilgali, wakisema, “Usiache kuwasaidia watumishi wako.[a] Panda uje kwetu haraka, utuokoe na kutusaidia, kwa maana wafalme wote wa Waamori wanaoishi katika nchi ya milima wamekusanyika dhidi yetu.”
