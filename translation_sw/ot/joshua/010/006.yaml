base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/006.yaml
  text: Then the men of Gibeon sent to Joshua[a], to the camp at Gilgal, saying, “Do not withdraw your hand from your servants. Come up to us quickly, and save us and help us, for all the kings of the Amorites who live in the hill country have gathered against us.”
translation:
  language: sw
  text: Kisha wanaume wa Gibeoni wakatuma ujumbe kwa Yoshua, kambini huko Gilgali, wakisema, “Usiache kuwasaidia watumishi wako.[a] Panda uje kwetu haraka, utuokoe na kutusaidia, kwa maana wafalme wote wa Waamori wanaoishi katika nchi ya milima wamekusanyika dhidi yetu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiebrania: “Usilegeze mkono wako kutoka kwa watumishi wako,” yaani, “usiache kutusaidia” au “usituache.”'
    reason: Huhifadhi taswira ya Kiebrania ya “mkono,” ambayo haingekuwa ya kawaida katika Kiswahili cha matini kuu, na hufafanua maana ya usemi huo.
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אַנְשֵׁי גִבְעוֹן
  choice: watu wa Gibeoni wakatuma ujumbe
  rationale: Kitenzi cha simulizi kinaendeleza mfuatano wa matukio. Ingawa אַנְשֵׁי kwa umbo ni ‘wanaume wa,’ hapa inaweza kuwarejelea wawakilishi au wakazi wa mji; ‘watu wa Gibeoni’ ni Kiswahili cha kawaida bila kudai kwamba ujumbe ulitumwa na wakazi wote.
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּלָה
  choice: kwa Yoshua katika kambi huko Gilgali
  rationale: Marudio ya אֶל yanamtaja mpokeaji na mahali alikokuwa. Kiswahili hiki kinaonyesha wazi kwamba Yoshua alikuwa kambini Gilgali.
- source_word: אַל תֶּרֶף יָדֶיךָ מֵעֲבָדֶיךָ
  choice: Usiache kuwasaidia watumishi wako
  rationale: Usemi wa Kiebrania kuhusu kuulegeza au kuuondoa mkono humaanisha kuacha kutoa msaada. Tafsiri hii inaleta maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi taswira ya asili.
- source_word: עֲלֵה אֵלֵינוּ מְהֵרָה
  choice: Panda utufikie haraka
  rationale: עלה inaonyesha kupanda kutoka Gilgali kuelekea nchi ya vilima; ‘panda’ inahifadhi maelezo hayo ya kijiografia na ‘utufikie’ ni ombi la kawaida kutoka kwa wasemaji.
- source_word: וְהוֹשִׁיעָה לָּנוּ וְעָזְרֵנוּ
  choice: utuokoe na kutusaidia
  rationale: Maneno mawili tofauti ya Kiebrania, ישע na עזר, yamehifadhiwa kama ‘okoa’ na ‘saidia’ bila kuyafanya kuwa kauli maalumu ya kidini.
- source_word: כָּל מַלְכֵי הָאֱמֹרִי יֹשְׁבֵי הָהָר
  choice: wafalme wote wa Waamori wanaoishi katika nchi ya vilima
  rationale: הָהָר hapa huashiria eneo la milima au vilima, si mlima mmoja; ‘nchi ya vilima’ ni wazi na sahihi katika muktadha.
- source_word: נִקְבְּצוּ אֵלֵינוּ
  choice: wamekusanyika dhidi yetu
  rationale: Katika muktadha huu wa uhasama, אֶל ina nguvu ya kuelekea kwa nia ya kupigana; ‘dhidi yetu’ huhifadhi maana hiyo bila kuongeza maelezo yasiyotajwa.
