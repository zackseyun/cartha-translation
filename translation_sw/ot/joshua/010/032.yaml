base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/032.yaml
  text: And Yahweh gave Lachish into the hand of Israel[a], and he captured it on the second day and struck it with the edge of the sword, along with every person who was in it, just as he had done to Libnah.
translation:
  language: sw
  text: Yahwe akautia Lakishi mikononi mwa Israeli. Yoshua akauteka siku ya pili, akaupiga kwa makali ya upanga pamoja na kila mtu[a] aliyekuwa ndani yake, kama vile alivyofanya kwa Libna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kila nafsi iliyokuwa ndani yake,” nahau yenye maana ya kila mtu aliyekuwa mjini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina la agano la Mungu kwa umbo la kawaida na linalosomeka kwa Kiswahili.
- source_word: וַיִּתֵּן ... בְּיַד
  choice: akautia ... mkononi mwa
  rationale: Nahau hii ina maana ya kukabidhi kitu chini ya mamlaka ya mwingine; tafsiri hii inadumisha taswira ya Kiebrania na inaeleweka kwa Kiswahili.
- source_word: לָכִישׁ
  choice: Lakishi
  rationale: Ni uhawilishaji wa kawaida wa jina hili la mahali katika Kiswahili.
- source_word: וַיִּלְכְּדָהּ
  choice: akauteka
  rationale: Kitenzi hiki ni istilahi ya kijeshi ya kuutwaa mji kwa nguvu.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: siku ya pili
  rationale: Inahifadhi kwa usahihi taarifa ya mpangilio wa wakati badala ya kuibadili kuwa 'siku iliyofuata.'
- source_word: וַיַּכֶּהָ
  choice: kuupiga
  rationale: Inadumisha nguvu pana ya kitenzi נכה na kiambishi chake kinachourejelea mji, bila kukifafanua kupita kiasi.
- source_word: לְפִי חֶרֶב
  choice: kwa makali ya upanga
  rationale: Hutoa maana ya nahau ya Kiebrania, kihalisi 'kwa kinywa cha upanga,' huku ikihifadhi taswira yake.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: kila mtu aliyekuwa ndani yake
  rationale: Katika muktadha huu נֶפֶשׁ humaanisha mtu aliye hai, si 'nafsi' kama sehemu isiyo ya mwili.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלִבְנָה
  choice: kama vile alivyokuwa ameufanyia Libna
  rationale: Inawasilisha ulinganisho na tukio lililotangulia na kudumisha kitenzi cha umoja cha Kiebrania.
theological_decisions:
- issue: Kauli ya ushindi inayoeleza kuuawa kwa wakazi
  choice: pamoja na kila mtu aliyekuwa ndani yake
  alternative: pamoja na kila nafsi iliyokuwa ndani yake
  rationale: Hapa נֶפֶשׁ linarejelea watu hai kwa ujumla. 'Kila mtu' huepuka kuingiza mgawanyo wa mwili na nafsi usiokusudiwa na andiko, bila kupunguza ukali wa simulizi.
- issue: Mtendaji wa vitenzi baada ya Yahwe kuutia mji mkononi mwa Israeli
  choice: Yoshua akauteka ... kama vile alivyokuwa ameufanyia Libna
  alternative: akauteka ... kama vile alivyokuwa ameufanyia Libna
  rationale: Kiebrania kina vitenzi vya umoja, na mtiririko mpana wa simulizi humwelekeza msomaji kwa Yoshua kama kiongozi mwakilishi. Kutaja Yoshua kunazuia Kiswahili kisieleweke kana kwamba Yahwe ndiye aliyefanya tendo hilo moja kwa moja, huku umoja wa chanzo ukihifadhiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umegawanywa baada ya tendo la Yahwe ili mlolongo wa matendo ya kijeshi usomeke kwa urahisi; taswira kuu za Kiebrania zimehifadhiwa pale zinapoeleweka kwa Kiswahili.
