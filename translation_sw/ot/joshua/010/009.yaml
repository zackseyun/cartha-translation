  text: So Joshua came upon them suddenly[b][a], having marched up from Gilgal all night.
translation:
  language: sw
  text: Basi Yoshua akawafikia ghafula[a], baada ya kupanda kutoka Gilgali usiku kucha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawajia ghafula.” Kitenzi cha Kiebrania kwa maana halisi ni “akaja,” na mazingira ya kijeshi yanaonyesha kwamba aliwafikia maadui kwa kushtukiza.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “alipanda kutoka Gilgali usiku kucha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: akawafikia
  rationale: Kitenzi בוא pamoja na אֶל kimsingi kina maana ya kuja au kuelekea kwao. Katika simulizi hili la kijeshi, “akawafikia” huonyesha kuwa Yoshua aliwasili walipokuwa bila kuongeza wazi kwamba mapigano yalikuwa yameanza.
- source_word: פִּתְאֹם
  choice: ghafula
  rationale: “Ghafula” ni neno la kawaida na la moja kwa moja linaloonyesha ujio wa kushtukiza au usiotarajiwa.
- source_word: כָּל הַלַּיְלָה
  choice: usiku kucha
  rationale: Hii ni kauli ya asili ya Kiswahili inayoonyesha muda wote wa usiku.
- source_word: עָלָה
  choice: akiwa amepanda
  rationale: עלה humaanisha kwenda au kupanda juu. “Akiwa amepanda” huhifadhi mwelekeo wa kupanda na kuonyesha kuwa safari hiyo ilitangulia kuwasili kwake.
- source_word: מִן הַגִּלְגָּל
  choice: kutoka Gilgali
  rationale: Kirai kinaonyesha mahali safari ilipoanzia; “Gilgali” ni umbo la jina la mahali lililozoeleka katika Kiswahili cha Biblia.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Hili ni umbo la kawaida la Kiswahili la jina hili la mtu.
