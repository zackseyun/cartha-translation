review_pass:
  verdict: revise
  source_fidelity: Main clause accurately conveys Joshua's sudden arrival to/among the opposing force. The source's עלה ('went up') and the all-night duration should be retained without the potentially ambiguous construction 'akiwa amepanda.'
  naturalness: '''Akiwa amepanda'' is less idiomatic here and can suggest a state of having climbed or being mounted, rather than an all-night ascent preceding the arrival. ''Baada ya kupanda ... usiku kucha'' is clear, natural Standard East African Swahili.'
  terminology: Yoshua and Gilgali are established Swahili biblical forms. 'Ghafula' and 'usiku kucha' are apt and appropriately direct.
  issues:
  - severity: medium
    issue: Circumstantial phrase 'akiwa amepanda kutoka Gilgali usiku kucha' is awkward and aspectually unclear.
    rationale: The Hebrew states that Joshua went up from Gilgal all night. In Swahili, 'akiwa amepanda' can describe a resultant state rather than sustained nighttime travel. Recasting it as a preceding action preserves the narrative relationship and the duration clearly.
  revised_text: Basi Yoshua akawafikia ghafula[a], baada ya kupanda kutoka Gilgali usiku kucha.[b]
