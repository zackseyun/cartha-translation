  yaml_path: translation/ot/joshua/010/038.yaml
  text: Then Joshua[a], and all Israel with him, returned to Debir and fought against it.
translation:
  language: sw
  text: Kisha Yoshua akarudi Debiri pamoja na Israeli wote waliokuwa naye, akapigana na mji huo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: wakarudi
  rationale: Kitenzi שוב katika usimulizi huu kinaonyesha kurudi mahali; “wakarudi” ni Kiswahili cha kawaida na pia kinakubaliana na Yoshua pamoja na Israeli waliokuwa naye.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Biblia za Kiswahili.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: na Israeli wote waliokuwa pamoja naye
  rationale: Tafsiri hii inahifadhi wazo la jumuiya yote ya Israeli iliyofuatana na Yoshua, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: דְּבִרָה
  choice: Debiri
  rationale: Herufi ya mwelekeo -ה inaonyesha mwendo kuelekea Debiri; baada ya “wakarudi,” Kiswahili huonyesha lengo hilo moja kwa moja bila kulazimika kutumia “kwenda.”
- source_word: וַיִּלָּחֶם
  choice: wakapigana
  rationale: Kitenzi לחם hapa kina maana ya kuingia vitani; “wakapigana” ni cha moja kwa moja na kinaendeleza mtiririko wa usimulizi.
- source_word: עָלֶיהָ
  choice: na mji huo
  rationale: Kiwakilishi cha kike cha Kiebrania kinarejelea Debiri kama mji. Kiswahili cha kawaida hutumia “mji huo,” na muundo “kupigana na” unaonyesha kupigana dhidi yake bila kuiga jinsia ya kisarufi ya Kiebrania.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi mfululizo “wakarudi … wakapigana” unafaa usimulizi wa kihistoria. “Israeli wote” imehifadhiwa kama usemi wa kijumuiya bila kuufafanua zaidi kuwa jeshi, kwa kuwa ufafanuzi huo haujasemwa moja kwa moja katika mstari.
