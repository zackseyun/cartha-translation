  yaml_path: translation/ot/joshua/010/017.yaml
  text: And it was reported to Joshua[a], saying, “The five kings have been found hidden in the cave at Makkedah.”
translation:
  language: sw
  text: 'Yoshua akaarifiwa hivi: “Wale wafalme watano wamepatikana wakiwa wamejificha[a] pangoni huko Makeda.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakiwa wamefichika.” Kishirikishi cha Kiebrania kinaweza kusisitiza tendo la kujificha au hali ya kuwa mafichoni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לִיהוֹשֻׁעַ
  choice: Yoshua akaarifiwa
  rationale: Kauli tendwa ya kitenzi cha kutoa habari imetafsiriwa kwa njia ya kawaida ya Kiswahili huku mhusika aliyetoa taarifa akiachwa bila kutajwa, kama ilivyo katika Kiebrania.
- source_word: לֵאמֹר
  choice: 'hivi:'
  rationale: Neno hili linatanguliza yaliyosemwa. Katika Kiswahili cha sasa, “hivi:” ni kiunganishi cha masimulizi kilicho cha asili zaidi kuliko tafsiri halisi ya “akisema” baada ya kauli tendwa.
- source_word: נִמְצְאוּ
  choice: wamepatikana
  rationale: Kauli tendwa ya wingi imehifadhiwa; hali timilifu inaonyesha ugunduzi uliokuwa umetokea karibuni na sasa unaripotiwa.
- source_word: חֲמֵשֶׁת הַמְּלָכִים
  choice: wale wafalme watano
  rationale: “Wale” huonyesha kuwa ni wafalme waliokwisha tajwa katika muktadha, kama matumizi ya nomino yenye uainishaji katika Kiebrania.
- source_word: נֶחְבְּאִים
  choice: wakiwa wamejificha
  rationale: Umbo la kishirikishi linaeleza hali au tendo lao walipopatikana. “Wakiwa wamejificha” ni Kiswahili cha kawaida na huhifadhi maana ya kuwa mafichoni bila kudai kwamba mtu mwingine aliwaficha.
- source_word: בַּמְּעָרָה
  choice: pangoni
  rationale: Hili ndilo umbo la mahali la “pango” na linaeleza moja kwa moja walikopatikana.
- source_word: בְּמַקֵּדָה
  choice: huko Makeda
  rationale: Jina la mahali limetoholewa kuwa “Makeda”; “huko” linaunganisha eneo hilo kwa kawaida na pango linalotajwa.
