  text: וְ/אֶת מַקֵּדָה֩ לָכַ֨ד יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא וַ/יַּכֶּ֣/הָ לְ/פִי חֶרֶב֮ וְ/אֶת מַלְכָּ/הּ֒ הֶחֱרִ֣ם אוֹתָ֗/ם וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וַ/יַּ֨עַשׂ֙ לְ/מֶ֣לֶךְ מַקֵּדָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/028.yaml
  text: And Joshua captured Makkedah on that day and struck it with the edge of the sword[a], and he devoted to destruction its king and every person in it; he left no survivor. And he did to the king of Makkedah just as he had done to the king of Jericho.
translation:
  language: sw
  text: Siku hiyo Yoshua aliuteka Makeda na kuupiga kwa makali ya upanga. Aliweka mfalme wake na kila mtu aliyekuwa ndani yake wakfu kwa ajili ya maangamizi[a]; hakuacha manusura yeyote. Akamtendea mfalme wa Makeda kama alivyomtendea mfalme wa Yeriko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliwaangamiza kabisa”; kitenzi cha Kiebrania humaanisha kuweka mtu au kitu wakfu kwa ajili ya maangamizi chini ya marufuku.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד
  choice: aliuteka
  rationale: Kitenzi hiki kina maana ya kijeshi ya kuutwaa mji; “aliuteka” ni wazi na cha kawaida katika Kiswahili.
- source_word: וַיַּכֶּהָ
  choice: kuupiga
  rationale: Neno hili linahifadhi nguvu halisi ya נכה na hapa linaelekeza tendo kwa mji wa Makeda bila kulifasiri tu kuwa “kuushinda.”
- source_word: לְפִי חֶרֶב
  choice: kwa makali ya upanga
  rationale: Huhifadhi taswira ya nahau ya Kiebrania, kihalisi “kwa kinywa/makali ya upanga,” kwa Kiswahili kinachoeleweka.
- source_word: הֶחֱרִם
  choice: aliwaweka wakfu kwa maangamizi
  rationale: Huhifadhi maana ya חרם ya kuwaweka watu chini ya wakfu unaoishia katika kuangamizwa, badala ya kuifanya iwe sawa tu na “kuua” au “kuangamiza.”
- source_word: אוֹתָם וְאֶת כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: mfalme wake na kila mtu aliyekuwa ndani yake
  rationale: Kiwakilishi cha wingi kinafafanuliwa kwa kurejelea mfalme na watu wa mjini; נֶפֶשׁ hapa humaanisha mtu, si nafsi isiyo ya mwili.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: hakumwacha yeyote aliyenusurika
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kutomwacha mtu yeyote kama manusura.
- source_word: וַיַּעַשׂ לְמֶלֶךְ מַקֵּדָה כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: Akamtendea mfalme wa Makeda kama alivyomtendea mfalme wa Yeriko
  rationale: “Akamtendea” huwasilisha muundo mfupi wa עשה ל kwa njia ya asili bila kutaja zaidi kitendo ambacho Kiebrania hakikifafanui hapa.
- source_word: מַקֵּדָה / יְרִיחוֹ / יְהוֹשֻׁעַ
  choice: Makeda / Yeriko / Yoshua
  rationale: Majina yamenukuliwa kwa maumbo yanayoeleweka na yanayotumika katika Kiswahili cha Biblia.
theological_decisions:
- issue: Tafsiri ya חרם katika muktadha wa kuiteka nchi
  choice: aliwaweka wakfu kwa maangamizi
  alternative: aliwaangamiza kabisa
  rationale: 'Kitenzi hiki kina maana pana kuliko kuua tu: kinahusu kuwaweka watu au vitu chini ya חרם katika hukumu ya vita. Tafsiri iliyochaguliwa huhifadhi uzito huo wa kidini bila kuongeza ufafanuzi wa kimadhehebu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimegawanywa kwa mtiririko wa kawaida huku mfuatano na ukali wa simulizi la Kiebrania vikihifadhiwa.
