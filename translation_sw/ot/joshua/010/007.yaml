base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/007.yaml
  text: So Joshua went up from Gilgal[a], he and all the fighting men with him[b], and all the mighty men of valor.
translation:
  language: sw
  text: Basi Yoshua akapanda kutoka Gilgali, yeye na wapiganaji wote waliokuwa pamoja naye, na mashujaa wote hodari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: akapanda
  rationale: Kitenzi עלה humaanisha kupanda au kwenda juu. “Akapanda” kinahifadhi mwelekeo uliotajwa katika Kiebrania bila kuongeza maelezo ya kijeshi yasiyosemwa wazi.
- source_word: מִן הַגִּלְגָּל
  choice: kutoka Gilgali
  rationale: Hii ni tafsiri ya moja kwa moja ya kihusishi מן pamoja na jina la mahali; “Gilgali” ni umbo la jina linalotambulika katika Kiswahili cha Biblia.
- source_word: הוּא
  choice: yeye pamoja na
  rationale: Kiwakilishi huru kimesemwa wazi katika Kiebrania ili kumtaja Yoshua mwenyewe pamoja na walioandamana naye. Muundo huu unahifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: כָל עַם הַמִּלְחָמָה
  choice: wapiganaji wote
  rationale: Kifungu hiki ni “watu wote wa vita” kwa maana ya kikosi kilichokuwa tayari kupigana. “Wapiganaji wote” ni cha asili na wazi katika Kiswahili cha sasa kuliko tafsiri sisisi “watu wote wa vita.”
- source_word: עִמּוֹ
  choice: waliokuwa pamoja naye
  rationale: Huwasilisha kwa kawaida maana ya עִמּוֹ, yaani wale walioandamana na Yoshua.
- source_word: כֹל גִּבּוֹרֵי הֶחָיִל
  choice: mashujaa wote hodari
  rationale: Kifungu hiki huwatambulisha wapiganaji wenye nguvu, uwezo na ushujaa uliothibitishwa. “Mashujaa wote hodari” kinadumisha tofauti yake na “wapiganaji wote” bila kutumia lugha ya kizamani.
