  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ יְהוֹשֻׁ֔עַ אַל תִּֽירְא֖וּ וְ/אַל תֵּחָ֑תּוּ חִזְק֣וּ וְ/אִמְצ֔וּ כִּ֣י כָ֗כָה יַעֲשֶׂ֤ה יְהוָה֙ לְ/כָל אֹ֣יְבֵי/כֶ֔ם אֲשֶׁ֥ר אַתֶּ֖ם נִלְחָמִ֥ים אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/025.yaml
  text: And Joshua said to them[a], “Do not fear and do not be dismayed. Be strong and courageous, for thus Yahweh will do to all your enemies against whom you are fighting.”
translation:
  language: sw
  text: Kisha Yoshua akawaambia, “Msiogope wala msifadhaike.[a] Iweni hodari na jasiri, kwa maana hivi ndivyo Yahwe atakavyowatendea adui zenu wote mnaopigana nao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala msivunjike moyo.”
    reason: Kitenzi cha Kiebrania חתת kinaweza kusisitiza hali ya kuvunjika moyo au kuvunjwa nguvu, pamoja na kufadhaika.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם יְהוֹשֻׁעַ
  choice: Kisha Yoshua akawaambia
  rationale: Waw-consecutive inaendeleza masimulizi; “Kisha” ni kiunganishi cha kawaida katika masimulizi ya Kiswahili. Jina יְהוֹשֻׁעַ limetolewa kwa umbo la kawaida la Kiswahili, “Yoshua.”
- source_word: אַל תִּירְאוּ
  choice: Msiogope
  rationale: Hili ni katazo la wingi, nalo linawasilisha moja kwa moja maana ya kuogopa.
- source_word: וְאַל תֵּחָתּוּ
  choice: wala msifadhaike
  rationale: Kitenzi חתת katika Niphal hapa kinaonyesha kuvunjika moyo, kutishwa, au kufadhaika. “Msifadhaike” ni cha asili katika Kiswahili na hakichanganyi maana yake kabisa na “msiogope.”
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Iweni hodari na jasiri
  rationale: Maneno haya yanahifadhi jozi ya nguvu/uthabiti na ujasiri bila kuwa mazito au yasiyo ya kawaida kwa msomaji wa sasa.
- source_word: כִּי כָכָה
  choice: kwa maana hivi ndivyo
  rationale: “Kwa maana” linatoa sababu ya himizo, na “hivi ndivyo” linahifadhi nguvu ya namna iliyoonyeshwa na כָּכָה.
- source_word: יַעֲשֶׂה יְהוָה לְכָל אֹיְבֵיכֶם
  choice: Yahwe atakavyowatendea adui zenu wote
  rationale: Yiqtol inaeleweka kwa wakati ujao katika muktadha. “Atakavyowatendea” linatoa kwa Kiswahili cha asili wazo la kile Yahwe atakachowafanyia maadui.
- source_word: אֲשֶׁר אַתֶּם נִלְחָמִים אוֹתָם
  choice: mnaopigana nao
  rationale: Hili ni tamko la asili la Kiswahili linalohifadhi maana ya maadui ambao Waisraeli wanapigana dhidi yao.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi ya Kiebrania yana jina la agano יְהוָה moja kwa moja. “Yahwe” linahifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa kimadhehebu.
- issue: Uhakika wa tendo la Mungu dhidi ya maadui
  choice: atakavyowatendea
  alternative: anavyowatendea
  rationale: Muktadha unaelekeza kwa maadui ambao watakabiliwa baadaye; kwa hiyo wakati ujao unafaa, huku sentensi ikibaki tamko la hakika katika himizo la Yoshua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa urahisi. Wingi wa amri umehifadhiwa, na jozi za vitenzi vya Kiebrania hazijaunganishwa kuwa wazo moja.
