  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumia viambishi vya mfululizo “waka-”; majina ya mahali yametolewa kwa maumbo ya kawaida Egloni na Hebroni.
