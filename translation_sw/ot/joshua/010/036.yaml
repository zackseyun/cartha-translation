  text: Then Joshua[a], and all Israel with him, went up from Eglon to Hebron, and they fought against it.
translation:
  language: sw
  text: Kisha Yoshua na Israeli wote waliokuwa pamoja naye wakapanda kutoka Egloni kwenda Hebroni, wakapigana dhidi yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kinasema “dhidi yake,” kwa kiwakilishi cha kike kinachorejelea jiji la Hebroni.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: wakapanda
  rationale: Kitenzi עלה kinaonyesha kwenda juu; katika simulizi la kuhama kutoka mahali pamoja hadi pengine, “wakapanda” ni usemi wa asili unaohifadhi maana ya mwelekeo.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: pamoja na Israeli wote waliokuwa pamoja naye
  rationale: Huhifadhi usemi wa kijumla “Israeli wote” na kuweka wazi kwamba walikuwa pamoja na Yoshua.
- source_word: מֵעֶגְלוֹנָה
  choice: kutoka Egloni
  rationale: Kihusishi מִן kinaonyesha mahali walikotoka; umbo “Egloni” linafuata matumizi ya kawaida ya majina ya mahali katika Kiswahili.
- source_word: חֶבְרוֹנָה
  choice: kwenda Hebroni
  rationale: Herufi ya mwelekeo -ה inaonyesha kusogea kuelekea Hebroni; “kwenda Hebroni” ni wazi na ya kawaida.
- source_word: וַיִּלָּחֲמוּ
  choice: wakapigana
  rationale: Kitenzi לחם katika muktadha huu kinamaanisha kuingia vitani au kupigana; “wakapigana” ni cha kawaida na chenye hadhi.
- source_word: עָלֶיהָ
  choice: dhidi yake
  rationale: Kihusishi עַל hapa kina maana ya uadui, na kiambishi cha kike cha umoja kinarejelea jiji la Hebroni. Kiswahili “yake” hakionyeshi jinsia na kinaweza kurejelea jiji kwa kawaida.
