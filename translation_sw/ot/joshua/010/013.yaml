  text: וַ/יִּדֹּ֨ם הַ/שֶּׁ֜מֶשׁ וְ/יָרֵ֣חַ עָמָ֗ד עַד יִקֹּ֥ם גּוֹי֙ אֹֽיְבָ֔י/ו הֲ/לֹא הִ֥יא כְתוּבָ֖ה עַל סֵ֣פֶר הַ/יָּשָׁ֑ר וַ/יַּעֲמֹ֤ד הַ/שֶּׁ֨מֶשׁ֙ בַּ/חֲצִ֣י הַ/שָּׁמַ֔יִם וְ/לֹא אָ֥ץ לָ/ב֖וֹא כְּ/י֥וֹם תָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/013.yaml
  text: So the sun stood still[a], and the moon stopped, until the nation took vengeance on its enemies[d][c][b]. Is this not written in the Book of Jashar? The sun stood still in the middle of the sky and did not hurry to set for about a full day.
translation:
  language: sw
  text: Basi jua likatulia[a], na mwezi ukasimama, mpaka taifa lilipolipiza kisasi dhidi ya adui zake[b]. Je, jambo hili halijaandikwa katika Kitabu cha Yashari?[c] Jua lilisimama katikati ya anga, wala halikuharakia kutua kwa karibu siku nzima[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jua likasimama tuli” au “jua likanyamaza.” Kitenzi cha Kiebrania kinaweza kumaanisha kutulia au kunyamaza.
    reason: lexical_alternative
  - marker: b
    text: Au, “mpaka taifa lilipojipatia haki dhidi ya adui zake.” Nahau ya Kiebrania inaweza kuwa na maana ya kulipiza kisasi au kupata haki.
    reason: lexical_alternative
  - marker: c
    text: 'Kiebrania: “Kitabu cha Yashari”; huenda pia ikamaanisha “Kitabu cha Mnyofu.”'
    reason: alternative_reading
  - marker: d
    text: Au, “kama siku nzima” au “takriban siku nzima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדֹּם הַשֶּׁמֶשׁ
  choice: jua likasimama tuli
  rationale: Kitenzi דמם kinaweza kumaanisha kunyamaza au kutulia. Katika muktadha huu wa jua na kwa kulinganisha na mwezi kusimama, “likasimama tuli” huonyesha kusitishwa kwa mwendo huku kikihifadhi wazo la utulivu lililomo katika Kiebrania.
- source_word: וְיָרֵחַ עָמָד
  choice: na mwezi ukasimama
  rationale: עמד kimsingi ni “kusimama”; katika muktadha wa mwezi, usemi huu kwa kawaida unaonyesha kwamba mwendo wake ulisimama.
- source_word: עַד יִקֹּם גּוֹי אֹיְבָיו
  choice: mpaka taifa lilipolipiza kisasi dhidi ya adui zake
  rationale: Katika nahau hii, נקם inayowakilishwa na umbo יִקֹּם huhusu kulipiza kisasi au kupata haki dhidi ya adui. Tafsiri haibadili tendo hilo kuwa ushindi wa kijeshi tu.
- source_word: גּוֹי
  choice: taifa
  rationale: גוי humaanisha taifa na hapa humrejelea Israeli kama jumuiya moja.
- source_word: הֲלֹא הִיא כְתוּבָה
  choice: Je, jambo hili halijaandikwa
  rationale: Kiwakilishi cha kike huenda kinarejelea jambo au simulizi lililotangulia. “Jambo hili” ni Kiswahili cha kawaida kinachohifadhi rejeo hilo bila kulazimisha maana mahususi zaidi.
- source_word: סֵפֶר הַיָּשָׁר
  choice: Kitabu cha Yashari
  rationale: Yashari limetumiwa kama jina la kitabu hicho cha kale badala ya kutafsiri יָשָׁר moja kwa moja; maana inayowezekana ya jina imetolewa katika tanbihi.
- source_word: בַּחֲצִי הַשָּׁמַיִם
  choice: katikati ya anga
  rationale: Usemi huo unaonyesha sehemu ya kati ya mbingu au anga; “katikati ya anga” ni wa kawaida na unaeleweka kwa wasomaji wa sasa.
- source_word: וְלֹא אָץ לָבוֹא
  choice: wala halikufanya haraka kutua
  rationale: אוץ ni kufanya haraka, na בוא inapotumiwa kuhusu jua hapa huelekea kutua kwake. “Kutua” huweka wazi nahau hiyo kwa Kiswahili cha kawaida.
- source_word: כְּיוֹם תָּמִים
  choice: kwa karibu siku nzima
  rationale: תמים huonyesha kitu kamili au kizima, huku כְּ ikitoa ulinganisho au ukaribiaji. “Karibu siku nzima” huhifadhi kutokuwa na uhakika wa kiwango kamili.
theological_decisions:
- issue: Asili ya muujiza wa jua na mwezi
  choice: Kueleza moja kwa moja kwamba jua na mwezi vilisimama
  alternative: Kufanya maneno hayo yawe taswira ya jinsi tukio lilivyoonekana tu, au kuyachukulia kama ushairi usiodai tukio halisi
  rationale: Simulizi linawasilisha tukio hilo kuwa la ajabu na linahusisha taarifa hiyo na chanzo kilichoandikwa. Tafsiri inadumisha dai la maandishi bila kuingiza upatanisho wa kisayansi au kulifanya kuwa sitiari pekee.
- issue: Maana ya kisasi au kupata haki katika יִקֹּם
  choice: kulipiza kisasi dhidi ya adui zake
  alternative: kujipatia haki dhidi ya adui zake
  rationale: Nahau inaweza kubeba wazo la kisasi au la kutetewa na kupata haki. Maana ya kawaida ya kisasi imewekwa katika matini, na upana wa maana umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi wenye hadhi lakini unaoeleweka kwa msomaji wa kawaida. “Likisimama tuli” huhifadhi uhusiano wa kimaana kati ya utulivu na kusimama bila kutumia lugha ya kale. Jina “Yashari” limetoholewa ili litamkike kwa kawaida katika Kiswahili.
