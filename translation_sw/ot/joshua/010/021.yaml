  yaml_path: translation/ot/joshua/010/021.yaml
  text: And all the people returned to the camp[a], to Joshua at Makkedah, in peace. No one moved his tongue against any of the sons of Israel.
translation:
  language: sw
  text: Watu wote wakarudi salama kambini kwa Yoshua huko Makeda. Hakuna mtu aliyesema neno lolote dhidi ya yeyote miongoni mwa wana wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya neno kwa neno, Kiebrania kinasema, “Hakuna mtu aliyenoa ulimi wake dhidi ya yeyote miongoni mwa wana wa Israeli.” Hii ni nahau inayomaanisha kwamba hakuna aliyesema neno la uhasama dhidi yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ כָל הָעָם
  choice: Watu wote wakarudi
  rationale: Kitenzi שׁוּב kinaeleza kurudi kimwili baada ya kuwafuatilia adui; כָל הָעָם kimetafsiriwa kwa maana yake ya kawaida, ingawa katika muktadha hawa ni wapiganaji.
- source_word: אֶל הַמַּחֲנֶה אֶל יְהוֹשֻׁעַ מַקֵּדָה
  choice: kambini kwa Yoshua huko Makeda
  rationale: Muundo wa Kiebrania umebanwa; tafsiri hii inaonyesha kwa kawaida kwamba walirudi kambini kwa Yoshua, aliyekuwa Makeda.
- source_word: בְּשָׁלוֹם
  choice: salama
  rationale: Katika muktadha huu neno שָׁלוֹם linaonyesha kwamba walirudi bila kudhurika. ‘Salama’ ni Kiswahili cha kawaida na sahihi kuliko tafsiri ya neno kwa neno ‘kwa amani.’
- source_word: לֹא חָרַץ ... אֶת לְשֹׁנוֹ
  choice: Hakuna mtu aliyesema neno lolote dhidi ya
  rationale: Nahau hii yenye picha ya ‘kunoa ulimi’ inaashiria kusema kwa uhasama. Maana imewekwa wazi katika matini, huku picha halisi ya Kiebrania ikihifadhiwa katika tanbihi.
- source_word: לְאִישׁ
  choice: yeyote miongoni mwa
  rationale: Chini ya ukanushi, אִישׁ ina maana ya ‘mtu yeyote’; ‘miongoni mwa’ inaunganisha kwa kawaida na kundi linalofuata.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi muundo wa jina la taifa/covenant בני ישראל bila kuligeuza tu kuwa ‘Waisraeli.’
theological_decisions:
- issue: Jina la taifa בני ישראל lenye umbo la kiume
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: ‘Wana wa Israeli’ huhifadhi umbo la Kiebrania na maana yake ya kijumuiya bila kuongeza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kisasa, wenye heshima na unaoeleweka kwa urahisi. Mpangilio umefanywa wa kawaida katika Kiswahili bila kuficha maana ya nahau ya Kiebrania.
