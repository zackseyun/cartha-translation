  text: Yoshua akasema, “Bingirisheni mawe makubwa kwenye mdomo wa pango,[a] na wekeni watu hapo ili wawalinde.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwenye mlango wa pango.” Kiebrania kinasema kihalisi “kwenye mdomo wa pango.”
    reason: lexical_alternative
  - marker: b
    text: Kiebrania kinasema “wawalinde,” likitumia kiambishi cha wingi ambacho huenda kinawarejelea wafalme waliofungiwa ndani ya pango, wala si pango lenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: akasema
  rationale: Muundo wa kawaida wa kusogeza mbele simulizi la Kiebrania; ‘akasema’ ni wa asili katika masimulizi ya Kiswahili.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: גֹּלּוּ
  choice: Bingirisheni
  rationale: Amri ya wingi kutoka גלל inaeleza kusogeza mawe kwa kuyaviringisha; ‘bingirisheni’ ni sahihi na ya kawaida.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: mawe makubwa
  rationale: Huhifadhi maana ya ukubwa kwa lugha ya kawaida ya Kiswahili.
- source_word: אֶל פִּי הַמְּעָרָה
  choice: kwenye mdomo wa pango
  rationale: Huhifadhi taswira halisi ya Kiebrania ya ‘mdomo wa pango,’ ambayo inaeleweka kama nafasi ya kuingilia.
- source_word: וְהַפְקִידוּ
  choice: kisha wawekeni
  rationale: Kitenzi kina maana ya kuwaweka au kuwateua watu kwa kazi maalumu; katika muktadha huu ‘wawekeni’ ni ya asili na inaonyesha kuwapangia doria.
- source_word: עָלֶיהָ
  choice: hapo
  rationale: Inaonyesha kuwekwa kwa watu kwenye pango au karibu na lango lake bila kutoa Kiswahili kisicho cha asili cha ‘juu yake.’
- source_word: אֲנָשִׁים
  choice: watu
  rationale: Katika muktadha wa kijeshi hawa ni wanaume, lakini ‘watu’ ni neno la kawaida la Kiswahili kwa watu waliowekwa kutekeleza jukumu; haliongezi jina maalumu ‘walinzi’ lisilopo katika chanzo.
- source_word: לְשָׁמְרָם
  choice: ili wawalinde
  rationale: Kiambishi cha Kiebrania ni cha wingi wa kiume na kwa kawaida kinawarejelea wale wafalme watano waliokuwa pangoni, si pango la umoja.
