reference: Joshua 10:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/נֻסָ֣/ם מִ/פְּנֵ֣י יִשְׂרָאֵ֗ל הֵ֞ם בְּ/מוֹרַ֤ד בֵּית חוֹרֹן֙ וַֽ/יהוָ֡ה הִשְׁלִ֣יךְ עֲלֵי/הֶם֩ אֲבָנִ֨ים גְּדֹל֧וֹת מִן הַ/שָּׁמַ֛יִם עַד עֲזֵקָ֖ה וַ/יָּמֻ֑תוּ רַבִּ֗ים אֲשֶׁר מֵ֨תוּ֙ בְּ/אַבְנֵ֣י הַ/בָּרָ֔ד מֵ/אֲשֶׁ֥ר הָרְג֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל בֶּ/חָֽרֶב׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/011.yaml
  text: And as they fled before Israel[a], while they were on the descent of Beth-horon, Yahweh threw large stones from heaven on them as far as Azekah, and they died. More died from the hailstones than the sons of Israel killed with the sword.
translation:
  language: sw
  text: Ikawa walipokuwa wakiwakimbia Waisraeli, nao wakiwa kwenye mteremko wa Beth-horoni, Yahweh akawatupia mawe makubwa kutoka mbinguni mpaka Azeka, nao wakafa. Waliokufa kwa mawe ya mvua ya mawe walikuwa wengi kuliko wale ambao Waisraeli waliwaua kwa upanga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֻסָם מִפְּנֵי יִשְׂרָאֵל
  choice: walipokuwa wakiwakimbia Waisraeli
  rationale: Muundo wenye בְּ na kitenzi-jina unaonyesha tendo linaloendelea wakati mmoja na matukio mengine; ‘wakiwakimbia’ pia huwasilisha maana ya kukimbia mbele ya adui kwa Kiswahili cha kawaida.
- source_word: בְּמוֹרַד בֵּית חוֹרֹן
  choice: wakiwa kwenye mteremko wa Beth-horoni
  rationale: מוֹרָד ni njia au sehemu ya kuteremkia; ‘mteremko’ huhifadhi maelezo ya kijiografia kwa lugha ya kawaida.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Jina la agano lililoandikwa kwa herufi nne za Kiebrania limetolewa kama jina maalumu badala ya cheo.
- source_word: הִשְׁלִיךְ עֲלֵיהֶם
  choice: akawavurumishia
  rationale: Kitenzi kina maana ya kutupa au kurusha; ‘kuwavurumishia’ huonyesha kwa kawaida mawe yaliyotupwa juu yao bila kuongeza maelezo yasiyokuwapo.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: mawe makubwa
  rationale: Tafsiri hii huhifadhi utambulisho wa awali wa vitu hivyo kama mawe kabla ya kifungu cha baadaye kuvibainisha kuwa mawe ya mvua ya mawe.
- source_word: מִן הַשָּׁמַיִם
  choice: kutoka mbinguni
  rationale: ‘Mbinguni’ huhifadhi maana ya mahali pa juu na mguso wa kitheolojia wa tendo la Mungu.
- source_word: עַד עֲזֵקָה
  choice: mpaka Azeka
  rationale: עַד hapa huonyesha umbali ambao tukio hilo lilienea katika njia ya kukimbilia.
- source_word: בְּאַבְנֵי הַבָּרָד
  choice: kwa mawe ya mvua ya mawe
  rationale: Usemi huu wa wazi hudumisha kiungo cha kileksia na ‘mawe makubwa’ na kuvibainisha kama mawe yaliyotokana na mvua ya mawe.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Waisraeli
  rationale: Katika Kiswahili, hili ndilo jina la kawaida na jumuishi la watu wa Israeli; tafsiri ya neno kwa neno ‘wana wa Israeli’ hapa ingesikika isiyo ya kawaida na ingeweza kueleweka kuwa wanaume pekee.
- source_word: בֶּחָרֶב
  choice: kwa upanga
  rationale: Kiambishi בְּ kinaonyesha chombo kilichotumiwa; umoja ‘upanga’ unahifadhi umoja wa kijumla wa Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahweh
  alternative: BWANA
  rationale: Andiko linatumia jina la Mungu moja kwa moja; ‘Yahweh’ hulihifadhi kama jina maalumu bila kulibadili kuwa cheo.
- issue: Asili ya vitu vilivyoanguka kutoka mbinguni
  choice: Kutaja kwanza ‘mawe makubwa’ na baadaye ‘mawe ya mvua ya mawe’
  alternative: Kuvitaja ‘mawe ya mvua ya mawe’ tangu mwanzoni
  rationale: Kiebrania kinatoa maelezo kwa hatua mbili. Kuyahifadhi huepuka kutatua mapema namna simulizi linavyovitambulisha.
- issue: Ulinganisho wa waliokufa
  choice: Waliokufa kwa mawe ya mvua ya mawe walikuwa wengi kuliko wale ambao Waisraeli waliwaua
  alternative: Mawe ya mvua ya mawe yaliua wengi kuliko Waisraeli
  rationale: Muundo uliochaguliwa huhifadhi kwamba ulinganisho wa Kiebrania ni kati ya idadi ya watu waliokufa kwa njia hizo mbili, huku ukibaki wazi na wa kawaida kwa Kiswahili.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Majina ya mahali yametoholewa kwa maumbo yaliyozoeleka: Beth-horoni na Azeka. Hakuna tanbihi iliyohitajika.'
