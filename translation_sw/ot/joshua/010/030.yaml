  text: וַ/יִּתֵּן֩ יְהוָ֨ה גַּם אוֹתָ֜/הּ בְּ/יַ֣ד יִשְׂרָאֵ֘ל וְ/אֶת מַלְכָּ/הּ֒ וַ/יַּכֶּ֣/הָ לְ/פִי חֶ֗רֶב וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹֽא הִשְׁאִ֥יר בָּ֖/הּ שָׂרִ֑יד וַ/יַּ֣עַשׂ לְ/מַלְכָּ֔/הּ כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/030.yaml
  text: And Yahweh also gave it and its king into the hand of Israel[a], and he struck it with the edge of the sword, and every person who was in it. He left no survivor in it, and he did to its king just as he had done to the king of Jericho.
translation:
  language: sw
  text: Yahwe akautia mji huo pamoja na mfalme wake mikononi mwa Israeli. Yoshua akaupiga kwa makali ya upanga, pamoja na kila mtu aliyekuwa ndani yake[a]. Hakumwacha humo mtu yeyote akiwa hai. Akamtendea mfalme wake kama alivyokuwa amemtendea mfalme wa Yeriko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “kila nafsi iliyokuwa ndani yake”; hapa ni nahau inayomaanisha kila mtu aliyekuwa mjini.'
    reason: Hufafanua kwamba נֶפֶשׁ katika muktadha huu humaanisha watu, si dhana ya kiteolojia ya nafsi, na hufuata kitia-nanga cha audit trail ya Kiingereza.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Linahifadhi jina binafsi la Mungu kwa umbo linalotumika kwa kawaida katika maandishi ya Kiswahili.
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: akautia ... mikononi mwa Israeli
  rationale: Linahifadhi taswira ya nahau ya Kiebrania huku likieleza kwamba mji uliwekwa chini ya mamlaka ya Israeli.
- source_word: גַּם
  choice: -ka- katika «akautia»
  rationale: Mfuatano wa simulizi katika Kiswahili unaonyesha kwamba ushindi huu unaongezwa kwa matukio yaliyotangulia; kutafsiri kwa neno tofauti «pia» kungekuwa si lazima.
- source_word: אוֹתָהּ ... וְאֶת מַלְכָּהּ
  choice: mji huo pamoja na mfalme wake
  rationale: Kiwakilishi cha kike kinarejelea Libna, yaani mji uliotajwa katika muktadha; kutaja «mji» huzuia utata usio wa lazima katika Kiswahili.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: Yoshua akauangamiza kwa upanga
  rationale: נכה katika simulizi hili la vita ina maana ya kuupiga na kuuangamiza mji. «Kwa upanga» ni nahau ya asili ya Kiswahili kuliko tafsiri halisi ya «kwa makali/kinywa cha upanga».
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: kila mtu aliyekuwa ndani yake
  rationale: נפש hapa humaanisha mtu aliye hai, si «nafsi» kama dhana ya kimaumbile au kiteolojia.
- source_word: לֹא הִשְׁאִיר בָּהּ שָׂרִיד
  choice: Hakumwacha humo mtu yeyote akiwa hai
  rationale: Huwasilisha maana ya kutomwacha manusura kwa Kiswahili cha kawaida na wazi.
- source_word: וַיַּעַשׂ לְמַלְכָּהּ כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: Akamtendea mfalme wake kama alivyokuwa amemtendea mfalme wa Yeriko
  rationale: «Kumtendea» huwasilisha kwa kawaida urudiaji wa עשה, na «alivyokuwa amemtendea» huonyesha kuwa tukio la Yeriko lilitangulia.
theological_decisions:
- issue: Maana ya נֶפֶשׁ katika muktadha wa vita
  choice: kila mtu
  alternative: kila nafsi
  rationale: Neno hilo linarejelea watu waliokuwamo mjini, wala halitoi fundisho kuhusu nafsi isiyo ya kimwili; «mtu» huepuka kuingiza dhana ya kiteolojia isiyokusudiwa.
- issue: Mtendaji wa vitenzi vya kuuangamiza mji na kumtendea mfalme
  choice: Yoshua
  alternative: Israeli
  rationale: Kitenzi cha Kiebrania kina nafsi ya tatu umoja bila kutaja jina hapa. Muktadha wa aya ya 29 unamtaja Yoshua kama mtendaji wa simulizi, hivyo jina linawekwa wazi kwa Kiswahili bila kubadili rejeleo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya simulizi ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Viunganishi vya «-ka-» vinadumisha mwendo wa simulizi. Ukatili wa taarifa ya chanzo haujafichwa wala kuongezwa.
