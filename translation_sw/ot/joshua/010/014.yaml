  text: וְ/לֹ֨א הָיָ֜ה כַּ/יּ֤וֹם הַ/הוּא֙ לְ/פָנָ֣י/ו וְ/אַחֲרָ֔י/ו לִ/שְׁמֹ֥עַ יְהוָ֖ה בְּ/ק֣וֹל אִ֑ישׁ כִּ֣י יְהוָ֔ה נִלְחָ֖ם לְ/יִשְׂרָאֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/014.yaml
  text: And there was no day like that before it or after it[a], when Yahweh listened to the voice of a man, for Yahweh fought for Israel.
translation:
  language: sw
  text: Wala hakukuwa na siku kama hiyo kabla yake wala baada yake, ambayo Yahwe alisikiliza sauti ya mtu; kwa maana Yahwe alipigania Israeli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא הָיָה
  choice: Wala hapakuwa na
  rationale: Inatoa kwa Kiswahili cha kawaida kishazi cha kuwepo kilichokanushwa, huku ikihifadhi msisitizo wa kwamba siku ya kulinganishwa nayo haikuwapo.
- source_word: כַּיּוֹם הַהוּא
  choice: siku nyingine kama hiyo
  rationale: Kiambishi cha ulinganisho כ pamoja na 'siku' kinaonyesha siku inayolinganishwa na siku hiyo; 'siku nyingine kama hiyo' ni ya asili na huonyesha upekee wake katika muktadha.
- source_word: לְפָנָיו וְאַחֲרָיו
  choice: kabla yake wala baada yake
  rationale: Viwakilishi vinaelekezwa kwa 'siku,' mtangulizi wa karibu; muundo huu wa Kiswahili huhifadhi maana ya wakati kabla na baada ya siku hiyo.
- source_word: לִשְׁמֹעַ יְהוָה
  choice: ambayo Yahwe aliisikiliza
  rationale: Kitenzi-jina kinaeleza hali iliyoifanya siku hiyo iwe ya pekee. 'Aliisikiliza' huhifadhi wazo la kusikia kwa makini bila kudokeza kwamba Mungu alimtii mwanadamu.
- source_word: בְּקוֹל אִישׁ
  choice: sauti ya mwanadamu
  rationale: Huhifadhi kwa karibu nahau ya Kiebrania 'sauti ya mtu' na kusisitiza tofauti kati ya Yahwe na mwombaji wa kibinadamu; 'mwanadamu' hapa ni ya asili na haibadili rejeleo la Yoshua.
- source_word: כִּי
  choice: kwa maana
  rationale: Huanzisha sababu au maelezo ya tukio hilo la ajabu kwa mtindo wa kifasihi ulio wazi.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: alipigania Israeli
  rationale: Hutoa maana ya Yahwe kushiriki vitani kwa niaba ya Israeli, kwa kutumia wakati uliopita unaofaa muhtasari wa simulizi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יהוה
  choice: Yahwe
  alternative: Yehova
  rationale: Jina binafsi la Mungu linahifadhiwa kwa namna ya kawaida ya Kiswahili, bila kulibadilisha kuwa cheo.
- issue: Maana ya לִשְׁמֹעַ ... בְּקוֹל אִישׁ
  choice: Yahwe aliisikiliza sauti ya mwanadamu
  alternative: Yahwe alikubali ombi la mwanadamu
  rationale: Uamuzi huu huhifadhi nahau na mvutano wa Kiebrania kwamba Mungu alisikiliza sauti ya mtu, bila kuifanya tafsiri iseme kwa uwazi zaidi kwamba Mungu alimtii mtu. Tanbihi inaonyesha maana ya kimuktadha ya kukubali ombi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya usimulizi wa Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. 'Wala ... wala ...' huunganisha kwa ufasaha ukanushaji wa kabla na baada; 'mwanadamu' huhifadhi msisitizo wa kibinadamu bila kuingiza fundisho la ziada.
