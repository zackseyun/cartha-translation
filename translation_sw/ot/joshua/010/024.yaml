  text: וַ֠/יְהִי כְּֽ/הוֹצִיאָ֞/ם אֶת הַ/מְּלָכִ֣ים הָ/אֵלֶּה֮ אֶל יְהוֹשֻׁעַ֒ וַ/יִּקְרָ֨א יְהוֹשֻׁ֜עַ אֶל כָּל אִ֣ישׁ יִשְׂרָאֵ֗ל וַ֠/יֹּאמֶר אֶל קְצִינֵ֞י אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הֶ/הָלְכ֣וּא אִתּ֔/וֹ קִרְב֗וּ שִׂ֚ימוּ אֶת רַגְלֵי/כֶ֔ם עַֽל צַוְּארֵ֖י הַ/מְּלָכִ֣ים הָ/אֵ֑לֶּה וַֽ/יִּקְרְב֔וּ וַ/יָּשִׂ֥ימוּ אֶת רַגְלֵי/הֶ֖ם עַל צַוְּארֵי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/024.yaml
  text: And when they brought these kings out to Joshua[a], Joshua called all the men of Israel and said to the commanders of the men of war who had gone with him, “Come near[b]; put your feet on the necks of these kings.” So they came near and put their feet on their necks.
translation:
  language: sw
  text: Ikawa, walipowatoa wafalme hawa na kuwaleta kwa Yoshua, Yoshua akawaita wanaume wote wa Israeli[a], akawaambia makamanda wa wapiganaji waliokuwa wameenda pamoja naye[b], “Karibieni, mweke miguu yenu juu ya shingo za wafalme hawa.” Basi wakakaribia na wakaweka miguu yao juu ya shingo zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania kihalisi, “kila mwanamume wa Israeli”; katika muktadha huu ni wanaume waliokusanyika pamoja na jeshi.
    reason: lexical_alternative
  - marker: b
    text: Au “viongozi wa watu wa vita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהוֹצִיאָם
  choice: Ikawa walipowatoa
  rationale: Muundo wa simulizi unaanzisha tukio la wakati; Kiswahili hiki kinahifadhi mwendelezo wa simulizi bila kuwa kigumu isivyo lazima.
- source_word: הַמְּלָכִים הָאֵלֶּה
  choice: wafalme hawa
  rationale: Kiwakilishi cha kuonyesha kinawarejelea wafalme waliopo katika tukio hilo.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: wanaume wote wa Israeli
  rationale: Huhifadhi umbo la kiume la Kiebrania na muktadha wa jeshi, huku likisomeka kwa kawaida katika Kiswahili.
- source_word: קְצִינֵי אַנְשֵׁי הַמִּלְחָמָה
  choice: makamanda wa wapiganaji
  rationale: קְצִינֵי humaanisha viongozi au makamanda, na אַנְשֵׁי הַמִּלְחָמָה ni watu wanaopigana vitani; tafsiri hii ni ya kawaida na hudumisha sajili ya kijeshi.
- source_word: הֶהָלְכוּא אִתּוֹ
  choice: waliokuwa wameenda pamoja naye
  rationale: Kirai hiki kinawatambulisha makamanda kama wale walioandamana na Yoshua katika shughuli hiyo.
- source_word: קִרְבוּ
  choice: Karibieni
  rationale: Ni amri ya kuja karibu kimwili, iliyotolewa kwa kundi.
- source_word: שִׂימוּ אֶת רַגְלֵיכֶם עַל צַוְּארֵי
  choice: mweke miguu yenu juu ya shingo za
  rationale: Huhifadhi tendo halisi na ishara ya kuwatiisha wafalme bila kulainisha taswira ya Kiebrania.
- source_word: וַיִּקְרְבוּ וַיָּשִׂימוּ
  choice: Basi wakakaribia na kuweka
  rationale: Vitenzi vinavyofuatana vinaonyesha utekelezaji wa mara moja wa amri katika mtiririko wa simulizi.
theological_decisions:
- issue: Lugha ya kijinsia katika כָּל אִישׁ יִשְׂרָאֵל na אַנְשֵׁי הַמִּלְחָמָה
  choice: wanaume wote wa Israeli / wapiganaji
  alternative: Waisraeli wote / watu wa Israeli
  rationale: Muktadha ni wa kijeshi, na kifungu cha kwanza kimetaja kwa wazi אִישׁ, “mwanamume.” Tafsiri haipanui wala kuondoa maana hiyo ya kimuktadha.
- issue: Tendo la kuweka miguu juu ya shingo
  choice: mweke miguu yenu juu ya shingo za wafalme hawa
  alternative: waonyesheni kwamba mmewashinda wafalme hawa
  rationale: Kiebrania kinaeleza tendo halisi lenye ishara ya ushindi na utiisho; taswira hiyo imehifadhiwa badala ya kufupishwa kuwa maana yake tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Biblia lakini kinachoeleweka kwa msomaji wa sasa. “Makamanda” na “wapiganaji” hudumisha muktadha wa kijeshi; taswira kali ya ushindi haijalainishwa.
