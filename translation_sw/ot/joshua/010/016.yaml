  text: But these five kings fled and hid in the cave at Makkedah[a].
translation:
  language: sw
  text: Lakini hao wafalme watano walikimbia na kujificha ndani ya pango huko Makeda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nao hao wafalme watano walikimbia na kujificha ndani ya pango huko Makeda.”
    reason: Kihusishi וַ kinaweza kueleweka kama mwendelezo wa simulizi (“Nao”) badala ya ulinganisho (“Lakini”).
lexical_decisions:
- source_word: וַיָּנֻסוּ
  choice: walikimbia
  rationale: Kitenzi נוּס kinaeleza kukimbia hatari au adui; “walikimbia” ni Kiswahili cha kawaida kinachohifadhi maana ya kutoroka kwa haraka.
- source_word: חֲמֵשֶׁת
  choice: watano
  rationale: Nambari ya msingi imetafsiriwa kwa upatanisho wa ngeli na nomino “wafalme.”
- source_word: הַמְּלָכִים הָאֵלֶּה
  choice: hao wafalme
  rationale: “Hao” huhifadhi nguvu ya kiashiria הָאֵלֶּה na inafaa kwa watu waliotajwa katika simulizi.
- source_word: וַיֵּחָבְאוּ
  choice: na kujificha
  rationale: Mzizi חבא hapa una maana ya kujisitiri wenyewe; “kujificha” huwasilisha maana hiyo kwa lugha ya kawaida na ya asili.
- source_word: בַמְּעָרָה
  choice: ndani ya pango
  rationale: Usemi huu unaonyesha mahali walipojificha. Kiswahili hakihitaji kutia alama ya wazi ya uhusika wa nomino kama ilivyo kwa kibainishi cha Kiebrania; muktadha hutambulisha pango hilo.
- source_word: בְּמַקֵּדָה
  choice: huko Makeda
  rationale: Jina la mahali limetoholewa kuwa “Makeda,” na “huko” linaonyesha kwamba pango lilikuwa katika eneo hilo.
- source_word: וַ
  choice: Lakini
  rationale: Ingawa וַ inaweza kuendeleza simulizi kwa maana ya “na,” hapa “Lakini” huonyesha kwa kawaida badiliko kutoka matukio yaliyotangulia kwenda kwa kukimbia kwa wafalme. Uwezekano wa “Nao” umehifadhiwa katika tanbihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. Mpangilio “hao wafalme watano” ni wa asili, na “ndani ya pango huko Makeda” unaeleweka kwa urahisi bila kuongeza maelezo yasiyokuwamo katika chanzo.
