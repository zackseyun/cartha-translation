  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi ya kisimulizi. Muundo wa sababu mbili katika Kiebrania umehifadhiwa, na utata wa גָּדוֹל kati ya ukubwa na umuhimu haujaondolewa kimakusudi.
