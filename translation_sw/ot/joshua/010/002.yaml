id: JOS.10.2
reference: Joshua 10:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יִּֽירְא֣וּ מְאֹ֔ד כִּ֣י עִ֤יר גְּדוֹלָה֙ גִּבְע֔וֹן כְּ/אַחַ֖ת עָרֵ֣י הַ/מַּמְלָכָ֑ה וְ/כִ֨י הִ֤יא גְדוֹלָה֙ מִן הָ/עַ֔י וְ/כָל אֲנָשֶׁ֖י/הָ גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/002.yaml
  text: And they feared greatly[a], because Gibeon was a great city, like one of the royal cities, and because it was greater than Ai, and all its men were mighty.
translation:
  language: sw
  text: Nao wakaogopa sana, kwa sababu Gibeoni ulikuwa mji mkubwa, kama mojawapo ya miji ya kifalme, na kwa sababu ulikuwa mkubwa kuliko Ai, na wanaume wake wote walikuwa mashujaa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wapiganaji hodari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ מְאֹד
  choice: Nao wakaogopa sana
  rationale: Kauli ya Qal wayyiqtol ya ירא pamoja na kielezi מְאֹד inaendeleza simulizi na kueleza hofu kubwa kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: כִּי
  choice: kwa sababu
  rationale: Hapa כִּי inatanguliza sababu ya hofu yao; 'kwa sababu' huonyesha wazi uhusiano huo wa kisababishi.
- source_word: עִיר גְּדוֹלָה
  choice: mji mkubwa
  rationale: גָּדוֹל inaweza kuonyesha ukubwa au umuhimu. 'Mji mkubwa' ni ya asili na haifungi kabisa maana katika hadhi pekee.
- source_word: גִּבְעוֹן
  choice: Gibeoni
  rationale: Hili ni umbo la kawaida la jina la mahali katika Kiswahili cha Biblia.
- source_word: כְּאַחַת עָרֵי הַמַּמְלָכָה
  choice: kama mojawapo ya miji ya kifalme
  rationale: Usemi huu unalinganisha Gibeoni na miji yenye cheo au uhusiano wa kifalme; 'miji ya kifalme' ni fasaha kuliko tafsiri sisisi ya 'miji ya ufalme.'
- source_word: וְכִי
  choice: na kwa sababu
  rationale: Hurudia na kuendeleza muundo wa sababu uliopo katika Kiebrania.
- source_word: הִיא גְדוֹלָה מִן הָעַי
  choice: ulikuwa mkubwa kuliko Ai
  rationale: Kiwakilishi kinarejelea mji. 'Mkubwa kuliko' huhifadhi uwezekano wa kurejelea ukubwa na pia umaarufu au umuhimu.
- source_word: וְכָל אֲנָשֶׁיהָ
  choice: na wanaume wake wote
  rationale: אֲנָשִׁים katika muktadha huu inawahusu wanaume wa mji, hasa wenye uwezo wa kupigana, si wakazi wote bila kubainisha jinsia.
- source_word: גִּבֹּרִים
  choice: walikuwa mashujaa
  rationale: גִּבּוֹרִים mara nyingi humaanisha mashujaa au wapiganaji hodari. 'Mashujaa' ni ya asili na hudumisha maana ya nguvu na ushujaa bila kuongeza neno lisilolazimu katika matini kuu.
theological_decisions: []
