source:
  edition: WLC
  text: אָ֣ז יְדַבֵּ֤ר יְהוֹשֻׁעַ֙ לַֽ/יהוָ֔ה בְּ/י֗וֹם תֵּ֤ת יְהוָה֙ אֶת הָ֣/אֱמֹרִ֔י לִ/פְנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֣אמֶר לְ/עֵינֵ֣י יִשְׂרָאֵ֗ל שֶׁ֚מֶשׁ בְּ/גִבְע֣וֹן דּ֔וֹם וְ/יָרֵ֖חַ בְּ/עֵ֥מֶק אַיָּלֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/012.yaml
  text: Then Joshua spoke to Yahweh on the day when Yahweh gave the Amorites over before the sons of Israel[a], and he said in the sight of Israel, “Sun, stand still at Gibeon, and moon[c][b], in the Valley of Aijalon.”
translation:
  language: sw
  text: 'Ndipo Yoshua akamwambia Yahwe siku ambayo Yahwe aliwatia Waamori mikononi mwa wana wa Israeli[a]. Akasema mbele ya Israeli,


    “Ewe jua, simama tuli[b] huko Gibeoni;

    nawe mwezi, katika Bonde la Aiyaloni.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.” Kiebrania kinasema kihalisi “wana wa Israeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “tulia” au “acha kusonga.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwa tuli au kukoma.
    reason: lexical_alternative
  - marker: c
    text: Kiebrania kinasema, “nawe mwezi, katika Bonde la Aiyaloni,” bila kurudia kitenzi. Amri “simama tuli” kutoka kishazi kilichotangulia inaeleweka pia hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַבֵּר ... וַיֹּאמֶר
  choice: akanena ... Akasema
  rationale: Kutumia vitenzi tofauti kunahifadhi tofauti ya Kiebrania kati ya דבר na אמר, huku Kiswahili kikiendelea kuwa cha kawaida na chenye hadhi.
- source_word: לַיהוָה
  choice: na Yahwe
  rationale: Kihusishi kinaonyesha kuwa Yoshua alinena na Yahwe; jina la agano יהוה limetoholewa kama “Yahwe.”
- source_word: בְּיוֹם תֵּת יְהוָה
  choice: siku ambayo Yahwe aliwatia
  rationale: Muundo huu unaonyesha wakati. “Siku ambayo” ni wa asili katika Kiswahili na huhifadhi rejeo la siku hiyo.
- source_word: הָאֱמֹרִי
  choice: Waamori
  rationale: Nomino ya umoja katika Kiebrania imetumiwa kwa maana ya jamii nzima; wingi ndio wa wazi zaidi katika muktadha wa vita.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: mikononi mwa wana wa Israeli
  rationale: Katika muktadha wa vita, נתן לפני inaeleza kuwakabidhi adui ili Israeli wawashinde. Nahau ya Kiswahili “kutia mikononi mwa” huwasilisha maana hiyo kwa kawaida, huku “wana wa Israeli” ikihifadhi taswira ya kifamilia ya Kiebrania.
- source_word: לְעֵינֵי יִשְׂרָאֵל
  choice: mbele ya Israeli wote
  rationale: Nahau ya Kiebrania ina maana ya kusema hadharani, Israeli wakiwa mashahidi. Tafsiri hii ni ya kawaida kuliko “machoni pa Israeli.”
- source_word: שֶׁמֶשׁ ... דּוֹם
  choice: Ewe jua, simama tuli
  rationale: דום inaweza kumaanisha kutulia, kunyamaza, au kukoma. Katika amri kwa jua, “simama tuli” huonyesha kutosonga bila kufafanua kisayansi namna tukio lilivyotokea.
- source_word: בְּגִבְעוֹן
  choice: huko Gibeoni
  rationale: Kihusishi ב kinaweza kuwa “katika,” “huko,” au “juu ya” kulingana na mtazamo wa mahali. “Huko Gibeoni” huacha uhusiano kamili wa anga ukiwa mpana.
- source_word: וְיָרֵחַ בְּעֵמֶק אַיָּלוֹן
  choice: nawe mwezi, katika Bonde la Aiyaloni
  rationale: Kishazi cha pili hakina kitenzi kilichoandikwa; amri ya kishazi cha kwanza inaeleweka pia hapa. Muundo wa kishairi umehifadhiwa badala ya kuongeza kitenzi kimya kimya.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יהוה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina la agano יהוה lenyewe. “Yahwe” hulihifadhi kama jina maalumu badala ya kulibadili kuwa cheo.
- issue: Asili ya amri kwa jua na mwezi
  choice: Lugha ya tukio imehifadhiwa bila maelezo ya kisayansi
  alternative: Kufafanua kuwa dunia ilisimama au kwamba lugha ni ya kimtazamo pekee
  rationale: Mstari unaamuru jua na mwezi vitulie lakini hauelezi utaratibu wa tukio; tafsiri haipaswi kutatua jambo ambalo maandishi yenyewe hayalifafanui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaosomeka kwa urahisi. Mpangilio wa kishairi umehifadhiwa katika amri kwa jua na mwezi; majina Gibeoni na Aiyaloni yamezoeshwa kwa tahajia ya Kiswahili.
