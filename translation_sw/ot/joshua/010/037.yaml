base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/037.yaml
  text: And they captured it and struck it with the edge of the sword[a], along with its king, all its cities, and every person who was in it. He left no survivor, just as he had done to Eglon. He devoted it to destruction, along with every person who was in it.
translation:
  language: sw
  text: Nao wakauteka na kuupiga kwa makali ya upanga, pamoja na mfalme wake, miji yake yote, na kila mtu aliyekuwa ndani yake. Hakuacha aliyenusurika hata mmoja, kama alivyofanya kwa Egloni. Akauweka wakfu kwa maangamizi[a], pamoja na kila mtu aliyekuwa ndani yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Akauangamiza kabisa.” Kiebrania kinatumia neno ḥerem, yaani, kuuweka wakfu kwa maangamizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: wakauteka
  rationale: Kitenzi לכד humaanisha kuteka au kushika mji katika vita; “wakauteka” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: kuupiga kwa makali ya upanga
  rationale: Neno נכה lina maana pana ya kupiga, na nahau לְפִי חֶרֶב hurejelea makali ya upanga. Tafsiri hii inadumisha taswira na kitendo cha kijeshi bila kupunguza maana kuwa ushindi tu.
- source_word: כָּל עָרֶיהָ
  choice: miji yake yote
  rationale: Neno עִיר linaweza kumaanisha mji mkubwa au mdogo; “miji” linadumisha ulinganifu wa karibu bila kuamua ukubwa wa makazi yaliyotegemea mji mkuu.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: kila mtu aliyekuwa ndani yake
  rationale: Katika muktadha huu נֶפֶשׁ humaanisha mtu au uhai, si nafsi isiyo ya kimwili; “kila mtu” ni wazi na ya kawaida.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: Yeye hakuacha mtu yeyote aliyenusurika
  rationale: Kitenzi cha umoja kinaelekea kumrejelea Yoshua katika muhtasari wa tendo hilo. שָׂרִיד ni mtu aliyebaki au aliyenusurika.
- source_word: וַיַּחֲרֵם
  choice: Akauweka wakfu kwa maangamizi
  rationale: Hifili ya חרם hapa ina maana ya kuuweka mji chini ya ḥerem, yaani kuutenga rasmi kwa maangamizi. Kauli hii inahifadhi uzito wa neno hilo la kiufundi.
theological_decisions:
- issue: Maana ya חרם katika muktadha wa vita na hukumu
  choice: Akauweka wakfu kwa maangamizi
  alternative: Akauangamiza kabisa
  rationale: Kauli iliyochaguliwa inahifadhi kwa pamoja wazo la kuwekwa wakfu na matokeo ya maangamizi, bila kulifanya neno hilo limaanishe uharibifu tu. Tanbihi inatoa tafsiri mbadala iliyo wazi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unadumisha badiliko la kiima kutoka wingi (“wakauteka”) kwenda umoja (“Yeye hakuacha”; “Akauweka”), kama lilivyo katika Kiebrania, huku “Yeye” likisaidia kufanya badiliko hilo lieleweke.
