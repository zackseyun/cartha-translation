lexical_decisions:
- source_word: וַיָּשָׁב
  choice: akarudi
  rationale: Kitenzi שוב katika mfululizo wa simulizi kinaonyesha kurudi; “akarudi” ni tafsiri ya kawaida, fupi, na ya asili katika muktadha huu wa safari ya kijeshi.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Jina limetolewa kwa umbo la Kiswahili linalotumika kwa kawaida katika tafsiri za Biblia.
- source_word: וְכָל יִשְׂרָאֵל
  choice: pamoja na Israeli wote
  rationale: Neno la Kiebrania ni “Israeli wote” kwa maana ya jumuiya kwa pamoja; muundo huu unaepuka kulifafanua moja kwa moja kuwa kila Mwisraeli mmoja mmoja, na katika sentensi hii unaonyesha walioandamana na Yoshua.
- source_word: עִמּוֹ
  choice: pamoja na
  rationale: Hutoa kwa kawaida maana ya kuandamana naye; anayerejelewa anaeleweka wazi kuwa Yoshua.
- source_word: אֶל הַמַּחֲנֶה
  choice: hadi kambini
  rationale: אֶל huonyesha mwendo kuelekea mahali, na מַחֲנֶה hapa ni kambi ya kijeshi. “Hadi kambini” ni Kiswahili cha asili kinachoonyesha kikomo cha safari bila kudai zaidi ya maandishi.
- source_word: הַגִּלְגָּלָה
  choice: huko Gilgali
  rationale: Kiishio cha mwelekeo -ָה kinaonyesha kuelekea Gilgali. Katika Kiswahili, baada ya “hadi kambini,” “huko Gilgali” hutaja mahali kambi ilipokuwa kwa mtiririko wa kawaida; tanbihi inahifadhi muundo halisi zaidi.
