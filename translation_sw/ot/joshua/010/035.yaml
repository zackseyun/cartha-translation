  text: וַֽ/יִּלְכְּד֜וּ/הָ בַּ/יּ֤וֹם הַ/הוּא֙ וַ/יַּכּ֣וּ/הָ לְ/פִי חֶ֔רֶב וְ/אֵת֙ כָּל הַ/נֶּ֣פֶשׁ אֲשֶׁר בָּ֔/הּ בַּ/יּ֥וֹם הַ/ה֖וּא הֶחֱרִ֑ים כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה לְ/לָכִֽישׁ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/035.yaml
  text: And they captured it that day and struck it with the edge of the sword[a], and every person who was in it he devoted to destruction that day[b], according to all that he had done to Lachish.
translation:
  language: sw
  text: Nao wakauteka mji huo siku hiyo na kuupiga kwa makali ya upanga. Yoshua akamweka chini ya marufuku ya kuangamizwa[a] kila mtu aliyekuwa ndani yake siku hiyo, kama alivyofanya kwa Lakishi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamwangamiza kabisa.” Kitenzi cha Kiebrania humaanisha kumweka mtu au kitu chini ya marufuku ya kuangamizwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: wakauteka mji huo
  rationale: Kitenzi לכד katika muktadha wa kijeshi humaanisha kuuteka mji. Nomino “mji” imewekwa wazi kwa kuwa kiwakilishi cha Kiebrania kinarejelea Egloni katika mstari uliotangulia.
- source_word: בַּיּוֹם הַהוּא
  choice: siku hiyo
  rationale: Ni usemi wa kawaida wa wakati na unadumisha msisitizo kwamba matendo hayo yalitokea siku ileile.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: kuupiga kwa makali ya upanga
  rationale: Tafsiri hii inadumisha taswira ya nahau ya Kiebrania, ambayo kihalisi hutaja “kinywa cha upanga,” huku ikieleweka kwa Kiswahili cha sasa.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: kila mtu aliyekuwa ndani yake
  rationale: נֶפֶשׁ hapa humaanisha mtu aliye hai, si nafsi isiyo ya mwili; “kila mtu” huepuka maana ya kiteolojia isiyokusudiwa.
- source_word: הֶחֱרִים
  choice: akamweka chini ya hukumu ya kuangamizwa
  rationale: Muundo wa Hifili wa חרם unaonyesha kutengwa chini ya marufuku takatifu kwa ajili ya kuangamizwa. Usemi huu unahifadhi uzito huo kuliko “akaangamiza” peke yake.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלָכִישׁ
  choice: kama alivyoufanyia Lakishi
  rationale: כְּכֹל huonyesha ulinganifu na tendo la awali huko Lakishi. Kiswahili hiki ni cha kawaida na kinahifadhi rejeo kwa tendo la Yoshua.
theological_decisions:
- issue: Maana ya חרם katika simulizi la ushindi
  choice: akamweka chini ya hukumu ya kuangamizwa
  alternative: akamwangamiza kabisa
  rationale: Chaguo hili linahifadhi maana maalumu ya kitu au mtu kuwekwa chini ya marufuku ya kuangamizwa, bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Maana ya נֶפֶשׁ katika idadi ya watu wa mji
  choice: mtu
  alternative: nafsi
  rationale: Katika muktadha huu neno hilo linamaanisha mtu aliye hai; “nafsi” lingeweza kudokeza madai ya kianthropolojia ambayo kifungu hakikusudii.
- issue: Mabadiliko kutoka wingi kwenda umoja katika vitenzi
  choice: Jeshi linatajwa kwa wingi katika kuteka na kupiga, kisha Yoshua kwa umoja katika kutekeleza hukumu na kulinganisha na Lakishi
  alternative: Kutumia “wao” katika kifungu chote
  rationale: הֶחֱרִים na עָשָׂה ni vitenzi vya nafsi ya tatu umoja wa kiume, tofauti na וַיִּלְכְּדוּהָ na וַיַּכּוּהָ vya wingi. Kumtaja Yoshua wazi kunaonyesha mabadiliko hayo ya kisarufi bila kiwakilishi chenye utata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Makali ya upanga” yanahifadhi taswira ya Kiebrania; “Yoshua” ametajwa wazi ili kuonyesha kwa kawaida mabadiliko ya kisarufi kutoka vitenzi vya wingi kwenda vya umoja.
