base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/041.yaml
  text: And Joshua struck them from Kadesh-barnea as far as Gaza[a], and all the land of Goshen, as far as Gibeon.
translation:
  language: sw
  text: Yoshua akawashinda[a] kuanzia Kadeshi-Barnea hadi Gaza, na nchi yote ya Gosheni hadi Gibeoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawapiga.” Kitenzi cha Kiebrania kinaweza kumaanisha kuwapiga watu vitani au kuwashinda, bila kubainisha sikuzote namna hasa walivyopigwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: akawashinda
  rationale: Kitenzi נכה katika muktadha wa kijeshi kinaweza kumaanisha kupiga au kushinda. “Akawashinda” ni Kiswahili cha kawaida na hakibainishi bila ulazima kwamba kila mmoja aliuawa.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: kuanzia Kadeshi-Barnea
  rationale: מִן hapa huonyesha mwanzo wa eneo lililofikiwa katika kampeni; “kuanzia” huwasilisha mpaka huo wa kijiografia kwa kawaida.
- source_word: וְעַד עַזָּה
  choice: hadi Gaza
  rationale: עַד huonyesha umbali au mpaka wa eneo, kwa hiyo “hadi” inafaa kuliko lugha ya kuelekea mahali tu.
- source_word: וְאֵת כָּל אֶרֶץ גֹּשֶׁן
  choice: na katika nchi yote ya Gosheni
  rationale: אֵת hutambulisha eneo jingine lililoathiriwa na tendo la kitenzi. Kuongeza “katika” hufanya sentensi iwe ya asili kwa Kiswahili bila kubadili maana.
- source_word: וְעַד גִּבְעוֹן
  choice: hadi Gibeoni
  rationale: עַד tena huonyesha mpaka wa kijiografia wa kampeni.
