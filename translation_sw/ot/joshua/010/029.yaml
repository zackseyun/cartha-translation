  text: Then Joshua[a], and all Israel with him, passed on from Makkedah to Libnah and fought against Libnah.
translation:
  language: sw
  text: Kisha Yoshua, pamoja na Israeli wote waliokuwa naye, akaondoka Makeda kwenda Libna, akapigana dhidi ya Libna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kiebrania, “akapigana na Libna”; katika muktadha huu kirai hicho kinamaanisha kupigana dhidi ya mji huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: wakaondoka ... wakaenda
  rationale: Katika simulizi hili la jeshi kuhama kutoka eneo moja kwenda jingine, kitenzi עבר kinaonyesha kuondoka na kusonga mbele; muundo huu ni wa kawaida kwa Kiswahili na haudokezi kuvuka mto.
- source_word: עִמּוֹ
  choice: waliokuwa pamoja naye
  rationale: Kirai hiki kinaonyesha kwamba Israeli wote waliandamana na Yoshua.
- source_word: מִמַּקֵּדָה
  choice: Makeda
  rationale: Kihusishi מן kinaonyesha mahali walipoondoka; maana hiyo imewasilishwa kwa kitenzi “wakaondoka,” huku jina la mahali likinakiliwa kwa tahajia ya Kiswahili.
- source_word: לִבְנָה
  choice: Libna
  rationale: Hapa Libna ndilo eneo walilolielekea; jina limenakiliwa badala ya kutafsiriwa.
- source_word: וַיִּלָּחֶם
  choice: kupigana
  rationale: Kitenzi לחם katika muktadha huu humaanisha kushiriki vitani au kupigana.
- source_word: עִם לִבְנָה
  choice: dhidi ya Libna
  rationale: Ingawa עִם kwa kawaida humaanisha “na” au “pamoja na,” baada ya לחם humtambulisha mpinzani. “Dhidi ya” huonyesha wazi maana hiyo katika Kiswahili.
