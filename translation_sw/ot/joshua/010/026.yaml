  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יַּכֵּ֨/ם יְהוֹשֻׁ֤עַ אַֽחֲרֵי כֵן֙ וַ/יְמִיתֵ֔/ם וַ/יִּתְלֵ֕/ם עַ֖ל חֲמִשָּׁ֣ה עֵצִ֑ים וַ/יִּֽהְי֛וּ תְּלוּיִ֥ם עַל הָ/עֵצִ֖ים עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/026.yaml
  text: After this Joshua struck them down and put them to death[a], and he hanged them on five trees; and they remained hanging on the trees until the evening.
translation:
  language: sw
  text: Baada ya hayo, Yoshua akawapiga na akawaua; kisha akawatundika[a] kwenye miti mitano. Nao wakaendelea kuning’inia kwenye miti hiyo mpaka jioni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawaning’iniza.” Kitenzi cha Kiebrania humaanisha kutundika mwili kwenye mti au mbao; “kuwatundika” hakibainishi mbinu mahsusi ya utekelezaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: akawapiga
  rationale: Kitenzi נכה katika Hifili chenye kiambishi cha nafsi ya tatu wingi kinaonyesha kuwapiga. Tafsiri hii haitangulizi maana ya kuwaua, kwa kuwa kitenzi kinachofuata וַיְמִיתֵם kinataja kifo waziwazi.
- source_word: אַחֲרֵי כֵן
  choice: Baada ya hayo
  rationale: Ni usemi wa wakati unaoonyesha mfuatano wa matukio; huu ni Kiswahili cha kawaida na cha simulizi.
- source_word: וַיְמִיתֵם
  choice: kuwaua
  rationale: Hifili ya מות ina maana ya kusababisha wafe. Katika Kiswahili, ‘kuwaua’ ni ya moja kwa moja na ya asili katika muktadha huu wa hukumu ya kifo.
- source_word: וַיִּתְלֵם
  choice: akawatundika
  rationale: תלה humaanisha kutundika au kuning’iniza mwili juu ya mti au kitu cha mbao. ‘Akawatundika’ huhifadhi tendo bila kubainisha isivyo hakika kwamba waliuawa kwa kunyongwa au walichomwa kwa miti.
- source_word: עַל חֲמִשָּׁה עֵצִים
  choice: juu ya miti mitano
  rationale: עֵץ kwa maana yake ya kawaida ni ‘mti’ au ‘mbao.’ ‘Miti mitano’ ndiyo tafsiri ya moja kwa moja na haiongezi aina maalumu ya kifaa cha adhabu.
- source_word: וַיִּהְיוּ תְּלוּיִם
  choice: wakaendelea kuning’inia
  rationale: Muundo wa היה pamoja na kauli tendwa ya hali unaonyesha hali iliyoendelea; ‘wakaendelea kuning’inia’ huwasilisha udumifu huo kwa Kiswahili cha asili.
- source_word: עַד הָעָרֶב
  choice: mpaka jioni
  rationale: Hutaja kikomo cha wakati. ‘Mpaka jioni’ ni sahihi na haifasiri jioni kuwa machweo pekee.
theological_decisions:
- issue: Maana ya עֵץ katika muktadha wa kuonyesha miili ya waliouawa
  choice: miti
  alternative: nguzo za mbao
  rationale: Neno la Kiebrania linaweza kumaanisha mti au mbao, lakini simulizi halibainishi kifaa maalumu. ‘Miti’ huhifadhi maana ya wazi ya chanzo bila kuingiza taswira ya jukwaa la kunyongea au njia maalumu ya kuwaua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Muundo unatofautisha kupigwa na kuuawa, na huepuka kudai kwamba kutundikwa ndiko kulikosababisha kifo.
