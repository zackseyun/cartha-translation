base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/031.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Libnah to Lachish[b], and camped against it and fought against it.
translation:
  language: sw
  text: Kisha Yoshua, pamoja na Israeli wote waliokuwa naye, akaendelea[a] kutoka Libna hadi Lakishi, akapiga kambi dhidi ya mji huo[b] na akapigana dhidi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya karibu zaidi, “akapita.” Hapa kitenzi kinaonyesha kusonga kwa jeshi kutoka mji mmoja hadi mwingine.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana ya neno kwa neno, “akapiga kambi juu yake”; katika muktadha wa kijeshi, maana yake ni kupiga kambi dhidi ya mji huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: wakaondoka
  rationale: Kitenzi עבר humaanisha kupita au kuvuka; katika muktadha huu kinaeleza jeshi kuondoka sehemu moja na kusonga hadi nyingine, bila kudokeza lazima kuvuka mto.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: pamoja na Israeli wote waliokuwa naye
  rationale: Huhifadhi Israeli kama jina la pamoja la watu au jeshi lililoandamana na Yoshua, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: מִלִּבְנָה לָכִישָׁה
  choice: Libna kwenda Lakishi
  rationale: Kiambishi elekezi katika לָכִישָׁה kinaonyesha mwendo wenye Lakishi kama mahali pa kufikiwa; “kwenda Lakishi” huwasilisha maana hiyo kwa ufasaha.
- source_word: וַיִּחַן עָלֶיהָ
  choice: wakapiga kambi dhidi ya mji huo
  rationale: חנה ni kupiga kambi, na עַל katika muktadha huu wa vita huonyesha msimamo wa uadui dhidi ya mji, si ukaribu wa mahali tu.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: na kupigana nao
  rationale: Kitenzi לחם katika muundo huu humaanisha kupigana au kufanya vita; kiwakilishi “nao” kinarejelea mji wa Lakishi kama upande ulioshambuliwa.
