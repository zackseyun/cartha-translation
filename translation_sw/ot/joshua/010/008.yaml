base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/008.yaml
  text: And Yahweh said to Joshua, “Do not fear them, for I have given them into your hand. Not a man among them will stand before you.”
translation:
  language: sw
  text: Yahwe akamwambia Yoshua, “Usiwaogope, kwa maana nimewatia mikononi mwako. Hakuna hata mmoja miongoni mwao atakayesimama mbele yako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la agano la Mungu limetoholewa moja kwa moja kwa tahajia ya kawaida ya Kiswahili badala ya kubadilishwa kuwa cheo kama ‘BWANA’.
- source_word: וַיֹּאמֶר
  choice: akamwambia
  rationale: Muundo wa masimulizi wa וַיֹּאמֶר pamoja na אֶל יְהוֹשֻׁעַ unawasilishwa kwa Kiswahili cha kawaida kama ‘akamwambia Yoshua’.
- source_word: אַל תִּירָא מֵהֶם
  choice: Usiwaogope
  rationale: Kitenzi ירא na kihusishi מן kinaonyesha watu wanaoogopwa; ‘usiwaogope’ ni sahihi, fupi, na ya kawaida katika Kiswahili.
- source_word: כִּי
  choice: kwa maana
  rationale: Inaingiza sababu ya Yoshua kutowaogopa; ‘kwa maana’ hudumisha uhusiano huo wa maelezo kwa lugha yenye hadhi.
- source_word: בְיָדְךָ נְתַתִּים
  choice: nimewatia mikononi mwako
  rationale: Usemi huu unahifadhi taswira ya Kiebrania ya kuwakabidhi maadui katika mamlaka ya Yoshua. Wakati timilifu unaonyesha uamuzi wa Mungu kuwa hakika kana kwamba tayari umetimizwa.
- source_word: לֹא יַעֲמֹד אִישׁ מֵהֶם
  choice: Hakuna hata mmoja wao atakayeweza kusimama
  rationale: אִישׁ hapa ina nguvu ya ‘hata mmoja’ miongoni mwa wapiganaji. Kuongeza ‘atakayeweza’ kunadhihirisha maana ya kijeshi ya kutoweza kustahimili bila kubadili ahadi.
- source_word: בְּפָנֶיךָ
  choice: mbele yako
  rationale: Huhifadhi nahau ya Kiebrania, ambayo katika muktadha wa vita inamaanisha kusimama dhidi ya Yoshua au kumzuia.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA; Yehova
  rationale: Maandishi yana jina maalumu la Mungu, si cheo. ‘Yahwe’ hulihifadhi kwa umbo linalosomeka kwa urahisi katika Kiswahili.
- issue: Nguvu ya wakati katika נְתַתִּים
  choice: nimewatia
  alternative: nitawatia; ninawatia
  rationale: Kauli timilifu katika ahadi ya Mungu inaonyesha tendo lililoamuliwa kwa uhakika na lenye matokeo ya sasa; wakati timilifu wa Kiswahili unadumisha mvutano huo.
- issue: Uwakilishi wa אִישׁ katika jeshi la maadui
  choice: hata mmoja wao
  alternative: mwanaume hata mmoja wao
  rationale: Katika kishazi hasi, אִישׁ kwa kawaida humaanisha ‘hakuna hata mmoja.’ Muktadha tayari unaonyesha kwamba wanaorejelewa ni wapiganaji, hivyo tafsiri hii haibadili jinsia wala kupanua rejeo kwa wanadamu wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Yahwe akamwambia Yoshua’ ni wa kawaida katika masimulizi; ‘mikononi mwako’ huhifadhi sitiari ya chanzo huku wingi wa Kiswahili ukiwa wa kiasili.
