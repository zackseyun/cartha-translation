id: JOS.10.1
reference: Joshua 10:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹֽנִי צֶ֜דֶק מֶ֣לֶךְ יְרוּשָׁלִַ֗ם כִּֽי לָכַ֨ד יְהוֹשֻׁ֣עַ אֶת הָ/עַי֮ וַ/יַּחֲרִימָ/הּ֒ כַּ/אֲשֶׁ֨ר עָשָׂ֤ה לִֽ/ירִיחוֹ֙ וּ/לְ/מַלְכָּ֔/הּ כֵּן עָשָׂ֥ה לָ/עַ֖י וּ/לְ/מַלְכָּ֑/הּ וְ/כִ֨י הִשְׁלִ֜ימוּ יֹשְׁבֵ֤י גִבְעוֹן֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽהְי֖וּ בְּ/קִרְבָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/001.yaml
  text: It happened[a], when Adoni-zedek king of Jerusalem heard that Joshua had captured Ai and had devoted it to destruction, just as he had done to Jericho and its king, so he had done to Ai and its king, and that the inhabitants of Gibeon had made peace with Israel and were among them[b],
translation:
  language: sw
  text: Ikawa Adoni-Sedeki, mfalme wa Yerusalemu, aliposikia kwamba Yoshua alikuwa ameuteka mji wa Ai na kuuweka wakfu ili uangamizwe[a], kwamba kama alivyofanya kwa Yeriko na mfalme wake, ndivyo alivyofanya kwa Ai na mfalme wake, na kwamba wakazi wa Gibeoni walikuwa wamefanya amani na Israeli[b] na walikuwa miongoni mwao,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuuangamiza kabisa.” Kiebrania hutumia lugha ya חרם, yaani kuiweka wakfu ili iangamizwe.
    reason: lexical_alternative
  - marker: b
    text: Au, “walikuwa wameafikiana masharti ya amani na Israeli.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Hufungua tukio jipya katika simulizi bila kuongeza neno la wakati lisilokuwamo wazi katika Kiebrania.
- source_word: כִשְׁמֹעַ
  choice: aliposikia
  rationale: Muundo wa כ pamoja na kitenzi-jina unaonyesha hali ya wakati; ‘aliposikia’ ni Kiswahili cha kawaida na huendeleza simulizi vizuri.
- source_word: אֲדֹנִי צֶדֶק
  choice: Adoni-Sedeki
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa Kiswahili, huku kistari kikihifadhi muundo wake wa sehemu mbili.
- source_word: מֶלֶךְ יְרוּשָׁלַם
  choice: mfalme wa Yerusalemu
  rationale: Uhusiano wa cheo na mahali umetafsiriwa moja kwa moja na kwa Kiswahili cha kawaida.
- source_word: לָכַד אֶת הָעַי
  choice: alikuwa ameuteka mji wa Ai
  rationale: לכד katika muktadha huu ni kuteka mji; kuongeza ‘mji wa’ huwezesha viambishi vya ngeli kuwa wazi na vya asili kwa Kiswahili.
- source_word: וַיַּחֲרִימָהּ
  choice: na kuuweka wakfu kwa maangamizi
  rationale: Tafsiri hii huhifadhi maana ya חרם ya kutenga kitu kwa kusudi la kuangamizwa, badala ya kuibana kuwa uharibifu wa kijeshi tu.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: kama ... ndivyo
  rationale: Muundo huu wa Kiswahili huhifadhi ulinganisho sambamba na msisitizo wa Kiebrania.
- source_word: עָשָׂה לִירִיחוֹ וּלְמַלְכָּהּ
  choice: alivyofanya kwa Yeriko na mfalme wake
  rationale: ‘Kufanya kwa’ huhifadhi urudiaji wa עשה katika mstari bila kueleza zaidi tendo ambalo muktadha tayari umeonyesha.
- source_word: הִשְׁלִימוּ ... אֶת יִשְׂרָאֵל
  choice: walikuwa wamefanya amani na Israeli
  rationale: Hiphil ya שלם hapa inaeleza kuingia katika uhusiano wa amani; usemi huu ni wazi na wa kawaida kwa Kiswahili.
- source_word: יֹשְׁבֵי גִבְעוֹן
  choice: wakazi wa Gibeoni
  rationale: Partisipio limetumika kama nomino ya watu wanaokaa mjini; ‘wakazi’ ni neno la sasa na linaloeleweka kwa urahisi.
- source_word: וַיִּהְיוּ בְּקִרְבָּם
  choice: na walikuwa miongoni mwao
  rationale: Huhifadhi maana ya kuwamo katikati ya jamii ya Israeli bila kuongeza ufafanuzi usiotajwa moja kwa moja.
theological_decisions:
- issue: Maana ya חרם katika simulizi la kutekwa kwa miji
  choice: kuuweka wakfu kwa maangamizi
  alternative: kuuangamiza kabisa
  rationale: חרם ina wazo la kutenga au kuweka kitu chini ya hukumu kwa kuangamizwa, si uharibifu wa kijeshi pekee. Tafsiri iliyochaguliwa huhifadhi uzito huo wa kiibada na hukumu bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya usimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imeachwa ikiendelea kwa koma kwa sababu mstari huu ni kishazi kirefu kinachokamilishwa katika mstari unaofuata. Mistari mirefu imetenganishwa kwa vistari virefu ili kuweka wazi ulinganisho wa Yeriko na Ai.
