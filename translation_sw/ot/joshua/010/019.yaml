base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/019.yaml
  text: But as for you[a], do not stand still; pursue your enemies and strike their rear guard. Do not let them enter their cities, for Yahweh your God has given them into your hand.
translation:
  language: sw
  text: Lakini ninyi, msisimame; wafuatilieni adui zenu, na muwapige walio nyuma kabisa.[a] Msiwaache waingie katika miji yao, kwa maana Yahwe Mungu wenu amewatia mikononi mwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwapiga mkiani”; kitenzi cha Kiebrania humaanisha kushambulia sehemu ya nyuma ya kundi au jeshi linalokimbia, yaani wale walio nyuma kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Lakini ninyi
  rationale: Kiunganishi pamoja na kiwakilishi huru kinatilia mkazo tofauti kati ya hawa wanaopewa amri na wale waliotajwa katika muktadha uliotangulia.
- source_word: אַל תַּעֲמֹדוּ
  choice: msisimame
  rationale: Maana ya msingi ni ‘kusimama,’ lakini katika muktadha huu ni agizo la kutokatiza au kuacha kuwafuatilia adui.
- source_word: רִדְפוּ אַחֲרֵי אֹיְבֵיכֶם
  choice: wafuatilieni adui zenu
  rationale: Huu ni usemi wa kawaida wa Kiebrania unaomaanisha kuwafukuza au kuwafuatilia adui wanaokimbia; ‘wafuatilieni’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: וְזִנַּבְתֶּם אוֹתָם
  choice: na kuwashambulia walio nyuma kabisa
  rationale: Kitenzi kinahusiana na ‘mkia’ na hapa humaanisha kushambulia sehemu ya mwisho ya jeshi linalokimbia. Tafsiri hii inaeleza tendo hilo bila kudhani kwamba kulikuwa na kikosi rasmi cha ulinzi wa nyuma.
- source_word: אַל תִּתְּנוּם לָבוֹא
  choice: Msiwaache waingie
  rationale: נתן pamoja na kitenzi-jina hapa ni usemi wa kuruhusu; ‘msiwaache waingie’ ni ulinganifu wa kawaida wa Kiswahili.
- source_word: אֶל עָרֵיהֶם
  choice: katika miji yao
  rationale: עיר linaweza kumaanisha mji au jiji; ‘miji’ linafaa kwa makazi yenye ngome katika simulizi hili.
- source_word: כִּי נְתָנָם
  choice: kwa maana ... amewatia
  rationale: Kauli timilifu inaonyesha ushindi kama jambo ambalo tayari limehakikishwa kwa tendo la Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limetoholewa moja kwa moja badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Hii ni tafsiri ya moja kwa moja ya nomino pamoja na kiambishi cha nafsi ya pili wingi.
- source_word: בְּיֶדְכֶם
  choice: mikononi mwenu
  rationale: ‘Mkono’ ni nahau ya Kiebrania ya mamlaka au udhibiti. Kiswahili hutumia kwa kawaida ‘kutia mikononi mwa’ kuonyesha kukabidhi chini ya mamlaka ya mtu.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA au Yehova
  rationale: Maandishi ya Kiebrania yanatumia Jina la herufi nne moja kwa moja. ‘Yahwe’ huhifadhi jina hilo binafsi bila kulibadilisha na cheo, huku ‘Yehova’ likitegemea matamshi ya baadaye yaliyounganisha konsonanti na vokali za usomaji mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri umehifadhiwa, lakini nahau zimewasilishwa kwa lugha inayoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya kirai kinachohusika nayo.
