lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ndipo ... akasema
  rationale: Muundo huu unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida na kuhifadhi wazo la kitendo kinachofuata.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: פִּתְחוּ
  choice: Fungueni
  rationale: Ni amri kwa watu wengi na tafsiri ya moja kwa moja, ya kawaida, ya kitenzi cha Kiebrania.
- source_word: פִּי הַמְּעָרָה
  choice: mlango wa pango
  rationale: Kiebrania kinasema kihalisi ‘kinywa cha pango,’ lakini ‘mlango wa pango’ ni usemi wa asili na unaoeleweka kwa urahisi katika Kiswahili; taswira halisi imehifadhiwa katika tanbihi.
- source_word: וְהוֹצִיאוּ
  choice: kisha watoeni
  rationale: Kitenzi hiki cha kusababisha kutoka kinaonyesha kuwatoa wafalme kutoka ndani ya pango; ‘kisha’ huunganisha amri hizo kwa mtiririko wa kawaida.
- source_word: אֵלַי
  choice: na kuwaleta kwangu
  rationale: Huhifadhi wazi mwelekeo wa mwendo kuelekea kwa Yoshua, badala ya kueleza tu kwamba wafalme watolewe.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: hawa wafalme watano
  rationale: Kiwakilishi האלה kinawaonyesha wafalme maalumu waliokwisha tajwa; ‘hawa’ kinafuata kwa karibu thamani yake ya kuashiria.
- source_word: מִן הַמְּעָרָה
  choice: pangoni
  rationale: Katika Kiswahili, ‘watoeni pangoni’ huonyesha kwa ufupi na kwa kawaida mwendo wa kutoka ndani ya pango.
