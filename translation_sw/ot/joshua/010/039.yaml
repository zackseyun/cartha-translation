    text: Au, “wakawaweka chini ya maangamizi.” Kiebrania kinatumia neno ḥerem kwa mtu au kitu kilichowekwa wakfu kwa maangamizi kamili.
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s singular/plural shifts and all substantive lexical choices. It replaces only the stiff comparative phrasing with idiomatic Swahili and adjusts the footnote so that its explanation of ḥerem fits the human referent in this verse.
