  text: וַֽ/יִּלְכְּדָ֞/הּ וְ/אֶת מַלְכָּ֤/הּ וְ/אֶת כָּל עָרֶ֨י/הָ֙ וַ/יַּכּ֣וּ/ם לְ/פִי חֶ֔רֶב וַֽ/יַּחֲרִ֨ימוּ֙ אֶת כָּל נֶ֣פֶשׁ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד כַּ/אֲשֶׁ֨ר עָשָׂ֜ה לְ/חֶבְר֗וֹן כֵּן עָשָׂ֤ה לִ/דְבִ֨רָ/ה֙ וּ/לְ/מַלְכָּ֔/הּ וְ/כַ/אֲשֶׁ֥ר עָשָׂ֛ה לְ/לִבְנָ֖ה וּ/לְ/מַלְכָּֽ/הּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/039.yaml
  text: And they captured it[a], along with its king and all its towns, and struck them with the edge of the sword, and they devoted to destruction every person who was in it; they left no survivor. Just as he had done to Hebron, so he did to Debir and its king, and just as he had done to Libnah and its king.
translation:
  language: sw
  text: Akauteka pamoja na mfalme wake na miji yake yote. Wakawapiga kwa makali ya upanga, wakawaangamiza kabisa[a] watu wote waliokuwa humo; hakuacha mtu yeyote aliyenusurika. Kama alivyotenda kwa Hebroni, ndivyo alivyotenda kwa Debiri na mfalme wake; na kama alivyotenda kwa Libna na mfalme wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakawaweka chini ya maangamizi.” Kiebrania kinatumia neno ḥerem kwa mtu au kitu kilichowekwa wakfu kwa maangamizi kamili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: Akauteka
  rationale: Kitenzi ni cha nafsi ya tatu umoja wa kiume, na kiambishi cha yambwa kinarejelea Debiri. Umoja umehifadhiwa badala ya kusawazishwa na vitenzi vya wingi vinavyofuata.
- source_word: כָּל עָרֶיהָ
  choice: miji yake yote
  rationale: עיר inaweza kumaanisha mji mkubwa au mji mdogo; hapa inarejelea miji iliyo chini ya Debiri. ‘Miji yake yote’ ni ya kawaida na haiongezi maelezo yasiyomo katika chanzo.
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: Wakawapiga kwa makali ya upanga
  rationale: Usemi huu unahifadhi taswira ya Kiebrania ya ‘ukingo/makali ya upanga’ kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: וַיַּחֲרִימוּ
  choice: wakawaangamiza kabisa
  rationale: חרם hapa ni istilahi ya kuwaweka watu chini ya maangamizi kamili. Tafsiri kuu ni ya asili kwa Kiswahili, huku tanbihi ikihifadhi maana yake maalumu ya kiibada-kisheria.
- source_word: כָּל נֶפֶשׁ אֲשֶׁר בָּהּ
  choice: watu wote waliokuwa humo
  rationale: נפש katika muktadha huu humaanisha watu au wakazi, si nafsi isiyo ya mwili. Wingi wa Kiswahili unasomeka kwa kawaida huku ukihifadhi ujumla wa kauli.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: hakuacha mtu yeyote aliyenusurika
  rationale: Kitenzi cha umoja katika Kiebrania kimehifadhiwa. שָׂרִיד hapa ni mtu aliyenusurika, si dhana ya mabaki kwa ujumla.
- source_word: כַּאֲשֶׁר עָשָׂה לְחֶבְרוֹן כֵּן עָשָׂה
  choice: Kama alivyokuwa ameufanyia Hebroni, ndivyo alivyofanyia
  rationale: Muundo wa kulinganisha umehifadhiwa, na wakati wa tendo lililokuwa limetangulia unaweka wazi mfuatano wa simulizi.
theological_decisions:
- issue: Lugha ya חרם katika vita
  choice: wakawaangamiza kabisa, pamoja na tanbihi inayoeleza maana maalumu
  alternative: wakawaweka wakfu kwa maangamizi
  rationale: Chaguo kuu linaeleweka kwa urahisi katika Kiswahili cha sasa; tanbihi inalinda maana ya kiufundi ya kitu kilichotengwa au kuwekwa chini ya maangamizi bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Kubadilika kwa mtendaji kutoka umoja kwenda wingi na kurudi umoja
  choice: 'Kuhifadhi mabadiliko hayo: ‘Akauteka … Wakawapiga … hakuacha’'
  alternative: Kusawazisha vitenzi vyote kuwa vya wingi au vyote kuwa vya umoja
  rationale: Kiebrania hubadilisha idadi ya mtendaji, huenda kati ya Yoshua kama kiongozi mwakilishi na jeshi la Israeli kama kundi. Kuhifadhi mvutano huo hakutatui kimya kimya jambo ambalo chanzo kimeacha katika muundo wake.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi umetumia viunganishi vya mfululizo kwa kiasi bila kuufanya mstari kuwa mzito; majina yametolewa kwa maumbo yaliyozoeleka: Hebroni, Debiri, na Libna.'
