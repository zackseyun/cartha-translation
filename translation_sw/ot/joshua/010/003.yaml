  text: וַ/יִּשְׁלַ֨ח אֲדֹנִי צֶ֜דֶק מֶ֣לֶךְ יְרוּשָׁלִַ֗ם אֶל הוֹהָ֣ם מֶֽלֶךְ חֶ֠בְרוֹן וְ/אֶל פִּרְאָ֨ם מֶֽלֶךְ יַרְמ֜וּת וְ/אֶל יָפִ֧יעַ מֶֽלֶךְ לָכִ֛ישׁ וְ/אֶל דְּבִ֥יר מֶֽלֶךְ עֶגְל֖וֹן לֵ/אמֹֽר־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/003.yaml
  text: So Adoni-zedek king of Jerusalem sent to Hoham king of Hebron, to Piram king of Jarmuth, to Japhia king of Lachish, and to Debir king of Eglon, saying,
translation:
  language: sw
  text: Basi Adoni-Sedeki, mfalme wa Yerusalemu, akatuma ujumbe kwa Hohamu, mfalme wa Hebroni, Piramu, mfalme wa Yarmuthi, Yafia, mfalme wa Lakishi, na Debiri, mfalme wa Egloni, akisema,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Basi ... akatuma ujumbe
  rationale: Kitenzi hiki kinaendeleza simulizi na maana yake ya msingi ni kutuma. “Basi” huonyesha uhusiano na mstari uliotangulia, huku “akatuma ujumbe” ikifanya wazi kwa Kiswahili cha kawaida kwamba wafalme waliotajwa ndio waliopokea maneno yake.
- source_word: אֲדֹנִי צֶדֶק
  choice: Adoni-Sedeki
  rationale: Jina la mtu limetoholewa badala ya kutafsiriwa; kistari kinaonyesha muundo wa jina ambatani na “Sedeki” linafuata uwasilishaji wa kawaida wa sauti za Kiebrania katika Kiswahili.
- source_word: מֶלֶךְ יְרוּשָׁלִַם
  choice: mfalme wa Yerusalemu
  rationale: Muundo wa umilikaji umetafsiriwa kwa namna ya kawaida ya Kiswahili, na Yerusalemu ni umbo lililozoeleka la jina la mahali.
- source_word: אֶל
  choice: kwa
  rationale: Kihusishi kinaonyesha waelekezewa wa ujumbe; “kwa” ni cha kawaida baada ya “kutuma ujumbe”.
- source_word: הוֹהָם
  choice: Hohamu
  rationale: Jina la mtu limetoholewa kwa mfumo wa sauti unaosomeka kwa Kiswahili.
- source_word: חֶבְרוֹן
  choice: Hebroni
  rationale: Jina la mahali limetoholewa kwa umbo la Kiswahili linalotambulika.
- source_word: פִּרְאָם
  choice: Piramu
  rationale: Jina la mtu limetoholewa bila kutafsiri maana yake.
- source_word: יַרְמוּת
  choice: Yarmuthi
  rationale: Jina la mahali limetoholewa kwa tahajia inayokaribia konsonanti za Kiebrania na kusomeka kiasili kwa Kiswahili.
- source_word: יָפִיעַ
  choice: Yafia
  rationale: Jina la mtu limetoholewa; umbo hili linaakisi kwa karibu matamshi ya Kiebrania na linafaa kwa Kiswahili.
- source_word: לָכִישׁ
  choice: Lakishi
  rationale: Jina la mahali limetoholewa kwa tahajia ya kawaida ya Kiswahili.
- source_word: דְּבִיר
  choice: Debiri
  rationale: Muktadha unaonyesha kuwa hili ni jina la mfalme, si nomino ya kawaida inayopatikana kwingine; kwa hiyo limetoholewa.
- source_word: עֶגְלוֹן
  choice: Egloni
  rationale: Jina la mahali limetoholewa kwa umbo linalosomeka kwa Kiswahili.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Fomula ya Kiebrania ya kuanzisha usemi imetafsiriwa moja kwa moja na kwa mtiririko wa kawaida wa simulizi la Kiswahili.
theological_decisions: []
