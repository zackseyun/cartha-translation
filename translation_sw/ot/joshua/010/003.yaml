  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Majina yametoholewa kwa maumbo yanayosomeka kiasili kwa Kiswahili. Muundo wa orodha na mwisho usiokamilika wa mstari umehifadhiwa kwa kuwa usemi unaendelea katika mstari unaofuata.
