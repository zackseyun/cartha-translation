id: JOS.10.42
reference: Joshua 10:42
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל הַ/מְּלָכִ֤ים הָ/אֵ֨לֶּה֙ וְ/אֶת אַרְצָ֔/ם לָכַ֥ד יְהוֹשֻׁ֖עַ פַּ֣עַם אֶחָ֑ת כִּ֗י יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל נִלְחָ֖ם לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/042.yaml
  text: Joshua captured all these kings and their land at one time[a], because Yahweh, the God of Israel, fought for Israel.
translation:
  language: sw
  text: Yoshua aliwateka wafalme hawa wote na kuiteka nchi yao kwa wakati mmoja[a], kwa sababu Yahwe, Mungu wa Israeli, aliipigania Israeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika kampeni moja ya kijeshi.” Kiebrania husema kihalisi “kwa wakati mmoja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד
  choice: aliwateka … na kuiteka
  rationale: Kitenzi hiki humaanisha kuteka au kushika kwa nguvu. Kurudia kitenzi kwa upatanisho tofauti kunafanya Kiswahili kiwe cha kawaida kwa wafalme na nchi bila kuzidisha maana kuwa ‘alishinda kabisa.’
- source_word: וְאֵת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: wafalme hawa wote
  rationale: Huu ni uwasilishaji wa moja kwa moja na wa kawaida wa kishazi cha Kiebrania, huku ‘hawa’ ikihifadhi kiashiria.
- source_word: וְאֶת אַרְצָם
  choice: na kuiteka nchi yao
  rationale: אֶרֶץ hapa ni eneo lililotawaliwa na wafalme hao; ‘nchi yao’ ni pana, wazi, na ya kawaida katika Kiswahili.
- source_word: פַּעַם אֶחָת
  choice: kwa wakati mmoja
  rationale: Huhifadhi kwa karibu usemi wa Kiebrania ‘wakati mmoja.’ Katika muktadha unaweza kumaanisha kampeni moja, lakini tafsiri hiyo imewekwa katika tanbihi ili kutosuluhisha maana kimyakimya.
- source_word: כִּי
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya mafanikio ya Yoshua; ‘kwa sababu’ kinaonyesha uhusiano huo wazi katika Kiswahili cha sasa.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu limeandikwa kwa unukuzi badala ya kubadilishwa na cheo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Mungu wa Israeli
  rationale: Muundo huu unawasilisha moja kwa moja kishazi cha utegemezi cha Kiebrania.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: aliipigania Israeli
  rationale: Kauli hii inaeleza kupigana kwa manufaa ya Israeli. Wakati timilifu wa Kiebrania umetafsiriwa kwa wakati uliopita unaofaa muhtasari huu wa simulizi.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahwe
  alternative: Yehova
  rationale: Andiko linatumia moja kwa moja Tetragramatoni, jina la agano la Mungu. ‘Yahwe’ hulihifadhi kama jina binafsi bila kulibadilisha kuwa cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi ni wa kawaida kwa wasomaji wengi; marudio ya ‘kuteka’ yanaepusha upatanisho usio wa kawaida kati ya wafalme na nchi. Alama ya tanbihi [a] imewekwa katika matini kuu.
