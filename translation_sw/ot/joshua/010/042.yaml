  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kiebrania: Yoshua ndiye mtenda; wafalme hawa wote pamoja na nchi yao ni vitu vya kutekwa; פַּעַם אֶחָת imetolewa kwa karibu kama “kwa wakati mmoja”; na כִּי inaonyesha sababu, yaani Yahwe kupigana kwa ajili ya Israeli.'
  naturalness: Kiswahili ni sanifu, cha sasa, na kinaeleweka. “Aliwateka wafalme ... na kuiteka nchi yao” hutumia upatanisho wa kawaida wa Kiswahili kwa watu na nchi. “Aliipigania Israeli” ni usemi wa kawaida wa kupigana kwa manufaa ya Israeli.
  terminology: “Yoshua,” “Israeli,” “Mungu wa Israeli,” na “Yahwe” zinatumika kwa uthabiti na kwa heshima. “Yahwe” ni unukuzi unaokubalika wa jina la Kiyahudi katika tahajia ya Kiswahili; haujalibadilisha kuwa cheo. Tanbihi inaweka wazi mbadala wa kimuktadha bila kuufanya kuwa maana pekee ya matini.
