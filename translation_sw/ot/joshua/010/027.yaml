  terminology: “Yoshua,” “pango,” “mawe makubwa,” na “mpaka leo hii” ni istilahi za wazi na zinazofaa kwa Kiswahili Sanifu. “Kinywa cha pango” huhifadhi sitiari ya Kiebrania na maana ya uwazi/ingilio la pango.
