  text: וַ/יְהִ֞י לְ/עֵ֣ת בּ֣וֹא הַ/שֶּׁ֗מֶשׁ צִוָּ֤ה יְהוֹשֻׁ֨עַ֙ וַ/יֹּֽרִידוּ/ם֙ מֵ/עַ֣ל הָ/עֵצִ֔ים וַ/יַּ֨שְׁלִכֻ֔/ם אֶל הַ/מְּעָרָ֖ה אֲשֶׁ֣ר נֶחְבְּאוּ שָׁ֑ם וַ/יָּשִׂ֜מוּ אֲבָנִ֤ים גְּדֹלוֹת֙ עַל פִּ֣י הַ/מְּעָרָ֔ה עַד עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/027.yaml
  text: And at the time of the sun’s going down[a], Joshua commanded, and they took them down from the trees and threw them into the cave where they had hidden there[b], and they placed large stones over the mouth of the cave to this very day.
translation:
  language: sw
  text: Ikawa wakati wa jua kutua[a], Yoshua akaamuru, nao wakawashusha kutoka mitini, wakawatupa ndani ya pango ambamo walikuwa wamejificha humo[b], kisha wakaweka mawe makubwa kwenye kinywa cha pango mpaka leo hii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa ufupi zaidi, “wakati wa machweo.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiebrania: “ambamo walikuwa wamejificha humo”; neno “humo” limetajwa wazi kwa ajili ya mkazo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת בּוֹא הַשֶּׁמֶשׁ
  choice: wakati wa jua kutua
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi picha ya jua kwenda chini; 'wakati wa machweo' ni mbadala mfupi zaidi.
- source_word: צִוָּה יְהוֹשֻׁעַ
  choice: Yoshua akaamuru
  rationale: Kitenzi kinamaanisha kuamuru; muundo huu ni wa asili katika simulizi la Kiswahili na unaunganisha tukio na yaliyotangulia.
- source_word: וַיּוֹרִידוּם מֵעַל הָעֵצִים
  choice: wakawashusha kutoka mitini
  rationale: Hueleza kwa uwazi kuwa waliwaondoa wale wafalme kutoka kwenye miti walikokuwa wametundikwa.
- source_word: וַיַּשְׁלִכֻם
  choice: wakawatupa
  rationale: Huhifadhi nguvu ya kitenzi cha Kiebrania chenye maana ya kutupa.
- source_word: הַמְּעָרָה
  choice: pango
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa mahali panapotajwa.
- source_word: אֲשֶׁר נֶחְבְּאוּ שָׁם
  choice: ambamo walikuwa wamejificha humo
  rationale: Muundo huu unahifadhi kielezi cha wazi שָׁם ('humo') na pia unaonyesha kuwa kujificha kulitokea kabla ya matendo ya sasa ya simulizi.
- source_word: וַיָּשִׂמוּ אֲבָנִים גְּדֹלוֹת
  choice: wakaweka mawe makubwa
  rationale: Ni tafsiri ya moja kwa moja, ya sasa, na ya kawaida kwa tendo la kuyaweka mawe mahali pake.
- source_word: עַל פִּי הַמְּעָרָה
  choice: mlangoni mwa pango
  rationale: Kiebrania kina 'kwenye/juu ya kinywa cha pango'; Kiswahili 'mlangoni mwa pango' hutoa maana ya ufunguzi wa pango kwa njia ya kawaida. 'Kwenye kinywa cha pango' lingeweza kuhifadhi sitiari lakini si la kawaida sana.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: mpaka leo hii
  rationale: Ni usemi wa kawaida unaohifadhi mkazo wa עֶצֶם katika 'leo hii' na hali inayoendelea hadi wakati wa msimulizi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi la Biblia lakini kinachoeleweka kwa wasomaji wa sasa. Viambishi vya mfululizo vya 'aka-/waka-' vinadumisha mwendo wa simulizi. Kifungu cha mwisho kimeweka wazi kuwa mawe ndiyo yaliyobaki hapo, jambo ambalo linaeleweka katika muktadha wa Kiebrania ingawa kiima hakirudiwi wazi katika matini chanzi.
