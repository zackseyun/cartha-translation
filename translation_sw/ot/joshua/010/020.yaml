  text: וַ/יְהִי֩ כְּ/כַלּ֨וֹת יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ/הַכּוֹתָ֛/ם מַכָּ֥ה גְדוֹלָֽה מְאֹ֖ד עַד תֻּמָּ֑/ם וְ/הַ/שְּׂרִידִים֙ שָׂרְד֣וּ מֵ/הֶ֔ם וַ/יָּבֹ֖אוּ אֶל עָרֵ֥י הַ/מִּבְצָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/020.yaml
  text: And it happened that when Joshua and the sons of Israel had finished striking them with a very great slaughter[a], until they were wiped out, and the survivors from them survived and entered the fortified cities[b],
translation:
  language: sw
  text: Ikawa, Yoshua na wana wa Israeli walipomaliza kuwapiga pigo kubwa sana, mpaka wakawa wameangamizwa, na wale walionusurika miongoni mwao walinusurika[a] na kuingia katika miji yenye ngome[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania hurudia kwa msisitizo maneno yenye mzizi mmoja: “walionusurika ... walinusurika.”'
    reason: lexical_alternative
  - marker: b
    text: Au “miji iliyozungushiwa ngome.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ikawa
  rationale: Ni utangulizi wa hatua mpya katika simulizi; “Ikawa” ni wa hadhi na wa kawaida katika simulizi ya Biblia bila kuwa mzito kupita kiasi.
- source_word: כְּכַלּוֹת
  choice: walipomaliza
  rationale: 'Kiambishi כ pamoja na infinitivi ya כלה kina maana ya wakati hapa: walipokuwa wamefikia mwisho wa tendo la kupiga.'
- source_word: בְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  rationale: Huhifadhi kwa karibu nahau ya Kiebrania na utambulisho wake wa kijumuiya; “Waisraeli” pia inawezekana.
- source_word: לְהַכּוֹתָם
  choice: kuwapiga
  rationale: Huhifadhi maana ya msingi ya נכה, huku kishazi kinachofuata kikionyesha ukubwa na matokeo ya shambulio.
- source_word: מַכָּה גְדוֹלָה מְאֹד
  choice: kwa maangamizi makubwa sana
  rationale: Katika muktadha wa vita, מכה ni pigo lenye mauti au maangamizi; chaguo hili linaonyesha uzito wa tukio kwa Kiswahili cha kawaida.
- source_word: עַד תֻּמָּם
  choice: hata wakawa wamekomeshwa
  rationale: Hutoa maana ya kufikishwa mwisho bila kudai kwamba hakubaki mtu yeyote, kwa kuwa sentensi yenyewe inataja walionusurika.
- source_word: וְהַשְּׂרִידִים שָׂרְדוּ מֵהֶם
  choice: wale walionusurika miongoni mwao walinusurika
  rationale: Huhifadhi urudiaji wa nomino na kitenzi wa Kiebrania kwa msisitizo, na “miongoni mwao” huonyesha kuwa manusura walitoka katika kundi lililoshambuliwa.
- source_word: עָרֵי הַמִּבְצָר
  choice: miji yenye ngome
  rationale: Ni usemi wa asili wa Kiswahili unaoeleza miji iliyolindwa kwa maboma au ngome.
theological_decisions:
- issue: Mvutano kati ya עַד תֻּמָּם na kutajwa kwa manusura
  choice: hata wakawa wamekomeshwa
  alternative: hata wakaangamizwa kabisa
  rationale: Chaguo kuu huhifadhi lugha kali ya kukomeshwa huku lisifute mvutano wa ndani wa mstari unaosema kwamba baadhi waliokoka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kisimulizi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa mstari umeachwa ukiendelea hadi mstari unaofuata, kama katika chanzo.
