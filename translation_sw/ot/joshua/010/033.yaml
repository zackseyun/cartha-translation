base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/033.yaml
  text: Then Horam king of Gezer went up to help Lachish[a], and Joshua struck him and his people until he left him no survivor.
translation:
  language: sw
  text: Ndipo Horamu, mfalme wa Gezeri, akapanda kwenda kuisaidia Lakishi, naye Yoshua akampiga yeye na watu wake, hata hakumwachia mtu yeyote aliyenusurika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu yeyote aliyebaki.” Neno la Kiebrania שָׂרִיד linaweza kumaanisha mtu aliyenusurika au aliyebaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Ndipo
  rationale: Huendeleza mfululizo wa simulizi kwa njia ya kawaida na yenye hadhi katika Kiswahili.
- source_word: עָלָה
  choice: akapanda kwenda
  rationale: Huhifadhi wazo la msingi la kupanda au kwenda juu bila kulifanya kwa lazima kuwa istilahi maalumu ya kijeshi.
- source_word: הֹרָם
  choice: Horamu
  rationale: Jina limetoholewa kwa mfumo wa kawaida wa majina ya kibiblia katika Kiswahili.
- source_word: מֶלֶךְ גֶּזֶר
  choice: mfalme wa Gezeri
  rationale: Huwakilisha moja kwa moja muundo unaomtambulisha Horamu kwa cheo na mji wake.
- source_word: לַעְזֹר אֶת לָכִישׁ
  choice: kwenda kuisaidia Lakishi
  rationale: Kitenzi kinaonyesha kusudi la kutoa msaada; kiambishi cha ngeli katika kuisaidia kinarejelea Lakishi kama mji.
- source_word: וַיַּכֵּהוּ
  choice: akampiga
  rationale: Huhifadhi taswira pana ya נכה, ambayo katika muktadha wa vita inaweza kumaanisha kumpiga au kumshinda, bila kuibana kwa maana moja pekee.
- source_word: וְאֶת עַמּוֹ
  choice: yeye na watu wake
  rationale: עַם ni 'watu' kwa upana; kutafsiri 'jeshi' kungeweka mpaka ambao Kiebrania hakijaweka wazi.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ
  choice: hata hakumwachia
  rationale: Hueleza kiwango au matokeo ya shambulio kwa Kiswahili cha kawaida, yaani kufikia hatua ya kutobaki mtu kwake.
- source_word: שָׂרִיד
  choice: mtu yeyote aliyenusurika
  rationale: Neno linaweza kumaanisha aliyenusurika au aliyebaki; usemi huu ni wa asili katika Kiswahili na unafaa kwa mtu mmoja kwa maana ya jumla.
