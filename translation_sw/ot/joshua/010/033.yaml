  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unabaki karibu na simulizi la Kiebrania huku ukitumia mpangilio wa maneno unaoeleweka kwa urahisi. Kiunganishi 'lakini' kinaonyesha ugeuko wa matokeo katika muktadha, ingawa Kiebrania hutumia kiunganishi cha kawaida.
