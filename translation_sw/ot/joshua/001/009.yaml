base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/009.yaml
  text: Have I not commanded you? Be strong and courageous. Do not be terrified[a], and do not be dismayed, for Yahweh your God is with you wherever you go.
translation:
  language: sw
  text: Je, sikukuamuru? Uwe hodari na jasiri. Usiingiwe na hofu wala usivunjike moyo, kwa maana Yahweh[a], Mungu wako, yuko pamoja nawe popote uendapo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiebrania YHWH, jina la Mungu; kwa desturi limetafsiriwa “BWANA.”
    reason: Inaeleza jina la Mungu katika maandishi ya Kiebrania na tafsiri yake ya jadi.
lexical_decisions:
- source_word: הֲלוֹא צִוִּיתִיךָ
  choice: Je, si mimi niliyekuamuru?
  rationale: Muundo wa swali la balagha lenye ukanushi unasisitiza kwamba Mungu mwenyewe tayari ametoa amri; Kiswahili hiki huhifadhi swali na msisitizo wake kwa lugha ya kawaida.
- source_word: חֲזַק
  choice: Uwe hodari
  rationale: Amri hii inamtaka Yoshua awe na nguvu na uthabiti; “hodari” ni ya asili katika Kiswahili na inafaa katika jozi ya mawaidha inayofuata.
- source_word: וֶאֱמָץ
  choice: na jasiri
  rationale: Kitenzi hiki huonyesha ujasiri au moyo thabiti. “Jasiri” hutofautisha wazo hilo na nguvu iliyo katika חזק bila kurudia maana ileile.
- source_word: אַל תַּעֲרֹץ
  choice: Usiingiwe na hofu
  rationale: ערץ hubeba wazo lenye nguvu la kutishwa au kuingiwa na hofu. Usemi huu ni wa kawaida na huhifadhi uzito wa woga unaokusudiwa.
- source_word: וְאַל תֵּחָת
  choice: wala usivunjike moyo
  rationale: חתת katika muktadha huu inaweza kumaanisha kufadhaika, kuvunjika moyo, au kudhoofishwa. “Usivunjike moyo” ni usemi wa sasa na wa kawaida unaofaa sambamba na katazo la hofu.
- source_word: כִּי
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya amri zilizotangulia; “kwa maana” ni fasaha na wazi.
- source_word: עִמְּךָ
  choice: yuko pamoja nawe
  rationale: Hueleza kuwapo kwa Mungu pamoja na Yoshua. Usemi huu ni wa asili na mwaminifu kwa maana ya chanzo.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina binafsi la Mungu linatolewa kwa umbo la Kiswahili “Yahwe,” badala ya kubadilishwa kuwa cheo; tanbihi inaeleza utamaduni mwingine wa kulitafsiri.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Ni nomino yenye kiambishi cha nafsi ya pili umoja wa kiume, kwa hiyo tafsiri ya moja kwa moja ni “Mungu wako.”
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: popote uendapo
  rationale: Kirai hiki kina maana ya kila mahali Yoshua atakapoenda. “Popote uendapo” ni Kiswahili cha asili, kifupi, na chenye hadhi.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia Tetragramatoni, jina binafsi la Mungu. “Yahwe” huhifadhi jina hilo, huku tanbihi ikitaja desturi iliyoenea ya kutumia “BWANA.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi, na chenye hadhi. Sentensi fupi huhifadhi nguvu ya amri za Kiebrania. “Popote uendapo” ina mtindo wa kifasihi unaoeleweka kwa urahisi, na “usivunjike moyo” ni usemi wa kawaida usiofungamana na dhehebu.
