translation:
  language: sw
  text: Nao wakamjibu Yoshua, wakisema, “Yote uliyotuamuru tutafanya, na popote utakapotutuma tutakwenda.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: Nao wakamjibu
  rationale: Qal wayyiqtol ya ענה inaendeleza simulizi na kutambulisha jibu; ‘Nao wakamjibu’ ni ya asili na hudumisha kiunganishi cha Kiebrania.
- source_word: אֶת יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Kiashiria cha yambwa אֶת humtaja Yoshua kama anayejibiwa; Kiswahili huonyesha hilo kwa kiambishi cha yambwa katika ‘wakamjibu.’
- source_word: לֵאמֹר
  choice: wakisema
  rationale: Muundo huu wa infinitivu hutambulisha maneno ya moja kwa moja; ‘wakisema’ huhifadhi muundo wa hotuba wa Kiebrania kwa Kiswahili cha kawaida.
- source_word: כֹּל אֲשֶׁר
  choice: Yote
  rationale: Neno hili linaonyesha ujumla wa mambo yaliyoamriwa; ‘Yote’ ni fupi, wazi, na ya asili.
- source_word: צִוִּיתָנוּ
  choice: uliyotuamuru
  rationale: צוה humaanisha kutoa amri; ‘uliyotuamuru’ huonyesha mamlaka ya agizo na kwamba wao ndio walioamriwa.
- source_word: נַעֲשֶׂה
  choice: tutafanya
  rationale: עשה hapa ni kutenda au kutekeleza yaliyoamriwa; ‘tutafanya’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: וְאֶל כָּל אֲשֶׁר
  choice: na popote
  rationale: Pamoja na vitenzi ‘kutuma’ na ‘kwenda,’ kirai hiki kina maana ya mahali popote wanakotumwa; ‘popote’ hutoa maana hiyo kwa Kiswahili cha asili.
- source_word: תִּשְׁלָחֵנוּ
  choice: utakapotutuma
  rationale: שלח ni ‘kutuma’; muundo wa ‘popote utakapotu­tuma’ unaonyesha kwa asili kila mahali pa kupelekwa bila kuongeza maana ya kijeshi isiyo lazima.
- source_word: נֵלֵךְ
  choice: tutakwenda
  rationale: הלך ni kitenzi cha kawaida cha kwenda; ‘tutakwenda’ kinatosha, kwa kuwa mahali panadokezwa tayari na ‘popote.’
