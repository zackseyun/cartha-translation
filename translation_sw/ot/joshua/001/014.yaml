reference: Joshua 1:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: נְשֵׁי/כֶ֣ם טַפְּ/כֶם֮ וּ/מִקְנֵי/כֶם֒ יֵשְׁב֕וּ בָּ/אָ֕רֶץ אֲשֶׁ֨ר נָתַ֥ן לָ/כֶ֛ם מֹשֶׁ֖ה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֩ תַּעַבְר֨וּ חֲמֻשִׁ֜ים לִ/פְנֵ֣י אֲחֵי/כֶ֗ם כֹּ֚ל גִּבּוֹרֵ֣י הַ/חַ֔יִל וַ/עֲזַרְתֶּ֖ם אוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/014.yaml
  text: Your wives[a], your little ones, and your livestock shall remain in the land that Moses gave you beyond the Jordan. But you shall cross over before your brothers, armed, all the mighty men of valor[b], and you shall help them.
translation:
  language: sw
  text: Wake zenu, watoto wenu wadogo, na mifugo yenu watabaki katika nchi ambayo Musa aliwapa ng'ambo ya Yordani. Lakini ninyi nyote, wanaume hodari wa vita, mtavuka mbele ya ndugu zenu[a] mkiwa na silaha[b], na mtawasaidia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli wenzenu.” Kiebrania hutumia neno la kiume la undugu kwa maana wakilishi.
    reason: lexical_alternative
  - marker: b
    text: Au, “mkiwa katika mpangilio wa vita” au “mkiwa mmejiandaa kwa vita.”
    reason: alternative_reading
lexical_decisions:
- source_word: נְשֵׁיכֶם
  choice: wake zenu
  rationale: Katika muktadha huu wa familia na jeshi, neno hili linawahusu wake za wanaume wanaoagizwa kwenda vitani.
- source_word: טַפְּכֶם
  choice: watoto wenu wadogo
  rationale: Neno טַף kwa kawaida humaanisha watoto wadogo au wategemezi; tafsiri hii inadumisha maana yake halisi bila kupanua mno.
- source_word: וּמִקְנֵיכֶם
  choice: na mifugo yenu
  rationale: מִקְנֶה hapa ni wanyama wanaofugwa, si mali kwa ujumla.
- source_word: יֵשְׁבוּ
  choice: watabaki
  rationale: Katika muktadha huu ישב inaonyesha kuendelea kukaa katika eneo walilopewa wakati wapiganaji wakivuka.
- source_word: בָּאָרֶץ
  choice: katika nchi
  rationale: Neno אֶרֶץ hapa linamaanisha nchi au eneo walilopewa makabila hayo.
- source_word: אֲשֶׁר נָתַן לָכֶם מֹשֶׁה
  choice: ambayo Musa aliwapa
  rationale: Kitendo cha kutoa tayari kilikuwa kimetimia katika mtazamo wa simulizi.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ng’ambo ya Yordani
  rationale: Tafsiri hii inadumisha mtazamo wa kijiografia usioelezwa waziwazi na Kiebrania.
- source_word: וְאַתֶּם תַּעַבְרוּ
  choice: Lakini ninyi mtavuka
  rationale: ‘Lakini’ inaonyesha kwa kawaida tofauti kati ya familia zitakazobaki na wapiganaji watakaovuka.
- source_word: חֲמֻשִׁים
  choice: mkiwa na silaha
  rationale: Katika muktadha wa kijeshi, maana inayowezekana zaidi ni kuwa wamejiandaa na silaha kwa ajili ya vita.
- source_word: לִפְנֵי אֲחֵיכֶם
  choice: mbele ya ndugu zenu
  rationale: Inadumisha wazo la kwenda mbele ya Waisraeli wenzao.
- source_word: אֲחֵיכֶם
  choice: ndugu zenu
  rationale: ‘Ndugu’ ni ya kawaida na yenye heshima katika Kiswahili; hapa inawahusu Waisraeli wenzao, kama inavyofafanuliwa katika tanbihi.
- source_word: כֹּל גִּבּוֹרֵי הַחַיִל
  choice: ninyi wanaume wote mashujaa
  rationale: Kirai hiki kinataja wanaume wenye uwezo na uhodari wa kupigana; tafsiri hii ni wazi kwa msomaji wa sasa na inadumisha nguvu ya usemi.
- source_word: וַעֲזַרְתֶּם אוֹתָם
  choice: nanyi mtawasaidia
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya agizo la kuwasaidia Waisraeli wenzao.
theological_decisions:
- issue: Lugha ya undugu katika אֲחֵיכֶם
  choice: ndugu zenu
  alternative: Waisraeli wenzenu
  rationale: Kiebrania kinatumia neno la undugu lenye umbo la kiume kwa maana wakilishi. Matini kuu inadumisha lugha ya undugu, huku tanbihi ikieleza marejeo yake mapana.
- issue: Maana kamili ya חֲמֻשִׁים
  choice: mkiwa na silaha
  alternative: mkiwa katika mpangilio wa vita
  rationale: Maana ya kuwa wamejiandaa kwa silaha inafaa zaidi muktadha, lakini namna kamili ya maandalizi au mpangilio wao wa kijeshi haijulikani kwa uhakika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha tofauti kati ya familia na mifugo wanaobaki na wapiganaji wanaovuka, huku viunganishi na alama za uakifishaji vikifanya mpangilio mrefu wa Kiebrania usomeke kwa urahisi.
