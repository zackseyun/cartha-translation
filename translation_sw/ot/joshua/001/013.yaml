  text: זָכוֹר֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֨ר צִוָּ֥ה אֶתְ/כֶ֛ם מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה לֵ/אמֹ֑ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ מֵנִ֣יחַ לָ/כֶ֔ם וְ/נָתַ֥ן לָ/כֶ֖ם אֶת הָ/אָ֥רֶץ הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/013.yaml
  text: Remember the word that Moses the servant of Yahweh commanded you[a], saying, ‘Yahweh your God is giving you rest and will give you this land.’
translation:
  language: sw
  text: Kumbukeni agizo ambalo Musa, mtumishi wa Yahwe, aliwapa, akisema, “Yahwe Mungu wenu anawapa pumziko na amewapa nchi hii[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atawapa nchi hii.” Kitenzi cha Kiebrania kinaweza kueleweka kuwa wakati ujao uliohakikishwa. Hapa kimetafsiriwa “amewapa” kwa sababu makabila ya mashariki mwa Yordani yalikuwa tayari yamepewa urithi wao.
    reason: alternative_reading
lexical_decisions:
- source_word: זָכוֹר
  choice: Kumbukeni
  rationale: Ni amri ya kukumbuka agizo la awali. Ingawa umbo la Kiebrania ni la umoja, msemaji anawahutubia watu wa makabila kadhaa; wingi wa Kiswahili ni wa kawaida na unaendana na viambishi vya wingi vinavyofuata.
- source_word: הַדָּבָר
  choice: neno
  rationale: דבר hapa ni ujumbe au agizo lililotolewa na Musa. “Neno” huhifadhi upana wa maana bila kurudia nguvu ya kitenzi “aliwaamuru.”
- source_word: צִוָּה אֶתְכֶם
  choice: aliwaamuru
  rationale: Kitenzi kinaonyesha maagizo yenye mamlaka, na kiambishi “-wa-” kinawakilisha walengwa wa wingi.
- source_word: עֶבֶד יְהוָה
  choice: mtumishi wa Yahwe
  rationale: Katika cheo hiki cha heshima kwa Musa, “mtumishi” linafaa kuliko “mtumwa” na linaonyesha huduma yake aliyopewa na Mungu.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limetafsiriwa kwa kulinakili kwa namna iliyo ya kawaida katika Kiswahili, badala ya kulibadilisha kuwa cheo.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Hutambulisha maneno ya moja kwa moja yanayofuata kwa mtindo wa asili wa Kiswahili.
- source_word: אֱלֹהֵיכֶם
  choice: Mungu wenu
  rationale: Huhifadhi nafsi ya pili wingi na uhusiano wa Mungu na wale wanaohutubiwa.
- source_word: מֵנִיחַ לָכֶם
  choice: anawapa pumziko
  rationale: Hiphil participle ina maana ya kusababisha wapumzike au kuwapa hali ya utulivu. “Anawapa pumziko” ni Kiswahili cha kawaida na huhifadhi hali ya tendo linaloendelea.
- source_word: וְנָתַן לָכֶם
  choice: na amewapa
  rationale: Qatal inaweza kueleweka kama tendo lililotimizwa lenye matokeo ya sasa; katika muktadha, makabila ya mashariki mwa Yordani yalikuwa tayari yamepewa eneo lao.
- source_word: הָאָרֶץ הַזֹּאת
  choice: nchi hii
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kirai kinachoonyesha eneo linalozungumziwa.
theological_decisions:
- issue: Uwasilishaji wa jina יהוה
  choice: Yahwe
  alternative: BWANA
  rationale: Maandishi ya Kiebrania yanatumia jina la Mungu moja kwa moja; “Yahwe” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo.
- issue: Wakati na hali ya וְנָתַן
  choice: amewapa nchi hii
  alternative: atawapa nchi hii
  rationale: Umbo la Kiebrania linaweza kufasiriwa kama tendo lililokamilika au wakati ujao uliohakikishwa. Muktadha wa makabila yaliyokwisha pokea urithi mashariki mwa Yordani unaunga mkono “amewapa,” huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sentensi umehifadhi uzito wa agizo bila kuwa mgumu au wa kizamani.
