  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: WLC
  text: כָּל אִ֞ישׁ אֲשֶׁר יַמְרֶ֣ה אֶת פִּ֗י/ךָ וְ/לֹֽא יִשְׁמַ֧ע אֶת דְּבָרֶ֛י/ךָ לְ/כֹ֥ל אֲשֶׁר תְּצַוֶּ֖/נּוּ יוּמָ֑ת רַ֖ק חֲזַ֥ק וֶ/אֱמָֽץ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/018.yaml
  text: Every man who rebels against your command and does not listen to your words in all that you command him shall be put to death[a]. Only be strong and courageous.
translation:
  language: sw
  text: Kila mtu atakayeasi amri yako[a] na asiyeyasikiliza maneno yako katika yote utakayomwamuru atauawa. Ila uwe imara na jasiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kinywa chako.” Nahau ya Kiebrania “kinywa chako” hapa inamaanisha amri yako au neno lako lenye mamlaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ
  choice: Kila mtu
  rationale: Kirai hiki kina maana ya mgawanyo, ‘kila mtu mmoja mmoja.’ ‘Kila mtu’ ni Kiswahili cha kawaida na kinaakisi nguvu hiyo bila kufanya jinsia ya kiume iwe jambo kuu lisilokusudiwa katika muktadha.
- source_word: יַמְרֶה
  choice: atakayeasi
  rationale: Kitenzi hiki kinaonyesha uasi au ukaidi dhidi ya mamlaka, si kutotii kwa kiwango kidogo tu. ‘Atakayeasi’ kinahifadhi uzito huo.
- source_word: אֶת פִּיךָ
  choice: amri yako[a]
  rationale: Kiebrania kinasema kihalisi ‘kinywa chako,’ lakini hapa ni nahau ya neno au agizo lenye mamlaka. ‘Amri yako’ huwasilisha maana hiyo wazi, huku tanbihi ikihifadhi umbo halisi.
- source_word: וְלֹא יִשְׁמַע אֶת דְּבָרֶיךָ
  choice: na kutoyasikiliza maneno yako
  rationale: שׁמע inaweza kumaanisha kusikia, kusikiliza, au kutii. ‘Kuyasikiliza’ huhifadhi tofauti ya kileksia kati ya kutosikiliza na uasi uliotajwa tayari, huku ikidokeza kuitikia kwa utii.
- source_word: לְכֹל אֲשֶׁר תְּצַוֶּנּוּ
  choice: katika yote utakayomwamuru
  rationale: Kirai hiki kinaonyesha upeo kamili wa mambo ambayo Yoshua atamwamuru mtu huyo; tafsiri hii inafuata muundo na maana ya Kiebrania kwa Kiswahili cha kawaida.
- source_word: יוּמָת
  choice: atauawa
  rationale: Umbo la kitenzi ni la kutendwa na linaonyesha adhabu ya kifo iliyowekwa, wala si kufa tu. ‘Atauawa’ huhifadhi nguvu hiyo ya kisheria bila kuongeza utaratibu ambao haukutajwa.
- source_word: רַק
  choice: Ila
  rationale: Hapa רַק inaleta himizo lenye msisitizo baada ya ahadi ya kutekeleza mamlaka ya Yoshua. ‘Ila’ ni mpito mfupi na wa kawaida katika Kiswahili.
- source_word: חֲזַק וֶאֱמָץ
  choice: uwe imara na jasiri
  rationale: Himizo hili linalorudiwa katika Yoshua linahusu nguvu, uthabiti na ujasiri. ‘Uwe imara na jasiri’ ni la asili, lenye hadhi, na linaeleweka kwa urahisi.
theological_decisions:
- issue: Lugha ya uwakilishi na jinsia
  choice: Kila mtu
  alternative: Kila mwanamume; Yeyote
  rationale: אִישׁ ni nomino ya kiume lakini katika muundo huu wa mgawanyo inawakilisha kila aliye chini ya amri. ‘Kila mtu’ ni sahihi kwa maana ya Kiswahili na haiongezi dai kwamba adhabu hiyo iliwahusu wanaume pekee.
- issue: Kauli ya adhabu ya kifo
  choice: atauawa
  alternative: atakufa; ni lazima auawe
  rationale: יוּמָת inaonyesha kifo kinachosababishwa kama adhabu. ‘Atauawa’ huhifadhi kauli ya kutendwa na uzito wa hukumu bila kuongeza lazima ya kisheria au maelezo ya kiutaratibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa wazi na kwa ufupi, huku ikihifadhi uzito wa uasi, adhabu ya kifo, na himizo la mwisho. Alama ya tanbihi [a] iko mara moja katika matini kuu na inaeleza nahau ya Kiebrania.
