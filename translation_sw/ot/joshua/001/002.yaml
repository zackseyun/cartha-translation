  text: מֹשֶׁ֥ה עַבְדִּ֖/י מֵ֑ת וְ/עַתָּה֩ ק֨וּם עֲבֹ֜ר אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֗ה אַתָּה֙ וְ/כָל הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/002.yaml
  text: Moses my servant is dead. So now[a], arise, cross this Jordan—you and all this people—into the land that I am giving to them, to the sons of Israel.
translation:
  language: sw
  text: “Musa, mtumishi wangu, amekufa. Basi sasa inuka, uvuke Yordani hii, wewe na watu hawa wote, kwenda katika nchi ninayowapa wana wa Israeli.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli” au “watoto wa Israeli.” Kiebrania husoma “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדִּי
  choice: mtumishi wangu
  rationale: Neno עֶבֶד linaweza kumaanisha mtumishi au mtumwa; hapa ni cheo cha heshima kinachoeleza uhusiano wa Musa na Mungu, hivyo “mtumishi wangu” ni la kawaida na lenye hadhi katika Kiswahili.
- source_word: מֵת
  choice: amekufa
  rationale: Kauli hii hutaja kifo cha Musa kama ukweli uliotimia na unaohusika moja kwa moja na agizo linalofuata; “amekufa” ni wazi na ya asili katika Kiswahili.
- source_word: וְעַתָּה
  choice: Basi sasa
  rationale: Muunganiko huu unaonyesha mpito wenye matokeo kutoka kwa kifo cha Musa kwenda kwa agizo la Yoshua; “Basi sasa” huhifadhi uhusiano huo.
- source_word: קוּם
  choice: inuka
  rationale: Amri hii inaanzisha hatua ya uamuzi. “Inuka” ni ya asili, yenye nguvu, na inafaa katika agizo la kimungu.
- source_word: עֲבֹר
  choice: uvuke
  rationale: Yordani ikiwa yambwa, kitenzi hiki kinamaanisha kuvuka; umbo “uvuke” linafuata kwa kawaida baada ya “inuka” katika Kiswahili.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: Yordani hii
  rationale: Kiwakilishi kionyeshi cha Kiebrania kimehifadhiwa. “Yordani hii” ni fupi na hakiongezi neno “mto,” ambalo halipo wazi katika kifungu hiki.
- source_word: אַתָּה וְכָל הָעָם הַזֶּה
  choice: wewe pamoja na watu hawa wote
  rationale: Huhifadhi msisitizo wa “wewe” na kiwakilishi kionyeshi, huku “watu hawa wote” ikiwa Kiswahili cha kawaida kwa kundi lote.
- source_word: אֶל הָאָרֶץ
  choice: mwende katika nchi
  rationale: Kwa kuwa mhusika anapanuliwa kutoka Yoshua mmoja hadi Yoshua na watu wote, “mwende” huweka mwendo wa kundi wazi; “katika nchi” huonyesha kuingia ndani ya eneo hilo.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: ninayowapa wao
  rationale: Kitenzi cha hali endelevu נֹתֵן huwasilisha utoaji kama unaoendelea au ulio karibu kutimizwa. “Ninayowapa” huhifadhi hali hiyo, na “wao” huonyesha wazi kiwakilishi cha wingi.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: yaani wana wa Israeli
  rationale: “Wana wa Israeli” huakisi kwa uwazi muundo wa Kiebrania “wana wa Israeli.” “Yaani” hufafanua kwamba kiambishi “wao” kinarejelea kundi hilo bila kuufanya usemi wa Kiswahili kuwa mgumu.
theological_decisions:
- issue: Jina la pamoja lenye jinsia katika לִבְנֵי יִשְׂרָאֵל
  choice: wana wa Israeli
  alternative: Waisraeli; watoto wa Israeli
  rationale: Kiebrania kinatumia wazi nomino ya wingi wa kiume “wana.” Tafsiri inalihifadhi umbo hilo, ingawa katika muktadha linarejelea taifa lote la agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa agizo umewekwa wazi na wa kawaida bila kuondoa msisitizo wa Kiebrania. Alama [a] imewekwa baada ya usemi unaohusika.
