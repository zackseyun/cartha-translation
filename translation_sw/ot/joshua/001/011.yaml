source:
  edition: WLC
  text: עִבְר֣וּ בְּ/קֶ֣רֶב הַֽ/מַּחֲנֶ֗ה וְ/צַוּ֤וּ אֶת הָ/עָם֙ לֵ/אמֹ֔ר הָכִ֥ינוּ לָ/כֶ֖ם צֵידָ֑ה כִּ֞י בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים אַתֶּם֙ עֹֽבְרִים֙ אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֔ה לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם נֹתֵ֥ן לָ/כֶ֖ם לְ/רִשְׁתָּֽ/הּ׀־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/011.yaml
  text: Go through the midst of the camp and command the people[a], saying, ‘Prepare provisions for yourselves, because within three days you are crossing this Jordan to go in to take possession of the land that Yahweh your God is giving you to possess it.’
translation:
  language: sw
  text: 'Piteni katikati ya kambi na kuwaamuru watu hivi: “Jiandalieni chakula cha safari, kwa sababu katika muda wa siku tatu[a] mtavuka mto huu Yordani ili kuingia na kuimiliki nchi ambayo Yahweh, Mungu wenu, anawapa ili muimiliki.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “baada ya siku tatu” au “siku tatu zaidi zikishapita.” Usemi wa Kiebrania unaonyesha muda mfupi uliobaki kabla ya kuvuka; “katika muda wa siku tatu” unaeleza vizuri maana yake hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרוּ בְּקֶרֶב הַמַּחֲנֶה
  choice: Piteni katikati ya kambi
  rationale: Kitenzi cha kuamuru kwa wingi kinaelekeza maofisa wapite miongoni mwa kambi; “katikati ya kambi” kinahifadhi wazo la קֶרֶב bila kufanya Kiswahili kuwa kizito.
- source_word: וְצַוּוּ אֶת הָעָם לֵאמֹר
  choice: na kuwaamuru watu hivi
  rationale: “Kuwaamuru” kinadumisha mamlaka ya צוה, na “hivi” ni njia ya kawaida ya Kiswahili ya kuanzisha maneno yanayonukuliwa.
- source_word: הָכִינוּ לָכֶם צֵידָה
  choice: Jiandalieni chakula cha safari
  rationale: צֵידָה ni chakula au mahitaji ya kuendeleza safari. “Chakula cha safari” ni wazi kwa msomaji wa kawaida, na umbo “jiandalieni” linaonyesha לָכֶם, yaani waandae kwa matumizi yao wenyewe.
- source_word: כִּי בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: kwa sababu katika muda wa siku tatu
  rationale: Usemi huo unaonyesha kipindi kifupi kilichobaki kabla ya kuvuka. Tafsiri hii inaonyesha ukaribu bila kulazimisha maana sahihi kabisa ya “baada ya siku tatu.”
- source_word: אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן הַזֶּה
  choice: mtavuka mto huu Yordani
  rationale: Wakati ujao wa Kiswahili unaeleza kwa kawaida tendo lililo karibu na lenye uhakika; “huu” kinahifadhi kiashiria הַזֶּה, na “mto” hufanya rejeo la Yordani liwe wazi.
- source_word: לָבוֹא לָרֶשֶׁת אֶת הָאָרֶץ
  choice: ili kuingia na kuimiliki nchi
  rationale: “Ili” linaonyesha kusudi la kuingia, na “kuimiliki” linawasilisha nguvu ya ירשׁ katika mazingira ya kuchukua nchi kuwa milki.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, Mungu wenu
  rationale: Jina la agano יְהוָה limetafsiriwa kwa umbo “Yahweh”; koma husaidia Kiswahili kuonyesha kuwa “Mungu wenu” kinafafanua jina hilo.
- source_word: נֹתֵן לָכֶם לְרִשְׁתָּהּ
  choice: anawapa muimiliki
  rationale: “Anawapa” linahifadhi nguvu ya participio ya tendo linaloendelea au lililo hakika, huku “muimiliki” likidumisha kurudiwa kwa mzizi ירשׁ katika kifungu cha Kiebrania.
theological_decisions:
- issue: Uwasilishaji wa jina la Mungu יְהוָה
  choice: Yahweh
  alternative: BWANA / Yehova
  rationale: Maandishi ya Kiebrania yanatumia moja kwa moja jina la agano יהוה. “Yahweh” huhifadhi jina hilo badala ya kulibadilisha kuwa cheo, bila kuingiza msimamo wa dhehebu fulani.
- issue: Nchi kama zawadi ya Mungu na kitu cha kumilikiwa na Israeli
  choice: nchi ambayo Yahweh, Mungu wenu, anawapa muimiliki
  alternative: nchi ambayo Yahweh atawapa
  rationale: Tafsiri inadumisha kwa pamoja utoaji wa Mungu na wajibu wa watu kuingia na kuimiliki, bila kuondoa mvutano uliopo katika maandishi kati ya zawadi ya Mungu na tendo la binadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. “Chakula cha safari” ni cha kawaida zaidi kuliko neno la kiufundi “masurufu,” na marudio ya “kuimiliki ... muimiliki” yamehifadhiwa kwa sababu yanaakisi msisitizo wa maandishi ya Kiebrania.
