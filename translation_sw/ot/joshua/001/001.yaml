  text: וַ/יְהִ֗י אַחֲרֵ֛י מ֥וֹת מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֣עַ בִּן נ֔וּן מְשָׁרֵ֥ת מֹשֶׁ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/001.yaml
  text: 'After the death of Moses[a], the servant of Yahweh, Yahweh said to Joshua son of Nun, the attendant of Moses, saying:'
translation:
  language: sw
  text: 'Baada ya kifo cha Musa, mtumishi wa Yahweh, Yahweh alimwambia Yoshua mwana wa Nuni, mhudumu wa Musa[a], akisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiebrania lililotafsiriwa “mhudumu” linaweza pia kutafsiriwa “msaidizi” au “mtumishi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Baada ya
  rationale: Kishazi cha mwanzo kinaweka mazingira ya simulizi. Kiswahili cha kawaida hakihitaji kutafsiri וַיְהִי kwa maneno tofauti kama “ikawa”; mpito wake umebebwa kwa kuanza na kishazi cha wakati.
- source_word: אַחֲרֵי מוֹת מֹשֶׁה
  choice: Baada ya kifo cha Musa
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya kishazi cha wakati.
- source_word: עֶבֶד יְהוָה
  choice: mtumishi wa Yahweh
  rationale: Katika cheo hiki cha heshima cha Musa, “mtumishi” huonyesha huduma yake rasmi kwa Mungu bila kusisitiza hali ya utumwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Jina la Mungu limetoholewa moja kwa moja badala ya kubadilishwa kuwa cheo kama “BWANA”.
- source_word: וַיֹּאמֶר
  choice: alimwambia
  rationale: Kitenzi אמר kinamaanisha kusema; pamoja na yambwa ya mtu, “alimwambia” ni Kiswahili cha kawaida na sahihi.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yoshua mwana wa Nuni
  rationale: Majina yametoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili, na patronimia imehifadhiwa.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: mhudumu wa Musa
  rationale: “Mhudumu” huhifadhi maana ya mtu aliyemhudumia au kumsaidia Musa bila kuingiza maana ya cheo cha kanisa; uwezekano mwingine umeonyeshwa katika tanbihi.
- source_word: לֵאמֹר
  choice: 'akisema:'
  rationale: Neno hili linatanguliza hotuba inayofuata. “Akisema:” hulihifadhi wazi, ingawa katika Kiswahili cha kisasa koloni pekee pia lingeweza kutekeleza kazi hiyo.
theological_decisions:
- issue: Jinsi ya kutafsiri jina יְהוָה
  choice: Yahweh
  alternative: BWANA; Yehova
  rationale: Matini ina jina maalumu la Mungu, si cheo. “Yahweh” hulihifadhi kama jina bila kulibadilisha kuwa “BWANA”.
- issue: Maana ya עֶבֶד katika cheo cha Musa
  choice: mtumishi
  alternative: mtumwa
  rationale: Katika kirai עֶבֶד יְהוָה, neno hilo ni cheo cha heshima kinachoeleza huduma na uaminifu wa Musa kwa Mungu; “mtumwa” lingesisitiza isivyofaa hali ya kufungwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa sasa, na unaoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi apposition za Musa na Yoshua, huku ukiepuka usemi wa kizamani “ikawa.”
