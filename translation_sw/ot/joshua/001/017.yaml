  text: כְּ/כֹ֤ל אֲשֶׁר שָׁמַ֨עְנוּ֙ אֶל מֹשֶׁ֔ה כֵּ֖ן נִשְׁמַ֣ע אֵלֶ֑י/ךָ רַ֠ק יִֽהְיֶ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/017.yaml
  text: Just as we listened to Moses in everything[a], so we will listen to you. Only may Yahweh your God be with you, just as he was with Moses.
translation:
  language: sw
  text: Kama tulivyomsikiliza Musa katika kila jambo[a], ndivyo tutakavyokusikiliza wewe. Ila Yahwe, Mungu wako, awe pamoja nawe, kama alivyokuwa pamoja na Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kama tulivyomtii Musa katika kila jambo, ndivyo tutakavyokutii wewe.” Kitenzi cha Kiebrania שׁמע kinaweza kumaanisha “kusikiliza” au “kutii,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ / נִשְׁמַע
  choice: tulivyomsikiliza / tutakavyokusikiliza
  rationale: Kitenzi שׁמע pamoja na אֶל kinaweza kumaanisha kumsikiliza mtu kwa kuitikia, huku mara nyingi kikidokeza utii. “Kusikiliza” huhifadhi upana huo wa maana bila kuufanya utii kuwa maana pekee.
- source_word: כְּכֹל אֲשֶׁר
  choice: kama ... katika kila jambo
  rationale: Muundo huu unaonyesha ulinganisho wenye upeo kamili. Tafsiri hii inahifadhi ulinganisho na wazo la mambo yote kwa Kiswahili cha kawaida.
- source_word: רַק
  choice: Ila
  rationale: Hapa רַק inaleta sharti au tamko la kutamani linaloambatana na ahadi yao. “Ila” ni ya asili na inaonyesha kikomo hicho bila kudokeza upinzani mkali.
- source_word: יִהְיֶה
  choice: na awe
  rationale: Baada ya רַק, umbo hili linaeleweka vizuri kama ombi au tamanio, si utabiri rahisi wa wakati ujao.
- source_word: יְהוָה
  choice: Yahwe
  rationale: Jina la Mungu limeandikwa moja kwa moja kama jina binafsi badala ya kubadilishwa kuwa cheo; “Yahwe” ni umbo linalofaa katika tahajia ya Kiswahili.
- source_word: אֱלֹהֶיךָ
  choice: Mungu wako
  rationale: Ni nomino katika hali ya kutegemeana yenye kiambishi cha nafsi ya pili, umoja wa kiume.
- source_word: עִמָּךְ / עִם
  choice: pamoja nawe / pamoja na Musa
  rationale: עִם huonyesha kuwapo au kushirikiana. “Pamoja na” ni usemi wa kawaida unaofaa katika muktadha wa uwepo wa Mungu.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: Neno hili linaanzisha ulinganisho kati ya uwepo wa Yahwe pamoja na Yoshua na uwepo wake pamoja na Musa.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la Mungu יְהוָה
  choice: Yahwe
  alternative: BWANA / Yehova
  rationale: Andiko linatumia Tetragramatoni kama jina la Mungu. “Yahwe” hulihifadhi kama jina binafsi kwa tahajia ya Kiswahili badala ya kulibadilisha kuwa cheo.
- issue: Maana ya שׁמע katika ahadi ya watu
  choice: kusikiliza, pamoja na kidokezo cha kutii
  alternative: kutii
  rationale: Neno linaweza kujumuisha kusikia kwa kuitikia na kutii. Maandishi makuu yanahifadhi upana huo, na tanbihi inaeleza maana mbadala ya wazi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kusomeka kwa sauti; “Ila” na “na awe” huhifadhi sifa ya sharti au tamanio katika sehemu ya pili.
