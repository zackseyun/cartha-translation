base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/006.yaml
  text: Be strong and courageous[b][a], for you shall cause this people to inherit the land that I swore to their fathers to give to them.
translation:
  language: sw
  text: Uwe hodari na moyo mkuu, kwa maana utawafanya watu hawa wairithi[a] nchi ambayo niliwaapia baba zao kuwa nitawapa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utawapa watu hawa nchi iwe urithi wao.” Kitenzi cha Kiebrania ni cha kisababishi, yaani, kuwafanya waipokee nchi kuwa urithi.
    reason: lexical_alternative
  - marker: b
    text: Usemi “baba zao” hapa unarejelea wahenga wa Israeli, hasa wazee wa ukoo; pia unaweza kutafsiriwa “mababu zao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק
  choice: Uwe hodari
  rationale: Kitenzi cha amri katika umoja wa kiume kinatoa wito wa kuwa na nguvu na uthabiti. “Uwe hodari” ni Kiswahili cha kawaida, chenye heshima, na kinafaa katika jozi hii ya maneno.
- source_word: וֶאֱמָץ
  choice: na jasiri
  rationale: Katika muungano wake na חזק, neno hili linaonyesha ujasiri na uthabiti wa moyo. “Na jasiri” huhifadhi nguvu ya amri kwa lugha ya sasa.
- source_word: כִּי
  choice: kwa maana
  rationale: Hutambulisha sababu ya amri iliyotangulia; “kwa maana” huonyesha wazi uhusiano huo wa kisababishi.
- source_word: תַּנְחִיל
  choice: utawafanya ... wairithi
  rationale: Hifili ya נחל ina maana ya kisababishi. Tafsiri hii inaonyesha kwamba Yoshua atasababisha watu waingie katika umiliki wa nchi kama urithi, bila kumfanya yeye kuwa chanzo cha ahadi.
- source_word: הָעָם הַזֶּה
  choice: watu hawa
  rationale: Kiswahili hutumia umbo la wingi kwa kawaida linaporejelea kundi hili la watu, huku maana ya taifa la Israeli ikibaki wazi katika muktadha.
- source_word: הָאָרֶץ
  choice: nchi
  rationale: Katika muktadha wa agano katika Yoshua, neno hili linarejelea nchi iliyoahidiwa; “nchi” ndilo neno la kawaida na linalofaa.
- source_word: נִשְׁבַּעְתִּי
  choice: niliyowaapia
  rationale: Huhifadhi wazi wazo la kiapo cha Mungu kwa mababu, badala ya kulifanya kuwa ahadi isiyotajwa kuwa ya kiapo.
- source_word: לַאֲבוֹתָם
  choice: baba zao
  rationale: Hili ndilo linalolingana moja kwa moja na umbo la kiume la Kiebrania na hapa linarejelea hasa mababu wa Israeli waliohusishwa na ahadi ya agano.
- source_word: לָתֵת לָהֶם
  choice: kwamba nitawapa
  rationale: Hueleza kwa Kiswahili cha kawaida yaliyomo katika kiapo, huku kiwakilishi cha wingi kikihifadhiwa.
theological_decisions:
- issue: Rejeo la agano katika לַאֲבוֹתָם
  choice: baba zao
  alternative: mababu zao
  rationale: “Baba zao” huhifadhi umbo la kiume la maandishi na uhusiano wake na mababa wa agano. “Mababu zao” ni pana zaidi na inaweza kujumuisha wahenga kwa ujumla, kwa hiyo imewekwa kama ufafanuzi mbadala.
- issue: Jukumu la Yoshua katika תַּנְחִיל
  choice: utawafanya watu hawa wairithi
  alternative: utawapa watu hawa nchi iwe urithi wao
  rationale: Umbo la kisababishi linaonyesha jukumu la Yoshua la kuwaingiza watu katika urithi bila kudokeza kwamba yeye ndiye mwenye asili wa zawadi hiyo; Mungu ndiye aliyeapa kuitoa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Uwe hodari na jasiri” ni wito mfupi na wa moja kwa moja; “utawafanya ... wairithi” huhifadhi kisababishi cha Kiebrania huku sentensi ikiendelea kueleweka kwa msomaji wa kawaida.
