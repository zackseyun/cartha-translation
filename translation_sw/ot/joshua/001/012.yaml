  source_fidelity: Tafsiri inawakilisha kwa uaminifu makundi matatu yanayolengwa—Wareubeni, Wagadi, na nusu ya kabila la Manase—na tendo la Yoshua la kusema nao. “Akawaambia” ni ufasiri halali na wa wazi wa אמר katika muktadha huu, ingawa Kiswahili hubainisha walengwa ambao tayari wametajwa.
