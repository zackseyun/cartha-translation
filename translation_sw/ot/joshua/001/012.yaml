  terminology: Majina “Yoshua,” “Wareubeni,” “Wagadi,” na “Manase” yanaendana na matumizi ya kawaida ya Kiswahili cha Biblia. “Nusu ya kabila la Manase” ni wazi na inahifadhi maana ya חֲצִי שֵׁבֶט. Tanbihi inaeleza kwa usahihi kazi ya לֵאמֹר, ambayo imeachwa katika maandishi kwa mtindo wa Kiswahili.
