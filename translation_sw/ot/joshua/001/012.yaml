  text: וְ/לָ/רֽאוּבֵנִי֙ וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֑ה אָמַ֥ר יְהוֹשֻׁ֖עַ לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/012.yaml
  text: And to the Reubenites[a], and to the Gadites, and to the half-tribe of Manasseh, Joshua said,
translation:
  language: sw
  text: Yoshua akawaambia Wareubeni, Wagadi, na nusu ya kabila la Manase,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiebrania: “akisema.” Neno hili linatanguliza maneno ya Yoshua yanayoendelea katika mstari unaofuata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לָ/רֽאוּבֵנִי
  choice: Wareubeni
  rationale: Nomino ya Kiebrania iko katika umoja lakini inatumika kwa maana ya kundi; wingi wa Kiswahili unaonyesha kwa kawaida watu wa Reubeni waliokuwa wakizungumziwa.
- source_word: וְ/לַ/גָּדִי
  choice: Wagadi
  rationale: Kama ilivyo kwa Wareubeni, umbo la Kiebrania la umoja lina maana ya jumla; “Wagadi” ni namna ya kawaida ya kutaja kundi hilo.
- source_word: וְ/לַ/חֲצִי שֵׁבֶט הַֽ/מְנַשֶּׁה
  choice: na nusu ya kabila la Manase
  rationale: Hili linafuata kwa karibu muundo wa Kiebrania, “nusu ya kabila la Manase,” na ni la kawaida na wazi katika Kiswahili.
- source_word: אָמַר
  choice: akawaambia
  rationale: Kitenzi אמר maana yake ni “alisema”; kiambishi cha watendewa “-wa-” kinaeleza kwa Kiswahili kwamba Yoshua alisema maneno kwa makundi yaliyotajwa, huku “aka-” ikiunganisha tendo hili na simulizi linalotangulia.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Jina limetolewa kwa umbo la Kiswahili linalotumika kwa kawaida.
- source_word: לֵ/אמֹר
  choice: ','
  rationale: Neno hili la Kiebrania, kihalisi “akisema,” linatanguliza maneno ya moja kwa moja yanayoanza katika mstari unaofuata; alama ya koma inaleta kazi hiyo kwa Kiswahili cha kawaida bila urudiaji usio wa lazima.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na rahisi kueleweka. Majina ya makundi yametolewa kwa wingi wa kawaida wa Kiswahili, na sentensi imeachwa wazi ili iendelee moja kwa moja katika mstari unaofuata.
