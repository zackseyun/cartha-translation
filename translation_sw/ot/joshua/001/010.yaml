lexical_decisions:
- source_word: וַיְצַו
  choice: Kisha ... akawaamuru
  rationale: Wayyiqtol ya צוה inaendeleza simulizi kwa hatua inayofuata; “Kisha” huonyesha mfuatano kwa Kiswahili cha kawaida, na “akawaamuru” huhifadhi uzito wa agizo.
- source_word: יְהוֹשֻׁעַ
  choice: Yoshua
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
- source_word: אֶת
  choice: '[halijatafsiriwa kando]'
  rationale: Ni kiashiria cha yambwa mahsusi kisicho na neno linalolingana nacho moja kwa moja katika Kiswahili; kazi yake inaonekana katika “maofisa” kuwa yambwa wa “akawaamuru”.
- source_word: שֹׁטְרֵי
  choice: maofisa
  rationale: שֹׁטֵר humaanisha maofisa au wasimamizi wa kiutawala, si makamanda wa kijeshi; “maofisa” huhifadhi maana hiyo rasmi bila kutumia neno pana mno kama “viongozi”.
- source_word: הָעָם
  choice: wa watu
  rationale: עָם hapa ni jumuiya ya watu waliokusanyika; “watu” ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: לֵאמֹר
  choice: akisema
  rationale: Fomula hii ya Kiebrania inaanzisha maneno ya moja kwa moja yanayofuata; “akisema” huweka wazi kiungo hicho cha usemi.
