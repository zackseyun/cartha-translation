  text: Every place on which the sole of your foot treads[a], I have given to you, just as I spoke to Moses.
translation:
  language: sw
  text: Kila mahali ambapo nyayo za miguu yenu zitakanyaga, nimewapa mahali hapo, kama nilivyomwambia Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל מָקוֹם
  choice: Kila mahali
  rationale: Muundo huu una maana ya kugawa kwa kila sehemu moja baada ya nyingine; “kila mahali” ni Kiswahili cha kawaida na huhifadhi upana wa ahadi.
- source_word: אֲשֶׁר ... בּוֹ
  choice: ambapo
  rationale: Kiwakilishi cha uhusiano pamoja na בּוֹ hurejelea mahali panapokanyagwa. “Ambapo” ni cha asili katika Kiswahili na huepuka urudiaji mzito wa “mahali ... humo.”
- source_word: תִּדְרֹךְ
  choice: zitakanyaga
  rationale: Kitenzi דרך huonyesha kukanyaga au kuweka mguu juu ya ardhi. Wakati ujao ni wa asili katika kishazi cha Kiswahili kinachoeleza eneo litakalofikiwa, bila kubadili ukamilifu wa tendo la kutoa katika kishazi kikuu.
- source_word: כַּף רַגְלְכֶם
  choice: nyayo za miguu yenu
  rationale: כַּף רֶגֶל humaanisha sehemu ya chini ya mguu. “Nyayo za miguu yenu” huhifadhi taswira halisi na pia wingi wa kiambishi cha Kiebrania.
- source_word: לָכֶם נְתַתִּיו
  choice: nimewapa
  rationale: Kiswahili huruhusu kitu kinachotolewa kueleweka kutokana na “kila mahali,” huku -wa- ikionyesha wapokeaji wa wingi. “Nimewapa” huhifadhi hali timilifu ya נְתַתִּיו na uhakika wa utoaji.
- source_word: כַּאֲשֶׁר
  choice: kama
  rationale: “Kama” huonyesha ulinganifu na kauli ya awali kwa Mose kwa njia ya kawaida na yenye hadhi.
- source_word: דִּבַּרְתִּי אֶל מֹשֶׁה
  choice: nilivyomwambia Mose
  rationale: דבר אל ni kusema au kunena kwa mtu. Katika sentensi hii, “nilivyomwambia Mose” ni Kiswahili cha asili bila kuongeza wazi kwamba ilikuwa ahadi.
theological_decisions:
- issue: Hali ya utoaji wa nchi
  choice: nimewapa
  alternative: nitawapa
  rationale: Kauli timilifu ya Kiebrania נְתַתִּיו huwasilisha utoaji kuwa tayari umeamuliwa na kutolewa kwa uhakika, ingawa kuimiliki kungetokea katika historia. Tafsiri ya wakati ujao ingefifisha nguvu hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nyayo za miguu yenu” huhifadhi taswira ya Kiebrania; “nimewapa” ni fupi na ya kawaida, huku kitu kilichotolewa kikieleweka kutokana na “kila mahali.”
